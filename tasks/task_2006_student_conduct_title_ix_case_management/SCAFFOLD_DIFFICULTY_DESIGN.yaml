          trigger:
            - call: "POST /api/determinations/${det_id}/issue"
              payload: { sanction_selections: [ { sanction_type: "RESTITUTION", restitution_items: [ { description: "Laptop repair", amount_dollars: 300.00 }, { description: "Medical copay", amount_dollars: 250.00 } ] } ] }
              as: DecisionMaker
              as_user_id: "${dm_id}"
              captures: { fin_score: $.data.final_severity_score, fin_tier: $.data.final_tier }
            - { call: "GET /api/determinations/${det_id}/sanctions", as: TitleIXCoordinator, as_user_id: "${coord_id}", captures: { rest_cents: "$.data[0].applied_restitution_cents" } }
          assert:
            - "Determination.${det_id}.final_severity_score == 55 (matrix only; restitution points tracked via tier)"
            - "Sanction.applied_restitution_cents == 50000 - items 30000+25000=55000 clamped to the TIER_3 cap 50000, NOT the TIER_4 cap 250000, because the cap is fixed at cap_tier=tier(55)=TIER_3 before restitution points land"
            - "Determination.${det_id}.final_tier == TIER_4 (55 + floor(50000/100)=500 -> 555 >= 75) - evaluation order makes the tier jump possible while the cap stays TIER_3"

      - name: avg_resolution_days_nested_rounding_mode_b
        grounds:
          - calculations.calc_avg_resolution_days
          - calculations.calc_annual_statistics
        distinguishing_aspect: |
          Mode (b) - nested rounding where order matters: per-case durations are floored to whole days
          FIRST (1.5d->1, 1.5d->1, 2.4d->2), then averaged (4/3=1.333...), then round_half_up to one
          decimal -> 1.3; the forbidden reverse order (average exact durations 1.8 then round) would
          report 1.8, so the pinned order is observable in the output.
        test_recipe:
          setup:
            - "Three cases received and dismissed at clock-controlled instants: 1.5d, 1.5d, 2.4d resolution spans, all in calendar 2026"
          setup_api_calls:
            - { call: "POST /api/party-profiles", payload: { full_name: "Comp One", university_id: "U-C-1", role_type: "STUDENT", email: "c1@example.edu" }, as: CaseAdministrator, captures: { comp_id: $.data.id } }
