  - section: calculations
    instances:
      - name: classification_summary_returns_the_systematic_random_statistics_for_five_clean_samples
        claim_type: correct_result
        grounds:
          - calculations.area_water_quality_statistics
          - calculations.area_eligible_classification
          - endpoints[GET /shellfish/growing-areas/{id}/classification-summary]
        distinguishing_aspect: |
          Five identical MPN-2 samples exercise every rounding step of the six-step statistic with a
          hand-checkable answer: per-sample log 0.3010, mean_log10 0.3010, geometric mean 2.0,
          sd exactly 0.0000 (n-1 denominator over identical logs) and therefore p90 == geometric mean
          == 2.0, which is APPROVED on both limbs.
        test_recipe:
          setup:
            - "GrowingArea GA-114 with default configuration (clean_sample_mpn_limit 14.0)."
            - "Five ACCEPTED WaterSamples at station ST-1 with fecal_coliform_mpn 2, collected 2026-07-01 through 2026-07-05 at 09:00:00Z (one per calendar date, so none supersedes another)."
            - "accepted_sample_count is 5, exactly MIN_SAMPLES_FOR_DECISION, so the window is decision-capable."
          setup_api_calls:
            - call: "POST /shellfish/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ShellfishControlAuthority
            - call: "POST /shellfish/growing-areas"
              payload: { code: "GA-114", water_body: "Pamlico Sound", rainfall_closure_threshold_in: 1.0, rainfall_closure_hours: 96, reopen_sample_count_required: 3, clean_sample_mpn_limit: 14.0, conditional_management_plan_on_file: false }
              as: ShellfishControlAuthority
              captures: { area: $.data.id }
            - call: "POST /shellfish/growing-areas/${area}/water-samples"
              payload: { station_code: "ST-1", collected_at: "2026-07-01T09:00:00Z", fecal_coliform_mpn: 2, water_temp_c: 24.0, salinity_ppt: 30.0 }
              as: ShellfishControlAuthority
            - call: "POST /shellfish/growing-areas/${area}/water-samples"
              payload: { station_code: "ST-1", collected_at: "2026-07-02T09:00:00Z", fecal_coliform_mpn: 2, water_temp_c: 24.0, salinity_ppt: 30.0 }
              as: ShellfishControlAuthority
            - call: "POST /shellfish/growing-areas/${area}/water-samples"
              payload: { station_code: "ST-1", collected_at: "2026-07-03T09:00:00Z", fecal_coliform_mpn: 2, water_temp_c: 24.0, salinity_ppt: 30.0 }
              as: ShellfishControlAuthority
            - call: "POST /shellfish/growing-areas/${area}/water-samples"
              payload: { station_code: "ST-1", collected_at: "2026-07-04T09:00:00Z", fecal_coliform_mpn: 2, water_temp_c: 24.0, salinity_ppt: 30.0 }
              as: ShellfishControlAuthority
            - call: "POST /shellfish/growing-areas/${area}/water-samples"
              payload: { station_code: "ST-1", collected_at: "2026-07-05T09:00:00Z", fecal_coliform_mpn: 2, water_temp_c: 24.0, salinity_ppt: 30.0 }
              as: ShellfishControlAuthority
          trigger:
            - call: "GET /shellfish/growing-areas/${area}/classification-summary"
              payload: {}
              as: ShellfishControlAuthority
          assert:
            - "HTTP 200 with response_type == \"object\""
            - "data.variant == SYSTEMATIC_RANDOM (the default when no variant is supplied)"
            - "data.sample_count == 5"
            - "data.mean_log10 == 0.3010"
            - "data.geometric_mean_mpn == 2.0"
            - "data.p90_mpn == 2.0 (sd_log is 0.0000 so the P90_Z 1.28 term contributes nothing)"
            - "data.eligible_classification == APPROVED"
            - "data.window_start_at == 2026-07-01T09:00:00Z and data.window_end_at == 2026-07-05T09:00:00Z"
            - "GET /shellfish/growing-areas/${area} reports the same persisted geometric_mean_mpn 2.0, p90_mpn 2.0 and eligible_classification APPROVED, with classification still APPROVED and harvest_status still OPEN"

      - name: superseded_samples_are_excluded_from_the_statistics_window
        claim_type: input_set_filtering
        grounds:
          - calculations.area_water_quality_statistics
          - calculations.area_eligible_classification
          - entities.WaterSample.fields.sample_status
          - state_machines[GrowingArea.classification APPROVED -> RESTRICTED via the sample sweep]
        distinguishing_aspect: |
          Re-sampling ST-1 on 2026-07-05 with MPN 900 replaces the earlier MPN-2 row rather than
          adding to it, so n stays 5 and the window becomes {2,2,2,2,900}: geometric mean 6.8 with
          p90 224.0 makes eligible_classification RESTRICTED, yet the sample sweep does NOT fire
          because the sweep triggers on the geometric mean alone (6.8 is not > 14.0) — the area is
          still APPROVED and OPEN with a RESTRICTED eligibility.
        test_recipe:
          setup:
            - "GrowingArea GA-114 with default configuration."
            - "Five ACCEPTED MPN-2 samples at ST-1 collected 2026-07-01..2026-07-05 at 09:00:00Z; geometric_mean_mpn 2.0, p90_mpn 2.0, eligible_classification APPROVED."
          setup_api_calls:
            - call: "POST /shellfish/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ShellfishControlAuthority
            - call: "POST /shellfish/growing-areas"
              payload: { code: "GA-114", water_body: "Pamlico Sound", rainfall_closure_threshold_in: 1.0, rainfall_closure_hours: 96, reopen_sample_count_required: 3, clean_sample_mpn_limit: 14.0, conditional_management_plan_on_file: false }
              as: ShellfishControlAuthority
              captures: { area: $.data.id }
            - call: "POST /shellfish/growing-areas/${area}/water-samples"
              payload: { station_code: "ST-1", collected_at: "2026-07-01T09:00:00Z", fecal_coliform_mpn: 2, water_temp_c: 24.0, salinity_ppt: 30.0 }
              as: ShellfishControlAuthority
            - call: "POST /shellfish/growing-areas/${area}/water-samples"
              payload: { station_code: "ST-1", collected_at: "2026-07-02T09:00:00Z", fecal_coliform_mpn: 2, water_temp_c: 24.0, salinity_ppt: 30.0 }
              as: ShellfishControlAuthority
            - call: "POST /shellfish/growing-areas/${area}/water-samples"
              payload: { station_code: "ST-1", collected_at: "2026-07-03T09:00:00Z", fecal_coliform_mpn: 2, water_temp_c: 24.0, salinity_ppt: 30.0 }
              as: ShellfishControlAuthority
            - call: "POST /shellfish/growing-areas/${area}/water-samples"
              payload: { station_code: "ST-1", collected_at: "2026-07-04T09:00:00Z", fecal_coliform_mpn: 2, water_temp_c: 24.0, salinity_ppt: 30.0 }
              as: ShellfishControlAuthority
            - call: "POST /shellfish/growing-areas/${area}/water-samples"
              payload: { station_code: "ST-1", collected_at: "2026-07-05T09:00:00Z", fecal_coliform_mpn: 2, water_temp_c: 24.0, salinity_ppt: 30.0 }
              as: ShellfishControlAuthority
          trigger:
            - call: "POST /shellfish/growing-areas/${area}/water-samples"
              payload: { station_code: "ST-1", collected_at: "2026-07-05T15:00:00Z", fecal_coliform_mpn: 900, water_temp_c: 24.0, salinity_ppt: 30.0 }
              as: ShellfishControlAuthority
            - call: "GET /shellfish/growing-areas/${area}/classification-summary"
              payload: {}
              as: ShellfishControlAuthority
          assert:
            - "The sample POST returns HTTP 201 with data.sample_status == ACCEPTED"
            - "The summary reports sample_count == 5 (not 6: the 2026-07-05T09:00:00Z MPN-2 row is now SUPERSEDED)"
            - "mean_log10 == 0.8316, geometric_mean_mpn == 6.8, p90_mpn == 224.0"
            - "eligible_classification == RESTRICTED (geometric mean 6.8 <= 14.0 passes but p90 224.0 > 43.0 fails the APPROVED limb, and 6.8 <= 88.0 with 224.0 <= 260.0 lands on RESTRICTED)"
            - "GET /shellfish/growing-areas/${area} reports classification == APPROVED and harvest_status == OPEN — the sweep never fired"
            - "GET /shellfish/growing-areas/${area} reports accepted_sample_count == 5 and eligible_classification == RESTRICTED"
            - "GET /shellfish/growing-areas/${area}/water-samples?sample_status=SUPERSEDED returns total_count == 1"

