  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: grade_revision_four_hop_cascade
        grounds:
          - state_machines.CarbideGrade.QUALIFIED_to_DRAFT
          - state_machines.ToolProduct.RELEASED_to_RESTRICTED
          - state_machines.ToolProduct.STOCKED_to_MAKE_TO_ORDER
          - state_machines.ToolOrder.CONFIRMED_to_ENGINEERING_REVIEW
          - calculations.engineering_lead_time_days
        distinguishing_aspect: |
          Depth 4: revising the carbide grade (hop 1: grade QUALIFIED -> DRAFT, revision 1 -> 2)
          restricts every dependent product (hop 2: RELEASED -> RESTRICTED), flips that product's
          independent supply dimension and re-derives its lead time through the constraint-propagation
          formula (hop 3: STOCKED -> MAKE_TO_ORDER, 6 -> 12 days), and finally drags the already
