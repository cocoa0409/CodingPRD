        distinguishing_aspect: "A WINTER bank at a station whose season_code is SUMMER returns ERR_SEASON_MISMATCH with HTTP 409 and creates nothing."
        test_recipe:
          setup:
            - "Station ZRH is OPEN with season_code SUMMER."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-04-01T00:00:00Z" }
              as: StationManager
            - call: "POST /stations"
              payload: { iata_code: "ZRH", name: "Zurich", handler_code: "SWP", season_code: "SUMMER" }
              as: StationManager
              captures: { st_id: $.data.id }
            - call: "POST /stations/${st_id}/lifecycle"
              payload: { action: "OPEN" }
              as: StationManager
          trigger:
            - call: "POST /flight-banks"
              payload: { station_id: "${st_id}", bank_code: "W1", season_code: "WINTER", window_start: "2026-04-10T04:00:00Z", window_end: "2026-04-10T22:00:00Z", planned_headcount: 1 }
              as: DutyOfficer
              captures: { err: $.data.error_id }
            - call: "GET /flight-banks"
              payload: { station_id: "${st_id}" }
              as: DutyOfficer
          assert:
            - "${err} == ERR_SEASON_MISMATCH"
            - "HTTP status is 409"
            - "the filtered flight-bank list returns 0 elements with total_count 0"

      - name: staffing_submit_on_draft_bank_returns_bank_not_published
        claim_type: violation_to_error
        grounds:
          - state_machines.FlightBank.DRAFT_to_SUBMITTED
          - validations[priority=11]
          - errors[ERR_BANK_NOT_PUBLISHED]
        distinguishing_aspect: "The staffing axis is gated on the publication axis: SUBMIT while bank_status is DRAFT returns ERR_BANK_NOT_PUBLISHED with HTTP 409, and staffing_status stays DRAFT."
        test_recipe:
          setup:
            - "Station ZRH is OPEN with FlightBank AM1 in bank_status DRAFT and one TOWING_ONLY turn."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-04-01T00:00:00Z" }
              as: StationManager
            - call: "POST /stations"
              payload: { iata_code: "ZRH", name: "Zurich", handler_code: "SWP", season_code: "SUMMER" }
              as: StationManager
              captures: { st_id: $.data.id }
            - call: "POST /stations/${st_id}/lifecycle"
              payload: { action: "OPEN" }
              as: StationManager
            - call: "POST /flight-banks"
              payload: { station_id: "${st_id}", bank_code: "AM1", season_code: "SUMMER", window_start: "2026-04-10T04:00:00Z", window_end: "2026-04-10T22:00:00Z", planned_headcount: 1 }
              as: DutyOfficer
              captures: { fb_id: $.data.id }
            - call: "POST /turns"
              payload: { station_id: "${st_id}", flight_bank_id: "${fb_id}", flight_number: "LX318", turn_type: "TOWING_ONLY", scheduled_in: "2026-04-10T06:00:00Z", scheduled_out: "2026-04-10T06:20:00Z" }
              as: DutyOfficer
          trigger:
            - call: "POST /flight-banks/${fb_id}/staffing-transitions"
              payload: { action: "SUBMIT" }
              as: DutyOfficer
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_BANK_NOT_PUBLISHED"
            - "HTTP status is 409"
            - "FlightBank.${fb_id}.bank_status == DRAFT"
            - "FlightBank.${fb_id}.staffing_status == DRAFT"

      - name: billing_line_for_a_cancelled_turn_returns_turn_not_billable
        claim_type: conditional_validation
        grounds:
          - validations[priority=10]
          - errors[ERR_TURN_NOT_BILLABLE]
          - state_machines.Turn.SCHEDULED_to_CANCELLED
        distinguishing_aspect: "A CANCELLED turn is not billable, so POST /billing-lines returns ERR_TURN_NOT_BILLABLE with HTTP 422 and the period's line_count stays 0."
        test_recipe:
          setup:
            - "Station ZRH is OPEN with one turn that was created SCHEDULED and then CANCELLED."
            - "BillingPeriod 2026-04 is OPEN with no lines."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-04-01T00:00:00Z" }
              as: StationManager
            - call: "POST /stations"
              payload: { iata_code: "ZRH", name: "Zurich", handler_code: "SWP", season_code: "SUMMER" }
              as: StationManager
              captures: { st_id: $.data.id }
            - call: "POST /stations/${st_id}/lifecycle"
              payload: { action: "OPEN" }
              as: StationManager
            - call: "POST /flight-banks"
              payload: { station_id: "${st_id}", bank_code: "AM1", season_code: "SUMMER", window_start: "2026-04-10T04:00:00Z", window_end: "2026-04-10T22:00:00Z", planned_headcount: 1 }
              as: DutyOfficer
              captures: { fb_id: $.data.id }
            - call: "POST /turns"
              payload: { station_id: "${st_id}", flight_bank_id: "${fb_id}", flight_number: "LX318", turn_type: "TOWING_ONLY", scheduled_in: "2026-04-10T06:00:00Z", scheduled_out: "2026-04-10T06:20:00Z" }
              as: DutyOfficer
              captures: { t_id: $.data.id }
            - call: "POST /turns/${t_id}/lifecycle"
              payload: { action: "CANCEL", reason: "SLOT_WITHDRAWN" }
              as: DutyOfficer
              captures: { t_status: $.data.status }
            - call: "POST /billing-periods"
              payload: { station_id: "${st_id}", period_code: "2026-04", window_start: "2026-04-01T00:00:00Z", window_end: "2026-04-30T23:59:00Z" }
              as: BillingController
              captures: { bp_id: $.data.id, bp_v: $.data.version }
          trigger:
            - call: "POST /billing-lines"
              payload: { billing_period_id: "${bp_id}", turn_id: "${t_id}", expected_billing_period_version: "${bp_v}" }
              as: BillingController
              captures: { err: $.data.error_id }
          assert:
            - "${t_status} == CANCELLED"
            - "${err} == ERR_TURN_NOT_BILLABLE"
            - "HTTP status is 422"
            - "BillingPeriod.${bp_id}.line_count == 0"
            - "BillingPeriod.${bp_id}.accrued_cents == 0"
            - "FlightBank.${fb_id}.required_headcount == 0"

      - name: closing_a_station_with_a_live_turn_returns_station_has_active_work
        claim_type: cross_entity_validation
        grounds:
          - state_machines.Station.OPEN_to_CLOSED
          - validations[priority=15]
          - errors[ERR_STATION_HAS_ACTIVE_WORK]
        distinguishing_aspect: "The CLOSE precondition scans children: with one SCHEDULED turn outstanding the call returns ERR_STATION_HAS_ACTIVE_WORK (409), and cancelling that turn lets the identical CLOSE succeed and retire the GSE fleet."
        test_recipe:
          setup:
            - "Station ZRH is OPEN with one SCHEDULED TOWING_ONLY turn and one AVAILABLE tug; no billing period exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-04-01T00:00:00Z" }
              as: StationManager
            - call: "POST /stations"
              payload: { iata_code: "ZRH", name: "Zurich", handler_code: "SWP", season_code: "SUMMER" }
              as: StationManager
              captures: { st_id: $.data.id }
            - call: "POST /stations/${st_id}/lifecycle"
              payload: { action: "OPEN" }
              as: StationManager
            - call: "POST /flight-banks"
              payload: { station_id: "${st_id}", bank_code: "AM1", season_code: "SUMMER", window_start: "2026-04-10T04:00:00Z", window_end: "2026-04-10T22:00:00Z", planned_headcount: 1 }
              as: DutyOfficer
              captures: { fb_id: $.data.id }
            - call: "POST /turns"
              payload: { station_id: "${st_id}", flight_bank_id: "${fb_id}", flight_number: "LX318", turn_type: "TOWING_ONLY", scheduled_in: "2026-04-10T06:00:00Z", scheduled_out: "2026-04-10T06:20:00Z" }
              as: DutyOfficer
              captures: { t_id: $.data.id }
            - call: "POST /gse-units"
              payload: { station_id: "${st_id}", asset_tag: "TUG-01", gse_type: "PUSHBACK_TUG" }
              as: StationManager
              captures: { g_id: $.data.id }
          trigger:
            - call: "POST /stations/${st_id}/lifecycle"
              payload: { action: "CLOSE" }
              as: StationManager
              captures: { err: $.data.error_id }
            - call: "POST /turns/${t_id}/lifecycle"
              payload: { action: "CANCEL", reason: "STATION_WIND_DOWN" }
              as: DutyOfficer
            - call: "POST /stations/${st_id}/lifecycle"
              payload: { action: "CLOSE" }
              as: StationManager
              captures: { st_status: $.data.status }
          assert:
            - "${err} == ERR_STATION_HAS_ACTIVE_WORK"
            - "HTTP status of the first CLOSE is 409"
            - "${st_status} == CLOSED"
            - "FlightBank.${fb_id}.bank_status == ARCHIVED"
            - "GseUnit.${g_id}.status == RETIRED"
            - "Turn.${t_id}.status == CANCELLED"

      - name: accruing_into_a_finalized_period_returns_period_not_open
        claim_type: violation_to_error
        grounds:
          - validations[priority=10]
          - errors[ERR_PERIOD_NOT_OPEN]
          - state_machines.BillingPeriod.OPEN_to_PENDING_APPROVAL
        distinguishing_aspect: "Once the period reaches PENDING_APPROVAL, both further accruals and voids are refused with ERR_PERIOD_NOT_OPEN (409), so the invoice cannot move under the auditor's feet."
        test_recipe:
          setup:
            - "Station ZRH is OPEN; Turn ONE (TOWING_ONLY, scheduled 06:00-06:20) COMPLETED exactly on schedule, and Turn TWO is SCHEDULED and unbilled."
            - "BillingPeriod 2026-04 carries a line for Turn ONE and has been FINALIZEd, so it is PENDING_APPROVAL."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-04-01T00:00:00Z" }
              as: StationManager
            - call: "POST /stations"
              payload: { iata_code: "ZRH", name: "Zurich", handler_code: "SWP", season_code: "SUMMER", otp_tolerance_minutes: 15 }
              as: StationManager
              captures: { st_id: $.data.id }
            - call: "POST /stations/${st_id}/lifecycle"
              payload: { action: "OPEN" }
              as: StationManager
            - call: "POST /flight-banks"
              payload: { station_id: "${st_id}", bank_code: "AM1", season_code: "SUMMER", window_start: "2026-04-10T04:00:00Z", window_end: "2026-04-10T22:00:00Z", planned_headcount: 2 }
              as: DutyOfficer
              captures: { fb_id: $.data.id }
            - call: "POST /turns"
              payload: { station_id: "${st_id}", flight_bank_id: "${fb_id}", flight_number: "LX701", turn_type: "TOWING_ONLY", scheduled_in: "2026-04-10T06:00:00Z", scheduled_out: "2026-04-10T06:20:00Z" }
              as: DutyOfficer
              captures: { t1_id: $.data.id, t1_v: $.data.version }
            - call: "POST /turns"
              payload: { station_id: "${st_id}", flight_bank_id: "${fb_id}", flight_number: "LX702", turn_type: "TOWING_ONLY", scheduled_in: "2026-04-10T09:00:00Z", scheduled_out: "2026-04-10T09:20:00Z" }
              as: DutyOfficer
              captures: { t2_id: $.data.id }
            - call: "POST /agents"
              payload: { station_id: "${st_id}", employee_code: "E001", full_name: "Ana Ruiz" }
              as: StationManager
              captures: { a_id: $.data.id }
            - call: "POST /certifications"
              payload: { agent_id: "${a_id}", station_id: "${st_id}", cert_type: "RAMP_SAFETY", issued_at: "2026-01-01T00:00:00Z", expires_at: "2027-01-01T00:00:00Z" }
              as: StationManager
            - call: "POST /gse-units"
              payload: { station_id: "${st_id}", asset_tag: "TUG-01", gse_type: "PUSHBACK_TUG" }
              as: StationManager
              captures: { g_id: $.data.id }
            - call: "POST /flight-banks/${fb_id}/lifecycle"
              payload: { action: "PUBLISH" }
              as: DutyOfficer
            - call: "POST /flight-banks/${fb_id}/staffing-transitions"
              payload: { action: "SUBMIT" }
              as: DutyOfficer
            - call: "POST /flight-banks/${fb_id}/staffing-transitions"
              payload: { action: "APPROVE" }
              as: StationManager
            - call: "POST /turn-resources"
              payload: { turn_id: "${t1_id}", resource_kind: "AGENT", agent_id: "${a_id}", role_on_turn: "RAMP", window_start: "2026-04-10T05:50:00Z", window_end: "2026-04-10T06:30:00Z", expected_turn_version: "${t1_v}" }
              as: DutyOfficer
            - call: "GET /turns/${t1_id}"
              payload: {}
              as: DutyOfficer
              captures: { t1_v2: $.data.version }
            - call: "POST /turn-resources"
              payload: { turn_id: "${t1_id}", resource_kind: "GSE", gse_unit_id: "${g_id}", window_start: "2026-04-10T05:55:00Z", window_end: "2026-04-10T06:25:00Z", expected_turn_version: "${t1_v2}" }
              as: DutyOfficer
            - call: "POST /turns/${t1_id}/lifecycle"
              payload: { action: "START", actual_in: "2026-04-10T06:00:00Z" }
              as: DutyOfficer
            - call: "POST /turns/${t1_id}/lifecycle"
              payload: { action: "COMPLETE", actual_out: "2026-04-10T06:20:00Z", delay_code: "NONE" }
              as: DutyOfficer
            - call: "POST /billing-periods"
              payload: { station_id: "${st_id}", period_code: "2026-04", window_start: "2026-04-01T00:00:00Z", window_end: "2026-04-30T23:59:00Z" }
              as: BillingController
              captures: { bp_id: $.data.id, bp_v: $.data.version }
            - call: "POST /billing-lines"
              payload: { billing_period_id: "${bp_id}", turn_id: "${t1_id}", expected_billing_period_version: "${bp_v}" }
              as: BillingController
              captures: { bl_id: $.data.id }
            - call: "POST /billing-periods/${bp_id}/transitions"
              payload: { action: "FINALIZE" }
              as: BillingController
              as_user_id: "bc-01"
              captures: { bp_status: $.data.status }
            - call: "GET /billing-periods/${bp_id}"
              payload: {}
              as: BillingController
              captures: { bp_v_final: $.data.version }
          trigger:
            - call: "POST /billing-lines"
              payload: { billing_period_id: "${bp_id}", turn_id: "${t2_id}", expected_billing_period_version: "${bp_v_final}" }
              as: BillingController
              captures: { err_line: $.data.error_id }
            - call: "POST /billing-lines/${bl_id}/void"
              payload: { reason: "TOO_LATE" }
              as: BillingController
              captures: { err_void: $.data.error_id }
          assert:
            - "${bp_status} == PENDING_APPROVAL"
            - "${err_line} == ERR_PERIOD_NOT_OPEN"
            - "${err_void} == ERR_PERIOD_NOT_OPEN"
            - "both responses carry HTTP status 409"
            - "BillingPeriod.${bp_id}.line_count == 1"
            - "BillingLine.${bl_id}.status == FINAL"
            - "BillingLine.${bl_id}.gross_amount_cents == 18000"
            - "Turn.${t2_id}.billed == false"

  # =======================================================================
  - section: endpoints
    instances:

      - name: billing_lines_filtered_by_turn_id_and_period_id
        claim_type: cross_reference_link
        grounds:
          - endpoints[GET /billing-lines]
          - entities.BillingLine.fields.billing_period_id
          - entities.BillingLine.fields.turn_id
        distinguishing_aspect: "GET /billing-lines is the reverse-reachability channel for both of BillingLine's foreign keys: filtering by billing_period_id returns both lines and filtering by turn_id returns exactly the one line for that turn."
        test_recipe:
          setup:
            - "Station ZRH is OPEN with two SCHEDULED TOWING_ONLY turns."
            - "BillingPeriod 2026-04 is OPEN and carries one PROVISIONAL line per turn."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-04-01T00:00:00Z" }
              as: StationManager
            - call: "POST /stations"
              payload: { iata_code: "ZRH", name: "Zurich", handler_code: "SWP", season_code: "SUMMER" }
              as: StationManager
              captures: { st_id: $.data.id }
            - call: "POST /stations/${st_id}/lifecycle"
              payload: { action: "OPEN" }
              as: StationManager
            - call: "POST /flight-banks"
              payload: { station_id: "${st_id}", bank_code: "AM1", season_code: "SUMMER", window_start: "2026-04-10T04:00:00Z", window_end: "2026-04-10T22:00:00Z", planned_headcount: 2 }
              as: DutyOfficer
              captures: { fb_id: $.data.id }
            - call: "POST /turns"
              payload: { station_id: "${st_id}", flight_bank_id: "${fb_id}", flight_number: "LX801", turn_type: "TOWING_ONLY", scheduled_in: "2026-04-10T06:00:00Z", scheduled_out: "2026-04-10T06:20:00Z" }
              as: DutyOfficer
              captures: { t1_id: $.data.id }
            - call: "POST /turns"
              payload: { station_id: "${st_id}", flight_bank_id: "${fb_id}", flight_number: "LX802", turn_type: "TOWING_ONLY", scheduled_in: "2026-04-10T08:00:00Z", scheduled_out: "2026-04-10T08:20:00Z" }
              as: DutyOfficer
              captures: { t2_id: $.data.id }
            - call: "POST /billing-periods"
              payload: { station_id: "${st_id}", period_code: "2026-04", window_start: "2026-04-01T00:00:00Z", window_end: "2026-04-30T23:59:00Z" }
              as: BillingController
              captures: { bp_id: $.data.id, bp_v: $.data.version }
            - call: "POST /billing-lines"
              payload: { billing_period_id: "${bp_id}", turn_id: "${t1_id}", expected_billing_period_version: "${bp_v}" }
              as: BillingController
              captures: { bl1: $.data.id }
            - call: "GET /billing-periods/${bp_id}"
              payload: {}
              as: BillingController
              captures: { bp_v2: $.data.version }
            - call: "POST /billing-lines"
              payload: { billing_period_id: "${bp_id}", turn_id: "${t2_id}", expected_billing_period_version: "${bp_v2}" }
              as: BillingController
              captures: { bl2: $.data.id }
          trigger:
            - call: "GET /billing-lines"
              payload: { billing_period_id: "${bp_id}", limit: 10, offset: 0 }
              as: ContractAuditor
              captures: { by_period_first: "$.data[0].id" }
            - call: "GET /billing-lines"
              payload: { turn_id: "${t2_id}" }
              as: ContractAuditor
              captures: { by_turn_first: "$.data[0].id", by_turn_net: "$.data[0].net_amount_cents" }
          assert:
            - "the billing_period_id-filtered list returns exactly 2 elements with total_count 2 and has_more false"
            - "${by_period_first} == ${bl1}"
            - "the turn_id-filtered list returns exactly 1 element with total_count 1"
            - "${by_turn_first} == ${bl2}"
            - "${by_turn_net} == 18000"
            - "BillingPeriod.${bp_id}.accrued_cents == 36000"

      - name: incidents_filtered_by_subcontractor_id_snapshot
        claim_type: computed_read
        grounds:
          - endpoints[GET /incidents]
          - entities.Incident.fields.subcontractor_id
        distinguishing_aspect: "Incident.subcontractor_id is snapshotted from the referenced Agent at report time and is never supplied by the client, yet GET /incidents?subcontractor_id= returns exactly the incident reported against the subcontracted agent and not the one against the direct agent."
        test_recipe:
          setup:
            - "Station ZRH is OPEN; Subcontractor 'Alpine Ramp AG' is APPROVED and employs agent E010; agent E001 is directly employed."
            - "One MINOR NEAR_MISS incident names E010 and another names E001."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-04-01T00:00:00Z" }
              as: StationManager
            - call: "POST /stations"
              payload: { iata_code: "ZRH", name: "Zurich", handler_code: "SWP", season_code: "SUMMER" }
              as: StationManager
              captures: { st_id: $.data.id }
            - call: "POST /stations/${st_id}/lifecycle"
              payload: { action: "OPEN" }
              as: StationManager
            - call: "POST /subcontractors"
              payload: { station_id: "${st_id}", legal_name: "Alpine Ramp AG" }
              as: StationManager
              captures: { sc_id: $.data.id }
            - call: "POST /subcontractors/${sc_id}/oversight-decisions"
              payload: { decision: "APPROVE" }
              as: StationManager
            - call: "POST /agents"
              payload: { station_id: "${st_id}", employee_code: "E010", full_name: "Cleo Marin", subcontractor_id: "${sc_id}" }
              as: StationManager
              captures: { a_sub: $.data.id }
            - call: "POST /agents"
              payload: { station_id: "${st_id}", employee_code: "E001", full_name: "Ana Ruiz" }
              as: StationManager
              captures: { a_dir: $.data.id }
            - call: "POST /incidents"
              payload: { station_id: "${st_id}", incident_type: "NEAR_MISS", severity: "MINOR", occurred_at: "2026-03-30T09:00:00Z", agent_id: "${a_sub}" }
              as: DutyOfficer
              as_user_id: "duty-01"
              captures: { i_sub: $.data.id, snap: $.data.subcontractor_id }
            - call: "POST /incidents"
              payload: { station_id: "${st_id}", incident_type: "NEAR_MISS", severity: "MINOR", occurred_at: "2026-03-30T10:00:00Z", agent_id: "${a_dir}" }
              as: DutyOfficer
              as_user_id: "duty-01"
              captures: { i_dir: $.data.id, snap_dir: $.data.subcontractor_id }
          trigger:
            - call: "GET /incidents"
              payload: { subcontractor_id: "${sc_id}" }
              as: SafetyOfficer
              captures: { found: "$.data[0].id" }
            - call: "GET /subcontractors/${sc_id}"
              payload: {}
              as: StationManager
              captures: { total_cnt: $.data.total_incident_count, closed_cnt: $.data.closed_liable_incident_count, rolling: $.data.compliance_score, audit: $.data.audit_compliance_score }
          assert:
            - "${snap} == ${sc_id}"
            - "${snap_dir} == null"
            - "the subcontractor_id-filtered incident list returns exactly 1 element with total_count 1"
            - "${found} == ${i_sub}"
            - "${total_cnt} == 1"
            - "${closed_cnt} == 0"
            - "${rolling} == 100.00"
            - "${audit} == 95.00"

      - name: release_endpoint_is_a_conditional_action
        claim_type: conditional_action
        grounds:
          - endpoints[POST /turn-resources/{turnResourceId}/release]
        excluded_because:
          difficulty_instance: compensating_invariant / gse_occupation_minutes_conserved_across_create_and_release
          rationale: "That §1.8 instance drives the release action and asserts every one of its declared side effects, including the demotion and the bank staffing revision."

      - name: billing_period_transitions_action_endpoint
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /billing-periods/{billingPeriodId}/transitions]
        excluded_because:
          difficulty_instance: combinatorial_formula / period_rebate_circular_evaluation_order_mode_c
          rationale: "FINALIZE and its full eight-step roll-up are asserted there; REJECT is covered by the §1.9 compensation instance billing_period_reject_reverts_lines_to_provisional_variant."

  # =======================================================================
  - section: errors
    instances:

      - name: every_path_parameter_not_found_error_is_triggerable
        claim_type: violation_to_error
        grounds:
          - errors[ERR_SUBCONTRACTOR_NOT_FOUND]
          - errors[ERR_FLIGHT_BANK_NOT_FOUND]
          - errors[ERR_TURN_NOT_FOUND]
          - errors[ERR_CERTIFICATION_NOT_FOUND]
          - errors[ERR_GSE_UNIT_NOT_FOUND]
          - errors[ERR_TURN_RESOURCE_NOT_FOUND]
          - errors[ERR_INCIDENT_NOT_FOUND]
          - errors[ERR_BILLING_PERIOD_NOT_FOUND]
          - errors[ERR_BILLING_LINE_NOT_FOUND]
          - validations[priority=3]
        distinguishing_aspect: "Each single-resource GET maps an unknown UUID to its own domain-specific 404 code, so the nine reads return ERR_SUBCONTRACTOR_NOT_FOUND, ERR_FLIGHT_BANK_NOT_FOUND, ERR_TURN_NOT_FOUND, ERR_CERTIFICATION_NOT_FOUND, ERR_GSE_UNIT_NOT_FOUND, ERR_TURN_RESOURCE_NOT_FOUND, ERR_INCIDENT_NOT_FOUND, ERR_BILLING_PERIOD_NOT_FOUND and ERR_BILLING_LINE_NOT_FOUND respectively, never a shared generic code."
        test_recipe:
          setup:
            - "Empty database apart from the pinned logical clock; no row of any type exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-04-01T00:00:00Z" }
              as: StationManager
          trigger:
            - call: "GET /subcontractors/11111111-1111-1111-1111-111111111111"
              payload: {}
              as: StationManager
              captures: { e_sub: $.data.error_id }
            - call: "GET /flight-banks/22222222-2222-2222-2222-222222222222"
              payload: {}
              as: StationManager
              captures: { e_bank: $.data.error_id }
            - call: "GET /turns/33333333-3333-3333-3333-333333333333"
              payload: {}
              as: StationManager
              captures: { e_turn: $.data.error_id }
            - call: "GET /certifications/44444444-4444-4444-4444-444444444444"
              payload: {}
              as: StationManager
              captures: { e_cert: $.data.error_id }
            - call: "GET /gse-units/55555555-5555-5555-5555-555555555555"
              payload: {}
              as: StationManager
              captures: { e_gse: $.data.error_id }
            - call: "GET /turn-resources/66666666-6666-6666-6666-666666666666"
              payload: {}
              as: StationManager
              captures: { e_res: $.data.error_id }
            - call: "GET /incidents/77777777-7777-7777-7777-777777777777"
              payload: {}
              as: StationManager
              captures: { e_inc: $.data.error_id }
            - call: "GET /billing-periods/88888888-8888-8888-8888-888888888888"
              payload: {}
              as: StationManager
              captures: { e_period: $.data.error_id }
            - call: "GET /billing-lines/99999999-9999-9999-9999-999999999999"
              payload: {}
              as: StationManager
              captures: { e_line: $.data.error_id }
          assert:
            - "${e_sub} == ERR_SUBCONTRACTOR_NOT_FOUND"
            - "${e_bank} == ERR_FLIGHT_BANK_NOT_FOUND"
            - "${e_turn} == ERR_TURN_NOT_FOUND"
            - "${e_cert} == ERR_CERTIFICATION_NOT_FOUND"
            - "${e_gse} == ERR_GSE_UNIT_NOT_FOUND"
            - "${e_res} == ERR_TURN_RESOURCE_NOT_FOUND"
            - "${e_inc} == ERR_INCIDENT_NOT_FOUND"
            - "${e_period} == ERR_BILLING_PERIOD_NOT_FOUND"
            - "${e_line} == ERR_BILLING_LINE_NOT_FOUND"
            - "all nine responses carry HTTP status 404, response_type error and a data block with error_id and message"

      - name: error_turn_not_assignable_is_triggerable
        claim_type: violation_to_error
        grounds:
          - errors[ERR_TURN_NOT_ASSIGNABLE]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / cancelled_turn_state_beats_lapsed_certification_safety
          rationale: "That §1.8 instance asserts the code and its 409 status as the winning error of the state-versus-safety conflict."

      - name: error_open_critical_incident_is_triggerable
        claim_type: violation_to_error
        grounds:
          - errors[ERR_OPEN_CRITICAL_INCIDENT]
          - errors[ERR_PENALTY_CAP_BREACHED]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / open_critical_incident_safety_beats_penalty_cap_fiscal
          rationale: "Both codes are asserted there, first as the winner and then as the residual fiscal failure once the incident is closed."

      - name: error_staffing_coverage_insufficient_is_triggerable
        claim_type: violation_to_error
        grounds:
          - errors[ERR_STAFFING_COVERAGE_INSUFFICIENT]
        excluded_because:
          difficulty_instance: boundary_precision_check / staffing_coverage_inclusive_boundary_at_100_pct
          rationale: "Triggered at coverage 66.67 percent and asserted with its 422 status in that §1.8 instance."

      - name: error_gse_window_conflict_and_agent_duty_overlap_are_triggerable
        claim_type: violation_to_error
        grounds:
          - errors[ERR_GSE_WINDOW_CONFLICT]
          - errors[ERR_AGENT_DUTY_OVERLAP]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / gse_buffered_half_open_interval_adjacency
          rationale: "The GSE code is asserted there and the agent code in its sibling instance agent_bare_closed_interval_touching_endpoints."

  # =======================================================================
  - section: rbac
    instances:

      - name: missing_role_header_returns_unauthenticated
        claim_type: other_role_denied
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
          - roles[StationManager]
        distinguishing_aspect: "A request with neither X-User-Role nor X-User-ID is rejected at priority 1 with ERR_UNAUTHENTICATED and HTTP 401, before any role or payload check runs, so a body that is also missing required fields still surfaces 401 rather than 400."
        test_recipe:
          setup:
            - "Empty database apart from the pinned logical clock."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-04-01T00:00:00Z" }
              as: StationManager
          trigger:
            - call: "POST /stations"
              payload: { iata_code: "ZRH" }
              captures: { err: $.data.error_id }
          assert:
            - "the trigger request is sent with NO X-User-Role and NO X-User-ID header"
            - "${err} == ERR_UNAUTHENTICATED"
            - "${err} != ERR_INVALID_REQUEST"
            - "HTTP status is 401"

      - name: contract_auditor_cannot_schedule_a_turn
        claim_type: other_role_denied
        grounds:
          - roles[ContractAuditor]
          - roles[DutyOfficer]
          - errors[ERR_FORBIDDEN_ROLE]
          - validations[priority=2]
        distinguishing_aspect: "POST /turns is a DutyOfficer exclusive operation, so a ContractAuditor calling it is refused with ERR_FORBIDDEN_ROLE and HTTP 403 even though every field in the body is valid."
        test_recipe:
          setup:
            - "Station ZRH is OPEN with FlightBank AM1 in DRAFT."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-04-01T00:00:00Z" }
              as: StationManager
            - call: "POST /stations"
              payload: { iata_code: "ZRH", name: "Zurich", handler_code: "SWP", season_code: "SUMMER" }
              as: StationManager
              captures: { st_id: $.data.id }
            - call: "POST /stations/${st_id}/lifecycle"
              payload: { action: "OPEN" }
              as: StationManager
            - call: "POST /flight-banks"
              payload: { station_id: "${st_id}", bank_code: "AM1", season_code: "SUMMER", window_start: "2026-04-10T04:00:00Z", window_end: "2026-04-10T22:00:00Z", planned_headcount: 1 }
              as: DutyOfficer
              captures: { fb_id: $.data.id }
          trigger:
            - call: "POST /turns"
              payload: { station_id: "${st_id}", flight_bank_id: "${fb_id}", flight_number: "LX318", turn_type: "TOWING_ONLY", scheduled_in: "2026-04-10T06:00:00Z", scheduled_out: "2026-04-10T06:20:00Z" }
              as: ContractAuditor
              as_user_id: "ca-01"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_FORBIDDEN_ROLE"
            - "HTTP status is 403"
            - "FlightBank.${fb_id}.turn_count == 0"

      - name: duty_officer_cannot_approve_a_staffing_plan
        claim_type: approval_chain
        grounds:
          - roles[DutyOfficer]
          - roles[StationManager]
          - validations[priority=2]
          - errors[ERR_FORBIDDEN_ROLE]
        distinguishing_aspect: "The staffing endpoint is shared but its actions are not: SUBMIT and REVISE are DutyOfficer-only while APPROVE and REJECT are StationManager-only, so a DutyOfficer APPROVE returns ERR_FORBIDDEN_ROLE (403) and a StationManager SUBMIT does too."
        test_recipe:
          setup:
            - "Station ZRH is OPEN; FlightBank AM1 is PUBLISHED with one TOWING_ONLY turn and planned_headcount 1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-04-01T00:00:00Z" }
              as: StationManager
            - call: "POST /stations"
              payload: { iata_code: "ZRH", name: "Zurich", handler_code: "SWP", season_code: "SUMMER" }
              as: StationManager
              captures: { st_id: $.data.id }
            - call: "POST /stations/${st_id}/lifecycle"
              payload: { action: "OPEN" }
              as: StationManager
            - call: "POST /flight-banks"
              payload: { station_id: "${st_id}", bank_code: "AM1", season_code: "SUMMER", window_start: "2026-04-10T04:00:00Z", window_end: "2026-04-10T22:00:00Z", planned_headcount: 1 }
              as: DutyOfficer
              captures: { fb_id: $.data.id }
            - call: "POST /turns"
              payload: { station_id: "${st_id}", flight_bank_id: "${fb_id}", flight_number: "LX318", turn_type: "TOWING_ONLY", scheduled_in: "2026-04-10T06:00:00Z", scheduled_out: "2026-04-10T06:20:00Z" }
              as: DutyOfficer
            - call: "POST /flight-banks/${fb_id}/lifecycle"
              payload: { action: "PUBLISH" }
              as: DutyOfficer
          trigger:
            - call: "POST /flight-banks/${fb_id}/staffing-transitions"
              payload: { action: "SUBMIT" }
              as: StationManager
              as_user_id: "sm-01"
              captures: { err_submit: $.data.error_id }
            - call: "POST /flight-banks/${fb_id}/staffing-transitions"
              payload: { action: "SUBMIT" }
              as: DutyOfficer
              as_user_id: "do-01"
              captures: { ss_submitted: $.data.staffing_status }
            - call: "POST /flight-banks/${fb_id}/staffing-transitions"
              payload: { action: "APPROVE" }
              as: DutyOfficer
              as_user_id: "do-01"
              captures: { err_approve: $.data.error_id }
            - call: "POST /flight-banks/${fb_id}/staffing-transitions"
              payload: { action: "APPROVE" }
              as: StationManager
              as_user_id: "sm-01"
              captures: { ss_approved: $.data.staffing_status }
          assert:
            - "${err_submit} == ERR_FORBIDDEN_ROLE"
            - "${ss_submitted} == SUBMITTED"
            - "${err_approve} == ERR_FORBIDDEN_ROLE"
            - "both refusals carry HTTP status 403"
            - "${ss_approved} == APPROVED"
            - "FlightBank.${fb_id}.last_staffing_decision_by_user_id == sm-01"

      - name: incident_reporter_cannot_investigate_and_findings_issuer_cannot_close
        claim_type: segregation_of_duties
        grounds:
          - validations[priority=9]
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - state_machines.Incident.REPORTED_to_UNDER_INVESTIGATION
          - state_machines.Incident.FINDINGS_ISSUED_to_CLOSED
        distinguishing_aspect: "Segregation of duties is enforced on X-User-ID, not on role: the user who reported the incident is refused INVESTIGATE with ERR_SEGREGATION_OF_DUTIES (403) even acting as SafetyOfficer, and the user who issued findings is refused CLOSE for the same reason."
        test_recipe:
          setup:
            - "Station ZRH is OPEN."
            - "SafetyOfficer user safety-01 personally reported a MINOR NEAR_MISS incident."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-04-01T00:00:00Z" }
              as: StationManager
            - call: "POST /stations"
              payload: { iata_code: "ZRH", name: "Zurich", handler_code: "SWP", season_code: "SUMMER" }
              as: StationManager
              captures: { st_id: $.data.id }
            - call: "POST /stations/${st_id}/lifecycle"
              payload: { action: "OPEN" }
              as: StationManager
            - call: "POST /incidents"
              payload: { station_id: "${st_id}", incident_type: "NEAR_MISS", severity: "MINOR", occurred_at: "2026-03-30T09:00:00Z" }
              as: SafetyOfficer
              as_user_id: "safety-01"
              captures: { i_id: $.data.id, reporter: $.data.reported_by_user_id }
          trigger:
            - call: "POST /incidents/${i_id}/transitions"
              payload: { action: "INVESTIGATE" }
              as: SafetyOfficer
              as_user_id: "safety-01"
              captures: { err_investigate: $.data.error_id }
            - call: "POST /incidents/${i_id}/transitions"
              payload: { action: "INVESTIGATE" }
              as: SafetyOfficer
              as_user_id: "safety-02"
              captures: { st_invest: $.data.status, investigator: $.data.investigator_user_id }
            - call: "POST /incidents/${i_id}/transitions"
              payload: { action: "ISSUE_FINDINGS", root_cause_code: "COMMS_BREAKDOWN", liability_party: "HANDLER" }
              as: SafetyOfficer
              as_user_id: "safety-02"
              captures: { issuer: $.data.findings_issued_by_user_id }
            - call: "POST /incidents/${i_id}/transitions"
              payload: { action: "CLOSE" }
              as: SafetyOfficer
              as_user_id: "safety-02"
              captures: { err_close: $.data.error_id }
            - call: "POST /incidents/${i_id}/transitions"
              payload: { action: "CLOSE" }
              as: SafetyOfficer
              as_user_id: "safety-03"
              captures: { closed_status: $.data.status, closer: $.data.closed_by_user_id }
          assert:
            - "${reporter} == safety-01"
            - "${err_investigate} == ERR_SEGREGATION_OF_DUTIES"
            - "${st_invest} == UNDER_INVESTIGATION"
            - "${investigator} == safety-02"
            - "${issuer} == safety-02"
            - "${err_close} == ERR_SEGREGATION_OF_DUTIES"
            - "both refusals carry HTTP status 403"
            - "${closed_status} == CLOSED"
            - "${closer} == safety-03"

      - name: period_finalizer_cannot_approve_the_same_period
        claim_type: segregation_of_duties
        grounds:
          - validations[priority=9]
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - state_machines.BillingPeriod.PENDING_APPROVAL_to_APPROVED
          - entities.BillingPeriod.fields.finalized_by_user_id
        distinguishing_aspect: "The invoice control is on X-User-ID: user ops-7 who finalized the period is refused APPROVE with ERR_SEGREGATION_OF_DUTIES (403) even while presenting the ContractAuditor role, and a different auditor id approves the identical period."
        test_recipe:
          setup:
            - "Station ZRH is OPEN; Turn LX318 (TOWING_ONLY, scheduled 06:00-06:20) COMPLETED exactly on schedule."
            - "BillingPeriod 2026-04 carries one line and was FINALIZEd by X-User-ID ops-7, so it is PENDING_APPROVAL."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-04-01T00:00:00Z" }
              as: StationManager
            - call: "POST /stations"
              payload: { iata_code: "ZRH", name: "Zurich", handler_code: "SWP", season_code: "SUMMER", otp_tolerance_minutes: 15 }
              as: StationManager
              captures: { st_id: $.data.id }
            - call: "POST /stations/${st_id}/lifecycle"
              payload: { action: "OPEN" }
              as: StationManager
            - call: "POST /flight-banks"
              payload: { station_id: "${st_id}", bank_code: "AM1", season_code: "SUMMER", window_start: "2026-04-10T04:00:00Z", window_end: "2026-04-10T22:00:00Z", planned_headcount: 1 }
              as: DutyOfficer
              captures: { fb_id: $.data.id }
            - call: "POST /turns"
              payload: { station_id: "${st_id}", flight_bank_id: "${fb_id}", flight_number: "LX318", turn_type: "TOWING_ONLY", scheduled_in: "2026-04-10T06:00:00Z", scheduled_out: "2026-04-10T06:20:00Z" }
              as: DutyOfficer
              captures: { t_id: $.data.id, t_v: $.data.version }
            - call: "POST /agents"
              payload: { station_id: "${st_id}", employee_code: "E001", full_name: "Ana Ruiz" }
              as: StationManager
              captures: { a_id: $.data.id }
            - call: "POST /certifications"
              payload: { agent_id: "${a_id}", station_id: "${st_id}", cert_type: "RAMP_SAFETY", issued_at: "2026-01-01T00:00:00Z", expires_at: "2027-01-01T00:00:00Z" }
              as: StationManager
            - call: "POST /gse-units"
              payload: { station_id: "${st_id}", asset_tag: "TUG-01", gse_type: "PUSHBACK_TUG" }
              as: StationManager
              captures: { g_id: $.data.id }
            - call: "POST /flight-banks/${fb_id}/lifecycle"
              payload: { action: "PUBLISH" }
              as: DutyOfficer
            - call: "POST /flight-banks/${fb_id}/staffing-transitions"
              payload: { action: "SUBMIT" }
              as: DutyOfficer
            - call: "POST /flight-banks/${fb_id}/staffing-transitions"
              payload: { action: "APPROVE" }
              as: StationManager
            - call: "POST /turn-resources"
              payload: { turn_id: "${t_id}", resource_kind: "AGENT", agent_id: "${a_id}", role_on_turn: "RAMP", window_start: "2026-04-10T05:50:00Z", window_end: "2026-04-10T06:30:00Z", expected_turn_version: "${t_v}" }
              as: DutyOfficer
            - call: "GET /turns/${t_id}"
              payload: {}
              as: DutyOfficer
              captures: { t_v2: $.data.version }
            - call: "POST /turn-resources"
              payload: { turn_id: "${t_id}", resource_kind: "GSE", gse_unit_id: "${g_id}", window_start: "2026-04-10T05:55:00Z", window_end: "2026-04-10T06:25:00Z", expected_turn_version: "${t_v2}" }
              as: DutyOfficer
            - call: "POST /turns/${t_id}/lifecycle"
              payload: { action: "START", actual_in: "2026-04-10T06:00:00Z" }
              as: DutyOfficer
            - call: "POST /turns/${t_id}/lifecycle"
              payload: { action: "COMPLETE", actual_out: "2026-04-10T06:20:00Z", delay_code: "NONE" }
              as: DutyOfficer
            - call: "POST /billing-periods"
              payload: { station_id: "${st_id}", period_code: "2026-04", window_start: "2026-04-01T00:00:00Z", window_end: "2026-04-30T23:59:00Z" }
              as: BillingController
              captures: { bp_id: $.data.id, bp_v: $.data.version }
            - call: "POST /billing-lines"
              payload: { billing_period_id: "${bp_id}", turn_id: "${t_id}", expected_billing_period_version: "${bp_v}" }
              as: BillingController
              captures: { bl_id: $.data.id }
            - call: "POST /billing-periods/${bp_id}/transitions"
              payload: { action: "FINALIZE" }
              as: BillingController
              as_user_id: "ops-7"
              captures: { finalizer: $.data.finalized_by_user_id }
          trigger:
            - call: "POST /billing-periods/${bp_id}/transitions"
              payload: { action: "APPROVE" }
              as: ContractAuditor
              as_user_id: "ops-7"
              captures: { err: $.data.error_id }
            - call: "POST /billing-periods/${bp_id}/transitions"
              payload: { action: "APPROVE" }
              as: ContractAuditor
              as_user_id: "ca-01"
              captures: { final_status: $.data.status, approver: $.data.approved_by_user_id }
          assert:
            - "${finalizer} == ops-7"
            - "${err} == ERR_SEGREGATION_OF_DUTIES"
            - "HTTP status of the self-approval is 403"
            - "${final_status} == APPROVED"
            - "${approver} == ca-01"
            - "BillingLine.${bl_id}.status == FINAL"
            - "BillingPeriod.${bp_id}.accrued_cents == 18000"

      - name: subcontractor_admin_cannot_register_an_agent_for_another_firm
        claim_type: peer_roles
        grounds:
          - roles[SubcontractorAdmin]
          - validations[priority=8]
          - errors[ERR_OWNERSHIP_VIOLATION]
          - entities.Agent.fields.subcontractor_id
        distinguishing_aspect: "SubcontractorAdmin is entity_backed on Subcontractor, so X-User-ID must equal the subcontractor_id in the body: registering an agent for a different firm returns ERR_OWNERSHIP_VIOLATION (403), while registering one for its own firm succeeds."
        test_recipe:
          setup:
            - "Station ZRH is OPEN with two APPROVED subcontractors, 'Alpine Ramp AG' and 'Rhone Handling SA'."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-04-01T00:00:00Z" }
              as: StationManager
            - call: "POST /stations"
              payload: { iata_code: "ZRH", name: "Zurich", handler_code: "SWP", season_code: "SUMMER" }
              as: StationManager
              captures: { st_id: $.data.id }
            - call: "POST /stations/${st_id}/lifecycle"
              payload: { action: "OPEN" }
              as: StationManager
            - call: "POST /subcontractors"
              payload: { station_id: "${st_id}", legal_name: "Alpine Ramp AG" }
              as: StationManager
              captures: { sc_a: $.data.id }
            - call: "POST /subcontractors/${sc_a}/oversight-decisions"
              payload: { decision: "APPROVE" }
              as: StationManager
            - call: "POST /subcontractors"
              payload: { station_id: "${st_id}", legal_name: "Rhone Handling SA" }
              as: StationManager
              captures: { sc_b: $.data.id }
            - call: "POST /subcontractors/${sc_b}/oversight-decisions"
              payload: { decision: "APPROVE" }
              as: StationManager
          trigger:
            - call: "POST /agents"
              payload: { station_id: "${st_id}", employee_code: "E020", full_name: "Dana Vogel", subcontractor_id: "${sc_b}" }
              as: SubcontractorAdmin
              as_user_id: "${sc_a}"
              captures: { err: $.data.error_id }
            - call: "POST /agents"
              payload: { station_id: "${st_id}", employee_code: "E021", full_name: "Eli Brand", subcontractor_id: "${sc_a}" }
              as: SubcontractorAdmin
              as_user_id: "${sc_a}"
              captures: { own_id: $.data.id, own_emp: $.data.employment_type, own_sub: $.data.subcontractor_id }
          assert:
            - "${err} == ERR_OWNERSHIP_VIOLATION"
            - "HTTP status of the cross-firm create is 403"
            - "${own_emp} == SUBCONTRACTED"
            - "${own_sub} == ${sc_a}"
            - "Agent.${own_id}.status == ACTIVE"
            - "Agent.${own_id}.certification_posture == LAPSED"

  # =======================================================================
  - section: cross_cutting_complexity_layers
    instances:

      - name: stale_expected_turn_version_returns_412_and_fresh_version_succeeds
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[turn-resource-create-stale-turn]
          - errors[ERR_STALE_TURN_VERSION]
          - validations[priority=7]
          - entities.Turn.fields.version
        distinguishing_aspect: "The first create advances Turn.version, so replaying the same expected_turn_version returns ERR_STALE_TURN_VERSION with HTTP 412 and persists nothing; re-reading the turn and retrying with the fresh version succeeds and advances the version again."
        test_recipe:
          setup:
            - "Station ZRH is OPEN with one SCHEDULED NARROWBODY_QUICK turn (2 agents required) and two certified direct agents."
            - "The client has read the turn once and holds its version."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-04-01T00:00:00Z" }
              as: StationManager
            - call: "POST /stations"
              payload: { iata_code: "ZRH", name: "Zurich", handler_code: "SWP", season_code: "SUMMER" }
              as: StationManager
              captures: { st_id: $.data.id }
            - call: "POST /stations/${st_id}/lifecycle"
              payload: { action: "OPEN" }
              as: StationManager
            - call: "POST /flight-banks"
              payload: { station_id: "${st_id}", bank_code: "AM1", season_code: "SUMMER", window_start: "2026-04-10T04:00:00Z", window_end: "2026-04-10T22:00:00Z", planned_headcount: 2 }
              as: DutyOfficer
              captures: { fb_id: $.data.id }
            - call: "POST /turns"
              payload: { station_id: "${st_id}", flight_bank_id: "${fb_id}", flight_number: "LX318", turn_type: "NARROWBODY_QUICK", scheduled_in: "2026-04-10T06:00:00Z", scheduled_out: "2026-04-10T06:30:00Z" }
              as: DutyOfficer
              captures: { t_id: $.data.id, t_v1: $.data.version }
            - call: "POST /agents"
              payload: { station_id: "${st_id}", employee_code: "E001", full_name: "Ana Ruiz" }
              as: StationManager
              captures: { a1: $.data.id }
            - call: "POST /certifications"
              payload: { agent_id: "${a1}", station_id: "${st_id}", cert_type: "RAMP_SAFETY", issued_at: "2026-01-01T00:00:00Z", expires_at: "2027-01-01T00:00:00Z" }
              as: StationManager
            - call: "POST /agents"
              payload: { station_id: "${st_id}", employee_code: "E002", full_name: "Bo Keller" }
              as: StationManager
              captures: { a2: $.data.id }
            - call: "POST /certifications"
              payload: { agent_id: "${a2}", station_id: "${st_id}", cert_type: "RAMP_SAFETY", issued_at: "2026-01-01T00:00:00Z", expires_at: "2027-01-01T00:00:00Z" }
              as: StationManager
          trigger:
            - call: "POST /turn-resources"
              payload: { turn_id: "${t_id}", resource_kind: "AGENT", agent_id: "${a1}", role_on_turn: "RAMP", window_start: "2026-04-10T05:50:00Z", window_end: "2026-04-10T06:40:00Z", expected_turn_version: "${t_v1}" }
              as: DutyOfficer
              captures: { tr1: $.data.id }
            - call: "POST /turn-resources"
              payload: { turn_id: "${t_id}", resource_kind: "AGENT", agent_id: "${a2}", role_on_turn: "RAMP", window_start: "2026-04-10T05:50:00Z", window_end: "2026-04-10T06:40:00Z", expected_turn_version: "${t_v1}" }
              as: DutyOfficer
              captures: { err: $.data.error_id }
            - call: "GET /turns/${t_id}"
              payload: {}
              as: DutyOfficer
              captures: { t_v2: $.data.version, ac_mid: $.data.assigned_agent_count }
            - call: "POST /turn-resources"
              payload: { turn_id: "${t_id}", resource_kind: "AGENT", agent_id: "${a2}", role_on_turn: "RAMP", window_start: "2026-04-10T05:50:00Z", window_end: "2026-04-10T06:40:00Z", expected_turn_version: "${t_v2}" }
              as: DutyOfficer
              captures: { tr2: $.data.id }
            - call: "GET /turns/${t_id}"
              payload: {}
              as: DutyOfficer
              captures: { t_v3: $.data.version, ac_end: $.data.assigned_agent_count }
          assert:
            - "${err} == ERR_STALE_TURN_VERSION"
            - "HTTP status of the stale retry is 412"
            - "${ac_mid} == 1"
            - "${t_v2} == ${t_v1} + 1"
            - "${ac_end} == 2"
            - "${t_v3} == ${t_v2} + 1"
            - "TurnResource.${tr1}.status == RESERVED"
            - "TurnResource.${tr2}.status == RESERVED"
            - "Agent.${a1}.assigned_duty_minutes == 50"
            - "Agent.${a2}.assigned_duty_minutes == 50"

      - name: stale_expected_billing_period_version_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[billing-line-create-stale-period]
          - errors[ERR_STALE_PERIOD_VERSION]
          - validations[priority=7]
          - entities.BillingPeriod.fields.version
        distinguishing_aspect: "Accruing the first line advances BillingPeriod.version, so a second accrual carrying the original version returns ERR_STALE_PERIOD_VERSION with HTTP 412 and leaves accrued_cents at 18000; retrying with the re-read version accrues the second line."
        test_recipe:
          setup:
            - "Station ZRH is OPEN with two SCHEDULED TOWING_ONLY turns scheduled 06:00-06:20 and 08:00-08:20."
            - "BillingPeriod 2026-04 is OPEN and the client holds the version it had at creation."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-04-01T00:00:00Z" }
              as: StationManager
            - call: "POST /stations"
              payload: { iata_code: "ZRH", name: "Zurich", handler_code: "SWP", season_code: "SUMMER" }
              as: StationManager
              captures: { st_id: $.data.id }
            - call: "POST /stations/${st_id}/lifecycle"
              payload: { action: "OPEN" }
              as: StationManager
            - call: "POST /flight-banks"
              payload: { station_id: "${st_id}", bank_code: "AM1", season_code: "SUMMER", window_start: "2026-04-10T04:00:00Z", window_end: "2026-04-10T22:00:00Z", planned_headcount: 2 }
              as: DutyOfficer
              captures: { fb_id: $.data.id }
            - call: "POST /turns"
              payload: { station_id: "${st_id}", flight_bank_id: "${fb_id}", flight_number: "LX901", turn_type: "TOWING_ONLY", scheduled_in: "2026-04-10T06:00:00Z", scheduled_out: "2026-04-10T06:20:00Z" }
              as: DutyOfficer
              captures: { t1: $.data.id }
            - call: "POST /turns"
              payload: { station_id: "${st_id}", flight_bank_id: "${fb_id}", flight_number: "LX902", turn_type: "TOWING_ONLY", scheduled_in: "2026-04-10T08:00:00Z", scheduled_out: "2026-04-10T08:20:00Z" }
              as: DutyOfficer
              captures: { t2: $.data.id }
            - call: "POST /billing-periods"
              payload: { station_id: "${st_id}", period_code: "2026-04", window_start: "2026-04-01T00:00:00Z", window_end: "2026-04-30T23:59:00Z" }
              as: BillingController
              captures: { bp_id: $.data.id, bp_v1: $.data.version }
          trigger:
            - call: "POST /billing-lines"
              payload: { billing_period_id: "${bp_id}", turn_id: "${t1}", expected_billing_period_version: "${bp_v1}" }
              as: BillingController
              captures: { bl1: $.data.id }
            - call: "POST /billing-lines"
              payload: { billing_period_id: "${bp_id}", turn_id: "${t2}", expected_billing_period_version: "${bp_v1}" }
              as: BillingController
              captures: { err: $.data.error_id }
            - call: "GET /billing-periods/${bp_id}"
              payload: {}
              as: BillingController
              captures: { bp_v2: $.data.version, accrued_mid: $.data.accrued_cents, lines_mid: $.data.line_count }
            - call: "POST /billing-lines"
              payload: { billing_period_id: "${bp_id}", turn_id: "${t2}", expected_billing_period_version: "${bp_v2}" }
              as: BillingController
              captures: { bl2: $.data.id }
          assert:
            - "${err} == ERR_STALE_PERIOD_VERSION"
            - "HTTP status of the stale accrual is 412"
            - "${accrued_mid} == 18000"
            - "${lines_mid} == 1"
            - "${bp_v2} == ${bp_v1} + 1"
            - "BillingLine.${bl1}.status == PROVISIONAL"
            - "BillingLine.${bl2}.status == PROVISIONAL"
            - "BillingPeriod.${bp_id}.accrued_cents == 36000"
            - "BillingPeriod.${bp_id}.line_count == 2"
            - "Turn.${t2}.billed == true"

      - name: cascading_side_effects_layer
        claim_type: cascading_side_effects
        grounds:
          - state_machines.GseUnit.AVAILABLE_to_QUARANTINED
          - state_machines.Certification.VALID_to_REVOKED
        excluded_because:
          difficulty_instance: transitive_cascade / critical_gse_incident_four_hop_cascade
          rationale: "Both declared four-hop chains are asserted end to end there and in its sibling instance certification_revoke_four_hop_cascade, including the untouched-sibling checks that prove ordering."

      - name: dual_variant_calculation_layer
        claim_type: dual_variant_calculation
        grounds:
          - calculations.turn_service_charge
          - calculations.subcontractor_compliance_score
        excluded_because:
          difficulty_instance: dual_variant_calc / billing_line_provisional_vs_final_charge_diverges
          rationale: "Both declared dual-variant calculations are asserted numerically by the two §1.8 instances of that rule."

      - name: selector_policy_layer
        claim_type: conditional_feature_flags
        grounds:
          - calculations.gse_unit_selector
        excluded_because:
          difficulty_instance: resource_temporal_overlap / gse_buffered_half_open_interval_adjacency
          rationale: "The selector's eligibility filter shares the buffered-overlap predicate asserted there; its ranking, tie-break and empty-pool fallback are asserted by the §1.9 instances gse_selector_ranks_remaining_cycles_then_condition_then_created_at and gse_selector_with_empty_candidate_pool_returns_no_eligible_gse."

  # =======================================================================
  - section: consistency_model
    instances:

      - name: cascade_and_derived_fields_are_visible_immediately_after_the_request
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - calculations.resource_ledgers
          - calculations.staffing_coverage
          - entities.Turn.fields.assigned_gse_count
        distinguishing_aspect: "The consistency model is immediate: the POST /turn-resources response itself already carries the computed occupied_minutes, and the very next reads show Turn.status RESOURCED, GseUnit.committed_occupation_minutes 30 and FlightBank.staffing_coverage_pct 100.00 with no intervening call or delay."
        test_recipe:
          setup:
            - "Station ZRH is OPEN; FlightBank AM1 is PUBLISHED with staffing APPROVED and planned_headcount 1."
            - "Turn LX318 (TOWING_ONLY) already carries its agent occupation and is still SCHEDULED for lack of equipment."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-04-01T00:00:00Z" }
              as: StationManager
            - call: "POST /stations"
              payload: { iata_code: "ZRH", name: "Zurich", handler_code: "SWP", season_code: "SUMMER" }
              as: StationManager
              captures: { st_id: $.data.id }
            - call: "POST /stations/${st_id}/lifecycle"
              payload: { action: "OPEN" }
              as: StationManager
            - call: "POST /flight-banks"
              payload: { station_id: "${st_id}", bank_code: "AM1", season_code: "SUMMER", window_start: "2026-04-10T04:00:00Z", window_end: "2026-04-10T22:00:00Z", planned_headcount: 1 }
              as: DutyOfficer
              captures: { fb_id: $.data.id }
            - call: "POST /turns"
              payload: { station_id: "${st_id}", flight_bank_id: "${fb_id}", flight_number: "LX318", turn_type: "TOWING_ONLY", scheduled_in: "2026-04-10T06:00:00Z", scheduled_out: "2026-04-10T06:20:00Z" }
              as: DutyOfficer
              captures: { t_id: $.data.id, t_v: $.data.version }
            - call: "POST /agents"
              payload: { station_id: "${st_id}", employee_code: "E001", full_name: "Ana Ruiz" }
              as: StationManager
              captures: { a_id: $.data.id }
            - call: "POST /certifications"
              payload: { agent_id: "${a_id}", station_id: "${st_id}", cert_type: "RAMP_SAFETY", issued_at: "2026-01-01T00:00:00Z", expires_at: "2027-01-01T00:00:00Z" }
              as: StationManager
            - call: "POST /gse-units"
              payload: { station_id: "${st_id}", asset_tag: "TUG-01", gse_type: "PUSHBACK_TUG" }
              as: StationManager
              captures: { g_id: $.data.id }
            - call: "POST /flight-banks/${fb_id}/lifecycle"
              payload: { action: "PUBLISH" }
              as: DutyOfficer
            - call: "POST /flight-banks/${fb_id}/staffing-transitions"
              payload: { action: "SUBMIT" }
              as: DutyOfficer
            - call: "POST /flight-banks/${fb_id}/staffing-transitions"
              payload: { action: "APPROVE" }
              as: StationManager
            - call: "POST /turn-resources"
              payload: { turn_id: "${t_id}", resource_kind: "AGENT", agent_id: "${a_id}", role_on_turn: "RAMP", window_start: "2026-04-10T05:50:00Z", window_end: "2026-04-10T06:30:00Z", expected_turn_version: "${t_v}" }
              as: DutyOfficer
            - call: "GET /turns/${t_id}"
              payload: {}
              as: DutyOfficer
              captures: { t_v2: $.data.version, st_before: $.data.status }
          trigger:
            - call: "POST /turn-resources"
              payload: { turn_id: "${t_id}", resource_kind: "GSE", gse_unit_id: "${g_id}", window_start: "2026-04-10T05:55:00Z", window_end: "2026-04-10T06:25:00Z", expected_turn_version: "${t_v2}" }
              as: DutyOfficer
              captures: { tr_id: $.data.id, tr_minutes: $.data.occupied_minutes, tr_status: $.data.status }
            - call: "GET /turns/${t_id}"
              payload: {}
              as: DutyOfficer
              captures: { st_after: $.data.status, gc_after: $.data.assigned_gse_count }
            - call: "GET /gse-units/${g_id}"
              payload: {}
              as: DutyOfficer
              captures: { g_minutes: $.data.committed_occupation_minutes }
            - call: "GET /flight-banks/${fb_id}"
              payload: {}
              as: DutyOfficer
              captures: { cov: $.data.staffing_coverage_pct, ss: $.data.staffing_status }
          assert:
            - "${st_before} == SCHEDULED"
            - "${tr_minutes} == 30"
            - "${tr_status} == RESERVED"
            - "${st_after} == RESOURCED"
            - "${gc_after} == 1"
            - "${g_minutes} == 30"
            - "${cov} == 100.00"
            - "${ss} == APPROVED"
            - "every one of these observations is available on the first read after the mutating request, with no retry or delay"
