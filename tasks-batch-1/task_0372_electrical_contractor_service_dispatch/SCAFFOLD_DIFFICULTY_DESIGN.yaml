  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      # ---- ServiceJob.complete depends on Permit.status (Job->Permit pair)
      - name: cross_entity_job_complete_requires_permit_passed
        grounds:
          - state_machines.ServiceJob.IN_PROGRESS_to_COMPLETED
          - validations[priority=12]
          - errors[ERR_PERMIT_NOT_PASSED]
          - entities.Permit.fields.status
        distinguishing_aspect: |
          A ServiceJob's IN_PROGRESS -> COMPLETED transition is gated by a DIFFERENT entity's state:
          a requires_permit job cannot complete unless its Permit is PASSED; with the permit only
          INSPECTION_SCHEDULED, /complete fails ERR_PERMIT_NOT_PASSED (ServiceJob->Permit pair).
        test_recipe:
          setup:
            - "A PANEL job (requires_permit=true) carried to IN_PROGRESS with a permit that is INSPECTION_SCHEDULED (not PASSED)."
          setup_api_calls:
            - call: "POST /v1/customers"
              payload: { full_name: "CE1 Cust", email: "ce1@x.com", service_zip: "80001", phone: "555" }
              as: Dispatcher
              captures: { cust_id: $.data.id }
            - call: "POST /v1/technicians"
              payload: { full_name: "CE1 Tech", license_class: "MASTER", service_zone: "800", hourly_rate_cents: 10000, on_call: false }
              as: Dispatcher
              captures: { tech_id: $.data.id }
            - call: "POST /v1/service-jobs"
              payload: { customer_id: "${cust_id}", scope: "PANEL", job_class: "INSTALL", priority: "STANDARD" }
              as: Dispatcher
              captures: { job_id: $.data.id, job_v0: $.data.version }
            - call: "POST /v1/estimates"
              payload: { job_id: "${job_id}", pricing_mode: "FLAT_RATE", expected_job_version: "${job_v0}", flat_rate_cents: 50000 }
              as: Dispatcher
              captures: { est_id: $.data.id }
            - call: "POST /v1/estimates/${est_id}/send"
              payload: {}
              as: Dispatcher
            - call: "POST /v1/estimates/${est_id}/accept"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "GET /v1/service-jobs/${job_id}"
              payload: {}
              as: Dispatcher
              captures: { job_vacc: $.data.version }
            - call: "POST /v1/permits"
              payload: { job_id: "${job_id}", jurisdiction: "City", permit_number: "CE1-PN" }
              as: Dispatcher
              captures: { permit_id: $.data.id }
            - call: "POST /v1/permits/${permit_id}/issue"
              payload: {}
              as: Inspector
            - call: "POST /v1/permits/${permit_id}/schedule-inspection"
              payload: { inspection_at: "2026-07-14T09:00:00Z" }
              as: Dispatcher
            - call: "POST /v1/dispatches"
              payload: { job_id: "${job_id}", technician_id: "${tech_id}", window_start: "2026-07-14T10:00:00Z", window_end: "2026-07-14T11:00:00Z", expected_job_version: "${job_vacc}" }
              as: Dispatcher
              captures: { disp_id: $.data.id }
            - call: "POST /v1/dispatches/${disp_id}/depart"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /v1/dispatches/${disp_id}/arrive"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
          trigger:
            - call: "POST /v1/service-jobs/${job_id}/complete"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "data.error_id == ERR_PERMIT_NOT_PASSED"
            - "ServiceJob.${job_id}.status == IN_PROGRESS (unchanged)"

      # ---- Callback.resolve depends on parent ServiceJob.status (Callback->Job pair)
      - name: cross_entity_callback_resolve_requires_job_back_in_progress_done
        grounds:
          - state_machines.Callback.OPEN_to_RESOLVED
          - state_machines.ServiceJob.INVOICED_to_WARRANTY
          - errors[ERR_INVALID_STATE]
          - entities.ServiceJob.fields.status
        distinguishing_aspect: |
          A Callback's OPEN -> RESOLVED transition depends on a DIFFERENT entity pair than instance 1
          (Callback->ServiceJob, not ServiceJob->Permit): resolve is rejected with ERR_INVALID_STATE
          while the parent ServiceJob is still WARRANTY (its warranty rework not yet brought back to
          COMPLETED/INVOICED), even though the callback itself is OPEN.
        test_recipe:
          setup:
            - "A job carried to INVOICED with warranty_until in the future; clock set so the callback is covered."
            - "A warranty-covered callback is filed (job INVOICED -> WARRANTY, callback OPEN); the parent job remains in WARRANTY (no warranty rework performed)."
          setup_api_calls:
            - call: "POST /v1/_clock/set"
              payload: { to_iso8601: "2026-07-15T08:00:00Z" }
              as: Dispatcher
            - call: "POST /v1/customers"
              payload: { full_name: "CE2 Cust", email: "ce2@x.com", service_zip: "81001", phone: "555" }
              as: Dispatcher
              captures: { cust_id: $.data.id }
            - call: "POST /v1/technicians"
              payload: { full_name: "CE2 Tech", license_class: "JOURNEYMAN", service_zone: "810", hourly_rate_cents: 10000, on_call: false }
              as: Dispatcher
