            - "${err} == ERR_INSUFFICIENT_STOCK"
            - "HTTP 409"
            - "InventoryLot.${lot_id}.on_hand_units == 3 and tester_units == 0 and version is unchanged"

  # ==================================================================== rbac
  - section: rbac
    instances:
      - name: customer_cannot_create_products
        claim_type: role_denial
        grounds: ["roles.MerchandisingAdmin.exclusive_operations", "endpoints[POST /products]", "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "POST /products is MerchandisingAdmin-exclusive; a Customer attempt returns ERR_UNAUTHORIZED (403) and creates nothing."
        test_recipe:
          setup: ["One customer exists."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "rb1@x.com", name: "RB1" }
              as: MerchandisingAdmin
              captures: { cust_id: "$.data.id"}
          trigger:
            - call: "POST /products"
              payload: { name: "Sneaky", brand: "X", category: "MAKEUP", hygiene_class: "SEALED", base_price_cents: 100 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: "$.data.error_id"}
          assert:
            - "${err} == ERR_UNAUTHORIZED"
            - "HTTP 403"

      - name: store_associate_cannot_confirm_a_booking_reschedule
        claim_type: role_denial
        grounds: ["roles.BeautyArtist.exclusive_operations", "endpoints[POST /service-bookings/{id}/confirm]", "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "Peer-role separation: confirm is BeautyArtist-exclusive, so a StoreAssociate (who may cancel the same booking) is rejected with ERR_UNAUTHORIZED (403) and the booking stays RESCHEDULE_PENDING."
        test_recipe:
          setup: ["A booking in RESCHEDULE_PENDING with a proposed start of 2026-06-05T13:00:00Z."]
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "SEP-CA", region_code: "CA" }
              as: MerchandisingAdmin
              captures: { store_id: "$.data.id"}
            - call: "POST /artists"
              payload: { store_id: "${store_id}", name: "Ada", skills: [ "BROW" ] }
              as: MerchandisingAdmin
              captures: { artist_id: "$.data.id"}
            - call: "POST /customers"
              payload: { email: "rb2@x.com", name: "RB2" }
              as: MerchandisingAdmin
              captures: { cust_id: "$.data.id"}
            - call: "POST /service-bookings"
              payload: { customer_id: "${cust_id}", store_id: "${store_id}", artist_id: "${artist_id}", service_type: "BROW", start_at: "2026-06-05T10:00:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { bk_id: "$.data.id"}
            - call: "POST /service-bookings/${bk_id}/reschedule"
              payload: { proposed_start_at: "2026-06-05T13:00:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /service-bookings/${bk_id}/confirm"
              payload: {}
              as: StoreAssociate
              captures: { err: "$.data.error_id"}
          assert:
            - "${err} == ERR_UNAUTHORIZED"
            - "HTTP 403"
            - "ServiceBooking.${bk_id}.status == RESCHEDULE_PENDING and reschedule_count == 0"

      - name: customer_cannot_decide_their_own_return_request
        claim_type: role_denial
        grounds: ["roles.StoreAssociate.exclusive_operations", "endpoints[POST /return-requests/{id}/decision]", "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "Segregation between the filer and the decider: the Customer who created the ReturnRequest cannot approve it (ERR_UNAUTHORIZED, 403); no refund is issued."
        test_recipe:
          setup: ["A SHIPPED, CAPTURED order with a REQUESTED return for 1 SEALED unit at 2500."]
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "SEP-CA", region_code: "CA" }
              as: MerchandisingAdmin
              captures: { store_id: "$.data.id"}
            - call: "POST /products"
              payload: { name: "Lipstick", brand: "Aurea", category: "MAKEUP", hygiene_class: "SEALED", base_price_cents: 2500 }
              as: MerchandisingAdmin
              captures: { prod_id: "$.data.id"}
            - call: "POST /products/${prod_id}/variants"
              payload: { shade_name: "Rose", shade_code: "RS-01", finish: "SATIN", undertone: "COOL", depth_index: 5, price_cents: 2500 }
              as: MerchandisingAdmin
              captures: { v_id: "$.data.id"}
            - call: "POST /inventory-lots"
              payload: { store_id: "${store_id}", variant_id: "${v_id}", units_received: 10 }
              as: MerchandisingAdmin
            - call: "POST /customers"
              payload: { email: "rb3@x.com", name: "RB3" }
              as: MerchandisingAdmin
              captures: { cust_id: "$.data.id"}
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", store_id: "${store_id}", channel: "SHIP_FROM_STORE", lines: [ { variant_id: "${v_id}", quantity: 1 } ] }
              as: StoreAssociate
              captures: { order_id: "$.data.id"}
            - call: "POST /orders/${order_id}/reserve"
              payload: {}
              as: StoreAssociate
            - call: "POST /orders/${order_id}/payments"
              payload: { action: "AUTHORIZE" }
              as: StoreAssociate
            - call: "POST /orders/${order_id}/payments"
              payload: { action: "CAPTURE" }
              as: StoreAssociate
            - call: "POST /orders/${order_id}/fulfillment"
              payload: { action: "SHIP" }
              as: StoreAssociate
            - call: "GET /order-lines"
              payload: {}
              as: StoreAssociate
              captures: { line_id: "$.data[0].id"}
            - call: "POST /return-requests"
              payload: { order_line_id: "${line_id}", quantity: 1, reason: "CHANGED_MIND" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { rr_id: "$.data.id"}
          trigger:
            - call: "POST /return-requests/${rr_id}/decision"
              payload: { decision: "APPROVE" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: "$.data.error_id"}
          assert:
            - "${err} == ERR_UNAUTHORIZED"
            - "HTTP 403"
            - "ReturnRequest.${rr_id}.status == REQUESTED and Order.${order_id}.refunded_cents == 0"

      - name: customer_cannot_read_another_customers_record
        claim_type: role_denial
        grounds: ["validations[priority=6]", "roles.Customer.identity", "errors[ERR_FORBIDDEN_OWNERSHIP]"]
        distinguishing_aspect: "Customer identity is entity_backed:Customer, so X-User-ID must equal the path id: reading another customer's record returns ERR_FORBIDDEN_OWNERSHIP (403), not 404."
        test_recipe:
          setup: ["Two customers A and B exist."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "own-a@x.com", name: "Own A" }
              as: MerchandisingAdmin
              captures: { cust_a: "$.data.id"}
            - call: "POST /customers"
              payload: { email: "own-b@x.com", name: "Own B" }
              as: MerchandisingAdmin
              captures: { cust_b: "$.data.id"}
          trigger:
            - call: "GET /customers/${cust_a}"
              payload: {}
              as: Customer
              as_user_id: "${cust_b}"
              captures: { err: "$.data.error_id"}
          assert:
            - "${err} == ERR_FORBIDDEN_OWNERSHIP"
            - "HTTP 403"
            - "GET /customers/${cust_a} as Customer with X-User-ID ${cust_a} returns 200"

      - name: missing_role_header_returns_unauthenticated
        claim_type: role_denial
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "Authentication precedes everything: a request with no X-User-Role / X-User-ID headers returns ERR_UNAUTHENTICATED (401) even on a read that would otherwise 404."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "GET /stores/bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb"
              payload: {}
              as: MerchandisingAdmin
              captures: { err: "$.data.error_id"}
          assert:
            - "the test sends NO X-User-Role and NO X-User-ID header (the `as:` value above is the schema placeholder only)"
            - "${err} == ERR_UNAUTHENTICATED"
            - "HTTP 401 — the 404 for the unknown store is never reached"

  # ================================================ cross_cutting_layers
  - section: cross_cutting_layers
    instances:
      - name: stale_lot_version_on_tester_conversion_returns_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[tester-conversion-stale-lot]", "errors[ERR_STALE_LOT_VERSION]", "endpoints[POST /inventory-lots/{id}/tester-conversions]"]
        distinguishing_aspect: "A first tester conversion bumps InventoryLot.version; a second conversion still carrying the pre-conversion version is rejected with ERR_STALE_LOT_VERSION (412), while re-reading the lot and retrying with the current version succeeds."
        test_recipe:
          setup: ["SEALED lot with units_received 10 (version 1 at creation)."]
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "SEP-CA", region_code: "CA" }
              as: MerchandisingAdmin
              captures: { store_id: "$.data.id"}
            - call: "POST /products"
              payload: { name: "Lipstick", brand: "Aurea", category: "MAKEUP", hygiene_class: "SEALED", base_price_cents: 2500 }
              as: MerchandisingAdmin
              captures: { prod_id: "$.data.id"}
            - call: "POST /products/${prod_id}/variants"
              payload: { shade_name: "Rose", shade_code: "RS-01", finish: "SATIN", undertone: "COOL", depth_index: 5, price_cents: 2500 }
              as: MerchandisingAdmin
              captures: { v_id: "$.data.id"}
            - call: "POST /inventory-lots"
              payload: { store_id: "${store_id}", variant_id: "${v_id}", units_received: 10 }
              as: MerchandisingAdmin
              captures: { lot_id: "$.data.id", lot_v0: "$.data.version"}
            - call: "POST /inventory-lots/${lot_id}/tester-conversions"
              payload: { units: 1, expected_lot_version: "${lot_v0}" }
              as: StoreAssociate
              captures: { lot_v1: "$.data.version", tu1: "$.data.tester_units"}
          trigger:
            - call: "POST /inventory-lots/${lot_id}/tester-conversions"
              payload: { units: 1, expected_lot_version: "${lot_v0}" }
              as: StoreAssociate
              captures: { err: "$.data.error_id"}
            - call: "POST /inventory-lots/${lot_id}/tester-conversions"
              payload: { units: 1, expected_lot_version: "${lot_v1}" }
              as: StoreAssociate
              captures: { tu2: "$.data.tester_units", lot_v2: "$.data.version"}
          assert:
            - "${tu1} == 1 and ${lot_v1} == ${lot_v0} + 1"
            - "${err} == ERR_STALE_LOT_VERSION and HTTP 412 for the retry with the stale version"
            - "${tu2} == 2 and ${lot_v2} == ${lot_v1} + 1 for the retry with the current version"
            - "InventoryLot.${lot_id}.on_hand_units == 8 (only 2 conversions landed, not 3)"

      - name: stale_order_version_on_line_add_returns_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[line-add-stale-order]", "errors[ERR_STALE_ORDER_VERSION]", "endpoints[POST /orders/{id}/lines]"]
        distinguishing_aspect: "A DIFFERENT OCC parent (Order, not InventoryLot): after one line add supersedes the quote, a second add still carrying the pre-add version is rejected with ERR_STALE_ORDER_VERSION (412) and the order keeps exactly 2 lines."
        test_recipe:
          setup: ["DRAFT order with one 2500-cent line."]
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "SEP-CA", region_code: "CA" }
              as: MerchandisingAdmin
              captures: { store_id: "$.data.id"}
            - call: "POST /products"
              payload: { name: "Lipstick", brand: "Aurea", category: "MAKEUP", hygiene_class: "SEALED", base_price_cents: 2500 }
              as: MerchandisingAdmin
              captures: { prod_id: "$.data.id"}
            - call: "POST /products/${prod_id}/variants"
              payload: { shade_name: "Rose", shade_code: "RS-01", finish: "SATIN", undertone: "COOL", depth_index: 5, price_cents: 2500 }
              as: MerchandisingAdmin
              captures: { v_id: "$.data.id"}
            - call: "POST /inventory-lots"
              payload: { store_id: "${store_id}", variant_id: "${v_id}", units_received: 10 }
              as: MerchandisingAdmin
            - call: "POST /customers"
              payload: { email: "occ2@x.com", name: "OCC2" }
              as: MerchandisingAdmin
              captures: { cust_id: "$.data.id"}
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", store_id: "${store_id}", channel: "SHIP_FROM_STORE", lines: [ { variant_id: "${v_id}", quantity: 1 } ] }
              as: StoreAssociate
              captures: { order_id: "$.data.id", ov0: "$.data.version"}
            - call: "POST /orders/${order_id}/lines"
              payload: { variant_id: "${v_id}", quantity: 1, expected_order_version: "${ov0}" }
              as: StoreAssociate
              captures: { ov1: "$.data.version"}
          trigger:
            - call: "POST /orders/${order_id}/lines"
              payload: { variant_id: "${v_id}", quantity: 1, expected_order_version: "${ov0}" }
              as: StoreAssociate
              captures: { err: "$.data.error_id"}
          assert:
            - "${ov1} == ${ov0} + 1"
            - "${err} == ERR_STALE_ORDER_VERSION"
            - "HTTP 412"
            - "GET /order-lines?order_id=${order_id} still returns exactly 2 rows"
            - "Order.${order_id}.subtotal_cents == 5000 (the rejected add did not reprice)"

      - name: gwp_line_silently_skipped_when_the_gift_variant_is_out_of_stock
        claim_type: cascading_side_effects
        grounds: ["state_machines.Order.DRAFT_to_RESERVED", "calculations.order_pricing", "entities.Promotion.fields.gift_variant_id"]
        distinguishing_aspect: "Conditional cascade: the threshold is met (discounted_subtotal 7500 >= 7500) and gwp_eligible is true, but the gift variant's lot has 0 drawable units, so NO GWP line is created and the reserve still succeeds with total_due 7500."
        test_recipe:
          setup: ["GWP threshold 7500 gifting V_GIFT, whose lot at SEP-CA has units_received 0."]
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "SEP-CA", region_code: "CA" }
              as: MerchandisingAdmin
              captures: { store_id: "$.data.id"}
            - call: "POST /products"
              payload: { name: "Velvet Lip", brand: "Aurea", category: "MAKEUP", hygiene_class: "SEALED", base_price_cents: 2500 }
              as: MerchandisingAdmin
              captures: { prod_id: "$.data.id"}
            - call: "POST /products/${prod_id}/variants"
              payload: { shade_name: "Warm Sand", shade_code: "WS-01", finish: "MATTE", undertone: "WARM", depth_index: 6, price_cents: 2500 }
              as: MerchandisingAdmin
              captures: { v_sale_id: "$.data.id"}
            - call: "POST /products"
              payload: { name: "Mini Serum", brand: "Aurea", category: "SKINCARE", hygiene_class: "SEALED", base_price_cents: 0 }
              as: MerchandisingAdmin
              captures: { gift_prod_id: "$.data.id"}
            - call: "POST /products/${gift_prod_id}/variants"
              payload: { shade_name: "Universal", shade_code: "UNI-00", finish: "DEWY", undertone: "NEUTRAL", depth_index: 6, price_cents: 0 }
              as: MerchandisingAdmin
              captures: { v_gift_id: "$.data.id"}
            - call: "POST /inventory-lots"
              payload: { store_id: "${store_id}", variant_id: "${v_sale_id}", units_received: 10 }
              as: MerchandisingAdmin
            - call: "POST /inventory-lots"
              payload: { store_id: "${store_id}", variant_id: "${v_gift_id}", units_received: 0 }
              as: MerchandisingAdmin
              captures: { gift_lot_id: "$.data.id"}
            - call: "POST /promotions"
              payload: { name: "GWP 75", promo_type: "GWP", threshold_cents: 7500, gift_variant_id: "${v_gift_id}", gift_quantity: 1, priority: 10, status: "ACTIVE" }
              as: MerchandisingAdmin
              captures: { promo_id: "$.data.id"}
            - call: "POST /customers"
              payload: { email: "oos@x.com", name: "OOS" }
              as: MerchandisingAdmin
              captures: { cust_id: "$.data.id"}
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", store_id: "${store_id}", channel: "SHIP_FROM_STORE", lines: [ { variant_id: "${v_sale_id}", quantity: 3 } ] }
              as: StoreAssociate
              captures: { order_id: "$.data.id"}
          trigger:
            - call: "POST /orders/${order_id}/reserve"
              payload: {}
              as: StoreAssociate
              captures: { ful: "$.data.fulfillment_status", total: "$.data.total_due_cents"}
          assert:
            - "${ful} == RESERVED (the missing gift does not fail the reserve)"
            - "${total} == 7500"
            - "GET /order-lines?promotion_id=${promo_id} returns 0 rows"
            - "GET /order-lines?order_id=${order_id} returns exactly 1 row"
            - "InventoryLot.${gift_lot_id}.on_hand_units == 0 and reserved_units == 0"

      - name: bopis_slot_counter_releases_when_a_reserved_order_is_cancelled
        claim_type: cascading_side_effects
        grounds: ["resource_overlap[bopis_slot_capacity]", "state_machines.Order.RESERVED_to_CANCELLED"]
        distinguishing_aspect: "Slot occupancy counts only RESERVED/READY orders: cancelling one of the two orders in a full 14:00 bucket drops the count to 1, so the previously rejected third order now reserves successfully."
        test_recipe:
          setup: ["Store capacity 2; two RESERVED BOPIS orders in the 2026-06-05T14:00:00Z slot; a third DRAFT order for the same slot."]
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "SEP-CA", region_code: "CA", bopis_slot_capacity: 2 }
              as: MerchandisingAdmin
              captures: { store_id: "$.data.id"}
            - call: "POST /products"
              payload: { name: "Lipstick", brand: "Aurea", category: "MAKEUP", hygiene_class: "SEALED", base_price_cents: 2500 }
              as: MerchandisingAdmin
              captures: { prod_id: "$.data.id"}
            - call: "POST /products/${prod_id}/variants"
              payload: { shade_name: "Rose", shade_code: "RS-01", finish: "SATIN", undertone: "COOL", depth_index: 5, price_cents: 2500 }
              as: MerchandisingAdmin
              captures: { v_id: "$.data.id"}
            - call: "POST /inventory-lots"
              payload: { store_id: "${store_id}", variant_id: "${v_id}", units_received: 10 }
              as: MerchandisingAdmin
            - call: "POST /customers"
              payload: { email: "slt2@x.com", name: "Slt2" }
              as: MerchandisingAdmin
              captures: { cust_id: "$.data.id"}
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", store_id: "${store_id}", channel: "BOPIS", pickup_slot_start: "2026-06-05T14:00:00Z", lines: [ { variant_id: "${v_id}", quantity: 1 } ] }
              as: StoreAssociate
              captures: { o1_id: "$.data.id"}
            - call: "POST /orders/${o1_id}/reserve"
              payload: {}
              as: StoreAssociate
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", store_id: "${store_id}", channel: "BOPIS", pickup_slot_start: "2026-06-05T14:00:00Z", lines: [ { variant_id: "${v_id}", quantity: 1 } ] }
              as: StoreAssociate
              captures: { o2_id: "$.data.id"}
            - call: "POST /orders/${o2_id}/reserve"
              payload: {}
              as: StoreAssociate
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", store_id: "${store_id}", channel: "BOPIS", pickup_slot_start: "2026-06-05T14:00:00Z", lines: [ { variant_id: "${v_id}", quantity: 1 } ] }
              as: StoreAssociate
              captures: { o3_id: "$.data.id"}
          trigger:
            - call: "POST /orders/${o1_id}/cancel"
              payload: {}
              as: StoreAssociate
            - call: "POST /orders/${o3_id}/reserve"
              payload: {}
              as: StoreAssociate
              captures: { o3_status: "$.data.fulfillment_status"}
          assert:
            - "${o3_status} == RESERVED"
            - "Order.${o1_id}.fulfillment_status == CANCELLED"
            - "the 14:00 bucket again holds exactly 2 occupying orders (${o2_id} and ${o3_id})"

      - name: error_stale_order_version_covered_by_difficulty_design
        claim_type: violation_to_error
        grounds: ["errors[ERR_STALE_ORDER_VERSION]"]
        excluded_because:
          difficulty_instance: compensating_invariant / inventory_units_received_conserved_across_tester_reserve_and_cancel
          rationale: "The OCC surface for both parents is already exercised end-to-end by the §1.9 optimistic_concurrency instances above and grounded in the §1.8 invariant instance that drives the tester conversion; no additional corner is needed."

  # ================================================== consistency_model
  - section: consistency_model
    instances:
      - name: reserve_response_reflects_every_cascade_in_the_same_request
        claim_type: immediate
        grounds: ["complexity_profile.consistency_model", "state_machines.Order.DRAFT_to_RESERVED", "entities.Customer.fields.points_balance"]
        distinguishing_aspect: "consistency_model is immediate: the POST /reserve response itself already carries the FINAL pricing, and an immediately following GET of the customer and lot shows the REDEEM debit and the inventory draw with no lag or re-read loop."
        test_recipe:
          setup: ["Customer seeded with 500 points; lot of 10 units of a 2500-cent SEALED variant; DRAFT order for 2 units redeeming 300 points."]
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "SEP-CA", region_code: "CA" }
              as: MerchandisingAdmin
              captures: { store_id: "$.data.id"}
            - call: "POST /products"
              payload: { name: "Lipstick", brand: "Aurea", category: "MAKEUP", hygiene_class: "SEALED", base_price_cents: 2500 }
              as: MerchandisingAdmin
              captures: { prod_id: "$.data.id"}
            - call: "POST /products/${prod_id}/variants"
              payload: { shade_name: "Rose", shade_code: "RS-01", finish: "SATIN", undertone: "COOL", depth_index: 5, price_cents: 2500 }
              as: MerchandisingAdmin
              captures: { v_id: "$.data.id"}
            - call: "POST /inventory-lots"
              payload: { store_id: "${store_id}", variant_id: "${v_id}", units_received: 10 }
              as: MerchandisingAdmin
              captures: { lot_id: "$.data.id"}
            - call: "POST /customers"
              payload: { email: "imm2@x.com", name: "Imm2", initial_points: 500 }
              as: MerchandisingAdmin
              captures: { cust_id: "$.data.id"}
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", store_id: "${store_id}", channel: "SHIP_FROM_STORE", points_redeemed: 300, lines: [ { variant_id: "${v_id}", quantity: 2 } ] }
              as: StoreAssociate
              captures: { order_id: "$.data.id"}
          trigger:
            - call: "POST /orders/${order_id}/reserve"
              payload: {}
              as: StoreAssociate
              captures: { pv: "$.data.pricing_variant", total: "$.data.total_due_cents"}
            - call: "GET /customers/${cust_id}"
              payload: {}
              as: MerchandisingAdmin
              captures: { bal: "$.data.points_balance"}
            - call: "GET /inventory-lots/${lot_id}"
              payload: {}
              as: StoreAssociate
              captures: { oh: "$.data.on_hand_units", rv: "$.data.reserved_units"}
          assert:
            - "${pv} == FINAL and ${total} == 3500 in the reserve response itself"
            - "${bal} == 200 on the very next read (500 - 300 REDEEM)"
            - "${oh} == 8 and ${rv} == 2 on the very next read"
