        test_recipe:
          setup:
            - "Fund R2B-style (fee 0) with partners A and B (5000bps each); TaxYear 2025 (net ordinary 1000000) with LOCKED FINAL run (500000 each); DRAFT composite filing NY apportionment 3001bps rate 700bps min_income_cents 150050"
          setup_api_calls:
            - call: "POST /funds"
              payload: { legal_name: "Fund R6A", ein: "11-0000012", waterfall_hurdle_rate_bps: 800, waterfall_catchup_bps: 2000, waterfall_carry_bps: 2000, foreign_ownership_cap_pct_bps: 10000, management_fee_rate_bps: 0, fee_discount_threshold_cents: 1, fee_discount_bps: 0 }
              as: FundTaxAdmin
              captures: { f: "$.data.id" }
            - call: "POST /funds/partners"
              payload: { fund_id: "${f}", legal_name: "A", partner_type: US_INDIVIDUAL, partner_class: LIMITED, residency_state: "CA", ownership_pct_bps: 5000, capital_commitment_cents: 1, admission_date: "2025-01-01" }
              as: FundTaxAdmin
              captures: { p_a: "$.data.id" }
            - call: "POST /funds/partners"
              payload: { fund_id: "${f}", legal_name: "B", partner_type: US_ENTITY, partner_class: LIMITED, residency_state: "DE", ownership_pct_bps: 5000, capital_commitment_cents: 1, admission_date: "2025-01-01" }
              as: FundTaxAdmin
              captures: { p_b: "$.data.id" }
            - call: "POST /funds/tax-years"
              payload: { fund_id: "${f}", year: 2025, gross_ordinary_income_cents: 1000000, capital_gain_cents: 0, interest_income_cents: 0 }
              as: FundTaxAdmin
              captures: { ty: "$.data.id" }
            - call: "POST /funds/tax-years/${ty}/close-books"
              payload: {}
              as: FundTaxAdmin
              captures: { ty_v: "$.data.version" }
            - call: "POST /funds/allocation-runs"
              payload: { tax_year_id: "${ty}", run_kind: FINAL, expected_tax_year_version: "${ty_v}" }
              as: TaxPreparer
              captures: { run: "$.data.id" }
            - call: "POST /funds/allocation-runs/${run}/lock"
              payload: {}
              as: TaxReviewer
            - call: "POST /funds/composite-filings"
              payload: { tax_year_id: "${ty}", state_code: "NY", apportionment_pct_bps: 3001, composite_rate_bps: 700, min_income_cents: 150050 }
              as: TaxPreparer
              captures: { cf: "$.data.id" }
          trigger:
            - call: "POST /funds/composite-filings/${cf}/file"
              payload: {}
              as: TaxPreparer
          assert:
            - "CompositeFiling.${cf}.status == FILED (no ERR_COMPOSITE_PARTNER_INELIGIBLE)"
            - "included_partner_ids == [${p_a}, ${p_b}] — state-source income 150050 equals the inclusive minimum and both partners are included"
            - "total_composite_tax_cents == 21008"

      - name: withdraw_zero_capital_boundary
        grounds:
          - state_machines.Partner
          - validations[priority=15]
          - errors[ERR_PARTNER_CAPITAL_NOT_ZERO]
        distinguishing_aspect: |
          Metric: exact zero of capital_account_balance_cents (an equality edge,
          not a threshold crossing), reached via POST /funds/partners/{id}/withdraw:
          a DISTRIBUTION equal to the full balance (equal is allowed) drives the
          balance to exactly 0 and withdraw succeeds.
        test_recipe:
          setup:
            - "Fund with one partner W (10000bps); TaxYear 2025; CONTRIBUTION 500000 (2025-01-15) then DISTRIBUTION 500000 (2025-02-01) leaving capital exactly 0"
          setup_api_calls:
            - call: "POST /funds"
              payload: { legal_name: "Fund R6B", ein: "11-0000013", waterfall_hurdle_rate_bps: 800, waterfall_catchup_bps: 2000, waterfall_carry_bps: 2000, foreign_ownership_cap_pct_bps: 10000, management_fee_rate_bps: 0, fee_discount_threshold_cents: 1, fee_discount_bps: 0 }
              as: FundTaxAdmin
              captures: { f: "$.data.id" }
            - call: "POST /funds/partners"
              payload: { fund_id: "${f}", legal_name: "W", partner_type: US_INDIVIDUAL, partner_class: LIMITED, residency_state: "CA", ownership_pct_bps: 10000, capital_commitment_cents: 1, admission_date: "2025-01-01" }
              as: FundTaxAdmin
              captures: { p: "$.data.id" }
            - call: "POST /funds/tax-years"
              payload: { fund_id: "${f}", year: 2025, gross_ordinary_income_cents: 0, capital_gain_cents: 0, interest_income_cents: 0 }
              as: FundTaxAdmin
              captures: { ty: "$.data.id" }
            - call: "POST /funds/capital-events"
              payload: { partner_id: "${p}", tax_year_id: "${ty}", event_type: CONTRIBUTION, amount_cents: 500000, effective_date: "2025-01-15" }
              as: TaxPreparer
            - call: "POST /funds/capital-events"
              payload: { partner_id: "${p}", tax_year_id: "${ty}", event_type: DISTRIBUTION, amount_cents: 500000, effective_date: "2025-02-01" }
              as: TaxPreparer
          trigger:
            - call: "POST /funds/partners/${p}/withdraw"
              payload: {}
              as: FundTaxAdmin
          assert:
            - "withdraw succeeds: Partner.${p}.status == WITHDRAWN"
            - "Partner.${p}.capital_account_balance_cents == 0 exactly (the DISTRIBUTION of the full balance was allowed)"

  # ===========================================================================
  # Rule 7 — cross_entity_state_dependency (different entity pairs)
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: final_run_requires_books_closed_tax_year
        grounds:
          - state_machines.AllocationRun
          - state_machines.TaxYear
          - errors[ERR_TAX_YEAR_NOT_BOOKS_CLOSED]
        distinguishing_aspect: |
          Pair AllocationRun -> TaxYear: a FINAL run is rejected while the tax
          year is OPEN, yet the same endpoint accepts a PROVISIONAL run against
          the identical OPEN state — the valid transition set depends on the
          sibling entity's state.
        test_recipe:
          setup:
            - "Fund with one partner; TaxYear 2025 in initial state OPEN (version 1)"
          setup_api_calls:
            - call: "POST /funds"
              payload: { legal_name: "Fund R7A", ein: "11-0000014", waterfall_hurdle_rate_bps: 800, waterfall_catchup_bps: 2000, waterfall_carry_bps: 2000, foreign_ownership_cap_pct_bps: 10000, management_fee_rate_bps: 0, fee_discount_threshold_cents: 1, fee_discount_bps: 0 }
              as: FundTaxAdmin
              captures: { f: "$.data.id" }
            - call: "POST /funds/partners"
              payload: { fund_id: "${f}", legal_name: "LP", partner_type: US_INDIVIDUAL, partner_class: LIMITED, residency_state: "CA", ownership_pct_bps: 10000, capital_commitment_cents: 1, admission_date: "2025-01-01" }
              as: FundTaxAdmin
            - call: "POST /funds/tax-years"
              payload: { fund_id: "${f}", year: 2025, gross_ordinary_income_cents: 1000000, capital_gain_cents: 0, interest_income_cents: 0 }
              as: FundTaxAdmin
              captures: { ty: "$.data.id", ty_v: "$.data.version" }
          trigger:
            - call: "POST /funds/allocation-runs"
              payload: { tax_year_id: "${ty}", run_kind: FINAL, expected_tax_year_version: "${ty_v}" }
              as: TaxPreparer
              captures: { e_final: "$.data.error_id" }
            - call: "POST /funds/allocation-runs"
              payload: { tax_year_id: "${ty}", run_kind: PROVISIONAL, expected_tax_year_version: "${ty_v}" }
              as: TaxPreparer
              captures: { run_prov: "$.data.id" }
          assert:
            - "FINAL create fails with error_id == ERR_TAX_YEAR_NOT_BOOKS_CLOSED while TaxYear is OPEN"
            - "PROVISIONAL create against the same OPEN tax year succeeds: AllocationRun.${run_prov}.status == COMPUTED"

      - name: transfer_confirm_requires_active_partners
        grounds:
          - state_machines.OwnershipTransfer
          - state_machines.Partner
          - errors[ERR_INVALID_STATE_TRANSITION]
        distinguishing_aspect: |
          Pair OwnershipTransfer -> Partner (different pair than
          AllocationRun -> TaxYear): confirm is rejected because the transferee's
          Partner.status is WITHDRAWN, even though the transfer itself is in a
          valid from-state (PROPOSED).
        test_recipe:
          setup:
            - "Fund with partners T1 (6000bps) and T2 (4000bps), no capital events; T2 withdrawn (capital exactly 0, no K1s)"
            - "PROPOSED transfer T1 -> T2 of 1000bps (effective 2025-03-01, settlement 2025-03-05)"
          setup_api_calls:
            - call: "POST /funds"
              payload: { legal_name: "Fund R7B", ein: "11-0000015", waterfall_hurdle_rate_bps: 800, waterfall_catchup_bps: 2000, waterfall_carry_bps: 2000, foreign_ownership_cap_pct_bps: 10000, management_fee_rate_bps: 0, fee_discount_threshold_cents: 1, fee_discount_bps: 0 }
              as: FundTaxAdmin
              captures: { f: "$.data.id" }
            - call: "POST /funds/partners"
              payload: { fund_id: "${f}", legal_name: "T1", partner_type: US_INDIVIDUAL, partner_class: LIMITED, residency_state: "CA", ownership_pct_bps: 6000, capital_commitment_cents: 1, admission_date: "2025-01-01" }
              as: FundTaxAdmin
              captures: { t1: "$.data.id" }
            - call: "POST /funds/partners"
              payload: { fund_id: "${f}", legal_name: "T2", partner_type: US_ENTITY, partner_class: LIMITED, residency_state: "DE", ownership_pct_bps: 4000, capital_commitment_cents: 1, admission_date: "2025-01-01" }
              as: FundTaxAdmin
              captures: { t2: "$.data.id" }
            - call: "POST /funds/tax-years"
              payload: { fund_id: "${f}", year: 2025, gross_ordinary_income_cents: 0, capital_gain_cents: 0, interest_income_cents: 0 }
              as: FundTaxAdmin
            - call: "POST /funds/partners/${t2}/withdraw"
              payload: {}
              as: FundTaxAdmin
            - call: "POST /funds/transfers"
              payload: { fund_id: "${f}", transferor_partner_id: "${t1}", transferee_partner_id: "${t2}", pct_bps: 1000, effective_date: "2025-03-01", settlement_date: "2025-03-05" }
              as: FundTaxAdmin
              captures: { tr: "$.data.id" }
          trigger:
            - call: "POST /funds/transfers/${tr}/confirm"
              payload: {}
              as: FundTaxAdmin
              captures: { e: "$.data.error_id" }
          assert:
            - "confirm fails with error_id == ERR_INVALID_STATE_TRANSITION (transferee Partner.status == WITHDRAWN)"
            - "OwnershipTransfer.${tr}.status remains PROPOSED"

  # ===========================================================================
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: special_allocation_half_open_adjacency
        grounds:
          - state_machines.SpecialAllocation
          - validations[priority=9]
          - errors[ERR_SPECIAL_ALLOCATION_OVERLAP]
        distinguishing_aspect: |
          Half-open interval semantics on SpecialAllocation: [2025-01-01,
          2025-07-01) and [2025-07-01, 2026-01-01) touch and BOTH approve, while
          [2025-06-01, 2025-08-01) properly intersects and is rejected — touching
          endpoints are not overlaps here.
        test_recipe:
          setup:
            - "Fund with one partner and TaxYear 2025 in OPEN"
            - "SA1 APPROVED for (ty, partner, ORDINARY) [2025-01-01, 2025-07-01); SA2 APPROVED [2025-07-01, 2026-01-01) (adjacent at 2025-07-01)"
            - "SA3 PROPOSED [2025-06-01, 2025-08-01) for the same (ty, partner, ORDINARY)"
          setup_api_calls:
            - call: "POST /funds"
              payload: { legal_name: "Fund R8A", ein: "11-0000016", waterfall_hurdle_rate_bps: 800, waterfall_catchup_bps: 2000, waterfall_carry_bps: 2000, foreign_ownership_cap_pct_bps: 10000, management_fee_rate_bps: 0, fee_discount_threshold_cents: 1, fee_discount_bps: 0 }
              as: FundTaxAdmin
              captures: { f: "$.data.id" }
            - call: "POST /funds/partners"
              payload: { fund_id: "${f}", legal_name: "LP", partner_type: US_INDIVIDUAL, partner_class: LIMITED, residency_state: "CA", ownership_pct_bps: 10000, capital_commitment_cents: 1, admission_date: "2025-01-01" }
              as: FundTaxAdmin
              captures: { p: "$.data.id" }
            - call: "POST /funds/tax-years"
              payload: { fund_id: "${f}", year: 2025, gross_ordinary_income_cents: 1000000, capital_gain_cents: 0, interest_income_cents: 0 }
              as: FundTaxAdmin
              captures: { ty: "$.data.id" }
            - call: "POST /funds/special-allocations"
              payload: { tax_year_id: "${ty}", partner_id: "${p}", category: ORDINARY, target_pct_bps: 4000, effective_from: "2025-01-01", effective_to: "2025-07-01" }
              as: TaxPreparer
              as_user_id: prep_1
              captures: { sa1: "$.data.id" }
            - call: "POST /funds/special-allocations/${sa1}/approve"
              payload: {}
              as: TaxReviewer
              as_user_id: rev_1
            - call: "POST /funds/special-allocations"
              payload: { tax_year_id: "${ty}", partner_id: "${p}", category: ORDINARY, target_pct_bps: 4000, effective_from: "2025-07-01", effective_to: "2026-01-01" }
              as: TaxPreparer
              as_user_id: prep_1
              captures: { sa2: "$.data.id" }
            - call: "POST /funds/special-allocations/${sa2}/approve"
              payload: {}
              as: TaxReviewer
              as_user_id: rev_1
            - call: "POST /funds/special-allocations"
              payload: { tax_year_id: "${ty}", partner_id: "${p}", category: ORDINARY, target_pct_bps: 1000, effective_from: "2025-06-01", effective_to: "2025-08-01" }
              as: TaxPreparer
              as_user_id: prep_1
              captures: { sa3: "$.data.id" }
          trigger:
            - call: "POST /funds/special-allocations/${sa3}/approve"
              payload: {}
              as: TaxReviewer
              as_user_id: rev_1
              captures: { e: "$.data.error_id" }
          assert:
            - "SA1 and SA2 both reached APPROVED — adjacency (effective_to == effective_from) is NOT an overlap under half-open semantics"
            - "SA3 approve fails with error_id == ERR_SPECIAL_ALLOCATION_OVERLAP"
            - "SpecialAllocation.${sa3}.status remains PROPOSED"

      - name: transfer_closed_interval_shared_endpoint
        grounds:
          - state_machines.OwnershipTransfer
          - validations[priority=9]
          - errors[ERR_TRANSFER_WINDOW_OVERLAP]
        distinguishing_aspect: |
          Closed interval semantics on OwnershipTransfer (different resource and
          different geometry than the half-open SpecialAllocation rule): TR2's
          effective_date equal to TR1's settlement_date (2025-03-10) IS an
          overlap, because the settlement day is still occupied.
        test_recipe:
          setup:
            - "Fund with partners T1 (6000bps) and T2 (4000bps); TaxYear 2025 OPEN"
            - "TR1 CONFIRMED: T1 -> T2, 1000bps, [2025-03-01, 2025-03-10]"
            - "TR2 PROPOSED: T1 -> T2, 1000bps, [2025-03-10, 2025-03-20] sharing the date 2025-03-10"
          setup_api_calls:
            - call: "POST /funds"
              payload: { legal_name: "Fund R8B", ein: "11-0000017", waterfall_hurdle_rate_bps: 800, waterfall_catchup_bps: 2000, waterfall_carry_bps: 2000, foreign_ownership_cap_pct_bps: 10000, management_fee_rate_bps: 0, fee_discount_threshold_cents: 1, fee_discount_bps: 0 }
              as: FundTaxAdmin
              captures: { f: "$.data.id" }
            - call: "POST /funds/partners"
              payload: { fund_id: "${f}", legal_name: "T1", partner_type: US_INDIVIDUAL, partner_class: LIMITED, residency_state: "CA", ownership_pct_bps: 6000, capital_commitment_cents: 1, admission_date: "2025-01-01" }
              as: FundTaxAdmin
              captures: { t1: "$.data.id" }
            - call: "POST /funds/partners"
              payload: { fund_id: "${f}", legal_name: "T2", partner_type: US_ENTITY, partner_class: LIMITED, residency_state: "DE", ownership_pct_bps: 4000, capital_commitment_cents: 1, admission_date: "2025-01-01" }
              as: FundTaxAdmin
              captures: { t2: "$.data.id" }
            - call: "POST /funds/tax-years"
              payload: { fund_id: "${f}", year: 2025, gross_ordinary_income_cents: 0, capital_gain_cents: 0, interest_income_cents: 0 }
              as: FundTaxAdmin
            - call: "POST /funds/transfers"
              payload: { fund_id: "${f}", transferor_partner_id: "${t1}", transferee_partner_id: "${t2}", pct_bps: 1000, effective_date: "2025-03-01", settlement_date: "2025-03-10" }
              as: FundTaxAdmin
              captures: { tr1: "$.data.id" }
            - call: "POST /funds/transfers/${tr1}/confirm"
              payload: {}
              as: FundTaxAdmin
            - call: "POST /funds/transfers"
              payload: { fund_id: "${f}", transferor_partner_id: "${t1}", transferee_partner_id: "${t2}", pct_bps: 1000, effective_date: "2025-03-10", settlement_date: "2025-03-20" }
              as: FundTaxAdmin
              captures: { tr2: "$.data.id" }
          trigger:
            - call: "POST /funds/transfers/${tr2}/confirm"
              payload: {}
              as: FundTaxAdmin
              captures: { e: "$.data.error_id" }
          assert:
            - "TR1 reached CONFIRMED"
            - "TR2 confirm fails with error_id == ERR_TRANSFER_WINDOW_OVERLAP — the shared date 2025-03-10 counts as occupied under closed-interval semantics"
            - "OwnershipTransfer.${tr2}.status remains PROPOSED"

  # ===========================================================================
  # Rule 9 — compensating_invariant (different conserved quantities)
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: capital_post_and_reverse_conserves_balance
        grounds:
          - calculations.capital_account_and_tax_basis
          - state_machines.CapitalAccountEvent
          - entities.Partner.fields.capital_account_balance_cents
        distinguishing_aspect: |
          Conserved quantity: partner capital account balance. Post CONTRIBUTION
          1000000 followed by its compensating reverse leaves
          capital_account_balance_cents and tax_basis_cents exactly at their
          pre-post value 0; the mirror event (-1000000) is appended, never
          subtracted by deletion.
        test_recipe:
          setup:
            - "Fund with one partner (balances 0) and TaxYear 2025"
          setup_api_calls:
            - call: "POST /funds"
              payload: { legal_name: "Fund R9A", ein: "11-0000018", waterfall_hurdle_rate_bps: 800, waterfall_catchup_bps: 2000, waterfall_carry_bps: 2000, foreign_ownership_cap_pct_bps: 10000, management_fee_rate_bps: 0, fee_discount_threshold_cents: 1, fee_discount_bps: 0 }
              as: FundTaxAdmin
              captures: { f: "$.data.id" }
            - call: "POST /funds/partners"
              payload: { fund_id: "${f}", legal_name: "P", partner_type: US_INDIVIDUAL, partner_class: LIMITED, residency_state: "CA", ownership_pct_bps: 10000, capital_commitment_cents: 1, admission_date: "2025-01-01" }
              as: FundTaxAdmin
              captures: { p: "$.data.id" }
            - call: "POST /funds/tax-years"
              payload: { fund_id: "${f}", year: 2025, gross_ordinary_income_cents: 0, capital_gain_cents: 0, interest_income_cents: 0 }
              as: FundTaxAdmin
              captures: { ty: "$.data.id" }
          trigger:
            - call: "POST /funds/capital-events"
              payload: { partner_id: "${p}", tax_year_id: "${ty}", event_type: CONTRIBUTION, amount_cents: 1000000, effective_date: "2025-01-15" }
              as: TaxPreparer
              captures: { ev: "$.data.id" }
            - call: "GET /funds/partners/${p}"
              payload: {}
              as: TaxPreparer
            - call: "POST /funds/capital-events/${ev}/reverse"
              payload: {}
              as: TaxPreparer
            - call: "GET /funds/capital-events?reverses_event_id=${ev}"
              payload: {}
              as: TaxPreparer
            - call: "GET /funds/partners/${p}"
              payload: {}
              as: TaxPreparer
          assert:
            - "after post: Partner.${p}.capital_account_balance_cents == 1000000"
            - "after reverse: original CapitalAccountEvent.${ev}.status == REVERSED"
            - "mirror exists with amount_cents == -1000000, event_type == CONTRIBUTION, status == POSTED, reverses_event_id == ${ev}"
            - "after reverse: Partner.${p}.capital_account_balance_cents == 0 AND tax_basis_cents == 0 — exactly the pre-post values (invariant holds, no drift)"

      - name: allocation_resupersede_zero_sum_conservation
        grounds:
          - calculations.allocation_engine
          - state_machines.AllocationRun
        distinguishing_aspect: |
          Conserved quantity: tax-year category income totals (a different
          quantity than partner capital). Across a supersede/recompute cycle
          (LOCKED -> STALE via transfer settle, new FINAL run locked), each
          category's line sum still equals the TaxYear totals 9500000 /
          20000000 / 5000000 exactly — zero drift.
        test_recipe:
          setup:
            - "Canonical fund with GP1/LP1/LP2 and 2025-01-01 contributions; TaxYear 2025 with LOCKED FINAL run #1 (status ALLOCATED)"
            - "LP3 admitted; CONFIRMED transfer LP1 -> LP3 of 100bps effective 2025-06-01, settlement 2025-06-10"
          setup_api_calls:
            - call: "POST /funds"
              payload: { legal_name: "Fund R9B", ein: "11-0000019", waterfall_hurdle_rate_bps: 800, waterfall_catchup_bps: 2000, waterfall_carry_bps: 2000, foreign_ownership_cap_pct_bps: 10000, management_fee_rate_bps: 100, fee_discount_threshold_cents: 5000000000, fee_discount_bps: 5000 }
              as: FundTaxAdmin
              captures: { f: "$.data.id" }
            - call: "POST /funds/partners"
              payload: { fund_id: "${f}", legal_name: "GP1", partner_type: US_ENTITY, partner_class: GENERAL, residency_state: "DE", ownership_pct_bps: 1000, capital_commitment_cents: 10000000, admission_date: "2025-01-01" }
              as: FundTaxAdmin
              captures: { p_gp: "$.data.id" }
            - call: "POST /funds/partners"
              payload: { fund_id: "${f}", legal_name: "LP1", partner_type: US_INDIVIDUAL, partner_class: LIMITED, residency_state: "CA", ownership_pct_bps: 6000, capital_commitment_cents: 60000000, admission_date: "2025-01-01" }
              as: FundTaxAdmin
              captures: { p_lp1: "$.data.id" }
            - call: "POST /funds/partners"
              payload: { fund_id: "${f}", legal_name: "LP2", partner_type: FOREIGN_INDIVIDUAL, partner_class: LIMITED, residency_state: "XX", ownership_pct_bps: 3000, capital_commitment_cents: 30000000, admission_date: "2025-01-01" }
              as: FundTaxAdmin
              captures: { p_lp2: "$.data.id" }
            - call: "POST /funds/tax-years"
              payload: { fund_id: "${f}", year: 2025, gross_ordinary_income_cents: 10000000, capital_gain_cents: 20000000, interest_income_cents: 5000000 }
              as: FundTaxAdmin
              captures: { ty: "$.data.id" }
            - call: "POST /funds/capital-events"
              payload: { partner_id: "${p_gp}", tax_year_id: "${ty}", event_type: CONTRIBUTION, amount_cents: 10000000, effective_date: "2025-01-01" }
              as: TaxPreparer
            - call: "POST /funds/capital-events"
              payload: { partner_id: "${p_lp1}", tax_year_id: "${ty}", event_type: CONTRIBUTION, amount_cents: 60000000, effective_date: "2025-01-01" }
              as: TaxPreparer
            - call: "POST /funds/capital-events"
              payload: { partner_id: "${p_lp2}", tax_year_id: "${ty}", event_type: CONTRIBUTION, amount_cents: 30000000, effective_date: "2025-01-01" }
              as: TaxPreparer
            - call: "POST /funds/tax-years/${ty}/close-books"
              payload: {}
              as: FundTaxAdmin
              captures: { ty_v: "$.data.version" }
            - call: "POST /funds/allocation-runs"
              payload: { tax_year_id: "${ty}", run_kind: FINAL, expected_tax_year_version: "${ty_v}" }
              as: TaxPreparer
              captures: { run1: "$.data.id" }
            - call: "POST /funds/allocation-runs/${run1}/lock"
              payload: {}
              as: TaxReviewer
            - call: "POST /funds/partners"
              payload: { fund_id: "${f}", legal_name: "LP3", partner_type: US_INDIVIDUAL, partner_class: LIMITED, residency_state: "NY", ownership_pct_bps: 1, capital_commitment_cents: 1, admission_date: "2025-01-01" }
              as: FundTaxAdmin
              captures: { p_lp3: "$.data.id" }
            - call: "POST /funds/transfers"
              payload: { fund_id: "${f}", transferor_partner_id: "${p_lp1}", transferee_partner_id: "${p_lp3}", pct_bps: 100, effective_date: "2025-06-01", settlement_date: "2025-06-10" }
              as: FundTaxAdmin
              captures: { tr: "$.data.id" }
            - call: "POST /funds/transfers/${tr}/confirm"
              payload: {}
              as: FundTaxAdmin
            - call: "POST /funds/transfers/${tr}/settle"
              payload: {}
              as: FundTaxAdmin
          trigger:
            - call: "GET /funds/tax-years/${ty}"
              payload: {}
              as: TaxPreparer
              captures: { ty_v2: "$.data.version" }
            - call: "POST /funds/allocation-runs"
              payload: { tax_year_id: "${ty}", run_kind: FINAL, expected_tax_year_version: "${ty_v2}" }
              as: TaxPreparer
              captures: { run2: "$.data.id" }
            - call: "POST /funds/allocation-runs/${run2}/lock"
              payload: {}
              as: TaxReviewer
            - call: "GET /funds/allocation-runs/${run2}/lines"
              payload: {}
              as: TaxReviewer
          assert:
            - "AllocationRun.${run1}.status == SUPERSEDED after run2 creation (STALE -> SUPERSEDED)"
            - "AllocationRun.${run2}.status == LOCKED"
            - "sum of run2 ORDINARY lines == 9500000, CAPITAL_GAIN lines == 20000000, INTEREST lines == 5000000 — identical to run1's conserved category totals despite the ownership change"
