      - name: phase_completion_is_blocked_by_open_charges_of_two_kinds
        claim_type: violation_to_error
        grounds:
          - validations[priority=66]
          - state_machines.Phase.IN_PROGRESS_to_COMPLETE
        distinguishing_aspect: |
          Two unrelated populations block completion through one error: an unapproved timesheet and
          an unadjudicated expense. Clearing them one at a time shows the rule is a conjunction, and
          the expense may be cleared by DISALLOWING it — resolution, not allowance, is what the rule
          requires.
        test_recipe:
          setup:
            - "logical clock at 2026-06-01T00:00:00Z; private client"
            - "ACTIVE T&M project (multiplier 3.0500, rate 62.50) with one LUMP_SUM phase of 200000.00"
            - "the phase is IN_PROGRESS from one APPROVED entry, and also carries one SUBMITTED entry and one PENDING_REVIEW expense"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: FirmAdmin
            - call: "POST /clients"
              payload: { name: "Northside Development", is_public_agency: false, retainage_pct: 0.0500, expense_markup_pct: 0.1000, disallowed_categories: ["ENTERTAINMENT"], receipt_required_above: 75.00, review_cycle_days: 30 }
