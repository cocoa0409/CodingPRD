            - call: "POST /edt/cohorts"
              payload: { program_id: "${pgid}", facility_id: "${fid}", name: "Adult AM", age_band: "ADULT", slot_capacity: 5 }
              as: Admin
              captures: { cid: $.data.id }
            - call: "POST /edt/patients"
