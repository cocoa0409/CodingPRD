# =============================================================================
# §1.9 Scaffold Corner Design (Breadth coverage of non-difficulty claims)
# Barbershop & Booth Rental. Section/claim_type values come from
# references/claim-extraction-guide.md. Stubs reference §1.8 instances by name.
# All formula-derived asserts are pre-computed literals. Clock default
# 2026-01-01T00:00:00Z (set explicitly where time matters).
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_shop_returns_201_with_defaults_applied
        claim_type: Creation
        grounds: [entities.Shop, endpoints]
        distinguishing_aspect: "POST /shops with only required fields returns 201; omitted optional config fields default (no_show_strike_limit=3, late_grace_minutes=10, punch_reward_threshold=10, product_commission_pct=0), status=OPEN, version=1, ledgers 0."
        test_recipe:
          setup: ["Empty DB; clock at default."]
          setup_api_calls: []
          trigger:
            - call: "POST /shops"
              payload: { name: "S", tax_rate_pct: 5, default_booth_rent_cents: 4000, default_commission_pct: 30 }
              as: ShopOwner
              captures: { shop_id: $.data.id, st: $.data.status, ver: $.data.version }
          assert:
            - "Shop.status == OPEN"
            - "Shop.version == 1"
            - "Shop.no_show_strike_limit == 3"
            - "Shop.late_grace_minutes == 10"
            - "Shop.punch_reward_threshold == 10"
            - "Shop.gross_service_revenue_cents == 0"

      - name: create_barber_missing_comp_model_returns_invalid_request
        claim_type: Required Fields
        grounds: [entities.Barber.fields.comp_model, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /barbers without the required comp_model field returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["A shop exists."]
          setup_api_calls:
            - call: "POST /shops"
              payload: { name: "S", tax_rate_pct: 0, default_booth_rent_cents: 0, default_commission_pct: 0 }
              as: ShopOwner
              captures: { shop_id: $.data.id }
          trigger:
            - call: "POST /barbers"
              payload: { shop_id: "${shop_id}", full_name: "Bo", license_number: "L1", license_expires_on: "2027-01-01" }
              as: ShopOwner
              captures: { err: $.data.error_id }
          assert:
            - "create rejected with ERR_INVALID_REQUEST (400)"

      - name: get_barber_nonexistent_returns_not_found
        claim_type: Not Found
        grounds: [entities.Barber, "errors[ERR_BARBER_NOT_FOUND]"]
        distinguishing_aspect: "GET /barbers/{barberId} with a non-existent UUID returns ERR_BARBER_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /barbers/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ShopOwner
              captures: { err: $.data.error_id }
          assert:
            - "GET rejected with ERR_BARBER_NOT_FOUND (404)"

      - name: barber_booth_rent_defaults_from_shop_when_omitted
        claim_type: Defaults
        grounds: [entities.Barber.fields.booth_rent_cents, entities.Shop.fields.default_booth_rent_cents]
        distinguishing_aspect: "A BOOTH_RENT barber created without booth_rent_cents inherits Shop.default_booth_rent_cents=4500 as its booth_rent_cents."
        test_recipe:
          setup: ["Shop with default_booth_rent_cents=4500."]
          setup_api_calls:
            - call: "POST /shops"
              payload: { name: "S", tax_rate_pct: 0, default_booth_rent_cents: 4500, default_commission_pct: 0 }
              as: ShopOwner
              captures: { shop_id: $.data.id }
          trigger:
            - call: "POST /barbers"
              payload: { shop_id: "${shop_id}", full_name: "Bo", license_number: "L1", license_expires_on: "2027-01-01", comp_model: "BOOTH_RENT" }
              as: ShopOwner
              captures: { rent: $.data.booth_rent_cents }
          assert:
            - "Barber.booth_rent_cents == 4500"

      - name: appointment_end_utc_computed_ignores_client_value
        claim_type: Computed Fields
        grounds: [entities.Appointment.fields.end_utc, calculations.appointment_slot_end_utc]
        distinguishing_aspect: "Appointment.end_utc is computed = start_utc + service duration(30) + addon extra(15) = 09:45 for start 09:15; the field is system-derived and not client-supplied."
        test_recipe:
          setup: ["Clock 2026-06-10T08:00Z; shop OPEN; barber ACTIVE; chair; shift 09:00-18:00; Haircut(30m); addon Beard(15m); customer ACTIVE."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T08:00:00Z" }
              as: ShopOwner
            - call: "POST /shops"
              payload: { name: "S", tax_rate_pct: 0, default_booth_rent_cents: 0, default_commission_pct: 0 }
              as: ShopOwner
              captures: { shop_id: $.data.id }
            - call: "POST /chairs"
              payload: { shop_id: "${shop_id}", label: "C1" }
              as: ShopOwner
              captures: { chair_id: $.data.id }
            - call: "POST /services"
              payload: { shop_id: "${shop_id}", name: "Haircut", price_cents: 3000, duration_minutes: 30 }
              as: ShopOwner
              captures: { svc_id: $.data.id }
            - call: "POST /addons"
              payload: { shop_id: "${shop_id}", name: "Beard", price_cents: 1500, extra_minutes: 15 }
              as: ShopOwner
              captures: { addon_id: $.data.id }
            - call: "POST /barbers"
              payload: { shop_id: "${shop_id}", full_name: "Bo", license_number: "L1", license_expires_on: "2027-01-01", comp_model: "COMMISSION" }
              as: ShopOwner
              captures: { b_id: $.data.id }
            - call: "POST /barbers/${b_id}/license/activate"
              payload: {}
              as: ShopOwner
            - call: "GET /shops/${shop_id}"
              payload: {}
              as: ShopOwner
              captures: { shop_v: $.data.version }
            - call: "POST /shifts"
              payload: { shop_id: "${shop_id}", barber_id: "${b_id}", chair_id: "${chair_id}", start_utc: "2026-06-10T09:00:00Z", end_utc: "2026-06-10T18:00:00Z", expected_shop_version: "${shop_v}" }
              as: ShopOwner
            - call: "POST /customers"
              payload: { shop_id: "${shop_id}", full_name: "Cara", email: "cara@x.com" }
              as: ShopOwner
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /appointments"
              payload: { shop_id: "${shop_id}", customer_id: "${cust_id}", barber_id: "${b_id}", chair_id: "${chair_id}", service_item_id: "${svc_id}", addon_ids: ["${addon_id}"], start_utc: "2026-06-10T09:15:00Z" }
              as: Receptionist
              captures: { end: $.data.end_utc }
          assert:
            - "Appointment.end_utc == 2026-06-10T09:45:00Z"
            - "Appointment.status == BOOKED"

      - name: list_shops_pagination_envelope
        claim_type: Listing
        grounds: [entities.Shop, endpoints]
        distinguishing_aspect: "GET /shops returns an array envelope with pagination fields total_count and has_more after two shops are created."
        test_recipe:
          setup: ["Two shops created."]
          setup_api_calls:
            - call: "POST /shops"
              payload: { name: "S1", tax_rate_pct: 0, default_booth_rent_cents: 0, default_commission_pct: 0 }
              as: ShopOwner
            - call: "POST /shops"
              payload: { name: "S2", tax_rate_pct: 0, default_booth_rent_cents: 0, default_commission_pct: 0 }
              as: ShopOwner
          trigger:
            - call: "GET /shops"
              payload: {}
              as: ShopOwner
          assert:
            - "response_type == array; meta.total_count >= 2; has_more present (boolean)"

      - name: referenced_chair_not_found_on_appointment_create
        claim_type: Parent Relationships
        grounds: [entities.Appointment.fields.chair_id, "validations[priority=4]", "errors[ERR_REFERENCED_ENTITY_NOT_FOUND]"]
        distinguishing_aspect: "Booking with a chair_id that does not resolve within the shop returns ERR_REFERENCED_ENTITY_NOT_FOUND (404)."
        test_recipe:
          setup: ["Shop OPEN; barber ACTIVE; service; customer; NO chair created."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T08:00:00Z" }
              as: ShopOwner
            - call: "POST /shops"
              payload: { name: "S", tax_rate_pct: 0, default_booth_rent_cents: 0, default_commission_pct: 0 }
              as: ShopOwner
              captures: { shop_id: $.data.id }
            - call: "POST /services"
              payload: { shop_id: "${shop_id}", name: "Haircut", price_cents: 3000, duration_minutes: 30 }
              as: ShopOwner
              captures: { svc_id: $.data.id }
            - call: "POST /barbers"
              payload: { shop_id: "${shop_id}", full_name: "Bo", license_number: "L1", license_expires_on: "2027-01-01", comp_model: "COMMISSION" }
              as: ShopOwner
              captures: { b_id: $.data.id }
            - call: "POST /barbers/${b_id}/license/activate"
              payload: {}
              as: ShopOwner
            - call: "POST /customers"
              payload: { shop_id: "${shop_id}", full_name: "Cara", email: "cara@x.com" }
              as: ShopOwner
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /appointments"
              payload: { shop_id: "${shop_id}", customer_id: "${cust_id}", barber_id: "${b_id}", chair_id: "00000000-0000-4000-8000-000000000000", service_item_id: "${svc_id}", start_utc: "2026-06-10T10:00:00Z" }
              as: Receptionist
              captures: { err: $.data.error_id }
          assert:
            - "booking rejected with ERR_REFERENCED_ENTITY_NOT_FOUND (404)"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: cancel_appointment_after_start_returns_cancel_too_late
        claim_type: Precondition Enforcement
        grounds: [state_machines.Appointment.BOOKED_to_CANCELLED, "errors[ERR_CANCEL_TOO_LATE]"]
        distinguishing_aspect: "Cancelling a BOOKED appointment when clock >= start_utc returns ERR_CANCEL_TOO_LATE (409)."
        test_recipe:
          setup: ["Clock 2026-06-10T08:00Z; shop OPEN; barber ACTIVE; chair; shift; appointment BOOKED at 10:00; clock advanced to 10:00."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T08:00:00Z" }
              as: ShopOwner
            - call: "POST /shops"
              payload: { name: "S", tax_rate_pct: 0, default_booth_rent_cents: 0, default_commission_pct: 0 }
              as: ShopOwner
              captures: { shop_id: $.data.id }
            - call: "POST /chairs"
              payload: { shop_id: "${shop_id}", label: "C1" }
              as: ShopOwner
              captures: { chair_id: $.data.id }
            - call: "POST /services"
              payload: { shop_id: "${shop_id}", name: "Haircut", price_cents: 3000, duration_minutes: 30 }
              as: ShopOwner
              captures: { svc_id: $.data.id }
            - call: "POST /barbers"
              payload: { shop_id: "${shop_id}", full_name: "Bo", license_number: "L1", license_expires_on: "2027-01-01", comp_model: "COMMISSION" }
              as: ShopOwner
              captures: { b_id: $.data.id }
            - call: "POST /barbers/${b_id}/license/activate"
              payload: {}
              as: ShopOwner
            - call: "GET /shops/${shop_id}"
              payload: {}
              as: ShopOwner
              captures: { shop_v: $.data.version }
            - call: "POST /shifts"
              payload: { shop_id: "${shop_id}", barber_id: "${b_id}", chair_id: "${chair_id}", start_utc: "2026-06-10T09:00:00Z", end_utc: "2026-06-10T18:00:00Z", expected_shop_version: "${shop_v}" }
              as: ShopOwner
            - call: "POST /customers"
              payload: { shop_id: "${shop_id}", full_name: "Cara", email: "cara@x.com" }
              as: ShopOwner
              captures: { cust_id: $.data.id }
            - call: "POST /appointments"
              payload: { shop_id: "${shop_id}", customer_id: "${cust_id}", barber_id: "${b_id}", chair_id: "${chair_id}", service_item_id: "${svc_id}", start_utc: "2026-06-10T10:00:00Z" }
              as: Receptionist
              captures: { appt_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T10:00:00Z" }
              as: ShopOwner
          trigger:
            - call: "POST /appointments/${appt_id}/cancel"
              payload: {}
              as: Receptionist
              captures: { err: $.data.error_id }
          assert:
            - "cancel rejected with ERR_CANCEL_TOO_LATE (409)"

      - name: checkin_already_checked_in_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Appointment.BOOKED_to_CHECKED_IN, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Calling check-in a second time on an already CHECKED_IN appointment returns ERR_INVALID_STATE (409); no second ticket is opened."
        test_recipe:
          setup: ["Clock 2026-06-10T08:00Z; shop OPEN; barber ACTIVE; chair; shift; appointment checked in."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T08:00:00Z" }
              as: ShopOwner
            - call: "POST /shops"
              payload: { name: "S", tax_rate_pct: 0, default_booth_rent_cents: 0, default_commission_pct: 0 }
              as: ShopOwner
              captures: { shop_id: $.data.id }
            - call: "POST /chairs"
              payload: { shop_id: "${shop_id}", label: "C1" }
              as: ShopOwner
              captures: { chair_id: $.data.id }
            - call: "POST /services"
              payload: { shop_id: "${shop_id}", name: "Haircut", price_cents: 3000, duration_minutes: 30 }
              as: ShopOwner
              captures: { svc_id: $.data.id }
            - call: "POST /barbers"
              payload: { shop_id: "${shop_id}", full_name: "Bo", license_number: "L1", license_expires_on: "2027-01-01", comp_model: "COMMISSION" }
              as: ShopOwner
              captures: { b_id: $.data.id }
            - call: "POST /barbers/${b_id}/license/activate"
              payload: {}
              as: ShopOwner
            - call: "GET /shops/${shop_id}"
              payload: {}
              as: ShopOwner
              captures: { shop_v: $.data.version }
            - call: "POST /shifts"
              payload: { shop_id: "${shop_id}", barber_id: "${b_id}", chair_id: "${chair_id}", start_utc: "2026-06-10T09:00:00Z", end_utc: "2026-06-10T18:00:00Z", expected_shop_version: "${shop_v}" }
              as: ShopOwner
            - call: "POST /customers"
              payload: { shop_id: "${shop_id}", full_name: "Cara", email: "cara@x.com" }
              as: ShopOwner
              captures: { cust_id: $.data.id }
            - call: "POST /appointments"
              payload: { shop_id: "${shop_id}", customer_id: "${cust_id}", barber_id: "${b_id}", chair_id: "${chair_id}", service_item_id: "${svc_id}", start_utc: "2026-06-10T10:00:00Z" }
              as: Receptionist
              captures: { appt_id: $.data.id }
            - call: "POST /appointments/${appt_id}/check-in"
              payload: {}
              as: Receptionist
          trigger:
            - call: "POST /appointments/${appt_id}/check-in"
              payload: {}
              as: Receptionist
              captures: { err: $.data.error_id }
          assert:
            - "second check-in rejected with ERR_INVALID_STATE (409)"

      - name: serve_non_front_queue_ticket_returns_not_queue_front
        claim_type: Precondition Enforcement
        grounds: [state_machines.QueueTicket.WAITING_to_SERVING, "validations[priority=14]", "errors[ERR_NOT_QUEUE_FRONT]"]
        distinguishing_aspect: "With two WAITING walk-ins (no requested barber), serving the SECOND (queue_position 2) returns ERR_NOT_QUEUE_FRONT (409) because position 1 must be served first."
        test_recipe:
          setup: ["Clock 2026-06-10T08:00Z; shop OPEN; barber ACTIVE; two next-available queue tickets q1 then q2."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T08:00:00Z" }
              as: ShopOwner
            - call: "POST /shops"
              payload: { name: "S", tax_rate_pct: 0, default_booth_rent_cents: 0, default_commission_pct: 0 }
              as: ShopOwner
              captures: { shop_id: $.data.id }
            - call: "POST /barbers"
              payload: { shop_id: "${shop_id}", full_name: "Bo", license_number: "L1", license_expires_on: "2027-01-01", comp_model: "COMMISSION" }
              as: ShopOwner
              captures: { b_id: $.data.id }
            - call: "POST /barbers/${b_id}/license/activate"
              payload: {}
              as: ShopOwner
            - call: "POST /customers"
              payload: { shop_id: "${shop_id}", full_name: "C1", email: "c1@x.com" }
              as: ShopOwner
              captures: { cust1_id: $.data.id }
            - call: "POST /customers"
              payload: { shop_id: "${shop_id}", full_name: "C2", email: "c2@x.com" }
              as: ShopOwner
              captures: { cust2_id: $.data.id }
            - call: "POST /queue"
              payload: { shop_id: "${shop_id}", customer_id: "${cust1_id}" }
              as: Receptionist
              captures: { q1_id: $.data.id }
            - call: "POST /queue"
              payload: { shop_id: "${shop_id}", customer_id: "${cust2_id}" }
              as: Receptionist
              captures: { q2_id: $.data.id }
          trigger:
            - call: "POST /queue/${q2_id}/serve"
              payload: {}
              as: Receptionist
              captures: { err: $.data.error_id }
          assert:
            - "serving q2 (position 2) rejected with ERR_NOT_QUEUE_FRONT (409)"

      - name: cancel_shift_with_booked_appointment_returns_shift_has_appointments
        claim_type: Precondition Enforcement
        grounds: [state_machines.BarberShift.SCHEDULED_to_CANCELLED, "errors[ERR_SHIFT_HAS_APPOINTMENTS]"]
        distinguishing_aspect: "Cancelling a SCHEDULED shift that contains a BOOKED appointment on the same chair within its window returns ERR_SHIFT_HAS_APPOINTMENTS (409)."
        test_recipe:
          setup: ["Clock 2026-06-10T08:00Z; shop OPEN; barber ACTIVE; chair; shift 09:00-18:00; appointment BOOKED at 10:00 in that shift."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T08:00:00Z" }
              as: ShopOwner
            - call: "POST /shops"
              payload: { name: "S", tax_rate_pct: 0, default_booth_rent_cents: 0, default_commission_pct: 0 }
              as: ShopOwner
              captures: { shop_id: $.data.id }
            - call: "POST /chairs"
              payload: { shop_id: "${shop_id}", label: "C1" }
              as: ShopOwner
              captures: { chair_id: $.data.id }
            - call: "POST /services"
              payload: { shop_id: "${shop_id}", name: "Haircut", price_cents: 3000, duration_minutes: 30 }
              as: ShopOwner
              captures: { svc_id: $.data.id }
            - call: "POST /barbers"
              payload: { shop_id: "${shop_id}", full_name: "Bo", license_number: "L1", license_expires_on: "2027-01-01", comp_model: "COMMISSION" }
              as: ShopOwner
              captures: { b_id: $.data.id }
            - call: "POST /barbers/${b_id}/license/activate"
              payload: {}
              as: ShopOwner
            - call: "GET /shops/${shop_id}"
              payload: {}
              as: ShopOwner
              captures: { shop_v: $.data.version }
            - call: "POST /shifts"
              payload: { shop_id: "${shop_id}", barber_id: "${b_id}", chair_id: "${chair_id}", start_utc: "2026-06-10T09:00:00Z", end_utc: "2026-06-10T18:00:00Z", expected_shop_version: "${shop_v}" }
              as: ShopOwner
              captures: { shift_id: $.data.id }
            - call: "POST /customers"
              payload: { shop_id: "${shop_id}", full_name: "Cara", email: "cara@x.com" }
              as: ShopOwner
              captures: { cust_id: $.data.id }
            - call: "POST /appointments"
              payload: { shop_id: "${shop_id}", customer_id: "${cust_id}", barber_id: "${b_id}", chair_id: "${chair_id}", service_item_id: "${svc_id}", start_utc: "2026-06-10T10:00:00Z" }
              as: Receptionist
          trigger:
            - call: "POST /shifts/${shift_id}/cancel"
              payload: {}
              as: ShopOwner
              captures: { err: $.data.error_id }
          assert:
            - "shift cancel rejected with ERR_SHIFT_HAS_APPOINTMENTS (409)"

      - name: revoke_license_terminal_lockdown_reactivate_fails
        claim_type: Terminal State Lockdown
        grounds: [state_machines.Barber.transitions, entities.Barber.fields.license_status, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "REVOKED is terminal: after revoke, attempting POST /barbers/{id}/license/activate returns ERR_INVALID_STATE (409); license_status stays REVOKED."
        test_recipe:
          setup: ["Shop; barber ACTIVE then REVOKED."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T08:00:00Z" }
              as: ShopOwner
            - call: "POST /shops"
              payload: { name: "S", tax_rate_pct: 0, default_booth_rent_cents: 0, default_commission_pct: 0 }
              as: ShopOwner
              captures: { shop_id: $.data.id }
            - call: "POST /barbers"
              payload: { shop_id: "${shop_id}", full_name: "Bo", license_number: "L1", license_expires_on: "2027-01-01", comp_model: "COMMISSION" }
              as: ShopOwner
              captures: { b_id: $.data.id }
            - call: "POST /barbers/${b_id}/license/activate"
              payload: {}
              as: ShopOwner
            - call: "POST /barbers/${b_id}/license/revoke"
              payload: {}
              as: ShopOwner
          trigger:
            - call: "POST /barbers/${b_id}/license/activate"
              payload: {}
              as: ShopOwner
              captures: { err: $.data.error_id }
          assert:
            - "re-activate of REVOKED license rejected with ERR_INVALID_STATE (409)"

      - name: activate_expired_license_returns_license_expired
        claim_type: Precondition Enforcement
        grounds: [state_machines.Barber.PENDING_to_ACTIVE, "errors[ERR_LICENSE_EXPIRED]"]
        distinguishing_aspect: "Activating a barber whose license_expires_on (2026-01-05) is before the clock date (2026-06-10) returns ERR_LICENSE_EXPIRED (409)."
        test_recipe:
          setup: ["Clock 2026-06-10T08:00Z; shop; barber PENDING with license_expires_on 2026-01-05."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T08:00:00Z" }
              as: ShopOwner
            - call: "POST /shops"
              payload: { name: "S", tax_rate_pct: 0, default_booth_rent_cents: 0, default_commission_pct: 0 }
              as: ShopOwner
              captures: { shop_id: $.data.id }
            - call: "POST /barbers"
              payload: { shop_id: "${shop_id}", full_name: "Bo", license_number: "L1", license_expires_on: "2026-01-05", comp_model: "COMMISSION" }
              as: ShopOwner
              captures: { b_id: $.data.id }
          trigger:
            - call: "POST /barbers/${b_id}/license/activate"
              payload: {}
              as: ShopOwner
