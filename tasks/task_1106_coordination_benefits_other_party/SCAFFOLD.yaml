scenario: |
  Coordination of Benefits & Other-Party Liability (health plan): other-coverage
  discovery & primacy determination rules, Medicare secondary payer questionnaire &
  MSP rules, claim adjustment on newly discovered coverage, recovery/refund request
  to providers, member survey & data-match sources, birthday/gender rules for
  dependents, retroactive coverage & rework volume, savings & recovery reporting.

domain_name: coordination-of-benefits
api_prefix: /cob

complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: compliance_audit
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - derived_field_reconciliation
    - scheduled_actions
  entity_topology: hybrid
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: COBRuleConfig
    parent: null
    common_fields: true
    fields:
      - { name: config_name, type: string, source: input, description: "Unique config name" }
      - { name: dependent_primacy_rule, type: enum, source: input, description: "Rule for dependent-child primacy: BIRTHDAY_RULE | GENDER_RULE | CUSTODIAL_DECREE" }
      - { name: msp_employer_size_threshold, type: integer, source: input, description: "Employer size (employee count) at or above which group plan is primary over Medicare for age-based entitlement" }
      - { name: esrd_coordination_months, type: integer, source: input, description: "Months from ESRD onset during which group plan remains primary over Medicare (e.g. 30)" }
      - { name: retroactive_lookback_months, type: integer, source: input, description: "Months before discovery that a newly verified other-coverage window can trigger claim rework" }
      - { name: recovery_window_days, type: integer, source: input, description: "Days after recovery request issuance during which reimbursement must post before escalation" }
      - { name: savings_period_length_days, type: integer, source: input, description: "Length in days of each COB savings reporting period (e.g. 30)" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUPERSEDED" }

  - name: Member
    parent: null
    common_fields: true
    fields:
      - { name: member_external_id, type: string, source: input, description: "Unique external member id from enrollment feed" }
      - { name: full_name, type: string, source: input, description: "Member full legal name" }
      - { name: date_of_birth, type: string, source: input, description: "ISO 8601 date of birth (YYYY-MM-DD)" }
      - { name: gender, type: enum, source: input, description: "MALE | FEMALE | OTHER | UNKNOWN" }
      - { name: relation_to_subscriber, type: enum, source: input, description: "SELF | SPOUSE | CHILD | OTHER_DEPENDENT" }
      - { name: subscriber_member_id, type: string, source: input, description: "FK -> Member.id; the subscriber for dependent members (null for SELF)", default: null }
      - { name: employment_status, type: enum, source: input, description: "ACTIVE | RETIRED | COBRA | TERMINATED" }
      - { name: employer_size, type: integer, source: input, description: "Employee count at subscriber's employer; used in MSP rules", default: 0 }
      - { name: custodial_decree_on_file, type: boolean, source: input, description: "True when a court decree specifies which parent's plan is primary", default: false }
      - { name: medicare_entitlement_reason, type: enum, source: input, description: "NONE | AGE | DISABILITY | ESRD | ESRD_AND_AGE", default: "NONE" }
      - { name: esrd_onset_date, type: string, source: input, description: "ISO date of ESRD onset (required when entitlement includes ESRD)", default: null }
      - { name: other_coverage_count, type: integer, source: computed, description: "Count of VERIFIED Coverage rows for this member (excluding our own plan)" }
      - { name: status, type: enum, source: system, description: "ENROLLED | DISENROLLED" }

  - name: Coverage
    parent: Member
    common_fields: true
    fields:
      - { name: member_id, type: string, source: system, description: "FK -> Member.id; owning member" }
      - { name: payer_id, type: string, source: input, description: "External payer identifier (e.g., Medicare, BCBS, our own plan code)" }
      - { name: plan_name, type: string, source: input, description: "Human readable plan name" }
      - { name: coverage_kind, type: enum, source: input, description: "OUR_PLAN | GROUP_HEALTH | MEDICARE_PART_A | MEDICARE_PART_B | MEDICARE_ADVANTAGE | MEDICAID | TRICARE | INDIVIDUAL" }
      - { name: subscriber_relationship, type: enum, source: input, description: "SELF | SPOUSE | PARENT | OTHER; relation of the member to the subscriber on this coverage" }
      - { name: policy_holder_dob, type: string, source: input, description: "DOB of the policy holder of this coverage; used by birthday rule" }
      - { name: policy_holder_gender, type: enum, source: input, description: "MALE | FEMALE | OTHER | UNKNOWN; policy holder gender for gender rule", default: "UNKNOWN" }
      - { name: effective_from, type: string, source: input, description: "Coverage effective date ISO" }
      - { name: effective_to, type: string, source: input, description: "Coverage end date ISO (null = open-ended)", default: null }
      - { name: verification_source, type: enum, source: input, description: "MEMBER_SURVEY | DATA_MATCH_CMS | CLAIM_INDICATION | ELIGIBILITY_MATCH" }
      - { name: verification_status, type: enum, source: system, description: "PENDING_VERIFICATION → VERIFIED | REJECTED" }
      - { name: is_ours, type: boolean, source: computed, description: "True iff coverage_kind == OUR_PLAN" }

  - name: OtherCoverageLead
    parent: Member
    common_fields: true
    fields:
      - { name: member_id, type: string, source: system, description: "FK -> Member.id" }
      - { name: source, type: enum, source: input, description: "MEMBER_SURVEY | DATA_MATCH_CMS | CLAIM_INDICATION | ELIGIBILITY_MATCH" }
      - { name: raw_payload, type: string, source: input, description: "Free-form payload describing the lead (e.g., survey response, CMS match row)" }
      - { name: received_at, type: string, source: system, description: "ISO timestamp when lead was received" }
      - { name: disposition, type: enum, source: system, description: "RECEIVED → VERIFIED_COVERAGE | REJECTED_DUPLICATE | REJECTED_NO_COVERAGE" }

  - name: PrimacyDetermination
    parent: Member
    common_fields: true
    fields:
      - { name: member_id, type: string, source: system, description: "FK -> Member.id" }
      - { name: as_of_service_date, type: string, source: input, description: "Service date for which primacy is determined (ISO date)" }
      - { name: deciding_rule, type: enum, source: computed, description: "NONE | BIRTHDAY_RULE | GENDER_RULE | CUSTODIAL_DECREE | ACTIVE_VS_RETIRED | MEDICARE_MSP | COURT_ORDER | LONGER_ENROLLMENT" }
      - { name: ordered_coverage_ids, type: array, source: computed, description: "Ordered list of coverage ids (primary first, then secondary, ...). Length equals member's VERIFIED coverages active on as_of_service_date" }
      - { name: msp_questionnaire_id, type: string, source: input, description: "FK -> MSPQuestionnaire.id; required when member has MEDICARE_* coverage in scope", default: null }
      - { name: superseded_by_id, type: string, source: system, description: "FK -> PrimacyDetermination.id; null unless this determination has been superseded", default: null }
      - { name: status, type: enum, source: system, description: "DRAFT → FINALIZED | SUPERSEDED" }

  - name: MSPQuestionnaire
    parent: Member
    common_fields: true
    fields:
      - { name: member_id, type: string, source: system, description: "FK -> Member.id" }
      - { name: respondent_role, type: enum, source: input, description: "SELF | SPOUSE | AUTHORIZED_REP" }
      - { name: age_at_submission, type: integer, source: computed, description: "Member age on submission date, derived from Member.date_of_birth vs current clock" }
      - { name: is_age_65_plus, type: boolean, source: computed, description: "Whether age_at_submission >= 65" }
      - { name: has_employer_group_health, type: boolean, source: input, description: "Whether member (or spouse if relation=SPOUSE) is covered under an active-employer group plan" }
      - { name: employer_size, type: integer, source: input, description: "Employee count of the employer providing group health" }
      - { name: disability_flag, type: boolean, source: input, description: "Whether member is Medicare-entitled due to disability" }
      - { name: esrd_flag, type: boolean, source: input, description: "Whether member is Medicare-entitled due to ESRD" }
      - { name: esrd_onset_date, type: string, source: input, description: "ISO ESRD onset; required when esrd_flag is true", default: null }
      - { name: msp_result, type: enum, source: computed, description: "MEDICARE_PRIMARY | MEDICARE_SECONDARY | MSP_EXEMPT — computed by msp_determination calculation" }
      - { name: status, type: enum, source: system, description: "SUBMITTED → ADJUDICATED | VOIDED" }

  - name: Claim
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; patient" }
      - { name: provider_id, type: string, source: input, description: "FK -> Provider.id; servicing provider" }
      - { name: claim_external_id, type: string, source: input, description: "Unique external claim number" }
      - { name: service_date, type: string, source: input, description: "ISO date of service" }
      - { name: received_date, type: string, source: input, description: "ISO date claim was received by the plan" }
      - { name: total_billed_cents, type: integer, source: input, description: "Sum of line billed amounts in cents" }
      - { name: total_allowed_cents, type: integer, source: computed, description: "Sum of allowed amounts across lines (from repricing)" }
      - { name: total_paid_cents, type: integer, source: computed, description: "Sum of paid amounts across lines (this plan's responsibility)" }
      - { name: total_primary_paid_cents, type: integer, source: computed, description: "Sum of primary_paid_cents across lines (what primary plan paid when we are secondary)" }
      - { name: primacy_determination_id, type: string, source: system, description: "FK -> PrimacyDetermination.id; the determination used at adjudication, null while UNADJUDICATED", default: null }
      - { name: rework_cycle_count, type: integer, source: computed, description: "Number of times this claim has been reprocessed due to retroactive coverage change" }
      - { name: status, type: enum, source: system, description: "RECEIVED → ADJUDICATED → PAID → REOPENED → READJUDICATED → REPAID | CLOSED" }

  - name: ClaimLine
    parent: Claim
    common_fields: true
    fields:
      - { name: claim_id, type: string, source: system, description: "FK -> Claim.id" }
      - { name: line_number, type: integer, source: input, description: "1-based line number within claim" }
      - { name: procedure_code, type: string, source: input, description: "CPT/HCPCS code" }
      - { name: billed_cents, type: integer, source: input, description: "Billed amount in cents" }
      - { name: allowed_cents, type: integer, source: input, description: "Allowed amount in cents after repricing" }
      - { name: primary_paid_cents, type: integer, source: input, description: "Amount the primary payer paid for this line; required when this plan is secondary, must be 0 when we are primary", default: 0 }
      - { name: paid_cents, type: integer, source: computed, description: "This plan's paid amount, computed by secondary_payment_calculation or primary_payment_calculation depending on primacy" }

  - name: ClaimAdjustment
    parent: Claim
    common_fields: true
    fields:
      - { name: claim_id, type: string, source: system, description: "FK -> Claim.id" }
      - { name: cause, type: enum, source: input, description: "NEW_COVERAGE_DISCOVERED | PRIMACY_DETERMINATION_SUPERSEDED | MSP_QUESTIONNAIRE_ADJUDICATED | MANUAL_REVIEW" }
      - { name: triggering_determination_id, type: string, source: input, description: "FK -> PrimacyDetermination.id; the new determination driving this adjustment", default: null }
      - { name: pre_paid_cents, type: integer, source: computed, description: "Claim.total_paid_cents snapshot before adjustment" }
      - { name: post_paid_cents, type: integer, source: computed, description: "Claim.total_paid_cents snapshot after adjustment" }
      - { name: overpayment_cents, type: integer, source: computed, description: "max(0, pre_paid_cents - post_paid_cents) — amount the plan overpaid and may recover" }
      - { name: underpayment_cents, type: integer, source: computed, description: "max(0, post_paid_cents - pre_paid_cents) — additional amount the plan owes the provider" }
      - { name: status, type: enum, source: system, description: "DRAFT → APPLIED | VOIDED" }

  - name: Provider
    parent: null
    common_fields: true
    fields:
      - { name: npi, type: string, source: input, description: "Unique NPI identifier" }
      - { name: legal_name, type: string, source: input, description: "Provider legal name" }
      - { name: tin, type: string, source: input, description: "Tax identification number" }
      - { name: status, type: enum, source: system, description: "ACTIVE | TERMINATED" }

  - name: RecoveryRequest
    parent: Claim
    common_fields: true
    fields:
      - { name: claim_id, type: string, source: system, description: "FK -> Claim.id" }
      - { name: provider_id, type: string, source: input, description: "FK -> Provider.id; provider from whom we recover" }
      - { name: amount_cents, type: integer, source: input, description: "Amount to recover; must equal the originating ClaimAdjustment.overpayment_cents unless split_recoveries=true on the config" }
      - { name: issued_at, type: string, source: system, description: "ISO timestamp when request was issued" }
      - { name: due_date, type: string, source: computed, description: "issued_at + COBRuleConfig.recovery_window_days" }
      - { name: amount_recovered_cents, type: integer, source: computed, description: "Sum of posted Reimbursements against this request" }
      - { name: status, type: enum, source: system, description: "DRAFT → ISSUED → PARTIALLY_RECOVERED → FULLY_RECOVERED | ESCALATED | WRITTEN_OFF" }

  - name: Reimbursement
    parent: RecoveryRequest
    common_fields: false
    fields:
      - { name: recovery_request_id, type: string, source: system, description: "FK -> RecoveryRequest.id" }
      - { name: amount_cents, type: integer, source: input, description: "Reimbursed amount in cents" }
      - { name: received_at, type: string, source: system, description: "ISO timestamp when reimbursement was received" }
      - { name: method, type: enum, source: input, description: "PROVIDER_REFUND_CHECK | OFFSET_AGAINST_FUTURE_CLAIMS | CARRIER_TO_CARRIER_TRANSFER" }

  - name: COBSavingsPeriod
    parent: null
    common_fields: true
    fields:
      - { name: period_start_date, type: string, source: input, description: "ISO start date (inclusive)" }
      - { name: period_end_date, type: string, source: input, description: "ISO end date (inclusive)" }
      - { name: total_avoided_cents, type: integer, source: computed, description: "Sum of (allowed - our paid) across claims where we were secondary in this period" }
      - { name: total_recovered_cents, type: integer, source: computed, description: "Sum of Reimbursements received in this period" }
      - { name: total_claims_adjusted, type: integer, source: computed, description: "Count of ClaimAdjustments APPLIED in this period" }
      - { name: posture, type: enum, source: system, description: "OPEN | CLOSED" }

  - name: MemberSurvey
    parent: Member
    common_fields: true
    fields:
      - { name: member_id, type: string, source: system, description: "FK -> Member.id" }
      - { name: sent_at, type: string, source: system, description: "ISO timestamp when survey was sent" }
      - { name: due_at, type: string, source: computed, description: "sent_at + 30 days" }
      - { name: response_payload, type: string, source: input, description: "Free-form survey response text", default: null }
      - { name: responded_at, type: string, source: system, description: "ISO timestamp when response was received, null until RESPONDED", default: null }
      - { name: status, type: enum, source: system, description: "SENT → RESPONDED | EXPIRED" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: COBRuleConfig
    initial_state: ACTIVE
    terminal_states: [SUPERSEDED]
    transitions:
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "POST /cob/rule-configs (creating a new ACTIVE config supersedes the prior one)"
        actor: PlatformAdmin
        preconditions:
          - "New config's config_name differs from current ACTIVE config"
        side_effects:
          - "Prior ACTIVE config → SUPERSEDED"
          - "increments COBRuleConfig.version on the superseded record"

  - entity: Member
    initial_state: ENROLLED
    terminal_states: [DISENROLLED]
    transitions:
      - from: ENROLLED
        to: DISENROLLED
        trigger: "POST /cob/members/{id}/disenroll"
        actor: EligibilityAnalyst
        preconditions:
          - "Member has no Claim in status RECEIVED or REOPENED (ERR_OPEN_CLAIMS_EXIST)"
        side_effects:
          - "All PENDING_VERIFICATION Coverage rows for this member → REJECTED"
          - "All SENT MemberSurvey rows for this member → EXPIRED"
          - "increments Member.version"

  - entity: Coverage
    initial_state: PENDING_VERIFICATION
    terminal_states: [VERIFIED, REJECTED]
    transitions:
      - from: PENDING_VERIFICATION
        to: VERIFIED
        trigger: "POST /cob/members/{id}/coverages/{coverageId}/verify"
        actor: COBAnalyst
        preconditions:
          - "Member.status == ENROLLED (ERR_MEMBER_DISENROLLED)"
          - "effective_from < effective_to when effective_to is not null (ERR_INVALID_COVERAGE_WINDOW)"
          - "If coverage_kind == OUR_PLAN: only one OUR_PLAN coverage per member may be VERIFIED at any time (ERR_DUPLICATE_OUR_PLAN)"
        side_effects:
          - "Member.other_coverage_count recomputed (exclude OUR_PLAN coverages)"
          - "The originating OtherCoverageLead (if any, matched by verification_source) → VERIFIED_COVERAGE"
          - "increments Coverage.version and Member.version"

      - from: PENDING_VERIFICATION
        to: REJECTED
        trigger: "POST /cob/members/{id}/coverages/{coverageId}/reject"
        actor: COBAnalyst
        preconditions:
          - "Coverage is in PENDING_VERIFICATION"
        side_effects:
          - "Member.other_coverage_count recomputed"
          - "The originating OtherCoverageLead (if any) → REJECTED_NO_COVERAGE"

  - entity: OtherCoverageLead
    initial_state: RECEIVED
    terminal_states: [VERIFIED_COVERAGE, REJECTED_DUPLICATE, REJECTED_NO_COVERAGE]
    transitions:
      - from: RECEIVED
        to: VERIFIED_COVERAGE
        trigger: "system (automatic when a Coverage with this lead's verification_source is verified)"
        actor: system
        preconditions:
          - "A Coverage whose verification_source matches this lead.source transitions to VERIFIED"
        side_effects: []

      - from: RECEIVED
        to: REJECTED_NO_COVERAGE
        trigger: "system (automatic when the originating Coverage is rejected, or POST /cob/members/{id}/other-coverage-leads/{leadId}/reject by COBAnalyst)"
        actor: system
        preconditions: []
        side_effects: []

      - from: RECEIVED
        to: REJECTED_DUPLICATE
        trigger: "POST /cob/members/{id}/other-coverage-leads/{leadId}/mark-duplicate"
        actor: COBAnalyst
        preconditions:
          - "Another VERIFIED Coverage for the same member already matches the lead's payer_id and coverage_kind"
        side_effects: []

  - entity: PrimacyDetermination
    initial_state: DRAFT
    terminal_states: [FINALIZED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: FINALIZED
        trigger: "POST /cob/members/{id}/primacy-determinations/{determinationId}/finalize"
        actor: COBAnalyst
        preconditions:
          - "ordered_coverage_ids must contain exactly the member's VERIFIED coverages whose effective_from <= as_of_service_date AND (effective_to IS NULL OR effective_to >= as_of_service_date)"
          - "If any in-scope coverage has coverage_kind starting with MEDICARE_: msp_questionnaire_id is required and must reference an ADJUDICATED MSPQuestionnaire for this member (ERR_MSP_QUESTIONNAIRE_REQUIRED)"
          - "deciding_rule must equal the rule produced by primacy_rule_selection calculation given the input coverages"
        side_effects:
          - "increments PrimacyDetermination.version and Member.version"

      - from: FINALIZED
        to: SUPERSEDED
        trigger: "POST /cob/members/{id}/primacy-determinations (creating a new FINALIZED determination for an overlapping service_date supersedes the prior FINALIZED)"
        actor: COBAnalyst
        preconditions:
          - "New determination's as_of_service_date overlaps the existing FINALIZED determination's window (same member, same date)"
        side_effects:
          - "Prior FINALIZED record → SUPERSEDED, sets superseded_by_id to new determination id"
          - "For each Claim whose service_date matches and primacy_determination_id == old id, auto-creates a ClaimAdjustment (cause=PRIMACY_DETERMINATION_SUPERSEDED)"
          - "increments PrimacyDetermination.version on both old and new records"

  - entity: MSPQuestionnaire
    initial_state: SUBMITTED
    terminal_states: [ADJUDICATED, VOIDED]
    transitions:
      - from: SUBMITTED
        to: ADJUDICATED
        trigger: "POST /cob/members/{id}/msp-questionnaires/{questionnaireId}/adjudicate"
        actor: COBAnalyst
        preconditions:
          - "All required input fields are populated (employer_size when has_employer_group_health=true; esrd_onset_date when esrd_flag=true) (ERR_MSP_INCOMPLETE)"
        side_effects:
          - "msp_result computed by msp_determination calculation"
          - "increments MSPQuestionnaire.version and Member.version"

      - from: SUBMITTED
        to: VOIDED
        trigger: "POST /cob/members/{id}/msp-questionnaires/{questionnaireId}/void"
        actor: COBAnalyst
        preconditions: []
        side_effects:
          - "If this questionnaire is referenced by any FINALIZED PrimacyDetermination, that determination is auto-SUPERSEDED"

  - entity: Claim
    initial_state: RECEIVED
    terminal_states: [CLOSED]
    transitions:
      - from: RECEIVED
        to: ADJUDICATED
        trigger: "POST /cob/claims/{id}/adjudicate"
        actor: ClaimsExaminer
        preconditions:
          - "Member.status == ENROLLED on the claim's service_date"
          - "Exactly one FINALIZED PrimacyDetermination exists for (member_id, service_date) (ERR_NO_FINAL_PRIMACY)"
        side_effects:
          - "claim.primacy_determination_id set to the applicable FINALIZED determination"
          - "Each ClaimLine: paid_cents computed via primary_payment_calculation when our plan is primary, else secondary_payment_calculation"
          - "Claim.total_paid_cents, total_allowed_cents, total_primary_paid_cents recomputed"
          - "increments Claim.version and Member.version"

      - from: ADJUDICATED
        to: PAID
        trigger: "POST /cob/claims/{id}/pay"
        actor: ClaimsExaminer
        preconditions:
          - "claim.status == ADJUDICATED"
        side_effects:
          - "increments Claim.version"

      - from: PAID
        to: REOPENED
        trigger: "POST /cob/claims/{id}/reopen"
        actor: RecoverySpecialist
        preconditions:
          - "claim.status == PAID"
          - "Triggering ClaimAdjustment exists with cause in {NEW_COVERAGE_DISCOVERED, PRIMACY_DETERMINATION_SUPERSEDED, MSP_QUESTIONNAIRE_ADJUDICATED} (ERR_NO_VALID_ADJUSTMENT_CAUSE)"
        side_effects:
          - "claim.rework_cycle_count incremented by 1"
          - "increments Claim.version"

      - from: REOPENED
        to: READJUDICATED
        trigger: "POST /cob/claims/{id}/readjudicate"
        actor: ClaimsExaminer
        preconditions:
          - "claim.status == REOPENED"
          - "An APPLIED ClaimAdjustment exists for this claim with status=APPLIED (ERR_NO_APPLIED_ADJUSTMENT)"
        side_effects:
          - "Each ClaimLine: paid_cents recomputed against the new determination's ordered_coverage_ids"
          - "Claim.total_paid_cents recomputed"
          - "increments Claim.version"

      - from: READJUDICATED
        to: REPAID
        trigger: "POST /cob/claims/{id}/repay"
        actor: ClaimsExaminer
        preconditions:
          - "claim.status == READJUDICATED"
        side_effects:
          - "increments Claim.version"

      - from: REPAID
        to: CLOSED
        trigger: "POST /cob/claims/{id}/close"
        actor: RecoverySpecialist
        preconditions:
          - "All RecoveryRequest rows for this claim are in terminal state (FULLY_RECOVERED | WRITTEN_OFF)"
        side_effects:
          - "increments Claim.version"

  - entity: ClaimAdjustment
    initial_state: DRAFT
    terminal_states: [APPLIED, VOIDED]
    transitions:
      - from: DRAFT
        to: APPLIED
        trigger: "POST /cob/claims/{id}/adjustments/{adjustmentId}/apply"
        actor: ClaimsExaminer
        preconditions:
          - "claim.status in {PAID, REOPENED}"
          - "If cause == PRIMACY_DETERMINATION_SUPERSEDED: triggering_determination_id is FINALIZED (ERR_TRIGGERING_DET_NOT_FINAL)"
        side_effects:
          - "pre_paid_cents snapshot taken from claim.total_paid_cents"
          - "post_paid_cents computed using the new determination"
          - "overpayment_cents and underpayment_cents derived"
          - "increments ClaimAdjustment.version"

      - from: DRAFT
        to: VOIDED
        trigger: "POST /cob/claims/{id}/adjustments/{adjustmentId}/void"
        actor: ClaimsExaminer
        preconditions: []
        side_effects: []

  - entity: RecoveryRequest
    initial_state: DRAFT
    terminal_states: [FULLY_RECOVERED, ESCALATED, WRITTEN_OFF]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /cob/claims/{id}/recovery-requests/{recoveryId}/issue"
        actor: RecoverySpecialist
        preconditions:
          - "claim.status == REPAID (overpayment established)"
          - "The originating ClaimAdjustment.overpayment_cents > 0 (ERR_NO_OVERPAYMENT)"
        side_effects:
          - "issued_at set to current clock; due_date = issued_at + COBRuleConfig.recovery_window_days"
          - "increments RecoveryRequest.version"

      - from: ISSUED
        to: PARTIALLY_RECOVERED
        trigger: "system (automatic when first Reimbursement posts and amount_recovered_cents < amount_cents)"
        actor: system
        preconditions: []
        side_effects:
          - "amount_recovered_cents incremented by reimbursement amount"

      - from: PARTIALLY_RECOVERED
        to: FULLY_RECOVERED
        trigger: "system (automatic when amount_recovered_cents == amount_cents)"
        actor: system
        preconditions: []
        side_effects: []

      - from: ISSUED
        to: FULLY_RECOVERED
        trigger: "system (automatic when a single Reimbursement posts and amount_recovered_cents == amount_cents)"
        actor: system
        preconditions: []
        side_effects:
          - "amount_recovered_cents set to amount_cents"

      - from: ISSUED
        to: ESCALATED
        trigger: "POST /cob/claims/{id}/recovery-requests/{recoveryId}/escalate"
        actor: RecoverySpecialist
        preconditions:
          - "current clock > due_date AND amount_recovered_cents < amount_cents (ERR_NOT_PAST_DUE)"
        side_effects:
          - "increments RecoveryRequest.version"

      - from: ISSUED
        to: WRITTEN_OFF
        trigger: "POST /cob/claims/{id}/recovery-requests/{recoveryId}/write-off"
        actor: RecoverySpecialist
        preconditions:
          - "current clock > due_date AND amount_recovered_cents < amount_cents (ERR_NOT_PAST_DUE)"
        side_effects:
          - "increments RecoveryRequest.version"

      - from: PARTIALLY_RECOVERED
        to: ESCALATED
        trigger: "POST /cob/claims/{id}/recovery-requests/{recoveryId}/escalate"
        actor: RecoverySpecialist
        preconditions:
          - "current clock > due_date AND amount_recovered_cents < amount_cents"
        side_effects: []

      - from: PARTIALLY_RECOVERED
        to: WRITTEN_OFF
        trigger: "POST /cob/claims/{id}/recovery-requests/{recoveryId}/write-off"
        actor: RecoverySpecialist
        preconditions:
          - "current clock > due_date"
        side_effects: []

  - entity: COBSavingsPeriod
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /cob/savings-periods/{id}/close"
        actor: COBAuditor
        preconditions:
          - "current clock > period_end_date (ERR_PERIOD_NOT_ENDED)"
        side_effects:
          - "total_avoided_cents, total_recovered_cents, total_claims_adjusted snapshotted at close"
          - "increments COBSavingsPeriod.version"

  - entity: MemberSurvey
    initial_state: SENT
    terminal_states: [RESPONDED, EXPIRED]
    transitions:
      - from: SENT
        to: RESPONDED
        trigger: "POST /cob/members/{id}/member-surveys/{surveyId}/respond"
        actor: MemberSelf
        preconditions:
          - "survey.status == SENT"
          - "current clock <= due_at (ERR_SURVEY_EXPIRED)"
          - "X-User-ID matches survey.member_id (ERR_FORBIDDEN)"
        side_effects:
          - "responded_at set; auto-creates an OtherCoverageLead with source=MEMBER_SURVEY"
          - "increments MemberSurvey.version and Member.version"

      - from: SENT
        to: EXPIRED
        trigger: "system (automatic when current clock > due_at and status is still SENT)"
        actor: system
        preconditions: []
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: cob-config-create-supersede-stale
    parent_entity: COBRuleConfig
    write_endpoint: "POST /cob/rule-configs"
    occ_field: "expected_active_config_version"
    description: |
      Creating a new ACTIVE COBRuleConfig supersedes the prior ACTIVE config.
      When the client supplies an expected_active_config_version that does not
      match the current ACTIVE config's version (because another writer has
      already created a newer config which superseded it), the request is
      rejected as stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: primacy-determination-create-stale-member
    parent_entity: Member
    write_endpoint: "POST /cob/members/{id}/primacy-determinations"
    occ_field: "expected_member_version"
    description: |
      Creating a PrimacyDetermination against a Member whose version has
      advanced since the client last observed it is rejected. This captures
      the case where another writer has just verified a new Coverage (which
      legitimately changes the eligible coverage set under §1.2) and the
      current writer's view of the member is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: primary_payment_calculation
    trigger: "claim adjudication or readjudication when ordered_coverage_ids[0].coverage_kind == OUR_PLAN"
    algorithm: aggregation
    formula: |
      # Per ClaimLine:
      paid_cents = min(allowed_cents, billed_cents)
      # Claim totals:
      total_allowed_cents = sum(line.allowed_cents for line in claim.lines)
      total_paid_cents = sum(line.paid_cents for line in claim.lines)
      total_primary_paid_cents = 0
    input_set: "All ClaimLine rows of the claim; primacy has been resolved such that this plan is primary"
    constants:
      ROUNDING: "round_half_up to integer cents per line, then sum (per-line rounding is normative)"
    precision: "integer cents, round_half_up per line then sum"
    variants:
      - name: provisional_adjudication
        when: "claim.status transitions RECEIVED → ADJUDICATED (initial adjudication)"
        difference: "line.paid_cents computed using the FINALIZED determination in force at received_date; if member has any PENDING_VERIFICATION Coverage, an alert flag is recorded but does not block payment"
      - name: final_readjudication
        when: "claim.status transitions REOPENED → READJUDICATED (after adjustment applied)"
        difference: "line.paid_cents recomputed using the latest FINALIZED determination effective on service_date; PENDING_VERIFICATION coverages do not block"

  - name: secondary_payment_calculation
    trigger: "claim adjudication or readjudication when ordered_coverage_ids[0].coverage_kind != OUR_PLAN (we are secondary)"
    algorithm: waterfall_allocation
    formula: |
      # Per ClaimLine (secondary position):
      line.paid_cents = max(0, min(line.allowed_cents, line.billed_cents) - line.primary_paid_cents)
      # The plan pays the residual after the primary's payment, capped at what we would have paid primary.
      # Claim totals:
      total_paid_cents = sum(line.paid_cents for line in claim.lines)
      total_primary_paid_cents = sum(line.primary_paid_cents for line in claim.lines)
      total_allowed_cents = sum(line.allowed_cents for line in claim.lines)
      # Rounding rule (per-line then sum, fixed):
      # paid_cents is rounded per line to integer cents; sum never re-rounds.
    input_set: "All ClaimLine rows of the claim; this plan is in a non-primary position per ordered_coverage_ids"
    constants:
      ROUNDING: "round_half_up to integer cents per line, then sum"
    precision: "integer cents, round_half_up per line then sum"
    variants:
      - name: provisional_secondary
        when: "initial adjudication as secondary"
        difference: "uses primary_paid_cents supplied on the line by the provider/remit; may be 0 if not yet known, resulting in paid = full allowed"
      - name: final_secondary
        when: "readjudication after primary EOB received or after retro-primacy change"
        difference: "uses the verified primary_paid_cents from the primary's remittance; overpayment vs underpayment derived by diffing provisional vs final"

  - name: msp_determination
    trigger: "MSPQuestionnaire transitions SUBMITTED → ADJUDICATED"
    algorithm: constraint_propagation
    formula: |
      # Inputs: has_employer_group_health, employer_size, is_age_65_plus,
      #         disability_flag, esrd_flag, esrd_onset_date, current clock,
      #         COBRuleConfig.msp_employer_size_threshold,
      #         COBRuleConfig.esrd_coordination_months
      #
      # Evaluation order is FIXED (later rules only run if earlier ones don't fire):
      # 1. If NOT has_employer_group_health: MEDICARE_PRIMARY (no group plan in picture)
      # 2. If esrd_flag AND esrd_onset_date + esrd_coordination_months > current clock:
      #      MEDICARE_SECONDARY (within ESRD coordination window)
      # 3. If esrd_flag AND esrd_onset_date + esrd_coordination_months <= current clock:
      #      MEDICARE_PRIMARY (ESRD window exhausted)
      # 4. If is_age_65_plus AND employer_size >= msp_employer_size_threshold:
      #      MEDICARE_SECONDARY (large employer, age-based, active worker)
      # 5. If is_age_65_plus AND employer_size < msp_employer_size_threshold:
      #      MEDICARE_PRIMARY (small employer, Medicare first)
      # 6. If disability_flag AND employer_size >= msp_employer_size_threshold:
      #      MEDICARE_SECONDARY (large employer, disability-based)
      # 7. Otherwise: MSP_EXEMPT (rare — does not fit MSP rubric)
    input_set: "The MSPQuestionnaire being adjudicated; the ACTIVE COBRuleConfig"
    constants: {}
    precision: "boolean rules; no rounding"
    variants: []

  - name: primacy_rule_selection
    trigger: "PrimacyDetermination DRAFT → FINALIZED"
    algorithm: topological
    formula: |
      # Determine the ordered_coverage_ids and deciding_rule for a member's in-scope coverages.
      # In-scope set: VERIFIED coverages where effective_from <= as_of_service_date
      #   AND (effective_to IS NULL OR effective_to >= as_of_service_date)
      #
      # Rule application order (FIXED — first matching rule wins and is recorded as deciding_rule):
      # 1. CUSTODIAL_DECREE: if member.relation_to_subscriber == CHILD AND member.custodial_decree_on_file:
      #      order = [coverage whose subscriber_relationship == PARENT and
      #               policy_holder_gender is set in the court order]; fallback BIRTHDAY_RULE
      # 2. MEDICARE_MSP: if any in-scope coverage has coverage_kind starting with MEDICARE_:
      #      use MSPQuestionnaire.msp_result to decide Medicare vs group plan order
      # 3. ACTIVE_VS_RETIRED: if member has both an ACTIVE employer-group coverage and
      #      a RETIRED/COBRA coverage of kind GROUP_HEALTH: active-employer plan first
      # 4. BIRTHDAY_RULE (for dependent child): order by policy_holder_dob month-day ASC
      #      (parent whose birthday occurs earlier in the calendar year is primary);
      #      tie on month-day -> use policy_holder_dob year (earlier year = primary);
      #      then created_at ASC of the Coverage record
      # 5. GENDER_RULE (for dependent child, only when config.dependent_primacy_rule == GENDER_RULE):
      #      policy_holder_gender == MALE's coverage first
      # 6. LONGER_ENROLLMENT (subscriber with two own coverages): order by effective_from ASC;
      #      tie -> Coverage.created_at ASC
      # 7. NONE: only one coverage in scope (no ordering decision needed)
    input_set: "Member's VERIFIED Coverage rows active on as_of_service_date; Member attributes; ACTIVE COBRuleConfig"
    constants: {}
    precision: "ordering rules; no arithmetic"
    variants:
      - name: birthday_rule_path
        when: "config.dependent_primacy_rule == BIRTHDAY_RULE and member is a CHILD with two parent-held coverages"
        difference: "orders by policy_holder_dob month-day only; year only used as tie-break"
      - name: gender_rule_path
        when: "config.dependent_primacy_rule == GENDER_RULE and member is a CHILD with two parent-held coverages"
        difference: "orders by policy_holder_gender (MALE first); never uses DOB"

  - name: overpayment_derivation
    trigger: "ClaimAdjustment DRAFT → APPLIED"
    algorithm: aggregation
    formula: |
      # Compute over/underpayment for a single adjustment:
      pre_paid_cents  = claim.total_paid_cents snapshot at apply time
      post_paid_cents = sum(line.paid_cents recomputed under the triggering determination)
      overpayment_cents  = max(0, pre_paid_cents - post_paid_cents)
      underpayment_cents = max(0, post_paid_cents - pre_paid_cents)
    input_set: "The claim being adjusted; the triggering PrimacyDetermination; the prior totals on the claim"
    constants: {}
    precision: "integer cents; no rounding needed (differences of integers)"
    variants: []

  - name: savings_period_aggregation
    trigger: "COBSavingsPeriod OPEN → CLOSED"
    algorithm: aggregation
    formula: |
      # For the period [period_start_date, period_end_date] (inclusive on both ends):
      # Avoided = sum over claims whose primacy placed us secondary AND service_date in period:
      #   line-level (allowed - our_paid)  — only for lines where we were secondary
      # Recovered = sum of Reimbursements with received_at in period
      # Adjusted  = count of ClaimAdjustments with status=APPLIED AND updated_at in period
      total_avoided_cents    = sum over qualifying claim-lines of (allowed_cents - paid_cents)
      total_recovered_cents  = sum over Reimbursement.amount_cents where received_at in window
      total_claims_adjusted  = count of ClaimAdjustment where status == APPLIED
                                 AND updated_at within window
    input_set: "All ClaimLines on claims with secondary primacy in the window; all Reimbursements received in the window; all ClaimAdjustments APPLIED in the window"
    constants: {}
    precision: "integer cents; no rounding"
    variants: []

  - name: rework_volume_projection
    trigger: "Coverage PENDING_VERIFICATION → VERIFIED with effective_from in the past"
    algorithm: forward_looking
    formula: |
      # Estimate the number of claims that will require rework:
      # candidate_claims = claims for member with service_date in
      #   [coverage.effective_from, min(coverage.effective_to, current_clock)]
      #   AND claim.status IN {PAID, REPAID}
      # rework_count_estimate = count of candidate_claims
      # The estimate does NOT include claims already REOPENED (in-flight rework).
    input_set: "Member's claims; the newly verified Coverage window"
    constants: {}
    precision: "integer count"
    variants:
      - name: optimistic_estimate
        when: "reporting context (used in savings dashboards)"
        difference: "counts only claims where new primacy would actually flip order (excludes claims already adjusted under this coverage)"
      - name: pessimistic_estimate
        when: "operational workload planning"
        difference: "counts all claims in window regardless of whether primacy actually flips"

# =============================================================================
# Table 4: Validation Rules Table (Ordered by Priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present; role is in roles catalog"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Role permitted to invoke this endpoint per RBAC matrix"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Path-templated ids (memberId, claimId, coverageId, etc.) resolve to existing records; for nested routes, child must belong to the parent in the path"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"

  - priority: 4
    category: state
    check: "Entity is in a state from which the requested transition is valid"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"

  - priority: 5
    category: business_temporal
    check: "Coverage.effective_from < effective_to (when effective_to provided); PrimacyDetermination.as_of_service_date is on or before current clock; MemberSurvey.respond uses current clock <= due_at"
    error_id: ERR_INVALID_COVERAGE_WINDOW
    http_status: 400
    applies_to: "POST /cob/members/{id}/coverages, POST /cob/members/{id}/coverages/{cid}/verify, POST /cob/members/{id}/primacy-determinations, POST /cob/members/{id}/member-surveys/{sid}/respond"

  - priority: 6
    category: business_constraint
    check: "Uniqueness: only one OUR_PLAN coverage per member may be VERIFIED at any time; claim_external_id unique; npi unique; config_name unique among ACTIVE configs"
    error_id: ERR_DUPLICATE_OUR_PLAN
    http_status: 409
    applies_to: "POST /cob/members/{id}/coverages/{cid}/verify, POST /cob/claims, POST /cob/providers, POST /cob/rule-configs"

  - priority: 7
    category: business_referential
    check: "PrimacyDetermination finalization: every coverage_id in ordered_coverage_ids must belong to member, be VERIFIED, and be active on as_of_service_date; MSPQuestionnaire referenced must belong to same member and be ADJUDICATED"
    error_id: ERR_INVALID_DETERMINATION_REFERENCE
    http_status: 422
    applies_to: "POST /cob/members/{id}/primacy-determinations/{did}/finalize"

  - priority: 8
    category: business_safety
    check: "MSP compliance: when finalizing a PrimacyDetermination whose in-scope coverages include any MEDICARE_* kind, an ADJUDICATED MSPQuestionnaire must be referenced"
    error_id: ERR_MSP_QUESTIONNAIRE_REQUIRED
    http_status: 422
    applies_to: "POST /cob/members/{id}/primacy-determinations/{did}/finalize"

  - priority: 9
    category: business_fiscal
    check: "RecoveryRequest.amount_cents must equal the originating ClaimAdjustment.overpayment_cents (no arbitrary splits) and overpayment_cents > 0"
    error_id: ERR_NO_OVERPAYMENT
    http_status: 422
    applies_to: "POST /cob/claims/{cid}/recovery-requests, POST /cob/claims/{cid}/recovery-requests/{rid}/issue"

  - priority: 10
    category: business_fiscal
    check: "Reimbursement.amount_cents must not exceed RecoveryRequest.amount_cents - amount_recovered_cents at post time"
    error_id: ERR_OVERRECOVERY
    http_status: 422
    applies_to: "POST /cob/claims/{cid}/recovery-requests/{rid}/reimbursements"

  - priority: 11
    category: business_temporal
    check: "RecoveryRequest escalation/write-off: current clock must be > due_date AND amount_recovered_cents < amount_cents"
    error_id: ERR_NOT_PAST_DUE
    http_status: 409
    applies_to: "POST /cob/claims/{cid}/recovery-requests/{rid}/escalate, POST /cob/claims/{cid}/recovery-requests/{rid}/write-off"

  - priority: 12
    category: business_referential
    check: "Claim adjudication requires exactly one FINALIZED PrimacyDetermination matching (member_id, service_date)"
    error_id: ERR_NO_FINAL_PRIMACY
    http_status: 422
    applies_to: "POST /cob/claims/{cid}/adjudicate"

  - priority: 13
    category: state
    check: "Member must be ENROLLED for most member-scoped writes"
    error_id: ERR_MEMBER_DISENROLLED
    http_status: 409
    applies_to: "POST /cob/members/{id}/coverages, POST /cob/members/{id}/coverages/{cid}/verify, POST /cob/members/{id}/primacy-determinations, POST /cob/members/{id}/member-surveys/{sid}/respond, POST /cob/claims"

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  # ---- Rule Config ----
  - method: POST
    path: "/cob/rule-configs"
    description: "Create a new ACTIVE COBRuleConfig; supersedes prior ACTIVE config (OCC via expected_active_config_version). When no ACTIVE config exists yet, omit expected_active_config_version."
    roles: [PlatformAdmin]
    code: 201
    input: ["config_name", "dependent_primacy_rule", "msp_employer_size_threshold", "esrd_coordination_months", "retroactive_lookback_months", "recovery_window_days", "savings_period_length_days", "expected_active_config_version?"]
    output: COBRuleConfig
    side_effects:
      - "Prior ACTIVE config transitions to SUPERSEDED; its version increments"
      - "increments COBRuleConfig.version (new record starts at 1)"

  - method: GET
    path: "/cob/rule-configs"
    description: "List rule configs"
    roles: [PlatformAdmin, COBAnalyst, COBAuditor]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: COBRuleConfig[]
    side_effects: []

  - method: GET
    path: "/cob/rule-configs/{id}"
    description: "Fetch a rule config by id"
    roles: [PlatformAdmin, COBAnalyst, COBAuditor]
    code: 200
    input: []
    output: COBRuleConfig
    side_effects: []

  # ---- Providers ----
  - method: POST
    path: "/cob/providers"
    description: "Register a provider"
    roles: [PlatformAdmin]
    code: 201
    input: ["npi", "legal_name", "tin"]
    output: Provider
    side_effects: []

  - method: GET
    path: "/cob/providers/{id}"
    description: "Fetch provider"
    roles: [PlatformAdmin, ClaimsExaminer, RecoverySpecialist, COBAnalyst]
    code: 200
    input: []
    output: Provider
    side_effects: []

  - method: GET
    path: "/cob/providers"
    description: "List providers"
    roles: [PlatformAdmin, ClaimsExaminer, RecoverySpecialist, COBAnalyst]
    code: 200
    input: ["limit?", "offset?", "npi?"]
    output: Provider[]
    side_effects: []

  # ---- Members ----
  - method: POST
    path: "/cob/members"
    description: "Create a member"
    roles: [EligibilityAnalyst]
    code: 201
    input: ["member_external_id", "full_name", "date_of_birth", "gender", "relation_to_subscriber", "subscriber_member_id?", "employment_status", "employer_size?", "custodial_decree_on_file?", "medicare_entitlement_reason?", "esrd_onset_date?"]
    output: Member
    side_effects: []

  - method: GET
    path: "/cob/members/{id}"
    description: "Fetch member"
    roles: [PlatformAdmin, EligibilityAnalyst, COBAnalyst, ClaimsExaminer, RecoverySpecialist, COBAuditor, MemberSelf]
    code: 200
    input: []
    output: Member
    side_effects: []

  - method: GET
    path: "/cob/members"
    description: "List members"
    roles: [PlatformAdmin, EligibilityAnalyst, COBAnalyst, ClaimsExaminer, RecoverySpecialist, COBAuditor]
    code: 200
    input: ["limit?", "offset?", "status?", "relation_to_subscriber?"]
    output: Member[]
    side_effects: []

  - method: POST
    path: "/cob/members/{id}/disenroll"
    description: "Disenroll a member"
    roles: [EligibilityAnalyst]
    code: 200
    input: []
    output: Member
    side_effects:
      - "PENDING_VERIFICATION Coverage rows for this member → REJECTED"
      - "SENT MemberSurvey rows → EXPIRED"
      - "increments Member.version"

  - method: GET
    path: "/cob/members/{id}/dependents"
    description: "List members whose subscriber_member_id points to this member (reverse of Member.subscriber_member_id FK)"
    roles: [PlatformAdmin, EligibilityAnalyst, COBAnalyst, ClaimsExaminer, MemberSelf]
    code: 200
    input: ["limit?", "offset?"]
    output: Member[]
    side_effects: []

  # ---- Coverages ----
  - method: POST
    path: "/cob/members/{id}/coverages"
    description: "Register an other-coverage record for a member"
    roles: [COBAnalyst, EligibilityAnalyst]
    code: 201
    input: ["payer_id", "plan_name", "coverage_kind", "subscriber_relationship", "policy_holder_dob", "policy_holder_gender?", "effective_from", "effective_to?", "verification_source"]
    output: Coverage
    side_effects:
      - "If verification_source matches an existing RECEIVED OtherCoverageLead for this member, that lead is linked"

  - method: GET
    path: "/cob/members/{id}/coverages"
    description: "List coverages for a member"
    roles: [PlatformAdmin, COBAnalyst, EligibilityAnalyst, ClaimsExaminer, RecoverySpecialist, MemberSelf]
    code: 200
    input: ["limit?", "offset?", "verification_status?", "coverage_kind?"]
    output: Coverage[]
    side_effects: []

  - method: GET
    path: "/cob/members/{id}/coverages/{coverageId}"
    description: "Fetch a coverage"
    roles: [PlatformAdmin, COBAnalyst, EligibilityAnalyst, ClaimsExaminer, RecoverySpecialist, MemberSelf]
    code: 200
    input: []
    output: Coverage
    side_effects: []

  - method: POST
    path: "/cob/members/{id}/coverages/{coverageId}/verify"
    description: "Verify a coverage"
    roles: [COBAnalyst]
    code: 200
    input: []
    output: Coverage
    side_effects:
      - "Coverage → VERIFIED; Member.other_coverage_count recomputed; linked OtherCoverageLead → VERIFIED_COVERAGE"
      - "If Coverage.effective_from is in the past: triggers rework_volume_projection for downstream UI"
      - "increments Coverage.version and Member.version"

  - method: POST
    path: "/cob/members/{id}/coverages/{coverageId}/reject"
    description: "Reject a coverage"
    roles: [COBAnalyst]
    code: 200
    input: []
    output: Coverage
    side_effects:
      - "Coverage → REJECTED; linked OtherCoverageLead → REJECTED_NO_COVERAGE"

  # ---- Other Coverage Leads ----
  - method: POST
    path: "/cob/members/{id}/other-coverage-leads"
    description: "Submit an other-coverage lead (from CMS data match, claim indication, eligibility match)"
    roles: [COBAnalyst, EligibilityAnalyst]
    code: 201
    input: ["source", "raw_payload"]
    output: OtherCoverageLead
    side_effects: []

  - method: GET
    path: "/cob/members/{id}/other-coverage-leads"
    description: "List leads for a member"
    roles: [PlatformAdmin, COBAnalyst, EligibilityAnalyst, MemberSelf]
    code: 200
    input: ["limit?", "offset?", "disposition?", "source?"]
    output: OtherCoverageLead[]
    side_effects: []

  - method: GET
    path: "/cob/members/{id}/other-coverage-leads/{leadId}"
    description: "Fetch a lead"
    roles: [PlatformAdmin, COBAnalyst, EligibilityAnalyst, MemberSelf]
    code: 200
    input: []
    output: OtherCoverageLead
    side_effects: []

  - method: POST
    path: "/cob/members/{id}/other-coverage-leads/{leadId}/mark-duplicate"
    description: "Mark a lead as duplicate of existing verified coverage"
    roles: [COBAnalyst]
    code: 200
    input: []
    output: OtherCoverageLead
    side_effects:
      - "Lead → REJECTED_DUPLICATE"

  - method: POST
    path: "/cob/members/{id}/other-coverage-leads/{leadId}/reject"
    description: "Reject a lead (no coverage found)"
    roles: [COBAnalyst]
    code: 200
    input: []
    output: OtherCoverageLead
    side_effects:
      - "Lead → REJECTED_NO_COVERAGE"

  # ---- Member Surveys ----
  - method: POST
    path: "/cob/members/{id}/member-surveys"
    description: "Send a member survey"
    roles: [COBAnalyst, EligibilityAnalyst]
    code: 201
    input: []
    output: MemberSurvey
    side_effects:
      - "sent_at = current clock; due_at = sent_at + 30 days"

  - method: GET
    path: "/cob/members/{id}/member-surveys"
    description: "List surveys for a member"
    roles: [PlatformAdmin, COBAnalyst, EligibilityAnalyst, MemberSelf]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: MemberSurvey[]
    side_effects: []

  - method: GET
    path: "/cob/members/{id}/member-surveys/{surveyId}"
    description: "Fetch a survey"
    roles: [PlatformAdmin, COBAnalyst, EligibilityAnalyst, MemberSelf]
    code: 200
    input: []
    output: MemberSurvey
    side_effects: []

  - method: POST
    path: "/cob/members/{id}/member-surveys/{surveyId}/respond"
    description: "Submit survey response (member self-service)"
    roles: [MemberSelf]
    code: 200
    input: ["response_payload"]
    output: MemberSurvey
    side_effects:
      - "Survey → RESPONDED; auto-creates OtherCoverageLead source=MEMBER_SURVEY"
      - "increments MemberSurvey.version and Member.version"

  # ---- MSP Questionnaires ----
  - method: POST
    path: "/cob/members/{id}/msp-questionnaires"
    description: "Submit an MSP questionnaire"
    roles: [COBAnalyst, EligibilityAnalyst, MemberSelf]
    code: 201
    input: ["respondent_role", "has_employer_group_health", "employer_size", "disability_flag", "esrd_flag", "esrd_onset_date?"]
    output: MSPQuestionnaire
    side_effects:
      - "age_at_submission and is_age_65_plus computed from member DOB and current clock"

  - method: GET
    path: "/cob/members/{id}/msp-questionnaires"
    description: "List questionnaires for a member"
    roles: [PlatformAdmin, COBAnalyst, EligibilityAnalyst, MemberSelf]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: MSPQuestionnaire[]
    side_effects: []

  - method: GET
    path: "/cob/members/{id}/msp-questionnaires/{questionnaireId}"
    description: "Fetch a questionnaire"
    roles: [PlatformAdmin, COBAnalyst, EligibilityAnalyst, MemberSelf]
    code: 200
    input: []
    output: MSPQuestionnaire
    side_effects: []

  - method: POST
    path: "/cob/members/{id}/msp-questionnaires/{questionnaireId}/adjudicate"
    description: "Adjudicate an MSP questionnaire (compute msp_result)"
    roles: [COBAnalyst]
    code: 200
    input: []
    output: MSPQuestionnaire
    side_effects:
      - "msp_result computed by msp_determination"
      - "Questionnaire → ADJUDICATED"

  - method: POST
    path: "/cob/members/{id}/msp-questionnaires/{questionnaireId}/void"
    description: "Void an MSP questionnaire"
    roles: [COBAnalyst]
    code: 200
    input: []
    output: MSPQuestionnaire
    side_effects:
      - "Questionnaire → VOIDED; referencing FINALIZED PrimacyDeterminations → SUPERSEDED"

  # ---- Primacy Determinations ----
  - method: POST
    path: "/cob/members/{id}/primacy-determinations"
    description: "Draft a new primacy determination (OCC via expected_member_version)"
    roles: [COBAnalyst]
    code: 201
    input: ["as_of_service_date", "msp_questionnaire_id?", "expected_member_version"]
    output: PrimacyDetermination
    side_effects:
      - "If a FINALIZED determination for the same member exists with overlapping as_of_service_date, that one is auto-SUPERSEDED once the new one FINALIZES"
      - "increments Member.version"

  - method: GET
    path: "/cob/members/{id}/primacy-determinations"
    description: "List primacy determinations"
    roles: [PlatformAdmin, COBAnalyst, ClaimsExaminer, RecoverySpecialist, MemberSelf]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: PrimacyDetermination[]
    side_effects: []

  - method: GET
    path: "/cob/members/{id}/primacy-determinations/{determinationId}"
    description: "Fetch a determination"
    roles: [PlatformAdmin, COBAnalyst, ClaimsExaminer, RecoverySpecialist, MemberSelf]
    code: 200
    input: []
    output: PrimacyDetermination
    side_effects: []

  - method: POST
    path: "/cob/members/{id}/primacy-determinations/{determinationId}/finalize"
    description: "Finalize a determination; computes deciding_rule and ordered_coverage_ids via primacy_rule_selection"
    roles: [COBAnalyst]
    code: 200
    input: []
    output: PrimacyDetermination
    side_effects:
      - "Determination → FINALIZED; deciding_rule and ordered_coverage_ids computed"
      - "increments PrimacyDetermination.version and Member.version"

  # ---- Claims ----
  - method: POST
    path: "/cob/claims"
    description: "Submit a claim"
    roles: [ClaimsExaminer]
    code: 201
    input: ["member_id", "provider_id", "claim_external_id", "service_date", "received_date", "total_billed_cents"]
    output: Claim
    side_effects: []

  - method: GET
    path: "/cob/claims/{id}"
    description: "Fetch claim"
    roles: [PlatformAdmin, ClaimsExaminer, RecoverySpecialist, COBAnalyst, COBAuditor]
    code: 200
    input: []
    output: Claim
    side_effects: []

  - method: GET
    path: "/cob/claims"
    description: "List claims"
    roles: [PlatformAdmin, ClaimsExaminer, RecoverySpecialist, COBAnalyst, COBAuditor]
    code: 200
    input: ["limit?", "offset?", "status?", "member_id?", "provider_id?", "primacy_determination_id?"]
    output: Claim[]
    side_effects: []

  - method: POST
    path: "/cob/claims/{id}/lines"
    description: "Add a claim line"
    roles: [ClaimsExaminer]
    code: 201
    input: ["line_number", "procedure_code", "billed_cents", "allowed_cents", "primary_paid_cents?"]
    output: ClaimLine
    side_effects: []

  - method: GET
    path: "/cob/claims/{id}/lines"
    description: "List lines on a claim"
    roles: [PlatformAdmin, ClaimsExaminer, RecoverySpecialist, COBAnalyst, COBAuditor]
    code: 200
    input: ["limit?", "offset?"]
    output: ClaimLine[]
    side_effects: []

  - method: POST
    path: "/cob/claims/{id}/adjudicate"
    description: "Adjudicate claim (compute paid_cents per line based on primacy)"
    roles: [ClaimsExaminer]
    code: 200
    input: []
    output: Claim
    side_effects:
      - "claim.status → ADJUDICATED; per-line paid_cents computed"
      - "increments Claim.version and Member.version"

  - method: POST
    path: "/cob/claims/{id}/pay"
    description: "Mark claim paid"
    roles: [ClaimsExaminer]
    code: 200
    input: []
    output: Claim
    side_effects:
      - "claim.status → PAID"

  - method: POST
    path: "/cob/claims/{id}/reopen"
    description: "Reopen a paid claim for rework"
    roles: [RecoverySpecialist]
    code: 200
    input: []
    output: Claim
    side_effects:
      - "claim.status → REOPENED; rework_cycle_count incremented"

  - method: POST
    path: "/cob/claims/{id}/readjudicate"
    description: "Readjudicate a reopened claim against new determination"
    roles: [ClaimsExaminer]
    code: 200
    input: []
    output: Claim
    side_effects:
      - "claim.status → READJUDICATED; per-line paid_cents recomputed"

  - method: POST
    path: "/cob/claims/{id}/repay"
    description: "Mark claim repaid after readjudication"
    roles: [ClaimsExaminer]
    code: 200
    input: []
    output: Claim
    side_effects:
      - "claim.status → REPAID"

  - method: POST
    path: "/cob/claims/{id}/close"
    description: "Close a claim (terminal)"
    roles: [RecoverySpecialist]
    code: 200
    input: []
    output: Claim
    side_effects:
      - "claim.status → CLOSED"

  # ---- Claim Adjustments ----
  - method: POST
    path: "/cob/claims/{id}/adjustments"
    description: "Create a draft claim adjustment"
    roles: [ClaimsExaminer, COBAnalyst]
    code: 201
    input: ["cause", "triggering_determination_id?"]
    output: ClaimAdjustment
    side_effects: []

  - method: GET
    path: "/cob/claims/{id}/adjustments"
    description: "List adjustments on a claim"
    roles: [PlatformAdmin, ClaimsExaminer, COBAnalyst, RecoverySpecialist, COBAuditor]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: ClaimAdjustment[]
    side_effects: []

  - method: GET
    path: "/cob/claims/{id}/adjustments/{adjustmentId}"
    description: "Fetch an adjustment"
    roles: [PlatformAdmin, ClaimsExaminer, COBAnalyst, RecoverySpecialist, COBAuditor]
    code: 200
    input: []
    output: ClaimAdjustment
    side_effects: []

  - method: POST
    path: "/cob/claims/{id}/adjustments/{adjustmentId}/apply"
    description: "Apply an adjustment (computes over/underpayment)"
    roles: [ClaimsExaminer]
    code: 200
    input: []
    output: ClaimAdjustment
    side_effects:
      - "Adjustment → APPLIED; pre/post_paid_cents snapshot; over/underpayment derived"

  - method: POST
    path: "/cob/claims/{id}/adjustments/{adjustmentId}/void"
    description: "Void an adjustment"
    roles: [ClaimsExaminer]
    code: 200
    input: []
    output: ClaimAdjustment
    side_effects:
      - "Adjustment → VOIDED"

  # ---- Recovery Requests ----
  - method: POST
    path: "/cob/claims/{id}/recovery-requests"
    description: "Draft a recovery request"
    roles: [RecoverySpecialist]
    code: 201
    input: ["provider_id", "amount_cents"]
    output: RecoveryRequest
    side_effects: []

  - method: GET
    path: "/cob/claims/{id}/recovery-requests"
    description: "List recovery requests on a claim"
    roles: [PlatformAdmin, ClaimsExaminer, RecoverySpecialist, COBAuditor]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: RecoveryRequest[]
    side_effects: []

  - method: GET
    path: "/cob/claims/{id}/recovery-requests/{recoveryId}"
    description: "Fetch recovery request"
    roles: [PlatformAdmin, ClaimsExaminer, RecoverySpecialist, COBAuditor]
    code: 200
    input: []
    output: RecoveryRequest
    side_effects: []

  - method: POST
    path: "/cob/claims/{id}/recovery-requests/{recoveryId}/issue"
    description: "Issue a recovery request"
    roles: [RecoverySpecialist]
    code: 200
    input: []
    output: RecoveryRequest
    side_effects:
      - "issued_at = current clock; due_date = issued_at + recovery_window_days"

  - method: POST
    path: "/cob/claims/{id}/recovery-requests/{recoveryId}/escalate"
    description: "Escalate an overdue recovery request"
    roles: [RecoverySpecialist]
    code: 200
    input: []
    output: RecoveryRequest
    side_effects:
      - "Request → ESCALATED"

  - method: POST
    path: "/cob/claims/{id}/recovery-requests/{recoveryId}/write-off"
    description: "Write off an overdue recovery request"
    roles: [RecoverySpecialist]
    code: 200
    input: []
    output: RecoveryRequest
    side_effects:
      - "Request → WRITTEN_OFF"

  # ---- Reimbursements ----
  - method: POST
    path: "/cob/claims/{id}/recovery-requests/{recoveryId}/reimbursements"
    description: "Post a reimbursement against a recovery request"
    roles: [RecoverySpecialist]
    code: 201
    input: ["amount_cents", "method"]
    output: Reimbursement
    side_effects:
      - "RecoveryRequest.amount_recovered_cents incremented; status auto-transitions ISSUED → PARTIALLY_RECOVERED → FULLY_RECOVERED as amount_recovered approaches amount_cents"

  - method: GET
    path: "/cob/claims/{id}/recovery-requests/{recoveryId}/reimbursements"
    description: "List reimbursements against a recovery request"
    roles: [PlatformAdmin, ClaimsExaminer, RecoverySpecialist, COBAuditor]
    code: 200
    input: ["limit?", "offset?"]
    output: Reimbursement[]
    side_effects: []

  # ---- Savings Periods ----
  - method: POST
    path: "/cob/savings-periods"
    description: "Open a new savings reporting period"
    roles: [COBAuditor]
    code: 201
    input: ["period_start_date", "period_end_date"]
    output: COBSavingsPeriod
    side_effects: []

  - method: GET
    path: "/cob/savings-periods/{id}"
    description: "Fetch savings period"
    roles: [PlatformAdmin, COBAuditor, COBAnalyst]
    code: 200
    input: []
    output: COBSavingsPeriod
    side_effects: []

  - method: GET
    path: "/cob/savings-periods"
    description: "List savings periods"
    roles: [PlatformAdmin, COBAuditor, COBAnalyst]
    code: 200
    input: ["limit?", "offset?", "posture?"]
    output: COBSavingsPeriod[]
    side_effects: []

  - method: POST
    path: "/cob/savings-periods/{id}/close"
    description: "Close a savings period (snapshot totals)"
    roles: [COBAuditor]
    code: 200
    input: []
    output: COBSavingsPeriod
    side_effects:
      - "Posture → CLOSED; totals snapshotted via savings_period_aggregation"

  # ---- Top-level reverse-lookup endpoints (FK reverse-reachability) ----
  - method: GET
    path: "/cob/primacy-determinations/{id}"
    description: "Fetch a single primacy determination by id (top-level reverse-lookup)"
    roles: [PlatformAdmin, COBAnalyst, ClaimsExaminer, RecoverySpecialist, MemberSelf]
    code: 200
    input: []
    output: PrimacyDetermination
    side_effects: []

  - method: GET
    path: "/cob/primacy-determinations"
    description: "List primacy determinations across members with optional filters (FK reverse-reachability for msp_questionnaire_id and superseded_by_id)"
    roles: [PlatformAdmin, COBAnalyst, ClaimsExaminer, RecoverySpecialist, COBAuditor]
    code: 200
    input: ["limit?", "offset?", "status?", "msp_questionnaire_id?", "superseded_by_id?", "member_id?"]
    output: PrimacyDetermination[]
    side_effects: []

  - method: GET
    path: "/cob/adjustments/{id}"
    description: "Fetch a single claim adjustment by id (top-level reverse-lookup)"
    roles: [PlatformAdmin, ClaimsExaminer, COBAnalyst, RecoverySpecialist, COBAuditor]
    code: 200
    input: []
    output: ClaimAdjustment
    side_effects: []

  - method: GET
    path: "/cob/adjustments"
    description: "List claim adjustments across claims (FK reverse-reachability for triggering_determination_id)"
    roles: [PlatformAdmin, ClaimsExaminer, COBAnalyst, RecoverySpecialist, COBAuditor]
    code: 200
    input: ["limit?", "offset?", "status?", "claim_id?", "triggering_determination_id?"]
    output: ClaimAdjustment[]
    side_effects: []

  - method: GET
    path: "/cob/recovery-requests/{id}"
    description: "Fetch a single recovery request by id (top-level reverse-lookup)"
    roles: [PlatformAdmin, ClaimsExaminer, RecoverySpecialist, COBAuditor]
    code: 200
    input: []
    output: RecoveryRequest
    side_effects: []

  - method: GET
    path: "/cob/recovery-requests"
    description: "List recovery requests across claims (FK reverse-reachability for provider_id)"
    roles: [PlatformAdmin, ClaimsExaminer, RecoverySpecialist, COBAuditor]
    code: 200
    input: ["limit?", "offset?", "status?", "claim_id?", "provider_id?"]
    output: RecoveryRequest[]
    side_effects: []

  - method: GET
    path: "/cob/reimbursements/{id}"
    description: "Fetch a single reimbursement by id (top-level reverse-lookup)"
    roles: [PlatformAdmin, ClaimsExaminer, RecoverySpecialist, COBAuditor]
    code: 200
    input: []
    output: Reimbursement
    side_effects: []

  - method: GET
    path: "/cob/reimbursements"
    description: "List reimbursements across recovery requests (FK reverse-reachability for recovery_request_id)"
    roles: [PlatformAdmin, ClaimsExaminer, RecoverySpecialist, COBAuditor]
    code: 200
    input: ["limit?", "offset?", "recovery_request_id?"]
    output: Reimbursement[]
    side_effects: []

  # ---- Test-driving endpoints ----
  - method: POST
    path: "/cob/_clock/set_current_utc"
    description: "Set the logical clock. Server default at startup is 2026-05-01T00:00:00Z and MUST NOT fall back to wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: ["to_iso8601"]
    output: null
    side_effects:
      - "MemberSurvey rows still SENT whose due_at < new clock → EXPIRED"
      - "No other time-driven transitions fire eagerly (escalations remain explicit)"

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http: 400
    condition: "X-User-Role or X-User-ID header missing or unrecognized"

  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "Role is not permitted to invoke this endpoint"

  - id: ERR_FORBIDDEN
    http: 403
    condition: "MemberSelf X-User-ID does not match the resource's owning member"

  - id: ERR_NOT_FOUND
    http: 404
    condition: "Referenced resource (member, claim, coverage, determination, etc.) does not exist, or nested child does not belong to path parent"

  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Required input missing or wrong type"

  - id: ERR_INVALID_COVERAGE_WINDOW
    http: 400
    condition: "Coverage.effective_from >= effective_to, or future-dated service_date used in primacy determination, or survey response past due"

  - id: ERR_INVALID_STATE
    http: 409
    condition: "Entity not in a state from which the requested transition is valid"

  - id: ERR_MEMBER_DISENROLLED
    http: 409
    condition: "Operation requires Member.status == ENROLLED"

  - id: ERR_OPEN_CLAIMS_EXIST
    http: 409
    condition: "Member disenrollment blocked by open claims (RECEIVED or REOPENED)"

  - id: ERR_DUPLICATE_OUR_PLAN
    http: 409
    condition: "Another VERIFIED OUR_PLAN coverage already exists for this member"

  - id: ERR_NO_FINAL_PRIMACY
    http: 422
    condition: "Claim adjudication requires exactly one FINALIZED PrimacyDetermination matching (member, service_date)"

  - id: ERR_MSP_QUESTIONNAIRE_REQUIRED
    http: 422
    condition: "Primacy determination involves MEDICARE_* coverage but no ADJUDICATED MSPQuestionnaire referenced"

  - id: ERR_MSP_INCOMPLETE
    http: 422
    condition: "MSP adjudication blocked: employer_size missing when has_employer_group_health, or esrd_onset_date missing when esrd_flag"

  - id: ERR_INVALID_DETERMINATION_REFERENCE
    http: 422
    condition: "ordered_coverage_ids or msp_questionnaire_id references entities that don't belong to the member or aren't in the required state"

  - id: ERR_TRIGGERING_DET_NOT_FINAL
    http: 422
    condition: "ClaimAdjustment with cause=PRIMACY_DETERMINATION_SUPERSEDED requires triggering_determination to be FINALIZED"

  - id: ERR_NO_OVERPAYMENT
    http: 422
    condition: "RecoveryRequest requires an originating ClaimAdjustment with overpayment_cents > 0 and amount_cents == overpayment_cents"

  - id: ERR_OVERRECOVERY
    http: 422
    condition: "Reimbursement.amount_cents exceeds remaining unrecovered balance"

  - id: ERR_NOT_PAST_DUE
    http: 409
    condition: "Escalate or write-off requires current clock > due_date AND amount_recovered < amount_cents"

  - id: ERR_SURVEY_EXPIRED
    http: 409
    condition: "Survey response attempted after due_at"

  - id: ERR_NO_VALID_ADJUSTMENT_CAUSE
    http: 409
    condition: "Claim reopen attempted without a triggering ClaimAdjustment whose cause is one of the allowed rework causes"

  - id: ERR_NO_APPLIED_ADJUSTMENT
    http: 409
    condition: "Claim readjudication requires an APPLIED ClaimAdjustment"

  - id: ERR_PERIOD_NOT_ENDED
    http: 409
    condition: "COBSavingsPeriod close requires current clock > period_end_date"

  - id: ERR_STALE_VERSION
    http: 412
    condition: "OCC mismatch: expected_<parent>_version does not match server's current version"

# =============================================================================
# Table 7: RBAC Permission Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "System administrator; owns config, providers, and clock"
    identity: "opaque"
    exclusive_operations:
      - "POST /cob/rule-configs — Create rule config"
      - "POST /cob/providers — Register provider"
      - "POST /cob/_clock/set_current_utc — Set logical clock"
    shared_operations:
      - "GET endpoints across all resources"

  - name: EligibilityAnalyst
    description: "Member enrollment and demographic maintenance"
    identity: "opaque"
    exclusive_operations:
      - "POST /cob/members — Create member"
      - "POST /cob/members/{id}/disenroll — Disenroll member"
    shared_operations:
      - "POST /cob/members/{id}/coverages — Register coverage"
      - "POST /cob/members/{id}/other-coverage-leads — Submit lead"
      - "POST /cob/members/{id}/member-surveys — Send survey"
      - "POST /cob/members/{id}/msp-questionnaires — Submit MSP questionnaire"

  - name: COBAnalyst
    description: "COB specialist; verifies coverage, drafts/finalizes primacy, adjudicates MSP"
    identity: "opaque"
    exclusive_operations:
      - "POST /cob/members/{id}/coverages/{cid}/verify — Verify coverage"
      - "POST /cob/members/{id}/coverages/{cid}/reject — Reject coverage"
      - "POST /cob/members/{id}/other-coverage-leads/{lid}/mark-duplicate"
      - "POST /cob/members/{id}/other-coverage-leads/{lid}/reject"
      - "POST /cob/members/{id}/primacy-determinations — Draft determination"
      - "POST /cob/members/{id}/primacy-determinations/{did}/finalize — Finalize determination"
      - "POST /cob/members/{id}/msp-questionnaires/{qid}/adjudicate — Adjudicate MSP"
      - "POST /cob/members/{id}/msp-questionnaires/{qid}/void — Void MSP"
    shared_operations:
      - "POST /cob/claims/{id}/adjustments — Draft adjustment"

  - name: ClaimsExaminer
    description: "Claims adjudicator"
    identity: "opaque"
    exclusive_operations:
      - "POST /cob/claims — Submit claim"
      - "POST /cob/claims/{id}/lines — Add claim line"
      - "POST /cob/claims/{id}/adjudicate"
      - "POST /cob/claims/{id}/pay"
      - "POST /cob/claims/{id}/readjudicate"
      - "POST /cob/claims/{id}/repay"
      - "POST /cob/claims/{id}/adjustments/{aid}/apply — Apply adjustment"
      - "POST /cob/claims/{id}/adjustments/{aid}/void — Void adjustment"
    shared_operations:
      - "POST /cob/claims/{id}/adjustments — Draft adjustment"

  - name: RecoverySpecialist
    description: "Recovery and refund specialist"
    identity: "opaque"
    exclusive_operations:
      - "POST /cob/claims/{id}/reopen — Reopen paid claim"
      - "POST /cob/claims/{id}/close — Close claim"
      - "POST /cob/claims/{id}/recovery-requests — Draft recovery request"
      - "POST /cob/claims/{id}/recovery-requests/{rid}/issue"
      - "POST /cob/claims/{id}/recovery-requests/{rid}/escalate"
      - "POST /cob/claims/{id}/recovery-requests/{rid}/write-off"
      - "POST /cob/claims/{id}/recovery-requests/{rid}/reimbursements — Post reimbursement"
    shared_operations: []

  - name: COBAuditor
    description: "Savings reporting and audit"
    identity: "opaque"
    exclusive_operations:
      - "POST /cob/savings-periods — Open period"
