            - call: "GET /sleep/orders/${order_id}"
              payload: {}
              as: PlatformAdmin
              captures: { order_v2: $.data.version }
          assert:
            - "first PATCH: 200, subtotal_cents == 330000, discount_cents == 0, delivery_fee_cents == 0, total_due_cents == 330000, version == 2"
            - "second PATCH with stale version: status 412 and error_id == ERR_STALE_VERSION"
            - "GET shows the order unchanged by the stale write (still the MAT+BASE lines, version == 2)"

