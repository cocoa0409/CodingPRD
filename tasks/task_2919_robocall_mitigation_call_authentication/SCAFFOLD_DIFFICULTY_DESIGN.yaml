              as_user_id: "officer-1"
            - call: "POST /rmd/mitigation-plans/${plan_id}/decision"
              payload: { decision: "ACCEPT" }
              as: Regulator
            - call: "POST /rmd/customers"
              payload: { provider_id: "${prov_id}", legal_name: "Stratus Outbound Inc", contact_email: "ops@stratus.example", kyc_evidence_level: "BUSINESS_REGISTRY_VERIFIED" }
              as: ProviderAdmin
