          assert:
            - "HTTP 400 with data.error_id == \"ERR_INVALID_REQUEST\" - WHOLESALE is not in {TRANSIENT, GROUP, CORPORATE, COMP}."
            - "The same body with nights_count 0 fails 400 ERR_INVALID_REQUEST, because the declared constraint is >= 1."
            - "The same body with contracted_rate_amount \"two hundred\" fails 400 ERR_INVALID_REQUEST on the JSON type alone."
            - "POST /night-audit/journal-postings with amount 0.00 fails 400 ERR_INVALID_REQUEST, since amount is declared non-zero."
            - "POST /night-audit/business-dates with out_of_order_room_count 101 fails 400 ERR_INVALID_REQUEST, since the declared ceiling is HotelProperty.room_count_total 100."
            - "POST /night-audit/outlet-tickets with settlement_type VOUCHER and POST /night-audit/ledger-accounts with ledger_type PETTY_CASH both fail 400 ERR_INVALID_REQUEST."
