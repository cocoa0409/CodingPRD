                depot_id: "${depot_id}"
                weekday: MON
                window_start: "08:00"
                window_end: "10:00"
                standing_lines:
                  - { product_form: BLOCK, packaging: PALLET, quantity_units: 1 }
              as: CustomerAgent
              as_user_id: "${cust_id}"
              captures: { route_id: $.data.id, route_status: $.data.status }
          trigger:
            - call: "POST /recurring-routes/${route_id}/pause"
              as: CustomerAgent
              as_user_id: "${cust_id}"
            - call: "POST /depots/${depot_id}/run-ops"
              as: PlatformAdmin
              captures: { gen_while_paused: $.data.generated_order_ids }
            - call: "POST /recurring-routes/${route_id}/resume"
              as: CustomerAgent
              as_user_id: "${cust_id}"
              captures: { status_after_resume: $.data.status }
            - call: "POST /depots/${depot_id}/run-ops"
              as: PlatformAdmin
              captures: { gen_after_resume: $.data.generated_order_ids }
            - call: "POST /depots/${depot_id}/run-ops"
              as: PlatformAdmin
              captures: { gen_second_sweep: $.data.generated_order_ids }
            - call: "GET /recurring-routes/${route_id}"
              as: CustomerAgent
              as_user_id: "${cust_id}"
              captures: { last_gen: $.data.last_generated_date }
          assert:
            - "route_status == ACTIVE at creation (initial state)"
            - "gen_while_paused == [] (PAUSED routes are skipped by route generation)"
            - "status_after_resume == ACTIVE (cycle PAUSED -> ACTIVE completed)"
            - "gen_after_resume has exactly 1 id; GET /orders?recurring_route_id=${route_id} returns 1 order with fulfillment_status DRAFT and event_date 2026-05-04"
            - "last_gen == 2026-05-04 and gen_second_sweep == [] (idempotent via last_generated_date; next Monday 2026-05-11 is beyond clock + 3 days)"

