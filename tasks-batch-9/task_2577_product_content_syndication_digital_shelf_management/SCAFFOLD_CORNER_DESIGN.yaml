      - name: attribute_value_exactly_at_the_global_ceiling_passes_then_one_char_over_fails
        claim_type: satisfaction_to_pass
        grounds:
          - validations[priority=40]
          - errors[ERR_ATTRIBUTE_LENGTH_EXCEEDED]
          - entities.AttributeDefinition.fields.max_chars
        distinguishing_aspect: "The rule is char_count <= max_chars, so a value of exactly 27 characters against max_chars 27 is accepted and only the 28-character value is refused; an exclusive comparison would reject both."
        test_recipe:
          setup:
            - "the taxonomy holds a single attribute title with max_chars 27 and base_weight 40.00"
            - "product SKU-L-1 has one DRAFT revision with no attribute value yet"
          setup_api_calls:
            - call: "POST /digital-shelf/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: ShelfAdmin
            - call: "POST /digital-shelf/attribute-definitions"
              payload: { attribute_key: "title", data_type: "STRING", taxonomy_group: "CORE", max_chars: 27, base_weight: 40.00, is_global_required: true }
              as: ShelfAdmin
            - call: "POST /digital-shelf/products"
              payload: { sku: "SKU-L-1", gtin: "00012345679049", category_code: "SMALL_APPLIANCE", brand_code: "BRHM" }
              as: ContentAuthor
              captures: { pl_id: $.data.id }
            - call: "POST /digital-shelf/content-versions"
              payload: { product_id: "${pl_id}", image_count: 1 }
              as: ContentAuthor
              captures: { vl_id: $.data.id }
          trigger:
            - call: "POST /digital-shelf/content-versions/${vl_id}/attribute-values"
              payload: { attribute_key: "title", value: "Bright Kitchen Blender 900W" }
              as: ContentAuthor
              captures: { av_id: $.data.id, av_len: $.data.char_count }
            - call: "POST /digital-shelf/content-versions/${vl_id}/attribute-values"
              payload: { attribute_key: "title", value: "Bright Kitchen Blender 900WX" }
              as: ContentAuthor
              captures: { e_len: $.data.error_id }
            - call: "GET /digital-shelf/content-versions/${vl_id}/attribute-values"
              payload: {}
              as: ContentAuthor
          assert:
            - "the first call returns HTTP 201 and ${av_len} == 27 (exactly at the ceiling)"
            - "ContentAttributeValue.${av_id}.type_valid == true"
            - "the second call returns HTTP 422 and ${e_len} == \"ERR_ATTRIBUTE_LENGTH_EXCEEDED\""
            - "the list returns meta.total_count == 1 and data[0].value == \"Bright Kitchen Blender 900W\""

      - name: waive_of_a_blocking_row_is_permitted_only_for_shelf_admin
        claim_type: conditional_validation
        grounds:
          - validations[priority=46]
          - errors[ERR_WAIVE_NOT_PERMITTED]
          - state_machines.RejectionError.OPEN_to_WAIVED
          - rbac.SyndicationOperator
        distinguishing_aspect: "The same resolution_mode WAIVE is legal or illegal depending on the row's severity and the caller's role: the operator may waive the WARNING row, is refused 403 on the BLOCKING row, and only the ShelfAdmin's waive clears the ERROR_HOLD."
