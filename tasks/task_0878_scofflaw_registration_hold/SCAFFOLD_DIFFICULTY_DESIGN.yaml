  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: collectible_conserved_dispute_dismiss
        grounds:
          - calculations.case_balances
          - state_machines.Violation.OUTSTANDING_to_DISPUTED
          - state_machines.Dispute.SCHEDULED_to_DISMISSED
          - entities.ScofflawCase.fields.collectible_balance_cents
        distinguishing_aspect: "Conserved money quantity: collectible_balance_cents returns to its pre-dispute value 30000 after the dispute (drops it to 0) -> schedule -> dismiss (restores it) round-trip."
        test_recipe:
          setup:
            - "Case with one OUTSTANDING violation fine 30000 (collectible 30000); hearing officer exists."
            - "Owner disputes the violation; the clerk schedules the hearing."
          setup_api_calls:
            - call: "POST /owners"
              payload: { full_name: "Owner N", dmv_customer_id: "DMV-17", email: "n@x.com", mailing_state: "CA" }
              as: PlatformAdmin
              captures: { o1: $.data.id }
            - call: "POST /vehicles"
              payload: { owner_id: "${o1}", plate_number: "CNS01", plate_state: "CA", vin: "VINN" }
              as: PlatformAdmin
              captures: { veh: $.data.id }
            - call: "POST /hearing-officers"
              payload: { full_name: "Officer Cons" }
              as: PlatformAdmin
              captures: { of: $.data.id }
            - call: "POST /scofflaw-cases"
              payload: { vehicle_id: "${veh}" }
              as: EnforcementOfficer
              captures: { c: $.data.id }
            - call: "POST /scofflaw-cases/${c}/violations"
              payload: { citation_number: "N1", violation_type: "NO_PERMIT", fine_amount_cents: 30000, issued_at: "2026-05-01T00:00:00Z", due_at: "2026-12-31T00:00:00Z" }
              as: EnforcementOfficer
              captures: { v: $.data.id }
            - call: "POST /violations/${v}/disputes"
              payload: { reason: "contest" }
              as: Owner
              as_user_id: "${o1}"
              captures: { d: $.data.id }
            - call: "POST /disputes/${d}/schedule"
              payload: { officer_id: "${of}", scheduled_start: "2026-05-20T09:00:00Z", scheduled_end: "2026-05-20T10:00:00Z" }
              as: HearingClerk
          trigger:
            - call: "POST /disputes/${d}/decide"
              payload: { decision: "DISMISSED" }
              as: HearingClerk
            - call: "GET /scofflaw-cases/${c}"
              as: EnforcementOfficer
          assert:
            - "Violation.${v}.status == OUTSTANDING"
            - "ScofflawCase.${c}.collectible_balance_cents == 30000"

      - name: towyard_slots_conserved_dispatch_cancel
        grounds:
          - entities.TowYard.fields.occupied_slot_count
          - state_machines.BootTowOrder.DISPATCHED_to_CANCELLED
        distinguishing_aspect: "Conserved capacity-count quantity: TowYard.occupied_slot_count returns to its pre-dispatch value 0 after dispatch (+1) -> cancel (-1); a different conserved-quantity type than the money invariant."
        test_recipe:
          setup:
            - "TowYard TY capacity 2 (occupied_slot_count 0); SCOFFLAW tow-eligible case (5 violations of 25000)."
          setup_api_calls:
