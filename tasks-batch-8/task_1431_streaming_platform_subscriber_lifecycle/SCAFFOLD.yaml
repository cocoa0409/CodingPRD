    side_effects: []
  - method: GET
    path: "/v1/partner-billing-records/{id}"
    description: "Get partner billing record"
    roles: [PartnerBillingOps, PlatformAdmin, SupportAgent]
    code: 200
    input: []
    output: PartnerBillingRecord
    side_effects: []
  - method: POST
    path: "/v1/partner-billing-records/{id}/report-receipt"
    description: "Report receipt of partner payment"
    roles: [PartnerBillingOps]
    code: 200
    input: [received_amount_cents]
    output: PartnerBillingRecord
    side_effects: ["report_status=RECEIVED"]
  - method: POST
    path: "/v1/partner-billing-records/{id}/reconcile"
    description: "Reconcile a partner billing record"
    roles: [PartnerBillingOps, PlatformAdmin]
    code: 200
    input: [expected_partner_billing_record_version, "override?"]
    output: PartnerBillingRecord
    side_effects: ["report_status → RECONCILED or DISCREPANCY; increments PartnerBillingRecord.version by 1"]
  - method: POST
    path: "/v1/partner-billing-records/{id}/write-off"
    description: "Write off a discrepancy"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: PartnerBillingRecord
    side_effects: ["report_status=WRITE_OFF"]

  # --- Signup attribution ---
  - method: GET
    path: "/v1/signup-attributions"
    description: "List signup attributions (cohort reporting)"
    roles: [PlatformAdmin, SupportAgent]
    code: 200
    input: ["cohort_month?", "channel?", "content_id?", "account_id?", "subscription_id?"]
    output: SignupAttribution[]
    side_effects: []
  - method: GET
    path: "/v1/signup-attributions/{id}"
    description: "Get signup attribution"
    roles: [PlatformAdmin, SupportAgent]
    code: 200
    input: []
    output: SignupAttribution
    side_effects: []

  # --- System / scheduled sweeps (test-driving) ---
  - method: POST
    path: "/v1/_sweeps/run"
    description: "Test-driving endpoint. Advances the logical clock and runs scheduled sweeps: trial-end conversions, dunning retries, pause expirations, price-change effectiveness, save-offer expirations, retention sweeps at day+30/90, password-sharing reconciliation."
    roles: [PlatformAdmin]
    code: 200
    input: [advance_to_iso8601]
    output: { applied_transitions: integer, now_utc: string }
    side_effects: ["May fire any system transition declared in §1.2"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or malformed X-User-ID / X-User-Role headers" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted to call this endpoint" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path-parameter resource does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Body fails schema (missing required field, wrong type, invalid enum)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource not in a state from which this transition is allowed" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not match current version (OCC)" }
  - { id: ERR_ACCOUNT_SUSPENDED, http: 409, condition: "Account is SUSPENDED or CLOSED; action blocked" }
  - { id: ERR_OFFER_EXPIRED, http: 422, condition: "Save offer expired or price change already effective" }
  - { id: ERR_REFERENTIAL_INTEGRITY, http: 422, condition: "Body FK references an entity that does not exist or is mutually inconsistent" }
  - { id: ERR_PLAN_RULE_VIOLATION, http: 422, condition: "Plan rule violated (archived plan, invalid tier direction, etc.)" }
  - { id: ERR_HOUSEHOLD_LIMIT_EXCEEDED, http: 422, condition: "Profile create/reactivate would exceed plan.max_profiles or plan.max_households" }
  - { id: ERR_PAYMENT_FAILED, http: 402, condition: "Charge failed; recover requires a working payment method" }
  - { id: ERR_OUTSTANDING_BALANCE, http: 402, condition: "Outstanding balance blocks the operation" }
  - { id: ERR_WINBACK_INELIGIBLE, http: 422, condition: "Account does not meet campaign eligibility window or cancel-reason filter" }
  - { id: ERR_PRICE_CHANGE_NOTICE_TOO_SHORT, http: 422, condition: "Price change effective date < 30 days after announcement" }
  - { id: ERR_PAUSE_NOT_ALLOWED, http: 422, condition: "Subscription has already paused within trailing 12 months" }
  - { id: ERR_DUNNING_EXHAUSTED, http: 409, condition: "Manual recovery attempted after dunning_attempt_count >= 5" }
  - { id: ERR_RECONCILE_DELTA_EXCEEDS_TOLERANCE, http: 422, condition: "abs(received - expected) > 500 cents and override not provided" }
  - { id: ERR_DUPLICATE_ACTIVE_SUBSCRIPTION, http: 409, condition: "Account already has a subscription in {TRIALING, ACTIVE, PAST_DUE, PAUSED}" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Subscriber
    description: "End user; manages own account, profiles, subscription, save offers"
    identity: "entity_backed:Account"
    exclusive_operations:
      - "POST /v1/save-offers/{id}/accept"
      - "POST /v1/save-offers/{id}/decline"
    shared_operations:
      - "POST /v1/subscriptions (self)"
      - "POST /v1/subscriptions/{id}/cancel (own)"
      - "POST /v1/subscriptions/{id}/pause (own)"
      - "POST /v1/subscriptions/{id}/resume (own)"
      - "POST /v1/subscriptions/{id}/recover (own)"
      - "POST /v1/subscriptions/{id}/change-plan (own)"
      - "GET /v1/subscriptions/{id}, GET /v1/accounts/{id}, GET /v1/plans, GET /v1/profiles"
      - "POST /v1/profiles, POST /v1/profiles/{id}/deactivate, POST /v1/profiles/{id}/reactivate (own account)"
      - "GET /v1/accounts/{id}/winback-eligibility, POST /v1/accounts/{id}/winback-enroll (own)"
  - name: SupportAgent
    description: "Customer-support operator; can act on behalf of subscribers for most operations"
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "All Subscriber-shared operations on any account"
      - "POST /v1/accounts/{id}/unsuspend, POST /v1/accounts/{id}/close"
      - "GET /v1/billing-events, GET /v1/signup-attributions"
      - "POST /v1/save-offers"
      - "POST /v1/billing-events"
  - name: PartnerBillingOps
    description: "Partner reconciliation operator; manages partner billing records"
    identity: "opaque"
    exclusive_operations:
      - "POST /v1/partner-billing-records/{id}/report-receipt"
    shared_operations:
      - "POST /v1/partner-billing-records"
      - "POST /v1/partner-billing-records/{id}/reconcile (no override)"
      - "GET /v1/partner-billing-records*"
      - "GET /v1/accounts, GET /v1/subscriptions, GET /v1/plans"
      - "POST /v1/billing-events (partner-reported)"
  - name: PlatformAdmin
    description: "Superuser; superset of all other roles plus administrative operations"
    identity: "opaque"
    exclusive_operations:
      - "POST /v1/_clock/set_current_utc"
      - "POST /v1/_sweeps/run"
      - "POST /v1/plans, POST /v1/plans/{id}/archive"
      - "POST /v1/accounts, POST /v1/accounts/{id}/suspend"
      - "POST /v1/price-change-notices, POST /v1/price-change-notices/{id}/cancel"
      - "POST /v1/winback-campaigns, POST /v1/winback-campaigns/{id}/activate, POST /v1/winback-campaigns/{id}/close"
      - "POST /v1/partner-billing-records/{id}/write-off"
      - "POST /v1/partner-billing-records/{id}/reconcile with override=true"
    shared_operations:
      - "All operations available to Subscriber, SupportAgent, PartnerBillingOps"
