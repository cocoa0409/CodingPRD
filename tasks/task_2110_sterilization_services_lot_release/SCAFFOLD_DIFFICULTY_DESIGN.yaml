      - name: vdmax_positive_count_boundary_zero_one_two
        grounds:
          - calculations.vdmax_audit_verdict
          - entities.DoseAudit.fields.outcome
          - entities.DoseAudit.fields.next_audit_due_at
          - state_machines.ProductQualification.PENDING_to_CONDITIONAL
          - state_machines.ProductQualification.PENDING_to_SUSPENDED
