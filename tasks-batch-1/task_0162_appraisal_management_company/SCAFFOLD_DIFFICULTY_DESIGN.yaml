  # =========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: appraiser_window_buffer_conflict_half_open_plus_buffer
        grounds:
          - validations[priority=9]
          - errors[ERR_APPRAISER_WINDOW_CONFLICT]
          - entities.Assignment.fields.inspection_start
          - entities.Assignment.fields.inspection_end
        distinguishing_aspect: |
          Appraiser-resource overlap with half-open + TRAVEL_BUFFER_MINUTES semantics: a second assignment to the
          SAME appraiser whose inspection window starts only 30 minutes after the first window ends collides
          (within the travel buffer) and is rejected ERR_APPRAISER_WINDOW_CONFLICT, even though the raw intervals
          do not overlap.
        test_recipe:
          setup:
            - "One appraiser A on two lenders' panels; two CA properties P1,P2; two orders both assigned to A (A is the only eligible appraiser); A accepts O1 with window 09:00-11:00 on 2026-06-03."
          setup_api_calls:
            - call: "POST /amc/appraisers"
              payload: { full_name: "Win A", license_state: "CA", base_fee_share_pct: 0.50 }
              as: AMCCoordinator
              captures: { a_id: $.data.id }
            - call: "POST /amc/lenders"
              payload: { name: "Lender W1", approved_panel_appraiser_ids: ["${a_id}"], monthly_fee_budget_cents: 1000000 }
              as: AMCCoordinator
              captures: { l1_id: $.data.id }
            - call: "POST /amc/lenders"
              payload: { name: "Lender W2", approved_panel_appraiser_ids: ["${a_id}"], monthly_fee_budget_cents: 1000000 }
              as: AMCCoordinator
              captures: { l2_id: $.data.id }
            - call: "POST /amc/properties"
              payload: { street_address: "20 CA St", state_code: "CA" }
              as: AMCCoordinator
              captures: { p1_id: $.data.id }
            - call: "POST /amc/properties"
              payload: { street_address: "21 CA St", state_code: "CA" }
              as: AMCCoordinator
              captures: { p2_id: $.data.id }
            - call: "POST /amc/orders"
              payload: { lender_id: "${l1_id}", property_id: "${p1_id}", order_fee_cents: 50000, product_type: "URAR_1004" }
              as: AMCCoordinator
              captures: { o1_id: $.data.id, o1_v0: $.data.version }
            - call: "POST /amc/orders/${o1_id}/assignments"
              payload: { expected_order_version: "${o1_v0}" }
              as: AMCCoordinator
              captures: { asg1_id: $.data.id }
            - call: "POST /amc/assignments/${asg1_id}/accept"
              payload: { inspection_start: "2026-06-03T09:00:00Z", inspection_end: "2026-06-03T11:00:00Z" }
              as: Appraiser
              as_user_id: "${a_id}"
            - call: "POST /amc/orders"
              payload: { lender_id: "${l2_id}", property_id: "${p2_id}", order_fee_cents: 50000, product_type: "URAR_1004" }
              as: AMCCoordinator
              captures: { o2_id: $.data.id, o2_v0: $.data.version }
            - call: "POST /amc/orders/${o2_id}/assignments"
              payload: { expected_order_version: "${o2_v0}" }
              as: AMCCoordinator
              captures: { asg2_id: $.data.id }
          trigger:
            - call: "POST /amc/assignments/${asg2_id}/accept"
              payload: { inspection_start: "2026-06-03T11:30:00Z", inspection_end: "2026-06-03T13:00:00Z" }
              as: Appraiser
              as_user_id: "${a_id}"
              captures: { err: $.data.error_id }
          assert:
            - "POST /amc/assignments/${asg2_id}/accept .error_id == ERR_APPRAISER_WINDOW_CONFLICT"
            - "POST /amc/assignments/${asg2_id}/accept HTTP 409"

      - name: property_window_closed_interval_touch_conflict
        grounds:
          - validations[priority=10]
          - errors[ERR_PROPERTY_WINDOW_CONFLICT]
          - entities.Assignment.fields.inspection_start
          - entities.Assignment.fields.inspection_end
        distinguishing_aspect: |
          Property-resource overlap with CLOSED-interval, NO-buffer semantics (different resource and different
          interval arithmetic from the appraiser rule): two different appraisers' inspections on the SAME property
          whose windows merely touch at the boundary (first ends 11:00, second starts 11:00) collide under closed
          [start,end] semantics, rejected ERR_PROPERTY_WINDOW_CONFLICT.
        test_recipe:
          setup:
            - "Same property P on two lenders' panels with two different appraisers A1,A2 (each on its lender's panel, CA license); P assigned twice via two orders; A1 accepts window 09:00-11:00; A2 attempts 11:00-12:00 (boundary touch)."
          setup_api_calls:
            - call: "POST /amc/appraisers"
              payload: { full_name: "PW A1", license_state: "CA", base_fee_share_pct: 0.50 }
              as: AMCCoordinator
              captures: { a1_id: $.data.id }
