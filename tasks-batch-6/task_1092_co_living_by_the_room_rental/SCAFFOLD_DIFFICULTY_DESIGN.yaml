scaffold_difficulty_design:

  # ===================================================================
  # Rule 1 - dual-variant calculations across different entity domains
  # ===================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: move_out_proration_whole_period_block_vs_daily_settlement
        grounds:
          - calculations.move_out_proration
          - entities.Membership.fields.provisional_final_charge_cents
          - entities.Membership.fields.final_charge_cents
          - entities.Invoice.fields.proration_adjustment_cents
          - state_machines.Membership.ACTIVE_to_NOTICE_GIVEN
          - state_machines.Membership.NOTICE_GIVEN_to_MOVED_OUT
        distinguishing_aspect: |
          This dual variant lives on the Membership/Invoice money domain: for an identical
          move-out date of 2026-06-18 the provisional_notice_block variant charges the whole
          7-day period (39000) while the final_settlement_daily variant charges
          round_half_up(39000/7) x 4 = 22284, a 16716-cent divergence on the same inputs.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z; house Peachtree A with monthly_utility_budget_cents 60000 and exactly one room 101 at 25000 cents/week."
            - "Member Ada holds an ACTIVE WEEKLY tenancy on room 101 with move_in_date 2026-06-01, period_days 7 and base_period_rate_cents 25000."
            - "A MEMBER_INITIATED notice is on file scheduling move-out for 2026-06-18, so tenancy_status is NOTICE_GIVEN."
            - "One OPEN invoice covers 2026-06-15..2026-06-21 with subtotal_cents 39000 (25000 base + 14000 utility at a denominator of 1 occupied room)."
          setup_api_calls:
            - call: "POST /co-living/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /co-living/hosts"
              payload: { legal_name: "Peachtree Holdings LLC", payout_account_ref: "acct_pt_001", contact_email: "ops@peachtree.example" }
              as: PlatformAdmin
              captures: { host_id: $.data.id }
            - call: "POST /co-living/houses"
              payload: { host_id: "${host_id}", label: "Peachtree A", address_line1: "12 Peachtree St", city: "Atlanta", state_code: "GA", monthly_utility_budget_cents: 60000 }
              as: Host
              as_user_id: "${host_id}"
              captures: { house_id: $.data.id }
            - call: "POST /co-living/rooms"
              payload: { house_id: "${house_id}", room_number: "101", weekly_rate_cents: 25000, monthly_rate_cents: 100000, private_bath: true }
              as: Host
              as_user_id: "${host_id}"
              captures: { room1_id: $.data.id }
            - call: "POST /co-living/members"
              payload: { full_name: "Ada Reyes", email: "ada@resident.example", declared_monthly_income_cents: 400000 }
              as: PlatformAdmin
              captures: { m1_id: $.data.id }
            - call: "POST /co-living/applications"
              payload: { member_id: "${m1_id}", room_id: "${room1_id}", requested_move_in_date: "2026-06-01", billing_cycle: "WEEKLY" }
              as: Member
              as_user_id: "${m1_id}"
              captures: { app1_id: $.data.id }
            - call: "POST /co-living/applications/${app1_id}/screening-reports"
              payload: { background_result: "CLEAR", verified_monthly_income_cents: 400000, report_reference: "SCR-A1" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /co-living/applications/${app1_id}/decision"
              payload: { decision: "APPROVE", decision_note: "clear background, income 4x" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /co-living/memberships"
              payload: { application_id: "${app1_id}", move_in_date: "2026-06-01" }
              as: CommunityManager
              as_user_id: "cm-1"
              captures: { mem1_id: $.data.id }
            - call: "POST /co-living/memberships/${mem1_id}/move-in"
              payload: {}
              as: CommunityManager
              as_user_id: "cm-1"
            - call: "POST /co-living/memberships/${mem1_id}/notice"
              payload: { reason: "MEMBER_INITIATED", scheduled_move_out_date: "2026-06-18" }
              as: Member
              as_user_id: "${m1_id}"
              captures: { provisional_at_notice: $.data.provisional_final_charge_cents }
            - call: "POST /co-living/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-18T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /co-living/invoices"
              payload: { membership_id: "${mem1_id}", period_start: "2026-06-15", period_end: "2026-06-21" }
              as: FinanceAdmin
              as_user_id: "fa-1"
              captures: { inv2_id: $.data.id }
          trigger:
            - call: "POST /co-living/memberships/${mem1_id}/move-out"
              payload: { actual_move_out_date: "2026-06-18" }
              as: CommunityManager
              as_user_id: "cm-1"
              captures: { final_charge: $.data.final_charge_cents }
          assert:
            - "the notice response captured provisional_final_charge_cents == 39000"
            - "Membership.${mem1_id}.provisional_final_charge_cents == 39000"
            - "Membership.${mem1_id}.final_charge_cents == 22284"
            - "Membership.${mem1_id}.provisional_final_charge_cents != Membership.${mem1_id}.final_charge_cents"
            - "Invoice.${inv2_id}.subtotal_cents == 39000"
            - "Invoice.${inv2_id}.proration_adjustment_cents == -16716"
            - "Invoice.${inv2_id}.total_amount_cents == 22284"
            - "Membership.${mem1_id}.balance_due_cents == 22284"
            - "Membership.${mem1_id}.tenancy_status == MOVED_OUT and Membership.${mem1_id}.billing_status == CURRENT"

      - name: payout_accrual_projection_vs_cash_final_settlement
        grounds:
          - calculations.payout_net_settlement
          - entities.Payout.fields.variant_applied
          - entities.Payout.fields.reserve_cents
          - state_machines.Payout.DRAFT_to_PROJECTED
          - state_machines.Payout.PROJECTED_to_RELEASED
        distinguishing_aspect: |
          This dual variant lives on the Payout/House remittance domain, a different entity
          domain from the Membership/Invoice proration variant: over the identical invoice set
          the accrual_projection variant reads total_amount_cents and withholds a 5% reserve
          (gross 80500, net 66412) while cash_final reads amount_paid_cents and releases the
          reserve (gross 41500, net 36312).
        test_recipe:
          setup:
            - "Logical clock at 2026-06-15T00:00:00Z; one-room house Peachtree A, member Ada on an ACTIVE WEEKLY tenancy since 2026-06-01."
            - "Invoice A covers 2026-06-01..2026-06-07, carries an assessed late fee, totals 41500 cents and is fully PAID."
            - "Invoice B covers 2026-06-15..2026-06-21, totals 39000 cents and is entirely unpaid (OPEN)."
            - "A DRAFT payout exists for the house over the closed cycle 2026-06-01..2026-06-30."
          setup_api_calls:
            - call: "POST /co-living/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /co-living/hosts"
              payload: { legal_name: "Peachtree Holdings LLC", payout_account_ref: "acct_pt_001", contact_email: "ops@peachtree.example" }
              as: PlatformAdmin
              captures: { host_id: $.data.id }
            - call: "POST /co-living/houses"
              payload: { host_id: "${host_id}", label: "Peachtree A", address_line1: "12 Peachtree St", city: "Atlanta", state_code: "GA", monthly_utility_budget_cents: 60000 }
              as: Host
              as_user_id: "${host_id}"
              captures: { house_id: $.data.id }
            - call: "POST /co-living/rooms"
              payload: { house_id: "${house_id}", room_number: "101", weekly_rate_cents: 25000, monthly_rate_cents: 100000, private_bath: true }
              as: Host
              as_user_id: "${host_id}"
              captures: { room1_id: $.data.id }
            - call: "POST /co-living/members"
              payload: { full_name: "Ada Reyes", email: "ada@resident.example", declared_monthly_income_cents: 400000 }
              as: PlatformAdmin
              captures: { m1_id: $.data.id }
            - call: "POST /co-living/applications"
              payload: { member_id: "${m1_id}", room_id: "${room1_id}", requested_move_in_date: "2026-06-01", billing_cycle: "WEEKLY" }
              as: Member
              as_user_id: "${m1_id}"
              captures: { app1_id: $.data.id }
            - call: "POST /co-living/applications/${app1_id}/screening-reports"
              payload: { background_result: "CLEAR", verified_monthly_income_cents: 400000, report_reference: "SCR-A1" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /co-living/applications/${app1_id}/decision"
              payload: { decision: "APPROVE" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /co-living/memberships"
              payload: { application_id: "${app1_id}", move_in_date: "2026-06-01" }
              as: CommunityManager
              as_user_id: "cm-1"
              captures: { mem1_id: $.data.id }
            - call: "POST /co-living/memberships/${mem1_id}/move-in"
              payload: {}
              as: CommunityManager
              as_user_id: "cm-1"
            - call: "POST /co-living/invoices"
              payload: { membership_id: "${mem1_id}", period_start: "2026-06-01", period_end: "2026-06-07" }
              as: FinanceAdmin
              as_user_id: "fa-1"
              captures: { invA_id: $.data.id }
            - call: "POST /co-living/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-06T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /co-living/invoices/${invA_id}/fee-adjustment"
              payload: { action: "ASSESS" }
              as: FinanceAdmin
              as_user_id: "fa-1"
            - call: "POST /co-living/invoices/${invA_id}/payments"
              payload: { amount_cents: 41500, method: "ACH" }
              as: Member
              as_user_id: "${m1_id}"
            - call: "POST /co-living/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /co-living/invoices"
              payload: { membership_id: "${mem1_id}", period_start: "2026-06-15", period_end: "2026-06-21" }
              as: FinanceAdmin
              as_user_id: "fa-1"
              captures: { invB_id: $.data.id }
            - call: "POST /co-living/payouts"
              payload: { house_id: "${house_id}", cycle_start: "2026-06-01", cycle_end: "2026-06-30" }
              as: FinanceAdmin
              as_user_id: "fa-1"
              captures: { payout_id: $.data.id }
          trigger:
            - call: "POST /co-living/payouts/${payout_id}/project"
              payload: {}
              as: FinanceAdmin
              as_user_id: "fa-1"
              captures: { proj_gross: $.data.gross_cents, proj_fee: $.data.platform_fee_cents, proj_reserve: $.data.reserve_cents, proj_net: $.data.net_payout_cents }
            - call: "POST /co-living/payouts/${payout_id}/release"
              payload: {}
              as: FinanceAdmin
              as_user_id: "fa-2"
          assert:
            - "the project response had gross_cents == 80500"
            - "the project response had platform_fee_cents == 10063"
            - "the project response had reserve_cents == 4025"
            - "the project response had net_payout_cents == 66412 and variant_applied == ACCRUAL_PROJECTION"
            - "Payout.${payout_id}.status == RELEASED and Payout.${payout_id}.variant_applied == CASH_FINAL"
            - "Payout.${payout_id}.gross_cents == 41500"
            - "Payout.${payout_id}.platform_fee_cents == 5188"
            - "Payout.${payout_id}.reserve_cents == 0"
            - "Payout.${payout_id}.net_payout_cents == 36312"
            - "Payout.${payout_id}.net_payout_cents != 66412 for the identical invoice set"

  # ===================================================================
  # Rule 2 - combinatorial formulas across different modes
  # ===================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: platform_fee_rounded_per_invoice_then_summed
        grounds:
          - calculations.payout_net_settlement
          - entities.Payout.fields.platform_fee_cents
          - state_machines.Payout.DRAFT_to_PROJECTED
        distinguishing_aspect: |
          Mode (b) - nested rounding where the ORDER changes the cents: with invoice totals
          41500 and 22284 at PLATFORM_FEE_RATE 0.125, rounding per invoice then summing gives
          5188 + 2786 = 7974, while summing first (63784) and rounding once gives 7973. The
          scaffold pins per-invoice-then-sum.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-18T00:00:00Z; one-room house Peachtree A, member Ada moved out on 2026-06-18."
            - "Invoice A covers 2026-06-01..2026-06-07 and totals 41500 cents after an assessed late fee; fully paid."
            - "Invoice B covers 2026-06-15..2026-06-21 and totals 22284 cents after the move-out proration; fully paid."
            - "A DRAFT payout exists for the house over 2026-06-01..2026-06-30."
          setup_api_calls:
            - call: "POST /co-living/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /co-living/hosts"
              payload: { legal_name: "Peachtree Holdings LLC", payout_account_ref: "acct_pt_001", contact_email: "ops@peachtree.example" }
              as: PlatformAdmin
              captures: { host_id: $.data.id }
            - call: "POST /co-living/houses"
              payload: { host_id: "${host_id}", label: "Peachtree A", address_line1: "12 Peachtree St", city: "Atlanta", state_code: "GA", monthly_utility_budget_cents: 60000 }
              as: Host
              as_user_id: "${host_id}"
              captures: { house_id: $.data.id }
            - call: "POST /co-living/rooms"
              payload: { house_id: "${house_id}", room_number: "101", weekly_rate_cents: 25000, monthly_rate_cents: 100000, private_bath: true }
              as: Host
              as_user_id: "${host_id}"
              captures: { room1_id: $.data.id }
            - call: "POST /co-living/members"
              payload: { full_name: "Ada Reyes", email: "ada@resident.example", declared_monthly_income_cents: 400000 }
              as: PlatformAdmin
              captures: { m1_id: $.data.id }
            - call: "POST /co-living/applications"
              payload: { member_id: "${m1_id}", room_id: "${room1_id}", requested_move_in_date: "2026-06-01", billing_cycle: "WEEKLY" }
              as: Member
              as_user_id: "${m1_id}"
              captures: { app1_id: $.data.id }
            - call: "POST /co-living/applications/${app1_id}/screening-reports"
              payload: { background_result: "CLEAR", verified_monthly_income_cents: 400000, report_reference: "SCR-A1" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /co-living/applications/${app1_id}/decision"
              payload: { decision: "APPROVE" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /co-living/memberships"
              payload: { application_id: "${app1_id}", move_in_date: "2026-06-01" }
              as: CommunityManager
              as_user_id: "cm-1"
              captures: { mem1_id: $.data.id }
            - call: "POST /co-living/memberships/${mem1_id}/move-in"
              payload: {}
              as: CommunityManager
              as_user_id: "cm-1"
            - call: "POST /co-living/memberships/${mem1_id}/notice"
              payload: { reason: "MEMBER_INITIATED", scheduled_move_out_date: "2026-06-18" }
              as: Member
              as_user_id: "${m1_id}"
            - call: "POST /co-living/invoices"
              payload: { membership_id: "${mem1_id}", period_start: "2026-06-01", period_end: "2026-06-07" }
              as: FinanceAdmin
              as_user_id: "fa-1"
              captures: { invA_id: $.data.id }
            - call: "POST /co-living/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-06T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /co-living/invoices/${invA_id}/fee-adjustment"
              payload: { action: "ASSESS" }
              as: FinanceAdmin
              as_user_id: "fa-1"
            - call: "POST /co-living/invoices/${invA_id}/payments"
              payload: { amount_cents: 41500, method: "ACH" }
              as: Member
              as_user_id: "${m1_id}"
            - call: "POST /co-living/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-18T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /co-living/invoices"
              payload: { membership_id: "${mem1_id}", period_start: "2026-06-15", period_end: "2026-06-21" }
              as: FinanceAdmin
              as_user_id: "fa-1"
              captures: { invB_id: $.data.id }
            - call: "POST /co-living/memberships/${mem1_id}/move-out"
              payload: { actual_move_out_date: "2026-06-18" }
              as: CommunityManager
              as_user_id: "cm-1"
            - call: "POST /co-living/invoices/${invB_id}/payments"
              payload: { amount_cents: 22284, method: "CARD" }
              as: Member
              as_user_id: "${m1_id}"
            - call: "POST /co-living/payouts"
              payload: { house_id: "${house_id}", cycle_start: "2026-06-01", cycle_end: "2026-06-30" }
              as: FinanceAdmin
              as_user_id: "fa-1"
              captures: { payout_id: $.data.id }
          trigger:
            - call: "POST /co-living/payouts/${payout_id}/project"
              payload: {}
              as: FinanceAdmin
              as_user_id: "fa-1"
          assert:
            - "Invoice.${invA_id}.total_amount_cents == 41500 and Invoice.${invB_id}.total_amount_cents == 22284"
            - "Payout.${payout_id}.gross_cents == 63784"
            - "Payout.${payout_id}.platform_fee_cents == 7974"
            - "Payout.${payout_id}.platform_fee_cents != 7973 (the sum-then-round reading of the same data)"
            - "Payout.${payout_id}.reserve_cents == 3189"
            - "Payout.${payout_id}.net_payout_cents == 52621"

      - name: late_fee_tier_keyed_on_subtotal_not_on_total
        grounds:
          - calculations.invoice_charge_assembly
          - entities.Invoice.fields.subtotal_cents
          - entities.Invoice.fields.late_fee_cents
          - entities.Invoice.fields.total_amount_cents
          - state_machines.Invoice.OPEN_to_PAST_DUE
        distinguishing_aspect: |
          Mode (c) - a circular-looking dependency whose evaluation order is pinned:
          total_amount_cents needs late_fee_cents, and late_fee_cents needs a tier keyed on an
          amount. The scaffold keys the tier on subtotal_cents (39000, tier 2 -> 2500) so the
          total is 41500; keying it on the resulting total (41500, over the 40000 ceiling)
          would wrongly yield 4000.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-06T00:00:00Z; one-room house Peachtree A with monthly_utility_budget_cents 60000."
            - "Member Ada holds an ACTIVE WEEKLY tenancy on room 101 since 2026-06-01 at 25000 cents/week."
            - "An OPEN invoice covers 2026-06-01..2026-06-07 with base_rent_cents 25000, utility_share_cents 14000 and subtotal_cents 39000; nothing has been paid and the 3-day grace window has expired."
          setup_api_calls:
            - call: "POST /co-living/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /co-living/hosts"
              payload: { legal_name: "Peachtree Holdings LLC", payout_account_ref: "acct_pt_001", contact_email: "ops@peachtree.example" }
              as: PlatformAdmin
              captures: { host_id: $.data.id }
            - call: "POST /co-living/houses"
              payload: { host_id: "${host_id}", label: "Peachtree A", address_line1: "12 Peachtree St", city: "Atlanta", state_code: "GA", monthly_utility_budget_cents: 60000 }
              as: Host
              as_user_id: "${host_id}"
              captures: { house_id: $.data.id }
            - call: "POST /co-living/rooms"
              payload: { house_id: "${house_id}", room_number: "101", weekly_rate_cents: 25000, monthly_rate_cents: 100000, private_bath: true }
              as: Host
              as_user_id: "${host_id}"
              captures: { room1_id: $.data.id }
            - call: "POST /co-living/members"
              payload: { full_name: "Ada Reyes", email: "ada@resident.example", declared_monthly_income_cents: 400000 }
              as: PlatformAdmin
              captures: { m1_id: $.data.id }
            - call: "POST /co-living/applications"
              payload: { member_id: "${m1_id}", room_id: "${room1_id}", requested_move_in_date: "2026-06-01", billing_cycle: "WEEKLY" }
              as: Member
              as_user_id: "${m1_id}"
              captures: { app1_id: $.data.id }
            - call: "POST /co-living/applications/${app1_id}/screening-reports"
              payload: { background_result: "CLEAR", verified_monthly_income_cents: 400000, report_reference: "SCR-A1" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /co-living/applications/${app1_id}/decision"
              payload: { decision: "APPROVE" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /co-living/memberships"
              payload: { application_id: "${app1_id}", move_in_date: "2026-06-01" }
              as: CommunityManager
              as_user_id: "cm-1"
              captures: { mem1_id: $.data.id }
            - call: "POST /co-living/memberships/${mem1_id}/move-in"
              payload: {}
              as: CommunityManager
              as_user_id: "cm-1"
            - call: "POST /co-living/invoices"
              payload: { membership_id: "${mem1_id}", period_start: "2026-06-01", period_end: "2026-06-07" }
              as: FinanceAdmin
              as_user_id: "fa-1"
              captures: { invA_id: $.data.id }
            - call: "POST /co-living/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-06T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /co-living/invoices/${invA_id}/fee-adjustment"
              payload: { action: "ASSESS" }
              as: FinanceAdmin
              as_user_id: "fa-1"
              captures: { fee: $.data.late_fee_cents }
          assert:
            - "Invoice.${invA_id}.base_rent_cents == 25000"
            - "Invoice.${invA_id}.utility_share_cents == 14000"
            - "Invoice.${invA_id}.occupied_rooms_at_period_start == 1"
            - "Invoice.${invA_id}.subtotal_cents == 39000"
            - "Invoice.${invA_id}.late_fee_cents == 2500"
            - "Invoice.${invA_id}.late_fee_cents != 4000 (the value a tier keyed on total_amount_cents would produce)"
            - "Invoice.${invA_id}.total_amount_cents == 41500"
            - "Invoice.${invA_id}.status == PAST_DUE and Membership.${mem1_id}.billing_status == PAST_DUE"
            - "Membership.${mem1_id}.balance_due_cents == 41500"

  # ===================================================================
  # Rule 3 - non-linear state-machine shape on different entities
  # ===================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: membership_tenancy_and_billing_axes_move_independently
        grounds:
          - state_machines.Membership.CURRENT_to_PAST_DUE
          - state_machines.Membership.ACTIVE_to_NOTICE_GIVEN
          - entities.Membership.fields.tenancy_status
          - entities.Membership.fields.billing_status
        distinguishing_aspect: |
          Membership carries two independent state axes on one row: a late-fee assessment moves
