# =============================================================================
# §1.9 Scaffold Corner Design (Breadth Coverage Index) — task_2813
# Grocery Delivery Shopper Network & Batch Dispatch
#
# Nine sections, taken verbatim from references/claim-extraction-guide.md:
#   entities / state_machines / calculations / validations / endpoints /
#   errors / rbac / complexity_layers / consistency_model
# Every `claim_type:` is a row name from that guide's per-section tables.
# Corners already asserted by SCAFFOLD_DIFFICULTY_DESIGN.yaml appear as
# `excluded_because:` stubs naming the §1.8 instance that covers them.
# Every numeric literal below was computed from the §1.3 formulas and constants.
# =============================================================================
scaffold_corner_design:
  - section: entities
    instances:
      - name: retailer_creation_echoes_every_declared_field
        claim_type: creation
        grounds:
          - endpoints[POST /retailers]
          - entities.Retailer
        distinguishing_aspect: "POST /retailers with every optional field supplied returns 201 and echoes all seven business fields plus the system fields; nothing is silently defaulted over an explicit value."
        test_recipe:
          setup:
            - "Empty database; logical clock pinned to 2026-08-01T08:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T08:00:00Z" }
              as: DispatchAdmin
          trigger:
            - call: "POST /retailers"
              payload: { legal_name: "Northgate Provisions LLC", store_code: "NGP-11", catalog_markup_pct: 0.25, parity_disclosure_required: false, ebt_snap_enabled: false, concurrent_shopper_cap: 5, status: "PAUSED" }
              as: DispatchAdmin
              captures: { rz: $.data.id }
          assert:
            - "Response status is 201"
            - "Retailer.${rz}.legal_name == 'Northgate Provisions LLC' and store_code == 'NGP-11'"
            - "Retailer.${rz}.catalog_markup_pct == 0.25, parity_disclosure_required == false, ebt_snap_enabled == false, concurrent_shopper_cap == 5, status == PAUSED"
            - "Retailer.${rz}.id is a server-generated string, created_at == 2026-08-01T08:00:00Z and version == 1"

      - name: catalog_item_retrieval_returns_stored_row
        claim_type: retrieval
        grounds:
          - endpoints[GET /catalog-items/{id}]
          - entities.CatalogItem
        distinguishing_aspect: "GET /catalog-items/{id} returns exactly what POST stored, including the derived catalog_price_cents 460 and is_weighted false for an EACH item."
        test_recipe:
          setup:
            - "Retailer R1 with catalog_markup_pct 0.15; one EACH item priced 400 in store."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T08:00:00Z" }
              as: DispatchAdmin
            - call: "POST /retailers"
              payload: { legal_name: "Bay Fresh Market LLC", store_code: "BFM-01", catalog_markup_pct: 0.15 }
              as: DispatchAdmin
              captures: { r1: $.data.id }
            - call: "POST /catalog-items"
              payload: { retailer_id: "${r1}", sku: "SKU-EACH-EBT", name: "Canned Beans", pricing_unit: "EACH", in_store_price_cents: 400, is_ebt_eligible: true, unit_weight_lb: 1.0 }
              as: RetailerManager
              as_user_id: "${r1}"
              captures: { i1: $.data.id }
          trigger:
            - call: "GET /catalog-items/${i1}"
              payload: {}
              as: DispatchAdmin
          assert:
            - "Response status is 200"
            - "CatalogItem.${i1}.retailer_id == ${r1}, sku == 'SKU-EACH-EBT', pricing_unit == EACH, in_store_price_cents == 400"
            - "CatalogItem.${i1}.catalog_price_cents == 460 and is_weighted == false and availability == IN_STOCK"

      - name: catalog_items_list_filtered_by_retailer_and_paginated
        claim_type: listing
        grounds:
          - endpoints[GET /catalog-items]
          - response_envelope.pagination_fields
        distinguishing_aspect: "GET /catalog-items?retailer_id=R1&limit=2 returns total_count 3 with has_more true, and offset 2 returns the last row with has_more false; the item belonging to R2 never appears."
        test_recipe:
          setup:
            - "Retailer R1 with three catalog items and Retailer R2 with one."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T08:00:00Z" }
              as: DispatchAdmin
            - call: "POST /retailers"
              payload: { legal_name: "Bay Fresh Market LLC", store_code: "BFM-01", catalog_markup_pct: 0.15 }
              as: DispatchAdmin
              captures: { r1: $.data.id }
            - call: "POST /retailers"
              payload: { legal_name: "Cross Town Foods LLC", store_code: "CTF-02", catalog_markup_pct: 0.15 }
              as: DispatchAdmin
              captures: { r2: $.data.id }
            - call: "POST /catalog-items"
              payload: { retailer_id: "${r1}", sku: "SKU-A", name: "Canned Beans", pricing_unit: "EACH", in_store_price_cents: 400, is_ebt_eligible: true, unit_weight_lb: 1.0 }
              as: RetailerManager
              as_user_id: "${r1}"
            - call: "POST /catalog-items"
              payload: { retailer_id: "${r1}", sku: "SKU-B", name: "Rice Sack", pricing_unit: "EACH", in_store_price_cents: 200, is_ebt_eligible: true, unit_weight_lb: 10.0 }
              as: RetailerManager
              as_user_id: "${r1}"
            - call: "POST /catalog-items"
              payload: { retailer_id: "${r1}", sku: "SKU-C", name: "Ground Coffee Bulk", pricing_unit: "PER_LB", in_store_price_cents: 599, is_ebt_eligible: true, estimated_weight_lb: 2.0 }
              as: RetailerManager
              as_user_id: "${r1}"
            - call: "POST /catalog-items"
              payload: { retailer_id: "${r2}", sku: "SKU-Z", name: "Imported Soda", pricing_unit: "EACH", in_store_price_cents: 500, is_ebt_eligible: false, unit_weight_lb: 1.5 }
              as: RetailerManager
              as_user_id: "${r2}"
          trigger:
            - call: "GET /catalog-items?retailer_id=${r1}&limit=2&offset=0"
              payload: {}
              as: DispatchAdmin
            - call: "GET /catalog-items?retailer_id=${r1}&limit=2&offset=2"
              payload: {}
              as: DispatchAdmin
            - call: "GET /catalog-items?retailer_id=${r1}&limit=0&offset=0"
              payload: {}
              as: DispatchAdmin
              captures: { page_err: $.data.error_id }
          assert:
            - "First call: response_type == 'array', total_count == 3, has_more == true and exactly 2 CatalogItem rows are returned"
            - "Second call: total_count == 3, has_more == false and exactly 1 CatalogItem row is returned"
            - "No returned row has retailer_id == ${r2}"
            - "Third call: 400 with error_id == ERR_INVALID_REQUEST (pagination limit outside 1..100)"

      - name: shopper_lookup_with_unknown_id_reports_not_found
        claim_type: not_found
        grounds:
          - validations[priority=3]
          - errors.ERR_SHOPPER_NOT_FOUND
        distinguishing_aspect: "GET /shoppers/{id} for an id no Shopper row carries answers 404 ERR_SHOPPER_NOT_FOUND rather than 200 with an empty body."
        test_recipe:
          setup:
            - "Empty database; no Shopper row has ever been created."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T08:00:00Z" }
              as: DispatchAdmin
          trigger:
            - call: "GET /shoppers/00000000-0000-0000-0000-0000000009ff"
              payload: {}
              as: DispatchAdmin
              captures: { nf_err: $.data.error_id }
          assert:
            - "Response status is 404 and error_id == ERR_SHOPPER_NOT_FOUND"
            - "response_type == 'error' and the envelope carries meta.api_request_id"

      - name: order_creation_without_customer_id_is_invalid
        claim_type: required_fields
        grounds:
          - validations[priority=5]
          - endpoints[POST /orders]
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "customer_id, retailer_id, delivery_distance_mi and delivery_deadline are the four non-defaulted inputs of POST /orders; omitting customer_id yields 400 ERR_INVALID_REQUEST and creates no Order row."
        test_recipe:
          setup:
            - "Retailer R1 exists; no order has been created."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T08:00:00Z" }
              as: DispatchAdmin
            - call: "POST /retailers"
              payload: { legal_name: "Bay Fresh Market LLC", store_code: "BFM-01", catalog_markup_pct: 0.15 }
              as: DispatchAdmin
              captures: { r1: $.data.id }
            - call: "POST /customers"
              payload: { display_name: "Dana Ortiz", card_last4: "4242" }
              as: CustomerSupport
              captures: { c1: $.data.id }
          trigger:
            - call: "POST /orders"
              payload: { retailer_id: "${r1}", delivery_distance_mi: 3.0, delivery_deadline: "2026-08-01T11:00:00Z" }
              as: Customer
              as_user_id: "${c1}"
              captures: { req_err: $.data.error_id }
          assert:
            - "Response status is 400 and error_id == ERR_INVALID_REQUEST"
            - "GET /orders?customer_id=${c1} returns total_count == 0"

      - name: retailer_defaults_applied_when_optional_fields_omitted
        claim_type: defaults
        grounds:
          - entities.Retailer.fields.catalog_markup_pct
          - entities.Retailer.fields.concurrent_shopper_cap
          - entities.Retailer.fields.status
        distinguishing_aspect: "Creating a Retailer with only legal_name and store_code yields catalog_markup_pct 0.15, parity_disclosure_required true, ebt_snap_enabled true, concurrent_shopper_cap 2 and status ACTIVE."
        test_recipe:
          setup:
            - "Empty database; logical clock at 2026-08-01T08:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T08:00:00Z" }
              as: DispatchAdmin
          trigger:
            - call: "POST /retailers"
              payload: { legal_name: "Minimal Mart LLC", store_code: "MM-12" }
              as: DispatchAdmin
              captures: { rd: $.data.id }
          assert:
            - "Response status is 201"
            - "Retailer.${rd}.catalog_markup_pct == 0.15 and Retailer.${rd}.parity_disclosure_required == true"
            - "Retailer.${rd}.ebt_snap_enabled == true and Retailer.${rd}.concurrent_shopper_cap == 2"
            - "Retailer.${rd}.status == ACTIVE"

      - name: catalog_price_recomputed_on_in_store_price_patch
        claim_type: computed_fields
        grounds:
          - calculations.catalog_price_markup
          - endpoints[PATCH /catalog-items/{id}]
        distinguishing_aspect: "catalog_price_cents is never client-supplied: at 400 in store with markup 0.15 it is 460, and PATCHing in_store_price_cents to 500 rewrites it to 575 in the same response."
        test_recipe:
          setup:
            - "Retailer R1 with catalog_markup_pct 0.15 and one EACH item at 400."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T08:00:00Z" }
              as: DispatchAdmin
            - call: "POST /retailers"
              payload: { legal_name: "Bay Fresh Market LLC", store_code: "BFM-01", catalog_markup_pct: 0.15 }
              as: DispatchAdmin
              captures: { r1: $.data.id }
            - call: "POST /catalog-items"
              payload: { retailer_id: "${r1}", sku: "SKU-EACH-EBT", name: "Canned Beans", pricing_unit: "EACH", in_store_price_cents: 400, is_ebt_eligible: true, unit_weight_lb: 1.0 }
              as: RetailerManager
              as_user_id: "${r1}"
              captures: { i1: $.data.id }
          trigger:
            - call: "PATCH /catalog-items/${i1}"
              payload: { in_store_price_cents: 500 }
              as: RetailerManager
              as_user_id: "${r1}"
          assert:
            - "Before the trigger CatalogItem.${i1}.catalog_price_cents == 460"
            - "Response status is 200 and CatalogItem.${i1}.in_store_price_cents == 500"
            - "CatalogItem.${i1}.catalog_price_cents == 575 (round_half_up(500 * 1.15))"
            - "CatalogItem.${i1}.is_weighted == false (pricing_unit unchanged)"

      - name: customer_system_and_computed_fields_are_input_ignored
        claim_type: system_fields
        grounds:
          - entities.Customer
          - endpoints[POST /customers]
        distinguishing_aspect: "id, created_at and the computed balances of a Customer are server-owned: a create body carrying id, created_at and credit_balance_cents is answered with a server id, created_at equal to the logical clock, and credit_balance_cents 0."
        test_recipe:
          setup:
            - "Logical clock pinned to 2026-08-01T08:00:00Z; no Customer row exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T08:00:00Z" }
              as: DispatchAdmin
          trigger:
            - call: "POST /customers"
              payload: { display_name: "Ghost Writer", card_last4: "9999", id: "11111111-1111-1111-1111-111111111111", created_at: "2020-01-01T00:00:00Z", credit_balance_cents: 99999 }
              as: CustomerSupport
              captures: { cs: $.data.id }
          assert:
            - "Response status is 201 and Customer.${cs}.id != '11111111-1111-1111-1111-111111111111'"
            - "Customer.${cs}.created_at == 2026-08-01T08:00:00Z (logical clock, not the supplied 2020 value)"
            - "Customer.${cs}.credit_balance_cents == 0 and Customer.${cs}.ebt_captured_total_cents == 0"
            - "Customer.${cs}.ebt_snap_balance_cents == 0 (declared default) and version == 1"

      - name: out_of_range_and_unknown_enum_inputs_are_rejected
        claim_type: type_constraints
        grounds:
          - validations[priority=5]
          - entities.Retailer.fields.catalog_markup_pct
          - entities.CatalogItem.fields.pricing_unit
          - endpoints[POST /batches]
        distinguishing_aspect: "Three distinct shape violations all collapse to 400 ERR_INVALID_REQUEST: markup 0.75 above MARKUP_PCT_MAX 0.60, pricing_unit 'BY_CASE' outside the enum, and shop_window_end equal to shop_window_start."
        test_recipe:
          setup:
            - "Retailer R1 exists so the catalog-item body FK resolves and only the enum can fail."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T08:00:00Z" }
              as: DispatchAdmin
            - call: "POST /retailers"
              payload: { legal_name: "Bay Fresh Market LLC", store_code: "BFM-01", catalog_markup_pct: 0.15 }
              as: DispatchAdmin
              captures: { r1: $.data.id }
          trigger:
            - call: "POST /retailers"
              payload: { legal_name: "Overpriced Mart LLC", store_code: "OM-13", catalog_markup_pct: 0.75 }
              as: DispatchAdmin
              captures: { e1: $.data.error_id }
            - call: "POST /catalog-items"
              payload: { retailer_id: "${r1}", sku: "SKU-BAD", name: "Case of Soda", pricing_unit: "BY_CASE", in_store_price_cents: 400 }
              as: RetailerManager
              as_user_id: "${r1}"
              captures: { e2: $.data.error_id }
            - call: "POST /batches"
              payload: { service_area_code: "SF-01", shop_window_start: "2026-08-01T09:00:00Z", shop_window_end: "2026-08-01T09:00:00Z" }
              as: DispatchAdmin
              captures: { e3: $.data.error_id }
          assert:
            - "All three calls answer 400 with error_id == ERR_INVALID_REQUEST"
            - "GET /catalog-items?retailer_id=${r1} returns total_count == 0"
            - "GET /batches?service_area_code=SF-01 returns total_count == 0"

      - name: credit_ledger_entry_is_immutable_and_versionless
        claim_type: immutability
        grounds:
          - entities.CreditLedgerEntry
          - endpoints[POST /customers/{id}/credits]
          - endpoints[GET /credit-ledger-entries]
        distinguishing_aspect: "CreditLedgerEntry declares common_fields false, so rows carry no version and no updated_at and §1.5 exposes no PATCH or DELETE for them; corrections are made by posting a second entry, and Customer.credit_balance_cents is the unfiltered sum."
        test_recipe:
          setup:
            - "Customer C1 with credit_balance_cents 0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T08:00:00Z" }
              as: DispatchAdmin
            - call: "POST /customers"
              payload: { display_name: "Dana Ortiz", card_last4: "4242" }
              as: CustomerSupport
              captures: { c1: $.data.id }
          trigger:
            - call: "POST /customers/${c1}/credits"
              payload: { amount_cents: 250, reason_code: "SUPPORT_GOODWILL" }
              as: CustomerSupport
              captures: { ce1: $.data.id }
            - call: "POST /customers/${c1}/credits"
              payload: { amount_cents: 750, reason_code: "SUPPORT_GOODWILL" }
              as: CustomerSupport
              captures: { ce2: $.data.id }
          assert:
            - "Both calls answer 201; CreditLedgerEntry.${ce1}.amount_cents == 250 and CreditLedgerEntry.${ce2}.amount_cents == 750"
            - "Neither response body carries a `version` or `updated_at` field (common_fields false)"
            - "Customer.${c1}.credit_balance_cents == 1000 (unfiltered sum of both entries)"
            - "GET /credit-ledger-entries?customer_id=${c1} returns total_count == 2"
            - "§1.5 declares no PATCH or DELETE route for /credit-ledger-entries/{id}, so an entry can never be edited"

      - name: order_line_creation_requires_existing_parent_order
        claim_type: parent_relationships
        grounds:
          - validations[priority=3]
          - endpoints[POST /orders/{id}/lines]
          - errors.ERR_ORDER_NOT_FOUND
        distinguishing_aspect: "The path id of POST /orders/{id}/lines is validated at priority 3, before the body FK at priority 6: an unknown order id yields ERR_ORDER_NOT_FOUND even though catalog_item_id is valid."
        test_recipe:
          setup:
            - "Retailer R1 with item I1 exists; no Order row exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T08:00:00Z" }
              as: DispatchAdmin
            - call: "POST /retailers"
              payload: { legal_name: "Bay Fresh Market LLC", store_code: "BFM-01", catalog_markup_pct: 0.15 }
              as: DispatchAdmin
              captures: { r1: $.data.id }
            - call: "POST /catalog-items"
              payload: { retailer_id: "${r1}", sku: "SKU-EACH-EBT", name: "Canned Beans", pricing_unit: "EACH", in_store_price_cents: 400, is_ebt_eligible: true, unit_weight_lb: 1.0 }
              as: RetailerManager
              as_user_id: "${r1}"
              captures: { i1: $.data.id }
            - call: "POST /customers"
              payload: { display_name: "Dana Ortiz", card_last4: "4242" }
              as: CustomerSupport
              captures: { c1: $.data.id }
          trigger:
            - call: "POST /orders/00000000-0000-0000-0000-0000000007ff/lines"
              payload: { catalog_item_id: "${i1}", requested_qty: 1 }
              as: Customer
              as_user_id: "${c1}"
              captures: { pf_err: $.data.error_id }
          assert:
            - "Response status is 404 and error_id == ERR_ORDER_NOT_FOUND"
            - "error_id is NOT ERR_CATALOG_ITEM_NOT_FOUND (the body FK is valid) and NOT ERR_INVALID_REQUEST"
            - "GET /order-lines?catalog_item_id=${i1} returns total_count == 0"

      - name: order_body_foreign_keys_resolved_before_creation
        claim_type: flat
        grounds:
          - validations[priority=6]
          - errors.ERR_RETAILER_NOT_FOUND
          - errors.ERR_CATALOG_ITEM_NOT_FOUND
        distinguishing_aspect: "Flat topology means every FK is a body field checked at priority 6: an unknown retailer_id on POST /orders yields ERR_RETAILER_NOT_FOUND and an unknown catalog_item_id on POST /orders/{id}/lines yields ERR_CATALOG_ITEM_NOT_FOUND, each 404 with no row written."
        test_recipe:
          setup:
            - "Customer C1 and Retailer R1 exist; Order O20 is a DRAFT order of C1 at R1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T08:00:00Z" }
              as: DispatchAdmin
            - call: "POST /retailers"
              payload: { legal_name: "Bay Fresh Market LLC", store_code: "BFM-01", catalog_markup_pct: 0.15 }
              as: DispatchAdmin
              captures: { r1: $.data.id }
            - call: "POST /customers"
              payload: { display_name: "Dana Ortiz", card_last4: "4242" }
              as: CustomerSupport
              captures: { c1: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${c1}", retailer_id: "${r1}", delivery_distance_mi: 3.0, delivery_deadline: "2026-08-01T11:00:00Z" }
              as: Customer
              as_user_id: "${c1}"
              captures: { o20: $.data.id }
          trigger:
            - call: "POST /orders"
              payload: { customer_id: "${c1}", retailer_id: "00000000-0000-0000-0000-0000000001ff", delivery_distance_mi: 3.0, delivery_deadline: "2026-08-01T11:00:00Z" }
              as: Customer
              as_user_id: "${c1}"
              captures: { fk_err_1: $.data.error_id }
            - call: "POST /orders/${o20}/lines"
              payload: { catalog_item_id: "00000000-0000-0000-0000-0000000002ff", requested_qty: 1 }
              as: Customer
              as_user_id: "${c1}"
              captures: { fk_err_2: $.data.error_id }
          assert:
            - "First call: 404 with error_id == ERR_RETAILER_NOT_FOUND"
            - "Second call: 404 with error_id == ERR_CATALOG_ITEM_NOT_FOUND"
            - "GET /orders?customer_id=${c1} returns total_count == 1 (only O20)"
            - "GET /order-lines?order_id=${o20} returns total_count == 0"

  - section: state_machines
    instances:
      - name: order_submit_transitions_both_dimensions
        claim_type: valid_transition
        grounds:
          - state_machines.Order.DRAFT_to_PLACED
          - endpoints[POST /orders/{id}/submit]
          - calculations.order_estimate_authorization
        distinguishing_aspect: "POST /orders/{id}/submit moves fulfillment_status DRAFT -> PLACED and payment_status UNAUTHORIZED -> AUTHORIZED in one call, snapshots the line prices, and writes estimated_subtotal 460 with authorization_ceiling 928 (529 buffered + 399 service fee)."
        test_recipe:
          setup:
            - "Retailer R1 (markup 0.15) with item I1 EACH in_store 400 (catalog 460); Customer C1; DRAFT Order O21 with one line of I1 x1, ebt_requested false, tip 0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T08:00:00Z" }
              as: DispatchAdmin
            - call: "POST /retailers"
              payload: { legal_name: "Bay Fresh Market LLC", store_code: "BFM-01", catalog_markup_pct: 0.15 }
              as: DispatchAdmin
              captures: { r1: $.data.id }
            - call: "POST /catalog-items"
              payload: { retailer_id: "${r1}", sku: "SKU-EACH-EBT", name: "Canned Beans", pricing_unit: "EACH", in_store_price_cents: 400, is_ebt_eligible: true, unit_weight_lb: 1.0 }
              as: RetailerManager
              as_user_id: "${r1}"
              captures: { i1: $.data.id }
            - call: "POST /customers"
              payload: { display_name: "Dana Ortiz", card_last4: "4242" }
              as: CustomerSupport
              captures: { c1: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${c1}", retailer_id: "${r1}", delivery_distance_mi: 3.0, delivery_deadline: "2026-08-01T11:00:00Z", ebt_requested: false, tip_amount_cents: 0 }
              as: Customer
              as_user_id: "${c1}"
              captures: { o21: $.data.id }
            - call: "POST /orders/${o21}/lines"
              payload: { catalog_item_id: "${i1}", requested_qty: 1 }
              as: Customer
              as_user_id: "${c1}"
              captures: { k21: $.data.id }
          trigger:
            - call: "POST /orders/${o21}/submit"
              payload: {}
              as: Customer
              as_user_id: "${c1}"
          assert:
