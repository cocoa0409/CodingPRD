            - "neither call created a Residency; Cycle.stipend_committed_cents stays 0 and slots_filled_count stays 0, so no partial cascade ran behind a rejected validation"
            - "app2 remains 'WAITLISTED' and app1 remains 'OFFERED' - a failed offer-response is a no-op on both applications"
            - "P70 ERR_NO_SLOTS_AVAILABLE is NOT triggered by either call: slots_open_count is still 1, which keeps the conflicting pair to exactly two rules"

      - name: compliance_suspension_beats_studio_interval_conflict
        grounds: "§1.4 P35 ERR_COMPLIANCE_SUSPENDED (business_safety, 422) with conflict_note, P46 ERR_STUDIO_INTERVAL_CONFLICT (business_temporal, 409); §1.5 POST /studio-assignments; §1.2 Residency.compliance_status CLEARED -> SUSPENDED"
        distinguishing_aspect: |
          Category pair: business_safety < business_temporal - a different pair from instance 1 and
          on a different endpoint. A suspended resident asking for a studio window that is already
          taken violates both P35 and P46 at once. Safety outranks scheduling: the resident must be
          told they are suspended, because fixing the calendar would not make the booking legal,
          whereas an implementation that reports the interval clash first invites the resident to
          shop for a free window they can never use. The proof runs in both directions in one
          recipe: reinstating the resident (which changes nothing about the calendar) makes the
          SAME payload surface the temporal error instead.
        test_recipe:
          setup: |
            One cycle, one discipline SCULPT (capability tag WELDING, required ventilation LOCAL,
            requires_hazmat_review false), two applicants and two invited residencies A and B,
            both scheduled for 8 weeks from 2026-11-02 (session_end_date 2026-12-27). A
            SINGLE-OCCUPANCY studio S-01 (max_concurrent_residents 1, capability_tags
            ["WELDING","KILN"], ventilation_class LOCAL, AVAILABLE) is booked for residency A
            across the whole session, 2026-11-02 .. 2026-12-27. Residency B records both required
            trainings (reaching CLEARED so a later REINSTATE is legal under P34) and is then
            SUSPENDED. B's current version is re-read because the suspension bumped it.
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-01"
