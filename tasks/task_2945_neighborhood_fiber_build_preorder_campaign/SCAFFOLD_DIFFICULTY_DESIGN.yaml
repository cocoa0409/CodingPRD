              as: Subscriber
              as_user_id: "${acct1}"
              captures: { p1: $.data.id }
            - call: "POST /permit-applications"
              payload: { build_zone_id: "${z1}", permit_type: "ROW", valid_days: 200, max_resubmissions: 2 }
              as: ProgramManager
              captures: { pa1: $.data.id }
            - call: "POST /permit-applications/${pa1}/submit"
