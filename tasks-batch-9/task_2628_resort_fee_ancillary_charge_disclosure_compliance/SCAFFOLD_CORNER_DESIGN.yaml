            - "Property.${p1}.open_disclosure_obligation_count is still 1 — the docket remains an open obligation precisely because it cannot be answered"
            - "with the clock at exactly 2026-10-01T00:00:00Z the identical call returns HTTP 200 with status RESPONSE_DRAFTED: the rule is at-or-before, so the deadline instant itself is admitted"
            - "the submit edge is guarded identically: drafting at 2026-09-30 and then submitting at 2026-10-01T00:00:01Z is rejected with the same error id while the status stays RESPONSE_DRAFTED"

