              payload: { decision: "REWORK", rework_note: "Re-run the matching engine with normalised legal names" }
              as: DataOwner
              as_user_id: "${own_id}"
              captures: { rw_status: $.data.status, rw_reviewer: $.data.reviewer_steward_id, rw_count: $.data.rework_count }
            - call: "POST /mdm/merge-proposals/${mp_id}/rescore"
              payload: { name_similarity_pct: 95.00, key_overlap_pct: 90.00 }
              as: DataSteward
              as_user_id: "${std_id}"
              captures: { rs_status: $.data.status, rs_score: $.data.match_score, rs_conf: $.data.match_confidence, rs_count: $.data.rework_count }
            - call: "POST /mdm/merge-proposals/${mp_id}/review"
              payload: {}
              as: DataSteward
              as_user_id: "${std_id}"
            - call: "POST /mdm/merge-proposals/${mp_id}/decide"
              payload: { decision: "MERGE", override_justification: "Normalised names and DUNS both agree on a single entity" }
              as: DataOwner
              as_user_id: "${own_id}"
              captures: { fin_status: $.data.status, fin_variant: $.data.survivorship_variant, fin_effective: $.data.effective_survivor_master_record_id, fin_swapped: $.data.survivor_swapped, fin_count: $.data.rework_count }
            - call: "GET /mdm/master-records/${rec_a_id}"
              as: GovernanceAdmin
              captures: { a_completeness: $.data.completeness_pct, a_score: $.data.survivorship_score }
          assert:
            - "${score0} == 53.00 and ${conf0} == LOW and ${rework0} == 0"
            - "${low_conf_error} == ERR_MATCH_CONFIDENCE_TOO_LOW (HTTP 422; a LOW-confidence proposal cannot merge even with an override justification)"
            - "${rw_status} == REWORK and ${rw_reviewer} == null and ${rw_count} == 0"
            - "${rs_status} == PROPOSED and ${rs_score} == 82.50 and ${rs_conf} == MEDIUM and ${rs_count} == 1"
            - "${fin_status} == MERGED and ${fin_count} == 1"
            - "${fin_variant} == SOURCE_PRIORITY and ${fin_effective} == ${rec_a_id} and ${fin_swapped} == false"
            - "${a_completeness} == 100.00 and ${a_score} == 96.00"
            - "MasterRecord.${rec_b_id}.curation_status == MERGED_AWAY"

  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: source_decertification_five_hop_cascade_to_consumer_lineage
        grounds:
          - state_machines.SourceSystem.CERTIFIED_to_DECERTIFIED
          - state_machines.Domain.OPEN_to_FROZEN
          - state_machines.MasterRecord.CURATED_to_QUARANTINED
          - entities.ConsumerSubscription.fields.lineage_status
          - entities.Domain.fields.published_master_record_count
        distinguishing_aspect: |
          One decertify call must propagate five hops in order - SourceSystem DECERTIFIED ->
          SourceRegistration REVOKED -> Domain FROZEN with authoritative_source_code null ->
          PUBLISHED MasterRecord RETRACTED + QUARANTINED with published_master_record_count
          driven to 0 -> DOCUMENTED consumer lineage STALE - while Domain.status stays ACTIVE
          because posture and status are independent dimensions.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-05T00:00:00Z."
            - "Domain CUSTOMER ACTIVE / OPEN with ERP (trust_tier 4) CERTIFIED and holding the only ACTIVE AUTHORITATIVE registration."
            - "Consumer C1 (TIER1, clearance INTERNAL, required_lead_days 10) has lineage DOCUMENTED as ERP -> STG_CUSTOMER -> RPT_CUST_360."
            - "MasterRecord A (ERP, 4 of 5 attributes -> completeness_pct 80.00) is CURATED and PUBLISHED, so published_master_record_count is 1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: GovernanceAdmin
            - call: "POST /mdm/domains"
              payload: { code: "CUSTOMER", name: "Customer Master", classification_level: "INTERNAL", notification_lead_days_floor: 5, expected_attribute_count: 5 }
              as: GovernanceAdmin
              captures: { dom_id: $.data.id, dom_v1: $.data.version }
            - call: "POST /mdm/stewards"
              payload: { full_name: "Olivia Owner", email: "olivia@mdm.test", certification_level: "PRINCIPAL" }
              as: GovernanceAdmin
              captures: { own_id: $.data.id }
            - call: "POST /mdm/stewards"
              payload: { full_name: "Sam Steward", email: "sam@mdm.test", certification_level: "SENIOR" }
              as: GovernanceAdmin
              captures: { std_id: $.data.id }
            - call: "POST /mdm/steward-assignments"
              payload: { domain_id: "${dom_id}", steward_id: "${own_id}", steward_role: "DATA_OWNER", effective_from: "2026-08-01T00:00:00Z", expected_domain_version: "${dom_v1}" }
              as: GovernanceAdmin
            - call: "GET /mdm/domains/${dom_id}"
              as: GovernanceAdmin
              captures: { dom_v2: $.data.version }
            - call: "POST /mdm/steward-assignments"
              payload: { domain_id: "${dom_id}", steward_id: "${std_id}", steward_role: "DATA_STEWARD", effective_from: "2026-08-01T00:00:00Z", expected_domain_version: "${dom_v2}" }
              as: GovernanceAdmin
            - call: "POST /mdm/source-systems"
              payload: { code: "ERP", name: "ERP Core", trust_tier: 4 }
              as: GovernanceAdmin
              captures: { erp_id: $.data.id }
            - call: "POST /mdm/source-systems/${erp_id}/certify"
              payload: {}
              as: GovernanceAdmin
            - call: "GET /mdm/domains/${dom_id}"
              as: GovernanceAdmin
              captures: { dom_v3: $.data.version }
            - call: "POST /mdm/source-registrations"
              payload: { domain_id: "${dom_id}", source_system_id: "${erp_id}", role: "AUTHORITATIVE", trust_rank: 1, effective_from: "2026-08-01T00:00:00Z", expected_domain_version: "${dom_v3}" }
              as: GovernanceAdmin
              captures: { reg_erp_id: $.data.id }
            - call: "POST /mdm/quality-rules"
              payload: { domain_id: "${dom_id}", owner_steward_id: "${std_id}", rule_code: "QR1", dimension: "COMPLETENESS", weight_points: 40, threshold_pct: 90.00, severity: "HIGH" }
              as: DataSteward
              as_user_id: "${std_id}"
            - call: "POST /mdm/domains/${dom_id}/activate"
              payload: {}
              as: GovernanceAdmin
            - call: "POST /mdm/consumer-subscriptions"
              payload: { domain_id: "${dom_id}", consumer_code: "BI_CUSTOMER_360", reporting_asset_key: "RPT_CUST_360", clearance_level: "INTERNAL", criticality: "TIER1", required_lead_days: 10 }
              as: GovernanceAdmin
              captures: { c1_id: $.data.id }
            - call: "PATCH /mdm/consumer-subscriptions/${c1_id}/lineage"
              payload: { lineage_path: ["ERP", "STG_CUSTOMER", "RPT_CUST_360"] }
              as: DataSteward
              as_user_id: "${std_id}"
              captures: { c1_lineage_status: $.data.lineage_status, c1_lineage_rev: $.data.lineage_revision }
            - call: "POST /mdm/master-records"
              payload: { domain_id: "${dom_id}", source_system_id: "${erp_id}", natural_key: "ERP-CUST-1001", attributes: { legal_name: "Acme Industrial", tax_id: "TX-77", billing_city: "Austin", contact_email: "ops@acme.test" }, last_verified_at: "2026-07-01T00:00:00Z" }
              as: DataSteward
              as_user_id: "${std_id}"
              captures: { rec_a_id: $.data.id, rec_a_completeness: $.data.completeness_pct }
            - call: "POST /mdm/master-records/${rec_a_id}/curate"
              payload: {}
              as: DataSteward
              as_user_id: "${std_id}"
            - call: "POST /mdm/master-records/${rec_a_id}/publish"
              payload: {}
              as: DataSteward
              as_user_id: "${std_id}"
              captures: { rec_a_pub: $.data.publication_status }
            - call: "GET /mdm/domains/${dom_id}"
              as: GovernanceAdmin
              captures: { pub_count_before: $.data.published_master_record_count, posture_before: $.data.governance_posture, auth_code_before: $.data.authoritative_source_code }
          trigger:
            - call: "POST /mdm/source-systems/${erp_id}/decertify"
              payload: { reason: "Vendor end-of-life; extracts no longer trustworthy" }
              as: GovernanceAdmin
              captures: { src_status: $.data.status, src_decertified_at: $.data.decertified_at }
            - call: "GET /mdm/domains/${dom_id}"
              as: GovernanceAdmin
              captures: { dom_status_after: $.data.status, posture_after: $.data.governance_posture, auth_code_after: $.data.authoritative_source_code, pub_count_after: $.data.published_master_record_count }
            - call: "GET /mdm/source-registrations/${reg_erp_id}"
              as: GovernanceAdmin
              captures: { reg_status: $.data.status, reg_revoked_reason: $.data.revoked_reason }
            - call: "GET /mdm/master-records/${rec_a_id}"
              as: GovernanceAdmin
              captures: { rec_cur_after: $.data.curation_status, rec_pub_after: $.data.publication_status, rec_quarantine: $.data.quarantine_reason }
            - call: "GET /mdm/consumer-subscriptions/${c1_id}"
              as: GovernanceAdmin
              captures: { c1_lineage_after: $.data.lineage_status, c1_status_after: $.data.status }
          assert:
            - "${rec_a_completeness} == 80.00 and ${rec_a_pub} == PUBLISHED"
            - "${c1_lineage_status} == DOCUMENTED and ${c1_lineage_rev} == 0"
            - "${pub_count_before} == 1 and ${posture_before} == OPEN and ${auth_code_before} == ERP"
            - "${src_status} == DECERTIFIED (hop 1)"
            - "${src_decertified_at} == 2026-08-05T00:00:00Z"
            - "${reg_status} == REVOKED (hop 2)"
            - "${reg_revoked_reason} == SOURCE_DECERTIFIED"
            - "${posture_after} == FROZEN and ${auth_code_after} == null (hop 3)"
            - "${rec_pub_after} == RETRACTED and ${rec_cur_after} == QUARANTINED (hop 4)"
            - "${rec_quarantine} == AUTHORITATIVE_SOURCE_LOST"
            - "${pub_count_after} == 0 (hop 4)"
            - "${c1_lineage_after} == STALE (hop 5)"
            - "${c1_status_after} == ACTIVE (the cascade never suspends a consumer)"
            - "${dom_status_after} == ACTIVE (status dimension untouched by the posture cascade)"

      - name: classification_uplift_apply_three_hop_impact_reassessment
        grounds:
          - state_machines.ChangeRequest.SCHEDULED_to_APPLIED
