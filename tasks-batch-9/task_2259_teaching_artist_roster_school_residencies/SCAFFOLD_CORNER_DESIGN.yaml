      - name: arts_standard_create_then_filtered_catalog_read
        claim_type: standard_crud
        grounds:
          - endpoints[POST /arts-standards]
          - endpoints[GET /arts-standards]
          - errors[ERR_DUPLICATE_STANDARD_CODE]
        distinguishing_aspect: "The catalog list applies discipline, grade_band and strand as an AND-filter, so the DANCE/G3_5/CREATING query returns exactly 1 of the 3 catalogued standards; a re-post of the same code is refused with ERR_DUPLICATE_STANDARD_CODE."
        test_recipe:
          setup:
            - "Empty database apart from the logical clock call."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramDirector
          trigger:
            - call: "POST /arts-standards"
              payload: { code: "DA:Cr1.1.4", discipline: "DANCE", grade_band: "G3_5", strand: "CREATING", description: "Improvise movement ideas drawn from a story prompt." }
              as: CurriculumSpecialist
              captures: { st1_id: $.data.id, st1_code: $.data.code }
            - call: "POST /arts-standards"
              payload: { code: "DA:Re7.1.4", discipline: "DANCE", grade_band: "G3_5", strand: "RESPONDING", description: "Describe how a dance conveys meaning." }
