            - "hop 3: a following POST /api/appointments/${ap_id}/complete with a description of at least ten words returns ERR_DISCOUNT_FLOOR_REACHED (422) because quoted_price_cents 500000 against sold lines of 300000 is an effective discount of 0.40"
      - name: appointment_completion_ledger_cascade
        grounds:
          - state_machines.Appointment.DISPATCHED_to_COMPLETED
          - state_machines.MembershipVisit.SCHEDULED_to_COMPLETED
          - calculations.technician_revenue_ledger_total
          - calculations.membership_revenue_recognition
        distinguishing_aspect: |
          Depth 4 cascade from a different trigger than the discount-floor chain: completing an appointment
          walks dispatch release, ledger accrual, visit completion and agreement revenue recognition, each
          hop caused by the hop before it rather than by the original completion request.
        test_recipe:
