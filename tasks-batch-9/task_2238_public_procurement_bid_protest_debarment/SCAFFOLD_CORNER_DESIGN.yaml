            - call: "POST /procurement/protests"
              payload: { solicitation_id: "${c_s22_id}", protester_vendor_id: "${c_v55_id}", grounds_code: "SOLICITATION_IMPROPRIETY", narrative: "the precast plant certification excludes cast in place construction" }
              as: Vendor
