            - call: "POST /amc/properties"
              payload: { street_address: "31 CA St", state_code: "CA" }
              as: AMCCoordinator
              captures: { p_id: $.data.id }
            - call: "POST /amc/orders"
              payload: { lender_id: "${l_id}", property_id: "${p_id}", order_fee_cents: 50000, product_type: "URAR_1004" }
              as: AMCCoordinator
              captures: { o_id: $.data.id, o_v0: $.data.version }
            - call: "POST /amc/orders/${o_id}/assignments"
              payload: { expected_order_version: "${o_v0}" }
              as: AMCCoordinator
