              as: ArchiveResearcher
            - call: "POST /licenses"
              payload: { production_id: "${prod_id}", asset_id: "${asset_id}", archive_id: "${arch_a}", rights_leg: "FOOTAGE", media: "BROADCAST", territory: "WORLD", window_class: "ALL_MEDIA_WINDOW", term_months: 12, term_start_date: "2026-08-15", term_end_date: "2027-08-15" }
              as: ClearanceSupervisor
