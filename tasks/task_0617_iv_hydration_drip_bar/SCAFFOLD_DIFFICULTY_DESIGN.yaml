# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN.yaml — §1.8 Test Targeting Index
# IV Hydration & Vitamin Drip Bar — Expert tier
# 9 Difficulty Rules × 2 instances = 18 instances.
# Every grounds[] ref resolves into SCAFFOLD.yaml §1.1–§1.7.
# All formula-derived asserts are precomputed literals.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: dv_visit_charge_cash_vs_member_credit
        grounds:
          - calculations.visit_charge_waterfall
          - calculations.visit_charge_waterfall.variants.cash_visit
          - calculations.visit_charge_waterfall.variants.member_credit_visit
          - entities.Appointment.fields.amount_charged_cents
          - entities.Membership.fields.drip_credits_remaining
        distinguishing_aspect: >
          Identical NAD drip + [glutathione, b12] yields amount_charged_cents=72000
          as a cash visit (no membership) but 11438 as a PLATINUM member-credit visit
          (drip + first add-on credit-covered, b12 discounted, +9500 mobile surcharge) —
          the dual variant lives on the Appointment/Membership cost domain.
        test_recipe:
          setup:
            - "Clock at 2026-06-22; NAD drip menu item (requires_standing_order=true), glutathione + b12 add-ons."
            - "Cash appointment A1: NAD + [glutathione,b12], LOUNGE (lounge with 2 bays), no membership, CLEARED screening + signed consent, ACTIVE NAD standing order, supply for all lines."
            - "Member appointment A2: same drip+addons, MOBILE, PLATINUM membership (covered_drip_tier=NAD, 1 drip credit, 1 addon credit)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-22T00:00:00Z" }
              as: ClinicAdmin
            - call: "POST /menu-items"
              payload: { name: "NAD+", tier: "NAD", base_price_cents: 65000, requires_standing_order: true, g6pd_sensitive: false }
              as: ClinicAdmin
              captures: { nad_id: $.data.id }
            - call: "POST /add-ons"
              payload: { name: "Glutathione Push", code: "GLUTATHIONE", price_cents: 4500 }
              as: ClinicAdmin
              captures: { glut_id: $.data.id }
            - call: "POST /add-ons"
              payload: { name: "B12 Boost", code: "B12", price_cents: 2500 }
              as: ClinicAdmin
              captures: { b12_id: $.data.id }
            - call: "POST /lounges"
              payload: { name: "Downtown Lounge", bay_count: 2, open_minute_of_day: 480, close_minute_of_day: 1200 }
              as: ClinicAdmin
              captures: { lounge_id: $.data.id }
            - call: "POST /supply-lots"
              payload: { item_kind: "DRIP_BASE", tier_or_code: "NAD", lot_number: "NAD-L1", units_total: 10, expires_at: "2026-12-31T00:00:00Z" }
              as: ClinicAdmin
            - call: "POST /supply-lots"
              payload: { item_kind: "ADDON", tier_or_code: "GLUTATHIONE", lot_number: "GLU-L1", units_total: 10, expires_at: "2026-12-31T00:00:00Z" }
              as: ClinicAdmin
            - call: "POST /supply-lots"
              payload: { item_kind: "ADDON", tier_or_code: "B12", lot_number: "B12-L1", units_total: 10, expires_at: "2026-12-31T00:00:00Z" }
              as: ClinicAdmin
            - call: "POST /standing-orders"
              payload: { medical_director_user_id: "md-1", covered_tier: "NAD", effective_from: "2026-06-01T00:00:00Z", expires_at: "2026-12-31T00:00:00Z" }
              as: MedicalDirector
              as_user_id: "md-1"
              captures: { so_id: $.data.id }
            - call: "POST /standing-orders/${so_id}/activate"
              payload: {}
              as: MedicalDirector
              as_user_id: "md-1"
            # --- A1 cash visit ---
            - call: "POST /patients"
              payload: { full_name: "Cash Pat", date_of_birth: "1990-01-01T00:00:00Z" }
              as: ClinicAdmin
              captures: { pat1_id: $.data.id }
            - call: "POST /appointments"
              payload: { patient_id: "${pat1_id}", menu_item_id: "${nad_id}", addon_ids: ["${glut_id}", "${b12_id}"], location_type: "LOUNGE", lounge_id: "${lounge_id}", start_at: "2026-06-23T09:00:00Z", duration_minutes: 60 }
              as: ClinicAdmin
              captures: { a1_id: $.data.id }
            - call: "POST /appointments/${a1_id}/intake"
              payload: { author_user_id: "intake-1" }
              as: IntakeNurse
              as_user_id: "intake-1"
            - call: "POST /consents"
              payload: { appointment_id: "${a1_id}", signed_by_patient: true, witness_user_id: "wit-1" }
              as: ClinicAdmin
            - call: "GET /appointments/${a1_id}"
              payload: {}
              as: ClinicAdmin
              captures: { a1_v: $.data.version }
            # --- A2 member-credit visit ---
            - call: "POST /memberships"
              payload: { tier: "PLATINUM", covered_drip_tier: "NAD", drip_credits_total: 1, addon_credits_total: 1 }
              as: ClinicAdmin
              captures: { mem_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Member Pat", date_of_birth: "1990-01-01T00:00:00Z", membership_id: "${mem_id}" }
              as: ClinicAdmin
              captures: { pat2_id: $.data.id }
            - call: "POST /appointments"
              payload: { patient_id: "${pat2_id}", menu_item_id: "${nad_id}", addon_ids: ["${glut_id}", "${b12_id}"], location_type: "MOBILE", start_at: "2026-06-23T13:00:00Z", duration_minutes: 60, membership_id: "${mem_id}" }
              as: ClinicAdmin
              captures: { a2_id: $.data.id }
            - call: "POST /appointments/${a2_id}/intake"
              payload: { author_user_id: "intake-1" }
              as: IntakeNurse
              as_user_id: "intake-1"
            - call: "POST /consents"
              payload: { appointment_id: "${a2_id}", signed_by_patient: true, witness_user_id: "wit-1" }
              as: ClinicAdmin
            - call: "GET /appointments/${a2_id}"
              payload: {}
              as: ClinicAdmin
              captures: { a2_v: $.data.version }
          trigger:
            - call: "POST /appointments/${a1_id}/schedule"
              payload: { expected_appointment_version: "${a1_v}" }
              as: ClinicAdmin
              captures: { a1_charge: $.data.amount_charged_cents }
            - call: "POST /appointments/${a2_id}/schedule"
              payload: { expected_appointment_version: "${a2_v}" }
              as: ClinicAdmin
              captures: { a2_charge: $.data.amount_charged_cents }
          assert:
            - "Appointment.${a1_id}.amount_charged_cents == 72000"
            - "Appointment.${a1_id}.drip_credit_used == 0"
            - "Appointment.${a2_id}.amount_charged_cents == 11438"
            - "Appointment.${a2_id}.drip_credit_used == 1"
            - "Appointment.${a2_id}.addon_credits_used == 1"
            - "Membership.${mem_id}.drip_credits_remaining == 0"
            - "Membership.${mem_id}.addon_credits_remaining == 0"

      - name: dv_contraindication_standard_vs_g6pd_sensitive
        grounds:
          - calculations.contraindication_score
          - calculations.contraindication_score.variants.standard_drip
          - calculations.contraindication_score.variants.g6pd_sensitive_drip
          - entities.IntakeScreening.fields.contraindication_score
          - entities.IntakeScreening.fields.outcome
        distinguishing_aspect: >
          The same intake flags {renal, cardiac, g6pd} score 55 -> REQUIRES_MD_REVIEW
          on a standard drip (g6pd_deficiency not counted) but 90 -> BLOCKED on a
          g6pd_sensitive drip — the dual variant lives on the IntakeScreening risk
          domain, distinct from the Appointment cost domain in the first instance.
        test_recipe:
          setup:
            - "Clock 2026-06-22; MYERS drip g6pd_sensitive=false (no standing order required) and IMMUNITY drip g6pd_sensitive=true."
            - "Two appointments for two patients (DOB 1990), each screened with pregnancy=false, renal_impairment=true, cardiac_history=true, g6pd_deficiency=true."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-22T00:00:00Z" }
              as: ClinicAdmin
            - call: "POST /menu-items"
              payload: { name: "Myers", tier: "MYERS", base_price_cents: 17500, requires_standing_order: false, g6pd_sensitive: false }
              as: ClinicAdmin
              captures: { myers_id: $.data.id }
            - call: "POST /menu-items"
              payload: { name: "Immunity", tier: "IMMUNITY", base_price_cents: 19500, requires_standing_order: false, g6pd_sensitive: true }
              as: ClinicAdmin
              captures: { imm_id: $.data.id }
            - call: "POST /lounges"
              payload: { name: "L1", bay_count: 4 }
              as: ClinicAdmin
              captures: { lounge_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Std Pat", date_of_birth: "1990-01-01T00:00:00Z" }
              as: ClinicAdmin
              captures: { p_std_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "G6 Pat", date_of_birth: "1990-01-01T00:00:00Z" }
              as: ClinicAdmin
              captures: { p_g6_id: $.data.id }
            - call: "POST /appointments"
              payload: { patient_id: "${p_std_id}", menu_item_id: "${myers_id}", location_type: "LOUNGE", lounge_id: "${lounge_id}", start_at: "2026-06-23T09:00:00Z" }
              as: ClinicAdmin
              captures: { a_std_id: $.data.id }
            - call: "POST /appointments"
              payload: { patient_id: "${p_g6_id}", menu_item_id: "${imm_id}", location_type: "LOUNGE", lounge_id: "${lounge_id}", start_at: "2026-06-23T10:00:00Z" }
              as: ClinicAdmin
              captures: { a_g6_id: $.data.id }
          trigger:
            - call: "POST /appointments/${a_std_id}/intake"
              payload: { author_user_id: "intake-1", renal_impairment: true, cardiac_history: true, g6pd_deficiency: true }
              as: IntakeNurse
              as_user_id: "intake-1"
              captures: { s_std_id: $.data.id, s_std_score: $.data.contraindication_score, s_std_outcome: $.data.outcome }
            - call: "POST /appointments/${a_g6_id}/intake"
              payload: { author_user_id: "intake-1", renal_impairment: true, cardiac_history: true, g6pd_deficiency: true }
              as: IntakeNurse
              as_user_id: "intake-1"
              captures: { s_g6_id: $.data.id, s_g6_score: $.data.contraindication_score, s_g6_outcome: $.data.outcome }
          assert:
            - "IntakeScreening.${s_std_id}.contraindication_score == 55"
            - "IntakeScreening.${s_std_id}.outcome == REQUIRES_MD_REVIEW"
            - "IntakeScreening.${s_g6_id}.contraindication_score == 90"
            - "IntakeScreening.${s_g6_id}.outcome == BLOCKED"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: combo_visit_charge_round_per_line_then_sum
        grounds:
          - calculations.visit_charge_waterfall
          - entities.Appointment.fields.amount_charged_cents
          - entities.Appointment.fields.addon_ids
        distinguishing_aspect: >
          Mode (b) nested rounding: PLATINUM 22.5% discount on MYERS+[glut,b12,zofran]
          rounded PER LINE then summed = 21314, whereas summing raw then rounding once
          = 21313; the scaffold pins round-per-line-then-sum, so the only correct
          amount_charged_cents is 21314.
        test_recipe:
          setup:
            - "Clock 2026-06-22; MYERS drip (no standing order), 3 add-ons (glutathione/b12/zofran); PLATINUM membership with ZERO credits so every line is discounted cash."
            - "LOUNGE appointment, CLEARED screening + consent, supply for all 4 lines."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-22T00:00:00Z" }
              as: ClinicAdmin
            - call: "POST /menu-items"
              payload: { name: "Myers", tier: "MYERS", base_price_cents: 17500, requires_standing_order: false, g6pd_sensitive: false }
              as: ClinicAdmin
              captures: { myers_id: $.data.id }
            - call: "POST /add-ons"
              payload: { name: "Glutathione", code: "GLUTATHIONE", price_cents: 4500 }
              as: ClinicAdmin
              captures: { glut_id: $.data.id }
            - call: "POST /add-ons"
              payload: { name: "B12", code: "B12", price_cents: 2500 }
              as: ClinicAdmin
              captures: { b12_id: $.data.id }
            - call: "POST /add-ons"
              payload: { name: "Zofran", code: "ZOFRAN", price_cents: 3000 }
              as: ClinicAdmin
              captures: { zof_id: $.data.id }
            - call: "POST /lounges"
              payload: { name: "L1", bay_count: 3 }
              as: ClinicAdmin
              captures: { lounge_id: $.data.id }
            - call: "POST /supply-lots"
              payload: { item_kind: "DRIP_BASE", tier_or_code: "MYERS", lot_number: "MY-1", units_total: 10, expires_at: "2026-12-31T00:00:00Z" }
              as: ClinicAdmin
            - call: "POST /supply-lots"
              payload: { item_kind: "ADDON", tier_or_code: "GLUTATHIONE", lot_number: "GL-1", units_total: 10, expires_at: "2026-12-31T00:00:00Z" }
              as: ClinicAdmin
            - call: "POST /supply-lots"
              payload: { item_kind: "ADDON", tier_or_code: "B12", lot_number: "B-1", units_total: 10, expires_at: "2026-12-31T00:00:00Z" }
              as: ClinicAdmin
            - call: "POST /supply-lots"
              payload: { item_kind: "ADDON", tier_or_code: "ZOFRAN", lot_number: "Z-1", units_total: 10, expires_at: "2026-12-31T00:00:00Z" }
              as: ClinicAdmin
            - call: "POST /memberships"
              payload: { tier: "PLATINUM", covered_drip_tier: "MYERS", drip_credits_total: 0, addon_credits_total: 0 }
              as: ClinicAdmin
              captures: { mem_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Plat Pat", date_of_birth: "1990-01-01T00:00:00Z", membership_id: "${mem_id}" }
              as: ClinicAdmin
              captures: { pat_id: $.data.id }
            - call: "POST /appointments"
              payload: { patient_id: "${pat_id}", menu_item_id: "${myers_id}", addon_ids: ["${glut_id}", "${b12_id}", "${zof_id}"], location_type: "LOUNGE", lounge_id: "${lounge_id}", start_at: "2026-06-23T09:00:00Z", membership_id: "${mem_id}" }
              as: ClinicAdmin
              captures: { ap_id: $.data.id }
            - call: "POST /appointments/${ap_id}/intake"
              payload: { author_user_id: "intake-1" }
              as: IntakeNurse
              as_user_id: "intake-1"
            - call: "POST /consents"
              payload: { appointment_id: "${ap_id}", signed_by_patient: true, witness_user_id: "wit-1" }
              as: ClinicAdmin
            - call: "GET /appointments/${ap_id}"
              payload: {}
              as: ClinicAdmin
              captures: { ap_v: $.data.version }
          trigger:
            - call: "POST /appointments/${ap_id}/schedule"
              payload: { expected_appointment_version: "${ap_v}" }
              as: ClinicAdmin
              captures: { charge: $.data.amount_charged_cents }
          assert:
            - "Appointment.${ap_id}.amount_charged_cents == 21314"
            - "Appointment.${ap_id}.drip_credit_used == 0"
            - "Appointment.${ap_id}.addon_credits_used == 0"

      - name: combo_contraindication_nonlinear_conditional_branch
        grounds:
          - calculations.contraindication_score
          - calculations.contraindication_score.constants
          - entities.InfusionMenuItem.fields.g6pd_sensitive
          - entities.IntakeScreening.fields.outcome
        distinguishing_aspect: >
          Mode (a) >=3-input non-linear formula: the g6pd_deficiency term is gated by
          menu_item.g6pd_sensitive AND age_over_70 adds a clock-derived term, so
          pregnancy(40)+age_over_70(10)=50 lands REQUIRES_MD_REVIEW while the same
          flags on an under-70 patient score 40 — a conditional-branch interaction
          distinct from instance one's pure nested-rounding mode (b).
        test_recipe:
          setup:
            - "Clock 2026-06-22; IMMUNITY drip g6pd_sensitive=true; one patient born 1950 (age 76 at start_at) and one born 1990."
            - "Both screened pregnancy=true only (g6pd_deficiency=false to isolate the age term)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-22T00:00:00Z" }
              as: ClinicAdmin
            - call: "POST /menu-items"
              payload: { name: "Immunity", tier: "IMMUNITY", base_price_cents: 19500, requires_standing_order: false, g6pd_sensitive: true }
              as: ClinicAdmin
              captures: { imm_id: $.data.id }
            - call: "POST /lounges"
              payload: { name: "L1", bay_count: 4 }
              as: ClinicAdmin
              captures: { lounge_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Old Pat", date_of_birth: "1950-01-01T00:00:00Z" }
              as: ClinicAdmin
              captures: { p_old_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Young Pat", date_of_birth: "1990-01-01T00:00:00Z" }
              as: ClinicAdmin
              captures: { p_young_id: $.data.id }
            - call: "POST /appointments"
              payload: { patient_id: "${p_old_id}", menu_item_id: "${imm_id}", location_type: "LOUNGE", lounge_id: "${lounge_id}", start_at: "2026-06-23T09:00:00Z" }
              as: ClinicAdmin
              captures: { a_old_id: $.data.id }
            - call: "POST /appointments"
              payload: { patient_id: "${p_young_id}", menu_item_id: "${imm_id}", location_type: "LOUNGE", lounge_id: "${lounge_id}", start_at: "2026-06-23T10:00:00Z" }
              as: ClinicAdmin
              captures: { a_young_id: $.data.id }
          trigger:
            - call: "POST /appointments/${a_old_id}/intake"
              payload: { author_user_id: "intake-1", pregnancy: true }
              as: IntakeNurse
              as_user_id: "intake-1"
              captures: { s_old_id: $.data.id, s_old_score: $.data.contraindication_score }
            - call: "POST /appointments/${a_young_id}/intake"
              payload: { author_user_id: "intake-1", pregnancy: true }
              as: IntakeNurse
              as_user_id: "intake-1"
              captures: { s_young_id: $.data.id, s_young_score: $.data.contraindication_score }
          assert:
            - "IntakeScreening.${s_old_id}.contraindication_score == 50"
            - "IntakeScreening.${s_old_id}.outcome == REQUIRES_MD_REVIEW"
            - "IntakeScreening.${s_young_id}.contraindication_score == 40"
            - "IntakeScreening.${s_young_id}.outcome == REQUIRES_MD_REVIEW"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: nl_appointment_fork_review_then_approve
        grounds:
          - state_machines.Appointment.SCREEN_PENDING_to_REQUIRES_MD_REVIEW
          - state_machines.Appointment.REQUIRES_MD_REVIEW_to_SCHEDULED
          - state_machines.Appointment.REQUIRES_MD_REVIEW_to_DECLINED
          - entities.Appointment.fields.status
        distinguishing_aspect: >
          Appointment is a branching fork-join: SCREEN_PENDING forks to
          REQUIRES_MD_REVIEW when outcome demands review, and REQUIRES_MD_REVIEW
          itself forks to {SCHEDULED via md-approve, DECLINED via md-decline} with
          divergent side-effects — distinct entity from the Membership cycle below.
        test_recipe:
          setup:
            - "Clock 2026-06-22; MYERS drip (no standing order), LOUNGE; patient screened pregnancy+age? use pregnancy+adverse=60? no -> review needs 40..59. Use pregnancy+age via DOB 1950 = 50 -> REQUIRES_MD_REVIEW."
            - "Signed consent by witness wit-1; intake author intake-1; md approver md-2 (!= intake-1)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-22T00:00:00Z" }
              as: ClinicAdmin
            - call: "POST /menu-items"
              payload: { name: "Myers", tier: "MYERS", base_price_cents: 17500, requires_standing_order: false, g6pd_sensitive: false }
              as: ClinicAdmin
              captures: { myers_id: $.data.id }
            - call: "POST /lounges"
              payload: { name: "L1", bay_count: 3 }
              as: ClinicAdmin
              captures: { lounge_id: $.data.id }
            - call: "POST /supply-lots"
              payload: { item_kind: "DRIP_BASE", tier_or_code: "MYERS", lot_number: "MY-1", units_total: 5, expires_at: "2026-12-31T00:00:00Z" }
              as: ClinicAdmin
            - call: "POST /patients"
              payload: { full_name: "Old Pat", date_of_birth: "1950-01-01T00:00:00Z" }
              as: ClinicAdmin
              captures: { pat_id: $.data.id }
            - call: "POST /appointments"
              payload: { patient_id: "${pat_id}", menu_item_id: "${myers_id}", location_type: "LOUNGE", lounge_id: "${lounge_id}", start_at: "2026-06-23T09:00:00Z" }
              as: ClinicAdmin
              captures: { ap_id: $.data.id }
            - call: "POST /appointments/${ap_id}/intake"
              payload: { author_user_id: "intake-1", pregnancy: true }
              as: IntakeNurse
              as_user_id: "intake-1"
            - call: "POST /consents"
              payload: { appointment_id: "${ap_id}", signed_by_patient: true, witness_user_id: "wit-1" }
              as: ClinicAdmin
            - call: "GET /appointments/${ap_id}"
              payload: {}
              as: ClinicAdmin
              captures: { ap_v1: $.data.version }
            - call: "POST /appointments/${ap_id}/schedule"
              payload: { expected_appointment_version: "${ap_v1}" }
              as: ClinicAdmin
              captures: { st_after_review: $.data.status }
            - call: "GET /appointments/${ap_id}"
              payload: {}
              as: ClinicAdmin
              captures: { ap_v2: $.data.version }
          trigger:
            - call: "POST /appointments/${ap_id}/md-approve"
              payload: { expected_appointment_version: "${ap_v2}" }
              as: MedicalDirector
              as_user_id: "md-2"
              captures: { final_status: $.data.status }
          assert:
            - "Appointment.${ap_id}.status == SCHEDULED"
            - "Appointment.${ap_id}.amount_charged_cents == 17500"

      - name: nl_membership_suspend_reinstate_cycle
        grounds:
          - state_machines.Membership.ACTIVE_to_SUSPENDED
          - state_machines.Membership.SUSPENDED_to_ACTIVE
          - entities.Membership.fields.status
        distinguishing_aspect: >
          Membership is a cyclic machine (ACTIVE->SUSPENDED->ACTIVE): reinstate
          returns to a previously-visited state, a non-linear loop on an entity
          distinct from the Appointment fork above.
        test_recipe:
          setup:
            - "Clock 2026-06-22; a GOLD membership created ACTIVE."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-22T00:00:00Z" }
              as: ClinicAdmin
            - call: "POST /memberships"
              payload: { tier: "GOLD", covered_drip_tier: "MYERS", drip_credits_total: 2, addon_credits_total: 2 }
              as: ClinicAdmin
              captures: { mem_id: $.data.id }
            - call: "POST /memberships/${mem_id}/suspend"
              payload: {}
              as: ClinicAdmin
              captures: { st_susp: $.data.status }
          trigger:
            - call: "POST /memberships/${mem_id}/reinstate"
              payload: {}
