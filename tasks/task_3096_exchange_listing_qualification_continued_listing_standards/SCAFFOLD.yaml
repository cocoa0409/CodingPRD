# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or empty" }
  - { id: ERR_UNAUTHORIZED_ROLE, http: 403, condition: "Role not permitted on this endpoint per §1.5" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Payload schema violation: missing required field, closed-enum violation, range violation (e.g., split_ratio_denominator < 2), duplicate ticker_symbol" }
  - { id: ERR_ISSUER_NOT_FOUND, http: 404, condition: "issuerId does not exist" }
  - { id: ERR_APPLICATION_NOT_FOUND, http: 404, condition: "applicationId does not exist on this issuer" }
  - { id: ERR_LISTING_NOT_FOUND, http: 404, condition: "listingId does not exist on this issuer" }
  - { id: ERR_DEFICIENCY_NOT_FOUND, http: 404, condition: "deficiencyId does not exist on this issuer" }
  - { id: ERR_PLAN_NOT_FOUND, http: 404, condition: "planId does not exist on this issuer" }
  - { id: ERR_APPEAL_NOT_FOUND, http: 404, condition: "appealId does not exist on this issuer" }
  - { id: ERR_REVIEW_NOT_FOUND, http: 404, condition: "reviewId does not exist" }
  - { id: ERR_FEE_NOT_FOUND, http: 404, condition: "feeId does not exist on this issuer" }
  - { id: ERR_ACTION_NOT_FOUND, http: 404, condition: "actionId does not exist on this issuer" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource not in a state from which the requested transition exists (covers fee mark-paid/waive on non-INVOICED rows and approve of a failing application whose evaluation passed zero standards)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_issuer_version does not match the issuer's current version (OCC)" }
  - { id: ERR_OWNERSHIP_MISMATCH, http: 403, condition: "Entity-backed role's X-User-ID does not match the resource's owning entity id (IssuerOfficer acting on another issuer's path)" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Actor performed the immediately preceding workflow step on the same resource (plan filer vs reviewer; appeal filer vs decider)" }
  - { id: ERR_READMISSION_BARRED, http: 422, condition: "READMISSION application for an issuer not DELISTED, or with a prior rejected READMISSION" }
  - { id: ERR_GOVERNANCE_COMPOSITION, http: 422, condition: "Board/committee independence or composition rules failed at submit" }
  - { id: ERR_MULTIPLE_PENDING_APPLICATIONS, http: 409, condition: "Issuer already has a SUBMITTED application" }
  - { id: ERR_NO_STANDARD_MET, http: 422, condition: "TIER_TRANSFER approval or TIER_TRANSFER plan review where the continued standards of the target tier are not met" }
  - { id: ERR_TIER_TRANSFER_TARGET_INVALID, http: 422, condition: "Tier-transfer target is not strictly lower than current tier, or continued standards of the target tier are not met" }
  - { id: ERR_SNAPSHOT_DATE_MISMATCH, http: 422, condition: "Snapshot trade_date != logical clock date, or a snapshot already exists for that issuer and trade_date" }
  - { id: ERR_PLAN_NOT_ALLOWED, http: 422, condition: "Deficiency not OPEN, cure period lapsed, or a plan already exists for the deficiency" }
  - { id: ERR_CURE_PERIOD_ACTIVE, http: 422, condition: "staff-determine-delisting before compliance_due_at with no rejected plan" }
  - { id: ERR_APPEAL_WINDOW_CLOSED, http: 422, condition: "Appeal filed more than 7 days after staff determination, or a second appeal for the same deficiency" }
  - { id: ERR_DELISTING_BLOCKED, http: 422, condition: "execute-delisting while the appeal window is still open or an appeal is under review" }
  - { id: ERR_COUNCIL_REVIEW_NOT_AVAILABLE, http: 422, condition: "council-review from a state other than PANEL_AFFIRMED / PANEL_REVERSED" }
  - { id: ERR_HEARING_NOT_OPEN, http: 422, condition: "Appeal references a CLOSED HearingsReview" }
  - { id: ERR_NO_QUALIFYING_DEFICIENCY, http: 422, condition: "Reverse split effect without an OPEN/PLAN_SUBMITTED BID_PRICE deficiency" }
  - { id: ERR_FEE_ALREADY_ASSESSED, http: 409, condition: "ANNUAL fee already exists for the clock year, issuer not LISTED, or shares_outstanding < 1" }
  - { id: ERR_PLAN_UNDER_REVIEW, http: 409, condition: "Second review attempt on an already-decided CompliancePlan" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: IssuerOfficer
    description: "Officer of an issuer; files applications, plans, appeals, corporate actions for THEIR issuer only (X-User-ID must equal the issuer id in the path)"
    identity: "entity_backed:Issuer"
    exclusive_operations:
      - "POST /issuers/{id}/listing-applications — file application"
      - "POST /issuers/{id}/listing-applications/{appId}/submit — submit"
      - "POST /issuers/{id}/compliance-plans — file plan"
      - "POST /issuers/{id}/appeals — file appeal"
      - "POST /issuers/{id}/corporate-actions — submit corporate action"
      - "POST /issuers/{id}/corporate-actions/{actionId}/cancel — withdraw action"
    shared_operations:
      - "GET endpoints over own issuer's resources"

  - name: ListingAnalyst
    description: "Exchange listing qualifications staff; evaluates applications, monitors deficiencies, makes staff determinations, effects corporate actions, executes delistings; also operates the logical clock and ingests market data"
    identity: "opaque"
    exclusive_operations:
      - "POST /issuers — register issuer"
      - "POST /_clock/set_current_utc — set logical clock"
      - "POST /issuers/{id}/listing-applications/{appId}/approve|reject — adjudicate application"
      - "POST /issuers/{id}/market-data-snapshots — record snapshot"
      - "POST /issuers/{id}/deficiency-monitor/run — run monitor"
      - "POST /issuers/{id}/deficiencies/{defId}/staff-determine-delisting — staff determination"
      - "POST /issuers/{id}/compliance-plans/{planId}/review — review plan"
      - "POST /issuers/{id}/listings/{listingId}/execute-delisting — execute delisting"
      - "POST /issuers/{id}/corporate-actions/{actionId}/effect|reject — adjudicate corporate action"
    shared_operations:
      - "GET endpoints"

  - name: HearingsOfficer
    description: "Hearings panel staff; opens/closes panels and renders panel decisions"
    identity: "opaque"
    exclusive_operations:
      - "POST /hearings-reviews — open panel"
      - "POST /hearings-reviews/{id}/close — close panel"
      - "POST /issuers/{id}/appeals/{appealId}/panel-review — take under review"
      - "POST /issuers/{id}/appeals/{appealId}/panel-decision — panel decision"
    shared_operations:
      - "GET endpoints"

  - name: ListingsCouncil
    description: "Listing Council; terminal appellate body"
    identity: "opaque"
    exclusive_operations:
      - "POST /issuers/{id}/appeals/{appealId}/council-review — council review"
      - "POST /issuers/{id}/appeals/{appealId}/council-decision — council decision"
    shared_operations:
      - "GET endpoints"

  - name: FinanceOfficer
    description: "Listing fees department; assesses annual fees, marks payments, waives"
    identity: "opaque"
    exclusive_operations:
      - "POST /issuers/{id}/fee-assessments/run-annual-fees — assess annual fee"
      - "POST /issuers/{id}/fee-assessments/{feeId}/mark-paid — mark paid"
      - "POST /issuers/{id}/fee-assessments/{feeId}/waive — waive"
    shared_operations:
      - "GET endpoints"
