scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: dosage_to_date_vs_full_program_diverge
        grounds:
          - calculations.visit_dosage
          - entities.Enrollment.fields.completed_visit_count
          - endpoints.GET_/enrollments/{id}/dosage
        distinguishing_aspect: "visit_dosage operates on Enrollment; the to_date denominator {COMPLETED,MISSED with target<=clock}=3 gives 66.67 while the full_program denominator {COMPLETED,MISSED,SCHEDULED}=4 gives 50.00 for the same visit set."
        test_recipe:
          setup:
            - "One ACTIVE enrollment assigned to one nurse; clock at 2026-06-01."
            - "Visits: v1 target 2026-05-01 COMPLETED; v2 target 2026-05-10 MISSED; v3 target 2026-05-20 COMPLETED; v4 target 2026-07-01 SCHEDULED (future)."
          setup_api_calls:
            - call: "POST /nurses"
              payload: { full_name: "N Dosage", credential_type: "RN" }
              as: ProgramAdmin
              captures: { nurse_id: $.data.id }
            - call: "POST /supervisors"
              payload: { full_name: "S Dosage" }
              as: ProgramAdmin
              captures: { sup_id: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "C Dosage", mother_dob: "2001-02-03", first_time_mother: true, gestational_age_weeks: 20 }
              as: IntakeCoordinator
              captures: { client_id: $.data.id }
            - call: "POST /clients/${client_id}/consent"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /enrollments"
              payload: { client_id: "${client_id}" }
              as: IntakeCoordinator
              captures: { enr_id: $.data.id }
            - call: "POST /enrollments/${enr_id}/activate-enrollment"
              payload: {}
              as: IntakeCoordinator
              captures: { enr_v2: $.data.version }
            - call: "POST /assignments"
              payload: { enrollment_id: "${enr_id}", nurse_id: "${nurse_id}", expected_enrollment_version: "${enr_v2}", high_needs: false }
              as: Supervisor
              as_user_id: "${sup_id}"
              captures: { asg_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /visits"
              payload: { enrollment_id: "${enr_id}", nurse_id: "${nurse_id}", phase: "PREGNANCY", target_date: "2026-05-01", scheduled_start: "2026-05-01T09:00:00Z", scheduled_end: "2026-05-01T10:00:00Z" }
              as: HomeVisitNurse
              as_user_id: "${nurse_id}"
              captures: { v1_id: $.data.id }
            - call: "POST /visits"
              payload: { enrollment_id: "${enr_id}", nurse_id: "${nurse_id}", phase: "PREGNANCY", target_date: "2026-05-10", scheduled_start: "2026-05-10T09:00:00Z", scheduled_end: "2026-05-10T10:00:00Z" }
              as: HomeVisitNurse
              as_user_id: "${nurse_id}"
              captures: { v2_id: $.data.id }
            - call: "POST /visits"
              payload: { enrollment_id: "${enr_id}", nurse_id: "${nurse_id}", phase: "PREGNANCY", target_date: "2026-05-20", scheduled_start: "2026-05-20T09:00:00Z", scheduled_end: "2026-05-20T10:00:00Z" }
              as: HomeVisitNurse
              as_user_id: "${nurse_id}"
              captures: { v3_id: $.data.id }
            - call: "POST /visits"
              payload: { enrollment_id: "${enr_id}", nurse_id: "${nurse_id}", phase: "PREGNANCY", target_date: "2026-07-01", scheduled_start: "2026-07-01T09:00:00Z", scheduled_end: "2026-07-01T10:00:00Z" }
              as: HomeVisitNurse
              as_user_id: "${nurse_id}"
              captures: { v4_id: $.data.id }
            - call: "POST /visits/${v1_id}/complete"
              payload: { completed_date: "2026-05-01" }
              as: HomeVisitNurse
              as_user_id: "${nurse_id}"
            - call: "POST /visits/${v2_id}/mark-missed"
              payload: {}
              as: HomeVisitNurse
              as_user_id: "${nurse_id}"
            - call: "POST /visits/${v3_id}/complete"
              payload: { completed_date: "2026-05-20" }
              as: HomeVisitNurse
              as_user_id: "${nurse_id}"
          trigger:
            - call: "GET /enrollments/${enr_id}/dosage"
              payload: {}
              as: IntakeCoordinator
          assert:
            - "response.data.dosage_to_date_pct == 66.67"
            - "response.data.dosage_full_pct == 50.00"
            - "response.data.expected_to_date == 3"
            - "response.data.completed_to_date == 2"
            - "response.data.dosage_alert == false"

      - name: client_risk_provisional_vs_comprehensive_diverge
        grounds:
          - calculations.client_risk_tier
          - entities.Client.fields.risk_tier
          - entities.Assessment.fields.domain_flags
          - endpoints.GET_/clients/{id}/risk
        distinguishing_aspect: "client_risk_tier operates on Client (a different entity domain than Enrollment dosage); provisional counts only the 1 INTAKE flag => MODERATE, comprehensive counts all 3 flags => HIGH."
        test_recipe:
          setup:
            - "One ACTIVE enrollment with one COMPLETED visit; two assessments on that visit: INTAKE with 1 domain_flag, ASQ with 2 domain_flags."
          setup_api_calls:
            - call: "POST /nurses"
              payload: { full_name: "N Risk", credential_type: "BSN" }
              as: ProgramAdmin
              captures: { nurse_id: $.data.id }
            - call: "POST /supervisors"
              payload: { full_name: "S Risk" }
              as: ProgramAdmin
              captures: { sup_id: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "C Risk", mother_dob: "1999-06-06", first_time_mother: true, gestational_age_weeks: 18 }
              as: IntakeCoordinator
              captures: { client_id: $.data.id }
            - call: "POST /clients/${client_id}/consent"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /enrollments"
              payload: { client_id: "${client_id}" }
              as: IntakeCoordinator
              captures: { enr_id: $.data.id }
            - call: "POST /enrollments/${enr_id}/activate-enrollment"
              payload: {}
              as: IntakeCoordinator
              captures: { enr_v2: $.data.version }
            - call: "POST /assignments"
              payload: { enrollment_id: "${enr_id}", nurse_id: "${nurse_id}", expected_enrollment_version: "${enr_v2}", high_needs: false }
              as: Supervisor
              as_user_id: "${sup_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /visits"
              payload: { enrollment_id: "${enr_id}", nurse_id: "${nurse_id}", phase: "PREGNANCY", target_date: "2026-05-05", scheduled_start: "2026-05-05T09:00:00Z", scheduled_end: "2026-05-05T10:00:00Z" }
              as: HomeVisitNurse
              as_user_id: "${nurse_id}"
              captures: { v1_id: $.data.id }
            - call: "POST /visits/${v1_id}/complete"
              payload: { completed_date: "2026-05-05" }
              as: HomeVisitNurse
              as_user_id: "${nurse_id}"
            - call: "POST /assessments"
              payload: { visit_id: "${v1_id}", enrollment_id: "${enr_id}", instrument_type: "INTAKE", raw_scores: { communication: 5, motor: 50 } }
              as: HomeVisitNurse
              as_user_id: "${nurse_id}"
            - call: "POST /assessments"
              payload: { visit_id: "${v1_id}", enrollment_id: "${enr_id}", instrument_type: "ASQ", raw_scores: { communication: 5, motor: 5, social: 50 } }
              as: HomeVisitNurse
              as_user_id: "${nurse_id}"
          trigger:
            - call: "GET /clients/${client_id}/risk"
              payload: { basis: "provisional" }
              as: Supervisor
              as_user_id: "${sup_id}"
              captures: { prov_tier: $.data.tier }
            - call: "GET /clients/${client_id}/risk"
              payload: {}
              as: Supervisor
              as_user_id: "${sup_id}"
              captures: { comp_tier: $.data.tier }
          assert:
            - "provisional response.data.tier == MODERATE"
            - "provisional response.data.provisional_flags == 1"
            - "comprehensive response.data.tier == HIGH"
            - "comprehensive response.data.comprehensive_flags == 3"
            - "GET /clients/${client_id} Client.risk_tier == HIGH"

  - rule_id: combinatorial_formula
    instances:
      - name: caseload_weight_tiered_phase_times_high_needs_multiplier
        grounds:
          - calculations.nurse_caseload_weight
          - entities.Assignment.fields.high_needs
          - entities.Assignment.fields.phase_at_assignment
          - entities.Nurse.fields.current_caseload_weight
        distinguishing_aspect: "MODE (a): weight = phase_weight(tier) * (HIGH_RISK_MULTIPLIER if high_needs else 1.0) has 3 interacting inputs; PREGNANCY/no-needs=1.0 + INFANCY/high-needs=1.00 + PREGNANCY/high-needs=1.25 sums to 3.25 (per-assignment round then sum)."
        test_recipe:
          setup:
            - "One nurse with three ACTIVE assignments across three enrollments: (PREGNANCY, high_needs=false), (INFANCY, high_needs=true), (PREGNANCY, high_needs=true)."
          setup_api_calls:
            - call: "POST /nurses"
              payload: { full_name: "N Case", credential_type: "APRN" }
              as: ProgramAdmin
              captures: { nurse_id: $.data.id }
            - call: "POST /supervisors"
              payload: { full_name: "S Case" }
              as: ProgramAdmin
              captures: { sup_id: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "C1", mother_dob: "2000-01-01", first_time_mother: true, gestational_age_weeks: 20 }
              as: IntakeCoordinator
              captures: { c1_id: $.data.id }
            - call: "POST /clients/${c1_id}/consent"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /enrollments"
              payload: { client_id: "${c1_id}" }
              as: IntakeCoordinator
              captures: { e1_id: $.data.id }
            - call: "POST /enrollments/${e1_id}/activate-enrollment"
              payload: {}
              as: IntakeCoordinator
              captures: { e1_v: $.data.version }
            - call: "POST /assignments"
              payload: { enrollment_id: "${e1_id}", nurse_id: "${nurse_id}", expected_enrollment_version: "${e1_v}", high_needs: false }
              as: Supervisor
              as_user_id: "${sup_id}"
            - call: "POST /clients"
              payload: { full_name: "C2", mother_dob: "2000-02-02", first_time_mother: true, gestational_age_weeks: 22 }
              as: IntakeCoordinator
              captures: { c2_id: $.data.id }
            - call: "POST /clients/${c2_id}/consent"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /enrollments"
              payload: { client_id: "${c2_id}" }
              as: IntakeCoordinator
              captures: { e2_id: $.data.id }
            - call: "POST /enrollments/${e2_id}/activate-enrollment"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /enrollments/${e2_id}/record-birth"
              payload: { child_dob: "2026-02-15" }
              as: IntakeCoordinator
              captures: { e2_v: $.data.version }
            - call: "POST /assignments"
              payload: { enrollment_id: "${e2_id}", nurse_id: "${nurse_id}", expected_enrollment_version: "${e2_v}", high_needs: true }
              as: Supervisor
              as_user_id: "${sup_id}"
            - call: "POST /clients"
              payload: { full_name: "C3", mother_dob: "2000-03-03", first_time_mother: true, gestational_age_weeks: 24 }
              as: IntakeCoordinator
              captures: { c3_id: $.data.id }
            - call: "POST /clients/${c3_id}/consent"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /enrollments"
              payload: { client_id: "${c3_id}" }
              as: IntakeCoordinator
              captures: { e3_id: $.data.id }
            - call: "POST /enrollments/${e3_id}/activate-enrollment"
              payload: {}
              as: IntakeCoordinator
              captures: { e3_v: $.data.version }
            - call: "POST /assignments"
              payload: { enrollment_id: "${e3_id}", nurse_id: "${nurse_id}", expected_enrollment_version: "${e3_v}", high_needs: true }
              as: Supervisor
              as_user_id: "${sup_id}"
          trigger:
            - call: "GET /nurses/${nurse_id}"
              payload: {}
              as: ProgramAdmin
          assert:
            - "response.data.current_caseload_weight == 3.25"

      - name: program_on_time_rate_pooled_not_averaged
        grounds:
          - calculations.program_on_time_rate
          - calculations.visit_on_time
          - entities.MiechvReport.fields.program_on_time_rate_pct
        distinguishing_aspect: "MODE (b): pooled numerator/denominator rounded ONCE gives 2/3=66.67; the forbidden average of per-enrollment rounded rates (50.00,100.00) gives 75.00 — the pinned order changes the cents."
        test_recipe:
          setup:
            - "Two ACTIVE enrollments; E1 has 2 completed visits (1 on-time, 1 ten-days-late), E2 has 1 completed on-time visit; all completions within 2026-05-01..2026-05-31; clock 2026-05-25."
          setup_api_calls:
            - call: "POST /nurses"
              payload: { full_name: "N A", credential_type: "RN" }
              as: ProgramAdmin
              captures: { n1_id: $.data.id }
            - call: "POST /nurses"
              payload: { full_name: "N B", credential_type: "RN" }
              as: ProgramAdmin
              captures: { n2_id: $.data.id }
            - call: "POST /supervisors"
              payload: { full_name: "S OT" }
              as: ProgramAdmin
              captures: { sup_id: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "C OT1", mother_dob: "2000-05-05", first_time_mother: true, gestational_age_weeks: 20 }
              as: IntakeCoordinator
              captures: { c1_id: $.data.id }
            - call: "POST /clients/${c1_id}/consent"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /enrollments"
              payload: { client_id: "${c1_id}" }
              as: IntakeCoordinator
              captures: { e1_id: $.data.id }
            - call: "POST /enrollments/${e1_id}/activate-enrollment"
              payload: {}
              as: IntakeCoordinator
              captures: { e1_v: $.data.version }
            - call: "POST /assignments"
              payload: { enrollment_id: "${e1_id}", nurse_id: "${n1_id}", expected_enrollment_version: "${e1_v}", high_needs: false }
              as: Supervisor
              as_user_id: "${sup_id}"
            - call: "POST /clients"
              payload: { full_name: "C OT2", mother_dob: "2000-06-06", first_time_mother: true, gestational_age_weeks: 21 }
              as: IntakeCoordinator
              captures: { c2_id: $.data.id }
            - call: "POST /clients/${c2_id}/consent"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /enrollments"
              payload: { client_id: "${c2_id}" }
              as: IntakeCoordinator
              captures: { e2_id: $.data.id }
            - call: "POST /enrollments/${e2_id}/activate-enrollment"
              payload: {}
              as: IntakeCoordinator
              captures: { e2_v: $.data.version }
            - call: "POST /assignments"
              payload: { enrollment_id: "${e2_id}", nurse_id: "${n2_id}", expected_enrollment_version: "${e2_v}", high_needs: false }
              as: Supervisor
              as_user_id: "${sup_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-25T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /visits"
              payload: { enrollment_id: "${e1_id}", nurse_id: "${n1_id}", phase: "PREGNANCY", target_date: "2026-05-05", scheduled_start: "2026-05-05T09:00:00Z", scheduled_end: "2026-05-05T10:00:00Z" }
              as: HomeVisitNurse
              as_user_id: "${n1_id}"
              captures: { e1v1_id: $.data.id }
            - call: "POST /visits"
              payload: { enrollment_id: "${e1_id}", nurse_id: "${n1_id}", phase: "PREGNANCY", target_date: "2026-05-08", scheduled_start: "2026-05-08T09:00:00Z", scheduled_end: "2026-05-08T10:00:00Z" }
              as: HomeVisitNurse
              as_user_id: "${n1_id}"
              captures: { e1v2_id: $.data.id }
            - call: "POST /visits"
              payload: { enrollment_id: "${e2_id}", nurse_id: "${n2_id}", phase: "PREGNANCY", target_date: "2026-05-05", scheduled_start: "2026-05-05T09:00:00Z", scheduled_end: "2026-05-05T10:00:00Z" }
              as: HomeVisitNurse
              as_user_id: "${n2_id}"
              captures: { e2v1_id: $.data.id }
            - call: "POST /visits/${e1v1_id}/complete"
              payload: { completed_date: "2026-05-05" }
              as: HomeVisitNurse
              as_user_id: "${n1_id}"
            - call: "POST /visits/${e1v2_id}/complete"
              payload: { completed_date: "2026-05-18" }
              as: HomeVisitNurse
              as_user_id: "${n1_id}"
            - call: "POST /visits/${e2v1_id}/complete"
              payload: { completed_date: "2026-05-05" }
              as: HomeVisitNurse
              as_user_id: "${n2_id}"
            - call: "POST /miechv-reports"
              payload: { period_start: "2026-05-01", period_end: "2026-05-31" }
              as: ProgramAdmin
              captures: { rep_id: $.data.id }
          trigger:
            - call: "POST /miechv-reports/${rep_id}/finalize"
              payload: {}
              as: ProgramAdmin
          assert:
            - "response.data.status == FINALIZED"
            - "response.data.program_on_time_rate_pct == 66.67"

  - rule_id: non_linear_state_machine
    instances:
      - name: visit_reschedule_cycle_scheduled_to_rescheduled_to_scheduled
        grounds:
          - state_machines.Visit.SCHEDULED_to_RESCHEDULED
          - entities.Visit.fields.rescheduled_from_visit_id
        distinguishing_aspect: "CYCLE on Visit: reschedule twice yields v1=RESCHEDULED, v2=RESCHEDULED, v3=SCHEDULED with v3.rescheduled_from_visit_id==v2 — a SCHEDULED->RESCHEDULED->(new)SCHEDULED loop, not a linear pipeline."
        test_recipe:
          setup:
            - "One ACTIVE enrollment with one nurse and one SCHEDULED visit v1."
          setup_api_calls:
            - call: "POST /nurses"
              payload: { full_name: "N Resched", credential_type: "RN" }
              as: ProgramAdmin
              captures: { nurse_id: $.data.id }
            - call: "POST /supervisors"
              payload: { full_name: "S Resched" }
              as: ProgramAdmin
              captures: { sup_id: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "C Resched", mother_dob: "2000-07-07", first_time_mother: true, gestational_age_weeks: 19 }
              as: IntakeCoordinator
              captures: { client_id: $.data.id }
            - call: "POST /clients/${client_id}/consent"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /enrollments"
              payload: { client_id: "${client_id}" }
              as: IntakeCoordinator
              captures: { enr_id: $.data.id }
            - call: "POST /enrollments/${enr_id}/activate-enrollment"
              payload: {}
              as: IntakeCoordinator
              captures: { enr_v2: $.data.version }
            - call: "POST /assignments"
              payload: { enrollment_id: "${enr_id}", nurse_id: "${nurse_id}", expected_enrollment_version: "${enr_v2}", high_needs: false }
              as: Supervisor
              as_user_id: "${sup_id}"
            - call: "POST /visits"
              payload: { enrollment_id: "${enr_id}", nurse_id: "${nurse_id}", phase: "PREGNANCY", target_date: "2026-06-05", scheduled_start: "2026-06-05T09:00:00Z", scheduled_end: "2026-06-05T10:00:00Z" }
              as: HomeVisitNurse
              as_user_id: "${nurse_id}"
              captures: { v1_id: $.data.id }
          trigger:
            - call: "POST /visits/${v1_id}/reschedule"
              payload: { target_date: "2026-06-06", scheduled_start: "2026-06-06T09:00:00Z", scheduled_end: "2026-06-06T10:00:00Z" }
              as: HomeVisitNurse
              as_user_id: "${nurse_id}"
              captures: { v2_id: $.data.id }
            - call: "POST /visits/${v2_id}/reschedule"
              payload: { target_date: "2026-06-07", scheduled_start: "2026-06-07T09:00:00Z", scheduled_end: "2026-06-07T10:00:00Z" }
              as: HomeVisitNurse
              as_user_id: "${nurse_id}"
              captures: { v3_id: $.data.id }
          assert:
            - "GET /visits/${v1_id} Visit.status == RESCHEDULED"
            - "GET /visits/${v2_id} Visit.status == RESCHEDULED"
            - "GET /visits/${v3_id} Visit.status == SCHEDULED"
            - "GET /visits/${v3_id} Visit.rescheduled_from_visit_id == ${v2_id}"

      - name: referral_reattempt_cycle_contacted_to_open_to_contacted
        grounds:
          - state_machines.Referral.CONTACTED_to_OPEN
          - state_machines.Referral.OPEN_to_CONTACTED
          - entities.Referral.fields.attempts
        distinguishing_aspect: "CYCLE on Referral (a different entity than Visit): CONTACTED->OPEN->CONTACTED loop drives attempts from 0 to 2 while status returns to CONTACTED."
        test_recipe:
          setup:
            - "One ENROLLED enrollment whose client has consent; one OPEN referral."
          setup_api_calls:
            - call: "POST /nurses"
              payload: { full_name: "N Ref", credential_type: "RN" }
              as: ProgramAdmin
              captures: { nurse_id: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "C Ref", mother_dob: "2000-08-08", first_time_mother: true, gestational_age_weeks: 17 }
              as: IntakeCoordinator
              captures: { client_id: $.data.id }
            - call: "POST /clients/${client_id}/consent"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /enrollments"
              payload: { client_id: "${client_id}" }
              as: IntakeCoordinator
              captures: { enr_id: $.data.id }
            - call: "POST /enrollments/${enr_id}/activate-enrollment"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /referrals"
              payload: { enrollment_id: "${enr_id}", benefit_type: "WIC" }
              as: HomeVisitNurse
              as_user_id: "${nurse_id}"
              captures: { ref_id: $.data.id }
          trigger:
            - call: "POST /referrals/${ref_id}/contact"
              payload: {}
              as: HomeVisitNurse
              as_user_id: "${nurse_id}"
            - call: "POST /referrals/${ref_id}/reopen"
              payload: {}
              as: HomeVisitNurse
              as_user_id: "${nurse_id}"
            - call: "POST /referrals/${ref_id}/contact"
              payload: {}
              as: HomeVisitNurse
              as_user_id: "${nurse_id}"
          assert:
            - "response.data.status == CONTACTED"
            - "response.data.attempts == 2"

  - rule_id: transitive_cascade
    instances:
      - name: missed_visit_dosage_escalation_cascade_depth4
        grounds:
          - state_machines.Visit.SCHEDULED_to_MISSED
          - calculations.visit_dosage
          - entities.Enrollment.fields.dosage_alert
          - entities.Assignment.fields.review_required
