  instances:
  - name: unauthenticated_request_without_role_header
    claim_type: violation_to_error
    grounds:
    - validations[priority=1]
    - errors[ERR_UNAUTHENTICATED]
    distinguishing_aspect: A request carrying no role header is refused by the authentication guard before any existence or state check.
    test_recipe:
      setup:
      - clock 2026-09-02T00:00:00Z and no seller exists
      setup_api_calls:
      - call: POST /v1/_clock/set_current_utc
        as: PlatformAdmin
        payload:
          to_iso8601: '2026-09-02T00:00:00Z'
      trigger:
      - call: GET /v1/sellers/00000000-0000-4000-8000-000000000000
        as: Anonymous
        captures:
          e_auth: $.data.error_id
      assert:
      - the response error_id == ERR_UNAUTHENTICATED with http 401
      - the guard fires ahead of the existence guard, so the missing row is not reported
  - name: seller_read_by_unauthorized_role
    claim_type: violation_to_error
    grounds:
