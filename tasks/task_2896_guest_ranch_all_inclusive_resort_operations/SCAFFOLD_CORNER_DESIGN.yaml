          - entities.StaffMember.fields.retention_bonus_projected_cents
        distinguishing_aspect: "GET is a pure read yet the projected accrual moves with the logical clock: the same staff row reports 0 of 106 days on hire day and 71 of 106 days with 80377 cents accrued after the clock jumps to 2026-10-11, with no write in between."
        test_recipe:
          setup:
            - "OPEN season with retention_bonus_cents 120000 and one onboarded guide hired 2026-08-01 on a contract ending 2026-11-15"
