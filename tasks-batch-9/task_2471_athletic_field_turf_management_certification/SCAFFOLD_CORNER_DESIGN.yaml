              as: TurfAgronomist
              as_user_id: "${s_agr}"
              captures: { t_aer: $.data.id, t_aer_credit: $.data.recovery_credit_hours }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T20:30:00Z" }
