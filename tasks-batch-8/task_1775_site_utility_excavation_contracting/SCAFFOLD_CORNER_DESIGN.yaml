              as: ProjectManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_WINDOW_IN_PAST (http 422) — sub-rule (a) beats sub-rule (b) ERR_INSUFFICIENT_NOTICE"

      - name: insufficient_notice_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=8]
        distinguishing_aspect: "A future window (2026-08-03T10:00, 58h ahead) with a 72h-notice owner fails with ERR_INSUFFICIENT_NOTICE; the same window against a 24h-notice owner passes."
        test_recipe:
          setup: ["Project P (version 1); owners O72 (min_notice_hours 72) and O24 (min_notice_hours 24); segments S72 (owner O72) and S24 (owner O24); clock 2026-08-01"]
