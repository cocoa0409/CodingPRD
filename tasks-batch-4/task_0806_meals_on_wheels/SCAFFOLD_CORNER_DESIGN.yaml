          setup: ["ACTIVE client with one SCHEDULED delivery."]
          setup_api_calls:
            - call: "POST /drivers"
              payload: { full_name: "Dana Driver", phone: "555-0100" }
              as: ProgramAdmin
              captures: { drv_id: $.data.id }
            - call: "POST /drivers/${drv_id}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /routes"
              payload: { name: "R1", zone: "Z1", service_days: [MON, WED, FRI], max_meals_per_run: 50 }
              as: RouteManager
              captures: { rt_id: $.data.id }
            - call: "POST /routes/${rt_id}/assign-driver"
              payload: { driver_id: "${drv_id}" }
              as: RouteManager
            - call: "POST /routes/${rt_id}/activate"
              payload: {}
              as: RouteManager
            - call: "POST /clients"
              payload: { full_name: "Ada Client", birth_date: "1950-06-15", household_size: 1, monthly_income_cents: 120000, address_zone: "Z1", phone: "555-0101" }
              as: IntakeCoordinator
              captures: { cli_id: $.data.id }
            - call: "POST /clients/${cli_id}/assessments"
              payload: { nutrition_determine_points: 1, adl_score: 0, recommended_meals_per_day: 2 }
              as: Nutritionist
              captures: { as_id: $.data.id }
            - call: "POST /assessments/${as_id}/finalize"
              payload: {}
              as: Nutritionist
            - call: "GET /clients/${cli_id}"
              payload: {}
              as: RouteManager
              captures: { cli_v: $.data.version }
            - call: "POST /clients/${cli_id}/meal-plans"
              payload: { assessment_id: "${as_id}", route_id: "${rt_id}", meal_type: "HOT", meals_per_day: 2, delivery_days: [MON, WED, FRI], expected_client_version: "${cli_v}" }
              as: RouteManager
              captures: { mp_id: $.data.id }
            - call: "POST /clients/${cli_id}/activate"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /deliveries"
              payload: { meal_plan_id: "${mp_id}", scheduled_date: "2026-03-02" }
              as: RouteManager
              captures: { del1: $.data.id }
          trigger:
            - call: "POST /deliveries/${del1}/void"
              payload: {}
              as: RouteManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_DELIVERY_NOT_DELIVERED (409)"

      - name: welfare_alert_resolve_from_open_returns_invalid
        claim_type: invalid_transition
        grounds: [state_machines.WelfareAlert.ACKNOWLEDGED_to_RESOLVED, "errors[ERR_ALERT_INVALID_STATE]"]
        distinguishing_aspect: "Resolving an OPEN (not yet acknowledged/escalated) welfare alert returns ERR_ALERT_INVALID_STATE (409)."
        test_recipe:
          setup: ["A client with one OPEN WelfareAlert from a NO_ANSWER delivery."]
          setup_api_calls:
            - call: "POST /drivers"
              payload: { full_name: "Dana Driver", phone: "555-0100" }
              as: ProgramAdmin
              captures: { drv_id: $.data.id }
            - call: "POST /drivers/${drv_id}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /routes"
              payload: { name: "R1", zone: "Z1", service_days: [MON, WED, FRI], max_meals_per_run: 50 }
              as: RouteManager
              captures: { rt_id: $.data.id }
            - call: "POST /routes/${rt_id}/assign-driver"
              payload: { driver_id: "${drv_id}" }
              as: RouteManager
            - call: "POST /routes/${rt_id}/activate"
              payload: {}
              as: RouteManager
            - call: "POST /clients"
              payload: { full_name: "Ada Client", birth_date: "1950-06-15", household_size: 1, monthly_income_cents: 120000, address_zone: "Z1", phone: "555-0101" }
              as: IntakeCoordinator
              captures: { cli_id: $.data.id }
            - call: "POST /clients/${cli_id}/assessments"
              payload: { nutrition_determine_points: 1, adl_score: 0, recommended_meals_per_day: 2 }
              as: Nutritionist
              captures: { as_id: $.data.id }
            - call: "POST /assessments/${as_id}/finalize"
              payload: {}
              as: Nutritionist
            - call: "GET /clients/${cli_id}"
              payload: {}
              as: RouteManager
              captures: { cli_v: $.data.version }
            - call: "POST /clients/${cli_id}/meal-plans"
              payload: { assessment_id: "${as_id}", route_id: "${rt_id}", meal_type: "HOT", meals_per_day: 2, delivery_days: [MON, WED, FRI], expected_client_version: "${cli_v}" }
              as: RouteManager
              captures: { mp_id: $.data.id }
            - call: "POST /clients/${cli_id}/activate"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /deliveries"
              payload: { meal_plan_id: "${mp_id}", scheduled_date: "2026-03-02" }
              as: RouteManager
              captures: { del1: $.data.id }
            - call: "POST /deliveries/${del1}/complete"
              payload: { outcome: "NO_ANSWER" }
              as: VolunteerDriver
              as_user_id: "${drv_id}"
            - call: "GET /welfare-alerts"
              payload: { client_id: "${cli_id}" }
              as: RouteManager
              captures: { alert_id: "$.data[0].id" }
          trigger:
            - call: "POST /welfare-alerts/${alert_id}/resolve"
              payload: {}
              as: RouteManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_ALERT_INVALID_STATE (409)"

      - name: meal_plan_cancel_cascades_scheduled_deliveries
        claim_type: side_effect
        grounds: [state_machines.MealPlan.ACTIVE_to_CANCELLED, state_machines.Delivery.SCHEDULED_to_CANCELLED]
        distinguishing_aspect: "Cancelling an ACTIVE meal plan cascades its SCHEDULED deliveries to CANCELLED."
        test_recipe:
          setup: ["ACTIVE client with ACTIVE plan and one SCHEDULED delivery."]
          setup_api_calls:
            - call: "POST /drivers"
              payload: { full_name: "Dana Driver", phone: "555-0100" }
              as: ProgramAdmin
              captures: { drv_id: $.data.id }
            - call: "POST /drivers/${drv_id}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /routes"
              payload: { name: "R1", zone: "Z1", service_days: [MON, WED, FRI], max_meals_per_run: 50 }
              as: RouteManager
              captures: { rt_id: $.data.id }
            - call: "POST /routes/${rt_id}/assign-driver"
              payload: { driver_id: "${drv_id}" }
              as: RouteManager
            - call: "POST /routes/${rt_id}/activate"
              payload: {}
              as: RouteManager
            - call: "POST /clients"
              payload: { full_name: "Ada Client", birth_date: "1950-06-15", household_size: 1, monthly_income_cents: 120000, address_zone: "Z1", phone: "555-0101" }
              as: IntakeCoordinator
              captures: { cli_id: $.data.id }
            - call: "POST /clients/${cli_id}/assessments"
              payload: { nutrition_determine_points: 1, adl_score: 0, recommended_meals_per_day: 2 }
              as: Nutritionist
              captures: { as_id: $.data.id }
            - call: "POST /assessments/${as_id}/finalize"
              payload: {}
              as: Nutritionist
            - call: "GET /clients/${cli_id}"
              payload: {}
              as: RouteManager
              captures: { cli_v: $.data.version }
            - call: "POST /clients/${cli_id}/meal-plans"
              payload: { assessment_id: "${as_id}", route_id: "${rt_id}", meal_type: "HOT", meals_per_day: 2, delivery_days: [MON, WED, FRI], expected_client_version: "${cli_v}" }
              as: RouteManager
              captures: { mp_id: $.data.id }
            - call: "POST /clients/${cli_id}/activate"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /deliveries"
              payload: { meal_plan_id: "${mp_id}", scheduled_date: "2026-03-02" }
              as: RouteManager
              captures: { del1: $.data.id }
          trigger:
            - call: "POST /meal-plans/${mp_id}/cancel"
              payload: {}
              as: RouteManager
          assert:
            - "MealPlan.${mp_id}.status == CANCELLED"
            - "Delivery.${del1}.status == CANCELLED"

      - name: discharged_client_cannot_activate
        claim_type: terminal_state
        grounds: [state_machines.Client.ASSESSED_to_DISCHARGED, "errors[ERR_CLIENT_NOT_ASSESSED]"]
        distinguishing_aspect: "A DISCHARGED client cannot be activated; POST /clients/{id}/activate returns ERR_CLIENT_NOT_ASSESSED (409)."
        test_recipe:
          setup: ["A DISCHARGED client (assessed then discharged)."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { full_name: "Ada Client", birth_date: "1950-06-15", household_size: 1, monthly_income_cents: 120000, address_zone: "Z1", phone: "555-0101" }
              as: IntakeCoordinator
              captures: { cli_id: $.data.id }
            - call: "POST /clients/${cli_id}/assessments"
              payload: { nutrition_determine_points: 1, adl_score: 0, recommended_meals_per_day: 2 }
              as: Nutritionist
              captures: { as_id: $.data.id }
            - call: "POST /assessments/${as_id}/finalize"
              payload: {}
              as: Nutritionist
            - call: "POST /clients/${cli_id}/discharge"
              payload: {}
              as: IntakeCoordinator
          trigger:
            - call: "POST /clients/${cli_id}/activate"
              payload: {}
              as: IntakeCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_CLIENT_NOT_ASSESSED (409); Client stays DISCHARGED"

  # ========================================================================
  # Section: calculations
  # ========================================================================
  - section: calculations
    instances:
      - name: income_tier_ratio_one_is_tier_a_boundary
        claim_type: constants_applied
        grounds: [calculations.client_income_tier, entities.Client.income_tier]
        distinguishing_aspect: "At income exactly equal to the poverty line (ratio 1.00) the client is TIER_A (<= inclusive); income above it is TIER_B."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /clients"
              payload: { full_name: "Edge A", birth_date: "1950-06-15", household_size: 1, monthly_income_cents: 125500, address_zone: "Z1", phone: "555-0201" }
              as: IntakeCoordinator
              captures: { ca_id: $.data.id }
          trigger:
            - call: "POST /clients"
              payload: { full_name: "Edge B", birth_date: "1950-06-15", household_size: 1, monthly_income_cents: 130000, address_zone: "Z1", phone: "555-0202" }
              as: IntakeCoordinator
              captures: { cb_id: $.data.id }
          assert:
            - "client with income 125500 has income_tier == TIER_A"
            - "client with income 130000 has income_tier == TIER_B"

      - name: functional_level_dependent_threshold_at_five
        claim_type: correct_result
        grounds: [calculations.functional_level, entities.Assessment.functional_level]
        distinguishing_aspect: "adl_score 4 -> PARTIAL, adl_score 5 -> DEPENDENT (>= DEPENDENT_MIN 5)."
        test_recipe:
          setup: ["one INTAKE client"]
          setup_api_calls:
            - call: "POST /clients"
              payload: { full_name: "Ada Client", birth_date: "1950-06-15", household_size: 1, monthly_income_cents: 120000, address_zone: "Z1", phone: "555-0101" }
              as: IntakeCoordinator
              captures: { cli_id: $.data.id }
          trigger:
            - call: "POST /clients/${cli_id}/assessments"
              payload: { nutrition_determine_points: 1, adl_score: 4, recommended_meals_per_day: 2 }
              as: Nutritionist
              captures: { lvl4: $.data.functional_level }
            - call: "POST /clients/${cli_id}/assessments"
              payload: { nutrition_determine_points: 1, adl_score: 5, recommended_meals_per_day: 2 }
              as: Nutritionist
              captures: { lvl5: $.data.functional_level }
          assert:
            - "adl_score 4 assessment functional_level == PARTIAL"
            - "adl_score 5 assessment functional_level == DEPENDENT"

      - name: frozen_weekly_meal_count_capped_at_21
        claim_type: correct_result
        grounds: [calculations.weekly_meal_count, entities.MealPlan.weekly_meal_count]
        distinguishing_aspect: "FROZEN plan with meals_per_day 3 gives weekly_meal_count min(3*7,21) == 21 (cap boundary)."
        test_recipe:
          setup: ["ASSESSED client with an ACTIVE route in zone Z1."]
          setup_api_calls:
            - call: "POST /drivers"
              payload: { full_name: "Dana Driver", phone: "555-0100" }
              as: ProgramAdmin
              captures: { drv_id: $.data.id }
            - call: "POST /drivers/${drv_id}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /routes"
              payload: { name: "R1", zone: "Z1", service_days: [MON], max_meals_per_run: 50 }
              as: RouteManager
              captures: { rt_id: $.data.id }
            - call: "POST /routes/${rt_id}/assign-driver"
              payload: { driver_id: "${drv_id}" }
              as: RouteManager
            - call: "POST /routes/${rt_id}/activate"
              payload: {}
              as: RouteManager
            - call: "POST /clients"
              payload: { full_name: "Ada Client", birth_date: "1950-06-15", household_size: 1, monthly_income_cents: 120000, address_zone: "Z1", phone: "555-0101" }
              as: IntakeCoordinator
              captures: { cli_id: $.data.id }
            - call: "POST /clients/${cli_id}/assessments"
              payload: { nutrition_determine_points: 1, adl_score: 0, recommended_meals_per_day: 3 }
              as: Nutritionist
              captures: { as_id: $.data.id }
            - call: "POST /assessments/${as_id}/finalize"
              payload: {}
              as: Nutritionist
            - call: "GET /clients/${cli_id}"
              payload: {}
              as: RouteManager
              captures: { cli_v: $.data.version }
          trigger:
            - call: "POST /clients/${cli_id}/meal-plans"
              payload: { assessment_id: "${as_id}", route_id: "${rt_id}", meal_type: "FROZEN", meals_per_day: 3, delivery_days: [MON], expected_client_version: "${cli_v}" }
              as: RouteManager
              captures: { mp_id: $.data.id, weekly: $.data.weekly_meal_count }
          assert:
            - "MealPlan.weekly_meal_count == 21"

      - name: welfare_severity_high_on_second_consecutive_no_answer
        claim_type: correct_result
        grounds: [calculations.welfare_severity, entities.WelfareAlert.severity]
        distinguishing_aspect: "The 2nd consecutive NO_ANSWER (consecutive_no_answer == 2 >= HIGH_SEVERITY_MIN) opens a WelfareAlert with severity HIGH."
        test_recipe:
          setup: ["ACTIVE client with ACTIVE HOT plan and two SCHEDULED deliveries; both completed NO_ANSWER."]
          setup_api_calls:
            - call: "POST /drivers"
              payload: { full_name: "Dana Driver", phone: "555-0100" }
              as: ProgramAdmin
              captures: { drv_id: $.data.id }
            - call: "POST /drivers/${drv_id}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /routes"
              payload: { name: "R1", zone: "Z1", service_days: [MON, WED, FRI], max_meals_per_run: 50 }
              as: RouteManager
              captures: { rt_id: $.data.id }
            - call: "POST /routes/${rt_id}/assign-driver"
              payload: { driver_id: "${drv_id}" }
              as: RouteManager
            - call: "POST /routes/${rt_id}/activate"
              payload: {}
