        claim_type: computed_read
        grounds: ["endpoints.GET /products/{product_id}/effective-floor"]
        distinguishing_aspect: "channel is the only required query field and the read mutates nothing: two successive calls with different as_of values return 13000 and 15000 while the product's version stays put."
        test_recipe:
          setup: ["APPROVED ALL-scope exception over [2026-08-10, 2026-08-25) at 13000 on SKU-AUDIO-1."]
          setup_api_calls:
            - *CLK0801
            - *POLNEW
            - *POLSUB
            - *POLDEC
            - *POLPUB
            - *PRODA1
            - *EXC13000
            - *EXCAPPROVE
            - call: "GET /products/${prod}"
              payload: {}
              as: BrandChannelManager
              captures: { vbefore: $.data.version }
          trigger:
            - call: "GET /products/${prod}/effective-floor"
