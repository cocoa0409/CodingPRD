  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: availability_sellable_exact_boundary_sold_plus_one
        grounds:
          - calculations.availability_sellable
          - validations[priority=11]
          - state_machines.Reservation.HELD_to_CONFIRMED
