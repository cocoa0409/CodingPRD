            - "StorageField.${f1}.working_gas_inventory_dth == 166667 (the stored volume is never rounded)"

      - name: fuel_burn_is_clamped_at_both_the_floor_and_the_ceiling_on_one_unit
        claim_type: threshold
        grounds:
          - calculations.compressor_fuel_burn
          - entities.CompressorUnit.fields.lifetime_fuel_dth
          - entities.StorageField.fields.fuel_gas_used_dth
        distinguishing_aspect: |
          Both clamps fire on the same unit in the same world: a 100 hp single-hour run computes a
          raw 1.10 Dth and is lifted to the 25.00 Dth floor, while a 6000 hp 100-hour run computes a
          raw 6300.00 Dth and is cut to the 5000.00 Dth ceiling. The clamped values — not the raw
          ones — are what accumulate, so the unit's lifetime_fuel_dth lands on exactly 5025.00 and
          the field's working gas on 244975.00 (an unclamped implementation would report 6301.10 and
          243698.90).
        test_recipe:
          setup:
            - "Field F_MINI with one well MINI-1 and compressor unit U-1 rated 6000 hp with derate_factor 0.00."
            - "Two non-overlapping runs are booked on U-1: 100 hp over 2026-08-02T00:00:00Z-01:00:00Z and 6000 hp over 2026-08-03T00:00:00Z to 2026-08-07T04:00:00Z (100 hours), both INJECTION."
          setup_api_calls:
            - call: "POST /storage-fields"
              payload: { name: "Cavern Mini", field_code: "F-MINI", total_capacity_dth: 1000000, cushion_gas_dth: 500000, base_pressure_psig: 800, pressure_span_psig: 1400, max_pressure_psig: 3000, season: "INJECTION", opening_working_gas_dth: 250000, deliverability_method: "CURVE_INTERPOLATED", deliverability_curve: [{ inventory_pct: 0, withdrawal_dth_per_day: 0, injection_dth_per_day: 300000 }, { inventory_pct: 100, withdrawal_dth_per_day: 300000, injection_dth_per_day: 0 }] }
              as: FieldOperator
              captures: { f1: $.data.id }
            - call: "POST /wells"
              payload: { storage_field_id: "${f1}", well_name: "MINI-1", well_type: "INJECTION_WITHDRAWAL", rated_rate_dth_per_day: 600000, last_mit_passed_at: "2026-06-01T00:00:00Z" }
              as: FieldOperator
              captures: { w1: $.data.id }
            - call: "POST /compressor-units"
              payload: { storage_field_id: "${f1}", unit_code: "U-1", rated_horsepower: 6000, derate_factor: 0.00 }
              as: FieldOperator
              captures: { u1: $.data.id }
            - call: "POST /compressor-runs"
              payload: { compressor_unit_id: "${u1}", window_start_at: "2026-08-02T00:00:00Z", window_end_at: "2026-08-02T01:00:00Z", allocated_horsepower: 100, mode: "INJECTION" }
              as: FieldOperator
              captures: { r1: $.data.id }
            - call: "POST /compressor-runs"
              payload: { compressor_unit_id: "${u1}", window_start_at: "2026-08-03T00:00:00Z", window_end_at: "2026-08-07T04:00:00Z", allocated_horsepower: 6000, mode: "INJECTION" }
              as: FieldOperator
              captures: { r2: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T01:00:00Z" }
              as: FieldOperator
            - call: "POST /compressor-runs/${r1}/complete"
              payload: {}
              as: FieldOperator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-07T04:00:00Z" }
              as: FieldOperator
            - call: "POST /compressor-runs/${r2}/complete"
              payload: {}
              as: FieldOperator
            - call: "GET /compressor-units/${u1}"
              payload: {}
              as: FieldOperator
            - call: "GET /storage-fields/${f1}"
              payload: {}
              as: FieldOperator
          assert:
            - "CompressorRun.${r1}.duration_hours == 1, effective_horsepower == 100.00, utilization_ratio == 0.016667, utilization_band == LOW"
            - "CompressorRun.${r1}.fuel_consumed_dth == 25.00 (raw 1.10 lifted to the floor)"
            - "CompressorRun.${r2}.duration_hours == 100, effective_horsepower == 6000.00, utilization_ratio == 1.000000, utilization_band == HIGH"
            - "CompressorRun.${r2}.fuel_consumed_dth == 5000.00 (raw 6300.00 cut to the ceiling)"
            - "CompressorUnit.${u1}.lifetime_fuel_dth == 5025.00, scheduled_run_count == 0, status == AVAILABLE"
            - "StorageField.${f1}.fuel_gas_used_dth == 5025.00 and working_gas_inventory_dth == 244975.00"
            - "StorageField.${f1}.inventory_pct == 49.00, current_pressure_psig == 1486, deliverability_tier == TIER_2"
            - "StorageField.${f1}.max_withdrawal_rate_dth_per_day == 147000 and max_injection_rate_dth_per_day == 153000"

      - name: deliverability_ignores_observation_and_out_of_service_wells
        claim_type: input_set_filtering
        grounds:
          - calculations.deliverability_rates
          - entities.Well.fields.well_type
          - entities.Well.fields.operational_state
          - endpoints[POST /wells]
        distinguishing_aspect: |
          The well-capacity sum is filtered on TWO independent predicates, and both matter: a 600000
          Dth/day OBSERVATION well and a 600000 Dth/day SHUT_IN well contribute nothing, so a field
          whose only qualifying well is rated 100000 is capped at 100000 on BOTH directions even
          though the curve offers 150000 and the field holds 1.2 million Dth of rated iron. Returning
          the shut-in well to service lifts both rates back to the curve values in one call.
        test_recipe:
          setup:
            - "Field F_MINI with three wells: MINI-A (INJECTION_WITHDRAWAL, rated 100000, IN_SERVICE), MINI-B (OBSERVATION, rated 600000, IN_SERVICE) and MINI-C (INJECTION_WITHDRAWAL, rated 600000, created directly SHUT_IN)."
          setup_api_calls:
            - call: "POST /storage-fields"
              payload: { name: "Cavern Mini", field_code: "F-MINI", total_capacity_dth: 1000000, cushion_gas_dth: 500000, base_pressure_psig: 800, pressure_span_psig: 1400, max_pressure_psig: 3000, season: "INJECTION", opening_working_gas_dth: 250000, deliverability_method: "CURVE_INTERPOLATED", deliverability_curve: [{ inventory_pct: 0, withdrawal_dth_per_day: 0, injection_dth_per_day: 300000 }, { inventory_pct: 100, withdrawal_dth_per_day: 300000, injection_dth_per_day: 0 }] }
              as: FieldOperator
              captures: { f1: $.data.id }
            - call: "POST /wells"
              payload: { storage_field_id: "${f1}", well_name: "MINI-A", well_type: "INJECTION_WITHDRAWAL", rated_rate_dth_per_day: 100000, last_mit_passed_at: "2026-06-01T00:00:00Z" }
              as: FieldOperator
              captures: { wa: $.data.id }
            - call: "POST /wells"
              payload: { storage_field_id: "${f1}", well_name: "MINI-B", well_type: "OBSERVATION", rated_rate_dth_per_day: 600000, last_mit_passed_at: "2026-06-01T00:00:00Z" }
              as: FieldOperator
              captures: { wb: $.data.id }
            - call: "POST /wells"
              payload: { storage_field_id: "${f1}", well_name: "MINI-C", well_type: "INJECTION_WITHDRAWAL", rated_rate_dth_per_day: 600000, last_mit_passed_at: "2026-06-01T00:00:00Z", initial_operational_state: "SHUT_IN" }
              as: FieldOperator
              captures: { wc: $.data.id }
          trigger:
            - call: "GET /storage-fields/${f1}"
              payload: {}
              as: SchedulingCoordinator
            - call: "POST /wells/${wc}/service-change"
              payload: { to_operational_state: "IN_SERVICE" }
              as: FieldOperator
            - call: "GET /storage-fields/${f1}"
              payload: {}
              as: SchedulingCoordinator
          assert:
            - "before the service-change StorageField.${f1}.wells_in_service_count == 1 (only MINI-A qualifies)"
            - "before the service-change both rates are 100000 — the 150000 curve value is capped by the single qualifying well"
            - "StorageField.${f1}.field_posture == OPEN throughout (one qualifying well is enough to leave FROZEN)"
            - "the service-change returns HTTP 200 with Well.${wc}.operational_state == IN_SERVICE and service_change_count == 1"
            - "after the service-change wells_in_service_count == 2 and the rates are the uncapped curve values 150000 / 150000"
            - "StorageField.${f1}.inventory_pct == 50.00 and current_pressure_psig == 1500 are unaffected by the well set"
            - "GET /wells with storage_field_id ${f1} and integrity_state MIT_CURRENT and limit 100 returns total_count == 3 (the OBSERVATION well is still integrity-tracked)"

      - name: field_posture_takes_the_first_matching_clause_not_the_worst_one
        claim_type: constraint_propagation
        grounds:
          - calculations.field_posture_derivation
          - calculations.field_posture_derivation.constants.POSTURE_PRESSURE_PCT
          - state_machines.Well.transitions.MIT_CURRENT_to_MIT_FAILED
        distinguishing_aspect: |
          Three fields exercise three different clauses of the same top-down ladder and prove the
          ordering matters: a single-well field whose only well fails its test matches clause 1
          (wells_in_service_count == 0 -> FROZEN) even though clause 3 (a MIT_FAILED well ->
          RESTRICTED) also holds; a two-well field with the same failure falls through to clause 3
          and is only RESTRICTED; and a high-base-pressure field with every well healthy still lands
          on RESTRICTED through clause 4 because 2980 psig exceeds the round_half_up(3000 * 95 / 100)
          == 2850 ceiling.
        test_recipe:
