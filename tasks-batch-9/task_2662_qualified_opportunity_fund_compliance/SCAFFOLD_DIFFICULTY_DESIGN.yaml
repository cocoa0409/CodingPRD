              captures: { ie_id: "$.data[0].id", ie_type: "$.data[0].event_type" }
          assert:
            - "${days_at_election} == 139"
            - "cascade link 1 — AssetTest.${t2_id}.status == CERTIFIED_FAIL, ratio_pct == 80.0000, shortfall_amount == 100000.00, failed_month_count == 6; Fund.${fund_id}.consecutive_failed_tests == 2"
            - "cascade link 2 — two PenaltyAssessment rows exist for Fund.${fund_id}, each with gross_penalty_amount == 4000.02 and failed_month_count == 6; Fund.${fund_id}.cumulative_penalty_months == 12"
            - "cascade link 3 — Fund.${fund_id}.compliance_posture == FAILED_FINAL"
