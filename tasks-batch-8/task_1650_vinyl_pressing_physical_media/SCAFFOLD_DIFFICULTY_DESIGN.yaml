      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /customers
        payload:
          name: RB Label
          contact_email: rb@x.com
          credit_limit_cents: 100000000
          discount_tier: GOLD
        as: CustomerServiceRep
        captures:
