# =============================================================================
# SCAFFOLD.yaml — task_1448_forging_plant
# Forging Plant (Ellwood Group style forge) seed tables.
# §1.0–§1.7 only. §1.8 lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml;
# §1.9 lives in SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  Forging Plant (Ellwood Group style forge): billet cut & furnace charge, die set & press/hammer routing, forging temperature window & re-heat limit, trim/pierce & flash scrap yield, grain-flow/macro-etch certification, die wear tracking & resink, heat-lot traceability to bar mill, tonnage-based pricing & surcharge

domain_name: forging-plant
api_prefix: ""            # flat resource space: /mill-heats, /forge-runs, ... (no root namespace)

complexity_profile:
  primary_archetype: workflow_orchestration      # cut -> charge -> forge -> trim -> certify -> invoice pipeline
  secondary_archetype: compliance_audit          # grain-flow/macro-etch certification, heat-lot traceability, segregation of duties
  complexity_layers:
    - cascading_side_effects                     # trim accept -> parts -> work order posture -> cert auto-creation
    - dual_variant_calculation                   # provisional vs final invoice; planned vs consumed material
    - optimistic_concurrency                     # OCC on WorkOrder.version for run/invoice creation
    - rate_threshold_triggers                    # die wear hits, re-heat limit, flash allowance
  entity_topology: graph                         # flat URLs, dense cross-aggregate FK web (runs reference WO/die/center; parts reference run/heat/mill-heat)
  state_machine_shape: cyclic                    # die wear/resink loop, run reopen loop, cert resubmission loop, heat quarantine loop
  relationship_patterns:
    - one_to_many                                # MillHeat->Billet, ForgeRun->ForgeHeat, ForgeRun->TrimTicket
    - cross_aggregate                            # ForgeRun -> DieSet/WorkCenter/WorkOrder; PartSerial -> MillHeat; Invoice -> SurchargeIndex
  role_model: segregation_of_duties              # certifier != submitter; certifier != forge operator of record
  consistency_model: immediate                   # every mutation visible in the same request's response

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: AlloySpec
    parent: null
    common_fields: true
    fields:
      - { name: grade_code, type: string, source: input, description: "Alloy grade code, unique across all specs (e.g. AISI-4140)", constraints: "unique; immutable after creation" }
      - { name: name, type: string, source: input, description: "Human-readable alloy name" }
      - { name: forge_temp_min_f, type: integer, source: input, description: "Minimum permissible die-contact forging temperature (F), inclusive lower bound of the forge window" }
      - { name: forge_temp_max_f, type: integer, source: input, description: "Maximum permissible forging temperature (F), inclusive upper bound; must be > forge_temp_min_f" }
      - { name: reheat_limit, type: integer, source: input, description: "Maximum number of RE-heats permitted per billet beyond its initial furnace charge; total charges per billet <= reheat_limit + 1" }
      - { name: flash_allowance_pct, type: number, source: input, description: "Maximum acceptable flash yield percentage; a trim ticket is FLAGGED when its unrounded flash/gross ratio strictly exceeds this percent" }
      - { name: strokes_per_part, type: integer, source: input, description: "Press strokes / hammer blows applied per forged part; multiplier for die hit accumulation" }
      - { name: flow_stress_ksi, type: number, source: input, description: "Alloy flow stress (ksi) at forging temperature; input to required-tonnage calculation" }
      - { name: carbon_max_pct, type: number, source: input, description: "Maximum acceptable carbon percentage on the mill cert chemistry report" }
      - { name: manganese_max_pct, type: number, source: input, description: "Maximum acceptable manganese percentage on the mill cert chemistry report" }
      - { name: grain_flow_min_rating, type: integer, source: input, description: "Minimum acceptable grain-flow rating (1-8) on macro-etch certification" }
      - { name: macro_etch_required, type: boolean, source: input, description: "Whether macro-etch PASS is mandatory for certification (when false, etch result is informational only)" }

  - name: MillHeat
    parent: null
    common_fields: true
    fields:
      - { name: heat_number, type: string, source: input, description: "Bar-mill heat/lot number; unique across all heats", constraints: "unique" }
      - { name: alloy_spec_id, type: string, source: input, description: "FK -> AlloySpec.id; alloy grade of this heat" }
      - { name: mill_name, type: string, source: input, description: "Originating bar mill name (traceability anchor)" }
      - { name: received_weight_lbs, type: number, source: input, description: "Scale weight received from the mill (lbs, 2dp)" }
      - { name: bar_lbs_per_in, type: number, source: input, description: "Linear density of the bar stock (lbs per inch); drives billet cut weight" }
      - { name: carbon_pct, type: number, source: system, description: "Measured carbon from the cert-verification chemistry report; null until verified" }
      - { name: manganese_pct, type: number, source: system, description: "Measured manganese from the cert-verification chemistry report; null until verified" }
      - { name: remaining_weight_lbs, type: number, source: computed, description: "= received_weight_lbs - sum(cut_weight_lbs over ALL billets ever cut from this heat, any billet status); cut weight leaves the heat permanently (kerf/scale/scrap do not return)" }
      - { name: status, type: enum, source: system, description: "RECEIVED | CERT_VERIFIED | QUARANTINED | REJECTED | DEPLETED", default: "RECEIVED" }

  - name: Billet
    parent: MillHeat
    common_fields: true
    fields:
      - { name: mill_heat_id, type: string, source: system, description: "FK -> MillHeat.id; parent heat taken from the creation path" }
      - { name: cut_seq, type: integer, source: system, description: "Per-heat cut sequence number, assigned in creation order starting at 1" }
      - { name: cut_length_in, type: number, source: input, description: "Cut length in inches" }
      - { name: cut_weight_lbs, type: number, source: computed, description: "= round_half_up(cut_length_in * heat.bar_lbs_per_in, 2)" }
      - { name: charge_count, type: integer, source: system, default: 0, description: "Number of times this billet has been charged into a furnace; increments on each FurnaceCharge creation that includes it" }
      - { name: current_charge_id, type: string, source: system, description: "FK -> FurnaceCharge.id; set while status == CHARGED, null otherwise" }
      - { name: consumed_by_run_id, type: string, source: system, description: "FK -> ForgeRun.id; set when the billet is consumed by a recorded forge heat, null otherwise" }
      - { name: status, type: enum, source: system, description: "CUT | CHARGED | DISCHARGED | CONSUMED | SCRAPPED", default: "CUT" }

  - name: Furnace
    parent: null
    common_fields: true
    fields:
      - { name: furnace_code, type: string, source: input, description: "Furnace identifier, unique", constraints: "unique" }
      - { name: capacity_lbs, type: number, source: input, description: "Maximum total billet weight per charge (lbs)" }
      - { name: status, type: enum, source: system, description: "UP | DOWN", default: "UP" }
      - { name: active_charge_id, type: string, source: computed, description: "FK -> FurnaceCharge.id of the non-terminal charge occupying this furnace (status LOADING/SOAKING/READY), null when idle" }

  - name: FurnaceCharge
    parent: null
    common_fields: true
    fields:
      - { name: furnace_id, type: string, source: input, description: "FK -> Furnace.id; furnace this charge occupies" }
      - { name: billet_ids, type: array, source: input, description: "Billet ids loaded in this charge; all billets must share one alloy (charge is single-alloy)" }
      - { name: alloy_spec_id, type: string, source: computed, description: "FK -> AlloySpec.id; derived from the charged billets' common alloy" }
      - { name: target_temp_f, type: integer, source: input, description: "Setpoint temperature; must lie within the alloy forge window [forge_temp_min_f, forge_temp_max_f] inclusive" }
      - { name: soak_minutes, type: integer, source: input, description: "Required soak time after loading closes before the charge may be marked READY" }
      - { name: planned_load_start, type: datetime, source: input, description: "Planned occupancy window start (inclusive)" }
      - { name: planned_unload, type: datetime, source: input, description: "Planned occupancy window end (exclusive); half-open interval [planned_load_start, planned_unload) — back-to-back charges with planned_load_start == prior planned_unload are allowed" }
      - { name: charge_weight_lbs, type: number, source: computed, description: "= sum(cut_weight_lbs of billet_ids); must be <= furnace.capacity_lbs" }
      - { name: load_started_at, type: datetime, source: system, description: "Logical-clock timestamp at charge creation" }
      - { name: closed_at, type: datetime, source: system, description: "Logical-clock timestamp when loading closed (SOAKING began)" }
      - { name: ready_at, type: datetime, source: system, description: "Logical-clock timestamp when marked READY" }
      - { name: discharged_at, type: datetime, source: system, description: "Logical-clock timestamp when DISCHARGED/ABORTED" }
      - { name: status, type: enum, source: system, description: "LOADING | SOAKING | READY | DISCHARGED | ABORTED", default: "LOADING" }

  - name: DieSet
    parent: null
    common_fields: true
    fields:
      - { name: die_set_code, type: string, source: input, description: "Die set identifier, unique", constraints: "unique" }
      - { name: part_family, type: string, source: input, description: "Part family this die set forges" }
      - { name: wear_limit_hits, type: integer, source: input, description: "Hit count at which the die is WORN; die becomes WORN when cumulative_hits >= wear_limit_hits (boundary inclusive)" }
      - { name: max_resinks, type: integer, source: input, description: "Maximum number of resinks allowed; start-resink rejected when resink_count >= max_resinks" }
      - { name: cumulative_hits, type: integer, source: computed, default: 0, description: "Lifetime hits since last resink; += (parts_good + parts_scrapped) * alloy.strokes_per_part on every recorded forge heat" }
      - { name: resink_count, type: integer, source: system, default: 0, description: "Number of completed resinks" }
      - { name: installed_work_center_id, type: string, source: system, description: "FK -> WorkCenter.id; work center the die is installed on, null when not installed" }
      - { name: status, type: enum, source: system, description: "AVAILABLE | INSTALLED | WORN | RESINKING | RETIRED", default: "AVAILABLE" }

  - name: WorkCenter
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "Work center code, unique", constraints: "unique" }
      - { name: type, type: enum, source: input, description: "PRESS | HAMMER" }
      - { name: rated_tonnage, type: integer, source: input, description: "Rated capacity in tons; a run requires rated_tonnage >= work_order.required_tonnage" }
      - { name: status, type: enum, source: system, description: "UP | DOWN", default: "UP" }

  - name: WorkOrder
    parent: null
    common_fields: true
    fields:
      - { name: order_number, type: string, source: input, description: "Customer order number, unique", constraints: "unique" }
      - { name: customer_name, type: string, source: input, description: "Customer name" }
      - { name: alloy_spec_id, type: string, source: input, description: "FK -> AlloySpec.id; alloy the parts are forged from" }
      - { name: part_number, type: string, source: input, description: "Customer part number" }
      - { name: ordered_qty, type: integer, source: input, description: "Ordered part count" }
      - { name: part_net_weight_lbs, type: number, source: input, description: "Final trimmed net weight per part (lbs)" }
      - { name: billet_weight_lbs, type: number, source: input, description: "Planned cut weight per part (lbs); must be >= part_net_weight_lbs * (1 + flash_allowance_pct/100) — covers flash + trim loss" }
      - { name: projected_area_in2, type: number, source: input, description: "Part projected plan area (in^2); drives required tonnage" }
      - { name: required_process, type: enum, source: input, description: "PRESS | HAMMER — required work-center type" }
      - { name: price_tier1_limit_tons, type: number, source: input, description: "Average-rate tier 1 upper bound (tons, inclusive)" }
      - { name: price_tier1_cents_per_ton, type: integer, source: input, description: "Tier 1 rate (cents per ton)" }
      - { name: price_tier2_limit_tons, type: number, source: input, description: "Average-rate tier 2 upper bound (tons, inclusive); must be > tier1 limit" }
      - { name: price_tier2_cents_per_ton, type: integer, source: input, description: "Tier 2 rate (cents per ton)" }
      - { name: price_tier3_cents_per_ton, type: integer, source: input, description: "Tier 3 rate (cents per ton) for billable tons above tier2 limit" }
      - { name: scrap_recovery_rate_cents_per_lb, type: integer, source: input, description: "Contractual scrap-recovery credit rate (cents per lb of accepted flash)" }
      - { name: required_tonnage, type: integer, source: computed, description: "= ceil(projected_area_in2 * alloy.flow_stress_ksi / 2)" }
      - { name: forged_qty, type: integer, source: computed, default: 0, description: "Count of PartSerials of this order in status FORGED/TRIMMED/INSPECTED/SHIPPED" }
      - { name: trimmed_qty, type: integer, source: computed, default: 0, description: "Count of PartSerials of this order in status TRIMMED/INSPECTED/SHIPPED" }
      - { name: shipped_qty, type: integer, source: computed, default: 0, description: "Count of PartSerials of this order in status SHIPPED" }
      - { name: scrapped_qty, type: integer, source: computed, default: 0, description: "Count of PartSerials of this order in status SCRAPPED" }
      - { name: planned_billet_weight_lbs, type: number, source: computed, description: "= ordered_qty * billet_weight_lbs (forward-looking material requirement)" }
      - { name: consumed_billet_weight_lbs, type: number, source: computed, default: 0, description: "= sum(cut_weight_lbs of billets with consumed_by_run_id referencing a run of this order) — chronological actual" }
      - { name: trimmed_net_lbs, type: number, source: computed, default: 0, description: "= sum(net_trimmed_lbs over ACCEPTED trim tickets of this order's runs)" }
      - { name: status, type: enum, source: system, description: "RELEASED | IN_PROGRESS | PRODUCED | CERTIFIED | CLOSED | CANCELLED", default: "RELEASED" }

  - name: ForgeRun
    parent: null
    common_fields: true
    fields:
      - { name: work_order_id, type: string, source: input, description: "FK -> WorkOrder.id; order this run produces for" }
      - { name: die_set_id, type: string, source: input, description: "FK -> DieSet.id; die set used" }
      - { name: work_center_id, type: string, source: system, description: "FK -> WorkCenter.id; client-supplied when explicit, system-selected via the work-center selector when omitted" }
      - { name: planned_start, type: datetime, source: input, description: "Scheduled window start (inclusive)" }
      - { name: planned_end, type: datetime, source: input, description: "Scheduled window end (inclusive). Runs on the same work center require a turnaround gap: new.planned_start >= existing.planned_end + 30 minutes (and symmetrically); a gap of exactly 30 minutes is allowed" }
      - { name: planned_qty, type: integer, source: input, description: "Planned part count for this run" }
      - { name: operator_id, type: string, source: system, description: "X-User-ID of the ForgeOperator who started the run (segregation-of-duties anchor)" }
      - { name: actual_started_at, type: datetime, source: system, description: "Logical-clock timestamp of run start" }
      - { name: parts_good_total, type: integer, source: computed, default: 0, description: "= sum(parts_good over the run's ForgeHeats)" }
      - { name: parts_scrapped_total, type: integer, source: computed, default: 0, description: "= sum(parts_scrapped over the run's ForgeHeats)" }
      - { name: input_weight_lbs, type: number, source: computed, default: 0, description: "= sum(cut_weight_lbs of billets consumed by this run)" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | IN_PROGRESS | FORGED | COMPLETED | CANCELLED", default: "SCHEDULED" }

  - name: ForgeHeat
    parent: ForgeRun
    common_fields: false
    fields:
      - { name: forge_run_id, type: string, source: system, description: "FK -> ForgeRun.id; parent run from the creation path" }
      - { name: furnace_charge_id, type: string, source: input, description: "FK -> FurnaceCharge.id; READY charge the billets were drawn from" }
      - { name: billet_ids, type: array, source: input, description: "Billets consumed in this heat; each must be CHARGED with current_charge_id == furnace_charge_id" }
      - { name: parts_good, type: integer, source: input, description: "Good parts forged in this heat" }
      - { name: parts_scrapped, type: integer, source: input, description: "Parts scrapped at the hammer/press in this heat; parts_good + parts_scrapped must equal len(billet_ids) (one part per billet)" }
      - { name: hits_added, type: integer, source: computed, description: "= (parts_good + parts_scrapped) * alloy.strokes_per_part; added to die set cumulative_hits" }

  - name: TrimTicket
    parent: ForgeRun
    common_fields: true
    fields:
      - { name: forge_run_id, type: string, source: system, description: "FK -> ForgeRun.id; parent run from the creation path" }
      - { name: gross_as_forged_lbs, type: number, source: input, description: "Scale weight of the as-forged batch presented to trim (lbs)" }
      - { name: net_trimmed_lbs, type: number, source: input, description: "Scale weight after trim/pierce (lbs)" }
      - { name: pierce_loss_lbs, type: number, source: input, description: "Pierce/trim-loss weight accounted separately from flash (lbs)" }
      - { name: flash_scrap_lbs, type: number, source: computed, description: "= gross_as_forged_lbs - net_trimmed_lbs - pierce_loss_lbs; must be >= 0" }
      - { name: flash_yield_pct, type: number, source: computed, description: "= round_half_up(flash_scrap_lbs / gross_as_forged_lbs * 100, 2); displayed value — the ACCEPTED/FLAGGED disposition compares the UNROUNDED ratio against flash_allowance_pct" }
      - { name: deviation_reason, type: string, source: system, description: "Recorded when a FLAGGED ticket is deviation-approved; null otherwise" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACCEPTED | FLAGGED | VOIDED", default: "DRAFT" }

  - name: PartSerial
    parent: WorkOrder
    common_fields: true
    fields:
      - { name: serial_seq, type: integer, source: system, description: "Per-order serial sequence starting at 1, assigned in creation order (heat record order); used as the residual-allocation anchor (max serial_seq absorbs rounding residual)" }
      - { name: serial_code, type: string, source: computed, description: "\"<order_number>-<serial_seq>\"" }
      - { name: work_order_id, type: string, source: system, description: "FK -> WorkOrder.id; derived from the parent run" }
      - { name: forge_run_id, type: string, source: system, description: "FK -> ForgeRun.id; run that forged the part" }
      - { name: forge_heat_id, type: string, source: system, description: "FK -> ForgeHeat.id; heat that forged the part" }
      - { name: mill_heat_id, type: string, source: system, description: "FK -> MillHeat.id; heat-lot traceability: copied from the consumed billet's mill_heat_id at creation" }
      - { name: net_weight_lbs, type: number, source: computed, description: "Per-part net weight allocated when a trim ticket is ACCEPTED; null while FORGED" }
      - { name: status, type: enum, source: system, description: "FORGED | TRIMMED | INSPECTED | SHIPPED | SCRAPPED", default: "FORGED" }

  - name: QualityCert
    parent: WorkOrder
    common_fields: true
    fields:
      - { name: work_order_id, type: string, source: system, description: "FK -> WorkOrder.id; parent order from the creation path" }
      - { name: mill_heat_id, type: string, source: input, description: "FK -> MillHeat.id; heat lot being certified for this order; at most one cert per (work_order_id, mill_heat_id)" }
      - { name: sample_part_serial_id, type: string, source: input, description: "FK -> PartSerial.id; sectioned sample; OPTIONAL — when supplied it must belong to this order and to mill_heat_id (ERR_SAMPLE_NOT_FROM_HEAT)" }
      - { name: grain_flow_rating, type: integer, source: system, description: "Macro-etch grain-flow rating (1-8) recorded at submit" }
      - { name: macro_etch_result, type: enum, source: system, description: "PASS | FAIL recorded at submit" }
      - { name: submitter_id, type: string, source: system, description: "X-User-ID of the QualityEngineer who submitted readings" }
      - { name: certifier_id, type: string, source: system, description: "X-User-ID of the certifying QualityEngineer" }
      - { name: status, type: enum, source: system, description: "PENDING | SUBMITTED | CERTIFIED | REJECTED", default: "PENDING" }

  - name: SurchargeIndex
    parent: null
    common_fields: true
    fields:
      - { name: alloy_spec_id, type: string, source: input, description: "FK -> AlloySpec.id; alloy this index prices" }
      - { name: effective_month, type: string, source: input, description: "Effective month \"YYYY-MM\"; at most one index per (alloy_spec_id, effective_month)" }
      - { name: surcharge_cents_per_ton, type: integer, source: input, description: "Alloy surcharge (cents per billable ton)" }
      - { name: energy_pct, type: number, source: input, description: "Energy surcharge fraction applied to (base + alloy surcharge), e.g. 0.10" }

  - name: Invoice
    parent: WorkOrder
    common_fields: true
    fields:
      - { name: work_order_id, type: string, source: system, description: "FK -> WorkOrder.id; parent order from the creation path" }
      - { name: surcharge_index_id, type: string, source: system, description: "FK -> SurchargeIndex.id; VERSION-PINNED at provisional creation to the index for (order alloy, logical-clock month) and retained unchanged at finalization" }
      - { name: estimated_net_weight_lbs, type: number, source: computed, description: "= ordered_qty * part_net_weight_lbs (provisional billing basis)" }
      - { name: actual_shipped_net_weight_lbs, type: number, source: computed, description: "= sum(net_weight_lbs over this order's SHIPPED PartSerials); populated at finalize" }
      - { name: billable_weight_lbs, type: number, source: computed, description: "= estimated_net_weight_lbs while PROVISIONAL; = actual_shipped_net_weight_lbs once FINAL" }
      - { name: billable_tons, type: number, source: computed, description: "= round_half_up(billable_weight_lbs / 2000, 3)" }
      - { name: tier_rate_cents_per_ton, type: integer, source: computed, description: "Average-rate tier selected by billable_tons: <= tier1 limit -> tier1 rate; <= tier2 limit -> tier2 rate; else tier3 rate" }
      - { name: base_amount_cents, type: integer, source: computed, description: "= round_half_up(billable_tons * tier_rate_cents_per_ton, 0)" }
      - { name: alloy_surcharge_cents, type: integer, source: computed, description: "= round_half_up(billable_tons * pinned index.surcharge_cents_per_ton, 0)" }
      - { name: energy_surcharge_cents, type: integer, source: computed, description: "= round_half_up((base_amount_cents + alloy_surcharge_cents) * pinned index.energy_pct, 0)" }
      - { name: scrap_credit_cents, type: integer, source: computed, description: "= min(round_half_up(total_accepted_flash_lbs * scrap_recovery_rate_cents_per_lb, 0), round_half_up(base_amount_cents * 0.05, 0)); total_accepted_flash_lbs = sum(flash_scrap_lbs over ACCEPTED trim tickets of the order's runs)" }
      - { name: total_cents, type: integer, source: computed, description: "= base_amount_cents + alloy_surcharge_cents + energy_surcharge_cents - scrap_credit_cents (each component rounded to whole cents FIRST, then summed — pinned rounding order)" }
      - { name: status, type: enum, source: system, description: "PROVISIONAL | FINAL | PAID | VOID", default: "PROVISIONAL" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: MillHeat
    initial_state: RECEIVED
    terminal_states: [REJECTED, DEPLETED]
    transitions:
      - from: RECEIVED
        to: CERT_VERIFIED
        trigger: "POST /mill-heats/{id}/verify-cert"
        actor: QualityEngineer
        preconditions:
          - "carbon_pct <= alloy.carbon_max_pct AND manganese_pct <= alloy.manganese_max_pct (else ERR_CHEMISTRY_OUT_OF_SPEC)"
        side_effects:
          - "stores carbon_pct / manganese_pct on the heat"
      - from: RECEIVED
        to: QUARANTINED
        trigger: "POST /mill-heats/{id}/quarantine"
        actor: QualityEngineer
        preconditions: []
        side_effects: []
      - from: CERT_VERIFIED
        to: QUARANTINED
        trigger: "POST /mill-heats/{id}/quarantine"
        actor: QualityEngineer
        preconditions: []
        side_effects:
          - "blocks new furnace charges containing this heat's billets (ERR_HEAT_QUARANTINED)"
      - from: QUARANTINED
        to: CERT_VERIFIED
        trigger: "POST /mill-heats/{id}/release-quarantine"
        actor: QualityEngineer
        preconditions: []
        side_effects: []
        note: "quarantine -> release loop is a cycle; chemistry report from the original verify-cert is retained"
      - from: QUARANTINED
        to: REJECTED
        trigger: "POST /mill-heats/{id}/reject"
        actor: QualityEngineer
        preconditions: []
        side_effects: []
      - from: CERT_VERIFIED
        to: DEPLETED
        trigger: "system (evaluated on every billet mutation)"
        actor: system
        preconditions:
          - "remaining_weight_lbs == 0 AND no billet of this heat is in status CUT, CHARGED, or DISCHARGED (i.e. every cut billet is CONSUMED or SCRAPPED)"
        side_effects: []

  - entity: Billet
    initial_state: CUT
    terminal_states: [CONSUMED, SCRAPPED]
    transitions:
      - from: CUT
        to: CHARGED
        trigger: "POST /furnace-charges (billet listed in billet_ids)"
        actor: FurnaceOperator
        preconditions:
          - "billet.status IN {CUT, DISCHARGED}"
          - "heat status == CERT_VERIFIED (ERR_HEAT_QUARANTINED when QUARANTINED, ERR_HEAT_NOT_CERTIFIED when RECEIVED)"
          - "billet.charge_count < alloy.reheat_limit + 1 (else ERR_REHEAT_LIMIT_EXCEEDED)"
        side_effects:
          - "billet.charge_count += 1; billet.current_charge_id = charge id"
      - from: DISCHARGED
        to: CHARGED
        trigger: "POST /furnace-charges (reheat cycle)"
        actor: FurnaceOperator
        preconditions:
          - "billet.charge_count < alloy.reheat_limit + 1 (else ERR_REHEAT_LIMIT_EXCEEDED)"
        side_effects:
          - "billet.charge_count += 1; billet.current_charge_id = charge id"
      - from: CHARGED
        to: DISCHARGED
        trigger: "POST /furnace-charges/{id}/discharge or /abort (billet not yet consumed)"
        actor: FurnaceOperator
        preconditions: []
        side_effects:
          - "billet.current_charge_id = null"
      - from: CHARGED
        to: CONSUMED
        trigger: "POST /forge-runs/{id}/heats (billet listed in billet_ids)"
        actor: ForgeOperator
        preconditions:
          - "billet.current_charge_id == heat's furnace_charge_id (else ERR_BILLET_NOT_IN_CHARGE)"
        side_effects:
          - "billet.consumed_by_run_id = run id; WorkOrder.consumed_billet_weight_lbs recomputed; heat DEPLETED re-evaluated"
      - from: CUT
        to: SCRAPPED
        trigger: "POST /billets/{id}/scrap"
        actor: SawOperator
        preconditions: []
        side_effects:
          - "heat DEPLETED re-evaluated (scrapped weight does NOT return to remaining_weight_lbs)"
      - from: DISCHARGED
        to: SCRAPPED
        trigger: "POST /billets/{id}/scrap"
        actor: SawOperator
        preconditions: []
        side_effects: []

  - entity: FurnaceCharge
    initial_state: LOADING
    terminal_states: [DISCHARGED, ABORTED]
    transitions:
      - from: LOADING
        to: SOAKING
        trigger: "POST /furnace-charges/{id}/close-loading"
        actor: FurnaceOperator
        preconditions: []
        side_effects:
          - "closed_at = logical clock; soak window starts"
      - from: SOAKING
        to: READY
        trigger: "POST /furnace-charges/{id}/mark-ready"
        actor: FurnaceOperator
        preconditions:
          - "logical clock >= closed_at + soak_minutes (else ERR_SOAK_TIME_NOT_ELAPSED)"
        side_effects:
          - "ready_at = logical clock"
      - from: READY
        to: DISCHARGED
        trigger: "POST /furnace-charges/{id}/discharge"
        actor: FurnaceOperator
        preconditions: []
        side_effects:
          - "every billet still CHARGED in this charge -> DISCHARGED (current_charge_id = null); discharged_at = logical clock; furnace active_charge_id cleared"
      - from: LOADING
        to: ABORTED
        trigger: "POST /furnace-charges/{id}/abort"
        actor: FurnaceOperator
        preconditions: []
        side_effects:
          - "billets CHARGED in this charge -> DISCHARGED; discharged_at = logical clock; furnace active_charge_id cleared"
      - from: SOAKING
        to: ABORTED
        trigger: "POST /furnace-charges/{id}/abort"
        actor: FurnaceOperator
        preconditions: []
        side_effects: ["same billet release as discharge"]
      - from: READY
        to: ABORTED
        trigger: "POST /furnace-charges/{id}/abort"
        actor: FurnaceOperator
        preconditions: []
        side_effects: ["same billet release as discharge"]

  - entity: DieSet
    initial_state: AVAILABLE
    terminal_states: [RETIRED]
    transitions:
      - from: AVAILABLE
        to: INSTALLED
        trigger: "POST /die-sets/{id}/install"
        actor: DieShopTechnician
        preconditions:
          - "target work center status == UP (ERR_WORKCENTER_DOWN)"
          - "no other die set INSTALLED on that work center (ERR_WORKCENTER_HAS_DIE)"
        side_effects:
          - "installed_work_center_id = work_center_id"
      - from: INSTALLED
        to: AVAILABLE
        trigger: "POST /die-sets/{id}/uninstall"
        actor: DieShopTechnician
        preconditions:
          - "no ForgeRun in status IN_PROGRESS or FORGED references this die set (ERR_DIE_IN_USE)"
        side_effects:
          - "installed_work_center_id = null"
      - from: INSTALLED
        to: WORN
        trigger: "system (on POST /forge-runs/{id}/heats when cumulative_hits >= wear_limit_hits after the hit increment)"
        actor: system
        preconditions: []
        side_effects:
          - "auto-uninstall: installed_work_center_id = null"
          - "cascade: every ForgeRun in status SCHEDULED that references this die set -> CANCELLED (its work-center window is freed)"
      - from: WORN
        to: RESINKING
        trigger: "POST /die-sets/{id}/start-resink"
        actor: DieShopTechnician
        preconditions:
          - "resink_count < max_resinks (else ERR_DIE_RESINK_LIMIT)"
        side_effects: []
      - from: RESINKING
        to: AVAILABLE
        trigger: "POST /die-sets/{id}/complete-resink"
        actor: DieShopTechnician
        preconditions: []
        side_effects:
          - "cumulative_hits = 0; resink_count += 1"
      - from: AVAILABLE
        to: RETIRED
        trigger: "POST /die-sets/{id}/retire"
        actor: DieShopTechnician
        preconditions: []
        side_effects: []
      - from: WORN
        to: RETIRED
        trigger: "POST /die-sets/{id}/retire"
        actor: DieShopTechnician
        preconditions: []
        side_effects: []
    note: "AVAILABLE -> INSTALLED -> AVAILABLE is an explicit cycle; INSTALLED -> WORN -> RESINKING -> AVAILABLE is the wear/resink cycle"

  - entity: WorkCenter
    initial_state: UP
    terminal_states: []
    transitions:
      - from: UP
        to: DOWN
        trigger: "POST /work-centers/{id}/set-status {status: DOWN}"
        actor: PlantManager
        preconditions: []
        side_effects:
          - "blocks new forge runs and die installs on this center (ERR_WORKCENTER_DOWN)"
      - from: DOWN
        to: UP
        trigger: "POST /work-centers/{id}/set-status {status: UP}"
        actor: PlantManager
        preconditions: []
        side_effects: []

  - entity: WorkOrder
    initial_state: RELEASED
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: RELEASED
        to: IN_PROGRESS
        trigger: "system (on first ForgeRun start for this order)"
        actor: system
        preconditions: []
        side_effects: []
      - from: IN_PROGRESS
        to: PRODUCED
        trigger: "system (on trim-ticket ACCEPTED when trimmed_qty >= ordered_qty)"
        actor: system
        preconditions: []
        side_effects:
          - "auto-create one PENDING QualityCert per distinct mill_heat_id among this order's PartSerials lacking an existing cert"
      - from: PRODUCED
        to: CERTIFIED
        trigger: "system (on QualityCert -> CERTIFIED when heat_cert_coverage is complete: every distinct mill_heat_id used by this order's PartSerials has a CERTIFIED QualityCert)"
        actor: system
        preconditions: []
        side_effects: []
      - from: CERTIFIED
        to: PRODUCED
        trigger: "system (contagion: a forge heat consumes a billet whose mill_heat_id has no CERTIFIED cert for this order — e.g. a reopened run introduces a new heat)"
        actor: system
        preconditions: []
        side_effects: []
        note: "certification coverage is re-derived on every heat record; introducing an uncertified heat demotes the order"
      - from: CERTIFIED
        to: CLOSED
        trigger: "system (on Invoice FINAL -> PAID via POST /invoices/{id}/mark-paid)"
        actor: system
        preconditions: []
        side_effects: []
      - from: RELEASED
        to: CANCELLED
        trigger: "POST /work-orders/{id}/cancel"
        actor: SalesPlanner
        preconditions: []
        side_effects:
          - "cascade down: all ForgeRuns of this order in SCHEDULED -> CANCELLED"
      - from: IN_PROGRESS
        to: CANCELLED
        trigger: "POST /work-orders/{id}/cancel"
        actor: SalesPlanner
        preconditions:
          - "no ForgeHeat recorded on any run of this order (ERR_ORDER_HAS_PROGRESS)"
        side_effects:
          - "cascade down: ForgeRuns in SCHEDULED or IN_PROGRESS -> CANCELLED (FORGED/COMPLETED cannot exist because cancel requires zero heats)"

  - entity: ForgeRun
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /forge-runs/{id}/start"
        actor: ForgeOperator
        preconditions:
          - "work order status IN {RELEASED, IN_PROGRESS, PRODUCED, CERTIFIED}"
          - "die set status == INSTALLED and installed_work_center_id == run.work_center_id (ERR_DIE_NOT_INSTALLED)"
          - "work center status == UP (ERR_WORKCENTER_DOWN)"
        side_effects:
          - "operator_id = X-User-ID; actual_started_at = logical clock"
          - "bubble up: work order RELEASED -> IN_PROGRESS"
      - from: IN_PROGRESS
        to: FORGED
        trigger: "POST /forge-runs/{id}/finish-forging"
        actor: ForgeOperator
        preconditions:
          - "at least one ForgeHeat recorded (ERR_RUN_NO_HEATS)"
        side_effects: []
      - from: FORGED
        to: IN_PROGRESS
        trigger: "POST /forge-runs/{id}/reopen (additional heats / re-strike)"
        actor: ForgeOperator
        preconditions:
          - "no TrimTicket of this run in status DRAFT or FLAGGED (ERR_TRIM_TICKET_ACTIVE_EXISTS)"
        side_effects: []
        note: "FORGED -> IN_PROGRESS -> FORGED is the reheat/re-strike cycle; each pass may consume new heats"
      - from: FORGED
        to: COMPLETED
        trigger: "POST /forge-runs/{id}/complete"
        actor: ForgeOperator
        preconditions:
          - "at least one TrimTicket of this run in status ACCEPTED"
          - "no PartSerial of this run remains in status FORGED (ERR_TRIM_PENDING)"
        side_effects: []
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /forge-runs/{id}/cancel OR system (die-worn cascade) OR system (work-order cancel cascade)"
        actor: ForgeOperator | system
        preconditions: []
        side_effects:
          - "work-center window freed (run leaves the overlap-check set)"
      - from: IN_PROGRESS
        to: CANCELLED
        trigger: "POST /forge-runs/{id}/cancel OR system (work-order cancel cascade)"
        actor: ForgeOperator | system
        preconditions:
          - "no ForgeHeat recorded on this run (ERR_RUN_HAS_HEATS; operator-initiated cancel only)"
        side_effects:
          - "work-center window freed"

  - entity: TrimTicket
    initial_state: DRAFT
    terminal_states: [ACCEPTED, VOIDED]
    transitions:
      - from: DRAFT
        to: ACCEPTED
        trigger: "POST /trim-tickets/{id}/record (system disposition: unrounded flash/gross ratio <= alloy.flash_allowance_pct / 100)"
        actor: ForgeOperator + system
        preconditions:
          - "flash_scrap_lbs >= 0 AND gross_as_forged_lbs <= run.input_weight_lbs - sum(gross_as_forged_lbs of the run's other non-VOID tickets) (else ERR_TRIM_MASS_IMBALANCE)"
        side_effects:
          - "per_part_net_allocation: all FORGED parts of the run -> TRIMMED with net_weight_lbs assigned"
          - "bubble up: WorkOrder.trimmed_qty / trimmed_net_lbs recomputed; PRODUCED transition + cert auto-creation evaluated"
      - from: DRAFT
        to: FLAGGED
        trigger: "POST /trim-tickets/{id}/record (system disposition: unrounded ratio strictly exceeds allowance)"
        actor: ForgeOperator + system
        preconditions:
          - "same mass-balance preconditions as ACCEPTED"
        side_effects: []
      - from: FLAGGED
        to: ACCEPTED
        trigger: "POST /trim-tickets/{id}/approve-deviation"
        actor: QualityEngineer
        preconditions:
          - "deviation_reason non-empty"
        side_effects:
          - "same part-trim + work-order bubble-up side effects as the DRAFT -> ACCEPTED transition"
      - from: DRAFT
        to: VOIDED
        trigger: "POST /trim-tickets/{id}/void"
        actor: ForgeOperator
        preconditions: []
        side_effects: []
      - from: FLAGGED
        to: VOIDED
        trigger: "POST /trim-tickets/{id}/void (trim re-do: a replacement ticket may then be created)"
        actor: ForgeOperator
        preconditions: []
        side_effects: []

  - entity: PartSerial
    initial_state: FORGED
    terminal_states: [SHIPPED, SCRAPPED]
    transitions:
      - from: FORGED
        to: TRIMMED
        trigger: "system (trim ticket ACCEPTED covering this part)"
        actor: system
        preconditions: []
        side_effects:
          - "net_weight_lbs assigned by per_part_net_allocation"
      - from: TRIMMED
        to: INSPECTED
        trigger: "POST /part-serials/{id}/inspect"
        actor: QualityEngineer
        preconditions: []
        side_effects: []
      - from: INSPECTED
        to: SHIPPED
        trigger: "POST /work-orders/{id}/ship (part listed in part_serial_ids)"
        actor: SalesPlanner
        preconditions:
          - "part.status == INSPECTED (else ERR_PART_NOT_INSPECTED)"
        side_effects:
          - "WorkOrder.shipped_qty recomputed"
      - from: FORGED
        to: SCRAPPED
        trigger: "POST /part-serials/{id}/scrap"
        actor: QualityEngineer
        preconditions: []
        side_effects:
          - "WorkOrder.scrapped_qty recomputed"
      - from: TRIMMED
        to: SCRAPPED
        trigger: "POST /part-serials/{id}/scrap"
        actor: QualityEngineer
        preconditions: []
        side_effects: []
      - from: INSPECTED
        to: SCRAPPED
        trigger: "POST /part-serials/{id}/scrap"
        actor: QualityEngineer
        preconditions: []
        side_effects: []

  - entity: QualityCert
    initial_state: PENDING
    terminal_states: [CERTIFIED]
    transitions:
      - from: PENDING
        to: SUBMITTED
        trigger: "POST /quality-certs/{id}/submit"
        actor: QualityEngineer
        preconditions: []
        side_effects:
          - "stores grain_flow_rating, macro_etch_result, submitter_id = X-User-ID"
      - from: REJECTED
        to: SUBMITTED
        trigger: "POST /quality-certs/{id}/submit (resubmission cycle with new readings)"
        actor: QualityEngineer
        preconditions: []
        side_effects:
          - "submitter_id updated to the resubmitting user"
      - from: SUBMITTED
        to: CERTIFIED
        trigger: "POST /quality-certs/{id}/certify"
        actor: QualityEngineer
        preconditions:
          - "grain_flow_rating >= alloy.grain_flow_min_rating AND (macro_etch_result == PASS OR alloy.macro_etch_required == false) (else ERR_GRAIN_FLOW_BELOW_SPEC)"
          - "segregation of duties: certifier X-User-ID != submitter_id AND != operator_id of ANY ForgeRun of the parent work order (else ERR_CERT_SOD_VIOLATION)"
        side_effects:
          - "certifier_id = X-User-ID"
          - "bubble up: WorkOrder PRODUCED -> CERTIFIED evaluated via heat_cert_coverage"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /quality-certs/{id}/reject"
        actor: QualityEngineer
        preconditions:
          - "segregation of duties: rejecter X-User-ID != submitter_id (else ERR_CERT_SOD_VIOLATION)"
        side_effects: []

  - entity: Invoice
    initial_state: PROVISIONAL
    terminal_states: [PAID, VOID]
    transitions:
      - from: PROVISIONAL
        to: FINAL
        trigger: "POST /invoices/{id}/finalize"
        actor: SalesPlanner
        preconditions:
          - "work order status == CERTIFIED (ERR_ORDER_NOT_CERTIFIED)"
          - "no PartSerial of the order remains in FORGED, TRIMMED, or INSPECTED (ERR_ORDER_NOT_FULLY_SHIPPED)"
        side_effects:
          - "recompute all amounts via invoice_price FINAL variant (actual_shipped_net_weight_lbs); pinned surcharge_index_id retained"
      - from: FINAL
        to: PAID
        trigger: "POST /invoices/{id}/mark-paid"
        actor: SalesPlanner
        preconditions: []
        side_effects:
          - "bubble up: WorkOrder CERTIFIED -> CLOSED"
      - from: PROVISIONAL
        to: VOID
        trigger: "POST /invoices/{id}/void"
        actor: SalesPlanner
        preconditions: []
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: run-create-stale-work-order
    parent_entity: WorkOrder
    write_endpoint: "POST /forge-runs"
    occ_field: expected_work_order_version
    description: |
      Creating a ForgeRun against a WorkOrder whose version has advanced since
      the client last observed it is rejected. This captures the case where
      another writer has just mutated the order (another run creation, a
      production cascade, a status change) and the current writer's view of the
      order is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: invoice-create-stale-work-order
    parent_entity: WorkOrder
    write_endpoint: "POST /work-orders/{id}/invoices"
    occ_field: expected_work_order_version
    description: |
      Creating a provisional Invoice against a WorkOrder whose version has
      advanced since the client last observed it is rejected; the client must
      re-read the order and re-issue with the current version.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: billet_cut_weight
    trigger: "POST /mill-heats/{id}/billets (per cut line, per piece)"
    algorithm: aggregation
    formula: |
      cut_weight_lbs = round_half_up(cut_length_in * MillHeat.bar_lbs_per_in, 2)
    input_set: "the cut line's cut_length_in and the parent heat's bar_lbs_per_in"
    precision: "2 decimal places, round_half_up"

  - name: heat_remaining_weight
    trigger: "on every billet creation and billet status mutation for the heat"
    algorithm: aggregation
    formula: |
      remaining_weight_lbs = received_weight_lbs - sum(Billet.cut_weight_lbs for ALL billets ever cut from this heat, any status)
      depletion: when remaining_weight_lbs == 0 AND no billet in {CUT, CHARGED, DISCHARGED}: heat -> DEPLETED
    input_set: "all billets of the heat regardless of status (CUT/CHARGED/DISCHARGED/CONSUMED/SCRAPPED all count as removed weight)"
    precision: "2 decimal places, round_half_up"

  - name: required_press_tonnage
    trigger: "POST /work-orders (at creation; stored as WorkOrder.required_tonnage)"
    algorithm: threshold
    formula: |
      required_tonnage = ceil(projected_area_in2 * AlloySpec.flow_stress_ksi / 2)
      minimum 1 ton
    input_set: "work order projected_area_in2 and the referenced alloy's flow_stress_ksi"
    precision: "integer tons, round up"

  - name: die_wear_accumulation
    trigger: "POST /forge-runs/{id}/heats (after the heat is accepted)"
    algorithm: threshold
    formula: |
      hits_added = (parts_good + parts_scrapped) * AlloySpec.strokes_per_part
      DieSet.cumulative_hits += hits_added
      if DieSet.cumulative_hits >= DieSet.wear_limit_hits:
        DieSet -> WORN; installed_work_center_id = null (auto-uninstall)
        every ForgeRun in status SCHEDULED referencing this die set -> CANCELLED
    input_set: "the heat's part counts, the order's alloy strokes_per_part, the run's die set"
    precision: "integer hits"
    constants:
      BOUNDARY: "cumulative_hits >= wear_limit_hits triggers WORN (equality included)"

  - name: flash_yield
    trigger: "POST /trim-tickets/{id}/record"
    algorithm: threshold
    formula: |
      flash_scrap_lbs = gross_as_forged_lbs - net_trimmed_lbs - pierce_loss_lbs
      require flash_scrap_lbs >= 0 (else ERR_TRIM_MASS_IMBALANCE)
      require gross_as_forged_lbs <= run.input_weight_lbs - sum(gross_as_forged_lbs of the run's other non-VOID tickets) (else ERR_TRIM_MASS_IMBALANCE)
      flash_yield_pct (displayed) = round_half_up(flash_scrap_lbs / gross_as_forged_lbs * 100, 2)
      disposition: FLAGGED iff (flash_scrap_lbs / gross_as_forged_lbs * 100) > flash_allowance_pct  [UNROUNDED ratio, strict >]
                  else ACCEPTED
    input_set: "the ticket's three input weights, the order alloy's flash_allowance_pct, the run's input_weight_lbs and prior non-VOID tickets"
    precision: "ratio compared unrounded; displayed percentage 2 decimal places, round_half_up"
    constants:
      BOUNDARY: "exactly equal to the allowance -> ACCEPTED (flag only on strict exceedance)"

  - name: per_part_net_allocation
    trigger: "trim ticket -> ACCEPTED (on record or on approve-deviation)"
    algorithm: aggregation
    formula: |
      let parts = the run's PartSerials currently in status FORGED, N = count(parts)
      per_part = round_half_up(net_trimmed_lbs / N, 2)
      assign per_part to every covered part
      residual = round_half_up(net_trimmed_lbs - per_part * N, 2)
      add residual to the covered part with the LARGEST serial_seq
      (pinned rounding order: round per-part FIRST, then reconcile the residual;
       sum-then-round would produce a different part-level assignment)
    input_set: "the run's FORGED PartSerials at acceptance time, ordered by serial_seq"
    precision: "2 decimal places, round_half_up"

  - name: invoice_price
    trigger: "POST /work-orders/{id}/invoices (PROVISIONAL variant) and POST /invoices/{id}/finalize (FINAL variant)"
    algorithm: tiered_pricing
    formula: |
      billable_tons = round_half_up(billable_weight_lbs / 2000, 3)
      tier selection (AVERAGE rate, not marginal):
        billable_tons <= price_tier1_limit_tons  -> rate = price_tier1_cents_per_ton
        billable_tons <= price_tier2_limit_tons  -> rate = price_tier2_cents_per_ton
        else                                     -> rate = price_tier3_cents_per_ton
      base_amount_cents     = round_half_up(billable_tons * rate, 0)
      alloy_surcharge_cents = round_half_up(billable_tons * pinned_index.surcharge_cents_per_ton, 0)
      energy_surcharge_cents = round_half_up((base_amount_cents + alloy_surcharge_cents) * pinned_index.energy_pct, 0)
      total_accepted_flash_lbs = sum(flash_scrap_lbs over ACCEPTED trim tickets of the order's runs)
      scrap_credit_cents = min( round_half_up(total_accepted_flash_lbs * scrap_recovery_rate_cents_per_lb, 0),
                                round_half_up(base_amount_cents * SCRAP_CREDIT_CAP_PCT, 0) )
      total_cents = base_amount_cents + alloy_surcharge_cents + energy_surcharge_cents - scrap_credit_cents
      (pinned rounding order: each component rounded to whole cents FIRST, then summed)
    input_set: "WorkOrder pricing fields, the pinned SurchargeIndex, ACCEPTED trim tickets of the order's runs"
    precision: "tons 3dp round_half_up; money integer cents round_half_up; components rounded before summation"
    constants:
      TON_LBS: 2000
      SCRAP_CREDIT_CAP_PCT: 0.05
    variants:
      - name: provisional
        when: "invoice creation (status PROVISIONAL)"
        difference: "billable_weight_lbs = estimated_net_weight_lbs = ordered_qty * part_net_weight_lbs; typically no ACCEPTED trim tickets yet so scrap_credit_cents = 0"
      - name: final
        when: "invoice finalization (status FINAL)"
        difference: "billable_weight_lbs = actual_shipped_net_weight_lbs = sum of SHIPPED parts' net_weight_lbs; scrap credit computed over actual ACCEPTED trim tickets; pinned surcharge_index_id retained from provisional"

  - name: material_requirement
    trigger: "recomputed on every WorkOrder mutation and on every billet CONSUMED transition"
    algorithm: forward_looking
    formula: |
      planned_billet_weight_lbs  = ordered_qty * billet_weight_lbs          (forward-looking plan)
      consumed_billet_weight_lbs = sum(cut_weight_lbs of billets whose
                                   consumed_by_run_id references a run of this order)   (chronological actual)
    input_set: "WorkOrder.ordered_qty / billet_weight_lbs for the plan variant; CONSUMED billets linked to the order's runs for the actual variant"
    precision: "2 decimal places, round_half_up"
    variants:
      - name: planned
        when: "order release / feasibility review"
        difference: "uses contracted quantities; ignores shop-floor reality"
      - name: consumed
        when: "shop-floor actuals"
        difference: "uses only billets already consumed; unaffected by ordered_qty"

  - name: workcenter_selection
    trigger: "POST /forge-runs when work_center_id is omitted (auto-select)"
    algorithm: constraint_propagation
    formula: |
      eligibility filter (candidate pool):
        WorkCenter.status == UP
        AND WorkCenter.type == work_order.required_process
        AND WorkCenter.rated_tonnage >= work_order.required_tonnage
        AND no non-CANCELLED ForgeRun on that center violates the turnaround rule:
            new.planned_start >= existing.planned_end + 30 minutes
            OR new.planned_end <= existing.planned_start - 30 minutes
            (a gap of EXACTLY 30 minutes is allowed; runs in CANCELLED are excluded from the set)
      ranking: rated_tonnage ASC, then WorkCenter.created_at ASC
      empty pool -> ERR_NO_WORKCENTER_AVAILABLE
      when work_center_id IS supplied: same eligibility checks produce
        ERR_WORKCENTER_DOWN / ERR_PROCESS_TYPE_MISMATCH /
        ERR_WORKCENTER_TONNAGE_INSUFFICIENT / ERR_WORKCENTER_WINDOW_OVERLAP
    input_set: "all WorkCenters, the order's required_process/required_tonnage, non-CANCELLED runs per center"
    constants:
      TURNAROUND_MINUTES: 30

  - name: heat_cert_coverage
    trigger: "on QualityCert -> CERTIFIED and on every POST /forge-runs/{id}/heats"
    algorithm: aggregation
    formula: |
      used_heats  = distinct mill_heat_id over the order's PartSerials (any status except SCRAPPED)
      certed_heats = mill_heat_id set of the order's QualityCerts in status CERTIFIED
      coverage_complete = (used_heats != empty) AND (used_heats SUBSET-OF certed_heats)
      if coverage_complete AND order.status == PRODUCED: order -> CERTIFIED
      if NOT coverage_complete AND order.status == CERTIFIED: order -> PRODUCED  (contagion demotion)
    input_set: "the order's PartSerials excluding SCRAPPED; the order's QualityCerts in CERTIFIED"
    precision: "set semantics"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-ID and X-User-Role headers present and non-empty", error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http_status: 400, applies_to: "all endpoints" }
  - { priority: 2, category: auth, check: "X-User-Role is permitted for this endpoint per §1.5 roles", error_id: ERR_FORBIDDEN_FOR_ROLE, http_status: 403, applies_to: "all endpoints" }
  - { priority: 3, category: existence, check: "Request body schema: required fields present, enum values valid, numeric ranges sane", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all endpoints with a request body" }
  - { priority: 4, category: existence, check: "Path-template ids resolve to existing resources, validated left-to-right; body-supplied FK ids resolve after path ids", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all resource endpoints" }
  - { priority: 5, category: state, check: "OCC: expected_work_order_version equals the current WorkOrder.version", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "POST /forge-runs; POST /work-orders/{id}/invoices" }
  - { priority: 6, category: state, check: "Target resource is in a valid source state for the requested transition (incl. ERR_CHARGE_NOT_READY for heat-recording against a non-READY charge, ERR_PART_NOT_INSPECTED for shipping a non-INSPECTED part, ERR_RUN_NO_HEATS for finish-forging with zero heats)", error_id: ERR_INVALID_STATE_TRANSITION, http_status: 409, applies_to: "all state-transition endpoints" }
  - { priority: 7, category: business_safety, check: "Charge target_temp_f within the alloy forge window [forge_temp_min_f, forge_temp_max_f] inclusive", error_id: ERR_TEMP_OUTSIDE_FORGE_WINDOW, http_status: 422, applies_to: "POST /furnace-charges" }
  - { priority: 8, category: business_safety, check: "Re-heat limit: billet.charge_count < alloy.reheat_limit + 1 at charge time", error_id: ERR_REHEAT_LIMIT_EXCEEDED, http_status: 409, applies_to: "POST /furnace-charges" }
  - { priority: 9, category: business_safety, check: "Cert chemistry: carbon_pct <= carbon_max_pct AND manganese_pct <= manganese_max_pct", error_id: ERR_CHEMISTRY_OUT_OF_SPEC, http_status: 422, applies_to: "POST /mill-heats/{id}/verify-cert" }
  - { priority: 10, category: business_safety, check: "Die worn guard: recording a forge heat while the run's die set is WORN is forbidden", error_id: ERR_DIE_WORN, http_status: 409, applies_to: "POST /forge-runs/{id}/heats" }
  - { priority: 11, category: business_safety, check: "Trim mass balance: flash_scrap_lbs >= 0 and gross does not exceed the run's unallocated input weight", error_id: ERR_TRIM_MASS_IMBALANCE, http_status: 422, applies_to: "POST /trim-tickets/{id}/record" }
  - { priority: 12, category: business_safety, check: "Part accounting: parts_good + parts_scrapped == len(billet_ids) on a forge heat", error_id: ERR_PART_COUNT_MISMATCH, http_status: 422, applies_to: "POST /forge-runs/{id}/heats" }
  - { priority: 13, category: business_safety, check: "Grain-flow/macro-etch readings meet the alloy spec at certify time", error_id: ERR_GRAIN_FLOW_BELOW_SPEC, http_status: 422, applies_to: "POST /quality-certs/{id}/certify" }
  - { priority: 14, category: business_referential, check: "Heat usability: billet cutting and furnace charging require the heat CERT_VERIFIED (ERR_HEAT_NOT_CERTIFIED when RECEIVED; ERR_HEAT_QUARANTINED when QUARANTINED); heat-record billets must be CHARGED in the referenced charge (ERR_BILLET_NOT_IN_CHARGE); die set must be INSTALLED on the run's work center (ERR_DIE_NOT_INSTALLED); order cancel blocked by recorded heats (ERR_ORDER_HAS_PROGRESS); sample part must belong to the cert's heat (ERR_SAMPLE_NOT_FROM_HEAT); manually created cert's heat must appear among the order's parts (ERR_HEAT_NOT_IN_ORDER)", error_id: "ERR_HEAT_NOT_CERTIFIED / ERR_HEAT_QUARANTINED / ERR_BILLET_NOT_IN_CHARGE / ERR_DIE_NOT_INSTALLED / ERR_ORDER_HAS_PROGRESS / ERR_SAMPLE_NOT_FROM_HEAT / ERR_HEAT_NOT_IN_ORDER", http_status: 409, applies_to: "cut, charge, heat-record, run-start, cancel, cert-create endpoints" }
  - { priority: 15, category: business_temporal, check: "Furnace window overlap: [planned_load_start, planned_unload) half-open per furnace, adjacency allowed (ERR_FURNACE_WINDOW_OVERLAP); work-center turnaround: 30-minute gap between runs on one center, exact-gap allowed (ERR_WORKCENTER_WINDOW_OVERLAP); soak: clock >= closed_at + soak_minutes (ERR_SOAK_TIME_NOT_ELAPSED)", error_id: "ERR_FURNACE_WINDOW_OVERLAP / ERR_WORKCENTER_WINDOW_OVERLAP / ERR_SOAK_TIME_NOT_ELAPSED", http_status: 409, applies_to: "POST /furnace-charges; POST /forge-runs; POST /furnace-charges/{id}/mark-ready" }
  - { priority: 16, category: business_constraint, check: "Uniqueness: heat_number (ERR_DUPLICATE_HEAT_NUMBER), alloy grade_code (ERR_DUPLICATE_ALLOY_GRADE), (alloy, month) surcharge (ERR_DUPLICATE_SURCHARGE_INDEX), one cert per (order, heat) (ERR_CERT_EXISTS), one non-VOID invoice per order (ERR_INVOICE_EXISTS), one active trim ticket per run (ERR_TRIM_TICKET_ACTIVE_EXISTS), one installed die per work center (ERR_WORKCENTER_HAS_DIE)", error_id: "ERR_DUPLICATE_HEAT_NUMBER / ERR_DUPLICATE_ALLOY_GRADE / ERR_DUPLICATE_SURCHARGE_INDEX / ERR_CERT_EXISTS / ERR_INVOICE_EXISTS / ERR_TRIM_TICKET_ACTIVE_EXISTS / ERR_WORKCENTER_HAS_DIE", http_status: 409, applies_to: "creation endpoints" }
  - { priority: 17, category: business_constraint, check: "Capacity/compatibility: charge weight <= furnace capacity (ERR_FURNACE_CAPACITY_EXCEEDED); furnace UP (ERR_FURNACE_DOWN); work center UP (ERR_WORKCENTER_DOWN); center type == required_process (ERR_PROCESS_TYPE_MISMATCH); rated_tonnage >= required_tonnage (ERR_WORKCENTER_TONNAGE_INSUFFICIENT); selector empty pool (ERR_NO_WORKCENTER_AVAILABLE); charge alloy == order alloy on heat record (ERR_ALLOY_MISMATCH); billet_weight_lbs >= part_net_weight_lbs * (1 + flash_allowance_pct/100) (ERR_BILLET_UNDERWEIGHT); die not referenced by active runs for uninstall (ERR_DIE_IN_USE); resink budget (ERR_DIE_RESINK_LIMIT); cut lines' total weight <= heat remaining_weight_lbs (ERR_INSUFFICIENT_HEAT_WEIGHT)", error_id: "ERR_FURNACE_CAPACITY_EXCEEDED / ERR_FURNACE_DOWN / ERR_WORKCENTER_DOWN / ERR_PROCESS_TYPE_MISMATCH / ERR_WORKCENTER_TONNAGE_INSUFFICIENT / ERR_NO_WORKCENTER_AVAILABLE / ERR_ALLOY_MISMATCH / ERR_BILLET_UNDERWEIGHT / ERR_DIE_IN_USE / ERR_DIE_RESINK_LIMIT / ERR_INSUFFICIENT_HEAT_WEIGHT", http_status: 409, applies_to: "charge/run/order/die endpoints" }
  - { priority: 18, category: business_constraint, check: "Segregation of duties: certifier != submitter and certifier != operator_id of any ForgeRun of the parent order", error_id: ERR_CERT_SOD_VIOLATION, http_status: 403, applies_to: "POST /quality-certs/{id}/certify; POST /quality-certs/{id}/reject" }
  - { priority: 19, category: business_referential, check: "Invoice gating: finalize requires order CERTIFIED (ERR_ORDER_NOT_CERTIFIED) and no unshipped non-scrapped parts (ERR_ORDER_NOT_FULLY_SHIPPED)", error_id: "ERR_ORDER_NOT_CERTIFIED / ERR_ORDER_NOT_FULLY_SHIPPED", http_status: 409, applies_to: "POST /invoices/{id}/finalize" }
  - { priority: 20, category: business_fiscal, check: "Surcharge index exists for (order alloy, logical-clock month) at provisional creation", error_id: ERR_SURCHARGE_INDEX_MISSING, http_status: 422, applies_to: "POST /work-orders/{id}/invoices" }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
# Read endpoints allow every authenticated role: &ALL_ROLES anchor below.
endpoints:
  # --- logical clock (test-driving; default 2026-08-01T00:00:00Z) ---
  - { method: POST, path: "/_clock/set_current_utc", description: "Set the logical clock. Server startup default is exactly 2026-08-01T00:00:00Z; before any set_current_utc call the logical clock reads this default and never falls back to wall-clock time.", roles: [PlantManager], code: 200, input: [to_iso8601], output: { current_utc: datetime }, side_effects: [] }

  # --- AlloySpec ---
  - { method: POST, path: "/alloy-specs", description: "Create an alloy specification", roles: [PlantManager], code: 201, input: [grade_code, name, forge_temp_min_f, forge_temp_max_f, reheat_limit, flash_allowance_pct, strokes_per_part, flow_stress_ksi, carbon_max_pct, manganese_max_pct, grain_flow_min_rating, macro_etch_required], output: AlloySpec, side_effects: [] }
  - { method: GET, path: "/alloy-specs", description: "List alloy specs", roles: &ALL_ROLES [PlantManager, SawOperator, FurnaceOperator, ForgeOperator, DieShopTechnician, QualityEngineer, SalesPlanner], code: 200, input: ["grade_code?", "limit?", "offset?"], output: "AlloySpec[]", side_effects: [] }
  - { method: GET, path: "/alloy-specs/{id}", description: "Get one alloy spec", roles: *ALL_ROLES, code: 200, input: [], output: AlloySpec, side_effects: [] }

  # --- MillHeat ---
  - { method: POST, path: "/mill-heats", description: "Register a bar-mill heat lot (RECEIVED)", roles: [PlantManager], code: 201, input: [heat_number, alloy_spec_id, mill_name, received_weight_lbs, bar_lbs_per_in], output: MillHeat, side_effects: ["status=RECEIVED; remaining_weight_lbs=received_weight_lbs"] }
  - { method: GET, path: "/mill-heats", description: "List heat lots", roles: *ALL_ROLES, code: 200, input: ["status?", "alloy_spec_id?", "limit?", "offset?"], output: "MillHeat[]", side_effects: [] }
  - { method: GET, path: "/mill-heats/{id}", description: "Get one heat lot (incl. computed remaining_weight_lbs)", roles: *ALL_ROLES, code: 200, input: [], output: MillHeat, side_effects: [] }
  - { method: POST, path: "/mill-heats/{id}/verify-cert", description: "Verify mill cert chemistry against the alloy spec (RECEIVED -> CERT_VERIFIED)", roles: [QualityEngineer], code: 200, input: [carbon_pct, manganese_pct], output: MillHeat, side_effects: ["stores chemistry; ERR_CHEMISTRY_OUT_OF_SPEC when over spec max"] }
  - { method: POST, path: "/mill-heats/{id}/quarantine", description: "Quarantine a heat (RECEIVED/CERT_VERIFIED -> QUARANTINED)", roles: [QualityEngineer], code: 200, input: [reason], output: MillHeat, side_effects: [] }
  - { method: POST, path: "/mill-heats/{id}/release-quarantine", description: "Release a quarantined heat (QUARANTINED -> CERT_VERIFIED)", roles: [QualityEngineer], code: 200, input: [], output: MillHeat, side_effects: [] }
  - { method: POST, path: "/mill-heats/{id}/reject", description: "Reject a quarantined heat (QUARANTINED -> REJECTED)", roles: [QualityEngineer], code: 200, input: [reason], output: MillHeat, side_effects: [] }
  - { method: GET, path: "/mill-heats/{id}/billets", description: "List billets cut from this heat", roles: *ALL_ROLES, code: 200, input: ["limit?", "offset?"], output: "Billet[]", side_effects: [] }

  # --- Billet ---
  - { method: POST, path: "/mill-heats/{id}/billets", description: "Cut billets from a heat; one Billet created per cut line per quantity", roles: [SawOperator], code: 201, input: [cuts], output: "Billet[]", side_effects: ["billet_cut_weight per piece; heat remaining_weight_lbs decremented; heat DEPLETED re-evaluated; ERR_INSUFFICIENT_HEAT_WEIGHT when cut lines exceed remaining weight"] }
  - { method: GET, path: "/billets", description: "List billets with filters", roles: *ALL_ROLES, code: 200, input: ["mill_heat_id?", "status?", "current_charge_id?", "consumed_by_run_id?", "limit?", "offset?"], output: "Billet[]", side_effects: [] }
  - { method: GET, path: "/billets/{id}", description: "Get one billet", roles: *ALL_ROLES, code: 200, input: [], output: Billet, side_effects: [] }
  - { method: POST, path: "/billets/{id}/scrap", description: "Scrap a billet in CUT or DISCHARGED (weight does not return to the heat)", roles: [SawOperator], code: 200, input: [reason], output: Billet, side_effects: ["heat DEPLETED re-evaluated"] }

  # --- Furnace ---
  - { method: POST, path: "/furnaces", description: "Register a furnace", roles: [PlantManager], code: 201, input: [furnace_code, capacity_lbs], output: Furnace, side_effects: [] }
  - { method: GET, path: "/furnaces", description: "List furnaces", roles: *ALL_ROLES, code: 200, input: ["status?", "active_charge_id?", "limit?", "offset?"], output: "Furnace[]", side_effects: [] }
  - { method: GET, path: "/furnaces/{id}", description: "Get one furnace", roles: *ALL_ROLES, code: 200, input: [], output: Furnace, side_effects: [] }
  - { method: POST, path: "/furnaces/{id}/set-status", description: "Set furnace UP/DOWN", roles: [PlantManager], code: 200, input: [status], output: Furnace, side_effects: [] }

  # --- FurnaceCharge ---
  - { method: POST, path: "/furnace-charges", description: "Create a furnace charge (LOADING); billets transition CUT/DISCHARGED -> CHARGED", roles: [FurnaceOperator], code: 201, input: [furnace_id, billet_ids, target_temp_f, soak_minutes, planned_load_start, planned_unload], output: FurnaceCharge, side_effects: ["billet charge_count += 1 each; charge_weight_lbs computed; furnace active_charge_id set; single-alloy enforced (ERR_MIXED_ALLOY_CHARGE); half-open window overlap check"] }
  - { method: GET, path: "/furnace-charges", description: "List furnace charges", roles: *ALL_ROLES, code: 200, input: ["furnace_id?", "status?", "alloy_spec_id?", "limit?", "offset?"], output: "FurnaceCharge[]", side_effects: [] }
  - { method: GET, path: "/furnace-charges/{id}", description: "Get one furnace charge", roles: *ALL_ROLES, code: 200, input: [], output: FurnaceCharge, side_effects: [] }
  - { method: POST, path: "/furnace-charges/{id}/close-loading", description: "Close loading (LOADING -> SOAKING); closed_at = logical clock", roles: [FurnaceOperator], code: 200, input: [], output: FurnaceCharge, side_effects: [] }
  - { method: POST, path: "/furnace-charges/{id}/mark-ready", description: "Mark charge READY once soak elapsed (SOAKING -> READY)", roles: [FurnaceOperator], code: 200, input: [], output: FurnaceCharge, side_effects: ["ERR_SOAK_TIME_NOT_ELAPSED when clock < closed_at + soak_minutes"] }
  - { method: POST, path: "/furnace-charges/{id}/discharge", description: "Discharge a READY charge; unconsumed billets -> DISCHARGED", roles: [FurnaceOperator], code: 200, input: [], output: FurnaceCharge, side_effects: ["billets released; furnace active_charge_id cleared"] }
  - { method: POST, path: "/furnace-charges/{id}/abort", description: "Abort a charge in LOADING/SOAKING/READY; billets -> DISCHARGED", roles: [FurnaceOperator], code: 200, input: [], output: FurnaceCharge, side_effects: ["billets released; furnace active_charge_id cleared"] }
  - { method: GET, path: "/furnace-charges/{id}/heats", description: "List forge heats drawn from this charge", roles: *ALL_ROLES, code: 200, input: ["limit?", "offset?"], output: "ForgeHeat[]", side_effects: [] }

  # --- DieSet ---
  - { method: POST, path: "/die-sets", description: "Register a die set", roles: [DieShopTechnician], code: 201, input: [die_set_code, part_family, wear_limit_hits, max_resinks], output: DieSet, side_effects: [] }
  - { method: GET, path: "/die-sets", description: "List die sets", roles: *ALL_ROLES, code: 200, input: ["status?", "installed_work_center_id?", "limit?", "offset?"], output: "DieSet[]", side_effects: [] }
  - { method: GET, path: "/die-sets/{id}", description: "Get one die set", roles: *ALL_ROLES, code: 200, input: [], output: DieSet, side_effects: [] }
  - { method: POST, path: "/die-sets/{id}/install", description: "Install an AVAILABLE die set on a work center", roles: [DieShopTechnician], code: 200, input: [work_center_id], output: DieSet, side_effects: ["installed_work_center_id set; ERR_WORKCENTER_HAS_DIE when occupied"] }
  - { method: POST, path: "/die-sets/{id}/uninstall", description: "Uninstall a die set (INSTALLED -> AVAILABLE); blocked while active runs reference it (ERR_DIE_IN_USE)", roles: [DieShopTechnician], code: 200, input: [], output: DieSet, side_effects: [] }
  - { method: POST, path: "/die-sets/{id}/start-resink", description: "Begin resinking a WORN die (WORN -> RESINKING); resink_count must be < max_resinks", roles: [DieShopTechnician], code: 200, input: [], output: DieSet, side_effects: [] }
  - { method: POST, path: "/die-sets/{id}/complete-resink", description: "Complete resink (RESINKING -> AVAILABLE); cumulative_hits=0, resink_count+=1", roles: [DieShopTechnician], code: 200, input: [], output: DieSet, side_effects: ["cumulative_hits reset; resink_count incremented"] }
  - { method: POST, path: "/die-sets/{id}/retire", description: "Retire a die set (AVAILABLE/WORN -> RETIRED, terminal)", roles: [DieShopTechnician], code: 200, input: [], output: DieSet, side_effects: [] }

  # --- WorkCenter ---
  - { method: POST, path: "/work-centers", description: "Register a press/hammer work center", roles: [PlantManager], code: 201, input: [code, type, rated_tonnage], output: WorkCenter, side_effects: [] }
  - { method: GET, path: "/work-centers", description: "List work centers", roles: *ALL_ROLES, code: 200, input: ["status?", "type?", "limit?", "offset?"], output: "WorkCenter[]", side_effects: [] }
  - { method: GET, path: "/work-centers/{id}", description: "Get one work center", roles: *ALL_ROLES, code: 200, input: [], output: WorkCenter, side_effects: [] }
  - { method: POST, path: "/work-centers/{id}/set-status", description: "Set work center UP/DOWN", roles: [PlantManager], code: 200, input: [status], output: WorkCenter, side_effects: [] }

  # --- WorkOrder ---
  - { method: POST, path: "/work-orders", description: "Release a customer work order (RELEASED); required_tonnage computed", roles: [SalesPlanner], code: 201, input: [order_number, customer_name, alloy_spec_id, part_number, ordered_qty, part_net_weight_lbs, billet_weight_lbs, projected_area_in2, required_process, price_tier1_limit_tons, price_tier1_cents_per_ton, price_tier2_limit_tons, price_tier2_cents_per_ton, price_tier3_cents_per_ton, scrap_recovery_rate_cents_per_lb], output: WorkOrder, side_effects: ["required_tonnage computed; ERR_BILLET_UNDERWEIGHT check"] }
  - { method: GET, path: "/work-orders", description: "List work orders", roles: *ALL_ROLES, code: 200, input: ["status?", "alloy_spec_id?", "limit?", "offset?"], output: "WorkOrder[]", side_effects: [] }
  - { method: GET, path: "/work-orders/{id}", description: "Get one work order (incl. computed quantities)", roles: *ALL_ROLES, code: 200, input: [], output: WorkOrder, side_effects: [] }
  - { method: POST, path: "/work-orders/{id}/cancel", description: "Cancel a work order; cascades to SCHEDULED/IN_PROGRESS runs; blocked once heats are recorded", roles: [SalesPlanner], code: 200, input: [], output: WorkOrder, side_effects: ["runs SCHEDULED/IN_PROGRESS -> CANCELLED; ERR_ORDER_HAS_PROGRESS"] }
  - { method: POST, path: "/work-orders/{id}/ship", description: "Ship INSPECTED parts; each listed part -> SHIPPED", roles: [SalesPlanner], code: 200, input: [part_serial_ids], output: WorkOrder, side_effects: ["parts -> SHIPPED; shipped_qty recomputed; ERR_PART_NOT_INSPECTED"] }
  - { method: GET, path: "/work-orders/{id}/forge-runs", description: "List runs of an order", roles: *ALL_ROLES, code: 200, input: ["limit?", "offset?"], output: "ForgeRun[]", side_effects: [] }
  - { method: GET, path: "/work-orders/{id}/quality-certs", description: "List quality certs of an order", roles: *ALL_ROLES, code: 200, input: ["limit?", "offset?"], output: "QualityCert[]", side_effects: [] }
  - { method: GET, path: "/work-orders/{id}/invoices", description: "List invoices of an order", roles: *ALL_ROLES, code: 200, input: ["limit?", "offset?"], output: "Invoice[]", side_effects: [] }
  - { method: GET, path: "/work-orders/{id}/part-serials", description: "List serialized parts of an order", roles: *ALL_ROLES, code: 200, input: ["limit?", "offset?"], output: "PartSerial[]", side_effects: [] }

  # --- ForgeRun ---
  - { method: POST, path: "/forge-runs", description: "Schedule a forge run (SCHEDULED). OCC on WorkOrder.version. work_center_id optional: omitted -> workcenter_selection auto-picks; supplied -> eligibility validated.", roles: [ForgeOperator], code: 201, input: [work_order_id, die_set_id, planned_start, planned_end, planned_qty, expected_work_order_version, "work_center_id?"], output: ForgeRun, side_effects: ["increments WorkOrder.version by 1; work-center turnaround overlap check"] }
  - { method: GET, path: "/forge-runs", description: "List forge runs", roles: *ALL_ROLES, code: 200, input: ["work_order_id?", "work_center_id?", "die_set_id?", "status?", "limit?", "offset?"], output: "ForgeRun[]", side_effects: [] }
  - { method: GET, path: "/forge-runs/{id}", description: "Get one forge run", roles: *ALL_ROLES, code: 200, input: [], output: ForgeRun, side_effects: [] }
  - { method: POST, path: "/forge-runs/{id}/start", description: "Start a scheduled run (SCHEDULED -> IN_PROGRESS)", roles: [ForgeOperator], code: 200, input: [], output: ForgeRun, side_effects: ["operator_id = X-User-ID; work order RELEASED -> IN_PROGRESS"] }
  - { method: POST, path: "/forge-runs/{id}/heats", description: "Record one forge heat: consumes billets from a READY charge, creates PartSerials, accumulates die hits", roles: [ForgeOperator], code: 201, input: [furnace_charge_id, billet_ids, parts_good, parts_scrapped], output: ForgeHeat, side_effects: ["billets CHARGED -> CONSUMED; PartSerials created (FORGED); die_wear_accumulation (may WORN the die + cancel scheduled runs); WorkOrder.consumed_billet_weight_lbs recomputed; heat DEPLETED re-evaluated; heat_cert_coverage re-evaluated (may demote CERTIFIED -> PRODUCED)"] }
  - { method: GET, path: "/forge-runs/{id}/heats", description: "List heats recorded on a run", roles: *ALL_ROLES, code: 200, input: ["limit?", "offset?"], output: "ForgeHeat[]", side_effects: [] }
  - { method: POST, path: "/forge-runs/{id}/finish-forging", description: "Declare forging complete (IN_PROGRESS -> FORGED); requires >= 1 heat", roles: [ForgeOperator], code: 200, input: [], output: ForgeRun, side_effects: [] }
  - { method: POST, path: "/forge-runs/{id}/reopen", description: "Reopen a forged run for additional heats (FORGED -> IN_PROGRESS); blocked while a DRAFT/FLAGGED trim ticket exists", roles: [ForgeOperator], code: 200, input: [], output: ForgeRun, side_effects: [] }
  - { method: POST, path: "/forge-runs/{id}/complete", description: "Complete a forged run (FORGED -> COMPLETED); requires an ACCEPTED trim ticket and no FORGED parts remaining", roles: [ForgeOperator], code: 200, input: [], output: ForgeRun, side_effects: ["ERR_TRIM_PENDING when parts await trim"] }
  - { method: POST, path: "/forge-runs/{id}/cancel", description: "Cancel a run (SCHEDULED/IN_PROGRESS with zero heats -> CANCELLED)", roles: [ForgeOperator], code: 200, input: [], output: ForgeRun, side_effects: ["work-center window freed; ERR_RUN_HAS_HEATS"] }

  # --- TrimTicket ---
  - { method: POST, path: "/forge-runs/{id}/trim-tickets", description: "Open a trim ticket for a FORGED run (DRAFT); at most one active (DRAFT/FLAGGED) ticket per run", roles: [ForgeOperator], code: 201, input: [], output: TrimTicket, side_effects: ["ERR_TRIM_TICKET_ACTIVE_EXISTS"] }
  - { method: GET, path: "/forge-runs/{id}/trim-tickets", description: "List trim tickets of a run", roles: *ALL_ROLES, code: 200, input: ["limit?", "offset?"], output: "TrimTicket[]", side_effects: [] }
  - { method: GET, path: "/trim-tickets/{id}", description: "Get one trim ticket", roles: *ALL_ROLES, code: 200, input: [], output: TrimTicket, side_effects: [] }
  - { method: POST, path: "/trim-tickets/{id}/record", description: "Record trim/pierce weights; system dispositions ACCEPTED (within allowance) or FLAGGED (exceeds)", roles: [ForgeOperator], code: 200, input: [gross_as_forged_lbs, net_trimmed_lbs, pierce_loss_lbs], output: TrimTicket, side_effects: ["flash_yield computed; on ACCEPTED: per_part_net_allocation trims parts, WorkOrder bubble-up (PRODUCED + cert auto-create)"] }
  - { method: POST, path: "/trim-tickets/{id}/approve-deviation", description: "Quality deviation approval for a FLAGGED ticket (FLAGGED -> ACCEPTED)", roles: [QualityEngineer], code: 200, input: [deviation_reason], output: TrimTicket, side_effects: ["same trim/allocation/bubble-up side effects as record-accept"] }
  - { method: POST, path: "/trim-tickets/{id}/void", description: "Void a DRAFT or FLAGGED ticket (trim re-do path)", roles: [ForgeOperator], code: 200, input: [], output: TrimTicket, side_effects: [] }

  # --- QualityCert ---
  - { method: POST, path: "/work-orders/{id}/quality-certs", description: "Manually create a PENDING cert for a heat used by the order (covers post-PRODUCED heat introductions); one cert per (order, heat)", roles: [QualityEngineer], code: 201, input: [mill_heat_id, "sample_part_serial_id?"], output: QualityCert, side_effects: ["ERR_CERT_EXISTS; ERR_HEAT_NOT_IN_ORDER; ERR_SAMPLE_NOT_FROM_HEAT"] }
  - { method: GET, path: "/quality-certs", description: "List quality certs", roles: *ALL_ROLES, code: 200, input: ["work_order_id?", "mill_heat_id?", "sample_part_serial_id?", "status?", "limit?", "offset?"], output: "QualityCert[]", side_effects: [] }
  - { method: GET, path: "/quality-certs/{id}", description: "Get one quality cert", roles: *ALL_ROLES, code: 200, input: [], output: QualityCert, side_effects: [] }
  - { method: POST, path: "/quality-certs/{id}/submit", description: "Submit grain-flow/macro-etch readings (PENDING/REJECTED -> SUBMITTED)", roles: [QualityEngineer], code: 200, input: [grain_flow_rating, macro_etch_result], output: QualityCert, side_effects: ["submitter_id = X-User-ID"] }
  - { method: POST, path: "/quality-certs/{id}/certify", description: "Certify submitted readings (SUBMITTED -> CERTIFIED); SoD enforced", roles: [QualityEngineer], code: 200, input: [], output: QualityCert, side_effects: ["heat_cert_coverage evaluated; WorkOrder may -> CERTIFIED; ERR_GRAIN_FLOW_BELOW_SPEC; ERR_CERT_SOD_VIOLATION"] }
  - { method: POST, path: "/quality-certs/{id}/reject", description: "Reject submitted readings (SUBMITTED -> REJECTED); rejecter != submitter", roles: [QualityEngineer], code: 200, input: [reason], output: QualityCert, side_effects: ["ERR_CERT_SOD_VIOLATION"] }

  # --- PartSerial ---
  - { method: GET, path: "/part-serials", description: "List serialized parts (heat-lot traceability queries)", roles: *ALL_ROLES, code: 200, input: ["work_order_id?", "mill_heat_id?", "forge_run_id?", "forge_heat_id?", "status?", "limit?", "offset?"], output: "PartSerial[]", side_effects: [] }
  - { method: GET, path: "/part-serials/{id}", description: "Get one serialized part", roles: *ALL_ROLES, code: 200, input: [], output: PartSerial, side_effects: [] }
  - { method: POST, path: "/part-serials/{id}/inspect", description: "Inspect a trimmed part (TRIMMED -> INSPECTED)", roles: [QualityEngineer], code: 200, input: [], output: PartSerial, side_effects: [] }
  - { method: POST, path: "/part-serials/{id}/scrap", description: "Scrap a part (FORGED/TRIMMED/INSPECTED -> SCRAPPED)", roles: [QualityEngineer], code: 200, input: [reason], output: PartSerial, side_effects: ["WorkOrder.scrapped_qty recomputed"] }

  # --- SurchargeIndex ---
  - { method: POST, path: "/surcharge-indices", description: "Publish a monthly alloy surcharge index", roles: [PlantManager], code: 201, input: [alloy_spec_id, effective_month, surcharge_cents_per_ton, energy_pct], output: SurchargeIndex, side_effects: ["ERR_DUPLICATE_SURCHARGE_INDEX"] }
  - { method: GET, path: "/surcharge-indices", description: "List surcharge indices", roles: *ALL_ROLES, code: 200, input: ["alloy_spec_id?", "effective_month?", "limit?", "offset?"], output: "SurchargeIndex[]", side_effects: [] }
  - { method: GET, path: "/surcharge-indices/{id}", description: "Get one surcharge index", roles: *ALL_ROLES, code: 200, input: [], output: SurchargeIndex, side_effects: [] }

  # --- Invoice ---
  - { method: POST, path: "/work-orders/{id}/invoices", description: "Create the PROVISIONAL invoice for an order. OCC on WorkOrder.version. Pins the surcharge index for (order alloy, logical-clock month).", roles: [SalesPlanner], code: 201, input: [expected_work_order_version], output: Invoice, side_effects: ["invoice_price PROVISIONAL variant computed; surcharge_index_id pinned; increments WorkOrder.version by 1; ERR_INVOICE_EXISTS; ERR_SURCHARGE_INDEX_MISSING"] }
  - { method: GET, path: "/invoices", description: "List invoices", roles: *ALL_ROLES, code: 200, input: ["work_order_id?", "surcharge_index_id?", "status?", "limit?", "offset?"], output: "Invoice[]", side_effects: [] }
  - { method: GET, path: "/invoices/{id}", description: "Get one invoice", roles: *ALL_ROLES, code: 200, input: [], output: Invoice, side_effects: [] }
  - { method: POST, path: "/invoices/{id}/finalize", description: "Finalize a provisional invoice (PROVISIONAL -> FINAL) using actual shipped weight; pinned index retained", roles: [SalesPlanner], code: 200, input: [], output: Invoice, side_effects: ["invoice_price FINAL variant computed; ERR_ORDER_NOT_CERTIFIED; ERR_ORDER_NOT_FULLY_SHIPPED"] }
  - { method: POST, path: "/invoices/{id}/void", description: "Void a provisional invoice (PROVISIONAL -> VOID)", roles: [SalesPlanner], code: 200, input: [], output: Invoice, side_effects: [] }
  - { method: POST, path: "/invoices/{id}/mark-paid", description: "Mark a final invoice paid (FINAL -> PAID); order -> CLOSED", roles: [SalesPlanner], code: 200, input: [], output: Invoice, side_effects: ["WorkOrder CERTIFIED -> CLOSED"] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing/empty" }
  - { id: ERR_FORBIDDEN_FOR_ROLE, http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, invalid enum value, or malformed body" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path or body-referenced resource id does not exist" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_work_order_version != current WorkOrder.version (OCC)" }
  - { id: ERR_INVALID_STATE_TRANSITION, http: 409, condition: "Resource not in a valid source state for the requested transition" }
  - { id: ERR_CHARGE_NOT_READY, http: 409, condition: "Forge heat recorded against a charge not in READY status" }
  - { id: ERR_PART_NOT_INSPECTED, http: 409, condition: "Ship requested for a part not in INSPECTED status" }
  - { id: ERR_RUN_NO_HEATS, http: 409, condition: "finish-forging requested on a run with zero recorded heats" }
  - { id: ERR_RUN_HAS_HEATS, http: 409, condition: "Cancel requested on a run/order that already has recorded heats" }
  - { id: ERR_TRIM_PENDING, http: 409, condition: "Run completion requested while PartSerials remain in FORGED status" }
  - { id: ERR_TEMP_OUTSIDE_FORGE_WINDOW, http: 422, condition: "target_temp_f outside the alloy's [forge_temp_min_f, forge_temp_max_f] window" }
  - { id: ERR_REHEAT_LIMIT_EXCEEDED, http: 409, condition: "Charging would push a billet beyond alloy.reheat_limit + 1 total charges" }
  - { id: ERR_CHEMISTRY_OUT_OF_SPEC, http: 422, condition: "verify-cert chemistry exceeds alloy carbon/manganese maxima" }
  - { id: ERR_DIE_WORN, http: 409, condition: "Forge heat recorded while the run's die set is WORN" }
  - { id: ERR_TRIM_MASS_IMBALANCE, http: 422, condition: "flash_scrap_lbs < 0, or gross exceeds the run's unallocated input weight" }
  - { id: ERR_PART_COUNT_MISMATCH, http: 422, condition: "parts_good + parts_scrapped != number of billet_ids on a forge heat" }
  - { id: ERR_GRAIN_FLOW_BELOW_SPEC, http: 422, condition: "grain_flow_rating below alloy minimum, or macro_etch FAIL when required" }
  - { id: ERR_HEAT_NOT_CERTIFIED, http: 409, condition: "Cut/charge attempted against a heat still in RECEIVED" }
  - { id: ERR_HEAT_QUARANTINED, http: 409, condition: "Charge attempted with billets of a QUARANTINED heat" }
  - { id: ERR_BILLET_NOT_IN_CHARGE, http: 409, condition: "Heat-record billet not CHARGED in the referenced furnace charge" }
  - { id: ERR_DIE_NOT_INSTALLED, http: 409, condition: "Run start requires the die set INSTALLED on the run's work center" }
  - { id: ERR_ORDER_HAS_PROGRESS, http: 409, condition: "Work-order cancel blocked: heats already recorded" }
  - { id: ERR_SAMPLE_NOT_FROM_HEAT, http: 409, condition: "Cert sample part's mill_heat_id != cert's mill_heat_id" }
  - { id: ERR_HEAT_NOT_IN_ORDER, http: 409, condition: "Manual cert creation for a heat with no parts in this order" }
  - { id: ERR_FURNACE_WINDOW_OVERLAP, http: 409, condition: "Charge window [planned_load_start, planned_unload) overlaps another non-terminal charge on the furnace" }
  - { id: ERR_WORKCENTER_WINDOW_OVERLAP, http: 409, condition: "Run window violates the 30-minute turnaround gap on the work center" }
  - { id: ERR_SOAK_TIME_NOT_ELAPSED, http: 409, condition: "mark-ready before closed_at + soak_minutes" }
  - { id: ERR_DUPLICATE_HEAT_NUMBER, http: 409, condition: "heat_number already registered" }
  - { id: ERR_DUPLICATE_ALLOY_GRADE, http: 409, condition: "grade_code already registered" }
  - { id: ERR_DUPLICATE_SURCHARGE_INDEX, http: 409, condition: "index already exists for (alloy_spec_id, effective_month)" }
  - { id: ERR_CERT_EXISTS, http: 409, condition: "A QualityCert already exists for (work_order_id, mill_heat_id)" }
  - { id: ERR_INVOICE_EXISTS, http: 409, condition: "A non-VOID invoice already exists for the work order" }
  - { id: ERR_TRIM_TICKET_ACTIVE_EXISTS, http: 409, condition: "Run already has a trim ticket in DRAFT or FLAGGED" }
  - { id: ERR_WORKCENTER_HAS_DIE, http: 409, condition: "Install blocked: another die set already INSTALLED on the work center" }
  - { id: ERR_FURNACE_CAPACITY_EXCEEDED, http: 409, condition: "charge_weight_lbs would exceed furnace.capacity_lbs" }
  - { id: ERR_FURNACE_DOWN, http: 409, condition: "Charge creation against a DOWN furnace" }
  - { id: ERR_WORKCENTER_DOWN, http: 409, condition: "Run create/start or die install against a DOWN work center" }
  - { id: ERR_PROCESS_TYPE_MISMATCH, http: 409, condition: "Work center type != work order required_process" }
  - { id: ERR_WORKCENTER_TONNAGE_INSUFFICIENT, http: 422, condition: "rated_tonnage < work order required_tonnage" }
  - { id: ERR_NO_WORKCENTER_AVAILABLE, http: 409, condition: "Auto-select found no eligible work center (empty candidate pool)" }
  - { id: ERR_ALLOY_MISMATCH, http: 409, condition: "Forge heat's charge alloy != work order alloy" }
  - { id: ERR_BILLET_UNDERWEIGHT, http: 422, condition: "billet_weight_lbs < part_net_weight_lbs * (1 + flash_allowance_pct/100)" }
  - { id: ERR_DIE_IN_USE, http: 409, condition: "Uninstall blocked: an IN_PROGRESS or FORGED run references the die set" }
  - { id: ERR_DIE_RESINK_LIMIT, http: 409, condition: "start-resink when resink_count >= max_resinks" }
  - { id: ERR_CERT_SOD_VIOLATION, http: 403, condition: "Certifier/rejecter equals the cert submitter or the forge-run operator of record" }
  - { id: ERR_ORDER_NOT_CERTIFIED, http: 409, condition: "Invoice finalize while work order is not CERTIFIED" }
  - { id: ERR_ORDER_NOT_FULLY_SHIPPED, http: 409, condition: "Invoice finalize while non-scrapped parts remain unshipped" }
  - { id: ERR_SURCHARGE_INDEX_MISSING, http: 422, condition: "No surcharge index for (order alloy, logical-clock month) at provisional creation" }
  - { id: ERR_INSUFFICIENT_HEAT_WEIGHT, http: 409, condition: "Cut lines' total weight exceeds the heat's remaining_weight_lbs" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlantManager
    description: "Plant administration: owns configuration entities (alloy specs, furnaces, work centers, surcharge indices), mill-heat registration, and the logical clock. No shop-floor execution rights."
    identity: opaque
    exclusive_operations: ["POST /alloy-specs", "POST /mill-heats", "POST /furnaces", "POST /furnaces/{id}/set-status", "POST /work-centers", "POST /work-centers/{id}/set-status", "POST /surcharge-indices", "POST /_clock/set_current_utc"]
    shared_operations: ["all GET endpoints"]
  - name: SawOperator
    description: "Saw operator: cuts billets from certified heats and scraps unforged billets."
    identity: opaque
    exclusive_operations: ["POST /mill-heats/{id}/billets", "POST /billets/{id}/scrap"]
    shared_operations: ["all GET endpoints"]
  - name: FurnaceOperator
    description: "Furnace operator: builds charges, manages soak/discharge/abort."
    identity: opaque
    exclusive_operations: ["POST /furnace-charges", "POST /furnace-charges/{id}/close-loading", "POST /furnace-charges/{id}/mark-ready", "POST /furnace-charges/{id}/discharge", "POST /furnace-charges/{id}/abort"]
    shared_operations: ["all GET endpoints"]
  - name: ForgeOperator
    description: "Forge operator: schedules and executes forge runs, records heats, opens/records/voids trim tickets. Becomes operator_id of record on started runs (SoD anchor)."
    identity: opaque
    exclusive_operations: ["POST /forge-runs", "POST /forge-runs/{id}/start", "POST /forge-runs/{id}/heats", "POST /forge-runs/{id}/finish-forging", "POST /forge-runs/{id}/reopen", "POST /forge-runs/{id}/complete", "POST /forge-runs/{id}/cancel", "POST /forge-runs/{id}/trim-tickets", "POST /trim-tickets/{id}/record", "POST /trim-tickets/{id}/void"]
    shared_operations: ["all GET endpoints"]
  - name: DieShopTechnician
    description: "Die shop: registers die sets, installs/uninstalls, resinks, retires."
    identity: opaque
    exclusive_operations: ["POST /die-sets", "POST /die-sets/{id}/install", "POST /die-sets/{id}/uninstall", "POST /die-sets/{id}/start-resink", "POST /die-sets/{id}/complete-resink", "POST /die-sets/{id}/retire"]
    shared_operations: ["all GET endpoints"]
  - name: QualityEngineer
    description: "Quality: verifies mill certs, quarantines/releases/rejects heats, approves trim deviations, submits/certifies/rejects grain-flow certs, inspects/scraps parts. Segregation of duties: cannot certify or reject own submissions, cannot certify runs they operated."
    identity: opaque
    exclusive_operations: ["POST /mill-heats/{id}/verify-cert", "POST /mill-heats/{id}/quarantine", "POST /mill-heats/{id}/release-quarantine", "POST /mill-heats/{id}/reject", "POST /trim-tickets/{id}/approve-deviation", "POST /work-orders/{id}/quality-certs", "POST /quality-certs/{id}/submit", "POST /quality-certs/{id}/certify", "POST /quality-certs/{id}/reject", "POST /part-serials/{id}/inspect", "POST /part-serials/{id}/scrap"]
    shared_operations: ["all GET endpoints"]
  - name: SalesPlanner
    description: "Sales/planning: releases and cancels work orders, ships parts, owns the invoice lifecycle."
    identity: opaque
    exclusive_operations: ["POST /work-orders", "POST /work-orders/{id}/cancel", "POST /work-orders/{id}/ship", "POST /work-orders/{id}/invoices", "POST /invoices/{id}/finalize", "POST /invoices/{id}/void", "POST /invoices/{id}/mark-paid"]
    shared_operations: ["all GET endpoints"]
