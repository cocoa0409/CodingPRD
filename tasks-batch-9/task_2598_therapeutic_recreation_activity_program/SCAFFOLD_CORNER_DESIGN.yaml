  - section: endpoints
    instances:
      - name: resident_patch_updates_fields_and_bumps_version
        claim_type: standard_crud
        grounds:
          - endpoints.PATCH_/recreation/residents/{resident_id}
          - entities.Resident.fields.version
        distinguishing_aspect: "The census PATCH is a narrow whitelist: full_name and room_number change and version goes 1 -> 2, while every clinical mirror (supervision_tier, engagement_index, refusal_streak) and the gate fields are left exactly as the assessment left them."
        test_recipe:
          setup:
            - "one ADMITTED resident assessed MODERATE_IMPAIRMENT / ASSIST_1, so supervision_tier is TIER_2 and version is 2 after the assessment"
          setup_api_calls:
            - call: "POST /recreation/residents"
              payload: { full_name: "Patch Petra", room_number: "601A", admission_date: "2026-07-31" }
              as: ActivityDirector
              captures: { res_id: $.data.id }
            - call: "POST /recreation/residents/${res_id}/assessments"
              payload: { cognitive_level: "MODERATE_IMPAIRMENT", functional_mobility: "ASSIST_1", interest_domains: ["CREATIVE"], preferred_group_size: "SMALL", effective_date: "2026-07-31" }
              as: RecreationTherapist
            - call: "GET /recreation/residents/${res_id}"
              as: ActivityDirector
              captures: { ver_before: $.data.version }
          trigger:
            - call: "PATCH /recreation/residents/${res_id}"
              payload: { full_name: "Patch Petra Novak", room_number: "601B" }
              as: ActivityDirector
          assert:
            - "the response status is 200"
            - "${ver_before} == 2, the assessment having already bumped the resident once"
            - "Resident.${res_id}.full_name == \"Patch Petra Novak\" and Resident.${res_id}.room_number == \"601B\""
            - "Resident.${res_id}.version == 3"
            - "Resident.${res_id}.supervision_tier == TIER_2, Resident.${res_id}.status == ADMITTED, engagement_index == 0.0, refusal_streak == 0, enrollment_gate == NONE"
            - "GET /recreation/residents/${res_id} returns exactly those stored values"
      - name: outing_finalize_conditional_action_rejected
        claim_type: conditional_action
        grounds:
          - endpoints.POST_/recreation/outings/{outing_id}/logistics
          - validations.priority_35_ERR_SUPERVISION_RATIO_UNMET
          - calculations.outing_supervision_requirement
        distinguishing_aspect: "FINALIZE is allowed only while escort_count >= required_escorts: with one TIER_3 rider the outing needs 2 escorts, so FINALIZE at escort_count 1 fails, and the very same call succeeds after SET_ESCORTS raises the count to 2."
        test_recipe:
          setup:
            - "one ADMITTED resident assessed SEVERE_IMPAIRMENT / INDEPENDENT, so supervision_tier is TIER_3 and required_escorts will clamp to 2"
            - "one outing on a vehicle with 8 ambulatory seats, escort_count 1, whose single consent is GRANTED with no expires_on so consent_status is CONSENT_COMPLETE"
            - "the outing is booked, so logistics_status is TRANSPORT_BOOKED"
          setup_api_calls:
            - call: "POST /recreation/residents"
              payload: { full_name: "Escort Ernest", room_number: "602A", admission_date: "2026-07-31" }
              as: ActivityDirector
              captures: { res_id: $.data.id }
            - call: "POST /recreation/residents/${res_id}/assessments"
              payload: { cognitive_level: "SEVERE_IMPAIRMENT", functional_mobility: "INDEPENDENT", interest_domains: ["SOCIAL"], preferred_group_size: "ONE_TO_ONE", effective_date: "2026-07-31" }
              as: RecreationTherapist
            - call: "POST /recreation/programs"
              payload: { name: "Escort Outing Program", domain: "SOCIAL", staffing_ratio_denominator: 4, max_group_size: 8, max_supervision_tier: "TIER_3" }
              as: ActivityDirector
              captures: { prog_id: $.data.id }
            - call: "POST /recreation/vehicles"
              payload: { label: "Van 18", ambulatory_seats: 8, wheelchair_stations: 2, turnaround_minutes: 30 }
              as: ActivityDirector
              captures: { veh_id: $.data.id }
            - call: "POST /recreation/outings"
              payload: { program_id: "${prog_id}", vehicle_id: "${veh_id}", destination: "Lighthouse", departure_at: "2026-09-09T09:00:00Z", return_at: "2026-09-09T13:00:00Z", escort_count: 1 }
              as: ActivityDirector
              captures: { outing_id: $.data.id }
            - call: "POST /recreation/outings/${outing_id}/consents"
              payload: { resident_id: "${res_id}", responsible_party_name: "Ernest Family", responsible_party_relation: "POA" }
              as: ActivityDirector
              captures: { consent_id: $.data.id }
            - call: "POST /recreation/outings/${outing_id}/consents/${consent_id}/decision"
              payload: { decision: "GRANTED" }
              as: ActivityDirector
            - call: "GET /recreation/vehicles/${veh_id}"
              as: ActivityDirector
              captures: { veh_ver: $.data.version }
            - call: "POST /recreation/outings/${outing_id}/transport-booking"
              payload: { expected_vehicle_version: "${veh_ver}" }
              as: ActivityDirector
          trigger:
            - call: "POST /recreation/outings/${outing_id}/logistics"
              payload: { action: "FINALIZE" }
              as: ActivityDirector
              captures: { err_id: $.data.error_id }
            - call: "POST /recreation/outings/${outing_id}/logistics"
              payload: { action: "SET_ESCORTS", escort_count: 2 }
              as: ActivityDirector
            - call: "POST /recreation/outings/${outing_id}/logistics"
              payload: { action: "FINALIZE" }
              as: ActivityDirector
          assert:
            - "the first FINALIZE returns 409 and ${err_id} == \"ERR_SUPERVISION_RATIO_UNMET\""
            - "after the refusal Outing.${outing_id}.logistics_status == TRANSPORT_BOOKED and consent_status == CONSENT_COMPLETE"
            - "Outing.${outing_id}.required_escorts == 2 and OutingConsent.${consent_id}.effective == true"
            - "after SET_ESCORTS, Outing.${outing_id}.escort_count == 2 and Outing.${outing_id}.ambulatory_seats_required == 3"
            - "the second FINALIZE returns 200 and Outing.${outing_id}.logistics_status == READY"
      - name: volunteer_assignment_link_requires_both_rows_not_found
        claim_type: cross_reference_link
        grounds:
          - endpoints.POST_/recreation/volunteer-assignments
          - validations.priority_6_ERR_PROGRAM_NOT_FOUND
        distinguishing_aspect: "Body FKs are resolved in the declared input order volunteer_id then session_id, so a bogus volunteer with a real session returns ERR_VOLUNTEER_NOT_FOUND while a real volunteer with a bogus session returns ERR_SESSION_NOT_FOUND; only when both rows exist is the association created."
        test_recipe:
          setup:
            - "one CLEARED volunteer with screening_level FULL and one SCHEDULED session of a volunteer_eligible program"
          setup_api_calls:
            - call: "POST /recreation/programs"
              payload: { name: "Link Program", domain: "CREATIVE", staffing_ratio_denominator: 4, max_group_size: 10, max_supervision_tier: "TIER_2", volunteer_eligible: true, required_screening_level: "BASIC" }
              as: ActivityDirector
              captures: { prog_id: $.data.id }
            - call: "POST /recreation/rooms"
              payload: { name: "Link Room", capacity: 10, buffer_minutes: 0 }
              as: ActivityDirector
              captures: { room_id: $.data.id }
            - call: "POST /recreation/sessions"
              payload: { program_id: "${prog_id}", room_id: "${room_id}", starts_at: "2026-09-10T10:00:00Z", ends_at: "2026-09-10T11:00:00Z", assigned_staff_count: 2 }
              as: ActivityDirector
              captures: { sess_id: $.data.id }
            - call: "POST /recreation/volunteers"
              payload: { full_name: "Linked Lena", volunteer_type: "ADULT_COMMUNITY" }
              as: VolunteerCoordinator
              captures: { vol_id: $.data.id }
            - call: "POST /recreation/volunteers/${vol_id}/screening"
              payload: { event_type: "BACKGROUND_CHECK_CLEARED", cleared_on: "2026-07-04" }
              as: VolunteerCoordinator
            - call: "POST /recreation/volunteers/${vol_id}/screening"
              payload: { event_type: "ORIENTATION_COMPLETED", completed_on: "2026-07-08" }
              as: VolunteerCoordinator
          trigger:
            - call: "POST /recreation/volunteer-assignments"
              payload: { volunteer_id: "00000000-0000-4000-8000-000000000111", session_id: "${sess_id}", role_type: "GROUP_ASSISTANT" }
              as: VolunteerCoordinator
              captures: { vol_err_id: $.data.error_id }
            - call: "POST /recreation/volunteer-assignments"
              payload: { volunteer_id: "${vol_id}", session_id: "00000000-0000-4000-8000-000000000222", role_type: "GROUP_ASSISTANT" }
              as: VolunteerCoordinator
              captures: { sess_err_id: $.data.error_id }
            - call: "POST /recreation/volunteer-assignments"
              payload: { volunteer_id: "${vol_id}", session_id: "${sess_id}", role_type: "GROUP_ASSISTANT" }
              as: VolunteerCoordinator
              captures: { asg_id: $.data.id }
          assert:
            - "the bogus-volunteer call returns 404 and ${vol_err_id} == \"ERR_VOLUNTEER_NOT_FOUND\""
            - "the bogus-session call returns 404 and ${sess_err_id} == \"ERR_SESSION_NOT_FOUND\""
            - "the fully valid call returns 201, VolunteerAssignment.${asg_id}.status == PROPOSED and hours == 1.0"
            - "GET /recreation/volunteer-assignments?session_id=${sess_id} returns total_count 1"
      - name: session_status_cancel_reason_contract_returns_4XX
        claim_type: action_endpoint
        grounds:
          - endpoints.POST_/recreation/sessions/{session_id}/status
          - validations.priority_8_ERR_INVALID_REQUEST
        distinguishing_aspect: "cancel_reason is conditionally required by action: CANCEL without it is a 400 ERR_INVALID_REQUEST, START with it is also a 400, and only the correctly paired CANCEL plus cancel_reason moves the session."
        test_recipe:
          setup:
            - "one SCHEDULED session with the clock left at its 2026-08-01T00:00:00Z default"
          setup_api_calls:
            - call: "POST /recreation/programs"
              payload: { name: "Contract Program", domain: "PHYSICAL", staffing_ratio_denominator: 4, max_group_size: 10, max_supervision_tier: "TIER_3" }
              as: ActivityDirector
              captures: { prog_id: $.data.id }
            - call: "POST /recreation/rooms"
              payload: { name: "Contract Room", capacity: 10, buffer_minutes: 0 }
              as: ActivityDirector
              captures: { room_id: $.data.id }
            - call: "POST /recreation/sessions"
              payload: { program_id: "${prog_id}", room_id: "${room_id}", starts_at: "2026-09-11T10:00:00Z", ends_at: "2026-09-11T11:00:00Z", assigned_staff_count: 2 }
              as: ActivityDirector
              captures: { sess_id: $.data.id }
          trigger:
            - call: "POST /recreation/sessions/${sess_id}/status"
              payload: { action: "CANCEL" }
              as: ActivityDirector
              captures: { missing_reason_err_id: $.data.error_id }
            - call: "POST /recreation/sessions/${sess_id}/status"
              payload: { action: "START", cancel_reason: "Not applicable" }
              as: ActivityAide
              captures: { extra_reason_err_id: $.data.error_id }
            - call: "POST /recreation/sessions/${sess_id}/status"
              payload: { action: "CANCEL", cancel_reason: "Van unavailable" }
              as: ActivityDirector
          assert:
            - "the reason-less CANCEL returns 400 and ${missing_reason_err_id} == \"ERR_INVALID_REQUEST\""
            - "the START carrying cancel_reason returns 400 and ${extra_reason_err_id} == \"ERR_INVALID_REQUEST\""
            - "${extra_reason_err_id} != \"ERR_SESSION_HAS_NO_ENROLLMENTS\", the schema rule at priority 8 outranking every business rule"
            - "the correctly paired CANCEL returns 200, ActivitySession.${sess_id}.status == CANCELLED and cancel_reason == \"Van unavailable\""
      - name: survey_packet_computed_read_matches_calculation
        claim_type: computed_read
        grounds:
          - endpoints.GET_/recreation/survey-packets/{packet_id}
        excluded_because:
