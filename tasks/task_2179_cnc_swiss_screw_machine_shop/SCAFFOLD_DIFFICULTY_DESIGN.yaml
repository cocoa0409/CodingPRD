      On the QUALITY entity domain (SpcSample/Characteristic), the same ten readings score 1.385 and 1.615 under the range/d2 short-term variant but 1.917 under the n-1 pooled long-term variant, because within-subgroup range estimates a different sigma than the pooled standard deviation.
