            - "RECONCILED drops of 10000 gal (delivered 2026-03-02) and 9000 gal (delivered 2026-03-05) -> fulfilled 19000"
            - "Both invoices voided so no OVERDUE blocks renewal; clock advanced to 2026-06-01 (inside renewal window opened 2026-05-02)"
