            - "${cont_status} == STAGED with qualifies == true and placard_id == null — qualifying does not advance the container"
            - "${ship_status} == SCHEDULED with deposited_at_utc == null and cancel_reason == null"
            - "Every one of the seven rows has version == 1"

      - name: valid_transition_client_suspend_then_reactivate_clears_reason
        claim_type: valid_transition
        grounds:
          - state_machines.Client.ACTIVE_to_SUSPENDED
          - state_machines.Client.SUSPENDED_to_ACTIVE
          - entities.Client.fields.suspension_reason
          - endpoints[POST /clients/{id}/status]
        distinguishing_aspect: "The Client machine is two-way and has no terminal state, so the edge pair must be reusable: reactivation must CLEAR suspension_reason to null rather than leave the stale text behind, and a second suspension must stamp the NEW reason over that null. Each accepted transition bumps version by exactly one, so a cycle of three writes lands on version 4."
        test_recipe:
          setup:
            - "One ACTIVE client with version 1 and suspension_reason null."
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Toggle Mail Co", client_code: "TOGGLE", service_fee_rate_per_thousand_cents: 1000 }
              as: BureauAdmin
              captures: { cl_id: $.data.id }
          trigger:
            - call: "POST /clients/${cl_id}/status"
              payload: { status: "SUSPENDED", reason: "unpaid service fees" }
              as: BureauAdmin
              captures: { s1: $.data.status, r1: $.data.suspension_reason, v1: $.data.version }
            - call: "POST /clients/${cl_id}/status"
              payload: { status: "ACTIVE" }
              as: BureauAdmin
              captures: { s2: $.data.status, r2: $.data.suspension_reason, v2: $.data.version }
            - call: "POST /clients/${cl_id}/status"
              payload: { status: "SUSPENDED", reason: "returned statement rework" }
              as: BureauAdmin
              captures: { s3: $.data.status, r3: $.data.suspension_reason, v3: $.data.version }
          assert:
            - "First call: ${s1} == SUSPENDED, ${r1} == 'unpaid service fees', ${v1} == 2"
            - "Second call: ${s2} == ACTIVE and ${r2} == null — the reason is cleared on the reverse edge, not retained"
            - "Third call: ${s3} == SUSPENDED and ${r3} == 'returned statement rework' — the edge is reusable and the new reason replaces the null"
            - "${v1} == 2, ${v2} == 3, ${v3} == 4: exactly one version bump per accepted transition"

      - name: shipment_becomes_no_show_when_clock_passes_window_end
        claim_type: valid_transition
        grounds:
          - state_machines.DropShipment.SCHEDULED_to_NO_SHOW
          - endpoints[POST /_clock/set_current_utc]
          - validations[priority=14]
        distinguishing_aspect: "This is the scaffold's only clock-driven system transition: advancing the logical clock strictly past window_end_utc must sweep SCHEDULED shipments to the terminal NO_SHOW state and report their ids in the clock response. A shipment whose window has not yet ended must NOT be swept, and one whose window_end_utc equals the clock exactly must not be swept either because the comparison is strictly after."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-10T09:00:00.000Z, one OPEN facility and two empty OPEN batches."
            - "Shipment EARLY books [2026-08-12T08:00:00.000Z, 2026-08-12T12:00:00.000Z) and shipment LATE books [2026-08-12T08:00:00.000Z, 2026-08-12T20:00:00.000Z), both SCHEDULED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00.000Z" }
              as: BureauAdmin
            - call: "POST /entry-facilities"
              payload: { facility_code: "SCF-021", facility_type: "SCF", zip3: "021", dock_capacity_pallets_per_slot: 12, drop_ship_discount_bp: 300, served_zip3_list: ["021", "022"] }
              as: BureauAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /commingle-batches"
              payload: { mail_class: "MARKETING_MAIL", processing_category: "LETTERS", entry_facility_id: "${fac_id}" }
              as: PresortOperator
              captures: { batch_1_id: $.data.id }
            - call: "POST /commingle-batches"
              payload: { mail_class: "MARKETING_MAIL", processing_category: "LETTERS", entry_facility_id: "${fac_id}" }
              as: PresortOperator
              captures: { batch_2_id: $.data.id }
            - call: "POST /drop-shipments"
              payload: { commingle_batch_id: "${batch_1_id}", entry_facility_id: "${fac_id}", window_start_utc: "2026-08-12T08:00:00.000Z", window_end_utc: "2026-08-12T12:00:00.000Z", pallet_count: 2 }
              as: PresortOperator
              captures: { ship_early_id: $.data.id }
            - call: "POST /drop-shipments"
              payload: { commingle_batch_id: "${batch_2_id}", entry_facility_id: "${fac_id}", window_start_utc: "2026-08-12T08:00:00.000Z", window_end_utc: "2026-08-12T20:00:00.000Z", pallet_count: 2 }
              as: PresortOperator
              captures: { ship_late_id: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-12T12:00:00.000Z" }
              as: BureauAdmin
              captures: { swept_at_boundary: $.data.no_show_shipment_ids }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-12T12:00:00.001Z" }
              as: BureauAdmin
              captures: { swept_past_boundary: $.data.no_show_shipment_ids }
            - call: "POST /drop-shipments/${ship_early_id}/depart"
              payload: {}
              as: PresortOperator
              captures: { err_id: $.data.error_id }
          assert:
            - "Clock at exactly 2026-08-12T12:00:00.000Z: ${swept_at_boundary} is an empty list and DropShipment.${ship_early_id}.status is still SCHEDULED — the sweep fires only STRICTLY after window_end_utc"
            - "Clock one millisecond later: ${swept_past_boundary} contains exactly ${ship_early_id} and DropShipment.${ship_early_id}.status == NO_SHOW"
            - "DropShipment.${ship_late_id}.status is still SCHEDULED: its window ends at 20:00 and the clock has not passed it"
            - "Departing the swept shipment: HTTP 409 with ${err_id} == ERR_INVALID_SHIPMENT_STATE, since NO_SHOW is a terminal state"

      - name: invalid_transitions_cancel_a_pooled_mail_job_is_rejected
        claim_type: invalid_transitions
        grounds:
          - state_machines.MailJob.RECEIVED_to_CANCELLED
          - state_machines.MailJob.HYGIENE_CLEARED_to_CANCELLED
