              as: InboundCoordinator
            - call: "POST /sortation/trailer-appointments"
              payload: { sort_center_id: "${center_id}", door_id: "${door_in_id}", trailer_code: "T-IN-2", window_start: "2026-08-03T07:15:00Z", window_end: "2026-08-03T08:15:00Z", priority_class: "STANDARD", manifest_package_count: 500 }
              as: InboundCoordinator
              captures: { appt2_id: $.data.id }
            - call: "POST /sortation/trailer-appointments/${appt2_id}/arrive"
              payload: {}
              as: InboundCoordinator
            - call: "POST /sortation/trailer-appointments/${appt2_id}/start-unload"
              payload: {}
              as: InboundCoordinator
            - call: "POST /sortation/trailer-appointments/${appt2_id}/jam-hold"
              payload: { chute_id: "${chute1_id}", jam_reason: "SECONDARY_CHUTE_JAM" }
              as: InboundCoordinator
            - call: "POST /sortation/package-exceptions"
              payload: { sort_center_id: "${center_id}", exception_type: "MISSORT", package_count: 40 }
              as: SortSupervisor
              captures: { exc_id: $.data.id }
          trigger:
            - call: "POST /sortation/package-exceptions/${exc_id}/resolve"
              payload: { resolution: "REROUTE", to_destination_lane_id: "${lane2_id}" }
              as: SortSupervisor
            - call: "POST /sortation/trailer-appointments/${appt2_id}/resume-unload"
              payload: { chute_id: "${chute1_id}" }
              as: InboundCoordinator
            - call: "POST /sortation/package-exceptions/${exc_id}/resolve"
              payload: { resolution: "REROUTE", to_destination_lane_id: "${lane2_id}" }
              as: SortSupervisor
          assert:
            - "before the trigger SortChute.${chute1_id}.status == CONGESTED, ChuteAssignment.${ca2_id}.status == SUSPENDED, SortCenter.${center_id}.ops_posture == RESTRICTED (not FROZEN, so validation 22 does not fire)"
            - "the first resolve returns ERR_NO_ELIGIBLE_CHUTE with HTTP 422 (the lane has assignment rows, so ERR_LANE_NOT_ASSIGNED_TO_CHUTE at priority 34 is NOT returned)"
            - "after the refused resolve PackageException.${exc_id}.status is still OPEN and SortCenter.${center_id}.exception_hold_count is still 40"
            - "the resume-unload flips SortChute.${chute1_id}.status to ACTIVE and both ChuteAssignment.${ca1_id} and ChuteAssignment.${ca2_id} back to ACTIVE with suspended_reason == null"
            - "the second resolve returns HTTP 200 with PackageException.${exc_id}.status == RESOLVED, resolution == REROUTE and resolved_via_chute_id == ${chute1_id}"
            - "SortCenter.${center_id}.exception_hold_count == 0, missort_corrected_count == 40 and DestinationLane.${lane2_id}.sorted_package_count == 40"

  # =====================================================================
  # Rule 8 - resource/temporal overlap with different interval semantics
  # =====================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: dock_door_buffered_intervals_treat_adjacency_as_conflict
        grounds:
          - calculations.door_interval_conflict
          - validations.27_ERR_DOOR_WINDOW_CONFLICT
          - entities.DockDoor
          - entities.TrailerAppointment.fields.window_start
        distinguishing_aspect: |
          Contended resource: DockDoor. Interval semantics: base windows are half-open but the door's
          turnaround_buffer_min inflates them on BOTH sides, so exact adjacency on either side is a
          conflict and only one appointment may hold the door at a time; the occupancy set is also
          status-scoped, so an UNLOADED appointment releases the door and the previously refused window
          becomes bookable.
        test_recipe:
          setup:
            - "Center SC1 with inbound door IN-1 using the default turnaround_buffer_min 15"
            - "Appointment T-A booked on IN-1 for 06:00-07:00 (status SCHEDULED)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T06:00:00Z" }
              as: FacilityAdmin
            - call: "POST /sortation/sort-centers"
              payload: { code: "SC1", name: "Memphis Sort 1", automation_utilization_pct: 70, flex_pool_total: 20 }
              as: FacilityAdmin
              captures: { center_id: $.data.id }
            - call: "POST /sortation/sort-centers/${center_id}/dock-doors"
              payload: { door_number: "IN-1", kind: "INBOUND" }
              as: FacilityAdmin
              captures: { door_in_id: $.data.id }
            - call: "POST /sortation/trailer-appointments"
              payload: { sort_center_id: "${center_id}", door_id: "${door_in_id}", trailer_code: "T-A", window_start: "2026-08-03T06:00:00Z", window_end: "2026-08-03T07:00:00Z", priority_class: "STANDARD", manifest_package_count: 1200 }
              as: InboundCoordinator
              captures: { appt_a_id: $.data.id }
          trigger:
            - call: "POST /sortation/trailer-appointments"
              payload: { sort_center_id: "${center_id}", door_id: "${door_in_id}", trailer_code: "T-B", window_start: "2026-08-03T07:00:00Z", window_end: "2026-08-03T08:00:00Z", priority_class: "STANDARD", manifest_package_count: 800 }
              as: InboundCoordinator
            - call: "POST /sortation/trailer-appointments"
              payload: { sort_center_id: "${center_id}", door_id: "${door_in_id}", trailer_code: "T-C", window_start: "2026-08-03T05:00:00Z", window_end: "2026-08-03T06:00:00Z", priority_class: "STANDARD", manifest_package_count: 800 }
              as: InboundCoordinator
            - call: "POST /sortation/trailer-appointments/${appt_a_id}/arrive"
              payload: {}
              as: InboundCoordinator
            - call: "POST /sortation/trailer-appointments/${appt_a_id}/start-unload"
              payload: {}
              as: InboundCoordinator
            - call: "POST /sortation/trailer-appointments/${appt_a_id}/complete-unload"
              payload: {}
              as: InboundCoordinator
            - call: "POST /sortation/trailer-appointments"
              payload: { sort_center_id: "${center_id}", door_id: "${door_in_id}", trailer_code: "T-B", window_start: "2026-08-03T07:00:00Z", window_end: "2026-08-03T08:00:00Z", priority_class: "STANDARD", manifest_package_count: 800 }
              as: InboundCoordinator
          assert:
            - "T-B at 07:00-08:00 (starting exactly when T-A ends) returns ERR_DOOR_WINDOW_CONFLICT with HTTP 409 - buffered adjacency IS an overlap on this resource"
            - "T-C at 05:00-06:00 (ending exactly when T-A starts) also returns ERR_DOOR_WINDOW_CONFLICT with HTTP 409 - the buffer is symmetric"
            - "after T-A reaches UNLOADED the identical T-B create returns HTTP 201 with status SCHEDULED, because only SCHEDULED, ARRIVED, UNLOADING and JAM_HELD rows occupy a door"
            - "TrailerAppointment.${appt_a_id}.status == UNLOADED and SortCenter.${center_id}.wip_package_count == 1200"
            - "exactly two appointments exist on ${door_in_id} at the end (T-A UNLOADED and T-B SCHEDULED); T-C was never created"

      - name: chute_half_open_intervals_allow_two_concurrent_destinations
        grounds:
          - calculations.chute_concurrency_capacity
          - validations.28_ERR_CHUTE_CONCURRENCY_EXCEEDED
          - entities.SortChute.fields.max_concurrent_destinations
          - entities.ChuteAssignment.fields.window_end
        distinguishing_aspect: |
          A different resource entity (SortChute) with deliberately different interval semantics from
          the door: half-open windows with NO buffer and an AGGREGATE capacity of
          max_concurrent_destinations, so two overlapping destinations are legal and only the third
          simultaneous one is refused, and adjacency at a shared endpoint never counts as overlap.
        test_recipe:
          setup:
            - "Center SC1 with chute C1 (throughput_pph 1200, max_concurrent_destinations 2) and three lanes L-1, L-2, L-3"
            - "Assignment A1: L-1 on C1 for 06:00-10:00; assignment A2: L-2 on C1 for 08:00-12:00 (two concurrent destinations between 08:00 and 10:00, which is legal)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T05:00:00Z" }
              as: FacilityAdmin
            - call: "POST /sortation/sort-centers"
              payload: { code: "SC1", name: "Memphis Sort 1", automation_utilization_pct: 70, flex_pool_total: 20 }
              as: FacilityAdmin
              captures: { center_id: $.data.id }
            - call: "POST /sortation/sort-centers/${center_id}/sort-chutes"
              payload: { chute_number: "C1", throughput_pph: 1200, max_concurrent_destinations: 2 }
              as: FacilityAdmin
              captures: { chute1_id: $.data.id, chute_v1: $.data.version }
            - call: "POST /sortation/sort-centers/${center_id}/destination-lanes"
              payload: { lane_code: "L-1", region: "WEST", service_class: "GROUND", forecast_hourly_volume: 900 }
              as: FacilityAdmin
              captures: { lane1_id: $.data.id }
            - call: "POST /sortation/sort-centers/${center_id}/destination-lanes"
              payload: { lane_code: "L-2", region: "EAST", service_class: "GROUND", forecast_hourly_volume: 900 }
              as: FacilityAdmin
              captures: { lane2_id: $.data.id }
            - call: "POST /sortation/sort-centers/${center_id}/destination-lanes"
              payload: { lane_code: "L-3", region: "SOUTH", service_class: "EXPRESS", forecast_hourly_volume: 900 }
              as: FacilityAdmin
              captures: { lane3_id: $.data.id }
            - call: "POST /sortation/chute-assignments"
              payload: { chute_id: "${chute1_id}", destination_lane_id: "${lane1_id}", window_start: "2026-08-03T06:00:00Z", window_end: "2026-08-03T10:00:00Z", expected_chute_version: "${chute_v1}" }
              as: SortSupervisor
              captures: { a1_id: $.data.id }
            - call: "GET /sortation/sort-chutes/${chute1_id}"
              payload: {}
              as: SortSupervisor
              captures: { chute_v2: $.data.version }
            - call: "POST /sortation/chute-assignments"
              payload: { chute_id: "${chute1_id}", destination_lane_id: "${lane2_id}", window_start: "2026-08-03T08:00:00Z", window_end: "2026-08-03T12:00:00Z", expected_chute_version: "${chute_v2}" }
              as: SortSupervisor
              captures: { a2_id: $.data.id }
            - call: "GET /sortation/sort-chutes/${chute1_id}"
              payload: {}
              as: SortSupervisor
              captures: { chute_v3: $.data.version }
          trigger:
            - call: "POST /sortation/chute-assignments"
              payload: { chute_id: "${chute1_id}", destination_lane_id: "${lane3_id}", window_start: "2026-08-03T09:00:00Z", window_end: "2026-08-03T09:30:00Z", expected_chute_version: "${chute_v3}" }
              as: SortSupervisor
            - call: "POST /sortation/chute-assignments"
              payload: { chute_id: "${chute1_id}", destination_lane_id: "${lane3_id}", window_start: "2026-08-03T10:00:00Z", window_end: "2026-08-03T11:00:00Z", expected_chute_version: "${chute_v3}" }
              as: SortSupervisor
          assert:
            - "the setup A2 create succeeded even though it overlaps A1 from 08:00 to 10:00 (aggregate capacity 2, not 1)"
            - "A3 for 09:00-09:30 returns ERR_CHUTE_CONCURRENCY_EXCEEDED with HTTP 409, because it would make three destinations simultaneous between 09:00 and 09:30"
            - "the refused create leaves SortChute.${chute1_id}.version equal to ${chute_v3}, which is why the next create can reuse that same expected_chute_version"
            - "A4 for 10:00-11:00 returns HTTP 201: A1 ends exactly at 10:00 and the windows are half-open, so adjacency is not an overlap and only A2 is concurrent"
            - "ChuteAssignment.${a1_id}.status == ACTIVE and ChuteAssignment.${a2_id}.status == ACTIVE, and DestinationLane.${lane3_id}.assigned_capacity_pph == 1200 after A4"
            - "SortChute.${chute1_id}.version increments by exactly 1 for each accepted assignment create and not at all for the refused one"

  # =====================================================================
  # Rule 9 - compensating invariants over different conserved quantities
  # =====================================================================
  - rule_id: compensating_invariant
    instances:
      - name: package_conservation_across_missort_and_reroute
        grounds:
          - calculations.package_conservation_invariant
          - state_machines.PackageException.OPEN_to_RESOLVED
          - endpoints.POST_/sortation/package-exceptions
          - entities.SortCenter.fields.packages_inducted_count
        distinguishing_aspect: |
          Conserved quantity: physical packages. Every induction, scan, exception and resolution keeps
          packages_inducted_count == wip + exception_hold + disposed + sum(lane sorted); the MISSORT
          exception create is the forward action and the REROUTE resolve is its compensation, so the
          identity holds at 3000 before, between and after the pair.
        test_recipe:
          setup:
            - "Center SC1 (automation 70) with inbound door IN-1, outbound door OUT-1, chute C1 (max_concurrent_destinations 2) and lanes L-WEST and L-EAST both assigned to C1 for 06:00-14:00"
            - "Appointment T-IN-1 with manifest_package_count 3000 fully unloaded (inducted 3000, wip 3000)"
            - "An outbound load for L-WEST with trailer_cube_cuft 1000 scanned with 2400 SMALL packages (wip 600, L-WEST sorted 2400)"
            - "A MISSORT PackageException for 40 packages drawn from L-WEST (L-WEST sorted 2360, exception_hold 40)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T06:00:00Z" }
              as: FacilityAdmin
            - call: "POST /sortation/sort-centers"
              payload: { code: "SC1", name: "Memphis Sort 1", automation_utilization_pct: 70, flex_pool_total: 20 }
              as: FacilityAdmin
              captures: { center_id: $.data.id }
            - call: "POST /sortation/sort-centers/${center_id}/dock-doors"
              payload: { door_number: "IN-1", kind: "INBOUND" }
              as: FacilityAdmin
              captures: { door_in_id: $.data.id }
            - call: "POST /sortation/sort-centers/${center_id}/dock-doors"
              payload: { door_number: "OUT-1", kind: "OUTBOUND" }
              as: FacilityAdmin
              captures: { door_out_id: $.data.id }
            - call: "POST /sortation/sort-centers/${center_id}/sort-chutes"
              payload: { chute_number: "C1", throughput_pph: 1200, max_concurrent_destinations: 2 }
              as: FacilityAdmin
              captures: { chute1_id: $.data.id, chute_v1: $.data.version }
            - call: "POST /sortation/sort-centers/${center_id}/destination-lanes"
              payload: { lane_code: "L-WEST", region: "WEST", service_class: "GROUND", forecast_hourly_volume: 3000 }
              as: FacilityAdmin
              captures: { lane1_id: $.data.id }
            - call: "POST /sortation/sort-centers/${center_id}/destination-lanes"
              payload: { lane_code: "L-EAST", region: "EAST", service_class: "EXPRESS", forecast_hourly_volume: 1200 }
              as: FacilityAdmin
              captures: { lane2_id: $.data.id }
            - call: "POST /sortation/chute-assignments"
              payload: { chute_id: "${chute1_id}", destination_lane_id: "${lane1_id}", window_start: "2026-08-03T06:00:00Z", window_end: "2026-08-03T14:00:00Z", expected_chute_version: "${chute_v1}" }
              as: SortSupervisor
            - call: "GET /sortation/sort-chutes/${chute1_id}"
              payload: {}
              as: SortSupervisor
              captures: { chute_v2: $.data.version }
            - call: "POST /sortation/chute-assignments"
              payload: { chute_id: "${chute1_id}", destination_lane_id: "${lane2_id}", window_start: "2026-08-03T06:00:00Z", window_end: "2026-08-03T14:00:00Z", expected_chute_version: "${chute_v2}" }
              as: SortSupervisor
            - call: "POST /sortation/trailer-appointments"
              payload: { sort_center_id: "${center_id}", door_id: "${door_in_id}", trailer_code: "T-IN-1", window_start: "2026-08-03T06:00:00Z", window_end: "2026-08-03T07:00:00Z", priority_class: "STANDARD", manifest_package_count: 3000 }
              as: InboundCoordinator
              captures: { appt_id: $.data.id }
            - call: "POST /sortation/trailer-appointments/${appt_id}/arrive"
              payload: {}
              as: InboundCoordinator
            - call: "POST /sortation/trailer-appointments/${appt_id}/start-unload"
              payload: {}
              as: InboundCoordinator
            - call: "POST /sortation/trailer-appointments/${appt_id}/complete-unload"
              payload: {}
              as: InboundCoordinator
            - call: "POST /sortation/outbound-loads"
              payload: { sort_center_id: "${center_id}", door_id: "${door_out_id}", destination_lane_id: "${lane1_id}", trailer_code: "T-OUT-1", trailer_cube_cuft: 1000, dispatch_cut_time: "2026-08-03T13:00:00Z" }
              as: SortSupervisor
              captures: { load_id: $.data.id }
            - call: "POST /sortation/outbound-loads/${load_id}/scan-packages"
              payload: { small_count: 2400 }
              as: SortSupervisor
