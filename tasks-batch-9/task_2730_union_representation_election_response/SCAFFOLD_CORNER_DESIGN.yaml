        excluded_because:
          difficulty_instance: dual_variant_calc / soi_ratio_as_petitioned_denominator
          rationale: "The named \u00a71.8 instance runs the same 30 valid cards against both denominators (110 AS_PETITIONED -> 27.27 INSUFFICIENT, 90 AS_RULED -> 33.33 SUFFICIENT) and asserts the delta."

