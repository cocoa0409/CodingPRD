  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_version_on_terminate_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[residency-terminate-stale]"
          - "entities.Residency.fields.version"
          - "errors[ERR_STALE_VERSION]"
        distinguishing_aspect: "Add a second person (bumps Residency.version) AFTER reading version v, then terminate carrying expected_residency_version ${rv} - 1 (stale) → ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["ACTIVE residency; capture its version, then add a second person so the live version advances past the captured one."]
          setup_api_calls:
            - call: "POST /ccrc/communities"
              payload: { name: "OccT", actuarial_discount_rate_bps: 0, reserve_assets_cents: 0 }
              as: FinanceOfficer
              captures: { cid: $.data.id }
            - call: "POST /ccrc/contract-plans"
              payload: { community_id: "${cid}", name: "Op", contract_type: "TYPE_C", entrance_fee_cents: 5000000, refund_plan: "DECLINING", monthly_service_fee_cents: 300000, second_person_fee_cents: 150000 }
              as: FinanceOfficer
              captures: { pid: $.data.id }
            - call: "POST /ccrc/units"
              payload: { community_id: "${cid}", unit_number: "OI", care_level: "INDEPENDENT" }
              as: AdmissionsDirector
              captures: { uid: $.data.id }
            - call: "POST /ccrc/residents"
              payload: { community_id: "${cid}", full_name: "Olu O", date_of_birth: "1930-01-01" }
              as: AdmissionsDirector
              captures: { resd: $.data.id }
            - call: "POST /ccrc/residencies"
              payload: { community_id: "${cid}", primary_resident_id: "${resd}", contract_plan_id: "${pid}" }
              as: AdmissionsDirector
              captures: { rid: $.data.id }
            - call: "POST /ccrc/residencies/${rid}/assign-unit"
              payload: { unit_id: "${uid}" }
              as: AdmissionsDirector
              captures: { rv0: $.data.version }
            - call: "POST /ccrc/residencies/${rid}/activate"
              payload: { expected_residency_version: "${rv0}" }
              as: AdmissionsDirector
              captures: { rv1: $.data.version }
            - call: "POST /ccrc/residencies/${rid}/second-persons"
              payload: { full_name: "Olu Spouse", date_of_birth: "1931-01-01" }
              as: AdmissionsDirector
          trigger:
            - call: "POST /ccrc/residencies/${rid}/terminate"
              payload: { reason: "VOLUNTARY", expected_residency_version: "${rv1}" }
              as: AdmissionsDirector
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_STALE_VERSION and code == 412 (rv1 is stale after the second-person add bumped version)"

      - name: occ_correct_version_on_activate_succeeds
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[residency-activate-stale]"
          - "entities.Residency.fields.version"
        excluded_because:
          difficulty_instance: dual_variant_calc / refund_voluntary_vs_death_diverge_on_fifty_plan
          rationale: "Every §1.8 activation chain supplies the correct expected_residency_version and succeeds, exercising the OCC happy path."

      - name: derived_field_has_second_person_reconciled_on_add
        claim_type: derived_field_reconciliation
        grounds: [entities.Residency.fields.has_second_person]
        excluded_because:
          difficulty_instance: compensating_invariant / second_person_add_then_remove_conserves_active_occupant_count
          rationale: "The compensating-invariant §1.8 instance asserts has_second_person flips true on add and false on remove."

      - name: cascade_terminate_frees_independent_unit
        claim_type: cascading_side_effects
        grounds: [state_machines.Residency.ACTIVE_to_TERMINATED_VOLUNTARY, entities.Unit.fields.status]
        excluded_because:
          difficulty_instance: transitive_cascade / terminate_releases_bed_then_frees_skilled_unit_depth3
          rationale: "The depth-3 cascade instance asserts terminate frees both the skilled bed and (in setup) the assigned unit chain."

