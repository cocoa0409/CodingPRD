              captures: { res2_id: $.data.id }
          assert:
            - "trigger[0]: HTTP 412 with data.error_id == ERR_STALE_LOT_VERSION while available_quantity is still 4"
            - "after trigger[0]: ImplantLot.${lot_id}.quantity_reserved == 1 and version == ${lot_v1} - the refusal neither reserved a unit nor bumped the version"
            - "trigger[2]: HTTP 201 with quantity_reserved == 2 and available_quantity == 3 on a re-read"
