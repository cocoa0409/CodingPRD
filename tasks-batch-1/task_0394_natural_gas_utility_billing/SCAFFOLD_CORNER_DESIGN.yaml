# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests) — task_0394
# Breadth probe across SCAFFOLD.yaml §1.1–§1.7, taxonomy per claim-extraction-guide.md.
# Single top-level key: scaffold_corner_design.
#
# Canonical RES setup literals (shared across many instances):
#   clock 2026-02-15 (heating_season_active false) | RES-1 (code, RESIDENTIAL,
#   fixed 1200, dist 15, btu 1.025, min_bill 0) | PGA RES 2026-02 (commodity 40,
#   refund 5 -> eff 35) | meter CCF install_index 1000, set via METER_SET order,
#   read 1100 -> ccf 100 -> therms 102.5 -> commodity 3588, dist 1538, fixed 1200,
#   amount_due 6326.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  # SECTION 1 — Entities (creation, retrieval, listing, not-found, required
  #   fields, defaults, computed/system fields, type constraints, immutability,
  #   parent relationships, hybrid topology FK integrity).
  # ===========================================================================
  - section: entities
    instances:
      - name: create_rate_schedule_returns_201_with_fields
        claim_type: Creation
        grounds:
          - entities.RateSchedule
          - endpoints["POST /rate-schedules"]
        distinguishing_aspect: "POST /rate-schedules with all required fields -> 201; response carries code, customer_class, fixed_customer_charge_cents, distribution_rate_cents_per_therm, and active=true."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /rate-schedules"
              payload: { code: "RES-E1", customer_class: "RESIDENTIAL", fixed_customer_charge_cents: 1200, distribution_rate_cents_per_therm: 15, btu_factor: 1.025, minimum_bill_cents: 0 }
              as: BillingAdmin
              captures: { rs_id: $.data.id }
          assert:
            - "response.status == 201"
            - "RateSchedule.${rs_id}.code == RES-E1"
            - "RateSchedule.${rs_id}.customer_class == RESIDENTIAL"
            - "RateSchedule.${rs_id}.fixed_customer_charge_cents == 1200"
            - "RateSchedule.${rs_id}.distribution_rate_cents_per_therm == 15"
            - "RateSchedule.${rs_id}.active == true"

      - name: rate_schedule_btu_factor_default_applied_when_omitted
        claim_type: Defaults
        grounds:
          - entities.RateSchedule.fields.btu_factor
          - entities.RateSchedule.fields.minimum_bill_cents
          - endpoints["POST /rate-schedules"]
        distinguishing_aspect: "Omitting btu_factor and minimum_bill_cents on create applies the declared defaults btu_factor=1.025 and minimum_bill_cents=0."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /rate-schedules"
              payload: { code: "RES-E2", customer_class: "RESIDENTIAL", fixed_customer_charge_cents: 1200, distribution_rate_cents_per_therm: 15 }
              as: BillingAdmin
              captures: { rs_id: $.data.id }
          assert:
            - "RateSchedule.${rs_id}.btu_factor == 1.025"
            - "RateSchedule.${rs_id}.minimum_bill_cents == 0"

      - name: account_customer_class_copied_from_rate_schedule
        claim_type: Computed Fields
        grounds:
          - entities.Account.fields.customer_class
          - endpoints["POST /accounts"]
        distinguishing_aspect: "Account.customer_class is computed (copied from the assigned RateSchedule.customer_class) at creation; a COMMERCIAL schedule yields Account.customer_class == COMMERCIAL."
        test_recipe:
          setup:
            - "A COMMERCIAL rate schedule exists."
          setup_api_calls:
            - call: "POST /rate-schedules"
              payload: { code: "COM-E1", customer_class: "COMMERCIAL", fixed_customer_charge_cents: 4000, distribution_rate_cents_per_therm: 20, btu_factor: 1.025, minimum_bill_cents: 0 }
              as: BillingAdmin
              captures: { rs_id: $.data.id }
          trigger:
            - call: "POST /accounts"
              payload: { rate_schedule_id: "${rs_id}", holder_name: "COM Holder" }
              as: CustomerService
              captures: { acct_id: $.data.id }
          assert:
            - "Account.${acct_id}.customer_class == COMMERCIAL"
            - "Account.${acct_id}.service_status == ACTIVE"
            - "Account.${acct_id}.balance_cents == 0"

      - name: account_system_defaults_on_open
        claim_type: System Fields
        grounds:
          - entities.Account.fields.service_status
          - entities.Account.fields.low_income_status
          - entities.Account.fields.budget_enrolled
          - endpoints["POST /accounts"]
        distinguishing_aspect: "A newly opened account has system defaults: service_status=ACTIVE, low_income_status=NONE, low_income_tier=NONE, budget_enrolled=false, consecutive_ontime_payments=0, version=1."
        test_recipe:
          setup:
            - "A RES rate schedule exists."
          setup_api_calls:
            - call: "POST /rate-schedules"
              payload: { code: "RES-E3", customer_class: "RESIDENTIAL", fixed_customer_charge_cents: 1200, distribution_rate_cents_per_therm: 15, btu_factor: 1.025, minimum_bill_cents: 0 }
              as: BillingAdmin
              captures: { rs_id: $.data.id }
          trigger:
            - call: "POST /accounts"
              payload: { rate_schedule_id: "${rs_id}", holder_name: "Defaults" }
              as: CustomerService
              captures: { acct_id: $.data.id }
          assert:
            - "Account.${acct_id}.service_status == ACTIVE"
            - "Account.${acct_id}.low_income_status == NONE"
            - "Account.${acct_id}.low_income_tier == NONE"
            - "Account.${acct_id}.budget_enrolled == false"
            - "Account.${acct_id}.consecutive_ontime_payments == 0"
            - "Account.${acct_id}.version == 1"

      - name: get_account_returns_stored_entity
        claim_type: Retrieval
        grounds:
          - entities.Account
          - endpoints["GET /accounts/{id}"]
        distinguishing_aspect: "GET /accounts/{id} returns the stored account with its holder_name and computed balances refreshed."
        test_recipe:
          setup:
            - "A RES account exists."
          setup_api_calls:
            - call: "POST /rate-schedules"
              payload: { code: "RES-E4", customer_class: "RESIDENTIAL", fixed_customer_charge_cents: 1200, distribution_rate_cents_per_therm: 15, btu_factor: 1.025, minimum_bill_cents: 0 }
              as: BillingAdmin
              captures: { rs_id: $.data.id }
            - call: "POST /accounts"
              payload: { rate_schedule_id: "${rs_id}", holder_name: "Readback" }
              as: CustomerService
              captures: { acct_id: $.data.id }
          trigger:
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: BillingAdmin
          assert:
            - "response.status == 200"
            - "Account.${acct_id}.holder_name == Readback"
            - "Account.${acct_id}.balance_cents == 0"

      - name: list_accounts_filtered_by_rate_schedule_pagination
        claim_type: Listing
        grounds:
          - entities.Account.fields.rate_schedule_id
          - endpoints["GET /accounts"]
        distinguishing_aspect: "GET /accounts?rate_schedule_id=X returns only accounts on that schedule as an array with pagination metadata (total_count, has_more)."
        test_recipe:
          setup:
            - "Two accounts on rate schedule X, one account on schedule Y."
          setup_api_calls:
            - call: "POST /rate-schedules"
              payload: { code: "RES-LX", customer_class: "RESIDENTIAL", fixed_customer_charge_cents: 1200, distribution_rate_cents_per_therm: 15, btu_factor: 1.025, minimum_bill_cents: 0 }
              as: BillingAdmin
              captures: { rsX_id: $.data.id }
            - call: "POST /rate-schedules"
              payload: { code: "RES-LY", customer_class: "RESIDENTIAL", fixed_customer_charge_cents: 1200, distribution_rate_cents_per_therm: 15, btu_factor: 1.025, minimum_bill_cents: 0 }
              as: BillingAdmin
              captures: { rsY_id: $.data.id }
            - call: "POST /accounts"
              payload: { rate_schedule_id: "${rsX_id}", holder_name: "X1" }
              as: CustomerService
            - call: "POST /accounts"
              payload: { rate_schedule_id: "${rsX_id}", holder_name: "X2" }
              as: CustomerService
            - call: "POST /accounts"
              payload: { rate_schedule_id: "${rsY_id}", holder_name: "Y1" }
              as: CustomerService
          trigger:
            - call: "GET /accounts"
              payload: { rate_schedule_id: "${rsX_id}" }
              as: BillingAdmin
          assert:
            - "response.response_type == array"
            - "response.meta.total_count == 2"
            - "every returned Account has rate_schedule_id == ${rsX_id}"

      - name: get_account_nonexistent_returns_not_found
        claim_type: Not Found
        grounds:
          - endpoints["GET /accounts/{id}"]
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET /accounts/{id} with a non-existent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "GET /accounts/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: BillingAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_NOT_FOUND"
            - "response.status == 404"

      - name: create_account_missing_holder_name_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.Account.fields.holder_name
          - validations[priority=4]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /accounts without the required holder_name field returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup:
            - "A RES rate schedule exists."
          setup_api_calls:
            - call: "POST /rate-schedules"
              payload: { code: "RES-E5", customer_class: "RESIDENTIAL", fixed_customer_charge_cents: 1200, distribution_rate_cents_per_therm: 15, btu_factor: 1.025, minimum_bill_cents: 0 }
              as: BillingAdmin
              captures: { rs_id: $.data.id }
          trigger:
            - call: "POST /accounts"
              payload: { rate_schedule_id: "${rs_id}" }
              as: CustomerService
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_REQUEST"
            - "response.status == 400"

      - name: create_account_bad_rate_schedule_id_returns_not_found
        claim_type: Parent Relationships
        grounds:
          - entities.Account.fields.rate_schedule_id
          - validations[priority=3]
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "POST /accounts referencing a non-existent rate_schedule_id (FK -> RateSchedule.id) returns ERR_NOT_FOUND (404) — FK integrity in the hybrid topology."
        test_recipe:
          setup:
            - "Empty DB (no rate schedule with the referenced id)."
          setup_api_calls: []
          trigger:
            - call: "POST /accounts"
              payload: { rate_schedule_id: "00000000-0000-4000-8000-000000000000", holder_name: "Orphan" }
              as: CustomerService
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_NOT_FOUND"
            - "response.status == 404"

      - name: create_low_income_credit_invalid_household_size_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.LowIncomeCredit.fields.household_size
          - validations[priority=4]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST low-income-credit with household_size < 1 (constraint >=1) returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup:
            - "A RES account exists."
          setup_api_calls:
            - call: "POST /rate-schedules"
              payload: { code: "RES-E6", customer_class: "RESIDENTIAL", fixed_customer_charge_cents: 1200, distribution_rate_cents_per_therm: 15, btu_factor: 1.025, minimum_bill_cents: 0 }
              as: BillingAdmin
              captures: { rs_id: $.data.id }
            - call: "POST /accounts"
              payload: { rate_schedule_id: "${rs_id}", holder_name: "TC" }
              as: CustomerService
              captures: { acct_id: $.data.id }
          trigger:
            - call: "POST /accounts/${acct_id}/low-income-credits"
              payload: { household_size: 0, annual_income_cents: 1000000 }
              as: CustomerService
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_REQUEST"
            - "response.status == 400"

      - name: create_pga_schedule_bad_customer_class_enum_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.PgaSchedule.fields.customer_class
          - validations[priority=4]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /pga-schedules with an out-of-domain customer_class enum value returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /pga-schedules"
              payload: { effective_month: "2026-02", customer_class: "INDUSTRIAL", commodity_rate_cents_per_therm: 40, supplier_refund_cents_per_therm: 5 }
              as: BillingAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_REQUEST"
            - "response.status == 400"

      - name: meter_read_install_index_default_and_status_posted
        claim_type: Defaults
        grounds:
          - entities.PremiseMeter.fields.install_index
          - entities.PremiseMeter.fields.uom
          - endpoints["POST /accounts/{id}/meters"]
        distinguishing_aspect: "Registering a meter while omitting uom and install_index applies defaults uom=CCF and install_index=0, with status=PENDING_SET."
        test_recipe:
          setup:
            - "A RES account exists."
          setup_api_calls:
            - call: "POST /rate-schedules"
              payload: { code: "RES-E7", customer_class: "RESIDENTIAL", fixed_customer_charge_cents: 1200, distribution_rate_cents_per_therm: 15, btu_factor: 1.025, minimum_bill_cents: 0 }
              as: BillingAdmin
              captures: { rs_id: $.data.id }
            - call: "POST /accounts"
              payload: { rate_schedule_id: "${rs_id}", holder_name: "MD" }
              as: CustomerService
              captures: { acct_id: $.data.id }
          trigger:
            - call: "POST /accounts/${acct_id}/meters"
              payload: { serial_no: "MD-001" }
              as: FieldTech
              captures: { m_id: $.data.id }
          assert:
            - "PremiseMeter.${m_id}.uom == CCF"
            - "PremiseMeter.${m_id}.install_index == 0"
            - "PremiseMeter.${m_id}.status == PENDING_SET"

      - name: meter_read_immutable_no_version_field
        claim_type: Immutability
        grounds:
          - entities.MeterRead
          - endpoints["POST /meters/{id}/reads"]
        distinguishing_aspect: "MeterRead has common_fields:false — its create response carries id and created_at but NO version field (append-only read record)."
        test_recipe:
          setup:
            - "A RES account with a SET meter exists."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { current_utc: "2026-02-15T00:00:00.000Z", heating_season_active: false }
              as: BillingAdmin
            - call: "POST /rate-schedules"
              payload: { code: "RES-E8", customer_class: "RESIDENTIAL", fixed_customer_charge_cents: 1200, distribution_rate_cents_per_therm: 15, btu_factor: 1.025, minimum_bill_cents: 0 }
              as: BillingAdmin
              captures: { rs_id: $.data.id }
            - call: "POST /accounts"
              payload: { rate_schedule_id: "${rs_id}", holder_name: "IMM" }
              as: CustomerService
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/meters"
              payload: { serial_no: "MM-008", uom: "CCF", install_index: 1000 }
              as: FieldTech
              captures: { m_id: $.data.id }
            - call: "POST /service-orders"
              payload: { account_id: "${acct_id}", order_type: "METER_SET", premise_meter_id: "${m_id}", scheduled_date: "2026-02-01T00:00:00.000Z" }
              as: FieldTech
              captures: { so_id: $.data.id }
            - call: "POST /service-orders/${so_id}/dispatch"
              payload: {}
              as: FieldTech
            - call: "POST /service-orders/${so_id}/complete"
              payload: { completed_index: 1000 }
              as: FieldTech
          trigger:
            - call: "POST /meters/${m_id}/reads"
              payload: { reading_index: 1100, read_date: "2026-02-28T00:00:00.000Z", read_type: "ACTUAL" }
              as: FieldTech
              captures: { rd_id: $.data.id }
          assert:
            - "MeterRead.${rd_id}.status == POSTED"
            - "MeterRead.${rd_id} response has no version field"

      - name: meter_read_consumption_computed_input_ignored
        claim_type: Computed Fields
        grounds:
          - entities.MeterRead.fields.ccf_consumed
          - entities.MeterRead.fields.therms_consumed
          - calculations.consumption_conversion
        distinguishing_aspect: "ccf_consumed and therms_consumed are computed from the register delta; a CCF read from install 1000 to 1100 yields ccf_consumed 100 and therms_consumed 102.5 regardless of any client-supplied value."
        test_recipe:
          setup:
            - "A RES account with a SET meter (install 1000) exists; one read at 1100."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { current_utc: "2026-02-15T00:00:00.000Z", heating_season_active: false }
              as: BillingAdmin
            - call: "POST /rate-schedules"
              payload: { code: "RES-E9", customer_class: "RESIDENTIAL", fixed_customer_charge_cents: 1200, distribution_rate_cents_per_therm: 15, btu_factor: 1.025, minimum_bill_cents: 0 }
              as: BillingAdmin
              captures: { rs_id: $.data.id }
            - call: "POST /accounts"
              payload: { rate_schedule_id: "${rs_id}", holder_name: "CF" }
              as: CustomerService
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/meters"
              payload: { serial_no: "MC-009", uom: "CCF", install_index: 1000 }
              as: FieldTech
              captures: { m_id: $.data.id }
            - call: "POST /service-orders"
              payload: { account_id: "${acct_id}", order_type: "METER_SET", premise_meter_id: "${m_id}", scheduled_date: "2026-02-01T00:00:00.000Z" }
              as: FieldTech
              captures: { so_id: $.data.id }
            - call: "POST /service-orders/${so_id}/dispatch"
              payload: {}
              as: FieldTech
            - call: "POST /service-orders/${so_id}/complete"
              payload: { completed_index: 1000 }
              as: FieldTech
          trigger:
            - call: "POST /meters/${m_id}/reads"
              payload: { reading_index: 1100, read_date: "2026-02-28T00:00:00.000Z", read_type: "ACTUAL" }
              as: FieldTech
              captures: { rd_id: $.data.id }
          assert:
            - "MeterRead.${rd_id}.ccf_consumed == 100"
            - "MeterRead.${rd_id}.therms_consumed == 102.5"

  # ===========================================================================
  # SECTION 2 — State Machines (valid transitions, precondition enforcement,
  #   invalid-from rejection, terminal lockdown, idempotency, side effects).
  # ===========================================================================
  - section: state_machines
    instances:
      - name: dispatch_service_order_scheduled_to_dispatched
        claim_type: Valid Transition
        grounds:
          - state_machines.ServiceOrder.SCHEDULED_to_DISPATCHED
          - endpoints["POST /service-orders/{id}/dispatch"]
        distinguishing_aspect: "POST /service-orders/{id}/dispatch on a SCHEDULED order whose scheduled_date <= clock moves it to DISPATCHED."
        test_recipe:
          setup:
            - "A RES account with a SCHEDULED METER_SET order (scheduled_date <= clock)."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { current_utc: "2026-02-15T00:00:00.000Z", heating_season_active: false }
              as: BillingAdmin
            - call: "POST /rate-schedules"
              payload: { code: "RES-S1", customer_class: "RESIDENTIAL", fixed_customer_charge_cents: 1200, distribution_rate_cents_per_therm: 15, btu_factor: 1.025, minimum_bill_cents: 0 }
              as: BillingAdmin
              captures: { rs_id: $.data.id }
            - call: "POST /accounts"
              payload: { rate_schedule_id: "${rs_id}", holder_name: "S1" }
              as: CustomerService
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/meters"
              payload: { serial_no: "MS-101", uom: "CCF", install_index: 1000 }
              as: FieldTech
              captures: { m_id: $.data.id }
            - call: "POST /service-orders"
              payload: { account_id: "${acct_id}", order_type: "METER_SET", premise_meter_id: "${m_id}", scheduled_date: "2026-02-01T00:00:00.000Z" }
              as: FieldTech
              captures: { so_id: $.data.id }
          trigger:
            - call: "POST /service-orders/${so_id}/dispatch"
              payload: {}
              as: FieldTech
          assert:
            - "ServiceOrder.${so_id}.status == DISPATCHED"

      - name: dispatch_service_order_before_scheduled_date_returns_order_not_due
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.ServiceOrder.SCHEDULED_to_DISPATCHED
          - errors[ERR_ORDER_NOT_DUE]
        distinguishing_aspect: "Dispatching a SCHEDULED order whose scheduled_date is strictly after the clock returns ERR_ORDER_NOT_DUE (409)."
        test_recipe:
          setup:
            - "A RES account with a SCHEDULED METER_SET order scheduled in the future relative to the clock."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { current_utc: "2026-02-15T00:00:00.000Z", heating_season_active: false }
              as: BillingAdmin
            - call: "POST /rate-schedules"
              payload: { code: "RES-S2", customer_class: "RESIDENTIAL", fixed_customer_charge_cents: 1200, distribution_rate_cents_per_therm: 15, btu_factor: 1.025, minimum_bill_cents: 0 }
              as: BillingAdmin
              captures: { rs_id: $.data.id }
            - call: "POST /accounts"
              payload: { rate_schedule_id: "${rs_id}", holder_name: "S2" }
              as: CustomerService
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/meters"
              payload: { serial_no: "MS-201", uom: "CCF", install_index: 1000 }
              as: FieldTech
              captures: { m_id: $.data.id }
            - call: "POST /service-orders"
              payload: { account_id: "${acct_id}", order_type: "METER_SET", premise_meter_id: "${m_id}", scheduled_date: "2026-06-01T00:00:00.000Z" }
              as: FieldTech
              captures: { so_id: $.data.id }
          trigger:
            - call: "POST /service-orders/${so_id}/dispatch"
              payload: {}
              as: FieldTech
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_ORDER_NOT_DUE"
            - "response.status == 409"

      - name: complete_meter_set_without_index_returns_missing_completion_index
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.ServiceOrder.DISPATCHED_to_COMPLETED
          - errors[ERR_MISSING_COMPLETION_INDEX]
        distinguishing_aspect: "Completing a DISPATCHED METER_SET order without completed_index returns ERR_MISSING_COMPLETION_INDEX (400)."
        test_recipe:
          setup:
            - "A RES account with a DISPATCHED METER_SET order."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { current_utc: "2026-02-15T00:00:00.000Z", heating_season_active: false }
              as: BillingAdmin
            - call: "POST /rate-schedules"
              payload: { code: "RES-S3", customer_class: "RESIDENTIAL", fixed_customer_charge_cents: 1200, distribution_rate_cents_per_therm: 15, btu_factor: 1.025, minimum_bill_cents: 0 }
              as: BillingAdmin
              captures: { rs_id: $.data.id }
            - call: "POST /accounts"
              payload: { rate_schedule_id: "${rs_id}", holder_name: "S3" }
              as: CustomerService
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/meters"
              payload: { serial_no: "MS-301", uom: "CCF", install_index: 1000 }
              as: FieldTech
              captures: { m_id: $.data.id }
            - call: "POST /service-orders"
              payload: { account_id: "${acct_id}", order_type: "METER_SET", premise_meter_id: "${m_id}", scheduled_date: "2026-02-01T00:00:00.000Z" }
