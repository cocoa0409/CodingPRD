              payload: { weapon_access: true, strangulation_history: false, separation_recent: true, threats_to_kill: false, stalking_frequency_per_week: 2 }
              as: HotlineAdvocate
              as_user_id: "${adv_id}"
            - call: "POST /clients"
              payload: { client_code: "C-2010", legal_name: "Tara Finn", household_size: 2, minor_children_count: 0, accessibility_required: false, location_confidential: true }
              as: HotlineAdvocate
              as_user_id: "${adv_id}"
              captures: { client_c: "$.data.id" }
            - call: "POST /hotline-calls"
              payload: { client_id: "${client_c}", caller_type: "PROFESSIONAL_REFERRAL", presenting_concerns: "Clinic asks for community resources." }
              as: HotlineAdvocate
              as_user_id: "${adv_id}"
              captures: { call_c: "$.data.id" }
            - call: "POST /hotline-calls/${call_c}/risk-assessments"
