            - "hop 1: ReviewCycle.${cycle_id}.state == DECIDED and decided_at == 2026-09-15T10:00:00Z"
            - "hop 2: AcademicProgram.${prog_id}.lifecycle_state == TEACH_OUT_PENDING"
