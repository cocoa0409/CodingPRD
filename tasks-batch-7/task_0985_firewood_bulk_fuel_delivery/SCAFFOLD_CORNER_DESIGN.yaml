  # ==========================================================================
  # Section: cross_cutting_layers
  # ==========================================================================
  - section: cross_cutting_layers
    instances:
      - name: occ_stale_version_on_schedule
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[order-schedule-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Scheduling with an expected_order_version captured BEFORE an intervening line-edit mutation returns 412 ERR_STALE_VERSION."
        test_recipe:
          setup: ["Order confirmed; capture version; mutate (PATCH line); then attempt schedule with stale version"]
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: OperationsManager
            - call: "POST /api/v1/customers"
              payload: { full_name: "Cu OCC", email: "occ@x.com", phone: "1", street_address: "1 St", postal_code: "01010" }
              as: CustomerService
              captures: { cu_occ_id: $.data.id }
            - call: "POST /api/v1/products"
              payload: { sku: "POCC", product_kind: "CORD", species: "OAK", seasoned_grade: "KILN_DRIED", base_price_cents: 40000, moisture_ceiling_pct: 20.0, available_qty: 50 }
              as: OperationsManager
              captures: { p_occ_id: $.data.id }
            - call: "POST /api/v1/delivery-routes"
              payload: { route_code: "ROCC", depot_name: "C", service_postal_prefixes: ["0"], capacity_cord_equivalent: 50.0 }
              as: RoutePlanner
              captures: { r_occ_id: $.data.id }
            - call: "POST /api/v1/delivery-windows"
              payload: { route_id: "${r_occ_id}", service_date: "2026-08-15", start_hour: 8, end_hour: 18, capacity_cord_equivalent: 50.0 }
              as: RoutePlanner
              captures: { w_occ_id: $.data.id }
            - call: "POST /api/v1/orders"
              payload: { customer_id: "${cu_occ_id}", delivery_street_address: "1 St", delivery_postal_code: "01010", requested_delivery_date: "2026-08-15", lines: [{ product_id: "${p_occ_id}", quantity: 1.0 }] }
              as: CustomerService
              captures: { o_occ_id: $.data.id }
            - call: "POST /api/v1/orders/${o_occ_id}/submit"
              payload: {}
              as: CustomerService
            - call: "POST /api/v1/orders/${o_occ_id}/payments"
              payload: { event_kind: "CAPTURE", amount_cents: 53500, external_ref: "cap-occ" }
              as: CustomerService
            - call: "GET /api/v1/orders/${o_occ_id}"
              payload: {}
              as: RoutePlanner
              captures: { o_occ_v_stale: $.data.version }
            # Now add another line — this bumps Order.version (line-add allowed only in DRAFT; to bump version post-CONFIRMED, use payment-axis mutation instead)
            - call: "POST /api/v1/orders/${o_occ_id}/payments"
              payload: { event_kind: "AUTHORIZE", amount_cents: 1, external_ref: "auth-bump" }
              as: CustomerService
          trigger:
            - call: "POST /api/v1/orders/${o_occ_id}/schedule"
              payload: { delivery_window_id: "${w_occ_id}", expected_order_version: "${o_occ_v_stale}" }
              as: RoutePlanner
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 412"
            - "error_id == ERR_STALE_VERSION (Order.version bumped by intervening payment-axis mutation)"

      - name: occ_stale_version_on_subscription_create
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[subscription-attach-stale-customer]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Creating a subscription with stale expected_customer_version returns 412."
        test_recipe:
          setup: ["Capture customer version; mutate customer via wallet adjustment; create subscription with stale version"]
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: OperationsManager
            - call: "POST /api/v1/customers"
              payload: { full_name: "Cu SO", email: "so@x.com", phone: "1", street_address: "1 St", postal_code: "01010" }
              as: CustomerService
              captures: { cu_so_id: $.data.id, cu_so_v_stale: $.data.version }
            - call: "POST /api/v1/customers/${cu_so_id}/wallet-adjustments"
              payload: { amount_cents: 100, reason: "bump version" }
              as: OperationsManager
          trigger:
            - call: "POST /api/v1/subscriptions"
              payload: { customer_id: "${cu_so_id}", tier: "HEARTH", season_year: 2026, commitment_cord_equivalent: 2.0, prepaid_cents: 0, discount_pct: 0.05, expected_customer_version: "${cu_so_v_stale}" }
              as: CustomerService
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 412"
            - "error_id == ERR_STALE_VERSION"

      - name: idempotent_capture_via_external_ref_uniqueness
        claim_type: idempotency
        grounds: ["entities.PaymentEvent.fields.external_ref"]
        distinguishing_aspect: "Posting two PaymentEvents with same (invoice_id, event_kind, external_ref) — second is rejected as duplicate (idempotency by external_ref)."
        test_recipe:
          setup: ["Order submitted; invoice OPEN"]
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: OperationsManager
            - call: "POST /api/v1/customers"
              payload: { full_name: "Cu ID", email: "id@x.com", phone: "1", street_address: "1 St", postal_code: "01010" }
              as: CustomerService
              captures: { cu_id_id: $.data.id }
            - call: "POST /api/v1/products"
              payload: { sku: "PID", product_kind: "CORD", species: "OAK", seasoned_grade: "KILN_DRIED", base_price_cents: 40000, moisture_ceiling_pct: 20.0, available_qty: 10 }
              as: OperationsManager
              captures: { p_id_id: $.data.id }
            - call: "POST /api/v1/orders"
              payload: { customer_id: "${cu_id_id}", delivery_street_address: "1 St", delivery_postal_code: "01010", requested_delivery_date: "2026-08-15", lines: [{ product_id: "${p_id_id}", quantity: 1.0 }] }
              as: CustomerService
              captures: { o_id_id: $.data.id }
            - call: "POST /api/v1/orders/${o_id_id}/submit"
              payload: {}
              as: CustomerService
          trigger:
            - call: "POST /api/v1/orders/${o_id_id}/payments"
              payload: { event_kind: "CAPTURE", amount_cents: 49500, external_ref: "same-ref" }
              as: CustomerService
            - call: "POST /api/v1/orders/${o_id_id}/payments"
              payload: { event_kind: "CAPTURE", amount_cents: 49500, external_ref: "same-ref" }
              as: CustomerService
              captures: { err: $.data.error_id }
          assert:
            - "Second POST with same external_ref rejected (idempotent dedup)"
            - "Invoice.paid_cents reflects exactly one capture (no double-charge)"

