          assert:
            - "both create calls return HTTP 201: the promoter booking ${bk_pm} has tenant_id == null and the tenant booking ${bk_tn} has tenant_id == ${t1}"
            - "exp_tn == 2026-08-08T00:00:00.000Z from the TIER_2 window of 168 hours and exp_pm == 2026-08-02T00:00:00.000Z from the OPEN window of 24 hours, so the shared hold endpoint applies the tier of the row and not of the caller"
