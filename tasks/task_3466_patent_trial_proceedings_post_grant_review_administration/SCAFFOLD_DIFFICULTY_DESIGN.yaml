            - call: "POST /ptab/proceedings/${proc19_id}/amendment-motions"
              payload: { substitute_claims: [{ original_claim_number: 2, substitute_text: "2. (substitute) The filter of ..." }] }
              as: PatentOwner
              as_user_id: "${o19_id}"
              captures: { err: $.data.error_id }
            - call: "POST /ptab/amendment-motions/${mtn19a_id}/resolve"
              payload: { outcome: "WITHDRAWN" }
              as: PatentOwner
              as_user_id: "${o19_id}"
            - call: "POST /ptab/proceedings/${proc19_id}/amendment-motions"
              payload: { substitute_claims: [{ original_claim_number: 2, substitute_text: "2. (substitute) The filter of ..." }] }
              as: PatentOwner
