      - name: pt_penalty_unit_branch_waived_three_versus_moderate_six
        grounds:
          - calculations.site_inspection_readiness_score
          - entities.TestSite.fields.complexity_scope
          - entities.TestSite.fields.pt_unsuccessful_count
        distinguishing_aspect: |
          Two sites with identical PT failure counts (P == 2) and no other
          penalty inputs score 94.00 when complexity_scope == WAIVED (pt_unit
          3) and 88.00 when complexity_scope == MODERATE (pt_unit 6) - the
          branch inside the formula is the only difference between them.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One certificate of compliance permitting MODERATE covers both sites over 2026-01-01..2027-12-31 (coverage overlap is scoped per site)."
            - "Site W has complexity_scope WAIVED; site M has complexity_scope MODERATE."
            - "Each site holds one GLUCOSE PT enrollment with two shipments, both graded 60.00 FAIL, so each site has pt_unsuccessful_count == 2."
            - "Neither site has operators, devices or deficiencies, so the other three penalty terms are 0.00."
          setup_api_calls:
            - call: "POST /poct/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /poct/certificates"
              payload: { certificate_number: "45D2243005", certificate_type: "CERTIFICATE_OF_COMPLIANCE", permitted_complexity: "MODERATE", effective_date: "2026-01-01", expiration_date: "2027-12-31" }
