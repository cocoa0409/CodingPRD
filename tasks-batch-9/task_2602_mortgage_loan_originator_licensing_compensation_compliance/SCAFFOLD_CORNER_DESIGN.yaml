  # ===========================================================================
  - section: validations
    instances:

      - name: plan_approval_with_interest_rate_variable_returns_prohibited_comp_variable
        claim_type: violation_error
        grounds:
          - validations[priority=16]
          - errors[ERR_PROHIBITED_COMP_VARIABLE]
          - entities.CompensationVariable.fields.permissibility
        distinguishing_aspect: |
          The two variables sum to exactly 100 so ERR_PLAN_WEIGHTS_NOT_100 cannot fire and the
          prohibited-variable rule is isolated: INTEREST_RATE is stored with permissibility
          PROHIBITED, prohibited_variable_count is 1, and the APPROVE decision returns 422
          ERR_PROHIBITED_COMP_VARIABLE while the plan stays DRAFT with approved_by_user_id null.
        test_recipe:
          setup:
            - "A DRAFT CompensationPlan at 105 bps drafted by designer-1 with two variables:
               LOAN_VOLUME_UNITS at weight_pct 60 and INTEREST_RATE at weight_pct 40."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /compensation-plans"
              payload: { plan_name: "Rate Keyed 2026", base_basis_points: 105, min_fee_cents: 0, max_fee_cents: 5000000, volume_tier_enabled: false, concession_absorption_enabled: false }
              as: CompensationDesigner
              as_user_id: "designer-1"
              captures: { plan_id: $.data.id }
            - call: "POST /compensation-plans/${plan_id}/variables"
              payload: { variable_type: "LOAN_VOLUME_UNITS", weight_pct: 60, justification_text: "Closed unit volume is a permissible compensation variable and is not a term of the transaction." }
              as: CompensationDesigner
              as_user_id: "designer-1"
              captures: { perm_ok: $.data.permissibility }
            - call: "POST /compensation-plans/${plan_id}/variables"
              payload: { variable_type: "INTEREST_RATE", weight_pct: 40, justification_text: "Designer argues the note rate reflects effort, which Regulation Z does not permit." }
              as: CompensationDesigner
              as_user_id: "designer-1"
              captures: { perm_bad: $.data.permissibility }
            - call: "GET /compensation-plans/${plan_id}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { pvc: $.data.prohibited_variable_count }
          trigger:
            - call: "POST /compensation-plans/${plan_id}/approvals"
              payload: { decision: "APPROVE", note: "Attempted approval of a rate-keyed plan." }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { err: $.data.error_id }
            - call: "GET /compensation-plans/${plan_id}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { st: $.data.status, appr: $.data.approved_by_user_id }
          assert:
            - "${perm_ok} == PERMISSIBLE and ${perm_bad} == PROHIBITED"
            - "${pvc} == 1"
            - "HTTP status is 422"
            - "${err} == ERR_PROHIBITED_COMP_VARIABLE"
            - "${st} == DRAFT and ${appr} == null"

      - name: plan_approval_with_weights_summing_to_ninety_rejected
        claim_type: aggregate_validation
        grounds:
          - validations[priority=25]
          - errors[ERR_PLAN_WEIGHTS_NOT_100]
        distinguishing_aspect: |
          Each variable is individually valid (0 <= weight_pct <= 100) and both are
          PERMISSIBLE, so only the collective sum is wrong: 60 + 30 = 90 returns 422
          ERR_PLAN_WEIGHTS_NOT_100. Adding a third PERMISSIBLE variable at weight_pct 10
          lifts the sum to exactly 100 and the same APPROVE call then succeeds.
        test_recipe:
          setup:
            - "A DRAFT CompensationPlan at 105 bps with LOAN_VOLUME_UNITS at 60 and
               HOURS_WORKED at 30, i.e. an aggregate weight of 90."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /compensation-plans"
              payload: { plan_name: "Underweighted 2026", base_basis_points: 105, min_fee_cents: 0, max_fee_cents: 5000000, volume_tier_enabled: false, concession_absorption_enabled: false }
              as: CompensationDesigner
              as_user_id: "designer-1"
              captures: { plan_id: $.data.id }
            - call: "POST /compensation-plans/${plan_id}/variables"
              payload: { variable_type: "LOAN_VOLUME_UNITS", weight_pct: 60, justification_text: "Closed unit volume is a permissible compensation variable and is not a term of the transaction." }
              as: CompensationDesigner
              as_user_id: "designer-1"
            - call: "POST /compensation-plans/${plan_id}/variables"
              payload: { variable_type: "HOURS_WORKED", weight_pct: 30, justification_text: "Hours actually worked on the file is a permissible compensation variable under Regulation Z." }
              as: CompensationDesigner
              as_user_id: "designer-1"
          trigger:
            - call: "POST /compensation-plans/${plan_id}/approvals"
              payload: { decision: "APPROVE", note: "First approval attempt at an aggregate weight of 90." }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { err: $.data.error_id }
            - call: "POST /compensation-plans/${plan_id}/variables"
              payload: { variable_type: "FILE_QUALITY_SCORE", weight_pct: 10, justification_text: "File quality is a permissible compensation variable and is not a term of the transaction." }
              as: CompensationDesigner
              as_user_id: "designer-1"
              captures: { perm3: $.data.permissibility }
            - call: "POST /compensation-plans/${plan_id}/approvals"
              payload: { decision: "APPROVE", note: "Second approval attempt at an aggregate weight of 100." }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { st: $.data.status, appr: $.data.approved_by_user_id, pvc: $.data.prohibited_variable_count }
          assert:
            - "HTTP status is 422 on the first approval"
            - "${err} == ERR_PLAN_WEIGHTS_NOT_100"
            - "${perm3} == PERMISSIBLE"
            - "HTTP status is 200 on the second approval"
            - "${st} == ACTIVE and ${appr} == officer-1 and ${pvc} == 0"

