              payload: { results: [{ item_code: "P1", outcome: "PASS" }, { item_code: "B1", outcome: "FAIL", measured_value: 2.0 }] }
              as: InspectionTechnician
              as_user_id: "${t1}"
            - call: "GET /cpo/inspections/${i1}/reconditioning-items"
              payload: {}
              as: DealerPrincipal
              as_user_id: "${d1}"
              captures: { rb: "$.data[0].id" }
          trigger:
            - call: "POST /cpo/reconditioning-items/${rb}/complete"
              payload: { resolution: "COMPLETED", actual_cost_cents: 40000 }
              as: InspectionTechnician
              as_user_id: "${t1}"
            - call: "POST /cpo/inspections/${i1}/submit"
              payload: {}
              as: DealerPrincipal
              as_user_id: "${d1}"
            - call: "POST /cpo/reconditioning-items/${rb}/complete"
              payload: { resolution: "COMPLETED", actual_cost_cents: 40000 }
              as: InspectionTechnician
              as_user_id: "${t2}"
            - call: "POST /cpo/reconditioning-items/${rb}/complete"
              payload: { resolution: "COMPLETED", actual_cost_cents: 40000 }
