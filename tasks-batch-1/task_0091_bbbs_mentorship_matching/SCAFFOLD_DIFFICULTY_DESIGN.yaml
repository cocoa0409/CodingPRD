# =============================================================================
# Task 0091 — §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Nine §0.5 Difficulty Rules, >= 2 instances each (>= 18 total).
# Every grounds[] ref resolves into SCAFFOLD.yaml §1.1–§1.7.
# Every setup_api_calls / trigger entry is a structured call against §1.5.
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: interest_score_ranking_vs_tiebreak_on_proposal
        grounds:
          - calculations.interest_compatibility_score
          - entities.MatchProposal.fields.volunteer_id
          - entities.MatchProposal.fields.compatibility_score
          - state_machines.Child.WAITLISTED_to_PROPOSED
        distinguishing_aspect: "On the MatchProposal/Volunteer selection domain: two eligible Volunteers tie on rounded compatibility_score 0.80; the ranking_score variant alone is ambiguous, but the pinned tie_break_order variant deterministically selects the earlier-created Volunteer, so proposal.volunteer_id == the first-registered Big, not the second."
        test_recipe:
          setup:
            - "Two eligible Volunteers V1 then V2 with identical interest_tags [SPORTS, READING], same zip3 100, max_weekly_hours 10 -> both score 0.80; V1.created_at < V2.created_at."
            - "Guardian with consent_on_file true; Child with interest_tags [SPORTS, READING, STEM], zip 10010, WAITLISTED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: Coordinator
            - call: "POST /volunteers"
              payload: { full_name: "V One", email: "v1@x.com", gender: "MALE", home_zip: "10001", interest_tags: ["SPORTS","READING"], max_weekly_hours: 10 }
              as: Coordinator
              captures: { v1_id: $.data.id }
            - call: "POST /volunteers/${v1_id}/submit-screening"
              payload: {}
              as: BackgroundScreener
            - call: "GET /volunteers/${v1_id}/background-checks"
              payload: {}
              as: BackgroundScreener
              captures: { v1_bc0: "$.data[0].id", v1_bc1: "$.data[1].id", v1_bc2: "$.data[2].id"}
            - call: "POST /background-checks/${v1_bc0}/adjudicate"
              payload: { decision: "CLEAR", adverse_findings: 0 }
              as: BackgroundScreener
            - call: "POST /background-checks/${v1_bc1}/adjudicate"
              payload: { decision: "CLEAR", adverse_findings: 0 }
              as: BackgroundScreener
            - call: "POST /background-checks/${v1_bc2}/adjudicate"
              payload: { decision: "CLEAR", adverse_findings: 0 }
              as: BackgroundScreener
            - call: "POST /volunteers"
              payload: { full_name: "V Two", email: "v2@x.com", gender: "MALE", home_zip: "10002", interest_tags: ["SPORTS","READING"], max_weekly_hours: 10 }
              as: Coordinator
              captures: { v2_id: $.data.id }
            - call: "POST /volunteers/${v2_id}/submit-screening"
              payload: {}
              as: BackgroundScreener
            - call: "GET /volunteers/${v2_id}/background-checks"
              payload: {}
              as: BackgroundScreener
              captures: { v2_bc0: "$.data[0].id", v2_bc1: "$.data[1].id", v2_bc2: "$.data[2].id"}
            - call: "POST /background-checks/${v2_bc0}/adjudicate"
              payload: { decision: "CLEAR", adverse_findings: 0 }
              as: BackgroundScreener
            - call: "POST /background-checks/${v2_bc1}/adjudicate"
              payload: { decision: "CLEAR", adverse_findings: 0 }
              as: BackgroundScreener
            - call: "POST /background-checks/${v2_bc2}/adjudicate"
              payload: { decision: "CLEAR", adverse_findings: 0 }
              as: BackgroundScreener
            - call: "POST /guardians"
              payload: { full_name: "G One", email: "g1@x.com", consent_on_file: true }
              as: Coordinator
              captures: { g1_id: $.data.id }
            - call: "POST /children"
              payload: { guardian_id: "${g1_id}", first_name: "Liam", age: 10, gender: "MALE", home_zip: "10010", interest_tags: ["SPORTS","READING","STEM"] }
              as: MatchSpecialist
              captures: { c1_id: $.data.id, c1_v: $.data.version }
          trigger:
            - call: "POST /children/${c1_id}/propose-match"
              payload: { expected_child_version: "${c1_v}" }
              as: MatchSpecialist
              captures: { prop_id: $.data.id, prop_vol: $.data.volunteer_id, prop_score: $.data.compatibility_score }
          assert:
            - "MatchProposal.${prop_id}.compatibility_score == 0.80"
            - "MatchProposal.${prop_id}.volunteer_id == ${v1_id}"
            - "MatchProposal.${prop_id}.candidate_pool_size == 2"

      - name: compliance_contact_driven_vs_activity_driven_on_match
        grounds:
          - calculations.match_compliance_status
          - entities.Match.fields.compliance_status
          - entities.Match.fields.last_activity_at
          - entities.Match.fields.last_contact_at
        distinguishing_aspect: "On the Match supervision domain: with a fresh contact (15 days old, days_since_contact <= AMBER_CONTACT_DAYS) but a stale latest activity (50 days old, days_since_activity > AMBER_ACTIVITY_DAYS=45), a contact-only reading yields GREEN while an activity-aware reading yields AMBER; the scaffold pins OR-semantics so compliance_status == AMBER."
        test_recipe:
          setup:
            - "An ACTIVE Match whose only ActivityLog occurred 50 days ago and whose latest COMPLETED SupervisionContact was 15 days ago; clock at day 0 reference is 2026-04-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: Coordinator
            - call: "POST /volunteers"
              payload: { full_name: "V Act", email: "vact@x.com", gender: "FEMALE", home_zip: "30303", interest_tags: ["ARTS"], max_weekly_hours: 5 }
              as: Coordinator
              captures: { v_id: $.data.id }
            - call: "POST /volunteers/${v_id}/submit-screening"
              payload: {}
              as: BackgroundScreener
            - call: "GET /volunteers/${v_id}/background-checks"
              payload: {}
              as: BackgroundScreener
              captures: { bc0: "$.data[0].id", bc1: "$.data[1].id", bc2: "$.data[2].id"}
            - call: "POST /background-checks/${bc0}/adjudicate"
              payload: { decision: "CLEAR", adverse_findings: 0 }
              as: BackgroundScreener
            - call: "POST /background-checks/${bc1}/adjudicate"
              payload: { decision: "CLEAR", adverse_findings: 0 }
              as: BackgroundScreener
            - call: "POST /background-checks/${bc2}/adjudicate"
              payload: { decision: "CLEAR", adverse_findings: 0 }
              as: BackgroundScreener
            - call: "POST /guardians"
              payload: { full_name: "G Act", email: "gact@x.com", consent_on_file: true }
              as: Coordinator
              captures: { g_id: $.data.id }
            - call: "POST /children"
              payload: { guardian_id: "${g_id}", first_name: "Mia", age: 9, gender: "FEMALE", home_zip: "30303", interest_tags: ["ARTS"] }
              as: MatchSpecialist
              captures: { c_id: $.data.id, c_v: $.data.version }
            - call: "POST /children/${c_id}/propose-match"
              payload: { expected_child_version: "${c_v}" }
              as: MatchSpecialist
              captures: { prop_id: $.data.id }
            - call: "GET /volunteers/${v_id}"
              payload: {}
              as: MatchSpecialist
              captures: { v_v: $.data.version }
            - call: "POST /match-proposals/${prop_id}/accept"
              payload: { expected_volunteer_version: "${v_v}" }
              as: MatchSpecialist
              captures: { m_id: $.data.id }
            - call: "POST /matches/${m_id}/meetings"
              payload: { scheduled_start: "2026-01-02T10:00:00Z", scheduled_end: "2026-01-02T11:00:00Z", location: "Library" }
              as: MatchSpecialist
              captures: { mtg_id: $.data.id }
            - call: "POST /match-meetings/${mtg_id}/hold"
              payload: {}
              as: MatchSpecialist
            - call: "POST /match-meetings/${mtg_id}/affirm"
              payload: {}
              as: MatchSpecialist
            - call: "POST /matches/${m_id}/activities"
              payload: { occurred_at: "2026-02-10T00:00:00Z", duration_minutes: 90, activity_type: "OUTING" }
              as: MatchSpecialist
            - call: "GET /matches/${m_id}/supervision-contacts"
              payload: {}
              as: Supervisor
              captures: { sc_id: "$.data[0].id"}
            - call: "POST /supervision-contacts/${sc_id}/complete"
              payload: { contacted_at: "2026-03-17T00:00:00Z", party: "BIG" }
              as: Supervisor
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: Coordinator
            - call: "GET /matches/${m_id}"
              payload: {}
              as: Supervisor
              captures: { comp: $.data.compliance_status }
          assert:
            - "Match.${m_id}.compliance_status == AMBER (days_since_contact 15 <= 30, days_since_activity 50 > 45)"
            - "Match.${m_id}.last_activity_at == 2026-02-10T00:00:00Z"
            - "Match.${m_id}.last_contact_at == 2026-03-17T00:00:00Z"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: interest_score_three_input_nonlinear_mode_a
        grounds:
          - calculations.interest_compatibility_score
          - entities.MatchProposal.fields.compatibility_score
        distinguishing_aspect: "Mode (a): compatibility_score combines >=3 inputs with non-linear interaction — Jaccard ratio over tag sets, a conditional geo branch (1.0 iff zip3 equal), and a min-clamped capacity term min(max_weekly_hours, 10)/10 — yielding 0.67 for the pinned inputs (shared 2 / union 4 = 0.5, geo match, 8 hours)."
        test_recipe:
          setup:
            - "One eligible Volunteer interest_tags [SPORTS, STEM, MUSIC], zip3 02100, max_weekly_hours 8; Child interest_tags [SPORTS, STEM, ARTS], zip3 02100, consented."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: Coordinator
            - call: "POST /volunteers"
              payload: { full_name: "V Mode A", email: "vma@x.com", gender: "MALE", home_zip: "02101", interest_tags: ["SPORTS","STEM","MUSIC"], max_weekly_hours: 8 }
              as: Coordinator
              captures: { v_id: $.data.id }
            - call: "POST /volunteers/${v_id}/submit-screening"
              payload: {}
              as: BackgroundScreener
            - call: "GET /volunteers/${v_id}/background-checks"
              payload: {}
              as: BackgroundScreener
              captures: { bc0: "$.data[0].id", bc1: "$.data[1].id", bc2: "$.data[2].id"}
            - call: "POST /background-checks/${bc0}/adjudicate"
              payload: { decision: "CLEAR", adverse_findings: 0 }
              as: BackgroundScreener
            - call: "POST /background-checks/${bc1}/adjudicate"
              payload: { decision: "CLEAR", adverse_findings: 0 }
              as: BackgroundScreener
            - call: "POST /background-checks/${bc2}/adjudicate"
              payload: { decision: "CLEAR", adverse_findings: 0 }
              as: BackgroundScreener
            - call: "POST /guardians"
              payload: { full_name: "G MA", email: "gma@x.com", consent_on_file: true }
              as: Coordinator
              captures: { g_id: $.data.id }
            - call: "POST /children"
              payload: { guardian_id: "${g_id}", first_name: "Noah", age: 11, gender: "MALE", home_zip: "02109", interest_tags: ["SPORTS","STEM","ARTS"] }
              as: MatchSpecialist
              captures: { c_id: $.data.id, c_v: $.data.version }
          trigger:
            - call: "POST /children/${c_id}/propose-match"
              payload: { expected_child_version: "${c_v}" }
              as: MatchSpecialist
              captures: { prop_id: $.data.id, prop_score: $.data.compatibility_score }
          assert:
            - "MatchProposal.${prop_id}.compatibility_score == 0.67"
            - "MatchProposal.${prop_id}.volunteer_id == ${v_id}"

      - name: compliance_eval_order_pinned_mode_c
        grounds:
          - calculations.match_compliance_status
          - state_machines.SupervisionContact.OPEN_to_COMPLETED
          - entities.Match.fields.last_contact_at
        distinguishing_aspect: "Mode (c): completing a SupervisionContact mutates Match.last_contact_at AND opens the next contact whose due_at re-enters the staleness computation; the scaffold pins evaluation order (recompute last_contact_at from the just-completed contact, THEN evaluate the threshold). Before completion the Match would read RED (63 days since activation, no prior contact > RED_CONTACT_DAYS=60); the same completing call recomputes last_contact_at to the fresh contacted_at and the immediate read yields GREEN, proving the recompute-then-evaluate order."
        test_recipe:
          setup:
            - "An ACTIVE Match whose first SupervisionContact is still OPEN at clock day 63 (would read RED); its only activity is 38 days old."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
