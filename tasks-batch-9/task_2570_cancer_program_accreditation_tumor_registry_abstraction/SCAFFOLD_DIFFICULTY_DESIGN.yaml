  - rule_id: boundary_precision_check
    instances:
      - name: referral_lag_exactly_120_days_is_analytic_class_20_and_121_is_not
        grounds:
          - calculations.class_of_case_determination
          - entities.CasefindingEntry.fields.referral_lag_days
          - entities.CasefindingEntry.fields.class_of_case_code
          - entities.CasefindingEntry.fields.analytic_flag
          - endpoints[POST /cancer-registry/casefinding-sources/{sourceId}/entries]
        distinguishing_aspect: |
          The REFERRAL_ANALYTIC_MAX_DAYS comparison is inclusive: a referral lag of exactly 120
          days (diagnosed 2026-01-01, first contact 2026-05-01) yields CLASS_20 with
          analytic_flag true, while 121 days (first contact 2026-05-02) yields CLASS_31 with
          analytic_flag false — one day of difference moves the case out of every analytic
          denominator.
        test_recipe:
          setup:
            - "One program (reference_year 2018) with one PATHOLOGY casefinding source."
            - "No entries exist yet; the clock stays at its 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /cancer-registry/programs"
              payload: { name: "Alder Grove Cancer Program", coc_program_id: "COC-14561", annual_analytic_caseload: 620, reference_year: 2018, timeliness_standard_days: 180 }
