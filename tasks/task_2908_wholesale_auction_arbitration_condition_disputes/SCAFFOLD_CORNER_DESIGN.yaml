        excluded_because:
          difficulty_instance: cross_entity_state_dependency / psi_findings_waive_one_defect_class_but_not_another
          rationale: "That instance files two claims against the same COMPLETED inspection — one for a class in findings and one for a class outside it — which covers both the with-flag and without-flag halves of the conditional rule."

      - name: psi_window_overlap_excluded
        claim_type: temporal_validation
        grounds:
          - validations[priority 32 ERR_PSI_WINDOW_OVERLAP]
        excluded_because:
          difficulty_instance: boundary_condition_cluster / psi_window_half_open_rejects_at_minus_1s_and_admits_at_the_endpoint
          rationale: "That instance probes the half-open PSI interval one second before the endpoint and exactly at it."

