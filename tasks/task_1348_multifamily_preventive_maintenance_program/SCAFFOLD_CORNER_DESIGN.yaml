      - name: archived_property_blocks_all_child_mutation
        claim_type: cascading_side_effects
        grounds:
          - validations[priority=4]
          - errors[ERR_PROPERTY_ARCHIVED]
          - entities.Property.fields.status
        distinguishing_aspect: "Soft-archive layer: after POST /properties/{id}/archive, every child mutation (template create, plan create, batch create) is rejected with ERR_PROPERTY_ARCHIVED while GETs still succeed."
        test_recipe:
          setup: ["Property archived"]
          setup_api_calls:
            - call: "POST /properties"
              payload: { property_code: "CC-P2", display_name: "CC P2", notice_lead_hours: 24, default_labor_rate_cents_per_hour: 6000 }
              as: PropertyManager
              captures: { p_id: $.data.id }
            - call: "POST /properties/${p_id}/archive"
              payload: {}
              as: PropertyManager
          trigger:
            - call: "POST /properties/${p_id}/pm-task-templates"
              payload: { component_type: "HVAC", task_name: "X", frequency_days: 90, estimated_labor_minutes: 30, requires_evidence: false, effective_from: "2026-01-01T00:00:00Z" }
              as: PropertyManager
              captures: { err1: $.data.error_id }
            - call: "GET /properties/${p_id}"
              payload: {}
              as: PropertyManager
              captures: { st: $.data.status }
          assert:
            - "err1 == ERR_PROPERTY_ARCHIVED (409) on template create"
            - "GET still returns the property with status == ARCHIVED"

