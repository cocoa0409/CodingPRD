              payload: { current_utc: "2026-11-15T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /safety/incidents/${inc_id}/appeals/outcome"
              payload: { adjudication: "OVERTURNED", review_notes: "New exculpatory record received; the deactivation is overturned on review.", commit_early: false, expected_incident_version: "${inc_v_appealed}" }
              as: SafetyAppealReviewer
