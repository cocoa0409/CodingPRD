# =============================================================================
# task_0976_airport_meet_assist_wheelchair — SCAFFOLD.yaml (§1.0–§1.7)
# =============================================================================

scenario: |
  976. Airport Meet-&-Assist & Wheelchair Service: request & flight/segment,
  agent assignment & terminal, wheelchair/escort & TSA, connection & gate
  transfer, unaccompanied-minor & senior, billing (airline/private), incident,
  tracking

domain_name: airport-meet-assist
api_prefix: /maa

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - temporal_windowing
    - selector_policy
    - derived_field_reconciliation
  entity_topology: hybrid            # Airport→Terminal→FlightSegment tree + cross-cutting AssistRequest/Agent/Assignment
  state_machine_shape: compound      # AssistRequest.status derived from ServiceLeg children + independent billing dimension
  relationship_patterns:
    - one_to_many
    - cross_aggregate                # Assignment references Agent + ServiceLeg + WheelchairAsset across aggregates
    - self_referential               # ServiceLeg.onward_leg_id for connection chains
  role_model: segregation_of_duties  # Requester != Assigner != Confirmer != BillSettler
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — emit verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Airport
    parent: null
    common_fields: true
    fields:
      - { name: iata_code, type: string, source: input, description: "3-letter IATA airport code, globally unique (e.g. SFO)" }
      - { name: tz_offset_minutes, type: integer, source: input, description: "Airport local-time offset from UTC in minutes (e.g. -420 for PDT)" }
      - { name: meet_buffer_minutes, type: integer, source: input, description: "Required buffer (minutes) between agent landing-time and pick-up; must be >= 15" }
      - { name: posture, type: enum, source: system, description: "NORMAL | DEGRADED | LOCKDOWN", default: NORMAL }
      - { name: ops_epoch, type: integer, source: system, description: "Batch tick counter, incremented by POST /maa/airports/{id}/run_ops" }

  - name: Terminal
    parent: Airport
    common_fields: true
    fields:
      - { name: airport_id, type: string, source: system, description: "FK -> Airport.id; owning airport" }
      - { name: code, type: string, source: input, description: "Terminal code (e.g. T1, INTL); unique within the airport" }
      - { name: requires_secure_escort, type: boolean, source: input, description: "True when terminal is airside-only and any escort through it requires a TSA-cleared agent" }
      - { name: status, type: enum, source: system, description: "OPEN | CLOSED", default: OPEN }

  - name: FlightSegment
    parent: Airport
    common_fields: true
    fields:
      - { name: airport_id, type: string, source: system, description: "FK -> Airport.id; airport at which the segment departs or arrives" }
      - { name: flight_no, type: string, source: input, description: "Carrier flight number (e.g. UA1234)" }
      - { name: direction, type: enum, source: input, description: "ARRIVAL | DEPARTURE" }
      - { name: terminal_id, type: string, source: input, description: "FK -> Terminal.id; terminal this segment uses" }
      - { name: scheduled_utc, type: datetime, source: input, description: "Scheduled arrival or departure instant, UTC" }
      - { name: actual_utc, type: datetime, source: input, description: "Actual arrival/departure instant once known; null until marked", default: null }
      - { name: status, type: enum, source: system, description: "SCHEDULED | LANDED | DEPARTED | CANCELLED", default: SCHEDULED }

  - name: Passenger
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Passenger legal name" }
      - { name: dob, type: string, source: input, description: "Date of birth ISO-8601 (YYYY-MM-DD); drives UMNR vs SENIOR tier" }
      - { name: mobility_code, type: enum, source: input, description: "WCHR (can walk short) | WCHS (cannot do stairs) | WCHC (fully immobile)" }
      - { name: passenger_class, type: enum, source: computed, description: "ADULT | SENIOR | UMNR; derived from dob and request-time clock" }
      - { name: airline_pnr, type: string, source: input, description: "Booking PNR used to link to airline billing" }
      - { name: private_card_token, type: string, source: input, description: "Opaque card token for private-pay billing; required only when bill_to=PRIVATE" }

  - name: Agent
    parent: Airport
    common_fields: true
    fields:
      - { name: airport_id, type: string, source: system, description: "FK -> Airport.id; home airport" }
      - { name: display_name, type: string, source: input, description: "Agent display name" }
      - { name: tsa_cleared_until, type: datetime, source: input, description: "TSA escort credential expiry (UTC). Agent may take TSA-required assignments iff tsa_cleared_until > now" }
      - { name: ummr_certified, type: boolean, source: input, description: "True if certified to escort unaccompanied minors" }
      - { name: senior_trained, type: boolean, source: input, description: "True if trained for senior assistance" }
      - { name: wc_certified, type: boolean, source: input, description: "True if certified to push WCHC wheelchairs" }
      - { name: shift_start_utc, type: datetime, source: input, description: "Current-shift start UTC" }
      - { name: shift_end_utc, type: datetime, source: input, description: "Current-shift end UTC; must be > shift_start_utc and <= shift_start_utc + 12h" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED | OFF_SHIFT", default: ACTIVE }
      - { name: active_assignment_count, type: integer, source: computed, description: "Number of ASSIGNMENT rows with status IN {DISPATCHED, AT_PICKUP, IN_TRANSIT}; used as load-balancing tiebreak" }
      - { name: cumulative_delay_minutes, type: integer, source: computed, description: "Sum of (completed_at - scheduled_completion) across agent's COMPLETED assignments in the current ops_epoch; drives SLI risk" }

  - name: WheelchairAsset
    parent: Airport
    common_fields: true
    fields:
      - { name: airport_id, type: string, source: system, description: "FK -> Airport.id" }
      - { name: asset_tag, type: string, source: input, description: "Unique asset tag within the airport" }
      - { name: chair_class, type: enum, source: input, description: "MANUAL | POWER | BARIATRIC" }
      - { name: is_wchc_rated, type: boolean, source: input, description: "True iff chair rated for WCHC passengers" }
      - { name: status, type: enum, source: system, description: "AVAILABLE | CHECKED_OUT | MAINTENANCE | RETIRED", default: AVAILABLE }
      - { name: last_maintenance_utc, type: datetime, source: system, description: "Set on MAINTENANCE → AVAILABLE transition; null initially", default: null }
      - { name: usage_count, type: integer, source: system, description: "Increments on each CHECK_OUT; chair MUST enter MAINTENANCE when usage_count reaches MAINT_INTERVAL", default: 0 }

  - name: AssistRequest
    parent: null
    common_fields: true
    fields:
      - { name: passenger_id, type: string, source: input, description: "FK -> Passenger.id" }
      - { name: bill_to, type: enum, source: input, description: "AIRLINE | PRIVATE" }
      - { name: service_tier, type: enum, source: input, description: "STANDARD | PRIORITY | CONCIERGE" }
      - { name: request_status, type: enum, source: system, description: "DRAFT | SUBMITTED | ASSIGNED | IN_SERVICE | COMPLETED | CANCELLED | FAILED", default: DRAFT }
      - { name: billing_status, type: enum, source: system, description: "UNBILLED | PROVISIONAL | FINALIZED | PAID | DISPUTED | WRITTEN_OFF", default: UNBILLED, note: "parallel dimension orthogonal to request_status" }
      - { name: provisional_charge_cents, type: integer, source: computed, description: "Forward-looking charge estimated at SUBMITTED time; uses scheduled_utc" }
      - { name: final_charge_cents, type: integer, source: computed, description: "Chronological charge re-computed at COMPLETED using actual_utc; null until finalize", default: null }
      - { name: companion_count, type: integer, source: input, description: "Non-passenger companions travelling; affects pricing", default: 0 }
      - { name: umnr_handoff_required, type: boolean, source: input, description: "True iff any leg must satisfy UMNR dual-signer handoff", default: false }
      - { name: sofia_signoff_by, type: string, source: system, description: "Agent user id who performed first UMNR sign-off; null until first sign", default: null }

  - name: ServiceLeg
    parent: AssistRequest
    common_fields: true
    fields:
      - { name: assist_request_id, type: string, source: system, description: "FK -> AssistRequest.id" }
      - { name: segment_id, type: string, source: input, description: "FK -> FlightSegment.id this leg serves" }
      - { name: leg_kind, type: enum, source: input, description: "MEET_ARRIVAL | DEPARTURE_ESCORT | CONNECTION_TRANSFER" }
      - { name: onward_leg_id, type: string, source: input, description: "FK -> ServiceLeg.id; set only for CONNECTION_TRANSFER — points at the next leg of the same request (self-referential)", default: null }
      - { name: pickup_zone, type: string, source: input, description: "Curbside/gate pickup zone label" }
      - { name: status, type: enum, source: system, description: "PLANNED | DISPATCHED | AT_PICKUP | IN_TRANSIT | AT_GATE | HANDED_OFF | COMPLETED | NO_SHOW | CANCELLED | FAILED", default: PLANNED }
      - { name: scheduled_pickup_utc, type: datetime, source: computed, description: "Derived from segment.scheduled_utc and airport.meet_buffer_minutes at leg creation" }
      - { name: actual_pickup_utc, type: datetime, source: system, description: "Set on AT_PICKUP transition", default: null }
      - { name: completed_utc, type: datetime, source: system, description: "Set on COMPLETED transition", default: null }
      - { name: requires_wheelchair, type: boolean, source: computed, description: "True iff passenger.mobility_code IN {WCHS, WCHC}" }
      - { name: requires_tsa_escort, type: boolean, source: computed, description: "True iff terminal.requires_secure_escort OR segment is international AND leg_kind != MEET_ARRIVAL" }
      - { name: requires_ummr_agent, type: boolean, source: computed, description: "True iff passenger.passenger_class == UMNR" }
      - { name: requires_senior_agent, type: boolean, source: computed, description: "True iff passenger.passenger_class == SENIOR" }
      - { name: requires_wchc_chair, type: boolean, source: computed, description: "True iff passenger.mobility_code == WCHC" }
      - { name: provisional_leg_cents, type: integer, source: computed, description: "Forward-looking charge for this leg, computed at AssistRequest SUBMIT" }
      - { name: final_leg_cents, type: integer, source: computed, description: "Chronological charge, computed at leg COMPLETED; null until then", default: null }

  - name: Assignment
    parent: AssistRequest
    common_fields: true
    fields:
      - { name: assist_request_id, type: string, source: system, description: "FK -> AssistRequest.id" }
      - { name: service_leg_id, type: string, source: input, description: "FK -> ServiceLeg.id" }
      - { name: agent_id, type: string, source: system, description: "FK -> Agent.id; selected by the dispatcher via selector policy" }
      - { name: wheelchair_asset_id, type: string, source: system, description: "FK -> WheelchairAsset.id; selected when leg.requires_wheelchair", default: null }
      - { name: status, type: enum, source: system, description: "DISPATCHED | AT_PICKUP | IN_TRANSIT | AT_GATE | COMPLETED | NO_SHOW | CANCELLED | FAILED", default: DISPATCHED }
      - { name: assigned_by_user_id, type: string, source: system, description: "User id of the Dispatcher who dispatched; segregation-of-duties guard vs completed_by_user_id" }
      - { name: completed_by_user_id, type: string, source: system, description: "User id who confirmed COMPLETED; MUST differ from assigned_by_user_id", default: null }
      - { name: umnr_second_signoff_user_id, type: string, source: system, description: "Required for UMNR legs before HANDED_OFF: a distinct user from both assigned_by and completed_by", default: null }
      - { name: scheduled_completion_utc, type: datetime, source: computed, description: "Leg scheduled_pickup_utc + estimate_transfer_minutes(leg)" }
      - { name: tracking_token, type: string, source: system, description: "Opaque token used by POST /maa/tracking to publish pings for THIS assignment" }

  - name: Incident
    parent: AssistRequest
    common_fields: true
    fields:
      - { name: assist_request_id, type: string, source: system, description: "FK -> AssistRequest.id" }
      - { name: assignment_id, type: string, source: input, description: "FK -> Assignment.id in which the incident occurred" }
      - { name: kind, type: enum, source: input, description: "FALL | MISSED_CONNECTION | MEDICAL | PROPERTY_DAMAGE | SECURITY" }
      - { name: severity, type: enum, source: input, description: "MINOR | MAJOR | CRITICAL" }
      - { name: description, type: string, source: input, description: "Free text" }
      - { name: status, type: enum, source: system, description: "OPEN | ACKED | RESOLVED", default: OPEN }
      - { name: opened_at_utc, type: datetime, source: system, description: "Server-stamped at creation" }

  - name: Invoice
    parent: AssistRequest
    common_fields: true
    fields:
      - { name: assist_request_id, type: string, source: system, description: "FK -> AssistRequest.id" }
      - { name: invoice_kind, type: enum, source: system, description: "PROVISIONAL | FINAL | ADJUSTMENT" }
      - { name: amount_cents, type: integer, source: computed, description: "Sum of leg charges for the covered legs" }
      - { name: status, type: enum, source: system, description: "OPEN | PAID | DISPUTED | WRITTEN_OFF | VOID", default: OPEN }
      - { name: bill_to, type: enum, source: system, description: "Copied from AssistRequest at creation: AIRLINE | PRIVATE" }
      - { name: supersedes_invoice_id, type: string, source: input, description: "FK -> Invoice.id; for ADJUSTMENT invoices, points at the invoice this one replaces", default: null }

  - name: TrackingEvent
    parent: Assignment
    common_fields: false
    fields:
      - { name: assignment_id, type: string, source: system, description: "FK -> Assignment.id" }
      - { name: event_kind, type: enum, source: input, description: "LOCATION_PING | PICKUP_CONFIRM | GATE_ARRIVAL | HANDOFF_START | HANDOFF_COMPLETE" }
      - { name: lat, type: number, source: input, description: "Latitude, optional for non-LOCATION_PING", default: null }
      - { name: lon, type: number, source: input, description: "Longitude", default: null }
      - { name: occurred_at_utc, type: datetime, source: input, description: "When the event happened; server rejects occurred_at_utc in the future" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Airport
    field: posture
    initial_state: NORMAL
    terminal_states: []
    transitions:
      - from: NORMAL
        to: DEGRADED
        trigger: POST /maa/airports/{id}/posture
        actor: OpsManager
        preconditions: []
        side_effects:
          - "All AssistRequests at this airport with request_status IN {SUBMITTED, ASSIGNED} have their provisional_charge_cents recomputed with the DEGRADED multiplier (1.25x) and AssistRequest.version increments"
      - from: DEGRADED
        to: LOCKDOWN
        trigger: POST /maa/airports/{id}/posture
        actor: OpsManager
        preconditions: []
        side_effects:
          - "All ServiceLegs with status IN {PLANNED, DISPATCHED, AT_PICKUP} at this airport → CANCELLED with cancel_reason=LOCKDOWN"
          - "Each cancelled leg bubbles to its parent AssistRequest: if every ServiceLeg of the request is in {CANCELLED, FAILED}, request_status → FAILED"
          - "WheelchairAssets in CHECKED_OUT whose assignment's leg was just cancelled transition to AVAILABLE (usage_count not decremented)"
      - from: DEGRADED
        to: NORMAL
        trigger: POST /maa/airports/{id}/posture
        actor: OpsManager
        preconditions: []
        side_effects:
          - "Provisional charges recomputed with the NORMAL multiplier (1.00x) on all request_status IN {SUBMITTED, ASSIGNED} rows"
      - from: LOCKDOWN
        to: NORMAL
        trigger: POST /maa/airports/{id}/posture
        actor: OpsManager
        preconditions: []
        side_effects:
          - "Does NOT auto-revive CANCELLED legs — dispatcher must re-book"

  - entity: Agent
    field: status
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: POST /maa/agents/{id}/events (SUSPEND)
        actor: OpsManager
        preconditions: []
        side_effects:
          - "All Assignments for this agent with status IN {DISPATCHED, AT_PICKUP, IN_TRANSIT} → CANCELLED; each cancellation fires the unassign cascade on its ServiceLeg (ServiceLeg.status → PLANNED, scheduled_pickup_utc unchanged, agent_id cleared via assignment removal)"
          - "WheelchairAssets referenced by those cancelled assignments transition CHECKED_OUT → AVAILABLE (usage_count NOT decremented)"
      - from: SUSPENDED
        to: ACTIVE
        trigger: POST /maa/agents/{id}/events (REINSTATE)
        actor: OpsManager
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: OFF_SHIFT
        trigger: system (ops_epoch advance observes now_utc > shift_end_utc)
        actor: system
        preconditions: []
        side_effects:
          - "Same cascade as SUSPEND: in-flight assignments → CANCELLED; legs → PLANNED; chairs released"

  - entity: WheelchairAsset
    field: status
    initial_state: AVAILABLE
    terminal_states: [RETIRED]
    transitions:
      - from: AVAILABLE
        to: CHECKED_OUT
        trigger: system (Assignment created referencing this chair)
        actor: system
        preconditions:
          - "WheelchairAsset.status == AVAILABLE"
          - "If ServiceLeg.requires_wchc_chair then WheelchairAsset.is_wchc_rated == true"
        side_effects:
          - "usage_count += 1"
          - "If usage_count >= MAINT_INTERVAL (50) after the increment, status remains CHECKED_OUT for the active assignment but the chair becomes ineligible for new checkouts until maintenance completes"
      - from: CHECKED_OUT
        to: AVAILABLE
        trigger: system (Assignment reaches COMPLETED or CANCELLED or NO_SHOW)
        actor: system
        preconditions: []
        side_effects:
          - "If usage_count >= MAINT_INTERVAL (50), status transitions to MAINTENANCE instead of AVAILABLE"
      - from: CHECKED_OUT
        to: MAINTENANCE
        trigger: system (usage_count threshold reached at check-in)
        actor: system
        preconditions: []
        side_effects: []
      - from: AVAILABLE
        to: MAINTENANCE
        trigger: POST /maa/wheelchairs/{id}/events (SCHEDULE_MAINTENANCE)
        actor: OpsManager
        preconditions: []
        side_effects: []
      - from: MAINTENANCE
        to: AVAILABLE
        trigger: POST /maa/wheelchairs/{id}/events (COMPLETE_MAINTENANCE)
        actor: OpsManager
        preconditions: []
        side_effects:
          - "usage_count reset to 0"
          - "last_maintenance_utc := current logical clock"
      - from: MAINTENANCE
        to: RETIRED
        trigger: POST /maa/wheelchairs/{id}/events (RETIRE)
        actor: OpsManager
        preconditions:
          - "No Assignment references this chair with status IN {DISPATCHED, AT_PICKUP, IN_TRANSIT, AT_GATE}"
        side_effects: []

  - entity: AssistRequest
    field: request_status
    initial_state: DRAFT
    terminal_states: [COMPLETED, CANCELLED, FAILED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: POST /maa/assist-requests/{id}/events (SUBMIT)
        actor: Requester
        preconditions:
          - "Request has >= 1 ServiceLeg (ERR_NO_LEGS)"
          - "If bill_to == PRIVATE then Passenger.private_card_token is non-empty (ERR_PAYMENT_METHOD_REQUIRED)"
          - "If bill_to == AIRLINE then Passenger.airline_pnr is non-empty"
          - "For every ServiceLeg, its segment.airport.posture != LOCKDOWN"
        side_effects:
          - "provisional_charge_cents computed via provisional_charge formula (forward-looking)"
          - "billing_status := PROVISIONAL"
          - "A PROVISIONAL Invoice is created with amount_cents = provisional_charge_cents"
      - from: SUBMITTED
        to: ASSIGNED
        trigger: system (every PLANNED ServiceLeg now has >= 1 DISPATCHED Assignment)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ASSIGNED
        to: IN_SERVICE
        trigger: system (first Assignment transitions to AT_PICKUP)
        actor: system
        preconditions: []
        side_effects: []
      - from: IN_SERVICE
        to: COMPLETED
        trigger: system (every ServiceLeg reaches a terminal state in {COMPLETED} — no CANCELLED/FAILED legs present) AND last COMPLETED leg has been billed
        actor: system
        preconditions:
          - "billing_status != DISPUTED"
        side_effects:
          - "final_charge_cents computed via final_charge formula (chronological, uses actual_utc)"
          - "billing_status := FINALIZED"
          - "A FINAL Invoice is created with amount_cents = final_charge_cents, supersedes_invoice_id = the PROVISIONAL invoice; the PROVISIONAL invoice transitions OPEN → VOID"
      - from: DRAFT
        to: CANCELLED
        trigger: POST /maa/assist-requests/{id}/events (CANCEL)
        actor: Requester
        preconditions: []
        side_effects: []
      - from: SUBMITTED
        to: CANCELLED
        trigger: POST /maa/assist-requests/{id}/events (CANCEL)
        actor: Requester
        preconditions:
          - "No Assignment exists in {AT_PICKUP, IN_TRANSIT, AT_GATE} (ERR_ALREADY_IN_SERVICE)"
        side_effects:
          - "All DISPATCHED Assignments → CANCELLED; chairs released"
          - "PROVISIONAL invoice (if any) → VOID; billing_status := UNBILLED"
      - from: SUBMITTED
        to: FAILED
        trigger: system (airport LOCKDOWN cascade cancels all legs)
        actor: system
        preconditions: []
        side_effects:
          - "PROVISIONAL invoice → VOID; billing_status := UNBILLED"
      - from: ASSIGNED
        to: FAILED
        trigger: system (airport LOCKDOWN cascade)
        actor: system
        preconditions: []
        side_effects:
          - "All in-flight Assignments → CANCELLED; PROVISIONAL invoice → VOID; billing_status := UNBILLED"
      - from: IN_SERVICE
        to: FAILED
        trigger: system (all remaining legs reach CANCELLED or FAILED)
        actor: system
        preconditions: []
        side_effects:
          - "PROVISIONAL invoice → VOID; billing_status := UNBILLED"

  - entity: AssistRequest
    field: billing_status
    note: parallel dimension on AssistRequest — independent of request_status
    transitions:
      - from: PROVISIONAL
        to: FINALIZED
        trigger: system (all legs COMPLETED → final charge recomputed)"
        actor: system
        preconditions: []
        side_effects:
          - "FINAL Invoice created, PROVISIONAL invoice → VOID"
      - from: FINALIZED
        to: PAID
        trigger: POST /maa/invoices/{id}/events (MARK_PAID) on the FINAL invoice
        actor: BillingClerk
        preconditions: []
        side_effects: []
      - from: FINALIZED
        to: DISPUTED
        trigger: POST /maa/invoices/{id}/events (DISPUTE) on the FINAL invoice
        actor: BillingClerk
        preconditions: []
        side_effects:
          - "AssistRequest.request_status is unchanged; DISPUTED blocks only the settlement step"
      - from: DISPUTED
        to: PAID
        trigger: POST /maa/invoices/{id}/events (RESOLVE_PAID)
        actor: BillingClerk
        preconditions: []
        side_effects: []
      - from: DISPUTED
        to: WRITTEN_OFF
        trigger: POST /maa/invoices/{id}/events (WRITE_OFF)
        actor: BillingClerk
        preconditions:
          - "If bill_to == AIRLINE then the writing-off clerk MUST differ from the clerk who created the PROVISIONAL invoice (segregation-of-duties on airline write-off)"
        side_effects: []

  - entity: ServiceLeg
    field: status
    initial_state: PLANNED
    terminal_states: [COMPLETED, NO_SHOW, CANCELLED, FAILED]
    transitions:
      - from: PLANNED
        to: DISPATCHED
        trigger: POST /maa/legs/{id}/dispatch (creates Assignment via selector)"
        actor: Dispatcher
        preconditions:
          - "AssistRequest.request_status IN {SUBMITTED, ASSIGNED}"
          - "Airport.posture != LOCKDOWN"
          - "If leg.requires_tsa_escort then at least one candidate Agent has tsa_cleared_until > now"
        side_effects:
          - "Assignment created with status DISPATCHED; Agent.active_assignment_count += 1"
          - "If requires_wheelchair, a WheelchairAsset is selected and transitions AVAILABLE → CHECKED_OUT (usage_count += 1)"
          - "If every sibling leg is DISPATCHED-or-later, parent AssistRequest.request_status SUBMITTED → ASSIGNED"
      - from: DISPATCHED
        to: AT_PICKUP
        trigger: POST /maa/assignments/{id}/events (ARRIVE_PICKUP)
        actor: Agent
        preconditions:
          - "Assignment.agent_id == X-User-ID"
          - "Airport.posture != LOCKDOWN"
        side_effects:
          - "ServiceLeg.actual_pickup_utc := now"
          - "Parent AssistRequest.request_status transitions ASSIGNED → IN_SERVICE on first AT_PICKUP"
      - from: AT_PICKUP
        to: IN_TRANSIT
        trigger: POST /maa/assignments/{id}/events (DEPART_PICKUP)
        actor: Agent
        preconditions: []
        side_effects: []
      - from: IN_TRANSIT
        to: AT_GATE
        trigger: POST /maa/assignments/{id}/events (ARRIVE_GATE)
        actor: Agent
        preconditions: []
        side_effects: []
      - from: AT_GATE
        to: HANDED_OFF
        trigger: POST /maa/assignments/{id}/events (HANDOFF)
        actor: Agent
        preconditions:
          - "If ServiceLeg.requires_ummr_agent then payload.umnr_second_signoff_user_id MUST be present and MUST differ from both Assignment.assigned_by_user_id and the acting Agent's user id (segregation-of-duties: UMNR dual-signer)"
        side_effects:
          - "Assignment.umnr_second_signoff_user_id persisted when applicable"
      - from: HANDED_OFF
        to: COMPLETED
        trigger: POST /maa/assignments/{id}/events (COMPLETE)
        actor: Confirmer
        preconditions:
          - "Confirmer user id MUST differ from Assignment.assigned_by_user_id (segregation-of-duties: dispatcher cannot confirm own dispatch)"
        side_effects:
          - "Assignment.completed_by_user_id := X-User-ID"
          - "WheelchairAsset CHECKED_OUT → AVAILABLE (or → MAINTENANCE if usage_count threshold reached)"
          - "Agent.active_assignment_count -= 1; Agent.cumulative_delay_minutes += max(0, completed_utc - scheduled_completion_utc) / 60s"
          - "ServiceLeg.completed_utc := now; final_leg_cents computed via chronological formula"
          - "If leg was a CONNECTION_TRANSFER and onward_leg_id set: the onward leg's scheduled_pickup_utc is recomputed as max(scheduled_pickup_utc, completed_utc + onward_segment.airport.meet_buffer_minutes) and onward leg's provisional_leg_cents is recomputed"
          - "If every sibling ServiceLeg is in {COMPLETED}: parent AssistRequest IN_SERVICE → COMPLETED; final charge computed; FINAL invoice issued; PROVISIONAL invoice voided"
      - from: DISPATCHED
        to: NO_SHOW
        trigger: POST /maa/assignments/{id}/events (MARK_NO_SHOW)
        actor: Dispatcher
        preconditions:
          - "now_utc > ServiceLeg.scheduled_pickup_utc + 30 minutes"
        side_effects:
          - "Chair released CHECKED_OUT → AVAILABLE"
          - "Agent.active_assignment_count -= 1"
          - "Parent AssistRequest: if every other leg is terminal, request_status → FAILED"
      - from: PLANNED
        to: CANCELLED
        trigger: POST /maa/assist-requests/{id}/events (CANCEL) bubbles down OR airport LOCKDOWN cascade
        actor: system
        preconditions: []
        side_effects: []
      - from: DISPATCHED
        to: CANCELLED
        trigger: POST /maa/assignments/{id}/events (CANCEL_ASSIGN) OR Agent SUSPEND cascade OR LOCKDOWN cascade
        actor: "Dispatcher | system"
        preconditions: []
        side_effects:
          - "Chair released; Agent.active_assignment_count -= 1; ServiceLeg.status → PLANNED only when the cancel was an agent-suspend (rebookable); for direct CANCEL_ASSIGN and LOCKDOWN cancels, ServiceLeg.status := CANCELLED"

  - entity: Assignment
    field: status
    initial_state: DISPATCHED
    terminal_states: [COMPLETED, NO_SHOW, CANCELLED, FAILED]
    transitions:
      - from: DISPATCHED
        to: AT_PICKUP
        trigger: POST /maa/assignments/{id}/events (ARRIVE_PICKUP)
        actor: Agent
        preconditions: []
        side_effects:
          - "Drives parent ServiceLeg DISPATCHED → AT_PICKUP"
      - from: AT_PICKUP
        to: IN_TRANSIT
        trigger: POST /maa/assignments/{id}/events (DEPART_PICKUP)
        actor: Agent
        preconditions: []
        side_effects:
          - "Drives parent ServiceLeg AT_PICKUP → IN_TRANSIT"
      - from: IN_TRANSIT
        to: AT_GATE
        trigger: POST /maa/assignments/{id}/events (ARRIVE_GATE)
        actor: Agent
        preconditions: []
        side_effects:
          - "Drives parent ServiceLeg IN_TRANSIT → AT_GATE"
      - from: AT_GATE
        to: COMPLETED
        trigger: POST /maa/assignments/{id}/events (HANDOFF then COMPLETE) — modeled as a single combined transition for the assignment
        actor: Agent
        preconditions:
          - "HANDOFF preconditions on the parent leg already applied"
        side_effects:
          - "Assignment.COMPLETED via the leg-level HANDED_OFF → COMPLETED chain"

  - entity: Incident
    field: status
    initial_state: OPEN
    terminal_states: [RESOLVED]
    transitions:
      - from: OPEN
        to: ACKED
        trigger: POST /maa/incidents/{id}/events (ACK)
        actor: OpsManager
        preconditions: []
        side_effects: []
      - from: ACKED
        to: RESOLVED
        trigger: POST /maa/incidents/{id}/events (RESOLVE)
        actor: OpsManager
        preconditions: []
        side_effects:
          - "If severity == CRITICAL and the linked Assignment's agent is ACTIVE: Agent.status → SUSPENDED (cascade fires the agent-suspend unassign chain)"
          - "If severity == CRITICAL and kind == PROPERTY_DAMAGE and AssistRequest.billing_status == FINALIZED: an ADJUSTMENT Invoice is created crediting 20% of final_charge_cents; supersedes_invoice_id points at the FINAL invoice (which transitions OPEN → VOID if still OPEN)"

  - entity: Invoice
    field: status
    initial_state: OPEN
    terminal_states: [PAID, WRITTEN_OFF, VOID]
    transitions:
      - from: OPEN
        to: PAID
        trigger: POST /maa/invoices/{id}/events (MARK_PAID)
        actor: BillingClerk
        preconditions:
          - "Invoice.invoice_kind == FINAL (PROVISIONAL invoices are not directly payable)"
        side_effects:
          - "Parent AssistRequest.billing_status := PAID"
      - from: OPEN
        to: DISPUTED
        trigger: POST /maa/invoices/{id}/events (DISPUTE)
        actor: BillingClerk
        preconditions: []
        side_effects:
          - "Parent AssistRequest.billing_status := DISPUTED"
      - from: DISPUTED
        to: PAID
        trigger: POST /maa/invoices/{id}/events (RESOLVE_PAID)
        actor: BillingClerk
        preconditions: []
        side_effects:
          - "Parent AssistRequest.billing_status := PAID"
      - from: DISPUTED
        to: WRITTEN_OFF
        trigger: POST /maa/invoices/{id}/events (WRITE_OFF)
        actor: BillingClerk
        preconditions:
          - "Segregation-of-duties: clerk user id MUST differ from the clerk who created the PROVISIONAL invoice when bill_to == AIRLINE"
        side_effects:
          - "Parent AssistRequest.billing_status := WRITTEN_OFF"
      - from: OPEN
        to: VOID
        trigger: system (superseded by a FINAL or ADJUSTMENT invoice; or parent request cancelled/failed)"
        actor: system
        preconditions: []
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (OCC)
# =============================================================================
concurrency_rules:
  - rule_id: assist-request-submit-stale-version
    parent_entity: AssistRequest
    write_endpoint: "POST /maa/assist-requests/{id}/events"
    occ_field: "expected_assist_request_version"
    description: |
      A SUBMIT or CANCEL posted against an AssistRequest whose version has advanced since the client last
      observed it is rejected. Captures the case where another writer has just mutated the request (e.g.,
      a cascading posture recompute bumped provisional_charge_cents and version) and the current writer's
      view of provisional_charge_cents and request_status is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: invoice-settle-stale-version
    parent_entity: Invoice
    write_endpoint: "POST /maa/invoices/{id}/events"
    occ_field: "expected_invoice_version"
    description: |
      A MARK_PAID / DISPUTE / RESOLVE_PAID / WRITE_OFF posted against an Invoice whose version has
      advanced since the client last observed it is rejected. Captures the case where another clerk has
      just posted a settlement event on the same invoice, or a system cascade has voided it, and the
      current clerk's view of status and amount_cents is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: dispatch-stale-request-version
    parent_entity: AssistRequest
    write_endpoint: "POST /maa/legs/{id}/dispatch"
    occ_field: "expected_assist_request_version"
    description: |
      A dispatch against a ServiceLeg whose parent AssistRequest.version has advanced since the dispatcher
      last observed it is rejected. Two dispatchers sequentially dispatching legs of the same request —
      where the first dispatch legitimately moved the parent from SUBMITTED to ASSIGNED — leave the second
      dispatcher holding a stale view of request_status and provisional_charge_cents.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: provisional_leg_charge
    trigger: "AssistRequest SUBMIT (one invocation per ServiceLeg) and posture change (NORMAL↔DEGRADED) recompute"
    algorithm: tiered_pricing
    formula: |
      base_cents      = PER_LEG_BASE_CENTS[leg_kind]                         # MEET_ARRIVAL 6000, DEPARTURE_ESCORT 7500, CONNECTION_TRANSFER 9500
      tier_mult_bp    = TIER_MULT_BP[service_tier]                           # STANDARD 10000, PRIORITY 12500, CONCIERGE 15000 (basis points)
      posture_mult_bp = POSTURE_MULT_BP[airport.posture]                     # NORMAL 10000, DEGRADED 12500, LOCKDOWN n/a (request cancelled)
      companion_fee_c = companion_count * COMPANION_FEE_CENTS                # 1500 per companion
      equipment_fee_c = (requires_wchc_chair ? WCHC_FEE_CENTS : (requires_wheelchair ? WCHR_FEE_CENTS : 0))
      ummr_fee_c      = (requires_ummr_agent ? UMMR_FEE_CENTS : 0)
      senior_fee_c    = (requires_senior_agent ? SENIOR_FEE_CENTS : 0)
      tsa_fee_c       = (requires_tsa_escort ? TSA_ESCORT_FEE_CENTS : 0)
      # PINNED ROUNDING ORDER (mode b): round per-leg THEN sum across legs at request level
      provisional_leg_cents =
          round_half_up( (base_cents + companion_fee_c + equipment_fee_c + ummr_fee_c + senior_fee_c + tsa_fee_c)
                         * tier_mult_bp / 10000 * posture_mult_bp / 10000 )
    input_set: "All ServiceLegs of the AssistRequest in any non-terminal status (PLANNED, DISPATCHED, AT_PICKUP, IN_TRANSIT, AT_GATE, HANDED_OFF)"
    constants:
      MEET_ARRIVAL_BASE_CENTS: 6000
      DEPARTURE_ESCORT_BASE_CENTS: 7500
      CONNECTION_TRANSFER_BASE_CENTS: 9500
      COMPANION_FEE_CENTS: 1500
      WCHR_FEE_CENTS: 800
      WCHC_FEE_CENTS: 1800
      UMMR_FEE_CENTS: 2500
      SENIOR_FEE_CENTS: 900
      TSA_ESCORT_FEE_CENTS: 1200
    precision: "0 decimal places (integer cents), round_half_up after the two multiplications in the order (tier then posture)"
    variants:
      - name: provisional
        when: "computed at SUBMIT using segment.scheduled_utc and the airport's CURRENT posture"
        difference: "uses scheduled_utc; posture multiplier snapshotted from airport.posture at compute time"
      - name: final
        when: "recomputed at each leg's COMPLETED using actual_utc and the airport's posture at the moment of COMPLETED"
        difference: "uses actual_utc and adds delay_minutes surcharge when actual_utc > scheduled_utc + grace"

  - name: final_leg_charge
    trigger: "ServiceLeg COMPLETED transition"
    algorithm: chronological
    formula: |
      # Identical base to provisional_leg_charge, but two chronological inputs replace the scheduled ones:
      #   actual_utc replaces scheduled_utc
      #   airport.posture at the moment of COMPLETE replaces posture at SUBMIT
      # PLUS a delay surcharge applied AFTER the base computation:
      #   delay_min = max(0, (segment.actual_utc - segment.scheduled_utc) / 60)
      #   grace_min = 20
      #   delay_surcharge_cents = max(0, delay_min - grace_min) * DELAY_PER_MIN_CENTS   # 75 cents per minute past grace
      # The surcharge is added to the rounded base (NOT included inside the rounding) — pinning rounding order.
      final_leg_cents = round_half_up(base * tier_mult_bp / 10000 * posture_mult_bp / 10000) + delay_surcharge_cents
    input_set: "The single ServiceLeg that just reached COMPLETED"
    constants:
      GRACE_MINUTES: 20
      DELAY_PER_MIN_CENTS: 75
    precision: "0 decimal places; delay_surcharge added AFTER the round"
    variants:
      - name: at_complete
        when: "default"
        difference: "as above"
      - name: at_writeoff
        when: "when a WRITE_OFF is issued against a FINAL invoice, the same formula runs with posture_mult_bp forced to 10000 (NORMAL) to compute the write-off baseline"
        difference: "posture normalization on write-off — produces a different cents value than the FINAL for the same inputs when posture != NORMAL"

  - name: request_total_charge
    trigger: "After every per-leg charge recompute, and at request COMPLETED"
    algorithm: aggregation
    formula: |
      provisional_charge_cents = sum over legs of provisional_leg_cents   # per-leg rounding THEN sum
      final_charge_cents       = sum over legs of final_leg_cents         # same ordering rule
    input_set: "All ServiceLegs of the AssistRequest in any non-CANCELLED status"
    precision: "integer cents; never re-rounded at the sum level (the rounding already happened per-leg)"

  - name: agent_selector
    trigger: "POST /maa/legs/{id}/dispatch"
    algorithm: weighted_scoring
    formula: |
      # Eligibility filter (predicate over Agent fields):
      #   status == ACTIVE
      #   AND now_utc IN [shift_start_utc, shift_end_utc]
      #   AND (NOT leg.requires_tsa_escort OR tsa_cleared_until > now_utc)
      #   AND (NOT leg.requires_ummr_agent OR ummr_certified)
      #   AND (NOT leg.requires_senior_agent OR senior_trained)
      #   AND (NOT leg.requires_wchc_chair OR wc_certified)
      #   AND NOT has_overlapping_assignment(agent, leg)   # see agent_shift_overlap
      # Ranking expression: score = active_assignment_count ASC, then cumulative_delay_minutes ASC
      # Tie-break (in order): shift_start_utc ASC, then created_at ASC  (NEVER id)
      # Empty-pool fallback: raise ERR_NO_ELIGIBLE_AGENT
    input_set: "All Agents of the airport hosting the leg's segment"
    precision: "n/a — selection, not arithmetic"

  - name: wheelchair_selector
    trigger: "POST /maa/legs/{id}/dispatch (when leg.requires_wheelchair)"
    algorithm: selector
    formula: |
      # Eligibility filter:
      #   airport_id == leg.segment.airport_id
      #   status == AVAILABLE
      #   usage_count < MAINT_INTERVAL (50)
      #   (NOT leg.requires_wchc_chair OR is_wchc_rated)
      #   if leg.requires_wchc_chair then chair_class IN {POWER, BARIATRIC}    # manual chairs are never WCHC-rated
      # Ranking: usage_count ASC (prefer less-used chairs), then last_maintenance_utc DESC NULLS LAST, then created_at ASC
      # Empty-pool fallback: raise ERR_NO_AVAILABLE_WHEELCHAIR
    input_set: "All WheelchairAssets at the leg's airport"
    precision: "n/a"

  - name: agent_shift_overlap
    trigger: "agent_selector's has_overlapping_assignment predicate"
    algorithm: interval_merge
    formula: |
      # An existing Assignment A for agent G overlaps candidate leg L when ALL of:
      #   A.status IN {DISPATCHED, AT_PICKUP, IN_TRANSIT, AT_GATE}
      #   half-open interval intersection: [A.scheduled_pickup_utc, A.scheduled_completion_utc)
      #     ∩ [L.scheduled_pickup_utc, L.scheduled_pickup_utc + estimate_transfer_minutes(L))  !=  ∅
      # Adjacent-but-not-overlapping (end == start) is NOT a conflict (half-open).
      # estimate_transfer_minutes is fixed by leg_kind: MEET_ARRIVAL 45, DEPARTURE_ESCORT 60, CONNECTION_TRANSFER 75
    input_set: "Agent's assignments in non-terminal states"
    constants:
      MEET_ARRIVAL_MIN: 45
      DEPARTURE_ESCORT_MIN: 60
      CONNECTION_TRANSFER_MIN: 75
    precision: "n/a"

  - name: connection_leg_recompute
    trigger: "ServiceLeg COMPLETED with onward_leg_id set (CONNECTION_TRANSFER chain)"
    algorithm: constraint_propagation
    formula: |
      onward.scheduled_pickup_utc   := max(onward.scheduled_pickup_utc, completed_utc + airport.meet_buffer_minutes)
      onward.provisional_leg_cents  := provisional_leg_charge(onward)  # recompute using the new pickup time + CURRENT posture
    input_set: "The single onward leg"
    precision: "see provisional_leg_charge"

  - name: ops_epoch_advance
    trigger: "POST /maa/airports/{id}/run_ops"
    algorithm: threshold
    formula: |
      airport.ops_epoch += 1
      For each Agent at this airport: if now_utc > shift_end_utc and status == ACTIVE → status := OFF_SHIFT (cascade).
      For each Assignment in DISPATCHED at this airport where now_utc > scheduled_pickup_utc + 30 min → NO_SHOW.
      For each AssistRequest in SUBMITTED at this airport unchanged through 2 ops_epoch ticks → FAILED (stale).
    input_set: "Agents, Assignments, AssistRequests scoped to the airport"
    precision: "n/a"

  - name: write_off_baseline
    trigger: "POST /maa/invoices/{id}/events (WRITE_OFF) for bill_to == AIRLINE"
    algorithm: tiered_pricing
    formula: |
      # Re-runs final_leg_charge with posture_mult_bp pinned to 10000 to determine what the charge
      # "would have been at NORMAL posture" — this is the variant captured in final_leg_charge.variants.at_writeoff
      # The written-off amount equals the existing invoice.amount_cents; the baseline is informational
      # but MUST be computed and recorded on the invoice for audit.
    input_set: "Same as final_leg_charge"
    precision: "0 decimal places"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and in the role enum; X-User-ID present and well-formed"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "X-User-Role is in the endpoint's `roles:` list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Path-template ids resolve to live resources, validated left-to-right (airport → terminal → segment → leg → assignment)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: state
    check: "OCC: payload.expected_<parent>_version == parent.version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /maa/assist-requests/{id}/events, POST /maa/legs/{id}/dispatch, POST /maa/invoices/{id}/events"

  - priority: 5
    category: state
    check: "Target resource is in the correct from-state for the transition (state-machine precondition)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: all state-transition endpoints

  - priority: 6
    category: business_safety
    check: "TSA / regulatory: if leg.requires_tsa_escort then the assigned agent's tsa_cleared_until > now; if passenger class is UMNR then a distinct umnr_second_signoff_user_id MUST be present at HANDOFF"
    error_id: ERR_TSA_CLEARANCE_REQUIRED
    http_status: 409
    applies_to: "POST /maa/legs/{id}/dispatch, POST /maa/assignments/{id}/events (ARRIVE_PICKUP, HANDOFF)"

  - priority: 7
    category: business_safety
    check: "Segregation-of-duties: Confirmer completing an Assignment MUST differ from Assignment.assigned_by_user_id; UMNR handoff requires a third distinct signer; airline-write-off clerk MUST differ from provisional-invoice creator"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: "POST /maa/assignments/{id}/events (COMPLETE, HANDOFF), POST /maa/invoices/{id}/events (WRITE_OFF)"

  - priority: 8
    category: business_referential
    check: "Foreign keys resolve and satisfy parent-state rules: segment.airport == leg.airport; onward_leg_id belongs to same AssistRequest; wheelchair_asset.airport_id == leg.airport"
    error_id: ERR_REFERENTIAL_INTEGRITY
    http_status: 422
    applies_to: "POST /maa/assist-requests/{id}/legs, POST /maa/legs/{id}/dispatch"

  - priority: 9
    category: business_temporal
    check: "Temporal windowing: agent.shift_start_utc < shift_end_utc; shift length <= 12h; scheduled_pickup_utc IN [agent.shift_start_utc, agent.shift_end_utc]; occurred_at_utc not in the future; no overlapping assignments per agent (half-open interval semantics — adjacency allowed)"
    error_id: ERR_TEMPORAL_CONFLICT
    http_status: 409
    applies_to: "POST /maa/agents, POST /maa/legs/{id}/dispatch, POST /maa/tracking"

  - priority: 10
    category: business_constraint
    check: "Resource-capacity: wheelchair_selector must return a chair; agent_selector must return an agent"
    error_id: ERR_NO_ELIGIBLE_AGENT
    http_status: 409
    applies_to: "POST /maa/legs/{id}/dispatch"

  - priority: 11
    category: business_constraint
    check: "Wheelchair pool exhausted"
    error_id: ERR_NO_AVAILABLE_WHEELCHAIR
    http_status: 409
    applies_to: "POST /maa/legs/{id}/dispatch"

  - priority: 12
    category: business_fiscal
    check: "Payment-method presence: bill_to == PRIVATE requires Passenger.private_card_token non-empty; bill_to == AIRLINE requires Passenger.airline_pnr non-empty"
    error_id: ERR_PAYMENT_METHOD_REQUIRED
    http_status: 402
    applies_to: "POST /maa/assist-requests/{id}/events (SUBMIT)"

  - priority: 13
    category: business_fiscal
    check: "Invoice-state guards: only FINAL invoices may be MARK_PAID; only OPEN invoices may be DISPUTED; only DISPUTED invoices may be RESOLVE_PAID / WRITE_OFF"
    error_id: ERR_INVOICE_STATE
    http_status: 409
    applies_to: "POST /maa/invoices/{id}/events"

  - priority: 14
    category: business_constraint
    check: "Format/values: enums valid, integers in range, dob parses as ISO date, iata_code matches ^[A-Z]{3}$, etc."
    error_id: ERR_BAD_REQUEST
    http_status: 400
    applies_to: all

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Airport / Terminal / FlightSegment ---
  - method: POST
    path: "/maa/airports"
    description: "Create an Airport"
    roles: [PlatformAdmin]
    code: 201
    input: [iata_code, tz_offset_minutes, meet_buffer_minutes]
    output: Airport
    side_effects: ["posture := NORMAL, ops_epoch := 0"]

  - method: GET
    path: "/maa/airports/{id}"
    description: "Fetch an Airport"
    roles: [PlatformAdmin, OpsManager, Dispatcher, Agent, Confirmer, Requester, BillingClerk]
    code: 200
    input: []
    output: Airport
    side_effects: []

  - method: POST
    path: "/maa/airports/{id}/posture"
    description: "Change airport posture; cascades to in-flight requests"
    roles: [OpsManager]
    code: 200
    input: [posture, "note?"]
    output: Airport
    side_effects:
      - "NORMAL↔DEGRADED: recompute provisional charges on SUBMITTED/ASSIGNED requests"
      - "→ LOCKDOWN: cancel legs/assignments, release chairs, void PROVISIONAL invoices"

  - method: POST
    path: "/maa/airports/{id}/run_ops"
    description: "Advance airport ops_epoch; fire threshold transitions (OFF_SHIFT, NO_SHOW, stale-fail)"
    roles: [OpsManager]
    code: 200
    input: []
    output: Airport
    side_effects: ["ops_epoch += 1; fires ops_epoch_advance calculation"]

  - method: POST
    path: "/maa/airports/{id}/terminals"
    description: "Create a Terminal under an Airport"
    roles: [PlatformAdmin]
    code: 201
    input: [code, requires_secure_escort]
    output: Terminal
    side_effects: ["status := OPEN"]

  - method: GET
    path: "/maa/airports/{id}/terminals"
    description: "List Terminals under an Airport (sub-resource form)"
    roles: [PlatformAdmin, OpsManager, Dispatcher, Agent, Confirmer, Requester, BillingClerk]
    code: 200
    input: []
    output: "Terminal[]"
    side_effects: []

  - method: GET
    path: "/maa/terminals/{id}"
    description: "Fetch a single Terminal"
    roles: [PlatformAdmin, OpsManager, Dispatcher, Agent, Confirmer, Requester, BillingClerk]
    code: 200
    input: []
    output: Terminal
    side_effects: []

  - method: GET
    path: "/maa/terminals/{id}/segments"
    description: "List FlightSegments that use this Terminal (sub-resource reverse-reachability for FlightSegment.terminal_id)"
    roles: [PlatformAdmin, OpsManager, Dispatcher, Agent, Confirmer, Requester, BillingClerk]
    code: 200
    input: []
    output: "FlightSegment[]"
    side_effects: []

  - method: POST
    path: "/maa/airports/{id}/segments"
    description: "Create a FlightSegment"
    roles: [PlatformAdmin]
    code: 201
    input: [flight_no, direction, terminal_id, scheduled_utc]
    output: FlightSegment
    side_effects: ["status := SCHEDULED"]

  - method: GET
    path: "/maa/airports/{id}/segments"
    description: "List FlightSegments (filterable)"
    roles: [PlatformAdmin, OpsManager, Dispatcher, Agent, Confirmer, Requester, BillingClerk]
    code: 200
    input: ["direction?", "status?", "terminal_id?"]
    output: "FlightSegment[]"
    side_effects: []

  - method: GET
    path: "/maa/segments/{id}"
    description: "Fetch a single FlightSegment"
    roles: [PlatformAdmin, OpsManager, Dispatcher, Agent, Confirmer, Requester, BillingClerk]
    code: 200
    input: []
    output: FlightSegment
    side_effects: []

  - method: GET
    path: "/maa/segments/{id}/legs"
    description: "List ServiceLegs that reference this FlightSegment (sub-resource reverse-reachability for ServiceLeg.segment_id)"
    roles: [PlatformAdmin, OpsManager, Dispatcher, Agent, Confirmer, Requester, BillingClerk]
    code: 200
    input: []
    output: "ServiceLeg[]"
    side_effects: []

  - method: POST
    path: "/maa/segments/{id}/events"
    description: "Mark a FlightSegment LANDED / DEPARTED / CANCELLED with actual_utc"
    roles: [OpsManager]
    code: 200
    input: [event_type, "actual_utc?"]
    output: FlightSegment
    side_effects:
      - "Sets actual_utc when event_type IN {LANDED, DEPARTED}"
      - "CANCELLED: any PLANNED leg referencing this segment → CANCELLED"

  # --- Passenger / Agent / Wheelchair ---
  - method: POST
    path: "/maa/passengers"
    description: "Create a Passenger"
    roles: [Requester, PlatformAdmin]
    code: 201
    input: [full_name, dob, mobility_code, "airline_pnr?", "private_card_token?"]
    output: Passenger
    side_effects: ["passenger_class computed from dob and the logical clock"]

  - method: GET
    path: "/maa/passengers/{id}"
    description: "Fetch a Passenger"
    roles: [PlatformAdmin, OpsManager, Dispatcher, Agent, Confirmer, Requester, BillingClerk]
    code: 200
    input: []
    output: Passenger
    side_effects: []

  - method: POST
    path: "/maa/airports/{id}/agents"
    description: "Create an Agent under an Airport"
    roles: [PlatformAdmin]
    code: 201
    input: [display_name, tsa_cleared_until, ummr_certified, senior_trained, wc_certified, shift_start_utc, shift_end_utc]
    output: Agent
    side_effects: ["status := ACTIVE; active_assignment_count := 0; cumulative_delay_minutes := 0"]

  - method: GET
    path: "/maa/airports/{id}/agents"
    description: "List Agents at an Airport"
    roles: [PlatformAdmin, OpsManager, Dispatcher, BillingClerk]
    code: 200
    input: ["status?"]
    output: "Agent[]"
    side_effects: []

  - method: GET
    path: "/maa/agents/{id}"
    description: "Fetch an Agent"
    roles: [PlatformAdmin, OpsManager, Dispatcher, Agent, Confirmer, BillingClerk]
    code: 200
    input: []
    output: Agent
    side_effects: []

  - method: GET
    path: "/maa/agents/{id}/assignments"
    description: "List Assignments currently referencing this Agent (sub-resource reverse-reachability for Assignment.agent_id)"
    roles: [PlatformAdmin, OpsManager, Dispatcher, BillingClerk]
    code: 200
    input: []
    output: "Assignment[]"
    side_effects: []

  - method: POST
    path: "/maa/agents/{id}/events"
    description: "Agent lifecycle events (SUSPEND, REINSTATE)"
    roles: [OpsManager]
    code: 200
    input: [event_type, "reason?"]
    output: Agent
    side_effects:
      - "SUSPEND: in-flight assignments → CANCELLED, chairs released, legs → PLANNED (rebookable)"

  - method: POST
    path: "/maa/airports/{id}/wheelchairs"
    description: "Create a WheelchairAsset"
    roles: [PlatformAdmin]
    code: 201
    input: [asset_tag, chair_class, is_wchc_rated]
    output: WheelchairAsset
    side_effects: ["status := AVAILABLE; usage_count := 0"]

  - method: GET
    path: "/maa/airports/{id}/wheelchairs"
    description: "List WheelchairAssets at an Airport"
    roles: [PlatformAdmin, OpsManager, Dispatcher, BillingClerk]
    code: 200
    input: ["status?", "chair_class?"]
    output: "WheelchairAsset[]"
    side_effects: []

  - method: GET
    path: "/maa/wheelchairs/{id}"
    description: "Fetch a WheelchairAsset"
    roles: [PlatformAdmin, OpsManager, Dispatcher, BillingClerk]
    code: 200
    input: []
    output: WheelchairAsset
    side_effects: []

  - method: GET
    path: "/maa/wheelchairs/{id}/assignments"
    description: "List Assignments referencing this WheelchairAsset (sub-resource reverse-reachability for Assignment.wheelchair_asset_id)"
    roles: [PlatformAdmin, OpsManager, Dispatcher, BillingClerk]
    code: 200
    input: []
    output: "Assignment[]"
    side_effects: []

  - method: POST
    path: "/maa/wheelchairs/{id}/events"
    description: "Wheelchair lifecycle events (SCHEDULE_MAINTENANCE, COMPLETE_MAINTENANCE, RETIRE)"
    roles: [OpsManager]
    code: 200
    input: [event_type, "note?"]
    output: WheelchairAsset
    side_effects:
      - "COMPLETE_MAINTENANCE: usage_count := 0; last_maintenance_utc := now"
      - "RETIRE: requires no in-flight assignment references this chair"

  # --- AssistRequest / ServiceLeg ---
  - method: POST
    path: "/maa/assist-requests"
    description: "Create an AssistRequest in DRAFT"
    roles: [Requester]
    code: 201
    input: [passenger_id, bill_to, service_tier, "companion_count?", "umnr_handoff_required?"]
    output: AssistRequest
    side_effects: ["request_status := DRAFT; billing_status := UNBILLED"]

  - method: GET
    path: "/maa/assist-requests/{id}"
    description: "Fetch an AssistRequest"
    roles: [PlatformAdmin, OpsManager, Dispatcher, Agent, Confirmer, Requester, BillingClerk]
    code: 200
    input: []
    output: AssistRequest
    side_effects: []

  - method: GET
    path: "/maa/assist-requests"
    description: "List AssistRequests (filterable by passenger_id, request_status, billing_status)"
    roles: [PlatformAdmin, OpsManager, Dispatcher, BillingClerk]
    code: 200
    input: ["passenger_id?", "request_status?", "billing_status?"]
    output: "AssistRequest[]"
    side_effects: []

  - method: POST
    path: "/maa/assist-requests/{id}/legs"
    description: "Add a ServiceLeg to a DRAFT AssistRequest"
    roles: [Requester]
    code: 201
    input: [segment_id, leg_kind, pickup_zone, "onward_leg_id?"]
    output: ServiceLeg
    side_effects:
      - "status := PLANNED; scheduled_pickup_utc computed from segment.scheduled_utc and airport.meet_buffer_minutes"
      - "requires_* flags computed from passenger + terminal + segment"

  - method: GET
    path: "/maa/assist-requests/{id}/legs"
    description: "List ServiceLegs of an AssistRequest (sub-resource reverse-reachability)"
    roles: [PlatformAdmin, OpsManager, Dispatcher, Agent, Confirmer, Requester, BillingClerk]
    code: 200
    input: []
    output: "ServiceLeg[]"
    side_effects: []

  - method: GET
    path: "/maa/legs/{id}"
    description: "Fetch a ServiceLeg"
    roles: [PlatformAdmin, OpsManager, Dispatcher, Agent, Confirmer, Requester, BillingClerk]
    code: 200
    input: []
    output: ServiceLeg
    side_effects: []

  - method: GET
    path: "/maa/legs/{id}/onward-legs"
    description: "List ServiceLegs whose onward_leg_id == this leg (sub-resource reverse-reachability for ServiceLeg.onward_leg_id)"
    roles: [PlatformAdmin, OpsManager, Dispatcher, Agent, Confirmer, Requester, BillingClerk]
    code: 200
    input: []
    output: "ServiceLeg[]"
    side_effects: []

  - method: POST
    path: "/maa/assist-requests/{id}/events"
    description: "AssistRequest lifecycle (SUBMIT, CANCEL). Body MUST include expected_assist_request_version for OCC."
    roles: [Requester]
    code: 200
    input: [event_type, expected_assist_request_version, "note?"]
    output: AssistRequest
    side_effects:
      - "SUBMIT: compute provisional_charge_cents; create PROVISIONAL invoice; billing_status := PROVISIONAL"
      - "CANCEL: cancel PLANNED/DISPATCHED legs, release chairs, void PROVISIONAL invoice"
      - "Increments AssistRequest.version by 1"

  # --- Dispatch / Assignment ---
  - method: POST
    path: "/maa/legs/{id}/dispatch"
    description: "Dispatch a PLANNED ServiceLeg: runs agent_selector + wheelchair_selector, creates Assignment"
    roles: [Dispatcher]
    code: 201
    input: [expected_assist_request_version]
    output: Assignment
    side_effects:
      - "Assignment created DISPATCHED; Agent.active_assignment_count += 1"
      - "If requires_wheelchair: chair CHECKED_OUT (usage_count += 1)"
      - "If all sibling legs now DISPATCHED-or-later: parent AssistRequest SUBMITTED → ASSIGNED"
      - "Increments AssistRequest.version by 1"

  - method: GET
    path: "/maa/assignments/{id}"
    description: "Fetch an Assignment"
    roles: [PlatformAdmin, OpsManager, Dispatcher, Agent, Confirmer, BillingClerk]
    code: 200
    input: []
    output: Assignment
    side_effects: []

  - method: GET
    path: "/maa/assignments/{id}/incidents"
    description: "List Incidents referencing this Assignment (sub-resource reverse-reachability for Incident.assignment_id)"
    roles: [PlatformAdmin, OpsManager, Dispatcher, Agent, Confirmer, BillingClerk]
    code: 200
    input: []
    output: "Incident[]"
    side_effects: []

  - method: GET
    path: "/maa/assist-requests/{id}/assignments"
    description: "List Assignments under an AssistRequest (sub-resource reverse-reachability)"
    roles: [PlatformAdmin, OpsManager, Dispatcher, Agent, Confirmer, BillingClerk]
    code: 200
    input: []
    output: "Assignment[]"
    side_effects: []

  - method: GET
    path: "/maa/legs/{id}/assignments"
    description: "List Assignments for a ServiceLeg"
    roles: [PlatformAdmin, OpsManager, Dispatcher, Agent, Confirmer, BillingClerk]
    code: 200
    input: []
    output: "Assignment[]"
    side_effects: []

  - method: POST
    path: "/maa/assignments/{id}/events"
    description: "Assignment lifecycle events (ARRIVE_PICKUP, DEPART_PICKUP, ARRIVE_GATE, HANDOFF, COMPLETE, MARK_NO_SHOW, CANCEL_ASSIGN)"
    roles: [Agent, Confirmer, Dispatcher]
    code: 200
    input: [event_type, "umnr_second_signoff_user_id?", "note?"]
    output: Assignment
    side_effects:
      - "ARRIVE_PICKUP: sets ServiceLeg.actual_pickup_utc; first pickup flips parent ASSIGNED → IN_SERVICE"
      - "HANDOFF: enforces UMNR dual-signer segregation-of-duties when required"
      - "COMPLETE: Confirmer != assigned_by_user_id; releases chair; computes final_leg_cents; if last leg, rolls parent to COMPLETED and issues FINAL invoice (voids PROVISIONAL)"
      - "Increments Assignment.version by 1; increments parent AssistRequest.version by 1; increments parent ServiceLeg.version by 1"

  # --- Incident ---
  - method: POST
    path: "/maa/incidents"
    description: "Open an Incident against an Assignment"
    roles: [Agent, OpsManager, Dispatcher]
    code: 201
    input: [assignment_id, kind, severity, description]
    output: Incident
    side_effects: ["status := OPEN; opened_at_utc := now"]

  - method: GET
    path: "/maa/incidents/{id}"
    description: "Fetch an Incident"
    roles: [PlatformAdmin, OpsManager, Dispatcher, Agent, Confirmer, BillingClerk]
    code: 200
    input: []
    output: Incident
    side_effects: []

  - method: GET
    path: "/maa/assist-requests/{id}/incidents"
    description: "List Incidents under an AssistRequest"
    roles: [PlatformAdmin, OpsManager, Dispatcher, Agent, Confirmer, BillingClerk]
    code: 200
    input: []
    output: "Incident[]"
    side_effects: []

  - method: POST
    path: "/maa/incidents/{id}/events"
    description: "Incident lifecycle (ACK, RESOLVE). RESOLVE with severity=CRITICAL cascades agent suspension and possibly an ADJUSTMENT invoice."
    roles: [OpsManager]
    code: 200
    input: [event_type, "note?"]
    output: Incident
    side_effects:
      - "RESOLVE(CRITICAL): Agent → SUSPENDED (full unassign cascade)"
      - "RESOLVE(CRITICAL, PROPERTY_DAMAGE) when billing FINALIZED: creates ADJUSTMENT invoice crediting 20%"

  # --- Invoice ---
  - method: GET
    path: "/maa/invoices/{id}"
    description: "Fetch an Invoice"
    roles: [PlatformAdmin, OpsManager, BillingClerk, Requester]
    code: 200
    input: []
    output: Invoice
    side_effects: []

  - method: GET
    path: "/maa/invoices/{id}/adjustments"
    description: "List ADJUSTMENT invoices whose supersedes_invoice_id == this invoice (sub-resource reverse-reachability for Invoice.supersedes_invoice_id)"
    roles: [PlatformAdmin, OpsManager, BillingClerk]
    code: 200
    input: []
    output: "Invoice[]"
    side_effects: []

  - method: GET
    path: "/maa/assist-requests/{id}/invoices"
    description: "List Invoices of an AssistRequest"
    roles: [PlatformAdmin, OpsManager, BillingClerk, Requester]
    code: 200
    input: []
    output: "Invoice[]"
    side_effects: []

  - method: POST
    path: "/maa/invoices/{id}/events"
    description: "Invoice settlement lifecycle (MARK_PAID, DISPUTE, RESOLVE_PAID, WRITE_OFF). Body MUST include expected_invoice_version for OCC."
    roles: [BillingClerk]
    code: 200
    input: [event_type, expected_invoice_version, "note?"]
    output: Invoice
    side_effects:
      - "Bubbles parent AssistRequest.billing_status"
      - "WRITE_OFF (AIRLINE): enforces segregation-of-duties vs provisional creator"
      - "Increments Invoice.version by 1"

  # --- Tracking ---
  - method: POST
    path: "/maa/tracking"
    description: "Publish a TrackingEvent. The tracking_token identifies the Assignment."
    roles: [Agent]
    code: 201
    input: [tracking_token, event_kind, "lat?", "lon?", occurred_at_utc]
    output: TrackingEvent
    side_effects: ["Append-only; occurred_at_utc MUST be <= now"]

  - method: GET
    path: "/maa/assignments/{id}/tracking"
    description: "List TrackingEvents of an Assignment (chronological)"
    roles: [PlatformAdmin, OpsManager, Dispatcher, Agent, Confirmer, BillingClerk]
    code: 200
    input: []
    output: "TrackingEvent[]"
    side_effects: []

  # --- Test-driving clock endpoint ---
  - method: POST
    path: "/maa/_clock/set_current_utc"
    description: "Set the server's logical clock. At server start (before any set_current_utc call) the logical clock reads exactly 2026-05-01T00:00:00Z and MUST NOT fall back to wall-clock."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: { now_utc: datetime }
    side_effects: ["Does not run ops_epoch; purely a clock override"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED,         http: 401, condition: "Missing or malformed X-User-Role / X-User-ID headers" }
  - { id: ERR_UNAUTHORIZED,            http: 403, condition: "Role not in the endpoint's roles list" }
  - { id: ERR_NOT_FOUND,               http: 404, condition: "Path-template id does not resolve to a live resource" }
  - { id: ERR_BAD_REQUEST,             http: 400, condition: "Malformed JSON / invalid enum / out-of-range integer / bad date format" }
  - { id: ERR_STALE_VERSION,           http: 412, condition: "expected_<parent>_version != parent.version (OCC)" }
  - { id: ERR_INVALID_STATE,           http: 409, condition: "Resource not in the from-state required by the transition" }
  - { id: ERR_NO_LEGS,                 http: 409, condition: "SUBMIT attempted with zero ServiceLegs on the AssistRequest" }
  - { id: ERR_PAYMENT_METHOD_REQUIRED, http: 402, condition: "bill_to == PRIVATE but private_card_token missing; or bill_to == AIRLINE but airline_pnr missing" }
  - { id: ERR_TSA_CLEARANCE_REQUIRED,  http: 409, condition: "Leg requires TSA escort but no candidate agent has tsa_cleared_until > now; or acting agent's clearance expired at ARRIVE_PICKUP" }
  - { id: ERR_SEGREGATION_OF_DUTIES,   http: 409, condition: "Same user attempted two steps that segregation-of-duties forbids (dispatcher==confirmer; UMNR dual-signer violated; airline-write-off clerk == provisional-creator)" }
  - { id: ERR_REFERENTIAL_INTEGRITY,   http: 422, condition: "FK crosses airport boundary or onward_leg_id not on the same AssistRequest" }
  - { id: ERR_TEMPORAL_CONFLICT,       http: 409, condition: "Agent shift window invalid; occurred_at_utc in future; candidate agent has overlapping assignment (half-open interval)" }
  - { id: ERR_NO_ELIGIBLE_AGENT,       http: 409, condition: "agent_selector returned empty pool" }
  - { id: ERR_NO_AVAILABLE_WHEELCHAIR, http: 409, condition: "wheelchair_selector returned empty pool" }
  - { id: ERR_INVOICE_STATE,           http: 409, condition: "Invoice transition precondition violated (MARK_PAID on PROVISIONAL, RESOLVE on OPEN, etc.)" }
  - { id: ERR_ALREADY_IN_SERVICE,      http: 409, condition: "CANCEL attempted while an assignment is AT_PICKUP or later" }
  - { id: ERR_CHAIR_IN_USE,            http: 409, condition: "RETIRE attempted while chair referenced by an in-flight assignment" }
  - { id: ERR_WCHC_CHAIR_REQUIRED,     http: 409, condition: "Manual chair selected for WCHC passenger" }
  - { id: ERR_POSTURE_RESTRICTED,      http: 409, condition: "Operation disallowed under current airport posture (e.g. dispatch during LOCKDOWN)" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Provisions airports, terminals, segments, agents, wheelchairs; controls the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /maa/airports"
      - "POST /maa/airports/{aid}/terminals"
      - "POST /maa/airports/{aid}/segments"
      - "POST /maa/airports/{aid}/agents"
      - "POST /maa/airports/{aid}/wheelchairs"
      - "POST /maa/_clock/set_current_utc"
    shared_operations:
      - "GET on any resource"

  - name: Requester
    description: "Creates passengers and assist requests, drafts legs, submits/cancels requests"
    identity: opaque
    exclusive_operations:
      - "POST /maa/assist-requests"
      - "POST /maa/assist-requests/{id}/legs"
      - "POST /maa/assist-requests/{id}/events (SUBMIT, CANCEL)"
    shared_operations:
      - "POST /maa/passengers"
      - "GET on requests/passengers/invoices the requester owns"

  - name: Dispatcher
    description: "Dispatches PLANNED legs — runs the agent + wheelchair selectors"
    identity: opaque
    exclusive_operations:
      - "POST /maa/legs/{id}/dispatch"
      - "POST /maa/assignments/{id}/events (MARK_NO_SHOW, CANCEL_ASSIGN)"
    shared_operations:
      - "GET on agents, wheelchairs, segments, requests, assignments, tracking"

  - name: Agent
    description: "Airport escort executing assignments; publishes tracking events; opens incidents"
    identity: entity_backed:Agent
    exclusive_operations:
      - "POST /maa/assignments/{id}/events (ARRIVE_PICKUP, DEPART_PICKUP, ARRIVE_GATE, HANDOFF)"
      - "POST /maa/tracking"
    shared_operations:
      - "POST /maa/incidents"
      - "GET on own assignments and their requests"

  - name: Confirmer
    description: "Third-party completer of assignments; segregation-of-duties vs Dispatcher"
    identity: opaque
    exclusive_operations:
      - "POST /maa/assignments/{id}/events (COMPLETE)"
    shared_operations:
      - "GET on assignments and their requests"

  - name: OpsManager
    description: "Controls airport posture, runs ops_epoch, manages agents/wheelchairs/incidents"
    identity: opaque
    exclusive_operations:
      - "POST /maa/airports/{aid}/posture"
      - "POST /maa/airports/{aid}/run_ops"
      - "POST /maa/agents/{id}/events (SUSPEND, REINSTATE)"
      - "POST /maa/wheelchairs/{id}/events (SCHEDULE_MAINTENANCE, COMPLETE_MAINTENANCE, RETIRE)"
      - "POST /maa/incidents/{id}/events (ACK, RESOLVE)"
      - "POST /maa/segments/{id}/events (LANDED, DEPARTED, CANCELLED)"
    shared_operations:
      - "GET on any resource"
      - "POST /maa/incidents"

  - name: BillingClerk
    description: "Settles invoices (MARK_PAID, DISPUTE, RESOLVE_PAID, WRITE_OFF)"
    identity: opaque
    exclusive_operations:
      - "POST /maa/invoices/{id}/events"
    shared_operations:
      - "GET on invoices and their parent requests"
