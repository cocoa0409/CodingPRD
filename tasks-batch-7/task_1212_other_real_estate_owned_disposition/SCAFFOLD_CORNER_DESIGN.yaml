scaffold_corner_design:
  # =====================================================================
  # Section: entities
  # =====================================================================
  - section: entities
    instances:
      - name: create_property_applies_defaults_and_computed_fields
        claim_type: creation
        grounds: [entities.OREOProperty, calculations.acquisition_fair_value, calculations.holding_period_compliance]
        distinguishing_aspect: "Creation applies the PROVISIONAL acquisition variant, the 1825-day deadline, and both initial statuses without any client input for them."
        test_recipe:
          setup: ["Empty database; logical clock at its startup default 2026-05-01T00:00:00Z"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/oreo-properties", payload: { address: "1420 Maple St", state_code: "CA", county: "Alameda", property_type: "RESIDENTIAL", acquisition_date: "2026-05-10", bpo_value: 400000.00, foreclosure_debt: 410000.00 }, as: OREOAdmin, captures: { p_id: $.data.id } }
            - { call: "GET /api/ledger-entries", payload: { property_id: "${p_id}" }, as: OREOAdmin }
          assert:
            - "HTTP 201; response carries server-minted id, created_at, updated_at, version == 1"
            - "lifecycle_status == HELD and appraisal_status == UNAPPRAISED"
            - "fair_value_at_acquisition == 400000.00 (PROVISIONAL variant); acquisition_basis == carrying_value == 368000.00"
            - "holding_deadline == 2031-05-09 (acquisition_date + 1825 days); extension_days_approved == 0"
            - "Ledger contains one ACQUISITION entry with amount +368000.00"

      - name: create_property_missing_required_field_returns_400
        claim_type: required_fields
        grounds: [entities.OREOProperty.fields.bpo_value, "validations[priority=3]", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "Omitting required input bpo_value fails schema validation before any state is persisted."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/oreo-properties", payload: { address: "1420 Maple St", state_code: "CA", county: "Alameda", property_type: "RESIDENTIAL", acquisition_date: "2026-05-10", foreclosure_debt: 410000.00 }, as: OREOAdmin, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_VALIDATION (HTTP 400); no property row is created"

      - name: create_property_invalid_property_type_returns_400
        claim_type: type_constraints
        grounds: [entities.OREOProperty.fields.property_type, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "A value outside the declared enum {RESIDENTIAL, COMMERCIAL, INDUSTRIAL, LAND} is rejected."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/oreo-properties", payload: { address: "1420 Maple St", state_code: "CA", county: "Alameda", property_type: "MOBILE_HOME", acquisition_date: "2026-05-10", bpo_value: 400000.00, foreclosure_debt: 410000.00 }, as: OREOAdmin, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_VALIDATION (HTTP 400)"

      - name: create_property_ignores_client_supplied_id_input_ignored
        claim_type: system_fields
        grounds: [entities.OREOProperty]
        distinguishing_aspect: "System-owned fields (id) in the request body are ignored, never honored."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/oreo-properties", payload: { id: "00000000-0000-0000-0000-000000000000", address: "1420 Maple St", state_code: "CA", county: "Alameda", property_type: "RESIDENTIAL", acquisition_date: "2026-05-10", bpo_value: 400000.00, foreclosure_debt: 410000.00 }, as: OREOAdmin, captures: { p_id: $.data.id } }
          assert:
            - "HTTP 201 and p_id != '00000000-0000-0000-0000-000000000000' (server-minted UUID wins)"

      - name: get_property_not_found_returns_404
        claim_type: not_found
        grounds: ["validations[priority=4]", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "Reading a well-formed but nonexistent property id returns the catalog 404."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /api/oreo-properties/11111111-2222-3333-4444-555555555555", payload: {}, as: OREOAdmin, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_NOT_FOUND (HTTP 404)"

      - name: list_properties_pagination_defaults
        claim_type: listing
        grounds: [response_envelope.pagination_defaults, entities.OREOProperty]
        distinguishing_aspect: "Pagination envelope honors explicit limit and reports total_count/has_more; defaults apply when omitted."
        test_recipe:
          setup: ["Two properties exist"]
          setup_api_calls:
            - { call: "POST /api/oreo-properties", payload: { address: "1 A St", state_code: "CA", county: "Alameda", property_type: "RESIDENTIAL", acquisition_date: "2026-05-10", bpo_value: 400000.00, foreclosure_debt: 410000.00 }, as: OREOAdmin }
            - { call: "POST /api/oreo-properties", payload: { address: "2 B St", state_code: "NV", county: "Clark", property_type: "LAND", acquisition_date: "2026-05-11", bpo_value: 150000.00, foreclosure_debt: 148000.00 }, as: OREOAdmin }
          trigger:
            - { call: "GET /api/oreo-properties", payload: { limit: 1 }, as: OREOAdmin }
            - { call: "GET /api/oreo-properties", payload: { state_code: "NV" }, as: OREOAdmin }
          assert:
            - "First response: response_type 'array', data length 1, total_count == 2, has_more == true, limit == 1, offset == 0"
            - "Second response: total_count == 1 and the single row's state_code == 'NV'"

      - name: ledger_entry_has_no_version_field_immutability
        claim_type: immutability
        grounds: [entities.LedgerEntry]
        distinguishing_aspect: "LedgerEntry is append-only (common_fields: false): reads expose id and created_at but no version/updated_at."
        test_recipe:
          setup: ["One property exists (its creation posted an ACQUISITION ledger row)"]
          setup_api_calls:
            - { call: "POST /api/oreo-properties", payload: { address: "1420 Maple St", state_code: "CA", county: "Alameda", property_type: "RESIDENTIAL", acquisition_date: "2026-05-10", bpo_value: 400000.00, foreclosure_debt: 410000.00 }, as: OREOAdmin, captures: { p_id: $.data.id } }
          trigger:
            - { call: "GET /api/ledger-entries", payload: { property_id: "${p_id}" }, as: OREOAdmin, captures: { le_id: "$.data[0].id" } }
            - { call: "GET /api/ledger-entries/${le_id}", payload: {}, as: OREOAdmin }
          assert:
            - "GET /api/ledger-entries/${le_id} response contains no 'version' key and no 'updated_at' key"
            - "entry_type == ACQUISITION and amount == 368000.00"

      - name: broker_score_null_before_first_closing
        claim_type: computed_fields
        grounds: [entities.Broker.fields.performance_score, calculations.broker_performance_score]
        distinguishing_aspect: "The weighted score is null (not 0) while the broker has zero SETTLED closings."
        test_recipe:
          setup: ["One broker registered"]
          setup_api_calls:
            - { call: "POST /api/brokers", payload: { name: "Bay Brokers", license_number: "LIC-B1", coverage_states: ["CA"] }, as: OREOAdmin, captures: { b_id: $.data.id } }
          trigger:
            - { call: "GET /api/brokers/${b_id}", payload: {}, as: OREOAdmin, captures: { b_status: $.data.status } }
          assert:
            - "b_status == ACTIVE (default applied)"
            - "Broker.${b_id}.performance_score is null"

  # =====================================================================
  # Section: state_machines
  # =====================================================================
  - section: state_machines
    instances:
      - name: withdraw_accepted_offer_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.Offer, "errors[ERR_OFFER_NOT_REVIEWABLE]"]
        distinguishing_aspect: "WITHDRAWN is only reachable from {RECEIVED, UNDER_REVIEW, COUNTERED}; withdrawing an ACCEPTED offer fails with no side effects."
        test_recipe:
          setup: ["Approval tiers configured; property UNDER_CONTRACT via accepted 450000.00 CASH offer"]
          setup_api_calls:
            - { call: "POST /api/approval-tiers", payload: { name: "T1", min_net_proceeds: 0.00, max_net_proceeds: 250000.00, required_role: "OREOSpecialist" }, as: OREOAdmin }
            - { call: "POST /api/approval-tiers", payload: { name: "T2", min_net_proceeds: 250000.00, max_net_proceeds: 750000.00, required_role: "CreditOfficer" }, as: OREOAdmin }
            - { call: "POST /api/approval-tiers", payload: { name: "T3", min_net_proceeds: 750000.00, required_role: "OREOCommittee" }, as: OREOAdmin }
            - { call: "POST /api/oreo-properties", payload: { address: "1420 Maple St", state_code: "CA", county: "Alameda", property_type: "RESIDENTIAL", acquisition_date: "2026-05-10", bpo_value: 400000.00, foreclosure_debt: 410000.00 }, as: OREOAdmin, captures: { p_id: $.data.id, p_v: $.data.version } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: OREOAdmin }
            - { call: "POST /api/appraisers", payload: { name: "Apex Valuations", license_number: "LIC-A1", coverage_states: ["CA"], fee_flat: 750.00 }, as: OREOAdmin, captures: { ap_id: $.data.id } }
            - { call: "POST /api/appraisals", payload: { property_id: "${p_id}", appraiser_id: "${ap_id}", effective_date: "2026-06-01", appraised_value: 400000.00, expected_property_version: "${p_v}" }, as: Appraiser, as_user_id: "${ap_id}", captures: { a_id: $.data.id } }
            - { call: "POST /api/appraisals/${a_id}/submit", payload: {}, as: Appraiser, as_user_id: "${ap_id}" }
            - { call: "POST /api/appraisals/${a_id}/certify", payload: {}, as: ChiefAppraiser, as_user_id: "chief-appraiser-1" }
            - { call: "POST /api/brokers", payload: { name: "Bay Brokers", license_number: "LIC-B1", coverage_states: ["CA"] }, as: OREOAdmin, captures: { b_id: $.data.id } }
            - { call: "POST /api/listing-agreements", payload: { property_id: "${p_id}", broker_id: "${b_id}", start_date: "2026-06-05", end_date: "2026-12-05", listing_price: 450000.00 }, as: PropertyManager, captures: { l_id: $.data.id } }
            - { call: "POST /api/listing-agreements/${l_id}/activate", payload: {}, as: OREOSpecialist }
            - { call: "GET /api/oreo-properties/${p_id}", payload: {}, as: OREOAdmin, captures: { p_v2: $.data.version } }
            - { call: "POST /api/offers", payload: { property_id: "${p_id}", listing_agreement_id: "${l_id}", buyer_name: "Buyer One", offer_price: 450000.00, financing_type: "CASH", earnest_money: 5000.00, expected_property_version: "${p_v2}" }, as: OREOSpecialist, captures: { o_id: $.data.id } }
            - { call: "POST /api/offers/${o_id}/submit-review", payload: {}, as: OREOSpecialist }
            - { call: "POST /api/offers/${o_id}/accept", payload: {}, as: CreditOfficer }
          trigger:
            - { call: "POST /api/offers/${o_id}/withdraw", payload: {}, as: OREOSpecialist, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_OFFER_NOT_REVIEWABLE (HTTP 409)"
            - "Offer.${o_id}.status remains ACCEPTED; property ${p_id} remains UNDER_CONTRACT"

      - name: reject_closed_offer_returns_terminal_lockdown
        claim_type: terminal_lockdown
        grounds: [state_machines.Offer, "errors[ERR_OFFER_NOT_REVIEWABLE]"]
        distinguishing_aspect: "CLOSED is terminal: a reject against a settled offer is rejected with no state change."
        test_recipe:
          setup: ["Approval tiers configured; sale fully settled (offer CLOSED, property DISPOSED)"]
          setup_api_calls:
            - { call: "POST /api/approval-tiers", payload: { name: "T1", min_net_proceeds: 0.00, max_net_proceeds: 250000.00, required_role: "OREOSpecialist" }, as: OREOAdmin }
            - { call: "POST /api/approval-tiers", payload: { name: "T2", min_net_proceeds: 250000.00, max_net_proceeds: 750000.00, required_role: "CreditOfficer" }, as: OREOAdmin }
            - { call: "POST /api/approval-tiers", payload: { name: "T3", min_net_proceeds: 750000.00, required_role: "OREOCommittee" }, as: OREOAdmin }
            - { call: "POST /api/oreo-properties", payload: { address: "1420 Maple St", state_code: "CA", county: "Alameda", property_type: "RESIDENTIAL", acquisition_date: "2026-05-10", bpo_value: 400000.00, foreclosure_debt: 410000.00 }, as: OREOAdmin, captures: { p_id: $.data.id, p_v: $.data.version } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: OREOAdmin }
            - { call: "POST /api/appraisers", payload: { name: "Apex Valuations", license_number: "LIC-A1", coverage_states: ["CA"], fee_flat: 750.00 }, as: OREOAdmin, captures: { ap_id: $.data.id } }
            - { call: "POST /api/appraisals", payload: { property_id: "${p_id}", appraiser_id: "${ap_id}", effective_date: "2026-06-01", appraised_value: 400000.00, expected_property_version: "${p_v}" }, as: Appraiser, as_user_id: "${ap_id}", captures: { a_id: $.data.id } }
            - { call: "POST /api/appraisals/${a_id}/submit", payload: {}, as: Appraiser, as_user_id: "${ap_id}" }
            - { call: "POST /api/appraisals/${a_id}/certify", payload: {}, as: ChiefAppraiser, as_user_id: "chief-appraiser-1" }
            - { call: "POST /api/brokers", payload: { name: "Bay Brokers", license_number: "LIC-B1", coverage_states: ["CA"] }, as: OREOAdmin, captures: { b_id: $.data.id } }
            - { call: "POST /api/listing-agreements", payload: { property_id: "${p_id}", broker_id: "${b_id}", start_date: "2026-06-05", end_date: "2026-12-05", listing_price: 450000.00 }, as: PropertyManager, captures: { l_id: $.data.id } }
            - { call: "POST /api/listing-agreements/${l_id}/activate", payload: {}, as: OREOSpecialist }
            - { call: "GET /api/oreo-properties/${p_id}", payload: {}, as: OREOAdmin, captures: { p_v2: $.data.version } }
            - { call: "POST /api/offers", payload: { property_id: "${p_id}", listing_agreement_id: "${l_id}", buyer_name: "Buyer One", offer_price: 450000.00, financing_type: "CASH", earnest_money: 5000.00, expected_property_version: "${p_v2}" }, as: OREOSpecialist, captures: { o_id: $.data.id } }
            - { call: "POST /api/offers/${o_id}/submit-review", payload: {}, as: OREOSpecialist }
            - { call: "POST /api/offers/${o_id}/accept", payload: {}, as: CreditOfficer }
            - { call: "POST /api/closing-statements", payload: { offer_id: "${o_id}", closing_date: "2026-08-01" }, as: OREOSpecialist, captures: { c_id: $.data.id } }
            - { call: "POST /api/closing-statements/${c_id}/settle", payload: {}, as: CreditOfficer }
          trigger:
            - { call: "POST /api/offers/${o_id}/reject", payload: {}, as: OREOSpecialist, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_OFFER_NOT_REVIEWABLE (HTTP 409)"
            - "Offer.${o_id}.status remains CLOSED; property ${p_id} remains DISPOSED"

      - name: double_accept_offer_returns_invalid_state
        claim_type: idempotency
        grounds: [state_machines.Offer.UNDER_REVIEW_to_ACCEPTED, "errors[ERR_OFFER_NOT_REVIEWABLE]"]
        distinguishing_aspect: "Repeating the same accept trigger on an already-ACCEPTED offer fails rather than re-applying side effects."
        test_recipe:
          setup: ["Approval tiers configured; offer ACCEPTED, property UNDER_CONTRACT"]
          setup_api_calls:
            - { call: "POST /api/approval-tiers", payload: { name: "T1", min_net_proceeds: 0.00, max_net_proceeds: 250000.00, required_role: "OREOSpecialist" }, as: OREOAdmin }
            - { call: "POST /api/approval-tiers", payload: { name: "T2", min_net_proceeds: 250000.00, max_net_proceeds: 750000.00, required_role: "CreditOfficer" }, as: OREOAdmin }
            - { call: "POST /api/approval-tiers", payload: { name: "T3", min_net_proceeds: 750000.00, required_role: "OREOCommittee" }, as: OREOAdmin }
            - { call: "POST /api/oreo-properties", payload: { address: "1420 Maple St", state_code: "CA", county: "Alameda", property_type: "RESIDENTIAL", acquisition_date: "2026-05-10", bpo_value: 400000.00, foreclosure_debt: 410000.00 }, as: OREOAdmin, captures: { p_id: $.data.id, p_v: $.data.version } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: OREOAdmin }
            - { call: "POST /api/appraisers", payload: { name: "Apex Valuations", license_number: "LIC-A1", coverage_states: ["CA"], fee_flat: 750.00 }, as: OREOAdmin, captures: { ap_id: $.data.id } }
            - { call: "POST /api/appraisals", payload: { property_id: "${p_id}", appraiser_id: "${ap_id}", effective_date: "2026-06-01", appraised_value: 400000.00, expected_property_version: "${p_v}" }, as: Appraiser, as_user_id: "${ap_id}", captures: { a_id: $.data.id } }
            - { call: "POST /api/appraisals/${a_id}/submit", payload: {}, as: Appraiser, as_user_id: "${ap_id}" }
            - { call: "POST /api/appraisals/${a_id}/certify", payload: {}, as: ChiefAppraiser, as_user_id: "chief-appraiser-1" }
            - { call: "POST /api/brokers", payload: { name: "Bay Brokers", license_number: "LIC-B1", coverage_states: ["CA"] }, as: OREOAdmin, captures: { b_id: $.data.id } }
            - { call: "POST /api/listing-agreements", payload: { property_id: "${p_id}", broker_id: "${b_id}", start_date: "2026-06-05", end_date: "2026-12-05", listing_price: 450000.00 }, as: PropertyManager, captures: { l_id: $.data.id } }
            - { call: "POST /api/listing-agreements/${l_id}/activate", payload: {}, as: OREOSpecialist }
            - { call: "GET /api/oreo-properties/${p_id}", payload: {}, as: OREOAdmin, captures: { p_v2: $.data.version } }
            - { call: "POST /api/offers", payload: { property_id: "${p_id}", listing_agreement_id: "${l_id}", buyer_name: "Buyer One", offer_price: 450000.00, financing_type: "CASH", earnest_money: 5000.00, expected_property_version: "${p_v2}" }, as: OREOSpecialist, captures: { o_id: $.data.id } }
            - { call: "POST /api/offers/${o_id}/submit-review", payload: {}, as: OREOSpecialist }
            - { call: "POST /api/offers/${o_id}/accept", payload: {}, as: CreditOfficer }
          trigger:
            - { call: "POST /api/offers/${o_id}/accept", payload: {}, as: CreditOfficer, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_OFFER_NOT_REVIEWABLE (HTTP 409); no duplicate side effects (property stays UNDER_CONTRACT, no additional supersede cascade)"

      - name: rescind_accepted_offer_reopens_marketing
        claim_type: valid_transition
        grounds: [state_machines.Offer.ACCEPTED_to_RESCINDED, state_machines.OREOProperty.UNDER_CONTRACT_to_MARKETED]
        distinguishing_aspect: "Rescinding the ACCEPTED offer before settlement reverts the property to MARKETED; the listing terminated at accept stays TERMINATED."
        test_recipe:
          setup: ["Approval tiers configured; offer ACCEPTED, property UNDER_CONTRACT, listing TERMINATED with reason UNDER_CONTRACT"]
          setup_api_calls:
            - { call: "POST /api/approval-tiers", payload: { name: "T1", min_net_proceeds: 0.00, max_net_proceeds: 250000.00, required_role: "OREOSpecialist" }, as: OREOAdmin }
            - { call: "POST /api/approval-tiers", payload: { name: "T2", min_net_proceeds: 250000.00, max_net_proceeds: 750000.00, required_role: "CreditOfficer" }, as: OREOAdmin }
            - { call: "POST /api/approval-tiers", payload: { name: "T3", min_net_proceeds: 750000.00, required_role: "OREOCommittee" }, as: OREOAdmin }
            - { call: "POST /api/oreo-properties", payload: { address: "1420 Maple St", state_code: "CA", county: "Alameda", property_type: "RESIDENTIAL", acquisition_date: "2026-05-10", bpo_value: 400000.00, foreclosure_debt: 410000.00 }, as: OREOAdmin, captures: { p_id: $.data.id, p_v: $.data.version } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: OREOAdmin }
            - { call: "POST /api/appraisers", payload: { name: "Apex Valuations", license_number: "LIC-A1", coverage_states: ["CA"], fee_flat: 750.00 }, as: OREOAdmin, captures: { ap_id: $.data.id } }
            - { call: "POST /api/appraisals", payload: { property_id: "${p_id}", appraiser_id: "${ap_id}", effective_date: "2026-06-01", appraised_value: 400000.00, expected_property_version: "${p_v}" }, as: Appraiser, as_user_id: "${ap_id}", captures: { a_id: $.data.id } }
            - { call: "POST /api/appraisals/${a_id}/submit", payload: {}, as: Appraiser, as_user_id: "${ap_id}" }
            - { call: "POST /api/appraisals/${a_id}/certify", payload: {}, as: ChiefAppraiser, as_user_id: "chief-appraiser-1" }
            - { call: "POST /api/brokers", payload: { name: "Bay Brokers", license_number: "LIC-B1", coverage_states: ["CA"] }, as: OREOAdmin, captures: { b_id: $.data.id } }
            - { call: "POST /api/listing-agreements", payload: { property_id: "${p_id}", broker_id: "${b_id}", start_date: "2026-06-05", end_date: "2026-12-05", listing_price: 450000.00 }, as: PropertyManager, captures: { l_id: $.data.id } }
            - { call: "POST /api/listing-agreements/${l_id}/activate", payload: {}, as: OREOSpecialist }
            - { call: "GET /api/oreo-properties/${p_id}", payload: {}, as: OREOAdmin, captures: { p_v2: $.data.version } }
            - { call: "POST /api/offers", payload: { property_id: "${p_id}", listing_agreement_id: "${l_id}", buyer_name: "Buyer One", offer_price: 450000.00, financing_type: "CASH", earnest_money: 5000.00, expected_property_version: "${p_v2}" }, as: OREOSpecialist, captures: { o_id: $.data.id } }
            - { call: "POST /api/offers/${o_id}/submit-review", payload: {}, as: OREOSpecialist }
            - { call: "POST /api/offers/${o_id}/accept", payload: {}, as: CreditOfficer }
          trigger:
            - { call: "POST /api/offers/${o_id}/rescind", payload: {}, as: CreditOfficer, captures: { o_status: $.data.status } }
            - { call: "GET /api/oreo-properties/${p_id}", payload: {}, as: OREOAdmin, captures: { p_status: $.data.lifecycle_status } }
            - { call: "GET /api/listing-agreements/${l_id}", payload: {}, as: OREOAdmin }
          assert:
            - "o_status == RESCINDED"
            - "p_status == MARKETED (deal fell through; marketing posture re-opens)"
            - "ListingAgreement.${l_id}.status == TERMINATED with termination_reason UNDER_CONTRACT (not resurrected by the rescind)"

      - name: accept_offer_supersedes_competing_pending_offers
        claim_type: side_effect_execution
        grounds: [state_machines.OREOProperty.MARKETED_to_UNDER_CONTRACT, entities.Offer.fields.rejection_reason]
        distinguishing_aspect: "Accepting one offer cascade-rejects every other non-terminal offer on the property with rejection_reason SUPERSEDED."
        test_recipe:
          setup: ["Approval tiers configured; marketed property with two CASH offers A and B both UNDER_REVIEW"]
          setup_api_calls:
            - { call: "POST /api/approval-tiers", payload: { name: "T1", min_net_proceeds: 0.00, max_net_proceeds: 250000.00, required_role: "OREOSpecialist" }, as: OREOAdmin }
