              as: GeneralManager
              as_user_id: "${org_id}"
            - call: "POST /roster-moves"
              payload: { organization_id: "${org_id}", player_id: "${p1_id}", move_type: "RELEASE", contract_id: "${c1_id}", effective_at: "2026-08-10T00:00:00Z", expected_organization_version: "${org_v_after_patch}" }
