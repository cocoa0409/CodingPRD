  - method: POST
    path: "/vessels/{vessel_id}/voyages/{voyage_id}/noncompliance/{record_id}/close"
    description: "Close a RESPONDED noncompliance"
    roles: [FlagSurveyor]
    code: 200
    input: []
    output: NoncomplianceRecord
    side_effects: ["response_status RESPONDED -> CLOSED", "vessel.compliance_posture recomputed"]

  # --- Deficiencies ---
  - method: GET
    path: "/vessels/{vessel_id}/deficiencies"
