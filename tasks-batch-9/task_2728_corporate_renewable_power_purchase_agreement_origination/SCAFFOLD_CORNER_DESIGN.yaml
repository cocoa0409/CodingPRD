          assert:
            - "immediately before the first trigger call TermSheetRound.${late_round}.status is still OPEN with response_deadline 2026-08-15T00:00:00Z, five days behind the clock - nothing expires a round on a read"
            - "the first trigger call returns 409 ERR_ROUND_EXPIRED, not 409 ERR_INVALID_STATE_TRANSITION, and leaves the round OPEN and Deal.${deal_id}.status at TERM_SHEET_ISSUED"
            - "the second trigger call returns 201 and, as a side effect, flips TermSheetRound.${late_round} to EXPIRED because its response_deadline is behind the clock; TermSheetRound.${fresh_round}.round_number == 2 and Deal.round_count == 2"
            - "the deal came from TERM_SHEET_ISSUED and returns to TERM_SHEET_ISSUED, re-priced to 23.75 = 23.00 + 0.75 by the new round's terms"
