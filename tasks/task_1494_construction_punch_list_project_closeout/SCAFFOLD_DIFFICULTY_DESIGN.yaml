# =============================================================================
# §1.8 Scaffold Difficulty Design — construction-closeout
# Nine Difficulty Rules x 2 instances. All chains replay from empty-DB.
# Logical clock default: 2026-08-01T00:00:00Z.
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------- Rule 1
  - rule_id: dual_variant_calc
    instances:
      - name: retainage_reduction_standard_vs_adjusted_variant
        grounds:
          - calculations.release_amount
          - calculations.retainage_held_cents
          - entities.Project.fields.reduction_policy
        distinguishing_aspect: |
          Two valid variants of the SAME money calculation on the RetainageRelease/Project
          domain, selected by Project.reduction_policy: identical inputs (held 1000000 cents,
          2 blocking MINOR items) yield 500000 cents under STANDARD and 450000 cents under
          ADJUSTED (500000 - 2*25000).
        test_recipe:
          setup:
            - "Project A: reduction_policy=STANDARD, contract 10000000, retainage_pct 0.10 -> held 1000000; status SUBSTANTIALLY_COMPLETE with exactly 2 blocking MINOR items"
            - "Project B: identical except reduction_policy=ADJUSTED"
          setup_api_calls:
            - { call: "POST /closeout/projects", payload: { name: "Proj A", contract_value_cents: 10000000, retainage_pct: 0.10, reduction_policy: "STANDARD", warranty_sla_mode: "CALENDAR" }, as: GCProjectManager, captures: { pa: $.data.id } }
            - { call: "POST /closeout/projects", payload: { name: "Proj B", contract_value_cents: 10000000, retainage_pct: 0.10, reduction_policy: "ADJUSTED", warranty_sla_mode: "CALENDAR" }, as: GCProjectManager, captures: { pb: $.data.id } }
            - { call: "POST /closeout/trade-packages", payload: { project_id: "${pa}", trade_name: "ELECTRICAL", responsible_type: "SUBCONTRACTOR", subcontractor_org: "SparkyCo" }, as: GCProjectManager, captures: { ta: $.data.id } }
            - { call: "POST /closeout/trade-packages", payload: { project_id: "${pb}", trade_name: "ELECTRICAL", responsible_type: "SUBCONTRACTOR", subcontractor_org: "SparkyCo" }, as: GCProjectManager, captures: { tb: $.data.id } }
            - { call: "POST /closeout/projects/${pa}/begin-punch", as: GCProjectManager }
            - { call: "POST /closeout/projects/${pb}/begin-punch", as: GCProjectManager }
            - { call: "POST /closeout/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T12:00:00Z" }, as: GCProjectManager }
            - { call: "POST /closeout/punch-walks", payload: { project_id: "${pa}", trade_package_id: "${ta}", lead_inspector_id: "insp-1", scheduled_start: "2026-08-03T09:00:00Z", scheduled_end: "2026-08-03T10:00:00Z" }, as: GCProjectManager, captures: { wa: $.data.id } }
            - { call: "POST /closeout/punch-walks", payload: { project_id: "${pb}", trade_package_id: "${tb}", lead_inspector_id: "insp-1", scheduled_start: "2026-08-03T11:00:00Z", scheduled_end: "2026-08-03T12:00:00Z" }, as: GCProjectManager, captures: { wb: $.data.id } }
            - { call: "POST /closeout/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T12:00:00Z" }, as: GCProjectManager }
            - { call: "POST /closeout/punch-walks/${wa}/complete", as: GCInspector }
            - { call: "POST /closeout/punch-walks/${wb}/complete", as: GCInspector }
            - { call: "POST /closeout/punch-items", payload: { project_id: "${pa}", trade_package_id: "${ta}", title: "Paint touch-up", severity: "MINOR", location_building: "B1", location_floor: "L2", location_area: "Room 204", photo_ref: "img-a1" }, as: GCInspector }
            - { call: "POST /closeout/punch-items", payload: { project_id: "${pa}", trade_package_id: "${ta}", title: "Door sweep gap", severity: "MINOR", location_building: "B1", location_floor: "L2", location_area: "Room 205", photo_ref: "img-a2" }, as: GCInspector }
            - { call: "POST /closeout/punch-items", payload: { project_id: "${pb}", trade_package_id: "${tb}", title: "Paint touch-up", severity: "MINOR", location_building: "B1", location_floor: "L2", location_area: "Room 204", photo_ref: "img-b1" }, as: GCInspector }
            - { call: "POST /closeout/punch-items", payload: { project_id: "${pb}", trade_package_id: "${tb}", title: "Door sweep gap", severity: "MINOR", location_building: "B1", location_floor: "L2", location_area: "Room 205", photo_ref: "img-b2" }, as: GCInspector }
            - { call: "POST /closeout/projects/${pa}/request-sc-review", as: GCProjectManager }
            - { call: "POST /closeout/projects/${pb}/request-sc-review", as: GCProjectManager }
            - { call: "POST /closeout/projects/${pa}/determine-substantial-completion", payload: { approved: true }, as: OwnerRep }
            - { call: "POST /closeout/projects/${pb}/determine-substantial-completion", payload: { approved: true }, as: OwnerRep }
            - { call: "GET /closeout/projects/${pa}", as: GCProjectManager, captures: { pav: $.data.version } }
            - { call: "GET /closeout/projects/${pb}", as: GCProjectManager, captures: { pbv: $.data.version } }
          trigger:
            - { call: "POST /closeout/retainage-releases", payload: { project_id: "${pa}", kind: "REDUCTION", expected_project_version: "${pav}" }, as: GCProjectManager, captures: { rel_a_amt: $.data.amount_cents } }
            - { call: "POST /closeout/retainage-releases", payload: { project_id: "${pb}", kind: "REDUCTION", expected_project_version: "${pbv}" }, as: GCProjectManager, captures: { rel_b_amt: $.data.amount_cents } }
          assert:
            - "Project.${pa}.retainage_held_cents == 1000000"
            - "Project.${pb}.retainage_held_cents == 1000000"
            - "${rel_a_amt} == 500000  # STANDARD: round(1000000 * 0.5)"
            - "${rel_b_amt} == 450000  # ADJUSTED: 500000 - 2*25000"
            - "${rel_a_amt} != ${rel_b_amt} for identical held amount and identical open minor count"

      - name: warranty_sla_calendar_vs_business_variant
        grounds:
          - calculations.warranty_sla_due_at
          - entities.Project.fields.warranty_sla_mode
          - state_machines.WarrantyCase.REPORTED_to_TRIAGED
        distinguishing_aspect: |
          Two valid variants of a TIME calculation on the WarrantyCase domain (different
          entity domain than Rule-1 instance 1): triaging a MAJOR case at Friday
          2026-09-04T10:00:00Z yields sla_due_at 2026-09-11T10:00:00Z under CALENDAR and
          2026-09-15T10:00:00Z under BUSINESS (7 business days skip two weekends).
        test_recipe:
          setup:
            - "Project A fully closed with warranty_sla_mode=CALENDAR; warranty case reported"
            - "Project B fully closed with warranty_sla_mode=BUSINESS; warranty case reported"
            - "Logical clock set to Friday 2026-09-04T10:00:00Z before triage"
          setup_api_calls:
            - { call: "POST /closeout/projects", payload: { name: "Proj A", contract_value_cents: 10000000, retainage_pct: 0.10, reduction_policy: "STANDARD", warranty_sla_mode: "CALENDAR" }, as: GCProjectManager, captures: { pa: $.data.id } }
            - { call: "POST /closeout/projects", payload: { name: "Proj B", contract_value_cents: 10000000, retainage_pct: 0.10, reduction_policy: "STANDARD", warranty_sla_mode: "BUSINESS" }, as: GCProjectManager, captures: { pb: $.data.id } }
            - { call: "POST /closeout/trade-packages", payload: { project_id: "${pa}", trade_name: "ELECTRICAL", responsible_type: "SUBCONTRACTOR", subcontractor_org: "SparkyCo" }, as: GCProjectManager, captures: { ta: $.data.id } }
            - { call: "POST /closeout/trade-packages", payload: { project_id: "${pb}", trade_name: "ELECTRICAL", responsible_type: "SUBCONTRACTOR", subcontractor_org: "SparkyCo" }, as: GCProjectManager, captures: { tb: $.data.id } }
            - { call: "POST /closeout/projects/${pa}/begin-punch", as: GCProjectManager }
            - { call: "POST /closeout/projects/${pb}/begin-punch", as: GCProjectManager }
            - { call: "POST /closeout/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T12:00:00Z" }, as: GCProjectManager }
            - { call: "POST /closeout/punch-walks", payload: { project_id: "${pa}", trade_package_id: "${ta}", lead_inspector_id: "insp-1", scheduled_start: "2026-08-03T09:00:00Z", scheduled_end: "2026-08-03T10:00:00Z" }, as: GCProjectManager, captures: { wa: $.data.id } }
            - { call: "POST /closeout/punch-walks", payload: { project_id: "${pb}", trade_package_id: "${tb}", lead_inspector_id: "insp-1", scheduled_start: "2026-08-03T11:00:00Z", scheduled_end: "2026-08-03T12:00:00Z" }, as: GCProjectManager, captures: { wb: $.data.id } }
            - { call: "POST /closeout/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T12:00:00Z" }, as: GCProjectManager }
            - { call: "POST /closeout/punch-walks/${wa}/complete", as: GCInspector }
            - { call: "POST /closeout/punch-walks/${wb}/complete", as: GCInspector }
            - { call: "POST /closeout/projects/${pa}/request-sc-review", as: GCProjectManager }
            - { call: "POST /closeout/projects/${pb}/request-sc-review", as: GCProjectManager }
            - { call: "POST /closeout/projects/${pa}/determine-substantial-completion", payload: { approved: true }, as: OwnerRep }
            - { call: "POST /closeout/projects/${pb}/determine-substantial-completion", payload: { approved: true }, as: OwnerRep }
            - { call: "POST /closeout/projects/${pa}/register-beneficial-occupancy", payload: { occupancy_date: "2026-08-04T00:00:00Z" }, as: OwnerRep }
            - { call: "POST /closeout/projects/${pb}/register-beneficial-occupancy", payload: { occupancy_date: "2026-08-04T00:00:00Z" }, as: OwnerRep }
            - { call: "POST /closeout/projects/${pa}/start-closeout", as: GCProjectManager }
            - { call: "POST /closeout/projects/${pb}/start-closeout", as: GCProjectManager }
            - { call: "POST /closeout/closeout-documents", payload: { project_id: "${pa}", trade_package_id: "${ta}", doc_type: "OM_MANUAL", file_ref: "om-a" }, as: SubcontractorRep, as_user_id: "${ta}", captures: { da1: $.data.id } }
            - { call: "POST /closeout/closeout-documents", payload: { project_id: "${pa}", trade_package_id: "${ta}", doc_type: "WARRANTY_DOC", file_ref: "wd-a" }, as: SubcontractorRep, as_user_id: "${ta}", captures: { da2: $.data.id } }
            - { call: "POST /closeout/closeout-documents", payload: { project_id: "${pa}", trade_package_id: "${ta}", doc_type: "AS_BUILT", file_ref: "ab-a" }, as: SubcontractorRep, as_user_id: "${ta}", captures: { da3: $.data.id } }
            - { call: "POST /closeout/closeout-documents", payload: { project_id: "${pb}", trade_package_id: "${tb}", doc_type: "OM_MANUAL", file_ref: "om-b" }, as: SubcontractorRep, as_user_id: "${tb}", captures: { db1: $.data.id } }
            - { call: "POST /closeout/closeout-documents", payload: { project_id: "${pb}", trade_package_id: "${tb}", doc_type: "WARRANTY_DOC", file_ref: "wd-b" }, as: SubcontractorRep, as_user_id: "${tb}", captures: { db2: $.data.id } }
            - { call: "POST /closeout/closeout-documents", payload: { project_id: "${pb}", trade_package_id: "${tb}", doc_type: "AS_BUILT", file_ref: "ab-b" }, as: SubcontractorRep, as_user_id: "${tb}", captures: { db3: $.data.id } }
            - { call: "POST /closeout/closeout-documents/${da1}/approve", as: GCProjectManager }
            - { call: "POST /closeout/closeout-documents/${da2}/approve", as: GCProjectManager }
            - { call: "POST /closeout/closeout-documents/${da3}/approve", as: GCProjectManager }
            - { call: "POST /closeout/closeout-documents/${db1}/approve", as: GCProjectManager }
            - { call: "POST /closeout/closeout-documents/${db2}/approve", as: GCProjectManager }
            - { call: "POST /closeout/closeout-documents/${db3}/approve", as: GCProjectManager }
            - { call: "POST /closeout/trade-packages/${ta}/lien-waiver-submission", payload: { waiver_type: "UNCONDITIONAL", amount_cents: 1000000, file_ref: "wvr-a" }, as: SubcontractorRep, as_user_id: "${ta}" }
            - { call: "POST /closeout/trade-packages/${tb}/lien-waiver-submission", payload: { waiver_type: "UNCONDITIONAL", amount_cents: 1000000, file_ref: "wvr-b" }, as: SubcontractorRep, as_user_id: "${tb}" }
            - { call: "POST /closeout/trade-packages/${ta}/lien-waiver-decision", payload: { decision: "ACCEPT" }, as: GCProjectManager }
            - { call: "POST /closeout/trade-packages/${tb}/lien-waiver-decision", payload: { decision: "ACCEPT" }, as: GCProjectManager }
            - { call: "POST /closeout/training-sessions", payload: { project_id: "${pa}", trade_package_id: "${ta}", system_name: "AHU-1 controls", location_room: "TR-A", scheduled_start: "2026-08-05T09:00:00Z", scheduled_end: "2026-08-05T10:00:00Z" }, as: GCProjectManager, captures: { sa: $.data.id } }
            - { call: "POST /closeout/training-sessions", payload: { project_id: "${pb}", trade_package_id: "${tb}", system_name: "AHU-1 controls", location_room: "TR-B", scheduled_start: "2026-08-05T09:00:00Z", scheduled_end: "2026-08-05T10:00:00Z" }, as: GCProjectManager, captures: { sb: $.data.id } }
            - { call: "POST /closeout/_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T09:00:00Z" }, as: GCProjectManager }
            - { call: "POST /closeout/training-sessions/${sa}/conduct", payload: { attendee_count: 4 }, as: GCProjectManager }
            - { call: "POST /closeout/training-sessions/${sb}/conduct", payload: { attendee_count: 4 }, as: GCProjectManager }
            - { call: "GET /closeout/projects/${pa}", as: GCProjectManager, captures: { pav: $.data.version } }
            - { call: "GET /closeout/projects/${pb}", as: GCProjectManager, captures: { pbv: $.data.version } }
            - { call: "POST /closeout/retainage-releases", payload: { project_id: "${pa}", kind: "FINAL", expected_project_version: "${pav}" }, as: GCProjectManager, captures: { ra: $.data.id } }
            - { call: "POST /closeout/retainage-releases", payload: { project_id: "${pb}", kind: "FINAL", expected_project_version: "${pbv}" }, as: GCProjectManager, captures: { rb: $.data.id } }
            - { call: "POST /closeout/retainage-releases/${ra}/approve", as: OwnerRep }
            - { call: "POST /closeout/retainage-releases/${rb}/approve", as: OwnerRep }
            - { call: "POST /closeout/projects/${pa}/close", as: GCProjectManager }
            - { call: "POST /closeout/projects/${pb}/close", as: GCProjectManager }
            - { call: "POST /closeout/warranty-cases", payload: { project_id: "${pa}", title: "Lobby door drags", severity: "MINOR", description: "Door closer weak" }, as: OwnerRep, captures: { ca: $.data.id } }
            - { call: "POST /closeout/warranty-cases", payload: { project_id: "${pb}", title: "Lobby door drags", severity: "MINOR", description: "Door closer weak" }, as: OwnerRep, captures: { cb: $.data.id } }
            - { call: "POST /closeout/_clock/set_current_utc", payload: { to_iso8601: "2026-09-04T10:00:00Z" }, as: GCProjectManager }
          trigger:
            - { call: "POST /closeout/warranty-cases/${ca}/triage", payload: { severity: "MAJOR" }, as: GCProjectManager, captures: { sla_a: $.data.sla_due_at } }
            - { call: "POST /closeout/warranty-cases/${cb}/triage", payload: { severity: "MAJOR" }, as: GCProjectManager, captures: { sla_b: $.data.sla_due_at } }
          assert:
            - "${sla_a} == 2026-09-11T10:00:00Z  # CALENDAR: +7 days from Friday 2026-09-04"
            - "${sla_b} == 2026-09-15T10:00:00Z  # BUSINESS: 7 business days skipping Sep 5-6 and Sep 12-13"
            - "${sla_a} != ${sla_b} for identical triage instant and severity"

  # ---------------------------------------------------------------- Rule 2
  - rule_id: combinatorial_formula
    instances:
      - name: adjusted_reduction_multifactor_withholding
        grounds:
          - calculations.release_amount
        distinguishing_aspect: |
          Mode (a) combinatorial formula: >= 3 inputs (retainage_held_cents, REDUCTION_PCT,
          open_blocking_minor_count, MINOR_WITHHOLD_CENTS) with non-linear interaction
          (conditional variant branch + nested max(0, ...) floor). With held 1000000 and
          3 blocking minors the result is 500000 - 3*25000 = 425000, distinct from both the
          2-minor case (450000) and the flat STANDARD result (500000).
        test_recipe:
          setup:
            - "ADJUSTED project, contract 10000000, retainage_pct 0.10 -> held 1000000; SUBSTANTIALLY_COMPLETE with exactly 3 blocking MINOR items"
          setup_api_calls:
            - { call: "POST /closeout/projects", payload: { name: "Proj Adj", contract_value_cents: 10000000, retainage_pct: 0.10, reduction_policy: "ADJUSTED", warranty_sla_mode: "CALENDAR" }, as: GCProjectManager, captures: { pa: $.data.id } }
            - { call: "POST /closeout/trade-packages", payload: { project_id: "${pa}", trade_name: "ELECTRICAL", responsible_type: "SUBCONTRACTOR", subcontractor_org: "SparkyCo" }, as: GCProjectManager, captures: { ta: $.data.id } }
            - { call: "POST /closeout/projects/${pa}/begin-punch", as: GCProjectManager }
            - { call: "POST /closeout/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T12:00:00Z" }, as: GCProjectManager }
            - { call: "POST /closeout/punch-walks", payload: { project_id: "${pa}", trade_package_id: "${ta}", lead_inspector_id: "insp-1", scheduled_start: "2026-08-03T09:00:00Z", scheduled_end: "2026-08-03T10:00:00Z" }, as: GCProjectManager, captures: { wa: $.data.id } }
            - { call: "POST /closeout/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T10:00:00Z" }, as: GCProjectManager }
            - { call: "POST /closeout/punch-walks/${wa}/complete", as: GCInspector }
            - { call: "POST /closeout/punch-items", payload: { project_id: "${pa}", trade_package_id: "${ta}", title: "Paint", severity: "MINOR", location_building: "B1", location_floor: "L2", location_area: "R201", photo_ref: "img-1" }, as: GCInspector }
            - { call: "POST /closeout/punch-items", payload: { project_id: "${pa}", trade_package_id: "${ta}", title: "Sweep", severity: "MINOR", location_building: "B1", location_floor: "L2", location_area: "R202", photo_ref: "img-2" }, as: GCInspector }
            - { call: "POST /closeout/punch-items", payload: { project_id: "${pa}", trade_package_id: "${ta}", title: "Caulk", severity: "MINOR", location_building: "B1", location_floor: "L2", location_area: "R203", photo_ref: "img-3" }, as: GCInspector }
            - { call: "POST /closeout/projects/${pa}/request-sc-review", as: GCProjectManager }
            - { call: "POST /closeout/projects/${pa}/determine-substantial-completion", payload: { approved: true }, as: OwnerRep }
            - { call: "GET /closeout/projects/${pa}", as: GCProjectManager, captures: { pav: $.data.version } }
          trigger:
            - { call: "POST /closeout/retainage-releases", payload: { project_id: "${pa}", kind: "REDUCTION", expected_project_version: "${pav}" }, as: GCProjectManager, captures: { rel_amt: $.data.amount_cents } }
          assert:
            - "${rel_amt} == 425000  # max(0, round(1000000*0.5) - 3*25000)"
            - "Project.${pa}.open_minor_count == 3 at request time"

      - name: reduction_rounding_order_held_then_half
        grounds:
          - calculations.retainage_held_cents
          - calculations.release_amount
        distinguishing_aspect: |
          Mode (b) nested rounding where order matters: the scaffold pins 'round held first,
          then round held*0.5'. contract_value_cents=10000005, pct=0.10 -> held rounds to
          1000001, then STANDARD reduction = round(1000001*0.5) = 500001. The naive
          single-pass order round(contract*pct*0.5) = round(500000.25) = 500000 disagrees by
          one cent; only the pinned order is correct.
        test_recipe:
          setup:
            - "STANDARD project with contract_value_cents 10000005, retainage_pct 0.10; SUBSTANTIALLY_COMPLETE with zero punch items"
          setup_api_calls:
            - { call: "POST /closeout/projects", payload: { name: "Proj Round", contract_value_cents: 10000005, retainage_pct: 0.10, reduction_policy: "STANDARD", warranty_sla_mode: "CALENDAR" }, as: GCProjectManager, captures: { pa: $.data.id } }
            - { call: "POST /closeout/trade-packages", payload: { project_id: "${pa}", trade_name: "ELECTRICAL", responsible_type: "SUBCONTRACTOR", subcontractor_org: "SparkyCo" }, as: GCProjectManager, captures: { ta: $.data.id } }
            - { call: "POST /closeout/projects/${pa}/begin-punch", as: GCProjectManager }
            - { call: "POST /closeout/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T12:00:00Z" }, as: GCProjectManager }
            - { call: "POST /closeout/punch-walks", payload: { project_id: "${pa}", trade_package_id: "${ta}", lead_inspector_id: "insp-1", scheduled_start: "2026-08-03T09:00:00Z", scheduled_end: "2026-08-03T10:00:00Z" }, as: GCProjectManager, captures: { wa: $.data.id } }
            - { call: "POST /closeout/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T10:00:00Z" }, as: GCProjectManager }
            - { call: "POST /closeout/punch-walks/${wa}/complete", as: GCInspector }
            - { call: "POST /closeout/projects/${pa}/request-sc-review", as: GCProjectManager }
            - { call: "POST /closeout/projects/${pa}/determine-substantial-completion", payload: { approved: true }, as: OwnerRep }
            - { call: "GET /closeout/projects/${pa}", as: GCProjectManager, captures: { pav: $.data.version } }
          trigger:
            - { call: "POST /closeout/retainage-releases", payload: { project_id: "${pa}", kind: "REDUCTION", expected_project_version: "${pav}" }, as: GCProjectManager, captures: { rel_amt: $.data.amount_cents } }
          assert:
            - "Project.${pa}.retainage_held_cents == 1000001  # round_half_up(10000005 * 0.10)"
            - "${rel_amt} == 500001  # round_half_up(1000001 * 0.5); naive round(10000005*0.10*0.5)=500000 is WRONG"

  # ---------------------------------------------------------------- Rule 3
  - rule_id: non_linear_state_machine
    instances:
      - name: punch_item_ready_reject_ready_cycle
        grounds:
          - state_machines.PunchItem.OPEN_to_READY_FOR_REVIEW
          - state_machines.PunchItem.READY_FOR_REVIEW_to_OPEN
          - state_machines.PunchItem.READY_FOR_REVIEW_to_VERIFIED
        distinguishing_aspect: |
          PunchItem has a CYCLE (OPEN -> READY_FOR_REVIEW -> OPEN on failed re-inspection),
          belonging to entity PunchItem; rejection_count and ready_by_user_id must evolve
          correctly across the loop (count increments, ready_by cleared and re-stamped).
        test_recipe:
          setup:
            - "PUNCH_ACTIVE project, SUBCONTRACTOR trade with a COMPLETED walk, one OPEN MINOR item"
          setup_api_calls:
            - { call: "POST /closeout/projects", payload: { name: "Proj Cyc", contract_value_cents: 10000000, retainage_pct: 0.10, reduction_policy: "STANDARD", warranty_sla_mode: "CALENDAR" }, as: GCProjectManager, captures: { pa: $.data.id } }
            - { call: "POST /closeout/trade-packages", payload: { project_id: "${pa}", trade_name: "ELECTRICAL", responsible_type: "SUBCONTRACTOR", subcontractor_org: "SparkyCo" }, as: GCProjectManager, captures: { ta: $.data.id } }
            - { call: "POST /closeout/projects/${pa}/begin-punch", as: GCProjectManager }
            - { call: "POST /closeout/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T12:00:00Z" }, as: GCProjectManager }
            - { call: "POST /closeout/punch-walks", payload: { project_id: "${pa}", trade_package_id: "${ta}", lead_inspector_id: "insp-1", scheduled_start: "2026-08-03T09:00:00Z", scheduled_end: "2026-08-03T10:00:00Z" }, as: GCProjectManager, captures: { wa: $.data.id } }
            - { call: "POST /closeout/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T10:00:00Z" }, as: GCProjectManager }
            - { call: "POST /closeout/punch-walks/${wa}/complete", as: GCInspector }
            - { call: "POST /closeout/punch-items", payload: { project_id: "${pa}", trade_package_id: "${ta}", title: "Paint", severity: "MINOR", location_building: "B1", location_floor: "L2", location_area: "R201", photo_ref: "img-1" }, as: GCInspector, captures: { it: $.data.id } }
            - { call: "POST /closeout/punch-items/${it}/mark-ready", as: SubcontractorRep, as_user_id: "${ta}" }
          trigger:
            - { call: "POST /closeout/punch-items/${it}/reject", payload: { reason: "Still visible patch" }, as: GCInspector, captures: { rc: $.data.rejection_count } }
            - { call: "POST /closeout/punch-items/${it}/mark-ready", as: SubcontractorRep, as_user_id: "${ta}" }
            - { call: "POST /closeout/punch-items/${it}/verify", as: GCInspector, as_user_id: "insp-1", captures: { st: $.data.status } }
          assert:
            - "PunchItem.${it}.status == OPEN after reject (cycle back, not terminal)"
            - "${rc} == 1"
            - "PunchItem.${it}.ready_by_user_id == null immediately after reject"
            - "Second mark-ready succeeds (cycle re-entry) and re-stamps ready_by_user_id == ${ta}"
            - "${st} == VERIFIED after successful re-inspection"

      - name: project_sc_review_rejection_cycle
        grounds:
          - state_machines.Project.PUNCH_ACTIVE_to_SC_REVIEW
          - state_machines.Project.SC_REVIEW_to_PUNCH_ACTIVE
          - state_machines.Project.SC_REVIEW_to_SUBSTANTIALLY_COMPLETE
        distinguishing_aspect: |
          Project has a REVISION LOOP (PUNCH_ACTIVE -> SC_REVIEW -> PUNCH_ACTIVE on owner
          rejection, then re-entry) on a DIFFERENT entity than the PunchItem cycle;
          sc_rejection_count must increment exactly once per bounce and eligibility is
          re-evaluated on re-entry.
        test_recipe:
          setup:
            - "PUNCH_ACTIVE project, one trade with COMPLETED walk, zero punch items"
          setup_api_calls:
            - { call: "POST /closeout/projects", payload: { name: "Proj SC", contract_value_cents: 10000000, retainage_pct: 0.10, reduction_policy: "STANDARD", warranty_sla_mode: "CALENDAR" }, as: GCProjectManager, captures: { pa: $.data.id } }
            - { call: "POST /closeout/trade-packages", payload: { project_id: "${pa}", trade_name: "ELECTRICAL", responsible_type: "SUBCONTRACTOR", subcontractor_org: "SparkyCo" }, as: GCProjectManager, captures: { ta: $.data.id } }
            - { call: "POST /closeout/projects/${pa}/begin-punch", as: GCProjectManager }
            - { call: "POST /closeout/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T12:00:00Z" }, as: GCProjectManager }
            - { call: "POST /closeout/punch-walks", payload: { project_id: "${pa}", trade_package_id: "${ta}", lead_inspector_id: "insp-1", scheduled_start: "2026-08-03T09:00:00Z", scheduled_end: "2026-08-03T10:00:00Z" }, as: GCProjectManager, captures: { wa: $.data.id } }
            - { call: "POST /closeout/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T10:00:00Z" }, as: GCProjectManager }
            - { call: "POST /closeout/punch-walks/${wa}/complete", as: GCInspector }
            - { call: "POST /closeout/projects/${pa}/request-sc-review", as: GCProjectManager }
          trigger:
            - { call: "POST /closeout/projects/${pa}/determine-substantial-completion", payload: { approved: false, rejection_note: "Owner wants corridor re-checked" }, as: OwnerRep, captures: { st1: $.data.status, rc1: $.data.sc_rejection_count } }
            - { call: "POST /closeout/projects/${pa}/request-sc-review", as: GCProjectManager }
            - { call: "POST /closeout/projects/${pa}/determine-substantial-completion", payload: { approved: true }, as: OwnerRep, captures: { st2: $.data.status, rc2: $.data.sc_rejection_count } }
          assert:
            - "${st1} == PUNCH_ACTIVE  # bounced back, not stuck in SC_REVIEW"
            - "${rc1} == 1"
            - "${st2} == SUBSTANTIALLY_COMPLETE  # loop re-entry succeeds"
            - "${rc2} == 1  # rejection counter not incremented by approval"
            - "Project.${pa}.substantial_completion_date == 2026-08-03T10:00:00Z (logical clock at determination)"

  # ---------------------------------------------------------------- Rule 4
  - rule_id: transitive_cascade
    instances:
      - name: verify_last_item_cascades_trade_ready_to_project_advance
        grounds:
          - state_machines.PunchItem.READY_FOR_REVIEW_to_VERIFIED
          - calculations.trade_closeout_ready
          - state_machines.Project.CLOSEOUT_IN_PROGRESS_to_FINAL_RELEASE_PENDING
        distinguishing_aspect: |
          Depth-3 cascade triggered by punch-item VERIFY: item VERIFIED decrements
          TradePackage.open_item_count (link 1), which flips TradePackage.closeout_ready
          to true (link 2), which — being the last unready trade while the project is
          CLOSEOUT_IN_PROGRESS — auto-transitions Project to FINAL_RELEASE_PENDING (link 3).
        test_recipe:
          setup:
            - "Project CLOSEOUT_IN_PROGRESS; single trade has all 3 docs APPROVED, UNCONDITIONAL waiver ACCEPTED, training CONDUCTED, but exactly one MINOR punch item still blocking (open_item_count == 1)"
            - "Project NOT yet FINAL_RELEASE_PENDING before the trigger"
