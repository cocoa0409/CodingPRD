              as: BenefitsAdministrator
            - call: "POST /api/accounts/${account_id}/settle-entries"
              as: BenefitsAdministrator
            - call: "POST /api/separation-cases"
              payload: { participant_id: "${participant_id}", alleged_separation_date: "2027-03-15", trigger_reason: "TERMINATION" }
              as: BenefitsAdministrator
              as_user_id: "ba-1"
              captures: { case_id: $.data.id }
            - call: "POST /api/separation-cases/${case_id}/service-records"
              payload: { period_start: "2024-03-15", period_end: "2025-03-15", service_fraction_bp: 6000 }
              as: BenefitsAdministrator
            - call: "POST /api/separation-cases/${case_id}/service-records"
              payload: { period_start: "2025-03-15", period_end: "2026-03-15", service_fraction_bp: 2000 }
              as: BenefitsAdministrator
            - call: "POST /api/separation-cases/${case_id}/service-records"
