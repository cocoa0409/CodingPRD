            - { call: "POST /research/licenses/${lic}/state", payload: { to_status: "ACTIVE" }, as: LicensingManager }
          trigger:
            - { call: "POST /research/licenses/${lic}/state", payload: { to_status: "SUSPENDED" }, as: LicensingManager }
