              payload: {}
              as: NoSuchRole
              captures: { err: $.data.error_id }
          assert:
            - "response code 401"
            - "response error_id == ERR_UNAUTHENTICATED"

      - name: clerk_cannot_levy_assessment
        claim_type: unauthorized_operation
        grounds: ["roles", "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "A BillingClerk calling POST /capital-assessments/{id}/levy (ClubManager-exclusive) -> ERR_UNAUTHORIZED (403)."
        test_recipe:
          setup: ["Club; SOCIAL category; one membership activated; DRAFT EQUAL assessment total 1000."]
          setup_api_calls:
            - call: "POST /clubs"
              payload: { name: "R4 Club" }
