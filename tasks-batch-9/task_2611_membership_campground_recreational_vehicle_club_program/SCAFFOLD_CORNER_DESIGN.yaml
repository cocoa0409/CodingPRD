            - "POST /dues-invoices/{unknown}/payments: HTTP 404 ERR_DUES_INVOICE_NOT_FOUND — issued as ClubAdmin, so the priority-3 owner rule does not apply and priority 10 reports before the priority-47 amount rule"
            - "POST /transfer-requests/{unknown}/decision: HTTP 404 ERR_TRANSFER_REQUEST_NOT_FOUND, ahead of the priority-22 state rule"
            - "POST /maintenance-windows/{unknown}/activation: HTTP 404 ERR_MAINTENANCE_WINDOW_NOT_FOUND — no park can be resolved from an unknown window id, so the existence rule reports rather than the priority-4 scope rule"
