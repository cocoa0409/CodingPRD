  - method: GET
    path: "/tooling/carbide-grades/{gradeId}"
    description: "Read one carbide grade including its current revision and qualified_product_count."
    roles: [MetallurgyEngineer, GeometryEngineer, CoatingEngineer, ApplicationEngineer, QualityApprover, ProductionPlanner]
    code: 200
