scaffold_difficulty_design:

  # ===========================================================================
  # Rule 1 — dual_variant_calc: two dual-variant calculations on DIFFERENT
  # entity domains (Booking money vs Customer fraud score).
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: supplier_remittance_provisional_vs_final_on_goodwill_chargeback
        grounds:
          - calculations.supplier_remittance
          - calculations.goodwill_chargeback
          - state_machines.SettlementBatch.DRAFT_to_APPROVED
        distinguishing_aspect: |
          supplier_remittance has two variants on the BOOKING money domain: the
          provisional variant runs on charged_price_cents at booking creation,
          the final variant runs on (charged_price_cents - goodwill_credit_cents)
          at batch approval when goodwill_chargeback applies — identical inputs
          except the goodwill deduction, producing different cents.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "Supplier S with opaque_commission_pct 0.18 and concealment_discount_min_pct 0.10."
            - "Property P (star 4, neighborhood NB1, published_rate_cents 20000) under S."
            - "DisclosureZone NB1 with min_star_rating 3 and revealed_amenity_codes [POOL]."
            - "RateWindow W on P: 2026-10-01 to 2026-10-05, opaque_rate_cents 15000, rooms_allocated 5."
            - "Customer C (CLEAR)."
            - "FIXED bid B: NB1, min_star 4, check-in 2026-10-02, check-out 2026-10-04 (2 nights). floor = ceil(15000*2*0.9) = 27000; accept creates Booking charged 27000, provisional remittance floor(27000*0.82) = 22140."
            - "ComplaintCase resolved GOODWILL_CREDIT 5000 (ratio 5000/27000 = 0.1852 > 0.15, chargeback applies) followed by grant-goodwill."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /opaque/suppliers"
              payload: { legal_name: "Acme Hospitality", opaque_commission_pct: 0.18, concealment_discount_min_pct: 0.10 }
              as: PlatformAdmin
              captures: { sup_id: $.data.id }
            - call: "POST /opaque/disclosure-zones"
              payload: { neighborhood_code: "NB1", min_star_rating: 3, revealed_amenity_codes: ["POOL"] }
              as: PlatformAdmin
            - call: "POST /opaque/properties"
              payload: { supplier_id: "${sup_id}", brand_name: "Acme Grand", star_rating: 4, neighborhood_code: "NB1", amenity_codes: ["POOL"], published_rate_cents: 20000 }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /opaque/rate-windows"
              payload: { property_id: "${prop_id}", check_in_date: "2026-10-01T00:00:00Z", check_out_date: "2026-10-05T00:00:00Z", opaque_rate_cents: 15000, rooms_allocated: 5 }
              as: PlatformAdmin
            - call: "POST /opaque/customers"
              payload: { email: "c1@x.com", full_name: "Cust One" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id, cust_v0: $.data.version }
            - call: "POST /opaque/opaque-bids"
              payload: { customer_id: "${cust_id}", neighborhood_code: "NB1", min_star_rating: 4, check_in_date: "2026-10-02T00:00:00Z", check_out_date: "2026-10-04T00:00:00Z", offer_mode: "FIXED" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { bid_id: $.data.id }
            - call: "POST /opaque/opaque-bids/${bid_id}/evaluate"
              payload: { expected_customer_version: "${cust_v0}" }
              as: PlatformAdmin
              captures: { booking_probe: $.data.winning_property_id }
            - call: "GET /opaque/bookings"
              payload: { customer_id: "${cust_id}" }
              as: PlatformAdmin
              captures: { booking_id: "$.data[0].id" }
            - call: "POST /opaque/complaint-cases"
              payload: { booking_id: "${booking_id}", category: "DISSATISFIED_REVEAL", description: "room faced the highway" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { case_id: $.data.id }
            - call: "POST /opaque/complaint-cases/${case_id}/start-review"
              payload: {}
              as: CustomerService
            - call: "POST /opaque/complaint-cases/${case_id}/resolve"
              payload: { resolution: "GOODWILL_CREDIT", goodwill_credit_cents: 5000 }
              as: CustomerService
            - call: "POST /opaque/bookings/${booking_id}/grant-goodwill"
              payload: {}
              as: CustomerService
          trigger:
            - call: "POST /opaque/settlement-batches"
              payload: { supplier_id: "${sup_id}", period_start_date: "2026-10-01T00:00:00Z", period_end_date: "2026-11-01T00:00:00Z" }
              as: FinanceOps
              captures: { batch_id: $.data.id, batch_v: $.data.version }
            - call: "POST /opaque/settlement-batches/${batch_id}/approve"
              payload: { expected_settlement_batch_version: "${batch_v}" }
              as: FinanceOps
          assert:
            - "after grant-goodwill the booking's provisional supplier_remittance_cents == 22140 and platform_commission_cents == 4860"
            - "after approve, Booking.${booking_id}.supplier_remittance_cents == 18040 (final variant on 27000-5000=22000: floor(22000*0.82)=18040)"
            - "Booking.${booking_id}.platform_commission_cents == 3960"
            - "Booking.${booking_id}.fulfillment_status == SETTLED and payment_status == PARTIALLY_REFUNDED"
            - "SettlementBatch.${batch_id}.goodwill_deduction_cents == 5000 and net_remittance_cents == gross_remittance_cents - 5000"

      - name: fraud_score_decay_uphold_vs_dismiss_on_customer_domain
        grounds:
          - calculations.fraud_score_recompute
          - state_machines.FraudFlag.OPEN_to_UPHELD
          - state_machines.FraudFlag.OPEN_to_DISMISSED
        distinguishing_aspect: |
          fraud_score_recompute is a dual-direction aggregation on the CUSTOMER
          domain: upholding a manual flag applies +score_delta, dismissing that
          same flag reverses exactly the applied delta with a floor at 0 — the
          two directions produce different fraud_status outcomes for the same flag.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Customer C (fraud_score 0, CLEAR)."
            - "Manual FraudFlag F1 on C with score_delta 30, reason MANUAL_REVIEW."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /opaque/customers"
              payload: { email: "c2@x.com", full_name: "Cust Two" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /opaque/fraud-flags"
              payload: { customer_id: "${cust_id}", reason_code: "MANUAL_REVIEW", score_delta: 30 }
              as: PlatformAdmin
              captures: { flag1_id: $.data.id }
          trigger:
            - call: "POST /opaque/fraud-flags/${flag1_id}/uphold"
              payload: {}
              as: PlatformAdmin
            - call: "POST /opaque/fraud-flags"
              payload: { customer_id: "${cust_id}", reason_code: "MANUAL_REVIEW", score_delta: 30 }
              as: PlatformAdmin
              captures: { flag2_id: $.data.id }
            - call: "POST /opaque/fraud-flags/${flag2_id}/uphold"
              payload: {}
              as: PlatformAdmin
            - call: "POST /opaque/fraud-flags/${flag2_id}/dismiss"
              payload: {}
              as: PlatformAdmin
              captures: { err2: $.data.error_id }
          assert:
            - "after the first uphold, Customer.${cust_id}.fraud_score == 30 and fraud_status == WATCH (30 >= 20, < 50)"
            - "after the second uphold, fraud_score == 60 and fraud_status == BLOCKED"
            - "the second dismiss returns 409 and err2 == ERR_INVALID_STATE (UPHELD is terminal; the applied delta is never reversed)"
            - "final Customer.${cust_id}.fraud_score == 60 and fraud_status == BLOCKED"

  # ===========================================================================
  # Rule 2 — combinatorial_formula: two instances in DIFFERENT modes.
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: opaque_price_floor_multi_input_tiered_mode_a
        grounds:
          - calculations.opaque_price_floor
          - entities.RateWindow.fields.opaque_rate_cents
          - entities.Supplier.fields.concealment_discount_min_pct
        distinguishing_aspect: |
          Mode (a): opaque_price_floor has >=3 inputs (opaque_rate_cents, nights,
          concealment_discount_min_pct) with non-linear interaction (ceil applied
          after multiplication, min across candidates) — two candidate properties
          with different rates and supplier minimums produce a computed_price_cents
          that is the per-candidate floor minimum, not a simple average.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "Supplier S1 (commission 0.15, min disc 0.20) with Property P1 (star 5, NB2, published 25000, amenities [POOL]) and RateWindow rate 13000 covering 2026-10-01..2026-10-05, rooms 5."
            - "Supplier S2 (commission 0.15, min disc 0.10) with Property P2 (star 4, NB2, published 18000, amenities [POOL]) and RateWindow rate 11000 covering 2026-10-01..2026-10-05, rooms 5."
            - "DisclosureZone NB2 (min star 3, revealed [POOL])."
            - "Customer C. FIXED bid for 2 nights 2026-10-02..2026-10-04, min star 4."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /opaque/suppliers"
              payload: { legal_name: "S1", opaque_commission_pct: 0.15, concealment_discount_min_pct: 0.20 }
              as: PlatformAdmin
              captures: { s1: $.data.id }
            - call: "POST /opaque/suppliers"
              payload: { legal_name: "S2", opaque_commission_pct: 0.15, concealment_discount_min_pct: 0.10 }
              as: PlatformAdmin
              captures: { s2: $.data.id }
            - call: "POST /opaque/disclosure-zones"
              payload: { neighborhood_code: "NB2", min_star_rating: 3, revealed_amenity_codes: ["POOL"] }
              as: PlatformAdmin
            - call: "POST /opaque/properties"
              payload: { supplier_id: "${s1}", brand_name: "P1", star_rating: 5, neighborhood_code: "NB2", amenity_codes: ["POOL"], published_rate_cents: 25000 }
              as: PlatformAdmin
              captures: { p1: $.data.id }
            - call: "POST /opaque/properties"
              payload: { supplier_id: "${s2}", brand_name: "P2", star_rating: 4, neighborhood_code: "NB2", amenity_codes: ["POOL"], published_rate_cents: 18000 }
              as: PlatformAdmin
              captures: { p2: $.data.id }
            - call: "POST /opaque/rate-windows"
              payload: { property_id: "${p1}", check_in_date: "2026-10-01T00:00:00Z", check_out_date: "2026-10-05T00:00:00Z", opaque_rate_cents: 13000, rooms_allocated: 5 }
              as: PlatformAdmin
            - call: "POST /opaque/rate-windows"
              payload: { property_id: "${p2}", check_in_date: "2026-10-01T00:00:00Z", check_out_date: "2026-10-05T00:00:00Z", opaque_rate_cents: 11000, rooms_allocated: 5 }
              as: PlatformAdmin
            - call: "POST /opaque/customers"
              payload: { email: "c3@x.com", full_name: "Cust Three" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /opaque/opaque-bids"
              payload: { customer_id: "${cust_id}", neighborhood_code: "NB2", min_star_rating: 4, check_in_date: "2026-10-02T00:00:00Z", check_out_date: "2026-10-04T00:00:00Z", offer_mode: "FIXED" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { bid_id: $.data.id }
          assert:
            - "OpaqueBid.${bid_id}.computed_price_cents == 19800 (min of floor P1 = ceil(13000*2*0.80) = 20800 and floor P2 = ceil(11000*2*0.90) = 19800)"

      - name: goodwill_chargeback_rounding_boundary_mode_b
        grounds:
          - calculations.goodwill_chargeback
          - calculations.supplier_remittance
          - entities.ComplaintCase.fields.goodwill_credit_cents
        distinguishing_aspect: |
          Mode (b): nested rounding where the order matters — goodwill ratio is
          rounded to 4 decimals before the strict > comparison against 0.15, and
          the final remittance floors AFTER the goodwill subtraction; swapping
          the rounding order flips the chargeback decision at the boundary.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "Supplier S (commission 0.18, min disc 0.10), Property P (star 4, NB3, published 20000, [POOL]), window rate 15000 covering 2026-10-01..2026-10-05, zone NB3."
            - "Customer C with FIXED bid 2026-10-02..2026-10-04 → charged 27000 (floor ceil(30000*0.9))."
            - "Complaint resolved GOODWILL_CREDIT 4050 → ratio 4050/27000 = 0.15 exactly — strict > means chargeback does NOT apply."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /opaque/suppliers"
              payload: { legal_name: "Acme", opaque_commission_pct: 0.18, concealment_discount_min_pct: 0.10 }
              as: PlatformAdmin
              captures: { sup_id: $.data.id }
            - call: "POST /opaque/disclosure-zones"
              payload: { neighborhood_code: "NB3", min_star_rating: 3, revealed_amenity_codes: ["POOL"] }
              as: PlatformAdmin
            - call: "POST /opaque/properties"
              payload: { supplier_id: "${sup_id}", brand_name: "P", star_rating: 4, neighborhood_code: "NB3", amenity_codes: ["POOL"], published_rate_cents: 20000 }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /opaque/rate-windows"
              payload: { property_id: "${prop_id}", check_in_date: "2026-10-01T00:00:00Z", check_out_date: "2026-10-05T00:00:00Z", opaque_rate_cents: 15000, rooms_allocated: 5 }
              as: PlatformAdmin
            - call: "POST /opaque/customers"
              payload: { email: "c4@x.com", full_name: "Cust Four" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id, cust_v0: $.data.version }
            - call: "POST /opaque/opaque-bids"
              payload: { customer_id: "${cust_id}", neighborhood_code: "NB3", min_star_rating: 4, check_in_date: "2026-10-02T00:00:00Z", check_out_date: "2026-10-04T00:00:00Z", offer_mode: "FIXED" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { bid_id: $.data.id }
            - call: "POST /opaque/opaque-bids/${bid_id}/evaluate"
              payload: { expected_customer_version: "${cust_v0}" }
              as: PlatformAdmin
            - call: "GET /opaque/bookings"
              payload: { customer_id: "${cust_id}" }
              as: PlatformAdmin
              captures: { booking_id: "$.data[0].id" }
            - call: "POST /opaque/complaint-cases"
              payload: { booking_id: "${booking_id}", category: "OTHER", description: "minor issue" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { case_id: $.data.id }
            - call: "POST /opaque/complaint-cases/${case_id}/start-review"
              payload: {}
              as: CustomerService
            - call: "POST /opaque/complaint-cases/${case_id}/resolve"
              payload: { resolution: "GOODWILL_CREDIT", goodwill_credit_cents: 4050 }
              as: CustomerService
            - call: "POST /opaque/bookings/${booking_id}/grant-goodwill"
              payload: {}
              as: CustomerService
          trigger:
            - call: "POST /opaque/settlement-batches"
              payload: { supplier_id: "${sup_id}", period_start_date: "2026-10-01T00:00:00Z", period_end_date: "2026-11-01T00:00:00Z" }
              as: FinanceOps
              captures: { batch_id: $.data.id }
          assert:
            - "SettlementBatch.${batch_id}.goodwill_deduction_cents == 0 (ratio exactly 0.15 is not strictly greater)"
            - "SettlementBatch.${batch_id}.net_remittance_cents == gross_remittance_cents"
            - "after approval the booking's final supplier_remittance_cents == provisional 22140"

  # ===========================================================================
  # Rule 3 — non_linear_state_machine: two non-linear machines on DIFFERENT entities.
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: booking_parallel_payment_and_fulfillment_dimensions
        grounds:
          - state_machines.Booking
          - entities.Booking.fields.payment_status
          - entities.Booking.fields.fulfillment_status
        distinguishing_aspect: |
          Booking carries two INDEPENDENT parallel state dimensions: payment_status
          (CAPTURED → REFUNDED | PARTIALLY_REFUNDED) and fulfillment_status
          (CONFIRMED → SERVICE_FAILED | SETTLED); a partial refund moves only the
          payment dimension while fulfillment stays CONFIRMED and remains settleable.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; base single-supplier setup (commission 0.18, min disc 0.10, NB4 zone, P star 4 published 20000, window rate 15000 Oct 1-5)."
            - "Customer C; FIXED bid for 2026-10-02..2026-10-04 accepted → Booking CONFIRMED/CAPTURED charged 27000."
            - "Complaint resolved GOODWILL_CREDIT 2000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /opaque/suppliers"
              payload: { legal_name: "Acme", opaque_commission_pct: 0.18, concealment_discount_min_pct: 0.10 }
              as: PlatformAdmin
              captures: { sup_id: $.data.id }
            - call: "POST /opaque/disclosure-zones"
              payload: { neighborhood_code: "NB4", min_star_rating: 3, revealed_amenity_codes: ["POOL"] }
              as: PlatformAdmin
            - call: "POST /opaque/properties"
              payload: { supplier_id: "${sup_id}", brand_name: "P", star_rating: 4, neighborhood_code: "NB4", amenity_codes: ["POOL"], published_rate_cents: 20000 }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /opaque/rate-windows"
              payload: { property_id: "${prop_id}", check_in_date: "2026-10-01T00:00:00Z", check_out_date: "2026-10-05T00:00:00Z", opaque_rate_cents: 15000, rooms_allocated: 5 }
              as: PlatformAdmin
            - call: "POST /opaque/customers"
              payload: { email: "c5@x.com", full_name: "Cust Five" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id, cust_v0: $.data.version }
            - call: "POST /opaque/opaque-bids"
              payload: { customer_id: "${cust_id}", neighborhood_code: "NB4", min_star_rating: 4, check_in_date: "2026-10-02T00:00:00Z", check_out_date: "2026-10-04T00:00:00Z", offer_mode: "FIXED" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { bid_id: $.data.id }
            - call: "POST /opaque/opaque-bids/${bid_id}/evaluate"
              payload: { expected_customer_version: "${cust_v0}" }
              as: PlatformAdmin
            - call: "GET /opaque/bookings"
              payload: { customer_id: "${cust_id}" }
              as: PlatformAdmin
              captures: { booking_id: "$.data[0].id" }
            - call: "POST /opaque/complaint-cases"
              payload: { booking_id: "${booking_id}", category: "DISSATISFIED_REVEAL", description: "view was a wall" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { case_id: $.data.id }
            - call: "POST /opaque/complaint-cases/${case_id}/start-review"
              payload: {}
              as: CustomerService
            - call: "POST /opaque/complaint-cases/${case_id}/resolve"
              payload: { resolution: "GOODWILL_CREDIT", goodwill_credit_cents: 2000 }
              as: CustomerService
          trigger:
            - call: "POST /opaque/bookings/${booking_id}/grant-goodwill"
              payload: {}
              as: CustomerService
          assert:
            - "Booking.${booking_id}.payment_status == PARTIALLY_REFUNDED"
            - "Booking.${booking_id}.fulfillment_status == CONFIRMED (unchanged — dimensions are independent)"
            - "a subsequent SettlementBatch over October still includes this booking (CONFIRMED is settleable)"

      - name: rate_window_exhausted_to_open_cycle_on_slot_release
        grounds:
          - state_machines.RateWindow.OPEN_to_EXHAUSTED
          - state_machines.RateWindow.EXHAUSTED_to_OPEN
          - entities.RateWindow.fields.rooms_sold
        distinguishing_aspect: |
          RateWindow has a CYCLE OPEN → EXHAUSTED → OPEN: selling the last room
          exhausts the window, and a subsequent service-failure refund releases
          the slot and reopens it — the machine is non-linear on the RateWindow
          entity, a different entity than Booking.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; supplier S (commission 0.15, min disc 0.10), property P (star 4, NB5, published 20000, [POOL]), zone NB5."
            - "RateWindow W on P with rooms_allocated 1, rate 15000, covering 2026-10-01..2026-10-05."
            - "Customer C1 with accepted FIXED bid (2 nights, charged 27000 → floor ceil(30000*0.9)=27000) consuming the single slot; W becomes EXHAUSTED."
            - "Complaint on the booking resolved FULL_REFUND with category SERVICE_FAILURE."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /opaque/suppliers"
              payload: { legal_name: "Acme", opaque_commission_pct: 0.15, concealment_discount_min_pct: 0.10 }
              as: PlatformAdmin
              captures: { sup_id: $.data.id }
            - call: "POST /opaque/disclosure-zones"
              payload: { neighborhood_code: "NB5", min_star_rating: 3, revealed_amenity_codes: ["POOL"] }
              as: PlatformAdmin
            - call: "POST /opaque/properties"
              payload: { supplier_id: "${sup_id}", brand_name: "P", star_rating: 4, neighborhood_code: "NB5", amenity_codes: ["POOL"], published_rate_cents: 20000 }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /opaque/rate-windows"
              payload: { property_id: "${prop_id}", check_in_date: "2026-10-01T00:00:00Z", check_out_date: "2026-10-05T00:00:00Z", opaque_rate_cents: 15000, rooms_allocated: 1 }
              as: PlatformAdmin
              captures: { win_id: $.data.id }
            - call: "POST /opaque/customers"
              payload: { email: "c6@x.com", full_name: "Cust Six" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id, cust_v0: $.data.version }
            - call: "POST /opaque/opaque-bids"
              payload: { customer_id: "${cust_id}", neighborhood_code: "NB5", min_star_rating: 4, check_in_date: "2026-10-02T00:00:00Z", check_out_date: "2026-10-04T00:00:00Z", offer_mode: "FIXED" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { bid_id: $.data.id }
            - call: "POST /opaque/opaque-bids/${bid_id}/evaluate"
              payload: { expected_customer_version: "${cust_v0}" }
              as: PlatformAdmin
            - call: "GET /opaque/bookings"
              payload: { customer_id: "${cust_id}" }
              as: PlatformAdmin
              captures: { booking_id: "$.data[0].id" }
            - call: "POST /opaque/complaint-cases"
              payload: { booking_id: "${booking_id}", category: "SERVICE_FAILURE", description: "no reservation on arrival" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { case_id: $.data.id }
            - call: "POST /opaque/complaint-cases/${case_id}/start-review"
              payload: {}
              as: CustomerService
            - call: "POST /opaque/complaint-cases/${case_id}/resolve"
              payload: { resolution: "FULL_REFUND" }
              as: CustomerService
          trigger:
            - call: "POST /opaque/bookings/${booking_id}/mark-service-failure"
              payload: {}
              as: CustomerService
          assert:
            - "before the trigger, RateWindow.${win_id}.status == EXHAUSTED and rooms_sold == 1"
            - "after the trigger, Booking.${booking_id}.payment_status == REFUNDED and fulfillment_status == SERVICE_FAILED"
            - "RateWindow.${win_id}.status == OPEN and rooms_sold == 0 (cycle completed)"

  # ===========================================================================
  # Rule 4 — transitive_cascade: two cascades from DIFFERENT triggers.
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: supplier_suspend_cascades_windows_then_bids
        grounds:
          - state_machines.Supplier.ACTIVE_to_SUSPENDED
          - state_machines.RateWindow.OPEN_to_CLOSED
          - state_machines.OpaqueBid.PENDING_to_REJECTED
        distinguishing_aspect: |
          Depth-3 chain from POST /suppliers/{id}/suspend: Supplier ACTIVE→SUSPENDED
          mutates each OPEN RateWindow to CLOSED, and each window's closure makes a
          PENDING bid's candidate set empty so its next evaluate transitions
          PENDING→REJECTED — link 2 is caused by link 1, link 3 by link 2.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "Supplier S is the ONLY supplier with property P (star 4, NB6, published 20000) and one OPEN window W (rate 15000, rooms 5, Oct 1-5); zone NB6 exists."
            - "Customer C (CLEAR) has a PENDING FIXED bid B on NB6 for 2026-10-02..2026-10-04."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /opaque/suppliers"
              payload: { legal_name: "Acme", opaque_commission_pct: 0.15, concealment_discount_min_pct: 0.10 }
              as: PlatformAdmin
              captures: { sup_id: $.data.id }
            - call: "POST /opaque/disclosure-zones"
              payload: { neighborhood_code: "NB6", min_star_rating: 3, revealed_amenity_codes: ["POOL"] }
              as: PlatformAdmin
            - call: "POST /opaque/properties"
              payload: { supplier_id: "${sup_id}", brand_name: "P", star_rating: 4, neighborhood_code: "NB6", amenity_codes: ["POOL"], published_rate_cents: 20000 }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /opaque/rate-windows"
              payload: { property_id: "${prop_id}", check_in_date: "2026-10-01T00:00:00Z", check_out_date: "2026-10-05T00:00:00Z", opaque_rate_cents: 15000, rooms_allocated: 5 }
              as: PlatformAdmin
              captures: { win_id: $.data.id }
            - call: "POST /opaque/customers"
              payload: { email: "c7@x.com", full_name: "Cust Seven" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id, cust_v0: $.data.version }
            - call: "POST /opaque/opaque-bids"
              payload: { customer_id: "${cust_id}", neighborhood_code: "NB6", min_star_rating: 4, check_in_date: "2026-10-02T00:00:00Z", check_out_date: "2026-10-04T00:00:00Z", offer_mode: "FIXED" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { bid_id: $.data.id }
          trigger:
            - call: "POST /opaque/suppliers/${sup_id}/suspend"
              payload: {}
              as: PlatformAdmin
            - call: "GET /opaque/customers/${cust_id}"
              payload: {}
              as: PlatformAdmin
              captures: { cust_v1: $.data.version }
            - call: "POST /opaque/opaque-bids/${bid_id}/evaluate"
              payload: { expected_customer_version: "${cust_v1}" }
              as: PlatformAdmin
          assert:
            - "Supplier.${sup_id}.status == SUSPENDED"
            - "RateWindow.${win_id}.status == CLOSED (hop 1 → hop 2)"
            - "OpaqueBid.${bid_id}.status == REJECTED because the only candidate's window closed (hop 2 → hop 3)"

      - name: bid_acceptance_cascades_window_exhaustion_then_fraud_flag
        grounds:
          - state_machines.OpaqueBid.PENDING_to_ACCEPTED
          - state_machines.RateWindow.OPEN_to_EXHAUSTED
          - calculations.fraud_score_recompute
        distinguishing_aspect: |
          Depth-2+ chain from POST /opaque-bids/{id}/evaluate: the acceptance
          increments the winning window's rooms_sold which itself transitions the
          window OPEN→EXHAUSTED, and the same acceptance recomputes the customer's
          opaque_win_count_30d which crosses REPEAT_WIN_THRESHOLD and auto-creates
          a FraudFlag — two downstream mutations each caused by the acceptance.
