  - rule_id: transitive_cascade
    instances:

      - name: certificate_suspension_cascades_entry_division_and_race_block
        depth: 4
        grounds:
          - state_machines.RatingCertificate.status.ISSUED_to_SUSPENDED
          - state_machines.Entry.registration_status.ACCEPTED_to_RATING_INVALID
          - state_machines.Division.status.CONFIRMED_to_PROVISIONAL
          - entities.Race.fields.start_blocked_reason
          - endpoints.POST_rating_certificates_id_suspend
        distinguishing_aspect: |
          One measurer action four hops deep, each hop caused strictly by the previous one and none of
          them reachable by any other call in the trigger: hop 1 moves certificate A ISSUED -> SUSPENDED;
          BECAUSE the certificate is no longer valid, hop 2 moves the ACCEPTED entry that pinned it to
          RATING_INVALID; BECAUSE that entry leaves the counts, hop 3 drops the division from
          assigned_entry_count 2 to 1, which is under max(min_entries 2, fleet_minimum 2), so the
          division reverts CONFIRMED -> PROVISIONAL and Regatta.confirmed_division_count falls to 0;
          BECAUSE the division fell under its floor, hop 4 stamps start_blocked_reason
          DIVISION_UNDER_MINIMUM on the PENDING race. The untouched sibling entry is the control: it stays
          ACCEPTED, which shows the cascade followed the certificate pin and not the division membership.
        test_recipe:
          setup:
            - "Five club members: a licensed measurer, a regatta chair, a race officer and two helms with valid safety courses."
            - "Two ISSUED TOD_PHRF certificates: A 171.3 (boat A, version 3 after create and issue) and B 218.8."
            - "A regatta at SI_PUBLISHED with division A (MONOHULL, band 150.0 .. 230.0, min_entries 2) CONFIRMED, both entries ACCEPTED, so assigned_entry_count and accepted_entry_count are both 2 and Regatta.confirmed_division_count is 1."
            - "Race 1 exists at 14:00 with start_status PENDING and start_blocked_reason null, because no division was under its floor when the race was created."
