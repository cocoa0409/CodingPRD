          - errors[ERR_UNIT_NOT_AVAILABLE]
          - state_machines.RelocationUnit.OCCUPIED_to_CLEANING
        distinguishing_aspect: |
          Resource RelocationUnit with buffer interval semantics (distinct from
          the worker half-open rule): after a return at 2026-08-12T10:00:00Z
          the unit is blocked until cleaning_until = 2026-08-13T10:00:00Z; a
