              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /dispatchers/${dA_id}/call-records"
              payload: { call_reference: "C-2001", call_type: "CHEST_PAIN", received_at: "2026-08-05T09:00:00Z", dispatched_determinant_code: "10-C-4" }
              as: ProgramAdmin
