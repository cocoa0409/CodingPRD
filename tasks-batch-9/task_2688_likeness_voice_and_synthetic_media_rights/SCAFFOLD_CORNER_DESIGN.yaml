      - name: revocation_is_permitted_only_on_a_revocable_grant
        claim_type: conditional_action
        grounds: [validations.priority_86, entities.ConsentGrant.revocable]
        distinguishing_aspect: >-
          Two ACTIVE grants for the same talent differ only in the revocable flag, one of them set
          explicitly to false. The same revoke request must be refused on one and honoured on the
          other, and the refusal must not open a removal obligation or disturb the posture.
        test_recipe:
          setup:
