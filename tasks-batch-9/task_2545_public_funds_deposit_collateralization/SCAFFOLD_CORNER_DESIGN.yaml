        excluded_because:
          difficulty_instance: runoff_projection_peak_window_vs_period_end
          rationale: "The forward-looking projection (per-window requirement rounding before max/last selection, and the strictly lower PERIOD_END result on the same windows) is pinned with literals by that §1.8 dual_variant_calc instance."

      - name: variant_divergence_insurance_basis
        claim_type: variant_divergence
        grounds: [calculations.insured_amount_determination, entities.Depository.fields.insurance_determination_basis]
        excluded_because:
          difficulty_instance: insured_amount_aggregated_vs_per_account_basis
          rationale: "Same balances, two insurance_determination_basis variants, and the resulting uninsured/required delta are the subject of that §1.8 dual_variant_calc instance."

      - name: variant_selection_risk_model_basis_per_run
        claim_type: variant_selection
        grounds: [calculations.depository_risk_grade, entities.MarkToMarketRun.fields.basis]
        excluded_because:
          difficulty_instance: risk_grade_supervisory_single_run_vs_internal_trailing_average
          rationale: "Selection of the SUPERVISORY vs INTERNAL scoring variant from MarkToMarketRun.basis, and the smoothing delta it produces on identical current-run inputs, is asserted there."

      - name: reconciliation_on_variant_switch_between_runs
        claim_type: reconciliation
        grounds: [calculations.depository_risk_grade, entities.Depository.fields.risk_grade]
        excluded_because:
          difficulty_instance: risk_grade_supervisory_single_run_vs_internal_trailing_average
          rationale: "The only variant switch in this scaffold is the per-run basis choice, and the delta written to Depository.risk_score_bps when the basis changes between consecutive runs is asserted in that §1.8 instance."

      - name: weighted_scoring_component_weights_and_rounding
        claim_type: weighted_scoring
        grounds: [calculations.depository_risk_grade, entities.MarkToMarketRun.fields.risk_score_bps]
        excluded_because:
          difficulty_instance: risk_grade_supervisory_single_run_vs_internal_trailing_average
          rationale: "Weights 0.50/0.30/0.20, the round-before-weight then single-final-round rule, and the grade thresholds are all exercised by that §1.8 instance."

      - name: constraint_propagation_mtm_evaluation_order
        claim_type: constraint_propagation
        grounds: [calculations.mtm_run_evaluation, "endpoints.POST_/depositories/{id}/mtm-runs"]
        excluded_because:
          difficulty_instance: mtm_deficiency_surcharge_snapshot_evaluation_order
          rationale: "The self-referential requirement/counter loop (snapshot S in step 1, counter written only in step 6) reaching a fixed point without feeding back into its own inputs is the §1.8 combinatorial_formula instance."

      - name: waterfall_pooled_program_priority_and_residual
        claim_type: waterfall_allocation
        grounds: [calculations.pooled_collateral_waterfall, entities.PooledCollateralProgram]
        excluded_because:
          difficulty_instance: pooled_program_value_conservation_across_waterfall
          rationale: "Pool priority ranks, first-bucket-fills-before-second, the unallocated residual and the conservation identity are asserted by that §1.8 compensating_invariant instance."

      - name: threshold_well_capitalized_floor_boundary
        claim_type: threshold
        grounds: [calculations.required_collateral_percentage, entities.Depository.fields.capital_tier]
        excluded_because:
          difficulty_instance: capital_ratio_exactly_at_well_capitalized_floor
          rationale: "The WELL_CAPITALIZED_MIN_BPS 1000 boundary (999 vs 1000 vs 1001) is the §1.8 boundary_precision_check instance; the corner test above deliberately probes the OTHER tier boundary at 800/799 instead."

