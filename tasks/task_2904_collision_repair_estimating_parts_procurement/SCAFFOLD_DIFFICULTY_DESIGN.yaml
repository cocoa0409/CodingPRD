              as_user_id: "est-001"
            - call: "POST /estimate-lines/${el_id}/parts-lines"
              payload: { part_number: "OEM-9901", part_description: "Rocker moulding", part_type: "OEM", list_price_cents: 10000, qty: 1 }
              as: PartsManager
              captures: { pl_id: $.data.id }
