            - "After denial: Organization.${r_id}.status == SUSPENDED"
            - "ServiceOffering.${o_id}.status == PAUSED (suspension cascade)"

  # ===================================================================
  # Exclusion stubs — corners already exercised by §1.8 instances
  # ===================================================================
  - section: errors
    instances:
      - name: error_capacity_exhausted_on_route
        claim_type: violation_to_error
        
          - errors[ERR_CAPACITY_EXHAUSTED]
          - validations[priority=13]
        excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / agreement_inactive_beats_capacity_exhausted_on_route"
          rationale: "Capacity exhaustion is constructed in that instance's setup (capacity_total 1 fully consumed); the priority assertion asserts agreement-inactive wins over the capacity error, proving the capacity condition is detected."

      - name: error_agreement_inactive_on_route
        claim_type: violation_to_error
        
          - errors[ERR_AGREEMENT_INACTIVE]
          - validations[priority=10]
        excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / agreement_inactive_beats_capacity_exhausted_on_route"
          rationale: "That instance's trigger asserts exactly ERR_AGREEMENT_INACTIVE on an expired agreement."

      - name: error_not_aging_on_early_escalate
        claim_type: violation_to_error
        
          - errors[ERR_NOT_AGING]
          - validations[priority=14]
        excluded_because:
          difficulty_instance: "boundary_precision_check / escalate_at_exact_window_rejected_plus_one_hour_accepted"
          rationale: "The first escalate in that instance asserts ERR_NOT_AGING at exactly the window."

      - name: error_consent_revoked_cascade_void
        claim_type: violation_to_error
        
          - errors[ERR_CONSENT_REVOKED]
          - state_machines.Consent.ACTIVE_to_REVOKED
        excluded_because:
          difficulty_instance: "transitive_cascade / agreement_termination_depth3_consent_referral_claim_escrow"
          rationale: "The cascade instance asserts the consent revocation and its downstream claim voiding end-to-end."

      - name: error_escrow_reserve_on_claim_void
        claim_type: violation_to_error
        
          - errors[ERR_ESCROW_EXHAUSTED]
          - calculations.escrow_clawback_settlement
        excluded_because:
          difficulty_instance: "compensating_invariant / escrow_hold_invariant_void_then_settle"
          rationale: "Escrow reserve accounting (debit 5000, reserve 5000, conserved sum 100000) is asserted there; the insufficient-escrow rejection path differs only in arithmetic sign."

      - name: error_invalid_state_double_confirm_outcome
        claim_type: invalid_transition
        
          - state_machines.Referral
          - errors[ERR_INVALID_STATE]
        excluded_because:
          difficulty_instance: "non_linear_state_machine / referral_decline_reassign_cycle_with_counters"
          rationale: "Terminal lockdown of OUTCOME_RECORDED is implied by that instance's full transition chain plus accept_draft_referral_returns_invalid_state covering the same ERR_INVALID_STATE pathway on a sibling transition."

      - name: error_stale_version_on_claim_approve
        claim_type: violation_to_error
        
          - errors[ERR_STALE_VERSION]
          - concurrency_rules[claim-approve-stale-version]
        excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / stale_version_beats_segregation_of_duties_on_claim_approve"
          rationale: "That instance triggers ERR_STALE_VERSION on claim approve with a stale captured version."

      - name: error_org_not_active_on_offering_resume
        claim_type: violation_to_error
        
          - errors[ERR_ORG_NOT_ACTIVE]
          - validations[priority=28]
        excluded_because:
          difficulty_instance: "cross_entity_state_dependency / offering_resume_requires_org_active"
          rationale: "Asserted as the failure path of that cross-entity instance."

      - name: error_claim_not_payable_in_disbursement
        claim_type: violation_to_error
        
          - errors[ERR_CLAIM_NOT_PAYABLE]
          - validations[priority=25]
        excluded_because:
          difficulty_instance: "cross_entity_state_dependency / disbursement_run_requires_claims_approved"
          rationale: "Asserted as the first run's failure in that instance."

      - name: error_eligibility_failed_on_route
        claim_type: violation_to_error
        
          - errors[ERR_ELIGIBILITY_FAILED]
          - validations[priority=12]
        excluded_because:
          difficulty_instance: "combinatorial_formula / eligibility_multi_input_income_boundary"
          rationale: "The income-cap boundary client asserts ERR_ELIGIBILITY_FAILED."

      - name: error_agreement_not_yet_effective
        claim_type: violation_to_error
        
          - errors[ERR_AGREEMENT_NOT_YET_EFFECTIVE]
          - validations[priority=23]
        excluded_because:
          difficulty_instance: "resource_temporal_overlap / agreement_effective_at_half_open_temporal_gate"
          rationale: "The 1-second-future agreement asserts ERR_AGREEMENT_NOT_YET_EFFECTIVE."
