        grounds:
          - calculations.three_way_variance_detection.formula
          - entities.DepositRecord.fields.deposit_due_date
        distinguishing_aspect: "Cash is walked in deposit_date order while obligations are filled in deposit_due_date order and each obligation is capped at its own amount, so creating the later-due deposit first must not change the result: 40000 fills part of the 150000 obligation, the 150000 payment tops it up and spills 40000 into the 100000 obligation, leaving a shortfall of exactly 60000."
