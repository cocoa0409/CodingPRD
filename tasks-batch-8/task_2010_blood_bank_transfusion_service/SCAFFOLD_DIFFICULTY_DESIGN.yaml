  - rule_id: non_linear_state_machine
    instances:
      - name: blood_unit_issue_return_restock_cycle
        grounds:
          - state_machines.BloodUnit.AVAILABLE_to_RESERVED
          - state_machines.BloodUnit.ISSUED_to_AVAILABLE
          - calculations.return_disposition
        distinguishing_aspect: |
          BloodUnit is cyclic: AVAILABLE -> RESERVED -> ISSUED -> AVAILABLE (valid
          30-minute restock) -> RESERVED -> ISSUED again. The same physical unit
          completes the loop twice and its version increments on every hop (7
          mutations total), while the first order's state bubbles BACKWARD
          (PARTIALLY_ISSUED -> AWAITING_CROSSMATCH) on the restock.
        test_recipe:
          setup:
            - "clock 2026-08-10T09:00:00Z; one AVAILABLE RBC O NEG unit U1"
            - "patient typed A POS with ACTIVE T&S (expires 2026-08-13T08:00:00Z)"
            - "order O1 (RBC x1) READY with U1 RESERVED via crossmatch X1; U1 issued (I1) at 09:00"
