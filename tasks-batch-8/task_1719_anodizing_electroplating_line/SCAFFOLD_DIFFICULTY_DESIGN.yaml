  # =========================================================================
  # Rule 4 — transitive_cascade (depth >= 3 and depth >= 2, different triggers)
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: discharge_exceedance_cascade
        grounds:
          - state_machines.DischargePermit.ACTIVE_to_EXCEEDED
          - state_machines.PlatingBath.ACTIVE_to_QUARANTINED
          - state_machines.WorkOrder.ROUTED_to_ROUTE_HELD
          - calculations.waste_mass_accounting
        distinguishing_aspect: |
          Depth-3 cascade from a WasteSample POST: sample exceedance mutates DischargePermit (ACTIVE ->
          EXCEEDED); that permit mutation quarantines every ACTIVE NICKEL bath; each bath quarantine
          pushes its ROUTED work orders to ROUTE_HELD. Trigger (sample recording) differs from the
          load-completion cascade instance.
        test_recipe:
          setup:
            - "Customer C7; rule CRS1018/PLATE/NICKEL COMPATIBLE; NICKEL bath B7 titrated to 5.000 (tv 20, n 0.1, sv 11.74 with EQ 29.35)"
            - "WO7 BARREL 25 dm2 routed to B7 (25 Ah planned)"
            - "Permit P7 on OUTFALL-NI, window [2026-08-01, 2026-08-31], NICKEL limit 2.0 mg/L, cap 500.0 g"
          setup_api_calls:
            - { call: "POST /customers", payload: { company_name: "Eta Stampings" }, as: ShopManager, captures: { c7: $.data.id } }
            - { call: "POST /alloy-compatibility-rules", payload: { alloy_code: "CRS1018", process_type: "PLATE", chemistry_family: "NICKEL", compatibility: "COMPATIBLE" }, as: LabChemist }
            - { call: "POST /baths", payload: { bath_code: "PLT-7", process_type: "PLATE", chemistry_family: "NICKEL", routing_modes_supported: ["BARREL"], volume_liters: 800, target_concentration_g_l: 5.0, low_concentration_g_l: 4.0, high_concentration_g_l: 6.0, amp_hour_capacity: 600 }, as: ShopManager, captures: { b7: $.data.id } }
            - { call: "POST /baths/${b7}/titrations", payload: { titrant_volume_ml: 20.0, titrant_normality: 0.1, sample_volume_ml: 11.74 }, as: LabChemist }
            - { call: "POST /work-orders", payload: { customer_id: "${c7}", part_number: "PN-700", alloy_code: "CRS1018", process_type: "PLATE", routing_mode: "BARREL", part_count: 10, surface_area_dm2_per_part: 2.5, thickness_spec_min_um: 12.0, thickness_spec_max_um: 18.0 }, as: Customer, as_user_id: "${c7}", captures: { wo7: $.data.id } }
            - { call: "POST /work-orders/${wo7}/prepare", payload: {}, as: LineOperator }
            - { call: "POST /work-orders/${wo7}/route", payload: { bath_id: "${b7}", planned_duration_minutes: 40, planned_current_density_a_dm2: 1.5 }, as: LineOperator, captures: { wo7_pre: $.data.status } }
            - { call: "POST /discharge-permits", payload: { outfall_code: "OUTFALL-NI", effective_from: "2026-08-01", effective_to: "2026-08-31", limits: [{ analyte_code: "NICKEL", max_concentration_mg_l: 2.0, monthly_mass_cap_g: 500.0 }] }, as: EHSOfficer, captures: { p7: $.data.id } }
          trigger:
            - { call: "POST /discharge-permits/${p7}/samples", payload: { flow_liters: 5000, readings: [{ analyte_code: "NICKEL", concentration_mg_l: 2.5 }] }, as: EHSOfficer, captures: { s_exc: $.data.is_exceedance } }
            - { call: "GET /discharge-permits/${p7}", as: EHSOfficer, captures: { p7_status: $.data.status } }
            - { call: "GET /baths/${b7}", as: LabChemist, captures: { b7_status: $.data.status, b7_cause: $.data.quarantine_cause } }
            - { call: "GET /work-orders/${wo7}", as: LineOperator, captures: { wo7_status: $.data.status } }
            - { call: "POST /baths/${b7}/release-quarantine", as: EHSOfficer, captures: { rel_err: $.data.error_id } }
            - { call: "POST /discharge-permits/${p7}/clear-exceedance", as: EHSOfficer }
            - { call: "POST /baths/${b7}/release-quarantine", as: EHSOfficer, captures: { b7_rel: $.data.status } }
            - { call: "GET /work-orders/${wo7}", as: LineOperator, captures: { wo7_final: $.data.status } }
          assert:
            - "sample is_exceedance == true (2.5 > 2.0 instantaneous, strict)"
            - "hop 1: permit P7 status == EXCEEDED"
            - "hop 2: bath B7 status == QUARANTINED with quarantine_cause == DISCHARGE_EXCEEDANCE"
            - "hop 3: work order WO7 status == ROUTE_HELD (was ROUTED before the sample)"
            - "release while permit EXCEEDED rejected: error_id == ERR_DISCHARGE_EXCEEDANCE_HOLD"
            - "after clear-exceedance + release: bath ACTIVE and WO7 back to ROUTED"

      - name: load_completion_exhaustion_cascade
        grounds:
          - state_machines.LoadRun.RUNNING_to_COMPLETED
          - state_machines.PlatingBath.ACTIVE_to_EXHAUSTED
          - state_machines.WorkOrder.ROUTED_to_ROUTE_HELD
          - calculations.amp_hour_consumption
        distinguishing_aspect: |
          Depth-2+ cascade from POST /load-runs/{id}/complete (a different trigger than the sample
          cascade): completion mutates the bath (reservation -> used, dragout); crossing amp_hour_used
          >= capacity auto-transitions the bath to EXHAUSTED; that bath mutation cascades a waiting
          ROUTED work order to ROUTE_HELD. Exact-boundary crossing (used == capacity) is the trigger.
