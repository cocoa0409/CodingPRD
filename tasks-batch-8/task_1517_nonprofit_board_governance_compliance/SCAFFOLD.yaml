scenario: 'Nonprofit Board Governance & Compliance (501(c)(3) board of directors): board recruitment matrix & term limits, conflict of interest
  disclosure & annual review, meeting/minutes & committee structure, bylaws amendment & policy adoption, executive evaluation & succession planning,
  Form 990 review & public disclosure obligation, state charitable registration & renewal by jurisdiction, insurance (D&O) & risk oversight

  '
domain_name: nonprofit-board-governance
api_prefix: /boardgov
complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: multi_party_negotiation
  complexity_layers:
  - optimistic_concurrency
  - cascading_side_effects
  - dual_variant_calculation
  - scheduled_actions
  - rate_threshold_triggers
  - derived_field_reconciliation
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
  - one_to_many
  - many_to_many
  - self_referential
  - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate
entities:
- name: Nonprofit
  parent: null
  common_fields: true
  fields:
  - name: name
    type: string
    source: input
    description: Legal name of the 501(c)(3)
  - name: ein
    type: string
    source: input
    description: Employer Identification Number; unique across all nonprofits
    constraints: globally unique -> ERR_DUPLICATE_EIN
  - name: state_of_incorporation
    type: string
    source: input
    description: 2-letter state code of incorporation
  - name: fiscal_year_end_month
    type: integer
    source: input
    description: Month (1-12) on which the fiscal year ends
  - name: annual_gross_receipts_cents
    type: integer
    source: input
    description: Most recently reported annual gross receipts; drives registration fee estimate variant and D&O coverage floor
  - name: current_fiscal_year
    type: integer
    source: computed
    description: Fiscal year label = calendar year of the fiscal year end that contains the logical clock date; FY runs from (end_month+1)/1 of
      prior year through end_month/end-day of label year
  - name: compliance_posture
    type: enum
    source: computed
    description: COMPLIANT | AT_RISK | NON_COMPLIANT; derived per calculation compliance_posture from registrations, 990 filings, D&O coverage,
      and COI delinquency
  - name: adopted_policies
    type: array
    source: system
    description: Register of { policy_title, motion_id, adopted_at } appended when a POLICY motion passes
- name: Bylaws
  parent: null
  common_fields: true
  fields:
  - name: nonprofit_id
    type: string
    source: input
    description: FK -> Nonprofit.id
  - name: version_no
    type: integer
    source: system
    description: 1 for founding bylaws; increments by 1 for each amendment-adoption successor
  - name: quorum_pct
    type: integer
    source: input
    description: Quorum percentage 1-100 applied to the quorum basis
    constraints: 1..100
  - name: quorum_basis
    type: enum
    source: input
    description: SEATED (count of ACTIVE members at call time) | AUTHORIZED (board_size seats) — selects quorum_attainment variant
  - name: amendment_threshold_pct
    type: integer
    source: input
    description: Percentage of the amendment basis required to adopt bylaws amendments
    constraints: 51..100
  - name: term_length_years
    type: integer
    source: input
    description: Length of one elected board term in years
    constraints: 1..6
  - name: max_consecutive_terms
    type: integer
    source: input
    description: Maximum length of an unbroken consecutive-term chain before mandatory cool-off
    constraints: '>=1'
  - name: term_cooloff_years
    type: integer
    source: input
    description: Years a termed-out member must wait before re-eligibility
    constraints: '>=0'
  - name: board_size
    type: integer
    source: input
    description: Authorized number of board seats (used by AUTHORIZED quorum basis and open_seats invariant)
    constraints: '>=3'
  - name: status
    type: enum
    source: system
    description: DRAFT | ADOPTED | SUPERSEDED | DISCARDED
  - name: adopted_at
    type: datetime
    source: system
    description: Logical timestamp when adopted; null while DRAFT
- name: BylawsAmendment
  parent: null
  common_fields: true
  fields:
  - name: nonprofit_id
    type: string
    source: input
    description: FK -> Nonprofit.id
  - name: base_bylaws_id
    type: string
    source: input
    description: FK -> Bylaws.id; the ADOPTED bylaws version this amendment modifies
  - name: title
    type: string
    source: input
    description: Short amendment title
  - name: proposed_fields
    type: object
    source: input
    description: Subset of Bylaws fields to change (quorum_pct, quorum_basis, amendment_threshold_pct, term_length_years, max_consecutive_terms,
      term_cooloff_years, board_size); must be non-empty
  - name: motion_id
    type: string
    source: system
    description: FK -> Motion.id; the BYLAWS-category motion deciding this amendment; null until a motion references it
  - name: status
    type: enum
    source: system
    description: DRAFT | PROPOSED | ADOPTED | DEFEATED | WITHDRAWN
- name: BoardMember
  parent: null
  common_fields: true
  fields:
  - name: nonprofit_id
    type: string
    source: input
    description: FK -> Nonprofit.id
  - name: full_name
    type: string
    source: input
    description: Director full name
  - name: email
    type: string
    source: input
    description: Director email; unique per nonprofit -> ERR_DUPLICATE_MEMBER_EMAIL
  - name: skill_tags
    type: array
    source: input
    description: 'Recruitment matrix skills: subset of FINANCE, LEGAL, FUNDRAISING, PROGRAM, GOVERNANCE, MARKETING, TECHNOLOGY, HR'
  - name: officer_role
    type: enum
    source: input
    default: NONE
    description: NONE | CHAIR | TREASURER | SECRETARY — gates entity-backed role qualification
  - name: is_independent
    type: boolean
    source: input
    default: true
    description: Not employed by / financially entangled with the nonprofit; required for AUDIT committee service
  - name: status
    type: enum
    source: system
    description: PROPOSED | ACTIVE | PAST | TERM_LIMITED_OUT | RESIGNED | REMOVED
  - name: consecutive_terms_served
    type: integer
    source: computed
    description: Length of the current unbroken chain of adjacency-linked BoardTerms (see term_limit_eligibility)
  - name: has_active_restrictions
    type: boolean
    source: computed
    description: True while the member's current-fiscal-year COIDisclosure is RESTRICTIONS_IMPOSED
- name: BoardTerm
  parent: null
  common_fields: true
  fields:
  - name: nonprofit_id
    type: string
    source: input
    description: FK -> Nonprofit.id
  - name: board_member_id
    type: string
    source: input
    description: FK -> BoardMember.id
  - name: bylaws_id
    type: string
    source: system
    description: FK -> Bylaws.id; version-pinned at election to the bylaws ADOPTED at creation time — later amendments never mutate this term's
      end_date
  - name: start_date
    type: datetime
    source: input
    description: Term start (UTC)
  - name: end_date
    type: datetime
    source: computed
    description: = start_date + bylaws_id.term_length_years years (same calendar day)
  - name: chain_index
    type: integer
    source: computed
    description: 1-based position of this term within the member's current unbroken consecutive chain (gap == 0 links terms)
  - name: status
    type: enum
    source: system
    description: SCHEDULED | ACTIVE | COMPLETED | VACATED
- name: Committee
  parent: null
  common_fields: true
  fields:
  - name: nonprofit_id
    type: string
    source: input
    description: FK -> Nonprofit.id
  - name: name
    type: string
    source: input
    description: Committee name; unique per nonprofit among non-DISSOLVED committees -> ERR_DUPLICATE_COMMITTEE_NAME
  - name: type
    type: enum
    source: input
    description: AUDIT | FINANCE | GOVERNANCE | NOMINATING | EXECUTIVE | COMPENSATION | OTHER
  - name: min_members
    type: integer
    source: input
    description: Minimum ACTIVE appointments required to hold ACTIVE status
    constraints: '>=1'
  - name: authorized_size
    type: integer
    source: input
    description: Authorized seats; used as quorum base for committee meetings under AUTHORIZED basis
    constraints: '>= min_members'
  - name: requires_all_independent
    type: boolean
    source: input
    default: false
    description: All appointees must have is_independent=true; forced true when type=AUDIT
  - name: active_member_count
    type: integer
    source: computed
    description: Count of CommitteeAppointments with status ACTIVE for this committee
  - name: status
    type: enum
    source: system
    description: CHARTERED | ACTIVE | DORMANT | DISSOLVED
- name: CommitteeAppointment
  parent: null
  common_fields: true
  fields:
  - name: nonprofit_id
    type: string
    source: input
    description: FK -> Nonprofit.id (denormalized for filtered listing)
  - name: committee_id
    type: string
    source: input
    description: FK -> Committee.id
  - name: board_member_id
    type: string
    source: input
    description: FK -> BoardMember.id
  - name: committee_role
    type: enum
    source: input
    default: MEMBER
    description: CHAIR | MEMBER; at most one ACTIVE CHAIR per committee -> ERR_DUPLICATE_COMMITTEE_CHAIR
  - name: status
    type: enum
    source: system
    description: ACTIVE | ENDED
  - name: ended_reason
    type: enum
    source: system
    description: Null while ACTIVE; MANUAL | RESIGNED | REMOVED | COI_RESTRICTION | COMMITTEE_DISSOLVED when ENDED
- name: Meeting
  parent: null
  common_fields: true
  fields:
  - name: nonprofit_id
    type: string
    source: input
    description: FK -> Nonprofit.id
  - name: committee_id
    type: string
    source: input
    description: FK -> Committee.id; null/absent = full-board meeting
    default: null
  - name: scheduled_start
    type: datetime
    source: input
    description: Scheduled start (UTC); defines the occupancy interval [scheduled_start, scheduled_start + duration_minutes)
  - name: duration_minutes
    type: integer
    source: input
    description: Meeting length
    constraints: '>0'
  - name: notice_sent_at
    type: datetime
    source: input
    description: When notice was sent; must be <= scheduled_start - 7 days unless notice_waived
    default: null
  - name: notice_waived
    type: boolean
    source: input
    default: false
    description: All-members notice waiver; bypasses the 7-day notice rule
  - name: status
    type: enum
    source: system
    description: SCHEDULED | IN_SESSION | ADJOURNED | MINUTES_DRAFTED | MINUTES_APPROVED | CANCELLED
  - name: attendance
    type: array
    source: system
    description: BoardMember ids marked present at call_to_order
  - name: quorum_base
    type: integer
    source: computed
    description: 'Denominator used at call_to_order per bylaws.quorum_basis (SEATED: ACTIVE scope members; AUTHORIZED: board_size or committee
      authorized_size)'
  - name: quorum_required
    type: integer
    source: computed
    description: ceil(quorum_pct/100 * quorum_base) computed at call_to_order
  - name: quorum_met
    type: boolean
    source: computed
    description: true iff distinct eligible attendees >= quorum_required
  - name: minutes_text
    type: string
    source: system
    description: Draft/final minutes body recorded via POST .../minutes
  - name: minutes_recorded_by
    type: string
    source: system
    description: 'X-User-ID that most recently recorded minutes (SoD: cannot approve own minutes)'
- name: Motion
  parent: null
  common_fields: true
  fields:
  - name: nonprofit_id
    type: string
    source: input
    description: FK -> Nonprofit.id
  - name: meeting_id
    type: string
    source: input
    description: FK -> Meeting.id
  - name: bylaws_amendment_id
    type: string
    source: input
    description: FK -> BylawsAmendment.id; required when category=BYLAWS
    default: null
  - name: policy_title
    type: string
    source: input
    description: Required when category=POLICY; appended to Nonprofit.adopted_policies on passage
    default: null
  - name: title
    type: string
    source: input
    description: Motion title
  - name: category
    type: enum
    source: input
    description: GOVERNANCE | FINANCE | PERSONNEL | POLICY | BYLAWS | FUNDRAISING | OTHER
  - name: threshold
    type: enum
    source: input
    default: SIMPLE_MAJORITY
    description: SIMPLE_MAJORITY | TWO_THIRDS | UNANIMOUS; ignored when category=BYLAWS (amendment_adoption_threshold governs)
  - name: threshold_basis
    type: enum
    source: input
    default: PRESENT_AND_VOTING
    description: PRESENT_AND_VOTING | FULL_QUORUM | FULL_BOARD; ignored when category=BYLAWS
  - name: votes_for
    type: integer
    source: computed
    description: Count of Vote rows with choice=AYE
  - name: votes_against
    type: integer
    source: computed
    description: Count of Vote rows with choice=NAY
  - name: votes_abstain
    type: integer
    source: computed
    description: Count of Vote rows with choice=ABSTAIN
  - name: votes_recused
    type: integer
    source: computed
    description: Count of Vote rows with choice=RECUSED
  - name: required_votes
    type: integer
    source: computed
    description: AYE votes needed to pass; null until close_voting, then fixed per motion_outcome calculation
  - name: status
    type: enum
    source: system
    description: INTRODUCED | VOTING_OPEN | TABLED | PASSED | FAILED | WITHDRAWN
- name: Vote
  parent: null
  common_fields: false
  fields:
  - name: nonprofit_id
    type: string
    source: input
    description: FK -> Nonprofit.id (denormalized for filtered listing)
  - name: motion_id
    type: string
    source: input
    description: FK -> Motion.id
  - name: board_member_id
    type: string
    source: input
    description: FK -> BoardMember.id; must equal the caller's X-User-ID (directors vote as themselves)
  - name: choice
    type: enum
    source: input
    description: AYE | NAY | ABSTAIN | RECUSED
- name: COIDisclosure
  parent: null
  common_fields: true
  fields:
  - name: nonprofit_id
    type: string
    source: input
    description: FK -> Nonprofit.id
  - name: board_member_id
    type: string
    source: input
    description: FK -> BoardMember.id; the disclosing member; must equal caller's X-User-ID (members disclose for themselves)
  - name: fiscal_year
    type: integer
    source: input
    description: Fiscal year the disclosure covers; at most one disclosure per (board_member_id, fiscal_year) -> ERR_DUPLICATE_DISCLOSURE
  - name: answers
    type: array
    source: input
    description: 'List of { question_key, answer: boolean, detail?: string }'
  - name: has_conflict
    type: boolean
    source: computed
    description: true iff any answer.answer == true
  - name: status
    type: enum
    source: system
    description: FILED | UNDER_REVIEW | CLEARED | RESTRICTIONS_IMPOSED
  - name: reviewer_member_id
    type: string
    source: system
    description: FK -> BoardMember.id; assigned at start_review (the caller); must differ from board_member_id (segregation of duties)
  - name: restriction_categories
    type: array
    source: system
    description: Motion categories the member is barred from voting non-RECUSED on while RESTRICTIONS_IMPOSED; set at impose_restrictions
  - name: filed_at
    type: datetime
    source: system
    description: Logical timestamp of filing
- name: ExecutiveEvaluation
  parent: null
  common_fields: true
  fields:
  - name: nonprofit_id
    type: string
    source: input
    description: FK -> Nonprofit.id
  - name: fiscal_year
    type: integer
    source: input
    description: Fiscal year evaluated; at most one evaluation per (nonprofit_id, fiscal_year) -> ERR_DUPLICATE_EVALUATION
  - name: executive_name
    type: string
    source: input
    description: Name of the evaluated executive director
  - name: scores
    type: array
    source: system
    description: 'List of { dimension, score } set via PATCH .../scores; dimensions: LEADERSHIP, FUNDRAISING, FINANCIAL, PROGRAM, GOVERNANCE;
      score integer 1..5'
  - name: provisional_composite
    type: number
    source: computed
    description: Unweighted mean of scores (2 dp round_half_up); maintained while DRAFT/COMMITTEE_REVIEW
  - name: final_composite
    type: number
    source: computed
    description: Weighted composite per evaluation_composite WEIGHTED variant; computed at ratify; null until RATIFIED
  - name: rating
    type: enum
    source: computed
    description: EXCEEDS | MEETS | NEEDS_IMPROVEMENT | UNSATISFACTORY from final_composite bands; null until RATIFIED
  - name: recorded_by_user_id
    type: string
    source: system
    description: X-User-ID of the first scores recorder; later score edits must come from the same user -> ERR_EVALUATION_RECORDER_MISMATCH
  - name: ratified_by_user_id
    type: string
    source: system
    description: X-User-ID of ratifier; must differ from recorded_by_user_id -> ERR_SEGREGATION_OF_DUTIES
  - name: status
    type: enum
    source: system
    description: DRAFT | COMMITTEE_REVIEW | RATIFIED | DELIVERED
- name: SuccessionPlan
  parent: null
  common_fields: true
  fields:
  - name: nonprofit_id
    type: string
    source: input
    description: FK -> Nonprofit.id
  - name: target_role
    type: enum
    source: input
    description: EXECUTIVE_DIRECTOR | BOARD_CHAIR | TREASURER; at most one APPROVED or ACTIVATED plan per (nonprofit_id, target_role) — approving
      a successor supersedes the prior APPROVED plan
  - name: readiness
    type: enum
    source: input
    description: READY_NOW | ONE_YEAR | TWO_PLUS_YEARS
  - name: interim_designee_member_id
    type: string
    source: input
    description: FK -> BoardMember.id; interim officeholder; required at approve time for BOARD_CHAIR and TREASURER targets
    default: null
  - name: interim_designee_name
    type: string
    source: input
    description: Free-text interim designee for EXECUTIVE_DIRECTOR target (non-board staff allowed); required at approve time for EXECUTIVE_DIRECTOR
    default: null
  - name: status
    type: enum
    source: system
    description: DRAFT | APPROVED | ACTIVATED | SUPERSEDED | DISCARDED
- name: Form990Filing
  parent: null
  common_fields: true
  fields:
  - name: nonprofit_id
    type: string
    source: input
    description: FK -> Nonprofit.id
  - name: fiscal_year
    type: integer
    source: input
    description: Fiscal year filed; at most one root filing per (nonprofit_id, fiscal_year) — amendments carry supersedes_filing_id and are exempt
      -> ERR_DUPLICATE_FILING
  - name: supersedes_filing_id
    type: string
    source: input
    description: FK -> Form990Filing.id; set for amendment filings; target must be FILED or PUBLIC_DISCLOSED
    default: null
  - name: total_revenue_cents
    type: integer
    source: input
    description: Part I total revenue
  - name: total_expenses_cents
    type: integer
    source: input
    description: Part I total expenses
  - name: contributions_cents
    type: integer
    source: input
    description: Contributions and grants (line 8)
  - name: program_service_revenue_cents
    type: integer
    source: input
    description: Program service revenue (line 9)
  - name: net_change_cents
    type: integer
    source: computed
    description: = total_revenue_cents - total_expenses_cents
  - name: public_support_ratio
    type: number
    source: computed
    description: = contributions_cents / total_revenue_cents (4 dp round_half_up); defined as 0 when total_revenue_cents == 0
  - name: preparer_user_id
    type: string
    source: input
    description: X-User-ID of preparer; the approver must differ -> ERR_SEGREGATION_OF_DUTIES
  - name: approved_by_user_id
    type: string
    source: system
    description: X-User-ID of the approver; null until APPROVED
  - name: reviewed_by_member_ids
    type: array
    source: system
    description: Distinct ACTIVE board members who recorded review; one per member -> ERR_DUPLICATE_REVIEW
  - name: review_required_count
    type: integer
    source: computed
    description: = ceil(current bylaws quorum_pct/100 * ACTIVE member count) — SEATED basis regardless of bylaws.quorum_basis
  - name: filing_due_date
    type: datetime
    source: computed
    description: = first day of month after fiscal-year end + 4 months + 14 days (e.g., Dec FYE -> May 15)
  - name: filed_on
    type: datetime
    source: system
    description: Logical timestamp of mark_filed; null until FILED
  - name: filed_late
    type: boolean
    source: computed
    description: filed_on > filing_due_date (strictly later = late)
  - name: public_disclosure_posted_at
    type: datetime
    source: system
    description: Logical timestamp of post_public_disclosure; null until posted
  - name: disclosure_overdue
    type: boolean
    source: computed
    description: true while status==FILED and logical clock > filed_on + 30 days
  - name: status
    type: enum
    source: system
    description: DRAFT | IN_BOARD_REVIEW | APPROVED | FILED | PUBLIC_DISCLOSED | SUPERSEDED | DISCARDED
- name: StateRegistration
  parent: null
  common_fields: true
  fields:
  - name: nonprofit_id
    type: string
    source: input
    description: FK -> Nonprofit.id
  - name: state_code
    type: string
    source: input
    description: 2-letter jurisdiction code; unique per nonprofit -> ERR_DUPLICATE_REGISTRATION
  - name: renewal_cycle_months
    type: integer
    source: input
    default: 12
    description: Months between renewals for this jurisdiction
  - name: current_period_end
    type: datetime
    source: input
    description: Expiry instant of the current registration period
  - name: contributions_in_state_cents
    type: integer
    source: input
    description: Most recent actual in-state contributions; null forces the ESTIMATED fee variant
    default: null
  - name: renewal_fee_cents
    type: integer
    source: computed
    description: Fee computed at submit_renewal per registration_renewal_fee; null until submitted
  - name: status
    type: enum
    source: system
    description: REGISTERED | RENEWAL_DUE | RENEWAL_SUBMITTED | LAPSED
- name: InsurancePolicy
  parent: null
  common_fields: true
  fields:
  - name: nonprofit_id
    type: string
    source: input
    description: FK -> Nonprofit.id
  - name: prior_policy_id
    type: string
    source: input
    description: FK -> InsurancePolicy.id; links a renewal to the policy it replaces
    default: null
  - name: policy_type
    type: enum
    source: input
    description: DNO | GENERAL_LIABILITY
  - name: carrier
    type: string
    source: input
    description: Carrier name
  - name: coverage_limit_cents
    type: integer
    source: input
    description: Policy limit; at bind must be >= ceil(0.25 * nonprofit.annual_gross_receipts_cents) -> ERR_COVERAGE_BELOW_FLOOR
  - name: premium_cents
    type: integer
    source: input
    description: Annual premium
  - name: policy_start_date
    type: datetime
    source: input
    description: Coverage start; occupancy interval [policy_start_date, policy_end_date)
  - name: policy_end_date
    type: datetime
    source: input
    description: Coverage end (exclusive)
  - name: acknowledge_gap
    type: boolean
    source: input
    default: false
    description: Binder acknowledgement required when gap_days > 0 vs prior policy -> ERR_COVERAGE_GAP
  - name: gap_days
    type: integer
    source: computed
    description: Days between prior policy end and this start (0 when continuous or no prior); negative never allowed (overlap rejected)
  - name: status
    type: enum
    source: system
    description: QUOTED | BOUND | ACTIVE | EXPIRED | CANCELLED
state_machines:
- entity: Bylaws
  initial_state: DRAFT
  terminal_states:
  - SUPERSEDED
  - DISCARDED
  transitions:
  - from: DRAFT
    to: ADOPTED
    trigger: POST /boardgov/bylaws/{id}/adopt
    actor: GovernanceAdmin
    preconditions:
    - Bylaws.status == DRAFT (ERR_INVALID_STATE)
    - No other Bylaws with status ADOPTED exists for this nonprofit (ERR_BYLAWS_ALREADY_ADOPTED)
    side_effects:
    - status -> ADOPTED; adopted_at = logical clock
  - from: ADOPTED
    to: SUPERSEDED
    trigger: system (a BylawsAmendment with base_bylaws_id == this bylaws reaches ADOPTED)
    actor: system
    preconditions: []
    side_effects:
    - status -> SUPERSEDED
  - from: DRAFT
    to: DISCARDED
    trigger: POST /boardgov/bylaws/{id}/discard
    actor: GovernanceAdmin
    preconditions: []
    side_effects: []
- entity: BylawsAmendment
  initial_state: DRAFT
  terminal_states:
  - ADOPTED
  - WITHDRAWN
  transitions:
  - from: DRAFT
    to: PROPOSED
    trigger: POST /boardgov/bylaws-amendments/{id}/propose
    actor: BoardChair
    preconditions:
    - Amendment.status == DRAFT (ERR_INVALID_STATE)
    - base_bylaws_id bylaws status == ADOPTED (ERR_BYLAWS_NOT_ADOPTED)
    - proposed_fields non-empty (ERR_INVALID_REQUEST)
    side_effects: []
  - from: PROPOSED
    to: ADOPTED
    trigger: system (the Motion referenced by motion_id is closed as PASSED)
    actor: system
    preconditions:
    - Motion.category == BYLAWS AND Motion.bylaws_amendment_id == this amendment
    side_effects:
    - 'Create successor Bylaws: version_no = base.version_no + 1, fields = base fields overlaid with proposed_fields, status = ADOPTED, adopted_at
      = logical clock'
    - base Bylaws.status -> SUPERSEDED (link 2)
    - Because base bylaws were superseded, recompute every BoardMember.consecutive_terms_served unchanged but re-evaluate future-election eligibility
      inputs (term_length_years / max_consecutive_terms / board_size read the NEW bylaws from now on) and bump Nonprofit.version by 1 (link 3)
  - from: PROPOSED
    to: DEFEATED
    trigger: system (the Motion referenced by motion_id is closed as FAILED)
    actor: system
    preconditions: []
    side_effects:
    - Clear motion_id (amendment may be revised and re-voted)
  - from: DEFEATED
    to: DRAFT
    trigger: POST /boardgov/bylaws-amendments/{id}/revise
    actor: BoardChair
    preconditions: []
    side_effects: []
  - from: DRAFT
    to: WITHDRAWN
    trigger: POST /boardgov/bylaws-amendments/{id}/withdraw
    actor: BoardChair
    preconditions: []
    side_effects: []
  - from: PROPOSED
    to: WITHDRAWN
    trigger: POST /boardgov/bylaws-amendments/{id}/withdraw
    actor: BoardChair
    preconditions:
    - No non-terminal Motion (INTRODUCED | VOTING_OPEN | TABLED) references this amendment (ERR_AMENDMENT_HAS_OPEN_MOTION)
    side_effects: []
  note: DEFEATED -> DRAFT revision loop is the cyclic edge; adoption/supersede cascade is Rule-4 chain A.
- entity: BoardMember
  initial_state: PROPOSED
  terminal_states:
  - RESIGNED
  - REMOVED
  transitions:
  - from: PROPOSED
    to: ACTIVE
    trigger: system (a BoardTerm is created for this member)
    actor: system
    preconditions: []
    side_effects:
    - status -> ACTIVE
  - from: PAST
    to: ACTIVE
    trigger: system (a BoardTerm is created for this member — re-election of a former member)
    actor: system
    preconditions: []
    side_effects:
    - status -> ACTIVE
  - from: TERM_LIMITED_OUT
    to: ACTIVE
    trigger: system (a BoardTerm is created for this member — re-election after cool-off; term_limit_eligibility must have passed)
    actor: system
    preconditions: []
    side_effects:
    - status -> ACTIVE; consecutive_terms_served restarts via new chain_index = 1 term
  - from: ACTIVE
    to: PAST
    trigger: 'system (compliance_sweep: member''s latest term COMPLETED and member still eligible for re-election — chain length < max_consecutive_terms)'
    actor: system
    preconditions: []
    side_effects:
    - status -> PAST; Nonprofit open-seat pool recomputed (seat frees)
  - from: ACTIVE
    to: TERM_LIMITED_OUT
    trigger: 'system (compliance_sweep: member''s latest term COMPLETED and consecutive chain length == current bylaws.max_consecutive_terms)'
    actor: system
    preconditions: []
    side_effects:
    - status -> TERM_LIMITED_OUT; Nonprofit open-seat pool recomputed
  - from: ACTIVE
    to: RESIGNED
    trigger: POST /boardgov/board-members/{id}/resign
    actor: GovernanceAdmin | BoardChair | the member themself (BoardDirector/BoardChair/Treasurer with X-User-ID == member id)
    preconditions:
    - Member.status == ACTIVE (ERR_INVALID_STATE)
    side_effects:
    - Member's SCHEDULED/ACTIVE BoardTerm -> VACATED (link 1a)
    - Member's ACTIVE CommitteeAppointments -> ENDED with ended_reason=RESIGNED (link 1b)
    - Because appointments ENDED, each affected Committee.active_member_count recomputes; any ACTIVE committee whose count falls below min_members
      -> DORMANT (link 2)
    - Because a committee went DORMANT, its SCHEDULED meetings -> CANCELLED (link 3)
    - Nonprofit open-seat pool recomputed (seat frees)
  - from: ACTIVE
    to: REMOVED
    trigger: POST /boardgov/board-members/{id}/remove
    actor: BoardChair
    preconditions:
    - Member.status == ACTIVE (ERR_INVALID_STATE)
    - reason must be non-empty (ERR_INVALID_REQUEST)
    side_effects:
    - 'Same cascade as resign: term VACATED (link 1a), appointments ENDED with ended_reason=REMOVED (link 1b), committees possibly DORMANT (link
      2), their SCHEDULED meetings CANCELLED (link 3), seat frees'
  note: PROPOSED->ACTIVE->TERM_LIMITED_OUT->ACTIVE is the re-election cycle (Rule 3).
- entity: BoardTerm
  initial_state: SCHEDULED
  terminal_states:
  - COMPLETED
  - VACATED
  transitions:
  - from: SCHEDULED
    to: ACTIVE
    trigger: 'system (compliance_sweep: logical clock >= start_date and < end_date)'
    actor: system
    preconditions: []
    side_effects: []
  - from: ACTIVE
    to: COMPLETED
    trigger: 'system (compliance_sweep: logical clock >= end_date)'
    actor: system
    preconditions: []
    side_effects:
    - 'Member transition evaluated: -> PAST or TERM_LIMITED_OUT per BoardMember machine'
  - from: ACTIVE
    to: VACATED
    trigger: system (member RESIGNED or REMOVED cascade)
    actor: system
    preconditions: []
    side_effects: []
  - from: SCHEDULED
    to: VACATED
    trigger: system (member RESIGNED or REMOVED cascade before the term began)
    actor: system
    preconditions: []
    side_effects: []
- entity: Committee
  initial_state: CHARTERED
  terminal_states:
  - DISSOLVED
  transitions:
  - from: CHARTERED
    to: ACTIVE
    trigger: POST /boardgov/committees/{id}/activate
    actor: BoardChair
    preconditions:
    - Committee.status == CHARTERED (ERR_INVALID_STATE)
    - active_member_count >= min_members (ERR_COMMITTEE_BELOW_MIN)
    - 'If requires_all_independent: every ACTIVE appointee is_independent == true (ERR_COMMITTEE_NOT_INDEPENDENT)'
    - Every ACTIVE appointee has a current-fiscal-year COIDisclosure in CLEARED or RESTRICTIONS_IMPOSED (ERR_COI_REVIEW_REQUIRED)
    side_effects:
    - status -> ACTIVE
  - from: ACTIVE
    to: DORMANT
    trigger: system (an appointment ENDED and active_member_count fell below min_members)
    actor: system
    preconditions: []
    side_effects:
    - Committee's SCHEDULED meetings -> CANCELLED (cascade link 3 of resignation/removal/COI chains)
  - from: DORMANT
    to: ACTIVE
    trigger: system (a new ACTIVE appointment restores active_member_count >= min_members)
    actor: system
    preconditions:
    - The restoring appointment passed all appointment gates (independence, COI clearance)
    side_effects: []
  - from: CHARTERED
    to: DISSOLVED
    trigger: POST /boardgov/committees/{id}/dissolve
    actor: BoardChair
    preconditions: []
    side_effects:
    - All ACTIVE appointments -> ENDED with ended_reason=COMMITTEE_DISSOLVED
    - All SCHEDULED meetings of this committee -> CANCELLED
  - from: ACTIVE
    to: DISSOLVED
    trigger: POST /boardgov/committees/{id}/dissolve
    actor: BoardChair
    preconditions: []
    side_effects:
    - All ACTIVE appointments -> ENDED with ended_reason=COMMITTEE_DISSOLVED
    - All SCHEDULED meetings of this committee -> CANCELLED
  - from: DORMANT
    to: DISSOLVED
    trigger: POST /boardgov/committees/{id}/dissolve
    actor: BoardChair
    preconditions: []
    side_effects:
    - All SCHEDULED meetings of this committee -> CANCELLED
- entity: CommitteeAppointment
  initial_state: ACTIVE
  terminal_states:
  - ENDED
  transitions:
  - from: ACTIVE
    to: ENDED
    trigger: POST /boardgov/committee-appointments/{id}/end
    actor: BoardChair
    preconditions: []
    side_effects:
    - ended_reason = MANUAL; Committee.active_member_count recomputes; if committee ACTIVE and count < min_members -> committee DORMANT (and its
      SCHEDULED meetings CANCELLED)
  - from: ACTIVE
    to: ENDED
    trigger: system (member resigned/removed, COI restriction cascade, or committee dissolved)
    actor: system
    preconditions: []
    side_effects:
    - ended_reason set per trigger; Committee.active_member_count recomputes; DORMANT demotion as above
- entity: Meeting
  initial_state: SCHEDULED
  terminal_states:
  - MINUTES_APPROVED
  - CANCELLED
  transitions:
  - from: SCHEDULED
    to: IN_SESSION
    trigger: POST /boardgov/meetings/{id}/call_to_order
    actor: BoardChair
    preconditions:
    - Meeting.status == SCHEDULED (ERR_INVALID_STATE)
    - Logical clock >= scheduled_start (ERR_MEETING_TOO_EARLY)
    - notice_waived == true OR notice_sent_at <= scheduled_start - 7 days (ERR_NOTICE_INSUFFICIENT)
    - quorum_met == true per quorum_attainment (ERR_QUORUM_NOT_MET)
    - 'For committee meetings: committee.status == ACTIVE (ERR_COMMITTEE_NOT_ACTIVE)'
    side_effects:
    - attendance, quorum_base, quorum_required, quorum_met persisted
  - from: IN_SESSION
    to: ADJOURNED
    trigger: POST /boardgov/meetings/{id}/adjourn
    actor: BoardChair
    preconditions: []
    side_effects:
    - Every Motion of this meeting still VOTING_OPEN or TABLED -> TABLED (votes preserved)
  - from: ADJOURNED
    to: MINUTES_DRAFTED
    trigger: POST /boardgov/meetings/{id}/minutes (first recording)
    actor: GovernanceAdmin
    preconditions:
    - expected_meeting_version matches (ERR_STALE_VERSION)
    side_effects:
    - minutes_text set; minutes_recorded_by = X-User-ID; increments Meeting.version by 1
  - from: MINUTES_DRAFTED
    to: MINUTES_DRAFTED
    trigger: POST /boardgov/meetings/{id}/minutes (re-recording the draft)
    actor: GovernanceAdmin
    preconditions:
    - expected_meeting_version matches (ERR_STALE_VERSION)
    side_effects:
    - minutes_text replaced; minutes_recorded_by = X-User-ID; increments Meeting.version by 1
  - from: MINUTES_DRAFTED
    to: MINUTES_APPROVED
    trigger: POST /boardgov/meetings/{id}/approve_minutes
    actor: BoardChair
    preconditions:
    - approving_meeting_id references a different meeting of the same scope (same nonprofit_id and same committee_id, including both null) that
      is currently IN_SESSION (ERR_MINUTES_APPROVAL_MEETING_INVALID)
    - X-User-ID != minutes_recorded_by (ERR_SEGREGATION_OF_DUTIES)
    side_effects:
    - status -> MINUTES_APPROVED
  - from: MINUTES_DRAFTED
    to: ADJOURNED
    trigger: POST /boardgov/meetings/{id}/reject_minutes
    actor: BoardChair
    preconditions:
    - rejecting_meeting_id references a different meeting of the same scope currently IN_SESSION (ERR_MINUTES_APPROVAL_MEETING_INVALID)
    side_effects:
    - minutes_text and minutes_recorded_by cleared (minutes must be re-drafted — ADJOURNED <-> MINUTES_DRAFTED cycle)
  - from: SCHEDULED
    to: CANCELLED
    trigger: POST /boardgov/meetings/{id}/cancel OR system (committee DORMANT/DISSOLVED cascade)
    actor: GovernanceAdmin | BoardChair | system
    preconditions: []
    side_effects: []
- entity: Motion
  initial_state: INTRODUCED
  terminal_states:
  - PASSED
  - FAILED
  - WITHDRAWN
  transitions:
  - from: INTRODUCED
    to: VOTING_OPEN
    trigger: POST /boardgov/motions/{id}/open_voting
    actor: BoardChair
    preconditions:
    - Motion.status == INTRODUCED (ERR_INVALID_STATE)
    - Motion.meeting_id meeting status == IN_SESSION (ERR_MEETING_NOT_IN_SESSION)
    side_effects: []
  - from: VOTING_OPEN
    to: TABLED
    trigger: POST /boardgov/motions/{id}/table OR system (meeting adjourned)
    actor: BoardChair | system
    preconditions: []
    side_effects: []
  - from: INTRODUCED
    to: TABLED
    trigger: POST /boardgov/motions/{id}/table
    actor: BoardChair
    preconditions: []
    side_effects: []
  - from: TABLED
    to: VOTING_OPEN
    trigger: POST /boardgov/motions/{id}/resume
    actor: BoardChair
    preconditions:
    - Motion.status == TABLED (ERR_INVALID_STATE)
    - Motion.meeting_id meeting status == IN_SESSION (ERR_MEETING_NOT_IN_SESSION)
    side_effects: []
  - from: VOTING_OPEN
    to: PASSED
    trigger: POST /boardgov/motions/{id}/close_voting when motion_outcome computes PASSED
    actor: BoardChair
    preconditions:
    - Motion.status == VOTING_OPEN (ERR_INVALID_STATE)
    - Motion.meeting_id meeting status == IN_SESSION (ERR_MEETING_NOT_IN_SESSION)
    side_effects:
    - 'required_votes fixed; if category == BYLAWS: linked BylawsAmendment -> ADOPTED (cascade chain A link 1)'
    - 'if category == POLICY: append { policy_title, motion_id, adopted_at } to Nonprofit.adopted_policies and bump Nonprofit.version by 1'
  - from: VOTING_OPEN
    to: FAILED
    trigger: POST /boardgov/motions/{id}/close_voting when motion_outcome computes FAILED
    actor: BoardChair
    preconditions:
    - Motion.status == VOTING_OPEN (ERR_INVALID_STATE)
    - Motion.meeting_id meeting status == IN_SESSION (ERR_MEETING_NOT_IN_SESSION)
    side_effects:
    - 'required_votes fixed; if category == BYLAWS: linked BylawsAmendment -> DEFEATED'
  - from: INTRODUCED
    to: WITHDRAWN
    trigger: POST /boardgov/motions/{id}/withdraw
    actor: BoardChair
    preconditions: []
    side_effects: []
  - from: TABLED
    to: WITHDRAWN
    trigger: POST /boardgov/motions/{id}/withdraw
    actor: BoardChair
    preconditions: []
    side_effects: []
  note: VOTING_OPEN -> TABLED -> VOTING_OPEN is the tabling cycle (Rule 3, second non-linear machine).
- entity: COIDisclosure
  initial_state: FILED
  terminal_states:
  - CLEARED
  transitions:
  - from: FILED
    to: UNDER_REVIEW
    trigger: POST /boardgov/coi-disclosures/{id}/start_review
    actor: BoardChair | BoardDirector | Treasurer (the reviewer — X-User-ID is recorded)
    preconditions:
    - Disclosure.status == FILED (ERR_INVALID_STATE)
    - X-User-ID != disclosure.board_member_id (ERR_SEGREGATION_OF_DUTIES)
    - Reviewer is an ACTIVE BoardMember of the same nonprofit (ERR_REVIEWER_NOT_QUALIFIED)
    - Reviewer has their own disclosure for the same fiscal_year in FILED | UNDER_REVIEW | CLEARED | RESTRICTIONS_IMPOSED (ERR_REVIEWER_NOT_COMPLIANT)
    side_effects:
    - reviewer_member_id = X-User-ID
  - from: UNDER_REVIEW
    to: CLEARED
    trigger: POST /boardgov/coi-disclosures/{id}/clear
    actor: BoardChair | BoardDirector | Treasurer
    preconditions:
    - Disclosure.status == UNDER_REVIEW (ERR_INVALID_STATE)
    - X-User-ID == reviewer_member_id (ERR_REVIEWER_MISMATCH)
    side_effects: []
  - from: UNDER_REVIEW
    to: RESTRICTIONS_IMPOSED
    trigger: POST /boardgov/coi-disclosures/{id}/impose_restrictions
    actor: BoardChair | BoardDirector | Treasurer
    preconditions:
    - Disclosure.status == UNDER_REVIEW (ERR_INVALID_STATE)
    - X-User-ID == reviewer_member_id (ERR_REVIEWER_MISMATCH)
    - restriction_categories non-empty (ERR_INVALID_REQUEST)
    side_effects:
    - restriction_categories persisted; BoardMember.has_active_restrictions = true (link 1)
    - Because restrictions exist, the member's ACTIVE CommitteeAppointments on committees whose type maps to a restricted category (FINANCE category
      -> FINANCE/AUDIT/COMPENSATION committees; PERSONNEL -> COMPENSATION/EXECUTIVE; GOVERNANCE -> GOVERNANCE/NOMINATING) -> ENDED with ended_reason=COI_RESTRICTION
      (link 2)
    - Because appointments ENDED, affected committees recompute active_member_count and may go DORMANT, cancelling their SCHEDULED meetings (link
      3)
  - from: RESTRICTIONS_IMPOSED
    to: CLEARED
    trigger: POST /boardgov/coi-disclosures/{id}/lift_restrictions
    actor: BoardChair | BoardDirector | Treasurer
    preconditions:
    - X-User-ID == reviewer_member_id (ERR_REVIEWER_MISMATCH)
    side_effects:
    - restriction_categories cleared; BoardMember.has_active_restrictions recomputed (false unless another current-year RESTRICTIONS_IMPOSED disclosure
      exists — impossible under one-per-year uniqueness, so false)
- entity: ExecutiveEvaluation
  initial_state: DRAFT
  terminal_states:
  - DELIVERED
  transitions:
  - from: DRAFT
    to: COMMITTEE_REVIEW
    trigger: POST /boardgov/executive-evaluations/{id}/submit_review
    actor: BoardChair
    preconditions:
    - Evaluation.status == DRAFT (ERR_INVALID_STATE)
    - All five dimensions scored (ERR_EVALUATION_INCOMPLETE)
    side_effects: []
  - from: COMMITTEE_REVIEW
    to: DRAFT
    trigger: POST /boardgov/executive-evaluations/{id}/return
    actor: BoardChair
    preconditions: []
    side_effects:
    - provisional_composite recomputed on next scores edit (return-for-revision cycle)
  - from: COMMITTEE_REVIEW
    to: RATIFIED
    trigger: POST /boardgov/executive-evaluations/{id}/ratify
    actor: BoardChair | Treasurer
    preconditions:
    - Evaluation.status == COMMITTEE_REVIEW (ERR_INVALID_STATE)
    - X-User-ID != recorded_by_user_id (ERR_SEGREGATION_OF_DUTIES)
    side_effects:
    - final_composite and rating computed per evaluation_composite WEIGHTED variant; ratified_by_user_id = X-User-ID
  - from: RATIFIED
    to: DELIVERED
    trigger: POST /boardgov/executive-evaluations/{id}/deliver
    actor: BoardChair
    preconditions: []
    side_effects: []
- entity: SuccessionPlan
  initial_state: DRAFT
  terminal_states:
  - SUPERSEDED
  - DISCARDED
  transitions:
  - from: DRAFT
    to: APPROVED
    trigger: POST /boardgov/succession-plans/{id}/approve
    actor: BoardChair
    preconditions:
    - Plan.status == DRAFT (ERR_INVALID_STATE)
    - 'For BOARD_CHAIR/TREASURER: interim_designee_member_id references an ACTIVE BoardMember of the nonprofit (ERR_DESIGNEE_REQUIRED / ERR_NOT_FOUND)'
    - 'For EXECUTIVE_DIRECTOR: interim_designee_name non-empty (ERR_DESIGNEE_REQUIRED)'
    side_effects:
    - Any other SuccessionPlan of same (nonprofit_id, target_role) in APPROVED -> SUPERSEDED (approval supersedes)
  - from: APPROVED
    to: DRAFT
    trigger: POST /boardgov/succession-plans/{id}/revise
    actor: BoardChair
    preconditions: []
    side_effects: []
  - from: APPROVED
    to: ACTIVATED
    trigger: POST /boardgov/succession-plans/{id}/activate
    actor: BoardChair
    preconditions:
    - Plan.status == APPROVED (ERR_INVALID_STATE)
    side_effects: []
  - from: ACTIVATED
    to: APPROVED
    trigger: POST /boardgov/succession-plans/{id}/stand_down
    actor: BoardChair
    preconditions: []
    side_effects: []
  - from: APPROVED
    to: SUPERSEDED
    trigger: system (another plan for the same target_role is APPROVED)
    actor: system
    preconditions: []
    side_effects: []
  - from: DRAFT
    to: DISCARDED
    trigger: POST /boardgov/succession-plans/{id}/discard
    actor: BoardChair
    preconditions: []
    side_effects: []
  note: APPROVED -> ACTIVATED -> APPROVED stand-down loop is cyclic; approval-supersedes-approval is the create-with-supersede pattern.
- entity: Form990Filing
  initial_state: DRAFT
  terminal_states:
  - PUBLIC_DISCLOSED
  - SUPERSEDED
  - DISCARDED
  transitions:
  - from: DRAFT
    to: IN_BOARD_REVIEW
    trigger: POST /boardgov/form990-filings/{id}/submit_for_review
    actor: Treasurer | GovernanceAdmin
    preconditions:
    - Filing.status == DRAFT (ERR_INVALID_STATE)
    - An ADOPTED Bylaws exists for the nonprofit (ERR_BYLAWS_NOT_ADOPTED) — review coverage is measured against it
    side_effects:
    - review_required_count computed (SEATED basis)
  - from: IN_BOARD_REVIEW
    to: APPROVED
    trigger: POST /boardgov/form990-filings/{id}/approve
    actor: BoardChair
    preconditions:
    - Filing.status == IN_BOARD_REVIEW (ERR_INVALID_STATE)
    - X-User-ID != preparer_user_id (ERR_SEGREGATION_OF_DUTIES)
    - count(reviewed_by_member_ids) >= review_required_count (ERR_REVIEW_COVERAGE_INSUFFICIENT)
    side_effects:
    - approved_by_user_id = X-User-ID
  - from: APPROVED
    to: FILED
    trigger: POST /boardgov/form990-filings/{id}/mark_filed
    actor: Treasurer | GovernanceAdmin
    preconditions: []
    side_effects:
    - filed_on = logical clock; filed_late computed; if this filing has supersedes_filing_id, the superseded filing -> SUPERSEDED (link 2 of the
      amendment chain)
  - from: FILED
    to: PUBLIC_DISCLOSED
    trigger: POST /boardgov/form990-filings/{id}/post_public_disclosure
    actor: GovernanceAdmin | ComplianceOfficer
    preconditions: []
    side_effects:
    - public_disclosure_posted_at = logical clock; disclosure_overdue recomputed false
  - from: FILED
    to: SUPERSEDED
    trigger: system (an amendment filing with supersedes_filing_id == this filing reaches FILED)
    actor: system
    preconditions: []
    side_effects: []
  - from: PUBLIC_DISCLOSED
    to: SUPERSEDED
    trigger: system (an amendment filing with supersedes_filing_id == this filing reaches FILED)
    actor: system
    preconditions: []
    side_effects: []
  - from: DRAFT
    to: DISCARDED
    trigger: POST /boardgov/form990-filings/{id}/discard
    actor: Treasurer
    preconditions: []
    side_effects: []
- entity: StateRegistration
  initial_state: REGISTERED
  terminal_states: []
  transitions:
  - from: REGISTERED
    to: RENEWAL_DUE
    trigger: 'system (compliance_sweep: logical clock >= current_period_end - 60 days and < current_period_end)'
    actor: system
    preconditions: []
    side_effects:
    - Nonprofit.compliance_posture recomputed (RENEWAL_DUE contributes AT_RISK)
  - from: REGISTERED
    to: RENEWAL_SUBMITTED
    trigger: POST /boardgov/state-registrations/{id}/submit_renewal
    actor: ComplianceOfficer
    preconditions:
    - Registration.status == REGISTERED (ERR_INVALID_STATE)
    - Logical clock >= current_period_end - 90 days (ERR_RENEWAL_TOO_EARLY)
    - paid_fee_cents == computed registration_renewal_fee (ERR_RENEWAL_FEE_MISMATCH)
    side_effects:
    - contributions_in_state_cents updated from payload; renewal_fee_cents computed and persisted (ACTUAL variant — contributions now known)
  - from: RENEWAL_DUE
    to: RENEWAL_SUBMITTED
    trigger: POST /boardgov/state-registrations/{id}/submit_renewal
    actor: ComplianceOfficer
    preconditions:
    - paid_fee_cents == computed registration_renewal_fee (ERR_RENEWAL_FEE_MISMATCH)
    side_effects:
    - contributions_in_state_cents updated; renewal_fee_cents persisted
  - from: RENEWAL_SUBMITTED
    to: REGISTERED
    trigger: POST /boardgov/state-registrations/{id}/confirm_renewal
    actor: ComplianceOfficer
    preconditions:
    - Registration.status == RENEWAL_SUBMITTED (ERR_INVALID_STATE)
    side_effects:
    - current_period_end += renewal_cycle_months; posture recomputed (renewal cycle loop closes)
  - from: REGISTERED
    to: LAPSED
    trigger: 'system (compliance_sweep: logical clock >= current_period_end)'
    actor: system
    preconditions: []
    side_effects:
    - Nonprofit.compliance_posture recomputed -> NON_COMPLIANT while any registration LAPSED (link 1)
    - Because posture became NON_COMPLIANT, every Motion of the nonprofit with category FUNDRAISING in INTRODUCED | VOTING_OPEN | TABLED -> WITHDRAWN
      (link 2)
  - from: RENEWAL_DUE
    to: LAPSED
    trigger: 'system (compliance_sweep: logical clock >= current_period_end)'
    actor: system
    preconditions: []
    side_effects:
    - Nonprofit.compliance_posture recomputed -> NON_COMPLIANT while any registration LAPSED (link 1)
    - Because posture became NON_COMPLIANT, every Motion of the nonprofit with category FUNDRAISING in INTRODUCED | VOTING_OPEN | TABLED -> WITHDRAWN
      (link 2)
  - from: RENEWAL_SUBMITTED
    to: LAPSED
    trigger: 'system (compliance_sweep: logical clock >= current_period_end and still not confirmed)'
    actor: system
    preconditions: []
    side_effects:
    - Nonprofit.compliance_posture recomputed -> NON_COMPLIANT while any registration LAPSED (link 1)
    - Because posture became NON_COMPLIANT, every Motion of the nonprofit with category FUNDRAISING in INTRODUCED | VOTING_OPEN | TABLED -> WITHDRAWN
      (link 2)
  - from: LAPSED
    to: REGISTERED
    trigger: POST /boardgov/state-registrations/{id}/reinstate
    actor: ComplianceOfficer
    preconditions:
    - Registration.status == LAPSED (ERR_INVALID_STATE)
    - paid_fee_cents == computed registration_renewal_fee including LATE_FEE_PCT surcharge (ERR_RENEWAL_FEE_MISMATCH)
    side_effects:
    - current_period_end = logical clock date + renewal_cycle_months; renewal_fee_cents persisted (with late fee); posture recomputed (may exit
      NON_COMPLIANT)
- entity: InsurancePolicy
  initial_state: QUOTED
  terminal_states:
  - EXPIRED
  - CANCELLED
  transitions:
  - from: QUOTED
    to: BOUND
    trigger: POST /boardgov/insurance-policies/{id}/bind
    actor: ComplianceOfficer
    preconditions:
    - Policy.status == QUOTED (ERR_INVALID_STATE)
    - coverage_limit_cents >= ceil(0.25 * nonprofit.annual_gross_receipts_cents) (ERR_COVERAGE_BELOW_FLOOR)
    - 'If prior_policy_id set: gap_days = (policy_start_date - prior.policy_end_date) in days; gap_days < 0 -> ERR_POLICY_OVERLAP; gap_days >
      0 and acknowledge_gap != true -> ERR_COVERAGE_GAP'
    - No other non-terminal (QUOTED|BOUND|ACTIVE) policy of same (nonprofit_id, policy_type) whose [start, end) overlaps this policy's interval
      (ERR_POLICY_OVERLAP)
    side_effects: []
  - from: BOUND
    to: ACTIVE
    trigger: POST /boardgov/insurance-policies/{id}/activate
    actor: ComplianceOfficer
    preconditions:
    - Policy.status == BOUND (ERR_INVALID_STATE)
    - Logical clock >= policy_start_date (ERR_POLICY_NOT_YET_EFFECTIVE)
    side_effects:
    - Posture recomputed (D&O coverage now active)
  - from: ACTIVE
    to: EXPIRED
    trigger: 'system (compliance_sweep: logical clock >= policy_end_date)'
    actor: system
    preconditions: []
    side_effects:
    - 'Posture recomputed: for DNO, if no other ACTIVE DNO policy covers the clock date -> NON_COMPLIANT'
  - from: QUOTED
    to: CANCELLED
    trigger: POST /boardgov/insurance-policies/{id}/cancel
    actor: ComplianceOfficer
    preconditions: []
    side_effects: []
  - from: BOUND
    to: CANCELLED
    trigger: POST /boardgov/insurance-policies/{id}/cancel
    actor: ComplianceOfficer
    preconditions: []
    side_effects:
    - Posture recomputed (coverage may no longer be in force)
  - from: ACTIVE
    to: CANCELLED
    trigger: POST /boardgov/insurance-policies/{id}/cancel
    actor: ComplianceOfficer
    preconditions: []
    side_effects:
    - 'Mid-term cancellation: posture recomputed; for DNO with no other ACTIVE DNO coverage -> NON_COMPLIANT'
concurrency_rules:
- rule_id: minutes-record-stale-meeting
  parent_entity: Meeting
  write_endpoint: POST /boardgov/meetings/{id}/minutes
  occ_field: expected_meeting_version
  description: 'Recording (or re-recording) draft minutes against a Meeting whose version

    has advanced since the client last observed it is rejected. This captures

    the case where another writer has just recorded minutes (a legitimate

    draft replacement under the minutes workflow) and the current writer''s

    view of the meeting is therefore stale.

    '
  error_id: ERR_STALE_VERSION
  http_status: 412
- rule_id: evaluation-scores-stale-evaluation
  parent_entity: ExecutiveEvaluation
  write_endpoint: PATCH /boardgov/executive-evaluations/{id}/scores
  occ_field: expected_evaluation_version
  description: 'Editing the score sheet of an ExecutiveEvaluation whose version has

    advanced since the client last observed it is rejected. A prior scores

    edit legitimately replaced part of the sheet and advanced the version, so

    the current writer''s baseline is stale.

    '
  error_id: ERR_STALE_VERSION
  http_status: 412
- rule_id: nonprofit-profile-stale-nonprofit
  parent_entity: Nonprofit
  write_endpoint: PATCH /boardgov/nonprofits/{id}
  occ_field: expected_nonprofit_version
  description: 'Updating Nonprofit profile fields (including annual_gross_receipts_cents,

    which feeds fee estimates and the coverage floor) against a Nonprofit

    whose version has advanced since the client last observed it is rejected,

    so a writer never overwrites profile changes it could not have seen.

    '
  error_id: ERR_STALE_VERSION
  http_status: 412
calculations:
- name: quorum_attainment
  trigger: POST /boardgov/meetings/{id}/call_to_order
  algorithm: threshold
  formula: "scope_members = if meeting.committee_id is null:\n                  BoardMember where nonprofit_id == meeting.nonprofit_id AND status\
    \ == ACTIVE\n                else:\n                  BoardMember joined via CommitteeAppointment where\n                    appointment.committee_id\
    \ == meeting.committee_id AND appointment.status == ACTIVE\n                    AND member.status == ACTIVE\npresent = distinct meeting.attendance\
    \ ids that are in scope_members\nif bylaws.quorum_basis == SEATED:    quorum_base = count(scope_members)\nif bylaws.quorum_basis == AUTHORIZED:\
    \ quorum_base = bylaws.board_size (board scope) or committee.authorized_size (committee scope)\nquorum_required = ceil(bylaws.quorum_pct /\
    \ 100 * quorum_base)   # integer, exact-halves round UP (ceil)\nquorum_met = (count(present) >= quorum_required)                # equality\
    \ PASSES (>=, not >)\n"
  input_set: Bylaws ADOPTED for the nonprofit at call time; BoardMember/CommitteeAppointment states as of the call; attendance payload
  constants:
    QUORUM_COMPARISON: '>='
  precision: integer seats; ceil rounding
  variants:
  - name: SEATED
    when: bylaws.quorum_basis == SEATED
    difference: Denominator is the count of currently ACTIVE scope members — vacancies shrink the quorum requirement
  - name: AUTHORIZED
    when: bylaws.quorum_basis == AUTHORIZED
    difference: Denominator is the authorized seat count (bylaws.board_size / committee.authorized_size) — vacancies do NOT shrink the quorum
      requirement, so the same attendance can pass under SEATED and fail under AUTHORIZED
- name: motion_outcome
  trigger: POST /boardgov/motions/{id}/close_voting
  algorithm: threshold
  formula: "F = votes_for, N = votes_against, A = votes_abstain, R = votes_recused (recount from Vote rows at close)\nbasis_size = per motion.threshold_basis:\n\
    \  PRESENT_AND_VOTING: F + N                       # abstains and recusals excluded\n  FULL_QUORUM:        motion meeting's persisted quorum_required\n\
    \  FULL_BOARD:         count(BoardMember ACTIVE for the nonprofit at close time) - R\nif threshold == SIMPLE_MAJORITY: required = floor(basis_size\
    \ / 2) + 1\nif threshold == TWO_THIRDS:      required = ceil(2/3 * basis_size)\nif threshold == UNANIMOUS:       required = basis_size AND\
    \ additionally N == 0 AND A == 0\nrequired_votes = required (persisted on the motion)\noutcome = PASSED iff F >= required (and for UNANIMOUS\
    \ also N == 0 AND A == 0); else FAILED\n"
  input_set: All Vote rows for the motion (Vote is append-only, so recount is deterministic); meeting quorum_required; ACTIVE members at close
  precision: integer votes
  note: TWO_THIRDS of a basis of 5 = ceil(10/3) = 4; equality F == required passes (>=).
- name: amendment_adoption_threshold
  trigger: embedded in motion_outcome when Motion.category == BYLAWS (basis forced FULL_BOARD, threshold forced TWO_THIRDS)
  algorithm: threshold
  formula: "active_count = count(BoardMember where nonprofit_id == nonprofit AND status == ACTIVE)\nif active_count >= ceil(0.75 * bylaws.board_size):\n\
    \  basis = active_count                # healthy board: two-thirds of seated directors\nelse:\n  basis = bylaws.board_size           # depleted\
    \ board (<75% seated): two-thirds of AUTHORIZED seats\nrequired = max(2, ceil(bylaws.amendment_threshold_pct / 100 * basis))\n"
  input_set: Bylaws ADOPTED at close time; BoardMember ACTIVE set at close time; votes on the linked motion
  constants:
    DEPLETED_FRACTION: 0.75
    MIN_REQUIRED: 2
  precision: integer votes; nested ceil then max
  note: '>=3 inputs (active_count, board_size, amendment_threshold_pct) with a conditional branch on vacancy level and nested max/ceil — Rule
    2 mode (a).'
- name: registration_renewal_fee
  trigger: POST /boardgov/state-registrations/{id}/submit_renewal and /reinstate
  algorithm: tiered_pricing
  formula: "# Effective contribution base E:\n#   ACTUAL variant:    E = payload contributions_in_state_cents (required at submit)\n#   ESTIMATED\
    \ variant: E = round_half_up(nonprofit.annual_gross_receipts_cents * ESTIMATE_SHARE)\n#                      used only for pre-submission\
    \ preview when contributions_in_state_cents is null\n# Tier ladder (base_cents):\n#   E <= 2_500_000      -> tier 1, base = 5_000\n#   E <=\
    \ 10_000_000     -> tier 2, base = 15_000\n#   E <= 50_000_000     -> tier 3, base = 30_000\n#   E >  50_000_000     -> tier 4, base = 50_000\
    \ plus overage surcharge\n# Boundary rule: a tier floor belongs to the LOWER tier (<=), so E == 2_500_000 is tier 1.\nsurcharge = 0 for tiers\
    \ 1-3; for tier 4:\n  surcharge = ceil((E - 50_000_000) / 100_000) * 1_000      # $10 per started $1,000 above $500k\nsubtotal = base + surcharge\
    \                                  # integers; no rounding yet\nlate_fee = round_half_up(subtotal * LATE_FEE_PCT) if registration.status ==\
    \ LAPSED else 0\nrenewal_fee_cents = subtotal + late_fee                      # PINNED ORDER: surcharge (ceil) -> late fee (round_half_up\
    \ on subtotal) -> sum\n"
  input_set: The single StateRegistration; Nonprofit.annual_gross_receipts_cents for the estimate variant; logical clock only for LAPSED detection
  constants:
    ESTIMATE_SHARE: 0.1
    LATE_FEE_PCT: 0.1
    TIER1_MAX_CENTS: 2500000
    TIER2_MAX_CENTS: 10000000
    TIER3_MAX_CENTS: 50000000
    TIER1_BASE_CENTS: 5000
    TIER2_BASE_CENTS: 15000
    TIER3_BASE_CENTS: 30000
    TIER4_BASE_CENTS: 50000
    OVERAGE_UNIT_CENTS: 100000
    OVERAGE_FEE_PER_UNIT_CENTS: 1000
  precision: 'whole cents; nested rounding pinned as: ceil the surcharge component first, then round_half_up the 10% late fee on (base + surcharge),
    then sum — computing the late fee on raw unrounded components would produce different cents'
  variants:
  - name: ACTUAL
    when: submit_renewal / reinstate with contributions_in_state_cents provided
    difference: Tier from actual in-state contributions
  - name: ESTIMATED
    when: fee preview for a registration whose contributions_in_state_cents is null
    difference: Tier from 10% of annual gross receipts — a different dollar figure, so the same registration can quote two different fees under
      the two variants
- name: evaluation_composite
  trigger: PATCH .../scores (provisional) and POST .../ratify (final)
  algorithm: weighted_scoring
  formula: 'weights = { LEADERSHIP: 0.30, FUNDRAISING: 0.20, FINANCIAL: 0.20, PROGRAM: 0.20, GOVERNANCE: 0.10 }

    provisional_composite = round_half_up(mean(all scores), 2)                    # UNWEIGHTED variant

    final_composite       = round_half_up(sum(score_d * weight_d over 5 dims), 2) # WEIGHTED variant

    rating = EXCEEDS if final >= 4.25; MEETS if >= 3.00; NEEDS_IMPROVEMENT if >= 2.00; else UNSATISFACTORY

    '
  input_set: Exactly the 5 dimension scores on the evaluation; all must be present before submit_review
  constants:
    W_LEADERSHIP: 0.3
    W_FUNDRAISING: 0.2
    W_FINANCIAL: 0.2
    W_PROGRAM: 0.2
    W_GOVERNANCE: 0.1
    BAND_EXCEEDS: 4.25
    BAND_MEETS: 3.0
    BAND_NEEDS_IMPROVEMENT: 2.0
  precision: 2 decimal places, round_half_up
  variants:
  - name: UNWEIGHTED
    when: while DRAFT / COMMITTEE_REVIEW (committee working number)
    difference: Simple mean — e.g., scores [5,5,5,1,1] give 3.40
  - name: WEIGHTED
    when: at ratify (board-final number, drives rating)
    difference: Dimension-weighted — the same scores [5,5,5,1,1] give 3.80 (LEADERSHIP 5*0.30 + FUNDRAISING 5*0.20 + FINANCIAL 5*0.20 + PROGRAM
      1*0.20 + GOVERNANCE 1*0.10), a different composite for identical inputs
- name: term_limit_eligibility
  trigger: POST /boardgov/board-terms (election)
  algorithm: chronological
  formula: "terms = BoardTerm where board_member_id == member AND status in {SCHEDULED, ACTIVE, COMPLETED, VACATED}\nsort by start_date ASC, tie-break\
    \ created_at ASC\nchain = longest trailing run where each term's start_date == previous term's end_date (half-open adjacency, gap == 0)\n\
    chain_length = count(chain); chain_end = max(end_date over chain) if chain else null\nmember.consecutive_terms_served = chain_length\nif chain_length\
    \ < bylaws_at_election.max_consecutive_terms: ELIGIBLE\nelse: ELIGIBLE only when new_term.start_date >= chain_end + bylaws_at_election.term_cooloff_years\
    \ years\n      (equality at exactly cooloff-years after chain_end is ELIGIBLE — >=, not >)\n"
  input_set: All non-deleted terms of the member; bylaws ADOPTED at election time (BoardTerm.bylaws_id pins the new term to it)
  precision: date arithmetic in whole days; 'N years' = same calendar date N years later
  note: 'Chain linkage is strict half-open adjacency: term2.start == term1.end continues the chain; any positive gap breaks it.'
- name: filing_deadline
  trigger: Form990Filing creation; compliance_sweep posture evaluation
  algorithm: forward_looking
  formula: 'fy_end = last day of nonprofit.fiscal_year_end_month in the filing''s fiscal_year

    base = first day of the month following fy_end

    filing_due_date = base + 4 months + 14 days            # Dec FYE -> May 15; Jun FYE -> Nov 15

    filed_late = (filed_on > filing_due_date)              # strictly greater = late; filing ON the due date is timely

    '
  input_set: Nonprofit fiscal calendar; filing.fiscal_year
  precision: whole days
- name: review_coverage
  trigger: POST /boardgov/form990-filings/{id}/submit_for_review and /approve
  algorithm: aggregation
  formula: 'active_members = count(BoardMember where nonprofit_id == filing.nonprofit_id AND status == ACTIVE)

    review_required_count = ceil(bylaws.quorum_pct / 100 * active_members)   # SEATED basis ALWAYS (quorum_basis ignored)

    coverage_met = count(filing.reviewed_by_member_ids) >= review_required_count   # equality PASSES

    reviewed ids must reference members ACTIVE at approve time; reviews by since-departed members are dropped from the count

    '
  input_set: Filing.reviewed_by_member_ids; ACTIVE member set at approve time; ADOPTED bylaws quorum_pct
  precision: integer members; ceil
- name: open_seats
  trigger: any BoardMember status change; any BoardTerm create/vacate/complete; bylaws board_size amendment
  algorithm: aggregation
  formula: 'open_seats = bylaws.board_size - count(BoardMember where nonprofit_id == org AND status == ACTIVE)

    INVARIANT (Rule 9): electing a member decrements open_seats by exactly 1 and that member''s later

    resignation/removal increments it by exactly 1 — any elect-then-vacate sequence leaves open_seats

    identical to its pre-sequence value.

    '
  input_set: Bylaws ADOPTED (board_size); BoardMember rows by status
  precision: integer seats
- name: compliance_posture
  trigger: compliance_sweep; any registration/filing/policy/COI transition that feeds it
  algorithm: aggregation
  formula: "NON_COMPLIANT if ANY:\n  (a) a StateRegistration with status == LAPSED\n  (b) a past-due Form990 obligation: current_fiscal_year's\
    \ PRIOR fiscal year has no filing in\n      {FILED, PUBLIC_DISCLOSED, SUPERSEDED} and logical clock > that filing's filing_due_date\n  (c)\
    \ no InsurancePolicy with policy_type == DNO and status == ACTIVE covering the clock date\nelse AT_RISK if ANY:\n  (d) a StateRegistration\
    \ in {RENEWAL_DUE, RENEWAL_SUBMITTED}\n  (e) a Form990Filing with disclosure_overdue == true\n  (f) the ACTIVE DNO policy's policy_end_date\
    \ <= clock + 30 days with no BOUND/ACTIVE successor\n      whose policy_start_date <= current policy's policy_end_date\n  (g) >= 1 ACTIVE\
    \ BoardMember whose current-fiscal-year COIDisclosure is missing or still\n      FILED/UNDER_REVIEW past FY-start + 90 days (COI delinquency)\n\
    else COMPLIANT\nGATING: while posture == NON_COMPLIANT, POST /boardgov/motions with category == FUNDRAISING\nis rejected (ERR_NONCOMPLIANT_POSTURE_BLOCKS)\
    \ — posture gates that child operation.\n"
  input_set: All StateRegistrations, Form990Filings, InsurancePolicies, ACTIVE BoardMembers + their current-FY COIDisclosures of the nonprofit;
    logical clock
  constants:
    COI_DUE_DAYS_INTO_FY: 90
    DNO_EXPIRY_WARNING_DAYS: 30
    PUBLIC_DISCLOSURE_WINDOW_DAYS: 30
  precision: whole days
- name: coverage_gap_detection
  trigger: POST /boardgov/insurance-policies/{id}/bind
  algorithm: interval_merge
  formula: "For this policy P with prior_policy_id -> Q:\n  gap_days = (P.policy_start_date - Q.policy_end_date) in whole days\n  gap_days < 0\
    \  -> overlap -> ERR_POLICY_OVERLAP (renewals must ABUT: P.start == Q.end is continuous, gap 0)\n  gap_days == 0 -> continuous coverage\n\
    \  gap_days > 0  -> ERR_COVERAGE_GAP unless P.acknowledge_gap == true\nIndependently, P's [start, end) must not overlap any other non-terminal\
    \ same-type policy of the\nnonprofit: overlap iff P.start < other.end AND other.start < P.end (half-open; abutting is allowed).\n"
  input_set: The policy being bound; its prior-policy chain; all non-terminal same-type policies of the nonprofit
  precision: whole days; half-open intervals
  note: 'Three distinct interval semantics coexist: BoardTerm half-open with adjacency-allowed, Meeting 30-minute buffered exclusion, InsurancePolicy
    adjacency-required renewal chaining (Rule 8).'
- name: meeting_overlap_check
  trigger: POST /boardgov/meetings
  algorithm: interval_merge
  formula: "Resource = the meeting's scope: (nonprofit_id, committee_id) pair — board meetings contend with\nboard meetings, committee meetings\
    \ contend with meetings of the SAME committee only.\nFor each existing non-CANCELLED meeting M of the same scope:\n  conflict iff new.start\
    \ < M.end + BUFFER and M.start < new.end + BUFFER\n  where end = scheduled_start + duration_minutes and BUFFER = 30 minutes on BOTH sides.\n\
    Adjacency with a 30-minute gap is REQUIRED: new.start == M.end is still a conflict (buffer not met);\nnew.start == M.end + 30min is allowed\
    \ (boundary: exactly 30 minutes passes, 29 fails).\n"
  input_set: Non-CANCELLED meetings of the same scope
  constants:
    BUFFER_MINUTES: 30
  precision: whole minutes
validations:
- priority: 1
  category: auth
  check: X-User-ID and X-User-Role headers present and non-empty
  error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
  http_status: 400
  applies_to: all endpoints
- priority: 2
  category: auth
  check: Caller role appears in the endpoint's roles list
  error_id: ERR_FORBIDDEN_FOR_ROLE
  http_status: 403
  applies_to: all endpoints
- priority: 3
  category: auth
  check: 'Entity-backed role qualification: BoardChair requires an ACTIVE BoardMember with officer_role=CHAIR whose id == X-User-ID; Treasurer
    likewise officer_role=TREASURER; BoardDirector requires any ACTIVE BoardMember with id == X-User-ID; the member must belong to the nonprofit
    being acted on'
  error_id: ERR_IDENTITY_NOT_QUALIFIED
  http_status: 403
  applies_to: all endpoints invoked as BoardChair | BoardDirector | Treasurer
- priority: 4
  category: auth
  check: 'Self-service ownership: POST /boardgov/votes and POST /boardgov/coi-disclosures require payload board_member_id == X-User-ID (a director
    votes/discloses only as themself)'
  error_id: ERR_FORBIDDEN_FOR_ROLE
  http_status: 403
  applies_to: POST /boardgov/votes, POST /boardgov/coi-disclosures
- priority: 5
  category: existence
  check: Path resource ids exist (validated left-to-right)
  error_id: ERR_NOT_FOUND
  http_status: 404
  applies_to: all endpoints with path ids
- priority: 6
  category: existence
  check: Body-referenced ids exist and belong to the same nonprofit (base_bylaws_id, board_member_id, committee_id, meeting_id, motion_id, bylaws_amendment_id,
    prior_policy_id, supersedes_filing_id, interim_designee_member_id)
  error_id: ERR_REFERENCED_NOT_FOUND
  http_status: 422
  applies_to: all POST/PATCH endpoints with body FK fields
- priority: 7
  category: state
  check: Target resource is in a from-state the transition allows
  error_id: ERR_INVALID_STATE
  http_status: 409
  applies_to: all action/transition endpoints
- priority: 8
  category: state
  check: 'Optimistic concurrency: expected_<parent>_version equals the parent''s current version'
  error_id: ERR_STALE_VERSION
  http_status: 412
  applies_to: POST /boardgov/meetings/{id}/minutes, PATCH /boardgov/executive-evaluations/{id}/scores, PATCH /boardgov/nonprofits/{id}
- priority: 9
  category: business_referential
  check: 'Cross-entity state gates: BoardTerm create needs an ADOPTED bylaws (ERR_BYLAWS_NOT_ADOPTED); motion open/close/resume needs meeting
    IN_SESSION (ERR_MEETING_NOT_IN_SESSION); vote cast needs motion VOTING_OPEN (ERR_MOTION_NOT_OPEN) and meeting IN_SESSION; committee meeting
    call_to_order needs committee ACTIVE (ERR_COMMITTEE_NOT_ACTIVE); BYLAWS motion create needs amendment PROPOSED (ERR_AMENDMENT_NOT_PROPOSED)
    with no other non-terminal motion linked (ERR_AMENDMENT_HAS_OPEN_MOTION); vote cast needs the voter on the meeting attendance roster and scope-eligible
    (ACTIVE appointee for committee meetings) (ERR_VOTER_NOT_ELIGIBLE)'
  error_id: ERR_BYLAWS_NOT_ADOPTED | ERR_MEETING_NOT_IN_SESSION | ERR_MOTION_NOT_OPEN | ERR_COMMITTEE_NOT_ACTIVE | ERR_AMENDMENT_NOT_PROPOSED
    | ERR_AMENDMENT_HAS_OPEN_MOTION | ERR_VOTER_NOT_ELIGIBLE
  http_status: 409
  applies_to: term/meeting/motion/vote/amendment endpoints
- priority: 10
  category: business_safety
  check: 'Segregation of duties: COI reviewer != filer (ERR_SEGREGATION_OF_DUTIES); COI clear/impose/lift only by assigned reviewer (ERR_REVIEWER_MISMATCH);
    990 approver != preparer_user_id (ERR_SEGREGATION_OF_DUTIES); evaluation ratifier != recorded_by_user_id (ERR_SEGREGATION_OF_DUTIES); evaluation
    score edits after the first only by recorded_by_user_id (ERR_EVALUATION_RECORDER_MISMATCH); minutes approver != minutes_recorded_by (ERR_SEGREGATION_OF_DUTIES)'
  error_id: ERR_SEGREGATION_OF_DUTIES | ERR_REVIEWER_MISMATCH | ERR_EVALUATION_RECORDER_MISMATCH
  http_status: 409
  applies_to: COI review endpoints, form990 approve, evaluation scores/ratify, minutes approve
- priority: 11
  category: business_safety
  check: 'Recusal: a voter whose current-fiscal-year COIDisclosure is RESTRICTIONS_IMPOSED with restriction_categories containing the motion''s
    category must cast RECUSED; any other choice is rejected'
  error_id: ERR_MEMBER_RECUSED
  http_status: 409
  applies_to: POST /boardgov/votes
- priority: 12
  category: business_safety
  check: 'Compliance posture gate: FUNDRAISING-category motions cannot be introduced while nonprofit compliance_posture == NON_COMPLIANT'
  error_id: ERR_NONCOMPLIANT_POSTURE_BLOCKS
  http_status: 409
  applies_to: POST /boardgov/motions
- priority: 13
  category: business_referential
  check: 'Reviewer qualification: COI reviewer must be an ACTIVE member of the same nonprofit (ERR_REVIEWER_NOT_QUALIFIED) and must have filed
    their OWN disclosure for the same fiscal_year in any of {FILED, UNDER_REVIEW, CLEARED, RESTRICTIONS_IMPOSED} (ERR_REVIEWER_NOT_COMPLIANT)'
  error_id: ERR_REVIEWER_NOT_QUALIFIED | ERR_REVIEWER_NOT_COMPLIANT
  http_status: 409
  applies_to: POST /boardgov/coi-disclosures/{id}/start_review
- priority: 14
  category: business_constraint
  check: 'Uniqueness: EIN globally unique (ERR_DUPLICATE_EIN); member email unique per nonprofit (ERR_DUPLICATE_MEMBER_EMAIL); one disclosure
    per member per fiscal_year (ERR_DUPLICATE_DISCLOSURE); one root 990 filing per nonprofit per fiscal_year (ERR_DUPLICATE_FILING); one evaluation
    per nonprofit per fiscal_year (ERR_DUPLICATE_EVALUATION); one registration per (nonprofit, state_code) (ERR_DUPLICATE_REGISTRATION); committee
    name unique per nonprofit among non-DISSOLVED (ERR_DUPLICATE_COMMITTEE_NAME); one ACTIVE CHAIR appointment per committee (ERR_DUPLICATE_COMMITTEE_CHAIR);
    one Vote per (motion, member) (ERR_DUPLICATE_VOTE); one review per member per filing (ERR_DUPLICATE_REVIEW)'
  error_id: ERR_DUPLICATE_EIN | ERR_DUPLICATE_MEMBER_EMAIL | ERR_DUPLICATE_DISCLOSURE | ERR_DUPLICATE_FILING | ERR_DUPLICATE_EVALUATION | ERR_DUPLICATE_REGISTRATION
    | ERR_DUPLICATE_COMMITTEE_NAME | ERR_DUPLICATE_COMMITTEE_CHAIR | ERR_DUPLICATE_VOTE | ERR_DUPLICATE_REVIEW
  http_status: 409
  applies_to: creation endpoints and vote/review recorders
- priority: 15
  category: business_constraint
  check: 'Election eligibility: member.status in {PROPOSED, PAST, TERM_LIMITED_OUT, ACTIVE} — ACTIVE incumbents may be re-elected to a non-overlapping
    next term (ERR_MEMBER_NOT_ELIGIBLE for RESIGNED/REMOVED); term_limit_eligibility passes — chain_length < max_consecutive_terms OR cool-off
    elapsed (ERR_TERM_LIMIT_EXCEEDED); open_seats >= 1 unless the member is currently ACTIVE (incumbent re-election does not consume a second
    seat) (ERR_NO_SEATS_AVAILABLE). Internal order: MEMBER_NOT_ELIGIBLE, then TERM_LIMIT_EXCEEDED, then NO_SEATS_AVAILABLE.'
  error_id: ERR_MEMBER_NOT_ELIGIBLE | ERR_TERM_LIMIT_EXCEEDED | ERR_NO_SEATS_AVAILABLE
  http_status: 409
  applies_to: POST /boardgov/board-terms
- priority: 16
  category: business_constraint
  check: 'Committee composition gates on appointment: member ACTIVE (ERR_MEMBER_NOT_ELIGIBLE); committee not DISSOLVED (ERR_INVALID_STATE); committee
    active_member_count < authorized_size (ERR_COMMITTEE_FULL); requires_all_independent appointees must be independent (ERR_COMMITTEE_NOT_INDEPENDENT);
    appointee must hold a reviewed current-FY COI disclosure (ERR_COI_REVIEW_REQUIRED); same member may not hold two ACTIVE appointments on the
    same committee (ERR_DUPLICATE_APPOINTMENT)'
  error_id: ERR_MEMBER_NOT_ELIGIBLE | ERR_COMMITTEE_FULL | ERR_COMMITTEE_NOT_INDEPENDENT | ERR_COI_REVIEW_REQUIRED | ERR_DUPLICATE_APPOINTMENT
  http_status: 409
  applies_to: POST /boardgov/committee-appointments
- priority: 17
  category: business_constraint
  check: 'Committee activation gate: active_member_count >= min_members (ERR_COMMITTEE_BELOW_MIN); independence and COI-clearance of all ACTIVE
    appointees (ERR_COMMITTEE_NOT_INDEPENDENT / ERR_COI_REVIEW_REQUIRED)'
  error_id: ERR_COMMITTEE_BELOW_MIN | ERR_COMMITTEE_NOT_INDEPENDENT | ERR_COI_REVIEW_REQUIRED
  http_status: 409
  applies_to: POST /boardgov/committees/{id}/activate
- priority: 18
  category: business_temporal
  check: 'Interval rules: new BoardTerm must not overlap the member''s existing non-VACATED terms under half-open semantics (adjacency allowed)
    (ERR_TERM_OVERLAP); new Meeting must respect the 30-minute buffer within its scope (ERR_MEETING_OVERLAP); insurance renewal must abut its
    prior policy (gap) and not overlap same-type policies (ERR_COVERAGE_GAP / ERR_POLICY_OVERLAP)'
  error_id: ERR_TERM_OVERLAP | ERR_MEETING_OVERLAP | ERR_COVERAGE_GAP | ERR_POLICY_OVERLAP
  http_status: 409
  applies_to: POST /boardgov/board-terms, POST /boardgov/meetings, POST /boardgov/insurance-policies/{id}/bind
- priority: 19
  category: business_temporal
  check: 'Window/deadline rules: call_to_order not before scheduled_start (ERR_MEETING_TOO_EARLY); notice_waived or notice_sent_at <= scheduled_start
    - 7 days (ERR_NOTICE_INSUFFICIENT); renewal submit not earlier than 90 days before current_period_end (ERR_RENEWAL_TOO_EARLY); policy activate
    not before policy_start_date (ERR_POLICY_NOT_YET_EFFECTIVE)'
  error_id: ERR_MEETING_TOO_EARLY | ERR_NOTICE_INSUFFICIENT | ERR_RENEWAL_TOO_EARLY | ERR_POLICY_NOT_YET_EFFECTIVE
  http_status: 409
  applies_to: call_to_order, submit_renewal, policy activate
- priority: 20
  category: business_fiscal
  check: 'Money checks last: paid_fee_cents equals computed renewal fee (ERR_RENEWAL_FEE_MISMATCH); D&O/GL coverage_limit_cents >= ceil(0.25 *
    annual_gross_receipts_cents) at bind (ERR_COVERAGE_BELOW_FLOOR)'
  error_id: ERR_RENEWAL_FEE_MISMATCH | ERR_COVERAGE_BELOW_FLOOR
  http_status: 409
  applies_to: submit_renewal, reinstate, policy bind
- priority: 21
  category: business_fiscal
  check: 'Aggregate participation thresholds at action time: quorum_met at call_to_order (ERR_QUORUM_NOT_MET); 990 review coverage at approve
    (ERR_REVIEW_COVERAGE_INSUFFICIENT)'
  error_id: ERR_QUORUM_NOT_MET | ERR_REVIEW_COVERAGE_INSUFFICIENT
  http_status: 409
  applies_to: POST /boardgov/meetings/{id}/call_to_order, POST /boardgov/form990-filings/{id}/approve
- priority: 22
  category: business_constraint
  check: 'Domain-shape business rules whose failure surfaces as 409: evaluation completeness at submit_review (ERR_EVALUATION_INCOMPLETE); succession
    designee present per target_role at approve (ERR_DESIGNEE_REQUIRED); approving/rejecting meeting is a different, same-scope, IN_SESSION meeting
    (ERR_MINUTES_APPROVAL_MEETING_INVALID)'
  error_id: ERR_EVALUATION_INCOMPLETE | ERR_DESIGNEE_REQUIRED | ERR_MINUTES_APPROVAL_MEETING_INVALID
  http_status: 409
  applies_to: submit_review, succession approve, approve_minutes, reject_minutes
  note: 'ERR_INVALID_REQUEST (400) is NOT a business rule: malformed/absent required fields and enum violations short-circuit immediately after
    the auth block (priorities 1-4) and before existence/state checks.'
response_envelope:
  success: "{ \"meta\": { \"api_request_id\": \"req_xxx\", \"api_request_timestamp\": \"ISO8601\" },\n  \"response_type\": \"object\" | \"array\"\
    , \"data\": {} }\n"
  error: "{ \"meta\": { ... }, \"response_type\": \"error\",\n  \"data\": { \"error_id\": \"ERR_XXX\", \"message\": \"...\" } }\n"
  pagination_fields:
  - limit
  - offset
  - total_count
  - has_more
  pagination_defaults:
    limit: 10
    min: 1
    max: 100
    offset: 0
endpoints:
- method: POST
  path: /boardgov/_clock/set_current_utc
  description: Test-driving logical clock. Sets the server clock used by every date rule. Startup default (before any call) is exactly 2026-08-01T00:00:00Z
    and never falls back to wall-clock time.
  roles:
  - GovernanceAdmin
  code: 200
  input:
  - to_iso8601
  output: '{ current_utc: string }'
  side_effects:
  - No entity transitions fire; pair with compliance_sweep to apply time-based transitions
- method: POST
  path: /boardgov/nonprofits
  description: Incorporate a nonprofit
  roles:
  - GovernanceAdmin
  code: 201
  input:
  - name
  - ein
  - state_of_incorporation
  - fiscal_year_end_month
  - annual_gross_receipts_cents
  output: Nonprofit
  side_effects:
  - compliance_posture initialized to NON_COMPLIANT (no D&O coverage yet)
- method: GET
  path: /boardgov/nonprofits/{id}
  description: Get a nonprofit (includes computed current_fiscal_year and compliance_posture as of the logical clock)
  roles:
  - GovernanceAdmin
  - BoardChair
  - BoardDirector
  - Treasurer
  - ComplianceOfficer
  - ExecutiveDirector
  code: 200
  input: []
  output: Nonprofit
  side_effects: []
- method: PATCH
  path: /boardgov/nonprofits/{id}
  description: Update nonprofit profile fields (OCC-guarded)
  roles:
  - GovernanceAdmin
  code: 200
  input:
  - expected_nonprofit_version
  - name?
  - state_of_incorporation?
  - fiscal_year_end_month?
  - annual_gross_receipts_cents?
  output: Nonprofit
  side_effects:
  - increments Nonprofit.version by 1
  - posture recomputed if annual_gross_receipts_cents changed (coverage floor / fee estimates read the new value)
- method: POST
  path: /boardgov/nonprofits/{id}/compliance_sweep
  description: 'Ops-run checkpoint: applies every time-based transition as of the logical clock (term activation/completion, member PAST/TERM_LIMITED_OUT,
    registration RENEWAL_DUE/LAPSED cascades, policy activation-free expiry, posture recompute)'
  roles:
  - GovernanceAdmin
  - ComplianceOfficer
  code: 200
  input: []
  output: Nonprofit
  side_effects:
  - BoardTerm SCHEDULED->ACTIVE / ACTIVE->COMPLETED by date
  - BoardMember ACTIVE->PAST / ACTIVE->TERM_LIMITED_OUT when their last term completes
  - StateRegistration RENEWAL_DUE / LAPSED transitions incl. NON_COMPLIANT cascade and FUNDRAISING motion withdrawal
  - InsurancePolicy ACTIVE->EXPIRED; D&O coverage gap posture recompute
  - Form990Filing disclosure_overdue recompute
- method: GET
  path: /boardgov/nonprofits/{id}/recruitment-matrix
  description: 'Computed read: per-skill counts over ACTIVE members, uncovered skill gaps, board_size utilization vs the ADOPTED bylaws'
  roles:
  - GovernanceAdmin
  - BoardChair
  - BoardDirector
  - Treasurer
  - ComplianceOfficer
  - ExecutiveDirector
  code: 200
  input: []
  output: '{ by_skill: object, uncovered_skills: string[], active_members: integer, board_size: integer, open_seats: integer }'
  side_effects: []
