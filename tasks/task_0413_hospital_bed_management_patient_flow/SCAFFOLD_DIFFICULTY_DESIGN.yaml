# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Hospital Bed Management & Patient Flow — Expert tier
# 9 rule_ids × ≥2 instances = 19 instances.
# Clock is set via POST /_clock/set; all time-derived literals computed against it.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: los_live_vs_frozen_on_encounter
        grounds:
          - calculations.length_of_stay
          - entities.Encounter.fields.length_of_stay_hours
          - entities.Encounter.fields.long_stay_flag
          - state_machines.Encounter.DISCHARGE_ORDERED_to_DISCHARGED
        distinguishing_aspect: |
          length_of_stay_hours on Encounter has a LIVE variant (clock_now - admitted_at, grows each
          read) and a FROZEN variant (discharged_at - admitted_at, fixed at DISCHARGED); reading the
          same encounter before and after discharge at different clock positions yields different
          numbers from the same admitted_at.
        test_recipe:
          setup:
            - "Unit U1 (gmlos_days=3) with one CLEAN telemetry bed B1; ED encounter E1 placed in B1 at 2026-06-01T08:00Z (admitted_at)."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T08:00:00Z" }
              as: FlowAdmin
            - call: "POST /units"
              payload: { name: "5 West", unit_type: "TELEMETRY", gmlos_days: 3 }
              as: FlowAdmin
              captures: { u1: $.data.id }
            - call: "POST /units/${u1}/beds"
              payload: { unit_id: "${u1}", label: "501-A", telemetry_capable: true }
              as: ChargeNurse
              captures: { b1: $.data.id }
            - call: "POST /units/${u1}/beds/${b1}/mark-clean"
              payload: {}
              as: ChargeNurse
              captures: { b1_v: $.data.version }
            - call: "POST /encounters"
              payload: { mrn: "M001", sex: "MALE", requires_telemetry: true, origin: "ED" }
              as: BedControlCoordinator
              captures: { e1: $.data.id }
            - call: "POST /encounters/${e1}/admit-order"
              payload: {}
              as: BedControlCoordinator
            - call: "POST /bed-requests"
              payload: { encounter_id: "${e1}", preferred_unit_id: "${u1}" }
              as: TransferCenterAgent
              captures: { r1: $.data.id }
            - call: "POST /bed-requests/${r1}/assign"
              payload: { bed_id: "${b1}" }
              as: BedControlCoordinator
            - call: "POST /bed-requests/${r1}/confirm"
              payload: { expected_bed_version: "${b1_v}" }
              as: BedControlCoordinator
          trigger:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-06T00:00:00Z" }
              as: FlowAdmin
            - call: "GET /encounters/${e1}"
              payload: {}
              as: BedControlCoordinator
              captures: { los_live: $.data.length_of_stay_hours }
          assert:
            - "Encounter.${e1}.length_of_stay_hours == 112.0"
            - "Encounter.${e1}.long_stay_flag == true"
            - "Encounter.${e1}.status == PLACED"

      - name: posture_derived_vs_effective_on_unit
        grounds:
          - calculations.unit_posture
          - entities.Unit.fields.derived_posture
          - entities.Unit.fields.effective_posture
          - state_machines.SurgeEvent.OPEN_to_STOOD_DOWN
        distinguishing_aspect: |
          A Unit's posture has a DERIVED variant (from occupancy_pct only) and an EFFECTIVE variant
          (max severity of derived_posture and the OPEN-surge declared_surge_level); on a 50%-occupied
          unit derived_posture is GREEN while effective_posture is RED once a RED surge is OPEN —
          same Unit, two valid posture readings that differ.
        test_recipe:
          setup:
            - "Unit U1 with 2 staffed beds, 1 OCCUPIED (occupancy 50%, derived GREEN); a RED SurgeEvent OPEN on U1."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-02T00:00:00Z" }
              as: FlowAdmin
            - call: "POST /units"
              payload: { name: "ICU-A", unit_type: "ICU", gmlos_days: 4 }
              as: FlowAdmin
              captures: { u1: $.data.id }
            - call: "POST /units/${u1}/beds"
              payload: { unit_id: "${u1}", label: "A1" }
              as: ChargeNurse
              captures: { ba: $.data.id }
            - call: "POST /units/${u1}/beds/${ba}/mark-clean"
              payload: {}
              as: ChargeNurse
              captures: { ba_v: $.data.version }
            - call: "POST /units/${u1}/beds"
              payload: { unit_id: "${u1}", label: "A2" }
              as: ChargeNurse
              captures: { bb: $.data.id }
            - call: "POST /units/${u1}/beds/${bb}/mark-clean"
              payload: {}
              as: ChargeNurse
            - call: "POST /encounters"
              payload: { mrn: "M050", sex: "FEMALE", origin: "DIRECT" }
              as: BedControlCoordinator
              captures: { e1: $.data.id }
            - call: "POST /encounters/${e1}/admit-order"
              payload: {}
              as: BedControlCoordinator
            - call: "POST /bed-requests"
              payload: { encounter_id: "${e1}" }
              as: TransferCenterAgent
              captures: { r1: $.data.id }
            - call: "POST /bed-requests/${r1}/assign"
              payload: { bed_id: "${ba}" }
              as: BedControlCoordinator
            - call: "POST /bed-requests/${r1}/confirm"
              payload: { expected_bed_version: "${ba_v}" }
              as: BedControlCoordinator
            - call: "POST /surge-events"
              payload: { unit_id: "${u1}", level: "RED", reason: "mass casualty" }
              as: BedControlCoordinator
          trigger:
            - call: "GET /units/${u1}"
              payload: {}
              as: BedControlCoordinator
          assert:
            - "Unit.${u1}.occupancy_pct == 50.0"
            - "Unit.${u1}.derived_posture == GREEN"
            - "Unit.${u1}.declared_surge_level == RED"
            - "Unit.${u1}.effective_posture == RED"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: placement_score_multi_input_nonlinear
        grounds:
          - calculations.placement_match_score
          - entities.BedRequest.fields.match_score
          - entities.BedRequest.fields.assigned_bed_id
          - state_machines.BedRequest.QUEUED_to_ASSIGNED
        distinguishing_aspect: |
          MODE (a): match_score combines four inputs with non-linear interaction — iso-waste penalty,
          tele-waste penalty, posture bonus keyed on unit effective_posture, and a +50 preferred-unit
          bonus — and the selector picks argmax then tie-breaks on occupancy_pct ASC. A telemetry-needing
          patient with preferred unit U1 scores bed B1 (U1, tele) at 70 vs an iso-capable B2 (U2) at 10,
          so auto-place selects B1.
        test_recipe:
          setup:
            - "Two GREEN units; U1 has CLEAN telemetry bed B1; U2 has CLEAN isolation+telemetry bed B2; tele-needing ED encounter prefers U1."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-03T09:00:00Z" }
              as: FlowAdmin
            - call: "POST /units"
              payload: { name: "U1", unit_type: "TELEMETRY", gmlos_days: 3 }
              as: FlowAdmin
              captures: { u1: $.data.id }
            - call: "POST /units"
              payload: { name: "U2", unit_type: "TELEMETRY", gmlos_days: 3 }
              as: FlowAdmin
              captures: { u2: $.data.id }
            - call: "POST /units/${u1}/beds"
              payload: { unit_id: "${u1}", label: "B1", telemetry_capable: true }
              as: ChargeNurse
              captures: { b1: $.data.id }
            - call: "POST /units/${u1}/beds/${b1}/mark-clean"
              payload: {}
              as: ChargeNurse
            - call: "POST /units/${u2}/beds"
              payload: { unit_id: "${u2}", label: "B2", isolation_capable: true, telemetry_capable: true }
              as: ChargeNurse
              captures: { b2: $.data.id }
            - call: "POST /units/${u2}/beds/${b2}/mark-clean"
              payload: {}
              as: ChargeNurse
            - call: "POST /encounters"
              payload: { mrn: "M100", sex: "MALE", requires_telemetry: true, origin: "ED" }
              as: BedControlCoordinator
              captures: { e1: $.data.id }
            - call: "POST /encounters/${e1}/admit-order"
              payload: {}
              as: BedControlCoordinator
            - call: "POST /bed-requests"
              payload: { encounter_id: "${e1}", preferred_unit_id: "${u1}" }
              as: TransferCenterAgent
              captures: { r1: $.data.id }
          trigger:
            - call: "POST /bed-requests/${r1}/auto-place"
              payload: {}
              as: BedControlCoordinator
              captures: { picked: $.data.assigned_bed_id, sc: $.data.match_score }
          assert:
            - "BedRequest.${r1}.assigned_bed_id == ${b1}"
            - "BedRequest.${r1}.match_score == 70"
            - "BedRequest.${r1}.status == ASSIGNED"

      - name: discharge_delay_round_then_floor_order
        grounds:
          - calculations.discharge_delay
          - entities.Encounter.fields.discharge_order_at
          - state_machines.Encounter.PLACED_to_DISCHARGE_ORDERED
        distinguishing_aspect: |
          MODE (b): discharge_delay pins a two-step rounding ORDER — round (end_ts - discharge_order_at)
          to 2dp HOURS first, THEN floor(hours/24) for avoidable_bed_days. With a 50.00-hour delay the
          pinned order gives avoidable_bed_days = floor(50.00/24) = 2; flooring before rounding would
          differ on fractional boundaries, so the order is observable.
        test_recipe:
          setup:
            - "ED encounter E1 placed in B1, discharge ordered at 2026-06-05T10:00Z, clock advanced to 2026-06-07T12:00Z (50h later), still DISCHARGE_ORDERED."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-05T08:00:00Z" }
              as: FlowAdmin
            - call: "POST /units"
              payload: { name: "MS1", unit_type: "MEDSURG", gmlos_days: 3 }
              as: FlowAdmin
              captures: { u1: $.data.id }
            - call: "POST /units/${u1}/beds"
              payload: { unit_id: "${u1}", label: "M1" }
              as: ChargeNurse
              captures: { b1: $.data.id }
            - call: "POST /units/${u1}/beds/${b1}/mark-clean"
              payload: {}
              as: ChargeNurse
              captures: { b1_v: $.data.version }
            - call: "POST /encounters"
              payload: { mrn: "M200", sex: "FEMALE", origin: "ED" }
              as: BedControlCoordinator
              captures: { e1: $.data.id }
            - call: "POST /encounters/${e1}/admit-order"
              payload: {}
              as: BedControlCoordinator
            - call: "POST /bed-requests"
              payload: { encounter_id: "${e1}", preferred_unit_id: "${u1}" }
              as: TransferCenterAgent
              captures: { r1: $.data.id }
            - call: "POST /bed-requests/${r1}/assign"
              payload: { bed_id: "${b1}" }
              as: BedControlCoordinator
            - call: "POST /bed-requests/${r1}/confirm"
              payload: { expected_bed_version: "${b1_v}" }
              as: BedControlCoordinator
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-05T10:00:00Z" }
              as: FlowAdmin
            - call: "POST /encounters/${e1}/discharge-order"
              payload: {}
              as: CaseManager
          trigger:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-07T12:00:00Z" }
              as: FlowAdmin
            - call: "GET /encounters/${e1}"
              payload: {}
              as: CaseManager
          assert:
            - "Encounter.${e1}.status == DISCHARGE_ORDERED"
            - "Encounter.${e1}.discharge_order_at == 2026-06-05T10:00:00.000Z"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: encounter_transfer_self_loop_on_placed
        grounds:
          - state_machines.Encounter.PLACED_to_PLACED
          - entities.Encounter.fields.transferred_from_bed_id
          - entities.Encounter.fields.current_bed_id
        distinguishing_aspect: |
          The Encounter machine has a non-linear PLACED→PLACED self-loop (transfer): the patient stays
          PLACED while current_bed_id swaps to the target bed and transferred_from_bed_id records the old
          bed — a cycle on a single state, not a forward-only A→B→C pipeline.
        test_recipe:
          setup:
            - "Encounter E1 PLACED in B1 (unit U1); a second CLEAN bed B2 exists in U1."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-04T08:00:00Z" }
              as: FlowAdmin
            - call: "POST /units"
              payload: { name: "MS2", unit_type: "MEDSURG", gmlos_days: 3 }
              as: FlowAdmin
              captures: { u1: $.data.id }
            - call: "POST /units/${u1}/beds"
              payload: { unit_id: "${u1}", label: "T1" }
              as: ChargeNurse
              captures: { b1: $.data.id }
            - call: "POST /units/${u1}/beds/${b1}/mark-clean"
              payload: {}
              as: ChargeNurse
              captures: { b1_v: $.data.version }
            - call: "POST /units/${u1}/beds"
              payload: { unit_id: "${u1}", label: "T2" }
              as: ChargeNurse
              captures: { b2: $.data.id }
            - call: "POST /units/${u1}/beds/${b2}/mark-clean"
              payload: {}
              as: ChargeNurse
            - call: "POST /encounters"
              payload: { mrn: "M300", sex: "MALE", origin: "DIRECT" }
              as: BedControlCoordinator
              captures: { e1: $.data.id }
            - call: "POST /encounters/${e1}/admit-order"
              payload: {}
              as: BedControlCoordinator
            - call: "POST /bed-requests"
              payload: { encounter_id: "${e1}" }
              as: BedControlCoordinator
              captures: { r1: $.data.id }
            - call: "POST /bed-requests/${r1}/assign"
              payload: { bed_id: "${b1}" }
              as: BedControlCoordinator
            - call: "POST /bed-requests/${r1}/confirm"
              payload: { expected_bed_version: "${b1_v}" }
              as: BedControlCoordinator
          trigger:
            - call: "POST /encounters/${e1}/transfer"
              payload: { target_bed_id: "${b2}" }
              as: BedControlCoordinator
          assert:
            - "Encounter.${e1}.status == PLACED"
            - "Encounter.${e1}.current_bed_id == ${b2}"
            - "Encounter.${e1}.transferred_from_bed_id == ${b1}"

      - name: bedrequest_release_revert_loop
        grounds:
          - state_machines.BedRequest.ASSIGNED_to_QUEUED
          - state_machines.BedRequest.QUEUED_to_ASSIGNED
          - entities.BedRequest.fields.assigned_bed_id
        distinguishing_aspect: |
          The BedRequest machine has a non-linear ASSIGNED→QUEUED revert (release) that loops the request
          back to the queue and nulls assigned_bed_id/match_score — a cycle on a DIFFERENT entity than the
          Encounter self-loop, so two distinct entities carry non-linear shape.
        test_recipe:
          setup:
            - "BedRequest R1 ASSIGNED to CLEAN bed B1 for encounter E1 (ED, BOARDING)."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-04T10:00:00Z" }
              as: FlowAdmin
            - call: "POST /units"
              payload: { name: "MS3", unit_type: "MEDSURG", gmlos_days: 3 }
              as: FlowAdmin
              captures: { u1: $.data.id }
            - call: "POST /units/${u1}/beds"
              payload: { unit_id: "${u1}", label: "R1B" }
              as: ChargeNurse
              captures: { b1: $.data.id }
            - call: "POST /units/${u1}/beds/${b1}/mark-clean"
              payload: {}
              as: ChargeNurse
            - call: "POST /encounters"
              payload: { mrn: "M400", sex: "FEMALE", origin: "ED" }
              as: BedControlCoordinator
              captures: { e1: $.data.id }
            - call: "POST /encounters/${e1}/admit-order"
              payload: {}
              as: BedControlCoordinator
            - call: "POST /bed-requests"
              payload: { encounter_id: "${e1}" }
              as: TransferCenterAgent
              captures: { r1: $.data.id }
            - call: "POST /bed-requests/${r1}/assign"
              payload: { bed_id: "${b1}" }
              as: BedControlCoordinator
          trigger:
            - call: "POST /bed-requests/${r1}/release"
              payload: {}
              as: BedControlCoordinator
          assert:
            - "BedRequest.${r1}.status == QUEUED"
            - "BedRequest.${r1}.assigned_bed_id == null"
            - "BedRequest.${r1}.match_score == null"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: discharge_cascade_depth3_bed_evstask_unit
        grounds:
          - state_machines.Encounter.DISCHARGE_ORDERED_to_DISCHARGED
          - state_machines.Bed.OCCUPIED_to_DIRTY
          - entities.EvsTask.fields.status
          - entities.Unit.fields.occupied_bed_count
        distinguishing_aspect: |
          Depth-3 cascade from DISCHARGE: Encounter→DISCHARGED (A) flips its Bed OCCUPIED→DIRTY (B);
          the Bed turning DIRTY (B) itself auto-creates an EvsTask in REQUESTED (C); each link is caused
          by the previous link, and the Unit's occupied_bed_count drops as a side branch of B.
        test_recipe:
          setup:
            - "ED encounter E1 PLACED in B1 (unit U1), discharge ordered, no open barriers, clock 2026-06-05T15:00Z."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-05T08:00:00Z" }
              as: FlowAdmin
            - call: "POST /units"
              payload: { name: "MS4", unit_type: "MEDSURG", gmlos_days: 3 }
              as: FlowAdmin
              captures: { u1: $.data.id }
            - call: "POST /units/${u1}/beds"
              payload: { unit_id: "${u1}", label: "D1", isolation_capable: false }
              as: ChargeNurse
              captures: { b1: $.data.id }
            - call: "POST /units/${u1}/beds/${b1}/mark-clean"
              payload: {}
              as: ChargeNurse
              captures: { b1_v: $.data.version }
            - call: "POST /encounters"
              payload: { mrn: "M500", sex: "MALE", origin: "ED" }
              as: BedControlCoordinator
              captures: { e1: $.data.id }
            - call: "POST /encounters/${e1}/admit-order"
              payload: {}
              as: BedControlCoordinator
            - call: "POST /bed-requests"
              payload: { encounter_id: "${e1}", preferred_unit_id: "${u1}" }
              as: TransferCenterAgent
              captures: { r1: $.data.id }
            - call: "POST /bed-requests/${r1}/assign"
              payload: { bed_id: "${b1}" }
              as: BedControlCoordinator
            - call: "POST /bed-requests/${r1}/confirm"
              payload: { expected_bed_version: "${b1_v}" }
              as: BedControlCoordinator
            - call: "POST /encounters/${e1}/discharge-order"
              payload: {}
              as: CaseManager
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-05T15:00:00Z" }
              as: FlowAdmin
          trigger:
            - call: "POST /encounters/${e1}/discharge"
              payload: {}
              as: CaseManager
            - call: "GET /units/${u1}/beds/${b1}"
              payload: {}
              as: ChargeNurse
            - call: "GET /evs-tasks"
              payload: { bed_id: "${b1}" }
              as: ChargeNurse
              captures: { task_status: "$.data[0].status", task_type: "$.data[0].task_type" }
            - call: "GET /units/${u1}"
              payload: {}
              as: BedControlCoordinator
          assert:
            - "Encounter.${e1}.status == DISCHARGED"
            - "Bed.${b1}.status == DIRTY"
            - "EvsTask for ${b1} exists with status == REQUESTED and task_type == ROUTINE"
            - "Unit.${u1}.occupied_bed_count == 0"

      - name: transfer_cascade_depth2_old_bed_evstask
        grounds:
          - state_machines.Encounter.PLACED_to_PLACED
          - state_machines.Bed.OCCUPIED_to_DIRTY
          - entities.EvsTask.fields.task_type
        distinguishing_aspect: |
          Depth-2 cascade from a DIFFERENT trigger (TRANSFER, not discharge): the transfer (A) flips the
          OLD bed OCCUPIED→DIRTY (B); that DIRTY transition (B) auto-creates an EvsTask of task_type
          ISOLATION because the transferred patient.requires_isolation == true — a distinct propagation
          pattern from the discharge cascade.
        test_recipe:
          setup:
            - "Isolation patient E1 PLACED in isolation bed B1 (unit U1); a second CLEAN isolation bed B2 exists."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-04T12:00:00Z" }
              as: FlowAdmin
            - call: "POST /units"
              payload: { name: "ICU2", unit_type: "ICU", gmlos_days: 5 }
              as: FlowAdmin
              captures: { u1: $.data.id }
            - call: "POST /units/${u1}/beds"
              payload: { unit_id: "${u1}", label: "I1", isolation_capable: true }
              as: ChargeNurse
              captures: { b1: $.data.id }
            - call: "POST /units/${u1}/beds/${b1}/mark-clean"
              payload: {}
              as: ChargeNurse
              captures: { b1_v: $.data.version }
            - call: "POST /units/${u1}/beds"
              payload: { unit_id: "${u1}", label: "I2", isolation_capable: true }
              as: ChargeNurse
              captures: { b2: $.data.id }
            - call: "POST /units/${u1}/beds/${b2}/mark-clean"
              payload: {}
              as: ChargeNurse
            - call: "POST /encounters"
              payload: { mrn: "M600", sex: "MALE", requires_isolation: true, origin: "DIRECT" }
              as: BedControlCoordinator
              captures: { e1: $.data.id }
            - call: "POST /encounters/${e1}/admit-order"
              payload: {}
              as: BedControlCoordinator
            - call: "POST /bed-requests"
              payload: { encounter_id: "${e1}" }
              as: BedControlCoordinator
              captures: { r1: $.data.id }
            - call: "POST /bed-requests/${r1}/assign"
              payload: { bed_id: "${b1}" }
              as: BedControlCoordinator
            - call: "POST /bed-requests/${r1}/confirm"
              payload: { expected_bed_version: "${b1_v}" }
              as: BedControlCoordinator
          trigger:
            - call: "POST /encounters/${e1}/transfer"
              payload: { target_bed_id: "${b2}" }
              as: BedControlCoordinator
            - call: "GET /evs-tasks"
              payload: { bed_id: "${b1}" }
              as: ChargeNurse
              captures: { t_type: "$.data[0].task_type", t_status: "$.data[0].status" }
          assert:
            - "Bed.${b1}.status == DIRTY"
            - "EvsTask for ${b1} exists with task_type == ISOLATION and status == REQUESTED"
            - "Encounter.${e1}.current_bed_id == ${b2}"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: isolation_safety_beats_bed_availability
        grounds:
          - validations[priority=10]
          - validations[priority=13]
          - errors[ERR_ISOLATION_REQUIRED]
          - errors[ERR_BED_NOT_AVAILABLE]
        distinguishing_aspect: |
          Error-category pair business_safety (priority 10, ERR_ISOLATION_REQUIRED) vs business_referential
          (priority 13, ERR_BED_NOT_AVAILABLE): a transfer targeting a NON-isolation bed that is also DIRTY
          violates both; the higher-priority isolation safety check wins → ERR_ISOLATION_REQUIRED.
        test_recipe:
          setup:
            - "Isolation patient E1 PLACED in iso bed B1 (U1); target bed B2 is non-isolation AND DIRTY."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-04T13:00:00Z" }
              as: FlowAdmin
            - call: "POST /units"
