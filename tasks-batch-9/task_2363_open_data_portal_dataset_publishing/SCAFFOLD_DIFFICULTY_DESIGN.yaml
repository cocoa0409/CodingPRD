            - call: "POST /open-data/privacy-assessments"
              payload: { dataset_id: "${ds_id}", declared_quasi_identifier_count: 5, declared_smallest_cell_size: 4, population_size: 60000 }
              as: PrivacyReviewer
              as_user_id: "pr-analyst-1"
              captures: { pa_id: "$.data.id" }
            - call: "PATCH /open-data/privacy-assessments/${pa_id}"
              payload: { verified_smallest_cell_size: 4 }
              as: PrivacyReviewer
              as_user_id: "pr-analyst-1"
            - call: "POST /open-data/privacy-assessments/${pa_id}/submit"
              as: PrivacyReviewer
              as_user_id: "pr-analyst-1"
          trigger:
            - call: "POST /open-data/privacy-assessments/${pa_id}/decide"
              payload: { decision: "CLEAR" }
              as: PrivacyReviewer
              as_user_id: "pr-chief-1"
            - call: "POST /open-data/privacy-assessments/${pa_id}/decide"
              payload: { decision: "BLOCK", block_reason: "RISK_TOO_HIGH" }
              as: PrivacyReviewer
              as_user_id: "pr-chief-1"
            - call: "POST /open-data/privacy-assessments/${pa_id}/reopen"
              as: PrivacyReviewer
              as_user_id: "pr-analyst-1"
            - call: "PATCH /open-data/privacy-assessments/${pa_id}"
              payload: { verified_smallest_cell_size: 12 }
              as: PrivacyReviewer
              as_user_id: "pr-analyst-1"
            - call: "POST /open-data/privacy-assessments/${pa_id}/submit"
              as: PrivacyReviewer
              as_user_id: "pr-analyst-1"
            - call: "POST /open-data/privacy-assessments/${pa_id}/decide"
              payload: { decision: "CLEAR" }
              as: PrivacyReviewer
              as_user_id: "pr-chief-1"
          assert:
            - "The first decide CLEAR returns 422 with error_id ERR_REIDENTIFICATION_RISK_TOO_HIGH and leaves status == SUBMITTED"
            - "PrivacyAssessment.${pa_id}.clearance_risk_score == 80.00 at that point (min(40, 8*5) * 2.0 * 1.00 * 1.0)"
            - "After the BLOCK: status == BLOCKED, block_reason == RISK_TOO_HIGH, decided_by_user_id == pr-chief-1"
            - "After the reopen: status == DRAFT, block_reason is null, clearance_risk_score is null and risk_score == 80.00 (the SCREENING figure)"
            - "After the second submit: clearance_risk_score == 20.00 (cell size 12 selects CELL_FACTOR_LOW 0.5) and aggregation_required == false"
            - "After the second CLEAR: status == CLEARED, min_aggregation_geography == BLOCK, decided_by_user_id == pr-chief-1"
            - "PrivacyAssessment.${pa_id}.version == 8 (create, patch, submit, block, reopen, patch, submit, clear — the failed CLEAR did not bump it)"

      - name: dataset_remediation_and_return_to_published_cycle
        grounds:
          - state_machines.Dataset.PUBLISHED_to_UNDER_REMEDIATION
          - state_machines.Dataset.UNDER_REMEDIATION_to_PUBLISHED
          - state_machines.PublicationPipeline.SUSPENDED_to_ARMED
          - state_machines.QualityIssue.ACCEPTED_to_CORRECTED
          - calculations.department_compliance_posture
        distinguishing_aspect: |
          publication_status leaves PUBLISHED for UNDER_REMEDIATION and comes back to PUBLISHED on the same
          row, and the department posture that hardened to RESTRICTED relaxes to OPEN only after the
          pipeline is resumed — the cycle restores every derived counter rather than latching them.
