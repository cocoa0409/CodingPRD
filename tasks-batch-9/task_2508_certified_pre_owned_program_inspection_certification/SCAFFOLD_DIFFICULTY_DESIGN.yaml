              as: ProgramAdministrator
              captures: { t1: $.data.id }
            - call: "POST /cpo/checklist-templates"
              payload: { code: "MPI-172", effective_from: "2026-01-01" }
              as: ProgramAdministrator
              captures: { tpl: $.data.id }
            - call: "POST /cpo/checklist-templates/${tpl}/items"
              payload: { item_code: "P1", category: "POWERTRAIN", severity: "CRITICAL", pass_criteria: "no engine or transmission fault codes", reconditioning_allowed: false }
              as: ProgramAdministrator
            - call: "POST /cpo/checklist-templates/${tpl}/publish"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /cpo/vehicles"
              payload: { vin: "1HGCM82633A000231", model_year: 2022, in_service_date: "2022-02-01", odometer_miles: 62000, title_brand: "CLEAN", prior_use: "PERSONAL", owner_count: 1 }
              as: DealerPrincipal
              as_user_id: "${d1}"
              captures: { v1: $.data.id }
            - call: "POST /cpo/inspections"
              payload: { vehicle_id: "${v1}", technician_id: "${t1}", template_id: "${tpl}", started_at: "2026-07-31T09:00:00Z", odometer_at_inspection: 62000 }
              as: DealerPrincipal
              as_user_id: "${d1}"
              captures: { i1: $.data.id }
            - call: "PUT /cpo/inspections/${i1}/results"
              payload: { results: [{ item_code: "P1", outcome: "PASS" }] }
              as: InspectionTechnician
              as_user_id: "${t1}"
            - call: "POST /cpo/inspections/${i1}/submit"
              payload: {}
              as: DealerPrincipal
              as_user_id: "${d1}"
            - call: "GET /cpo/vehicles/${v1}"
              payload: {}
              as: DealerPrincipal
              as_user_id: "${d1}"
              captures: { v1_ver_a: $.data.version }
            - call: "POST /cpo/certifications"
              payload: { vehicle_id: "${v1}", inspection_id: "${i1}", expected_vehicle_version: "${v1_ver_a}", documents: [{ doc_type: "TITLE_HISTORY_REPORT", reference: "THR-1" }, { doc_type: "INSPECTION_WORKSHEET", reference: "IW-1" }, { doc_type: "CUSTOMER_DISCLOSURE", reference: "CD-1" }] }
              as: DealerPrincipal
              as_user_id: "${d1}"
              captures: { c_first: $.data.id }
          trigger:
            - call: "POST /cpo/certifications"
              payload: { vehicle_id: "${v1}", inspection_id: "${i1}", expected_vehicle_version: "${v1_ver_a}", documents: [{ doc_type: "TITLE_HISTORY_REPORT", reference: "THR-1B" }, { doc_type: "INSPECTION_WORKSHEET", reference: "IW-1B" }, { doc_type: "CUSTOMER_DISCLOSURE", reference: "CD-1B" }] }
              as: DealerPrincipal
              as_user_id: "${d1}"
            - call: "GET /cpo/vehicles/${v1}"
              payload: {}
              as: DealerPrincipal
              as_user_id: "${d1}"
              captures: { v1_ver_b: $.data.version }
            - call: "POST /cpo/certifications"
              payload: { vehicle_id: "${v1}", inspection_id: "${i1}", expected_vehicle_version: "${v1_ver_b}", documents: [{ doc_type: "TITLE_HISTORY_REPORT", reference: "THR-2" }, { doc_type: "INSPECTION_WORKSHEET", reference: "IW-2" }, { doc_type: "CUSTOMER_DISCLOSURE", reference: "CD-2" }] }
              as: DealerPrincipal
              as_user_id: "${d1}"
              captures: { c_second: $.data.id }
            - call: "POST /cpo/certifications/${c_second}/approve"
              payload: { decision: "APPROVE" }
              as: ProgramAdministrator
          assert:
            - "before the trigger: Vehicle.${v1}.active_certification_count == 1 with Certification.${c_first}.status == SUBMITTED"
            - "trigger call 1 returns 412 ERR_STALE_VEHICLE_VERSION: the first submission already bumped the vehicle version, so a blind resubmission cannot supersede"
            - "after trigger call 1: Vehicle.${v1}.active_certification_count is still 1 and Certification.${c_first}.status is still SUBMITTED"
            - "trigger call 3 returns 201 with Certification.${c_second}.status == SUBMITTED and Certification.${c_first}.status == SUPERSEDED"
            - "after trigger call 3: Vehicle.${v1}.active_certification_count == 1 — the slot was handed over, never released"
            - "after trigger call 4: Certification.${c_second}.status == ACTIVE, Vehicle.${v1}.active_certification_count == 1, cpo_state == CERTIFIED and certified_certification_id == ${c_second}"
            - "Dealer.${d1}.lifetime_submitted_count == 2, lifetime_activated_count == 1, and the two certification_number values are distinct"
            - "Certification.${c_first}.activated_at is null and Dealer.${d1}.fee_billed_cents_total == 120400: the superseded row is never billed"
