  # ---------------------------------------------------------------------------
  # Rule 5 — priority_pair_validation_conflict (different error-category pairs)
  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: settle_state_error_beats_unresolved_disputes
        grounds:
          - validations[priority=5]
          - validations[priority=10]
          - state_machines.CommissionStatement.IN_RECONCILIATION_to_SETTLED
          - errors[ERR_INVALID_STATE_TRANSITION]
          - errors[ERR_UNRESOLVED_DISPUTES]
        distinguishing_aspect: |
          Category pair = state (p5) vs business_fiscal (p10). Settling a
          statement that is itself in DISPUTED status AND contains a DISPUTED
          line violates both ERR_INVALID_STATE_TRANSITION (settle only from
          IN_RECONCILIATION) and ERR_UNRESOLVED_DISPUTES; the state error wins.
        test_recipe:
          setup:
            - "BASE with O1 invoiced (58,000c expected)"
            - "statement 2026-08 with lines S1 PO-1 58,025 and S2 PO-GHOST 99,900; reconciliation run; S2 disputed -> statement DISPUTED with a DISPUTED line"
