              payload: { precinct_id: "${pr}", seal_number: "SEAL-TAB-1" }
              as: WarehouseCustodian
            - call: "POST /tabulator-units/${tab}/break-seal"
              payload: { reason: "Paper jam cleared under observation" }
              as: WarehouseCustodian
            - call: "POST /tabulator-units/${tab}/program"
              payload: { style_id: "${st}", firmware_version: "5.2.2" }
              as: VotingSystemTechnician
              as_user_id: "user-tech-1"
          assert:
            - "Before the trigger the unit reads (program_status PROGRAMMED, custody_status IN_VAULT) and TestDeck.${deck_a}.status == DRAFT with expected_total_marks == 1."
            - "Call 1 (start SESS-1) leaves the unit at (PROGRAMMED, IN_VAULT) and moves DECK-A to SEALED - starting a session touches neither state dimension of the unit."
            - "Call 2 (record-results reporting blank_count 0 against an expected 1) computes discrepancy_count == 1, so LATestSession.${sess1}.status == FAILED, TestDeck.${deck_a}.status == VOIDED, and the unit becomes (LA_FAILED, IN_VAULT) - the program axis moved while the custody axis did not."
