            - { call: "POST /consignment/pickups", payload: { item_id: "${item_prior}", concierge_id: "${c1}", vehicle_id: "${v1}", window_start: "2026-03-05T10:00:00Z", window_end: "2026-03-05T11:00:00Z" }, as: Seller, as_user_id: "${seller_id}" }
            - { call: "POST /consignment/items", payload: { seller_id: "${seller_id}", category: "HANDBAGS", brand: "Rare", title: "Grail", declared_value_cents: 6000000, intake_channel: "PICKUP" }, as: Seller, as_user_id: "${seller_id}", captures: { item_hi: "$.data.id" } }
          trigger:
            - { call: "POST /consignment/pickups", payload: { item_id: "${item_hi}", concierge_id: "${c1}", vehicle_id: "${v2}", window_start: "2026-03-05T10:30:00Z", window_end: "2026-03-05T11:30:00Z" }, as: Seller, as_user_id: "${seller_id}", captures: { err: "$.data.error_id" } }
