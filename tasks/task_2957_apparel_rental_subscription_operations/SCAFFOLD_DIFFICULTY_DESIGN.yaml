            - "the first restock returns HTTP 409 with error_id == ERR_OPEN_CLAIM_BLOCKS_RESTOCK while the claim is OPEN"
            - "after that refusal the job still reports state == PHOTOGRAPHED and the unit still reports availability_state == PROCESSING with condition_state == FLOOR_READY"
            - "the assessment moves the claim to ASSESSED with gross_fee_cents == 9000 and net_fee_cents == 9000"
            - "the second restock returns HTTP 409 with error_id == ERR_OPEN_CLAIM_BLOCKS_RESTOCK, so ASSESSED blocks exactly like OPEN"
            - "the charge moves the claim to CHARGED and leaves the member at outstanding_fee_cents == 9000 and status == ACTIVE, since 9000 is below DELINQUENCY_THRESHOLD_CENTS 15000"
            - "the third restock succeeds: the job reports state == RESTOCKED, the unit reports availability_state == IN_STOCK with turns_completed == 1 and cumulative_servicing_cost_cents == 5000 (REPAIR_COST_CENTS[MODERATE] 4200 plus PHOTOGRAPHY_COST_CENTS 800)"
            - "the reservation reports state == CLOSED with revenue_attributed_cents == 3333 and the style reports floor_ready_unit_count == 1"
      - name: resale_listing_requires_unit_in_retired_state
        grounds:
          - "1.4 validation priority 46 ERR_UNIT_NOT_RETIRED"
          - "1.4 validation priority 13 ERR_STALE_UNIT_VERSION on expected_rental_unit_version"
          - "1.2 RentalUnit availability IN_STOCK to RETIRED and 1.5 POST /rental-units/{unit_id}/retirement"
          - "1.5 POST /resale-listings"
          - "1.3 calculation resale_pricing with RESALE_RATE_BY_GRADE and CHANNEL_FEE_PCT"
        distinguishing_aspect: >-
          The entity pair is ResaleListing and RentalUnit: the listing request is complete and correctly versioned,
          and the only defect is the state of the referenced unit, which is still IN_STOCK. The same request body -
          with only the version refreshed, because retirement bumps RentalUnit.version - succeeds once the unit has
          been retired, and the created listing carries the priced figures derived from that unit's grade. An
          implementation that keys the check off retired_at being non-null, or that omits it, creates a listing for a
          rentable garment on the first call.
        test_recipe:
          setup:
            - "logical clock parked at 2026-08-03T09:00:00Z"
            - "style AUR-GOWN-01 with retail_price_cents 48000 and one grade-D size-M unit, created IN_STOCK and FLOOR_READY with turns_completed 0"
            - "the unit version is captured from the creation response so the first listing attempt passes the optimistic-concurrency check at priority 13 and is rejected purely on the unit state"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /styles"
              payload: { style_code: "AUR-GOWN-01", brand: "Aurelia", category: "GOWN", retail_price_cents: 48000, acquisition_cost_cents: 21000, size_run: ["S", "M", "L"], expected_rental_turns_per_unit: 12, planned_eol_value_cents: 9000, forecast_monthly_requests: 8, avg_rental_days: 6, planned_depth_units: 3 }
              as: InventoryPlanner
              captures: { style_gown_id: "$.data.id" }
            - call: "POST /styles/${style_gown_id}/rental-units"
              payload: { unit_code: "AUR-GOWN-01-M-006", size: "M", acquisition_cost_cents: 21000, condition_grade: "D" }
              as: InventoryPlanner
              captures: { unit1_id: "$.data.id" }
            - call: "GET /rental-units/${unit1_id}"
              payload: {}
              as: InventoryPlanner
              captures: { unit1_version: "$.data.version" }
          trigger:
            - call: "POST /resale-listings"
              payload: { rental_unit_id: "${unit1_id}", expected_rental_unit_version: "${unit1_version}", channel: "OUTLET" }
              as: InventoryPlanner
              captures: { listing_error_id: "$.data.error_id" }
            - call: "POST /rental-units/${unit1_id}/retirement"
              payload: { retirement_reason: "PLANNED_REFRESH" }
              as: InventoryPlanner
              captures: { unit1_version_2: "$.data.version" }
            - call: "POST /resale-listings"
              payload: { rental_unit_id: "${unit1_id}", expected_rental_unit_version: "${unit1_version_2}", channel: "OUTLET" }
              as: InventoryPlanner
              captures: { listing1_id: "$.data.id" }
          assert:
            - "the first listing attempt returns HTTP 409 with error_id == ERR_UNIT_NOT_RETIRED"
            - "the first attempt is NOT rejected with ERR_STALE_UNIT_VERSION, because the version was read immediately before the call"
            - "GET /resale-listings?rental_unit_id={unit_id} reports total_count == 0 after the refusal"
            - "the retirement returns availability_state == RETIRED with retirement_reason == PLANNED_REFRESH, retired_at == 2026-08-03T09:00:00Z and a version one higher than before"
            - "the second listing attempt succeeds with state == LISTED, markdown_step == 0, base_price_cents == 3840 (48000 times RESALE_RATE_BY_GRADE[D] 0.08) and list_price_cents == 3840"
            - "the created listing reports channel_fee_cents == 192 (round_half_up(3840 * CHANNEL_FEE_PCT[OUTLET][LOW] 0.05)), net_recovery_cents == 3248 and floor_adjusted == false"
            - "the listing reports listed_at == 2026-08-03T09:00:00Z and supersedes_listing_id == null"
      - name: quarantine_clearance_requires_repair_certified_technician
        grounds:
          - "1.4 validation priority 26 ERR_TECHNICIAN_NOT_CERTIFIED"
          - "1.2 RentalUnit condition QUARANTINED to NEEDS_CLEANING precondition on the acting technician"
          - "1.5 POST /reverse-logistics-jobs/{job_id}/quarantine-clearance"
          - "1.1 Technician.repair_certified and photography_certified"
          - "1.1 RentalUnit.quarantine_hold"
        distinguishing_aspect: >-
          The entity pair is ReverseLogisticsJob and Technician: the job and the unit are in exactly the right states
          for a clearance, and the request differs only in which technician the X-User-ID header names. T-QC-3 is
          ACTIVE and photography_certified but not repair_certified, so the clearance is refused with
          ERR_TECHNICIAN_NOT_CERTIFIED rather than with a state error, and the identical call by a repair-certified
          technician clears the hold. An implementation that only checks technician.status ACTIVE, or that reads
          photography_certified here, clears the biohazard hold with an uncertified signer.
        test_recipe:
