          setup:
            - "Clock at default 2026-05-01T00:00:00Z; three CONNECTED NAP-matched listings -> listing_health_score 100.00."
            - "Four ingested reviews with ratings 4,4,4,3 -> avg_rating 3.75 -> reputation_score_provisional exactly 60.00 -> posture OPEN."
            - "An EMAIL campaign (credits_allocated 10, daily_send_cap 10) is RUNNING with two QUEUED requests, so credits_reserved == 2."
