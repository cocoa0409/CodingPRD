          assert:
            - "First pass: HealthVisit.${visit_id}.disposition == RETURN_TO_CLASS and HealthVisit.${visit_id}.guardian_notified == false"
            - "First pass: HealthVisit.${visit_id}.minutes_in_office == 30 and HealthVisit.${visit_id}.triage_score == 28"
            - "After reopen: HealthVisit.${visit_id}.status == REOPENED"
