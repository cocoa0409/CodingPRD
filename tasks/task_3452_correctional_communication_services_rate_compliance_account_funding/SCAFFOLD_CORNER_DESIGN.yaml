            - "403 err == ERR_NOT_RESOURCE_OWNER (holder of ${acct_a} acting on ${acct_b})"
            - "Account.${acct_b}.balance_cents == 0 (no ledger entry)"
            - "control: the same deposit with as_user_id == ${acct_b} succeeds"

  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: layer_optimistic_concurrency_covered_by_occ_corners
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[rate-schedule-activate-stale-contract]
          - concurrency_rules[regulatory-cap-amend-stale]
        excluded_because:
          difficulty_instance: boundary_precision_check / schedule_rate_exactly_at_cap_activates_one_cent_over_fails
          rationale: "Partially exercised there (version bump after activation is asserted); the full stale-version rejection paths for both OCC rules are exercised by this file's own errors-section instances stale_contract_version_on_schedule_activate_returns_412 and stale_cap_version_on_amend_returns_412, which carry complete recipes."

      - name: layer_cascading_side_effects_covered_by_release_cascade
        claim_type: cascading_side_effects
        grounds:
          - state_machines.Inmate.IN_CUSTODY_to_RELEASED
        excluded_because:
          difficulty_instance: transitive_cascade / inmate_release_cascade_orders_refunds_before_closure_snapshot
          rationale: "The N-level cascade (release -> session cancel -> ledger refund -> account auto-close) is asserted end-to-end with pinned ordering in the named §1.8 instance."

      - name: layer_dual_variant_calculation_covered_by_rule_1
        claim_type: dual_variant_calculation
        grounds:
          - calculations.site_commission_accrual
          - calculations.refund_payout
        excluded_because:
          difficulty_instance: dual_variant_calc / commission_gross_vs_net_basis_diverge_on_identical_ledger
          rationale: "Both variant pairs (GROSS/NET on contracts, SIMPLE_BALANCE/LIFO_NET on refunds) are asserted with computed literals in the two §1.8 rule-1 instances."

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_consistency_write_response_matches_followup_read
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
        distinguishing_aspect: "The consistency model is immediate: the balance shown in a deposit's own 201 response equals what GET /accounts/{id} returns right after, and the version the create response hands out is the version the follow-up read reports — no reconciliation lag."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Base ACTIVE facility/contract (deposit fee 25)/schedule; inmate; PREPAID account."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /comm-services/regulatory-caps"
              payload: { state_code: "ST", max_per_minute_cents: 25, max_connection_fee_cents: 300, max_ancillary_fee_cents: 500, max_deposit_fee_cents: 500, max_commission_pct: 0.6, refund_method: "SIMPLE_BALANCE", dormancy_days: 30, claim_window_days: 45 }
              as: StateRegulator
            - call: "POST /comm-services/facilities"
              payload: { name: "Consistent Facility", state_code: "ST", video_booth_count: 2, max_session_minutes: 30, visiting_open_minutes: 480, visiting_close_minutes: 1200 }
              as: PlatformAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /comm-services/contracts"
              payload: { facility_id: "${fac_id}", commission_pct: 0.5, commission_basis: "GROSS", deposit_fee_cents: 25, closure_fee_cents: 100, effective_from: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { c_id: $.data.id, c_v: $.data.version }
            - call: "POST /comm-services/contracts/${c_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /comm-services/contracts/${c_id}/rate-schedules"
              payload: { local_per_minute_cents: 18, intrastate_per_minute_cents: 21, interstate_per_minute_cents: 25, international_per_minute_cents: 25, connection_fee_cents: 200, message_price_cents: 15, video_session_fee_cents: 500 }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /comm-services/rate-schedules/${s_id}/activate"
              payload: { expected_contract_version: "${c_v}" }
              as: PlatformAdmin
            - call: "POST /comm-services/facilities/${fac_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /comm-services/inmates"
              payload: { facility_id: "${fac_id}", booking_number: "B-9501", full_name: "Inmate Consistent" }
              as: FacilityStaff
              captures: { inm_id: $.data.id }
            - call: "POST /comm-services/accounts"
              payload: { facility_id: "${fac_id}", inmate_id: "${inm_id}", funding_model: "PREPAID", owner_name: "Fam Cons", owner_contact: "fco@x.com" }
              as: FacilityStaff
              captures: { acct_id: $.data.id, v0: $.data.version }
          trigger:
            - call: "POST /comm-services/accounts/${acct_id}/deposits"
              payload: { amount_cents: 1025 }
              as: AccountHolder
              as_user_id: "${acct_id}"
              captures: { bal_in_response: $.data.balance_cents, v1: $.data.version }
            - call: "GET /comm-services/accounts/${acct_id}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { bal_read: $.data.balance_cents, v_read: $.data.version }
          assert:
            - "bal_in_response == 1000 and bal_read == 1000 (no lag between write response and read)"
            - "v1 == v0 + 1 and v_read == v1 (every mutation increments version by exactly one)"
            - "updated_at on the read is >= created_at and reflects the deposit mutation"
