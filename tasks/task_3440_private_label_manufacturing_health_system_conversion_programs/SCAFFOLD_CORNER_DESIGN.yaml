              payload: { facility_id: "${fac_id}", gpo_name: "GPO-A", period_start: "2026-01-01", period_end: "2026-03-31", eligible_purchase_cents: 1000000, private_label_share: 0.0, compliant: true }
              as: GPOAnalyst
              captures: { c1: $.data.provisional_amount_cents }
            - call: "POST /supply/rebate-claims"
              payload: { facility_id: "${fac_id}", gpo_name: "GPO-A", period_start: "2026-04-01", period_end: "2026-06-30", eligible_purchase_cents: 999999, private_label_share: 0.0, compliant: true }
