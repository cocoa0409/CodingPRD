          setup:
            - "BH1 (BIRTH_HOSPITAL, R1, budget 40) with screener S1; AC1 (AUDIOLOGY_CLINIC, R1) with navigator N1 whose max_open_tasks is 1 and navigator N2 at the default 5; one INPATIENT infant; one OUTREACH_CALL task already OPEN on N1 (2 units debited). Clock 2026-08-01T06:00:00Z."
