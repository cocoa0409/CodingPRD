# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN.yaml — §1.8 Test Targeting Index
# task_1302_neighborhood_pet_sitting_cooperative
# Derived exclusively from SCAFFOLD.yaml (§1.1–§1.7); every grounds reference
# resolves to a declared element there. Difficulty posture: beyond-expert —
# 28 instances across the 9 rules, deepest reachable dependency chains.
#
# PINNED READING (documented scaffold-tension resolution, applied uniformly in
# every setup chain below and mirrored in SCAFFOLD_CORNER_DESIGN.yaml):
# §1.2 MemberReference.accept requires referee_member_id VETTED, while
# Member.finalize-vetting requires each ACCEPTED reference's reciprocal row
# (applicant vouching back for the referee) to also be ACCEPTED. Under the
# strictest letter no first VETTED member is reachable from an empty DB.
# All chains therefore adopt the co-op's intended mutual-vouch reading:
#   (i)  a founding clique of three applicants vouches for each other and all
#        six mutual references are accepted as founding pairs;
#   (ii) for later applicants, primary references name VETTED referees (strict
#        letter holds there) and the reciprocal rows (applicant vouching back)
#        are accepted as mutual-confirmation rows;
#   (iii) ERR_REFEREE_NOT_VETTED still fires for a referee that is not VETTED
#        and not part of a mutual vouch pair (corner file tests this with a
#        SUSPENDED referee, which replays cleanly under any reading).
# Default logical clock is 2026-08-01T00:00:00Z per the §1.5 clock endpoint;
# chains set the clock explicitly wherever time matters.
# YAML anchors defined on first use are reused by later instances in this file;
# every instance is replayable standalone from empty-DB (captures re-bind per
# instance because each test replays the whole chain).
# =============================================================================

scaffold_difficulty_design:
  # ===========================================================================
  # Rule 1 — dual_variant_calc (2 instances, different entity domains)
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: settlement_provisional_vs_final_early_departure_divergence
        grounds:
          - calculations.sitting_credit_settlement
          - calculations.credit_hours_offered
          - state_machines.SittingAssignment.transitions.COMPLETED_PENDING_REVIEW_to_SETTLED
          - entities.SittingAssignment.fields.credit_hours_settled
          - entities.Member.fields.provisional_credit_hours
        distinguishing_aspect: |
          Entity domain: SittingAssignment credit settlement. The provisional variant
          (claim acceptance) credits request.credit_hours_offered = 4.00 while the final
          variant (settle) prorates actual_hours x demand_mult x 0.5 because
          early_fraction = 1.5/4.0 = 0.375 > 0.25, yielding 1.25 — the two valid
          readings of the same sitting diverge by exactly 2.75 hours.
        test_recipe:
          setup:
            - "Founders F1/F2/F3 mutually vouched and VETTED (credit_balance_hours 10.00 each, reliability_score 50); F3 has mediator_flag=true"
            - "F1 owns active waiver-accepted pet; canonical request 2026-09-10T10:00:00Z-2026-09-10T14:00:00Z with no holiday window -> credit_hours_offered == 4.00"
            - "F2's claim accepted (F2.provisional_credit_hours == 4.00); sit completed with actual 2.5h (CHECK_IN occurred_at 10:00, checkout at clock 12:30)"
          setup_api_calls:
            - &mk_f1
              call: "POST /coop/members"
              payload: { display_name: "Founder One", email: "f1@coop.test", address_block: "MAPLE-100", phone: "+15550101" }
              as: Anonymous
              captures: { f1_id: $.data.id }
            - &mk_f2
              call: "POST /coop/members"
              payload: { display_name: "Founder Two", email: "f2@coop.test", address_block: "MAPLE-100", phone: "+15550102" }
              as: Anonymous
              captures: { f2_id: $.data.id }
            - &mk_f3
              call: "POST /coop/members"
              payload: { display_name: "Founder Three", email: "f3@coop.test", address_block: "MAPLE-100", phone: "+15550103", mediator_flag: true }
              as: Anonymous
              captures: { f3_id: $.data.id }
            - &ref_f1f2
              call: "POST /coop/members/${f1_id}/references"
              payload: { referee_member_id: "${f2_id}", relationship_years: 5, attestation_text: "Known neighbor for five years." }
              as: CoopAdmin
              captures: { ref_f1f2: $.data.id }
            - &ref_f1f3
              call: "POST /coop/members/${f1_id}/references"
              payload: { referee_member_id: "${f3_id}", relationship_years: 4, attestation_text: "Known neighbor for four years." }
              as: CoopAdmin
              captures: { ref_f1f3: $.data.id }
            - &ref_f2f1
              call: "POST /coop/members/${f2_id}/references"
              payload: { referee_member_id: "${f1_id}", relationship_years: 5, attestation_text: "Known neighbor for five years." }
              as: CoopAdmin
              captures: { ref_f2f1: $.data.id }
            - &ref_f2f3
              call: "POST /coop/members/${f2_id}/references"
              payload: { referee_member_id: "${f3_id}", relationship_years: 3, attestation_text: "Known neighbor for three years." }
              as: CoopAdmin
              captures: { ref_f2f3: $.data.id }
            - &ref_f3f1
              call: "POST /coop/members/${f3_id}/references"
              payload: { referee_member_id: "${f1_id}", relationship_years: 4, attestation_text: "Known neighbor for four years." }
              as: CoopAdmin
              captures: { ref_f3f1: $.data.id }
            - &ref_f3f2
              call: "POST /coop/members/${f3_id}/references"
              payload: { referee_member_id: "${f2_id}", relationship_years: 3, attestation_text: "Known neighbor for three years." }
              as: CoopAdmin
              captures: { ref_f3f2: $.data.id }
            - &liab_f1
              call: "POST /coop/members/${f1_id}/accept-liability"
              payload: {}
              as: Member
              as_user_id: "${f1_id}"
            - &liab_f2
              call: "POST /coop/members/${f2_id}/accept-liability"
              payload: {}
              as: Member
              as_user_id: "${f2_id}"
            - &liab_f3
              call: "POST /coop/members/${f3_id}/accept-liability"
              payload: {}
              as: Member
              as_user_id: "${f3_id}"
            - &sub_f1
              call: "POST /coop/members/${f1_id}/submit-references"
              payload: {}
              as: CoopAdmin
            - &sub_f2
              call: "POST /coop/members/${f2_id}/submit-references"
              payload: {}
              as: CoopAdmin
            - &sub_f3
              call: "POST /coop/members/${f3_id}/submit-references"
              payload: {}
              as: CoopAdmin
            - &acc_f1f2
              call: "POST /coop/member-references/${ref_f1f2}/accept"
              payload: {}
              as: CoopAdmin
            - &acc_f1f3
              call: "POST /coop/member-references/${ref_f1f3}/accept"
              payload: {}
              as: CoopAdmin
            - &acc_f2f1
              call: "POST /coop/member-references/${ref_f2f1}/accept"
              payload: {}
              as: CoopAdmin
            - &acc_f2f3
              call: "POST /coop/member-references/${ref_f2f3}/accept"
              payload: {}
              as: CoopAdmin
            - &acc_f3f1
              call: "POST /coop/member-references/${ref_f3f1}/accept"
              payload: {}
              as: CoopAdmin
            - &acc_f3f2
              call: "POST /coop/member-references/${ref_f3f2}/accept"
              payload: {}
              as: CoopAdmin
            - &fin_f1
              call: "POST /coop/members/${f1_id}/finalize-vetting"
              payload: {}
              as: CoopAdmin
            - &fin_f2
              call: "POST /coop/members/${f2_id}/finalize-vetting"
              payload: {}
              as: CoopAdmin
            - &fin_f3
              call: "POST /coop/members/${f3_id}/finalize-vetting"
              payload: {}
              as: CoopAdmin
            - &pet_f1
              call: "POST /coop/members/${f1_id}/pet-profiles"
              payload: { pet_name: "Biscuit", species: "DOG", routine_notes: "Feed twice daily, walk morning.", medical_notes: "No medications.", emergency_vet_name: "Maple Vet Clinic", emergency_vet_phone: "+15550911", emergency_vet_address: "12 Maple St", liability_waiver_accepted: true }
              as: Member
              as_user_id: "${f1_id}"
              captures: { pet1_id: $.data.id }
            - &req_a
              call: "POST /coop/sitting-requests"
              payload: { pet_profile_id: "${pet1_id}", start_at: "2026-09-10T10:00:00Z", end_at: "2026-09-10T14:00:00Z", instructions: "Canonical 4h sit" }
              as: Member
              as_user_id: "${f1_id}"
              captures: { req_id: $.data.id, req_v: $.data.version }
            - &claim_f2
              call: "POST /coop/sitting-requests/${req_id}/claims"
              payload: { message: "Happy to sit Biscuit" }
              as: Member
              as_user_id: "${f2_id}"
              captures: { claim_id: $.data.id }
            - &accept_a
              call: "POST /coop/sitting-requests/${req_id}/claims/${claim_id}/accept"
              payload: { expected_sitting_request_version: "${req_v}" }
              as: Member
              as_user_id: "${f1_id}"
            - &get_asg
              call: "GET /coop/sitting-requests/${req_id}/assignment"
              as: CoopAdmin
              captures: { asg_id: "$.data[0].id" }
            - &get_ho
              call: "GET /coop/sitting-assignments/${asg_id}/access-handoff"
              as: CoopAdmin
              captures: { ho_id: "$.data[0].id" }
            - &clock_0830
              call: "POST /coop/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T08:30:00Z" }
              as: CoopAdmin
            - &confirm_ho
              call: "POST /coop/access-handoffs/${ho_id}/confirm-handoff"
              payload: {}
              as: Member
              as_user_id: "${f1_id}"
            - &clock_1000
              call: "POST /coop/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T10:00:00Z" }
              as: CoopAdmin
            - &checkin_1000
              call: "POST /coop/sitting-assignments/${asg_id}/entry-logs"
              payload: { event_type: "CHECK_IN", occurred_at: "2026-09-10T10:00:00Z" }
              as: Member
              as_user_id: "${f2_id}"
            - call: "POST /coop/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T12:30:00Z" }
              as: CoopAdmin
            - call: "POST /coop/sitting-assignments/${asg_id}/checkout"
              payload: {}
              as: Member
              as_user_id: "${f2_id}"
          trigger:
            - call: "POST /coop/sitting-assignments/${asg_id}/settle"
              payload: {}
              as: CoopAdmin
              captures: { settled_hours: $.data.credit_hours_settled, asg_status: $.data.status }
          assert:
            - "SittingAssignment.${asg_id}.credit_hours_settled == 1.25 (final variant: 2.5 actual_hours x 1.0 x 0.5)"
            - "provisional variant booked 4.00 at accept (Member.${f2_id}.provisional_credit_hours was 4.00 before settle, == 0.00 after) — variants diverge by 2.75"
            - "Member.${f2_id}.credit_balance_hours == 11.25 (10.00 grant + 1.25 SIT_EARNED), NOT 14.00"
            - "Member.${f1_id}.credit_balance_hours == 8.75 (10.00 - 1.25 SIT_SPENT)"
            - "Member.${f2_id}.reliability_score == 52"
            - "SittingAssignment.${asg_id}.status == SETTLED"

      - name: reliability_eventwise_clamp_vs_recompute_divergence
        grounds:
          - calculations.reliability_score_recompute
          - state_machines.Incident.transitions.UNDER_REVIEW_to_RESOLVED_AT_FAULT
          - entities.Member.fields.reliability_score
        distinguishing_aspect: |
          Entity domain: Member risk scoring (distinct from instance 1's
          SittingAssignment credit settlement). Event-wise update with clamp applied
          at EACH event yields 50-15-15-15-15 -> clamped 0, then +2 == 2; the
          alternative recompute-from-scratch reading with a single terminal clamp
          yields 50-60+2 = -8 -> 0. Scaffold pins event-wise clamping, so the
          observable score is 2, not 0.
        test_recipe:
          setup:
            - "Founders F1/F2/F3 VETTED as in the canonical bootstrap"
            - "F2 sits F1's canonical 4h request (assignment CONFIRMED, provisional 4.00)"
            - "Four incidents on that assignment are each resolved AT_FAULT against F2 while the assignment is still CONFIRMED (no ledger penalties: assignment not SETTLED)"
            - "Sit then completed at full duration (checkout at 14:00) and settled"
          setup_api_calls:
            - *mk_f1
            - *mk_f2
            - *mk_f3
            - *ref_f1f2
            - *ref_f1f3
            - *ref_f2f1
            - *ref_f2f3
            - *ref_f3f1
            - *ref_f3f2
            - *liab_f1
            - *liab_f2
            - *liab_f3
            - *sub_f1
            - *sub_f2
            - *sub_f3
            - *acc_f1f2
            - *acc_f1f3
            - *acc_f2f1
            - *acc_f2f3
            - *acc_f3f1
            - *acc_f3f2
            - *fin_f1
            - *fin_f2
            - *fin_f3
            - *pet_f1
            - *req_a
            - *claim_f2
            - *accept_a
            - *get_asg
            - call: "POST /coop/sitting-assignments/${asg_id}/incidents"
              payload: { severity: "MINOR", description: "Pet escaped yard during sitting visit.", vet_involved: false }
              as: Member
              as_user_id: "${f1_id}"
              captures: { inc1_id: $.data.id }
            - call: "POST /coop/incidents/${inc1_id}/begin-review"
              payload: {}
              as: CoopAdmin
            - call: "POST /coop/incidents/${inc1_id}/resolve"
              payload: { outcome: "AT_FAULT", at_fault_member_id: "${f2_id}" }
              as: CoopAdmin
            - call: "POST /coop/sitting-assignments/${asg_id}/incidents"
              payload: { severity: "MINOR", description: "Gate left open, pet wandered off." , vet_involved: false }
              as: Member
              as_user_id: "${f1_id}"
              captures: { inc2_id: $.data.id }
            - call: "POST /coop/incidents/${inc2_id}/begin-review"
              payload: {}
              as: CoopAdmin
            - call: "POST /coop/incidents/${inc2_id}/resolve"
              payload: { outcome: "AT_FAULT", at_fault_member_id: "${f2_id}" }
              as: CoopAdmin
            - call: "POST /coop/sitting-assignments/${asg_id}/incidents"
              payload: { severity: "MAJOR", description: "Wrong food served despite allergy note.", vet_involved: false }
              as: Member
              as_user_id: "${f1_id}"
              captures: { inc3_id: $.data.id }
            - call: "POST /coop/incidents/${inc3_id}/begin-review"
              payload: {}
              as: CoopAdmin
            - call: "POST /coop/incidents/${inc3_id}/resolve"
              payload: { outcome: "AT_FAULT", at_fault_member_id: "${f2_id}" }
              as: CoopAdmin
            - call: "POST /coop/sitting-assignments/${asg_id}/incidents"
              payload: { severity: "MAJOR", description: "Missed evening medication dose entirely.", vet_involved: true }
              as: Member
              as_user_id: "${f1_id}"
              captures: { inc4_id: $.data.id }
            - call: "POST /coop/incidents/${inc4_id}/begin-review"
              payload: {}
              as: CoopAdmin
            - call: "POST /coop/incidents/${inc4_id}/resolve"
              payload: { outcome: "AT_FAULT", at_fault_member_id: "${f2_id}" }
              as: CoopAdmin
            - *get_ho
            - *clock_0830
            - *confirm_ho
            - *clock_1000
            - *checkin_1000
            - call: "POST /coop/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T14:00:00Z" }
              as: CoopAdmin
            - call: "POST /coop/sitting-assignments/${asg_id}/checkout"
              payload: {}
              as: Member
              as_user_id: "${f2_id}"
          trigger:
            - call: "POST /coop/sitting-assignments/${asg_id}/settle"
              payload: {}
              as: CoopAdmin
          assert:
            - "Member.${f2_id}.reliability_score == 2 (event-wise clamp: 50->35->20->5->0, then +2; recompute-with-terminal-clamp would give 0 — the two readings diverge)"
            - "Member.${f2_id}.credit_balance_hours == 14.00 (10.00 grant + 4.00 SIT_EARNED; no INCIDENT_PENALTY entries because assignment was not SETTLED at any resolve time)"
            - "SittingAssignment.${asg_id}.status == SETTLED and credit_hours_settled == 4.00 (full sit, early_fraction == 0)"
            - "All four incidents terminal RESOLVED_AT_FAULT so settle is not blocked by ERR_UNRESOLVED_INCIDENT"

  # ===========================================================================
  # Rule 2 — combinatorial_formula (3 instances, modes (a), (b), (c))
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: credit_hours_offered_max_window_no_compounding
        grounds:
          - calculations.credit_hours_offered
          - entities.HolidayWindow.fields.demand_multiplier
          - entities.HolidayWindow.fields.enabled
          - entities.SittingRequest.fields.credit_hours_offered
        distinguishing_aspect: |
          Mode (a): >=3 inputs with non-linear interaction — duration_hours, the SET of
          intersecting enabled windows (W1 2.0, W2 3.0, W3 2.5-disabled), and the
          enabled flag; the formula takes max(applicable) with no compounding, so the
          result is 4.0 x 3.0 == 12.00, not 24.00 (compounded), not 10.00 (disabled W3
          included), not 8.00 (lowest multiplier).
        test_recipe:
          setup:
            - "Founders F1/F2/F3 VETTED (canonical bootstrap); F1 owns pet"
            - "W1 [2026-12-24T00:00:00Z, 2026-12-26T00:00:00Z) mult 2.0 enabled; W2 [2026-12-25T00:00:00Z, 2026-12-27T00:00:00Z) mult 3.0 enabled; W3 [2026-12-25T00:00:00Z, 2026-12-27T00:00:00Z) mult 2.5 DISABLED at creation"
            - "Sitting interval 2026-12-25T10:00:00Z + 4h intersects W1, W2, W3"
          setup_api_calls:
            - *mk_f1
            - *mk_f2
            - *mk_f3
            - *ref_f1f2
            - *ref_f1f3
            - *ref_f2f1
            - *ref_f2f3
            - *ref_f3f1
            - *ref_f3f2
            - *liab_f1
            - *liab_f2
            - *liab_f3
            - *sub_f1
            - *sub_f2
            - *sub_f3
            - *acc_f1f2
            - *acc_f1f3
            - *acc_f2f1
            - *acc_f2f3
            - *acc_f3f1
            - *acc_f3f2
            - *fin_f1
            - *fin_f2
            - *fin_f3
            - *pet_f1
            - call: "POST /coop/holiday-windows"
              payload: { name: "W1", window_start: "2026-12-24T00:00:00Z", window_end: "2026-12-26T00:00:00Z", demand_multiplier: 2.0 }
              as: CoopAdmin
            - call: "POST /coop/holiday-windows"
              payload: { name: "W2", window_start: "2026-12-25T00:00:00Z", window_end: "2026-12-27T00:00:00Z", demand_multiplier: 3.0 }
              as: CoopAdmin
            - call: "POST /coop/holiday-windows"
              payload: { name: "W3", window_start: "2026-12-25T00:00:00Z", window_end: "2026-12-27T00:00:00Z", demand_multiplier: 2.5, enabled: false }
              as: CoopAdmin
          trigger:
            - call: "POST /coop/sitting-requests"
              payload: { pet_profile_id: "${pet1_id}", start_at: "2026-12-25T10:00:00Z", end_at: "2026-12-25T14:00:00Z", instructions: "Multi-window sit" }
              as: Member
              as_user_id: "${f1_id}"
              captures: { offered: $.data.credit_hours_offered }
          assert:
            - "SittingRequest.credit_hours_offered == 12.00 (max(2.0, 3.0) over enabled intersecting windows; no compounding)"
            - "SittingRequest.status == OPEN and expires_at == 2026-12-25T06:00:00Z (start_at - 4h)"
            - "response.status == 201 (fiscal check passes: 10.00 - 12.00 == -2.00 >= -5.00)"

      - name: late_cancel_penalty_nested_rounding_order
        grounds:
          - calculations.late_cancel_penalty
          - calculations.credit_hours_offered
          - state_machines.SittingRequest.transitions.ASSIGNED_to_CANCELLED
          - entities.CreditLedgerEntry.fields.delta_hours
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters — the penalty is computed from
          the LOCKED, already-rounded credit_hours_offered: round_half_up(3.38 x 0.25)
          == 0.85, whereas rounding only at the end would give
          round_half_up(2.25 x 1.5 x 0.25) == round_half_up(0.84375) == 0.84. The
          scaffold pins "round at posting, then round again from the locked value",
          so 0.85 is the only correct answer.
        test_recipe:
          setup:
            - "Founders VETTED; F1 owns pet; holiday window [2026-11-26T00:00:00Z, 2026-11-28T00:00:00Z) mult 1.5 enabled"
            - "Request 2026-11-26T10:00:00Z-12:15:00Z (2.25h) -> offered round_half_up(3.375) == 3.38; F2 claim accepted (provisional 3.38)"
            - "Clock set to 2026-11-25T11:00:00Z — exactly 23h before scheduled start (inside the 24h late window)"
          setup_api_calls:
            - *mk_f1
            - *mk_f2
            - *mk_f3
            - *ref_f1f2
            - *ref_f1f3
            - *ref_f2f1
            - *ref_f2f3
            - *ref_f3f1
            - *ref_f3f2
            - *liab_f1
            - *liab_f2
            - *liab_f3
            - *sub_f1
            - *sub_f2
            - *sub_f3
            - *acc_f1f2
            - *acc_f1f3
            - *acc_f2f1
            - *acc_f2f3
            - *acc_f3f1
            - *acc_f3f2
            - *fin_f1
            - *fin_f2
            - *fin_f3
            - *pet_f1
            - call: "POST /coop/holiday-windows"
              payload: { name: "TGiving", window_start: "2026-11-26T00:00:00Z", window_end: "2026-11-28T00:00:00Z", demand_multiplier: 1.5 }
              as: CoopAdmin
            - call: "POST /coop/sitting-requests"
              payload: { pet_profile_id: "${pet1_id}", start_at: "2026-11-26T10:00:00Z", end_at: "2026-11-26T12:15:00Z", instructions: "Nested rounding sit" }
              as: Member
              as_user_id: "${f1_id}"
              captures: { req_id: $.data.id, req_v: $.data.version }
            - *claim_f2
            - *accept_a
            - *get_asg
            - call: "POST /coop/_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-25T11:00:00Z" }
              as: CoopAdmin
          trigger:
            - call: "POST /coop/sitting-requests/${req_id}/cancel"
              payload: { cancelled_reason: "Sitter emergency" }
              as: Member
              as_user_id: "${f2_id}"
          assert:
            - "CreditLedgerEntry for Member.${f2_id} contains CANCELLATION_PENALTY delta_hours == -0.85 (NOT -0.84 — penalty rounds the locked offered 3.38)"
            - "Member.${f2_id}.credit_balance_hours == 9.15 (10.00 - 0.85)"
            - "Member.${f2_id}.reliability_score == 42 (50 - 8 late-cancel)"
            - "Member.${f2_id}.provisional_credit_hours == 0.00 (provisional 3.38 reversed)"
            - "SittingAssignment.${asg_id}.status == CANCELLED_BY_SITTER and SittingRequest.${req_id}.status == CANCELLED"

