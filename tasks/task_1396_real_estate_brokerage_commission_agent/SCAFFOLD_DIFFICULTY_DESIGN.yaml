  # ------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: unsettle_blocked_by_authorized_leg
        grounds:
          - state_machines.Deal.SETTLED_to_CLOSED
          - validations[priority=15]
          - errors[ERR_LEGS_OUTSTANDING]
        distinguishing_aspect: |
          Entity pair Settlement/Deal <- DisbursementLeg: the Deal's
          SETTLED->CLOSED transition is gated by the state of the settlement's
          legs — a single AUTHORIZED leg blocks unsettle with
          ERR_LEGS_OUTSTANDING.
        test_recipe:
          setup:
            - "Settled deal; its ROYALTY leg authorized by om-1 (poster was tc-1)"
          setup_api_calls:
            - call: "POST /brokerage/agents"
              payload: { full_name: "Block Bob", email: "bob@x.com", license_number: "LIC-BL1", joined_at: "2025-09-01" }
