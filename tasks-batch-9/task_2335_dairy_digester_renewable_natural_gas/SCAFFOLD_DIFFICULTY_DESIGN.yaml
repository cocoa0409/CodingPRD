            - "One operations day 2026-08-03 with a single ACCEPTED 150.000 t delivery, closed with 196000.000 scf of raw biogas at 62.0 percent methane."
            - "First conditioning pass reports 6.0 ppm hydrogen sulfide, which fails the interconnect specification; the second pass reports 3.5 ppm and passes."
