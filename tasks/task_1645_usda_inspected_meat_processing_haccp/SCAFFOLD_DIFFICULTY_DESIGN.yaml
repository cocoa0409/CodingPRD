          - state_machines.CarcassLot.FABRICATED_to_HELD
          - state_machines.FinishedLot.PRODUCED_to_QUARANTINED
        distinguishing_aspect: |
          Depth-3 cascade originating from report-result: sample POSITIVE -> lot HELD
          (link 1) -> PRODUCED finished lots of that source lot QUARANTINED (link 2,
          caused by the lot's HELD transition) -> owning ProductionDay.posture becomes
          RESTRICTED (link 3, caused by each QUARANTINED transition); the second rule-4
          instance originates from a different trigger (humane audit FAILED).
