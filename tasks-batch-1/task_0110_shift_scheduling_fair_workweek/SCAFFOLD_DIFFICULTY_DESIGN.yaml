              as: Manager
              as_user_id: "mgr-1"
            - call: "POST /locations"
              payload: { name: "L", time_zone: "UTC", overtime_cost_guardrail_cents: 100000000, predictability_pay_enabled: false, advance_notice_days: 1 }
