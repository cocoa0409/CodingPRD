              as: RightsAdministrator
              captures: { g_id: $.data.id }
            - call: "POST /consent-grants/${g_id}/countersign"
              payload: {}
              as: TalentRepresentative
              as_user_id: "${t_id}"
            - call: "POST /biometric-assets"
              payload: { talent_id: "${t_id}", consent_grant_id: "${g_id}", asset_kind: "VOICE_SAMPLE", capture_ref: "cap-001", storage_class: "ENCRYPTED_VAULT", payload_digest: "sha256:aaa" }
              as: RightsAdministrator
              captures: { a1_id: $.data.id }
            - call: "POST /digital-replicas"
              payload: { talent_id: "${t_id}", consent_grant_id: "${g_id}", replica_kind: "VOICE_CLONE", source_asset_ids: ["${a1_id}"], build_ref: "build-001" }
              as: RightsAdministrator
              captures: { r_id: $.data.id }
            - call: "POST /digital-replicas/${r_id}/approve-for-use"
              payload: { approval_note: "cleared" }
              as: TalentRepresentative
              as_user_id: "${t_id}"
              captures: { r_v1: $.data.version }
            - call: "POST /generated-performances"
              payload: { digital_replica_id: "${r_id}", licensee_name: "Northlight", media_type: "ADVERTISING", territory_codes: ["US"], intended_use_description: "Spot A", projected_impressions: 500000, scheduled_first_use_at: "2026-09-01T00:00:00Z" }
              as: LicenseeProducer
              as_user_id: "lic-001"
              captures: { p1_id: $.data.id }
            - call: "POST /generated-performances/${p1_id}/review"
              payload: { decision: "APPROVE", review_note: "ok" }
              as: TalentRepresentative
              as_user_id: "${t_id}"
            - call: "POST /generated-performances"
              payload: { digital_replica_id: "${r_id}", licensee_name: "Northlight", media_type: "ADVERTISING", territory_codes: ["US"], intended_use_description: "Spot B", projected_impressions: 500000, scheduled_first_use_at: "2026-09-15T00:00:00Z" }
              as: LicenseeProducer
              as_user_id: "lic-001"
              captures: { p2_id: $.data.id }
            - call: "POST /generated-performances/${p2_id}/review"
              payload: { decision: "APPROVE", review_note: "ok" }
              as: TalentRepresentative
              as_user_id: "${t_id}"
          trigger:
            - call: "GET /talents/${t_id}"
              payload: {}
              as: RightsAdministrator
              captures: { t_v2: $.data.version }
            - call: "POST /consent-grants"
              payload: { talent_id: "${t_id}", grantor_kind: "TALENT", permitted_media_types: ["SOCIAL"], permitted_use_notes: "Socials", territory_codes: ["US"], exclusivity: "NON_EXCLUSIVE", effective_from: "2026-08-01T00:00:00Z", effective_until: "2027-08-01T00:00:00Z", initial_creation_fee_cents: 300000, per_use_base_fee_cents: 150000, expected_talent_version: "${t_v1}" }
              as: RightsAdministrator
