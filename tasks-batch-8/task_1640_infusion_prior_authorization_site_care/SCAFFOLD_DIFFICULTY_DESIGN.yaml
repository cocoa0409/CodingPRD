            - { call: "POST /infusion/benefit-investigations/${bi_oa}/verify", payload: { determined_channel: "MEDICAL" }, as: FinanceSpecialist, as_user_id: "fin-1" }
            - { call: "POST /infusion/authorization-requests/${auth_oa}/criteria-submissions", payload: { criterion_code: "DIAG_CONFIRM", response_value: "yes" }, as: AuthCoordinator, as_user_id: "coord-1", captures: { cs_oa: $.data.id } }
            - { call: "POST /infusion/criteria-submissions/${cs_oa}/reviews", payload: { outcome: "ACCEPTED" }, as: MedicalDirector, as_user_id: "md-1" }
            - { call: "POST /infusion/authorization-requests/${auth_oa}/site-of-care-determinations", payload: { home_allowed_cents: 100000, hospital_allowed_cents: 300000, home_billed_cents: 120000, hospital_billed_cents: 360000 }, as: MedicalDirector, as_user_id: "md-1" }
            - { call: "POST /infusion/authorization-requests/${auth_oa}/submit", payload: {}, as: AuthCoordinator, as_user_id: "coord-1", captures: { v_oa2: $.data.version } }
            - { call: "POST /infusion/authorization-requests/${auth_oa}/determinations", payload: { outcome: "APPROVED", expected_authorization_version: "${v_oa2}" }, as: MedicalDirector, as_user_id: "md-2" }
            - { call: "POST /infusion/authorization-requests/${auth_oa}/appointments", payload: { chair_id: "${chair_oa}", scheduled_start: "2026-08-10T10:00:00Z", scheduled_end: "2026-08-10T11:00:00Z" }, as: Scheduler, as_user_id: "sched-1", captures: { appt_oa1: $.data.id } }
          trigger:
            - { call: "POST /infusion/authorization-requests/${auth_oa}/appointments", payload: { chair_id: "${chair_oa}", scheduled_start: "2026-08-10T11:15:00Z", scheduled_end: "2026-08-10T12:00:00Z" }, as: Scheduler, as_user_id: "sched-1", captures: { appt_oa2: $.data.id, appt_oa2_st: $.data.status } }
            - { call: "POST /infusion/authorization-requests/${auth_oa}/appointments", payload: { chair_id: "${chair_oa}", scheduled_start: "2026-08-10T11:14:00Z", scheduled_end: "2026-08-10T12:00:00Z" }, as: Scheduler, as_user_id: "sched-1", captures: { err_oa: $.data.error_id } }
          assert:
            - "Start exactly at 11:15 (end 11:00 + buffer 15): created SCHEDULED — half-open adjacency allowed"
            - "Start at 11:14: error_id == ERR_CHAIR_SCHEDULE_CONFLICT (409)"
      - name: reviewer_closed_interval_touching_conflicts
        grounds:
          - validations[priority=19]
          - errors[ERR_REVIEWER_SLOT_CONFLICT]
          - state_machines.PeerToPeerReview
        distinguishing_aspect: |
          Different interval semantics on a different resource: the reviewer calendar uses CLOSED intervals
          [start, end] — an existing 10:00-10:30 slot CONFLICTS with a new 10:30-11:00 slot for the same
          reviewer_user_id (touching endpoints collide), whereas the chair rule would allow this adjacency.
