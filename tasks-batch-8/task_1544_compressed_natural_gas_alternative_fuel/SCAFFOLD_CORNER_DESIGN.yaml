      - name: claim_finalize_twice_rejected
        claim_type: invalid_transition
        grounds: [state_machines.TaxCreditClaim.DRAFT_to_FINALIZED, "errors[ERR_CLAIM_NOT_FINALIZABLE]"]
        distinguishing_aspect: "Finalizing an already-FINALIZED claim fails with ERR_CLAIM_NOT_FINALIZABLE."
        test_recipe:
          setup: ["Standard setup; one SETTLED July session; claim over July finalized once"]
          setup_api_calls:
            - { call: "POST /cng/stations", payload: { station_name: "CF2", station_code: "ST-CF2", access_mode: "DUAL", backup_capacity_gge: 5000 }, as: NetworkOperator, captures: { st_id: $.data.id } }
            - { call: "POST /cng/compressors", payload: { station_id: "${st_id}", compressor_code: "CMP-1", capacity_scf_per_minute: 120 }, as: StationManager }
            - { call: "POST /cng/dispensers", payload: { station_id: "${st_id}", dispenser_code: "DSP-C", fuel_type: "CNG" }, as: StationManager, captures: { dsp_c: $.data.id } }
            - { call: "POST /cng/stations/${st_id}/activate", payload: {}, as: NetworkOperator, captures: { st_v: $.data.version } }
            - { call: "POST /cng/pricing-policies", payload: { station_id: "${st_id}", access_scope: "PRIVATE", fuel_type: "CNG", price_per_gge_cents: 289, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z", expected_station_version: "${st_v}" }, as: NetworkOperator }
            - { call: "POST /cng/fleet-accounts", payload: { account_name: "CF2 Co", billing_email: "ap@cf2.example", credit_limit_cents: 1000000 }, as: NetworkOperator, captures: { acct_id: $.data.id } }
            - { call: "POST /cng/fleet-cards", payload: { fleet_account_id: "${acct_id}", card_number: "FC-CF02", vehicle_plate: "2EEE104", daily_gge_limit: 500.0 }, as: FleetAccountManager, as_user_id: "${acct_id}", captures: { card_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-15T12:00:00Z" }, as: NetworkOperator }
            - { call: "GET /cng/fleet-accounts/${acct_id}", payload: {}, as: FleetDriver, as_user_id: "${card_id}", captures: { av1: $.data.version } }
            - { call: "POST /cng/fueling-sessions/authorize", payload: { fleet_card_id: "${card_id}", dispenser_id: "${dsp_c}", client_ref: "CR-CF2", estimated_gge: 20.0, expected_fleet_account_version: "${av1}" }, as: FleetDriver, as_user_id: "${card_id}", captures: { s1: $.data.id } }
            - { call: "POST /cng/fueling-sessions/${s1}/complete", payload: { metered_mass_kg: 25.0 }, as: FleetDriver, as_user_id: "${card_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T00:00:00Z" }, as: NetworkOperator }
            - { call: "POST /cng/tax-credit-claims", payload: { station_id: "${st_id}", period_start: "2026-07-01T00:00:00Z", period_end: "2026-08-01T00:00:00Z" }, as: StationManager, captures: { claim_id: $.data.id } }
            - { call: "POST /cng/tax-credit-claims/${claim_id}/finalize", payload: {}, as: StationManager }
          trigger:
            - { call: "POST /cng/tax-credit-claims/${claim_id}/finalize", payload: {}, as: StationManager, captures: { err: $.data.error_id } }
          assert: ["err == ERR_CLAIM_NOT_FINALIZABLE"]

      - name: claim_finalize_empty_period_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_NO_ELIGIBLE_VOLUME]", calculations.tax_credit_claim_computation]
        distinguishing_aspect: "Finalizing a claim whose period contains zero SETTLED sessions fails with ERR_NO_ELIGIBLE_VOLUME (422) — the empty-set edge of the claim aggregate."
        test_recipe:
          setup: ["Station; claim over a period with no sessions at all"]
          setup_api_calls:
            - { call: "POST /cng/stations", payload: { station_name: "NoVol", station_code: "ST-NOVOL", access_mode: "DUAL", backup_capacity_gge: 5000 }, as: NetworkOperator, captures: { st_id: $.data.id } }
            - { call: "POST /cng/tax-credit-claims", payload: { station_id: "${st_id}", period_start: "2026-07-01T00:00:00Z", period_end: "2026-08-01T00:00:00Z" }, as: StationManager, captures: { claim_id: $.data.id } }
          trigger:
            - { call: "POST /cng/tax-credit-claims/${claim_id}/finalize", payload: {}, as: StationManager, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_NO_ELIGIBLE_VOLUME with HTTP 422"
            - "TaxCreditClaim.${claim_id}.status == DRAFT (unchanged)"

      - name: settle_month_outside_contract_span_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_MONTH_OUT_OF_CONTRACT]", "validations[priority=9]"]
        distinguishing_aspect: "settle-month for a closed month outside [start_month, end_month] fails with ERR_MONTH_OUT_OF_CONTRACT."
        test_recipe:
          setup: ["ACTIVE contract spanning 2026-06..2026-12; clock default 2026-08-01"]
          setup_api_calls:
            - { call: "POST /cng/stations", payload: { station_name: "OSpan", station_code: "ST-OSPAN", access_mode: "PRIVATE", backup_capacity_gge: 5000 }, as: NetworkOperator, captures: { st_id: $.data.id } }
            - { call: "POST /cng/compressors", payload: { station_id: "${st_id}", compressor_code: "CMP-1", capacity_scf_per_minute: 120 }, as: StationManager }
            - { call: "POST /cng/dispensers", payload: { station_id: "${st_id}", dispenser_code: "DSP-C", fuel_type: "CNG" }, as: StationManager }
            - { call: "POST /cng/stations/${st_id}/activate", payload: {}, as: NetworkOperator }
            - { call: "POST /cng/fleet-accounts", payload: { account_name: "OSpan Co", billing_email: "ap@ospan.example", credit_limit_cents: 100000 }, as: NetworkOperator, captures: { acct_id: $.data.id } }
            - { call: "POST /cng/supply-contracts", payload: { fleet_account_id: "${acct_id}", station_id: "${st_id}", committed_monthly_gge: 50.0, contract_price_per_gge_cents: 275, shortfall_tier1_rate_cents: 30, shortfall_tier2_rate_cents: 55, start_month: "2026-06", end_month: "2026-12" }, as: NetworkOperator, captures: { contract_id: $.data.id } }
            - { call: "POST /cng/supply-contracts/${contract_id}/activate", payload: {}, as: NetworkOperator }
          trigger:
            - { call: "POST /cng/supply-contracts/${contract_id}/settle-month", payload: { month: "2026-01" }, as: NetworkOperator, captures: { err: $.data.error_id } }
          assert: ["err == ERR_MONTH_OUT_OF_CONTRACT"]
