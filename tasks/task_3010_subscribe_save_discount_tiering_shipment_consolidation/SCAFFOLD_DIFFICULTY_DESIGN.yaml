              as: PlatformAdmin
              captures: { i2_pl: $.data.id }
            - call: "POST /sns/inventory-placements/${i2_pl}/receive"
              payload: { units: 10 }
              as: PlatformAdmin
            - call: "POST /sns/subscriptions"
              payload: { customer_id: "${i2_cust}", product_id: "${i2_prod}", cadence_months: 1, quantity: 4, start_date: "2026-09-10" }
              as: Customer
              as_user_id: "${i2_cust}"
            - call: "POST /sns/ops/generate-plans"
              payload: { delivery_month: "2026-09" }
              as: PlatformAdmin
              captures: { i2_plan: "$.data[0].id" }
            - call: "POST /sns/delivery-plans/${i2_plan}/lock"
              payload: {}
              as: Customer
              as_user_id: "${i2_cust}"
            - call: "POST /sns/delivery-plans/${i2_plan}/ship"
              payload: {}
              as: PlatformAdmin
            - call: "POST /sns/delivery-plans/${i2_plan}/mark-delivered"
              payload: {}
              as: PlatformAdmin
            - call: "GET /sns/delivery-plans/${i2_plan}/lines"
              payload: {}
              as: Customer
              as_user_id: "${i2_cust}"
              captures: { i2_line: "$.data[0].id" }
            - call: "POST /sns/delivery-plans/${i2_plan}/damage-claims"
              payload: { damaged_line_ids: ["${i2_line}"] }
              as: Customer
              as_user_id: "${i2_cust}"
              captures: { i2_claim: $.data.id }
            - call: "POST /sns/damage-claims/${i2_claim}/review"
              payload: { decision: "APPROVE_RESHIP" }
              as: SupportAgent
            - call: "GET /sns/damage-claims/${i2_claim}/reshipments"
              payload: {}
              as: SupportAgent
              captures: { i2_reship: "$.data[0].id" }
          trigger:
            - call: "POST /sns/reshipments/${i2_reship}/dispatch"
              payload: {}
              as: PlatformAdmin
          assert:
            - "after lock the placement was (on_hand 6, reserved 4, shipped 0) — 6+4+0 == 10"
            - "after ship the placement was (on_hand 6, reserved 0, shipped 4) — 6+0+4 == 10"
            - "after reship dispatch InventoryPlacement.${i2_pl}.on_hand_units == 2 and reserved_units == 0 and shipped_units == 8"
            - "invariant holds: 2 + 0 + 8 == 10 == received_total_units"
