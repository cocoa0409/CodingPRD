        claim_type: parallel
        grounds:
          - state_machines.Appliance.recall_status.NOT_DUE_to_DUE
          - state_machines.Appliance.recall_status.DUE_to_LAPSED
          - state_machines.Appliance.recall_status.LAPSED_to_NOT_DUE
