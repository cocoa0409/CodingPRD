  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: same_agreement_externship_window_pairwise_overlap
        grounds:
          - validations[priority=10]
          - entities.ExternshipAssignment.fields.start_term_index
          - entities.ExternshipAssignment.fields.end_term_index
        distinguishing_aspect: |
          Pairwise half-open [start,end) overlap on the SAME agreement: an
          existing [2,5) assignment rejects a new [4,7) (4 < 5) with
          ERR_EXTERNSHIP_WINDOW_CONFLICT; touching [5,8) would be allowed. This
          is single-pair interval arithmetic on ExternshipAssignment scoped by
          agreement.
        test_recipe:
          setup:
            - "Agreement ENROLLED; one PLACED ExternshipAssignment [2,5) at a high-capacity site."
          setup_api_calls:
            - call: "POST /v1/programs"
              payload: { name: "EMT", credential_type: "CERTIFICATE", required_clock_hours: 1000, required_theory_hours: 600, required_externship_hours: 400, tuition_cents: 400000 }
              as: SystemAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /v1/programs/${prog_id}/open"
              payload: {}
              as: SystemAdmin
            - call: "POST /v1/cohorts"
              payload: { program_id: "${prog_id}", code: "EMT-A", start_term_index: 0, end_term_index: 10, seat_capacity: 5 }
              as: Registrar
              captures: { coh_id: $.data.id }
            - call: "POST /v1/cohorts/${coh_id}/start"
              payload: {}
              as: Registrar
            - call: "POST /v1/externship-sites"
              payload: { name: "Fire Station", daily_slot_capacity: 10 }
              as: AcademicAdvisor
              captures: { site_id: $.data.id }
            - call: "POST /v1/students"
              payload: { full_name: "Pa Rho", email: "pa@x.com", hs_diploma_verified: true }
              as: Registrar
              captures: { stu_id: $.data.id }
            - call: "POST /v1/enrollment-agreements"
              payload: { student_id: "${stu_id}", cohort_id: "${coh_id}", contract_tuition_cents: 400000, cancellation_window_term_index: 0 }
              as: Registrar
              captures: { agr_id: $.data.id }
            - call: "POST /v1/enrollment-agreements/${agr_id}/enroll"
              payload: {}
              as: Registrar
            - call: "POST /v1/externship-assignments"
              payload: { agreement_id: "${agr_id}", site_id: "${site_id}", start_term_index: 2, end_term_index: 5, planned_hours: 100 }
              as: AcademicAdvisor
          trigger:
            - call: "POST /v1/externship-assignments"
              payload: { agreement_id: "${agr_id}", site_id: "${site_id}", start_term_index: 4, end_term_index: 7, planned_hours: 100 }
              as: AcademicAdvisor
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_EXTERNSHIP_WINDOW_CONFLICT"

      - name: site_aggregate_capacity_overlap_count
        grounds:
          - validations[priority=11]
          - entities.ExternshipSite.fields.daily_slot_capacity
          - entities.ExternshipAssignment.fields.site_id
        distinguishing_aspect: |
          Aggregate-capacity interval semantics: at a site with
          daily_slot_capacity 1, an existing [0,4) assignment (different
          agreement) rejects a new overlapping [3,6) because the count of
          overlapping active assignments (1) is not < capacity (1) ->
          ERR_SITE_CAPACITY_EXCEEDED. This counts overlapping intervals against
          a cap, distinct from pairwise same-agreement overlap.
        test_recipe:
          setup:
            - "Site capacity 1; agreement A1 ENROLLED with PLACED [0,4) at the site; agreement A2 ENROLLED at same site."
          setup_api_calls:
            - call: "POST /v1/programs"
              payload: { name: "Radiology", credential_type: "ASSOCIATE", required_clock_hours: 1000, required_theory_hours: 600, required_externship_hours: 400, tuition_cents: 400000 }
