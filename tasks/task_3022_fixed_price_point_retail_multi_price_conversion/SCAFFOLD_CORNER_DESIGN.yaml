              payload: { sku: "1002", description: "Tumbler 4ct", unit_retail_cents: 300, commodity_class: "KITCHEN", season_code: "", sqft_per_unit: 0.1, shelf_package_capacity: 4.0, units_per_case: 4, base_landed_cost_cents: 264, fixed_store_handling_cents: 6, variable_store_cost_cents: 4, sourcing_vendor_id: "${vendor_x_id}" }
              as: MerchandiseBuyer
              captures: { i_at_300: $.data.id }
            - call: "POST /merchandise/items/${i_at_300}/price-assignments"
              payload: { price_point_id: "${pp300_id}" }
