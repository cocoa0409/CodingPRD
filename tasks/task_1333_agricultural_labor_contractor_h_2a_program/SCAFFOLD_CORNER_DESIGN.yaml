      - name: debarred_grower_submit_rejected_then_reinstated
        claim_type: violation_to_error
        grounds: ["errors[ERR_GROWER_NOT_ACTIVE]", "state_machines.Grower", "calculations.debarment_term"]
        distinguishing_aspect: "Grower-standing gate plus the debarment clock: a DEBARRED grower's new order cannot submit (ERR_GROWER_NOT_ACTIVE); refresh-status before debarment_ends_on is a no-op, and at exactly debarment_ends_on (inclusive) the grower reinstates and the same submit succeeds."
