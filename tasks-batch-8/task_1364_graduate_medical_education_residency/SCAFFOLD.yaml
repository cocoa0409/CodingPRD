# =============================================================================
# SCAFFOLD.yaml — Graduate Medical Education Residency Program (task 1364)
# §1.0–§1.7 seed tables. Difficulty design and corner design live in the two
# sibling files (SCAFFOLD_DIFFICULTY_DESIGN.yaml / SCAFFOLD_CORNER_DESIGN.yaml).
# =============================================================================

scenario: |
  Graduate Medical Education Residency Program (ACGME-accredited residency): complement approval & funding cap, rotation schedule & block diagram, duty-hour logging & violation monitoring, evaluation (milestone) collection & clinical competency committee, procedure/case log requirement tracking, moonlighting approval & hour inclusion, remediation & probation process, accreditation citation response & annual survey

domain_name: graduate-medical-education
api_prefix: /residency-programs

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - rate_threshold_triggers
    - derived_field_reconciliation
  entity_topology: flat
  state_machine_shape: parallel
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate
  notes: |
    Flat topology: every collection hangs directly off /residency-programs and
    cross-references are body-level FKs resolved through filtered-list GETs.
    Resident carries two independent state dimensions (lifecycle_status x
    standing_status); several other machines contain revision/reopen cycles.
    ACGME duty-hour surveillance (80h rolling average, 8h rest, 1-in-7 day
    off) is the compliance core; complement/funding caps are the quota core.

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (flat topology; FKs via body fields)
# Global rule: common_fields: true => id (server-minted UUID, identity only),
# created_at / updated_at (ISO 8601 UTC, 3 fractional digits), version
# (integer, starts at 1, +1 on EVERY mutation including cascaded side effects).
# =============================================================================
entities:
  - name: ResidencyProgram
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Program display name" }
      - { name: specialty, type: enum, source: input, description: "INTERNAL_MEDICINE | GENERAL_SURGERY | PEDIATRICS | EMERGENCY_MEDICINE | OBSTETRICS_GYNECOLOGY" }
      - { name: acgme_program_code, type: string, source: input, description: "ACGME program code; unique across all programs" }
      - { name: accreditation_status, type: enum, source: computed, default: CONTINUED, description: "CONTINUED | CONTINUED_WITH_WARNING | PROBATIONARY; derived from unresolved SERIOUS AccreditationCitations (see calculation program_accreditation_status)" }

  - name: AcademicYear
    parent: ResidencyProgram
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> ResidencyProgram.id; owning program" }
      - { name: year_label, type: string, source: input, description: "Label such as 2026-2027" }
      - { name: start_date, type: datetime, source: input, description: "First day of year (date-only, midnight UTC); span to end_date MUST equal exactly 364 days (13 blocks x 28 days)" }
      - { name: end_date, type: datetime, source: input, description: "Day after last day of year (exclusive); (end_date - start_date) == 364 days enforced by ERR_INVALID_YEAR_SPAN" }
      - { name: status, type: enum, source: system, description: "PLANNING | ACTIVE | CLOSED" }

  - name: ScheduleBlock
    parent: AcademicYear
    common_fields: true
    fields:
      - { name: academic_year_id, type: string, source: system, description: "FK -> AcademicYear.id; owning year" }
      - { name: block_index, type: integer, source: system, description: "1..13; block i covers [start_date + (i-1)*28d, start_date + i*28d), half-open" }
      - { name: start_date, type: datetime, source: system, description: "Block start (inclusive), computed from year start and block_index" }
      - { name: end_date, type: datetime, source: system, description: "Block end (exclusive) = start_date + 28 days" }
      - { name: status, type: enum, source: system, description: "CURRENT | SUPERSEDED (set by block regeneration)" }

  - name: ComplementApproval
    parent: ResidencyProgram
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> ResidencyProgram.id" }
      - { name: academic_year_id, type: string, source: input, description: "FK -> AcademicYear.id; year the complement applies to" }
      - { name: pgy_level, type: integer, source: input, description: "Post-graduate year level 1..7 this complement row covers" }
      - { name: approved_positions, type: integer, source: input, description: "ACGME-approved positions (>= 0)" }
      - { name: annual_funding_budget_cents, type: integer, source: input, description: "GME funding cap for this level/year in cents (>= 0)" }
      - { name: blended_stipend_cents, type: integer, source: input, description: "Annual stipend per resident at this level in cents (>= 1)" }
      - { name: resident_year_stipend_cents, type: integer, source: computed, description: "= round_half_up(blended_stipend_cents / 13) * 13 (round per block FIRST, then multiply — pinned rounding order, see calculation resident_year_stipend)" }
      - { name: effective_funded_positions, type: integer, source: computed, description: "= min(approved_positions, floor(annual_funding_budget_cents / resident_year_stipend_cents))" }
      - { name: filled_headcount, type: integer, source: computed, description: "Headcount variant: count of Residents at (program, level) with lifecycle_status IN {ACTIVE, ON_LEAVE}; ON_LEAVE counts as 1" }
      - { name: filled_funded_census, type: number, source: computed, description: "Funded-census variant: sum over same residents with weight 1.0 for ACTIVE, 0.5 for ON_LEAVE; 2 decimal places" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | APPROVED | REJECTED | LOCKED" }

  - name: Resident
    parent: ResidencyProgram
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> ResidencyProgram.id" }
      - { name: entry_academic_year_id, type: string, source: input, description: "FK -> AcademicYear.id; year of entry used for complement matching at activation" }
      - { name: pgy_level, type: integer, source: input, description: "1..7" }
      - { name: full_name, type: string, source: input, description: "Resident full name" }
      - { name: email, type: string, source: input, description: "Resident email" }
      - { name: hire_date, type: datetime, source: input, description: "Hire date (date-only)" }
      - { name: expected_graduation_date, type: datetime, source: input, description: "Expected graduation date (date-only)" }
      - { name: lifecycle_status, type: enum, source: system, description: "INCOMING | ACTIVE | ON_LEAVE | GRADUATED | DISMISSED | TRANSFERRED" }
      - { name: standing_status, type: enum, source: computed, description: "GOOD_STANDING | UNDER_REMEDIATION | ON_PROBATION; re-derived after every RemediationPlan/ProbationCase mutation via calculation standing_resolution" }

  - name: Rotation
    parent: ResidencyProgram
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> ResidencyProgram.id" }
      - { name: name, type: string, source: input, description: "Rotation name (e.g., ICU, Night Float, Ward Medicine)" }
      - { name: min_pgy_level, type: integer, source: input, description: "Minimum PGY level eligible (1..7)" }
      - { name: max_residents_per_block, type: integer, source: input, description: "Capacity per schedule block (>= 1)" }
      - { name: is_night_float, type: boolean, source: input, default: false, description: "Night-float rotations are barred to residents ON_PROBATION (ERR_PROBATION_NIGHT_FLOAT_BLOCKED)" }
      - { name: status, type: enum, source: system, description: "ACTIVE | RETIRED" }

  - name: RotationAssignment
    parent: Resident
    common_fields: true
    fields:
      - { name: resident_id, type: string, source: input, description: "FK -> Resident.id" }
      - { name: schedule_block_id, type: string, source: input, description: "FK -> ScheduleBlock.id; block must be CURRENT" }
      - { name: rotation_id, type: string, source: input, description: "FK -> Rotation.id" }
      - { name: status, type: enum, source: system, description: "PLANNED | CONFIRMED | COMPLETED | CANCELLED" }

  - name: DutyHourLog
    parent: Resident
    common_fields: true
    fields:
      - { name: resident_id, type: string, source: input, description: "FK -> Resident.id; must equal X-User-ID when X-User-Role is Resident" }
      - { name: started_at, type: datetime, source: input, description: "Shift start timestamp; must fall inside an ACTIVE AcademicYear of the resident's program" }
      - { name: ended_at, type: datetime, source: input, description: "Shift end timestamp; must be after started_at; duration must be <= 28.00 hours (ERR_SHIFT_LENGTH_VIOLATION); must not overlap another non-VOID log of the same resident (ERR_LOG_TIME_OVERLAP)" }
      - { name: duration_hours, type: number, source: computed, description: "= (ended_at - started_at) in hours, 2 decimal places, round_half_up" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | ATTESTED | VOID" }
      - { name: void_reason, type: string, source: input, description: "Set when voided" }

  - name: DutyHourViolation
    parent: Resident
    common_fields: true
    fields:
      - { name: resident_id, type: string, source: system, description: "FK -> Resident.id" }
      - { name: duty_hour_log_id, type: string, source: system, description: "FK -> DutyHourLog.id; the attested log whose detection pass raised this violation" }
      - { name: rule_code, type: enum, source: system, description: "HOURS_80_AVG | REST_8H | DAY_OFF_4_IN_28" }
      - { name: window_start, type: datetime, source: system, description: "Inclusive start of the measurement window" }
      - { name: window_end, type: datetime, source: system, description: "Inclusive end of the measurement window" }
      - { name: measured_value, type: number, source: system, description: "Observed value (avg hours, gap hours, or days off), 2 decimal places" }
      - { name: threshold_value, type: number, source: system, description: "Threshold breached (80.00 | 8.00 | 4)" }
      - { name: status, type: enum, source: system, description: "FLAGGED | ACKNOWLEDGED | RESOLVED | DISMISSED; unresolved = FLAGGED or ACKNOWLEDGED" }
      - { name: resolution_note, type: string, source: input, description: "Note set on resolve; justification (>= 10 chars) required on dismiss" }

  - name: MoonlightingRequest
    parent: Resident
    common_fields: true
    fields:
      - { name: resident_id, type: string, source: input, description: "FK -> Resident.id; must equal X-User-ID when X-User-Role is Resident" }
      - { name: type, type: enum, source: input, description: "INTERNAL | EXTERNAL" }
      - { name: site_name, type: string, source: input, description: "Moonlighting site" }
      - { name: start_date, type: datetime, source: input, description: "First date (inclusive); must be before end_date" }
      - { name: end_date, type: datetime, source: input, description: "Last date (exclusive); half-open [start_date, end_date); adjacency (end == other start) is NOT an overlap" }
      - { name: hours_per_week, type: number, source: input, description: "Committed hours per week (1.00..24.00, 2 decimal places)" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | APPROVED | DENIED | ACTIVE | COMPLETED | REVOKED | WITHDRAWN" }
      - { name: decision_reason, type: string, source: input, description: "Denial or revocation reason; STANDING_CHANGE set by cascade" }

  - name: MilestoneEvaluation
    parent: Resident
    common_fields: false
    fields:
      - { name: resident_id, type: string, source: input, description: "FK -> Resident.id" }
      - { name: academic_year_id, type: string, source: input, description: "FK -> AcademicYear.id" }
      - { name: reporting_period, type: enum, source: input, description: "H1 | H2" }
      - { name: evaluator_id, type: string, source: system, description: "X-User-ID of the submitting FacultyEvaluator/ProgramDirector" }
      - { name: evaluator_role, type: enum, source: system, description: "FACULTY | PROGRAM_DIRECTOR; copied from X-User-Role; PROGRAM_DIRECTOR ratings weigh 2.0 in milestone_composite_level" }
      - { name: competency_ratings, type: array, source: input, description: "Exactly 6 entries {competency, level}; competency IN {PATIENT_CARE, MEDICAL_KNOWLEDGE, PROFESSIONALISM, COMMUNICATION, PRACTICE_BASED_LEARNING, SYSTEMS_BASED_PRACTICE}; level integer 1..5 (ERR_INCOMPLETE_RATINGS otherwise)" }

  - name: CCCReview
    parent: Resident
    common_fields: true
    fields:
      - { name: resident_id, type: string, source: input, description: "FK -> Resident.id" }
      - { name: academic_year_id, type: string, source: input, description: "FK -> AcademicYear.id" }
      - { name: reporting_period, type: enum, source: input, description: "H1 | H2" }
      - { name: status, type: enum, source: system, description: "OPEN | IN_DELIBERATION | FINALIZED" }
      - { name: outcome, type: enum, source: input, description: "SATISFACTORY | NEEDS_IMPROVEMENT | UNSATISFACTORY; set at finalize" }
      - { name: milestone_levels, type: array, source: input, description: "Exactly 6 entries {competency, level 1..5}; committee's official levels, set at finalize (ERR_INCOMPLETE_RATINGS otherwise)" }
      - { name: composite_snapshot, type: object, source: computed, description: "Per-competency weighted composite computed at finalize via milestone_composite_level; keys are the 6 competency codes" }

  - name: ProcedureCaseLog
    parent: Resident
    common_fields: true
    fields:
      - { name: resident_id, type: string, source: input, description: "FK -> Resident.id; must equal X-User-ID when X-User-Role is Resident" }
      - { name: rotation_id, type: string, source: input, description: "FK -> Rotation.id; rotation the case was performed on" }
      - { name: procedure_category, type: enum, source: input, description: "MAJOR_SURGERY | ENDOSCOPY | TRAUMA_CARE | DELIVERIES | AMBULATORY_PROCEDURE" }
      - { name: performed_date, type: datetime, source: input, description: "Date performed (date-only); must fall inside an ACTIVE AcademicYear of the resident's program" }
      - { name: role, type: enum, source: input, description: "SURGEON | ASSIST; ASSIST logs count at 0.5 weight capped at 25% of required_count (see case_log_progress)" }
      - { name: status, type: enum, source: system, description: "LOGGED | VERIFIED | REJECTED | VOIDED" }
      - { name: decision_reason, type: string, source: input, description: "Rejection or void reason" }

  - name: CaseRequirement
    parent: ResidencyProgram
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> ResidencyProgram.id" }
      - { name: procedure_category, type: enum, source: input, description: "MAJOR_SURGERY | ENDOSCOPY | TRAUMA_CARE | DELIVERIES | AMBULATORY_PROCEDURE; unique per program (ERR_REQUIREMENT_EXISTS)" }
      - { name: required_count, type: integer, source: input, description: "Minimum effective cases required for graduation (>= 1)" }
      - { name: required_primary_count, type: integer, source: input, description: "Minimum VERIFIED SURGEON-role cases required (>= 0, <= required_count)" }

  - name: RemediationPlan
    parent: Resident
    common_fields: true
    fields:
      - { name: resident_id, type: string, source: system, description: "FK -> Resident.id" }
      - { name: ccc_review_id, type: string, source: system, description: "FK -> CCCReview.id; set only when trigger_source == CCC_OUTCOME, otherwise null" }
      - { name: trigger_source, type: enum, source: system, description: "MANUAL | CCC_OUTCOME | DUTY_HOUR_VIOLATIONS" }
      - { name: goals, type: string, source: input, description: "Remediation goals; auto-created plans get a system text (see state machine side effects)" }
      - { name: start_date, type: datetime, source: system, description: "Logical-clock date at creation" }
      - { name: end_date, type: datetime, source: system, description: "= start_date + 90 days" }
      - { name: outcome, type: enum, source: input, description: "SUCCESS | FAILURE; set by complete action" }
      - { name: status, type: enum, source: system, description: "ACTIVE | COMPLETED_SUCCESS | COMPLETED_FAILURE | CANCELLED" }

  - name: ProbationCase
    parent: Resident
    common_fields: true
    fields:
      - { name: resident_id, type: string, source: system, description: "FK -> Resident.id" }
      - { name: remediation_plan_id, type: string, source: system, description: "FK -> RemediationPlan.id; set only when escalated from a failed plan, otherwise null" }
      - { name: reason, type: string, source: input, description: "Probation reason; auto-created cases get a system text" }
      - { name: status, type: enum, source: system, description: "ACTIVE | LIFTED | DISMISSAL_RECOMMENDED | DISMISSED" }
      - { name: recommended_by, type: string, source: system, description: "X-User-ID recorded at recommend-dismissal; confirm-dismissal MUST come from a different X-User-ID (segregation of duties, ERR_DISMISSAL_CONFIRMATION_CONFLICT)" }

  - name: AccreditationCitation
    parent: ResidencyProgram
    common_fields: true
    fields:
      - { name: program_id, type: string, source: system, description: "FK -> ResidencyProgram.id" }
      - { name: annual_survey_id, type: string, source: system, description: "FK -> AnnualSurvey.id; set only when auto-created by survey close, otherwise null" }
      - { name: citation_code, type: string, source: input, description: "Citation identifier (e.g., IV.A.2); auto-created survey citations use SURVEY-<area_code>-<year_label>" }
      - { name: area_code, type: enum, source: input, description: "DUTY_HOURS | EVALUATION | CASE_LOGS | SUPERVISION | RESPONSE_RATE | OTHER" }
      - { name: severity, type: enum, source: input, description: "WARNING | SERIOUS" }
      - { name: received_date, type: datetime, source: system, description: "Logical-clock date at creation" }
      - { name: due_date, type: datetime, source: input, description: "Response due date (informational)" }
      - { name: status, type: enum, source: system, description: "OPEN | RESPONSE_DRAFTED | RESPONSE_SUBMITTED | RESOLVED | ESCALATED; unresolved = all except RESOLVED" }

  - name: AnnualSurvey
    parent: ResidencyProgram
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> ResidencyProgram.id" }
      - { name: academic_year_id, type: string, source: input, description: "FK -> AcademicYear.id; one survey per (program, year) (ERR_SURVEY_EXISTS)" }
      - { name: status, type: enum, source: system, description: "OPEN | CLOSED" }
      - { name: resident_response_rate, type: number, source: input, description: "0.00..100.00, 2 decimal places; set at close; < 70.00 auto-creates a RESPONSE_RATE citation" }
      - { name: faculty_response_rate, type: number, source: input, description: "0.00..100.00, 2 decimal places; set at close; < 70.00 auto-creates a FACULTY-response citation recorded with area_code RESPONSE_RATE and citation_code SURVEY-FACULTY-<year_label>" }
      - { name: area_results, type: array, source: input, description: "Entries {area_code, compliance_pct 0.00..100.00}; each area with compliance_pct < 70.00 is flagged and auto-creates a citation at close" }
      - { name: flagged_area_count, type: integer, source: computed, description: "Count of area_results entries with compliance_pct < 70.00; if >= 3, all flagged-area citations are severity SERIOUS, else WARNING" }

# =============================================================================
# §1.2 State Machine Table
# All transitions recompute the acting entity's updated_at and bump version.
# =============================================================================
state_machines:
  - entity: AcademicYear
    initial_state: PLANNING
    terminal_states: [CLOSED]
    transitions:
      - from: PLANNING
        to: ACTIVE
        trigger: "POST /residency-programs/academic-years/{id}/activate"
        actor: ProgramCoordinator
        preconditions:
          - "status == PLANNING (ERR_ACADEMIC_YEAR_NOT_PLANNING)"
          - "Exactly 13 ScheduleBlocks with status CURRENT exist for this year (guaranteed by creation side effect)"
        side_effects:
          - "status -> ACTIVE"
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /residency-programs/academic-years/{id}/close"
        actor: ProgramCoordinator
        preconditions:
          - "status == ACTIVE (ERR_ACADEMIC_YEAR_NOT_ACTIVE)"
          - "No DutyHourLog in SUBMITTED status for any resident of this program (ERR_UNATTESTED_LOGS_EXIST)"
        side_effects:
          - "status -> CLOSED"

  - entity: ScheduleBlock
    initial_state: CURRENT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: CURRENT
        to: SUPERSEDED
        trigger: "system (POST /residency-programs/academic-years/{id}/regenerate-blocks)"
        actor: ProgramCoordinator
        preconditions:
          - "Parent year status == PLANNING (ERR_ACADEMIC_YEAR_NOT_PLANNING)"
          - "OCC: expected_academic_year_version matches year.version (ERR_STALE_VERSION)"
        side_effects:
          - "All existing CURRENT blocks -> SUPERSEDED"
          - "13 fresh CURRENT blocks created (block_index 1..13)"
          - "increments AcademicYear.version by 1"

  - entity: ComplementApproval
    initial_state: DRAFT
    terminal_states: [LOCKED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /residency-programs/complement-approvals/{id}/submit"
        actor: ProgramDirector
        preconditions:
          - "status IN {DRAFT, REJECTED} (ERR_COMPLEMENT_NOT_SUBMITTABLE)"
        side_effects: ["status -> SUBMITTED"]
      - from: REJECTED
        to: SUBMITTED
        trigger: "POST /residency-programs/complement-approvals/{id}/submit"
        actor: ProgramDirector
        preconditions:
          - "status IN {DRAFT, REJECTED} (ERR_COMPLEMENT_NOT_SUBMITTABLE)"
        side_effects: ["status -> SUBMITTED"]
        note: "revision cycle: REJECTED -> (optional PUT edit) -> SUBMITTED again"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /residency-programs/complement-approvals/{id}/approve"
        actor: DesignatedInstitutionalOfficial
        preconditions:
          - "status == SUBMITTED (ERR_COMPLEMENT_NOT_SUBMITTED)"
          - "program.accreditation_status != PROBATIONARY (ERR_PROGRAM_PROBATIONARY)"
          - "No other ComplementApproval with same (program_id, academic_year_id, pgy_level) in APPROVED or LOCKED (ERR_COMPLEMENT_ALREADY_APPROVED)"
        side_effects: ["status -> APPROVED"]
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /residency-programs/complement-approvals/{id}/reject"
        actor: DesignatedInstitutionalOfficial
        preconditions:
          - "status == SUBMITTED (ERR_COMPLEMENT_NOT_SUBMITTED)"
        side_effects: ["status -> REJECTED"]
      - from: APPROVED
        to: LOCKED
        trigger: "POST /residency-programs/complement-approvals/{id}/lock"
        actor: DesignatedInstitutionalOfficial
        preconditions:
          - "status == APPROVED (ERR_COMPLEMENT_NOT_APPROVED)"
        side_effects:
          - "status -> LOCKED"
          - "LOCKED rows reject PUT (ERR_COMPLEMENT_NOT_EDITABLE) and submit (ERR_COMPLEMENT_NOT_SUBMITTABLE)"

  - entity: Resident
    initial_state: INCOMING
    terminal_states: [GRADUATED, DISMISSED, TRANSFERRED]
    note: "Parallel dimension 1 of 2: lifecycle_status. Evolves independently of standing_status."
    transitions:
      - from: INCOMING
        to: ACTIVE
        trigger: "POST /residency-programs/residents/{id}/activate"
        actor: ProgramCoordinator
        preconditions:
          - "lifecycle_status == INCOMING (ERR_RESIDENT_NOT_INCOMING)"
          - "Complement headroom: filled_headcount + 1 <= approved_positions of the APPROVED/LOCKED complement for (program, entry year, pgy_level) (ERR_COMPLEMENT_EXCEEDED)"
          - "Funding headroom: round_half_up((filled_funded_census + 1.0) * resident_year_stipend_cents) <= annual_funding_budget_cents (ERR_FUNDING_CAP_EXCEEDED)"
        side_effects:
          - "lifecycle_status -> ACTIVE"
          - "Recompute filled_headcount / filled_funded_census on the matching ComplementApproval"
      - from: ACTIVE
        to: ON_LEAVE
        trigger: "POST /residency-programs/residents/{id}/place-on-leave"
        actor: ProgramDirector
        preconditions:
          - "lifecycle_status == ACTIVE (ERR_RESIDENT_NOT_ACTIVE)"
        side_effects:
          - "lifecycle_status -> ON_LEAVE"
          - "Recompute complement fill fields (headcount unchanged; census drops by 0.5)"
      - from: ON_LEAVE
        to: ACTIVE
        trigger: "POST /residency-programs/residents/{id}/return-from-leave"
        actor: ProgramDirector
        preconditions:
          - "lifecycle_status == ON_LEAVE (ERR_RESIDENT_NOT_ON_LEAVE)"
        side_effects:
          - "lifecycle_status -> ACTIVE"
          - "Recompute complement fill fields; no fiscal re-check (the slot stayed reserved while ON_LEAVE)"
      - from: ACTIVE
        to: GRADUATED
        trigger: "POST /residency-programs/residents/{id}/graduate"
        actor: ProgramDirector
        preconditions:
          - "lifecycle_status == ACTIVE (ERR_RESIDENT_NOT_ACTIVE)"
          - "standing_status == GOOD_STANDING (ERR_STANDING_NOT_CLEAR)"
          - "Every CaseRequirement of the program has requirement_met == true for this resident (ERR_CASE_REQUIREMENTS_UNMET)"
          - "At least one CCCReview for this resident is FINALIZED (ERR_NO_FINALIZED_CCC_REVIEW)"
        side_effects:
          - "lifecycle_status -> GRADUATED"
          - "Recompute complement fill fields"
      - from: ACTIVE
        to: TRANSFERRED
        trigger: "POST /residency-programs/residents/{id}/transfer"
        actor: ProgramDirector
        preconditions:
          - "lifecycle_status IN {ACTIVE, ON_LEAVE} (ERR_RESIDENT_NOT_ACTIVE)"
        side_effects:
          - "lifecycle_status -> TRANSFERRED"
          - "Recompute complement fill fields"
      - from: ON_LEAVE
        to: TRANSFERRED
        trigger: "POST /residency-programs/residents/{id}/transfer"
        actor: ProgramDirector
        preconditions:
          - "lifecycle_status IN {ACTIVE, ON_LEAVE} (ERR_RESIDENT_NOT_ACTIVE)"
        side_effects:
          - "lifecycle_status -> TRANSFERRED"
          - "Recompute complement fill fields"
      - from: ACTIVE
        to: DISMISSED
        trigger: "system (POST /residency-programs/probation-cases/{id}/confirm-dismissal)"
        actor: DesignatedInstitutionalOfficial
        preconditions:
          - "A ProbationCase for this resident is DISMISSAL_RECOMMENDED and confirmation passes segregation of duties"
        side_effects:
          - "lifecycle_status -> DISMISSED"
          - "Recompute complement fill fields"
      - from: ON_LEAVE
        to: DISMISSED
        trigger: "system (POST /residency-programs/probation-cases/{id}/confirm-dismissal)"
        actor: DesignatedInstitutionalOfficial
        preconditions:
          - "A ProbationCase for this resident is DISMISSAL_RECOMMENDED and confirmation passes segregation of duties"
        side_effects:
          - "lifecycle_status -> DISMISSED"
          - "Recompute complement fill fields"

  - entity: ResidentStanding
    note: "Parallel dimension 2 of 2 on Resident: standing_status field. Transitions are fired by RemediationPlan/ProbationCase events, then standing_resolution recomputes the field."
    initial_state: GOOD_STANDING
    terminal_states: []
    transitions:
      - from: GOOD_STANDING
        to: UNDER_REMEDIATION
        trigger: "system (RemediationPlan becomes ACTIVE: manual POST /residency-programs/remediation-plans, CCC NEEDS_IMPROVEMENT finalize, or 3rd unresolved duty-hour violation)"
        actor: system
        preconditions:
          - "No ProbationCase in {ACTIVE, DISMISSAL_RECOMMENDED} for the resident"
        side_effects:
          - "standing_status -> UNDER_REMEDIATION"
          - "Moonlighting sweep: every MoonlightingRequest of the resident in {APPROVED, ACTIVE} -> REVOKED with decision_reason STANDING_CHANGE (SUBMITTED requests are left SUBMITTED but blocked at approve)"
          - "Recompute official/projected weekly duty hours (attributed moonlighting drops to 0 for revoked requests)"
      - from: GOOD_STANDING
        to: ON_PROBATION
        trigger: "system (manual POST /residency-programs/probation-cases or CCC UNSATISFACTORY finalize)"
        actor: system
        preconditions: []
        side_effects:
          - "standing_status -> ON_PROBATION"
          - "Same moonlighting sweep as GOOD_STANDING -> UNDER_REMEDIATION"
      - from: UNDER_REMEDIATION
        to: ON_PROBATION
        trigger: "system (RemediationPlan completes with outcome FAILURE, or manual ProbationCase creation)"
        actor: system
        preconditions: []
        side_effects:
          - "standing_status -> ON_PROBATION (moonlighting already revoked; sweep is a no-op)"
      - from: UNDER_REMEDIATION
        to: GOOD_STANDING
        trigger: "system (RemediationPlan completes SUCCESS or is CANCELLED, and no other ACTIVE plan and no open ProbationCase)"
        actor: system
        preconditions: []
        side_effects:
          - "standing_status -> GOOD_STANDING (no automatic reinstatement of revoked moonlighting)"
      - from: ON_PROBATION
        to: GOOD_STANDING
        trigger: "system (ProbationCase LIFTED, and no ACTIVE RemediationPlan and no other open ProbationCase)"
        actor: system
        preconditions: []
        side_effects:
          - "standing_status -> GOOD_STANDING"

  - entity: Rotation
    initial_state: ACTIVE
    terminal_states: [RETIRED]
    transitions:
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /residency-programs/rotations/{id}/retire"
        actor: ProgramCoordinator
        preconditions:
          - "status == ACTIVE (ERR_ROTATION_NOT_ACTIVE)"
          - "No RotationAssignment referencing this rotation in {PLANNED, CONFIRMED} (ERR_ROTATION_HAS_OPEN_ASSIGNMENTS)"
        side_effects: ["status -> RETIRED"]

  - entity: RotationAssignment
    initial_state: PLANNED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: PLANNED
        to: CONFIRMED
        trigger: "POST /residency-programs/rotation-assignments/{id}/confirm"
        actor: ProgramCoordinator
        preconditions:
          - "status == PLANNED (ERR_ASSIGNMENT_NOT_PLANNED)"
        side_effects: ["status -> CONFIRMED"]
      - from: CONFIRMED
        to: COMPLETED
        trigger: "POST /residency-programs/rotation-assignments/{id}/complete"
        actor: ProgramCoordinator
        preconditions:
          - "status == CONFIRMED (ERR_ASSIGNMENT_NOT_CONFIRMED)"
        side_effects: ["status -> COMPLETED"]
      - from: PLANNED
        to: CANCELLED
        trigger: "POST /residency-programs/rotation-assignments/{id}/cancel"
        actor: ProgramCoordinator
        preconditions:
          - "status IN {PLANNED, CONFIRMED} (ERR_ASSIGNMENT_NOT_CANCELLABLE)"
        side_effects: ["status -> CANCELLED"]
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /residency-programs/rotation-assignments/{id}/cancel"
        actor: ProgramCoordinator
        preconditions:
          - "status IN {PLANNED, CONFIRMED} (ERR_ASSIGNMENT_NOT_CANCELLABLE)"
        side_effects: ["status -> CANCELLED"]

  - entity: DutyHourLog
    initial_state: SUBMITTED
    terminal_states: [VOID]
    transitions:
      - from: SUBMITTED
        to: ATTESTED
        trigger: "POST /residency-programs/duty-hour-logs/{id}/attest"
        actor: Resident
        preconditions:
          - "status == SUBMITTED (ERR_LOG_NOT_SUBMITTED)"
          - "Ownership: X-User-ID == log.resident_id when role is Resident (ERR_OWNERSHIP_VIOLATION)"
        side_effects:
          - "status -> ATTESTED"
          - "Run duty_hour_violation_detection for this log (may create DutyHourViolation rows)"
          - "If unresolved violations for this resident in the current ACTIVE year reach >= 3 and no ACTIVE RemediationPlan exists: auto-create RemediationPlan (trigger_source DUTY_HOUR_VIOLATIONS, status ACTIVE, goals 'Automatic remediation: repeated duty-hour violations', start = logical clock date, end = start + 90 days) -> standing -> UNDER_REMEDIATION -> moonlighting sweep"
      - from: SUBMITTED
        to: VOID
        trigger: "POST /residency-programs/duty-hour-logs/{id}/void"
        actor: Resident | ProgramDirector
        preconditions:
          - "status IN {SUBMITTED, ATTESTED} (ERR_LOG_NOT_VOIDABLE)"
        side_effects:
          - "status -> VOID; void_reason recorded"
          - "Log excluded from all duty-hour aggregates (compensating action of attest)"
      - from: ATTESTED
        to: VOID
        trigger: "POST /residency-programs/duty-hour-logs/{id}/void"
        actor: Resident | ProgramDirector
        preconditions:
          - "status IN {SUBMITTED, ATTESTED} (ERR_LOG_NOT_VOIDABLE)"
        side_effects:
          - "status -> VOID; void_reason recorded"
          - "Weekly aggregates recomputed without this log (attest+void leaves official hours unchanged)"

  - entity: DutyHourViolation
    initial_state: FLAGGED
    terminal_states: [RESOLVED, DISMISSED]
    transitions:
      - from: FLAGGED
        to: ACKNOWLEDGED
        trigger: "POST /residency-programs/duty-hour-violations/{id}/acknowledge"
        actor: ProgramCoordinator
        preconditions:
          - "status == FLAGGED (ERR_VIOLATION_NOT_OPEN)"
        side_effects: ["status -> ACKNOWLEDGED"]
      - from: ACKNOWLEDGED
        to: RESOLVED
        trigger: "POST /residency-programs/duty-hour-violations/{id}/resolve"
        actor: ProgramDirector
        preconditions:
          - "status IN {FLAGGED, ACKNOWLEDGED} (ERR_VIOLATION_NOT_OPEN)"
        side_effects: ["status -> RESOLVED; resolution_note recorded"]
      - from: FLAGGED
        to: RESOLVED
        trigger: "POST /residency-programs/duty-hour-violations/{id}/resolve"
        actor: ProgramDirector
        preconditions:
          - "status IN {FLAGGED, ACKNOWLEDGED} (ERR_VIOLATION_NOT_OPEN)"
        side_effects: ["status -> RESOLVED; resolution_note recorded"]
      - from: FLAGGED
        to: DISMISSED
        trigger: "POST /residency-programs/duty-hour-violations/{id}/dismiss"
        actor: ProgramDirector
        preconditions:
          - "status IN {FLAGGED, ACKNOWLEDGED} (ERR_VIOLATION_NOT_OPEN)"
          - "justification length >= 10 characters (ERR_JUSTIFICATION_REQUIRED)"
        side_effects: ["status -> DISMISSED; resolution_note = justification"]
      - from: ACKNOWLEDGED
        to: DISMISSED
        trigger: "POST /residency-programs/duty-hour-violations/{id}/dismiss"
        actor: ProgramDirector
        preconditions:
          - "status IN {FLAGGED, ACKNOWLEDGED} (ERR_VIOLATION_NOT_OPEN)"
          - "justification length >= 10 characters (ERR_JUSTIFICATION_REQUIRED)"
        side_effects: ["status -> DISMISSED; resolution_note = justification"]

  - entity: MoonlightingRequest
    initial_state: DRAFT
    terminal_states: [DENIED, COMPLETED, REVOKED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /residency-programs/moonlighting-requests/{id}/submit"
        actor: Resident
        preconditions:
          - "status == DRAFT (ERR_MOONLIGHTING_NOT_SUBMITTABLE)"
        side_effects: ["status -> SUBMITTED"]
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /residency-programs/moonlighting-requests/{id}/approve"
        actor: ProgramDirector
        preconditions:
          - "status == SUBMITTED (ERR_MOONLIGHTING_NOT_APPROVABLE)"
          - "resident.standing_status == GOOD_STANDING (ERR_STANDING_BLOCKS_MOONLIGHTING)"
          - "Headroom per moonlighting_headroom_check: rolling projected average + candidate hours_per_week <= 80.00 (ERR_PROJECTED_HOURS_EXCEED_80)"
        side_effects: ["status -> APPROVED"]
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /residency-programs/moonlighting-requests/{id}/deny"
        actor: ProgramDirector
        preconditions:
          - "status == SUBMITTED (ERR_MOONLIGHTING_NOT_DENIABLE)"
        side_effects: ["status -> DENIED; decision_reason recorded"]
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /residency-programs/moonlighting-requests/{id}/withdraw"
        actor: Resident
        preconditions:
          - "status IN {DRAFT, SUBMITTED} (ERR_MOONLIGHTING_NOT_WITHDRAWABLE)"
        side_effects: ["status -> WITHDRAWN"]
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /residency-programs/moonlighting-requests/{id}/withdraw"
        actor: Resident
        preconditions:
          - "status IN {DRAFT, SUBMITTED} (ERR_MOONLIGHTING_NOT_WITHDRAWABLE)"
        side_effects: ["status -> WITHDRAWN"]
      - from: APPROVED
        to: ACTIVE
        trigger: "system (logical clock reaches start_date)"
        actor: system
        preconditions:
          - "status == APPROVED and start_date <= clock < end_date"
        side_effects: ["status -> ACTIVE"]
      - from: APPROVED
        to: COMPLETED
        trigger: "system (logical clock reaches end_date)"
        actor: system
        preconditions:
          - "status == APPROVED and clock >= end_date"
        side_effects: ["status -> COMPLETED"]
      - from: ACTIVE
        to: COMPLETED
        trigger: "system (logical clock reaches end_date)"
        actor: system
        preconditions:
          - "status == ACTIVE and clock >= end_date"
        side_effects: ["status -> COMPLETED"]
      - from: APPROVED
        to: REVOKED
        trigger: "POST /residency-programs/moonlighting-requests/{id}/revoke or standing cascade"
        actor: ProgramDirector | system
        preconditions:
          - "status IN {APPROVED, ACTIVE} (ERR_MOONLIGHTING_NOT_REVOKABLE)"
        side_effects:
          - "status -> REVOKED; decision_reason recorded (STANDING_CHANGE when fired by the standing cascade)"
          - "Attributed moonlighting hours drop out of official/projected weekly aggregates"
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /residency-programs/moonlighting-requests/{id}/revoke or standing cascade"
        actor: ProgramDirector | system
        preconditions:
          - "status IN {APPROVED, ACTIVE} (ERR_MOONLIGHTING_NOT_REVOKABLE)"
        side_effects:
          - "status -> REVOKED; decision_reason recorded (STANDING_CHANGE when fired by the standing cascade)"
          - "Attributed moonlighting hours drop out of official/projected weekly aggregates"

  - entity: CCCReview
    initial_state: OPEN
    terminal_states: [FINALIZED]
    transitions:
      - from: OPEN
        to: IN_DELIBERATION
        trigger: "POST /residency-programs/ccc-reviews/{id}/begin-deliberation"
        actor: CCCChair
        preconditions:
          - "status == OPEN (ERR_CCC_NOT_OPEN)"
        side_effects: ["status -> IN_DELIBERATION"]
      - from: IN_DELIBERATION
        to: OPEN
        trigger: "POST /residency-programs/ccc-reviews/{id}/reopen"
        actor: CCCChair
        preconditions:
          - "status == IN_DELIBERATION (ERR_CCC_NOT_IN_DELIBERATION)"
        side_effects: ["status -> OPEN"]
        note: "deliberation cycle: OPEN -> IN_DELIBERATION -> OPEN allowed any number of times"
      - from: IN_DELIBERATION
        to: FINALIZED
        trigger: "POST /residency-programs/ccc-reviews/{id}/finalize"
        actor: CCCChair
        preconditions:
          - "status == IN_DELIBERATION (ERR_CCC_NOT_IN_DELIBERATION)"
          - ">= 3 MilestoneEvaluations exist for (resident, academic_year_id, reporting_period) (ERR_INSUFFICIENT_EVALUATIONS)"
          - "Segregation of duties: X-User-ID must not equal the evaluator_id of any MilestoneEvaluation for that (resident, year, period) (ERR_COMMITTEE_ROLE_CONFLICT)"
          - "outcome IN {SATISFACTORY, NEEDS_IMPROVEMENT, UNSATISFACTORY} (ERR_INVALID_OUTCOME)"
        side_effects:
          - "status -> FINALIZED; outcome and milestone_levels recorded"
          - "composite_snapshot computed via milestone_composite_level"
          - "If outcome == NEEDS_IMPROVEMENT: create RemediationPlan (trigger_source CCC_OUTCOME, ccc_review_id set, status ACTIVE, goals 'Clinical Competency Committee remediation (outcome NEEDS_IMPROVEMENT)', start = logical clock date, end = start + 90 days) -> standing cascade"
          - "If outcome == UNSATISFACTORY: create ProbationCase (reason 'CCC outcome UNSATISFACTORY', status ACTIVE) -> standing cascade -> moonlighting sweep -> weekly hour aggregates recomputed"

  - entity: ProcedureCaseLog
    initial_state: LOGGED
    terminal_states: [VERIFIED, VOIDED]
    transitions:
      - from: LOGGED
        to: VERIFIED
        trigger: "POST /residency-programs/procedure-case-logs/{id}/verify"
        actor: FacultyEvaluator
        preconditions:
          - "status == LOGGED (ERR_CASE_LOG_NOT_LOGGED)"
        side_effects:
          - "status -> VERIFIED"
          - "case_log_progress recomputed for (resident, procedure_category)"
      - from: LOGGED
        to: REJECTED
        trigger: "POST /residency-programs/procedure-case-logs/{id}/reject"
        actor: FacultyEvaluator
        preconditions:
          - "status == LOGGED (ERR_CASE_LOG_NOT_LOGGED)"
        side_effects: ["status -> REJECTED; decision_reason recorded"]
      - from: REJECTED
        to: LOGGED
        trigger: "POST /residency-programs/procedure-case-logs/{id}/resubmit"
        actor: Resident
        preconditions:
          - "status == REJECTED (ERR_CASE_LOG_NOT_LOGGED)"
          - "Ownership: X-User-ID == log.resident_id when role is Resident (ERR_OWNERSHIP_VIOLATION)"
        side_effects: ["status -> LOGGED (resubmission cycle)"]
      - from: VERIFIED
        to: VOIDED
        trigger: "POST /residency-programs/procedure-case-logs/{id}/void"
        actor: ProgramDirector
        preconditions:
          - "status == VERIFIED (ERR_CASE_LOG_NOT_VERIFIED)"
        side_effects:
          - "status -> VOIDED; decision_reason recorded"
          - "case_log_progress recomputed (verify+void leaves verified counts unchanged)"

  - entity: RemediationPlan
    initial_state: ACTIVE
    terminal_states: [COMPLETED_SUCCESS, COMPLETED_FAILURE, CANCELLED]
    transitions:
      - from: ACTIVE
        to: COMPLETED_SUCCESS
        trigger: "POST /residency-programs/remediation-plans/{id}/complete with outcome SUCCESS"
        actor: ProgramDirector
        preconditions:
          - "status == ACTIVE (ERR_REMEDIATION_NOT_ACTIVE)"
          - "outcome IN {SUCCESS, FAILURE} (ERR_INVALID_OUTCOME)"
        side_effects:
          - "status -> COMPLETED_SUCCESS"
          - "standing_resolution recompute (may lift UNDER_REMEDIATION to GOOD_STANDING)"
      - from: ACTIVE
        to: COMPLETED_FAILURE
        trigger: "POST /residency-programs/remediation-plans/{id}/complete with outcome FAILURE"
        actor: ProgramDirector
        preconditions:
          - "status == ACTIVE (ERR_REMEDIATION_NOT_ACTIVE)"
          - "outcome IN {SUCCESS, FAILURE} (ERR_INVALID_OUTCOME)"
        side_effects:
          - "status -> COMPLETED_FAILURE"
          - "Create ProbationCase (remediation_plan_id set, reason 'Remediation plan failure', status ACTIVE) unless one already open -> standing -> ON_PROBATION -> moonlighting sweep"
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /residency-programs/remediation-plans/{id}/cancel"
        actor: ProgramDirector
        preconditions:
          - "status == ACTIVE (ERR_REMEDIATION_NOT_ACTIVE)"
        side_effects:
          - "status -> CANCELLED; cancel_reason recorded"
          - "standing_resolution recompute"

  - entity: ProbationCase
    initial_state: ACTIVE
    terminal_states: [LIFTED, DISMISSED]
    transitions:
      - from: ACTIVE
        to: LIFTED
        trigger: "POST /residency-programs/probation-cases/{id}/lift"
        actor: ProgramDirector
        preconditions:
          - "status == ACTIVE (ERR_PROBATION_NOT_ACTIVE)"
        side_effects:
          - "status -> LIFTED"
          - "standing_resolution recompute (GOOD_STANDING only if no ACTIVE remediation and no other open probation)"
      - from: ACTIVE
        to: DISMISSAL_RECOMMENDED
        trigger: "POST /residency-programs/probation-cases/{id}/recommend-dismissal"
        actor: ProgramDirector
        preconditions:
          - "status == ACTIVE (ERR_PROBATION_NOT_ACTIVE)"
        side_effects:
          - "status -> DISMISSAL_RECOMMENDED; recommended_by = X-User-ID"
      - from: DISMISSAL_RECOMMENDED
        to: DISMISSED
        trigger: "POST /residency-programs/probation-cases/{id}/confirm-dismissal"
        actor: DesignatedInstitutionalOfficial
        preconditions:
          - "status == DISMISSAL_RECOMMENDED (ERR_PROBATION_NOT_RECOMMENDED)"
          - "Segregation of duties: X-User-ID != recommended_by (ERR_DISMISSAL_CONFIRMATION_CONFLICT)"
        side_effects:
          - "status -> DISMISSED"
          - "Resident.lifecycle_status -> DISMISSED (from ACTIVE or ON_LEAVE)"
          - "Recompute complement fill fields"

  - entity: AccreditationCitation
    initial_state: OPEN
    terminal_states: [RESOLVED]
    transitions:
      - from: OPEN
        to: RESPONSE_DRAFTED
        trigger: "POST /residency-programs/accreditation-citations/{id}/draft-response"
        actor: ProgramDirector
        preconditions:
          - "status IN {OPEN, ESCALATED} (ERR_CITATION_NOT_DRAFTABLE)"
        side_effects:
          - "status -> RESPONSE_DRAFTED"
          - "program_accreditation_status recompute"
      - from: ESCALATED
        to: RESPONSE_DRAFTED
        trigger: "POST /residency-programs/accreditation-citations/{id}/draft-response"
        actor: ProgramDirector
        preconditions:
          - "status IN {OPEN, ESCALATED} (ERR_CITATION_NOT_DRAFTABLE)"
        side_effects:
          - "status -> RESPONSE_DRAFTED (re-response cycle)"
          - "program_accreditation_status recompute"
      - from: RESPONSE_DRAFTED
        to: RESPONSE_SUBMITTED
        trigger: "POST /residency-programs/accreditation-citations/{id}/submit-response"
        actor: ProgramDirector
        preconditions:
          - "status == RESPONSE_DRAFTED (ERR_CITATION_RESPONSE_NOT_DRAFTED)"
        side_effects: ["status -> RESPONSE_SUBMITTED"]
      - from: RESPONSE_SUBMITTED
        to: RESOLVED
        trigger: "POST /residency-programs/accreditation-citations/{id}/resolve"
        actor: DesignatedInstitutionalOfficial
        preconditions:
          - "status == RESPONSE_SUBMITTED (ERR_CITATION_NOT_RESOLVABLE)"
        side_effects:
          - "status -> RESOLVED; resolution note recorded"
          - "program_accreditation_status recompute (last unresolved SERIOUS resolved -> status drops back)"
      - from: RESPONSE_SUBMITTED
        to: ESCALATED
        trigger: "POST /residency-programs/accreditation-citations/{id}/escalate"
        actor: DesignatedInstitutionalOfficial
        preconditions:
          - "status == RESPONSE_SUBMITTED (ERR_CITATION_NOT_ESCALATABLE)"
        side_effects:
          - "status -> ESCALATED; escalation reason recorded"
          - "program_accreditation_status recompute"

  - entity: AnnualSurvey
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /residency-programs/annual-surveys/{id}/close"
        actor: DesignatedInstitutionalOfficial
        preconditions:
          - "status == OPEN (ERR_SURVEY_NOT_OPEN)"
          - "0.00 <= resident_response_rate <= 100.00 and 0.00 <= faculty_response_rate <= 100.00 and every area compliance_pct within 0.00..100.00 (ERR_INVALID_SURVEY_RATE)"
        side_effects:
          - "status -> CLOSED; flagged_area_count computed"
          - "If resident_response_rate < 70.00: create AccreditationCitation (area_code RESPONSE_RATE, citation_code SURVEY-RESPONSE_RATE-<year_label>, severity WARNING, annual_survey_id set)"
          - "If faculty_response_rate < 70.00: create AccreditationCitation (area_code RESPONSE_RATE, citation_code SURVEY-FACULTY-<year_label>, severity WARNING, annual_survey_id set)"
          - "For each flagged area (compliance_pct < 70.00): create AccreditationCitation (area_code = area, citation_code SURVEY-<area>-<year_label>, severity SERIOUS if flagged_area_count >= 3 else WARNING, annual_survey_id set)"
          - "program_accreditation_status recompute (>= 2 unresolved SERIOUS -> PROBATIONARY; >= 1 -> CONTINUED_WITH_WARNING) which then gates ComplementApproval approval"

# =============================================================================
# §1.2.1 Concurrency Rules (true races only; OCC on parent version, HTTP 412)
# =============================================================================
concurrency_rules:
  - rule_id: complement-update-stale-version
    parent_entity: ComplementApproval
    write_endpoint: "PUT /residency-programs/complement-approvals/{id}"
    occ_field: expected_complement_approval_version
    description: |
      Updating a DRAFT or REJECTED ComplementApproval whose version has
      advanced since the client last observed it is rejected. A PUT does not
      change status, so a stale second writer would otherwise silently
      overwrite the first writer's positions/budget edits.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: rotation-update-stale-version
    parent_entity: Rotation
    write_endpoint: "PUT /residency-programs/rotations/{id}"
    occ_field: expected_rotation_version
    description: |
      Updating an ACTIVE Rotation (capacity, min PGY, night-float flag) whose
      version has advanced since the client last observed it is rejected,
      because capacity/eligibility decisions made against the older read are
      no longer well-founded.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: block-diagram-regenerate-stale-year
    parent_entity: AcademicYear
    write_endpoint: "POST /residency-programs/academic-years/{id}/regenerate-blocks"
    occ_field: expected_academic_year_version
    description: |
      Regenerating the block diagram of a PLANNING year whose version has
      advanced since the client last observed it is rejected: regeneration
      legitimately supersedes the existing 13 blocks, and a writer holding an
      older version is acting on a superseded diagram.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: official_weekly_duty_hours
    trigger: "duty-hour log attest/void; moonlighting approve/revoke/standing sweep; read of duty-hour summary"
    algorithm: aggregation
    formula: |
      For resident R and ISO week W (Monday 00:00:00Z .. Sunday 24:00:00Z):
        clinical = sum(duration_hours of DutyHourLog where resident=R,
                       status == ATTESTED, started_at within W)
        moon     = sum over MoonlightingRequest of R with
                       status IN {APPROVED, ACTIVE, COMPLETED} and
                       [start_date, end_date) intersecting W of
                       round_half_up(hours_per_week * overlap_days / 7, 2)
                   where overlap_days = number of calendar days of the
                   half-open range falling inside W (1..7)
        official_weekly = clinical + moon
      Rolling 4-week average over the window of 4 ISO weeks ending with the
      week containing the reference date (current clock week for checks, the
      log's week for detection):
        rolling_avg_official = (sum of official_weekly over those 4 weeks) / 4
      Constants divide by 4 even when fewer than 4 weeks contain data.
    input_set: "DutyHourLog status ATTESTED only; MoonlightingRequest status IN {APPROVED, ACTIVE, COMPLETED} only"
    constants:
      WEEKS_IN_WINDOW: 4
      HOURS_LIMIT: 80.00
    precision: "2 decimal places, round_half_up; moonlighting attribution rounded per week before summing"
    variants:
      - name: projected
        when: "moonlighting approval headroom check (moonlighting_headroom_check) and the projected fields of the duty-hour summary"
        difference: "ALSO includes DutyHourLog status SUBMITTED (unattested) in clinical; identical moonlighting attribution otherwise; yields a higher-or-equal value than official for identical data"

  - name: duty_hour_violation_detection
    trigger: "system, immediately after a DutyHourLog transitions SUBMITTED -> ATTESTED"
    algorithm: threshold
    formula: |
      Let L be the newly attested log of resident R, d = date(L.started_at).
      Rule HOURS_80_AVG:
        window = the 4 ISO weeks ending with the week containing d
        avg = rolling_avg_official(R, window)  [official variant]
        if avg > 80.00: create DutyHourViolation(rule_code=HOURS_80_AVG,
          window=window, measured_value=round(avg,2), threshold_value=80.00)
      Rule REST_8H:
        prev = the ATTESTED log of R with the greatest ended_at strictly
               before L.started_at (tie-break: latest created_at)
        if prev exists and gap = L.started_at - prev.ended_at < 8.00 hours:
          create DutyHourViolation(rule_code=REST_8H,
            window=[prev.ended_at, L.started_at],
            measured_value=round(gap_hours,2), threshold_value=8.00)
      Rule DAY_OFF_4_IN_28:
        window = [d - 27 days, d] (dates, inclusive)
        worked_days = count of distinct calendar dates in window having at
                      least one ATTESTED log of R (by started_at date)
        days_off = 28 - worked_days
        if days_off < 4: create DutyHourViolation(rule_code=DAY_OFF_4_IN_28,
          window=window, measured_value=days_off, threshold_value=4)
      Dedup: skip creating a violation if an UNRESOLVED (FLAGGED/ACKNOWLEDGED)
      violation already exists for R with the same rule_code and identical
      window_start/window_end.
      Aftermath: if the count of UNRESOLVED violations for R within the
      current ACTIVE academic year reaches >= 3 and no ACTIVE RemediationPlan
      exists for R, auto-create that plan (see DutyHourLog ATTESTED side
      effects) -> standing cascade -> moonlighting sweep.
    input_set: "ATTESTED logs only; moonlighting attribution per official_weekly_duty_hours"
    constants:
      HOURS_LIMIT: 80.00
      REST_MIN_HOURS: 8.00
      DAY_OFF_WINDOW_DAYS: 28
      DAY_OFF_MIN: 4
      AUTO_REMEDIATION_THRESHOLD: 3
    precision: "2 decimal places, round_half_up; boundaries are strict: avg == 80.00 passes, avg > 80.00 violates; gap == 8.00 passes, gap < 8.00 violates; days_off == 4 passes, days_off < 4 violates"

  - name: moonlighting_headroom_check
    trigger: "POST /residency-programs/moonlighting-requests/{id}/approve"
    algorithm: threshold
    formula: |
      Evaluation order is pinned (circular-looking dependency: the candidate
      request participates in the aggregate that gates it):
        1. base = rolling_avg_projected(R) over the 4 ISO weeks ending with
           the current clock week, EXCLUDING the candidate request itself
           (projected variant: SUBMITTED logs count; requests in
           {APPROVED, ACTIVE, COMPLETED} attribute hours)
        2. decision_value = base + candidate.hours_per_week
        3. approve iff decision_value <= 80.00 (equality passes)
      Rationale: approving request R changes the very aggregate used to gate
      R, so the candidate MUST be excluded from step 1 and added exactly once
      in step 2.
    input_set: "logs SUBMITTED+ATTESTED; requests {APPROVED, ACTIVE, COMPLETED} except candidate"
    constants:
      HOURS_LIMIT: 80.00
    precision: "2 decimal places, round_half_up"

  - name: resident_year_stipend
    trigger: "ComplementApproval create/update; activation funding check"
    algorithm: aggregation
    formula: |
      per_block_stipend_cents = round_half_up(blended_stipend_cents / 13)
      resident_year_stipend_cents = per_block_stipend_cents * 13
      PINNED ROUNDING ORDER: round per block FIRST, then multiply by the 13
      blocks. The reverse order (round the annual figure only) yields a
      different integer and is forbidden.
      Example: blended 6,500,007 -> per-block round_half_up(500,000.538) =
      500,001 -> year cost 6,500,013 (NOT 6,500,007).
    input_set: "single ComplementApproval row"
    constants:
      BLOCKS_PER_YEAR: 13
    precision: "integer cents, round_half_up at the per-block step"

  - name: complement_fill
    trigger: "resident activate / place-on-leave / return-from-leave / transfer / graduate / dismissal; read of ComplementApproval"
    algorithm: aggregation
    formula: |
      Residents of the program with pgy_level == row.pgy_level and
      lifecycle_status IN {ACTIVE, ON_LEAVE}:
        filled_headcount      = count(residents)                    [ON_LEAVE counts 1]
        filled_funded_census  = sum(weight), weight = 1.0 if ACTIVE
                                else 0.5 if ON_LEAVE                [2 dp]
      consumed_census_cost_cents = round_half_up(filled_funded_census *
        resident_year_stipend_cents)
    input_set: "Residents lifecycle_status IN {ACTIVE, ON_LEAVE}; INCOMING / GRADUATED / DISMISSED / TRANSFERRED excluded"
    precision: "census 2 decimal places; cost integer cents round_half_up"
    variants:
      - name: headcount
        when: "ACGME complement cap enforcement at activation (ERR_COMPLEMENT_EXCEEDED)"
        difference: "ON_LEAVE residents count as a full 1.0 position"
      - name: funded_census
        when: "funding-cap consumption at activation (ERR_FUNDING_CAP_EXCEEDED)"
        difference: "ON_LEAVE residents count as 0.5 position, so the same roster consumes less funding than headcount — the two variants diverge for identical data"

  - name: effective_funded_positions
    trigger: "ComplementApproval create/update; displayed on read"
    algorithm: threshold
    formula: |
      effective_funded_positions = min(approved_positions,
        floor(annual_funding_budget_cents / resident_year_stipend_cents))
      (resident_year_stipend_cents from resident_year_stipend, rounding
      order pinned there)
    input_set: "single ComplementApproval row"
    precision: "integer positions, floor"

  - name: case_log_progress
    trigger: "case log verify / void / reject+resubmit; read of case-progress; graduation gate"
    algorithm: aggregation
    formula: |
      For resident R, CaseRequirement Q (category C):
        verified_primary = count(ProcedureCaseLog of R with status VERIFIED,
                                 procedure_category == C, role == SURGEON)
        verified_assist  = count(... role == ASSIST)
        assist_credit    = min(round_half_up(verified_assist * 0.5, 2),
                               round_half_up(0.25 * Q.required_count, 2))
        effective_cases  = verified_primary + assist_credit
        requirement_met  = (effective_cases >= Q.required_count)
                           AND (verified_primary >= Q.required_primary_count)
      Non-linear: the assist contribution is capped at 25% of required_count,
      so past the cap additional ASSIST logs add nothing (nested min with a
      conditional primary floor). Graduation requires requirement_met for
      EVERY CaseRequirement of the program.
    input_set: "ProcedureCaseLog status VERIFIED only (LOGGED/REJECTED/VOIDED excluded)"
    constants:
      ASSIST_WEIGHT: 0.5
      ASSIST_CAP_RATIO: 0.25
    precision: "2 decimal places, round_half_up"

  - name: milestone_composite_level
    trigger: "CCCReview finalize (stored into composite_snapshot)"
    algorithm: weighted_scoring
    formula: |
      For each of the 6 competencies, over the MilestoneEvaluations of
      (resident, academic_year_id, reporting_period):
        weight_i = 2.0 if evaluation.evaluator_role == PROGRAM_DIRECTOR
                   else 1.0 (FACULTY)
        composite = round_half_up( sum(level_i * weight_i) / sum(weight_i), 1 )
      Rounding is applied once, at the end, to 1 decimal place.
    input_set: "all MilestoneEvaluations matching (resident, year, period); >= 3 enforced at finalize"
    constants:
      PD_WEIGHT: 2.0
      FACULTY_WEIGHT: 1.0
    precision: "1 decimal place, round_half_up"

  - name: standing_resolution
    trigger: "after every RemediationPlan or ProbationCase mutation (create, complete, cancel, lift, recommend, confirm)"
    algorithm: constraint_propagation
    formula: |
      standing_status =
        ON_PROBATION      if any ProbationCase of resident has status IN
                          {ACTIVE, DISMISSAL_RECOMMENDED}
        UNDER_REMEDIATION else if any RemediationPlan of resident has
                          status == ACTIVE
        GOOD_STANDING     otherwise
      Whenever the recomputed value leaves GOOD_STANDING, run the
      moonlighting sweep (APPROVED/ACTIVE -> REVOKED, decision_reason
      STANDING_CHANGE) and recompute weekly duty-hour aggregates. Returning
      to GOOD_STANDING never reinstates revoked requests.
    input_set: "all RemediationPlan and ProbationCase rows of the resident"
    precision: "n/a"

  - name: program_accreditation_status
    trigger: "citation create/draft/resolve/escalate; survey close cascade"
    algorithm: threshold
    formula: |
      unresolved = AccreditationCitations of program with status IN
                   {OPEN, RESPONSE_DRAFTED, RESPONSE_SUBMITTED, ESCALATED}
      serious_unresolved = count(unresolved with severity == SERIOUS)
      accreditation_status =
        PROBATIONARY            if serious_unresolved >= 2
        CONTINUED_WITH_WARNING  else if serious_unresolved >= 1
        CONTINUED               otherwise
    input_set: "all AccreditationCitation rows of the program"
    constants:
      PROBATIONARY_SERIOUS_COUNT: 2
    precision: "n/a"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority; first failure wins)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present; X-User-Role names a declared role"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all endpoints"

  - priority: 1.5
    category: auth
    check: "Request body schema: all required input fields present, types match, enum values within the declared sets (e.g., specialty, type, role, outcome, competency codes)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all endpoints with a request body"

  - priority: 2
    category: auth
    check: "Role is listed in the endpoint's roles"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: "all endpoints"

  - priority: 3
    category: auth
    check: "Entity-backed ownership and segregation-of-duties: Resident-role calls may only touch rows whose resident FK equals X-User-ID (ERR_OWNERSHIP_VIOLATION); CCC finalize chair must not be one of the period's evaluators (ERR_COMMITTEE_ROLE_CONFLICT); confirm-dismissal X-User-ID must differ from recommended_by (ERR_DISMISSAL_CONFIRMATION_CONFLICT)"
    error_id: "ERR_OWNERSHIP_VIOLATION | ERR_COMMITTEE_ROLE_CONFLICT | ERR_DISMISSAL_CONFIRMATION_CONFLICT"
    http_status: 403
    applies_to: "Resident-owned mutations; CCCReview finalize; ProbationCase confirm-dismissal"

  - priority: 4
    category: existence
    check: "Every id referenced in path and body exists, validated left-to-right (path first, then body fields in declared input order)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with resource ids"

  - priority: 5
    category: concurrency
    check: "OCC: expected_<parent>_version (when the endpoint declares it) must equal the parent's current version; checked BEFORE any business rule"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "PUT /residency-programs/complement-approvals/{id}; PUT /residency-programs/rotations/{id}; POST /residency-programs/academic-years/{id}/regenerate-blocks"

  - priority: 6
    category: state
    check: "Target resource state machine precondition holds (each transition lists its specific error: ERR_RESIDENT_NOT_INCOMING, ERR_ACADEMIC_YEAR_NOT_ACTIVE, ERR_ACADEMIC_YEAR_NOT_PLANNING, ERR_RESIDENT_NOT_ACTIVE, ERR_RESIDENT_NOT_ON_LEAVE, ERR_COMPLEMENT_NOT_*, ERR_ROTATION_NOT_ACTIVE, ERR_ASSIGNMENT_NOT_*, ERR_LOG_NOT_*, ERR_VIOLATION_NOT_OPEN, ERR_MOONLIGHTING_NOT_*, ERR_CCC_*, ERR_CASE_LOG_NOT_*, ERR_REMEDIATION_NOT_ACTIVE, ERR_PROBATION_NOT_*, ERR_CITATION_*, ERR_SURVEY_NOT_OPEN)"
    error_id: "the transition-specific ERR_* listed in state_machines preconditions"
    http_status: 409
    applies_to: "all action endpoints"

  - priority: 7
    category: business_safety
    check: "Resident-safety/regulatory gates: duty log duration <= 28.00h (ERR_SHIFT_LENGTH_VIOLATION); night-float rotation barred to ON_PROBATION residents (ERR_PROBATION_NIGHT_FLOAT_BLOCKED); moonlighting create/approve requires GOOD_STANDING (ERR_STANDING_BLOCKS_MOONLIGHTING); complement approve barred while program PROBATIONARY (ERR_PROGRAM_PROBATIONARY)"
    error_id: "ERR_SHIFT_LENGTH_VIOLATION | ERR_PROBATION_NIGHT_FLOAT_BLOCKED | ERR_STANDING_BLOCKS_MOONLIGHTING | ERR_PROGRAM_PROBATIONARY"
    http_status: "422 | 403 | 403 | 403"
    applies_to: "duty-hour-log create; rotation-assignment create; moonlighting create/approve; complement approve"

  - priority: 8
    category: business_temporal
    check: "Temporal bounds: academic year span exactly 364 days (ERR_INVALID_YEAR_SPAN); duty log started_at and case log performed_date inside an ACTIVE year of the program (ERR_DATE_OUT_OF_ACTIVE_YEAR); moonlighting start_date < end_date (ERR_INVALID_DATE_RANGE)"
    error_id: "ERR_INVALID_YEAR_SPAN | ERR_DATE_OUT_OF_ACTIVE_YEAR | ERR_INVALID_DATE_RANGE"
    http_status: 422
    applies_to: "year create; duty-hour-log create; procedure-case-log create; moonlighting create"

  - priority: 9
    category: business_constraint
    check: "Constraint satisfaction: one survey per (program, year) (ERR_SURVEY_EXISTS); one non-FINALIZED CCC review per (resident, year, period) (ERR_CCC_REVIEW_EXISTS); one CaseRequirement per (program, category) (ERR_REQUIREMENT_EXISTS); single non-LOCKED approved complement per triple (ERR_COMPLEMENT_ALREADY_APPROVED at approve); assignment PGY eligibility (ERR_PGY_INELIGIBLE); one non-CANCELLED assignment per (resident, block) (ERR_BLOCK_ASSIGNMENT_CONFLICT); rotation capacity per block (ERR_ROTATION_CAPACITY_FULL); log overlap (ERR_LOG_TIME_OVERLAP); moonlighting overlap among {SUBMITTED, APPROVED, ACTIVE} (ERR_MOONLIGHTING_OVERLAP); CCC quorum >= 3 evaluations (ERR_INSUFFICIENT_EVALUATIONS); graduation gates (ERR_STANDING_NOT_CLEAR, ERR_CASE_REQUIREMENTS_UNMET, ERR_NO_FINALIZED_CCC_REVIEW); second open probation barred (ERR_OPEN_PROBATION_EXISTS); full 6-competency rating sets (ERR_INCOMPLETE_RATINGS); outcome enums (ERR_INVALID_OUTCOME); dismiss justification >= 10 chars (ERR_JUSTIFICATION_REQUIRED); retire with open assignments (ERR_ROTATION_HAS_OPEN_ASSIGNMENTS); year close with unattested logs (ERR_UNATTESTED_LOGS_EXIST)"
    error_id: "per-check ids listed in the check text"
    http_status: "409 | 422 | 400"
    applies_to: "resource-specific mutations"

  - priority: 10
    category: business_referential
    check: "Cross-aggregate consistency: assignment's resident, block's year, and rotation all belong to the same program (ERR_CROSS_PROGRAM_REFERENCE); resident creation requires an APPROVED or LOCKED ComplementApproval for (program, entry year, pgy_level) (ERR_NO_APPROVED_COMPLEMENT); evaluation/CCC/survey year belongs to the same program as the resident/survey subject (ERR_CROSS_PROGRAM_REFERENCE)"
    error_id: "ERR_CROSS_PROGRAM_REFERENCE | ERR_NO_APPROVED_COMPLEMENT"
    http_status: "400 | 409"
    applies_to: "rotation-assignment create; resident create; milestone-evaluation create; ccc-review create; annual-survey create"

  - priority: 11
    category: business_fiscal
    check: "Fiscal gates, checked LAST: activation headcount filled_headcount + 1 <= approved_positions (ERR_COMPLEMENT_EXCEEDED); activation funding round_half_up((filled_funded_census + 1.0) * resident_year_stipend_cents) <= annual_funding_budget_cents (ERR_FUNDING_CAP_EXCEEDED)"
    error_id: "ERR_COMPLEMENT_EXCEEDED | ERR_FUNDING_CAP_EXCEEDED"
    http_status: "409 | 402"
    applies_to: "resident activate"

# =============================================================================
# §1.5 API Endpoint Table
# Read endpoints admit every declared role. All mutations bump the target
# entity's version by 1 and refresh updated_at (common_fields rule).
# =============================================================================
endpoints:
  # --- logical clock (test-driving; default 2026-08-01T00:00:00Z) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Before any call, the clock reads exactly 2026-08-01T00:00:00Z and never falls back to wall-clock time. Setting the clock applies time-driven system transitions (moonlighting APPROVED->ACTIVE at start_date, APPROVED/ACTIVE->COMPLETED at end_date)."
    roles: [ProgramCoordinator, ProgramDirector, DesignatedInstitutionalOfficial]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["moonlighting clock transitions fire"]

  # --- ResidencyProgram ---
  - method: POST
    path: "/residency-programs"
    description: "Create a residency program"
    roles: [DesignatedInstitutionalOfficial]
    code: 201
    input: [name, specialty, acgme_program_code]
    output: ResidencyProgram
    side_effects: ["accreditation_status initialized to CONTINUED"]

  - method: GET
    path: "/residency-programs"
    description: "List residency programs"
    roles: [DesignatedInstitutionalOfficial, ProgramDirector, ProgramCoordinator, FacultyEvaluator, CCCChair, Resident]
    code: 200
    input: ["specialty?", "limit?", "offset?"]
    output: "ResidencyProgram[]"
    side_effects: []

  - method: GET
    path: "/residency-programs/{id}"
    description: "Get one residency program"
    roles: [DesignatedInstitutionalOfficial, ProgramDirector, ProgramCoordinator, FacultyEvaluator, CCCChair, Resident]
    code: 200
    input: []
    output: ResidencyProgram
    side_effects: []

  # --- AcademicYear ---
  - method: POST
    path: "/residency-programs/academic-years"
    description: "Create an academic year; span must be exactly 364 days; auto-generates 13 CURRENT ScheduleBlocks (28 days each)"
    roles: [ProgramCoordinator]
    code: 201
    input: [program_id, year_label, start_date, end_date]
    output: AcademicYear
    side_effects: ["13 ScheduleBlocks created (block_index 1..13, status CURRENT)"]

  - method: GET
    path: "/residency-programs/academic-years"
    description: "List academic years"
    roles: [DesignatedInstitutionalOfficial, ProgramDirector, ProgramCoordinator, FacultyEvaluator, CCCChair, Resident]
    code: 200
    input: ["program_id?", "status?", "limit?", "offset?"]
    output: "AcademicYear[]"
    side_effects: []

  - method: GET
    path: "/residency-programs/academic-years/{id}"
    description: "Get one academic year"
    roles: [DesignatedInstitutionalOfficial, ProgramDirector, ProgramCoordinator, FacultyEvaluator, CCCChair, Resident]
    code: 200
    input: []
    output: AcademicYear
    side_effects: []

  - method: POST
    path: "/residency-programs/academic-years/{id}/activate"
    description: "Activate a PLANNING year"
    roles: [ProgramCoordinator]
    code: 200
    input: []
    output: AcademicYear
    side_effects: ["status -> ACTIVE; increments AcademicYear.version by 1"]

  - method: POST
    path: "/residency-programs/academic-years/{id}/close"
    description: "Close an ACTIVE year (requires no SUBMITTED duty logs program-wide)"
    roles: [ProgramCoordinator]
    code: 200
    input: []
    output: AcademicYear
    side_effects: ["status -> CLOSED; increments AcademicYear.version by 1"]

  - method: POST
    path: "/residency-programs/academic-years/{id}/regenerate-blocks"
    description: "Supersede all CURRENT blocks of a PLANNING year and create 13 fresh CURRENT blocks (OCC on year version)"
    roles: [ProgramCoordinator]
    code: 200
    input: [expected_academic_year_version]
    output: AcademicYear
    side_effects: ["old blocks -> SUPERSEDED", "13 new CURRENT blocks", "increments AcademicYear.version by 1"]

  # --- ScheduleBlock ---
  - method: GET
    path: "/residency-programs/schedule-blocks"
    description: "List schedule blocks; results sorted by block_index ascending (deterministic for index-based capture)"
    roles: [DesignatedInstitutionalOfficial, ProgramDirector, ProgramCoordinator, FacultyEvaluator, CCCChair, Resident]
    code: 200
    input: ["academic_year_id?", "status?", "limit?", "offset?"]
    output: "ScheduleBlock[]"
    side_effects: []

  - method: GET
    path: "/residency-programs/schedule-blocks/{id}"
    description: "Get one schedule block"
    roles: [DesignatedInstitutionalOfficial, ProgramDirector, ProgramCoordinator, FacultyEvaluator, CCCChair, Resident]
    code: 200
    input: []
    output: ScheduleBlock
    side_effects: []

  # --- ComplementApproval ---
  - method: POST
    path: "/residency-programs/complement-approvals"
    description: "Create a DRAFT complement row for (program, year, pgy_level)"
    roles: [ProgramDirector]
    code: 201
    input: [program_id, academic_year_id, pgy_level, approved_positions, annual_funding_budget_cents, blended_stipend_cents]
    output: ComplementApproval
    side_effects: ["resident_year_stipend_cents and effective_funded_positions computed"]

  - method: GET
    path: "/residency-programs/complement-approvals"
    description: "List complement rows"
    roles: [DesignatedInstitutionalOfficial, ProgramDirector, ProgramCoordinator, FacultyEvaluator, CCCChair, Resident]
    code: 200
    input: ["program_id?", "academic_year_id?", "status?", "limit?", "offset?"]
    output: "ComplementApproval[]"
    side_effects: []

  - method: GET
    path: "/residency-programs/complement-approvals/{id}"
    description: "Get one complement row"
    roles: [DesignatedInstitutionalOfficial, ProgramDirector, ProgramCoordinator, FacultyEvaluator, CCCChair, Resident]
    code: 200
    input: []
    output: ComplementApproval
    side_effects: []

  - method: PUT
    path: "/residency-programs/complement-approvals/{id}"
    description: "Edit a DRAFT or REJECTED complement row (OCC)"
    roles: [ProgramDirector]
    code: 200
    input: ["approved_positions?", "annual_funding_budget_cents?", "blended_stipend_cents?", expected_complement_approval_version]
    output: ComplementApproval
    side_effects: ["recompute resident_year_stipend_cents and effective_funded_positions", "increments ComplementApproval.version by 1"]

  - method: POST
    path: "/residency-programs/complement-approvals/{id}/submit"
    description: "Submit a DRAFT or REJECTED complement row"
    roles: [ProgramDirector]
    code: 200
    input: []
    output: ComplementApproval
    side_effects: ["status -> SUBMITTED; increments ComplementApproval.version by 1"]

  - method: POST
    path: "/residency-programs/complement-approvals/{id}/approve"
    description: "DIO approves a SUBMITTED row (blocked while program PROBATIONARY or another approved row exists for the triple)"
    roles: [DesignatedInstitutionalOfficial]
    code: 200
    input: []
    output: ComplementApproval
    side_effects: ["status -> APPROVED; increments ComplementApproval.version by 1"]

  - method: POST
    path: "/residency-programs/complement-approvals/{id}/reject"
    description: "DIO rejects a SUBMITTED row"
    roles: [DesignatedInstitutionalOfficial]
    code: 200
    input: []
    output: ComplementApproval
    side_effects: ["status -> REJECTED; increments ComplementApproval.version by 1"]

  - method: POST
    path: "/residency-programs/complement-approvals/{id}/lock"
    description: "DIO locks an APPROVED row (terminal; blocks further edits)"
    roles: [DesignatedInstitutionalOfficial]
    code: 200
    input: []
    output: ComplementApproval
    side_effects: ["status -> LOCKED; increments ComplementApproval.version by 1"]

  # --- Resident ---
  - method: POST
    path: "/residency-programs/residents"
    description: "Enroll a resident (INCOMING); requires an APPROVED/LOCKED complement for (program, entry year, pgy_level)"
    roles: [ProgramCoordinator]
    code: 201
    input: [program_id, entry_academic_year_id, pgy_level, full_name, email, hire_date, expected_graduation_date]
    output: Resident
    side_effects: ["lifecycle_status INCOMING; standing_status GOOD_STANDING"]

  - method: GET
    path: "/residency-programs/residents"
    description: "List residents"
