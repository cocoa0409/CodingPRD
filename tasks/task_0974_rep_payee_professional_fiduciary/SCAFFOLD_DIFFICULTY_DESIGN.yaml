scaffold_difficulty_design:
  # =====================================================================
  # Rule 1 — dual_variant_calc (2 instances, different entity domains)
  # =====================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: report_cash_vs_accrual_basis_divergence
        grounds:
          - calculations.report_totals
          - entities.AccountingReport.fields.basis
          - state_machines.AccountingReport.DRAFTING_to_SUBMITTED
        distinguishing_aspect: |
          AccountingReport domain: identical period and identical underlying
          deposits/disbursements produce receipts_total 100000 vs 150000 and
          disbursements_total 30000 vs 42000 purely from the CASH vs ACCRUAL
          basis variant — a different entity domain than the spend-down variant.
        test_recipe:
          setup:
            - "ACTIVE client with VERIFIED SSI entitlement (80000/mo, from 2026-01-01), OPERATING account, ACTIVE bond 5000000, APPROVED 2026-05 budget (basis 200000, HOUSING 100%)"
            - "D1 deposit 100000 POSTED 2026-05-05; D2 deposit 50000 RECEIVED 2026-05-20 (never posted); W1 30000 RELEASED 2026-05-12; W2 12000 APPROVED scheduled 2026-05-25 (never released)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-05T00:00:00Z" }, as: FiduciaryAdmin }
            - { call: "POST /clients", payload: { legal_name: "Ada Byron", date_of_birth: "1950-03-04", ssn_last4: "1234", county_of_residence: "TRV", medicaid_enrolled: false }, as: FiduciaryAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /benefit-entitlements", payload: { client_id: "${c_id}", claim_type: "SSI", monthly_benefit_cents: 80000, effective_start_date: "2026-01-01" }, as: FiduciaryAdmin, captures: { e_id: $.data.id } }
            - { call: "POST /benefit-entitlements/${e_id}/verify", payload: {}, as: FiduciaryAdmin }
            - { call: "POST /trust-accounts", payload: { client_id: "${c_id}", account_type: "OPERATING", bank_account_ref: "BA-R1-001" }, as: FinancialOfficer, captures: { a_id: $.data.id } }
            - { call: "POST /clients/${c_id}/activate", payload: {}, as: FiduciaryAdmin }
            - { call: "POST /surety-bonds", payload: { coverage_amount_cents: 5000000, coverage_start_date: "2026-01-01", coverage_end_date: "2027-01-01", premium_paid_through_date: "2026-12-31" }, as: FiduciaryAdmin, captures: { b_id: $.data.id } }
            - { call: "POST /surety-bonds/${b_id}/activate", payload: {}, as: FiduciaryAdmin }
            - { call: "POST /deposits", payload: { account_id: "${a_id}", source: "SSA_BENEFIT", amount_cents: 100000, received_date: "2026-05-05", entitlement_id: "${e_id}" }, as: FinancialOfficer, captures: { d1_id: $.data.id } }
            - { call: "POST /deposits/${d1_id}/post", payload: {}, as: FinancialOfficer }
            - { call: "GET /clients/${c_id}", payload: {}, as: FiduciaryAdmin, captures: { c_v: $.data.version } }
            - { call: "POST /budget-plans", payload: { client_id: "${c_id}", period_month: "2026-05", source_benefit_cents: 200000, lines: [{ category: "HOUSING", percent: 100 }], expected_client_version: "${c_v}" }, as: CaseManager, as_user_id: "cm-1", captures: { p_id: $.data.id } }
            - { call: "POST /budget-plans/${p_id}/propose", payload: {}, as: CaseManager, as_user_id: "cm-1" }
            - { call: "POST /budget-plans/${p_id}/approve", payload: {}, as: FinancialOfficer, as_user_id: "fo-1" }
            - { call: "POST /disbursements", payload: { client_id: "${c_id}", account_id: "${a_id}", budget_plan_id: "${p_id}", payee_name: "Landlord LLC", category: "HOUSING", amount_cents: 30000, scheduled_release_date: "2026-05-12" }, as: CaseManager, as_user_id: "cm-1", captures: { w1_id: $.data.id } }
            - { call: "POST /disbursements/${w1_id}/approve", payload: {}, as: FinancialOfficer, as_user_id: "fo-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-12T00:00:00Z" }, as: FiduciaryAdmin }
            - { call: "POST /disbursements/${w1_id}/release", payload: {}, as: FinancialOfficer, as_user_id: "fo-1" }
            - { call: "POST /deposits", payload: { account_id: "${a_id}", source: "PENSION", amount_cents: 50000, received_date: "2026-05-20" }, as: FinancialOfficer, captures: { d2_id: $.data.id } }
            - { call: "POST /disbursements", payload: { client_id: "${c_id}", account_id: "${a_id}", budget_plan_id: "${p_id}", payee_name: "Pharmacy Inc", category: "HOUSING", amount_cents: 12000, scheduled_release_date: "2026-05-25" }, as: CaseManager, as_user_id: "cm-1", captures: { w2_id: $.data.id } }
            - { call: "POST /disbursements/${w2_id}/approve", payload: {}, as: FinancialOfficer, as_user_id: "fo-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-10T00:00:00Z" }, as: FiduciaryAdmin }
            - { call: "POST /accounting-reports", payload: { client_id: "${c_id}", report_type: "SSA_6233", period_start_date: "2026-05-01", period_end_date: "2026-05-31", basis: "CASH" }, as: CaseManager, as_user_id: "cm-1", captures: { r_cash: $.data.id } }
            - { call: "POST /accounting-reports", payload: { client_id: "${c_id}", report_type: "COURT_ANNUAL", period_start_date: "2026-05-01", period_end_date: "2026-05-31", basis: "ACCRUAL" }, as: CaseManager, as_user_id: "cm-1", captures: { r_acc: $.data.id } }
          trigger:
            - { call: "POST /accounting-reports/${r_cash}/submit", payload: {}, as: FinancialOfficer, as_user_id: "fo-1", captures: { cash_receipts: $.data.receipts_total_cents, cash_disb: $.data.disbursements_total_cents, cash_open: $.data.opening_balance_cents, cash_end: $.data.ending_balance_cents, cash_due: $.data.due_date } }
            - { call: "POST /accounting-reports/${r_acc}/submit", payload: {}, as: FinancialOfficer, as_user_id: "fo-1", captures: { acc_receipts: $.data.receipts_total_cents, acc_disb: $.data.disbursements_total_cents, acc_end: $.data.ending_balance_cents } }
          assert:
            - "cash_receipts == 100000 and cash_disb == 30000 and cash_open == 0 and cash_end == 70000"
            - "acc_receipts == 150000 and acc_disb == 42000 and acc_end == 108000"
            - "cash_end != acc_end (70000 vs 108000 — divergence 38000 from identical rows)"
            - "cash_due == '2026-06-30' (period_end + 30 days)"

      - name: spend_down_provisional_vs_final_divergence
        grounds:
          - calculations.spend_down_excess
          - entities.SpendDownPlan.fields.provisional_excess_cents
          - entities.SpendDownPlan.fields.final_excess_cents
          - state_machines.SpendDownPlan.ACTIVE_to_MET
        distinguishing_aspect: |
          SpendDownPlan/Medicaid domain (different from AccountingReport):
          PROVISIONAL adds expected_inflow (VERIFIED benefit 80000) giving 30000;
          FINAL uses only actual countable resources at finalize giving 0 —
          same plan row, two variants, different numbers.
        test_recipe:
          setup:
            - "ACTIVE medicaid_enrolled client (limit default 200000), VERIFIED SSI 80000/mo from 2026-01-01 open-ended, OPERATING account with 150000 posted, ACTIVE bond, APPROVED 2026-06 budget (basis 200000, MEDICAL 100%)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-05T00:00:00Z" }, as: FiduciaryAdmin }
            - { call: "POST /clients", payload: { legal_name: "Marcus Reed", date_of_birth: "1962-07-11", ssn_last4: "5678", county_of_residence: "TRV", medicaid_enrolled: true }, as: FiduciaryAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /benefit-entitlements", payload: { client_id: "${c_id}", claim_type: "SSI", monthly_benefit_cents: 80000, effective_start_date: "2026-01-01" }, as: FiduciaryAdmin, captures: { e_id: $.data.id } }
            - { call: "POST /benefit-entitlements/${e_id}/verify", payload: {}, as: FiduciaryAdmin }
            - { call: "POST /trust-accounts", payload: { client_id: "${c_id}", account_type: "OPERATING", bank_account_ref: "BA-SD-001" }, as: FinancialOfficer, captures: { a_id: $.data.id } }
            - { call: "POST /clients/${c_id}/activate", payload: {}, as: FiduciaryAdmin }
            - { call: "POST /surety-bonds", payload: { coverage_amount_cents: 5000000, coverage_start_date: "2026-01-01", coverage_end_date: "2027-01-01", premium_paid_through_date: "2026-12-31" }, as: FiduciaryAdmin, captures: { b_id: $.data.id } }
            - { call: "POST /surety-bonds/${b_id}/activate", payload: {}, as: FiduciaryAdmin }
            - { call: "POST /deposits", payload: { account_id: "${a_id}", source: "OTHER", amount_cents: 150000, received_date: "2026-06-02" }, as: FinancialOfficer, captures: { d_id: $.data.id } }
            - { call: "POST /deposits/${d_id}/post", payload: {}, as: FinancialOfficer }
            - { call: "POST /spend-down-plans", payload: { client_id: "${c_id}", target_month: "2026-06", entries: [{ category: "MEDICAL", planned_amount_cents: 40000 }] }, as: CaseManager, as_user_id: "cm-1", captures: { sp_id: $.data.id, sp_prov: $.data.provisional_excess_cents } }
            - { call: "POST /spend-down-plans/${sp_id}/activate", payload: {}, as: CaseManager, as_user_id: "cm-1" }
            - { call: "GET /clients/${c_id}", payload: {}, as: FiduciaryAdmin, captures: { c_v: $.data.version } }
            - { call: "POST /budget-plans", payload: { client_id: "${c_id}", period_month: "2026-06", source_benefit_cents: 200000, lines: [{ category: "MEDICAL", percent: 100 }], expected_client_version: "${c_v}" }, as: CaseManager, as_user_id: "cm-1", captures: { bp_id: $.data.id } }
            - { call: "POST /budget-plans/${bp_id}/propose", payload: {}, as: CaseManager, as_user_id: "cm-1" }
            - { call: "POST /budget-plans/${bp_id}/approve", payload: {}, as: FinancialOfficer, as_user_id: "fo-1" }
            - { call: "POST /disbursements", payload: { client_id: "${c_id}", account_id: "${a_id}", budget_plan_id: "${bp_id}", payee_name: "Clinic North", category: "MEDICAL", amount_cents: 40000, scheduled_release_date: "2026-06-10", spend_down_plan_id: "${sp_id}" }, as: CaseManager, as_user_id: "cm-1", captures: { w_id: $.data.id } }
            - { call: "POST /disbursements/${w_id}/approve", payload: {}, as: FinancialOfficer, as_user_id: "fo-1" }
            - { call: "POST /disbursements/${w_id}/release", payload: {}, as: FinancialOfficer, as_user_id: "fo-1" }
          trigger:
            - { call: "POST /spend-down-plans/${sp_id}/finalize", payload: {}, as: CaseManager, as_user_id: "cm-1", captures: { sp_final: $.data.final_excess_cents, sp_status: $.data.status } }
          assert:
            - "sp_prov == 30000 (max(0, 150000 + 80000 - 200000))"
            - "sp_final == 0 (max(0, 110000 - 200000) after the 40000 release)"
            - "sp_status == MET"
            - "sp_prov != sp_final — PROVISIONAL and FINAL variants diverge on the same plan"

  # =====================================================================
  # Rule 2 — combinatorial_formula (2 instances, different modes a and b)
  # =====================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: fiduciary_fee_tier_straddle_with_monthly_cap
        grounds:
          - calculations.fiduciary_fee
          - entities.Disbursement.fields.fee_cents
          - state_machines.Disbursement.APPROVED_to_RELEASED
        distinguishing_aspect: |
          Mode (a): >=3 inputs (prior month volume v, this amount, accrued month
          fees) with non-linear interaction — marginal tier selection straddling
          the 300000 breakpoint nested inside min() with the 20000 monthly cap;
          the cap (not the tier math) decides the final 750.
        test_recipe:
          setup:
            - "ACTIVE non-medicaid client, OPERATING account funded with 950000, ACTIVE bond 5000000, APPROVED 2026-06 budget basis 2000000 HOUSING 100%"
            - "Prior June releases: 100000 (fee 5000), 200000 (fee 6000), 550000 (fee 8250) — accrued fees 19250, volume before trigger 850000"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-15T00:00:00Z" }, as: FiduciaryAdmin }
            - { call: "POST /clients", payload: { legal_name: "Ida Fox", date_of_birth: "1948-01-20", ssn_last4: "2468", county_of_residence: "TRV", medicaid_enrolled: false }, as: FiduciaryAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /benefit-entitlements", payload: { client_id: "${c_id}", claim_type: "SSDI", monthly_benefit_cents: 90000, effective_start_date: "2026-01-01" }, as: FiduciaryAdmin, captures: { e_id: $.data.id } }
            - { call: "POST /benefit-entitlements/${e_id}/verify", payload: {}, as: FiduciaryAdmin }
            - { call: "POST /trust-accounts", payload: { client_id: "${c_id}", account_type: "OPERATING", bank_account_ref: "BA-FEE-001" }, as: FinancialOfficer, captures: { a_id: $.data.id } }
            - { call: "POST /clients/${c_id}/activate", payload: {}, as: FiduciaryAdmin }
            - { call: "POST /surety-bonds", payload: { coverage_amount_cents: 5000000, coverage_start_date: "2026-01-01", coverage_end_date: "2027-01-01", premium_paid_through_date: "2026-12-31" }, as: FiduciaryAdmin, captures: { b_id: $.data.id } }
            - { call: "POST /surety-bonds/${b_id}/activate", payload: {}, as: FiduciaryAdmin }
            - { call: "POST /deposits", payload: { account_id: "${a_id}", source: "OTHER", amount_cents: 950000, received_date: "2026-06-10" }, as: FinancialOfficer, captures: { d_id: $.data.id } }
            - { call: "POST /deposits/${d_id}/post", payload: {}, as: FinancialOfficer }
            - { call: "GET /clients/${c_id}", payload: {}, as: FiduciaryAdmin, captures: { c_v: $.data.version } }
            - { call: "POST /budget-plans", payload: { client_id: "${c_id}", period_month: "2026-06", source_benefit_cents: 2000000, lines: [{ category: "HOUSING", percent: 100 }], expected_client_version: "${c_v}" }, as: CaseManager, as_user_id: "cm-1", captures: { p_id: $.data.id } }
            - { call: "POST /budget-plans/${p_id}/propose", payload: {}, as: CaseManager, as_user_id: "cm-1" }
            - { call: "POST /budget-plans/${p_id}/approve", payload: {}, as: FinancialOfficer, as_user_id: "fo-1" }
            - { call: "POST /disbursements", payload: { client_id: "${c_id}", account_id: "${a_id}", budget_plan_id: "${p_id}", payee_name: "Payee A", category: "HOUSING", amount_cents: 100000, scheduled_release_date: "2026-06-15" }, as: CaseManager, as_user_id: "cm-1", captures: { w1_id: $.data.id } }
            - { call: "POST /disbursements/${w1_id}/approve", payload: {}, as: FinancialOfficer, as_user_id: "fo-1" }
            - { call: "POST /disbursements/${w1_id}/release", payload: {}, as: FinancialOfficer, as_user_id: "fo-1", captures: { f1: $.data.fee_cents } }
            - { call: "POST /disbursements", payload: { client_id: "${c_id}", account_id: "${a_id}", budget_plan_id: "${p_id}", payee_name: "Payee B", category: "HOUSING", amount_cents: 200000, scheduled_release_date: "2026-06-15" }, as: CaseManager, as_user_id: "cm-1", captures: { w2_id: $.data.id } }
            - { call: "POST /disbursements/${w2_id}/approve", payload: {}, as: FinancialOfficer, as_user_id: "fo-1" }
            - { call: "POST /disbursements/${w2_id}/release", payload: {}, as: FinancialOfficer, as_user_id: "fo-1", captures: { f2: $.data.fee_cents } }
            - { call: "POST /disbursements", payload: { client_id: "${c_id}", account_id: "${a_id}", budget_plan_id: "${p_id}", payee_name: "Payee C", category: "HOUSING", amount_cents: 550000, scheduled_release_date: "2026-06-15" }, as: CaseManager, as_user_id: "cm-1", captures: { w3_id: $.data.id } }
            - { call: "POST /disbursements/${w3_id}/approve", payload: {}, as: FinancialOfficer, as_user_id: "fo-1" }
            - { call: "POST /disbursements/${w3_id}/release", payload: {}, as: FinancialOfficer, as_user_id: "fo-1", captures: { f3: $.data.fee_cents } }
          trigger:
            - { call: "POST /disbursements", payload: { client_id: "${c_id}", account_id: "${a_id}", budget_plan_id: "${p_id}", payee_name: "Payee D", category: "HOUSING", amount_cents: 100000, scheduled_release_date: "2026-06-15" }, as: CaseManager, as_user_id: "cm-1", captures: { w4_id: $.data.id } }
            - { call: "POST /disbursements/${w4_id}/approve", payload: {}, as: FinancialOfficer, as_user_id: "fo-1" }
            - { call: "POST /disbursements/${w4_id}/release", payload: {}, as: FinancialOfficer, as_user_id: "fo-1", captures: { f4: $.data.fee_cents } }
            - { call: "GET /trust-accounts/${a_id}", payload: {}, as: FinancialOfficer, captures: { bal_end: $.data.balance_cents } }
          assert:
            - "f1 == 5000 (100000 fully in tier1 at 5%)"
            - "f2 == 6000 (v=100000, 200000 fully in tier2 at 3%)"
            - "f3 == 8250 (v=300000, 550000 fully in tier3 at 1.5%)"
            - "f4 == 750 (raw tier3 100000*1.5% = 1500, capped by min(1500, 20000-19250) = 750)"
            - "bal_end == 0 (950000 - 950000; fees are informational, not debited)"

      - name: budget_allocation_per_line_rounding_residual_fold
        grounds:
          - calculations.budget_allocation
          - entities.BudgetPlan.fields.allocated_lines
          - entities.BudgetPlan.fields.total_planned_cents
        distinguishing_aspect: |
          Mode (b) — different mode from the fee tier formula: nested rounding
          where order matters. Per-line round_half_up then residual fold into
          HOUSING (pinned order) yields 33001/33000/34000; computing
          round(sum) or folding into the largest line would give different cents.
        test_recipe:
          setup:
            - "ACTIVE client with VERIFIED entitlement and OPERATING account; no plan yet for 2026-06"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: FiduciaryAdmin }
            - { call: "POST /clients", payload: { legal_name: "Nora Quinn", date_of_birth: "1975-11-02", ssn_last4: "1357", county_of_residence: "TRV", medicaid_enrolled: false }, as: FiduciaryAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /benefit-entitlements", payload: { client_id: "${c_id}", claim_type: "SSI", monthly_benefit_cents: 100001, effective_start_date: "2026-01-01" }, as: FiduciaryAdmin, captures: { e_id: $.data.id } }
            - { call: "POST /benefit-entitlements/${e_id}/verify", payload: {}, as: FiduciaryAdmin }
            - { call: "POST /trust-accounts", payload: { client_id: "${c_id}", account_type: "OPERATING", bank_account_ref: "BA-AL-001" }, as: FinancialOfficer, captures: { a_id: $.data.id } }
            - { call: "POST /clients/${c_id}/activate", payload: {}, as: FiduciaryAdmin }
            - { call: "GET /clients/${c_id}", payload: {}, as: FiduciaryAdmin, captures: { c_v: $.data.version } }
          trigger:
            - { call: "POST /budget-plans", payload: { client_id: "${c_id}", period_month: "2026-06", source_benefit_cents: 100001, lines: [{ category: "HOUSING", percent: 33 }, { category: "FOOD", percent: 33 }, { category: "SAVINGS", percent: 34 }], expected_client_version: "${c_v}" }, as: CaseManager, as_user_id: "cm-1", captures: { p_id: $.data.id, p_total: $.data.total_planned_cents } }
          assert:
            - "allocated_lines HOUSING == 33001 (round_half_up(33000.33) = 33000, then +1 residual folded into HOUSING)"
            - "allocated_lines FOOD == 33000 and SAVINGS == 34000"
            - "p_total == 100001 and SUM(allocated_lines.amount_cents) == 100001 (conservation invariant)"

  # =====================================================================
  # Rule 3 — non_linear_state_machine (2 instances, different entities)
  # =====================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: client_suspend_reactivate_cycle_restores_accounts
        grounds:
          - state_machines.Client.ACTIVE_to_SUSPENDED
          - state_machines.Client.SUSPENDED_to_ACTIVE
          - state_machines.TrustAccount.OPEN_to_FROZEN
          - state_machines.TrustAccount.FROZEN_to_OPEN
        distinguishing_aspect: |
          Client entity: ACTIVE -> SUSPENDED -> ACTIVE is a true cycle (not a
          linear pipeline); each lap of the cycle cascades account FROZEN/OPEN.
          Different entity from the Disbursement fork-join instance.
        test_recipe:
          setup:
            - "Client with VERIFIED entitlement and one OPERATING account, already activated once"
          setup_api_calls:
            - { call: "POST /clients", payload: { legal_name: "Owen Park", date_of_birth: "1958-05-15", ssn_last4: "9753", county_of_residence: "TRV", medicaid_enrolled: false }, as: FiduciaryAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /benefit-entitlements", payload: { client_id: "${c_id}", claim_type: "SSI", monthly_benefit_cents: 80000, effective_start_date: "2026-01-01" }, as: FiduciaryAdmin, captures: { e_id: $.data.id } }
            - { call: "POST /benefit-entitlements/${e_id}/verify", payload: {}, as: FiduciaryAdmin }
            - { call: "POST /trust-accounts", payload: { client_id: "${c_id}", account_type: "OPERATING", bank_account_ref: "BA-CY-001" }, as: FinancialOfficer, captures: { a_id: $.data.id } }
            - { call: "POST /clients/${c_id}/activate", payload: {}, as: FiduciaryAdmin, captures: { v_after_act: $.data.version } }
          trigger:
            - { call: "POST /clients/${c_id}/suspend", payload: {}, as: FiduciaryAdmin, captures: { st1: $.data.status, v_susp: $.data.version } }
            - { call: "GET /trust-accounts/${a_id}", payload: {}, as: FiduciaryAdmin, captures: { a_st1: $.data.status } }
            - { call: "POST /clients/${c_id}/activate", payload: {}, as: FiduciaryAdmin, captures: { st2: $.data.status, v_react: $.data.version } }
            - { call: "GET /trust-accounts/${a_id}", payload: {}, as: FiduciaryAdmin, captures: { a_st2: $.data.status } }
          assert:
            - "st1 == SUSPENDED and a_st1 == FROZEN (cascade link fired)"
            - "st2 == ACTIVE and a_st2 == OPEN (cycle completed back to ACTIVE)"
            - "v_after_act == 2 and v_susp == 3 and v_react == 4 (each transition bumps Client.version by exactly 1)"

      - name: disbursement_conservator_branch_then_join
        grounds:
          - state_machines.Disbursement.REQUESTED_to_APPROVED
          - state_machines.Disbursement.REQUESTED_to_PENDING_CONSERVATOR
          - state_machines.Disbursement.PENDING_CONSERVATOR_to_APPROVED
          - entities.Conservator.fields.authority_scope
        distinguishing_aspect: |
          Disbursement entity: the SAME approve trigger forks to APPROVED
          (no conservator) or PENDING_CONSERVATOR (ACTIVE EXCLUSIVE conservator),
          and the forked branch joins back at APPROVED only via co-approve.
          Different entity and different non-linear shape (fork-join vs cycle).
        test_recipe:
          setup:
            - "Client A (no conservator) and client B (ACTIVE EXCLUSIVE conservator), each ACTIVE with a DRAFT budget plan"
          setup_api_calls:
            - { call: "POST /clients", payload: { legal_name: "Client Alpha", date_of_birth: "1960-01-01", ssn_last4: "1111", county_of_residence: "TRV", medicaid_enrolled: false }, as: FiduciaryAdmin, captures: { ca_id: $.data.id } }
