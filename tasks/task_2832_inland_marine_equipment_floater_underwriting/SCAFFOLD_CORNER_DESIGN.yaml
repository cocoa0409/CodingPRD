      - name: corner_reporting_period_earned_premium_timely_filing
        claim_type: Correct Result
        grounds:
          - calculations.reporting_period_earned_premium
          - endpoints[POST /inland-marine/coverage-parts/{id}/value-reports]
          - endpoints[POST /inland-marine/value-reports/{id}/adjudicate]
          - entities.ValueReport.due_date
          - entities.CoveragePart.earned_reported_premium_cents
        distinguishing_aspect: |
          A 30-day September period on 12000000 of declared value at 250 bp earns
          exactly 24658 cents and, because the report is filed on 2026-10-10 - inside
          the 15-day grace after the 2026-09-30 period end - late_penalty_cents stays
          0 and the report adjudicates to ACCEPTED rather than PENALIZED.
        test_recipe:
          setup:
            - "One IN_FORCE Policy in T2_URBAN, 2026-08-01 to 2027-08-01, minimum_premium_cents 100000, written_premium_cents 100000 (the floor; the reporting part carries no items)."
            - "One ACTIVE REPORTING_FORM CoveragePart: valuation_basis ACV, aggregate_limit_cents 200000000, reporting_frequency MONTHLY, reporting_annual_rate_bp 250, reporting_limit_cents 20000000."
            - "Logical clock advanced to 2026-10-10T00:00:00Z, five days before the 2026-10-15 due date."
          setup_api_calls:
            - call: "POST /inland-marine/policies"
              payload: { policyholder_name: "Timely Inventory Co", territory_code: "T2_URBAN", effective_date: "2026-08-01", expiration_date: "2027-08-01", minimum_premium_cents: 100000 }
              as: Underwriter
              captures: { pol: $.data.id }
            - call: "POST /inland-marine/policies/${pol}/coverage-parts"
              payload: { part_type: "REPORTING_FORM", valuation_basis: "ACV", aggregate_limit_cents: 200000000, reporting_frequency: "MONTHLY", reporting_annual_rate_bp: 250, reporting_limit_cents: 20000000 }
              as: Underwriter
              captures: { cp: $.data.id }
            - call: "POST /inland-marine/policies/${pol}/quote"
              payload: {}
              as: Underwriter
            - call: "POST /inland-marine/policies/${pol}/bind"
              payload: {}
              as: Underwriter
            - call: "POST /inland-marine/policies/${pol}/activate"
              payload: {}
              as: Underwriter
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-10T00:00:00Z" }
              as: UnderwritingManager
            - call: "GET /inland-marine/coverage-parts/${cp}"
              payload: {}
              as: Underwriter
              captures: { cp_v1: $.data.version }
          trigger:
            - call: "POST /inland-marine/coverage-parts/${cp}/value-reports"
              payload: { period_start_date: "2026-09-01", period_end_date: "2026-09-30", reported_value_cents: 12000000, expected_coverage_part_version: "${cp_v1}" }
              as: Policyholder
              captures: { rpt: $.data.id }
            - call: "POST /inland-marine/value-reports/${rpt}/adjudicate"
              payload: {}
              as: Underwriter
          assert:
            - "after setup: Policy.${pol}.written_premium_cents == 100000 and premium_balance_cents == 100000 and CoveragePart.${cp}.deposit_premium_cents == 0"
            - "trigger[0] HTTP status == 201"
            - "after trigger[0]: ValueReport.${rpt}.status == SUBMITTED, period_days == 30, due_date == 2026-10-15 and submitted_at == 2026-10-10T00:00:00Z"
            - "after trigger[0]: ValueReport.${rpt}.period_earned_premium_cents == 0 and late_penalty_cents == 0 (nothing is earned until adjudication)"
            - "trigger[1] HTTP status == 200"
            - "after trigger[1]: ValueReport.${rpt}.status == ACCEPTED with period_earned_premium_cents == 24658 and late_penalty_cents == 0"
            - "after trigger[1]: CoveragePart.${cp}.earned_reported_premium_cents == 24658 and latest_report_period_end_date == 2026-09-30"
            - "after trigger[1]: Policy.${pol}.premium_balance_cents == 124658 and exactly one REPORTING_ADJUSTMENT LedgerEntry exists with amount_cents == 24658 on the PREMIUM ledger"
            - "after trigger[1]: Policy.${pol}.status == IN_FORCE (a timely filing never suspends the policy)"
            - "12000000 * 250 * 30 / (10000 * 365) == 24657.53..., so round_half_up gives 24658 and the 10% penalty is skipped entirely rather than computed and zeroed"

      - name: corner_cancellation_short_rate_versus_pro_rata
        claim_type: Constants Applied
        grounds:
          - calculations.policy_cancellation_return
          - endpoints[POST /inland-marine/policies/{id}/cancel]
          - entities.LedgerEntry.entry_type
          - state_machines.Policy.IN_FORCE_to_CANCELLED
        distinguishing_aspect: |
          Two policies with identical written_premium_cents 180251 and identical
          cancel_effective_date 2026-11-01 return different money purely on the
          reason code: UNDERWRITING returns the full pro-rata 134818 while
          INSURED_REQUEST applies SHORT_RATE_BP 9000 to the ALREADY-ROUNDED
          pro-rata figure for 121336, a 13482 spread.
        test_recipe:
          setup:
            - "One PUBLISHED RateRule: EXCAVATOR, T2_URBAN, age band 0-5, base_rate_bp 180, theft_hazard_grade A."
            - "Two IN_FORCE Policies, both T2_URBAN, both 2026-08-01 to 2027-08-01 (term_days 365), minimum_premium_cents 100000."
            - "Each policy carries one ACTIVE SCHEDULED_EQUIPMENT CoveragePart with one model_year 2022 EXCAVATOR at original_cost_cents 12000000, so each policy's written_premium_cents == 180251."
            - "Logical clock at 2026-08-01T00:00:00Z; the cancellations are booked forward-dated to 2026-11-01, leaving 273 unearned days."
          setup_api_calls:
            - call: "POST /inland-marine/rate-rules"
              payload: { equipment_type: "EXCAVATOR", territory_code: "T2_URBAN", age_band_min_years: 0, age_band_max_years: 5, base_rate_bp: 180, theft_hazard_grade: "A" }
              as: Actuary
              captures: { rr: $.data.id }
            - call: "POST /inland-marine/rate-rules/${rr}/publish"
              payload: {}
              as: Actuary
            - call: "POST /inland-marine/policies"
              payload: { policyholder_name: "Short Rate Excavating", territory_code: "T2_URBAN", effective_date: "2026-08-01", expiration_date: "2027-08-01", minimum_premium_cents: 100000 }
              as: Underwriter
              captures: { pol_a: $.data.id }
            - call: "POST /inland-marine/policies/${pol_a}/coverage-parts"
              payload: { part_type: "SCHEDULED_EQUIPMENT", valuation_basis: "ACV", per_item_limit_cents: 20000000, aggregate_limit_cents: 200000000 }
              as: Underwriter
              captures: { cp_a: $.data.id }
            - call: "GET /inland-marine/policies/${pol_a}"
              payload: {}
              as: Underwriter
              captures: { pol_a_v1: $.data.version }
            - call: "POST /inland-marine/coverage-parts/${cp_a}/equipment-items"
              payload: { description: "Excavator A", equipment_type: "EXCAVATOR", model_year: 2022, original_cost_cents: 12000000, ownership: "OWNED", expected_policy_version: "${pol_a_v1}" }
              as: Underwriter
            - call: "POST /inland-marine/policies/${pol_a}/quote"
              payload: {}
              as: Underwriter
            - call: "POST /inland-marine/policies/${pol_a}/bind"
              payload: {}
              as: Underwriter
            - call: "POST /inland-marine/policies/${pol_a}/activate"
              payload: {}
              as: Underwriter
            - call: "POST /inland-marine/policies"
              payload: { policyholder_name: "Pro Rata Excavating", territory_code: "T2_URBAN", effective_date: "2026-08-01", expiration_date: "2027-08-01", minimum_premium_cents: 100000 }
              as: Underwriter
              captures: { pol_b: $.data.id }
            - call: "POST /inland-marine/policies/${pol_b}/coverage-parts"
              payload: { part_type: "SCHEDULED_EQUIPMENT", valuation_basis: "ACV", per_item_limit_cents: 20000000, aggregate_limit_cents: 200000000 }
              as: Underwriter
              captures: { cp_b: $.data.id }
            - call: "GET /inland-marine/policies/${pol_b}"
              payload: {}
              as: Underwriter
              captures: { pol_b_v1: $.data.version }
            - call: "POST /inland-marine/coverage-parts/${cp_b}/equipment-items"
              payload: { description: "Excavator B", equipment_type: "EXCAVATOR", model_year: 2022, original_cost_cents: 12000000, ownership: "OWNED", expected_policy_version: "${pol_b_v1}" }
              as: Underwriter
            - call: "POST /inland-marine/policies/${pol_b}/quote"
              payload: {}
              as: Underwriter
            - call: "POST /inland-marine/policies/${pol_b}/bind"
              payload: {}
              as: Underwriter
            - call: "POST /inland-marine/policies/${pol_b}/activate"
              payload: {}
              as: Underwriter
          trigger:
            - call: "POST /inland-marine/policies/${pol_a}/cancel"
              payload: { cancellation_reason: "INSURED_REQUEST", cancel_effective_date: "2026-11-01" }
              as: UnderwritingManager
            - call: "POST /inland-marine/policies/${pol_b}/cancel"
              payload: { cancellation_reason: "UNDERWRITING", cancel_effective_date: "2026-11-01" }
              as: UnderwritingManager
          assert:
            - "after setup: both policies have written_premium_cents == 180251, premium_balance_cents == 180251, term_days == 365 and status == IN_FORCE"
            - "trigger[0] HTTP status == 200"
            - "after trigger[0]: Policy.${pol_a}.status == CANCELLED, cancellation_reason == INSURED_REQUEST and cancel_effective_date == 2026-11-01"
            - "after trigger[0]: Policy.${pol_a}.premium_balance_cents == 58915 and one CANCELLATION_RETURN LedgerEntry exists with amount_cents == -121336"
            - "after trigger[1]: Policy.${pol_b}.premium_balance_cents == 45433 and one CANCELLATION_RETURN LedgerEntry exists with amount_cents == -134818"
            - "after trigger[1]: CoveragePart.${cp_a}.status == VOID and CoveragePart.${cp_b}.status == VOID"
            - "rounding order is observable: round_half_up(180251 * 273 / 365) == 134818 first, then round_half_up(134818 * 9000 / 10000) == 121336; multiplying the exact rationals in one step and rounding once would give 121335"

      - name: corner_scheduled_versus_blanket_part_premium
