  - section: errors
    instances:
      - name: request_missing_auth_headers_is_rejected_before_any_business_rule
        claim_type: error_triggerable
        grounds:
          - errors[ERR_MISSING_AUTH_HEADERS]
          - validations[priority=1]
          - roles
        distinguishing_aspect: "The auth layer runs at priority 1: a well-formed read of a real season with no X-User-Role at all, with no X-User-ID at all, and with an empty-string role all return ERR_MISSING_AUTH_HEADERS (401) rather than any 404 or 403."
        test_recipe:
          setup:
            - "one season in PLANNING"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: RanchManager
            - call: "POST /seasons"
              payload: { name: "2026 Fall Season", arrival_weekday: "SUNDAY", season_start_date: "2026-09-06", season_end_date: "2026-11-15", min_stay_nights: 7, max_stay_nights: 21, deposit_pct: 0.30, buyout_premium_pct: 0.15, no_show_penalty_cents: 4500, retention_bonus_cents: 120000, dining_seat_capacity: 8, package_tiers: [{ code: "CLASSIC", adult_nightly_rate_cents: 68500, child_discount_pct: 0.375, included_activity_credit_cents: 15000 }] }
              as: RanchManager
              captures: { season_id: $.data.id }
          trigger:
            - call: "GET /seasons/${season_id}"
              payload: {}
              as: ""
              captures: { err_no_role: $.data.error_id, msg_no_role: $.data.message }
            - call: "GET /seasons/${season_id}"
              payload: {}
              as: RanchManager
              as_user_id: ""
              captures: { err_no_user: $.data.error_id }
          assert:
            - "${err_no_role} == ERR_MISSING_AUTH_HEADERS with HTTP 401 (X-User-Role header omitted entirely)"
            - "${err_no_user} == ERR_MISSING_AUTH_HEADERS with HTTP 401 (X-User-ID sent as the empty string, not as spaces)"
            - "${msg_no_role} is a non-empty human-readable string inside the standard error envelope"
            - "the response body still carries meta.api_request_id and response_type == error"
            - "an existing season id is used so a 404 cannot be mistaken for the auth failure"

      - name: unrecognised_role_header_value_is_rejected_as_unknown_role
        claim_type: error_triggerable
        grounds:
          - errors[ERR_UNKNOWN_ROLE]
          - validations[priority=2]
          - roles
        distinguishing_aspect: "ERR_UNKNOWN_ROLE (401) is distinct from ERR_UNAUTHORIZED (403): a role string outside the six declared names fails at the identification step even on an endpoint that no role could use with that spelling, including a case-mismatched spelling of a real role."
        test_recipe:
          setup:
            - "one season in PLANNING"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: RanchManager
            - call: "POST /seasons"
              payload: { name: "2026 Fall Season", arrival_weekday: "SUNDAY", season_start_date: "2026-09-06", season_end_date: "2026-11-15", min_stay_nights: 7, max_stay_nights: 21, deposit_pct: 0.30, buyout_premium_pct: 0.15, no_show_penalty_cents: 4500, retention_bonus_cents: 120000, dining_seat_capacity: 8, package_tiers: [{ code: "CLASSIC", adult_nightly_rate_cents: 68500, child_discount_pct: 0.375, included_activity_credit_cents: 15000 }] }
              as: RanchManager
              captures: { season_id: $.data.id }
          trigger:
            - call: "GET /seasons/${season_id}"
              payload: {}
              as: Wrangler
              captures: { err_unknown: $.data.error_id }
            - call: "GET /seasons/${season_id}"
              payload: {}
              as: ranchmanager
              captures: { err_case: $.data.error_id }
          assert:
            - "${err_unknown} == ERR_UNKNOWN_ROLE with HTTP 401"
            - "${err_case} == ERR_UNKNOWN_ROLE with HTTP 401 (role names are compared exactly, so a lowercased RanchManager is not a role)"
            - "neither call returns ERR_UNAUTHORIZED, because the caller was never identified as a role at all"

      - name: auto_assign_with_no_eligible_horse_returns_no_eligible_mount
        claim_type: error_triggerable
        grounds:
          - errors[ERR_NO_ELIGIBLE_MOUNT]
          - calculations.mount_selection_ranking
