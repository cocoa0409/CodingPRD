        distinguishing_aspect: "Missing X-User-Role/X-User-ID headers yield 401 ERR_UNAUTHENTICATED before any other check."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /dme/members"
              payload: { full_name: "NoHdr", email: "nohdr@x.com", date_of_birth: "1990-01-01", shipping_address: "1 V St" }
              captures: { err_id: $.data.error_id }
          assert:
            - "error_id == ERR_UNAUTHENTICATED and http status == 401"

      - name: member_cannot_read_other_member
        claim_type: violation_to_error
        grounds: ["validations[priority=3]", "errors[ERR_OWNERSHIP_VIOLATION]"]
        distinguishing_aspect: "A Member reading another member's record gets ERR_OWNERSHIP_VIOLATION (403) even though Member is in the endpoint roles."
        test_recipe:
          setup: ["two members exist"]
          setup_api_calls:
            - call: "POST /dme/members"
              payload: { full_name: "Own A", email: "owa@x.com", date_of_birth: "1990-01-01", shipping_address: "2 V St" }
              as: CareCoordinator
              captures: { m_a: $.data.id }
            - call: "POST /dme/members"
              payload: { full_name: "Own B", email: "owb@x.com", date_of_birth: "1991-01-01", shipping_address: "3 V St" }
              as: CareCoordinator
              captures: { m_b: $.data.id }
          trigger:
            - call: "GET /dme/members/${m_b}"
              as: Member
              as_user_id: "${m_a}"
              captures: { err_id: $.data.error_id }
          assert:
            - "error_id == ERR_OWNERSHIP_VIOLATION and http status == 403"

