              payload: { project_id: "${proj}", material_spec_id: "${mat1}", drawing_number: "SD-EARLY", complexity_tier: "STANDARD", shop_hours: 10.0, material_area_m2: 1.0, finish_grade: "MILL", subject_case_id: "${case1}" }
              as: FabricationLead
