  # ===========================================================================
  # RULE 9 — compensating_invariant
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: stop_cancel_reverses_the_lot_footprint_and_power_ledger_to_zero
        grounds:
          - state_machines.RouteStop.PLANNED_to_DARK
          - state_machines.RideAllocation.RESERVED_to_RELEASED
          - calculations.lot_capacity_charge
          - entities.RouteStop.fields.allocated_sqft_used
          - entities.RouteStop.fields.power_amps_used
          - entities.Ride.fields.status
        distinguishing_aspect: |
          The conserved quantity is the LOT ledger (allocated_sqft_used, power_amps_used) and the compensation is
          driven by a single parent cancel that releases three children at once: 8814 sqft / 573.0 A must return to
          exactly 0 and 0.0, with every Ride back to AVAILABLE. A drifting implementation that subtracts the raw
          Ride.footprint_sqft (4010 + 2003 + 905 = 6918) instead of the charged 8814 would leave 1896 sqft stranded.
        test_recipe:
          setup:
            - "Jurisdiction OH; Venue V1; Route R1 DRAFT with one PLANNED stop A."
            - "Three RESERVED allocations: WHEEL (MAJOR, charged 5414 / 375.0), TILT (FLAT, charged 2404 / 138.0), KIDDIE (charged 996 / 60.0), so the ledger reads 8814 sqft / 573.0 A."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /jurisdictions"
              payload: { state_code: "OH", name: "Ohio", permit_lead_days: 10, amusement_tax_pct: 6.5, permit_fee_cents: 50000 }
