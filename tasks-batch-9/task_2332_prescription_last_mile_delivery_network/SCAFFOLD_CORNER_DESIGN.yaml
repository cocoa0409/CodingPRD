# =============================================================================
# §1.9 Scaffold Corner Design — task 2332 Prescription Last-Mile Delivery Network
#
# Breadth probe over the §1.1-§1.7 surface. Sections and claim_type values are
# taken verbatim from references/claim-extraction-guide.md; corners already
# exercised by SCAFFOLD_DIFFICULTY_DESIGN.yaml appear as excluded_because stubs.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_health_plan_returns_all_declared_fields
        claim_type: creation
        grounds:
          - entities.HealthPlan
          - endpoints.POST_/health-plans
        distinguishing_aspect: "POST /health-plans with every required field returns 201 and echoes name, payer_type and member_cost_share_pct plus system id/created_at/updated_at/version 1."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: NetworkOps
          trigger:
            - call: "POST /health-plans"
              payload: { name: "Meridian Health", payer_type: "COMMERCIAL", member_cost_share_pct: 0.10 }
              as: NetworkOps
              captures: { hp1_id: $.data.id }
          assert:
            - "Status 201; response_type == \"object\" and meta carries api_request_id and api_request_timestamp"
            - "HealthPlan.${hp1_id}.name == \"Meridian Health\", payer_type == COMMERCIAL, member_cost_share_pct == 0.10"
            - "HealthPlan.${hp1_id}.version == 1 and created_at == 2026-08-01T00:00:00Z"

      - name: get_pharmacy_order_returns_stored_and_computed_fields
        claim_type: retrieval
        grounds:
          - entities.PharmacyOrder
          - endpoints.GET_/pharmacy-orders/{id}
        distinguishing_aspect: "GET /pharmacy-orders/{id} returns the stored input fields unchanged and the computed signature_required / required_id_verification / hold_count / status alongside them."
        test_recipe:
          setup:
            - "One commercial plan, one pharmacy, one Z1 patient and one CII cold order worth 31000 cents, still in INTAKE."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: NetworkOps
            - call: "POST /health-plans"
              payload: { name: "Meridian Health", payer_type: "COMMERCIAL", member_cost_share_pct: 0.10 }
              as: NetworkOps
              captures: { hp1_id: $.data.id }
            - call: "POST /pharmacies"
              payload: { name: "Cedar Rx", state_code: "WA", cold_chain_certified: true, controlled_license_tier: "CII_V", return_window_minutes: 240 }
              as: NetworkOps
              captures: { ph1_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Dana Reyes", date_of_birth: "1970-04-12", phone_last4: "4417", address_line: "881 Alder St", zone_code: "Z1", hipaa_consent_status: "GRANTED" }
              as: PharmacyOperator
              as_user_id: "${ph1_id}"
              captures: { pat1_id: $.data.id }
            - call: "POST /pharmacy-orders"
              payload: { pharmacy_id: "${ph1_id}", patient_id: "${pat1_id}", health_plan_id: "${hp1_id}", rx_line_count: 2, cold_chain_required: true, controlled_schedule: "CII", total_rx_value_cents: 31000 }
              as: PharmacyOperator
              as_user_id: "${ph1_id}"
              captures: { o1_id: $.data.id }
          trigger:
            - call: "GET /pharmacy-orders/${o1_id}"
              payload: {}
              as: PharmacyOperator
              as_user_id: "${ph1_id}"
          assert:
            - "Status 200 with pharmacy_id ${ph1_id}, patient_id ${pat1_id}, health_plan_id ${hp1_id}, rx_line_count 2, cold_chain_required true, controlled_schedule CII, total_rx_value_cents 31000"
            - "Computed fields present and correct: signature_required == true, required_id_verification == GOVT_ID_SCAN, hold_count == 0, status == INTAKE"
            - "version == 1"

      - name: list_deliveries_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints.GET_/deliveries
          - response_envelope.pagination_fields
        distinguishing_aspect: "With three deliveries on file, GET /deliveries?limit=2&offset=0 returns exactly 2 rows with total_count 3 and has_more true, and offset=2 returns 1 row with has_more false."
        test_recipe:
          setup:
            - "Commercial plan, funded grant, Cedar Rx, zone Z1, patient Dana Reyes."
            - "Three READY standard orders reserved onto one 14:00-16:00Z window of capacity 3, created in ascending order."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T09:00:00Z" }
              as: NetworkOps
            - call: "POST /health-plans"
              payload: { name: "Meridian Health", payer_type: "COMMERCIAL", member_cost_share_pct: 0.10 }
              as: NetworkOps
              captures: { hp1_id: $.data.id }
            - call: "POST /plan-grants"
              payload: { health_plan_id: "${hp1_id}", benefit_year: 2026, grant_budget_cents: 100000, per_delivery_cap_cents: 150 }
              as: NetworkOps
              captures: { g1_id: $.data.id }
            - call: "POST /pharmacies"
              payload: { name: "Cedar Rx", state_code: "WA", cold_chain_certified: true, controlled_license_tier: "CII_V", return_window_minutes: 240 }
              as: NetworkOps
              captures: { ph1_id: $.data.id }
            - call: "POST /delivery-zones"
              payload: { zone_code: "Z1", distance_band_miles: 6.4, base_fee_cents: 705, per_mile_cents: 123, cold_pack_fee_cents: 455, controlled_handling_fee_cents: 605, after_hours_fee_cents: 305, cold_chain_supported: true, controlled_delivery_allowed: true }
              as: NetworkOps
              captures: { z1_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Dana Reyes", date_of_birth: "1970-04-12", phone_last4: "4417", address_line: "881 Alder St", zone_code: "Z1", hipaa_consent_status: "GRANTED" }
              as: PharmacyOperator
              as_user_id: "${ph1_id}"
              captures: { pat1_id: $.data.id }
            - call: "POST /delivery-windows"
              payload: { zone_id: "${z1_id}", courier_mode: "SCHEDULED", window_start: "2026-08-03T14:00:00Z", window_end: "2026-08-03T16:00:00Z", capacity_slots: 3 }
              as: NetworkOps
              captures: { w1_id: $.data.id, w1_v0: $.data.version }
            - call: "POST /pharmacy-orders"
              payload: { pharmacy_id: "${ph1_id}", patient_id: "${pat1_id}", health_plan_id: "${hp1_id}", rx_line_count: 1, cold_chain_required: false, controlled_schedule: "NONE", total_rx_value_cents: 1000 }
              as: PharmacyOperator
              as_user_id: "${ph1_id}"
              captures: { oa_id: $.data.id }
            - call: "POST /pharmacy-orders/${oa_id}/mark-ready"
              payload: {}
              as: PharmacyOperator
              as_user_id: "${ph1_id}"
            - call: "POST /deliveries"
              payload: { order_id: "${oa_id}", window_id: "${w1_id}", expected_window_version: "${w1_v0}" }
              as: PharmacyOperator
              as_user_id: "${ph1_id}"
              captures: { da_id: $.data.id }
            - call: "GET /delivery-windows/${w1_id}"
              payload: {}
              as: NetworkOps
              captures: { w1_v1: $.data.version }
            - call: "POST /pharmacy-orders"
              payload: { pharmacy_id: "${ph1_id}", patient_id: "${pat1_id}", health_plan_id: "${hp1_id}", rx_line_count: 1, cold_chain_required: false, controlled_schedule: "NONE", total_rx_value_cents: 1100 }
              as: PharmacyOperator
              as_user_id: "${ph1_id}"
              captures: { ob_id: $.data.id }
            - call: "POST /pharmacy-orders/${ob_id}/mark-ready"
              payload: {}
              as: PharmacyOperator
              as_user_id: "${ph1_id}"
            - call: "POST /deliveries"
              payload: { order_id: "${ob_id}", window_id: "${w1_id}", expected_window_version: "${w1_v1}" }
              as: PharmacyOperator
              as_user_id: "${ph1_id}"
              captures: { db_id: $.data.id }
            - call: "GET /delivery-windows/${w1_id}"
              payload: {}
              as: NetworkOps
              captures: { w1_v2: $.data.version }
            - call: "POST /pharmacy-orders"
              payload: { pharmacy_id: "${ph1_id}", patient_id: "${pat1_id}", health_plan_id: "${hp1_id}", rx_line_count: 1, cold_chain_required: false, controlled_schedule: "NONE", total_rx_value_cents: 1200 }
              as: PharmacyOperator
              as_user_id: "${ph1_id}"
              captures: { oc_id: $.data.id }
            - call: "POST /pharmacy-orders/${oc_id}/mark-ready"
              payload: {}
              as: PharmacyOperator
              as_user_id: "${ph1_id}"
            - call: "POST /deliveries"
              payload: { order_id: "${oc_id}", window_id: "${w1_id}", expected_window_version: "${w1_v2}" }
              as: PharmacyOperator
              as_user_id: "${ph1_id}"
              captures: { dc_id: $.data.id }
          trigger:
            - call: "GET /deliveries"
              payload: { limit: 2, offset: 0 }
              as: NetworkOps
            - call: "GET /deliveries"
              payload: { limit: 2, offset: 2 }
              as: NetworkOps
            - call: "GET /deliveries"
              payload: { window_id: "${w1_id}", custody_status: "QUEUED" }
              as: NetworkOps
          assert:
            - "First page: response_type == \"array\", exactly 2 rows, total_count == 3, has_more == true"
            - "Second page: exactly 1 row, total_count == 3, has_more == false"
            - "Rows are ordered created_at ASC, so the first page holds ${da_id} then ${db_id} and the second holds ${dc_id}"
            - "Filtered list: window_id + custody_status filter returns total_count 3 and every row has custody_status QUEUED"
            - "DeliveryWindow.${w1_id}.reserved_slots == 3, available_slots == 0, status == FULL"

      - name: get_delivery_with_unknown_id_returns_not_found
        claim_type: not_found
        grounds:
          - errors[ERR_DELIVERY_NOT_FOUND]
          - endpoints.GET_/deliveries/{id}
        distinguishing_aspect: "A syntactically valid but unused UUID on GET /deliveries/{id} returns 404 ERR_DELIVERY_NOT_FOUND, and the same id on POST /deliveries/{id}/cancel also returns 404 rather than a state error."
        test_recipe:
          setup:
            - "Empty database apart from the clock."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: NetworkOps
          trigger:
            - call: "GET /deliveries/11111111-1111-4111-8111-111111111111"
              payload: {}
              as: NetworkOps
              captures: { err1: $.data.error_id }
            - call: "POST /deliveries/11111111-1111-4111-8111-111111111111/cancel"
              payload: {}
              as: PharmacyOperator
              as_user_id: "22222222-2222-4222-8222-222222222222"
              captures: { err2: $.data.error_id }
          assert:
            - "First call: status 404 with response_type \"error\" and ${err1} == ERR_DELIVERY_NOT_FOUND"
            - "Second call: status 404 with ${err2} == ERR_DELIVERY_NOT_FOUND — existence (priority 8) is checked before any state or scope rule"
            - "Both error bodies carry a non-empty message and the standard meta block"

      - name: create_pharmacy_order_missing_required_patient_id_returns_invalid_request
        claim_type: required_fields
        grounds:
          - endpoints.POST_/pharmacy-orders
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "Omitting the required patient_id returns 400 ERR_INVALID_REQUEST and creates no PharmacyOrder, while omitting the optional cold_chain_required succeeds."
        test_recipe:
          setup:
            - "One commercial plan, one pharmacy, one patient."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: NetworkOps
            - call: "POST /health-plans"
              payload: { name: "Meridian Health", payer_type: "COMMERCIAL", member_cost_share_pct: 0.10 }
              as: NetworkOps
              captures: { hp1_id: $.data.id }
            - call: "POST /pharmacies"
              payload: { name: "Cedar Rx", state_code: "WA", cold_chain_certified: true, controlled_license_tier: "CII_V", return_window_minutes: 240 }
              as: NetworkOps
              captures: { ph1_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Dana Reyes", date_of_birth: "1970-04-12", phone_last4: "4417", address_line: "881 Alder St", zone_code: "Z1", hipaa_consent_status: "GRANTED" }
              as: PharmacyOperator
              as_user_id: "${ph1_id}"
              captures: { pat1_id: $.data.id }
          trigger:
            - call: "POST /pharmacy-orders"
              payload: { pharmacy_id: "${ph1_id}", health_plan_id: "${hp1_id}", rx_line_count: 1, total_rx_value_cents: 1000 }
              as: PharmacyOperator
              as_user_id: "${ph1_id}"
              captures: { err1: $.data.error_id }
            - call: "POST /pharmacy-orders"
              payload: { pharmacy_id: "${ph1_id}", patient_id: "${pat1_id}", health_plan_id: "${hp1_id}", rx_line_count: 1, total_rx_value_cents: 1000 }
              as: PharmacyOperator
              as_user_id: "${ph1_id}"
              captures: { o1_id: $.data.id }
          assert:
            - "Missing required patient_id: status 400 and ${err1} == ERR_INVALID_REQUEST"
            - "GET /pharmacy-orders?pharmacy_id=${ph1_id} returns total_count 1 after both calls — the rejected call persisted nothing"
            - "Omitting the optional cold_chain_required and controlled_schedule succeeds: PharmacyOrder.${o1_id}.cold_chain_required == false and controlled_schedule == NONE"

      - name: create_courier_defaults_to_offline_with_zero_counters
        claim_type: defaults
        grounds:
          - entities.Courier.fields.status
          - entities.Courier.fields.rolling_reliability_score
          - endpoints.POST_/couriers
        distinguishing_aspect: "A courier onboarded without the optional certification flags starts OFFLINE with active_delivery_count 0, attempt_total_count 0, delivered_count 0 and both reliability scores at the zero-attempt value 100.00, and cold_chain_equipped / controlled_certified default to false."
        test_recipe:
          setup:
            - "Empty database apart from the clock."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: NetworkOps
          trigger:
            - call: "POST /couriers"
              payload: { display_name: "Ida Nunez", mode: "ON_DEMAND", served_zone_codes: ["Z1"] }
              as: NetworkOps
              captures: { c1_id: $.data.id }
          assert:
            - "Status 201; Courier.${c1_id}.status == OFFLINE (the declared initial state, not AVAILABLE)"
            - "Courier.${c1_id}.cold_chain_equipped == false and controlled_certified == false"
            - "Courier.${c1_id}.active_delivery_count == 0, attempt_total_count == 0, delivered_count == 0"
            - "Courier.${c1_id}.rolling_reliability_score == 100.00 and lifetime_reliability_score == 100.00 — the §1.3 zero-attempt branch, not a 0.00 placeholder"
            - "A courier in OFFLINE is not a selector candidate, so dispatching with no other courier present yields ERR_NO_ELIGIBLE_COURIER"

      - name: order_signature_and_id_ladder_are_computed_from_value_threshold
        claim_type: computed_fields
        grounds:
          - calculations.handling_class_and_verification_requirements
          - entities.PharmacyOrder.fields.signature_required
          - entities.PharmacyOrder.fields.required_id_verification
        distinguishing_aspect: "At exactly 25000 cents a non-controlled order is signature_required with required_id_verification PHOTO_ID; at 24999 it is not required and drops to DOB_MATCH — the comparison is >= and the client cannot supply either field."
        test_recipe:
          setup:
            - "One commercial plan, Cedar Rx and one Z1 patient."
            - "Two non-controlled, non-cold orders worth 25000 and 24999 cents."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: NetworkOps
            - call: "POST /health-plans"
              payload: { name: "Meridian Health", payer_type: "COMMERCIAL", member_cost_share_pct: 0.10 }
              as: NetworkOps
              captures: { hp1_id: $.data.id }
            - call: "POST /pharmacies"
              payload: { name: "Cedar Rx", state_code: "WA", cold_chain_certified: true, controlled_license_tier: "CII_V", return_window_minutes: 240 }
              as: NetworkOps
              captures: { ph1_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Dana Reyes", date_of_birth: "1970-04-12", phone_last4: "4417", address_line: "881 Alder St", zone_code: "Z1", hipaa_consent_status: "GRANTED" }
              as: PharmacyOperator
              as_user_id: "${ph1_id}"
              captures: { pat1_id: $.data.id }
          trigger:
            - call: "POST /pharmacy-orders"
              payload: { pharmacy_id: "${ph1_id}", patient_id: "${pat1_id}", health_plan_id: "${hp1_id}", rx_line_count: 1, cold_chain_required: false, controlled_schedule: "NONE", total_rx_value_cents: 25000 }
              as: PharmacyOperator
              as_user_id: "${ph1_id}"
              captures: { o_at_id: $.data.id }
            - call: "POST /pharmacy-orders"
              payload: { pharmacy_id: "${ph1_id}", patient_id: "${pat1_id}", health_plan_id: "${hp1_id}", rx_line_count: 1, cold_chain_required: false, controlled_schedule: "NONE", total_rx_value_cents: 24999 }
              as: PharmacyOperator
              as_user_id: "${ph1_id}"
              captures: { o_below_id: $.data.id }
            - call: "POST /pharmacy-orders"
              payload: { pharmacy_id: "${ph1_id}", patient_id: "${pat1_id}", health_plan_id: "${hp1_id}", rx_line_count: 1, cold_chain_required: false, controlled_schedule: "CIII", total_rx_value_cents: 500 }
              as: PharmacyOperator
              as_user_id: "${ph1_id}"
              captures: { o_ciii_id: $.data.id }
          assert:
            - "At threshold: PharmacyOrder.${o_at_id}.signature_required == true and required_id_verification == PHOTO_ID"
            - "One cent below: PharmacyOrder.${o_below_id}.signature_required == false and required_id_verification == DOB_MATCH"
            - "Controlled overrides value: PharmacyOrder.${o_ciii_id}.signature_required == true and required_id_verification == PHOTO_ID even at 500 cents"
            - "All three rows have status INTAKE and hold_count 0 — computed fields are derived at creation, not supplied"

      - name: patient_masked_name_is_a_computed_projection_of_full_name
        claim_type: computed_fields
        grounds:
          - entities.Patient.fields.masked_name
          - entities.Patient.fields.full_name
        distinguishing_aspect: "Patient.masked_name keeps the first character of each whitespace-separated token and replaces the rest with '*', so it is strictly shorter in information than full_name; it is the only name form a courier ever receives while full_name stays intact on the pharmacy-facing read."
        test_recipe:
          setup:
            - "One pharmacy and one patient named Dana Reyes."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: NetworkOps
            - call: "POST /pharmacies"
              payload: { name: "Cedar Rx", state_code: "WA", cold_chain_certified: true, controlled_license_tier: "CII_V", return_window_minutes: 240 }
              as: NetworkOps
              captures: { ph1_id: $.data.id }
          trigger:
            - call: "POST /patients"
              payload: { full_name: "Dana Reyes", date_of_birth: "1970-04-12", phone_last4: "4417", address_line: "881 Alder St", zone_code: "Z1", hipaa_consent_status: "GRANTED" }
              as: PharmacyOperator
              as_user_id: "${ph1_id}"
              captures: { pat1_id: $.data.id, masked: $.data.masked_name }
          assert:
            - "Status 201; Patient.${pat1_id}.full_name == \"Dana Reyes\" is stored verbatim"
            - "Patient.${pat1_id}.masked_name == \"D*** R****\" — one leading character per token, every remaining character replaced by '*'"
            - "${masked} != \"Dana Reyes\""
            - "Patient.${pat1_id}.hipaa_consent_status == GRANTED and version == 1"

      - name: delivery_rejects_client_supplied_system_fields_returns_invalid_request
        claim_type: system_fields
        grounds:
          - endpoints.POST_/deliveries
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /deliveries declares exactly order_id, window_id and expected_window_version; sending id, custody_status or courier_id is rejected with ERR_INVALID_REQUEST rather than honoured."
        test_recipe:
          setup:
            - "Base fixture: commercial plan, funded grant, Cedar Rx, Z1, patient, one READY standard order and one 14:00-16:00Z window."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T09:00:00Z" }
              as: NetworkOps
            - call: "POST /health-plans"
              payload: { name: "Meridian Health", payer_type: "COMMERCIAL", member_cost_share_pct: 0.10 }
              as: NetworkOps
              captures: { hp1_id: $.data.id }
            - call: "POST /plan-grants"
              payload: { health_plan_id: "${hp1_id}", benefit_year: 2026, grant_budget_cents: 100000, per_delivery_cap_cents: 150 }
              as: NetworkOps
              captures: { g1_id: $.data.id }
            - call: "POST /pharmacies"
              payload: { name: "Cedar Rx", state_code: "WA", cold_chain_certified: true, controlled_license_tier: "CII_V", return_window_minutes: 240 }
              as: NetworkOps
              captures: { ph1_id: $.data.id }
            - call: "POST /delivery-zones"
              payload: { zone_code: "Z1", distance_band_miles: 6.4, base_fee_cents: 705, per_mile_cents: 123, cold_pack_fee_cents: 455, controlled_handling_fee_cents: 605, after_hours_fee_cents: 305, cold_chain_supported: true, controlled_delivery_allowed: true }
              as: NetworkOps
              captures: { z1_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Dana Reyes", date_of_birth: "1970-04-12", phone_last4: "4417", address_line: "881 Alder St", zone_code: "Z1", hipaa_consent_status: "GRANTED" }
              as: PharmacyOperator
              as_user_id: "${ph1_id}"
              captures: { pat1_id: $.data.id }
            - call: "POST /pharmacy-orders"
              payload: { pharmacy_id: "${ph1_id}", patient_id: "${pat1_id}", health_plan_id: "${hp1_id}", rx_line_count: 1, cold_chain_required: false, controlled_schedule: "NONE", total_rx_value_cents: 1000 }
              as: PharmacyOperator
              as_user_id: "${ph1_id}"
              captures: { o1_id: $.data.id }
            - call: "POST /pharmacy-orders/${o1_id}/mark-ready"
              payload: {}
              as: PharmacyOperator
              as_user_id: "${ph1_id}"
            - call: "POST /delivery-windows"
              payload: { zone_id: "${z1_id}", courier_mode: "SCHEDULED", window_start: "2026-08-03T14:00:00Z", window_end: "2026-08-03T16:00:00Z", capacity_slots: 1 }
              as: NetworkOps
              captures: { w1_id: $.data.id, w1_v: $.data.version }
          trigger:
            - call: "POST /deliveries"
              payload: { order_id: "${o1_id}", window_id: "${w1_id}", expected_window_version: "${w1_v}", custody_status: "DELIVERED" }
              as: PharmacyOperator
              as_user_id: "${ph1_id}"
              captures: { err1: $.data.error_id }
            - call: "POST /deliveries"
              payload: { order_id: "${o1_id}", window_id: "${w1_id}", expected_window_version: "${w1_v}" }
              as: PharmacyOperator
              as_user_id: "${ph1_id}"
              captures: { d1_id: $.data.id }
          assert:
            - "Undeclared field: status 400 and ${err1} == ERR_INVALID_REQUEST; no Delivery row and DeliveryWindow.${w1_id}.reserved_slots == 0"
            - "Clean retry: status 201 with Delivery.${d1_id}.custody_status == QUEUED (the server-chosen initial state), settlement_status == PROVISIONAL, courier_id == null, attempt_count == 0, version == 1"
