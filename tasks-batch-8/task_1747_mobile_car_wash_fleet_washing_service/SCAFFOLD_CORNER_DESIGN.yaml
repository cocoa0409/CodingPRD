            - "r_st == CANCELLED and r_reason == DISPATCH"
            - "o_st == SCHEDULED (manual path returns the order to the pool; it does NOT weather-hold)"
            - "van_res == 0.0 and the route's stop ${stop_id} is CANCELLED"

      - name: site_reinstate_gated_on_open_incidents
        claim_type: conditional_cascade
        grounds: ["state_machines.Site.SUSPENDED_to_ACTIVE", "state_machines.ComplianceIncident.CONFIRMED_to_RESOLVED", "errors[ERR_OPEN_COMPLIANCE_INCIDENT]"]
        distinguishing_aspect: "With two CONFIRMED incidents at one site, resolving the FIRST leaves the site SUSPENDED (conditional cascade); only resolving the last open incident reinstates it, and a manual REINSTATE in between fails with ERR_OPEN_COMPLIANCE_INCIDENT."
        test_recipe:
          setup: ["site with no pending orders; two incidents both progressed to CONFIRMED (site SUSPENDED)"]
          setup_api_calls:
            - { call: "POST /fleet-wash/customers", payload: { name: "S9", email: "s9@x.com" }, as: PlatformAdmin, captures: { cust_id: $.data.id } }
            - { call: "POST /fleet-wash/sites", payload: { customer_id: "${cust_id}", name: "S9S", lot_size_sqft: 8000, containment_type: "VACUUM_RECOVERY", water_reclaim_required: false, max_discharge_gal: 100 }, as: PlatformAdmin, captures: { site_id: $.data.id } }
            - { call: "POST /fleet-wash/compliance-incidents", payload: { site_id: "${site_id}", incident_type: "SPILL", notes: "first" }, as: ComplianceOfficer, captures: { inc1: $.data.id } }
            - { call: "POST /fleet-wash/compliance-incidents/${inc1}/events", payload: { event_type: "START_REVIEW" }, as: ComplianceOfficer }
            - { call: "POST /fleet-wash/compliance-incidents/${inc1}/events", payload: { event_type: "CONFIRM" }, as: ComplianceOfficer }
            - { call: "POST /fleet-wash/compliance-incidents", payload: { site_id: "${site_id}", incident_type: "CONTAINMENT_FAILURE", notes: "second" }, as: ComplianceOfficer, captures: { inc2: $.data.id } }
            - { call: "POST /fleet-wash/compliance-incidents/${inc2}/events", payload: { event_type: "START_REVIEW" }, as: ComplianceOfficer }
            - { call: "POST /fleet-wash/compliance-incidents/${inc2}/events", payload: { event_type: "CONFIRM" }, as: ComplianceOfficer }
          trigger:
            - { call: "POST /fleet-wash/sites/${site_id}/events", payload: { event_type: "REINSTATE" }, as: ComplianceOfficer, captures: { err: $.data.error_id } }
            - { call: "POST /fleet-wash/compliance-incidents/${inc1}/events", payload: { event_type: "RESOLVE" }, as: ComplianceOfficer }
            - { call: "GET /fleet-wash/sites/${site_id}", payload: {}, as: Dispatcher, captures: { st_after_1: $.data.status } }
            - { call: "POST /fleet-wash/compliance-incidents/${inc2}/events", payload: { event_type: "RESOLVE" }, as: ComplianceOfficer }
            - { call: "GET /fleet-wash/sites/${site_id}", payload: {}, as: Dispatcher, captures: { st_after_2: $.data.status } }
          assert:
            - "err == ERR_OPEN_COMPLIANCE_INCIDENT (manual reinstate blocked while any incident is CONFIRMED)"
            - "st_after_1 == SUSPENDED (one CONFIRMED incident remains after first RESOLVE)"
            - "st_after_2 == ACTIVE (last open incident resolved; conditional cascade fires)"

  - section: calculations
    instances:
      - name: lot_setup_minutes_boundary_10000_sqft
        claim_type: correct_result
        grounds: ["calculations.stop_planning", "entities.RouteStop.fields.planned_end_at"]
        distinguishing_aspect: "The lot-size threshold is inclusive at 10000: a 9999-sqft lot takes 15 setup minutes (1-SEDAN stop ends 08:35) while a 10000-sqft lot takes 25 (ends 08:45)."
        test_recipe:
          setup:
            - "RETAIL customer; site SMALL lot 9999 and site MEDIUM lot 10000; 1 SEDAN registered at each"
            - "Two CONFIRMED 1-SEDAN orders (one per site); two routes on different dates with separate BASIC vans and technicians"
          setup_api_calls:
            - { call: "POST /fleet-wash/customers", payload: { name: "C1", email: "c1@x.com" }, as: PlatformAdmin, captures: { cust_id: $.data.id } }
            - { call: "POST /fleet-wash/sites", payload: { customer_id: "${cust_id}", name: "SMALL", lot_size_sqft: 9999, containment_type: "VACUUM_RECOVERY", water_reclaim_required: false, max_discharge_gal: 100 }, as: PlatformAdmin, captures: { site_a: $.data.id } }
            - { call: "POST /fleet-wash/sites", payload: { customer_id: "${cust_id}", name: "MEDIUM", lot_size_sqft: 10000, containment_type: "VACUUM_RECOVERY", water_reclaim_required: false, max_discharge_gal: 100 }, as: PlatformAdmin, captures: { site_b: $.data.id } }
