        grounds:
          - endpoints.GET /ports/{id}/surveyors
          - entities.Surveyor.fields.base_port_id
          - endpoints.POST /surveyors/{id}/suspend
        distinguishing_aspect: |
          The panel is a reverse lookup on base_port_id, so a surveyor appointed
          to Rotterdam must never appear on the Singapore panel, and the status
          filter must be able to hide a suspended member while the unfiltered
          panel still shows them. Pagination is proved by limit=1 with
