# =============================================================================
# Task 0955 — Baby-Gear & Equipment Travel Rental
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# =============================================================================

scaffold_corner_design:

  # ------------------------------------------------------------- entities
  - section: entities
    instances:
      - name: customer_creation_applies_defaults
        claim_type: creation_defaults
        grounds: [entities.Customer]
        distinguishing_aspect: "POST /customers returns 201 with system defaults: status ACTIVE, risk_score 0, counters 0, version 1; id is a prefix-less UUID."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /customers", payload: { full_name: "Ada Lo", email: "ada@x.com", phone: "001" }, as: Anonymous, captures: { cust: $.data.id } }
          assert:
            - "Customer.${cust}.status == ACTIVE"
            - "Customer.${cust}.risk_score == 0"
            - "Customer.${cust}.late_return_count == 0 and captured_damage_count == 0"
            - "Customer.${cust}.version == 1 and id has no type prefix"

      - name: catalog_item_missing_required_field_rejected
        claim_type: required_fields
        grounds: [entities.CatalogItem, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required daily_rate_cents yields ERR_INVALID_REQUEST (400); no catalog item is persisted."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /catalog-items", payload: { name: "NoRate", category: "CRIB", deposit_amount_cents: 15000, weight_kg: 12.0, cleaning_turnaround_hours: 24, deep_clean_every_cycles: 3 }, as: OperationsAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST"

      - name: reservation_client_supplied_status_ignored_input
        claim_type: system_fields
        grounds: [entities.Reservation, state_machines.Reservation]
        distinguishing_aspect: "Client-supplied status field in the create payload is ignored; the reservation is always created QUOTED."
        test_recipe:
          setup: ["customer and catalog item exist"]
          setup_api_calls:
            - { call: "POST /customers", payload: { full_name: "Ben Po", email: "ben@x.com", phone: "002" }, as: Anonymous, captures: { cust: $.data.id } }
            - { call: "POST /catalog-items", payload: { name: "Crib U", category: "CRIB", daily_rate_cents: 3000, deposit_amount_cents: 15000, weight_kg: 12.0, cleaning_turnaround_hours: 24, deep_clean_every_cycles: 3 }, as: OperationsAdmin, captures: { cat: $.data.id } }
          trigger:
            - { call: "POST /reservations", payload: { delivery_address: "29 Vine St", zone_code: "Z1", start_date: "2026-06-10", end_date: "2026-06-13", status: "CONFIRMED", lines: [ { catalog_item_id: "${cat}" } ] }, as: Customer, as_user_id: "${cust}", captures: { res: $.data.id, st: $.data.status } }
          assert:
            - "Reservation.${res}.status == QUOTED (client-supplied CONFIRMED ignored)"

      - name: reservation_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_RESERVATION_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but non-existent UUID yields ERR_RESERVATION_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /reservations/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", payload: {}, as: OperationsAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_RESERVATION_NOT_FOUND"

      - name: deposit_transaction_append_only_immutability
        claim_type: immutability
        grounds: [entities.DepositTransaction]
        distinguishing_aspect: "DepositTransaction has common_fields false: ledger entries expose id/created_at but no version field and no update endpoint; the HOLD entry from confirm is readable via the reverse-reachability list."
        test_recipe:
          setup: ["CONFIRMED reservation (deposit hold 15000)"]
          setup_api_calls:
            - { call: "POST /customers", payload: { full_name: "Cam Yu", email: "cam@x.com", phone: "003" }, as: Anonymous, captures: { cust: $.data.id } }
            - { call: "POST /catalog-items", payload: { name: "Crib V", category: "CRIB", daily_rate_cents: 3000, deposit_amount_cents: 15000, weight_kg: 12.0, cleaning_turnaround_hours: 24, deep_clean_every_cycles: 3 }, as: OperationsAdmin, captures: { cat: $.data.id } }
            - { call: "POST /inventory-units", payload: { catalog_item_id: "${cat}", serial_number: "SN-V1", condition_grade: "A" }, as: OperationsAdmin }
            - { call: "POST /reservations", payload: { delivery_address: "30 Walnut Ave", zone_code: "Z1", start_date: "2026-06-10", end_date: "2026-06-13", lines: [ { catalog_item_id: "${cat}" } ] }, as: Customer, as_user_id: "${cust}", captures: { res: $.data.id } }
            - { call: "POST /reservations/${res}/confirm", payload: {}, as: Customer, as_user_id: "${cust}" }
          trigger:
            - { call: "GET /reservations/${res}/deposit-transactions", payload: {}, as: OperationsAdmin }
          assert:
            - "exactly one entry: txn_type HOLD, amount_cents 15000, reason HOLD_AT_CONFIRM, balance_after_cents 15000"
            - "entry exposes id and created_at but no version or updated_at field"

      - name: reservation_line_fk_integrity_rejected
        claim_type: parent_relationships
        grounds: [entities.ReservationLine.fields.catalog_item_id, "errors[ERR_CATALOG_ITEM_NOT_FOUND]"]
        distinguishing_aspect: "A line referencing a non-existent catalog item id is rejected with ERR_CATALOG_ITEM_NOT_FOUND (404) at reservation creation."
        test_recipe:
          setup: ["customer exists"]
          setup_api_calls:
            - { call: "POST /customers", payload: { full_name: "Dee Xu", email: "dee@x.com", phone: "004" }, as: Anonymous, captures: { cust: $.data.id } }
          trigger:
            - { call: "POST /reservations", payload: { delivery_address: "31 Poplar Rd", zone_code: "Z1", start_date: "2026-06-10", end_date: "2026-06-13", lines: [ { catalog_item_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2" } ] }, as: Customer, as_user_id: "${cust}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_CATALOG_ITEM_NOT_FOUND"

  # ------------------------------------------------------------- state_machines
  - section: state_machines
    instances:
      - name: reservation_initial_state_quoted
        claim_type: initial_state
        grounds: [state_machines.Reservation]
        distinguishing_aspect: "A newly created reservation starts in QUOTED with payment_status DEPOSIT_PENDING."
        test_recipe:
          setup: ["customer and catalog item exist"]
          setup_api_calls:
            - { call: "POST /customers", payload: { full_name: "Eli An", email: "eli@x.com", phone: "005" }, as: Anonymous, captures: { cust: $.data.id } }
            - { call: "POST /catalog-items", payload: { name: "Crib W", category: "CRIB", daily_rate_cents: 3000, deposit_amount_cents: 15000, weight_kg: 12.0, cleaning_turnaround_hours: 24, deep_clean_every_cycles: 3 }, as: OperationsAdmin, captures: { cat: $.data.id } }
          trigger:
            - { call: "POST /reservations", payload: { delivery_address: "32 Chestnut Blvd", zone_code: "Z1", start_date: "2026-06-10", end_date: "2026-06-13", lines: [ { catalog_item_id: "${cat}" } ] }, as: Customer, as_user_id: "${cust}", captures: { res: $.data.id, st: $.data.status, ps: $.data.payment_status } }
          assert:
            - "status == QUOTED and payment_status == DEPOSIT_PENDING"

      - name: settled_reservation_rejects_second_settle
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Reservation, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "SETTLED is terminal: a second settle returns ERR_INVALID_STATE and no additional ledger entries appear."
        test_recipe:
          setup: ["Reservation fully settled (delivered, picked up on time at 04:00, settled)"]
          setup_api_calls:
            - { call: "POST /customers", payload: { full_name: "Fio Gu", email: "fio@x.com", phone: "006" }, as: Anonymous, captures: { cust: $.data.id } }
            - { call: "POST /catalog-items", payload: { name: "Crib X", category: "CRIB", daily_rate_cents: 3000, deposit_amount_cents: 15000, weight_kg: 12.0, cleaning_turnaround_hours: 24, deep_clean_every_cycles: 3 }, as: OperationsAdmin, captures: { cat: $.data.id } }
            - { call: "POST /inventory-units", payload: { catalog_item_id: "${cat}", serial_number: "SN-X1", condition_grade: "A" }, as: OperationsAdmin }
            - { call: "POST /reservations", payload: { delivery_address: "33 Alder St", zone_code: "Z1", start_date: "2026-06-10", end_date: "2026-06-13", lines: [ { catalog_item_id: "${cat}" } ] }, as: Customer, as_user_id: "${cust}", captures: { res: $.data.id } }
            - { call: "POST /reservations/${res}/confirm", payload: {}, as: Customer, as_user_id: "${cust}" }
            - { call: "POST /routes", payload: { route_date: "2026-06-10", zone_code: "Z1", vehicle_capacity_kg: 100 }, as: OperationsAdmin, captures: { route_d: $.data.id } }
            - { call: "POST /routes/${route_d}/stops", payload: { reservation_id: "${res}", stop_type: "DELIVERY_SETUP", address: "33 Alder St", time_window_start: "2026-06-10T08:00:00Z", time_window_end: "2026-06-10T10:00:00Z" }, as: OperationsAdmin, captures: { stop_d: $.data.id } }
            - { call: "POST /routes/${route_d}/dispatch", payload: {}, as: OperationsAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-10T09:00:00Z" }, as: OperationsAdmin }
            - { call: "POST /route-stops/${stop_d}/complete", payload: {}, as: OperationsAdmin }
            - { call: "POST /routes", payload: { route_date: "2026-06-13", zone_code: "Z1", vehicle_capacity_kg: 100 }, as: OperationsAdmin, captures: { route_p: $.data.id } }
            - { call: "POST /routes/${route_p}/stops", payload: { reservation_id: "${res}", stop_type: "PICKUP", address: "33 Alder St", time_window_start: "2026-06-13T00:00:00Z", time_window_end: "2026-06-13T06:00:00Z" }, as: OperationsAdmin, captures: { stop_p: $.data.id } }
            - { call: "POST /routes/${route_p}/dispatch", payload: {}, as: OperationsAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-13T04:00:00Z" }, as: OperationsAdmin }
            - { call: "POST /route-stops/${stop_p}/complete", payload: {}, as: OperationsAdmin }
            - { call: "POST /reservations/${res}/settle", payload: {}, as: OperationsAdmin }
          trigger:
            - { call: "POST /reservations/${res}/settle", payload: {}, as: OperationsAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE"
            - "deposit-transactions count unchanged (HOLD + RELEASE only, 2 entries)"

      - name: stop_creation_rejected_for_quoted_reservation
        claim_type: precondition_enforcement
        grounds: [state_machines.RouteStop, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Adding a DELIVERY_SETUP stop requires the reservation CONFIRMED; a QUOTED reservation is rejected."
        test_recipe:
          setup: ["QUOTED reservation (never confirmed); PLANNED route"]
          setup_api_calls:
            - { call: "POST /customers", payload: { full_name: "Gil Hu", email: "gil@x.com", phone: "007" }, as: Anonymous, captures: { cust: $.data.id } }
            - { call: "POST /catalog-items", payload: { name: "Crib Y", category: "CRIB", daily_rate_cents: 3000, deposit_amount_cents: 15000, weight_kg: 12.0, cleaning_turnaround_hours: 24, deep_clean_every_cycles: 3 }, as: OperationsAdmin, captures: { cat: $.data.id } }
            - { call: "POST /inventory-units", payload: { catalog_item_id: "${cat}", serial_number: "SN-Y1", condition_grade: "A" }, as: OperationsAdmin }
            - { call: "POST /reservations", payload: { delivery_address: "34 Beech Ln", zone_code: "Z1", start_date: "2026-06-10", end_date: "2026-06-13", lines: [ { catalog_item_id: "${cat}" } ] }, as: Customer, as_user_id: "${cust}", captures: { res: $.data.id } }
            - { call: "POST /routes", payload: { route_date: "2026-06-10", zone_code: "Z1", vehicle_capacity_kg: 100 }, as: OperationsAdmin, captures: { route: $.data.id } }
          trigger:
            - { call: "POST /routes/${route}/stops", payload: { reservation_id: "${res}", stop_type: "DELIVERY_SETUP", address: "34 Beech Ln", time_window_start: "2026-06-10T08:00:00Z", time_window_end: "2026-06-10T10:00:00Z" }, as: OperationsAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE"

      - name: route_recall_reverts_dispatched_to_planned
        claim_type: valid_transition
        grounds: [state_machines.DeliveryRoute.DISPATCHED_to_PLANNED]
        distinguishing_aspect: "DISPATCHED -> PLANNED revert succeeds while no stop is COMPLETED."
        test_recipe:
          setup: ["DISPATCHED route with one SCHEDULED stop (confirmed reservation)"]
          setup_api_calls:
            - { call: "POST /customers", payload: { full_name: "Hana It", email: "hana@x.com", phone: "008" }, as: Anonymous, captures: { cust: $.data.id } }
            - { call: "POST /catalog-items", payload: { name: "Crib Z", category: "CRIB", daily_rate_cents: 3000, deposit_amount_cents: 15000, weight_kg: 12.0, cleaning_turnaround_hours: 24, deep_clean_every_cycles: 3 }, as: OperationsAdmin, captures: { cat: $.data.id } }
            - { call: "POST /inventory-units", payload: { catalog_item_id: "${cat}", serial_number: "SN-Z1", condition_grade: "A" }, as: OperationsAdmin }
            - { call: "POST /reservations", payload: { delivery_address: "35 Cherry Ct", zone_code: "Z1", start_date: "2026-06-10", end_date: "2026-06-13", lines: [ { catalog_item_id: "${cat}" } ] }, as: Customer, as_user_id: "${cust}", captures: { res: $.data.id } }
            - { call: "POST /reservations/${res}/confirm", payload: {}, as: Customer, as_user_id: "${cust}" }
            - { call: "POST /routes", payload: { route_date: "2026-06-10", zone_code: "Z1", vehicle_capacity_kg: 100 }, as: OperationsAdmin, captures: { route: $.data.id } }
            - { call: "POST /routes/${route}/stops", payload: { reservation_id: "${res}", stop_type: "DELIVERY_SETUP", address: "35 Cherry Ct", time_window_start: "2026-06-10T08:00:00Z", time_window_end: "2026-06-10T10:00:00Z" }, as: OperationsAdmin }
            - { call: "POST /routes/${route}/dispatch", payload: {}, as: OperationsAdmin }
          trigger:
            - { call: "POST /routes/${route}/recall", payload: {}, as: OperationsAdmin, captures: { st: $.data.status } }
          assert:
            - "DeliveryRoute.${route}.status == PLANNED"

      - name: route_recall_rejected_after_completed_stop
        claim_type: precondition_enforcement
        grounds: [state_machines.DeliveryRoute.DISPATCHED_to_PLANNED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Recall is rejected once any stop is COMPLETED; route stays DISPATCHED."
        test_recipe:
          setup: ["DISPATCHED route whose single DELIVERY_SETUP stop has been COMPLETED"]
          setup_api_calls:
            - { call: "POST /customers", payload: { full_name: "Ian Ji", email: "ian@x.com", phone: "009" }, as: Anonymous, captures: { cust: $.data.id } }
            - { call: "POST /catalog-items", payload: { name: "Crib AA", category: "CRIB", daily_rate_cents: 3000, deposit_amount_cents: 15000, weight_kg: 12.0, cleaning_turnaround_hours: 24, deep_clean_every_cycles: 3 }, as: OperationsAdmin, captures: { cat: $.data.id } }
            - { call: "POST /inventory-units", payload: { catalog_item_id: "${cat}", serial_number: "SN-AA1", condition_grade: "A" }, as: OperationsAdmin }
            - { call: "POST /reservations", payload: { delivery_address: "36 Date Dr", zone_code: "Z1", start_date: "2026-06-10", end_date: "2026-06-13", lines: [ { catalog_item_id: "${cat}" } ] }, as: Customer, as_user_id: "${cust}", captures: { res: $.data.id } }
            - { call: "POST /reservations/${res}/confirm", payload: {}, as: Customer, as_user_id: "${cust}" }
            - { call: "POST /routes", payload: { route_date: "2026-06-10", zone_code: "Z1", vehicle_capacity_kg: 100 }, as: OperationsAdmin, captures: { route: $.data.id } }
            - { call: "POST /routes/${route}/stops", payload: { reservation_id: "${res}", stop_type: "DELIVERY_SETUP", address: "36 Date Dr", time_window_start: "2026-06-10T08:00:00Z", time_window_end: "2026-06-10T10:00:00Z" }, as: OperationsAdmin, captures: { stop: $.data.id } }
            - { call: "POST /routes/${route}/dispatch", payload: {}, as: OperationsAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-10T09:00:00Z" }, as: OperationsAdmin }
            - { call: "POST /route-stops/${stop}/complete", payload: {}, as: OperationsAdmin }
          trigger:
            - { call: "POST /routes/${route}/recall", payload: {}, as: OperationsAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE"
            - "DeliveryRoute.${route}.status == DISPATCHED"

      - name: cleaning_fail_returns_unit_to_awaiting
        claim_type: side_effect_execution
        grounds: [state_machines.InventoryUnit.IN_CLEANING_to_AWAITING_CLEANING, state_machines.CleaningTicket.OPEN_to_FAILED]
        distinguishing_aspect: "A FAILED ticket loops the unit back to AWAITING_CLEANING without incrementing cleans_since_deep (stays 0)."
        test_recipe:
          setup: ["Unit returned (auto STANDARD ticket OPEN, unit IN_CLEANING)"]
          setup_api_calls:
            - { call: "POST /customers", payload: { full_name: "Jin Ka", email: "jin@x.com", phone: "010" }, as: Anonymous, captures: { cust: $.data.id } }
            - { call: "POST /catalog-items", payload: { name: "Crib AB", category: "CRIB", daily_rate_cents: 3000, deposit_amount_cents: 15000, weight_kg: 12.0, cleaning_turnaround_hours: 24, deep_clean_every_cycles: 3 }, as: OperationsAdmin, captures: { cat: $.data.id } }
            - { call: "POST /inventory-units", payload: { catalog_item_id: "${cat}", serial_number: "SN-AB1", condition_grade: "A" }, as: OperationsAdmin, captures: { unit: $.data.id } }
            - { call: "POST /reservations", payload: { delivery_address: "37 Elder Pl", zone_code: "Z1", start_date: "2026-06-10", end_date: "2026-06-13", lines: [ { catalog_item_id: "${cat}" } ] }, as: Customer, as_user_id: "${cust}", captures: { res: $.data.id } }
            - { call: "POST /reservations/${res}/confirm", payload: {}, as: Customer, as_user_id: "${cust}" }
            - { call: "POST /routes", payload: { route_date: "2026-06-10", zone_code: "Z1", vehicle_capacity_kg: 100 }, as: OperationsAdmin, captures: { route_d: $.data.id } }
            - { call: "POST /routes/${route_d}/stops", payload: { reservation_id: "${res}", stop_type: "DELIVERY_SETUP", address: "37 Elder Pl", time_window_start: "2026-06-10T08:00:00Z", time_window_end: "2026-06-10T10:00:00Z" }, as: OperationsAdmin, captures: { stop_d: $.data.id } }
            - { call: "POST /routes/${route_d}/dispatch", payload: {}, as: OperationsAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-10T09:00:00Z" }, as: OperationsAdmin }
            - { call: "POST /route-stops/${stop_d}/complete", payload: {}, as: OperationsAdmin }
            - { call: "POST /routes", payload: { route_date: "2026-06-13", zone_code: "Z1", vehicle_capacity_kg: 100 }, as: OperationsAdmin, captures: { route_p: $.data.id } }
            - { call: "POST /routes/${route_p}/stops", payload: { reservation_id: "${res}", stop_type: "PICKUP", address: "37 Elder Pl", time_window_start: "2026-06-13T00:00:00Z", time_window_end: "2026-06-13T06:00:00Z" }, as: OperationsAdmin, captures: { stop_p: $.data.id } }
            - { call: "POST /routes/${route_p}/dispatch", payload: {}, as: OperationsAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-13T04:00:00Z" }, as: OperationsAdmin }
            - { call: "POST /route-stops/${stop_p}/complete", payload: {}, as: OperationsAdmin }
            - { call: "GET /inventory-units/${unit}/cleaning-tickets", payload: {}, as: OperationsAdmin, captures: { ticket: "$.data[0].id" } }
          trigger:
            - { call: "POST /cleaning-tickets/${ticket}/fail", payload: { resolution_note: "still dirty" }, as: Inspector, as_user_id: "insp-1" }
          assert:
            - "CleaningTicket.${ticket}.status == FAILED"
            - "InventoryUnit.${unit}.status == AWAITING_CLEANING"
            - "InventoryUnit.${unit}.cleans_since_deep == 0"

      - name: deep_clean_required_when_cycles_reached
        claim_type: conditional_validation
        grounds: [calculations.availability_count, state_machines.InventoryUnit, "errors[ERR_DEEP_CLEAN_REQUIRED]", entities.CatalogItem.fields.deep_clean_every_cycles]
        distinguishing_aspect: "With deep_clean_every_cycles == 1: after one STANDARD pass (cleans_since_deep 1) the next pickup auto-creates a DEEP ticket, and a manual STANDARD ticket is rejected with ERR_DEEP_CLEAN_REQUIRED."
        test_recipe:
          setup:
            - "Cycle 1 complete (STANDARD pass, cleans 1); cycle 2 rented, delivered, returned at 2026-06-18T00:00:00Z; auto ticket is DEEP and FAILED once to return the unit to AWAITING_CLEANING"
          setup_api_calls:
            - { call: "POST /customers", payload: { full_name: "Kim La", email: "kim@x.com", phone: "011" }, as: Anonymous, captures: { cust: $.data.id } }
            - { call: "POST /catalog-items", payload: { name: "Crib AC", category: "CRIB", daily_rate_cents: 3000, deposit_amount_cents: 15000, weight_kg: 12.0, cleaning_turnaround_hours: 24, deep_clean_every_cycles: 1 }, as: OperationsAdmin, captures: { cat: $.data.id } }
            - { call: "POST /inventory-units", payload: { catalog_item_id: "${cat}", serial_number: "SN-AC1", condition_grade: "A" }, as: OperationsAdmin, captures: { unit: $.data.id } }
            - { call: "POST /reservations", payload: { delivery_address: "38 Fig St", zone_code: "Z1", start_date: "2026-06-10", end_date: "2026-06-13", lines: [ { catalog_item_id: "${cat}" } ] }, as: Customer, as_user_id: "${cust}", captures: { res1: $.data.id } }
            - { call: "POST /reservations/${res1}/confirm", payload: {}, as: Customer, as_user_id: "${cust}" }
            - { call: "POST /routes", payload: { route_date: "2026-06-10", zone_code: "Z1", vehicle_capacity_kg: 100 }, as: OperationsAdmin, captures: { rd1: $.data.id } }
            - { call: "POST /routes/${rd1}/stops", payload: { reservation_id: "${res1}", stop_type: "DELIVERY_SETUP", address: "38 Fig St", time_window_start: "2026-06-10T08:00:00Z", time_window_end: "2026-06-10T10:00:00Z" }, as: OperationsAdmin, captures: { sd1: $.data.id } }
            - { call: "POST /routes/${rd1}/dispatch", payload: {}, as: OperationsAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-10T09:00:00Z" }, as: OperationsAdmin }
            - { call: "POST /route-stops/${sd1}/complete", payload: {}, as: OperationsAdmin }
            - { call: "POST /routes", payload: { route_date: "2026-06-13", zone_code: "Z1", vehicle_capacity_kg: 100 }, as: OperationsAdmin, captures: { rp1: $.data.id } }
            - { call: "POST /routes/${rp1}/stops", payload: { reservation_id: "${res1}", stop_type: "PICKUP", address: "38 Fig St", time_window_start: "2026-06-13T00:00:00Z", time_window_end: "2026-06-13T06:00:00Z" }, as: OperationsAdmin, captures: { sp1: $.data.id } }
            - { call: "POST /routes/${rp1}/dispatch", payload: {}, as: OperationsAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-13T04:00:00Z" }, as: OperationsAdmin }
            - { call: "POST /route-stops/${sp1}/complete", payload: {}, as: OperationsAdmin }
