              as: Anonymous
              captures: { order2_id: $.data.id }
            - call: "POST /pod/orders/${order2_id}/authorize"
              payload: {}
              as: PlatformAdmin
            # For the reject-cascade proper: design2 is currently APPROVED, but reject needs
            # MOCKUP_READY. So create design3 that stays at MOCKUP_READY, but then a listing
            # cannot yet be PUBLISHED without the design being APPROVED. Actually the scaffold
            # says reject flows from MOCKUP_READY. But PUBLISHED listings require APPROVED design.
            # The cascade instead reaches DRAFT listings too. Refocus: create design3 MOCKUP_READY,
            # a DRAFT listing3 against it, and skip publish (order can't be created yet since
            # ERR_LISTING_NOT_AVAILABLE guards Order creation on PUBLISHED). That means the cascade
            # target chain (design3 -> listing3 -> order3) needs listing3 PUBLISHED and order3.
            # -> pivot: reject an ALREADY-APPROVED design isn't allowed. We need a design that
            # is MOCKUP_READY when we reject, but its listing is already PUBLISHED with an order.
            # That's impossible: listing publish precondition requires design APPROVED per prio 10.
