scenario: |
  2963. Content Marketing Editorial Governance (brand content team): editorial calendar planning by
  campaign, persona and funnel stage with capacity constraints, content brief development with search
  intent, keyword targets and subject matter expert assignment, review workflow across subject matter,
  legal, brand and accessibility with turnaround service levels, claim substantiation requirements for
  performance, comparison and regulated statements, publishing with metadata, tagging and distribution
  across owned, email and social channels, content performance measurement with engagement, conversion
  and assisted pipeline attribution, content refresh and pruning based on decay and accuracy audits,
  asset library governance with usage rights and expiration for stock and talent.
domain_name: content-marketing-editorial-governance
api_prefix: /editorial

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: compliance_audit
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - optimistic_concurrency

  difficulty_level: expert_plus
  difficulty_notes: |
    12 entities / 44 endpoints / 36 error codes / 10 calculation rules (2 of them dual-variant) /
    8 state machines. Density, not volume, carries the difficulty: every write endpoint on the
    ContentItem spine reads at least two sibling aggregates (CalendarSlot capacity tiering,
    Campaign governance posture, Claim substantiation, Asset rights window) before it is allowed to
    proceed, and the ordered governance sweep re-derives four different denormalized fields whose
    recomputation order is observable.

  entity_topology: graph
  entity_topology_notes: |
    AssetUsage is a true junction (ContentItem x Asset x channel) so the asset library and the
    editorial spine form a many-to-many graph rather than a tree; every other entity is a peer that
    links by foreign key. No entity is addressed through a nested two-parent URL path.

  state_machine_shape: cyclic
  state_machine_shape_notes: |
    ContentItem cycles IN_REVIEW -> CHANGES_REQUESTED -> DRAFT -> IN_REVIEW and again
    PUBLISHED -> DRAFT via refresh; Claim cycles REJECTED/EXPIRED -> EVIDENCE_PENDING; Asset cycles
    EXPIRED -> LICENSED via renewal; ContentBrief cycles APPROVED -> DRAFT. ContentItem additionally
    forks into three or four ReviewGate rows (LEGAL exists only when the item carries at least one
    Claim) and joins back to READY only when every opened gate is APPROVED or WAIVED. Campaign
    carries two independent axes: the operator-driven `status` axis and the derived
    `governance_posture` axis that gates child writes.

  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate

  role_model: segregation_of_duties
  role_model_notes: |
    Two duty separations are enforced on user identity: the ManagingEditor who created a ContentItem
    may not publish it, and the LegalReviewer who decided a Claim's substantiation may not decide the
    LEGAL ReviewGate on the item that carries that Claim.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: Campaign
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: human-readable campaign code, unique across all campaigns
        constraints: "1-32 chars, uppercase letters/digits/hyphen; unique (case-sensitive)"
      - name: persona
        type: enum
        source: input
        description: audience persona the campaign targets
        constraints: "IT_BUYER | PRACTITIONER | EXECUTIVE | DEVELOPER"
      - name: primary_funnel_stage
        type: enum
        source: input
        description: dominant funnel stage of the campaign, used for reporting only
        constraints: "AWARENESS | CONSIDERATION | DECISION | RETENTION"
      - name: quarter_code
        type: string
        source: input
        description: planning quarter label
        constraints: "matches ^20[0-9]{2}Q[1-4]$"
      - name: status
        type: enum
        source: system
        description: operator-driven lifecycle axis
        default: PLANNING
        constraints: "PLANNING | ACTIVE | CLOSED"
      - name: governance_posture
        type: enum
        source: computed
        description: >-
          derived governance axis, recomputed by calculations.campaign_governance_posture; gates
          child writes independently of `status`
        default: OPEN
        constraints: "OPEN | RESTRICTED | FROZEN"
      - name: breached_gate_count
        type: integer
        source: computed
        description: count of ReviewGate rows in state PENDING with due_at < clock across this campaign's items
      - name: expired_usage_count
        type: integer
        source: computed
        description: count of AssetUsage rows in usage_state RIGHTS_LAPSED across this campaign's items
      - name: unsubstantiated_published_claim_count
        type: integer
        source: computed
        description: >-
          count of Claim rows in substantiation_state IN {DRAFT, EVIDENCE_PENDING, REJECTED, EXPIRED}
          whose ContentItem.workflow_state IN {PUBLISHED, NEEDS_REFRESH}
      - name: committed_points_total
        type: integer
        source: computed
        description: sum of committed_points over every CalendarSlot whose campaign_id is this campaign

  - name: CalendarSlot
    parent: Campaign
    common_fields: true
    fields:
      - name: campaign_id
        type: string
        source: input
        description: "FK -> Campaign.id; owning campaign, taken from the path"
      - name: week_start_date
        type: string
        source: input
        description: ISO date of the Monday that opens the slot week
        constraints: "YYYY-MM-DD, MUST be a Monday (ISO weekday 1); the slot week is the half-open interval [week_start_date T00:00:00Z, week_start_date + 7d T00:00:00Z)"
      - name: funnel_stage
        type: enum
        source: input
        description: funnel stage this slot accepts; a ContentItem may only occupy a slot whose funnel_stage equals its brief's funnel_stage
        constraints: "AWARENESS | CONSIDERATION | DECISION | RETENTION"
      - name: capacity_points
        type: integer
        source: input
        description: editorial capacity of the slot in effort points
        constraints: "integer 1..200"
      - name: committed_points
        type: integer
        source: computed
        description: >-
          sum of ContentItem.commit_points over items whose slot_id is this slot and whose
          workflow_state != PRUNED
        default: 0
      - name: utilization_pct
        type: number
        source: computed
        description: "round_half_up(committed_points / capacity_points * 100, 2)"
      - name: status
        type: enum
        source: computed
        description: OPEN while committed_points < capacity_points, FULL once committed_points >= capacity_points, LOCKED once the slot is locked by POST /editorial/calendar-slots/{id}/lock or by the campaign-close cascade
        default: OPEN
        constraints: "OPEN | FULL | LOCKED"

  - name: SubjectMatterExpert
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: expert display name
        constraints: "1-120 chars"
      - name: expertise_tags
        type: array
        source: input
        description: lowercase topic tags this expert can sign off on
        constraints: "1-8 items, each 1-40 chars lowercase kebab or single word"
      - name: weekly_capacity_hours
        type: integer
        source: input
        description: reviewable hours this expert can hold within a single ISO week
        constraints: "integer 1..60"
      - name: status
        type: enum
        source: system
        description: availability axis
        default: AVAILABLE
        constraints: "AVAILABLE | ON_LEAVE"
      - name: committed_hours_total
        type: integer
        source: computed
        description: >-
          sum of ContentBrief.sme_reserved_hours over briefs whose sme_expert_id is this expert and
          whose state IN {SME_ASSIGNED, APPROVED}
        default: 0

  - name: ContentBrief
    parent: null
    common_fields: true
    fields:
      - name: campaign_id
        type: string
        source: input
        description: "FK -> Campaign.id; campaign the brief plans against"
      - name: funnel_stage
        type: enum
        source: input
        description: funnel stage of the planned asset; must equal the funnel_stage of the CalendarSlot the item later occupies
        constraints: "AWARENESS | CONSIDERATION | DECISION | RETENTION"
      - name: search_intent
        type: enum
        source: input
        description: search intent the brief targets; drives base effort points
        constraints: "INFORMATIONAL | COMMERCIAL | TRANSACTIONAL | NAVIGATIONAL"
      - name: primary_keyword
        type: string
        source: input
        description: primary keyword target; unique per campaign across briefs whose state != ARCHIVED
        constraints: "1-80 chars, lowercase"
      - name: secondary_keywords
        type: array
        source: input
        description: additional keyword targets, no uniqueness constraint
        default: []
        constraints: "0-10 items, each 1-80 chars lowercase"
      - name: target_word_count
        type: integer
        source: input
        description: planned word count, drives the word-block component of effort points
        constraints: "integer 100..9000"
      - name: required_expertise_tag
        type: string
        source: input
        description: tag that the assigned expert's expertise_tags must contain
        constraints: "1-40 chars lowercase"
      - name: requires_regulated_review
        type: boolean
        source: input
        description: marks the brief as carrying regulated statements, adding a fixed effort uplift
        default: false
      - name: review_window_start
        type: datetime
        source: input
        description: start of the half-open window this brief reserves on its expert's week
        constraints: "ISO 8601 UTC with three fractional digits; must fall in the same ISO week as review_window_end"
      - name: review_window_end
        type: datetime
        source: input
        description: exclusive end of the reserved window
        constraints: "> review_window_start; whole-hour duration >= sme_reserved_hours; same ISO week as review_window_start"
      - name: sme_expert_id
        type: string
        source: system
        description: "FK -> SubjectMatterExpert.id; set by assign-sme, cleared when the brief returns to DRAFT"
        default: null
      - name: effort_points
        type: integer
        source: computed
        description: output of calculations.brief_effort_points, frozen at brief creation
      - name: sme_reserved_hours
        type: integer
        source: computed
        description: output of calculations.sme_reserved_hours, frozen at brief creation
      - name: state
        type: enum
        source: system
        description: brief lifecycle
        default: DRAFT
        constraints: "DRAFT | SME_ASSIGNED | APPROVED | ARCHIVED"

  - name: ContentItem
    parent: null
    common_fields: true
    fields:
      - name: brief_id
        type: string
        source: input
        description: "FK -> ContentBrief.id; the approved brief this item realizes; at most one non-PRUNED item per brief"
      - name: slot_id
        type: string
        source: input
        description: "FK -> CalendarSlot.id; the calendar slot whose capacity this item consumes"
      - name: campaign_id
        type: string
        source: computed
        description: "FK -> Campaign.id; denormalized copy of ContentBrief.campaign_id at creation, never rewritten"
      - name: title
        type: string
        source: input
        description: working title
        constraints: "1-160 chars"
      - name: planned_publish_at
        type: datetime
        source: input
        description: intended publication instant; opens the promotion window
        constraints: "ISO 8601 UTC with three fractional digits"
      - name: promotion_window_days
        type: integer
        source: input
        description: "length in days of the promotion window that starts at planned_publish_at; only planned_publish_at itself must fall inside the slot week, the window may extend past it"
        default: 3
        constraints: "integer 1..7"
      - name: effort_points
        type: integer
        source: computed
        description: copy of ContentBrief.effort_points at creation
      - name: commit_points
        type: integer
        source: computed
        description: output of calculations.slot_capacity_commit, frozen at creation and released only on prune
      - name: capacity_tier_at_commit
        type: enum
        source: computed
        description: capacity tier selected from the slot's pre-commit utilization, frozen at creation
        constraints: "LOW | MEDIUM | HIGH"
      - name: workflow_state
        type: enum
        source: system
        description: editorial lifecycle
        default: DRAFT
        constraints: "DRAFT | IN_REVIEW | CHANGES_REQUESTED | READY | PUBLISHED | NEEDS_REFRESH | RETRACTED | PRUNED"
      - name: revision_number
        type: integer
        source: system
        description: increments by 1 on every refresh
        default: 1
      - name: created_by_user_id
        type: string
        source: system
        description: X-User-ID of the ManagingEditor who created the item; one half of the publish duty separation
      - name: published_by_user_id
        type: string
        source: system
        description: X-User-ID of the ManagingEditor who published the current revision
        default: null
      - name: published_at
        type: datetime
        source: system
        description: logical-clock instant of the most recent publish
        default: null
      - name: retracted_at
        type: datetime
        source: system
        description: logical-clock instant of the most recent retraction
        default: null
      - name: meta_description
        type: string
        source: input
        description: publication metadata, supplied at publish time
        default: null
        constraints: "1-200 chars when present; publish additionally requires at least 50 characters (validation priority 27)"
      - name: url_slug
        type: string
        source: input
        description: publication slug, supplied at publish time
        default: null
        constraints: "1-80 chars lowercase kebab-case when present"
      - name: tags
        type: array
        source: input
        description: taxonomy tags supplied at publish time
        default: []
        constraints: "at least 2 items required at publish, each 1-40 chars lowercase"
      - name: accuracy_status
        type: enum
        source: system
        description: outcome of the most recent ACCURACY audit
        default: UNVERIFIED
        constraints: "UNVERIFIED | VERIFIED | INACCURATE"
      - name: last_audit_type
        type: enum
        source: system
        description: audit_type of the most recent audit call
        default: null
        constraints: "DECAY | ACCURACY"
      - name: last_audit_verdict
        type: enum
        source: system
        description: verdict of the most recent audit call; PRUNE is the prune precondition
        default: null
        constraints: "KEEP | REFRESH | PRUNE"
      - name: last_audit_at
        type: datetime
        source: system
        description: logical-clock instant of the most recent audit call
        default: null
      - name: engaged_sessions_total
        type: integer
        source: computed
        description: sum of PerformanceSnapshot.engaged_sessions over all snapshots of this item
        default: 0
      - name: conversions_total
        type: integer
        source: computed
        description: sum of PerformanceSnapshot.conversions over all snapshots of this item
        default: 0
      - name: last_touch_pipeline_cents
        type: integer
        source: computed
        description: LAST_TOUCH variant output of calculations.content_pipeline_attribution
        default: 0
      - name: assisted_pipeline_cents
        type: integer
        source: computed
        description: ASSISTED_FRACTIONAL variant output of calculations.content_pipeline_attribution
        default: 0
      - name: decay_pct
        type: number
        source: computed
        description: output of calculations.content_decay_pct
        default: 0.00
      - name: refresh_required
        type: boolean
        source: computed
        description: "true when decay_pct >= REFRESH_THRESHOLD_PCT[funnel_stage] OR accuracy_status == INACCURATE"
        default: false

  - name: ReviewGate
    parent: ContentItem
    common_fields: true
    fields:
      - name: content_item_id
        type: string
        source: system
        description: "FK -> ContentItem.id; item under review"
      - name: gate_type
        type: enum
        source: system
        description: review dimension; the LEGAL gate is opened only when the item carries at least one Claim
        constraints: "SME | LEGAL | BRAND | ACCESSIBILITY"
      - name: state
        type: enum
        source: system
        description: gate lifecycle
        default: PENDING
        constraints: "PENDING | APPROVED | CHANGES_REQUESTED | WAIVED | VOIDED"
      - name: opened_at
        type: datetime
        source: system
        description: logical-clock instant the gate was opened or reopened
      - name: due_at
        type: datetime
        source: computed
        description: "opened_at + sla_hours; output of calculations.review_gate_sla_due_at"
      - name: sla_hours
        type: integer
        source: computed
        description: whole-hour turnaround service level selected by calculations.review_gate_sla_due_at
      - name: decided_at
        type: datetime
        source: system
        description: logical-clock instant of the decision
        default: null
      - name: decided_by_user_id
        type: string
        source: system
        description: X-User-ID of the decider; opaque operator id, or the SubjectMatterExpert id for the SME gate
        default: null
      - name: decision_notes
        type: string
        source: input
        description: free-text note recorded with the decision
        default: null
        constraints: "0-500 chars"
      - name: turnaround_hours
        type: number
        source: computed
        description: "round_half_up((decided_at - opened_at) / 3600 seconds, 2); null while undecided"
        default: null
      - name: sla_breached
        type: boolean
        source: computed
        description: "true when decided_at > due_at, or when the gate is still PENDING and clock > due_at at the last governance sweep"
        default: false

  - name: Claim
    parent: ContentItem
    common_fields: true
    fields:
      - name: content_item_id
        type: string
        source: system
        description: "FK -> ContentItem.id; item that makes the claim, taken from the path"
      - name: claim_text
        type: string
        source: input
        description: the statement requiring substantiation
        constraints: "10-400 chars"
      - name: claim_type
        type: enum
        source: input
        description: substantiation regime; selects both the required score and the scoring variant
        constraints: "PERFORMANCE | COMPARISON | REGULATED"
      - name: substantiation_state
        type: enum
        source: system
        description: substantiation lifecycle
        default: DRAFT
        constraints: "DRAFT | EVIDENCE_PENDING | SUBSTANTIATED | REJECTED | EXPIRED"
      - name: scoring_variant
        type: enum
        source: computed
        description: "STRICT_REGULATED when claim_type == REGULATED, otherwise STANDARD"
        constraints: "STANDARD | STRICT_REGULATED"
      - name: required_score
        type: number
        source: computed
        description: "REQUIRED_EVIDENCE_SCORE[claim_type] — PERFORMANCE 2.00, COMPARISON 3.00, REGULATED 4.00"
      - name: evidence_score
        type: number
        source: computed
        description: output of calculations.claim_evidence_score under this claim's scoring_variant
        default: 0.00
      - name: evidence_valid_until
        type: datetime
        source: computed
        description: >-
          earliest Evidence.valid_until among the evidence rows that contributed a non-zero weight at
          the moment the claim became SUBSTANTIATED; null while the claim has never been SUBSTANTIATED
        default: null
      - name: decided_by_user_id
        type: string
        source: system
        description: X-User-ID of the LegalReviewer who decided the claim; half of the legal duty separation
        default: null
      - name: decided_at
        type: datetime
        source: system
        description: logical-clock instant of the substantiation decision
        default: null

  - name: Evidence
    parent: Claim
    common_fields: false
    fields:
      - name: claim_id
        type: string
        source: system
        description: "FK -> Claim.id; claim this evidence supports, taken from the path"
      - name: source_type
        type: enum
        source: input
        description: evidence provenance; selects the base weight and STRICT_REGULATED admissibility
        constraints: "INTERNAL_STUDY | THIRD_PARTY_TEST | CUSTOMER_DATA | REGULATORY_FILING"
      - name: citation
        type: string
        source: input
        description: human-readable citation for audit
        constraints: "5-300 chars"
      - name: collected_at
        type: datetime
        source: input
        description: instant the evidence was collected; drives the recency factor
        constraints: "ISO 8601 UTC with three fractional digits, must be <= current logical clock"
      - name: valid_until
        type: datetime
        source: input
        description: instant after which the evidence no longer supports the claim
        constraints: "ISO 8601 UTC with three fractional digits, must be > collected_at"
      - name: weight
        type: number
        source: computed
        description: "EVIDENCE_SOURCE_WEIGHT[source_type], frozen at ingestion (INTERNAL_STUDY 1.00, THIRD_PARTY_TEST 2.00, CUSTOMER_DATA 0.50, REGULATORY_FILING 2.50)"
      - name: submitted_by_user_id
        type: string
        source: system
        description: X-User-ID of the submitter (ManagingEditor or SubjectMatterExpertUser)

  - name: Asset
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: asset library display name
        constraints: "1-120 chars"
      - name: asset_type
        type: enum
        source: input
        description: rights regime; TALENT assets require a notice buffer before license expiry
        constraints: "STOCK | TALENT | ORIGINAL"
      - name: license_start
        type: datetime
        source: input
        description: inclusive start of the licensed window
        constraints: "ISO 8601 UTC with three fractional digits"
      - name: license_end
        type: datetime
        source: input
        description: exclusive end of the licensed window
        constraints: "> license_start"
      - name: licensed_channels
        type: array
        source: input
        description: channels the license permits
        constraints: "1-3 items, each OWNED | EMAIL | SOCIAL, no duplicates"
      - name: max_licensed_uses
        type: integer
        source: input
        description: number of concurrent ACTIVE AssetUsage rows the license permits
        constraints: "integer 1..50"
      - name: active_use_count
        type: integer
        source: computed
        description: count of AssetUsage rows on this asset whose usage_state == ACTIVE
        default: 0
      - name: remaining_licensed_uses
        type: integer
        source: computed
        description: "max_licensed_uses - active_use_count"
      - name: status
        type: enum
        source: computed
        description: >-
          rights posture derived by calculations.asset_license_status against the logical clock and
          refreshed by the governance sweep and by renewal
        default: LICENSED
        constraints: "LICENSED | EXPIRING | EXPIRED"

  - name: AssetUsage
    parent: null
    common_fields: true
    fields:
      - name: content_item_id
        type: string
        source: system
        description: "FK -> ContentItem.id; item that uses the asset, taken from the path"
      - name: asset_id
        type: string
        source: input
        description: "FK -> Asset.id; asset being used"
      - name: channel
        type: enum
        source: input
        description: channel the usage is claimed for; must be present in Asset.licensed_channels
        constraints: "OWNED | EMAIL | SOCIAL"
      - name: usage_state
        type: enum
        source: system
        description: usage lifecycle
        default: ACTIVE
        constraints: "ACTIVE | RIGHTS_LAPSED | RELEASED"
      - name: attached_at
        type: datetime
        source: system
        description: logical-clock instant the usage was attached
      - name: released_at
        type: datetime
        source: system
        description: logical-clock instant the usage was released by retract, refresh or prune
        default: null

  - name: Distribution
    parent: ContentItem
    common_fields: true
    fields:
      - name: content_item_id
        type: string
        source: system
        description: "FK -> ContentItem.id; published item this distribution row belongs to"
      - name: channel
        type: enum
        source: system
        description: distribution channel, one row per channel requested at publish
        constraints: "OWNED | EMAIL | SOCIAL"
      - name: scheduled_at
        type: datetime
        source: system
        description: copy of the publish call's scheduled_at
      - name: state
        type: enum
        source: system
        description: distribution lifecycle
        default: SCHEDULED
        constraints: "SCHEDULED | LIVE | SUPPRESSED | RETRACTED"
      - name: went_live_at
        type: datetime
        source: system
        description: logical-clock instant the row entered LIVE
        default: null
      - name: suppression_reason
        type: enum
        source: system
        description: why the row was suppressed
        default: null
        constraints: "ASSET_RIGHTS_LAPSED | CLAIM_SUBSTANTIATION_EXPIRED"
      - name: suppressed_at
        type: datetime
        source: system
        description: logical-clock instant of suppression
        default: null

  - name: PerformanceSnapshot
    parent: ContentItem
    common_fields: false
    fields:
      - name: content_item_id
        type: string
        source: system
        description: "FK -> ContentItem.id; measured item, taken from the path"
      - name: period_start
        type: datetime
        source: input
        description: inclusive start of the measured half-open period
        constraints: "ISO 8601 UTC with three fractional digits"
      - name: period_end
        type: datetime
        source: input
        description: exclusive end of the measured half-open period
        constraints: "> period_start and <= current logical clock; must not overlap the interior of another snapshot on the same item"
      - name: engaged_sessions
        type: integer
        source: input
        description: engagement metric for the period
        constraints: "integer >= 0"
      - name: conversions
        type: integer
        source: input
        description: conversion metric for the period
        constraints: "integer >= 0"
      - name: influenced_opportunity_amount_cents
        type: integer
        source: input
        description: pipeline amount influenced during the period, in cents
        constraints: "integer >= 0"
      - name: touch_position
        type: enum
        source: input
        description: attribution position of the item within the influenced journey during this period
        constraints: "FIRST | MIDDLE | LAST"

state_machines:
  - entity: Campaign
    initial_state: PLANNING
    terminal_states: [CLOSED]
    note: >-
      Campaign carries two independent axes. This machine is the operator-driven `status` axis; the
      derived `governance_posture` axis (OPEN / RESTRICTED / FROZEN) is never written directly and is
      recomputed by calculations.campaign_governance_posture at the end of every transition listed
      below plus every ContentItem, ReviewGate, Claim, AssetUsage and Asset mutation.
    transitions:
      - from: PLANNING
        to: ACTIVE
        trigger: "POST /editorial/campaigns/{id}/activate"
        actor: ManagingEditor
        preconditions:
          - "Campaign.status == PLANNING"
        side_effects:
          - "Campaign.status = ACTIVE"
          - "recompute Campaign.governance_posture (calculations.campaign_governance_posture)"
          - "increments Campaign.version by 1"
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /editorial/campaigns/{id}/close"
        actor: ManagingEditor
        preconditions:
          - "Campaign.status == ACTIVE"
          - "no ContentItem with campaign_id == this campaign has workflow_state IN {DRAFT, IN_REVIEW, CHANGES_REQUESTED, READY} (else ERR_CAMPAIGN_HAS_OPEN_ITEMS)"
        side_effects:
          - "step 1: Campaign.status = CLOSED"
          - "step 2 (caused by step 1): every CalendarSlot with campaign_id == this campaign and status IN {OPEN, FULL} -> status LOCKED"
          - "step 3 (caused by step 1): every ContentBrief with campaign_id == this campaign and state IN {DRAFT, SME_ASSIGNED} -> state ARCHIVED and sme_expert_id = null"
          - "step 4 (caused by step 3): for every SubjectMatterExpert that lost a brief in step 3, recompute committed_hours_total"
          - "step 5: recompute Campaign.governance_posture"
          - "increments Campaign.version by 1"
        note: "ContentBrief rows in state APPROVED are NOT archived — the cascade is conditional on the child's state."

  - entity: CalendarSlot
    initial_state: OPEN
    terminal_states: [LOCKED]
    transitions:
      - from: OPEN
        to: FULL
        trigger: "system, at the end of POST /editorial/content-items when committed_points >= capacity_points"
        actor: system
        preconditions:
          - "CalendarSlot.status == OPEN"
          - "CalendarSlot.committed_points >= CalendarSlot.capacity_points after the new item's commit_points are added"
        side_effects:
          - "CalendarSlot.status = FULL"
          - "recompute CalendarSlot.utilization_pct"
          - "increments CalendarSlot.version by 1"
      - from: FULL
        to: OPEN
        trigger: "system, at the end of POST /editorial/content-items/{id}/prune when committed_points < capacity_points"
        actor: system
        preconditions:
          - "CalendarSlot.status == FULL"
          - "CalendarSlot.committed_points < CalendarSlot.capacity_points after the pruned item's commit_points are released"
        side_effects:
          - "CalendarSlot.status = OPEN"
          - "recompute CalendarSlot.utilization_pct"
          - "increments CalendarSlot.version by 1"
      - from: OPEN
        to: LOCKED
        trigger: "POST /editorial/calendar-slots/{id}/lock, or system step 2 of the Campaign ACTIVE -> CLOSED cascade"
        actor: ManagingEditor
        preconditions:
          - "CalendarSlot.status == OPEN (ERR_SLOT_STATE_INVALID when already LOCKED)"
          - "for the cascade form: owning Campaign.status transitions to CLOSED in the same request"
        side_effects:
          - "CalendarSlot.status = LOCKED"
          - "committed_points and utilization_pct are unchanged"
          - "increments CalendarSlot.version by 1"
      - from: FULL
        to: LOCKED
        trigger: "POST /editorial/calendar-slots/{id}/lock, or system step 2 of the Campaign ACTIVE -> CLOSED cascade"
        actor: ManagingEditor
        preconditions:
          - "CalendarSlot.status == FULL (ERR_SLOT_STATE_INVALID when already LOCKED)"
          - "for the cascade form: owning Campaign.status transitions to CLOSED in the same request"
        side_effects:
          - "CalendarSlot.status = LOCKED"
          - "committed_points and utilization_pct are unchanged"
          - "increments CalendarSlot.version by 1"

  - entity: SubjectMatterExpert
    initial_state: AVAILABLE
    terminal_states: []
    transitions:
      - from: AVAILABLE
        to: ON_LEAVE
        trigger: "POST /editorial/experts/{id}/availability with status = ON_LEAVE"
        actor: ManagingEditor
        preconditions:
          - "SubjectMatterExpert.status == AVAILABLE"
        side_effects:
          - "step 1: SubjectMatterExpert.status = ON_LEAVE"
          - "step 2 (caused by step 1): every ContentBrief with sme_expert_id == this expert and state IN {SME_ASSIGNED, APPROVED} -> state DRAFT and sme_expert_id = null"
          - "step 3 (caused by step 2): recompute SubjectMatterExpert.committed_hours_total from the surviving briefs"
          - "step 4 (caused by step 2): every ContentItem whose brief_id is one of the briefs reverted in step 2 and whose workflow_state IN {IN_REVIEW, READY} -> workflow_state CHANGES_REQUESTED"
          - "step 5 (caused by step 4): every ReviewGate of those items with state == PENDING -> state VOIDED, decided_at = null, sla_breached = false"
          - "step 6 (caused by step 5): recompute Campaign.governance_posture for every campaign that owned an item touched in step 4"
          - "increments SubjectMatterExpert.version by 1"
        note: "Depth-5 transitive cascade: expert -> brief -> expert hours / item -> gate -> campaign posture. Each hop is caused by the previous hop, not by the original request."
      - from: ON_LEAVE
        to: AVAILABLE
        trigger: "POST /editorial/experts/{id}/availability with status = AVAILABLE"
        actor: ManagingEditor
        preconditions:
          - "SubjectMatterExpert.status == ON_LEAVE"
        side_effects:
          - "SubjectMatterExpert.status = AVAILABLE"
          - "increments SubjectMatterExpert.version by 1"
        note: "Returning from leave never re-attaches the briefs that were reverted in step 2 of the outbound transition."

  - entity: ContentBrief
    initial_state: DRAFT
    terminal_states: [ARCHIVED]
    transitions:
      - from: DRAFT
        to: SME_ASSIGNED
        trigger: "POST /editorial/briefs/{id}/assign-sme"
        actor: ManagingEditor
        preconditions:
          - "ContentBrief.state == DRAFT"
          - "owning Campaign.status == ACTIVE"
          - "owning Campaign.governance_posture != FROZEN"
          - "SubjectMatterExpert.status == AVAILABLE (cross-entity, ERR_EXPERT_UNAVAILABLE)"
          - "ContentBrief.required_expertise_tag IN SubjectMatterExpert.expertise_tags (ERR_EXPERTISE_TAG_MISMATCH)"
          - "no other ContentBrief with the same sme_expert_id and state IN {SME_ASSIGNED, APPROVED} whose [review_window_start, review_window_end) interior-overlaps this brief's window (ERR_EXPERT_WINDOW_OVERLAP)"
          - "sum of sme_reserved_hours over briefs of this expert with state IN {SME_ASSIGNED, APPROVED} whose review_window_start falls in the same ISO week as this brief's review_window_start, plus this brief's sme_reserved_hours, <= SubjectMatterExpert.weekly_capacity_hours (ERR_EXPERT_CAPACITY_EXCEEDED)"
          - "request body expected_expert_version == SubjectMatterExpert.version (ERR_STALE_EXPERT_VERSION)"
        side_effects:
          - "ContentBrief.state = SME_ASSIGNED, ContentBrief.sme_expert_id = body.sme_expert_id"
          - "recompute SubjectMatterExpert.committed_hours_total"
          - "increments SubjectMatterExpert.version by 1"
          - "increments ContentBrief.version by 1"
      - from: SME_ASSIGNED
        to: APPROVED
        trigger: "POST /editorial/briefs/{id}/approve"
        actor: SubjectMatterExpertUser
        preconditions:
          - "ContentBrief.state == SME_ASSIGNED"
          - "X-User-ID == ContentBrief.sme_expert_id (ERR_SME_NOT_ASSIGNED_TO_BRIEF)"
          - "SubjectMatterExpert.status == AVAILABLE"
        side_effects:
          - "ContentBrief.state = APPROVED"
          - "increments ContentBrief.version by 1"
      - from: SME_ASSIGNED
        to: DRAFT
        trigger: "POST /editorial/briefs/{id}/request-changes, or system step 2 of the SubjectMatterExpert ON_LEAVE cascade"
        actor: SubjectMatterExpertUser
        preconditions:
          - "ContentBrief.state IN {SME_ASSIGNED, APPROVED}"
          - "X-User-ID == ContentBrief.sme_expert_id (ERR_SME_NOT_ASSIGNED_TO_BRIEF)"
        side_effects:
          - "step 1: ContentBrief.state = DRAFT, sme_expert_id = null"
          - "step 2 (caused by step 1): recompute SubjectMatterExpert.committed_hours_total for the detached expert"
          - "step 3 (caused by step 1): every ContentItem on this brief with workflow_state IN {IN_REVIEW, READY} -> workflow_state CHANGES_REQUESTED"
          - "step 4 (caused by step 3): every ReviewGate of those items with state == PENDING -> state VOIDED"
          - "step 5 (caused by step 4): recompute Campaign.governance_posture"
          - "increments ContentBrief.version by 1"
      - from: APPROVED
        to: DRAFT
        trigger: "POST /editorial/briefs/{id}/request-changes, or system step 2 of the SubjectMatterExpert ON_LEAVE cascade"
        actor: SubjectMatterExpertUser
        preconditions:
          - "ContentBrief.state IN {SME_ASSIGNED, APPROVED}"
          - "X-User-ID == ContentBrief.sme_expert_id (ERR_SME_NOT_ASSIGNED_TO_BRIEF)"
        side_effects:
          - "identical to the SME_ASSIGNED -> DRAFT cascade above (steps 1-5)"
          - "increments ContentBrief.version by 1"
        note: "This edge closes the brief revision cycle DRAFT -> SME_ASSIGNED -> APPROVED -> DRAFT."
      - from: DRAFT
        to: ARCHIVED
        trigger: "system, step 3 of the Campaign ACTIVE -> CLOSED cascade"
        actor: system
        preconditions:
          - "owning Campaign.status transitions to CLOSED in the same request"
        side_effects:
          - "ContentBrief.state = ARCHIVED, sme_expert_id = null"
          - "increments ContentBrief.version by 1"
      - from: SME_ASSIGNED
        to: ARCHIVED
        trigger: "system, step 3 of the Campaign ACTIVE -> CLOSED cascade"
        actor: system
        preconditions:
          - "owning Campaign.status transitions to CLOSED in the same request"
        side_effects:
          - "ContentBrief.state = ARCHIVED, sme_expert_id = null"
          - "recompute SubjectMatterExpert.committed_hours_total"
          - "increments ContentBrief.version by 1"

  - entity: ContentItem
    initial_state: DRAFT
    terminal_states: [PRUNED]
    note: >-
      Cyclic machine with a fork-join in the middle. IN_REVIEW fans out into three or four ReviewGate
      rows and only rejoins at READY when every opened gate is APPROVED or WAIVED; the revision cycle
      IN_REVIEW -> CHANGES_REQUESTED -> IN_REVIEW and the refresh cycle PUBLISHED -> DRAFT both
      re-enter earlier states.
    transitions:
      - from: NONE
        to: DRAFT
        trigger: "POST /editorial/content-items"
        actor: ManagingEditor
        preconditions:
          - "referenced ContentBrief.state == APPROVED (ERR_BRIEF_NOT_APPROVED)"
          - "referenced Campaign.status == ACTIVE and governance_posture != FROZEN"
          - "CalendarSlot.campaign_id == ContentBrief.campaign_id (ERR_SLOT_CAMPAIGN_MISMATCH)"
          - "CalendarSlot.funnel_stage == ContentBrief.funnel_stage (ERR_SLOT_CAMPAIGN_MISMATCH)"
          - "CalendarSlot.status == OPEN (ERR_SLOT_LOCKED when LOCKED, ERR_SLOT_CAPACITY_EXCEEDED when FULL)"
          - "no other ContentItem with the same brief_id and workflow_state != PRUNED (ERR_BRIEF_ALREADY_HAS_ITEM)"
          - "planned_publish_at is contained in the slot week [week_start_date T00:00:00Z, week_start_date + 7d) (ERR_PUBLISH_OUTSIDE_SLOT_WEEK); the promotion window may extend past the slot week"
          - "calculations.slot_capacity_commit yields committed_points + commit_points <= CalendarSlot.capacity_points (ERR_SLOT_CAPACITY_EXCEEDED)"
          - "request body expected_campaign_version == Campaign.version (ERR_STALE_CAMPAIGN_VERSION)"
        side_effects:
          - "ContentItem created with workflow_state DRAFT, revision_number 1, created_by_user_id = X-User-ID, campaign_id = ContentBrief.campaign_id, effort_points = ContentBrief.effort_points"
          - "ContentItem.commit_points and capacity_tier_at_commit frozen from calculations.slot_capacity_commit"
          - "CalendarSlot.committed_points += ContentItem.commit_points; recompute CalendarSlot.utilization_pct; CalendarSlot.status -> FULL when committed_points >= capacity_points"
          - "recompute Campaign.committed_points_total and Campaign.governance_posture"
          - "increments Campaign.version by 1"
      - from: DRAFT
        to: IN_REVIEW
        trigger: "POST /editorial/content-items/{id}/submit-for-review"
        actor: ManagingEditor
        preconditions:
          - "ContentItem.workflow_state == DRAFT"
          - "ContentBrief.state == APPROVED at submit time (cross-entity, ERR_BRIEF_NOT_APPROVED)"
          - "Campaign.governance_posture != FROZEN (ERR_CAMPAIGN_POSTURE_FROZEN)"
        side_effects:
          - "ContentItem.workflow_state = IN_REVIEW"
          - "opens ReviewGate rows in the fixed order [SME, LEGAL, BRAND, ACCESSIBILITY], omitting LEGAL when the item has zero Claim rows; each gate gets opened_at = clock and sla_hours / due_at from calculations.review_gate_sla_due_at"
          - "recompute Campaign.governance_posture"
          - "increments ContentItem.version by 1"
        note: "Conditional fan-out: three gates without claims, four with at least one claim."
      - from: CHANGES_REQUESTED
        to: IN_REVIEW
        trigger: "POST /editorial/content-items/{id}/submit-for-review"
        actor: ManagingEditor
        preconditions:
          - "ContentItem.workflow_state == CHANGES_REQUESTED"
          - "ContentBrief.state == APPROVED at submit time (ERR_BRIEF_NOT_APPROVED)"
          - "Campaign.governance_posture != FROZEN"
        side_effects:
          - "ContentItem.workflow_state = IN_REVIEW"
          - "every ReviewGate of this item with state IN {CHANGES_REQUESTED, VOIDED} -> PENDING with opened_at = clock, decided_at = null, decided_by_user_id = null, sla_breached = false and freshly computed sla_hours / due_at"
          - "ReviewGate rows already in state APPROVED or WAIVED are left untouched"
          - "a LEGAL gate is opened now when the item has at least one Claim row and no LEGAL gate exists yet"
          - "recompute Campaign.governance_posture"
          - "increments ContentItem.version by 1"
        note: "Closes the revision cycle; re-review is scoped to the gates that objected."
      - from: IN_REVIEW
        to: CHANGES_REQUESTED
        trigger: "system, at the end of POST /editorial/review-gates/{id}/decide with decision = CHANGES_REQUESTED"
        actor: system
        preconditions:
          - "ContentItem.workflow_state == IN_REVIEW"
          - "the decided gate's state becomes CHANGES_REQUESTED"
        side_effects:
          - "ContentItem.workflow_state = CHANGES_REQUESTED"
          - "sibling ReviewGate rows keep their own state — a CHANGES_REQUESTED decision does not void sibling gates"
          - "recompute Campaign.governance_posture"
          - "increments ContentItem.version by 1"
      - from: IN_REVIEW
        to: READY
        trigger: "system, at the end of POST /editorial/review-gates/{id}/decide when the join condition holds"
        actor: system
        preconditions:
          - "ContentItem.workflow_state == IN_REVIEW"
          - "every ReviewGate of this item has state IN {APPROVED, WAIVED} (join over the three or four gates opened at fan-out)"
        side_effects:
          - "ContentItem.workflow_state = READY"
          - "recompute Campaign.governance_posture"
          - "increments ContentItem.version by 1"
      - from: READY
        to: CHANGES_REQUESTED
        trigger: "system, step 3 of the ContentBrief request-changes cascade or step 4 of the SubjectMatterExpert ON_LEAVE cascade"
        actor: system
        preconditions:
          - "ContentItem.workflow_state IN {IN_REVIEW, READY}"
          - "the owning ContentBrief leaves state APPROVED or SME_ASSIGNED in the same request"
        side_effects:
          - "ContentItem.workflow_state = CHANGES_REQUESTED"
          - "every ReviewGate of this item with state == PENDING -> VOIDED"
          - "recompute Campaign.governance_posture"
          - "increments ContentItem.version by 1"
      - from: READY
        to: PUBLISHED
        trigger: "POST /editorial/content-items/{id}/publish"
        actor: ManagingEditor
        preconditions:
          - "ContentItem.workflow_state == READY (ERR_ITEM_STATE_INVALID)"
          - "X-User-ID != ContentItem.created_by_user_id (ERR_SOD_PUBLISH_CONFLICT)"
          - "Campaign.governance_posture != FROZEN (ERR_CAMPAIGN_POSTURE_FROZEN); a RESTRICTED campaign may still publish"
          - "every Claim of this item has substantiation_state == SUBSTANTIATED (ERR_CLAIM_NOT_SUBSTANTIATED)"
          - "for every requested channel and every AssetUsage of this item with usage_state == ACTIVE: Asset.licensed_channels contains the channel (ERR_ASSET_CHANNEL_NOT_LICENSED)"
          - "for every AssetUsage of this item with usage_state == ACTIVE: Asset.license_end > clock (ERR_ASSET_RIGHTS_EXPIRED)"
          - "meta_description is at least 50 characters, url_slug present, tags has >= 2 items (ERR_ACCESSIBILITY_METADATA_MISSING)"
          - "body.scheduled_at is contained in [week_start_date T00:00:00Z, week_start_date + 7d) of the item's slot (ERR_PUBLISH_OUTSIDE_SLOT_WEEK)"
        side_effects:
          - "ContentItem.workflow_state = PUBLISHED, published_at = clock, published_by_user_id = X-User-ID, meta_description / url_slug / tags stored"
          - "creates one Distribution row per requested channel, in the fixed order [OWNED, EMAIL, SOCIAL] restricted to the requested channels, each with scheduled_at = body.scheduled_at and state = LIVE when scheduled_at <= clock else SCHEDULED (went_live_at = clock when LIVE)"
          - "recompute Campaign.governance_posture"
          - "increments ContentItem.version by 1"
      - from: PUBLISHED
        to: NEEDS_REFRESH
        trigger: "system, step 3 or step 7 of POST /editorial/_ops/governance-sweep"
        actor: system
        preconditions:
          - "ContentItem.workflow_state == PUBLISHED"
          - "either every Distribution row of the item has state == SUPPRESSED, or ContentItem.refresh_required == true after the sweep's decay recompute"
        side_effects:
          - "ContentItem.workflow_state = NEEDS_REFRESH"
          - "recompute Campaign.governance_posture"
          - "increments ContentItem.version by 1"
      - from: PUBLISHED
        to: RETRACTED
        trigger: "POST /editorial/content-items/{id}/retract"
        actor: ManagingEditor
        preconditions:
          - "ContentItem.workflow_state IN {PUBLISHED, NEEDS_REFRESH}"
        side_effects:
          - "step 1: ContentItem.workflow_state = RETRACTED, retracted_at = clock"
          - "step 2 (caused by step 1): every Distribution of this item with state IN {SCHEDULED, LIVE, SUPPRESSED} -> RETRACTED"
          - "step 3 (caused by step 1): every AssetUsage of this item with usage_state IN {ACTIVE, RIGHTS_LAPSED} -> RELEASED with released_at = clock"
          - "step 4 (caused by step 3): for every Asset touched in step 3, recompute active_use_count and remaining_licensed_uses"
          - "step 5: recompute Campaign.governance_posture"
          - "increments ContentItem.version by 1"
        note: "Compensating action for publish + asset attachment; CalendarSlot.committed_points is deliberately NOT released (the item still occupies its slot)."
      - from: NEEDS_REFRESH
        to: RETRACTED
        trigger: "POST /editorial/content-items/{id}/retract"
        actor: ManagingEditor
        preconditions:
          - "ContentItem.workflow_state IN {PUBLISHED, NEEDS_REFRESH}"
        side_effects:
          - "identical to the PUBLISHED -> RETRACTED cascade above (steps 1-5)"
          - "increments ContentItem.version by 1"
      - from: NEEDS_REFRESH
        to: DRAFT
        trigger: "POST /editorial/content-items/{id}/refresh"
        actor: ManagingEditor
        preconditions:
          - "ContentItem.workflow_state IN {PUBLISHED, NEEDS_REFRESH}"
          - "ContentItem.workflow_state == NEEDS_REFRESH or ContentItem.refresh_required == true (ERR_REFRESH_NOT_REQUIRED)"
          - "Campaign.status == ACTIVE (ERR_CAMPAIGN_STATE_INVALID) and Campaign.governance_posture != FROZEN (ERR_CAMPAIGN_POSTURE_FROZEN)"
        side_effects:
          - "step 1: ContentItem.workflow_state = DRAFT, revision_number += 1, published_at / published_by_user_id / retracted_at reset to null, accuracy_status = UNVERIFIED, last_audit_verdict = null"
          - "step 2 (caused by step 1): every ReviewGate of this item with state != VOIDED -> VOIDED"
          - "step 3 (caused by step 1): every Distribution of this item with state IN {SCHEDULED, LIVE, SUPPRESSED} -> RETRACTED"
          - "step 4 (caused by step 1): every AssetUsage of this item with usage_state IN {ACTIVE, RIGHTS_LAPSED} -> RELEASED with released_at = clock; the touched Assets' active_use_count / remaining_licensed_uses are recomputed"
          - "step 5: recompute Campaign.governance_posture"
          - "increments ContentItem.version by 1"
        note: "Refresh closes the publish cycle back to DRAFT. commit_points and the slot commitment survive the refresh."
      - from: PUBLISHED
        to: DRAFT
        trigger: "POST /editorial/content-items/{id}/refresh"
        actor: ManagingEditor
        preconditions:
          - "ContentItem.workflow_state IN {PUBLISHED, NEEDS_REFRESH}"
          - "ContentItem.workflow_state == NEEDS_REFRESH or ContentItem.refresh_required == true (ERR_REFRESH_NOT_REQUIRED)"
          - "Campaign.status == ACTIVE (ERR_CAMPAIGN_STATE_INVALID) and Campaign.governance_posture != FROZEN (ERR_CAMPAIGN_POSTURE_FROZEN)"
        side_effects:
          - "identical to the NEEDS_REFRESH -> DRAFT cascade above (steps 1-5)"
          - "increments ContentItem.version by 1"
      - from: NEEDS_REFRESH
        to: PRUNED
        trigger: "POST /editorial/content-items/{id}/prune"
        actor: ManagingEditor
        preconditions:
          - "ContentItem.workflow_state IN {PUBLISHED, NEEDS_REFRESH, RETRACTED}"
          - "ContentItem.last_audit_verdict == PRUNE (ERR_PRUNE_NOT_ELIGIBLE)"
        side_effects:
          - "step 1: ContentItem.workflow_state = PRUNED"
          - "step 2 (caused by step 1): CalendarSlot.committed_points -= ContentItem.commit_points; utilization_pct recomputed; status FULL -> OPEN when committed_points < capacity_points"
          - "step 3 (caused by step 2): recompute Campaign.committed_points_total"
          - "step 4 (caused by step 1): every Distribution of this item with state IN {SCHEDULED, LIVE, SUPPRESSED} -> RETRACTED; every AssetUsage with usage_state IN {ACTIVE, RIGHTS_LAPSED} -> RELEASED; touched Assets recompute active_use_count / remaining_licensed_uses"
          - "step 5: recompute Campaign.governance_posture"
          - "increments ContentItem.version by 1"
        note: "Compensating action for the creation commit; the conserved quantity is capacity points."
      - from: PUBLISHED
        to: PRUNED
        trigger: "POST /editorial/content-items/{id}/prune"
        actor: ManagingEditor
        preconditions:
          - "ContentItem.workflow_state IN {PUBLISHED, NEEDS_REFRESH, RETRACTED}"
          - "ContentItem.last_audit_verdict == PRUNE (ERR_PRUNE_NOT_ELIGIBLE)"
        side_effects:
          - "identical to the NEEDS_REFRESH -> PRUNED cascade above (steps 1-5)"
          - "increments ContentItem.version by 1"
      - from: RETRACTED
        to: PRUNED
        trigger: "POST /editorial/content-items/{id}/prune"
        actor: ManagingEditor
        preconditions:
          - "ContentItem.workflow_state IN {PUBLISHED, NEEDS_REFRESH, RETRACTED}"
          - "ContentItem.last_audit_verdict == PRUNE (ERR_PRUNE_NOT_ELIGIBLE)"
        side_effects:
          - "identical to the NEEDS_REFRESH -> PRUNED cascade above (steps 1-5); steps 3 and 4 are no-ops for rows already RETRACTED or RELEASED"
          - "increments ContentItem.version by 1"

  - entity: ReviewGate
    initial_state: PENDING
    terminal_states: []
    note: >-
      Gate rows are the branches of the ContentItem fork-join. Each gate_type is decided by exactly
      one role; only BRAND and ACCESSIBILITY are waivable. APPROVED and WAIVED are stable until a
      refresh voids them.
    transitions:
      - from: NONE
        to: PENDING
        trigger: "system, fan-out inside POST /editorial/content-items/{id}/submit-for-review"
        actor: system
        preconditions:
          - "the owning ContentItem enters IN_REVIEW in the same request"
          - "gate_type == LEGAL is created only when the item has at least one Claim row"
        side_effects:
          - "ReviewGate created with state PENDING, opened_at = clock, sla_hours and due_at from calculations.review_gate_sla_due_at"
      - from: PENDING
        to: APPROVED
        trigger: "POST /editorial/review-gates/{id}/decide with decision = APPROVED"
        actor: "SubjectMatterExpertUser | LegalReviewer | BrandReviewer | AccessibilityReviewer"
        preconditions:
          - "ReviewGate.state == PENDING (ERR_GATE_ALREADY_DECIDED)"
          - "acting role matches gate_type per the RBAC matrix (ERR_GATE_ROLE_MISMATCH)"
          - "for gate_type == SME: X-User-ID == ContentBrief.sme_expert_id of the item's brief (ERR_SME_NOT_ASSIGNED_TO_BRIEF)"
          - "for gate_type == LEGAL: X-User-ID != Claim.decided_by_user_id of every Claim on this item (ERR_SOD_LEGAL_CONFLICT)"
          - "owning ContentItem.workflow_state == IN_REVIEW (ERR_ITEM_STATE_INVALID)"
        side_effects:
          - "ReviewGate.state = APPROVED, decided_at = clock, decided_by_user_id = X-User-ID, decision_notes stored"
          - "turnaround_hours computed; sla_breached = (decided_at > due_at)"
          - "when every gate of the item is now APPROVED or WAIVED: ContentItem IN_REVIEW -> READY"
          - "recompute Campaign.governance_posture (a decided gate no longer counts toward breached_gate_count)"
          - "increments ReviewGate.version by 1"
      - from: PENDING
        to: CHANGES_REQUESTED
        trigger: "POST /editorial/review-gates/{id}/decide with decision = CHANGES_REQUESTED"
        actor: "SubjectMatterExpertUser | LegalReviewer | BrandReviewer | AccessibilityReviewer"
        preconditions:
          - "ReviewGate.state == PENDING (ERR_GATE_ALREADY_DECIDED)"
          - "acting role matches gate_type per the RBAC matrix (ERR_GATE_ROLE_MISMATCH)"
          - "owning ContentItem.workflow_state == IN_REVIEW"
        side_effects:
          - "ReviewGate.state = CHANGES_REQUESTED, decided_at = clock, decided_by_user_id = X-User-ID"
          - "turnaround_hours computed; sla_breached = (decided_at > due_at)"
          - "owning ContentItem IN_REVIEW -> CHANGES_REQUESTED"
          - "recompute Campaign.governance_posture"
          - "increments ReviewGate.version by 1"
      - from: PENDING
        to: WAIVED
        trigger: "POST /editorial/review-gates/{id}/decide with decision = WAIVED"
        actor: ManagingEditor
        preconditions:
          - "ReviewGate.state == PENDING"
          - "ReviewGate.gate_type IN {BRAND, ACCESSIBILITY} (ERR_GATE_NOT_WAIVABLE)"
          - "Campaign.governance_posture == OPEN (ERR_CAMPAIGN_POSTURE_RESTRICTED / ERR_CAMPAIGN_POSTURE_FROZEN)"
          - "owning ContentItem.workflow_state == IN_REVIEW"
        side_effects:
          - "ReviewGate.state = WAIVED, decided_at = clock, decided_by_user_id = X-User-ID"
          - "turnaround_hours computed; sla_breached = (decided_at > due_at)"
          - "when every gate of the item is now APPROVED or WAIVED: ContentItem IN_REVIEW -> READY"
          - "recompute Campaign.governance_posture"
          - "increments ReviewGate.version by 1"
      - from: PENDING
        to: VOIDED
        trigger: "system, step 5 of the SubjectMatterExpert ON_LEAVE cascade, step 4 of the ContentBrief request-changes cascade, or step 2 of the refresh cascade"
        actor: system
        preconditions:
          - "ReviewGate.state == PENDING"
        side_effects:
          - "ReviewGate.state = VOIDED, decided_at = null, sla_breached = false"
          - "increments ReviewGate.version by 1"
      - from: APPROVED
        to: VOIDED
        trigger: "system, step 2 of the refresh cascade"
        actor: system
        preconditions:
          - "owning ContentItem transitions to DRAFT via refresh in the same request"
        side_effects:
          - "ReviewGate.state = VOIDED"
          - "increments ReviewGate.version by 1"
      - from: WAIVED
        to: VOIDED
        trigger: "system, step 2 of the refresh cascade"
        actor: system
        preconditions:
          - "owning ContentItem transitions to DRAFT via refresh in the same request"
        side_effects:
          - "ReviewGate.state = VOIDED"
          - "increments ReviewGate.version by 1"
      - from: CHANGES_REQUESTED
        to: PENDING
        trigger: "POST /editorial/content-items/{id}/submit-for-review (resubmit)"
        actor: ManagingEditor
        preconditions:
          - "owning ContentItem.workflow_state == CHANGES_REQUESTED"
        side_effects:
          - "ReviewGate.state = PENDING, opened_at = clock, decided_at = null, decided_by_user_id = null, sla_breached = false, turnaround_hours = null"
          - "sla_hours and due_at recomputed against the state of the item at resubmit time"
          - "increments ReviewGate.version by 1"
      - from: VOIDED
        to: PENDING
        trigger: "POST /editorial/content-items/{id}/submit-for-review (resubmit)"
        actor: ManagingEditor
        preconditions:
          - "owning ContentItem.workflow_state == CHANGES_REQUESTED"
        side_effects:
          - "identical to the CHANGES_REQUESTED -> PENDING reopen above"
          - "increments ReviewGate.version by 1"

  - entity: Claim
    initial_state: DRAFT
    terminal_states: []
    note: "Cyclic: a REJECTED or EXPIRED claim re-enters EVIDENCE_PENDING as soon as new evidence is filed, and EVIDENCE_PENDING carries a self-loop so a dossier can be built up one row at a time. SUBSTANTIATED is the only state that refuses new evidence."
    transitions:
      - from: DRAFT
        to: EVIDENCE_PENDING
        trigger: "POST /editorial/claims/{id}/evidence"
        actor: "ManagingEditor | SubjectMatterExpertUser"
        preconditions:
          - "Claim.substantiation_state IN {DRAFT, EVIDENCE_PENDING, REJECTED, EXPIRED} — only SUBSTANTIATED refuses new evidence (ERR_CLAIM_STATE_INVALID)"
          - "owning ContentItem.workflow_state != PRUNED (ERR_ITEM_STATE_INVALID)"
          - "body.collected_at <= clock and body.valid_until > body.collected_at"
        side_effects:
          - "Evidence row appended with weight = EVIDENCE_SOURCE_WEIGHT[source_type]"
          - "Claim.substantiation_state = EVIDENCE_PENDING; decided_by_user_id and decided_at reset to null"
          - "recompute Claim.evidence_score under Claim.scoring_variant"
          - "increments Claim.version by 1"
      - from: REJECTED
        to: EVIDENCE_PENDING
        trigger: "POST /editorial/claims/{id}/evidence"
        actor: "ManagingEditor | SubjectMatterExpertUser"
        preconditions:
          - "Claim.substantiation_state IN {DRAFT, EVIDENCE_PENDING, REJECTED, EXPIRED} — only SUBSTANTIATED refuses new evidence (ERR_CLAIM_STATE_INVALID)"
        side_effects:
          - "identical to the DRAFT -> EVIDENCE_PENDING side effects"
          - "increments Claim.version by 1"
      - from: EXPIRED
        to: EVIDENCE_PENDING
        trigger: "POST /editorial/claims/{id}/evidence"
        actor: "ManagingEditor | SubjectMatterExpertUser"
        preconditions:
          - "Claim.substantiation_state IN {DRAFT, EVIDENCE_PENDING, REJECTED, EXPIRED} — only SUBSTANTIATED refuses new evidence (ERR_CLAIM_STATE_INVALID)"
        side_effects:
          - "identical to the DRAFT -> EVIDENCE_PENDING side effects; Claim.evidence_valid_until is cleared to null until the claim is substantiated again"
          - "recompute Campaign.governance_posture (an EXPIRED claim on a PUBLISHED item was freezing the campaign)"
          - "increments Claim.version by 1"
      - from: EVIDENCE_PENDING
        to: EVIDENCE_PENDING
        trigger: "POST /editorial/claims/{id}/evidence"
        actor: "ManagingEditor | SubjectMatterExpertUser"
        preconditions:
          - "Claim.substantiation_state IN {DRAFT, EVIDENCE_PENDING, REJECTED, EXPIRED} — only SUBSTANTIATED refuses new evidence (ERR_CLAIM_STATE_INVALID)"
        side_effects:
          - "Evidence row appended with weight = EVIDENCE_SOURCE_WEIGHT[source_type]; the claim stays EVIDENCE_PENDING"
          - "recompute Claim.evidence_score under Claim.scoring_variant over every Evidence row of the claim"
          - "increments Claim.version by 1"
      - from: EVIDENCE_PENDING
        to: SUBSTANTIATED
        trigger: "POST /editorial/claims/{id}/decide with decision = SUBSTANTIATED"
        actor: LegalReviewer
        preconditions:
          - "Claim.substantiation_state == EVIDENCE_PENDING (ERR_CLAIM_STATE_INVALID)"
          - "Claim.evidence_score >= Claim.required_score (ERR_EVIDENCE_INSUFFICIENT)"
          - "at least one contributing Evidence row has valid_until > clock (ERR_EVIDENCE_EXPIRED)"
        side_effects:
          - "Claim.substantiation_state = SUBSTANTIATED, decided_by_user_id = X-User-ID, decided_at = clock"
          - "Claim.evidence_valid_until = earliest valid_until among evidence rows that contributed a non-zero weight"
          - "recompute Campaign.governance_posture"
          - "increments Claim.version by 1"
      - from: EVIDENCE_PENDING
        to: REJECTED
        trigger: "POST /editorial/claims/{id}/decide with decision = REJECTED"
        actor: LegalReviewer
        preconditions:
          - "Claim.substantiation_state == EVIDENCE_PENDING (ERR_CLAIM_STATE_INVALID)"
        side_effects:
          - "Claim.substantiation_state = REJECTED, decided_by_user_id = X-User-ID, decided_at = clock"
          - "recompute Campaign.governance_posture"
          - "increments Claim.version by 1"
      - from: SUBSTANTIATED
        to: EXPIRED
        trigger: "system, step 4 of POST /editorial/_ops/governance-sweep"
        actor: system
        preconditions:
          - "Claim.substantiation_state == SUBSTANTIATED"
          - "Claim.evidence_valid_until <= clock"
        side_effects:
          - "step 1: Claim.substantiation_state = EXPIRED"
          - "step 2 (caused by step 1): when the owning ContentItem.workflow_state IN {PUBLISHED, NEEDS_REFRESH}, every Distribution of that item with state IN {SCHEDULED, LIVE} -> SUPPRESSED with suppression_reason = CLAIM_SUBSTANTIATION_EXPIRED"
          - "step 3 (caused by step 1): recompute Campaign.unsubstantiated_published_claim_count and governance_posture (-> FROZEN)"
          - "increments Claim.version by 1"

  - entity: Asset
    initial_state: LICENSED
    terminal_states: []
    note: "Cyclic: an EXPIRED asset returns to LICENSED through renewal, which also restores the usages and distributions its expiry had knocked down."
    transitions:
      - from: LICENSED
        to: EXPIRING
        trigger: "system, step 1 of POST /editorial/_ops/governance-sweep"
        actor: system
        preconditions:
          - "Asset.status == LICENSED"
          - "license_end > clock and license_end - clock <= ASSET_EXPIRY_WARNING_DAYS"
        side_effects:
          - "Asset.status = EXPIRING"
          - "increments Asset.version by 1"
      - from: EXPIRING
        to: EXPIRED
        trigger: "system, step 1 of POST /editorial/_ops/governance-sweep"
        actor: system
        preconditions:
          - "Asset.status IN {LICENSED, EXPIRING}"
          - "license_end <= clock"
        side_effects:
          - "step 1: Asset.status = EXPIRED"
          - "step 2 (caused by step 1): every AssetUsage on this asset with usage_state == ACTIVE -> RIGHTS_LAPSED; Asset.active_use_count and remaining_licensed_uses recomputed"
          - "step 3 (caused by step 2): for each lapsed usage, every Distribution of the same ContentItem on the same channel with state IN {SCHEDULED, LIVE} -> SUPPRESSED with suppression_reason = ASSET_RIGHTS_LAPSED"
          - "step 4 (caused by step 3): a PUBLISHED item whose every Distribution row is now SUPPRESSED -> NEEDS_REFRESH"
          - "step 5 (caused by steps 2-4): recompute Campaign.expired_usage_count and governance_posture"
          - "increments Asset.version by 1"
      - from: LICENSED
        to: EXPIRED
        trigger: "system, step 1 of POST /editorial/_ops/governance-sweep"
        actor: system
        preconditions:
          - "Asset.status == LICENSED"
          - "license_end <= clock (the warning window was never observed by a sweep)"
        side_effects:
          - "identical to the EXPIRING -> EXPIRED cascade above (steps 1-5)"
          - "increments Asset.version by 1"
      - from: EXPIRED
        to: LICENSED
        trigger: "POST /editorial/assets/{id}/renew"
        actor: ManagingEditor
        preconditions:
          - "body.new_license_end > clock and > Asset.license_end — both legs report ERR_ASSET_RENEWAL_NOT_EXTENDING (validation priority 34)"
        side_effects:
          - "step 1: Asset.license_end = body.new_license_end, Asset.status = LICENSED"
          - "step 2 (caused by step 1): every AssetUsage on this asset with usage_state == RIGHTS_LAPSED -> ACTIVE with released_at = null; active_use_count and remaining_licensed_uses recomputed"
          - "step 3 (caused by step 2): every Distribution suppressed with suppression_reason == ASSET_RIGHTS_LAPSED on the same item and channel -> LIVE when scheduled_at <= clock else SCHEDULED, suppression_reason = null"
          - "step 4: recompute Campaign.expired_usage_count and governance_posture"
          - "increments Asset.version by 1"
        note: "ContentItem rows already moved to NEEDS_REFRESH are NOT moved back — the restoration is deliberately partial."
      - from: EXPIRING
        to: LICENSED
        trigger: "POST /editorial/assets/{id}/renew"
        actor: ManagingEditor
        preconditions:
          - "body.new_license_end > clock and > Asset.license_end"
        side_effects:
          - "identical to the EXPIRED -> LICENSED side effects (steps 1-4); steps 2 and 3 are no-ops when no usage lapsed"
          - "increments Asset.version by 1"

  - entity: Distribution
    initial_state: SCHEDULED
    terminal_states: [RETRACTED]
    transitions:
      - from: NONE
        to: SCHEDULED
        trigger: "system, inside POST /editorial/content-items/{id}/publish when body.scheduled_at > clock"
        actor: system
        preconditions:
          - "the owning ContentItem enters PUBLISHED in the same request"
        side_effects:
          - "Distribution created with state SCHEDULED"
      - from: NONE
        to: LIVE
        trigger: "system, inside POST /editorial/content-items/{id}/publish when body.scheduled_at <= clock"
        actor: system
        preconditions:
          - "the owning ContentItem enters PUBLISHED in the same request"
        side_effects:
          - "Distribution created with state LIVE and went_live_at = clock"
      - from: SCHEDULED
        to: LIVE
        trigger: "system, step 5 of POST /editorial/_ops/governance-sweep"
        actor: system
        preconditions:
          - "Distribution.state == SCHEDULED"
          - "Distribution.scheduled_at <= clock"
        side_effects:
          - "Distribution.state = LIVE, went_live_at = clock"
          - "increments Distribution.version by 1"
      - from: LIVE
        to: SUPPRESSED
        trigger: "system, step 3 of the Asset expiry cascade or step 2 of the Claim expiry cascade"
        actor: system
        preconditions:
          - "Distribution.state IN {SCHEDULED, LIVE}"
        side_effects:
          - "Distribution.state = SUPPRESSED, suppressed_at = clock, suppression_reason set to ASSET_RIGHTS_LAPSED or CLAIM_SUBSTANTIATION_EXPIRED"
          - "increments Distribution.version by 1"
      - from: SCHEDULED
        to: SUPPRESSED
        trigger: "system, step 3 of the Asset expiry cascade or step 2 of the Claim expiry cascade"
        actor: system
        preconditions:
          - "Distribution.state IN {SCHEDULED, LIVE}"
        side_effects:
          - "identical to the LIVE -> SUPPRESSED side effects"
          - "increments Distribution.version by 1"
      - from: SUPPRESSED
        to: LIVE
        trigger: "system, step 3 of the Asset renewal restoration"
        actor: system
        preconditions:
          - "Distribution.suppression_reason == ASSET_RIGHTS_LAPSED"
          - "Distribution.scheduled_at <= clock"
        side_effects:
          - "Distribution.state = LIVE, went_live_at = clock, suppression_reason = null, suppressed_at = null"
          - "increments Distribution.version by 1"
      - from: SUPPRESSED
        to: SCHEDULED
        trigger: "system, step 3 of the Asset renewal restoration"
        actor: system
        preconditions:
          - "Distribution.suppression_reason == ASSET_RIGHTS_LAPSED"
          - "Distribution.scheduled_at > clock"
        side_effects:
          - "Distribution.state = SCHEDULED, suppression_reason = null, suppressed_at = null"
          - "increments Distribution.version by 1"
      - from: LIVE
        to: RETRACTED
        trigger: "system, step 2 of the retract cascade, step 3 of the refresh cascade or step 4 of the prune cascade"
        actor: system
        preconditions:
          - "Distribution.state IN {SCHEDULED, LIVE, SUPPRESSED}"
        side_effects:
          - "Distribution.state = RETRACTED"
          - "increments Distribution.version by 1"
      - from: SUPPRESSED
        to: RETRACTED
        trigger: "system, step 2 of the retract cascade, step 3 of the refresh cascade or step 4 of the prune cascade"
        actor: system
        preconditions:
          - "Distribution.state IN {SCHEDULED, LIVE, SUPPRESSED}"
        side_effects:
          - "Distribution.state = RETRACTED"
          - "increments Distribution.version by 1"
      - from: SCHEDULED
        to: RETRACTED
        trigger: "system, step 2 of the retract cascade, step 3 of the refresh cascade or step 4 of the prune cascade"
        actor: system
        preconditions:
          - "Distribution.state IN {SCHEDULED, LIVE, SUPPRESSED}"
        side_effects:
          - "Distribution.state = RETRACTED"
          - "increments Distribution.version by 1"

concurrency_rules:
  - rule_id: content-item-create-stale-campaign
    parent_entity: Campaign
    write_endpoint: "POST /editorial/content-items"
    occ_field: "expected_campaign_version"
    description: |
      Creating a ContentItem consumes CalendarSlot capacity and advances the campaign's
      committed_points_total, so the caller must prove it observed the campaign's current
      commitment ledger. A create whose expected_campaign_version is behind Campaign.version is
      rejected: the client's view of committed capacity is stale because another item commit (or a
      posture recompute) has already advanced the campaign. Under the product's natural semantics
      the second create is a legitimate operation — capacity may well be available — so this cannot
      be reduced to a state precondition; it is resolved purely by the version check.
    error_id: ERR_STALE_CAMPAIGN_VERSION
    http_status: 412

  - rule_id: brief-assign-sme-stale-expert
    parent_entity: SubjectMatterExpert
    write_endpoint: "POST /editorial/briefs/{id}/assign-sme"
    occ_field: "expected_expert_version"
    description: |
      Assigning a brief to an expert reserves hours against that expert's ISO-week capacity. A call
      whose expected_expert_version is behind SubjectMatterExpert.version is rejected: the reserved
      hours the client believed were free have already been changed by another assignment or by a
      leave transition. Assigning a second, different brief to the same expert is a legitimate
      operation whenever capacity remains, so no state precondition covers it — only the version
      check does.
    error_id: ERR_STALE_EXPERT_VERSION
    http_status: 412

calculations:
  - name: brief_effort_points
    trigger: "on POST /editorial/briefs, and recomputed on every PATCH-equivalent re-approval path that changes target_word_count, search_intent, funnel_stage or requires_regulated_review"
    algorithm: weighted_scoring
    formula: |
      raw = INTENT_BASE[search_intent]
          + WORDCOUNT_STEP_POINTS * ceil(target_word_count / WORDCOUNT_STEP_WORDS)
          + FUNNEL_UPLIFT[funnel_stage]
          + (REGULATED_UPLIFT if requires_regulated_review else 0)
      effort_points = min(MAX_EFFORT_POINTS, max(MIN_EFFORT_POINTS, raw))
    input_set: "the single ContentBrief being written; no cross-entity inputs"
    constants:
      INTENT_BASE: { INFORMATIONAL: 4, COMMERCIAL: 6, TRANSACTIONAL: 8, NAVIGATIONAL: 3 }
      WORDCOUNT_STEP_WORDS: 500
      WORDCOUNT_STEP_POINTS: 2
      FUNNEL_UPLIFT: { AWARENESS: 0, CONSIDERATION: 2, DECISION: 4, RETENTION: 1 }
      REGULATED_UPLIFT: 5
      MIN_EFFORT_POINTS: 6
      MAX_EFFORT_POINTS: 40
    precision: "integer points; ceil on the word-count step, then clamp"

  - name: sme_reserved_hours
    trigger: "on POST /editorial/briefs, immediately after brief_effort_points"
    algorithm: threshold
    formula: |
      sme_reserved_hours = ceil(effort_points * HOURS_PER_POINT)
    input_set: "the ContentBrief's own effort_points"
    constants:
      HOURS_PER_POINT: 0.5
    precision: "integer hours, ceil"

  - name: expert_week_committed_hours
    trigger: "on POST /editorial/briefs/{id}/assign-sme (before the capacity check), on POST /editorial/briefs/{id}/approve, on POST /editorial/briefs/{id}/request-changes, and on POST /editorial/experts/{id}/availability"
    algorithm: aggregation
    formula: |
      iso_week(t) = the Monday 00:00:00Z of the ISO week containing t
      committed = sum(
        b.sme_reserved_hours
        for b in ContentBrief
        if b.sme_expert_id == expert.id
        and b.state in COUNTED_BRIEF_STATES
        and iso_week(b.review_window_start) == iso_week(target_window_start)
      )
      SubjectMatterExpert.committed_hours_total = sum of sme_reserved_hours over ALL
        briefs of this expert in COUNTED_BRIEF_STATES, across every week
    input_set: "ContentBrief rows for one expert whose state is SME_ASSIGNED or APPROVED; DRAFT and ARCHIVED briefs are excluded"
    constants:
      COUNTED_BRIEF_STATES: [SME_ASSIGNED, APPROVED]
    precision: "integer hours; the per-week figure gates assignment, committed_hours_total is the denormalised all-weeks ledger on the expert"

  - name: slot_capacity_commit
    trigger: "on POST /editorial/content-items, before the CalendarSlot capacity check"
    algorithm: tiered_pricing
    formula: |
      # STEP ORDER IS PINNED AND OBSERVABLE. The tier is selected from the utilization the slot
      # had BEFORE this item's points are added, and the surcharge produced by that tier is
      # NEVER allowed to re-select the tier.
      step 1: pre_utilization_pct = round_half_up(slot.committed_points * 100 / slot.capacity_points, 2)
      step 2: tier = HIGH   if pre_utilization_pct >= TIER_HIGH_PCT
              tier = MEDIUM if pre_utilization_pct >= TIER_MEDIUM_PCT
              tier = LOW    otherwise
      step 3: surcharge = TIER_SURCHARGE_POINTS[tier]
      step 4: commit_points = brief.effort_points + surcharge
      step 5: projected = slot.committed_points + commit_points
      step 6: reject with ERR_SLOT_CAPACITY_EXCEEDED when projected > slot.capacity_points
      step 7: slot.committed_points = projected
              slot.utilization_pct = round_half_up(projected * 100 / slot.capacity_points, 2)
              slot.status = FULL when projected == slot.capacity_points else OPEN
              ContentItem.capacity_tier_at_commit = tier   # the tier from step 2, not a re-derivation
      # Recomputing the tier from the POST-commit utilization (steps 2 and 7 swapped) changes the
      # surcharge, and therefore changes whether step 6 rejects. Both orders are arithmetically
      # plausible; only this one is correct.
    input_set: "one CalendarSlot and the ContentBrief being committed against it"
    constants:
      TIER_HIGH_PCT: 80.00
      TIER_MEDIUM_PCT: 50.00
      TIER_SURCHARGE_POINTS: { LOW: 0, MEDIUM: 1, HIGH: 3 }
    precision: "committed_points and commit_points are integers; utilization_pct is 2 decimal places, round_half_up"

  - name: review_gate_sla_due_at
    trigger: "on POST /editorial/content-items/{id}/submit-for-review, once per gate created or reopened"
    algorithm: threshold
    formula: |
      base = GATE_BASE_HOURS[gate_type]
      factor_product = 1.0
      factor_product *= DECISION_STAGE_FACTOR when brief.funnel_stage == DECISION
      factor_product *= EXECUTIVE_PERSONA_FACTOR when campaign.persona == EXECUTIVE
      sla_hours = round_half_up(base * factor_product, 0)          # all factors multiplied FIRST, rounded ONCE
      when gate_type == LEGAL:
        open_regulated = count(c in Claim
                               if c.content_item_id == item.id
                               and c.claim_type == REGULATED
                               and c.substantiation_state != SUBSTANTIATED)
        sla_hours = sla_hours + REGULATED_CLAIM_EXTRA_HOURS * open_regulated
      due_at = opened_at + sla_hours hours
    input_set: "the gate being opened, plus the item's ContentBrief, the brief's Campaign, and (for LEGAL only) the item's Claim rows"
    constants:
      GATE_BASE_HOURS: { SME: 24, LEGAL: 48, BRAND: 24, ACCESSIBILITY: 36 }
      DECISION_STAGE_FACTOR: 1.25
      EXECUTIVE_PERSONA_FACTOR: 1.15
      REGULATED_CLAIM_EXTRA_HOURS: 12
    precision: "sla_hours is a whole number of hours, round_half_up applied exactly once to the full factor product (24 * 1.25 * 1.15 = 34.5 -> 35, never 24 -> 30 -> 34.5 -> 35 by successive rounding)"

  - name: claim_evidence_score
    trigger: "on POST /editorial/claims/{id}/evidence, and re-evaluated on POST /editorial/claims/{id}/decide"
    algorithm: weighted_scoring
    formula: |
      age_days(e) = floor((clock - e.collected_at) / 86400 seconds)
      contribution(e) = 0 when e.source_type not in ADMISSIBLE_SOURCE_TYPES[variant]
                        else EVIDENCE_SOURCE_WEIGHT[e.source_type] * recency_factor(e, variant)
      evidence_score = round_half_up(sum(contribution(e) for e in Evidence of this claim), 2)
      required_score = REQUIRED_SCORE[claim_type]
    input_set: "every Evidence row of the claim; no state filter (expired-by-valid_until rows still contribute weight, but substantiation additionally requires at least one contributing row with valid_until > clock)"
    constants:
      EVIDENCE_SOURCE_WEIGHT: { INTERNAL_STUDY: 1.0, THIRD_PARTY_TEST: 2.0, CUSTOMER_DATA: 0.5, REGULATORY_FILING: 2.5 }
      REQUIRED_SCORE: { PERFORMANCE: 2.00, COMPARISON: 3.00, REGULATED: 4.00 }
      STANDARD_FULL_RECENCY_DAYS: 730
      STANDARD_STALE_FACTOR: 0.5
      STRICT_FULL_RECENCY_DAYS: 365
      STRICT_STALE_FACTOR: 0.0
    precision: "2 decimal places, round_half_up, applied once to the summed contributions"
    variants:
      - name: STANDARD
        when: "Claim.claim_type IN {PERFORMANCE, COMPARISON}; Claim.scoring_variant is set to STANDARD at creation"
        difference: "ADMISSIBLE_SOURCE_TYPES = all four source types; recency_factor = 1.0 when age_days <= 730 else 0.5 — stale evidence is discounted, never discarded"
      - name: STRICT_REGULATED
        when: "Claim.claim_type == REGULATED; Claim.scoring_variant is set to STRICT_REGULATED at creation"
        difference: "ADMISSIBLE_SOURCE_TYPES = {THIRD_PARTY_TEST, REGULATORY_FILING} only (INTERNAL_STUDY and CUSTOMER_DATA contribute 0); recency_factor = 1.0 when age_days <= 365 else 0.0 — stale evidence is discarded outright. Identical evidence therefore scores strictly lower under this variant, and the higher REQUIRED_SCORE compounds the divergence."

  - name: content_pipeline_attribution
    trigger: "on POST /editorial/content-items/{id}/performance-snapshots, recomputed from scratch over all snapshots of the item"
    algorithm: aggregation
    formula: |
      engaged_sessions_total = sum(s.engaged_sessions for s in snapshots)
      conversions_total      = sum(s.conversions for s in snapshots)
      last_touch_pipeline_cents = sum(s.influenced_opportunity_amount_cents
                                      for s in snapshots if s.touch_position == LAST)
      # ROUNDING ORDER IS PINNED: round EACH snapshot's weighted share to whole cents, THEN sum.
      assisted_pipeline_cents = sum(
        round_half_up(s.influenced_opportunity_amount_cents * TOUCH_WEIGHT[s.touch_position], 0)
        for s in snapshots
      )
      # Summing the unrounded shares and rounding the total once is the plausible-but-wrong order;
      # it differs from the pinned result by whole cents on adversarial inputs.
    input_set: "every PerformanceSnapshot of the ContentItem, regardless of the item's workflow_state; snapshots are immutable so the recompute is a pure fold"
    constants:
      TOUCH_WEIGHT: { FIRST: 0.40, MIDDLE: 0.20, LAST: 0.40 }
    precision: "whole cents; round_half_up applied per snapshot before summation"
    variants:
      - name: LAST_TOUCH
        when: "always maintained, surfaced as ContentItem.last_touch_pipeline_cents"
        difference: "credits 100% of the opportunity amount to snapshots whose touch_position == LAST and 0% to FIRST/MIDDLE snapshots"
      - name: ASSISTED_FRACTIONAL
        when: "always maintained, surfaced as ContentItem.assisted_pipeline_cents"
        difference: "credits every snapshot a TOUCH_WEIGHT fraction of its amount, rounded per snapshot; for the same snapshot set the two variants disagree both in total and in which snapshots contribute"

  - name: content_decay_pct
    trigger: "on POST /editorial/content-items/{id}/audit and on step 6 of POST /editorial/_ops/governance-sweep"
    algorithm: decay_function
    formula: |
      baseline_window = [item.published_at, item.published_at + DECAY_WINDOW_DAYS days)
      trailing_window = [clock - DECAY_WINDOW_DAYS days, clock)
      in_window(s, w) = s.period_start >= w.start and s.period_end <= w.end
      baseline_sessions = sum(s.engaged_sessions for s in snapshots if in_window(s, baseline_window))
      trailing_sessions = sum(s.engaged_sessions for s in snapshots if in_window(s, trailing_window))
      decay_pct = 0.00 when baseline_sessions == 0
                  else max(0.00, round_half_up((1 - trailing_sessions / baseline_sessions) * 100, 2))
      refresh_required = decay_pct >= REFRESH_THRESHOLD_PCT[brief.funnel_stage]
    input_set: "PerformanceSnapshot rows of the item that fall ENTIRELY inside the relevant window; a snapshot straddling a window edge is excluded from that window"
    constants:
      DECAY_WINDOW_DAYS: 28
      REFRESH_THRESHOLD_PCT: { AWARENESS: 55.00, CONSIDERATION: 50.00, DECISION: 45.00, RETENTION: 60.00 }
    precision: "2 decimal places, round_half_up; a growing item clamps to 0.00 rather than going negative"

  - name: campaign_governance_posture
    trigger: "recomputed at the end of every write that changes a ReviewGate decision, a Claim substantiation_state, an AssetUsage usage_state, or a ContentItem workflow_state within the campaign; also on steps 7 and 8 of POST /editorial/_ops/governance-sweep"
    algorithm: constraint_propagation
    formula: |
      breached_gate_count = count(g in ReviewGate
                                  if g.content_item_id in items(campaign)
                                  and g.sla_breached == true)
      expired_usage_count = count(u in AssetUsage
                                  if u.content_item_id in items(campaign)
                                  and u.usage_state == RIGHTS_LAPSED)
      unsubstantiated_published_claim_count =
        count(c in Claim
              if c.content_item_id in items(campaign)
              and ContentItem(c).workflow_state in {PUBLISHED, NEEDS_REFRESH}
              and c.substantiation_state in {DRAFT, EVIDENCE_PENDING, REJECTED, EXPIRED})
      posture = FROZEN     when unsubstantiated_published_claim_count >= FREEZE_CLAIM_COUNT
                             or expired_usage_count >= FREEZE_USAGE_COUNT
                = RESTRICTED when breached_gate_count >= RESTRICT_GATE_COUNT
                             or expired_usage_count >= RESTRICT_USAGE_COUNT
                = OPEN       otherwise
      # The three counters are stored on Campaign and reconciled on every recompute, so a
      # cascade that clears the last offending row must also walk the posture back down.
    input_set: "every ReviewGate, Claim and AssetUsage reachable from the Campaign through its ContentItem rows, excluding items in state PRUNED"
    constants:
      FREEZE_CLAIM_COUNT: 1
      FREEZE_USAGE_COUNT: 2
      RESTRICT_GATE_COUNT: 2
      RESTRICT_USAGE_COUNT: 1
    precision: "integer counters; FROZEN is evaluated before RESTRICTED so the stronger posture always wins"

  - name: asset_license_status
    trigger: "on POST /editorial/assets, on POST /editorial/assets/{id}/renew, on POST /editorial/content-items/{id}/asset-usages, on retract/refresh/prune release, and on step 1 of POST /editorial/_ops/governance-sweep"
    algorithm: threshold
    formula: |
      active_use_count = count(u in AssetUsage if u.asset_id == asset.id and u.usage_state == ACTIVE)
      remaining_licensed_uses = max(0, asset.max_licensed_uses - active_use_count)
      status = EXPIRED  when asset.license_end <= clock
             = EXPIRING when asset.license_end - clock <= ASSET_EXPIRY_WARNING_DAYS days
             = LICENSED otherwise
    input_set: "AssetUsage rows of the asset; RIGHTS_LAPSED and RELEASED usages do not consume a licensed use"
    constants:
      ASSET_EXPIRY_WARNING_DAYS: 30
    precision: "integer counts; the EXPIRED test uses <= so an asset whose license_end equals the clock is already expired"
    note: "The three status branches are evaluated on POST /editorial/assets, on POST /editorial/content-items/{id}/asset-usages, on retract/refresh/prune release, and on step 1 of the governance sweep. On POST /editorial/assets/{id}/renew only the two count fields are recomputed by this rule: the renewal transitions in §1.2 stamp status = LICENSED unconditionally, so an asset renewed to an end date inside the ASSET_EXPIRY_WARNING_DAYS window reads LICENSED until the next sweep re-derives EXPIRING. This is what makes a second renewal of a just-renewed asset an undeclared transition (ERR_ASSET_STATE_INVALID)."

validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and non-empty; the role string is one of the six declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "the acting role appears in the endpoint's roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "every resource named by a path segment exists, validated strictly left-to-right (campaign before its calendar-slots, content-item before its claims/asset-usages/snapshots)"
    error_id: "ERR_CAMPAIGN_NOT_FOUND | ERR_SLOT_NOT_FOUND | ERR_EXPERT_NOT_FOUND | ERR_BRIEF_NOT_FOUND | ERR_CONTENT_ITEM_NOT_FOUND | ERR_GATE_NOT_FOUND | ERR_CLAIM_NOT_FOUND | ERR_ASSET_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path parameters"

  - priority: 4
    category: business_constraint
    check: "request body shape: every required field present, enums within their declared value sets, integers non-negative, target_word_count between 100 and 9000, capacity_points between 1 and 200, weekly_capacity_hours between 1 and 60, max_licensed_uses between 1 and 50, promotion_window_days between 1 and 7, timestamps parseable ISO-8601 UTC instants, week_start_date is a Monday, license_end > license_start, valid_until > collected_at, review_window_end > review_window_start, review_window_start and review_window_end fall in the same ISO week, and the review window's duration is a whole number of hours no smaller than the brief's computed sme_reserved_hours"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all write endpoints"

  - priority: 5
    category: business_temporal
    check: "PerformanceSnapshot period_end > period_start, period_end <= clock (a snapshot may not report the future), and [period_start, period_end) does not overlap the interior of another snapshot on the same item"
    error_id: ERR_SNAPSHOT_PERIOD_INVALID
    http_status: 400
    applies_to: "POST /editorial/content-items/{id}/performance-snapshots"

  - priority: 6
    category: business_temporal
    check: "the requested logical clock value is greater than or equal to the current clock — the logical clock never rewinds"
    error_id: ERR_CLOCK_REWIND
    http_status: 422
    applies_to: "POST /editorial/_clock/set_current_utc"

  - priority: 7
    category: business_constraint
    check: "uniqueness: Campaign.code is globally unique; (campaign_id, week_start_date, funnel_stage) is unique across CalendarSlot; ContentItem.url_slug is unique across items not in state PRUNED"
    error_id: "ERR_CAMPAIGN_CODE_DUPLICATE | ERR_SLOT_DUPLICATE_WEEK | ERR_URL_SLUG_DUPLICATE"
    http_status: 409
    applies_to: "POST /editorial/campaigns, POST /editorial/campaigns/{id}/calendar-slots, POST /editorial/content-items/{id}/publish"

  - priority: 8
    category: business_constraint
    check: "one item per brief — no other ContentItem with the same brief_id may exist in a workflow_state other than PRUNED"
    error_id: ERR_BRIEF_ALREADY_HAS_ITEM
    http_status: 409
    applies_to: "POST /editorial/content-items"

  - priority: 9
    category: existence
    check: "every foreign key carried in the request BODY resolves to an existing row (campaign_id, brief_id, slot_id, sme_expert_id, asset_id)"
    error_id: "ERR_CAMPAIGN_NOT_FOUND | ERR_BRIEF_NOT_FOUND | ERR_SLOT_NOT_FOUND | ERR_EXPERT_NOT_FOUND | ERR_ASSET_NOT_FOUND"
    http_status: 404
    applies_to: "POST /editorial/content-items, POST /editorial/briefs/{id}/assign-sme, POST /editorial/content-items/{id}/asset-usages"

  - priority: 10
    category: auth
    check: "ownership — when the acting role is SubjectMatterExpertUser, X-User-ID must equal the sme_expert_id of the brief being approved / of the brief behind the SME gate being decided"
    error_id: ERR_SME_NOT_ASSIGNED_TO_BRIEF
    http_status: 403
    applies_to: "POST /editorial/briefs/{id}/approve, POST /editorial/briefs/{id}/request-changes, POST /editorial/review-gates/{id}/decide"

  - priority: 11
    category: auth
    check: "gate-role match — the acting role is the single role authorised for ReviewGate.gate_type (SME -> SubjectMatterExpertUser, LEGAL -> LegalReviewer, BRAND -> BrandReviewer, ACCESSIBILITY -> AccessibilityReviewer), except that ManagingEditor may act on a waivable gate with decision WAIVED"
    error_id: ERR_GATE_ROLE_MISMATCH
    http_status: 403
    applies_to: "POST /editorial/review-gates/{id}/decide"

  - priority: 12
    category: business_safety
    check: "segregation of duties on legal review — X-User-ID deciding a LEGAL gate must differ from the decided_by_user_id of every Claim on the same ContentItem"
    error_id: ERR_SOD_LEGAL_CONFLICT
    http_status: 409
    applies_to: "POST /editorial/review-gates/{id}/decide"

  - priority: 13
    category: business_safety
    check: "segregation of duties on publication — X-User-ID publishing an item must differ from ContentItem.created_by_user_id"
    error_id: ERR_SOD_PUBLISH_CONFLICT
    http_status: 409
    applies_to: "POST /editorial/content-items/{id}/publish"

  - priority: 14
    category: state
    check: "optimistic concurrency — expected_campaign_version equals Campaign.version; expected_expert_version equals SubjectMatterExpert.version"
    error_id: "ERR_STALE_CAMPAIGN_VERSION | ERR_STALE_EXPERT_VERSION"
    http_status: 412
    applies_to: "POST /editorial/content-items, POST /editorial/briefs/{id}/assign-sme"

  - priority: 15
    category: state
    check: "the target resource is in a state from which the requested transition is declared in §1.2 (campaign PLANNING/ACTIVE/CLOSED, slot OPEN/FULL, brief DRAFT/SME_ASSIGNED/APPROVED, item DRAFT/IN_REVIEW/CHANGES_REQUESTED/READY/PUBLISHED/NEEDS_REFRESH, gate PENDING, claim per its machine, asset per its machine)"
    error_id: "ERR_CAMPAIGN_STATE_INVALID | ERR_SLOT_STATE_INVALID | ERR_BRIEF_STATE_INVALID | ERR_ITEM_STATE_INVALID | ERR_GATE_ALREADY_DECIDED | ERR_CLAIM_STATE_INVALID | ERR_ASSET_STATE_INVALID"
    http_status: 409
    applies_to: "all transition endpoints"

  - priority: 16
    category: state
    check: "the CalendarSlot targeted by a content-item create is not LOCKED"
    error_id: ERR_SLOT_LOCKED
    http_status: 409
    applies_to: "POST /editorial/content-items"

  - priority: 17
    category: state
    check: "closing a campaign requires no ContentItem of that campaign in workflow_state DRAFT, IN_REVIEW, CHANGES_REQUESTED or READY"
    error_id: ERR_CAMPAIGN_HAS_OPEN_ITEMS
    http_status: 409
    applies_to: "POST /editorial/campaigns/{id}/close"

  - priority: 18
    category: state
    check: "refresh requires the item to be in workflow_state NEEDS_REFRESH, or PUBLISHED with refresh_required true"
    error_id: ERR_REFRESH_NOT_REQUIRED
    http_status: 409
    applies_to: "POST /editorial/content-items/{id}/refresh"

  - priority: 19
    category: state
    check: "prune requires ContentItem.last_audit_verdict == PRUNE — an item may only be pruned after an audit that recommended it"
    error_id: ERR_PRUNE_NOT_ELIGIBLE
    http_status: 409
    applies_to: "POST /editorial/content-items/{id}/prune"

  - priority: 20
    category: state
    check: "cross-entity state dependency — submit-for-review requires the item's ContentBrief.state == APPROVED"
    error_id: ERR_BRIEF_NOT_APPROVED
    http_status: 409
    applies_to: "POST /editorial/content-items/{id}/submit-for-review"

  - priority: 21
    category: business_referential
    check: "the CalendarSlot's campaign_id equals the ContentBrief's campaign_id, and the slot's funnel_stage equals the brief's funnel_stage"
    error_id: ERR_SLOT_CAMPAIGN_MISMATCH
    http_status: 422
    applies_to: "POST /editorial/content-items"

  - priority: 22
    category: business_safety
    check: "campaign governance posture gate — a FROZEN campaign refuses publish, refresh, gate waiver and new content-item creation"
    error_id: ERR_CAMPAIGN_POSTURE_FROZEN
    http_status: 409
    applies_to: "POST /editorial/content-items, POST /editorial/content-items/{id}/publish, POST /editorial/content-items/{id}/refresh, POST /editorial/review-gates/{id}/decide"

  - priority: 23
    category: business_safety
    check: "campaign governance posture gate — a RESTRICTED campaign still allows publish, but refuses gate waivers"
    error_id: ERR_CAMPAIGN_POSTURE_RESTRICTED
    http_status: 409
    applies_to: "POST /editorial/review-gates/{id}/decide"

  - priority: 24
    category: business_safety
    check: "claim substantiation — publish requires every Claim on the item to be in substantiation_state SUBSTANTIATED with evidence_valid_until > clock"
    error_id: ERR_CLAIM_NOT_SUBSTANTIATED
    http_status: 422
    applies_to: "POST /editorial/content-items/{id}/publish"

  - priority: 25
    category: business_safety
    check: "regulated-claim scope — a Claim with claim_type == REGULATED may only be attached to an item whose ContentBrief.requires_regulated_review is true"
    error_id: ERR_REGULATED_REVIEW_REQUIRED
    http_status: 422
    applies_to: "POST /editorial/content-items/{id}/claims"

  - priority: 26
    category: business_safety
    check: "waiver scope — only gate_type BRAND or ACCESSIBILITY may be WAIVED; SME and LEGAL gates must be decided by their reviewer"
    error_id: ERR_GATE_NOT_WAIVABLE
    http_status: 422
    applies_to: "POST /editorial/review-gates/{id}/decide"

  - priority: 27
    category: business_safety
    check: "accessibility metadata — publish requires a meta_description of at least 50 characters and at least MIN_PUBLISH_TAGS (2) tags"
    error_id: ERR_ACCESSIBILITY_METADATA_MISSING
    http_status: 422
    applies_to: "POST /editorial/content-items/{id}/publish"

  - priority: 28
    category: business_referential
    check: "expert availability — assign-sme requires SubjectMatterExpert.status == AVAILABLE"
    error_id: ERR_EXPERT_UNAVAILABLE
    http_status: 409
    applies_to: "POST /editorial/briefs/{id}/assign-sme"

  - priority: 29
    category: business_referential
    check: "expertise match — ContentBrief.required_expertise_tag is present in SubjectMatterExpert.expertise_tags"
    error_id: ERR_EXPERTISE_TAG_MISMATCH
    http_status: 422
    applies_to: "POST /editorial/briefs/{id}/assign-sme"

  - priority: 30
    category: business_temporal
    check: "expert review-window exclusivity — the brief's [review_window_start, review_window_end) must not overlap the window of any other brief already assigned to the same expert in state SME_ASSIGNED or APPROVED; touching endpoints (one window's end equals the other's start) are permitted"
    error_id: ERR_EXPERT_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /editorial/briefs/{id}/assign-sme"

  - priority: 31
    category: business_temporal
    check: "asset usage exclusivity for STOCK and ORIGINAL assets — this item's promotion window [planned_publish_at, planned_publish_at + promotion_window_days) must not overlap the promotion window of another item already holding an ACTIVE usage of the same asset on the same channel; touching endpoints are permitted"
    error_id: ERR_ASSET_USAGE_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /editorial/content-items/{id}/asset-usages"

  - priority: 32
    category: business_temporal
    check: "talent exclusivity buffer — for asset_type == TALENT the two promotion windows must additionally be separated by at least TALENT_EXCLUSIVITY_BUFFER_DAYS (7) whole days; a zero gap that a STOCK asset would accept is rejected here"
    error_id: ERR_TALENT_EXCLUSIVITY_BUFFER
    http_status: 409
    applies_to: "POST /editorial/content-items/{id}/asset-usages"

  - priority: 33
    category: business_temporal
    check: "usage rights validity — attaching an asset requires Asset.license_end > clock, and publish requires every ACTIVE usage's asset to still satisfy license_end > clock"
    error_id: ERR_ASSET_RIGHTS_EXPIRED
    http_status: 422
    applies_to: "POST /editorial/content-items/{id}/asset-usages, POST /editorial/content-items/{id}/publish"

  - priority: 34
    category: business_temporal
    check: "renewal must extend — new_license_end is strictly greater than both the clock and the asset's current license_end"
    error_id: ERR_ASSET_RENEWAL_NOT_EXTENDING
    http_status: 422
    applies_to: "POST /editorial/assets/{id}/renew"

  - priority: 35
    category: business_temporal
    check: "publish window — body.scheduled_at falls inside [slot.week_start_date 00:00:00Z, slot.week_start_date + 7 days)"
    error_id: ERR_PUBLISH_OUTSIDE_SLOT_WEEK
    http_status: 422
    applies_to: "POST /editorial/content-items/{id}/publish"

  - priority: 36
    category: business_temporal
    check: "evidence freshness at decision time — substantiating a claim requires at least one weight-contributing Evidence row with valid_until > clock"
    error_id: ERR_EVIDENCE_EXPIRED
    http_status: 422
    applies_to: "POST /editorial/claims/{id}/decide"

  - priority: 37
    category: business_constraint
    check: "channel licensing — the requested channel is present in Asset.licensed_channels"
    error_id: ERR_ASSET_CHANNEL_NOT_LICENSED
    http_status: 422
    applies_to: "POST /editorial/content-items/{id}/asset-usages"

  - priority: 38
    category: business_constraint
    check: "evidence sufficiency — Claim.evidence_score >= Claim.required_score under the claim's scoring_variant"
    error_id: ERR_EVIDENCE_INSUFFICIENT
    http_status: 422
    applies_to: "POST /editorial/claims/{id}/decide"

  - priority: 39
    category: business_fiscal
    check: "asset use budget — Asset.remaining_licensed_uses >= 1 before a new ACTIVE usage is recorded"
    error_id: ERR_ASSET_USES_EXHAUSTED
    http_status: 409
    applies_to: "POST /editorial/content-items/{id}/asset-usages"

  - priority: 40
    category: business_fiscal
    check: "expert weekly capacity — expert_week_committed_hours for the brief's ISO week plus this brief's sme_reserved_hours must not exceed SubjectMatterExpert.weekly_capacity_hours"
    error_id: ERR_EXPERT_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /editorial/briefs/{id}/assign-sme"

  - priority: 41
    category: business_fiscal
    check: "calendar-slot capacity — slot.committed_points + commit_points must not exceed slot.capacity_points, where commit_points already carries the tier surcharge from slot_capacity_commit"
    error_id: ERR_SLOT_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /editorial/content-items"

endpoints:
  # ---------- Campaign & calendar ----------
  - method: POST
    path: "/editorial/campaigns"
    description: "Create a campaign in status PLANNING with governance_posture OPEN and all three governance counters at 0."
    roles: [ManagingEditor]
    code: 201
    input: [code, persona, primary_funnel_stage, quarter_code]
    output: Campaign
    side_effects:
      - "Campaign created; code uniqueness enforced (ERR_CAMPAIGN_CODE_DUPLICATE)"

  - method: POST
    path: "/editorial/campaigns/{id}/activate"
    description: "Move a campaign PLANNING -> ACTIVE, opening it for brief and content-item work."
    roles: [ManagingEditor]
    code: 200
    input: []
    output: Campaign
    side_effects:
      - "Campaign.status = ACTIVE"
      - "increments Campaign.version by 1"

  - method: POST
    path: "/editorial/campaigns/{id}/close"
    description: "Move a campaign ACTIVE -> CLOSED and run the depth-3 close cascade over its calendar slots, briefs and expert ledgers."
    roles: [ManagingEditor]
    code: 200
    input: []
    output: Campaign
    side_effects:
      - "Campaign.status = CLOSED"
      - "every CalendarSlot of the campaign with status IN {OPEN, FULL} -> LOCKED"
      - "every ContentBrief of the campaign with state IN {DRAFT, SME_ASSIGNED, APPROVED} -> ARCHIVED"
      - "recomputes expert_week_committed_hours and SubjectMatterExpert.committed_hours_total for every expert who held one of those briefs"
      - "increments Campaign.version by 1"

  - method: POST
    path: "/editorial/campaigns/{id}/calendar-slots"
    description: "Create a weekly capacity slot on a campaign. week_start_date must be a Monday (YYYY-MM-DD) and (campaign, week, funnel_stage) must be unique."
    roles: [ManagingEditor]
    code: 201
    input: [week_start_date, funnel_stage, capacity_points]
    output: CalendarSlot
    side_effects:
      - "CalendarSlot created with committed_points 0, utilization_pct 0.00, status OPEN"

  - method: GET
    path: "/editorial/campaigns"
    description: "List campaigns, newest created_at first."
    roles: [ManagingEditor, LegalReviewer, BrandReviewer, AccessibilityReviewer]
    code: 200
    input: ["status?", "governance_posture?", "persona?", "quarter_code?", "limit?", "offset?"]
    output: Campaign[]
    side_effects: []

  - method: GET
    path: "/editorial/campaigns/{id}"
    description: "Read one campaign including its live governance counters and posture."
    roles: [ManagingEditor, LegalReviewer, BrandReviewer, AccessibilityReviewer, SubjectMatterExpertUser]
    code: 200
    input: []
    output: Campaign
    side_effects: []

  - method: GET
    path: "/editorial/campaigns/{id}/calendar-slots"
    description: "List the campaign's calendar slots, ascending week_start_date then funnel_stage."
    roles: [ManagingEditor, LegalReviewer, BrandReviewer, AccessibilityReviewer]
    code: 200
    input: ["funnel_stage?", "status?"]
    output: CalendarSlot[]
    side_effects: []

  - method: GET
    path: "/editorial/calendar-slots"
    description: "List calendar slots across campaigns, ascending week_start_date."
    roles: [ManagingEditor, LegalReviewer, BrandReviewer, AccessibilityReviewer]
    code: 200
    input: ["campaign_id?", "funnel_stage?", "status?", "limit?", "offset?"]
    output: CalendarSlot[]
    side_effects: []

  - method: GET
    path: "/editorial/calendar-slots/{id}"
    description: "Read one calendar slot with its committed_points, utilization_pct and status."
    roles: [ManagingEditor, LegalReviewer, BrandReviewer, AccessibilityReviewer]
    code: 200
    input: []
    output: CalendarSlot
    side_effects: []

  - method: POST
    path: "/editorial/calendar-slots/{id}/lock"
    description: "Lock a calendar week so no further content items may be committed to it, without closing the campaign. Locking is terminal for the slot."
    roles: [ManagingEditor]
    code: 200
    input: []
    output: CalendarSlot
    side_effects:
      - "CalendarSlot OPEN or FULL -> LOCKED; committed_points and utilization_pct are unchanged"
      - "increments CalendarSlot.version by 1"

  # ---------- Subject matter experts ----------
  - method: POST
    path: "/editorial/experts"
    description: "Register a subject matter expert with an expertise tag list and a weekly capacity in hours."
    roles: [ManagingEditor]
    code: 201
    input: [full_name, expertise_tags, weekly_capacity_hours]
    output: SubjectMatterExpert
    side_effects:
      - "SubjectMatterExpert created with status AVAILABLE and committed_hours_total 0"

  - method: POST
    path: "/editorial/experts/{id}/availability"
    description: "Set an expert AVAILABLE or ON_LEAVE. Setting ON_LEAVE runs the depth-5 release cascade over briefs, items, gates and campaign posture."
    roles: [ManagingEditor]
    code: 200
    input: [status]
    output: SubjectMatterExpert
    side_effects:
      - "SubjectMatterExpert.status set"
      - "on ON_LEAVE: every ContentBrief of the expert in state SME_ASSIGNED or APPROVED -> DRAFT with sme_expert_id cleared"
      - "on ON_LEAVE: SubjectMatterExpert.committed_hours_total recomputed to 0"
      - "on ON_LEAVE: every ContentItem in state IN_REVIEW or READY behind one of those briefs -> CHANGES_REQUESTED"
      - "on ON_LEAVE: every PENDING ReviewGate of those items -> VOIDED"
      - "on ON_LEAVE: Campaign.governance_posture recomputed for every affected campaign"
      - "increments SubjectMatterExpert.version by 1"

  - method: GET
    path: "/editorial/experts"
    description: "List experts, ascending full_name."
    roles: [ManagingEditor, LegalReviewer]
    code: 200
    input: ["status?", "expertise_tag?", "limit?", "offset?"]
    output: SubjectMatterExpert[]
    side_effects: []

  - method: GET
    path: "/editorial/experts/{id}"
    description: "Read one expert including committed_hours_total and the version needed for the assign-sme OCC check."
    roles: [ManagingEditor, LegalReviewer, SubjectMatterExpertUser]
    code: 200
    input: []
    output: SubjectMatterExpert
    side_effects: []

  # ---------- Content briefs ----------
  - method: POST
    path: "/editorial/briefs"
    description: "Create a content brief on an ACTIVE campaign. effort_points and sme_reserved_hours are computed at creation and any client-supplied value is ignored."
    roles: [ManagingEditor]
    code: 201
    input: ["campaign_id", "funnel_stage", "search_intent", "primary_keyword", "target_word_count", "required_expertise_tag", "review_window_start", "review_window_end", "secondary_keywords?", "requires_regulated_review?"]
    output: ContentBrief
    side_effects:
      - "ContentBrief created in state DRAFT with sme_expert_id null"
      - "runs brief_effort_points then sme_reserved_hours"

  - method: POST
    path: "/editorial/briefs/{id}/assign-sme"
    description: "Assign a subject matter expert to a DRAFT brief. Optimistically concurrent on the expert's version."
    roles: [ManagingEditor]
    code: 200
    input: [sme_expert_id, expected_expert_version]
    output: ContentBrief
    side_effects:
      - "ContentBrief.sme_expert_id set, state DRAFT -> SME_ASSIGNED"
      - "runs expert_week_committed_hours for the brief's ISO week and enforces the weekly capacity ceiling"
      - "updates SubjectMatterExpert.committed_hours_total"
      - "increments SubjectMatterExpert.version by 1"
      - "increments ContentBrief.version by 1"

  - method: POST
    path: "/editorial/briefs/{id}/approve"
    description: "The assigned expert approves the brief, moving it SME_ASSIGNED -> APPROVED so content items behind it may enter review."
    roles: [SubjectMatterExpertUser]
    code: 200
    input: []
    output: ContentBrief
    side_effects:
      - "ContentBrief.state = APPROVED"
      - "increments ContentBrief.version by 1"

  - method: POST
    path: "/editorial/briefs/{id}/request-changes"
    description: "The assigned expert sends an APPROVED brief back to DRAFT, clearing the assignment and cascading to the items and gates behind it."
    roles: [SubjectMatterExpertUser]
    code: 200
    input: ["notes?"]
    output: ContentBrief
    side_effects:
      - "ContentBrief.state = DRAFT, sme_expert_id cleared"
      - "recomputes expert_week_committed_hours and SubjectMatterExpert.committed_hours_total"
      - "every ContentItem behind the brief in state IN_REVIEW or READY -> CHANGES_REQUESTED"
      - "every PENDING ReviewGate of those items -> VOIDED"
      - "increments ContentBrief.version by 1"

  - method: GET
    path: "/editorial/briefs"
    description: "List content briefs, ascending created_at."
    roles: [ManagingEditor, LegalReviewer, BrandReviewer, AccessibilityReviewer, SubjectMatterExpertUser]
    code: 200
    input: ["campaign_id?", "sme_expert_id?", "state?", "funnel_stage?", "limit?", "offset?"]
    output: ContentBrief[]
    side_effects: []

  - method: GET
    path: "/editorial/briefs/{id}"
    description: "Read one brief including computed effort_points and sme_reserved_hours."
    roles: [ManagingEditor, LegalReviewer, BrandReviewer, AccessibilityReviewer, SubjectMatterExpertUser]
    code: 200
    input: []
    output: ContentBrief
    side_effects: []

  # ---------- Content items ----------
  - method: POST
    path: "/editorial/content-items"
    description: "Create a content item against an APPROVED-or-earlier brief and an OPEN calendar slot, committing the brief's effort points plus the slot's tier surcharge. Optimistically concurrent on the campaign's version."
    roles: [ManagingEditor]
    code: 201
    input: ["brief_id", "slot_id", "title", "planned_publish_at", "expected_campaign_version", "promotion_window_days?", "meta_description?", "url_slug?", "tags?"]
    output: ContentItem
    side_effects:
      - "ContentItem created in workflow_state DRAFT, revision_number 1, created_by_user_id = X-User-ID, campaign_id copied from the brief"
      - "runs slot_capacity_commit: sets effort_points, commit_points and capacity_tier_at_commit, then advances CalendarSlot.committed_points, utilization_pct and status"
      - "advances Campaign.committed_points_total by commit_points"
      - "increments Campaign.version by 1"

  - method: POST
    path: "/editorial/content-items/{id}/submit-for-review"
    description: "Open (or reopen) the review fork: SME, BRAND and ACCESSIBILITY gates always, plus a LEGAL gate when the item carries at least one claim."
    roles: [ManagingEditor]
    code: 200
    input: []
    output: ContentItem
    side_effects:
      - "ContentItem DRAFT -> IN_REVIEW, or CHANGES_REQUESTED -> IN_REVIEW with revision_number incremented by 1"
      - "creates the gate set on a first submit; on a resubmit reopens every CHANGES_REQUESTED or VOIDED gate to PENDING and leaves APPROVED/WAIVED gates untouched"
      - "runs review_gate_sla_due_at per opened gate, setting opened_at, sla_hours and due_at"
      - "increments ContentItem.version by 1"

  - method: POST
    path: "/editorial/content-items/{id}/claims"
    description: "Attach a marketing claim to an item. scoring_variant and required_score are derived from claim_type; REGULATED claims require a brief flagged for regulated review."
    roles: [ManagingEditor]
    code: 201
    input: [claim_text, claim_type]
    output: Claim
    side_effects:
      - "Claim created in substantiation_state DRAFT with scoring_variant STRICT_REGULATED for claim_type REGULATED and STANDARD otherwise, evidence_score 0.00"
      - "recomputes Campaign.governance_posture when the item is already PUBLISHED or NEEDS_REFRESH"

  - method: POST
    path: "/editorial/content-items/{id}/publish"
    description: "Publish a READY item: writes metadata, fans out distributions across the requested channels and stamps the publisher."
    roles: [ManagingEditor]
    code: 200
    input: [scheduled_at, channels, meta_description, url_slug, tags]
    output: ContentItem
    side_effects:
      - "ContentItem READY -> PUBLISHED, published_at = clock, published_by_user_id = X-User-ID, metadata and tags stored"
      - "creates one Distribution per requested channel, LIVE when scheduled_at <= clock else SCHEDULED"
      - "recomputes Campaign.governance_posture"
      - "increments ContentItem.version by 1"

  - method: POST
    path: "/editorial/content-items/{id}/retract"
    description: "Retract a published item, retracting its distributions and releasing its asset usages while keeping the calendar commitment intact."
    roles: [ManagingEditor]
    code: 200
    input: ["reason?"]
    output: ContentItem
    side_effects:
      - "ContentItem PUBLISHED or NEEDS_REFRESH -> RETRACTED, retracted_at = clock"
      - "every Distribution of the item in state SCHEDULED, LIVE or SUPPRESSED -> RETRACTED"
      - "every AssetUsage of the item in usage_state ACTIVE or RIGHTS_LAPSED -> RELEASED with released_at = clock; each affected Asset's active_use_count and remaining_licensed_uses are recomputed"
      - "recomputes Campaign.governance_posture"
      - "increments ContentItem.version by 1"

  - method: POST
    path: "/editorial/content-items/{id}/audit"
    description: "Run a decay or accuracy audit, recording last_audit_type, last_audit_verdict and last_audit_at."
    roles: [ManagingEditor]
    code: 200
    input: ["audit_type", "accuracy_finding?"]
    output: ContentItem
    side_effects:
      - "for audit_type DECAY: runs content_decay_pct, storing decay_pct and refresh_required; last_audit_verdict = PRUNE when decay_pct >= 85.00, else REFRESH when refresh_required, else KEEP"
      - "for audit_type ACCURACY: accuracy_status = accuracy_finding; last_audit_verdict = REFRESH when the finding is INACCURATE, else KEEP"
      - "a PUBLISHED item whose verdict is REFRESH or PRUNE -> NEEDS_REFRESH"
      - "increments ContentItem.version by 1"

  - method: POST
    path: "/editorial/content-items/{id}/refresh"
    description: "Send a published or decayed item back to DRAFT for a new revision, voiding every gate and retracting every distribution."
    roles: [ManagingEditor]
    code: 200
    input: []
    output: ContentItem
    side_effects:
      - "ContentItem PUBLISHED or NEEDS_REFRESH -> DRAFT, refresh_required reset to false, published_at and published_by_user_id cleared"
      - "every ReviewGate of the item in state PENDING, APPROVED, WAIVED or CHANGES_REQUESTED -> VOIDED"
      - "every Distribution of the item in state SCHEDULED, LIVE or SUPPRESSED -> RETRACTED"
      - "the item keeps its CalendarSlot commitment (commit_points are not returned)"
      - "recomputes Campaign.governance_posture"
      - "increments ContentItem.version by 1"

  - method: POST
    path: "/editorial/content-items/{id}/prune"
    description: "Prune an item out of the library, compensating every commitment it holds: calendar points, asset uses and distributions."
    roles: [ManagingEditor]
    code: 200
    input: []
    output: ContentItem
    side_effects:
      - "ContentItem PUBLISHED, NEEDS_REFRESH or RETRACTED -> PRUNED"
      - "CalendarSlot.committed_points reduced by the item's commit_points; utilization_pct recomputed; status FULL -> OPEN when the slot is no longer at capacity (a LOCKED slot stays LOCKED)"
      - "Campaign.committed_points_total reduced by the item's commit_points"
      - "every AssetUsage of the item in usage_state ACTIVE or RIGHTS_LAPSED -> RELEASED; each affected Asset's active_use_count and remaining_licensed_uses recomputed"
      - "every Distribution of the item not already RETRACTED -> RETRACTED"
      - "recomputes Campaign.governance_posture (a pruned item's claims and usages stop counting)"
      - "increments ContentItem.version by 1"

  - method: POST
    path: "/editorial/content-items/{id}/asset-usages"
    description: "Attach a licensed asset to an item on a specific channel, enforcing channel licensing, the remaining-use budget, promotion-window exclusivity and the talent buffer."
    roles: [ManagingEditor]
    code: 201
    input: [asset_id, channel]
    output: AssetUsage
    side_effects:
      - "AssetUsage created in usage_state ACTIVE with attached_at = clock"
      - "runs asset_license_status: Asset.active_use_count incremented, remaining_licensed_uses recomputed"

  - method: POST
    path: "/editorial/content-items/{id}/performance-snapshots"
    description: "Record an immutable measurement period for an item and recompute both attribution variants."
    roles: [AnalyticsService]
    code: 201
    input: [period_start, period_end, engaged_sessions, conversions, influenced_opportunity_amount_cents, touch_position]
    output: PerformanceSnapshot
    side_effects:
      - "PerformanceSnapshot created (immutable, no version field)"
      - "runs content_pipeline_attribution: ContentItem.engaged_sessions_total, conversions_total, last_touch_pipeline_cents and assisted_pipeline_cents recomputed"
      - "increments ContentItem.version by 1"

  - method: GET
    path: "/editorial/content-items"
    description: "List content items, ascending created_at."
    roles: [ManagingEditor, LegalReviewer, BrandReviewer, AccessibilityReviewer, SubjectMatterExpertUser, AnalyticsService]
    code: 200
    input: ["campaign_id?", "brief_id?", "slot_id?", "workflow_state?", "limit?", "offset?"]
    output: ContentItem[]
    side_effects: []

  - method: GET
    path: "/editorial/content-items/{id}"
    description: "Read one content item with its commitment, workflow, metadata, measurement and decay fields."
    roles: [ManagingEditor, LegalReviewer, BrandReviewer, AccessibilityReviewer, SubjectMatterExpertUser, AnalyticsService]
    code: 200
    input: []
    output: ContentItem
    side_effects: []

  - method: GET
    path: "/editorial/content-items/{id}/review-gates"
    description: "List the item's review gates in the fixed order SME, LEGAL, BRAND, ACCESSIBILITY."
    roles: [ManagingEditor, LegalReviewer, BrandReviewer, AccessibilityReviewer, SubjectMatterExpertUser]
    code: 200
    input: ["gate_type?", "state?"]
    output: ReviewGate[]
    side_effects: []

  - method: GET
    path: "/editorial/content-items/{id}/claims"
    description: "List the item's claims, ascending created_at."
    roles: [ManagingEditor, LegalReviewer, BrandReviewer, AccessibilityReviewer, SubjectMatterExpertUser]
    code: 200
    input: ["claim_type?", "substantiation_state?"]
    output: Claim[]
    side_effects: []

  - method: GET
    path: "/editorial/content-items/{id}/distributions"
    description: "List the item's distributions in the fixed channel order OWNED, EMAIL, SOCIAL."
    roles: [ManagingEditor, LegalReviewer, BrandReviewer, AccessibilityReviewer]
    code: 200
    input: ["channel?", "state?"]
    output: Distribution[]
    side_effects: []

  - method: GET
    path: "/editorial/content-items/{id}/asset-usages"
    description: "List the item's asset usages, ascending attached_at."
    roles: [ManagingEditor, LegalReviewer, BrandReviewer, AccessibilityReviewer]
    code: 200
    input: ["usage_state?", "channel?"]
    output: AssetUsage[]
    side_effects: []

  - method: GET
    path: "/editorial/content-items/{id}/performance-snapshots"
    description: "List the item's measurement periods, ascending period_start."
    roles: [ManagingEditor, AnalyticsService, LegalReviewer]
    code: 200
    input: ["touch_position?"]
    output: PerformanceSnapshot[]
    side_effects: []

  # ---------- Review gates ----------
  - method: POST
    path: "/editorial/review-gates/{id}/decide"
    description: "Decide a pending review gate. decision is APPROVED, CHANGES_REQUESTED or WAIVED; only the gate's own reviewer role may approve or request changes, and only a ManagingEditor may waive a BRAND or ACCESSIBILITY gate on an OPEN campaign."
    roles: [SubjectMatterExpertUser, LegalReviewer, BrandReviewer, AccessibilityReviewer, ManagingEditor]
    code: 200
    input: ["decision", "decision_notes?"]
    output: ReviewGate
    side_effects:
      - "ReviewGate.state, decided_at, decided_by_user_id and decision_notes set"
      - "turnaround_hours = round_half_up((decided_at - opened_at) / 3600, 2); sla_breached = decided_at > due_at"
      - "on the join: when every gate of the item is APPROVED or WAIVED, ContentItem IN_REVIEW -> READY"
      - "on CHANGES_REQUESTED: ContentItem IN_REVIEW -> CHANGES_REQUESTED"
      - "recomputes Campaign.governance_posture"
      - "increments ReviewGate.version by 1"

  - method: GET
    path: "/editorial/review-gates/{id}"
    description: "Read one review gate with its SLA fields and decision record."
    roles: [ManagingEditor, LegalReviewer, BrandReviewer, AccessibilityReviewer, SubjectMatterExpertUser]
    code: 200
    input: []
    output: ReviewGate
    side_effects: []

  # ---------- Claims & evidence ----------
  - method: POST
    path: "/editorial/claims/{id}/evidence"
    description: "File a piece of substantiation evidence against a claim and re-score it under the claim's scoring variant."
    roles: [ManagingEditor, SubjectMatterExpertUser]
    code: 201
    input: [source_type, citation, collected_at, valid_until]
    output: Evidence
    side_effects:
      - "Evidence created with weight = EVIDENCE_SOURCE_WEIGHT[source_type] (immutable, no version field)"
      - "Claim moves to EVIDENCE_PENDING and evidence_score is recomputed by claim_evidence_score"
      - "increments Claim.version by 1"

  - method: POST
    path: "/editorial/claims/{id}/decide"
    description: "Legal decides a claim: decision is SUBSTANTIATED or REJECTED. Substantiation requires evidence_score >= required_score and at least one contributing evidence row still valid at the clock."
    roles: [LegalReviewer]
    code: 200
    input: [decision]
    output: Claim
    side_effects:
      - "Claim.substantiation_state, decided_by_user_id and decided_at set"
      - "on SUBSTANTIATED: evidence_valid_until = earliest valid_until among weight-contributing evidence rows"
      - "recomputes Campaign.governance_posture"
      - "increments Claim.version by 1"

  - method: GET
    path: "/editorial/claims/{id}"
    description: "Read one claim including scoring_variant, required_score, evidence_score and evidence_valid_until."
    roles: [ManagingEditor, LegalReviewer, SubjectMatterExpertUser, BrandReviewer, AccessibilityReviewer]
    code: 200
    input: []
    output: Claim
    side_effects: []

  - method: GET
    path: "/editorial/claims/{id}/evidence"
    description: "List the claim's evidence rows, ascending collected_at."
    roles: [ManagingEditor, LegalReviewer, SubjectMatterExpertUser]
    code: 200
    input: ["source_type?"]
    output: Evidence[]
    side_effects: []

  # ---------- Asset library ----------
  - method: POST
    path: "/editorial/assets"
    description: "Register a licensed asset with a licence window, licensed channel list and a maximum number of concurrent uses."
    roles: [ManagingEditor]
    code: 201
    input: [name, asset_type, license_start, license_end, licensed_channels, max_licensed_uses]
    output: Asset
    side_effects:
      - "Asset created; runs asset_license_status to set status, active_use_count 0 and remaining_licensed_uses = max_licensed_uses"

  - method: POST
    path: "/editorial/assets/{id}/renew"
    description: "Extend an asset's licence, restoring the usages and distributions its expiry had knocked down."
    roles: [ManagingEditor]
    code: 200
    input: [new_license_end]
    output: Asset
    side_effects:
      - "Asset.license_end extended, status recomputed to LICENSED"
      - "every AssetUsage of the asset in usage_state RIGHTS_LAPSED -> ACTIVE; active_use_count and remaining_licensed_uses recomputed"
      - "every Distribution suppressed with suppression_reason ASSET_RIGHTS_LAPSED on the affected items and channels -> LIVE or SCHEDULED with the reason cleared"
      - "recomputes Campaign.expired_usage_count and governance_posture; items already in NEEDS_REFRESH stay there"
      - "increments Asset.version by 1"

  - method: GET
    path: "/editorial/assets"
    description: "List assets, ascending license_end."
    roles: [ManagingEditor, LegalReviewer, BrandReviewer]
    code: 200
    input: ["asset_type?", "status?", "limit?", "offset?"]
    output: Asset[]
    side_effects: []

  - method: GET
    path: "/editorial/assets/{id}"
    description: "Read one asset with its licence window, use budget and status."
    roles: [ManagingEditor, LegalReviewer, BrandReviewer]
    code: 200
    input: []
    output: Asset
    side_effects: []

  - method: GET
    path: "/editorial/assets/{id}/usages"
    description: "List every usage of the asset across content items, ascending attached_at."
    roles: [ManagingEditor, LegalReviewer, BrandReviewer]
    code: 200
    input: ["usage_state?"]
    output: AssetUsage[]
    side_effects: []

  # ---------- Test-driving endpoints ----------
  - method: POST
    path: "/editorial/_clock/set_current_utc"
    description: "Set the server's logical clock to an explicit UTC instant. Before any call to this endpoint the logical clock reads exactly the startup default 2026-08-01T00:00:00.000Z and MUST NOT fall back to real wall-clock time. The clock never rewinds (ERR_CLOCK_REWIND)."
    roles: [ManagingEditor]
    code: 200
    input: [current_utc]
    output: "{ current_utc: string }"
    side_effects:
      - "the logical clock used by every SLA, licence, decay and expiry rule advances to current_utc; no entity rows change"

  - method: POST
    path: "/editorial/_ops/governance-sweep"
    description: "Run the ordered nightly governance sweep. Steps execute in the fixed order 1-8 and each step observes the results of the previous ones; within a step rows are processed ascending created_at."
    roles: [ManagingEditor]
    code: 200
    input: []
    output: "{ assets_expired: integer, usages_lapsed: integer, distributions_suppressed: integer, distributions_activated: integer, items_flagged_refresh: integer, claims_expired: integer, gates_breached: integer, campaigns_restricted: integer, campaigns_frozen: integer }"
    side_effects:
      - "step 1 — asset licences: LICENSED -> EXPIRING inside the 30-day warning window; LICENSED or EXPIRING -> EXPIRED when license_end <= clock; each newly EXPIRED asset flips its ACTIVE usages to RIGHTS_LAPSED"
      - "step 2 — rights suppression: every Distribution on the same item and channel as a usage lapsed in step 1, in state SCHEDULED or LIVE, -> SUPPRESSED with suppression_reason ASSET_RIGHTS_LAPSED"
      - "step 3 — item flagging from rights loss: a PUBLISHED item whose every Distribution is now SUPPRESSED or RETRACTED -> NEEDS_REFRESH; these items are counted in items_flagged_refresh"
      - "step 4 — claim expiry: SUBSTANTIATED claims with evidence_valid_until <= clock -> EXPIRED, and the distributions of their PUBLISHED or NEEDS_REFRESH items -> SUPPRESSED with suppression_reason CLAIM_SUBSTANTIATION_EXPIRED; distributions_suppressed is the total over steps 2 and 4, each row counted once"
      - "step 5 — scheduled activation: Distribution rows still SCHEDULED with scheduled_at <= clock -> LIVE with went_live_at = clock"
      - "step 6 — decay: content_decay_pct recomputed for every PUBLISHED item; those with refresh_required true -> NEEDS_REFRESH; items_flagged_refresh is the total over steps 3 and 6, each item counted once"
      - "step 7 — SLA breach: ReviewGate rows still PENDING with due_at <= clock and sla_breached false get sla_breached = true; gates_breached counts only these newly flagged rows, so re-running the sweep without the clock moving reports 0"
      - "step 8 — posture: campaign_governance_posture recomputed for every campaign touched by steps 1-7, FROZEN evaluated before RESTRICTED; campaigns_restricted and campaigns_frozen count only campaigns whose posture CHANGED to RESTRICTED or to FROZEN in this sweep, so a replay at an unmoved clock reports 0 for both"

errors:
  # --- authentication / authorization ---
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header absent, empty, or naming a role outside the six declared roles"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the acting role is not listed on the requested endpoint"
  - id: ERR_SME_NOT_ASSIGNED_TO_BRIEF
    http: 403
    condition: "a SubjectMatterExpertUser acts on a brief (or an SME gate) whose sme_expert_id is not their X-User-ID"
  - id: ERR_GATE_ROLE_MISMATCH
    http: 403
    condition: "the acting role is not the reviewer role authorised for this ReviewGate.gate_type, and the request is not a ManagingEditor waiver"

  # --- existence ---
  - id: ERR_CAMPAIGN_NOT_FOUND
    http: 404
    condition: "no Campaign with the given id"
  - id: ERR_SLOT_NOT_FOUND
    http: 404
    condition: "no CalendarSlot with the given id, in the path or in slot_id"
  - id: ERR_EXPERT_NOT_FOUND
    http: 404
    condition: "no SubjectMatterExpert with the given id, in the path or in sme_expert_id"
  - id: ERR_BRIEF_NOT_FOUND
    http: 404
    condition: "no ContentBrief with the given id, in the path or in brief_id"
  - id: ERR_CONTENT_ITEM_NOT_FOUND
    http: 404
    condition: "no ContentItem with the given id"
  - id: ERR_GATE_NOT_FOUND
    http: 404
    condition: "no ReviewGate with the given id"
  - id: ERR_CLAIM_NOT_FOUND
    http: 404
    condition: "no Claim with the given id"
  - id: ERR_ASSET_NOT_FOUND
    http: 404
    condition: "no Asset with the given id, in the path or in asset_id"

  # --- request shape ---
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing required body field, unknown enum value, negative or out-of-range number, unparseable timestamp, week_start_date that is not a Monday, review_window_end <= review_window_start, license_end <= license_start, or valid_until <= collected_at"
  - id: ERR_SNAPSHOT_PERIOD_INVALID
    http: 400
    condition: "PerformanceSnapshot period_end <= period_start, period_end later than the logical clock, or a period whose interior overlaps an existing snapshot on the same item"
  - id: ERR_CLOCK_REWIND
    http: 422
    condition: "POST /editorial/_clock/set_current_utc with a current_utc earlier than the clock's present value"

  # --- uniqueness ---
  - id: ERR_CAMPAIGN_CODE_DUPLICATE
    http: 409
    condition: "a Campaign with the same code already exists"
  - id: ERR_SLOT_DUPLICATE_WEEK
    http: 409
    condition: "a CalendarSlot already exists for this (campaign_id, week_start_date, funnel_stage)"
  - id: ERR_URL_SLUG_DUPLICATE
    http: 409
    condition: "publish supplies a url_slug already held by another ContentItem not in state PRUNED"

  # --- segregation of duties ---
  - id: ERR_SOD_LEGAL_CONFLICT
    http: 409
    condition: "the user deciding a LEGAL gate is the same user who decided a Claim on that content item"
  - id: ERR_SOD_PUBLISH_CONFLICT
    http: 409
    condition: "the user publishing an item is the item's created_by_user_id"

  # --- optimistic concurrency ---
  - id: ERR_STALE_CAMPAIGN_VERSION
    http: 412
    condition: "expected_campaign_version on POST /editorial/content-items does not equal the campaign's current version"
  - id: ERR_STALE_EXPERT_VERSION
    http: 412
    condition: "expected_expert_version on POST /editorial/briefs/{id}/assign-sme does not equal the expert's current version"

  # --- state ---
  - id: ERR_CAMPAIGN_STATE_INVALID
    http: 409
    condition: "the campaign is not in a state from which the requested transition (or dependent write) is declared — e.g. activating a CLOSED campaign, or creating a brief on a PLANNING or CLOSED campaign"
  - id: ERR_BRIEF_STATE_INVALID
    http: 409
    condition: "the brief is not in the state the operation requires — e.g. assigning an SME to a brief that is not DRAFT, approving a brief that is not SME_ASSIGNED, or requesting changes on a brief that is not APPROVED"
  - id: ERR_ITEM_STATE_INVALID
    http: 409
    condition: "the content item is not in a state from which the requested transition is declared — e.g. publishing an item that is not READY, submitting an item that is not DRAFT or CHANGES_REQUESTED, pruning a DRAFT item"
  - id: ERR_GATE_ALREADY_DECIDED
    http: 409
    condition: "the review gate is not PENDING — it has already been APPROVED, CHANGES_REQUESTED, WAIVED or VOIDED"
  - id: ERR_CLAIM_STATE_INVALID
    http: 409
    condition: "deciding a claim that is not EVIDENCE_PENDING, or filing evidence against a claim already SUBSTANTIATED"
  - id: ERR_ASSET_STATE_INVALID
    http: 409
    condition: "renewing an asset whose status is already LICENSED — renewal is only declared from EXPIRING or EXPIRED"
  - id: ERR_SLOT_STATE_INVALID
    http: 409
    condition: "POST /editorial/calendar-slots/{id}/lock on a CalendarSlot whose status is already LOCKED — locking is declared only from OPEN or FULL"
  - id: ERR_SLOT_LOCKED
    http: 409
    condition: "the CalendarSlot targeted by a content-item create has status LOCKED"
  - id: ERR_BRIEF_NOT_APPROVED
    http: 409
    condition: "submit-for-review on an item whose ContentBrief.state is not APPROVED"
  - id: ERR_BRIEF_ALREADY_HAS_ITEM
    http: 409
    condition: "a ContentItem already exists for this brief_id in a workflow_state other than PRUNED"
  - id: ERR_CAMPAIGN_HAS_OPEN_ITEMS
    http: 409
    condition: "close attempted while the campaign still holds an item in DRAFT, IN_REVIEW, CHANGES_REQUESTED or READY"
  - id: ERR_REFRESH_NOT_REQUIRED
    http: 409
    condition: "refresh attempted on a PUBLISHED item whose refresh_required is false and whose workflow_state is not NEEDS_REFRESH"
  - id: ERR_PRUNE_NOT_ELIGIBLE
    http: 409
    condition: "prune attempted on an item whose last_audit_verdict is not PRUNE"

  # --- referential / cross-entity consistency ---
  - id: ERR_SLOT_CAMPAIGN_MISMATCH
    http: 422
    condition: "the CalendarSlot belongs to a different campaign than the brief, or its funnel_stage differs from the brief's"
  - id: ERR_EXPERTISE_TAG_MISMATCH
    http: 422
    condition: "the brief's required_expertise_tag is absent from the expert's expertise_tags"
  - id: ERR_EXPERT_UNAVAILABLE
    http: 409
    condition: "assign-sme targets a SubjectMatterExpert whose status is ON_LEAVE"

  # --- governance posture ---
  - id: ERR_CAMPAIGN_POSTURE_FROZEN
    http: 409
    condition: "the campaign's governance_posture is FROZEN and the request is a content-item create, publish, refresh or gate waiver"
  - id: ERR_CAMPAIGN_POSTURE_RESTRICTED
    http: 409
    condition: "the campaign's governance_posture is RESTRICTED and the request is a gate waiver"

  # --- compliance / safety ---
  - id: ERR_CLAIM_NOT_SUBSTANTIATED
    http: 422
    condition: "publish attempted while the item carries a claim that is not SUBSTANTIATED, or whose evidence_valid_until is at or before the clock"
  - id: ERR_REGULATED_REVIEW_REQUIRED
    http: 422
    condition: "a REGULATED claim is attached to an item whose brief has requires_regulated_review false"
  - id: ERR_GATE_NOT_WAIVABLE
    http: 422
    condition: "a waiver is attempted on a gate whose gate_type is SME or LEGAL"
  - id: ERR_ACCESSIBILITY_METADATA_MISSING
    http: 422
    condition: "publish supplies a meta_description shorter than 50 characters or fewer than 2 tags"

  # --- temporal / rights ---
  - id: ERR_EXPERT_WINDOW_OVERLAP
    http: 409
    condition: "the brief's review window overlaps in its interior with another SME_ASSIGNED or APPROVED brief of the same expert; touching endpoints do not conflict"
  - id: ERR_ASSET_USAGE_WINDOW_OVERLAP
    http: 409
    condition: "a STOCK or ORIGINAL asset is attached on a channel whose promotion window overlaps another item's ACTIVE usage window for the same asset; touching endpoints do not conflict"
  - id: ERR_TALENT_EXCLUSIVITY_BUFFER
    http: 409
    condition: "a TALENT asset is attached with fewer than 7 whole days of separation between the two items' promotion windows, including the zero-gap touching case a STOCK asset would accept"
  - id: ERR_ASSET_RIGHTS_EXPIRED
    http: 422
    condition: "an asset whose license_end is at or before the clock is attached to an item, or an item is published while holding such a usage"
  - id: ERR_ASSET_RENEWAL_NOT_EXTENDING
    http: 422
    condition: "new_license_end is not strictly after both the clock and the asset's current license_end"
  - id: ERR_PUBLISH_OUTSIDE_SLOT_WEEK
    http: 422
    condition: "scheduled_at falls outside the calendar slot's [week_start_date, week_start_date + 7 days) window"
  - id: ERR_EVIDENCE_EXPIRED
    http: 422
    condition: "substantiation is attempted with no weight-contributing evidence row whose valid_until is after the clock"

  # --- constraints and budgets ---
  - id: ERR_ASSET_CHANNEL_NOT_LICENSED
    http: 422
    condition: "the requested channel is not in the asset's licensed_channels"
  - id: ERR_EVIDENCE_INSUFFICIENT
    http: 422
    condition: "Claim.evidence_score is below Claim.required_score under the claim's scoring_variant"
  - id: ERR_ASSET_USES_EXHAUSTED
    http: 409
    condition: "the asset's remaining_licensed_uses is 0"
  - id: ERR_EXPERT_CAPACITY_EXCEEDED
    http: 409
    condition: "the expert's committed hours for the brief's ISO week plus this brief's sme_reserved_hours exceed weekly_capacity_hours"
  - id: ERR_SLOT_CAPACITY_EXCEEDED
    http: 409
    condition: "slot.committed_points plus the surcharged commit_points exceed slot.capacity_points"

roles:
  - name: ManagingEditor
    description: "Owns the editorial calendar, the brief pipeline, publication, the asset library and the governance sweep. The only role that may create or waive; never the role that substantiates a claim or approves an SME gate."
    identity: opaque
    exclusive_operations:
      - "POST /editorial/campaigns"
      - "POST /editorial/campaigns/{id}/activate"
      - "POST /editorial/campaigns/{id}/close"
      - "POST /editorial/campaigns/{id}/calendar-slots"
      - "POST /editorial/calendar-slots/{id}/lock"
      - "POST /editorial/experts"
      - "POST /editorial/experts/{id}/availability"
      - "POST /editorial/briefs"
      - "POST /editorial/briefs/{id}/assign-sme"
      - "POST /editorial/content-items"
      - "POST /editorial/content-items/{id}/submit-for-review"
      - "POST /editorial/content-items/{id}/claims"
      - "POST /editorial/content-items/{id}/publish"
      - "POST /editorial/content-items/{id}/retract"
      - "POST /editorial/content-items/{id}/audit"
      - "POST /editorial/content-items/{id}/refresh"
      - "POST /editorial/content-items/{id}/prune"
      - "POST /editorial/content-items/{id}/asset-usages"
      - "POST /editorial/assets"
      - "POST /editorial/assets/{id}/renew"
      - "POST /editorial/_clock/set_current_utc"
      - "POST /editorial/_ops/governance-sweep"
      - "POST /editorial/review-gates/{id}/decide with decision WAIVED (BRAND and ACCESSIBILITY gates only, OPEN campaigns only)"
    shared_operations:
      - "POST /editorial/claims/{id}/evidence (with SubjectMatterExpertUser)"
      - "every GET endpoint except GET /editorial/content-items/{id}/performance-snapshots is shared with the reviewer roles"

  - name: SubjectMatterExpertUser
    description: "The assigned subject matter expert. X-User-ID is the SubjectMatterExpert row's id, so ownership of a brief is a direct comparison against ContentBrief.sme_expert_id."
    identity: "entity_backed:SubjectMatterExpert"
    exclusive_operations:
      - "POST /editorial/briefs/{id}/approve"
      - "POST /editorial/briefs/{id}/request-changes"
      - "POST /editorial/review-gates/{id}/decide on gate_type SME"
    shared_operations:
      - "POST /editorial/claims/{id}/evidence (with ManagingEditor)"
      - "GET /editorial/briefs, GET /editorial/briefs/{id}, GET /editorial/content-items, GET /editorial/content-items/{id}, GET /editorial/content-items/{id}/review-gates, GET /editorial/content-items/{id}/claims, GET /editorial/claims/{id}, GET /editorial/claims/{id}/evidence, GET /editorial/experts/{id}, GET /editorial/campaigns/{id}"

  - name: LegalReviewer
    description: "Substantiates claims and decides the LEGAL review gate. Segregation of duties forbids the same operator from doing both on one content item."
    identity: opaque
    exclusive_operations:
      - "POST /editorial/claims/{id}/decide"
      - "POST /editorial/review-gates/{id}/decide on gate_type LEGAL"
    shared_operations:
      - "GET endpoints across campaigns, calendar slots, briefs, content items, review gates, claims, evidence, assets, asset usages, distributions, experts and performance snapshots"

  - name: BrandReviewer
    description: "Decides the BRAND review gate; a peer of the accessibility reviewer with no authority over the other's gate."
    identity: opaque
    exclusive_operations:
      - "POST /editorial/review-gates/{id}/decide on gate_type BRAND"
    shared_operations:
      - "GET endpoints across campaigns, calendar slots, briefs, content items, review gates, claims, assets, asset usages and distributions"

  - name: AccessibilityReviewer
    description: "Decides the ACCESSIBILITY review gate; a peer of the brand reviewer with no authority over the other's gate."
    identity: opaque
    exclusive_operations:
      - "POST /editorial/review-gates/{id}/decide on gate_type ACCESSIBILITY"
    shared_operations:
      - "GET endpoints across campaigns, calendar slots, briefs, content items, review gates, claims, assets, asset usages and distributions"

  - name: AnalyticsService
    description: "The measurement pipeline. Its only write is the immutable performance snapshot, which drives both attribution variants and the decay curve."
    identity: opaque
    exclusive_operations:
      - "POST /editorial/content-items/{id}/performance-snapshots"
    shared_operations:
      - "GET /editorial/content-items, GET /editorial/content-items/{id}, GET /editorial/content-items/{id}/performance-snapshots"

difficulty_notes: |
  Surface sizing: 12 entities, 9 state machines, 2 optimistic-concurrency rules, 10 calculation
  rules (2 of them dual-variant), 41 ordered validation rules, 55 error codes, 49 endpoints and
  6 roles under a segregation-of-duties model.

  Where the difficulty actually lives — none of it in volume:
  1. Order-pinned arithmetic. slot_capacity_commit selects its tier from the PRE-commit utilization
     and forbids the surcharge from re-tiering; content_pipeline_attribution rounds each snapshot's
     weighted share before summing. Both orders are arithmetically plausible and both are observable
     through a single response field, so a wrong ordering is a silent, deterministic failure.
  2. Two genuinely divergent dual variants. claim_evidence_score under STRICT_REGULATED both
     narrows the admissible source types and hardens the recency cliff, so identical evidence scores
     lower AND is measured against a higher bar; LAST_TOUCH vs ASSISTED_FRACTIONAL disagree about
     which snapshots contribute at all.
  3. A cyclic, forking workflow. ContentItem forks into three or four gates and joins only when all
     are APPROVED or WAIVED, then cycles back through CHANGES_REQUESTED and again through refresh,
     with revision_number as the loop counter. Asset and Claim are cyclic too — EXPIRED is not
     terminal in either.
  4. Deep, partial cascades. Expert leave reaches five levels (expert -> briefs -> items -> gates ->
     campaign posture); asset expiry reaches four and the renewal that undoes it deliberately does
     NOT restore items already flagged NEEDS_REFRESH. Compensation is asymmetric by design.
  5. A validation ladder with real conflicts. Expert availability (referential) is ordered before
     weekly capacity (fiscal); claim substantiation (safety) before asset rights expiry (temporal).
     A request that violates both must return the earlier error, which is only discoverable by
     reading the ladder rather than guessing.
  6. Boundaries that flip outcomes. 80.00% utilization selects HIGH and pushes the commit past
     capacity where 75.00% selects MEDIUM and fits exactly; a zero-day gap that a STOCK asset
     accepts is rejected for TALENT; a zero-snapshot baseline window yields 0.00 decay rather than a
     division error.
