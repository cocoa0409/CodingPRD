  # ---------------------------------------------------------------------------
  # Rule 4 — transitive_cascade: two cascades from DIFFERENT triggers.
  # Instance 1 (depth >= 3): Case hold -> Interview CANCELLED -> (each
  #   cancelled interview triggers interviewer recomputation) — chain spelled
  #   out across Case -> Interview -> Investigator.
  # Instance 2 (depth >= 2): Case close -> Investigator.active_case_count
  #   decrement -> TrendSnapshot.is_stale set on matching scopes.
  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: hold_cascades_to_interviews_then_interviewer_recompute
        grounds:
          - state_machines.Case.INVESTIGATING_to_ON_HOLD
          - state_machines.Interview.SCHEDULED_to_CANCELLED
          - entities.Investigator.fields.active_case_count
        distinguishing_aspect: |
          Depth-3 transitive cascade triggered by POST /er/cases/{id}/hold
          (distinct trigger from the sibling instance's close): the hold (hop
          1) mutates each SCHEDULED Interview to CANCELLED (hop 2, caused by
          the hold, not the client), and each of THOSE cancellations triggers
          a recomputation of the interviewer's scheduling state (hop 3,
          caused by hop 2). The sibling close-triggered cascade walks a
          different chain (Case -> Investigator count -> TrendSnapshot).
        test_recipe:
          setup:
            - "A case in INVESTIGATING with two SCHEDULED interviews (2026-08-10 09:00-10:00 and 2026-08-10 11:00-12:00) owned by the assigned investigator INV1."
            - "Clock at 2026-08-05T00:00:00Z."
          setup_api_calls:
            - call: "POST /er/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: ERManager
            - call: "POST /er/intake-channels"
              payload: { channel_code: "HR_DIRECT", display_name: "HR Direct C", default_category: "RETALIATION", default_severity: "HIGH", sla_business_days: 25 }
              as: ERManager
              captures: { ch1: $.data.id }
            - call: "POST /er/employees"
              payload: { employee_number: "R-601", full_name: "Reporter F", email: "r601@example.com", location_code: "DAL", department: "Ops", hire_date: "2019-01-01T00:00:00Z" }
              as: ERManager
              captures: { rep: $.data.id }
            - call: "POST /er/employees"
              payload: { employee_number: "S-601", full_name: "Subject F", email: "s601@example.com", location_code: "DAL", department: "Ops", hire_date: "2019-01-01T00:00:00Z" }
              as: ERManager
              captures: { sub: $.data.id }
            - call: "POST /er/employees"
              payload: { employee_number: "W-601", full_name: "Witness F", email: "w601@example.com", location_code: "DAL", department: "Ops", hire_date: "2019-01-01T00:00:00Z" }
              as: ERManager
              captures: { wit: $.data.id }
            - call: "POST /er/employees"
              payload: { employee_number: "I-601", full_name: "Inv H1", email: "i601@example.com", location_code: "HQ", department: "ER", hire_date: "2018-01-01T00:00:00Z" }
              as: ERManager
              captures: { ei1: $.data.id }
            - call: "POST /er/investigators"
              payload: { employee_id: "${ei1}", certification_level: "LEVEL_3", max_active_cases: 10 }
              as: ERManager
              captures: { inv1: $.data.id }
            - call: "POST /er/cases"
              payload: { intake_channel_id: "${ch1}", reporter_employee_id: "${rep}", subject_employee_id: "${sub}", category: "RETALIATION", severity: "HIGH" }
              as: ERManager
              captures: { c1: $.data.id, c1_v: $.data.version }
            - call: "POST /er/cases/${c1}/assign"
              payload: { investigator_id: "${inv1}", expected_case_version: "${c1_v}" }
              as: ERManager
            - call: "POST /er/cases/${c1}/begin-investigation"
              payload: {}
              as: Investigator
              as_user_id: "${inv1}"
            - call: "POST /er/cases/${c1}/interviews"
              payload: { interviewee_employee_id: "${sub}", scheduled_start: "2026-07-31T09:00:00Z", scheduled_end: "2026-07-31T10:00:00Z" }
              as: Investigator
              as_user_id: "${inv1}"
              captures: { iv1: $.data.id }
            - call: "POST /er/cases/${c1}/interviews"
              payload: { interviewee_employee_id: "${wit}", scheduled_start: "2026-07-31T11:00:00Z", scheduled_end: "2026-07-31T12:00:00Z" }
              as: Investigator
              as_user_id: "${inv1}"
              captures: { iv2: $.data.id }
          trigger:
            - call: "POST /er/cases/${c1}/hold"
              payload: { hold_reason: "Key witness unavailable pending medical leave; investigation paused." }
              as: ERManager
              captures: { c1_held: $.data.id }
          assert:
            - "Case.${c1}.status == ON_HOLD"
            - "Interview.${iv1}.status == CANCELLED"
            - "Interview.${iv2}.status == CANCELLED"
            - "GET /er/investigators/${inv1} active_case_count == 1 (case still assigned; recomputation ran but count unchanged)"

      - name: close_cascades_investigator_count_then_trend_stale
        grounds:
          - state_machines.Case.PENDING_CLOSURE_to_CLOSED
          - entities.Investigator.fields.active_case_count
          - entities.TrendSnapshot.fields.is_stale
        distinguishing_aspect: |
          Depth-2-plus transitive cascade triggered by POST /er/cases/{id}/close
          (distinct trigger from the sibling hold instance): the close (hop 1)
          recomputes Investigator.active_case_count (hop 2, decrementing by 1)
          and marks matching TrendSnapshots is_stale := true (hop 2b); the
          staleness flag itself gates the next snapshot recomputation
          eligibility (hop 3 on read). Both hops are caused by the close, and
          the trend staleness hop is conditioned on scope membership of the
          case's subject location.
        test_recipe:
          setup:
            - "A LOCATION SF ROLLING_90D TrendSnapshot exists (computed when no cases were closed: closed_case_count == 0, case_rate_per_100 == 0.00)."
            - "One SF case driven to PENDING_CLOSURE with all closure gates satisfied (approved finding, subject + reporter notices SENT)."
            - "Assigned investigator INV1 has active_case_count == 1 before the close."
            - "Clock advanced to 2026-08-20T00:00:00Z before snapshot and close."
          setup_api_calls:
            - call: "POST /er/intake-channels"
              payload: { channel_code: "HOTLINE", display_name: "Hotline D", default_category: "POLICY_VIOLATION", default_severity: "LOW", sla_business_days: 10 }
              as: ERManager
