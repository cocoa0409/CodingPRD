          fk_err2: $.data.error_id
      assert:
      - 'unknown agent on known course: 404 and fk_err1 == ERR_AGENT_NOT_FOUND'
      - 'unknown course in path: 404 and fk_err2 == ERR_TRAINING_COURSE_NOT_FOUND'
      - GET /certifications returns 0 rows
  - name: invalid_enum_value_rejected
    claim_type: Violation → Error
    grounds:
    - validations[priority=4]
    - errors.ERR_INVALID_REQUEST
    distinguishing_aspect: 'Enum closure: metric SPEEDY on a service level and to_status FROZEN on a contract transition are both 400 ERR_INVALID_REQUEST
      (enum membership is a request-validity check, not a state check).'
    test_recipe:
      setup:
      - One DRAFT contract.
      setup_api_calls:
      - *id001
      trigger:
      - call: POST /service-levels
        payload:
          contract_id: ${kc_id}
          program_code: MEDICAID
          metric: SPEEDY
          target: 30
          cap_pct_of_gross: 1.0
          remedy_fee_cents: 1000
          effective_from: '2026-09-01T00:00:00Z'
        as: OpsManager
        captures:
          en_err1: $.data.error_id
      - call: POST /contracts/${kc_id}/transition
        payload:
          to_status: FROZEN
        as: OpsManager
        captures:
          en_err2: $.data.error_id
      assert:
      - en_err1 == ERR_INVALID_REQUEST (400)
      - en_err2 == ERR_INVALID_REQUEST (400) — an out-of-enum to_status is not ERR_INVALID_STATE
      - GET /service-levels?contract_id=${kc_id} returns 0 rows; contract still DRAFT
  - name: existence_checked_before_state_on_transition
    claim_type: Priority Ordering
    grounds:
    - validations[priority=3]
    - validations[priority=6]
    distinguishing_aspect: A transition on a non-existent queue id returns 404 ERR_QUEUE_NOT_FOUND even though the requested to_status would also
      be invalid — existence (3) outranks state (6), and the path id is checked before the body.
    test_recipe:
      setup:
      - Empty database.
      setup_api_calls: []
      trigger:
      - call: POST /queues/00000000-0000-4000-8000-000000000000/transition
        payload:
          to_status: FROZEN
        as: OpsManager
        captures:
          pr_err: $.data.error_id
      assert:
      - status 404 and pr_err == ERR_QUEUE_NOT_FOUND
      - pr_err != ERR_INVALID_REQUEST and != ERR_INVALID_STATE
  - name: auto_review_requires_second_approver
    claim_type: Cross-entity validation
    grounds:
    - validations[priority=8]
    - errors.ERR_AUTO_REVIEW_REQUIRES_SECOND_APPROVER
    - entities.Invoice.fields.auto_review
    distinguishing_aspect: 'Segregation of duties fires only when auto_review is true: after a cure completed and a recompute refreshed the line,
      the preparer (billing-1) approving is 409 ERR_AUTO_REVIEW_REQUIRES_SECOND_APPROVER, while a different OpsManager... no — approval is OpsManager-only;
      the preparer''s BillingAnalyst id carried in the approve header is rejected by role first; the pinned behavior is that an approve call carrying
      as_user_id equal to the recorded preparer id fails at priority 8 while a different approver id succeeds.'
    test_recipe:
      setup:
      - ACTIVE contract; ASA breach prepared by BillingAnalyst user billing-1; cure paid; invoice recomputed (auto_review == true because the
        line has a completed cure period); invoice submitted; contract version captured fresh.
      setup_api_calls:
      - *id001
      - *id002
      - *id005
      - *id006
      - *id003
      - *id004
      - *id007
      - *id008
      - call: POST /calls
        payload:
          contract_id: ${kc_id}
          program_code: MEDICAID
          language_code: en
          enqueued_at: '2026-09-05T09:00:00Z'
        as: Supervisor
        captures:
          sod_call: $.data.id
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-05T09:00:00Z'
        as: PlatformAdmin
      - call: POST /calls/${sod_call}/transition
        payload:
          to_status: ASSIGNED
        as: Supervisor
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-05T09:00:40Z'
        as: PlatformAdmin
      - call: POST /calls/${sod_call}/transition
        payload:
          to_status: ANSWERED
        as: Agent
        as_user_id: ${ka_id}
      - call: POST /invoices
        payload:
          contract_id: ${kc_id}
          period: 2026-09
        as: BillingAnalyst
        as_user_id: billing-1
        captures:
          sod_inv: $.data.id
      - call: POST /invoices/${sod_inv}/prepare
        payload: {}
        as: BillingAnalyst
        as_user_id: billing-1
      - call: GET /invoices/${sod_inv}/lines
        payload: {}
        as: BillingAnalyst
        captures:
          sod_line: $.data[0].id
      - call: GET /invoice-lines/${sod_line}/cure-periods
        payload: {}
        as: BillingAnalyst
        captures:
          sod_cp: $.data[0].id
      - call: POST /cure-periods/${sod_cp}/pay-remedy
        payload: {}
        as: BillingAnalyst
        as_user_id: billing-1
      - call: POST /invoices/${sod_inv}/recompute
        payload: {}
        as: BillingAnalyst
        as_user_id: billing-1
      - call: POST /invoices/${sod_inv}/transition
        payload:
          to_status: SUBMITTED
        as: BillingAnalyst
        as_user_id: billing-1
      - call: GET /contracts/${kc_id}
        payload: {}
        as: OpsManager
        captures:
          sod_cv: $.data.version
      trigger:
      - call: POST /invoices/${sod_inv}/transition
        payload:
