            - call: "POST /library/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: LibraryAdmin
            - call: "POST /library/rental-orders"
              payload: { account_id: "${acct_id}", rental_set_id: "${set_id}", copies_requested: 2, checkout_date: "2026-08-05", due_date: "2026-09-04" }
              as: LibraryClerk
              captures: { order_id: $.data.id }
          trigger:
            - call: "POST /library/rental-orders/${order_id}/dispatch"
              payload: {}
              as: LibraryClerk
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (priority 4 state beats priority 15 business_fiscal ERR_PREPAYMENT_REQUIRED)"
            - "RentalOrder.${order_id}.status == DRAFT (unchanged)"
      - name: safety_vs_referential_on_invoice_issue
        grounds:
          - validations[priority=2]
          - validations[priority=5]
          - errors[ERR_INSUFFICIENT_PERMISSIONS]
          - errors[ERR_SEGREGATION_OF_DUTIES]
        distinguishing_aspect: |
          Pair (auth vs business_safety — different categories than instance 1's
