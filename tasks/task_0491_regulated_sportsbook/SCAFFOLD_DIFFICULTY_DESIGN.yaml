            - "BonusGrant.${grant}.wagering_progress_cents == 10000"
            - "Account.${acct}.bonus_balance_cents == 0 (remaining bonus debited)"
            - "Account.${acct}.cash_balance_cents == 92000 (90000 post-stake cash + 2000 converted bonus; bankroll cash+bonus conserved at 92000 across the BONUS->CASH conversion)"
