      - name: subcontractor_suspension_two_hop_cascade
        grounds:
          - state_machines.Subcontractor.ACTIVE_to_SUSPENDED
          - state_machines.Assignment.OFFERED_to_CANCELLED
          - state_machines.Job.DISPATCHED_to_INTAKE
        distinguishing_aspect: |
          Depth-2 chain from a different trigger (PATCH suspend, not patrol check-in):
          suspension cancels the subcontractor's open assignments (hop 1), and each
          cancellation regresses its job back to INTAKE when the re-offer pool is empty
          (hop 2).
