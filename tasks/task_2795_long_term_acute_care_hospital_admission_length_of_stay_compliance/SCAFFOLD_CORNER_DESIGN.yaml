            - "GET /ltch/patients/${pat520_id} still reports version pat520_v1 - a refused referral bumps nothing"
            - "GET /ltch/stays/${stay520_id}/payment-determinations with status DRAFT still returns exactly 1 item, unchanged by the refused re-price"

      - name: clock_must_move_strictly_forward
        claim_type: error_triggerable
        grounds:
          - validations.priority_29
          - errors.ERR_CLOCK_NOT_MONOTONIC
        distinguishing_aspect: "Strictness is the point: re-sending the current instant is refused just as a backwards jump is, and only a one-second advance is accepted - so the guard is `>` and not `>=`."
        test_recipe:
          setup:
            - "A clean system; the clock is advanced once to 2026-08-15T00:00:00Z."
          setup_api_calls:
            - call: "POST /ltch/_clock/set_current_utc"
              payload: { current_utc: "2026-08-15T00:00:00Z" }
              as: ComplianceOfficer
          trigger:
            - call: "POST /ltch/_clock/set_current_utc"
              payload: { current_utc: "2026-08-15T00:00:00Z" }
              as: ComplianceOfficer
              captures: { e_equal: $.data.error_id }
            - call: "POST /ltch/_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: RevenueIntegrityAnalyst
              captures: { e_back: $.data.error_id }
            - call: "POST /ltch/_clock/set_current_utc"
              payload: { current_utc: "2026-08-15T00:00:01Z" }
              as: UtilizationReviewNurse
          assert:
            - "e_equal == ERR_CLOCK_NOT_MONOTONIC with HTTP 422 - an identical instant is not strictly after"
            - "e_back == ERR_CLOCK_NOT_MONOTONIC with HTTP 422, and any role may attempt the call, so the refusal is not an authorization failure"
            - "The one-second advance returns HTTP 200 with current_utc 2026-08-15T00:00:01.000Z and previous_utc 2026-08-15T00:00:00.000Z"
            - "After the two refusals the logical clock is still 2026-08-15T00:00:00.000Z - a refused set has no effect"

