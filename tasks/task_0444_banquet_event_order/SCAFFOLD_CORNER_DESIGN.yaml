# =============================================================================
# §1.9 Scaffold Corner Design (Breadth Coverage Index) — Banquet Event Order
# Enumerates testable claims from SCAFFOLD.yaml §1.1–§1.7 not already exercised
# by §1.8. Same seven-point per-instance contract; names unique across both files.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_event_returns_201_with_defaults_applied
        claim_type: Creation
        grounds:
          - entities.Event.fields.status
          - entities.Event.fields.overset_pct
          - entities.Event.fields.service_charge_pct
          - entities.Event.fields.sales_tax_pct
        distinguishing_aspect: "POST /events with only required fields -> 201, status=INQUIRY, overset_pct=0.05, service_charge_pct=0.22, gratuity_pct=0.0, sales_tax_pct=0.08, guarantee_count=null."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /events"
              payload: { account_name: "Default Co", event_date: "2026-09-01", setup_style: "ROUNDS", expected_attendance: 80 }
              as: SalesManager
              captures: { event_id: $.data.id }
          assert:
            - "Event.${event_id}.status == INQUIRY"
            - "Event.${event_id}.overset_pct == 0.05"
            - "Event.${event_id}.service_charge_pct == 0.22"
            - "Event.${event_id}.gratuity_pct == 0.0"
            - "Event.${event_id}.sales_tax_pct == 0.08"
            - "Event.${event_id}.guarantee_count == null"

      - name: get_event_returns_zero_totals_on_empty_children
        claim_type: Computed Fields
        grounds:
          - entities.Event.fields.estimated_total_cents
          - entities.Event.fields.paid_to_date_cents
          - entities.Event.fields.balance_due_cents
          - calculations.charge_rollup
        distinguishing_aspect: "A freshly created event with no menu/service/booking/payment rows reports estimated_total_cents=0, paid_to_date_cents=0, balance_due_cents=0."
        test_recipe:
          setup: ["One INQUIRY event, no children."]
          setup_api_calls:
            - call: "POST /events"
              payload: { account_name: "Empty Co", event_date: "2026-09-02", setup_style: "THEATER", expected_attendance: 10 }
              as: SalesManager
              captures: { event_id: $.data.id }
          trigger:
            - call: "GET /events/${event_id}"
              payload: {}
              as: SalesManager
          assert:
            - "Event.${event_id}.estimated_total_cents == 0"
            - "Event.${event_id}.paid_to_date_cents == 0"
            - "Event.${event_id}.balance_due_cents == 0"

      - name: get_nonexistent_event_returns_not_found
        claim_type: Not Found
        grounds:
          - validations[priority=3]
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET /events/{random-uuid} for an id that was never created -> ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /events/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: SalesManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_NOT_FOUND"

      - name: create_event_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - validations[priority=4]
          - errors[ERR_INVALID_REQUEST]
          - entities.Event.fields.setup_style
        distinguishing_aspect: "POST /events without setup_style (a required input with no default) -> ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /events"
              payload: { account_name: "NoStyle Co", event_date: "2026-09-03", expected_attendance: 30 }
              as: SalesManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REQUEST"

      - name: create_event_bad_enum_setup_style_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - validations[priority=4]
          - errors[ERR_INVALID_REQUEST]
          - entities.Event.fields.setup_style
        distinguishing_aspect: "POST /events with setup_style='BANQUET' (not in {ROUNDS,THEATER,CLASSROOM,RECEPTION}) -> ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /events"
              payload: { account_name: "BadEnum Co", event_date: "2026-09-04", setup_style: "BANQUET", expected_attendance: 30 }
              as: SalesManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REQUEST"

      - name: create_event_overset_out_of_range_returns_validation_range
        claim_type: Type Constraints
        grounds:
          - validations[priority=4]
          - errors[ERR_VALIDATION_RANGE]
          - entities.Event.fields.overset_pct
        distinguishing_aspect: "POST /events with overset_pct=0.5 (above the 0.10 ceiling) -> ERR_VALIDATION_RANGE (422)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /events"
              payload: { account_name: "Range Co", event_date: "2026-09-05", setup_style: "ROUNDS", expected_attendance: 30, overset_pct: 0.5 }
              as: SalesManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_VALIDATION_RANGE"

      - name: create_booking_with_unknown_function_room_returns_not_found
        claim_type: Parent Relationships
        grounds:
          - validations[priority=3]
          - errors[ERR_NOT_FOUND]
          - entities.FunctionRoomBooking.fields.function_room_id
        distinguishing_aspect: "POST /events/{id}/bookings with a function_room_id that does not resolve -> ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["One INQUIRY event; no function room with the referenced id."]
          setup_api_calls:
            - call: "POST /events"
              payload: { account_name: "FK Co", event_date: "2026-09-06", setup_style: "THEATER", expected_attendance: 30 }
              as: SalesManager
              captures: { event_id: $.data.id, ev_v0: $.data.version }
          trigger:
            - call: "POST /events/${event_id}/bookings"
              payload: { function_room_id: "11111111-1111-4111-8111-111111111111", start_utc: "2026-09-06T18:00:00Z", end_utc: "2026-09-06T22:00:00Z", expected_event_version: "${ev_v0}" }
              as: SalesManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_NOT_FOUND"

      - name: list_events_paginated_envelope
        claim_type: Listing
        grounds:
          - endpoints
          - entities.Event
        distinguishing_aspect: "GET /events?limit=1&offset=0 returns a list envelope with pagination fields total_count and has_more after two events are created."
        test_recipe:
          setup: ["Two INQUIRY events exist."]
          setup_api_calls:
            - call: "POST /events"
              payload: { account_name: "List A", event_date: "2026-09-07", setup_style: "ROUNDS", expected_attendance: 10 }
              as: SalesManager
            - call: "POST /events"
              payload: { account_name: "List B", event_date: "2026-09-08", setup_style: "ROUNDS", expected_attendance: 10 }
              as: SalesManager
          trigger:
            - call: "GET /events"
              payload: { limit: 1, offset: 0 }
              as: SalesManager
          assert:
            - "response.meta.total_count == 2"
            - "response.data length == 1"
            - "response.has_more == true"

      - name: payment_is_immutable_no_version_field
        claim_type: Immutability
        grounds:
          - entities.Payment
          - entities.Payment.fields.status
        distinguishing_aspect: "Payment has common_fields:false — it exposes id and created_at but no version field; its only mutation is the APPLIED->VOIDED status transition via the void endpoint."
        test_recipe:
          setup: ["One APPLIED payment on an event."]
          setup_api_calls:
            - call: "POST /events"
              payload: { account_name: "Immut Co", event_date: "2026-09-09", setup_style: "THEATER", expected_attendance: 20, service_charge_pct: 0.0, gratuity_pct: 0.0, sales_tax_pct: 0.0 }
              as: SalesManager
              captures: { event_id: $.data.id, ev_v0: $.data.version }
            - call: "POST /events/${event_id}/payment-schedule-items"
              payload: { label: "Deposit", due_date: "2026-08-01", amount_due_cents: 50000 }
              as: AccountingClerk
          trigger:
            - call: "POST /events/${event_id}/payments"
              payload: { amount_cents: 50000, method: "CARD", expected_event_version: "${ev_v0}" }
              as: AccountingClerk
              captures: { pay_id: $.data.id, pay_status: $.data.status }
          assert:
            - "Payment.${pay_id}.status == APPLIED"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: hold_from_already_definite_event_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Event.INQUIRY_to_TENTATIVE
          - validations[priority=5]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Calling hold on an event already in DEFINITE -> ERR_INVALID_STATE; INQUIRY->TENTATIVE is the only legal source of hold."
        test_recipe:
          setup: ["Event in DEFINITE with one DEFINITE booking."]
          setup_api_calls:
            - call: "POST /function-rooms"
              payload: { name: "Salon M", max_capacity: 300, turnover_buffer_minutes: 0, hourly_rental_cents: 0 }
              as: PlatformAdmin
              captures: { room_id: $.data.id }
            - call: "POST /events"
              payload: { account_name: "Tau Co", event_date: "2028-02-01", setup_style: "THEATER", expected_attendance: 40 }
              as: SalesManager
              captures: { event_id: $.data.id, ev_v0: $.data.version }
            - call: "POST /events/${event_id}/bookings"
              payload: { function_room_id: "${room_id}", start_utc: "2028-02-01T18:00:00Z", end_utc: "2028-02-01T22:00:00Z", expected_event_version: "${ev_v0}" }
              as: SalesManager
              captures: { booking_id: $.data.id }
            - call: "POST /events/${event_id}/hold"
              payload: {}
              as: SalesManager
            - call: "POST /events/${event_id}/bookings/${booking_id}/make-definite"
              payload: {}
              as: SalesManager
            - call: "POST /events/${event_id}/confirm-space"
              payload: {}
              as: SalesManager
          trigger:
            - call: "POST /events/${event_id}/hold"
              payload: {}
              as: SalesManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE"
            - "Event.${event_id}.status == DEFINITE"

      - name: confirm_space_with_hold_booking_returns_not_all_definite
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Event.TENTATIVE_to_DEFINITE
          - errors[ERR_BOOKING_NOT_ALL_DEFINITE]
        distinguishing_aspect: "confirm-space on a TENTATIVE event that still has a booking in HOLD -> ERR_BOOKING_NOT_ALL_DEFINITE; event stays TENTATIVE."
        test_recipe:
          setup: ["TENTATIVE event with two bookings: one DEFINITE, one still HOLD."]
          setup_api_calls:
            - call: "POST /function-rooms"
              payload: { name: "Salon N", max_capacity: 300, turnover_buffer_minutes: 0, hourly_rental_cents: 0 }
              as: PlatformAdmin
              captures: { room_id: $.data.id }
            - call: "POST /events"
              payload: { account_name: "Ups Co", event_date: "2028-03-01", setup_style: "THEATER", expected_attendance: 40 }
              as: SalesManager
              captures: { event_id: $.data.id, ev_v0: $.data.version }
            - call: "POST /events/${event_id}/bookings"
              payload: { function_room_id: "${room_id}", start_utc: "2028-03-01T09:00:00Z", end_utc: "2028-03-01T11:00:00Z", expected_event_version: "${ev_v0}" }
              as: SalesManager
              captures: { booking1: $.data.id }
            - call: "POST /events/${event_id}/hold"
              payload: {}
              as: SalesManager
            - call: "POST /events/${event_id}/bookings/${booking1}/make-definite"
              payload: {}
              as: SalesManager
            - call: "GET /events/${event_id}"
              payload: {}
              as: SalesManager
              captures: { ev_v1: $.data.version }
            - call: "POST /events/${event_id}/bookings"
              payload: { function_room_id: "${room_id}", start_utc: "2028-03-01T13:00:00Z", end_utc: "2028-03-01T15:00:00Z", expected_event_version: "${ev_v1}" }
              as: SalesManager
              captures: { booking2: $.data.id }
          trigger:
            - call: "POST /events/${event_id}/confirm-space"
              payload: {}
              as: SalesManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_BOOKING_NOT_ALL_DEFINITE"
            - "Event.${event_id}.status == TENTATIVE"

      - name: cancel_from_completed_terminal_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Event.CONFIRMED_to_COMPLETED
          - validations[priority=5]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "cancel on a COMPLETED (terminal) event -> ERR_INVALID_STATE; no transition leaves a terminal state."
        test_recipe:
          setup: ["A COMPLETED event (guarantee locked then actualized)."]
          setup_api_calls:
            - call: "POST /function-rooms"
              payload: { name: "Salon O", max_capacity: 300, turnover_buffer_minutes: 0, hourly_rental_cents: 0 }
              as: PlatformAdmin
              captures: { room_id: $.data.id }
            - call: "POST /events"
              payload: { account_name: "Term Co", event_date: "2028-04-01", setup_style: "THEATER", expected_attendance: 40, service_charge_pct: 0.0, gratuity_pct: 0.0, sales_tax_pct: 0.0 }
              as: SalesManager
              captures: { event_id: $.data.id, ev_v0: $.data.version }
            - call: "POST /events/${event_id}/bookings"
              payload: { function_room_id: "${room_id}", start_utc: "2028-04-01T18:00:00Z", end_utc: "2028-04-01T22:00:00Z", expected_event_version: "${ev_v0}" }
              as: SalesManager
              captures: { booking_id: $.data.id }
            - call: "POST /events/${event_id}/hold"
              payload: {}
              as: SalesManager
            - call: "POST /events/${event_id}/bookings/${booking_id}/make-definite"
              payload: {}
              as: SalesManager
            - call: "POST /events/${event_id}/confirm-space"
              payload: {}
              as: SalesManager
            - call: "POST /events/${event_id}/payment-schedule-items"
              payload: { label: "Deposit", due_date: "2028-03-01", amount_due_cents: 50000 }
              as: AccountingClerk
            - call: "GET /events/${event_id}"
              payload: {}
              as: AccountingClerk
              captures: { ev_v_pay: $.data.version }
            - call: "POST /events/${event_id}/payments"
              payload: { amount_cents: 50000, method: "WIRE", expected_event_version: "${ev_v_pay}" }
              as: AccountingClerk
            - call: "POST /events/${event_id}/lock-guarantee"
              payload: { guarantee_count: 40 }
              as: BanquetCaptain
            - call: "POST /events/${event_id}/actualize"
              payload: { actual_attendance: 38 }
              as: BanquetCaptain
          trigger:
            - call: "POST /events/${event_id}/cancel"
              payload: {}
              as: SalesManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE"
            - "Event.${event_id}.status == COMPLETED"

      - name: release_booking_zeroes_rental_and_frees_window
        claim_type: Side Effect Execution
        grounds:
          - state_machines.FunctionRoomBooking.HOLD_to_RELEASED
          - calculations.room_rental
          - entities.FunctionRoomBooking.fields.rental_charge_cents
        distinguishing_aspect: "Releasing a DEFINITE booking sets rental_charge_cents to 0 and hold_status to RELEASED."
        test_recipe:
          setup: ["TENTATIVE event with one DEFINITE booking (4h, rental 200000)."]
          setup_api_calls:
            - call: "POST /function-rooms"
              payload: { name: "Salon P", max_capacity: 300, turnover_buffer_minutes: 0, hourly_rental_cents: 50000 }
              as: PlatformAdmin
              captures: { room_id: $.data.id }
            - call: "POST /events"
              payload: { account_name: "Rel Co", event_date: "2028-05-01", setup_style: "THEATER", expected_attendance: 40 }
              as: SalesManager
              captures: { event_id: $.data.id, ev_v0: $.data.version }
            - call: "POST /events/${event_id}/bookings"
              payload: { function_room_id: "${room_id}", start_utc: "2028-05-01T18:00:00Z", end_utc: "2028-05-01T22:00:00Z", expected_event_version: "${ev_v0}" }
              as: SalesManager
              captures: { booking_id: $.data.id }
            - call: "POST /events/${event_id}/hold"
              payload: {}
              as: SalesManager
            - call: "POST /events/${event_id}/bookings/${booking_id}/make-definite"
              payload: {}
              as: SalesManager
          trigger:
            - call: "POST /events/${event_id}/bookings/${booking_id}/release"
              payload: {}
              as: SalesManager
          assert:
            - "FunctionRoomBooking.${booking_id}.hold_status == RELEASED"
            - "FunctionRoomBooking.${booking_id}.rental_charge_cents == 0"

      - name: void_already_voided_payment_returns_invalid_state
        claim_type: Idempotency
        grounds:
          - state_machines.Payment.APPLIED_to_VOIDED
          - validations[priority=5]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Voiding a payment a second time (already VOIDED) on a non-CONFIRMED event -> ERR_INVALID_STATE."
        test_recipe:
          setup: ["INQUIRY event with one overpayment-style payment that has been voided once (event never CONFIRMED so deposit-lock never applies)."]
          setup_api_calls:
            - call: "POST /events"
              payload: { account_name: "Idem Co", event_date: "2028-06-01", setup_style: "THEATER", expected_attendance: 20, service_charge_pct: 0.0, gratuity_pct: 0.0, sales_tax_pct: 0.0 }
              as: SalesManager
              captures: { event_id: $.data.id, ev_v0: $.data.version }
            - call: "POST /events/${event_id}/payments"
              payload: { amount_cents: 30000, method: "CHECK", expected_event_version: "${ev_v0}" }
              as: AccountingClerk
              captures: { pay_id: $.data.id }
            - call: "POST /events/${event_id}/payments/${pay_id}/void"
              payload: {}
              as: AccountingClerk
          trigger:
            - call: "POST /events/${event_id}/payments/${pay_id}/void"
              payload: {}
              as: AccountingClerk
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE"
            - "Payment.${pay_id}.status == VOIDED"

      - name: reopen_after_guarantee_locked_returns_invalid_state
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Event.DEFINITE_to_TENTATIVE
          - validations[priority=5]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "reopen requires Event.status==DEFINITE with guarantee_count still null; on a CONFIRMED event (guarantee locked) reopen -> ERR_INVALID_STATE."
        test_recipe:
          setup: ["CONFIRMED event (guarantee locked, deposit settled)."]
          setup_api_calls:
            - call: "POST /function-rooms"
              payload: { name: "Salon Q", max_capacity: 300, turnover_buffer_minutes: 0, hourly_rental_cents: 0 }
              as: PlatformAdmin
              captures: { room_id: $.data.id }
            - call: "POST /events"
              payload: { account_name: "Reopen Co", event_date: "2028-07-01", setup_style: "THEATER", expected_attendance: 40, service_charge_pct: 0.0, gratuity_pct: 0.0, sales_tax_pct: 0.0 }
              as: SalesManager
              captures: { event_id: $.data.id, ev_v0: $.data.version }
            - call: "POST /events/${event_id}/bookings"
              payload: { function_room_id: "${room_id}", start_utc: "2028-07-01T18:00:00Z", end_utc: "2028-07-01T22:00:00Z", expected_event_version: "${ev_v0}" }
              as: SalesManager
              captures: { booking_id: $.data.id }
            - call: "POST /events/${event_id}/hold"
              payload: {}
              as: SalesManager
            - call: "POST /events/${event_id}/bookings/${booking_id}/make-definite"
              payload: {}
              as: SalesManager
            - call: "POST /events/${event_id}/confirm-space"
              payload: {}
              as: SalesManager
            - call: "POST /events/${event_id}/payment-schedule-items"
              payload: { label: "Deposit", due_date: "2028-06-01", amount_due_cents: 50000 }
              as: AccountingClerk
            - call: "GET /events/${event_id}"
              payload: {}
              as: AccountingClerk
              captures: { ev_v_pay: $.data.version }
            - call: "POST /events/${event_id}/payments"
              payload: { amount_cents: 50000, method: "WIRE", expected_event_version: "${ev_v_pay}" }
              as: AccountingClerk
            - call: "POST /events/${event_id}/lock-guarantee"
              payload: { guarantee_count: 40 }
              as: BanquetCaptain
          trigger:
            - call: "POST /events/${event_id}/reopen"
              payload: {}
              as: SalesManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE"
            - "Event.${event_id}.status == CONFIRMED"

  # ===========================================================================
  - section: calculations
    instances:
      - name: consumption_menu_line_extended_uses_qty_not_billable
        claim_type: Correct Result
        grounds:
          - calculations.menu_line_extended
          - entities.MenuLine.fields.extended_cents
          - entities.MenuLine.fields.consumption_qty
        distinguishing_aspect: "A CONSUMPTION menu line unit_price_cents=350 consumption_qty=12 -> extended_cents=4200, independent of the event's billable_count."
        test_recipe:
          setup: ["INQUIRY event, expected_attendance=200 (irrelevant to a consumption line)."]
          setup_api_calls:
            - call: "POST /events"
              payload: { account_name: "Cons Co", event_date: "2028-08-01", setup_style: "RECEPTION", expected_attendance: 200 }
              as: SalesManager
              captures: { event_id: $.data.id }
          trigger:
            - call: "POST /events/${event_id}/menu-lines"
              payload: { name: "Wine bottles", pricing_mode: "CONSUMPTION", unit_price_cents: 350, consumption_qty: 12 }
              as: SalesManager
              captures: { ml_id: $.data.id }
          assert:
            - "MenuLine.${ml_id}.extended_cents == 4200"

      - name: service_line_extended_is_qty_times_unit_price
        claim_type: Correct Result
        grounds:
          - entities.ServiceLine.fields.extended_cents
          - endpoints
        distinguishing_aspect: "A LABOR service line quantity=8 unit_price_cents=7500 -> extended_cents=60000."
        test_recipe:
          setup: ["INQUIRY event."]
          setup_api_calls:
            - call: "POST /events"
              payload: { account_name: "Svc Co", event_date: "2028-09-01", setup_style: "THEATER", expected_attendance: 50 }
              as: SalesManager
              captures: { event_id: $.data.id }
          trigger:
            - call: "POST /events/${event_id}/service-lines"
              payload: { category: "LABOR", description: "Banquet servers", quantity: 8, unit_price_cents: 7500, gratuity_eligible: true }
              as: SalesManager
              captures: { sl_id: $.data.id }
          assert:
            - "ServiceLine.${sl_id}.extended_cents == 60000"

      - name: room_rental_started_hour_rounds_up_on_241_minutes
        claim_type: Precision
        grounds:
          - calculations.room_rental
          - entities.FunctionRoomBooking.fields.rental_charge_cents
        distinguishing_aspect: "A 241-minute window (18:00-22:01) bills ceil(241/60)=5 hours at hourly 50000 -> rental_charge_cents=250000 (the +1 minute past the hour adds a full billed hour)."
        test_recipe:
          setup: ["TENTATIVE event with a HOLD booking 18:00-22:01 on a 50000/hr room."]
          setup_api_calls:
