        excluded_because:
          difficulty_instance: "transitive_cascade / rights_sweep_expiry_cascades_five_hops_to_eo_remediation"
          rationale: "The expiry debit and the five downstream hops are asserted step by step by the named §1.8 instance."

      - name: termination_compensation_reverses_every_side_effect
        claim_type: compensation
        grounds:
          - state_machines.License.transitions.EXECUTED_to_TERMINATED
