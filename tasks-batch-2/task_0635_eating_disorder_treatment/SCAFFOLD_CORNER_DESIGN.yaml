          trigger:
            - call: "POST /edt/admissions/${aidx}/discharge"
              as: Clinician
          assert:
            - "Admission.${aidx}.clinical_status == DISCHARGED"
            - "Program.${pgid}.occupancy_posture == OPEN"
            - "Admission.${aidy}.clinical_status == PENDING_ADMISSION"
            - "Admission.${aidy}.waitlist_promoted == true"

      - name: clock_default_before_set_is_jan_1_2026
        claim_type: scheduled_actions
        grounds:
          - endpoints
          - calculations.authorized_days_balance
        distinguishing_aspect: "Without any /_clock/set_current_utc call, days_consumed on a window starting 2026-01-01 is 0 because the logical clock defaults to exactly 2026-01-01T00:00:00Z (not wall-clock)."
