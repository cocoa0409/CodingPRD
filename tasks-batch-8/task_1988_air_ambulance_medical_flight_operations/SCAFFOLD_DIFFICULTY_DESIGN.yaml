            - { call: "POST /air-ambulance/_clock/set_current_utc", payload: { to_iso8601: "2026-10-31T00:00:00Z" }, as: OpsAdmin }
          trigger:
            - { call: "POST /air-ambulance/invoices/${inv_id}/submit", as: BillingSpecialist, captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_PCR_NOT_APPROVED (business_referential, priority 17) — NOT ERR_TIMELY_FILING_EXPIRED (business_temporal, priority 21), even though 2026-10-31 is 91 days after the 2026-08-01 completion date"
            - "Invoice.${inv_id}.claim_status remains FINALIZED"

  # ---------------------------------------------------------------- Rule 6
  - rule_id: boundary_precision_check
    instances:
      - name: weather_visibility_exactly_at_minimum
        grounds:
          - calculations.weather_minimums_decision
          - validations[priority=12]
        distinguishing_aspect: |
          Metric: visibility in statute miles, via POST
          /air-ambulance/weather-assessments. ROTOR_WING DAY minimum 1.0 SM is
          a >= comparison: exactly 1.0 escapes NO_GO and lands in the MARGINAL
          band (< 1.0 + 0.5), while 0.9 is NO_GO — the inclusive boundary
          decides between launchable-with-alternate and grounded.
        test_recipe:
          setup:
            - "ALS rotor mission in PLANNING (pilot + nurse assigned)"
          setup_api_calls:
            - { call: "POST /air-ambulance/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: OpsAdmin }
            - { call: "POST /air-ambulance/bases", payload: { name: "Base Xi", region: "SW-US" }, as: OpsAdmin, captures: { base_id: "$.data.id" } }
            - { call: "POST /air-ambulance/aircraft", payload: { base_id: "${base_id}", tail_number: "N404VS", aircraft_class: "ROTOR_WING", medical_config: "CCT_CAPABLE" }, as: OpsAdmin, captures: { ac_id: "$.data.id" } }
            - { call: "POST /air-ambulance/crew-members", payload: { base_id: "${base_id}", full_name: "Pat Pilot", crew_role: "PILOT" }, as: OpsAdmin, captures: { pilot_id: "$.data.id" } }
            - { call: "POST /air-ambulance/crew-members", payload: { base_id: "${base_id}", full_name: "Nina Nurse", crew_role: "NURSE" }, as: OpsAdmin, captures: { nurse_id: "$.data.id" } }
            - { call: "POST /air-ambulance/patients", payload: { full_name: "Paul Patient", date_of_birth: "1980-04-12", weight_kg: 80 }, as: Dispatcher, captures: { pat_id: "$.data.id" } }
            - { call: "POST /air-ambulance/mission-requests", payload: { patient_id: "${pat_id}", transport_class: "EMERGENCY_SCENE", origin_facility: "Mile 9 US-60", destination_facility: "County General", reported_cardio: 8, reported_resp: 6, reported_neuro: 5, reported_interventions: 3, onset_iso: "2026-07-31T14:00:00Z" }, as: Dispatcher, captures: { req_id: "$.data.id" } }
            - { call: "POST /air-ambulance/mission-requests/${req_id}/triage", payload: { verified_cardio: 8, verified_resp: 6, verified_neuro: 5, verified_interventions: 3 }, as: MedicalDirector }
            - { call: "POST /air-ambulance/mission-requests/${req_id}/accept", payload: { aircraft_id: "${ac_id}", crew: [{ crew_member_id: "${pilot_id}", role_in_mission: "PILOT" }, { crew_member_id: "${nurse_id}", role_in_mission: "NURSE" }], estimated_loaded_miles: 40, planned_launch_iso: "2026-08-01T06:00:00Z", planned_duration_min: 120 }, as: Dispatcher, captures: { m_id: "$.data.id", m_v: "$.data.version" } }
          trigger:
            - { call: "POST /air-ambulance/weather-assessments", payload: { mission_id: "${m_id}", ceiling_ft: 2000, visibility_sm: 1.0, wind_kt: 10, precip: "NONE", day_night: "DAY", terrain: "FLAT", expected_mission_version: "${m_v}" }, as: FlightCrew, as_user_id: "${pilot_id}", captures: { d_at: "$.data.decision" } }
            - { call: "GET /air-ambulance/missions/${m_id}", as: Dispatcher, captures: { m_v2: "$.data.version" } }
            - { call: "POST /air-ambulance/weather-assessments", payload: { mission_id: "${m_id}", ceiling_ft: 2000, visibility_sm: 0.9, wind_kt: 10, precip: "NONE", day_night: "DAY", terrain: "FLAT", expected_mission_version: "${m_v2}" }, as: FlightCrew, as_user_id: "${pilot_id}", captures: { d_below: "$.data.decision" } }
          assert:
            - "d_at == MARGINAL (visibility 1.0 == minimum passes the >= NO_GO check; 1.0 < 1.0+0.5 lands in the MARGINAL band)"
            - "d_below == NO_GO (0.9 < 1.0)"
            - "Mission.${m_id}.last_weather_decision == NO_GO after the second assessment"

      - name: duty_minutes_exactly_840_allowed
        grounds:
          - calculations.crew_duty_fatigue_window
          - validations[priority=10]
        distinguishing_aspect: |
          Metric: rolling-24h projected duty minutes, via POST
          /air-ambulance/crew-shifts (different metric and endpoint from
          weather_visibility_exactly_at_minimum). The limit is <= inclusive:
          600 + 241 = 841 is rejected with ERR_DUTY_LIMIT_EXCEEDED, while
          600 + 240 = 840 exactly is accepted.
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; base with one PILOT; shift1 planned 00:00-10:00 (600 min) created, closed at clock 10:00"
          setup_api_calls:
            - { call: "POST /air-ambulance/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: OpsAdmin }
            - { call: "POST /air-ambulance/bases", payload: { name: "Base Omicron", region: "NW-US" }, as: OpsAdmin, captures: { base_id: "$.data.id" } }
            - { call: "POST /air-ambulance/crew-members", payload: { base_id: "${base_id}", full_name: "Dana Duty", crew_role: "PILOT" }, as: OpsAdmin, captures: { pilot_id: "$.data.id" } }
            - { call: "POST /air-ambulance/crew-shifts", payload: { crew_member_id: "${pilot_id}", planned_start_iso: "2026-08-01T00:00:00Z", planned_end_iso: "2026-08-01T10:00:00Z" }, as: OpsAdmin, captures: { shift1_id: "$.data.id" } }
            - { call: "POST /air-ambulance/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T10:00:00Z" }, as: OpsAdmin }
            - { call: "PUT /air-ambulance/crew-shifts/${shift1_id}", payload: { status: "CLOSED" }, as: OpsAdmin }
          trigger:
            - { call: "POST /air-ambulance/crew-shifts", payload: { crew_member_id: "${pilot_id}", planned_start_iso: "2026-08-01T20:00:00Z", planned_end_iso: "2026-08-02T00:01:00Z" }, as: OpsAdmin, captures: { err: "$.data.error_id" } }
            - { call: "POST /air-ambulance/crew-shifts", payload: { crew_member_id: "${pilot_id}", planned_start_iso: "2026-08-01T20:00:00Z", planned_end_iso: "2026-08-02T00:00:00Z" }, as: OpsAdmin, captures: { shift2_id: "$.data.id", planned_min: "$.data.planned_minutes" } }
          assert:
            - "err == ERR_DUTY_LIMIT_EXCEEDED (600 + 241 = 841 > 840)"
            - "Second create succeeds: planned_min == 240, projected exactly 840 <= 840 (inclusive boundary passes)"
            - "Rest check also passes for the accepted shift: 20:00 - 10:00 = 600 min >= 600 (inclusive)"

      - name: membership_effective_date_equality
        grounds:
          - validations[priority=25]
          - state_machines.Invoice.UNEVALUATED_to_MEMBER_PROTECTED
          - calculations.member_balance_waterfall
        distinguishing_aspect: |
          Metric: membership effective-date equality (date comparison), via
          POST /air-ambulance/invoices/{id}/finalize and /member-writeoff
          (different metric and endpoint from the other two boundaries):
          effective_from == completion date (2026-08-03) is inclusive, so the
          member dimension evaluates MEMBER_PROTECTED (total 952408; the
          write-off mechanics with exact residuals are pinned in
          compensating_invariant /
          invoice_ledger_conservation_across_posting_appeal_writeoff).
        test_recipe:
          setup:
            - "ACTIVE membership effective_from 2026-08-03; BLS FIXED_WING mission completed at clock 2026-08-03T07:30:00Z; invoice created"
          setup_api_calls:
            - { call: "POST /air-ambulance/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: OpsAdmin }
            - { call: "POST /air-ambulance/bases", payload: { name: "Base Pi", region: "NE-US" }, as: OpsAdmin, captures: { base_id: "$.data.id" } }
            - { call: "POST /air-ambulance/aircraft", payload: { base_id: "${base_id}", tail_number: "N505FW", aircraft_class: "FIXED_WING", medical_config: "BLS_CAPABLE" }, as: OpsAdmin, captures: { ac_id: "$.data.id" } }
            - { call: "POST /air-ambulance/crew-members", payload: { base_id: "${base_id}", full_name: "Pat Pilot", crew_role: "PILOT" }, as: OpsAdmin, captures: { pilot_id: "$.data.id" } }
            - { call: "POST /air-ambulance/crew-members", payload: { base_id: "${base_id}", full_name: "Nina Nurse", crew_role: "NURSE" }, as: OpsAdmin, captures: { nurse_id: "$.data.id" } }
            - { call: "POST /air-ambulance/patients", payload: { full_name: "Megan Member", date_of_birth: "1985-03-15", weight_kg: 62 }, as: Dispatcher, captures: { pat_id: "$.data.id" } }
            - { call: "POST /air-ambulance/memberships", payload: { patient_id: "${pat_id}", tier: "STANDARD", effective_from: "2026-08-03" }, as: BillingSpecialist, captures: { mem_id: "$.data.id" } }
            - { call: "POST /air-ambulance/mission-requests", payload: { patient_id: "${pat_id}", transport_class: "EMERGENCY_INTERFACILITY", origin_facility: "Clinic West", destination_facility: "County General", reported_cardio: 2, reported_resp: 1, reported_neuro: 1, reported_interventions: 0, onset_iso: "2026-07-31T10:00:00Z" }, as: Dispatcher, captures: { req_id: "$.data.id" } }
            - { call: "POST /air-ambulance/mission-requests/${req_id}/triage", payload: { verified_cardio: 2, verified_resp: 1, verified_neuro: 1, verified_interventions: 0 }, as: MedicalDirector }
            - { call: "POST /air-ambulance/mission-requests/${req_id}/accept", payload: { aircraft_id: "${ac_id}", crew: [{ crew_member_id: "${pilot_id}", role_in_mission: "PILOT" }, { crew_member_id: "${nurse_id}", role_in_mission: "NURSE" }], estimated_loaded_miles: 1, planned_launch_iso: "2026-08-03T06:00:00Z", planned_duration_min: 90 }, as: Dispatcher, captures: { m_id: "$.data.id", m_v: "$.data.version" } }
            - { call: "POST /air-ambulance/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T06:00:00Z" }, as: OpsAdmin }
            - { call: "POST /air-ambulance/weather-assessments", payload: { mission_id: "${m_id}", ceiling_ft: 2000, visibility_sm: 5.0, wind_kt: 20, precip: "NONE", day_night: "DAY", terrain: "FLAT", expected_mission_version: "${m_v}" }, as: FlightCrew, as_user_id: "${pilot_id}", captures: { d: "$.data.decision" } }
            - { call: "POST /air-ambulance/missions/${m_id}/advance", payload: { to_state: "LAUNCHED" }, as: FlightCrew, as_user_id: "${pilot_id}" }
            - { call: "POST /air-ambulance/missions/${m_id}/advance", payload: { to_state: "AT_PATIENT" }, as: FlightCrew, as_user_id: "${pilot_id}" }
            - { call: "POST /air-ambulance/missions/${m_id}/advance", payload: { to_state: "IN_TRANSIT" }, as: FlightCrew, as_user_id: "${pilot_id}" }
            - { call: "POST /air-ambulance/missions/${m_id}/advance", payload: { to_state: "AT_DESTINATION" }, as: FlightCrew, as_user_id: "${pilot_id}" }
            - { call: "POST /air-ambulance/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T07:30:00Z" }, as: OpsAdmin }
            - { call: "POST /air-ambulance/missions/${m_id}/advance", payload: { to_state: "COMPLETED" }, as: FlightCrew, as_user_id: "${pilot_id}" }
            - { call: "POST /air-ambulance/invoices", payload: { mission_id: "${m_id}" }, as: BillingSpecialist, captures: { inv_id: "$.data.id" } }
          trigger:
