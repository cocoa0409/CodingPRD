            - "GET /plan-items/${pi_1} after the submit-review shows status IN_REVIEW, so ${e_notassignable} == ERR_PLAN_ITEM_NOT_ASSIGNABLE with HTTP 409 and assigned_writer_id is still ${w_a} with the ORIGINAL window 2026-08-03 / 2026-08-17"
            - "${e_notcancellable} == ERR_PLAN_ITEM_NOT_CANCELLABLE with HTTP 409, and GET /plan-items/${pi_2} shows cancel_reason still 'Feature B was cut from the release'"
