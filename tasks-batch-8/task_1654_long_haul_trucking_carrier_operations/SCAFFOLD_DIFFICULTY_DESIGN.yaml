  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: trip_create_gated_by_load_state
        grounds:
          - state_machines.Trip
          - state_machines.Load.SCREENED_to_ACCEPTED
          - errors[ERR_LOAD_NOT_ASSIGNABLE]
        distinguishing_aspect: |
          Entity pair Trip<-Load: POST /trips requires Load.status == ACCEPTED; a SCREENED
          load rejects with ERR_LOAD_NOT_ASSIGNABLE, and the same request succeeds (201,
          load -> ASSIGNED) once the load is accepted — no other input changes.
        test_recipe:
          setup:
            - "F1 reference data; load SCREENED (not accepted); driver/tractor ready"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T06:00:00Z" }, as: FleetAdmin }
            - { call: "POST /customers", payload: { name: "Acme Foods" }, as: FleetAdmin, captures: { cust: $.data.id } }
            - { call: "POST /lanes", payload: { origin_state: "TX", destination_state: "GA", loaded_miles: 900, rpm_floor_cents: 200 }, as: LoadPlanner, captures: { lane: $.data.id } }
            - { call: "POST /state-fuel-rates", payload: { state_code: "US-NATIONAL", tax_cents_per_gallon: 0, avg_pump_price_cents: 450, effective_from: "2026-01-01T00:00:00Z" }, as: FleetAdmin }
            - { call: "POST /drivers", payload: { cdl_number: "CDL-14", full_name: "D Fourteen", home_terminal: "DAL", pay_model: "MILEAGE", pay_rate_cents_per_mile: 62, hired_at: "2025-01-01T00:00:00Z", last_home_at: "2026-07-28T00:00:00Z" }, as: FleetAdmin, captures: { drv: $.data.id } }
            - { call: "POST /tractors", payload: { unit_number: "T-16", home_terminal: "DAL", odometer_miles: 100000, current_state_code: "TX", tank_capacity_gallons: 200, current_fuel_gallons: 150 }, as: FleetAdmin, captures: { tr: $.data.id } }
            - { call: "POST /loads", payload: { customer_id: "${cust}", lane_id: "${lane}", rate_cents: 250000, weight_lbs: 42000, pickup_appt_at: "2026-08-02T08:00:00Z", delivery_appt_at: "2026-08-03T18:00:00Z" }, as: LoadPlanner, captures: { load: $.data.id } }
            - { call: "POST /loads/${load}/screen", payload: {}, as: LoadPlanner }
          trigger:
            - { call: "POST /trips", payload: { load_id: "${load}", driver_id: "${drv}", tractor_id: "${tr}", planned_deadhead_miles: 120, planned_start_at: "2026-08-02T06:00:00Z", route_states: [ { state_code: "TX", miles: 1020 } ] }, as: Dispatcher, captures: { err: $.data.error_id } }
            - { call: "POST /loads/${load}/accept", payload: {}, as: LoadPlanner }
            - { call: "POST /trips", payload: { load_id: "${load}", driver_id: "${drv}", tractor_id: "${tr}", planned_deadhead_miles: 120, planned_start_at: "2026-08-02T06:00:00Z", route_states: [ { state_code: "TX", miles: 1020 } ] }, as: Dispatcher, captures: { trip: $.data.id } }
            - { call: "GET /loads/${load}", payload: {}, as: Dispatcher, captures: { l_status: $.data.status } }
          assert:
            - "while SCREENED: captured ${err} == ERR_LOAD_NOT_ASSIGNABLE"
            - "after accept: trip created (${trip} present) and ${l_status} == ASSIGNED"

      - name: load_accept_gated_by_customer_state
        grounds:
          - state_machines.Load.SCREENED_to_ACCEPTED
          - state_machines.CustomerAccount.ACTIVE_to_CREDIT_HOLD
          - errors[ERR_CUSTOMER_CREDIT_HOLD]
        distinguishing_aspect: |
          Entity pair Load<-CustomerAccount (different pair than Trip<-Load): accept
          requires the CUSTOMER's status ACTIVE; CREDIT_HOLD rejects with
          ERR_CUSTOMER_CREDIT_HOLD (402 fiscal), and releasing the hold makes the
          identical accept succeed.
        test_recipe:
          setup:
            - "F1 reference data; load SCREENED; customer placed on CREDIT_HOLD"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T06:00:00Z" }, as: FleetAdmin }
            - { call: "POST /customers", payload: { name: "Acme Foods" }, as: FleetAdmin, captures: { cust: $.data.id } }
            - { call: "POST /lanes", payload: { origin_state: "TX", destination_state: "GA", loaded_miles: 900, rpm_floor_cents: 200 }, as: LoadPlanner, captures: { lane: $.data.id } }
            - { call: "POST /state-fuel-rates", payload: { state_code: "US-NATIONAL", tax_cents_per_gallon: 0, avg_pump_price_cents: 450, effective_from: "2026-01-01T00:00:00Z" }, as: FleetAdmin }
            - { call: "POST /loads", payload: { customer_id: "${cust}", lane_id: "${lane}", rate_cents: 250000, weight_lbs: 42000, pickup_appt_at: "2026-08-02T08:00:00Z", delivery_appt_at: "2026-08-03T18:00:00Z" }, as: LoadPlanner, captures: { load: $.data.id } }
            - { call: "POST /loads/${load}/screen", payload: {}, as: LoadPlanner }
            - { call: "POST /customers/${cust}/credit-hold", payload: {}, as: LoadPlanner }
          trigger:
            - { call: "POST /loads/${load}/accept", payload: {}, as: LoadPlanner, captures: { err: $.data.error_id } }
            - { call: "POST /customers/${cust}/release-credit-hold", payload: {}, as: LoadPlanner }
            - { call: "POST /loads/${load}/accept", payload: {}, as: LoadPlanner, captures: { l_status: $.data.status } }
          assert:
            - "under CREDIT_HOLD: captured ${err} == ERR_CUSTOMER_CREDIT_HOLD"
            - "after release: identical accept succeeds, ${l_status} == ACCEPTED"

  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: driver_trip_window_half_open_adjacency
        grounds:
          - validations[priority=9]
          - entities.Trip.fields.planned_start_at
          - errors[ERR_TRIP_OVERLAP]
        distinguishing_aspect: |
          HALF-OPEN interval semantics on resource DRIVER: a new trip whose
          planned_start_at equals the existing trip's delivery_appt_at (window end) is
          adjacent, NOT overlapping (accepted); one minute earlier overlaps ->
          ERR_TRIP_OVERLAP.
        test_recipe:
          setup:
            - "F1 reference data; trip1 PLANNED window [2026-08-02T06:00Z, 2026-08-03T18:00Z) for driver; three ACCEPTED loads; three tractors"
          setup_api_calls:
