# =============================================================================
# Mobile Notarization & Apostille Service (RON / loan-signing) — seed tables
# =============================================================================

scenario: |
  Mobile Notarization & Apostille Service (RON/loan-signing): request & document
  type, notary/agent assignment & RON session, ID/credential verification &
  journal, apostille/authentication routing (Secretary of State), fee
  (per-stamp/travel) & state cap, loan-signing (NSA) package, status tracking,
  record retention

domain_name: mobile-notarization-apostille
api_prefix: /notary

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: compliance_audit
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - optimistic_concurrency
    - derived_field_reconciliation

  entity_topology: flat
  # Peer entities (SigningRequest, Notary, Signer, ApostilleOrder, LoanPackage,
  # FeeSchedule) joined by FK references rather than nested URL ownership. A few
  # true children (RequestDocument, IdVerification, JournalEntry, RetentionRecord,
  # Assignment, RonSession) hang off SigningRequest by FK but are addressed as
  # flat top-level collections filtered by their parent FK.

  state_machine_shape: parallel
  # RonSession carries two independent state axes (session_status x recording_status).
  # SigningRequest is cyclic (revision loop). ApostilleOrder is branching with a
  # resubmit cycle. Notary commission is cyclic (ACTIVE<->SUSPENDED).

  relationship_patterns:
    - one_to_many        # SigningRequest -> RequestDocument, SigningRequest -> JournalEntry
    - flat               # SigningRequest -> Notary (assigned_notary_id), -> Signer
    - cross_aggregate    # LoanPackage references SigningRequest; ApostilleOrder references RequestDocument

  role_model: peer_roles
  # CoordinatorOps owns request intake & fee config; Notary owns sessions, journal,
  # id-verification; ApostilleClerk owns Secretary-of-State routing. Plus a read role.

  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED — emit verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  # --- Configuration: per-state fee schedule -------------------------------
  - name: FeeSchedule
    parent: null
    common_fields: false   # immutable config: id + created_at only, no version
    fields:
      - { name: state_code, type: string, source: input, description: "Two-letter US state code this schedule governs, e.g. CA. Unique among FeeSchedules." }
      - { name: per_stamp_cents, type: integer, source: input, description: "Statutory fee per notarial act/stamp, in cents." }
      - { name: travel_base_cents, type: integer, source: input, description: "Flat travel/trip base fee, in cents." }
      - { name: travel_per_mile_cents, type: integer, source: input, description: "Travel fee per mile, in cents." }
      - { name: ron_surcharge_cents, type: integer, source: input, description: "Technology surcharge added when the act is performed via RON, in cents." }
      - { name: state_cap_cents, type: integer, source: input, description: "Maximum total fee a notary may charge for one signing in this state, in cents. Acts as a min() ceiling on the computed total." }
      - { name: enhanced_trust_required, type: boolean, source: input, default: false, description: "When true, signings in this state must clear the ENHANCED credential-trust threshold rather than STANDARD." }

  # --- Operator tenant ------------------------------------------------------
  - name: Account
    parent: null
    common_fields: true
    fields:
      - { name: org_name, type: string, source: input, description: "Operator organization name." }
      - { name: default_state_code, type: string, source: input, description: "Default state for requests created under this account." }
      - { name: retention_years, type: integer, source: input, default: 10, description: "Mandatory journal/record retention horizon in years for this account." }

  # --- Commissioned notary / signing agent ---------------------------------
  - name: Notary
    parent: null
    common_fields: true
    fields:
      - { name: account_id, type: string, source: input, description: "FK -> Account.id; operator the notary belongs to." }
      - { name: full_name, type: string, source: input, description: "Notary full legal name." }
      - { name: commission_state, type: string, source: input, description: "State that issued the notary commission." }
      - { name: commission_expires_at, type: datetime, source: input, description: "Commission expiry instant (ISO 8601 UTC)." }
      - { name: ron_authorized, type: boolean, source: input, default: false, description: "Whether the notary is authorized to perform Remote Online Notarization." }
      - { name: nsa_certified, type: boolean, source: input, default: false, description: "Whether the notary is a certified Notary Signing Agent (NSA) for loan signings." }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED | EXPIRED. Commission lifecycle; SUSPENDED is reversible, EXPIRED is terminal.", constraints: "one of {ACTIVE, SUSPENDED, EXPIRED}" }
      - { name: active_session_count, type: integer, source: computed, default: 0, description: "Count of RonSessions for this notary whose session_status IN {SCHEDULED, LIVE}. Used by the concurrent-session cap." }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version." }

  # --- Signer / principal ---------------------------------------------------
  - name: Signer
    parent: null
    common_fields: true
    fields:
      - { name: account_id, type: string, source: input, description: "FK -> Account.id; operator that registered the signer." }
      - { name: full_name, type: string, source: input, description: "Signer full legal name." }
      - { name: email, type: string, source: input, description: "Signer contact email." }
      - { name: id_doc_type, type: enum, source: input, description: "Government ID presented: DRIVERS_LICENSE | PASSPORT | STATE_ID.", constraints: "one of {DRIVERS_LICENSE, PASSPORT, STATE_ID}" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version." }

  # --- Signing request (the central workflow resource) ----------------------
  - name: SigningRequest
    parent: null
    common_fields: true
    fields:
      - { name: account_id, type: string, source: input, description: "FK -> Account.id; owning operator." }
      - { name: signer_id, type: string, source: input, description: "FK -> Signer.id; principal who will sign." }
      - { name: state_code, type: string, source: input, description: "US state where the notarization occurs; selects the governing FeeSchedule." }
      - { name: doc_category, type: enum, source: input, description: "GENERAL | REAL_ESTATE | LOAN_SIGNING | APOSTILLE_BOUND. LOAN_SIGNING demands an NSA-certified notary; APOSTILLE_BOUND is eligible for Secretary-of-State routing.", constraints: "one of {GENERAL, REAL_ESTATE, LOAN_SIGNING, APOSTILLE_BOUND}" }
      - { name: delivery_mode, type: enum, source: input, description: "RON | MOBILE. RON requires a ron_authorized notary and adds the RON surcharge.", constraints: "one of {RON, MOBILE}" }
      - { name: expected_stamp_count, type: integer, source: input, description: "Client-declared number of notarial acts, used only for the ESTIMATE fee variant." }
      - { name: estimated_travel_miles, type: integer, source: input, default: 0, description: "Client-declared round-trip miles, used only for the ESTIMATE fee variant (ignored when delivery_mode=RON)." }
      - { name: assigned_notary_id, type: string, source: system, description: "FK -> Notary.id; populated on ASSIGN, cleared on revision back to DRAFT." }
      - { name: status, type: enum, source: system, description: "DRAFT | QUOTED | ASSIGNED | IN_SESSION | COMPLETED | CANCELLED. Cyclic: ASSIGNED can revert to DRAFT for revision.", constraints: "one of {DRAFT, QUOTED, ASSIGNED, IN_SESSION, COMPLETED, CANCELLED}" }
      - { name: estimate_fee_cents, type: integer, source: computed, default: 0, description: "Provisional ESTIMATE fee computed at QUOTE from declared stamp count and estimated miles." }
      - { name: final_fee_cents, type: integer, source: computed, default: 0, description: "FINAL fee computed at COMPLETION from the count of COMPLETED JournalEntries and actual_travel_miles." }
      - { name: actual_travel_miles, type: integer, source: input, default: 0, description: "Actual miles driven, supplied at completion; drives the FINAL fee variant." }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version." }

  # --- Document line items on a request ------------------------------------
  - name: RequestDocument
    parent: SigningRequest
    common_fields: true
    fields:
      - { name: request_id, type: string, source: input, description: "FK -> SigningRequest.id; owning request." }
      - { name: title, type: string, source: input, description: "Document title." }
      - { name: doc_type, type: enum, source: input, description: "DEED | MORTGAGE | POA | AFFIDAVIT | BIRTH_CERT | DIPLOMA | OTHER.", constraints: "one of {DEED, MORTGAGE, POA, AFFIDAVIT, BIRTH_CERT, DIPLOMA, OTHER}" }
      - { name: requires_apostille, type: boolean, source: input, default: false, description: "Whether this document is destined for Secretary-of-State apostille/authentication." }
      - { name: signing_fee_cents, type: integer, source: input, description: "Per-document base signing fee in cents (used by the LoanPackage rounding-order aggregation)." }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version." }

  # --- Notary<->Request assignment ------------------------------------------
  - name: Assignment
    parent: SigningRequest
    common_fields: true
    fields:
      - { name: request_id, type: string, source: input, description: "FK -> SigningRequest.id; the assigned request." }
      - { name: notary_id, type: string, source: input, description: "FK -> Notary.id; the assigned notary." }
      - { name: status, type: enum, source: system, description: "ACTIVE | RELEASED. RELEASED when the request reverts to DRAFT for revision or is cancelled.", constraints: "one of {ACTIVE, RELEASED}" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version." }

  # --- Remote Online Notarization session (parallel state axes) -------------
  - name: RonSession
    parent: SigningRequest
    common_fields: true
    fields:
      - { name: request_id, type: string, source: input, description: "FK -> SigningRequest.id; the request being notarized in this session." }
      - { name: notary_id, type: string, source: system, description: "FK -> Notary.id; the assigned notary hosting the session (copied from the request's assignment)." }
      - { name: scheduled_start, type: datetime, source: input, description: "Scheduled session start instant (ISO 8601 UTC)." }
      - { name: scheduled_end, type: datetime, source: input, description: "Scheduled session end instant (ISO 8601 UTC); must be strictly after scheduled_start." }
      - { name: session_status, type: enum, source: system, description: "SCHEDULED | LIVE | ENDED. First independent state axis.", constraints: "one of {SCHEDULED, LIVE, ENDED}" }
      - { name: recording_status, type: enum, source: system, description: "NOT_STARTED | RECORDING | ARCHIVED. Second independent state axis; AV recording is mandatory for RON.", constraints: "one of {NOT_STARTED, RECORDING, ARCHIVED}" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version." }

  # --- Per-signer identity / credential verification ------------------------
  - name: IdVerification
    parent: SigningRequest
    common_fields: true
    fields:
      - { name: request_id, type: string, source: input, description: "FK -> SigningRequest.id; the request this verification clears." }
      - { name: signer_id, type: string, source: input, description: "FK -> Signer.id; person verified." }
      - { name: kba_score, type: integer, source: input, description: "Knowledge-Based Authentication score, 0-100.", constraints: "0 <= kba_score <= 100" }
      - { name: credential_score, type: integer, source: input, description: "Credential-analysis (ID document) score, 0-100.", constraints: "0 <= credential_score <= 100" }
      - { name: biometric_score, type: integer, source: input, description: "Biometric/liveness score, 0-100.", constraints: "0 <= biometric_score <= 100" }
      - { name: trust_variant, type: enum, source: computed, description: "STANDARD | ENHANCED — which weighting was applied, selected from the request's FeeSchedule.enhanced_trust_required and doc_category.", constraints: "one of {STANDARD, ENHANCED}" }
      - { name: trust_score, type: number, source: computed, description: "Weighted credential trust score (2 decimals) under trust_variant weights." }
      - { name: outcome, type: enum, source: computed, description: "PASS | FAIL — PASS iff trust_score >= the variant threshold.", constraints: "one of {PASS, FAIL}" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version." }

  # --- Append-only notarial journal -----------------------------------------
  - name: JournalEntry
    parent: SigningRequest
    common_fields: false   # immutable append-only record: id + created_at only
    fields:
      - { name: request_id, type: string, source: input, description: "FK -> SigningRequest.id; request the act belongs to." }
      - { name: document_id, type: string, source: input, description: "FK -> RequestDocument.id; document notarized in this act." }
      - { name: notary_id, type: string, source: system, description: "FK -> Notary.id; notary who performed the act (copied from the request assignment)." }
      - { name: act_type, type: enum, source: input, description: "ACKNOWLEDGMENT | JURAT | OATH | COPY_CERTIFICATION.", constraints: "one of {ACKNOWLEDGMENT, JURAT, OATH, COPY_CERTIFICATION}" }
      - { name: entry_status, type: enum, source: system, description: "COMPLETED | VOIDED. Append-only: an act is recorded COMPLETED and may only be administratively VOIDED, never edited.", constraints: "one of {COMPLETED, VOIDED}" }

  # --- Secretary-of-State apostille / authentication routing -----------------
  - name: ApostilleOrder
    parent: null
    common_fields: true
    fields:
      - { name: document_id, type: string, source: input, description: "FK -> RequestDocument.id; document to authenticate. Must have requires_apostille=true." }
      - { name: destination_country, type: string, source: input, description: "ISO country the document is bound for; determines APOSTILLE vs CERTIFICATION routing." }
      - { name: authentication_type, type: enum, source: computed, description: "APOSTILLE | CERTIFICATION — APOSTILLE when destination is a Hague-Convention member, else CERTIFICATION (embassy chain).", constraints: "one of {APOSTILLE, CERTIFICATION}" }
      - { name: sos_office_state, type: string, source: input, description: "Secretary-of-State office state the order is routed to." }
      - { name: fee_cents, type: integer, source: computed, default: 0, description: "Flat Secretary-of-State authentication fee, by authentication_type." }
      - { name: status, type: enum, source: system, description: "SUBMITTED | ROUTED | AUTHENTICATED | RETURNED | REJECTED. RETURNED can be resubmitted (cycle).", constraints: "one of {SUBMITTED, ROUTED, AUTHENTICATED, RETURNED, REJECTED}" }
      - { name: resubmit_count, type: integer, source: system, default: 0, description: "Number of times the order has cycled RETURNED -> SUBMITTED." }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version." }

  # --- NSA loan-signing package ---------------------------------------------
  - name: LoanPackage
    parent: null
    common_fields: true
    fields:
      - { name: request_id, type: string, source: input, description: "FK -> SigningRequest.id; the loan-signing request this package wraps. Request.doc_category must be LOAN_SIGNING." }
      - { name: lender_ref, type: string, source: input, description: "Lender package reference number." }
      - { name: package_discount_pct, type: number, source: input, default: 0, description: "Volume discount applied to each document's signing fee, e.g. 0.10 for 10%." }
      - { name: scrub_passed, type: boolean, source: computed, default: false, description: "Whether the loan-document scrub completed without missing-doc errors." }
      - { name: package_fee_cents, type: integer, source: computed, default: 0, description: "Aggregate package fee: per-document discounted fee rounded to cents, then summed (round-per-document-then-sum)." }
      - { name: status, type: enum, source: system, description: "DRAFT | SCRUBBED | FUNDED | CANCELLED. SCRUBBED can revert to DRAFT for re-scrub.", constraints: "one of {DRAFT, SCRUBBED, FUNDED, CANCELLED}" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version." }

  # --- Record retention ledger (append-only) --------------------------------
  - name: RetentionRecord
    parent: SigningRequest
    common_fields: false   # immutable retention ledger row: id + created_at only
    fields:
      - { name: request_id, type: string, source: input, description: "FK -> SigningRequest.id; the completed request being retained." }
      - { name: journal_entry_count, type: integer, source: system, description: "Snapshot count of COMPLETED JournalEntries at retention time." }
      - { name: retain_until, type: datetime, source: system, description: "Computed retention horizon = completion instant + Account.retention_years." }
      - { name: hold_status, type: enum, source: system, description: "ACTIVE | PURGEABLE. PURGEABLE once the logical clock passes retain_until.", constraints: "one of {ACTIVE, PURGEABLE}" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  # ---- SigningRequest: cyclic with revision loop --------------------------
  - entity: SigningRequest
    initial_state: DRAFT
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: DRAFT
        to: QUOTED
        trigger: "POST /notary/requests/{id}/quote"
        actor: CoordinatorOps
        preconditions:
          - "Request has at least one RequestDocument (ERR_NO_DOCUMENTS)"
          - "A FeeSchedule exists for request.state_code (ERR_FEE_SCHEDULE_MISSING)"
        side_effects:
          - "Compute estimate_fee_cents via calculation request_fee_quote variant=ESTIMATE"
          - "increments SigningRequest.version by 1"

      - from: QUOTED
        to: ASSIGNED
        trigger: "POST /notary/requests/{id}/assign"
        actor: CoordinatorOps
        preconditions:
          - "Target Notary.status == ACTIVE (ERR_NOTARY_NOT_ACTIVE)"
          - "Notary.commission_expires_at is strictly after the logical clock (ERR_COMMISSION_EXPIRED)"
          - "If delivery_mode == RON then Notary.ron_authorized == true (ERR_RON_NOT_AUTHORIZED)"
          - "If doc_category == LOAN_SIGNING then Notary.nsa_certified == true (ERR_NSA_NOT_CERTIFIED)"
        side_effects:
          - "Set assigned_notary_id = target notary"
          - "Create Assignment with status=ACTIVE"
          - "increments SigningRequest.version by 1"

      - from: ASSIGNED
        to: DRAFT
        trigger: "POST /notary/requests/{id}/revise"
        actor: CoordinatorOps
        preconditions:
          - "No RonSession for this request has session_status == LIVE (ERR_SESSION_LIVE)"
        side_effects:
          - "Clear assigned_notary_id"
          - "Owning Assignment.status -> RELEASED"
          - "Any RonSession for this request in session_status SCHEDULED is cancelled: session_status -> ENDED, recording_status -> ARCHIVED"
          - "Reset estimate_fee_cents to 0"
          - "increments SigningRequest.version by 1"
        note: "Revision loop — cyclic edge back to DRAFT."

      - from: ASSIGNED
        to: IN_SESSION
        trigger: "POST /notary/requests/{id}/start-session"
        actor: Notary
        preconditions:
          - "Exactly one RonSession exists for this request in session_status SCHEDULED (ERR_NO_SCHEDULED_SESSION)"
          - "A PASS IdVerification exists for (request_id, request.signer_id) (ERR_ID_NOT_VERIFIED)"
        side_effects:
          - "That RonSession session_status SCHEDULED -> LIVE, recording_status NOT_STARTED -> RECORDING"
          - "increments SigningRequest.version by 1"

      - from: IN_SESSION
        to: COMPLETED
        trigger: "POST /notary/requests/{id}/complete"
        actor: Notary
        preconditions:
          - "The request's LIVE RonSession exists (ERR_NO_LIVE_SESSION)"
          - "At least one COMPLETED JournalEntry exists for this request (ERR_NO_JOURNAL_ENTRIES)"
        side_effects:
          - "Compute final_fee_cents via calculation request_fee_quote variant=FINAL"
          - "LIVE RonSession session_status -> ENDED, recording_status RECORDING -> ARCHIVED"
          - "Create RetentionRecord (journal_entry_count snapshot, retain_until computed, hold_status=ACTIVE)"
          - "increments SigningRequest.version by 1"

      - from: DRAFT
        to: CANCELLED
        trigger: "POST /notary/requests/{id}/cancel"
        actor: CoordinatorOps
        preconditions: []
        side_effects:
          - "increments SigningRequest.version by 1"

      - from: QUOTED
        to: CANCELLED
        trigger: "POST /notary/requests/{id}/cancel"
        actor: CoordinatorOps
        preconditions: []
        side_effects:
          - "increments SigningRequest.version by 1"

      - from: ASSIGNED
        to: CANCELLED
        trigger: "POST /notary/requests/{id}/cancel"
        actor: CoordinatorOps
        preconditions:
          - "No RonSession for this request has session_status == LIVE (ERR_SESSION_LIVE)"
        side_effects:
          - "Owning Assignment.status -> RELEASED"
          - "Any SCHEDULED RonSession -> ENDED, recording_status -> ARCHIVED"
          - "increments SigningRequest.version by 1"

  # ---- RonSession: parallel state dimensions ------------------------------
  - entity: RonSession
    initial_state: SCHEDULED      # session_status axis; recording_status starts NOT_STARTED
    terminal_states: [ENDED]      # session_status terminal; recording_status terminal is ARCHIVED
    transitions:
      # session_status axis
      - from: SCHEDULED
        to: LIVE
        trigger: "POST /notary/requests/{id}/start-session (cascade) or POST /notary/ron-sessions/{id}/go-live"
        actor: Notary
        preconditions:
          - "recording_status must be NOT_STARTED at go-live (ERR_RECORDING_ALREADY_STARTED)"
          - "Owning SigningRequest.status == ASSIGNED (ERR_INVALID_STATE)"
        side_effects:
          - "recording_status NOT_STARTED -> RECORDING (parallel-axis coupling)"
          - "increments RonSession.version by 1"
        note: "session_status and recording_status are independent axes but go-live couples them."

      - from: LIVE
        to: ENDED
        trigger: "POST /notary/requests/{id}/complete (cascade) or POST /notary/ron-sessions/{id}/end"
        actor: Notary
        preconditions:
          - "recording_status must be RECORDING (ERR_RECORDING_NOT_ACTIVE)"
        side_effects:
          - "recording_status RECORDING -> ARCHIVED (parallel-axis coupling)"
          - "increments RonSession.version by 1"

      - from: SCHEDULED
        to: ENDED
        trigger: "system cascade on request revise/cancel"
        actor: system
        preconditions: []
        side_effects:
          - "recording_status -> ARCHIVED if not already"
          - "increments RonSession.version by 1"
        note: "Cancellation path for an unstarted scheduled session."

  # ---- Notary commission: cyclic (ACTIVE<->SUSPENDED), EXPIRED terminal ----
  - entity: Notary
    initial_state: ACTIVE
    terminal_states: [EXPIRED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /notary/notaries/{id}/suspend"
        actor: CoordinatorOps
        preconditions:
          - "Notary has no RonSession in session_status LIVE (ERR_NOTARY_HAS_LIVE_SESSION)"
        side_effects:
          - "increments Notary.version by 1"

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /notary/notaries/{id}/reinstate"
        actor: CoordinatorOps
        preconditions:
          - "commission_expires_at strictly after the logical clock (ERR_COMMISSION_EXPIRED)"
        side_effects:
          - "increments Notary.version by 1"
        note: "Cyclic reinstatement edge."

      - from: ACTIVE
        to: EXPIRED
        trigger: "POST /notary/notaries/{id}/expire"
        actor: CoordinatorOps
        preconditions:
          - "Notary has no RonSession in session_status LIVE (ERR_NOTARY_HAS_LIVE_SESSION)"
        side_effects:
          - "All ACTIVE Assignments for this notary -> RELEASED"
          - "Each released Assignment's SigningRequest, if in status ASSIGNED, reverts to DRAFT and clears assigned_notary_id (cascade depth 3)"
          - "increments Notary.version by 1"

      - from: SUSPENDED
        to: EXPIRED
        trigger: "POST /notary/notaries/{id}/expire"
        actor: CoordinatorOps
        preconditions: []
        side_effects:
          - "All ACTIVE Assignments for this notary -> RELEASED"
          - "increments Notary.version by 1"

  # ---- ApostilleOrder: branching + resubmit cycle -------------------------
  - entity: ApostilleOrder
    initial_state: SUBMITTED
    terminal_states: [AUTHENTICATED, REJECTED]
    transitions:
      - from: SUBMITTED
        to: ROUTED
        trigger: "POST /notary/apostille-orders/{id}/route"
        actor: ApostilleClerk
        preconditions:
          - "The referenced RequestDocument's SigningRequest.status == COMPLETED (ERR_DOCUMENT_NOT_NOTARIZED)"
        side_effects:
          - "increments ApostilleOrder.version by 1"

      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /notary/apostille-orders/{id}/reject"
        actor: ApostilleClerk
        preconditions: []
        side_effects:
          - "increments ApostilleOrder.version by 1"
        note: "Branch from SUBMITTED — reject diverges from route."

      - from: ROUTED
        to: AUTHENTICATED
        trigger: "POST /notary/apostille-orders/{id}/authenticate"
        actor: ApostilleClerk
        preconditions: []
        side_effects:
          - "increments ApostilleOrder.version by 1"

      - from: ROUTED
        to: RETURNED
        trigger: "POST /notary/apostille-orders/{id}/return"
        actor: ApostilleClerk
        preconditions: []
        side_effects:
          - "increments ApostilleOrder.version by 1"
        note: "Branch from ROUTED — SoS returns the order for correction."

      - from: RETURNED
        to: SUBMITTED
        trigger: "POST /notary/apostille-orders/{id}/resubmit"
        actor: ApostilleClerk
        preconditions:
          - "resubmit_count < 3 (ERR_RESUBMIT_LIMIT)"
        side_effects:
          - "resubmit_count += 1"
          - "increments ApostilleOrder.version by 1"
        note: "Cyclic resubmit edge RETURNED -> SUBMITTED."

  # ---- LoanPackage: scrub with revert -------------------------------------
  - entity: LoanPackage
    initial_state: DRAFT
    terminal_states: [FUNDED, CANCELLED]
    transitions:
      - from: DRAFT
        to: SCRUBBED
        trigger: "POST /notary/loan-packages/{id}/scrub"
        actor: Notary
        preconditions:
          - "The wrapped SigningRequest has at least one RequestDocument with doc_type DEED or MORTGAGE (ERR_PACKAGE_MISSING_DOC)"
        side_effects:
          - "Set scrub_passed=true"
          - "Compute package_fee_cents via calculation loan_package_fee"
          - "increments LoanPackage.version by 1"

      - from: SCRUBBED
        to: DRAFT
        trigger: "POST /notary/loan-packages/{id}/unscrub"
        actor: Notary
        preconditions: []
        side_effects:
          - "Set scrub_passed=false, package_fee_cents=0"
          - "increments LoanPackage.version by 1"
        note: "Revert edge for re-scrub."

      - from: SCRUBBED
        to: FUNDED
        trigger: "POST /notary/loan-packages/{id}/fund"
        actor: CoordinatorOps
        preconditions:
          - "Wrapped SigningRequest.status == COMPLETED (ERR_REQUEST_NOT_COMPLETED)"
        side_effects:
          - "increments LoanPackage.version by 1"

      - from: DRAFT
        to: CANCELLED
        trigger: "POST /notary/loan-packages/{id}/cancel"
        actor: CoordinatorOps
        preconditions: []
        side_effects:
          - "increments LoanPackage.version by 1"

# =============================================================================
# 1.2.1 Concurrency Rules (OCC on parent version — true races only)
# =============================================================================
concurrency_rules:
  - rule_id: assign-stale-request
    parent_entity: SigningRequest
    write_endpoint: "POST /notary/requests/{id}/assign"
    occ_field: "expected_request_version"
    description: |
      Assigning a notary to a SigningRequest whose version has advanced since
      the client last observed it is rejected as a stale write. This captures
      the case where the request was already re-quoted or assigned under a newer
      version (legitimately superseding the client's view), so the assignment
      the client is attempting was computed against a stale fee/state snapshot.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: fund-stale-package
    parent_entity: LoanPackage
    write_endpoint: "POST /notary/loan-packages/{id}/fund"
    occ_field: "expected_package_version"
    description: |
      Funding a LoanPackage whose version has advanced since the client last
      observed it is rejected as a stale write. This captures the case where the
      package was re-scrubbed (recomputing package_fee_cents and bumping version)
      after the client read it, so funding against the stale fee snapshot is
      refused.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  # ---- Dual-variant on SigningRequest cost domain -------------------------
  - name: request_fee_quote
    trigger: "QUOTE (variant=ESTIMATE) and COMPLETE (variant=FINAL) transitions on SigningRequest"
    algorithm: threshold
    formula: |
      fs = FeeSchedule for request.state_code
      ron = (request.delivery_mode == "RON")
      # ESTIMATE: at QUOTE, from declared counts
      stamps   = request.expected_stamp_count
      miles    = (0 if ron else request.estimated_travel_miles)
      # FINAL: at COMPLETE, from actuals
      #   stamps = count(JournalEntry WHERE request_id=req AND entry_status==COMPLETED)
      #   miles  = (0 if ron else request.actual_travel_miles)
      base = stamps*fs.per_stamp_cents
           + fs.travel_base_cents
           + miles*fs.travel_per_mile_cents
           + (fs.ron_surcharge_cents if ron else 0)
      total = min(fs.state_cap_cents, base)   # state cap is a hard min() ceiling
    input_set: "ESTIMATE uses declared fields; FINAL uses COMPLETED JournalEntry count (entry_status==COMPLETED only; VOIDED excluded) and actual_travel_miles."
    constants:
      ROUNDING: "integer cents; no fractional cents (all inputs are integer cents)"
    precision: "integer cents"
    variants:
      - name: ESTIMATE
        when: "DRAFT -> QUOTED; writes estimate_fee_cents"
        difference: "stamps = expected_stamp_count; miles = estimated_travel_miles"
      - name: FINAL
        when: "IN_SESSION -> COMPLETED; writes final_fee_cents"
        difference: "stamps = count of COMPLETED JournalEntries; miles = actual_travel_miles; same formula, different inclusion set -> may differ from ESTIMATE"

  # ---- Dual-variant on Signer credential-trust domain ---------------------
  - name: credential_trust_score
    trigger: "POST /notary/id-verifications (create) — computes trust_score, trust_variant, outcome"
    algorithm: weighted_scoring
    formula: |
      variant = "ENHANCED" if (request.doc_category == "LOAN_SIGNING"
                               OR FeeSchedule(request.state_code).enhanced_trust_required)
                else "STANDARD"
      if variant == "STANDARD":
        score = 0.5*kba_score + 0.3*credential_score + 0.2*biometric_score
        threshold = 70
      else: # ENHANCED
        score = 0.3*kba_score + 0.4*credential_score + 0.3*biometric_score
        threshold = 75
      trust_score = round_half_up(score, 2)
      outcome = "PASS" if trust_score >= threshold else "FAIL"
    input_set: "Single IdVerification row's three sub-scores; variant chosen from the linked request's doc_category and FeeSchedule."
    constants:
      STANDARD_WEIGHTS: { kba: 0.5, credential: 0.3, biometric: 0.2, threshold: 70 }
      ENHANCED_WEIGHTS: { kba: 0.3, credential: 0.4, biometric: 0.3, threshold: 75 }
    precision: "2 decimal places, round_half_up"
    variants:
      - name: STANDARD
        when: "doc_category != LOAN_SIGNING and FeeSchedule.enhanced_trust_required == false"
        difference: "weights {0.5,0.3,0.2}, pass threshold 70"
      - name: ENHANCED
        when: "doc_category == LOAN_SIGNING OR FeeSchedule.enhanced_trust_required == true"
        difference: "weights {0.3,0.4,0.3}, pass threshold 75 — same inputs yield a different score and outcome than STANDARD"

  # ---- Combinatorial mode (b): nested rounding order ----------------------
  - name: loan_package_fee
    trigger: "LoanPackage DRAFT -> SCRUBBED; writes package_fee_cents"
    algorithm: aggregation
    formula: |
      # Source set: every RequestDocument of the package's wrapped SigningRequest,
      # ordered by created_at ASC (deterministic; id never used).
      # PINNED ORDER: round each document's discounted fee to whole cents FIRST,
      # THEN sum. (round-per-document-then-sum, NOT sum-then-round.)
      per_doc[i] = round_half_up( doc[i].signing_fee_cents * (1 - package_discount_pct) )
      package_fee_cents = sum(per_doc)
    input_set: "All RequestDocuments of the wrapped request (no status filter — documents have no lifecycle); order by created_at ASC."
    constants:
      ROUNDING_ORDER: "round_per_document_then_sum"
    precision: "whole cents, round_half_up per document"
    variants:
      - name: ROUND_PER_DOC
        when: "always (the pinned order)"
        difference: "per-document rounding before summation; diverges from sum-then-round when fractional cents accumulate"

  # ---- Combinatorial mode (a): apostille fee with conditional branches ----
  - name: apostille_authentication
    trigger: "POST /notary/apostille-orders (create) — computes authentication_type and fee_cents"
    algorithm: threshold
    formula: |
      hague = destination_country in HAGUE_MEMBERS
      authentication_type = "APOSTILLE" if hague else "CERTIFICATION"
      fee_cents = APOSTILLE_FEE_CENTS if hague else CERTIFICATION_FEE_CENTS
    input_set: "Single order's destination_country."
    constants:
      HAGUE_MEMBERS: ["FR", "DE", "JP", "MX", "IT", "ES", "GB", "NL"]
      APOSTILLE_FEE_CENTS: 2000
      CERTIFICATION_FEE_CENTS: 4000
    precision: "integer cents"

  # ---- Derived reconciliation: notary active_session_count ----------------
  - name: notary_active_session_count
    trigger: "any RonSession session_status change; Notary read"
    algorithm: aggregation
    formula: |
      Notary.active_session_count =
        count(RonSession WHERE notary_id == Notary.id
              AND session_status IN {SCHEDULED, LIVE})
    input_set: "RonSessions whose session_status IN {SCHEDULED, LIVE}; ENDED excluded."
    precision: "integer count"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and is one of the declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role is permitted for this operation per the RBAC matrix"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Every path/body referenced resource exists, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: business_constraint
    check: "Required body fields present and well-typed; enum values legal; scores within 0..100"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all mutating endpoints

  - priority: 5
    category: state
    check: "OCC: expected_<parent>_version matches current parent version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /notary/requests/{id}/assign, POST /notary/loan-packages/{id}/fund"

  - priority: 6
    category: state
    check: "Target resource is in a state from which this transition is legal"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 7
    category: business_safety
    check: "RON delivery requires a ron_authorized notary; LOAN_SIGNING requires an nsa_certified notary"
    error_id: ERR_RON_NOT_AUTHORIZED
    http_status: 409
    applies_to: "POST /notary/requests/{id}/assign"

  - priority: 8
    category: business_safety
    check: "Assigned notary commission must be unexpired (commission_expires_at after logical clock) and status ACTIVE"
    error_id: ERR_COMMISSION_EXPIRED
    http_status: 409
    applies_to: "POST /notary/requests/{id}/assign, POST /notary/notaries/{id}/reinstate"

  - priority: 9
    category: business_referential
    check: "Starting a session requires a PASS IdVerification for the request signer"
    error_id: ERR_ID_NOT_VERIFIED
    http_status: 409
    applies_to: "POST /notary/requests/{id}/start-session"

  - priority: 10
    category: business_temporal
    check: "A RonSession's [scheduled_start, scheduled_end) must not overlap another non-ENDED session for the same notary; scheduled_end strictly after scheduled_start"
    error_id: ERR_SESSION_OVERLAP
    http_status: 409
    applies_to: "POST /notary/ron-sessions"

  - priority: 11
    category: business_temporal
    check: "An ApostilleOrder routed to a given sos_office_state must not duplicate an in-flight (SUBMITTED/ROUTED) order for the same document_id"
    error_id: ERR_DUPLICATE_APOSTILLE
    http_status: 409
    applies_to: "POST /notary/apostille-orders"

  - priority: 12
    category: business_fiscal
    check: "Concurrent-session cap: a notary's active_session_count must be < MAX_CONCURRENT_SESSIONS (3) before a new SCHEDULED session is accepted"
    error_id: ERR_SESSION_CAP_EXCEEDED
    http_status: 409
    applies_to: "POST /notary/ron-sessions"

  - priority: 13
    category: business_fiscal
    check: "Credential trust: the request's IdVerification outcome must be PASS (trust_score >= variant threshold)"
    error_id: ERR_CREDENTIAL_TRUST_INSUFFICIENT
    http_status: 409
    applies_to: "POST /notary/requests/{id}/start-session"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Logical clock (test-driving) ---------------------------------------
  - method: POST
    path: "/notary/_clock/set_current_utc"
    description: "Set the server logical clock. Startup default is 2026-03-01T00:00:00Z; before any set, the clock reads exactly this default and never falls back to wall-clock time."
    roles: [CoordinatorOps]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["Logical clock advanced/rewound to to_iso8601"]

  # ---- FeeSchedule (config) -----------------------------------------------
  - method: POST
    path: "/notary/fee-schedules"
    description: "Create a per-state fee schedule."
    roles: [CoordinatorOps]
    code: 201
    input: [state_code, per_stamp_cents, travel_base_cents, travel_per_mile_cents, ron_surcharge_cents, state_cap_cents, "enhanced_trust_required?"]
    output: FeeSchedule
    side_effects: []

  - method: GET
    path: "/notary/fee-schedules/{id}"
    description: "Get a fee schedule."
    roles: [CoordinatorOps, ApostilleClerk, Notary, Viewer]
    code: 200
    input: []
    output: FeeSchedule
    side_effects: []

  - method: GET
    path: "/notary/fee-schedules"
    description: "List fee schedules; filterable by state_code."
    roles: [CoordinatorOps, ApostilleClerk, Notary, Viewer]
    code: 200
    input: ["state_code?", "limit?", "offset?"]
    output: FeeSchedule[]
    side_effects: []

  # ---- Account -------------------------------------------------------------
  - method: POST
    path: "/notary/accounts"
    description: "Create an operator account."
    roles: [CoordinatorOps]
    code: 201
    input: [org_name, default_state_code, "retention_years?"]
    output: Account
    side_effects: []

  - method: GET
    path: "/notary/accounts/{id}"
    description: "Get an account."
    roles: [CoordinatorOps, ApostilleClerk, Notary, Viewer]
    code: 200
    input: []
    output: Account
    side_effects: []

  # ---- Notary --------------------------------------------------------------
  - method: POST
    path: "/notary/notaries"
    description: "Register a notary. Starts in status ACTIVE."
    roles: [CoordinatorOps]
    code: 201
    input: [account_id, full_name, commission_state, commission_expires_at, "ron_authorized?", "nsa_certified?"]
    output: Notary
    side_effects: ["status=ACTIVE, active_session_count=0, version=1"]

  - method: GET
    path: "/notary/notaries/{id}"
    description: "Get a notary, including recomputed active_session_count."
    roles: [CoordinatorOps, ApostilleClerk, Notary, Viewer]
    code: 200
    input: []
    output: Notary
    side_effects: []

  - method: GET
    path: "/notary/notaries"
    description: "List notaries; filterable by account_id."
    roles: [CoordinatorOps, ApostilleClerk, Notary, Viewer]
    code: 200
    input: ["account_id?", "limit?", "offset?"]
    output: Notary[]
    side_effects: []

  - method: POST
    path: "/notary/notaries/{id}/suspend"
    description: "Suspend a notary commission (reversible)."
    roles: [CoordinatorOps]
    code: 200
    input: []
    output: Notary
    side_effects: ["status ACTIVE -> SUSPENDED", "increments Notary.version by 1"]

  - method: POST
    path: "/notary/notaries/{id}/reinstate"
    description: "Reinstate a suspended notary."
    roles: [CoordinatorOps]
    code: 200
    input: []
    output: Notary
    side_effects: ["status SUSPENDED -> ACTIVE", "increments Notary.version by 1"]

  - method: POST
    path: "/notary/notaries/{id}/expire"
    description: "Expire a notary commission (terminal). Cascades assignment release and request revert."
    roles: [CoordinatorOps]
    code: 200
    input: []
    output: Notary
    side_effects:
      - "status -> EXPIRED"
      - "ACTIVE Assignments -> RELEASED; their ASSIGNED requests revert to DRAFT, clear assigned_notary_id"
      - "increments Notary.version by 1"

  # ---- Signer --------------------------------------------------------------
  - method: POST
    path: "/notary/signers"
    description: "Register a signer."
    roles: [CoordinatorOps]
    code: 201
    input: [account_id, full_name, email, id_doc_type]
    output: Signer
    side_effects: []

  - method: GET
    path: "/notary/signers/{id}"
    description: "Get a signer."
    roles: [CoordinatorOps, ApostilleClerk, Notary, Viewer]
    code: 200
    input: []
    output: Signer
    side_effects: []

  - method: GET
    path: "/notary/signers"
    description: "List signers; filterable by account_id."
    roles: [CoordinatorOps, ApostilleClerk, Notary, Viewer]
    code: 200
    input: ["account_id?", "limit?", "offset?"]
    output: Signer[]
    side_effects: []

  # ---- SigningRequest ------------------------------------------------------
  - method: POST
    path: "/notary/requests"
    description: "Create a signing request. Starts in DRAFT."
    roles: [CoordinatorOps]
    code: 201
    input: [account_id, signer_id, state_code, doc_category, delivery_mode, expected_stamp_count, "estimated_travel_miles?"]
    output: SigningRequest
    side_effects: ["status=DRAFT, estimate_fee_cents=0, final_fee_cents=0"]

  - method: GET
    path: "/notary/requests/{id}"
    description: "Get a signing request with computed fee fields."
    roles: [CoordinatorOps, ApostilleClerk, Notary, Viewer]
    code: 200
    input: []
    output: SigningRequest
    side_effects: []

  - method: GET
    path: "/notary/requests"
    description: "List signing requests; filterable by account_id, signer_id, assigned_notary_id, status."
    roles: [CoordinatorOps, ApostilleClerk, Notary, Viewer]
    code: 200
    input: ["account_id?", "signer_id?", "assigned_notary_id?", "status?", "limit?", "offset?"]
    output: SigningRequest[]
    side_effects: []

  - method: POST
    path: "/notary/requests/{id}/quote"
    description: "Quote the request: compute the ESTIMATE fee. DRAFT -> QUOTED."
    roles: [CoordinatorOps]
    code: 200
    input: []
    output: SigningRequest
    side_effects: ["estimate_fee_cents := request_fee_quote(ESTIMATE)", "increments SigningRequest.version by 1"]

  - method: POST
    path: "/notary/requests/{id}/assign"
    description: "Assign a notary. QUOTED -> ASSIGNED. OCC-guarded on the request version."
    roles: [CoordinatorOps]
    code: 200
    input: [notary_id, expected_request_version]
    output: SigningRequest
    side_effects:
      - "assigned_notary_id set; Assignment created status=ACTIVE"
      - "increments SigningRequest.version by 1"

  - method: POST
    path: "/notary/requests/{id}/revise"
    description: "Revert an assigned request to DRAFT for revision. ASSIGNED -> DRAFT."
    roles: [CoordinatorOps]
    code: 200
    input: []
    output: SigningRequest
    side_effects:
      - "clear assigned_notary_id; Assignment -> RELEASED; SCHEDULED sessions cancelled; estimate_fee_cents=0"
      - "increments SigningRequest.version by 1"

  - method: POST
    path: "/notary/requests/{id}/start-session"
    description: "Start the notarization session. ASSIGNED -> IN_SESSION; cascades the SCHEDULED RonSession to LIVE/RECORDING."
    roles: [Notary]
    code: 200
    input: []
    output: SigningRequest
    side_effects:
      - "SCHEDULED RonSession -> LIVE, recording -> RECORDING"
      - "increments SigningRequest.version by 1"

  - method: POST
    path: "/notary/requests/{id}/complete"
    description: "Complete the request. IN_SESSION -> COMPLETED; computes FINAL fee, archives recording, writes RetentionRecord."
    roles: [Notary]
    code: 200
    input: ["actual_travel_miles?"]
    output: SigningRequest
    side_effects:
      - "final_fee_cents := request_fee_quote(FINAL)"
      - "LIVE RonSession -> ENDED, recording -> ARCHIVED; RetentionRecord created"
      - "increments SigningRequest.version by 1"

  - method: POST
    path: "/notary/requests/{id}/cancel"
    description: "Cancel a request from DRAFT/QUOTED/ASSIGNED. -> CANCELLED."
    roles: [CoordinatorOps]
    code: 200
    input: []
    output: SigningRequest
    side_effects:
      - "ACTIVE Assignment -> RELEASED; SCHEDULED sessions cancelled"
      - "increments SigningRequest.version by 1"

  # ---- RequestDocument -----------------------------------------------------
  - method: POST
    path: "/notary/documents"
    description: "Add a document to a request (request must be DRAFT)."
    roles: [CoordinatorOps]
    code: 201
    input: [request_id, title, doc_type, "requires_apostille?", signing_fee_cents]
    output: RequestDocument
    side_effects: []

  - method: GET
    path: "/notary/documents/{id}"
    description: "Get a document."
    roles: [CoordinatorOps, ApostilleClerk, Notary, Viewer]
    code: 200
    input: []
    output: RequestDocument
    side_effects: []

  - method: GET
    path: "/notary/documents"
    description: "List documents; filterable by request_id."
    roles: [CoordinatorOps, ApostilleClerk, Notary, Viewer]
    code: 200
    input: ["request_id?", "limit?", "offset?"]
    output: RequestDocument[]
    side_effects: []

  # ---- Assignment (reverse-reachability for FK) ---------------------------
  - method: GET
    path: "/notary/assignments"
    description: "List assignments; filterable by request_id and notary_id."
    roles: [CoordinatorOps, ApostilleClerk, Notary, Viewer]
    code: 200
    input: ["request_id?", "notary_id?", "limit?", "offset?"]
    output: Assignment[]
    side_effects: []

  - method: GET
    path: "/notary/assignments/{id}"
    description: "Get an assignment."
    roles: [CoordinatorOps, ApostilleClerk, Notary, Viewer]
    code: 200
    input: []
    output: Assignment
    side_effects: []

  # ---- RonSession ----------------------------------------------------------
  - method: POST
    path: "/notary/ron-sessions"
    description: "Schedule a RON session for an ASSIGNED request. Overlap, cap checks. Starts SCHEDULED/NOT_STARTED."
    roles: [Notary]
    code: 201
    input: [request_id, scheduled_start, scheduled_end]
    output: RonSession
    side_effects: ["session_status=SCHEDULED, recording_status=NOT_STARTED; notary's active_session_count recomputed"]

  - method: GET
    path: "/notary/ron-sessions/{id}"
    description: "Get a RON session."
    roles: [CoordinatorOps, ApostilleClerk, Notary, Viewer]
    code: 200
    input: []
    output: RonSession
    side_effects: []

  - method: GET
    path: "/notary/ron-sessions"
    description: "List RON sessions; filterable by request_id and notary_id."
    roles: [CoordinatorOps, ApostilleClerk, Notary, Viewer]
    code: 200
    input: ["request_id?", "notary_id?", "limit?", "offset?"]
    output: RonSession[]
    side_effects: []

  # ---- IdVerification ------------------------------------------------------
  - method: POST
    path: "/notary/id-verifications"
    description: "Record an ID/credential verification; computes trust_variant, trust_score, outcome."
    roles: [Notary]
    code: 201
    input: [request_id, signer_id, kba_score, credential_score, biometric_score]
    output: IdVerification
    side_effects: ["trust_variant, trust_score, outcome computed via credential_trust_score"]

  - method: GET
    path: "/notary/id-verifications/{id}"
    description: "Get an ID verification."
    roles: [CoordinatorOps, ApostilleClerk, Notary, Viewer]
    code: 200
    input: []
    output: IdVerification
    side_effects: []

  - method: GET
    path: "/notary/id-verifications"
    description: "List ID verifications; filterable by request_id and signer_id."
    roles: [CoordinatorOps, ApostilleClerk, Notary, Viewer]
    code: 200
    input: ["request_id?", "signer_id?", "limit?", "offset?"]
    output: IdVerification[]
    side_effects: []

  # ---- JournalEntry --------------------------------------------------------
  - method: POST
    path: "/notary/journal-entries"
    description: "Append a notarial act to the journal (request must be IN_SESSION). Records COMPLETED."
    roles: [Notary]
    code: 201
    input: [request_id, document_id, act_type]
    output: JournalEntry
    side_effects: ["entry_status=COMPLETED, notary_id copied from request assignment"]

  - method: POST
    path: "/notary/journal-entries/{id}/void"
    description: "Administratively void a journal entry. COMPLETED -> VOIDED."
    roles: [CoordinatorOps]
    code: 200
    input: []
    output: JournalEntry
    side_effects: ["entry_status COMPLETED -> VOIDED"]

  - method: GET
    path: "/notary/journal-entries/{id}"
    description: "Get a journal entry."
    roles: [CoordinatorOps, ApostilleClerk, Notary, Viewer]
    code: 200
    input: []
    output: JournalEntry
    side_effects: []

  - method: GET
    path: "/notary/journal-entries"
    description: "List journal entries; filterable by request_id, document_id, and notary_id."
    roles: [CoordinatorOps, ApostilleClerk, Notary, Viewer]
    code: 200
    input: ["request_id?", "document_id?", "notary_id?", "limit?", "offset?"]
    output: JournalEntry[]
    side_effects: []

  # ---- ApostilleOrder ------------------------------------------------------
  - method: POST
    path: "/notary/apostille-orders"
    description: "Submit a document for Secretary-of-State authentication; computes authentication_type and fee_cents. Starts SUBMITTED."
    roles: [ApostilleClerk]
    code: 201
    input: [document_id, destination_country, sos_office_state]
    output: ApostilleOrder
    side_effects: ["authentication_type, fee_cents computed; status=SUBMITTED, resubmit_count=0"]

  - method: GET
    path: "/notary/apostille-orders/{id}"
    description: "Get an apostille order."
    roles: [CoordinatorOps, ApostilleClerk, Notary, Viewer]
    code: 200
    input: []
    output: ApostilleOrder
    side_effects: []

  - method: GET
    path: "/notary/apostille-orders"
    description: "List apostille orders; filterable by document_id and status."
    roles: [CoordinatorOps, ApostilleClerk, Notary, Viewer]
    code: 200
    input: ["document_id?", "status?", "limit?", "offset?"]
    output: ApostilleOrder[]
    side_effects: []

  - method: POST
    path: "/notary/apostille-orders/{id}/route"
    description: "Route to the SoS office. SUBMITTED -> ROUTED."
    roles: [ApostilleClerk]
    code: 200
    input: []
    output: ApostilleOrder
    side_effects: ["increments ApostilleOrder.version by 1"]

  - method: POST
    path: "/notary/apostille-orders/{id}/reject"
    description: "Reject the order. SUBMITTED -> REJECTED."
    roles: [ApostilleClerk]
    code: 200
    input: []
    output: ApostilleOrder
    side_effects: ["increments ApostilleOrder.version by 1"]

  - method: POST
    path: "/notary/apostille-orders/{id}/authenticate"
    description: "Mark authenticated. ROUTED -> AUTHENTICATED."
    roles: [ApostilleClerk]
    code: 200
    input: []
    output: ApostilleOrder
    side_effects: ["increments ApostilleOrder.version by 1"]

  - method: POST
    path: "/notary/apostille-orders/{id}/return"
    description: "SoS returns the order for correction. ROUTED -> RETURNED."
    roles: [ApostilleClerk]
    code: 200
    input: []
    output: ApostilleOrder
    side_effects: ["increments ApostilleOrder.version by 1"]

  - method: POST
    path: "/notary/apostille-orders/{id}/resubmit"
    description: "Resubmit a returned order. RETURNED -> SUBMITTED; resubmit_count += 1 (max 3)."
    roles: [ApostilleClerk]
    code: 200
    input: []
    output: ApostilleOrder
    side_effects: ["resubmit_count += 1", "increments ApostilleOrder.version by 1"]

  # ---- LoanPackage ---------------------------------------------------------
  - method: POST
    path: "/notary/loan-packages"
    description: "Create an NSA loan-signing package for a LOAN_SIGNING request. Starts DRAFT."
    roles: [Notary]
    code: 201
    input: [request_id, lender_ref, "package_discount_pct?"]
    output: LoanPackage
    side_effects: ["status=DRAFT, scrub_passed=false, package_fee_cents=0"]

  - method: GET
    path: "/notary/loan-packages/{id}"
    description: "Get a loan package."
    roles: [CoordinatorOps, ApostilleClerk, Notary, Viewer]
    code: 200
    input: []
    output: LoanPackage
    side_effects: []

  - method: GET
    path: "/notary/loan-packages"
    description: "List loan packages; filterable by request_id."
    roles: [CoordinatorOps, ApostilleClerk, Notary, Viewer]
    code: 200
    input: ["request_id?", "limit?", "offset?"]
    output: LoanPackage[]
    side_effects: []

  - method: POST
    path: "/notary/loan-packages/{id}/scrub"
    description: "Scrub the package; computes package_fee_cents (round-per-doc-then-sum). DRAFT -> SCRUBBED."
    roles: [Notary]
    code: 200
    input: []
    output: LoanPackage
    side_effects: ["scrub_passed=true; package_fee_cents := loan_package_fee", "increments LoanPackage.version by 1"]

  - method: POST
    path: "/notary/loan-packages/{id}/unscrub"
    description: "Revert a scrubbed package to DRAFT. SCRUBBED -> DRAFT."
    roles: [Notary]
    code: 200
    input: []
    output: LoanPackage
    side_effects: ["scrub_passed=false, package_fee_cents=0", "increments LoanPackage.version by 1"]

  - method: POST
    path: "/notary/loan-packages/{id}/fund"
    description: "Fund the package. SCRUBBED -> FUNDED. OCC-guarded on the package version."
    roles: [CoordinatorOps]
    code: 200
    input: [expected_package_version]
    output: LoanPackage
    side_effects: ["increments LoanPackage.version by 1"]

  - method: POST
    path: "/notary/loan-packages/{id}/cancel"
    description: "Cancel a draft package. DRAFT -> CANCELLED."
    roles: [CoordinatorOps]
    code: 200
    input: []
    output: LoanPackage
    side_effects: ["increments LoanPackage.version by 1"]

  # ---- RetentionRecord (reverse-reachability for FK) ----------------------
  - method: GET
    path: "/notary/retention-records/{id}"
    description: "Get a retention record."
    roles: [CoordinatorOps, ApostilleClerk, Notary, Viewer]
    code: 200
    input: []
    output: RetentionRecord
    side_effects: []

  - method: GET
    path: "/notary/retention-records"
    description: "List retention records; filterable by request_id."
    roles: [CoordinatorOps, ApostilleClerk, Notary, Viewer]
    code: 200
    input: ["request_id?", "limit?", "offset?"]
    output: RetentionRecord[]
    side_effects: []

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or unrecognized X-User-Role header" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role not permitted for this operation" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing/invalid body field, bad enum, or score outside 0..100" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "OCC: expected_<parent>_version does not match current version" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a legal state for the requested transition" }
  - { id: ERR_NO_DOCUMENTS, http: 409, condition: "Quote attempted on a request with no documents" }
  - { id: ERR_FEE_SCHEDULE_MISSING, http: 409, condition: "No FeeSchedule exists for the request's state_code" }
  - { id: ERR_NOTARY_NOT_ACTIVE, http: 409, condition: "Assignment target notary is not in status ACTIVE" }
  - { id: ERR_COMMISSION_EXPIRED, http: 409, condition: "Notary commission expired relative to the logical clock" }
  - { id: ERR_RON_NOT_AUTHORIZED, http: 409, condition: "RON delivery requested but notary is not ron_authorized" }
  - { id: ERR_NSA_NOT_CERTIFIED, http: 409, condition: "LOAN_SIGNING request assigned to a non-NSA-certified notary" }
  - { id: ERR_SESSION_LIVE, http: 409, condition: "Cannot revise/cancel while a RonSession is LIVE" }
  - { id: ERR_NO_SCHEDULED_SESSION, http: 409, condition: "start-session requires exactly one SCHEDULED RonSession" }
  - { id: ERR_ID_NOT_VERIFIED, http: 409, condition: "No PASS IdVerification exists for the request signer" }
  - { id: ERR_CREDENTIAL_TRUST_INSUFFICIENT, http: 409, condition: "IdVerification outcome is FAIL (trust_score below variant threshold)" }
  - { id: ERR_NO_LIVE_SESSION, http: 409, condition: "complete requires a LIVE RonSession" }
  - { id: ERR_NO_JOURNAL_ENTRIES, http: 409, condition: "complete requires at least one COMPLETED journal entry" }
  - { id: ERR_RECORDING_ALREADY_STARTED, http: 409, condition: "go-live with recording_status not NOT_STARTED" }
  - { id: ERR_RECORDING_NOT_ACTIVE, http: 409, condition: "end session with recording_status not RECORDING" }
  - { id: ERR_SESSION_OVERLAP, http: 409, condition: "New session interval overlaps another non-ENDED session for the same notary" }
  - { id: ERR_SESSION_CAP_EXCEEDED, http: 409, condition: "Notary already at MAX_CONCURRENT_SESSIONS scheduled/live sessions" }
  - { id: ERR_NOTARY_HAS_LIVE_SESSION, http: 409, condition: "Cannot suspend/expire a notary with a LIVE session" }
  - { id: ERR_DOCUMENT_NOT_NOTARIZED, http: 409, condition: "Apostille route requires the document's request to be COMPLETED" }
  - { id: ERR_DUPLICATE_APOSTILLE, http: 409, condition: "An in-flight apostille order already exists for this document" }
  - { id: ERR_RESUBMIT_LIMIT, http: 409, condition: "Apostille resubmit_count would exceed 3" }
  - { id: ERR_PACKAGE_MISSING_DOC, http: 409, condition: "Loan package scrub found no DEED/MORTGAGE document" }
  - { id: ERR_REQUEST_NOT_COMPLETED, http: 409, condition: "Loan package fund requires the wrapped request COMPLETED" }
  - { id: ERR_NOT_LOAN_SIGNING, http: 409, condition: "Loan package created against a non-LOAN_SIGNING request" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: CoordinatorOps
    description: "Operations coordinator: account/fee/notary/signer setup, request intake, quoting, assignment, revise/cancel, journal void, loan-package funding, clock control."
    identity: opaque
    exclusive_operations:
      - "POST /notary/_clock/set_current_utc"
      - "POST /notary/fee-schedules"
      - "POST /notary/accounts"
      - "POST /notary/notaries (and suspend/reinstate/expire)"
      - "POST /notary/signers"
      - "POST /notary/requests (and quote/assign/revise/cancel)"
      - "POST /notary/documents"
      - "POST /notary/journal-entries/{id}/void"
      - "POST /notary/loan-packages/{id}/fund"
      - "POST /notary/loan-packages/{id}/cancel"
    shared_operations:
      - "All GET endpoints"

  - name: Notary
    description: "Commissioned notary / signing agent: schedules and runs RON sessions, records ID verifications and journal acts, starts/completes signings, creates and scrubs loan packages."
    identity: entity_backed:Notary
    exclusive_operations:
      - "POST /notary/ron-sessions"
      - "POST /notary/id-verifications"
      - "POST /notary/journal-entries"
      - "POST /notary/requests/{id}/start-session"
      - "POST /notary/requests/{id}/complete"
      - "POST /notary/loan-packages (and scrub/unscrub)"
    shared_operations:
      - "All GET endpoints"

  - name: ApostilleClerk
    description: "Secretary-of-State authentication clerk: submits, routes, returns, resubmits, authenticates, and rejects apostille orders."
    identity: opaque
    exclusive_operations:
      - "POST /notary/apostille-orders (and route/reject/authenticate/return/resubmit)"
    shared_operations:
      - "All GET endpoints"

  - name: Viewer
    description: "Read-only auditor; can read any resource but mutate nothing."
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "All GET endpoints"
