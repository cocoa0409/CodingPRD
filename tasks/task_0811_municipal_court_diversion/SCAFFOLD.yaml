scenario: "Municipal Court & Pretrial Diversion: citation docket & arraignment, plea & diversion eligibility (first-offender), community-service/class assignment, fine/fee & installment plan, compliance & dismissal, failure-to-comply & warrant, amnesty/reinstatement, expungement referral"
domain_name: "municipal-court-diversion"
api_prefix: "/"

complexity_profile:
  primary_archetype: "Compliance / audit"
  secondary_archetype: "Workflow orchestration"
  complexity_layers:
    - "Cascading side effects"
    - "Scheduled / deferred actions"
    - "Derived field reconciliation"
    - "Optimistic concurrency"

  entity_topology: "hybrid"
  # Case is the central aggregate (Charge, Arraignment, DiversionAgreement,
  # LedgerAccount, Warrant, ExpungementReferral hang off it); ServiceAssignment
  # and Arraignment additionally reference cross-cutting resource entities
  # (ServiceSite, Courtroom) outside the Case tree.

  state_machine_shape: "cyclic"
  # Case (DIVERSION_GRANTED <-> FAILED_TO_COMPLY), DiversionAgreement
  # (IN_PROGRESS <-> DEFAULTED), and InstallmentPlan (ACTIVE <-> DELINQUENT)
  # all carry revision/reinstatement cycles; several other machines are linear.

  relationship_patterns:
    - one_to_many        # Case -> Charge / Arraignment / Warrant; Diversion -> ServiceAssignment
    - cross_aggregate    # Arraignment -> Courtroom; ServiceAssignment -> ServiceSite

  role_model: "segregation_of_duties"
  # Peer operational roles (CourtClerk, Judge, ProbationOfficer, Cashier) with a
  # hard segregation constraint: the ProbationOfficer who created a
  # ServiceAssignment may not be the officer who verifies its completion.

  consistency_model: "immediate"

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =====================================================================
# §1.1 Entity-Relationship Table
# =====================================================================
entities:
  - name: Defendant
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Defendant legal name"
      - name: date_of_birth
        type: string
        source: input
        description: "ISO date (YYYY-MM-DD)"
      - name: email
        type: string
        source: input
        description: "Contact email"
      - name: prior_diversion_count
        type: integer
        source: input
        description: "Count of prior completed diversions on record; clerk seeds known priors, system increments by 1 on each case dismissal. First-offender eligibility requires this < FIRST_OFFENDER_MAX_PRIOR."
        default: 0
        constraints: ">= 0"

  - name: Case
    parent: null
    common_fields: true
    fields:
      - name: defendant_id
        type: string
        source: input
        description: "FK -> Defendant.id; the cited person"
      - name: citation_number
        type: string
        source: input
        description: "Issuing agency citation number"
      - name: offense_date
        type: string
        source: input
        description: "ISO date the cited offense occurred"
      - name: arraignment_deadline
        type: datetime
        source: computed
        description: "offense_date 00:00:00Z + ARRAIGNMENT_WINDOW_DAYS; plea must be entered at or before this instant"
      - name: status
        type: enum
        source: system
        description: "Case docket lifecycle state"
        default: "DOCKETED"
        constraints: "one of {DOCKETED, ARRAIGNED, DIVERSION_GRANTED, FAILED_TO_COMPLY, COMPLIED, DISMISSED}"

  - name: Charge
    parent: Case
    common_fields: true
    fields:
      - name: case_id
        type: string
        source: input
        description: "FK -> Case.id; owning case"
      - name: offense_code
        type: string
        source: input
        description: "Municipal ordinance code charged"
      - name: severity
        type: enum
        source: input
        description: "Charge severity; drives final fine multiplier"
        constraints: "one of {INFRACTION, MISDEMEANOR}"
      - name: base_fine_amount
        type: number
        source: input
        description: "Base fine in USD before severity multiplier and fees"
        constraints: ">= 0"
      - name: is_diversion_eligible
        type: boolean
        source: input
        description: "Whether this offense qualifies for pretrial diversion"
        default: true

  - name: Courtroom
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Courtroom display name"
      - name: room_code
        type: string
        source: input
        description: "Short room code"
      - name: changeover_buffer_minutes
        type: integer
        source: input
        description: "Mandatory buffer minutes required before and after each hearing in this room; two hearings conflict when their buffer-expanded intervals overlap"
        default: 15
        constraints: ">= 0"

  - name: Arraignment
    parent: Case
    common_fields: true
    fields:
      - name: case_id
        type: string
        source: input
        description: "FK -> Case.id; the case being arraigned"
      - name: courtroom_id
        type: string
        source: input
        description: "FK -> Courtroom.id; room the hearing occupies"
      - name: scheduled_start
        type: datetime
        source: input
        description: "Hearing start (half-open interval start)"
      - name: scheduled_end
        type: datetime
        source: input
        description: "Hearing end (half-open interval end); must be > scheduled_start"
      - name: plea
        type: enum
        source: computed
        description: "Plea entered at the hearing; null until plea recorded"
        constraints: "one of {GUILTY, NOT_GUILTY, NO_CONTEST}"
      - name: status
        type: enum
        source: system
        description: "Hearing lifecycle"
        default: "SCHEDULED"
        constraints: "one of {SCHEDULED, HELD}"

  - name: DiversionAgreement
    parent: Case
    common_fields: true
    fields:
      - name: case_id
        type: string
        source: input
        description: "FK -> Case.id; the diverted case"
      - name: mandated_service_hours
        type: number
        source: input
        description: "Court-ordered community-service hours the defendant must complete"
        constraints: ">= 0"
      - name: required_class_sessions
        type: integer
        source: input
        description: "Court-ordered education-class sessions required"
        constraints: ">= 0"
      - name: program_fee
        type: number
        source: input
        description: "Diversion program administration fee in USD, added to the final assessment"
        constraints: ">= 0"
      - name: program_deadline
        type: datetime
        source: input
        description: "Instant by which all diversion requirements must be met; warrant may issue strictly after this"
      - name: assigned_service_hours
        type: number
        source: computed
        description: "CONSERVED QUANTITY: sum of required_hours over ServiceAssignments of this agreement whose status != WAIVED"
        default: 0
      - name: completed_service_hours
        type: number
        source: computed
        description: "Sum of completed_hours over ServiceAssignments whose status == COMPLETED (verified only)"
        default: 0
      - name: completed_class_sessions
        type: integer
        source: computed
        description: "Count of EDUCATION_CLASS ServiceAssignments whose status == COMPLETED"
        default: 0
      - name: provisional_compliance_pct
        type: number
        source: computed
        description: "Projected compliance percentage; service numerator counts logged hours on assignments in {IN_PROGRESS, COMPLETED}"
        default: 0
      - name: final_compliance_pct
        type: number
        source: computed
        description: "Verified compliance percentage; service numerator counts completed_hours only on COMPLETED assignments"
        default: 0
      - name: status
        type: enum
        source: system
        description: "Diversion lifecycle"
        default: "OFFERED"
        constraints: "one of {OFFERED, IN_PROGRESS, COMPLETED, DEFAULTED}"

  - name: ServiceSite
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Service site display name"
      - name: site_type
        type: enum
        source: input
        description: "Kind of assignment the site hosts"
        constraints: "one of {COMMUNITY_SERVICE, EDUCATION_CLASS}"
      - name: concurrent_capacity
        type: integer
        source: input
        description: "Maximum number of ServiceAssignments whose sessions may overlap in time at this site"
        constraints: ">= 1"

  - name: ServiceAssignment
    parent: DiversionAgreement
    common_fields: true
    fields:
      - name: diversion_id
        type: string
        source: input
        description: "FK -> DiversionAgreement.id; owning agreement"
      - name: service_site_id
        type: string
        source: input
        description: "FK -> ServiceSite.id; site hosting the session"
      - name: assignment_type
        type: enum
        source: input
        description: "Assignment kind; must match the site's site_type"
        constraints: "one of {COMMUNITY_SERVICE, EDUCATION_CLASS}"
      - name: required_hours
        type: number
        source: input
        description: "Hours (COMMUNITY_SERVICE) or session-equivalent hours this assignment covers"
        constraints: ">= 0"
      - name: session_start
        type: datetime
        source: input
        description: "Session window start (half-open interval start)"
      - name: session_end
        type: datetime
        source: input
        description: "Session window end; must be > session_start"
      - name: completed_hours
        type: number
        source: computed
        description: "Running total of logged hours"
        default: 0
      - name: assigned_by_officer_id
        type: string
        source: system
        description: "X-User-ID (opaque) of the ProbationOfficer who created this assignment; segregation-of-duties compares this against the verifier's X-User-ID"
      - name: status
        type: enum
        source: system
        description: "Assignment lifecycle"
        default: "ASSIGNED"
        constraints: "one of {ASSIGNED, IN_PROGRESS, COMPLETED, WAIVED}"

  - name: LedgerAccount
    parent: Case
    common_fields: true
    fields:
      - name: case_id
        type: string
        source: input
        description: "FK -> Case.id; owning case (1:1)"
      - name: assessed_amount
        type: number
        source: computed
        description: "Total assessed fines + fees + surcharge (+ program_fee once diversion is granted, + LATE_PENALTY once a warrant issues, - amnesty waiver + reinstatement_fee on reinstatement)"
        default: 0
      - name: collected_amount
        type: number
        source: computed
        description: "CONSERVED QUANTITY input: sum of Payment.amount over this account's Payments whose reversed == false"
        default: 0
      - name: balance
        type: number
        source: computed
        description: "assessed_amount - collected_amount"
        default: 0
      - name: status
        type: enum
        source: system
        description: "Account lifecycle"
        default: "PROVISIONAL"
        constraints: "one of {PROVISIONAL, ASSESSED, SETTLED, CLOSED}"

  - name: InstallmentPlan
    parent: LedgerAccount
    common_fields: true
    fields:
      - name: ledger_account_id
        type: string
        source: input
        description: "FK -> LedgerAccount.id; account being paid down"
      - name: num_installments
        type: integer
        source: input
        description: "Number of equal installments"
        constraints: "INSTALLMENT_COUNT_MIN <= n <= INSTALLMENT_COUNT_MAX"
      - name: installment_amount
        type: number
        source: computed
        description: "Per-installment amount for installments 1..n-1 (floor to the cent)"
        default: 0
      - name: final_installment_amount
        type: number
        source: computed
        description: "Amount of the final installment; absorbs the rounding remainder"
        default: 0
      - name: next_due_date
        type: datetime
        source: computed
        description: "Due date of the next unpaid installment"
      - name: status
        type: enum
        source: system
        description: "Plan lifecycle"
        default: "ACTIVE"
        constraints: "one of {ACTIVE, DELINQUENT, PAID_OFF, SUPERSEDED}"

  - name: Payment
    parent: LedgerAccount
    common_fields: false
    fields:
      - name: ledger_account_id
        type: string
        source: input
        description: "FK -> LedgerAccount.id; account credited"
      - name: amount
        type: number
        source: input
        description: "Payment amount in USD"
        constraints: "> 0"
      - name: allocated_fines
        type: number
        source: computed
        description: "Portion of amount applied to the fines bucket by the waterfall"
        default: 0
      - name: allocated_court_fee
        type: number
        source: computed
        description: "Portion applied to the court-fee bucket"
        default: 0
      - name: allocated_surcharge
        type: number
        source: computed
        description: "Portion applied to the state-surcharge bucket"
        default: 0
      - name: allocated_program_fee
        type: number
        source: computed
        description: "Portion applied to the program-fee bucket"
        default: 0
      - name: reversed
        type: boolean
        source: computed
        description: "True once this payment has been reversed; reversed payments drop out of collected_amount"
        default: false

  - name: Warrant
    parent: Case
    common_fields: true
    fields:
      - name: case_id
        type: string
        source: input
        description: "FK -> Case.id; case the warrant is issued against"
      - name: reason
        type: string
        source: computed
        description: "Human-readable issuance reason"
      - name: status
        type: enum
        source: system
        description: "Warrant lifecycle"
        default: "ISSUED"
        constraints: "one of {ISSUED, RECALLED}"

  - name: AmnestyProgram
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Amnesty program name"
      - name: penalty_waiver_pct
        type: number
        source: input
        description: "Fraction (0..1) of the accrued LATE_PENALTY waived on reinstatement under this program"
        constraints: "0 <= x <= 1"
      - name: reinstatement_fee
        type: number
        source: input
        description: "Flat fee added to the assessment on reinstatement"
        constraints: ">= 0"
      - name: active_from
        type: datetime
        source: input
        description: "Amnesty window start (inclusive)"
      - name: active_to
        type: datetime
        source: input
        description: "Amnesty window end (EXCLUSIVE); reinstatement allowed iff active_from <= now < active_to"

  - name: ExpungementReferral
    parent: Case
    common_fields: true
    fields:
      - name: case_id
        type: string
        source: input
        description: "FK -> Case.id; case referred for expungement"
      - name: eligible_date
        type: datetime
        source: computed
        description: "Instant the referral became eligible (set when the case reached COMPLIED)"
      - name: status
        type: enum
        source: system
        description: "Referral lifecycle"
        default: "PENDING"
        constraints: "one of {PENDING, SUBMITTED}"

# =====================================================================
# §1.2 State Machine Table
# =====================================================================
state_machines:
  - entity: Case
    initial_state: DOCKETED
    terminal_states: [DISMISSED]
    transitions:
      - from: DOCKETED
        to: ARRAIGNED
        trigger: "POST /arraignments/{id}/plea"
        actor: Defendant
        preconditions:
          - "an Arraignment for this case exists in status SCHEDULED"
          - "now <= Case.arraignment_deadline (else ERR_ARRAIGNMENT_DEADLINE_PASSED)"
        side_effects:
          - "Arraignment.plea set; Arraignment.status SCHEDULED -> HELD"
          - "create LedgerAccount for the case in status PROVISIONAL"
          - "compute LedgerAccount.assessed_amount via fine_assessment variant=provisional"
        note: "Judge may also enter the plea on the defendant's behalf."
      - from: ARRAIGNED
        to: DIVERSION_GRANTED
        trigger: "POST /cases/{id}/diversion-agreements"
        actor: Judge
        preconditions:
          - "Arraignment.plea in {GUILTY, NO_CONTEST}"
          - "Defendant.prior_diversion_count < FIRST_OFFENDER_MAX_PRIOR (else ERR_NOT_FIRST_OFFENDER)"
          - "at least one Charge on the case has is_diversion_eligible == true (else ERR_CHARGE_NOT_ELIGIBLE)"
        side_effects:
          - "create DiversionAgreement in status OFFERED"
          - "recompute LedgerAccount.assessed_amount via fine_assessment variant=final (adds severity multiplier and program_fee)"
          - "LedgerAccount.status PROVISIONAL -> ASSESSED"
      - from: DIVERSION_GRANTED
        to: COMPLIED
        trigger: "system bubble-up when DiversionAgreement.status becomes COMPLETED"
        actor: system
        preconditions:
          - "DiversionAgreement.status == COMPLETED"
        side_effects:
          - "create ExpungementReferral in status PENDING with eligible_date = now"
        note: "Cross-entity: Case advances only because its DiversionAgreement reached COMPLETED (which itself required LedgerAccount SETTLED)."
      - from: COMPLIED
        to: DISMISSED
        trigger: "POST /cases/{id}/dismiss"
        actor: Judge
        preconditions:
          - "Case.status == COMPLIED"
          - "DiversionAgreement.status == COMPLETED (else ERR_DIVERSION_NOT_COMPLETE)"
        side_effects:
          - "increment Defendant.prior_diversion_count by 1"
          - "LedgerAccount.status SETTLED -> CLOSED"
      - from: DIVERSION_GRANTED
        to: FAILED_TO_COMPLY
        trigger: "POST /cases/{id}/warrant"
        actor: Judge
        preconditions:
          - "Case.status == DIVERSION_GRANTED"
          - "now > DiversionAgreement.program_deadline (else ERR_DEADLINE_NOT_PASSED)"
        side_effects:
          - "CASCADE link1: DiversionAgreement.status IN_PROGRESS -> DEFAULTED"
          - "CASCADE link2 (caused by the DEFAULTED diversion): create Warrant in status ISSUED with reason"
          - "CASCADE link2 also demotes any InstallmentPlan of the case's LedgerAccount from ACTIVE -> DELINQUENT"
          - "add LATE_PENALTY to LedgerAccount.assessed_amount; recompute balance"
      - from: FAILED_TO_COMPLY
        to: DIVERSION_GRANTED
        trigger: "POST /cases/{id}/reinstate"
        actor: Judge
        preconditions:
          - "Case.status == FAILED_TO_COMPLY"
          - "referenced AmnestyProgram active_from <= now < active_to (else ERR_AMNESTY_WINDOW_CLOSED)"
        side_effects:
          - "DiversionAgreement.status DEFAULTED -> IN_PROGRESS"
          - "Warrant.status ISSUED -> RECALLED"
          - "waive amnesty portion of LATE_PENALTY and add reinstatement_fee via reinstatement_amnesty_adjustment; recompute balance"
          - "any InstallmentPlan of the account DELINQUENT -> ACTIVE"
        note: "Cyclic edge back to DIVERSION_GRANTED (revision/reinstatement loop)."

  - entity: DiversionAgreement
    initial_state: OFFERED
    terminal_states: [COMPLETED]
    transitions:
      - from: OFFERED
        to: IN_PROGRESS
        trigger: "POST /diversion-agreements/{id}/accept"
        actor: Defendant
        preconditions:
          - "owning Case.status == DIVERSION_GRANTED"
        side_effects:
          - "none beyond status change and updated_at"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "system bubble-up on POST /service-assignments/{id}/verify-completion"
        actor: system
        preconditions:
          - "every ServiceAssignment of this agreement is in status COMPLETED or WAIVED"
          - "completed_service_hours >= mandated_service_hours AND completed_class_sessions >= required_class_sessions"
          - "owning Case's LedgerAccount.status == SETTLED (else ERR_LEDGER_NOT_SETTLED)"
        side_effects:
          - "recompute final_compliance_pct (reaches 100)"
          - "bubble Case DIVERSION_GRANTED -> COMPLIED"
        note: "Cross-entity gate on LedgerAccount state."
      - from: IN_PROGRESS
        to: DEFAULTED
        trigger: "cascade from Case DIVERSION_GRANTED -> FAILED_TO_COMPLY (POST /cases/{id}/warrant)"
        actor: system
        preconditions:
          - "owning Case transitioning to FAILED_TO_COMPLY"
        side_effects:
          - "triggers Warrant creation (next cascade link)"
      - from: DEFAULTED
        to: IN_PROGRESS
        trigger: "cascade from Case FAILED_TO_COMPLY -> DIVERSION_GRANTED (POST /cases/{id}/reinstate)"
        actor: system
        preconditions:
          - "owning Case transitioning to DIVERSION_GRANTED via reinstatement"
        side_effects:
          - "none beyond status change"

  - entity: ServiceAssignment
    initial_state: ASSIGNED
    terminal_states: [COMPLETED, WAIVED]
    transitions:
      - from: ASSIGNED
        to: IN_PROGRESS
        trigger: "POST /service-assignments/{id}/progress"
        actor: ProbationOfficer
        preconditions:
          - "hours_logged > 0"
        side_effects:
          - "completed_hours += hours_logged"
          - "recompute owning DiversionAgreement.provisional_compliance_pct"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /service-assignments/{id}/verify-completion"
        actor: ProbationOfficer
        preconditions:
          - "owning DiversionAgreement.status == IN_PROGRESS (else ERR_INVALID_STATE) — cross-entity ServiceAssignment<->DiversionAgreement gate"
          - "verifier X-User-ID != assigned_by_officer_id (else ERR_SEGREGATION_OF_DUTIES)"
          - "completed_hours >= required_hours (else ERR_ASSIGNMENT_NOT_VERIFIABLE)"
        side_effects:
          - "recompute owning DiversionAgreement.completed_service_hours, completed_class_sessions, final_compliance_pct"
          - "if this is the last non-WAIVED assignment and gates pass, bubble DiversionAgreement -> COMPLETED"
      - from: ASSIGNED
        to: WAIVED
        trigger: "POST /service-assignments/{id}/waive"
        actor: Judge
        preconditions:
          - "owning DiversionAgreement.status == IN_PROGRESS"
        side_effects:
          - "recompute DiversionAgreement.assigned_service_hours (this assignment's required_hours drops out)"
      - from: IN_PROGRESS
        to: WAIVED
        trigger: "POST /service-assignments/{id}/waive"
        actor: Judge
        preconditions:
          - "owning DiversionAgreement.status == IN_PROGRESS"
        side_effects:
          - "recompute DiversionAgreement.assigned_service_hours (this assignment's required_hours drops out)"

  - entity: LedgerAccount
    initial_state: PROVISIONAL
    terminal_states: [CLOSED]
    transitions:
      - from: PROVISIONAL
        to: ASSESSED
        trigger: "cascade from Case ARRAIGNED -> DIVERSION_GRANTED"
        actor: system
        preconditions:
          - "owning Case transitioning to DIVERSION_GRANTED"
        side_effects:
          - "assessed_amount recomputed via fine_assessment variant=final"
      - from: ASSESSED
        to: SETTLED
        trigger: "system bubble-up on POST /ledger-accounts/{id}/payments"
        actor: system
        preconditions:
          - "balance == 0 after applying the payment waterfall"
        side_effects:
          - "any ACTIVE InstallmentPlan -> PAID_OFF"
      - from: SETTLED
        to: ASSESSED
        trigger: "system on POST /payments/{id}/reverse"
        actor: system
        preconditions:
          - "balance > 0 after the reversal restores collected_amount"
        side_effects:
          - "recompute balance"
        note: "Compensation edge: reversing a payment that had settled the account re-opens it."
      - from: SETTLED
        to: CLOSED
        trigger: "cascade from Case COMPLIED -> DISMISSED"
        actor: system
        preconditions:
          - "owning Case transitioning to DISMISSED"
        side_effects:
          - "account frozen; further payments rejected with ERR_ACCOUNT_CLOSED"

  - entity: InstallmentPlan
    initial_state: ACTIVE
    terminal_states: [PAID_OFF, SUPERSEDED]
    transitions:
      - from: ACTIVE
        to: DELINQUENT
        trigger: "cascade from Case DIVERSION_GRANTED -> FAILED_TO_COMPLY"
        actor: system
        preconditions:
          - "owning Case transitioning to FAILED_TO_COMPLY"
        side_effects:
          - "none beyond status change"
      - from: DELINQUENT
        to: ACTIVE
        trigger: "cascade from Case FAILED_TO_COMPLY -> DIVERSION_GRANTED (reinstate)"
        actor: system
        preconditions:
          - "owning Case transitioning to DIVERSION_GRANTED via reinstatement"
        side_effects:
          - "none beyond status change"
      - from: ACTIVE
        to: PAID_OFF
        trigger: "system bubble-up when LedgerAccount.status becomes SETTLED"
        actor: system
        preconditions:
          - "LedgerAccount.balance == 0"
        side_effects:
          - "none beyond status change"
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "POST /ledger-accounts/{id}/installment-plans (a superseding plan is created)"
        actor: Cashier
        preconditions:
          - "a prior InstallmentPlan on the same LedgerAccount is in status ACTIVE"
        side_effects:
          - "prior plan SUPERSEDED; new plan created ACTIVE; LedgerAccount.version incremented by 1"

  - entity: Warrant
    initial_state: ISSUED
    terminal_states: [RECALLED]
    transitions:
      - from: ISSUED
        to: RECALLED
        trigger: "cascade from Case FAILED_TO_COMPLY -> DIVERSION_GRANTED (reinstate)"
        actor: system
        preconditions:
          - "owning Case transitioning to DIVERSION_GRANTED via reinstatement"
        side_effects:
          - "none beyond status change"

  - entity: Arraignment
    initial_state: SCHEDULED
    terminal_states: [HELD]
    transitions:
      - from: SCHEDULED
        to: HELD
        trigger: "POST /arraignments/{id}/plea"
        actor: Defendant
        preconditions:
          - "plea in {GUILTY, NOT_GUILTY, NO_CONTEST}"
        side_effects:
          - "record plea; drive owning Case DOCKETED -> ARRAIGNED"

  - entity: ExpungementReferral
    initial_state: PENDING
    terminal_states: [SUBMITTED]
    transitions:
      - from: PENDING
        to: SUBMITTED
        trigger: "POST /expungement-referrals/{id}/submit"
        actor: CourtClerk
        preconditions:
          - "owning Case.status == DISMISSED (else ERR_INVALID_STATE)"
        side_effects:
          - "none beyond status change"

# =====================================================================
# §1.2.1 Concurrency Rules
# =====================================================================
concurrency_rules:
  - rule_id: installment-plan-create-stale-account
    parent_entity: LedgerAccount
    write_endpoint: "POST /ledger-accounts/{id}/installment-plans"
    occ_field: "expected_ledger_account_version"
    description: |
      Creating a new InstallmentPlan against a LedgerAccount whose version has
      advanced since the client last observed it is rejected. A new plan
      legitimately supersedes a prior ACTIVE plan (re-negotiated schedule), so a
      second create observing the same account state would itself succeed under
      the product rules; the OCC version guard reduces it to a stale-version
      check. Payment application and prior plan creation each bump the account
      version, so a client acting on a stale view is rejected.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =====================================================================
# §1.3 Calculation Rules Table
# =====================================================================
calculations:
  - name: fine_assessment
    trigger: "provisional on Case DOCKETED->ARRAIGNED (plea); final on Case ARRAIGNED->DIVERSION_GRANTED (grant)"
    algorithm: tiered_pricing
    formula: |
      # subtotal over the case's charges
      # provisional: subtotal = sum(charge.base_fine_amount)
      # final:       subtotal = sum(charge.base_fine_amount * SEVERITY_MULTIPLIER[charge.severity])
      subtotal = sum(fine(charge) for charge in case.charges)   # charges sorted by created_at ASC (order-independent sum)
      # tier selection is by the SAME subtotal that is being surcharged (single average rate on whole subtotal)
      if subtotal <= 100:      rate = 0.20
      elif subtotal <= 500:    rate = 0.30
      else:                    rate = 0.35
      surcharge = min(round(rate * subtotal, 2), SURCHARGE_CAP)
      assessed = subtotal + COURT_FEE + surcharge
      # final variant additionally adds the DiversionAgreement.program_fee
      if variant == "final": assessed = assessed + program_fee
    input_set: "All Charge rows of the case (no status filter; charges are immutable once created)"
    constants:
      COURT_FEE: 50.00
      SURCHARGE_TIER_1_MAX: 100.00
      SURCHARGE_TIER_1_RATE: 0.20
      SURCHARGE_TIER_2_MAX: 500.00
      SURCHARGE_TIER_2_RATE: 0.30
      SURCHARGE_TIER_3_RATE: 0.35
      SURCHARGE_CAP: 150.00
      SEVERITY_MULTIPLIER_INFRACTION: 1.0
      SEVERITY_MULTIPLIER_MISDEMEANOR: 1.5
    precision: "2 decimal places, round_half_up; surcharge rounded before the cap min()"
    variants:
      - name: provisional
        when: "at plea entry, before diversion is granted (LedgerAccount PROVISIONAL)"
        difference: "fine per charge is base_fine_amount with NO severity multiplier; program_fee excluded"
      - name: final
        when: "at diversion grant (LedgerAccount ASSESSED)"
        difference: "fine per charge is base_fine_amount * SEVERITY_MULTIPLIER[severity]; program_fee added"

  - name: installment_schedule
    trigger: "POST /ledger-accounts/{id}/installment-plans"
    algorithm: waterfall_allocation
    formula: |
      total_cents = round(LedgerAccount.balance * 100)       # balance at plan creation
      n = num_installments
      base_cents = floor(total_cents / n)                    # per-installment FLOOR to the cent
      installment_amount = base_cents / 100
      remainder_cents = total_cents - base_cents * n         # 0..n-1 cents
      final_installment_amount = (base_cents + remainder_cents) / 100   # final installment absorbs remainder
      next_due_date = now + 30 days
      # ORDER PINNED: floor each of the first n-1 installments to the cent, then the FINAL
      # installment absorbs the whole rounding remainder (NOT round-half-up per installment).
    input_set: "Single LedgerAccount.balance snapshot at creation"
    constants:
      INSTALLMENT_COUNT_MIN: 2
      INSTALLMENT_COUNT_MAX: 12
      INSTALLMENT_MIN_BALANCE: 100.00
      INSTALLMENT_INTERVAL_DAYS: 30
    precision: "integer cents; floor on the per-installment amount, remainder to the final installment"

  - name: payment_waterfall
    trigger: "POST /ledger-accounts/{id}/payments"
    algorithm: waterfall_allocation
    formula: |
      # Outstanding per bucket at payment time, filled in this fixed order:
      #   1 fines, 2 court_fee, 3 surcharge, 4 program_fee
      remaining = amount
      for bucket in [fines, court_fee, surcharge, program_fee]:
          take = min(remaining, outstanding[bucket])
          allocated[bucket] += take
          remaining -= take
      # if remaining > 0 after all buckets are full -> ERR_OVERPAYMENT (amount exceeds balance)
      collected_amount = sum(p.amount for p in account.payments if not p.reversed)
      balance = assessed_amount - collected_amount
    input_set: "Account outstanding buckets derived from assessed_amount and non-reversed Payments"
    constants: {}
    precision: "2 decimal places, round_half_up; buckets filled fully in order before overflow"

  - name: compliance_percentage
    trigger: "recomputed on progress logging, verify-completion, and payment application"
    algorithm: weighted_scoring
    formula: |
      svc_num  = (provisional: sum(a.completed_hours for a in assignments if a.status in {IN_PROGRESS, COMPLETED} and a.status != WAIVED))
                 (final:       sum(a.completed_hours for a in assignments if a.status == COMPLETED))
      svc = min(1.0, svc_num / mandated_service_hours) if mandated_service_hours > 0 else 1.0
      cls_num  = (provisional: count(a for a in assignments if a.assignment_type == EDUCATION_CLASS and a.status in {IN_PROGRESS, COMPLETED}))
                 (final:       count(a for a in assignments if a.assignment_type == EDUCATION_CLASS and a.status == COMPLETED))
      cls = min(1.0, cls_num / required_class_sessions) if required_class_sessions > 0 else 1.0
      fin = min(1.0, LedgerAccount.collected_amount / LedgerAccount.assessed_amount) if assessed_amount > 0 else 1.0
      pct = round(100 * (WEIGHT_SERVICE*svc + WEIGHT_CLASS*cls + WEIGHT_FINANCIAL*fin), 2)
    input_set: "ServiceAssignments of the agreement (status-filtered per variant) plus the case's LedgerAccount"
    constants:
      WEIGHT_SERVICE: 0.5
      WEIGHT_CLASS: 0.3
      WEIGHT_FINANCIAL: 0.2
    precision: "2 decimal places, round_half_up"
    variants:
      - name: provisional
        when: "provisional_compliance_pct field"
        difference: "service numerator counts logged hours on assignments in {IN_PROGRESS, COMPLETED}; class numerator counts {IN_PROGRESS, COMPLETED}"
      - name: final
        when: "final_compliance_pct field; gates COMPLETED transition"
        difference: "service and class numerators count only COMPLETED (verified) assignments"

  - name: reinstatement_amnesty_adjustment
    trigger: "POST /cases/{id}/reinstate"
    algorithm: threshold
    formula: |
      # LATE_PENALTY was added to assessed_amount when the warrant issued.
      waived = round(LATE_PENALTY * amnesty.penalty_waiver_pct, 2)
      assessed_amount = assessed_amount - waived + amnesty.reinstatement_fee
      balance = assessed_amount - collected_amount
    input_set: "Referenced AmnestyProgram and the account's current assessed_amount"
    constants:
      LATE_PENALTY: 75.00
    precision: "2 decimal places, round_half_up"

# Global constants referenced across tables
constants:
  FIRST_OFFENDER_MAX_PRIOR: 1
  ARRAIGNMENT_WINDOW_DAYS: 30
  DEFAULT_CLOCK_UTC: "2026-03-01T00:00:00Z"

# =====================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =====================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "acting role permitted for this operation per §1.7"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "every resource named in the path exists, validated left-to-right"
    error_id: ERR_CASE_NOT_FOUND
    http_status: 404
    applies_to: "all path-parameterized endpoints (resource-specific NOT_FOUND error id per §1.6)"
  - priority: 4
    category: state
    check: "target resource is in a state that permits the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 4
    category: state
    check: "payment/plan targets an account not in CLOSED state"
    error_id: ERR_ACCOUNT_CLOSED
    http_status: 409
    applies_to: "POST /ledger-accounts/{id}/payments, POST /ledger-accounts/{id}/installment-plans"
  - priority: 4
    category: state
    check: "plea not already recorded on the arraignment"
    error_id: ERR_INVALID_PLEA
    http_status: 422
    applies_to: "POST /arraignments/{id}/plea"
  - priority: 4
    category: state
    check: "payment not already reversed"
    error_id: ERR_PAYMENT_ALREADY_REVERSED
    http_status: 409
    applies_to: "POST /payments/{id}/reverse"
  - priority: 5
    category: state
    check: "expected_ledger_account_version matches LedgerAccount.version (OCC)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /ledger-accounts/{id}/installment-plans"
  - priority: 6
    category: business_referential
    check: "Defendant.prior_diversion_count < FIRST_OFFENDER_MAX_PRIOR"
    error_id: ERR_NOT_FIRST_OFFENDER
    http_status: 422
    applies_to: "POST /cases/{id}/diversion-agreements"
  - priority: 6
    category: business_referential
    check: "at least one Charge on the case is diversion-eligible; assignment_type matches ServiceSite.site_type"
    error_id: ERR_CHARGE_NOT_ELIGIBLE
    http_status: 422
    applies_to: "POST /cases/{id}/diversion-agreements, POST /diversion-agreements/{id}/service-assignments"
  - priority: 7
    category: business_temporal
    check: "now <= Case.arraignment_deadline"
    error_id: ERR_ARRAIGNMENT_DEADLINE_PASSED
    http_status: 422
    applies_to: "POST /arraignments/{id}/plea"
  - priority: 7
    category: business_temporal
    check: "AmnestyProgram active_from <= now < active_to (upper bound exclusive)"
    error_id: ERR_AMNESTY_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /cases/{id}/reinstate"
  - priority: 7
    category: business_temporal
    check: "now > DiversionAgreement.program_deadline before a warrant may issue"
    error_id: ERR_DEADLINE_NOT_PASSED
    http_status: 422
    applies_to: "POST /cases/{id}/warrant"
  - priority: 8
    category: business_safety
    check: "verifier X-User-ID differs from ServiceAssignment.assigned_by_officer_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /service-assignments/{id}/verify-completion"
  - priority: 8
    category: business_safety
    check: "DiversionAgreement.status == COMPLETED before the case is dismissed"
    error_id: ERR_DIVERSION_NOT_COMPLETE
    http_status: 409
    applies_to: "POST /cases/{id}/dismiss"
  - priority: 8
    category: business_safety
    check: "LedgerAccount.status == SETTLED before a diversion may complete"
    error_id: ERR_LEDGER_NOT_SETTLED
    http_status: 409
    applies_to: "POST /service-assignments/{id}/verify-completion"
  - priority: 8
    category: business_safety
    check: "completed_hours >= required_hours before an assignment may be verified"
    error_id: ERR_ASSIGNMENT_NOT_VERIFIABLE
    http_status: 409
    applies_to: "POST /service-assignments/{id}/verify-completion"
  - priority: 9
    category: business_constraint
    check: "hearing's buffer-expanded interval does not overlap another hearing in the same courtroom"
    error_id: ERR_COURTROOM_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /cases/{id}/arraignments"
  - priority: 9
    category: business_constraint
    check: "number of ServiceAssignments overlapping in time at the site stays <= ServiceSite.concurrent_capacity"
    error_id: ERR_SERVICE_SITE_AT_CAPACITY
    http_status: 409
    applies_to: "POST /diversion-agreements/{id}/service-assignments"
  - priority: 9
    category: business_constraint
    check: "INSTALLMENT_COUNT_MIN <= num_installments <= INSTALLMENT_COUNT_MAX"
    error_id: ERR_INVALID_INSTALLMENT_COUNT
    http_status: 422
    applies_to: "POST /ledger-accounts/{id}/installment-plans"
  - priority: 9
    category: business_constraint
    check: "LedgerAccount.balance >= INSTALLMENT_MIN_BALANCE to qualify for a plan"
    error_id: ERR_INSTALLMENT_MINIMUM_NOT_MET
    http_status: 422
    applies_to: "POST /ledger-accounts/{id}/installment-plans"
  - priority: 10
    category: business_fiscal
    check: "payment amount does not exceed the account's outstanding balance"
    error_id: ERR_OVERPAYMENT
    http_status: 422
    applies_to: "POST /ledger-accounts/{id}/payments"
  - priority: 11
    category: existence
    check: "request body field types and enum membership are valid; required fields present"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all write endpoints"

# =====================================================================
# §1.5 API Endpoint Table
# =====================================================================
endpoints:
  # ---- test-driving / config ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock. Startup default is 2026-03-01T00:00:00Z; before any call the clock reads exactly that default (never real wall-clock time)."
    roles: [CourtAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["logical clock advanced to to_iso8601"]
  - method: POST
    path: "/courtrooms"
    description: "Create a courtroom resource"
    roles: [CourtAdmin]
    code: 201
    input: [name, room_code, "changeover_buffer_minutes?"]
    output: Courtroom
    side_effects: []
  - method: GET
    path: "/courtrooms/{id}"
    description: "Fetch a courtroom"
    roles: [CourtClerk, Judge, ProbationOfficer, Cashier, Defendant, CourtAdmin]
    code: 200
    input: []
    output: Courtroom
    side_effects: []
  - method: POST
    path: "/service-sites"
    description: "Create a community-service / education-class site"
    roles: [CourtAdmin]
    code: 201
    input: [name, site_type, concurrent_capacity]
    output: ServiceSite
    side_effects: []
  - method: GET
    path: "/service-sites/{id}"
    description: "Fetch a service site"
    roles: [CourtClerk, Judge, ProbationOfficer, Cashier, Defendant, CourtAdmin]
    code: 200
    input: []
    output: ServiceSite
    side_effects: []
  - method: POST
    path: "/amnesty-programs"
    description: "Create an amnesty program window"
    roles: [CourtAdmin]
    code: 201
    input: [name, penalty_waiver_pct, reinstatement_fee, active_from, active_to]
    output: AmnestyProgram
    side_effects: []

  # ---- defendants ----
  - method: POST
    path: "/defendants"
    description: "Register a defendant"
    roles: [CourtClerk]
    code: 201
    input: [full_name, date_of_birth, email, "prior_diversion_count?"]
    output: Defendant
    side_effects: []
  - method: GET
    path: "/defendants/{id}"
    description: "Fetch a defendant"
    roles: [CourtClerk, Judge, ProbationOfficer, Cashier, Defendant, CourtAdmin]
    code: 200
    input: []
    output: Defendant
    side_effects: []
  - method: GET
    path: "/defendants/{id}/cases"
    description: "List cases for a defendant (reverse of Case.defendant_id)"
    roles: [CourtClerk, Judge, ProbationOfficer, Cashier, Defendant, CourtAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: Case[]
    side_effects: []

  # ---- cases & charges ----
  - method: POST
    path: "/cases"
    description: "Docket a citation into a new case (DOCKETED); computes arraignment_deadline"
    roles: [CourtClerk]
    code: 201
    input: [defendant_id, citation_number, offense_date]
    output: Case
    side_effects: ["set arraignment_deadline = offense_date 00:00:00Z + ARRAIGNMENT_WINDOW_DAYS"]
  - method: GET
    path: "/cases/{id}"
    description: "Fetch a case"
    roles: [CourtClerk, Judge, ProbationOfficer, Cashier, Defendant, CourtAdmin]
    code: 200
    input: []
    output: Case
    side_effects: []
  - method: POST
    path: "/cases/{id}/charges"
    description: "Add a charge to a case"
    roles: [CourtClerk]
    code: 201
    input: [offense_code, severity, base_fine_amount, "is_diversion_eligible?"]
    output: Charge
    side_effects: []
  - method: GET
    path: "/cases/{id}/charges"
    description: "List charges of a case (reverse of Charge.case_id)"
    roles: [CourtClerk, Judge, ProbationOfficer, Cashier, Defendant, CourtAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: Charge[]
    side_effects: []

  # ---- arraignment & plea ----
  - method: POST
    path: "/cases/{id}/arraignments"
    description: "Schedule an arraignment in a courtroom; rejects buffer-overlapping bookings"
    roles: [CourtClerk]
    code: 201
    input: [courtroom_id, scheduled_start, scheduled_end]
    output: Arraignment
    side_effects: ["courtroom buffer-overlap check against existing hearings in the same room"]
  - method: GET
    path: "/arraignments/{id}"
    description: "Fetch an arraignment"
    roles: [CourtClerk, Judge, ProbationOfficer, Cashier, Defendant, CourtAdmin]
    code: 200
    input: []
    output: Arraignment
    side_effects: []
  - method: GET
    path: "/arraignments"
    description: "List arraignments filtered by case or courtroom (reverse of Arraignment.case_id and Arraignment.courtroom_id)"
    roles: [CourtClerk, Judge, ProbationOfficer, Cashier, Defendant, CourtAdmin]
    code: 200
    input: ["case_id?", "courtroom_id?", "limit?", "offset?"]
    output: Arraignment[]
    side_effects: []
  - method: POST
    path: "/arraignments/{id}/plea"
    description: "Enter the plea and hold the arraignment; drives Case -> ARRAIGNED and creates the provisional LedgerAccount"
    roles: [Defendant, Judge]
    code: 200
    input: [plea]
    output: Arraignment
    side_effects: ["Case DOCKETED->ARRAIGNED", "create LedgerAccount PROVISIONAL", "assessed_amount = fine_assessment(provisional)"]

  # ---- diversion ----
  - method: POST
    path: "/cases/{id}/diversion-agreements"
    description: "Grant pretrial diversion (first-offender gated); drives Case -> DIVERSION_GRANTED and finalizes the assessment"
    roles: [Judge]
    code: 201
    input: [mandated_service_hours, required_class_sessions, program_fee, program_deadline]
    output: DiversionAgreement
    side_effects: ["Case ARRAIGNED->DIVERSION_GRANTED", "LedgerAccount PROVISIONAL->ASSESSED", "assessed_amount = fine_assessment(final)"]
  - method: GET
    path: "/cases/{id}/diversion-agreements"
    description: "List diversion agreements of a case (reverse of DiversionAgreement.case_id)"
    roles: [CourtClerk, Judge, ProbationOfficer, Cashier, Defendant, CourtAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: DiversionAgreement[]
    side_effects: []
  - method: POST
    path: "/diversion-agreements/{id}/accept"
    description: "Defendant accepts the diversion terms; OFFERED -> IN_PROGRESS"
    roles: [Defendant]
    code: 200
    input: []
    output: DiversionAgreement
    side_effects: ["DiversionAgreement OFFERED->IN_PROGRESS"]

  # ---- service assignments ----
  - method: POST
    path: "/diversion-agreements/{id}/service-assignments"
    description: "Assign community-service / class work; rejects when the site's concurrent capacity would be exceeded"
    roles: [ProbationOfficer]
    code: 201
    input: [service_site_id, assignment_type, required_hours, session_start, session_end]
    output: ServiceAssignment
    side_effects: ["store assigned_by_officer_id = X-User-ID", "recompute DiversionAgreement.assigned_service_hours", "site capacity-overlap check"]
  - method: GET
    path: "/service-assignments/{id}"
    description: "Fetch a service assignment"
    roles: [CourtClerk, Judge, ProbationOfficer, Cashier, Defendant, CourtAdmin]
    code: 200
    input: []
    output: ServiceAssignment
    side_effects: []
  - method: GET
    path: "/service-assignments"
    description: "List service assignments filtered by diversion or site (reverse of ServiceAssignment.diversion_id and ServiceAssignment.service_site_id)"
    roles: [CourtClerk, Judge, ProbationOfficer, Cashier, Defendant, CourtAdmin]
    code: 200
    input: ["diversion_id?", "service_site_id?", "limit?", "offset?"]
    output: ServiceAssignment[]
    side_effects: []
  - method: POST
    path: "/service-assignments/{id}/progress"
    description: "Log hours toward an assignment; ASSIGNED -> IN_PROGRESS"
    roles: [ProbationOfficer]
    code: 200
    input: [hours_logged]
    output: ServiceAssignment
    side_effects: ["completed_hours += hours_logged", "recompute DiversionAgreement.provisional_compliance_pct"]
  - method: POST
    path: "/service-assignments/{id}/verify-completion"
    description: "Verify an assignment complete (segregation-of-duties enforced); may cascade the diversion and case to completion"
    roles: [ProbationOfficer]
    code: 200
    input: []
    output: ServiceAssignment
    side_effects: ["ServiceAssignment IN_PROGRESS->COMPLETED", "recompute completed_service_hours / final_compliance_pct", "cascade: DiversionAgreement->COMPLETED (if gates pass) -> Case->COMPLIED -> create ExpungementReferral PENDING"]
  - method: POST
    path: "/service-assignments/{id}/waive"
    description: "Waive an assignment; recomputes the agreement's assigned_service_hours (compensating action)"
    roles: [Judge]
    code: 200
    input: []
    output: ServiceAssignment
    side_effects: ["ServiceAssignment -> WAIVED", "recompute DiversionAgreement.assigned_service_hours"]

  # ---- financial ----
  - method: GET
    path: "/cases/{id}/ledger-account"
    description: "Fetch the case's ledger account (reverse of LedgerAccount.case_id; 1:1, array of 0-1)"
    roles: [CourtClerk, Judge, ProbationOfficer, Cashier, Defendant, CourtAdmin]
    code: 200
    input: []
    output: LedgerAccount[]
    side_effects: []
  - method: GET
    path: "/ledger-accounts/{id}"
    description: "Fetch a ledger account"
    roles: [CourtClerk, Judge, ProbationOfficer, Cashier, Defendant, CourtAdmin]
    code: 200
    input: []
    output: LedgerAccount
    side_effects: []
  - method: POST
    path: "/ledger-accounts/{id}/installment-plans"
    description: "Create an installment plan (OCC on LedgerAccount.version); supersedes a prior ACTIVE plan"
    roles: [Cashier]
    code: 201
    input: [num_installments, expected_ledger_account_version]
    output: InstallmentPlan
    side_effects: ["compute installment_amount / final_installment_amount via installment_schedule", "supersede prior ACTIVE plan -> SUPERSEDED", "increments LedgerAccount.version by 1"]
  - method: GET
    path: "/ledger-accounts/{id}/installment-plans"
    description: "List installment plans of an account (reverse of InstallmentPlan.ledger_account_id)"
    roles: [CourtClerk, Judge, ProbationOfficer, Cashier, Defendant, CourtAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: InstallmentPlan[]
    side_effects: []
  - method: POST
    path: "/ledger-accounts/{id}/payments"
    description: "Record a payment; waterfall-allocates across buckets and may settle the account"
    roles: [Cashier, Defendant]
    code: 201
    input: [amount]
    output: Payment
    side_effects: ["allocate via payment_waterfall", "collected_amount += amount", "recompute balance", "if balance==0: LedgerAccount ASSESSED->SETTLED and ACTIVE plan->PAID_OFF"]
  - method: GET
    path: "/ledger-accounts/{id}/payments"
    description: "List payments of an account (reverse of Payment.ledger_account_id)"
    roles: [CourtClerk, Judge, ProbationOfficer, Cashier, Defendant, CourtAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: Payment[]
    side_effects: []
  - method: POST
    path: "/payments/{id}/reverse"
    description: "Reverse a payment (compensating action); restores collected_amount and balance"
    roles: [Cashier]
    code: 200
    input: []
    output: Payment
    side_effects: ["Payment.reversed = true", "collected_amount -= amount", "recompute balance", "if balance>0: LedgerAccount SETTLED->ASSESSED"]

  # ---- compliance / warrant / amnesty / expungement ----
  - method: POST
    path: "/cases/{id}/dismiss"
    description: "Dismiss a complied case; increments the defendant's prior_diversion_count"
    roles: [Judge]
    code: 200
    input: []
    output: Case
    side_effects: ["Case COMPLIED->DISMISSED", "Defendant.prior_diversion_count += 1", "LedgerAccount SETTLED->CLOSED"]
  - method: POST
    path: "/cases/{id}/warrant"
    description: "Declare failure-to-comply and issue a warrant (deadline must have passed); cascades diversion default and plan delinquency"
    roles: [Judge]
    code: 201
    input: []
    output: Warrant
    side_effects: ["Case DIVERSION_GRANTED->FAILED_TO_COMPLY", "cascade DiversionAgreement->DEFAULTED", "cascade create Warrant ISSUED and demote InstallmentPlan ACTIVE->DELINQUENT", "add LATE_PENALTY to assessed_amount"]
  - method: GET
    path: "/cases/{id}/warrants"
    description: "List warrants of a case (reverse of Warrant.case_id)"
    roles: [CourtClerk, Judge, ProbationOfficer, Cashier, Defendant, CourtAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: Warrant[]
    side_effects: []
  - method: POST
    path: "/cases/{id}/reinstate"
    description: "Reinstate a failed case under an amnesty window; recalls the warrant, waives penalty, adds reinstatement fee, cycles the case back to DIVERSION_GRANTED"
    roles: [Judge]
    code: 200
    input: [amnesty_program_id]
    output: Case
    side_effects: ["Case FAILED_TO_COMPLY->DIVERSION_GRANTED", "DiversionAgreement DEFAULTED->IN_PROGRESS", "Warrant ISSUED->RECALLED", "reinstatement_amnesty_adjustment applied to assessed_amount", "InstallmentPlan DELINQUENT->ACTIVE"]
  - method: GET
    path: "/cases/{id}/expungement-referrals"
    description: "List expungement referrals of a case (reverse of ExpungementReferral.case_id)"
    roles: [CourtClerk, Judge, ProbationOfficer, Cashier, Defendant, CourtAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: ExpungementReferral[]
    side_effects: []
  - method: POST
    path: "/expungement-referrals/{id}/submit"
    description: "Submit an expungement referral (case must be DISMISSED); PENDING -> SUBMITTED"
    roles: [CourtClerk]
    code: 200
    input: []
    output: ExpungementReferral
    side_effects: ["ExpungementReferral PENDING->SUBMITTED"]

# =====================================================================
# §1.6 Error Code Catalog
# =====================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "acting role not permitted for the operation"
  - id: ERR_VALIDATION
    http: 400
    condition: "missing required field, wrong type, or invalid enum value"
  - id: ERR_DEFENDANT_NOT_FOUND
    http: 404
    condition: "referenced defendant does not exist"
  - id: ERR_CASE_NOT_FOUND
    http: 404
    condition: "referenced case does not exist"
  - id: ERR_CHARGE_NOT_FOUND
    http: 404
    condition: "referenced charge does not exist"
  - id: ERR_COURTROOM_NOT_FOUND
    http: 404
    condition: "referenced courtroom does not exist"
  - id: ERR_ARRAIGNMENT_NOT_FOUND
    http: 404
    condition: "referenced arraignment does not exist"
  - id: ERR_DIVERSION_NOT_FOUND
    http: 404
    condition: "referenced diversion agreement does not exist"
  - id: ERR_SERVICE_SITE_NOT_FOUND
    http: 404
    condition: "referenced service site does not exist"
  - id: ERR_SERVICE_ASSIGNMENT_NOT_FOUND
    http: 404
    condition: "referenced service assignment does not exist"
  - id: ERR_LEDGER_ACCOUNT_NOT_FOUND
    http: 404
    condition: "referenced ledger account does not exist"
  - id: ERR_PAYMENT_NOT_FOUND
    http: 404
    condition: "referenced payment does not exist"
  - id: ERR_AMNESTY_PROGRAM_NOT_FOUND
    http: 404
    condition: "referenced amnesty program does not exist"
  - id: ERR_EXPUNGEMENT_REFERRAL_NOT_FOUND
    http: 404
    condition: "referenced expungement referral does not exist"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "requested transition not allowed from the resource's current state"
  - id: ERR_ACCOUNT_CLOSED
    http: 409
    condition: "payment or plan attempted against a CLOSED ledger account"
  - id: ERR_INVALID_PLEA
    http: 422
    condition: "plea already recorded, or plea value not in {GUILTY, NOT_GUILTY, NO_CONTEST}"
  - id: ERR_PAYMENT_ALREADY_REVERSED
    http: 409
    condition: "reverse attempted on a payment already reversed"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_ledger_account_version does not match LedgerAccount.version"
  - id: ERR_NOT_FIRST_OFFENDER
    http: 422
    condition: "Defendant.prior_diversion_count >= FIRST_OFFENDER_MAX_PRIOR at diversion grant"
  - id: ERR_CHARGE_NOT_ELIGIBLE
    http: 422
    condition: "no diversion-eligible charge on the case, or assignment_type does not match the site's site_type"
  - id: ERR_ARRAIGNMENT_DEADLINE_PASSED
    http: 422
    condition: "plea attempted after Case.arraignment_deadline"
  - id: ERR_AMNESTY_WINDOW_CLOSED
    http: 422
    condition: "now is outside [active_from, active_to) of the referenced amnesty program"
  - id: ERR_DEADLINE_NOT_PASSED
    http: 422
    condition: "warrant requested while now <= DiversionAgreement.program_deadline"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "verifier X-User-ID equals the assignment's assigned_by_officer_id"
  - id: ERR_DIVERSION_NOT_COMPLETE
    http: 409
    condition: "dismiss attempted while the diversion agreement is not COMPLETED"
  - id: ERR_LEDGER_NOT_SETTLED
    http: 409
    condition: "diversion completion gate failed because LedgerAccount is not SETTLED"
  - id: ERR_ASSIGNMENT_NOT_VERIFIABLE
    http: 409
    condition: "verify attempted while completed_hours < required_hours"
  - id: ERR_COURTROOM_DOUBLE_BOOKED
    http: 409
    condition: "hearing's buffer-expanded interval overlaps another hearing in the same courtroom"
  - id: ERR_SERVICE_SITE_AT_CAPACITY
    http: 409
    condition: "adding the assignment would exceed the site's concurrent_capacity of time-overlapping sessions"
  - id: ERR_INVALID_INSTALLMENT_COUNT
    http: 422
    condition: "num_installments outside [INSTALLMENT_COUNT_MIN, INSTALLMENT_COUNT_MAX]"
  - id: ERR_INSTALLMENT_MINIMUM_NOT_MET
    http: 422
    condition: "LedgerAccount.balance < INSTALLMENT_MIN_BALANCE when creating a plan"
  - id: ERR_OVERPAYMENT
    http: 422
    condition: "payment amount exceeds the account's outstanding balance"

# =====================================================================
# §1.7 RBAC Matrix
# =====================================================================
roles:
  - name: CourtClerk
    description: "Dockets citations, adds charges, schedules arraignments, submits expungement referrals"
    identity: "opaque"
    exclusive_operations:
      - "POST /defendants"
      - "POST /cases"
      - "POST /cases/{id}/charges"
      - "POST /cases/{id}/arraignments"
      - "POST /expungement-referrals/{id}/submit"
    shared_operations: ["all GET reads"]
  - name: Judge
    description: "Enters/accepts pleas, grants diversion, waives assignments, dismisses, issues warrants, reinstates"
    identity: "opaque"
    exclusive_operations:
      - "POST /cases/{id}/diversion-agreements"
      - "POST /service-assignments/{id}/waive"
      - "POST /cases/{id}/dismiss"
      - "POST /cases/{id}/warrant"
      - "POST /cases/{id}/reinstate"
    shared_operations: ["POST /arraignments/{id}/plea (with Defendant)", "all GET reads"]
  - name: ProbationOfficer
    description: "Creates service assignments, logs progress, verifies completion (segregation-of-duties: creator != verifier)"
    identity: "opaque"
    exclusive_operations:
      - "POST /diversion-agreements/{id}/service-assignments"
      - "POST /service-assignments/{id}/progress"
      - "POST /service-assignments/{id}/verify-completion"
    shared_operations: ["all GET reads"]
  - name: Cashier
    description: "Creates installment plans, records and reverses payments"
    identity: "opaque"
    exclusive_operations:
      - "POST /ledger-accounts/{id}/installment-plans"
      - "POST /payments/{id}/reverse"
    shared_operations: ["POST /ledger-accounts/{id}/payments (with Defendant)", "all GET reads"]
  - name: Defendant
    description: "Acts on own case: enters plea, accepts diversion, makes payments"
    identity: "entity_backed:Defendant"
    exclusive_operations:
      - "POST /diversion-agreements/{id}/accept"
    shared_operations:
      - "POST /arraignments/{id}/plea (with Judge; X-User-ID must equal the case's defendant_id)"
      - "POST /ledger-accounts/{id}/payments (with Cashier; own account only)"
      - "all GET reads on own resources"
  - name: CourtAdmin
    description: "Manages courtrooms, service sites, amnesty programs, and the logical clock"
    identity: "opaque"
    exclusive_operations:
      - "POST /courtrooms"
      - "POST /service-sites"
      - "POST /amnesty-programs"
      - "POST /_clock/set_current_utc"
    shared_operations: ["all GET reads"]



