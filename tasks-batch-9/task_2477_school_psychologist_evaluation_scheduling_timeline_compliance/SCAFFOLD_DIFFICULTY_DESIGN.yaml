            - "The trigger returns HTTP 409 with error_id == ERR_REPORT_NOT_FINAL"
            - "The failure is NOT ERR_MEETING_STATE_INVALID or ERR_MEETING_NOT_DUE: the meeting is NOTICED and the clock equals scheduled_start_at, so priorities 8 and 22 are both satisfied"
            - "EligibilityMeeting.${m1}.status is still NOTICED and held_at == null"
            - "Evaluation.${eval1}.compliance_status is still ON_TRACK even though days_remaining == 10, because only compliance runs, exclusion cascades, holds and remedies write that dimension"
            - "Referral.${r1}.status is still CONSENTED (the hold's Referral -> COMPLETED cascade never fired)"

  - rule_id: resource_temporal_overlap
    instances:
      - name: psychologist_calendar_half_open_plus_travel_buffer
        grounds:
          - validations[priority=18]
          - errors.ERR_PSYCH_CALENDAR_CONFLICT
          - entities.InterpreterSession.fields.session_start_at
          - endpoints["POST /psych-services/interpreter-sessions"]
        distinguishing_aspect: |
          Interval semantics are HALF-OPEN [start, end) and the contended resource is a PSYCHOLOGIST's
          calendar, widened by a 15-minute TRAVEL_BUFFER_MINUTES only when the two sessions sit in different
          buildings. Same-building touching endpoints (10:00 end / 10:00 start) are therefore legal while a
          cross-building booking that merely comes within 15 minutes is rejected.
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; two buildings; one ACTIVE SSP psychologist covering BOTH buildings with weekly_capacity_points 20."
            - "Two INITIAL 1-domain referrals with interpreter_required = true (7 caseload points each, 14 total) — one at building 1, one at building 2 — both consented and both ASSIGNED to that psychologist."
            - "Session 1 on the building-1 evaluation runs 2026-09-10T09:00:00Z-10:00:00Z; session 2 on the same evaluation runs 10:00:00Z-11:00:00Z and is accepted because same-building endpoints may touch."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DistrictAdmin
            - call: "POST /psych-services/schools"
