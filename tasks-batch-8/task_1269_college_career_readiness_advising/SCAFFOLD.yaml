# =============================================================================
# Task 1269: College & Career Readiness Advising (district college & career center)
# Seed tables: entities, state machines, calculations, validations, endpoints,
# errors, RBAC. Difficulty target: beyond Expert band (dense coupling).
# =============================================================================

scenario: |
  1269. College & Career Readiness Advising (district college & career center):
  student plan & interest inventory, course-of-study alignment to pathway,
  college application milestone tracking & deadline reminders,
  letter-of-recommendation request routing, career-technical certification &
  work-based learning placement, senior-audit for graduation requirements,
  postsecondary enrollment outcome tracking, advisor caseload & equity monitoring

domain_name: college-career-readiness
api_prefix: /ccr

# =============================================================================
# Complexity Profile (§0.1–§0.4)
# =============================================================================
complexity_profile:
  primary_archetype: compliance_audit        # senior-audit graduation gating, SoD, equity monitoring
  secondary_archetype: temporal_windowing    # placement intervals, milestone deadlines
  complexity_layers:
    - optimistic_concurrency                 # OCC on Student.version (plan create) and Advisor.version (reassignments)
    - cascading_side_effects                 # site-capacity patch → placement termination → plan recompute → audit auto-flag
    - ops_run_checkpoint                     # POST /ccr/ops-runs sweeps milestones MISSED, regresses applications
    - rate_threshold_triggers                # caseload >= max, credits >= 24, site overlap capacity
  entity_topology: flat                      # peer entities under /ccr with FK links
  state_machine_shape: cyclic                # multiple revision/retake/reroute loops + Application's two independent state dimensions
  relationship_patterns:
    - one_to_many
    - self_referential                       # ApplicationMilestone.depends_on_milestone_id
    - cross_aggregate                        # plan↔pathway, audit↔enrollments, placement↔site
  role_model: segregation_of_duties          # certifying auditor must differ from assigned advisor
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# common_fields: true  ⇒  id (server-minted UUID, identity only), created_at,
# updated_at (ISO 8601 UTC, 3 fractional digits), version (integer from 1, +1
# per mutation) are present on every entity below.
# =============================================================================
entities:
  - name: Student
    parent: null
    common_fields: true
    fields:
      - { name: student_ref, type: string, source: input, description: "District SIS reference; unique across all students" }
      - { name: full_name, type: string, source: input, description: "Student legal name" }
      - { name: grade_level, type: integer, source: input, description: "9|10|11|12", constraints: "integer in [9,12]" }
      - { name: demographic_group, type: enum, source: input, description: "GROUP_A | GROUP_B | GROUP_C | GROUP_D — equity monitoring cohort" }
      - { name: first_generation, type: boolean, source: input, description: "First-generation college aspirant flag", default: false }
      - { name: status, type: enum, source: system, description: "ENROLLED | GRADUATED | TRANSFERRED_OUT | WITHDRAWN", default: ENROLLED }
      - { name: assigned_advisor_id, type: string, source: system, description: "FK -> Advisor.id; set by selector at creation, changed by reassignments" }
      - { name: graduated_at, type: datetime, source: system, description: "Set on GRADUATED transition; null otherwise", default: null }

  - name: Advisor
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Advisor name" }
      - { name: email, type: string, source: input, description: "Advisor email; unique" }
      - { name: max_caseload, type: integer, source: input, description: "Maximum ENROLLED advisees", constraints: ">= 1" }
      - { name: status, type: enum, source: system, description: "ACTIVE | INACTIVE", default: ACTIVE }
      - { name: active_caseload_count, type: integer, source: computed, description: "Count of assigned Students with status ENROLLED" }
      - { name: caseload_load_simple, type: number, source: computed, description: "SIMPLE variant of caseload load = active_caseload_count" }
      - { name: caseload_load_weighted, type: number, source: computed, description: "WEIGHTED variant: per-advisee weight sum (see calculations.caseload_load)" }
      - { name: equity_gap_index, type: number, source: computed, description: "Demographic-mix divergence vs district (see calculations.caseload_equity_gap_index)" }
      - { name: target_caseload, type: number, source: computed, description: "District-proportional target (see calculations.district_target_caseload)" }

  - name: Teacher
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Teacher name" }
      - { name: department, type: string, source: input, description: "Department label" }
      - { name: max_active_letters, type: integer, source: input, description: "Max open letter requests (REQUESTED+ACCEPTED)", constraints: ">= 1" }
      - { name: open_request_count, type: integer, source: computed, description: "Count of RecommendationRequests status in {REQUESTED, ACCEPTED}" }
      - { name: status, type: enum, source: system, description: "ACTIVE | INACTIVE", default: ACTIVE }

  - name: Pathway
    parent: null
    common_fields: true
    fields:
      - { name: pathway_code, type: string, source: input, description: "Unique pathway code (e.g. STEM, HEALTH)" }
      - { name: name, type: string, source: input, description: "Display name" }
      - { name: required_course_codes, type: array, source: input, description: "Course codes a completer must pass; may be empty" }
      - { name: required_certification_code, type: string, source: input, description: "CTE cert code required; null means none required", default: null }
      - { name: required_work_hours, type: integer, source: input, description: "WBL hours required; 0 means none", default: 0 }
      - { name: status, type: enum, source: system, description: "ACTIVE | RETIRED", default: ACTIVE }

  - name: StudentPlan
    parent: null
    common_fields: true
    fields:
      - { name: student_id, type: string, source: system, description: "FK -> Student.id; from path" }
      - { name: pathway_id, type: string, source: input, description: "FK -> Pathway.id; plan's course-of-study target" }
      - { name: interest_inventory, type: array, source: input, description: "Entries {interest_code, score} with integer score 1..5", default: [] }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | REVISING | SUPERSEDED", default: DRAFT }
      - { name: alignment_provisional_pct, type: number, source: computed, description: "PROVISIONAL variant of plan_alignment (includes PLANNED/ENROLLED)" }
      - { name: alignment_official_pct, type: number, source: computed, description: "OFFICIAL variant of plan_alignment (COMPLETED only)" }
      - { name: milestone_pct, type: number, source: computed, description: "STRICT milestone completion across student's non-WITHDRAWN applications" }
      - { name: milestone_pct_lenient, type: number, source: computed, description: "LENIENT milestone completion (WAIVED counts as completed); display-only variant" }
      - { name: wbl_hours_pct, type: number, source: computed, description: "Verified WBL hours vs pathway.required_work_hours, capped 100" }
      - { name: certification_points, type: number, source: computed, description: "0 | 50 | 100 per calculations.certification_points" }
      - { name: readiness_provisional, type: number, source: computed, description: "Readiness using alignment_provisional_pct" }
      - { name: readiness_official, type: number, source: computed, description: "Readiness using alignment_official_pct" }

  - name: CourseEnrollment
    parent: null
    common_fields: true
    fields:
      - { name: student_id, type: string, source: system, description: "FK -> Student.id; from path" }
      - { name: plan_id, type: string, source: input, description: "FK -> StudentPlan.id; must be the student's ACTIVE plan at creation" }
      - { name: course_code, type: string, source: input, description: "Course catalog code" }
      - { name: term, type: string, source: input, description: "Term label e.g. 2026-FALL" }
      - { name: credits, type: number, source: input, description: "Credit hours", constraints: "> 0, quarter-credit granularity" }
      - { name: grade, type: enum, source: system, description: "A | B | C | PASS on COMPLETED; F on FAILED; null otherwise", default: null }
      - { name: status, type: enum, source: system, description: "PLANNED | ENROLLED | COMPLETED | FAILED | DROPPED", default: PLANNED }
      - { name: counts_toward_pathway, type: boolean, source: computed, description: "course_code in plan's pathway.required_course_codes (recomputed on plan pathway change)" }

  - name: Application
    parent: null
    common_fields: true
    fields:
      - { name: student_id, type: string, source: system, description: "FK -> Student.id; from path" }
      - { name: college_name, type: string, source: input, description: "Institution name" }
      - { name: program_type, type: enum, source: input, description: "COLLEGE_4YR | COLLEGE_2YR | TRADE_PROGRAM" }
      - { name: deadline_at, type: datetime, source: input, description: "Application deadline (must be > now at creation)" }
      - { name: submission_status, type: enum, source: system, description: "DRAFT | READY | SUBMITTED | CONFIRMED | WITHDRAWN", default: DRAFT }
      - { name: decision_status, type: enum, source: system, description: "NONE | PENDING | ACCEPTED | WAITLISTED | DENIED | DEFERRED — independent dimension", default: NONE }
      - { name: submitted_at, type: datetime, source: system, description: "Set on SUBMITTED; null otherwise", default: null }
      - { name: decided_at, type: datetime, source: system, description: "Set when decision leaves PENDING first time; null otherwise", default: null }

  - name: ApplicationMilestone
    parent: null
    common_fields: true
    fields:
      - { name: application_id, type: string, source: system, description: "FK -> Application.id; from path" }
      - { name: kind, type: enum, source: input, description: "ESSAY | TRANSCRIPT | FEE_PAYMENT | TEST_SCORES | REC_LETTERS | FAFSA | INTERVIEW | OTHER" }
      - { name: required, type: boolean, source: input, description: "Required milestones gate the DRAFT->READY transition", default: true }
      - { name: due_at, type: datetime, source: input, description: "Deadline; must be > now at creation" }
      - { name: depends_on_milestone_id, type: string, source: input, description: "FK -> ApplicationMilestone.id; same-application prerequisite; null = none", default: null }
      - { name: status, type: enum, source: system, description: "PENDING | READY | COMPLETED | MISSED | WAIVED (PENDING until dependency COMPLETED)", default: PENDING }
      - { name: completed_at, type: datetime, source: system, description: "Set on COMPLETED", default: null }
      - { name: last_reminder_sent_at, type: datetime, source: system, description: "Last ops-run reminder stamp", default: null }

  - name: RecommendationRequest
    parent: null
    common_fields: true
    fields:
      - { name: student_id, type: string, source: system, description: "FK -> Student.id; from path" }
      - { name: teacher_id, type: string, source: input, description: "FK -> Teacher.id; routed teacher (changes on reroute)" }
      - { name: application_id, type: string, source: input, description: "FK -> Application.id; optional link, must belong to same student", default: null }
      - { name: due_at, type: datetime, source: input, description: "Letter due date; must be > now at creation and on reroute" }
      - { name: status, type: enum, source: system, description: "REQUESTED | ACCEPTED | DECLINED | SUBMITTED | VERIFIED | WITHDRAWN", default: REQUESTED }
      - { name: reroute_count, type: integer, source: system, description: "Number of DECLINED -> REQUESTED reroutes", default: 0 }
      - { name: submitted_at, type: datetime, source: system, description: "Set on SUBMITTED", default: null }
      - { name: verified_at, type: datetime, source: system, description: "Set on VERIFIED", default: null }

  - name: Certification
    parent: null
    common_fields: true
    fields:
      - { name: student_id, type: string, source: system, description: "FK -> Student.id; from path" }
      - { name: cert_code, type: string, source: input, description: "CTE certification code" }
      - { name: status, type: enum, source: system, description: "REGISTERED | EXAM_SCHEDULED | PASSED | FAILED | CANCELLED", default: REGISTERED }
      - { name: exam_at, type: datetime, source: system, description: "Set when EXAM_SCHEDULED (from transition payload)", default: null }
      - { name: earned_at, type: datetime, source: system, description: "Set on PASSED", default: null }
      - { name: retake_count, type: integer, source: system, description: "Number of FAILED -> EXAM_SCHEDULED retakes", default: 0 }

  - name: PlacementSite
    parent: null
    common_fields: true
    fields:
      - { name: site_code, type: string, source: input, description: "Unique site code" }
      - { name: name, type: string, source: input, description: "Employer/site name" }
      - { name: max_concurrent_placements, type: integer, source: input, description: "Aggregate capacity: max overlapping CONFIRMED/ACTIVE placements", constraints: ">= 1" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED", default: ACTIVE }
      - { name: confirmed_active_count, type: integer, source: computed, description: "Display count of placements status in {CONFIRMED, ACTIVE} (capacity enforcement is interval-based, see calculations.site_overlap_max)" }

  - name: Placement
    parent: null
    common_fields: true
    fields:
      - { name: student_id, type: string, source: system, description: "FK -> Student.id; from path" }
      - { name: site_id, type: string, source: input, description: "FK -> PlacementSite.id" }
      - { name: term_start, type: datetime, source: input, description: "Half-open interval start (inclusive)" }
      - { name: term_end, type: datetime, source: input, description: "Half-open interval end (exclusive); must be > term_start" }
      - { name: hours_per_week, type: number, source: input, description: "Scheduled weekly hours", constraints: "> 0" }
      - { name: status, type: enum, source: system, description: "OFFERED | CONFIRMED | ACTIVE | COMPLETED | DECLINED | TERMINATED", default: OFFERED }
      - { name: hours_logged, type: number, source: system, description: "Verified hours; set on COMPLETED from payload, else 0", default: 0 }
      - { name: terminated_reason, type: string, source: system, description: "MANUAL | SITE_CAPACITY_REDUCTION | STUDENT_WITHDRAWN; null unless TERMINATED", default: null }

  - name: SeniorAudit
    parent: null
    common_fields: true
    fields:
      - { name: student_id, type: string, source: system, description: "FK -> Student.id; from path" }
      - { name: auditor_advisor_id, type: string, source: input, description: "FK -> Advisor.id; certifying auditor; MUST differ from student's assigned_advisor_id at certify time" }
      - { name: status, type: enum, source: system, description: "DRAFT | IN_REVIEW | FLAGGED | CERTIFIED", default: DRAFT }
      - { name: flag_reason, type: string, source: system, description: "Required on IN_REVIEW->FLAGGED; AUTO_DRIFT when system flags a CERTIFIED audit", default: null }
      - { name: required_credits, type: number, source: system, description: "Graduation requirement snapshot = 24", default: 24 }
      - { name: credits_earned, type: number, source: computed, description: "Sum credits of student's COMPLETED enrollments; refreshes while audit not CERTIFIED" }
      - { name: pathway_requirements_met, type: boolean, source: computed, description: "Every required course code of ACTIVE plan's pathway has a COMPLETED enrollment" }
      - { name: certification_requirement_met, type: boolean, source: computed, description: "Pathway required cert PASSED (true when pathway requires none)" }
      - { name: work_hours_met, type: boolean, source: computed, description: "Sum COMPLETED placement hours >= pathway.required_work_hours" }
      - { name: certified_at, type: datetime, source: system, description: "Set on CERTIFIED", default: null }

  - name: OutcomeRecord
    parent: null
    common_fields: true
    fields:
      - { name: student_id, type: string, source: system, description: "FK -> Student.id; from path; student must be GRADUATED" }
      - { name: outcome_type, type: enum, source: input, description: "ENROLLED_4YR | ENROLLED_2YR | APPRENTICESHIP | EMPLOYED | MILITARY | OTHER" }
      - { name: institution_name, type: string, source: input, description: "Postsecondary institution or employer", default: null }
      - { name: reported_at, type: datetime, source: input, description: "When the outcome was reported" }
      - { name: verification_status, type: enum, source: system, description: "UNVERIFIED | VERIFIED | DISPUTED", default: UNVERIFIED }
      - { name: verified_at, type: datetime, source: system, description: "Set on VERIFIED", default: null }

  - name: OpsRun
    parent: null
    common_fields: true
    fields:
      - { name: run_index, type: integer, source: system, description: "Monotonic sweep counter starting at 1" }
      - { name: executed_at, type: datetime, source: system, description: "Logical clock value at execution" }
      - { name: milestones_marked_missed, type: integer, source: computed, description: "Milestones flipped to MISSED by this run" }
      - { name: applications_regressed, type: integer, source: computed, description: "READY applications regressed to DRAFT by this run" }
      - { name: reminders_queued, type: integer, source: computed, description: "Milestones reminder-stamped by this run" }
      - { name: plans_recomputed, type: integer, source: computed, description: "ACTIVE/REVISING plans whose derived fields were recomputed" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Student
    initial_state: ENROLLED
    terminal_states: [GRADUATED, TRANSFERRED_OUT, WITHDRAWN]
    transitions:
      - from: ENROLLED
        to: GRADUATED
        trigger: "POST /ccr/students/{id}/graduate"
        actor: DistrictAdmin
        preconditions:
          - "A SeniorAudit for this student exists with status CERTIFIED (else ERR_NO_CERTIFIED_AUDIT)"
        side_effects:
          - "graduated_at = now; Student.version += 1"
          - "Each Application in {DRAFT, READY, SUBMITTED} -> WITHDRAWN (its own transition side effects fire, including milestone waiver)"
          - "Each RecommendationRequest in {REQUESTED, ACCEPTED} -> WITHDRAWN"
          - "Each Certification in {REGISTERED, EXAM_SCHEDULED} -> CANCELLED"
      - from: ENROLLED
        to: TRANSFERRED_OUT
        trigger: "POST /ccr/students/{id}/withdraw (payload reason=TRANSFERRED_OUT)"
        actor: DistrictAdmin
        preconditions: []
        side_effects:
          - "Student.version += 1; prior advisor active_caseload_count decremented"
          - "Applications in {DRAFT, READY, SUBMITTED} -> WITHDRAWN (milestone waiver cascades)"
          - "RecommendationRequests in {REQUESTED, ACCEPTED} -> WITHDRAWN"
          - "Placements in {OFFERED} -> DECLINED; in {CONFIRMED, ACTIVE} -> TERMINATED with terminated_reason=STUDENT_WITHDRAWN (plan recompute cascades)"
          - "Certifications in {REGISTERED, EXAM_SCHEDULED} -> CANCELLED"
      - from: ENROLLED
        to: WITHDRAWN
        trigger: "POST /ccr/students/{id}/withdraw (payload reason=WITHDRAWN)"
        actor: DistrictAdmin
        preconditions: []
        side_effects: ["Same cascade set as TRANSFERRED_OUT"]

  - entity: Advisor
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: INACTIVE
        trigger: "POST /ccr/advisors/{id}/deactivate"
        actor: DistrictAdmin
        preconditions:
          - "Every ENROLLED advisee can be rehomed: the advisor selector must return a target for each (else ERR_NO_ADVISOR_AVAILABLE and nothing changes)"
        side_effects:
          - "Each ENROLLED advisee is reassigned via selector (eligibility: Advisor.status=ACTIVE, id != this advisor, active_caseload_count < max_caseload; rank: active_caseload_count ASC, tie-break created_at ASC); each reassigned Student.version += 1"
          - "Advisor.version += 1; source active_caseload_count -> 0"
      - from: INACTIVE
        to: ACTIVE
        trigger: "POST /ccr/advisors/{id}/deactivate (payload reactivate=true)"
        actor: DistrictAdmin
        preconditions: []
        side_effects: ["Advisor.version += 1; no automatic student movement"]

  - entity: StudentPlan
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /ccr/plans/{id}/activate"
        actor: Advisor
        preconditions:
          - "Plan's pathway status = ACTIVE (else ERR_PATHWAY_NOT_ACTIVE)"
          - "Student status = ENROLLED (else ERR_STUDENT_NOT_ENROLLED)"
        side_effects:
          - "Any other ACTIVE plan of the same student -> SUPERSEDED"
          - "Recompute counts_toward_pathway on the student's enrollments, then alignment_*, milestone_pct, wbl_hours_pct, certification_points, readiness_*"
          - "StudentPlan.version += 1"
      - from: REVISING
        to: ACTIVE
        trigger: "POST /ccr/plans/{id}/activate"
        actor: Advisor
        preconditions: ["Same as DRAFT -> ACTIVE"]
        side_effects: ["Same as DRAFT -> ACTIVE"]
      - from: ACTIVE
        to: REVISING
        trigger: "POST /ccr/plans/{id}/revise"
        actor: Advisor
        preconditions: []
        side_effects: ["StudentPlan.version += 1; derived fields unchanged until re-activation or PATCH"]
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system: another plan of the same student completes activation"
        actor: system
        preconditions: []
        side_effects: ["StudentPlan.version += 1"]

  - entity: CourseEnrollment
    initial_state: PLANNED
    terminal_states: [COMPLETED]
    transitions:
      - from: PLANNED
        to: ENROLLED
        trigger: "POST /ccr/enrollments/{id}/transition (to_status=ENROLLED)"
        actor: Advisor
        preconditions: ["Owning plan status = ACTIVE (else ERR_PLAN_NOT_ACTIVE)"]
        side_effects: ["Plan derived fields recompute (provisional alignment includes ENROLLED)"]
      - from: ENROLLED
        to: COMPLETED
        trigger: "POST /ccr/enrollments/{id}/transition (to_status=COMPLETED, payload grade in {A,B,C,PASS})"
        actor: Advisor
        preconditions: ["payload grade present and in {A,B,C,PASS} (else ERR_VALIDATION)"]
        side_effects:
          - "grade set; plan alignment_official/readiness_* recompute"
          - "Every non-CERTIFIED SeniorAudit of the student refreshes credits_earned/pathway_requirements_met"
          - "If a CERTIFIED SeniorAudit exists for the student, it auto-flags: CERTIFIED -> FLAGGED with flag_reason=AUTO_DRIFT"
      - from: ENROLLED
        to: FAILED
        trigger: "POST /ccr/enrollments/{id}/transition (to_status=FAILED)"
        actor: Advisor
        preconditions: []
        side_effects: ["grade=F; 0 credits awarded; plan/audit recomputes as above (auto-flag included)"]
      - from: PLANNED
        to: DROPPED
        trigger: "POST /ccr/enrollments/{id}/transition (to_status=DROPPED)"
        actor: Advisor
        preconditions: []
        side_effects: ["Plan derived fields recompute"]
      - from: ENROLLED
        to: DROPPED
        trigger: "POST /ccr/enrollments/{id}/transition (to_status=DROPPED)"
        actor: Advisor
        preconditions: []
        side_effects: ["Plan/audit recompute + CERTIFIED-audit auto-flag as on COMPLETED"]
      - from: DROPPED
        to: PLANNED
        trigger: "POST /ccr/enrollments/{id}/transition (to_status=PLANNED)"
        actor: Advisor
        preconditions: ["Owning plan status = ACTIVE (else ERR_PLAN_NOT_ACTIVE)"]
        side_effects: ["Plan derived fields recompute"]
      - from: FAILED
        to: PLANNED
        trigger: "POST /ccr/enrollments/{id}/transition (to_status=PLANNED)"
        actor: Advisor
        preconditions: ["Owning plan status = ACTIVE (else ERR_PLAN_NOT_ACTIVE)"]
        side_effects: ["Plan derived fields recompute"]

  - entity: Application
    initial_state: DRAFT
    terminal_states: [WITHDRAWN]
    note: "Two independent state dimensions: submission_status (below) and decision_status (further below). A transition on one dimension never blocks the other except where stated."
    transitions:
      - from: DRAFT
        to: READY
        trigger: "POST /ccr/applications/{id}/transition (to_status=READY)"
        actor: Student
        preconditions:
          - "Every milestone with required=true has status in {COMPLETED, WAIVED} (else ERR_MILESTONES_INCOMPLETE)"
          - "now <= deadline_at (else ERR_DEADLINE_PASSED)"
        side_effects: ["Application.version += 1"]
      - from: READY
        to: SUBMITTED
        trigger: "POST /ccr/applications/{id}/transition (to_status=SUBMITTED)"
        actor: Student
        preconditions:
          - "now <= deadline_at (else ERR_DEADLINE_PASSED)"
          - "No RecommendationRequest linked via application_id has status in {REQUESTED, ACCEPTED} (else ERR_PENDING_REC_LETTERS)"
        side_effects:
          - "submitted_at = now; decision_status NONE -> PENDING"
          - "Application.version += 1"
      - from: SUBMITTED
        to: CONFIRMED
        trigger: "POST /ccr/applications/{id}/transition (to_status=CONFIRMED)"
        actor: DistrictAdmin
        preconditions: []
        side_effects: ["Application.version += 1"]
      - from: READY
        to: DRAFT
        trigger: "system: a required milestone of this application flipped to MISSED (ops-run regression)"
        actor: system
        preconditions: []
        side_effects: ["Application.version += 1; plan milestone_pct/readiness recompute"]
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /ccr/applications/{id}/transition (to_status=WITHDRAWN) or student terminal cascade"
        actor: Student
        preconditions: []
        side_effects: ["Milestones in {PENDING, READY} -> WAIVED; Application.version += 1; plan milestone_pct recompute"]
      - from: READY
        to: WITHDRAWN
        trigger: "POST /ccr/applications/{id}/transition (to_status=WITHDRAWN) or student terminal cascade"
        actor: Student
        preconditions: []
        side_effects: ["Milestones in {PENDING, READY} -> WAIVED; Application.version += 1"]
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /ccr/applications/{id}/transition (to_status=WITHDRAWN)"
        actor: Student
        preconditions: []
        side_effects: ["Application.version += 1; decision_status unchanged for audit trail"]

  - entity: ApplicationDecision
    note: "decision_status dimension of Application (parallel state dimension on the same row; listed separately for clarity)"
    entity_ref: Application
    initial_state: NONE
    terminal_states: [ACCEPTED, DENIED]
    transitions:
      - from: NONE
        to: PENDING
        trigger: "system: submission_status DRAFT<-...->SUBMITTED (fires with the SUBMITTED transition)"
        actor: system
        preconditions: []
        side_effects: []
      - from: PENDING
        to: ACCEPTED
        trigger: "POST /ccr/applications/{id}/decision (to_decision=ACCEPTED)"
        actor: DistrictAdmin
        preconditions: ["submission_status in {SUBMITTED, CONFIRMED} (else ERR_DECISION_NOT_ALLOWED)"]
        side_effects: ["decided_at = now; Application.version += 1"]
      - from: PENDING
        to: WAITLISTED
        trigger: "POST /ccr/applications/{id}/decision (to_decision=WAITLISTED)"
        actor: DistrictAdmin
        preconditions: ["submission_status in {SUBMITTED, CONFIRMED}"]
        side_effects: ["decided_at = now; Application.version += 1"]
      - from: PENDING
        to: DENIED
        trigger: "POST /ccr/applications/{id}/decision (to_decision=DENIED)"
        actor: DistrictAdmin
        preconditions: ["submission_status in {SUBMITTED, CONFIRMED}"]
        side_effects: ["decided_at = now; Application.version += 1"]
      - from: PENDING
        to: DEFERRED
        trigger: "POST /ccr/applications/{id}/decision (to_decision=DEFERRED)"
        actor: DistrictAdmin
        preconditions: ["submission_status in {SUBMITTED, CONFIRMED}"]
        side_effects: ["decided_at = now; Application.version += 1"]
      - from: DEFERRED
        to: PENDING
        trigger: "POST /ccr/applications/{id}/decision (to_decision=PENDING)"
        actor: DistrictAdmin
        preconditions: ["submission_status in {SUBMITTED, CONFIRMED}"]
        side_effects: ["Application.version += 1"]
      - from: WAITLISTED
        to: ACCEPTED
        trigger: "POST /ccr/applications/{id}/decision (to_decision=ACCEPTED)"
        actor: DistrictAdmin
        preconditions: ["submission_status in {SUBMITTED, CONFIRMED}"]
        side_effects: ["Application.version += 1"]
      - from: WAITLISTED
        to: DENIED
        trigger: "POST /ccr/applications/{id}/decision (to_decision=DENIED)"
        actor: DistrictAdmin
        preconditions: ["submission_status in {SUBMITTED, CONFIRMED}"]
        side_effects: ["Application.version += 1"]

  - entity: ApplicationMilestone
    initial_state: PENDING
    terminal_states: [COMPLETED, MISSED, WAIVED]
    note: "Creation with depends_on_milestone_id=null auto-advances to READY within the create response; PENDING persists only while a dependency is unmet."
    transitions:
      - from: PENDING
        to: READY
        trigger: "system: creation with no dependency, or depends_on milestone reached COMPLETED"
        actor: system
        preconditions: []
        side_effects: ["ApplicationMilestone.version += 1"]
      - from: READY
        to: COMPLETED
        trigger: "POST /ccr/milestones/{id}/transition (to_status=COMPLETED)"
        actor: Student
        preconditions:
          - "status = READY (else ERR_MILESTONE_NOT_ACTIONABLE; completing a PENDING milestone whose depends_on is not COMPLETED therefore fails with the state error, which outranks ERR_PREREQUISITE_INCOMPLETE)"
          - "Owning application submission_status in {DRAFT, READY} (else ERR_INVALID_STATE)"
        side_effects:
          - "completed_at = now; each dependent milestone in PENDING whose depends_on now COMPLETED -> READY"
          - "Plan milestone_pct/readiness recompute; ApplicationMilestone.version += 1"
      - from: PENDING
        to: WAIVED
        trigger: "POST /ccr/milestones/{id}/transition (to_status=WAIVED)"
        actor: Advisor
        preconditions: []
        side_effects: ["ApplicationMilestone.version += 1; plan milestone_pct recompute (WAIVED excluded from denominator)"]
      - from: READY
        to: WAIVED
        trigger: "POST /ccr/milestones/{id}/transition (to_status=WAIVED)"
        actor: Advisor
        preconditions: []
        side_effects: ["ApplicationMilestone.version += 1; plan milestone_pct recompute"]
      - from: MISSED
        to: WAIVED
        trigger: "POST /ccr/milestones/{id}/transition (to_status=WAIVED)"
        actor: Advisor
        preconditions: []
        side_effects: ["ApplicationMilestone.version += 1; plan milestone_pct recompute (recovery path for regressed applications)"]
      - from: PENDING
        to: MISSED
        trigger: "system: ops-run finds due_at < executed_at"
        actor: system
        preconditions: []
        side_effects: ["If required and owning application submission_status = READY -> application regresses to DRAFT; plan milestone_pct/readiness recompute"]
      - from: READY
        to: MISSED
        trigger: "system: ops-run finds due_at < executed_at"
        actor: system
        preconditions: []
        side_effects: ["Same regression cascade as PENDING -> MISSED"]

  - entity: RecommendationRequest
    initial_state: REQUESTED
    terminal_states: [VERIFIED, WITHDRAWN]
    transitions:
      - from: REQUESTED
        to: ACCEPTED
        trigger: "POST /ccr/recommendation-requests/{id}/transition (to_status=ACCEPTED)"
        actor: Teacher
        preconditions: ["Acting teacher is the routed teacher_id (else ERR_REQUEST_NOT_ROUTED_TO_YOU)"]
        side_effects: ["RecommendationRequest.version += 1; teacher open_request_count unchanged (REQUESTED and ACCEPTED both count)"]
      - from: REQUESTED
        to: DECLINED
        trigger: "POST /ccr/recommendation-requests/{id}/transition (to_status=DECLINED)"
        actor: Teacher
        preconditions: ["Acting teacher is the routed teacher_id"]
        side_effects: ["RecommendationRequest.version += 1; teacher open_request_count -= 1"]
      - from: DECLINED
        to: REQUESTED
        trigger: "POST /ccr/recommendation-requests/{id}/transition (to_status=REQUESTED, payload new_teacher_id)"
        actor: Advisor
        preconditions:
          - "payload new_teacher_id present, teacher exists, status ACTIVE (else ERR_NOT_FOUND / ERR_INVALID_STATE)"
          - "new teacher open_request_count < max_active_letters (else ERR_TEACHER_CAPACITY_EXCEEDED)"
          - "due_at > now — client may extend due_at via payload (else ERR_DUE_DATE_PAST)"
        side_effects: ["teacher_id = new_teacher_id; reroute_count += 1; RecommendationRequest.version += 1; new teacher open_request_count += 1"]
      - from: ACCEPTED
        to: SUBMITTED
        trigger: "POST /ccr/recommendation-requests/{id}/transition (to_status=SUBMITTED)"
        actor: Teacher
        preconditions: ["Acting teacher is the routed teacher_id"]
        side_effects: ["submitted_at = now; teacher open_request_count -= 1; RecommendationRequest.version += 1"]
      - from: SUBMITTED
        to: VERIFIED
        trigger: "POST /ccr/recommendation-requests/{id}/transition (to_status=VERIFIED)"
        actor: Advisor
        preconditions: ["Student's assigned advisor performs the verify (else ERR_FORBIDDEN)"]
        side_effects: ["verified_at = now; RecommendationRequest.version += 1"]
      - from: REQUESTED
        to: WITHDRAWN
        trigger: "POST /ccr/recommendation-requests/{id}/transition (to_status=WITHDRAWN) or student terminal cascade"
        actor: Student
        preconditions: []
        side_effects: ["teacher open_request_count -= 1; RecommendationRequest.version += 1"]
      - from: ACCEPTED
        to: WITHDRAWN
        trigger: "POST /ccr/recommendation-requests/{id}/transition (to_status=WITHDRAWN) or student terminal cascade"
        actor: Student
        preconditions: []
        side_effects: ["teacher open_request_count -= 1; RecommendationRequest.version += 1"]

  - entity: Certification
    initial_state: REGISTERED
    terminal_states: [PASSED, CANCELLED]
    transitions:
      - from: REGISTERED
        to: EXAM_SCHEDULED
        trigger: "POST /ccr/certifications/{id}/transition (to_status=EXAM_SCHEDULED, payload exam_at)"
        actor: WblCoordinator
        preconditions: ["payload exam_at present and > now (else ERR_VALIDATION)"]
        side_effects: ["exam_at set; Certification.version += 1"]
      - from: FAILED
        to: EXAM_SCHEDULED
        trigger: "POST /ccr/certifications/{id}/transition (to_status=EXAM_SCHEDULED, payload exam_at) — retake"
        actor: WblCoordinator
        preconditions: ["payload exam_at present and > now"]
        side_effects: ["retake_count += 1; exam_at overwritten; Certification.version += 1"]
      - from: EXAM_SCHEDULED
        to: PASSED
        trigger: "POST /ccr/certifications/{id}/transition (to_status=PASSED)"
        actor: WblCoordinator
        preconditions: []
        side_effects: ["earned_at = now; plan certification_points/readiness recompute; non-CERTIFIED audits refresh certification_requirement_met; CERTIFIED audit auto-flags (AUTO_DRIFT)"]
      - from: EXAM_SCHEDULED
        to: FAILED
        trigger: "POST /ccr/certifications/{id}/transition (to_status=FAILED)"
        actor: WblCoordinator
        preconditions: []
        side_effects: ["Certification.version += 1"]
      - from: REGISTERED
        to: CANCELLED
        trigger: "POST /ccr/certifications/{id}/transition (to_status=CANCELLED) or student terminal cascade"
        actor: WblCoordinator
        preconditions: []
        side_effects: ["Certification.version += 1"]
      - from: EXAM_SCHEDULED
        to: CANCELLED
        trigger: "POST /ccr/certifications/{id}/transition (to_status=CANCELLED) or student terminal cascade"
        actor: WblCoordinator
        preconditions: []
        side_effects: ["Certification.version += 1"]

  - entity: Placement
    initial_state: OFFERED
    terminal_states: [COMPLETED, DECLINED, TERMINATED]
    transitions:
      - from: OFFERED
        to: CONFIRMED
        trigger: "POST /ccr/placements/{id}/transition (to_status=CONFIRMED)"
        actor: WblCoordinator
        preconditions:
          - "Site status = ACTIVE (else ERR_INVALID_STATE)"
          - "No pairwise half-open overlap with the student's other CONFIRMED/ACTIVE placements: existing.term_start < new.term_end AND new.term_start < existing.term_end (adjacency allowed) — else ERR_PLACEMENT_OVERLAP"
          - "Site aggregate capacity: max_overlap(existing CONFIRMED/ACTIVE at site over the new interval) + 1 <= site.max_concurrent_placements — else ERR_SITE_CAPACITY_EXCEEDED"
        side_effects: ["Placement.version += 1; site confirmed_active_count recompute"]
      - from: CONFIRMED
        to: ACTIVE
        trigger: "POST /ccr/placements/{id}/transition (to_status=ACTIVE)"
        actor: WblCoordinator
        preconditions: ["now >= term_start (else ERR_TERM_NOT_STARTED)"]
        side_effects: ["Placement.version += 1"]
      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /ccr/placements/{id}/transition (to_status=COMPLETED, payload hours_logged)"
        actor: WblCoordinator
        preconditions: ["payload hours_logged present and >= 0 (else ERR_VALIDATION)"]
        side_effects:
          - "hours_logged set; site confirmed_active_count recompute"
          - "Plan wbl_hours_pct/readiness recompute; non-CERTIFIED audits refresh work_hours_met; CERTIFIED audit auto-flags (AUTO_DRIFT)"
      - from: OFFERED
        to: DECLINED
        trigger: "POST /ccr/placements/{id}/transition (to_status=DECLINED) or student terminal cascade"
        actor: WblCoordinator
        preconditions: []
        side_effects: ["Placement.version += 1"]
      - from: CONFIRMED
        to: TERMINATED
        trigger: "POST /ccr/placements/{id}/transition (to_status=TERMINATED), site-capacity reduction cascade, or student terminal cascade"
        actor: WblCoordinator
        preconditions: []
        side_effects: ["terminated_reason set (MANUAL | SITE_CAPACITY_REDUCTION | STUDENT_WITHDRAWN); site confirmed_active_count recompute; Placement.version += 1"]
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /ccr/placements/{id}/transition (to_status=TERMINATED) or cascades"
        actor: WblCoordinator
        preconditions: []
        side_effects: ["terminated_reason set; hours_logged stays 0 (only COMPLETED yields hours); site count + plan/audit recompute; CERTIFIED audit auto-flags if plan inputs drifted"]

  - entity: SeniorAudit
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: IN_REVIEW
        trigger: "POST /ccr/senior-audits/{id}/transition (to_status=IN_REVIEW)"
        actor: Advisor
        preconditions: ["Acting advisor is auditor_advisor_id (else ERR_NOT_AUDITOR)"]
        side_effects: ["SeniorAudit.version += 1; computed fields refresh"]
      - from: FLAGGED
        to: IN_REVIEW
        trigger: "POST /ccr/senior-audits/{id}/transition (to_status=IN_REVIEW)"
        actor: Advisor
        preconditions: ["Acting advisor is auditor_advisor_id"]
        side_effects: ["flag_reason = null; SeniorAudit.version += 1; computed fields refresh"]
      - from: IN_REVIEW
        to: FLAGGED
        trigger: "POST /ccr/senior-audits/{id}/transition (to_status=FLAGGED, payload flag_reason)"
        actor: Advisor
        preconditions: ["Acting advisor is auditor_advisor_id", "payload flag_reason non-empty (else ERR_VALIDATION)"]
        side_effects: ["flag_reason set; SeniorAudit.version += 1"]
      - from: CERTIFIED
        to: FLAGGED
        trigger: "system: post-certification drift — a cascade changed credits_earned, pathway_requirements_met, certification_requirement_met, or work_hours_met"
        actor: system
        preconditions: []
        side_effects: ["flag_reason = AUTO_DRIFT; certified_at = null; SeniorAudit.version += 1"]
      - from: IN_REVIEW
        to: CERTIFIED
        trigger: "POST /ccr/senior-audits/{id}/transition (to_status=CERTIFIED)"
        actor: Advisor
        preconditions:
          - "Acting advisor is auditor_advisor_id (else ERR_NOT_AUDITOR)"
          - "auditor_advisor_id != student.assigned_advisor_id — segregation of duties (else ERR_AUDITOR_IS_ASSIGNED_ADVISOR)"
          - "No CourseEnrollment of the student in {PLANNED, ENROLLED} (else ERR_OPEN_ENROLLMENTS)"
          - "credits_earned >= required_credits, equality passes (else ERR_CREDITS_SHORTFALL)"
          - "pathway_requirements_met = true (else ERR_PATHWAY_INCOMPLETE)"
          - "certification_requirement_met = true (else ERR_CERTIFICATION_MISSING)"
          - "work_hours_met = true (else ERR_WORK_HOURS_SHORTFALL)"
        side_effects: ["certified_at = now; SeniorAudit.version += 1; computed fields freeze (no further refresh while CERTIFIED)"]

  - entity: OutcomeRecord
    initial_state: UNVERIFIED
    terminal_states: [VERIFIED]
    transitions:
      - from: UNVERIFIED
        to: VERIFIED
        trigger: "POST /ccr/outcome-records/{id}/transition (to_status=VERIFIED)"
        actor: DistrictAdmin
        preconditions: []
        side_effects: ["verified_at = now; OutcomeRecord.version += 1"]
      - from: UNVERIFIED
        to: DISPUTED
        trigger: "POST /ccr/outcome-records/{id}/transition (to_status=DISPUTED)"
        actor: DistrictAdmin
        preconditions: []
        side_effects: ["OutcomeRecord.version += 1"]
      - from: DISPUTED
        to: VERIFIED
        trigger: "POST /ccr/outcome-records/{id}/transition (to_status=VERIFIED)"
        actor: DistrictAdmin
        preconditions: []
        side_effects: ["verified_at = now; OutcomeRecord.version += 1"]

# =============================================================================
# §1.2.1 Concurrency Rules (true races only, OCC on parent version)
# =============================================================================
concurrency_rules:
  - rule_id: plan-create-stale-student
    parent_entity: Student
    write_endpoint: "POST /ccr/students/{studentId}/plans"
    occ_field: "expected_student_version"
    description: |
      Creating a StudentPlan snapshots the student's standing as planning
      baseline. A create carrying an expected_student_version the server has
      already advanced past (e.g. another plan was just created against this
      student, which legitimately succeeds under product semantics) is stale
      and is rejected with 412; the writer must re-read the student.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: reassignment-stale-advisor
    parent_entity: Advisor
    write_endpoint: "POST /ccr/advisors/{advisorId}/reassignments"
    occ_field: "expected_advisor_version"
    description: |
      A bulk reassignment encodes a capacity plan computed from the source
      advisor's last-observed version. If the advisor's version has advanced
      (a prior reassignment or deactivation legitimately mutated the record),
      the stale plan is rejected with 412 rather than silently re-applied.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: plan_alignment
    trigger: "plan activation; plan PATCH changing pathway_id; any enrollment create/transition of the student; ops-run recompute"
    algorithm: aggregation
    formula: |
      required = plan.pathway.required_course_codes (list, may be empty)
      covered(variant) = set of codes c in required such that exists a CourseEnrollment
        of this student with course_code == c and status in variant's inclusion set
      if required is empty: alignment = 100
      else alignment = round_half_up(100 * |covered| / |required|, 2)
    input_set: "CourseEnrollments of the plan's student; PROVISIONAL includes statuses {PLANNED, ENROLLED, COMPLETED}; OFFICIAL includes {COMPLETED} only"
    constants:
      EMPTY_REQUIRED_SCORE: 100
    precision: "2 decimal places, round_half_up"
    variants:
      - name: PROVISIONAL
        when: "forward-looking advising view (plan.alignment_provisional_pct, readiness_provisional)"
        difference: "includes PLANNED and ENROLLED enrollments as covering"
      - name: OFFICIAL
        when: "audit/graduation view (plan.alignment_official_pct, readiness_official)"
        difference: "only COMPLETED enrollments cover a required code"

  - name: plan_readiness_score
    trigger: "whenever any of alignment_*, milestone_pct, wbl_hours_pct, certification_points changes; on plan activation; on ops-run recompute"
    algorithm: weighted_scoring
    formula: |
      grade band weights (conditional branch on student.grade_level):
        grade_level == 12  -> (w_align=0.30, w_milestone=0.40, w_wbl=0.20, w_cert=0.10)
        grade_level <= 11  -> (w_align=0.50, w_milestone=0.20, w_wbl=0.20, w_cert=0.10)
      Evaluation order is pinned: (1) resolve band weights; (2) compute the four
      component percentages; (3) weighted_sum = align*w_align + milestone*w_milestone
      + wbl*w_wbl + cert*w_cert; (4) rounded = round_half_up(weighted_sum, 2);
      (5) score = min(100, rounded).
      readiness_provisional uses alignment_provisional_pct; readiness_official uses
      alignment_official_pct; both share milestone_pct (STRICT), wbl_hours_pct,
      certification_points.
    input_set: "StudentPlan derived fields of one plan"
    constants:
      CAP: 100
    precision: "2 decimal places, round_half_up; cap applied AFTER rounding"
    variants:
      - name: PROVISIONAL
        when: "advising view"
        difference: "uses alignment_provisional_pct"
      - name: OFFICIAL
        when: "audit view"
        difference: "uses alignment_official_pct"

  - name: milestone_completion_pct
    trigger: "any milestone status change on any non-WITHDRAWN application of the student; plan activation; ops-run"
    algorithm: aggregation
    formula: |
      pool = ApplicationMilestones whose application belongs to the student and
             application.submission_status != WITHDRAWN
      STRICT: denominator = |pool| - |pool with status WAIVED|; numerator = |pool with status COMPLETED|
      LENIENT: denominator = |pool|; numerator = |pool with status in {COMPLETED, WAIVED}|
      if denominator == 0: pct = 100
      pct = round_half_up(100 * numerator / denominator, 2)
      The stored plan.milestone_pct is the STRICT variant; LENIENT is exposed only
      inside GET /ccr/plans/{id} as an alternate field milestone_pct_lenient for
      advising dashboards.
    input_set: "Milestones of the student's applications with submission_status != WITHDRAWN"
    constants:
      EMPTY_POOL_SCORE: 100
    precision: "2 decimal places, round_half_up"
    variants:
      - name: STRICT
        when: "default; feeds readiness_*"
        difference: "WAIVED milestones leave the denominator"
      - name: LENIENT
        when: "dashboard display only"
        difference: "WAIVED milestones count as completed"

  - name: audit_credits
    trigger: "enrollment transitions of the student; audit creation and DRAFT/FLAGGED -> IN_REVIEW; any refresh while audit status != CERTIFIED"
    algorithm: aggregation
    formula: |
      credits_earned = sum(credits of the student's CourseEnrollments with status == COMPLETED)
      (FAILED yields 0 credits because COMPLETED requires grade in {A,B,C,PASS})
      clearance threshold: credits_earned >= required_credits  (equality PASSES; the
      comparison is >=, not >)
      required_credits = 24 (snapshot at audit creation)
    input_set: "CourseEnrollments of the audit's student with status COMPLETED"
    constants:
      GRADUATION_CREDITS_REQUIRED: 24
    precision: "credits are quarter-granularity; comparison exact (no rounding)"

  - name: caseload_load
    trigger: "student creation, reassignment, advisor deactivation cascade, student terminal transition, plan activation (plan-missing weight)"
    algorithm: weighted_scoring
    formula: |
      advisees = Students with assigned_advisor_id == advisor.id AND status == ENROLLED
      SIMPLE: load = |advisees|
      WEIGHTED: weight(s) = (2.0 if s.grade_level == 12 else 1.5 if s.grade_level == 11 else 1.0)
                + (0.5 if s has no StudentPlan with status == ACTIVE else 0)
                load = round_half_up(sum(weight(s) for s in advisees), 2)
      Empty advisee set: both variants = 0.
    input_set: "Students assigned to the advisor with status ENROLLED"
    constants: {}
    precision: "2 decimal places, round_half_up"
    variants:
      - name: SIMPLE
        when: "headcount view"
        difference: "plain ENROLLED advisee count"
      - name: WEIGHTED
        when: "workload-equity view"
        difference: "seniors 2.0, juniors 1.5, others 1.0, +0.5 when the advisee lacks an ACTIVE plan"

  - name: caseload_equity_gap_index
    trigger: "student creation, reassignment, student terminal transition; read of GET /ccr/advisors/{id}/equity-report"
    algorithm: weighted_scoring
    formula: |
      groups = {GROUP_A, GROUP_B, GROUP_C, GROUP_D}
      district pool = all Students with status == ENROLLED
      district_share_g = count(pool, group g) / |pool|   (if |pool| == 0: index = 0)
      advisee pool = Students assigned to advisor with status == ENROLLED
      advisor_share_g = count(advisees, group g) / |advisees|   (if |advisees| == 0: index = 0)
      ROUNDING ORDER IS PINNED: per-group gap_g = round_half_up(|advisor_share_g - district_share_g|, 4)
      computed FIRST for each group; then index = round_half_up(sum(gap_g) * 100, 2).
      (Summing raw gaps then rounding — e.g. raw sum 0.857142.. -> 85.71 — is the
      FORBIDDEN order; pinned order yields 85.72 for the canonical fixture.)
    input_set: "ENROLLED students district-wide and per advisor"
    constants: {}
    precision: "per-group 4 decimals then sum; final 2 decimals; round_half_up at both steps"

  - name: district_target_caseload
    trigger: "read of equity-report; student creation; advisor create/deactivate; reassignment"
    algorithm: constraint_propagation
    formula: |
      Circular-looking dependency, pinned evaluation order:
      (1) SNAPSHOT the advisor pool S = {Advisor : status == ACTIVE} at evaluation start;
          later steps never re-read advisor rows;
      (2) total_students = count(Student : status == ENROLLED);
          total_capacity = sum(max_caseload over S);
      (3) ratio = total_students / total_capacity  (if total_capacity == 0: ratio = 0);
      (4) for each advisor a in S: target_caseload(a) = round_half_up(ratio * a.max_caseload, 2);
          advisors NOT in S (INACTIVE): target_caseload = 0.
      Advisor a's target thus depends on a district ratio that itself includes a's own
      max_caseload — the snapshot in step (1) is what makes the value well-defined.
    input_set: "ACTIVE advisors; ENROLLED students"
    constants: {}
    precision: "2 decimal places, round_half_up"

  - name: wbl_hours_progress
    trigger: "placement COMPLETED or TERMINATED; plan activation; ops-run"
    algorithm: aggregation
    formula: |
      earned = sum(hours_logged of the student's Placements with status == COMPLETED)
      required = plan.pathway.required_work_hours
      if required == 0: pct = 100
      else pct = min(100, round_half_up(100 * earned / required, 2))
    input_set: "Placements of the student with status COMPLETED"
    constants: {}
    precision: "2 decimal places, round_half_up; cap applied after rounding"

  - name: certification_points
    trigger: "certification transitions (PASSED/CANCELLED); plan activation; ops-run"
    algorithm: threshold
    formula: |
      req = plan.pathway.required_certification_code
      if req is null: points = 100
      else if exists Certification of student with cert_code == req and status == PASSED: points = 100
      else if exists Certification of student with status == PASSED (any other code): points = 50
      else: points = 0
    input_set: "Certifications of the student"
    constants:
      FULL: 100
      PARTIAL: 50
      NONE: 0
    precision: "integer-valued points"

  - name: site_overlap_max
    trigger: "placement OFFERED -> CONFIRMED; PATCH /ccr/placement-sites/{id} reducing max_concurrent_placements"
    algorithm: interval_merge
    formula: |
      Existing = placements p with p.site_id == site.id AND p.status in {CONFIRMED, ACTIVE}
      For candidate interval [s, e):
        event_points T = { s } union { p.term_start : p in Existing, s <= p.term_start < e }
        max_overlap = max over t in T of count(p in Existing with p.term_start <= t < p.term_end)
        (T empty -> max_overlap = 0)
      capacity check: allowed iff max_overlap + 1 <= site.max_concurrent_placements
      Intervals are HALF-OPEN [start, end): a placement ending exactly at another's
      start does NOT count as overlap for either the pairwise or aggregate rule.
    input_set: "Placements at the site with status CONFIRMED or ACTIVE"
    constants: {}
    precision: "datetime comparison exact to the second"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority — lower number wins on dual failure)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present; role is one of the declared roles", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: business_constraint, check: "Request body schema: required fields present, no unknown fields, enum members valid, numeric ranges respected (grade_level 9..12, max_caseload >= 1, credits > 0, hours_per_week > 0); cross-field term_end > term_start on placement create", error_id: ERR_VALIDATION, http_status: 400, applies_to: "all mutating endpoints" }
  - { priority: 2.5, category: business_temporal, check: "placement create: term_end <= term_start", error_id: ERR_INVALID_TERM, http_status: 422, applies_to: "POST /ccr/students/{id}/placements" }
  - { priority: 3, category: auth, check: "Role is listed in the endpoint's roles", error_id: ERR_FORBIDDEN, http_status: 403, applies_to: "all" }
  - { priority: 4, category: existence, check: "Path ids exist, validated left-to-right (student, then nested resource; body FK targets exist)", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all resource endpoints" }
  - { priority: 5, category: concurrency, check: "expected_<parent>_version equals the parent's current version (OCC endpoints only)", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "POST /ccr/students/{id}/plans, POST /ccr/advisors/{id}/reassignments" }
  - { priority: 6, category: auth, check: "Ownership/context: Teacher acts only on requests routed to them; audit transitions only by auditor_advisor_id; Student role touches only own resources; rec verify only by the student's assigned advisor", error_id: "ERR_REQUEST_NOT_ROUTED_TO_YOU | ERR_NOT_AUDITOR | ERR_FORBIDDEN", http_status: 403, applies_to: "transition endpoints with ownership clauses" }
  - { priority: 7, category: state, check: "Same-entity state machine preconditions (from-state membership, terminal lockdown)", error_id: "ERR_INVALID_STATE | ERR_MILESTONE_NOT_ACTIONABLE | ERR_DECISION_NOT_ALLOWED", http_status: 409, applies_to: "all transition endpoints" }
  - { priority: 8, category: business_safety, check: "Segregation of duties: certifying auditor differs from the student's assigned advisor", error_id: ERR_AUDITOR_IS_ASSIGNED_ADVISOR, http_status: 409, applies_to: "POST /ccr/senior-audits/{id}/transition (CERTIFIED)" }
  - { priority: 9, category: business_constraint, check: "Uniqueness (student_ref, email, pathway_code, site_code; one OutcomeRecord per student); seniority (audit create needs grade_level 12); milestone dependency well-formedness (same application, dependency not WAIVED/MISSED)", error_id: "ERR_DUPLICATE_CODE | ERR_OUTCOME_EXISTS | ERR_NOT_SENIOR | ERR_PREREQUISITE_INCOMPLETE", http_status: 409, applies_to: "create endpoints" }
  - { priority: 10, category: business_temporal, check: "Clock-relative rules: milestone/rec due_at must be future at create/reroute; application DRAFT->READY and READY->SUBMITTED before deadline_at; placement ACTIVE start not before term_start; student pairwise placement overlap", error_id: "ERR_DUE_DATE_PAST | ERR_DEADLINE_PASSED | ERR_TERM_NOT_STARTED | ERR_PLACEMENT_OVERLAP", http_status: 409, applies_to: "creates and transitions with time clauses" }
  - { priority: 11, category: business_referential, check: "Cross-entity state gates: pathway ACTIVE; plan ACTIVE for enrollment create/replan; student ENROLLED for plan/apply/rec/cert/placement creation; teacher ACTIVE for rec create/reroute (ERR_INVALID_STATE); rec application link belongs to same student; outcome needs GRADUATED; graduate needs CERTIFIED audit; audit certify gates (open enrollments, credits, pathway, certification, work hours)", error_id: "ERR_PATHWAY_NOT_ACTIVE | ERR_PLAN_NOT_ACTIVE | ERR_STUDENT_NOT_ENROLLED | ERR_INVALID_STATE | ERR_CROSS_STUDENT_REFERENCE | ERR_STUDENT_NOT_GRADUATED | ERR_NO_CERTIFIED_AUDIT | ERR_OPEN_ENROLLMENTS | ERR_CREDITS_SHORTFALL | ERR_PATHWAY_INCOMPLETE | ERR_CERTIFICATION_MISSING | ERR_WORK_HOURS_SHORTFALL | ERR_MILESTONES_INCOMPLETE | ERR_PENDING_REC_LETTERS", http_status: 409, applies_to: "creates and gated transitions" }
  - { priority: 12, category: business_fiscal, check: "Capacity/quota: advisor caseload (active_caseload_count >= max_caseload rejects), teacher open letters, site aggregate overlap capacity, advisor rehoming pool", error_id: "ERR_CASELOAD_FULL | ERR_TEACHER_CAPACITY_EXCEEDED | ERR_SITE_CAPACITY_EXCEEDED | ERR_NO_ADVISOR_AVAILABLE", http_status: 409, applies_to: "assignment/confirm/create endpoints" }

