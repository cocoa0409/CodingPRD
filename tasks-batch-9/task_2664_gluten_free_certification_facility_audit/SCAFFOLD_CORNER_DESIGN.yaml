      - name: threshold_penalty_is_subtracted_after_the_minimum_and_then_floored_at_five
        claim_type: constants_applied
        grounds:
          - calculations.threshold_standard_selection
          - calculations.lot_sampling_frequency
          - endpoints."POST /gfco/products/{productId}/testing-plan"
          - entities.Product.fields.threshold_ppm
          - entities.Product.fields.sampling_exclusion_days
          - entities.Product.fields.testing_plan_revision
        distinguishing_aspect: |
          Every constant in the threshold ladder is exercised at once and the step order is
          what the numbers expose: the five caps are 20 (program), 5 (ELITE tier), 10
          (HIGH_RISK_GRAIN), 10 (shared equipment) and 5 (SAME_LINE), so the minimum is 5;
          the SAME_LINE-plus-HIGH_RISK_GRAIN penalty then subtracts 2 to give 3; and the
          MIN_ALLOWED_PPM floor lifts it back to 5. An implementation that applies the
          penalty to an individual cap before the min, or floors before the penalty, reports
          3 or 5 for the wrong reason - and the sampling plan makes the difference visible,
          because threshold 5 selects the TIGHT 2.0 multiplier and yields 8 lots a year with
          a 45-day exclusion window (floor(365/8) = 45, not 45.625).
        test_recipe:
          setup:
            - "One applicant with one SAME_LINE facility that has shared equipment present."
            - "One supplier with one HIGH_RISK_GRAIN ingredient carrying all three required documents VERIFIED - ALLERGEN_STATEMENT, PROCESS_FLOW and a COA with lab_ppm_claim exactly 5 - and APPROVED by rev-1."
            - "One ELITE-tier product with that single ingredient linked at inclusion_pct 60, formula CLEARED, and no testing plan yet."
          setup_api_calls:
            - call: "POST /gfco/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /gfco/applicants"
