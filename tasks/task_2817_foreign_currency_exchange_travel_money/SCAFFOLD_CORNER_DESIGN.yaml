              as: BranchTeller
              captures: { e_txn: "$.data.error_id" }
            - call: "POST /exchange-transactions"
              payload: { branch_id: "${br_id}", customer_id: "00000000-0000-4000-8000-000000000000", rate_card_id: "00000000-0000-4000-8000-000000000000", currency_code: "ZZZ", direction: "SELL_FX_TO_CUSTOMER", requested_denominations: [{ denomination_minor_units: 10000, note_count: 1 }] }
              as: BranchTeller
