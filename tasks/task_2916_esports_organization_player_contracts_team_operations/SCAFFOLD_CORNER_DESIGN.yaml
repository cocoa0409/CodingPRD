  # ===========================================================================
  - section: cross-cutting complexity layers
    instances:

      - name: stale_parent_versions_are_refused_and_the_refreshed_version_succeeds
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[deliverable-create-stale-deal]
          - concurrency_rules[roster-move-create-stale-org]
          - errors[ERR_DEAL_VERSION_STALE]
          - errors[ERR_ORGANIZATION_VERSION_STALE]
          - endpoints[POST /sponsorship-deals/{id}/deliverables]
          - endpoints[POST /roster-moves]
        distinguishing_aspect: |
          Both §1.2.1 rules are exercised on the same fixture. Each write is additive and would
          succeed on its own, so the ONLY thing that refuses it is the version check: replaying the
          deal version that was valid one placement ago yields ERR_DEAL_VERSION_STALE (412), and
          replaying the organization version captured before an unrelated PATCH yields
          ERR_ORGANIZATION_VERSION_STALE (412). Re-reading the parent and resending the fresh version
          succeeds, and the refused attempts leave assigned_count and the move list untouched.
        test_recipe:
          setup:
            - "One league, one organization, one adult player on an ACTIVE contract"
            - "One ACTIVE ENERGY_DRINK deal with deliverable_count_required 3"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: LeagueAdmin
              as_user_id: "admin-1"
            - call: "POST /leagues"
              payload: { name: "Apex Masters League", season_start_at: "2026-08-01T00:00:00Z", season_end_at: "2027-07-31T00:00:00Z", roster_lock_at: "2026-09-15T00:00:00Z", transfer_window_open_at: "2026-08-05T00:00:00Z", transfer_window_close_at: "2026-08-31T00:00:00Z", minimum_salary_cents: 3600000, min_roster_size: 0 }
              as: LeagueAdmin
              as_user_id: "admin-1"
              captures: { league_id: $.data.id }
            - call: "POST /organizations"
              payload: { league_id: "${league_id}", name: "Vertex Vanguard", tax_jurisdiction_code: "US-CA", annual_salary_budget_cents: 50000000 }
              as: LeagueAdmin
              as_user_id: "admin-1"
              captures: { org_id: $.data.id }
            - call: "POST /players"
              payload: { full_name: "Mina Okafor", birth_date: "2001-05-14", region_code: "US" }
              as: Scout
              as_user_id: "scout-7"
              captures: { p1_id: $.data.id }
            - call: "POST /contract-offers"
              payload: { organization_id: "${org_id}", player_id: "${p1_id}", base_salary_cents: 12500000, term_months: 12, prize_split_player_pct_bp: 4000, streaming_hours_per_week: 20, tax_residency_code: "US-CA" }
              as: GeneralManager
              as_user_id: "${org_id}"
              captures: { o1_id: $.data.id }
            - call: "POST /contract-offers/${o1_id}/accept"
              payload: { effective_at: "2026-08-05T00:00:00Z" }
              as: PlayerAgent
              as_user_id: "${p1_id}"
              captures: { c1_id: $.data.id }
            - call: "POST /sponsorship-deals"
              payload: { organization_id: "${org_id}", sponsor_name: "Volt Surge", exclusivity_category: "ENERGY_DRINK", total_fee_cents: 1000000, deliverable_count_required: 3, starts_at: "2026-08-01T00:00:00Z", ends_at: "2026-12-31T00:00:00Z" }
              as: SponsorshipManager
              as_user_id: "${org_id}"
              captures: { deal_id: $.data.id }
            - call: "POST /sponsorship-deals/${deal_id}/activate"
              as: SponsorshipManager
              as_user_id: "${org_id}"
              captures: { deal_v2: $.data.version }
          trigger:
            - call: "POST /sponsorship-deals/${deal_id}/deliverables"
              payload: { contract_id: "${c1_id}", deliverable_type: "STREAM_SEGMENT", due_at: "2026-08-20T00:00:00Z", expected_deal_version: "${deal_v2}" }
              as: SponsorshipManager
              as_user_id: "${org_id}"
              captures: { d1_id: $.data.id }
            - call: "POST /sponsorship-deals/${deal_id}/deliverables"
              payload: { contract_id: "${c1_id}", deliverable_type: "SOCIAL_POST", due_at: "2026-08-21T00:00:00Z", expected_deal_version: "${deal_v2}" }
              as: SponsorshipManager
              as_user_id: "${org_id}"
            - call: "GET /sponsorship-deals/${deal_id}"
              as: SponsorshipManager
              as_user_id: "${org_id}"
              captures: { deal_v3: $.data.version }
            - call: "POST /sponsorship-deals/${deal_id}/deliverables"
              payload: { contract_id: "${c1_id}", deliverable_type: "SOCIAL_POST", due_at: "2026-08-21T00:00:00Z", expected_deal_version: "${deal_v3}" }
              as: SponsorshipManager
              as_user_id: "${org_id}"
              captures: { d2_id: $.data.id }
            - call: "GET /sponsorship-deals/${deal_id}/deliverables"
              payload: { limit: 10, offset: 0 }
