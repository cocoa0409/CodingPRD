# =============================================================================
# task_2135 — §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Every instance grounds in SCAFFOLD.yaml §1.1–§1.7 only.
# Logical clock default: 2026-08-01T00:00:00Z (never touched unless a recipe
# explicitly calls POST /rac/_clock/set_current_utc).
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:

      - name: percentage_rent_cumulative_ytd_vs_monthly_standalone_divergence
        grounds:
          - calculations.percentage_rent_accrual
          - entities.ConcessionAgreement.fields.rent_settlement_basis
          - entities.ConcessionAgreement.fields.rent_billed_to_date_cents
          - entities.ConcessionAgreement.fields.last_installment_cents
          - state_machines.TransactionDayReport.UNDER_AUDIT_to_ACCEPTED
        distinguishing_aspect: |
          This dual variant lives on the ConcessionAgreement rent ledger: fed the
          identical two-month revenue stream (5,000,000 then 20,000,000 cents),
          CUMULATIVE_YTD ends at rent_billed_to_date_cents == 2,500,000 while
          MONTHLY_STANDALONE ends at 3,000,000, because the standalone variant
          never recovers month 1's MAG floor out of month 2's surplus.
        test_recipe:
          setup:
            - "One facility; two concessionaires AVX and BUD; one ACTIVE agreement each, identical mag_annual_cents 12,000,000 and percentage_rent_rate_bps 1000, differing only in rent_settlement_basis."
            - "Each agreement has its 2026-01 report already ACCEPTED at audited gross 5,000,000 cents / 4,000 transaction days (variance 0)."
            - "Each agreement has its 2026-02 report sitting in UNDER_AUDIT with reported gross 20,000,000 cents / 8,000 transaction days."
          setup_api_calls:
            - call: "POST /rac/facilities"
              payload: { code: "DEN", name: "DEN ConRAC", cfc_rate_per_transaction_day_cents: 500, ds_reserve_requirement_cents: 5000000, om_reserve_requirement_cents: 1000000, capital_fund_cap_cents: 50000000, overflow_lot_stalls: 100, overflow_daily_surcharge_cents: 400, remittance_grace_days: 20 }
              as: FacilityAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /rac/concessionaires"
              payload: { facility_id: "${fac_id}", legal_name: "Avex Rent A Car", brand_code: "AVX", contact_email: "ops@avex.example" }
              as: FacilityAdmin
              captures: { conc_a_id: $.data.id }
            - call: "POST /rac/concessionaires"
              payload: { facility_id: "${fac_id}", legal_name: "Budline Auto Rental", brand_code: "BUD", contact_email: "ops@budline.example" }
              as: FacilityAdmin
              captures: { conc_b_id: $.data.id }
            - call: "POST /rac/concession-agreements"
              payload: { facility_id: "${fac_id}", concessionaire_id: "${conc_a_id}", contract_year_index: 1, term_start_date: "2026-01-01", term_end_date: "2026-12-31", mag_annual_cents: 12000000, percentage_rent_rate_bps: 1000, rent_settlement_basis: "CUMULATIVE_YTD" }
              as: FacilityAdmin
              captures: { agr_cum_id: $.data.id }
            - call: "POST /rac/concession-agreements"
              payload: { facility_id: "${fac_id}", concessionaire_id: "${conc_b_id}", contract_year_index: 1, term_start_date: "2026-01-01", term_end_date: "2026-12-31", mag_annual_cents: 12000000, percentage_rent_rate_bps: 1000, rent_settlement_basis: "MONTHLY_STANDALONE" }
              as: FacilityAdmin
              captures: { agr_mon_id: $.data.id }
            - call: "POST /rac/concession-agreements/${agr_cum_id}/execute"
              payload: {}
              as: FacilityAdmin
            - call: "POST /rac/concession-agreements/${agr_mon_id}/execute"
              payload: {}
              as: FacilityAdmin
            - call: "POST /rac/transaction-day-reports"
              payload: { agreement_id: "${agr_cum_id}", period_year: 2026, period_month: 1, reported_gross_revenue_cents: 5000000, reported_on_airport_transaction_days: 4000 }
              as: ConcessionaireOperator
              as_user_id: "${conc_a_id}"
              captures: { rep_c1_id: $.data.id }
            - call: "POST /rac/transaction-day-reports/${rep_c1_id}/submit"
              payload: {}
              as: ConcessionaireOperator
              as_user_id: "${conc_a_id}"
            - call: "POST /rac/transaction-day-reports/${rep_c1_id}/begin-audit"
              payload: {}
              as: AuditOfficer
              as_user_id: "aud-1"
            - call: "POST /rac/transaction-day-reports/${rep_c1_id}/accept"
              payload: { audited_gross_revenue_cents: 5000000, audited_on_airport_transaction_days: 4000 }
              as: AuditOfficer
              as_user_id: "aud-1"
            - call: "POST /rac/transaction-day-reports"
              payload: { agreement_id: "${agr_mon_id}", period_year: 2026, period_month: 1, reported_gross_revenue_cents: 5000000, reported_on_airport_transaction_days: 4000 }
              as: ConcessionaireOperator
              as_user_id: "${conc_b_id}"
              captures: { rep_m1_id: $.data.id }
            - call: "POST /rac/transaction-day-reports/${rep_m1_id}/submit"
              payload: {}
              as: ConcessionaireOperator
              as_user_id: "${conc_b_id}"
            - call: "POST /rac/transaction-day-reports/${rep_m1_id}/begin-audit"
              payload: {}
              as: AuditOfficer
              as_user_id: "aud-1"
            - call: "POST /rac/transaction-day-reports/${rep_m1_id}/accept"
              payload: { audited_gross_revenue_cents: 5000000, audited_on_airport_transaction_days: 4000 }
              as: AuditOfficer
              as_user_id: "aud-1"
            - call: "POST /rac/transaction-day-reports"
              payload: { agreement_id: "${agr_cum_id}", period_year: 2026, period_month: 2, reported_gross_revenue_cents: 20000000, reported_on_airport_transaction_days: 8000 }
              as: ConcessionaireOperator
              as_user_id: "${conc_a_id}"
              captures: { rep_c2_id: $.data.id }
            - call: "POST /rac/transaction-day-reports/${rep_c2_id}/submit"
              payload: {}
              as: ConcessionaireOperator
              as_user_id: "${conc_a_id}"
            - call: "POST /rac/transaction-day-reports/${rep_c2_id}/begin-audit"
              payload: {}
              as: AuditOfficer
              as_user_id: "aud-1"
            - call: "POST /rac/transaction-day-reports"
              payload: { agreement_id: "${agr_mon_id}", period_year: 2026, period_month: 2, reported_gross_revenue_cents: 20000000, reported_on_airport_transaction_days: 8000 }
              as: ConcessionaireOperator
              as_user_id: "${conc_b_id}"
              captures: { rep_m2_id: $.data.id }
            - call: "POST /rac/transaction-day-reports/${rep_m2_id}/submit"
              payload: {}
              as: ConcessionaireOperator
              as_user_id: "${conc_b_id}"
            - call: "POST /rac/transaction-day-reports/${rep_m2_id}/begin-audit"
              payload: {}
              as: AuditOfficer
              as_user_id: "aud-1"
          trigger:
            - call: "POST /rac/transaction-day-reports/${rep_c2_id}/accept"
              payload: { audited_gross_revenue_cents: 20000000, audited_on_airport_transaction_days: 8000 }
              as: AuditOfficer
              as_user_id: "aud-1"
            - call: "POST /rac/transaction-day-reports/${rep_m2_id}/accept"
              payload: { audited_gross_revenue_cents: 20000000, audited_on_airport_transaction_days: 8000 }
              as: AuditOfficer
              as_user_id: "aud-1"
          assert:
            - "ConcessionAgreement.${agr_cum_id}.rent_billed_to_date_cents == 2500000"
            - "ConcessionAgreement.${agr_mon_id}.rent_billed_to_date_cents == 3000000"
            - "ConcessionAgreement.${agr_cum_id}.last_installment_cents == 1500000"
            - "ConcessionAgreement.${agr_mon_id}.last_installment_cents == 2000000"
            - "ConcessionAgreement.${agr_cum_id}.percentage_rent_accrued_cents == 2500000"
            - "ConcessionAgreement.${agr_mon_id}.percentage_rent_accrued_cents == 2500000"
            - "ConcessionAgreement.${agr_cum_id}.gross_revenue_ytd_cents == 25000000 and ConcessionAgreement.${agr_mon_id}.gross_revenue_ytd_cents == 25000000"
            - "ConcessionAgreement.${agr_cum_id}.rent_tier == PERCENTAGE and ConcessionAgreement.${agr_mon_id}.rent_tier == PERCENTAGE"
            - "ConcessionAgreement.${agr_cum_id}.mag_shortfall_cents == 0 and ConcessionAgreement.${agr_mon_id}.mag_shortfall_cents == 0"
            - "TransactionDayReport.${rep_c2_id}.period_rent_installment_cents == 1500000"
            - "TransactionDayReport.${rep_m2_id}.period_rent_installment_cents == 2000000"

      - name: cfc_remittance_provisional_vs_final_transaction_day_basis
        grounds:
          - calculations.cfc_remittance_expected_amount
          - entities.CfcRemittance.fields.remittance_basis
          - entities.CfcRemittance.fields.expected_amount_cents
          - entities.TransactionDayReport.fields.audited_on_airport_transaction_days
          - validations[priority=27]
        distinguishing_aspect: |
          This dual variant lives on the CfcRemittance charge, a different entity
          domain from the ConcessionAgreement rent ledger: the same report yields
          expected_amount_cents 2,000,000 on the PROVISIONAL basis (4,000
          self-reported days) and 2,500,000 on the FINAL basis (5,000 audited
          days), a divergence of exactly 500,000 cents.
        test_recipe:
          setup:
            - "One facility with cfc_rate_per_transaction_day_cents 500 and one ACTIVE agreement."
            - "A 2026-01 report reporting 4,000 transaction days is SUBMITTED, then a PROVISIONAL remittance is raised against it."
            - "The report is then audited and ACCEPTED at 5,000 transaction days with zero revenue variance."
          setup_api_calls:
            - call: "POST /rac/facilities"
              payload: { code: "DEN", name: "DEN ConRAC", cfc_rate_per_transaction_day_cents: 500, ds_reserve_requirement_cents: 5000000, om_reserve_requirement_cents: 1000000, capital_fund_cap_cents: 50000000, overflow_lot_stalls: 100, overflow_daily_surcharge_cents: 400, remittance_grace_days: 20 }
              as: FacilityAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /rac/concessionaires"
              payload: { facility_id: "${fac_id}", legal_name: "Avex Rent A Car", brand_code: "AVX", contact_email: "ops@avex.example" }
              as: FacilityAdmin
              captures: { conc_a_id: $.data.id }
            - call: "POST /rac/concession-agreements"
              payload: { facility_id: "${fac_id}", concessionaire_id: "${conc_a_id}", contract_year_index: 1, term_start_date: "2026-01-01", term_end_date: "2026-12-31", mag_annual_cents: 12000000, percentage_rent_rate_bps: 1000, rent_settlement_basis: "CUMULATIVE_YTD" }
              as: FacilityAdmin
              captures: { agr_a_id: $.data.id }
            - call: "POST /rac/concession-agreements/${agr_a_id}/execute"
              payload: {}
              as: FacilityAdmin
            - call: "POST /rac/transaction-day-reports"
              payload: { agreement_id: "${agr_a_id}", period_year: 2026, period_month: 1, reported_gross_revenue_cents: 5000000, reported_on_airport_transaction_days: 4000 }
              as: ConcessionaireOperator
              as_user_id: "${conc_a_id}"
              captures: { rep_id: $.data.id }
            - call: "POST /rac/transaction-day-reports/${rep_id}/submit"
              payload: {}
              as: ConcessionaireOperator
              as_user_id: "${conc_a_id}"
            - call: "POST /rac/cfc-remittances"
              payload: { agreement_id: "${agr_a_id}", report_id: "${rep_id}", remittance_basis: "PROVISIONAL" }
              as: ConcessionaireOperator
              as_user_id: "${conc_a_id}"
              captures: { rem_prov_id: $.data.id, rem_prov_expected: $.data.expected_amount_cents }
            - call: "POST /rac/transaction-day-reports/${rep_id}/begin-audit"
              payload: {}
              as: AuditOfficer
              as_user_id: "aud-1"
            - call: "POST /rac/transaction-day-reports/${rep_id}/accept"
              payload: { audited_gross_revenue_cents: 5000000, audited_on_airport_transaction_days: 5000 }
              as: AuditOfficer
