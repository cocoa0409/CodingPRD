scaffold_corner_design:
  # =========================================================================
  - section: entities
    instances:
      - name: create_tariff_returns_201_with_all_fields
        claim_type: Creation
        grounds: [entities.Tariff, endpoints]
        distinguishing_aspect: "POST /tariffs with all required fields returns 201, status DRAFT, and server-minted id/created_at/version=1."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /tariffs"
              payload: { code: "RES-COR-1", name: "Corner Tariff", fixed_charge_cents: 1000, tier_breakpoints_kwh: [500], tier_rates_cents_per_kwh: [12, 18], tou_multipliers: { ON_PEAK: 1.5, MID_PEAK: 1.0, OFF_PEAK: 0.8 }, demand_charge_cents_per_kw: 800, net_metering_credit_cents_per_kwh: 10 }
              as: BillingOperator
              captures: { tar_id: $.data.id, st: $.data.status, ver: $.data.version }
          assert:
            - "response code 201"
            - "Tariff.${tar_id}.status == DRAFT"
            - "Tariff.${tar_id}.version == 1"

      - name: get_account_not_found_returns_404
        claim_type: Not Found
        grounds: [entities.Account, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /accounts/{id} with a non-existent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /accounts/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: BillingOperator
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NOT_FOUND (http 404)"

      - name: create_account_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds: [entities.Account.fields.holder_name, "validations[priority=5]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /accounts omitting holder_name returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["ACTIVE tariff exists"]
          setup_api_calls:
            - call: "POST /tariffs"
              payload: { code: "RES-COR-2", name: "Corner 2", fixed_charge_cents: 1000, tier_breakpoints_kwh: [500], tier_rates_cents_per_kwh: [12, 18], tou_multipliers: { ON_PEAK: 1.5, MID_PEAK: 1.0, OFF_PEAK: 0.8 }, demand_charge_cents_per_kw: 800, net_metering_credit_cents_per_kwh: 10 }
              as: BillingOperator
              captures: { tar_id: $.data.id }
            - call: "POST /tariffs/${tar_id}/activate"
              payload: {}
              as: BillingOperator
          trigger:
            - call: "POST /accounts"
              payload: { tariff_id: "${tar_id}" }
              as: BillingOperator
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST (http 422)"

      - name: meter_type_default_applied_when_omitted
        claim_type: Defaults
        grounds: [entities.Meter.fields.meter_type]
        distinguishing_aspect: "POST /meters omitting meter_type defaults to BIDIRECTIONAL."
        test_recipe:
          setup: ["ACTIVE tariff + Account"]
          setup_api_calls:
            - call: "POST /tariffs"
              payload: { code: "RES-COR-3", name: "Corner 3", fixed_charge_cents: 1000, tier_breakpoints_kwh: [500], tier_rates_cents_per_kwh: [12, 18], tou_multipliers: { ON_PEAK: 1.5, MID_PEAK: 1.0, OFF_PEAK: 0.8 }, demand_charge_cents_per_kw: 800, net_metering_credit_cents_per_kwh: 10 }
              as: BillingOperator
              captures: { tar_id: $.data.id }
            - call: "POST /tariffs/${tar_id}/activate"
              payload: {}
              as: BillingOperator
            - call: "POST /accounts"
              payload: { tariff_id: "${tar_id}", holder_name: "Default Holder" }
              as: BillingOperator
              captures: { acct_id: $.data.id }
          trigger:
            - call: "POST /meters"
              payload: { account_id: "${acct_id}", serial: "MTR-DEF1" }
              as: BillingOperator
              captures: { mtr_id: $.data.id, mt: $.data.meter_type }
          assert:
            - "Meter.${mtr_id}.meter_type == BIDIRECTIONAL"

      - name: meter_read_computed_tou_period_and_demand_ignore_client_input
        claim_type: Computed Fields
        grounds: [entities.MeterRead.fields.tou_period, entities.MeterRead.fields.avg_demand_kw]
        distinguishing_aspect: "tou_period (ON_PEAK from hour 16) and avg_demand_kw (== import_kwh) are server-computed; client cannot set them."
        test_recipe:
          setup: ["ACTIVE tariff + Account + meter"]
          setup_api_calls:
            - call: "POST /tariffs"
              payload: { code: "RES-COR-4", name: "Corner 4", fixed_charge_cents: 1000, tier_breakpoints_kwh: [500], tier_rates_cents_per_kwh: [12, 18], tou_multipliers: { ON_PEAK: 1.5, MID_PEAK: 1.0, OFF_PEAK: 0.8 }, demand_charge_cents_per_kw: 800, net_metering_credit_cents_per_kwh: 10 }
              as: BillingOperator
              captures: { tar_id: $.data.id }
            - call: "POST /tariffs/${tar_id}/activate"
              payload: {}
              as: BillingOperator
            - call: "POST /accounts"
              payload: { tariff_id: "${tar_id}", holder_name: "Computed Holder" }
              as: BillingOperator
              captures: { acct_id: $.data.id }
            - call: "POST /meters"
              payload: { account_id: "${acct_id}", serial: "MTR-CMP1", meter_type: "BIDIRECTIONAL" }
              as: BillingOperator
              captures: { mtr_id: $.data.id }
          trigger:
            - call: "POST /meter-reads"
              payload: { meter_id: "${mtr_id}", interval_start: "2026-01-05T16:00:00Z", interval_end: "2026-01-05T17:00:00Z", import_kwh: 5.0, export_kwh: 0.0 }
              as: BillingOperator
              captures: { tp: $.data.tou_period, dk: $.data.avg_demand_kw }
          assert:
            - "MeterRead.tou_period == ON_PEAK"
            - "MeterRead.avg_demand_kw == 5.0"

      - name: meter_read_immutable_no_version_field
        claim_type: Immutability
        grounds: [entities.MeterRead]
        distinguishing_aspect: "MeterRead has common_fields:false — it exposes id and created_at only, no version, and has no update endpoint."
        test_recipe:
          setup: ["ACTIVE tariff + Account + meter + one read"]
          setup_api_calls:
            - call: "POST /tariffs"
              payload: { code: "RES-COR-5", name: "Corner 5", fixed_charge_cents: 1000, tier_breakpoints_kwh: [500], tier_rates_cents_per_kwh: [12, 18], tou_multipliers: { ON_PEAK: 1.5, MID_PEAK: 1.0, OFF_PEAK: 0.8 }, demand_charge_cents_per_kw: 800, net_metering_credit_cents_per_kwh: 10 }
              as: BillingOperator
              captures: { tar_id: $.data.id }
            - call: "POST /tariffs/${tar_id}/activate"
              payload: {}
              as: BillingOperator
            - call: "POST /accounts"
              payload: { tariff_id: "${tar_id}", holder_name: "Immutable Holder" }
              as: BillingOperator
              captures: { acct_id: $.data.id }
            - call: "POST /meters"
              payload: { account_id: "${acct_id}", serial: "MTR-IMM1", meter_type: "BIDIRECTIONAL" }
              as: BillingOperator
              captures: { mtr_id: $.data.id }
          trigger:
            - call: "POST /meter-reads"
              payload: { meter_id: "${mtr_id}", interval_start: "2026-01-05T16:00:00Z", interval_end: "2026-01-05T17:00:00Z", import_kwh: 5.0, export_kwh: 0.0 }
              as: BillingOperator
              captures: { rd_id: $.data.id }
          assert:
            - "MeterRead.${rd_id} response includes id and created_at but no version field"

      - name: account_balance_computed_from_bills_and_payments
        claim_type: Computed Fields
        grounds: [entities.Account.fields.balance_cents]
        distinguishing_aspect: "Account.balance_cents is computed = sum issued total_due minus applied payments; reflects 2756 after one issued bill, 0 after full payment."
        test_recipe:
          setup: ["Account with one issued bill total_due 2756"]
          setup_api_calls:
            - call: "POST /tariffs"
              payload: { code: "RES-COR-6", name: "Corner 6", fixed_charge_cents: 1000, tier_breakpoints_kwh: [500, 1000], tier_rates_cents_per_kwh: [12, 18, 25], tou_multipliers: { ON_PEAK: 1.5, MID_PEAK: 1.0, OFF_PEAK: 0.8 }, demand_charge_cents_per_kw: 800, net_metering_credit_cents_per_kwh: 10 }
              as: BillingOperator
              captures: { tar_id: $.data.id }
            - call: "POST /tariffs/${tar_id}/activate"
              payload: {}
              as: BillingOperator
            - call: "POST /accounts"
              payload: { tariff_id: "${tar_id}", holder_name: "Balance Holder" }
              as: BillingOperator
              captures: { acct_id: $.data.id }
            - call: "POST /meters"
              payload: { account_id: "${acct_id}", serial: "MTR-BAL1", meter_type: "BIDIRECTIONAL" }
              as: BillingOperator
              captures: { mtr_id: $.data.id }
            - call: "POST /meter-reads"
              payload: { meter_id: "${mtr_id}", interval_start: "2026-01-05T16:00:00Z", interval_end: "2026-01-05T17:00:00Z", import_kwh: 2.0, export_kwh: 0.0 }
              as: BillingOperator
            - call: "POST /meter-reads"
              payload: { meter_id: "${mtr_id}", interval_start: "2026-01-05T17:00:00Z", interval_end: "2026-01-05T18:00:00Z", import_kwh: 2.0, export_kwh: 0.0 }
              as: BillingOperator
            - call: "POST /meter-reads"
              payload: { meter_id: "${mtr_id}", interval_start: "2026-01-05T18:00:00Z", interval_end: "2026-01-05T19:00:00Z", import_kwh: 2.0, export_kwh: 0.0 }
              as: BillingOperator
            - call: "POST /meter-reads"
              payload: { meter_id: "${mtr_id}", interval_start: "2026-01-05T07:00:00Z", interval_end: "2026-01-05T08:00:00Z", import_kwh: 4.0, export_kwh: 0.0 }
              as: BillingOperator
            - call: "POST /bills"
              payload: { account_id: "${acct_id}", period_start: "2026-01-01T00:00:00Z", period_end: "2026-02-01T00:00:00Z", due_date: "2026-02-20T00:00:00Z" }
              as: BillingOperator
              captures: { bill_id: $.data.id, acct_v: $.data.version }
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: BillingOperator
              captures: { acctver_1: $.data.version }
            - call: "POST /bills/${bill_id}/issue"
              payload: { expected_account_version: "${acctver_1}" }
              as: BillingOperator
          trigger:
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: BillingOperator
              captures: { bal: $.data.balance_cents }
          assert:
            - "Account.${acct_id}.balance_cents == 2756"

      - name: create_meter_invalid_meter_type_enum_returns_invalid_request
        claim_type: Type Constraints
        grounds: [entities.Meter.fields.meter_type, "validations[priority=5]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /meters with meter_type not in {CONSUMPTION_ONLY,BIDIRECTIONAL} returns ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["ACTIVE tariff + Account"]
          setup_api_calls:
            - call: "POST /tariffs"
              payload: { code: "RES-COR-7", name: "Corner 7", fixed_charge_cents: 1000, tier_breakpoints_kwh: [500], tier_rates_cents_per_kwh: [12, 18], tou_multipliers: { ON_PEAK: 1.5, MID_PEAK: 1.0, OFF_PEAK: 0.8 }, demand_charge_cents_per_kw: 800, net_metering_credit_cents_per_kwh: 10 }
              as: BillingOperator
              captures: { tar_id: $.data.id }
            - call: "POST /tariffs/${tar_id}/activate"
              payload: {}
              as: BillingOperator
            - call: "POST /accounts"
              payload: { tariff_id: "${tar_id}", holder_name: "Enum Holder" }
              as: BillingOperator
              captures: { acct_id: $.data.id }
          trigger:
            - call: "POST /meters"
              payload: { account_id: "${acct_id}", serial: "MTR-ENUM1", meter_type: "SOLAR_ONLY" }
              as: BillingOperator
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST (http 422)"

  # =========================================================================
  - section: state_machines
    instances:
      - name: issue_already_issued_bill_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Bill.DRAFT_to_ISSUED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Re-issuing an already ISSUED bill returns ERR_INVALID_STATE (409); no second debit occurs."
        test_recipe:
          setup: ["Account with one ISSUED bill"]
          setup_api_calls:
            - call: "POST /tariffs"
              payload: { code: "RES-COR-8", name: "Corner 8", fixed_charge_cents: 1000, tier_breakpoints_kwh: [500, 1000], tier_rates_cents_per_kwh: [12, 18, 25], tou_multipliers: { ON_PEAK: 1.5, MID_PEAK: 1.0, OFF_PEAK: 0.8 }, demand_charge_cents_per_kw: 800, net_metering_credit_cents_per_kwh: 10 }
              as: BillingOperator
              captures: { tar_id: $.data.id }
            - call: "POST /tariffs/${tar_id}/activate"
              payload: {}
              as: BillingOperator
            - call: "POST /accounts"
              payload: { tariff_id: "${tar_id}", holder_name: "Reissue Holder" }
              as: BillingOperator
              captures: { acct_id: $.data.id }
            - call: "POST /meters"
              payload: { account_id: "${acct_id}", serial: "MTR-RIS1", meter_type: "BIDIRECTIONAL" }
              as: BillingOperator
              captures: { mtr_id: $.data.id }
            - call: "POST /meter-reads"
              payload: { meter_id: "${mtr_id}", interval_start: "2026-01-05T16:00:00Z", interval_end: "2026-01-05T17:00:00Z", import_kwh: 2.0, export_kwh: 0.0 }
              as: BillingOperator
            - call: "POST /bills"
              payload: { account_id: "${acct_id}", period_start: "2026-01-01T00:00:00Z", period_end: "2026-02-01T00:00:00Z", due_date: "2026-02-20T00:00:00Z" }
              as: BillingOperator
              captures: { bill_id: $.data.id, acct_v: $.data.version }
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: BillingOperator
              captures: { acctver_1: $.data.version }
            - call: "POST /bills/${bill_id}/issue"
              payload: { expected_account_version: "${acctver_1}" }
              as: BillingOperator
              captures: { acct_v2: $.data.version }
          trigger:
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: BillingOperator
              captures: { acctver_2: $.data.version }
            - call: "POST /bills/${bill_id}/issue"
              payload: { expected_account_version: "${acctver_2}" }
              as: BillingOperator
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE (http 409)"

      - name: void_paid_bill_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Bill.ISSUED_to_VOID, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Voiding a bill that has any payment applied (not ISSUED with amount_paid 0) returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["Account with one PAID bill total_due 2636"]
          setup_api_calls:
            - call: "POST /tariffs"
              payload: { code: "RES-COR-9", name: "Corner 9", fixed_charge_cents: 1000, tier_breakpoints_kwh: [500, 1000], tier_rates_cents_per_kwh: [12, 18, 25], tou_multipliers: { ON_PEAK: 1.5, MID_PEAK: 1.0, OFF_PEAK: 0.8 }, demand_charge_cents_per_kw: 800, net_metering_credit_cents_per_kwh: 10 }
              as: BillingOperator
              captures: { tar_id: $.data.id }
            - call: "POST /tariffs/${tar_id}/activate"
              payload: {}
              as: BillingOperator
            - call: "POST /accounts"
              payload: { tariff_id: "${tar_id}", holder_name: "VoidPaid Holder" }
              as: BillingOperator
              captures: { acct_id: $.data.id }
            - call: "POST /meters"
              payload: { account_id: "${acct_id}", serial: "MTR-VP1", meter_type: "BIDIRECTIONAL" }
              as: BillingOperator
              captures: { mtr_id: $.data.id }
            - call: "POST /meter-reads"
              payload: { meter_id: "${mtr_id}", interval_start: "2026-01-05T16:00:00Z", interval_end: "2026-01-05T17:00:00Z", import_kwh: 2.0, export_kwh: 0.0 }
              as: BillingOperator
            - call: "POST /bills"
              payload: { account_id: "${acct_id}", period_start: "2026-01-01T00:00:00Z", period_end: "2026-02-01T00:00:00Z", due_date: "2026-02-20T00:00:00Z" }
              as: BillingOperator
              captures: { bill_id: $.data.id, acct_v: $.data.version }
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: BillingOperator
              captures: { acctver_1: $.data.version }
            - call: "POST /bills/${bill_id}/issue"
              payload: { expected_account_version: "${acctver_1}" }
              as: BillingOperator
            - call: "POST /payments"
              payload: { account_id: "${acct_id}", amount_cents: 2636, method: "ACH" }
              as: Customer
              as_user_id: "${acct_id}"
          trigger:
            - call: "POST /bills/${bill_id}/void"
              payload: {}
              as: BillingOperator
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE (http 409)"
            - "Bill.${bill_id}.status == PAID (unchanged)"

      - name: complete_service_order_twice_returns_invalid_state
        claim_type: Idempotency
        grounds: [state_machines.ServiceOrder.SCHEDULED_to_COMPLETED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Completing an already COMPLETED service order (terminal) returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["Account IN_ARREARS -> disconnect-notice -> a SCHEDULED DISCONNECT order, then completed once"]
          setup_api_calls:
            - call: "POST /tariffs"
              payload: { code: "RES-COR-10", name: "Corner 10", fixed_charge_cents: 1000, tier_breakpoints_kwh: [500, 1000], tier_rates_cents_per_kwh: [12, 18, 25], tou_multipliers: { ON_PEAK: 1.5, MID_PEAK: 1.0, OFF_PEAK: 0.8 }, demand_charge_cents_per_kw: 800, net_metering_credit_cents_per_kwh: 10 }
              as: BillingOperator
              captures: { tar_id: $.data.id }
            - call: "POST /tariffs/${tar_id}/activate"
              payload: {}
              as: BillingOperator
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-01T00:00:00Z" }
              as: BillingOperator
            - call: "POST /accounts"
              payload: { tariff_id: "${tar_id}", holder_name: "DoubleComplete Holder" }
              as: BillingOperator
              captures: { acct_id: $.data.id }
            - call: "POST /meters"
              payload: { account_id: "${acct_id}", serial: "MTR-DC1", meter_type: "BIDIRECTIONAL" }
              as: BillingOperator
              captures: { mtr_id: $.data.id }
            - call: "POST /meter-reads"
              payload: { meter_id: "${mtr_id}", interval_start: "2026-01-05T16:00:00Z", interval_end: "2026-01-05T17:00:00Z", import_kwh: 2.0, export_kwh: 0.0 }
              as: BillingOperator
            - call: "POST /bills"
              payload: { account_id: "${acct_id}", period_start: "2026-01-01T00:00:00Z", period_end: "2026-02-01T00:00:00Z", due_date: "2026-01-01T00:00:00Z" }
              as: BillingOperator
              captures: { bill_id: $.data.id, acct_v: $.data.version }
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: BillingOperator
              captures: { acctver_1: $.data.version }
            - call: "POST /bills/${bill_id}/issue"
              payload: { expected_account_version: "${acctver_1}" }
              as: BillingOperator
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-02-15T00:00:00Z" }
              as: BillingOperator
            - call: "POST /accounts/${acct_id}/disconnect-notice"
              payload: {}
              as: BillingOperator
              captures: { so_id: $.data.id }
            - call: "POST /service-orders/${so_id}/complete"
              payload: {}
              as: FieldDispatcher
          trigger:
            - call: "POST /service-orders/${so_id}/complete"
              payload: {}
              as: FieldDispatcher
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE (http 409)"
            - "ServiceOrder.${so_id}.status == COMPLETED"

      - name: retire_draft_tariff_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Tariff.ACTIVE_to_RETIRED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Retiring a DRAFT (never-activated) tariff returns ERR_INVALID_STATE — retire is only defined from ACTIVE."
        test_recipe:
          setup: ["A DRAFT tariff that was never activated"]
          setup_api_calls:
            - call: "POST /tariffs"
              payload: { code: "RES-COR-11", name: "Corner 11", fixed_charge_cents: 1000, tier_breakpoints_kwh: [500], tier_rates_cents_per_kwh: [12, 18], tou_multipliers: { ON_PEAK: 1.5, MID_PEAK: 1.0, OFF_PEAK: 0.8 }, demand_charge_cents_per_kw: 800, net_metering_credit_cents_per_kwh: 10 }
              as: BillingOperator
              captures: { tar_id: $.data.id }
          trigger:
            - call: "POST /tariffs/${tar_id}/retire"
              payload: {}
              as: BillingOperator
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE (http 409)"
            - "Tariff.${tar_id}.status == DRAFT"

      - name: newly_created_account_starts_active_and_current
        claim_type: Initial State
        grounds: [entities.Account.fields.service_status, entities.Account.fields.financial_status]
        distinguishing_aspect: "A freshly created account initializes service_status ACTIVE, financial_status CURRENT, balance 0."
        test_recipe:
          setup: ["ACTIVE tariff"]
          setup_api_calls:
            - call: "POST /tariffs"
              payload: { code: "RES-COR-12", name: "Corner 12", fixed_charge_cents: 1000, tier_breakpoints_kwh: [500], tier_rates_cents_per_kwh: [12, 18], tou_multipliers: { ON_PEAK: 1.5, MID_PEAK: 1.0, OFF_PEAK: 0.8 }, demand_charge_cents_per_kw: 800, net_metering_credit_cents_per_kwh: 10 }
              as: BillingOperator
              captures: { tar_id: $.data.id }
            - call: "POST /tariffs/${tar_id}/activate"
              payload: {}
              as: BillingOperator
          trigger:
            - call: "POST /accounts"
              payload: { tariff_id: "${tar_id}", holder_name: "Init Holder" }
              as: BillingOperator
              captures: { acct_id: $.data.id, ss: $.data.service_status, fs: $.data.financial_status, bal: $.data.balance_cents }
          assert:
            - "Account.${acct_id}.service_status == ACTIVE"
            - "Account.${acct_id}.financial_status == CURRENT"
            - "Account.${acct_id}.balance_cents == 0"

      - name: reconnect_request_on_active_account_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Account.DISCONNECTED_to_RECONNECT_PENDING, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "reconnect-request on an account whose service_status is ACTIVE (not DISCONNECTED) returns ERR_INVALID_STATE."
        test_recipe:
