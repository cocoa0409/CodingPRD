# =============================================================================
# SCAFFOLD — Ski & Snowboard Tune & Rental Shop (task 0960)
# §1.0–§1.7 seed tables. Difficulty target: beyond-Expert (dense coupling).
# =============================================================================

scenario: |
  960. Ski & Snowboard Tune & Rental Shop: rental fitment & reservation,
  tune/wax/edge service ticket, junior season-lease program, demo & upgrade,
  damage/deposit, slope-side pickup, turnaround & rush, inventory

domain_name: ski-snowboard-tune-rental
api_prefix: /shop

complexity_profile:
  primary_archetype: quota_allocation        # finite equipment pool competed for by reservations, leases, demos, purchases
  secondary_archetype: temporal_windowing    # date-window occupancy on equipment, half-open pickup windows
  complexity_layers:
    - optimistic_concurrency                 # OCC on TuneTicket.version (approve) and SeasonLease.version (swap)
    - cascading_side_effects                 # damage invoice -> deposit capture -> standing -> lease suspension
    - dual_variant_calculation               # quoted-vs-final rental charge; straight-line-vs-usage lease buyout
    - rate_threshold_triggers                # rush capacity boundary, junior age boundary, discount day-tiers, standing thresholds
    - selector_policy                        # auto-assign of equipment from eligible pool with ranking + queue fallback
  entity_topology: flat                      # peer entities joined by FK references, flat URL space under /shop
  state_machine_shape: parallel              # Reservation payment_status x fulfillment_status; plus cyclic machines elsewhere
  relationship_patterns:
    - one_to_many                            # Customer -> Reservations, Reservation -> ReservationItems
    - cross_aggregate                        # DamageAssessment -> Reservation + EquipmentItem; PurchaseOrder -> DemoCredit
  role_model: hierarchical_override          # Customer < FrontDesk/Technician peers < Manager superset
  consistency_model: immediate               # all side effects visible in the triggering request's response/read-after-write

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# All entities common_fields: true -> id (server UUID, identity only, NEVER used
# in ranking/tie-break), created_at, updated_at, version (starts 1, +1 per mutation).
# =============================================================================
entities:
  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Customer full name" }
      - { name: email, type: string, source: input, description: "Email, unique across customers" }
      - { name: date_of_birth, type: string, source: input, description: "ISO date YYYY-MM-DD; drives junior-age and DIN age adjustment" }
      - { name: height_cm, type: number, source: input, description: "Skier height; DIN input" }
      - { name: weight_kg, type: number, source: input, description: "Skier weight; DIN input" }
      - { name: boot_sole_mm, type: integer, source: input, description: "Boot sole length in mm; DIN input" }
      - { name: skier_type, type: enum, source: input, description: "TYPE_1 | TYPE_2 | TYPE_3 (cautious / moderate / aggressive)" }
      - { name: standing, type: enum, source: computed, default: GOOD_STANDING, description: "GOOD_STANDING | WATCH | BARRED; recomputed by customer_standing calc on damage invoice/pay/resolve and on late returns" }
      - { name: late_return_count, type: integer, source: computed, default: 0, description: "+1 each time a reservation is returned with any line late_days > 0" }

  - name: EquipmentItem
    parent: null
    common_fields: true
    fields:
      - { name: gear_type, type: enum, source: input, description: "SKI | SNOWBOARD | BOOT | POLES" }
      - { name: size_label, type: string, source: input, description: "Human size label, e.g. 170cm / 26.5" }
      - { name: tier, type: enum, source: input, description: "STANDARD | PERFORMANCE | DEMO | JUNIOR" }
      - { name: status, type: enum, source: system, default: AVAILABLE, description: "AVAILABLE | RESERVED | OUT | AWAITING_INSPECTION | IN_SERVICE | RETIRED | LOST | SOLD" }
      - { name: din_min, type: number, source: input, description: "Lowest DIN setting the binding supports" }
      - { name: din_max, type: number, source: input, description: "Highest DIN setting the binding supports" }
      - { name: purchase_price_cents, type: integer, source: input, description: "Original retail price; basis for damage charge and demo/lease valuations" }
      - { name: base_daily_rate_cents, type: integer, source: input, description: "Daily rental rate snapshotted onto ReservationItem at assignment" }
      - { name: accrued_rental_days, type: integer, source: computed, default: 0, description: "Cumulative days rented: += actual days per rental return and += lease days at season-lease close" }

  - name: Reservation
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; renter" }
      - { name: start_date, type: string, source: input, description: "First rental day, ISO date, inclusive" }
      - { name: end_date, type: string, source: input, description: "Last planned rental day, ISO date, inclusive; must be >= start_date" }
      - { name: pickup_method, type: enum, source: input, description: "SHOP | SLOPE_SIDE" }
      - { name: fulfillment_status, type: enum, source: system, default: DRAFT, description: "DRAFT | CONFIRMED | ACTIVE | OVERDUE | RETURNED | CLOSED | CANCELLED (independent axis)" }
      - { name: payment_status, type: enum, source: system, default: UNPAID, description: "UNPAID | AUTHORIZED | CAPTURED | SETTLED | VOIDED (independent axis)" }
      - { name: quoted_total_cents, type: integer, source: computed, default: 0, description: "Provisional forward-looking quote over ASSIGNED items; recomputed on assign/release/confirm" }
      - { name: deposit_minimum_cents, type: integer, source: computed, default: 0, description: "round_half_up(0.20 * quoted_total_cents); floor for confirm" }
      - { name: final_total_cents, type: integer, source: computed, description: "Chronological actual charge incl. late fees; set at return, null before" }
      - { name: deposit_authorized_cents, type: integer, source: input, default: 0, description: "Hold amount supplied at confirm" }
      - { name: deposit_captured_cents, type: integer, source: computed, default: 0, description: "Portion of the hold taken by damage invoices; waterfall calc" }
      - { name: deposit_released_cents, type: integer, source: computed, default: 0, description: "Set at close/cancel so that authorized == captured + released" }

  - name: ReservationItem
    parent: null
    common_fields: true
    fields:
      - { name: reservation_id, type: string, source: input, description: "FK -> Reservation.id" }
      - { name: equipment_item_id, type: string, source: system, description: "FK -> EquipmentItem.id; nullable while QUEUED; set by assign/promotion" }
      - { name: gear_type_requested, type: enum, source: input, description: "SKI | SNOWBOARD | BOOT | POLES" }
      - { name: tier_requested, type: enum, source: input, description: "STANDARD | PERFORMANCE | DEMO | JUNIOR" }
      - { name: status, type: enum, source: system, default: QUEUED, description: "QUEUED | ASSIGNED | RELEASED | RETURNED" }
      - { name: daily_rate_cents, type: integer, source: computed, description: "Snapshot of EquipmentItem.base_daily_rate_cents at assignment; null while QUEUED" }
      - { name: din_setting, type: number, source: computed, description: "Fitment DIN computed for the reservation's customer at assignment; null while QUEUED" }
      - { name: assigned_at, type: datetime, source: computed, description: "Logical-clock timestamp of assignment; null while QUEUED" }
      - { name: planned_days, type: integer, source: computed, description: "(end_date - start_date) + 1 of the parent reservation" }
      - { name: actual_days, type: integer, source: computed, description: "Inclusive days from start_date through return date; set at return" }
      - { name: late_days, type: integer, source: computed, description: "max(0, actual_days - planned_days); set at return" }
      - { name: line_final_cents, type: integer, source: computed, description: "Per-line final charge incl. late fee, rounded per line; set at return" }

  - name: TuneTicket
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; ticket owner" }
      - { name: equipment_item_id, type: string, source: input, description: "FK -> EquipmentItem.id; nullable; exactly one of equipment_item_id / own_gear_description required" }
      - { name: own_gear_description, type: string, source: input, description: "Free-text description of customer-owned gear; nullable" }
      - { name: services, type: array, source: input, description: "Non-empty array of WAX | EDGE_TUNE | BASE_GRIND | BINDING_ADJUST" }
      - { name: rush, type: boolean, source: input, default: false, description: "Rush 24h turnaround; consumes rush capacity" }
      - { name: parts_surcharge_cents, type: integer, source: input, default: 0, description: "Extra parts cost set by technician at quote/re-quote" }
      - { name: labor_minutes, type: integer, source: computed, description: "Sum of service labor minutes (WAX 45, EDGE_TUNE 60, BASE_GRIND 90, BINDING_ADJUST 30)" }
      - { name: status, type: enum, source: system, default: INTAKE, description: "INTAKE | QUOTED | APPROVED | IN_PROGRESS | QUALITY_CHECK | READY | PICKED_UP | CANCELLED" }
      - { name: promised_at, type: datetime, source: computed, description: "created_at + 24h if rush else + 48h" }
      - { name: quoted_price_cents, type: integer, source: computed, description: "Set by tune_quote calc at quote; null in INTAKE" }
      - { name: final_price_cents, type: integer, source: computed, description: "Set at qc-pass; equals quoted_price_cents (rework is free); null before" }
      - { name: rework_count, type: integer, source: computed, default: 0, description: "+1 per qc-fail; hard limit 2" }
      - { name: junior_discount_applied, type: boolean, source: computed, default: false, description: "True when the 0.8 junior-lease multiplier was applied to the quote" }

  - name: SeasonLease
    parent: null
    common_fields: true
    fields:
      - { name: junior_customer_id, type: string, source: input, description: "FK -> Customer.id; the junior lessee (age <= 12 at season_start_date)" }
      - { name: guardian_customer_id, type: string, source: input, description: "FK -> Customer.id; adult guardian, must differ from junior" }
      - { name: season_start_date, type: string, source: input, description: "ISO date; season window start" }
      - { name: season_end_date, type: string, source: input, description: "ISO date; must be > season_start_date" }
      - { name: package_tier, type: enum, source: input, description: "JUNIOR_SKI | JUNIOR_BOARD" }
      - { name: deposit_cents, type: integer, source: input, description: "Refundable lease deposit; fully released at close" }
      - { name: equipment_item_id, type: string, source: system, description: "FK -> EquipmentItem.id; currently leased unit; null until activate" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | ACTIVE | SUSPENDED | SETTLED" }
      - { name: swap_count, type: integer, source: computed, default: 0, description: "+1 per swap; hard limit 2" }
      - { name: activated_at, type: datetime, source: computed, description: "Logical-clock timestamp of activation; null while DRAFT" }
      - { name: buyout_price_straight_line_cents, type: integer, source: computed, description: "Straight-line season-fraction depreciation variant; computed at close" }
      - { name: buyout_price_usage_cents, type: integer, source: computed, description: "Usage-weighted depreciation variant over lease days; computed at close" }

  - name: DemoCredit
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id" }
      - { name: equipment_item_id, type: string, source: input, description: "FK -> EquipmentItem.id; must be tier DEMO" }
      - { name: demo_date, type: string, source: input, description: "ISO date the demo fee was paid" }
      - { name: fee_paid_cents, type: integer, source: input, description: "Demo day fee; > 0" }
      - { name: credit_cents, type: integer, source: computed, description: "= fee_paid_cents (100% of demo fee becomes purchase credit)" }
      - { name: expires_at, type: datetime, source: computed, description: "demo_date + 90 days at 00:00:00Z" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | REDEEMED | EXPIRED" }

  - name: PurchaseOrder
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id" }
      - { name: equipment_item_id, type: string, source: input, description: "FK -> EquipmentItem.id; unit being bought; must be AVAILABLE" }
      - { name: demo_credit_id, type: string, source: input, description: "FK -> DemoCredit.id; optional; must belong to customer and be ACTIVE and unexpired" }
      - { name: list_price_cents, type: integer, source: computed, description: "purchase_price_cents x 0.75 for DEMO tier, else x 1.00" }
      - { name: credit_applied_cents, type: integer, source: computed, description: "min(sum of applicable demo credits, round_half_up(0.30 x list_price_cents))" }
      - { name: amount_due_cents, type: integer, source: computed, description: "list_price_cents - credit_applied_cents" }
      - { name: status, type: enum, source: system, default: PENDING, description: "PENDING | PAID | FULFILLED | CANCELLED" }

  - name: DamageAssessment
    parent: null
    common_fields: true
    fields:
      - { name: reservation_id, type: string, source: input, description: "FK -> Reservation.id; reservation must be RETURNED (not yet CLOSED)" }
      - { name: equipment_item_id, type: string, source: input, description: "FK -> EquipmentItem.id; must have been an item of that reservation" }
      - { name: severity, type: enum, source: input, description: "COSMETIC | MINOR | MAJOR | TOTAL_LOSS" }
      - { name: notes, type: string, source: input, description: "Optional technician notes" }
      - { name: charge_cents, type: integer, source: computed, description: "damage_charge calc: nested min of severity matrix vs depreciated value" }
      - { name: deposit_captured_cents, type: integer, source: computed, default: 0, description: "Amount taken from the reservation deposit at invoice" }
      - { name: remainder_due_cents, type: integer, source: computed, description: "charge_cents - deposit_captured_cents; settled via pay" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | INVOICED | DISPUTED | PAID | WAIVED" }

  - name: PickupWindow
    parent: null
    common_fields: true
    fields:
      - { name: service_date, type: string, source: input, description: "ISO date of the slope-side window" }
      - { name: start_time, type: string, source: input, description: "HH:MM (24h); half-open interval start" }
      - { name: end_time, type: string, source: input, description: "HH:MM (24h); half-open interval end; must be > start_time" }
      - { name: location_label, type: string, source: input, description: "Slope-side location; uniqueness scope for overlap" }
      - { name: van_capacity, type: integer, source: input, description: "Max bookings the van can serve in this window; > 0" }
      - { name: booked_count, type: integer, source: computed, default: 0, description: "Count of PickupBookings in BOOKED status" }
      - { name: posture, type: enum, source: computed, default: OPEN, description: "OPEN | FULL | CLOSED; derived: CLOSED when now >= window end, FULL when booked_count >= van_capacity, else OPEN" }

  - name: PickupBooking
    parent: null
    common_fields: true
    fields:
      - { name: pickup_window_id, type: string, source: input, description: "FK -> PickupWindow.id" }
      - { name: reservation_id, type: string, source: input, description: "FK -> Reservation.id; must be fulfillment_status CONFIRMED" }
      - { name: status, type: enum, source: system, default: BOOKED, description: "BOOKED | COMPLETED | NO_SHOW | CANCELLED" }

  - name: ShopDayCapacity
    parent: null
    common_fields: true
    fields:
      - { name: service_date, type: string, source: input, description: "ISO date; unique across ShopDayCapacity rows" }
      - { name: base_labor_minutes, type: integer, source: input, description: "Standard labor pool for the day" }
      - { name: rush_reserved_minutes, type: integer, source: input, description: "Rush-only labor pool for the day; <= base_labor_minutes" }
      - { name: booked_minutes, type: integer, source: computed, default: 0, description: "Standard minutes consumed at ticket start and re-consumed at qc-fail" }
      - { name: rush_booked_minutes, type: integer, source: computed, default: 0, description: "Rush minutes consumed at rush-ticket creation" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: EquipmentItem
    initial_state: AVAILABLE
    terminal_states: [RETIRED, LOST, SOLD]
    transitions:
      - from: AVAILABLE
        to: RESERVED
        trigger: "POST /shop/reservation-items/{id}/assign (auto or preferred), waitlist promotion, or POST /shop/purchase-orders"
        actor: FrontDesk
        preconditions:
          - "For rental assign: gear_type and tier match the ReservationItem request; din_min <= computed din_setting <= din_max; no occupancy conflict (closed date intervals with mandatory 1 free day between windows)"
          - "For purchase: unit AVAILABLE"
        side_effects:
          - "ReservationItem.status QUEUED -> ASSIGNED with daily_rate_cents, din_setting, assigned_at snapshots; Reservation.quoted_total_cents recomputed"
      - { from: RESERVED, to: OUT, trigger: "POST /shop/reservations/{id}/pickup", actor: FrontDesk, preconditions: ["Reservation fulfillment CONFIRMED"], side_effects: ["All ASSIGNED items of the reservation flip their units RESERVED -> OUT"] }
      - { from: RESERVED, to: AVAILABLE, trigger: "POST /shop/reservation-items/{id}/release, reservation cancel cascade, or purchase-order cancel", actor: FrontDesk, preconditions: [], side_effects: ["Releasing mutation triggers waitlist promotion: oldest-created compatible QUEUED ReservationItem is assigned to this unit, flipping it back to RESERVED when a match exists"] }
      - { from: OUT, to: AWAITING_INSPECTION, trigger: "POST /shop/reservations/{id}/return or POST /shop/season-leases/{id}/close", actor: FrontDesk, preconditions: [], side_effects: ["accrued_rental_days += actual rental days (or lease days at lease close)"] }
      - { from: AWAITING_INSPECTION, to: AVAILABLE, trigger: "POST /shop/equipment-items/{id}/inspect with outcome PASS", actor: Technician, preconditions: [], side_effects: [] }
      - { from: AWAITING_INSPECTION, to: IN_SERVICE, trigger: "POST /shop/equipment-items/{id}/inspect with outcome NEEDS_TUNE or DAMAGED", actor: Technician, preconditions: [], side_effects: [] }
      - { from: IN_SERVICE, to: AVAILABLE, trigger: "POST /shop/equipment-items/{id}/service-complete", actor: Technician, preconditions: [], side_effects: [] }
      - { from: AVAILABLE, to: OUT, trigger: "POST /shop/season-leases/{id}/activate or /swap (new unit)", actor: FrontDesk, preconditions: ["Unit tier JUNIOR and gear_type matches package_tier"], side_effects: [] }
      - { from: OUT, to: IN_SERVICE, trigger: "POST /shop/season-leases/{id}/swap (old unit)", actor: FrontDesk, preconditions: [], side_effects: ["Old leased unit goes straight to service before re-stock"] }
      - { from: AWAITING_INSPECTION, to: LOST, trigger: "DamageAssessment invoice with severity TOTAL_LOSS", actor: FrontDesk, preconditions: [], side_effects: ["Unit leaves the rentable fleet"] }
      - { from: AVAILABLE, to: RETIRED, trigger: "POST /shop/equipment-items/{id}/retire", actor: Manager, preconditions: ["No ASSIGNED ReservationItem references this unit"], side_effects: [] }
      - { from: RESERVED, to: SOLD, trigger: "POST /shop/purchase-orders/{id}/fulfill", actor: FrontDesk, preconditions: ["PurchaseOrder PAID"], side_effects: [] }

  - entity: Reservation
    initial_state: "fulfillment DRAFT / payment UNPAID"
    terminal_states: ["fulfillment CLOSED or CANCELLED", "payment SETTLED or VOIDED"]
    transitions:
      - { from: "DRAFT/UNPAID", to: "CONFIRMED/AUTHORIZED", trigger: "POST /shop/reservations/{id}/confirm", actor: Customer, preconditions: ["fulfillment DRAFT", "at least one ASSIGNED item (QUEUED items may remain; they block pickup instead)", "deposit_authorized_cents >= deposit_minimum_cents"], side_effects: ["quoted_total_cents frozen as the confirmed quote", "deposit hold recorded"] }
      - { from: "DRAFT or CONFIRMED", to: "CANCELLED (+ payment VOIDED if AUTHORIZED)", trigger: "POST /shop/reservations/{id}/cancel", actor: Customer, preconditions: [], side_effects: ["Every ASSIGNED ReservationItem -> RELEASED and its unit RESERVED -> AVAILABLE; each unit release itself triggers waitlist promotion of compatible QUEUED items (transitive cascade)", "deposit_released_cents = deposit_authorized_cents - deposit_captured_cents"] }
      - { from: "CONFIRMED/AUTHORIZED", to: "ACTIVE (payment unchanged)", trigger: "POST /shop/reservations/{id}/pickup", actor: FrontDesk, preconditions: ["No QUEUED items remain (ERR_ITEMS_UNASSIGNED)"], side_effects: ["Units of ASSIGNED items RESERVED -> OUT"] }
      - { from: "ACTIVE", to: "OVERDUE (payment unchanged)", trigger: "System: logical clock advances past end_date while ACTIVE (evaluated on clock-set sweep and on read)", actor: system, preconditions: ["current date > end_date"], side_effects: [] }
      - { from: "ACTIVE or OVERDUE", to: "RETURNED/CAPTURED", trigger: "POST /shop/reservations/{id}/return", actor: FrontDesk, preconditions: [], side_effects: ["Units OUT -> AWAITING_INSPECTION", "Per-line final charge (chronological variant) computed; Reservation.final_total_cents = sum of line_final_cents", "EquipmentItem.accrued_rental_days += actual days", "Customer.late_return_count += 1 when any line late_days > 0, then standing recompute"] }
      - { from: "RETURNED/CAPTURED", to: "CLOSED/SETTLED", trigger: "POST /shop/reservations/{id}/close", actor: FrontDesk, preconditions: ["No unit of the reservation still OUT or AWAITING_INSPECTION (ERR_ITEMS_PENDING_INSPECTION)"], side_effects: ["deposit_settlement waterfall: deposit_released_cents = deposit_authorized_cents - deposit_captured_cents (invariant authorized == captured + released)"] }

  - entity: ReservationItem
    initial_state: QUEUED
    terminal_states: [RELEASED, RETURNED]
    transitions:
      - { from: QUEUED, to: ASSIGNED, trigger: "POST /shop/reservation-items/{id}/assign or waitlist promotion side effect", actor: FrontDesk, preconditions: ["Parent reservation fulfillment IN {DRAFT, CONFIRMED}", "An eligible unit exists (selector policy) or preferred_equipment_item_id is eligible"], side_effects: ["Unit AVAILABLE -> RESERVED", "daily_rate_cents/din_setting/assigned_at snapshots", "Reservation.quoted_total_cents recomputed"] }
      - { from: ASSIGNED, to: RELEASED, trigger: "POST /shop/reservation-items/{id}/release or reservation cancel cascade", actor: FrontDesk, preconditions: ["Parent reservation fulfillment IN {DRAFT, CONFIRMED}"], side_effects: ["Unit RESERVED -> AVAILABLE when no remaining assigned window", "Waitlist promotion (transitive link 2)"] }
      - { from: ASSIGNED, to: RETURNED, trigger: "POST /shop/reservations/{id}/return cascade", actor: FrontDesk, preconditions: [], side_effects: ["line_final_cents computed per rounding-pinned formula"] }

  - entity: TuneTicket
    initial_state: INTAKE
    terminal_states: [PICKED_UP, CANCELLED]
    transitions:
      - { from: INTAKE, to: QUOTED, trigger: "POST /shop/tune-tickets/{id}/quote", actor: Technician, preconditions: [], side_effects: ["tune_quote calc sets quoted_price_cents and junior_discount_applied"] }
      - { from: QUOTED, to: QUOTED, trigger: "POST /shop/tune-tickets/{id}/quote (re-quote)", actor: Technician, preconditions: [], side_effects: ["quoted_price_cents recomputed with new parts_surcharge_cents", "TuneTicket.version + 1 (invalidates outstanding customer approvals)"] }
      - { from: QUOTED, to: APPROVED, trigger: "POST /shop/tune-tickets/{id}/approve", actor: Customer, preconditions: ["expected_tune_ticket_version == current version (OCC)"], side_effects: ["TuneTicket.version + 1"] }
      - { from: APPROVED, to: IN_PROGRESS, trigger: "POST /shop/tune-tickets/{id}/start", actor: Technician, preconditions: ["ShopDayCapacity for date(created_at) has booked_minutes + labor_minutes <= base_labor_minutes"], side_effects: ["ShopDayCapacity.booked_minutes += labor_minutes"] }
      - { from: IN_PROGRESS, to: QUALITY_CHECK, trigger: "POST /shop/tune-tickets/{id}/complete", actor: Technician, preconditions: [], side_effects: [] }
      - { from: QUALITY_CHECK, to: READY, trigger: "POST /shop/tune-tickets/{id}/qc-pass", actor: Technician, preconditions: [], side_effects: ["final_price_cents = quoted_price_cents"] }
      - { from: QUALITY_CHECK, to: IN_PROGRESS, trigger: "POST /shop/tune-tickets/{id}/qc-fail (rework loop)", actor: Technician, preconditions: ["rework_count < 2 (ERR_REWORK_LIMIT_EXCEEDED)", "ShopDayCapacity standard capacity available for re-booking"], side_effects: ["rework_count += 1", "ShopDayCapacity.booked_minutes += labor_minutes (rework consumes capacity again)"] }
      - { from: READY, to: PICKED_UP, trigger: "POST /shop/tune-tickets/{id}/pickup", actor: Customer, preconditions: [], side_effects: [] }
      - { from: "INTAKE or QUOTED", to: CANCELLED, trigger: "POST /shop/tune-tickets/{id}/cancel", actor: Customer, preconditions: [], side_effects: ["Rush minutes reserved at creation are returned: rush_booked_minutes -= labor_minutes when rush"] }

  - entity: SeasonLease
    initial_state: DRAFT
    terminal_states: [SETTLED]
    transitions:
      - { from: DRAFT, to: ACTIVE, trigger: "POST /shop/season-leases/{id}/activate", actor: FrontDesk, preconditions: ["Junior age <= 12 at season_start_date (re-checked)", "Unit AVAILABLE, tier JUNIOR, gear matches package_tier"], side_effects: ["Unit AVAILABLE -> OUT for the season", "activated_at stamped"] }
      - { from: ACTIVE, to: ACTIVE, trigger: "POST /shop/season-leases/{id}/swap (growth swap)", actor: FrontDesk, preconditions: ["expected_season_lease_version == current version (OCC)", "swap_count < 2 (ERR_SWAP_LIMIT_EXCEEDED)", "New unit AVAILABLE, tier JUNIOR, gear matches"], side_effects: ["Old unit OUT -> IN_SERVICE", "New unit AVAILABLE -> OUT", "swap_count += 1", "SeasonLease.version + 1"] }
      - { from: ACTIVE, to: SUSPENDED, trigger: "System cascade: lessee Customer.standing recomputed to BARRED", actor: system, preconditions: ["Customer.standing == BARRED after damage invoice"], side_effects: ["Lease cannot swap while SUSPENDED"] }
      - { from: SUSPENDED, to: ACTIVE, trigger: "POST /shop/season-leases/{id}/reinstate", actor: Manager, preconditions: ["junior Customer.standing != BARRED"], side_effects: [] }
      - { from: "ACTIVE or SUSPENDED", to: SETTLED, trigger: "POST /shop/season-leases/{id}/close", actor: FrontDesk, preconditions: [], side_effects: ["Unit OUT -> AWAITING_INSPECTION", "EquipmentItem.accrued_rental_days += lease days elapsed", "season_lease_buyout calc sets buyout_price_straight_line_cents and buyout_price_usage_cents", "deposit_cents released in full"] }

  - entity: DemoCredit
    initial_state: ACTIVE
    terminal_states: [REDEEMED, EXPIRED]
    transitions:
      - { from: ACTIVE, to: REDEEMED, trigger: "POST /shop/purchase-orders/{id}/pay on an order that applied this credit", actor: Customer, preconditions: [], side_effects: [] }
      - { from: ACTIVE, to: EXPIRED, trigger: "System: logical clock >= expires_at (evaluated on clock-set sweep and on read/use)", actor: system, preconditions: [], side_effects: [] }

  - entity: PurchaseOrder
    initial_state: PENDING
    terminal_states: [FULFILLED, CANCELLED]
    transitions:
      - { from: PENDING, to: PAID, trigger: "POST /shop/purchase-orders/{id}/pay", actor: Customer, preconditions: [], side_effects: ["Every DemoCredit applied to this order -> REDEEMED"] }
      - { from: PAID, to: FULFILLED, trigger: "POST /shop/purchase-orders/{id}/fulfill", actor: FrontDesk, preconditions: [], side_effects: ["EquipmentItem RESERVED -> SOLD"] }
      - { from: PENDING, to: CANCELLED, trigger: "POST /shop/purchase-orders/{id}/cancel", actor: Customer, preconditions: [], side_effects: ["EquipmentItem RESERVED -> AVAILABLE (compensation; credits untouched)"] }

  - entity: DamageAssessment
    initial_state: DRAFT
    terminal_states: [PAID, WAIVED]
    transitions:
      - { from: DRAFT, to: INVOICED, trigger: "POST /shop/damage-assessments/{id}/invoice", actor: FrontDesk, preconditions: ["Reservation fulfillment RETURNED (not yet CLOSED)"], side_effects: ["Link 1: Reservation.deposit_captured_cents += min(charge_cents, deposit_authorized_cents - deposit_captured_cents); assessment deposit_captured_cents / remainder_due_cents set", "Link 2: that Reservation mutation triggers customer_standing recompute on the renter (BARRED on unpaid INVOICED TOTAL_LOSS; WATCH on any unpaid INVOICED or late_return_count >= 3)", "Link 3: standing -> BARRED itself suspends every ACTIVE SeasonLease of that customer (ACTIVE -> SUSPENDED)", "Fan-out: severity TOTAL_LOSS flips the unit AWAITING_INSPECTION -> LOST"] }
      - { from: INVOICED, to: PAID, trigger: "POST /shop/damage-assessments/{id}/pay", actor: Customer, preconditions: [], side_effects: ["customer_standing recompute (may recover BARRED -> WATCH/GOOD_STANDING)"] }
      - { from: INVOICED, to: DISPUTED, trigger: "POST /shop/damage-assessments/{id}/dispute", actor: Customer, preconditions: [], side_effects: [] }
      - { from: DISPUTED, to: INVOICED, trigger: "POST /shop/damage-assessments/{id}/resolve with resolution UPHELD (dispute loop)", actor: Manager, preconditions: [], side_effects: ["charge_cents replaced by adjusted_charge_cents when provided; Reservation.deposit_captured_cents adjusted by the capture delta (compensation)"] }
      - { from: DISPUTED, to: WAIVED, trigger: "POST /shop/damage-assessments/{id}/resolve with resolution WAIVED", actor: Manager, preconditions: [], side_effects: ["Reservation.deposit_captured_cents -= this assessment's deposit_captured_cents (compensation)", "customer_standing recompute"] }

  - entity: PickupWindow
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - { from: OPEN, to: FULL, trigger: "Derived: a PickupBooking creation makes booked_count >= van_capacity", actor: system, preconditions: [], side_effects: ["Posture gates further bookings (ERR_WINDOW_FULL)"] }
      - { from: FULL, to: OPEN, trigger: "Derived: a BOOKED booking is cancelled, booked_count drops below van_capacity", actor: system, preconditions: [], side_effects: [] }
      - { from: "OPEN or FULL", to: CLOSED, trigger: "System: logical clock reaches window end datetime", actor: system, preconditions: [], side_effects: ["Remaining BOOKED bookings -> NO_SHOW"] }

  - entity: PickupBooking
    initial_state: BOOKED
    terminal_states: [COMPLETED, NO_SHOW, CANCELLED]
    transitions:
      - { from: BOOKED, to: COMPLETED, trigger: "POST /shop/pickup-bookings/{id}/complete", actor: FrontDesk, preconditions: ["Window not CLOSED"], side_effects: [] }
      - { from: BOOKED, to: CANCELLED, trigger: "POST /shop/pickup-bookings/{id}/cancel", actor: Customer, preconditions: ["Window not CLOSED"], side_effects: ["PickupWindow.booked_count -= 1; posture recomputed (FULL -> OPEN possible)"] }
      - { from: BOOKED, to: NO_SHOW, trigger: "System: clock reaches window end while BOOKED", actor: system, preconditions: [], side_effects: [] }

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only; all other conflicts are state preconditions)
# =============================================================================
concurrency_rules:
  - rule_id: ticket-approve-stale-quote
    parent_entity: TuneTicket
    write_endpoint: "POST /shop/tune-tickets/{id}/approve"
    occ_field: expected_tune_ticket_version
    description: |
      Approving a TuneTicket quote whose version has advanced since the client
      last observed it (e.g., a technician re-quote bumped the version) is
      rejected: the approval must bind to the quote the customer actually saw.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: lease-swap-stale-version
    parent_entity: SeasonLease
    write_endpoint: "POST /shop/season-leases/{id}/swap"
    occ_field: expected_season_lease_version
    description: |
      Swapping the leased unit against a SeasonLease whose version has advanced
      since the client last observed it (e.g., a prior swap superseded the unit)
      is rejected as a stale write.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: fitment_din
    trigger: "ReservationItem assignment (manual assign or waitlist promotion)"
    algorithm: weighted_scoring
    formula: |
      base = 0.5 + weight_kg * 0.06 + height_cm * 0.005
      type_adj = -0.5 if skier_type == TYPE_1; 0 if TYPE_2; +0.75 if TYPE_3
      age = full years between date_of_birth and the logical clock date
      age_adj = -0.75 if age < 10; 0 if 10 <= age <= 49; -0.5 if age >= 50
      sole_adj = (boot_sole_mm - 285) * 0.01
      din_raw = base + type_adj + age_adj + sole_adj
      din = clamp(din_raw, 0.75, 12.0) rounded to the nearest 0.25 step, round_half_up
      eligibility: unit accepted only when din_min <= din <= din_max
    input_set: "The parent Reservation's Customer record (height, weight, boot sole, skier type, birthdate)"
    constants: { STEP: 0.25, MIN_DIN: 0.75, MAX_DIN: 12.0, REF_SOLE_MM: 285 }
    precision: "0.25 steps, round_half_up"

  - name: rental_charge
    trigger: "Provisional variant: on assign/release/confirm. Final variant: on reservation return."
    algorithm: tiered_pricing
    formula: |
      planned_days = (end_date - start_date) + 1 (both inclusive)
      discount(planned_days): planned_days >= 14 -> 0.20; >= 7 -> 0.10; else 0.00
      ROUNDING ORDER (pinned): each line is rounded first, then lines are summed.
      provisional line  = round_half_up(planned_days * daily_rate_cents * (1 - discount))
      quoted_total_cents = sum of provisional lines over items with status ASSIGNED
      final variant (at return, per line):
        actual_days = (return_date - start_date) + 1 using the logical clock date
        regular_days = min(actual_days, planned_days)
        late_days = max(0, actual_days - planned_days)
        line_final_cents = round_half_up(regular_days * daily_rate_cents * (1 - discount))
                         + round_half_up(late_days * daily_rate_cents * 1.5)
      final_total_cents = sum of line_final_cents over the reservation's items
    input_set: "ReservationItems of the reservation with status ASSIGNED (provisional) / ASSIGNED-or-RETURNED lines at return (final)"
    constants: { TIER1_DAYS: 7, TIER1_DISCOUNT: 0.10, TIER2_DAYS: 14, TIER2_DISCOUNT: 0.20, LATE_MULTIPLIER: 1.5 }
    precision: "integer cents, round_half_up, per line before summation"
    variants:
      - { name: provisional_quote, when: "Before return (booking/confirm time)", difference: "Forward-looking: uses planned end_date, no late fees; drives quoted_total_cents and deposit_minimum_cents" }
      - { name: final_actual, when: "At POST /shop/reservations/{id}/return", difference: "Chronological: uses the actual return date; adds late-fee term; same reservation data yields a different number whenever actual != planned" }

  - name: tune_quote
    trigger: "POST /shop/tune-tickets/{id}/quote (initial quote and re-quote)"
    algorithm: tiered_pricing
    formula: |
      service base (cents): WAX 2500, EDGE_TUNE 3000, BASE_GRIND 4500, BINDING_ADJUST 2000
      labor minutes: WAX 45, EDGE_TUNE 60, BASE_GRIND 90, BINDING_ADJUST 30
      subtotal = sum(service bases) + parts_surcharge_cents
      rush_mult = 1.5 if rush else 1.0
      junior_mult = 0.8 if the customer has a SeasonLease with status IN {ACTIVE, SUSPENDED} else 1.0
      MULTIPLIER ORDER (pinned): rush first, junior second.
      quoted_price_cents = round_half_up(subtotal * rush_mult * junior_mult)
    input_set: "Ticket services + parts; customer lease status at quote time"
    constants: { RUSH_MULT: 1.5, JUNIOR_MULT: 0.8 }
    precision: "integer cents, round_half_up after both multipliers"

  - name: damage_charge
    trigger: "DamageAssessment creation"
    algorithm: constraint_propagation
    formula: |
      severity_pct: COSMETIC 0.10, MINOR 0.25, MAJOR 0.50, TOTAL_LOSS 1.00
      depreciation_factor = max(0.30, 1 - 0.02 * floor(accrued_rental_days / 30))
      depreciated_value_cents = round_half_up(purchase_price_cents * depreciation_factor)
      charge_cents = round_half_up(min(severity_pct * purchase_price_cents, depreciated_value_cents))
      (nested min: severity ceiling vs depreciated floor-value — TOTAL_LOSS diverges
      from a naive full-price charge whenever the unit has depreciated)
    input_set: "The damaged EquipmentItem (purchase_price_cents, accrued_rental_days) and the input severity"
    constants: { FLOOR: 0.30, DEPRECIATION_PER_30D: 0.02 }
    precision: "integer cents, round_half_up; depreciation computed before the min"

  - name: deposit_settlement
    trigger: "DamageAssessment invoice (captures) and reservation close/cancel (release)"
    algorithm: waterfall_allocation
    formula: |
      At invoice (ordered by DamageAssessment.created_at ASC, one reservation):
        capture_i = min(charge_cents_i, deposit_authorized_cents - deposit_captured_cents_so_far)
        deposit_captured_cents += capture_i; remainder_due_cents_i = charge_cents_i - capture_i
      At close or cancel:
        deposit_released_cents = deposit_authorized_cents - deposit_captured_cents
      INVARIANT (conserved quantity): after close/cancel,
        deposit_authorized_cents == deposit_captured_cents + deposit_released_cents
      Provisional estimate vs final settlement (dual variant):
        estimate at return-time includes DRAFT assessments' charges as planned deductions;
        final settlement at close captures only assessments in status INVOICED or later.
    input_set: "DamageAssessments of the reservation in status DRAFT (estimate) / INVOICED+ (final)"
    constants: {}
    precision: "integer cents"
    variants:
      - { name: return_time_estimate, when: "Read at/after return before invoices", difference: "Includes DRAFT assessment charges as planned deductions" }
      - { name: close_time_final, when: "At POST /shop/reservations/{id}/close", difference: "Captures only INVOICED-or-later assessments; releases the remainder" }

  - name: demo_upgrade_pricing
    trigger: "PurchaseOrder creation"
    algorithm: aggregation
    formula: |
      list_price_cents = round_half_up(purchase_price_cents * 0.75) if unit tier == DEMO
                         else purchase_price_cents
      eligible credits = the customer's DemoCredits with status ACTIVE and expires_at > now,
                         ordered created_at ASC
      cap_cents = round_half_up(0.30 * list_price_cents)
      credit_applied_cents = min(sum(eligible credit_cents), cap_cents)
      amount_due_cents = list_price_cents - credit_applied_cents
      When demo_credit_id is supplied, that credit must be among the eligible set
      (else ERR_DEMO_CREDIT_NOT_REDEEMABLE / ERR_DEMO_CREDIT_EXPIRED).
    input_set: "Customer's ACTIVE unexpired DemoCredits; the unit being purchased"
    constants: { DEMO_LIST_DISCOUNT: 0.75, CREDIT_CAP_PCT: 0.30, CREDIT_VALID_DAYS: 90 }
    precision: "integer cents, round_half_up"

  - name: season_lease_buyout
    trigger: "POST /shop/season-leases/{id}/close"
    algorithm: decay_function
    formula: |
      season_days = (season_end_date - season_start_date) in days
      elapsed_days = (close date - activated_at date) in days, clamped to [0, season_days]
      straight_line variant:
        buyout_price_straight_line_cents =
          round_half_up(purchase_price_cents * max(0.40, 1 - 0.5 * elapsed_days / season_days))
      usage variant:
        lease_days = elapsed_days (days the unit was out on this lease)
        buyout_price_usage_cents =
          round_half_up(purchase_price_cents * max(0.40, 1 - 0.01 * lease_days))
      Both values are computed and stored; they diverge for any elapsed_days
      where 0.5 * elapsed/season_days != 0.01 * elapsed (i.e., nearly always).
    input_set: "The lease's currently assigned EquipmentItem (purchase_price_cents) and the lease dates"
    constants: { VALUE_FLOOR: 0.40, STRAIGHT_LINE_RATE: 0.5, USAGE_RATE_PER_DAY: 0.01 }
    precision: "integer cents, round_half_up"
    variants:
      - { name: straight_line, when: "Always computed (official buyout figure)", difference: "Depreciates by fraction of the season elapsed" }
      - { name: usage_weighted, when: "Always computed (alternative valuation)", difference: "Depreciates 1% per day the unit was actually out; ignores season length" }

  - name: pickup_window_posture
    trigger: "PickupBooking create/cancel; logical clock advance"
    algorithm: threshold
    formula: |
      CLOSED if logical now >= service_date at end_time
      else FULL if booked_count >= van_capacity   (boundary: >=, exact fit fills the window)
      else OPEN
      booked_count = count of PickupBookings of this window with status BOOKED
    input_set: "PickupBookings of the window with status BOOKED only"
    constants: {}
    precision: "integer counts; boundary is inclusive (>=)"

  - name: customer_standing
    trigger: "DamageAssessment invoice/pay/resolve; reservation return with late days"
    algorithm: threshold
    formula: |
      unpaid = DamageAssessments over the customer's reservations with status INVOICED
      BARRED if any unpaid assessment has severity TOTAL_LOSS
      else WATCH if any unpaid assessment exists OR late_return_count >= 3
      else GOOD_STANDING
      Side effect of entering BARRED: every ACTIVE SeasonLease of the customer -> SUSPENDED.
    input_set: "Customer's DamageAssessments (via their reservations) with status INVOICED; late_return_count"
    constants: { LATE_WATCH_THRESHOLD: 3 }
    precision: "integer counts; boundary late_return_count >= 3 (exactly 3 triggers WATCH)"

  - name: turnaround_scheduling
    trigger: "TuneTicket creation"
    algorithm: threshold
    formula: |
      promised_at = created_at + 24h if rush else created_at + 48h
      Rush gating: a ShopDayCapacity row must exist for date(created_at) (ERR_CAPACITY_MISSING),
      and rush_booked_minutes + labor_minutes <= rush_reserved_minutes
      (boundary: exact fit allowed, ERR_RUSH_CAPACITY_EXCEEDED otherwise).
      Standard gating at start: booked_minutes + labor_minutes <= base_labor_minutes
      (ERR_CAPACITY_FULL).
    input_set: "ShopDayCapacity row whose service_date == date(ticket created_at)"
    constants: { STANDARD_TURNAROUND_HOURS: 48, RUSH_TURNAROUND_HOURS: 24 }
    precision: "whole minutes"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present and role is a declared role", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "Acting role is in the endpoint's roles list", error_id: ERR_UNAUTHORIZED, http_status: 403, applies_to: "all" }
  - { priority: 3, category: auth, check: "Customer role may only touch resources whose customer chain equals X-User-ID (Reservation.customer_id, TuneTicket.customer_id, PurchaseOrder.customer_id, DemoCredit.customer_id, PickupBooking via reservation, DamageAssessment via reservation)", error_id: ERR_FORBIDDEN_OWNERSHIP, http_status: 403, applies_to: "all Customer-accessible endpoints" }
  - { priority: 4, category: existence, check: "Path ids and body FK ids reference existing resources, validated left-to-right", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all" }
  - { priority: 5, category: business_constraint, check: "OCC: expected_<parent>_version equals the parent's current version on guarded writes", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: ["POST /shop/tune-tickets/{id}/approve", "POST /shop/season-leases/{id}/swap"] }
  - { priority: 6, category: state, check: "Target resource state permits the requested transition (incl. terminal lockdown; invoice only while reservation RETURNED)", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all action endpoints" }
  - { priority: 7, category: business_temporal, check: "end_date >= start_date / end_time > start_time; pickup window not expired at booking time; demo credit not expired (expires_at > now) at purchase", error_id: ERR_DATE_RANGE_INVALID, http_status: 422, applies_to: ["POST /shop/reservations", "POST /shop/season-leases", "POST /shop/pickup-windows"] }
  - { priority: 8, category: business_temporal, check: "Pickup window end datetime is in the future relative to the logical clock", error_id: ERR_WINDOW_EXPIRED, http_status: 422, applies_to: ["POST /shop/pickup-bookings"] }
  - { priority: 9, category: business_temporal, check: "Demo credit expires_at > logical now when applied to a purchase", error_id: ERR_DEMO_CREDIT_EXPIRED, http_status: 422, applies_to: ["POST /shop/purchase-orders"] }
  - { priority: 10, category: business_constraint, check: "Required fields present, enums valid, exactly one of equipment_item_id / own_gear_description on tune tickets, fee/capacity/price fields positive", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all create endpoints" }
  - { priority: 11, category: business_constraint, check: "Preferred unit din range covers the customer's computed fitment DIN", error_id: ERR_DIN_MISMATCH, http_status: 422, applies_to: ["POST /shop/reservation-items/{id}/assign"] }
  - { priority: 12, category: business_constraint, check: "Preferred unit status is rentable (not IN_SERVICE/AWAITING_INSPECTION/RETIRED/LOST/SOLD)", error_id: ERR_EQUIPMENT_NOT_AVAILABLE, http_status: 409, applies_to: ["POST /shop/reservation-items/{id}/assign", "POST /shop/season-leases/{id}/activate", "POST /shop/season-leases/{id}/swap"] }
  - { priority: 13, category: business_constraint, check: "Equipment occupancy: reservation windows on one unit are closed date intervals with a mandatory 1 free day between them (new_start > prior_end + 1 day); collision with an existing window", error_id: ERR_EQUIPMENT_OCCUPANCY_CONFLICT, http_status: 409, applies_to: ["POST /shop/reservation-items/{id}/assign"] }
  - { priority: 14, category: business_constraint, check: "Pickup windows for the same location_label and service_date are half-open [start_time, end_time) intervals; adjacency allowed, any strict overlap rejected", error_id: ERR_WINDOW_OVERLAP, http_status: 409, applies_to: ["POST /shop/pickup-windows"] }
  - { priority: 15, category: business_constraint, check: "Pickup window posture OPEN (booked_count < van_capacity; exact fit fills it)", error_id: ERR_WINDOW_FULL, http_status: 409, applies_to: ["POST /shop/pickup-bookings"] }
  - { priority: 16, category: business_constraint, check: "ShopDayCapacity row exists for date(ticket created_at)", error_id: ERR_CAPACITY_MISSING, http_status: 422, applies_to: ["POST /shop/tune-tickets"] }
  - { priority: 17, category: business_constraint, check: "Rush capacity: rush_booked_minutes + labor_minutes <= rush_reserved_minutes (exact fit allowed)", error_id: ERR_RUSH_CAPACITY_EXCEEDED, http_status: 409, applies_to: ["POST /shop/tune-tickets"] }
  - { priority: 18, category: business_constraint, check: "Standard labor capacity at start/qc-fail: booked_minutes + labor_minutes <= base_labor_minutes", error_id: ERR_CAPACITY_FULL, http_status: 409, applies_to: ["POST /shop/tune-tickets/{id}/start", "POST /shop/tune-tickets/{id}/qc-fail"] }
  - { priority: 19, category: business_constraint, check: "ShopDayCapacity.service_date unique", error_id: ERR_CAPACITY_EXISTS, http_status: 409, applies_to: ["POST /shop/shop-day-capacity"] }
  - { priority: 20, category: business_constraint, check: "rework_count < 2 before another qc-fail", error_id: ERR_REWORK_LIMIT_EXCEEDED, http_status: 409, applies_to: ["POST /shop/tune-tickets/{id}/qc-fail"] }
  - { priority: 21, category: business_constraint, check: "swap_count < 2 before another swap", error_id: ERR_SWAP_LIMIT_EXCEEDED, http_status: 409, applies_to: ["POST /shop/season-leases/{id}/swap"] }
  - { priority: 22, category: business_constraint, check: "Junior age at season_start_date <= 12 full years (turning 13 on or before season start is ineligible)", error_id: ERR_JUNIOR_AGE_EXCEEDED, http_status: 422, applies_to: ["POST /shop/season-leases", "POST /shop/season-leases/{id}/activate"] }
  - { priority: 23, category: business_constraint, check: "Guardian differs from junior and is >= 18 at season_start_date", error_id: ERR_GUARDIAN_INVALID, http_status: 422, applies_to: ["POST /shop/season-leases"] }
  - { priority: 24, category: business_constraint, check: "Leased/swapped unit is tier JUNIOR and gear_type matches package_tier (JUNIOR_SKI -> SKI, JUNIOR_BOARD -> SNOWBOARD)", error_id: ERR_NOT_JUNIOR_TIER, http_status: 422, applies_to: ["POST /shop/season-leases/{id}/activate", "POST /shop/season-leases/{id}/swap"] }
  - { priority: 25, category: business_constraint, check: "Demo credit unit is tier DEMO", error_id: ERR_NOT_DEMO_TIER, http_status: 422, applies_to: ["POST /shop/demo-credits"] }
  - { priority: 26, category: business_referential, check: "Reservation fulfillment_status == CONFIRMED when booking slope-side pickup", error_id: ERR_RESERVATION_NOT_CONFIRMED, http_status: 409, applies_to: ["POST /shop/pickup-bookings"] }
  - { priority: 27, category: business_referential, check: "No QUEUED items remain at pickup; at least one ASSIGNED item at confirm", error_id: ERR_ITEMS_UNASSIGNED, http_status: 409, applies_to: ["POST /shop/reservations/{id}/pickup", "POST /shop/reservations/{id}/confirm"] }
  - { priority: 28, category: business_referential, check: "No unit of the reservation still OUT or AWAITING_INSPECTION at close", error_id: ERR_ITEMS_PENDING_INSPECTION, http_status: 409, applies_to: ["POST /shop/reservations/{id}/close"] }
  - { priority: 29, category: business_referential, check: "Supplied demo_credit_id belongs to the customer and has status ACTIVE", error_id: ERR_DEMO_CREDIT_NOT_REDEEMABLE, http_status: 409, applies_to: ["POST /shop/purchase-orders"] }
  - { priority: 30, category: business_referential, check: "DamageAssessment equipment_item_id was an item (any status incl. RETURNED) of the given reservation", error_id: ERR_ITEM_NOT_IN_RESERVATION, http_status: 422, applies_to: ["POST /shop/damage-assessments"] }
  - { priority: 31, category: business_fiscal, check: "deposit_authorized_cents >= deposit_minimum_cents at confirm (>= boundary; exact minimum allowed)", error_id: ERR_DEPOSIT_BELOW_MINIMUM, http_status: 422, applies_to: ["POST /shop/reservations/{id}/confirm"] }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- customers ---
  - { method: POST, path: "/shop/customers", description: "Register a customer profile", roles: [FrontDesk, Manager], code: 201, input: [full_name, email, date_of_birth, height_cm, weight_kg, boot_sole_mm, skier_type], output: Customer, side_effects: ["standing defaults GOOD_STANDING"] }
  - { method: GET, path: "/shop/customers/{id}", description: "Fetch one customer", roles: [Customer, FrontDesk, Technician, Manager], code: 200, input: [], output: Customer, side_effects: [] }
  # --- equipment ---
