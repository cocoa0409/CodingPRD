scaffold_corner_design:

  # =========================================================================
  # SECTION 1 — ENTITIES
  # =========================================================================
  - section: entities
    instances:
      - name: member_bank_creation_returns_all_declared_fields
        claim_type: creation
        grounds: ["entities.MemberBank", "endpoints.POST /fhlb/member-banks"]
        distinguishing_aspect: "A create with only the three required inputs must return 201 with every declared MemberBank field populated, including the computed required_membership_stock_cents and the default enums."
        test_recipe:
          setup: ["Empty database with the logical clock pinned to the default 2026-08-01T00:00:00Z."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
          trigger:
            call: "POST /fhlb/member-banks"
            payload: { name: "Harbor Savings", charter_type: "THRIFT", total_assets_cents: 8000000000 }
            as: SystemAdmin
            captures: { member_id: "$.data.id" }
          assert:
            - "HTTP 201 with meta.api_request_id and meta.api_request_timestamp present and response_type == \"MemberBank\""
            - "data.id is a bare UUID with no type prefix, data.version == 1, data.created_at == data.updated_at == \"2026-08-01T00:00:00.000Z\""
            - "data.membership_status == \"APPLICANT\", pledge_mode == \"NONE\", pledge_agreement_status == \"NONE\", collateral_posture == \"OPEN\", shortfall_status == \"NONE\", verification_haircut_bps == 0, latest_review_outcome == \"NONE\""
            - "data.required_membership_stock_cents == 9600000 (12 bps of 8000000000), stock_held_cents == 0, stock_deficiency_cents == 9600000, lendable_collateral_value_cents == 0, borrowing_capacity_cents == 0"

      - name: member_bank_retrieval_returns_stored_row
        claim_type: retrieval
        grounds: ["endpoints.GET /fhlb/member-banks/{member_bank_id}"]
        distinguishing_aspect: "The single-row read must echo exactly what the create stored, with no version bump from the read."
        test_recipe:
          setup: ["One MemberBank created at the default clock."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /fhlb/member-banks"
              payload: { name: "Harbor Savings", charter_type: "THRIFT", total_assets_cents: 8000000000, credit_rating_tier: 1 }
              as: SystemAdmin
              captures: { member_id: "$.data.id" }
          trigger:
            call: "GET /fhlb/member-banks/${member_id}"
            payload: {}
            as: CreditOfficer
          assert:
            - "HTTP 200, response_type == \"MemberBank\", data.id == the created id, data.version == 1"
            - "data.name == \"Harbor Savings\", data.charter_type == \"THRIFT\", data.total_assets_cents == 8000000000, data.credit_rating_tier == 1"
            - "a second identical GET returns version 1 again — reads never mutate"

      - name: collateral_asset_listing_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds: ["endpoints.GET /fhlb/collateral-assets", "response_envelope.pagination_fields"]
        distinguishing_aspect: "The list endpoint must report limit/offset/total_count/has_more against the FILTERED set, not the whole table, and default limit 10 must not truncate a 3-row result."
        test_recipe:
          setup: ["An ACTIVE member with an executed BLANKET_LIEN pledge and three submitted CollateralAssets, all still UNDER_REVIEW."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /fhlb/member-banks"
              payload: { name: "Harbor Savings", charter_type: "THRIFT", total_assets_cents: 8000000000, credit_rating_tier: 1 }
              as: SystemAdmin
              captures: { member_id: "$.data.id" }
            - call: "POST /fhlb/collateral-assets"
              payload: { member_bank_id: "${member_id}", asset_class: "SF_MORTGAGE", unpaid_principal_balance_cents: 20000000, market_value_cents: 21000000, ltv_bps: 7500, appraisal_date: "2026-06-01T00:00:00Z" }
              as: TreasuryOfficer
              as_user_id: "${member_id}"
              captures: { asset_one: "$.data.id" }
            - call: "POST /fhlb/collateral-assets"
              payload: { member_bank_id: "${member_id}", asset_class: "HELOC", unpaid_principal_balance_cents: 1000000, market_value_cents: 1000000, ltv_bps: 7000, appraisal_date: "2026-06-01T00:00:00Z" }
              as: TreasuryOfficer
              as_user_id: "${member_id}"
              captures: { asset_two: "$.data.id" }
            - call: "POST /fhlb/collateral-assets"
              payload: { member_bank_id: "${member_id}", asset_class: "CRE", unpaid_principal_balance_cents: 50000000, market_value_cents: 48000000, ltv_bps: 8200, appraisal_date: "2024-01-15T00:00:00Z" }
              as: TreasuryOfficer
              as_user_id: "${member_id}"
              captures: { asset_three: "$.data.id" }
          trigger:
            call: "GET /fhlb/collateral-assets"
            payload: { member_bank_id: "${member_id}", limit: 2, offset: 0 }
            as: CreditOfficer
          assert:
            - "HTTP 200 with meta.limit == 2, meta.offset == 0, meta.total_count == 3, meta.has_more == true, and exactly 2 rows in data"
            - "the same call with offset 2 returns 1 row with has_more == false"
            - "the same call with asset_class = \"HELOC\" returns total_count == 1"
            - "an unfiltered GET with no limit returns all 3 rows with limit 10, offset 0, has_more == false"

      - name: advance_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_ADVANCE_NOT_FOUND]", "endpoints.GET /fhlb/advances/{advance_id}"]
        distinguishing_aspect: "A syntactically valid but unknown UUID on the advance path must be a 404 with the advance-specific error id, not a generic 422."
        test_recipe:
          setup: ["Empty database apart from the clock."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
          trigger:
            call: "GET /fhlb/advances/11111111-1111-4111-8111-111111111111"
            payload: {}
            as: CreditOfficer
            captures: { error_code: "$.data.error_id" }
          assert:
            - "HTTP 404 with data.error_id == \"ERR_ADVANCE_NOT_FOUND\" and a non-empty data.message"
            - "the envelope still carries meta.api_request_id and meta.api_request_timestamp"

      - name: member_bank_missing_charter_type_returns_4XX
        claim_type: required_fields
        grounds: ["entities.MemberBank.charter_type (source input, no default)", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "charter_type has no default, so omitting it must be a 422 request-validation failure at priority 3 — before any business rule runs and before any row is written."
        test_recipe:
          setup: ["Empty database apart from the clock."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
          trigger:
            call: "POST /fhlb/member-banks"
            payload: { name: "Harbor Savings", total_assets_cents: 8000000000 }
            as: SystemAdmin
            captures: { error_code: "$.data.error_id" }
          assert:
            - "HTTP 422 with data.error_id == \"ERR_INVALID_REQUEST\""
            - "no MemberBank row is created"
            - "omitting name, or omitting total_assets_cents, or sending total_assets_cents = 99999999 (below the 100000000 floor) each produce the same error id"

      - name: member_bank_credit_rating_tier_defaults_to_two
        claim_type: defaults
        grounds: ["entities.MemberBank.credit_rating_tier (default 2)", "entities.MemberBank.cdfi_certified (default false)"]
        distinguishing_aspect: "Omitting the optional tier must yield 2 (not 1 and not null), and the default tier must flow straight into the tier cap used by borrowing capacity, which is 9000 bps rather than 10000."
        test_recipe:
          setup: ["Empty database apart from the clock."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
          trigger:
            call: "POST /fhlb/member-banks"
            payload: { name: "Harbor Savings", charter_type: "THRIFT", total_assets_cents: 8000000000 }
            as: SystemAdmin
            captures: { member_id: "$.data.id" }
          assert:
            - "data.credit_rating_tier == 2 and data.cdfi_certified == false"
            - "GET /fhlb/member-banks/{member_id}/borrowing-capacity reports tier_cap_bps == 9000"
            - "data.delivery_required == false (the tier-4 delivery trigger does not fire at tier 2)"

      - name: collateral_asset_documentation_and_custody_defaults_applied
        claim_type: defaults
        grounds: ["entities.CollateralAsset.documentation_status (default COMPLETE)", "entities.CollateralAsset.custody_location (default MEMBER_VAULT)", "entities.CollateralAsset.ltv_bps (default 0)", "entities.CollateralAsset.delinquency_days (default 0)"]
        distinguishing_aspect: "A minimal asset submission must default to COMPLETE documentation, MEMBER_VAULT custody, ltv 0 and 0 delinquency days, so the later eligibility review applies NO penalty and returns the clean base factor of 7800."
        test_recipe:
          setup: ["An ACTIVE member with an executed BLANKET_LIEN pledge."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /fhlb/member-banks"
              payload: { name: "Harbor Savings", charter_type: "THRIFT", total_assets_cents: 8000000000, credit_rating_tier: 1 }
              as: SystemAdmin
              captures: { member_id: "$.data.id" }
            - call: "POST /fhlb/stock-subscriptions"
              payload: { member_bank_id: "${member_id}", subscription_type: "MEMBERSHIP", amount_cents: 9600000 }
              as: CreditOfficer
              captures: { sub_membership: "$.data.id" }
            - call: "POST /fhlb/stock-subscriptions/${sub_membership}/issue"
              payload: {}
              as: CreditOfficer
            - call: "POST /fhlb/member-banks/${member_id}/activate"
              payload: {}
              as: CreditOfficer
            - call: "POST /fhlb/member-banks/${member_id}/pledge-agreement"
              payload: { pledge_mode: "BLANKET_LIEN", effective_date: "2026-08-01T00:00:00Z" }
              as: CreditOfficer
          trigger:
            call: "POST /fhlb/collateral-assets"
            payload: { member_bank_id: "${member_id}", asset_class: "SF_MORTGAGE", unpaid_principal_balance_cents: 20000000, market_value_cents: 21000000, appraisal_date: "2026-06-01T00:00:00Z" }
            as: TreasuryOfficer
            as_user_id: "${member_id}"
            captures: { asset_id: "$.data.id" }
          assert:
            - "data.documentation_status == \"COMPLETE\", data.custody_location == \"MEMBER_VAULT\", data.ltv_bps == 0, data.delinquency_days == 0"
            - "data.status == \"UNDER_REVIEW\", data.discount_factor_bps == 0, data.lendable_value_cents == 0, data.ineligibility_reason == \"NONE\""
            - "a following POST /fhlb/collateral-assets/{asset_id}/review-eligibility yields discount_factor_bps == 7800 and lendable_value_cents == 15600000, proving no default triggered a penalty"

      - name: member_bank_required_membership_stock_computed_at_minimum_floor
        claim_type: computed_fields
        grounds: ["calculations.membership_stock_requirement (MEMBERSHIP_STOCK_MIN_CENTS 1000000)"]
        distinguishing_aspect: "required_membership_stock_cents is computed, never accepted from input: for a 100,000,000-cent member the raw 12 bps figure is 120,000, which the 1,000,000 minimum must override."
        test_recipe:
          setup: ["Empty database apart from the clock."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
          trigger:
            call: "POST /fhlb/member-banks"
            payload: { name: "Tiny Mutual", charter_type: "CREDIT_UNION", total_assets_cents: 100000000, credit_rating_tier: 3 }
            as: SystemAdmin
            captures: { member_id: "$.data.id" }
          assert:
            - "data.required_membership_stock_cents == 1000000 and NOT 120000"
            - "data.stock_deficiency_cents == 1000000 and data.required_total_stock_cents == 1000000"
            - "a member with total_assets_cents 300000000000 gets 250000000, the MEMBERSHIP_STOCK_MAX ceiling, rather than 360000000"

      - name: collateral_asset_system_fields_generated_and_status_input_ignored
        claim_type: system_fields
        grounds: ["entities.CollateralAsset.status (source system)", "entities.CollateralAsset common_fields"]
        distinguishing_aspect: "id, created_at, updated_at, version and status are server-owned: a body that tries to preset status to ELIGIBLE and version to 99 must be ignored, not honored and not rejected as unknown-field."
        test_recipe:
          setup: ["An ACTIVE member with an executed BLANKET_LIEN pledge."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /fhlb/member-banks"
              payload: { name: "Harbor Savings", charter_type: "THRIFT", total_assets_cents: 8000000000, credit_rating_tier: 1 }
              as: SystemAdmin
              captures: { member_id: "$.data.id" }
            - call: "POST /fhlb/stock-subscriptions"
              payload: { member_bank_id: "${member_id}", subscription_type: "MEMBERSHIP", amount_cents: 9600000 }
              as: CreditOfficer
              captures: { sub_membership: "$.data.id" }
            - call: "POST /fhlb/stock-subscriptions/${sub_membership}/issue"
              payload: {}
              as: CreditOfficer
            - call: "POST /fhlb/member-banks/${member_id}/activate"
              payload: {}
              as: CreditOfficer
            - call: "POST /fhlb/member-banks/${member_id}/pledge-agreement"
              payload: { pledge_mode: "BLANKET_LIEN", effective_date: "2026-08-01T00:00:00Z" }
              as: CreditOfficer
          trigger:
            call: "POST /fhlb/collateral-assets"
            payload: { member_bank_id: "${member_id}", asset_class: "SF_MORTGAGE", unpaid_principal_balance_cents: 20000000, market_value_cents: 21000000, ltv_bps: 7500, appraisal_date: "2026-06-01T00:00:00Z", status: "ELIGIBLE", version: 99, lendable_value_cents: 99999999 }
            as: TreasuryOfficer
            as_user_id: "${member_id}"
            captures: { asset_id: "$.data.id" }
          assert:
            - "data.status == \"UNDER_REVIEW\" (the submitted ELIGIBLE is ignored), data.version == 1, data.lendable_value_cents == 0"
            - "data.id is a server-minted bare UUID, data.created_at == \"2026-08-01T00:00:00.000Z\""
            - "MemberBank.lendable_collateral_value_cents is still 0, proving the ignored fields never reached the parent aggregate"

      - name: collateral_asset_invalid_asset_class_enum_rejected
        claim_type: type_constraints
        grounds: ["entities.CollateralAsset.asset_class (enum)", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "An out-of-enum asset_class must fail request validation at priority 3 rather than falling through to an undefined discount-factor lookup."
        test_recipe:
          setup: ["An ACTIVE member with an executed BLANKET_LIEN pledge."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /fhlb/member-banks"
              payload: { name: "Harbor Savings", charter_type: "THRIFT", total_assets_cents: 8000000000, credit_rating_tier: 1 }
              as: SystemAdmin
              captures: { member_id: "$.data.id" }
          trigger:
            call: "POST /fhlb/collateral-assets"
            payload: { member_bank_id: "${member_id}", asset_class: "AUTO_LOAN", unpaid_principal_balance_cents: 20000000, market_value_cents: 21000000, ltv_bps: 7500, appraisal_date: "2026-06-01T00:00:00Z" }
            as: TreasuryOfficer
            as_user_id: "${member_id}"
            captures: { error_code: "$.data.error_id" }
          assert:
            - "HTTP 422 with data.error_id == \"ERR_INVALID_REQUEST\""
            - "no CollateralAsset row is created"
            - "market_value_cents = 0 (violates > 0) and ltv_bps = 20001 (violates 0..20000) produce the same error id"

      - name: advance_product_max_term_below_min_term_rejected
        claim_type: type_constraints
        grounds: ["entities.AdvanceProduct.max_term_days (>= min_term_days)", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "An intra-record range constraint (max_term_days >= min_term_days) is still request validation, so it must be a 422 rather than a business 409, and it must be checked even though both fields are individually well-formed."
        test_recipe:
          setup: ["Empty database apart from the clock."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
          trigger:
            call: "POST /fhlb/advance-products"
            payload: { product_code: "BAD-1", structure: "FIXED_TERM", min_term_days: 400, max_term_days: 90, rate_bps: 425, prepayment_fee_method: "YIELD_MAINTENANCE", activity_stock_pct_bps: 450, min_principal_cents: 1000000 }
            as: SystemAdmin
            captures: { error_code: "$.data.error_id" }
          assert:
            - "HTTP 422 with data.error_id == \"ERR_INVALID_REQUEST\""
            - "no AdvanceProduct row is created"
            - "activity_stock_pct_bps = 2001 (above the 2000 ceiling) and rate_bps = 0 produce the same error id"

      - name: stock_subscription_amount_not_par_multiple_rejected
        claim_type: type_constraints
        grounds: ["entities.StockSubscription.amount_cents (% STOCK_PAR_VALUE_CENTS == 0)", "errors[ERR_STOCK_NOT_PAR_MULTIPLE]"]
        distinguishing_aspect: "The par-multiple rule has its own error id at priority 3, so a 9,605,000-cent subscription must return ERR_STOCK_NOT_PAR_MULTIPLE rather than the generic ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["One APPLICANT member bank."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /fhlb/member-banks"
              payload: { name: "Harbor Savings", charter_type: "THRIFT", total_assets_cents: 8000000000, credit_rating_tier: 1 }
              as: SystemAdmin
              captures: { member_id: "$.data.id" }
          trigger:
            call: "POST /fhlb/stock-subscriptions"
            payload: { member_bank_id: "${member_id}", subscription_type: "MEMBERSHIP", amount_cents: 9605000 }
            as: CreditOfficer
            captures: { error_code: "$.data.error_id" }
          assert:
            - "HTTP 422 with data.error_id == \"ERR_STOCK_NOT_PAR_MULTIPLE\" and NOT \"ERR_INVALID_REQUEST\""
            - "no StockSubscription row is created and MemberBank.stock_held_cents is still 0"
            - "9600000 is accepted; 0 is rejected by the > 0 constraint with ERR_INVALID_REQUEST"

      - name: stock_subscription_joins_member_and_advance_as_junction_row
        claim_type: graph
        grounds: ["entities.StockSubscription.member_bank_id", "entities.StockSubscription.advance_id", "endpoints.GET /fhlb/stock-subscriptions"]
        distinguishing_aspect: "StockSubscription is the junction of the MemberBank and Advance aggregates: the auto-minted ACTIVITY row must be reachable by BOTH foreign keys, while the MEMBERSHIP row is reachable only by member and carries a null advance_id."
        test_recipe:
          setup:
            - "Harbor Savings tier 1 with one ELIGIBLE SF_MORTGAGE asset (lendable 15,600,000) and 9,600,000 of MEMBERSHIP stock ISSUED."
            - "Advance D requests 950,000 net with fund_stock_from_advance true, so gross is 1,000,000 and the activity obligation is 50,000; it is approved and funded, which mints the junction row."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /fhlb/member-banks"
              payload: { name: "Harbor Savings", charter_type: "THRIFT", total_assets_cents: 8000000000, credit_rating_tier: 1 }
              as: SystemAdmin
              captures: { member_id: "$.data.id" }
            - call: "POST /fhlb/stock-subscriptions"
              payload: { member_bank_id: "${member_id}", subscription_type: "MEMBERSHIP", amount_cents: 9600000 }
              as: CreditOfficer
              captures: { sub_membership: "$.data.id" }
            - call: "POST /fhlb/stock-subscriptions/${sub_membership}/issue"
              payload: {}
              as: CreditOfficer
            - call: "POST /fhlb/member-banks/${member_id}/activate"
              payload: {}
              as: CreditOfficer
            - call: "POST /fhlb/member-banks/${member_id}/pledge-agreement"
              payload: { pledge_mode: "BLANKET_LIEN", effective_date: "2026-08-01T00:00:00Z" }
              as: CreditOfficer
            - call: "POST /fhlb/collateral-assets"
              payload: { member_bank_id: "${member_id}", asset_class: "SF_MORTGAGE", unpaid_principal_balance_cents: 20000000, market_value_cents: 21000000, ltv_bps: 7500, appraisal_date: "2026-06-01T00:00:00Z" }
              as: TreasuryOfficer
              as_user_id: "${member_id}"
              captures: { asset_sf: "$.data.id" }
            - call: "POST /fhlb/collateral-assets/${asset_sf}/review-eligibility"
              payload: {}
              as: CreditOfficer
            - call: "POST /fhlb/advance-products"
              payload: { product_code: "FT-450", structure: "FIXED_TERM", min_term_days: 30, max_term_days: 1095, rate_bps: 425, prepayment_fee_method: "YIELD_MAINTENANCE", activity_stock_pct_bps: 450, min_principal_cents: 1000000 }
              as: SystemAdmin
              captures: { product_id: "$.data.id" }
            - call: "GET /fhlb/member-banks/${member_id}"
              payload: {}
              as: CreditOfficer
              captures: { ver_a: "$.data.version" }
            - call: "POST /fhlb/advances"
              payload: { member_bank_id: "${member_id}", advance_product_id: "${product_id}", term_days: 30, requested_net_proceeds_cents: 950000, expected_member_bank_version: "${ver_a}", fund_stock_from_advance: true }
              as: TreasuryOfficer
              as_user_id: "${member_id}"
              captures: { advance_d: "$.data.id" }
            - call: "POST /fhlb/advances/${advance_d}/approve"
              payload: {}
              as: CreditOfficer
              as_user_id: "credit-officer-1"
            - call: "POST /fhlb/advances/${advance_d}/fund"
              payload: {}
              as: CreditOfficer
              as_user_id: "credit-officer-2"
          trigger:
            call: "GET /fhlb/stock-subscriptions"
            payload: { advance_id: "${advance_d}" }
            as: CreditOfficer
          assert:
            - "total_count == 1 and data[0].amount_cents == 50000 with data[0].subscription_type == \"ACTIVITY\", data[0].status == \"ISSUED\" and data[0].advance_id == the advance id"
            - "the same row appears in GET /fhlb/stock-subscriptions?member_bank_id={member_id}, which returns total_count == 2"
            - "the MEMBERSHIP row has advance_id == null and does NOT appear in the advance-filtered list"
            - "GET /fhlb/stock-subscriptions?subscription_type=ACTIVITY&status=ISSUED returns total_count == 1"

      - name: safekeeping_receipt_parent_asset_not_found
        claim_type: parent_relationships
        grounds: ["entities.SafekeepingReceipt.parent CollateralAsset", "errors[ERR_COLLATERAL_ASSET_NOT_FOUND]"]
        distinguishing_aspect: "A child create under an unknown parent path id must be a 404 on the PARENT entity (priority 4), not a 422 and not a receipt-not-found."
        test_recipe:
          setup: ["Empty database apart from the clock."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
          trigger:
            call: "POST /fhlb/collateral-assets/22222222-2222-4222-8222-222222222222/safekeeping-receipts"
            payload: { file_count: 12, delivery_date: "2026-08-10T00:00:00Z", return_date: "2026-08-20T00:00:00Z" }
            as: CollateralCustodian
            captures: { error_code: "$.data.error_id" }
          assert:
            - "HTTP 404 with data.error_id == \"ERR_COLLATERAL_ASSET_NOT_FOUND\""
            - "no SafekeepingReceipt row is created"

      - name: review_finding_against_other_members_asset_rejected
        claim_type: parent_relationships
        grounds: ["validations.finding-asset-belongs-to-member", "errors[ERR_ASSET_MEMBER_MISMATCH]"]
        distinguishing_aspect: "A body FK that exists but points outside the review's own member must be refused with ERR_ASSET_MEMBER_MISMATCH — an existence check alone is not enough, the ownership graph must be walked."
        test_recipe:
          setup:
            - "Two member banks: Harbor Savings (M1) and Cascade Mutual (M2), each with one submitted CollateralAsset."
            - "A review is scheduled for M1 and has begun field work."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /fhlb/member-banks"
              payload: { name: "Harbor Savings", charter_type: "THRIFT", total_assets_cents: 8000000000, credit_rating_tier: 1 }
              as: SystemAdmin
              captures: { member_one: "$.data.id" }
            - call: "POST /fhlb/member-banks"
              payload: { name: "Cascade Mutual", charter_type: "COMMERCIAL_BANK", total_assets_cents: 5000000000, credit_rating_tier: 2 }
              as: SystemAdmin
              captures: { member_two: "$.data.id" }
            - call: "POST /fhlb/collateral-assets"
              payload: { member_bank_id: "${member_two}", asset_class: "SF_MORTGAGE", unpaid_principal_balance_cents: 20000000, market_value_cents: 21000000, ltv_bps: 7500, appraisal_date: "2026-06-01T00:00:00Z" }
              as: TreasuryOfficer
              as_user_id: "${member_two}"
              captures: { asset_of_two: "$.data.id" }
            - call: "POST /fhlb/collateral-verification-reviews"
              payload: { member_bank_id: "${member_one}", window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-20T00:00:00Z", sample_size: 40 }
              as: CollateralReviewAuditor
              captures: { review_id: "$.data.id" }
            - call: "POST /fhlb/collateral-verification-reviews/${review_id}/begin-field-work"
              payload: {}
              as: CollateralReviewAuditor
          trigger:
            call: "POST /fhlb/collateral-verification-reviews/${review_id}/findings"
            payload: { collateral_asset_id: "${asset_of_two}", finding_type: "MISSING_NOTE", severity: "MAJOR" }
            as: CollateralReviewAuditor
            as_user_id: "auditor-1"
            captures: { error_code: "$.data.error_id" }
          assert:
            - "HTTP 409 with data.error_id == \"ERR_ASSET_MEMBER_MISMATCH\""
            - "no ReviewFinding row is created: GET /fhlb/review-findings?collateral_verification_review_id={review_id} returns total_count == 0"
            - "a body collateral_asset_id that does not exist at all returns HTTP 404 with ERR_COLLATERAL_ASSET_NOT_FOUND instead, proving the 404 tier precedes the mismatch tier"

      - name: entity_immutability_row_not_applicable
        claim_type: immutability
        grounds: ["entities (all ten declare common_fields: true)"]
        excluded_because:
          difficulty_instance: compensating_invariant / stock_capital_conservation_across_fund_repay_repurchase
          rationale: "No entity in this scaffold is declared common_fields: false, so there is no immutable-entity claim to test; version-bearing mutation semantics are instead asserted by the named §1.8 instance, which walks a subscription through three versioned transitions."

  # =========================================================================
  # SECTION 2 — STATE MACHINES
  # =========================================================================
  - section: state_machines
    instances:
      - name: verification_review_starts_scheduled_with_zero_retests
        claim_type: initial_state
        grounds: ["state_machines.CollateralVerificationReview.initial_state SCHEDULED", "endpoints.POST /fhlb/collateral-verification-reviews"]
        distinguishing_aspect: "A newly scheduled review must land in SCHEDULED with retest_count 0, outcome PENDING and haircut_bps 0 — it must NOT jump straight to FIELD_WORK and it must not yet touch the member's haircut."
        test_recipe:
          setup: ["Harbor Savings is ACTIVE with 9,600,000 of MEMBERSHIP stock issued."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /fhlb/member-banks"
              payload: { name: "Harbor Savings", charter_type: "THRIFT", total_assets_cents: 8000000000, credit_rating_tier: 1 }
              as: SystemAdmin
              captures: { member_id: "$.data.id" }
            - call: "POST /fhlb/stock-subscriptions"
              payload: { member_bank_id: "${member_id}", subscription_type: "MEMBERSHIP", amount_cents: 9600000 }
              as: CreditOfficer
              captures: { sub_membership: "$.data.id" }
            - call: "POST /fhlb/stock-subscriptions/${sub_membership}/issue"
              payload: {}
              as: CreditOfficer
            - call: "POST /fhlb/member-banks/${member_id}/activate"
              payload: {}
              as: CreditOfficer
          trigger:
            call: "POST /fhlb/collateral-verification-reviews"
            payload: { member_bank_id: "${member_id}", window_start: "2026-08-10T00:00:00Z", window_end: "2026-08-20T00:00:00Z", sample_size: 40 }
            as: CollateralReviewAuditor
            captures: { review_id: "$.data.id" }
          assert:
            - "HTTP 201 with data.status == \"SCHEDULED\", data.retest_count == 0, data.outcome == \"PENDING\", data.haircut_bps == 0"
            - "data.weighted_exception_score == 0, data.exception_rate_pct == 0, data.closed_at == null"
            - "MemberBank.verification_haircut_bps is still 0 and MemberBank.latest_review_outcome is still \"NONE\""

      - name: stock_subscription_issue_moves_subscribed_to_issued
        claim_type: valid_transition
        grounds: ["state_machines.StockSubscription SUBSCRIBED -> ISSUED", "endpoints.POST /fhlb/stock-subscriptions/{stock_subscription_id}/issue"]
        distinguishing_aspect: "Issuing a subscription must both flip the child row to ISSUED and roll the parent's stock_held_cents / stock_deficiency_cents in the same request; a SUBSCRIBED row must count for nothing."
        test_recipe:
          setup: ["An APPLICANT Harbor Savings with one SUBSCRIBED MEMBERSHIP subscription of 9,600,000."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /fhlb/member-banks"
              payload: { name: "Harbor Savings", charter_type: "THRIFT", total_assets_cents: 8000000000, credit_rating_tier: 1 }
              as: SystemAdmin
              captures: { member_id: "$.data.id" }
            - call: "POST /fhlb/stock-subscriptions"
              payload: { member_bank_id: "${member_id}", subscription_type: "MEMBERSHIP", amount_cents: 9600000 }
              as: CreditOfficer
              captures: { sub_membership: "$.data.id" }
          trigger:
            call: "POST /fhlb/stock-subscriptions/${sub_membership}/issue"
            payload: {}
            as: CreditOfficer
          assert:
            - "HTTP 200 with data.status == \"ISSUED\", data.shares == 960, data.issued_at == \"2026-08-01T00:00:00.000Z\", data.version == 2"
            - "GET /fhlb/member-banks/{member_id} now reports stock_held_cents == 9600000 and stock_deficiency_cents == 0 (before the issue they were 0 and 9600000)"
            - "the member is now activatable, proving the guard reads stock_held_cents and not the subscribed total"

      - name: review_close_directly_from_scheduled_rejected
        claim_type: invalid_transitions
        grounds: ["state_machines.CollateralVerificationReview (no SCHEDULED -> CLOSED edge)", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "CLOSED is reachable only from FIELD_WORK or REMEDIATION; skipping field work must be refused with ERR_INVALID_STATE rather than silently closing a review with a 0.00 exception rate and clearing the member's haircut."
        test_recipe:
          setup: ["An ACTIVE Harbor Savings with one SCHEDULED review that has not begun field work."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /fhlb/member-banks"
              payload: { name: "Harbor Savings", charter_type: "THRIFT", total_assets_cents: 8000000000, credit_rating_tier: 1 }
              as: SystemAdmin
              captures: { member_id: "$.data.id" }
            - call: "POST /fhlb/stock-subscriptions"
              payload: { member_bank_id: "${member_id}", subscription_type: "MEMBERSHIP", amount_cents: 9600000 }
              as: CreditOfficer
              captures: { sub_membership: "$.data.id" }
            - call: "POST /fhlb/stock-subscriptions/${sub_membership}/issue"
              payload: {}
              as: CreditOfficer
            - call: "POST /fhlb/member-banks/${member_id}/activate"
              payload: {}
              as: CreditOfficer
            - call: "POST /fhlb/collateral-verification-reviews"
              payload: { member_bank_id: "${member_id}", window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-20T00:00:00Z", sample_size: 40 }
              as: CollateralReviewAuditor
              captures: { review_id: "$.data.id" }
          trigger:
            call: "POST /fhlb/collateral-verification-reviews/${review_id}/close"
            payload: {}
            as: CollateralReviewAuditor
            captures: { error_code: "$.data.error_id" }
          assert:
            - "HTTP 409 with data.error_id == \"ERR_INVALID_STATE\""
            - "the review is still SCHEDULED with outcome \"PENDING\" and version unchanged"
            - "MemberBank.verification_haircut_bps is still 0 and latest_review_outcome is still \"NONE\" — the rejected close ran no part of its cascade"
            - "POST .../issue-findings and POST .../retest from SCHEDULED are refused with the same error id"

      - name: repurchased_subscription_second_redemption_request_rejected
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.StockSubscription.terminal_states [REPURCHASED, CANCELLED]", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "REPURCHASED is terminal: once the par value has been returned, a further redemption request must be refused even though the guard on excess stock would still be satisfiable, so the same par cannot be repurchased twice."
        test_recipe:
          setup:
            - "Harbor Savings requires 9,600,000 of membership stock and holds 10,600,000 across two ISSUED MEMBERSHIP subscriptions (9,600,000 and 1,000,000)."
            - "The 1,000,000 subscription has already been redemption-requested and repurchased, leaving stock_held_cents at exactly the 9,600,000 requirement."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /fhlb/member-banks"
              payload: { name: "Harbor Savings", charter_type: "THRIFT", total_assets_cents: 8000000000, credit_rating_tier: 1 }
              as: SystemAdmin
              captures: { member_id: "$.data.id" }
            - call: "POST /fhlb/stock-subscriptions"
              payload: { member_bank_id: "${member_id}", subscription_type: "MEMBERSHIP", amount_cents: 9600000 }
              as: CreditOfficer
              captures: { sub_membership: "$.data.id" }
            - call: "POST /fhlb/stock-subscriptions/${sub_membership}/issue"
              payload: {}
              as: CreditOfficer
            - call: "POST /fhlb/stock-subscriptions"
              payload: { member_bank_id: "${member_id}", subscription_type: "MEMBERSHIP", amount_cents: 1000000 }
              as: CreditOfficer
              captures: { sub_excess: "$.data.id" }
            - call: "POST /fhlb/stock-subscriptions/${sub_excess}/issue"
              payload: {}
              as: CreditOfficer
            - call: "POST /fhlb/member-banks/${member_id}/activate"
              payload: {}
              as: CreditOfficer
            - call: "POST /fhlb/stock-subscriptions/${sub_excess}/request-redemption"
              payload: {}
              as: TreasuryOfficer
              as_user_id: "${member_id}"
            - call: "POST /fhlb/stock-subscriptions/${sub_excess}/repurchase"
              payload: {}
              as: CreditOfficer
          trigger:
            call: "POST /fhlb/stock-subscriptions/${sub_excess}/request-redemption"
            payload: {}
            as: TreasuryOfficer
            as_user_id: "${member_id}"
            captures: { error_code: "$.data.error_id" }
          assert:
            - "HTTP 409 with data.error_id == \"ERR_INVALID_STATE\""
            - "the subscription is still REPURCHASED and MemberBank.stock_held_cents is still 9600000 — the par was not returned a second time"
            - "POST /fhlb/stock-subscriptions/{sub_excess}/issue and /repurchase are refused with the same error id"

      - name: member_activate_twice_second_call_rejected
        claim_type: idempotency
        grounds: ["state_machines.MemberBank.membership_status APPLICANT -> ACTIVE (precondition membership_status == APPLICANT)", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "activate is a transition, not an idempotent setter: the second call must be a 409 and must not re-run the posture recomputation or bump the member version again."
        test_recipe:
          setup: ["Harbor Savings has been activated once with 9,600,000 of MEMBERSHIP stock issued."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /fhlb/member-banks"
              payload: { name: "Harbor Savings", charter_type: "THRIFT", total_assets_cents: 8000000000, credit_rating_tier: 1 }
              as: SystemAdmin
              captures: { member_id: "$.data.id" }
            - call: "POST /fhlb/stock-subscriptions"
              payload: { member_bank_id: "${member_id}", subscription_type: "MEMBERSHIP", amount_cents: 9600000 }
              as: CreditOfficer
              captures: { sub_membership: "$.data.id" }
            - call: "POST /fhlb/stock-subscriptions/${sub_membership}/issue"
              payload: {}
              as: CreditOfficer
            - call: "POST /fhlb/member-banks/${member_id}/activate"
              payload: {}
              as: CreditOfficer
              captures: { ver_after_activate: "$.data.version" }
          trigger:
            call: "POST /fhlb/member-banks/${member_id}/activate"
            payload: {}
            as: CreditOfficer
            captures: { error_code: "$.data.error_id" }
          assert:
            - "HTTP 409 with data.error_id == \"ERR_INVALID_STATE\""
            - "GET /fhlb/member-banks/{member_id} still reports membership_status == \"ACTIVE\" with the SAME version captured after the first activate"
            - "community_lending_eligible is still true and collateral_posture is still \"OPEN\""

      - name: member_activate_without_membership_stock_rejected
        claim_type: precondition_enforcement
        grounds: ["state_machines.MemberBank APPLICANT -> ACTIVE precondition stock_held_cents >= required_membership_stock_cents", "errors[ERR_MEMBERSHIP_STOCK_DEFICIENT]"]
        distinguishing_aspect: "The activation guard reads ISSUED stock only, so a member whose 9,600,000 subscription is still SUBSCRIBED must be refused with the stock-specific error id rather than ERR_INVALID_STATE."
        test_recipe:
          setup: ["Harbor Savings is APPLICANT with a SUBSCRIBED but not yet ISSUED MEMBERSHIP subscription of 9,600,000."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /fhlb/member-banks"
              payload: { name: "Harbor Savings", charter_type: "THRIFT", total_assets_cents: 8000000000, credit_rating_tier: 1 }
              as: SystemAdmin
              captures: { member_id: "$.data.id" }
            - call: "POST /fhlb/stock-subscriptions"
              payload: { member_bank_id: "${member_id}", subscription_type: "MEMBERSHIP", amount_cents: 9600000 }
              as: CreditOfficer
              captures: { sub_membership: "$.data.id" }
          trigger:
            call: "POST /fhlb/member-banks/${member_id}/activate"
            payload: {}
            as: CreditOfficer
            captures: { error_code: "$.data.error_id" }
          assert:
            - "HTTP 409 with data.error_id == \"ERR_MEMBERSHIP_STOCK_DEFICIENT\" and NOT \"ERR_INVALID_STATE\""
            - "membership_status is still \"APPLICANT\", stock_held_cents == 0, stock_deficiency_cents == 9600000"
            - "after POST /fhlb/stock-subscriptions/{sub_membership}/issue the identical activate call succeeds with 200"

      - name: pledge_agreement_execution_recomputes_listing_mode_and_lendable_value
        claim_type: side_effect_execution
        grounds: ["endpoints.POST /fhlb/member-banks/{member_bank_id}/pledge-agreement", "calculations.effective_listing_mode", "calculations.asset_discount_factor"]
        distinguishing_aspect: "Re-executing the pledge agreement with a different mode must re-price the member's ALREADY ELIGIBLE assets: switching BLANKET_LIEN to SPECIFIC_LISTING lifts the SF_MORTGAGE factor from 7800 to 8600 and the lendable value from 15,600,000 to 17,200,000 without any asset-level call."
        test_recipe:
          setup:
            - "Harbor Savings tier 1 with an executed BLANKET_LIEN pledge and one ELIGIBLE SF_MORTGAGE asset (upb 20,000,000, market value 21,000,000, ltv 7500, appraised 2026-06-01)."
            - "At BLANKET the asset's effective_listing_mode is BLANKET, factor 7800, lendable 15,600,000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /fhlb/member-banks"
              payload: { name: "Harbor Savings", charter_type: "THRIFT", total_assets_cents: 8000000000, credit_rating_tier: 1 }
              as: SystemAdmin
              captures: { member_id: "$.data.id" }
            - call: "POST /fhlb/member-banks/${member_id}/pledge-agreement"
              payload: { pledge_mode: "BLANKET_LIEN", effective_date: "2026-08-01T00:00:00Z" }
              as: CreditOfficer
            - call: "POST /fhlb/collateral-assets"
              payload: { member_bank_id: "${member_id}", asset_class: "SF_MORTGAGE", unpaid_principal_balance_cents: 20000000, market_value_cents: 21000000, ltv_bps: 7500, appraisal_date: "2026-06-01T00:00:00Z" }
              as: TreasuryOfficer
              as_user_id: "${member_id}"
              captures: { asset_sf: "$.data.id" }
            - call: "POST /fhlb/collateral-assets/${asset_sf}/review-eligibility"
              payload: {}
              as: CreditOfficer
          trigger:
            call: "POST /fhlb/member-banks/${member_id}/pledge-agreement"
            payload: { pledge_mode: "SPECIFIC_LISTING", effective_date: "2026-08-01T00:00:00Z" }
            as: CreditOfficer
          assert:
            - "HTTP 200 with data.pledge_mode == \"SPECIFIC_LISTING\", data.pledge_agreement_status == \"EXECUTED\", data.delivery_required == false"
            - "data.lendable_collateral_value_cents == 17200000 and data.borrowing_capacity_cents == 17200000 (tier 1 cap 10000 bps, no advances)"
            - "GET /fhlb/collateral-assets/{asset_sf} reports effective_listing_mode == \"SPECIFIC\", discount_factor_bps == 8600, lendable_value_cents == 17200000, and status still \"ELIGIBLE\""

      - name: safekeeping_confirm_received_upgrades_listing_mode_to_delivered
        claim_type: side_effect_execution
        grounds: ["state_machines.SafekeepingReceipt PENDING_DELIVERY -> RECEIVED", "calculations.effective_listing_mode (DELIVERED requires FHLB_SAFEKEEPING plus a RECEIVED receipt)"]
        distinguishing_aspect: "Delivery is proved by the receipt, not by the pledge mode: confirming receipt of the loan files moves custody to FHLB_SAFEKEEPING and lifts a BLANKET-pledged SF_MORTGAGE from 7800 to the DELIVERED factor 9200, i.e. 15,600,000 to 18,400,000."
        test_recipe:
          setup:
            - "Harbor Savings tier 1 with an executed BLANKET_LIEN pledge and one ELIGIBLE SF_MORTGAGE asset at factor 7800 / lendable 15,600,000, custody MEMBER_VAULT."
