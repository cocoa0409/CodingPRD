            - "GET /research-billing/studies/${study_id}/charge-review-summary shows unrouted_charge_count == 2, sponsor_unbilled_cents == 0 and payer_billed_cents == 0 - a cascade-created charge is not routed money yet"

      - name: approving_a_draft_analysis_is_refused_as_not_under_review
        claim_type: invalid_transitions
        grounds:
          - state_machines.CoverageAnalysis.transitions[UNDER_REVIEW -> APPROVED].preconditions
          - errors[ERR_ANALYSIS_NOT_UNDER_REVIEW]
          - validations[priority 10]
        distinguishing_aspect: "APPROVE is declared only from UNDER_REVIEW, so firing it from DRAFT returns the domain-specific 409 ERR_ANALYSIS_NOT_UNDER_REVIEW (which takes precedence over the generic code) and none of the approval side effects run - no approved_at, no LC-2, no supersede."
        test_recipe:
          setup:
            - "One study whose analysis carries one item and has NOT been submitted, so it is still DRAFT."
          setup_api_calls:
            - call: "POST /research-billing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ResearchBillingManager
            - call: "POST /research-billing/studies"
              payload: { protocol_number: "AMC-2390-C17", title: "Corner invalid-transition probe", sponsor_name: "Northgate Therapeutics", funding_source: "INDUSTRY_SPONSORED", ind_ide_status: "IND_HELD", therapeutic_intent: true }
              as: ResearchBillingManager
              as_user_id: "mgr_1"
              captures: { study_id: "$.data.id", study_v1: "$.data.version" }
            - call: "POST /research-billing/coverage-analyses"
              payload: { study_id: "${study_id}", expected_study_version: "${study_v1}" }
              as: CoverageAnalyst
              as_user_id: "analyst_1"
              captures: { analysis_id: "$.data.id", analysis_v1: "$.data.version" }
            - call: "POST /research-billing/coverage-items"
              payload: { coverage_analysis_id: "${analysis_id}", expected_coverage_analysis_version: "${analysis_v1}", item_code: "80053", description: "Comprehensive metabolic panel", classification: "ROUTINE_CARE", medicare_coverage_basis: "STANDARD_OF_CARE", budget_category: "PER_PATIENT", charge_master_unit_cents: 9000, negotiated_unit_cents: 9000, units_per_occurrence: 1, expected_occurrences: 3 }
              as: CoverageAnalyst
              as_user_id: "analyst_1"
          trigger:
            - call: "POST /research-billing/coverage-analyses/${analysis_id}/approve"
              as: ComplianceReviewer
              as_user_id: "reviewer_1"
              captures: { observed_error: "$.data.error_id" }
          assert:
            - "trigger response 409 with error_id == \"ERR_ANALYSIS_NOT_UNDER_REVIEW\""
            - "trigger response error_id is NOT \"ERR_INVALID_STATE_TRANSITION\" - the domain-specific code wins on this endpoint"
            - "GET /research-billing/coverage-analyses/${analysis_id} still shows status == \"DRAFT\", approved_at == null, approved_by_user_id == null, version == 2"
            - "GET /research-billing/studies/${study_id} still shows lifecycle_status == \"COVERAGE_PENDING\" - LC-2 did not fire"
            - "POST /research-billing/coverage-analyses/${analysis_id}/return also returns 409 ERR_ANALYSIS_NOT_UNDER_REVIEW from DRAFT"

      - name: resolving_a_closed_finding_again_is_refused
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.AuditFinding.terminal_states
          - errors[ERR_FINDING_NOT_RESPONDED]
          - errors[ERR_FINDING_NOT_OPEN]
        distinguishing_aspect: "CLOSED_NO_ACTION is terminal: a second resolve returns 409 ERR_FINDING_NOT_RESPONDED and a second respond returns 409 ERR_FINDING_NOT_OPEN, and neither attempt re-decrements the study's open_finding_count (which is already 0) or re-blocks its posture."
        test_recipe:
          setup:
            - "One study with a study-level MISSING_REGISTRY_NUMBER finding opened by auditor_1, responded to by auditor_2 and already resolved NO_ACTION, leaving it in CLOSED_NO_ACTION."
          setup_api_calls:
