  # ==========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: therapist_halfopen_overlap_rejected
        grounds:
          - validations[priority=10]
          - errors[ERR_THERAPIST_UNAVAILABLE]
          - entities.Session.fields.therapist_id
        distinguishing_aspect: |
          Therapist resource, half-open [start,end) interval arithmetic with NO buffer: a
          second session 09:30-10:30 strictly overlaps the first 09:00-10:00 for the same
          therapist -> ERR_THERAPIST_UNAVAILABLE. Distinct from the room buffer rule.
        test_recipe:
          setup:
            - "Therapist with session 09:00-10:00 in Room 1; a second Room 2 exists to isolate the room rule."
          setup_api_calls:
            - call: "POST /therapists"
              payload: { full_name: "T Ov", discipline: "MUSIC", credential: "MT-BC" }
              as: IntakeCoordinator
              captures: { ther_id: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Ov Client", dob: "2015-07-07", payer_type: "SELF_PAY", household_income_cents: 5000000, household_size: 1 }
              as: IntakeCoordinator
              captures: { client_id: $.data.id, cv0: $.data.version }
            - call: "POST /referrals"
              payload: { client_id: "${client_id}", referral_source: "Self", reason: "x", referred_discipline: "MUSIC" }
              as: IntakeCoordinator
              captures: { ref_id: $.data.id }
            - call: "POST /referrals/${ref_id}/assess"
              payload: { recommendation: "THERAPY_RECOMMENDED", baseline_score: 50 }
              as: Therapist
              as_user_id: "${ther_id}"
            - call: "POST /clients/${client_id}/treatment-plans"
              payload: { referral_id: "${ref_id}", discipline: "MUSIC", weekly_frequency: 1, expected_client_version: "${cv0}" }
              as: ClinicalDirector
              captures: { plan_id: $.data.id }
            - call: "POST /treatment-plans/${plan_id}/activate"
              payload: {}
              as: ClinicalDirector
            - call: "POST /treatment-plans/${plan_id}/goals"
              payload: { description: "g", target_sessions: 6, weight: 1.0 }
              as: ClinicalDirector
              captures: { goal_id: $.data.id }
            - call: "POST /rooms"
              payload: { name: "Room 1", capacity: 3 }
              as: IntakeCoordinator
              captures: { room1: $.data.id }
            - call: "POST /rooms"
              payload: { name: "Room 2", capacity: 3 }
              as: IntakeCoordinator
              captures: { room2: $.data.id }
            - call: "POST /sessions"
              payload: { therapist_id: "${ther_id}", room_id: "${room1}", plan_id: "${plan_id}", goal_id: "${goal_id}", modality: "INDIVIDUAL", start_utc: "2026-06-01T09:00:00Z", end_utc: "2026-06-01T10:00:00Z", capacity: 1 }
              as: Therapist
              as_user_id: "${ther_id}"
              captures: { s1: $.data.id }
          trigger:
            - call: "POST /sessions"
              payload: { therapist_id: "${ther_id}", room_id: "${room2}", plan_id: "${plan_id}", goal_id: "${goal_id}", modality: "INDIVIDUAL", start_utc: "2026-06-01T09:30:00Z", end_utc: "2026-06-01T10:30:00Z", capacity: 1 }
              as: Therapist
              as_user_id: "${ther_id}"
          assert:
            - "Response status 409 with error_id == ERR_THERAPIST_UNAVAILABLE"

      - name: room_turnaround_buffer_rejected
        grounds:
          - validations[priority=11]
          - errors[ERR_ROOM_UNAVAILABLE]
          - entities.Session.fields.room_id
        distinguishing_aspect: |
          Room resource, buffer-expanded interval semantics: a second session in the SAME
          room starting 10:05, only 5 minutes after the first ends at 10:00, violates the
          15-minute TURNAROUND_BUFFER even though the raw intervals do not overlap ->
          ERR_ROOM_UNAVAILABLE. Different interval arithmetic than the therapist rule, and a
          different resource (Room). A different therapist is used so the therapist rule
          does not fire.
        test_recipe:
          setup:
            - "Room 1 has a session 09:00-10:00 by therapist T1; therapist T2 also exists; both plans ACTIVE."
          setup_api_calls:
            - call: "POST /therapists"
              payload: { full_name: "T1 Buf", discipline: "MUSIC", credential: "MT-BC" }
              as: IntakeCoordinator
              captures: { t1: $.data.id }
            - call: "POST /therapists"
              payload: { full_name: "T2 Buf", discipline: "MUSIC", credential: "MT-BC" }
              as: IntakeCoordinator
              captures: { t2: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Buf Client", dob: "2015-08-08", payer_type: "SELF_PAY", household_income_cents: 5000000, household_size: 1 }
              as: IntakeCoordinator
              captures: { client_id: $.data.id, cv0: $.data.version }
            - call: "POST /referrals"
              payload: { client_id: "${client_id}", referral_source: "Self", reason: "x", referred_discipline: "MUSIC" }
              as: IntakeCoordinator
              captures: { ref_id: $.data.id }
            - call: "POST /referrals/${ref_id}/assess"
              payload: { recommendation: "THERAPY_RECOMMENDED", baseline_score: 50 }
              as: Therapist
              as_user_id: "${t1}"
            - call: "POST /clients/${client_id}/treatment-plans"
              payload: { referral_id: "${ref_id}", discipline: "MUSIC", weekly_frequency: 1, expected_client_version: "${cv0}" }
              as: ClinicalDirector
              captures: { plan_id: $.data.id }
            - call: "POST /treatment-plans/${plan_id}/activate"
              payload: {}
              as: ClinicalDirector
            - call: "POST /treatment-plans/${plan_id}/goals"
              payload: { description: "g", target_sessions: 6, weight: 1.0 }
              as: ClinicalDirector
              captures: { goal_id: $.data.id }
            - call: "POST /rooms"
              payload: { name: "Room 1", capacity: 3 }
              as: IntakeCoordinator
              captures: { room1: $.data.id }
            - call: "POST /sessions"
              payload: { therapist_id: "${t1}", room_id: "${room1}", plan_id: "${plan_id}", goal_id: "${goal_id}", modality: "INDIVIDUAL", start_utc: "2026-06-01T09:00:00Z", end_utc: "2026-06-01T10:00:00Z", capacity: 1 }
              as: Therapist
              as_user_id: "${t1}"
              captures: { s1: $.data.id }
          trigger:
            - call: "POST /sessions"
              payload: { therapist_id: "${t2}", room_id: "${room1}", plan_id: "${plan_id}", goal_id: "${goal_id}", modality: "INDIVIDUAL", start_utc: "2026-06-01T10:05:00Z", end_utc: "2026-06-01T11:00:00Z", capacity: 1 }
              as: Therapist
              as_user_id: "${t2}"
          assert:
            - "Response status 409 with error_id == ERR_ROOM_UNAVAILABLE (gap 5 min < 15 min buffer)"

  # ==========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: instrument_reserve_release_conserves_on_hand
        grounds:
          - calculations.instrument_availability
          - entities.MaterialItem.fields.available_quantity
          - entities.MaterialItem.fields.reserved_quantity
          - state_machines.Session.SCHEDULED_to_CANCELLED
        distinguishing_aspect: |
          Conserved quantity = physical instrument on_hand. Reserve on session create
          (available 5->3, reserved 0->2) paired with its compensating release on cancel
          restores available to 5 and reserved to 0; available+reserved==on_hand==5 holds
          throughout (no drift).
        test_recipe:
          setup:
            - "Material on_hand=5; ACTIVE plan/goal; a SCHEDULED session reserving material_qty=2."
          setup_api_calls:
            - call: "POST /therapists"
              payload: { full_name: "T Inv", discipline: "MUSIC", credential: "MT-BC" }
              as: IntakeCoordinator
              captures: { ther_id: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Inv Client", dob: "2015-09-09", payer_type: "SELF_PAY", household_income_cents: 5000000, household_size: 1 }
              as: IntakeCoordinator
              captures: { client_id: $.data.id, cv0: $.data.version }
            - call: "POST /referrals"
              payload: { client_id: "${client_id}", referral_source: "Self", reason: "x", referred_discipline: "MUSIC" }
              as: IntakeCoordinator
              captures: { ref_id: $.data.id }
            - call: "POST /referrals/${ref_id}/assess"
              payload: { recommendation: "THERAPY_RECOMMENDED", baseline_score: 50 }
              as: Therapist
              as_user_id: "${ther_id}"
            - call: "POST /clients/${client_id}/treatment-plans"
              payload: { referral_id: "${ref_id}", discipline: "MUSIC", weekly_frequency: 1, expected_client_version: "${cv0}" }
              as: ClinicalDirector
              captures: { plan_id: $.data.id }
            - call: "POST /treatment-plans/${plan_id}/activate"
              payload: {}
              as: ClinicalDirector
            - call: "POST /treatment-plans/${plan_id}/goals"
              payload: { description: "g", target_sessions: 6, weight: 1.0 }
              as: ClinicalDirector
              captures: { goal_id: $.data.id }
            - call: "POST /rooms"
              payload: { name: "Room L", capacity: 3 }
              as: IntakeCoordinator
              captures: { room_id: $.data.id }
            - call: "POST /materials"
              payload: { name: "Xylophone", category: "INSTRUMENT", on_hand_quantity: 5, unit_charge_cents: 300 }
              as: IntakeCoordinator
              captures: { mat_id: $.data.id }
            - call: "POST /sessions"
              payload: { therapist_id: "${ther_id}", room_id: "${room_id}", plan_id: "${plan_id}", goal_id: "${goal_id}", modality: "INDIVIDUAL", start_utc: "2026-06-05T09:00:00Z", end_utc: "2026-06-05T10:00:00Z", capacity: 1, material_item_id: "${mat_id}", material_qty: 2 }
              as: Therapist
              as_user_id: "${ther_id}"
              captures: { sess_id: $.data.id }
          trigger:
            - call: "POST /sessions/${sess_id}/cancel"
              payload: { cancel_reason: "client withdrew" }
              as: Therapist
              as_user_id: "${ther_id}"
          assert:
            - "Before cancel: MaterialItem.${mat_id}.reserved_quantity == 2 and available_quantity == 3"
            - "After cancel: MaterialItem.${mat_id}.reserved_quantity == 0 and available_quantity == 5"
            - "Invariant available_quantity + reserved_quantity == on_hand_quantity == 5 holds at both points"

      - name: insurance_visit_bill_void_conserves_authorization
        grounds:
          - entities.Client.fields.insurance_visits_used
          - entities.Client.fields.insurance_visits_remaining
          - state_machines.Session.UNBILLED_to_BILLED
          - state_machines.Session.BILLED_to_UNBILLED
        distinguishing_aspect: |
          Conserved quantity = authorization visit credits (distinct from physical
          instruments). Superbill create consumes one visit (used 0->1, remaining 3->2);
          the compensating void refunds it (used 1->0, remaining 2->3); used+remaining==
          authorized==3 holds throughout.
        test_recipe:
          setup:
            - "Insurance client visits_authorized=3; completed INDIVIDUAL session; superbill created (BILLED, used=1)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: IntakeCoordinator
            - call: "POST /therapists"
              payload: { full_name: "T Vis", discipline: "MUSIC", credential: "MT-BC" }
              as: IntakeCoordinator
              captures: { ther_id: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Vis Client", dob: "2015-10-10", payer_type: "INSURANCE", insurance_payer_name: "BlueCo", insurance_coinsurance_pct: 0.20, insurance_contracted_rate_cents: 12503, insurance_visits_authorized: 3 }
              as: IntakeCoordinator
