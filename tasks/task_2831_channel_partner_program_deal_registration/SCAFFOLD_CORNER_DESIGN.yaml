# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml - task 2831 Channel Partner Program & Deal Registration
# Breadth probe (SKILL.md 1.9). Taxonomy: references/claim-extraction-guide.md.
# Every section: / claim_type: pair below comes from that guide; sibling depth
# probe lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml (18 instances, 9 rules).
# Logical clock: POST /_clock/set_current_utc, startup default 2026-08-01T00:00:00Z;
# every instance pins the clock explicitly as its first call.
# =============================================================================
scaffold_corner_design:

  # =========================================================================
  # Table 1 - Entities
  # =========================================================================
  - section: entities
    instances:
      - name: partner_creation_returns_all_program_fields
        claim_type: creation
        grounds:
          - endpoints[POST /partners]
          - entities.Partner.fields.tier
          - entities.Partner.fields.tier_status
          - entities.Partner.fields.portal_entitlement_level
        distinguishing_aspect: "POST /partners with company_name, partner_type and marketing_commitment_cents returns 201 with every system field seeded at the entry tier: tier REGISTERED, tier_status COMPLIANT, portal BASIC, and all four counters 0."
        test_recipe:
          setup:
            - "Empty database, logical clock pinned to 2026-01-05T00:00:00.000Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-05T00:00:00.000Z" }
              as: ChannelOpsAnalyst
          trigger:
            - call: "POST /partners"
              payload: { company_name: "Aster Systems", partner_type: "RESELLER", marketing_commitment_cents: 500000 }
              as: ChannelOpsAnalyst
              as_user_id: "u_ops_1"
              captures: { p_new_id: $.data.id }
          assert:
            - "http status is 201 and the envelope is { meta, response_type: 'object', data: {...} }"
            - "Partner.${p_new_id}.company_name == Aster Systems, partner_type == RESELLER, marketing_commitment_cents == 500000"
            - "Partner.${p_new_id}.tier == REGISTERED, tier_status == COMPLIANT, standing_reason == null"
            - "Partner.${p_new_id}.portal_entitlement_level == BASIC"
            - "Partner.${p_new_id}.cert_credit_total == 0, trailing_revenue_cents == 0, marketing_qualified_spend_cents == 0, open_conflict_count == 0"
            - "Partner.${p_new_id}.id, created_at, updated_at and version are present with version == 1 and created_at == 2026-01-05T00:00:00.000Z"

      - name: partner_defaults_applied_when_marketing_commitment_omitted
        claim_type: defaults
        grounds:
          - endpoints[POST /partners]
          - entities.Partner.fields.marketing_commitment_cents
          - calculations.marketing_attainment
        distinguishing_aspect: "Omitting marketing_commitment_cents applies the declared default 0, which makes marketing_attainment_pct exactly 1.0 (a zero commitment is vacuously attained) instead of leaving it null."
        test_recipe:
          setup:
            - "Empty database, clock 2026-01-05T00:00:00.000Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-05T00:00:00.000Z" }
              as: ChannelOpsAnalyst
          trigger:
            - call: "POST /partners"
              payload: { company_name: "Borealis Resellers", partner_type: "RESELLER" }
              as: ChannelOpsAnalyst
              as_user_id: "u_ops_1"
              captures: { p_def_id: $.data.id }
          assert:
            - "Partner.${p_def_id}.marketing_commitment_cents == 0"
            - "Partner.${p_def_id}.marketing_attainment_pct == 1.0"
            - "Partner.${p_def_id}.tier_status == COMPLIANT (a vacuous attainment never trips MARKETING_COMPLIANCE_MIN_PCT 0.75)"

      - name: partner_get_returns_the_stored_row
        claim_type: retrieval
        grounds:
          - endpoints[GET /partners/{id}]
          - entities.Partner
        distinguishing_aspect: "GET /partners/{id} as ChannelDirector returns exactly the row POST /partners created, with the same version and no field renamed or omitted."
        test_recipe:
          setup:
            - "One RESELLER partner created at clock 2026-01-05T00:00:00.000Z with marketing_commitment_cents 250000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-05T00:00:00.000Z" }
              as: ChannelOpsAnalyst
            - call: "POST /partners"
              payload: { company_name: "Cinder Networks", partner_type: "RESELLER", marketing_commitment_cents: 250000 }
              as: ChannelOpsAnalyst
              as_user_id: "u_ops_1"
              captures: { p_get_id: $.data.id }
          trigger:
            - call: "GET /partners/${p_get_id}"
              payload: {}
              as: ChannelDirector
              as_user_id: "u_dir_1"
          assert:
            - "http status is 200 with response_type == object"
            - "the returned id == ${p_get_id}, company_name == Cinder Networks, partner_type == RESELLER, marketing_commitment_cents == 250000"
            - "the returned tier == REGISTERED, portal_entitlement_level == BASIC, version == 1"

      - name: partners_list_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints[GET /partners]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With three partners stored, GET /partners?limit=2&offset=0 returns 2 rows with total_count 3 and has_more true, and offset=2 returns the last row with has_more false."
        test_recipe:
          setup:
            - "Three partners created at clock 2026-01-05T00:00:00.000Z: two RESELLERs and one DISTRIBUTOR."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-05T00:00:00.000Z" }
              as: ChannelOpsAnalyst
            - call: "POST /partners"
              payload: { company_name: "Aster Systems", partner_type: "RESELLER" }
              as: ChannelOpsAnalyst
              as_user_id: "u_ops_1"
            - call: "POST /partners"
              payload: { company_name: "Borealis Resellers", partner_type: "RESELLER" }
              as: ChannelOpsAnalyst
              as_user_id: "u_ops_1"
            - call: "POST /partners"
              payload: { company_name: "Northwind Distribution", partner_type: "DISTRIBUTOR" }
              as: ChannelOpsAnalyst
              as_user_id: "u_ops_1"
          trigger:
            - call: "GET /partners"
              payload: { limit: 2, offset: 0 }
              as: ChannelOpsAnalyst
              as_user_id: "u_ops_1"
            - call: "GET /partners"
              payload: { limit: 2, offset: 2 }
              as: ChannelOpsAnalyst
              as_user_id: "u_ops_1"
            - call: "GET /partners"
              payload: { partner_type: "DISTRIBUTOR" }
              as: ChannelOpsAnalyst
              as_user_id: "u_ops_1"
          assert:
            - "the first call returns response_type == array with 2 data rows, total_count == 3, has_more == true, limit == 2, offset == 0"
            - "the second call returns 1 data row, total_count == 3, has_more == false"
            - "the third call returns exactly 1 row (Northwind Distribution) with total_count == 1 and has_more == false"

      - name: account_get_with_unknown_id_returns_not_found
        claim_type: not_found
        grounds:
          - endpoints[GET /accounts/{id}]
          - errors[ERR_ACCOUNT_NOT_FOUND]
          - validations[priority=3]
        distinguishing_aspect: "GET /accounts/{id} with a syntactically valid but unused UUID returns ERR_ACCOUNT_NOT_FOUND with http_status 404, not an empty 200 body."
        test_recipe:
          setup:
            - "Empty database, clock 2026-01-05T00:00:00.000Z; no Account row was ever created."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-05T00:00:00.000Z" }
              as: ChannelOpsAnalyst
          trigger:
            - call: "GET /accounts/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: ChannelOpsAnalyst
              as_user_id: "u_ops_1"
          assert:
            - "the response error_id == ERR_ACCOUNT_NOT_FOUND with http_status 404 and response_type == error"
            - "the error envelope carries data.error_id and data.message"

      - name: deal_registration_create_missing_required_expected_amount_rejected
        claim_type: required_fields
        grounds:
          - endpoints[POST /deal-registrations]
          - validations[priority=5]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /deal-registrations without expected_amount_cents - a declared required input with no default - returns ERR_INVALID_REQUEST 422 and creates no row."
        test_recipe:
          setup:
            - "One RESELLER partner with one TECH_ASSOCIATE certification and one account, clock 2026-01-05T00:00:00.000Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-05T00:00:00.000Z" }
              as: ChannelOpsAnalyst
            - call: "POST /partners"
              payload: { company_name: "Aster Systems", partner_type: "RESELLER" }
              as: ChannelOpsAnalyst
              as_user_id: "u_ops_1"
              captures: { p_req_id: $.data.id }
            - call: "POST /partners/${p_req_id}/certifications"
              payload: { engineer_name: "Iva Sorel", track: "TECH_ASSOCIATE", issued_at: "2025-06-01T00:00:00.000Z", expires_at: "2028-06-01T00:00:00.000Z" }
              as: ChannelOpsAnalyst
              as_user_id: "u_ops_1"
            - call: "POST /accounts"
              payload: { account_name: "Granite Health", region_code: "NA" }
              as: ChannelOpsAnalyst
              as_user_id: "u_ops_1"
              captures: { acc_req_id: $.data.id }
          trigger:
            - call: "POST /deal-registrations"
              payload: { partner_id: "${p_req_id}", account_id: "${acc_req_id}", product_line: "ANALYTICS_ADDON", expected_close_date: "2026-08-31T00:00:00.000Z" }
              as: Partner
              as_user_id: "${p_req_id}"
          assert:
            - "the response error_id == ERR_INVALID_REQUEST with http_status 422"
            - "GET /deal-registrations with partner_id == ${p_req_id} returns an empty list"

      - name: mdf_claim_create_with_invalid_enum_activity_type_rejected
        claim_type: type_constraints
        grounds:
          - entities.MdfClaim.fields.activity_type
          - validations[priority=5]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "activity_type accepts only {EVENT, DIGITAL_CAMPAIGN, CONTENT_SYNDICATION}; the value TRADE_SHOW is refused with ERR_INVALID_REQUEST 422 and the allocation's committed_cents stays 0."
        test_recipe:
          setup:
            - "A SILVER partner is not needed: a REGISTERED partner's allocation would be 0, so this instance uses the GOLD DISTRIBUTOR of the difficulty chain reduced to its minimum - one STOCKING invoice of list 10,000,000 (invoice_amount 8,650,000) INVOICED at 2026-01-05, three TECH_EXPERT certifications, one clean performance review approved by a second user, giving tier GOLD."
            - "One MDF period [2026-02-01T00:00:00.000Z, 2026-06-30T23:59:59.999Z] with allocated_cents 273,000 at clock 2026-02-10T00:00:00.000Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-05T00:00:00.000Z" }
              as: ChannelOpsAnalyst
            - call: "POST /partners"
              payload: { company_name: "Northwind Distribution", partner_type: "DISTRIBUTOR", marketing_commitment_cents: 0 }
              as: ChannelOpsAnalyst
              as_user_id: "u_ops_1"
              captures: { p1_id: $.data.id }
            - call: "POST /partners/${p1_id}/certifications"
              payload: { engineer_name: "Ada Lin", track: "TECH_EXPERT", issued_at: "2025-06-01T00:00:00.000Z", expires_at: "2028-06-01T00:00:00.000Z" }
              as: ChannelOpsAnalyst
              as_user_id: "u_ops_1"
            - call: "POST /partners/${p1_id}/certifications"
              payload: { engineer_name: "Bo Reyes", track: "TECH_EXPERT", issued_at: "2025-06-01T00:00:00.000Z", expires_at: "2028-06-01T00:00:00.000Z" }
              as: ChannelOpsAnalyst
              as_user_id: "u_ops_1"
            - call: "POST /partners/${p1_id}/certifications"
              payload: { engineer_name: "Cy Duarte", track: "TECH_EXPERT", issued_at: "2025-06-01T00:00:00.000Z", expires_at: "2028-06-01T00:00:00.000Z" }
              as: ChannelOpsAnalyst
              as_user_id: "u_ops_1"
            - call: "POST /order-invoices"
              payload: { partner_id: "${p1_id}", order_type: "STOCKING", list_amount_cents: 10000000 }
              as: ChannelOpsAnalyst
              as_user_id: "u_ops_1"
              captures: { inv_seed_id: $.data.id }
            - call: "POST /order-invoices/${inv_seed_id}/invoice"
              payload: {}
              as: ChannelOpsAnalyst
              as_user_id: "u_ops_1"
            - call: "POST /performance-reviews"
              payload: { partner_id: "${p1_id}", period_start: "2026-01-01T00:00:00.000Z", period_end: "2026-01-31T23:59:59.999Z", findings_count: 0 }
              as: ChannelOpsAnalyst
              as_user_id: "u_ops_1"
              captures: { rev_gold_id: $.data.id }
            - call: "POST /performance-reviews/${rev_gold_id}/decision"
              payload: { decision: "APPROVE" }
              as: ChannelDirector
              as_user_id: "u_dir_1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-02-10T00:00:00.000Z" }
              as: ChannelOpsAnalyst
            - call: "POST /mdf-allocations"
              payload: { partner_id: "${p1_id}", period_start: "2026-02-01T00:00:00.000Z", period_end: "2026-06-30T23:59:59.999Z" }
              as: ChannelOpsAnalyst
              as_user_id: "u_ops_1"
              captures: { alloc_id: $.data.id }
          trigger:
            - call: "POST /mdf-claims"
              payload: { allocation_id: "${alloc_id}", activity_type: "TRADE_SHOW", requested_cents: 10000 }
              as: Partner
              as_user_id: "${p1_id}"
          assert:
            - "the response error_id == ERR_INVALID_REQUEST with http_status 422"
            - "MdfAllocation.${alloc_id}.allocated_cents == 273000, committed_cents == 0, available_cents == 273000"
            - "GET /mdf-allocations/${alloc_id}/mdf-claims returns an empty list"

      - name: order_invoice_computed_margin_recomputed_ignoring_extra_field_input
        claim_type: computed_fields
        grounds:
          - calculations.channel_margin_resolution
          - entities.OrderInvoice.fields.margin_pct
          - entities.OrderInvoice.fields.invoice_amount_cents
        distinguishing_aspect: "margin_pct and invoice_amount_cents are source: computed - a client-supplied margin_pct of 0.5 in the create payload is ignored and the server writes 0.1350 / 8,650,000 from BASE_MARGIN_PCT[REGISTERED] 0.10 + STOCKING 0.02 + MID band 0.015."
        test_recipe:
          setup:
            - "One REGISTERED DISTRIBUTOR partner, clock 2026-01-05T00:00:00.000Z, no registration linked."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-05T00:00:00.000Z" }
              as: ChannelOpsAnalyst
            - call: "POST /partners"
              payload: { company_name: "Northwind Distribution", partner_type: "DISTRIBUTOR" }
              as: ChannelOpsAnalyst
              as_user_id: "u_ops_1"
              captures: { p_inv_id: $.data.id }
          trigger:
            - call: "POST /order-invoices"
              payload: { partner_id: "${p_inv_id}", order_type: "STOCKING", list_amount_cents: 10000000, margin_pct: 0.5, invoice_amount_cents: 1 }
              as: ChannelOpsAnalyst
              as_user_id: "u_ops_1"
              captures: { inv_extra_id: $.data.id }
          assert:
            - "OrderInvoice.${inv_extra_id}.margin_pct == 0.1350 (the client's 0.5 is ignored)"
            - "OrderInvoice.${inv_extra_id}.invoice_amount_cents == 8650000 and margin_value_cents == 1350000 (the client's 1 is ignored)"
            - "OrderInvoice.${inv_extra_id}.status == PENDING, credit_memo_cents == 0, invoiced_at == null"
            - "Partner.${p_inv_id}.trailing_revenue_cents == 0 (a PENDING invoice never enters the rollup)"

      - name: certification_system_fields_are_server_generated
        claim_type: system_fields
        grounds:
          - endpoints[POST /partners/{id}/certifications]
          - entities.CertificationRecord.fields.credit_weight
          - calculations.certification_credit_rollup
        distinguishing_aspect: "credit_weight and status are server-written: a TECH_EXPERT record is stored with credit_weight 4 and status ACTIVE, and the parent partner's cert_credit_total becomes 4 in the same request."
        test_recipe:
          setup:
            - "One RESELLER partner with no certifications, clock 2026-01-05T00:00:00.000Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-05T00:00:00.000Z" }
              as: ChannelOpsAnalyst
            - call: "POST /partners"
              payload: { company_name: "Aster Systems", partner_type: "RESELLER" }
              as: ChannelOpsAnalyst
              as_user_id: "u_ops_1"
              captures: { p_cert_id: $.data.id }
          trigger:
            - call: "POST /partners/${p_cert_id}/certifications"
              payload: { engineer_name: "Iva Sorel", track: "TECH_EXPERT", issued_at: "2025-06-01T00:00:00.000Z", expires_at: "2028-06-01T00:00:00.000Z" }
              as: ChannelOpsAnalyst
              as_user_id: "u_ops_1"
              captures: { cert_id: $.data.id }
          assert:
            - "http status is 201 and CertificationRecord.${cert_id}.credit_weight == 4 with status == ACTIVE"
            - "CertificationRecord.${cert_id}.id, created_at, updated_at and version are server-generated with version == 1"
            - "Partner.${p_cert_id}.cert_credit_total == 4 in the same transaction"
            - "Partner.${p_cert_id}.portal_entitlement_level == BASIC (REGISTERED base index 0; CERT_FLOOR_BY_TIER[REGISTERED] is 0 so no demotion)"

      - name: certification_create_under_unknown_partner_returns_not_found
        claim_type: parent_relationships
        grounds:
          - endpoints[POST /partners/{id}/certifications]
          - errors[ERR_PARTNER_NOT_FOUND]
          - validations[priority=3]
        distinguishing_aspect: "A child CertificationRecord cannot be created under a partner id that does not exist: the call returns ERR_PARTNER_NOT_FOUND 404 before any input validation on track or dates."
        test_recipe:
          setup:
            - "Empty database, clock 2026-01-05T00:00:00.000Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-05T00:00:00.000Z" }
              as: ChannelOpsAnalyst
          trigger:
            - call: "POST /partners/00000000-0000-0000-0000-0000000000aa/certifications"
              payload: { engineer_name: "Iva Sorel", track: "TECH_EXPERT", issued_at: "2025-06-01T00:00:00.000Z", expires_at: "2028-06-01T00:00:00.000Z" }
              as: ChannelOpsAnalyst
              as_user_id: "u_ops_1"
          assert:
            - "the response error_id == ERR_PARTNER_NOT_FOUND with http_status 404"
            - "GET /certifications returns an empty list"

      - name: deal_registration_create_with_unknown_account_fk_returns_not_found
        claim_type: flat
        grounds:
          - complexity_profile.entity_topology
          - endpoints[POST /deal-registrations]
          - errors[ERR_ACCOUNT_NOT_FOUND]
        distinguishing_aspect: "Under the flat topology every foreign key is validated on write even though it never appears in the URL: a create whose partner_id exists but whose account_id does not returns ERR_ACCOUNT_NOT_FOUND 404."
        test_recipe:
          setup:
            - "One RESELLER partner with one TECH_ASSOCIATE certification; no Account row exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-05T00:00:00.000Z" }
              as: ChannelOpsAnalyst
            - call: "POST /partners"
              payload: { company_name: "Aster Systems", partner_type: "RESELLER" }
              as: ChannelOpsAnalyst
              as_user_id: "u_ops_1"
              captures: { p_fk_id: $.data.id }
            - call: "POST /partners/${p_fk_id}/certifications"
              payload: { engineer_name: "Iva Sorel", track: "TECH_ASSOCIATE", issued_at: "2025-06-01T00:00:00.000Z", expires_at: "2028-06-01T00:00:00.000Z" }
              as: ChannelOpsAnalyst
              as_user_id: "u_ops_1"
          trigger:
            - call: "POST /deal-registrations"
              payload: { partner_id: "${p_fk_id}", account_id: "00000000-0000-0000-0000-0000000000bb", product_line: "ANALYTICS_ADDON", expected_amount_cents: 400000, expected_close_date: "2026-08-31T00:00:00.000Z" }
              as: Partner
              as_user_id: "${p_fk_id}"
          assert:
            - "the response error_id == ERR_ACCOUNT_NOT_FOUND with http_status 404"
            - "GET /deal-registrations with partner_id == ${p_fk_id} returns an empty list"

      - name: mdf_allocation_bucket_computed_fields_after_every_mutation
        claim_type: computed_fields
        grounds:
          - entities.MdfAllocation.fields.available_cents
          - consistency_model.invariants.mdf_allocation_bucket_conservation
        excluded_because:
          difficulty_instance: compensating_invariant / claim_reject_restores_mdf_fund_bucket_conservation
          rationale: "That instance asserts allocated/committed/paid/expired/available at three checkpoints (create, validate, claw-back), which is exactly this computed-field claim."

  # =========================================================================
  # Table 2 - State Machines
  # =========================================================================
  - section: state_machines
    instances:
      - name: deal_registration_initial_state_is_draft
        claim_type: initial_state
        grounds:
          - state_machines.DealRegistration.initial_state
          - endpoints[POST /deal-registrations]
        distinguishing_aspect: "A freshly created registration is DRAFT with every lifecycle field still null (submitted_at, approved_at, exclusivity window, closure_reason) and revision_round 0 - creation itself performs no transition."
        test_recipe:
          setup:
            - "One RESELLER partner with one TECH_ASSOCIATE certification and one OPEN_CHANNEL account, clock 2026-03-01T00:00:00.000Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-03-01T00:00:00.000Z" }
              as: ChannelOpsAnalyst
            - call: "POST /partners"
              payload: { company_name: "Aster Systems", partner_type: "RESELLER" }
              as: ChannelOpsAnalyst
              as_user_id: "u_ops_1"
              captures: { p_dr_id: $.data.id }
            - call: "POST /partners/${p_dr_id}/certifications"
              payload: { engineer_name: "Iva Sorel", track: "TECH_ASSOCIATE", issued_at: "2025-06-01T00:00:00.000Z", expires_at: "2028-06-01T00:00:00.000Z" }
              as: ChannelOpsAnalyst
              as_user_id: "u_ops_1"
            - call: "POST /accounts"
              payload: { account_name: "Granite Health", region_code: "NA" }
              as: ChannelOpsAnalyst
              as_user_id: "u_ops_1"
              captures: { acc_dr_id: $.data.id }
          trigger:
            - call: "POST /deal-registrations"
              payload: { partner_id: "${p_dr_id}", account_id: "${acc_dr_id}", product_line: "SUPPORT_SERVICES", expected_amount_cents: 400000, expected_close_date: "2026-08-31T00:00:00.000Z" }
              as: Partner
              as_user_id: "${p_dr_id}"
              captures: { r_dr_id: $.data.id }
          assert:
            - "DealRegistration.${r_dr_id}.status == DRAFT"
            - "DealRegistration.${r_dr_id}.submitted_at == null, approved_at == null, exclusivity_start_at == null, exclusivity_end_at == null, protection_days == null"
            - "DealRegistration.${r_dr_id}.revision_round == 0, closure_reason == null, supersedes_registration_id == null, registration_margin_uplift_pct == 0.0"
