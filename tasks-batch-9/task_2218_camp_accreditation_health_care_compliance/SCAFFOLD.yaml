  - method: GET
    path: "/accreditation/deficiencies"
    description: "list deficiencies; visit_id and standard_id are the reverse-reachability channels from AccreditationVisit and Standard"
    roles: [CampDirector, AccreditationOfficer]
    code: 200
    input: ["visit_id?", "standard_id?", "status?", "severity?", "limit?", "offset?"]
