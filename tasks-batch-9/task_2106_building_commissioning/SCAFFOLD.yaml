    roles: [CxAuthority]
    code: 200
    input: [reason]
    output: Issue
    side_effects: ["status = VOID", "CxProject.retainage_withheld_cents drops by exactly Issue.retainage_hold_cents", "recomputes issue_severity_index and readiness_posture", "increments CxProject.version by 1"]

