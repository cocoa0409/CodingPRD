          setup:
            - "Logical clock starts at 2026-08-01T00:00:00Z."
            - "One TIER_2 zone with 2000 occupied units and no FireIncident rows at all."
            - "One household of 1 sleeping area / 1 storey, visited and arrived with 2 pre-existing working smoke alarms and completed with install_outcome COMPLETE on 2026-08-01, so service_start_date is 2026-08-01 and served_household_count is 1."
