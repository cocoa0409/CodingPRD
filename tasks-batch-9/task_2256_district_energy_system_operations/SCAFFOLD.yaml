        side_effects: ["stores PipeSegment.leak_risk_score", "sets PipeSegment.condition = MONITORED", "decrements NetworkLoop.suspect_segment_count by 1", "increments NetworkLoop.version by 1"]
      - from: SUSPECT
        to: SOUND
        trigger: "POST /district-energy/pipe-segments/{segment_id}/condition-assessment"
        actor: NetworkEngineer
        preconditions: ["PipeSegment.condition == SUSPECT", "recomputed leak_risk_score < MONITORED_SCORE_FLOOR"]
        side_effects: ["stores PipeSegment.leak_risk_score", "sets PipeSegment.condition = SOUND", "decrements NetworkLoop.suspect_segment_count by 1", "increments NetworkLoop.version by 1"]
      - from: SOUND
        to: UNDER_REPAIR
