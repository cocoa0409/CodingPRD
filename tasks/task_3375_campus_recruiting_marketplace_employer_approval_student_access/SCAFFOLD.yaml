# =============================================================================
# PRD Benchmark Seed Tables
# Task: task_3375_campus_recruiting_marketplace_employer_approval_student_access
# Campus Recruiting Marketplace, Employer Approval & Student Access (Handshake)
# =============================================================================

scenario: |
  Campus Recruiting Marketplace, Employer Approval & Student Access (Handshake): university partnership onboarding with student roster provisioning and career center administration controls, employer account approval with domain verification, fraud screening and university-level trust decisions, job and internship posting with eligibility filters by school, major, graduation year and work authorization, career fair and event management with virtual and in-person session scheduling and student sign-ups, application routing to employer systems with document requirements and interview scheduling, university-specific approval workflows where a career center can block employers or postings, student profile visibility and proactive employer outreach with messaging limits, outcome data collection on first destination after graduation

domain_name: campus-recruiting-marketplace
api_prefix: "/"

# =============================================================================
# Complexity Profile (§0.1–§0.4) — difficulty gearing: beyond Expert ceiling
# (11 entities, 40 endpoints, ~40 error codes, 10 state machines, 2 OCC rules,
#  dual-variant + combinatorial calculations on multiple entity domains)
# =============================================================================
complexity_profile:
  primary_archetype: access_control_matrix
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - rate_threshold_triggers
    - scheduled_actions
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - many_to_many
    - cross_aggregate
  role_model: approval_chain
  consistency_model: immediate

# =============================================================================
# §1.1 Entity-Relationship Table
# All entities have common_fields: true → id (server UUID, identity only,
# never a business-decision input), created_at, updated_at, version (starts 1,
# +1 on every mutation including cascaded side effects).
# =============================================================================
entities:
  - name: University
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "University display name" }
      - { name: primary_domain, type: string, source: input, description: "Primary email/web domain, e.g. stateu.edu" }
      - { name: status, type: enum, source: system, description: "ONBOARDING | ACTIVE | SUSPENDED | OFFBOARDED" }
      - { name: employer_daily_message_cap, type: integer, source: input, default: 10, description: "Per-university ceiling on recruiter outreach messages per employer per logical day; >= 0" }
      - { name: enrolled_student_count, type: integer, source: computed, description: "Count of Students of this university with status == ENROLLED" }
      - { name: approved_employer_count, type: integer, source: computed, description: "Count of EmployerApprovals for this university with status == APPROVED" }

  - name: Student
    parent: null
    common_fields: true
    fields:
      - { name: university_id, type: string, source: input, description: "FK -> University.id; roster home of this student" }
      - { name: email, type: string, source: input, description: "Student email; used as waitlist-promotion tie-break (ASC) after created_at" }
      - { name: full_name, type: string, source: input, description: "Student full name" }
      - { name: major, type: string, source: input, description: "Major code, matched case-sensitively against JobPosting.required_majors" }
      - { name: graduation_year, type: integer, source: input, description: "4-digit graduation year; eligibility bounds are inclusive" }
      - { name: work_authorization, type: enum, source: input, description: "US_CITIZEN | PERMANENT_RESIDENT | VISA_OPT_CPT | SPONSORSHIP_REQUIRED" }
      - { name: profile_visibility, type: enum, source: input, default: UNIVERSITY_ONLY, description: "PUBLIC_TO_APPROVED_EMPLOYERS | UNIVERSITY_ONLY | HIDDEN" }
      - { name: status, type: enum, source: system, description: "ENROLLED | ALUMNUS | WITHDRAWN" }
      - { name: outcome_status, type: enum, source: system, default: UNREPORTED, description: "UNREPORTED | EMPLOYED | GRAD_SCHOOL | SEEKING | OTHER; writable via PATCH only while status == ALUMNUS" }
      - { name: outcome_employer_name, type: string, source: system, description: "First-destination employer/institution free text; nullable; writable via PATCH only while ALUMNUS" }
      - { name: outcome_recorded_at, type: datetime, source: system, description: "Logical-clock timestamp when outcome_status first left UNREPORTED; null until then" }

  - name: Employer
    parent: null
    common_fields: true
    fields:
      - { name: company_name, type: string, source: input, description: "Legal/display company name" }
      - { name: website_domain, type: string, source: input, description: "Company web domain, e.g. acme.com" }
      - { name: contact_email, type: string, source: input, description: "Recruiter contact email; domain match against website_domain feeds fraud scoring" }
      - { name: status, type: enum, source: system, description: "PENDING | DOMAIN_VERIFIED | APPROVED | UNDER_REVIEW | REJECTED" }
      - { name: domain_verification_token, type: string, source: system, description: "Server-minted token returned on create; required by verify-domain" }
      - { name: fraud_risk_score, type: integer, source: computed, description: "0-100, higher = riskier; see calculations.fraud_risk_score" }
      - { name: trust_tier, type: enum, source: computed, description: "LOW_RISK | STANDARD | ELEVATED | HIGH_RISK; derived from fraud_risk_score" }
      - { name: screen_count, type: integer, source: computed, description: "Number of POST /employers/{id}/screen calls applied" }
      - { name: last_trust_decision_at, type: datetime, source: system, description: "Logical-clock stamp of the latest employer-approval decide touching this employer; null until first decide" }

  - name: EmployerApproval
    parent: null
    common_fields: true
    fields:
      - { name: employer_id, type: string, source: input, description: "FK -> Employer.id" }
      - { name: university_id, type: string, source: input, description: "FK -> University.id; the university whose career center decides" }
      - { name: status, type: enum, source: system, description: "PENDING | APPROVED | BLOCKED | REVOKED | SUPERSEDED" }
      - { name: decision_reason, type: string, source: system, description: "Reason text recorded at decide; null while PENDING" }
      - { name: decided_at, type: datetime, source: system, description: "Logical-clock stamp of decision; null while PENDING" }
      - { name: trust_tier_at_decision, type: enum, source: system, description: "Employer.trust_tier pinned at decision time; null while PENDING" }
      - { name: supersedes_approval_id, type: string, source: system, description: "FK -> EmployerApproval.id; set on the new PENDING row when a prior BLOCKED/REVOKED row for the same (employer_id, university_id) is superseded; null otherwise" }

  - name: JobPosting
    parent: null
    common_fields: true
    fields:
      - { name: employer_id, type: string, source: input, description: "FK -> Employer.id; must equal caller identity for EmployerRecruiter" }
      - { name: title, type: string, source: input, description: "Posting title" }
      - { name: position_type, type: enum, source: input, description: "FULL_TIME | INTERNSHIP | COOP" }
      - { name: required_majors, type: array, source: input, default: [], description: "Empty = all majors eligible; otherwise student.major must be a member" }
      - { name: min_graduation_year, type: integer, source: input, description: "Inclusive lower bound on student.graduation_year" }
      - { name: max_graduation_year, type: integer, source: input, description: "Inclusive upper bound on student.graduation_year; must be >= min_graduation_year" }
      - { name: accepted_work_authorizations, type: array, source: input, default: [], description: "Empty = all authorizations accepted; otherwise student.work_authorization must be a member" }
      - { name: required_documents, type: array, source: input, default: [], description: "Array of doc_type members from RESUME | COVER_LETTER | TRANSCRIPT | PORTFOLIO that an application must include" }
      - { name: application_deadline, type: datetime, source: input, description: "Inclusive deadline: applications accepted while current_utc <= application_deadline" }
      - { name: status, type: enum, source: system, description: "Stored status: DRAFT | SUBMITTED | PUBLISHED | PAUSED | CLOSED. Reads project EXPIRED when stored status == PUBLISHED and current_utc > application_deadline (see calculations.posting_expiry_projection)" }
      - { name: blocked_university_ids, type: array, source: computed, description: "University ids where this posting is blocked (via clearance BLOCK or employer-approval BLOCK cascade)" }
      - { name: active_application_count, type: integer, source: computed, description: "Count of Applications with status in {SUBMITTED, UNDER_REVIEW, INTERVIEWING, OFFER_EXTENDED}" }

  - name: CareerEvent
    parent: null
    common_fields: true
    fields:
      - { name: university_id, type: string, source: input, description: "FK -> University.id; must equal caller identity for CareerCenterAdmin" }
      - { name: title, type: string, source: input, description: "Event title" }
      - { name: starts_at, type: datetime, source: input, description: "Event window start (inclusive)" }
      - { name: ends_at, type: datetime, source: input, description: "Event window end (inclusive); must be > starts_at" }
      - { name: status, type: enum, source: system, description: "DRAFT | OPEN | LOCKED | COMPLETED | CANCELLED" }
      - { name: last_session_added_at, type: datetime, source: system, description: "Logical-clock stamp of latest accepted session create; null until then" }

  - name: EventSession
    parent: null
    common_fields: true
    fields:
      - { name: career_event_id, type: string, source: system, description: "FK -> CareerEvent.id; taken from the URL path of POST /career-events/{id}/sessions" }
      - { name: title, type: string, source: input, description: "Session title" }
      - { name: mode, type: enum, source: input, description: "VIRTUAL | IN_PERSON" }
      - { name: room_id, type: string, source: input, description: "Required when mode == IN_PERSON; must be null when mode == VIRTUAL" }
      - { name: starts_at, type: datetime, source: input, description: "Session start; must satisfy event.starts_at <= starts_at" }
      - { name: ends_at, type: datetime, source: input, description: "Session end; must satisfy ends_at <= event.ends_at and starts_at < ends_at" }
      - { name: signup_deadline, type: datetime, source: input, description: "Signups accepted while current_utc < signup_deadline; must be <= starts_at" }
      - { name: capacity, type: integer, source: input, description: "Max REGISTERED signups; >= 1" }
      - { name: occupied_seats, type: integer, source: computed, description: "Count of EventSignups of this session with status == REGISTERED" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | CANCELLED; CANCELLED only via parent event cancellation cascade" }

  - name: EventSignup
    parent: null
    common_fields: true
    fields:
      - { name: event_session_id, type: string, source: input, description: "FK -> EventSession.id" }
      - { name: student_id, type: string, source: input, description: "FK -> Student.id; must equal caller identity for Student" }
      - { name: status, type: enum, source: system, description: "REGISTERED | WAITLISTED | CANCELLED | ATTENDED | NO_SHOW" }
      - { name: registered_at, type: datetime, source: system, description: "Logical-clock stamp when status became REGISTERED (at create or at waitlist promotion); null while WAITLISTED/CANCELLED-from-waitlist" }
      - { name: promoted_from_waitlist, type: boolean, source: system, default: false, description: "True if this signup entered REGISTERED via waitlist promotion" }

  - name: Application
    parent: null
    common_fields: true
    fields:
      - { name: student_id, type: string, source: input, description: "FK -> Student.id; must equal caller identity for Student" }
      - { name: job_posting_id, type: string, source: input, description: "FK -> JobPosting.id" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | UNDER_REVIEW | INTERVIEWING | OFFER_EXTENDED | ACCEPTED | DECLINED | REJECTED | WITHDRAWN | AUTO_WITHDRAWN" }
      - { name: submitted_documents, type: array, source: input, description: "Array of {doc_type, file_uri}; doc_type in RESUME | COVER_LETTER | TRANSCRIPT | PORTFOLIO" }
      - { name: documents_status, type: enum, source: computed, description: "COMPLETE iff every doc_type in posting.required_documents appears in submitted_documents; else INCOMPLETE" }
      - { name: submitted_at, type: datetime, source: system, description: "Logical-clock stamp of creation" }
      - { name: decided_at, type: datetime, source: system, description: "Logical-clock stamp of terminal transition; null while non-terminal" }

  - name: Interview
    parent: null
    common_fields: true
    fields:
      - { name: application_id, type: string, source: system, description: "FK -> Application.id; taken from the URL path of POST /applications/{id}/interviews" }
      - { name: interviewer_email, type: string, source: input, description: "Interviewer identity; schedule conflicts are evaluated per interviewer_email across all SCHEDULED interviews" }
      - { name: mode, type: enum, source: input, description: "VIRTUAL | IN_PERSON" }
      - { name: starts_at, type: datetime, source: input, description: "Interview start; must be < ends_at" }
      - { name: ends_at, type: datetime, source: input, description: "Interview end" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | CANCELLED; CANCELLED only via cascades (application terminal / student withdrawal / employer block)" }

  - name: OutreachMessage
    parent: null
    common_fields: true
    fields:
      - { name: employer_id, type: string, source: input, description: "FK -> Employer.id; must equal caller identity for EmployerRecruiter" }
      - { name: student_id, type: string, source: input, description: "FK -> Student.id; recipient" }
      - { name: university_id, type: string, source: computed, description: "FK -> University.id; denormalized from student.university_id at send time; scopes the daily cap" }
      - { name: body, type: string, source: input, description: "Message text" }
      - { name: sent_day, type: string, source: system, description: "Logical day bucket YYYY-MM-DD of creation under the logical clock; used for daily-cap counting" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: University
    initial_state: ONBOARDING
    terminal_states: [OFFBOARDED]
    transitions:
      - from: ONBOARDING
        to: ACTIVE
        trigger: "POST /universities/{id}/transition with to=ACTIVE"
        actor: PlatformAdmin
        preconditions: []
        side_effects: ["increments University.version by 1"]
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /universities/{id}/transition with to=SUSPENDED"
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "increments University.version by 1"
          - "While SUSPENDED: employer-approval decide, session create, event transition, signup create, application create and outreach send at this university all fail with ERR_UNIVERSITY_NOT_ACTIVE (no existing rows mutated)"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /universities/{id}/transition with to=ACTIVE"
        actor: PlatformAdmin
        preconditions: []
        side_effects: ["increments University.version by 1"]
      - from: [ACTIVE, SUSPENDED]
        to: OFFBOARDED
        trigger: "POST /universities/{id}/transition with to=OFFBOARDED"
        actor: PlatformAdmin
        preconditions: []
        side_effects: ["terminal; no students are mutated"]

  - entity: Student
    initial_state: ENROLLED
    terminal_states: [WITHDRAWN]
    transitions:
      - from: ENROLLED
        to: ALUMNUS
        trigger: "PATCH /students/{id} with status=ALUMNUS"
        actor: CareerCenterAdmin
        preconditions: ["caller university owns student.university_id"]
        side_effects: ["increments Student.version by 1"]
      - from: ENROLLED
        to: WITHDRAWN
        trigger: "PATCH /students/{id} with status=WITHDRAWN"
        actor: CareerCenterAdmin
        preconditions: ["caller university owns student.university_id"]
        side_effects:
          - "HOP 1: every Application of this student in {SUBMITTED, UNDER_REVIEW, INTERVIEWING, OFFER_EXTENDED} -> WITHDRAWN; each such transition decrements its JobPosting.active_application_count by 1"
          - "HOP 2: every Interview with status == SCHEDULED belonging to an application that just became WITHDRAWN -> CANCELLED"
          - "HOP 1 (second cascade branch): every EventSignup of this student in {REGISTERED, WAITLISTED} -> CANCELLED; each REGISTERED cancellation fires calculations.waitlist_promotion_order on its session"
          - "increments Student.version by 1"
      - from: ALUMNUS
        to: ALUMNUS
        trigger: "PATCH /students/{id} with outcome_status/outcome_employer_name (self-transition: field update, not a status change)"
        actor: CareerCenterAdmin
        preconditions: ["current status == ALUMNUS"]
        side_effects: ["outcome_recorded_at set on first non-UNREPORTED write", "increments Student.version by 1"]

  - entity: Employer
    initial_state: PENDING
    terminal_states: [REJECTED]
    transitions:
      - from: PENDING
        to: DOMAIN_VERIFIED
        trigger: "POST /employers/{id}/verify-domain with matching verification_token"
        actor: EmployerRecruiter
        preconditions: ["verification_token == Employer.domain_verification_token"]
        side_effects:
          - "fraud_risk_score computed with the auto_screen variant of calculations.fraud_risk_score; trust_tier re-derived"
          - "increments Employer.version by 1"
      - from: DOMAIN_VERIFIED
        to: APPROVED
        trigger: "POST /employers/{id}/screen with decision=CLEAR"
        actor: PlatformAdmin
        preconditions: ["resulting trust_tier != HIGH_RISK (else ERR_FRAUD_RISK_TOO_HIGH)"]
        side_effects: ["analyst_screen variant recomputes fraud_risk_score + trust_tier", "screen_count += 1", "increments Employer.version by 1"]
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /employers/{id}/screen with decision=CLEAR"
        actor: PlatformAdmin
        preconditions: ["resulting trust_tier != HIGH_RISK (else ERR_FRAUD_RISK_TOO_HIGH)"]
        side_effects: ["analyst_screen variant recomputes fraud_risk_score + trust_tier", "screen_count += 1", "increments Employer.version by 1"]
      - from: [DOMAIN_VERIFIED, APPROVED]
        to: UNDER_REVIEW
        trigger: "POST /employers/{id}/screen with decision=FLAG"
        actor: PlatformAdmin
        preconditions: []
        side_effects: ["analyst_screen variant recomputes fraud_risk_score + trust_tier (adds FLAG_PENALTY)", "screen_count += 1", "increments Employer.version by 1"]
      - from: [PENDING, DOMAIN_VERIFIED, UNDER_REVIEW]
        to: REJECTED
        trigger: "POST /employers/{id}/screen with decision=REJECT"
        actor: PlatformAdmin
        preconditions: []
        side_effects: ["screen_count += 1", "increments Employer.version by 1"]
        note: "REJECT from PENDING is allowed (platform may reject without domain verification); the NOT_DOMAIN_VERIFIED rule below governs CLEAR/FLAG from PENDING"

  - entity: EmployerApproval
    initial_state: PENDING
    terminal_states: [BLOCKED, REVOKED, SUPERSEDED]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /employer-approvals/{id}/decide with decision=APPROVE"
        actor: CareerCenterAdmin
        preconditions:
          - "caller university == approval.university_id"
          - "university.status == ACTIVE"
          - "expected_employer_version == current Employer.version (OCC, ERR_STALE_EMPLOYER_VERSION)"
        side_effects:
          - "decided_at stamped; trust_tier_at_decision pinned from Employer.trust_tier"
          - "stamps Employer.last_trust_decision_at and increments Employer.version by 1"
          - "increments University.approved_employer_count by 1"
      - from: PENDING
        to: BLOCKED
        trigger: "POST /employer-approvals/{id}/decide with decision=BLOCK"
        actor: CareerCenterAdmin
        preconditions:
          - "caller university == approval.university_id"
          - "university.status == ACTIVE"
          - "expected_employer_version == current Employer.version (OCC, ERR_STALE_EMPLOYER_VERSION)"
        side_effects:
          - "decided_at stamped; trust_tier_at_decision pinned"
          - "stamps Employer.last_trust_decision_at and increments Employer.version by 1"
          - "CASCADE HOP 1: for every JobPosting of this employer with stored status == PUBLISHED, approval.university_id is appended to JobPosting.blocked_university_ids (posting version +1 each)"
          - "CASCADE HOP 2: every Application from a Student with student.university_id == approval.university_id to one of those just-blocked postings, with status in {SUBMITTED, UNDER_REVIEW, INTERVIEWING}, -> AUTO_WITHDRAWN; each decrements its posting's active_application_count by 1"
          - "CASCADE HOP 3: every Interview with status == SCHEDULED belonging to an application that just became AUTO_WITHDRAWN -> CANCELLED"
          - "Applications in OFFER_EXTENDED are NOT touched (conditional cascade)"
      - from: APPROVED
        to: REVOKED
        trigger: "POST /employer-approvals/{id}/decide with decision=REVOKE"
        actor: CareerCenterAdmin
        preconditions:
          - "caller university == approval.university_id"
          - "expected_employer_version == current Employer.version (OCC, ERR_STALE_EMPLOYER_VERSION)"
        side_effects:
          - "decided_at stamped"
          - "stamps Employer.last_trust_decision_at and increments Employer.version by 1"
          - "decrements University.approved_employer_count by 1"
          - "same posting/application/interview cascade as BLOCK (HOP 1-3)"
      - from: [BLOCKED, REVOKED]
        to: SUPERSEDED
        trigger: "system: POST /employer-approvals creating a new row for the same (employer_id, university_id)"
        actor: system
        preconditions: []
        side_effects: ["the new row is created PENDING with supersedes_approval_id set to this row's id"]

  - entity: JobPosting
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /job-postings/{id}/transition with to=SUBMITTED"
        actor: EmployerRecruiter
        preconditions: ["caller employer == posting.employer_id"]
        side_effects: ["increments JobPosting.version by 1"]
      - from: SUBMITTED
        to: PUBLISHED
        trigger: "POST /job-postings/{id}/transition with to=PUBLISHED"
        actor: PlatformAdmin
        preconditions: ["employer.status == APPROVED (ERR_EMPLOYER_NOT_APPROVED)"]
        side_effects: ["increments JobPosting.version by 1"]
      - from: PUBLISHED
        to: PAUSED
        trigger: "POST /job-postings/{id}/transition with to=PAUSED"
        actor: EmployerRecruiter
        preconditions: ["caller employer == posting.employer_id"]
        side_effects: ["increments JobPosting.version by 1"]
      - from: PAUSED
        to: PUBLISHED
        trigger: "POST /job-postings/{id}/transition with to=PUBLISHED"
        actor: EmployerRecruiter
        preconditions: ["caller employer == posting.employer_id", "employer.status == APPROVED"]
        side_effects: ["increments JobPosting.version by 1"]
      - from: [DRAFT, SUBMITTED, PUBLISHED, PAUSED]
        to: CLOSED
        trigger: "POST /job-postings/{id}/transition with to=CLOSED"
        actor: EmployerRecruiter
        preconditions: ["caller employer == posting.employer_id"]
        side_effects: ["increments JobPosting.version by 1"]
      - from: PUBLISHED
        to: EXPIRED
        trigger: "system: projected on every read when current_utc > application_deadline"
        actor: system
        preconditions: []
        side_effects: []
        note: "EXPIRED is a read-time projection per calculations.posting_expiry_projection; the stored status stays PUBLISHED. Applications to a projected-EXPIRED posting fail with ERR_APPLICATION_DEADLINE_PASSED (business_temporal), NOT a state error."

  - entity: CareerEvent
    initial_state: DRAFT
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: DRAFT
        to: OPEN
        trigger: "POST /career-events/{id}/transition with to=OPEN"
        actor: CareerCenterAdmin
        preconditions: ["caller university == event.university_id", "university.status == ACTIVE"]
        side_effects: ["increments CareerEvent.version by 1"]
      - from: OPEN
        to: LOCKED
        trigger: "POST /career-events/{id}/transition with to=LOCKED"
        actor: CareerCenterAdmin
        preconditions: ["caller university == event.university_id"]
        side_effects: ["increments CareerEvent.version by 1", "session catalog frozen: further session creates fail with ERR_EVENT_NOT_OPEN"]
      - from: LOCKED
        to: COMPLETED
        trigger: "POST /career-events/{id}/transition with to=COMPLETED"
        actor: CareerCenterAdmin
        preconditions: ["caller university == event.university_id"]
        side_effects: ["increments CareerEvent.version by 1", "attendance marking on the event's signups becomes legal"]
      - from: [DRAFT, OPEN]
        to: CANCELLED
        trigger: "POST /career-events/{id}/transition with to=CANCELLED"
        actor: CareerCenterAdmin
        preconditions: ["caller university == event.university_id"]
        side_effects:
          - "HOP 1: every EventSession of this event with status == SCHEDULED -> CANCELLED"
          - "HOP 2: every EventSignup belonging to a session that just became CANCELLED, in {REGISTERED, WAITLISTED}, -> CANCELLED (no waitlist promotion fires — the session is gone)"
          - "increments CareerEvent.version by 1"

  - entity: EventSession
    initial_state: SCHEDULED
    terminal_states: [CANCELLED]
    transitions:
      - from: SCHEDULED
        to: CANCELLED
        trigger: "system: parent CareerEvent -> CANCELLED"
        actor: system
        preconditions: []
        side_effects: ["its {REGISTERED, WAITLISTED} signups -> CANCELLED (see CareerEvent cascade)"]

  - entity: EventSignup
    initial_state: REGISTERED
    terminal_states: [CANCELLED, ATTENDED, NO_SHOW]
    transitions:
      - from: WAITLISTED
        to: REGISTERED
        trigger: "system: a seat freed (a REGISTERED signup of the same session became CANCELLED)"
        actor: system
        preconditions: ["session still has status == SCHEDULED"]
        side_effects:
          - "promoted signup is chosen per calculations.waitlist_promotion_order"
          - "registered_at stamped; promoted_from_waitlist = true"
          - "EventSession.occupied_seats unchanged by the cancel+promote pair (see calculations.occupied_seats)"
      - from: [REGISTERED, WAITLISTED]
        to: CANCELLED
        trigger: "POST /event-signups/{id}/transition with to=CANCELLED (Student), or system cascade (student withdrawal / event cancellation)"
        actor: Student
        preconditions: ["for the API trigger: caller student == signup.student_id"]
        side_effects:
          - "if the cancelled signup was REGISTERED: calculations.waitlist_promotion_order fires on the session"
      - from: REGISTERED
        to: ATTENDED
        trigger: "POST /event-signups/{id}/transition with to=ATTENDED"
        actor: CareerCenterAdmin
        preconditions: ["caller university == session's event.university_id", "parent event.status == COMPLETED (else ERR_INVALID_SIGNUP_TRANSITION)"]
        side_effects: []
      - from: REGISTERED
        to: NO_SHOW
        trigger: "POST /event-signups/{id}/transition with to=NO_SHOW"
        actor: CareerCenterAdmin
        preconditions: ["caller university == session's event.university_id", "parent event.status == COMPLETED (else ERR_INVALID_SIGNUP_TRANSITION)"]
        side_effects: []
    note: "Creation lands in REGISTERED when occupied_seats < capacity at decision time, else WAITLISTED (initial_state lists the common case; both are legal create outcomes)."

  - entity: Application
    initial_state: SUBMITTED
    terminal_states: [ACCEPTED, DECLINED, REJECTED, WITHDRAWN, AUTO_WITHDRAWN]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /applications/{id}/transition with to=UNDER_REVIEW"
        actor: EmployerRecruiter
        preconditions: ["caller employer == posting.employer_id"]
        side_effects: []
      - from: UNDER_REVIEW
        to: INTERVIEWING
        trigger: "POST /applications/{id}/transition with to=INTERVIEWING"
        actor: EmployerRecruiter
        preconditions: ["caller employer == posting.employer_id"]
        side_effects: []
      - from: INTERVIEWING
        to: OFFER_EXTENDED
        trigger: "POST /applications/{id}/transition with to=OFFER_EXTENDED"
        actor: EmployerRecruiter
        preconditions: ["caller employer == posting.employer_id"]
        side_effects: ["offer_extended_at stamped via decided_at mechanism (decided_at stays null until terminal)"]
      - from: [SUBMITTED, UNDER_REVIEW, INTERVIEWING, OFFER_EXTENDED]
        to: REJECTED
        trigger: "POST /applications/{id}/transition with to=REJECTED"
        actor: EmployerRecruiter
        preconditions: ["caller employer == posting.employer_id"]
        side_effects: ["SCHEDULED interviews of this application -> CANCELLED", "posting.active_application_count -= 1", "decided_at stamped"]
      - from: [SUBMITTED, UNDER_REVIEW, INTERVIEWING, OFFER_EXTENDED]
        to: WITHDRAWN
        trigger: "POST /applications/{id}/transition with to=WITHDRAWN (Student), or system (student withdrawal cascade)"
        actor: Student
        preconditions: ["for the API trigger: caller student == application.student_id"]
        side_effects: ["SCHEDULED interviews of this application -> CANCELLED", "posting.active_application_count -= 1", "decided_at stamped"]
      - from: [SUBMITTED, UNDER_REVIEW, INTERVIEWING]
        to: AUTO_WITHDRAWN
        trigger: "system: employer-approval BLOCK/REVOKE cascade or posting clearance BLOCK cascade"
        actor: system
        preconditions: []
        side_effects: ["SCHEDULED interviews of this application -> CANCELLED", "posting.active_application_count -= 1", "decided_at stamped"]
        note: "OFFER_EXTENDED applications survive employer blocks (conditional cascade)"
      - from: OFFER_EXTENDED
        to: ACCEPTED
        trigger: "POST /applications/{id}/transition with to=ACCEPTED"
        actor: Student
        preconditions: ["caller student == application.student_id"]
        side_effects: ["SCHEDULED interviews -> CANCELLED", "posting.active_application_count -= 1", "decided_at stamped"]
      - from: OFFER_EXTENDED
        to: DECLINED
        trigger: "POST /applications/{id}/transition with to=DECLINED"
        actor: Student
        preconditions: ["caller student == application.student_id"]
        side_effects: ["SCHEDULED interviews -> CANCELLED", "posting.active_application_count -= 1", "decided_at stamped"]

  - entity: Interview
    initial_state: SCHEDULED
    terminal_states: [CANCELLED]
    transitions:
      - from: SCHEDULED
        to: CANCELLED
        trigger: "system: parent application reached a terminal state (REJECTED / WITHDRAWN / AUTO_WITHDRAWN / ACCEPTED / DECLINED)"
        actor: system
        preconditions: []
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (true races only, resolved via OCC on parent version)
# =============================================================================
concurrency_rules:
  - rule_id: employer-decision-stale-version
    parent_entity: Employer
    write_endpoint: "POST /employer-approvals/{id}/decide"
    occ_field: "expected_employer_version"
    description: |
      A trust decision pins the employer's trust posture as last observed by the
      career center. If Employer.version has advanced since (e.g. a re-screen
      recomputed fraud_risk_score), the deciding view is stale and the decision
      is rejected. Stated in OCC terms: expected_employer_version must equal the
      current Employer.version at decide time.
    error_id: ERR_STALE_EMPLOYER_VERSION
    http_status: 412
  - rule_id: event-session-create-stale-version
    parent_entity: CareerEvent
    write_endpoint: "POST /career-events/{id}/sessions"
    occ_field: "expected_career_event_version"
    description: |
      A session is validated against the event window and room plan as last
      observed by the career center. If CareerEvent.version has advanced since
      (e.g. another session was just added, mutating the room-occupancy plan),
      the client's view is stale and the create is rejected. Stated in OCC
      terms: expected_career_event_version must equal the current
      CareerEvent.version at create time.
    error_id: ERR_STALE_CAREER_EVENT_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: fraud_risk_score
    trigger: "auto variant: POST /employers/{id}/verify-domain on success. analyst variant: every POST /employers/{id}/screen call (before applying the decision's state change)."
    algorithm: weighted_scoring
    formula: |
      auto variant (verify-domain):
        score = BASE_SCORE
        if contact_email ends with ("@" + website_domain):  score -= EMAIL_DOMAIN_MATCH_POINTS
        if website_domain ends with ".edu" or ".gov":       score -= ESTABLISHED_TLD_POINTS
        if website_domain contains "-":                     score += HYPHEN_POINTS
        if length(company_name) < 4:                        score += SHORT_NAME_POINTS
        score = clamp(score, 0, 100)
      analyst variant (screen):
        score = current fraud_risk_score + analyst_signal_adjustment   # input, integer, default 0, |adjustment| <= ADJUSTMENT_MAX_ABS
        if decision == "FLAG": score += FLAG_PENALTY
        score = clamp(score, 0, 100)
      trust_tier (re-derived after every score change):
        score <= TIER_LOW_RISK_MAX      -> LOW_RISK
        score <= TIER_STANDARD_MAX      -> STANDARD
        score <= TIER_ELEVATED_MAX      -> ELEVATED
        else                            -> HIGH_RISK
    input_set: "The single Employer being verified/screened; no other entities."
    constants:
      BASE_SCORE: 50
      EMAIL_DOMAIN_MATCH_POINTS: 25
      ESTABLISHED_TLD_POINTS: 15
      HYPHEN_POINTS: 10
      SHORT_NAME_POINTS: 10
      FLAG_PENALTY: 10
      ADJUSTMENT_MAX_ABS: 40
      TIER_LOW_RISK_MAX: 20
      TIER_STANDARD_MAX: 50
      TIER_ELEVATED_MAX: 79
    precision: "integer arithmetic; no rounding"
    variants:
      - name: auto_screen
        when: "domain verification"
        difference: "Computed purely from registration fields; no analyst input; no FLAG_PENALTY."
      - name: analyst_screen
        when: "fraud screening decision"
        difference: "Starts from the stored score and adds analyst_signal_adjustment and (for FLAG) FLAG_PENALTY — identical employer data yields a different score than auto_screen."

  - name: messaging_allowance
    trigger: "POST /outreach-messages, after safety checks pass, before insert"
    algorithm: tiered_pricing
    formula: |
      tier_cap       = floor(BASE_DAILY_CAP * TIER_MULTIPLIER_PERCENT[employer.trust_tier] / 100)   # pure integer arithmetic
      effective_cap  = min(university.employer_daily_message_cap, tier_cap)
      # university is the recipient student's university (OutreachMessage.university_id denormalization)
      sent_today     = count(OutreachMessage m where m.employer_id == employer.id
                             and m.university_id == university.id
                             and m.sent_day == current logical day (YYYY-MM-DD of current_utc))
      send allowed iff sent_today < effective_cap          # strict <: at sent_today == effective_cap the send is rejected
    input_set: "All OutreachMessages of (employer, student's university) whose sent_day equals the current logical day."
    constants:
      BASE_DAILY_CAP: 5
      TIER_MULTIPLIER_PERCENT:
        LOW_RISK: 200
        STANDARD: 100
        ELEVATED: 40
        HIGH_RISK: 0
    precision: "integer floor division on (BASE_DAILY_CAP * percent) before min()"

  - name: outcome_report_rates
    trigger: "GET /universities/{id}/outcome-report"
    algorithm: aggregation
    formula: |
      alumni      = Students of university with status == ALUMNUS
      respondents = alumni with outcome_status != UNREPORTED
      placed      = respondents with outcome_status in {EMPLOYED, GRAD_SCHOOL}
      per_major (one entry per distinct major among respondents, sorted by major ASC):
        rounded_rate_m = round_half_up(placed_m / respondents_m, 4)        # per-major rate rounded FIRST
      PINNED ROUNDING ORDER (mode (b) nested rounding — do NOT re-associate):
        placement_rate_respondent =
            round_half_up( sum(rounded_rate_m * respondents_m) / sum(respondents_m), 4 )
        i.e. round each per-major rate to 4 dp FIRST, then take the
        respondents-weighted mean of the ROUNDED rates, rounding the final
        result half-up to 4 dp. Computing from raw totals then rounding once
        is the rejected alternative order and yields a different 4th decimal.
      placement_rate_cohort = round_half_up(placed_total / alumni_total, 4)
      Empty alumni: alumni_count 0, both rates null, per_major [].
      A major with respondents_m == 0 contributes no per_major entry.
    input_set: "Students of the university with status == ALUMNUS only; ENROLLED and WITHDRAWN students are excluded."
    constants:
      RATE_DECIMAL_PLACES: 4
    precision: "4 decimal places, round_half_up at exactly two pinned points (per-major, then final)"
    variants:
      - name: respondent_denominator
        when: "placement_rate_respondent field"
        difference: "Denominator is respondents (alumni with a reported outcome); per-major rounding order pinned above."
      - name: cohort_denominator
        when: "placement_rate_cohort field"
        difference: "Denominator is ALL alumni including UNREPORTED; same numerator; identical data yields a different (lower-or-equal) rate."

  - name: waitlist_promotion_order
    trigger: "An EventSignup of a session leaves REGISTERED for CANCELLED (student cancel or student-withdrawal cascade) and the session is still SCHEDULED"
    algorithm: chronological
    formula: |
      candidate set = EventSignups of the session with status == WAITLISTED
      if empty: no-op (occupied_seats simply decrements)
      else promote exactly one:
        sort key 1: created_at ASC (earliest waitlisted first)
        sort key 2 (tie-break): student.email ASC      # never id
      promoted signup -> REGISTERED, registered_at = current_utc, promoted_from_waitlist = true
    input_set: "WAITLISTED signups of the freed session only."
    precision: "n/a (selection)"

  - name: room_conflict_detection
    trigger: "POST /career-events/{id}/sessions (after window/OCC checks)"
    algorithm: interval_merge
    formula: |
      HALF-OPEN semantics on [starts_at, ends_at):
      a new IN_PERSON session conflicts iff there exists another session s with
        s.career_event_id == event.id AND s.status != CANCELLED
        AND s.mode == IN_PERSON AND s.room_id == new.room_id
        AND new.starts_at < s.ends_at AND s.starts_at < new.ends_at
      Back-to-back adjacency (new.starts_at == s.ends_at or s.ends_at == new.starts_at)
      is NOT a conflict. VIRTUAL sessions never conflict (room_id is null).
    input_set: "Non-CANCELLED IN_PERSON sessions of the same event with equal room_id."
    precision: "instant comparison, no rounding"

  - name: interview_buffer_conflict
    trigger: "POST /applications/{id}/interviews"
    algorithm: interval_merge
    formula: |
      BUFFERED semantics with BUFFER_MINUTES on (starts_at, ends_at):
      a new interview conflicts iff there exists an interview i with
        i.interviewer_email == new.interviewer_email AND i.status == SCHEDULED
        AND new.starts_at < i.ends_at + BUFFER_MINUTES minutes
        AND i.starts_at < new.ends_at + BUFFER_MINUTES minutes
      Unlike room_conflict_detection, exact adjacency IS a conflict: a gap of
      strictly less than 15 minutes is required to fail; a gap of exactly
      15 minutes passes (new.starts_at == i.ends_at + 15min -> no conflict).
    input_set: "SCHEDULED interviews with the same interviewer_email across ALL applications and employers."
    constants:
      BUFFER_MINUTES: 15
    precision: "instant comparison, no rounding"

  - name: posting_expiry_projection
    trigger: "every read of a JobPosting (GET single/list) and every application attempt"
    algorithm: threshold
    formula: |
      if stored status == PUBLISHED and current_utc > application_deadline:
          reported status = EXPIRED
      else: reported status = stored status
      Deadline is INCLUSIVE: at current_utc == application_deadline the posting
      is still PUBLISHED and applications are still accepted.
      The stored status is never rewritten by this projection.
    input_set: "The single posting being read / applied to."
    precision: "second-precision ISO8601 comparison, strict >"

  - name: eligibility_evaluation
    trigger: "POST /applications (business_constraint stage)"
    algorithm: constraint_propagation
    formula: |
      Evaluated IN THIS ORDER; first failure wins:
      1. majors:  posting.required_majors empty OR student.major in posting.required_majors
                  else ERR_MAJOR_NOT_ELIGIBLE
      2. years:   posting.min_graduation_year <= student.graduation_year <= posting.max_graduation_year
                  (BOTH bounds INCLUSIVE) else ERR_GRAD_YEAR_NOT_ELIGIBLE
      3. workauth: posting.accepted_work_authorizations empty
                  OR student.work_authorization in posting.accepted_work_authorizations
                  else ERR_WORK_AUTHORIZATION_NOT_ELIGIBLE
      4. documents: every doc_type in posting.required_documents appears in
                  submitted_documents else ERR_DOCUMENT_REQUIREMENTS_NOT_MET
      5. duplicate: no existing Application with same (student_id, job_posting_id)
                  and status in {SUBMITTED, UNDER_REVIEW, INTERVIEWING, OFFER_EXTENDED}
                  else ERR_DUPLICATE_APPLICATION
    input_set: "The applicant student and target posting."
    precision: "exact membership / inclusive integer bounds"

  - name: active_application_count
    trigger: "recomputed on every Application create and on every Application terminal transition (REJECTED, WITHDRAWN, AUTO_WITHDRAWN, ACCEPTED, DECLINED)"
    algorithm: aggregation
    formula: |
      JobPosting.active_application_count ==
          count(Application a where a.job_posting_id == posting.id
                and a.status in {SUBMITTED, UNDER_REVIEW, INTERVIEWING, OFFER_EXTENDED})
      CONSERVED QUANTITY (compensating invariant): a create followed by the same
      application's WITHDRAWN transition returns the count to its prior value.
    input_set: "Applications of the posting in the four active statuses; terminal statuses excluded."
    precision: "integer count"

  - name: occupied_seats
    trigger: "recomputed on every EventSignup create, cancel, and promotion"
    algorithm: aggregation
    formula: |
      EventSession.occupied_seats ==
          count(EventSignup s where s.event_session_id == session.id and s.status == REGISTERED)
      CONSERVED QUANTITY (compensating invariant): a REGISTERED cancellation
      paired with the waitlist promotion it fires leaves occupied_seats
      unchanged (cancel -1, promote +1).
    input_set: "Signups of the session with status == REGISTERED only."
    precision: "integer count"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority; first failure wins)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present; role is a declared role"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Role is permitted for this endpoint and for this operation target (e.g. Student sending to=PUBLISHED)"
    error_id: ERR_UNAUTHORIZED_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: auth
    check: "Entity-backed ownership: CareerCenterAdmin's X-User-ID equals the target resource's university_id; EmployerRecruiter's equals employer_id (or the posting's/application's owning employer); Student's equals student_id"
    error_id: ERR_FORBIDDEN_OWNERSHIP
    http_status: 403
    applies_to: "all non-Anonymous write/read endpoints scoped to a university, employer, or student"
  - priority: 4
    category: existence
    check: "Path ids exist, validated left-to-right; then body foreign keys in the endpoint's declared input order"
    error_id: "ERR_UNIVERSITY_NOT_FOUND | ERR_STUDENT_NOT_FOUND | ERR_EMPLOYER_NOT_FOUND | ERR_EMPLOYER_APPROVAL_NOT_FOUND | ERR_JOB_POSTING_NOT_FOUND | ERR_CAREER_EVENT_NOT_FOUND | ERR_EVENT_SESSION_NOT_FOUND | ERR_EVENT_SIGNUP_NOT_FOUND | ERR_APPLICATION_NOT_FOUND | ERR_OUTREACH_MESSAGE_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path/body resource references"
  - priority: 5
    category: state
    check: "Target entity is in a legal state for this operation (per §1.2 preconditions; includes related-entity state gates such as university.status == ACTIVE and student.status == ENROLLED)"
    error_id: "ERR_INVALID_UNIVERSITY_TRANSITION | ERR_UNIVERSITY_NOT_ACTIVE | ERR_UNIVERSITY_NOT_PROVISIONABLE | ERR_INVALID_STUDENT_TRANSITION | ERR_STUDENT_NOT_ENROLLED | ERR_OUTCOME_NOT_RECORDABLE | ERR_INVALID_EMPLOYER_TRANSITION | ERR_EMPLOYER_NOT_DOMAIN_VERIFIED | ERR_EMPLOYER_NOT_APPROVED | ERR_INVALID_APPROVAL_TRANSITION | ERR_INVALID_POSTING_TRANSITION | ERR_POSTING_TERMINAL | ERR_POSTING_NOT_PUBLISHED | ERR_INVALID_EVENT_TRANSITION | ERR_EVENT_NOT_OPEN | ERR_EVENT_NOT_SIGNABLE | ERR_INVALID_SIGNUP_TRANSITION | ERR_INVALID_APPLICATION_TRANSITION | ERR_APPLICATION_TERMINAL | ERR_APPLICATION_NOT_INTERVIEWING"
    http_status: 409
    applies_to: "state-dependent operations"
  - priority: 6
    category: state
    check: "OCC: expected_<parent>_version equals the parent's current version"
    error_id: "ERR_STALE_EMPLOYER_VERSION | ERR_STALE_CAREER_EVENT_VERSION"
    http_status: 412
    applies_to: "POST /employer-approvals/{id}/decide, POST /career-events/{id}/sessions"
  - priority: 7
    category: business_safety
    check: "Trust/privacy gates: domain-verification token must match; screen CLEAR requires trust_tier != HIGH_RISK; application/outreach require an APPROVED EmployerApproval for (employer, student's university); posting not blocked at that university; outreach requires student.profile_visibility == PUBLIC_TO_APPROVED_EMPLOYERS; cross-university event signup forbidden"
    error_id: "ERR_DOMAIN_VERIFICATION_FAILED | ERR_FRAUD_RISK_TOO_HIGH | ERR_EMPLOYER_NOT_APPROVED_FOR_UNIVERSITY | ERR_POSTING_BLOCKED_FOR_UNIVERSITY | ERR_PROFILE_NOT_VISIBLE | ERR_CROSS_UNIVERSITY_ACCESS"
    http_status: "409 for ERR_FRAUD_RISK_TOO_HIGH; 403 for the rest"
    applies_to: "screen, applications, outreach, signups"
  - priority: 8
    category: business_temporal
    check: "Time-window rules under the logical clock: application deadline (inclusive), signup window (now < signup_deadline), session inside event window, starts_at < ends_at, signup_deadline <= starts_at"
    error_id: "ERR_APPLICATION_DEADLINE_PASSED | ERR_SIGNUP_WINDOW_CLOSED | ERR_SESSION_OUTSIDE_EVENT_WINDOW | ERR_TIME_RANGE_INVALID"
    http_status: "409 | 409 | 422 | 400"
    applies_to: "applications, signups, session/interview/event creation"
  - priority: 9
    category: business_constraint
    check: "Eligibility (majors -> grad-year -> work-auth -> documents, per calculations.eligibility_evaluation), duplicates, room/interviewer overlap"
    error_id: "ERR_MAJOR_NOT_ELIGIBLE | ERR_GRAD_YEAR_NOT_ELIGIBLE | ERR_WORK_AUTHORIZATION_NOT_ELIGIBLE | ERR_DOCUMENT_REQUIREMENTS_NOT_MET | ERR_DUPLICATE_APPLICATION | ERR_DUPLICATE_APPROVAL_REQUEST | ERR_DUPLICATE_SIGNUP | ERR_SESSION_ROOM_CONFLICT | ERR_INTERVIEW_SCHEDULE_CONFLICT"
    http_status: "422 for the four eligibility errors; 409 for the rest"
    applies_to: "applications, employer-approvals, signups, sessions, interviews"
  - priority: 10
    category: business_fiscal
    check: "Capacity/quota: messaging allowance (calculations.messaging_allowance)"
    error_id: ERR_MESSAGE_LIMIT_REACHED
    http_status: 429
    applies_to: "POST /outreach-messages"
  - priority: 11
    category: existence
    check: "Malformed body: missing required field, wrong type, out-of-enum member, min > max graduation years, capacity < 1, ends_at <= starts_at shape errors not covered by priority 8 semantics"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"
    note: "Schema/shape validation is listed last here because every domain rule above pins its own dedicated error; ERR_INVALID_REQUEST is the residual bucket for undeclared-shape failures."

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.5 API Endpoint Table (40 endpoints)
# Logical clock: the server's startup default is 2026-09-01T00:00:00Z; before
# any POST /_clock/set_current_utc call the logical clock reads exactly that
# instant and MUST NOT fall back to wall-clock time.
# =============================================================================
endpoints:
  # --- Logical clock (test-driving) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Startup default is 2026-09-01T00:00:00Z (an unset clock never falls back to wall-clock). Side-effect-free aside from the clock: posting expiry is a read-time projection, not a sweep."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["logical clock now reads to_iso8601"]

  # --- Universities ---
  - method: POST
    path: "/universities"
    description: "Onboard a university partnership; lands in ONBOARDING"
    roles: [PlatformAdmin]
    code: 201
    input: [name, primary_domain, "employer_daily_message_cap?"]
    output: University
    side_effects: ["status=ONBOARDING", "employer_daily_message_cap defaults to 10"]

  - method: POST
    path: "/universities/{id}/transition"
    description: "University lifecycle: to=ACTIVE (from ONBOARDING or SUSPENDED) | SUSPENDED (from ACTIVE) | OFFBOARDED (from ACTIVE|SUSPENDED)"
    roles: [PlatformAdmin]
    code: 200
    input: [to]
    output: University
    side_effects: ["status change per state_machines.University", "increments University.version by 1"]

  # --- Students (roster provisioning + profile/outcome admin) ---
  - method: POST
    path: "/students"
    description: "Provision a roster student; caller university must own university_id; university must be ONBOARDING or ACTIVE"
    roles: [CareerCenterAdmin]
    code: 201
    input: [university_id, email, full_name, major, graduation_year, work_authorization, "profile_visibility?"]
    output: Student
    side_effects: ["status=ENROLLED", "outcome_status=UNREPORTED", "increments University.enrolled_student_count by 1"]

  - method: GET
    path: "/students"
    description: "List students. CareerCenterAdmin is auto-scoped to own university. EmployerRecruiter sees only students with profile_visibility == PUBLIC_TO_APPROVED_EMPLOYERS whose university holds an APPROVED EmployerApproval for the caller employer."
    roles: [CareerCenterAdmin, EmployerRecruiter, PlatformAdmin]
    code: 200
    input: ["university_id?", "major?", "graduation_year?", "status?", "visible_for_employer_id?", "limit?", "offset?"]
    output: "Student[]"
    side_effects: []

  - method: GET
    path: "/students/{id}"
    description: "Read one student. EmployerRecruiter may read only visibility-eligible students (else ERR_PROFILE_NOT_VISIBLE)."
    roles: [CareerCenterAdmin, Student, EmployerRecruiter, PlatformAdmin]
    code: 200
    input: []
    output: Student
    side_effects: []

  - method: PATCH
    path: "/students/{id}"
    description: "Student self: profile_visibility only. CareerCenterAdmin (owning university): status transitions (ENROLLED->ALUMNUS|WITHDRAWN) and, while ALUMNUS, outcome_status/outcome_employer_name (first-destination data collection). A Student sending status/outcome fields gets ERR_UNAUTHORIZED_ROLE."
    roles: [Student, CareerCenterAdmin]
    code: 200
    input: ["profile_visibility?", "status?", "outcome_status?", "outcome_employer_name?"]
    output: Student
    side_effects: ["status transitions + withdrawal cascade per state_machines.Student", "outcome_recorded_at stamped on first non-UNREPORTED outcome write", "increments Student.version by 1"]

  # --- Employers (registration, domain verification, fraud screening) ---
  - method: POST
    path: "/employers"
    description: "Employer self-registration; lands in PENDING with a minted domain_verification_token"
    roles: [Anonymous]
    code: 201
    input: [company_name, website_domain, contact_email]
    output: Employer
    side_effects: ["status=PENDING", "domain_verification_token minted and returned"]

  - method: GET
    path: "/employers/{id}"
    description: "Read one employer (includes fraud_risk_score, trust_tier, screen_count)"
    roles: [PlatformAdmin, EmployerRecruiter, CareerCenterAdmin]
    code: 200
    input: []
    output: Employer
    side_effects: []

  - method: POST
    path: "/employers/{id}/verify-domain"
    description: "Recruiter submits the domain verification token; on match PENDING -> DOMAIN_VERIFIED"
    roles: [EmployerRecruiter]
    code: 200
    input: [verification_token]
    output: Employer
    side_effects: ["PENDING -> DOMAIN_VERIFIED", "fraud_risk_score computed (auto_screen variant), trust_tier derived", "increments Employer.version by 1"]

  - method: POST
    path: "/employers/{id}/screen"
    description: "Platform fraud screening: decision=CLEAR (DOMAIN_VERIFIED|UNDER_REVIEW -> APPROVED) | FLAG (DOMAIN_VERIFIED|APPROVED -> UNDER_REVIEW) | REJECT (PENDING|DOMAIN_VERIFIED|UNDER_REVIEW -> REJECTED). CLEAR with resulting trust_tier == HIGH_RISK fails ERR_FRAUD_RISK_TOO_HIGH."
    roles: [PlatformAdmin]
    code: 200
    input: [decision, "analyst_signal_adjustment?"]
    output: Employer
    side_effects: ["analyst_screen variant recomputes fraud_risk_score + trust_tier", "screen_count += 1", "increments Employer.version by 1"]

  # --- Employer approvals (university-level trust decisions) ---
  - method: POST
    path: "/employer-approvals"
    description: "Recruiter requests approval at a university. If a BLOCKED/REVOKED row exists for (employer_id, university_id) it becomes SUPERSEDED and the new row carries supersedes_approval_id."
    roles: [EmployerRecruiter]
    code: 201
    input: [employer_id, university_id]
    output: EmployerApproval
    side_effects: ["status=PENDING", "supersede prior terminal BLOCKED/REVOKED row if any", "ERR_DUPLICATE_APPROVAL_REQUEST when a PENDING or APPROVED row exists"]

  - method: GET
    path: "/employer-approvals"
    description: "List approvals; CareerCenterAdmin auto-scoped to own university, EmployerRecruiter to own employer"
    roles: [CareerCenterAdmin, EmployerRecruiter, PlatformAdmin]
    code: 200
    input: ["employer_id?", "university_id?", "status?", "supersedes_approval_id?", "limit?", "offset?"]
    output: "EmployerApproval[]"
    side_effects: []

  - method: GET
    path: "/employer-approvals/{id}"
    description: "Read one approval"
    roles: [CareerCenterAdmin, EmployerRecruiter, PlatformAdmin]
    code: 200
    input: []
    output: EmployerApproval
    side_effects: []

  - method: POST
    path: "/employer-approvals/{id}/decide"
    description: "Career center trust decision: APPROVE|BLOCK from PENDING; REVOKE from APPROVED. OCC on Employer.version. BLOCK/REVOKE fire the posting->application->interview cascade (state_machines.EmployerApproval)."
    roles: [CareerCenterAdmin]
    code: 200
    input: [decision, "decision_reason?", expected_employer_version]
    output: EmployerApproval
    side_effects: ["status change + decided_at + trust_tier_at_decision pinned", "stamps Employer.last_trust_decision_at and increments Employer.version by 1", "BLOCK/REVOKE cascade per §1.2 (postings blocked, applications AUTO_WITHDRAWN, interviews CANCELLED)"]

  # --- Job postings ---
  - method: POST
    path: "/job-postings"
    description: "Create a posting (DRAFT). Employer must be APPROVED and caller must own employer_id."
    roles: [EmployerRecruiter]
    code: 201
    input: [employer_id, title, position_type, "required_majors?", min_graduation_year, max_graduation_year, "accepted_work_authorizations?", "required_documents?", application_deadline]
    output: JobPosting
    side_effects: ["status=DRAFT", "active_application_count=0", "blocked_university_ids=[]"]

  - method: GET
    path: "/job-postings"
    description: "List postings with read-time EXPIRED projection. Student is restricted to postings visible to their university (status PUBLISHED, not blocked, employer APPROVED + APPROVED approval, university ACTIVE)."
    roles: [Student, EmployerRecruiter, CareerCenterAdmin, PlatformAdmin]
    code: 200
    input: ["employer_id?", "status?", "university_id?", "limit?", "offset?"]
    output: "JobPosting[]"
    side_effects: []

  - method: GET
    path: "/job-postings/{id}"
    description: "Read one posting (read-time EXPIRED projection applies)"
    roles: [Student, EmployerRecruiter, CareerCenterAdmin, PlatformAdmin]
    code: 200
    input: []
    output: JobPosting
    side_effects: []

  - method: POST
    path: "/job-postings/{id}/transition"
    description: "Posting lifecycle: to=SUBMITTED (DRAFT, recruiter) | PUBLISHED (from SUBMITTED by PlatformAdmin, or from PAUSED by owning recruiter) | PAUSED (from PUBLISHED, recruiter) | CLOSED (from any non-terminal, recruiter)"
    roles: [EmployerRecruiter, PlatformAdmin]
    code: 200
    input: [to]
    output: JobPosting
    side_effects: ["status change per state_machines.JobPosting", "increments JobPosting.version by 1"]

  - method: POST
    path: "/job-postings/{id}/clearance"
    description: "Career center blocks/unblocks this posting at its own university. BLOCK appends university_id to blocked_university_ids and cascades (applications from that university AUTO_WITHDRAWN, interviews CANCELLED); CLEAR removes it. Posting must be PUBLISHED or PAUSED."
    roles: [CareerCenterAdmin]
    code: 200
    input: [university_id, decision]
    output: JobPosting
    side_effects: ["blocked_university_ids updated", "BLOCK cascade per state_machines.Application (AUTO_WITHDRAWN subset)", "increments JobPosting.version by 1"]

  # --- Career events & sessions ---
  - method: POST
    path: "/career-events"
    description: "Create a career fair / event (DRAFT). University must be ACTIVE and caller-owned."
    roles: [CareerCenterAdmin]
    code: 201
    input: [university_id, title, starts_at, ends_at]
    output: CareerEvent
    side_effects: ["status=DRAFT"]

  - method: GET
    path: "/career-events"
    description: "List events"
    roles: [CareerCenterAdmin, Student, EmployerRecruiter, PlatformAdmin]
    code: 200
    input: ["university_id?", "status?", "limit?", "offset?"]
    output: "CareerEvent[]"
    side_effects: []

  - method: GET
    path: "/career-events/{id}"
    description: "Read one event"
    roles: [CareerCenterAdmin, Student, EmployerRecruiter, PlatformAdmin]
    code: 200
    input: []
    output: CareerEvent
    side_effects: []

  - method: POST
    path: "/career-events/{id}/transition"
    description: "Event lifecycle: to=OPEN (DRAFT) | LOCKED (OPEN) | COMPLETED (LOCKED) | CANCELLED (DRAFT|OPEN; cascades sessions+signups to CANCELLED)"
    roles: [CareerCenterAdmin]
    code: 200
    input: [to]
    output: CareerEvent
    side_effects: ["status change per state_machines.CareerEvent", "CANCELLED cascades sessions -> CANCELLED then signups -> CANCELLED", "increments CareerEvent.version by 1"]

  - method: POST
    path: "/career-events/{id}/sessions"
    description: "Add a session to a DRAFT or OPEN event. OCC on CareerEvent.version. IN_PERSON requires room_id; half-open room-overlap check; session must lie inside the event window."
    roles: [CareerCenterAdmin]
    code: 201
    input: [title, mode, "room_id?", starts_at, ends_at, signup_deadline, capacity, expected_career_event_version]
    output: EventSession
    side_effects: ["status=SCHEDULED", "occupied_seats=0", "stamps CareerEvent.last_session_added_at and increments CareerEvent.version by 1"]

  - method: GET
    path: "/career-events/{id}/sessions"
    description: "List sessions of an event (includes computed occupied_seats)"
    roles: [CareerCenterAdmin, Student, EmployerRecruiter, PlatformAdmin]
    code: 200
    input: []
    output: "EventSession[]"
    side_effects: []

  # --- Event signups ---
  - method: POST
    path: "/event-signups"
    description: "Student signs up for a session of their own university's event. REGISTERED when occupied_seats < capacity, else WAITLISTED. Signups close at signup_deadline (exclusive)."
    roles: [Student]
    code: 201
    input: [event_session_id, student_id]
    output: EventSignup
    side_effects: ["status=REGISTERED or WAITLISTED", "registered_at stamped iff REGISTERED", "EventSession.occupied_seats recomputed"]

  - method: GET
    path: "/event-signups"
    description: "List signups; Student auto-scoped to own signups"
    roles: [Student, CareerCenterAdmin, PlatformAdmin]
    code: 200
    input: ["event_session_id?", "student_id?", "status?", "limit?", "offset?"]
    output: "EventSignup[]"
    side_effects: []

  - method: GET
    path: "/event-signups/{id}"
    description: "Read one signup"
    roles: [Student, CareerCenterAdmin, PlatformAdmin]
    code: 200
    input: []
    output: EventSignup
    side_effects: []

  - method: POST
    path: "/event-signups/{id}/transition"
    description: "Student: to=CANCELLED (from REGISTERED|WAITLISTED; frees a seat -> waitlist promotion). CareerCenterAdmin: to=ATTENDED|NO_SHOW (from REGISTERED, event must be COMPLETED)."
    roles: [Student, CareerCenterAdmin]
    code: 200
    input: [to]
    output: EventSignup
    side_effects: ["status change per state_machines.EventSignup", "REGISTERED->CANCELLED fires waitlist promotion", "EventSession.occupied_seats recomputed"]

  # --- Applications ---
  - method: POST
    path: "/applications"
    description: "Student applies to a posting with documents. Full gate chain: state -> safety (university approval, block lists) -> temporal (inclusive deadline) -> eligibility (majors, grad year, work auth, documents, duplicate)."
    roles: [Student]
    code: 201
    input: [student_id, job_posting_id, submitted_documents]
    output: Application
    side_effects: ["status=SUBMITTED", "submitted_at stamped", "documents_status computed", "JobPosting.active_application_count += 1"]

  - method: GET
    path: "/applications"
    description: "List applications; Student auto-scoped to own, EmployerRecruiter to own employer's postings, CareerCenterAdmin to own university's students"
    roles: [Student, EmployerRecruiter, CareerCenterAdmin, PlatformAdmin]
    code: 200
    input: ["student_id?", "job_posting_id?", "status?", "limit?", "offset?"]
    output: "Application[]"
    side_effects: []

  - method: GET
    path: "/applications/{id}"
    description: "Read one application"
    roles: [Student, EmployerRecruiter, CareerCenterAdmin, PlatformAdmin]
    code: 200
    input: []
    output: Application
    side_effects: []

  - method: POST
    path: "/applications/{id}/transition"
    description: "EmployerRecruiter (owning posting's employer): to=UNDER_REVIEW|INTERVIEWING|OFFER_EXTENDED|REJECTED. Student (owner): to=WITHDRAWN|ACCEPTED|DECLINED (ACCEPTED/DECLINED only from OFFER_EXTENDED). Terminal transitions cancel SCHEDULED interviews and decrement active_application_count."
    roles: [EmployerRecruiter, Student]
    code: 200
    input: [to]
    output: Application
    side_effects: ["status change per state_machines.Application", "terminal: interviews -> CANCELLED, active_application_count -= 1, decided_at stamped"]

  # --- Interviews ---
  - method: POST
    path: "/applications/{id}/interviews"
    description: "Schedule an interview; application must be INTERVIEWING; buffered overlap check per interviewer_email (calculations.interview_buffer_conflict)"
    roles: [EmployerRecruiter]
    code: 201
    input: [interviewer_email, mode, starts_at, ends_at]
    output: Interview
    side_effects: ["status=SCHEDULED"]

  - method: GET
    path: "/applications/{id}/interviews"
    description: "List interviews of an application"
    roles: [EmployerRecruiter, Student, CareerCenterAdmin, PlatformAdmin]
    code: 200
    input: []
    output: "Interview[]"
    side_effects: []

  # --- Outreach (proactive employer messaging with limits) ---
  - method: POST
    path: "/outreach-messages"
    description: "Employer messages a student. Gates: employer APPROVED, approval APPROVED at student's university, student ENROLLED, profile_visibility == PUBLIC_TO_APPROVED_EMPLOYERS, then daily messaging allowance (calculations.messaging_allowance)."
    roles: [EmployerRecruiter]
    code: 201
    input: [employer_id, student_id, body]
    output: OutreachMessage
    side_effects: ["university_id denormalized from student", "sent_day = current logical day"]

  - method: GET
    path: "/outreach-messages"
    description: "List outreach messages; EmployerRecruiter auto-scoped to own employer, Student to own, CareerCenterAdmin to own university"
    roles: [EmployerRecruiter, Student, CareerCenterAdmin, PlatformAdmin]
    code: 200
    input: ["employer_id?", "student_id?", "university_id?", "limit?", "offset?"]
    output: "OutreachMessage[]"
    side_effects: []

  - method: GET
    path: "/outreach-messages/{id}"
    description: "Read one message"
    roles: [EmployerRecruiter, Student, CareerCenterAdmin, PlatformAdmin]
    code: 200
    input: []
    output: OutreachMessage
    side_effects: []

  # --- Outcome reporting (first destination after graduation) ---
  - method: GET
    path: "/universities/{id}/outcome-report"
    description: "Computed first-destination report over ALUMNUS students of the university (calculations.outcome_report_rates); CareerCenterAdmin must own the university"
    roles: [CareerCenterAdmin, PlatformAdmin]
    code: 200
    input: []
    output: "{ alumni_count: integer, respondents_count: integer, placed_count: integer, placement_rate_cohort: number, placement_rate_respondent: number, per_major: array }"
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- auth ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing, or role not declared" }
  - { id: ERR_UNAUTHORIZED_ROLE, http: 403, condition: "Role not permitted for this endpoint, or for this transition target (e.g. Student sending to=PUBLISHED, Student writing status/outcome fields)" }
  - { id: ERR_FORBIDDEN_OWNERSHIP, http: 403, condition: "Entity-backed caller does not own the target scope (wrong university / employer / student)" }
  # --- existence ---
  - { id: ERR_UNIVERSITY_NOT_FOUND, http: 404, condition: "University id does not exist" }
  - { id: ERR_STUDENT_NOT_FOUND, http: 404, condition: "Student id does not exist" }
  - { id: ERR_EMPLOYER_NOT_FOUND, http: 404, condition: "Employer id does not exist" }
  - { id: ERR_EMPLOYER_APPROVAL_NOT_FOUND, http: 404, condition: "EmployerApproval id does not exist" }
  - { id: ERR_JOB_POSTING_NOT_FOUND, http: 404, condition: "JobPosting id does not exist" }
  - { id: ERR_CAREER_EVENT_NOT_FOUND, http: 404, condition: "CareerEvent id does not exist" }
  - { id: ERR_EVENT_SESSION_NOT_FOUND, http: 404, condition: "EventSession id does not exist" }
  - { id: ERR_EVENT_SIGNUP_NOT_FOUND, http: 404, condition: "EventSignup id does not exist" }
  - { id: ERR_APPLICATION_NOT_FOUND, http: 404, condition: "Application id does not exist" }
  - { id: ERR_OUTREACH_MESSAGE_NOT_FOUND, http: 404, condition: "OutreachMessage id does not exist" }
  # --- state ---
  - { id: ERR_INVALID_UNIVERSITY_TRANSITION, http: 409, condition: "University transition not allowed from current state (incl. terminal OFFBOARDED)" }
  - { id: ERR_UNIVERSITY_NOT_ACTIVE, http: 409, condition: "Operation requires university.status == ACTIVE (approvals decide, events, sessions, signups, applications, outreach)" }
  - { id: ERR_UNIVERSITY_NOT_PROVISIONABLE, http: 409, condition: "Student provisioning requires university.status in {ONBOARDING, ACTIVE}" }
  - { id: ERR_INVALID_STUDENT_TRANSITION, http: 409, condition: "Student status change not allowed (only ENROLLED->ALUMNUS, ENROLLED->WITHDRAWN)" }
  - { id: ERR_STUDENT_NOT_ENROLLED, http: 409, condition: "Operation requires student.status == ENROLLED (applications, signups, outreach)" }
  - { id: ERR_OUTCOME_NOT_RECORDABLE, http: 409, condition: "Outcome fields writable only while student.status == ALUMNUS" }
  - { id: ERR_INVALID_EMPLOYER_TRANSITION, http: 409, condition: "Screen decision not allowed from current employer status (incl. terminal REJECTED)" }
  - { id: ERR_EMPLOYER_NOT_DOMAIN_VERIFIED, http: 409, condition: "Screen CLEAR/FLAG requires DOMAIN_VERIFIED or later; employer still PENDING" }
  - { id: ERR_EMPLOYER_NOT_APPROVED, http: 409, condition: "Operation requires employer.status == APPROVED (posting create/publish, approval request, outreach)" }
  - { id: ERR_INVALID_APPROVAL_TRANSITION, http: 409, condition: "decide target not legal: APPROVE|BLOCK require PENDING; REVOKE requires APPROVED" }
  - { id: ERR_INVALID_POSTING_TRANSITION, http: 409, condition: "Posting transition not allowed from current stored status" }
  - { id: ERR_POSTING_TERMINAL, http: 409, condition: "Posting is CLOSED; no further transitions" }
  - { id: ERR_POSTING_NOT_PUBLISHED, http: 409, condition: "Application requires stored posting status == PUBLISHED (PAUSED/DRAFT/SUBMITTED fail here)" }
  - { id: ERR_INVALID_EVENT_TRANSITION, http: 409, condition: "Event transition not allowed from current status" }
  - { id: ERR_EVENT_NOT_OPEN, http: 409, condition: "Session creation requires event.status in {DRAFT, OPEN}" }
  - { id: ERR_EVENT_NOT_SIGNABLE, http: 409, condition: "Signup requires event.status in {OPEN, LOCKED} and session.status == SCHEDULED" }
  - { id: ERR_INVALID_SIGNUP_TRANSITION, http: 409, condition: "Signup transition not allowed (attendance requires REGISTERED + parent event COMPLETED; cancel only from REGISTERED|WAITLISTED)" }
  - { id: ERR_INVALID_APPLICATION_TRANSITION, http: 409, condition: "Application transition not allowed from current status (e.g. SUBMITTED->OFFER_EXTENDED skips stages)" }
  - { id: ERR_APPLICATION_TERMINAL, http: 409, condition: "Application already in a terminal status" }
  - { id: ERR_APPLICATION_NOT_INTERVIEWING, http: 409, condition: "Interview creation requires application.status == INTERVIEWING" }
  # --- OCC ---
  - { id: ERR_STALE_EMPLOYER_VERSION, http: 412, condition: "expected_employer_version != current Employer.version at decide" }
  - { id: ERR_STALE_CAREER_EVENT_VERSION, http: 412, condition: "expected_career_event_version != current CareerEvent.version at session create" }
  # --- business_safety ---
  - { id: ERR_FRAUD_RISK_TOO_HIGH, http: 409, condition: "Screen CLEAR would leave trust_tier == HIGH_RISK" }
  - { id: ERR_DOMAIN_VERIFICATION_FAILED, http: 403, condition: "verification_token does not match Employer.domain_verification_token" }
  - { id: ERR_EMPLOYER_NOT_APPROVED_FOR_UNIVERSITY, http: 403, condition: "No APPROVED EmployerApproval for (employer, student's university)" }
  - { id: ERR_POSTING_BLOCKED_FOR_UNIVERSITY, http: 403, condition: "Posting's blocked_university_ids contains the student's university" }
  - { id: ERR_PROFILE_NOT_VISIBLE, http: 403, condition: "Student profile_visibility != PUBLIC_TO_APPROVED_EMPLOYERS (or employer otherwise ineligible to view/contact)" }
  - { id: ERR_CROSS_UNIVERSITY_ACCESS, http: 403, condition: "Student may sign up only for sessions of own university's events" }
  # --- business_temporal ---
  - { id: ERR_APPLICATION_DEADLINE_PASSED, http: 409, condition: "current_utc > posting.application_deadline at apply time (deadline is inclusive)" }
  - { id: ERR_SIGNUP_WINDOW_CLOSED, http: 409, condition: "current_utc >= session.signup_deadline at signup time (deadline is exclusive)" }
  - { id: ERR_SESSION_OUTSIDE_EVENT_WINDOW, http: 422, condition: "Session [starts_at, ends_at] not inside event [starts_at, ends_at], or signup_deadline > starts_at" }
  - { id: ERR_TIME_RANGE_INVALID, http: 400, condition: "starts_at >= ends_at (event, session, or interview)" }
  # --- business_constraint ---
  - { id: ERR_MAJOR_NOT_ELIGIBLE, http: 422, condition: "student.major not in posting.required_majors (non-empty)" }
  - { id: ERR_GRAD_YEAR_NOT_ELIGIBLE, http: 422, condition: "student.graduation_year outside inclusive [min_graduation_year, max_graduation_year]" }
  - { id: ERR_WORK_AUTHORIZATION_NOT_ELIGIBLE, http: 422, condition: "student.work_authorization not in posting.accepted_work_authorizations (non-empty)" }
  - { id: ERR_DOCUMENT_REQUIREMENTS_NOT_MET, http: 422, condition: "submitted_documents missing a doc_type from posting.required_documents" }
  - { id: ERR_DUPLICATE_APPLICATION, http: 409, condition: "Active application (SUBMITTED|UNDER_REVIEW|INTERVIEWING|OFFER_EXTENDED) exists for (student_id, job_posting_id)" }
  - { id: ERR_DUPLICATE_APPROVAL_REQUEST, http: 409, condition: "A PENDING or APPROVED EmployerApproval exists for (employer_id, university_id)" }
  - { id: ERR_DUPLICATE_SIGNUP, http: 409, condition: "A REGISTERED or WAITLISTED signup exists for (student_id, event_session_id)" }
  - { id: ERR_SESSION_ROOM_CONFLICT, http: 409, condition: "Half-open interval overlap on room_id with a non-CANCELLED IN_PERSON session of the same event" }
  - { id: ERR_INTERVIEW_SCHEDULE_CONFLICT, http: 409, condition: "Buffered (15-minute) interval overlap on interviewer_email with a SCHEDULED interview" }
  # --- business_capacity ---
  - { id: ERR_MESSAGE_LIMIT_REACHED, http: 429, condition: "sent_today >= effective daily messaging allowance for (employer, university)" }
  # --- residual ---
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body: missing required field, wrong type, out-of-enum member, min_graduation_year > max_graduation_year, capacity < 1, IN_PERSON session without room_id, VIRTUAL session with room_id" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Anonymous
    description: "Unauthenticated caller; only employer self-registration"
    identity: "opaque"
    exclusive_operations:
      - "POST /employers — employer self-registration"
    shared_operations: []

  - name: PlatformAdmin
    description: "Marketplace platform operator; owns university onboarding/lifecycle, employer fraud screening, posting publication, and the logical clock"
    identity: "opaque"
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /universities, POST /universities/{id}/transition"
      - "POST /employers/{id}/screen"
      - "POST /job-postings/{id}/transition with to=PUBLISHED from SUBMITTED (platform publication gate)"
    shared_operations:
      - "All GET endpoints"

  - name: CareerCenterAdmin
    description: "University career center administrator; X-User-ID equals the University.id they administer"
    identity: "entity_backed:University"
    exclusive_operations:
      - "POST /students — roster provisioning for own university"
      - "PATCH /students/{id} — status transitions and outcome recording for own university's students"
      - "POST /employer-approvals/{id}/decide — trust decisions for own university"
      - "POST /job-postings/{id}/clearance — block/unblock postings at own university"
      - "POST /career-events, POST /career-events/{id}/transition, POST /career-events/{id}/sessions — event management for own university"
      - "POST /event-signups/{id}/transition with to=ATTENDED|NO_SHOW — attendance marking"
      - "GET /universities/{id}/outcome-report for own university"
    shared_operations:
      - "GET endpoints within own university scope"

  - name: EmployerRecruiter
    description: "Employer account operator; X-User-ID equals the Employer.id they operate"
    identity: "entity_backed:Employer"
    exclusive_operations:
      - "POST /employers/{id}/verify-domain for own employer"
      - "POST /employer-approvals — request university approvals for own employer"
      - "POST /job-postings, POST /job-postings/{id}/transition (except platform PUBLISHED-from-SUBMITTED) for own employer's postings"
      - "POST /applications/{id}/transition with to=UNDER_REVIEW|INTERVIEWING|OFFER_EXTENDED|REJECTED on applications to own postings"
      - "POST /applications/{id}/interviews on applications to own postings"
      - "POST /outreach-messages — proactive outreach from own employer"
    shared_operations:
      - "GET endpoints within own employer scope (students/postings lists are visibility-restricted)"

  - name: Student
    description: "Student user; X-User-ID equals the Student.id they own"
    identity: "entity_backed:Student"
    exclusive_operations:
      - "PATCH /students/{id} — own profile_visibility only"
      - "POST /applications — apply as self"
