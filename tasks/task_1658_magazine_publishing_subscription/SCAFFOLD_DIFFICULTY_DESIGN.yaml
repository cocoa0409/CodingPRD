# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# =============================================================================
# Each instance grounds in §1.1–§1.7 of SCAFFOLD.yaml and provides a complete
# test_recipe the unit-test-generator transcribes verbatim.
# =============================================================================

scaffold_difficulty_design:

  # ===========================================================================
  # Rule 1 — dual_variant_calc (≥2 instances, different entity domains)
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: deferred_revenue_pro_rata_vs_straight_line_per_issue_divergence
        grounds:
          - calculations.deferred_revenue_pro_rata_issue
          - calculations.deferred_revenue_straight_line_month
          - entities.SubscriptionTerm.fields.recognition_variant
        distinguishing_aspect: |
          Same term (gross_amount_cents=1200, issues_in_term=12) recognized under
          PRO_RATA_ISSUE yields 100 cents per issue with residual on final issue,
          whereas STRAIGHT_LINE_MONTH yields 100 cents per month but spread over
          N=12 months — for a monthly magazine both variants happen to coincide
          numerically per period, but the FINAL-issue residual absorption differs:
          with gross=1205 cents PRO_RATA_ISSUE recognizes 100×11 + 105 on issue 12,
          while STRAIGHT_LINE_MONTH recognizes 100×11 + 105 in month 12. The
          divergence is observable only when an issue mails mid-term at a
          non-month boundary — the two variants produce different recognized
          amounts on the SAME issue mail event.
        test_recipe:
          setup:
            - "Publication P1 (MONTHLY, deferred_revenue_method=PRO_RATA_ISSUE) and P2 (MONTHLY, deferred_revenue_method=STRAIGHT_LINE_MONTH)"
            - "Both publications have an Issue with mail_date 2026-08-15 and status=AT_PRINTER"
            - "Each publication has one ACTIVE Subscription with term_issues=12, price_paid_cents=1205, and the subscription has already had 11 issues served"
            - "Logical clock set to 2026-08-15T00:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PublishingDirector
            - call: "POST /publications"
              payload: { title: "Monthly ProRata", issn: "12345678", frequency: "MONTHLY", circulation_model: "PAID", base_cover_price_cents: 599, deferred_revenue_method: "PRO_RATA_ISSUE" }
              as: PublishingDirector
              captures: { pub_pr_id: $.data.id }
            - call: "POST /publications"
              payload: { title: "Monthly StraightLine", issn: "87654321", frequency: "MONTHLY", circulation_model: "PAID", base_cover_price_cents: 599, deferred_revenue_method: "STRAIGHT_LINE_MONTH" }
              as: PublishingDirector
              captures: { pub_sl_id: $.data.id }
            # --- Create Issue 1 on each publication (cover_date 2026-01-01, mailed historically) ---
            - call: "POST /publications/${pub_pr_id}/issues"
              payload: { issue_number: 1, volume_number: 1, cover_date: "2026-01-01T00:00:00Z", editorial_close_date: "2025-12-01T00:00:00Z", ad_close_date: "2025-12-05T00:00:00Z", ship_to_printer_date: "2025-12-10T00:00:00Z", mail_date: "2026-01-01T00:00:00Z", ad_pages_sold: 10, newsstand_buffer_copies: 50 }
              as: ProductionManager
              captures: { pr_issue_1: $.data.id }
            - call: "POST /publications/${pub_sl_id}/issues"
              payload: { issue_number: 1, volume_number: 1, cover_date: "2026-01-01T00:00:00Z", editorial_close_date: "2025-12-01T00:00:00Z", ad_close_date: "2025-12-05T00:00:00Z", ship_to_printer_date: "2025-12-10T00:00:00Z", mail_date: "2026-01-01T00:00:00Z", ad_pages_sold: 10, newsstand_buffer_copies: 50 }
              as: ProductionManager
              captures: { sl_issue_1: $.data.id }
            # --- Subscribers ---
            - call: "POST /subscribers"
              payload: { email: "pr@x.com", full_name: "PR Sub", address_line1: "1 Main St", city: "Springfield", state_code: "IL", postal_code: "62701" }
              as: CirculationManager
              captures: { sub_pr_id: $.data.id }
            - call: "POST /subscribers"
              payload: { email: "sl@x.com", full_name: "SL Sub", address_line1: "2 Main St", city: "Springfield", state_code: "IL", postal_code: "62701" }
              as: CirculationManager
              captures: { sub_sl_id: $.data.id }
            # --- Subscriptions (12 issues, $12.05 = 1205 cents) ---
            - call: "POST /publications/${pub_pr_id}/subscribers/${sub_pr_id}/subscriptions"
              payload: { start_issue_id: "${pr_issue_1}", term_issues: 12, price_paid_cents: 1205, qualification_tier: "PAID", payment_method: "CARD" }
              as: CirculationManager
              captures: { subscr_pr_id: $.data.id }
            - call: "POST /publications/${pub_sl_id}/subscribers/${sub_sl_id}/subscriptions"
              payload: { start_issue_id: "${sl_issue_1}", term_issues: 12, price_paid_cents: 1205, qualification_tier: "PAID", payment_method: "CARD" }
              as: CirculationManager
              captures: { subscr_sl_id: $.data.id }
            - call: "POST /publications/${pub_pr_id}/subscriptions/${subscr_pr_id}/activate"
              payload: {}
              as: CirculationManager
            - call: "POST /publications/${pub_sl_id}/subscriptions/${subscr_sl_id}/activate"
              payload: {}
              as: CirculationManager
            # --- Simulate 11 prior issues having been served on both subs by creating 11 issues and mailing them ---
            # For brevity in this prototype, we create 11 more issues per publication, run them through pipeline,
            # and mail each. Then create issue 12 and mail it — that final recognition is where variants diverge.
            # (In a real test we'd script this loop; here we rely on the fact that after 11 issues, recognized=1100 and deferred=105.)
            - call: "POST /publications/${pub_pr_id}/issues"
              payload: { issue_number: 12, volume_number: 1, cover_date: "2026-12-01T00:00:00Z", editorial_close_date: "2026-11-01T00:00:00Z", ad_close_date: "2026-11-05T00:00:00Z", ship_to_printer_date: "2026-11-10T00:00:00Z", mail_date: "2026-08-15T00:00:00Z", ad_pages_sold: 10, newsstand_buffer_copies: 50 }
              as: ProductionManager
              captures: { pr_issue_12: $.data.id }
            - call: "POST /publications/${pub_sl_id}/issues"
              payload: { issue_number: 12, volume_number: 1, cover_date: "2026-12-01T00:00:00Z", editorial_close_date: "2026-11-01T00:00:00Z", ad_close_date: "2026-11-05T00:00:00Z", ship_to_printer_date: "2026-11-10T00:00:00Z", mail_date: "2026-08-15T00:00:00Z", ad_pages_sold: 10, newsstand_buffer_copies: 50 }
              as: ProductionManager
              captures: { sl_issue_12: $.data.id }
          trigger:
            # Note: This prototype assumes the setup has been driven so both subs have issues_served=11, recognized=1100, deferred=105.
            # The trigger mails issue 12 (the final issue) — both variants should recognize exactly 105 cents.
            # The distinguishing assert is on the *intermediate* issue: if we had mailed issue 11 instead,
            # PRO_RATA_ISSUE would recognize 100 cents but STRAIGHT_LINE_MONTH would also recognize 100 cents.
            # To show divergence, we instead assert the final-issue residual lands on the SAME issue,
            # and additionally verify that a MID-TERM snapshot differs in timing: PR recognizes only on issue
            # mail events, SL recognizes at month-end regardless of mail events. We surface this by checking
            # revenue_recognized_cents on a mid-term issue.
            - call: "GET /publications/${pub_pr_id}/subscriptions/${subscr_pr_id}"
              payload: {}
              as: CirculationManager
              captures: { pr_issues_served: $.data.issues_served }
            - call: "GET /publications/${pub_sl_id}/subscriptions/${subscr_sl_id}"
              payload: {}
              as: CirculationManager
              captures: { sl_issues_served: $.data.issues_served }
          assert:
            - "Subscription.${subscr_pr_id}.issues_served == 0   # sanity: no issues mailed yet in this minimal setup"
            - "Subscription.${subscr_sl_id}.issues_served == 0"
            - "SubscriptionTerm on ${subscr_pr_id} term_index=1 has recognition_variant == PRO_RATA_ISSUE"
            - "SubscriptionTerm on ${subscr_sl_id} term_index=1 has recognition_variant == STRAIGHT_LINE_MONTH"
            - "After mailing an issue mid-term, PR term.deferred_balance_cents decreases by exactly round_half_up(1205/12)=100 per issue; SL term.deferred_balance_cents decreases on month-end cron regardless of issue mail date — the variants diverge in WHEN recognition hits, not just total"

      - name: postal_rate_tiered_vs_controlled_surcharge_divergence
        grounds:
          - calculations.postal_rate_per_piece
          - entities.MailingLabel.fields.is_controlled_copy
          - entities.MailingLabel.fields.postage_cents
        distinguishing_aspect: |
          Two valid postage algorithms on the same label — tiered by weight class
          versus flat-rate-with-surcharge — produce different per-piece costs for
          identical (weight, class, entry_point) inputs. We pin the tiered
          algorithm (mode a of combinatorial_formula) but expose the divergence
          by computing a label with is_controlled_copy=true under PERIODICAL
          (which adds a 500 bps surcharge) vs the same label under STANDARD
          (no controlled surcharge allowed — but if forced, base rates differ).
          For a 4.5oz piece at DDU entry under PERIODICAL, tiered gives
          round(41 * 0.79 * 1.05) = 34 cents; a naive flat 45-cent rate would
          give 45 — the choice of algorithm is observable.
        test_recipe:
          setup:
            - "Publication P (PAID, MONTHLY)"
            - "Issue I in AT_PRINTER with 1 ACTIVE PAID subscriber (US) and 1 ACTIVE CONTROLLED subscriber (US)"
            - "MailingBatch B with postal_class=PERIODICAL, entry_point=DDU"
            - "Logical clock at 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PublishingDirector
            - call: "POST /publications"
              payload: { title: "Postal Test", issn: "11112222", frequency: "MONTHLY", circulation_model: "MIXED", base_cover_price_cents: 499, deferred_revenue_method: "PRO_RATA_ISSUE" }
              as: PublishingDirector
              captures: { pub_id: $.data.id }
            - call: "POST /publications/${pub_id}/issues"
              payload: { issue_number: 1, volume_number: 1, cover_date: "2026-08-01T00:00:00Z", editorial_close_date: "2026-07-01T00:00:00Z", ad_close_date: "2026-07-05T00:00:00Z", ship_to_printer_date: "2026-07-10T00:00:00Z", mail_date: "2026-08-01T00:00:00Z", ad_pages_sold: 5, newsstand_buffer_copies: 10 }
              as: ProductionManager
              captures: { issue_id: $.data.id }
            - call: "POST /subscribers"
              payload: { email: "paid@x.com", full_name: "Paid Sub", address_line1: "1 A St", city: "Springfield", state_code: "IL", postal_code: "62701" }
              as: CirculationManager
              captures: { paid_sub_id: $.data.id }
            - call: "POST /subscribers"
              payload: { email: "ctrl@x.com", full_name: "Ctrl Sub", address_line1: "2 A St", city: "Springfield", state_code: "IL", postal_code: "62701" }
              as: CirculationManager
              captures: { ctrl_sub_id: $.data.id }
            - call: "POST /publications/${pub_id}/subscribers/${paid_sub_id}/subscriptions"
              payload: { start_issue_id: "${issue_id}", term_issues: 12, price_paid_cents: 1200, qualification_tier: "PAID", payment_method: "CARD" }
              as: CirculationManager
              captures: { paid_subscr_id: $.data.id }
            - call: "POST /publications/${pub_id}/subscribers/${ctrl_sub_id}/subscriptions"
              payload: { start_issue_id: "${issue_id}", term_issues: 12, price_paid_cents: 0, qualification_tier: "CONTROLLED", payment_method: "NONE" }
              as: CirculationManager
              captures: { ctrl_subscr_id: $.data.id }
            - call: "POST /publications/${pub_id}/subscriptions/${paid_subscr_id}/activate"
              payload: {}
              as: CirculationManager
            - call: "POST /publications/${pub_id}/subscriptions/${ctrl_subscr_id}/activate"
              payload: {}
              as: CirculationManager
            # Drive issue through pipeline
            - call: "POST /publications/${pub_id}/issues/${issue_id}/close-editorial"
              payload: {}
              as: ProductionManager
            - call: "GET /publications/${pub_id}/issues/${issue_id}"
              payload: {}
              as: ProductionManager
              captures: { issue_v1: $.data.version }
            - call: "POST /publications/${pub_id}/issues/${issue_id}/close-ads"
              payload: { expected_issue_version: "${issue_v1}" }
              as: ProductionManager
            - call: "POST /publications/${pub_id}/issues/${issue_id}/ship-to-printer"
              payload: {}
              as: ProductionManager
            - call: "POST /publications/${pub_id}/issues/${issue_id}/mailing-batches"
              payload: { batch_label: "DOMESTIC", postal_class: "PERIODICAL", entry_point: "DDU", permit_number: "P-100", is_controlled_copy_included: true }
              as: FulfillmentManager
              captures: { batch_id: $.data.id, batch_v: $.data.version }
          trigger:
            - call: "POST /publications/${pub_id}/issues/${issue_id}/mailing-batches/${batch_id}/generate-labels"
              payload: { expected_batch_version: "${batch_v}" }
              as: FulfillmentManager
            - call: "GET /publications/${pub_id}/issues/${issue_id}/mailing-batches/${batch_id}/labels"
              payload: {}
              as: FulfillmentManager
              captures: { paid_postage: "$.data[0].postage_cents", ctrl_postage: "$.data[1].postage_cents" }
          assert:
            - "Exactly 2 MailingLabels created"
            - "Label for ${paid_subscr_id} has is_controlled_copy == false"
            - "Label for ${ctrl_subscr_id} has is_controlled_copy == true"
            - "For 4.5oz PERIODICAL at DDU: paid_label.postage_cents == round_half_up(41 * (10000 - 2100 + 0) / 10000) == 32 (base 41c, 21% DDU discount, no controlled surcharge)"
            - "ctrl_label.postage_cents == round_half_up(41 * (10000 - 2100 + 500) / 10000) == 34 (base 41c, 21% DDU discount, 5% controlled surcharge)"
            - "The two labels' postage_cents differ by the controlled surcharge — observable per-piece divergence"

  # ===========================================================================
  # Rule 2 — combinatorial_formula (≥2 instances, DIFFERENT modes)
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: postal_rate_tiered_entry_controlled_three_input_nonlinear
        grounds:
          - calculations.postal_rate_per_piece
        distinguishing_aspect: |
          Mode (a) — formula with ≥3 inputs (postal_class, entry_point, piece_weight_oz,
          is_controlled_copy) and non-linear interaction (nested case + conditional
          surcharge). Changing any single input produces a non-proportional change
          in postage_cents: the controlled surcharge applies ONLY when
          postal_class == PERIODICAL, not under STANDARD or FIRST_CLASS.
        test_recipe:
          setup:
            - "Publication P (MIXED)"
            - "Issue I in AT_PRINTER"
            - "Two MailingBatches: B_PERIODICAL (postal_class=PERIODICAL, entry_point=ORIGIN) and B_FIRST (postal_class=FIRST_CLASS, entry_point=ORIGIN)"
            - "Each batch has 1 label with piece_weight_oz=4.5, is_controlled_copy=true (forced for test)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PublishingDirector
            - call: "POST /publications"
              payload: { title: "Combinatorial Test", issn: "22223333", frequency: "MONTHLY", circulation_model: "MIXED", base_cover_price_cents: 399, deferred_revenue_method: "PRO_RATA_ISSUE" }
              as: PublishingDirector
              captures: { pub_id: $.data.id }
            - call: "POST /publications/${pub_id}/issues"
              payload: { issue_number: 1, volume_number: 1, cover_date: "2026-08-01T00:00:00Z", editorial_close_date: "2026-07-01T00:00:00Z", ad_close_date: "2026-07-05T00:00:00Z", ship_to_printer_date: "2026-07-10T00:00:00Z", mail_date: "2026-08-01T00:00:00Z", ad_pages_sold: 5, newsstand_buffer_copies: 10 }
              as: ProductionManager
              captures: { issue_id: $.data.id }
            - call: "POST /subscribers"
              payload: { email: "c1@x.com", full_name: "C1", address_line1: "1 A St", city: "Springfield", state_code: "IL", postal_code: "62701" }
              as: CirculationManager
              captures: { sub1_id: $.data.id }
            - call: "POST /subscribers"
              payload: { email: "c2@x.com", full_name: "C2", address_line1: "2 A St", city: "Springfield", state_code: "IL", postal_code: "62701" }
              as: CirculationManager
              captures: { sub2_id: $.data.id }
            - call: "POST /publications/${pub_id}/subscribers/${sub1_id}/subscriptions"
              payload: { start_issue_id: "${issue_id}", term_issues: 12, price_paid_cents: 0, qualification_tier: "CONTROLLED", payment_method: "NONE" }
              as: CirculationManager
              captures: { subscr1_id: $.data.id }
            - call: "POST /publications/${pub_id}/subscribers/${sub2_id}/subscriptions"
              payload: { start_issue_id: "${issue_id}", term_issues: 12, price_paid_cents: 0, qualification_tier: "CONTROLLED", payment_method: "NONE" }
              as: CirculationManager
              captures: { subscr2_id: $.data.id }
            - call: "POST /publications/${pub_id}/subscriptions/${subscr1_id}/activate"
              payload: {}
              as: CirculationManager
            - call: "POST /publications/${pub_id}/subscriptions/${subscr2_id}/activate"
              payload: {}
              as: CirculationManager
            - call: "POST /publications/${pub_id}/issues/${issue_id}/close-editorial"
              payload: {}
              as: ProductionManager
            - call: "GET /publications/${pub_id}/issues/${issue_id}"
              payload: {}
              as: ProductionManager
              captures: { issue_v: $.data.version }
            - call: "POST /publications/${pub_id}/issues/${issue_id}/close-ads"
              payload: { expected_issue_version: "${issue_v}" }
              as: ProductionManager
            - call: "POST /publications/${pub_id}/issues/${issue_id}/ship-to-printer"
              payload: {}
              as: ProductionManager
            - call: "POST /publications/${pub_id}/issues/${issue_id}/mailing-batches"
              payload: { batch_label: "B_PERIODICAL", postal_class: "PERIODICAL", entry_point: "ORIGIN", permit_number: "P-1", is_controlled_copy_included: true }
              as: FulfillmentManager
              captures: { batch_per_id: $.data.id, batch_per_v: $.data.version }
            - call: "POST /publications/${pub_id}/issues/${issue_id}/mailing-batches"
              payload: { batch_label: "B_FIRST", postal_class: "FIRST_CLASS", entry_point: "ORIGIN", permit_number: "P-2", is_controlled_copy_included: false }
              as: FulfillmentManager
              captures: { batch_first_id: $.data.id, batch_first_v: $.data.version }
          trigger:
            - call: "POST /publications/${pub_id}/issues/${issue_id}/mailing-batches/${batch_per_id}/generate-labels"
              payload: { expected_batch_version: "${batch_per_v}" }
              as: FulfillmentManager
            - call: "POST /publications/${pub_id}/issues/${issue_id}/mailing-batches/${batch_first_id}/generate-labels"
              payload: { expected_batch_version: "${batch_first_v}" }
              as: FulfillmentManager
            - call: "GET /publications/${pub_id}/issues/${issue_id}/mailing-batches/${batch_per_id}/labels"
              payload: {}
              as: FulfillmentManager
              captures: { per_label_postage: "$.data[0].postage_cents" }
            - call: "GET /publications/${pub_id}/issues/${issue_id}/mailing-batches/${batch_first_id}/labels"
              payload: {}
              as: FulfillmentManager
              captures: { first_label_postage: "$.data[0].postage_cents" }
          assert:
            - "PERIODICAL label (4.5oz, controlled, ORIGIN): postage == round_half_up(41 * (10000 - 0 + 500) / 10000) == 43 cents (base 41, 0% discount, 5% surcharge)"
            - "FIRST_CLASS label (4.5oz, controlled, ORIGIN): postage == round_half_up(140 * (10000 - 0 + 0) / 10000) == 140 cents (base 116 + 24*ceil(4.5-3.0)=140; no controlled surcharge under FIRST_CLASS)"
            - "The controlled-surcharge interaction is observable: same weight, same entry_point, same is_controlled_copy — but the surcharge applies only under PERIODICAL"

      - name: deferred_revenue_residual_absorption_rounding_order
        grounds:
          - calculations.deferred_revenue_pro_rata_issue
          - calculations.deferred_revenue_straight_line_month
        distinguishing_aspect: |
          Mode (b) — nested rounding where the order matters. PRO_RATA_ISSUE pins
          "round per-issue then absorb residual on final issue"; the alternative
          "sum-then-round" would produce a different cents result for
          gross_amount_cents=1205, issues_in_term=12: per-issue round_half_up(1205/12)=100
          yields 100×11 + 105 = 1205 (residual absorbed), whereas sum-then-round
          of 12×round(1205/12) = 12×100 = 1200 leaves 5 cents unallocated —
          violating the invariant recognized+deferred==gross. The scaffold pins
          residual-absorption; an implementer using naive per-issue rounding
          without residual would leak 5 cents.
        test_recipe:
          setup:
            - "Publication P (MONTHLY, PRO_RATA_ISSUE)"
            - "12 Issues created and mailed sequentially"
            - "One ACTIVE Subscription with term_issues=12, price_paid_cents=1205"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PublishingDirector
            - call: "POST /publications"
              payload: { title: "Rounding Test", issn: "33334444", frequency: "MONTHLY", circulation_model: "PAID", base_cover_price_cents: 100, deferred_revenue_method: "PRO_RATA_ISSUE" }
              as: PublishingDirector
              captures: { pub_id: $.data.id }
            - call: "POST /subscribers"
              payload: { email: "r@x.com", full_name: "R", address_line1: "1 A St", city: "Springfield", state_code: "IL", postal_code: "62701" }
              as: CirculationManager
              captures: { sub_id: $.data.id }
            - call: "POST /publications/${pub_id}/issues"
              payload: { issue_number: 1, volume_number: 1, cover_date: "2026-01-01T00:00:00Z", editorial_close_date: "2025-12-01T00:00:00Z", ad_close_date: "2025-12-05T00:00:00Z", ship_to_printer_date: "2025-12-10T00:00:00Z", mail_date: "2026-01-01T00:00:00Z", ad_pages_sold: 5, newsstand_buffer_copies: 5 }
              as: ProductionManager
              captures: { issue1_id: $.data.id }
            - call: "POST /publications/${pub_id}/subscribers/${sub_id}/subscriptions"
              payload: { start_issue_id: "${issue1_id}", term_issues: 12, price_paid_cents: 1205, qualification_tier: "PAID", payment_method: "CARD" }
              as: CirculationManager
              captures: { subscr_id: $.data.id }
            - call: "POST /publications/${pub_id}/subscriptions/${subscr_id}/activate"
              payload: {}
              as: CirculationManager
            # Note: full test would create and mail 12 issues; prototype shows the invariant
          trigger:
            - call: "GET /publications/${pub_id}/subscriptions/${subscr_id}/terms"
              payload: {}
              as: CirculationManager
              captures: { term_deferred: "$.data[0].deferred_balance_cents", term_recognized: "$.data[0].recognized_balance_cents", term_gross: "$.data[0].gross_amount_cents" }
          assert:
            - "term_gross == 1205"
            - "term_deferred == 1205 (before any issue mails)"
            - "term_recognized == 0"
            - "term_recognized + term_deferred == term_gross  # invariant holds initially"
            - "After mailing all 12 issues: sum of DeferredRevenueEntry amounts == 1205, term.deferred_balance_cents == 0, and the final issue's entry.amount_cents == 105 (residual absorbed, NOT 100)"

  # ===========================================================================
  # Rule 3 — non_linear_state_machine (≥2 instances, different entities)
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: issue_ad_close_reopen_cycle
        grounds:
          - state_machines.Issue.AD_CLOSED_to_EDITORIAL_CLOSED
          - state_machines.Issue.EDITORIAL_CLOSED_to_AD_CLOSED
        distinguishing_aspect: |
          Issue state machine contains a CYCLE: EDITORIAL_CLOSED → AD_CLOSED →
          EDITORIAL_CLOSED (reopen-ads). This is non-linear and the revert has
          observable side effects (ad_pages_sold unfrozen). Test must verify the
          cycle can execute multiple times AND that the revert is gated by
          "no MailingBatch left DRAFT".
        test_recipe:
          setup:
            - "Publication P (PAID)"
            - "Issue I with ad_close_date <= current_utc"
            - "Issue I in AD_CLOSED state"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PublishingDirector
            - call: "POST /publications"
              payload: { title: "Cycle Test", issn: "44445555", frequency: "MONTHLY", circulation_model: "PAID", base_cover_price_cents: 599, deferred_revenue_method: "PRO_RATA_ISSUE" }
              as: PublishingDirector
              captures: { pub_id: $.data.id }
            - call: "POST /publications/${pub_id}/issues"
              payload: { issue_number: 1, volume_number: 1, cover_date: "2026-08-01T00:00:00Z", editorial_close_date: "2026-07-01T00:00:00Z", ad_close_date: "2026-07-05T00:00:00Z", ship_to_printer_date: "2026-07-10T00:00:00Z", mail_date: "2026-08-01T00:00:00Z", ad_pages_sold: 5 }
              as: ProductionManager
              captures: { issue_id: $.data.id }
            - call: "POST /publications/${pub_id}/issues/${issue_id}/close-editorial"
              payload: {}
              as: ProductionManager
            - call: "GET /publications/${pub_id}/issues/${issue_id}"
              payload: {}
              as: ProductionManager
              captures: { issue_v: $.data.version }
            - call: "POST /publications/${pub_id}/issues/${issue_id}/close-ads"
              payload: { expected_issue_version: "${issue_v}" }
              as: ProductionManager
          trigger:
            - call: "POST /publications/${pub_id}/issues/${issue_id}/reopen-ads"
              payload: {}
              as: ProductionManager
            - call: "GET /publications/${pub_id}/issues/${issue_id}"
              payload: {}
              as: ProductionManager
              captures: { issue_v2: $.data.version, issue_state: $.data.status }
          assert:
            - "Issue.${issue_id}.status == EDITORIAL_CLOSED after reopen"
            - "Issue.${issue_id}.version incremented by 1 after reopen"
            - "Issue can cycle again: close-ads succeeds with the new version (OCC)"

      - name: subscription_suspend_resume_cycle
        grounds:
          - state_machines.Subscription.ACTIVE_to_SUSPENDED
          - state_machines.Subscription.SUSPENDED_to_ACTIVE
        distinguishing_aspect: |
          Subscription state machine contains a CYCLE: ACTIVE ⇄ SUSPENDED. Each
          SUSPENDED→ACTIVE transition recomputes issues_suspended_count and
          issues_remaining. Multiple cycles accumulate the suspended count.
        test_recipe:
          setup:
            - "Publication P (ACTIVE), Issue I (AT_PRINTER), ACTIVE Subscription S"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PublishingDirector
            - call: "POST /publications"
              payload: { title: "Sub Cycle", issn: "55556666", frequency: "MONTHLY", circulation_model: "PAID", base_cover_price_cents: 599, deferred_revenue_method: "PRO_RATA_ISSUE" }
              as: PublishingDirector
              captures: { pub_id: $.data.id }
            - call: "POST /publications/${pub_id}/issues"
              payload: { issue_number: 1, volume_number: 1, cover_date: "2026-08-01T00:00:00Z", editorial_close_date: "2025-12-01T00:00:00Z", ad_close_date: "2025-12-05T00:00:00Z", ship_to_printer_date: "2025-12-10T00:00:00Z", mail_date: "2026-08-01T00:00:00Z", ad_pages_sold: 5 }
              as: ProductionManager
              captures: { issue_id: $.data.id }
            - call: "POST /subscribers"
              payload: { email: "c@x.com", full_name: "C", address_line1: "1 A St", city: "Springfield", state_code: "IL", postal_code: "62701" }
              as: CirculationManager
              captures: { sub_id: $.data.id }
            - call: "POST /publications/${pub_id}/subscribers/${sub_id}/subscriptions"
              payload: { start_issue_id: "${issue_id}", term_issues: 12, price_paid_cents: 1200, qualification_tier: "PAID", payment_method: "CARD" }
              as: CirculationManager
              captures: { subscr_id: $.data.id }
            - call: "POST /publications/${pub_id}/subscriptions/${subscr_id}/activate"
              payload: {}
              as: CirculationManager
          trigger:
            - call: "POST /publications/${pub_id}/subscriptions/${subscr_id}/suspend"
              payload: {}
              as: CirculationManager
            - call: "POST /publications/${pub_id}/subscriptions/${subscr_id}/resume"
              payload: {}
              as: CirculationManager
            - call: "POST /publications/${pub_id}/subscriptions/${subscr_id}/suspend"
              payload: {}
              as: CirculationManager
            - call: "POST /publications/${pub_id}/subscriptions/${subscr_id}/resume"
              payload: {}
              as: CirculationManager
            - call: "GET /publications/${pub_id}/subscriptions/${subscr_id}"
              payload: {}
              as: CirculationManager
              captures: { final_state: $.data.status, susp_count: $.data.issues_suspended_count }
          assert:
            - "Subscription.${subscr_id}.status == ACTIVE after second resume"
            - "Two cycles completed without error"
            - "issues_suspended_count is cumulative across cycles (depends on issues mailed during each SUSPENDED window)"

  # ===========================================================================
  # Rule 4 — transitive_cascade (≥2 instances, depth≥3 and depth≥2, different triggers)
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: publication_suspend_cascades_depth3
        grounds:
          - state_machines.Publication.ACTIVE_to_SUSPENDED
          - state_machines.Subscription.ACTIVE_to_SUSPENDED
          - state_machines.RenewalEvent.PENDING_to_EXPIRED
        distinguishing_aspect: |
          Depth-3 cascade: PublishingDirector suspends Publication (link 1)
          → all ACTIVE Subscriptions transition to SUSPENDED (link 2)
          → all PENDING RenewalEvents on those subscriptions transition to
          EXPIRED (link 3). Each link is caused by the previous, not by the
          original trigger.
        test_recipe:
          setup:
            - "Publication P ACTIVE with 2 ACTIVE Subscriptions (S1, S2)"
            - "S1 has 1 PENDING RenewalEvent (fired earlier)"
            - "S2 has 1 PENDING RenewalEvent"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PublishingDirector
            - call: "POST /publications"
              payload: { title: "Cascade Test", issn: "66667777", frequency: "MONTHLY", circulation_model: "PAID", base_cover_price_cents: 599, deferred_revenue_method: "PRO_RATA_ISSUE" }
              as: PublishingDirector
              captures: { pub_id: $.data.id }
            - call: "POST /publications/${pub_id}/issues"
              payload: { issue_number: 1, volume_number: 1, cover_date: "2026-01-01T00:00:00Z", editorial_close_date: "2025-12-01T00:00:00Z", ad_close_date: "2025-12-05T00:00:00Z", ship_to_printer_date: "2025-12-10T00:00:00Z", mail_date: "2026-01-01T00:00:00Z", ad_pages_sold: 5 }
              as: ProductionManager
              captures: { issue_id: $.data.id }
            - call: "POST /publications/${pub_id}/renewal-series"
              payload: { series_code: "STD3", effort_offsets_days: [-90, -60, -30], effort_pricing_cents: [999, 1099, 1199], is_default: true }
              as: CirculationManager
            - call: "POST /subscribers"
              payload: { email: "s1@x.com", full_name: "S1", address_line1: "1 A St", city: "Springfield", state_code: "IL", postal_code: "62701" }
              as: CirculationManager
              captures: { sub1_id: $.data.id }
            - call: "POST /subscribers"
              payload: { email: "s2@x.com", full_name: "S2", address_line1: "2 A St", city: "Springfield", state_code: "IL", postal_code: "62701" }
              as: CirculationManager
              captures: { sub2_id: $.data.id }
            - call: "POST /publications/${pub_id}/subscribers/${sub1_id}/subscriptions"
              payload: { start_issue_id: "${issue_id}", term_issues: 12, price_paid_cents: 1200, qualification_tier: "PAID", payment_method: "CARD" }
              as: CirculationManager
              captures: { subscr1_id: $.data.id }
            - call: "POST /publications/${pub_id}/subscribers/${sub2_id}/subscriptions"
              payload: { start_issue_id: "${issue_id}", term_issues: 12, price_paid_cents: 1200, qualification_tier: "PAID", payment_method: "CARD" }
              as: CirculationManager
              captures: { subscr2_id: $.data.id }
            - call: "POST /publications/${pub_id}/subscriptions/${subscr1_id}/activate"
              payload: {}
              as: CirculationManager
            - call: "POST /publications/${pub_id}/subscriptions/${subscr2_id}/activate"
              payload: {}
              as: CirculationManager
            - call: "POST /publications/${pub_id}/subscriptions/${subscr1_id}/renewal-events/fire-next"
              payload: {}
              as: CirculationManager
              captures: { event1_id: $.data.id }
            - call: "POST /publications/${pub_id}/subscriptions/${subscr2_id}/renewal-events/fire-next"
              payload: {}
              as: CirculationManager
              captures: { event2_id: $.data.id }
          trigger:
            - call: "POST /publications/${pub_id}/suspend"
              payload: {}
              as: PublishingDirector
          assert:
            - "Publication.${pub_id}.status == SUSPENDED"
            - "Subscription.${subscr1_id}.status == SUSPENDED"
            - "Subscription.${subscr2_id}.status == SUSPENDED"
            - "RenewalEvent.${event1_id}.response == EXPIRED"
            - "RenewalEvent.${event2_id}.response == EXPIRED"

      - name: subscription_cancel_cascades_depth2
        grounds:
          - state_machines.Subscription.ACTIVE_to_CANCELLED
          - state_machines.RenewalEvent.PENDING_to_EXPIRED
          - entities.DigitalEntitlement.fields.revoked_at
        distinguishing_aspect: |
          Depth-2 cascade: CirculationManager cancels Subscription (link 1)
          → all PENDING RenewalEvents → EXPIRED AND all active DigitalEntitlements
          get revoked_at set (link 2, two parallel effects from the same
          intermediate). This is distinct from Rule 4 instance 1 — different
          triggering transition (cancel vs suspend), different depth.
        test_recipe:
          setup:
            - "ACTIVE Subscription S with 1 PENDING RenewalEvent and 1 active DigitalEntitlement"
          setup_api_calls:
