              as: DesignEngineer
              as_user_id: "eng-1"
              captures: { pj: $.data.id }
          trigger:
            - call: "POST /service-contracts"
              payload: { project_id: "${pj}", tier: "GOLD", spare_pct_bp: 400, term_months: 60 }
