            - "HTTP 409 and data.error_id == \"ERR_LANES_NOT_LOCKED\""
            - "BidEvent.status is still \"DRAFT\" and invited_carrier_count == 0"
            - "no Invitation row exists for the (event, carrier) pair — GET /freight-procurement/invitations?bid_event_id=${event_id} returns total_count 0"

      - name: optimization_run_while_a_round_is_still_open_returns_round_still_open
        claim_type: Precondition Enforcement
        grounds:
          - errors.ERR_ROUND_STILL_OPEN
          - state_machines.BidEvent.ROUND_CLOSED_to_OPTIMIZING
        distinguishing_aspect: "Optimization is only defined over a CLOSED round's bid set, so a run created while the round is OPEN is refused at priority 9 — before the OCC version check at priority 8 would even matter."
        test_recipe:
          setup:
            - "Event in ROUND_OPEN with one submitted bid on L-1147; the round has not been closed."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProcurementAnalyst
            - call: "POST /freight-procurement/carriers"
              payload: { legal_name: "Alpha Freight Lines", scac_code: "ALFL", diversity_classification: "NONE", service_modes: ["DRY_VAN"], fleet_power_units: 120, auto_liability_limit_usd: 1000000.00, cargo_limit_usd: 250000.00, insurance_expiry_date: "2027-06-30T00:00:00Z" }
              as: ProcurementAnalyst
              captures: { carrier_a_id: $.data.id }
            - call: "POST /freight-procurement/carriers/${carrier_a_id}/qualification-reviews"
              payload: { required_modes: ["DRY_VAN"], min_auto_liability_usd: 1000000.00, min_cargo_usd: 100000.00 }
              as: ComplianceOfficer
              captures: { review_a_id: $.data.id }
            - call: "POST /freight-procurement/qualification-reviews/${review_a_id}/insurance-verification"
              payload: { verified_auto_liability_usd: 1000000.00, verified_cargo_usd: 250000.00, verified_expiry_date: "2027-06-30T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /freight-procurement/qualification-reviews/${review_a_id}/capability-screening"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /freight-procurement/qualification-reviews/${review_a_id}/decision"
              payload: { outcome: "APPROVE" }
              as: ComplianceOfficer
            - call: "POST /freight-procurement/bid-events"
              payload: { name: "Open Round Event", cost_basis: "FORECAST", fuel_index_per_mile: 0.4800, accessorial_inflation_factor: 1.15, rate_floor_per_mile: 1.5000, rounds_allowed: 1, cost_weight: 0.55, service_weight: 0.20, capacity_weight: 0.15, diversity_weight: 0.10, diversity_min_pct: 0.00, max_award_share_pct: 100.00, max_carriers_per_lane: 1, contract_effective_from: "2026-09-01T00:00:00Z", contract_effective_to: "2027-09-01T00:00:00Z" }
              as: ProcurementAnalyst
              captures: { event_id: $.data.id }
            - call: "POST /freight-procurement/bid-events/${event_id}/lanes"
              payload: { lane_code: "L-1147", origin_zip3: "300", dest_zip3: "606", equipment_type: "DRY_VAN", mileage: 1147, annual_volume_loads: 550, service_days_required: 3, accessorial_history_usd_per_load: 137.55, trailing_12m_actual_loads: 480, incumbent_carrier_id: "${carrier_a_id}", incumbent_rate_per_mile: 2.4000 }
              as: ProcurementAnalyst
              captures: { lane_a_id: $.data.id }
            - call: "POST /freight-procurement/lanes/${lane_a_id}/validate"
              payload: {}
              as: ProcurementAnalyst
            - call: "POST /freight-procurement/bid-events/${event_id}/lock-lanes"
              payload: {}
              as: ProcurementAnalyst
            - call: "POST /freight-procurement/bid-events/${event_id}/invitations"
              payload: { carrier_id: "${carrier_a_id}", nda_required: false }
              as: ProcurementAnalyst
              captures: { invite_id: $.data.id }
            - call: "POST /freight-procurement/invitations/${invite_id}/response"
              payload: { accept: true }
              as: CarrierRep
              as_user_id: "${carrier_a_id}"
            - call: "POST /freight-procurement/bid-events/${event_id}/bid-rounds"
              payload: { incumbent_visibility: "RANK_ONLY", closes_at: "2026-08-20T00:00:00Z" }
              as: ProcurementAnalyst
              captures: { round_id: $.data.id }
            - call: "POST /freight-procurement/bid-rounds/${round_id}/lane-bids"
              payload: { lane_id: "${lane_a_id}", carrier_id: "${carrier_a_id}", rate_per_mile: 2.1152, fuel_surcharge_included: true, committed_volume_loads: 600, transit_days_offered: 3 }
              as: CarrierRep
              as_user_id: "${carrier_a_id}"
            - call: "GET /freight-procurement/bid-events/${event_id}"
              payload: {}
              as: ProcurementAnalyst
              captures: { event_v: $.data.version }
          trigger:
            - call: "POST /freight-procurement/optimization-runs"
              payload: { bid_event_id: "${event_id}", expected_bid_event_version: "${event_v}", scenario_label: "PREMATURE", max_carriers_per_lane: 1, diversity_min_pct: 0.00, min_capacity_coverage_pct: 0.00 }
              as: ProcurementAnalyst
              captures: { err_round_open: $.data.error_id }
          assert:
            - "HTTP 409 and data.error_id == \"ERR_ROUND_STILL_OPEN\" — the supplied expected_bid_event_version was correct, so this is a state refusal, not an OCC refusal"
            - "BidEvent.status is still \"ROUND_OPEN\" and its version did not advance"
            - "no OptimizationRun row exists — GET /freight-procurement/bid-events/${event_id}/optimization-runs returns 0 rows"

      - name: second_routing_guide_publish_returns_event_not_optimizing
        claim_type: Idempotency
        grounds:
          - errors.ERR_EVENT_NOT_OPTIMIZING
          - state_machines.OptimizationRun.COMPLETED_to_PUBLISHED
          - state_machines.BidEvent.OPTIMIZING_to_AWARDING
        distinguishing_aspect: "Publishing is the write that mints the PROPOSED allocations, so replaying it must not mint a second set — and the guard is the event's own state (already AWARDING), not the run's."
        test_recipe:
          setup:
            - "CHAIN:AWARDED_CONTRACT run only as far as the first routing-guide publish (stop before the allocation approve): BidEvent AWARDING, run ${run_id} PUBLISHED, one PROPOSED allocation on L-1147."
          setup_api_calls:
            - call: "POST /freight-procurement/optimization-runs/${run_id}/routing-guide"
              payload: {}
              as: ProcurementAnalyst
          trigger:
            - call: "POST /freight-procurement/optimization-runs/${run_id}/routing-guide"
              payload: {}
              as: ProcurementAnalyst
              captures: { err_not_optimizing: $.data.error_id }
          assert:
            - "the first publish returned 200 with data.status == \"PUBLISHED\", data.published_at == \"2026-08-01T00:00:00Z\", data.coverage_pct == 100.00"
            - "the replay returns HTTP 409 with data.error_id == \"ERR_EVENT_NOT_OPTIMIZING\" — the event left OPTIMIZING on the first publish"
            - "GET /freight-procurement/award-allocations with bid_event_id filter still returns total_count 1 — no duplicate PROPOSED row"
            - "OptimizationRun.published_at is unchanged and BidEvent.status is still \"AWARDING\""

      - name: allocation_approve_replayed_returns_allocation_not_proposed_without_double_debit
        claim_type: Idempotency
        grounds:
          - errors.ERR_ALLOCATION_NOT_PROPOSED
          - state_machines.AwardAllocation.PROPOSED_to_APPROVED
          - calculations.award_allocation_waterfall
        distinguishing_aspect: "Approval is the write that takes the volume debit off the lane; replaying it must be refused on state, because a second debit would break the volume conservation invariant while every field still looks plausible."
        test_recipe:
          setup:
            - "CHAIN:AWARDED_CONTRACT run as far as the first allocation approve (stop before the event award): allocation ${alloc_id} APPROVED with allocated_volume_loads 550, Lane.unallocated_volume_loads 0."
          setup_api_calls:
            - call: "GET /freight-procurement/award-allocations"
              payload: { bid_event_id: "${event_id}" }
              as: ProcurementAnalyst
              captures: { alloc_id: "$.data[0].id" }
            - call: "POST /freight-procurement/award-allocations/${alloc_id}/approve"
              payload: {}
              as: CategoryManager
              as_user_id: "cm-001"
          trigger:
            - call: "POST /freight-procurement/award-allocations/${alloc_id}/approve"
              payload: {}
              as: CategoryManager
              as_user_id: "cm-001"
              captures: { err_not_proposed: $.data.error_id }
          assert:
            - "the first approve returned 200 with data.status == \"APPROVED\", data.approved_by_user_id == \"cm-001\", data.approved_at == \"2026-08-01T00:00:00Z\", data.allocated_volume_loads == 550, data.allocated_pct == 100.00"
            - "after the first approve GET /freight-procurement/lanes/${lane_a_id} shows unallocated_volume_loads == 0 — the single debit of 550"
            - "the replay returns HTTP 409 with data.error_id == \"ERR_ALLOCATION_NOT_PROPOSED\""
            - "after the replay Lane.unallocated_volume_loads is still 0 (not -550) and BidEvent.coverage_pct is still 100.00 — 0 + 550 == annual_volume_loads 550 still holds"
            - "AwardAllocation.approved_at is unchanged by the replay"

      - name: invitation_revoke_after_acceptance_withdraws_the_carriers_open_round_bids
        claim_type: Side Effect Execution
        grounds:
          - state_machines.Invitation.ACCEPTED_to_REVOKED
          - state_machines.LaneBid.SUBMITTED_to_WITHDRAWN
          - entities.BidRound.fields.lowest_rate_per_mile
        distinguishing_aspect: "Revoking an ACCEPTED invitation is a three-place write: the invitation, the event's accepted counter, and every SUBMITTED bid the carrier left on an OPEN round — including the round's derived lowest_rate_per_mile, which must fall back to null once the last bid is gone."
        test_recipe:
          setup:
            - "CHAIN:AWARDED_CONTRACT run as far as the lane-bid submit (stop before the round close): round ${round_id} OPEN with one SUBMITTED bid at 2.0000, BidEvent.accepted_invitation_count 1."
          setup_api_calls:
            - call: "GET /freight-procurement/bid-rounds/${round_id}"
              payload: {}
              as: ProcurementAnalyst
          trigger:
            - call: "POST /freight-procurement/invitations/${invite_id}/revoke"
              payload: { revoked_reason: "Carrier withdrew from the program" }
              as: ProcurementAnalyst
          assert:
            - "before the revoke the round shows submitted_bid_count == 1 and lowest_rate_per_mile == 2.0000"
            - "HTTP 200 and data.status == \"REVOKED\" with data.revoked_reason == \"Carrier withdrew from the program\""
            - "GET /freight-procurement/bid-events/${event_id} shows accepted_invitation_count == 0 (decremented, because the invitation had reached ACCEPTED)"
            - "GET /freight-procurement/lane-bids/${bid_a_id} shows status \"WITHDRAWN\" with withdrawn_at == \"2026-08-01T00:00:00Z\""
            - "GET /freight-procurement/bid-rounds/${round_id} shows submitted_bid_count == 0 and lowest_rate_per_mile == null — the derived field is recomputed, not left stale at 2.0000"
            - "BidEvent.status is still \"ROUND_OPEN\" and Lane L-1147 is still \"LOCKED\" — the revoke does not unwind scope"

      - name: lane_bid_withdraw_frees_the_duplicate_bid_uniqueness_slot
        claim_type: Side Effect Execution
        grounds:
          - state_machines.LaneBid.SUBMITTED_to_WITHDRAWN
          - errors.ERR_DUPLICATE_LANE_BID
          - validations.priority_13_business_constraint
        distinguishing_aspect: "The uniqueness key is scoped to non-WITHDRAWN bids, so the same carrier may re-bid the same lane in the same round after withdrawing — and the round's derived lowest_rate_per_mile must follow the live bid, not the withdrawn one."
        test_recipe:
          setup:
            - "CHAIN:AWARDED_CONTRACT run as far as the lane-bid submit (stop before the round close): bid ${bid_a_id} SUBMITTED at 2.0000 on round ${round_id}."
          setup_api_calls:
            - call: "GET /freight-procurement/bid-rounds/${round_id}"
              payload: {}
              as: ProcurementAnalyst
          trigger:
            - call: "POST /freight-procurement/bid-rounds/${round_id}/lane-bids"
              payload: { lane_id: "${lane_a_id}", carrier_id: "${carrier_a_id}", rate_per_mile: 1.9500, fuel_surcharge_included: true, committed_volume_loads: 400, transit_days_offered: 3 }
              as: CarrierRep
              as_user_id: "${carrier_a_id}"
              captures: { err_duplicate_bid: $.data.error_id }
            - call: "POST /freight-procurement/lane-bids/${bid_a_id}/withdraw"
              payload: {}
              as: CarrierRep
              as_user_id: "${carrier_a_id}"
            - call: "POST /freight-procurement/bid-rounds/${round_id}/lane-bids"
              payload: { lane_id: "${lane_a_id}", carrier_id: "${carrier_a_id}", rate_per_mile: 1.9500, fuel_surcharge_included: true, committed_volume_loads: 400, transit_days_offered: 3 }
              as: CarrierRep
              as_user_id: "${carrier_a_id}"
          assert:
            - "the first re-bid attempt returns HTTP 409 with data.error_id == \"ERR_DUPLICATE_LANE_BID\" — one non-WITHDRAWN bid per (bid_round_id, lane_id, carrier_id)"
            - "the withdraw returns 200 with data.status == \"WITHDRAWN\"; the round then reports submitted_bid_count == 0 and lowest_rate_per_mile == null"
            - "the identical re-bid now returns HTTP 201 with data.status == \"SUBMITTED\" and data.rate_per_mile == 1.9500"
            - "the round then reports submitted_bid_count == 1 and lowest_rate_per_mile == 1.9500 — the WITHDRAWN row contributes nothing"
            - "the withdrawn bid still exists on GET /freight-procurement/lane-bids/${bid_a_id} with status \"WITHDRAWN\" — withdrawal is not deletion"

      - name: registered_carrier_status_change_to_qualified_is_not_a_declared_edge
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Carrier.SUSPENDED_to_QUALIFIED
          - errors.ERR_CARRIER_NOT_QUALIFIED
          - validations.priority_9_state
        distinguishing_aspect: "QUALIFIED is only reachable through the review fork or from SUSPENDED; the status-change endpoint must not be a back door that qualifies a carrier who was never screened."
        test_recipe:
          setup:
            - "Carrier ALFL freshly created, status REGISTERED, no qualification review."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProcurementAnalyst
            - call: "POST /freight-procurement/carriers"
              payload: { legal_name: "Alpha Freight Lines", scac_code: "ALFL", diversity_classification: "NONE", service_modes: ["DRY_VAN"], fleet_power_units: 120, auto_liability_limit_usd: 1000000.00, cargo_limit_usd: 250000.00, insurance_expiry_date: "2027-06-30T00:00:00Z" }
              as: ProcurementAnalyst
              captures: { carrier_a_id: $.data.id }
          trigger:
            - call: "POST /freight-procurement/carriers/${carrier_a_id}/status-change"
              payload: { to_status: "QUALIFIED", reason: "Fast-track this one" }
              as: ComplianceOfficer
              captures: { err_not_qualified: $.data.error_id }
          assert:
            - "HTTP 409 and data.error_id == \"ERR_CARRIER_NOT_QUALIFIED\" — (REGISTERED -> QUALIFIED) is not a declared Carrier edge"
            - "Carrier.status is still \"REGISTERED\" with qualified_at null, capability_score null, composite_score null and status_reason null"
            - "the same endpoint with to_status SUSPENDED does succeed from REGISTERED (a declared edge), proving the refusal is about the target state and not about the endpoint"

      - name: terminal_disqualified_carrier_cannot_be_returned_to_qualified
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Carrier.terminal_states
          - state_machines.Carrier.SUSPENDED_to_DISQUALIFIED
          - errors.ERR_CARRIER_NOT_QUALIFIED
        distinguishing_aspect: "DISQUALIFIED is the only terminal Carrier state and it is absorbing: even the operator who suspended and disqualified the carrier cannot walk it back, and the invitation revocations taken on the way in stay revoked."
        test_recipe:
          setup:
            - "CHAIN:AWARDED_CONTRACT stages S1-S9 run up to and including the invitation create, but WITHOUT the invitation response, so Carrier ALFL is QUALIFIED and Invitation ${invite_id} is still SENT."
          setup_api_calls:
            - call: "POST /freight-procurement/carriers/${carrier_a_id}/status-change"
              payload: { to_status: "SUSPENDED", reason: "Insurance lapse under investigation" }
              as: ComplianceOfficer
            - call: "POST /freight-procurement/carriers/${carrier_a_id}/status-change"
              payload: { to_status: "DISQUALIFIED", reason: "Fraudulent certificate" }
              as: ComplianceOfficer
          trigger:
            - call: "POST /freight-procurement/carriers/${carrier_a_id}/status-change"
              payload: { to_status: "QUALIFIED", reason: "Documents finally produced" }
              as: ComplianceOfficer
              captures: { err_terminal: $.data.error_id }
          assert:
            - "the disqualification returned 200 with data.status == \"DISQUALIFIED\", data.status_reason == \"Fraudulent certificate\", and it revoked the SENT invitation (GET /freight-procurement/invitations/${invite_id} shows \"REVOKED\")"
            - "the trigger returns HTTP 409 with data.error_id == \"ERR_CARRIER_NOT_QUALIFIED\" — no edge leaves DISQUALIFIED"
            - "to_status SUSPENDED and to_status DISQUALIFIED from DISQUALIFIED are refused with the same error: the state is absorbing for every target, not just for QUALIFIED"
            - "Carrier.status is still \"DISQUALIFIED\" and the invitation is still \"REVOKED\" — nothing was un-revoked"

      - name: scorecard_publish_replayed_returns_scorecard_already_published
        claim_type: Idempotency
        grounds:
          - errors.ERR_SCORECARD_ALREADY_PUBLISHED
          - state_machines.Scorecard.DRAFT_to_PUBLISHED
          - calculations.carrier_composite_score
        distinguishing_aspect: "Publication is the write that increments published_scorecard_count and re-scores the carrier; a replay must be refused on state so the count cannot be inflated into an unearned FINAL_PERFORMANCE variant."
        test_recipe:
          setup:
            - "CHAIN:AWARDED_CONTRACT stages S1-S6 only: Carrier ALFL QUALIFIED with composite_score 90.60 and composite_score_variant PROVISIONAL_SCREENING."
          setup_api_calls:
            - call: "POST /freight-procurement/carriers/${carrier_a_id}/scorecards"
              payload: { period_start: "2026-05-01T00:00:00Z", period_end: "2026-08-01T00:00:00Z", on_time_pct: 92.00, claims_ratio: 0.010 }
              as: CategoryManager
              captures: { sc_1_id: $.data.id }
            - call: "POST /freight-procurement/scorecards/${sc_1_id}/publish"
              payload: {}
              as: CategoryManager
          trigger:
            - call: "POST /freight-procurement/scorecards/${sc_1_id}/publish"
              payload: {}
              as: CategoryManager
              captures: { err_already_published: $.data.error_id }
          assert:
            - "the first publish returned 200 with data.status == \"PUBLISHED\", data.published_at == \"2026-08-01T00:00:00Z\" and data.composite_score == 94.40 (0.45*92.00 + 0.35*100.00 default tender_acceptance_pct + 0.20*max(0.00, 100.00 - 0.010*1000) == 41.40 + 35.00 + 18.00), data.tender_acceptance_pct == 100.00, data.period_tender_count == 0"
            - "after the first publish Carrier.published_scorecard_count == 1 and Carrier.composite_score == 93.68 with composite_score_variant flipped to \"FINAL_PERFORMANCE\" (FINAL_VARIANT_MIN_SCORECARDS is 1): performance 94.40 = round(94.40*0.5/0.5, 2), so 0.7*94.40 + 0.2*88.00 + 0.1*100.00"
            - "the replay returns HTTP 409 with data.error_id == \"ERR_SCORECARD_ALREADY_PUBLISHED\""
            - "after the replay Carrier.published_scorecard_count is still 1 and Carrier.composite_score is still 93.68 — the three-link cascade did not run twice"
            - "Scorecard.published_at is unchanged and Carrier.status is still \"QUALIFIED\""

      - name: dispute_of_a_draft_scorecard_returns_scorecard_not_published
        claim_type: Precondition Enforcement
        grounds:
          - errors.ERR_SCORECARD_NOT_PUBLISHED
          - state_machines.Scorecard.PUBLISHED_to_DISPUTED
          - validations.priority_9_state
        distinguishing_aspect: "A carrier may only dispute what it has been shown: an unpublished scorecard is refused on state at priority 9 even though the acting CarrierRep owns the row and passes the priority-6 ownership check."
        test_recipe:
          setup:
            - "CHAIN:AWARDED_CONTRACT stages S1-S6 only: Carrier ALFL QUALIFIED, composite_score 90.60, no scorecards yet."
          setup_api_calls:
            - call: "POST /freight-procurement/carriers/${carrier_a_id}/scorecards"
              payload: { period_start: "2026-05-01T00:00:00Z", period_end: "2026-08-01T00:00:00Z", on_time_pct: 55.00, claims_ratio: 0.080 }
              as: CategoryManager
              captures: { sc_1_id: $.data.id }
          trigger:
            - call: "POST /freight-procurement/scorecards/${sc_1_id}/dispute"
              payload: { disputed_reason: "Weather exclusions were not applied" }
              as: CarrierRep
              as_user_id: "${carrier_a_id}"
              captures: { err_not_published: $.data.error_id }
          assert:
            - "HTTP 409 and data.error_id == \"ERR_SCORECARD_NOT_PUBLISHED\""
            - "Scorecard.status is still \"DRAFT\", disputed_reason null, published_at null; its composite_score was still computed at creation as 63.75 (0.45*55.00 + 0.35*100.00 + 0.20*max(0.00, 100.00 - 0.080*1000) == 24.75 + 35.00 + 4.00)"
            - "Carrier.published_scorecard_count is still 0 and Carrier.composite_score is still 90.60 — a DRAFT scorecard never feeds the composite, whatever its score"
            - "the same dispute call succeeds with 200 once the scorecard is published, so the refusal is purely about publication state"

      - name: contract_minted_by_the_award_cascade_starts_draft_pending_both_not_staged
        claim_type: Initial State
        grounds:
          - state_machines.Contract.initial_state
          - entities.Contract.fields.signature_status
          - entities.Contract.fields.rate_load_status
        distinguishing_aspect: "Contracts are never POSTed: the award cascade mints them, and a freshly minted contract must sit at the origin of all three of its dimensions (DRAFT / PENDING_BOTH / NOT_STAGED) with every money field still null — the value only exists once a rate record is staged."
        test_recipe:
          setup:
            - "CHAIN:AWARDED_CONTRACT stages S1-S11 complete (the event award ran); no rate records staged yet."
          setup_api_calls:
            - call: "POST /freight-procurement/bid-events/${event_id}/award"
              payload: {}
              as: CategoryManager
              as_user_id: "cm-001"
          trigger:
            - call: "GET /freight-procurement/contracts"
              payload: { bid_event_id: "${event_id}" }
              as: ContractAdmin
              captures: { contract_id: "$.data[0].id" }
          assert:
            - "HTTP 200, response_type == \"array\", total_count == 1 — exactly one contract per (bid_event, carrier) holding an EXECUTED allocation"
            - "data[0].status == \"DRAFT\", data[0].signature_status == \"PENDING_BOTH\", data[0].rate_load_status == \"NOT_STAGED\""
            - "data[0].carrier_id == \"${carrier_a_id}\", data[0].bid_event_id == \"${event_id}\""
            - "data[0].effective_from == \"2026-09-01T00:00:00Z\" and data[0].effective_to == \"2027-09-01T00:00:00Z\" — copied from the event's contract window, not from the lane"
            - "data[0].rate_record_count == 0, data[0].amendment_count == 0, data[0].version == 1"
            - "data[0].base_committed_value_usd, volume_discount_pct, volume_discount_usd, accessorial_allowance_pct, accessorial_allowance_usd and total_committed_value_usd are all null, and all four signature fields are null"

      - name: rate_record_load_replayed_returns_rate_record_not_loaded
        claim_type: Idempotency
        grounds:
          - errors.ERR_RATE_RECORD_NOT_LOADED
          - state_machines.RateRecord.STAGED_to_LOADED
          - state_machines.Contract.rate_load_status_STAGED_to_LOADED
        distinguishing_aspect: "The second load must fail even though it would be a no-op on the record itself, because the first load already advanced the contract's rate_load_status dimension and loaded_at must not be re-stamped by a replay."
        test_recipe:
          setup:
            - "CHAIN:AWARDED_CONTRACT complete: rate record ${rate_a_id} LOADED, Contract.rate_load_status LOADED, clock 2026-08-01."
          setup_api_calls:
            - call: "POST /freight-procurement/rate-records/${rate_a_id}/load"
              payload: {}
              as: ContractAdmin
          trigger:
            - call: "POST /freight-procurement/rate-records/${rate_a_id}/load"
              payload: {}
              as: ContractAdmin
              captures: { err_not_loaded: $.data.error_id }
          assert:
            - "the first load returned 200 with data.status == \"LOADED\" and data.loaded_at == \"2026-08-01T00:00:00Z\""
            - "the replay returns HTTP 409 with data.error_id == \"ERR_RATE_RECORD_NOT_LOADED\" — the record is no longer STAGED"
            - "RateRecord.loaded_at is unchanged and live_at is still null"
            - "GET /freight-procurement/contracts/${contract_id} still shows rate_load_status \"LOADED\" (not LIVE) and rate_record_count 1"

      - name: go_live_before_the_record_is_loaded_returns_rate_record_not_loaded
        claim_type: Precondition Enforcement
        grounds:
          - errors.ERR_RATE_RECORD_NOT_LOADED
          - state_machines.RateRecord.LOADED_to_LIVE
          - validations.priority_9_state
        distinguishing_aspect: "Go-live has three preconditions; here signature_status is FULLY_SIGNED and the clock sits inside the effective window, so the only failing one is the record's own state — the load step cannot be skipped."
        test_recipe:
          setup:
            - "CHAIN:AWARDED_CONTRACT complete EXCEPT the final load call, so record ${rate_a_id} is still STAGED while the contract is FULLY_SIGNED; then the clock is moved to 2026-09-01T00:00:00Z, inside [2026-09-01, 2027-09-01)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProcurementAnalyst
          trigger:
            - call: "POST /freight-procurement/rate-records/${rate_a_id}/go-live"
              payload: {}
              as: ContractAdmin
              captures: { err_not_loaded: $.data.error_id }
          assert:
            - "HTTP 409 and data.error_id == \"ERR_RATE_RECORD_NOT_LOADED\" — not ERR_CONTRACT_NOT_FULLY_SIGNED (the contract is signed) and not ERR_RATE_NOT_IN_EFFECTIVE_WINDOW (the clock is inside the window)"
            - "RateRecord.status is still \"STAGED\" with live_at null and loaded_at null"
            - "AwardAllocation ${alloc_id} is still \"EXECUTED\" (not ACTIVE), Contract.rate_load_status is still \"STAGED\" and BidEvent.status is still \"AWARDED\" — none of the go-live cascade ran"
            - "running load and then go-live in that order succeeds, so the refusal is only about ordering"

      - name: tender_event_against_a_merely_loaded_record_returns_rate_record_not_live
        claim_type: Precondition Enforcement
        grounds:
          - errors.ERR_RATE_RECORD_NOT_LIVE
          - entities.TenderEvent.fields.rate_record_id
          - validations.priority_9_state
        distinguishing_aspect: "Tenders are physical freight events, so they may only be appended to a record that is actually LIVE or AT_RISK; a LOADED record has rates in the TMS but no routing authority yet, and appending to it must not start the tender counters."
        test_recipe:
          setup:
            - "CHAIN:AWARDED_CONTRACT complete: record ${rate_a_id} LOADED, never taken live; clock 2026-08-01."
          setup_api_calls:
            - call: "GET /freight-procurement/rate-records/${rate_a_id}"
              payload: {}
              as: ContractAdmin
          trigger:
            - call: "POST /freight-procurement/rate-records/${rate_a_id}/tender-events"
              payload: { outcome: "ACCEPTED", load_reference: "LD-1001" }
              as: ProcurementAnalyst
              captures: { err_not_live: $.data.error_id }
          assert:
            - "HTTP 409 and data.error_id == \"ERR_RATE_RECORD_NOT_LIVE\""
            - "RateRecord.tender_count is still 0, rejection_count 0, rejection_pct 0.00 and acceptance_pct 100.00 — the defaults, untouched"
            - "GET /freight-procurement/rate-records/${rate_a_id}/tender-events returns total_count 0"
            - "the same append succeeds with 201 after go-live at clock 2026-09-01, yielding tender_count 1 and position_used \"PRIMARY\""

      - name: proposal_on_a_denied_mini_bid_returns_mini_bid_not_open
        claim_type: Precondition Enforcement
        grounds:
          - errors.ERR_MINI_BID_NOT_OPEN
          - state_machines.MiniBid.REQUESTED_to_DENIED
          - state_machines.MiniBid.REQUESTED_to_OPEN
        distinguishing_aspect: "DENIED is terminal, so a carrier proposal arriving inside a window that has already been denied is refused on state — even though the window is open at the clock and the carrier does hold an EXECUTED allocation on the lane."
        test_recipe:
          setup:
            - "CHAIN:AWARDED_CONTRACT + go-live: record ${rate_a_id} LIVE, allocation ACTIVE, clock 2026-09-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /freight-procurement/mini-bids"
              payload: { bid_event_id: "${event_id}", lane_id: "${lane_a_id}", rate_record_id: "${rate_a_id}", trigger_reason: "MARKET_INDEX", window_open_at: "2026-09-01T00:00:00Z", window_close_at: "2026-09-11T00:00:00Z" }
              as: CategoryManager
              captures: { mini_1_id: $.data.id }
            - call: "POST /freight-procurement/mini-bids/${mini_1_id}/deny"
              payload: { denial_reason: "Market index reversed; no adjustment warranted" }
              as: CategoryManager
          trigger:
            - call: "POST /freight-procurement/mini-bids/${mini_1_id}/proposal"
              payload: { carrier_id: "${carrier_a_id}", proposed_rate_per_mile: 2.1000 }
              as: CarrierRep
              as_user_id: "${carrier_a_id}"
              captures: { err_not_open: $.data.error_id }
          assert:
            - "the mini-bid was created with 201, data.status == \"REQUESTED\", data.origin == \"MANUAL\", data.proposed_rate_per_mile null and data.adjustment_pct null"
            - "the deny returned 200 with data.status == \"DENIED\" and data.denial_reason == \"Market index reversed; no adjustment warranted\""
            - "the proposal returns HTTP 409 with data.error_id == \"ERR_MINI_BID_NOT_OPEN\""
            - "MiniBid.proposed_rate_per_mile, proposed_by_carrier_id and adjustment_pct are all still null — nothing was written on the refused proposal"
            - "RateRecord ${rate_a_id} is still \"LIVE\" and Contract.total_committed_value_usd is still 1267629.99"

      - name: revert_of_a_mini_bid_that_was_never_applied_returns_mini_bid_not_applied
        claim_type: Precondition Enforcement
        grounds:
          - errors.ERR_MINI_BID_NOT_APPLIED
          - state_machines.MiniBid.APPLIED_to_REVERTED
          - validations.priority_9_state
        distinguishing_aspect: "The compensating transition is only defined for a mini-bid that actually moved money; reverting a REQUESTED one must be refused rather than silently running a compensation whose applied_rate_record_id is null."
        test_recipe:
          setup:
            - "CHAIN:AWARDED_CONTRACT + go-live, then one REQUESTED mini-bid on L-1147 for the window [2026-09-01, 2026-09-11] (no proposal, no apply)."
          setup_api_calls:
            - call: "POST /freight-procurement/mini-bids"
              payload: { bid_event_id: "${event_id}", lane_id: "${lane_a_id}", rate_record_id: "${rate_a_id}", trigger_reason: "MARKET_INDEX", window_open_at: "2026-09-01T00:00:00Z", window_close_at: "2026-09-11T00:00:00Z" }
              as: CategoryManager
              captures: { mini_1_id: $.data.id }
          trigger:
            - call: "POST /freight-procurement/mini-bids/${mini_1_id}/revert"
              payload: { revert_reason: "Requested in error" }
              as: ContractAdmin
              captures: { err_not_applied: $.data.error_id }
          assert:
            - "HTTP 409 and data.error_id == \"ERR_MINI_BID_NOT_APPLIED\""
            - "MiniBid.status is still \"REQUESTED\" with applied_rate_record_id null, applied_at null, reverted_at null and revert_reason null"
            - "Contract.amendment_count is still 0, Contract.status is still \"EXECUTED\" and total_committed_value_usd is still 1267629.99 — the compensating links did not fire"
            - "RateRecord ${rate_a_id} is still \"LIVE\" with superseded_by_rate_record_id null"

      - name: bid_event_reopens_a_second_negotiation_round_after_closing_the_first
        claim_type: Valid Transition
        grounds:
          - state_machines.BidEvent.ROUND_CLOSED_to_ROUND_OPEN
          - entities.BidRound.fields.round_no
        excluded_because:
          difficulty_instance: bid_event_negotiation_round_cycle
          rationale: "The cyclic-shape corner (ROUND_CLOSED -> ROUND_OPEN, round_no incrementing, and ERR_ROUND_LIMIT_EXCEEDED once current_round_no would pass rounds_allowed) is already driven end-to-end by the §1.8 non_linear_state_machine instance, including the multi-round target_reduction_pct interaction."

      - name: contract_signature_and_rate_load_dimensions_are_independent
        claim_type: Valid Transition
        grounds:
          - state_machines.Contract.signature_status_PENDING_BOTH_to_PENDING_CARRIER
          - state_machines.Contract.rate_load_status_NOT_STAGED_to_STAGED
        excluded_because:
          difficulty_instance: contract_signature_and_rate_load_dimensions_advance_independently
          rationale: "The parallel-shape corner — staging and loading rates while signatures are still outstanding, then completing signatures in either order — is the whole subject of that §1.8 instance, which also pins the LOADED -> LIVE gate on FULLY_SIGNED."

      - name: award_cascade_propagates_from_allocation_to_contract
        claim_type: Side Effect Execution
        grounds:
          - state_machines.BidEvent.AWARDING_to_AWARDED
          - state_machines.AwardAllocation.APPROVED_to_EXECUTED
          - state_machines.Lane.LOCKED_to_AWARDED
        excluded_because:
          difficulty_instance: award_commit_five_link_cascade
          rationale: "The cascade-down / ledger-sync corner (event AWARDED -> allocation EXECUTED -> lane bid AWARDED_PRIMARY -> lane AWARDED with awarded_coverage_pct -> contract minted) is asserted link by link, with ordering sensitivity, by that §1.8 transitive_cascade instance."

      - name: tender_rejection_threshold_suspends_routing_and_mints_a_system_mini_bid
        claim_type: Side Effect Execution
        grounds:
          - state_machines.RateRecord.LIVE_to_AT_RISK
          - state_machines.AwardAllocation.ACTIVE_to_SUSPENDED_ROUTING
          - state_machines.Lane.AWARDED_to_UNDER_REBID
        excluded_because:
          difficulty_instance: tender_rejection_three_link_risk_cascade
          rationale: "The conditional-cascade corner — the cascade fires only when tender_count >= MIN_TENDER_SAMPLE AND rejection_pct >= AT_RISK_REJECTION_PCT, and unwinds when a later acceptance drops the ratio back below the threshold — is exactly that §1.8 instance."

      - name: scorecard_publication_bubbles_up_into_carrier_standing
        claim_type: Side Effect Execution
        grounds:
          - state_machines.Scorecard.DRAFT_to_PUBLISHED
          - state_machines.Carrier.QUALIFIED_to_WATCHLIST
          - calculations.carrier_composite_score
        excluded_because:
          difficulty_instance: scorecard_publication_three_link_watchlist_cascade
          rationale: "The bubble-up corner (published count -> recomputed composite with a possible variant switch -> QUALIFIED/WATCHLIST flip) is the §1.8 transitive_cascade instance, which also covers the WATCHLIST -> QUALIFIED recovery direction."

      - name: mini_bid_revert_compensates_every_side_effect_of_the_apply
        claim_type: Side Effect Execution
        grounds:
          - state_machines.MiniBid.APPLIED_to_REVERTED
          - state_machines.RateRecord.SUPERSEDED_to_LIVE
          - state_machines.Contract.status_EXECUTED_to_AMENDED
        excluded_because:
          difficulty_instance: contract_money_conservation_across_mini_bid_apply_and_revert
          rationale: "The compensation corner — replacement record ROLLED_BACK, target record restored to LIVE with superseded_by_rate_record_id null, amendment_count back to 0 and the contract value back to its pre-apply figure with no drift — is that §1.8 compensating_invariant instance."

      - name: invitation_acceptance_is_guarded_on_the_carriers_standing
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Invitation.SENT_to_ACCEPTED
          - errors.ERR_CARRIER_NOT_QUALIFIED
          - errors.ERR_CARRIER_SUSPENDED
        excluded_because:
          difficulty_instance: invitation_creation_gated_on_carrier_qualification_state
          rationale: "The guarded-transition corner across the Carrier -> Invitation boundary (REGISTERED, SCREENING, SUSPENDED and WATCHLIST carriers each refused with their own error while QUALIFIED and CONDITIONALLY_QUALIFIED pass) is that §1.8 cross_entity_state_dependency instance."

      - name: go_live_is_guarded_on_the_contract_signature_dimension
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.RateRecord.LOADED_to_LIVE
          - errors.ERR_CONTRACT_NOT_FULLY_SIGNED
        excluded_because:
          difficulty_instance: rate_go_live_gated_on_contract_signature_state
          rationale: "The second guarded transition — go-live refused with ERR_CONTRACT_NOT_FULLY_SIGNED at PENDING_BOTH and at PENDING_SHIPPER, then allowed the moment the countersignature lands — is that §1.8 cross_entity_state_dependency instance."

  - section: calculations
    instances:
      - name: objective_score_is_a_ratio_of_sums_across_two_unequally_sized_lanes
        claim_type: Correct Result
        grounds:
          - calculations.optimization_objective_score
          - calculations.lane_evaluated_cost
          - calculations.award_allocation_waterfall
        distinguishing_aspect: "Two lanes whose volumes differ by more than 4x make the ratio of sums and the mean of per-lane ratios disagree, so the pinned aggregation order is observable in the objective score rather than hidden behind equal weights."
        test_recipe:
          setup:
            - "CHAIN:AWARDED_CONTRACT stages S1-S6 for ALFL, then an event E2 created with cost_basis FORECAST, fuel_index_per_mile 0.4800, accessorial_inflation_factor 1.15, rate_floor_per_mile 1.5000, rounds_allowed 1, weights 0.55/0.20/0.15/0.10, diversity_min_pct 0.00, max_award_share_pct 100.00, max_carriers_per_lane 1."
            - "Two lanes: L-1147 (1147 mi, annual 550, trailing 480, accessorial 137.55, service_days 3, incumbent ALFL @ 2.4000 -> baseline 1589692.50) and L-0600 (600 mi, annual 120, trailing 120, accessorial 90.00, service_days 2, incumbent ALFL @ 2.1000 -> baseline 162000.00). Both validated and locked; ALFL invited and accepted; round 1 open."
          setup_api_calls:
            - call: "POST /freight-procurement/bid-rounds/${round_id}/lane-bids"
              payload: { lane_id: "${lane_a_id}", carrier_id: "${carrier_a_id}", rate_per_mile: 2.0000, fuel_surcharge_included: true, committed_volume_loads: 600, transit_days_offered: 3 }
              as: CarrierRep
              as_user_id: "${carrier_a_id}"
            - call: "POST /freight-procurement/bid-rounds/${round_id}/lane-bids"
              payload: { lane_id: "${lane_b_id}", carrier_id: "${carrier_a_id}", rate_per_mile: 1.9000, fuel_surcharge_included: true, committed_volume_loads: 150, transit_days_offered: 2 }
              as: CarrierRep
              as_user_id: "${carrier_a_id}"
            - call: "POST /freight-procurement/bid-rounds/${round_id}/close"
              payload: {}
              as: ProcurementAnalyst
            - call: "GET /freight-procurement/bid-events/${event_id}"
              payload: {}
              as: ProcurementAnalyst
              captures: { event_v: $.data.version }
          trigger:
            - call: "POST /freight-procurement/optimization-runs"
              payload: { bid_event_id: "${event_id}", expected_bid_event_version: "${event_v}", scenario_label: "RATIO_OF_SUMS", max_carriers_per_lane: 1, diversity_min_pct: 0.00, min_capacity_coverage_pct: 0.00 }
              as: ProcurementAnalyst
          assert:
            - "HTTP 201, data.status == \"COMPLETED\", data.proposed_primary_count == 2, data.proposed_backup_count == 0, data.infeasible_lane_ids == []"
            - "L-1147 pick: cost_per_load 2452.18 (linehaul round(1147*2.0000, 2) == 2294.00 plus accessorial round(137.55*1.15, 2) == 158.18), grant min(550, 600, 550) == 550, allocated_cost_usd 1348699.00"
            - "L-0600 pick: cost_per_load 1243.50 (1140.00 + 103.50), grant min(120, 150, 120) == 120, allocated_cost_usd 149220.00"
            - "data.total_cost_usd == 1497919.00 and data.coverage_pct == 100.00 ((550 + 120) of 670 scope loads)"
            - "data.diversity_pct == 0.00 — ALFL is classified NONE, so no allocated volume counts as diverse"
            - "data.objective_score == 41.09 == round(100.00 * (0.55*0.144873 + 0.20*0.906000 + 0.15*1.000000 + 0.10*0.000000), 2), where cost_ratio == round(1497919.00 / 1751692.50, 6) == 0.855127, service_ratio == 0.906000 (both lanes carried by a carrier scoring 90.60), the coverage term == 1.000000 and the diversity term == 0.000000"
            - "averaging the two per-lane cost ratios instead (1348699.00/1589692.50 and 149220.00/162000.00, mean 0.884758) would yield 39.46 — the ratio of sums is normative and the two disagree because L-1147 carries 4.58x the volume of L-0600"

      - name: event_baseline_excludes_lanes_flagged_no_incumbent_baseline_but_counts_their_volume
        claim_type: Input Set Filtering
        grounds:
          - calculations.bid_event_savings
          - calculations.lane_data_quality_flags
          - calculations.lane_baseline_cost
        distinguishing_aspect: "A lane with no incumbent is in scope for volume but out of scope for savings: total_scope_volume_loads must include it while baseline_cost_usd must not, which is the only way savings_pct stays honest on a lane that has no prior rate."
        test_recipe:
          setup:
            - "A DRAFT event E3 (cost_basis FORECAST, fuel 0.4800, inflation 1.15, floor 1.5000, weights 0.55/0.20/0.15/0.10) with two lanes: L-1147 with incumbent ALFL @ 2.4000, and L-0600 (600 mi, annual 120, trailing 120, accessorial 90.00, service_days 2) with NO incumbent_carrier_id and NO incumbent_rate_per_mile."
          setup_api_calls:
            - call: "POST /freight-procurement/lanes/${lane_a_id}/validate"
              payload: {}
              as: ProcurementAnalyst
            - call: "POST /freight-procurement/lanes/${lane_b_id}/validate"
              payload: {}
              as: ProcurementAnalyst
          trigger:
            - call: "POST /freight-procurement/bid-events/${event_id}/lock-lanes"
              payload: {}
              as: ProcurementAnalyst
          assert:
            - "L-1147 validated with data_quality_flags == [] and baseline_cost_usd == 1589692.50"
            - "L-0600 validated with data_quality_flags == [\"NO_INCUMBENT_BASELINE\"] and baseline_cost_usd == 0.00 — advisory, so validation still succeeded"
            - "HTTP 200 and data.status == \"LANES_LOCKED\""
            - "data.total_scope_volume_loads == 670 — both lanes count toward scope"
            - "data.baseline_cost_usd == 1589692.50, NOT 1589692.50 + 0.00 dressed up as a smaller denominator and NOT 1751692.50: the flagged lane is filtered out of the baseline sum entirely"
            - "data.savings_pct is still null (no contracts yet) and data.coverage_pct == 0.00"

      - name: waterfall_fills_primary_then_backup_and_grants_the_remainder_to_the_runner_up
        claim_type: Correct Result
        grounds:
          - calculations.award_allocation_waterfall
          - calculations.bid_cost_rank_score
          - calculations.optimization_objective_score
        distinguishing_aspect: "With two carriers on one lane and two seats, the cheaper bid must take PRIMARY for its full commitment and the runner-up must receive only the REMAINDER (250 of its 400 offered loads), not its own commitment — and the run's diversity term must read that remainder."
        test_recipe:
          setup:
            - "CHAIN:AWARDED_CONTRACT stages S1-S6 for ALFL (diversity NONE) plus the same S2-S6 sequence for a second carrier captured as ${carrier_b_id} (SCAC BFLX, diversity_classification MWBE, otherwise identical, so capability_score 88.00 and composite_score 90.60)."
            - "Event E4 created with max_carriers_per_lane 2, max_award_share_pct 100.00, diversity_min_pct 0.00, otherwise the S7 payload; single lane L-1147 validated and locked; both carriers invited and accepted; round 1 OPEN."
          setup_api_calls:
            - call: "POST /freight-procurement/bid-rounds/${round_id}/lane-bids"
              payload: { lane_id: "${lane_a_id}", carrier_id: "${carrier_a_id}", rate_per_mile: 2.1152, fuel_surcharge_included: true, committed_volume_loads: 300, transit_days_offered: 3 }
              as: CarrierRep
              as_user_id: "${carrier_a_id}"
            - call: "POST /freight-procurement/bid-rounds/${round_id}/lane-bids"
              payload: { lane_id: "${lane_a_id}", carrier_id: "${carrier_b_id}", rate_per_mile: 2.2000, fuel_surcharge_included: true, committed_volume_loads: 400, transit_days_offered: 3 }
              as: CarrierRep
              as_user_id: "${carrier_b_id}"
            - call: "POST /freight-procurement/bid-rounds/${round_id}/close"
              payload: {}
              as: ProcurementAnalyst
            - call: "GET /freight-procurement/bid-events/${event_id}"
              payload: {}
              as: ProcurementAnalyst
              captures: { event_v: $.data.version }
          trigger:
            - call: "POST /freight-procurement/optimization-runs"
              payload: { bid_event_id: "${event_id}", expected_bid_event_version: "${event_v}", scenario_label: "TWO_SEATS", max_carriers_per_lane: 2, diversity_min_pct: 0.00, min_capacity_coverage_pct: 0.00 }
              as: ProcurementAnalyst
          assert:
            - "ALFL bid: cost_per_load 2584.31 (2426.13 + 158.18), awardable min(300, round(550*1.20) == 660) == 300, evaluated_total 775293.00, cost_rank_score 736528.35 (5% service credit, capped)"
            - "BFLX bid: cost_per_load 2681.58 (2523.40 + 158.18), awardable min(400, 660) == 400, evaluated_total 1072632.00, cost_rank_score 1019000.40"
            - "HTTP 201 with data.proposed_primary_count == 1 and data.proposed_backup_count == 1"
            - "ALFL takes PRIMARY with allocated_volume_loads 300, allocated_pct 54.55, allocated_cost_usd 775293.00 — min(remaining 550, committed 300, share_cap 550)"
            - "BFLX takes BACKUP_1 with allocated_volume_loads 250, allocated_pct 45.45, allocated_cost_usd 670395.00 — min(remaining 250, committed 400, share_cap 550): the remainder, not the commitment"
            - "data.total_cost_usd == 1445688.00 and data.coverage_pct == 100.00"
            - "data.diversity_pct == 45.45 — only BFLX's 250 loads are MWBE, and the denominator is allocated volume (550), not lane volume"
            - "data.objective_score == 42.65 from cost_ratio round(1445688.00 / 1589692.50, 6) == 0.909414, service_ratio 0.906000, coverage 1.000000 and diversity 0.454500"
            - "Lane.unallocated_volume_loads is still 550 — both allocations are PROPOSED and reserve nothing"

      - name: waterfall_eligible_set_ignores_a_withdrawn_bid_even_when_it_was_the_cheapest
        claim_type: Input Set Filtering
        grounds:
          - calculations.award_allocation_waterfall
          - state_machines.LaneBid.SUBMITTED_to_WITHDRAWN
          - calculations.optimization_objective_score
        distinguishing_aspect: "The eligible set is restricted to SUBMITTED/SHORTLISTED bids of the most recent CLOSED round, so the withdrawn cheapest bid must not win, must not appear as a backup, and must not drag the objective score toward its own rate."
        test_recipe:
          setup:
            - "Identical to waterfall_fills_primary_then_backup_and_grants_the_remainder_to_the_runner_up up to and including both lane-bids, with ALFL's bid captured as ${bid_a_id} and BFLX's as ${bid_b_id}."
          setup_api_calls:
            - call: "POST /freight-procurement/lane-bids/${bid_a_id}/withdraw"
              payload: {}
              as: CarrierRep
              as_user_id: "${carrier_a_id}"
            - call: "POST /freight-procurement/bid-rounds/${round_id}/close"
              payload: {}
              as: ProcurementAnalyst
            - call: "GET /freight-procurement/bid-events/${event_id}"
              payload: {}
              as: ProcurementAnalyst
              captures: { event_v: $.data.version }
          trigger:
            - call: "POST /freight-procurement/optimization-runs"
              payload: { bid_event_id: "${event_id}", expected_bid_event_version: "${event_v}", scenario_label: "AFTER_WITHDRAWAL", max_carriers_per_lane: 2, diversity_min_pct: 0.00, min_capacity_coverage_pct: 0.00 }
              as: ProcurementAnalyst
          assert:
            - "HTTP 201, data.status == \"COMPLETED\", data.proposed_primary_count == 1, data.proposed_backup_count == 0"
            - "the single pick is BFLX at PRIMARY with allocated_volume_loads 400 == min(remaining 550, committed 400, share_cap 550), allocated_pct 72.73, allocated_cost_usd 1072632.00"
            - "no allocation references ${bid_a_id}; ALFL's bid is still \"WITHDRAWN\" and was NOT moved to SHORTLISTED or NOT_AWARDED by the run"
            - "data.total_cost_usd == 1072632.00, data.coverage_pct == 72.73, data.diversity_pct == 100.00 (all awarded volume is MWBE)"
            - "data.infeasible_lane_ids == [] — the lane produced a PRIMARY pick, so partial coverage is not infeasibility"

      - name: capability_result_fails_on_mode_coverage_even_when_the_score_clears_the_floor
        claim_type: Constants Applied
        grounds:
          - calculations.capability_screening_score
          - calculations.capability_screening_score.constants.CAPABILITY_PASS_FLOOR
          - state_machines.Carrier.SCREENING_to_CONDITIONALLY_QUALIFIED
        distinguishing_aspect: "The result is an AND of two conditions, and the caps hide the failure: an oversized fleet and over-limit insurance push the weighted score to 80.00 — above CAPABILITY_PASS_FLOOR 70.00 — while required_modes is still not a subset of service_modes, so the verdict must be FAIL."
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z. Carrier CFLT registered with service_modes [DRY_VAN] only, fleet_power_units 400, auto 1000000.00, cargo 250000.00, insurance expiry 2027-06-30."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProcurementAnalyst
            - call: "POST /freight-procurement/carriers"
              payload: { legal_name: "Coastline Fleet", scac_code: "CFLT", diversity_classification: "SMALL_BUSINESS", service_modes: ["DRY_VAN"], fleet_power_units: 400, auto_liability_limit_usd: 1000000.00, cargo_limit_usd: 250000.00, insurance_expiry_date: "2027-06-30T00:00:00Z" }
              as: ProcurementAnalyst
              captures: { carrier_c_id: $.data.id }
            - call: "POST /freight-procurement/carriers/${carrier_c_id}/qualification-reviews"
              payload: { required_modes: ["DRY_VAN", "REEFER"], min_auto_liability_usd: 1000000.00, min_cargo_usd: 100000.00 }
              as: ComplianceOfficer
              captures: { review_c_id: $.data.id }
            - call: "POST /freight-procurement/qualification-reviews/${review_c_id}/insurance-verification"
              payload: { verified_auto_liability_usd: 1000000.00, verified_cargo_usd: 250000.00, verified_expiry_date: "2027-06-30T00:00:00Z" }
              as: ComplianceOfficer
          trigger:
            - call: "POST /freight-procurement/qualification-reviews/${review_c_id}/capability-screening"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /freight-procurement/qualification-reviews/${review_c_id}/decision"
              payload: { outcome: "APPROVE_CONDITIONAL", decision_note: "DRY_VAN only; reefer capability to be added" }
              as: ComplianceOfficer
          assert:
            - "screening returns 200 with data.capability_score == 80.00: mode_coverage 50.00 (1 of 2 required modes) * 0.40 == 20.00, fleet_score min(100.00, round(400*100.00/200, 2) == 200.00) == 100.00 * 0.30 == 30.00, insurance_component round(50.00*min(1.0000, 1.0000) + 50.00*min(1.0000, 2.5000), 2) == 100.00 * 0.30 == 30.00"
            - "data.capability_result == \"FAIL\" even though 80.00 >= CAPABILITY_PASS_FLOOR 70.00 — the mode-subset condition failed"
            - "data.status == \"SCREENED\" and Carrier.capability_score == 80.00 (written on FAIL as well as PASS)"
            - "the APPROVE_CONDITIONAL decision returns 200, review status \"CONDITIONALLY_APPROVED\", Carrier.status \"CONDITIONALLY_QUALIFIED\""
            - "Carrier.composite_score == 89.00 == 0.70*90.00 provisional baseline + 0.20*80.00 capability + 0.10*100.00 insurance, with composite_score_variant \"PROVISIONAL_SCREENING\""
            - "an APPROVE decision on the same review would instead fail, because that edge requires capability_result == PASS"

      - name: scorecard_claims_subscore_clamps_at_zero_instead_of_going_negative
        claim_type: Correct Result
        grounds:
          - calculations.scorecard_period_score
          - calculations.scorecard_period_score.constants.CLAIMS_PENALTY_MULTIPLIER
          - calculations.carrier_composite_score
        distinguishing_aspect: "A claims_ratio of 0.1500 drives 100.00 - 150.00 below zero; the clamp must absorb the whole overshoot at 0.00 rather than letting a negative subscore eat into the on-time and acceptance components."
        test_recipe:
          setup:
            - "CHAIN:AWARDED_CONTRACT stages S1-S6 only: ALFL QUALIFIED, capability_score 88.00, composite_score 90.60, clock 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /freight-procurement/carriers/${carrier_a_id}/scorecards"
              payload: { period_start: "2026-05-01T00:00:00Z", period_end: "2026-08-01T00:00:00Z", on_time_pct: 92.00, claims_ratio: 0.1500 }
              as: CategoryManager
              captures: { sc_1_id: $.data.id }
          trigger:
            - call: "POST /freight-procurement/scorecards/${sc_1_id}/publish"
              payload: {}
              as: CategoryManager
          assert:
            - "the scorecard was created with data.composite_score == 76.40 == 0.45*92.00 + 0.35*100.00 + 0.20*max(0.00, round(100.00 - 0.1500*1000, 2)) == 41.40 + 35.00 + 0.00"
            - "an unclamped subscore of -50.00 would have produced 66.40, so the clamp is observable"
            - "data.tender_acceptance_pct == 100.00 and data.period_tender_count == 0 — no tenders in the window, so the declared default stands"
            - "HTTP 200 and data.status == \"PUBLISHED\" with published_at == \"2026-08-01T00:00:00Z\" (period_end == the clock satisfies period_end <= clock)"
            - "Carrier.composite_score == 81.08 == 0.70*76.40 + 0.20*88.00 + 0.10*100.00, composite_score_variant == \"FINAL_PERFORMANCE\", published_scorecard_count == 1"
            - "Carrier.status is still \"QUALIFIED\" — 81.08 >= WATCHLIST_FLOOR 75.00, so the third cascade link does not fire"

      - name: scorecard_tender_window_is_half_open_so_a_period_end_tender_is_excluded
        claim_type: Input Set Filtering
        grounds:
          - calculations.scorecard_period_score
          - entities.Scorecard.fields.period_tender_count
          - calculations.tender_acceptance_metrics
        distinguishing_aspect: "The tender filter is period_start <= tendered_at < period_end; a rejection stamped exactly at period_end must fall into the NEXT period, so the scorecard reads 100.00 acceptance while the rate record itself reads 50.00 rejection at the same instant."
        test_recipe:
          setup:
            - "CHAIN:AWARDED_CONTRACT + go-live: record ${rate_a_id} LIVE, clock 2026-09-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: ProcurementAnalyst
            - call: "POST /freight-procurement/rate-records/${rate_a_id}/tender-events"
              payload: { outcome: "ACCEPTED", load_reference: "LD-3001" }
              as: ProcurementAnalyst
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: ProcurementAnalyst
            - call: "POST /freight-procurement/rate-records/${rate_a_id}/tender-events"
              payload: { outcome: "REJECTED", load_reference: "LD-3002", reject_reason: "No power available" }
              as: ProcurementAnalyst
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-02T00:00:00Z" }
              as: ProcurementAnalyst
          trigger:
            - call: "POST /freight-procurement/carriers/${carrier_a_id}/scorecards"
              payload: { period_start: "2026-09-01T00:00:00Z", period_end: "2026-10-01T00:00:00Z", on_time_pct: 90.00, claims_ratio: 0.010 }
              as: CategoryManager
          assert:
            - "HTTP 201, data.period_tender_count == 1 — the 2026-09-15 acceptance is inside [period_start, period_end), the 2026-10-01 rejection is not"
            - "data.tender_acceptance_pct == 100.00, NOT 50.00: the boundary tender belongs to the next period"
            - "data.composite_score == 93.50 == 0.45*90.00 + 0.35*100.00 + 0.20*max(0.00, 100.00 - 0.010*1000) == 40.50 + 35.00 + 18.00"
            - "at the same moment GET /freight-procurement/rate-records/${rate_a_id} shows tender_count 2, rejection_count 1, rejection_pct 50.00, acceptance_pct 50.00 — the record's own metrics have no period filter"
            - "the record is still \"LIVE\": tender_count 2 < MIN_TENDER_SAMPLE 5, so 50.00 >= AT_RISK_REJECTION_PCT does not fire the cascade"
            - "publishing this scorecard sets Carrier.composite_score to 93.05 == 0.70*93.50 + 0.20*88.00 + 0.10*100.00 (insurance expiry 2027-06-30 is more than INSURANCE_HEADROOM_DAYS 90 beyond the clock)"

      - name: tender_rejection_pct_rounds_one_of_three_to_two_decimals
        claim_type: Precision
        grounds:
          - calculations.tender_acceptance_metrics
          - entities.RateRecord.fields.rejection_pct
          - calculations.tender_acceptance_metrics.constants.MIN_TENDER_SAMPLE
        distinguishing_aspect: "One rejection in three tenders is the repeating-decimal case: rejection_pct must be 33.33 and acceptance_pct must be 66.67 (100.00 minus the ROUNDED rejection, so the pair sums to exactly 100.00), and the minimum-sample gate must still hold the record at LIVE."
        test_recipe:
          setup:
            - "CHAIN:AWARDED_CONTRACT + go-live: record ${rate_a_id} LIVE, clock 2026-09-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /freight-procurement/rate-records/${rate_a_id}/tender-events"
              payload: { outcome: "ACCEPTED", load_reference: "LD-4001" }
              as: ProcurementAnalyst
            - call: "POST /freight-procurement/rate-records/${rate_a_id}/tender-events"
              payload: { outcome: "REJECTED", load_reference: "LD-4002", reject_reason: "Driver shortage" }
              as: ProcurementAnalyst
          trigger:
            - call: "POST /freight-procurement/rate-records/${rate_a_id}/tender-events"
              payload: { outcome: "ACCEPTED", load_reference: "LD-4003" }
              as: ProcurementAnalyst
          assert:
            - "HTTP 201 with data.position_used == \"PRIMARY\" and data.tendered_at == \"2026-09-01T00:00:00Z\""
            - "GET /freight-procurement/rate-records/${rate_a_id} shows tender_count 3, rejection_count 1, rejection_pct 33.33 and acceptance_pct 66.67"
            - "acceptance_pct is round(100.00 - 33.33, 2) == 66.67, not round(2*100.00/3, 2) == 66.67 by coincidence — after the second tender the pair was 50.00 / 50.00, and after the first it was 0.00 / 100.00"
            - "the record is still \"LIVE\" and the AwardAllocation is still \"ACTIVE\": tender_count 3 < MIN_TENDER_SAMPLE 5 even though 33.33 >= AT_RISK_REJECTION_PCT 20.00"
            - "no MiniBid was created — GET /freight-procurement/mini-bids with lane_id filter returns total_count 0"

      - name: accessorial_outlier_flag_uses_the_rounded_ceiling_and_a_strict_comparison
        claim_type: Precision
        grounds:
          - calculations.lane_data_quality_flags
          - calculations.lane_data_quality_flags.constants.ACCESSORIAL_OUTLIER_RATIO
          - calculations.lane_baseline_cost
        distinguishing_aspect: "Two lanes one cent apart straddle the ceiling round(2752.80 * 0.1, 2) == 275.28: at exactly the ceiling the comparison is strictly greater, so no flag is emitted, and one cent above it the flag appears — while both lanes still validate because the flag is advisory."
        test_recipe:
          setup:
            - "A DRAFT event E5 (cost_basis FORECAST, fuel 0.4800, inflation 1.15, floor 1.5000, weights 0.55/0.20/0.15/0.10) and a qualified ALFL used only as the incumbent."
            - "Two lanes, identical except for the accessorial: L-EXACT with accessorial_history_usd_per_load 275.28 and L-OVER with 275.29; both 1147 mi, annual 550, trailing 480, service_days 3, incumbent ALFL @ 2.4000, seasonality left at its default."
          setup_api_calls:
            - call: "POST /freight-procurement/bid-events/${event_id}/lanes"
              payload: { lane_code: "L-EXACT", origin_zip3: "300", dest_zip3: "606", equipment_type: "DRY_VAN", mileage: 1147, annual_volume_loads: 550, service_days_required: 3, accessorial_history_usd_per_load: 275.28, trailing_12m_actual_loads: 480, incumbent_carrier_id: "${carrier_a_id}", incumbent_rate_per_mile: 2.4000 }
              as: ProcurementAnalyst
              captures: { lane_exact_id: $.data.id }
            - call: "POST /freight-procurement/bid-events/${event_id}/lanes"
              payload: { lane_code: "L-OVER", origin_zip3: "300", dest_zip3: "606", equipment_type: "DRY_VAN", mileage: 1147, annual_volume_loads: 550, service_days_required: 3, accessorial_history_usd_per_load: 275.29, trailing_12m_actual_loads: 480, incumbent_carrier_id: "${carrier_a_id}", incumbent_rate_per_mile: 2.4000 }
              as: ProcurementAnalyst
              captures: { lane_over_id: $.data.id }
          trigger:
            - call: "POST /freight-procurement/lanes/${lane_exact_id}/validate"
              payload: {}
              as: ProcurementAnalyst
            - call: "POST /freight-procurement/lanes/${lane_over_id}/validate"
              payload: {}
              as: ProcurementAnalyst
          assert:
            - "L-EXACT: HTTP 200, data.status == \"VALIDATED\", data.data_quality_flags == [] — 275.28 > 275.28 is false"
            - "L-EXACT baseline_cost_usd == 1665444.00 == round((2752.80 + 275.28) * 550, 2), unallocated_volume_loads == 550, validated_at == the clock"
            - "L-OVER: HTTP 200, data.status == \"VALIDATED\", data.data_quality_flags == [\"ACCESSORIAL_OUTLIER\"] — one cent above the ceiling"
            - "L-OVER baseline_cost_usd == 1665449.50 == round((2752.80 + 275.29) * 550, 2)"
            - "neither validate call raised ERR_LANE_DATA_QUALITY_BLOCKED: ACCESSORIAL_OUTLIER is advisory, and the blocking set is only {MILEAGE_IMPLAUSIBLE, MISSING_TRAILING_VOLUME}"
            - "the event's total_scope_volume_loads and baseline_cost_usd count both lanes once locked (1100 loads, 3330893.50) — the outlier flag does not exclude the lane, only NO_INCUMBENT_BASELINE does"

      - name: mini_bid_adjustment_cap_admits_exactly_twelve_percent_and_refuses_twelve_and_a_half
        claim_type: Constants Applied
        grounds:
          - calculations.minibid_market_delta
          - calculations.minibid_market_delta.constants.MINIBID_MAX_ADJUSTMENT_PCT
          - errors.ERR_ADJUSTMENT_EXCEEDS_CAP
        distinguishing_aspect: "The cap is on the absolute rounded adjustment, evaluated against the CURRENT record rate: 2.2400 against 2.0000 is exactly 12.00 and must pass, 2.2500 is 12.50 and must be refused with a fiscal 422 — and the refusal must leave the mini-bid in REQUESTED so the carrier can re-propose."
        test_recipe:
          setup:
            - "CHAIN:AWARDED_CONTRACT + go-live: record ${rate_a_id} LIVE at rate_per_mile 2.0000, allocation ACTIVE, clock 2026-09-01T00:00:00Z."
            - "One REQUESTED MiniBid ${mini_1_id} on L-1147 targeting ${rate_a_id}, window [2026-09-01, 2026-09-11], trigger_reason MARKET_INDEX."
          setup_api_calls:
            - call: "POST /freight-procurement/mini-bids"
              payload: { bid_event_id: "${event_id}", lane_id: "${lane_a_id}", rate_record_id: "${rate_a_id}", trigger_reason: "MARKET_INDEX", window_open_at: "2026-09-01T00:00:00Z", window_close_at: "2026-09-11T00:00:00Z" }
              as: CategoryManager
              captures: { mini_1_id: $.data.id }
          trigger:
            - call: "POST /freight-procurement/mini-bids/${mini_1_id}/proposal"
              payload: { carrier_id: "${carrier_a_id}", proposed_rate_per_mile: 2.2500 }
              as: CarrierRep
              as_user_id: "${carrier_a_id}"
              captures: { err_cap: $.data.error_id }
            - call: "POST /freight-procurement/mini-bids/${mini_1_id}/proposal"
              payload: { carrier_id: "${carrier_a_id}", proposed_rate_per_mile: 2.2400 }
              as: CarrierRep
              as_user_id: "${carrier_a_id}"
          assert:
            - "the 2.2500 proposal returns HTTP 422 with data.error_id == \"ERR_ADJUSTMENT_EXCEEDS_CAP\" — round((2.2500 - 2.0000)*100.00/2.0000, 2) == 12.50 > 12.00"
            - "after the refusal MiniBid.status is still \"REQUESTED\" with proposed_rate_per_mile, proposed_by_carrier_id and adjustment_pct all null"
            - "the 2.2400 proposal returns HTTP 200 with data.status == \"OPEN\", data.adjustment_pct == 12.00 (equal to the cap, and abs() <= cap admits it), data.proposed_rate_per_mile == 2.2400, data.proposed_by_carrier_id == \"${carrier_a_id}\""
            - "the adjustment is measured against RateRecord.rate_per_mile 2.0000, not against the original bid or the contract's average rate"
            - "RateRecord ${rate_a_id} is still \"LIVE\" and Contract.total_committed_value_usd is still 1267629.99 — a proposal moves no money until apply"

      - name: lane_evaluated_cost_diverges_between_forecast_and_historical_basis
        claim_type: Variant Divergence
        grounds:
          - calculations.lane_evaluated_cost
          - entities.BidEvent.fields.cost_basis
        excluded_because:
          difficulty_instance: lane_evaluated_cost_forecast_versus_historical_basis
          rationale: "The §1.8 dual_variant_calc instance already runs identical bid data through both cost bases and pins the differing accessorial term, volume basis, awardable_volume_loads and evaluated_total_cost_usd, plus the resulting rank flip."

      - name: lane_evaluated_cost_rounds_each_term_before_summing
        claim_type: Precision
        grounds:
          - calculations.lane_evaluated_cost
          - entities.LaneBid.fields.cost_per_load_usd
        excluded_because:
          difficulty_instance: lane_evaluated_cost_pinned_rounding_order
          rationale: "The §1.8 combinatorial_formula instance pins the round-then-add order with a bid whose round-once-at-the-end result differs by a cent per load and by 6.00 on the evaluated total; repeating it here would add nothing."

      - name: carrier_composite_selects_the_variant_from_the_published_scorecard_count
        claim_type: Variant Selection
        grounds:
          - calculations.carrier_composite_score
          - calculations.carrier_composite_score.constants.FINAL_VARIANT_MIN_SCORECARDS
        excluded_because:
          difficulty_instance: carrier_composite_provisional_versus_final_performance
          rationale: "That §1.8 dual_variant_calc instance walks the carrier from PROVISIONAL_SCREENING (baseline 90.00) into FINAL_PERFORMANCE on the first publication and on to the three-scorecard recency blend, asserting the variant field at each step."

      - name: carrier_composite_reconciles_when_the_variant_switches
        claim_type: Reconciliation
        grounds:
          - calculations.carrier_composite_score
          - calculations.carrier_composite_score.constants.RECENCY_WEIGHTS
        excluded_because:
          difficulty_instance: carrier_composite_provisional_versus_final_performance
          rationale: "The same §1.8 instance asserts the recomputed composite immediately after the switch (0.70 * the recency-weighted blend over the truncated weight_sum) and the WATCHLIST consequence, which is the reconciliation this row asks for."

      - name: contract_value_tiers_are_keyed_on_base_then_on_subtotal
        claim_type: Constants Applied
        grounds:
          - calculations.contract_committed_value
          - calculations.contract_committed_value.constants.ALLOWANCE_TIERS
        excluded_because:
          difficulty_instance: contract_committed_value_pinned_tier_evaluation_order
          rationale: "The §1.8 combinatorial_formula instance already contrasts the normative order (discount tier on base, allowance tier and amount on the post-discount subtotal) against the plausible wrong order, with both totals computed."

  - section: validations
    instances:
      - name: bid_below_the_event_rate_floor_returns_rate_below_floor
        claim_type: Violation → Error
        grounds:
          - validations.priority_17_business_fiscal
          - errors.ERR_RATE_BELOW_FLOOR
          - entities.BidEvent.fields.rate_floor_per_mile
        distinguishing_aspect: "The floor is a fiscal rule (422), not a state or shape rule, and it is measured on the submitted rate_per_mile before any fuel adjustment — a bid one hundredth below the floor must be refused with nothing written."
        test_recipe:
          setup:
            - "CHAIN:AWARDED_CONTRACT stages S1-S10 as far as the bid round create (round ${round_id} OPEN, no bids yet); the event's rate_floor_per_mile is 1.5000."
          setup_api_calls:
            - call: "GET /freight-procurement/bid-rounds/${round_id}"
              payload: {}
              as: ProcurementAnalyst
          trigger:
            - call: "POST /freight-procurement/bid-rounds/${round_id}/lane-bids"
              payload: { lane_id: "${lane_a_id}", carrier_id: "${carrier_a_id}", rate_per_mile: 1.4900, fuel_surcharge_included: true, committed_volume_loads: 600, transit_days_offered: 3 }
              as: CarrierRep
              as_user_id: "${carrier_a_id}"
              captures: { err_below_floor: $.data.error_id }
          assert:
            - "HTTP 422 and data.error_id == \"ERR_RATE_BELOW_FLOOR\""
            - "no LaneBid row was created: GET /freight-procurement/lane-bids with bid_round_id filter returns total_count 0"
            - "BidRound.submitted_bid_count is still 0 and lowest_rate_per_mile is still null"
            - "a bid at 1.4900 with fuel_surcharge_included false is refused identically — the floor reads the submitted rate, not the fuel-adjusted effective rate 1.9700"

      - name: bid_exactly_at_the_rate_floor_is_accepted_and_priced
        claim_type: Satisfaction → Pass
        grounds:
          - validations.priority_17_business_fiscal
          - calculations.lane_evaluated_cost
          - entities.LaneBid.fields.cost_per_load_usd
        distinguishing_aspect: "The floor comparison is >=, so the boundary value itself must pass and be priced normally — the same call that fails one hundredth lower succeeds here and produces the full evaluated cost set."
        test_recipe:
          setup:
            - "CHAIN:AWARDED_CONTRACT stages S1-S10 as far as the bid round create (round ${round_id} OPEN, no bids yet); rate_floor_per_mile 1.5000, accessorial_inflation_factor 1.15."
          setup_api_calls:
            - call: "GET /freight-procurement/bid-rounds/${round_id}"
              payload: {}
              as: ProcurementAnalyst
          trigger:
            - call: "POST /freight-procurement/bid-rounds/${round_id}/lane-bids"
              payload: { lane_id: "${lane_a_id}", carrier_id: "${carrier_a_id}", rate_per_mile: 1.5000, fuel_surcharge_included: true, committed_volume_loads: 600, transit_days_offered: 3 }
              as: CarrierRep
              as_user_id: "${carrier_a_id}"
          assert:
            - "HTTP 201 and data.status == \"SUBMITTED\" with data.rate_per_mile == 1.5000"
            - "data.linehaul_per_load_usd == 1720.50, data.accessorial_per_load_usd == 158.18, data.cost_per_load_usd == 1878.68"
            - "data.awardable_volume_loads == 600 == min(600, round(550*1.20) == 660) and data.evaluated_total_cost_usd == 1127208.00, data.evaluated_basis == \"FORECAST\""
            - "BidRound.submitted_bid_count == 1 and lowest_rate_per_mile == 1.5000"
            - "data.cost_rank_score and data.rank_in_lane are still null — ranking is written when the round closes, not at submission"

      - name: transit_days_beyond_the_lane_requirement_is_rejected
        claim_type: Violation → Error
        grounds:
          - validations.priority_15_business_constraint
          - errors.ERR_TRANSIT_DAYS_EXCEEDED
          - entities.Lane.fields.service_days_required
        distinguishing_aspect: "Service capability is enforced at submission rather than left for the optimizer to filter: a fourth transit day on a three-day lane is refused with a structural 409 even though the rate would have won the lane outright."
        test_recipe:
          setup:
            - "CHAIN:AWARDED_CONTRACT stages S1-S10 as far as the bid round create; L-1147 has service_days_required 3."
          setup_api_calls:
            - call: "GET /freight-procurement/lanes/${lane_a_id}"
              payload: {}
              as: ProcurementAnalyst
          trigger:
            - call: "POST /freight-procurement/bid-rounds/${round_id}/lane-bids"
              payload: { lane_id: "${lane_a_id}", carrier_id: "${carrier_a_id}", rate_per_mile: 1.6000, fuel_surcharge_included: true, committed_volume_loads: 600, transit_days_offered: 4 }
              as: CarrierRep
              as_user_id: "${carrier_a_id}"
              captures: { err_transit: $.data.error_id }
          assert:
            - "HTTP 409 and data.error_id == \"ERR_TRANSIT_DAYS_EXCEEDED\""
            - "the same payload with transit_days_offered 3 returns 201, so the refusal is only about the transit field"
            - "no LaneBid row exists for the round and BidRound.submitted_bid_count is still 0"

      - name: nda_gate_applies_only_when_the_invitation_requires_it
        claim_type: Violation → Error
        grounds:
          - validations.priority_15_business_constraint
          - errors.ERR_NDA_NOT_SIGNED
          - state_machines.Invitation.SENT_to_ACCEPTED
        distinguishing_aspect: "This is a conditional rule keyed on the invitation's own nda_required flag: the identical accept payload must be refused on an NDA invitation and succeed on a non-NDA one, and the flag lives on the invitation rather than on the carrier or the event."
        test_recipe:
          setup:
            - "CHAIN:AWARDED_CONTRACT stages S1-S8 (ALFL QUALIFIED, lanes locked), plus the same S2-S6 qualification sequence for a second carrier ${carrier_b_id} (SCAC BFLX)."
          setup_api_calls:
            - call: "POST /freight-procurement/bid-events/${event_id}/invitations"
              payload: { carrier_id: "${carrier_a_id}", nda_required: true }
              as: ProcurementAnalyst
              captures: { invite_nda_id: $.data.id }
            - call: "POST /freight-procurement/bid-events/${event_id}/invitations"
              payload: { carrier_id: "${carrier_b_id}", nda_required: false }
              as: ProcurementAnalyst
              captures: { invite_plain_id: $.data.id }
          trigger:
            - call: "POST /freight-procurement/invitations/${invite_nda_id}/response"
              payload: { accept: true }
              as: CarrierRep
              as_user_id: "${carrier_a_id}"
              captures: { err_nda: $.data.error_id }
            - call: "POST /freight-procurement/invitations/${invite_plain_id}/response"
              payload: { accept: true }
              as: CarrierRep
              as_user_id: "${carrier_b_id}"
            - call: "POST /freight-procurement/invitations/${invite_nda_id}/response"
              payload: { accept: true, nda_signed: true }
              as: CarrierRep
              as_user_id: "${carrier_a_id}"
          assert:
            - "the first accept returns HTTP 409 with data.error_id == \"ERR_NDA_NOT_SIGNED\" — nda_signed absent counts as false"
            - "after that refusal the invitation is still \"SENT\" and BidEvent.accepted_invitation_count is still 0"
            - "the BFLX accept with the identical payload returns 200 with data.status == \"ACCEPTED\" and data.nda_signed == false, because that invitation carries nda_required false"
            - "the retried ALFL accept with nda_signed true returns 200 with data.status == \"ACCEPTED\" and data.nda_signed == true"
            - "BidEvent.accepted_invitation_count == 2 and invited_carrier_count == 2 after both acceptances"

      - name: lane_with_blocking_data_quality_flags_cannot_be_validated
        claim_type: Violation → Error
        grounds:
          - validations.priority_11_business_safety
          - errors.ERR_LANE_DATA_QUALITY_BLOCKED
          - calculations.lane_data_quality_flags
        distinguishing_aspect: "Only two of the six flags block, and the blocking check runs on the freshly computed flag list, so the lane must stay DRAFT with its computed fields untouched — a rejected validation writes nothing at all, not even the flags it just computed."
        test_recipe:
          setup:
            - "A DRAFT event E6 (fuel 0.4800, inflation 1.15, floor 1.5000, weights 0.55/0.20/0.15/0.10) with one lane L-BAD: mileage 3500 (above MAX_LANE_MILES 3200), trailing_12m_actual_loads 0, annual 550, accessorial 137.55, service_days 3, no incumbent."
          setup_api_calls:
            - call: "POST /freight-procurement/bid-events/${event_id}/lanes"
              payload: { lane_code: "L-BAD", origin_zip3: "300", dest_zip3: "902", equipment_type: "DRY_VAN", mileage: 3500, annual_volume_loads: 550, service_days_required: 3, accessorial_history_usd_per_load: 137.55, trailing_12m_actual_loads: 0 }
              as: ProcurementAnalyst
              captures: { lane_bad_id: $.data.id }
          trigger:
            - call: "POST /freight-procurement/lanes/${lane_bad_id}/validate"
              payload: {}
              as: ProcurementAnalyst
              captures: { err_blocked: $.data.error_id }
          assert:
            - "HTTP 409 and data.error_id == \"ERR_LANE_DATA_QUALITY_BLOCKED\" — the computed flag list is [MILEAGE_IMPLAUSIBLE, MISSING_TRAILING_VOLUME, NO_INCUMBENT_BASELINE] and its intersection with the blocking set is non-empty"
            - "Lane.status is still \"DRAFT\" with data_quality_flags == [] (the default), baseline_cost_usd null, unallocated_volume_loads null and validated_at null — the refused transition applied none of its side effects"
            - "POST /freight-procurement/bid-events/${event_id}/lock-lanes now returns ERR_LANE_NOT_VALIDATED, so a blocked lane also blocks the event"
            - "a sibling lane with mileage 1147 and trailing_12m_actual_loads 480 validates with flags [\"NO_INCUMBENT_BASELINE\"] only — the advisory flag alone never blocks"

      - name: forbidden_role_is_reported_before_an_unknown_path_id
        claim_type: Priority Ordering
        grounds:
          - validations.priority_2_auth
          - validations.priority_3_existence
          - errors.ERR_FORBIDDEN_ROLE
        distinguishing_aspect: "Two rules are violated at once — the role is not on the endpoint's list and the carrier in the path does not exist — and the priority-2 answer must win so that a caller without permission cannot probe which ids exist."
        test_recipe:
          setup:
            - "Empty database with the clock at 2026-08-01T00:00:00Z; no carrier with id 00000000-0000-4000-8000-000000000000 exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProcurementAnalyst
          trigger:
            - call: "POST /freight-procurement/carriers/00000000-0000-4000-8000-000000000000/qualification-reviews"
              payload: { required_modes: ["DRY_VAN"] }
              as: CarrierRep
              as_user_id: "carrier-rep-001"
              captures: { err_forbidden: $.data.error_id }
          assert:
            - "HTTP 403 and data.error_id == \"ERR_FORBIDDEN_ROLE\" — NOT 404 ERR_CARRIER_NOT_FOUND"
            - "the same call as ComplianceOfficer (a listed role) returns 404 with data.error_id == \"ERR_CARRIER_NOT_FOUND\", proving the id really is unknown"
            - "a call with the X-User-Role header omitted entirely returns 401 ERR_UNAUTHENTICATED, which outranks both"

      - name: path_existence_outranks_body_shape_which_outranks_body_foreign_keys
        claim_type: Priority Ordering
        grounds:
          - validations.priority_3_existence
          - validations.priority_4_existence
          - validations.priority_5_existence
        distinguishing_aspect: "Three adjacent priorities are separated in one walk: an unknown path parent hides a malformed body, a malformed body hides an unresolvable body foreign key, and only when both are clean does the body FK error surface."
        test_recipe:
          setup:
            - "A DRAFT event ${event_id} exists (CHAIN:AWARDED_CONTRACT stage S7) and carrier ALFL ${carrier_a_id} exists; the id 00000000-0000-4000-8000-000000000000 belongs to nothing."
          setup_api_calls:
            - call: "GET /freight-procurement/bid-events/${event_id}"
              payload: {}
              as: ProcurementAnalyst
          trigger:
            - call: "POST /freight-procurement/bid-events/00000000-0000-4000-8000-000000000000/lanes"
              payload: { lane_code: "L-X", origin_zip3: "300", dest_zip3: "606", equipment_type: "SPACESHIP", mileage: 1147, annual_volume_loads: 550, service_days_required: 3, accessorial_history_usd_per_load: 137.55 }
              as: ProcurementAnalyst
              captures: { err_parent_missing: $.data.error_id }
            - call: "POST /freight-procurement/bid-events/${event_id}/lanes"
              payload: { lane_code: "L-X", origin_zip3: "300", dest_zip3: "606", equipment_type: "SPACESHIP", mileage: 1147, annual_volume_loads: 550, service_days_required: 3, accessorial_history_usd_per_load: 137.55, incumbent_carrier_id: "00000000-0000-4000-8000-000000000000", incumbent_rate_per_mile: 2.4000 }
              as: ProcurementAnalyst
              captures: { err_bad_enum: $.data.error_id }
            - call: "POST /freight-procurement/bid-events/${event_id}/lanes"
              payload: { lane_code: "L-X", origin_zip3: "300", dest_zip3: "606", equipment_type: "DRY_VAN", mileage: 1147, annual_volume_loads: 550, service_days_required: 3, accessorial_history_usd_per_load: 137.55, incumbent_carrier_id: "00000000-0000-4000-8000-000000000000", incumbent_rate_per_mile: 2.4000 }
              as: ProcurementAnalyst
              captures: { err_fk_missing: $.data.error_id }
          assert:
            - "call 1 returns HTTP 404 with data.error_id == \"ERR_BID_EVENT_NOT_FOUND\" — the undeclared equipment_type never gets evaluated"
            - "call 2 returns HTTP 400 with data.error_id == \"ERR_INVALID_REQUEST\" — the bad enum outranks the unresolvable incumbent_carrier_id"
            - "call 3 returns HTTP 404 with data.error_id == \"ERR_CARRIER_NOT_FOUND\" — with the shape clean, the body foreign key is finally checked"
            - "no Lane row was created by any of the three calls and BidEvent.lane_count is still 0"

      - name: carrier_invitation_existence_is_checked_before_its_acceptance_status
        claim_type: Priority Ordering
        grounds:
          - validations.priority_12_business_referential
          - errors.ERR_CARRIER_NOT_INVITED
          - errors.ERR_INVITATION_NOT_ACCEPTED
        distinguishing_aspect: "One priority level holds two cascading checks in a fixed order: no invitation at all is a different answer from an invitation that exists but was never accepted, and the second check may only run once the first has passed."
        test_recipe:
          setup:
            - "CHAIN:AWARDED_CONTRACT stages S1-S8 for ALFL plus the same S2-S6 qualification sequence for ${carrier_b_id} (SCAC BFLX) and ${carrier_c_id} (SCAC CFLT)."
            - "ALFL and BFLX are invited (nda_required false); ALFL accepts, BFLX never responds (still SENT); CFLT is never invited. Round 1 is then opened and is OPEN."
          setup_api_calls:
            - call: "GET /freight-procurement/invitations"
              payload: { bid_event_id: "${event_id}" }
              as: ProcurementAnalyst
          trigger:
            - call: "POST /freight-procurement/bid-rounds/${round_id}/lane-bids"
              payload: { lane_id: "${lane_a_id}", carrier_id: "${carrier_c_id}", rate_per_mile: 1.9000, fuel_surcharge_included: true, committed_volume_loads: 300, transit_days_offered: 3 }
              as: CarrierRep
              as_user_id: "${carrier_c_id}"
              captures: { err_not_invited: $.data.error_id }
            - call: "POST /freight-procurement/bid-rounds/${round_id}/lane-bids"
              payload: { lane_id: "${lane_a_id}", carrier_id: "${carrier_b_id}", rate_per_mile: 1.9000, fuel_surcharge_included: true, committed_volume_loads: 300, transit_days_offered: 3 }
              as: CarrierRep
              as_user_id: "${carrier_b_id}"
              captures: { err_not_accepted: $.data.error_id }
          assert:
            - "the CFLT bid returns HTTP 409 with data.error_id == \"ERR_CARRIER_NOT_INVITED\" — no Invitation row for (event, CFLT)"
            - "the BFLX bid returns HTTP 409 with data.error_id == \"ERR_INVITATION_NOT_ACCEPTED\" — the row exists but is still SENT"
            - "both refusals leave BidRound.submitted_bid_count and lowest_rate_per_mile untouched, and no LaneBid rows exist for either carrier"
            - "BidEvent.accepted_invitation_count is still 1 (only ALFL) and invited_carrier_count is 2"
            - "the identical payload from ALFL, whose invitation is ACCEPTED, returns 201"

      - name: closed_round_state_outranks_the_rate_floor
        claim_type: Priority Ordering
        grounds:
          - validations.priority_9_state
          - validations.priority_17_business_fiscal
        excluded_because:
          difficulty_instance: closed_round_state_beats_rate_below_floor
          rationale: "That §1.8 priority_pair_validation_conflict instance already submits a below-floor bid into a CLOSED round and pins ERR_ROUND_NOT_OPEN over ERR_RATE_BELOW_FLOOR, then separates the two by fixing one violation at a time."

      - name: uninvited_carrier_outranks_a_lane_outside_the_event_scope
        claim_type: Priority Ordering
        grounds:
          - validations.priority_12_business_referential
          - validations.priority_15_business_constraint
        excluded_because:
          difficulty_instance: carrier_not_invited_beats_lane_out_of_event_scope
          rationale: "That §1.8 instance bids a foreign event's lane as an uninvited carrier and pins ERR_CARRIER_NOT_INVITED over ERR_LANE_NOT_IN_EVENT_SCOPE, including the single-violation control cases."

      - name: suspended_carrier_outranks_a_rate_interval_overlap
        claim_type: Priority Ordering
        grounds:
          - validations.priority_10_business_safety
          - validations.priority_14_business_temporal
        excluded_because:
          difficulty_instance: carrier_suspended_beats_rate_interval_overlap
          rationale: "That §1.8 instance loads a second overlapping rate record for a carrier suspended in the meantime and pins ERR_CARRIER_SUSPENDED over ERR_RATE_INTERVAL_OVERLAP."

      - name: overlapping_rate_intervals_are_rejected_while_adjacent_ones_are_not
        claim_type: Violation → Error
        grounds:
          - validations.priority_14_business_temporal
          - errors.ERR_RATE_INTERVAL_OVERLAP
        excluded_because:
          difficulty_instance: rate_record_half_open_interval_overlap_and_adjacency
          rationale: "The §1.8 resource_temporal_overlap instance covers the whole half-open story — one-second overlap refused, touching endpoints accepted, and the (lane, carrier, routing_position) scoping that lets a BACKUP_1 record share the window."

      - name: mini_bid_windows_respect_conflict_cooldown_and_the_rolling_quota
        claim_type: Violation → Error
        grounds:
          - validations.priority_14_business_temporal
          - validations.priority_16_business_constraint
          - errors.ERR_MINI_BID_QUOTA_EXCEEDED
        excluded_because:
          difficulty_instance: mini_bid_closed_window_conflict_cooldown_and_rolling_quota
          rationale: "That §1.8 resource_temporal_overlap instance walks five mini-bid windows across ERR_MINI_BID_WINDOW_CONFLICT, ERR_MINI_BID_COOLDOWN_ACTIVE and ERR_MINI_BID_QUOTA_EXCEEDED, which also discharges the aggregate-validation row for this section."

  - section: endpoints
    instances:
      - name: lane_listing_combines_event_filter_status_filter_and_offset_paging
        claim_type: Standard CRUD
        grounds:
          - endpoints.GET_/freight-procurement/lanes
          - entities.Lane.fields.status
        distinguishing_aspect: "Filtering and paging are applied together and in the right order: the filters shrink the population first, so total_count and has_more describe the filtered set and not the whole table, and the same offset walk over two different filters returns disjoint pages."
        test_recipe:
          setup:
            - "Two DRAFT events E-A and E-B. E-A holds four lanes L-A1..L-A4 (all DRY_VAN, mileage 1147, annual 550, service_days 3, accessorial 137.55, trailing 480); L-A1 and L-A2 are validated (VALIDATED), L-A3 and L-A4 are left DRAFT. E-B holds one REEFER lane L-B1 (validated)."
          setup_api_calls:
            - call: "GET /freight-procurement/lanes"
              payload: { bid_event_id: "${event_a_id}" }
              as: ProcurementAnalyst
          trigger:
            - call: "GET /freight-procurement/lanes"
              payload: { bid_event_id: "${event_a_id}", status: "VALIDATED", limit: 1, offset: 0 }
              as: ProcurementAnalyst
              captures: { first_page_lane: "$.data[0].id" }
            - call: "GET /freight-procurement/lanes"
              payload: { bid_event_id: "${event_a_id}", status: "VALIDATED", limit: 1, offset: 1 }
              as: CategoryManager
            - call: "GET /freight-procurement/lanes"
              payload: { equipment_type: "REEFER" }
              as: ProcurementAnalyst
          assert:
            - "the setup listing returns total_count 4 and has_more false — E-B's lane is excluded by bid_event_id"
            - "page 1 returns exactly one item, total_count 2 and has_more true; page 2 returns one item, total_count 2 and has_more false, and its id differs from ${first_page_lane}"
            - "the two returned ids are L-A1 and L-A2 in some stable order; neither DRAFT lane appears under status VALIDATED"
            - "the REEFER listing returns total_count 1 (L-B1 only), showing equipment_type filters independently of bid_event_id"
            - "an offset past the end (limit 1, offset 5) returns an empty data array with total_count 2 and has_more false, not a 404"

      - name: closing_a_round_writes_ranks_once_and_refuses_a_replay
        claim_type: Action endpoint
        grounds:
          - endpoints.POST_/freight-procurement/bid-rounds/{id}/close
          - state_machines.BidRound.OPEN_to_CLOSED
          - errors.ERR_ROUND_NOT_OPEN
        distinguishing_aspect: "The close action is where ranking is materialised — before it every bid's rank_in_lane is null and after it every SUBMITTED bid carries a rank — and the second close must be refused without re-ranking or re-flipping the event."
        test_recipe:
          setup:
            - "CHAIN:AWARDED_CONTRACT stages S1-S10 with two invited carriers bidding L-1147 (1147 mi, annual 550, accessorial 137.55, inflation 1.15): ALFL at 2.1152 fuel-included with 300 loads / 3 days and BFLX at 2.2000 fuel-included with 250 loads / 3 days. Round ${round_id} is OPEN and both bids are SUBMITTED."
          setup_api_calls:
            - call: "GET /freight-procurement/lane-bids"
              payload: { bid_round_id: "${round_id}" }
              as: ProcurementAnalyst
          trigger:
            - call: "POST /freight-procurement/bid-rounds/${round_id}/close"
              payload: {}
              as: ProcurementAnalyst
            - call: "POST /freight-procurement/bid-rounds/${round_id}/close"
              payload: {}
              as: ProcurementAnalyst
              captures: { err_closed: $.data.error_id }
          assert:
            - "before the close both bids have rank_in_lane null and cost_rank_score null"
            - "the first close returns 200 with data.status == \"CLOSED\" and closed_at == the logical clock 2026-08-01T00:00:00Z"
            - "after it ALFL's bid has cost_rank_score 736528.35 and rank_in_lane 1, BFLX's has 1019000.40 and rank_in_lane 2 — the credit uses the carriers' composite scores, so the cheaper rate also wins the rank here"
            - "BidEvent.status flipped ROUND_OPEN -> ROUND_CLOSED in the same request"
            - "the second close returns HTTP 409 ERR_ROUND_NOT_OPEN and neither the ranks, closed_at nor BidEvent.status change"

      - name: a_second_optimization_run_supersedes_the_first_and_credits_every_volume_back
        claim_type: Bulk action
        grounds:
          - endpoints.POST_/freight-procurement/optimization-runs
          - state_machines.BidEvent.AWARDING_to_OPTIMIZING
          - calculations.award_allocation_waterfall
        distinguishing_aspect: "One call rewrites a whole population: every prior COMPLETED or PUBLISHED run, every PROPOSED or APPROVED allocation beneath them, and the lane volume ledger. The credit-back is conditional per row — only allocations that had actually been approved return volume — so the ledger must land exactly back on the pre-approval number rather than double-crediting."
        test_recipe:
          setup:
            - "CHAIN:AWARDED_CONTRACT through S11 up to and including the CategoryManager approval of the PRIMARY allocation, but NOT the award call. Two bids exist as in the two-carrier scenario: PRIMARY ALFL 300 loads and BACKUP_1 BFLX 250 loads; only the PRIMARY allocation was approved, so Lane.unallocated_volume_loads is 250 and BidEvent.status is AWARDING."
          setup_api_calls:
            - call: "GET /freight-procurement/bid-events/${event_id}"
              payload: {}
              as: ProcurementAnalyst
              captures: { event_v2: $.data.version }
          trigger:
            - call: "POST /freight-procurement/optimization-runs"
              payload: { bid_event_id: "${event_id}", expected_bid_event_version: "${event_v2}", scenario_label: "REOPTIMIZE_AFTER_REJECTS", max_carriers_per_lane: 2, diversity_min_pct: 0.00, min_capacity_coverage_pct: 50.00 }
              as: ProcurementAnalyst
              captures: { run2_id: $.data.id }
          assert:
            - "HTTP 201 and data.status == \"COMPLETED\"; BidEvent.status moved AWARDING -> OPTIMIZING"
            - "the first run is now \"SUPERSEDED\" and GET /freight-procurement/award-allocations with optimization_run_id set to the first run shows both of its rows in status \"SUPERSEDED\" — the APPROVED one and the untouched PROPOSED one alike"
            - "Lane.unallocated_volume_loads is back to 550 and Lane.awarded_coverage_pct back to 0.00: exactly the 300 loads debited at approval were credited, and the never-approved BACKUP_1 row credited nothing"
            - "BidEvent.coverage_pct and diversity_pct are back to 0.00 because no allocation remains in {APPROVED, EXECUTED, ACTIVE}"
            - "the new run recomputes the waterfall from the same closed round and produces fresh PROPOSED rows only after its own routing-guide publish — immediately after creation GET /freight-procurement/award-allocations with optimization_run_id ${run2_id} returns total_count 0"
            - "replaying the identical call with the now-stale ${event_v2} returns 412 ERR_STALE_BID_EVENT_VERSION, so the bulk supersede cannot run twice on one version"

      - name: staging_a_rate_record_links_contract_lane_carrier_and_allocation
        claim_type: Cross-reference link
        grounds:
          - endpoints.POST_/freight-procurement/contracts/{id}/rate-records
          - entities.RateRecord.fields.award_allocation_id
          - errors.ERR_AWARD_ALLOCATION_NOT_FOUND
        distinguishing_aspect: "This is the only four-way link in the system: the record is created under a contract while separately naming the lane, the carrier and the award allocation it implements, and each of those references is resolved before anything is written."
        test_recipe:
          setup:
            - "CHAIN:AWARDED_CONTRACT through S12 up to but NOT including the rate-record create: contract ${contract_a_id} exists in DRAFT with rate_record_count 0, rate_load_status NOT_STAGED and committed_value_usd null; allocation ${alloc_a_id} is EXECUTED for lane ${lane_a_id} / carrier ${carrier_a_id} with 550 loads."
          setup_api_calls:
            - call: "GET /freight-procurement/contracts"
              payload: { bid_event_id: "${event_id}" }
              as: ContractAdmin
          trigger:
            - call: "POST /freight-procurement/contracts/${contract_a_id}/rate-records"
              payload: { lane_id: "${lane_a_id}", carrier_id: "${carrier_a_id}", award_allocation_id: "00000000-0000-4000-8000-000000000000", routing_position: "PRIMARY", rate_per_mile: 2.0000, fuel_surcharge_included: true, effective_from: "2026-09-01T00:00:00Z", effective_to: "2027-09-01T00:00:00Z", committed_volume_loads: 550 }
              as: ContractAdmin
              captures: { err_alloc_missing: $.data.error_id }
            - call: "POST /freight-procurement/contracts/${contract_a_id}/rate-records"
              payload: { lane_id: "${lane_a_id}", carrier_id: "${carrier_a_id}", award_allocation_id: "${alloc_a_id}", routing_position: "PRIMARY", rate_per_mile: 2.0000, fuel_surcharge_included: true, effective_from: "2026-09-01T00:00:00Z", effective_to: "2027-09-01T00:00:00Z", committed_volume_loads: 550 }
              as: ContractAdmin
              captures: { rate_a_id: $.data.id }
          assert:
            - "the first call returns HTTP 404 with data.error_id == \"ERR_AWARD_ALLOCATION_NOT_FOUND\" and the contract is untouched: rate_record_count still 0, rate_load_status still \"NOT_STAGED\""
            - "the second call returns 201 with data.status == \"STAGED\" and every reference echoed back (contract_id, lane_id, carrier_id, award_allocation_id, routing_position PRIMARY)"
            - "Contract.rate_record_count == 1, rate_load_status == \"STAGED\" and committed_value_usd == 1267629.99 — the link write also drives the contract money recomputation"
            - "Contract.version incremented by exactly 1 across the two calls (the refused one did not bump it)"
            - "the record is reachable both ways: GET /freight-procurement/rate-records with award_allocation_id ${alloc_a_id} returns it, and so does the same list filtered by contract_id"

      - name: carrier_read_reflects_the_commitments_derived_from_its_executed_awards
        claim_type: Computed read
        grounds:
          - endpoints.GET_/freight-procurement/carriers/{id}
          - entities.Carrier.fields.committed_volume_loads
          - entities.Carrier.fields.active_primary_lane_count
        distinguishing_aspect: "The carrier row is a read-only rollup of things that happened three entities away: it must show nothing at qualification time, the committed volume after the award cascade, and the primary-lane count only once a rate actually went live."
        test_recipe:
          setup:
            - "CHAIN:AWARDED_CONTRACT + go-live, with the observation points taken before the award and after the go-live."
          setup_api_calls:
            - call: "GET /freight-procurement/carriers/${carrier_a_id}"
              payload: {}
              as: CategoryManager
          trigger:
            - call: "GET /freight-procurement/carriers/${carrier_a_id}"
              payload: {}
              as: CarrierRep
              as_user_id: "${carrier_a_id}"
          assert:
            - "read before the award (the setup call, taken right after qualification): committed_volume_loads == 0 and active_primary_lane_count == 0 with composite_score 90.60"
            - "read after the award cascade but before go-live: committed_volume_loads == 550 and active_primary_lane_count == 0 — link 5 counts commitments, not live routings"
            - "read after go-live: committed_volume_loads == 550 and active_primary_lane_count == 1"
            - "composite_score is still 90.60 in all three reads — awarding volume never moves the qualification score"
            - "the CarrierRep sees the identical numbers for its own carrier; requesting a different carrier's row is still allowed on this read endpoint because all five roles are listed on it"

      - name: go_live_is_refused_before_the_effective_window_opens
        claim_type: Conditional action
        grounds:
          - endpoints.POST_/freight-procurement/rate-records/{id}/go-live
          - errors.ERR_RATE_NOT_IN_EFFECTIVE_WINDOW
          - entities.RateRecord.fields.effective_from
        distinguishing_aspect: "The window test is against the logical clock rather than the request order, and it is half-open: one second before effective_from the same call fails, exactly at effective_from it succeeds, and the refusal leaves the record LOADED so the retry after a clock advance is the only difference."
        test_recipe:
          setup:
            - "CHAIN:AWARDED_CONTRACT (clock 2026-08-01T00:00:00Z, record ${rate_a_id} LOADED, effective window 2026-09-01T00:00:00Z -> 2027-09-01T00:00:00Z)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-31T23:59:59Z" }
              as: ContractAdmin
          trigger:
            - call: "POST /freight-procurement/rate-records/${rate_a_id}/go-live"
              payload: {}
              as: ContractAdmin
              captures: { err_window: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ContractAdmin
            - call: "POST /freight-procurement/rate-records/${rate_a_id}/go-live"
              payload: {}
              as: ContractAdmin
          assert:
            - "the first go-live returns HTTP 409 with data.error_id == \"ERR_RATE_NOT_IN_EFFECTIVE_WINDOW\""
            - "after the refusal RateRecord.status is still \"LOADED\", live_at null, AwardAllocation still \"EXECUTED\" and BidEvent still \"AWARDED\" — none of the five go-live side effects leaked"
            - "the retry at exactly 2026-09-01T00:00:00Z returns 200 with data.status == \"LIVE\" and live_at == 2026-09-01T00:00:00Z, proving the lower bound is inclusive"
            - "that success also flips AwardAllocation EXECUTED -> ACTIVE, Contract.rate_load_status -> \"LIVE\" and BidEvent AWARDED -> \"LIVE\""
            - "with the clock set to 2027-09-01T00:00:00Z instead, a LOADED record is refused with the same error — the upper bound is exclusive"

      - name: publishing_a_routing_guide_creates_the_proposed_allocation_set
        claim_type: Action endpoint
        grounds:
          - endpoints.POST_/freight-procurement/optimization-runs/{id}/routing-guide
        excluded_because:
          difficulty_instance: award_commit_five_link_cascade
          rationale: "The §1.8 transitive_cascade instance already pins the publish action's full effect set — PROPOSED rows per waterfall position, SHORTLISTED/NOT_AWARDED bid flips, run PUBLISHED and BidEvent OPTIMIZING -> AWARDING — before continuing into the five-link award cascade."

      - name: appending_a_tender_event_recomputes_the_acceptance_metrics
        claim_type: Computed read
        grounds:
          - endpoints.GET_/freight-procurement/rate-records/{id}/tender-events
        excluded_because:
          difficulty_instance: tender_rejection_pct_exactly_at_threshold_with_minimum_sample
          rationale: "The §1.8 boundary_precision_check instance walks the tender log one event at a time and reads the recomputed acceptance and rejection percentages plus the sample-size gate at each step, which covers this endpoint's derived read."

  - section: errors
    instances:
      - name: every_not_found_id_is_reachable_on_its_own_entity
        claim_type: Not Found
        grounds:
          - validations.priority_3_existence
          - errors.ERR_CARRIER_NOT_FOUND
          - errors.ERR_QUALIFICATION_REVIEW_NOT_FOUND
          - errors.ERR_BID_EVENT_NOT_FOUND
          - errors.ERR_LANE_NOT_FOUND
          - errors.ERR_BID_ROUND_NOT_FOUND
          - errors.ERR_INVITATION_NOT_FOUND
          - errors.ERR_LANE_BID_NOT_FOUND
          - errors.ERR_OPTIMIZATION_RUN_NOT_FOUND
          - errors.ERR_AWARD_ALLOCATION_NOT_FOUND
          - errors.ERR_CONTRACT_NOT_FOUND
          - errors.ERR_RATE_RECORD_NOT_FOUND
          - errors.ERR_MINI_BID_NOT_FOUND
          - errors.ERR_SCORECARD_NOT_FOUND
        distinguishing_aspect: "Thirteen entity types each own a distinct 404 id, and a well-formed UUID that belongs to a different entity type must produce the id of the type named in the path segment — never a generic 404 and never the neighbouring entity's id."
        test_recipe:
          setup:
            - "CHAIN:AWARDED_CONTRACT so that at least one real row of each entity type exists; the probe id 00000000-0000-4000-8000-000000000000 belongs to nothing."
          setup_api_calls:
            - call: "GET /freight-procurement/carriers"
              payload: { limit: 5 }
              as: ProcurementAnalyst
          trigger:
            - call: "GET /freight-procurement/carriers/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ProcurementAnalyst
              captures: { e_carrier: $.data.error_id }
            - call: "POST /freight-procurement/qualification-reviews/00000000-0000-4000-8000-000000000000/capability-screening"
              payload: {}
              as: ComplianceOfficer
              captures: { e_review: $.data.error_id }
            - call: "GET /freight-procurement/bid-events/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ProcurementAnalyst
              captures: { e_event: $.data.error_id }
            - call: "GET /freight-procurement/lanes/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ProcurementAnalyst
              captures: { e_lane: $.data.error_id }
            - call: "GET /freight-procurement/bid-rounds/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ProcurementAnalyst
              captures: { e_round: $.data.error_id }
            - call: "GET /freight-procurement/invitations/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ProcurementAnalyst
              captures: { e_invitation: $.data.error_id }
            - call: "GET /freight-procurement/lane-bids/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ProcurementAnalyst
              captures: { e_bid: $.data.error_id }
            - call: "GET /freight-procurement/optimization-runs/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ProcurementAnalyst
              captures: { e_run: $.data.error_id }
            - call: "GET /freight-procurement/award-allocations/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: CategoryManager
              captures: { e_alloc: $.data.error_id }
            - call: "GET /freight-procurement/contracts/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ContractAdmin
              captures: { e_contract: $.data.error_id }
            - call: "GET /freight-procurement/rate-records/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ContractAdmin
              captures: { e_rate: $.data.error_id }
            - call: "GET /freight-procurement/mini-bids/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: CategoryManager
              captures: { e_mini: $.data.error_id }
            - call: "POST /freight-procurement/scorecards/00000000-0000-4000-8000-000000000000/publish"
              payload: {}
              as: CategoryManager
              captures: { e_scorecard: $.data.error_id }
          assert:
            - "all thirteen calls return HTTP 404"
            - "the error_ids are, in order, ERR_CARRIER_NOT_FOUND, ERR_QUALIFICATION_REVIEW_NOT_FOUND, ERR_BID_EVENT_NOT_FOUND, ERR_LANE_NOT_FOUND, ERR_BID_ROUND_NOT_FOUND, ERR_INVITATION_NOT_FOUND, ERR_LANE_BID_NOT_FOUND, ERR_OPTIMIZATION_RUN_NOT_FOUND, ERR_AWARD_ALLOCATION_NOT_FOUND, ERR_CONTRACT_NOT_FOUND, ERR_RATE_RECORD_NOT_FOUND, ERR_MINI_BID_NOT_FOUND, ERR_SCORECARD_NOT_FOUND"
            - "passing a real Lane id into GET /freight-procurement/rate-records/{id} still returns ERR_RATE_RECORD_NOT_FOUND — the id is looked up in the path segment's own table, not globally"
            - "list endpoints never 404 for an unknown filter value: GET /freight-procurement/lanes with bid_event_id 00000000-0000-4000-8000-000000000000 returns 200 with an empty data array"

      - name: malformed_bodies_are_all_reported_as_invalid_request
        claim_type: Type Constraints
        grounds:
          - validations.priority_4_existence
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "Undeclared enum members, inverted datetime intervals, out-of-range percentages and negative money all collapse to one 400 id at priority 4, which means they must be caught before any foreign key, state or fiscal rule gets a chance to answer."
        test_recipe:
          setup:
            - "A qualified carrier ALFL ${carrier_a_id} and a DRAFT event ${event_id} exist (CHAIN:AWARDED_CONTRACT stages S1-S7)."
          setup_api_calls:
            - call: "GET /freight-procurement/bid-events/${event_id}"
              payload: {}
              as: ProcurementAnalyst
          trigger:
            - call: "POST /freight-procurement/carriers/${carrier_a_id}/status-change"
              payload: { to_status: "PROBATION", reason: "not a declared status" }
              as: ComplianceOfficer
              captures: { e_enum: $.data.error_id }
            - call: "POST /freight-procurement/carriers/${carrier_a_id}/scorecards"
              payload: { period_start: "2026-10-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z", on_time_pct: 92.00, claims_ratio: 0.010 }
              as: CategoryManager
              captures: { e_interval: $.data.error_id }
            - call: "POST /freight-procurement/carriers/${carrier_a_id}/scorecards"
              payload: { period_start: "2026-09-01T00:00:00Z", period_end: "2026-10-01T00:00:00Z", on_time_pct: 101.00, claims_ratio: 0.010 }
              as: CategoryManager
              captures: { e_range: $.data.error_id }
            - call: "POST /freight-procurement/bid-events/${event_id}/lanes"
              payload: { lane_code: "L-NEG", origin_zip3: "300", dest_zip3: "606", equipment_type: "DRY_VAN", mileage: 1147, annual_volume_loads: 550, service_days_required: 3, accessorial_history_usd_per_load: -137.55 }
              as: ProcurementAnalyst
              captures: { e_negative: $.data.error_id }
          assert:
            - "all four calls return HTTP 400 with data.error_id == \"ERR_INVALID_REQUEST\""
            - "nothing was written: the carrier is still QUALIFIED, no Scorecard row exists and BidEvent.lane_count is still 0"
            - "the inverted-interval case is a 400 rather than the temporal 409 ERR_RATE_INTERVAL_OVERLAP — shape precedes business time"
            - "correcting only the offending field in each call makes it succeed, so no other rule was masking"

      - name: each_uniqueness_scope_reports_its_own_duplicate_error
        claim_type: Violation → Error
        grounds:
          - validations.priority_13_business_constraint
          - errors.ERR_DUPLICATE_SCAC
          - errors.ERR_DUPLICATE_LANE_CODE
          - errors.ERR_DUPLICATE_INVITATION
          - errors.ERR_DUPLICATE_LANE_BID
          - errors.ERR_DUPLICATE_LOAD_REFERENCE
        distinguishing_aspect: "Five different uniqueness scopes share one priority: SCAC is global, lane_code is per event, invitation is per (event, carrier), lane bid is per (round, lane, carrier) and load_reference is per rate record — so each must reject its own duplicate while the same value re-used in a different scope is accepted."
        test_recipe:
          setup:
            - "CHAIN:AWARDED_CONTRACT + go-live, plus a second DRAFT event ${event_b_id} created by the same analyst and one tender event already logged on ${rate_a_id} with load_reference \"LD-0001\"."
          setup_api_calls:
            - call: "GET /freight-procurement/carriers"
              payload: { limit: 5 }
              as: ProcurementAnalyst
          trigger:
            - call: "POST /freight-procurement/carriers"
              payload: { legal_name: "Atlantic Freight Lines Duplicate", scac_code: "ALFL", service_modes: ["DRY_VAN"], fleet_power_units: 120, auto_liability_limit_usd: 1000000.00, cargo_limit_usd: 250000.00, insurance_expiry_date: "2027-06-30T00:00:00Z" }
              as: ProcurementAnalyst
              captures: { e_scac: $.data.error_id }
            - call: "POST /freight-procurement/bid-events/${event_b_id}/lanes"
              payload: { lane_code: "L-1147", origin_zip3: "300", dest_zip3: "606", equipment_type: "DRY_VAN", mileage: 1147, annual_volume_loads: 550, service_days_required: 3, accessorial_history_usd_per_load: 137.55, trailing_12m_actual_loads: 480 }
              as: ProcurementAnalyst
            - call: "POST /freight-procurement/rate-records/${rate_a_id}/tender-events"
              payload: { outcome: "ACCEPTED", load_reference: "LD-0001" }
              as: ProcurementAnalyst
              captures: { e_load_ref: $.data.error_id }
          assert:
            - "the duplicate SCAC returns HTTP 409 with data.error_id == \"ERR_DUPLICATE_SCAC\" even though the legal_name differs — the SCAC is the global key"
            - "re-using lane_code L-1147 under a DIFFERENT event returns 201, because lane_code is unique per bid event; repeating it inside the original event returns 409 ERR_DUPLICATE_LANE_CODE"
            - "the repeated load_reference returns 409 ERR_DUPLICATE_LOAD_REFERENCE and TenderEvent count on the record stays 1, so the acceptance metrics do not move"
            - "inviting the already-invited ALFL to the same event a second time returns 409 ERR_DUPLICATE_INVITATION while inviting it to ${event_b_id} succeeds"
            - "a second bid by the same carrier on the same lane in the same round returns 409 ERR_DUPLICATE_LANE_BID; the same carrier bidding a different lane of that round succeeds"

      - name: unfit_carriers_are_blocked_by_the_specific_fitness_reason
        claim_type: Violation → Error
        grounds:
          - validations.priority_10_business_safety
          - errors.ERR_CARRIER_SUSPENDED
          - errors.ERR_CARRIER_INSURANCE_EXPIRED
          - errors.ERR_CARRIER_NOT_QUALIFIED
        distinguishing_aspect: "Three separate unfitness reasons live at one priority and must not be conflated: an administrative suspension, a lapsed insurance date measured against the logical clock, and a carrier that never reached a qualified status at all."
        test_recipe:
          setup:
            - "CHAIN:AWARDED_CONTRACT through S11 up to the PROPOSED allocation for ALFL (not yet approved), plus carrier ${carrier_d_id} (SCAC DFLT) left in REGISTERED with no qualification review."
          setup_api_calls:
            - call: "POST /freight-procurement/carriers/${carrier_a_id}/status-change"
              payload: { to_status: "SUSPENDED", reason: "operating authority under review" }
              as: ComplianceOfficer
          trigger:
            - call: "POST /freight-procurement/award-allocations/${alloc_a_id}/approve"
              payload: {}
              as: CategoryManager
              captures: { e_suspended: $.data.error_id }
            - call: "POST /freight-procurement/bid-events/${event_id}/invitations"
              payload: { carrier_id: "${carrier_d_id}", nda_required: false }
              as: ProcurementAnalyst
              captures: { e_not_qualified: $.data.error_id }
          assert:
            - "approving the suspended carrier's allocation returns HTTP 409 with data.error_id == \"ERR_CARRIER_SUSPENDED\"; the allocation is still PROPOSED and Lane.unallocated_volume_loads is unchanged"
            - "inviting the REGISTERED carrier returns 409 ERR_CARRIER_NOT_QUALIFIED and BidEvent.invited_carrier_count does not move"
            - "restoring the carrier to QUALIFIED and instead advancing the clock past its insurance_expiry_date makes the same approve call return 409 ERR_CARRIER_INSURANCE_EXPIRED — a different id for a different reason"
            - "with the carrier QUALIFIED and the clock before the expiry date, the approve call returns 200, so all three refusals were the fitness gate and nothing else"

      - name: round_and_remediation_counters_stop_at_their_declared_limits
        claim_type: Violation → Error
        grounds:
          - validations.priority_15_business_constraint
          - errors.ERR_ROUND_LIMIT_EXCEEDED
          - errors.ERR_REMEDIATION_LIMIT_EXCEEDED
          - calculations.capability_screening_score
        distinguishing_aspect: "Two counters cap two loops: rounds_allowed is per bid event and configurable, MAX_REMEDIATIONS is a fixed constant of 2, and in both cases the last permitted iteration must succeed and only the following one fail, with the counter frozen at the cap."
        test_recipe:
          setup:
            - "An event ${event_id} configured with rounds_allowed 2, lanes validated and locked, one accepted invitation. Separately, a qualification review ${review_id} whose capability screening scored below CAPABILITY_PASS_FLOOR 70.00, taken through two REMEDIATION decisions already (remediation_count == 2 == MAX_REMEDIATIONS), currently back in the SCREENED state."
          setup_api_calls:
            - call: "GET /freight-procurement/bid-events/${event_id}/bid-rounds"
              payload: {}
              as: ProcurementAnalyst
          trigger:
            - call: "POST /freight-procurement/bid-events/${event_id}/bid-rounds"
              payload: { incumbent_visibility: "RANK_ONLY", closes_at: "2026-08-20T00:00:00Z" }
              as: ProcurementAnalyst
              captures: { e_round_limit: $.data.error_id }
            - call: "POST /freight-procurement/qualification-reviews/${review_id}/decision"
              payload: { outcome: "REMEDIATION", decision_note: "third remediation attempt" }
              as: ComplianceOfficer
              captures: { e_remediation_limit: $.data.error_id }
          assert:
            - "rounds 1 and 2 opened and closed normally, so BidEvent.current_round_no == 2; the third open returns HTTP 409 with data.error_id == \"ERR_ROUND_LIMIT_EXCEEDED\" and current_round_no stays 2"
            - "the third REMEDIATION decision returns 409 ERR_REMEDIATION_LIMIT_EXCEEDED and QualificationReview.remediation_count stays 2 with the review still SCREENED"
            - "the same review can still be decided with outcome REJECT (or APPROVE), so only the remediation loop is capped and the review is not deadlocked"
            - "an event created with rounds_allowed 3 accepts a third round with the identical payload, confirming the cap is read from the event and not hard-coded"

      - name: portfolio_level_refusals_fire_at_publish_and_at_award
        claim_type: Violation → Error
        grounds:
          - validations.priority_18_business_fiscal
          - errors.ERR_COVERAGE_BELOW_MINIMUM
          - errors.ERR_NO_FEASIBLE_ALLOCATION
          - errors.ERR_DIVERSITY_MINIMUM_NOT_MET
        distinguishing_aspect: "Three 422s guard the portfolio at two different gates: coverage and feasibility are checked when the routing guide is published, diversity only at the final award, so each must be provoked at its own gate and must leave the run or the event exactly where it was."
        test_recipe:
          setup:
            - "Scenario A: an event with one locked lane of 550 loads whose single bid commits only 300 loads; the optimization run is created with min_capacity_coverage_pct 100.00, so run.coverage_pct is 54.55."
            - "Scenario B: an event whose round closed with zero submitted bids, so the run completed with status FAILED."
            - "Scenario C: the CHAIN event, but created with diversity_min_pct 50.00 while the only awarded carrier ALFL has diversity_classification NONE, taken to AWARDING with the PRIMARY allocation APPROVED."
          setup_api_calls:
            - call: "GET /freight-procurement/bid-events/${event_id}/optimization-runs"
              payload: {}
              as: ProcurementAnalyst
          trigger:
            - call: "POST /freight-procurement/optimization-runs/${run_a_id}/routing-guide"
              payload: {}
              as: ProcurementAnalyst
              captures: { e_coverage: $.data.error_id }
            - call: "POST /freight-procurement/optimization-runs/${run_b_id}/routing-guide"
              payload: {}
              as: ProcurementAnalyst
              captures: { e_infeasible: $.data.error_id }
            - call: "POST /freight-procurement/bid-events/${event_c_id}/award"
              payload: {}
              as: CategoryManager
              captures: { e_diversity: $.data.error_id }
          assert:
            - "scenario A returns HTTP 422 with data.error_id == \"ERR_COVERAGE_BELOW_MINIMUM\" (coverage_pct 54.55 < 100.00); the run stays COMPLETED, no AwardAllocation rows exist and BidEvent stays OPTIMIZING"
            - "scenario B returns 422 ERR_NO_FEASIBLE_ALLOCATION; the run stays FAILED and cannot be published by retrying"
            - "scenario C returns 422 ERR_DIVERSITY_MINIMUM_NOT_MET (diversity_pct 0.00 < 50.00); BidEvent stays AWARDING, the allocation stays APPROVED and no Contract row is created — the five-link cascade did not start"
            - "re-running scenario A's optimization with min_capacity_coverage_pct 50.00 publishes successfully, proving the threshold is the run's own parameter"
            - "in scenario C, awarding after a second diversity-classified carrier is added to the routing guide succeeds"

      - name: not_ready_state_guards_each_answer_with_their_own_id
        claim_type: Violation → Error
        grounds:
          - validations.priority_9_state
          - errors.ERR_LANE_NOT_VALIDATED
          - errors.ERR_LANES_NOT_LOCKED
          - errors.ERR_ROUND_STILL_OPEN
          - errors.ERR_CONTRACT_NOT_FULLY_SIGNED
          - errors.ERR_RATE_RECORD_NOT_LOADED
          - errors.ERR_RATE_RECORD_NOT_LIVE
          - errors.ERR_MINI_BID_NOT_OPEN
          - errors.ERR_MINI_BID_NOT_APPLIED
        distinguishing_aspect: "The priority-9 mapping is a table of pair-specific ids rather than one generic conflict: the same workflow, stopped one step earlier at each gate, must return eight different error ids, and the id names the missing precondition rather than the attempted action."
        test_recipe:
          setup:
            - "A single event walked forward one step at a time, pausing before each gate: lanes created but not validated; lanes validated but not locked; round OPEN; contract DRAFT with only the carrier signature; rate record STAGED; rate record LOADED; a DENIED mini-bid; and a never-applied OPEN mini-bid."
          setup_api_calls:
            - call: "GET /freight-procurement/bid-events/${event_id}"
              payload: {}
              as: ProcurementAnalyst
          trigger:
            - call: "POST /freight-procurement/bid-events/${event_id}/lock-lanes"
              payload: {}
              as: ProcurementAnalyst
              captures: { e_lane_unvalidated: $.data.error_id }
            - call: "POST /freight-procurement/bid-events/${event_id}/bid-rounds"
              payload: { incumbent_visibility: "RANK_ONLY", closes_at: "2026-08-20T00:00:00Z" }
              as: ProcurementAnalyst
              captures: { e_not_locked: $.data.error_id }
            - call: "POST /freight-procurement/optimization-runs"
              payload: { bid_event_id: "${event_id}", expected_bid_event_version: "${event_v}", scenario_label: "TOO_EARLY" }
              as: ProcurementAnalyst
              captures: { e_round_open: $.data.error_id }
            - call: "POST /freight-procurement/contracts/${contract_a_id}/rate-records"
              payload: { lane_id: "${lane_a_id}", carrier_id: "${carrier_a_id}", award_allocation_id: "${alloc_a_id}", routing_position: "PRIMARY", rate_per_mile: 2.0000, fuel_surcharge_included: true, effective_from: "2026-09-01T00:00:00Z", effective_to: "2027-09-01T00:00:00Z", committed_volume_loads: 550 }
              as: ContractAdmin
              captures: { e_unsigned: $.data.error_id }
            - call: "POST /freight-procurement/rate-records/${rate_a_id}/go-live"
              payload: {}
              as: ContractAdmin
              captures: { e_not_loaded: $.data.error_id }
            - call: "POST /freight-procurement/rate-records/${rate_a_id}/tender-events"
              payload: { outcome: "ACCEPTED", load_reference: "LD-EARLY" }
              as: ProcurementAnalyst
              captures: { e_not_live: $.data.error_id }
            - call: "POST /freight-procurement/mini-bids/${mini_denied_id}/proposal"
              payload: { carrier_id: "${carrier_a_id}", proposed_rate_per_mile: 2.1000 }
              as: CarrierRep
              as_user_id: "${carrier_a_id}"
              captures: { e_mini_not_open: $.data.error_id }
            - call: "POST /freight-procurement/mini-bids/${mini_open_id}/revert"
              payload: { revert_reason: "nothing to revert" }
              as: ContractAdmin
              captures: { e_mini_not_applied: $.data.error_id }
          assert:
            - "the eight calls return, in order, 409 ERR_LANE_NOT_VALIDATED, ERR_LANES_NOT_LOCKED, ERR_ROUND_STILL_OPEN, ERR_CONTRACT_NOT_FULLY_SIGNED, ERR_RATE_RECORD_NOT_LOADED, ERR_RATE_RECORD_NOT_LIVE, ERR_MINI_BID_NOT_OPEN and ERR_MINI_BID_NOT_APPLIED"
            - "no call mutated anything: lane_count, current_round_no, rate_record_count, RateRecord.status, MiniBid.status and every counter are unchanged after the eight refusals"
            - "each call succeeds once its own gate is satisfied, and the successful path never returns any of these ids"
            - "ERR_RATE_RECORD_NOT_LIVE also covers a mini-bid apply against a STAGED record, while an AT_RISK record accepts both tender events and mini-bid applies"

      - name: an_over_concentrated_award_share_is_refused_at_award_time
        claim_type: Violation → Error
        grounds:
          - validations.priority_18_business_fiscal
          - errors.ERR_AWARD_SHARE_EXCEEDED
        excluded_because:
          difficulty_instance: award_share_cap_floor_at_exact_half_load_boundary
          rationale: "The §1.8 boundary_precision_check instance sits exactly on the max_award_share_pct boundary with a half-load rounding case and separates the accepted share from the refused one; it is the only place the cap can be provoked because the waterfall floors allocations to the cap before proposing them."

  - section: rbac
    instances:
      - name: each_role_exclusive_operation_is_closed_to_the_other_four_roles
        claim_type: exclusive_operations
        grounds:
          - validations.priority_2_auth
          - errors.ERR_FORBIDDEN_ROLE
          - roles.ProcurementAnalyst.exclusive_operations
          - roles.ComplianceOfficer.exclusive_operations
          - roles.CategoryManager.exclusive_operations
          - roles.ContractAdmin.exclusive_operations
        distinguishing_aspect: "The five roles are peers, not a hierarchy: no role is a superset of another, so the analyst who built the event still cannot approve an allocation and the category manager who awards it still cannot load a rate."
        test_recipe:
          setup:
            - "CHAIN:AWARDED_CONTRACT paused at each relevant gate, so every operation below is legitimately available to its owning role at the moment it is attempted."
          setup_api_calls:
            - call: "GET /freight-procurement/bid-events/${event_id}"
              payload: {}
              as: ProcurementAnalyst
          trigger:
            - call: "POST /freight-procurement/award-allocations/${alloc_a_id}/approve"
              payload: {}
              as: ProcurementAnalyst
              captures: { e_pa_approve: $.data.error_id }
            - call: "POST /freight-procurement/bid-events/${event_id}/lock-lanes"
              payload: {}
              as: CategoryManager
              captures: { e_cm_lock: $.data.error_id }
            - call: "POST /freight-procurement/qualification-reviews/${review_id}/decision"
              payload: { outcome: "APPROVE" }
              as: CategoryManager
              captures: { e_cm_decide: $.data.error_id }
            - call: "POST /freight-procurement/rate-records/${rate_a_id}/load"
              payload: {}
              as: CategoryManager
              captures: { e_cm_load: $.data.error_id }
            - call: "POST /freight-procurement/bid-events/${event_id}/award"
              payload: {}
              as: ContractAdmin
              captures: { e_ca_award: $.data.error_id }
            - call: "POST /freight-procurement/mini-bids/${mini_open_id}/apply"
              payload: { expected_contract_version: "${contract_v}", effective_from: "2026-10-01T00:00:00Z", effective_to: "2027-09-01T00:00:00Z" }
              as: CarrierRep
              as_user_id: "${carrier_a_id}"
              captures: { e_cr_apply: $.data.error_id }
          assert:
            - "all six calls return HTTP 403 with data.error_id == \"ERR_FORBIDDEN_ROLE\""
            - "no state changed: the allocation is still PROPOSED, the lanes still VALIDATED, the review still SCREENED, the record still STAGED, the event still AWARDING and the mini-bid still OPEN"
            - "each operation performed by its owning role at the same point succeeds, so the refusals are purely about the role header"
            - "the refusal is by role name, not by which user built the resource: a second ProcurementAnalyst user id is equally barred from approve"

      - name: shared_operations_work_for_every_listed_role_and_only_those
        claim_type: shared_operations
        grounds:
          - roles.ProcurementAnalyst.shared_operations
          - roles.ContractAdmin.shared_operations
          - endpoints.POST_/freight-procurement/rate-records/{id}/tender-events
        distinguishing_aspect: "Tender logging is deliberately shared between the analyst and the contract admin while excluding the commercial roles, and reads are shared asymmetrically: the carrier list excludes CarrierRep while the single carrier read includes it."
        test_recipe:
          setup:
            - "CHAIN:AWARDED_CONTRACT + go-live, record ${rate_a_id} LIVE with no tender events yet."
          setup_api_calls:
            - call: "GET /freight-procurement/rate-records/${rate_a_id}"
              payload: {}
              as: ContractAdmin
          trigger:
            - call: "POST /freight-procurement/rate-records/${rate_a_id}/tender-events"
              payload: { outcome: "ACCEPTED", load_reference: "LD-SHARED-1" }
              as: ProcurementAnalyst
            - call: "POST /freight-procurement/rate-records/${rate_a_id}/tender-events"
              payload: { outcome: "ACCEPTED", load_reference: "LD-SHARED-2" }
              as: ContractAdmin
            - call: "POST /freight-procurement/rate-records/${rate_a_id}/tender-events"
              payload: { outcome: "ACCEPTED", load_reference: "LD-SHARED-3" }
              as: CategoryManager
              captures: { e_cm_tender: $.data.error_id }
            - call: "GET /freight-procurement/carriers"
              payload: { limit: 5 }
              as: CarrierRep
              as_user_id: "${carrier_a_id}"
              captures: { e_cr_list: $.data.error_id }
          assert:
            - "the analyst and the contract admin calls both return 201 and the record's tender log holds two events with acceptance_pct 100.00"
            - "the category manager call returns 403 ERR_FORBIDDEN_ROLE and the log still holds two events"
            - "the CarrierRep carrier listing returns 403 ERR_FORBIDDEN_ROLE, while GET /freight-procurement/carriers/${carrier_a_id} as the same CarrierRep returns 200 — the list and the single read have different role sets"
            - "all five roles can call POST /_clock/set_current_utc, including CarrierRep"
            - "GET /freight-procurement/rate-records/${rate_a_id}/tender-events is readable by all four operator-facing roles including CarrierRep"

      - name: carrier_rep_cannot_act_on_another_carriers_records
        claim_type: peer_roles
        grounds:
          - validations.priority_6_auth
          - errors.ERR_NOT_RESOURCE_OWNER
          - roles.CarrierRep
        distinguishing_aspect: "CarrierRep is scoped by the carrier its X-User-ID resolves to, so the identical payload is accepted for its own carrier and refused with a distinct 403 for a peer's invitation, bid, contract or scorecard — a different id from the role refusal."
        test_recipe:
          setup:
            - "CHAIN:AWARDED_CONTRACT for ALFL ${carrier_a_id}, plus qualified carrier BFLX ${carrier_b_id} with its own SENT invitation ${invite_b_id} on the same event and a DRAFT scorecard ${scorecard_a_id} on ALFL."
          setup_api_calls:
            - call: "GET /freight-procurement/invitations"
              payload: { bid_event_id: "${event_id}" }
              as: ProcurementAnalyst
          trigger:
            - call: "POST /freight-procurement/invitations/${invite_b_id}/response"
              payload: { accept: true, nda_signed: true }
              as: CarrierRep
              as_user_id: "${carrier_a_id}"
              captures: { e_owner_invite: $.data.error_id }
            - call: "POST /freight-procurement/contracts/${contract_a_id}/carrier-signature"
              payload: {}
              as: CarrierRep
              as_user_id: "${carrier_b_id}"
              captures: { e_owner_contract: $.data.error_id }
            - call: "POST /freight-procurement/scorecards/${scorecard_a_id}/dispute"
              payload: { disputed_reason: "not our loads" }
              as: CarrierRep
              as_user_id: "${carrier_b_id}"
              captures: { e_owner_scorecard: $.data.error_id }
          assert:
            - "all three calls return HTTP 403 with data.error_id == \"ERR_NOT_RESOURCE_OWNER\" — not ERR_FORBIDDEN_ROLE, because CarrierRep is a listed role on each endpoint"
            - "BFLX's invitation is still SENT, the contract's signature_status is unchanged and the scorecard is still DRAFT"
            - "each call from the owning carrier's rep with the identical payload succeeds"
            - "a bid whose payload carrier_id names a different carrier than the caller's own is refused the same way, so the ownership check reads the body as well as the path"

      - name: the_approver_of_an_allocation_cannot_countersign_its_contract
        claim_type: Segregation of duties
        grounds:
          - validations.priority_7_auth
          - errors.ERR_SEGREGATION_OF_DUTIES
          - roles.ContractAdmin.note
        distinguishing_aspect: "The bar follows the operator id rather than the role, and it is permanent: because both roles are opaque, one human holding CategoryManager and ContractAdmin must be stopped at the shipper signature of exactly the contracts whose allocations they approved, while a colleague signs them without objection."
        test_recipe:
          setup:
            - "CHAIN:AWARDED_CONTRACT through the award, but with the allocation approval performed by operator id \"op-777\" acting as CategoryManager, and the carrier signature already applied so only the shipper signature is missing."
          setup_api_calls:
            - call: "GET /freight-procurement/award-allocations"
              payload: { bid_event_id: "${event_id}" }
              as: CategoryManager
          trigger:
            - call: "POST /freight-procurement/contracts/${contract_a_id}/shipper-signature"
              payload: {}
              as: ContractAdmin
              as_user_id: "op-777"
              captures: { e_sod: $.data.error_id }
            - call: "POST /freight-procurement/contracts/${contract_a_id}/shipper-signature"
              payload: {}
              as: ContractAdmin
              as_user_id: "op-888"
              captures: { e_sod_ok: $.data.message }
          assert:
            - "the first call returns HTTP 403 with data.error_id == \"ERR_SEGREGATION_OF_DUTIES\"; signature_status stays \"CARRIER_SIGNED\" and Contract.status stays \"DRAFT\""
            - "the second call by op-888 returns 200 with signature_status \"FULLY_SIGNED\" and Contract.status \"EXECUTED\""
            - "op-777 remains barred afterwards: retrying its signature on the now-signed contract still answers ERR_SEGREGATION_OF_DUTIES rather than a state error, because the auth check at priority 7 runs before the state check at priority 9"
            - "op-777 can sign a different contract of the same event whose allocations it never approved, so the bar is scoped to the (bid_event_id, carrier_id) pair it touched"
            - "the same operator id can still stage and load rate records on the barred contract — only the signature is withheld"

      - name: an_unauthenticated_request_is_refused_before_anything_else
        claim_type: exclusive_operations
        grounds:
          - validations.priority_1_auth
          - errors.ERR_UNAUTHENTICATED
        distinguishing_aspect: "Priority 1 sits above even the role check, so a request with no role header must answer 401 regardless of how many other rules the same request breaks — including reads, which are otherwise open to everyone."
        test_recipe:
          setup:
            - "CHAIN:AWARDED_CONTRACT so that real ids exist."
          setup_api_calls:
            - call: "GET /freight-procurement/carriers/${carrier_a_id}"
              payload: {}
              as: ProcurementAnalyst
          trigger:
            - call: "GET /freight-procurement/carriers/${carrier_a_id}"
              payload: {}
              as: NONE
              captures: { e_unauth_read: $.data.error_id }
            - call: "POST /freight-procurement/bid-events/00000000-0000-4000-8000-000000000000/lock-lanes"
              payload: {}
              as: NONE
              captures: { e_unauth_write: $.data.error_id }
          assert:
            - "both calls return HTTP 401 with data.error_id == \"ERR_UNAUTHENTICATED\""
            - "the second call answers 401 even though the path id does not exist and the role would also have been wrong — priority 1 wins over 2 and 3"
            - "an unrecognised role header value is treated as unauthenticated rather than forbidden"
            - "a CarrierRep header with no X-User-ID is refused 401 on carrier-scoped writes, since the carrier cannot be resolved"

  - section: cross_cutting_complexity_layers
    instances:
      - name: stale_bid_event_version_blocks_a_second_optimization_run
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.optimization-run-create-stale-bid-event
          - errors.ERR_STALE_BID_EVENT_VERSION
          - validations.priority_8_state
        distinguishing_aspect: "The OCC field guards a destructive supersede: the run that would wipe an earlier scenario must carry the version the client actually read, and because every write on the event bumps the version, a client that merely published a routing guide in between is already stale."
        test_recipe:
          setup:
            - "CHAIN:AWARDED_CONTRACT stages S1-S10 with the round CLOSED; BidEvent.status is ROUND_CLOSED."
          setup_api_calls:
            - call: "GET /freight-procurement/bid-events/${event_id}"
              payload: {}
              as: ProcurementAnalyst
              captures: { event_v: $.data.version }
          trigger:
            - call: "POST /freight-procurement/optimization-runs"
              payload: { bid_event_id: "${event_id}", expected_bid_event_version: "${event_v}", scenario_label: "BASE" }
              as: ProcurementAnalyst
              captures: { run1_id: $.data.id }
            - call: "POST /freight-procurement/optimization-runs"
              payload: { bid_event_id: "${event_id}", expected_bid_event_version: "${event_v}", scenario_label: "REPLAY_WITH_OLD_VERSION" }
              as: ProcurementAnalyst
              captures: { e_stale_event: $.data.error_id }
          assert:
            - "the first run returns 201 and BidEvent.version incremented by exactly 1 while status moved ROUND_CLOSED -> OPTIMIZING"
            - "the replay with the same ${event_v} returns HTTP 412 with data.error_id == \"ERR_STALE_BID_EVENT_VERSION\""
            - "after the refusal the first run is still COMPLETED (not SUPERSEDED) and BidEvent.version did not move — a rejected OCC write bumps nothing"
            - "re-reading the event and sending the fresh version succeeds and only then supersedes run 1"
            - "a version one higher than current is also refused with the same id, so the check is equality and not a lower bound"

      - name: stale_contract_version_blocks_a_second_mini_bid_apply
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.mini-bid-apply-stale-contract
          - errors.ERR_STALE_CONTRACT_VERSION
          - calculations.contract_committed_value
        distinguishing_aspect: "The second OCC rule guards money rather than scenario state: two mini-bids on different lanes of one contract each amend committed_value_usd, so the second apply must be rejected unless the client re-read the value the first one produced."
        test_recipe:
          setup:
            - "CHAIN:AWARDED_CONTRACT + go-live for a contract holding two LIVE rate records (lanes L-1147 and L-0600), with two OPEN mini-bids, one per lane, each carrying an accepted proposal inside its window and the clock inside both windows."
          setup_api_calls:
            - call: "GET /freight-procurement/contracts/${contract_a_id}"
              payload: {}
              as: ContractAdmin
              captures: { contract_v: $.data.version }
          trigger:
            - call: "POST /freight-procurement/mini-bids/${mini_lane_a_id}/apply"
              payload: { expected_contract_version: "${contract_v}", effective_from: "2026-10-01T00:00:00Z", effective_to: "2027-09-01T00:00:00Z" }
              as: ContractAdmin
            - call: "POST /freight-procurement/mini-bids/${mini_lane_b_id}/apply"
              payload: { expected_contract_version: "${contract_v}", effective_from: "2026-10-01T00:00:00Z", effective_to: "2027-09-01T00:00:00Z" }
              as: ContractAdmin
              captures: { e_stale_contract: $.data.error_id }
          assert:
            - "the first apply returns 200, supersedes the old rate record, stages and loads the amended one and re-evaluates Contract.committed_value_usd; Contract.version incremented"
            - "the second apply with the now-stale ${contract_v} returns HTTP 412 with data.error_id == \"ERR_STALE_CONTRACT_VERSION\""
            - "after the refusal the second mini-bid is still OPEN, its lane's rate record is still LIVE and committed_value_usd is unchanged from the first amendment"
            - "re-reading the contract and applying with the fresh version succeeds, and the committed value then reflects both amendments"
            - "the stale refusal is a 412 and not the 409 ERR_MINI_BID_NOT_OPEN, because the OCC check at priority 8 precedes the state check at priority 9"

      - name: version_advances_on_writes_only_and_never_on_reads
        claim_type: optimistic_concurrency
        grounds:
          - entities.BidEvent
          - entities.Contract
        distinguishing_aspect: "Both OCC parents must expose a monotonic version that counts writes exactly once each — including writes that arrive through a child endpoint such as a lane create or a rate-record stage — while reads, refused writes and unrelated entities' writes leave it alone."
        test_recipe:
          setup:
            - "CHAIN:AWARDED_CONTRACT stages S1-S7 so a DRAFT event exists with version 1 and no lanes."
          setup_api_calls:
            - call: "GET /freight-procurement/bid-events/${event_id}"
              payload: {}
              as: ProcurementAnalyst
              captures: { event_v: $.data.version }
          trigger:
            - call: "POST /freight-procurement/bid-events/${event_id}/lanes"
              payload: { lane_code: "L-VER", origin_zip3: "300", dest_zip3: "606", equipment_type: "DRY_VAN", mileage: 1147, annual_volume_loads: 550, service_days_required: 3, accessorial_history_usd_per_load: 137.55, trailing_12m_actual_loads: 480 }
              as: ProcurementAnalyst
              captures: { lane_ver_id: $.data.id }
            - call: "GET /freight-procurement/bid-events/${event_id}"
              payload: {}
              as: CategoryManager
            - call: "POST /freight-procurement/bid-events/${event_id}/lanes"
              payload: { lane_code: "L-VER", origin_zip3: "300", dest_zip3: "606", equipment_type: "DRY_VAN", mileage: 1147, annual_volume_loads: 550, service_days_required: 3, accessorial_history_usd_per_load: 137.55 }
              as: ProcurementAnalyst
              captures: { e_dup_code: $.data.error_id }
            - call: "GET /freight-procurement/bid-events/${event_id}"
              payload: {}
              as: ProcurementAnalyst
          assert:
            - "the event's version is 1 at the setup read"
            - "after the lane create it is 2 — a child write bumps the OCC parent"
            - "the intervening GET leaves it at 2, and repeated GETs never change it"
            - "the duplicate-lane_code refusal (409 ERR_DUPLICATE_LANE_CODE) leaves it at 2, so failed writes do not consume versions"
            - "creating an unrelated carrier does not change this event's version"

      - name: the_award_commit_chain_is_verified_end_to_end
        claim_type: cascading_side_effects
        grounds:
          - state_machines.BidEvent.AWARDING_to_AWARDED
        excluded_because:
          difficulty_instance: award_commit_five_link_cascade
          rationale: "The §1.8 transitive_cascade instance walks all five links of the award commit in one request and asserts the intermediate rows, so a second end-to-end chain claim here would duplicate it exactly."

      - name: cascade_ordering_and_partial_failure_are_observable
        claim_type: cascading_side_effects
        grounds:
          - state_machines.RateRecord.LIVE_to_AT_RISK
        excluded_because:
          difficulty_instance: tender_rejection_three_link_risk_cascade
          rationale: "That §1.8 instance drives the tender-risk cascade to its threshold and back, showing the ordering dependency (record -> allocation -> lane -> SYSTEM mini-bid) and the unwind when the rejection rate falls back below the threshold."

      - name: both_variants_of_the_evaluated_cost_are_produced_and_differ
        claim_type: dual_variant_calculation
        grounds:
          - calculations.lane_evaluated_cost
        excluded_because:
          difficulty_instance: lane_evaluated_cost_forecast_versus_historical_basis
          rationale: "The §1.8 dual_variant_calc instance runs the same bid under FORECAST and HISTORICAL cost_basis events and pins both totals plus the delta, which is precisely this layer's claim."

      - name: the_composite_score_switches_variant_and_applies_the_delta
        claim_type: dual_variant_calculation
        grounds:
          - calculations.carrier_composite_score
        excluded_because:
          difficulty_instance: carrier_composite_provisional_versus_final_performance
          rationale: "The §1.8 dual_variant_calc instance covers the provisional-to-final switch on the first published scorecard, including the recency-weighted blend and the WATCHLIST consequence of the delta."

      - name: the_round_number_selects_whether_the_reduction_target_is_enforced
        claim_type: selector_policy
        grounds:
          - entities.BidRound.fields.target_reduction_pct
          - errors.ERR_RATE_ABOVE_ROUND_TARGET
          - validations.priority_17_business_fiscal
        distinguishing_aspect: "One field is informational or binding depending on two selectors at once: the round number (never enforced in round 1) and whether this particular carrier bid the previous round, so a newcomer in round 2 escapes a rule that binds the incumbent bidder beside it."
        test_recipe:
          setup:
            - "An event with rounds_allowed 2, rate_floor_per_mile 1.5000, one locked lane L-1147 and two accepted invitations (ALFL ${carrier_a_id}, BFLX ${carrier_b_id})."
            - "Round 1 opened with target_reduction_pct 5.00: ALFL bids 2.0000 fuel-included / 600 loads / 3 days, BFLX does not bid. Round 1 is then closed."
            - "Round 2 is opened with target_reduction_pct 5.00, so a returning carrier must bid at or below 2.0000 * (1 - 0.05) == 1.9000."
          setup_api_calls:
            - call: "GET /freight-procurement/bid-events/${event_id}/bid-rounds"
              payload: {}
              as: ProcurementAnalyst
          trigger:
            - call: "POST /freight-procurement/bid-rounds/${round2_id}/lane-bids"
              payload: { lane_id: "${lane_a_id}", carrier_id: "${carrier_a_id}", rate_per_mile: 1.9100, fuel_surcharge_included: true, committed_volume_loads: 600, transit_days_offered: 3 }
              as: CarrierRep
              as_user_id: "${carrier_a_id}"
              captures: { e_above_target: $.data.error_id }
            - call: "POST /freight-procurement/bid-rounds/${round2_id}/lane-bids"
              payload: { lane_id: "${lane_a_id}", carrier_id: "${carrier_a_id}", rate_per_mile: 1.9000, fuel_surcharge_included: true, committed_volume_loads: 600, transit_days_offered: 3 }
              as: CarrierRep
              as_user_id: "${carrier_a_id}"
            - call: "POST /freight-procurement/bid-rounds/${round2_id}/lane-bids"
              payload: { lane_id: "${lane_a_id}", carrier_id: "${carrier_b_id}", rate_per_mile: 2.4000, fuel_surcharge_included: true, committed_volume_loads: 300, transit_days_offered: 3 }
              as: CarrierRep
              as_user_id: "${carrier_b_id}"
            - call: "POST /freight-procurement/bid-rounds/${round2_id}/lane-bids"
              payload: { lane_id: "${lane_a_id}", carrier_id: "${carrier_b_id}", rate_per_mile: 1.4900, fuel_surcharge_included: true, committed_volume_loads: 300, transit_days_offered: 3 }
              as: CarrierRep
              as_user_id: "${carrier_b_id}"
              captures: { e_floor_for_newcomer: $.data.error_id }
          assert:
            - "ALFL at 1.9100 returns HTTP 422 with data.error_id == \"ERR_RATE_ABOVE_ROUND_TARGET\" — one hundredth above its own reduced rate"
            - "ALFL at exactly 1.9000 returns 201, so the boundary is inclusive"
            - "BFLX at 2.4000 returns 201 even though that is far above the target: BFLX submitted nothing in round 1, so the selector leaves it unbound"
            - "BFLX at 1.4900 (a second lane bid attempt) is still refused 422 ERR_RATE_BELOW_FLOOR — the floor binds everyone regardless of the target selector"
            - "in round 1 the identical 2.4000 bid from ALFL would have been accepted, confirming target_reduction_pct is informational in the first round"

  - section: consistency_model
    instances:
      - name: every_derived_field_is_current_in_the_same_response_that_changed_it
        claim_type: immediate
        grounds:
          - consistency_model.immediate
          - state_machines.AwardAllocation.PROPOSED_to_APPROVED
        distinguishing_aspect: "There is no read-your-writes gap anywhere: the approval response itself must already show the debited lane volume and the recomputed event coverage, and an immediately following read must agree with it field for field."
        test_recipe:
          setup:
            - "CHAIN:AWARDED_CONTRACT through S11 up to the PROPOSED PRIMARY allocation of 550 loads on lane L-1147 (Lane.unallocated_volume_loads 550, BidEvent.coverage_pct 0.00)."
          setup_api_calls:
            - call: "GET /freight-procurement/lanes/${lane_a_id}"
              payload: {}
              as: ProcurementAnalyst
          trigger:
            - call: "POST /freight-procurement/award-allocations/${alloc_a_id}/approve"
              payload: {}
              as: CategoryManager
              as_user_id: "cm-001"
            - call: "GET /freight-procurement/lanes/${lane_a_id}"
              payload: {}
              as: ProcurementAnalyst
            - call: "GET /freight-procurement/bid-events/${event_id}"
              payload: {}
              as: ProcurementAnalyst
          assert:
            - "the approve response already carries status \"APPROVED\", approved_by_user_id \"cm-001\" and approved_at == the logical clock — no second call is needed to observe them"
            - "the immediately following lane read shows unallocated_volume_loads 0 and awarded_coverage_pct 100.00"
            - "the event read shows coverage_pct 100.00 and diversity_pct 0.00 (ALFL is classified NONE), both recomputed inside the approve request"
            - "no field changes on a second identical read, so nothing was still settling"

      - name: a_refused_request_leaves_no_partially_applied_state
        claim_type: immediate
        grounds:
          - consistency_model.immediate
          - state_machines.BidEvent.AWARDING_to_AWARDED
        distinguishing_aspect: "Immediate consistency also means all-or-nothing: the multi-link award commit that fails its diversity gate must leave every one of the five links unwritten, so the very next read is indistinguishable from the pre-call state."
        test_recipe:
          setup:
            - "The CHAIN event but created with diversity_min_pct 50.00 and only the NONE-classified ALFL in the routing guide, taken to AWARDING with the PRIMARY allocation APPROVED (diversity_pct 0.00)."
          setup_api_calls:
            - call: "GET /freight-procurement/bid-events/${event_id}"
              payload: {}
              as: CategoryManager
          trigger:
            - call: "POST /freight-procurement/bid-events/${event_id}/award"
              payload: {}
              as: CategoryManager
              captures: { e_diversity: $.data.error_id }
            - call: "GET /freight-procurement/award-allocations"
              payload: { bid_event_id: "${event_id}" }
              as: CategoryManager
            - call: "GET /freight-procurement/contracts"
              payload: { bid_event_id: "${event_id}" }
              as: ContractAdmin
          assert:
            - "the award returns HTTP 422 with data.error_id == \"ERR_DIVERSITY_MINIMUM_NOT_MET\""
            - "the allocation listing shows the row still \"APPROVED\" with its LaneBid still \"SHORTLISTED\" — links 2 and 3 never ran"
            - "the contract listing returns total_count 0 — link 4 never created a Contract"
            - "BidEvent.status is still \"AWARDING\" with awarded_at null, award_cost_usd null, savings_pct null and version unchanged"
            - "Carrier.committed_volume_loads is still 0, so link 5 left no trace either"
