      - name: min_seats_not_met_on_lock
        claim_type: Violation → Error
        grounds:
          - validations[priority=16]
          - errors[ERR_MIN_SEATS_NOT_MET]
          - state_machines.Cohort.OPEN_to_LOCKED
        distinguishing_aspect: "Locking an OPEN cohort whose seats_confirmed (0) < min_seats (2) returns ERR_MIN_SEATS_NOT_MET (409)."
