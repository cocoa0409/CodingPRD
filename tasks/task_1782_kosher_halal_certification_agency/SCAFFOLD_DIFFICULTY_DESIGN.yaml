  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: holiday_window_half_open_adjacency_allowed_overlap_rejected
        grounds:
          - validations[priority=7]
          - state_machines.HolidayProductionWindow
        distinguishing_aspect: "Half-open [start, end) interval semantics on HolidayProductionWindow at one facility (distinct entity and semantics from the sibling's buffer-expanded visit intervals): a window starting exactly at the previous window's end is ACCEPTED (adjacency, empty intersection), while one starting one day earlier is REJECTED ERR_WINDOW_OVERLAP."
        test_recipe:
          setup:
            - "Client + facility (no approval needed to request windows); w1 = [2026-09-20T00:00Z, 2026-09-30T00:00Z) REQUESTED"
          setup_api_calls:
            - { call: "POST /api/clients", payload: { legal_name: "Overlap Co", certification_scheme: "KOSHER", contact_email: "o@x.com" }, as: AccountManager, captures: { cO: $.data.id } }
            - { call: "POST /api/facilities", payload: { client_id: "${cO}", name: "O Plant", address: "19 Rd", facility_role: "OWNED" }, as: ClientContact, as_user_id: "${cO}", captures: { fO: $.data.id } }
            - { call: "POST /api/holiday-windows", payload: { facility_id: "${fO}", holiday_code: "PASSOVER", window_start: "2026-09-20T00:00:00Z", window_end: "2026-09-30T00:00:00Z" }, as: ClientContact, as_user_id: "${cO}", captures: { wO1: $.data.id, wO1_st: $.data.status } }
          trigger:
            - { call: "POST /api/holiday-windows", payload: { facility_id: "${fO}", holiday_code: "PASSOVER", window_start: "2026-09-30T00:00:00Z", window_end: "2026-10-10T00:00:00Z" }, as: ClientContact, as_user_id: "${cO}", captures: { wO2: $.data.id, wO2_st: $.data.status } }
            - { call: "POST /api/holiday-windows", payload: { facility_id: "${fO}", holiday_code: "ROSH_HASHANAH", window_start: "2026-09-29T00:00:00Z", window_end: "2026-10-05T00:00:00Z" }, as: ClientContact, as_user_id: "${cO}", captures: { errO: $.data.error_id } }
          assert:
            - "wO1_st == REQUESTED and wO2_st == REQUESTED — adjacency (w2.start == w1.end) is an empty half-open intersection, accepted"
            - "errO == ERR_WINDOW_OVERLAP (w3.start 2026-09-29 < w1.end 2026-09-30 and w3.end > w1.start)"

      - name: inspector_visit_travel_buffer_strict_inequality_edges
        grounds:
          - validations[priority=7]
          - entities.SupervisionVisit.fields.inspector_user_id
        distinguishing_aspect: "Buffer-expanded CLOSED interval semantics on SupervisionVisit per inspector (distinct entity and interval geometry from the sibling's half-open facility windows): with an existing [10:00, 12:00] visit, a new visit at [13:00, 15:00] conflicts (13:00 < 12:00+2h), one at exactly [14:00, 16:00] is ALLOWED (strict inequality at the buffer edge), and the same overlapping window under a DIFFERENT inspector is allowed (inspector-scoped resource)."
        test_recipe:
          setup:
            - "Client + facility PENDING_REVIEW; v1 = INITIAL visit for inspector sup-1 [2026-08-03T10:00Z, 2026-08-03T12:00Z] SCHEDULED"
          setup_api_calls:
            - { call: "POST /api/clients", payload: { legal_name: "Buffer Co", certification_scheme: "KOSHER", contact_email: "b2@x.com" }, as: AccountManager, captures: { cB2: $.data.id } }
            - { call: "POST /api/facilities", payload: { client_id: "${cB2}", name: "B2 Plant", address: "20 Rd", facility_role: "OWNED" }, as: ClientContact, as_user_id: "${cB2}", captures: { fB2: $.data.id } }
            - { call: "POST /api/visits", payload: { facility_id: "${fB2}", visit_type: "INITIAL", inspector_user_id: "sup-1", scheduled_start: "2026-08-03T10:00:00Z", scheduled_end: "2026-08-03T12:00:00Z" }, as: AccountManager, captures: { vB1: $.data.id } }
          trigger:
            - { call: "POST /api/visits", payload: { facility_id: "${fB2}", visit_type: "ROUTINE", inspector_user_id: "sup-1", scheduled_start: "2026-08-03T13:00:00Z", scheduled_end: "2026-08-03T15:00:00Z" }, as: AccountManager, captures: { errB: $.data.error_id } }
            - { call: "POST /api/visits", payload: { facility_id: "${fB2}", visit_type: "ROUTINE", inspector_user_id: "sup-1", scheduled_start: "2026-08-03T14:00:00Z", scheduled_end: "2026-08-03T16:00:00Z" }, as: AccountManager, captures: { vB3: $.data.id, vB3_st: $.data.status } }
            - { call: "POST /api/visits", payload: { facility_id: "${fB2}", visit_type: "ROUTINE", inspector_user_id: "sup-2", scheduled_start: "2026-08-03T11:00:00Z", scheduled_end: "2026-08-03T13:00:00Z" }, as: AccountManager, captures: { vB4: $.data.id, vB4_st: $.data.status } }
          assert:
            - "errB == ERR_INSPECTOR_SCHEDULE_CONFLICT (13:00 < 14:00 = end+2h and 15:00 > 08:00 = start-2h)"
            - "vB3_st == SCHEDULED (14:00 < 14:00 is FALSE — strict inequality lets the exact buffer edge through)"
            - "vB4_st == SCHEDULED (overlap is per-inspector; sup-2 has no other visits)"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: billed_cents_conserved_under_add_product_and_void
        grounds:
          - calculations.total_billed_cents
          - state_machines.Invoice.ISSUED_to_VOID
        distinguishing_aspect: "Conserved quantity is MONEY (client.total_billed_cents, distinct from the sibling count and risk-point invariants): the forward action (add-product creates a 54600-cent ISSUED invoice) paired with its compensating action (void) returns total_billed_cents to exactly its pre-action value 120000, while the certificate entry itself is NOT removed (no fee refund)."
        test_recipe:
          setup:
            - "Fully certified client; agreement ANNIVERSARY 2026-04-01..2027-03-31 fee 73000; annual invoice 120000 PAID -> total_billed_cents == 120000; p2 CERTIFIABLE unlisted; clock 2026-07-01"
          setup_api_calls:
            - { call: "POST /api/clients", payload: { legal_name: "Inv Co", certification_scheme: "KOSHER", contact_email: "iv@x.com" }, as: AccountManager, captures: { cIV: $.data.id } }
            - { call: "POST /api/clients/${cIV}/submit-application", as: ClientContact, as_user_id: "${cIV}", captures: { cIV_v: $.data.version } }
            - { call: "POST /api/facilities", payload: { client_id: "${cIV}", name: "IV Plant", address: "21 Rd", facility_role: "OWNED" }, as: ClientContact, as_user_id: "${cIV}", captures: { fIV: $.data.id } }
