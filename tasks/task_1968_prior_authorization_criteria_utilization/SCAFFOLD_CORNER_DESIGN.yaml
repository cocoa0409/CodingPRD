            - { call: "POST /um/prior-auth-requests/${e05}/reviewer-decision", payload: { decision: "APPROVE", reason_code: "MEDICAL_NECESSITY_MET" }, as: ClinicalReviewer, as_user_id: "u-rev-1" }
            - { call: "POST /um/prior-auth-requests", payload: { provider_id: "${p_id}", member_ref: "E-06", criteria_set_id: "${cs_id}", service_code: "72148", urgency: "STANDARD", intake_channel: "FAX", documentation_complete: false }, as: IntakeSpecialist, captures: { e06: $.data.id } }
            - { call: "POST /um/prior-auth-requests/${e06}/reviewer-decision", payload: { decision: "APPROVE", reason_code: "MEDICAL_NECESSITY_MET" }, as: ClinicalReviewer, as_user_id: "u-rev-1" }
            - { call: "POST /um/prior-auth-requests", payload: { provider_id: "${p_id}", member_ref: "E-07", criteria_set_id: "${cs_id}", service_code: "72148", urgency: "STANDARD", intake_channel: "FAX", documentation_complete: false }, as: IntakeSpecialist, captures: { e07: $.data.id } }
            - { call: "POST /um/prior-auth-requests/${e07}/reviewer-decision", payload: { decision: "APPROVE", reason_code: "MEDICAL_NECESSITY_MET" }, as: ClinicalReviewer, as_user_id: "u-rev-1" }
            - { call: "POST /um/prior-auth-requests", payload: { provider_id: "${p_id}", member_ref: "E-08", criteria_set_id: "${cs_id}", service_code: "72148", urgency: "STANDARD", intake_channel: "FAX", documentation_complete: false }, as: IntakeSpecialist, captures: { e08: $.data.id } }
            - { call: "POST /um/prior-auth-requests/${e08}/reviewer-decision", payload: { decision: "APPROVE", reason_code: "MEDICAL_NECESSITY_MET" }, as: ClinicalReviewer, as_user_id: "u-rev-1" }
            - { call: "POST /um/prior-auth-requests", payload: { provider_id: "${p_id}", member_ref: "E-09", criteria_set_id: "${cs_id}", service_code: "72148", urgency: "STANDARD", intake_channel: "FAX", documentation_complete: false }, as: IntakeSpecialist, captures: { e09: $.data.id } }
            - { call: "POST /um/prior-auth-requests/${e09}/reviewer-decision", payload: { decision: "DENY", reason_code: "MEDICAL_NECESSITY_NOT_MET" }, as: ClinicalReviewer, as_user_id: "u-rev-1" }
            - { call: "POST /um/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: UMAdmin }
          trigger:
            - { call: "POST /um/providers/${p_id}/gold-card-evaluations", payload: { service_category: "IMAGING" }, as: UMAdmin, captures: { wc: $.data.window_determination_count, wr: $.data.window_approval_rate, dec: $.data.decision } }
          assert:
            - "wc == 10 (the 2026-05-03 determination sits exactly on window_start and is INCLUDED)"
            - "wr == 0.9 and dec == GRANTED"

      - name: overturn_rates_null_denominators
        claim_type: correct_result
        grounds: [calculations.appeal_overturn_rates]
        distinguishing_aspect: "Empty-set handling: with one filed but undecided appeal, overturn_rate_decided is null (zero decided) while overturn_rate_filed is 0.0 — the two variants diverge on emptiness, not just on value."
        test_recipe:
          setup: ["Active criteria set; provider; one denied request; one appeal filed and left RECEIVED"]
          setup_api_calls:
            - { call: "POST /um/criteria-sets", payload: { name: "Spine Imaging Criteria", line_of_business: "COMMERCIAL", service_category: "IMAGING" }, as: ClinicalPolicyEditor, captures: { cs_id: $.data.id, cs_v: $.data.version } }
            - { call: "POST /um/criteria-sets/${cs_id}/guideline-versions", payload: { version_label: "1.0", content: "criteria", auto_approve_eligible: false, effective_from: "2026-01-01T00:00:00Z" }, as: ClinicalPolicyEditor, captures: { gv_id: $.data.id } }
            - { call: "POST /um/guideline-versions/${gv_id}/transition", payload: { to_status: "PUBLISHED", expected_criteria_set_version: "${cs_v}" }, as: ClinicalPolicyEditor }
            - { call: "POST /um/criteria-sets/${cs_id}/transition", payload: { to_status: "ACTIVE" }, as: ClinicalPolicyEditor }
            - { call: "POST /um/providers", payload: { npi: "2000000014", name: "Null Rate Provider" }, as: UMAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /um/prior-auth-requests", payload: { provider_id: "${p_id}", member_ref: "M-01", criteria_set_id: "${cs_id}", service_code: "72148", urgency: "STANDARD", intake_channel: "FAX", documentation_complete: false }, as: IntakeSpecialist, captures: { req: $.data.id } }
            - { call: "POST /um/prior-auth-requests/${req}/reviewer-decision", payload: { decision: "DENY", reason_code: "INSUFFICIENT_INFO" }, as: ClinicalReviewer, as_user_id: "u-rev-1" }
            - { call: "GET /um/determinations", payload: { request_id: "${req}" }, as: UMAdmin, captures: { det: "$.data[0].id" } }
            - { call: "POST /um/determinations/${det}/appeals", payload: { appeal_reason: "Pending" }, as: AppealsClerk }
          trigger:
            - { call: "GET /um/metrics/overturn-analysis", payload: {}, as: ComplianceOfficer }
          assert:
            - "appeals_filed == 1 and appeals_decided == 0 and appeals_withdrawn == 0"
            - "overturn_rate_decided == null (no decided appeals)"
            - "overturn_rate_filed == 0.0 (0 / 1)"

      - name: breach_sweep_idempotent_on_second_advance
        claim_type: correct_result
        grounds: [calculations.turnaround_due_at, "endpoints[POST /um/_clock/set_current_utc]"]
        distinguishing_aspect: "The clock-advance sweep is idempotent per request: a second advance past the same due_at flags 0 additional requests and the request keeps exactly one TAT_BREACHED event."
        test_recipe:
          setup: ["Active COMMERCIAL criteria set; one STANDARD pended request (due 2026-08-08T00:00:00Z)"]
          setup_api_calls:
            - { call: "POST /um/criteria-sets", payload: { name: "Spine Imaging Criteria", line_of_business: "COMMERCIAL", service_category: "IMAGING" }, as: ClinicalPolicyEditor, captures: { cs_id: $.data.id, cs_v: $.data.version } }
            - { call: "POST /um/criteria-sets/${cs_id}/guideline-versions", payload: { version_label: "1.0", content: "criteria", auto_approve_eligible: false, effective_from: "2026-01-01T00:00:00Z" }, as: ClinicalPolicyEditor, captures: { gv_id: $.data.id } }
            - { call: "POST /um/guideline-versions/${gv_id}/transition", payload: { to_status: "PUBLISHED", expected_criteria_set_version: "${cs_v}" }, as: ClinicalPolicyEditor }
            - { call: "POST /um/criteria-sets/${cs_id}/transition", payload: { to_status: "ACTIVE" }, as: ClinicalPolicyEditor }
            - { call: "POST /um/providers", payload: { npi: "2000000015", name: "Sweep Provider" }, as: UMAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /um/prior-auth-requests", payload: { provider_id: "${p_id}", member_ref: "M-01", criteria_set_id: "${cs_id}", service_code: "72148", urgency: "STANDARD", intake_channel: "FAX", documentation_complete: false }, as: IntakeSpecialist, captures: { req: $.data.id } }
          trigger:
            - { call: "POST /um/_clock/set_current_utc", payload: { to_iso8601: "2026-08-09T00:00:00Z" }, as: UMAdmin, captures: { f1: $.data.requests_flagged } }
            - { call: "POST /um/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: UMAdmin, captures: { f2: $.data.requests_flagged } }
            - { call: "GET /um/prior-auth-requests/${req}/compliance-events", payload: { event_type: "TAT_BREACHED" }, as: UMAdmin }
          assert:
            - "f1 == 1 and f2 == 0 (sticky flag; sweep does not double-count)"
            - "the request has exactly 1 TAT_BREACHED compliance event after both advances"

  # ------------------------------------------------------------- validations --
  - section: validations
    instances:
      - name: missing_user_context_header_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"]
        distinguishing_aspect: "A call without X-User-ID / X-User-Role headers is rejected 400 ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER before any role or existence check runs."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /um/providers", payload: { npi: "2000000016", name: "Anon" }, as: UMAdmin, captures: { err: $.data.error_id } }
          assert:
            - "request is sent WITHOUT X-User-ID and X-User-Role headers"
            - "err == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER with http 400"

      - name: occ_stale_criteria_set_version_rejected
        claim_type: violation_to_error
        grounds: ["concurrency_rules[guideline-transition-stale-criteria-set]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Publishing with the criteria-set version observed before another publish (stale by one bump) is rejected 412 ERR_STALE_VERSION; the fresh version succeeds."
        test_recipe:
          setup: ["Criteria set with v1 published (set version bumped 1 -> 2); draft v2 created while client still holds the pre-publish version"]
          setup_api_calls:
            - { call: "POST /um/criteria-sets", payload: { name: "OCC Set", line_of_business: "COMMERCIAL", service_category: "IMAGING" }, as: ClinicalPolicyEditor, captures: { cs_id: $.data.id, cs_v: $.data.version } }
            - { call: "POST /um/criteria-sets/${cs_id}/guideline-versions", payload: { version_label: "1.0", content: "v1", auto_approve_eligible: false, effective_from: "2026-01-01T00:00:00Z", effective_until: "2026-06-30T00:00:00Z" }, as: ClinicalPolicyEditor, captures: { gv1: $.data.id } }
            - { call: "POST /um/guideline-versions/${gv1}/transition", payload: { to_status: "PUBLISHED", expected_criteria_set_version: "${cs_v}" }, as: ClinicalPolicyEditor }
            - { call: "POST /um/criteria-sets/${cs_id}/guideline-versions", payload: { version_label: "2.0", content: "v2", auto_approve_eligible: false, effective_from: "2026-07-01T00:00:00Z" }, as: ClinicalPolicyEditor, captures: { gv2: $.data.id } }
          trigger:
            - { call: "POST /um/guideline-versions/${gv2}/transition", payload: { to_status: "PUBLISHED", expected_criteria_set_version: "${cs_v}" }, as: ClinicalPolicyEditor, captures: { err: $.data.error_id } }
            - { call: "GET /um/guideline-versions/${gv2}", payload: {}, as: ClinicalPolicyEditor, captures: { st: $.data.status } }
          assert:
            - "err == ERR_STALE_VERSION with http 412 (${cs_v} was captured before the v1 publish bumped the set version)"
            - "st == DRAFT (rejected transition leaves the version untouched)"

      - name: priority_state_vs_safety_conflict_corner
        claim_type: priority_ordering
        grounds: ["validations[priority=6]", "validations[priority=7]"]
        excluded_because:
          difficulty_instance: appeal_decide_state_priority_over_reviewer_assignment
          rationale: "The state-vs-business_safety priority conflict is asserted by the named §1.8 instance."

      - name: priority_referential_vs_temporal_conflict_corner
        claim_type: priority_ordering
        grounds: ["validations[priority=8]", "validations[priority=10]"]
        excluded_because:
          difficulty_instance: guideline_supersedes_referential_beats_window_temporal
          rationale: "The referential-vs-temporal priority conflict is asserted by the named §1.8 instance."

      - name: intake_on_draft_criteria_set_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=6]", "errors[ERR_CRITERIA_SET_NOT_ACTIVE]"]
        distinguishing_aspect: "Intake against a DRAFT criteria set fails with ERR_CRITERIA_SET_NOT_ACTIVE before any guideline-selection logic runs."
        test_recipe:
          setup: ["Criteria set in DRAFT; provider exists"]
          setup_api_calls:
            - { call: "POST /um/criteria-sets", payload: { name: "Draft Set", line_of_business: "COMMERCIAL", service_category: "IMAGING" }, as: ClinicalPolicyEditor, captures: { cs_id: $.data.id } }
            - { call: "POST /um/providers", payload: { npi: "2000000017", name: "P" }, as: UMAdmin, captures: { p_id: $.data.id } }
          trigger:
            - { call: "POST /um/prior-auth-requests", payload: { provider_id: "${p_id}", member_ref: "M-01", criteria_set_id: "${cs_id}", service_code: "72148", urgency: "STANDARD", intake_channel: "FAX", documentation_complete: false }, as: IntakeSpecialist, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_CRITERIA_SET_NOT_ACTIVE"

      - name: retired_criteria_set_reactivation_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=6]", "errors[ERR_INVALID_CRITERIA_SET_TRANSITION]"]
        distinguishing_aspect: "RETIRED is terminal for criteria sets: transition to ACTIVE from RETIRED fails with ERR_INVALID_CRITERIA_SET_TRANSITION."
        test_recipe:
          setup: ["Criteria set taken DRAFT -> ACTIVE -> RETIRED"]
          setup_api_calls:
            - { call: "POST /um/criteria-sets", payload: { name: "Retire Set", line_of_business: "COMMERCIAL", service_category: "IMAGING" }, as: ClinicalPolicyEditor, captures: { cs_id: $.data.id, cs_v: $.data.version } }
            - { call: "POST /um/criteria-sets/${cs_id}/guideline-versions", payload: { version_label: "1.0", content: "c", auto_approve_eligible: false, effective_from: "2026-01-01T00:00:00Z" }, as: ClinicalPolicyEditor, captures: { gv: $.data.id } }
            - { call: "POST /um/guideline-versions/${gv}/transition", payload: { to_status: "PUBLISHED", expected_criteria_set_version: "${cs_v}" }, as: ClinicalPolicyEditor }
            - { call: "POST /um/criteria-sets/${cs_id}/transition", payload: { to_status: "ACTIVE" }, as: ClinicalPolicyEditor }
            - { call: "POST /um/criteria-sets/${cs_id}/transition", payload: { to_status: "RETIRED" }, as: ClinicalPolicyEditor }
          trigger:
            - { call: "POST /um/criteria-sets/${cs_id}/transition", payload: { to_status: "ACTIVE" }, as: ClinicalPolicyEditor, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_CRITERIA_SET_TRANSITION"

      - name: intake_without_covering_guideline_window_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=6]", "errors[ERR_NO_ACTIVE_GUIDELINE]", "endpoints[POST /um/prior-auth-requests]"]
        distinguishing_aspect: "Even with an ACTIVE set and a PUBLISHED version, intake at 2026-08-01 fails with ERR_NO_ACTIVE_GUIDELINE when the only published window starts 2027-01-01 (selector's empty-pool fallback)."
        test_recipe:
          setup: ["Criteria set with published guideline whose window opens 2027-01-01; set activated; provider"]
          setup_api_calls:
            - { call: "POST /um/criteria-sets", payload: { name: "Future Window Set", line_of_business: "COMMERCIAL", service_category: "IMAGING" }, as: ClinicalPolicyEditor, captures: { cs_id: $.data.id, cs_v: $.data.version } }
            - { call: "POST /um/criteria-sets/${cs_id}/guideline-versions", payload: { version_label: "1.0", content: "future criteria", auto_approve_eligible: false, effective_from: "2027-01-01T00:00:00Z" }, as: ClinicalPolicyEditor, captures: { gv: $.data.id } }
            - { call: "POST /um/guideline-versions/${gv}/transition", payload: { to_status: "PUBLISHED", expected_criteria_set_version: "${cs_v}" }, as: ClinicalPolicyEditor }
            - { call: "POST /um/criteria-sets/${cs_id}/transition", payload: { to_status: "ACTIVE" }, as: ClinicalPolicyEditor }
            - { call: "POST /um/providers", payload: { npi: "2000000018", name: "P" }, as: UMAdmin, captures: { p_id: $.data.id } }
          trigger:
            - { call: "POST /um/prior-auth-requests", payload: { provider_id: "${p_id}", member_ref: "M-01", criteria_set_id: "${cs_id}", service_code: "72148", urgency: "STANDARD", intake_channel: "FAX", documentation_complete: false }, as: IntakeSpecialist, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_NO_ACTIVE_GUIDELINE (received_at 2026-08-01 falls outside every published window)"

      - name: republish_published_guideline_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=6]", "errors[ERR_INVALID_GUIDELINE_TRANSITION]"]
        distinguishing_aspect: "Publishing an already-PUBLISHED version fails with ERR_INVALID_GUIDELINE_TRANSITION (publish is only valid from DRAFT)."
        test_recipe:
          setup: ["Criteria set with v1 PUBLISHED"]
          setup_api_calls:
            - { call: "POST /um/criteria-sets", payload: { name: "Republish Set", line_of_business: "COMMERCIAL", service_category: "IMAGING" }, as: ClinicalPolicyEditor, captures: { cs_id: $.data.id, cs_v: $.data.version } }
            - { call: "POST /um/criteria-sets/${cs_id}/guideline-versions", payload: { version_label: "1.0", content: "c", auto_approve_eligible: false, effective_from: "2026-01-01T00:00:00Z" }, as: ClinicalPolicyEditor, captures: { gv: $.data.id } }
            - { call: "POST /um/guideline-versions/${gv}/transition", payload: { to_status: "PUBLISHED", expected_criteria_set_version: "${cs_v}" }, as: ClinicalPolicyEditor }
            - { call: "GET /um/criteria-sets/${cs_id}", payload: {}, as: ClinicalPolicyEditor, captures: { cs_v2: $.data.version } }
          trigger:
            - { call: "POST /um/guideline-versions/${gv}/transition", payload: { to_status: "PUBLISHED", expected_criteria_set_version: "${cs_v2}" }, as: ClinicalPolicyEditor, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_GUIDELINE_TRANSITION"

      - name: md_decision_on_pended_request_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=6]", "errors[ERR_REQUEST_NOT_ESCALATED]"]
        distinguishing_aspect: "The medical-director tier cannot decide a request still in PENDED_REVIEW: md-decision fails with ERR_REQUEST_NOT_ESCALATED until a reviewer escalates it."
        test_recipe:
          setup: ["Active criteria set; provider; one PENDED_REVIEW request"]
          setup_api_calls:
            - { call: "POST /um/criteria-sets", payload: { name: "Spine Imaging Criteria", line_of_business: "COMMERCIAL", service_category: "IMAGING" }, as: ClinicalPolicyEditor, captures: { cs_id: $.data.id, cs_v: $.data.version } }
            - { call: "POST /um/criteria-sets/${cs_id}/guideline-versions", payload: { version_label: "1.0", content: "c", auto_approve_eligible: false, effective_from: "2026-01-01T00:00:00Z" }, as: ClinicalPolicyEditor, captures: { gv: $.data.id } }
            - { call: "POST /um/guideline-versions/${gv}/transition", payload: { to_status: "PUBLISHED", expected_criteria_set_version: "${cs_v}" }, as: ClinicalPolicyEditor }
            - { call: "POST /um/criteria-sets/${cs_id}/transition", payload: { to_status: "ACTIVE" }, as: ClinicalPolicyEditor }
            - { call: "POST /um/providers", payload: { npi: "2000000019", name: "P" }, as: UMAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /um/prior-auth-requests", payload: { provider_id: "${p_id}", member_ref: "M-01", criteria_set_id: "${cs_id}", service_code: "72148", urgency: "STANDARD", intake_channel: "FAX", documentation_complete: false }, as: IntakeSpecialist, captures: { req: $.data.id } }
          trigger:
            - { call: "POST /um/prior-auth-requests/${req}/md-decision", payload: { decision: "APPROVE", reason_code: "MEDICAL_NECESSITY_MET" }, as: MedicalDirector, as_user_id: "u-md-1", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_REQUEST_NOT_ESCALATED"

      - name: finding_close_twice_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=6]", "errors[ERR_FINDING_NOT_OPEN]", state_machines.AuditFinding]
        distinguishing_aspect: "Closing an already-CLOSED finding fails with ERR_FINDING_NOT_OPEN; open_deficiency_count stays at its post-close value (no double-decrement)."
        test_recipe:
          setup: ["Active criteria set with arrangement; one denied determination; one finding created then closed"]
          setup_api_calls:
            - { call: "POST /um/criteria-sets", payload: { name: "Spine Imaging Criteria", line_of_business: "COMMERCIAL", service_category: "IMAGING" }, as: ClinicalPolicyEditor, captures: { cs_id: $.data.id, cs_v: $.data.version } }
            - { call: "POST /um/criteria-sets/${cs_id}/guideline-versions", payload: { version_label: "1.0", content: "c", auto_approve_eligible: false, effective_from: "2026-01-01T00:00:00Z" }, as: ClinicalPolicyEditor, captures: { gv: $.data.id } }
            - { call: "POST /um/guideline-versions/${gv}/transition", payload: { to_status: "PUBLISHED", expected_criteria_set_version: "${cs_v}" }, as: ClinicalPolicyEditor }
            - { call: "POST /um/criteria-sets/${cs_id}/transition", payload: { to_status: "ACTIVE" }, as: ClinicalPolicyEditor }
            - { call: "POST /um/providers", payload: { npi: "2000000020", name: "P" }, as: UMAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /um/delegation-arrangements", payload: { delegating_plan_name: "Plan X", criteria_set_id: "${cs_id}" }, as: UMAdmin, captures: { arr: $.data.id } }
            - { call: "POST /um/prior-auth-requests", payload: { provider_id: "${p_id}", member_ref: "M-01", criteria_set_id: "${cs_id}", service_code: "72148", urgency: "STANDARD", intake_channel: "FAX", documentation_complete: false }, as: IntakeSpecialist, captures: { req: $.data.id } }
            - { call: "POST /um/prior-auth-requests/${req}/reviewer-decision", payload: { decision: "DENY", reason_code: "MEDICAL_NECESSITY_NOT_MET" }, as: ClinicalReviewer, as_user_id: "u-rev-1" }
            - { call: "GET /um/determinations", payload: { request_id: "${req}" }, as: UMAdmin, captures: { det: "$.data[0].id" } }
            - { call: "POST /um/delegation-arrangements/${arr}/audit-findings", payload: { determination_id: "${det}", finding_type: "NOTICE_DEFICIENT" }, as: ComplianceOfficer, captures: { f1: $.data.id } }
            - { call: "POST /um/audit-findings/${f1}/transition", payload: { to_status: "CLOSED" }, as: ComplianceOfficer }
          trigger:
            - { call: "POST /um/audit-findings/${f1}/transition", payload: { to_status: "CLOSED" }, as: ComplianceOfficer, captures: { err: $.data.error_id } }
            - { call: "GET /um/delegation-arrangements/${arr}", payload: {}, as: ComplianceOfficer, captures: { cnt: $.data.open_deficiency_count } }
          assert:
            - "err == ERR_FINDING_NOT_OPEN"
            - "cnt == 0 (no double-decrement)"

      - name: already_gold_carded_evaluation_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=6]", "errors[ERR_ALREADY_GOLD_CARDED]"]
        distinguishing_aspect: "A provider already GOLD_CARDED rejects a further evaluation with ERR_ALREADY_GOLD_CARDED (409) — evaluation is only reachable from NOT_GOLD_CARDED or SUSPENDED."
        test_recipe:
          setup: ["Active criteria set; provider GOLD_CARDED via 10 approvals and a granted evaluation"]
          setup_api_calls:
            - { call: "POST /um/criteria-sets", payload: { name: "Spine Imaging Criteria", line_of_business: "COMMERCIAL", service_category: "IMAGING" }, as: ClinicalPolicyEditor, captures: { cs_id: $.data.id, cs_v: $.data.version } }
            - { call: "POST /um/criteria-sets/${cs_id}/guideline-versions", payload: { version_label: "1.0", content: "c", auto_approve_eligible: false, effective_from: "2026-01-01T00:00:00Z" }, as: ClinicalPolicyEditor, captures: { gv: $.data.id } }
            - { call: "POST /um/guideline-versions/${gv}/transition", payload: { to_status: "PUBLISHED", expected_criteria_set_version: "${cs_v}" }, as: ClinicalPolicyEditor }
