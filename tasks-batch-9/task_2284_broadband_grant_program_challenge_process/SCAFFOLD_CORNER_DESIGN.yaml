            - "EligibleLocation.${l1_id}.challenge_count == 0"

      - name: program_window_order_invalid_rejected
        claim_type: violation_to_error
        grounds:
          - validations.ERR_WINDOW_ORDER_INVALID
        distinguishing_aspect: |
          Priority 70 is a domain ordering rule distinct from the priority 14 parse check: both
          timestamps parse and carry explicit UTC offsets, so only the start-before-end comparison
          can reject them. The rule covers both window pairs independently, so a valid challenge
          window with an inverted application window is refused just the same.
        test_recipe:
          setup:
            - "Empty database; logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /broadband/programs"
              payload: { name: "Inverted challenge window", fiscal_year: 2026, total_appropriation_cents: 100000000, challenge_window_start: "2026-09-05T00:00:00Z", challenge_window_end: "2026-08-05T00:00:00Z", application_window_start: "2026-08-05T00:00:00Z", application_window_end: "2026-09-05T00:00:00Z" }
