# =============================================================================
# Task 1891 — Diaper Bank & Baby Supply Distribution
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 Difficulty Rules x 2 instances each = 18 instances.
# All chains assume the logical clock default 2026-08-01T00:00:00Z unless set.
# =============================================================================

scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: allocation_formula_need_weighted_vs_equal_split
        grounds:
          - calculations.monthly_allocation_formula
          - entities.AllocationLine.fields.allocated_units
        distinguishing_aspect: |
          Dual-variant logic on the ALLOCATION domain: identical agencies and
          identical pool (1000 units SIZE_1), NEED_WEIGHTED grants agency A 750
          while EQUAL_SPLIT grants agency A 500 — same inputs, different results.
        test_recipe:
          setup:
            - "Inventory initialized; SIZE_1 on_hand 1000, reserved 0 (available 1000)"
            - "Agency A: children_served_monthly 300, storage 100000 (cap 50000); Agency B: children 100, storage 100000"
            - "Run R1 period 2026-08 NEED_WEIGHTED computed; Run R2 period 2026-09 EQUAL_SPLIT computed; neither published (reservations only at publish, so both compute against available 1000)"
          setup_api_calls:
            - { call: "POST /inventory/initialize", payload: {}, as: WarehouseManager }
            - call: "POST /intake-batches"
              payload: { donor_name: "Donor X", lines: [{ size_code: "SIZE_1", quantity: 1000 }] }
              as: WarehouseManager
              captures: { b1: $.data.id }
            - { call: "POST /intake-batches/${b1}/post", payload: {}, as: WarehouseManager }
            - call: "POST /partner-agencies"
              payload: { name: "Agency A", agency_code: "AG-A", contact_email: "a@x.org", children_served_monthly: 300, storage_capacity_units: 100000 }
              as: BankAdmin
              captures: { ag_a: $.data.id }
            - call: "POST /partner-agencies"
              payload: { name: "Agency B", agency_code: "AG-B", contact_email: "b@x.org", children_served_monthly: 100, storage_capacity_units: 100000 }
              as: BankAdmin
              captures: { ag_b: $.data.id }
            - call: "POST /allocation-runs"
              payload: { period: "2026-08", formula_variant: "NEED_WEIGHTED" }
              as: BankAdmin
              captures: { r1: $.data.id }
            - { call: "POST /allocation-runs/${r1}/compute", payload: {}, as: BankAdmin }
            - call: "POST /allocation-runs"
              payload: { period: "2026-09", formula_variant: "EQUAL_SPLIT" }
              as: BankAdmin
              captures: { r2: $.data.id }
            - { call: "POST /allocation-runs/${r2}/compute", payload: {}, as: BankAdmin }
          trigger:
            - call: "GET /allocation-runs/${r1}/lines"
              payload: {}
              as: BankAdmin
              captures: { r1_a_units: "$.data[0].allocated_units", r1_b_units: "$.data[1].allocated_units" }
            - call: "GET /allocation-runs/${r2}/lines"
              payload: {}
              as: BankAdmin
              captures: { r2_a_units: "$.data[0].allocated_units", r2_b_units: "$.data[1].allocated_units" }
          assert:
            - "AllocationLine[0] of R1 (agency A, sorted children DESC) allocated_units == 750 (floor(1000*300/400))"
            - "AllocationLine[1] of R1 (agency B) allocated_units == 250"
            - "AllocationLine[0] of R2 (agency A) allocated_units == 500 (floor(1000/2))"
            - "AllocationLine[1] of R2 (agency B) allocated_units == 500"
            - "R1 agency A allocation (750) != R2 agency A allocation (500) for identical inputs"

      - name: forecast_trailing_actual_vs_booked_pipeline
        grounds:
          - calculations.size_mix_forecast
          - entities.Inventory.fields.sizes
        distinguishing_aspect: |
          Dual-variant logic on the INVENTORY domain (different entity domain from
          the allocation instance): with 280 units fulfilled in the trailing 28 days
          and a PUBLISHED line remainder of 420, TRAILING_ACTUAL forecasts 280 while
          BOOKED_PIPELINE forecasts 420 for the same size at the same clock instant.
        test_recipe:
          setup:
            - "Inventory initialized; SIZE_2 on_hand 700 via posted donation"
            - "Agency C (children 300, storage 100000); run 2026-08 NEED_WEIGHTED computed -> line SIZE_2 allocated 700; published (reserved 700)"
            - "Household H: 6 children (allotment 300), consent on file, ELIGIBLE"
            - "Event at site F-Site 2026-08-10 opened; issuance of 280 SIZE_2 recorded; event locked and completed -> issuance FULFILLED at 2026-08-01T00:00:00Z clock, line fulfilled 280 (PARTIALLY_FULFILLED), run stays PUBLISHED, on_hand 420 / reserved 420"
          setup_api_calls:
            - { call: "POST /inventory/initialize", payload: {}, as: WarehouseManager }
            - call: "POST /intake-batches"
              payload: { donor_name: "Donor Y", lines: [{ size_code: "SIZE_2", quantity: 700 }] }
              as: WarehouseManager
              captures: { b1: $.data.id }
            - { call: "POST /intake-batches/${b1}/post", payload: {}, as: WarehouseManager }
            - call: "POST /partner-agencies"
              payload: { name: "Agency C", agency_code: "AG-C", contact_email: "c@x.org", children_served_monthly: 300, storage_capacity_units: 100000 }
              as: BankAdmin
              captures: { ag_c: $.data.id }
            - call: "POST /allocation-runs"
              payload: { period: "2026-08", formula_variant: "NEED_WEIGHTED" }
              as: BankAdmin
              captures: { r1: $.data.id }
            - { call: "POST /allocation-runs/${r1}/compute", payload: {}, as: BankAdmin }
            - { call: "POST /allocation-runs/${r1}/publish", payload: {}, as: BankAdmin }
            - call: "POST /households"
              payload: { household_code: "HH-F1", children_sizes: ["SIZE_2", "SIZE_2", "SIZE_2", "SIZE_2", "SIZE_2", "SIZE_2"], consent_on_file: true }
              as: PrivacyOfficer
              captures: { hh: $.data.id }
            - call: "PATCH /households/${hh}"
              payload: { eligibility_status: "ELIGIBLE", eligibility_reason: "verified" }
              as: PrivacyOfficer
            - call: "POST /distribution-events"
              payload: { host_agency_id: "${ag_c}", site_name: "F-Site", starts_at: "2026-08-10T09:00:00Z", ends_at: "2026-08-10T12:00:00Z" }
              as: BankAdmin
              captures: { ev: $.data.id }
            - { call: "POST /distribution-events/${ev}/open", payload: {}, as: BankAdmin }
            - call: "POST /distribution-events/${ev}/issuances"
              payload: { household_id: "${hh}", lines: [{ size_code: "SIZE_2", quantity: 280 }] }
              as: PrivacyOfficer
            - { call: "POST /distribution-events/${ev}/lock", payload: {}, as: BankAdmin }
            - { call: "POST /distribution-events/${ev}/complete", payload: {}, as: BankAdmin }
          trigger:
            - call: "GET /inventory/forecast"
              payload: { variant: "TRAILING_ACTUAL" }
              as: WarehouseManager
            - call: "GET /inventory/forecast"
              payload: { variant: "BOOKED_PIPELINE" }
              as: WarehouseManager
          assert:
            - "TRAILING_ACTUAL sizes[SIZE_2].forecast_4wk_units == 280 (280 fulfilled in window / 4 weeks * 4)"
            - "TRAILING_ACTUAL sizes[SIZE_2].weeks_of_supply == 6.0 (420 / 70.00)"
            - "BOOKED_PIPELINE sizes[SIZE_2].forecast_4wk_units == 420 (PUBLISHED line remainder 700-280; no RECORDED issuances at OPEN/LOCKED events)"
            - "BOOKED_PIPELINE sizes[SIZE_2].weeks_of_supply is null"
            - "The two variants disagree: 280 != 420 for identical inventory and history"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: allocation_formula_floor_cap_waterfall
        grounds:
          - calculations.monthly_allocation_formula
        distinguishing_aspect: |
          Mode (a) combinatorial: >= 3 inputs with non-linear interaction — nested
          min(capacity cap, raw share, remaining pool), conditional BASE_FLOOR_UNITS
          branch, and waterfall order by children_served_monthly DESC.
        test_recipe:
          setup:
            - "Inventory: SIZE_3 on_hand 1000 (posted donation), reserved 0"
            - "Agency A children 1000 storage 300 (cap floor(300*0.5)=150); Agency B children 10 storage 10000; Agency C children 5 storage 10000"
            - "Run 2026-08 NEED_WEIGHTED computed; line order: size ASC, children DESC -> A, B, C"
          setup_api_calls:
            - { call: "POST /inventory/initialize", payload: {}, as: WarehouseManager }
            - call: "POST /intake-batches"
              payload: { donor_name: "Donor Z", lines: [{ size_code: "SIZE_3", quantity: 1000 }] }
              as: WarehouseManager
              captures: { b1: $.data.id }
            - { call: "POST /intake-batches/${b1}/post", payload: {}, as: WarehouseManager }
            - call: "POST /partner-agencies"
              payload: { name: "Agency A", agency_code: "AG-A", contact_email: "a@x.org", children_served_monthly: 1000, storage_capacity_units: 300 }
              as: BankAdmin
            - call: "POST /partner-agencies"
              payload: { name: "Agency B", agency_code: "AG-B", contact_email: "b@x.org", children_served_monthly: 10, storage_capacity_units: 10000 }
              as: BankAdmin
            - call: "POST /partner-agencies"
              payload: { name: "Agency C", agency_code: "AG-C", contact_email: "c@x.org", children_served_monthly: 5, storage_capacity_units: 10000 }
              as: BankAdmin
            - call: "POST /allocation-runs"
              payload: { period: "2026-08", formula_variant: "NEED_WEIGHTED" }
              as: BankAdmin
              captures: { r1: $.data.id }
            - { call: "POST /allocation-runs/${r1}/compute", payload: {}, as: BankAdmin }
          trigger:
            - call: "GET /allocation-runs/${r1}/lines"
              payload: {}
              as: BankAdmin
              captures: { a_units: "$.data[0].allocated_units", b_units: "$.data[1].allocated_units", c_units: "$.data[2].allocated_units" }
          assert:
            - "Agency A allocated_units == 150 (raw floor(1000*1000/1015)=985, but capacity cap 150 binds)"
            - "Agency B allocated_units == 100 (raw floor(1000*10/1015)=9 < BASE_FLOOR_UNITS -> floored to 100; remaining 850 >= 100)"
            - "Agency C allocated_units == 100 (raw floor(1000*5/1015)=4 -> floored to 100; remaining 750 >= 100)"
            - "Run total_allocated_units == 350; unallocated pool remainder 650 stays unreserved"

      - name: purchase_order_per_line_rounding_then_sum
        grounds:
          - calculations.purchase_order_total
          - entities.PurchaseOrder.fields.total_cost_cents
        distinguishing_aspect: |
          Mode (b) nested rounding — different mode from instance 1: the scaffold
          pins round-per-line-then-sum; sum-then-round would yield 4946 for these
          inputs, the pinned order yields 4947.
        test_recipe:
          setup:
            - "Grant G total 1000000 cents ACTIVE (window covers 2026-08)"
          setup_api_calls:
            - call: "POST /grants"
              payload: { funder_name: "Funder G", grant_code: "GR-1", total_amount_cents: 1000000, start_date: "2026-07-01T00:00:00Z", end_date: "2027-06-30T00:00:00Z" }
              as: FinanceManager
              captures: { g1: $.data.id }
          trigger:
            - call: "POST /purchase-orders"
              payload: { grant_id: "${g1}", vendor_name: "Wholesale Co", discount_pct: 0.10, lines: [{ size_code: "SIZE_1", quantity: 3, unit_cost_cents: 1055 }, { size_code: "SIZE_2", quantity: 7, unit_cost_cents: 333 }] }
              as: WarehouseManager
              as_user_id: "wm-user-1"
              captures: { po_total: $.data.total_cost_cents }
          assert:
            - "Line 1: round_half_up(3 * 1055 * 0.9) = round_half_up(2848.5) = 2849"
            - "Line 2: round_half_up(7 * 333 * 0.9) = round_half_up(2097.9) = 2098"
            - "PurchaseOrder.total_cost_cents == 4947 (2849 + 2098)"
            - "Sum-then-round would give round_half_up(5496 * 0.9) = 4946; the pinned per-line order differs and wins"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: intake_batch_post_recount_repost_cycle
        grounds:
          - state_machines.IntakeBatch.COUNTED_to_POSTED
          - state_machines.IntakeBatch.POSTED_to_COUNTED
        distinguishing_aspect: |
          Cyclic machine on IntakeBatch: COUNTED -> POSTED -> COUNTED (recount) ->
          POSTED loops legally, with stock withdrawn on recount and re-added on repost.
        test_recipe:
          setup:
            - "Inventory initialized; donation batch of 500 SIZE_1 exists in COUNTED"
          setup_api_calls:
            - { call: "POST /inventory/initialize", payload: {}, as: WarehouseManager }
            - call: "POST /intake-batches"
              payload: { donor_name: "Donor C", lines: [{ size_code: "SIZE_1", quantity: 500 }] }
              as: WarehouseManager
              captures: { b1: $.data.id }
          trigger:
            - { call: "POST /intake-batches/${b1}/post", payload: {}, as: WarehouseManager }
            - call: "POST /intake-batches/${b1}/recount"
              payload: { lines: [{ size_code: "SIZE_1", quantity: 480 }] }
              as: WarehouseManager
            - call: "POST /intake-batches/${b1}/post"
              payload: {}
              as: WarehouseManager
              captures: { b1_status: $.data.status, b1_val: $.data.valued_total_cents }
            - { call: "GET /inventory", payload: {}, as: WarehouseManager }
          assert:
            - "After first post: Inventory.sizes.SIZE_1.on_hand_units == 500"
            - "After recount: batch status COUNTED, on_hand_units == 0 (old lines withdrawn)"
            - "After second post: batch status POSTED, valued_total_cents == 15360 (480 * 32 fair-market SIZE_1)"
            - "Final Inventory.sizes.SIZE_1.on_hand_units == 480 — the cycle corrected stock without drift"

      - name: event_lock_unlock_revert_branch
        grounds:
          - state_machines.DistributionEvent.OPEN_to_LOCKED
          - state_machines.DistributionEvent.LOCKED_to_OPEN
          - state_machines.DistributionEvent.LOCKED_to_COMPLETED
        distinguishing_aspect: |
          Branching-with-revert on DistributionEvent (different entity from the
          IntakeBatch cycle): OPEN -> LOCKED -> OPEN -> LOCKED -> COMPLETED, and an
          issuance recorded after the revert fulfills normally.
        test_recipe:
          setup:
            - "Inventory: SIZE_2 on_hand 200 posted; agency D (children 300, storage big); run 2026-08 computed+published -> line SIZE_2 allocated 200, reserved 200"
            - "Household HH: 2 children (allotment 100), ELIGIBLE with consent"
            - "Event E site R-Site 2026-08-10 created and OPEN"
          setup_api_calls:
            - { call: "POST /inventory/initialize", payload: {}, as: WarehouseManager }
            - call: "POST /intake-batches"
              payload: { donor_name: "Donor D", lines: [{ size_code: "SIZE_2", quantity: 200 }] }
              as: WarehouseManager
              captures: { b1: $.data.id }
            - { call: "POST /intake-batches/${b1}/post", payload: {}, as: WarehouseManager }
            - call: "POST /partner-agencies"
              payload: { name: "Agency D", agency_code: "AG-D", contact_email: "d@x.org", children_served_monthly: 300, storage_capacity_units: 100000 }
              as: BankAdmin
              captures: { ag_d: $.data.id }
            - call: "POST /allocation-runs"
              payload: { period: "2026-08" }
              as: BankAdmin
              captures: { r1: $.data.id }
            - { call: "POST /allocation-runs/${r1}/compute", payload: {}, as: BankAdmin }
            - { call: "POST /allocation-runs/${r1}/publish", payload: {}, as: BankAdmin }
            - call: "POST /households"
              payload: { household_code: "HH-R1", children_sizes: ["SIZE_2", "SIZE_2"], consent_on_file: true }
              as: PrivacyOfficer
              captures: { hh: $.data.id }
            - call: "PATCH /households/${hh}"
              payload: { eligibility_status: "ELIGIBLE" }
              as: PrivacyOfficer
            - call: "POST /distribution-events"
              payload: { host_agency_id: "${ag_d}", site_name: "R-Site", starts_at: "2026-08-10T09:00:00Z", ends_at: "2026-08-10T12:00:00Z" }
              as: BankAdmin
              captures: { ev: $.data.id }
            - { call: "POST /distribution-events/${ev}/open", payload: {}, as: BankAdmin }
          trigger:
            - { call: "POST /distribution-events/${ev}/lock", payload: {}, as: BankAdmin }
            - call: "POST /distribution-events/${ev}/unlock"
              payload: {}
              as: BankAdmin
              captures: { ev_status: $.data.status }
            - call: "POST /distribution-events/${ev}/issuances"
              payload: { household_id: "${hh}", lines: [{ size_code: "SIZE_2", quantity: 100 }] }
              as: PrivacyOfficer
              captures: { iss: $.data.id }
            - { call: "POST /distribution-events/${ev}/lock", payload: {}, as: BankAdmin }
            - call: "POST /distribution-events/${ev}/complete"
              payload: {}
              as: BankAdmin
              captures: { ev_final: $.data.status, ev_issued: $.data.issued_total_units }
          assert:
            - "Unlock response status == OPEN (revert branch legal)"
            - "Issuance after unlock succeeds with 201 (recording only blocked while LOCKED, allowed again after unlock)"
            - "Final event status == COMPLETED with issued_total_units == 100"
            - "AllocationLine fulfilled_units == 100 of 200 -> status PARTIALLY_FULFILLED; run stays PUBLISHED"
            - "Inventory.sizes.SIZE_2.on_hand_units == 100 and reserved_units == 100"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: event_complete_cascade_to_run_auto_finalize
        grounds:
          - state_machines.DistributionEvent.LOCKED_to_COMPLETED
          - state_machines.AllocationLine.ALLOCATED_to_FULFILLED
          - state_machines.AllocationRun.PUBLISHED_to_FINALIZED
        distinguishing_aspect: |
          Depth-3 cascade from event completion: complete(Event) -> fulfill(Issuance)
          [hop 1] -> credit(AllocationLine.fulfilled_units/status) + debit(Inventory)
          [hop 2] -> auto-finalize(AllocationRun) when all lines FULFILLED [hop 3].
        test_recipe:
          setup:
            - "Inventory: SIZE_1 on_hand 300 posted; agency E (children 300); run 2026-08 computed+published -> single line allocated 300, reserved 300"
            - "Household: 6 children (allotment 300), ELIGIBLE; event opened; issuance 300 SIZE_1 recorded; event LOCKED"
          setup_api_calls:
            - { call: "POST /inventory/initialize", payload: {}, as: WarehouseManager }
            - call: "POST /intake-batches"
              payload: { donor_name: "Donor E", lines: [{ size_code: "SIZE_1", quantity: 300 }] }
              as: WarehouseManager
              captures: { b1: $.data.id }
            - { call: "POST /intake-batches/${b1}/post", payload: {}, as: WarehouseManager }
            - call: "POST /partner-agencies"
              payload: { name: "Agency E", agency_code: "AG-E", contact_email: "e@x.org", children_served_monthly: 300, storage_capacity_units: 100000 }
              as: BankAdmin
              captures: { ag_e: $.data.id }
            - call: "POST /allocation-runs"
              payload: { period: "2026-08" }
              as: BankAdmin
              captures: { r1: $.data.id }
            - { call: "POST /allocation-runs/${r1}/compute", payload: {}, as: BankAdmin }
            - { call: "POST /allocation-runs/${r1}/publish", payload: {}, as: BankAdmin }
            - call: "POST /households"
              payload: { household_code: "HH-C1", children_sizes: ["SIZE_1", "SIZE_1", "SIZE_1", "SIZE_1", "SIZE_1", "SIZE_1"], consent_on_file: true }
              as: PrivacyOfficer
              captures: { hh: $.data.id }
            - call: "PATCH /households/${hh}"
              payload: { eligibility_status: "ELIGIBLE" }
              as: PrivacyOfficer
            - call: "POST /distribution-events"
              payload: { host_agency_id: "${ag_e}", site_name: "C-Site", starts_at: "2026-08-10T09:00:00Z", ends_at: "2026-08-10T12:00:00Z" }
              as: BankAdmin
              captures: { ev: $.data.id }
            - { call: "POST /distribution-events/${ev}/open", payload: {}, as: BankAdmin }
            - call: "POST /distribution-events/${ev}/issuances"
              payload: { household_id: "${hh}", lines: [{ size_code: "SIZE_1", quantity: 300 }] }
              as: PrivacyOfficer
            - { call: "POST /distribution-events/${ev}/lock", payload: {}, as: BankAdmin }
          trigger:
            - { call: "POST /distribution-events/${ev}/complete", payload: {}, as: BankAdmin }
            - call: "GET /distribution-events/${ev}/issuances"
              payload: {}
              as: BankAdmin
              captures: { iss_status: "$.data[0].status" }
            - call: "GET /allocation-runs/${r1}/lines"
              payload: {}
              as: BankAdmin
              captures: { line_status: "$.data[0].status", line_fulfilled: "$.data[0].fulfilled_units" }
            - call: "GET /allocation-runs/${r1}"
              payload: {}
              as: BankAdmin
              captures: { run_status: $.data.status }
            - { call: "GET /inventory", payload: {}, as: WarehouseManager }
          assert:
            - "Issuance status == FULFILLED (hop 1)"
            - "AllocationLine fulfilled_units == 300 and status == FULFILLED (hop 2b; equality boundary flips status)"
            - "AllocationRun status == FINALIZED via the automatic system transition (hop 3)"
            - "Inventory.sizes.SIZE_1.on_hand_units == 0 and reserved_units == 0 (reservation consumed, not released)"

      - name: agency_suspend_release_cascade
        grounds:
          - state_machines.PartnerAgency.ACTIVE_to_SUSPENDED
          - state_machines.AllocationLine.PARTIALLY_FULFILLED_to_RELEASED
        distinguishing_aspect: |
          Depth-2 cascade from a DIFFERENT trigger (agency suspension, not event
          completion): suspend(Agency) -> release(AllocationLine remainder) [hop 1]
          -> decrement(Inventory.reserved_units) [hop 2].
        test_recipe:
          setup:
            - "Inventory: SIZE_3 on_hand 500 posted; agency F; run 2026-08 computed+published -> line allocated 500, reserved 500"
            - "Household 4 children (allotment 200) ELIGIBLE; event completed with issuance 200 -> line PARTIALLY_FULFILLED (200/500), reserved 300, on_hand 300"
          setup_api_calls:
            - { call: "POST /inventory/initialize", payload: {}, as: WarehouseManager }
            - call: "POST /intake-batches"
              payload: { donor_name: "Donor F", lines: [{ size_code: "SIZE_3", quantity: 500 }] }
              as: WarehouseManager
              captures: { b1: $.data.id }
            - { call: "POST /intake-batches/${b1}/post", payload: {}, as: WarehouseManager }
            - call: "POST /partner-agencies"
              payload: { name: "Agency F", agency_code: "AG-F", contact_email: "f@x.org", children_served_monthly: 300, storage_capacity_units: 100000 }
              as: BankAdmin
              captures: { ag_f: $.data.id }
            - call: "POST /allocation-runs"
              payload: { period: "2026-08" }
              as: BankAdmin
              captures: { r1: $.data.id }
            - { call: "POST /allocation-runs/${r1}/compute", payload: {}, as: BankAdmin }
            - { call: "POST /allocation-runs/${r1}/publish", payload: {}, as: BankAdmin }
            - call: "POST /households"
              payload: { household_code: "HH-S1", children_sizes: ["SIZE_3", "SIZE_3", "SIZE_3", "SIZE_3"], consent_on_file: true }
              as: PrivacyOfficer
              captures: { hh: $.data.id }
            - call: "PATCH /households/${hh}"
              payload: { eligibility_status: "ELIGIBLE" }
              as: PrivacyOfficer
            - call: "POST /distribution-events"
              payload: { host_agency_id: "${ag_f}", site_name: "S-Site", starts_at: "2026-08-10T09:00:00Z", ends_at: "2026-08-10T12:00:00Z" }
              as: BankAdmin
              captures: { ev: $.data.id }
            - { call: "POST /distribution-events/${ev}/open", payload: {}, as: BankAdmin }
            - call: "POST /distribution-events/${ev}/issuances"
              payload: { household_id: "${hh}", lines: [{ size_code: "SIZE_3", quantity: 200 }] }
              as: PrivacyOfficer
            - { call: "POST /distribution-events/${ev}/lock", payload: {}, as: BankAdmin }
            - { call: "POST /distribution-events/${ev}/complete", payload: {}, as: BankAdmin }
          trigger:
            - { call: "POST /partner-agencies/${ag_f}/suspend", payload: {}, as: BankAdmin }
            - call: "GET /allocation-runs/${r1}/lines"
              payload: {}
              as: BankAdmin
              captures: { line_status: "$.data[0].status", line_released: "$.data[0].released_units" }
            - { call: "GET /inventory", payload: {}, as: WarehouseManager }
          assert:
            - "AllocationLine status == RELEASED with released_units == 300 (allocated 500 - fulfilled 200)"
            - "Inventory.sizes.SIZE_3.reserved_units == 0 (500 reserved - 200 consumed - 300 released)"
            - "Inventory.sizes.SIZE_3.on_hand_units == 300 (fulfillment debit only)"
            - "Agency active_allocated_units == 0 and status == SUSPENDED"

  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: po_submit_state_error_beats_budget_error
        grounds:
          - validations[priority=4]
          - validations[priority=9]
          - errors[ERR_PO_NOT_SUBMITTABLE]
          - errors[ERR_GRANT_BUDGET_EXCEEDED]
        distinguishing_aspect: |
          Error-category pair state-vs-business_fiscal: a CANCELLED PO whose total
          (12000) also exceeds the grant's available (10000) must surface
          ERR_PO_NOT_SUBMITTABLE (priority 4), not ERR_GRANT_BUDGET_EXCEEDED (priority 9).
        test_recipe:
          setup:
            - "Grant total 10000 cents ACTIVE; PO (created by wm-user-1) total 12000 cents, already cancelled from DRAFT by WarehouseManager"
          setup_api_calls:
            - call: "POST /grants"
              payload: { funder_name: "Funder P", grant_code: "GR-P", total_amount_cents: 10000, start_date: "2026-07-01T00:00:00Z", end_date: "2027-06-30T00:00:00Z" }
              as: FinanceManager
              captures: { g1: $.data.id }
            - call: "POST /purchase-orders"
              payload: { grant_id: "${g1}", vendor_name: "Wholesale Co", lines: [{ size_code: "SIZE_1", quantity: 20, unit_cost_cents: 600 }] }
              as: WarehouseManager
              as_user_id: "wm-user-1"
              captures: { po: $.data.id }
            - { call: "POST /purchase-orders/${po}/cancel", payload: {}, as: WarehouseManager, as_user_id: "wm-user-1" }
          trigger:
            - call: "POST /purchase-orders/${po}/submit"
              payload: {}
              as: FinanceManager
              as_user_id: "fm-user-1"
              captures: { err: $.data.error_id }
          assert:
            - "Response is 409 with error_id ERR_PO_NOT_SUBMITTABLE"
            - "Response is NOT ERR_GRANT_BUDGET_EXCEEDED even though 12000 > 10000 available"
            - "Grant committed_cents stays 0"

      - name: issuance_privacy_error_beats_duplicate_error
        grounds:
          - validations[priority=5]
          - validations[priority=6]
          - errors[ERR_PRIVACY_RESTRICTED]
          - errors[ERR_DUPLICATE_HOUSEHOLD_ISSUANCE]
        distinguishing_aspect: |
          Error-category pair business_safety-vs-business_constraint (different pair
          from instance 1): a second issuance for a privacy_restricted household at
          the same event by an AgencyCoordinator must surface ERR_PRIVACY_RESTRICTED
          (priority 5), not ERR_DUPLICATE_HOUSEHOLD_ISSUANCE (priority 6).
        test_recipe:
          setup:
            - "Inventory SIZE_1 on_hand 500 posted; agency G; run 2026-08 published -> line 500"
            - "Household HH: privacy_restricted=true, consent on file, ELIGIBLE; 2 children (allotment 100)"
            - "Event E OPEN; PrivacyOfficer already recorded issuance #1 (10 SIZE_1) for HH at E"
          setup_api_calls:
            - { call: "POST /inventory/initialize", payload: {}, as: WarehouseManager }
            - call: "POST /intake-batches"
              payload: { donor_name: "Donor G", lines: [{ size_code: "SIZE_1", quantity: 500 }] }
              as: WarehouseManager
              captures: { b1: $.data.id }
            - { call: "POST /intake-batches/${b1}/post", payload: {}, as: WarehouseManager }
            - call: "POST /partner-agencies"
              payload: { name: "Agency G", agency_code: "AG-G", contact_email: "g@x.org", children_served_monthly: 300, storage_capacity_units: 100000 }
              as: BankAdmin
              captures: { ag_g: $.data.id }
            - call: "POST /allocation-runs"
              payload: { period: "2026-08" }
              as: BankAdmin
              captures: { r1: $.data.id }
            - { call: "POST /allocation-runs/${r1}/compute", payload: {}, as: BankAdmin }
            - { call: "POST /allocation-runs/${r1}/publish", payload: {}, as: BankAdmin }
            - call: "POST /households"
              payload: { household_code: "HH-P1", children_sizes: ["SIZE_1", "SIZE_1"], consent_on_file: true, privacy_restricted: true }
              as: PrivacyOfficer
              captures: { hh: $.data.id }
            - call: "PATCH /households/${hh}"
              payload: { eligibility_status: "ELIGIBLE" }
              as: PrivacyOfficer
            - call: "POST /distribution-events"
              payload: { host_agency_id: "${ag_g}", site_name: "P-Site", starts_at: "2026-08-10T09:00:00Z", ends_at: "2026-08-10T12:00:00Z" }
              as: BankAdmin
              captures: { ev: $.data.id }
            - { call: "POST /distribution-events/${ev}/open", payload: {}, as: BankAdmin }
            - call: "POST /distribution-events/${ev}/issuances"
              payload: { household_id: "${hh}", lines: [{ size_code: "SIZE_1", quantity: 10 }] }
              as: PrivacyOfficer
          trigger:
            - call: "POST /distribution-events/${ev}/issuances"
              payload: { household_id: "${hh}", lines: [{ size_code: "SIZE_1", quantity: 10 }] }
              as: AgencyCoordinator
              as_user_id: "${ag_g}"
              captures: { err: $.data.error_id }
          assert:
            - "Response is 403 with error_id ERR_PRIVACY_RESTRICTED"
            - "Response is NOT ERR_DUPLICATE_HOUSEHOLD_ISSUANCE even though HH already has an issuance at E"
            - "Household consumed_this_month_units stays 10"

  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: allotment_exact_remaining_boundary
        grounds:
          - calculations.household_monthly_allotment
          - errors[ERR_ALLOTMENT_EXCEEDED]
        distinguishing_aspect: |
          Boundary on the monthly-allotment metric (units): request == remaining
          succeeds (<= semantics), request == remaining + 1 fails — reached via
          POST /distribution-events/{id}/issuances.
        test_recipe:
          setup:
            - "Inventory SIZE_1 on_hand 1000 posted; agency H; run 2026-08 published -> line 1000"
            - "Household: 2 children -> allotment 100; ELIGIBLE with consent"
            - "Event E1 (2026-08-10) completed with issuance 60 fulfilled; event E2 (2026-08-11) OPEN"
          setup_api_calls:
            - { call: "POST /inventory/initialize", payload: {}, as: WarehouseManager }
            - call: "POST /intake-batches"
              payload: { donor_name: "Donor H", lines: [{ size_code: "SIZE_1", quantity: 1000 }] }
              as: WarehouseManager
              captures: { b1: $.data.id }
            - { call: "POST /intake-batches/${b1}/post", payload: {}, as: WarehouseManager }
            - call: "POST /partner-agencies"
              payload: { name: "Agency H", agency_code: "AG-H", contact_email: "h@x.org", children_served_monthly: 300, storage_capacity_units: 100000 }
              as: BankAdmin
              captures: { ag_h: $.data.id }
            - call: "POST /allocation-runs"
              payload: { period: "2026-08" }
              as: BankAdmin
              captures: { r1: $.data.id }
            - { call: "POST /allocation-runs/${r1}/compute", payload: {}, as: BankAdmin }
            - { call: "POST /allocation-runs/${r1}/publish", payload: {}, as: BankAdmin }
            - call: "POST /households"
              payload: { household_code: "HH-B1", children_sizes: ["SIZE_1", "SIZE_1"], consent_on_file: true }
              as: PrivacyOfficer
              captures: { hh: $.data.id }
            - call: "PATCH /households/${hh}"
              payload: { eligibility_status: "ELIGIBLE" }
              as: PrivacyOfficer
            - call: "POST /distribution-events"
              payload: { host_agency_id: "${ag_h}", site_name: "B-Site", starts_at: "2026-08-10T09:00:00Z", ends_at: "2026-08-10T10:00:00Z" }
              as: BankAdmin
              captures: { ev1: $.data.id }
            - { call: "POST /distribution-events/${ev1}/open", payload: {}, as: BankAdmin }
            - call: "POST /distribution-events/${ev1}/issuances"
              payload: { household_id: "${hh}", lines: [{ size_code: "SIZE_1", quantity: 60 }] }
              as: PrivacyOfficer
            - { call: "POST /distribution-events/${ev1}/lock", payload: {}, as: BankAdmin }
            - { call: "POST /distribution-events/${ev1}/complete", payload: {}, as: BankAdmin }
            - call: "POST /distribution-events"
              payload: { host_agency_id: "${ag_h}", site_name: "B-Site", starts_at: "2026-08-11T09:00:00Z", ends_at: "2026-08-11T10:00:00Z" }
              as: BankAdmin
              captures: { ev2: $.data.id }
            - { call: "POST /distribution-events/${ev2}/open", payload: {}, as: BankAdmin }
          trigger:
            - call: "POST /distribution-events/${ev2}/issuances"
              payload: { household_id: "${hh}", lines: [{ size_code: "SIZE_1", quantity: 40 }] }
              as: PrivacyOfficer
              captures: { iss2: $.data.id, iss2_total: $.data.total_units }
            - call: "POST /distribution-events"
              payload: { host_agency_id: "${ag_h}", site_name: "B-Site", starts_at: "2026-08-12T09:00:00Z", ends_at: "2026-08-12T10:00:00Z" }
              as: BankAdmin
              captures: { ev3: $.data.id }
            - { call: "POST /distribution-events/${ev3}/open", payload: {}, as: BankAdmin }
            - call: "POST /distribution-events/${ev3}/issuances"
              payload: { household_id: "${hh}", lines: [{ size_code: "SIZE_1", quantity: 1 }] }
              as: PrivacyOfficer
              captures: { err: $.data.error_id }
          assert:
            - "Issuance of exactly 40 succeeds (201): remaining was 100 - 60 = 40, and 40 <= 40 (equality allowed)"
            - "After it, remaining == 0 (60 fulfilled + 40 recorded = 100 == allotment)"
            - "The 1-unit issuance at E3 is rejected 422 ERR_ALLOTMENT_EXCEEDED (0 remaining; 1 > 0)"
            - "Household consumed_this_month_units == 100"

      - name: shift_capacity_exact_fill_boundary
        grounds:
          - state_machines.VolunteerShift.OPEN_to_FULL
          - errors[ERR_SHIFT_FULL]
        distinguishing_aspect: |
          Boundary on the headcount metric (different metric from allotment units,
          different endpoint): the signup that makes signup_count == capacity
          succeeds and flips status to FULL; the next one fails — reached via
          POST /volunteer-shifts/{id}/signups.
        test_recipe:
          setup:
            - "Shift capacity 2 on 2026-08-10 09:00-11:00 UTC"
          setup_api_calls:
            - call: "POST /volunteer-shifts"
              payload: { title: "Sorting", starts_at: "2026-08-10T09:00:00Z", ends_at: "2026-08-10T11:00:00Z", capacity: 2 }
              as: VolunteerCoordinator
              captures: { sh: $.data.id }
          trigger:
            - call: "POST /volunteer-shifts/${sh}/signups"
              payload: { volunteer_email: "v1@x.org", volunteer_name: "V One" }
              as: Volunteer
              captures: { c1: $.data.signup_count }
            - call: "POST /volunteer-shifts/${sh}/signups"
              payload: { volunteer_email: "v2@x.org", volunteer_name: "V Two" }
              as: Volunteer
              captures: { c2: $.data.signup_count, st2: $.data.status }
            - call: "POST /volunteer-shifts/${sh}/signups"
              payload: { volunteer_email: "v3@x.org", volunteer_name: "V Three" }
              as: Volunteer
              captures: { err: $.data.error_id }
          assert:
            - "Signup 1 -> signup_count == 1, status OPEN"
            - "Signup 2 -> signup_count == 2 == capacity succeeds and status flips to FULL (equality fills)"
            - "Signup 3 -> 409 ERR_SHIFT_FULL"
            - "Shift signups array still holds exactly v1 and v2"

  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: event_open_requires_active_agency
        grounds:
          - state_machines.DistributionEvent.SCHEDULED_to_OPEN
          - errors[ERR_AGENCY_NOT_ACTIVE]
        distinguishing_aspect: |
          Entity pair DistributionEvent -> PartnerAgency: an event whose host
          agency is SUSPENDED cannot transition SCHEDULED -> OPEN.
        test_recipe:
          setup:
            - "Agency I created then suspended (no allocation lines exist, so the release cascade is a no-op)"
            - "Event E site X-Site 2026-08-10 hosted by agency I, still SCHEDULED"
          setup_api_calls:
            - call: "POST /partner-agencies"
              payload: { name: "Agency I", agency_code: "AG-I", contact_email: "i@x.org", children_served_monthly: 100, storage_capacity_units: 10000 }
              as: BankAdmin
              captures: { ag_i: $.data.id }
            - call: "POST /distribution-events"
              payload: { host_agency_id: "${ag_i}", site_name: "X-Site", starts_at: "2026-08-10T09:00:00Z", ends_at: "2026-08-10T12:00:00Z" }
              as: BankAdmin
              captures: { ev: $.data.id }
            - { call: "POST /partner-agencies/${ag_i}/suspend", payload: {}, as: BankAdmin }
          trigger:
            - call: "POST /distribution-events/${ev}/open"
              payload: {}
              as: BankAdmin
              captures: { err: $.data.error_id }
          assert:
            - "Response is 409 ERR_AGENCY_NOT_ACTIVE"
            - "Event remains SCHEDULED (no partial transition)"

      - name: po_submit_requires_active_grant
        grounds:
          - state_machines.PurchaseOrder.DRAFT_to_SUBMITTED
          - errors[ERR_GRANT_NOT_ACTIVE]
        distinguishing_aspect: |
          Entity pair PurchaseOrder -> Grant (different pair from instance 1): a
          DRAFT PO whose grant has been CLOSED cannot transition DRAFT -> SUBMITTED.
        test_recipe:
          setup:
            - "Grant G (100000 cents) ACTIVE; PO created by wm-user-1 in DRAFT (total 1000 cents); grant then CLOSED (no SUBMITTED POs, so close is legal)"
          setup_api_calls:
            - call: "POST /grants"
              payload: { funder_name: "Funder Q", grant_code: "GR-Q", total_amount_cents: 100000, start_date: "2026-07-01T00:00:00Z", end_date: "2027-06-30T00:00:00Z" }
              as: FinanceManager
              captures: { g1: $.data.id }
            - call: "POST /purchase-orders"
              payload: { grant_id: "${g1}", vendor_name: "Wholesale Co", lines: [{ size_code: "SIZE_1", quantity: 1, unit_cost_cents: 1000 }] }
              as: WarehouseManager
              as_user_id: "wm-user-1"
              captures: { po: $.data.id }
            - { call: "POST /grants/${g1}/close", payload: {}, as: FinanceManager }
          trigger:
            - call: "POST /purchase-orders/${po}/submit"
              payload: {}
              as: FinanceManager
              as_user_id: "fm-user-1"
              captures: { err: $.data.error_id }
          assert:
            - "Response is 409 ERR_GRANT_NOT_ACTIVE"
            - "PO remains DRAFT; grant committed_cents stays 0"

  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: site_event_half_open_interval_adjacency
        grounds:
          - errors[ERR_SITE_SCHEDULE_CONFLICT]
          - validations[priority=6]
        distinguishing_aspect: |
          Interval semantics: half-open [starts_at, ends_at) on the site resource —
          back-to-back events (ends_at == starts_at) are legal, a 1-minute overlap
          is not. Resource entity: DistributionEvent.site_name.
        test_recipe:
          setup:
            - "Agency J ACTIVE"
          setup_api_calls:
            - call: "POST /partner-agencies"
              payload: { name: "Agency J", agency_code: "AG-J", contact_email: "j@x.org", children_served_monthly: 100, storage_capacity_units: 10000 }
              as: BankAdmin
              captures: { ag_j: $.data.id }
          trigger:
            - call: "POST /distribution-events"
              payload: { host_agency_id: "${ag_j}", site_name: "Dock", starts_at: "2026-08-10T09:00:00Z", ends_at: "2026-08-10T12:00:00Z" }
              as: BankAdmin
              captures: { ev1: $.data.id }
            - call: "POST /distribution-events"
              payload: { host_agency_id: "${ag_j}", site_name: "Dock", starts_at: "2026-08-10T12:00:00Z", ends_at: "2026-08-10T15:00:00Z" }
              as: BankAdmin
              captures: { ev2: $.data.id }
            - call: "POST /distribution-events"
              payload: { host_agency_id: "${ag_j}", site_name: "Dock", starts_at: "2026-08-10T11:59:00Z", ends_at: "2026-08-10T13:00:00Z" }
              as: BankAdmin
              captures: { err: $.data.error_id }
          assert:
            - "E1 (09:00-12:00) and E2 (12:00-15:00) both created: half-open intervals treat adjacency as non-overlapping"
            - "E3 (11:59-13:00) rejected 409 ERR_SITE_SCHEDULE_CONFLICT: 11:59 < 12:00 intersects E1"

      - name: volunteer_shift_thirty_minute_buffer
        grounds:
          - errors[ERR_SHIFT_OVERLAP]
          - validations[priority=6]
        distinguishing_aspect: |
          Different interval semantics from the site rule: a 30-minute buffer is
          applied to both ends of existing shifts — a gap of exactly 30 minutes is
          legal, 29 minutes is not. Resource entity: VolunteerShift signups keyed
          by volunteer_email.
        test_recipe:
          setup:
            - "Shifts S1 09:00-11:00, S2 11:30-13:00, S3 11:29-12:30 on 2026-08-10 (shift creation itself never conflicts; the rule binds at signup)"
          setup_api_calls:
            - call: "POST /volunteer-shifts"
              payload: { title: "S1", starts_at: "2026-08-10T09:00:00Z", ends_at: "2026-08-10T11:00:00Z", capacity: 5 }
              as: VolunteerCoordinator
              captures: { s1: $.data.id }
            - call: "POST /volunteer-shifts"
              payload: { title: "S2", starts_at: "2026-08-10T11:30:00Z", ends_at: "2026-08-10T13:00:00Z", capacity: 5 }
              as: VolunteerCoordinator
              captures: { s2: $.data.id }
            - call: "POST /volunteer-shifts"
              payload: { title: "S3", starts_at: "2026-08-10T11:29:00Z", ends_at: "2026-08-10T12:30:00Z", capacity: 5 }
              as: VolunteerCoordinator
              captures: { s3: $.data.id }
          trigger:
            - call: "POST /volunteer-shifts/${s1}/signups"
              payload: { volunteer_email: "v@x.org", volunteer_name: "V" }
              as: Volunteer
            - call: "POST /volunteer-shifts/${s2}/signups"
              payload: { volunteer_email: "v@x.org", volunteer_name: "V" }
              as: Volunteer
              captures: { s2_count: $.data.signup_count }
            - call: "POST /volunteer-shifts/${s3}/signups"
              payload: { volunteer_email: "v@x.org", volunteer_name: "V" }
              as: Volunteer
              captures: { err: $.data.error_id }
          assert:
            - "S2 signup succeeds: 11:30 is NOT < 11:00 + 30min (exactly-30-minute gap allowed)"
            - "S3 signup rejected 409 ERR_SHIFT_OVERLAP: 11:29 < 11:30 buffered boundary intersects S1"
            - "S2 signup_count == 1 after the rejection (no partial append)"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: intake_post_void_round_trip_conserves_on_hand
        grounds:
          - state_machines.IntakeBatch.COUNTED_to_POSTED
          - state_machines.IntakeBatch.POSTED_to_VOIDED
          - entities.Inventory.fields.sizes
        distinguishing_aspect: |
          Conserved quantity: per-size on_hand units. Invariant: on_hand ==
          sum(POSTED batch quantities) - sum(FULFILLED issuance quantities) +
          sum(adjustments); the post->void round trip restores the exact pre-post value.
        test_recipe:
          setup:
            - "Inventory initialized; batch1 1000 SIZE_4 POSTED (on_hand 1000); batch2 300 SIZE_4 in COUNTED"
          setup_api_calls:
            - { call: "POST /inventory/initialize", payload: {}, as: WarehouseManager }
            - call: "POST /intake-batches"
              payload: { donor_name: "Donor K", lines: [{ size_code: "SIZE_4", quantity: 1000 }] }
              as: WarehouseManager
              captures: { bk1: $.data.id }
            - { call: "POST /intake-batches/${bk1}/post", payload: {}, as: WarehouseManager }
            - call: "POST /intake-batches"
              payload: { donor_name: "Donor L", lines: [{ size_code: "SIZE_4", quantity: 300 }] }
              as: WarehouseManager
              captures: { bk2: $.data.id }
          trigger:
            - { call: "POST /intake-batches/${bk2}/post", payload: {}, as: WarehouseManager }
            - call: "GET /inventory"
              payload: {}
              as: WarehouseManager
            - { call: "POST /intake-batches/${bk2}/void", payload: { reason: "duplicate delivery" }, as: WarehouseManager }
            - call: "GET /inventory"
              payload: {}
              as: WarehouseManager
          assert:
            - "After batch2 post: Inventory.sizes.SIZE_4.on_hand_units == 1300"
            - "After batch2 void: Inventory.sizes.SIZE_4.on_hand_units == 1000 (exactly the pre-post value)"
            - "Batch2 status VOIDED; batch1 untouched (status POSTED)"

      - name: po_submit_cancel_round_trip_conserves_grant_cents
        grounds:
          - state_machines.PurchaseOrder.DRAFT_to_SUBMITTED
          - state_machines.PurchaseOrder.SUBMITTED_to_CANCELLED
          - calculations.grant_funds
        distinguishing_aspect: |
          Conserved quantity: grant money cents (different conserved quantity from
          diaper units). Invariant: available_cents == total - committed - spent at
          all times; the submit->cancel round trip restores committed_cents to 0.
        test_recipe:
          setup:
            - "Grant total 100000 cents ACTIVE; PO (wm-user-1) with lines 3x1055 SIZE_1 + 7x333 SIZE_2 at 10% discount -> total_cost_cents 4947, DRAFT"
          setup_api_calls:
            - call: "POST /grants"
              payload: { funder_name: "Funder R", grant_code: "GR-R", total_amount_cents: 100000, start_date: "2026-07-01T00:00:00Z", end_date: "2027-06-30T00:00:00Z" }
              as: FinanceManager
              captures: { g1: $.data.id }
            - call: "POST /purchase-orders"
              payload: { grant_id: "${g1}", vendor_name: "Wholesale Co", discount_pct: 0.10, lines: [{ size_code: "SIZE_1", quantity: 3, unit_cost_cents: 1055 }, { size_code: "SIZE_2", quantity: 7, unit_cost_cents: 333 }] }
              as: WarehouseManager
              as_user_id: "wm-user-1"
              captures: { po: $.data.id }
          trigger:
            - { call: "POST /purchase-orders/${po}/submit", payload: {}, as: FinanceManager, as_user_id: "fm-user-1" }
            - call: "GET /grants/${g1}"
              payload: {}
              as: FinanceManager
              captures: { g_committed: $.data.committed_cents }
            - { call: "POST /purchase-orders/${po}/cancel", payload: {}, as: FinanceManager }
            - call: "GET /grants/${g1}"
              payload: {}
              as: FinanceManager
              captures: { g_committed_after: $.data.committed_cents, g_available_after: $.data.available_cents, g_spent_after: $.data.spent_cents }
          assert:
            - "After submit: grant.committed_cents == 4947 and available_cents == 95053"
            - "After cancel: grant.committed_cents == 0, spent_cents == 0, available_cents == 100000 (exact pre-submit values)"
            - "PO status CANCELLED; grant status remains ACTIVE"
