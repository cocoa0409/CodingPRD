            - { call: "POST /press-qualifications/${pq1_id}/schedule-run-at-rate", payload: { scheduled_start: "2026-09-02T08:00:00Z", scheduled_end: "2026-09-02T12:00:00Z", target_parts_per_hour: 400 }, as: ProcessEngineer }
            - { call: "POST /press-qualifications/${pq1_id}/record-run-at-rate", payload: { actual_parts_per_hour: 380 }, as: QualityEngineer }
            - { call: "POST /press-qualifications", payload: { mold_id: "${mold2_id}", press_id: "${p150_id}" }, as: ProcessEngineer, captures: { pq2_id: $.data.id } }
            - { call: "POST /press-qualifications/${pq2_id}/schedule-run-at-rate", payload: { scheduled_start: "2026-09-03T08:00:00Z", scheduled_end: "2026-09-03T12:00:00Z", target_parts_per_hour: 400 }, as: ProcessEngineer }
            - { call: "POST /press-qualifications/${pq2_id}/record-run-at-rate", payload: { actual_parts_per_hour: 380 }, as: QualityEngineer }
