              as: PrincipalArchitect
              as_user_id: "principal-alice"
              captures: { ct: $.data.id }
            - call: "POST /phases"
              payload: { project_id: "${proj}", phase_code: "SD", weight_bp: 2000, milestone_name: "SD", milestone_due_at: "2026-08-01T00:00:00Z" }
