          assert:
            - "the first certify-balance returns HTTP 200 with balance_certified == true, required_reserve_cents == 500000000 and total_recommended_cents == 9000000000 against an appropriable 9500000000"
            - "the adopt returns HTTP 200 with RevenueForecast.${fc_2_id}.status == ADOPTED and RevenueForecast.${fc_1_id}.status == SUPERSEDED"
            - "BudgetCycle.${cyc_id}.adopted_general_fund_revenue_cents == 5000000000 and required_reserve_cents == 250000000 after the supersede"
            - "the second certify-balance returns HTTP 422 with error_id == ERR_BUDGET_NOT_BALANCED because 9000000000 > 4750000000"
            - "BudgetCycle.${cyc_id}.balance_certified retains the value true written by the earlier successful certification, since the rejected call writes nothing"

      - name: corner_priority_ordering_state_before_fiscal
