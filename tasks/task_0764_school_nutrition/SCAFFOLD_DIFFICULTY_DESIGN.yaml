  # ==========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: menu_cycle_reject_revert_cycle
        grounds:
          - state_machines.MenuCycle.UNDER_REVIEW_to_DRAFT
          - state_machines.MenuCycle.DRAFT_to_UNDER_REVIEW
          - state_machines.MenuCycle.UNDER_REVIEW_to_APPROVED
        distinguishing_aspect: "MenuCycle is non-linear via the UNDER_REVIEW->DRAFT reject revert: DRAFT->UNDER_REVIEW->DRAFT(reject)->UNDER_REVIEW->APPROVED is a cycle, not a one-way pipeline."
        test_recipe:
          setup:
            - "A compliant DRAFT lunch menu submitted for review."
          setup_api_calls:
            - { call: "POST /nutrition/sites", payload: { name: "Cyc", site_code: "CYC-1" }, as: PlatformAdmin, captures: { site_id: "$.data.id" } }
            - { call: "POST /nutrition/food-items", payload: { name: "Chicken Patty", category: "ENTREE", meat_alt_oz_eq: 2.0 }, as: PlatformAdmin, captures: { f_ent: "$.data.id" } }
            - { call: "POST /nutrition/food-items", payload: { name: "WG Roll", category: "GRAIN", grain_oz_eq: 1.0, is_whole_grain_rich: true }, as: PlatformAdmin, captures: { f_grn: "$.data.id" } }
            - { call: "POST /nutrition/food-items", payload: { name: "Apple", category: "FRUIT", fruit_cup: 0.75 }, as: PlatformAdmin, captures: { f_fru: "$.data.id" } }
            - { call: "POST /nutrition/food-items", payload: { name: "Milk", category: "MILK" }, as: PlatformAdmin, captures: { f_milk: "$.data.id" } }
            - { call: "POST /nutrition/menu-cycles", payload: { site_id: "${site_id}", meal_type: "LUNCH", grade_group: "GRADES_9_12", effective_date: "2026-04-01", end_date: "2026-06-30", components: [ { food_item_id: "${f_ent}", component: "MEAT_MEAT_ALT", planned_servings: 1, serving_amount: 1 }, { food_item_id: "${f_grn}", component: "GRAINS", planned_servings: 1, serving_amount: 1 }, { food_item_id: "${f_fru}", component: "FRUIT", planned_servings: 1, serving_amount: 1 }, { food_item_id: "${f_milk}", component: "MILK", planned_servings: 1, serving_amount: 1 } ] }, as: MenuPlanner, captures: { mc_id: "$.data.id" } }
            - { call: "POST /nutrition/menu-cycles/${mc_id}/submit", payload: {}, as: MenuPlanner, as_user_id: "planner_1" }
          trigger:
            - { call: "POST /nutrition/menu-cycles/${mc_id}/reject", payload: { rejection_note: "swap the entree" }, as: NutritionDirector, as_user_id: "dir_1", captures: { st1: "$.data.status" } }
            - { call: "POST /nutrition/menu-cycles/${mc_id}/submit", payload: {}, as: MenuPlanner, as_user_id: "planner_1" }
            - { call: "POST /nutrition/menu-cycles/${mc_id}/approve", payload: {}, as: NutritionDirector, as_user_id: "dir_1", captures: { st2: "$.data.status" } }
          assert:
            - "MenuCycle.${mc_id}.status == DRAFT immediately after reject"
            - "MenuCycle.${mc_id}.rejection_note == 'swap the entree'"
            - "MenuCycle.${mc_id}.status == APPROVED after resubmit+approve"

      - name: reimbursement_claim_recall_cycle
        grounds:
          - state_machines.ReimbursementClaim.DRAFT_to_SUBMITTED
          - state_machines.ReimbursementClaim.SUBMITTED_to_DRAFT
          - entities.ReimbursementClaim.fields.submitted_by_user_id
        distinguishing_aspect: "ReimbursementClaim is non-linear via the SUBMITTED->DRAFT recall edge: DRAFT->SUBMITTED->DRAFT is a cycle on a different entity than MenuCycle."
        test_recipe:
          setup:
            - "A DRAFT claim for an empty month (counts all zero), created then submitted."
          setup_api_calls:
            - { call: "POST /nutrition/sites", payload: { name: "Clm", site_code: "CLM-1" }, as: PlatformAdmin, captures: { site_id: "$.data.id" } }
            - { call: "POST /nutrition/reimbursement-claims", payload: { site_id: "${site_id}", claim_month: "2026-04" }, as: NutritionDirector, as_user_id: "dir_create", captures: { claim_id: "$.data.id", claim_v: "$.data.version" } }
            - { call: "POST /nutrition/reimbursement-claims/${claim_id}/submit", payload: { expected_claim_version: "${claim_v}" }, as: NutritionDirector, as_user_id: "dir_submit", captures: { st_sub: "$.data.status" } }
          trigger:
            - { call: "POST /nutrition/reimbursement-claims/${claim_id}/recall", payload: {}, as: NutritionDirector, as_user_id: "dir_submit", captures: { st_recall: "$.data.status" } }
          assert:
            - "ReimbursementClaim.${claim_id}.status == SUBMITTED after submit"
            - "ReimbursementClaim.${claim_id}.status == DRAFT after recall"
            - "ReimbursementClaim.${claim_id}.submitted_by_user_id is null after recall"

