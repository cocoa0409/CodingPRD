            - { call: "POST /air-ambulance/invoices/${inv_id}/payer-response", payload: { outcome: "PAID", paid_cents: 400000, contractual_adjustment_cents: 100000 }, as: BillingSpecialist }
          assert:
            - "d == GO (FIXED_WING DAY: ceiling 2000 >= 800 and !< 960; vis 5.0 >= 2.0 and !< 2.5; wind 20 !> 25)"
            - "total == 952408 (950000 + round(0.5*4500)=2250 + round(2250*0.07)=158)"
            - "dim == MEMBER_PROTECTED (effective_from 2026-08-03 <= completion date 2026-08-03, equality inclusive)"
            - "Invoice.${inv_id}.membership_id == ${mem_id}"
          # note: the write-off itself is exercised in membership_writeoff_boundary corner;
          # this instance pins the finalize-time eligibility boundary.

  # ---------------------------------------------------------------- Rule 7
  - rule_id: cross_entity_state_dependency
    instances:
      - name: invoice_submit_requires_pcr_qa_approved
        grounds:
          - validations[priority=17]
          - state_machines.Invoice.FINALIZED_to_SUBMITTED
          - state_machines.PatientCareReport.SUBMITTED_to_QA_APPROVED
        distinguishing_aspect: |
          Entity pair Invoice -> PatientCareReport: the FINALIZED -> SUBMITTED
          transition is gated on the PCR (a different aggregate) being in
          QA_APPROVED; SUBMITTED PCR blocks with ERR_PCR_NOT_APPROVED, and the
          gate opens only after a qa-review flips the PCR.
        test_recipe:
          setup:
            - "BLS rotor mission COMPLETED at clock 2026-08-01; invoice FINALIZED; PCR authored by the pilot and SUBMITTED (not yet reviewed)"
          setup_api_calls:
            - { call: "POST /air-ambulance/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: OpsAdmin }
            - { call: "POST /air-ambulance/bases", payload: { name: "Base Rho", region: "SW-US" }, as: OpsAdmin, captures: { base_id: "$.data.id" } }
            - { call: "POST /air-ambulance/aircraft", payload: { base_id: "${base_id}", tail_number: "N606XR", aircraft_class: "ROTOR_WING", medical_config: "BLS_CAPABLE" }, as: OpsAdmin, captures: { ac_id: "$.data.id" } }
