  - rule_id: priority_pair_validation_conflict
    instances:
      - name: withdrawal_order_safety_outranks_hoist_capacity_constraint_on_run_create
        grounds:
          - validations[priority=22]
          - validations[priority=31]
          - calculations.mine_effective_hoist_capacity
          - state_machines.Mine.compliance_state.COMPLIANT_to_WITHDRAWAL_ORDER
          - concurrency_rules[production-run-create-stale-mine]
        distinguishing_aspect: |
          Category pair business_safety (priority 22, ERR_MINE_WITHDRAWAL_ORDER_ACTIVE) versus
          business_constraint (priority 31, ERR_HOIST_CAPACITY_EXCEEDED) on POST /salt/production-runs:
          a mine under a withdrawal order has effective capacity 0.00 so BOTH rows are violated by the
          same request, and the safety row's error is the one returned.
        test_recipe:
          setup:
            - "Clock at 2026-08-10T00:00:00Z."
            - "Mine Retsof (NY, rated 24000 t/day) still HOIST_AVAILABLE but compliance_state WITHDRAWAL_ORDER, so effective_hoist_tons_per_day == 0.00."
            - "Panel P-1 PRODUCING with recoverable_tons 585600.00 (the pillar bonus was withdrawn with the citation) and open_defect false."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: MinePlanner
