  # ===================================================================
  # Endpoints (Table 5)
  # ===================================================================
  - section: endpoints
    instances:
      - name: capacity_day_list_pagination_envelope
        claim_type: listing
        grounds: [response_envelope, endpoints]
        distinguishing_aspect: "List endpoints honor limit/offset and report total_count and has_more per the fixed envelope (default limit 10)."
        test_recipe:
          setup: ["three capacity days exist (2026-08-20, 21, 22)"]
          setup_api_calls:
            - { call: "POST /locker/capacity-days", payload: { date: "2026-08-20", capacity_head: 1 }, as: PlantManager }
            - { call: "POST /locker/capacity-days", payload: { date: "2026-08-21", capacity_head: 1 }, as: PlantManager }
            - { call: "POST /locker/capacity-days", payload: { date: "2026-08-22", capacity_head: 1 }, as: PlantManager }
          trigger:
            - { call: "GET /locker/capacity-days", payload: { limit: 2, offset: 0 }, as: PlantOperator }
            - { call: "GET /locker/capacity-days", payload: { limit: 2, offset: 2 }, as: PlantOperator }
          assert:
            - "page 1: data length 2, total_count == 3, has_more == true"
            - "page 2 (offset 2): data length 1, total_count == 3, has_more == false"
            - "every success response carries meta.api_request_id and meta.api_request_timestamp"

      - name: run_daily_output_lists_swept_ids
        claim_type: computed_read
        grounds: [endpoints]
        distinguishing_aspect: "The ops checkpoint returns the ids it acted on (expired_appointment_ids, no_show_appointment_ids, abandoned_storage_ids), all empty when nothing is due."
        test_recipe:
          setup: ["one PENDING_DEPOSIT appointment well inside its 48h window (booked at clock default)"]
          setup_api_calls:
            - { call: "POST /locker/customers", payload: { name: "Ann Orr", phone: "555-0101", email: "ann@x.com" }, as: PlantOperator, captures: { c1: $.data.id } }
            - { call: "POST /locker/capacity-days", payload: { date: "2026-08-20", capacity_head: 1 }, as: PlantManager, captures: { cd1: $.data.id } }
            - { call: "POST /locker/appointments", payload: { customer_id: "${c1}", capacity_day_id: "${cd1}", species: "BEEF", head_count: 1 }, as: Customer, as_user_id: "${c1}", captures: { appt: $.data.id } }
          trigger:
            - { call: "POST /locker/ops/run-daily", payload: {}, as: PlantOperator, captures: { exp: $.data.expired_appointment_ids, ns: $.data.no_show_appointment_ids, ab: $.data.abandoned_storage_ids } }
          assert:
            - "all three id lists are empty"
            - "appointment remains PENDING_DEPOSIT"

  # ===================================================================
  # Errors (Table 6) — stubs for catalog entries whose trigger is
  # already exercised by a §1.8 instance
  # ===================================================================
  - section: errors
    instances:
      - name: error_capacity_full_trigger
        claim_type: violation_to_error
        grounds: ["errors[ERR_CAPACITY_FULL]"]
        excluded_because:
          difficulty_instance: capacity_day_head_count_aggregate_overflow
          rationale: "ERR_CAPACITY_FULL asserted twice there (pending-hold and confirmed-hold paths)."
      - name: error_freezer_full_trigger
        claim_type: violation_to_error
        grounds: ["errors[ERR_FREEZER_FULL]"]
        excluded_because:
          difficulty_instance: freezer_units_half_open_window_occupancy
          rationale: "ERR_FREEZER_FULL asserted on the 5th share completion there."
      - name: error_split_under_allocated_trigger
        claim_type: violation_to_error
        grounds: ["errors[ERR_SPLIT_UNDER_ALLOCATED]"]
        excluded_because:
          difficulty_instance: share_create_delete_roundtrip_preserves_unallocated_fraction
          rationale: "Finalize with zero allocated fraction asserted there."
      - name: error_cut_sheet_missing_trigger
        claim_type: violation_to_error
        grounds: ["errors[ERR_CUT_SHEET_MISSING]"]
        excluded_because:
          difficulty_instance: start_fab_requires_all_cut_sheets_submitted
          rationale: "Asserted as the gated failure before sheet 2 is submitted."

  # ===================================================================
  # RBAC (Table 7)
  # ===================================================================
  - section: rbac
    instances:
      - name: customer_cannot_create_capacity_day
        claim_type: rbac_denial
        grounds: ["roles[PlantManager]", "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "Capacity planning is PlantManager-exclusive; both Customer and PlantOperator are denied."
        test_recipe:
          setup: ["c1 exists"]
          setup_api_calls:
            - { call: "POST /locker/customers", payload: { name: "Ann Orr", phone: "555-0101", email: "ann@x.com" }, as: PlantOperator, captures: { c1: $.data.id } }
          trigger:
            - { call: "POST /locker/capacity-days", payload: { date: "2026-08-20", capacity_head: 1 }, as: Customer, as_user_id: "${c1}", captures: { err1: $.data.error_id } }
            - { call: "POST /locker/capacity-days", payload: { date: "2026-08-20", capacity_head: 1 }, as: PlantOperator, captures: { err2: $.data.error_id } }
          assert:
            - "both attempts rejected: error_id == ERR_FORBIDDEN (HTTP 403)"

      - name: customer_cannot_read_others_appointment
        claim_type: rbac_denial
        grounds: ["roles[Customer]", "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "Entity-backed ownership: customer c2 reading c1's appointment is denied even though Customer is an allowed role on the endpoint."
        test_recipe:
          setup: ["c1 (owner) and c2 exist; c1 has a booked appointment"]
          setup_api_calls:
            - { call: "POST /locker/customers", payload: { name: "Ann Orr", phone: "555-0101", email: "ann@x.com" }, as: PlantOperator, captures: { c1: $.data.id } }
            - { call: "POST /locker/customers", payload: { name: "Bob Venn", phone: "555-0102", email: "bob@x.com" }, as: PlantOperator, captures: { c2: $.data.id } }
            - { call: "POST /locker/capacity-days", payload: { date: "2026-08-20", capacity_head: 1 }, as: PlantManager, captures: { cd1: $.data.id } }
            - { call: "POST /locker/appointments", payload: { customer_id: "${c1}", capacity_day_id: "${cd1}", species: "BEEF", head_count: 1 }, as: Customer, as_user_id: "${c1}", captures: { appt: $.data.id } }
          trigger:
            - { call: "GET /locker/appointments/${appt}", payload: {}, as: Customer, as_user_id: "${c2}", captures: { err: $.data.error_id } }
          assert:
            - "HTTP 403; error_id == ERR_FORBIDDEN"

      - name: operator_cannot_waive_storage_manager_can
        claim_type: rbac_denial
        grounds: ["roles[PlantManager]", "roles[PlantOperator]", "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "Hierarchical override: waive-storage is manager-exclusive; the operator is denied, the manager succeeds and the storage component drops out of the total."
        test_recipe:
          setup: ["full flow to STORED (ready 2026-08-04); clock at 2026-08-13 -> days_stored 9, 2 billable days -> accrued 1000; invoice total 16500 (15500 + 1000) unpaid"]
          setup_api_calls:
            - { call: "POST /locker/customers", payload: { name: "Ann Orr", phone: "555-0101", email: "ann@x.com" }, as: PlantOperator, captures: { c1: $.data.id } }
            - { call: "POST /locker/capacity-days", payload: { date: "2026-08-20", capacity_head: 1 }, as: PlantManager, captures: { cd1: $.data.id } }
            - { call: "POST /locker/appointments", payload: { customer_id: "${c1}", capacity_day_id: "${cd1}", species: "HOG", head_count: 1 }, as: Customer, as_user_id: "${c1}", captures: { appt: $.data.id } }
            - { call: "POST /locker/appointments/${appt}/pay-deposit", payload: { amount_cents: 7500 }, as: Customer, as_user_id: "${c1}" }
            - { call: "GET /locker/appointments/${appt}/animals", payload: {}, as: PlantOperator, captures: { an1: "$.data[0].id" } }
            - { call: "POST /locker/animals/${an1}/receive", payload: { tag_id: "TAG-H1", live_weight_lbs: 280.0 }, as: PlantOperator }
            - { call: "POST /locker/animals/${an1}/slaughter", payload: {}, as: PlantOperator }
            - { call: "POST /locker/animals/${an1}/weigh", payload: { hanging_weight_lbs: 200.0 }, as: PlantOperator }
            - { call: "POST /locker/animals/${an1}/shares", payload: { owner_customer_id: "${c1}", share_fraction: 1.0, intended_use: "OWNER_USE" }, as: Customer, as_user_id: "${c1}", captures: { s1: $.data.id } }
            - { call: "POST /locker/animals/${an1}/shares/finalize", payload: {}, as: PlantOperator }
            - { call: "POST /locker/shares/${s1}/cut-sheet", payload: { grind_pct: 30, package_weight_lbs: 2.0 }, as: Customer, as_user_id: "${c1}", captures: { cs1: $.data.id } }
            - { call: "POST /locker/cut-sheets/${cs1}/submit", payload: {}, as: Customer, as_user_id: "${c1}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-04T00:00:00Z" }, as: PlantManager }
            - { call: "POST /locker/animals/${an1}/start-fabrication", payload: {}, as: PlantOperator }
            - { call: "POST /locker/animals/${an1}/complete-fabrication", payload: {}, as: PlantOperator }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-13T00:00:00Z" }, as: PlantManager }
            - { call: "GET /locker/invoices", payload: { share_id: "${s1}" }, as: PlantOperator, captures: { inv1: "$.data[0].id" } }
          trigger:
            - { call: "POST /locker/invoices/${inv1}/waive-storage", payload: {}, as: PlantOperator, captures: { err: $.data.error_id } }
            - { call: "POST /locker/invoices/${inv1}/waive-storage", payload: {}, as: PlantManager, captures: { waived: $.data.storage_waived, tot: $.data.total_cents } }
          assert:
            - "operator attempt rejected: error_id == ERR_FORBIDDEN"
            - "manager succeeds: storage_waived == true and total_cents == 15500 (storage component 1000 removed)"

  # ===================================================================
  # Cross-Cutting Complexity Layers
  # ===================================================================
  - section: complexity_layers
    instances:
      - name: occ_stale_reschedule_rejected_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[appointment-reschedule-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Rescheduling with an expected_appointment_version one behind the observed version is rejected 412; rescheduling with the current version succeeds."
        test_recipe:
          setup: ["c1 ACTIVE; CapacityDays 2026-08-20 (booked) and 2026-08-21 (free) cap 1; appointment CONFIRMED at version 2 (1 create + 1 pay-deposit)"]
          setup_api_calls:
            - { call: "POST /locker/customers", payload: { name: "Ann Orr", phone: "555-0101", email: "ann@x.com" }, as: PlantOperator, captures: { c1: $.data.id } }
            - { call: "POST /locker/capacity-days", payload: { date: "2026-08-20", capacity_head: 1 }, as: PlantManager, captures: { cd1: $.data.id } }
            - { call: "POST /locker/capacity-days", payload: { date: "2026-08-21", capacity_head: 1 }, as: PlantManager, captures: { cd2: $.data.id } }
            - { call: "POST /locker/appointments", payload: { customer_id: "${c1}", capacity_day_id: "${cd1}", species: "BEEF", head_count: 1 }, as: Customer, as_user_id: "${c1}", captures: { appt: $.data.id } }
            - { call: "POST /locker/appointments/${appt}/pay-deposit", payload: { amount_cents: 15000 }, as: Customer, as_user_id: "${c1}", captures: { a_v: $.data.version } }
          trigger:
            - { call: "POST /locker/appointments/${appt}/reschedule", payload: { new_capacity_day_id: "${cd2}", expected_appointment_version: "${a_v} - 1" }, as: Customer, as_user_id: "${c1}", captures: { err: $.data.error_id } }
            - { call: "POST /locker/appointments/${appt}/reschedule", payload: { new_capacity_day_id: "${cd2}", expected_appointment_version: "${a_v}" }, as: Customer, as_user_id: "${c1}", captures: { a_date: $.data.appointment_date, a_v2: $.data.version } }
          assert:
            - "stale attempt (${a_v} - 1): HTTP 412, error_id == ERR_STALE_VERSION, appointment unmoved"
            - "current attempt (${a_v}): succeeds, appointment_date == '2026-08-21', version == ${a_v} + 1"

      - name: occ_stale_revise_rejected_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[cut-sheet-revise-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Revising a cut sheet with a stale expected_cut_sheet_version is rejected 412 even from DRAFT (where revision is otherwise always legal) — a true OCC case with no status signal."
        test_recipe:
          setup: ["HOG animal HANGING with finalized 1.0 share; cut sheet DRAFT at version 1"]
          setup_api_calls:
            - { call: "POST /locker/customers", payload: { name: "Ann Orr", phone: "555-0101", email: "ann@x.com" }, as: PlantOperator, captures: { c1: $.data.id } }
            - { call: "POST /locker/capacity-days", payload: { date: "2026-08-20", capacity_head: 1 }, as: PlantManager, captures: { cd1: $.data.id } }
            - { call: "POST /locker/appointments", payload: { customer_id: "${c1}", capacity_day_id: "${cd1}", species: "HOG", head_count: 1 }, as: Customer, as_user_id: "${c1}", captures: { appt: $.data.id } }
            - { call: "POST /locker/appointments/${appt}/pay-deposit", payload: { amount_cents: 7500 }, as: Customer, as_user_id: "${c1}" }
            - { call: "GET /locker/appointments/${appt}/animals", payload: {}, as: PlantOperator, captures: { an1: "$.data[0].id" } }
            - { call: "POST /locker/animals/${an1}/receive", payload: { tag_id: "TAG-H1", live_weight_lbs: 280.0 }, as: PlantOperator }
            - { call: "POST /locker/animals/${an1}/slaughter", payload: {}, as: PlantOperator }
            - { call: "POST /locker/animals/${an1}/weigh", payload: { hanging_weight_lbs: 200.0 }, as: PlantOperator }
            - { call: "POST /locker/animals/${an1}/shares", payload: { owner_customer_id: "${c1}", share_fraction: 1.0, intended_use: "OWNER_USE" }, as: Customer, as_user_id: "${c1}", captures: { s1: $.data.id } }
            - { call: "POST /locker/animals/${an1}/shares/finalize", payload: {}, as: PlantOperator }
            - { call: "POST /locker/shares/${s1}/cut-sheet", payload: { grind_pct: 30, package_weight_lbs: 2.0 }, as: Customer, as_user_id: "${c1}", captures: { cs1: $.data.id, cs_v: $.data.version } }
          trigger:
            - { call: "POST /locker/cut-sheets/${cs1}/revise", payload: { expected_cut_sheet_version: "${cs_v} - 1", grind_pct: 25 }, as: Customer, as_user_id: "${c1}", captures: { err: $.data.error_id } }
            - { call: "POST /locker/cut-sheets/${cs1}/revise", payload: { expected_cut_sheet_version: "${cs_v}", grind_pct: 25 }, as: Customer, as_user_id: "${c1}", captures: { cs_g: $.data.grind_pct, cs_v2: $.data.version } }
          assert:
            - "stale revise: HTTP 412, error_id == ERR_STALE_VERSION, grind_pct stays 30"
            - "current revise: succeeds, grind_pct == 25, version == ${cs_v} + 1"

  # ===================================================================
  # Consistency Model
  # ===================================================================
  - section: consistency_model
    instances:
      - name: immediate_visibility_after_confirm
        claim_type: immediate_consistency
        grounds: [complexity_profile]
        distinguishing_aspect: "Immediate consistency: the pay-deposit response and a follow-up read both show CONFIRMED, and the cascade-created animals are listable in the same clock tick."
        test_recipe:
          setup: ["c1 ACTIVE; CapacityDay 2026-08-20 cap 2; BEEF head 2 booking (deposit 30000)"]
          setup_api_calls:
            - { call: "POST /locker/customers", payload: { name: "Ann Orr", phone: "555-0101", email: "ann@x.com" }, as: PlantOperator, captures: { c1: $.data.id } }
            - { call: "POST /locker/capacity-days", payload: { date: "2026-08-20", capacity_head: 2 }, as: PlantManager, captures: { cd1: $.data.id } }
            - { call: "POST /locker/appointments", payload: { customer_id: "${c1}", capacity_day_id: "${cd1}", species: "BEEF", head_count: 2 }, as: Customer, as_user_id: "${c1}", captures: { appt: $.data.id } }
          trigger:
            - { call: "POST /locker/appointments/${appt}/pay-deposit", payload: { amount_cents: 30000 }, as: Customer, as_user_id: "${c1}", captures: { a_st: $.data.status } }
            - { call: "GET /locker/appointments/${appt}/animals", payload: {}, as: PlantOperator, captures: { an1_st: "$.data[0].status", an2_st: "$.data[1].status" } }
            - { call: "GET /locker/capacity-days", payload: { date_from: "2026-08-20", date_to: "2026-08-20" }, as: PlantOperator, captures: { cd_booked: "$.data[0].booked_head" } }
          assert:
            - "pay-deposit response already shows status == CONFIRMED"
            - "animals list immediately returns 2 rows, both EXPECTED, species BEEF"
            - "CapacityDay.booked_head == 2 (reservation visible since booking, unchanged by confirm)"
