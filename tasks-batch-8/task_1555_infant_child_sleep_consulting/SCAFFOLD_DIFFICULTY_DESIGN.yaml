      - name: consultant_capacity_boundary
        grounds:
          - calculations.consultant_capacity_check
          - errors[ERR_CONSULTANT_AT_CAPACITY]
        distinguishing_aspect: |
          Metric = consultant active_case_count (threshold >= max_active_cases
          rejects), a different metric from the sibling instance's reviewed-log
          count, exercised through a different endpoint (POST /cases). With
          max_active_cases 1: creation at count 0 (== max - 1) succeeds; creation
          at count 1 (== max) is rejected.
