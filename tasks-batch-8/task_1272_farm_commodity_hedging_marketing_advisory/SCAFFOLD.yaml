  - { method: GET, path: "/advisory/advisory-agreements", description: "List agreements", roles: [CommodityAdvisor, Grower, ComplianceOfficer], code: 200, input: ["operation_id?", "status?", "limit?", "offset?"], output: "AdvisoryAgreement[]", side_effects: [] }
  - { method: POST, path: "/advisory/advisory-agreements/{agreementId}/submit", description: "Submit for signature; disclosure becomes REQUIRED", roles: [CommodityAdvisor], code: 200, input: [], output: AdvisoryAgreement, side_effects: ["status -> PENDING_SIGNATURE", "disclosure_status -> REQUIRED", "submitted_by_user_id recorded"] }
  - { method: POST, path: "/advisory/advisory-agreements/{agreementId}/deliver-disclosure", description: "Deliver the fee/risk disclosure (REQUIRED|STALE -> DELIVERED)", roles: [CommodityAdvisor], code: 200, input: [], output: AdvisoryAgreement, side_effects: ["disclosure_status -> DELIVERED"] }
  - { method: POST, path: "/advisory/advisory-agreements/{agreementId}/acknowledge-disclosure", description: "Grower acknowledges; pins acknowledged_agreement_version", roles: [Grower], code: 200, input: [], output: AdvisoryAgreement, side_effects: ["disclosure_status -> ACKNOWLEDGED", "acknowledged_agreement_version = current version"] }
  - { method: POST, path: "/advisory/advisory-agreements/{agreementId}/sign", description: "Grower signs; requires current acknowledgment", roles: [Grower], code: 200, input: [], output: AdvisoryAgreement, side_effects: ["status -> ACTIVE"] }
  - { method: PUT, path: "/advisory/advisory-agreements/{agreementId}", description: "Amend fee terms on an ACTIVE agreement (self-loop; invalidates acknowledgment -> STALE); status_change=TERMINATE terminates", roles: [CommodityAdvisor], code: 200, input: ["rate_per_bushel?", "flat_annual_fee?", "annual_cap_dollars?", "status_change?"], output: AdvisoryAgreement, side_effects: ["version incremented", "ACKNOWLEDGED disclosure -> STALE on amendment", "status_change=TERMINATE: -> TERMINATED when no ACTIVE plan exists"] }
  - { method: POST, path: "/advisory/advisory-agreements/{agreementId}/certify-compliance", description: "ComplianceOfficer certifies the disclosure package; certifier must differ from submitting advisor", roles: [ComplianceOfficer], code: 200, input: [], output: AdvisoryAgreement, side_effects: ["compliance_certified=true", "certified_by_user_id recorded"] }
  - { method: GET, path: "/advisory/advisory-agreements/{agreementId}/fee-statement", description: "Computed read: advisory fee for a period under both fee variants", roles: [CommodityAdvisor, Grower], code: 200, input: [period_start, period_end], output: "{ billable_bushels: integer, fee_dollars: number, capped: boolean }", side_effects: [] }

  # --- Test-driving logical clock ---
  - { method: POST, path: "/advisory/_clock/set_current_utc", description: "Set the server's logical clock (test-driving endpoint). Startup default is 2026-05-01T00:00:00Z: before any set call the logical clock reads exactly this instant and never falls back to wall-clock time.", roles: [PlatformAdmin], code: 200, input: [to_iso8601], output: "{ current_utc: string }", side_effects: ["Logical clock advanced; subsequent TTL/window rules evaluate against it. All created_at/updated_at stamps derive from this logical clock, so time-based rules are deterministic from empty DB"] }

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or unknown X-User-Role / X-User-ID headers" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Authenticated role is not listed on the endpoint" }
  - { id: ERR_RESOURCE_NOT_OWNED, http: 403, condition: "Grower X-User-ID does not equal the operation id owning the target resource" }
  - { id: ERR_VALIDATION, http: 400, condition: "Schema/field validation failed: missing required field, bad enum, out-of-range value, conditional field violated (fixed_price on non-FLAT_PRICE, missing strike on LONG_PUT, coverage step, window inversion)" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or body FK reference does not exist" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent's current version (OCC)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource is in a from-state that does not permit the requested transition (includes plan SUSPENDED/DRAFT/CLOSED gating, terminal-state lockdown)" }
  - { id: ERR_DISCLOSURE_NOT_ACKNOWLEDGED, http: 409, condition: "Disclosure is REQUIRED or DELIVERED but not yet ACKNOWLEDGED where acknowledgment gates the action" }
  - { id: ERR_DISCLOSURE_STALE, http: 409, condition: "Disclosure was acknowledged against an older agreement version (amendment invalidated it)" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "ComplianceOfficer's X-User-ID equals the agreement's submitted_by_user_id — same person may not submit and certify" }
  - { id: ERR_AGREEMENT_NOT_ACTIVE, http: 409, condition: "Operation lacks an ACTIVE AdvisoryAgreement where one is required" }
  - { id: ERR_BASELINE_NOT_CERTIFIED, http: 409, condition: "Referenced ProductionBaseline is not CERTIFIED (plan activation, policy bind)" }
  - { id: ERR_BUYER_NOT_APPROVED, http: 409, condition: "Buyer is PROVISIONAL or SUSPENDED at contract creation" }
  - { id: ERR_DELIVERY_WINDOW_OVERLAP, http: 409, condition: "New contract's half-open [start, end) window intersects another OPEN/PARTIALLY_DELIVERED contract for the same buyer and commodity (adjacency end==start is allowed)" }
  - { id: ERR_STORAGE_BIN_OVERLAP, http: 409, condition: "New storage lot violates the 7-day buffer rule against another STORED lot in the same bin (adjacency within the buffer is rejected)" }
  - { id: ERR_DELIVERY_OUTSIDE_WINDOW, http: 409, condition: "delivery_date outside the contract's [start, end) delivery window" }
  - { id: ERR_OVER_DELIVERY_EXCEEDED, http: 409, condition: "Confirmation would push delivered_bushels beyond floor(bushels * 1.02); equality allowed" }
  - { id: ERR_CONTRACT_FULLY_DELIVERED, http: 409, condition: "Delivery ticket created/confirmed against a DELIVERED contract" }
  - { id: ERR_CONTRACT_NOT_PRICED, http: 409, condition: "Ticket confirmation requires pricing_status == PRICED" }
  - { id: ERR_PRICING_NOT_ALLOWED, http: 409, condition: "fix-price called on a FLAT_PRICE contract or an already-PRICED contract" }
  - { id: ERR_COVERAGE_CAP_EXCEEDED, http: 409, condition: "Accepting the recommendation would push hedged + priced bushels above coverage_cap_bushels (strictly greater than cap)" }
  - { id: ERR_INSUFFICIENT_UNCOMMITTED_BUSHELS, http: 409, condition: "Contract bushels exceed plan.uncommitted_bushels" }
  - { id: ERR_OVER_SOLD_POSITION, http: 409, condition: "Operation over_sold_flag is set: new sales contracts and recommendation acceptances blocked until undelivered commitments fit the settled production" }
  - { id: ERR_MARGIN_CALL_OUTSTANDING, http: 409, condition: "Execution blocked while the margin account is CALL_OUTSTANDING" }
  - { id: ERR_MARGIN_ACCOUNT_RESTRICTED, http: 409, condition: "Execution blocked while the margin account is RESTRICTED" }
  - { id: ERR_INSUFFICIENT_MARGIN_EQUITY, http: 409, condition: "Post-execution solvency check failed: cash below total initial margin or equity below total maintenance margin" }
  - { id: ERR_LIQUIDATION_NOT_REQUIRED, http: 409, condition: "Liquidate called while the account is not CALL_OUTSTANDING" }
  - { id: ERR_NO_SETTLEMENT_PRICE, http: 409, condition: "No SETTLEMENT MarketTick exists for the required (commodity, contract_month)" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Operator of the advisory platform; owns the price feed, the logical clock, and forced liquidation"
    identity: opaque
    exclusive_operations:
      - "POST /advisory/market-ticks"
      - "POST /advisory/_clock/set_current_utc"
      - "POST /advisory/margin-accounts/{accountId}/liquidate"
    shared_operations:
      - "GET /advisory/operations/{operationId}"
  - name: CommodityAdvisor
    description: "The commodity marketing advisor; authors baselines, plans, targets, recommendations, contracts, agreements; executes hedges; confirms deliveries"
    identity: opaque
    exclusive_operations:
      - "POST /advisory/production-baselines and PUT /advisory/marketing-plans/{planId}"
      - "POST /advisory/hedge-recommendations and .../execute, POST /advisory/brokerage-positions/{positionId}/offset"
      - "POST /advisory/advisory-agreements*/submit, deliver-disclosure, PUT amend"
      - "POST /advisory/delivery-tickets/{ticketId}/confirm and /void"
      - "POST /advisory/buyers"
    shared_operations:
      - "POST /advisory/sales-contracts (shared with Grower)"
      - "POST /advisory/sales-contracts/{contractId}/cancel (shared with Grower)"
      - "All GET endpoints"
  - name: Grower
    description: "The farm client; certifies baselines, binds insurance, files claims, accepts/rejects recommendations, funds margin, signs agreements, records deliveries and storage"
    identity: "entity_backed:GrowerOperation"
    exclusive_operations:
      - "POST /advisory/production-baselines/{baselineId}/certify"
      - "POST /advisory/insurance-policies/{policyId}/bind and /file-claim"
      - "POST /advisory/hedge-recommendations/{recommendationId}/accept and /reject"
      - "POST /advisory/margin-accounts/{accountId}/fund"
      - "POST /advisory/advisory-agreements/{agreementId}/sign and /acknowledge-disclosure"
      - "POST /advisory/delivery-tickets and POST /advisory/storage-lots, .../withdraw"
    shared_operations:
      - "POST /advisory/sales-contracts (shared with CommodityAdvisor)"
      - "POST /advisory/sales-contracts/{contractId}/cancel (shared with CommodityAdvisor)"
      - "GET endpoints scoped to own operation"
  - name: ComplianceOfficer
    description: "Reviews buyers and advisory agreements; enforces segregation of duties (may not certify an agreement submitted under the same user id); may suspend plans"
    identity: opaque
    exclusive_operations:
      - "POST /advisory/buyers/{buyerId}/approve and /suspend"
      - "POST /advisory/advisory-agreements/{agreementId}/certify-compliance"
    shared_operations:
      - "POST /advisory/marketing-plans/{planId}/suspend (shared with CommodityAdvisor)"
      - "GET endpoints"
