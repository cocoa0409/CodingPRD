              as: BillingAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /demurrage/facilities"
              payload: { facility_code: "C9C2-TRK", kind: "INDUSTRY_TRACK", gate_close_hour: 16, car_spot_capacity: 3, switch_buffer_minutes: 0 }
              as: BillingAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /demurrage/tariff-rule-sets"
              payload: { tariff_code: "C9C2-6004", car_ownership_scope: "ANY" }
              as: RegulatoryOfficer
              captures: { tar_id: $.data.id }
            - call: "POST /demurrage/tariff-rule-sets/${tar_id}/publish"
              payload: {}
              as: RegulatoryOfficer
            - call: "POST /demurrage/rail-cars"
              payload: { car_mark: "C9C2-PAX01", ownership: "PRIVATE_ASSIGNED" }
              as: RailroadAgent
              captures: { car_id: $.data.id, car_v: $.data.version }
            - call: "POST /demurrage/placement-cycles"
              payload: { customer_id: "${cust_id}", rail_car_id: "${car_id}", facility_id: "${fac_id}", tariff_rule_set_id: "${tar_id}", waybill_number: "WB-C9C2-1", expected_rail_car_version: "${car_v}" }
              as: RailroadAgent
              captures: { cyc_id: $.data.id }
            - call: "POST /demurrage/placement-cycles/${cyc_id}/constructive-placement"
              payload: { constructive_placement_at: "2026-08-03T08:00:00Z", reason_code: "TRACK_FULL" }
              as: RailroadAgent
            - call: "POST /demurrage/placement-cycles/${cyc_id}/notify"
              payload: { channel: "EDI", sent_at: "2026-08-03T09:00:00Z" }
              as: RailroadAgent
            - call: "POST /demurrage/placement-cycles/${cyc_id}/actual-placement"
              payload: { actual_placement_at: "2026-08-05T10:00:00Z" }
              as: RailroadAgent
          trigger:
            - call: "POST /demurrage/placement-cycles/${cyc_id}/release"
              payload: { released_at: "2026-08-11T16:00:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "GET /demurrage/charges?placement_cycle_id=${cyc_id}&limit=10&offset=0"
              payload: {}
              as: BillingAdmin
              captures: { chg_id: "$.data[0].id" }
          assert:
            - "the cycle reports free_days 2 (the RAILROAD 48 hours, not the PRIVATE 24), clock_basis ACTUAL, clock_start_at 2026-08-05T10:00:00.000Z and free_time_expires_at 2026-08-07T23:59:59.999Z"
            - "chargeable_days 4: 2026-08-08, 09, 10 and 11, the last one charged because 16:00 is exactly gate_close_hour"
            - "charge_kind DETENTION, not DEMURRAGE"
            - "gross_amount_cents 46200 = 2 x 8150 plus 2 x 14950 on the PRIVATE ladder; the RAILROAD ladder would have produced 70000"
            - "status FINAL, computation_basis ACTUAL, credit_applied_cents 0, net_amount_cents 46200"

      - name: seventy_two_free_hours_shrinks_the_same_timeline_to_two_days
        claim_type: constants_applied
        grounds:
          - calculations.demurrage_clock_basis_resolution
          - entities.TariffRuleSet.fields.free_time_hours_railroad
        distinguishing_aspect: |
          The free-time constant is read from the CYCLE'S OWN pinned tariff, and
          it moves the expiry date rather than subtracting money at the end: on
          the identical Cycle A timeline, 72 free hours yields 2 chargeable days
          and 25100 where the default 48 yields 3 days and 47550.
        test_recipe:
          setup:
            - "one PUBLISHED tariff with free_time_hours_railroad 72, everything else default"
