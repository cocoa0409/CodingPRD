      - name: the_higher_priority_rule_wins_when_two_are_violated_on_one_request
        claim_type: priority_ordering
        excluded_because:
          difficulty_instance: booking_closed_state_outranks_room_night_ceiling_breach
          rationale: "The §1.8 priority_pair_validation_conflict instance of the same name already violates the priority-7 state rule and the priority-14 aggregate rule in one request and asserts that the priority-7 error wins."
        grounds:
          - "§1.4 places the program-state check at priority 7 and the room-night ceiling at priority 14, so a request that breaches both must surface the priority-7 error."

