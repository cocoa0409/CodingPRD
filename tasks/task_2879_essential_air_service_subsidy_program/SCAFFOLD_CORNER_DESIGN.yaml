      - name: payment_and_renegotiation_actions_rejected_out_of_sequence
        claim_type: error_catalog_coverage
        grounds:
          - errors.ERR_PAYMENT_NOT_DISBURSABLE
          - errors.ERR_PAYMENT_NOT_APPROVABLE
          - errors.ERR_RENEGOTIATION_NOT_ACTIONABLE
          - state_machines.SubsidyPayment
          - state_machines.RateRenegotiation
        distinguishing_aspect: "Each action names the status it demands rather than a generic conflict: DISBURSE insists on APPROVED, APPROVE insists on COMPUTED so a second approval fails, and any action on a WITHDRAWN renegotiation is refused even though the same action was legal one call earlier."
        test_recipe:
          setup:
            - "Community HYS SUBSIDIZED under an ACTIVE agreement at 1200000.00 for 12 months; the 2026-08 period certified into a COMPUTED payment; one REQUESTED renegotiation on file."
