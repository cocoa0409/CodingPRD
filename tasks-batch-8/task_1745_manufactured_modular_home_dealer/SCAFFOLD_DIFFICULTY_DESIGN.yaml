scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: chattel_vs_real_property_monthly_payment
        grounds: ["calculations.loan_payment", "entities.FinancingApplication.fields.estimated_payment_cents", "entities.FinancingApplication.fields.monthly_payment_cents"]
        distinguishing_aspect: |
          Entity domain: FinancingApplication credit pricing. Identical principal
          (8,680,150) and term (240) yield different payments purely from the
          financing-type variant: CHATTEL floor 700 bps -> 67,297 estimate vs
          REAL_PROPERTY floor 450 bps -> 54,915 estimate.
        test_recipe:
          setup:
            - "Two PRIVATE_LAND orders (no lot), each for a STOCK unit of a double-wide model at agreed price 9,200,000 with no options; order A financing_type CHATTEL, order B financing_type REAL_PROPERTY; both evaluated and approved; both with a financing application submitted at term 240"
            - "Per order: total_price_cents 9,137,000; deposit 456,850; amount_financed 8,680,150"
          setup_api_calls:
            - call: "POST /api/home-models"
              payload: { model_code: "DW-2860", name: "Pride 2860", floor_plan_type: "DOUBLE_WIDE", section_count: 2, width_ft: 28, length_ft: 60, base_price_cents: 9500000, factory_lead_time_days: 30 }
              as: DealershipAdmin
              captures: { d1_mdl: $.data.id }
            - call: "POST /api/customers"
              payload: { full_name: "Amy Chattel", email: "amy@x.com", phone: "555-0101", credit_tier: "TIER_A" }
              as: SalesConsultant
              captures: { d1_cust_a: $.data.id }
            - call: "POST /api/customers"
              payload: { full_name: "Bob Mortgage", email: "bob@x.com", phone: "555-0102", credit_tier: "TIER_A" }
              as: SalesConsultant
              captures: { d1_cust_b: $.data.id }
            - call: "POST /api/home-units"
              payload: { model_id: "${d1_mdl}", serial_number: "SN-D1-A", unit_kind: "STOCK", condition_grade: "NEW" }
              as: DealershipAdmin
              captures: { d1_unit_a: $.data.id }
            - call: "POST /api/home-units"
              payload: { model_id: "${d1_mdl}", serial_number: "SN-D1-B", unit_kind: "STOCK", condition_grade: "NEW" }
              as: DealershipAdmin
              captures: { d1_unit_b: $.data.id }
            - call: "POST /api/sales-orders"
              payload: { customer_id: "${d1_cust_a}", home_unit_id: "${d1_unit_a}", placement_type: "PRIVATE_LAND", financing_type: "CHATTEL", agreed_home_price_cents: 9200000 }
              as: SalesConsultant
              captures: { d1_ord_a: $.data.id, d1_ord_a_v: $.data.version }
            - call: "POST /api/sales-orders"
              payload: { customer_id: "${d1_cust_b}", home_unit_id: "${d1_unit_b}", placement_type: "PRIVATE_LAND", financing_type: "REAL_PROPERTY", agreed_home_price_cents: 9200000 }
              as: SalesConsultant
              captures: { d1_ord_b: $.data.id, d1_ord_b_v: $.data.version }
            - call: "POST /api/sales-orders/${d1_ord_a}/confirm"
              payload: { deposit_cents: 456850 }
              as: SalesConsultant
              captures: { d1_ord_a_v2: $.data.version }
            - call: "POST /api/sales-orders/${d1_ord_b}/confirm"
              payload: { deposit_cents: 456850 }
              as: SalesConsultant
              captures: { d1_ord_b_v2: $.data.version }
            - call: "POST /api/sales-orders/${d1_ord_a}/site-evaluations"
              payload: { scheduled_date: "2026-08-05T09:00:00Z", evaluator_id: "eval-1", expected_sales_order_version: "${d1_ord_a_v2}" }
              as: SalesConsultant
              captures: { d1_ev_a: $.data.id }
            - call: "POST /api/sales-orders/${d1_ord_b}/site-evaluations"
              payload: { scheduled_date: "2026-08-06T09:00:00Z", evaluator_id: "eval-1", expected_sales_order_version: "${d1_ord_b_v2}" }
              as: SalesConsultant
              captures: { d1_ev_b: $.data.id }
            - call: "POST /api/site-evaluations/${d1_ev_a}/record-findings"
              payload: { foundation_type: "PIERS", utilities_verified: true, permit_number: "P-100", findings_result: "PASS", install_estimate_cents: 350000 }
              as: SiteEvaluator
              as_user_id: "eval-1"
            - call: "POST /api/site-evaluations/${d1_ev_b}/record-findings"
              payload: { foundation_type: "SLAB", utilities_verified: true, permit_number: "P-101", findings_result: "PASS", install_estimate_cents: 320000 }
              as: SiteEvaluator
              as_user_id: "eval-1"
            - call: "POST /api/site-evaluations/${d1_ev_a}/approve"
              as: InstallationManager
            - call: "POST /api/site-evaluations/${d1_ev_b}/approve"
              as: InstallationManager
            - call: "GET /api/sales-orders/${d1_ord_a}"
              as: SalesConsultant
              captures: { d1_ord_a_v3: $.data.version }
            - call: "GET /api/sales-orders/${d1_ord_b}"
              as: SalesConsultant
              captures: { d1_ord_b_v3: $.data.version }
            - call: "POST /api/sales-orders/${d1_ord_a}/financing-applications"
              payload: { financing_type: "CHATTEL", lender_name: "Cascade Finance", term_months: 240, down_payment_cents: 456850, expected_sales_order_version: "${d1_ord_a_v3}" }
              as: SalesConsultant
              captures: { d1_app_a: $.data.id }
            - call: "POST /api/sales-orders/${d1_ord_b}/financing-applications"
              payload: { financing_type: "REAL_PROPERTY", lender_name: "Cascade Finance", term_months: 240, down_payment_cents: 456850, expected_sales_order_version: "${d1_ord_b_v3}" }
              as: SalesConsultant
              captures: { d1_app_b: $.data.id }
          trigger:
            - call: "POST /api/financing-applications/${d1_app_a}/submit"
              as: SalesConsultant
              captures: { d1_est_a: $.data.estimated_payment_cents, d1_req_a: $.data.requested_amount_cents }
            - call: "POST /api/financing-applications/${d1_app_b}/submit"
              as: SalesConsultant
              captures: { d1_est_b: $.data.estimated_payment_cents, d1_req_b: $.data.requested_amount_cents }
            - call: "POST /api/financing-applications/${d1_app_a}/decide"
              payload: { decision: "APPROVE", apr_bps: 725 }
              as: LenderAgent
              captures: { d1_pmt_a: $.data.monthly_payment_cents }
            - call: "POST /api/financing-applications/${d1_app_b}/decide"
              payload: { decision: "APPROVE", apr_bps: 500 }
              as: LenderAgent
              captures: { d1_pmt_b: $.data.monthly_payment_cents }
          assert:
            - "FinancingApplication.${d1_app_a}.requested_amount_cents == 8680150"
            - "FinancingApplication.${d1_app_b}.requested_amount_cents == 8680150"
            - "FinancingApplication.${d1_app_a}.estimated_payment_cents == 67297"
            - "FinancingApplication.${d1_app_b}.estimated_payment_cents == 54915"
            - "FinancingApplication.${d1_app_a}.monthly_payment_cents == 68606"
            - "FinancingApplication.${d1_app_b}.monthly_payment_cents == 57285"
            - "estimated_payment variant delta == 12382 (chattel higher despite identical principal and term)"

      - name: provisional_vs_final_trade_in_credit
        grounds: ["calculations.trade_in_credit", "entities.TradeInAppraisal.fields.provisional_credit_cents", "entities.TradeInAppraisal.fields.final_credit_cents"]
        distinguishing_aspect: |
          Entity domain: TradeInAppraisal asset valuation (distinct from credit
          pricing). Same traded home yields provisional 1,056,000 (declared
          year/condition formula) vs final 1,100,000 (inspection-based
          appraised-minus-reconditioning); the variants disagree by 44,000.
        test_recipe:
          setup:
            - "Logical clock at default 2026-08-01; one community-placed DRAFT order at agreed price 9,200,000 (no options); a trade-in appraisal declared as model year 2012, condition B"
          setup_api_calls:
            - call: "POST /api/home-models"
              payload: { model_code: "DW-2860", name: "Pride 2860", floor_plan_type: "DOUBLE_WIDE", section_count: 2, width_ft: 28, length_ft: 60, base_price_cents: 9500000, factory_lead_time_days: 30 }
              as: DealershipAdmin
              captures: { d2_mdl: $.data.id }
            - call: "POST /api/communities"
              payload: { name: "Pinewood MHC", address: "12 Pine Rd", lot_rent_cents: 45000 }
              as: DealershipAdmin
              captures: { d2_com: $.data.id }
            - call: "POST /api/communities/${d2_com}/lots"
              payload: { lot_number: "A-01", max_sections: 2, max_length_ft: 70, utilities_ready: true }
              as: DealershipAdmin
              captures: { d2_lot: $.data.id }
            - call: "POST /api/lots/${d2_lot}/reserve"
              as: SalesConsultant
            - call: "POST /api/customers"
              payload: { full_name: "Alicia Buyer", email: "alicia@x.com", phone: "555-0100", credit_tier: "TIER_B" }
              as: SalesConsultant
              captures: { d2_cust: $.data.id }
            - call: "POST /api/home-units"
              payload: { model_id: "${d2_mdl}", serial_number: "SN-D2-1", unit_kind: "STOCK", condition_grade: "NEW" }
              as: DealershipAdmin
              captures: { d2_unit: $.data.id }
            - call: "POST /api/sales-orders"
              payload: { customer_id: "${d2_cust}", home_unit_id: "${d2_unit}", placement_type: "COMMUNITY_LOT", lot_id: "${d2_lot}", financing_type: "CHATTEL", agreed_home_price_cents: 9200000 }
              as: SalesConsultant
              captures: { d2_ord: $.data.id }
            - call: "POST /api/sales-orders/${d2_ord}/trade-in-appraisals"
              payload: { declared_model_year: 2012, declared_condition: "B", model_id: "${d2_mdl}" }
              as: SalesConsultant
              captures: { d2_app: $.data.id, d2_prov: $.data.provisional_credit_cents }
          trigger:
            - call: "POST /api/trade-in-appraisals/${d2_app}/inspect"
              payload: { appraised_value_cents: 1500000, reconditioning_cost_cents: 400000, condition_grade: "B" }
              as: Appraiser
              captures: { d2_final: $.data.final_credit_cents }
          assert:
            - "TradeInAppraisal.${d2_app}.provisional_credit_cents == 1056000"
            - "TradeInAppraisal.${d2_app}.final_credit_cents == 1100000"
            - "provisional != final (divergence 44000) for the same appraisal subject"

      - name: delivery_vs_install_anchored_warranty_window
        grounds: ["calculations.warranty_coverage_window", "entities.WarrantyClaim.fields.coverage_window_end", "entities.HomeUnit.fields.delivered_at", "entities.HomeUnit.fields.set_completed_at"]
        distinguishing_aspect: |
          Entity domain: WarrantyClaim coverage (temporal coverage, distinct from
          pricing and valuation). Same unit with delivered_at 2026-09-01 and
          set_completed_at 2026-09-05: at clock 2026-12-05 the install-anchored
          variant (90 days, ended 2026-12-04) rejects while the
          delivery-anchored variant (365 days, ends 2027-09-01) still accepts.
        test_recipe:
          setup:
            - "Fully installed chattel order: delivered 2026-09-01T10:00:00Z, set completed 2026-09-05T10:00:00Z (canonical pricing: total 9,471,997, deposit 473,600, financed 8,998,397); logical clock then advanced to 2026-12-05T00:00:00Z"
          setup_api_calls:
            - call: "POST /api/home-models"
              payload: { model_code: "DW-2860", name: "Pride 2860", floor_plan_type: "DOUBLE_WIDE", section_count: 2, width_ft: 28, length_ft: 60, base_price_cents: 9500000, factory_lead_time_days: 30 }
              as: DealershipAdmin
