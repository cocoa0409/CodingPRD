              payload: { to_status: "SENT", fees_paid_cents: 2500 }
              as: SchoolCoordinator
              as_user_id: "${school_id}"
            - call: "POST /ap-program/score-sends"
              payload: { exam_score_id: "${score_id}", recipient_type: "COLLEGE", recipient_code: "C3002", designation_year: 2027 }
              as: SchoolCoordinator
              as_user_id: "${school_id}"
              captures: { send_2_id: "$.data.id", fee_2: "$.data.fee_cents" }
            - call: "POST /ap-program/score-sends/${send_2_id}/status-transitions"
              payload: { to_status: "SENT", fees_paid_cents: 2500 }
              as: SchoolCoordinator
              as_user_id: "${school_id}"
            - call: "POST /ap-program/score-sends"
              payload: { exam_score_id: "${score_id}", recipient_type: "COLLEGE", recipient_code: "C3003", designation_year: 2027 }
              as: SchoolCoordinator
              as_user_id: "${school_id}"
              captures: { send_3_id: "$.data.id", fee_3: "$.data.fee_cents" }
          trigger:
            - call: "POST /ap-program/score-sends/${send_3_id}/status-transitions"
              payload: { to_status: "CANCELLED" }
              as: SchoolCoordinator
              as_user_id: "${school_id}"
            - call: "GET /ap-program/score-sends/${send_3_id}"
              as: SchoolCoordinator
              as_user_id: "${school_id}"
            - call: "GET /ap-program/score-sends"
              as: ScoringSpecialist
          assert:
            - "ScoreSend.fee_cents == 2500 for all three COLLEGE rows (all_include: rows 1, 2 and 3 each exceed FREE_SEND_ALLOWANCE 2 once the third is created)"
            - "After cancelling the third send, ScoreSend.credit_back_cents == 2500 == that row's recorded fee_cents, so sum(fee_cents) over the three college rows 7500 equals sum(credit_back_cents) 2500 plus the 5000 still settled on the two SENT rows"
      - name: material_compromise_revert_conserves_money_value
        grounds:
          - state_machines.ExamMaterialShipment.IN_TRANSIT_to_SEAL_BROKEN
          - state_machines.ExamMaterialShipment.SEAL_BROKEN_to_RETURNED
          - state_machines.ExamOrder.MATERIALS_SHIPPED_to_SUBMITTED
          - entities.ExamOrder.fields.order_fee_cents
        distinguishing_aspect: "Conservation of money-value across a material compromise: the forward SEAL_BROKEN report reverts the order to SUBMITTED and the compensating SEAL_BROKEN -> RETURNED return closes the custody chain, yet the pair moves no cents at all — the order fee, the unused-exam charge and every registration's fees_paid_cents are each identical before and after."
        test_recipe:
          setup:
            - "An order already MATERIALS_SHIPPED with one MATERIAL_ASSIGNED registration and a dispatched shipment in transit; the shipped order fee already settled"
