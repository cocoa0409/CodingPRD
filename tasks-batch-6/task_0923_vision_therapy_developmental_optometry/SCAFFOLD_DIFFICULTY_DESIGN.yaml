            - "Logical clock at 2026-06-01T00:00:00Z; an ACTIVE plan with a 12-visit authorization."
            - "One serialized kit item CHECKED_OUT to the patient on that plan."
            - "One SCHEDULED in-office session on 2026-06-10 that has already consumed one authorization unit, leaving visits_consumed 1 and visits_remaining 11."
            - "A DRAFT PROGRESS REASSESSMENT carrying a single NPC row flagged red_flag true."
