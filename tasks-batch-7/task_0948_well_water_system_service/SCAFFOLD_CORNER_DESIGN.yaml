      - name: corner_occ_treatment_recommendation_rejects_a_stale_well_profile_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[treatment-recommendation-create-stale-profile]", "errors[ERR_STALE_WELL_PROFILE_VERSION]", "validations[priority=26]", "entities.WellProfile.fields.version"]
        distinguishing_aspect: |
          Recording the CHEMICAL lab result mutates the well (it copies hardness_gpg
          across) and therefore advances WellProfile.version, so a client that read the
          well before the lab result holds a stale number. Creating the recommendation
          with that stale value is refused 412 ERR_STALE_WELL_PROFILE_VERSION and
          creates nothing; retrying with the freshly read version succeeds and advances
          the well's version by exactly 1 more. An implementation that skips the check
          creates the recommendation on the first attempt.
        test_recipe:
          setup:
            - "One account, one property with household_size 4, one well and one technician."
            - "One CHEMICAL water test sampled 2026-06-01T00:00:00Z and analysed 2026-06-02T00:00:00Z with hardness 20.0 gpg, so the test sits at ANALYZED_CHEMICAL_EXCEEDANCE."
          setup_api_calls:
            - call: "POST /water-service/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-02T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /water-service/accounts"
              payload: { legal_name: "Well OCC Co", billing_jurisdiction_code: "JUR_ALPHA", contact_email: "wo@corner.example" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /water-service/properties"
              payload: { account_id: "${acct_id}", address_line: "412 Well", jurisdiction_code: "JUR_ALPHA", distance_miles: 10.0, household_size: 4 }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /water-service/well-profiles"
              payload: { property_id: "${prop_id}", jurisdiction_code: "JUR_ALPHA", well_type: "DRILLED", depth_feet: 200.0 }
              as: PlatformAdmin
              captures: { well_id: $.data.id }
            - call: "POST /water-service/technicians"
              payload: { full_name: "Well OCC Tech", tier: "JOURNEYMAN", home_jurisdiction_code: "JUR_ALPHA", status: "AVAILABLE" }
              as: PlatformAdmin
              captures: { tech_id: $.data.id }
            - call: "POST /water-service/water-tests"
              payload: { well_profile_id: "${well_id}", collected_by_technician_id: "${tech_id}", panel_type: "CHEMICAL", sample_datetime: "2026-06-01T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "officer-alpha"
              captures: { wt_id: $.data.id }
            - call: "POST /water-service/water-tests/${wt_id}/lab-result"
              payload: { analyzed_at: "2026-06-02T00:00:00Z", hardness_gpg: 20.0 }
              as: ComplianceOfficer
              as_user_id: "officer-alpha"
            - call: "GET /water-service/well-profiles/${well_id}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-alpha"
              captures: { wv: $.data.version }
          trigger:
            - call: "POST /water-service/well-profiles/${well_id}/treatment-recommendations"
              payload: { water_test_id: "${wt_id}", expected_well_profile_version: "${wv} - 1" }
              as: ComplianceOfficer
              as_user_id: "officer-alpha"
              captures: { err_stale: $.data.error_id }
            - call: "POST /water-service/well-profiles/${well_id}/treatment-recommendations"
              payload: { water_test_id: "${wt_id}", expected_well_profile_version: "${wv}" }
              as: ComplianceOfficer
              as_user_id: "officer-alpha"
              captures: { rec_id: $.data.id }
          assert:
            - "${err_stale} == ERR_STALE_WELL_PROFILE_VERSION"
            - "HTTP status is 412 on the stale-version create"
            - "WellProfile.${well_id}.hardness_gpg == 20.0"
            - "TreatmentRecommendation.${rec_id}.recommended_media == SOFTENER_RESIN"
            - "TreatmentRecommendation.${rec_id}.design_grains == 42000"
            - "TreatmentRecommendation.${rec_id}.status == PROPOSED"
            - "GET /water-service/water-tests/${wt_id}/treatment-recommendations returns exactly 1 row"
            - "WellProfile.${well_id}.version == ${wv} + 1"

      - name: corner_occ_salt_delivery_rejects_a_replayed_plan_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[salt-delivery-stale-plan]", "errors[ERR_STALE_MAINTENANCE_PLAN_VERSION]", "validations[priority=29]", "entities.MaintenancePlan.fields.version"]
        distinguishing_aspect: |
          Salt deliveries top up the same brine tank and are legitimately repeatable, so
          only the version distinguishes a fresh delivery from a replay: a delivery
          quoting one less than the stored version is refused 412
          ERR_STALE_MAINTENANCE_PLAN_VERSION with salt_remaining_lbs still 0.0, the same
          delivery quoting the stored version succeeds and takes the tank to 100.0 while
          advancing MaintenancePlan.version by 1, and replaying that now-spent version
          is refused again with the tank still at 100.0. An implementation that ignores
          the field ends the instance at 200.0 lbs.
        test_recipe:
          setup:
            - "One account, property and well, and one ACTIVE MaintenancePlan at version 1 with salt_remaining_lbs 0.0 and monthly_salt_lbs 0.0."
            - "Logical clock at 2026-06-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /water-service/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /water-service/accounts"
              payload: { legal_name: "Plan OCC Co", billing_jurisdiction_code: "JUR_ALPHA", contact_email: "po@corner.example" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /water-service/properties"
              payload: { account_id: "${acct_id}", address_line: "412 Plan", jurisdiction_code: "JUR_ALPHA", distance_miles: 10.0, household_size: 3 }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /water-service/well-profiles"
              payload: { property_id: "${prop_id}", jurisdiction_code: "JUR_ALPHA", well_type: "DRILLED", depth_feet: 200.0 }
              as: PlatformAdmin
              captures: { well_id: $.data.id }
            - call: "POST /water-service/maintenance-plans"
              payload: { well_profile_id: "${well_id}", account_id: "${acct_id}" }
              as: PlatformAdmin
              captures: { plan_id: $.data.id, pv0: $.data.version }
          trigger:
            - call: "POST /water-service/maintenance-plans/${plan_id}/salt-deliveries"
              payload: { delivered_lbs: 100.0, expected_maintenance_plan_version: "${pv0} - 1" }
              as: Dispatcher
              captures: { err_before: $.data.error_id }
            - call: "POST /water-service/maintenance-plans/${plan_id}/salt-deliveries"
              payload: { delivered_lbs: 100.0, expected_maintenance_plan_version: "${pv0}" }
              as: Dispatcher
            - call: "POST /water-service/maintenance-plans/${plan_id}/salt-deliveries"
              payload: { delivered_lbs: 100.0, expected_maintenance_plan_version: "${pv0}" }
              as: Dispatcher
              captures: { err_replay: $.data.error_id }
          assert:
            - "${pv0} == 1"
            - "${err_before} == ERR_STALE_MAINTENANCE_PLAN_VERSION"
            - "${err_replay} == ERR_STALE_MAINTENANCE_PLAN_VERSION"
            - "HTTP status is 412 on both rejected deliveries"
            - "MaintenancePlan.${plan_id}.salt_remaining_lbs == 100.0"
            - "MaintenancePlan.${plan_id}.last_salt_delivery_date == 2026-06-01T00:00:00.000Z"
            - "MaintenancePlan.${plan_id}.salt_next_due_date == null"
            - "MaintenancePlan.${plan_id}.version == 2"

      - name: corner_rate_threshold_credit_hold_flips_only_above_the_threshold
        claim_type: rate_threshold_triggers
        grounds: ["calculations.account_balance_cents", "entities.Account.fields.credit_hold", "global_constants.CREDIT_HOLD_THRESHOLD_CENTS", "state_machines.Invoice.DRAFT_to_ISSUED"]
        distinguishing_aspect: |
          credit_hold is re-derived as balance_cents > 500000, STRICTLY greater, on
          every write that touches the balance. Issuing an invoice of 668780 cents puts
          the balance above the threshold and latches credit_hold true; a 200000-cent
          part payment drops the balance to 468780, which is below the threshold, and
          credit_hold immediately returns to false while lifetime_invoiced_cents stays
          668780 and lifetime_paid_cents becomes 200000. Invoice arithmetic: parts
          round_half_up(100001*1.18) = 118001 per unit x 5 = 590005; labor MASTER
          STANDARD round_half_up(13500*60/60) = 13500; severity 25+6+9 = 40 -> MID
          surcharge 14000 with a NONE-tier credit of 0, plus the ZONE_1 trip fee 8500 =
          22500 dispatch; pre-discount 626005; taxable 590005;
          tax round_half_up(590005*7.25/100) = round_half_up(42775.3625) = 42775;
          total 668780. An implementation using >= flips nothing differently here but
          one that never clears the flag leaves credit_hold true after the payment.
        test_recipe:
          setup:
            - "One NONE-tier account, one property 10.0 miles out with household 3, one well, one MASTER technician and one CONTROL part costing 100001 cents with 10 on hand."
            - "One emergency ticket diagnosed with onsite_estimate_cents 700000 (over the 75000 NONE cap) so authorization goes PENDING and is then AUTHORIZED by the customer while credit_hold is still false."
            - "One work order of scope REPAIR consuming 5 units, completed at 2026-06-01T12:00:00Z reporting 60 minutes."
