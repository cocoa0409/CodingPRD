  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: account_hold_beats_credit_overflow_on_submit
        grounds:
          - validations[priority=7]
          - validations[priority=10]
          - errors.ERR_ACCOUNT_ON_HOLD
          - errors.ERR_CREDIT_LIMIT_EXCEEDED
        distinguishing_aspect: |
          Error-category pair (state vs business_fiscal): the same SUBMIT
          violates the HOLD-state guard AND the credit-limit guard; priority 7
          state must win over priority 10 fiscal, returning ERR_ACCOUNT_ON_HOLD.
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Factory FAC-D1, line Alder 89900 ACTIVE, retail account Metro (limit 1000000) placed on HOLD, cycle week 2026-09-07 OPEN."
            - "Draft order qty 50: provisional total 3865700 (unit 77314 at tier 3), which alone would fail the credit gate."
          setup_api_calls:
            - *a_clock
            - *a_factory
            - *a_line
            - *a_line_active
            - call: "POST /api/retail-accounts"
              payload: { business_name: "Metro Discount Furniture", credit_limit_cents: 1000000 }
              as: PlatformAdmin
              captures: { r1: $.data.id }
            - call: "POST /api/retail-accounts/${r1}/transition"
              payload: { to_state: HOLD }
              as: PlatformAdmin
            - *a_cycle1
            - call: "POST /api/orders"
              payload: { buyer_type: RETAIL_ACCOUNT, retail_account_id: "${r1}", allocation_cycle_id: "${c1}", product_line_id: "${pl1}", quantity: 50, delivery_mode: FREIGHT_TO_STORE }
              as: WholesaleBuyer
              as_user_id: "${r1}"
              captures: { o_d: $.data.id, o_d_total: $.data.provisional_total_cents }
          trigger:
            - call: "POST /api/orders/${o_d}/transition"
              payload: { action: SUBMIT }
              as: WholesaleBuyer
              as_user_id: "${r1}"
              captures: { err: $.data.error_id }
          assert:
            - "draft SupplyOrder.${o_d}.provisional_total_cents == 3865700 (would fail credit check: 0 + 3865700 > 1000000)"
            - "the SUBMIT response is 409 with error_id == ERR_ACCOUNT_ON_HOLD, NOT ERR_CREDIT_LIMIT_EXCEEDED (state priority 7 beats fiscal priority 10)"

      - name: lead_time_beats_window_duration_on_appointment_create
        grounds:
          - validations[priority=8]
          - validations[priority=9]
          - errors.ERR_LEAD_TIME_TOO_SHORT
          - errors.ERR_WINDOW_DURATION_INVALID
        distinguishing_aspect: |
          Error-category pair (business_temporal vs business_constraint): one
          appointment create violates BOTH the 48-hour lead rule (window starts
          33 hours out) AND the 120-minute minimum duration (window is 60
          minutes); priority 8 temporal must win, returning
          ERR_LEAD_TIME_TOO_SHORT. Different category pair than the
          state-vs-fiscal instance.
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Factory FAC-D1, line Alder ACTIVE, licensee Summit ACTIVE with T-SEA, DC-KENT, cycle OPEN, home-delivery order submitted, run, PICKED."
          setup_api_calls:
            - *a_clock
            - *a_factory
            - *a_line
            - *a_line_active
            - *a_licensee
            - *a_licensee_active
            - *a_terr_sea
            - *a_assign_sea
            - *a_dc
            - *a_cycle1
            - *a_hd_order
            - *a_submit_o1
            - *a_run_c1
            - *a_pick_o1
          trigger:
            - call: "POST /api/delivery-appointments"
              payload: { supply_order_id: "${o1}", dc_id: "${dc1}", zone: LOCAL, region_code: "T-SEA", window_start: "2026-09-02T09:00:00Z", window_end: "2026-09-02T10:00:00Z", crew_units: 1 }
              as: LicenseeManager
              as_user_id: "${l1}"
              captures: { err: $.data.error_id }
          assert:
            - "window_start 2026-09-02T09:00:00Z is only 33h after the 2026-09-01T00:00:00Z clock (lead violated) AND the window is 60 minutes (duration violated)"
            - "the response is 422 with error_id == ERR_LEAD_TIME_TOO_SHORT, NOT ERR_WINDOW_DURATION_INVALID (temporal priority 8 beats constraint priority 9)"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: credit_exactly_at_limit_passes_one_cent_over_fails
        grounds:
