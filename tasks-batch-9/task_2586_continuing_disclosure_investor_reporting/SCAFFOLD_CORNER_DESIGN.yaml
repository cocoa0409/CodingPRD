          submission_attempt_count counts submit AND resubmit together, so the ceiling of 3 is
          consumed as 1 submit + 2 resubmits; the FOURTH attempt is refused and the filing stays
          REJECTED rather than moving to a dead-letter state. A rejected attempt still consumed
          its slot, which is what distinguishes "3 attempts" from "3 rejections".
