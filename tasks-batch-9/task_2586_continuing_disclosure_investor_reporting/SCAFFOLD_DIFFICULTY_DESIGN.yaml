            - call: "POST /disclosure/filings/${fa_id}/confirm"
              payload: { repository_receipt_id: "EMMA-TA-2026-0001" }
              as: DisseminationAgent
              as_user_id: "${eng_id}"
            - call: "GET /disclosure/material-event-notices/${na_id}"
