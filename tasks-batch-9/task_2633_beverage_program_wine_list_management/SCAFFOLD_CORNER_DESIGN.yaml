            - "PATCH { by_the_glass: true } alone returns 400 ERR_POUR_SIZE_REQUIRED because the stored pour_size_ml is null — the rule reads the post-merge entity, not just the body"
            - "PATCH { by_the_glass: true, pour_size_ml: 177 } returns 200 with effective_pours 3 and glass_price_cents 2875"
            - "the failed PATCH left ListEntry.${e1_id}.by_the_glass false — no partial write"
      - name: venue_code_is_globally_unique_while_bin_code_is_venue_scoped
        claim_type: Cross-entity validation
        grounds:
          - validations[priority 19].ERR_VENUE_CODE_TAKEN
          - validations[priority 20].ERR_BIN_CODE_TAKEN
        distinguishing_aspect: >-
          The two uniqueness rules have different scopes: venue_code collides across the whole group,
          while bin_code collides only inside one venue. The same literal "A1" must therefore be
          accepted in a second venue and refused in the first, which an implementation with a single
          global bin index gets wrong.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T12:00:00Z."
            - "Venue HRB with bin A1 already created."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T12:00:00Z" }
              as: BeverageDirector
              as_user_id: "bd-001"
            - call: "POST /beverage-program/venues"
              payload: { name: "Harbor Room", venue_code: "HRB", cogs_target_pct_by_category: { SPARKLING: 30.0, WHITE: 25.0, ROSE: 28.0, RED: 28.0, DESSERT: 32.0, FORTIFIED: 35.0 } }
              as: BeverageDirector
              as_user_id: "bd-001"
              captures: { v1_id: $.data.id }
            - call: "POST /beverage-program/venues/${v1_id}/cellar-bins"
              payload: { bin_code: "A1", zone: "CELLAR", capacity_bottles: 48, temperature_controlled: true }
              as: VenueSommelier
              as_user_id: "${v1_id}"
              captures: { bin1_id: $.data.id }
          trigger:
            - call: "POST /beverage-program/venues"
              payload: { name: "Harbour Room Annex", venue_code: "HRB", cogs_target_pct_by_category: { SPARKLING: 30.0, WHITE: 25.0, ROSE: 28.0, RED: 28.0, DESSERT: 32.0, FORTIFIED: 35.0 } }
              as: BeverageDirector
              as_user_id: "bd-001"
            - call: "POST /beverage-program/venues"
              payload: { name: "Garden Table", venue_code: "GDN", cogs_target_pct_by_category: { SPARKLING: 30.0, WHITE: 25.0, ROSE: 28.0, RED: 28.0, DESSERT: 32.0, FORTIFIED: 35.0 } }
              as: BeverageDirector
              as_user_id: "bd-001"
              captures: { v2_id: $.data.id }
            - call: "POST /beverage-program/venues/${v2_id}/cellar-bins"
              payload: { bin_code: "A1", zone: "CELLAR", capacity_bottles: 24, temperature_controlled: false }
              as: VenueSommelier
              as_user_id: "${v2_id}"
              captures: { bin2_id: $.data.id }
            - call: "POST /beverage-program/venues/${v1_id}/cellar-bins"
              payload: { bin_code: "A1", zone: "RESERVE", capacity_bottles: 12, temperature_controlled: true }
              as: VenueSommelier
              as_user_id: "${v1_id}"
          assert:
            - "re-using venue_code HRB returns 409 ERR_VENUE_CODE_TAKEN even though the name differs"
            - "venue GDN is created (201) and accepts bin_code A1 (201) — bin uniqueness is scoped to the venue"
            - "bin ${bin2_id} has venue_id ${v2_id}, capacity_bottles 24, bottles_stored 0, utilization_pct 0.00 and bin_state ACTIVE"
            - "a second A1 inside venue ${v1_id} returns 409 ERR_BIN_CODE_TAKEN, and the differing zone and capacity do not make it a distinct bin"
            - "GET /beverage-program/cellar-bins?venue_id=${v1_id} still returns exactly 1 row"
      - name: sommelier_cannot_reach_another_venues_slot_or_par_report
