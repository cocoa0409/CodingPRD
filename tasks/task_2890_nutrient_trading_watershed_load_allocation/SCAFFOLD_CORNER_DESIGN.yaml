      - name: permit_limit_and_compliance_axes_move_independently
        claim_type: parallel
        grounds:
          - state_machines.Permit.limit_status
          - state_machines.Permit.compliance_status
          - complexity_profile.state_machine_shape
        distinguishing_aspect: "The Permit row carries two independent state axes, and the only place they touch is the finalize-limits transition that drags the compliance axis backwards from IN_COMPLIANCE to SHORTFALL."
        excluded_because:
          difficulty_instance: permit_dual_axis_limit_transition_moves_compliance_axis_backwards
          rationale: "That §1.8 instance drives limit_status DRAFT_LIMITS -> INTERIM_LIMITS -> FINAL_LIMITS while the compliance axis moves NOT_REPORTED -> IN_COMPLIANCE -> SHORTFALL on the same row, and asserts both axes plus the single version increment on finalize-limits."

      - name: tmdl_assessment_can_loop_through_revision_before_approval
        claim_type: cyclic
        grounds:
          - state_machines.TmdlAssessment.PUBLIC_COMMENT_to_REVISION
          - state_machines.TmdlAssessment.REVISION_to_PUBLIC_COMMENT
          - entities.TmdlAssessment.fields.revision_round
        distinguishing_aspect: "PUBLIC_COMMENT <-> REVISION is the one cycle in the machine; revision_round counts the laps and APPROVED is reachable only from PUBLIC_COMMENT, never straight out of REVISION."
        excluded_because:
          difficulty_instance: tmdl_public_comment_revision_loop_twice_then_approval_only_from_public_comment
          rationale: "That §1.8 instance walks the loop twice, asserts revision_round 1 then 2, proves REVISION -> APPROVED is rejected with ERR_INVALID_STATE, and only then approves from PUBLIC_COMMENT."

      - name: adaptive_hold_cascades_down_to_transactions_batches_and_permits
        claim_type: cascade_down
        grounds:
          - state_machines.Watershed.ACTIVE_to_ADAPTIVE_HOLD
          - endpoints[POST /adaptive-reviews/{adaptive_review_id}/finalize]
          - complexity_profile.complexity_layers[cascading_side_effects]
        distinguishing_aspect: "An OFF_TRACK adaptive review finalization moves the watershed to ADAPTIVE_HOLD and that single write voids PROPOSED transactions, releases their reserved credits and restores each affected permit's compliance gap."
        excluded_because:
          difficulty_instance: adaptive_review_off_track_cascade_watershed_to_transaction_to_batch_and_permit
          rationale: "That §1.8 instance asserts all four levels of the cascade (Watershed -> CreditTransaction -> CreditBatch -> Permit) with pinned post-cascade balances after a single finalize call."

      - name: reverification_failure_cascades_only_into_non_terminal_dependents
        claim_type: conditional_cascade
        grounds:
          - state_machines.PracticeProject.CERTIFIED_to_REVOKED
          - state_machines.CreditBatch.ISSUED_to_INVALIDATED
          - state_machines.CreditBatch.LISTED_to_INVALIDATED
        distinguishing_aspect: "A REVERIFICATION FAIL invalidates the generated batch and voids its live transactions, but already-VOIDED transactions and already-retired pounds are left untouched — the cascade is conditional on the dependent's current state."
        excluded_because:
          difficulty_instance: reverification_fail_cascade_project_to_batch_to_transaction_to_permit_violation
          rationale: "That §1.8 instance drives the four-hop cascade from a single REVERIFICATION FAIL event and asserts the permit's restored gap and enforcement_flag, including which dependents are skipped."

      - name: batch_listing_is_guarded_by_the_generating_projects_state
        claim_type: guarded_transitions
        grounds:
          - state_machines.CreditBatch.ISSUED_to_LISTED
          - validations[priority=20]
          - errors[ERR_PROJECT_NOT_CERTIFIED]
        distinguishing_aspect: "ISSUED -> LISTED is a cross-entity guarded transition: the batch itself is eligible, but the transition is refused while its generating PracticeProject sits in PENDING_REVERIFICATION."
        excluded_because:
          difficulty_instance: batch_listing_blocked_while_generating_project_sits_in_pending_reverification
          rationale: "That §1.8 instance parks the project in PENDING_REVERIFICATION, shows the list call rejected with ERR_PROJECT_NOT_CERTIFIED, then re-certifies and shows the same call succeed."

      - name: voiding_transactions_reverses_every_credit_side_effect
        claim_type: compensation
        grounds:
          - state_machines.CreditTransaction.PROPOSED_to_VOIDED
          - state_machines.CreditTransaction.APPROVED_to_VOIDED
          - endpoints[POST /credit-transactions/{credit_transaction_id}/void]
        distinguishing_aspect: "Voiding must reverse the reserved/retired/available buckets, the watershed reserve pool and the permit's credit_applied_lbs with zero drift, and a PROPOSED void reverses strictly less than an APPROVED void."
        excluded_because:
          difficulty_instance: credit_mass_invariant_restored_exactly_by_voiding_a_proposed_and_an_approved_transaction
          rationale: "That §1.8 instance voids one PROPOSED and one APPROVED transaction on the same batch and asserts the pound-for-pound restoration of every bucket plus the reserve pool and permit gap."

  - section: calculations
    instances:
      - name: monitoring_sample_load_applies_the_declared_conversion_constants
        claim_type: constants_applied
        grounds:
          - calculations.monitoring_sample_load
          - calculations.monitoring_sample_load.constants
          - calculations.monitoring_sample_load.precision
        distinguishing_aspect: "computed_load_lbs_yr is conc * flow * 5.393 * 365 rounded half-up to 2 places, and the same reach yields 108067.63 / 98422.25 for 1000 cfs and 4921.11 / 3936.89 for 100 cfs — the constants are multiplied in, never approximated."
        test_recipe:
          setup:
            - "Watershed SCR with a BACKGROUND reach R_BG."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-06-15T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /watersheds"
              payload: { name: "Scioto Headwaters", state_code: "OH", watershed_code: "SCR", pollutant: "TOTAL_PHOSPHORUS", baseline_year: 2020, baseline_load_lbs_yr: 120000.00, eligible_zone_codes: ["Z1", "Z2"] }
              as: ProgramAdministrator
              captures: { w_id: $.data.id }
            - call: "POST /reaches"
              payload: { watershed_id: "${w_id}", reach_code: "R_BG", trading_zone_code: "Z3", reach_class: "BACKGROUND", delivery_factor: 0.7000 }
              as: TmdlAnalyst
              captures: { r_bg_id: $.data.id }
