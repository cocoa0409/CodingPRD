        distinguishing_aspect: "After an accepted adjustment lifts green_price_factor_bps from 10000 to 11200, the green-linked COFFEE price becomes round_half_up(4500000 * 11200 / 10000) == 5040000 while the unlinked CREAMER price stays 2000000, and the earlier visit keeps its 4500000 snapshot forever - invoice assembly reuses the snapshots instead of repricing."
