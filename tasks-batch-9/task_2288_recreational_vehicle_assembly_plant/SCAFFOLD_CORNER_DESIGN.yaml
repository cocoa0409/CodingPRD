              as: ProductionScheduler
              captures: { e_hours: $.data.error_id }
          assert:
            - "slot_a is created with seq_a == 1 and station_hours_committed 41.00 on (LINE-T, 2026-08-05)"
            - "seq_b == 1 — a different slot_date is a different bucket, so LINE-T's 2026-08-06 occupancy started at zero"
            - "seq_c == 1 — a different line_id is a different bucket too, even on the same calendar day"
            - "e_hours == ERR_LINE_DAY_HOURS_EXCEEDED with status 409 (41.00 + 41.00 = 82.00 > 45.00)"
            - "UnitOrder.${ord_d}.status is still CONFIG_VALIDATED and GET /production-slots?unit_order_id=${ord_d} returns total_count 0"
            - "GET /production-slots?line_id=${line_1}&slot_date=2026-08-05T00:00:00Z returns total_count 1"
            - "Dealer.${dlr_id}.allocation_hours_consumed == 123.00 (three RESERVED slots of 41.00 h) against an entitlement_hours of 270.00"

      - name: warranty_variant_is_selected_by_the_365_day_boundary
        claim_type: variant_selection
        grounds:
          - calculations.warranty_claim_reimbursement.variants
          - entities.WarrantyClaim.fields.in_warranty
          - endpoints["POST /_inject/delivered-unit"]
        distinguishing_aspect: "in_warranty is clock_now - shipped_at <= WARRANTY_DAYS, so a claim filed exactly 365 days after shipment selects IN_WARRANTY_SCHEDULE and pays 126600, while the same claim filed one day later selects OUT_OF_WARRANTY_GOODWILL_ONLY and pays 21100 — the authority tier is TIER_A in both."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; two units delivered to dealer D-TOW with shipped_at 2026-08-01T00:00:00Z via the injection endpoint."
            - "Both claims are identical: claim_type APPLIANCE, labor_hours 3.50, parts_cost_cents 68000, goodwill_requested_cents 60000, no component lot."
          setup_api_calls:
            - call: "POST /floor-plans"
              payload: { model_code: "FP-TOW", chassis_class: "TOWABLE", length_ft: 28, base_msrp_cents: 8000000, base_station_hours: 40.00, base_dry_weight_lbs: 6000, gvwr_lbs: 9000, required_wheelbase_in: 180, electrical_service_amps: 50, fresh_water_capacity_gal: 60 }
