            - call: "POST /circulation/audit-engagements"
              payload: { statement_id: "${st1_id}", auditor_org: "Verified Audit Bureau", fieldwork_start: "2026-10-05T00:00:00Z", fieldwork_end: "2026-10-09T00:00:00Z", sample_size: 1 }
              as: CirculationAuditor
