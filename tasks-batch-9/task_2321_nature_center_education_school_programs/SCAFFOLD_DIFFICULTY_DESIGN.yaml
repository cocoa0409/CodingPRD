  - rule_id: compensating_invariant
    instances:
      - name: fund_cents_conserved_across_aid_approval_then_booking_cancellation
        grounds:
          - state_machines.AidApplication.PARTIALLY_APPROVED_to_REVOKED
          - state_machines.Booking.REQUESTED_to_CANCELLED
          - calculations.aid_award_allocation
          - entities.ScholarshipFund.fields.available_cents
        distinguishing_aspect: |
          The conserved quantity is money: total_cents must always equal available plus pending
          plus committed plus disbursed, so revoking a 35300-cent award through a booking
          cancellation has to return exactly those cents to available_cents and leave no residue
          in the pending or committed buckets.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-28T07:00:00Z"
