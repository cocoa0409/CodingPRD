  - rule_id: non_linear_state_machine
    instances:
      - name: petition_cure_loop_cycle
        grounds:
          - state_machines.Petition.SUBMITTED_to_DEFICIENT
          - state_machines.Petition.DEFICIENT_to_COLLECTING
          - state_machines.Petition.COLLECTING_to_SUBMITTED
        distinguishing_aspect: |
          Petition is cyclic: SUBMITTED -> DEFICIENT -> COLLECTING -> SUBMITTED ->
          VERIFIED loops with cure_round monotonically increasing — not a linear pipeline.
        test_recipe:
          setup:
            - "RESIDENTIAL segment household_count=5 (required 3); petition with 3 distinct-household signatures"
          setup_api_calls:
            - call: "POST /organizers"
              payload: { full_name: "Dee Fox", email: "dee@x.com", phone: "555-4", address: "8 Oak St" }
              as: Anonymous
              captures: { org_id: $.data.id }
            - call: "POST /street-segments"
              payload: { name: "Oak 300", jurisdiction: CITY, segment_kind: RESIDENTIAL, household_count: 5, business_count: 0, intersects_arterial: false, length_m: 48 }
              as: CityAdmin
              captures: { seg_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: CityAdmin
            - call: "POST /petitions"
              payload: { segment_id: "${seg_id}" }
              as: Organizer
              as_user_id: "${org_id}"
              captures: { pet_id: $.data.id }
            - call: "POST /petitions/${pet_id}/signatures"
              payload: { household_address: "1 Oak St", signer_name: "W One", signer_email: "w1@x.com" }
              as: Neighbor
            - call: "POST /petitions/${pet_id}/signatures"
              payload: { household_address: "2 Oak St", signer_name: "W Two", signer_email: "w2@x.com" }
              as: Neighbor
            - call: "POST /petitions/${pet_id}/signatures"
              payload: { household_address: "3 Oak St", signer_name: "W Three", signer_email: "w3@x.com" }
              as: Neighbor
            - call: "POST /petitions/${pet_id}/submit"
              payload: {}
              as: Organizer
              as_user_id: "${org_id}"
          trigger:
            - call: "POST /petitions/${pet_id}/verify"
              payload: { decision: DEFICIENT, note: "illegible row" }
