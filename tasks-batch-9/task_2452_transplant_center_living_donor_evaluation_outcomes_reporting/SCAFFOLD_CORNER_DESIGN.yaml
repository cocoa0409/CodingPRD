          full_name: Coordinator One
          staff_role: TRANSPLANT_COORDINATOR
          npi: '1000000001'
        as: ProgramAdmin
        captures:
          coord_id: $.data.id
      - call: POST /staff-members
        payload:
          program_id: ${prog_id}
          full_name: Advocate One
          staff_role: LIVING_DONOR_ADVOCATE
          npi: '1000000002'
        as: ProgramAdmin
        captures:
          adv_id: $.data.id
      - call: POST /staff-members
        payload:
          program_id: ${prog_id}
          full_name: Reviewer Med
          staff_role: EVALUATION_REVIEWER
          npi: '1000000003'
        as: ProgramAdmin
        captures:
          revmed_id: $.data.id
      - call: POST /staff-members
        payload:
          program_id: ${prog_id}
          full_name: Reviewer Psy
          staff_role: EVALUATION_REVIEWER
          npi: '1000000004'
        as: ProgramAdmin
        captures:
          revpsy_id: $.data.id
      - call: POST /recipient-candidates
        payload:
          program_id: ${prog_id}
          mrn: R-001
          abo_blood_type: A
          age_years: 44
          cpra: 0.85
          dialysis_years: 2.0
          medical_urgency_points: 7
        as: TransplantCoordinator
        as_user_id: ${coord_id}
        captures:
          rec1_id: $.data.id
      - call: POST /donor-candidates
        payload:
          program_id: ${prog_id}
          mrn: D-502
          abo_blood_type: O
          age_years: 41
          intended_recipient_id: ${rec1_id}
        as: TransplantCoordinator
        as_user_id: ${coord_id}
        captures:
          d1_id: $.data.id
      - call: POST /donor-evaluations
        payload:
          donor_candidate_id: ${d1_id}
          domain: MEDICAL
          bmi: 31.0
          egfr_ml_min: 84.0
          systolic_bp: 145
          hba1c: 6.0
          coercion_flag: false
          unmanaged_substance_use: false
          decisional_capacity_ok: true
          financial_hardship_score: 1
