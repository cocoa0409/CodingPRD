            - "The 06:00 candidate returns HTTP 200 with ${camp_b_family} == IRON_PHOSPHATE and status SCHEDULED: a gap of exactly the buffer is accepted"
            - "GET /recycling/campaigns?line_id=${line_id} reports total_count == 2 and ${first_camp} == ${camp_a}"
            - "ProcessingCampaign.${camp_b}.window_start == 2026-08-02T06:00:00.000Z"

      - name: permit_daily_bucket_aggregate_capacity_per_utc_calendar_day
        grounds:
          - calculations.permit_daily_bucket_usage
          - errors[ERR_DISCHARGE_DAILY_CAP_EXCEEDED]
          - errors[ERR_PERMIT_WINDOW_EXCLUDED]
          - entities.PermitAllotment.fields.consumed_kg
        distinguishing_aspect: |
          Permit allowance is a resource sliced into disjoint UTC calendar-day buckets inside a
          CLOSED validity interval: 500.0 kg at 2026-08-20T23:59:59.999Z and another 500.0 kg one
          millisecond later at 2026-08-21T00:00:00.000Z are both accepted because they land in
          different buckets, yet the running consumed_kg aggregates them to 1000.0; a further
          0.001 kg later on 08-21 is refused, a booking dated 2026-09-01 is refused with
          ERR_PERMIT_WINDOW_EXCLUDED even though the clock is inside the window, and a booking
          dated exactly at valid_from is accepted.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-20T00:00:00.000Z, one campus, one HYDROMET NICKEL_RICH line, one SCHEDULED campaign 2026-08-25 to 2026-09-30 and one OPEN lot L-1 to attribute discharges to."
            - "One ACTIVE WATER PermitAllotment NV-W-118, valid_from 2026-08-01T00:00:00.000Z, valid_to 2026-08-31T23:59:59.999Z, daily_cap_kg 500.0, consumed_kg 0.0."
