            - "BELOW THE BOUNDARY: Settlement.${settle_b1}.effective_operator_pct == 65 and split_share_cents == 1299999"
            - "BELOW THE BOUNDARY: Settlement.${settle_b1}.settlement_due_cents == 1299999"
            - "AT THE BOUNDARY: after the trigger, Settlement.${settle_b1}.taxable_net_cents == 2000000 (exactly SPLIT_TIER_1_CENTS)"
            - "AT THE BOUNDARY: Settlement.${settle_b1}.effective_operator_pct == 67.5 (the >= comparison is inclusive)"
            - "AT THE BOUNDARY: Settlement.${settle_b1}.split_share_cents == 1350000 and settlement_due_cents == 1350000"
            - "Settlement.${settle_b1}.effective_operator_pct is never 72.5: MAX_OPERATOR_PCT is not reached by a single tier bonus"

      - name: permit_lead_time_floor_admits_exact_equality_then_fails_one_second_later
        grounds:
          - validations[priority=72]
          - state_machines.PermitApplication.DRAFT_to_SUBMITTED
          - errors[ERR_PERMIT_LEAD_TIME_VIOLATION]
          - endpoints["POST /_clock/set_current_utc"]
        distinguishing_aspect: |
          The boundary is a TRUNCATING TIME FLOOR, not a money threshold: with open_date 2026-09-04T12:00:00Z and
          permit_lead_days 10, the clock at exactly 2026-08-25T12:00:00Z gives floor(864000 / 86400) == 10 and the
          submission is admitted, while advancing the clock by a single second gives floor(863999 / 86400) == 9 and
          the very next submission is refused. An implementation using ceil or a rounded day count would admit both.
        test_recipe:
          setup:
            - "Jurisdiction OH with permit_lead_days 10; Venue V1; Route R1 DRAFT with one PLANNED stop whose open_date is 2026-09-04T12:00:00Z."
            - "Two DRAFT permit applications on that stop: a TRANSPORT one and an EVENT one, so the same boundary can be probed twice."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /jurisdictions"
              payload: { state_code: "OH", name: "Ohio", permit_lead_days: 10, amusement_tax_pct: 6.5, permit_fee_cents: 50000 }
              as: PlatformAdmin
              captures: { jur_b2: $.data.id }
            - call: "POST /venues"
              payload: { jurisdiction_id: "${jur_b2}", name: "Franklin County Fairgrounds", city: "Columbus", lot_area_sqft: 100000, power_amps_available: 1200, expected_attendance: 20001, lot_surface: "GRAVEL" }
              as: PlatformAdmin
              captures: { venue_b2: $.data.id }
            - call: "POST /routes"
              payload: { name: "2026 Midwest Swing", season_year: 2026, home_base_state: "OH" }
              as: RouteManager
              captures: { route_b2: $.data.id }
            - call: "POST /route-stops"
              payload: { route_id: "${route_b2}", venue_id: "${venue_b2}", load_in_start: "2026-09-01T06:00:00Z", open_date: "2026-09-04T12:00:00Z", close_date: "2026-09-07T12:00:00Z", teardown_deadline: "2026-09-08T12:00:00Z" }
              as: RouteManager
              captures: { stop_b2: $.data.id }
            - call: "POST /permit-applications"
              payload: { route_stop_id: "${stop_b2}", permit_type: "TRANSPORT", valid_from: "2026-09-01T00:00:00Z", valid_until: "2026-09-09T00:00:00Z", axles_declared: 4 }
              as: ComplianceClerk
              captures: { permit_edge_ok: $.data.id }
            - call: "POST /permit-applications"
              payload: { route_stop_id: "${stop_b2}", permit_type: "EVENT", valid_from: "2026-09-04T00:00:00Z", valid_until: "2026-09-08T00:00:00Z" }
              as: ComplianceClerk
              captures: { permit_edge_bad: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-25T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /permit-applications/${permit_edge_ok}/submit"
              payload: {}
              as: ComplianceClerk
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-25T12:00:01Z" }
              as: PlatformAdmin
            - call: "POST /permit-applications/${permit_edge_bad}/submit"
              payload: {}
              as: ComplianceClerk
              captures: { lead_error: $.data.error_id }
          assert:
            - "AT THE BOUNDARY: trigger call 2 returns HTTP 200 and PermitApplication.${permit_edge_ok}.status == SUBMITTED with submitted_at == 2026-08-25T12:00:00Z"
            - "ONE SECOND PAST: trigger call 4 returns HTTP 422 with error_id == ERR_PERMIT_LEAD_TIME_VIOLATION"
            - "ONE SECOND PAST: PermitApplication.${permit_edge_bad}.status is still DRAFT and submitted_at == null"
            - "GET /route-stops/${stop_b2}/permit-applications?status=SUBMITTED returns exactly 1 row"

      - name: lot_power_headroom_admits_exact_equality_then_rejects_one_more_amp
        grounds:
          - calculations.lot_capacity_charge
          - validations[priority=91]
          - errors[ERR_LOT_POWER_EXCEEDED]
          - entities.RouteStop.fields.power_amps_used
        distinguishing_aspect: |
          The boundary is a ONE-DECIMAL AMPERAGE CEILING reached by accumulation, not by a single row: three surged
          charges (375.0 + 138.0 + 387.0) land exactly on round_half_up(1000 * 90 / 100, 1) == 900.0 and the third
          allocation is admitted because the gate is `<=`, while a fourth ride drawing a single amp (KIDDIE surge 0,
          so charged 1.0) pushes the total to 901.0 and is refused. The lot's usable area is never the binding
          constraint here (8482 sqft of 154999), which isolates the power gate.
        test_recipe:
          setup:
            - "Jurisdiction OH; Venue V2 with power_amps_available 1000, lot_area_sqft 200000, expected_attendance 10001, so the amperage ceiling is 900.0 and the usable lot is 154999 sqft."
            - "Rides: WHEEL (MAJOR 4010 sqft / 300 A -> 375.0), TILT (FLAT 2003 sqft / 120 A -> 138.0), BOUNDARY (KIDDIE 501 sqft / 387 A -> 387.0), ONEAMP (KIDDIE 101 sqft / 1 A -> 1.0)."
            - "Route R1 DRAFT with one PLANNED stop on V2."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /jurisdictions"
              payload: { state_code: "OH", name: "Ohio", permit_lead_days: 10, amusement_tax_pct: 6.5, permit_fee_cents: 50000 }
              as: PlatformAdmin
              captures: { jur_b3: $.data.id }
            - call: "POST /venues"
              payload: { jurisdiction_id: "${jur_b3}", name: "Union County Fairgrounds", city: "Marysville", lot_area_sqft: 200000, power_amps_available: 1000, expected_attendance: 10001, lot_surface: "PAVED", housing_pads_available: 2 }
              as: PlatformAdmin
              captures: { venue_b3: $.data.id }
            - call: "POST /rides"
              payload: { name: "Giant Wheel", ride_class: "MAJOR", footprint_sqft: 4010, power_amps: 300, crew_size_setup: 6, setup_hours: 8, axle_count: 4 }
              as: PlatformAdmin
              captures: { ride_b3a: $.data.id }
            - call: "POST /rides"
              payload: { name: "Tilt-A-Whirl", ride_class: "FLAT", footprint_sqft: 2003, power_amps: 120, crew_size_setup: 4, setup_hours: 5, axle_count: 2 }
              as: PlatformAdmin
              captures: { ride_b3b: $.data.id }
            - call: "POST /rides"
              payload: { name: "Fun Slide", ride_class: "KIDDIE", footprint_sqft: 501, power_amps: 387, crew_size_setup: 2, setup_hours: 2, axle_count: 1 }
              as: PlatformAdmin
              captures: { ride_b3c: $.data.id }
            - call: "POST /rides"
              payload: { name: "Kiddie Cars", ride_class: "KIDDIE", footprint_sqft: 101, power_amps: 1, crew_size_setup: 1, setup_hours: 1, axle_count: 1 }
              as: PlatformAdmin
              captures: { ride_b3d: $.data.id }
            - call: "POST /routes"
              payload: { name: "2026 Midwest Swing", season_year: 2026, home_base_state: "OH" }
              as: RouteManager
              captures: { route_b3: $.data.id }
            - call: "POST /route-stops"
              payload: { route_id: "${route_b3}", venue_id: "${venue_b3}", load_in_start: "2026-09-01T06:00:00Z", open_date: "2026-09-04T12:00:00Z", close_date: "2026-09-07T12:00:00Z", teardown_deadline: "2026-09-08T12:00:00Z" }
              as: RouteManager
              captures: { stop_b3: $.data.id, sv_b3a: $.data.version }
            - call: "POST /ride-allocations"
              payload: { ride_id: "${ride_b3a}", route_stop_id: "${stop_b3}", expected_route_stop_version: "${sv_b3a}" }
              as: LotBoss
            - call: "GET /route-stops/${stop_b3}"
              payload: {}
              as: LotBoss
              captures: { sv_b3b: $.data.version }
            - call: "POST /ride-allocations"
              payload: { ride_id: "${ride_b3b}", route_stop_id: "${stop_b3}", expected_route_stop_version: "${sv_b3b}" }
              as: LotBoss
            - call: "GET /route-stops/${stop_b3}"
              payload: {}
              as: LotBoss
              captures: { sv_b3c: $.data.version }
          trigger:
            - call: "POST /ride-allocations"
              payload: { ride_id: "${ride_b3c}", route_stop_id: "${stop_b3}", expected_route_stop_version: "${sv_b3c}" }
              as: LotBoss
              captures: { alloc_edge_ok: $.data.id }
            - call: "GET /route-stops/${stop_b3}"
              payload: {}
              as: LotBoss
              captures: { sv_b3d: $.data.version }
            - call: "POST /ride-allocations"
              payload: { ride_id: "${ride_b3d}", route_stop_id: "${stop_b3}", expected_route_stop_version: "${sv_b3d}" }
              as: LotBoss
              captures: { power_error: $.data.error_id }
          assert:
            - "Before the trigger: RouteStop.${stop_b3}.power_amps_used == 513.0 and allocated_sqft_used == 7818"
            - "AT THE BOUNDARY: trigger call 1 returns HTTP 201, RideAllocation.${alloc_edge_ok}.power_charged_amps == 387.0 and footprint_charged_sqft == 552"
            - "AT THE BOUNDARY: RouteStop.${stop_b3}.power_amps_used == 900.0, exactly equal to the 900.0 ceiling"
            - "ONE AMP PAST: trigger call 3 returns HTTP 422 with error_id == ERR_LOT_POWER_EXCEEDED (900.0 + 1.0 > 900.0)"
            - "ONE AMP PAST: the trigger does NOT return ERR_LOT_CAPACITY_EXCEEDED — 8370 + 112 sqft is far under the 154999 usable lot"
            - "After the rejection: RouteStop.${stop_b3}.power_amps_used is still 900.0 and allocated_sqft_used is still 8370"
            - "GET /ride-allocations?ride_id=${ride_b3d} returns 0 rows"

  # ===========================================================================
  # RULE 7 — cross_entity_state_dependency
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: contract_execute_requires_the_parent_route_to_be_committed
        grounds:
          - state_machines.Contract.SENT_to_EXECUTED
          - state_machines.Route.SEQUENCED_to_COMMITTED
          - validations[priority=40]
          - errors[ERR_ROUTE_STATE_INVALID]
        distinguishing_aspect: |
          The dependency runs CHILD -> GRANDPARENT and the blocking entity is two hops away: the Contract's own state
          (SENT), actor role and segregation-of-duties are all satisfied, yet execute is refused with
          ERR_ROUTE_STATE_INVALID because the Route behind the stop is still SEQUENCED. Committing the Route — an
          operation that touches neither the Contract nor the stop — is the only thing that changes, and the identical
          execute call then succeeds and confirms the stop.
        test_recipe:
          setup:
            - "Jurisdiction OH, Venue V1, Route R1 SEQUENCED (not yet committed) with one PLANNED stop."
            - "Contract C1 SENT by user-negotiator-1 with guarantee_cents 900000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /jurisdictions"
              payload: { state_code: "OH", name: "Ohio", permit_lead_days: 10, amusement_tax_pct: 6.5, permit_fee_cents: 50000 }
              as: PlatformAdmin
              captures: { jur_x1: $.data.id }
            - call: "POST /venues"
              payload: { jurisdiction_id: "${jur_x1}", name: "Franklin County Fairgrounds", city: "Columbus", lot_area_sqft: 100000, power_amps_available: 1200, expected_attendance: 20001, lot_surface: "GRAVEL" }
              as: PlatformAdmin
              captures: { venue_x1: $.data.id }
            - call: "POST /routes"
              payload: { name: "2026 Midwest Swing", season_year: 2026, home_base_state: "OH" }
              as: RouteManager
              captures: { route_x1: $.data.id }
            - call: "POST /route-stops"
              payload: { route_id: "${route_x1}", venue_id: "${venue_x1}", load_in_start: "2026-09-01T06:00:00Z", open_date: "2026-09-04T12:00:00Z", close_date: "2026-09-07T12:00:00Z", teardown_deadline: "2026-09-08T12:00:00Z" }
              as: RouteManager
              captures: { stop_x1: $.data.id }
            - call: "POST /routes/${route_x1}/sequence"
              payload: {}
              as: RouteManager
            - call: "POST /contracts"
              payload: { route_stop_id: "${stop_x1}", counterparty_name: "Franklin County Agricultural Society", revenue_split_pct_operator: 65, guarantee_cents: 900000, ride_minimum_count: 0, exclusivity: "NONE", settlement_basis: "GREATER_OF" }
              as: ContractNegotiator
              captures: { contract_x1: $.data.id }
            - call: "POST /contracts/${contract_x1}/send"
              payload: {}
              as: ContractNegotiator
              as_user_id: "user-negotiator-1"
          trigger:
            - call: "POST /contracts/${contract_x1}/execute"
              payload: {}
              as: GeneralManager
              as_user_id: "user-gm-1"
              captures: { route_state_error: $.data.error_id }
            - call: "POST /routes/${route_x1}/commit"
              payload: {}
              as: RouteManager
            - call: "POST /contracts/${contract_x1}/execute"
              payload: {}
              as: GeneralManager
              as_user_id: "user-gm-1"
          assert:
            - "Before the trigger: Route.${route_x1}.status == SEQUENCED, Contract.${contract_x1}.status == SENT, RouteStop.${stop_x1}.status == PLANNED"
            - "Trigger call 1 returns HTTP 409 with error_id == ERR_ROUTE_STATE_INVALID"
            - "Trigger call 1 leaves Contract.${contract_x1}.status == SENT, executed_at == null and Route.${route_x1}.total_guaranteed_cents == 0"
            - "Trigger call 1 does NOT return ERR_SEGREGATION_OF_DUTIES: user-gm-1 differs from last_sent_by_user_id user-negotiator-1"
            - "After trigger call 2: Route.${route_x1}.status == COMMITTED"
            - "After trigger call 3: Contract.${contract_x1}.status == EXECUTED, executed_at == 2026-08-01T00:00:00Z, Route.${route_x1}.total_guaranteed_cents == 900000 and RouteStop.${stop_x1}.status == CONFIRMED"

      - name: open_gates_blocked_by_a_sibling_event_permit_still_awaiting_decision
        grounds:
          - calculations.stop_compliance_posture
          - state_machines.RouteStop.SETUP_to_OPEN
          - state_machines.PermitApplication.SUBMITTED_to_APPROVED
          - validations[priority=100]
          - errors[ERR_PERMIT_NOT_APPROVED]
        distinguishing_aspect: |
          The dependency runs PARENT -> SIBLING CHILD and the blocker is a DIFFERENT child of the same stop than the
          one that unblocked setup: the TRANSPORT permit is APPROVED so begin-setup succeeded, the ride minimum is met
          and crew coverage is sufficient, yet open-gates is refused with ERR_PERMIT_NOT_APPROVED because the EVENT
          permit is only SUBMITTED, driving compliance_posture to PERMIT_HOLD at precedence step 1. A single
          JurisdictionOfficer decision on that sibling row flips the posture to CLEAR and the same call succeeds.
        test_recipe:
          setup:
            - "Jurisdiction OH (requires_state_ride_inspection false), Venue V1, one FLAT ride, one FLAT-certified operator."
            - "Route R1 COMMITTED, Contract C1 EXECUTED, stop A driven to SETUP with an APPROVED TRANSPORT permit."
            - "The EVENT permit covering [open_date, close_date] is SUBMITTED but undecided; the clock is at 2026-09-04T12:00:00Z so the open_date gate itself is satisfied."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /jurisdictions"
              payload: { state_code: "OH", name: "Ohio", permit_lead_days: 10, amusement_tax_pct: 6.5, permit_fee_cents: 50000, max_consecutive_work_days: 6 }
              as: PlatformAdmin
              captures: { jur_x2: $.data.id }
            - call: "POST /venues"
              payload: { jurisdiction_id: "${jur_x2}", name: "Franklin County Fairgrounds", city: "Columbus", lot_area_sqft: 100000, power_amps_available: 1200, expected_attendance: 20001, lot_surface: "GRAVEL", housing_pads_available: 4 }
              as: PlatformAdmin
              captures: { venue_x2: $.data.id }
            - call: "POST /rides"
              payload: { name: "Tilt-A-Whirl", ride_class: "FLAT", footprint_sqft: 2003, power_amps: 120, crew_size_setup: 4, setup_hours: 5, axle_count: 2, requires_state_inspection: false }
              as: PlatformAdmin
              captures: { ride_x2: $.data.id }
            - call: "POST /workers"
              payload: { full_name: "Ada Operator", employment_type: "PERMANENT", hourly_rate_cents: 1600, certified_ride_classes: ["FLAT"], housing_required: false }
              as: PlatformAdmin
              captures: { worker_x2: $.data.id }
            - call: "POST /routes"
              payload: { name: "2026 Midwest Swing", season_year: 2026, home_base_state: "OH" }
              as: RouteManager
              captures: { route_x2: $.data.id }
            - call: "POST /route-stops"
              payload: { route_id: "${route_x2}", venue_id: "${venue_x2}", load_in_start: "2026-09-01T06:00:00Z", open_date: "2026-09-04T12:00:00Z", close_date: "2026-09-07T12:00:00Z", teardown_deadline: "2026-09-08T12:00:00Z" }
              as: RouteManager
              captures: { stop_x2: $.data.id, sv_x2: $.data.version }
            - call: "POST /permit-applications"
              payload: { route_stop_id: "${stop_x2}", permit_type: "TRANSPORT", valid_from: "2026-09-01T00:00:00Z", valid_until: "2026-09-09T00:00:00Z", axles_declared: 2 }
              as: ComplianceClerk
              captures: { permit_x2t: $.data.id }
            - call: "POST /permit-applications/${permit_x2t}/submit"
              payload: {}
              as: ComplianceClerk
            - call: "POST /permit-applications/${permit_x2t}/decision"
              payload: { decision: "APPROVE" }
              as: JurisdictionOfficer
            - call: "POST /permit-applications"
              payload: { route_stop_id: "${stop_x2}", permit_type: "EVENT", valid_from: "2026-09-04T00:00:00Z", valid_until: "2026-09-08T00:00:00Z" }
              as: ComplianceClerk
              captures: { permit_x2e: $.data.id }
            - call: "POST /permit-applications/${permit_x2e}/submit"
              payload: {}
              as: ComplianceClerk
            - call: "POST /ride-allocations"
              payload: { ride_id: "${ride_x2}", route_stop_id: "${stop_x2}", expected_route_stop_version: "${sv_x2}" }
              as: LotBoss
            - call: "POST /routes/${route_x2}/sequence"
              payload: {}
              as: RouteManager
            - call: "POST /contracts"
              payload: { route_stop_id: "${stop_x2}", counterparty_name: "Franklin County Agricultural Society", revenue_split_pct_operator: 65, guarantee_cents: 0, ride_minimum_count: 1, exclusivity: "NONE", settlement_basis: "SPLIT_ONLY" }
              as: ContractNegotiator
              captures: { contract_x2: $.data.id }
            - call: "POST /contracts/${contract_x2}/send"
              payload: {}
              as: ContractNegotiator
              as_user_id: "user-negotiator-1"
            - call: "POST /routes/${route_x2}/commit"
              payload: {}
              as: RouteManager
            - call: "POST /contracts/${contract_x2}/execute"
              payload: {}
              as: GeneralManager
              as_user_id: "user-gm-1"
            - call: "POST /crew-assignments"
              payload: { route_stop_id: "${stop_x2}", worker_id: "${worker_x2}", crew_role: "RIDE_OPERATOR", shift_start: "2026-09-04T12:00:00Z", shift_end: "2026-09-04T20:00:00Z" }
              as: LotBoss
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T07:00:00Z" }
              as: PlatformAdmin
            - call: "POST /route-stops/${stop_x2}/begin-setup"
              payload: {}
              as: LotBoss
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-04T12:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /route-stops/${stop_x2}/open-gates"
              payload: {}
              as: LotBoss
              captures: { gate_error: $.data.error_id }
            - call: "POST /permit-applications/${permit_x2e}/decision"
              payload: { decision: "APPROVE" }
              as: JurisdictionOfficer
            - call: "POST /route-stops/${stop_x2}/open-gates"
              payload: {}
              as: LotBoss
          assert:
            - "Before the trigger: RouteStop.${stop_x2}.status == SETUP, PermitApplication.${permit_x2t}.status == APPROVED, PermitApplication.${permit_x2e}.status == SUBMITTED"
            - "Before the trigger: GET /route-stops/${stop_x2}/readiness returns compliance_posture == PERMIT_HOLD, blocking_error_id == ERR_PERMIT_NOT_APPROVED, event_permit_ok == false, crew_coverage_ok == true, committed_ride_count == 1, ride_minimum_required == 1"
            - "Trigger call 1 returns HTTP 409 with error_id == ERR_PERMIT_NOT_APPROVED and leaves RouteStop.${stop_x2}.status == SETUP"
            - "Trigger call 1 does NOT return ERR_RIDE_MINIMUM_NOT_MET or ERR_CREW_COVERAGE_INSUFFICIENT"
            - "After trigger call 2: PermitApplication.${permit_x2e}.status == APPROVED and GET /route-stops/${stop_x2}/readiness returns compliance_posture == CLEAR with blocking_error_id == null"
            - "After trigger call 3: RouteStop.${stop_x2}.status == OPEN, its allocation is OPERATING, RouteStop.${stop_x2}.operating_ride_count == 1 and Route.${route_x2}.status == IN_PROGRESS"

      - name: settlement_finalize_blocked_by_a_child_weather_closure_still_logged
        grounds:
          - state_machines.Settlement.PROVISIONAL_to_FINAL
          - state_machines.WeatherClosure.LOGGED_to_ADJUDICATED
          - calculations.weather_abatement_hours
          - validations[priority=102]
          - errors[ERR_CLOSURE_NOT_ADJUDICATED]
        distinguishing_aspect: |
          The dependency runs COUSIN -> COUSIN: the WeatherClosure is a child of the RouteStop while the Settlement is
          a child of the Contract, so the gate crosses the stop rather than descending it. finalize is refused with
          ERR_CLOSURE_NOT_ADJUDICATED while the closure is LOGGED even though the stop is TEARDOWN and no make-good is
          pending, and adjudicating the closure both unblocks finalize and injects 5.0 abated hours that the FINAL
          variant then consumes.
        test_recipe:
          setup:
            - "The stop-A fixture of settlement_finalize_cascades_three_hops_to_crew_worker_and_route_closure: OH, one FLAT ride, contract split 65, guarantee_cents 0, ride_minimum_count 0, SPLIT_ONLY, one WRISTBAND 100x1000 sale."
            - "That stop has already reached TEARDOWN at clock 2026-09-07T12:00:00Z and carries one PROVISIONAL Settlement; its id and its contract's id are rediscovered through filtered list reads."
            - "A WIND WeatherClosure covering 2026-09-05T14:00:00Z..2026-09-05T19:00:00Z is then logged against the torn-down stop and left in LOGGED."
          setup_api_calls:
            - call: "GET /route-stops?status=TEARDOWN"
              payload: {}
              as: LotBoss
              captures: { stop_y: "$.data[0].id" }
            - call: "GET /contracts?route_stop_id=${stop_y}&status=EXECUTED"
              payload: {}
              as: TicketingAuditor
              captures: { contract_y: "$.data[0].id" }
            - call: "GET /contracts/${contract_y}/settlements?status=PROVISIONAL"
              payload: {}
              as: TicketingAuditor
              captures: { settle_y: "$.data[0].id" }
            - call: "POST /route-stops/${stop_y}/weather-closures"
              payload: { cause: "WIND", closed_from: "2026-09-05T14:00:00Z", closed_to: "2026-09-05T19:00:00Z" }
              as: LotBoss
              captures: { closure_x3: $.data.id }
          trigger:
            - call: "POST /settlements/${settle_y}/finalize"
              payload: {}
              as: GeneralManager
              captures: { closure_error: $.data.error_id }
            - call: "POST /weather-closures/${closure_x3}/adjudicate"
              payload: {}
              as: GeneralManager
            - call: "POST /settlements/${settle_y}/finalize"
              payload: {}
              as: GeneralManager
          assert:
            - "Before the trigger: WeatherClosure.${closure_x3}.status == LOGGED, abated_hours == 0.0 and RouteStop.${stop_y}.closure_hours_adjudicated == 0.0"
            - "Trigger call 1 returns HTTP 409 with error_id == ERR_CLOSURE_NOT_ADJUDICATED"
            - "Trigger call 1 leaves Settlement.${settle_y}.status == PROVISIONAL, variant == PROVISIONAL, finalized_at == null and RouteStop.${stop_y}.status == TEARDOWN"
            - "After trigger call 2: WeatherClosure.${closure_x3}.status == ADJUDICATED, abated_hours == 5.0 and RouteStop.${stop_y}.closure_hours_adjudicated == 5.0"
            - "After trigger call 3: Settlement.${settle_y}.status == FINAL and variant == FINAL"
            - "After trigger call 3: Settlement.${settle_y}.guarantee_effective_cents == 0 (guarantee_cents is 0, so the 5/24 abatement ratio has no money effect) and settlement_due_cents == 60775"
            - "After trigger call 3: RouteStop.${stop_y}.status == CLOSED"

  # ===========================================================================
  # RULE 8 — resource_temporal_overlap
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: ride_occupation_is_closed_and_needs_a_four_hour_transport_buffer
        grounds:
          - validations[priority=70]
          - calculations.lot_capacity_charge
          - entities.RideAllocation.fields.occupation_start
          - entities.RideAllocation.fields.occupation_end
          - errors[ERR_RIDE_DOUBLE_BOOKED]
        distinguishing_aspect: |
          The contended resource is a RIDE and its occupation interval is CLOSED and padded: stop A holds the ride
          from 2026-09-01T06:00:00Z to 2026-09-08T12:00:00Z inclusive, so a second stop whose load-in is
          2026-09-08T14:00:00Z is refused even though the intervals do not intersect — the 2-hour gap is under
          TRANSPORT_BUFFER_HOURS (= 4) — while a load-in at exactly 2026-09-08T16:00:00Z, a 4-hour gap, is admitted.
          A half-open or unpadded implementation would accept the 14:00 stop.
        test_recipe:
          setup:
            - "Jurisdiction OH; Venue V1 (route R1, stop A) and Venue V2 (route R2, stops B1 and B2, both chain heads so no travel-window coupling constrains them)."
            - "Ride TILT (FLAT 2003 sqft / 120 A, requires_state_inspection false) is RESERVED on stop A, occupying 2026-09-01T06:00:00Z..2026-09-08T12:00:00Z."
            - "Stop B1 load_in_start 2026-09-08T14:00:00Z (2-hour gap); stop B2 load_in_start 2026-09-08T16:00:00Z (exactly 4 hours)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /jurisdictions"
              payload: { state_code: "OH", name: "Ohio", permit_lead_days: 10, amusement_tax_pct: 6.5, permit_fee_cents: 50000 }
