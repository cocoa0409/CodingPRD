              payload: { name: "Fox Farms", account_code: "FOX-01", palletization_standard: "EURO_1200x800", complaint_ppm_threshold: 5000.00 }
              as: PlantManager
              captures: { c: "$.data.id" }
            - call: "POST /glass-plant/bottle-designs"
              payload: { customer_id: "${c}", code: "BD-06", color: "FLINT", capacity_ml: 500.00, nominal_weight_g: 190.00, min_wall_thickness_mm: 1.80, cavity_count: 10, target_line_speed_bpm: 500.00, container_price_usd: 0.1725, mold_owner: "PLANT" }
              as: MoldEngineer
              captures: { d: "$.data.id" }
            - call: "POST /glass-plant/bottle-designs/${d}/submit"
              payload: {}
              as: MoldEngineer
              captures: { lead0: "$.data.lead_time_days" }
