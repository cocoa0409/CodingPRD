# =============================================================================
# SCAFFOLD — task_2285_major_appliance_assembly_plant
# §1.0–§1.7. Difficulty design (§1.8) and corner design (§1.9) live in their
# own sibling files.
# =============================================================================

scenario: |
  2285. Major Appliance Assembly Plant (home appliance manufacturing plant): mixed-model assembly line sequencing with option complexity and part presentation at station, supplier synchronous delivery with sequenced modules and line-side inventory limits, quality gates with electrical safety testing, leak testing and functional cycle checks, energy and water consumption testing for efficiency certification, model changeover, engineering change implementation and part cut-in tracking, service part supply obligations with production of legacy parts, plant labor planning across shifts with seasonal demand and retail promotion cycles, field failure analytics with warranty return teardown and design feedback

domain_name: appliance-assembly-plant
# Flat topology: every entity is its own top-level collection; foreign keys travel
# in request bodies / query filters, not in nested URL paths.
api_prefix: "/"

difficulty_level: expert_plus   # 13 entities, 57 endpoints, 43 error codes, 8 calculations, 7 state machines

complexity_profile:
  primary_archetype: quota_allocation          # finite line-side presentation slots + finite shift labour minutes competed for by sequenced build slots
  secondary_archetype: compliance_audit        # safety/leak/functional/energy/water gates, efficiency certification, service-part supply obligation
  complexity_layers:
    - optimistic_concurrency                   # OCC on ModelVariant.version and Line.version (§1.2.1)
    - cascading_side_effects                   # depth-4 chains from checkpoint sweeps and engineering-change cut-in
    - dual_variant_calculation                 # provisional-vs-final efficiency index; cohort-vs-exposure warranty rate
    - rate_threshold_triggers                  # option-load window cap, fatigue tier, supplier score bands, efficiency tiers

  entity_topology: flat
  state_machine_shape: parallel                # ProductionUnit carries assembly_status x quality_status; EngineeringChange is cyclic; WarrantyReturn branches; Line is posture_driven; BuildSlot bubbles up
  relationship_patterns:
    - one_to_many                              # Line -> Station, Line -> ShiftPlan, ProductionUnit -> QualityTest
    - many_to_many                             # BomLine is the ModelVariant x Part junction, keyed by bom_position_code
    - self_referential                         # BomLine.superseded_by_bom_line_id -> BomLine.id (cut-in chain)
    - cross_aggregate                          # BuildSlot.sync_delivery_call_id, EngineeringChange.source_warranty_return_id
  role_model: segregation_of_duties            # the EngineeringLead who submitted a change may not decide it
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: Line
    parent: null
    common_fields: true
    fields:
      - { name: line_code, type: string, source: input, description: "Human identifier of the assembly line", constraints: "unique across Line; 1..16 chars; ERR_DUPLICATE_CODE on collision" }
      - { name: takt_seconds, type: integer, source: input, description: "Takt time per station in seconds", constraints: ">= 1" }
      - { name: option_load_limit_pct, type: number, source: input, description: "Percent of the theoretical maximum option content the line may absorb in one rolling window", constraints: "> 0 and <= 100" }
      - { name: baseline_headcount, type: integer, source: input, description: "Headcount the option_load_limit_pct is calibrated for; denominator of the staffing factor in calculations.option_load_window_cap", constraints: ">= 1" }
      - { name: current_family_code, type: string, source: input, description: "Product family the line is currently tooled for; a BuildSlot of another family cannot be released until a changeover" }
      - { name: operating_mode, type: enum, source: system, default: RUNNING, description: "RUNNING | STOPPED — set by POST /lines/{id}/stop and POST /lines/{id}/start" }
      - { name: stop_reason, type: string, source: system, description: "Reason recorded by the last stop; null while RUNNING" }
      - { name: posture, type: enum, source: computed, description: "OPEN | CONSTRAINED | STOPPED — see calculations.line_posture; gates BuildSlot sequence/release and EngineeringChange cut-in" }
      - { name: presentation_slots_total, type: integer, source: computed, default: 0, description: "Sum of presentation_slot_capacity over the line's Stations" }
      - { name: presentation_slots_committed, type: integer, source: computed, default: 0, description: "Sum of presentation_slots_used over the line's Stations" }
      - { name: free_slot_pct, type: number, source: computed, default: 0.00, description: "round(100 * (presentation_slots_total - presentation_slots_committed) / presentation_slots_total, 2); 0.00 when presentation_slots_total == 0" }
      - { name: max_released_sequence_index, type: integer, source: computed, default: 0, description: "Highest sequence_index among the line's BuildSlots in status IN {RELEASED, BUILT}; 0 when none" }
      - { name: changeover_count, type: integer, source: system, default: 0, description: "Number of completed family changeovers on this line" }
      - { name: checkpoint_index, type: integer, source: system, default: 0, description: "Monotone counter incremented by POST /lines/{id}/run-checkpoint" }

  - name: Station
    parent: Line
    common_fields: true
    fields:
      - { name: line_id, type: string, source: input, description: "FK -> Line.id; the line this station sits on" }
      - { name: station_code, type: string, source: input, description: "Station identifier", constraints: "unique within line_id; ERR_DUPLICATE_CODE on collision" }
      - { name: position_index, type: integer, source: input, description: "Position along the line, ascending in flow order; allocation order for line-side presentation is position_index ASC", constraints: ">= 1; unique within line_id" }
      - { name: presentation_slot_capacity, type: integer, source: input, description: "Line-side presentation slots physically available at this station", constraints: ">= 0" }
      - { name: presentation_slots_used, type: integer, source: computed, default: 0, description: "Slots reserved by BuildSlots in status IN {SEQUENCED, RELEASED, BUILT} — see calculations.presentation_slot_allocation" }
      - { name: station_cycle_seconds, type: integer, source: input, description: "Work content at this station in seconds", constraints: ">= 1" }

  - name: ModelVariant
    parent: null
    common_fields: true
    fields:
      - { name: model_code, type: string, source: input, description: "Appliance model + option build code", constraints: "unique across ModelVariant; ERR_DUPLICATE_CODE on collision" }
      - { name: family_code, type: string, source: input, description: "Product family; drives model changeover on the line" }
      - { name: option_codes, type: array, source: input, description: "Array of option code strings carried by this variant (informational)" }
      - { name: option_content_points, type: integer, source: input, description: "Option-complexity load this variant places on one sequence position", constraints: ">= 0 and <= 10 (MAX_POINTS_PER_SLOT)" }
      - { name: labor_minutes, type: number, source: input, description: "Direct labour minutes per unit; summed into ShiftPlan.unit_labor_minutes", constraints: "> 0" }
      - { name: requires_leak_test, type: boolean, source: input, default: false, description: "True for water-bearing appliances; when false a LEAK QualityTest is rejected with ERR_TEST_NOT_APPLICABLE" }
      - { name: hipot_leakage_ma_limit, type: number, source: input, description: "Electrical-safety leakage-current limit in mA; ELECTRICAL_SAFETY passes when measured_value <= this limit", constraints: "> 0" }
      - { name: leak_limit_ml_per_min, type: number, source: input, description: "Water-leak limit in ml/min; required when requires_leak_test is true, null otherwise" }
      - { name: functional_cycle_count_required, type: integer, source: input, description: "Cycles a unit must complete; FUNCTIONAL_CYCLE passes when measured_value >= this value (direction inverted versus the other tests)", constraints: ">= 1" }
      - { name: energy_kwh_limit, type: number, source: input, description: "Certification limit for annual energy consumption in kWh", constraints: "> 0" }
      - { name: water_liters_limit, type: number, source: input, description: "Certification limit for per-cycle water consumption in litres", constraints: "> 0" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | RELEASED | OBSOLETE" }

  - name: Supplier
    parent: null
    common_fields: true
    fields:
      - { name: supplier_code, type: string, source: input, description: "Supplier identifier", constraints: "unique across Supplier; ERR_DUPLICATE_CODE on collision" }
      - { name: name, type: string, source: input, description: "Supplier legal name" }
      - { name: sync_window_minutes, type: integer, source: input, description: "Nominal synchronous-delivery window length the supplier commits to (informational)", constraints: ">= 1" }
      - { name: on_time_score, type: number, source: computed, default: 100.00, description: "Synchronous-delivery score in [0.00, 100.00] — see calculations.supplier_on_time_score" }
      - { name: status, type: enum, source: computed, default: APPROVED, description: "APPROVED | PROBATION | SUSPENDED — derived from on_time_score bands in calculations.supplier_on_time_score" }
      - { name: delivered_on_time_count, type: integer, source: system, default: 0, description: "Count of DeliveryCalls that reached ARRIVED_ON_TIME" }
      - { name: delivered_late_count, type: integer, source: system, default: 0, description: "Count of DeliveryCalls that reached ARRIVED_LATE" }
      - { name: missed_count, type: integer, source: system, default: 0, description: "Count of DeliveryCalls that reached MISSED" }
      - { name: quality_penalty_count, type: integer, source: system, default: 0, description: "Count of WarrantyReturns analysed as SUPPLIER_DEFECT against this supplier's parts" }

  - name: Part
    parent: null
    common_fields: true
    fields:
      - { name: part_number, type: string, source: input, description: "Engineering part number", constraints: "unique across Part; ERR_DUPLICATE_CODE on collision" }
      - { name: supplier_id, type: string, source: input, description: "FK -> Supplier.id; the supplier that ships this part" }
      - { name: is_sequenced_module, type: boolean, source: input, default: false, description: "True for modules delivered in build sequence; such a part consumes 0 presentation slots but requires a covering DeliveryCall at sequence time" }
      - { name: line_side_max_units, type: integer, source: input, description: "Units of this part that fit in one line-side presentation slot", constraints: ">= 1" }
      - { name: lifecycle_status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | CHANGE_PENDING | SERVICE_ONLY | OBSOLETE" }
      - { name: service_obligation_until, type: datetime, source: system, description: "Set to cut_in_at + SERVICE_OBLIGATION_YEARS when the part is superseded by an engineering change; the part cannot be obsoleted at or before this instant" }
      - { name: field_failure_count, type: integer, source: system, default: 0, description: "Count of WarrantyReturns in status IN {ANALYZED_DESIGN, ANALYZED_SUPPLIER} whose root_cause_part_id is this part" }
      - { name: cohort_failure_rate_per_1000, type: number, source: computed, default: 0.00, description: "PRODUCTION_COHORT variant of calculations.warranty_failure_rate; recomputed on warranty analyse/withdraw" }

  - name: BomLine
    parent: ModelVariant
    common_fields: true
    fields:
      - { name: model_variant_id, type: string, source: input, description: "FK -> ModelVariant.id; the variant this line belongs to" }
      - { name: part_id, type: string, source: input, description: "FK -> Part.id; the part consumed at this position" }
      - { name: station_id, type: string, source: input, description: "FK -> Station.id; where the part is presented" }
      - { name: bom_position_code, type: string, source: input, description: "Stable position key inside the variant (e.g. DOOR-ASSY); a cut-in replaces the part at the same position_code" }
      - { name: qty_per_unit, type: number, source: input, description: "Pieces of the part consumed per appliance", constraints: "> 0" }
      - { name: effective_from_sequence, type: integer, source: input, default: 1, description: "First BuildSlot.sequence_index this line applies to — the cut-in point", constraints: ">= 1" }
      - { name: superseded_by_bom_line_id, type: string, source: system, description: "FK -> BomLine.id; the line that superseded this one; null while ACTIVE" }
      - { name: created_by_change_id, type: string, source: system, description: "FK -> EngineeringChange.id; set when the line was minted by a cut-in; null for manually authored lines" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | SUPERSEDED" }

  - name: DeliveryCall
    parent: null
    common_fields: true
    fields:
      - { name: supplier_id, type: string, source: input, description: "FK -> Supplier.id; the supplier called off" }
      - { name: part_id, type: string, source: input, description: "FK -> Part.id; the part or sequenced module called off" }
      - { name: station_id, type: string, source: input, description: "FK -> Station.id; the line-side drop point (the occupied resource for dock-window overlap)" }
      - { name: window_start, type: datetime, source: input, description: "Inclusive start of the delivery window" }
      - { name: window_end, type: datetime, source: input, description: "Exclusive end of the delivery window", constraints: "> window_start" }
      - { name: sequenced_qty, type: integer, source: input, description: "Modules in the sequenced drop", constraints: ">= 1" }
      - { name: arrived_at, type: datetime, source: system, description: "Arrival instant recorded by the supplier portal; null until arrival" }
      - { name: lateness_minutes, type: integer, source: computed, description: "ceil((arrived_at - window_end) / 60s) when arrived_at >= window_end, else 0; null until arrival" }
      - { name: cancel_reason, type: enum, source: system, description: "PLANNER | SUPPLIER_PROBATION | PART_SERVICE_ONLY — why the call was cancelled; null unless status == CANCELLED" }
      - { name: status, type: enum, source: system, default: SCHEDULED, description: "SCHEDULED | ARRIVED_ON_TIME | ARRIVED_LATE | MISSED | CANCELLED" }

  - name: ShiftPlan
    parent: Line
    common_fields: true
    fields:
      - { name: line_id, type: string, source: input, description: "FK -> Line.id; the line this shift staffs" }
      - { name: shift_date, type: string, source: input, description: "Calendar date of the shift start, YYYY-MM-DD (UTC)" }
      - { name: shift_code, type: enum, source: input, description: "A | B | C — fixes the base window: A 06:00-14:00Z, B 14:00-22:00Z, C 22:00-06:00Z of the next day" }
      - { name: planned_headcount, type: integer, source: input, description: "Operators staffed; seasonal demand and retail promotion cycles are absorbed by moving this number", constraints: ">= 1" }
      - { name: overtime_minutes, type: integer, source: input, default: 0, description: "Minutes the shift is extended past its base end; extends shift_end and raises available_labor_minutes", constraints: ">= 0 and <= 120 (OVERTIME_CAP_MINUTES)" }
      - { name: shift_start, type: datetime, source: input, description: "Absolute start instant of the shift; must equal shift_date at the base start hour of shift_code (ERR_INVALID_REQUEST otherwise)" }
      - { name: shift_end, type: datetime, source: input, description: "Absolute base end instant of the shift, before overtime; must equal the base end hour of shift_code (C wraps to the next day) and be strictly after shift_start" }
      - { name: available_labor_minutes, type: number, source: computed, description: "SHIFT_MINUTES + overtime_minutes — a single-crew line, so planned_headcount is NOT a factor (see calculations.shift_committed_labor_minutes); planned_headcount only scales the option-load window cap" }
      - { name: unit_labor_minutes, type: number, source: computed, default: 0, description: "Sum of ModelVariant.labor_minutes over the shift's BuildSlots in status IN {SEQUENCED, RELEASED, BUILT}" }
      - { name: changeover_minutes, type: number, source: computed, default: 0, description: "CHANGEOVER_MINUTES * number of family transitions between adjacent slots of that same set, ordered by sequence_index ASC" }
      - { name: committed_labor_minutes, type: number, source: computed, default: 0, description: "ceil((unit_labor_minutes + changeover_minutes) * fatigue_factor) — see calculations.shift_committed_labor_minutes" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | SUPERSEDED" }

  - name: BuildSlot
    parent: Line
    common_fields: true
    fields:
      - { name: line_id, type: string, source: input, description: "FK -> Line.id; the line the slot is scheduled on" }
      - { name: model_variant_id, type: string, source: input, description: "FK -> ModelVariant.id; what gets built in the slot" }
      - { name: shift_plan_id, type: string, source: system, description: "FK -> ShiftPlan.id; the ACTIVE shift plan whose [shift_start, shift_end) contains planned_start, resolved at sequence time; null while PLANNED" }
      - { name: sync_delivery_call_id, type: string, source: system, description: "FK -> DeliveryCall.id; the sequenced-module call selected at sequence time; null when the variant has no sequenced module" }
      - { name: sequence_index, type: integer, source: input, description: "Position in the mixed-model build sequence on this line", constraints: ">= 1; unique per line_id among BuildSlots with status != CANCELLED" }
      - { name: planned_start, type: datetime, source: input, description: "Planned start instant; selects the covering ShiftPlan and the covering DeliveryCall" }
      - { name: option_points_snapshot, type: integer, source: system, description: "ModelVariant.option_content_points pinned at sequence time; null while PLANNED" }
      - { name: labor_minutes_snapshot, type: number, source: system, description: "ModelVariant.labor_minutes pinned at sequence time; null while PLANNED" }
      - { name: presentation_allocations, type: array, source: system, description: "Array of objects [{ station_id, slot_units }] pinned at sequence time; replayed in reverse on de-sequence" }
      - { name: allocated_slot_units, type: integer, source: system, default: 0, description: "Sum of slot_units over presentation_allocations" }
      - { name: status, type: enum, source: system, default: PLANNED, description: "PLANNED | SEQUENCED | RELEASED | BUILT | CANCELLED" }

  - name: ProductionUnit
    parent: BuildSlot
    common_fields: true
    fields:
      - { name: build_slot_id, type: string, source: system, description: "FK -> BuildSlot.id; the slot that released this unit" }
      - { name: serial_number, type: string, source: system, description: "Deterministic: line_code + '-' + sequence_index zero-padded to 6 digits (e.g. L1-000004)" }
      - { name: built_at_sequence_index, type: integer, source: system, description: "BuildSlot.sequence_index copied at release; the index the historical BOM is resolved against for warranty attribution" }
      - { name: assembly_status, type: enum, source: system, default: IN_STATION, description: "IN_STATION | ASSEMBLED | REWORK | SHIPPED — first of two independent status dimensions" }
      - { name: quality_status, type: enum, source: system, default: PENDING, description: "PENDING | SAFETY_PASSED | GATED | CERTIFIED | QUARANTINED — second, independent status dimension" }
      - { name: rework_count, type: integer, source: system, default: 0, description: "Times the unit entered REWORK" }
      - { name: provisional_efficiency_index, type: number, source: computed, description: "AS_TESTED variant of calculations.efficiency_index, refreshed on every ENERGY/WATER test; null until both types exist" }
      - { name: efficiency_index, type: number, source: computed, description: "CERTIFICATION_AVERAGE variant of calculations.efficiency_index, written only by certify; null before" }
      - { name: certification_tier, type: enum, source: computed, description: "A_PLUS | A | B — written only by certify; null before" }

  - name: QualityTest
    parent: ProductionUnit
    common_fields: false   # append-only measurement record: id + created_at only; no version, no client update endpoint
    fields:
      - { name: production_unit_id, type: string, source: system, description: "FK -> ProductionUnit.id; the unit under test" }
      - { name: test_type, type: enum, source: input, description: "ELECTRICAL_SAFETY | LEAK | FUNCTIONAL_CYCLE | ENERGY | WATER" }
      - { name: measured_value, type: number, source: input, description: "Measurement: mA for ELECTRICAL_SAFETY, ml/min for LEAK, completed cycles for FUNCTIONAL_CYCLE, kWh for ENERGY, litres for WATER", constraints: ">= 0" }
      - { name: limit_value, type: number, source: system, description: "The ModelVariant limit snapshotted at record time (hipot_leakage_ma_limit / leak_limit_ml_per_min / functional_cycle_count_required / energy_kwh_limit / water_liters_limit)" }
      - { name: result, type: enum, source: computed, description: "PASS | FAIL for ELECTRICAL_SAFETY, LEAK, FUNCTIONAL_CYCLE; always MEASURED for ENERGY and WATER" }
      - { name: status, type: enum, source: system, default: RECORDED, description: "RECORDED | VOIDED — system-voided by POST /production-units/{id}/clear-quarantine; never client-mutated" }

  - name: EngineeringChange
    parent: null
    common_fields: true
    fields:
      - { name: origin, type: enum, source: input, default: MANUAL, description: "MANUAL | WARRANTY — WARRANTY rows are minted by the field-failure cascade, never by a client" }
      - { name: model_variant_id, type: string, source: input, description: "FK -> ModelVariant.id; the variant whose BOM is changed" }
      - { name: bom_position_code, type: string, source: input, description: "The BOM position being cut in" }
      - { name: affected_part_id, type: string, source: input, description: "FK -> Part.id; the part being replaced" }
      - { name: replacement_part_id, type: string, source: input, description: "FK -> Part.id; the incoming part; null on WARRANTY-origin rows until an engineer supplies one" }
      - { name: target_line_id, type: string, source: input, description: "FK -> Line.id; the line the cut-in happens on" }
      - { name: source_warranty_return_id, type: string, source: system, description: "FK -> WarrantyReturn.id; set only on WARRANTY-origin rows" }
      - { name: cut_in_sequence_index, type: integer, source: input, description: "First BuildSlot.sequence_index the new BOM line applies to", constraints: ">= 1" }
      - { name: new_qty_per_unit, type: number, source: input, description: "qty_per_unit for the minted BomLine; when null the superseded line's qty_per_unit is inherited", constraints: "> 0 when supplied" }
      - { name: submitted_by_user_id, type: string, source: system, description: "X-User-ID of the actor that submitted (last submit wins); segregation of duties compares it to the decider" }
      - { name: decided_by_user_id, type: string, source: system, description: "X-User-ID of the actor that decided APPROVE/REJECT/REQUEST_REVISION" }
      - { name: revision_round, type: integer, source: system, default: 0, description: "Incremented on every REQUEST_REVISION; exceeding EC_MAX_REVISION_ROUNDS auto-cancels the change" }
      - { name: cut_in_at, type: datetime, source: system, description: "Logical-clock instant of the cut-in; null before" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | SUBMITTED | UNDER_REVIEW | REVISION_REQUESTED | APPROVED | REJECTED | CUT_IN | CLOSED | CANCELLED" }

  - name: WarrantyReturn
    parent: ProductionUnit
    common_fields: true
    fields:
      - { name: production_unit_id, type: string, source: input, description: "FK -> ProductionUnit.id; the returned appliance" }
      - { name: failure_code, type: string, source: input, description: "Field failure code reported from the service network" }
      - { name: field_hours, type: number, source: input, description: "Operating hours accumulated in the field before failure; denominator of the SHIPPED_EXPOSURE variant", constraints: ">= 0" }
      - { name: returned_at, type: datetime, source: input, description: "Instant the unit was received at the teardown bench; optional on POST /warranty-returns and defaulted to the logical clock when omitted" }
      - { name: teardown_started_at, type: datetime, source: system, description: "Logical-clock instant teardown began; null before" }
      - { name: disposition, type: enum, source: system, description: "DESIGN_DEFECT | SUPPLIER_DEFECT | NO_FAULT_FOUND — set by analyse; null before" }
      - { name: root_cause_part_id, type: string, source: system, description: "FK -> Part.id; part charged with the failure; null for NO_FAULT_FOUND" }
      - { name: engineering_change_id, type: string, source: system, description: "FK -> EngineeringChange.id; the change auto-raised by the design-feedback cascade; null when none was raised" }
      - { name: design_feedback_note, type: string, source: system, description: "Feedback text filed at close; null before" }
      - { name: status, type: enum, source: system, default: RECEIVED, description: "RECEIVED | TEARDOWN | ANALYZED_DESIGN | ANALYZED_SUPPLIER | CLOSED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  # --- Line: posture-driven gate over every child operation -------------------
  - entity: Line
    initial_state: RUNNING          # operating_mode dimension; posture is derived (calculations.line_posture)
    terminal_states: []
    transitions:
      - from: RUNNING
        to: STOPPED
        trigger: "POST /lines/{id}/stop"
        actor: LineOperator
        preconditions: ["Line.operating_mode == RUNNING"]
        side_effects:
          - "stop_reason = request.reason"
          - "posture recomputed to STOPPED (calculations.line_posture); BuildSlot sequence and release are blocked with ERR_LINE_POSTURE_BLOCKED while STOPPED"
          - "increments Line.version by 1"
      - from: STOPPED
        to: RUNNING
        trigger: "POST /lines/{id}/start"
        actor: LineOperator
        preconditions: ["Line.operating_mode == STOPPED"]
        side_effects:
          - "stop_reason = null"
          - "CONDITIONAL CHANGEOVER: when to_family_code is supplied and differs from current_family_code, current_family_code = to_family_code, changeover_count += 1, and CHANGEOVER_MINUTES is added to the changeover_minutes of the ACTIVE ShiftPlan whose [shift_start, shift_end) contains the logical clock (no shift covers the clock -> ERR_NO_SHIFT_COVERAGE, the whole start is rejected)"
          - "when to_family_code is absent or equal to current_family_code, no changeover is recorded and changeover_count is unchanged"
          - "posture recomputed from free_slot_pct and per-station saturation"
          - "increments Line.version by 1"

  # --- ModelVariant ----------------------------------------------------------
  - entity: ModelVariant
    initial_state: DRAFT
    terminal_states: [OBSOLETE]
    transitions:
      - from: DRAFT
        to: RELEASED
        trigger: "POST /model-variants/{id}/release"
        actor: PlantAdmin
        preconditions: ["ModelVariant.status == DRAFT"]
        side_effects: ["increments ModelVariant.version by 1", "BuildSlots of this variant may now be sequenced"]
      - from: RELEASED
        to: OBSOLETE
        trigger: "POST /model-variants/{id}/obsolete"
        actor: PlantAdmin
        preconditions: ["ModelVariant.status == RELEASED"]
        side_effects:
          - "increments ModelVariant.version by 1"
          - "further BuildSlot sequencing, BomLine authoring and ProductionUnit certification for this variant are rejected with ERR_MODEL_NOT_RELEASED; units already released keep building"

  # --- Part: service-part supply obligation -----------------------------------
  - entity: Part
    initial_state: ACTIVE
    terminal_states: [OBSOLETE]
    transitions:
      - from: ACTIVE
        to: CHANGE_PENDING
        trigger: "system (an EngineeringChange naming the part as affected_part_id enters SUBMITTED)"
        actor: system
        preconditions: []
        side_effects: ["BuildSlot sequencing whose effective BOM contains the part is rejected with ERR_PART_CHANGE_PENDING"]
      - from: CHANGE_PENDING
        to: ACTIVE
        trigger: "system (the change naming the part is CANCELLED or REJECTED and no other EngineeringChange naming it is in status IN {SUBMITTED, UNDER_REVIEW, REVISION_REQUESTED, APPROVED})"
        actor: system
        preconditions: []
        side_effects: ["sequencing unblocked"]
      - from: CHANGE_PENDING
        to: SERVICE_ONLY
        trigger: "system (EngineeringChange cut-in supersedes the BomLine that carried this part)"
        actor: system
        preconditions: []
        side_effects:
          - "service_obligation_until = EngineeringChange.cut_in_at + SERVICE_OBLIGATION_YEARS"
          - "every DeliveryCall for this part with status == SCHEDULED and window_start >= cut_in_at is CANCELLED with cancel_reason PART_SERVICE_ONLY (cascade link 3 of transitive_cascade.engineering_change_cut_in)"
      - from: ACTIVE
        to: SERVICE_ONLY
        trigger: "system (EngineeringChange cut-in supersedes the BomLine that carried this part while the part was never marked CHANGE_PENDING, e.g. the change was authored against another position)"
        actor: system
        preconditions: []
        side_effects: ["same as CHANGE_PENDING -> SERVICE_ONLY"]
      - from: SERVICE_ONLY
        to: OBSOLETE
        trigger: "POST /parts/{id}/obsolete"
        actor: PlantAdmin
        preconditions:
          - "Part.lifecycle_status == SERVICE_ONLY (ACTIVE or CHANGE_PENDING -> ERR_INVALID_STATE)"
          - "logical clock > Part.service_obligation_until, strictly (equality is still inside the obligation -> ERR_SERVICE_OBLIGATION_ACTIVE)"
        side_effects: ["legacy service production ends; the part can no longer appear on a new BomLine"]

  # --- DeliveryCall: supplier synchronous delivery ----------------------------
  - entity: DeliveryCall
    initial_state: SCHEDULED
    terminal_states: [ARRIVED_ON_TIME, ARRIVED_LATE, MISSED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: ARRIVED_ON_TIME
        trigger: "POST /delivery-calls/{id}/record-arrival"
        actor: SupplierPortal
        preconditions:
          - "DeliveryCall.status == SCHEDULED"
          - "X-User-ID == DeliveryCall.supplier_id (else ERR_SUPPLIER_SCOPE_VIOLATION)"
          - "request.arrived_at < window_end (half-open on-time band; early arrival counts as on time)"
        side_effects:
          - "arrived_at recorded, lateness_minutes = 0"
          - "Supplier.delivered_on_time_count += 1 and on_time_score recomputed (+2, capped at 100.00); Supplier.status re-derived"
      - from: SCHEDULED
        to: ARRIVED_LATE
        trigger: "POST /delivery-calls/{id}/record-arrival"
        actor: SupplierPortal
        preconditions:
          - "DeliveryCall.status == SCHEDULED"
          - "X-User-ID == DeliveryCall.supplier_id"
          - "request.arrived_at >= window_end (equality is late — the window is [start, end))"
        side_effects:
          - "arrived_at recorded, lateness_minutes = ceil((arrived_at - window_end) / 60s)"
          - "Supplier.delivered_late_count += 1 and on_time_score recomputed (-8, floored at 0.00); Supplier.status re-derived; a drop below 60.00 cancels this supplier's remaining SCHEDULED calls exactly as in the checkpoint sweep"
      - from: SCHEDULED
        to: MISSED
        trigger: "system (POST /lines/{id}/run-checkpoint, step 2: logical clock >= window_end + MISS_GRACE_MINUTES)"
        actor: system
        preconditions: ["station_id belongs to the checkpointed line"]
        side_effects:
          - "Supplier.missed_count += 1; on_time_score -= 20 (floored at 0.00) — cascade link 1 of transitive_cascade.checkpoint_miss_probation"
          - "Supplier.status re-derived from the new score; APPROVED -> PROBATION when score < 60.00 — cascade link 2"
          - "on entering PROBATION or SUSPENDED, every remaining DeliveryCall of that supplier with status == SCHEDULED (not already swept in this checkpoint) becomes CANCELLED with cancel_reason SUPPLIER_PROBATION — cascade link 3"
          - "each such cancellation de-sequences its dependent BuildSlot (see DeliveryCall CANCELLED side effects) — cascade link 4"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /delivery-calls/{id}/cancel"
        actor: ProductionPlanner
        preconditions: ["DeliveryCall.status == SCHEDULED"]
        side_effects:
          - "cancel_reason = PLANNER"
          - "every BuildSlot with sync_delivery_call_id == this call and status == SEQUENCED is de-sequenced to PLANNED, replaying the de-sequence side effects (presentation slots released, shift labour recomputed, Line posture recomputed)"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "system (supplier entered PROBATION/SUSPENDED, or the part became SERVICE_ONLY through a cut-in)"
        actor: system
        preconditions: []
        side_effects:
          - "cancel_reason = SUPPLIER_PROBATION or PART_SERVICE_ONLY"
          - "dependent SEQUENCED BuildSlots are de-sequenced to PLANNED with the full de-sequence side-effect set"

  # --- ShiftPlan -------------------------------------------------------------
  - entity: ShiftPlan
    initial_state: ACTIVE
    terminal_states: [SUPERSEDED]
    transitions:
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "POST /shift-plans (a new plan for the same line_id + shift_date + shift_code)"
        actor: ProductionPlanner
        preconditions: ["expected_line_version == Line.version (else ERR_STALE_LINE_VERSION)"]
        side_effects:
          - "every BuildSlot whose shift_plan_id was the superseded plan is repointed to the new plan"
          - "the new plan's unit_labor_minutes, changeover_minutes and committed_labor_minutes are computed from the repointed slots; the superseded plan keeps its last computed values frozen"
          - "increments Line.version by 1"

  # --- BuildSlot: mixed-model sequencing -------------------------------------
  - entity: BuildSlot
    initial_state: PLANNED
    terminal_states: [BUILT, CANCELLED]
    transitions:
      - from: PLANNED
        to: SEQUENCED
        trigger: "POST /build-slots/{id}/sequence"
        actor: ProductionPlanner
        preconditions:
          - "BuildSlot.status == PLANNED"
          - "the remaining checks are evaluated in the §1.4 priority order printed below, not in transition-authoring order"
          - "ModelVariant.status == RELEASED (ERR_MODEL_NOT_RELEASED, priority 14)"
          - "the effective BOM (calculations.effective_bom_at_sequence) is non-empty for at least one bom_position_code (ERR_BOM_NOT_EFFECTIVE, priority 15)"
          - "no part on the effective BOM has lifecycle_status IN {CHANGE_PENDING, OBSOLETE} (ERR_PART_CHANGE_PENDING, priority 16)"
          - "exactly one ACTIVE ShiftPlan of the line covers planned_start (ERR_NO_SHIFT_COVERAGE, priority 24)"
          - "sequence_index is free on the line (ERR_SEQUENCE_INDEX_TAKEN, priority 25 — enforced at POST /build-slots, restated here for slots revived by de-sequence)"
          - "Line.posture != STOPPED (ERR_LINE_POSTURE_BLOCKED, priority 26)"
          - "every Supplier feeding a sequenced module on the effective BOM has status APPROVED (ERR_SUPPLIER_NOT_APPROVED, priority 27)"
          - "every effective BOM part with is_sequenced_module == true has a covering DeliveryCall (ERR_SYNC_DELIVERY_MISSING, priority 28)"
          - "every rolling window of LOAD_WINDOW_SLOTS indexes containing sequence_index satisfies calculations.option_load_window_cap (ERR_OPTION_LOAD_WINDOW_EXCEEDED, priority 29)"
          - "presentation slots suffice at every station named by the effective BOM (ERR_PRESENTATION_SLOTS_EXHAUSTED, priority 30)"
          - "the covering ShiftPlan's recomputed committed_labor_minutes <= available_labor_minutes (ERR_LABOR_CAPACITY_EXCEEDED, priority 31)"
        side_effects:
          - "shift_plan_id, sync_delivery_call_id, option_points_snapshot, labor_minutes_snapshot, presentation_allocations and allocated_slot_units are pinned"
          - "each Station.presentation_slots_used += the station's slot_units (allocation order position_index ASC)"
          - "Line.presentation_slots_committed, free_slot_pct and posture recomputed"
          - "ShiftPlan.unit_labor_minutes, changeover_minutes and committed_labor_minutes recomputed"
      - from: SEQUENCED
        to: PLANNED
        trigger: "POST /build-slots/{id}/de-sequence"
        actor: ProductionPlanner
        preconditions: ["BuildSlot.status == SEQUENCED"]
        side_effects:
          - "COMPENSATION: each Station.presentation_slots_used -= the slot_units recorded in presentation_allocations (compensating_invariant.presentation_slot_conservation)"
          - "shift_plan_id, sync_delivery_call_id, option_points_snapshot, labor_minutes_snapshot, presentation_allocations reset to null/[], allocated_slot_units = 0"
          - "the former ShiftPlan's unit_labor_minutes, changeover_minutes and committed_labor_minutes recomputed from its remaining slots"
          - "Line.presentation_slots_committed, free_slot_pct and posture recomputed"
      - from: SEQUENCED
        to: PLANNED
        trigger: "system (the pinned sync_delivery_call_id was CANCELLED for any reason)"
        actor: system
        preconditions: []
        side_effects: ["identical to the operator de-sequence side-effect set"]
      - from: PLANNED
        to: CANCELLED
        trigger: "system (POST /lines/{id}/run-checkpoint, step 3: planned_start < logical clock and status == PLANNED)"
        actor: system
        preconditions: []
        side_effects: ["the sequence_index is freed for reuse by a new slot"]
      - from: SEQUENCED
        to: RELEASED
        trigger: "POST /build-slots/{id}/release"
        actor: LineOperator
        preconditions:
          - "BuildSlot.status == SEQUENCED"
          - "Line.posture == OPEN (CONSTRAINED or STOPPED -> ERR_LINE_POSTURE_BLOCKED)"
          - "ModelVariant.family_code == Line.current_family_code (ERR_CHANGEOVER_REQUIRED)"
          - "ModelVariant.status == RELEASED (ERR_MODEL_NOT_RELEASED)"
        side_effects:
          - "a ProductionUnit is created with assembly_status IN_STATION, quality_status PENDING, built_at_sequence_index = sequence_index and the deterministic serial_number"
          - "Line.max_released_sequence_index recomputed"
          - "the pinned presentation slots stay committed (the unit is consuming them)"
      - from: RELEASED
        to: BUILT
        trigger: "system (the slot's ProductionUnit reaches assembly_status ASSEMBLED)"
        actor: system
        preconditions: []
        side_effects: ["BUBBLE-UP: slot closes; presentation slots stay committed until the unit ships"]

  # --- ProductionUnit: two independent status dimensions ---------------------
  - entity: ProductionUnit
    initial_state: "IN_STATION x PENDING"
    terminal_states: ["SHIPPED x CERTIFIED"]
    transitions:
      # assembly dimension
      - from: IN_STATION
        to: ASSEMBLED
        trigger: "POST /production-units/{id}/complete-assembly"
        actor: LineOperator
        preconditions:
          - "assembly_status == IN_STATION"
          - "quality_status != QUARANTINED (ERR_UNIT_QUARANTINED)"
        side_effects: ["BuildSlot RELEASED -> BUILT (bubble-up)", "quality_status is untouched — the two dimensions advance independently"]
      - from: IN_STATION
        to: REWORK
        trigger: "system (a QualityTest with result FAIL is recorded)"
        actor: system
        preconditions: []
        side_effects: ["rework_count += 1", "quality_status -> QUARANTINED in the same mutation"]
      - from: ASSEMBLED
        to: REWORK
        trigger: "system (a QualityTest with result FAIL is recorded)"
        actor: system
        preconditions: []
        side_effects: ["rework_count += 1", "quality_status -> QUARANTINED", "the BuildSlot stays BUILT"]
      - from: REWORK
        to: IN_STATION
        trigger: "POST /production-units/{id}/clear-quarantine"
        actor: QualityInspector
        preconditions: ["assembly_status == REWORK", "quality_status == QUARANTINED"]
        side_effects:
          - "every QualityTest of this unit with result FAIL and status RECORDED becomes VOIDED (voided tests leave the input set of calculations.efficiency_index and the gate evaluation)"
          - "quality_status -> PENDING"
      - from: ASSEMBLED
        to: SHIPPED
        trigger: "POST /production-units/{id}/ship"
        actor: LineOperator
        preconditions:
          - "assembly_status == ASSEMBLED"
          - "quality_status == CERTIFIED (cross-dimension guard; anything else -> ERR_INVALID_STATE)"
        side_effects:
          - "the slot's presentation allocations are released: each Station.presentation_slots_used -= slot_units, Line.presentation_slots_committed / free_slot_pct / posture recomputed"
          - "the unit becomes eligible for a WarrantyReturn"
      # quality dimension
      - from: PENDING
        to: SAFETY_PASSED
        trigger: "system (an ELECTRICAL_SAFETY QualityTest with result PASS is recorded)"
        actor: system
        preconditions: []
        side_effects: ["LEAK and FUNCTIONAL_CYCLE tests may now be recorded (earlier attempts are rejected with ERR_QUALITY_GATE_ORDER)"]
      - from: SAFETY_PASSED
        to: GATED
        trigger: "system (a FUNCTIONAL_CYCLE PASS exists and, when ModelVariant.requires_leak_test is true, a LEAK PASS exists — both with status RECORDED)"
        actor: system
        preconditions: []
        side_effects: ["ENERGY and WATER tests may now be recorded and the unit may be certified"]
      - from: GATED
        to: CERTIFIED
        trigger: "POST /production-units/{id}/certify"
        actor: QualityInspector
        preconditions:
          - "quality_status == GATED"
          - "ModelVariant.status == RELEASED (ERR_MODEL_NOT_RELEASED)"
          - "at least one RECORDED ENERGY test and one RECORDED WATER test exist (ERR_INVALID_STATE otherwise)"
          - "efficiency_index <= 1.00 after the CERTIFICATION_AVERAGE computation (ERR_EFFICIENCY_LIMIT_EXCEEDED, no mutation on failure)"
        side_effects: ["efficiency_index and certification_tier written from calculations.efficiency_index variant CERTIFICATION_AVERAGE"]
      - from: PENDING
        to: QUARANTINED
        trigger: "system (a QualityTest with result FAIL is recorded)"
        actor: system
        preconditions: []
        side_effects: ["assembly_status -> REWORK, rework_count += 1"]
      - from: SAFETY_PASSED
        to: QUARANTINED
        trigger: "system (a QualityTest with result FAIL is recorded)"
        actor: system
        preconditions: []
        side_effects: ["assembly_status -> REWORK, rework_count += 1"]
      - from: GATED
        to: QUARANTINED
        trigger: "system (a QualityTest with result FAIL is recorded)"
        actor: system
        preconditions: []
        side_effects: ["assembly_status -> REWORK, rework_count += 1"]
      - from: QUARANTINED
        to: PENDING
        trigger: "POST /production-units/{id}/clear-quarantine"
        actor: QualityInspector
        preconditions: ["quality_status == QUARANTINED", "assembly_status == REWORK"]
        side_effects: ["failing tests VOIDED; the gate chain must be re-walked from PENDING (CYCLE)"]

  # --- EngineeringChange: cyclic review with a revision cap ------------------
  - entity: EngineeringChange
    initial_state: DRAFT
    terminal_states: [REJECTED, CLOSED, CANCELLED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /engineering-changes/{id}/submit"
        actor: EngineeringLead
        preconditions: ["status == DRAFT"]
        side_effects:
          - "submitted_by_user_id = X-User-ID"
          - "affected_part_id Part.lifecycle_status ACTIVE -> CHANGE_PENDING (cascade link 3 of transitive_cascade.warranty_design_feedback when the row is WARRANTY-origin)"
      - from: REVISION_REQUESTED
        to: SUBMITTED
        trigger: "POST /engineering-changes/{id}/submit"
        actor: EngineeringLead
        preconditions: ["status == REVISION_REQUESTED"]
        side_effects: ["submitted_by_user_id = X-User-ID (a new submitter resets who may decide)", "CYCLE back into review"]
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /engineering-changes/{id}/start-review"
        actor: EngineeringLead
        preconditions: ["status == SUBMITTED"]
        side_effects: []
      - from: UNDER_REVIEW
        to: REVISION_REQUESTED
        trigger: "POST /engineering-changes/{id}/decide with decision REQUEST_REVISION"
        actor: EngineeringLead
        preconditions:
          - "status == UNDER_REVIEW"
          - "X-User-ID != submitted_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
          - "revision_round + 1 <= EC_MAX_REVISION_ROUNDS"
        side_effects: ["revision_round += 1", "decided_by_user_id = X-User-ID"]
      - from: UNDER_REVIEW
        to: CANCELLED
        trigger: "POST /engineering-changes/{id}/decide with decision REQUEST_REVISION when revision_round + 1 > EC_MAX_REVISION_ROUNDS"
        actor: EngineeringLead
        preconditions: ["status == UNDER_REVIEW", "X-User-ID != submitted_by_user_id"]
        side_effects:
          - "revision_round += 1 (recorded as EC_MAX_REVISION_ROUNDS + 1)"
          - "the loop is abandoned instead of returning to REVISION_REQUESTED"
          - "affected part returns CHANGE_PENDING -> ACTIVE when no other live change names it"
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /engineering-changes/{id}/decide with decision APPROVE"
        actor: EngineeringLead
        preconditions:
          - "status == UNDER_REVIEW"
          - "X-User-ID != submitted_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects: ["decided_by_user_id = X-User-ID"]
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /engineering-changes/{id}/decide with decision REJECT"
        actor: EngineeringLead
        preconditions: ["status == UNDER_REVIEW", "X-User-ID != submitted_by_user_id"]
        side_effects: ["decided_by_user_id = X-User-ID", "affected part returns CHANGE_PENDING -> ACTIVE when no other live change names it"]
      - from: APPROVED
        to: CUT_IN
        trigger: "POST /engineering-changes/{id}/cut-in"
        actor: EngineeringLead
        preconditions:
          - "status == APPROVED"
          - "the remaining checks are evaluated in the §1.4 priority order printed below, not in transition-authoring order"
          - "ModelVariant.status == RELEASED (ERR_MODEL_NOT_RELEASED, priority 14)"
          - "an ACTIVE BomLine exists for (model_variant_id, bom_position_code) carrying affected_part_id (ERR_BOM_NOT_EFFECTIVE, priority 15)"
          - "target Line.posture == STOPPED (ERR_LINE_NOT_STOPPED, priority 17)"
          - "cut_in_sequence_index > target Line.max_released_sequence_index (ERR_CUT_IN_INDEX_TOO_LOW, priority 18)"
          - "replacement_part_id (body override, else the stored value) is not null and != affected_part_id (ERR_REPLACEMENT_PART_REQUIRED, priority 19)"
        side_effects:
          - "cut_in_at = logical clock"
          - "cascade link 1: a new BomLine is minted (part_id = replacement_part_id, station_id and qty inherited from the superseded line unless new_qty_per_unit is supplied, effective_from_sequence = cut_in_sequence_index, created_by_change_id = this change, status ACTIVE) and the old line becomes SUPERSEDED with superseded_by_bom_line_id set"
          - "cascade link 2: the outgoing Part becomes SERVICE_ONLY with service_obligation_until = cut_in_at + SERVICE_OBLIGATION_YEARS"
          - "cascade link 3: every SCHEDULED DeliveryCall for the outgoing part with window_start >= cut_in_at is CANCELLED with cancel_reason PART_SERVICE_ONLY"
          - "cascade link 4: every BuildSlot pinned to one of those cancelled calls and still SEQUENCED is de-sequenced to PLANNED, releasing presentation slots, recomputing its ShiftPlan labour figures and the Line posture"
      - from: CUT_IN
        to: CLOSED
        trigger: "system (POST /lines/{id}/run-checkpoint, step 4: no ProductionUnit with built_at_sequence_index < cut_in_sequence_index remains in assembly_status IN {IN_STATION, REWORK})"
        actor: system
        preconditions: ["target_line_id == the checkpointed line"]
        side_effects: ["the change is archived; the minted BomLine stays ACTIVE"]
      - from: DRAFT
        to: CANCELLED
        trigger: "system (POST /warranty-returns/{id}/withdraw on the source return of a WARRANTY-origin change)"
        actor: system
        preconditions: []
        side_effects: ["affected part returns to ACTIVE when no other live change names it"]
      - from: SUBMITTED
        to: CANCELLED
        trigger: "system (POST /warranty-returns/{id}/withdraw on the source return of a WARRANTY-origin change)"
        actor: system
        preconditions: []
        side_effects: ["COMPENSATION: affected part CHANGE_PENDING -> ACTIVE when no other live change names it"]
      - from: UNDER_REVIEW
        to: CANCELLED
        trigger: "system (POST /warranty-returns/{id}/withdraw on the source return of a WARRANTY-origin change)"
        actor: system
        preconditions: []
        side_effects: ["COMPENSATION: affected part CHANGE_PENDING -> ACTIVE when no other live change names it"]

  # --- WarrantyReturn: branching teardown with divergent side effects --------
  - entity: WarrantyReturn
    initial_state: RECEIVED
    terminal_states: [CLOSED]
    transitions:
      - from: RECEIVED
        to: TEARDOWN
        trigger: "POST /warranty-returns/{id}/teardown"
        actor: WarrantyAnalyst
        preconditions: ["status == RECEIVED"]
        side_effects: ["teardown_started_at = logical clock"]
      - from: TEARDOWN
        to: ANALYZED_DESIGN
        trigger: "POST /warranty-returns/{id}/analyze with disposition DESIGN_DEFECT"
        actor: WarrantyAnalyst
        preconditions:
          - "status == TEARDOWN"
          - "root_cause_part_id is supplied and is on the historical BOM of the unit (calculations.historical_bom_at_sequence), else ERR_BOM_NOT_EFFECTIVE"
        side_effects:
          - "BRANCH A, cascade link 1: root cause Part.field_failure_count += 1 and Part.cohort_failure_rate_per_1000 recomputed (PRODUCTION_COHORT variant)"
          - "BRANCH A, cascade link 2: when cohort_failure_rate_per_1000 >= WARRANTY_RATE_TRIGGER a WARRANTY-origin EngineeringChange is minted in SUBMITTED (model_variant_id and bom_position_code from the unit's historical BOM, affected_part_id = root cause, replacement_part_id = null, target_line_id = the unit's line, cut_in_sequence_index = Line.max_released_sequence_index + 1, submitted_by_user_id = 'system'), and engineering_change_id is stored on the return"
          - "BRANCH A, cascade link 3: that SUBMITTED change moves the root cause Part ACTIVE -> CHANGE_PENDING, which blocks further sequencing of every variant whose effective BOM contains it"
      - from: TEARDOWN
        to: ANALYZED_SUPPLIER
        trigger: "POST /warranty-returns/{id}/analyze with disposition SUPPLIER_DEFECT"
        actor: WarrantyAnalyst
        preconditions: ["status == TEARDOWN", "root_cause_part_id is supplied and is on the unit's historical BOM"]
        side_effects:
          - "BRANCH B: root cause Part.field_failure_count += 1 and cohort_failure_rate_per_1000 recomputed"
          - "BRANCH B: the part's Supplier.quality_penalty_count += 1 and on_time_score -= 10 (floored at 0.00); Supplier.status re-derived, with the same PROBATION cancellation cascade as a missed call"
          - "BRANCH B: NO EngineeringChange is minted and engineering_change_id stays null — the divergence from BRANCH A"
      - from: TEARDOWN
        to: CLOSED
        trigger: "POST /warranty-returns/{id}/analyze with disposition NO_FAULT_FOUND"
        actor: WarrantyAnalyst
        preconditions: ["status == TEARDOWN", "root_cause_part_id is absent"]
        side_effects: ["BRANCH C: no counter moves, no change is minted, the return closes immediately (JOIN short-circuit)"]
      - from: ANALYZED_DESIGN
        to: CLOSED
        trigger: "POST /warranty-returns/{id}/close"
        actor: WarrantyAnalyst
        preconditions: ["status IN {ANALYZED_DESIGN, ANALYZED_SUPPLIER}"]
        side_effects: ["design_feedback_note stored (JOIN); counters stay as analysed"]
      - from: ANALYZED_SUPPLIER
        to: CLOSED
        trigger: "POST /warranty-returns/{id}/close"
        actor: WarrantyAnalyst
        preconditions: ["status IN {ANALYZED_DESIGN, ANALYZED_SUPPLIER}"]
        side_effects: ["design_feedback_note stored (JOIN)"]
      - from: ANALYZED_DESIGN
        to: CLOSED
        trigger: "POST /warranty-returns/{id}/withdraw"
        actor: WarrantyAnalyst
        preconditions: ["status IN {ANALYZED_DESIGN, ANALYZED_SUPPLIER}"]
        side_effects:
          - "COMPENSATION 1: disposition rewritten to NO_FAULT_FOUND, root_cause_part_id kept for audit"
          - "COMPENSATION 2: the charged Part.field_failure_count -= 1 and cohort_failure_rate_per_1000 recomputed (compensating_invariant.defect_attribution_conservation)"
          - "COMPENSATION 3: when engineering_change_id points at a WARRANTY-origin change in status IN {DRAFT, SUBMITTED, UNDER_REVIEW} that change becomes CANCELLED and the part returns CHANGE_PENDING -> ACTIVE"
      - from: ANALYZED_SUPPLIER
        to: CLOSED
        trigger: "POST /warranty-returns/{id}/withdraw"
        actor: WarrantyAnalyst
        preconditions: ["status IN {ANALYZED_DESIGN, ANALYZED_SUPPLIER}"]
        side_effects:
          - "COMPENSATION 1: disposition rewritten to NO_FAULT_FOUND"
          - "COMPENSATION 2: Part.field_failure_count -= 1 and cohort rate recomputed"
          - "COMPENSATION 3: Supplier.quality_penalty_count -= 1 and on_time_score += 10 (capped at 100.00); Supplier.status re-derived"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only — serial-observability filter applied)
# =============================================================================
concurrency_rules:
  - rule_id: bom-line-create-stale-model-variant
    parent_entity: ModelVariant
    write_endpoint: "POST /bom-lines"
    occ_field: "expected_model_variant_version"
    description: |
      Authoring a BomLine against a ModelVariant whose version has advanced
      since the client last read it is rejected. A new line for the same
      bom_position_code legitimately supersedes any ACTIVE line whose
      effective_from_sequence is greater than or equal to the new one, so a
      writer holding a stale view of the variant's BOM would silently retire a
      line it never saw; the version check turns that into a 412 instead.
    error_id: ERR_STALE_MODEL_VARIANT_VERSION
    http_status: 412

  - rule_id: shift-plan-create-stale-line
    parent_entity: Line
    write_endpoint: "POST /shift-plans"
    occ_field: "expected_line_version"
    description: |
      Creating a ShiftPlan for a line whose version has advanced since the
      client last read it is rejected. A plan for an already-planned
      (shift_date, shift_code) legitimately supersedes the prior plan and
      repoints its BuildSlots, so a stale writer would re-staff a shift whose
      current plan it never observed; the version check rejects it with 412.
    error_id: ERR_STALE_LINE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules
# =============================================================================
calculations:

  # --- 1. Option-load window cap (combinatorial, mode a) ---------------------
  - name: option_load_window_cap
    algorithm_type: threshold
    description: |
      Mixed-model sequencing may not bunch option-heavy units. For a candidate
      BuildSlot at sequence_index S on line L, EVERY rolling window of
      LOAD_WINDOW_SLOTS consecutive indexes that contains S must satisfy the cap
      — the windows are [S-4..S], [S-3..S+1], ... [S..S+4].

      For each such window W:
        window_points(W) = sum of option_points_snapshot over the line's
                           BuildSlots with sequence_index in W and status IN
                           {SEQUENCED, RELEASED, BUILT}, plus the candidate's
                           ModelVariant.option_content_points.
        cap = floor(LOAD_WINDOW_SLOTS
                    * (Line.option_load_limit_pct / 100)
                    * MAX_POINTS_PER_SLOT
                    * staffing_factor)
        staffing_factor = min(1, ShiftPlan.planned_headcount / Line.baseline_headcount)
                          for the ACTIVE ShiftPlan covering the candidate's
                          planned_start, rounded to 4 dp before multiplying.
      The slot is admissible only when window_points(W) <= cap for all W.
    inputs:
      - "Line.option_load_limit_pct"
      - "Line.baseline_headcount"
      - "ShiftPlan.planned_headcount (the ACTIVE plan covering planned_start)"
      - "ModelVariant.option_content_points of the candidate and of every slot already in the windows"
      - "BuildSlot.sequence_index, BuildSlot.status, BuildSlot.option_points_snapshot"
    constants:
      LOAD_WINDOW_SLOTS: 5
      MAX_POINTS_PER_SLOT: 10
    precision: "cap is an integer (floor applied last, after all three factors are multiplied); staffing_factor rounded to 4 dp"
    formula: "cap = floor(5 * (option_load_limit_pct/100) * 10 * min(1, planned_headcount/baseline_headcount))"
    combinatorial_note: |
      MODE (a) of combinatorial_formula: exactly ONE floor is applied, and it is
      applied to the product of all four factors. Worked example —
      option_load_limit_pct 63.00, baseline_headcount 20, planned_headcount 18:
        staffing_factor = min(1, 18/20) = 0.9000
        cap = floor(5 * 0.63 * 10 * 0.9000) = floor(28.35) = 28
      A window totalling exactly 28 option points is admitted (28 <= 28) and a
      window totalling 29 is rejected, which pins the cap to 28 exactly.
      Forbidden orders that must NOT be implemented:
        floor the percent factor first: floor(5 * 0.63 * 10) = 31, then
          31 * 0.9000 = 27.9 -> floor 27 -> would REJECT the 28-point window;
        drop the floor entirely: 28.35 -> would ADMIT a 28.35-point budget,
          indistinguishable at 28 but divergent at pct 63.00 / headcount 20
          (31.5 vs 31);
        apply the staffing factor per slot instead of per window: 5 slots each
          capped at floor(10 * 0.63 * 0.9) = 5 -> a single 8-point model could
          never be sequenced at all.
      With the default full-staffing plan (planned_headcount == baseline_headcount
      == 20) the same formula yields floor(5 * 0.63 * 10 * 1.0000) = 31.

  # --- 2. Efficiency index (dual variant + combinatorial mode b) ------------
  - name: efficiency_index
    algorithm_type: weighted_scoring
    description: |
      Energy/water efficiency certification. Each ENERGY or WATER QualityTest
      with status RECORDED contributes ratio = measured_value / limit_value.
      PINNED EVALUATION ORDER (mode b of combinatorial_formula):
        step 1 — round EACH test's ratio to 2 dp (half-up);
        step 2 — average the rounded ratios PER TEST TYPE to 4 dp (half-up);
        step 3 — weighted sum: ENERGY_WEIGHT * energy_mean + WATER_WEIGHT * water_mean;
        step 4 — round the weighted sum to 2 dp (half-up) => efficiency_index.
      certification_tier is then derived from the 2-dp index:
        index <= TIER_A_PLUS_MAX -> A_PLUS
        index <= TIER_A_MAX      -> A
        index <= TIER_B_MAX      -> B
        index >  TIER_B_MAX      -> not certifiable (ERR_EFFICIENCY_LIMIT_EXCEEDED)
      Tests with status VOIDED are excluded from every step.
    inputs:
      - "QualityTest.measured_value, QualityTest.limit_value, QualityTest.test_type, QualityTest.status, QualityTest.created_at"
      - "ModelVariant.energy_kwh_limit, ModelVariant.water_liters_limit (the limit_value written onto each test)"
    constants:
      ENERGY_WEIGHT: 0.6
      WATER_WEIGHT: 0.4
      TIER_A_PLUS_MAX: 0.80
      TIER_A_MAX: 0.95
      TIER_B_MAX: 1.00
    precision: "per-test ratio 2 dp half-up; per-type mean 4 dp half-up; final index 2 dp half-up"
    variants:
      - name: AS_TESTED
        description: |
          Provisional index used by GET /production-units/{id} while
          quality_status != CERTIFIED, exposed as provisional_efficiency_index.
          Input set: for each of ENERGY and WATER, ONLY the most recent RECORDED
          test (created_at DESC, id DESC as tie-break). Step 2 is therefore the
          identity on a single rounded ratio.
      - name: CERTIFICATION_AVERAGE
        description: |
          Binding index written by POST /production-units/{id}/certify into
          efficiency_index and certification_tier. Input set: ALL RECORDED tests
          of each type, averaged in step 2.
    variant_divergence_example: |
      ENERGY limit 400.00 with measured 420.00 (ratio 1.05) and 380.00 (0.95);
      WATER limit 200.00 with measured 184.00 (0.92):
        AS_TESTED               -> energy_mean = 0.9500 (latest test only, 380.00),
                                   water_mean = 0.9200,
                                   0.6*0.9500 + 0.4*0.9200 = 0.5700 + 0.3680 = 0.9380 -> 0.94 -> tier A
        CERTIFICATION_AVERAGE   -> energy_mean = (1.05 + 0.95)/2 = 1.0000,
                                   water_mean = 0.9200,
                                   0.6*1.0000 + 0.4*0.9200 = 0.6000 + 0.3680 = 0.9680 -> 0.97 -> tier B
    rounding_order_example: |
      Mode (b) divergence with a single test per type — ENERGY limit 400.00
      measured 413.96, WATER limit 200.00 measured 168.98:
        PINNED: 413.96/400.00 = 1.03490 -> 1.03; 168.98/200.00 = 0.84490 -> 0.84;
                0.6*1.03 + 0.4*0.84 = 0.618 + 0.336 = 0.954 -> 0.95 -> tier A
        FORBIDDEN (weight the unrounded ratios, round once at the end):
                0.6*1.0349 + 0.4*0.8449 = 0.62094 + 0.33796 = 0.9589 -> 0.96 -> tier B
      The two orders disagree on the certification tier, so the tier is the
      observable that pins the order.

  # --- 3. Shift committed labour (combinatorial, mode c) -------------------
  - name: shift_committed_labor_minutes
    algorithm_type: tiered_pricing
    description: |
      Labour committed on a ShiftPlan. Let
        unit_labor_minutes   = sum of labor_minutes_snapshot over the plan's
                               BuildSlots in status IN {SEQUENCED, RELEASED, BUILT}
        changeover_minutes   = CHANGEOVER_MINUTES * (number of distinct
                               family_code boundaries among those slots ordered by
                               sequence_index ASC, i.e. transitions where the
                               family differs from the previous slot's family and
                               the first slot's family differs from
                               Line.current_family_code) plus any changeover
                               minutes booked by POST /lines/{id}/start
        gross_minutes        = unit_labor_minutes + changeover_minutes
        fatigue_tier(gross)  = 1.00 when gross <= FATIGUE_T1_MAX
                               1.05 when gross <= FATIGUE_T2_MAX
                               1.12 otherwise
        committed_labor_minutes = ceil(gross_minutes * fatigue_tier(gross_minutes))
      available_labor_minutes = planned_headcount is NOT a factor here; it is
        SHIFT_MINUTES + overtime_minutes (single-crew line), recomputed whenever
        overtime_minutes changes.
      ERR_LABOR_CAPACITY_EXCEEDED fires when committed_labor_minutes >
        available_labor_minutes.
    inputs:
      - "BuildSlot.labor_minutes_snapshot, BuildSlot.sequence_index, BuildSlot.status"
      - "ModelVariant.family_code, ModelVariant.labor_minutes"
      - "Line.current_family_code"
      - "ShiftPlan.overtime_minutes, ShiftPlan.changeover_minutes"
    constants:
      SHIFT_MINUTES: 480
      OVERTIME_CAP_MINUTES: 120
      CHANGEOVER_MINUTES: 18
      FATIGUE_T1_MAX: 300
      FATIGUE_T2_MAX: 450
      FATIGUE_T1: 1.00
      FATIGUE_T2: 1.05
      FATIGUE_T3: 1.12
    precision: "committed_labor_minutes is an integer (ceil applied once, last); the tier itself is exact"
    formula: "committed = ceil((unit_labor_minutes + changeover_minutes) * fatigue_tier(unit_labor_minutes + changeover_minutes))"
    combinatorial_note: |
      MODE (c) of combinatorial_formula: the fatigue tier is selected from the
      GROSS total (units + changeover), not from the unit minutes alone, and the
      multiplier is applied to that same gross total. Worked example — WM-X
      150 min (FAM_A) at index 1 and WM-Y 145 min (FAM_B) at index 2 on a line
      tooled FAM_A, one family boundary:
        unit_labor_minutes = 295, changeover_minutes = 18, gross = 313
        tier(313) = 1.05 because 313 > FATIGUE_T1_MAX (300)
        committed = ceil(313 * 1.05) = ceil(328.65) = 329
      Forbidden orders, all observably different on the same inputs:
        tier chosen on unit minutes only -> tier(295) = 1.00 ->
          ceil(295 * 1.00) + 18 = 313;
        tier applied to unit minutes and changeover added afterwards ->
          ceil(295 * 1.05) + 18 = 310 + 18 = 328;
        rounding instead of ceiling -> round(328.65) = 329 here but 344 instead
          of 345 at gross 328, so the ceiling is pinned separately by the
          option-load instances.
      The tier boundary at exactly FATIGUE_T1_MAX is what makes the changeover
      minutes decisive: without them the plan would sit in tier 1.00.

  # --- 4. Presentation slot allocation (waterfall) -------------------------
  - name: presentation_slot_allocation
    algorithm_type: waterfall_allocation
    description: |
      Line-side part presentation for one BuildSlot. For every ACTIVE BomLine on
      the effective BOM (calculations.effective_bom_at_sequence) of the slot's
      ModelVariant at the slot's sequence_index:
        slot_units(bom_line) =
          0  when Part.is_sequenced_module == true AND a covering DeliveryCall
             exists (status SCHEDULED or ARRIVED_ON_TIME or ARRIVED_LATE, same
             part_id and station_id, window_start <= planned_start < window_end)
             — synchronous supply bypasses line-side storage entirely;
          ceil(qty_per_unit * PRESENTATION_WINDOW_UNITS / Part.line_side_max_units)
             otherwise.
      Allocation walks the BomLines in Station.position_index ASC, then
      bom_position_code ASC, charging slot_units to
      Station.presentation_slots_used. The first station whose
      presentation_slots_used + slot_units > presentation_slot_capacity aborts
      the whole sequence with ERR_PRESENTATION_SLOTS_EXHAUSTED and no station is
      charged. The per-station charges are recorded in
      BuildSlot.presentation_allocations and their sum in allocated_slot_units.
    inputs:
      - "BomLine.qty_per_unit, BomLine.station_id, BomLine.bom_position_code, BomLine.status, BomLine.effective_from_sequence"
      - "Part.is_sequenced_module, Part.line_side_max_units"
      - "Station.position_index, Station.presentation_slot_capacity, Station.presentation_slots_used"
      - "DeliveryCall.part_id, DeliveryCall.station_id, DeliveryCall.window_start, DeliveryCall.window_end, DeliveryCall.status"
    constants:
      PRESENTATION_WINDOW_UNITS: 20
    precision: "slot_units is an integer via ceil; the ceil is applied to the whole quotient, not to qty_per_unit"
    formula: "slot_units = ceil(qty_per_unit * 20 / line_side_max_units), or 0 for a synchronously covered sequenced module"
    worked_example: |
      qty_per_unit 2, line_side_max_units 24 -> ceil(2*20/24) = ceil(1.6667) = 2.
      qty_per_unit 1, line_side_max_units 1, is_sequenced_module true with a
      covering DeliveryCall -> 0; the same part with no covering call -> the
      sequence is rejected with ERR_SYNC_DELIVERY_MISSING before allocation runs.

  # --- 5. Supplier on-time score ------------------------------------------
  - name: supplier_on_time_score
    algorithm_type: aggregation
    description: |
      Running supplier performance score, replayed from the supplier's terminal
      DeliveryCalls and warranty attributions rather than stored incrementally:
        score = SCORE_START
                + ON_TIME_BONUS  * delivered_on_time_count
                - LATE_PENALTY   * delivered_late_count
                - MISS_PENALTY   * missed_count
                - QUALITY_PENALTY * quality_penalty_count
      clamped to [SCORE_FLOOR, SCORE_CAP]. status is then re-derived:
        score >= APPROVED_MIN   -> APPROVED
        score >= PROBATION_MIN  -> PROBATION
        otherwise               -> SUSPENDED
      The clamp is applied before the band lookup, so a supplier cannot bank
      credit above 100.00 to survive future misses.
    inputs:
      - "Supplier.delivered_on_time_count, delivered_late_count, missed_count, quality_penalty_count"
    constants:
      SCORE_START: 100.00
      ON_TIME_BONUS: 2
      LATE_PENALTY: 8
      MISS_PENALTY: 20
      QUALITY_PENALTY: 10
      SCORE_CAP: 100.00
      SCORE_FLOOR: 0.00
      APPROVED_MIN: 60.00
      PROBATION_MIN: 40.00
    precision: "score carried to 2 dp; all penalties are exact integers so no rounding occurs"
    boundary_example: |
      Two missed calls: 100.00 - 40 = 60.00 -> exactly APPROVED_MIN -> status
      stays APPROVED and no cancellation cascade fires. A third miss: 40.00 ->
      PROBATION -> every remaining SCHEDULED call is cancelled with
      cancel_reason SUPPLIER_PROBATION and the dependent SEQUENCED BuildSlots
      de-sequence.

  # --- 6. Line posture ----------------------------------------------------
  - name: line_posture
    algorithm_type: constraint_propagation
    description: |
      Derived gate recomputed after every mutation that touches the line's
      stations, slots, shift plans or operating_mode:
        operating_mode == STOPPED                        -> STOPPED
        free_slot_pct < POSTURE_CONSTRAINED_PCT          -> CONSTRAINED
        any Station with presentation_slots_used == presentation_slot_capacity
          and presentation_slot_capacity > 0             -> CONSTRAINED
        otherwise                                        -> OPEN
      where free_slot_pct = round(100 * (presentation_slots_total -
      presentation_slots_committed) / presentation_slots_total, 2) and 0.00 when
      presentation_slots_total == 0 (a line with no stations is CONSTRAINED, not
      OPEN — an empty denominator is treated as fully committed).
      CONSTRAINED still permits POST /build-slots/{id}/sequence but blocks
      POST /build-slots/{id}/release; STOPPED blocks both.
    inputs:
      - "Line.operating_mode"
      - "Station.presentation_slots_used, Station.presentation_slot_capacity"
    constants:
      POSTURE_CONSTRAINED_PCT: 20.00
    precision: "free_slot_pct 2 dp half-up; the comparison is strict (<)"

  # --- 7. Effective BOM at a sequence index (dual variant) ----------------
  - name: effective_bom_at_sequence
    algorithm_type: chronological
    description: |
      Resolves which BomLine governs each bom_position_code of a ModelVariant at
      a given sequence_index S. Candidates are the variant's BomLines with
      effective_from_sequence <= S; within each bom_position_code the winner is
      the candidate with the greatest effective_from_sequence, breaking ties by
      created_at DESC then id DESC. Positions whose only candidates are filtered
      out contribute nothing, and a resolution that yields zero positions is
      ERR_BOM_NOT_EFFECTIVE.
    inputs:
      - "BomLine.model_variant_id, bom_position_code, effective_from_sequence, status, created_at, id"
    constants: {}
    precision: "sequence indexes are integers; the comparison effective_from_sequence <= S is inclusive"
    variants:
      - name: PRODUCTION_EFFECTIVE
        description: "status == ACTIVE only. Used by BuildSlot sequencing, presentation allocation and EngineeringChange cut-in — a superseded line can never be built again."
      - name: HISTORICAL_AS_BUILT
        description: "status IN {ACTIVE, SUPERSEDED}. Used by WarrantyReturn analyze to validate root_cause_part_id against ProductionUnit.built_at_sequence_index, so a part cut out of production last month is still a legitimate root cause for a unit built before the cut-in."
    boundary_example: |
      A BomLine minted with effective_from_sequence 5 does not govern a slot at
      sequence_index 4 (4 < 5, the earlier line still wins) and does govern a
      slot at sequence_index 5 (5 <= 5).

  # --- 8. Warranty failure rate (dual variant) ----------------------------
  - name: warranty_failure_rate
    algorithm_type: projection
    description: |
      Field failure intensity for a Part, exposed by
      GET /parts/{id}/warranty-metrics and used by the >= WARRANTY_RATE_TRIGGER
      auto-change rule. Numerator in both variants: the number of
      WarrantyReturns in status IN {ANALYZED_DESIGN, ANALYZED_SUPPLIER, CLOSED}
      whose root_cause_part_id is the part and whose disposition is
      DESIGN_DEFECT or SUPPLIER_DEFECT (a return withdrawn back to
      NO_FAULT_FOUND leaves the numerator).
    inputs:
      - "WarrantyReturn.root_cause_part_id, disposition, status, field_hours"
      - "ProductionUnit.assembly_status, ProductionUnit.built_at_sequence_index"
      - "BomLine effective at each unit's built_at_sequence_index (HISTORICAL_AS_BUILT)"
    constants:
      RATE_BASE_UNITS: 1000
      EXPECTED_ANNUAL_HOURS: 2000
      WARRANTY_RATE_TRIGGER: 8.00
    precision: "both rates 2 dp half-up; a zero denominator yields 0.00 and never triggers"
    variants:
      - name: PRODUCTION_COHORT
        description: |
          rate = round(RATE_BASE_UNITS * failures / cohort_units, 2) where
          cohort_units counts every ProductionUnit whose HISTORICAL_AS_BUILT BOM
          contains the part and whose assembly_status == SHIPPED. This is the
          variant stored on Part.cohort_failure_rate_per_1000 and compared with
          WARRANTY_RATE_TRIGGER.
      - name: SHIPPED_EXPOSURE
        description: |
          rate = round(RATE_BASE_UNITS * EXPECTED_ANNUAL_HOURS * failures
                       / total_field_hours, 2) where total_field_hours is the sum
          of field_hours over the counted returns. Reported only; it normalises
          for how long the units were actually in service.
    variant_divergence_example: |
      Two SHIPPED cohort units carrying the part, one DESIGN_DEFECT return with
      field_hours 500:
        PRODUCTION_COHORT = round(1000 * 1 / 2, 2)              = 500.00
        SHIPPED_EXPOSURE  = round(1000 * 2000 * 1 / 500, 2)     = 4000.00
      Both exceed WARRANTY_RATE_TRIGGER, but only PRODUCTION_COHORT is the
      trigger input, so the auto-created EngineeringChange is attributable to
      exactly one variant.

# =============================================================================
# §1.4 Validation Ladder (evaluated in ascending priority; first violation wins,
# no mutation occurs when any rule fires)
# =============================================================================
validations:

  - priority: 1
    category: authentication
    rule: "X-User-ID header present and non-empty on every endpoint"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all endpoints"

  - priority: 2
    category: authorization
    rule: "X-User-Role is one of the §1.7 roles and appears in the endpoint's roles list"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: "all endpoints"

  - priority: 3
    category: schema
    rule: "Body/query shape: required fields present, types correct, enums in range, numeric bounds honoured (takt_seconds >= 1, option_load_limit_pct in (0,100], qty_per_unit >= 1, option_content_points in [0,10], overtime_minutes in [0,120], sequence_index >= 1, limit in [1,100], offset >= 0, ISO-8601 timestamps, window_start < window_end, shift_start < shift_end)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all endpoints"

  - priority: 4
    category: existence
    rule: "The {id} path parameter resolves to an entity of the endpoint's own type"
    error_id: "the entity's own NOT_FOUND code (ERR_LINE_NOT_FOUND, ERR_STATION_NOT_FOUND, ERR_MODEL_VARIANT_NOT_FOUND, ERR_SUPPLIER_NOT_FOUND, ERR_PART_NOT_FOUND, ERR_BOM_LINE_NOT_FOUND, ERR_DELIVERY_CALL_NOT_FOUND, ERR_SHIFT_PLAN_NOT_FOUND, ERR_BUILD_SLOT_NOT_FOUND, ERR_PRODUCTION_UNIT_NOT_FOUND, ERR_ENGINEERING_CHANGE_NOT_FOUND, ERR_WARRANTY_RETURN_NOT_FOUND)"
    http_status: 404
    applies_to: "every endpoint carrying {id}"

  - priority: 5
    category: existence
    rule: "Every foreign key in the request body or query string resolves, checked in the order the fields are declared in the endpoint's input list"
    error_id: "the referenced entity's NOT_FOUND code"
    http_status: 404
    applies_to: "POST /stations, POST /parts, POST /bom-lines, POST /delivery-calls, POST /shift-plans, POST /build-slots, POST /engineering-changes, POST /warranty-returns, POST /warranty-returns/{id}/analyze, all filtered list GETs"

  - priority: 6
    category: authorization
    rule: "A SupplierPortal caller may only act on rows whose supplier_id equals X-User-ID (POST /delivery-calls/{id}/record-arrival, GET /suppliers/{id}, GET /delivery-calls, GET /parts filtered by supplier_id)"
    error_id: ERR_SUPPLIER_SCOPE_VIOLATION
    http_status: 403
    applies_to: "SupplierPortal-visible endpoints"

  - priority: 7
    category: concurrency
    rule: "expected_model_variant_version == ModelVariant.version on POST /bom-lines; expected_line_version == Line.version on POST /shift-plans"
    error_id: "ERR_STALE_MODEL_VARIANT_VERSION | ERR_STALE_LINE_VERSION"
    http_status: 412
    applies_to: "POST /bom-lines, POST /shift-plans"

  - priority: 8
    category: authorization
    rule: "The caller deciding an EngineeringChange must not be its submitted_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /engineering-changes/{id}/decide"

  - priority: 9
    category: state
    rule: "The target entity is in a state from which the requested transition exists (see §1.2), including cross-dimension guards such as ship requiring quality_status == CERTIFIED"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "every action endpoint"

  - priority: 10
    category: business
    rule: "A LEAK QualityTest may only be recorded when ModelVariant.requires_leak_test == true; a WATER test only when ModelVariant.water_liters_limit is not null"
    error_id: ERR_TEST_NOT_APPLICABLE
    http_status: 422
    applies_to: "POST /production-units/{id}/quality-tests"

  - priority: 11
    category: business
    rule: "Quality gate order: ELECTRICAL_SAFETY first; LEAK and FUNCTIONAL_CYCLE require quality_status IN {SAFETY_PASSED, GATED}; ENERGY and WATER require quality_status == GATED"
    error_id: ERR_QUALITY_GATE_ORDER
    http_status: 409
    applies_to: "POST /production-units/{id}/quality-tests"

  - priority: 12
    category: state
    rule: "A quarantined unit accepts no assembly progress (complete-assembly, ship) and no new test other than through clear-quarantine"
    error_id: ERR_UNIT_QUARANTINED
    http_status: 409
    applies_to: "POST /production-units/{id}/complete-assembly, POST /production-units/{id}/ship, POST /production-units/{id}/quality-tests"

  - priority: 13
    category: business
    rule: "efficiency_index (CERTIFICATION_AVERAGE) must be <= TIER_B_MAX (1.00) at certification; the check is on the 2-dp index"
    error_id: ERR_EFFICIENCY_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /production-units/{id}/certify"

  - priority: 14
    category: state
    rule: "The governing ModelVariant must be RELEASED for BuildSlot sequencing, BuildSlot release, unit certification and EngineeringChange cut-in; for BomLine authoring it must merely not be OBSOLETE (a DRAFT variant is where its BOM is built up in the first place)"
    error_id: ERR_MODEL_NOT_RELEASED
    http_status: 409
    applies_to: "POST /bom-lines, POST /build-slots/{id}/sequence, POST /build-slots/{id}/release, POST /production-units/{id}/certify, POST /engineering-changes/{id}/cut-in"

  - priority: 15
    category: business
    rule: "The resolved BOM must be non-empty at the relevant sequence index, and a root_cause_part_id must appear on the unit's HISTORICAL_AS_BUILT BOM"
    error_id: ERR_BOM_NOT_EFFECTIVE
    http_status: 422
    applies_to: "POST /build-slots/{id}/sequence, POST /engineering-changes/{id}/cut-in, POST /warranty-returns/{id}/analyze"

  - priority: 16
    category: state
    rule: "No part on the effective BOM may be in lifecycle_status CHANGE_PENDING or OBSOLETE when a slot is sequenced, and a new BomLine may not name an OBSOLETE part"
    error_id: ERR_PART_CHANGE_PENDING
    http_status: 409
    applies_to: "POST /build-slots/{id}/sequence, POST /bom-lines"

  - priority: 17
    category: state
    rule: "An engineering change may only be cut in while the target line's posture is STOPPED"
    error_id: ERR_LINE_NOT_STOPPED
    http_status: 409
    applies_to: "POST /engineering-changes/{id}/cut-in"

  - priority: 18
    category: business
    rule: "cut_in_sequence_index must be strictly greater than Line.max_released_sequence_index — a change cannot rewrite units already released"
    error_id: ERR_CUT_IN_INDEX_TOO_LOW
    http_status: 422
    applies_to: "POST /engineering-changes/{id}/cut-in"

  - priority: 19
    category: business
    rule: "replacement_part_id must be present at cut-in and must not equal affected_part_id"
    error_id: ERR_REPLACEMENT_PART_REQUIRED
    http_status: 422
    applies_to: "POST /engineering-changes/{id}/cut-in"

  - priority: 20
    category: business
    rule: "A SERVICE_ONLY part cannot be obsoleted while the logical clock is at or before service_obligation_until"
    error_id: ERR_SERVICE_OBLIGATION_ACTIVE
    http_status: 409
    applies_to: "POST /parts/{id}/obsolete"

  - priority: 21
    category: business
    rule: "A BuildSlot may only be released when its ModelVariant.family_code equals Line.current_family_code"
    error_id: ERR_CHANGEOVER_REQUIRED
    http_status: 409
    applies_to: "POST /build-slots/{id}/release"

  - priority: 22
    category: temporal
    rule: "Two SCHEDULED-or-arrived DeliveryCalls at the same station must be separated by at least DOCK_BUFFER_MINUTES (10) of clear dock time: the new [window_start - 10min, window_end + 10min) may not intersect an existing [window_start, window_end)"
    error_id: ERR_DOCK_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /delivery-calls"

  - priority: 23
    category: temporal
    rule: "Two ACTIVE ShiftPlans on the same line may not overlap on [shift_start, shift_end + overtime_minutes); touching endpoints are allowed and a plan whose end crosses midnight is compared on absolute timestamps"
    error_id: ERR_SHIFT_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /shift-plans"

  - priority: 24
    category: business
    rule: "Exactly one ACTIVE ShiftPlan of the line must cover the relevant instant: planned_start for sequencing, the logical clock for a changeover start"
    error_id: ERR_NO_SHIFT_COVERAGE
    http_status: 422
    applies_to: "POST /build-slots/{id}/sequence, POST /lines/{id}/start"

  - priority: 25
    category: business
    rule: "sequence_index is unique per line among BuildSlots in status IN {PLANNED, SEQUENCED, RELEASED, BUILT}"
    error_id: ERR_SEQUENCE_INDEX_TAKEN
    http_status: 409
    applies_to: "POST /build-slots"

  - priority: 26
    category: state
    rule: "Line.posture must not be STOPPED to sequence a slot and must be OPEN to release one"
    error_id: ERR_LINE_POSTURE_BLOCKED
    http_status: 409
    applies_to: "POST /build-slots/{id}/sequence, POST /build-slots/{id}/release"

  - priority: 27
    category: state
    rule: "Every supplier feeding a sequenced module on the effective BOM must have status APPROVED; a new DeliveryCall may not be booked for a SUSPENDED supplier"
    error_id: ERR_SUPPLIER_NOT_APPROVED
    http_status: 409
    applies_to: "POST /build-slots/{id}/sequence, POST /delivery-calls"

  - priority: 28
    category: business
    rule: "Every is_sequenced_module part on the effective BOM needs a covering DeliveryCall (same part_id and station_id, window_start <= planned_start < window_end, status IN {SCHEDULED, ARRIVED_ON_TIME, ARRIVED_LATE})"
    error_id: ERR_SYNC_DELIVERY_MISSING
    http_status: 422
    applies_to: "POST /build-slots/{id}/sequence"

  - priority: 29
    category: business
    rule: "Every rolling LOAD_WINDOW_SLOTS window containing the candidate index must satisfy calculations.option_load_window_cap"
    error_id: ERR_OPTION_LOAD_WINDOW_EXCEEDED
    http_status: 422
    applies_to: "POST /build-slots/{id}/sequence"

  - priority: 30
    category: business
    rule: "Presentation slot allocation must fit at every station named by the effective BOM (calculations.presentation_slot_allocation)"
    error_id: ERR_PRESENTATION_SLOTS_EXHAUSTED
    http_status: 422
    applies_to: "POST /build-slots/{id}/sequence"

  - priority: 31
    category: business
    rule: "The covering ShiftPlan's recomputed committed_labor_minutes must not exceed available_labor_minutes"
    error_id: ERR_LABOR_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /build-slots/{id}/sequence"

  - priority: 32
    category: business
    rule: "Uniqueness of natural keys: Line.line_code, ModelVariant.model_code, Supplier.supplier_code, Part.part_number globally; Station.station_code and Station.position_index within a line"
    error_id: ERR_DUPLICATE_CODE
    http_status: 409
    applies_to: "POST /lines, POST /stations, POST /model-variants, POST /suppliers, POST /parts"

# =============================================================================
# §1.5 Endpoint Table
# path params are always literally `{id}`; `input:` lists body/query fields only
# (a trailing `?` marks an optional field)
# =============================================================================
endpoints:

  # --- test-driving logical clock ------------------------------------------
  - method: POST
    path: /_clock/set_current_utc
    roles: [PlantAdmin, ProductionPlanner, LineOperator, QualityInspector, EngineeringLead, WarrantyAnalyst]
    input: [current_utc]
    output: "{ current_utc: string }"
    description: |
      Sets the logical clock used by every temporal rule (window comparisons,
      lateness, miss grace, service obligations, checkpoint sweeps).
      MANDATORY DEFAULT: before any call to this endpoint the logical clock
      reads 2026-08-01T00:00:00Z.
    side_effects: ["no entity is mutated; subsequent reads of derived temporal state reflect the new instant"]

  # --- Line ---------------------------------------------------------------
  - method: POST
    path: /lines
    roles: [PlantAdmin]
    input: [line_code, takt_seconds, option_load_limit_pct, baseline_headcount, current_family_code]
    output: Line
    side_effects: ["operating_mode RUNNING, posture CONSTRAINED (no stations yet, free_slot_pct 0.00), version 1"]

  - method: GET
    path: /lines/{id}
    roles: [PlantAdmin, ProductionPlanner, LineOperator, QualityInspector, EngineeringLead, WarrantyAnalyst]
    input: []
    output: Line
    description: "Read the line, including the recomputed posture, free_slot_pct, max_released_sequence_index and the version needed for expected_line_version."

  - method: POST
    path: /lines/{id}/stop
    roles: [LineOperator, PlantAdmin]
    input: [reason]
    output: Line
    side_effects: ["operating_mode STOPPED, stop_reason recorded, posture STOPPED, version += 1"]

  - method: POST
    path: /lines/{id}/start
    roles: [LineOperator, PlantAdmin]
    input: ["to_family_code?"]
    output: Line
    side_effects:
      - "operating_mode RUNNING, stop_reason cleared, posture recomputed, version += 1"
      - "when to_family_code differs from current_family_code: current_family_code replaced, changeover_count += 1, CHANGEOVER_MINUTES booked onto the ACTIVE ShiftPlan covering the logical clock (its committed_labor_minutes is re-derived), ERR_NO_SHIFT_COVERAGE when no plan covers it"

  - method: POST
    path: /lines/{id}/run-checkpoint
    roles: [ProductionPlanner, PlantAdmin]
    input: []
    output: "{ checkpoint_index: integer, missed_call_ids: string[], cancelled_call_ids: string[], de_sequenced_build_slot_ids: string[], cancelled_build_slot_ids: string[], demoted_supplier_ids: string[], closed_change_ids: string[] }"
    description: |
      Deterministic sweep of everything the logical clock has made overdue on one
      line. Steps run in this fixed order:
        1. checkpoint_index += 1
        2. every SCHEDULED DeliveryCall whose station belongs to the line and
           whose window_end + MISS_GRACE_MINUTES <= logical clock becomes MISSED,
           processed in (window_end ASC, created_at ASC) order, each one scoring
           its supplier and, on a demotion out of APPROVED, cancelling that
           supplier's remaining SCHEDULED calls and de-sequencing their slots
        3. every BuildSlot on the line still PLANNED with planned_start < clock
           becomes CANCELLED
        4. every CUT_IN EngineeringChange targeting the line whose pre-cut-in
           units have all left {IN_STATION, REWORK} becomes CLOSED
        5. Line posture, free_slot_pct and max_released_sequence_index recomputed
    side_effects: ["all mutations of steps 2-5, reported through the id lists in the response"]

  # --- Station ------------------------------------------------------------
  - method: POST
    path: /stations
    roles: [PlantAdmin]
    input: [line_id, station_code, position_index, presentation_slot_capacity, station_cycle_seconds]
    output: Station
    side_effects: ["Line.presentation_slots_total, free_slot_pct and posture recomputed; Line.version += 1"]

  - method: GET
    path: /stations/{id}
    roles: [PlantAdmin, ProductionPlanner, LineOperator, QualityInspector, EngineeringLead]
    input: []
    output: Station
    description: "Read one station, including presentation_slots_used — the observable of the presentation-slot conservation invariant."

  - method: GET
    path: /lines/{id}/stations
    roles: [PlantAdmin, ProductionPlanner, LineOperator, QualityInspector, EngineeringLead]
    input: ["limit?", "offset?"]
    output: Station[]
    description: "Stations of one line in position_index ASC order (the allocation order of calculations.presentation_slot_allocation)."

  # --- ModelVariant -------------------------------------------------------
  - method: POST
    path: /model-variants
    roles: [PlantAdmin]
    input: [model_code, family_code, option_codes, option_content_points, labor_minutes, functional_cycle_count_required, "requires_leak_test?", "hipot_leakage_ma_limit?", "leak_limit_ml_per_min?", "energy_kwh_limit?", "water_liters_limit?"]
    output: ModelVariant
    side_effects: ["status DRAFT, version 1"]

  - method: GET
    path: /model-variants/{id}
    roles: [PlantAdmin, ProductionPlanner, LineOperator, QualityInspector, EngineeringLead, WarrantyAnalyst]
    input: []
    output: ModelVariant
    description: "Read the variant, including the version needed for expected_model_variant_version."

  - method: POST
    path: /model-variants/{id}/release
    roles: [PlantAdmin]
    input: []
    output: ModelVariant
    side_effects: ["status RELEASED, version += 1"]

  - method: POST
    path: /model-variants/{id}/obsolete
    roles: [PlantAdmin]
    input: []
    output: ModelVariant
    side_effects: ["status OBSOLETE, version += 1; sequencing, further BOM authoring and certification for the variant now fail with ERR_MODEL_NOT_RELEASED"]

  # --- Supplier -----------------------------------------------------------
  - method: POST
    path: /suppliers
    roles: [PlantAdmin]
    input: [supplier_code, name, sync_window_minutes]
    output: Supplier
    side_effects: ["status APPROVED, on_time_score 100.00, all counters 0"]

  - method: GET
    path: /suppliers/{id}
    roles: [PlantAdmin, ProductionPlanner, QualityInspector, EngineeringLead, WarrantyAnalyst, SupplierPortal]
    input: []
    output: Supplier
    description: "Read supplier scoring state. A SupplierPortal caller may only read its own row (ERR_SUPPLIER_SCOPE_VIOLATION otherwise)."

  # --- Part ---------------------------------------------------------------
  - method: POST
    path: /parts
    roles: [PlantAdmin]
    input: [part_number, supplier_id, is_sequenced_module, line_side_max_units]
    output: Part
    side_effects: ["lifecycle_status ACTIVE, field_failure_count 0, cohort_failure_rate_per_1000 0.00, service_obligation_until null"]

  - method: GET
    path: /parts/{id}
    roles: [PlantAdmin, ProductionPlanner, LineOperator, QualityInspector, EngineeringLead, WarrantyAnalyst]
    input: []
    output: Part
    description: "Read part lifecycle state, service obligation deadline and stored cohort failure rate."

  - method: GET
    path: /parts
    roles: [PlantAdmin, ProductionPlanner, EngineeringLead, WarrantyAnalyst, SupplierPortal]
    input: ["supplier_id?", "lifecycle_status?", "is_sequenced_module?", "limit?", "offset?"]
    output: Part[]
    description: "Filtered part list; a SupplierPortal caller may only filter by its own supplier_id."

  - method: POST
    path: /parts/{id}/obsolete
    roles: [PlantAdmin]
    input: []
    output: Part
    side_effects: ["lifecycle_status OBSOLETE once the service obligation has strictly elapsed"]

  - method: GET
    path: /parts/{id}/warranty-metrics
    roles: [PlantAdmin, EngineeringLead, WarrantyAnalyst]
    input: []
    output: "{ part_id: string, failure_count: integer, cohort_units: integer, total_field_hours: number, cohort_failure_rate_per_1000: number, shipped_exposure_rate_per_1000: number, trigger_threshold: number, trigger_breached: boolean }"
    description: "Both variants of calculations.warranty_failure_rate side by side; trigger_breached reflects the PRODUCTION_COHORT variant only."

  # --- BomLine ------------------------------------------------------------
  - method: POST
    path: /bom-lines
    roles: [PlantAdmin, EngineeringLead]
    input: [model_variant_id, part_id, station_id, bom_position_code, qty_per_unit, effective_from_sequence, expected_model_variant_version]
    output: BomLine
    side_effects:
      - "status ACTIVE; an existing ACTIVE line for the same (model_variant_id, bom_position_code) with effective_from_sequence >= the new one becomes SUPERSEDED with superseded_by_bom_line_id set"
      - "ModelVariant.version += 1"
    description: "OCC-guarded per §1.2.1 rule bom-line-create-stale-model-variant. Authoring is legal while the variant is DRAFT or RELEASED and rejected once it is OBSOLETE (ERR_MODEL_NOT_RELEASED, checked after the version check)."

  - method: GET
    path: /bom-lines/{id}
    roles: [PlantAdmin, ProductionPlanner, LineOperator, QualityInspector, EngineeringLead, WarrantyAnalyst]
    input: []
    output: BomLine
    description: "Read one BOM line, including status and superseded_by_bom_line_id after a cut-in."

  - method: GET
    path: /bom-lines
    roles: [PlantAdmin, ProductionPlanner, LineOperator, QualityInspector, EngineeringLead, WarrantyAnalyst]
    input: ["model_variant_id?", "part_id?", "station_id?", "superseded_by_bom_line_id?", "created_by_change_id?", "bom_position_code?", "status?", "effective_at_sequence?", "limit?", "offset?"]
    output: BomLine[]
    description: "Filtered BOM lines. effective_at_sequence applies calculations.effective_bom_at_sequence variant PRODUCTION_EFFECTIVE when status is omitted or ACTIVE, and HISTORICAL_AS_BUILT when status is omitted and include_superseded semantics are requested through status=SUPERSEDED."

  # --- DeliveryCall -------------------------------------------------------
  - method: POST
    path: /delivery-calls
    roles: [ProductionPlanner, PlantAdmin]
    input: [supplier_id, part_id, station_id, window_start, window_end, sequenced_qty]
    output: DeliveryCall
    side_effects: ["status SCHEDULED; rejected when the DOCK_BUFFER_MINUTES-padded window intersects another live call at the same station, or the supplier is SUSPENDED"]

  - method: GET
    path: /delivery-calls/{id}
    roles: [PlantAdmin, ProductionPlanner, LineOperator, EngineeringLead, SupplierPortal]
    input: []
    output: DeliveryCall
    description: "Read one call, including lateness_minutes and cancel_reason. A SupplierPortal caller may only read its own calls."

  - method: GET
    path: /delivery-calls
    roles: [PlantAdmin, ProductionPlanner, LineOperator, EngineeringLead, SupplierPortal]
    input: ["supplier_id?", "part_id?", "station_id?", "status?", "cancel_reason?", "limit?", "offset?"]
    output: DeliveryCall[]
    description: "Filtered call list, ordered window_start ASC then created_at ASC. A SupplierPortal caller is restricted to its own supplier_id."

  - method: POST
    path: /delivery-calls/{id}/record-arrival
    roles: [SupplierPortal]
    input: [arrived_at]
    output: DeliveryCall
    side_effects: ["status ARRIVED_ON_TIME or ARRIVED_LATE, lateness_minutes computed, supplier counters and on_time_score updated, Supplier.status re-derived with the demotion cascade"]

  - method: POST
    path: /delivery-calls/{id}/cancel
    roles: [ProductionPlanner, PlantAdmin]
    input: []
    output: DeliveryCall
    side_effects: ["status CANCELLED with cancel_reason PLANNER; dependent SEQUENCED BuildSlots de-sequence, releasing presentation slots and shift labour"]

  # --- ShiftPlan ----------------------------------------------------------
  - method: POST
    path: /shift-plans
    roles: [ProductionPlanner, PlantAdmin]
    input: [line_id, shift_date, shift_code, planned_headcount, shift_start, shift_end, expected_line_version, "overtime_minutes?"]
    output: ShiftPlan
    side_effects:
      - "status ACTIVE; available_labor_minutes = SHIFT_MINUTES + overtime_minutes"
      - "an existing ACTIVE plan for the same (line_id, shift_date, shift_code) becomes SUPERSEDED and its BuildSlots are repointed, then both plans' labour figures are re-derived"
      - "Line.version += 1"
    description: "OCC-guarded per §1.2.1 rule shift-plan-create-stale-line."

  - method: GET
    path: /shift-plans/{id}
    roles: [PlantAdmin, ProductionPlanner, LineOperator, EngineeringLead]
    input: []
    output: ShiftPlan
    description: "Read one plan, including unit_labor_minutes, changeover_minutes, committed_labor_minutes and available_labor_minutes."

  - method: GET
    path: /lines/{id}/shift-plans
    roles: [PlantAdmin, ProductionPlanner, LineOperator, EngineeringLead]
    input: ["shift_date?", "shift_code?", "status?", "limit?", "offset?"]
    output: ShiftPlan[]
    description: "Plans of one line, ordered shift_start ASC then created_at ASC."

  # --- BuildSlot ----------------------------------------------------------
  - method: POST
    path: /build-slots
    roles: [ProductionPlanner, PlantAdmin]
    input: [line_id, model_variant_id, sequence_index, planned_start]
    output: BuildSlot
    side_effects: ["status PLANNED; sequence_index uniqueness enforced across the line's live slots; no capacity is consumed yet"]

  - method: GET
    path: /build-slots/{id}
    roles: [PlantAdmin, ProductionPlanner, LineOperator, QualityInspector, EngineeringLead]
    input: []
    output: BuildSlot
    description: "Read one slot, including the pinned snapshots, presentation_allocations and allocated_slot_units."

  - method: GET
    path: /build-slots
    roles: [PlantAdmin, ProductionPlanner, LineOperator, QualityInspector, EngineeringLead]
    input: ["line_id?", "model_variant_id?", "shift_plan_id?", "sync_delivery_call_id?", "status?", "limit?", "offset?"]
    output: BuildSlot[]
    description: "Filtered slot list, ordered sequence_index ASC."

  - method: POST
    path: /build-slots/{id}/sequence
    roles: [ProductionPlanner]
    input: []
    output: BuildSlot
    side_effects:
      - "status SEQUENCED; shift_plan_id, sync_delivery_call_id, option_points_snapshot, labor_minutes_snapshot, presentation_allocations, allocated_slot_units pinned"
      - "station presentation_slots_used charged, Line presentation_slots_committed / free_slot_pct / posture recomputed, ShiftPlan labour figures recomputed"
    description: "Runs validations 24-31 in that priority order; nothing is mutated when any of them fires."

  - method: POST
    path: /build-slots/{id}/de-sequence
    roles: [ProductionPlanner]
    input: []
    output: BuildSlot
    side_effects: ["status PLANNED; every charge made at sequence time is reversed exactly (presentation slots, shift labour, line posture) and the snapshots are cleared"]

  - method: POST
    path: /build-slots/{id}/release
    roles: [LineOperator]
    input: []
    output: ProductionUnit
    side_effects:
      - "BuildSlot RELEASED; a ProductionUnit is created (assembly_status IN_STATION, quality_status PENDING, built_at_sequence_index = sequence_index, serial_number '<line_code>-NNNNNN')"
      - "Line.max_released_sequence_index recomputed"
    description: "Requires Line.posture == OPEN and the slot's family to match the line's current tooling."

  # --- ProductionUnit / QualityTest ---------------------------------------
  - method: GET
    path: /production-units/{id}
    roles: [PlantAdmin, ProductionPlanner, LineOperator, QualityInspector, EngineeringLead, WarrantyAnalyst]
    input: []
    output: ProductionUnit
    description: "Read the unit's two status dimensions plus provisional_efficiency_index (AS_TESTED) and, once certified, efficiency_index and certification_tier (CERTIFICATION_AVERAGE)."

  - method: GET
    path: /production-units
    roles: [PlantAdmin, ProductionPlanner, LineOperator, QualityInspector, EngineeringLead, WarrantyAnalyst]
    input: ["build_slot_id?", "assembly_status?", "quality_status?", "certification_tier?", "limit?", "offset?"]
    output: ProductionUnit[]
    description: "Filtered unit list, ordered built_at_sequence_index ASC."

  - method: POST
    path: /production-units/{id}/quality-tests
    roles: [QualityInspector]
    input: [test_type, measured_value]
    output: QualityTest
    side_effects:
      - "limit_value is copied from the governing ModelVariant field for the test_type (hipot_leakage_ma_limit, leak_limit_ml_per_min, functional_cycle_count_required, energy_kwh_limit, water_liters_limit)"
      - "result is PASS when measured_value <= limit_value for ELECTRICAL_SAFETY and LEAK, PASS when measured_value >= limit_value for FUNCTIONAL_CYCLE, FAIL otherwise, and always MEASURED for ENERGY and WATER (which never quarantine a unit — they are scored at certification instead)"
      - "a PASS advances the unit's quality dimension (PENDING -> SAFETY_PASSED -> GATED); a FAIL sets quality_status QUARANTINED, assembly_status REWORK and increments rework_count"

  - method: GET
    path: /production-units/{id}/quality-tests
    roles: [PlantAdmin, QualityInspector, EngineeringLead, WarrantyAnalyst]
    input: ["test_type?", "status?", "result?", "limit?", "offset?"]
    output: QualityTest[]
    description: "Tests of one unit, ordered created_at ASC — the input set of calculations.efficiency_index."

  - method: POST
    path: /production-units/{id}/clear-quarantine
    roles: [QualityInspector]
    input: ["note?"]
    output: ProductionUnit
    side_effects: ["every FAIL test with status RECORDED becomes VOIDED; quality_status PENDING, assembly_status IN_STATION; the gate chain must be re-walked"]

  - method: POST
    path: /production-units/{id}/certify
    roles: [QualityInspector]
    input: []
    output: ProductionUnit
    side_effects: ["efficiency_index and certification_tier written from calculations.efficiency_index variant CERTIFICATION_AVERAGE; quality_status CERTIFIED"]

  - method: POST
    path: /production-units/{id}/complete-assembly
    roles: [LineOperator]
    input: []
    output: ProductionUnit
    side_effects: ["assembly_status ASSEMBLED; the owning BuildSlot bubbles up RELEASED -> BUILT; the quality dimension is untouched"]

  - method: POST
    path: /production-units/{id}/ship
    roles: [LineOperator]
    input: []
    output: ProductionUnit
    side_effects: ["assembly_status SHIPPED (requires quality_status CERTIFIED); the slot's presentation allocations are released and the Line posture is recomputed"]

  # --- EngineeringChange --------------------------------------------------
  - method: POST
    path: /engineering-changes
    roles: [EngineeringLead]
    input: [model_variant_id, affected_part_id, target_line_id, bom_position_code, cut_in_sequence_index, "replacement_part_id?", "new_qty_per_unit?"]
    output: EngineeringChange
    side_effects: ["status DRAFT, origin MANUAL, revision_round 0"]

  - method: GET
    path: /engineering-changes/{id}
    roles: [PlantAdmin, ProductionPlanner, EngineeringLead, WarrantyAnalyst, QualityInspector]
    input: []
    output: EngineeringChange
    description: "Read the change, including revision_round, submitted_by_user_id, decided_by_user_id and cut_in_at."

  - method: GET
    path: /engineering-changes
    roles: [PlantAdmin, ProductionPlanner, EngineeringLead, WarrantyAnalyst, QualityInspector]
    input: ["model_variant_id?", "affected_part_id?", "replacement_part_id?", "target_line_id?", "source_warranty_return_id?", "origin?", "status?", "limit?", "offset?"]
    output: EngineeringChange[]
    description: "Filtered change list, ordered created_at ASC — the read used to find the change auto-raised by the design-feedback cascade."

  - method: POST
    path: /engineering-changes/{id}/submit
    roles: [EngineeringLead]
    input: []
    output: EngineeringChange
    side_effects: ["status SUBMITTED, submitted_by_user_id = X-User-ID; affected Part ACTIVE -> CHANGE_PENDING"]

  - method: POST
    path: /engineering-changes/{id}/start-review
    roles: [EngineeringLead]
    input: []
    output: EngineeringChange
    side_effects: ["status UNDER_REVIEW"]

  - method: POST
    path: /engineering-changes/{id}/decide
    roles: [EngineeringLead]
    input: [decision, "note?"]
    output: EngineeringChange
    description: "decision is APPROVE | REJECT | REQUEST_REVISION. The decider may not be submitted_by_user_id (ERR_SEGREGATION_OF_DUTIES)."
    side_effects:
      - "APPROVE -> APPROVED; REJECT -> REJECTED (affected part released back to ACTIVE)"
      - "REQUEST_REVISION -> REVISION_REQUESTED with revision_round += 1, or CANCELLED when the increment would exceed EC_MAX_REVISION_ROUNDS"

  - method: POST
    path: /engineering-changes/{id}/cut-in
    roles: [EngineeringLead]
    input: ["replacement_part_id?", "new_qty_per_unit?"]
    output: EngineeringChange
    side_effects:
      - "status CUT_IN, cut_in_at = logical clock"
      - "depth-4 cascade: BomLine supersession -> outgoing Part SERVICE_ONLY with a 10-year obligation -> its future SCHEDULED DeliveryCalls CANCELLED (PART_SERVICE_ONLY) -> dependent SEQUENCED BuildSlots de-sequenced"
    description: "Requires target Line.posture == STOPPED and cut_in_sequence_index > Line.max_released_sequence_index."

  # --- WarrantyReturn -----------------------------------------------------
  - method: POST
    path: /warranty-returns
    roles: [WarrantyAnalyst]
    input: [production_unit_id, failure_code, field_hours, "returned_at?"]
    output: WarrantyReturn
    side_effects: ["status RECEIVED; the referenced unit must be SHIPPED"]

  - method: GET
    path: /warranty-returns/{id}
    roles: [PlantAdmin, EngineeringLead, WarrantyAnalyst, QualityInspector]
    input: []
    output: WarrantyReturn
    description: "Read the return, including disposition, root_cause_part_id and the engineering_change_id raised by the cascade."

  - method: GET
    path: /warranty-returns
    roles: [PlantAdmin, EngineeringLead, WarrantyAnalyst, QualityInspector]
    input: ["production_unit_id?", "root_cause_part_id?", "engineering_change_id?", "disposition?", "status?", "limit?", "offset?"]
    output: WarrantyReturn[]
    description: "Filtered return list, ordered returned_at ASC."

  - method: POST
    path: /warranty-returns/{id}/teardown
    roles: [WarrantyAnalyst]
    input: []
    output: WarrantyReturn
    side_effects: ["status TEARDOWN, teardown_started_at = logical clock"]

  - method: POST
    path: /warranty-returns/{id}/analyze
    roles: [WarrantyAnalyst]
    input: [disposition, "root_cause_part_id?"]
    output: WarrantyReturn
    side_effects:
      - "DESIGN_DEFECT -> ANALYZED_DESIGN: part failure counters and cohort rate updated; a breach of WARRANTY_RATE_TRIGGER mints a WARRANTY-origin EngineeringChange in SUBMITTED and moves the part to CHANGE_PENDING"
      - "SUPPLIER_DEFECT -> ANALYZED_SUPPLIER: part counters updated, supplier quality_penalty_count and on_time_score charged, no change is minted"
      - "NO_FAULT_FOUND -> CLOSED with no counter movement"

  - method: POST
    path: /warranty-returns/{id}/close
    roles: [WarrantyAnalyst]
    input: ["design_feedback_note?"]
    output: WarrantyReturn
    side_effects: ["status CLOSED, design_feedback_note stored; all analysis side effects stand"]

  - method: POST
    path: /warranty-returns/{id}/withdraw
    roles: [WarrantyAnalyst]
    input: ["reason?"]
    output: WarrantyReturn
    side_effects: ["status CLOSED with disposition rewritten to NO_FAULT_FOUND; the part's field_failure_count and cohort rate are decremented, any supplier quality charge is refunded, and a still-open WARRANTY-origin change is CANCELLED with the part returned to ACTIVE"]

# =============================================================================
# §1.6 Error Catalog
# =============================================================================
errors:

  # --- envelope / auth ----------------------------------------------------
  - { error_id: ERR_UNAUTHENTICATED, http_status: 401, message: "X-User-ID header is required", triggered_by: "any endpoint called without a non-empty X-User-ID" }
  - { error_id: ERR_ROLE_NOT_PERMITTED, http_status: 403, message: "Role is not permitted to perform this operation", triggered_by: "X-User-Role missing, unknown, or absent from the endpoint's roles list" }
  - { error_id: ERR_INVALID_REQUEST, http_status: 400, message: "Request body or query parameters are invalid", triggered_by: "missing required field, wrong type, out-of-range number, unknown enum member, window_start >= window_end, shift_start >= shift_end, limit outside 1..100" }
  - { error_id: ERR_SUPPLIER_SCOPE_VIOLATION, http_status: 403, message: "Supplier callers may only act on their own records", triggered_by: "SupplierPortal caller whose X-User-ID differs from the target row's supplier_id" }
  - { error_id: ERR_SEGREGATION_OF_DUTIES, http_status: 403, message: "The submitter of an engineering change may not decide it", triggered_by: "POST /engineering-changes/{id}/decide with X-User-ID == submitted_by_user_id" }

  # --- concurrency --------------------------------------------------------
  - { error_id: ERR_STALE_MODEL_VARIANT_VERSION, http_status: 412, message: "Model variant was modified by another writer", triggered_by: "POST /bom-lines with expected_model_variant_version != ModelVariant.version" }
  - { error_id: ERR_STALE_LINE_VERSION, http_status: 412, message: "Line was modified by another writer", triggered_by: "POST /shift-plans with expected_line_version != Line.version" }

  # --- existence ----------------------------------------------------------
  - { error_id: ERR_LINE_NOT_FOUND, http_status: 404, message: "Line not found", triggered_by: "unknown {id} on a /lines path or unknown line_id / target_line_id in a body" }
  - { error_id: ERR_STATION_NOT_FOUND, http_status: 404, message: "Station not found", triggered_by: "unknown {id} on /stations/{id} or unknown station_id in a body or filter" }
  - { error_id: ERR_MODEL_VARIANT_NOT_FOUND, http_status: 404, message: "Model variant not found", triggered_by: "unknown {id} on a /model-variants path or unknown model_variant_id in a body or filter" }
  - { error_id: ERR_SUPPLIER_NOT_FOUND, http_status: 404, message: "Supplier not found", triggered_by: "unknown {id} on /suppliers/{id} or unknown supplier_id in a body or filter" }
  - { error_id: ERR_PART_NOT_FOUND, http_status: 404, message: "Part not found", triggered_by: "unknown {id} on a /parts path or unknown part_id / affected_part_id / replacement_part_id / root_cause_part_id in a body" }
  - { error_id: ERR_BOM_LINE_NOT_FOUND, http_status: 404, message: "BOM line not found", triggered_by: "unknown {id} on /bom-lines/{id} or unknown superseded_by_bom_line_id filter" }
  - { error_id: ERR_DELIVERY_CALL_NOT_FOUND, http_status: 404, message: "Delivery call not found", triggered_by: "unknown {id} on a /delivery-calls path or unknown sync_delivery_call_id filter" }
  - { error_id: ERR_SHIFT_PLAN_NOT_FOUND, http_status: 404, message: "Shift plan not found", triggered_by: "unknown {id} on /shift-plans/{id} or unknown shift_plan_id filter" }
  - { error_id: ERR_BUILD_SLOT_NOT_FOUND, http_status: 404, message: "Build slot not found", triggered_by: "unknown {id} on a /build-slots path or unknown build_slot_id filter" }
  - { error_id: ERR_PRODUCTION_UNIT_NOT_FOUND, http_status: 404, message: "Production unit not found", triggered_by: "unknown {id} on a /production-units path or unknown production_unit_id in a body" }
  - { error_id: ERR_ENGINEERING_CHANGE_NOT_FOUND, http_status: 404, message: "Engineering change not found", triggered_by: "unknown {id} on an /engineering-changes path or unknown created_by_change_id / engineering_change_id filter" }
  - { error_id: ERR_WARRANTY_RETURN_NOT_FOUND, http_status: 404, message: "Warranty return not found", triggered_by: "unknown {id} on a /warranty-returns path or unknown source_warranty_return_id filter" }

  # --- state / uniqueness -------------------------------------------------
  - { error_id: ERR_INVALID_STATE, http_status: 409, message: "Entity is not in a state that allows this transition", triggered_by: "any action endpoint whose (from-state, trigger) pair is absent from §1.2, including ship on a unit that is not CERTIFIED and certify without both an ENERGY and a WATER test" }
  - { error_id: ERR_DUPLICATE_CODE, http_status: 409, message: "Code already in use", triggered_by: "duplicate line_code, model_code, supplier_code, part_number, or duplicate station_code / position_index within a line" }

  # --- quality gates ------------------------------------------------------
  - { error_id: ERR_TEST_NOT_APPLICABLE, http_status: 422, message: "This test type does not apply to the unit's model variant", triggered_by: "LEAK test on a variant with requires_leak_test false, or WATER test on a variant with no water_liters_limit" }
  - { error_id: ERR_QUALITY_GATE_ORDER, http_status: 409, message: "Quality gates must be completed in order", triggered_by: "LEAK or FUNCTIONAL_CYCLE before an ELECTRICAL_SAFETY pass, or ENERGY / WATER before quality_status GATED" }
  - { error_id: ERR_UNIT_QUARANTINED, http_status: 409, message: "Unit is quarantined", triggered_by: "complete-assembly, ship, or a new quality test on a unit with quality_status QUARANTINED" }
  - { error_id: ERR_EFFICIENCY_LIMIT_EXCEEDED, http_status: 422, message: "Efficiency index exceeds the certification limit", triggered_by: "POST /production-units/{id}/certify with a CERTIFICATION_AVERAGE index above TIER_B_MAX (1.00)" }

  # --- product / BOM lifecycle -------------------------------------------
  - { error_id: ERR_MODEL_NOT_RELEASED, http_status: 409, message: "Model variant is not in RELEASED status", triggered_by: "slot sequencing, slot release, certification or cut-in against a DRAFT or OBSOLETE variant, or BOM authoring against an OBSOLETE variant (BOM authoring on a DRAFT variant is legitimate)" }
  - { error_id: ERR_BOM_NOT_EFFECTIVE, http_status: 422, message: "No effective BOM resolves for the requested sequence index", triggered_by: "sequencing a slot whose PRODUCTION_EFFECTIVE BOM is empty, cutting in against a position with no ACTIVE line carrying the affected part, or naming a root_cause_part_id absent from the unit's HISTORICAL_AS_BUILT BOM" }
  - { error_id: ERR_PART_CHANGE_PENDING, http_status: 409, message: "A part on the effective BOM is not available for production", triggered_by: "sequencing while a BOM part is CHANGE_PENDING or OBSOLETE, or authoring a BOM line against an OBSOLETE part" }
  - { error_id: ERR_LINE_NOT_STOPPED, http_status: 409, message: "Line must be stopped to cut in an engineering change", triggered_by: "POST /engineering-changes/{id}/cut-in while the target line's posture is OPEN or CONSTRAINED" }
  - { error_id: ERR_CUT_IN_INDEX_TOO_LOW, http_status: 422, message: "Cut-in sequence index must be ahead of released production", triggered_by: "cut_in_sequence_index <= Line.max_released_sequence_index" }
  - { error_id: ERR_REPLACEMENT_PART_REQUIRED, http_status: 422, message: "A replacement part is required to cut in this change", triggered_by: "cut-in with no stored and no supplied replacement_part_id, or a replacement equal to affected_part_id" }
  - { error_id: ERR_SERVICE_OBLIGATION_ACTIVE, http_status: 409, message: "Service part supply obligation has not elapsed", triggered_by: "POST /parts/{id}/obsolete while the logical clock is at or before service_obligation_until" }
  - { error_id: ERR_CHANGEOVER_REQUIRED, http_status: 409, message: "Line is tooled for a different product family", triggered_by: "POST /build-slots/{id}/release when ModelVariant.family_code != Line.current_family_code" }

  # --- scheduling / capacity ---------------------------------------------
  - { error_id: ERR_DOCK_WINDOW_CONFLICT, http_status: 409, message: "Delivery window conflicts with another call at this station", triggered_by: "a new call whose DOCK_BUFFER_MINUTES-padded window intersects a live call's window at the same station" }
  - { error_id: ERR_SHIFT_WINDOW_OVERLAP, http_status: 409, message: "Shift window overlaps an active plan on this line", triggered_by: "a new plan whose [shift_start, shift_end + overtime_minutes) intersects another ACTIVE plan's effective window" }
  - { error_id: ERR_NO_SHIFT_COVERAGE, http_status: 422, message: "No active shift plan covers the requested instant", triggered_by: "sequencing a slot whose planned_start falls outside every ACTIVE plan, or a changeover start outside every ACTIVE plan" }
  - { error_id: ERR_SEQUENCE_INDEX_TAKEN, http_status: 409, message: "Sequence index is already taken on this line", triggered_by: "POST /build-slots with a sequence_index held by a PLANNED, SEQUENCED, RELEASED or BUILT slot" }
  - { error_id: ERR_LINE_POSTURE_BLOCKED, http_status: 409, message: "Line posture does not allow this operation", triggered_by: "sequencing while posture is STOPPED, or releasing while posture is CONSTRAINED or STOPPED" }
  - { error_id: ERR_SUPPLIER_NOT_APPROVED, http_status: 409, message: "Supplier is not approved", triggered_by: "sequencing a slot whose sequenced-module supplier is on PROBATION or SUSPENDED, or booking a call for a SUSPENDED supplier" }
  - { error_id: ERR_SYNC_DELIVERY_MISSING, http_status: 422, message: "No synchronous delivery covers a sequenced module", triggered_by: "sequencing a slot whose effective BOM contains an is_sequenced_module part with no covering DeliveryCall" }
  - { error_id: ERR_OPTION_LOAD_WINDOW_EXCEEDED, http_status: 422, message: "Option content exceeds the rolling window cap", triggered_by: "sequencing a slot that pushes any 5-slot window above calculations.option_load_window_cap" }
  - { error_id: ERR_PRESENTATION_SLOTS_EXHAUSTED, http_status: 422, message: "Line-side presentation slots are exhausted at a station", triggered_by: "sequencing whose waterfall allocation exceeds a station's presentation_slot_capacity" }
  - { error_id: ERR_LABOR_CAPACITY_EXCEEDED, http_status: 422, message: "Shift labour capacity exceeded", triggered_by: "sequencing whose recomputed committed_labor_minutes exceeds the plan's available_labor_minutes" }

# =============================================================================
# §1.7 RBAC Matrix (role_model: segregation_of_duties)
# =============================================================================
roles:

  - name: PlantAdmin
    user_id_semantics: opaque
    description: "Master-data owner: lines, stations, model variants, suppliers, parts. Can also drive line stop/start and planner operations for setup, but never records tests, decides changes or analyses returns."
    exclusive_operations:
      - "POST /lines"
      - "POST /stations"
      - "POST /model-variants"
      - "POST /model-variants/{id}/release"
      - "POST /model-variants/{id}/obsolete"
      - "POST /suppliers"
      - "POST /parts"
      - "POST /parts/{id}/obsolete"
    shared_operations:
      - "POST /lines/{id}/stop, POST /lines/{id}/start (with LineOperator)"
      - "POST /lines/{id}/run-checkpoint, POST /delivery-calls, POST /delivery-calls/{id}/cancel, POST /shift-plans, POST /build-slots (with ProductionPlanner)"
      - "POST /bom-lines (with EngineeringLead)"
      - "all GET reads except the SupplierPortal-only scoping"

  - name: ProductionPlanner
    user_id_semantics: opaque
    description: "Owns sequencing, dock call-offs and shift staffing."
    exclusive_operations:
      - "POST /build-slots/{id}/sequence"
      - "POST /build-slots/{id}/de-sequence"
    shared_operations:
      - "POST /delivery-calls, POST /delivery-calls/{id}/cancel, POST /shift-plans, POST /build-slots, POST /lines/{id}/run-checkpoint (with PlantAdmin)"
      - "reads of lines, stations, variants, parts, BOM lines, calls, plans, slots, units and changes"

  - name: LineOperator
    user_id_semantics: opaque
    description: "Runs the line: stop/start with changeover, slot release, assembly completion and shipping."
    exclusive_operations:
      - "POST /build-slots/{id}/release"
      - "POST /production-units/{id}/complete-assembly"
      - "POST /production-units/{id}/ship"
    shared_operations:
      - "POST /lines/{id}/stop, POST /lines/{id}/start (with PlantAdmin)"
      - "reads of lines, stations, variants, parts, BOM lines, calls, plans, slots and units"

  - name: QualityInspector
    user_id_semantics: opaque
    description: "Owns the quality gates, quarantine release and efficiency certification."
    exclusive_operations:
      - "POST /production-units/{id}/quality-tests"
      - "POST /production-units/{id}/clear-quarantine"
      - "POST /production-units/{id}/certify"
    shared_operations:
      - "reads of units, quality tests, variants, BOM lines, changes and returns"

  - name: EngineeringLead
    user_id_semantics: opaque
    description: "Authors BOM lines and drives the engineering-change lifecycle. SEGREGATION OF DUTIES: X-User-ID is recorded as submitted_by_user_id on submit and must differ from the deciding X-User-ID."
    exclusive_operations:
      - "POST /engineering-changes"
      - "POST /engineering-changes/{id}/submit"
      - "POST /engineering-changes/{id}/start-review"
      - "POST /engineering-changes/{id}/decide"
      - "POST /engineering-changes/{id}/cut-in"
    shared_operations:
      - "POST /bom-lines (with PlantAdmin)"
      - "reads of lines, stations, variants, parts, warranty metrics, BOM lines, calls, plans, slots, units, quality tests, changes and returns"

  - name: WarrantyAnalyst
    user_id_semantics: opaque
    description: "Owns field-failure analytics: return intake, teardown, disposition, design feedback and withdrawal."
    exclusive_operations:
      - "POST /warranty-returns"
      - "POST /warranty-returns/{id}/teardown"
      - "POST /warranty-returns/{id}/analyze"
      - "POST /warranty-returns/{id}/close"
      - "POST /warranty-returns/{id}/withdraw"
    shared_operations:
      - "GET /parts/{id}/warranty-metrics (with PlantAdmin and EngineeringLead)"
      - "reads of parts, units, quality tests, BOM lines, variants, changes and returns"

  - name: SupplierPortal
    user_id_semantics: "entity_backed:Supplier"
    description: "External supplier user. X-User-ID IS the Supplier.id; every read and write is scoped to that supplier (ERR_SUPPLIER_SCOPE_VIOLATION otherwise)."
    exclusive_operations:
      - "POST /delivery-calls/{id}/record-arrival"
    shared_operations:
      - "GET /suppliers/{id} (own row only)"
      - "GET /delivery-calls, GET /delivery-calls/{id} (own calls only)"
      - "GET /parts (own supplier_id only)"
