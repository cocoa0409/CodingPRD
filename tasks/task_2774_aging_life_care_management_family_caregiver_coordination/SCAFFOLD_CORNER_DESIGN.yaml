      - name: care_manager_cannot_ratify_decisions_and_supervisor_cannot_author_them
        claim_type: other_roles_exclusive_operations_forbidden
        grounds:
          - roles[CareManager].forbidden_operations
          - roles[PracticeSupervisor].exclusive_operations
          - roles[PracticeSupervisor].forbidden_operations
          - validations[priority 2].ERR_UNAUTHORIZED
        distinguishing_aspect: "Both roles are backed by the same CareManager entity, yet authorship (POST decisions, POST time-entries) is CareManager-only and ratification (PATCH decision state) is PracticeSupervisor-only, so each role is refused the other's exclusive operation on the very rows it can otherwise read."
