              captures: { cc_id: $.data.id }
            - call: "POST /casting-calls"
              payload: { casting_director_id: "${cd_id}", title: "Lead", media_type: "DIGITAL", usage_term_months: 6, shoot_start_date: "2026-05-01T00:00:00Z", shoot_end_date: "2026-05-02T00:00:00Z", offered_day_rate_cents: 120000 }
              as: CastingDirector
              as_user_id: "${cd_id}"
              captures: { call_id: $.data.id }
            - call: "POST /submissions"
              payload: { casting_call_id: "${call_id}", talent_id: "${talent_id}", comp_card_id: "${cc_id}" }
              as: Agent
              captures: { sub_id: $.data.id }
            - call: "POST /audition-slots"
              payload: { submission_id: "${sub_id}", casting_director_id: "${cd_id}", slot_kind: "AUDITION", start_at: "2026-04-10T10:00:00Z", end_at: "2026-04-10T10:30:00Z" }
              as: CastingDirector
              as_user_id: "${cd_id}"
              captures: { slot_id: $.data.id }
          trigger:
            - call: "POST /audition-slots/${slot_id}/complete"
              payload: {}
              as: CastingDirector
              as_user_id: "${cd_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_SLOT_NOT_ENDED"

      - name: callback_requires_completed_audition
        claim_type: guarded transitions
        grounds:
          - state_machines.Submission.AUDITION_SCHEDULED_to_CALLBACK_SCHEDULED
          - errors[ERR_AUDITION_NOT_COMPLETED]
        distinguishing_aspect: "Creating a CALLBACK slot for a submission whose AUDITION slot is still SCHEDULED (not COMPLETED) returns ERR_AUDITION_NOT_COMPLETED (409)."
