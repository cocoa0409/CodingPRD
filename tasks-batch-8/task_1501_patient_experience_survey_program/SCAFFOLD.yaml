# =============================================================================
# SCAFFOLD — Patient Experience Survey Program (HCAHPS)
# §1.0–§1.7 seed tables. §1.8 lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml;
# §1.9 lives in SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  Patient Experience Survey Program (HCAHPS): sampling protocol & vendor administration mode, exclusion criteria & eligible discharge identification, response rate & top-box score calculation, unit/provider-level reporting with attribution, star rating & value-based purchasing impact modeling, improvement initiative tracking, comment routing & service recovery, survey mode transition analysis

domain_name: patient-experience-survey
api_prefix: /api

complexity_profile:
  primary_archetype: posture_driven_gating      # SurveyCycle posture gates every child operation
  secondary_archetype: compliance_audit          # CMS-style regulatory reporting: exclusion audit trail, publication locks, adjudication
  complexity_layers:
    - derived_field_reconciliation               # cycle counters/rates recomputed on every case+response mutation
    - dual_variant_calculation                   # RAW vs MODE_ADJUSTED top-box; PINNED vs ROLLING initiative baseline
    - ops_run_checkpoint                         # cycle lifecycle (open-sampling ... publish) advances the reporting epoch
    - rate_threshold_triggers                    # star breakpoints, publication thresholds, SLA boundary
  entity_topology: flat                          # all collections under /api; FK references in bodies
  state_machine_shape: cyclic                    # cycle reopen loop, initiative replan loop, response adjudication branches
  relationship_patterns:
    - one_to_many
    - cross_aggregate                            # SampleCase -> Discharge/Vendor; Ticket -> Response; Initiative -> Cycle x2
  role_model: peer_roles                         # ProgramAdmin / DataSteward / VendorOperator / UnitManager own disjoint surfaces
  consistency_model: immediate                   # every mutation's side effects + derived fields visible in same response
  difficulty_target: expert
  rationale: |
    10 entities, 55 endpoints: the scenario mandates eight distinct feature areas
    (sampling, exclusion, scoring, attribution, star/VBP, initiatives, comments,
    mode transition). Density comes from posture gating + derived-field coupling,
    not entity sprawl.

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: SurveyProgram
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: name, type: string, source: input, description: "Program (hospital) name" }
      - { name: sampling_protocol, type: enum, source: input, description: "SIMPLE_RANDOM | STRATIFIED_BY_UNIT | CENSUS — sampling protocol declared to CMS" }
      - { name: admin_mode, type: enum, source: input, description: "MAIL_ONLY | PHONE_ONLY | MIXED_MODE — vendor administration mode; constrains SampleCase.mode_assigned" }
      - { name: active_vendor_id, type: string, source: computed, description: "id of the currently ACTIVE SurveyVendor for this program; null when none. Informational pointer (not an FK constraint)." , default: null }

  - name: SurveyVendor
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> SurveyProgram.id" }
      - { name: name, type: string, source: input, description: "Vendor name" }
      - { name: cycle_budget_cents, type: integer, source: input, description: "Per-cycle administration budget (>= 0)" }
      - { name: cycle_budget_remaining_cents, type: integer, source: computed, description: "= cycle_budget_cents - SUM(postage_cost_cents of SampleCase with vendor_id = this.id AND billing_status = CHARGED). Recomputed on every charge/credit." }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED | SUPERSEDED", default: ACTIVE }
      - { name: superseded_at, type: datetime, source: system, description: "Logical-clock timestamp when this vendor was superseded; null otherwise", default: null }

  - name: SurveyCycle
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> SurveyProgram.id" }
      - { name: label, type: string, source: input, description: "Human label, e.g. 2026-Q3" }
      - { name: cycle_index, type: integer, source: input, description: "Monotonic quarter index, unique per program; used for initiative window arithmetic" }
      - { name: discharge_window_start, type: string, source: input, description: "ISO date; discharges sampled only if discharge_date in [start, end] inclusive" }
      - { name: discharge_window_end, type: string, source: input, description: "ISO date (inclusive)" }
      - { name: fielding_start_date, type: string, source: input, description: "ISO date; fielding window [fielding_start_date, fielding_end_date] is CLOSED — touching dates with another non-VOIDED cycle of the same program conflict" }
      - { name: fielding_end_date, type: string, source: input, description: "ISO date (inclusive). Responses with received_at date > fielding_end_date are late (PENDING_REVIEW)." }
      - { name: target_sample_size, type: integer, source: input, description: "Max SampleCase rows creatable for this cycle (>= 1)" }
      - { name: status, type: enum, source: system, description: "DRAFT | SAMPLING_OPEN | FIELDING | RECONCILIATION | SCORING | PUBLISHED | VOIDED", default: DRAFT }
      - { name: sampled_count, type: integer, source: computed, description: "Count of SampleCase rows of this cycle that ever reached IN_FIELD (snapshot taken at start-fielding)", default: 0 }
      - { name: completed_responses, type: integer, source: computed, description: "Count of SampleCase of this cycle with status = RESPONDED whose response.status IN {ACCEPTED, INCLUDED}. Recomputed on every response/case mutation.", default: 0 }
      - { name: eligible_denominator, type: integer, source: computed, description: "Count of SampleCase of this cycle with status IN {IN_FIELD, RESPONDED, NONRESPONSE} (excludes SAMPLED, UNDELIVERABLE, EXCLUDED_POST_SAMPLE, VOIDED)", default: 0 }
      - { name: response_rate, type: number, source: computed, description: "= round_half_up(100 * completed_responses / eligible_denominator, 2); null when eligible_denominator = 0", default: null }
      - { name: publication_eligible, type: boolean, source: computed, description: "completed_responses >= 25 AND response_rate >= 10.0 (both inclusive)", default: false }
      - { name: scored_raw_composite_pcts, type: object, source: computed, description: "Snapshot at begin-scoring: {nurse_comm, doctor_comm, cleanliness, overall_rating} RAW top-box percentages (2dp)", default: null }
      - { name: scored_adjusted_composite_pcts, type: object, source: computed, description: "Snapshot at begin-scoring: same keys, MODE_ADJUSTED top-box percentages (2dp)", default: null }
      - { name: scored_unit_breakdown, type: array, source: computed, description: "Snapshot at begin-scoring: per-unit entries {unit_id, completed_responses, raw_pcts, adjusted_pcts}", default: null }
      - { name: scored_provider_breakdown, type: array, source: computed, description: "Snapshot at begin-scoring: per-provider entries {provider_id, completed_responses, raw_pcts, adjusted_pcts}", default: null }
      - { name: scored_response_rate, type: number, source: computed, description: "response_rate frozen at begin-scoring", default: null }
      - { name: scored_completed_responses, type: integer, source: computed, description: "completed_responses frozen at begin-scoring", default: null }
      - { name: published_star_rating, type: integer, source: computed, description: "Star rating (1..5) pinned at publish; null until PUBLISHED", default: null }
      - { name: published_at, type: datetime, source: system, description: "Logical-clock timestamp of publish; null until PUBLISHED", default: null }

  - name: CareUnit
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> SurveyProgram.id" }
      - { name: name, type: string, source: input, description: "Unit name" }
      - { name: unit_code, type: string, source: input, description: "Unit code, unique per program" }

  - name: Provider
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> SurveyProgram.id" }
      - { name: full_name, type: string, source: input, description: "Provider name" }
      - { name: npi, type: string, source: input, description: "National Provider Identifier, unique per program" }
      - { name: specialty, type: string, source: input, description: "Specialty label" }

  - name: Discharge
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> SurveyProgram.id" }
      - { name: mrn, type: string, source: input, description: "Medical record number (patient identifier)" }
      - { name: unit_id, type: string, source: input, description: "FK -> CareUnit.id; attributing nursing unit" }
      - { name: provider_id, type: string, source: input, description: "FK -> Provider.id; attending provider for attribution" }
      - { name: admit_date, type: string, source: input, description: "ISO date of admission" }
      - { name: discharge_date, type: string, source: input, description: "ISO date of discharge; must be >= admit_date" }
      - { name: discharge_disposition, type: enum, source: input, description: "HOME | SNF | EXPIRED | PSYCH_FACILITY | REHAB | HOSPICE" }
      - { name: primary_dx_group, type: enum, source: input, description: "MEDICAL | SURGICAL | PSYCHIATRIC | MATERNITY" }
      - { name: payer, type: enum, source: input, description: "MEDICARE | MEDICAID | COMMERCIAL | SELF_PAY" }
      - { name: age_years, type: integer, source: input, description: "Patient age at discharge (>= 0)" }
      - { name: address_country, type: string, source: input, description: "ISO 3166-1 alpha-2 country of mailing address" }
      - { name: no_publicity_flag, type: boolean, source: input, description: "Patient requested no contact" }
      - { name: custody_status, type: enum, source: input, description: "NONE | LAW_ENFORCEMENT" }
      - { name: status, type: enum, source: system, description: "ELIGIBILITY_PENDING | ELIGIBLE | EXCLUDED", default: ELIGIBILITY_PENDING }
      - { name: exclusion_reasons, type: array, source: computed, description: "Subset of {EXPIRED, SNF_DISCHARGE, PSYCH_DISCHARGE, PSYCH_DX, MINOR, NON_US_ADDRESS, NO_PUBLICITY, CUSTODY, SHORT_STAY} per eligible_discharge_evaluation rule", default: [] }

  - name: SampleCase
    parent: null
    common_fields: true
    fields:
      - { name: cycle_id, type: string, source: input, description: "FK -> SurveyCycle.id" }
      - { name: discharge_id, type: string, source: input, description: "FK -> Discharge.id" }
      - { name: vendor_id, type: string, source: system, description: "FK -> SurveyVendor.id; snapshot of program's ACTIVE vendor at creation" }
      - { name: unit_id, type: string, source: system, description: "FK -> CareUnit.id; denormalized from Discharge.unit_id at creation for attribution" }
      - { name: provider_id, type: string, source: system, description: "FK -> Provider.id; denormalized from Discharge.provider_id at creation" }
      - { name: mode_assigned, type: enum, source: input, description: "MAIL | PHONE — must be permitted by program.admin_mode" }
      - { name: postage_cost_cents, type: integer, source: input, description: "Administration cost charged to vendor budget at creation (> 0)" }
      - { name: billing_status, type: enum, source: system, description: "CHARGED | CREDITED — CHARGED at creation; CREDITED on undeliverable, post-sample exclusion, or cycle void", default: CHARGED }
      - { name: status, type: enum, source: system, description: "SAMPLED | IN_FIELD | RESPONDED | NONRESPONSE | UNDELIVERABLE | EXCLUDED_POST_SAMPLE | VOIDED", default: SAMPLED }

  - name: SurveyResponse
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> SampleCase.id" }
      - { name: cycle_id, type: string, source: system, description: "FK -> SurveyCycle.id; denormalized from SampleCase.cycle_id at intake" }
      - { name: mode_used, type: enum, source: input, description: "MAIL | PHONE — mode the response was actually collected in (drives mode adjustment)" }
      - { name: nurse_comm_score, type: integer, source: input, description: "Composite raw score 1..4 (4 = top-box)" }
      - { name: doctor_comm_score, type: integer, source: input, description: "Composite raw score 1..4" }
      - { name: cleanliness_score, type: integer, source: input, description: "Composite raw score 1..4" }
      - { name: overall_rating_score, type: integer, source: input, description: "Overall rating raw score 1..4" }
      - { name: comment_text, type: string, source: input, description: "Free-text comment; required for service-recovery routing", default: null }
      - { name: received_at, type: datetime, source: system, description: "Logical-clock timestamp at intake" }
      - { name: is_late, type: boolean, source: computed, description: "received_at date > cycle.fielding_end_date" }
      - { name: status, type: enum, source: system, description: "ACCEPTED (on-time) | PENDING_REVIEW (late) | INCLUDED (adjudicated in) | EXCLUDED (adjudicated out) | VOIDED" }
      - { name: has_escalated_recovery, type: boolean, source: system, description: "Set true when a ServiceRecoveryTicket referencing this response is ESCALATED (cascade hop from initiative TARGET_MISSED)", default: false }

  - name: ImprovementInitiative
    parent: null
    common_fields: true
    fields:
      - { name: unit_id, type: string, source: input, description: "FK -> CareUnit.id" }
      - { name: program_id, type: string, source: system, description: "FK -> SurveyProgram.id; denormalized from CareUnit.program_id at creation" }
      - { name: domain, type: enum, source: input, description: "NURSE_COMM | DOCTOR_COMM | CLEANLINESS | OVERALL_RATING" }
      - { name: baseline_cycle_id, type: string, source: input, description: "FK -> SurveyCycle.id; must be PUBLISHED at activation" }
      - { name: evaluation_cycle_id, type: string, source: input, description: "FK -> SurveyCycle.id; publish of this cycle triggers evaluation" }
      - { name: target_score, type: number, source: input, description: "Target adjusted top-box pct for unit+domain (0..100, <= 2dp)" }
      - { name: baseline_score, type: number, source: computed, description: "Unit's published adjusted top-box pct for domain from baseline cycle, PINNED at activate", default: null }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | UNDER_EVALUATION | TARGET_MET | TARGET_MISSED | CANCELLED", default: DRAFT }
      - { name: progress_pinned, type: number, source: computed, description: "Variant PINNED_BASELINE: round_half_up(unit adjusted pct in evaluation cycle - baseline_score, 2); null until evaluation cycle PUBLISHED", default: null }
      - { name: progress_rolling, type: number, source: computed, description: "Variant ROLLING_BASELINE: round_half_up(unit adjusted pct in evaluation cycle - rolling_baseline, 2); null until evaluation cycle PUBLISHED or no published prior cycle", default: null }
      - { name: achieved_at, type: datetime, source: system, description: "Logical-clock timestamp when TARGET_MET; null otherwise", default: null }

  - name: ServiceRecoveryTicket
    parent: null
    common_fields: true
    fields:
      - { name: unit_id, type: string, source: input, description: "FK -> CareUnit.id; routing target — must equal X-User-ID for UnitManager and the response's attributed unit" }
      - { name: program_id, type: string, source: system, description: "FK -> SurveyProgram.id; denormalized from CareUnit.program_id" }
      - { name: response_id, type: string, source: input, description: "FK -> SurveyResponse.id; the routed comment's source" }
      - { name: domain, type: enum, source: input, description: "NURSE_COMM | DOCTOR_COMM | CLEANLINESS | OVERALL_RATING" }
      - { name: priority, type: enum, source: input, description: "LOW | MEDIUM | HIGH" }
      - { name: status, type: enum, source: system, description: "OPEN | ACKNOWLEDGED | ESCALATED | RESOLVED", default: OPEN }
      - { name: acknowledged_at, type: datetime, source: system, description: "Logical-clock timestamp of acknowledge; null until ACKNOWLEDGED", default: null }
      - { name: acknowledged_within_sla, type: boolean, source: computed, description: "acknowledged_at - created_at <= 48h; null until ACKNOWLEDGED", default: null }
      - { name: resolution_note, type: string, source: input, description: "Resolution note supplied at resolve; null until RESOLVED", default: null }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: SurveyCycle
    initial_state: DRAFT
    terminal_states: [PUBLISHED, VOIDED]
    transitions:
      - from: DRAFT
        to: SAMPLING_OPEN
        trigger: "POST /api/cycles/{cycleId}/open-sampling"
        actor: ProgramAdmin
        preconditions:
          - "Cycle in DRAFT (ERR_INVALID_STATE)"
          - "cycle.program_id has a SurveyVendor with status = ACTIVE (ERR_NO_ACTIVE_VENDOR)"
        side_effects: []
      - from: SAMPLING_OPEN
        to: FIELDING
        trigger: "POST /api/cycles/{cycleId}/start-fielding"
        actor: ProgramAdmin
        preconditions:
          - "Cycle in SAMPLING_OPEN (ERR_CYCLE_NOT_SAMPLING_OPEN)"
          - "At least 1 SampleCase of this cycle has status = SAMPLED (ERR_NO_CASES_SAMPLED)"
        side_effects:
          - "Every SampleCase of this cycle with status = SAMPLED transitions to IN_FIELD"
          - "cycle.sampled_count := count of cases transitioned to IN_FIELD"
      - from: FIELDING
        to: RECONCILIATION
        trigger: "POST /api/cycles/{cycleId}/close-fielding"
        actor: ProgramAdmin
        preconditions:
          - "Cycle in FIELDING (ERR_CYCLE_NOT_FIELDING)"
          - "Logical clock date >= cycle.fielding_end_date (ERR_FIELDING_WINDOW_NOT_CLOSED)"
        side_effects:
          - "Every SampleCase with status = IN_FIELD transitions to NONRESPONSE"
      - from: RECONCILIATION
        to: FIELDING
        trigger: "POST /api/cycles/{cycleId}/reopen-fielding"
        actor: ProgramAdmin
        preconditions:
          - "Cycle in RECONCILIATION (ERR_CYCLE_NOT_RECONCILING)"
          - "Logical clock date <= cycle.fielding_end_date (ERR_REOPEN_WINDOW_EXPIRED)"
        side_effects:
          - "Every SampleCase with status = NONRESPONSE transitions back to IN_FIELD (cyclic loop FIELDING -> RECONCILIATION -> FIELDING)"
      - from: RECONCILIATION
        to: SCORING
        trigger: "POST /api/cycles/{cycleId}/begin-scoring"
        actor: ProgramAdmin
        preconditions:
          - "Cycle in RECONCILIATION (ERR_CYCLE_NOT_RECONCILING)"
          - "No SurveyResponse with cycle_id = cycle.id has status = PENDING_REVIEW (ERR_UNADJUDICATED_RESPONSES)"
        side_effects:
          - "Compute and store scored_raw_composite_pcts and scored_adjusted_composite_pcts per top_box_composite_scores"
          - "Compute and store scored_unit_breakdown and scored_provider_breakdown (attribution by SampleCase.unit_id / provider_id)"
          - "Freeze scored_response_rate and scored_completed_responses from live counters"
      - from: SCORING
        to: PUBLISHED
        trigger: "POST /api/cycles/{cycleId}/publish"
        actor: ProgramAdmin
        preconditions:
          - "Cycle in SCORING (ERR_CYCLE_NOT_SCORED)"
          - "scored_completed_responses >= 25 AND scored_response_rate >= 10.0, both inclusive (ERR_BELOW_PUBLICATION_THRESHOLD)"
        side_effects:
          - "published_star_rating := star_rating(stored inputs); published_at := logical clock"
          - "CASCADE hop B: every ImprovementInitiative with evaluation_cycle_id = cycle.id AND status = ACTIVE transitions to UNDER_EVALUATION, then immediately branches to TARGET_MET or TARGET_MISSED per initiative_evaluation"
          - "CASCADE hop C: for each initiative that landed TARGET_MISSED, every ServiceRecoveryTicket with unit_id = initiative.unit_id AND domain = initiative.domain AND status = OPEN transitions to ESCALATED"
          - "CASCADE hop D: for each ticket escalated by hop C, its linked SurveyResponse.has_escalated_recovery := true"
      - from: DRAFT
        to: VOIDED
        trigger: "POST /api/cycles/{cycleId}/void"
        actor: ProgramAdmin
        preconditions: ["Cycle not PUBLISHED and not already VOIDED (ERR_INVALID_STATE)"]
        side_effects: ["Void compensation — see shared void side effects"]
      - from: SAMPLING_OPEN
        to: VOIDED
        trigger: "POST /api/cycles/{cycleId}/void"
        actor: ProgramAdmin
        preconditions: ["Cycle not PUBLISHED and not already VOIDED (ERR_INVALID_STATE)"]
        side_effects: ["Void compensation — see shared void side effects"]
      - from: FIELDING
        to: VOIDED
        trigger: "POST /api/cycles/{cycleId}/void"
        actor: ProgramAdmin
        preconditions: ["Cycle not PUBLISHED and not already VOIDED (ERR_INVALID_STATE)"]
        side_effects: ["Void compensation — see shared void side effects"]
      - from: RECONCILIATION
        to: VOIDED
        trigger: "POST /api/cycles/{cycleId}/void"
        actor: ProgramAdmin
        preconditions: ["Cycle not PUBLISHED and not already VOIDED (ERR_INVALID_STATE)"]
        side_effects: ["Void compensation — see shared void side effects"]
      - from: SCORING
        to: VOIDED
        trigger: "POST /api/cycles/{cycleId}/void"
        actor: ProgramAdmin
        preconditions: ["Cycle not PUBLISHED and not already VOIDED (ERR_INVALID_STATE)"]
        side_effects: ["Void compensation — see shared void side effects"]
        note: "Shared void side effects: every SampleCase of this cycle with status IN {SAMPLED, IN_FIELD, NONRESPONSE, UNDELIVERABLE} -> VOIDED; each such case with billing_status = CHARGED flips to CREDITED and vendor.cycle_budget_remaining_cents += case.postage_cost_cents (vendor_budget_reconciliation invariant); every SurveyResponse of this cycle with status IN {ACCEPTED, PENDING_REVIEW, INCLUDED} -> VOIDED; cycle counters recomputed."

  - entity: SampleCase
    initial_state: SAMPLED
    terminal_states: [EXCLUDED_POST_SAMPLE, VOIDED, UNDELIVERABLE]
    transitions:
      - from: SAMPLED
        to: IN_FIELD
        trigger: "system (cycle start-fielding)"
        actor: system
        preconditions: ["Parent cycle transition SAMPLING_OPEN -> FIELDING succeeded"]
        side_effects: ["cycle counters recomputed (eligible_denominator now includes this case)"]
      - from: IN_FIELD
        to: RESPONDED
        trigger: "system (POST /api/responses or /api/responses/import intake for this case)"
        actor: system
        preconditions: ["Intake validations passed (case IN_FIELD, cycle FIELDING, no live response)"]
        side_effects: ["cycle.completed_responses recomputed per completed_responses_reconciliation"]
      - from: IN_FIELD
        to: NONRESPONSE
        trigger: "system (cycle close-fielding)"
        actor: system
        preconditions: []
        side_effects: []
      - from: NONRESPONSE
        to: IN_FIELD
        trigger: "system (cycle reopen-fielding)"
        actor: system
        preconditions: []
        side_effects: []
      - from: IN_FIELD
        to: UNDELIVERABLE
        trigger: "POST /api/sample-cases/{caseId}/mark-undeliverable"
        actor: VendorOperator
        preconditions:
          - "Case in IN_FIELD (ERR_CASE_NOT_IN_FIELD)"
          - "Parent cycle in FIELDING (ERR_CYCLE_NOT_FIELDING)"
          - "X-User-ID == case.vendor_id (ERR_VENDOR_CASE_MISMATCH)"
        side_effects:
          - "billing_status CHARGED -> CREDITED; vendor.cycle_budget_remaining_cents += case.postage_cost_cents (compensating credit, vendor_budget_reconciliation)"
          - "cycle eligible_denominator / response_rate recomputed"
      - from: SAMPLED
        to: EXCLUDED_POST_SAMPLE
        trigger: "system (linked Discharge re-evaluated to EXCLUDED)"
        actor: system
        preconditions: []
        side_effects: ["billing_status CHARGED -> CREDITED; vendor.cycle_budget_remaining_cents += case.postage_cost_cents"]
      - from: IN_FIELD
        to: EXCLUDED_POST_SAMPLE
        trigger: "system (linked Discharge re-evaluated to EXCLUDED)"
        actor: system
        preconditions: []
        side_effects:
          - "billing_status CHARGED -> CREDITED; vendor.cycle_budget_remaining_cents += case.postage_cost_cents"
          - "cycle eligible_denominator / response_rate recomputed"
      - from: SAMPLED
        to: VOIDED
        trigger: "system (cycle void)"
        actor: system
        preconditions: []
        side_effects: ["billing_status CHARGED -> CREDITED; vendor credit"]
      - from: IN_FIELD
        to: VOIDED
        trigger: "system (cycle void)"
        actor: system
        preconditions: []
        side_effects: ["billing_status CHARGED -> CREDITED; vendor credit"]
      - from: NONRESPONSE
        to: VOIDED
        trigger: "system (cycle void)"
        actor: system
        preconditions: []
        side_effects: ["billing_status CHARGED -> CREDITED; vendor credit"]
      - from: UNDELIVERABLE
        to: VOIDED
        trigger: "system (cycle void)"
        actor: system
        preconditions: []
        side_effects: ["billing_status already CREDITED; no budget movement"]

  - entity: SurveyResponse
    initial_state: ACCEPTED
    terminal_states: [INCLUDED, EXCLUDED, VOIDED]
    transitions:
      - from: ACCEPTED
        to: VOIDED
        trigger: "POST /api/responses/{responseId}/void"
        actor: DataSteward
        preconditions:
          - "Response in ACCEPTED (ERR_RESPONSE_NOT_VOIDABLE)"
          - "Response's cycle in FIELDING or RECONCILIATION (ERR_CYCLE_LOCKED)"
        side_effects:
          - "cycle.completed_responses recomputed (decrement) per completed_responses_reconciliation — compensating action of intake"
      - from: PENDING_REVIEW
        to: INCLUDED
        trigger: "POST /api/responses/{responseId}/adjudicate {decision: INCLUDE}"
        actor: DataSteward
        preconditions:
          - "Response in PENDING_REVIEW (ERR_RESPONSE_NOT_PENDING_REVIEW)"
          - "Response's cycle in RECONCILIATION (ERR_CYCLE_NOT_RECONCILING)"
        side_effects: ["cycle.completed_responses recomputed (increment)"]
      - from: PENDING_REVIEW
        to: EXCLUDED
        trigger: "POST /api/responses/{responseId}/adjudicate {decision: EXCLUDE}"
        actor: DataSteward
        preconditions:
          - "Response in PENDING_REVIEW (ERR_RESPONSE_NOT_PENDING_REVIEW)"
          - "Response's cycle in RECONCILIATION (ERR_CYCLE_NOT_RECONCILING)"
        side_effects: []
        note: "Initial state is ACCEPTED for on-time intake, PENDING_REVIEW for late intake (is_late = true). Both are creation-time states."

  - entity: Discharge
    initial_state: ELIGIBILITY_PENDING
    terminal_states: []
    transitions:
      - from: ELIGIBILITY_PENDING
        to: ELIGIBLE
        trigger: "POST /api/discharges/{dischargeId}/evaluate (or auto-evaluate inside /api/discharges/import)"
        actor: DataSteward
        preconditions: ["eligible_discharge_evaluation yields empty exclusion_reasons"]
        side_effects: []
      - from: ELIGIBILITY_PENDING
        to: EXCLUDED
        trigger: "POST /api/discharges/{dischargeId}/evaluate (or auto-evaluate inside import)"
        actor: DataSteward
        preconditions: ["eligible_discharge_evaluation yields non-empty exclusion_reasons"]
        side_effects: []
      - from: ELIGIBLE
        to: EXCLUDED
        trigger: "POST /api/discharges/{dischargeId}/evaluate with corrected override fields"
        actor: DataSteward
        preconditions:
          - "No linked SampleCase with status == RESPONDED when overrides are supplied (ERR_DISCHARGE_LOCKED_BY_SAMPLE)"
          - "Re-evaluation yields non-empty exclusion_reasons"
        side_effects:
          - "CASCADE hop B: every linked SampleCase with status IN {SAMPLED, IN_FIELD} -> EXCLUDED_POST_SAMPLE"
          - "CASCADE hop C: for each such case with billing_status = CHARGED: billing -> CREDITED and vendor.cycle_budget_remaining_cents += postage_cost_cents; cycle counters recomputed"
      - from: EXCLUDED
        to: ELIGIBLE
        trigger: "POST /api/discharges/{dischargeId}/evaluate with corrected override fields"
        actor: DataSteward
        preconditions:
          - "No linked SampleCase with status == RESPONDED when overrides are supplied (ERR_DISCHARGE_LOCKED_BY_SAMPLE)"
          - "Re-evaluation yields empty exclusion_reasons"
        side_effects: []
        note: "Reinstatement does NOT resurrect an already EXCLUDED_POST_SAMPLE case; exclusion is one-way."

  - entity: SurveyVendor
    initial_state: ACTIVE
    terminal_states: [SUPERSEDED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /api/vendors/{vendorId}/suspend"
        actor: ProgramAdmin
        preconditions: ["Vendor in ACTIVE (ERR_INVALID_STATE)"]
        side_effects: ["program.active_vendor_id recomputed (null if this was the only ACTIVE vendor)"]
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system (POST /api/vendors creating a new vendor for the same program)"
        actor: system
        preconditions: []
        side_effects: ["superseded_at := logical clock; program.active_vendor_id := new vendor id"]

  - entity: ImprovementInitiative
    initial_state: DRAFT
    terminal_states: [TARGET_MET, CANCELLED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /api/initiatives/{initiativeId}/activate"
        actor: ProgramAdmin
        preconditions:
          - "Initiative in DRAFT (ERR_INVALID_STATE)"
          - "baseline_cycle_id cycle is PUBLISHED (ERR_BASELINE_CYCLE_NOT_PUBLISHED)"
          - "evaluation_cycle_id cycle belongs to the same program as the unit (ERR_CROSS_PROGRAM_REFERENCE)"
          - "evaluation_cycle.status != VOIDED AND evaluation_cycle.cycle_index > baseline_cycle.cycle_index (ERR_INVALID_EVALUATION_CYCLE)"
          - "Window (baseline_index, evaluation_index] half-open does not intersect any other initiative with same (unit_id, domain) and status IN {ACTIVE, UNDER_EVALUATION, TARGET_MISSED} (ERR_INITIATIVE_WINDOW_OVERLAP); adjacency (a.evaluation_index == b.baseline_index) is permitted"
        side_effects:
          - "baseline_score := unit's published adjusted top-box pct for domain from baseline cycle's scored_unit_breakdown (version-pinned at activation)"
      - from: ACTIVE
        to: UNDER_EVALUATION
        trigger: "system (publish of cycle with id = evaluation_cycle_id)"
        actor: system
        preconditions: []
        side_effects: []
      - from: UNDER_EVALUATION
        to: TARGET_MET
        trigger: "system (same publish checkpoint, branch per initiative_evaluation)"
        actor: system
        preconditions: ["unit's published adjusted pct for domain in evaluation cycle >= target_score (inclusive)"]
        side_effects: ["achieved_at := logical clock"]
      - from: UNDER_EVALUATION
        to: TARGET_MISSED
        trigger: "system (same publish checkpoint, branch per initiative_evaluation)"
        actor: system
        preconditions: ["unit's published adjusted pct for domain in evaluation cycle < target_score"]
        side_effects:
          - "Every ServiceRecoveryTicket with unit_id = initiative.unit_id AND domain = initiative.domain AND status = OPEN -> ESCALATED"
          - "Each escalated ticket's linked SurveyResponse.has_escalated_recovery := true"
      - from: TARGET_MISSED
        to: ACTIVE
        trigger: "POST /api/initiatives/{initiativeId}/replan"
        actor: ProgramAdmin
        preconditions:
          - "Initiative in TARGET_MISSED (ERR_INVALID_STATE)"
          - "New evaluation_cycle_id cycle not VOIDED, same program (ERR_CROSS_PROGRAM_REFERENCE), cycle_index > baseline cycle_index (ERR_INVALID_EVALUATION_CYCLE)"
          - "Half-open window overlap re-checked against ACTIVE/UNDER_EVALUATION/TARGET_MISSED peers (ERR_INITIATIVE_WINDOW_OVERLAP)"
        side_effects: ["evaluation_cycle_id and target_score replaced; progress_pinned/progress_rolling reset to null; baseline_score unchanged (replan loop TARGET_MISSED -> ACTIVE)"]
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /api/initiatives/{initiativeId}/cancel"
        actor: ProgramAdmin
        preconditions: ["Status IN {DRAFT, ACTIVE, TARGET_MISSED} (ERR_INVALID_STATE)"]
        side_effects: []
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /api/initiatives/{initiativeId}/cancel"
        actor: ProgramAdmin
        preconditions: ["Status IN {DRAFT, ACTIVE, TARGET_MISSED} (ERR_INVALID_STATE)"]
        side_effects: []
      - from: TARGET_MISSED
        to: CANCELLED
        trigger: "POST /api/initiatives/{initiativeId}/cancel"
        actor: ProgramAdmin
        preconditions: ["Status IN {DRAFT, ACTIVE, TARGET_MISSED} (ERR_INVALID_STATE)"]
        side_effects: []

  - entity: ServiceRecoveryTicket
    initial_state: OPEN
    terminal_states: [RESOLVED]
    transitions:
      - from: OPEN
        to: ACKNOWLEDGED
        trigger: "POST /api/service-recovery-tickets/{ticketId}/acknowledge"
        actor: UnitManager
        preconditions:
          - "Ticket in OPEN or ESCALATED (ERR_TICKET_NOT_ACKNOWLEDGEABLE)"
          - "X-User-ID == ticket.unit_id (ERR_UNIT_ACCESS_DENIED)"
        side_effects: ["acknowledged_at := logical clock; acknowledged_within_sla := service_recovery_sla(created_at, acknowledged_at)"]
      - from: ESCALATED
        to: ACKNOWLEDGED
        trigger: "POST /api/service-recovery-tickets/{ticketId}/acknowledge"
        actor: UnitManager
        preconditions:
          - "Ticket in OPEN or ESCALATED (ERR_TICKET_NOT_ACKNOWLEDGEABLE)"
          - "X-User-ID == ticket.unit_id (ERR_UNIT_ACCESS_DENIED)"
        side_effects: ["acknowledged_at := logical clock; acknowledged_within_sla recomputed"]
      - from: ACKNOWLEDGED
        to: RESOLVED
        trigger: "POST /api/service-recovery-tickets/{ticketId}/resolve"
        actor: UnitManager
        preconditions:
          - "Ticket in ACKNOWLEDGED (ERR_TICKET_NOT_RESOLVABLE)"
          - "X-User-ID == ticket.unit_id (ERR_UNIT_ACCESS_DENIED)"
        side_effects: ["resolution_note stored"]
      - from: OPEN
        to: ESCALATED
        trigger: "system (initiative on same unit+domain landed TARGET_MISSED at publish)"
        actor: system
        preconditions: []
        side_effects: ["linked SurveyResponse.has_escalated_recovery := true"]

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: vendor-create-stale-program
    parent_entity: SurveyProgram
    write_endpoint: "POST /api/vendors"
    occ_field: "expected_program_version"
    description: |
      Creating a SurveyVendor for a program supersedes the program's currently
      ACTIVE vendor (legitimate supersede semantics: vendor administration mode
      change). The request carries expected_program_version — the SurveyProgram
      version the client last observed. If the program's version has advanced
      since (e.g., another vendor creation already superseded the ACTIVE vendor
      and bumped the version), the request is rejected as stale.
    error_id: ERR_STALE_PROGRAM_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: eligible_discharge_evaluation
    trigger: "POST /api/discharges/{id}/evaluate; automatically per item inside POST /api/discharges/import"
    algorithm: rule_evaluation
    formula: |
      reasons = []
      if discharge_disposition == EXPIRED:          reasons += EXPIRED
      if discharge_disposition == SNF:              reasons += SNF_DISCHARGE
      if discharge_disposition == PSYCH_FACILITY:   reasons += PSYCH_DISCHARGE
      if primary_dx_group == PSYCHIATRIC:           reasons += PSYCH_DX
      if age_years < 18:                            reasons += MINOR
      if address_country != "US":                   reasons += NON_US_ADDRESS
      if no_publicity_flag == true:                 reasons += NO_PUBLICITY
      if custody_status == LAW_ENFORCEMENT:         reasons += CUSTODY
      if discharge_date <= admit_date:              reasons += SHORT_STAY   # no overnight stay
      exclusion_reasons := reasons (sorted alphabetically for determinism)
      status := EXCLUDED if reasons non-empty else ELIGIBLE
    input_set: "The single Discharge being evaluated (override fields applied first)"
    precision: "deterministic boolean rules; no rounding"

  - name: response_rate
    trigger: "any SampleCase status mutation or SurveyResponse status mutation within the cycle (immediate recompute)"
    algorithm: aggregation
    formula: |
      eligible_denominator = count(SampleCase of cycle with status IN {IN_FIELD, RESPONDED, NONRESPONSE})
      completed_responses  = count(SampleCase c of cycle with c.status == RESPONDED
                                   AND the SurveyResponse with case_id == c.id AND status != VOIDED
                                   has status IN {ACCEPTED, INCLUDED})
      response_rate = null if eligible_denominator == 0
                      else round_half_up(100.0 * completed_responses / eligible_denominator, 2)
    input_set: "SampleCase rows of the cycle filtered by status; each case's live (non-VOIDED) SurveyResponse"
    precision: "2 decimal places, round_half_up"

  - name: top_box_composite_scores
    trigger: "POST /api/cycles/{id}/begin-scoring (snapshot); also recomputed live for GET /api/cycles/{id} derived fields"
    algorithm: aggregation
    formula: |
      For each composite c in {nurse_comm, doctor_comm, cleanliness, overall_rating}:
        RAW:        topbox_i = 1 if raw_score_i[c] == TOPBOX_RAW_MIN (4) else 0
        ADJUSTED:   adj_i[c] = raw_score_i[c] + MODE_COEFF[mode_used_i]
                    topbox_i = 1 if adj_i[c] >= TOPBOX_ADJUSTED_THRESHOLD (3.75) else 0
        pct_c = round_half_up(100.0 * SUM(topbox_i) / completed_responses, 2)
        pct_c = null when completed_responses == 0
      Same formula applied to arbitrary input sets: whole cycle (program level),
      per-unit (responses whose case.unit_id == U), per-provider (case.provider_id == P).
    input_set: "SurveyResponse rows with cycle_id = cycle.id AND status IN {ACCEPTED, INCLUDED}"
    constants:
      TOPBOX_RAW_MIN: 4
      TOPBOX_ADJUSTED_THRESHOLD: 3.75
    precision: "percentages rounded half_up to 2 decimal places at the final step only"
    variants:
      - name: RAW
        when: "Unadjusted reporting view; stored in scored_raw_composite_pcts"
        difference: "top-box determined from raw scores (== 4); mode coefficients ignored"
      - name: MODE_ADJUSTED
        when: "Official reporting view; stored in scored_adjusted_composite_pcts and used by star_rating, vbp_payment_adjustment, attribution-report, initiative_evaluation"
        difference: "per-response score first shifted by MODE_COEFF[mode_used] (MAIL 0.0, PHONE -0.5) and compared against 3.75 — a PHONE raw-4 adjusts to 3.5 and is NOT top-box, so identical raw data yields strictly lower adjusted percentages whenever any top-box PHONE response exists"

  - name: star_rating
    trigger: "GET /api/cycles/{id}/star-rating (computed live from scored_* snapshot); pinned to published_star_rating at publish"
    algorithm: threshold
    formula: |
      if scored_completed_responses < MIN_COMPLETED_FOR_RATING (25):
          stars = null; rating_status = NOT_RATED; capped = false
      else:
          p = scored_adjusted_composite_pcts.overall_rating
          stars = 5 if p >= 90.0 else 4 if p >= 80.0 else 3 if p >= 70.0 else 2 if p >= 60.0 else 1
          if scored_response_rate < RATE_CAP_THRESHOLD (10.0):
              stars = min(stars, 3); capped = true
          else: capped = false
      rating_status = RATED when stars != null
    input_set: "Cycle scored_* snapshot fields (SCORING or PUBLISHED state only)"
    constants:
      MIN_COMPLETED_FOR_RATING: 25
      RATE_CAP_THRESHOLD: 10.0
      RATE_CAP_MAX_STARS: 3
      STAR_BOUNDS: "90/80/70/60 inclusive lower bounds for 5/4/3/2 stars"
    precision: "threshold comparisons on the 2dp stored percentages; >= is INCLUSIVE (exactly 80.00 earns 4 stars)"
    note: "Combinatorial mode (a): three inputs (adjusted pct, completed count, response rate) interact non-linearly through the NOT_RATED guard, the piecewise breakpoints, and the response-rate cap."

  - name: vbp_payment_adjustment
    trigger: "POST /api/cycles/{id}/vbp-projection (what-if; overrides applied to the scored snapshot); never persisted"
    algorithm: weighted_scoring
    formula: |
      For each composite c in {nurse_comm, doctor_comm, cleanliness, overall_rating}:
        pct_c = override for c if supplied else scored_adjusted_composite_pcts[c]
        raw_points_c = (pct_c - VBP_FLOOR_PCT) / (VBP_BENCHMARK_PCT - VBP_FLOOR_PCT) * POINTS_PER_COMPOSITE
        points_c = clamp(0, POINTS_PER_COMPOSITE, round_half_up(raw_points_c, 0))   # integer per line
      total_points = SUM(points_c)          # sum of per-composite ROUNDED integers
      vbp_adjustment_pct = round_half_up(total_points / MAX_TOTAL_POINTS * MAX_ADJUSTMENT_PCT, 2)
      ROUNDING ORDER IS PINNED: round each composite's points to an integer BEFORE
      summing. Summing unrounded raw_points and rounding the total is FORBIDDEN —
      the two orders disagree (e.g. pcts 74.75/70.25/65.15/80.00 give 21 -> 1.05
      per-line vs 20 -> 1.00 sum-then-round).
    input_set: "Cycle scored_adjusted_composite_pcts plus optional per-composite overrides from the request body"
    constants:
      VBP_FLOOR_PCT: 50.0
      VBP_BENCHMARK_PCT: 95.0
      POINTS_PER_COMPOSITE: 10
      MAX_TOTAL_POINTS: 40
      MAX_ADJUSTMENT_PCT: 2.0
    precision: "per-composite points rounded half_up to integer; final pct rounded half_up to 2 decimal places"

  - name: initiative_progress
    trigger: "GET /api/initiatives/{id} (computed live); progress fields populate once evaluation cycle is PUBLISHED"
    algorithm: aggregation
    formula: |
      current = unit adjusted pct for domain in evaluation cycle's scored_unit_breakdown
      PINNED:  progress_pinned  = round_half_up(current - baseline_score, 2)
      ROLLING: prior_published = the up to 2 most recent PUBLISHED cycles of the same
               program with cycle_index < evaluation cycle_index, ordered by
               cycle_index DESC (tie-break: created_at DESC)
               rolling_baseline = round_half_up(AVG(unit adjusted pct for domain over prior_published), 2)
                                  (null if no such cycle exists)
               progress_rolling = round_half_up(current - rolling_baseline, 2) (null if rolling_baseline null)
    input_set: "Initiative baseline/evaluation cycles + program's PUBLISHED cycles (status filter: PUBLISHED only)"
    precision: "2 decimal places, round_half_up; rolling baseline rounded BEFORE the subtraction"
    variants:
      - name: PINNED_BASELINE
        when: "Primary contractual view; baseline_score was frozen at activation"
        difference: "delta measured against the pinned baseline_score"
      - name: ROLLING_BASELINE
        when: "Trend view reported alongside"
        difference: "delta measured against the trailing average of up to 2 prior PUBLISHED cycles — diverges from PINNED whenever the pinned baseline differs from the trailing average"

  - name: initiative_evaluation
    trigger: "publish of the cycle whose id = initiative.evaluation_cycle_id"
    algorithm: threshold
    formula: |
      current = unit adjusted pct for domain in the just-published cycle's scored_unit_breakdown
      (unit absent from breakdown or completed_responses == 0 for the unit => current = 0.0)
      if current >= target_score:  ACTIVE -> UNDER_EVALUATION -> TARGET_MET
      else:                        ACTIVE -> UNDER_EVALUATION -> TARGET_MISSED
    input_set: "Initiatives with evaluation_cycle_id = published cycle AND status = ACTIVE"
    precision: "comparison on 2dp percentages; >= is INCLUSIVE (exactly target_score is MET)"

  - name: vendor_budget_reconciliation
    trigger: "SampleCase creation (charge), mark-undeliverable (credit), post-sample exclusion cascade (credit), cycle void (credit)"
    algorithm: aggregation
    formula: |
      vendor.cycle_budget_remaining_cents =
        vendor.cycle_budget_cents
        - SUM(case.postage_cost_cents for SampleCase case
              WHERE case.vendor_id == vendor.id AND case.billing_status == CHARGED)
      INVARIANT (compensating pair): a charge followed by its compensating credit
      leaves cycle_budget_remaining_cents unchanged; at all times
      cycle_budget_cents == cycle_budget_remaining_cents + SUM(CHARGED postage).
    input_set: "All SampleCase rows referencing the vendor, filtered by billing_status == CHARGED"
    precision: "integer cents; exact"

  - name: completed_responses_reconciliation
    trigger: "response intake, response void, response adjudicate INCLUDE/EXCLUDE, case exclusion cascade, cycle void"
    algorithm: aggregation
    formula: |
      cycle.completed_responses = count(SampleCase c of cycle WHERE c.status == RESPONDED
        AND EXISTS SurveyResponse r WITH r.case_id == c.id AND r.status IN {ACCEPTED, INCLUDED})
      INVARIANT (compensating pair): intake (+1) followed by void (-1) restores the
      prior completed_responses exactly; no drift after the pair completes.
    input_set: "SampleCase rows of the cycle joined to their non-VOIDED SurveyResponse"
    precision: "integer count; exact"

  - name: service_recovery_sla
    trigger: "ticket acknowledge"
    algorithm: threshold
    formula: |
      acknowledged_within_sla = (acknowledged_at - created_at) <= SLA_HOURS hours
      Boundary is INCLUSIVE: exactly 48h00m00s is within SLA; 48h00m01s is not.
    input_set: "The single ticket"
    constants:
      SLA_HOURS: 48

  - name: mode_transition_attribution
    trigger: "GET /api/cycles/{id}/mode-transition-analysis?compare_to_cycle_id=..."
    algorithm: aggregation
    formula: |
      Both cycles must be PUBLISHED (ERR_CYCLE_NOT_PUBLISHED) and share program_id
      (ERR_CROSS_PROGRAM_REFERENCE). B = path cycle, A = compare_to cycle.
      mode_share(cycle, m) = count(responses with cycle_id = cycle.id AND status IN
          {ACCEPTED, INCLUDED} AND mode_used == m) / count(responses with
          cycle_id = cycle.id AND status IN {ACCEPTED, INCLUDED})
      mail_share_delta  = round_half_up(mode_share(B, MAIL)  - mode_share(A, MAIL), 4)
      phone_share_delta = round_half_up(mode_share(B, PHONE) - mode_share(A, PHONE), 4)
      raw_overall_delta      = round_half_up(B.scored_raw.overall_rating      - A.scored_raw.overall_rating, 2)
      adjusted_overall_delta = round_half_up(B.scored_adjusted.overall_rating - A.scored_adjusted.overall_rating, 2)
      mode_effect_pp(cycle)  = cycle.scored_raw.overall_rating - cycle.scored_adjusted.overall_rating
                               (percentage points of top-box inflation attributable to mode mix)
      mode_effect_delta = round_half_up(mode_effect_pp(B) - mode_effect_pp(A), 2)
    input_set: "Two PUBLISHED cycles of the same program, their scored snapshots, and their response mode mix"
    precision: "share deltas 4 decimal places; percentage-point deltas 2 decimal places; round_half_up"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and role is a declared role"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all
  - priority: 2
    category: auth
    check: "Role is permitted on this endpoint per §1.5 roles"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all
  - priority: 2.5
    category: auth
    check: "Entity-backed ownership: VendorOperator's X-User-ID must equal SampleCase.vendor_id (intake, mark-undeliverable); UnitManager's X-User-ID must equal the ticket/unit id being operated on"
    error_id: "ERR_VENDOR_CASE_MISMATCH | ERR_UNIT_ACCESS_DENIED"
    http_status: 403
    applies_to: "POST /api/responses, POST /api/responses/import, POST /api/sample-cases/{id}/mark-undeliverable, POST /api/service-recovery-tickets, POST /api/service-recovery-tickets/{id}/acknowledge, POST /api/service-recovery-tickets/{id}/resolve"
  - priority: 3
    category: existence
    check: "Resource ids in path exist, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all resource endpoints
  - priority: 3.5
    category: existence
    check: "Request body well-formed: required fields present, unknown fields rejected, types match, enum members valid, dates ISO, score ranges 1..4"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all mutation endpoints
  - priority: 3.6
    category: existence
    check: "OCC: expected_program_version equals SurveyProgram.version (checked before any business rule)"
    error_id: ERR_STALE_PROGRAM_VERSION
    http_status: 412
    applies_to: "POST /api/vendors"
  - priority: 4
    category: state
    check: "State-machine preconditions of the target transition (cycle posture, case IN_FIELD, response adjudicable/voidable, ticket acknowledgeable/resolvable, initiative/vcendor machine states, discharge lock, baseline published, publication threshold inputs frozen)"
    error_id: "ERR_INVALID_STATE | ERR_CYCLE_NOT_SAMPLING_OPEN | ERR_CYCLE_NOT_FIELDING | ERR_CYCLE_NOT_RECONCILING | ERR_CYCLE_NOT_SCORED | ERR_CYCLE_NOT_PUBLISHED | ERR_CYCLE_LOCKED | ERR_NO_ACTIVE_VENDOR | ERR_NO_CASES_SAMPLED | ERR_UNADJUDICATED_RESPONSES | ERR_CASE_NOT_IN_FIELD | ERR_RESPONSE_NOT_PENDING_REVIEW | ERR_RESPONSE_NOT_VOIDABLE | ERR_RESPONSE_NOT_FINAL | ERR_DISCHARGE_LOCKED_BY_SAMPLE | ERR_BASELINE_CYCLE_NOT_PUBLISHED | ERR_TICKET_NOT_ACKNOWLEDGEABLE | ERR_TICKET_NOT_RESOLVABLE"
    http_status: 409
    applies_to: all action/transition endpoints
    note: "Within priority 4, cycle-posture errors (ERR_CYCLE_* / ERR_NO_ACTIVE_VENDOR / ERR_NO_CASES_SAMPLED / ERR_UNADJUDICATED_RESPONSES) are checked BEFORE entity-local state errors (ERR_CASE_NOT_IN_FIELD, ERR_RESPONSE_*, ERR_TICKET_*, ERR_INVALID_STATE)."
  - priority: 5
    category: business_safety
    check: "Patient protection: only ELIGIBLE discharges may be sampled (exclusion criteria are safety/compliance rules)"
    error_id: ERR_DISCHARGE_NOT_ELIGIBLE
    http_status: 422
    applies_to: "POST /api/sample-cases, POST /api/sample-cases/import"
  - priority: 6
    category: business_referential
    check: "Body-referenced resources belong to the same aggregate scope: discharge.program_id == cycle.program_id; initiative cycles belong to unit's program; ticket response's attributed unit == ticket unit"
    error_id: "ERR_CROSS_PROGRAM_REFERENCE | ERR_UNIT_RESPONSE_MISMATCH"
    http_status: 400
    applies_to: "POST /api/sample-cases, POST /api/sample-cases/import, POST /api/initiatives, POST /api/initiatives/{id}/activate, POST /api/initiatives/{id}/replan, POST /api/service-recovery-tickets, GET /api/cycles/{id}/mode-transition-analysis"
  - priority: 7
    category: business_temporal
    check: "Window rules: cycle fielding windows (closed, touching conflicts); discharge within sampling window (inclusive); fielding close/reopen clock gates; initiative evaluation index ordering and half-open window overlap"
    error_id: "ERR_CYCLE_WINDOW_OVERLAP | ERR_DISCHARGE_OUTSIDE_WINDOW | ERR_FIELDING_WINDOW_NOT_CLOSED | ERR_REOPEN_WINDOW_EXPIRED | ERR_INVALID_EVALUATION_CYCLE | ERR_INITIATIVE_WINDOW_OVERLAP"
    http_status: 409
    applies_to: "POST /api/cycles, POST /api/sample-cases(+import), cycle close/reopen, initiative create/activate/replan"
  - priority: 8
    category: business_constraint
    check: "Uniqueness/quota/format constraints: unit_code & cycle_index unique per program; discharge sampled at most once across non-VOIDED cycles; target_sample_size cap; mode allowed by program.admin_mode; one live response per case; comment required for routing; publication minimums"
    error_id: "ERR_DUPLICATE_UNIT_CODE | ERR_DUPLICATE_CYCLE_INDEX | ERR_DUPLICATE_NPI | ERR_DISCHARGE_ALREADY_SAMPLED | ERR_SAMPLE_TARGET_REACHED | ERR_MODE_NOT_ALLOWED | ERR_RESPONSE_ALREADY_EXISTS | ERR_NO_COMMENT_TO_ROUTE | ERR_BELOW_PUBLICATION_THRESHOLD"
    http_status: 409
    applies_to: "create/intake/publish endpoints"
  - priority: 9
    category: business_fiscal
    check: "Vendor budget: postage_cost_cents <= vendor.cycle_budget_remaining_cents at case creation (per item, in listed order, for imports)"
    error_id: ERR_VENDOR_BUDGET_EXCEEDED
    http_status: 402
    applies_to: "POST /api/sample-cases, POST /api/sample-cases/import"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Programs ---
  - { method: POST, path: "/api/survey-programs", description: "Create survey program", roles: [ProgramAdmin], code: 201, input: [name, sampling_protocol, admin_mode], output: SurveyProgram, side_effects: ["status fields initialized; active_vendor_id null"] }
  - { method: GET, path: "/api/survey-programs/{programId}", description: "Get program (includes version for OCC)", roles: [Any], code: 200, input: [], output: SurveyProgram, side_effects: [] }

  # --- Vendors ---
  - { method: POST, path: "/api/vendors", description: "Register vendor for a program; supersedes the program's current ACTIVE vendor (OCC-guarded)", roles: [ProgramAdmin], code: 201, input: [program_id, name, cycle_budget_cents, expected_program_version], output: SurveyVendor, side_effects: ["prior ACTIVE vendor -> SUPERSEDED (superseded_at := clock); program.active_vendor_id := new vendor; increments SurveyProgram.version by 1"] }
  - { method: GET, path: "/api/vendors", description: "List vendors (filters: program_id, status)", roles: [Any], code: 200, input: ["program_id?", "status?", "limit?", "offset?"], output: "SurveyVendor[]", side_effects: [] }
  - { method: GET, path: "/api/vendors/{vendorId}", description: "Get vendor (budget + remaining)", roles: [Any], code: 200, input: [], output: SurveyVendor, side_effects: [] }
  - { method: POST, path: "/api/vendors/{vendorId}/suspend", description: "Suspend ACTIVE vendor", roles: [ProgramAdmin], code: 200, input: [], output: SurveyVendor, side_effects: ["status -> SUSPENDED; program.active_vendor_id recomputed"] }

  # --- Units ---
  - { method: POST, path: "/api/units", description: "Create care unit (unit_code unique per program)", roles: [ProgramAdmin], code: 201, input: [program_id, name, unit_code], output: CareUnit, side_effects: [] }
  - { method: GET, path: "/api/units", description: "List units (filters: program_id)", roles: [Any], code: 200, input: ["program_id?", "limit?", "offset?"], output: "CareUnit[]", side_effects: [] }
  - { method: GET, path: "/api/units/{unitId}", description: "Get unit", roles: [Any], code: 200, input: [], output: CareUnit, side_effects: [] }

  # --- Providers ---
  - { method: POST, path: "/api/providers", description: "Create provider (npi unique per program)", roles: [ProgramAdmin], code: 201, input: [program_id, full_name, npi, specialty], output: Provider, side_effects: [] }
  - { method: GET, path: "/api/providers", description: "List providers (filters: program_id)", roles: [Any], code: 200, input: ["program_id?", "limit?", "offset?"], output: "Provider[]", side_effects: [] }
  - { method: GET, path: "/api/providers/{providerId}", description: "Get provider", roles: [Any], code: 200, input: [], output: Provider, side_effects: [] }

  # --- Discharges ---
  - { method: POST, path: "/api/discharges", description: "Intake one discharge (status ELIGIBILITY_PENDING)", roles: [DataSteward], code: 201, input: [program_id, mrn, unit_id, provider_id, admit_date, discharge_date, discharge_disposition, primary_dx_group, payer, age_years, address_country, no_publicity_flag, custody_status], output: Discharge, side_effects: [] }
  - { method: POST, path: "/api/discharges/import", description: "Bulk discharge feed: creates `count` (1..500) discharges from a shared `template` object (fields: mrn_prefix, unit_id, provider_id, admit_date, discharge_date, discharge_disposition, primary_dx_group, payer, age_years, address_country, no_publicity_flag, custody_status). Item i gets mrn = \"{mrn_prefix}-{i:03d}\" (i from 1, zero-padded, deterministic); every item is auto-evaluated per eligible_discharge_evaluation. Atomic: any malformed template field rejects the whole import.", roles: [DataSteward], code: 201, input: [program_id, count, template], output: "{ created_count: integer, eligible_count: integer, excluded_count: integer, discharge_ids: string[] }", side_effects: ["per item: Discharge created; eligible_discharge_evaluation applied; discharge_ids returned in creation order"] }
  - { method: GET, path: "/api/discharges", description: "List discharges (filters: program_id, unit_id, provider_id, status)", roles: [Any], code: 200, input: ["program_id?", "unit_id?", "provider_id?", "status?", "limit?", "offset?"], output: "Discharge[]", side_effects: [] }
  - { method: GET, path: "/api/discharges/{dischargeId}", description: "Get discharge (status + exclusion_reasons)", roles: [Any], code: 200, input: [], output: Discharge, side_effects: [] }
  - { method: POST, path: "/api/discharges/{dischargeId}/evaluate", description: "Apply optional corrected source fields, then run exclusion rules -> ELIGIBLE | EXCLUDED; EXCLUDED cascades to linked sample cases", roles: [DataSteward], code: 200, input: ["discharge_disposition?", "primary_dx_group?", "age_years?", "address_country?", "no_publicity_flag?", "custody_status?", "admit_date?", "discharge_date?"], output: Discharge, side_effects: ["status recomputed; on entering EXCLUDED: linked SAMPLED/IN_FIELD cases -> EXCLUDED_POST_SAMPLE with vendor credit (cascade hops B,C)"] }

  # --- Cycles ---
  - { method: POST, path: "/api/cycles", description: "Create cycle; closed-interval fielding-window overlap with any non-VOIDED cycle of the same program is rejected", roles: [ProgramAdmin], code: 201, input: [program_id, label, cycle_index, discharge_window_start, discharge_window_end, fielding_start_date, fielding_end_date, target_sample_size], output: SurveyCycle, side_effects: ["status DRAFT"] }
  - { method: GET, path: "/api/cycles", description: "List cycles (filters: program_id, status)", roles: [Any], code: 200, input: ["program_id?", "status?", "limit?", "offset?"], output: "SurveyCycle[]", side_effects: [] }
  - { method: GET, path: "/api/cycles/{cycleId}", description: "Get cycle incl. live derived fields (sampled_count, completed_responses, eligible_denominator, response_rate, publication_eligible) and scored/published snapshots", roles: [Any], code: 200, input: [], output: SurveyCycle, side_effects: [] }
  - { method: POST, path: "/api/cycles/{cycleId}/open-sampling", description: "DRAFT -> SAMPLING_OPEN; requires an ACTIVE vendor on the program", roles: [ProgramAdmin], code: 200, input: [], output: SurveyCycle, side_effects: [] }
  - { method: POST, path: "/api/cycles/{cycleId}/start-fielding", description: "SAMPLING_OPEN -> FIELDING; dispatches all SAMPLED cases", roles: [ProgramAdmin], code: 200, input: [], output: SurveyCycle, side_effects: ["SAMPLED cases -> IN_FIELD; sampled_count snapshot"] }
  - { method: POST, path: "/api/cycles/{cycleId}/close-fielding", description: "FIELDING -> RECONCILIATION; clock date must be >= fielding_end_date", roles: [ProgramAdmin], code: 200, input: [], output: SurveyCycle, side_effects: ["IN_FIELD cases without response -> NONRESPONSE"] }
  - { method: POST, path: "/api/cycles/{cycleId}/reopen-fielding", description: "RECONCILIATION -> FIELDING (cyclic); clock date must be <= fielding_end_date", roles: [ProgramAdmin], code: 200, input: [], output: SurveyCycle, side_effects: ["NONRESPONSE cases -> IN_FIELD"] }
  - { method: POST, path: "/api/cycles/{cycleId}/begin-scoring", description: "RECONCILIATION -> SCORING; all PENDING_REVIEW responses must be adjudicated first", roles: [ProgramAdmin], code: 200, input: [], output: SurveyCycle, side_effects: ["stores scored_raw/adjusted_composite_pcts, unit/provider breakdowns, scored_response_rate, scored_completed_responses"] }
  - { method: POST, path: "/api/cycles/{cycleId}/publish", description: "SCORING -> PUBLISHED; gates on publication minimums; triggers initiative evaluation cascade (hops B->C->D)", roles: [ProgramAdmin], code: 200, input: [], output: SurveyCycle, side_effects: ["published_star_rating pinned; initiative cascade per state machine"] }
  - { method: POST, path: "/api/cycles/{cycleId}/void", description: "Any non-terminal state -> VOIDED; compensating credits for CHARGED cases", roles: [ProgramAdmin], code: 200, input: [], output: SurveyCycle, side_effects: ["cases -> VOIDED; CHARGED -> CREDITED with vendor credit; live responses -> VOIDED"] }
  - { method: GET, path: "/api/cycles/{cycleId}/star-rating", description: "Computed star rating from scored snapshot (cycle must be SCORING or PUBLISHED)", roles: [Any], code: 200, input: [], output: "{ cycle_id: string, rating_status: string, stars: integer, capped: boolean, adjusted_overall_topbox_pct: number, response_rate: number, completed_responses: integer }", side_effects: [] }
  - { method: GET, path: "/api/cycles/{cycleId}/attribution-report", description: "Unit/provider-level reporting: exactly one of unit_id / provider_id required; cycle must be SCORING or PUBLISHED", roles: [Any], code: 200, input: ["unit_id?", "provider_id?"], output: "{ cycle_id: string, scope: string, subject_id: string, completed_responses: integer, raw_pcts: object, adjusted_pcts: object }", side_effects: [] }
  - { method: POST, path: "/api/cycles/{cycleId}/vbp-projection", description: "What-if VBP impact model over the scored snapshot with optional per-composite percentage overrides; cycle must be SCORING or PUBLISHED; no persistence", roles: [ProgramAdmin], code: 200, input: ["nurse_comm_pct?", "doctor_comm_pct?", "cleanliness_pct?", "overall_rating_pct?"], output: "{ cycle_id: string, composite_points: object, total_points: integer, vbp_adjustment_pct: number }", side_effects: [] }
  - { method: GET, path: "/api/cycles/{cycleId}/mode-transition-analysis", description: "Survey mode transition analysis vs another PUBLISHED cycle of the same program (query: compare_to_cycle_id)", roles: [Any], code: 200, input: ["compare_to_cycle_id?"], output: "{ cycle_id: string, compare_to_cycle_id: string, mail_share_delta: number, phone_share_delta: number, raw_overall_delta: number, adjusted_overall_delta: number, mode_effect_delta: number }", side_effects: [] }

  # --- Sample cases ---
  - { method: POST, path: "/api/sample-cases", description: "Sample one discharge into a cycle (vendor budget charged at creation)", roles: [DataSteward], code: 201, input: [cycle_id, discharge_id, mode_assigned, postage_cost_cents], output: SampleCase, side_effects: ["vendor_id snapshot from program ACTIVE vendor; unit_id/provider_id denormalized from discharge; billing_status CHARGED; vendor.cycle_budget_remaining_cents -= postage_cost_cents"] }
  - { method: POST, path: "/api/sample-cases/import", description: "Bulk sampling: one SampleCase per id in `discharge_ids` (1..500, order preserved), all with the given mode_assigned and postage_cost_cents. Atomic — any item failing a validation rejects the whole import with that item's error.", roles: [DataSteward], code: 201, input: [cycle_id, discharge_ids, mode_assigned, postage_cost_cents], output: "{ created_count: integer, sample_case_ids: string[] }", side_effects: ["per item: same as POST /api/sample-cases (vendor snapshot, denormalization, budget charge)"] }
  - { method: GET, path: "/api/sample-cases", description: "List sample cases (filters: cycle_id, discharge_id, vendor_id, unit_id, provider_id, status)", roles: [Any], code: 200, input: ["cycle_id?", "discharge_id?", "vendor_id?", "unit_id?", "provider_id?", "status?", "limit?", "offset?"], output: "SampleCase[]", side_effects: [] }
  - { method: GET, path: "/api/sample-cases/{caseId}", description: "Get sample case", roles: [Any], code: 200, input: [], output: SampleCase, side_effects: [] }
  - { method: GET, path: "/api/sample-cases/{caseId}/responses", description: "List the case's responses (0..1 live; voided retained)", roles: [Any], code: 200, input: ["limit?", "offset?"], output: "SurveyResponse[]", side_effects: [] }
  - { method: POST, path: "/api/sample-cases/{caseId}/mark-undeliverable", description: "IN_FIELD -> UNDELIVERABLE with compensating budget credit", roles: [VendorOperator], code: 200, input: [], output: SampleCase, side_effects: ["billing CHARGED -> CREDITED; vendor credited; cycle counters recomputed"] }

  # --- Responses ---
  - { method: POST, path: "/api/responses", description: "Survey response intake; received_at := logical clock; late intake (after fielding_end_date) starts PENDING_REVIEW", roles: [VendorOperator], code: 201, input: [case_id, mode_used, nurse_comm_score, doctor_comm_score, cleanliness_score, overall_rating_score, "comment_text?"], output: SurveyResponse, side_effects: ["case IN_FIELD -> RESPONDED; cycle.completed_responses recomputed; is_late/status set from clock"] }
  - { method: POST, path: "/api/responses/import", description: "Bulk response intake: one response per id in `case_ids` (1..500, order preserved), all with the given mode_used and composite scores. Atomic — any item failing a validation rejects the whole import with that item's error.", roles: [VendorOperator], code: 201, input: [case_ids, mode_used, nurse_comm_score, doctor_comm_score, cleanliness_score, overall_rating_score, "comment_text?"], output: "{ created_count: integer, response_ids: string[] }", side_effects: ["per item: same as POST /api/responses (case -> RESPONDED, is_late/status from clock, counters recomputed)"] }
  - { method: GET, path: "/api/responses", description: "List responses (filters: case_id, cycle_id, status, mode_used)", roles: [Any], code: 200, input: ["case_id?", "cycle_id?", "status?", "mode_used?", "limit?", "offset?"], output: "SurveyResponse[]", side_effects: [] }
  - { method: GET, path: "/api/responses/{responseId}", description: "Get response", roles: [Any], code: 200, input: [], output: SurveyResponse, side_effects: [] }
  - { method: POST, path: "/api/responses/{responseId}/adjudicate", description: "PENDING_REVIEW -> INCLUDED | EXCLUDED (cycle must be RECONCILIATION)", roles: [DataSteward], code: 200, input: [decision], output: SurveyResponse, side_effects: ["INCLUDE increments cycle.completed_responses"] }
  - { method: POST, path: "/api/responses/{responseId}/void", description: "ACCEPTED -> VOIDED (duplicate/fraud compensation; decrements completed_responses)", roles: [DataSteward], code: 200, input: [reason], output: SurveyResponse, side_effects: ["cycle.completed_responses recomputed (decrement)"] }

  # --- Improvement initiatives ---
  - { method: POST, path: "/api/initiatives", description: "Create improvement initiative (DRAFT)", roles: [ProgramAdmin], code: 201, input: [unit_id, domain, baseline_cycle_id, evaluation_cycle_id, target_score], output: ImprovementInitiative, side_effects: [] }
  - { method: GET, path: "/api/initiatives", description: "List initiatives (filters: unit_id, program_id, baseline_cycle_id, evaluation_cycle_id, status)", roles: [Any], code: 200, input: ["unit_id?", "program_id?", "baseline_cycle_id?", "evaluation_cycle_id?", "status?", "limit?", "offset?"], output: "ImprovementInitiative[]", side_effects: [] }
  - { method: GET, path: "/api/initiatives/{initiativeId}", description: "Get initiative incl. progress_pinned / progress_rolling", roles: [Any], code: 200, input: [], output: ImprovementInitiative, side_effects: [] }
  - { method: POST, path: "/api/initiatives/{initiativeId}/activate", description: "DRAFT -> ACTIVE; pins baseline_score; half-open window overlap enforced", roles: [ProgramAdmin], code: 200, input: [], output: ImprovementInitiative, side_effects: ["baseline_score pinned from baseline cycle's scored_unit_breakdown"] }
  - { method: POST, path: "/api/initiatives/{initiativeId}/replan", description: "TARGET_MISSED -> ACTIVE with new evaluation cycle + target", roles: [ProgramAdmin], code: 200, input: [evaluation_cycle_id, target_score], output: ImprovementInitiative, side_effects: ["progress fields reset; baseline_score unchanged"] }
  - { method: POST, path: "/api/initiatives/{initiativeId}/cancel", description: "DRAFT | ACTIVE | TARGET_MISSED -> CANCELLED", roles: [ProgramAdmin], code: 200, input: [], output: ImprovementInitiative, side_effects: [] }

  # --- Service recovery ---
  - { method: POST, path: "/api/service-recovery-tickets", description: "Route a response's comment into a service-recovery ticket on the attributed unit", roles: [UnitManager], code: 201, input: [unit_id, response_id, domain, priority], output: ServiceRecoveryTicket, side_effects: ["status OPEN; created_at := logical clock"] }
  - { method: GET, path: "/api/service-recovery-tickets", description: "List tickets (filters: unit_id, program_id, response_id, status)", roles: [Any], code: 200, input: ["unit_id?", "program_id?", "response_id?", "status?", "limit?", "offset?"], output: "ServiceRecoveryTicket[]", side_effects: [] }
  - { method: GET, path: "/api/service-recovery-tickets/{ticketId}", description: "Get ticket (incl. acknowledged_within_sla)", roles: [Any], code: 200, input: [], output: ServiceRecoveryTicket, side_effects: [] }
  - { method: POST, path: "/api/service-recovery-tickets/{ticketId}/acknowledge", description: "OPEN | ESCALATED -> ACKNOWLEDGED; stamps SLA outcome", roles: [UnitManager], code: 200, input: [], output: ServiceRecoveryTicket, side_effects: ["acknowledged_at := clock; acknowledged_within_sla computed"] }
  - { method: POST, path: "/api/service-recovery-tickets/{ticketId}/resolve", description: "ACKNOWLEDGED -> RESOLVED", roles: [UnitManager], code: 200, input: [resolution_note], output: ServiceRecoveryTicket, side_effects: ["resolution_note stored"] }

  # --- Test-driving clock ---
  - { method: POST, path: "/_clock/set_current_utc", description: "Set the server's logical clock. Startup default (before any set call) is exactly 2026-08-01T00:00:00Z and MUST NOT fall back to wall-clock. Drives is_late determination, fielding close/reopen gates, SLA computation, and audit timestamps.", roles: [ProgramAdmin], code: 200, input: [to_iso8601], output: "{ current_utc: string }", side_effects: ["logical clock advanced"] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # Auth & ownership
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or role not declared" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role not permitted on this endpoint" }
  - { id: ERR_VENDOR_CASE_MISMATCH, http: 403, condition: "VendorOperator X-User-ID != SampleCase.vendor_id" }
  - { id: ERR_UNIT_ACCESS_DENIED, http: 403, condition: "UnitManager X-User-ID != ticket.unit_id (or requested unit_id at creation)" }
  # Existence & shape
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path resource id does not exist (validated left-to-right)" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, type mismatch, invalid enum member, malformed date, score outside 1..4" }
  - { id: ERR_STALE_PROGRAM_VERSION, http: 412, condition: "expected_program_version != SurveyProgram.version (OCC)" }
  # State
  - { id: ERR_INVALID_STATE, http: 409, condition: "Generic machine violation: open-sampling from non-DRAFT, void of terminal cycle, vendor suspend from non-ACTIVE, initiative activate/replan/cancel from wrong status" }
  - { id: ERR_CYCLE_NOT_SAMPLING_OPEN, http: 409, condition: "Cycle must be SAMPLING_OPEN (start-fielding, sample-case creation)" }
  - { id: ERR_CYCLE_NOT_FIELDING, http: 409, condition: "Cycle must be FIELDING (close-fielding, response intake, mark-undeliverable)" }
  - { id: ERR_CYCLE_NOT_RECONCILING, http: 409, condition: "Cycle must be RECONCILIATION (reopen-fielding, begin-scoring, adjudicate)" }
  - { id: ERR_CYCLE_NOT_SCORED, http: 409, condition: "Cycle must be SCORING or PUBLISHED (star-rating, attribution-report, vbp-projection); publish itself requires SCORING" }
  - { id: ERR_CYCLE_NOT_PUBLISHED, http: 409, condition: "Both cycles must be PUBLISHED (mode-transition-analysis)" }
  - { id: ERR_CYCLE_LOCKED, http: 409, condition: "Response void allowed only while cycle in FIELDING or RECONCILIATION" }
  - { id: ERR_NO_ACTIVE_VENDOR, http: 409, condition: "Program has no ACTIVE vendor (open-sampling, sample-case creation)" }
  - { id: ERR_NO_CASES_SAMPLED, http: 409, condition: "start-fielding requires >= 1 SAMPLED case" }
  - { id: ERR_UNADJUDICATED_RESPONSES, http: 409, condition: "begin-scoring blocked while PENDING_REVIEW responses exist in the cycle" }
  - { id: ERR_CASE_NOT_IN_FIELD, http: 409, condition: "SampleCase must be IN_FIELD (response intake, mark-undeliverable)" }
  - { id: ERR_RESPONSE_NOT_PENDING_REVIEW, http: 409, condition: "adjudicate requires response status PENDING_REVIEW" }
  - { id: ERR_RESPONSE_NOT_VOIDABLE, http: 409, condition: "void requires response status ACCEPTED" }
  - { id: ERR_RESPONSE_NOT_FINAL, http: 409, condition: "Service-recovery routing requires response status IN {ACCEPTED, INCLUDED}" }
  - { id: ERR_DISCHARGE_LOCKED_BY_SAMPLE, http: 409, condition: "Discharge field overrides blocked while a linked SampleCase is IN_FIELD or RESPONDED" }
  - { id: ERR_BASELINE_CYCLE_NOT_PUBLISHED, http: 409, condition: "Initiative activation requires baseline cycle PUBLISHED" }
  - { id: ERR_TICKET_NOT_ACKNOWLEDGEABLE, http: 409, condition: "acknowledge requires ticket status OPEN or ESCALATED" }
  - { id: ERR_TICKET_NOT_RESOLVABLE, http: 409, condition: "resolve requires ticket status ACKNOWLEDGED" }
  # Safety
  - { id: ERR_DISCHARGE_NOT_ELIGIBLE, http: 422, condition: "Sampling a discharge whose status != ELIGIBLE (exclusion criteria)" }
  # Referential
  - { id: ERR_CROSS_PROGRAM_REFERENCE, http: 400, condition: "Body-referenced resource belongs to a different program than the target aggregate" }
  - { id: ERR_UNIT_RESPONSE_MISMATCH, http: 400, condition: "Ticket unit_id != the response's attributed unit (case.unit_id)" }
  # Temporal
  - { id: ERR_CYCLE_WINDOW_OVERLAP, http: 409, condition: "Fielding window [start, end] (closed) intersects another non-VOIDED cycle of the same program; touching dates conflict" }
  - { id: ERR_DISCHARGE_OUTSIDE_WINDOW, http: 422, condition: "discharge_date outside cycle's [discharge_window_start, discharge_window_end] inclusive" }
  - { id: ERR_FIELDING_WINDOW_NOT_CLOSED, http: 409, condition: "close-fielding before logical clock date >= fielding_end_date" }
  - { id: ERR_REOPEN_WINDOW_EXPIRED, http: 409, condition: "reopen-fielding after logical clock date > fielding_end_date" }
  - { id: ERR_INVALID_EVALUATION_CYCLE, http: 422, condition: "evaluation cycle_index must be > baseline cycle_index; evaluation cycle must not be VOIDED" }
  - { id: ERR_INITIATIVE_WINDOW_OVERLAP, http: 409, condition: "Half-open window (baseline_index, evaluation_index] intersects another same-(unit, domain) initiative in ACTIVE/UNDER_EVALUATION/TARGET_MISSED; adjacency permitted" }
  # Constraint
  - { id: ERR_DUPLICATE_UNIT_CODE, http: 409, condition: "unit_code already exists within the program" }
  - { id: ERR_DUPLICATE_CYCLE_INDEX, http: 409, condition: "cycle_index already exists within the program" }
  - { id: ERR_DUPLICATE_NPI, http: 409, condition: "npi already exists within the program" }
  - { id: ERR_DISCHARGE_ALREADY_SAMPLED, http: 409, condition: "Discharge already referenced by a SampleCase in a non-VOIDED cycle" }
  - { id: ERR_SAMPLE_TARGET_REACHED, http: 422, condition: "Creating the case would exceed cycle.target_sample_size (count of the cycle's cases in statuses {SAMPLED, IN_FIELD, RESPONDED, NONRESPONSE, UNDELIVERABLE} already >= target)" }
  - { id: ERR_MODE_NOT_ALLOWED, http: 422, condition: "mode_assigned not permitted by program.admin_mode (MAIL_ONLY -> MAIL only; PHONE_ONLY -> PHONE only; MIXED_MODE -> both)" }
  - { id: ERR_RESPONSE_ALREADY_EXISTS, http: 409, condition: "Case already has a response with status IN {ACCEPTED, PENDING_REVIEW, INCLUDED}" }
  - { id: ERR_NO_COMMENT_TO_ROUTE, http: 422, condition: "Response has empty/null comment_text — nothing to route" }
  - { id: ERR_BELOW_PUBLICATION_THRESHOLD, http: 422, condition: "publish requires scored_completed_responses >= 25 AND scored_response_rate >= 10.0 (inclusive)" }
  # Fiscal
  - { id: ERR_VENDOR_BUDGET_EXCEEDED, http: 402, condition: "postage_cost_cents exceeds vendor.cycle_budget_remaining_cents at case creation" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ProgramAdmin
    description: "Hospital program administrator — owns program config, vendors, units, providers, cycle lifecycle, initiatives, VBP projections, logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /api/survey-programs"
      - "POST /api/vendors; POST /api/vendors/{id}/suspend"
      - "POST /api/units; POST /api/providers"
      - "POST /api/cycles; POST /api/cycles/{id}/open-sampling|start-fielding|close-fielding|reopen-fielding|begin-scoring|publish|void"
      - "POST /api/cycles/{id}/vbp-projection"
      - "POST /api/initiatives; POST /api/initiatives/{id}/activate|replan|cancel"
      - "POST /_clock/set_current_utc"
    shared_operations: ["All GET endpoints"]
  - name: DataSteward
    description: "Health-information data steward — owns discharge feed, exclusion evaluation, sampling, response adjudication/voiding"
    identity: opaque
    exclusive_operations:
      - "POST /api/discharges; POST /api/discharges/import; POST /api/discharges/{id}/evaluate"
      - "POST /api/sample-cases; POST /api/sample-cases/import"
      - "POST /api/responses/{id}/adjudicate; POST /api/responses/{id}/void"
    shared_operations: ["All GET endpoints"]
  - name: VendorOperator
    description: "Survey vendor operator — submits responses and delivery dispositions for cases assigned to their vendor"
    identity: "entity_backed:SurveyVendor"
    exclusive_operations:
      - "POST /api/responses; POST /api/responses/import"
      - "POST /api/sample-cases/{id}/mark-undeliverable"
    shared_operations: ["All GET endpoints"]
  - name: UnitManager
    description: "Care-unit manager — works the service-recovery queue routed to their unit"
    identity: "entity_backed:CareUnit"
    exclusive_operations:
      - "POST /api/service-recovery-tickets; POST /api/service-recovery-tickets/{id}/acknowledge; POST /api/service-recovery-tickets/{id}/resolve"
    shared_operations: ["All GET endpoints"]
  - name: Any
    description: "Pseudo-role meaning any authenticated role may call; used on read-only GET endpoints"
    identity: opaque
    exclusive_operations: []
    shared_operations: ["All GET endpoints"]
