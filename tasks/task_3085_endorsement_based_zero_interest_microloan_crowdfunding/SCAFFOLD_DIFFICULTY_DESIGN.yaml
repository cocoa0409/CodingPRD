  - rule_id: dual_variant_calc
    instances:
      - name: underwriting_score_standard_vs_trustee_augmented
        grounds:
          - calculations.social_underwriting_score
          - entities.Borrower.fields.social_underwriting_score
          - entities.Borrower.fields.underwriting_variant
        distinguishing_aspect: |
          Dual-variant on the Borrower domain: the same borrower profile
          (tenure 24 months, 6 accepted invites, prior_repaid_loans_count 0)
          scores 38 under STANDARD (20 + 18 + 0 + 0) but 63 under
          TRUSTEE_AUGMENTED (20 + 18 + 25 + 0): the trustee vouch swaps
          the repayment-history component for a flat 25-point trustee
          component, so identical inputs diverge by endorsement_mode and
          only the TRUSTEE_AUGMENTED variant clears the 60-point approval
          threshold.
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z."
            - "Borrower A: tenure 24 months, prior_repaid_loans_count 0, six ACCEPTED invites, SELF_ENDORSED application for 1000000 cents / 6 months."
