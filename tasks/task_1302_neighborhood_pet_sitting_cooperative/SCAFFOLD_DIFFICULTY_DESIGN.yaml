              as: Member
              as_user_id: "${f1_id}"
              captures: { err: $.data.error_id }
          assert:
            - "R_ok: response 201, credit_hours_offered == 15.00, status OPEN (margin -5.00 >= -5.00 is inclusive-pass)"
            - "R_bad: response 402 with error_id == ERR_INSUFFICIENT_CREDIT (margin -5.50 < -5.00)"
            - "Member.${f1_id}.credit_balance_hours unchanged == 10.00 (posting does not debit)"

      - name: late_cancel_exactly_24h_vs_23h
        grounds:
          - calculations.late_cancel_penalty
          - state_machines.SittingRequest.transitions.ASSIGNED_to_CANCELLED
          - state_machines.SittingAssignment.transitions.CONFIRMED_to_CANCELLED_BY_SITTER
        distinguishing_aspect: |
          Metric: hours_until_start (time), endpoint POST /sitting-requests/{id}/cancel.
          hours_until_start == 24.0 exactly is NOT late (rule is strict `< 24`): sit A
          cancelled at start-24h00m posts no penalty and leaves reliability at 50; sit B
          cancelled at start-23h00m posts CANCELLATION_PENALTY -1.00 and reliability 42.
