        grounds:
          - validations[priority=22]
          - errors[ERR_QUARTER_NOT_OPEN]
          - validations[priority=36]
        distinguishing_aspect: |
          Direction-sensitive temporal rule: at the default clock (quarter 1) a quarter-2
          expenditure is in the future and returns ERR_QUARTER_NOT_OPEN, while the identical
          charge stamped quarter 1 passes the temporal gate and fails later at priority 36
          with ERR_APPROPRIATION_OVERSPEND — proving the first rejection was temporal and not
          a cash problem.
        setup_note: "Eleven-call chain to phase EXECUTION with one enacted GENERAL appropriation and nothing released."
        test_recipe:
          setup:
            - "Agency DOH; BudgetCycle 2027 in phase EXECUTION with ADOPTED GENERAL revenue of 10000000000 cents; logical clock at the default 2026-08-01, which is quarter 1"
            - "GENERAL Appropriation P100 enacted 2000000000 with released_cents 0"
