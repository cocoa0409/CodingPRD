  # =====================================================================
  # Section: errors
  # =====================================================================
  - section: errors
    instances:
      - name: error_envelope_shape
        claim_type: violation_to_error
        grounds: [response_envelope.error, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "Error responses carry response_type == 'error' and data.error_id + data.message keys; success responses carry meta.api_request_id and response_type object/array."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /clinical-ladder/nurses/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ProgramAdmin
              captures: { env_err: $.data.error_id, env_msg: $.data.message }
          assert:
            - "env_err == ERR_NOT_FOUND and env_msg is a non-empty string"

      - name: all_declared_errors_triggerable
        claim_type: violation_to_error
        grounds: [errors]
        distinguishing_aspect: "Coverage bookkeeping: every error id in §1.6 is exercised by at least one §1.8 or §1.9 instance (audited by enumeration, no separate runtime test)."
        excluded_because:
          difficulty_instance: state_vs_fiscal_on_claim_pay
          rationale: "ERR_INVALID_STATE, ERR_STALE_VERSION, ERR_SEGREGATION_OF_DUTIES, ERR_STALE_REFERENCE, ERR_REIMBURSEMENT_CAP_EXHAUSTED, ERR_BUDGET_EXCEEDED, ERR_MAINTENANCE_SCORE_INSUFFICIENT, ERR_REVIEW_CYCLE_EXHAUSTED are all asserted inside §1.8 instances; the remainder each carry a dedicated §1.9 instance above."

