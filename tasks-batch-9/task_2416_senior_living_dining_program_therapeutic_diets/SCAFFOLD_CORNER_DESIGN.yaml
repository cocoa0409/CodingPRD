        grounds:
          - roles[RegisteredDietitian].exclusive_operations
          - validations[priority=2]
          - errors[id=ERR_FORBIDDEN_ROLE]
        distinguishing_aspect: "Role refusal is decided at priority 2, before any state check: ClinicalStaff is refused on a DRAFT cycle with ERR_FORBIDDEN_ROLE rather than the ERR_INVALID_STATE the correct role would have received."
        test_recipe:
