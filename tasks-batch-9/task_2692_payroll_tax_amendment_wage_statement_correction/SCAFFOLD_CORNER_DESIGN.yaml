      - name: report_undeliverable_on_a_portal_statement_is_refused
        claim_type: Conditional action
        grounds:
          - validations.priority_75.ERR_CHANNEL_NOT_UNDELIVERABLE_CAPABLE
          - state_machines.CorrectedWageStatement.ISSUED_to_RETURNED_UNDELIVERABLE
        distinguishing_aspect: "The undeliverable path exists only for physical mail: an ISSUED statement delivered through PORTAL cannot come back undeliverable, so the call is refused at priority 75 and the statement stays ISSUED with undeliverable_reason null."
        test_recipe:
          setup:
            - "Logical clock at 2026-04-30T00:00:00Z."
            - "Employer Acme, federal agency FED-941 with jurisdiction_code US, employee Dana."
            - "A 2025 Q1 register line of 1000000 cents in jurisdiction NJ at workday_ratio_bps 4000 and a filed return matching the register totals, so reconciliation emits exactly one JURISDICTION_ASSIGNMENT discrepancy of 400000 cents."
            - "That discrepancy is categorised and a statement for tax year 2025 has been created and issued through PORTAL."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-30T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /employers"
              payload: { legal_name: "Acme Manufacturing", fein: "12-3456789", deposit_schedule: "MONTHLY", authorization_limit_cents: 5000000 }
              as: PlatformAdmin
              captures: { emp_id: "$.data.id" }
            - call: "POST /tax-agencies"
              payload: { agency_code: "FED-941", level: "FEDERAL", jurisdiction_code: "US", interest_rate_bps_annual: 800, interest_method: "STATUTORY_DAILY", penalty_multiplier_bps: 10000, min_days_between_amendments: 30, amendment_window_days: 1095, requires_registration: false }
              as: PlatformAdmin
              captures: { fed_id: "$.data.id" }
            - call: "POST /employees"
              payload: { employer_id: "${emp_id}", full_name: "Dana Reed", national_id_last4: "4821", mailing_state_code: "NJ" }
              as: PayrollAnalyst
              captures: { e1_id: "$.data.id" }
            - call: "POST /payroll-register-lines"
              payload: { employer_id: "${emp_id}", employee_id: "${e1_id}", agency_id: "${fed_id}", tax_year: 2025, quarter: 1, taxable_wage_cents: 1000000, withheld_cents: 150000, work_jurisdiction_code: "NJ", workday_ratio_bps: 4000 }
              as: PayrollAnalyst
            - call: "POST /filed-returns"
              payload: { employer_id: "${emp_id}", agency_id: "${fed_id}", tax_year: 2025, quarter: 1, form_code: "941X", filed_at: "2025-04-30T00:00:00Z", reported_taxable_wage_cents: 1000000, reported_withheld_cents: 150000 }
              as: TaxPreparer
            - call: "POST /correction-cases"
              payload: { employer_id: "${emp_id}", agency_id: "${fed_id}", tax_year: 2025, quarter: 1 }
              as: PayrollAnalyst
              captures: { case_id: "$.data.id" }
            - call: "POST /correction-cases/${case_id}/reconcile"
              payload: {}
              as: PayrollAnalyst
            - call: "GET /discrepancies"
              payload: { correction_case_id: "${case_id}", category: "JURISDICTION_ASSIGNMENT" }
              as: PayrollAnalyst
              captures: { d_jur_id: "$.data[0].id" }
            - call: "POST /discrepancies/${d_jur_id}/categorize"
              payload: { category: "JURISDICTION_ASSIGNMENT", root_cause_code: "JURISDICTION_MAPPING_ERROR" }
              as: PayrollAnalyst
            - call: "POST /corrected-wage-statements"
              payload: { correction_case_id: "${case_id}", employee_id: "${e1_id}", tax_year: 2025, delivery_channel: "PORTAL" }
              as: TaxPreparer
              captures: { st_id: "$.data.id" }
            - call: "POST /corrected-wage-statements/${st_id}/issue"
              payload: {}
              as: TaxPreparer
          trigger:
            - call: "POST /corrected-wage-statements/${st_id}/report-undeliverable"
              payload: { undeliverable_reason: "Returned by the postal service." }
              as: TaxPreparer
          assert:
            - "HTTP status is 422"
            - "response data.error_id == ERR_CHANNEL_NOT_UNDELIVERABLE_CAPABLE"
            - "CorrectedWageStatement.${st_id}.status == ISSUED"
            - "CorrectedWageStatement.${st_id}.undeliverable_reason == null"
            - "CorrectedWageStatement.${st_id}.wage_delta_cents == -400000 and fica_wage_delta_cents == -400000 and withholding_delta_cents == 0"
            - "Employee.${e1_id}.active_statement_count == 1"

      - name: notice_links_to_a_case_and_an_unknown_case_returns_not_found
        claim_type: Cross-reference link
        grounds:
          - endpoints.POST_/agency-notices
          - validations.priority_11.ERR_CORRECTION_CASE_NOT_FOUND
        distinguishing_aspect: "correction_case_id is the one optional cross-reference on AgencyNotice: supplied and valid it creates the association that later feeds case_exposure_rollup; supplied and absent it is a body-FK 404 rather than a silently ignored field."
        test_recipe:
          setup:
            - "An employer, a federal agency and an OPEN 2025 Q1 correction case."
          setup_api_calls:
            - call: "POST /employers"
              payload: { legal_name: "Acme Manufacturing", fein: "12-3456789", deposit_schedule: "MONTHLY", authorization_limit_cents: 5000000 }
              as: PlatformAdmin
              captures: { emp_id: "$.data.id" }
            - call: "POST /tax-agencies"
              payload: { agency_code: "FED-941", level: "FEDERAL", jurisdiction_code: "US", interest_rate_bps_annual: 800, interest_method: "STATUTORY_DAILY", penalty_multiplier_bps: 10000, min_days_between_amendments: 30, amendment_window_days: 1095, requires_registration: false }
              as: PlatformAdmin
              captures: { fed_id: "$.data.id" }
            - call: "POST /correction-cases"
              payload: { employer_id: "${emp_id}", agency_id: "${fed_id}", tax_year: 2025, quarter: 1 }
              as: PayrollAnalyst
              captures: { case_id: "$.data.id" }
          trigger:
            - call: "POST /agency-notices"
              payload: { employer_id: "${emp_id}", agency_id: "${fed_id}", tax_year: 2025, quarter: 1, notice_number: "CP-136-01", assessed_tax_cents: 100000, assessed_penalty_cents: 20000, assessed_interest_cents: 5000, response_due_date: "2026-06-30", correction_case_id: "${case_id}" }
              as: TaxOfficer
              captures: { notice_id: "$.data.id" }
            - call: "POST /agency-notices"
              payload: { employer_id: "${emp_id}", agency_id: "${fed_id}", tax_year: 2025, quarter: 1, notice_number: "CP-136-02", assessed_tax_cents: 100000, assessed_penalty_cents: 20000, assessed_interest_cents: 5000, response_due_date: "2026-06-30", correction_case_id: "00000000-0000-0000-0000-000000009999" }
              as: TaxOfficer
          assert:
            - "the first call returns HTTP 201 and AgencyNotice.${notice_id}.correction_case_id == ${case_id}"
            - "AgencyNotice.${notice_id}.response_status == RECEIVED and abatement_status == NONE and abatement_round == 0"
            - "the second call returns HTTP 404 with data.error_id == ERR_CORRECTION_CASE_NOT_FOUND"
            - "GET /agency-notices?employer_id=${emp_id} returns total_count == 1"

      - name: success_and_error_responses_use_the_declared_envelope
        claim_type: Response envelope
        grounds:
          - response_envelope.success
          - response_envelope.error
        distinguishing_aspect: "Every response carries meta.api_request_id and meta.api_request_timestamp; a single-object read reports response_type object, a list reports array with the four pagination fields, and a failure reports error with the payload collapsed to error_id plus message."
        test_recipe:
          setup:
            - "One employer exists."
          setup_api_calls:
            - call: "POST /employers"
              payload: { legal_name: "Acme Manufacturing", fein: "12-3456789", deposit_schedule: "MONTHLY", authorization_limit_cents: 5000000 }
              as: PlatformAdmin
              captures: { emp_id: "$.data.id" }
          trigger:
            - call: "GET /employers/${emp_id}"
              payload: {}
              as: PlatformAdmin
            - call: "GET /employers"
              payload: {}
              as: PlatformAdmin
            - call: "GET /employers/00000000-0000-0000-0000-000000009999"
              payload: {}
              as: PlatformAdmin
              captures: { err_id: "$.data.error_id" }
          assert:
            - "the single read returns 200 with response_type == object and meta.api_request_id and meta.api_request_timestamp both present"
            - "the list read returns 200 with response_type == array and carries limit, offset, total_count and has_more"
            - "the failing read returns 404 with response_type == error"
            - "${err_id} == ERR_EMPLOYER_NOT_FOUND and data.message is a non-empty string"
            - "the error response body contains no entity fields beyond error_id and message"

      - name: list_endpoints_apply_the_default_limit_together_with_a_filter
        claim_type: Listing with filtering
        grounds:
          - response_envelope.pagination_defaults
          - endpoints.GET_/correction-cases
        distinguishing_aspect: "With limit omitted the declared default of 10 is echoed and offset defaults to 0, and the status filter is applied BEFORE pagination so total_count counts only the filtered rows, not every case for the employer."
        test_recipe:
          setup:
            - "One employer, one federal agency and three OPEN correction cases for 2025 Q1, Q2 and Q3."
          setup_api_calls:
            - call: "POST /employers"
              payload: { legal_name: "Acme Manufacturing", fein: "12-3456789", deposit_schedule: "MONTHLY", authorization_limit_cents: 5000000 }
              as: PlatformAdmin
              captures: { emp_id: "$.data.id" }
            - call: "POST /tax-agencies"
              payload: { agency_code: "FED-941", level: "FEDERAL", jurisdiction_code: "US", interest_rate_bps_annual: 800, interest_method: "STATUTORY_DAILY", penalty_multiplier_bps: 10000, min_days_between_amendments: 30, amendment_window_days: 1095, requires_registration: false }
              as: PlatformAdmin
              captures: { fed_id: "$.data.id" }
            - call: "POST /correction-cases"
              payload: { employer_id: "${emp_id}", agency_id: "${fed_id}", tax_year: 2025, quarter: 1 }
              as: PayrollAnalyst
            - call: "POST /correction-cases"
              payload: { employer_id: "${emp_id}", agency_id: "${fed_id}", tax_year: 2025, quarter: 2 }
              as: PayrollAnalyst
            - call: "POST /correction-cases"
              payload: { employer_id: "${emp_id}", agency_id: "${fed_id}", tax_year: 2025, quarter: 3 }
              as: PayrollAnalyst
          trigger:
            - call: "GET /correction-cases"
              payload: { employer_id: "${emp_id}", status: "OPEN" }
              as: PayrollAnalyst
            - call: "GET /correction-cases"
              payload: { employer_id: "${emp_id}", status: "CLOSED" }
              as: PayrollAnalyst
          assert:
            - "the first list returns limit == 10 and offset == 0 without either being supplied"
            - "the first list returns total_count == 3 and has_more == false with 3 rows"
            - "the second list returns total_count == 0 and has_more == false with an empty data array"
            - "the second list still reports response_type == array and limit == 10"

      - name: action_endpoints_drive_their_declared_transition
        claim_type: Action endpoint
        grounds:
          - endpoints.POST_/amended-returns/{amended_return_id}/prepare
        excluded_because:
          difficulty_instance: amended_return_rejected_returns_to_draft_and_reprepares
          rationale: "That §1.8 instance exercises prepare, sign, submit and agency-outcome in one chain and asserts each resulting state and side effect, so a standalone action-endpoint probe would add nothing."

  - section: errors
    instances:

      - name: every_path_parameter_not_found_returns_its_entity_specific_error
        claim_type: Error triggerability
        grounds:
          - validations.priority_10
          - errors.ERR_TAX_AGENCY_NOT_FOUND
          - errors.ERR_AGENCY_ACCOUNT_NOT_FOUND
          - errors.ERR_REGISTER_LINE_NOT_FOUND
          - errors.ERR_DEPOSIT_RECORD_NOT_FOUND
          - errors.ERR_FILED_RETURN_NOT_FOUND
          - errors.ERR_DISCREPANCY_NOT_FOUND
          - errors.ERR_AMENDED_RETURN_NOT_FOUND
          - errors.ERR_STATEMENT_NOT_FOUND
          - errors.ERR_WAGE_REPAYMENT_NOT_FOUND
          - errors.ERR_AGENCY_NOTICE_NOT_FOUND
          - errors.ERR_CONTROL_REMEDIATION_NOT_FOUND
        distinguishing_aspect: "The catalog carries fourteen distinct 404 ids; a shared generic ERR_NOT_FOUND would pass a single-entity test, so every path-parameter family is probed with the same absent UUID and each must name its own entity."
        test_recipe:
          setup:
            - "One employer exists so the store is non-empty; no other row of any kind is created."
          setup_api_calls:
            - call: "POST /employers"
              payload: { legal_name: "Acme Manufacturing", fein: "12-3456789", deposit_schedule: "MONTHLY", authorization_limit_cents: 5000000 }
              as: PlatformAdmin
              captures: { emp_id: "$.data.id" }
          trigger:
            - call: "GET /tax-agencies/00000000-0000-0000-0000-000000009001"
              payload: {}
              as: PlatformAdmin
            - call: "GET /agency-accounts/00000000-0000-0000-0000-000000009002"
              payload: {}
              as: PlatformAdmin
            - call: "GET /employees/00000000-0000-0000-0000-000000009003"
              payload: {}
              as: PlatformAdmin
            - call: "GET /payroll-register-lines/00000000-0000-0000-0000-000000009004"
              payload: {}
              as: PlatformAdmin
            - call: "GET /deposit-records/00000000-0000-0000-0000-000000009005"
              payload: {}
              as: PlatformAdmin
            - call: "GET /filed-returns/00000000-0000-0000-0000-000000009006"
              payload: {}
              as: PlatformAdmin
            - call: "GET /discrepancies/00000000-0000-0000-0000-000000009007"
              payload: {}
              as: PlatformAdmin
            - call: "GET /amended-returns/00000000-0000-0000-0000-000000009008"
              payload: {}
              as: PlatformAdmin
            - call: "GET /corrected-wage-statements/00000000-0000-0000-0000-000000009009"
              payload: {}
              as: PlatformAdmin
            - call: "GET /wage-repayments/00000000-0000-0000-0000-000000009010"
              payload: {}
              as: PlatformAdmin
            - call: "GET /agency-notices/00000000-0000-0000-0000-000000009011"
              payload: {}
              as: PlatformAdmin
            - call: "GET /control-remediations/00000000-0000-0000-0000-000000009012"
              payload: {}
              as: PlatformAdmin
          assert:
            - "every one of the twelve reads returns HTTP 404"
            - "the tax-agency read returns error_id ERR_TAX_AGENCY_NOT_FOUND"
            - "the agency-account read returns error_id ERR_AGENCY_ACCOUNT_NOT_FOUND"
            - "the employee read returns error_id ERR_EMPLOYEE_NOT_FOUND"
            - "the register-line read returns error_id ERR_REGISTER_LINE_NOT_FOUND"
            - "the deposit-record read returns error_id ERR_DEPOSIT_RECORD_NOT_FOUND"
            - "the filed-return read returns error_id ERR_FILED_RETURN_NOT_FOUND"
            - "the discrepancy read returns error_id ERR_DISCREPANCY_NOT_FOUND"
            - "the amended-return read returns error_id ERR_AMENDED_RETURN_NOT_FOUND"
            - "the statement read returns error_id ERR_STATEMENT_NOT_FOUND"
            - "the wage-repayment read returns error_id ERR_WAGE_REPAYMENT_NOT_FOUND"
            - "the agency-notice read returns error_id ERR_AGENCY_NOTICE_NOT_FOUND"
            - "the control-remediation read returns error_id ERR_CONTROL_REMEDIATION_NOT_FOUND"
            - "Employer.${emp_id} still exists and no row was created by any of the failing reads"

      - name: duplicate_natural_keys_are_rejected
        claim_type: Error triggerability
        grounds:
          - validations.priority_72
          - errors.ERR_DUPLICATE_EMPLOYER_FEIN
          - errors.ERR_DUPLICATE_AGENCY_CODE
          - errors.ERR_DUPLICATE_FILED_RETURN
          - errors.ERR_DUPLICATE_NOTICE_NUMBER
        distinguishing_aspect: "Priority 72 bundles four different uniqueness scopes: fein is global, agency_code is global, notice_number is unique only within its agency, and the filed-return key is the five-part period-and-form tuple, so each needs its own 409 id."
        test_recipe:
          setup:
            - "Employer Acme with fein 12-3456789, agencies FED-941 and NY-45, one filed 2025 Q1 941X return and notice CP-136-01 on the federal agency."
          setup_api_calls:
            - call: "POST /employers"
              payload: { legal_name: "Acme Manufacturing", fein: "12-3456789", deposit_schedule: "MONTHLY", authorization_limit_cents: 5000000 }
              as: PlatformAdmin
              captures: { emp_id: "$.data.id" }
            - call: "POST /tax-agencies"
              payload: { agency_code: "FED-941", level: "FEDERAL", jurisdiction_code: "US", interest_rate_bps_annual: 800, interest_method: "STATUTORY_DAILY", penalty_multiplier_bps: 10000, min_days_between_amendments: 30, amendment_window_days: 1095, requires_registration: false }
              as: PlatformAdmin
              captures: { fed_id: "$.data.id" }
            - call: "POST /tax-agencies"
              payload: { agency_code: "NY-45", level: "STATE", jurisdiction_code: "NY", interest_rate_bps_annual: 900, interest_method: "DEPOSIT_WEIGHTED", penalty_multiplier_bps: 5000, min_days_between_amendments: 45, amendment_window_days: 1095, requires_registration: true }
              as: PlatformAdmin
              captures: { ny_id: "$.data.id" }
            - call: "POST /filed-returns"
              payload: { employer_id: "${emp_id}", agency_id: "${fed_id}", tax_year: 2025, quarter: 1, form_code: "941X", filed_at: "2025-04-30T00:00:00Z", reported_taxable_wage_cents: 4750000, reported_withheld_cents: 500000 }
              as: TaxPreparer
            - call: "POST /agency-notices"
              payload: { employer_id: "${emp_id}", agency_id: "${fed_id}", tax_year: 2025, quarter: 1, notice_number: "CP-136-01", assessed_tax_cents: 100000, assessed_penalty_cents: 20000, assessed_interest_cents: 5000, response_due_date: "2026-06-30" }
              as: TaxOfficer
          trigger:
            - call: "POST /employers"
              payload: { legal_name: "Acme Holdings", fein: "12-3456789", deposit_schedule: "SEMIWEEKLY", authorization_limit_cents: 100000 }
              as: PlatformAdmin
            - call: "POST /tax-agencies"
              payload: { agency_code: "FED-941", level: "FEDERAL", jurisdiction_code: "US", interest_rate_bps_annual: 700, interest_method: "STATUTORY_DAILY", penalty_multiplier_bps: 10000, min_days_between_amendments: 30, amendment_window_days: 1095 }
              as: PlatformAdmin
            - call: "POST /filed-returns"
              payload: { employer_id: "${emp_id}", agency_id: "${fed_id}", tax_year: 2025, quarter: 1, form_code: "941X", filed_at: "2025-05-01T00:00:00Z", reported_taxable_wage_cents: 1, reported_withheld_cents: 1 }
              as: TaxPreparer
            - call: "POST /agency-notices"
              payload: { employer_id: "${emp_id}", agency_id: "${fed_id}", tax_year: 2025, quarter: 2, notice_number: "CP-136-01", assessed_tax_cents: 1, assessed_penalty_cents: 1, assessed_interest_cents: 1, response_due_date: "2026-07-31" }
              as: TaxOfficer
            - call: "POST /agency-notices"
              payload: { employer_id: "${emp_id}", agency_id: "${ny_id}", tax_year: 2025, quarter: 1, notice_number: "CP-136-01", assessed_tax_cents: 1, assessed_penalty_cents: 1, assessed_interest_cents: 1, response_due_date: "2026-07-31" }
              as: TaxOfficer
          assert:
            - "the duplicate employer returns 409 with error_id ERR_DUPLICATE_EMPLOYER_FEIN"
            - "the duplicate agency returns 409 with error_id ERR_DUPLICATE_AGENCY_CODE"
            - "the duplicate filed return returns 409 with error_id ERR_DUPLICATE_FILED_RETURN"
            - "the same notice_number on the SAME agency returns 409 with error_id ERR_DUPLICATE_NOTICE_NUMBER even though the quarter differs"
            - "the same notice_number on a DIFFERENT agency returns 201, because notice_number is unique only within its agency"
            - "GET /employers?fein=12-3456789 returns total_count == 1"

      - name: list_with_limit_over_max_returns_invalid_pagination
        claim_type: Error triggerability
        grounds:
          - validations.priority_21
          - errors.ERR_INVALID_PAGINATION
          - response_envelope.pagination_defaults
        distinguishing_aspect: "The declared bounds are 1..100 inclusive, so 100 must succeed while 101 and 0 must both fail, and a negative offset fails independently of limit."
        test_recipe:
          setup:
            - "One employer exists so every list has something to page over."
          setup_api_calls:
            - call: "POST /employers"
              payload: { legal_name: "Acme Manufacturing", fein: "12-3456789", deposit_schedule: "MONTHLY", authorization_limit_cents: 5000000 }
              as: PlatformAdmin
          trigger:
            - call: "GET /employers?limit=100"
              payload: { limit: 100 }
              as: PlatformAdmin
            - call: "GET /employers?limit=101"
              payload: { limit: 101 }
              as: PlatformAdmin
            - call: "GET /employers?limit=0"
              payload: { limit: 0 }
              as: PlatformAdmin
            - call: "GET /employers?offset=-1"
              payload: { offset: -1 }
              as: PlatformAdmin
          assert:
            - "limit 100 returns HTTP 200 with limit == 100 echoed"
