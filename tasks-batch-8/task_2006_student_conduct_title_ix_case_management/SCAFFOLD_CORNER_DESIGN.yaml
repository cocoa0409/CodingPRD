              as: TitleIXCoordinator
              as_user_id: "${coord_id}"
              captures: { d_id: $.data.id }
            - { call: "POST /api/cases/${case_id}/confirm-jurisdiction", as: TitleIXCoordinator, as_user_id: "${coord_id}" }
            - { call: "POST /api/cases/${case_id}/file-formal-complaint", as: Party, as_user_id: "${comp_id}" }
            - call: "POST /api/cases/${case_id}/investigator-assignments"
              payload: { investigator_id: "${inv_id}" }
              as: TitleIXCoordinator
              as_user_id: "${coord_id}"
              captures: { asg_id: $.data.id }
            - { call: "POST /api/investigator-assignments/${asg_id}/accept", as: Investigator, as_user_id: "${inv_id}" }
            - { call: "GET /api/cases/${case_id}", as: TitleIXCoordinator, as_user_id: "${coord_id}", captures: { v1: $.data.version } }
            - call: "POST /api/cases/${case_id}/evidence-packets"
              payload: { expected_case_version: "${v1}" }
