            - { call: "POST /arff/incidents", payload: { alert_level: "ALERT_1", location: "Taxiway B" }, as: ArffChief, captures: { inc1: $.data.id } }
            - { call: "POST /arff/incidents/${inc1}/respond", as: ArffChief }
            - { call: "POST /arff/incidents/${inc1}/control", as: ArffChief }
            - { call: "POST /arff/_clock/set_current_utc", payload: { to_iso8601: "2026-05-12T00:00:00Z" }, as: AirportManager }
          trigger:
            - { call: "POST /arff/incidents/${inc1}/reports", payload: { narrative: "Too short." }, as: SafetyOfficer, as_user_id: "user-so-1", captures: { err: $.data.error_id } }
          assert:
            - "${err} == \"ERR_REPORT_WINDOW_EXPIRED\"  # temporal (priority 7) beats constraint (priority 8); ERR_NARRATIVE_TOO_SHORT must NOT surface"

  # ---------------------------------------------------------------------------
  # Rule 6: boundary_precision_check — different metrics on different endpoints
  # (drill seconds threshold vs training calendar-month window)
  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: bp_drill_first_vehicle_180_seconds_boundary
        grounds:
          - calculations.drill_outcome_threshold
          - entities.ResponseDrill.fields.outcome
        distinguishing_aspect: |
          Seconds metric on the drill execute/certify endpoints: exactly 180 s passes
          (threshold inclusive), 181 s fails; exactly 240 s on all-vehicles also passes.
        test_recipe:
          setup:
            - "Compliant index-C airport; two SCHEDULED drills on runway 09L in disjoint windows"
          setup_api_calls:
            - { call: "POST /arff/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: AirportManager }
            - { call: "POST /arff/airport-profile", payload: { airport_code: "KDEMO", certificated_index: "C" }, as: AirportManager }
            - { call: "POST /arff/aircraft", payload: { model_name: "B737-900", length_ft: 138.2, avg_daily_departures: 6.0, in_scheduled_service: true }, as: AirportManager }
            - { call: "POST /arff/vehicles", payload: { call_sign: "RED-1", water_capacity_gal: 2000, dry_chem_capacity_lb: 500 }, as: ArffChief, captures: { veh1: $.data.id } }
            - { call: "POST /arff/vehicles", payload: { call_sign: "RED-2", water_capacity_gal: 2000, dry_chem_capacity_lb: 500 }, as: ArffChief, captures: { veh2: $.data.id } }
            - { call: "POST /arff/readiness-checks", payload: { vehicle_id: "${veh1}", water_available_gal: 2000, dry_chem_available_lb: 500, discharge_system_ok: true }, as: ArffChief }
            - { call: "POST /arff/readiness-checks", payload: { vehicle_id: "${veh2}", water_available_gal: 2000, dry_chem_available_lb: 500, discharge_system_ok: true }, as: ArffChief }
            - { call: "POST /arff/firefighters", payload: { employee_no: "FF-101", full_name: "Ann Lee" }, as: ArffChief, captures: { ff1: $.data.id } }
            - { call: "POST /arff/firefighters", payload: { employee_no: "FF-102", full_name: "Ben Kim" }, as: ArffChief, captures: { ff2: $.data.id } }
            - { call: "POST /arff/firefighters", payload: { employee_no: "FF-103", full_name: "Cal Ray" }, as: ArffChief, captures: { ff3: $.data.id } }
            - { call: "POST /arff/firefighters", payload: { employee_no: "FF-104", full_name: "Dee Fox" }, as: ArffChief, captures: { ff4: $.data.id } }
            - { call: "POST /arff/live-fire-training-records", payload: { firefighter_id: "${ff1}", completed_on: "2026-04-15", drill_type: "AIRCRAFT", result: "PASS" }, as: ArffChief }
            - { call: "POST /arff/live-fire-training-records", payload: { firefighter_id: "${ff2}", completed_on: "2026-04-15", drill_type: "AIRCRAFT", result: "PASS" }, as: ArffChief }
            - { call: "POST /arff/live-fire-training-records", payload: { firefighter_id: "${ff3}", completed_on: "2026-04-15", drill_type: "STRUCTURAL", result: "PASS" }, as: ArffChief }
            - { call: "POST /arff/live-fire-training-records", payload: { firefighter_id: "${ff4}", completed_on: "2026-04-15", drill_type: "STRUCTURAL", result: "PASS" }, as: ArffChief }
            - { call: "POST /arff/response-drills", payload: { runway_designator: "09L", scheduled_start: "2026-05-02T10:00:00Z", scheduled_end: "2026-05-02T11:00:00Z" }, as: ArffChief, captures: { drill1: $.data.id } }
            - { call: "POST /arff/response-drills", payload: { runway_designator: "09L", scheduled_start: "2026-05-02T12:00:00Z", scheduled_end: "2026-05-02T13:00:00Z" }, as: ArffChief, captures: { drill2: $.data.id } }
            - { call: "POST /arff/_clock/set_current_utc", payload: { to_iso8601: "2026-05-02T10:30:00Z" }, as: AirportManager }
            - { call: "POST /arff/response-drills/${drill1}/execute", payload: { first_vehicle_arrival_seconds: 180, all_vehicles_arrival_seconds: 240 }, as: ArffChief }
            - { call: "POST /arff/_clock/set_current_utc", payload: { to_iso8601: "2026-05-02T12:30:00Z" }, as: AirportManager }
            - { call: "POST /arff/response-drills/${drill2}/execute", payload: { first_vehicle_arrival_seconds: 181, all_vehicles_arrival_seconds: 200 }, as: ArffChief }
          trigger:
            - { call: "POST /arff/response-drills/${drill1}/certify", as: ArffChief, captures: { d1_status: $.data.status } }
            - { call: "POST /arff/response-drills/${drill2}/certify", as: ArffChief, captures: { err_d2: $.data.error_id } }
            - { call: "GET /arff/response-drills/${drill2}", as: ArffChief, captures: { d2_outcome: $.data.outcome } }
          assert:
            - "ResponseDrill.${drill1}.outcome == \"PASS\" and status == \"CERTIFIED\"  # 180 and 240 both inclusive"
            - "ResponseDrill.${drill2}.outcome == \"FAIL\"  # 181 > 180"
            - "${err_d2} == \"ERR_RESPONSE_TIME_EXCEEDED\""

      - name: bp_training_currency_twelve_month_boundary
        grounds:
          - calculations.training_currency_window
          - entities.Firefighter.fields.is_training_current
        distinguishing_aspect: |
          Calendar-month metric on the firefighter read endpoint (different metric and
          endpoint from the drill-seconds instance): training in month M is current through
          the last day of month M+12 (diff == 12 passes) and lapses in month M+13
          (diff == 13 fails).
        test_recipe:
          setup:
            - "Airport profile exists; one firefighter trained 2025-06-15 (PASS)"
          setup_api_calls:
            - { call: "POST /arff/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: AirportManager }
            - { call: "POST /arff/airport-profile", payload: { airport_code: "KDEMO", certificated_index: "C" }, as: AirportManager }
            - { call: "POST /arff/firefighters", payload: { employee_no: "FF-101", full_name: "Ann Lee" }, as: ArffChief, captures: { ff1: $.data.id } }
            - { call: "POST /arff/live-fire-training-records", payload: { firefighter_id: "${ff1}", completed_on: "2025-06-15", drill_type: "AIRCRAFT", result: "PASS" }, as: ArffChief }
          trigger:
            - { call: "POST /arff/_clock/set_current_utc", payload: { to_iso8601: "2026-06-30T23:59:00Z" }, as: AirportManager }
            - { call: "GET /arff/firefighters/${ff1}", as: ArffChief, captures: { cur_jun: $.data.is_training_current } }
            - { call: "POST /arff/_clock/set_current_utc", payload: { to_iso8601: "2026-07-01T00:00:00Z" }, as: AirportManager }
            - { call: "GET /arff/firefighters/${ff1}", as: ArffChief, captures: { cur_jul: $.data.is_training_current } }
          assert:
            - "${cur_jun} == true   # month_index diff = (2026*12+6) - (2025*12+6) = 12 <= 12"
            - "${cur_jul} == false  # diff = 13 > 12"

  # ---------------------------------------------------------------------------
  # Rule 7: cross_entity_state_dependency — different entity pairs
  # (MutualAidRequest x AlertIncident vs FaaInspection x IndexDowngradeNotification)
  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: ce_mutual_aid_request_requires_incident_open
        grounds:
          - state_machines.AlertIncident.CONTROLLED_to_CLOSED
          - "validations[priority=6]"
          - entities.MutualAidRequest.fields.incident_id
        distinguishing_aspect: |
          Entity pair MutualAidRequest x AlertIncident: request creation succeeds against
          a REPORTED incident and is rejected with ERR_INCIDENT_NOT_RESPONDING against a
          CONTROLLED incident — the request's creatability depends on the incident's state.
        test_recipe:
          setup:
            - "Compliant index-C airport; ACTIVE agreement with partner KCTY covering through ALERT_2"
            - "incident1 ALERT_1 in REPORTED; incident2 ALERT_1 driven REPORTED -> RESPONDING -> CONTROLLED"
          setup_api_calls:
            - { call: "POST /arff/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: AirportManager }
            - { call: "POST /arff/airport-profile", payload: { airport_code: "KDEMO", certificated_index: "C" }, as: AirportManager }
            - { call: "POST /arff/aircraft", payload: { model_name: "B737-900", length_ft: 138.2, avg_daily_departures: 6.0, in_scheduled_service: true }, as: AirportManager }
            - { call: "POST /arff/vehicles", payload: { call_sign: "RED-1", water_capacity_gal: 2000, dry_chem_capacity_lb: 500 }, as: ArffChief, captures: { veh1: $.data.id } }
            - { call: "POST /arff/vehicles", payload: { call_sign: "RED-2", water_capacity_gal: 2000, dry_chem_capacity_lb: 500 }, as: ArffChief, captures: { veh2: $.data.id } }
            - { call: "POST /arff/readiness-checks", payload: { vehicle_id: "${veh1}", water_available_gal: 2000, dry_chem_available_lb: 500, discharge_system_ok: true }, as: ArffChief }
            - { call: "POST /arff/readiness-checks", payload: { vehicle_id: "${veh2}", water_available_gal: 2000, dry_chem_available_lb: 500, discharge_system_ok: true }, as: ArffChief }
            - { call: "POST /arff/firefighters", payload: { employee_no: "FF-101", full_name: "Ann Lee" }, as: ArffChief, captures: { ff1: $.data.id } }
            - { call: "POST /arff/firefighters", payload: { employee_no: "FF-102", full_name: "Ben Kim" }, as: ArffChief, captures: { ff2: $.data.id } }
            - { call: "POST /arff/firefighters", payload: { employee_no: "FF-103", full_name: "Cal Ray" }, as: ArffChief, captures: { ff3: $.data.id } }
            - { call: "POST /arff/firefighters", payload: { employee_no: "FF-104", full_name: "Dee Fox" }, as: ArffChief, captures: { ff4: $.data.id } }
            - { call: "POST /arff/live-fire-training-records", payload: { firefighter_id: "${ff1}", completed_on: "2026-04-15", drill_type: "AIRCRAFT", result: "PASS" }, as: ArffChief }
            - { call: "POST /arff/live-fire-training-records", payload: { firefighter_id: "${ff2}", completed_on: "2026-04-15", drill_type: "AIRCRAFT", result: "PASS" }, as: ArffChief }
            - { call: "POST /arff/live-fire-training-records", payload: { firefighter_id: "${ff3}", completed_on: "2026-04-15", drill_type: "STRUCTURAL", result: "PASS" }, as: ArffChief }
            - { call: "POST /arff/live-fire-training-records", payload: { firefighter_id: "${ff4}", completed_on: "2026-04-15", drill_type: "STRUCTURAL", result: "PASS" }, as: ArffChief }
            - { call: "POST /arff/mutual-aid-agreements", payload: { partner_airport_code: "KCTY", max_alert_level: "ALERT_2", start_date: "2026-01-01", end_date: "2026-12-31" }, as: AirportManager, captures: { ag1: $.data.id } }
            - { call: "POST /arff/mutual-aid-agreements/${ag1}/activate", as: AirportManager }
            - { call: "POST /arff/incidents", payload: { alert_level: "ALERT_1", location: "Runway 09L" }, as: ArffChief, captures: { inc1: $.data.id } }
            - { call: "POST /arff/incidents", payload: { alert_level: "ALERT_1", location: "Runway 27R" }, as: ArffChief, captures: { inc2: $.data.id } }
            - { call: "POST /arff/incidents/${inc2}/respond", as: ArffChief }
            - { call: "POST /arff/incidents/${inc2}/control", as: ArffChief }
          trigger:
            - { call: "POST /arff/incidents/${inc1}/mutual-aid-requests", payload: { agreement_id: "${ag1}", units_requested: 2 }, as: ArffChief, captures: { req1: $.data.id, req1_status: $.data.status } }
            - { call: "POST /arff/incidents/${inc2}/mutual-aid-requests", payload: { agreement_id: "${ag1}", units_requested: 1 }, as: ArffChief, captures: { err2: $.data.error_id } }
          assert:
            - "MutualAidRequest.${req1}.status == \"REQUESTED\"  # REPORTED incident accepts requests"
            - "${err2} == \"ERR_INCIDENT_NOT_RESPONDING\"  # CONTROLLED incident rejects them"

      - name: ce_inspection_blocked_by_open_notification
        grounds:
          - state_machines.FaaInspection.FINDINGS_ISSUED_to_CLOSED_PASS
          - state_machines.IndexDowngradeNotification.PENDING_to_RESOLVED
        distinguishing_aspect: |
          Entity pair FaaInspection x IndexDowngradeNotification (different pair from the
          mutual-aid instance): conclude-PASS is gated on zero notifications in
          {PENDING, ACKNOWLEDGED, OVERDUE}; acknowledging does not clear the gate — only
          the cascaded RESOLVED transition does.
        test_recipe:
          setup:
            - "Compliant index-C airport; one CERTIFIED drill executed 2026-05-02 (valid for 12 months)"
            - "Inspection 2026 in FINDINGS_ISSUED; RED-2 out of service so a notification is PENDING"
          setup_api_calls:
            - { call: "POST /arff/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: AirportManager }
            - { call: "POST /arff/airport-profile", payload: { airport_code: "KDEMO", certificated_index: "C" }, as: AirportManager }
            - { call: "POST /arff/aircraft", payload: { model_name: "B737-900", length_ft: 138.2, avg_daily_departures: 6.0, in_scheduled_service: true }, as: AirportManager }
            - { call: "POST /arff/vehicles", payload: { call_sign: "RED-1", water_capacity_gal: 2000, dry_chem_capacity_lb: 500 }, as: ArffChief, captures: { veh1: $.data.id } }
            - { call: "POST /arff/vehicles", payload: { call_sign: "RED-2", water_capacity_gal: 2000, dry_chem_capacity_lb: 500 }, as: ArffChief, captures: { veh2: $.data.id } }
            - { call: "POST /arff/readiness-checks", payload: { vehicle_id: "${veh1}", water_available_gal: 2000, dry_chem_available_lb: 500, discharge_system_ok: true }, as: ArffChief }
            - { call: "POST /arff/readiness-checks", payload: { vehicle_id: "${veh2}", water_available_gal: 2000, dry_chem_available_lb: 500, discharge_system_ok: true }, as: ArffChief }
            - { call: "POST /arff/firefighters", payload: { employee_no: "FF-101", full_name: "Ann Lee" }, as: ArffChief, captures: { ff1: $.data.id } }
            - { call: "POST /arff/firefighters", payload: { employee_no: "FF-102", full_name: "Ben Kim" }, as: ArffChief, captures: { ff2: $.data.id } }
            - { call: "POST /arff/firefighters", payload: { employee_no: "FF-103", full_name: "Cal Ray" }, as: ArffChief, captures: { ff3: $.data.id } }
            - { call: "POST /arff/firefighters", payload: { employee_no: "FF-104", full_name: "Dee Fox" }, as: ArffChief, captures: { ff4: $.data.id } }
            - { call: "POST /arff/live-fire-training-records", payload: { firefighter_id: "${ff1}", completed_on: "2026-04-15", drill_type: "AIRCRAFT", result: "PASS" }, as: ArffChief }
            - { call: "POST /arff/live-fire-training-records", payload: { firefighter_id: "${ff2}", completed_on: "2026-04-15", drill_type: "AIRCRAFT", result: "PASS" }, as: ArffChief }
            - { call: "POST /arff/live-fire-training-records", payload: { firefighter_id: "${ff3}", completed_on: "2026-04-15", drill_type: "STRUCTURAL", result: "PASS" }, as: ArffChief }
            - { call: "POST /arff/live-fire-training-records", payload: { firefighter_id: "${ff4}", completed_on: "2026-04-15", drill_type: "STRUCTURAL", result: "PASS" }, as: ArffChief }
            - { call: "POST /arff/response-drills", payload: { runway_designator: "09L", scheduled_start: "2026-05-02T10:00:00Z", scheduled_end: "2026-05-02T11:00:00Z" }, as: ArffChief, captures: { drill1: $.data.id } }
            - { call: "POST /arff/_clock/set_current_utc", payload: { to_iso8601: "2026-05-02T10:30:00Z" }, as: AirportManager }
            - { call: "POST /arff/response-drills/${drill1}/execute", payload: { first_vehicle_arrival_seconds: 120, all_vehicles_arrival_seconds: 200 }, as: ArffChief }
            - { call: "POST /arff/response-drills/${drill1}/certify", as: ArffChief }
            - { call: "POST /arff/faa-inspections", payload: { inspection_year: 2026, scheduled_on: "2026-05-03" }, as: AirportManager, captures: { insp1: $.data.id } }
            - { call: "POST /arff/faa-inspections/${insp1}/begin", as: FaaInspector }
            - { call: "POST /arff/faa-inspections/${insp1}/issue-findings", payload: { findings_count: 1 }, as: FaaInspector }
            - { call: "POST /arff/vehicles/${veh2}/out-of-service-events", payload: { reason: "Turret inoperative" }, as: ArffChief, captures: { oos1: $.data.id } }
            - { call: "GET /arff/index-downgrade-notifications", as: FaaInspector, captures: { n_id: "$.data[0].id" } }
          trigger:
            - { call: "POST /arff/faa-inspections/${insp1}/conclude", payload: { outcome: "PASS" }, as: FaaInspector, captures: { err_c1: $.data.error_id } }
            - { call: "POST /arff/index-downgrade-notifications/${n_id}/acknowledge", as: FaaInspector }
            - { call: "POST /arff/faa-inspections/${insp1}/conclude", payload: { outcome: "PASS" }, as: FaaInspector, captures: { err_c2: $.data.error_id } }
            - { call: "POST /arff/readiness-checks", payload: { vehicle_id: "${veh2}", water_available_gal: 2000, dry_chem_available_lb: 500, discharge_system_ok: true }, as: ArffChief }
            - { call: "POST /arff/out-of-service-events/${oos1}/restore", as: ArffChief }
            - { call: "POST /arff/faa-inspections/${insp1}/conclude", payload: { outcome: "PASS" }, as: FaaInspector, captures: { insp_status: $.data.status } }
