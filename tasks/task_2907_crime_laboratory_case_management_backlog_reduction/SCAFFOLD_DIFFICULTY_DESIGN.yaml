  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: testimony_travel_buffer_admits_a_gap_of_exactly_sixty_minutes
        grounds:
          - validations[priority=19]
          - validations[priority=18]
          - errors[ERR_TESTIMONY_SCHEDULE_CONFLICT]
          - entities.CourtEvent.fields.start_utc
          - entities.CourtEvent.fields.end_utc
        distinguishing_aspect: |
          The examiner's calendar is the contended resource and the overlap test is asymmetric: the
          EXISTING block is padded by TRAVEL_BUFFER_MINUTES (60) on both ends while the REQUESTED
          interval is compared half-open as [start, end). A block ending 09:00-11:00 therefore
          occupies 08:00-12:00, so a request starting 11:59 is refused and a request starting at
          exactly 12:00 is admitted - the seam is inclusive-of-nothing at the upper edge, which a
          naive symmetric-padding or closed-interval implementation gets wrong by exactly one minute.
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-08-01T00:00:00Z, so every hearing below has notice_days 31 and clears MIN_TESTIMONY_NOTICE_DAYS."
            - "Analysts A1 (author) and A2 (technical reviewer), both DIGITAL, competency 4, capacity 40.00, training 8.00."
            - "Method M1 VALIDATED, discipline DIGITAL, standard_hours_per_item 6.00, min_competency_level 3, max_items_per_request 4, expiry 2027-08-01T00:00:00Z."
            - "Case C1 (BURGLARY) ACCEPTED with one DIGITAL_DEVICE vault item E1."
            - "Request R1 carried to RELEASED with A1 as assigned analyst (assign -> start -> complete 6.00 -> technical AGREE by A2 -> administrative APPROVE)."
            - "CourtEvent CE1 on docket CR-2026-3001 occupies [2026-09-01T09:00:00Z, 2026-09-01T11:00:00Z); padded, it blocks [2026-09-01T08:00:00Z, 2026-09-01T12:00:00Z)."
          setup_api_calls:
            - call: "POST /lab/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: LabDirector
            - call: "POST /lab/analysts"
