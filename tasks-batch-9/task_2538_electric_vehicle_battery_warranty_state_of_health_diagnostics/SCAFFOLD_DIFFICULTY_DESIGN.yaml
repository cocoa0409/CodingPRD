  - rule_id: non_linear_state_machine
    instances:
      - name: claim_info_request_cycle_returns_to_submitted_with_changed_recommendation
        entity: WarrantyClaim
        shape: cyclic
        grounds:
          - state_machines.WarrantyClaim.SUBMITTED_to_INFO_REQUESTED
          - state_machines.WarrantyClaim.INFO_REQUESTED_to_SUBMITTED
          - entities.WarrantyClaim.fields.info_request_round
          - entities.WarrantyClaim.fields.recommended_remedy
          - entities.SohAssessment.fields.superseded
          - validations[priority=63]
        distinguishing_aspect: |
          The claim loops SUBMITTED -> INFO_REQUESTED -> SUBMITTED twice, but the loop is not
          idempotent: info_request_round is monotonic (never reset by the resubmit), the repointed
          assessment flips recommended_remedy from MODULE_REPLACEMENT to PACK_REPLACEMENT, and the
          third request-info is refused because the counter - not the state - is now exhausted.
        test_recipe:
          setup:
            - "Program with info_request_limit 2 and module_replacement_cap 3 (module_cap = FLOOR(16 * 0.25) = 4, so the module allowance is MIN(3, 4) = 3)."
            - "One vehicle in service 2020-03-10 with five fresh snapshots giving retention 70.00 %."
            - "Assessment A1 faults ONE module (position 3) -> claim recommendation MODULE_REPLACEMENT / MODULE_FAULT."
            - "Assessment A2, created later, faults FIVE modules (1, 2, 3, 4, 5) -> F = 5 exceeds MIN(3, 4) = 3, so the ladder escalates to PACK_REPLACEMENT / MODULE_ALLOWANCE; creating A2 also supersedes A1."
          setup_api_calls:
            - call: "POST /battery-warranty/warranty-programs"
              payload: { name: "MX Capacity Retention 2020", info_request_limit: 2 }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /battery-warranty/service-centers"
              payload: { name: "West HV Center", hv_certification_level: "L3", has_pack_lift: true }
              as: ProgramAdmin
              captures: { center_id: $.data.id }
            - call: "POST /battery-warranty/service-centers/${center_id}/technicians"
              payload: { full_name: "Tech A" }
              as: ProgramAdmin
              captures: { tech_a_id: $.data.id }
            - call: "POST /battery-warranty/vehicles"
              payload: { vin: "5YJ3E1EA7KF000001", warranty_program_id: "${prog_id}", in_service_date: "2020-03-10" }
              as: ProgramAdmin
              captures: { veh_id: $.data.id }
            - call: "POST /battery-warranty/battery-packs"
              payload: { serial_number: "PK-0001", installed_vehicle_id: "${veh_id}" }
