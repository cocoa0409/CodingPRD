              as: HubOpsManager
            - call: "POST /airhub/packages/${pkg_o1}/downgrade-commitment"
              payload: { expected_package_version: "${pkg_o1_v1}" }
              as: CommitmentController
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T02:40:00Z" }
              as: HubOpsManager
            - call: "POST /airhub/packages"
