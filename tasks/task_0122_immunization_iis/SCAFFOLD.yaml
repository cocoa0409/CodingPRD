scenario: |
  State Immunization Information System (IIS): childhood schedule, catch-up rules
  (CDC Catch-up), school enrollment proof, allergy record, lot recall, provider
  reporting, VAERS adverse events.

domain_name: state-immunization-information-system
api_prefix: /patients

# =============================================================================
# Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: graph_constraint
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - derived_field_reconciliation

  entity_topology: hybrid
  # Patient owns its Doses (nested), but VaccineProduct, VaccineLot, AdverseEvent,
  # ProviderOrganization, SchoolEnrollmentCertificate cross-cut multiple patients
  # via foreign-key references, and AntigenScheduleRule forms a DAG of dose
  # prerequisites and minimum-interval edges.

  state_machine_shape: branching
  # AdministeredDose has branching with revert (ADMINISTERED -> INVALIDATED by
  # lot recall; SCHEDULED -> CANCELLED).
  # AdverseEvent runs parallel dimensions: clinical_review_status and
  # vaers_submission_status evolve independently on the same row.
  # SchoolEnrollmentCertificate is compound (state derived from antigen coverage
  # tally over child's AdministeredDose set).

  relationship_patterns:
    - one_to_many        # Patient -> AdministeredDose, ProviderOrganization -> AdministeredDose
    - many_to_many       # AntigenScheduleRule references many VaccineProducts that cover same antigen
    - cross_aggregate    # AdministeredDose.lot_id references VaccineLot owned by ProviderOrganization
    - self_referential   # AntigenScheduleRule.prerequisite_rule_id -> AntigenScheduleRule (DAG)

  role_model: segregation_of_duties
  # Same provider clinician who administered a dose cannot also clinically_review
  # the AdverseEvent reported on that same dose -- forces a second clinician.
  # SchoolRegistrar reviews certificates but cannot administer doses.
  # PublicHealthOfficer issues recalls but cannot administer or submit VAERS.

  consistency_model: immediate
  # All cascades happen synchronously within the triggering request.

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: Patient
    parent: null
    common_fields: true
    fields:
      - name: first_name
        type: string
        source: input
        description: Patient given name.
        constraints: "1..80 chars"
      - name: last_name
        type: string
        source: input
        description: Patient family name.
        constraints: "1..80 chars"
      - name: date_of_birth
        type: string
        source: input
        description: ISO 8601 calendar date (YYYY-MM-DD). Immutable once set.
        constraints: "must be in the past relative to server clock"
      - name: sex_at_birth
        type: enum
        source: input
        description: Sex recorded at birth, used for HPV schedule eligibility and report demographics.
        constraints: "FEMALE | MALE | UNKNOWN"
      - name: state_resident
        type: boolean
        source: input
        description: Whether the patient is a resident of the state operating this IIS.
        default: true
      - name: guardian_contact_email
        type: string
        source: input
        description: Email used for recall notifications. Required for state residents.
      - name: medical_exemption_on_file
        type: boolean
        source: input
        description: When true, school enrollment may certify medical exemption per CDC ACIP guidance.
        default: false
      - name: status
        type: enum
        source: system
        description: Lifecycle of the patient record.
        default: ACTIVE
        constraints: "ACTIVE | DECEASED | MERGED_OUT | ARCHIVED"

  - name: VaccineProduct
    parent: null
    common_fields: true
    fields:
      - name: cvx_code
        type: string
        source: input
        description: CDC CVX vaccine code. Globally unique.
        constraints: "1..6 chars; unique across active products"
      - name: trade_name
        type: string
        source: input
        description: Brand/trade name.
      - name: antigens
        type: array
        source: input
        description: Array of antigen identifiers this product covers (e.g., ["DTAP_DIPHTHERIA","DTAP_TETANUS","DTAP_PERTUSSIS"]).
        constraints: "min length 1"
      - name: min_age_days
        type: integer
        source: input
        description: Earliest age in days at which any dose of this product may be administered.
        constraints: ">= 0"
      - name: max_age_days
        type: integer
        source: input
        description: Latest age in days at which any dose of this product may be administered. Null = unbounded.
      - name: route
        type: enum
        source: input
        description: Route of administration.
        constraints: "IM | SC | ORAL | INTRANASAL"
      - name: contraindication_flags
        type: array
        source: input
        description: Allergy antigens that contraindicate this product (e.g., ["EGG","NEOMYCIN"]).
      - name: status
        type: enum
        source: system
        description: Whether the product is selectable for new administrations.
        default: ACTIVE
        constraints: "ACTIVE | DISCONTINUED"

  - name: VaccineLot
    parent: null
    common_fields: true
    fields:
      - name: vaccine_product_id
        type: string
        source: input
        description: Foreign key to VaccineProduct.id.
      - name: provider_organization_id
        type: string
        source: input
        description: Provider org that holds this lot.
      - name: lot_number
        type: string
        source: input
        description: Manufacturer lot number. Unique within (vaccine_product_id).
      - name: expiration_date
        type: string
        source: input
        description: ISO 8601 calendar date the lot expires.
      - name: doses_on_hand
        type: integer
        source: system
        description: Remaining doses; decremented on each AdministeredDose, restored on INVALIDATED dose if recall_reason != EXPIRED.
        default: 0
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: Lifecycle of the lot.
        default: AVAILABLE
        constraints: "AVAILABLE | RECALLED | EXHAUSTED"
      - name: recall_reason
        type: enum
        source: system
        description: Reason recorded when status flips to RECALLED.
        default: null
        constraints: "MANUFACTURER_DEFECT | CONTAMINATION | EXPIRED | null"
      - name: recalled_at
        type: datetime
        source: system
        description: Timestamp recall was issued. Null until recalled.
        default: null

  - name: ProviderOrganization
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Provider org legal name.
      - name: npi
        type: string
        source: input
        description: National Provider Identifier. Unique.
        constraints: "exactly 10 digits"
      - name: reporting_jurisdiction
        type: enum
        source: input
        description: Jurisdiction the provider reports to.
        constraints: "IN_STATE | OUT_OF_STATE"
      - name: reporting_compliance_score
        type: number
        source: computed
        description: Score in [0.0, 100.0]; derived from on-time vs late dose-report submissions over the last rolling 365 days (see provider_reporting_compliance_score).
        default: 100.00
      - name: status
        type: enum
        source: system
        description: Whether the org may submit new dose reports.
        default: ACTIVE
        constraints: "ACTIVE | SUSPENDED"

  - name: AdministeredDose
    parent: Patient
    common_fields: true
    fields:
      - name: patient_id
        type: string
        source: system
        description: FK to Patient. Mirrors URL parent.
      - name: vaccine_product_id
        type: string
        source: input
        description: FK to VaccineProduct.
      - name: lot_id
        type: string
        source: input
        description: FK to VaccineLot.
      - name: provider_organization_id
        type: string
        source: input
        description: FK to the ProviderOrganization recording the dose.
      - name: administering_clinician_id
        type: string
        source: input
        description: Opaque clinician identifier (X-User-ID of a ProviderClinician). Required for SOD audit on AdverseEvent.
      - name: administered_at
        type: datetime
        source: input
        description: When the dose was administered. Must be <= current server time and > Patient.date_of_birth.
      - name: dose_state
        type: enum
        source: system
        description: Lifecycle of the dose record.
        default: SCHEDULED
        constraints: "SCHEDULED | ADMINISTERED | INVALIDATED | CANCELLED"
      - name: invalidation_reason
        type: enum
        source: system
        description: Reason the dose was invalidated.
        default: null
        constraints: "LOT_RECALL | DATA_ERROR | null"
      - name: reported_at
        type: datetime
        source: system
        description: Timestamp the dose was first POSTed by provider; used for on-time report calc.
      - name: catchup_flag
        type: boolean
        source: computed
        description: True if administered_at - Patient.date_of_birth exceeded the routine schedule's recommended upper age for this antigen sequence position (per scheduler).
        default: false

  - name: AllergyRecord
    parent: Patient
    common_fields: false
    fields:
      - name: patient_id
        type: string
        source: system
        description: FK to Patient. Mirrors URL parent.
      - name: allergen_code
        type: enum
        source: input
        description: Allergen identifier. Used to compute contraindication against VaccineProduct.contraindication_flags.
        constraints: "EGG | LATEX | NEOMYCIN | GELATIN | YEAST | OTHER"
      - name: severity
        type: enum
        source: input
        description: Severity grade.
        constraints: "MILD | MODERATE | SEVERE | ANAPHYLAXIS"
      - name: recorded_at
        type: datetime
        source: system
        description: When the record was entered. Immutable.

  - name: AdverseEvent
    parent: null
    common_fields: true
    fields:
      - name: patient_id
        type: string
        source: input
        description: FK to Patient.
      - name: dose_id
        type: string
        source: input
        description: FK to AdministeredDose that is the suspected trigger. Must belong to patient_id and be in dose_state == ADMINISTERED at report time.
      - name: onset_at
        type: datetime
        source: input
        description: When symptoms began. Must be >= AdministeredDose.administered_at and within 42 days of it.
      - name: symptom_codes
        type: array
        source: input
        description: List of MedDRA-like codes.
        constraints: "min length 1"
      - name: seriousness
        type: enum
        source: input
        description: Seriousness classification.
        constraints: "NON_SERIOUS | SERIOUS | DEATH"
      - name: clinical_review_status
        type: enum
        source: system
        description: Independent dimension of state machine; clinical adjudication status.
        default: PENDING_REVIEW
        constraints: "PENDING_REVIEW | UNDER_REVIEW | CAUSALLY_RELATED | NOT_RELATED"
      - name: vaers_submission_status
        type: enum
        source: system
        description: Independent dimension of state machine; federal submission lifecycle.
        default: NOT_SUBMITTED
        constraints: "NOT_SUBMITTED | SUBMITTED | ACK_RECEIVED | REJECTED"
      - name: vaers_submission_id
        type: string
        source: system
        description: VAERS receipt id once SUBMITTED. Null until submission.
        default: null
      - name: vaers_required
        type: boolean
        source: computed
        description: True iff seriousness ∈ {SERIOUS, DEATH} OR onset_at - administered_at <= 24 hours (per CDC VAERS reportable table).
        default: false

  - name: AntigenScheduleRule
    parent: null
    common_fields: true
    fields:
      - name: antigen
        type: enum
        source: input
        description: Antigen this rule applies to.
        constraints: "DTAP_DIPHTHERIA | DTAP_TETANUS | DTAP_PERTUSSIS | MMR_MEASLES | MMR_MUMPS | MMR_RUBELLA | HEPB | HPV | POLIO | VARICELLA"
      - name: dose_sequence_number
        type: integer
        source: input
        description: 1 = first dose in series, 2 = second, etc. Unique with (antigen).
        constraints: ">= 1"
      - name: routine_min_age_days
        type: integer
        source: input
        description: Minimum age in days for routine schedule.
        constraints: ">= 0"
      - name: routine_recommended_age_days
        type: integer
        source: input
        description: Recommended age in days for routine schedule.
      - name: routine_max_age_days
        type: integer
        source: input
        description: Maximum age (still considered routine, not catch-up) in days.
      - name: catchup_min_interval_days
        type: integer
        source: input
        description: Minimum interval (days) between this dose and the previous in same antigen series under CDC catch-up rules.
        constraints: ">= 0"
      - name: prerequisite_rule_id
        type: string
        source: input
        description: Self-FK to AntigenScheduleRule.id representing the dose that must precede this one (typically same antigen, sequence_number - 1). Null for dose_sequence_number == 1.
        default: null
      - name: school_enrollment_required
        type: boolean
        source: input
        description: Whether this dose must be present (or covered by exemption) to issue a school certificate.
        default: false

  - name: SchoolEnrollmentCertificate
    parent: Patient
    common_fields: true
    fields:
      - name: patient_id
        type: string
        source: system
        description: FK to Patient. Mirrors URL parent.
      - name: school_year
        type: string
        source: input
        description: e.g. "2026-2027". Unique with (patient_id) for status != REVOKED.
        constraints: "format YYYY-YYYY, second year = first year + 1"
      - name: grade_level
        type: enum
        source: input
        description: Grade level being entered.
        constraints: "K | G1 | G2 | G3 | G4 | G5 | G6 | G7 | G8 | G9 | G10 | G11 | G12"
      - name: certificate_status
        type: enum
        source: system
        description: Lifecycle of the certificate, computed from antigen coverage tally at issuance and recomputed on lot-recall cascades.
        default: DRAFT
        constraints: "DRAFT | ISSUED | DEFICIENT | EXEMPTION_GRANTED | REVOKED"
      - name: missing_antigens
        type: array
        source: computed
        description: Antigens still required but uncovered at the time of last evaluation.
        default: []
      - name: issued_at
        type: datetime
        source: system
        description: Timestamp ISSUED was reached. Null otherwise.
        default: null

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:

  - entity: AdministeredDose
    initial_state: SCHEDULED
    terminal_states: [INVALIDATED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: ADMINISTERED
        trigger: "POST /patients/{patient_id}/doses/{dose_id}/administer"
        actor: ProviderClinician
        preconditions:
          - "VaccineLot.status == AVAILABLE"
          - "VaccineLot.doses_on_hand >= 1"
          - "Patient age in days at administered_at within [VaccineProduct.min_age_days, VaccineProduct.max_age_days] inclusive (max null = unbounded)"
          - "No AllergyRecord exists with allergen_code IN VaccineProduct.contraindication_flags and severity IN {SEVERE, ANAPHYLAXIS}"
          - "If dose_sequence > 1 for this antigen, the prior dose for the matching antigen series has dose_state == ADMINISTERED and (administered_at_current - administered_at_prior) >= AntigenScheduleRule.catchup_min_interval_days"
        side_effects:
          - "VaccineLot.doses_on_hand decremented by 1; if it reaches 0, VaccineLot.status -> EXHAUSTED (auto-transition)"
          - "Compute AdministeredDose.catchup_flag via cdc_catchup_eligibility_decision"
          - "Recompute reporting_compliance_score for ProviderOrganization (see calc)"
          - "For any SchoolEnrollmentCertificate where patient_id matches and certificate_status IN {DRAFT, DEFICIENT}, recompute missing_antigens via school_coverage_evaluation; if empty -> certificate_status auto-transitions to ISSUED"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /patients/{patient_id}/doses/{dose_id}/cancel"
        actor: ProviderClinician
        preconditions:
          - "dose_state == SCHEDULED"
        side_effects: []
      - from: ADMINISTERED
        to: INVALIDATED
        trigger: "POST /vaccine-lots/{lot_id}/recall (cascade; per-dose system transition)"
        actor: system
        preconditions:
          - "VaccineLot.status was AVAILABLE or EXHAUSTED immediately prior to recall"
        side_effects:
          - "invalidation_reason = LOT_RECALL"
          - "If VaccineLot.recall_reason != EXPIRED: restore VaccineLot.doses_on_hand += 1 (only if pre-recall lot.status == AVAILABLE; recalls of EXHAUSTED lots leave doses_on_hand at 0)"
          - "For any SchoolEnrollmentCertificate where patient_id matches and certificate_status IN {ISSUED, EXEMPTION_GRANTED}, recompute missing_antigens via school_coverage_evaluation; if non-empty -> certificate_status auto-transitions to DEFICIENT (CASCADE STEP 2)"
          - "For each AdverseEvent.dose_id == this dose and clinical_review_status == PENDING_REVIEW, AdverseEvent.clinical_review_status auto-transitions to UNDER_REVIEW (CASCADE STEP 3, see AdverseEvent state machine)"
        note: |
          Three-hop cascade: recall (action on VaccineLot) -> AdministeredDose -> SchoolEnrollmentCertificate
          AND a parallel recall -> AdministeredDose -> AdverseEvent.clinical_review_status hop.
      - from: ADMINISTERED
        to: INVALIDATED
        trigger: "POST /patients/{patient_id}/doses/{dose_id}/invalidate"
        actor: PublicHealthOfficer
        preconditions:
          - "reason == DATA_ERROR provided in body"
        side_effects:
          - "invalidation_reason = DATA_ERROR"
          - "VaccineLot.doses_on_hand += 1 (data-error invalidation always restores stock)"
          - "Cascade-recompute SchoolEnrollmentCertificate per school_coverage_evaluation"

  - entity: SchoolEnrollmentCertificate
    initial_state: DRAFT
    terminal_states: [REVOKED]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /patients/{patient_id}/certificates/{cert_id}/issue OR auto-bubble-up from AdministeredDose administer when missing_antigens becomes empty"
        actor: SchoolRegistrar | system
        preconditions:
          - "missing_antigens == [] after school_coverage_evaluation"
          - "Patient.medical_exemption_on_file == false (else EXEMPTION_GRANTED instead)"
        side_effects:
          - "issued_at = now()"
      - from: DRAFT
        to: DEFICIENT
        trigger: "POST /patients/{patient_id}/certificates/{cert_id}/issue when missing_antigens != []"
        actor: SchoolRegistrar
        preconditions:
          - "Patient.medical_exemption_on_file == false"
        side_effects: []
      - from: DRAFT
        to: EXEMPTION_GRANTED
        trigger: "POST /patients/{patient_id}/certificates/{cert_id}/issue when Patient.medical_exemption_on_file == true"
        actor: SchoolRegistrar
        preconditions:
          - "Patient.medical_exemption_on_file == true"
        side_effects:
          - "issued_at = now()"
      - from: DEFICIENT
        to: ISSUED
        trigger: "auto-bubble-up from AdministeredDose administer when missing_antigens becomes empty"
        actor: system
        preconditions:
          - "missing_antigens == []"
        side_effects:
          - "issued_at = now()"
      - from: ISSUED
        to: DEFICIENT
        trigger: "cascade from AdministeredDose INVALIDATED (lot recall or data-error invalidation)"
        actor: system
        preconditions:
          - "After recompute, missing_antigens != []"
        side_effects: []
      - from: EXEMPTION_GRANTED
        to: REVOKED
        trigger: "POST /patients/{patient_id}/certificates/{cert_id}/revoke"
        actor: SchoolRegistrar
        preconditions:
          - "actor.role == SchoolRegistrar"
        side_effects: []
      - from: ISSUED
        to: REVOKED
        trigger: "POST /patients/{patient_id}/certificates/{cert_id}/revoke"
        actor: SchoolRegistrar
        preconditions: []
        side_effects: []
      - from: DEFICIENT
        to: REVOKED
        trigger: "POST /patients/{patient_id}/certificates/{cert_id}/revoke"
        actor: SchoolRegistrar
        preconditions: []
        side_effects: []

  - entity: AdverseEvent
    initial_state: "(clinical_review_status=PENDING_REVIEW, vaers_submission_status=NOT_SUBMITTED)"
    terminal_states:
      - "(clinical_review_status=NOT_RELATED, vaers_submission_status=ACK_RECEIVED)"
      - "(clinical_review_status=CAUSALLY_RELATED, vaers_submission_status=ACK_RECEIVED)"
      - "(clinical_review_status=*, vaers_submission_status=REJECTED)"
    transitions:
      # ----- clinical_review_status dimension -----
      - from: "clinical_review_status=PENDING_REVIEW"
        to: "clinical_review_status=UNDER_REVIEW"
        trigger: "POST /adverse-events/{id}/start-review OR cascade from AdministeredDose INVALIDATED via lot recall"
        actor: ReviewingClinician | system
        preconditions:
          - "If actor != system: actor.user_id != AdministeredDose.administering_clinician_id (segregation of duties)"
        side_effects: []
      - from: "clinical_review_status=UNDER_REVIEW"
        to: "clinical_review_status=CAUSALLY_RELATED"
        trigger: "POST /adverse-events/{id}/conclude-review"
        actor: ReviewingClinician
        preconditions:
          - "request.body.conclusion == CAUSALLY_RELATED"
          - "actor.user_id != AdministeredDose.administering_clinician_id"
        side_effects:
          - "If vaers_required == true and vaers_submission_status == NOT_SUBMITTED: log audit entry but do NOT auto-submit (submission is a separate, deliberate action)"
      - from: "clinical_review_status=UNDER_REVIEW"
        to: "clinical_review_status=NOT_RELATED"
        trigger: "POST /adverse-events/{id}/conclude-review"
        actor: ReviewingClinician
        preconditions:
          - "request.body.conclusion == NOT_RELATED"
          - "actor.user_id != AdministeredDose.administering_clinician_id"
        side_effects: []
      # ----- vaers_submission_status dimension -----
      - from: "vaers_submission_status=NOT_SUBMITTED"
        to: "vaers_submission_status=SUBMITTED"
        trigger: "POST /adverse-events/{id}/submit-vaers"
        actor: ReviewingClinician
        preconditions:
          - "clinical_review_status IN {UNDER_REVIEW, CAUSALLY_RELATED, NOT_RELATED}"
          - "vaers_required == true OR request.body.elective == true"
        side_effects:
          - "vaers_submission_id = server-minted UUID"
      - from: "vaers_submission_status=SUBMITTED"
        to: "vaers_submission_status=ACK_RECEIVED"
        trigger: "POST /_events/vaers-ack"
        actor: system
        preconditions:
          - "request.body.outcome == ACK"
        side_effects: []
      - from: "vaers_submission_status=SUBMITTED"
        to: "vaers_submission_status=REJECTED"
        trigger: "POST /_events/vaers-ack"
        actor: system
        preconditions:
          - "request.body.outcome == REJECT"
        side_effects: []

  - entity: VaccineLot
    initial_state: AVAILABLE
    terminal_states: [RECALLED]
    transitions:
      - from: AVAILABLE
        to: EXHAUSTED
        trigger: "auto-transition when AdministeredDose administer decrements doses_on_hand to 0"
        actor: system
        preconditions:
          - "doses_on_hand == 0 after decrement"
        side_effects: []
      - from: EXHAUSTED
        to: AVAILABLE
        trigger: "auto-transition when AdministeredDose INVALIDATED restores doses_on_hand to >= 1 (only applies if recall_reason != EXPIRED and pre-state was AVAILABLE)"
        actor: system
        preconditions:
          - "doses_on_hand >= 1 after restoration"
        side_effects: []
      - from: AVAILABLE
        to: RECALLED
        trigger: "POST /vaccine-lots/{lot_id}/recall"
        actor: PublicHealthOfficer
        preconditions:
          - "actor.role == PublicHealthOfficer"
        side_effects:
          - "recalled_at = now()"
          - "recall_reason = request.body.reason"
          - "For each AdministeredDose where lot_id == this and dose_state == ADMINISTERED -> dose_state = INVALIDATED (CASCADE STEP 1)"
        note: "Triggers the three-hop cascade documented under AdministeredDose."
      - from: EXHAUSTED
        to: RECALLED
        trigger: "POST /vaccine-lots/{lot_id}/recall"
        actor: PublicHealthOfficer
        preconditions: []
        side_effects:
          - "recalled_at = now()"
          - "recall_reason = request.body.reason"
          - "For each AdministeredDose where lot_id == this and dose_state == ADMINISTERED -> dose_state = INVALIDATED (CASCADE STEP 1)"

  - entity: ProviderOrganization
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /provider-organizations/{id}/suspend (or auto from rolling reporting_compliance_score < 70.0)"
        actor: PublicHealthOfficer | system
        preconditions:
          - "If system trigger: provider_reporting_compliance_score result < 70.0"
        side_effects: []
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /provider-organizations/{id}/reinstate"
        actor: PublicHealthOfficer
        preconditions:
          - "reporting_compliance_score >= 90.0"
        side_effects: []

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - scenario: "Two clinicians simultaneously administer doses from the same VaccineLot whose doses_on_hand == 1"
    guarantee: "Exactly one dose admin succeeds; the other receives ERR_LOT_EXHAUSTED."
    error_id: ERR_LOT_EXHAUSTED
    http_status: 409
    serialization: "First-writer-wins on VaccineLot.doses_on_hand decrement."

  - scenario: "Recall is issued while a clinician is administering a dose from the same lot"
    guarantee: "If recall lands first (lot.status flips to RECALLED), the in-flight administer fails with ERR_LOT_RECALLED; if the administer lands first, the dose is created in ADMINISTERED and the cascade then invalidates it."
    error_id: ERR_LOT_RECALLED
    http_status: 409
    serialization: "First-writer-wins on VaccineLot.status."

  - scenario: "Two reviewing clinicians simultaneously conclude the same AdverseEvent review"
    guarantee: "Exactly one conclusion is recorded; the second receives ERR_INVALID_STATE because clinical_review_status is no longer UNDER_REVIEW."
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on AdverseEvent.clinical_review_status."

  - scenario: "Two simultaneous VAERS submissions on the same AdverseEvent"
    guarantee: "At most one submission; second receives ERR_VAERS_ALREADY_SUBMITTED."
    error_id: ERR_VAERS_ALREADY_SUBMITTED
    http_status: 409
    serialization: "First-writer-wins on AdverseEvent.vaers_submission_status."

  - scenario: "Two SchoolRegistrar users issue certificates for the same patient and school_year concurrently"
    guarantee: "At most one non-REVOKED certificate per (patient_id, school_year); second receives ERR_CERTIFICATE_DUPLICATE."
    error_id: ERR_CERTIFICATE_DUPLICATE
    http_status: 409
    serialization: "First-writer-wins on uniqueness over (patient_id, school_year) filtered to status != REVOKED."

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: cdc_catchup_eligibility_decision
    trigger: "Runs during AdministeredDose administer precondition check AND during GET /patients/{id}/next-due to project the next dose date for each antigen series."
    algorithm: dual_variant_calculation
    formula: |
      Given antigen A, prior administered doses for patient P in series A
        ordered by administered_at ASC, and AntigenScheduleRule R_n for the
        next dose (sequence_number = count(prior ADMINISTERED in A) + 1):

      ROUTINE VARIANT (used by /next-due when patient currently within routine window):
        eligible_age_days = R_n.routine_min_age_days
        recommended_age_days = R_n.routine_recommended_age_days
        next_due_date = Patient.date_of_birth + recommended_age_days days
        catchup_flag_on_record = false

      CATCHUP VARIANT (used when patient_age_days > previous dose's routine_max_age_days
                       at the time the prior dose was administered, OR when current
                       patient_age_days > R_n.routine_max_age_days):
        last_admin = administered_at of most recent ADMINISTERED dose in series A
        eligible_date = max(
            Patient.date_of_birth + R_n.routine_min_age_days days,
            last_admin + R_n.catchup_min_interval_days days
        )
        next_due_date = eligible_date
        catchup_flag_on_record = true
    input_set: |
      Only AdministeredDose rows with dose_state == ADMINISTERED count toward
      "prior doses". SCHEDULED, INVALIDATED, and CANCELLED rows are excluded.
      Including INVALIDATED rows would let a recalled dose still satisfy a
      schedule position; including SCHEDULED would let a not-yet-administered
      plan jump the queue.
    constants: {}
    precision: "Dates are calendar days, no time-of-day arithmetic. Age in days = floor((administered_at_date - date_of_birth) / 1 day)."
    variants:
      - name: routine
        when: "current_age_days <= R_n.routine_max_age_days AND no prior dose was administered late"
        difference: "Uses routine_recommended_age_days as anchor; ignores catchup_min_interval_days; catchup_flag_on_record=false"
      - name: catchup
        when: "current_age_days > R_n.routine_max_age_days OR previous dose was administered after its rule's routine_max_age_days"
        difference: "Uses last_admin + catchup_min_interval_days; ignores routine_recommended_age_days; catchup_flag_on_record=true"

  - name: school_coverage_evaluation
    trigger: |
      Runs when:
      (a) SchoolEnrollmentCertificate is issued (POST .../issue);
      (b) any AdministeredDose for the same patient transitions SCHEDULED->ADMINISTERED;
      (c) any AdministeredDose for the same patient transitions ADMINISTERED->INVALIDATED.
      It is the bridge calculation in the multi-hop cascade.
    algorithm: aggregation
    formula: |
      required_antigens = {
        AntigenScheduleRule.antigen for each AntigenScheduleRule
        where school_enrollment_required == true
      }

      covered_antigens = {
        AdministeredDose.vaccine_product.antigens (flattened)
        for each AdministeredDose where
          patient_id == this patient
          AND dose_state == ADMINISTERED
      } ∩ required_antigens

      missing_antigens = sorted(required_antigens - covered_antigens, asc by name)

      if Patient.medical_exemption_on_file == true:
        return ("EXEMPTION_GRANTED", [])
      elif len(missing_antigens) == 0:
        return ("ISSUED", [])
      else:
        return ("DEFICIENT", missing_antigens)

      RANKING: missing_antigens MUST be sorted ascending alphabetically by
      antigen enum string so the result is order-stable across invocations.
      Status precedence when both states apply: EXEMPTION_GRANTED wins over
      ISSUED (exemption suppresses the requirement check entirely).
    input_set: |
      Only AdministeredDose rows with dose_state == ADMINISTERED at evaluation
      time count toward covered_antigens. Doses currently SCHEDULED, CANCELLED,
      or INVALIDATED do NOT count -- this is what makes the lot-recall cascade
      flip ISSUED certificates to DEFICIENT.
    constants: {}
    precision: "Set arithmetic; deterministic sort."

  - name: provider_reporting_compliance_score
    trigger: "Recomputed on every AdministeredDose transition (SCHEDULED->ADMINISTERED, ADMINISTERED->INVALIDATED). Also computed on GET /provider-organizations/{id}."
    algorithm: weighted_scoring
    formula: |
      Let now_ts = server current time.
      Window: doses with reported_at IN (now_ts - 365 days, now_ts].

      For each AdministeredDose D in window for this org:
        lag_hours = (D.reported_at - D.administered_at).total_seconds() / 3600
        per_dose_score =
          100.0                                   if lag_hours <= 24
          100.0 - (lag_hours - 24) * 1.25         if 24  < lag_hours <= 72   # linear: 100 at 24h, 40 at 72h
          40.0                                    if 72  < lag_hours <= 168  # floor through one week
          0.0                                     if lag_hours > 168

      RANKING / TIE-BREAK: doses sorted by administered_at ASC, then dose.id ASC.

      If no doses in window: reporting_compliance_score = 100.00 (default).

      Else:
        sum_per_dose = sum(per_dose_score for D)
        avg_raw = sum_per_dose / count_in_window
        # ROUNDING ORDER (PINNED, NON-COMMUTATIVE):
        # First: round each per_dose_score to 2 dp using ROUND_HALF_UP
        # individually. Then: sum the rounded values, divide by N, then
        # round the AVERAGE to 2 dp ROUND_HALF_UP.
        # The alternate "sum raw then round" yields a different cent in
        # boundary cases (e.g., per-dose raw scores 30.555 and 30.554:
        # round-then-sum -> round(30.56 + 30.55)/2 = round(30.555,2) = 30.56;
        # sum-then-round -> round((30.555+30.554)/2, 2) = round(30.5545,2) = 30.55).
        # We pin round-then-sum.

        # Threshold inclusion filter: doses with dose_state == INVALIDATED are
        # EXCLUDED from the window (the report is voided).
    input_set: |
      AdministeredDose rows where dose_state == ADMINISTERED (INVALIDATED rows
      are dropped), reported_at within rolling 365-day window, provider_organization_id
      == this provider. Doses still SCHEDULED don't count.
    constants:
      ON_TIME_HOURS: 24
      LATE_LINEAR_END_HOURS: 72
      LATE_FLOOR_HOURS: 168
      LATE_FLOOR_SCORE: 40.0
      LINEAR_SLOPE_PER_HOUR: 1.25
      WINDOW_DAYS: 365
      AUTO_SUSPEND_BELOW: 70.0
    precision: "2 decimal places ROUND_HALF_UP, evaluated in pinned order: round per-dose first, then average, then round the average."
    variants: []

  - name: vaers_reportable_determination
    trigger: "Runs on AdverseEvent creation (POST) and is stored as vaers_required."
    algorithm: threshold
    formula: |
      Let dose = AdministeredDose with id == AdverseEvent.dose_id.
      Let lag_hours = (AdverseEvent.onset_at - dose.administered_at).total_seconds() / 3600

      vaers_required = (
          AdverseEvent.seriousness IN {SERIOUS, DEATH}
          OR lag_hours <= 24.0    # NOTE: <=, NOT <
      )

      BOUNDARY PRECISION:
      - lag_hours == 24.0 exactly => vaers_required = true
      - lag_hours == 24.0001 => vaers_required = false (unless seriousness elevated)
      - lag_hours == 0 => vaers_required = true
      - lag_hours < 0 is rejected at validation (priority 90).
    input_set: "Single AdverseEvent + its referenced AdministeredDose."
    constants:
      RAPID_ONSET_HOURS_INCLUSIVE: 24.0
    precision: "Hours as float; comparison uses <= with exact 24.0 threshold."
    variants: []

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority; lower number = checked first)
# =============================================================================
validations:

  - priority: 10
    category: auth
    check: "X-User-ID and X-User-Role headers must be present."
    error_id: ERR_AUTH_HEADER_MISSING
    http_status: 401
    applies_to: all

  - priority: 20
    category: auth
    check: "X-User-Role must be one of the seven declared roles."
    error_id: ERR_AUTH_HEADER_INVALID
    http_status: 401
    applies_to: all

  - priority: 30
    category: auth
    check: "Acting role must be permitted by RBAC for the requested endpoint."
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 40
    category: existence
    check: "Patient id in URL must exist (path is validated left-to-right)."
    error_id: ERR_PATIENT_NOT_FOUND
    http_status: 404
    applies_to: "endpoints with /patients/{patient_id} prefix"

  - priority: 41
    category: existence
    check: "AdministeredDose id in URL must exist AND belong to patient_id in URL."
    error_id: ERR_DOSE_NOT_FOUND
    http_status: 404
    applies_to: "endpoints with /doses/{dose_id} segment"

  - priority: 42
    category: existence
    check: "VaccineLot id must exist."
    error_id: ERR_LOT_NOT_FOUND
    http_status: 404
    applies_to: "endpoints with /vaccine-lots/{lot_id}"

  - priority: 43
    category: existence
    check: "VaccineProduct id (in body or URL) must exist."
    error_id: ERR_PRODUCT_NOT_FOUND
    http_status: 404
    applies_to: "endpoints referencing vaccine_product_id"

  - priority: 44
    category: existence
    check: "AdverseEvent id in URL must exist."
    error_id: ERR_ADVERSE_EVENT_NOT_FOUND
    http_status: 404
    applies_to: "endpoints with /adverse-events/{id}"

  - priority: 45
    category: existence
    check: "SchoolEnrollmentCertificate id must exist and belong to patient_id."
    error_id: ERR_CERTIFICATE_NOT_FOUND
    http_status: 404
    applies_to: "endpoints with /certificates/{cert_id}"

  - priority: 46
    category: existence
    check: "ProviderOrganization id in URL must exist."
    error_id: ERR_PROVIDER_NOT_FOUND
    http_status: 404
    applies_to: "endpoints with /provider-organizations/{id}"

  - priority: 50
    category: state
    check: "Target VaccineLot.status must be AVAILABLE for new dose admin."
    error_id: ERR_LOT_RECALLED
    http_status: 409
    applies_to: "POST /patients/{patient_id}/doses/{dose_id}/administer"

  - priority: 51
    category: state
    check: "AdministeredDose.dose_state must be SCHEDULED for /administer; SCHEDULED for /cancel; ADMINISTERED for /invalidate."
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "POST /patients/{patient_id}/doses/{dose_id}/(administer|cancel|invalidate)"

  - priority: 52
    category: state
    check: "AdverseEvent.clinical_review_status must equal UNDER_REVIEW for /conclude-review; PENDING_REVIEW for /start-review."
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "POST /adverse-events/{id}/(start-review|conclude-review)"

  - priority: 53
    category: state
    check: "VaccineLot.doses_on_hand must be >= 1 for /administer."
    error_id: ERR_LOT_EXHAUSTED
    http_status: 409
    applies_to: "POST /patients/{patient_id}/doses/{dose_id}/administer"

  - priority: 60
    category: business_safety
    check: |
      For /administer: there must be NO AllergyRecord for the patient where
      allergen_code IN VaccineProduct.contraindication_flags AND
      severity IN {SEVERE, ANAPHYLAXIS}.
      This is the highest business-level safety check -- it precedes age, schedule,
      and capacity checks because administering against a known anaphylactic
      allergy is the most harmful failure mode.
    error_id: ERR_ALLERGY_CONTRAINDICATION
    http_status: 422
    applies_to: "POST /patients/{patient_id}/doses/{dose_id}/administer"

  - priority: 61
    category: business_safety
    check: |
      For /submit-vaers and /conclude-review: acting clinician
      (X-User-ID) MUST NOT equal AdministeredDose.administering_clinician_id
      for the dose referenced by the AdverseEvent (segregation of duties).
    error_id: ERR_SOD_VIOLATION
    http_status: 422
    applies_to: "POST /adverse-events/{id}/(conclude-review|submit-vaers)"

  - priority: 70
    category: business_constraint
    check: |
      For /administer: Patient age in days at administered_at MUST be within
      [VaccineProduct.min_age_days, VaccineProduct.max_age_days] inclusive
      (max_age_days null => no upper bound). Boundary precision: exactly
      min_age_days is allowed; min_age_days - 1 is rejected.
    error_id: ERR_AGE_OUT_OF_RANGE
    http_status: 422
    applies_to: "POST /patients/{patient_id}/doses/{dose_id}/administer"

  - priority: 71
    category: business_constraint
    check: |
      For /administer: when dose_sequence_number > 1 for the antigen series,
      the immediately prior dose (most recent ADMINISTERED) MUST exist AND
      (administered_at_new - administered_at_prior) MUST be >=
      AntigenScheduleRule.catchup_min_interval_days. Boundary precision:
      exactly equal to the minimum is allowed; one day short is rejected.
    error_id: ERR_MIN_INTERVAL_VIOLATION
    http_status: 422
    applies_to: "POST /patients/{patient_id}/doses/{dose_id}/administer"

  - priority: 72
    category: business_temporal
    check: "administered_at must be <= server now AND > Patient.date_of_birth."
    error_id: ERR_ADMIN_TIME_OUT_OF_RANGE
    http_status: 422
    applies_to: "POST /patients/{patient_id}/doses/{dose_id}/administer"

  - priority: 80
    category: business_referential
    check: |
      For /administer: the VaccineLot referenced MUST be a lot of the same
      vaccine_product_id supplied in the body.
    error_id: ERR_LOT_PRODUCT_MISMATCH
    http_status: 422
    applies_to: "POST /patients/{patient_id}/doses/{dose_id}/administer"

  - priority: 81
    category: business_referential
    check: "For AdverseEvent create: dose_id MUST belong to patient_id."
    error_id: ERR_DOSE_PATIENT_MISMATCH
    http_status: 422
    applies_to: "POST /adverse-events"

  - priority: 90
    category: business_temporal
    check: |
      For AdverseEvent create: onset_at MUST be >= referenced dose.administered_at
      AND <= dose.administered_at + 42 days.
    error_id: ERR_ONSET_OUT_OF_WINDOW
    http_status: 422
    applies_to: "POST /adverse-events"

  - priority: 95
    category: business_constraint
    check: "ProviderOrganization.status must be ACTIVE to POST /patients/{id}/doses."
    error_id: ERR_PROVIDER_SUSPENDED
    http_status: 403
    applies_to: "POST /patients/{patient_id}/doses"

  - priority: 100
    category: business_referential
    check: |
      For SchoolEnrollmentCertificate create/issue: at most one certificate
      with certificate_status != REVOKED can exist per (patient_id, school_year).
    error_id: ERR_CERTIFICATE_DUPLICATE
    http_status: 409
    applies_to: "POST /patients/{patient_id}/certificates"

  - priority: 110
    category: business_fiscal
    check: |
      For VAERS submission: vaers_required must be true OR request.body.elective == true.
      (vaers_required is computed at AdverseEvent creation via
      vaers_reportable_determination.)
    error_id: ERR_VAERS_NOT_REPORTABLE
    http_status: 422
    applies_to: "POST /adverse-events/{id}/submit-vaers"

  - priority: 120
    category: business_constraint
    check: "Body field types and required-field presence per endpoint contract."
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: all

  - priority: 130
    category: business_constraint
    check: "If version is supplied and does not match server version, reject."
    error_id: ERR_VERSION_CONFLICT
    http_status: 409
    applies_to: "PATCH and action endpoints accepting version"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:

  # ---- Patient ----
  - method: POST
    path: "/patients"
    description: "Register a new patient."
    roles: [SchoolRegistrar, ProviderClinician, PublicHealthOfficer]
    code: 201
    input: [first_name, last_name, date_of_birth, sex_at_birth, state_resident, guardian_contact_email, "medical_exemption_on_file?"]
    output: Patient
    side_effects: []

  - method: GET
    path: "/patients/{patient_id}"
    description: "Read a single patient."
    roles: [SchoolRegistrar, ProviderClinician, ReviewingClinician, PublicHealthOfficer]
    code: 200
    input: []
    output: Patient
    side_effects: []

  - method: GET
    path: "/patients"
    description: "List patients with filtering (status, state_resident, date_of_birth_after, date_of_birth_before) and pagination."
    roles: [PublicHealthOfficer]
    code: 200
    input: ["status?", "state_resident?", "date_of_birth_after?", "date_of_birth_before?", "limit?", "offset?"]
    output: "Patient[]"
    side_effects: []

  - method: GET
    path: "/patients/{patient_id}/next-due"
    description: "Compute next-due doses per antigen series using cdc_catchup_eligibility_decision."
    roles: [ProviderClinician, SchoolRegistrar]
    code: 200
    input: []
    output: "object{antigen, next_due_date, variant: routine|catchup, missing}[]"
    side_effects: []

  # ---- VaccineProduct ----
  - method: POST
    path: "/vaccine-products"
    description: "Register a vaccine product (CVX code)."
    roles: [PublicHealthOfficer]
    code: 201
    input: [cvx_code, trade_name, antigens, min_age_days, "max_age_days?", route, "contraindication_flags?"]
    output: VaccineProduct
    side_effects: []

  - method: GET
    path: "/vaccine-products/{product_id}"
    description: "Read a vaccine product."
    roles: [SchoolRegistrar, ProviderClinician, ReviewingClinician, PublicHealthOfficer]
    code: 200
    input: []
    output: VaccineProduct
    side_effects: []

  - method: GET
    path: "/vaccine-products"
    description: "List products."
    roles: [SchoolRegistrar, ProviderClinician, ReviewingClinician, PublicHealthOfficer]
    code: 200
    input: ["status?", "antigen?", "limit?", "offset?"]
    output: "VaccineProduct[]"
    side_effects: []

  # ---- VaccineLot ----
  - method: POST
    path: "/vaccine-lots"
    description: "Provider records a new lot in inventory."
    roles: [ProviderClinician, PublicHealthOfficer]
    code: 201
    input: [vaccine_product_id, provider_organization_id, lot_number, expiration_date, doses_on_hand]
    output: VaccineLot
    side_effects: []

  - method: GET
    path: "/vaccine-lots/{lot_id}"
    description: "Read a lot."
    roles: [ProviderClinician, PublicHealthOfficer]
    code: 200
    input: []
    output: VaccineLot
    side_effects: []

  - method: POST
    path: "/vaccine-lots/{lot_id}/recall"
    description: "Public health issues a recall on a lot."
    roles: [PublicHealthOfficer]
    code: 200
    input: [reason]
    output: VaccineLot
    side_effects:
      - "Cascade-invalidates every AdministeredDose with lot_id == this lot and dose_state == ADMINISTERED."
      - "Recomputes school certificates for affected patients (school_coverage_evaluation)."
      - "Transitions clinical_review_status of associated AdverseEvent rows from PENDING_REVIEW to UNDER_REVIEW."
      - "Recomputes reporting_compliance_score for affected ProviderOrganization rows."

  # ---- AdministeredDose ----
  - method: POST
    path: "/patients/{patient_id}/doses"
    description: "Schedule a future dose (state = SCHEDULED)."
    roles: [ProviderClinician]
    code: 201
    input: [vaccine_product_id, lot_id, provider_organization_id, administering_clinician_id]
    output: AdministeredDose
    side_effects: []

  - method: POST
    path: "/patients/{patient_id}/doses/{dose_id}/administer"
    description: "Mark a scheduled dose administered now."
    roles: [ProviderClinician]
    code: 200
    input: [administered_at]
    output: AdministeredDose
    side_effects:
      - "Decrement VaccineLot.doses_on_hand by 1; if 0, auto-EXHAUSTED."
      - "Compute catchup_flag via cdc_catchup_eligibility_decision."
      - "Recompute provider_reporting_compliance_score."
      - "Recompute school_coverage_evaluation for all DRAFT/DEFICIENT certificates of this patient; auto-issue if complete."

  - method: POST
    path: "/patients/{patient_id}/doses/{dose_id}/cancel"
    description: "Cancel a scheduled dose."
    roles: [ProviderClinician]
    code: 200
    input: []
    output: AdministeredDose
    side_effects: []

  - method: POST
    path: "/patients/{patient_id}/doses/{dose_id}/invalidate"
    description: "Invalidate an administered dose due to data error."
    roles: [PublicHealthOfficer]
    code: 200
    input: [reason]
    output: AdministeredDose
    side_effects:
      - "VaccineLot.doses_on_hand += 1."
      - "Recompute school_coverage_evaluation; demote any ISSUED certificate to DEFICIENT if uncovered."

  - method: GET
    path: "/patients/{patient_id}/doses"
    description: "List administered + scheduled doses for a patient."
    roles: [ProviderClinician, SchoolRegistrar, ReviewingClinician, PublicHealthOfficer]
    code: 200
    input: ["dose_state?", "antigen?", "limit?", "offset?"]
    output: "AdministeredDose[]"
    side_effects: []

  - method: GET
    path: "/patients/{patient_id}/doses/{dose_id}"
    description: "Read a single dose."
    roles: [ProviderClinician, SchoolRegistrar, ReviewingClinician, PublicHealthOfficer]
    code: 200
    input: []
    output: AdministeredDose
    side_effects: []

  # ---- AllergyRecord ----
  - method: POST
    path: "/patients/{patient_id}/allergies"
    description: "Record an allergy."
    roles: [ProviderClinician]
    code: 201
    input: [allergen_code, severity]
    output: AllergyRecord
    side_effects: []

  - method: GET
    path: "/patients/{patient_id}/allergies"
    description: "List patient allergies."
    roles: [ProviderClinician, ReviewingClinician, PublicHealthOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: "AllergyRecord[]"
    side_effects: []

  # ---- AdverseEvent ----
  - method: POST
    path: "/adverse-events"
    description: "Report an adverse event."
    roles: [ProviderClinician, ReviewingClinician]
    code: 201
    input: [patient_id, dose_id, onset_at, symptom_codes, seriousness]
    output: AdverseEvent
    side_effects:
      - "Compute vaers_required via vaers_reportable_determination."

  - method: POST
    path: "/adverse-events/{id}/start-review"
    description: "Reviewing clinician opens the case for review."
    roles: [ReviewingClinician]
    code: 200
    input: []
    output: AdverseEvent
    side_effects: []

  - method: POST
    path: "/adverse-events/{id}/conclude-review"
    description: "Reviewing clinician records a verdict."
    roles: [ReviewingClinician]
    code: 200
    input: [conclusion]
    output: AdverseEvent
    side_effects: []

  - method: POST
    path: "/adverse-events/{id}/submit-vaers"
    description: "Submit the adverse event to VAERS."
    roles: [ReviewingClinician]
    code: 200
    input: ["elective?"]
    output: AdverseEvent
    side_effects:
      - "Generate vaers_submission_id."

  - method: GET
    path: "/adverse-events/{id}"
    description: "Read an adverse event."
    roles: [ReviewingClinician, ProviderClinician, PublicHealthOfficer]
    code: 200
    input: []
    output: AdverseEvent
    side_effects: []

  - method: GET
    path: "/adverse-events"
    description: "List adverse events with filter on clinical_review_status, vaers_submission_status, seriousness."
    roles: [ReviewingClinician, PublicHealthOfficer]
    code: 200
    input: ["clinical_review_status?", "vaers_submission_status?", "seriousness?", "limit?", "offset?"]
    output: "AdverseEvent[]"
    side_effects: []

  # ---- AntigenScheduleRule ----
  - method: POST
    path: "/antigen-schedule-rules"
    description: "Register a schedule rule."
    roles: [PublicHealthOfficer]
    code: 201
    input: [antigen, dose_sequence_number, routine_min_age_days, routine_recommended_age_days, routine_max_age_days, catchup_min_interval_days, "prerequisite_rule_id?", school_enrollment_required]
    output: AntigenScheduleRule
    side_effects: []

  - method: GET
    path: "/antigen-schedule-rules"
    description: "List schedule rules."
    roles: [PublicHealthOfficer, SchoolRegistrar, ProviderClinician, ReviewingClinician]
    code: 200
    input: ["antigen?", "limit?", "offset?"]
    output: "AntigenScheduleRule[]"
    side_effects: []

  # ---- SchoolEnrollmentCertificate ----
  - method: POST
    path: "/patients/{patient_id}/certificates"
    description: "Create a draft certificate."
    roles: [SchoolRegistrar]
    code: 201
    input: [school_year, grade_level]
    output: SchoolEnrollmentCertificate
    side_effects: []

  - method: POST
    path: "/patients/{patient_id}/certificates/{cert_id}/issue"
    description: "Issue the certificate (evaluates coverage)."
    roles: [SchoolRegistrar]
    code: 200
    input: []
    output: SchoolEnrollmentCertificate
    side_effects:
      - "Runs school_coverage_evaluation; sets certificate_status to ISSUED or DEFICIENT or EXEMPTION_GRANTED."

  - method: POST
    path: "/patients/{patient_id}/certificates/{cert_id}/revoke"
    description: "Revoke a certificate."
    roles: [SchoolRegistrar]
    code: 200
    input: []
    output: SchoolEnrollmentCertificate
    side_effects: []

  - method: GET
    path: "/patients/{patient_id}/certificates"
    description: "List certificates."
    roles: [SchoolRegistrar, ProviderClinician, PublicHealthOfficer]
    code: 200
    input: ["school_year?", "certificate_status?", "limit?", "offset?"]
    output: "SchoolEnrollmentCertificate[]"
    side_effects: []

  # ---- ProviderOrganization ----
  - method: POST
    path: "/provider-organizations"
    description: "Register a provider."
    roles: [PublicHealthOfficer]
    code: 201
    input: [name, npi, reporting_jurisdiction]
    output: ProviderOrganization
    side_effects: []

  - method: GET
    path: "/provider-organizations/{id}"
    description: "Read a provider; recomputes reporting_compliance_score."
    roles: [PublicHealthOfficer, ProviderClinician]
    code: 200
    input: []
    output: ProviderOrganization
    side_effects:
      - "Recompute reporting_compliance_score from current rolling window."

  - method: POST
    path: "/provider-organizations/{id}/suspend"
    description: "Manually suspend a provider."
    roles: [PublicHealthOfficer]
    code: 200
    input: []
    output: ProviderOrganization
    side_effects: []

  - method: POST
    path: "/provider-organizations/{id}/reinstate"
    description: "Reinstate a suspended provider."
    roles: [PublicHealthOfficer]
    code: 200
    input: []
    output: ProviderOrganization
    side_effects: []

  # ---- Test driving endpoints (required for time-gated and event-driven transitions) ----
  - method: POST
    path: "/_clock/advance"
    description: "Test-only: advance the server's logical clock. Required because reporting_compliance_score depends on a 365-day rolling window, lot expiration depends on calendar dates, and VAERS lag thresholds depend on wall-clock time."
    roles: [PublicHealthOfficer]
    code: 200
    input: [to_timestamp]
    output: "object{now}"
    side_effects: []

  - method: POST
    path: "/_events/vaers-ack"
    description: "Test-only: simulate VAERS federal acknowledgement webhook."
    roles: [PublicHealthOfficer]
    code: 200
    input: [adverse_event_id, outcome]
    output: AdverseEvent
    side_effects:
      - "Transitions vaers_submission_status SUBMITTED -> ACK_RECEIVED or REJECTED."

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_AUTH_HEADER_MISSING
    http: 401
    condition: "X-User-ID or X-User-Role missing."
  - id: ERR_AUTH_HEADER_INVALID
    http: 401
    condition: "X-User-Role not one of the seven declared roles."
  - id: ERR_FORBIDDEN
    http: 403
    condition: "Role not permitted for this endpoint."
  - id: ERR_PATIENT_NOT_FOUND
    http: 404
    condition: "Patient id in URL does not exist."
  - id: ERR_DOSE_NOT_FOUND
    http: 404
    condition: "AdministeredDose id not found under this patient."
  - id: ERR_LOT_NOT_FOUND
    http: 404
    condition: "VaccineLot id does not exist."
  - id: ERR_PRODUCT_NOT_FOUND
    http: 404
    condition: "VaccineProduct id does not exist."
  - id: ERR_ADVERSE_EVENT_NOT_FOUND
    http: 404
    condition: "AdverseEvent id does not exist."
  - id: ERR_CERTIFICATE_NOT_FOUND
    http: 404
    condition: "SchoolEnrollmentCertificate id not found under patient."
  - id: ERR_PROVIDER_NOT_FOUND
    http: 404
    condition: "ProviderOrganization id not found."
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Target entity is not in a state that permits the requested operation."
  - id: ERR_LOT_RECALLED
    http: 409
    condition: "Operation requires lot.status == AVAILABLE but lot is RECALLED."
  - id: ERR_LOT_EXHAUSTED
    http: 409
    condition: "Operation requires doses_on_hand >= 1 but lot is at zero."
  - id: ERR_CERTIFICATE_DUPLICATE
    http: 409
    condition: "Another non-REVOKED certificate exists for (patient, school_year)."
  - id: ERR_VAERS_ALREADY_SUBMITTED
    http: 409
    condition: "AdverseEvent.vaers_submission_status is not NOT_SUBMITTED."
  - id: ERR_VERSION_CONFLICT
    http: 409
    condition: "Supplied version does not match server entity version."
  - id: ERR_ALLERGY_CONTRAINDICATION
    http: 422
    condition: "Patient has SEVERE or ANAPHYLAXIS allergy against product contraindication flag."
  - id: ERR_AGE_OUT_OF_RANGE
    http: 422
    condition: "Patient age in days outside [VaccineProduct.min_age_days, VaccineProduct.max_age_days]."
  - id: ERR_MIN_INTERVAL_VIOLATION
    http: 422
    condition: "Interval from prior dose < AntigenScheduleRule.catchup_min_interval_days."
  - id: ERR_ADMIN_TIME_OUT_OF_RANGE
    http: 422
    condition: "administered_at <= date_of_birth or > server now."
  - id: ERR_LOT_PRODUCT_MISMATCH
    http: 422
    condition: "lot_id does not refer to a lot of body.vaccine_product_id."
  - id: ERR_DOSE_PATIENT_MISMATCH
    http: 422
    condition: "AdverseEvent.dose_id does not belong to AdverseEvent.patient_id."
  - id: ERR_ONSET_OUT_OF_WINDOW
    http: 422
    condition: "AdverseEvent.onset_at not in [dose.administered_at, dose.administered_at + 42d]."
  - id: ERR_SOD_VIOLATION
    http: 422
    condition: "Reviewing clinician equals administering clinician for the dose under review."
  - id: ERR_PROVIDER_SUSPENDED
    http: 403
    condition: "ProviderOrganization.status == SUSPENDED."
  - id: ERR_VAERS_NOT_REPORTABLE
    http: 422
    condition: "vaers_required == false and body.elective != true."
  - id: ERR_VALIDATION
    http: 400
    condition: "Required field missing or wrong type."

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ProviderClinician
    description: "Clinician at a ProviderOrganization who schedules and administers doses, records allergies, and reports adverse events."
    identity: "opaque"
    exclusive_operations:
      - "POST /patients/{patient_id}/doses"
      - "POST /patients/{patient_id}/doses/{dose_id}/administer"
      - "POST /patients/{patient_id}/doses/{dose_id}/cancel"
      - "POST /patients/{patient_id}/allergies"
      - "POST /vaccine-lots"
    shared_operations:
      - "POST /patients (with SchoolRegistrar, PublicHealthOfficer)"
      - "POST /adverse-events (with ReviewingClinician)"
      - "GET endpoints on Patient, AdministeredDose, AllergyRecord, VaccineProduct, VaccineLot, AdverseEvent"

  - name: ReviewingClinician
    description: "Independent clinician (not the one who administered) who reviews adverse events and submits to VAERS. Segregation-of-duties enforced via SOD validation."
    identity: "opaque"
    exclusive_operations:
      - "POST /adverse-events/{id}/start-review"
      - "POST /adverse-events/{id}/conclude-review"
      - "POST /adverse-events/{id}/submit-vaers"
    shared_operations:
      - "POST /adverse-events (with ProviderClinician)"
      - "GET endpoints on AdverseEvent, AdministeredDose, Patient (read-only)"

  - name: SchoolRegistrar
    description: "School staff who create and manage school enrollment certificates. Cannot administer doses."
    identity: "opaque"
    exclusive_operations:
      - "POST /patients/{patient_id}/certificates"
      - "POST /patients/{patient_id}/certificates/{cert_id}/issue"
      - "POST /patients/{patient_id}/certificates/{cert_id}/revoke"
    shared_operations:
      - "POST /patients (with ProviderClinician, PublicHealthOfficer)"
      - "GET endpoints on Patient, SchoolEnrollmentCertificate, AdministeredDose (read-only), AntigenScheduleRule"

  - name: PublicHealthOfficer
    description: "State public-health official who manages products, lots, recalls, schedule rules, providers. Cannot administer doses or review adverse events (read-only on AE)."
    identity: "opaque"
    exclusive_operations:
      - "POST /vaccine-products"
      - "POST /vaccine-lots/{lot_id}/recall"
      - "POST /patients/{patient_id}/doses/{dose_id}/invalidate"
      - "POST /antigen-schedule-rules"
      - "POST /provider-organizations"
      - "POST /provider-organizations/{id}/suspend"
      - "POST /provider-organizations/{id}/reinstate"
      - "POST /_clock/advance"
      - "POST /_events/vaers-ack"
      - "GET /patients (list, cross-patient)"
    shared_operations:
      - "POST /patients (with ProviderClinician, SchoolRegistrar)"
      - "POST /vaccine-lots (with ProviderClinician)"
      - "GET endpoints on all entities"
