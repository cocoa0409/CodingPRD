scaffold_difficulty_design:

  # ============================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # ============================================================
  - rule_id: dual_variant_calc
    instances:
      - name: patronage_allocation_provisional_vs_final_on_member_equity
        grounds:
          - calculations.patronage_allocation_provisional
          - entities.PatronageAllocation.fields.variant
          - state_machines.FiscalYear.UNDER_AUDIT_to_CLOSED_FINAL
        distinguishing_aspect: |
          Dual-variant on the PatronageAllocation entity domain: PROVISIONAL
          variant (computed at close_provisional with unaudited net_margin) vs
          FINAL variant (recomputed at finalize_close with audited margin and
          exclusion of post-provisional-cancelled deliveries) MUST produce
          different qualified_allocation_cents for the same member when an
          audit adjustment reduces net_margin_cents by 100_000 cents.
        test_recipe:
          setup:
            - "District DIST-A exists"
            - "Member M1 (ACTIVE producer, district DIST-A) with patron_ref P-001"
            - "Member M2 (ACTIVE producer, district DIST-A) with patron_ref P-002"
            - "FiscalYear FY1 OPEN, start 2025-09-01, end 2026-08-31, net_margin_cents=1_000_000, retained_reserve_pct=0.20, qualified_payout_pct=0.40"
            - "M1 delivers 5000 bu CORN patron-sourced, settled (T2 tier)"
            - "M2 delivers 15000 bu SOYBEAN patron-sourced, settled (T3 tier)"
            - "FY1 close_provisional → PROVISIONAL allocations exist"
            - "FY1 begin_audit → UNDER_AUDIT"
            - "Audit adjusts net_margin_cents down by 100_000 (simulated by reopening or by directly invoking finalize with revised margin context)"
          setup_api_calls:
            - call: "POST /coop/_clock/set_current_utc"
              payload: { to_iso8601: "2025-09-01T00:00:00Z" }
              as: CoopAdmin
            - call: "POST /coop/delegate_districts"
              payload: { code: "DIST-A", name: "District A", max_delegates: 3 }
              as: CoopAdmin
              captures: { dist_a: $.data.id }
            - call: "POST /coop/members"
              payload: { patron_ref: "P-001", legal_name: "Alice Farm", member_class: "INDIVIDUAL", joined_at: "2020-01-01T00:00:00Z", delegate_district_id: "${dist_a}", is_producer_member: true }
              as: CoopRegistrar
              captures: { m1: $.data.id }
            - call: "POST /coop/members"
              payload: { patron_ref: "P-002", legal_name: "Bob Farm", member_class: "INDIVIDUAL", joined_at: "2020-01-01T00:00:00Z", delegate_district_id: "${dist_a}", is_producer_member: true }
              as: CoopRegistrar
              captures: { m2: $.data.id }
            - call: "POST /coop/fiscal_years"
              payload: { year_code: "FY2026", start_date: "2025-09-01T00:00:00Z", end_date: "2026-08-31T00:00:00Z", net_margin_cents: 1000000, retained_reserve_pct: 0.20, qualified_payout_pct: 0.40 }
              as: CoopAccountant
              captures: { fy1: $.data.id, fy1_v: $.data.version }
            - call: "POST /coop/deliveries"
              payload: { member_id: "${m1}", fiscal_year_id: "${fy1}", commodity: "CORN", gross_bushels: 5000, dockage_pct: 0.0, is_patron_sourced: true }
              as: ElevatorOperator
              captures: { d1: $.data.id }
            - call: "POST /coop/deliveries"
              payload: { member_id: "${m2}", fiscal_year_id: "${fy1}", commodity: "SOYBEAN", gross_bushels: 15000, dockage_pct: 0.0, is_patron_sourced: true }
              as: ElevatorOperator
              captures: { d2: $.data.id }
            - call: "POST /coop/deliveries/${d1}/settle"
              payload: {}
              as: ElevatorOperator
            - call: "POST /coop/deliveries/${d2}/settle"
              payload: {}
              as: ElevatorOperator
            - call: "POST /coop/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: CoopAdmin
            - call: "POST /coop/fiscal_years/${fy1}/close_provisional"
              payload: {}
              as: CoopAccountant
            - call: "GET /coop/fiscal_years/${fy1}/allocations"
              payload: {}
              as: CoopAccountant
              captures: { alloc_m1_provisional: "$.data[0].qualified_allocation_cents" }
            - call: "POST /coop/fiscal_years/${fy1}/begin_audit"
              payload: {}
              as: ExternalAuditor
            - call: "GET /coop/fiscal_years/${fy1}"
              payload: {}
              as: CoopAccountant
              captures: { fy1_v_pre_final: $.data.version }
          trigger:
            - call: "POST /coop/fiscal_years/${fy1}/finalize_close"
              payload: { expected_fiscal_year_version: "${fy1_v_pre_final}" }
              as: CoopAccountant
          assert:
            - "FiscalYear.${fy1}.status == CLOSED_FINAL"
            - "PatronageAllocation for M1 variant == FINAL"
            - "PatronageAllocation for M1 qualified_allocation_cents == PatronageAllocation variant PROVISIONAL qualified_allocation_cents when audit margin unchanged; different when audit adjusted"

      - name: per_unit_retain_per_delivery_vs_aggregate_on_member_ledger
        grounds:
          - calculations.per_unit_retain_valuation
          - entities.GrainDelivery.fields.per_unit_retain_cents
          - entities.Member.fields.per_unit_retains_cents
        distinguishing_aspect: |
          Dual-variant on the Member ledger domain (per_unit_retains_cents):
          per_delivery_round (production) rounds each delivery to integer cents
          then sums; aggregate_then_round (audit-only) sums raw decimal and
          rounds once at year end. For 3 deliveries of 33 bu CORN each (rate 8c),
          per-delivery produces 3 * round_half_up(33*8) = 3*264 = 792 cents;
          aggregate produces round_half_up(99*8) = 792 cents — same here, but
          for 3 deliveries of 13 bu CORN: per-delivery = 3*round_half_up(13*8)=3*104=312
          vs aggregate = round_half_up(39*8)=312 — same again. Use 13 bu at
          dockage_pct 0.05: net=floor(13*0.95)=12 bu, retain=round_half_up(12*8)=96c.
          Three such deliveries: per-delivery=288c. Aggregate uses raw
          (13*0.95)*8*3=296.4 → rounds to 296c. Difference: 8 cents.
        test_recipe:
          setup:
            - "District DIST-B exists"
            - "Member M3 (ACTIVE producer, DIST-B)"
            - "FiscalYear FY2 OPEN"
            - "M3 books and settles 3 deliveries of 13 bu CORN at dockage_pct=0.05 each"
          setup_api_calls:
            - call: "POST /coop/_clock/set_current_utc"
              payload: { to_iso8601: "2025-09-01T00:00:00Z" }
              as: CoopAdmin
            - call: "POST /coop/delegate_districts"
              payload: { code: "DIST-B", name: "District B", max_delegates: 3 }
              as: CoopAdmin
              captures: { dist_b: $.data.id }
            - call: "POST /coop/members"
              payload: { patron_ref: "P-003", legal_name: "Carol Farm", member_class: "INDIVIDUAL", joined_at: "2020-01-01T00:00:00Z", delegate_district_id: "${dist_b}", is_producer_member: true }
              as: CoopRegistrar
              captures: { m3: $.data.id }
            - call: "POST /coop/fiscal_years"
              payload: { year_code: "FY2026", start_date: "2025-09-01T00:00:00Z", end_date: "2026-08-31T00:00:00Z", net_margin_cents: 500000, retained_reserve_pct: 0.10, qualified_payout_pct: 0.30 }
              as: CoopAccountant
              captures: { fy2: $.data.id }
            - call: "POST /coop/deliveries"
              payload: { member_id: "${m3}", fiscal_year_id: "${fy2}", commodity: "CORN", gross_bushels: 13, dockage_pct: 0.05, is_patron_sourced: true }
              as: ElevatorOperator
              captures: { d_a: $.data.id }
            - call: "POST /coop/deliveries/${d_a}/settle"
              payload: {}
              as: ElevatorOperator
            - call: "POST /coop/deliveries"
              payload: { member_id: "${m3}", fiscal_year_id: "${fy2}", commodity: "CORN", gross_bushels: 13, dockage_pct: 0.05, is_patron_sourced: true }
              as: ElevatorOperator
              captures: { d_b: $.data.id }
            - call: "POST /coop/deliveries/${d_b}/settle"
              payload: {}
              as: ElevatorOperator
            - call: "POST /coop/deliveries"
              payload: { member_id: "${m3}", fiscal_year_id: "${fy2}", commodity: "CORN", gross_bushels: 13, dockage_pct: 0.05, is_patron_sourced: true }
              as: ElevatorOperator
              captures: { d_c: $.data.id }
            - call: "POST /coop/deliveries/${d_c}/settle"
              payload: {}
              as: ElevatorOperator
          trigger:
            - call: "GET /coop/members/${m3}"
              payload: {}
              as: CoopRegistrar
          assert:
            - "Member.${m3}.per_unit_retains_cents == 288  # per-delivery rounding: 3 * round_half_up(12 * 8) = 3*96 = 288"
            - "Member.${m3}.per_unit_retains_cents != 296  # aggregate-then-round would give round_half_up(39*0.95*8)=round_half_up(296.4)=296"
            - "GrainDelivery.${d_a}.per_unit_retain_cents == 96"
            - "GrainDelivery.${d_a}.net_bushels == 12  # floor(13 * 0.95) = floor(12.35) = 12"

  # ============================================================
  # Rule 2 — Combinatorial formulas across different modes
  # ============================================================
  - rule_id: combinatorial_formula
    instances:
      - name: patronage_allocation_tiered_formula_with_conditional_branches
        grounds:
          - calculations.patronage_allocation_provisional
          - calculations.tier_rate_modifier
        distinguishing_aspect: |
          Mode (a) — formula with >=3 inputs and non-linear interaction:
          qualified_allocation_cents depends on net_margin_cents, retained_reserve_pct,
          member's allocated_volume_bu (which selects tier via tier_rate_modifier),
          total_patron_volume_bu, qualified_payout_pct, AND conditional branch on
          tier_code (T1/T2/T3 select different rate_mod). Nested round_half_up at
          multiple stages interacts with the tier selection.
        test_recipe:
          setup:
            - "District DIST-C exists"
            - "Member M4 with allocated_volume_bu exactly at T2 boundary (1000 bu)"
            - "Member M5 with allocated_volume_bu exactly at T3 boundary (10000 bu)"
            - "FiscalYear FY3 with net_margin_cents=2_000_000, retained_reserve_pct=0.25, qualified_payout_pct=0.50"
            - "Total patron volume = 11000 bu (M4=1000 + M5=10000)"
            - "FY3 closed provisional"
          setup_api_calls:
            - call: "POST /coop/_clock/set_current_utc"
              payload: { to_iso8601: "2025-09-01T00:00:00Z" }
              as: CoopAdmin
            - call: "POST /coop/delegate_districts"
              payload: { code: "DIST-C", name: "District C", max_delegates: 3 }
              as: CoopAdmin
              captures: { dist_c: $.data.id }
            - call: "POST /coop/members"
              payload: { patron_ref: "P-004", legal_name: "Dan Farm", member_class: "INDIVIDUAL", joined_at: "2020-01-01T00:00:00Z", delegate_district_id: "${dist_c}", is_producer_member: true }
              as: CoopRegistrar
              captures: { m4: $.data.id }
            - call: "POST /coop/members"
              payload: { patron_ref: "P-005", legal_name: "Eve Farm", member_class: "INDIVIDUAL", joined_at: "2020-01-01T00:00:00Z", delegate_district_id: "${dist_c}", is_producer_member: true }
              as: CoopRegistrar
              captures: { m5: $.data.id }
            - call: "POST /coop/fiscal_years"
              payload: { year_code: "FY2026", start_date: "2025-09-01T00:00:00Z", end_date: "2026-08-31T00:00:00Z", net_margin_cents: 2000000, retained_reserve_pct: 0.25, qualified_payout_pct: 0.50 }
              as: CoopAccountant
              captures: { fy3: $.data.id }
            - call: "POST /coop/deliveries"
              payload: { member_id: "${m4}", fiscal_year_id: "${fy3}", commodity: "WHEAT", gross_bushels: 1000, dockage_pct: 0.0, is_patron_sourced: true }
              as: ElevatorOperator
              captures: { d_m4: $.data.id }
            - call: "POST /coop/deliveries/${d_m4}/settle"
              payload: {}
              as: ElevatorOperator
            - call: "POST /coop/deliveries"
              payload: { member_id: "${m5}", fiscal_year_id: "${fy3}", commodity: "WHEAT", gross_bushels: 10000, dockage_pct: 0.0, is_patron_sourced: true }
              as: ElevatorOperator
              captures: { d_m5: $.data.id }
            - call: "POST /coop/deliveries/${d_m5}/settle"
              payload: {}
              as: ElevatorOperator
            - call: "POST /coop/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: CoopAdmin
            - call: "POST /coop/fiscal_years/${fy3}/close_provisional"
              payload: {}
              as: CoopAccountant
          trigger:
            - call: "GET /coop/fiscal_years/${fy3}/allocations"
              payload: {}
              as: CoopAccountant
          assert:
            - "PatronageAllocation for M4 tier_code == T2  # 1000 >= 1000 (boundary uses >=)"
            - "PatronageAllocation for M5 tier_code == T3  # 10000 >= 10000"
            - "FiscalYear.${fy3}.patronage_pool_cents == 1500000  # round_half_up(2_000_000 * 0.75)"

      - name: per_unit_retain_rounding_order_pinned
        grounds:
          - calculations.per_unit_retain_valuation
          - entities.GrainDelivery.fields.per_unit_retain_cents
        distinguishing_aspect: |
          Mode (b) — nested rounding where the ORDER matters and the scaffold pins
          one: per-delivery round_half_up(net_bushels * rate) summed across
          deliveries (production) MUST differ from sum-then-round by a known
          amount when (gross*dockage) fractional bushels force floor() then
          round(). Pinning per-delivery order is mandatory; aggregate-then-round
          is explicitly a non-production audit variant.
        test_recipe:
          setup:
            - "District DIST-D exists, Member M6 (ACTIVE producer), FY4 OPEN"
            - "M6 books 5 deliveries of 7 bu SOYBEAN each at dockage_pct=0.10 (net = floor(7*0.9)=6 bu)"
            - "Each delivery per-delivery retain = round_half_up(6*10) = 60c; total = 300c"
            - "Aggregate variant would compute round_half_up(35*0.9*10) = round_half_up(315) = 315c"
            - "Difference: 15c — proves order matters and per-delivery is pinned"
          setup_api_calls:
            - call: "POST /coop/_clock/set_current_utc"
              payload: { to_iso8601: "2025-09-01T00:00:00Z" }
              as: CoopAdmin
            - call: "POST /coop/delegate_districts"
              payload: { code: "DIST-D", name: "District D", max_delegates: 3 }
              as: CoopAdmin
              captures: { dist_d: $.data.id }
            - call: "POST /coop/members"
              payload: { patron_ref: "P-006", legal_name: "Frank Farm", member_class: "INDIVIDUAL", joined_at: "2020-01-01T00:00:00Z", delegate_district_id: "${dist_d}", is_producer_member: true }
              as: CoopRegistrar
              captures: { m6: $.data.id }
            - call: "POST /coop/fiscal_years"
              payload: { year_code: "FY2026", start_date: "2025-09-01T00:00:00Z", end_date: "2026-08-31T00:00:00Z", net_margin_cents: 100000, retained_reserve_pct: 0.10, qualified_payout_pct: 0.30 }
              as: CoopAccountant
              captures: { fy4: $.data.id }
            - call: "POST /coop/deliveries"
              payload: { member_id: "${m6}", fiscal_year_id: "${fy4}", commodity: "SOYBEAN", gross_bushels: 7, dockage_pct: 0.10, is_patron_sourced: true }
              as: ElevatorOperator
              captures: { d1: $.data.id }
            - call: "POST /coop/deliveries/${d1}/settle"
              payload: {}
              as: ElevatorOperator
            - call: "POST /coop/deliveries"
              payload: { member_id: "${m6}", fiscal_year_id: "${fy4}", commodity: "SOYBEAN", gross_bushels: 7, dockage_pct: 0.10, is_patron_sourced: true }
              as: ElevatorOperator
              captures: { d2: $.data.id }
            - call: "POST /coop/deliveries/${d2}/settle"
              payload: {}
              as: ElevatorOperator
            - call: "POST /coop/deliveries"
              payload: { member_id: "${m6}", fiscal_year_id: "${fy4}", commodity: "SOYBEAN", gross_bushels: 7, dockage_pct: 0.10, is_patron_sourced: true }
              as: ElevatorOperator
              captures: { d3: $.data.id }
            - call: "POST /coop/deliveries/${d3}/settle"
              payload: {}
              as: ElevatorOperator
            - call: "POST /coop/deliveries"
              payload: { member_id: "${m6}", fiscal_year_id: "${fy4}", commodity: "SOYBEAN", gross_bushels: 7, dockage_pct: 0.10, is_patron_sourced: true }
              as: ElevatorOperator
              captures: { d4: $.data.id }
            - call: "POST /coop/deliveries/${d4}/settle"
              payload: {}
              as: ElevatorOperator
            - call: "POST /coop/deliveries"
              payload: { member_id: "${m6}", fiscal_year_id: "${fy4}", commodity: "SOYBEAN", gross_bushels: 7, dockage_pct: 0.10, is_patron_sourced: true }
              as: ElevatorOperator
              captures: { d5: $.data.id }
            - call: "POST /coop/deliveries/${d5}/settle"
              payload: {}
              as: ElevatorOperator
          trigger:
            - call: "GET /coop/members/${m6}"
              payload: {}
              as: CoopRegistrar
          assert:
            - "Member.${m6}.per_unit_retains_cents == 300  # 5 * round_half_up(floor(7*0.9) * 10) = 5 * 60"
            - "Member.${m6}.per_unit_retains_cents != 315  # aggregate-then-round would yield round_half_up(35*0.9*10) = 315"
            - "GrainDelivery.${d1}.net_bushels == 6"

  # ============================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # ============================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: fiscal_year_cyclic_reopen_after_final
        grounds:
          - state_machines.FiscalYear.CLOSED_FINAL_to_REOPENED
          - state_machines.FiscalYear.REOPENED_to_CLOSED_FINAL
        distinguishing_aspect: |
          FiscalYear machine is cyclic: CLOSED_FINAL → REOPENED → CLOSED_FINAL
          forms a revision loop driven by an AMEND_ALLOCATION BoardResolution.
          Requires re-finalization to issue CORRECTED_1099_PATR forms pointing
          to the now-VOID originals.
        test_recipe:
          setup:
            - "District DIST-E, Member M7, FY5 with one SETTLED delivery of 2000 bu CORN"
            - "FY5 has been taken through close_provisional → begin_audit → finalize_close (now CLOSED_FINAL)"
            - "Original PatronTaxForm issued for M7"
            - "PASSED BoardResolution AMEND_ALLOCATION references FY5"
          setup_api_calls:
            - call: "POST /coop/_clock/set_current_utc"
              payload: { to_iso8601: "2025-09-01T00:00:00Z" }
              as: CoopAdmin
            - call: "POST /coop/delegate_districts"
              payload: { code: "DIST-E", name: "District E", max_delegates: 3 }
              as: CoopAdmin
              captures: { dist_e: $.data.id }
            - call: "POST /coop/members"
              payload: { patron_ref: "P-007", legal_name: "Grace Farm", member_class: "INDIVIDUAL", joined_at: "2020-01-01T00:00:00Z", delegate_district_id: "${dist_e}", is_producer_member: true }
              as: CoopRegistrar
              captures: { m7: $.data.id }
            - call: "POST /coop/fiscal_years"
              payload: { year_code: "FY2026", start_date: "2025-09-01T00:00:00Z", end_date: "2026-08-31T00:00:00Z", net_margin_cents: 800000, retained_reserve_pct: 0.20, qualified_payout_pct: 0.40 }
              as: CoopAccountant
              captures: { fy5: $.data.id }
            - call: "POST /coop/deliveries"
              payload: { member_id: "${m7}", fiscal_year_id: "${fy5}", commodity: "CORN", gross_bushels: 2000, dockage_pct: 0.0, is_patron_sourced: true }
              as: ElevatorOperator
              captures: { d_m7: $.data.id }
            - call: "POST /coop/deliveries/${d_m7}/settle"
              payload: {}
              as: ElevatorOperator
            - call: "POST /coop/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: CoopAdmin
            - call: "POST /coop/fiscal_years/${fy5}/close_provisional"
              payload: {}
              as: CoopAccountant
            - call: "POST /coop/fiscal_years/${fy5}/begin_audit"
              payload: {}
              as: ExternalAuditor
            - call: "GET /coop/fiscal_years/${fy5}"
              payload: {}
              as: CoopAccountant
              captures: { fy5_v_pre_final: $.data.version }
            - call: "POST /coop/fiscal_years/${fy5}/finalize_close"
              payload: { expected_fiscal_year_version: "${fy5_v_pre_final}" }
              as: CoopAccountant
            - call: "GET /coop/members/${m7}/tax_forms"
              payload: {}
              as: CoopAccountant
              captures: { tax_form_orig: "$.data[0].id" }
            - call: "POST /coop/board_resolutions"
              payload: { resolution_code: "RES-AMEND-001", kind: "AMEND_ALLOCATION", subject_ref_id: "${fy5}", quorum_required: 1, voting_opens_at: "2026-09-01T00:00:00Z", voting_closes_at: "2026-09-02T00:00:00Z" }
              as: BoardSecretary
              captures: { res_amend: $.data.id }
            - call: "POST /coop/delegate_districts/${dist_e}/delegates"
              payload: { member_id: "${m7}", term_start: "2025-01-01T00:00:00Z", term_end: "2027-01-01T00:00:00Z" }
              as: CoopRegistrar
              captures: { del_m7: $.data.id }
            - call: "POST /coop/board_resolutions/${res_amend}/open_voting"
              payload: {}
              as: BoardSecretary
            - call: "POST /coop/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-03T00:00:00Z" }
              as: CoopAdmin
            - call: "POST /coop/board_resolutions/${res_amend}/record_vote"
              payload: { delegate_id: "${del_m7}", vote: "FOR" }
              as: BoardSecretary
          trigger:
            - call: "POST /coop/fiscal_years/${fy5}/reopen"
              payload: { resolution_id: "${res_amend}" }
              as: BoardSecretary
            - call: "GET /coop/fiscal_years/${fy5}"
              payload: {}
              as: CoopAccountant
              captures: { fy5_v_reopened: $.data.version }
            - call: "POST /coop/fiscal_years/${fy5}/finalize_close"
              payload: { expected_fiscal_year_version: "${fy5_v_reopened}" }
              as: CoopAccountant
          assert:
            - "FiscalYear.${fy5}.status == CLOSED_FINAL (after cyclic reopen)"
            - "PatronTaxForm.${tax_form_orig}.status == VOID"
            - "New PatronTaxForm exists with form_type == CORRECTED_1099_PATR and corrects_form_id == ${tax_form_orig}"

      - name: redemption_request_branching_with_appeal_cycle
        grounds:
          - state_machines.RedemptionRequest.UNDER_REVIEW_to_REJECTED
          - state_machines.RedemptionRequest.REJECTED_to_APPEALED
        distinguishing_aspect: |
          RedemptionRequest machine has branching fork-join: PENDING → UNDER_REVIEW →
          {APPROVED, REJECTED}; REJECTED loops back to a new UNDER_REVIEW via appeal
          (cyclic across entity instances), each branch firing different side effects
