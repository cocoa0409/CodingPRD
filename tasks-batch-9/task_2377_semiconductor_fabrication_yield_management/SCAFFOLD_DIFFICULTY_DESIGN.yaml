          assert:
            - "${pc} == 100.0"
            - "${exc_src} == PARTICLE"
            - "${exc_trig} == 100.0000"
            - "${exc_status} == CONTAINED"
            - "${exc_variant} == FINAL"
            - "${exc_scope} == EQUIPMENT"
