            - call: "POST /road-segments"
              payload: { association_id: "${assoc_id}", name: "Patchwork Main", length_feet: 1600, width_feet: 22, max_grade_pct: 8, surface_type: "GRAVEL", turnout_count: 1, turnaround_present: true, bridge_present: false, culvert_count: 2 }
              as: RoadCommissioner
              as_user_id: "rc-1"
