        grounds:
          - state_machines.TeachOutPlan.APPROVED_to_IN_EFFECT
          - validations[priority=36]
          - validations[priority=31]
        distinguishing_aspect: |
          The TeachOutPlan is in APPROVED, which is the only legal source state
          for ACTIVATE, and every one of its own aggregates is clean
          (seat_shortfall 0, at_risk_student_count 0). It is refused anyway
          because a different entity two hops away — the DecisionRecord — is only
