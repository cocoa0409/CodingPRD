scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: damage_fee_replacement_vs_depreciated_divergence
        grounds:
          - calculations.damage_fee_cents
          - entities.DamageClaim.fields.assessed_fee_cents
          - state_machines.DamageClaim.REPORTED_to_ASSESSED
        distinguishing_aspect: |
          Damage-claim fee domain: identical inputs (base_value_cents 40000, grade B, age 943 days)
          yield 40000 under the REPLACEMENT variant (claim_type LOST forces factors to 1.0) versus
          12800 under the DEPRECIATED variant (claim_type DAMAGED applies 0.8 x 0.4) — same data,
          two policy-selected variants, different money.
        test_recipe:
          setup:
            - "Two ACTIVE players P1, P2; two HELMET gear items (grade A, cert 2028-01-01, acquired_on 2024-01-01) issued to P1 and P2 respectively"
            - "Claim1: LOST on P1's item with base_value_cents 40000; Claim2: DAMAGED on P2's item with base_value_cents 40000"
            - "Logical clock at default 2026-08-01T00:00:00Z (age = 943 days -> age_factor 0.4)"
          setup_api_calls:
            - { call: "POST /players", payload: { full_name: "P One", position_group: "OFFENSE" }, as: EquipmentManager, captures: { p1: $.data.id } }
            - { call: "POST /players", payload: { full_name: "P Two", position_group: "DEFENSE" }, as: EquipmentManager, captures: { p2: $.data.id } }
            - { call: "POST /gear-items", payload: { asset_tag: "HLM-001", item_type: "HELMET", size_spec: "HELMET-L", acquired_on: "2024-01-01", certification_expires_on: "2028-01-01T00:00:00Z" }, as: EquipmentManager, captures: { h1: $.data.id } }
            - { call: "POST /gear-items", payload: { asset_tag: "HLM-002", item_type: "HELMET", size_spec: "HELMET-L", acquired_on: "2024-01-01", certification_expires_on: "2028-01-01T00:00:00Z" }, as: EquipmentManager, captures: { h2: $.data.id } }
            - { call: "POST /gear-items/${h1}/issue", payload: { player_id: "${p1}" }, as: EquipmentManager }
            - { call: "POST /gear-items/${h2}/issue", payload: { player_id: "${p2}" }, as: EquipmentManager }
            - { call: "POST /damage-claims", payload: { player_id: "${p1}", claim_type: "LOST", base_value_cents: 40000, gear_item_id: "${h1}" }, as: EquipmentManager, captures: { c1: $.data.id } }
            - { call: "POST /damage-claims", payload: { player_id: "${p2}", claim_type: "DAMAGED", base_value_cents: 40000, gear_item_id: "${h2}" }, as: EquipmentManager, captures: { c2: $.data.id } }
          trigger:
            - { call: "POST /damage-claims/${c1}/assess", payload: { condition_grade: "B" }, as: EquipmentManager }
            - { call: "POST /damage-claims/${c2}/assess", payload: { condition_grade: "B" }, as: EquipmentManager }
          assert:
            - "DamageClaim.${c1}.assessed_fee_cents == 40000 (REPLACEMENT: factors forced to 1.0; min(50000, max(5000, 40000)))"
            - "DamageClaim.${c2}.assessed_fee_cents == 12800 (DEPRECIATED: 40000 x 0.80 x 0.40 = 12800)"
            - "DamageClaim.${c1}.provisional_fee_cents == 40000 and DamageClaim.${c2}.provisional_fee_cents == 40000 (provisional always REPLACEMENT)"
            - "DamageClaim.${c1}.status == ASSESSED and DamageClaim.${c2}.status == ASSESSED"

      - name: reorder_quantity_onhand_vs_forward_looking
        grounds:
          - calculations.reorder_threshold_check
          - entities.InventoryPool.fields.reorder_blocked
          - entities.KitOrder.fields.source
        distinguishing_aspect: |
          Inventory-pool reorder domain (different entity domain from the damage-fee instance):
          with an inbound open order of 4 units, the ON_HAND_ONLY variant computes a reorder quantity
          of (6-6)+5 = 5 while the authoritative FORWARD_LOOKING variant computes (6-6-4)+5 = 1 —
          same pool state, two valid algorithms, different order quantities.
        test_recipe:
          setup:
            - "Season 2026-FALL; jersey pool stock 10 / reorder_point 6 / batch 5; pants pool stock 50 / point 0 / batch 1"
            - "ACTIVE contract with GAME_JERSEY cap 50; one MANUAL order for 4 GAME_JERSEY already SUBMITTED (inbound_open = 4, committed = 4)"
            - "Four players each holding a RESERVED kit drawing on the jersey pool (4th reservation crosses the point: available 7 -> 6)"
          setup_api_calls:
            - { call: "POST /inventory-pools", payload: { season_label: "2026-FALL", garment_type: "GAME_JERSEY", size_code: "M", stock_on_hand: 10, reorder_point: 6, reorder_batch_size: 5 }, as: EquipmentManager, captures: { jp: $.data.id } }
            - { call: "POST /inventory-pools", payload: { season_label: "2026-FALL", garment_type: "GAME_PANTS", size_code: "34", stock_on_hand: 50, reorder_point: 0, reorder_batch_size: 1 }, as: EquipmentManager, captures: { pp: $.data.id } }
            - { call: "POST /supplier-contracts", payload: { vendor_name: "ACME", season_label: "2026-FALL", start_on: "2026-06-01", end_on: "2027-05-31", allocation_caps: [{ garment_type: "GAME_JERSEY", max_units: 50 }, { garment_type: "GAME_PANTS", max_units: 50 }], default_lead_time_days: 30 }, as: TeamAdmin, captures: { sc: $.data.id } }
            - { call: "POST /supplier-contracts/${sc}/activate", payload: {}, as: TeamAdmin }
            - { call: "POST /kit-orders", payload: { supplier_contract_id: "${sc}", lines: [{ garment_type: "GAME_JERSEY", size_code: "M", quantity: 4, unit_price_cents: 5000 }] }, as: EquipmentManager }
            - { call: "POST /players", payload: { full_name: "K One", position_group: "OFFENSE" }, as: EquipmentManager, captures: { k1p: $.data.id } }
            - { call: "POST /players", payload: { full_name: "K Two", position_group: "OFFENSE" }, as: EquipmentManager, captures: { k2p: $.data.id } }
            - { call: "POST /players", payload: { full_name: "K Three", position_group: "DEFENSE" }, as: EquipmentManager, captures: { k3p: $.data.id } }
            - { call: "POST /players", payload: { full_name: "K Four", position_group: "DEFENSE" }, as: EquipmentManager, captures: { k4p: $.data.id } }
            - { call: "POST /kit-assignments", payload: { player_id: "${k1p}", season_label: "2026-FALL", jersey_number: 1, jersey_pool_id: "${jp}", pants_pool_id: "${pp}" }, as: EquipmentManager }
            - { call: "POST /kit-assignments", payload: { player_id: "${k2p}", season_label: "2026-FALL", jersey_number: 2, jersey_pool_id: "${jp}", pants_pool_id: "${pp}" }, as: EquipmentManager }
            - { call: "POST /kit-assignments", payload: { player_id: "${k3p}", season_label: "2026-FALL", jersey_number: 3, jersey_pool_id: "${jp}", pants_pool_id: "${pp}" }, as: EquipmentManager }
          trigger:
            - { call: "POST /kit-assignments", payload: { player_id: "${k4p}", season_label: "2026-FALL", jersey_number: 4, jersey_pool_id: "${jp}", pants_pool_id: "${pp}" }, as: EquipmentManager }
            - { call: "GET /kit-orders", payload: { supplier_contract_id: "${sc}", source: "AUTO_REORDER" }, as: EquipmentManager, captures: { auto_order: "$.data[0].id" } }
            - { call: "GET /supplier-contracts/${sc}", payload: {}, as: EquipmentManager }
          assert:
            - "InventoryPool.${jp}.available_quantity == 6 and reserved_quantity == 4"
            - "GET /kit-orders?supplier_contract_id=${sc}&source=AUTO_REORDER returns exactly 1 order"
            - "AUTO_REORDER order ${auto_order}.lines[0].quantity == 1 (FORWARD_LOOKING: (6-6-4)+5), NOT 5 (ON_HAND_ONLY: (6-6)+5)"
            - "AUTO_REORDER order ${auto_order}.status == SUBMITTED and source == AUTO_REORDER"
            - "SupplierContract.${sc}.units_committed for GAME_JERSEY == 5 (4 manual + 1 auto)"

  - rule_id: combinatorial_formula
    instances:
      - name: damage_fee_tiered_min_max_boundary
        grounds:
          - calculations.damage_fee_cents
        distinguishing_aspect: |
          Mode (a) combinatorial formula: >= 3 inputs (base value, tiered condition factor, stepped
          age factor) with non-linear nested min/max clamps — the DEDUCTIBLE_CENTS floor binds at
          5000 for a heavily depreciated DAMAGED claim, and the FEE_CAP_CENTS ceiling binds at
          50000 for a high-value LOST claim.
        test_recipe:
          setup:
            - "Two ACTIVE players; two HELMET items (grade A, cert 2028-01-01, acquired_on 2024-01-01) issued to them; clock at default 2026-08-01 (age tier 0.4)"
            - "ClaimF: DAMAGED, base 6000; ClaimC: LOST, base 80000"
          setup_api_calls:
            - { call: "POST /players", payload: { full_name: "F One", position_group: "OFFENSE" }, as: EquipmentManager, captures: { pf: $.data.id } }
            - { call: "POST /players", payload: { full_name: "C One", position_group: "DEFENSE" }, as: EquipmentManager, captures: { pc: $.data.id } }
            - { call: "POST /gear-items", payload: { asset_tag: "HLM-101", item_type: "HELMET", size_spec: "HELMET-M", acquired_on: "2024-01-01", certification_expires_on: "2028-01-01T00:00:00Z" }, as: EquipmentManager, captures: { hf: $.data.id } }
            - { call: "POST /gear-items", payload: { asset_tag: "HLM-102", item_type: "HELMET", size_spec: "HELMET-M", acquired_on: "2024-01-01", certification_expires_on: "2028-01-01T00:00:00Z" }, as: EquipmentManager, captures: { hc: $.data.id } }
            - { call: "POST /gear-items/${hf}/issue", payload: { player_id: "${pf}" }, as: EquipmentManager }
            - { call: "POST /gear-items/${hc}/issue", payload: { player_id: "${pc}" }, as: EquipmentManager }
            - { call: "POST /damage-claims", payload: { player_id: "${pf}", claim_type: "DAMAGED", base_value_cents: 6000, gear_item_id: "${hf}" }, as: EquipmentManager, captures: { cf: $.data.id } }
            - { call: "POST /damage-claims", payload: { player_id: "${pc}", claim_type: "LOST", base_value_cents: 80000, gear_item_id: "${hc}" }, as: EquipmentManager, captures: { cc: $.data.id } }
          trigger:
            - { call: "POST /damage-claims/${cf}/assess", payload: { condition_grade: "F" }, as: EquipmentManager }
            - { call: "POST /damage-claims/${cc}/assess", payload: { condition_grade: "A" }, as: EquipmentManager }
          assert:
            - "DamageClaim.${cf}.assessed_fee_cents == 5000 (raw 6000 x 0.25 x 0.40 = 600 clamped UP to DEDUCTIBLE_CENTS floor)"
            - "DamageClaim.${cc}.assessed_fee_cents == 50000 (raw 80000 clamped DOWN to FEE_CAP_CENTS ceiling)"

      - name: order_total_per_line_rounding_order
        grounds:
          - calculations.order_total_cents
          - entities.KitOrder.fields.subtotal_cents
          - entities.KitOrder.fields.total_cents
        distinguishing_aspect: |
          Mode (b) nested rounding: per-line round-then-sum (pinned) vs sum-then-round differ by one
          cent for lines 1055x0.9=949.5 and 1045x0.9=940.5 — pinned order yields 950+941=1891;
          the forbidden order yields 1890. Distinct mode from damage_fee's nested min/max (mode a).
        test_recipe:
          setup:
            - "ACTIVE contract (rebate 0) with GAME_JERSEY and GAME_PANTS caps >= 10; pools for GAME_JERSEY/M and GAME_PANTS/34 exist"
          setup_api_calls:
            - { call: "POST /inventory-pools", payload: { season_label: "2026-FALL", garment_type: "GAME_JERSEY", size_code: "M", stock_on_hand: 10, reorder_point: 0, reorder_batch_size: 1 }, as: EquipmentManager }
            - { call: "POST /inventory-pools", payload: { season_label: "2026-FALL", garment_type: "GAME_PANTS", size_code: "34", stock_on_hand: 10, reorder_point: 0, reorder_batch_size: 1 }, as: EquipmentManager }
            - { call: "POST /supplier-contracts", payload: { vendor_name: "ROUND-CO", season_label: "2026-FALL", start_on: "2026-06-01", end_on: "2027-05-31", allocation_caps: [{ garment_type: "GAME_JERSEY", max_units: 10 }, { garment_type: "GAME_PANTS", max_units: 10 }], default_lead_time_days: 14, contract_rebate_pct: 0 }, as: TeamAdmin, captures: { sc: $.data.id } }
            - { call: "POST /supplier-contracts/${sc}/activate", payload: {}, as: TeamAdmin }
          trigger:
            - { call: "POST /kit-orders", payload: { supplier_contract_id: "${sc}", lines: [{ garment_type: "GAME_JERSEY", size_code: "M", quantity: 1, unit_price_cents: 1055, line_discount_pct: 0.10 }, { garment_type: "GAME_PANTS", size_code: "34", quantity: 1, unit_price_cents: 1045, line_discount_pct: 0.10 }] }, as: EquipmentManager, captures: { ord: $.data.id } }
          assert:
            - "KitOrder.${ord}.subtotal_cents == 1891 (round_half_up(949.5)=950 plus round_half_up(940.5)=941)"
            - "KitOrder.${ord}.total_cents == 1891 (rebate 0)"
            - "KitOrder.${ord}.subtotal_cents != 1890 (sum-then-round result is forbidden)"
            - "KitOrder.${ord}.status == SUBMITTED and expected_delivery_on == 2026-08-15 (2026-08-01 + 14 days)"

  - rule_id: non_linear_state_machine
    instances:
      - name: gear_item_issue_recondition_cycle
        grounds:
          - state_machines.GearItem.IN_STOCK_to_ISSUED
          - state_machines.GearItem.ISSUED_to_IN_STOCK
          - state_machines.GearItem.IN_STOCK_to_OUT_FOR_RECONDITIONING
          - state_machines.GearItem.OUT_FOR_RECONDITIONING_to_IN_STOCK
          - state_machines.ReconditioningJob.OUT_to_PASSED
        distinguishing_aspect: |
          GearItem is cyclic (IN_STOCK -> ISSUED -> IN_STOCK -> OUT_FOR_RECONDITIONING -> IN_STOCK),
          not a linear pipeline; the reconditioning PASS rewrite of grade/certification proves the
          item re-enters circulation with mutated fields rather than terminating.
        test_recipe:
          setup:
            - "ACTIVE player; HELMET item grade A with certification_expires_on 2028-01-01; clock at default 2026-08-01"
          setup_api_calls:
            - { call: "POST /players", payload: { full_name: "Cyc One", position_group: "OFFENSE" }, as: EquipmentManager, captures: { p: $.data.id } }
            - { call: "POST /gear-items", payload: { asset_tag: "HLM-201", item_type: "HELMET", size_spec: "HELMET-L", acquired_on: "2025-06-01", certification_expires_on: "2028-01-01T00:00:00Z" }, as: EquipmentManager, captures: { g: $.data.id } }
            - { call: "POST /gear-items/${g}/issue", payload: { player_id: "${p}" }, as: EquipmentManager }
            - { call: "POST /gear-items/${g}/return", payload: {}, as: EquipmentManager }
            - { call: "POST /reconditioning-jobs", payload: { item_id: "${g}", provider_name: "RCOA", sent_on: "2026-08-01" }, as: EquipmentManager, captures: { j: $.data.id } }
          trigger:
            - { call: "POST /reconditioning-jobs/${j}/record-result", payload: { outcome: "PASSED", result_grade: "B" }, as: EquipmentManager }
            - { call: "GET /gear-items/${g}", payload: {}, as: EquipmentManager }
          assert:
            - "GearItem.${g}.status sequence was IN_STOCK -> ISSUED -> IN_STOCK -> OUT_FOR_RECONDITIONING -> IN_STOCK (cycle completed)"
            - "ReconditioningJob.${j}.status == PASSED and due_back_on == 2026-09-15 (sent_on 2026-08-01 + 45 days)"
            - "ReconditioningJob.${j}.certification_valid_until == 2027-08-01 (result date 2026-08-01 + 365 days)"
            - "GearItem.${g}.condition_grade == B and certification_expires_on == 2027-08-01T00:00:00Z"
            - "GearItem.${g}.current_holder_id == null"

      - name: damage_claim_assess_reopen_cycle
        grounds:
          - state_machines.DamageClaim.REPORTED_to_ASSESSED
          - state_machines.DamageClaim.ASSESSED_to_REPORTED
          - state_machines.DamageClaim.ASSESSED_to_SETTLED
        distinguishing_aspect: |
          DamageClaim is cyclic via the ASSESSED -> REPORTED reopen loop (different entity from
          GearItem): re-assessment after reopen recomputes the fee with a different grade
          (9600 with B, then 7200 with C), and the loop terminates in SETTLED.
        test_recipe:
          setup:
            - "ACTIVE player with an ISSUED HELMET (acquired_on 2024-01-01 -> age tier 0.4 at default clock); DAMAGED claim base 30000"
          setup_api_calls:
            - { call: "POST /players", payload: { full_name: "Loop One", position_group: "DEFENSE" }, as: EquipmentManager, captures: { p: $.data.id } }
            - { call: "POST /gear-items", payload: { asset_tag: "HLM-301", item_type: "HELMET", size_spec: "HELMET-XL", acquired_on: "2024-01-01", certification_expires_on: "2028-01-01T00:00:00Z" }, as: EquipmentManager, captures: { g: $.data.id } }
            - { call: "POST /gear-items/${g}/issue", payload: { player_id: "${p}" }, as: EquipmentManager }
            - { call: "POST /damage-claims", payload: { player_id: "${p}", claim_type: "DAMAGED", base_value_cents: 30000, gear_item_id: "${g}" }, as: EquipmentManager, captures: { c: $.data.id } }
            - { call: "POST /damage-claims/${c}/assess", payload: { condition_grade: "B" }, as: EquipmentManager }
          trigger:
            - { call: "POST /damage-claims/${c}/reopen", payload: {}, as: TeamAdmin }
            - { call: "POST /damage-claims/${c}/assess", payload: { condition_grade: "C" }, as: EquipmentManager }
            - { call: "POST /damage-claims/${c}/settle", payload: {}, as: EquipmentManager }
            - { call: "GET /gear-items/${g}", payload: {}, as: EquipmentManager }
          assert:
            - "First assessment produced assessed_fee_cents == 9600 (30000 x 0.80 x 0.40)"
            - "After reopen: status == REPORTED and assessed_fee_cents == null"
            - "Second assessment produced assessed_fee_cents == 7200 (30000 x 0.60 x 0.40)"
            - "After settle: status == SETTLED and final_fee_cents == 7200"
            - "GearItem.${g}.status == IN_STOCK and condition_grade == C (DAMAGED settle returns item with assessed grade)"

  - rule_id: transitive_cascade
    instances:
      - name: event_complete_laundry_reorder_contract_chain
        grounds:
          - state_machines.GameEvent.KIT_LOCKED_to_COMPLETED
          - calculations.pool_availability_reconciliation
          - calculations.reorder_threshold_check
          - calculations.units_committed_reconciliation
        distinguishing_aspect: |
          Depth-3 chain from the event-complete trigger: completing the event moves pool stock into
          laundry (link 1), the availability decrease crosses the reorder point and auto-creates a
          SUBMITTED reorder order (link 2), and that order itself commits units on the supplier
          contract (link 3) — each link caused by the previous one, not by the original call.
        test_recipe:
          setup:
            - "Season 2026-FALL; GAME_JERSEY/M pool stock 10, reorder_point 9, batch 4; ACTIVE contract cap GAME_JERSEY 12, lead 30d, committed 0"
            - "Event EV (HOME, kickoff 2026-09-05T15:00:00Z, one required checklist item SIDELINE_TENT), item DONE, kit locked"
          setup_api_calls:
            - { call: "POST /inventory-pools", payload: { season_label: "2026-FALL", garment_type: "GAME_JERSEY", size_code: "M", stock_on_hand: 10, reorder_point: 9, reorder_batch_size: 4 }, as: EquipmentManager, captures: { jp: $.data.id } }
            - { call: "POST /supplier-contracts", payload: { vendor_name: "ACME", season_label: "2026-FALL", start_on: "2026-06-01", end_on: "2027-05-31", allocation_caps: [{ garment_type: "GAME_JERSEY", max_units: 12 }], default_lead_time_days: 30 }, as: TeamAdmin, captures: { sc: $.data.id } }
            - { call: "POST /supplier-contracts/${sc}/activate", payload: {}, as: TeamAdmin }
            - { call: "POST /game-events", payload: { season_label: "2026-FALL", opponent_name: "Tigers", kickoff_at: "2026-09-05T15:00:00Z", designated_kit: "HOME", checklist: [{ item_ref: "SIDELINE_TENT", label: "Sideline tent erected", required: true }] }, as: EquipmentManager, captures: { ev: $.data.id } }
            - { call: "POST /game-events/${ev}/checklist/SIDELINE_TENT/complete", payload: { outcome: "DONE" }, as: EquipmentManager }
            - { call: "POST /game-events/${ev}/lock-kit", payload: {}, as: EquipmentManager }
          trigger:
            - { call: "POST /game-events/${ev}/complete", payload: { laundry_load: [{ pool_id: "${jp}", quantity: 2 }] }, as: EquipmentManager }
            - { call: "GET /inventory-pools/${jp}", payload: {}, as: EquipmentManager }
            - { call: "GET /kit-orders", payload: { supplier_contract_id: "${sc}", source: "AUTO_REORDER" }, as: EquipmentManager, captures: { auto_order: "$.data[0].id" } }
            - { call: "GET /supplier-contracts/${sc}", payload: {}, as: EquipmentManager }
          assert:
            - "InventoryPool.${jp}.stock_on_hand == 8 and in_laundry_quantity == 2 and available_quantity == 8 (link 1)"
            - "GameEvent.${ev}.laundry_status == COLLECTING and laundry_due_at == 2026-09-07T15:00:00Z"
            - "AUTO_REORDER order ${auto_order} exists with lines[0].quantity == 5 (link 2: (9-8-0)+4 clamped to remaining 12)"
            - "SupplierContract.${sc}.units_committed for GAME_JERSEY == 5 (link 3: order creation committed allocation)"
            - "InventoryPool.${jp}.reorder_blocked == false"

      - name: kit_return_restock_clears_reorder_block
        grounds:
          - state_machines.KitAssignment.ISSUED_to_RETURNED
          - calculations.reorder_threshold_check
          - entities.InventoryPool.fields.reorder_blocked
        distinguishing_aspect: |
          Depth-2 chain from a different trigger (kit return, not event completion): the return
          restocks the pool (link 1), and the resulting availability increase itself clears a
          previously latched reorder_blocked flag (link 2) — reverse-direction threshold behavior.
        test_recipe:
          setup:
            - "Season 2026-FALL with NO supplier contract; jersey pool stock 6, reorder_point 5, batch 4; pants pool stock 50, point 0"
            - "Kit reservation crosses the point (available 6 -> 5 <= 5) and, finding no contract, latches reorder_blocked = true; kit then ISSUED"
          setup_api_calls:
            - { call: "POST /inventory-pools", payload: { season_label: "2026-FALL", garment_type: "GAME_JERSEY", size_code: "L", stock_on_hand: 6, reorder_point: 5, reorder_batch_size: 4 }, as: EquipmentManager, captures: { jp: $.data.id } }
            - { call: "POST /inventory-pools", payload: { season_label: "2026-FALL", garment_type: "GAME_PANTS", size_code: "36", stock_on_hand: 50, reorder_point: 0, reorder_batch_size: 1 }, as: EquipmentManager, captures: { pp: $.data.id } }
            - { call: "POST /players", payload: { full_name: "Ret One", position_group: "OFFENSE" }, as: EquipmentManager, captures: { p: $.data.id } }
            - { call: "POST /kit-assignments", payload: { player_id: "${p}", season_label: "2026-FALL", jersey_number: 11, jersey_pool_id: "${jp}", pants_pool_id: "${pp}" }, as: EquipmentManager, captures: { ka: $.data.id } }
            - { call: "GET /inventory-pools/${jp}", payload: {}, as: EquipmentManager, captures: { blocked_before: $.data.reorder_blocked } }
            - { call: "POST /kit-assignments/${ka}/issue", payload: {}, as: EquipmentManager }
          trigger:
            - { call: "POST /kit-assignments/${ka}/return", payload: {}, as: EquipmentManager }
            - { call: "GET /inventory-pools/${jp}", payload: {}, as: EquipmentManager }
          assert:
            - "After reservation: InventoryPool.${jp}.reorder_blocked == true (threshold fired, no contract available)"
            - "After return: InventoryPool.${jp}.stock_on_hand == 6 and available_quantity == 6"
            - "After return: InventoryPool.${jp}.reorder_blocked == false (6 > 5 clears the latch)"
            - "KitAssignment.${ka}.status == RETURNED"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: order_create_state_beats_fiscal
        grounds:
          - validations[priority=5]
          - validations[priority=9]
          - errors[ERR_CONTRACT_NOT_ACTIVE]
          - errors[ERR_ALLOCATION_CAP_EXCEEDED]
        distinguishing_aspect: |
          Error-category pair state vs business_fiscal: the order violates contract
          state (DRAFT) and the allocation cap (99 > 10); the state error ERR_CONTRACT_NOT_ACTIVE
          (priority 5) must win over ERR_ALLOCATION_CAP_EXCEEDED (priority 9).
        test_recipe:
          setup:
            - "DRAFT contract with GAME_JERSEY cap 10; GAME_JERSEY/M pool exists"
          setup_api_calls:
            - { call: "POST /inventory-pools", payload: { season_label: "2026-FALL", garment_type: "GAME_JERSEY", size_code: "M", stock_on_hand: 10, reorder_point: 0, reorder_batch_size: 1 }, as: EquipmentManager }
            - { call: "POST /supplier-contracts", payload: { vendor_name: "DRAFTCO", season_label: "2026-FALL", start_on: "2026-06-01", end_on: "2027-05-31", allocation_caps: [{ garment_type: "GAME_JERSEY", max_units: 10 }], default_lead_time_days: 30 }, as: TeamAdmin, captures: { sc: $.data.id } }
          trigger:
            - { call: "POST /kit-orders", payload: { supplier_contract_id: "${sc}", lines: [{ garment_type: "GAME_JERSEY", size_code: "M", quantity: 99, unit_price_cents: 5000 }] }, as: EquipmentManager, captures: { err: $.data.error_id } }
          assert:
            - "response error_id == ERR_CONTRACT_NOT_ACTIVE (http 409), NOT ERR_ALLOCATION_CAP_EXCEEDED"
            - "no KitOrder was created (GET /kit-orders?supplier_contract_id=${sc} returns empty)"

      - name: gear_issue_safety_beats_gear_limit
        grounds:
          - validations[priority=6]
          - validations[priority=7]
          - errors[ERR_GEAR_CERTIFICATION_EXPIRED]
          - errors[ERR_PLAYER_GEAR_LIMIT_REACHED]
        distinguishing_aspect: |
          Error-category pair business_safety vs business_constraint (different pair from the
          state-vs-fiscal instance): issuing a second HELMET with an expired certification violates
          both the safety gate and the one-per-type limit; ERR_GEAR_CERTIFICATION_EXPIRED
          (priority 6) must win over ERR_PLAYER_GEAR_LIMIT_REACHED (priority 7).
        test_recipe:
          setup:
            - "ACTIVE player P already holds ISSUED HELMET H1 (cert 2028-01-01); H2 is an IN_STOCK HELMET whose certification_expires_on 2026-07-01T00:00:00Z is before the default clock 2026-08-01"
          setup_api_calls:
            - { call: "POST /players", payload: { full_name: "Safe One", position_group: "DEFENSE" }, as: EquipmentManager, captures: { p: $.data.id } }
            - { call: "POST /gear-items", payload: { asset_tag: "HLM-401", item_type: "HELMET", size_spec: "HELMET-L", acquired_on: "2025-01-15", certification_expires_on: "2028-01-01T00:00:00Z" }, as: EquipmentManager, captures: { h1: $.data.id } }
            - { call: "POST /gear-items", payload: { asset_tag: "HLM-402", item_type: "HELMET", size_spec: "HELMET-L", acquired_on: "2023-01-15", certification_expires_on: "2026-07-01T00:00:00Z" }, as: EquipmentManager, captures: { h2: $.data.id } }
            - { call: "POST /gear-items/${h1}/issue", payload: { player_id: "${p}" }, as: EquipmentManager }
          trigger:
            - { call: "POST /gear-items/${h2}/issue", payload: { player_id: "${p}" }, as: EquipmentManager, captures: { err: $.data.error_id } }
          assert:
            - "response error_id == ERR_GEAR_CERTIFICATION_EXPIRED (http 409), NOT ERR_PLAYER_GEAR_LIMIT_REACHED"
            - "GearItem.${h2}.status remains IN_STOCK and current_holder_id == null"

  - rule_id: boundary_precision_check
    instances:
      - name: allocation_cap_exact_fit_then_overflow
        grounds:
          - calculations.units_committed_reconciliation
          - errors[ERR_ALLOCATION_CAP_EXCEEDED]
        distinguishing_aspect: |
          Boundary on the committed-units metric via POST /kit-orders: an order landing exactly on
          the cap (committed 6 + 4 == cap 10) is accepted because the comparison is <=; one more
          unit (11 > 10) is rejected with 402.
        test_recipe:
          setup:
            - "ACTIVE contract cap GAME_JERSEY 10; GAME_JERSEY/M pool exists"
          setup_api_calls:
            - { call: "POST /inventory-pools", payload: { season_label: "2026-FALL", garment_type: "GAME_JERSEY", size_code: "M", stock_on_hand: 10, reorder_point: 0, reorder_batch_size: 1 }, as: EquipmentManager }
            - { call: "POST /supplier-contracts", payload: { vendor_name: "CAPCO", season_label: "2026-FALL", start_on: "2026-06-01", end_on: "2027-05-31", allocation_caps: [{ garment_type: "GAME_JERSEY", max_units: 10 }], default_lead_time_days: 30 }, as: TeamAdmin, captures: { sc: $.data.id } }
            - { call: "POST /supplier-contracts/${sc}/activate", payload: {}, as: TeamAdmin }
            - { call: "POST /kit-orders", payload: { supplier_contract_id: "${sc}", lines: [{ garment_type: "GAME_JERSEY", size_code: "M", quantity: 6, unit_price_cents: 5000 }] }, as: EquipmentManager }
          trigger:
            - { call: "POST /kit-orders", payload: { supplier_contract_id: "${sc}", lines: [{ garment_type: "GAME_JERSEY", size_code: "M", quantity: 4, unit_price_cents: 5000 }] }, as: EquipmentManager, captures: { ok_order: $.data.id } }
            - { call: "POST /kit-orders", payload: { supplier_contract_id: "${sc}", lines: [{ garment_type: "GAME_JERSEY", size_code: "M", quantity: 1, unit_price_cents: 5000 }] }, as: EquipmentManager, captures: { err: $.data.error_id } }
            - { call: "GET /supplier-contracts/${sc}", payload: {}, as: EquipmentManager }
          assert:
            - "KitOrder.${ok_order}.status == SUBMITTED (exact fit at cap 10 accepted)"
            - "third order rejected with error_id == ERR_ALLOCATION_CAP_EXCEEDED (http 402)"
            - "SupplierContract.${sc}.units_committed for GAME_JERSEY == 10 and remaining_allocation == 0"

      - name: alternate_kit_third_allowed_fourth_rejected
        grounds:
          - calculations.alternate_kit_rotation_count
          - errors[ERR_ALTERNATE_KIT_LIMIT_REACHED]
        distinguishing_aspect: |
          Boundary on the season rotation-count metric via POST /game-events (different metric and
          endpoint from the allocation-cap instance): the 3rd ALTERNATE designation (count == 2 < 3)
          is accepted; the 4th (count == 3) is rejected — strict < comparison.
        test_recipe:
          setup:
            - "Empty season 2026-FALL"
          setup_api_calls: []
          trigger:
            - { call: "POST /game-events", payload: { season_label: "2026-FALL", opponent_name: "A", kickoff_at: "2026-09-05T15:00:00Z", designated_kit: "ALTERNATE" }, as: EquipmentManager, captures: { e1: $.data.id } }
            - { call: "POST /game-events", payload: { season_label: "2026-FALL", opponent_name: "B", kickoff_at: "2026-09-12T15:00:00Z", designated_kit: "ALTERNATE" }, as: EquipmentManager }
            - { call: "POST /game-events", payload: { season_label: "2026-FALL", opponent_name: "C", kickoff_at: "2026-09-19T15:00:00Z", designated_kit: "ALTERNATE" }, as: EquipmentManager }
            - { call: "POST /game-events", payload: { season_label: "2026-FALL", opponent_name: "D", kickoff_at: "2026-09-26T15:00:00Z", designated_kit: "ALTERNATE" }, as: EquipmentManager, captures: { err: $.data.error_id } }
            - { call: "POST /game-events", payload: { season_label: "2026-FALL", opponent_name: "E", kickoff_at: "2026-10-03T15:00:00Z", designated_kit: "HOME" }, as: EquipmentManager, captures: { e5: $.data.id } }
          assert:
            - "First three ALTERNATE events all created with status == SCHEDULED (3rd allowed at count == 2)"
            - "Fourth ALTERNATE event rejected with error_id == ERR_ALTERNATE_KIT_LIMIT_REACHED (http 409)"
            - "HOME event ${e5} created successfully (cap applies only to ALTERNATE)"
            - "GameEvent.${e1}.status == SCHEDULED"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: kit_issue_blocked_for_suspended_player
        grounds:
          - state_machines.KitAssignment.RESERVED_to_ISSUED
          - state_machines.Player.ACTIVE_to_SUSPENDED
          - errors[ERR_PLAYER_NOT_ACTIVE]
        distinguishing_aspect: |
          Entity pair KitAssignment -> Player: the kit's RESERVED -> ISSUED transition is gated on
          the linked Player.status == ACTIVE; suspending the player blocks issue, reactivating
          unblocks it — the kit's own state alone is insufficient.
        test_recipe:
          setup:
            - "ACTIVE player; jersey/pants pools with stock; kit RESERVED for the player"
          setup_api_calls:
            - { call: "POST /inventory-pools", payload: { season_label: "2026-FALL", garment_type: "GAME_JERSEY", size_code: "M", stock_on_hand: 5, reorder_point: 0, reorder_batch_size: 1 }, as: EquipmentManager, captures: { jp: $.data.id } }
            - { call: "POST /inventory-pools", payload: { season_label: "2026-FALL", garment_type: "GAME_PANTS", size_code: "34", stock_on_hand: 5, reorder_point: 0, reorder_batch_size: 1 }, as: EquipmentManager, captures: { pp: $.data.id } }
            - { call: "POST /players", payload: { full_name: "Gate One", position_group: "OFFENSE" }, as: EquipmentManager, captures: { p: $.data.id } }
            - { call: "POST /kit-assignments", payload: { player_id: "${p}", season_label: "2026-FALL", jersey_number: 21, jersey_pool_id: "${jp}", pants_pool_id: "${pp}" }, as: EquipmentManager, captures: { ka: $.data.id } }
            - { call: "PATCH /players/${p}", payload: { status: "SUSPENDED" }, as: EquipmentManager }
          trigger:
            - { call: "POST /kit-assignments/${ka}/issue", payload: {}, as: EquipmentManager, captures: { err: $.data.error_id } }
            - { call: "PATCH /players/${p}", payload: { status: "ACTIVE" }, as: EquipmentManager }
            - { call: "POST /kit-assignments/${ka}/issue", payload: {}, as: EquipmentManager }
          assert:
            - "first issue rejected with error_id == ERR_PLAYER_NOT_ACTIVE (http 409)"
            - "KitAssignment.${ka} remained RESERVED while the player was SUSPENDED"
            - "second issue succeeds: KitAssignment.${ka}.status == ISSUED"

      - name: order_blocked_until_contract_activated
        grounds:
          - state_machines.SupplierContract.DRAFT_to_ACTIVE
          - state_machines.KitOrder.transitions
          - errors[ERR_CONTRACT_NOT_ACTIVE]
        distinguishing_aspect: |
          Entity pair KitOrder -> SupplierContract (different pair from KitAssignment -> Player):
          order creation is rejected while the contract is DRAFT and succeeds immediately after
          activation, with expected_delivery_on derived from the contract's lead time.
        test_recipe:
          setup:
            - "DRAFT contract (lead 30 days) cap GAME_JERSEY 10; GAME_JERSEY/M pool exists; clock at default 2026-08-01"
          setup_api_calls:
            - { call: "POST /inventory-pools", payload: { season_label: "2026-FALL", garment_type: "GAME_JERSEY", size_code: "M", stock_on_hand: 10, reorder_point: 0, reorder_batch_size: 1 }, as: EquipmentManager }
            - { call: "POST /supplier-contracts", payload: { vendor_name: "GATECO", season_label: "2026-FALL", start_on: "2026-06-01", end_on: "2027-05-31", allocation_caps: [{ garment_type: "GAME_JERSEY", max_units: 10 }], default_lead_time_days: 30 }, as: TeamAdmin, captures: { sc: $.data.id } }
          trigger:
            - { call: "POST /kit-orders", payload: { supplier_contract_id: "${sc}", lines: [{ garment_type: "GAME_JERSEY", size_code: "M", quantity: 2, unit_price_cents: 5000 }] }, as: EquipmentManager, captures: { err: $.data.error_id } }
            - { call: "POST /supplier-contracts/${sc}/activate", payload: {}, as: TeamAdmin }
            - { call: "POST /kit-orders", payload: { supplier_contract_id: "${sc}", lines: [{ garment_type: "GAME_JERSEY", size_code: "M", quantity: 2, unit_price_cents: 5000 }] }, as: EquipmentManager, captures: { ord: $.data.id } }
          assert:
            - "first order rejected with error_id == ERR_CONTRACT_NOT_ACTIVE (http 409)"
            - "second order succeeds: KitOrder.${ord}.status == SUBMITTED and source == MANUAL"
            - "KitOrder.${ord}.expected_delivery_on == 2026-08-31 (default clock 2026-08-01 + 30 days)"

  - rule_id: resource_temporal_overlap
    instances:
      - name: provider_concurrent_job_capacity_enforced
        grounds:
          - calculations.provider_capacity_check
          - errors[ERR_VENDOR_CAPACITY_EXCEEDED]
        distinguishing_aspect: |
          Aggregate-capacity interval semantics on the provider resource: half-open windows
          [sent_on, due_back_on) may individually overlap; the 3rd overlapping OUT job at the same
          provider breaches the cap of 2, while the same window at a different provider is fine.
        test_recipe:
          setup:
            - "Three IN_STOCK HELMETs (grade A, cert 2028-01-01)"
          setup_api_calls:
            - { call: "POST /gear-items", payload: { asset_tag: "HLM-501", item_type: "HELMET", size_spec: "HELMET-L", acquired_on: "2025-01-01", certification_expires_on: "2028-01-01T00:00:00Z" }, as: EquipmentManager, captures: { g1: $.data.id } }
            - { call: "POST /gear-items", payload: { asset_tag: "HLM-502", item_type: "HELMET", size_spec: "HELMET-L", acquired_on: "2025-01-01", certification_expires_on: "2028-01-01T00:00:00Z" }, as: EquipmentManager, captures: { g2: $.data.id } }
            - { call: "POST /gear-items", payload: { asset_tag: "HLM-503", item_type: "HELMET", size_spec: "HELMET-M", acquired_on: "2025-01-01", certification_expires_on: "2028-01-01T00:00:00Z" }, as: EquipmentManager, captures: { g3: $.data.id } }
            - { call: "POST /reconditioning-jobs", payload: { item_id: "${g1}", provider_name: "RCOA", sent_on: "2026-01-05" }, as: EquipmentManager, captures: { j1: $.data.id } }
            - { call: "POST /reconditioning-jobs", payload: { item_id: "${g2}", provider_name: "RCOA", sent_on: "2026-01-10" }, as: EquipmentManager, captures: { j2: $.data.id } }
          trigger:
            - { call: "POST /reconditioning-jobs", payload: { item_id: "${g3}", provider_name: "RCOA", sent_on: "2026-01-15" }, as: EquipmentManager, captures: { err: $.data.error_id } }
            - { call: "POST /reconditioning-jobs", payload: { item_id: "${g3}", provider_name: "OTHERCO", sent_on: "2026-01-15" }, as: EquipmentManager, captures: { j3: $.data.id } }
          assert:
            - "ReconditioningJob.${j1}.due_back_on == 2026-02-19 and ${j2}.due_back_on == 2026-02-24 (sent_on + 45 days)"
            - "third RCOA job rejected with error_id == ERR_VENDOR_CAPACITY_EXCEEDED (2 overlapping OUT windows already at cap)"
            - "GearItem.${g3} remained IN_STOCK after the rejected job (no partial side effect)"
            - "same-window job at OTHERCO succeeds: ReconditioningJob.${j3}.status == OUT and GearItem.${g3} -> OUT_FOR_RECONDITIONING"

      - name: game_event_48h_spacing_boundary
        grounds:
          - calculations.event_spacing_check
          - errors[ERR_EVENT_SPACING_VIOLATION]
        distinguishing_aspect: |
          Gap-buffer interval semantics on the season game calendar (different resource and
          semantics from provider capacity): kickoffs exactly 48h apart are allowed (>=), while
          24h apart is rejected — no occupation overlap is required for rejection.
        test_recipe:
          setup:
            - "Empty season 2026-FALL"
          setup_api_calls: []
          trigger:
            - { call: "POST /game-events", payload: { season_label: "2026-FALL", opponent_name: "A", kickoff_at: "2026-09-05T15:00:00Z", designated_kit: "HOME" }, as: EquipmentManager, captures: { e1: $.data.id } }
            - { call: "POST /game-events", payload: { season_label: "2026-FALL", opponent_name: "B", kickoff_at: "2026-09-07T15:00:00Z", designated_kit: "AWAY" }, as: EquipmentManager, captures: { e2: $.data.id } }
            - { call: "POST /game-events", payload: { season_label: "2026-FALL", opponent_name: "C", kickoff_at: "2026-09-06T15:00:00Z", designated_kit: "HOME" }, as: EquipmentManager, captures: { err: $.data.error_id } }
          assert:
            - "GameEvent.${e2} created (exactly 48h after ${e1}: boundary inclusive)"
            - "third event (24h gap) rejected with error_id == ERR_EVENT_SPACING_VIOLATION (http 409)"
            - "exactly two events exist in season 2026-FALL after the rejection"

  - rule_id: compensating_invariant
    instances:
      - name: pool_reserve_issue_return_conservation
        grounds:
          - calculations.pool_availability_reconciliation
          - state_machines.KitAssignment
        distinguishing_aspect: |
          Conserved quantity = physical garment units per pool: reserve then issue then return
          restores stock_on_hand to its original value, with the invariant
          stock_on_hand == available + reserved + in_laundry holding at every step.
        test_recipe:
          setup:
            - "Jersey pool stock 8 (point 0), pants pool stock 8 (point 0); ACTIVE player"
          setup_api_calls:
            - { call: "POST /inventory-pools", payload: { season_label: "2026-FALL", garment_type: "GAME_JERSEY", size_code: "M", stock_on_hand: 8, reorder_point: 0, reorder_batch_size: 1 }, as: EquipmentManager, captures: { jp: $.data.id } }
            - { call: "POST /inventory-pools", payload: { season_label: "2026-FALL", garment_type: "GAME_PANTS", size_code: "34", stock_on_hand: 8, reorder_point: 0, reorder_batch_size: 1 }, as: EquipmentManager, captures: { pp: $.data.id } }
            - { call: "POST /players", payload: { full_name: "Inv One", position_group: "OFFENSE" }, as: EquipmentManager, captures: { p: $.data.id } }
            - { call: "POST /kit-assignments", payload: { player_id: "${p}", season_label: "2026-FALL", jersey_number: 31, jersey_pool_id: "${jp}", pants_pool_id: "${pp}" }, as: EquipmentManager, captures: { ka: $.data.id } }
            - { call: "GET /inventory-pools/${jp}", payload: {}, as: EquipmentManager }
            - { call: "POST /kit-assignments/${ka}/issue", payload: {}, as: EquipmentManager }
            - { call: "GET /inventory-pools/${jp}", payload: {}, as: EquipmentManager }
          trigger:
            - { call: "POST /kit-assignments/${ka}/return", payload: {}, as: EquipmentManager }
            - { call: "GET /inventory-pools/${jp}", payload: {}, as: EquipmentManager }
          assert:
            - "After reserve: stock_on_hand == 8, reserved_quantity == 1, available_quantity == 7 (8 == 7+1+0)"
            - "After issue: stock_on_hand == 7, reserved_quantity == 0, available_quantity == 7 (7 == 7+0+0)"
            - "After return: stock_on_hand == 8, reserved_quantity == 0, in_laundry_quantity == 0, available_quantity == 8 (fully restored)"
            - "KitAssignment.${ka}.status == RETURNED and jersey_number 31 freed for reuse"

      - name: contract_commit_cancel_conservation
        grounds:
          - calculations.units_committed_reconciliation
          - state_machines.KitOrder.SUBMITTED_to_CANCELLED
        distinguishing_aspect: |
          Conserved quantity = contracted allocation units (different conserved quantity from
          physical garments): submit-then-cancel restores remaining_allocation to the cap, with
          units_committed + remaining_allocation == allocation_cap invariant across the pair.
        test_recipe:
          setup:
            - "ACTIVE contract cap GAME_JERSEY 20; GAME_JERSEY/M pool exists"
          setup_api_calls:
            - { call: "POST /inventory-pools", payload: { season_label: "2026-FALL", garment_type: "GAME_JERSEY", size_code: "M", stock_on_hand: 10, reorder_point: 0, reorder_batch_size: 1 }, as: EquipmentManager }
            - { call: "POST /supplier-contracts", payload: { vendor_name: "CONSVCO", season_label: "2026-FALL", start_on: "2026-06-01", end_on: "2027-05-31", allocation_caps: [{ garment_type: "GAME_JERSEY", max_units: 20 }], default_lead_time_days: 30 }, as: TeamAdmin, captures: { sc: $.data.id } }
            - { call: "POST /supplier-contracts/${sc}/activate", payload: {}, as: TeamAdmin }
            - { call: "POST /kit-orders", payload: { supplier_contract_id: "${sc}", lines: [{ garment_type: "GAME_JERSEY", size_code: "M", quantity: 7, unit_price_cents: 5000 }] }, as: EquipmentManager, captures: { ord: $.data.id } }
            - { call: "GET /supplier-contracts/${sc}", payload: {}, as: EquipmentManager }
          trigger:
            - { call: "POST /kit-orders/${ord}/cancel", payload: {}, as: EquipmentManager }
            - { call: "GET /supplier-contracts/${sc}", payload: {}, as: EquipmentManager }
          assert:
            - "After submit: units_committed[GAME_JERSEY] == 7 and remaining == 13 (7 + 13 == 20)"
            - "After cancel: units_committed[GAME_JERSEY] == 0 and remaining == 20 (0 + 20 == 20, fully restored)"
            - "KitOrder.${ord}.status == CANCELLED"
            - "InventoryPool stock_on_hand unchanged (10) — cancel does not touch physical stock"
