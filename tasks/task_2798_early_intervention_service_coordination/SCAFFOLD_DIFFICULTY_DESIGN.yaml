            - call: "POST /ei/assessments/${eval2_id}/complete"
              payload: { completion_date: "2026-09-01", eligibility_recommendation: "ELIGIBLE", family_unavailable_days: 0 }
              as: Evaluator
            - call: "POST /ei/assessments/${fam2_id}/complete"
              payload: { completion_date: "2026-09-01", eligibility_recommendation: "ELIGIBLE", family_unavailable_days: 0 }
              as: Evaluator
            - call: "POST /ei/referrals/${ref1_id}/eligibility-determination"
              payload: { is_eligible: true, determination_date: "2026-09-01" }
              as: ProgramAdmin
            - call: "POST /ei/referrals/${ref2_id}/eligibility-determination"
