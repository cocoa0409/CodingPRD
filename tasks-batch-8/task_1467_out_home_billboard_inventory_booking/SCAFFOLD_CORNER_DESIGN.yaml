      - name: weekly_rounding_half_up_digital
        claim_type: precision
        grounds: [calculations.flight_gross_cost]
        distinguishing_aspect: "Digital slot share produces a fractional weekly cent (898437.5 x 1/8 = 112304.6875); round_half_up pins 112305 and gross is the rounded weekly times weeks (449220), not round(449218.75)."
        test_recipe:
          setup: ["PUBLISHED digital card (base 625000, ill 0.15, t1 100000/0.10, t2 250000/0.25); DIGITAL face (illuminated, 300000, 8 slots) with permit to 2026-12-31; advertiser; campaign DRAFT"]
          setup_api_calls:
            - { call: "POST /api/rate-cards", payload: { market_code: "NYC", display_type: "DIGITAL", base_weekly_cents: 625000, illumination_premium_pct: 0.15, traffic_tier_1_threshold: 100000, traffic_tier_1_uplift_pct: 0.10, traffic_tier_2_threshold: 250000, traffic_tier_2_uplift_pct: 0.25 }, as: InventoryManager, captures: { rc: $.data.id, rc_v: $.data.version } }
