# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index) — Mobile Dentistry
# Every instance grounds in SCAFFOLD.yaml §1.1–§1.7. Deleting this file changes
# no declared behaviour; it only makes coverage harder to audit.
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:

      - name: medicaid_encounter_rate_vs_commercial_fee_schedule_on_identical_procedure_sets
        grounds:
          - calculations.encounter_allowed_amount_cents
          - calculations.encounter_money_split
          - entities.Encounter.fields.allowed_amount_cents
          - entities.Encounter.fields.pricing_regime
          - state_machines.Encounter.UNBILLED_to_PRICED
        distinguishing_aspect: |
          This dual-variant lives in the Encounter financial domain: two patients seen at the same
          visit with the byte-identical procedure set {D0190, D0150, D1206} receive allowed amounts
          of 15025 and 10275 cents respectively, because MEDICAID_ENCOUNTER_RATE caps one
          all-inclusive figure at the encounter total while COMMERCIAL_FEE_SCHEDULE sums per-line
          minima and never allows the supply surcharge.
        test_recipe:
          setup:
            - "Logical clock at 2026-05-11T09:00:00Z."
            - "One OPEN ProgramPeriod SY2025-26, one SCHOOL Site in CA, one calibrated portable unit, a dentist, a hygienist and an assistant all licensed in CA."
            - "Two STUDENT patients, each with an ACTIVE SCREENING_FLUORIDE_SEALANT consent; one carries a VERIFIED MEDICAID_MCO coverage and the other a VERIFIED COMMERCIAL_FFS coverage."
            - "One IN_PROGRESS site visit whose portable unit's newest load is PASSED."
            - "Each patient has an encounter in clinical_status TREATED carrying exactly three PERFORMED procedures: the auto-created D0190, the auto-created D0150, and one explicitly performed D1206."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-11T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /mobile-dentistry/program-periods"
              payload: { name: "SY2025-26", starts_on: "2025-08-01", ends_on: "2026-06-30" }
              as: ProgramAdmin
              captures: { pp_id: $.data.id }
            - call: "POST /mobile-dentistry/sites"
              payload: { name: "Lincoln Elementary", site_type: "SCHOOL", state_code: "CA", roster_disclosure_level: "SUMMARY_ONLY" }
              as: ProgramAdmin
              captures: { site_id: $.data.id }
            - call: "POST /mobile-dentistry/staff-members"
              payload: { full_name: "Ada Reyes", staff_role: "DENTIST", license_number: "D-1001", license_state: "CA", supervision_level: "SELF" }
              as: ProgramAdmin
              captures: { dentist_id: $.data.id }
            - call: "POST /mobile-dentistry/staff-members"
              payload: { full_name: "Hana Ito", staff_role: "HYGIENIST", license_number: "H-2001", license_state: "CA", supervision_level: "GENERAL" }
              as: ProgramAdmin
              captures: { hyg_id: $.data.id }
            - call: "POST /mobile-dentistry/staff-members"
              payload: { full_name: "Ben Cruz", staff_role: "DENTAL_ASSISTANT", license_number: "A-3001", license_state: "CA", supervision_level: "DIRECT" }
              as: ProgramAdmin
              captures: { asst_id: $.data.id }
            - call: "POST /mobile-dentistry/portable-units"
              payload: { unit_code: "PU-01" }
              as: ProgramAdmin
              captures: { unit_id: $.data.id }
            - call: "POST /mobile-dentistry/portable-units/${unit_id}/calibrate"
              payload: { calibrated_on: "2026-04-01" }
              as: ProgramAdmin
            - call: "POST /mobile-dentistry/patients"
              payload: { site_id: "${site_id}", patient_type: "STUDENT", external_ref: "S-001", first_name: "Mia", last_name: "Lopez", date_of_birth: "2016-03-04", grade_level: "4", household_size: 4, annual_household_income_cents: 3000000 }
              as: SiteCoordinator
              as_user_id: "${site_id}"
              captures: { p_mcd_id: $.data.id }
            - call: "POST /mobile-dentistry/patients"
              payload: { site_id: "${site_id}", patient_type: "STUDENT", external_ref: "S-002", first_name: "Noah", last_name: "Park", date_of_birth: "2015-11-20", grade_level: "5", household_size: 3, annual_household_income_cents: 7200000 }
              as: SiteCoordinator
              as_user_id: "${site_id}"
              captures: { p_com_id: $.data.id }
            - call: "POST /mobile-dentistry/consents"
              payload: { patient_id: "${p_mcd_id}", site_id: "${site_id}", program_period_id: "${pp_id}", regime: "SCHOOL_GUARDIAN", scope_tier: "SCREENING_FLUORIDE_SEALANT", signed_at: "2026-05-01T00:00:00Z", guardian_name: "Rosa Lopez", guardian_relationship: "MOTHER" }
              as: SiteCoordinator
              as_user_id: "${site_id}"
              captures: { c_mcd_id: $.data.id }
            - call: "POST /mobile-dentistry/consents/${c_mcd_id}/verify"
              payload: {}
              as: SiteCoordinator
              as_user_id: "${site_id}"
            - call: "POST /mobile-dentistry/consents"
              payload: { patient_id: "${p_com_id}", site_id: "${site_id}", program_period_id: "${pp_id}", regime: "SCHOOL_GUARDIAN", scope_tier: "SCREENING_FLUORIDE_SEALANT", signed_at: "2026-05-01T00:00:00Z", guardian_name: "Ivy Park", guardian_relationship: "MOTHER" }
              as: SiteCoordinator
              as_user_id: "${site_id}"
              captures: { c_com_id: $.data.id }
            - call: "POST /mobile-dentistry/consents/${c_com_id}/verify"
              payload: {}
              as: SiteCoordinator
              as_user_id: "${site_id}"
            - call: "POST /mobile-dentistry/coverages"
              payload: { patient_id: "${p_mcd_id}", payer_type: "MEDICAID_MCO", payer_name: "GoldenState Dental MCO", member_id: "M-77001" }
              as: BillingSpecialist
              captures: { cov_mcd_id: $.data.id }
            - call: "POST /mobile-dentistry/coverages/${cov_mcd_id}/verify"
              payload: { verified_through_date: "2026-12-31" }
              as: BillingSpecialist
            - call: "POST /mobile-dentistry/coverages"
              payload: { patient_id: "${p_com_id}", payer_type: "COMMERCIAL_FFS", payer_name: "BlueDental PPO", member_id: "C-42009" }
              as: BillingSpecialist
              captures: { cov_com_id: $.data.id }
            - call: "POST /mobile-dentistry/coverages/${cov_com_id}/verify"
              payload: { verified_through_date: "2026-12-31" }
              as: BillingSpecialist
            - call: "POST /mobile-dentistry/site-visits"
              payload: { site_id: "${site_id}", program_period_id: "${pp_id}", portable_unit_id: "${unit_id}", lead_staff_id: "${dentist_id}", onsite_dentist_staff_id: "${dentist_id}", scheduled_start_at: "2026-05-11T09:00:00Z", scheduled_end_at: "2026-05-11T15:00:00Z", chair_count: 2 }
              as: SiteCoordinator
              as_user_id: "${site_id}"
              captures: { visit_id: $.data.id }
            - call: "POST /mobile-dentistry/sterilization-loads"
              payload: { portable_unit_id: "${unit_id}", loaded_by_staff_id: "${asst_id}", load_number: "L-1", cycle_completed_at: "2026-05-10T08:00:00Z", site_visit_id: "${visit_id}" }
              as: DentalAssistant
              as_user_id: "${asst_id}"
              captures: { load1_id: $.data.id }
            - call: "POST /mobile-dentistry/sterilization-loads/${load1_id}/spore-result"
              payload: { result: "PASSED", result_recorded_by_staff_id: "${hyg_id}" }
              as: FieldHygienist
              as_user_id: "${hyg_id}"
            - call: "POST /mobile-dentistry/site-visits/${visit_id}/start"
              payload: {}
              as: FieldDentist
              as_user_id: "${dentist_id}"
              captures: { visit_v1: $.data.version }
            - call: "POST /mobile-dentistry/encounters"
              payload: { site_visit_id: "${visit_id}", patient_id: "${p_mcd_id}", consent_id: "${c_mcd_id}", coverage_id: "${cov_mcd_id}", expected_site_visit_version: "${visit_v1}" }
              as: DentalAssistant
              as_user_id: "${asst_id}"
              captures: { enc_mcd_id: $.data.id }
            - call: "GET /mobile-dentistry/site-visits/${visit_id}"
              payload: {}
              as: ProgramAdmin
              captures: { visit_v2: $.data.version }
            - call: "POST /mobile-dentistry/encounters"
              payload: { site_visit_id: "${visit_id}", patient_id: "${p_com_id}", consent_id: "${c_com_id}", coverage_id: "${cov_com_id}", expected_site_visit_version: "${visit_v2}" }
              as: DentalAssistant
              as_user_id: "${asst_id}"
              captures: { enc_com_id: $.data.id }
            - call: "POST /mobile-dentistry/encounters/${enc_mcd_id}/screen"
              payload: { performing_staff_id: "${hyg_id}", cavitated_lesion_count: 1, pain_reported: false, abscess_or_swelling: false, untreated_decay_present: true }
              as: FieldHygienist
              as_user_id: "${hyg_id}"
            - call: "POST /mobile-dentistry/encounters/${enc_mcd_id}/exam"
              payload: { performing_staff_id: "${dentist_id}", exam_modality: "ONSITE" }
              as: FieldDentist
              as_user_id: "${dentist_id}"
              captures: { enc_mcd_v: $.data.version }
            - call: "POST /mobile-dentistry/procedures"
              payload: { encounter_id: "${enc_mcd_id}", procedure_code: "D1206", expected_encounter_version: "${enc_mcd_v}" }
              as: FieldHygienist
              as_user_id: "${hyg_id}"
              captures: { proc_mcd_id: $.data.id }
            - call: "POST /mobile-dentistry/procedures/${proc_mcd_id}/perform"
              payload: { performing_staff_id: "${hyg_id}", sterilization_load_id: "${load1_id}" }
              as: FieldHygienist
              as_user_id: "${hyg_id}"
            - call: "POST /mobile-dentistry/encounters/${enc_com_id}/screen"
              payload: { performing_staff_id: "${hyg_id}", cavitated_lesion_count: 1, pain_reported: false, abscess_or_swelling: false, untreated_decay_present: true }
              as: FieldHygienist
              as_user_id: "${hyg_id}"
            - call: "POST /mobile-dentistry/encounters/${enc_com_id}/exam"
              payload: { performing_staff_id: "${dentist_id}", exam_modality: "ONSITE" }
              as: FieldDentist
              as_user_id: "${dentist_id}"
              captures: { enc_com_v: $.data.version }
            - call: "POST /mobile-dentistry/procedures"
              payload: { encounter_id: "${enc_com_id}", procedure_code: "D1206", expected_encounter_version: "${enc_com_v}" }
              as: FieldHygienist
              as_user_id: "${hyg_id}"
              captures: { proc_com_id: $.data.id }
            - call: "POST /mobile-dentistry/procedures/${proc_com_id}/perform"
              payload: { performing_staff_id: "${hyg_id}", sterilization_load_id: "${load1_id}" }
              as: FieldHygienist
              as_user_id: "${hyg_id}"
          trigger:
            - call: "POST /mobile-dentistry/encounters/${enc_mcd_id}/price"
              payload: {}
              as: BillingSpecialist
            - call: "POST /mobile-dentistry/encounters/${enc_com_id}/price"
              payload: {}
              as: BillingSpecialist
          assert:
            - "Encounter.${enc_mcd_id}.subtotal_cents == 13825"
            - "Encounter.${enc_mcd_id}.supply_surcharge_cents == 1200"
            - "Encounter.${enc_mcd_id}.total_charge_cents == 15025"
            - "Encounter.${enc_mcd_id}.pricing_regime == MEDICAID_ENCOUNTER_RATE"
            - "Encounter.${enc_mcd_id}.allowed_amount_cents == 15025"
            - "Encounter.${enc_mcd_id}.patient_responsibility_cents == 0"
            - "Encounter.${enc_mcd_id}.plan_paid_cents == 15025"
            - "Encounter.${enc_mcd_id}.write_off_cents == 0"
            - "Encounter.${enc_com_id}.subtotal_cents == 13825"
            - "Encounter.${enc_com_id}.total_charge_cents == 15025"
            - "Encounter.${enc_com_id}.pricing_regime == COMMERCIAL_FEE_SCHEDULE"
            - "Encounter.${enc_com_id}.allowed_amount_cents == 10275"
            - "Encounter.${enc_com_id}.patient_responsibility_cents == 2055"
            - "Encounter.${enc_com_id}.plan_paid_cents == 8220"
            - "Encounter.${enc_com_id}.write_off_cents == 4750"
            - "Encounter.${enc_mcd_id}.allowed_amount_cents != Encounter.${enc_com_id}.allowed_amount_cents"

      - name: school_year_scoped_vs_snf_annual_reaffirmation_consent_expiry
        grounds:
          - calculations.consent_expires_at
          - entities.Consent.fields.expires_at
          - entities.Consent.fields.reaffirmation_due_at
          - entities.Consent.fields.regime
          - state_machines.Consent.PENDING_VERIFICATION_to_ACTIVE
        distinguishing_aspect: |
          This dual-variant lives in the Consent lifecycle domain, not the financial one: two consents
          signed at the identical instant 2026-05-01T00:00:00Z expire at 2026-06-30T23:59:59Z (school,
          pinned to the program period's ends_on and blind to signed_at) versus 2027-05-01T00:00:00Z
          (SNF, signed_at plus 365 days and blind to the program period), and only the SNF row carries
          a non-null reaffirmation_due_at.
        test_recipe:
          setup:
            - "Logical clock at 2026-05-11T09:00:00Z."
            - "One OPEN ProgramPeriod SY2025-26 running 2025-08-01 to 2026-06-30."
            - "One SCHOOL site with a STUDENT patient and one SNF site with a RESIDENT patient whose capacity_determination is HAS_CAPACITY."
            - "Both consents signed at exactly 2026-05-01T00:00:00Z and verified into ACTIVE."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-11T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /mobile-dentistry/program-periods"
              payload: { name: "SY2025-26", starts_on: "2025-08-01", ends_on: "2026-06-30" }
              as: ProgramAdmin
              captures: { pp_id: $.data.id }
            - call: "POST /mobile-dentistry/sites"
              payload: { name: "Lincoln Elementary", site_type: "SCHOOL", state_code: "CA" }
              as: ProgramAdmin
              captures: { school_id: $.data.id }
            - call: "POST /mobile-dentistry/sites"
              payload: { name: "Cedar Grove SNF", site_type: "SNF", state_code: "CA", roster_disclosure_level: "CLINICAL_DETAIL" }
              as: ProgramAdmin
              captures: { snf_id: $.data.id }
            - call: "POST /mobile-dentistry/patients"
              payload: { site_id: "${school_id}", patient_type: "STUDENT", external_ref: "S-001", first_name: "Mia", last_name: "Lopez", date_of_birth: "2016-03-04", grade_level: "4", household_size: 4 }
              as: SiteCoordinator
              as_user_id: "${school_id}"
              captures: { student_id: $.data.id }
            - call: "POST /mobile-dentistry/patients"
              payload: { site_id: "${snf_id}", patient_type: "RESIDENT", external_ref: "R-001", first_name: "Alma", last_name: "Reyes", date_of_birth: "1941-09-12", room_number: "214B", household_size: 1, capacity_determination: "HAS_CAPACITY" }
              as: SiteCoordinator
              as_user_id: "${snf_id}"
              captures: { resident_id: $.data.id }
            - call: "POST /mobile-dentistry/consents"
              payload: { patient_id: "${student_id}", site_id: "${school_id}", program_period_id: "${pp_id}", regime: "SCHOOL_GUARDIAN", scope_tier: "SCREENING_FLUORIDE", signed_at: "2026-05-01T00:00:00Z", guardian_name: "Rosa Lopez", guardian_relationship: "MOTHER" }
              as: SiteCoordinator
              as_user_id: "${school_id}"
              captures: { school_consent_id: $.data.id }
            - call: "POST /mobile-dentistry/consents"
              payload: { patient_id: "${resident_id}", site_id: "${snf_id}", program_period_id: "${pp_id}", regime: "SNF_RESPONSIBLE_PARTY", scope_tier: "SCREENING_FLUORIDE", signed_at: "2026-05-01T00:00:00Z", responsible_party_name: "Tomas Reyes", responsible_party_authority: "DURABLE_POA", poa_document_ref: "POA-2019-118" }
              as: SiteCoordinator
              as_user_id: "${snf_id}"
              captures: { snf_consent_id: $.data.id }
          trigger:
            - call: "POST /mobile-dentistry/consents/${school_consent_id}/verify"
              payload: {}
              as: SiteCoordinator
              as_user_id: "${school_id}"
            - call: "POST /mobile-dentistry/consents/${snf_consent_id}/verify"
              payload: {}
              as: SiteCoordinator
              as_user_id: "${snf_id}"
          assert:
            - "Consent.${school_consent_id}.status == ACTIVE"
            - "Consent.${school_consent_id}.expires_at == 2026-06-30T23:59:59Z"
            - "Consent.${school_consent_id}.reaffirmation_due_at == null"
            - "Consent.${snf_consent_id}.status == ACTIVE"
            - "Consent.${snf_consent_id}.expires_at == 2027-05-01T00:00:00Z"
            - "Consent.${snf_consent_id}.reaffirmation_due_at == 2027-05-01T00:00:00Z"
            - "Consent.${school_consent_id}.expires_at != Consent.${snf_consent_id}.expires_at"

      - name: school_vs_snf_triage_band_on_byte_identical_screening_findings
        grounds:
          - calculations.triage_band
          - entities.Encounter.fields.triage_band
          - entities.Encounter.fields.medical_complexity_count
          - state_machines.Encounter.REGISTERED_to_SCREENED
        distinguishing_aspect: |
          A third dual-variant in the clinical domain: the same seven findings
          (cavitated_lesion_count 1, pain false, abscess false, untreated_decay true, denture false,
          oral_hygiene_score 1, medical_complexity_count 4) classify as EARLY_CARE_NEEDED at a SCHOOL
          site and URGENT at an SNF site, because only the SNF variant lets medical complexity of 3 or
          more escalate a single cavitated lesion.
        test_recipe:
          setup:
            - "Logical clock at 2026-05-11T09:00:00Z."
            - "One OPEN ProgramPeriod, one SCHOOL site and one SNF site, both in CA, each with a calibrated portable unit whose newest load is PASSED."
            - "One STUDENT patient at the school and one RESIDENT patient with capacity HAS_CAPACITY at the SNF, each with an ACTIVE SCREENING_FLUORIDE consent."
            - "One IN_PROGRESS site visit at each site, each staffed by a CA-licensed dentist (onsite) and hygienist."
            - "One REGISTERED encounter on each visit."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-11T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /mobile-dentistry/program-periods"
              payload: { name: "SY2025-26", starts_on: "2025-08-01", ends_on: "2026-06-30" }
              as: ProgramAdmin
              captures: { pp_id: $.data.id }
            - call: "POST /mobile-dentistry/sites"
              payload: { name: "Lincoln Elementary", site_type: "SCHOOL", state_code: "CA" }
              as: ProgramAdmin
              captures: { school_id: $.data.id }
            - call: "POST /mobile-dentistry/sites"
              payload: { name: "Cedar Grove SNF", site_type: "SNF", state_code: "CA", roster_disclosure_level: "CLINICAL_DETAIL" }
              as: ProgramAdmin
              captures: { snf_id: $.data.id }
            - call: "POST /mobile-dentistry/staff-members"
              payload: { full_name: "Ada Reyes", staff_role: "DENTIST", license_number: "D-1001", license_state: "CA", supervision_level: "SELF" }
              as: ProgramAdmin
              captures: { dentist_id: $.data.id }
            - call: "POST /mobile-dentistry/staff-members"
              payload: { full_name: "Hana Ito", staff_role: "HYGIENIST", license_number: "H-2001", license_state: "CA", supervision_level: "GENERAL" }
              as: ProgramAdmin
              captures: { hyg_id: $.data.id }
            - call: "POST /mobile-dentistry/staff-members"
              payload: { full_name: "Ben Cruz", staff_role: "DENTAL_ASSISTANT", license_number: "A-3001", license_state: "CA", supervision_level: "DIRECT" }
              as: ProgramAdmin
              captures: { asst_id: $.data.id }
            - call: "POST /mobile-dentistry/staff-members"
              payload: { full_name: "Cy Nolan", staff_role: "DENTIST", license_number: "D-1002", license_state: "CA", supervision_level: "SELF" }
              as: ProgramAdmin
              captures: { dentist2_id: $.data.id }
            - call: "POST /mobile-dentistry/staff-members"
              payload: { full_name: "Rae Okon", staff_role: "HYGIENIST", license_number: "H-2002", license_state: "CA", supervision_level: "GENERAL" }
              as: ProgramAdmin
              captures: { hyg2_id: $.data.id }
            - call: "POST /mobile-dentistry/portable-units"
              payload: { unit_code: "PU-01" }
              as: ProgramAdmin
              captures: { unit1_id: $.data.id }
            - call: "POST /mobile-dentistry/portable-units/${unit1_id}/calibrate"
              payload: { calibrated_on: "2026-04-01" }
              as: ProgramAdmin
            - call: "POST /mobile-dentistry/portable-units"
              payload: { unit_code: "PU-02" }
              as: ProgramAdmin
              captures: { unit2_id: $.data.id }
            - call: "POST /mobile-dentistry/portable-units/${unit2_id}/calibrate"
              payload: { calibrated_on: "2026-04-01" }
              as: ProgramAdmin
            - call: "POST /mobile-dentistry/patients"
              payload: { site_id: "${school_id}", patient_type: "STUDENT", external_ref: "S-001", first_name: "Mia", last_name: "Lopez", date_of_birth: "2016-03-04", grade_level: "4", household_size: 4 }
              as: SiteCoordinator
              as_user_id: "${school_id}"
              captures: { student_id: $.data.id }
            - call: "POST /mobile-dentistry/patients"
              payload: { site_id: "${snf_id}", patient_type: "RESIDENT", external_ref: "R-001", first_name: "Alma", last_name: "Reyes", date_of_birth: "1941-09-12", room_number: "214B", household_size: 1, capacity_determination: "HAS_CAPACITY" }
              as: SiteCoordinator
              as_user_id: "${snf_id}"
              captures: { resident_id: $.data.id }
            - call: "POST /mobile-dentistry/consents"
              payload: { patient_id: "${student_id}", site_id: "${school_id}", program_period_id: "${pp_id}", regime: "SCHOOL_GUARDIAN", scope_tier: "SCREENING_FLUORIDE", signed_at: "2026-05-01T00:00:00Z", guardian_name: "Rosa Lopez", guardian_relationship: "MOTHER" }
              as: SiteCoordinator
              as_user_id: "${school_id}"
              captures: { school_consent_id: $.data.id }
            - call: "POST /mobile-dentistry/consents/${school_consent_id}/verify"
              payload: {}
              as: SiteCoordinator
              as_user_id: "${school_id}"
            - call: "POST /mobile-dentistry/consents"
              payload: { patient_id: "${resident_id}", site_id: "${snf_id}", program_period_id: "${pp_id}", regime: "SNF_RESPONSIBLE_PARTY", scope_tier: "SCREENING_FLUORIDE", signed_at: "2026-05-01T00:00:00Z", responsible_party_name: "Tomas Reyes", responsible_party_authority: "DURABLE_POA", poa_document_ref: "POA-2019-118" }
              as: SiteCoordinator
              as_user_id: "${snf_id}"
              captures: { snf_consent_id: $.data.id }
            - call: "POST /mobile-dentistry/consents/${snf_consent_id}/verify"
              payload: {}
              as: SiteCoordinator
              as_user_id: "${snf_id}"
