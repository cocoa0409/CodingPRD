      - name: registry_closed_beats_gift_quantity_exceeds_remaining
        grounds:
          - validations[priority=28]
          - validations[priority=57]
          - errors[ERR_REGISTRY_CLOSED]
          - errors[ERR_GIFT_QUANTITY_EXCEEDS_REMAINING]
        distinguishing_aspect: |
          Category pair state (priority 28, ERR_REGISTRY_CLOSED) versus business_constraint
          (priority 57, ERR_GIFT_QUANTITY_EXCEEDS_REMAINING) — a different pairing from the
          temporal-versus-constraint conflict: a gift for 5 packs against a 1-pack item on a CLOSED
          registry must return ERR_REGISTRY_CLOSED because gate G7_LIFECYCLE outranks G9.
        test_recipe:
          setup:
            - "Registry owner O with a registry that was opened and then closed; it carries one item requesting 1 pack and no gift activity."
            - "Third-party purchaser P is verified and ACTIVE."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
