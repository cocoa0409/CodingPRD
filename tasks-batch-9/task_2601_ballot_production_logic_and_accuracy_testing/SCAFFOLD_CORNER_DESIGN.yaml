            - "That unfiltered list returns all 4 contests with total_count == 4: the DRAFT contest exists and is listed; it is excluded from the ORDERING, not from the store."
            - "Before the withdrawal the certified indices are Board 1, Sheriff 2, Measure A 3 - unchanged by the presence of the DRAFT row."
            - "${idx_board_after} == null after the withdrawal, while ${idx_sheriff_after} == 2 and ${idx_measure_after} == 3: the survivors keep their original indices, so the visible set is {2, 3} with index 1 permanently vacant."
