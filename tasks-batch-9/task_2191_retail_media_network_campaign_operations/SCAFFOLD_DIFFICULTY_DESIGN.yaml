              captures: { plan_avail_after: $.data.available_cents, plan_reserved_after: $.data.reserved_cents, plan_consumed_after: $.data.consumed_cents }
          assert:
            - "${plan_topup_before} == 0"
            - "${plan_avail_before} == 5000000"
            - "${plan_reserved_before} == 0"
            - "${plan_consumed_before} == 0"
            - "${plan_avail_before} + ${plan_reserved_before} + ${plan_consumed_before} == 5000000"
            - "${plan_avail_mid} == 3000000"
            - "${plan_reserved_mid} == 2000000"
            - "${plan_consumed_mid} == 0"
            - "${plan_avail_mid} + ${plan_reserved_mid} + ${plan_consumed_mid} == 5000000"
            - "Campaign.${cmp_id}.delivery_status == ARCHIVED"
            - "${plan_avail_after} == 5000000"
            - "${plan_reserved_after} == 0"
            - "${plan_consumed_after} == 0"
            - "${plan_avail_after} + ${plan_reserved_after} + ${plan_consumed_after} == 5000000"
            - "${plan_avail_after} - ${plan_avail_before} == 0 (zero drift on available_cents)"
            - "${plan_reserved_after} - ${plan_reserved_before} == 0 (zero drift on reserved_cents)"
            - "BudgetPlan.${plan_id}.committed_total_cents == 5000000"
            - "BudgetPlan.${plan_id}.top_up_total_cents == 0"
            - "BudgetPlan.${plan_id}.plan_status == ACTIVE"
            - "LineItem.${li_id}.line_item_status == ENDED"

      - name: ci_trade_fund_cents_conserved_across_approve_then_close
        grounds:
          - calculations.trade_fund_available
          - state_machines.BudgetPlan.PENDING_APPROVAL_to_APPROVED
          - state_machines.BudgetPlan.ACTIVE_to_CLOSED
          - entities.TradeFundAccount.fields.accrued_cents
          - entities.TradeFundAccount.fields.reserved_cents
          - entities.TradeFundAccount.fields.deducted_cents
          - entities.TradeFundAccount.fields.available_cents
          - entities.BudgetPlan.fields.trade_fund_share_cents
        distinguishing_aspect: |
          The conserved quantity is the TradeFundAccount co-op accrual identity
          accrued_cents == available_cents + reserved_cents + deducted_cents — a different pool from the
          BudgetPlan commitment identity: the forward action BudgetPlan PENDING_APPROVAL -> APPROVED reserves
          1250000 of the 3000000 accrual and the compensating action BudgetPlan ACTIVE -> CLOSED returns
          available_cents to exactly 3000000 with accrued_cents never moving off 3000000.
        test_recipe:
          setup:
            - "Logical clock left at its 2026-08-01T00:00:00Z startup default, inside the plan window."
            - "One SELF_SERVE Advertiser at onboarding_status == ACTIVE with credit_limit_cents = 100000000."
            - "One TradeFundAccount for (advertiser, 2026-Q3) at account_status == OPEN with accrued_cents = 3000000, reserved_cents = 0, deducted_cents = 0, available_cents = 3000000."
            - "One BudgetPlan with committed_total_cents = 2500000 and trade_fund_share_cents = 1250000, window [2026-07-01T00:00:00Z, 2026-08-15T00:00:00Z), left at plan_status == DRAFT so neither reading of the reservation leg has fired yet."
            - "No Campaign and no Invoice exist on the plan, so closure has nothing to block it."
          setup_api_calls:
            - call: "POST /rmn/advertisers"
              payload: { legal_name: "Prairie Paper Products", brand_code: "PRPP06", service_model: "SELF_SERVE", credit_limit_cents: 100000000, self_serve_daily_spend_cap_cents: 500000 }
              as: NetworkAdmin
              as_user_id: "na_001"
              captures: { adv_id: $.data.id }
            - call: "POST /rmn/advertisers/${adv_id}/submit-onboarding"
              payload: { kyc_document_count: 2 }
              as: AccountManager
              as_user_id: "am_001"
            - call: "POST /rmn/advertisers/${adv_id}/kyc-decision"
              payload: { decision: "APPROVE", decision_note: "KYC cleared" }
              as: CreditAnalyst
              as_user_id: "ca_001"
              captures: { adv_v_after_kyc: $.data.version }
            - call: "POST /rmn/trade-fund-accounts"
              payload: { advertiser_id: "${adv_id}", fiscal_period_code: "2026-Q3", accrual_basis: "PURCHASE_VOLUME", deduction_cap_pct: 0.6 }
              as: BillingOps
              as_user_id: "bo_001"
              captures: { tfa_id: $.data.id }
            - call: "POST /rmn/trade-fund-accounts/${tfa_id}/accruals"
              payload: { accrual_amount_cents: 3000000, accrual_reference: "ACCR-2026-Q3-PRPP" }
              as: BillingOps
              as_user_id: "bo_001"
            - call: "POST /rmn/budget-plans"
              payload: { advertiser_id: "${adv_id}", fiscal_period_code: "2026-Q3", committed_total_cents: 2500000, trade_fund_share_cents: 1250000, window_start_at: "2026-07-01T00:00:00Z", window_end_at: "2026-08-15T00:00:00Z", expected_advertiser_version: "${adv_v_after_kyc}" }
              as: AccountManager
              as_user_id: "am_001"
              captures: { plan_id: $.data.id }
            - call: "GET /rmn/trade-fund-accounts/${tfa_id}"
              payload: {}
              as: BillingOps
              as_user_id: "bo_001"
              captures: { tfa_accrued_before: $.data.accrued_cents, tfa_avail_before: $.data.available_cents, tfa_reserved_before: $.data.reserved_cents, tfa_deducted_before: $.data.deducted_cents }
          trigger:
            - call: "POST /rmn/budget-plans/${plan_id}/submit"
              payload: { submission_note: "forward action leg 1: submit the trade-fund share" }
              as: AccountManager
              as_user_id: "am_001"
            - call: "POST /rmn/budget-plans/${plan_id}/approve"
              payload: { approval_note: "forward action leg 2: reserve the trade-fund share" }
              as: CreditAnalyst
              as_user_id: "ca_001"
            - call: "GET /rmn/trade-fund-accounts/${tfa_id}"
              payload: {}
              as: BillingOps
              as_user_id: "bo_001"
              captures: { tfa_accrued_mid: $.data.accrued_cents, tfa_avail_mid: $.data.available_cents, tfa_reserved_mid: $.data.reserved_cents, tfa_deducted_mid: $.data.deducted_cents }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-15T00:00:00Z" }
              as: NetworkAdmin
              as_user_id: "na_001"
            - call: "POST /rmn/budget-plans/${plan_id}/close"
              payload: { closure_note: "compensating action: release the unspent trade-fund reservation" }
              as: BillingOps
              as_user_id: "bo_001"
            - call: "GET /rmn/trade-fund-accounts/${tfa_id}"
              payload: {}
              as: BillingOps
              as_user_id: "bo_001"
              captures: { tfa_accrued_after: $.data.accrued_cents, tfa_avail_after: $.data.available_cents, tfa_reserved_after: $.data.reserved_cents, tfa_deducted_after: $.data.deducted_cents }
          assert:
            - "${tfa_accrued_before} == 3000000"
            - "${tfa_avail_before} == 3000000"
            - "${tfa_reserved_before} == 0"
            - "${tfa_deducted_before} == 0"
            - "${tfa_avail_before} + ${tfa_reserved_before} + ${tfa_deducted_before} == 3000000"
            - "${tfa_accrued_mid} == 3000000"
            - "${tfa_reserved_mid} == 1250000"
            - "${tfa_avail_mid} == 1750000"
            - "${tfa_deducted_mid} == 0"
            - "${tfa_avail_mid} + ${tfa_reserved_mid} + ${tfa_deducted_mid} == 3000000"
            - "BudgetPlan.${plan_id}.plan_status == CLOSED"
            - "${tfa_accrued_after} == 3000000"
            - "${tfa_avail_after} == 3000000"
            - "${tfa_reserved_after} == 0"
            - "${tfa_deducted_after} == 0"
            - "${tfa_avail_after} + ${tfa_reserved_after} + ${tfa_deducted_after} == 3000000"
            - "${tfa_avail_after} - ${tfa_avail_before} == 0 (zero drift on available_cents)"
            - "${tfa_accrued_after} - ${tfa_accrued_before} == 0 (accrued_cents never moved)"
            - "TradeFundAccount.${tfa_id}.account_status == OPEN"

      - name: ci_slot_occupancy_count_conserved_across_grant_then_end
        grounds:
          - calculations.slot_occupancy_overlap
          - state_machines.LineItem.PENDING_ELIGIBILITY_to_ELIGIBLE
          - state_machines.LineItem.ELIGIBLE_to_ENDED
          - entities.PlacementSlot.fields.occupancy_count
          - entities.LineItem.fields.line_item_status
          - entities.LineItem.fields.spend_cents
        distinguishing_aspect: |
          The conserved quantity is a cardinal inventory count rather than money: PlacementSlot.occupancy_count
          must equal the number of LineItem rows on the slot with line_item_status IN
          {ELIGIBLE, SERVING, OOS_PAUSED, MANUAL_PAUSED}, so the forward grant PENDING_ELIGIBILITY -> ELIGIBLE
          taking it 0 -> 1 and the compensating ELIGIBLE -> ENDED taking it 1 -> 0 must leave it at exactly 0.
        test_recipe:
          setup:
            - "Logical clock left at its 2026-08-01T00:00:00Z startup default."
            - "One SELF_SERVE Advertiser at onboarding_status == ACTIVE and one BudgetPlan at plan_status == ACTIVE (committed_total_cents = 5000000, trade_fund_share_cents = 0)."
            - "One ONSITE PlacementSlot with max_concurrent_line_items = 1 and occupancy_count = 0."
            - "One ONSITE_ONLY Campaign at delivery_status == DRAFT."
            - "One LineItem on that slot at line_item_status == PENDING_ELIGIBILITY with a single ACTIVE hero ProductAssignment; spend_cents stays 0 for the whole test because no auction is ever run."
          setup_api_calls:
            - call: "POST /rmn/advertisers"
              payload: { legal_name: "Summit Outdoor Gear", brand_code: "SMOG07", service_model: "SELF_SERVE", credit_limit_cents: 100000000, self_serve_daily_spend_cap_cents: 500000 }
              as: NetworkAdmin
              as_user_id: "na_001"
              captures: { adv_id: $.data.id }
            - call: "POST /rmn/advertisers/${adv_id}/submit-onboarding"
              payload: { kyc_document_count: 2 }
              as: AccountManager
              as_user_id: "am_001"
            - call: "POST /rmn/advertisers/${adv_id}/kyc-decision"
              payload: { decision: "APPROVE", decision_note: "KYC cleared" }
              as: CreditAnalyst
              as_user_id: "ca_001"
              captures: { adv_v_after_kyc: $.data.version }
            - call: "POST /rmn/budget-plans"
              payload: { advertiser_id: "${adv_id}", fiscal_period_code: "2026-Q3", committed_total_cents: 5000000, trade_fund_share_cents: 0, window_start_at: "2026-07-01T00:00:00Z", window_end_at: "2026-10-01T00:00:00Z", expected_advertiser_version: "${adv_v_after_kyc}" }
              as: AccountManager
              as_user_id: "am_001"
              captures: { plan_id: $.data.id }
            - call: "POST /rmn/budget-plans/${plan_id}/submit"
              payload: { submission_note: "Q3 all-cash plan" }
              as: AccountManager
              as_user_id: "am_001"
            - call: "POST /rmn/budget-plans/${plan_id}/approve"
              payload: { approval_note: "inside credit limit" }
              as: CreditAnalyst
              as_user_id: "ca_001"
            - call: "POST /rmn/placement-slots"
              payload: { slot_code: "PDP-ONS-21", channel: "ONSITE", page_type: "PRODUCT_DETAIL", position_index: 1, max_concurrent_line_items: 1, floor_cpc_cents: 60, relevance_weight: 1.0 }
              as: NetworkAdmin
              as_user_id: "na_001"
              captures: { slot_id: $.data.id }
            - call: "GET /rmn/placement-slots/${slot_id}"
              payload: {}
              as: NetworkAdmin
              as_user_id: "na_001"
              captures: { slot_occ_before: $.data.occupancy_count }
            - call: "POST /rmn/campaigns"
              payload: { advertiser_id: "${adv_id}", budget_plan_id: "${plan_id}", name: "Summit Q3 PDP", channel_mix: "ONSITE_ONLY", flight_start_at: "2026-08-05T00:00:00Z", flight_end_at: "2026-08-20T00:00:00Z", allocated_budget_cents: 1500000, pacing_mode: "EVEN", daily_cap_cents: 150000, attribution_model: "LAST_TOUCH", attribution_window_days: 14 }
              as: AccountManager
              as_user_id: "am_001"
              captures: { cmp_id: $.data.id, cmp_v_after_create: $.data.version }
            - call: "POST /rmn/catalog-products"
              payload: { sku: "SKU-SMOG-4001", category_code: "OUTDOOR", title: "two person trail tent", price_cents: 18900, in_stock_units: 30, margin_pct: 0.35, min_stock_units_for_serving: 3 }
              as: CatalogOps
              as_user_id: "co_001"
              captures: { prod_id: $.data.id }
            - call: "POST /rmn/line-items"
              payload: { campaign_id: "${cmp_id}", placement_slot_id: "${slot_id}", bid_cents: 200, bid_type: "CPC", flight_start_at: "2026-08-06T00:00:00Z", flight_end_at: "2026-08-16T00:00:00Z", daily_budget_cents: 100000, category_code: "OUTDOOR", keyword_match_terms: ["trail", "tent"], expected_campaign_version: "${cmp_v_after_create}" }
              as: AccountManager
              as_user_id: "am_001"
              captures: { li_id: $.data.id, li_v_after_create: $.data.version }
            - call: "POST /rmn/product-assignments"
              payload: { line_item_id: "${li_id}", catalog_product_id: "${prod_id}", is_hero: true, expected_line_item_version: "${li_v_after_create}" }
              as: CatalogOps
              as_user_id: "co_001"
            - call: "POST /rmn/line-items/${li_id}/submit-eligibility"
              payload: {}
              as: AccountManager
              as_user_id: "am_001"
          trigger:
            - call: "POST /rmn/line-items/${li_id}/eligibility-decision"
              payload: { decision: "APPROVE", decision_note: "forward action: grant slot occupancy" }
              as: CatalogOps
              as_user_id: "co_001"
            - call: "GET /rmn/placement-slots/${slot_id}"
              payload: {}
              as: NetworkAdmin
              as_user_id: "na_001"
              captures: { slot_occ_mid: $.data.occupancy_count }
            - call: "POST /rmn/line-items/${li_id}/end"
              payload: { end_reason: "compensating action: release slot occupancy" }
              as: AccountManager
              as_user_id: "am_001"
            - call: "GET /rmn/placement-slots/${slot_id}"
              payload: {}
              as: NetworkAdmin
              as_user_id: "na_001"
              captures: { slot_occ_after: $.data.occupancy_count }
          assert:
            - "${slot_occ_before} == 0"
            - "trigger step 1 response HTTP status == 200"
            - "trigger step 1 response data.line_item_status == ELIGIBLE"
            - "${slot_occ_mid} == 1"
            - "LineItem.${li_id}.reserved_cents == 1000000"
            - "LineItem.${li_id}.spend_cents == 0"
            - "trigger step 3 response data.line_item_status == ENDED"
            - "${slot_occ_after} == 0"
            - "${slot_occ_after} - ${slot_occ_before} == 0 (zero drift on occupancy_count)"
            - "PlacementSlot.${slot_id}.occupancy_count == 0 equals the count of LineItem rows on the slot with line_item_status IN {ELIGIBLE, SERVING, OOS_PAUSED, MANUAL_PAUSED}, which is 0"
            - "BudgetPlan.${plan_id}.available_cents == 5000000"
