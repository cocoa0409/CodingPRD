# =============================================================================
# Task 2233 — Official Grain Inspection & Weighing
# Seed tables §1.0–§1.7 (single source of truth for PRD / tests / implementation)
# Difficulty band: beyond Expert (§0.4) — 14 entities, 64 endpoints, 8 state
# machines, 9 calculations, 53 validations, 65 error codes.
# =============================================================================

scenario: |
  2233. Official Grain Inspection & Weighing (grain inspection and weighing service): sampling at the point of loading or unloading with approved sampling devices and sample integrity, grading determination for test weight, moisture, damage and foreign material with official standards, protein and specialty analysis with instrument calibration and comparison programs, official weighing with scale certification, weight certificates and supervision requirements, certificate issuance with appeal and reinspection rights within specified timeframes, export cargo inspection with vessel loading supervision and certification for foreign buyers, inspector licensing, training and performance monitoring, fee schedules and service delivery in delegated versus designated areas

domain_name: official-grain-inspection
api_prefix: /grain-inspection

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - rate_threshold_triggers

  entity_topology: flat
  # flat: all 14 entities are peer collections under a single `/grain-inspection`
  # namespace; every relationship is an explicit FK field in the request body or
  # a single-level nested creation path. No entity is addressed through a
  # multi-level ownership chain.

  state_machine_shape: parallel
  # InspectionRequest carries two independent state dimensions
  # (grading_status × weighing_status) that advance on disjoint triggers.
  # Equipment.approval_status, Sample.integrity_status, Appeal.status and
  # Certificate.status are additionally cyclic (recovery / re-review loops).

  relationship_patterns:
    - one_to_many          # ServiceArea → Inspector/Equipment/FeeSchedule; InspectionRequest → Sample/GradingResult/...
    - self_referential     # Certificate.superseded_certificate_id, GradingResult.supersedes_grading_result_id
    - cross_aggregate      # GradingResult.appeal_id crosses back from the appeal aggregate into the grading aggregate
    - polymorphic          # Equipment serves three kinds (SAMPLING_DEVICE / SCALE / PROTEIN_INSTRUMENT) with kind-conditional rules

  role_model: segregation_of_duties
  # The weigher may not countersign their own weighing; the inspector who
  # produced the original grading result may not regrade on appeal nor sit on
  # the appeal panel; a supervising inspector may not file a proficiency
  # comparison check against themselves.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: ServiceArea
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Field office / service area name"
        constraints: "1..120 chars"
      - name: state_code
        type: string
        source: input
        description: "Two-letter uppercase US state code the area serves"
        constraints: "^[A-Z]{2}$"
      - name: authority_type
        type: enum
        source: input
        description: "DELEGATED = state agency acting under delegation; DESIGNATED = designated agency under federal supervision"
        constraints: "one of {DELEGATED, DESIGNATED}"
      - name: status
        type: enum
        source: input
        description: "Operational status of the area; SUSPENDED blocks all new service intake"
        default: ACTIVE
        constraints: "one of {ACTIVE, SUSPENDED}"
      - name: fee_multiplier_bp
        type: integer
        source: input
        description: "Authority cost adjustment in basis points applied to the discounted fee subtotal (10000 = no adjustment)"
        default: 10000
        constraints: "10000..15000"
      - name: supervision_required
        type: boolean
        source: input
        description: "When true a WeighingRecord must reach SUPERVISED before a WEIGHT/COMBINED/EXPORT_CARGO certificate may be issued"
        default: true
      - name: concurrent_watch_capacity
        type: integer
        source: input
        description: "Maximum number of non-terminal VesselWatch rows whose closed windows may intersect in this area"
        default: 2
        constraints: ">= 1"
      - name: open_watch_count
        type: integer
        source: computed
        description: "Count of VesselWatch rows in this area with status IN {SCHEDULED, IN_PROGRESS}"
        default: 0

  - name: FeeSchedule
    parent: ServiceArea
    common_fields: true
    fields:
      - name: service_area_id
        type: string
        source: input
        description: "FK -> ServiceArea.id; area this schedule prices"
      - name: service_class
        type: enum
        source: input
        description: "Priced service class"
        constraints: "one of {GRADING, WEIGHING, PROTEIN, EXPORT_SUPERVISION, APPEAL}"
      - name: base_fee_cents
        type: integer
        source: input
        description: "Flat component of the fee for this class"
        constraints: ">= 0"
      - name: per_thousand_bushel_rate_cents
        type: integer
        source: input
        description: "Rate charged per whole (ceiling) thousand bushels of certified quantity"
        default: 0
        constraints: ">= 0"
      - name: overtime_multiplier_bp
        type: integer
        source: input
        description: "Surcharge in basis points applied to the service fee when the certificate is issued outside standard hours"
        default: 2500
        constraints: "0..10000"
      - name: minimum_fee_cents
        type: integer
        source: input
        description: "Floor applied to the final assessed total for certificates that price this class"
        default: 0
        constraints: ">= 0"
      - name: effective_from
        type: datetime
        source: input
        description: "Inclusive start of the applicability window (ISO 8601 UTC)"
      - name: effective_to
        type: datetime
        source: input
        description: "Exclusive end of the applicability window; null = open ended"
        default: null
      - name: status
        type: enum
        source: system
        description: "DRAFT until activated; SUPERSEDED when a newer schedule for the same (service_area_id, service_class) is activated"
        default: DRAFT
        constraints: "one of {DRAFT, ACTIVE, SUPERSEDED}"

  - name: Applicant
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Applicant (elevator, exporter, or producer) legal name"
      - name: account_code
        type: string
        source: input
        description: "Billing account code"
        constraints: "globally unique, ^[A-Z0-9-]{3,20}$"
      - name: contact_email
        type: string
        source: input
        description: "Notification address for certificates and appeal decisions"
      - name: credit_limit_cents
        type: integer
        source: input
        description: "Maximum open_balance_cents permitted before further certificate issuance is refused"
        default: 500000
        constraints: ">= 0"
      - name: charges_total_cents
        type: integer
        source: computed
        description: "Running sum of every charge event (certificate fee assessment + appeal deposit)"
        default: 0
      - name: credits_total_cents
        type: integer
        source: computed
        description: "Running sum of every credit event (payment + certificate fee reversal + appeal deposit refund)"
        default: 0
      - name: open_balance_cents
        type: integer
        source: computed
        description: "charges_total_cents - credits_total_cents; the conserved receivable quantity (may be negative when a paid certificate is later reversed)"
        default: 0

  - name: Inspector
    parent: ServiceArea
    common_fields: true
    fields:
      - name: service_area_id
        type: string
        source: input
        description: "FK -> ServiceArea.id; licensing area the inspector is attached to"
      - name: license_number
        type: string
        source: input
        description: "Official licence number"
        constraints: "unique within service_area_id"
      - name: full_name
        type: string
        source: input
        description: "Licensed inspector name printed on certificates"
      - name: endorsements
        type: array
        source: input
        description: "Licence endorsements held"
        constraints: "non-empty subset of {SAMPLING, GRADING, PROTEIN, WEIGHING, SUPERVISION}"
      - name: license_status
        type: enum
        source: system
        description: "Licence lifecycle state"
        default: PROBATIONARY
        constraints: "one of {PROBATIONARY, ACTIVE, SUSPENDED, REVOKED, EXPIRED}"
      - name: license_expires_at
        type: datetime
        source: input
        description: "Licence expiry instant; the clock sweep moves the licence to EXPIRED once passed"
      - name: training_hours_completed
        type: number
        source: computed
        description: "Sum of hours from all training records filed for this inspector"
        default: 0
      - name: appeal_reversal_count
        type: integer
        source: computed
        description: "Number of appeals decided DECIDED_REVISED against a grading result this inspector produced"
        default: 0
      - name: check_sample_deviation_count
        type: integer
        source: computed
        description: "Number of proficiency comparison checks filed against this inspector whose abs(deviation_pct) > 0.25"
        default: 0
      - name: late_certificate_count
        type: integer
        source: computed
        description: "Number of certificates this inspector issued more than 48h after the inspection request was created"
        default: 0
      - name: performance_score
        type: integer
        source: computed
        description: "Weighted performance score (see calculations.inspector_performance_score); gates activation and drives auto-suspension"
        default: 100
      - name: suspension_reason
        type: string
        source: system
        description: "Free-text reason recorded on the most recent SUSPEND/REVOKE transition; null when never suspended"
        default: null

  - name: Equipment
    parent: ServiceArea
    common_fields: true
    fields:
      - name: service_area_id
        type: string
        source: input
        description: "FK -> ServiceArea.id; area that owns and approves the equipment"
      - name: equipment_kind
        type: enum
        source: input
        description: "Kind of approved equipment; drives kind-conditional rules"
        constraints: "one of {SAMPLING_DEVICE, SCALE, PROTEIN_INSTRUMENT}"
      - name: asset_code
        type: string
        source: input
        description: "Asset tag"
        constraints: "1..40 chars"
      - name: model
        type: string
        source: input
        description: "Manufacturer model designation"
      - name: approval_status
        type: enum
        source: system
        description: "Approval / calibration lifecycle state"
        default: PENDING_APPROVAL
        constraints: "one of {PENDING_APPROVAL, APPROVED, DRIFT_WATCH, OUT_OF_TOLERANCE, EXPIRED, WITHDRAWN}"
      - name: certified_until
        type: datetime
        source: system
        description: "Expiry of the most recent certification / approval test; null before the first certification"
        default: null
      - name: capacity_lbs
        type: integer
        source: input
        description: "Rated scale capacity in pounds; required when equipment_kind == SCALE, must be omitted otherwise"
        default: null
      - name: tolerance_lbs
        type: number
        source: input
        description: "Maintenance tolerance in pounds; required when equipment_kind == SCALE, must be omitted otherwise"
        default: null
      - name: last_certification_error_lbs
        type: number
        source: system
        description: "Error observed on the most recent scale certification test"
        default: null
      - name: recent_deviations_pct
        type: array
        source: computed
        description: "Up to the three most recent comparison-check deviation_pct values in ascending created_at order (oldest first); only maintained for PROTEIN_INSTRUMENT"
        default: []
      - name: rolling_bias_pct
        type: number
        source: computed
        description: "Mean of recent_deviations_pct rounded to 2 decimals; null before the first comparison check"
        default: null
      - name: last_comparison_deviation_pct
        type: number
        source: computed
        description: "deviation_pct of the most recent comparison check"
        default: null
      - name: comparison_check_count
        type: integer
        source: computed
        description: "Total comparison checks ever filed against this instrument"
        default: 0
      - name: consecutive_out_of_tolerance_checks
        type: integer
        source: computed
        description: "Consecutive comparison checks that resolved to OUT_OF_TOLERANCE; reset to 0 by any check resolving to APPROVED or DRIFT_WATCH and by a new certification"
        default: 0

  - name: InspectionRequest
    parent: null
    common_fields: true
    fields:
      - name: applicant_id
        type: string
        source: input
        description: "FK -> Applicant.id; party that ordered and is billed for the service"
      - name: service_area_id
        type: string
        source: input
        description: "FK -> ServiceArea.id; area performing the service"
      - name: commodity
        type: enum
        source: input
        description: "Commodity being inspected; selects the official grade table and the pounds-per-bushel constant"
        constraints: "one of {CORN, SOYBEANS}"
      - name: point_of_service
        type: enum
        source: input
        description: "Whether sampling occurs at loading or at unloading"
        constraints: "one of {LOADING, UNLOADING}"
      - name: lot_identifier
        type: string
        source: input
        description: "Applicant's lot / carrier identifier"
      - name: declared_quantity_bushels
        type: number
        source: input
        description: "Quantity declared by the applicant; used for fee assessment when no official weight exists"
        constraints: "> 0"
      - name: requested_services
        type: array
        source: input
        description: "Services ordered on this request"
        constraints: "non-empty subset of {GRADING, WEIGHING, PROTEIN, EXPORT_SUPERVISION}; MUST include GRADING"
      - name: grading_status
        type: enum
        source: system
        description: "Grading dimension of the parallel state machine"
        default: OPEN
        constraints: "one of {OPEN, SAMPLED, GRADED, GRADE_CERTIFIED, UNDER_APPEAL}"
      - name: weighing_status
        type: enum
        source: system
        description: "Weighing dimension of the parallel state machine; initialised to PENDING when requested_services includes WEIGHING, else NOT_REQUIRED"
        constraints: "one of {NOT_REQUIRED, PENDING, WEIGHED, SUPERVISED, WEIGHT_CERTIFIED}"
      - name: certified_quantity_bushels
        type: number
        source: computed
        description: "Official quantity used for fee assessment: net_bushels of the WeighingRecord with status IN {WEIGHED, SUPERVISED} when one exists, else declared_quantity_bushels"
      - name: grade_revision_count
        type: integer
        source: computed
        description: "Number of times an appeal on this request was decided DECIDED_REVISED"
        default: 0

  - name: Sample
    parent: InspectionRequest
    common_fields: true
    fields:
      - name: inspection_request_id
        type: string
        source: input
        description: "FK -> InspectionRequest.id; request the sample was drawn for"
      - name: sampling_device_id
        type: string
        source: input
        description: "FK -> Equipment.id; approved sampling device used to draw the sample"
      - name: inspector_id
        type: string
        source: input
        description: "FK -> Inspector.id; licensed inspector who drew the sample"
      - name: sample_type
        type: enum
        source: input
        description: "ORIGINAL for the first official sample, FILE for a retained duplicate, APPEAL for a sample drawn for an appeal"
        default: ORIGINAL
        constraints: "one of {ORIGINAL, FILE, APPEAL}"
      - name: seal_number
        type: string
        source: input
        description: "Tamper-evident seal number"
        constraints: "unique within inspection_request_id"
      - name: portions_count
        type: integer
        source: input
        description: "Number of official portions the sample was divided into"
        constraints: "1..10"
      - name: portions_consumed
        type: integer
        source: computed
        description: "Portions consumed by grading results and protein analyses; decremented when an analysis is invalidated by a calibration cascade"
        default: 0
      - name: portions_retained
        type: integer
        source: computed
        description: "Portions held for an appeal file; released when the appeal is decided or dismissed"
        default: 0
      - name: portions_available
        type: integer
        source: computed
        description: "portions_count - portions_consumed - portions_retained"
      - name: integrity_status
        type: enum
        source: system
        description: "Sample integrity state; BROKEN and EXPIRED disqualify the sample from any further analysis"
        default: SEALED
        constraints: "one of {SEALED, CONSUMED, BROKEN, EXPIRED}"
      - name: collected_at
        type: datetime
        source: system
        description: "Logical clock instant at which the sample was drawn"
      - name: file_retention_until
        type: datetime
        source: computed
        description: "collected_at + 90 days; the clock sweep expires the sample once passed"

  - name: GradingResult
    parent: InspectionRequest
    common_fields: true
    fields:
      - name: inspection_request_id
        type: string
        source: input
        description: "FK -> InspectionRequest.id; request being graded"
      - name: sample_id
        type: string
        source: input
        description: "FK -> Sample.id; sample the determination was made on"
      - name: inspector_id
        type: string
        source: input
        description: "FK -> Inspector.id; inspector who made the determination"
      - name: appeal_id
        type: string
        source: input
        description: "FK -> Appeal.id; set when this determination is an appeal or reinspection regrade"
        default: null
      - name: supersedes_grading_result_id
        type: string
        source: system
        description: "FK -> GradingResult.id; the FINAL result this one displaced, null for the first determination on a request"
        default: null
      - name: test_weight_lbs_per_bushel
        type: number
        source: input
        description: "Observed test weight in pounds per bushel"
        constraints: "20.0..70.0"
      - name: moisture_pct
        type: number
        source: input
        description: "Observed moisture percentage"
        constraints: "0.0..40.0"
      - name: damaged_total_pct
        type: number
        source: input
        description: "Total damaged kernels percentage"
        constraints: "0.0..100.0"
      - name: heat_damaged_pct
        type: number
        source: input
        description: "Heat damaged kernels percentage (a subset of damaged_total_pct)"
        constraints: "0.0..100.0"
      - name: foreign_material_pct
        type: number
        source: input
        description: "Foreign material percentage"
        constraints: "0.0..100.0"
      - name: rounded_factors
        type: object
        source: computed
        description: "The five factor values rounded to 1 decimal (round_half_up) that were compared against the official table: keys test_weight_lbs_per_bushel, moisture_pct, damaged_total_pct, heat_damaged_pct, foreign_material_pct"
      - name: assigned_grade
        type: enum
        source: computed
        description: "Numerical grade assigned from the official table for the request's commodity"
        constraints: "one of {US_NO_1, US_NO_2, US_NO_3, US_NO_4, US_NO_5, SAMPLE_GRADE}"
      - name: limiting_factor
        type: enum
        source: computed
        description: "Factor that prevented the next better grade; NONE when assigned_grade is the best grade in the table"
        constraints: "one of {TEST_WEIGHT, MOISTURE, DAMAGED_TOTAL, HEAT_DAMAGED, FOREIGN_MATERIAL, NONE}"
      - name: status
        type: enum
        source: system
        description: "FINAL for the operative determination; SUPERSEDED once displaced by a later determination"
        default: FINAL
        constraints: "one of {FINAL, SUPERSEDED}"

  - name: ProteinAnalysis
    parent: InspectionRequest
    common_fields: true
    fields:
      - name: inspection_request_id
        type: string
        source: input
        description: "FK -> InspectionRequest.id; request the specialty analysis belongs to"
      - name: sample_id
        type: string
        source: input
        description: "FK -> Sample.id; sample analysed"
      - name: instrument_id
        type: string
        source: input
        description: "FK -> Equipment.id; PROTEIN_INSTRUMENT used for the determination"
      - name: inspector_id
        type: string
        source: input
        description: "FK -> Inspector.id; inspector who ran the instrument"
      - name: sequence_no
        type: integer
        source: system
        description: "Monotonically increasing per-instrument counter assigned at creation, starting at 1; tie-break for ordered cascades when created_at ties"
      - name: protein_pct_as_is
        type: number
        source: input
        description: "Instrument protein reading on an as-is moisture basis"
        constraints: "0.0..60.0"
      - name: instrument_moisture_pct
        type: number
        source: input
        description: "Moisture percentage read by the instrument at analysis time"
        constraints: "0.0..40.0"
      - name: basis_source
        type: enum
        source: computed
        description: "Which moisture value the 13% basis conversion used"
        constraints: "one of {INSTRUMENT_MOISTURE, OFFICIAL_MOISTURE}"
      - name: moisture_source_pct
        type: number
        source: computed
        description: "The moisture percentage actually used in the conversion"
      - name: protein_reported_pct
        type: number
        source: computed
        description: "Protein converted to the official 13.0% moisture basis, 2 decimals"
      - name: basis_adjustment_pct
        type: number
        source: computed
        description: "protein_reported_pct - protein_pct_as_is, 2 decimals"
      - name: status
        type: enum
        source: system
        description: "ACCEPTED at creation; RECOMPUTED once restated on the official moisture basis; REJECTED_CALIBRATION when the instrument was found out of tolerance"
        default: ACCEPTED
        constraints: "one of {ACCEPTED, RECOMPUTED, REJECTED_CALIBRATION}"

  - name: WeighingRecord
    parent: InspectionRequest
    common_fields: true
    fields:
      - name: inspection_request_id
        type: string
        source: input
        description: "FK -> InspectionRequest.id; request being officially weighed"
      - name: scale_id
        type: string
        source: input
        description: "FK -> Equipment.id; certified SCALE used"
      - name: weigher_inspector_id
        type: string
        source: input
        description: "FK -> Inspector.id; inspector who performed the weighing"
      - name: supervisor_inspector_id
        type: string
        source: input
        description: "FK -> Inspector.id; inspector who countersigned the weighing; null until supervised"
        default: null
      - name: drafts
        type: array
        source: input
        description: "Ordered list of draft objects { gross_lbs: integer, tare_lbs: integer }"
        constraints: "1..20 items; each gross_lbs > tare_lbs >= 0"
      - name: dockage_pct
        type: number
        source: input
        description: "Dockage percentage deducted from each draft"
        default: 0
        constraints: "0.0..15.0"
      - name: dockage_lbs
        type: integer
        source: computed
        description: "Sum of the per-draft dockage deductions (official per-draft rounding)"
      - name: net_lbs
        type: integer
        source: computed
        description: "Official net weight using the per-draft rounding variant"
      - name: provisional_net_lbs
        type: integer
        source: computed
        description: "Provisional net weight using the aggregate rounding variant"
      - name: rounding_variance_lbs
        type: integer
        source: computed
        description: "provisional_net_lbs - net_lbs"
      - name: net_bushels
        type: number
        source: computed
        description: "net_lbs divided by the commodity's pounds-per-bushel constant, 2 decimals"
      - name: status
        type: enum
        source: system
        description: "WEIGHED at creation; SUPERVISED once countersigned; VOIDED when the scale is later found out of tolerance"
        default: WEIGHED
        constraints: "one of {WEIGHED, SUPERVISED, VOIDED}"

  - name: Certificate
    parent: InspectionRequest
    common_fields: true
    fields:
      - name: inspection_request_id
        type: string
        source: input
        description: "FK -> InspectionRequest.id; request certified"
      - name: issuing_inspector_id
        type: string
        source: input
        description: "FK -> Inspector.id; inspector who issued the certificate"
      - name: superseded_certificate_id
        type: string
        source: system
        description: "FK -> Certificate.id; prior ISSUED certificate of the same certificate_type that this one displaced"
        default: null
      - name: appeal_id
        type: string
        source: system
        description: "FK -> Appeal.id; appeal whose DECIDED_REVISED outcome produced this certificate"
        default: null
      - name: certificate_type
        type: enum
        source: input
        description: "Kind of official certificate"
        constraints: "one of {GRADE, WEIGHT, COMBINED, EXPORT_CARGO, APPEAL_GRADE}"
      - name: sequence_no
        type: integer
        source: system
        description: "Monotonically increasing per-applicant counter assigned at issuance, starting at 1; tie-break for payment waterfall ordering when created_at ties"
      - name: grade_snapshot
        type: enum
        source: computed
        description: "assigned_grade of the request's FINAL GradingResult at issuance; null for WEIGHT certificates"
        default: null
      - name: limiting_factor_snapshot
        type: enum
        source: computed
        description: "limiting_factor of the request's FINAL GradingResult at issuance; null for WEIGHT certificates"
        default: null
      - name: net_lbs_snapshot
        type: integer
        source: computed
        description: "net_lbs of the operative WeighingRecord at issuance; null when no weighing is certified"
        default: null
      - name: net_bushels_snapshot
        type: number
        source: computed
        description: "net_bushels of the operative WeighingRecord at issuance; null when no weighing is certified"
        default: null
      - name: protein_reported_pct_snapshot
        type: number
        source: computed
        description: "protein_reported_pct of the request's operative ProteinAnalysis at issuance; null when protein was not ordered"
        default: null
      - name: certified_quantity_bushels
        type: number
        source: computed
        description: "Quantity the fee was assessed on, copied from InspectionRequest.certified_quantity_bushels at issuance"
      - name: overtime_applied
        type: boolean
        source: computed
        description: "True when issued_at falls outside standard hours (07:00:00Z inclusive to 17:00:00Z exclusive)"
      - name: fee_total_cents
        type: integer
        source: computed
        description: "Assessed fee (see calculations.fee_assessment); always 0 for APPEAL_GRADE certificates"
      - name: fee_paid_cents
        type: integer
        source: computed
        description: "Portion of fee_total_cents settled by payment allocation"
        default: 0
      - name: fee_settlement_status
        type: enum
        source: system
        description: "UNPAID until fully allocated, PAID once fee_paid_cents == fee_total_cents, REVERSED when the certificate is voided or superseded"
        default: UNPAID
        constraints: "one of {UNPAID, PAID, REVERSED}"
      - name: issued_at
        type: datetime
        source: system
        description: "Logical clock instant of issuance"
      - name: reinspection_deadline_at
        type: datetime
        source: computed
        description: "issued_at + 5 days; last instant a REINSPECTION may be filed"
      - name: appeal_deadline_at
        type: datetime
        source: computed
        description: "issued_at + 10 days; last instant an APPEAL may be filed"
      - name: status
        type: enum
        source: system
        description: "Certificate lifecycle state"
        default: ISSUED
        constraints: "one of {ISSUED, UNDER_APPEAL, SUPERSEDED, VOIDED}"

  - name: Appeal
    parent: Certificate
    common_fields: true
    fields:
      - name: certificate_id
        type: string
        source: input
        description: "FK -> Certificate.id; certificate being challenged"
      - name: applicant_id
        type: string
        source: input
        description: "FK -> Applicant.id; party filing the challenge"
      - name: assigned_sample_id
        type: string
        source: system
        description: "FK -> Sample.id; sample assigned for the regrade; null until assignment"
        default: null
      - name: appeal_type
        type: enum
        source: input
        description: "REINSPECTION (same office, 5 day window, single reviewer), APPEAL (3 member panel, 10 day window), BOARD_APPEAL (5 member panel drawn from other areas, 20 days after the APPEAL decision)"
        constraints: "one of {REINSPECTION, APPEAL, BOARD_APPEAL}"
      - name: round_number
        type: integer
        source: computed
        description: "1 for REINSPECTION, 2 for APPEAL, 3 for BOARD_APPEAL"
      - name: required_panel_size
        type: integer
        source: computed
        description: "1 for REINSPECTION, 3 for APPEAL, 5 for BOARD_APPEAL"
      - name: votes_cast_count
        type: integer
        source: computed
        description: "Total AppealVote rows filed on this appeal"
        default: 0
      - name: revise_votes_count
        type: integer
        source: computed
        description: "AppealVote rows with vote == REVISE"
        default: 0
      - name: uphold_votes_count
        type: integer
        source: computed
        description: "AppealVote rows with vote == UPHOLD"
        default: 0
      - name: abstain_votes_count
        type: integer
        source: computed
        description: "AppealVote rows with vote == ABSTAIN"
        default: 0
      - name: effective_votes_count
        type: integer
        source: computed
        description: "revise_votes_count + uphold_votes_count (abstentions excluded from the denominator)"
        default: 0
      - name: deposit_cents
        type: integer
        source: computed
        description: "base_fee_cents of the area's ACTIVE APPEAL fee schedule at filing time, charged to the applicant"
      - name: refund_cents
        type: integer
        source: computed
        description: "Credited back on decision: full deposit when DECIDED_REVISED, floor(deposit/2) when DISMISSED, 0 when DECIDED_UPHELD"
        default: 0
      - name: outcome_grade
        type: enum
        source: computed
        description: "assigned_grade of the appeal regrade at decision time; null before decision"
        default: null
      - name: decided_at
        type: datetime
        source: system
        description: "Logical clock instant of the decision; null before decision"
        default: null
      - name: status
        type: enum
        source: system
        description: "Appeal lifecycle state"
        default: FILED
        constraints: "one of {FILED, SAMPLE_ASSIGNED, UNDER_REVIEW, DECIDED_UPHELD, DECIDED_REVISED, DISMISSED}"

  - name: AppealVote
    parent: Appeal
    common_fields: false
    fields:
      - name: appeal_id
        type: string
        source: input
        description: "FK -> Appeal.id; appeal voted on"
      - name: inspector_id
        type: string
        source: input
        description: "FK -> Inspector.id; panel member casting the vote"
      - name: vote
        type: enum
        source: input
        description: "Panel member's position"
        constraints: "one of {UPHOLD, REVISE, ABSTAIN}"
      - name: rationale
        type: string
        source: input
        description: "Optional written rationale"
        default: null

  - name: VesselWatch
    parent: InspectionRequest
    common_fields: true
    fields:
      - name: inspection_request_id
        type: string
        source: input
        description: "FK -> InspectionRequest.id; export cargo request being supervised"
      - name: service_area_id
        type: string
        source: system
        description: "FK -> ServiceArea.id; copied from the request at creation; the capacity resource for closed-window intersection"
      - name: supervisor_inspector_id
        type: string
        source: input
        description: "FK -> Inspector.id; supervising inspector on watch"
      - name: vessel_name
        type: string
        source: input
        description: "Vessel or barge name"
      - name: window_start_at
        type: datetime
        source: input
        description: "Start of the loading supervision window"
      - name: window_end_at
        type: datetime
        source: input
        description: "End of the loading supervision window; must be strictly after window_start_at"
      - name: holds_declared
        type: integer
        source: input
        description: "Number of vessel holds to be supervised"
        constraints: ">= 1"
      - name: stowage_certified
        type: boolean
        source: system
        description: "Set from the close request; EXPORT_CARGO certification requires true"
        default: false
      - name: started_at
        type: datetime
        source: system
        description: "Logical clock instant the watch was started"
        default: null
      - name: closed_at
        type: datetime
        source: system
        description: "Logical clock instant the watch was closed"
        default: null
      - name: supervision_minutes
        type: integer
        source: computed
        description: "floor((closed_at - started_at) / 60s); null until closed"
        default: null
      - name: status
        type: enum
        source: system
        description: "Watch lifecycle state"
        default: SCHEDULED
        constraints: "one of {SCHEDULED, IN_PROGRESS, CLOSED, ABORTED}"

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: InspectionRequest
    field: grading_status
    initial_state: OPEN
    terminal_states: []
    dimension_note: "Independent of weighing_status; the two dimensions advance on disjoint triggers"
    transitions:
      - from: OPEN
        to: SAMPLED
        trigger: "POST /grain-inspection/samples with sample_type == ORIGINAL"
        preconditions:
          - "ServiceArea.status == ACTIVE"
          - "Equipment(sampling_device_id).equipment_kind == SAMPLING_DEVICE and approval_status == APPROVED and certified_until > now"
          - "Inspector(inspector_id).license_status IN {PROBATIONARY, ACTIVE} and SAMPLING in endorsements and inspector.service_area_id == request.service_area_id"
        side_effects:
          - "Sample.integrity_status = SEALED, collected_at = now, file_retention_until = now + 90 days"
          - "Sample.portions_available = portions_count"
      - from: SAMPLED
        to: GRADED
        trigger: "POST /grain-inspection/grading-results with appeal_id == null"
        preconditions:
          - "Sample(sample_id).inspection_request_id == inspection_request_id"
          - "Sample.integrity_status NOT IN {BROKEN, EXPIRED}"
          - "Sample.portions_available >= 1"
          - "Inspector.license_status IN {PROBATIONARY, ACTIVE} and GRADING in endorsements"
          - "No FINAL GradingResult with appeal_id == null already exists for the request"
        side_effects:
          - "GradingResult.assigned_grade and limiting_factor computed from the commodity grade table"
          - "Sample.portions_consumed += 1; when portions_available reaches 0 Sample.integrity_status = CONSUMED"
      - from: GRADED
        to: GRADE_CERTIFIED
        trigger: "POST /grain-inspection/certificates with certificate_type IN {GRADE, COMBINED, EXPORT_CARGO}"
        preconditions:
          - "A FINAL GradingResult exists for the request"
          - "Applicant.open_balance_cents <= Applicant.credit_limit_cents"
          - "An ACTIVE FeeSchedule covering now exists for every priced class of the certificate_type"
        side_effects:
          - "Certificate snapshots grade, limiting factor, weights, protein and certified quantity"
          - "Certificate.fee_total_cents assessed; Applicant.charges_total_cents += fee_total_cents; open_balance_cents recomputed"
          - "Certificate.reinspection_deadline_at = issued_at + 5 days; appeal_deadline_at = issued_at + 10 days"
      - from: GRADE_CERTIFIED
        to: UNDER_APPEAL
        trigger: "POST /grain-inspection/appeals"
        preconditions:
          - "Certificate.status == ISSUED and certificate_type != APPEAL_GRADE"
          - "now <= reinspection_deadline_at for REINSPECTION, now <= appeal_deadline_at for APPEAL"
          - "For BOARD_APPEAL: a prior APPEAL on the same certificate is DECIDED_UPHELD and now <= its decided_at + 20 days"
          - "No non-terminal Appeal exists on the certificate"
        side_effects:
          - "Certificate.status = UNDER_APPEAL"
          - "Appeal.deposit_cents charged to the applicant; charges_total_cents and open_balance_cents updated"
      - from: UNDER_APPEAL
        to: GRADE_CERTIFIED
        trigger: "POST /grain-inspection/appeals/{id}/decide (cyclic recovery; any decision outcome)"
        preconditions:
          - "Appeal.status == UNDER_REVIEW"
          - "effective_votes_count >= required_panel_size"
        side_effects:
          - "On DECIDED_REVISED: the appeal regrade becomes FINAL, the challenged certificate is VOIDED and its fee REVERSED, a fee-free APPEAL_GRADE certificate is issued, grade_revision_count += 1"
          - "On DECIDED_UPHELD or DISMISSED: Certificate.status returns to ISSUED"
          - "Appeal.refund_cents credited; retained sample portion released"

  - entity: InspectionRequest
    field: weighing_status
    initial_state: "PENDING when requested_services includes WEIGHING, otherwise NOT_REQUIRED"
    terminal_states: []
    dimension_note: "Independent of grading_status"
    transitions:
      - from: PENDING
        to: WEIGHED
        trigger: "POST /grain-inspection/weighing-records"
        preconditions:
          - "requested_services includes WEIGHING"
          - "Equipment(scale_id).equipment_kind == SCALE, approval_status == APPROVED, certified_until > now"
          - "Inspector(weigher_inspector_id) has WEIGHING endorsement and license_status IN {PROBATIONARY, ACTIVE}"
          - "sum of gross_lbs across drafts <= Equipment.capacity_lbs"
          - "No WeighingRecord with status IN {WEIGHED, SUPERVISED} exists for the request"
        side_effects:
          - "net_lbs, provisional_net_lbs, rounding_variance_lbs, dockage_lbs and net_bushels computed"
          - "InspectionRequest.certified_quantity_bushels = net_bushels"
      - from: WEIGHED
        to: SUPERVISED
        trigger: "POST /grain-inspection/weighing-records/{id}/supervise"
        preconditions:
          - "WeighingRecord.status == WEIGHED"
          - "supervisor_inspector_id != weigher_inspector_id (segregation of duties)"
          - "Supervisor has SUPERVISION endorsement and license_status == ACTIVE"
        side_effects:
          - "WeighingRecord.status = SUPERVISED, supervisor_inspector_id recorded"
      - from: SUPERVISED
        to: WEIGHT_CERTIFIED
        trigger: "POST /grain-inspection/certificates with certificate_type IN {WEIGHT, COMBINED, EXPORT_CARGO}"
        preconditions:
          - "WeighingRecord.status == SUPERVISED when ServiceArea.supervision_required is true, otherwise status IN {WEIGHED, SUPERVISED}"
        side_effects:
          - "Certificate.net_lbs_snapshot and net_bushels_snapshot recorded"
      - from: WEIGHED
        to: WEIGHT_CERTIFIED
        trigger: "POST /grain-inspection/certificates with certificate_type IN {WEIGHT, COMBINED} (only when ServiceArea.supervision_required is false)"
        preconditions:
          - "ServiceArea.supervision_required == false"
        side_effects:
          - "Certificate.net_lbs_snapshot and net_bushels_snapshot recorded"
      - from: WEIGHT_CERTIFIED
        to: PENDING
        trigger: "POST /grain-inspection/equipment/{id}/certify with test_error_lbs > tolerance_lbs on the scale used (cross-entity cascade)"
        preconditions:
          - "The failing scale is referenced by a WeighingRecord with status IN {WEIGHED, SUPERVISED}"
        side_effects:
          - "WeighingRecord.status = VOIDED; Certificates carrying net_lbs_snapshot are VOIDED and their fees REVERSED"
          - "InspectionRequest.certified_quantity_bushels reverts to declared_quantity_bushels"

  - entity: Equipment
    field: approval_status
    initial_state: PENDING_APPROVAL
    terminal_states: [WITHDRAWN]
    transitions:
      - from: PENDING_APPROVAL
        to: APPROVED
        trigger: "POST /grain-inspection/equipment/{id}/certify"
        preconditions:
          - "certified_until_input > now"
          - "For SCALE: test_error_lbs is required and abs(test_error_lbs) <= tolerance_lbs"
          - "For SAMPLING_DEVICE and PROTEIN_INSTRUMENT: test_error_lbs must be omitted"
        side_effects:
          - "certified_until set; consecutive_out_of_tolerance_checks = 0; last_certification_error_lbs recorded for scales"
      - from: APPROVED
        to: DRIFT_WATCH
        trigger: "POST /grain-inspection/comparison-checks resolving to DRIFT_WATCH (0.15 < abs(rolling_bias_pct) <= 0.30 and abs(deviation_pct) <= 0.50)"
        preconditions:
          - "Equipment.equipment_kind == PROTEIN_INSTRUMENT"
        side_effects:
          - "recent_deviations_pct, rolling_bias_pct, comparison_check_count updated; consecutive_out_of_tolerance_checks = 0"
          - "Instrument remains usable for new analyses"
      - from: DRIFT_WATCH
        to: APPROVED
        trigger: "POST /grain-inspection/comparison-checks resolving to APPROVED (abs(rolling_bias_pct) <= 0.15) — cyclic recovery"
        preconditions:
          - "certified_until > now"
        side_effects:
          - "consecutive_out_of_tolerance_checks = 0"
      - from: APPROVED
        to: OUT_OF_TOLERANCE
        trigger: "POST /grain-inspection/comparison-checks resolving to OUT_OF_TOLERANCE (abs(deviation_pct) > 0.50 or abs(rolling_bias_pct) > 0.30)"
        preconditions:
          - "Equipment.equipment_kind == PROTEIN_INSTRUMENT"
        side_effects:
          - "consecutive_out_of_tolerance_checks += 1"
          - "Every ACCEPTED or RECOMPUTED ProteinAnalysis on this instrument created at or after the previous comparison check is set to REJECTED_CALIBRATION, in ascending (created_at, sequence_no) order, and each releases one consumed sample portion"
          - "Certificates carrying protein_reported_pct_snapshot from a rejected analysis are VOIDED and their fees REVERSED"
      - from: DRIFT_WATCH
        to: OUT_OF_TOLERANCE
        trigger: "POST /grain-inspection/comparison-checks resolving to OUT_OF_TOLERANCE"
        preconditions: []
        side_effects:
          - "Same cascade as APPROVED -> OUT_OF_TOLERANCE"
      - from: OUT_OF_TOLERANCE
        to: APPROVED
        trigger: "POST /grain-inspection/equipment/{id}/certify (recalibration; cyclic recovery)"
        preconditions:
          - "consecutive_out_of_tolerance_checks < 3"
        side_effects:
          - "recent_deviations_pct = [], rolling_bias_pct = null, consecutive_out_of_tolerance_checks = 0"
      - from: OUT_OF_TOLERANCE
        to: WITHDRAWN
        trigger: "POST /grain-inspection/comparison-checks resolving to OUT_OF_TOLERANCE for the third consecutive time"
        preconditions:
          - "consecutive_out_of_tolerance_checks reaches 3"
        side_effects:
          - "Equipment permanently unusable; further certify and comparison-check attempts are refused"
      - from: APPROVED
        to: EXPIRED
        trigger: "POST /_clock/set_current_utc advancing past certified_until"
        preconditions: []
        side_effects:
          - "Equipment cannot be used for new samples, weighings or analyses"
      - from: DRIFT_WATCH
        to: EXPIRED
        trigger: "POST /_clock/set_current_utc advancing past certified_until"
        preconditions: []
        side_effects: []
      - from: EXPIRED
        to: APPROVED
        trigger: "POST /grain-inspection/equipment/{id}/certify (recertification; cyclic recovery)"
        preconditions:
          - "certified_until_input > now"
        side_effects:
          - "consecutive_out_of_tolerance_checks = 0"

  - entity: Sample
    field: integrity_status
    initial_state: SEALED
    terminal_states: [BROKEN, EXPIRED]
    transitions:
      - from: SEALED
        to: CONSUMED
        trigger: "POST /grain-inspection/grading-results or POST /grain-inspection/protein-analyses that drives portions_available to 0"
        preconditions:
          - "portions_available >= 1 before the call"
        side_effects:
          - "portions_consumed += 1"
      - from: CONSUMED
        to: SEALED
        trigger: "POST /grain-inspection/comparison-checks whose OUT_OF_TOLERANCE cascade rejects an analysis drawn on this sample (compensation)"
        preconditions:
          - "The released analysis had status IN {ACCEPTED, RECOMPUTED}"
        side_effects:
          - "portions_consumed -= 1; portions_available returns to >= 1"
      - from: SEALED
        to: BROKEN
        trigger: "POST /grain-inspection/samples/{id}/break-seal"
        preconditions:
          - "No non-terminal Appeal holds this sample as assigned_sample_id"
        side_effects:
          - "portions_available forced to 0 for eligibility purposes; the sample can never be analysed again"
      - from: CONSUMED
        to: BROKEN
        trigger: "POST /grain-inspection/samples/{id}/break-seal"
        preconditions: []
        side_effects: []
      - from: SEALED
        to: EXPIRED
        trigger: "POST /_clock/set_current_utc advancing past file_retention_until"
        preconditions: []
        side_effects:
          - "Sample can no longer be assigned to an appeal nor analysed"
      - from: CONSUMED
        to: EXPIRED
        trigger: "POST /_clock/set_current_utc advancing past file_retention_until"
        preconditions: []
        side_effects: []

  - entity: Inspector
    field: license_status
    initial_state: PROBATIONARY
    terminal_states: [REVOKED]
    transitions:
      - from: PROBATIONARY
        to: ACTIVE
        trigger: "POST /grain-inspection/inspectors/{id}/activate"
        preconditions:
          - "training_hours_completed >= 24"
          - "performance_score >= 80"
          - "license_expires_at > now"
        side_effects:
          - "Inspector may now supervise weighings, hold vessel watches and sit on appeal panels"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /grain-inspection/appeals/{id}/decide with DECIDED_REVISED, or POST /grain-inspection/comparison-checks, or POST /grain-inspection/certificates, whenever the recomputed performance_score < 70 (threshold trigger)"
        preconditions: []
        side_effects:
          - "suspension_reason recorded as AUTO_PERFORMANCE"
          - "All SCHEDULED VesselWatch rows held by the inspector are ABORTED and ServiceArea.open_watch_count decremented"
          - "Non-terminal Appeals where this inspector is the only panel member remain UNDER_REVIEW but the inspector's future votes are refused"
      - from: PROBATIONARY
        to: SUSPENDED
        trigger: "POST /grain-inspection/inspectors/{id}/suspend"
        preconditions: []
        side_effects:
          - "suspension_reason recorded from the request body"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /grain-inspection/inspectors/{id}/suspend"
        preconditions: []
        side_effects:
          - "Same watch abort cascade as the automatic suspension"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /grain-inspection/inspectors/{id}/reinstate (cyclic recovery)"
        preconditions:
          - "performance_score >= 80"
          - "license_expires_at > now"
        side_effects:
          - "suspension_reason cleared"
      - from: SUSPENDED
        to: REVOKED
        trigger: "POST /grain-inspection/inspectors/{id}/revoke"
        preconditions: []
        side_effects:
          - "Inspector permanently barred; every subsequent operation naming the inspector is refused"
      - from: ACTIVE
        to: EXPIRED
        trigger: "POST /_clock/set_current_utc advancing past license_expires_at"
        preconditions: []
        side_effects:
          - "SCHEDULED VesselWatch rows held by the inspector are ABORTED"
      - from: PROBATIONARY
        to: EXPIRED
        trigger: "POST /_clock/set_current_utc advancing past license_expires_at"
        preconditions: []
        side_effects: []

  - entity: Certificate
    field: status
    initial_state: ISSUED
    terminal_states: [VOIDED]
    transitions:
      - from: ISSUED
        to: UNDER_APPEAL
        trigger: "POST /grain-inspection/appeals"
        preconditions:
          - "certificate_type != APPEAL_GRADE"
          - "The filing window for the appeal_type is still open"
        side_effects:
          - "InspectionRequest.grading_status = UNDER_APPEAL"
      - from: UNDER_APPEAL
        to: ISSUED
        trigger: "POST /grain-inspection/appeals/{id}/decide with DECIDED_UPHELD or DISMISSED (cyclic recovery)"
        preconditions: []
        side_effects:
          - "Deadlines are NOT extended; the original reinspection_deadline_at and appeal_deadline_at stand"
      - from: UNDER_APPEAL
        to: VOIDED
        trigger: "POST /grain-inspection/appeals/{id}/decide with DECIDED_REVISED"
        preconditions: []
        side_effects:
          - "fee_settlement_status = REVERSED; Applicant.credits_total_cents += fee_total_cents"
          - "A fee-free APPEAL_GRADE certificate is issued with superseded_certificate_id pointing at this row"
      - from: ISSUED
        to: SUPERSEDED
        trigger: "POST /grain-inspection/certificates issuing a newer certificate of the same certificate_type for the same request"
        preconditions:
          - "The new certificate's inspection request has grade_revision_count > 0"
        side_effects:
          - "fee_settlement_status = REVERSED and the fee credited back"
      - from: ISSUED
        to: VOIDED
        trigger: "POST /grain-inspection/equipment/{id}/certify or POST /grain-inspection/comparison-checks whose cascade invalidates a snapshot this certificate carries"
        preconditions: []
        side_effects:
          - "fee_settlement_status = REVERSED and the fee credited back"

  - entity: Appeal
    field: status
    initial_state: FILED
    terminal_states: [DECIDED_UPHELD, DECIDED_REVISED, DISMISSED]
    transitions:
      - from: FILED
        to: SAMPLE_ASSIGNED
        trigger: "POST /grain-inspection/appeals/{id}/assign-sample"
        preconditions:
          - "Sample.inspection_request_id == the challenged certificate's inspection_request_id"
          - "Sample.integrity_status NOT IN {BROKEN, EXPIRED}"
          - "Sample.portions_available >= 1"
        side_effects:
          - "Sample.portions_retained += 1; assigned_sample_id recorded"
      - from: SAMPLE_ASSIGNED
        to: UNDER_REVIEW
        trigger: "POST /grain-inspection/grading-results with appeal_id set (the regrade)"
        preconditions:
          - "inspector_id != the inspector who produced the challenged FINAL GradingResult (segregation of duties)"
          - "sample_id == Appeal.assigned_sample_id"
          - "Inspector has GRADING endorsement and license_status == ACTIVE"
        side_effects:
          - "The regrade is created with status FINAL only at decision time; until then it is stored as SUPERSEDED-pending and does not displace the operative result"
      - from: UNDER_REVIEW
        to: DECIDED_REVISED
        trigger: "POST /grain-inspection/appeals/{id}/decide"
        preconditions:
          - "effective_votes_count >= required_panel_size"
          - "revise_votes_count * 2 > effective_votes_count (strict majority of non-abstaining votes)"
          - "The regrade's assigned_grade differs from the challenged certificate's grade_snapshot"
        side_effects:
          - "refund_cents = deposit_cents credited back"
          - "The regrade becomes the FINAL GradingResult; the previous FINAL becomes SUPERSEDED"
          - "Challenged certificate VOIDED with fee reversal; fee-free APPEAL_GRADE certificate issued"
          - "InspectionRequest.grade_revision_count += 1"
          - "The original inspector's appeal_reversal_count += 1 and performance_score recomputed, possibly auto-suspending"
          - "Sample.portions_retained -= 1"
      - from: UNDER_REVIEW
        to: DECIDED_UPHELD
        trigger: "POST /grain-inspection/appeals/{id}/decide"
        preconditions:
          - "effective_votes_count >= required_panel_size"
          - "revise_votes_count * 2 <= effective_votes_count"
        side_effects:
          - "refund_cents = 0; Certificate.status returns to ISSUED"
          - "Sample.portions_retained -= 1"
      - from: FILED
        to: DISMISSED
        trigger: "POST /grain-inspection/appeals/{id}/dismiss"
        preconditions: []
        side_effects:
          - "refund_cents = floor(deposit_cents / 2) credited back; Certificate.status returns to ISSUED"
      - from: SAMPLE_ASSIGNED
        to: DISMISSED
        trigger: "POST /grain-inspection/appeals/{id}/dismiss"
        preconditions: []
        side_effects:
          - "refund_cents = floor(deposit_cents / 2) credited back; Sample.portions_retained -= 1"

  - entity: VesselWatch
    field: status
    initial_state: SCHEDULED
    terminal_states: [CLOSED, ABORTED]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /grain-inspection/vessel-watches/{id}/start"
        preconditions:
          - "now >= window_start_at and now < window_end_at"
          - "Inspector(supervisor_inspector_id).license_status == ACTIVE and SUPERVISION in endorsements"
        side_effects:
          - "started_at = now"
      - from: IN_PROGRESS
        to: CLOSED
        trigger: "POST /grain-inspection/vessel-watches/{id}/close"
        preconditions:
          - "holds_supervised == holds_declared"
        side_effects:
          - "closed_at = now; supervision_minutes computed; stowage_certified set from the request body"
          - "ServiceArea.open_watch_count -= 1"
      - from: SCHEDULED
        to: ABORTED
        trigger: "POST /grain-inspection/vessel-watches/{id}/abort, or the supervising inspector being suspended, expired or revoked (cross-entity cascade)"
        preconditions: []
        side_effects:
          - "ServiceArea.open_watch_count -= 1; the window is released for capacity purposes"
      - from: IN_PROGRESS
        to: ABORTED
        trigger: "POST /grain-inspection/vessel-watches/{id}/abort"
        preconditions: []
        side_effects:
          - "ServiceArea.open_watch_count -= 1"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - name: certificate_appeal_occ
    parent_entity: Certificate
    occ_field: expected_certificate_version
    write_endpoint: "POST /grain-inspection/appeals"
    error_id: ERR_CERTIFICATE_VERSION_CONFLICT
    required: true
    semantics: |
      Filing an appeal mutates the certificate (status ISSUED -> UNDER_APPEAL) and the applicant
      ledger, so the caller must echo the certificate version it read. If the certificate has been
      written since that read (for example a supersession that reversed the fee), the stale value
      is refused with 412 and no deposit is charged.
    contention_scenario: |
      Client reads Certificate at version 1, an administrator voids it via an equipment cascade
      (version becomes 2), then the client files an appeal with expected_certificate_version 1 →
      412 ERR_CERTIFICATE_VERSION_CONFLICT.

  - name: appeal_vote_occ
    parent_entity: Appeal
    occ_field: expected_appeal_version
    write_endpoint: "POST /grain-inspection/appeal-votes"
    error_id: ERR_APPEAL_VERSION_CONFLICT
    required: true
    semantics: |
      Each vote increments the appeal's aggregated vote counters, so every vote must carry the
      appeal version the panel member read. A panel member whose read predates another member's
      vote is refused with 412 and must re-read the tally before voting.
    contention_scenario: |
      Panel members A and B both read Appeal at version 2; A votes (version becomes 3); B submits
      with expected_appeal_version 2 → 412 ERR_APPEAL_VERSION_CONFLICT.

# =============================================================================
# §1.3 Calculation Rules
# =============================================================================
calculations:
  - name: grade_determination
    entity: GradingResult
    algorithm_type: threshold
    description: |
      Assign the numerical grade by walking the official factor table for the request's commodity
      from best to worst and taking the first grade whose every limit is satisfied. Each of the
      five observed factors is first rounded to 1 decimal with round_half_up; the comparison uses
      the rounded value only. limiting_factor is the FIRST factor, in the canonical order
      [TEST_WEIGHT, MOISTURE, DAMAGED_TOTAL, HEAT_DAMAGED, FOREIGN_MATERIAL], that failed the
      NEXT-BETTER grade's limits; it is NONE when the best grade in the table was assigned.
    input_set: "The five observed factors on the GradingResult plus InspectionRequest.commodity"
    formula: |
      rounded[f] = round_half_up(observed[f], 1) for each of the five factors
      for grade in table(commodity) ordered best -> worst:
          if rounded.test_weight >= grade.min_test_weight
             and rounded.moisture <= grade.max_moisture
             and rounded.damaged_total <= grade.max_damaged_total
             and rounded.heat_damaged <= grade.max_heat_damaged
             and rounded.foreign_material <= grade.max_foreign_material:
              assigned_grade = grade; break
      else:
          assigned_grade = SAMPLE_GRADE
      if assigned_grade is the best grade of table(commodity):
          limiting_factor = NONE
      else:
          better = the grade immediately better than assigned_grade (for SAMPLE_GRADE: the worst
                   numerical grade in the table)
          limiting_factor = first factor in canonical order that violates better's limit
    constants:
      commodity_tables:
        CORN:
          - { grade: US_NO_1, min_test_weight: 56.0, max_moisture: 14.0, max_damaged_total: 3.0, max_heat_damaged: 0.1, max_foreign_material: 2.0 }
          - { grade: US_NO_2, min_test_weight: 54.0, max_moisture: 15.0, max_damaged_total: 5.0, max_heat_damaged: 0.2, max_foreign_material: 3.0 }
          - { grade: US_NO_3, min_test_weight: 52.0, max_moisture: 17.5, max_damaged_total: 7.0, max_heat_damaged: 0.5, max_foreign_material: 4.0 }
          - { grade: US_NO_4, min_test_weight: 49.0, max_moisture: 20.0, max_damaged_total: 10.0, max_heat_damaged: 1.0, max_foreign_material: 5.0 }
          - { grade: US_NO_5, min_test_weight: 46.0, max_moisture: 23.0, max_damaged_total: 15.0, max_heat_damaged: 3.0, max_foreign_material: 7.0 }
        SOYBEANS:
          - { grade: US_NO_1, min_test_weight: 56.0, max_moisture: 13.0, max_damaged_total: 2.0, max_heat_damaged: 0.2, max_foreign_material: 1.0 }
          - { grade: US_NO_2, min_test_weight: 54.0, max_moisture: 14.0, max_damaged_total: 3.0, max_heat_damaged: 0.5, max_foreign_material: 2.0 }
          - { grade: US_NO_3, min_test_weight: 52.0, max_moisture: 16.0, max_damaged_total: 5.0, max_heat_damaged: 1.0, max_foreign_material: 3.0 }
          - { grade: US_NO_4, min_test_weight: 49.0, max_moisture: 18.0, max_damaged_total: 8.0, max_heat_damaged: 3.0, max_foreign_material: 5.0 }
      note: "SOYBEANS has no US_NO_5; a soybean lot failing US_NO_4 is SAMPLE_GRADE"
    precision: "factors rounded to 1 decimal, round_half_up, before any comparison"
    worked_examples:
      - "CORN (55.2, 14.04, 4.0, 0.15, 2.5) -> rounded (55.2, 14.0, 4.0, 0.2, 2.5) -> US_NO_2 / TEST_WEIGHT"
      - "CORN (56.0, 14.04, 2.0, 0.1, 1.5) -> US_NO_1 / NONE"
      - "CORN (56.0, 14.05, 2.0, 0.1, 1.5) -> rounded moisture 14.1 -> US_NO_2 / MOISTURE"
      - "CORN (53.9, 16.2, 6.4, 0.44, 3.9) -> US_NO_3 / TEST_WEIGHT"
      - "SOYBEANS (55.0, 12.95, 2.5, 0.3, 1.4) -> rounded moisture 13.0 -> US_NO_2 / TEST_WEIGHT"

  - name: official_net_weight
    entity: WeighingRecord
    algorithm_type: aggregation
    description: |
      Compute the net weight of the lot from the individual drafts, deducting dockage. Two
      variants exist and BOTH are stored: the official variant deducts dockage draft by draft
      (each deduction rounded to a whole pound), while the provisional variant deducts dockage
      once from the aggregate gross-net. rounding_variance_lbs exposes the divergence.
    input_set: "WeighingRecord.drafts (all items) and dockage_pct"
    variants:
      - name: per_draft_official
        applies_when: "Always; produces net_lbs, dockage_lbs and net_bushels — the values printed on the certificate"
        formula: |
          for each draft i: gross_net_i = gross_lbs_i - tare_lbs_i
                            dockage_i   = round_half_up(gross_net_i * dockage_pct / 100, 0)
                            net_i       = gross_net_i - dockage_i
          dockage_lbs = sum(dockage_i)
          net_lbs     = sum(net_i)
      - name: aggregate_provisional
        applies_when: "Always; produces provisional_net_lbs, used for the applicant's advance advice"
        formula: |
          gross_net_total   = sum(gross_lbs_i - tare_lbs_i)
          aggregate_dockage = round_half_up(gross_net_total * dockage_pct / 100, 0)
          provisional_net_lbs = gross_net_total - aggregate_dockage
    formula: |
      rounding_variance_lbs = provisional_net_lbs - net_lbs
      net_bushels = round_half_up(net_lbs / pounds_per_bushel[commodity], 2)
    constants:
      pounds_per_bushel: { CORN: 56, SOYBEANS: 60 }
    precision: "pound deductions rounded to whole pounds (round_half_up); net_bushels to 2 decimals"
    worked_examples:
      - "6 drafts with gross-nets 33700/33900/34100/34300/34500/34700 at dockage_pct 1.5 -> per-draft dockage 506+509+512+515+518+521 = 3081, net_lbs 202119; aggregate dockage on 205200 = 3078, provisional_net_lbs 202122; rounding_variance_lbs = 3; CORN net_bushels = 3609.27"

  - name: protein_moisture_basis_conversion
    entity: ProteinAnalysis
    algorithm_type: threshold
    description: |
      Convert the instrument's as-is protein reading to the official 13.0% moisture basis. The
      moisture used depends on context: when the request already has a FINAL GradingResult the
      OFFICIAL moisture (its rounded moisture_pct) governs, otherwise the instrument's own
      moisture reading is used. Recomputing later on the official basis restates the analysis.
    input_set: "ProteinAnalysis.protein_pct_as_is, instrument_moisture_pct, and the request's FINAL GradingResult.rounded_factors.moisture_pct when one exists"
    variants:
      - name: instrument_basis
        applies_when: "No FINAL GradingResult exists for the request at analysis creation time"
        formula: "basis_source = INSTRUMENT_MOISTURE; moisture_source_pct = instrument_moisture_pct"
      - name: official_basis
        applies_when: "A FINAL GradingResult exists for the request at analysis creation time, or POST /grain-inspection/protein-analyses/{id}/recompute is called"
        formula: "basis_source = OFFICIAL_MOISTURE; moisture_source_pct = FINAL GradingResult.rounded_factors.moisture_pct"
    formula: |
      protein_reported_pct  = round_half_up(protein_pct_as_is * (100 - 13.0) / (100 - moisture_source_pct), 2)
      basis_adjustment_pct  = round_half_up(protein_reported_pct - protein_pct_as_is, 2)
    constants:
      official_moisture_basis_pct: 13.0
    precision: "2 decimals, round_half_up"
    worked_examples:
      - "as_is 34.60 with instrument moisture 11.20 -> 34.60 * 87 / 88.80 = 33.90, adjustment -0.70"
      - "as_is 34.60 with official moisture 12.8 -> 34.60 * 87 / 87.2 = 34.52, adjustment -0.08"
      - "as_is 34.60 with moisture exactly 13.0 -> 34.60, adjustment 0.00 (identity boundary)"
      - "as_is 34.60 with official moisture 14.5 -> 35.21, adjustment 0.61"

  - name: fee_assessment
    entity: Certificate
    algorithm_type: tiered_pricing
    description: |
      Assess the certificate fee. The applicable fee classes are derived from certificate_type and
      the request's requested_services; each class contributes a flat base plus a per-thousand-
      bushel rate on the CEILING of certified_quantity_bushels/1000. An overtime surcharge (the
      MAXIMUM overtime_multiplier_bp among the applicable schedules) applies when the certificate
      is issued outside standard hours. A volume discount tier is then chosen from the
      pre-discount subtotal, the area's fee_multiplier_bp adjustment is applied to the discounted
      subtotal, and finally the MAXIMUM minimum_fee_cents among the applicable schedules floors
      the result. APPEAL_GRADE certificates are always free.
    input_set: |
      ACTIVE FeeSchedule rows for the request's service_area_id whose effective_from <= now and
      (effective_to is null or now < effective_to), restricted to the applicable service classes.
      DRAFT and SUPERSEDED schedules and schedules outside their window are excluded.
    formula: |
      applicable_classes:
        GRADE        -> {GRADING}
        WEIGHT       -> {WEIGHING}
        COMBINED     -> {GRADING, WEIGHING}
        EXPORT_CARGO -> {GRADING, WEIGHING, EXPORT_SUPERVISION}
        APPEAL_GRADE -> {}                       # fee_total_cents = 0, no schedule lookup
      plus PROTEIN when PROTEIN in InspectionRequest.requested_services and certificate_type != WEIGHT
      thousands       = ceil(certified_quantity_bushels / 1000)
      service_cents   = sum(base_fee_cents) + thousands * sum(per_thousand_bushel_rate_cents)
      overtime_cents  = round_half_up(service_cents * max(overtime_multiplier_bp) / 10000, 0) when overtime_applied else 0
      pre_discount    = service_cents + overtime_cents
      tier_bp         = 0    if pre_discount < 50000
                        500  if 50000 <= pre_discount < 150000
                        1000 if pre_discount >= 150000
      discount_cents  = floor(pre_discount * tier_bp / 10000)
      discounted      = pre_discount - discount_cents
      authority_adj   = round_half_up(discounted * (ServiceArea.fee_multiplier_bp - 10000) / 10000, 0)
      fee_total_cents = max(discounted + authority_adj, max(minimum_fee_cents))
    constants:
      standard_hours_utc: { start_inclusive: "07:00:00", end_exclusive: "17:00:00" }
      volume_tiers_bp: [{ min_pre_discount_cents: 0, bp: 0 }, { min_pre_discount_cents: 50000, bp: 500 }, { min_pre_discount_cents: 150000, bp: 1000 }]
    precision: "integer cents; discount uses floor, overtime and authority adjustment use round_half_up"
    worked_examples:
      - "DESIGNATED area (multiplier 11500), COMBINED, qty 3609.27 (thousands 4), standard hours: service 21000 + 4*4500 = 39000, tier 0, adj 5850 -> 44850"
      - "Same certificate issued at 19:00:00Z: overtime 9750 -> pre 48750, tier 0, adj 7313 -> 56063"
      - "DESIGNATED EXPORT_CARGO with PROTEIN, qty 3609.27: service 52000 + 4*6500 = 78000, tier 500 -> discount 3900, discounted 74100, adj 11115 -> 85215"
      - "DELEGATED GRADE, qty 20500 (thousands 21): pre 50000 hits the 500bp tier -> 47500; qty 20000 (thousands 20): pre 48000 stays at 0bp -> 48000 (more grain, lower fee)"
      - "DELEGATED WEIGHT, qty 500: pre 7000 floored by minimum_fee_cents 8000 -> 8000; qty 1500: pre 8000 equals the floor -> 8000"
      - "DESIGNATED EXPORT_CARGO without PROTEIN, qty 15600 (thousands 16): pre 150000 hits 1000bp -> 155250; qty 14500 (thousands 15): pre 143500 -> 156774"

  - name: payment_waterfall_allocation
    entity: Applicant
    algorithm_type: waterfall_allocation
    description: |
      A payment is allocated across the applicant's UNPAID certificates oldest first, filling each
      certificate to its full fee before moving to the next. Ordering is by (issued_at ASC,
      sequence_no ASC) so that certificates issued at the same logical instant remain
      deterministic. Any amount exceeding the total allocatable balance is refused outright — the
      payment is never partially applied.
    input_set: "Certificates of the applicant with fee_settlement_status == UNPAID and status IN {ISSUED, UNDER_APPEAL}; REVERSED, VOIDED and SUPERSEDED certificates are excluded"
    formula: |
      allocatable = sum(fee_total_cents - fee_paid_cents) over the input set
      if amount_cents > allocatable: reject with ERR_PAYMENT_EXCEEDS_ALLOCATABLE (no mutation)
      remaining = amount_cents
      for cert in input set ordered by (issued_at ASC, sequence_no ASC):
          take = min(remaining, cert.fee_total_cents - cert.fee_paid_cents)
          cert.fee_paid_cents += take
          if cert.fee_paid_cents == cert.fee_total_cents: cert.fee_settlement_status = PAID
          remaining -= take
          if remaining == 0: break
      Applicant.credits_total_cents += amount_cents
    constants: {}
    precision: "integer cents; no rounding"
    worked_examples:
      - "Certificates seq 1 (fee 8000) and seq 2 (fee 47500) issued at the same instant; payment 20000 -> seq 1 PAID at 8000, seq 2 fee_paid 12000 and still UNPAID, open_balance_cents 35500"
      - "Payment of 55501 against an allocatable 55500 -> ERR_PAYMENT_EXCEEDS_ALLOCATABLE and both certificates untouched"

  - name: applicant_balance_ledger
    entity: Applicant
    algorithm_type: aggregation
    description: |
      The applicant balance is a conserved two-sided ledger. Every fee assessment and appeal
      deposit is a charge; every payment, fee reversal and deposit refund is a credit. No event
      ever edits a previous event, so open_balance_cents must always equal the difference of the
      two running totals — the compensating invariant the appeal cascade must preserve.
    input_set: "All charge and credit events recorded for the applicant"
    formula: |
      charges_total_cents = sum(Certificate.fee_total_cents assessed) + sum(Appeal.deposit_cents charged)
      credits_total_cents = sum(payments) + sum(fee_total_cents of REVERSED certificates) + sum(Appeal.refund_cents)
      open_balance_cents  = charges_total_cents - credits_total_cents
    constants: {}
    precision: "integer cents"
    worked_examples:
      - "COMBINED certificate 44850 + appeal deposit 25000 = charges 69850; appeal DECIDED_REVISED refunds 25000 and reverses 44850 = credits 69850; open_balance_cents 0 (the free APPEAL_GRADE certificate adds nothing)"

  - name: inspector_performance_score
    entity: Inspector
    algorithm_type: weighted_scoring
    description: |
      A weighted deduction score monitoring inspector performance. Appeal reversals weigh most,
      then proficiency check deviations, then late certificates; completed training adds a capped
      credit. The score gates licence activation (>= 80) and triggers automatic suspension of an
      ACTIVE inspector as soon as it drops below 70.
    input_set: "The inspector's appeal_reversal_count, check_sample_deviation_count, late_certificate_count and training_hours_completed"
    formula: |
      raw = 100
            - 18 * appeal_reversal_count
            - 10 * check_sample_deviation_count
            -  3 * late_certificate_count
            + min(12, floor(training_hours_completed / 10))
      performance_score = max(0, min(100, raw))
      recomputed after every appeal decision, comparison check, certificate issuance and training record
      auto-suspension fires only when license_status == ACTIVE and performance_score < 70 (strict)
    constants:
      appeal_reversal_weight: 18
      check_deviation_weight: 10
      late_certificate_weight: 3
      training_credit_cap: 12
      training_hours_per_credit: 10
      activation_minimum_score: 80
      auto_suspend_below: 70
      late_certificate_threshold_hours: 48
      deviation_counting_threshold_pct: 0.25
    precision: "integer score, clamped to 0..100; training credit uses floor"
    worked_examples:
      - "0 reversals, 3 deviations, 0 late, 0 training -> 70, exactly at the boundary: no auto-suspension"
      - "0 reversals, 4 deviations -> 60 -> auto-suspension"
      - "0 reversals, 2 deviations, 40 training hours -> 100 - 20 + 4 = 84 (ACTIVE, unaffected)"
      - "1 reversal added to that inspector -> 100 - 18 - 20 + 4 = 66 -> auto-suspension"
      - "PROBATIONARY inspector with 24 training hours and no penalties -> 100 (credit capped by the 100 ceiling) -> activation allowed"

  - name: instrument_comparison_bias
    entity: Equipment
    algorithm_type: aggregation
    description: |
      A protein instrument's comparison programme. Every check compares the instrument reading to
      an official reference value; the signed deviation is stored and the rolling mean of the last
      three deviations is the instrument's bias. A single large deviation or an excessive rolling
      bias throws the instrument out of tolerance; a moderate bias only puts it on drift watch,
      where it remains usable. Three consecutive out-of-tolerance resolutions withdraw the
      instrument permanently. The inspector's deviation counter uses a DIFFERENT, tighter
      threshold, so an inspector can accumulate deviations on an instrument that stays usable.
    input_set: "Equipment.recent_deviations_pct — the last three comparison-check deviations for this instrument in ascending (created_at, id-free sequence) order"
    formula: |
      deviation_pct     = round_half_up(instrument_reading_pct - reference_value_pct, 2)
      recent_deviations = last 3 deviations including this one
      rolling_bias_pct  = round_half_up(mean(recent_deviations), 2)
      resolution:
        OUT_OF_TOLERANCE if abs(deviation_pct) > 0.50 or abs(rolling_bias_pct) > 0.30
        DRIFT_WATCH      elif abs(rolling_bias_pct) > 0.15
        APPROVED         otherwise
      consecutive_out_of_tolerance_checks += 1 on OUT_OF_TOLERANCE, reset to 0 otherwise
      WITHDRAWN when consecutive_out_of_tolerance_checks reaches 3
      Inspector.check_sample_deviation_count += 1 when abs(deviation_pct) > 0.25
    constants:
      single_check_tolerance_pct: 0.50
      rolling_bias_out_of_tolerance_pct: 0.30
      rolling_bias_drift_watch_pct: 0.15
      rolling_window_size: 3
      withdrawal_consecutive_failures: 3
    precision: "2 decimals, round_half_up"
    worked_examples:
      - "Deviations 0.30 -> rolling 0.30 -> DRIFT_WATCH (0.30 is not > 0.30); then 0.10 -> rolling 0.20 -> DRIFT_WATCH; then 0.05 -> rolling 0.15 -> APPROVED (recovery)"
      - "Deviations 0.40, 0.35, 0.30 -> rolling 0.35 > 0.30 -> OUT_OF_TOLERANCE"
      - "A single deviation of 0.65 -> OUT_OF_TOLERANCE regardless of the rolling mean; three such checks in a row -> WITHDRAWN"
      - "A deviation of 0.30 counts against the inspector (> 0.25) while leaving the instrument usable on DRIFT_WATCH"

  - name: appeal_panel_tally
    entity: Appeal
    algorithm_type: threshold
    description: |
      Appeal decisions require a full panel of effective votes and a strict majority to revise.
      Abstentions count toward neither side and are excluded from the denominator, so an abstaining
      member does not satisfy the quorum requirement.
    input_set: "AppealVote rows on the appeal"
    formula: |
      required_panel_size    = 1 (REINSPECTION) | 3 (APPEAL) | 5 (BOARD_APPEAL)
      effective_votes_count  = revise_votes_count + uphold_votes_count
      decision refused with ERR_APPEAL_QUORUM_NOT_MET while effective_votes_count < required_panel_size
      outcome = DECIDED_REVISED when revise_votes_count * 2 > effective_votes_count
                and the regrade's assigned_grade != the challenged certificate's grade_snapshot
              = DECIDED_UPHELD otherwise
    constants:
      panel_sizes: { REINSPECTION: 1, APPEAL: 3, BOARD_APPEAL: 5 }
      filing_windows_days: { REINSPECTION: 5, APPEAL: 10, BOARD_APPEAL: 20 }
    precision: "integer counts"
    worked_examples:
      - "APPEAL with 2 REVISE, 1 UPHOLD, 1 ABSTAIN -> effective 3 >= 3, 2*2 = 4 > 3 -> DECIDED_REVISED"
      - "APPEAL with 2 REVISE, 1 ABSTAIN -> effective 2 < 3 -> ERR_APPEAL_QUORUM_NOT_MET"
      - "APPEAL with 1 REVISE, 2 UPHOLD -> effective 3, 1*2 = 2 <= 3 -> DECIDED_UPHELD"

# =============================================================================
# §1.4 Validation Rules (evaluated in ascending priority; first violation wins)
# =============================================================================
validations:
  - priority: 1
    category: auth
    rule: "Every request must carry an X-User-Id header naming a known user"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all endpoints"
  - priority: 2
    category: authz
    rule: "The caller's role must be listed in the endpoint's roles"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all endpoints"
  - priority: 3
    category: path_existence
    rule: "Every {id} path parameter must resolve to an existing row of that collection"
    error_id: "ERR_<ENTITY>_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path parameters"
  - priority: 4
    category: ownership
    rule: "An ApplicantUser may only read or act on rows belonging to their own applicant account (inspection requests, certificates, appeals, payments)"
    error_id: ERR_APPLICANT_SCOPE_VIOLATION
    http_status: 403
    applies_to: "all ApplicantUser-accessible endpoints"
  - priority: 5
    category: schema
    rule: "Body fields must be present, correctly typed, within declared ranges and enum domains; unknown fields are rejected"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "all write endpoints"
  - priority: 6
    category: body_existence
    rule: "Every FK named in the body must resolve to an existing row"
    error_id: "ERR_<ENTITY>_NOT_FOUND"
    http_status: 404
    applies_to: "all write endpoints carrying FK fields"

  - priority: 7
    category: business_referential
    rule: "Sample.inspection_request_id of a sample used by a grading result, protein analysis or appeal assignment must equal the target request; a sample from another request is refused"
    error_id: ERR_SAMPLE_REQUEST_MISMATCH
    http_status: 422
    applies_to: "POST /grain-inspection/grading-results, POST /grain-inspection/protein-analyses, POST /grain-inspection/appeals/{id}/assign-sample"
  - priority: 7
    category: business_referential
    rule: "Equipment.service_area_id and Inspector.service_area_id must equal the request's service_area_id"
    error_id: ERR_SERVICE_AREA_MISMATCH
    http_status: 422
    applies_to: "POST /grain-inspection/samples, POST /grain-inspection/weighing-records, POST /grain-inspection/protein-analyses, POST /grain-inspection/certificates"
  - priority: 7
    category: business_referential
    rule: "Equipment.equipment_kind must match the role it is used in: SAMPLING_DEVICE for samples, SCALE for weighing records, PROTEIN_INSTRUMENT for protein analyses and comparison checks"
    error_id: ERR_EQUIPMENT_KIND_MISMATCH
    http_status: 422
    applies_to: "POST /grain-inspection/samples, POST /grain-inspection/weighing-records, POST /grain-inspection/protein-analyses, POST /grain-inspection/comparison-checks"
  - priority: 7
    category: business_referential
    rule: "capacity_lbs and tolerance_lbs are required when equipment_kind == SCALE and must be omitted for the other kinds; test_error_lbs is required when certifying a SCALE and must be omitted otherwise"
    error_id: ERR_EQUIPMENT_FIELD_APPLICABILITY
    http_status: 422
    applies_to: "POST /grain-inspection/equipment, POST /grain-inspection/equipment/{id}/certify"
  - priority: 7
    category: business_referential
    rule: "A grading result carrying appeal_id must name an Appeal in state SAMPLE_ASSIGNED whose certificate belongs to the same inspection request, and its sample_id must equal Appeal.assigned_sample_id"
    error_id: ERR_APPEAL_REGRADE_BINDING_INVALID
    http_status: 422
    applies_to: "POST /grain-inspection/grading-results"
  - priority: 7
    category: business_referential
    rule: "requested_services must contain GRADING; WEIGHING is required for weighing records; PROTEIN is required for protein analyses; EXPORT_SUPERVISION is required for vessel watches and EXPORT_CARGO certificates"
    error_id: ERR_SERVICE_NOT_REQUESTED
    http_status: 422
    applies_to: "POST /grain-inspection/inspection-requests, POST /grain-inspection/weighing-records, POST /grain-inspection/protein-analyses, POST /grain-inspection/vessel-watches, POST /grain-inspection/certificates"

  - priority: 8
    category: concurrency
    rule: "expected_certificate_version must equal the certificate's current version when filing an appeal"
    error_id: ERR_CERTIFICATE_VERSION_CONFLICT
    http_status: 412
    applies_to: "POST /grain-inspection/appeals"
  - priority: 8
    category: concurrency
    rule: "expected_appeal_version must equal the appeal's current version when casting a vote"
    error_id: ERR_APPEAL_VERSION_CONFLICT
    http_status: 412
    applies_to: "POST /grain-inspection/appeal-votes"

  - priority: 9
    category: state
    rule: "ServiceArea.status must be ACTIVE to create inspection requests, samples, weighing records, analyses, certificates or vessel watches in that area"
    error_id: ERR_SERVICE_AREA_SUSPENDED
    http_status: 409
    applies_to: "all service-producing write endpoints"
  - priority: 9
    category: state
    rule: "Equipment.approval_status must be APPROVED (or DRIFT_WATCH for protein analyses) and certified_until must be in the future for the equipment to be used"
    error_id: ERR_EQUIPMENT_NOT_APPROVED
    http_status: 409
    applies_to: "POST /grain-inspection/samples, POST /grain-inspection/weighing-records, POST /grain-inspection/protein-analyses"
  - priority: 9
    category: state
    rule: "A WITHDRAWN equipment row accepts no certification and no comparison check; a PENDING_APPROVAL or EXPIRED instrument accepts no comparison check"
    error_id: ERR_EQUIPMENT_WITHDRAWN
    http_status: 409
    applies_to: "POST /grain-inspection/equipment/{id}/certify, POST /grain-inspection/comparison-checks"
  - priority: 9
    category: state
    rule: "Inspector.license_status must be PROBATIONARY or ACTIVE to sample, grade, analyse or weigh, and ACTIVE to supervise a weighing, hold a vessel watch, regrade an appeal or cast a panel vote"
    error_id: ERR_INSPECTOR_LICENSE_INVALID
    http_status: 409
    applies_to: "all inspector-naming write endpoints"
  - priority: 9
    category: state
    rule: "Sample.integrity_status must not be BROKEN or EXPIRED for the sample to be graded, analysed or assigned to an appeal"
    error_id: ERR_SAMPLE_INTEGRITY_BROKEN
    http_status: 409
    applies_to: "POST /grain-inspection/grading-results, POST /grain-inspection/protein-analyses, POST /grain-inspection/appeals/{id}/assign-sample"
  - priority: 9
    category: state
    rule: "The entity must be in a state from which the requested transition is declared in §1.2"
    error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 9
    category: state
    rule: "Appeal decisions require status UNDER_REVIEW; dismissal requires FILED or SAMPLE_ASSIGNED; sample assignment requires FILED"
    error_id: ERR_APPEAL_STATE_INVALID
    http_status: 409
    applies_to: "POST /grain-inspection/appeals/{id}/decide, POST /grain-inspection/appeals/{id}/dismiss, POST /grain-inspection/appeals/{id}/assign-sample"
  - priority: 9
    category: state
    rule: "A certificate under appeal cannot be superseded, re-certified or used as the basis of a further appeal"
    error_id: ERR_CERTIFICATE_UNDER_APPEAL
    http_status: 409
    applies_to: "POST /grain-inspection/appeals, POST /grain-inspection/certificates"
  - priority: 9
    category: state
    rule: "A WEIGHT, COMBINED or EXPORT_CARGO certificate requires an operative WeighingRecord: SUPERVISED when ServiceArea.supervision_required is true, otherwise WEIGHED or SUPERVISED"
    error_id: ERR_WEIGHING_SUPERVISION_REQUIRED
    http_status: 409
    applies_to: "POST /grain-inspection/certificates"
  - priority: 9
    category: state
    rule: "An EXPORT_CARGO certificate requires a CLOSED VesselWatch with stowage_certified true on the request"
    error_id: ERR_VESSEL_WATCH_NOT_CLOSED
    http_status: 409
    applies_to: "POST /grain-inspection/certificates"
  - priority: 9
    category: state
    rule: "A GRADE, COMBINED, EXPORT_CARGO or APPEAL_GRADE certificate requires a FINAL GradingResult on the request"
    error_id: ERR_GRADING_RESULT_MISSING
    http_status: 409
    applies_to: "POST /grain-inspection/certificates"

  - priority: 10
    category: business_safety
    rule: "The inspector who produced the challenged FINAL GradingResult may not perform the appeal regrade nor cast a vote on that appeal"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 422
    applies_to: "POST /grain-inspection/grading-results, POST /grain-inspection/appeal-votes"
  - priority: 10
    category: business_safety
    rule: "The supervising inspector countersigning a weighing must differ from the weigher"
    error_id: ERR_SELF_SUPERVISION_FORBIDDEN
    http_status: 422
    applies_to: "POST /grain-inspection/weighing-records/{id}/supervise"
  - priority: 10
    category: business_safety
    rule: "A SupervisingInspector may not file a comparison check naming themselves as the checked inspector"
    error_id: ERR_SELF_CHECK_FORBIDDEN
    http_status: 422
    applies_to: "POST /grain-inspection/comparison-checks"
  - priority: 10
    category: business_safety
    rule: "An inspector may cast at most one vote per appeal"
    error_id: ERR_DUPLICATE_PANEL_VOTE
    http_status: 422
    applies_to: "POST /grain-inspection/appeal-votes"
  - priority: 10
    category: business_safety
    rule: "The issuing inspector of a certificate must hold every endorsement the certificate's services require (GRADING for grade content, WEIGHING for weight content, SUPERVISION for EXPORT_CARGO)"
    error_id: ERR_ENDORSEMENT_MISSING
    http_status: 422
    applies_to: "POST /grain-inspection/certificates, POST /grain-inspection/samples, POST /grain-inspection/grading-results, POST /grain-inspection/protein-analyses, POST /grain-inspection/weighing-records"
  - priority: 10
    category: business_safety
    rule: "An EXPORT_CARGO certificate for a foreign buyer may only be issued in a service area whose authority_type is DESIGNATED"
    error_id: ERR_EXPORT_REQUIRES_DESIGNATED_AREA
    http_status: 422
    applies_to: "POST /grain-inspection/certificates"

  - priority: 11
    category: business_constraint
    rule: "Sample.portions_available must be >= 1 to create a grading result, protein analysis or appeal sample assignment"
    error_id: ERR_SAMPLE_PORTIONS_EXHAUSTED
    http_status: 422
    applies_to: "POST /grain-inspection/grading-results, POST /grain-inspection/protein-analyses, POST /grain-inspection/appeals/{id}/assign-sample"
  - priority: 11
    category: business_constraint
    rule: "At most one FINAL GradingResult with appeal_id null may exist per inspection request; at most one WeighingRecord in WEIGHED or SUPERVISED per request; at most one non-terminal Appeal per certificate"
    error_id: ERR_DUPLICATE_OPERATIVE_RECORD
    http_status: 422
    applies_to: "POST /grain-inspection/grading-results, POST /grain-inspection/weighing-records, POST /grain-inspection/appeals"
  - priority: 11
    category: business_constraint
    rule: "seal_number must be unique within the inspection request; account_code globally unique; license_number unique within the service area; asset_code unique within the service area"
    error_id: ERR_DUPLICATE_IDENTIFIER
    http_status: 422
    applies_to: "POST /grain-inspection/samples, POST /grain-inspection/applicants, POST /grain-inspection/inspectors, POST /grain-inspection/equipment"
  - priority: 11
    category: business_constraint
    rule: "The sum of gross_lbs over all drafts must not exceed the scale's capacity_lbs, and every draft must satisfy gross_lbs > tare_lbs"
    error_id: ERR_SCALE_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /grain-inspection/weighing-records"
  - priority: 11
    category: business_constraint
    rule: "heat_damaged_pct must not exceed damaged_total_pct"
    error_id: ERR_FACTOR_SET_INCONSISTENT
    http_status: 422
    applies_to: "POST /grain-inspection/grading-results"
  - priority: 11
    category: business_constraint
    rule: "Inspector activation requires training_hours_completed >= 24 and performance_score >= 80; reinstatement requires performance_score >= 80"
    error_id: ERR_INSPECTOR_NOT_QUALIFIED
    http_status: 422
    applies_to: "POST /grain-inspection/inspectors/{id}/activate, POST /grain-inspection/inspectors/{id}/reinstate"
  - priority: 11
    category: business_constraint
    rule: "An appeal decision requires effective_votes_count >= required_panel_size (abstentions excluded)"
    error_id: ERR_APPEAL_QUORUM_NOT_MET
    http_status: 422
    applies_to: "POST /grain-inspection/appeals/{id}/decide"
  - priority: 11
    category: business_constraint
    rule: "A BOARD_APPEAL panel member must belong to a service area other than the challenged certificate's area"
    error_id: ERR_BOARD_PANEL_COMPOSITION_INVALID
    http_status: 422
    applies_to: "POST /grain-inspection/appeal-votes"
  - priority: 11
    category: business_constraint
    rule: "Closing a vessel watch requires holds_supervised == holds_declared"
    error_id: ERR_HOLDS_NOT_FULLY_SUPERVISED
    http_status: 422
    applies_to: "POST /grain-inspection/vessel-watches/{id}/close"

  - priority: 12
    category: business_temporal
    rule: "A REINSPECTION must be filed at or before Certificate.reinspection_deadline_at; an APPEAL at or before appeal_deadline_at; a BOARD_APPEAL within 20 days of the prior APPEAL's decided_at"
    error_id: ERR_APPEAL_WINDOW_EXPIRED
    http_status: 422
    applies_to: "POST /grain-inspection/appeals"
  - priority: 12
    category: business_temporal
    rule: "A BOARD_APPEAL requires a prior APPEAL on the same certificate decided DECIDED_UPHELD"
    error_id: ERR_APPEAL_ESCALATION_INVALID
    http_status: 422
    applies_to: "POST /grain-inspection/appeals"
  - priority: 12
    category: business_temporal
    rule: "window_end_at must be strictly after window_start_at, and a watch may only be started when window_start_at <= now < window_end_at"
    error_id: ERR_WATCH_WINDOW_INVALID
    http_status: 422
    applies_to: "POST /grain-inspection/vessel-watches, POST /grain-inspection/vessel-watches/{id}/start"
  - priority: 12
    category: business_temporal
    rule: "A supervising inspector's non-terminal watch windows, each extended by a 45-minute travel buffer at both ends, may not overlap (half-open comparison: conflict iff new.start < existing.end + 45min and existing.start < new.end + 45min)"
    error_id: ERR_INSPECTOR_WATCH_OVERLAP
    http_status: 422
    applies_to: "POST /grain-inspection/vessel-watches"
  - priority: 12
    category: business_temporal
    rule: "The number of non-terminal watches in the area whose CLOSED windows intersect the new window (touching endpoints count as intersecting) must be below ServiceArea.concurrent_watch_capacity"
    error_id: ERR_AREA_WATCH_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /grain-inspection/vessel-watches"
  - priority: 12
    category: business_temporal
    rule: "FeeSchedule.effective_to must be strictly after effective_from, and activating a schedule whose window overlaps another ACTIVE schedule for the same (service_area_id, service_class) is refused"
    error_id: ERR_FEE_SCHEDULE_WINDOW_CONFLICT
    http_status: 422
    applies_to: "POST /grain-inspection/fee-schedules, POST /grain-inspection/fee-schedules/{id}/activate"
  - priority: 12
    category: business_temporal
    rule: "license_expires_at and certified_until supplied on activation or certification must be strictly in the future relative to the logical clock"
    error_id: ERR_EXPIRY_IN_PAST
    http_status: 422
    applies_to: "POST /grain-inspection/inspectors/{id}/activate, POST /grain-inspection/equipment/{id}/certify"

  - priority: 13
    category: business_fiscal
    rule: "Certificate issuance requires an ACTIVE FeeSchedule covering the logical clock instant for every applicable service class"
    error_id: ERR_NO_ACTIVE_FEE_SCHEDULE
    http_status: 422
    applies_to: "POST /grain-inspection/certificates, POST /grain-inspection/appeals"
  - priority: 13
    category: business_fiscal
    rule: "After the fee is computed, Applicant.open_balance_cents + fee_total_cents must not exceed Applicant.credit_limit_cents"
    error_id: ERR_CREDIT_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /grain-inspection/certificates"
  - priority: 13
    category: business_fiscal
    rule: "A payment must be positive and must not exceed the applicant's total allocatable open certificate balance"
    error_id: ERR_PAYMENT_EXCEEDS_ALLOCATABLE
    http_status: 422
    applies_to: "POST /grain-inspection/applicants/{id}/payments"

  - priority: 9
    category: state
    rule: "Only a DRAFT fee schedule may be activated"
    error_id: ERR_FEE_SCHEDULE_NOT_DRAFT
    http_status: 409
    applies_to: "POST /grain-inspection/fee-schedules/{id}/activate"
  - priority: 11
    category: business_constraint
    rule: "An analysis may only be recomputed when a FINAL GradingResult exists on the request, its status is ACCEPTED, and its basis_source is still INSTRUMENT_MOISTURE"
    error_id: ERR_ANALYSIS_RECOMPUTE_NOT_APPLICABLE
    http_status: 422
    applies_to: "POST /grain-inspection/protein-analyses/{id}/recompute"
  - priority: 12
    category: business_temporal
    rule: "The logical clock may only move forward or stay equal; a strictly earlier current_utc is refused"
    error_id: ERR_CLOCK_NOT_MONOTONIC
    http_status: 422
    applies_to: "POST /_clock/set_current_utc"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  - method: POST
    path: /_clock/set_current_utc
    purpose: "Set the logical clock. Startup default is 2026-08-01T00:00:00Z. Advancing the clock runs the expiry sweep: equipment past certified_until -> EXPIRED, samples past file_retention_until -> EXPIRED, inspectors past license_expires_at -> EXPIRED with their SCHEDULED watches ABORTED."
    input: [current_utc]
    output: { current_utc: string, expired_equipment_count: integer, expired_sample_count: integer, expired_inspector_count: integer }
    roles: [ServiceAdmin, SupervisingInspector, LicensedInspector, ApplicantUser, Auditor]
    side_effects: ["Deterministic expiry sweep in ascending (created_at, sequence_no) order"]

  - method: POST
    path: /grain-inspection/service-areas
    purpose: "Register a delegated or designated service area"
    input: [name, state_code, authority_type, "status?", "fee_multiplier_bp?", "supervision_required?", "concurrent_watch_capacity?"]
    output: ServiceArea
    roles: [ServiceAdmin]
    side_effects: []
  - method: GET
    path: /grain-inspection/service-areas
    purpose: "List service areas"
    input: ["state_code?", "authority_type?", "status?", "limit?", "offset?"]
    output: ServiceArea[]
    roles: [ServiceAdmin, SupervisingInspector, LicensedInspector, ApplicantUser, Auditor]
    side_effects: []
  - method: GET
    path: /grain-inspection/service-areas/{id}
    purpose: "Read one service area"
    input: []
    output: ServiceArea
    roles: [ServiceAdmin, SupervisingInspector, LicensedInspector, ApplicantUser, Auditor]
    side_effects: []
  - method: PATCH
    path: /grain-inspection/service-areas/{id}
    purpose: "Update area configuration (suspend, retune fee multiplier, supervision requirement, watch capacity)"
    input: ["status?", "fee_multiplier_bp?", "supervision_required?", "concurrent_watch_capacity?"]
    output: ServiceArea
    roles: [ServiceAdmin]
    side_effects: ["Suspending an area blocks new service intake but leaves existing rows untouched"]

  - method: POST
    path: /grain-inspection/fee-schedules
    purpose: "Draft a fee schedule for a service class"
    input: [service_area_id, service_class, base_fee_cents, "per_thousand_bushel_rate_cents?", "overtime_multiplier_bp?", "minimum_fee_cents?", effective_from, "effective_to?"]
    output: FeeSchedule
    roles: [ServiceAdmin]
    side_effects: []
  - method: POST
    path: /grain-inspection/fee-schedules/{id}/activate
    purpose: "Activate a DRAFT schedule"
    input: []
    output: FeeSchedule
    roles: [ServiceAdmin]
    side_effects: ["Any previously ACTIVE schedule for the same (service_area_id, service_class) whose window has ended is marked SUPERSEDED"]
  - method: GET
    path: /grain-inspection/fee-schedules
    purpose: "List fee schedules"
    input: ["service_area_id?", "service_class?", "status?", "limit?", "offset?"]
    output: FeeSchedule[]
    roles: [ServiceAdmin, SupervisingInspector, LicensedInspector, ApplicantUser, Auditor]
    side_effects: []
  - method: GET
    path: /grain-inspection/fee-schedules/{id}
    purpose: "Read one fee schedule"
    input: []
    output: FeeSchedule
    roles: [ServiceAdmin, SupervisingInspector, LicensedInspector, ApplicantUser, Auditor]
    side_effects: []

  - method: POST
    path: /grain-inspection/applicants
    purpose: "Register an applicant account"
    input: [name, account_code, contact_email, "credit_limit_cents?"]
    output: Applicant
    roles: [ServiceAdmin]
    side_effects: []
  - method: GET
    path: /grain-inspection/applicants
    purpose: "List applicants"
    input: ["account_code?", "limit?", "offset?"]
    output: Applicant[]
    roles: [ServiceAdmin, SupervisingInspector, Auditor]
    side_effects: []
  - method: GET
    path: /grain-inspection/applicants/{id}
    purpose: "Read one applicant including the ledger totals"
    input: []
    output: Applicant
    roles: [ServiceAdmin, SupervisingInspector, ApplicantUser, Auditor]
    side_effects: []
  - method: POST
    path: /grain-inspection/applicants/{id}/payments
    purpose: "Record a payment and allocate it across UNPAID certificates oldest first"
    input: [amount_cents]
    output: Applicant
    roles: [ServiceAdmin, ApplicantUser]
    side_effects: ["Waterfall allocation across UNPAID certificates", "credits_total_cents and open_balance_cents updated", "Fully allocated certificates become PAID"]

  - method: POST
    path: /grain-inspection/inspectors
    purpose: "Licence an inspector in a service area"
    input: [service_area_id, license_number, full_name, endorsements, license_expires_at]
    output: Inspector
    roles: [ServiceAdmin]
    side_effects: ["performance_score initialised to 100, license_status PROBATIONARY"]
  - method: GET
    path: /grain-inspection/inspectors
    purpose: "List inspectors"
    input: ["service_area_id?", "license_status?", "limit?", "offset?"]
    output: Inspector[]
    roles: [ServiceAdmin, SupervisingInspector, LicensedInspector, Auditor]
    side_effects: []
  - method: GET
    path: /grain-inspection/inspectors/{id}
    purpose: "Read one inspector including performance counters"
    input: []
    output: Inspector
    roles: [ServiceAdmin, SupervisingInspector, LicensedInspector, Auditor]
    side_effects: []
  - method: POST
    path: /grain-inspection/inspectors/{id}/activate
    purpose: "Move a PROBATIONARY licence to ACTIVE"
    input: []
    output: Inspector
    roles: [ServiceAdmin]
    side_effects: []
  - method: POST
    path: /grain-inspection/inspectors/{id}/suspend
    purpose: "Suspend a licence manually"
    input: [suspension_reason]
    output: Inspector
    roles: [ServiceAdmin]
    side_effects: ["SCHEDULED and IN_PROGRESS watches held by the inspector are ABORTED and area open_watch_count decremented"]
  - method: POST
    path: /grain-inspection/inspectors/{id}/reinstate
    purpose: "Return a SUSPENDED licence to ACTIVE"
    input: []
    output: Inspector
    roles: [ServiceAdmin]
    side_effects: ["suspension_reason cleared"]
  - method: POST
    path: /grain-inspection/inspectors/{id}/revoke
    purpose: "Permanently revoke a SUSPENDED licence"
    input: [suspension_reason]
    output: Inspector
    roles: [ServiceAdmin]
    side_effects: []
  - method: POST
    path: /grain-inspection/inspectors/{id}/training-records
    purpose: "File completed training hours for an inspector"
    input: [course_code, hours]
    output: Inspector
    roles: [ServiceAdmin, SupervisingInspector]
    side_effects: ["training_hours_completed increased and performance_score recomputed"]

  - method: POST
    path: /grain-inspection/equipment
    purpose: "Register a sampling device, scale or protein instrument"
    input: [service_area_id, equipment_kind, asset_code, model, "capacity_lbs?", "tolerance_lbs?"]
    output: Equipment
    roles: [ServiceAdmin]
    side_effects: []
  - method: GET
    path: /grain-inspection/equipment
    purpose: "List equipment"
    input: ["service_area_id?", "equipment_kind?", "approval_status?", "limit?", "offset?"]
    output: Equipment[]
    roles: [ServiceAdmin, SupervisingInspector, LicensedInspector, Auditor]
    side_effects: []
  - method: GET
    path: /grain-inspection/equipment/{id}
    purpose: "Read one equipment row including calibration counters"
    input: []
    output: Equipment
    roles: [ServiceAdmin, SupervisingInspector, LicensedInspector, Auditor]
    side_effects: []
  - method: POST
    path: /grain-inspection/equipment/{id}/certify
    purpose: "Record an approval, certification or recalibration test"
    input: [certified_until, "test_error_lbs?"]
    output: Equipment
    roles: [ServiceAdmin]
    side_effects: ["APPROVED on pass; comparison counters reset", "For a SCALE failing tolerance: dependent WeighingRecords VOIDED, dependent Certificates VOIDED with fee reversal, requests reverted to weighing_status PENDING"]
  - method: POST
    path: /grain-inspection/comparison-checks
    purpose: "File a protein instrument comparison (check sample) result against an inspector"
    input: [instrument_id, inspector_id, reference_value_pct, instrument_reading_pct]
    output: Equipment
    roles: [ServiceAdmin, SupervisingInspector]
    side_effects: ["deviation_pct, recent_deviations_pct, rolling_bias_pct and counters updated", "Instrument resolves to APPROVED, DRIFT_WATCH, OUT_OF_TOLERANCE or WITHDRAWN", "On OUT_OF_TOLERANCE: dependent analyses REJECTED_CALIBRATION, sample portions released, dependent certificates VOIDED with fee reversal", "Inspector.check_sample_deviation_count and performance_score updated, possibly auto-suspending"]

  - method: POST
    path: /grain-inspection/inspection-requests
    purpose: "Order inspection, weighing, protein and export supervision services for a lot"
    input: [applicant_id, service_area_id, commodity, point_of_service, lot_identifier, declared_quantity_bushels, requested_services]
    output: InspectionRequest
    roles: [ServiceAdmin, ApplicantUser]
    side_effects: ["grading_status OPEN; weighing_status PENDING when WEIGHING was requested, otherwise NOT_REQUIRED", "certified_quantity_bushels initialised from declared_quantity_bushels"]
  - method: GET
    path: /grain-inspection/inspection-requests
    purpose: "List inspection requests"
    input: ["applicant_id?", "service_area_id?", "commodity?", "grading_status?", "weighing_status?", "limit?", "offset?"]
    output: InspectionRequest[]
    roles: [ServiceAdmin, SupervisingInspector, LicensedInspector, ApplicantUser, Auditor]
    side_effects: []
  - method: GET
    path: /grain-inspection/inspection-requests/{id}
    purpose: "Read one inspection request with both status dimensions"
    input: []
    output: InspectionRequest
    roles: [ServiceAdmin, SupervisingInspector, LicensedInspector, ApplicantUser, Auditor]
    side_effects: []
  - method: GET
    path: /grain-inspection/inspection-requests/{id}/certificates
    purpose: "List the certificates issued on a request"
    input: ["certificate_type?", "status?", "limit?", "offset?"]
    output: Certificate[]
    roles: [ServiceAdmin, SupervisingInspector, LicensedInspector, ApplicantUser, Auditor]
    side_effects: []

  - method: POST
    path: /grain-inspection/samples
    purpose: "Draw and seal an official sample at the point of loading or unloading"
    input: [inspection_request_id, sampling_device_id, inspector_id, "sample_type?", seal_number, portions_count]
    output: Sample
    roles: [LicensedInspector, SupervisingInspector]
    side_effects: ["collected_at and file_retention_until stamped from the logical clock", "InspectionRequest.grading_status OPEN -> SAMPLED for an ORIGINAL sample"]
  - method: GET
    path: /grain-inspection/samples
    purpose: "List samples"
    input: ["inspection_request_id?", "sampling_device_id?", "inspector_id?", "sample_type?", "integrity_status?", "limit?", "offset?"]
    output: Sample[]
    roles: [ServiceAdmin, SupervisingInspector, LicensedInspector, ApplicantUser, Auditor]
    side_effects: []
  - method: GET
    path: /grain-inspection/samples/{id}
    purpose: "Read one sample including portion accounting"
    input: []
    output: Sample
    roles: [ServiceAdmin, SupervisingInspector, LicensedInspector, ApplicantUser, Auditor]
    side_effects: []
  - method: POST
    path: /grain-inspection/samples/{id}/break-seal
    purpose: "Record a broken seal, disqualifying the sample from further official use"
    input: ["reason?"]
    output: Sample
    roles: [SupervisingInspector]
    side_effects: ["integrity_status = BROKEN"]

  - method: POST
    path: /grain-inspection/grading-results
    purpose: "Record a grading determination (original, reinspection or appeal regrade)"
    input: [inspection_request_id, sample_id, inspector_id, "appeal_id?", test_weight_lbs_per_bushel, moisture_pct, damaged_total_pct, heat_damaged_pct, foreign_material_pct]
    output: GradingResult
    roles: [LicensedInspector, SupervisingInspector]
    side_effects: ["assigned_grade and limiting_factor computed", "One sample portion consumed", "grading_status SAMPLED -> GRADED for an original determination", "Appeal SAMPLE_ASSIGNED -> UNDER_REVIEW when appeal_id is set"]
  - method: GET
    path: /grain-inspection/grading-results
    purpose: "List grading results"
    input: ["inspection_request_id?", "sample_id?", "inspector_id?", "appeal_id?", "supersedes_grading_result_id?", "status?", "limit?", "offset?"]
    output: GradingResult[]
    roles: [ServiceAdmin, SupervisingInspector, LicensedInspector, ApplicantUser, Auditor]
    side_effects: []
  - method: GET
    path: /grain-inspection/grading-results/{id}
    purpose: "Read one grading determination"
    input: []
    output: GradingResult
    roles: [ServiceAdmin, SupervisingInspector, LicensedInspector, ApplicantUser, Auditor]
    side_effects: []

  - method: POST
    path: /grain-inspection/protein-analyses
    purpose: "Record a protein or specialty analysis on an approved instrument"
    input: [inspection_request_id, sample_id, instrument_id, inspector_id, protein_pct_as_is, instrument_moisture_pct]
    output: ProteinAnalysis
    roles: [LicensedInspector, SupervisingInspector]
    side_effects: ["Basis conversion applied and sequence_no assigned", "One sample portion consumed"]
  - method: POST
    path: /grain-inspection/protein-analyses/{id}/recompute
    purpose: "Restate an analysis on the official moisture basis once grading is final"
    input: []
    output: ProteinAnalysis
    roles: [LicensedInspector, SupervisingInspector]
    side_effects: ["basis_source = OFFICIAL_MOISTURE, protein_reported_pct restated, status = RECOMPUTED"]
  - method: GET
    path: /grain-inspection/protein-analyses
    purpose: "List protein analyses"
    input: ["inspection_request_id?", "sample_id?", "instrument_id?", "inspector_id?", "status?", "limit?", "offset?"]
    output: ProteinAnalysis[]
    roles: [ServiceAdmin, SupervisingInspector, LicensedInspector, ApplicantUser, Auditor]
    side_effects: []
  - method: GET
    path: /grain-inspection/protein-analyses/{id}
    purpose: "Read one protein analysis"
    input: []
    output: ProteinAnalysis
    roles: [ServiceAdmin, SupervisingInspector, LicensedInspector, ApplicantUser, Auditor]
    side_effects: []

  - method: POST
    path: /grain-inspection/weighing-records
    purpose: "Record official weighing draft by draft on a certified scale"
    input: [inspection_request_id, scale_id, weigher_inspector_id, drafts, "dockage_pct?"]
    output: WeighingRecord
    roles: [LicensedInspector, SupervisingInspector]
    side_effects: ["Both weight variants computed", "InspectionRequest.certified_quantity_bushels = net_bushels", "weighing_status PENDING -> WEIGHED"]
  - method: POST
    path: /grain-inspection/weighing-records/{id}/supervise
    purpose: "Countersign an official weighing"
    input: [supervisor_inspector_id]
    output: WeighingRecord
    roles: [SupervisingInspector]
    side_effects: ["status WEIGHED -> SUPERVISED", "weighing_status WEIGHED -> SUPERVISED"]
  - method: GET
    path: /grain-inspection/weighing-records
    purpose: "List weighing records"
    input: ["inspection_request_id?", "scale_id?", "weigher_inspector_id?", "supervisor_inspector_id?", "status?", "limit?", "offset?"]
    output: WeighingRecord[]
    roles: [ServiceAdmin, SupervisingInspector, LicensedInspector, ApplicantUser, Auditor]
    side_effects: []
  - method: GET
    path: /grain-inspection/weighing-records/{id}
    purpose: "Read one weighing record including both variants"
    input: []
    output: WeighingRecord
    roles: [ServiceAdmin, SupervisingInspector, LicensedInspector, ApplicantUser, Auditor]
    side_effects: []

  - method: POST
    path: /grain-inspection/certificates
    purpose: "Issue an official certificate and assess the fee"
    input: [inspection_request_id, issuing_inspector_id, certificate_type]
    output: Certificate
    roles: [LicensedInspector, SupervisingInspector]
    side_effects: ["Snapshots grade, weight, protein and certified quantity", "Fee assessed and charged; sequence_no assigned", "Deadlines computed", "Prior certificate of the same type SUPERSEDED with fee reversal when the request was revised", "Issuing inspector's late_certificate_count and performance_score updated"]
  - method: GET
    path: /grain-inspection/certificates
    purpose: "List certificates"
    input: ["inspection_request_id?", "issuing_inspector_id?", "superseded_certificate_id?", "appeal_id?", "certificate_type?", "status?", "fee_settlement_status?", "limit?", "offset?"]
    output: Certificate[]
    roles: [ServiceAdmin, SupervisingInspector, LicensedInspector, ApplicantUser, Auditor]
    side_effects: []
  - method: GET
    path: /grain-inspection/certificates/{id}
    purpose: "Read one certificate with its snapshots and fee state"
    input: []
    output: Certificate
    roles: [ServiceAdmin, SupervisingInspector, LicensedInspector, ApplicantUser, Auditor]
    side_effects: []
  - method: GET
    path: /grain-inspection/certificates/{id}/appeals
    purpose: "List the appeals filed against a certificate"
    input: ["appeal_type?", "status?", "limit?", "offset?"]
    output: Appeal[]
    roles: [ServiceAdmin, SupervisingInspector, LicensedInspector, ApplicantUser, Auditor]
    side_effects: []

  - method: POST
    path: /grain-inspection/appeals
    purpose: "File a reinspection, appeal or board appeal against a certificate"
    input: [certificate_id, applicant_id, appeal_type, expected_certificate_version]
    output: Appeal
    roles: [ApplicantUser, ServiceAdmin]
    side_effects: ["Certificate ISSUED -> UNDER_APPEAL; request grading_status -> UNDER_APPEAL", "deposit_cents charged to the applicant ledger"]
  - method: POST
    path: /grain-inspection/appeals/{id}/assign-sample
    purpose: "Assign and retain a file sample for the regrade"
    input: [sample_id]
    output: Appeal
    roles: [SupervisingInspector, ServiceAdmin]
    side_effects: ["Sample.portions_retained += 1", "status FILED -> SAMPLE_ASSIGNED"]
  - method: POST
    path: /grain-inspection/appeals/{id}/decide
    purpose: "Tally the panel and decide the appeal"
    input: []
    output: Appeal
    roles: [SupervisingInspector, ServiceAdmin]
    side_effects: ["Quorum and majority evaluated", "On DECIDED_REVISED: regrade becomes FINAL, challenged certificate VOIDED with fee reversal, fee-free APPEAL_GRADE certificate issued, original inspector's reversal counter and score updated", "Refund credited; retained portion released"]
  - method: POST
    path: /grain-inspection/appeals/{id}/dismiss
    purpose: "Dismiss an appeal before review completes"
    input: ["reason?"]
    output: Appeal
    roles: [ServiceAdmin]
    side_effects: ["Half the deposit refunded; certificate returns to ISSUED; retained portion released"]
  - method: GET
    path: /grain-inspection/appeals
    purpose: "List appeals"
    input: ["certificate_id?", "applicant_id?", "assigned_sample_id?", "appeal_type?", "status?", "limit?", "offset?"]
    output: Appeal[]
    roles: [ServiceAdmin, SupervisingInspector, LicensedInspector, ApplicantUser, Auditor]
    side_effects: []
  - method: GET
    path: /grain-inspection/appeals/{id}
    purpose: "Read one appeal with its vote tally and deposit accounting"
    input: []
    output: Appeal
    roles: [ServiceAdmin, SupervisingInspector, LicensedInspector, ApplicantUser, Auditor]
    side_effects: []

  - method: POST
    path: /grain-inspection/appeal-votes
    purpose: "Cast a panel member's vote on an appeal"
    input: [appeal_id, inspector_id, vote, "rationale?", expected_appeal_version]
    output: AppealVote
    roles: [SupervisingInspector, ServiceAdmin]
    side_effects: ["Appeal vote counters and effective_votes_count updated; appeal version incremented"]
  - method: GET
    path: /grain-inspection/appeal-votes
    purpose: "List appeal votes"
    input: ["appeal_id?", "inspector_id?", "limit?", "offset?"]
    output: AppealVote[]
    roles: [ServiceAdmin, SupervisingInspector, LicensedInspector, Auditor]
    side_effects: []
  - method: GET
    path: /grain-inspection/appeal-votes/{id}
    purpose: "Read one appeal vote (immutable)"
    input: []
    output: AppealVote
    roles: [ServiceAdmin, SupervisingInspector, LicensedInspector, Auditor]
    side_effects: []

  - method: POST
    path: /grain-inspection/vessel-watches
    purpose: "Schedule a vessel loading supervision watch"
    input: [inspection_request_id, supervisor_inspector_id, vessel_name, window_start_at, window_end_at, holds_declared]
    output: VesselWatch
    roles: [ServiceAdmin, SupervisingInspector]
    side_effects: ["service_area_id copied from the request", "Inspector buffer overlap and area capacity enforced", "ServiceArea.open_watch_count += 1"]
  - method: POST
    path: /grain-inspection/vessel-watches/{id}/start
    purpose: "Begin the watch inside its window"
    input: []
    output: VesselWatch
    roles: [SupervisingInspector]
    side_effects: ["started_at stamped; status SCHEDULED -> IN_PROGRESS"]
  - method: POST
    path: /grain-inspection/vessel-watches/{id}/close
    purpose: "Close the watch and certify stowage"
    input: [holds_supervised, stowage_certified]
    output: VesselWatch
    roles: [SupervisingInspector]
    side_effects: ["closed_at stamped, supervision_minutes computed", "ServiceArea.open_watch_count -= 1"]
  - method: POST
    path: /grain-inspection/vessel-watches/{id}/abort
    purpose: "Abort a scheduled or running watch"
    input: ["reason?"]
    output: VesselWatch
    roles: [ServiceAdmin, SupervisingInspector]
    side_effects: ["ServiceArea.open_watch_count -= 1; the window is released"]
  - method: GET
    path: /grain-inspection/vessel-watches
    purpose: "List vessel watches"
    input: ["inspection_request_id?", "service_area_id?", "supervisor_inspector_id?", "status?", "limit?", "offset?"]
    output: VesselWatch[]
    roles: [ServiceAdmin, SupervisingInspector, LicensedInspector, ApplicantUser, Auditor]
    side_effects: []
  - method: GET
    path: /grain-inspection/vessel-watches/{id}
    purpose: "Read one vessel watch"
    input: []
    output: VesselWatch
    roles: [ServiceAdmin, SupervisingInspector, LicensedInspector, ApplicantUser, Auditor]
    side_effects: []

# =============================================================================
# §1.6 Error Catalog
# =============================================================================
error_catalog:
  - error_id: ERR_UNAUTHENTICATED
    http_status: 401
    message: "Missing or unknown X-User-Id header"
    raised_by: "all endpoints"
  - error_id: ERR_UNAUTHORIZED
    http_status: 403
    message: "Role not permitted for this operation"
    raised_by: "all endpoints"
  - error_id: ERR_APPLICANT_SCOPE_VIOLATION
    http_status: 403
    message: "An applicant user may only act on their own account's records"
    raised_by: "ApplicantUser-accessible endpoints"
  - error_id: ERR_INVALID_REQUEST
    http_status: 422
    message: "Body failed schema, type, range or enum validation"
    raised_by: "all write endpoints"

  - error_id: ERR_SERVICE_AREA_NOT_FOUND
    http_status: 404
    message: "Service area does not exist"
    raised_by: "service-area paths and service_area_id bodies"
  - error_id: ERR_FEE_SCHEDULE_NOT_FOUND
    http_status: 404
    message: "Fee schedule does not exist"
    raised_by: "fee-schedule paths"
  - error_id: ERR_APPLICANT_NOT_FOUND
    http_status: 404
    message: "Applicant does not exist"
    raised_by: "applicant paths and applicant_id bodies"
  - error_id: ERR_INSPECTOR_NOT_FOUND
    http_status: 404
    message: "Inspector does not exist"
    raised_by: "inspector paths and inspector_id bodies"
  - error_id: ERR_EQUIPMENT_NOT_FOUND
    http_status: 404
    message: "Equipment does not exist"
    raised_by: "equipment paths, sampling_device_id, scale_id and instrument_id bodies"
  - error_id: ERR_INSPECTION_REQUEST_NOT_FOUND
    http_status: 404
    message: "Inspection request does not exist"
    raised_by: "inspection-request paths and inspection_request_id bodies"
  - error_id: ERR_SAMPLE_NOT_FOUND
    http_status: 404
    message: "Sample does not exist"
    raised_by: "sample paths and sample_id bodies"
  - error_id: ERR_GRADING_RESULT_NOT_FOUND
    http_status: 404
    message: "Grading result does not exist"
    raised_by: "grading-result paths"
  - error_id: ERR_PROTEIN_ANALYSIS_NOT_FOUND
    http_status: 404
    message: "Protein analysis does not exist"
    raised_by: "protein-analysis paths"
  - error_id: ERR_WEIGHING_RECORD_NOT_FOUND
    http_status: 404
    message: "Weighing record does not exist"
    raised_by: "weighing-record paths"
  - error_id: ERR_CERTIFICATE_NOT_FOUND
    http_status: 404
    message: "Certificate does not exist"
    raised_by: "certificate paths and certificate_id bodies"
  - error_id: ERR_APPEAL_NOT_FOUND
    http_status: 404
    message: "Appeal does not exist"
    raised_by: "appeal paths and appeal_id bodies"
  - error_id: ERR_APPEAL_VOTE_NOT_FOUND
    http_status: 404
    message: "Appeal vote does not exist"
    raised_by: "appeal-vote paths"
  - error_id: ERR_VESSEL_WATCH_NOT_FOUND
    http_status: 404
    message: "Vessel watch does not exist"
    raised_by: "vessel-watch paths"

  - error_id: ERR_SAMPLE_REQUEST_MISMATCH
    http_status: 422
    message: "Sample belongs to a different inspection request"
    raised_by: "POST /grain-inspection/grading-results, POST /grain-inspection/protein-analyses, POST /grain-inspection/appeals/{id}/assign-sample"
  - error_id: ERR_SERVICE_AREA_MISMATCH
    http_status: 422
    message: "Inspector or equipment belongs to a different service area than the request"
    raised_by: "POST /grain-inspection/samples, POST /grain-inspection/weighing-records, POST /grain-inspection/protein-analyses, POST /grain-inspection/certificates"
  - error_id: ERR_EQUIPMENT_KIND_MISMATCH
    http_status: 422
    message: "Equipment kind is not valid for this use"
    raised_by: "POST /grain-inspection/samples, POST /grain-inspection/weighing-records, POST /grain-inspection/protein-analyses, POST /grain-inspection/comparison-checks"
  - error_id: ERR_EQUIPMENT_FIELD_APPLICABILITY
    http_status: 422
    message: "Scale-only fields supplied for a non-scale, or required scale fields missing"
    raised_by: "POST /grain-inspection/equipment, POST /grain-inspection/equipment/{id}/certify"
  - error_id: ERR_APPEAL_REGRADE_BINDING_INVALID
    http_status: 422
    message: "Appeal regrade must reference the appeal's assigned sample and the appeal's own request"
    raised_by: "POST /grain-inspection/grading-results"
  - error_id: ERR_SERVICE_NOT_REQUESTED
    http_status: 422
    message: "The service required for this operation was not ordered on the request"
    raised_by: "POST /grain-inspection/inspection-requests, POST /grain-inspection/weighing-records, POST /grain-inspection/protein-analyses, POST /grain-inspection/vessel-watches, POST /grain-inspection/certificates"

  - error_id: ERR_CERTIFICATE_VERSION_CONFLICT
    http_status: 412
    message: "expected_certificate_version does not match the certificate's current version"
    raised_by: "POST /grain-inspection/appeals"
  - error_id: ERR_APPEAL_VERSION_CONFLICT
    http_status: 412
    message: "expected_appeal_version does not match the appeal's current version"
    raised_by: "POST /grain-inspection/appeal-votes"

  - error_id: ERR_SERVICE_AREA_SUSPENDED
    http_status: 409
    message: "Service area is suspended and cannot take new work"
    raised_by: "service-producing write endpoints"
  - error_id: ERR_EQUIPMENT_NOT_APPROVED
    http_status: 409
    message: "Equipment is not approved or its certification has lapsed"
    raised_by: "POST /grain-inspection/samples, POST /grain-inspection/weighing-records, POST /grain-inspection/protein-analyses"
  - error_id: ERR_EQUIPMENT_WITHDRAWN
    http_status: 409
    message: "Equipment is withdrawn or not eligible for this calibration action"
    raised_by: "POST /grain-inspection/equipment/{id}/certify, POST /grain-inspection/comparison-checks"
  - error_id: ERR_INSPECTOR_LICENSE_INVALID
    http_status: 409
    message: "Inspector licence state does not permit this action"
    raised_by: "all inspector-naming write endpoints"
  - error_id: ERR_SAMPLE_INTEGRITY_BROKEN
    http_status: 409
    message: "Sample integrity is broken or the retention period has expired"
    raised_by: "POST /grain-inspection/grading-results, POST /grain-inspection/protein-analyses, POST /grain-inspection/appeals/{id}/assign-sample"
  - error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    message: "Requested transition is not declared from the entity's current state"
    raised_by: "all action endpoints"
  - error_id: ERR_APPEAL_STATE_INVALID
    http_status: 409
    message: "Appeal is not in a state that allows this action"
    raised_by: "POST /grain-inspection/appeals/{id}/decide, POST /grain-inspection/appeals/{id}/dismiss, POST /grain-inspection/appeals/{id}/assign-sample"
  - error_id: ERR_CERTIFICATE_UNDER_APPEAL
    http_status: 409
    message: "Certificate is under appeal and cannot be re-certified or appealed again"
    raised_by: "POST /grain-inspection/appeals, POST /grain-inspection/certificates"
  - error_id: ERR_WEIGHING_SUPERVISION_REQUIRED
    http_status: 409
    message: "Weight content requires an operative weighing, countersigned where the area demands supervision"
    raised_by: "POST /grain-inspection/certificates"
  - error_id: ERR_VESSEL_WATCH_NOT_CLOSED
    http_status: 409
    message: "Export cargo certification requires a closed watch with certified stowage"
    raised_by: "POST /grain-inspection/certificates"
  - error_id: ERR_GRADING_RESULT_MISSING
    http_status: 409
    message: "No final grading determination exists for the request"
    raised_by: "POST /grain-inspection/certificates"
  - error_id: ERR_FEE_SCHEDULE_NOT_DRAFT
    http_status: 409
    message: "Only a draft fee schedule can be activated"
    raised_by: "POST /grain-inspection/fee-schedules/{id}/activate"

  - error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 422
    message: "The inspector who produced the challenged determination cannot regrade or vote on it"
    raised_by: "POST /grain-inspection/grading-results, POST /grain-inspection/appeal-votes"
  - error_id: ERR_SELF_SUPERVISION_FORBIDDEN
    http_status: 422
    message: "A weigher cannot countersign their own weighing"
    raised_by: "POST /grain-inspection/weighing-records/{id}/supervise"
  - error_id: ERR_SELF_CHECK_FORBIDDEN
    http_status: 422
    message: "A supervising inspector cannot file a comparison check against themselves"
    raised_by: "POST /grain-inspection/comparison-checks"
  - error_id: ERR_DUPLICATE_PANEL_VOTE
    http_status: 422
    message: "This inspector has already voted on the appeal"
    raised_by: "POST /grain-inspection/appeal-votes"
  - error_id: ERR_ENDORSEMENT_MISSING
    http_status: 422
    message: "Inspector lacks the endorsement required for this operation"
    raised_by: "POST /grain-inspection/samples, POST /grain-inspection/grading-results, POST /grain-inspection/protein-analyses, POST /grain-inspection/weighing-records, POST /grain-inspection/certificates"
  - error_id: ERR_EXPORT_REQUIRES_DESIGNATED_AREA
    http_status: 422
    message: "Export cargo certification is limited to designated service areas"
    raised_by: "POST /grain-inspection/certificates"

  - error_id: ERR_SAMPLE_PORTIONS_EXHAUSTED
    http_status: 422
    message: "No sample portion remains available"
    raised_by: "POST /grain-inspection/grading-results, POST /grain-inspection/protein-analyses, POST /grain-inspection/appeals/{id}/assign-sample"
  - error_id: ERR_DUPLICATE_OPERATIVE_RECORD
    http_status: 422
    message: "An operative record of this kind already exists"
    raised_by: "POST /grain-inspection/grading-results, POST /grain-inspection/weighing-records, POST /grain-inspection/appeals"
  - error_id: ERR_DUPLICATE_IDENTIFIER
    http_status: 422
    message: "Identifier already used within its uniqueness scope"
    raised_by: "POST /grain-inspection/samples, POST /grain-inspection/applicants, POST /grain-inspection/inspectors, POST /grain-inspection/equipment"
  - error_id: ERR_SCALE_CAPACITY_EXCEEDED
    http_status: 422
    message: "Draft weights exceed the scale's rated capacity or are internally inconsistent"
    raised_by: "POST /grain-inspection/weighing-records"
  - error_id: ERR_FACTOR_SET_INCONSISTENT
    http_status: 422
    message: "Heat damaged percentage cannot exceed total damaged percentage"
    raised_by: "POST /grain-inspection/grading-results"
  - error_id: ERR_INSPECTOR_NOT_QUALIFIED
    http_status: 422
    message: "Training hours or performance score below the required minimum"
    raised_by: "POST /grain-inspection/inspectors/{id}/activate, POST /grain-inspection/inspectors/{id}/reinstate"
  - error_id: ERR_APPEAL_QUORUM_NOT_MET
    http_status: 422
    message: "Effective votes are fewer than the required panel size"
    raised_by: "POST /grain-inspection/appeals/{id}/decide"
  - error_id: ERR_BOARD_PANEL_COMPOSITION_INVALID
    http_status: 422
    message: "Board appeal panel members must come from another service area"
    raised_by: "POST /grain-inspection/appeal-votes"
  - error_id: ERR_HOLDS_NOT_FULLY_SUPERVISED
    http_status: 422
    message: "All declared holds must be supervised before the watch can close"
    raised_by: "POST /grain-inspection/vessel-watches/{id}/close"
  - error_id: ERR_ANALYSIS_RECOMPUTE_NOT_APPLICABLE
    http_status: 422
    message: "Analysis cannot be restated on the official basis in its current state"
    raised_by: "POST /grain-inspection/protein-analyses/{id}/recompute"

  - error_id: ERR_APPEAL_WINDOW_EXPIRED
    http_status: 422
    message: "The filing window for this appeal type has closed"
    raised_by: "POST /grain-inspection/appeals"
  - error_id: ERR_APPEAL_ESCALATION_INVALID
    http_status: 422
    message: "A board appeal requires a prior upheld appeal on the same certificate"
    raised_by: "POST /grain-inspection/appeals"
  - error_id: ERR_WATCH_WINDOW_INVALID
    http_status: 422
    message: "Watch window is inverted or the current time is outside it"
    raised_by: "POST /grain-inspection/vessel-watches, POST /grain-inspection/vessel-watches/{id}/start"
  - error_id: ERR_INSPECTOR_WATCH_OVERLAP
    http_status: 422
    message: "Supervising inspector already holds an overlapping watch within the travel buffer"
    raised_by: "POST /grain-inspection/vessel-watches"
  - error_id: ERR_AREA_WATCH_CAPACITY_EXCEEDED
    http_status: 422
    message: "Concurrent watch capacity for the service area is exhausted"
    raised_by: "POST /grain-inspection/vessel-watches"
  - error_id: ERR_FEE_SCHEDULE_WINDOW_CONFLICT
    http_status: 422
    message: "Fee schedule window is inverted or overlaps an active schedule for the same class"
    raised_by: "POST /grain-inspection/fee-schedules, POST /grain-inspection/fee-schedules/{id}/activate"
  - error_id: ERR_EXPIRY_IN_PAST
    http_status: 422
    message: "Expiry instant must be in the future relative to the logical clock"
    raised_by: "POST /grain-inspection/inspectors/{id}/activate, POST /grain-inspection/equipment/{id}/certify"
  - error_id: ERR_CLOCK_NOT_MONOTONIC
    http_status: 422
    message: "The logical clock cannot move backwards"
    raised_by: "POST /_clock/set_current_utc"

  - error_id: ERR_NO_ACTIVE_FEE_SCHEDULE
    http_status: 422
    message: "No active fee schedule covers this service class at the current time"
    raised_by: "POST /grain-inspection/certificates, POST /grain-inspection/appeals"
  - error_id: ERR_CREDIT_LIMIT_EXCEEDED
    http_status: 422
    message: "Assessed fee would push the applicant past their credit limit"
    raised_by: "POST /grain-inspection/certificates"
  - error_id: ERR_PAYMENT_EXCEEDS_ALLOCATABLE
    http_status: 422
    message: "Payment exceeds the applicant's allocatable open balance"
    raised_by: "POST /grain-inspection/applicants/{id}/payments"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
rbac:
  roles:
    - role: ServiceAdmin
      identity: "X-User-Id: admin_user"
      description: "Field office administrator for the delegated or designated agency: configures areas, fee schedules, licences, equipment approvals and billing"
      exclusive_operations:
        - "POST /grain-inspection/service-areas"
        - "PATCH /grain-inspection/service-areas/{id}"
        - "POST /grain-inspection/fee-schedules"
        - "POST /grain-inspection/fee-schedules/{id}/activate"
        - "POST /grain-inspection/applicants"
        - "POST /grain-inspection/inspectors"
        - "POST /grain-inspection/inspectors/{id}/activate"
        - "POST /grain-inspection/inspectors/{id}/suspend"
        - "POST /grain-inspection/inspectors/{id}/reinstate"
        - "POST /grain-inspection/inspectors/{id}/revoke"
        - "POST /grain-inspection/equipment"
        - "POST /grain-inspection/equipment/{id}/certify"
        - "POST /grain-inspection/appeals/{id}/dismiss"
      shared_operations:
        - "POST /grain-inspection/inspectors/{id}/training-records (with SupervisingInspector)"
        - "POST /grain-inspection/comparison-checks (with SupervisingInspector)"
        - "POST /grain-inspection/inspection-requests (with ApplicantUser)"
        - "POST /grain-inspection/applicants/{id}/payments (with ApplicantUser)"
        - "POST /grain-inspection/appeals (with ApplicantUser)"
        - "POST /grain-inspection/appeals/{id}/assign-sample (with SupervisingInspector)"
        - "POST /grain-inspection/appeals/{id}/decide (with SupervisingInspector)"
        - "POST /grain-inspection/appeal-votes (with SupervisingInspector)"
        - "POST /grain-inspection/vessel-watches (with SupervisingInspector)"
        - "POST /grain-inspection/vessel-watches/{id}/abort (with SupervisingInspector)"
        - "POST /_clock/set_current_utc (all roles)"
        - "all GET endpoints"

    - role: SupervisingInspector
      identity: "X-User-Id: supervisor_user"
      description: "Licensed inspector holding the SUPERVISION endorsement: countersigns weighings, holds vessel watches, sits on appeal panels, files proficiency checks and may perform every line inspection task"
      exclusive_operations:
        - "POST /grain-inspection/weighing-records/{id}/supervise"
        - "POST /grain-inspection/samples/{id}/break-seal"
        - "POST /grain-inspection/vessel-watches/{id}/start"
        - "POST /grain-inspection/vessel-watches/{id}/close"
      shared_operations:
        - "POST /grain-inspection/samples (with LicensedInspector)"
        - "POST /grain-inspection/grading-results (with LicensedInspector)"
        - "POST /grain-inspection/protein-analyses (with LicensedInspector)"
        - "POST /grain-inspection/protein-analyses/{id}/recompute (with LicensedInspector)"
        - "POST /grain-inspection/weighing-records (with LicensedInspector)"
        - "POST /grain-inspection/certificates (with LicensedInspector)"
        - "POST /grain-inspection/comparison-checks (with ServiceAdmin)"
        - "POST /grain-inspection/inspectors/{id}/training-records (with ServiceAdmin)"
        - "POST /grain-inspection/appeals/{id}/assign-sample (with ServiceAdmin)"
        - "POST /grain-inspection/appeals/{id}/decide (with ServiceAdmin)"
        - "POST /grain-inspection/appeal-votes (with ServiceAdmin)"
        - "POST /grain-inspection/vessel-watches (with ServiceAdmin)"
        - "POST /grain-inspection/vessel-watches/{id}/abort (with ServiceAdmin)"
        - "POST /_clock/set_current_utc (all roles)"
        - "all GET endpoints"
      segregation_constraints:
        - "Cannot countersign a weighing they performed (ERR_SELF_SUPERVISION_FORBIDDEN)"
        - "Cannot file a comparison check naming themselves (ERR_SELF_CHECK_FORBIDDEN)"
        - "Cannot regrade or vote on an appeal against a determination they produced (ERR_SEGREGATION_OF_DUTIES)"

    - role: LicensedInspector
      identity: "X-User-Id: inspector_user"
      description: "Licensed line inspector: samples, grades, analyses, weighs and issues certificates but never supervises, votes or breaks seals"
      exclusive_operations: []
      shared_operations:
        - "POST /grain-inspection/samples (with SupervisingInspector)"
        - "POST /grain-inspection/grading-results (with SupervisingInspector)"
        - "POST /grain-inspection/protein-analyses (with SupervisingInspector)"
        - "POST /grain-inspection/protein-analyses/{id}/recompute (with SupervisingInspector)"
        - "POST /grain-inspection/weighing-records (with SupervisingInspector)"
        - "POST /grain-inspection/certificates (with SupervisingInspector)"
        - "POST /_clock/set_current_utc (all roles)"
        - "all GET endpoints except the applicant list"

    - role: ApplicantUser
      identity: "X-User-Id: applicant_user"
      description: "Elevator or exporter representative: orders services, pays fees and exercises appeal and reinspection rights on their own account only"
      exclusive_operations: []
      shared_operations:
        - "POST /grain-inspection/inspection-requests (with ServiceAdmin)"
        - "POST /grain-inspection/applicants/{id}/payments (with ServiceAdmin)"
        - "POST /grain-inspection/appeals (with ServiceAdmin)"
        - "POST /_clock/set_current_utc (all roles)"
        - "read access to their own applicant, requests, samples, results, analyses, weighings, certificates, appeals and watches"
      scope_constraints:
        - "Reads and writes are limited to rows whose applicant chain resolves to their own applicant (ERR_APPLICANT_SCOPE_VIOLATION)"

    - role: Auditor
      identity: "X-User-Id: auditor_user"
      description: "Read-only oversight reviewer with unrestricted read access and no write authority"
      exclusive_operations: []
      shared_operations:
        - "all GET endpoints"
        - "POST /_clock/set_current_utc (all roles)"
