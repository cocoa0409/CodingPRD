      - name: fulfillment_delivered_is_terminal
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.FulfillmentOrder
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Once an order reaches DELIVERED, every later mutation endpoint returns ERR_INVALID_STATE, so no transition leaves the terminal state."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Licensor LICM, APPROVED CAP design DSGM, run POM committed with a BASE layer and one delivered order of 20 units."
          setup_api_calls:
