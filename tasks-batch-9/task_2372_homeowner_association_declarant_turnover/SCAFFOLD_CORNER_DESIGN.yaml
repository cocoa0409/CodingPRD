            - call: "POST /hoa/associations"
              payload: { name: "Ashcombe", total_planned_lots: 6, turnover_threshold_pct: 66.67, fixed_turnover_date: "2026-07-01T00:00:00Z", statute_of_repose_years: 8, reserve_pool_cents: 0, reserve_claim_pool_cents: 0, declarant_monthly_subsidy_cents: 0 }
