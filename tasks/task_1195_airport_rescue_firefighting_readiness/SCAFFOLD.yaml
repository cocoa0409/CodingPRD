      - "Compute result; set checked_at = logical clock; update vehicle.latest_readiness_result"
      - "Recompute supported_index_by_equipment, effective_index, index_compliance_status; increment AirportOpsProfile.version; apply notification create/resolve rules"

  # --- Firefighters & training ---
  - method: POST
