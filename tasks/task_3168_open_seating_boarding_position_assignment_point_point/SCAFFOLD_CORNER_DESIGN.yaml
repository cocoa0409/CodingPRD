  # =============================================================
  # Section: cross_cutting_layers
  # =============================================================
  - section: cross_cutting_layers
    instances:
      - name: occ_stale_leg_version_checkin
        claim_type: occ_stale_version
        grounds: [ "concurrency_rules[boarding-checkin-stale-leg]", "errors[ERR_STALE_VERSION]" ]
        distinguishing_aspect: "Check-in carrying an expected_leg_version captured before another check-in bumped the leg's version is rejected with ERR_STALE_VERSION/412 — deterministic two-sequential-request OCC."
        test_recipe:
          setup: ["station DAL/HOU, fare FLEX, leg L1, passengers P1/P2 with BOOKED journeys J1/J2; P1 captured leg version V before P2's check-in"]
          setup_api_calls:
            - call: "POST /ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-30T11:00:00Z" }
              as: OpsController
            - call: "POST /ops/stations"
              payload: { iata_code: "DAL" }
              as: OpsController
              captures: { st_dal: $.data.id }
            - call: "POST /ops/stations"
              payload: { iata_code: "HOU" }
              as: OpsController
              captures: { st_hou: $.data.id }
            - call: "POST /ops/fare-classes"
              payload: { code: "FLEX" }
              as: OpsController
              captures: { fc: $.data.id }
            - call: "POST /ops/flight-legs"
              payload: { flight_number: "WN1", origin_station_id: "${st_dal}", destination_station_id: "${st_hou}", scheduled_departure_utc: "2026-10-01T12:00:00Z", scheduled_arrival_utc: "2026-10-01T13:00:00Z", capacity_seats: 143 }
              as: OpsController
              captures: { leg: $.data.id, leg_v: $.data.version }
            - call: "POST /ops/passengers"
              payload: { full_name: "P 1", date_of_birth: "1990-01-01" }
              as: Passenger
              captures: { p1: $.data.id }
            - call: "POST /ops/passengers"
              payload: { full_name: "P 2", date_of_birth: "1990-01-01" }
              as: Passenger
              captures: { p2: $.data.id }
            - call: "POST /ops/bookings"
              payload: { record_locator: "BKO1", journeys: [ { passenger_id: "${p1}", flight_leg_id: "${leg}", fare_class_id: "${fc}", base_fare_cents: 10000 } ] }
              as: Passenger
              as_user_id: "${p1}"
              captures: { j1: "$.data.journey_ids[0]" }
            - call: "POST /ops/bookings"
              payload: { record_locator: "BKO2", journeys: [ { passenger_id: "${p2}", flight_leg_id: "${leg}", fare_class_id: "${fc}", base_fare_cents: 10000 } ] }
              as: Passenger
              as_user_id: "${p2}"
              captures: { j2: "$.data.journey_ids[0]" }
            - call: "POST /ops/flight-legs/${leg}/check-ins"
              payload: { journey_id: "${j2}", expected_leg_version: "${leg_v}" }
              as: Passenger
              as_user_id: "${p2}"
          trigger:
            - call: "POST /ops/flight-legs/${leg}/check-ins"
              payload: { journey_id: "${j1}", expected_leg_version: "${leg_v}" }
              as: Passenger
              as_user_id: "${p1}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_STALE_VERSION with HTTP 412 (leg version advanced by J2's check-in)"
            - "J1 remains BOOKED; no assignment created"

      - name: occ_stale_credit_version_redeem
        claim_type: occ_stale_version
        grounds: [ "concurrency_rules[credit-redeem-stale-credit]", "errors[ERR_STALE_VERSION]" ]
        distinguishing_aspect: "Second redemption carrying the pre-first-redemption expected_credit_version is rejected with ERR_STALE_VERSION/412 — OCC on TravelCredit, a different parent entity than FlightLeg."
        test_recipe:
          setup: ["station DAL/HOU, fare FLEX, legs L1/L2, passenger PA; credit CR (20000, version captured); J_NEW BOOKED on L2; one successful 5000 redemption already applied"]
          setup_api_calls:
            - call: "POST /ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-30T11:00:00Z" }
              as: OpsController
            - call: "POST /ops/stations"
              payload: { iata_code: "DAL" }
              as: OpsController
              captures: { st_dal: $.data.id }
            - call: "POST /ops/stations"
              payload: { iata_code: "HOU" }
              as: OpsController
              captures: { st_hou: $.data.id }
            - call: "POST /ops/fare-classes"
              payload: { code: "FLEX", change_fee_cents: 0 }
              as: OpsController
              captures: { fc: $.data.id }
            - call: "POST /ops/flight-legs"
              payload: { flight_number: "WN1", origin_station_id: "${st_dal}", destination_station_id: "${st_hou}", scheduled_departure_utc: "2026-10-01T12:00:00Z", scheduled_arrival_utc: "2026-10-01T13:00:00Z", capacity_seats: 143 }
              as: OpsController
              captures: { leg1: $.data.id }
            - call: "POST /ops/flight-legs"
              payload: { flight_number: "WN2", origin_station_id: "${st_dal}", destination_station_id: "${st_hou}", scheduled_departure_utc: "2026-10-02T12:00:00Z", scheduled_arrival_utc: "2026-10-02T13:00:00Z", capacity_seats: 143 }
              as: OpsController
              captures: { leg2: $.data.id }
            - call: "POST /ops/passengers"
              payload: { full_name: "P A", date_of_birth: "1990-01-01" }
              as: Passenger
              captures: { pa: $.data.id }
            - call: "POST /ops/bookings"
              payload: { record_locator: "BKV1", journeys: [ { passenger_id: "${pa}", flight_leg_id: "${leg1}", fare_class_id: "${fc}", base_fare_cents: 20000 } ] }
              as: Passenger
              as_user_id: "${pa}"
              captures: { j_src: "$.data.journey_ids[0]" }
            - call: "POST /ops/journeys/${j_src}/cancel"
              payload: {}
              as: Passenger
              as_user_id: "${pa}"
            - call: "GET /ops/credits"
              payload: { passenger_id: "${pa}" }
              as: Passenger
              as_user_id: "${pa}"
              captures: { cr: "$.data[0].id", cr_v: "$.data[0].version" }
            - call: "POST /ops/bookings"
              payload: { record_locator: "BKV2", journeys: [ { passenger_id: "${pa}", flight_leg_id: "${leg2}", fare_class_id: "${fc}", base_fare_cents: 10000 } ] }
              as: Passenger
              as_user_id: "${pa}"
              captures: { j_new: "$.data.journey_ids[0]" }
            - call: "POST /ops/credits/${cr}/redeem"
              payload: { journey_id: "${j_new}", amount_cents: 5000, expected_credit_version: "${cr_v}" }
              as: Passenger
              as_user_id: "${pa}"
          trigger:
            - call: "POST /ops/credits/${cr}/redeem"
              payload: { journey_id: "${j_new}", amount_cents: 5000, expected_credit_version: "${cr_v}" }
              as: Passenger
              as_user_id: "${pa}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_STALE_VERSION with HTTP 412 (first redemption bumped credit version)"
            - "remaining_amount_cents == 15000 (only the first redemption applied)"

      - name: cascading_side_effects_mixed_2_journey_booking_cancel
        claim_type: cascade_chain
        grounds: [ state_machines.Booking.ACTIVE_to_CANCELLED ]
        distinguishing_aspect: "Booking with 2 journeys stays ACTIVE after one journey is cancelled and flips to CANCELLED only when the second is also terminal — compound state derived from children."
        test_recipe:
          setup: ["station DAL/HOU, fare FLEX, leg L1, passenger PA with booking BK2 (journeys JA, JB); JA cancelled"]
          setup_api_calls:
            - call: "POST /ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-30T11:00:00Z" }
              as: OpsController
            - call: "POST /ops/stations"
              payload: { iata_code: "DAL" }
              as: OpsController
              captures: { st_dal: $.data.id }
            - call: "POST /ops/stations"
              payload: { iata_code: "HOU" }
              as: OpsController
              captures: { st_hou: $.data.id }
            - call: "POST /ops/fare-classes"
              payload: { code: "FLEX", change_fee_cents: 0 }
              as: OpsController
              captures: { fc: $.data.id }
            - call: "POST /ops/flight-legs"
              payload: { flight_number: "WN1", origin_station_id: "${st_dal}", destination_station_id: "${st_hou}", scheduled_departure_utc: "2026-10-01T12:00:00Z", scheduled_arrival_utc: "2026-10-01T13:00:00Z", capacity_seats: 143 }
              as: OpsController
              captures: { leg: $.data.id }
            - call: "POST /ops/passengers"
              payload: { full_name: "P A", date_of_birth: "1990-01-01" }
              as: Passenger
              captures: { pa: $.data.id }
            - call: "POST /ops/bookings"
              payload: { record_locator: "BK2C", journeys: [ { passenger_id: "${pa}", flight_leg_id: "${leg}", fare_class_id: "${fc}", base_fare_cents: 10000 }, { passenger_id: "${pa}", flight_leg_id: "${leg}", fare_class_id: "${fc}", base_fare_cents: 12000 } ] }
              as: Passenger
              as_user_id: "${pa}"
              captures: { bk: $.data.id, j_a: "$.data.journey_ids[0]", j_b: "$.data.journey_ids[1]" }
          trigger:
            - call: "POST /ops/journeys/${j_a}/cancel"
              payload: {}
              as: Passenger
              as_user_id: "${pa}"
            - call: "GET /ops/bookings/${bk}"
              payload: {}
              as: Passenger
              as_user_id: "${pa}"
              captures: { st1: $.data.booking_status }
            - call: "POST /ops/journeys/${j_b}/cancel"
              payload: {}
              as: Passenger
              as_user_id: "${pa}"
            - call: "GET /ops/bookings/${bk}"
              payload: {}
              as: Passenger
              as_user_id: "${pa}"
              captures: { st2: $.data.booking_status }
          assert:
            - "after first cancel: booking_status == ACTIVE (one journey still BOOKED)"
            - "after second cancel: booking_status == CANCELLED (all journeys terminal)"

  # =============================================================
  # Section: consistency_model
  # =============================================================
  - section: consistency_model
    instances:
      - name: immediate_visibility_of_checkin_assignment
        claim_type: immediate_consistency
        grounds: [ complexity_profile.consistency_model ]
        distinguishing_aspect: "Immediate consistency: the check-in response and a subsequent GET on the same request stream show the created BoardingAssignment with its final group/position — no eventual lag."
        test_recipe:
          setup: ["station DAL/HOU, fare FLEX, leg L1, passenger PA with BOOKED journey J1"]
          setup_api_calls:
            - call: "POST /ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-30T11:00:00Z" }
              as: OpsController
            - call: "POST /ops/stations"
              payload: { iata_code: "DAL" }
              as: OpsController
              captures: { st_dal: $.data.id }
            - call: "POST /ops/stations"
              payload: { iata_code: "HOU" }
              as: OpsController
              captures: { st_hou: $.data.id }
            - call: "POST /ops/fare-classes"
              payload: { code: "FLEX" }
              as: OpsController
              captures: { fc: $.data.id }
            - call: "POST /ops/flight-legs"
              payload: { flight_number: "WN1", origin_station_id: "${st_dal}", destination_station_id: "${st_hou}", scheduled_departure_utc: "2026-10-01T12:00:00Z", scheduled_arrival_utc: "2026-10-01T13:00:00Z", capacity_seats: 143 }
              as: OpsController
              captures: { leg: $.data.id, leg_v: $.data.version }
            - call: "POST /ops/passengers"
              payload: { full_name: "P A", date_of_birth: "1990-01-01" }
              as: Passenger
              captures: { pa: $.data.id }
            - call: "POST /ops/bookings"
              payload: { record_locator: "BKIM", journeys: [ { passenger_id: "${pa}", flight_leg_id: "${leg}", fare_class_id: "${fc}", base_fare_cents: 10000 } ] }
              as: Passenger
              as_user_id: "${pa}"
              captures: { j1: "$.data.journey_ids[0]" }
          trigger:
            - call: "POST /ops/flight-legs/${leg}/check-ins"
              payload: { journey_id: "${j1}", expected_leg_version: "${leg_v}" }
              as: Passenger
              as_user_id: "${pa}"
            - call: "GET /ops/journeys/${j1}/boarding-assignments"
              payload: {}
              as: Passenger
              as_user_id: "${pa}"
              captures: { grp: "$.data[0].boarding_group", src: "$.data[0].assignment_source" }
          assert:
            - "immediately after check-in: exactly 1 assignment row, boarding_group == A (first regular passenger)"
            - "assignment_source == CHECKIN_TIME"
            - "PassengerJourney.checked_in_at == 2026-09-30T11:00:00Z (logical clock)"
