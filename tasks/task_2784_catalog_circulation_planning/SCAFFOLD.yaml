# =============================================================================
# SCAFFOLD.yaml — Catalog Circulation Planning (catalog retailer marketing)
# §1.0–§1.7. Difficulty design lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml (§1.8);
# corner design lives in SCAFFOLD_CORNER_DESIGN.yaml (§1.9).
# =============================================================================

scenario: |
  2784. Catalog Circulation Planning (catalog retailer marketing): housefile segmentation by recency,
  frequency and monetary value with contact strategy per segment, prospect list rental, cooperative
  database modeling and merge-purge deduplication, circulation plan by drop with page counts, square
  inch allocation and product placement decisions, cost per book including printing, paper and postage
  with postal presort optimization, response and demand forecasting by segment and drop with matchback
  attribution to online orders, contact fatigue and suppression rules across mail, email and digital,
  test design for new segments, formats and offers with holdout groups, profitability analysis per
  circulation segment

domain_name: catalog-circulation-planning
api_prefix: "/catalog-circulation"

# -----------------------------------------------------------------------------
# §1.0 Response Envelope (FIXED — verbatim)
# -----------------------------------------------------------------------------
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# -----------------------------------------------------------------------------
# §0.1–§0.3 Complexity Profile
# -----------------------------------------------------------------------------
complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: graph
  entity_topology_note: |
    Peer aggregates linked by foreign keys plus two junction entities (CirculationLine joins Drop to
    either a HousefileSegment or a ProspectListRental; PagePlacement joins Drop to a merchandised SKU)
    plus a self-referential HousefileSegment hierarchy (parent_segment_id). No single containment tree
    covers the model: ContactEvent spans CirculationPlan boundaries by pointing at both a Drop and a
    HousefileSegment, and MergePurgeRun consumes an ordered list of ProspectListRental ids that live
    under a different parent (CatalogSeason) than the run itself (CirculationPlan).

  state_machine_shape: cyclic
  state_machine_shape_note: |
    CirculationPlan is cyclic (UNDER_REVIEW -> DRAFT and APPROVED -> DRAFT revision back-edges, plus an
    automatic COSTED -> DRAFT invalidation edge). Drop carries two parallel, independently advancing
    state dimensions (production_status x measurement_status). MergePurgeRun forks
    PENDING -> {COMPLETED, FAILED} with divergent side-effect sets.

  relationship_patterns:
    - one_to_many          # CatalogSeason -> HousefileSegment / ProspectListRental / CirculationPlan
    - many_to_many         # CirculationLine (Drop x audience), PagePlacement (Drop x SKU)
    - self_referential     # HousefileSegment.parent_segment_id -> HousefileSegment.id
    - cross_aggregate      # ContactEvent references both HousefileSegment and Drop
    - polymorphic_by_pair  # CirculationLine carries exactly one of two nullable audience FKs

  role_model: segregation_of_duties
  role_model_note: |
    The operator who costs a CirculationPlan and the operator who submits it for review may not be the
    operator who approves it: approve compares X-User-ID against plan.costed_by_user_id and
    plan.submitted_by_user_id. Layered over peer ownership (ListBroker owns rentals and merge-purge,
    CirculationPlanner owns plans/drops/lines/placements/production, MarketingAnalyst owns measurement).

  consistency_model: immediate
  consistency_model_note: |
    Every cascade, derived-field recompute and compensating credit completes inside the triggering
    request; no read repair, no background reconciliation.

# -----------------------------------------------------------------------------
# §1.1 Entity-Relationship Table
# -----------------------------------------------------------------------------
entities:
  - name: CatalogSeason
    parent: null
    common_fields: true
    entity_kind: configuration
    fields:
      - name: season_code
        type: string
        source: input
        description: "Human-readable season identifier, e.g. FALL2026A."
        constraints: "1..32 chars; globally unique; violation -> ERR_DUPLICATE_SEASON_CODE"
      - name: fiscal_year
        type: integer
        source: input
        description: "Fiscal year the season books into."
        constraints: "2020..2100"
      - name: print_cost_per_page_per_thousand_cents
        type: integer
        source: input
        description: "Web-offset printing cost in cents per catalog page per one thousand books."
        default: 2600
        constraints: ">= 0"
      - name: paper_cost_per_lb_cents
        type: integer
        source: input
        description: "Delivered paper cost in cents per pound."
        default: 92
        constraints: ">= 0"
      - name: paper_oz_per_page_milli
        type: integer
        source: input
        description: "Basis weight expressed as thousandths of an ounce of paper per catalog page."
        default: 40
        constraints: "> 0"
      - name: usable_sq_in_per_page
        type: integer
        source: input
        description: "Sellable square inches on one catalog page after trim and gutter."
        default: 88
        constraints: "> 0"
      - name: default_postage_estimate_cents_per_piece
        type: integer
        source: input
        description: "Planning-stage postage estimate per book, used before any PostalPresortBatch exists."
        default: 55
        constraints: ">= 0"
      - name: cogs_rate_bps
        type: integer
        source: input
        description: "Cost of goods sold as basis points of demand; gross margin rate is 10000 - cogs_rate_bps."
        default: 5800
        constraints: "0..10000"
      - name: prospect_base_response_bps
        type: integer
        source: input
        description: "Baseline response rate in basis points for a rented prospect name before coop model lift."
        default: 110
        constraints: ">= 0"
      - name: prospect_avg_order_value_cents
        type: integer
        source: input
        description: "Average order value in cents assumed for every rented prospect name."
        default: 11800
        constraints: ">= 0"
      - name: min_inhome_gap_days
        type: integer
        source: input
        description: "Minimum whole-day separation required between two in-home dates that target the same audience."
        default: 21
        constraints: ">= 0"
      - name: fatigue_window_days
        type: integer
        source: input
        description: "Look-back window in whole days for the contact fatigue aggregation."
        default: 90
        constraints: "> 0"
      - name: fatigue_suppression_threshold
        type: integer
        source: input
        description: "Weighted fatigue points at or above which a HousefileSegment is forced to SUPPRESS_ONLY."
        default: 100
        constraints: "> 0"

  - name: HousefileSegment
    parent: CatalogSeason
    common_fields: true
    entity_kind: resource
    fields:
      - name: season_id
        type: string
        source: input
        description: "FK -> CatalogSeason.id; the season whose rate card and thresholds govern this segment."
      - name: parent_segment_id
        type: string
        source: input
        description: "FK -> HousefileSegment.id; null for a top-level segment. A segment with at least one child is a roll-up node and is excluded from merge-purge gross input."
        default: null
        constraints: "must belong to the same season_id; self-reference forbidden; cycles forbidden -> ERR_SEGMENT_CYCLE"
      - name: segment_code
        type: string
        source: input
        description: "Segment identifier such as HF_BEST_0_90."
        constraints: "unique per season_id -> ERR_DUPLICATE_SEGMENT_CODE"
      - name: recency_days
        type: integer
        source: input
        description: "Whole days since the segment's representative most-recent order."
        constraints: ">= 0"
      - name: orders_12mo
        type: integer
        source: input
        description: "Representative order count over the trailing twelve months (the F in RFM)."
        constraints: ">= 0"
      - name: ltv_cents
        type: integer
        source: input
        description: "Representative lifetime monetary value in cents (the M in RFM)."
        constraints: ">= 0"
      - name: housefile_count
        type: integer
        source: input
        description: "Mailable name count owned directly by this segment, excluding descendants."
        constraints: ">= 0"
      - name: avg_order_value_cents
        type: integer
        source: input
        description: "Average order value in cents used to convert forecast orders into forecast demand."
        constraints: ">= 0"
      - name: historical_response_rate_bps
        type: integer
        source: input
        description: "Observed catalog response rate in basis points for this segment."
        constraints: "0..10000"
      - name: rfm_score
        type: integer
        source: computed
        description: "Weighted RFM score 0..1000 produced by calculations.segment_rfm_score."
      - name: segment_tier
        type: enum
        source: computed
        description: "RFM band produced by calculations.segment_rfm_score."
        constraints: "BEST | CORE | OCCASIONAL | LAPSED | DORMANT"
      - name: contact_strategy
        type: enum
        source: input
        description: "Contact plan for the segment. Defaulted from segment_tier at creation when omitted; forced to SUPPRESS_ONLY by the fatigue cascade."
        constraints: "PREMIUM_FULL | STANDARD | REACTIVATION | SUPPRESS_ONLY"
      - name: rollup_housefile_count
        type: integer
        source: computed
        description: "housefile_count plus the transitive sum of every descendant segment's housefile_count."
      - name: is_leaf
        type: boolean
        source: computed
        description: "True when no other HousefileSegment declares this segment as parent_segment_id."
      - name: fatigue_score
        type: integer
        source: computed
        description: "Weighted, decayed cross-channel contact pressure produced by calculations.contact_fatigue_score."
        default: 0
      - name: suppressed_at
        type: datetime
        source: system
        description: "Logical-clock instant at which the fatigue cascade forced contact_strategy to SUPPRESS_ONLY; null otherwise."
        default: null

  - name: ProspectListRental
    parent: CatalogSeason
    common_fields: true
    entity_kind: resource
    fields:
      - name: season_id
        type: string
        source: input
        description: "FK -> CatalogSeason.id; the season this rental is bought for."
      - name: list_source_name
        type: string
        source: input
        description: "Broker-facing name of the rented list or coop selection."
      - name: requested_gross_names
        type: integer
        source: input
        description: "Quantity of names ordered from the list owner before delivery."
        constraints: "> 0"
      - name: cost_per_thousand_cents
        type: integer
        source: input
        description: "List rental price in cents per thousand names (CPM)."
        constraints: ">= 0"
      - name: housefile_overlap_bps
        type: integer
        source: input
        description: "Modeled overlap in basis points between this list and the housefile, consumed by merge-purge."
        constraints: "0..10000"
      - name: inter_list_overlap_bps
        type: integer
        source: input
        description: "Modeled overlap in basis points against rentals already processed earlier in the same merge-purge run."
        constraints: "0..10000"
      - name: coop_model_score
        type: integer
        source: input
        description: "Cooperative-database model score supplied at the model step; drives the response lift band."
        default: 0
        constraints: "0..1000"
      - name: expected_response_rate_bps
        type: integer
        source: computed
        description: "Season base prospect response rate adjusted by the coop model lift band; see calculations.rental_expected_response_rate."
        default: 0
      - name: gross_names
        type: integer
        source: system
        description: "Names actually delivered by the list owner; 0 until the deliver transition stamps it."
        default: 0
      - name: net_names_delivered
        type: integer
        source: computed
        description: "gross_names minus this rental's merge-purge duplicate removals; 0 until a COMPLETED MergePurgeRun consumes it."
        default: 0
      - name: unit_cost_cents_per_name
        type: integer
        source: computed
        description: "round_half_up(cost_per_thousand_cents / 1000); added to the drop cost per book for rental lines."
        default: 0
      - name: status
        type: enum
        source: computed
        description: "Rental lifecycle state; see state_machines.ProspectListRental."
        constraints: "REQUESTED | MODELED | ORDERED | DELIVERED | NETTED | CANCELLED"

  - name: MergePurgeRun
    parent: CirculationPlan
    common_fields: true
    entity_kind: event
    fields:
      - name: circulation_plan_id
        type: string
        source: input
        description: "FK -> CirculationPlan.id; the plan whose mailable universe this run establishes."
      - name: input_rental_ids
        type: array
        source: input
        description: "Ordered-at-rest array of ProspectListRental.id string values consumed by this run. Not a single-valued foreign key; every element must resolve to a ProspectListRental whose season_id equals the plan's season_id, otherwise ERR_RENTAL_NOT_FOUND. Reverse lookup of the rentals a plan has processed is served by GET /catalog-circulation/circulation-plans/{id}/merge-purge-runs."
        constraints: "0..20 elements; duplicates forbidden -> ERR_INVALID_REQUEST"
      - name: observed_plan_version
        type: integer
        source: system
        description: "The expected_plan_version supplied by the caller and accepted by the OCC check."
      - name: processing_order
        type: array
        source: computed
        description: "The ProspectListRental.id values in the pinned processing order actually used (coop_model_score DESC, then created_at ASC)."
      - name: housefile_leaf_segment_count
        type: integer
        source: computed
        description: "Number of leaf HousefileSegment rows in the plan's season that entered gross_input_names."
      - name: gross_input_names
        type: integer
        source: computed
        description: "Total names presented to the run before suppression and dedup; see calculations.merge_purge_net_mailable_names."
      - name: suppressed_names
        type: integer
        source: computed
        description: "Names removed because their leaf segment carries contact_strategy SUPPRESS_ONLY."
      - name: duplicates_removed
        type: integer
        source: computed
        description: "Names removed by housefile-versus-list and list-versus-list dedup."
      - name: net_mailable_names
        type: integer
        source: computed
        description: "gross_input_names - suppressed_names - duplicates_removed; the finite universe the allocation waterfall draws from."
      - name: status
        type: enum
        source: computed
        description: "Run lifecycle state; see state_machines.MergePurgeRun."
        constraints: "PENDING | COMPLETED | FAILED | SUPERSEDED | STALE"

  - name: CirculationPlan
    parent: CatalogSeason
    common_fields: true
    entity_kind: resource
    fields:
      - name: season_id
        type: string
        source: input
        description: "FK -> CatalogSeason.id; the season whose rate card prices this plan."
      - name: plan_code
        type: string
        source: input
        description: "Plan identifier such as FALL2026A-CIRC-V1."
        constraints: "unique per season_id -> ERR_DUPLICATE_PLAN_CODE"
      - name: budget_cents
        type: integer
        source: input
        description: "Total circulation budget in cents available to commit across every drop in this plan."
        constraints: "> 0"
      - name: status
        type: enum
        source: computed
        description: "Plan lifecycle state; see state_machines.CirculationPlan."
        constraints: "DRAFT | COSTED | UNDER_REVIEW | APPROVED | CANCELLED"
      - name: revision_round
        type: integer
        source: computed
        description: "Count of completed request-revision back-edges taken by this plan."
        default: 0
      - name: costed_by_user_id
        type: string
        source: system
        description: "X-User-ID of the operator whose cost run produced the current figures; cleared by request-revision."
        default: null
      - name: submitted_by_user_id
        type: string
        source: system
        description: "X-User-ID of the operator who submitted the plan for review; cleared by request-revision."
        default: null
      - name: approved_by_user_id
        type: string
        source: system
        description: "X-User-ID of the CirculationDirector who approved the plan."
        default: null
      - name: committed_cost_cents
        type: integer
        source: computed
        description: "Sum of CirculationLine.committed_cost_cents over lines in status ALLOCATED; debited by the allocation waterfall and credited back by void or suppression."
        default: 0
      - name: uncommitted_budget_cents
        type: integer
        source: computed
        description: "budget_cents - committed_cost_cents; the conserved counterpart in the budget invariant."
      - name: planned_cost_cents
        type: integer
        source: computed
        description: "Sum over ALLOCATED lines of CirculationLine.circulation_cost_cents, i.e. priced at the current drop cost per book rather than at the provisional cost used for commitment."
        default: 0
      - name: planned_demand_cents
        type: integer
        source: computed
        description: "Sum over ALLOCATED lines of CirculationLine.forecast_demand_cents."
        default: 0
      - name: planned_contribution_cents
        type: integer
        source: computed
        description: "Sum over ALLOCATED lines of CirculationLine.contribution_cents; gates approval."
        default: 0

  - name: Drop
    parent: CirculationPlan
    common_fields: true
    entity_kind: resource
    fields:
      - name: circulation_plan_id
        type: string
        source: input
        description: "FK -> CirculationPlan.id; the plan this mailing drop belongs to."
      - name: drop_number
        type: integer
        source: input
        description: "Sequence number of the drop inside its plan."
        constraints: "1..99; unique per circulation_plan_id -> ERR_DUPLICATE_DROP_NUMBER"
      - name: in_home_date
        type: datetime
        source: input
        description: "Scheduled in-home instant for this drop, ISO 8601 UTC with three fractional digits."
        constraints: "must be strictly after the logical clock at creation -> ERR_INHOME_DATE_IN_PAST"
      - name: page_count
        type: integer
        source: input
        description: "Number of catalog pages in this drop's book."
        constraints: "even integer 8..240 -> ERR_INVALID_REQUEST"
      - name: square_inch_capacity
        type: integer
        source: computed
        description: "page_count * CatalogSeason.usable_sq_in_per_page."
      - name: allocated_square_inches
        type: integer
        source: computed
        description: "Sum of PagePlacement.square_inches over this drop's placements."
        default: 0
      - name: unallocated_square_inches
        type: integer
        source: computed
        description: "square_inch_capacity - allocated_square_inches; the conserved counterpart in the space invariant."
      - name: requested_quantity_total
        type: integer
        source: computed
        description: "Sum of CirculationLine.requested_quantity over lines in status PROPOSED or ALLOCATED; the quantity basis for provisional_cost_per_book_cents."
        default: 0
      - name: planned_quantity
        type: integer
        source: computed
        description: "Sum of CirculationLine.mailable_quantity over lines in status ALLOCATED; the quantity basis for cost_per_book_cents."
        default: 0
      - name: weight_oz_milli
        type: integer
        source: computed
        description: "page_count * CatalogSeason.paper_oz_per_page_milli; thousandths of an ounce per book."
      - name: print_rebate_bps
        type: integer
        source: computed
        description: "Printer volume rebate band selected from planned_quantity by calculations.drop_cost_per_book."
        default: 0
      - name: printing_cents_per_book
        type: integer
        source: computed
        description: "Rebated printing component, rounded to whole cents on its own."
        default: 0
      - name: paper_cents_per_book
        type: integer
        source: computed
        description: "Paper component, rounded to whole cents on its own."
        default: 0
      - name: postage_cents_per_book
        type: integer
        source: computed
        description: "Postage component, rounded to whole cents on its own."
        default: 0
      - name: cost_per_book_cents
        type: integer
        source: computed
        description: "printing_cents_per_book + paper_cents_per_book + postage_cents_per_book; see calculations.drop_cost_per_book."
        default: 0
      - name: cost_basis
        type: enum
        source: computed
        description: "Which postage variant produced cost_per_book_cents."
        default: ESTIMATED_POSTAGE
        constraints: "ESTIMATED_POSTAGE | PRESORTED_ACTUAL"
      - name: provisional_cost_per_book_cents
        type: integer
        source: computed
        description: "Pre-allocation cost per book priced off requested_quantity_total and the season postage estimate; the allocation waterfall's unit cost basis, never recomputed after allocation."
        default: 0
      - name: postage_total_cents
        type: integer
        source: computed
        description: "Total presorted postage for the drop after tier fallback, weight surcharge and automation discount; see calculations.drop_postage_total."
        default: 0
      - name: automation_share_bps
        type: integer
        source: computed
        description: "floor(automation-qualified pieces * 10000 / planned_quantity)."
        default: 0
      - name: automation_qualified
        type: boolean
        source: computed
        description: "True when automation_share_bps >= 9000."
        default: false
      - name: production_status
        type: enum
        source: computed
        description: "Production dimension of the drop; advances independently of measurement_status."
        constraints: "PLANNED | PRESORTED | MAILED | DELIVERED | CANCELLED"
      - name: measurement_status
        type: enum
        source: computed
        description: "Measurement dimension of the drop; advances independently of production_status."
        constraints: "PENDING | MATCHBACK_OPEN | MATCHBACK_CLOSED"
      - name: mailed_at
        type: datetime
        source: system
        description: "Logical-clock instant of the mail transition; null before it."
        default: null

  - name: CirculationLine
    parent: Drop
    common_fields: true
    entity_kind: resource
    fields:
      - name: drop_id
        type: string
        source: input
        description: "FK -> Drop.id; the drop this audience line is circulated in."
      - name: housefile_segment_id
        type: string
        source: input
        description: "FK -> HousefileSegment.id; null when audience_type is RENTAL."
        default: null
      - name: prospect_list_rental_id
        type: string
        source: input
        description: "FK -> ProspectListRental.id; null when audience_type is HOUSEFILE."
        default: null
      - name: audience_type
        type: enum
        source: input
        description: "Which audience family this line draws from; must agree with exactly one non-null audience FK."
        constraints: "HOUSEFILE | RENTAL; exactly one of housefile_segment_id / prospect_list_rental_id non-null -> ERR_AUDIENCE_SPEC_INVALID"
      - name: requested_quantity
        type: integer
        source: input
        description: "Names the planner asks for before the allocation waterfall clamps them."
        constraints: "> 0"
      - name: is_holdout
        type: boolean
        source: input
        description: "True when a slice of this line is withheld from mail as a measurement holdout."
        default: false
      - name: holdout_pct_bps
        type: integer
        source: input
        description: "Share of allocated_quantity in basis points withheld from mail; must be 0 when is_holdout is false."
        default: 0
        constraints: "0..5000; non-zero with is_holdout false -> ERR_INVALID_REQUEST"
      - name: allocation_rank
        type: integer
        source: computed
        description: "1-based position this line occupied in the pinned allocation order the last time the waterfall ran; 0 before any run."
        default: 0
      - name: allocated_quantity
        type: integer
        source: computed
        description: "Names granted by the allocation waterfall; 0 while PROPOSED, VOIDED or SUPPRESSED."
        default: 0
      - name: holdout_quantity
        type: integer
        source: computed
        description: "floor(allocated_quantity * holdout_pct_bps / 10000); withheld from mail and from forecast demand."
        default: 0
      - name: mailable_quantity
        type: integer
        source: computed
        description: "allocated_quantity - holdout_quantity; the books actually printed and mailed for this line."
        default: 0
      - name: unit_cost_cents
        type: integer
        source: computed
        description: "Drop.provisional_cost_per_book_cents plus ProspectListRental.unit_cost_cents_per_name for RENTAL lines (0 extra for HOUSEFILE); the waterfall's per-name price."
        default: 0
      - name: committed_cost_cents
        type: integer
        source: computed
        description: "allocated_quantity * unit_cost_cents frozen at allocation time; the exact amount credited back on void or suppression."
        default: 0
      - name: effective_response_bps
        type: integer
        source: computed
        description: "Response rate in basis points actually applied to this line: the segment's historical rate for HOUSEFILE, the rental's expected_response_rate_bps for RENTAL."
        default: 0
      - name: gross_forecast_demand_cents
        type: integer
        source: computed
        description: "PRE_MERGE_GROSS variant of calculations.line_demand_forecast, priced off requested_quantity and ignoring holdout."
        default: 0
      - name: forecast_demand_cents
        type: integer
        source: computed
        description: "POST_MERGE_NET variant of calculations.line_demand_forecast, priced off mailable_quantity; the figure profitability uses."
        default: 0
      - name: gross_margin_cents
        type: integer
        source: computed
        description: "round_half_up(forecast_demand_cents * (10000 - CatalogSeason.cogs_rate_bps) / 10000)."
        default: 0
      - name: circulation_cost_cents
        type: integer
        source: computed
        description: "mailable_quantity * (Drop.cost_per_book_cents + rental unit_cost_cents_per_name); priced at the drop's CURRENT cost per book, not at the provisional cost."
        default: 0
      - name: contribution_cents
        type: integer
        source: computed
        description: "gross_margin_cents - circulation_cost_cents; the per-segment profitability figure."
        default: 0
      - name: status
        type: enum
        source: computed
        description: "Line lifecycle state; see state_machines.CirculationLine."
        constraints: "PROPOSED | ALLOCATED | SUPPRESSED | VOIDED"

  - name: PagePlacement
    parent: Drop
    common_fields: true
    entity_kind: resource
    fields:
      - name: drop_id
        type: string
        source: input
        description: "FK -> Drop.id; the book this SKU is placed in."
      - name: product_sku
        type: string
        source: input
        description: "Merchandising SKU placed on the page."
        constraints: "unique per drop_id -> ERR_DUPLICATE_PLACEMENT_SKU"
      - name: product_name
        type: string
        source: input
        description: "Display name of the placed product."
      - name: unit_price_cents
        type: integer
        source: input
        description: "Catalog selling price of the SKU in cents."
        constraints: ">= 0"
      - name: unit_cogs_cents
        type: integer
        source: input
        description: "Cost of goods for the SKU in cents."
        constraints: ">= 0"
      - name: demand_per_sq_inch_cents
        type: integer
        source: input
        description: "Historical demand in cents generated per square inch of space for this SKU at INSIDE position."
        constraints: ">= 0"
      - name: page_number
        type: integer
        source: input
        description: "Page of the book this placement occupies."
        constraints: "1..Drop.page_count -> ERR_INVALID_REQUEST"
      - name: sq_in_offset
        type: integer
        source: input
        description: "Left edge of the occupied area on the page, measured in square inches consumed from the page origin."
        constraints: ">= 0"
      - name: square_inches
        type: integer
        source: input
        description: "Area consumed by the placement; occupies the half-open interval [sq_in_offset, sq_in_offset + square_inches) on page_number."
        constraints: "> 0"
      - name: placement_position
        type: enum
        source: input
        description: "Merchandising position class, which sets the demand multiplier."
        constraints: "FRONT_COVER | HOT_SPOT | INSIDE | BACK_COVER"
      - name: position_multiplier_bps
        type: integer
        source: computed
        description: "Multiplier band selected from placement_position: FRONT_COVER 18000, HOT_SPOT 14000, BACK_COVER 13000, INSIDE 10000."
      - name: forecast_space_demand_cents
        type: integer
        source: computed
        description: "round_half_up(square_inches * demand_per_sq_inch_cents * position_multiplier_bps / 10000)."
      - name: space_productivity_cents_per_sq_in
        type: integer
        source: computed
        description: "round_half_up(forecast_space_demand_cents / square_inches)."

  - name: PostalPresortBatch
    parent: Drop
    common_fields: false
    entity_kind: event
    fields:
      - name: drop_id
        type: string
        source: input
        description: "FK -> Drop.id; the drop whose mail stream this presort batch belongs to."
      - name: declared_tier
        type: enum
        source: input
        description: "Presort tier the mail-shop claims for this batch before qualification is checked."
        constraints: "FIVE_DIGIT | THREE_DIGIT | AADC | MIXED_AADC"
      - name: piece_count
        type: integer
        source: input
        description: "Books in this batch."
        constraints: "> 0"
      - name: effective_tier
        type: enum
        source: computed
        description: "declared_tier when piece_count clears its tier minimum, otherwise MIXED_AADC; see calculations.drop_postage_total."
        constraints: "FIVE_DIGIT | THREE_DIGIT | AADC | MIXED_AADC"
      - name: rate_cents_per_piece
        type: integer
        source: computed
        description: "Base rate of effective_tier in cents per piece."
      - name: weight_surcharge_cents_per_piece
        type: integer
        source: computed
        description: "round_half_up(max(0, Drop.weight_oz_milli - 4000) * 9 / 1000)."
      - name: batch_postage_cents
        type: integer
        source: computed
        description: "piece_count * (rate_cents_per_piece + weight_surcharge_cents_per_piece)."
      - name: is_automation_qualified
        type: boolean
        source: computed
        description: "True when effective_tier is one of FIVE_DIGIT, THREE_DIGIT, AADC."

  - name: ContactEvent
    parent: HousefileSegment
    common_fields: false
    entity_kind: event
    fields:
      - name: housefile_segment_id
        type: string
        source: input
        description: "FK -> HousefileSegment.id; the audience that received this contact."
      - name: drop_id
        type: string
        source: input
        description: "FK -> Drop.id; null for EMAIL and DIGITAL contacts that are not tied to a catalog drop."
        default: null
      - name: channel
        type: enum
        source: input
        description: "Contact channel; sets the fatigue weight (MAIL 40, EMAIL 12, DIGITAL 6)."
        constraints: "MAIL | EMAIL | DIGITAL"
      - name: contact_date
        type: datetime
        source: input
        description: "Instant the contact reached the audience, ISO 8601 UTC with three fractional digits."
      - name: source
        type: enum
        source: computed
        description: "DROP_MAIL_CASCADE when the row was synthesized by the drop mail transition, MANUAL_LOG when posted through POST /catalog-circulation/contact-events."
        constraints: "DROP_MAIL_CASCADE | MANUAL_LOG"
      - name: channel_weight
        type: integer
        source: computed
        description: "Raw fatigue weight of channel before decay."
      - name: decay_factor_bps
        type: integer
        source: computed
        description: "Step-decay factor in basis points selected from whole days between contact_date and the logical clock at the time of the fatigue recompute."
      - name: weighted_points
        type: integer
        source: computed
        description: "round_half_up(channel_weight * decay_factor_bps / 10000) as of the last fatigue recompute."

  - name: SuppressionRule
    parent: CatalogSeason
    common_fields: true
    entity_kind: configuration
    fields:
      - name: season_id
        type: string
        source: input
        description: "FK -> CatalogSeason.id; the season this cap governs."
      - name: rule_code
        type: string
        source: input
        description: "Rule identifier such as CAP_EMAIL_30D."
        constraints: "unique per season_id -> ERR_DUPLICATE_SUPPRESSION_RULE_CODE"
      - name: channel_scope
        type: enum
        source: input
        description: "Channels the cap counts; ALL counts every channel together."
        constraints: "MAIL | EMAIL | DIGITAL | ALL"
      - name: window_days
        type: integer
        source: input
        description: "Trailing whole-day window the cap counts contacts over."
        constraints: "1..365"
      - name: max_contacts_per_window
        type: integer
        source: input
        description: "Maximum in-scope ContactEvent rows permitted per HousefileSegment inside window_days."
        constraints: ">= 0"
      - name: priority
        type: integer
        source: input
        description: "Evaluation order among a season's enabled rules; lower runs first, created_at ASC breaks ties."
        constraints: ">= 1"
      - name: is_enabled
        type: boolean
        source: input
        description: "Whether the cap participates in evaluation."
        default: true

  - name: TestCell
    parent: CirculationLine
    common_fields: true
    entity_kind: resource
    fields:
      - name: circulation_line_id
        type: string
        source: input
        description: "FK -> CirculationLine.id; the line whose names this cell splits out."
      - name: cell_code
        type: string
        source: input
        description: "Cell identifier such as OFFER_FREESHIP_T1."
        constraints: "unique per circulation_line_id -> ERR_DUPLICATE_TEST_CELL_CODE"
      - name: test_type
        type: enum
        source: input
        description: "What the cell varies."
        constraints: "SEGMENT | FORMAT | OFFER"
      - name: cell_role
        type: enum
        source: input
        description: "Role of the cell in the read; at most one CONTROL per line."
        constraints: "TEST | CONTROL | HOLDOUT"
      - name: quantity
        type: integer
        source: input
        description: "Names assigned to this cell."
        constraints: "> 0"
      - name: responders
        type: integer
        source: computed
        description: "Responders recorded by the measure transition; 0 while PLANNED."
        default: 0
      - name: demand_cents
        type: integer
        source: computed
        description: "Demand in cents recorded by the measure transition; 0 while PLANNED."
        default: 0
      - name: response_rate_bps
        type: integer
        source: computed
        description: "round_half_up(responders * 10000 / quantity)."
        default: 0
      - name: lift_bps
        type: integer
        source: computed
        description: "Relative lift against the line's CONTROL cell; see calculations.test_cell_lift."
        default: 0
      - name: significance
        type: enum
        source: computed
        description: "Read verdict produced by calculations.test_cell_lift."
        default: UNMEASURED
        constraints: "UNMEASURED | INSUFFICIENT_SAMPLE | INSUFFICIENT_CONTROL | SIGNIFICANT | NOT_SIGNIFICANT"
      - name: status
        type: enum
        source: computed
        description: "Cell lifecycle state; see state_machines.TestCell."
        constraints: "PLANNED | MEASURED"

  - name: MatchbackRun
    parent: Drop
    common_fields: true
    entity_kind: event
    fields:
      - name: drop_id
        type: string
        source: input
        description: "FK -> Drop.id; the drop this attribution read credits."
      - name: attribution_variant
        type: enum
        source: input
        description: "Which attribution algorithm this run applies; see calculations.matchback_attribution."
        constraints: "LAST_TOUCH_MAIL | FRACTIONAL_MULTI_TOUCH"
      - name: attribution_window_days
        type: integer
        source: input
        description: "Look-back window in whole days from an online order back to a qualifying contact."
        constraints: "1..180 -> ERR_INVALID_REQUEST"
      - name: observed_drop_version
        type: integer
        source: system
        description: "The expected_drop_version supplied by the caller and accepted by the OCC check."
      - name: matched_order_count
        type: integer
        source: computed
        description: "Ingested online orders that had at least one qualifying contact in the window, regardless of which drop was credited."
        default: 0
      - name: attributed_order_count
        type: integer
        source: computed
        description: "Ingested online orders that credited any share of demand to THIS drop."
        default: 0
      - name: unmatched_order_count
        type: integer
        source: computed
        description: "Ingested online orders with no qualifying contact in the window."
        default: 0
      - name: attributed_demand_cents
        type: integer
        source: computed
        description: "Demand in cents credited to this drop under attribution_variant."
        default: 0
      - name: status
        type: enum
        source: computed
        description: "Run lifecycle state; see state_machines.MatchbackRun."
        constraints: "OPEN | FINALIZED | SUPERSEDED"
      - name: finalized_at
        type: datetime
        source: system
        description: "Logical-clock instant of the finalize transition; null before it."
        default: null

# -----------------------------------------------------------------------------
# §1.2 State Machine Table
# -----------------------------------------------------------------------------
state_machines:

  # --- CYCLIC: two revision back-edges plus an automatic invalidation edge ----
  - entity: CirculationPlan
    dimension: status
    initial_state: DRAFT
    terminal_states: [CANCELLED]
    shape: cyclic
    transitions:
      - from: DRAFT
        to: COSTED
        trigger: "POST /catalog-circulation/circulation-plans/{id}/cost"
        actor: CirculationPlanner
        preconditions:
          - "plan.status == DRAFT"
          - "at least one Drop exists with circulation_plan_id == plan.id and production_status != CANCELLED"
          - "at least one CirculationLine in status ALLOCATED exists across the plan's non-CANCELLED drops, else ERR_INVALID_PLAN_STATE (individual drops may still be empty or wholly unallocated)"
          - "at least one MergePurgeRun exists for this plan in status COMPLETED, else ERR_MERGE_PURGE_REQUIRED"
        side_effects:
          - "for every Drop of the plan with production_status in {PLANNED, PRESORTED}: recompute calculations.drop_cost_per_book with variant ESTIMATED_POSTAGE and set Drop.cost_basis = ESTIMATED_POSTAGE"
          - "recompute CirculationLine.circulation_cost_cents, gross_margin_cents and contribution_cents for every ALLOCATED line of those drops"
          - "recompute plan.planned_cost_cents, plan.planned_demand_cents, plan.planned_contribution_cents"
          - "set plan.costed_by_user_id = X-User-ID of this request"
          - "increments CirculationPlan.version by 1"
        note: "Does NOT re-run the allocation waterfall and does NOT touch Drop.provisional_cost_per_book_cents or CirculationLine.committed_cost_cents."

      - from: COSTED
        to: UNDER_REVIEW
        trigger: "POST /catalog-circulation/circulation-plans/{id}/submit-review"
        actor: CirculationPlanner
        preconditions:
          - "plan.status == COSTED"
        side_effects:
          - "set plan.submitted_by_user_id = X-User-ID of this request"
          - "increments CirculationPlan.version by 1"

      - from: UNDER_REVIEW
        to: DRAFT
        trigger: "POST /catalog-circulation/circulation-plans/{id}/request-revision"
        actor: CirculationDirector
        preconditions:
          - "plan.status == UNDER_REVIEW"
        side_effects:
          - "increment plan.revision_round by 1"
          - "set plan.costed_by_user_id = null and plan.submitted_by_user_id = null"
          - "increments CirculationPlan.version by 1"
        note: "Back-edge 1 of the cycle. Clearing both user ids means the segregation-of-duties check on the next approve is evaluated against the operators of the NEW cost/submit pair only."

      - from: APPROVED
        to: DRAFT
        trigger: "POST /catalog-circulation/circulation-plans/{id}/request-revision"
        actor: CirculationDirector
        preconditions:
          - "plan.status == APPROVED"
          - "no Drop of the plan has production_status in {MAILED, DELIVERED}, else ERR_INVALID_PLAN_STATE"
        side_effects:
          - "increment plan.revision_round by 1"
          - "set plan.costed_by_user_id = null, plan.submitted_by_user_id = null, plan.approved_by_user_id = null"
          - "every Drop of the plan whose production_status == PRESORTED reverts to PLANNED, its PostalPresortBatch rows are deleted, postage_total_cents / automation_share_bps / automation_qualified reset to 0/0/false, and calculations.drop_cost_per_book is recomputed with variant ESTIMATED_POSTAGE (cost_basis = ESTIMATED_POSTAGE)"
          - "recompute plan.planned_cost_cents, plan.planned_demand_cents, plan.planned_contribution_cents"
          - "increments CirculationPlan.version by 1"
        note: "Back-edge 2 of the cycle: reopening an approved plan is legal only before any book has gone into the mail stream."

      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /catalog-circulation/circulation-plans/{id}/approve"
        actor: CirculationDirector
        preconditions:
          - "plan.status == UNDER_REVIEW"
          - "X-User-ID != plan.costed_by_user_id AND X-User-ID != plan.submitted_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
          - "plan.planned_contribution_cents >= 0, else ERR_PLAN_CONTRIBUTION_NEGATIVE"
        side_effects:
          - "set plan.approved_by_user_id = X-User-ID of this request"
          - "increments CirculationPlan.version by 1"

      - from: COSTED
        to: DRAFT
        trigger: "system: any structural mutation of a Drop or CirculationLine belonging to the plan (PATCH /catalog-circulation/drops/{id}, POST /catalog-circulation/drops/{id}/circulation-lines, POST /catalog-circulation/drops/{id}/allocate, POST /catalog-circulation/circulation-lines/{id}/void, or a cascade that voids or suppresses one of the plan's lines)"
        actor: system
        preconditions:
          - "plan.status == COSTED"
        side_effects:
          - "recompute plan.planned_cost_cents, plan.planned_demand_cents, plan.planned_contribution_cents"
          - "increments CirculationPlan.version by 1"
        note: "Automatic invalidation edge: costed figures are only trustworthy while the drop/line structure is frozen. A plan in DRAFT, UNDER_REVIEW or APPROVED is unaffected by this edge; UNDER_REVIEW and APPROVED plans reject those mutations outright with ERR_PLAN_NOT_EDITABLE."

      - from: DRAFT
        to: CANCELLED
        trigger: "POST /catalog-circulation/circulation-plans/{id}/cancel"
        actor: CirculationDirector
        preconditions:
          - "plan.status in {DRAFT, COSTED, UNDER_REVIEW, APPROVED}"
          - "no Drop of the plan has production_status in {MAILED, DELIVERED}, else ERR_INVALID_PLAN_STATE"
        side_effects:
          - "every CirculationLine of the plan in status PROPOSED or ALLOCATED transitions to VOIDED (allocated_quantity, holdout_quantity, mailable_quantity, forecast_demand_cents, gross_margin_cents, circulation_cost_cents, contribution_cents all set to 0)"
          - "each such line credits its committed_cost_cents back to plan.committed_cost_cents and then has committed_cost_cents set to 0"
          - "every Drop of the plan with production_status in {PLANNED, PRESORTED} moves to production_status CANCELLED"
          - "every MergePurgeRun of the plan in status COMPLETED moves to SUPERSEDED"
          - "recompute plan.uncommitted_budget_cents, planned_cost_cents, planned_demand_cents, planned_contribution_cents"
          - "increments CirculationPlan.version by 1"

      - from: COSTED
        to: CANCELLED
        trigger: "POST /catalog-circulation/circulation-plans/{id}/cancel"
        actor: CirculationDirector
        preconditions: ["plan.status == COSTED", "no Drop of the plan has production_status in {MAILED, DELIVERED}"]
        side_effects: ["identical to the DRAFT -> CANCELLED side-effect set"]

      - from: UNDER_REVIEW
        to: CANCELLED
        trigger: "POST /catalog-circulation/circulation-plans/{id}/cancel"
        actor: CirculationDirector
        preconditions: ["plan.status == UNDER_REVIEW", "no Drop of the plan has production_status in {MAILED, DELIVERED}"]
        side_effects: ["identical to the DRAFT -> CANCELLED side-effect set"]

      - from: APPROVED
        to: CANCELLED
        trigger: "POST /catalog-circulation/circulation-plans/{id}/cancel"
        actor: CirculationDirector
        preconditions: ["plan.status == APPROVED", "no Drop of the plan has production_status in {MAILED, DELIVERED}"]
        side_effects: ["identical to the DRAFT -> CANCELLED side-effect set"]

  # --- PARALLEL DIMENSION 1 of 2 on Drop ------------------------------------
  - entity: Drop
    dimension: production_status
    initial_state: PLANNED
    terminal_states: [DELIVERED, CANCELLED]
    shape: parallel_dimension
    note: "This dimension evolves independently of Drop.measurement_status: a drop can sit at DELIVERED with measurement_status still PENDING, and can advance MAILED -> DELIVERED while measurement_status is MATCHBACK_OPEN. Only one guard couples them (see the measurement_status PENDING -> MATCHBACK_OPEN transition)."
    transitions:
      - from: PLANNED
        to: PRESORTED
        trigger: "POST /catalog-circulation/drops/{id}/presort"
        actor: CirculationPlanner
        preconditions:
          - "drop.production_status == PLANNED"
          - "drop.circulation_plan_id resolves to a plan with status == APPROVED, else ERR_INVALID_PLAN_STATE"
          - "drop.planned_quantity > 0"
          - "sum of PostalPresortBatch.piece_count for this drop == drop.planned_quantity, else ERR_PRESORT_COVERAGE_MISMATCH"
        side_effects:
          - "recompute calculations.drop_postage_total from this drop's PostalPresortBatch rows and set drop.postage_total_cents, automation_share_bps, automation_qualified"
          - "recompute calculations.drop_cost_per_book with variant PRESORTED_ACTUAL and set drop.cost_basis = PRESORTED_ACTUAL"
          - "recompute CirculationLine.circulation_cost_cents and contribution_cents for every ALLOCATED line of this drop"
          - "recompute plan.planned_cost_cents, planned_demand_cents, planned_contribution_cents (plan.status is NOT changed by this recompute)"
          - "increments Drop.version by 1"

      - from: PRESORTED
        to: MAILED
        trigger: "POST /catalog-circulation/drops/{id}/mail"
        actor: CirculationPlanner
        preconditions:
          - "drop.production_status == PRESORTED"
          - "drop.in_home_date <= logical clock now, else ERR_INVALID_DROP_STATE"
        side_effects:
          - "set drop.mailed_at = logical clock now"
          - "CASCADE HOP 1: for every CirculationLine of this drop in status ALLOCATED with housefile_segment_id != null, create a ContactEvent { housefile_segment_id, drop_id, channel: MAIL, contact_date: drop.in_home_date, source: DROP_MAIL_CASCADE }"
          - "CASCADE HOP 2: because each ContactEvent row now exists, recompute calculations.contact_fatigue_score for its HousefileSegment"
          - "CASCADE HOP 3: because that recomputed fatigue_score changed, any segment whose fatigue_score >= CatalogSeason.fatigue_suppression_threshold has contact_strategy set to SUPPRESS_ONLY and suppressed_at set to the logical clock now"
          - "CASCADE HOP 4: because that segment flipped to SUPPRESS_ONLY, every CirculationLine referencing it in status PROPOSED or ALLOCATED whose parent Drop has production_status == PLANNED transitions to SUPPRESSED with allocated_quantity, holdout_quantity, mailable_quantity, forecast_demand_cents, gross_margin_cents, circulation_cost_cents and contribution_cents set to 0"
          - "CASCADE HOP 5: because each of those lines left ALLOCATED, its committed_cost_cents is credited back to plan.committed_cost_cents (then zeroed on the line), its parent Drop's requested_quantity_total and planned_quantity are recomputed, calculations.drop_cost_per_book is re-run for that drop, and the owning plan's planned_* aggregates plus uncommitted_budget_cents are recomputed"
          - "increments Drop.version by 1"
        note: "Cascade depth 5, each hop caused by the previous hop rather than by the mail action. Lines on drops already PRESORTED or beyond are NOT suppressed - the book is already committed to production."

      - from: MAILED
        to: DELIVERED
        trigger: "POST /catalog-circulation/drops/{id}/deliver"
        actor: CirculationPlanner
        preconditions:
          - "drop.production_status == MAILED"
        side_effects:
          - "increments Drop.version by 1"
        note: "measurement_status is deliberately untouched here - the two dimensions do not synchronise."

      - from: PRESORTED
        to: PLANNED
        trigger: "system: POST /catalog-circulation/circulation-plans/{id}/request-revision on an APPROVED plan"
        actor: system
        preconditions:
          - "drop.production_status == PRESORTED"
        side_effects:
          - "delete this drop's PostalPresortBatch rows; reset postage_total_cents to 0, automation_share_bps to 0, automation_qualified to false"
          - "recompute calculations.drop_cost_per_book with variant ESTIMATED_POSTAGE; set cost_basis = ESTIMATED_POSTAGE"
          - "increments Drop.version by 1"

      - from: PLANNED
        to: CANCELLED
        trigger: "system: POST /catalog-circulation/circulation-plans/{id}/cancel"
        actor: system
        preconditions: ["drop.production_status == PLANNED"]
        side_effects: ["increments Drop.version by 1"]

      - from: PRESORTED
        to: CANCELLED
        trigger: "system: POST /catalog-circulation/circulation-plans/{id}/cancel"
        actor: system
        preconditions: ["drop.production_status == PRESORTED"]
        side_effects: ["delete this drop's PostalPresortBatch rows", "increments Drop.version by 1"]

  # --- PARALLEL DIMENSION 2 of 2 on Drop ------------------------------------
  - entity: Drop
    dimension: measurement_status
    initial_state: PENDING
    terminal_states: [MATCHBACK_CLOSED]
    shape: parallel_dimension
    transitions:
      - from: PENDING
        to: MATCHBACK_OPEN
        trigger: "POST /catalog-circulation/drops/{id}/matchback-runs"
        actor: MarketingAnalyst
        preconditions:
          - "drop.measurement_status == PENDING"
          - "drop.production_status in {MAILED, DELIVERED}, else ERR_INVALID_DROP_STATE"
          - "payload expected_drop_version == drop.version, else ERR_STALE_DROP_VERSION"
        side_effects:
          - "create a MatchbackRun in status OPEN and compute calculations.matchback_attribution for it"
          - "increments Drop.version by 1"
        note: "The only guard that couples the two Drop dimensions. It reads production_status but does not change it."

      - from: MATCHBACK_OPEN
        to: MATCHBACK_OPEN
        trigger: "POST /catalog-circulation/drops/{id}/matchback-runs"
        actor: MarketingAnalyst
        preconditions:
          - "drop.measurement_status == MATCHBACK_OPEN"
          - "drop.production_status in {MAILED, DELIVERED}"
          - "payload expected_drop_version == drop.version, else ERR_STALE_DROP_VERSION"
        side_effects:
          - "every existing MatchbackRun of this drop in status OPEN or FINALIZED moves to SUPERSEDED"
          - "create a new MatchbackRun in status OPEN and compute calculations.matchback_attribution for it"
          - "increments Drop.version by 1"
        note: "Self-loop: a re-read supersedes the prior read. This is the CREATE-with-supersede shape that concurrency_rules.matchback-run-create-stale-drop guards."

      - from: MATCHBACK_OPEN
        to: MATCHBACK_CLOSED
        trigger: "POST /catalog-circulation/matchback-runs/{id}/finalize"
        actor: MarketingAnalyst
        preconditions:
          - "drop.measurement_status == MATCHBACK_OPEN"
          - "run.status == OPEN, else ERR_INVALID_MATCHBACK_STATE"
        side_effects:
          - "run.status = FINALIZED, run.finalized_at = logical clock now"
          - "increments Drop.version by 1"

  # --- BRANCHING FORK with divergent side-effect sets ------------------------
  - entity: MergePurgeRun
    dimension: status
    initial_state: PENDING
    terminal_states: [FAILED, SUPERSEDED, STALE]
    shape: branching
    transitions:
      - from: PENDING
        to: COMPLETED
        trigger: "POST /catalog-circulation/circulation-plans/{id}/merge-purge-runs"
        actor: ListBroker
        preconditions:
          - "payload expected_plan_version == plan.version, else ERR_STALE_PLAN_VERSION"
          - "plan.status in {DRAFT, COSTED}, else ERR_PLAN_NOT_EDITABLE"
          - "every element of input_rental_ids resolves to a ProspectListRental with status == DELIVERED and season_id == plan.season_id, else ERR_RENTAL_NOT_NETTED"
          - "the run's computed net_mailable_names > 0 (the COMPLETED branch of the fork)"
        side_effects:
          - "run.gross_input_names, suppressed_names, duplicates_removed, net_mailable_names, processing_order and housefile_leaf_segment_count are set by calculations.merge_purge_net_mailable_names"
          - "every rental in input_rental_ids transitions DELIVERED -> NETTED and has net_names_delivered set to its post-dedup count"
          - "every OTHER MergePurgeRun of this plan in status COMPLETED moves to SUPERSEDED"
          - "run.observed_plan_version = payload expected_plan_version"
          - "increments CirculationPlan.version by 1"

      - from: PENDING
        to: FAILED
        trigger: "POST /catalog-circulation/circulation-plans/{id}/merge-purge-runs"
        actor: ListBroker
        preconditions:
          - "payload expected_plan_version == plan.version"
          - "plan.status in {DRAFT, COSTED}"
          - "the run's computed net_mailable_names == 0 (the FAILED branch of the fork)"
        side_effects:
          - "run.gross_input_names, suppressed_names, duplicates_removed and net_mailable_names are still persisted for audit"
          - "NO rental transitions to NETTED and no net_names_delivered is written - this is the branch-divergent side effect"
          - "NO other MergePurgeRun of this plan is superseded - a previously COMPLETED universe survives a failed re-run"
          - "run.observed_plan_version = payload expected_plan_version"
          - "increments CirculationPlan.version by 1"
        note: "Fork point: the two branches differ in whether rentals are netted and whether the prior universe is retired, so the branch taken is observable well beyond run.status."

      - from: COMPLETED
        to: SUPERSEDED
        trigger: "system: a later POST /catalog-circulation/circulation-plans/{id}/merge-purge-runs takes the COMPLETED branch, or the plan is cancelled"
        actor: system
        preconditions: ["run.status == COMPLETED"]
        side_effects: ["none beyond the status change and updated_at refresh"]

      - from: COMPLETED
        to: STALE
        trigger: "system: POST /catalog-circulation/prospect-list-rentals/{id}/cancel where rental_id is in run.input_rental_ids"
        actor: system
        preconditions: ["run.status == COMPLETED", "the cancelled rental id is an element of run.input_rental_ids"]
        side_effects:
          - "recompute run.gross_input_names, suppressed_names, duplicates_removed and net_mailable_names with the cancelled rental excluded from the input set and from processing_order"
          - "the names conservation invariant gross_input_names == net_mailable_names + suppressed_names + duplicates_removed must still hold after the recompute"
        note: "STALE is terminal: the universe is no longer trustworthy, and a fresh run must be created to restore a COMPLETED universe."

  # --- Rental lifecycle with a branch-out to CANCELLED from every live state --
  - entity: ProspectListRental
    dimension: status
    initial_state: REQUESTED
    terminal_states: [CANCELLED]
    shape: linear_with_branch_out
    transitions:
      - from: REQUESTED
        to: MODELED
        trigger: "POST /catalog-circulation/prospect-list-rentals/{id}/model"
        actor: ListBroker
        preconditions: ["rental.status == REQUESTED"]
        side_effects:
          - "set rental.coop_model_score from the payload"
          - "recompute calculations.rental_expected_response_rate and set rental.expected_response_rate_bps"
          - "increments ProspectListRental.version by 1"

      - from: MODELED
        to: ORDERED
        trigger: "POST /catalog-circulation/prospect-list-rentals/{id}/order"
        actor: ListBroker
        preconditions: ["rental.status == MODELED"]
        side_effects:
          - "set rental.unit_cost_cents_per_name = round_half_up(cost_per_thousand_cents / 1000)"
          - "increments ProspectListRental.version by 1"

      - from: ORDERED
        to: DELIVERED
        trigger: "POST /catalog-circulation/prospect-list-rentals/{id}/deliver"
        actor: ListBroker
        preconditions: ["rental.status == ORDERED"]
        side_effects:
          - "set rental.gross_names = payload delivered_gross_names"
          - "increments ProspectListRental.version by 1"

      - from: DELIVERED
        to: NETTED
        trigger: "system: a POST /catalog-circulation/circulation-plans/{id}/merge-purge-runs that takes the COMPLETED branch and lists this rental in input_rental_ids"
        actor: system
        preconditions: ["rental.status == DELIVERED"]
        side_effects:
          - "set rental.net_names_delivered to gross_names minus this rental's housefile and inter-list duplicate removals"
          - "increments ProspectListRental.version by 1"

      - from: NETTED
        to: CANCELLED
        trigger: "POST /catalog-circulation/prospect-list-rentals/{id}/cancel"
        actor: ListBroker
        preconditions: ["rental.status != CANCELLED"]
        side_effects:
          - "set rental.net_names_delivered = 0 and rental.gross_names = 0"
          - "every MergePurgeRun in status COMPLETED whose input_rental_ids contains this rental moves to STALE and recomputes its name aggregates without this rental"
          - "CASCADE HOP 1: because the rental's names left the mailable universe, every CirculationLine with prospect_list_rental_id == this rental in status PROPOSED or ALLOCATED transitions to VOIDED with allocated_quantity, holdout_quantity, mailable_quantity, forecast_demand_cents, gross_margin_cents, circulation_cost_cents and contribution_cents set to 0"
          - "CASCADE HOP 2: because each of those lines left ALLOCATED, its committed_cost_cents is credited back to plan.committed_cost_cents (then zeroed on the line) and plan.uncommitted_budget_cents is recomputed"
          - "CASCADE HOP 3: because those lines no longer contribute names, each affected Drop's requested_quantity_total and planned_quantity are recomputed and calculations.drop_cost_per_book is re-run for that drop (keeping the drop's current cost_basis)"
          - "CASCADE HOP 4: because the affected drops' quantities and cost per book changed, each owning plan's planned_cost_cents, planned_demand_cents and planned_contribution_cents are recomputed and any such plan in status COSTED auto-transitions to DRAFT"
          - "increments ProspectListRental.version by 1"
        note: "Cascade depth 4 from a trigger different from the drop-mail cascade. Lines on drops already PRESORTED or beyond are still voided, but their drop's cost_basis is preserved."

      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /catalog-circulation/prospect-list-rentals/{id}/cancel"
        actor: ListBroker
        preconditions: ["rental.status == REQUESTED"]
        side_effects: ["same cascade set as NETTED -> CANCELLED; with no delivered names and no netting, hops 1-4 are no-ops unless a line already references the rental", "increments ProspectListRental.version by 1"]

      - from: MODELED
        to: CANCELLED
        trigger: "POST /catalog-circulation/prospect-list-rentals/{id}/cancel"
        actor: ListBroker
        preconditions: ["rental.status == MODELED"]
        side_effects: ["same cascade set as NETTED -> CANCELLED", "increments ProspectListRental.version by 1"]

      - from: ORDERED
        to: CANCELLED
        trigger: "POST /catalog-circulation/prospect-list-rentals/{id}/cancel"
        actor: ListBroker
        preconditions: ["rental.status == ORDERED"]
        side_effects: ["same cascade set as NETTED -> CANCELLED", "increments ProspectListRental.version by 1"]

      - from: DELIVERED
        to: CANCELLED
        trigger: "POST /catalog-circulation/prospect-list-rentals/{id}/cancel"
        actor: ListBroker
        preconditions: ["rental.status == DELIVERED"]
        side_effects: ["same cascade set as NETTED -> CANCELLED", "increments ProspectListRental.version by 1"]

  # --- CirculationLine -------------------------------------------------------
  - entity: CirculationLine
    dimension: status
    initial_state: PROPOSED
    terminal_states: [SUPPRESSED, VOIDED]
    shape: linear_with_two_exits
    transitions:
      - from: PROPOSED
        to: ALLOCATED
        trigger: "POST /catalog-circulation/drops/{id}/allocate"
        actor: CirculationPlanner
        preconditions:
          - "line.status == PROPOSED"
          - "drop.production_status == PLANNED"
          - "plan.status in {DRAFT, COSTED}, else ERR_PLAN_NOT_EDITABLE"
          - "a MergePurgeRun for the plan exists in status COMPLETED, else ERR_MERGE_PURGE_REQUIRED"
          - "for a HOUSEFILE line: segment.contact_strategy != SUPPRESS_ONLY, else ERR_SEGMENT_SUPPRESSED"
          - "for a RENTAL line: rental.status == NETTED, else ERR_RENTAL_NOT_NETTED"
          - "the waterfall grants this line allocated_quantity >= 1 (a line clamped to 0 stays PROPOSED)"
        side_effects:
          - "set line.allocation_rank, allocated_quantity, holdout_quantity, mailable_quantity, unit_cost_cents and committed_cost_cents per calculations.drop_allocation_waterfall"
          - "debit plan.committed_cost_cents by line.committed_cost_cents and recompute plan.uncommitted_budget_cents"
          - "recompute line.effective_response_bps, gross_forecast_demand_cents and forecast_demand_cents per calculations.line_demand_forecast"
          - "recompute drop.planned_quantity, then calculations.drop_cost_per_book for the drop"
          - "recompute line.gross_margin_cents, circulation_cost_cents and contribution_cents"
          - "recompute plan.planned_cost_cents, planned_demand_cents, planned_contribution_cents; if plan.status == COSTED it auto-transitions to DRAFT"
          - "increments CirculationLine.version by 1 and Drop.version by 1"

      - from: ALLOCATED
        to: VOIDED
        trigger: "POST /catalog-circulation/circulation-lines/{id}/void"
        actor: CirculationPlanner
        preconditions:
          - "line.status == ALLOCATED"
          - "plan.status in {DRAFT, COSTED}, else ERR_PLAN_NOT_EDITABLE"
          - "drop.production_status == PLANNED, else ERR_INVALID_DROP_STATE"
        side_effects:
          - "credit plan.committed_cost_cents back by exactly line.committed_cost_cents, then set line.committed_cost_cents = 0; recompute plan.uncommitted_budget_cents"
          - "set line.allocated_quantity, holdout_quantity, mailable_quantity, forecast_demand_cents, gross_margin_cents, circulation_cost_cents and contribution_cents to 0"
          - "recompute drop.requested_quantity_total, drop.planned_quantity and calculations.drop_cost_per_book for the drop"
          - "recompute plan.planned_cost_cents, planned_demand_cents, planned_contribution_cents; if plan.status == COSTED it auto-transitions to DRAFT"
          - "increments CirculationLine.version by 1 and Drop.version by 1"
        note: "Exact compensation of the ALLOCATED debit: plan.budget_cents == plan.committed_cost_cents + plan.uncommitted_budget_cents holds before and after with no drift."

      - from: PROPOSED
        to: VOIDED
        trigger: "POST /catalog-circulation/circulation-lines/{id}/void"
        actor: CirculationPlanner
        preconditions:
          - "line.status == PROPOSED"
          - "plan.status in {DRAFT, COSTED}"
          - "drop.production_status == PLANNED"
        side_effects:
          - "no budget credit is needed (committed_cost_cents is already 0)"
          - "recompute drop.requested_quantity_total and calculations.drop_cost_per_book for the drop"
          - "recompute plan.planned_* aggregates; if plan.status == COSTED it auto-transitions to DRAFT"
          - "increments CirculationLine.version by 1 and Drop.version by 1"

      - from: ALLOCATED
        to: SUPPRESSED
        trigger: "system: the fatigue cascade of POST /catalog-circulation/drops/{id}/mail flips this line's HousefileSegment to SUPPRESS_ONLY"
        actor: system
        preconditions:
          - "line.status == ALLOCATED"
          - "line.housefile_segment_id != null and that segment just became SUPPRESS_ONLY"
          - "the line's own parent Drop has production_status == PLANNED"
        side_effects:
          - "credit plan.committed_cost_cents back by exactly line.committed_cost_cents, then zero it"
          - "zero allocated_quantity, holdout_quantity, mailable_quantity, forecast_demand_cents, gross_margin_cents, circulation_cost_cents, contribution_cents"
          - "recompute the parent drop's planned_quantity and cost per book, then the owning plan's aggregates; a COSTED plan auto-transitions to DRAFT"
          - "increments CirculationLine.version by 1 and Drop.version by 1"

      - from: PROPOSED
        to: SUPPRESSED
        trigger: "system: the fatigue cascade of POST /catalog-circulation/drops/{id}/mail flips this line's HousefileSegment to SUPPRESS_ONLY"
        actor: system
        preconditions: ["line.status == PROPOSED", "line.housefile_segment_id != null and that segment just became SUPPRESS_ONLY", "the line's own parent Drop has production_status == PLANNED"]
        side_effects: ["recompute the parent drop's requested_quantity_total and cost per book, then the owning plan's aggregates", "increments CirculationLine.version by 1 and Drop.version by 1"]

  # --- TestCell --------------------------------------------------------------
  - entity: TestCell
    dimension: status
    initial_state: PLANNED
    terminal_states: [MEASURED]
    shape: linear
    transitions:
      - from: PLANNED
        to: MEASURED
        trigger: "POST /catalog-circulation/test-cells/{id}/measure"
        actor: MarketingAnalyst
        preconditions:
          - "cell.status == PLANNED, else ERR_INVALID_TEST_CELL_STATE"
          - "the cell's CirculationLine resolves to a Drop with production_status in {MAILED, DELIVERED}, else ERR_INVALID_DROP_STATE"
          - "payload responders <= cell.quantity, else ERR_INVALID_REQUEST"
        side_effects:
          - "set cell.responders and cell.demand_cents from the payload; set cell.response_rate_bps"
          - "recompute calculations.test_cell_lift for this cell AND for every other MEASURED cell on the same CirculationLine (a newly measured CONTROL cell re-reads its siblings)"
          - "increments TestCell.version by 1"

  # --- MatchbackRun ----------------------------------------------------------
  - entity: MatchbackRun
    dimension: status
    initial_state: OPEN
    terminal_states: [SUPERSEDED]
    shape: branching
    transitions:
      - from: OPEN
        to: FINALIZED
        trigger: "POST /catalog-circulation/matchback-runs/{id}/finalize"
        actor: MarketingAnalyst
        preconditions: ["run.status == OPEN", "the run's Drop has measurement_status == MATCHBACK_OPEN"]
        side_effects: ["set run.finalized_at = logical clock now", "drop.measurement_status moves MATCHBACK_OPEN -> MATCHBACK_CLOSED", "increments MatchbackRun.version by 1 and Drop.version by 1"]

      - from: OPEN
        to: SUPERSEDED
        trigger: "system: a later POST /catalog-circulation/drops/{id}/matchback-runs on the same drop"
        actor: system
        preconditions: ["run.status == OPEN"]
        side_effects: ["increments MatchbackRun.version by 1"]

      - from: FINALIZED
        to: SUPERSEDED
        trigger: "system: a later POST /catalog-circulation/drops/{id}/matchback-runs on the same drop"
        actor: system
        preconditions: ["run.status == FINALIZED"]
        side_effects: ["increments MatchbackRun.version by 1"]
        note: "Reaching MATCHBACK_CLOSED does not lock the drop out of a re-read: creating a new run is guarded by the measurement_status MATCHBACK_OPEN self-loop, so a CLOSED drop must not accept a new run (ERR_INVALID_MEASUREMENT_STATE)."

# -----------------------------------------------------------------------------
# §1.2.1 Concurrency Rules (OCC on the parent's version — the only mechanism)
# -----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: merge-purge-create-stale-plan
    parent_entity: CirculationPlan
    write_endpoint: "POST /catalog-circulation/circulation-plans/{id}/merge-purge-runs"
    occ_field: "expected_plan_version"
    description: |
      Creating a MergePurgeRun against a CirculationPlan whose version has advanced since the caller
      last observed it is rejected. A COMPLETED run legitimately supersedes the plan's prior COMPLETED
      universe and re-nets every listed rental, so a caller working from a stale view of the plan would
      retire a universe it never saw and re-net rentals another broker has already consumed.
    error_id: ERR_STALE_PLAN_VERSION
    http_status: 412

  - rule_id: matchback-create-stale-drop
    parent_entity: Drop
    write_endpoint: "POST /catalog-circulation/drops/{id}/matchback-runs"
    occ_field: "expected_drop_version"
    description: |
      Creating a MatchbackRun against a Drop whose version has advanced since the caller last observed
      it is rejected. A new run legitimately supersedes every prior OPEN or FINALIZED run on the drop,
      so a caller working from a stale view of the drop would retire an attribution read produced from
      a cost basis or line set it never observed.
    error_id: ERR_STALE_DROP_VERSION
    http_status: 412

# -----------------------------------------------------------------------------
# §1.3 Calculation Rules
# All money is integer cents; all rates are integer basis points (bps).
# "round_half_up(x)" means Decimal quantize to integer with ROUND_HALF_UP.
# -----------------------------------------------------------------------------
calculations:

  - name: segment_rfm_score
    entity: HousefileSegment
    output_fields: [rfm_score, segment_tier, contact_strategy]
    algorithm_type: weighted_scoring
    trigger: "POST /catalog-circulation/housefile-segments and PATCH /catalog-circulation/housefile-segments/{id}"
    inputs:
      - "recency_days (integer, days since last order)"
      - "orders_12mo (integer, lifetime order count)"
      - "ltv_cents (integer, lifetime spend)"
    constants:
      recency_points_bands: "recency_days <= 90 -> 40; <= 180 -> 30; <= 365 -> 18; <= 730 -> 8; else 0"
      frequency_points_bands: "orders_12mo >= 6 -> 30; >= 3 -> 22; >= 2 -> 14; >= 1 -> 6; else 0"
      monetary_points_bands: "ltv_cents >= 50000 -> 30; >= 25000 -> 22; >= 12000 -> 14; >= 5000 -> 6; else 0"
      scale_factor: 10
      tier_bands: "rfm_score >= 800 -> BEST; >= 600 -> CORE; >= 400 -> OCCASIONAL; >= 200 -> LAPSED; else DORMANT"
      default_strategy_by_tier: "BEST -> PREMIUM_FULL; CORE -> STANDARD; OCCASIONAL -> STANDARD; LAPSED -> REACTIVATION; DORMANT -> SUPPRESS_ONLY"
    formula: |
      recency_points   = band(recency_days)          # 0..40
      frequency_points = band(orders_12mo)      # 0..30
      monetary_points  = band(ltv_cents)    # 0..30
      rfm_score = (recency_points + frequency_points + monetary_points) * 10   # 0..1000, exact, no rounding
      segment_tier  = band(rfm_score)
      contact_strategy = default_strategy_by_tier[segment_tier]
    notes: |
      The three point bands are independent step functions, so the score is exact and rounding never
      enters. Band edges are inclusive on the favourable side: recency_days == 90 scores 40 while 91
      scores 30, and rfm_score == 200 is LAPSED (not DORMANT). contact_strategy is only defaulted from
      the tier; a later fatigue recompute (calculations.contact_fatigue_score) or an explicit PATCH may
      override it, and SUPPRESS_ONLY imposed by fatigue is never reverted by a subsequent RFM recompute.
    precision: "integer, exact"

  - name: rental_expected_response_rate
    entity: ProspectListRental
    output_fields: [expected_response_rate_bps]
    algorithm_type: tiered_pricing
    trigger: "POST /catalog-circulation/prospect-list-rentals/{id}/model"
    inputs:
      - "coop_model_score (integer 0..1000, from the payload)"
      - "CatalogSeason.prospect_base_response_bps (season rate card)"
    constants:
      coop_lift_bands: "coop_model_score >= 800 -> +4000 bps; >= 600 -> +2000 bps; >= 400 -> 0 bps; else -3000 bps"
    formula: |
      coop_lift_bps = band(coop_model_score)
      expected_response_rate_bps = round_half_up(
          season.prospect_base_response_bps * (10000 + coop_lift_bps) / 10000 )
    notes: |
      A cooperative-database model score is a decile rank, not a rate: the score selects a
      multiplicative lift band applied to the season's base prospect response. The lowest band is
      negative, so an unmodelled-quality list responds below the season base.
    precision: "integer bps, ROUND_HALF_UP"

  - name: merge_purge_net_mailable_names
    entity: MergePurgeRun
    output_fields: [gross_input_names, suppressed_names, duplicates_removed, net_mailable_names, processing_order, housefile_leaf_segment_count]
    algorithm_type: chronological
    trigger: "POST /catalog-circulation/circulation-plans/{id}/merge-purge-runs"
    inputs:
      - "every HousefileSegment of the plan's season that is a LEAF (no other segment has parent_segment_id == its id)"
      - "every ProspectListRental named in the payload input_rental_ids"
    constants:
      housefile_priority: "the housefile is always deduplicated against first; rentals are then deduplicated against the housefile and against previously-processed rentals"
      processing_order_key: "coop_model_score DESC, then created_at ASC"
      first_rental_inter_list_rule: "the first rental in processing order has inter_list_dupes = 0 by construction (there is no previously-processed rental to collide with)"
    formula: |
      leaf_segments = every HousefileSegment of plan.season_id with is_leaf == true (no other segment
                      of the season carries parent_segment_id == its id)
      housefile_gross   = sum(seg.housefile_count for seg in leaf_segments)
      suppressed_names  = sum(seg.housefile_count for seg in leaf_segments if seg.contact_strategy == 'SUPPRESS_ONLY')
      rentals           = the ProspectListRental rows named in input_rental_ids
      gross_input_names = housefile_gross + sum(r.gross_names for r in rentals)

      processing_order = [r.id for r in rentals sorted by (coop_model_score DESC, created_at ASC)]
      duplicates_removed = 0
      for index, r in enumerate(processing_order):          # index 0 is the first rental
          hf_dupes = floor(r.gross_names * r.housefile_overlap_bps / 10000)
          if index == 0:
              inter_dupes = 0
          else:
              inter_dupes = floor((r.gross_names - hf_dupes) * r.inter_list_overlap_bps / 10000)
          r.net_names_delivered = r.gross_names - hf_dupes - inter_dupes
          duplicates_removed += hf_dupes + inter_dupes

      net_mailable_names = gross_input_names - suppressed_names - duplicates_removed
    invariant: "gross_input_names == net_mailable_names + suppressed_names + duplicates_removed (compensating invariant, must hold after a COMPLETED run and after a COMPLETED -> STALE recompute)"
    notes: |
      Order sensitivity is the point: the first list in processing order pays no inter-list penalty, so
      swapping two rentals with different gross_names/inter_list_overlap_bps changes duplicates_removed
      and therefore net_mailable_names. Only LEAF segments are counted - counting a parent roll-up
      alongside its children would double-count the housefile. Both dedup steps floor, never round.
    precision: "integer names; floor on both duplicate components"

  - name: drop_postage_total
    entity: Drop
    output_fields: [postage_total_cents, automation_share_bps, automation_qualified]
    algorithm_type: threshold
    trigger: "POST /catalog-circulation/drops/{id}/presort"
    inputs:
      - "every PostalPresortBatch of the drop (piece_count, declared_tier)"
      - "drop.planned_quantity"
      - "drop.weight_oz_milli (derived from page_count; see drop_piece_weight)"
    constants:
      tier_rate_cents: "FIVE_DIGIT 42; THREE_DIGIT 47; AADC 51; MIXED_AADC 58"
      tier_minimum_pieces: "FIVE_DIGIT 150; THREE_DIGIT 150; AADC 150; MIXED_AADC 0"
      fallback_tier: "MIXED_AADC"
      automation_tiers: "FIVE_DIGIT, THREE_DIGIT, AADC (MIXED_AADC is non-automation)"
      automation_qualification_threshold_bps: 9000
      automation_discount_cents_per_piece: 2
      weight_free_allowance_oz_milli: 4000
      weight_surcharge_cents_per_oz: 9
    formula: |
      excess_oz_milli   = max(0, drop.weight_oz_milli - 4000)
      weight_surcharge_cents = round_half_up(excess_oz_milli * 9 / 1000)

      automation_pieces = 0
      batch_postage_sum = 0
      for b in batches of the drop:
          effective_tier = b.declared_tier if b.piece_count >= tier_minimum_pieces[b.declared_tier] else 'MIXED_AADC'
          b.effective_tier = effective_tier
          b.rate_cents_per_piece = tier_rate_cents[effective_tier]
          b.batch_postage_cents = b.piece_count * (b.rate_cents_per_piece + weight_surcharge_cents)
          batch_postage_sum += b.batch_postage_cents
          if effective_tier in automation_tiers:
              automation_pieces += b.piece_count

      automation_share_bps = floor(automation_pieces * 10000 / drop.planned_quantity)
      automation_qualified = automation_share_bps >= 9000
      automation_discount_cents = (2 * automation_pieces) if automation_qualified else 0
      postage_total_cents = batch_postage_sum - automation_discount_cents
    notes: |
      Two independent thresholds compose. (1) A per-batch minimum-volume threshold: a batch that misses
      its tier's minimum piece count falls back to MIXED_AADC, which both raises its rate and removes
      its pieces from the automation numerator. (2) A drop-level automation-share threshold: the
      per-piece discount is all-or-nothing at exactly 9000 bps, and the share is floored, so a single
      piece moved out of an automation batch can drop the share below the line and cost the whole
      discount. The weight surcharge is computed once per drop and added to every batch's per-piece
      rate before multiplication - not applied to the batch total afterwards.
    precision: "integer cents; ROUND_HALF_UP on the surcharge, floor on automation_share_bps"

  - name: drop_piece_weight
    entity: Drop
    output_fields: [weight_oz_milli, square_inch_capacity]
    algorithm_type: aggregation
    trigger: "POST /catalog-circulation/circulation-plans/{id}/drops and PATCH /catalog-circulation/drops/{id}"
    inputs:
      - "drop.page_count"
      - "CatalogSeason.paper_oz_per_page_milli"
      - "CatalogSeason.usable_sq_in_per_page"
    formula: |
      weight_oz_milli = drop.page_count * season.paper_oz_per_page_milli
      square_inch_capacity  = drop.page_count * season.usable_sq_in_per_page
    notes: |
      Both are exact integer products of the page count and the season rate card, recomputed whenever
      page_count changes. square_inch_capacity is the denominator of the page-space compensating
      invariant (capacity == allocated_square_inches + unallocated_square_inches), so shrinking
      page_count below the already-allocated square inches must be rejected
      (ERR_DROP_SQ_IN_CAPACITY_EXCEEDED) rather than silently producing a negative remainder.
    precision: "integer, exact"

  - name: drop_provisional_cost_per_book
    entity: Drop
    output_fields: [provisional_cost_per_book_cents]
    algorithm_type: tiered_pricing
    variants: [PROVISIONAL_REQUESTED]
    trigger: "POST /catalog-circulation/drops/{id}/allocate (computed once, before the waterfall runs)"
    inputs:
      - "drop.requested_quantity_total = sum of requested_quantity over the drop's CirculationLine rows in status PROPOSED"
      - "drop.page_count, season rate card"
    constants:
      print_rebate_bands: "quantity >= 100000 -> 800 bps; >= 40000 -> 500 bps; else 0 bps"
    formula: |
      rebate_bps  = band(drop.requested_quantity_total)
      printing_cents = round_half_up( drop.page_count * season.print_cost_per_page_per_thousand_cents / 1000
                                      * (10000 - rebate_bps) / 10000 )
      paper_cents    = round_half_up( drop.page_count * season.paper_oz_per_page_milli / 1000 / 16
                                      * season.paper_cost_per_lb_cents )
      postage_cents  = season.default_postage_estimate_cents_per_piece
      provisional_cost_per_book_cents = printing_cents + paper_cents + postage_cents
    notes: |
      PINNED ORDERING - the provisional unit cost is priced off the REQUESTED universe (the quantity the
      planner asked for), because the printer quotes a rebate band before any book is allocated. The
      waterfall then spends the budget at this provisional rate, and the allocation it produces has a
      smaller planned_quantity that may sit in a LOWER rebate band. The provisional rate is deliberately
      NOT recomputed after allocation: recomputing it would change every line's unit_cost, which would
      change every allocated_quantity, which would change planned_quantity and hence the rebate band
      again. committed_cost_cents is frozen at the provisional rate; drop.cost_per_book_cents (the final
      figure) is computed separately from planned_quantity and will normally differ.
    precision: "integer cents; ROUND_HALF_UP per component"

  - name: drop_cost_per_book
    entity: Drop
    output_fields: [printing_cents_per_book, paper_cents_per_book, postage_cents_per_book, cost_per_book_cents, cost_basis]
    algorithm_type: tiered_pricing
    variants: [ESTIMATED_POSTAGE, PRESORTED_ACTUAL]
    trigger: "POST /catalog-circulation/circulation-plans/{id}/cost (ESTIMATED_POSTAGE), POST /catalog-circulation/drops/{id}/presort (PRESORTED_ACTUAL), and any recompute caused by an allocation, void, suppression or cancellation cascade (keeping the drop's current cost_basis)"
    inputs:
      - "drop.page_count, drop.planned_quantity"
      - "CatalogSeason.print_cost_per_page_per_thousand_cents, paper_oz_per_page_milli, paper_cost_per_lb_cents, default_postage_estimate_cents_per_piece"
      - "drop.postage_total_cents (PRESORTED_ACTUAL variant only)"
    constants:
      print_rebate_bands: "planned_quantity >= 100000 -> 800 bps; >= 40000 -> 500 bps; else 0 bps"
      ounces_per_pound: 16
    formula: |
      rebate_bps = band(drop.planned_quantity)

      # component 1 - printing, rounded to whole cents on its own
      printing_cents_per_book = round_half_up(
          drop.page_count * season.print_cost_per_page_per_thousand_cents / 1000
          * (10000 - rebate_bps) / 10000 )

      # component 2 - paper, rounded to whole cents on its own
      paper_cents_per_book = round_half_up(
          drop.page_count * season.paper_oz_per_page_milli / 1000 / 16
          * season.paper_cost_per_lb_cents )

      # component 3 - postage, rounded to whole cents on its own
      if variant == 'PRESORTED_ACTUAL' and drop has at least one PostalPresortBatch:
          postage_cents_per_book = round_half_up(drop.postage_total_cents / drop.planned_quantity)
          cost_basis = 'PRESORTED_ACTUAL'
      else:
          postage_cents_per_book = season.default_postage_estimate_cents_per_piece
          cost_basis = 'ESTIMATED_POSTAGE'

      # PINNED: sum of three independently rounded components, NOT round(sum of exact components)
      cost_per_book_cents = printing_cents_per_book + paper_cents_per_book + postage_cents_per_book
    notes: |
      PINNED ROUNDING ORDER. Each of the three cost components is rounded to whole cents before the sum
      is taken, because a print shop, a paper mill and the postal service each invoice in whole cents.
      Rounding the exact sum instead is observably different: at page_count 94 with planned_quantity
      50000 and actual presorted postage 2580000 over 50000 pieces the exact components are
      232.18 + 21.62 + 51.6 = 305.40, which rounds to 305, while the pinned per-component reading is
      232 + 22 + 52 = 306.
      The rebate band is selected from planned_quantity (the allocated universe), which is generally
      smaller than the requested universe used by drop_provisional_cost_per_book, so the final figure
      normally exceeds the provisional one that the budget was actually spent at.
    precision: "integer cents; ROUND_HALF_UP applied independently to each of the three components"

  - name: drop_allocation_waterfall
    entity: CirculationLine
    output_fields: [allocation_rank, allocated_quantity, holdout_quantity, mailable_quantity, unit_cost_cents, committed_cost_cents]
    algorithm_type: waterfall_allocation
    trigger: "POST /catalog-circulation/drops/{id}/allocate"
    inputs:
      - "every CirculationLine of the drop in status PROPOSED"
      - "plan.uncommitted_budget_cents"
      - "drop.provisional_cost_per_book_cents (computed first, from the requested universe)"
    constants:
      priority_order: "audience_type HOUSEFILE before RENTAL; within HOUSEFILE by HousefileSegment.rfm_score DESC; within RENTAL by ProspectListRental.coop_model_score DESC; final tie-break CirculationLine.created_at ASC"
      audience_cap_source: "HOUSEFILE line -> segment.housefile_count; RENTAL line -> rental.net_names_delivered"
    formula: |
      compute drop.provisional_cost_per_book_cents first (see drop_provisional_cost_per_book)
      remaining_budget   = plan.uncommitted_budget_cents
      rank = 0
      for line in PROPOSED lines of the drop sorted by priority_order:
          rank += 1
          line.allocation_rank = rank
          per_name_extra = rental.unit_cost_cents_per_name if line.audience_type == 'RENTAL' else 0
          line.unit_cost_cents = drop.provisional_cost_per_book_cents + per_name_extra
          audience_cap  = segment.housefile_count | rental.net_names_delivered
          budget_cap    = floor(remaining_budget / line.unit_cost_cents)
          line.allocated_quantity = min(line.requested_quantity, audience_cap, budget_cap)
          if line.allocated_quantity <= 0:
              line stays PROPOSED with allocated_quantity 0 and committed_cost_cents 0; continue
          line.holdout_quantity  = floor(line.allocated_quantity * line.holdout_pct_bps / 10000)
          line.mailable_quantity = line.allocated_quantity - line.holdout_quantity
          line.committed_cost_cents = line.allocated_quantity * line.unit_cost_cents
          remaining_budget   -= line.committed_cost_cents
          line.status = 'ALLOCATED'
      drop.planned_quantity = sum(line.allocated_quantity for ALLOCATED lines of the drop)
      plan.committed_cost_cents  += sum(committed_cost_cents newly frozen by this call)
      plan.uncommitted_budget_cents = plan.budget_cents - plan.committed_cost_cents
    invariant: "plan.budget_cents == plan.committed_cost_cents + plan.uncommitted_budget_cents, before and after every allocate, void, suppression cascade and cancellation"
    notes: |
      Strict waterfall: the highest-priority audience fills to its own cap before the next line sees
      any universe or budget at all, so a low-rank line can be clamped to 0 and remain PROPOSED. The
      budget cap floors (a partial book cannot be printed). holdout_quantity is carved out of the
      allocated quantity AFTER the cost is committed - a holdout group is paid for in the cost model
      but is not mailed, which is exactly why forecast demand has two variants.
    precision: "integer names and cents; floor on both the budget cap and the holdout carve-out"

  - name: line_demand_forecast
    entity: CirculationLine
    output_fields: [effective_response_bps, gross_forecast_demand_cents, forecast_demand_cents]
    algorithm_type: forward_looking
    variants: [PRE_MERGE_GROSS, POST_MERGE_NET]
    trigger: "POST /catalog-circulation/drops/{id}/circulation-lines (PRE_MERGE_GROSS only) and POST /catalog-circulation/drops/{id}/allocate (both variants)"
    inputs:
      - "line.requested_quantity (gross variant) or line.mailable_quantity (net variant)"
      - "HousefileSegment.historical_response_rate_bps / ProspectListRental.expected_response_rate_bps"
      - "HousefileSegment.avg_order_value_cents / CatalogSeason.prospect_avg_order_value_cents"
    constants:
      response_source: "HOUSEFILE line -> segment.historical_response_rate_bps; RENTAL line -> rental.expected_response_rate_bps"
      aov_source: "HOUSEFILE line -> segment.avg_order_value_cents; RENTAL line -> season.prospect_avg_order_value_cents"
    formula: |
      effective_response_bps = base_response_bps resolved from the line's single non-null audience FK
                               (HOUSEFILE -> segment.historical_response_rate_bps,
                                RENTAL    -> rental.expected_response_rate_bps)

      # variant PRE_MERGE_GROSS - the planning view, on the requested universe, ignoring the holdout
      gross_orders = floor( line.requested_quantity * effective_response_bps / 10000 )
      gross_forecast_demand_cents = gross_orders * aov_cents

      # variant POST_MERGE_NET - the committed view, on the mailable universe only
      forecast_orders = floor( line.mailable_quantity * effective_response_bps / 10000 )
      forecast_demand_cents = forecast_orders * aov_cents
    notes: |
      DUAL VARIANT with a genuinely different input set, not a different rate. PRE_MERGE_GROSS prices
      the universe the planner asked for, before merge-purge removed duplicates and before the
      allocation waterfall clamped the line, and it ignores the holdout carve-out entirely. POST_MERGE_NET
      prices only the books that will actually land in a mailbox. Both are persisted on the line: the
      gross figure is what the circulation plan was justified with, the net figure is what the
      profitability roll-up and the matchback expectation use. They coincide only when the line was
      allocated its full request and holdout_pct_bps == 0.
    precision: "integer cents; ROUND_HALF_UP on the response rate, floor on the order count"

  - name: line_profitability
    entity: CirculationLine
    output_fields: [gross_margin_cents, circulation_cost_cents, contribution_cents]
    algorithm_type: aggregation
    trigger: "POST /catalog-circulation/drops/{id}/allocate, POST /catalog-circulation/circulation-plans/{id}/cost, POST /catalog-circulation/drops/{id}/presort, and every cascade that changes a drop's cost per book"
    inputs:
      - "line.forecast_demand_cents (the POST_MERGE_NET variant)"
      - "line.mailable_quantity, line.audience_type, ProspectListRental.unit_cost_cents_per_name"
      - "drop.cost_per_book_cents (the FINAL figure, not the provisional one)"
      - "CatalogSeason.cogs_rate_bps"
    formula: |
      per_name_extra = rental.unit_cost_cents_per_name if line.audience_type == 'RENTAL' else 0
      gross_margin_cents = round_half_up( line.forecast_demand_cents * (10000 - season.cogs_rate_bps) / 10000 )
      circulation_cost_cents = line.mailable_quantity
                               * (drop.cost_per_book_cents + per_name_extra)
      contribution_cents = gross_margin_cents - circulation_cost_cents
    notes: |
      Per-segment profitability is a contribution figure, so it may legitimately be negative - a
      prospect list that loses money on the first mailing is still bought for the housefile names it
      creates. Note the deliberate asymmetry with the allocation waterfall: the budget was committed at
      the PROVISIONAL cost per book, but profitability is measured at the FINAL cost per book, so
      contribution moves when a drop is presorted even though committed_cost_cents does not. Cost is
      charged on mailable_quantity (the books actually mailed) while committed_cost_cents was charged
      on allocated_quantity (including the holdout).
    precision: "integer cents; ROUND_HALF_UP on the margin only"

  - name: plan_profitability_rollup
    entity: CirculationPlan
    output_fields: [planned_cost_cents, planned_demand_cents, planned_contribution_cents]
    algorithm_type: aggregation
    trigger: "POST /catalog-circulation/circulation-plans/{id}/cost, POST /catalog-circulation/drops/{id}/presort, GET /catalog-circulation/circulation-plans/{id}/profitability, and every cascade listed in §1.2"
    inputs:
      - "every CirculationLine in status ALLOCATED belonging to a Drop of the plan whose production_status != CANCELLED"
    formula: |
      in_scope = ALLOCATED lines of non-CANCELLED drops of the plan
      planned_cost_cents         = sum(line.circulation_cost_cents for line in in_scope)
      planned_demand_cents       = sum(line.forecast_demand_cents  for line in in_scope)
      planned_contribution_cents = sum(line.contribution_cents     for line in in_scope)
    notes: |
      INPUT SET FILTERING is the whole difficulty here: VOIDED, SUPPRESSED and still-PROPOSED lines are
      excluded, and so is every line of a CANCELLED drop. planned_contribution_cents is the sum of the
      already-rounded per-line contributions, so it is not the same number as a contribution recomputed
      from the summed demand; the per-line reading is pinned. The approve transition gates on
      planned_contribution_cents >= 0 (ERR_PLAN_CONTRIBUTION_NEGATIVE), so a single deeply unprofitable
      rental line can block approval of an otherwise healthy plan.
    precision: "integer cents, exact sums of rounded per-line values"

  - name: contact_fatigue_score
    entity: HousefileSegment
    output_fields: [fatigue_score, contact_strategy, suppressed_at, "ContactEvent.channel_weight", "ContactEvent.decay_factor_bps", "ContactEvent.weighted_points"]
    algorithm_type: decay_function
    trigger: "POST /catalog-circulation/contact-events and the ContactEvent creation cascade of POST /catalog-circulation/drops/{id}/mail"
    inputs:
      - "every ContactEvent with this housefile_segment_id whose contact_date is within CatalogSeason.fatigue_window_days of the logical clock now"
      - "CatalogSeason.fatigue_window_days, CatalogSeason.fatigue_suppression_threshold"
    constants:
      channel_weights: "MAIL 40; EMAIL 12; DIGITAL 6"
      decay_bands_bps: "days_ago <= 14 -> 10000; <= 30 -> 7500; <= 60 -> 5000; <= 90 -> 2500; else 0"
    formula: |
      now = logical clock now
      fatigue_score = 0
      for e in ContactEvent rows with this segment:
          days_ago = whole days from e.contact_date to now (floor of the day difference)
          if days_ago > season.fatigue_window_days: skip the event entirely
          decay_bps       = band(days_ago)
          channel_weight  = channel_weights[e.channel]
          weighted_points = round_half_up( channel_weight * decay_bps / 10000 )
          fatigue_score  += weighted_points
          # the ContactEvent row's OWN channel_weight, decay_factor_bps and weighted_points columns are
          # written exactly once, when that row is created, from the clock as it stood at that moment
          # (the row is immutable). A later recompute derives the three values above locally and never
          # rewrites the stored row, so a row's frozen weighted_points may disagree with its current
          # contribution to the segment's score.
      if fatigue_score >= season.fatigue_suppression_threshold:
          segment.contact_strategy = 'SUPPRESS_ONLY'
          segment.suppressed_at = now
    notes: |
      STEP decay, not continuous: every contact inside a band contributes the same points, and the band
      edges are inclusive on the fresher side (days_ago == 14 still scores 10000 bps, 15 scores 7500).
      Each event's points are rounded independently before accumulation, so a MAIL at 61 days contributes
      round_half_up(40 * 2500 / 10000) = 10 and three of them contribute 30, not round(30.0) of a summed
      exact value - the difference matters at the threshold. Events strictly older than the window are
      dropped, which means the score can FALL as the clock advances and a suppression can become
      unjustified - but suppression is sticky: once contact_strategy is SUPPRESS_ONLY it is never
      auto-reverted, only an explicit PATCH by a CirculationPlanner can restore it.
    precision: "integer points; ROUND_HALF_UP per event, then exact summation"

  - name: matchback_attribution
    entity: MatchbackRun
    output_fields: [matched_order_count, attributed_order_count, unmatched_order_count, attributed_demand_cents]
    algorithm_type: projection
    variants: [LAST_TOUCH_MAIL, FRACTIONAL_MULTI_TOUCH]
    trigger: "POST /catalog-circulation/drops/{id}/matchback-runs"
    inputs:
      - "every online order ingested via POST /catalog-circulation/_online-orders/ingest whose housefile_segment_id matches a segment contacted by this drop"
      - "every ContactEvent for that segment inside the attribution window"
      - "run.attribution_window_days, run.attribution_variant"
    constants:
      window_shape: "half-open, (order_date - attribution_window_days, order_date] - a contact exactly on the order date qualifies, a contact exactly attribution_window_days before it does NOT"
      last_touch_tie_break: "greatest contact_date; if still tied, smallest created_at"
      fractional_remainder_rule: "equal floor shares; the whole remainder goes to the contact with the earliest contact_date (tie-break smallest created_at)"
    formula: |
      for each ingested online order O (order_date, demand_cents, housefile_segment_id):
          qualifying = ContactEvent rows where
                       segment_id == O.housefile_segment_id
                       and O.order_date - run.attribution_window_days days < e.contact_date <= O.order_date
          if qualifying is empty: the order is unattributed and contributes nothing

          # variant LAST_TOUCH_MAIL - only mail can take credit, and only the freshest mail touch
          mail_touches = [e for e in qualifying if e.channel == 'MAIL']
          if mail_touches is empty: the order is unattributed
          else: winner = max(mail_touches by (contact_date, then -created_at)); credit O.demand_cents
                entirely to winner.drop_id

          # variant FRACTIONAL_MULTI_TOUCH - every channel shares equally
          n = len(qualifying)
          share = floor(O.demand_cents / n)
          remainder = O.demand_cents - share * n
          every qualifying contact's drop_id is credited `share`
          the contact with the earliest contact_date is credited an additional `remainder`

      attributed_order_count  = number of orders that credited THIS run's drop at least 1 cent
      attributed_demand_cents = total cents credited to THIS run's drop
      matched_order_count     = number of ingested orders whose segment matches a segment this drop
                                contacted, regardless of whether the window admitted any contact
      unmatched_order_count   = matched_order_count - attributed_order_count
    notes: |
      DUAL VARIANT with a different credit distribution, not a different rate. On the same order and the
      same contact set the two models produce different numbers for the same drop, and the fractional
      model's remainder rule means the earliest touch (not the last) is the one that absorbs the odd
      cents - so on a 20000-cent order with three qualifying contacts each drop gets 6666 except the
      earliest-contact drop, which gets 6668. Cents are conserved under both models: the sum of credits
      across all drops equals the order's demand exactly, never more.
    precision: "integer cents; floor share plus an exact remainder assignment - no rounding"

  - name: test_cell_lift
    entity: TestCell
    output_fields: [response_rate_bps, lift_bps, significance]
    algorithm_type: threshold
    trigger: "POST /catalog-circulation/test-cells/{id}/measure"
    inputs:
      - "cell.quantity, cell.responders"
      - "the CONTROL cell on the same CirculationLine (cell_role == CONTROL) in status MEASURED"
    constants:
      min_sample_quantity: 1000
      significance_threshold_bps: 1500
    formula: |
      response_rate_bps = round_half_up( cell.responders * 10000 / cell.quantity )
      control = the MEASURED TestCell on the same circulation_line_id with cell_role == 'CONTROL'
      if cell.cell_role == 'CONTROL' or control is null or control.id == cell.id:
          lift_bps = 0
          significance = 'INSUFFICIENT_CONTROL'
      elif control.response_rate_bps == 0:
          lift_bps = 0
          significance = 'INSUFFICIENT_CONTROL'
      else:
          lift_bps = round_half_up( (response_rate_bps - control.response_rate_bps) * 10000
                                    / control.response_rate_bps )
          if cell.quantity < 1000 or control.quantity < 1000:
              significance = 'INSUFFICIENT_SAMPLE'
          elif abs(lift_bps) >= 1500:
              significance = 'SIGNIFICANT'
          else:
              significance = 'NOT_SIGNIFICANT'
    notes: |
      Lift is RELATIVE to the control rate, so it is undefined when the control drew zero responders -
      that case yields lift_bps 0 with significance INSUFFICIENT_CONTROL rather than a divide-by-zero or
      an infinite lift. The sample-size guard is evaluated BEFORE the magnitude test and looks at both
      cells, so a huge lift measured on a 900-name cell reports INSUFFICIENT_SAMPLE, not SIGNIFICANT.
      Measuring the CONTROL cell re-scores every already-measured sibling on the same line, because the
      siblings' lift depends on a rate that did not exist when they were measured.
    precision: "integer bps, ROUND_HALF_UP on both the rate and the lift"

  - name: page_placement_space_productivity
    entity: PagePlacement
    output_fields: [position_multiplier_bps, forecast_space_demand_cents, space_productivity_cents_per_sq_in]
    algorithm_type: weighted_scoring
    trigger: "POST /catalog-circulation/drops/{id}/page-placements"
    inputs:
      - "placement.square_inches, placement.demand_per_sq_inch_cents, placement.placement_position"
    constants:
      position_multiplier_bps_by_position: "FRONT_COVER 18000; HOT_SPOT 14000; BACK_COVER 13000; INSIDE 10000"
    formula: |
      placement.position_multiplier_bps = position_multiplier_bps_by_position[placement.placement_position]
      forecast_space_demand_cents = round_half_up(
          placement.square_inches * placement.demand_per_sq_inch_cents
          * placement.position_multiplier_bps / 10000 )
      space_productivity_cents_per_sq_in = round_half_up(
          forecast_space_demand_cents / placement.square_inches )
    notes: |
      Square-inch analysis is the catalog merchant's unit economics: the same SKU in the same space earns
      1.8x on the front cover and 1.0x buried inside. Productivity is derived from the ALREADY-ROUNDED
      forecast, so it is a re-division of a rounded numerator rather than an independent formula - the
      pinned reading. Placements consume the drop's square_inch_capacity, and the drop's
      allocated_square_inches + unallocated_square_inches must always reconcile to that capacity.
    precision: "integer cents, ROUND_HALF_UP on both outputs"

# -----------------------------------------------------------------------------
# §1.4 Validation Rules (evaluated in ascending priority; the first violated
# rule wins and short-circuits every later rule)
# -----------------------------------------------------------------------------
validations:

  - priority: 10
    category: auth
    rule: "X-User-ID header is present and non-empty on every endpoint"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all endpoints"

  - priority: 20
    category: auth
    rule: "the caller's role is listed in the endpoint's roles"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all endpoints"
    note: "Evaluated before any path id is resolved, so a wrong-role call against a non-existent id returns 403, not 404."

  - priority: 30
    category: existence
    rule: "every id in the URL path resolves to an existing row"
    error_id: "ERR_SEASON_NOT_FOUND | ERR_SEGMENT_NOT_FOUND | ERR_RENTAL_NOT_FOUND | ERR_PLAN_NOT_FOUND | ERR_DROP_NOT_FOUND | ERR_LINE_NOT_FOUND | ERR_PLACEMENT_NOT_FOUND | ERR_TEST_CELL_NOT_FOUND | ERR_MATCHBACK_RUN_NOT_FOUND"
    http_status: 404
    applies_to: "every endpoint with a path parameter"

  - priority: 32
    category: existence
    rule: "every foreign key supplied in the request body resolves to an existing row (season_id, parent_segment_id, housefile_segment_id, prospect_list_rental_id, every element of input_rental_ids)"
    error_id: "ERR_SEASON_NOT_FOUND | ERR_SEGMENT_NOT_FOUND | ERR_RENTAL_NOT_FOUND"
    http_status: 404
    applies_to: "POST /housefile-segments, POST /prospect-list-rentals, POST /circulation-plans, POST /circulation-plans/{id}/merge-purge-runs, POST /drops/{id}/circulation-lines, POST /contact-events"

  - priority: 35
    category: business_constraint
    rule: "request body satisfies its schema: required fields present, enum values in range, integers within their declared bounds, no negative money or quantities"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "all write endpoints"

  - priority: 38
    category: business_constraint
    rule: "a CirculationLine names exactly one audience: either housefile_segment_id or prospect_list_rental_id is non-null, never both and never neither, and audience_type agrees with which one is set"
    error_id: ERR_AUDIENCE_SPEC_INVALID
    http_status: 422
    applies_to: "POST /drops/{id}/circulation-lines"

  - priority: 39
    category: business_constraint
    rule: "parent_segment_id must not create a cycle in the HousefileSegment hierarchy (a segment cannot be its own ancestor) and must belong to the same season"
    error_id: ERR_SEGMENT_CYCLE
    http_status: 422
    applies_to: "POST /housefile-segments, PATCH /housefile-segments/{id}"

  - priority: 40
    category: state
    rule: "the owning CirculationPlan is editable (status in {DRAFT, COSTED}) for any structural mutation of its drops, lines, placements, presort batches or merge-purge runs"
    error_id: ERR_PLAN_NOT_EDITABLE
    http_status: 409
    applies_to: "POST /circulation-plans/{id}/drops, PATCH /drops/{id}, POST /drops/{id}/circulation-lines, POST /drops/{id}/allocate, POST /circulation-lines/{id}/void, POST /drops/{id}/page-placements, DELETE /page-placements/{id}, POST /drops/{id}/presort-batches, POST /circulation-plans/{id}/merge-purge-runs"

  - priority: 42
    category: state
    rule: "the entity being transitioned is in a state from which the requested transition exists"
    error_id: "ERR_INVALID_PLAN_STATE | ERR_INVALID_DROP_STATE | ERR_INVALID_MEASUREMENT_STATE | ERR_INVALID_RENTAL_STATE | ERR_INVALID_LINE_STATE | ERR_INVALID_TEST_CELL_STATE | ERR_INVALID_MATCHBACK_STATE"
    http_status: 409
    applies_to: "every action endpoint in §1.2"

  - priority: 45
    category: state
    rule: "the supplied expected_<parent>_version equals the parent's current version"
    error_id: "ERR_STALE_PLAN_VERSION | ERR_STALE_DROP_VERSION"
    http_status: 412
    applies_to: "POST /circulation-plans/{id}/merge-purge-runs, POST /drops/{id}/matchback-runs"
    note: "Checked after the plan/drop state guard at priority 40/42, so an uneditable plan reports ERR_PLAN_NOT_EDITABLE even when the version is also stale."

  - priority: 50
    category: business_safety
    rule: "the approver of a CirculationPlan is neither the operator recorded in costed_by_user_id nor the operator recorded in submitted_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /circulation-plans/{id}/approve"

  - priority: 55
    category: business_safety
    rule: "a HousefileSegment whose contact_strategy is SUPPRESS_ONLY may not be allocated circulation"
    error_id: ERR_SEGMENT_SUPPRESSED
    http_status: 422
    applies_to: "POST /drops/{id}/circulation-lines, POST /drops/{id}/allocate"

  - priority: 58
    category: business_safety
    rule: "creating a ContactEvent must not exceed the most specific enabled SuppressionRule's max_contacts_per_window for the segment on that channel within window_days (rules are consulted in ascending SuppressionRule.priority; the first matching enabled rule for the channel decides, and a channel_scope of ALL matches every channel)"
    error_id: ERR_CONTACT_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /contact-events"

  - priority: 62
    category: business_referential
    rule: "a RENTAL CirculationLine may only be allocated once its ProspectListRental has reached NETTED"
    error_id: ERR_RENTAL_NOT_NETTED
    http_status: 409
    applies_to: "POST /drops/{id}/allocate, POST /circulation-plans/{id}/merge-purge-runs"

  - priority: 64
    category: business_referential
    rule: "the plan must have a MergePurgeRun in status COMPLETED before circulation can be allocated or the plan costed"
    error_id: ERR_MERGE_PURGE_REQUIRED
    http_status: 409
    applies_to: "POST /drops/{id}/allocate, POST /circulation-plans/{id}/cost"

  - priority: 70
    category: business_temporal
    rule: "a Drop's in_home_date must be on or after the logical clock's current date at creation and at PATCH"
    error_id: ERR_INHOME_DATE_IN_PAST
    http_status: 422
    applies_to: "POST /circulation-plans/{id}/drops, PATCH /drops/{id}"

  - priority: 74
    category: business_temporal
    rule: "adding a CirculationLine must not place the same HousefileSegment in two drops whose in_home_date are closer together than CatalogSeason.min_inhome_gap_days whole days; the buffer is symmetric and a gap of exactly min_inhome_gap_days is permitted"
    error_id: ERR_INHOME_SPACING_VIOLATION
    http_status: 409
    applies_to: "POST /drops/{id}/circulation-lines"
    note: "Only lines in status PROPOSED or ALLOCATED on drops with production_status != CANCELLED occupy the buffer; a VOIDED or SUPPRESSED line releases it."

  - priority: 78
    category: business_constraint
    rule: "drop_number is unique within its CirculationPlan"
    error_id: ERR_DUPLICATE_DROP_NUMBER
    http_status: 409
    applies_to: "POST /circulation-plans/{id}/drops"

  - priority: 79
    category: business_constraint
    rule: "code uniqueness: season_code globally, segment_code per season, plan_code per season, rule_code per season, cell_code per circulation line, product_sku per drop"
    error_id: "ERR_DUPLICATE_SEASON_CODE | ERR_DUPLICATE_SEGMENT_CODE | ERR_DUPLICATE_PLAN_CODE | ERR_DUPLICATE_SUPPRESSION_RULE_CODE | ERR_DUPLICATE_TEST_CELL_CODE | ERR_DUPLICATE_PLACEMENT_SKU"
    http_status: 409
    applies_to: "POST /seasons, POST /housefile-segments, POST /circulation-plans, POST /seasons/{id}/suppression-rules, POST /circulation-lines/{id}/test-cells, POST /drops/{id}/page-placements"

  - priority: 81
    category: business_constraint
    rule: "a Drop may not carry two live CirculationLine rows (status PROPOSED or ALLOCATED) for the same audience"
    error_id: ERR_DUPLICATE_AUDIENCE_LINE
    http_status: 409
    applies_to: "POST /drops/{id}/circulation-lines"

  - priority: 82
    category: business_constraint
    rule: "a PagePlacement's half-open square-inch interval [sq_in_offset, sq_in_offset + square_inches) must not overlap another live placement's interval on the same page_number of the same drop; touching intervals (gap of exactly 0) are allowed"
    error_id: ERR_PAGE_SPACE_OVERLAP
    http_status: 409
    applies_to: "POST /drops/{id}/page-placements"

  - priority: 84
    category: business_constraint
    rule: "a PagePlacement's interval must fit inside one page: sq_in_offset + square_inches <= CatalogSeason.usable_sq_in_per_page, and page_number must be within 1..drop.page_count"
    error_id: ERR_PAGE_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /drops/{id}/page-placements"

  - priority: 85
    category: business_constraint
    rule: "the drop's total allocated square inches must never exceed drop.square_inch_capacity, and PATCH /drops/{id} may not reduce page_count below the square inches already allocated (or below the highest occupied page_number)"
    error_id: ERR_DROP_SQ_IN_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /drops/{id}/page-placements, PATCH /drops/{id}"

  - priority: 86
    category: business_constraint
    rule: "a CirculationLine may carry at most one TestCell with cell_role CONTROL"
    error_id: ERR_DUPLICATE_CONTROL_CELL
    http_status: 409
    applies_to: "POST /circulation-lines/{id}/test-cells"

  - priority: 87
    category: business_constraint
    rule: "the sum of TestCell.quantity across a line's cells may not exceed that line's allocated_quantity"
    error_id: ERR_TEST_CELL_QUANTITY_EXCEEDS_LINE
    http_status: 422
    applies_to: "POST /circulation-lines/{id}/test-cells"

  - priority: 88
    category: business_constraint
    rule: "the sum of PostalPresortBatch.piece_count for a drop must equal drop.planned_quantity exactly when the drop is presorted"
    error_id: ERR_PRESORT_COVERAGE_MISMATCH
    http_status: 422
    applies_to: "POST /drops/{id}/presort"

  - priority: 92
    category: business_fiscal
    rule: "an allocation may not commit more than plan.uncommitted_budget_cents; if the highest-priority line cannot afford a single book the allocate call is rejected outright rather than committing nothing"
    error_id: ERR_PLAN_BUDGET_EXHAUSTED
    http_status: 422
    applies_to: "POST /drops/{id}/allocate"

  - priority: 94
    category: business_fiscal
    rule: "a CirculationPlan whose planned_contribution_cents is negative may not be approved"
    error_id: ERR_PLAN_CONTRIBUTION_NEGATIVE
    http_status: 422
    applies_to: "POST /circulation-plans/{id}/approve"

