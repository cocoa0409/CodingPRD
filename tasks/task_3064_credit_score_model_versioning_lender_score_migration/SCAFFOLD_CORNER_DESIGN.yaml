          trigger:
            - {call: "POST /model-documentation/${md}/file", payload: {expected_documentation_version: "${mdv}"}, as: ComplianceOfficer, captures: {st: $.data.status, filed: $.data.filed_at, ck: $.data.checksum, dver: $.data.version}}
