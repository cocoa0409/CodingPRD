            - "Customer.${cust_id}.status == SUSPENDED"
            - "response error_id == ERR_CUSTOMER_SUSPENDED"

      - name: assign_shuttle_requires_trip_serves_lot_and_open
        grounds:
          - validations[priority=14]
          - state_machines.ShuttleTrip.SCHEDULED_to_BOARDING
          - entities.ShuttleTrip.fields.status
          - errors[ERR_SHUTTLE_FULL]
        distinguishing_aspect: |
          The Reservation→ShuttleTrip pair (different from Reservation→Customer):
          assign-shuttle requires the ShuttleTrip to serve the reservation's lot and
          be in SCHEDULED/BOARDING; assigning to a DEPARTED trip is rejected with
          ERR_SHUTTLE_FULL — a cross-entity state dependency on a distinct entity pair.
        test_recipe:
          setup:
            - "Clock 2026-07-01T09:40:00Z; SURFACE_LOT standard_capacity=3; a non-prepaid BOOKED reservation; a shuttle trip opened-boarding then DEPARTED."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-30T09:00:00Z" }
              as: FacilityAdmin
            - call: "POST /customers"
              payload: { email: "c7b@x.com", full_name: "C7b" }
              as: FacilityAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /lots"
              payload: { name: "L7b", kind: "SURFACE_LOT", standard_capacity: 3, oversized_capacity: 0, ev_capacity: 0, in_out_allowed: false }
              as: FacilityAdmin
              captures: { lot_id: $.data.id, lot_v: $.data.version }
            - call: "POST /rate-plans"
              payload: { lot_id: "${lot_id}", rate_mode: "DAILY", daily_cap_cents: 2000 }
              as: FacilityAdmin
              captures: { rp_id: $.data.id }
            - call: "POST /vehicles"
              payload: { customer_id: "${cust_id}", plate: "STD7b", size_class: "STANDARD", is_ev: false }
              as: FacilityAdmin
              captures: { veh_id: $.data.id }
            - call: "POST /reservations"
              payload: { customer_id: "${cust_id}", lot_id: "${lot_id}", vehicle_id: "${veh_id}", rate_plan_id: "${rp_id}", scheduled_start: "2026-07-02T10:00:00Z", scheduled_end: "2026-07-03T10:00:00Z", prepaid: false, expected_lot_version: "${lot_v}" }
              as: FacilityAdmin
              captures: { res_id: $.data.id }
            - call: "POST /shuttle-trips"
              payload: { lot_id: "${lot_id}", depart_at: "2026-07-01T10:00:00Z", seat_capacity: 4 }
              as: FacilityAdmin
              captures: { trip_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-07-01T09:40:00Z" }
              as: FacilityAdmin
            - call: "POST /shuttle-trips/${trip_id}/open-boarding"
              payload: {}
              as: LotOperator
            - call: "POST /shuttle-trips/${trip_id}/depart"
              payload: {}
              as: LotOperator
              captures: { trip_vnow: $.data.version }
          trigger:
            - call: "POST /reservations/${res_id}/assign-shuttle"
              payload: { shuttle_trip_id: "${trip_id}", expected_shuttle_trip_version: "${trip_vnow}" }
              as: FacilityAdmin
              captures: { err: $.data.error_id }
          assert:
            - "ShuttleTrip.${trip_id}.status == DEPARTED"
            - "response error_id == ERR_SHUTTLE_FULL"
            - "HTTP status == 409"

  # ===========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: stall_capacity_overlap_aggregate_count
        grounds:
          - validations[priority=13]
          - calculations.compute_lot_availability
          - entities.StallHold.fields.status
          - errors[ERR_NO_STALL_AVAILABLE]
        distinguishing_aspect: |
          On the Lot/StallHold resource, overlap is treated as AGGREGATE CAPACITY:
          any number of holds may coexist on a lot up to capacity, and a new hold is
          rejected only when the count of HELD/OCCUPIED holds for the class already
          equals capacity (a counting/aggregate interval semantic).
        test_recipe:
          setup:
            - "Clock 2026-06-30T09:00:00Z; SURFACE_LOT standard_capacity=1; the single STANDARD stall held by an overlapping BOOKED reservation."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-30T09:00:00Z" }
              as: FacilityAdmin
            - call: "POST /lots"
              payload: { name: "L8a", kind: "SURFACE_LOT", standard_capacity: 1, oversized_capacity: 0, ev_capacity: 0, in_out_allowed: false }
              as: FacilityAdmin
              captures: { lot_id: $.data.id, lot_v0: $.data.version }
            - call: "POST /rate-plans"
              payload: { lot_id: "${lot_id}", rate_mode: "DAILY", daily_cap_cents: 2000 }
              as: FacilityAdmin
              captures: { rp_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "c8a1@x.com", full_name: "C8a1" }
              as: FacilityAdmin
              captures: { c1: $.data.id }
            - call: "POST /vehicles"
              payload: { customer_id: "${c1}", plate: "S8a1", size_class: "STANDARD", is_ev: false }
              as: FacilityAdmin
              captures: { v1: $.data.id }
            - call: "POST /reservations"
              payload: { customer_id: "${c1}", lot_id: "${lot_id}", vehicle_id: "${v1}", rate_plan_id: "${rp_id}", scheduled_start: "2026-07-01T10:00:00Z", scheduled_end: "2026-07-03T10:00:00Z", prepaid: false, expected_lot_version: "${lot_v0}" }
              as: FacilityAdmin
              captures: { res1: $.data.id }
            - call: "POST /customers"
              payload: { email: "c8a2@x.com", full_name: "C8a2" }
              as: FacilityAdmin
              captures: { c2: $.data.id }
            - call: "POST /vehicles"
              payload: { customer_id: "${c2}", plate: "S8a2", size_class: "STANDARD", is_ev: false }
              as: FacilityAdmin
              captures: { v2: $.data.id }
            - call: "GET /lots/${lot_id}"
              payload: {}
              as: FacilityAdmin
              captures: { lot_vnow: $.data.version }
          trigger:
            - call: "POST /reservations"
              payload: { customer_id: "${c2}", lot_id: "${lot_id}", vehicle_id: "${v2}", rate_plan_id: "${rp_id}", scheduled_start: "2026-07-02T10:00:00Z", scheduled_end: "2026-07-04T10:00:00Z", prepaid: false, expected_lot_version: "${lot_vnow}" }
              as: FacilityAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NO_STALL_AVAILABLE (aggregate capacity full despite distinct overlapping interval)"

      - name: shuttle_seat_capacity_overlap_per_trip
        grounds:
          - validations[priority=14]
          - entities.ShuttleTrip.fields.seats_taken
          - entities.ShuttleTrip.fields.seat_capacity
          - errors[ERR_SHUTTLE_FULL]
        distinguishing_aspect: |
          On the ShuttleTrip resource, overlap is a PER-TRIP SEAT-COUNT semantic
          (different geometry from the lot's class-capacity): assignment is rejected
          when seats_taken == seat_capacity on that single trip instance, independent
          of any time interval — a capacity-on-a-point resource, not an interval lot.
        test_recipe:
          setup:
            - "Clock 2026-07-01T09:00:00Z; SURFACE_LOT standard_capacity=5; a shuttle trip with seat_capacity=1 already filled by one assigned reservation; a second BOOKED reservation seeking that trip."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-30T09:00:00Z" }
              as: FacilityAdmin
            - call: "POST /lots"
              payload: { name: "L8b", kind: "SURFACE_LOT", standard_capacity: 5, oversized_capacity: 0, ev_capacity: 0, in_out_allowed: false }
              as: FacilityAdmin
              captures: { lot_id: $.data.id, lot_v0: $.data.version }
            - call: "POST /rate-plans"
              payload: { lot_id: "${lot_id}", rate_mode: "DAILY", daily_cap_cents: 2000 }
              as: FacilityAdmin
              captures: { rp_id: $.data.id }
            - call: "POST /shuttle-trips"
              payload: { lot_id: "${lot_id}", depart_at: "2026-07-01T12:00:00Z", seat_capacity: 1 }
              as: FacilityAdmin
              captures: { trip_id: $.data.id, trip_v0: $.data.version }
            - call: "POST /customers"
              payload: { email: "c8b1@x.com", full_name: "C8b1" }
              as: FacilityAdmin
              captures: { c1: $.data.id }
            - call: "POST /vehicles"
              payload: { customer_id: "${c1}", plate: "S8b1", size_class: "STANDARD", is_ev: false }
              as: FacilityAdmin
              captures: { v1: $.data.id }
            - call: "POST /reservations"
              payload: { customer_id: "${c1}", lot_id: "${lot_id}", vehicle_id: "${v1}", rate_plan_id: "${rp_id}", scheduled_start: "2026-07-02T10:00:00Z", scheduled_end: "2026-07-03T10:00:00Z", prepaid: false, expected_lot_version: "${lot_v0}" }
              as: FacilityAdmin
              captures: { res1: $.data.id }
            - call: "POST /reservations/${res1}/assign-shuttle"
              payload: { shuttle_trip_id: "${trip_id}", expected_shuttle_trip_version: "${trip_v0}" }
              as: FacilityAdmin
            - call: "GET /lots/${lot_id}"
              payload: {}
              as: FacilityAdmin
              captures: { lot_v1: $.data.version }
            - call: "POST /customers"
              payload: { email: "c8b2@x.com", full_name: "C8b2" }
              as: FacilityAdmin
              captures: { c2: $.data.id }
            - call: "POST /vehicles"
              payload: { customer_id: "${c2}", plate: "S8b2", size_class: "STANDARD", is_ev: false }
              as: FacilityAdmin
              captures: { v2: $.data.id }
            - call: "POST /reservations"
              payload: { customer_id: "${c2}", lot_id: "${lot_id}", vehicle_id: "${v2}", rate_plan_id: "${rp_id}", scheduled_start: "2026-07-02T11:00:00Z", scheduled_end: "2026-07-03T11:00:00Z", prepaid: false, expected_lot_version: "${lot_v1}" }
              as: FacilityAdmin
              captures: { res2: $.data.id }
            - call: "GET /shuttle-trips/${trip_id}"
              payload: {}
              as: FacilityAdmin
              captures: { trip_vnow: $.data.version }
          trigger:
            - call: "POST /reservations/${res2}/assign-shuttle"
              payload: { shuttle_trip_id: "${trip_id}", expected_shuttle_trip_version: "${trip_vnow}" }
              as: FacilityAdmin
              captures: { err: $.data.error_id }
          assert:
            - "ShuttleTrip.${trip_id}.seats_taken == 1 == seat_capacity"
            - "response error_id == ERR_SHUTTLE_FULL"

  # ===========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: stall_count_conserved_book_then_cancel
        grounds:
          - state_machines.Reservation.BOOKED_to_CANCELLED
          - state_machines.StallHold.HELD_to_RELEASED
          - calculations.compute_lot_availability
          - entities.Lot.fields.available_standard_count
        distinguishing_aspect: |
          Conserved quantity = lot stall inventory: capacity_C == available_<C>_count
          + count(active HELD/OCCUPIED holds of class C). A book (forward) paired with
          its cancel (compensating) MUST leave available_standard_count back at its
          pre-book value (5), with no leaked hold.
        test_recipe:
          setup:
            - "Clock 2026-06-30T09:00:00Z; SURFACE_LOT standard_capacity=5, available 5."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-30T09:00:00Z" }
              as: FacilityAdmin
            - call: "POST /customers"
              payload: { email: "c9a@x.com", full_name: "C9a" }
              as: FacilityAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /lots"
              payload: { name: "L9a", kind: "SURFACE_LOT", standard_capacity: 5, oversized_capacity: 0, ev_capacity: 0, in_out_allowed: false }
              as: FacilityAdmin
              captures: { lot_id: $.data.id, lot_v: $.data.version }
            - call: "POST /rate-plans"
              payload: { lot_id: "${lot_id}", rate_mode: "DAILY", daily_cap_cents: 2000 }
              as: FacilityAdmin
              captures: { rp_id: $.data.id }
            - call: "POST /vehicles"
              payload: { customer_id: "${cust_id}", plate: "S9a", size_class: "STANDARD", is_ev: false }
              as: FacilityAdmin
              captures: { veh_id: $.data.id }
          trigger:
            - call: "POST /reservations"
              payload: { customer_id: "${cust_id}", lot_id: "${lot_id}", vehicle_id: "${veh_id}", rate_plan_id: "${rp_id}", scheduled_start: "2026-07-01T10:00:00Z", scheduled_end: "2026-07-02T10:00:00Z", prepaid: false, expected_lot_version: "${lot_v}" }
              as: FacilityAdmin
              captures: { res_id: $.data.id }
            - call: "POST /reservations/${res_id}/cancel"
              payload: {}
              as: FacilityAdmin
            - call: "GET /lots/${lot_id}"
              payload: {}
              as: FacilityAdmin
              captures: { avail_final: $.data.available_standard_count }
          assert:
            - "Lot.${lot_id}.available_standard_count == 5 after book+cancel (conserved)"

      - name: money_conserved_prepay_then_cancel_fee_plus_refund
        grounds:
          - state_machines.Reservation.AUTHORIZED_to_REFUNDED
          - calculations.compute_cancellation_settlement
          - entities.PaymentTxn.fields.amount_cents
          - entities.Reservation.fields.provisional_quote_cents
        distinguishing_aspect: |
          Conserved quantity = money (a different conserved quantity than stall count):
          for a prepaid cancel, FEE_RETAIN.amount_cents + REFUND.amount_cents MUST
          equal provisional_quote_cents exactly (1233 + 3697 == 4930), so no cents are
          created or destroyed by the compensation.
        test_recipe:
          setup:
            - "Clock 2026-06-30T09:00:00Z (≥24h lead so prepay discount applies)."
            - "SURFACE_LOT standard_capacity=5; HOURLY plan hourly_cents=300, daily_cap_cents=2000; CancellationPolicy free_cancel_hours=48, late_cancel_fee_bps=2500, prepay_discount_bps=1500."
            - "PREPAID reservation [2026-07-01T10:00Z, 2026-07-03T15:30Z] → provisional_quote_cents=4930; cancelled at 2026-06-30T20:00Z (≈38h before start → inside 48h free-cancel window → late fee)."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-30T09:00:00Z" }
              as: FacilityAdmin
            - call: "POST /customers"
              payload: { email: "c9b@x.com", full_name: "C9b" }
              as: FacilityAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /lots"
              payload: { name: "L9b", kind: "SURFACE_LOT", standard_capacity: 5, oversized_capacity: 0, ev_capacity: 0, in_out_allowed: false }
              as: FacilityAdmin
              captures: { lot_id: $.data.id, lot_v: $.data.version }
            - call: "POST /rate-plans"
              payload: { lot_id: "${lot_id}", rate_mode: "HOURLY", hourly_cents: 300, daily_cap_cents: 2000 }
              as: FacilityAdmin
              captures: { rp_id: $.data.id }
            - call: "POST /cancellation-policies"
              payload: { lot_id: "${lot_id}", free_cancel_hours: 48, late_cancel_fee_bps: 2500, prepay_discount_bps: 1500 }
              as: FacilityAdmin
            - call: "POST /vehicles"
              payload: { customer_id: "${cust_id}", plate: "S9b", size_class: "STANDARD", is_ev: false }
              as: FacilityAdmin
              captures: { veh_id: $.data.id }
            - call: "POST /reservations"
              payload: { customer_id: "${cust_id}", lot_id: "${lot_id}", vehicle_id: "${veh_id}", rate_plan_id: "${rp_id}", scheduled_start: "2026-07-01T10:00:00Z", scheduled_end: "2026-07-03T15:30:00Z", prepaid: true, expected_lot_version: "${lot_v}" }
              as: FacilityAdmin
              captures: { res_id: $.data.id, prov: $.data.provisional_quote_cents }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-30T20:00:00Z" }
              as: FacilityAdmin
          trigger:
            - call: "POST /reservations/${res_id}/cancel"
              payload: {}
              as: FacilityAdmin
              captures: { settlement: $.data.settlement_status }
            - call: "GET /reservations/${res_id}/payment-txns"
              payload: {}
              as: FacilityAdmin
          assert:
            - "Reservation.${res_id}.provisional_quote_cents == 4930"
            - "Reservation.${res_id}.settlement_status == REFUNDED"
            - "PaymentTxn FEE_RETAIN amount_cents == 1233 and REFUND amount_cents == 3697"
            - "FEE_RETAIN.amount_cents + REFUND.amount_cents == 4930 == provisional_quote_cents"
