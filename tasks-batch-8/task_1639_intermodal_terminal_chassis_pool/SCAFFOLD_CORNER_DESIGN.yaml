        claim_type: immediate
        grounds:
          - "complexity_profile.consistency_model"
        distinguishing_aspect: "POST /containers/{cid}/ground returns the updated container AND terminal.yard_slots_in_use incremented in the same request's response — no eventual lag."
        test_recipe:
          setup: ["Terminal with slot available; Train ARRIVED; Container INBOUND_TRAIN"]
          setup_api_calls:
            - call: "POST /terminals"
              payload: { terminal_code: "BNSF-LA", rail_cutoff_minutes_before_departure: 60, gate_free_hours: 48, per_diem_rate_cents: 15000, storage_rate_cents: 8000, flip_fee_cents: 5000, max_stack_height: 3, yard_slot_count: 20 }
              as: TerminalManager
              captures: {tid: $.data.id}
            - call: "POST /terminals/${tid}/slots"
              payload: { slot_code: "A-01-1", row: "A", tier_max: 3 }
              as: YardPlanner
            - call: "POST /terminals/${tid}/trains"
              payload: { train_symbol: "Z-ALTCHI", scheduled_departure_utc: "2026-08-10T12:00:00Z" }
              as: RailCoordinator
              captures: {trid: $.data.id}
            - call: "POST /terminals/${tid}/trains/${trid}/mark_arrived"
              payload: {}
              as: RailCoordinator
            - call: "POST /terminals/${tid}/containers"
              payload: { container_number: "BMOU1234567", iso_type: "40FT", planned_train_id: "${trid}" }
              as: RailCoordinator
              captures: {cid: $.data.id}
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: TerminalManager
            - call: "GET /terminals/${tid}"
              payload: {}
              as: TerminalManager
              captures: {t_v: $.data.version}
          trigger:
            - call: "POST /terminals/${tid}/containers/${cid}/ground"
              payload: { expected_terminal_version: "${t_v}" }
              as: YardPlanner
              captures: {c_status: $.data.status}
            - call: "GET /terminals/${tid}"
              payload: {}
              as: TerminalManager
              captures: {t_free: $.data.yard_slots_free, t_in_use: $.data.yard_slots_in_use}
          assert:
            - "Container.${cid}.status == ON_GROUND (immediate in same response)"
            - "Terminal.yard_slots_in_use == 1 (visible immediately on next GET, no eventual consistency lag)"
            - "Terminal.yard_slots_free == 19"
