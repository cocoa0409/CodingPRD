  - rule_id: cross_entity_state_dependency
    instances:
      - name: job_request_intake_depends_on_contractor_signatory_state
        grounds:
          - validations[priority=16]
          - errors.ERR_CONTRACTOR_NOT_SIGNATORY
          - entities.Contractor.fields.signatory_status
          - endpoints["POST /hiring-hall/job-requests"]
          - endpoints["PATCH /hiring-hall/contractors/{id}/signatory-status"]
        distinguishing_aspect: |
          ENTITY PAIR (JobRequest depends on Contractor): creating a JobRequest is legal
          only while the parent Contractor sits in signatory_status SIGNATORY, and the
          identical payload flips between 409 and 201 purely because a BusinessManager
          moved the OTHER entity. A different pair from the sibling instance.
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00.000Z; home Local 512 exists (no registrations are needed — intake never consults the lists)."
            - "Contractor Midvale Piping is created directly in signatory_status DELINQUENT_TRUST_FUNDS."
            - "Every intake attempt below sends the SAME payload, so only the contractor's state can explain the difference."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00.000Z" }
              as: HallAdmin
            - call: "POST /hiring-hall/locals"
              payload: { local_number: 512, name: "Local 512 (home)", kind: "HOME", reciprocity_factor_bp: 0 }
              as: HallAdmin
              captures: { home_local_id: $.data.id }
            - call: "POST /hiring-hall/contractors"
