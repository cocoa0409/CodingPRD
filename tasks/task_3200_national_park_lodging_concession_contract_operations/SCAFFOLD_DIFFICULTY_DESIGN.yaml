              as: ConcessionerHRManager
            - &ci_h2
              call: "POST /contracts/${c_id}/seasonal-hires"
              payload: { season_id: "${s_id}", service_line_id: "${sl_l}", employee_ref: "emp-302", housing_unit_id: "${u1}", arrival_date: "2027-06-01T00:00:00Z", departure_date: "2027-08-31T00:00:00Z", needs_transport: false }
              as: ConcessionerHRManager
          trigger:
            - call: "POST /contracts/${c_id}/seasonal-hires"
              payload: { season_id: "${s_id}", service_line_id: "${sl_l}", employee_ref: "emp-303", housing_unit_id: "${u1}", arrival_date: "2027-06-01T00:00:00Z", departure_date: "2027-08-31T00:00:00Z", needs_transport: false }
