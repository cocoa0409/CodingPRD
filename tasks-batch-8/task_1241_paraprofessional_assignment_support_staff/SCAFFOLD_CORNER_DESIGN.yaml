  # ===========================================================================
  # Section: endpoints
  # ===========================================================================
  - section: endpoints
    instances:
      - name: compute_requires_published_formula
        claim_type: conditional_action
        grounds: [state_machines.AllocationFormula]
        distinguishing_aspect: "compute against a DRAFT formula is rejected."
        test_recipe:
          setup: ["plan ACTIVE, B1, formula DRAFT (never published)"]
          setup_api_calls:
            - call: "POST /sped-staffing/plans"
              payload: { plan_name: "P", school_year: "2026-27", total_budget_cents: 1000000 }
              as: DistrictStaffingAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /sped-staffing/buildings"
              payload: { plan_id: "${plan_id}", name: "Lincoln", building_code: "LIN", hardship_factor: 1.0 }
              as: DistrictStaffingAdmin
            - call: "POST /sped-staffing/plans/${plan_id}/activate"
              as: DistrictStaffingAdmin
            - call: "POST /sped-staffing/allocation-formulas"
              payload: { plan_id: "${plan_id}", base_grant_cents: 100000, per_minute_rate_cents: 5, weight_one_to_one: 1.0, weight_shared_support: 0.6, weight_transitional: 0.4, period_weeks: 1 }
              as: DistrictStaffingAdmin
              captures: { f1: $.data.id }
          trigger:
            - call: "POST /sped-staffing/funding-allocations/compute"
              payload: { formula_id: "${f1}", period_label: "2026-W19" }
              as: DistrictStaffingAdmin
              captures: { e_id: $.data.error_id }
          assert:
            - "error_id == ERR_FORMULA_NOT_PUBLISHED"

      - name: compute_twice_same_period_rejected
        claim_type: conditional_action
        grounds: []
        distinguishing_aspect: "Second compute for the same (formula_id, period_label) is rejected."
        test_recipe:
          setup: ["plan ACTIVE, B1, published formula, one successful compute for 2026-W19"]
          setup_api_calls:
            - call: "POST /sped-staffing/plans"
              payload: { plan_name: "P", school_year: "2026-27", total_budget_cents: 1000000 }
              as: DistrictStaffingAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /sped-staffing/buildings"
              payload: { plan_id: "${plan_id}", name: "Lincoln", building_code: "LIN", hardship_factor: 1.0 }
              as: DistrictStaffingAdmin
            - call: "POST /sped-staffing/plans/${plan_id}/activate"
              as: DistrictStaffingAdmin
            - call: "POST /sped-staffing/allocation-formulas"
              payload: { plan_id: "${plan_id}", base_grant_cents: 100000, per_minute_rate_cents: 5, weight_one_to_one: 1.0, weight_shared_support: 0.6, weight_transitional: 0.4, period_weeks: 1 }
              as: DistrictStaffingAdmin
              captures: { f1: $.data.id }
            - call: "POST /sped-staffing/allocation-formulas/${f1}/publish"
              as: DistrictStaffingAdmin
            - call: "POST /sped-staffing/funding-allocations/compute"
              payload: { formula_id: "${f1}", period_label: "2026-W19" }
              as: DistrictStaffingAdmin
          trigger:
            - call: "POST /sped-staffing/funding-allocations/compute"
              payload: { formula_id: "${f1}", period_label: "2026-W19" }
              as: DistrictStaffingAdmin
              captures: { e_id: $.data.error_id }
          assert:
            - "error_id == ERR_ALLOCATIONS_ALREADY_COMPUTED"

      - name: formula_publish_supersedes_prior
        claim_type: side_effect_execution
        grounds: [state_machines.AllocationFormula.DRAFT_to_PUBLISHED, entities.AllocationFormula.fields.version_no]
        distinguishing_aspect: "Publishing formula v2 supersedes v1 and version_no increments per plan."
        test_recipe:
          setup: ["plan ACTIVE, B1, two formulas created (v1 published)"]
          setup_api_calls:
            - call: "POST /sped-staffing/plans"
              payload: { plan_name: "P", school_year: "2026-27", total_budget_cents: 1000000 }
              as: DistrictStaffingAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /sped-staffing/buildings"
              payload: { plan_id: "${plan_id}", name: "Lincoln", building_code: "LIN", hardship_factor: 1.0 }
              as: DistrictStaffingAdmin
            - call: "POST /sped-staffing/plans/${plan_id}/activate"
