      - name: destination_platform_match_report_for_another_destination_forbidden
        claim_type: actor_binding_enforced
        grounds:
          - errors[ERR_DESTINATION_ACTOR_MISMATCH]
          - validations[priority=3]
          - roles.DestinationPlatform.identity
        distinguishing_aspect: "The DestinationPlatform role is bound to ONE destination by X-User-ID: holding the role is not enough, so destination B reporting on destination A's activation is 403 ERR_DESTINATION_ACTOR_MISMATCH rather than ERR_UNAUTHORIZED."
