  # ===========================================================================
  # 6. boundary_precision_check
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: waiting_period_boundary_at_exact_coverage_effective_instant
        grounds:
          - calculations.claim_eligibility_assessment
          - calculations.enrollment_term_and_coverage_dates
          - validations.waiting-period-elapsed
          - errors.ERR_WAITING_PERIOD_NOT_ELAPSED
          - entities.Enrollment.fields.coverage_effective_at
          - entities.Claim.fields.reported_at
          - entities.Claim.fields.eligibility_assessment
          - state_machines.Enrollment.PENDING_WAITING_PERIOD_to_ACTIVE
        distinguishing_aspect: |
          A MILLISECOND-resolution walk of a STRICT `<` comparison: 2026-09-03T23:59:59.999Z is inside the
          waiting period, 2026-09-04T00:00:00.000Z - the exact coverage_effective_at instant - is outside it.
          The pair is one millisecond apart, so an implementation that truncates to whole seconds, compares
          calendar dates, or writes `<=` instead of `<` flips exactly one of the two claims and is caught.
          The same instant also drives the enrollment's PENDING_WAITING_PERIOD -> ACTIVE sweep, which uses
          `>=`, so both polarities of the same boundary are exercised in one chain.
        test_recipe:
          setup:
            - "Partner Cascadia Water ACTIVE with the Water Line Protect product (waiting_period_days 30)."
            - "One OR premises owning WATER_CURB_STOP_TO_HOME, with known_defect_reported_at null so the PRE_EXISTING check at ladder step (3) cannot interfere."
            - "The enrollment is created on 2026-08-05, giving enrollment_date 2026-08-05 and coverage_effective_at 2026-09-04T00:00:00.000Z; coverage_status is PENDING_WAITING_PERIOD, which is NOT one of the COVERAGE_INACTIVE statuses, so ladder step (1) cannot pre-empt step (4)."
            - "No nightly run has executed yet, so the enrollment has not been activated."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /partners"
              payload: { name: "Cascadia Water", utility_type: "WATER", state_code: "OR", brand_approval_required: true, min_days_between_drops: 21, max_mailings_per_year: 2, rate_filing_required: false, bill_insert_supported: true }
              as: PlatformAdmin
              captures: { partner_id: $.data.id, partner_v1: $.data.version }
            - call: "POST /service-line-products"
              payload: { partner_id: "${partner_id}", name: "Water Line Protect", line_type: "WATER_SERVICE_LINE", ownership_boundary: "CURB_STOP", required_owned_segment: "WATER_CURB_STOP_TO_HOME", monthly_price_cents: 2499, waiting_period_days: 30, per_occurrence_cap_cents: 800000, annual_cap_cents: 1000000, permit_covered: true, restoration_covered_scope: "BASIC_BACKFILL", cap_reset_basis: "ENROLLMENT_ANNIVERSARY" }
              as: PlatformAdmin
              captures: { product_id: $.data.id }
            - call: "POST /partners/${partner_id}/status-changes"
              payload: { target_status: "ACTIVE", reason: "Onboarding complete, product filed.", expected_partner_version: "${partner_v1}" }
              as: PlatformAdmin
            - call: "POST /premises"
              payload: { partner_id: "${partner_id}", street_address: "12 Alder St", state_code: "OR", owned_segments: ["WATER_CURB_STOP_TO_HOME"], do_not_mail: false, address_status: "GOOD" }
              as: MarketingOps
              as_user_id: "mops-001"
              captures: { premises_id: $.data.id, premises_v1: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /enrollments"
              payload: { premises_id: "${premises_id}", product_id: "${product_id}", billing_mode: "DIRECT_BILL", expected_premises_version: "${premises_v1}", prepaid_amount_cents: 29988 }
              as: CustomerServiceRep
              as_user_id: "csr-001"
              captures: { enrollment_id: $.data.id, effective_at: $.data.coverage_effective_at, coverage_initial: $.data.coverage_status, term_end: $.data.term_end_date }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-03T23:59:59.999Z" }
              as: PlatformAdmin
            - call: "POST /claims"
              payload: { enrollment_id: "${enrollment_id}", line_type: "WATER_SERVICE_LINE", defect_location: "CURB_STOP_TO_METER", urgency: "ROUTINE", incident_description: "Boundary probe: filed one millisecond before coverage attaches." }
              as: CustomerServiceRep
              as_user_id: "csr-001"
              captures: { early_claim_id: $.data.id, early_reported_at: $.data.reported_at, early_eligibility: $.data.eligibility_assessment }
            - call: "POST /claims/${early_claim_id}/triage-decision"
              payload: { decision: "APPROVE", coverage_note: "Attempting to approve the one-millisecond-early claim." }
              as: ClaimsAdjuster
              as_user_id: "adj-001"
              captures: { early_error: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-04T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /operations/nightly-run"
              payload: {}
              as: OperationsAdmin
              as_user_id: "ops-001"
            - call: "POST /claims"
              payload: { enrollment_id: "${enrollment_id}", line_type: "WATER_SERVICE_LINE", defect_location: "CURB_STOP_TO_METER", urgency: "ROUTINE", incident_description: "Boundary probe: filed at the exact coverage_effective_at instant." }
              as: CustomerServiceRep
              as_user_id: "csr-001"
              captures: { onboundary_claim_id: $.data.id, onboundary_reported_at: $.data.reported_at, onboundary_eligibility: $.data.eligibility_assessment }
            - call: "POST /claims/${onboundary_claim_id}/triage-decision"
              payload: { decision: "APPROVE", coverage_note: "Exact-instant claim is inside coverage." }
              as: ClaimsAdjuster
              as_user_id: "adj-001"
              captures: { onboundary_status: $.data.status, onboundary_decided_at: $.data.triage_decided_at }
          assert:
            - "${effective_at} == 2026-09-04T00:00:00.000Z  # 2026-08-05 + waiting_period_days 30, midnight UTC, exactly three fractional digits"
            - "${term_end} == 2027-08-05 and ${coverage_initial} == PENDING_WAITING_PERIOD"
            - "below - ${early_reported_at} == 2026-09-03T23:59:59.999Z and ${early_eligibility} == WAITING_PERIOD"
            - "below - ${early_error} == ERR_WAITING_PERIOD_NOT_ELAPSED with HTTP 422 (validation waiting-period-elapsed, priority 55)"
            - "below - Claim.${early_claim_id}.status == TRIAGE and version == 1  # rejected without side effects"
            - "at - ${onboundary_reported_at} == 2026-09-04T00:00:00.000Z and ${onboundary_eligibility} == ELIGIBLE  # equality is NOT inside the waiting period; the comparison is strict `<`"
            - "at - ${onboundary_status} == APPROVED and ${onboundary_decided_at} == 2026-09-04T00:00:00.000Z"
            - "at - Enrollment.${enrollment_id}.coverage_status == ACTIVE  # the activation sweep uses `>=`, so the same instant activates the enrollment"
            - "the two probe claims are one millisecond apart and land on opposite sides; a whole-second or date-granularity comparison makes ${early_eligibility} read ELIGIBLE and is caught here"
            - "GET /claims?enrollment_id=${enrollment_id} returns total_count == 2 with data[0].id == ${early_claim_id}  # created_at ASC"

      - name: annual_cap_exhausts_when_usage_equals_cap_exactly
        grounds:
          - calculations.annual_and_occurrence_cap_usage
          - calculations.dispatch_benefit_settlement
          - entities.Enrollment.fields.annual_benefit_used_cents
          - entities.Enrollment.fields.cap_status
          - state_machines.Enrollment.WITHIN_CAP_to_ANNUAL_CAP_EXHAUSTED
          - entities.LedgerEntry.fields.amount_cents
        distinguishing_aspect: |
          A THREE-POINT walk of the `annual_benefit_used_cents >= annual_cap_cents` threshold in units of ONE
          CENT: 527000 (far below) stays WITHIN_CAP, 999999 (exactly cap minus one cent) still stays
          WITHIN_CAP, and 1000000 (exactly the cap, not over it) flips to ANNUAL_CAP_EXHAUSTED. The
          at-threshold point is the one a `>` implementation gets wrong, and the threshold-minus-one point is
          the one an off-by-one rounding of the waterfall gets wrong.
        test_recipe:
          setup:
            - "Partner Cascadia Water ACTIVE with the Water Line Protect product (per_occurrence_cap_cents 800000, annual_cap_cents 1000000, permit_covered true, restoration_covered_scope BASIC_BACKFILL)."
            - "One OR premises enrolled DIRECT_BILL on 2026-08-05; the nightly run at 2026-09-10T08:00:00.000Z activated coverage and no further nightly run executes, so no SLA sweep can disturb the dispatches."
            - "Contractor Alder Plumbing is ACTIVE with a valid OR licence, permit_pull_authorized true and max_open_dispatches 5."
            - "Three separate ROUTINE WATER_SERVICE_LINE claims are filed with no recurrence_of_claim_id, so each is its own occurrence_root_claim_id and the 800000 per-occurrence cap never binds."
            - "Each dispatch is COMPLETED before the next claim is filed, so no visit-window buffer applies and every cap reading is taken at a settled point."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /partners"
              payload: { name: "Cascadia Water", utility_type: "WATER", state_code: "OR", brand_approval_required: true, min_days_between_drops: 21, max_mailings_per_year: 2, rate_filing_required: false, bill_insert_supported: true }
              as: PlatformAdmin
              captures: { partner_id: $.data.id, partner_v1: $.data.version }
            - call: "POST /service-line-products"
              payload: { partner_id: "${partner_id}", name: "Water Line Protect", line_type: "WATER_SERVICE_LINE", ownership_boundary: "CURB_STOP", required_owned_segment: "WATER_CURB_STOP_TO_HOME", monthly_price_cents: 2499, waiting_period_days: 30, per_occurrence_cap_cents: 800000, annual_cap_cents: 1000000, permit_covered: true, restoration_covered_scope: "BASIC_BACKFILL", cap_reset_basis: "ENROLLMENT_ANNIVERSARY" }
              as: PlatformAdmin
              captures: { product_id: $.data.id }
            - call: "POST /partners/${partner_id}/status-changes"
              payload: { target_status: "ACTIVE", reason: "Onboarding complete, product filed.", expected_partner_version: "${partner_v1}" }
              as: PlatformAdmin
            - call: "POST /premises"
              payload: { partner_id: "${partner_id}", street_address: "12 Alder St", state_code: "OR", owned_segments: ["WATER_CURB_STOP_TO_HOME"], do_not_mail: false, address_status: "GOOD" }
              as: MarketingOps
              as_user_id: "mops-001"
              captures: { premises_id: $.data.id, premises_v1: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /enrollments"
              payload: { premises_id: "${premises_id}", product_id: "${product_id}", billing_mode: "DIRECT_BILL", expected_premises_version: "${premises_v1}", prepaid_amount_cents: 29988 }
              as: CustomerServiceRep
              as_user_id: "csr-001"
              captures: { enrollment_id: $.data.id, cap_at_birth: $.data.cap_status, used_at_birth: $.data.annual_benefit_used_cents }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T08:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /operations/nightly-run"
              payload: {}
              as: OperationsAdmin
              as_user_id: "ops-001"
            - call: "POST /contractors"
              payload: { name: "Alder Plumbing", state_code: "OR", license_number: "OR-PL-4471", license_expires_on: "2027-12-31", line_types_certified: ["WATER_SERVICE_LINE"], hourly_rate_cents: 18000, sla_compliance_pct: 92, max_open_dispatches: 5, permit_pull_authorized: true }
              as: OperationsAdmin
              as_user_id: "ops-001"
              captures: { c_a_id: $.data.id }
            - call: "POST /claims"
              payload: { enrollment_id: "${enrollment_id}", line_type: "WATER_SERVICE_LINE", defect_location: "CURB_STOP_TO_METER", urgency: "ROUTINE", incident_description: "Occurrence 1: curb-stop failure with permit and restoration." }
              as: CustomerServiceRep
              as_user_id: "csr-001"
              captures: { claim1_id: $.data.id }
            - call: "POST /claims/${claim1_id}/triage-decision"
