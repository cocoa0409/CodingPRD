        claim_type: error_triggerable
        grounds:
          - errors[ERR_NEGOTIATION_ROUNDS_EXHAUSTED]
        excluded_because:
          difficulty_instance: non_linear_state_machine / hotel_block_terms_negotiation_cycle_caps_at_three_submissions
          rationale: "The named §1.8 instance walks the negotiation loop to its cap and triggers ERR_NEGOTIATION_ROUNDS_EXHAUSTED."

