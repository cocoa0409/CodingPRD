        distinguishing_aspect: "The projected import need is ceil(4 weeks of demand divided by unit retail) plus current on-hand, and it is exposed as a computed read that must agree with the on-request deadline recompute."
        test_recipe:
          setup:
            - "Logical clock 2026-09-21T00:00:00Z. Item ITM-BOAT-6400 has 2 units on hand; four weeks of demand at the brand planning constant is 300000 cents."
