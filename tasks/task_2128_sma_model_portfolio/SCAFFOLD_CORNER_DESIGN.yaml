              as: PortfolioManager
            - call: "POST /sma/model-versions/${mv1}/submit"
              payload: {}
              as: PortfolioManager
              as_user_id: "pm-1"
            - call: "POST /sma/model-versions/${mv1}/approve"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /sma/model-versions/${mv1}/publish"
              payload: {}
              as: PortfolioManager
              as_user_id: "pm-1"
              captures: { mv1_v: "$.data.version" }
            - call: "POST /sma/sponsor-distributions"
              payload: { sponsor_id: "${sp1}", model_version_id: "${mv1}", effective_from: "2026-01-01T00:00:00Z", expected_model_version_version: "${mv1_v}" }
              as: PortfolioManager
              captures: { d1: "$.data.id" }
          trigger:
            - call: "POST /sma/sponsor-distributions"
              payload: { sponsor_id: "${sp2}", model_version_id: "${mv1}", effective_from: "2026-01-01T00:00:00Z", expected_model_version_version: "${mv1_v}" }
              as: PortfolioManager
