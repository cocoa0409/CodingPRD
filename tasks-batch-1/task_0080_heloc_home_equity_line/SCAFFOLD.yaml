scenario: "80. HELOC Home Equity Line: lien position, Draw period (10 years), repayment period, variable rate (Prime+Margin), annual fee, Default triggers, early closure fee"
domain_name: heloc-home-equity-line
api_prefix: ""

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - dual_variant_calculation       # interest accrual: forward-projected schedule vs chronological daily accrual
    - rate_threshold_triggers        # default triggers (DSCR/LTV/delinquency-days), index reset breakpoints
    - cascading_side_effects         # default declaration cascades: line freeze -> draw block -> covenant breach log -> escrow lock
    - optimistic_concurrency         # rate-index reset supersede on the IndexRate parent
    - derived_field_reconciliation   # Heloc.current_balance / available_credit / current_apr kept consistent with ledger
  entity_topology: graph
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - polymorphic
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: Property
    parent: null
    common_fields: true
    fields:
      - name: street_address
        type: string
        source: input
        description: Collateral property street address
      - name: appraised_value_cents
        type: integer
        source: input
        description: Most recent appraised value in cents; basis for LTV/CLTV
        constraints: ">= 1"
      - name: senior_lien_balance_cents
        type: integer
        source: input
        description: Outstanding balance of all senior (first-position) liens in cents; 0 if none
        default: 0
        constraints: ">= 0"
      - name: county_fips
        type: string
        source: input
        description: County FIPS code, recording jurisdiction for the lien
      - name: status
        type: enum
        source: computed
        description: ACTIVE while collateralizing a non-closed Heloc; RELEASED once all liens on it are released
        default: ACTIVE
        constraints: "one of {ACTIVE, RELEASED}"

  - name: Borrower
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: Borrower legal name
      - name: annual_income_cents
        type: integer
        source: input
        description: Verified gross annual income in cents; basis for DSCR
        constraints: ">= 0"
      - name: monthly_debt_obligation_cents
        type: integer
        source: input
        description: Existing monthly debt service in cents (excludes this HELOC); basis for DSCR
        default: 0
        constraints: ">= 0"
      - name: credit_score
        type: integer
        source: input
        description: FICO at underwriting; 300-850
        constraints: ">= 300 and <= 850"
      - name: kyc_status
        type: enum
        source: input
        description: Know-Your-Customer verification outcome
        default: PENDING
        constraints: "one of {PENDING, CLEARED, REJECTED}"

  - name: IndexRate
    parent: null
    common_fields: true
    fields:
      - name: index_name
        type: enum
        source: input
        description: Reference index; only PRIME is used by this product
        default: PRIME
        constraints: "one of {PRIME}"
      - name: rate_bps
        type: integer
        source: input
        description: Index value in basis points (e.g. Prime 8.50% = 850)
        constraints: ">= 0"
      - name: effective_date
        type: datetime
        source: input
        description: ISO 8601 UTC date this index value takes effect (00:00:00Z)
      - name: superseded
        type: boolean
        source: computed
        description: True once a newer IndexRate for the same index_name with a later effective_date is published
        default: false

  - name: Heloc
    parent: null
    common_fields: true
    fields:
      - name: borrower_id
        type: string
        source: input
        description: "FK -> Borrower.id; the obligor on this line"
      - name: property_id
        type: string
        source: input
        description: "FK -> Property.id; the collateral"
      - name: lien_position
        type: enum
        source: input
        description: Recording position of this HELOC's lien against the property
        constraints: "one of {FIRST, SECOND}"
      - name: credit_limit_cents
        type: integer
        source: input
        description: Maximum committed line amount in cents
        constraints: ">= 100000"
      - name: margin_bps
        type: integer
        source: input
        description: Lender margin in basis points added to PRIME to form the note rate
        constraints: ">= 0 and <= 2000"
      - name: rate_ceiling_bps
        type: integer
        source: input
        description: Lifetime APR cap in basis points; current_apr is min(prime+margin, ceiling)
        constraints: ">= 0"
      - name: annual_fee_cents
        type: integer
        source: input
        description: Fee assessed on each draw-period anniversary
        default: 5000
        constraints: ">= 0"
      - name: origination_date
        type: datetime
        source: input
        description: ISO 8601 UTC date the line opens; anchors draw/repayment period boundaries
      - name: draw_period_years
        type: integer
        source: input
        description: Length of the draw period in years
        default: 10
        constraints: ">= 1 and <= 15"
      - name: repayment_period_years
        type: integer
        source: input
        description: Length of the amortizing repayment period in years following the draw period
        default: 20
        constraints: ">= 1 and <= 30"
      - name: status
        type: enum
        source: computed
        description: Lifecycle state; see §1.2
        default: APPLICATION
        constraints: "one of {APPLICATION, DRAW, REPAYMENT, FROZEN, DEFAULTED, CLOSED}"
      - name: current_balance_cents
        type: integer
        source: computed
        description: Outstanding principal; debited by Draw, credited by Payment principal portion
        default: 0
      - name: available_credit_cents
        type: integer
        source: computed
        description: credit_limit_cents - current_balance_cents, floored at 0; 0 while not in DRAW
        default: 0
      - name: current_apr_bps
        type: integer
        source: computed
        description: Effective annual rate in bps = min(active PRIME.rate_bps + margin_bps, rate_ceiling_bps)
        default: 0
      - name: accrued_interest_cents
        type: integer
        source: computed
        description: Chronologically accrued unpaid interest in cents since last payment
        default: 0
      - name: delinquency_days
        type: integer
        source: computed
        description: Days the oldest unpaid scheduled obligation has been past due
        default: 0
      - name: anniversary_count
        type: integer
        source: computed
        description: Number of draw-period anniversaries elapsed; drives annual-fee assessment
        default: 0

  - name: Draw
    parent: null
    common_fields: true
    fields:
      - name: heloc_id
        type: string
        source: input
        description: "FK -> Heloc.id; the line being drawn against"
      - name: amount_cents
        type: integer
        source: input
        description: Principal advance requested in cents
        constraints: ">= 1"
      - name: requested_at
        type: datetime
        source: system
        description: ISO 8601 UTC timestamp the draw was booked; chronological accrual anchor
      - name: status
        type: enum
        source: computed
        description: BOOKED on success; REVERSED if the originating transaction is voided
        default: BOOKED
        constraints: "one of {BOOKED, REVERSED}"

  - name: Payment
    parent: null
    common_fields: true
    fields:
      - name: heloc_id
        type: string
        source: input
        description: "FK -> Heloc.id; the line being paid"
      - name: amount_cents
        type: integer
        source: input
        description: Total remittance in cents; split into interest then principal (waterfall)
        constraints: ">= 1"
      - name: posted_at
        type: datetime
        source: system
        description: ISO 8601 UTC timestamp the payment posts; chronological accrual anchor
      - name: interest_applied_cents
        type: integer
        source: computed
        description: Portion applied to accrued interest (waterfall bucket 1)
        default: 0
      - name: principal_applied_cents
        type: integer
        source: computed
        description: Portion applied to principal (waterfall bucket 2)
        default: 0
      - name: fee_applied_cents
        type: integer
        source: computed
        description: Portion applied to outstanding fees (waterfall bucket 0, paid first)
        default: 0

  - name: FeeAssessment
    parent: null
    common_fields: true
    fields:
      - name: heloc_id
        type: string
        source: input
        description: "FK -> Heloc.id; the line assessed"
      - name: fee_type
        type: enum
        source: computed
        description: ANNUAL on anniversary; EARLY_CLOSURE on premature closure
        constraints: "one of {ANNUAL, EARLY_CLOSURE}"
      - name: amount_cents
        type: integer
        source: computed
        description: Assessed fee in cents
        constraints: ">= 0"
      - name: settlement_status
        type: enum
        source: computed
        description: OUTSTANDING until paid via waterfall; SETTLED once fully covered; WAIVED on covenant-cure override
        default: OUTSTANDING
        constraints: "one of {OUTSTANDING, SETTLED, WAIVED}"

  - name: Covenant
    parent: null
    common_fields: true
    fields:
      - name: heloc_id
        type: string
        source: input
        description: "FK -> Heloc.id; the line this covenant governs"
      - name: covenant_type
        type: enum
        source: input
        description: Which default trigger this covenant encodes
        constraints: "one of {MAX_CLTV, MIN_DSCR, MAX_DELINQUENCY_DAYS}"
      - name: threshold_value
        type: integer
        source: input
        description: Breakpoint; CLTV/DSCR in basis points (e.g. 8500 = 85.00%), delinquency in whole days
        constraints: ">= 0"
      - name: status
        type: enum
        source: computed
        description: Lifecycle; see §1.2 Covenant machine
        default: SATISFIED
        constraints: "one of {SATISFIED, BREACHED, CURED}"

  - name: DefaultEvent
    parent: null
    common_fields: false
    fields:
      - name: heloc_id
        type: string
        source: input
        description: "FK -> Heloc.id; the defaulted line"
      - name: covenant_id
        type: string
        source: input
        description: "FK -> Covenant.id; the breached covenant that triggered default"
      - name: trigger_type
        type: enum
        source: system
        description: Mirror of the triggering covenant_type for audit
        constraints: "one of {MAX_CLTV, MIN_DSCR, MAX_DELINQUENCY_DAYS}"
      - name: observed_value
        type: integer
        source: system
        description: The computed metric value at declaration (CLTV/DSCR bps or delinquency days)
      - name: declared_by_user_id
        type: string
        source: system
        description: X-User-ID of the LoanServicer who declared default (segregation-of-duties audit)

  - name: LienRecord
    parent: null
    common_fields: true
    fields:
      - name: heloc_id
        type: string
        source: input
        description: "FK -> Heloc.id; the line whose lien this records"
      - name: property_id
        type: string
        source: input
        description: "FK -> Property.id; the encumbered property"
      - name: position
        type: enum
        source: computed
        description: Recorded lien position; mirrors Heloc.lien_position at recording time
        constraints: "one of {FIRST, SECOND}"
      - name: status
        type: enum
        source: computed
        description: RECORDED when filed; RELEASED on line closure
        default: RECORDED
        constraints: "one of {RECORDED, RELEASED}"

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  - entity: Heloc
    initial_state: APPLICATION
    terminal_states: [CLOSED]
    transitions:
      - from: APPLICATION
        to: DRAW
        trigger: "POST /helocs/{id}/activate"
        actor: LoanOfficer
        preconditions:
          - "borrower.kyc_status == CLEARED"
          - "at least one Covenant of each type {MAX_CLTV, MIN_DSCR, MAX_DELINQUENCY_DAYS} exists for this heloc"
          - "an active (non-superseded) IndexRate with index_name == PRIME exists"
          - "computed CLTV at activation does NOT breach the MAX_CLTV covenant"
        side_effects:
          - "set current_apr_bps = min(active PRIME.rate_bps + margin_bps, rate_ceiling_bps)"
          - "set available_credit_cents = credit_limit_cents (balance is 0)"
          - "create LienRecord(position = lien_position, status = RECORDED) against property_id"
          - "set property.status = ACTIVE"
          - "increments Heloc.version by 1"
      - from: DRAW
        to: REPAYMENT
        trigger: "POST /helocs/{id}/convert-to-repayment"
        actor: LoanServicer
        preconditions:
          - "current clock >= origination_date + draw_period_years (draw period elapsed)"
          - "status == DRAW"
        side_effects:
          - "available_credit_cents set to 0 (no further draws allowed)"
          - "amortization baseline frozen at current_balance_cents"
          - "increments Heloc.version by 1"
      - from: DRAW
        to: FROZEN
        trigger: "POST /helocs/{id}/freeze"
        actor: LoanServicer
        preconditions:
          - "status == DRAW"
        side_effects:
          - "available_credit_cents set to 0 (draws blocked while frozen)"
          - "increments Heloc.version by 1"
        note: "Administrative freeze (e.g. property revaluation pending); reversible via unfreeze."
      - from: FROZEN
        to: DRAW
        trigger: "POST /helocs/{id}/unfreeze"
        actor: LoanServicer
        preconditions:
          - "status == FROZEN"
          - "no Covenant for this heloc is in BREACHED status"
        side_effects:
          - "available_credit_cents = max(credit_limit_cents - current_balance_cents, 0)"
          - "increments Heloc.version by 1"
        note: "Branching revert: FROZEN can go back to DRAW (cure) or forward to DEFAULTED (declaration)."
      - from: DRAW
        to: DEFAULTED
        trigger: "POST /helocs/{id}/declare-default"
        actor: LoanServicer
        preconditions:
          - "status IN {DRAW, REPAYMENT, FROZEN}"
          - "referenced Covenant.status == BREACHED and Covenant.heloc_id == this heloc"
          - "acting LoanServicer.X-User-ID != the LoanOfficer who activated this heloc (segregation of duties)"
        side_effects:
          - "create DefaultEvent(covenant_id, trigger_type, observed_value, declared_by_user_id)"
          - "available_credit_cents set to 0 (cascade: all future draws blocked)"
          - "assess EARLY_CLOSURE FeeAssessment is NOT created here (default is not a borrower-initiated closure)"
          - "increments Heloc.version by 1"
      - from: REPAYMENT
        to: DEFAULTED
        trigger: "POST /helocs/{id}/declare-default"
        actor: LoanServicer
        preconditions:
          - "status IN {DRAW, REPAYMENT, FROZEN}"
          - "referenced Covenant.status == BREACHED and Covenant.heloc_id == this heloc"
          - "acting LoanServicer.X-User-ID != the LoanOfficer who activated this heloc (segregation of duties)"
        side_effects:
          - "create DefaultEvent(...)"
          - "increments Heloc.version by 1"
      - from: FROZEN
        to: DEFAULTED
        trigger: "POST /helocs/{id}/declare-default"
        actor: LoanServicer
        preconditions:
          - "status IN {DRAW, REPAYMENT, FROZEN}"
          - "referenced Covenant.status == BREACHED and Covenant.heloc_id == this heloc"
          - "acting LoanServicer.X-User-ID != the LoanOfficer who activated this heloc (segregation of duties)"
        side_effects:
          - "create DefaultEvent(...)"
          - "increments Heloc.version by 1"
      - from: DRAW
        to: CLOSED
        trigger: "POST /helocs/{id}/close"
        actor: LoanServicer
        preconditions:
          - "status IN {DRAW, REPAYMENT}"
          - "current_balance_cents == 0 and accrued_interest_cents == 0 (paid in full)"
          - "all FeeAssessment for this heloc are settled or are being settled by this closure"
        side_effects:
          - "if current clock < origination_date + draw_period_years: create EARLY_CLOSURE FeeAssessment (cascade 1)"
          - "EARLY_CLOSURE FeeAssessment OUTSTANDING -> blocks closure unless zero (cascade 2: see close preconditions on fee)"
          - "set every Covenant for this heloc to CURED"
          - "set LienRecord.status = RELEASED (cascade 3)"
          - "set property.status = RELEASED if no other RECORDED LienRecord references it (cascade 4)"
          - "increments Heloc.version by 1"
      - from: REPAYMENT
        to: CLOSED
        trigger: "POST /helocs/{id}/close"
        actor: LoanServicer
        preconditions:
          - "status IN {DRAW, REPAYMENT}"
          - "current_balance_cents == 0 and accrued_interest_cents == 0 (paid in full)"
        side_effects:
          - "no EARLY_CLOSURE fee (repayment period implies draw period already elapsed)"
          - "set every Covenant for this heloc to CURED"
          - "set LienRecord.status = RELEASED"
          - "set property.status = RELEASED if no other RECORDED LienRecord references it"
          - "increments Heloc.version by 1"

  - entity: Covenant
    initial_state: SATISFIED
    terminal_states: []
    transitions:
      - from: SATISFIED
        to: BREACHED
        trigger: "POST /helocs/{id}/covenants/{cid}/evaluate"
        actor: LoanServicer
        preconditions:
          - "covenant.status == SATISFIED"
          - "computed metric crosses the threshold per §1.3 covenant_breach_check"
        side_effects:
          - "if heloc.status == DRAW: transition heloc DRAW -> FROZEN (cascade: covenant breach freezes the line)"
          - "record observed metric for later DefaultEvent.observed_value"
          - "increments Covenant.version by 1"
      - from: BREACHED
        to: CURED
        trigger: "POST /helocs/{id}/covenants/{cid}/cure"
        actor: LoanServicer
        preconditions:
          - "covenant.status == BREACHED"
          - "computed metric no longer crosses the threshold per §1.3"
          - "heloc.status != DEFAULTED"
        side_effects:
          - "waive any OUTSTANDING ANNUAL FeeAssessment created during the breach window -> WAIVED"
          - "increments Covenant.version by 1"
        note: "Cyclic-adjacent: a CURED covenant can be re-evaluated to BREACHED via a fresh covenant on re-breach; this row pairs with SATISFIED->BREACHED for the revision loop."
      - from: CURED
        to: BREACHED
        trigger: "POST /helocs/{id}/covenants/{cid}/evaluate"
        actor: LoanServicer
        preconditions:
          - "covenant.status == CURED"
          - "computed metric crosses the threshold again per §1.3"
        side_effects:
          - "if heloc.status == DRAW: transition heloc DRAW -> FROZEN"
          - "increments Covenant.version by 1"

  - entity: FeeAssessment
    initial_state: OUTSTANDING
    terminal_states: [SETTLED, WAIVED]
    transitions:
      - from: OUTSTANDING
        to: SETTLED
        trigger: "system: Payment waterfall fully covers this fee"
        actor: system
        preconditions:
          - "cumulative fee_applied across payments >= amount_cents"
        side_effects:
          - "increments FeeAssessment.version by 1"
      - from: OUTSTANDING
        to: WAIVED
        trigger: "system: covenant cure waives ANNUAL fee assessed in breach window"
        actor: system
        preconditions:
          - "fee_type == ANNUAL"
          - "the covenant whose breach window contains this fee transitions BREACHED -> CURED"
        side_effects:
          - "increments FeeAssessment.version by 1"

  - entity: Draw
    initial_state: BOOKED
    terminal_states: [REVERSED]
    transitions:
      - from: BOOKED
        to: REVERSED
        trigger: "POST /helocs/{id}/draws/{did}/reverse"
        actor: LoanServicer
        preconditions:
          - "draw.status == BOOKED"
          - "heloc.status IN {DRAW, FROZEN}"
          - "heloc.current_balance_cents >= draw.amount_cents (compensating-invariant: cannot reverse below 0 principal)"
        side_effects:
          - "credit heloc.current_balance_cents by draw.amount_cents (compensation of the original debit)"
          - "recompute heloc.available_credit_cents = max(credit_limit_cents - current_balance_cents, 0)"
          - "increments Heloc.version by 1"
          - "increments Draw.version by 1"

concurrency_rules:
  - rule_id: index-reset-stale-rate
    parent_entity: IndexRate
    write_endpoint: "POST /index-rates/{id}/supersede"
    occ_field: "expected_indexrate_version"
    description: |
      Superseding an IndexRate by publishing a newer PRIME value against an
      IndexRate whose version has advanced since the client last observed it is
      rejected. This captures the case where another servicer has already
      published a fresher PRIME (legitimately superseding the prior under the
      product's single-active-index rule) and the current writer's view of the
      index row is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: chronological_interest_accrual
    trigger: "on POST /helocs/{id}/payments (before waterfall) and on GET /helocs/{id}/interest-quote"
    algorithm: chronological
    formula: |
      # Daily simple interest replayed in posting order over BOOKED draws and prior payments.
      # daily_rate = current_apr_bps / 10000 / 365
      # Walk events (Draws BOOKED, Payments) sorted by (event_ts ASC, created_at ASC);
      #   between consecutive events, accrue on the running principal:
      #   accrued += round_half_up( running_principal_cents * daily_rate * days_elapsed )
      # A draw raises running_principal at its requested_at.
      # A payment's interest_applied reduces accrued at its posted_at (waterfall handled separately).
      # accrued_interest_cents = final accumulator from last-payment anchor to 'as_of' clock.
    input_set: "Draws with status == BOOKED and Payments with posted_at <= as_of, ordered chronologically; REVERSED draws excluded"
    constants:
      DAY_COUNT_BASIS: 365
      ROUNDING: round_half_up
    precision: "integer cents, round_half_up per inter-event segment then sum (order pinned: round-per-segment-then-sum)"
    variants:
      - name: forward_projected_payoff
        when: "GET /helocs/{id}/payoff-quote?as_of=<future ISO>"
        difference: |
          Projects accrual FORWARD from now to the requested future as_of on the CURRENT
          running principal assuming NO intervening draws/payments — a single segment:
          round_half_up(current_balance_cents * daily_rate * days_to_as_of). Differs from
          chronological replay because it does not re-walk historical events; it estimates
          a future payoff rather than reconstructing the historical ledger.

  - name: covenant_breach_check
    trigger: "on POST /helocs/{id}/covenants/{cid}/evaluate and POST /helocs/{id}/covenants/{cid}/cure"
    algorithm: threshold
    formula: |
      # Metric depends on covenant_type; breach when metric crosses threshold per direction:
      # MAX_CLTV:           cltv_bps = round_half_up(
      #                        (property.senior_lien_balance_cents + heloc.current_balance_cents)
      #                         * 10000 / property.appraised_value_cents )
      #                     BREACH iff cltv_bps > threshold_value     (strictly greater)
      # MIN_DSCR:           # debt-service-coverage; annual NOI proxy = annual_income_cents;
      #                     annual_debt_service = monthly_debt_obligation_cents * 12
      #                                           + round_half_up(heloc.current_balance_cents
      #                                             * heloc.current_apr_bps / 10000)
      #                     dscr_bps = round_half_up(annual_income_cents * 10000 / annual_debt_service)  # annual_debt_service>0
      #                     BREACH iff dscr_bps < threshold_value     (strictly less)
      # MAX_DELINQUENCY_DAYS: BREACH iff heloc.delinquency_days > threshold_value   (strictly greater)
    input_set: "single Heloc, its Property, its Borrower; uses live computed fields current_balance_cents, current_apr_bps, delinquency_days"
    constants:
      BPS_SCALE: 10000
      MONTHS_PER_YEAR: 12
    precision: "all ratios in basis points (integer), round_half_up before comparison"

  - name: payment_waterfall_allocation
    trigger: "on POST /helocs/{id}/payments"
    algorithm: waterfall_allocation
    formula: |
      # Allocate amount_cents across ordered buckets; remainder cascades down; no negative buckets.
      # Bucket order is PINNED: (0) outstanding fees, (1) accrued interest, (2) principal.
      # remaining = amount_cents
      # fee_due = sum(FeeAssessment.amount_cents where settlement_status==OUTSTANDING), oldest-first by created_at ASC
      # fee_applied      = min(remaining, fee_due);       remaining -= fee_applied
      # interest_applied = min(remaining, accrued_interest_cents); remaining -= interest_applied
      # principal_applied= min(remaining, current_balance_cents);  remaining -= principal_applied
      # Any remaining after principal is REJECTED as overpayment (ERR_OVERPAYMENT) — payment not booked.
      # Conserved-quantity invariant: fee_applied + interest_applied + principal_applied == amount_cents.
    input_set: "single Payment against single Heloc; OUTSTANDING fees ordered by created_at ASC"
    constants:
      OVERPAYMENT_REJECTED: true
    precision: "integer cents; allocation is exact (no rounding inside the waterfall)"

  - name: annual_fee_assessment
    trigger: "on POST /helocs/{id}/advance-clock crossing a draw-period anniversary"
    algorithm: aggregation
    formula: |
      # On each origination_date anniversary that falls within the draw period:
      #   elapsed_anniversaries = floor( days_between(origination_date, clock) / 365 )
      #   for each new anniversary index k in (anniversary_count, elapsed_anniversaries]
      #     and k <= draw_period_years:
      #        create FeeAssessment(fee_type=ANNUAL, amount_cents=heloc.annual_fee_cents, OUTSTANDING)
      #   set heloc.anniversary_count = min(elapsed_anniversaries, draw_period_years)
    input_set: "single Heloc; only anniversaries within [1, draw_period_years]"
    constants:
      DAYS_PER_YEAR: 365
    precision: "integer day arithmetic; floor on anniversary count"

  - name: early_closure_fee
    trigger: "on POST /helocs/{id}/close while clock < origination_date + draw_period_years"
    algorithm: tiered_pricing
    formula: |
      # Prepayment penalty tiered on how early the close is, measured in full years remaining
      # in the draw period: years_remaining = ceil( days_between(clock, origination_date + draw_period_years) / 365 )
      # tier rate (bps of credit_limit_cents):
      #   years_remaining >= 8 : 200 bps
      #   4 <= years_remaining <= 7 : 100 bps
      #   1 <= years_remaining <= 3 : 50 bps
      #   years_remaining == 0 : 0 (no early-closure fee; draw period effectively elapsed)
      # fee = round_half_up( credit_limit_cents * tier_bps / 10000 )
    input_set: "single Heloc at close time"
    constants:
      TIER1_MIN_YEARS: 8
      TIER1_BPS: 200
      TIER2_BPS: 100
      TIER3_BPS: 50
    precision: "integer cents, round_half_up; ceil on years_remaining"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all except Anonymous-permitted endpoints"
  - priority: 2
    category: auth
    check: "Acting role is permitted for this operation per §1.7 RBAC"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "All path-referenced resources (heloc, covenant, draw, index-rate) exist, left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all path-parameterized endpoints"
  - priority: 4
    category: existence
    check: "Body FK references (borrower_id, property_id, covenant_id, heloc_id) resolve to existing rows"
    error_id: ERR_REFERENCE_NOT_FOUND
    http_status: 404
    applies_to: "POST /helocs, POST /helocs/{id}/covenants, POST /helocs/{id}/declare-default"
  - priority: 5
    category: state
    check: "Target resource is in a state from which the requested transition is defined (§1.2)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"
  - priority: 6
    category: business_safety
    check: "Default may only be declared by a LoanServicer who is NOT the LoanOfficer that activated the line (segregation of duties)"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /helocs/{id}/declare-default"
  - priority: 7
    category: business_safety
    check: "Default declaration requires the referenced covenant to be BREACHED and belong to this heloc"
    error_id: ERR_NO_BREACHED_COVENANT
    http_status: 409
    applies_to: "POST /helocs/{id}/declare-default"
  - priority: 8
    category: business_referential
    check: "Activation requires borrower.kyc_status == CLEARED"
    error_id: ERR_KYC_NOT_CLEARED
    http_status: 409
    applies_to: "POST /helocs/{id}/activate"
  - priority: 9
    category: business_constraint
    check: "Activation requires one covenant of each type {MAX_CLTV, MIN_DSCR, MAX_DELINQUENCY_DAYS}"
    error_id: ERR_COVENANT_SET_INCOMPLETE
    http_status: 409
    applies_to: "POST /helocs/{id}/activate"
  - priority: 10
    category: business_constraint
    check: "Activation requires an active (non-superseded) PRIME IndexRate to exist"
    error_id: ERR_NO_ACTIVE_INDEX
    http_status: 409
    applies_to: "POST /helocs/{id}/activate"
  - priority: 11
    category: business_constraint
    check: "A FIRST-position HELOC requires property.senior_lien_balance_cents == 0 at activation"
    error_id: ERR_LIEN_POSITION_CONFLICT
    http_status: 409
    applies_to: "POST /helocs/{id}/activate"
  - priority: 12
    category: business_temporal
    check: "convert-to-repayment requires clock >= origination_date + draw_period_years"
    error_id: ERR_DRAW_PERIOD_NOT_ELAPSED
    http_status: 409
    applies_to: "POST /helocs/{id}/convert-to-repayment"
  - priority: 13
    category: business_constraint
    check: "Draw allowed only while heloc.status == DRAW (not FROZEN/REPAYMENT/DEFAULTED)"
    error_id: ERR_DRAWS_NOT_PERMITTED
    http_status: 409
    applies_to: "POST /helocs/{id}/draws"
  - priority: 14
    category: business_fiscal
    check: "Draw amount must not exceed available_credit_cents"
    error_id: ERR_INSUFFICIENT_CREDIT
    http_status: 422
    applies_to: "POST /helocs/{id}/draws"
  - priority: 15
    category: business_fiscal
    check: "Payment amount must not exceed (outstanding fees + accrued interest + current principal); excess is overpayment"
    error_id: ERR_OVERPAYMENT
    http_status: 422
    applies_to: "POST /helocs/{id}/payments"
  - priority: 16
    category: business_constraint
    check: "Close requires current_balance_cents == 0 AND accrued_interest_cents == 0"
    error_id: ERR_BALANCE_NOT_ZERO
    http_status: 409
    applies_to: "POST /helocs/{id}/close"
  - priority: 17
    category: business_fiscal
    check: "Close blocked while any FeeAssessment (including just-assessed EARLY_CLOSURE) is OUTSTANDING"
    error_id: ERR_FEES_OUTSTANDING
    http_status: 409
    applies_to: "POST /helocs/{id}/close"
  - priority: 18
    category: business_constraint
    check: "Draw reversal requires current_balance_cents >= draw.amount_cents (no principal underflow)"
    error_id: ERR_REVERSAL_UNDERFLOW
    http_status: 422
    applies_to: "POST /helocs/{id}/draws/{did}/reverse"
  - priority: 19
    category: business_constraint
    check: "Superseding an IndexRate requires expected_indexrate_version to match the current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /index-rates/{id}/supersede"
  - priority: 20
    category: business_constraint
    check: "Request body field constraints: positive amounts, enum membership, score range, credit_limit floor"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "all POST/PATCH with body"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:

  # ---- Borrower ----
  - method: POST
    path: "/borrowers"
    description: "Create a borrower"
    roles: [LoanOfficer]
    code: 201
    input: [full_name, annual_income_cents, "monthly_debt_obligation_cents?", credit_score, "kyc_status?"]
    output: Borrower
    side_effects: []
  - method: GET
    path: "/borrowers/{id}"
    description: "Fetch a borrower"
    roles: [LoanOfficer, LoanServicer, Auditor]
    code: 200
    input: []
    output: Borrower
    side_effects: []
  - method: PATCH
    path: "/borrowers/{id}"
    description: "Update borrower KYC status or financials"
    roles: [LoanOfficer]
    code: 200
    input: ["kyc_status?", "annual_income_cents?", "monthly_debt_obligation_cents?"]
    output: Borrower
    side_effects: ["increments Borrower.version by 1"]

  # ---- Property ----
  - method: POST
    path: "/properties"
    description: "Create a collateral property"
    roles: [LoanOfficer]
    code: 201
    input: [street_address, appraised_value_cents, "senior_lien_balance_cents?", county_fips]
    output: Property
    side_effects: []
  - method: GET
    path: "/properties/{id}"
    description: "Fetch a property"
    roles: [LoanOfficer, LoanServicer, Auditor]
    code: 200
    input: []
    output: Property
    side_effects: []
  - method: PATCH
    path: "/properties/{id}"
    description: "Update appraised value or senior lien balance (revaluation)"
    roles: [LoanOfficer, LoanServicer]
    code: 200
    input: ["appraised_value_cents?", "senior_lien_balance_cents?"]
    output: Property
    side_effects: ["increments Property.version by 1"]
  - method: GET
    path: "/properties/{id}/lien-records"
    description: "List LienRecords against this property (FK reverse-reachability)"
    roles: [LoanOfficer, LoanServicer, Auditor]
    code: 200
    input: []
    output: LienRecord[]
    side_effects: []

  # ---- IndexRate ----
  - method: POST
    path: "/index-rates"
    description: "Publish a PRIME index value"
    roles: [LoanServicer]
    code: 201
    input: ["index_name?", rate_bps, effective_date]
    output: IndexRate
    side_effects: ["mark any prior IndexRate with same index_name and earlier effective_date as superseded=true"]
  - method: GET
    path: "/index-rates/{id}"
    description: "Fetch an index rate"
    roles: [LoanServicer, LoanOfficer, Auditor]
    code: 200
    input: []
    output: IndexRate
    side_effects: []
  - method: GET
    path: "/index-rates"
    description: "List index rates (filterable by index_name and superseded)"
    roles: [LoanServicer, LoanOfficer, Auditor]
    code: 200
    input: ["index_name?", "superseded?"]
    output: IndexRate[]
    side_effects: []
  - method: POST
    path: "/index-rates/{id}/supersede"
    description: "Publish a newer PRIME value that supersedes this one (OCC-guarded)"
    roles: [LoanServicer]
    code: 201
    input: [rate_bps, effective_date, expected_indexrate_version]
    output: IndexRate
    side_effects:
      - "create new IndexRate(PRIME, rate_bps, effective_date)"
      - "set this IndexRate.superseded = true"
      - "recompute current_apr_bps on every Heloc in {DRAW, FROZEN, REPAYMENT} (cascade: index reset)"
      - "increments IndexRate.version by 1"

  # ---- Heloc ----
  - method: POST
    path: "/helocs"
    description: "Create a HELOC application"
    roles: [LoanOfficer]
    code: 201
    input: [borrower_id, property_id, lien_position, credit_limit_cents, margin_bps, rate_ceiling_bps, "annual_fee_cents?", origination_date, "draw_period_years?", "repayment_period_years?"]
    output: Heloc
    side_effects: []
  - method: GET
    path: "/helocs/{id}"
    description: "Fetch a HELOC with all computed fields reconciled"
    roles: [LoanOfficer, LoanServicer, Auditor]
    code: 200
    input: []
    output: Heloc
    side_effects: ["recompute available_credit_cents, current_apr_bps for read consistency"]
  - method: GET
    path: "/helocs"
    description: "List HELOCs (filterable by borrower_id, property_id, status)"
    roles: [LoanOfficer, LoanServicer, Auditor]
    code: 200
    input: ["borrower_id?", "property_id?", "status?"]
    output: Heloc[]
    side_effects: []
  - method: POST
    path: "/helocs/{id}/activate"
    description: "Activate APPLICATION -> DRAW; records lien, sets APR"
    roles: [LoanOfficer]
    code: 200
    input: []
    output: Heloc
    side_effects:
      - "create LienRecord RECORDED; set property.status ACTIVE"
      - "set current_apr_bps, available_credit_cents"
      - "increments Heloc.version by 1"
  - method: POST
    path: "/helocs/{id}/convert-to-repayment"
    description: "DRAW -> REPAYMENT once draw period elapsed"
    roles: [LoanServicer]
    code: 200
    input: []
    output: Heloc
    side_effects: ["available_credit_cents -> 0", "increments Heloc.version by 1"]
  - method: POST
    path: "/helocs/{id}/freeze"
    description: "DRAW -> FROZEN administrative freeze"
    roles: [LoanServicer]
    code: 200
    input: []
    output: Heloc
    side_effects: ["available_credit_cents -> 0", "increments Heloc.version by 1"]
  - method: POST
    path: "/helocs/{id}/unfreeze"
    description: "FROZEN -> DRAW when no covenant is BREACHED"
    roles: [LoanServicer]
    code: 200
    input: []
    output: Heloc
    side_effects: ["recompute available_credit_cents", "increments Heloc.version by 1"]
  - method: POST
    path: "/helocs/{id}/declare-default"
    description: "Declare default on a breached line (segregation of duties)"
    roles: [LoanServicer]
    code: 200
    input: [covenant_id]
    output: Heloc
    side_effects:
      - "create DefaultEvent"
      - "available_credit_cents -> 0"
      - "increments Heloc.version by 1"
  - method: POST
    path: "/helocs/{id}/close"
    description: "Close a paid-in-full line; may assess EARLY_CLOSURE fee; releases lien"
    roles: [LoanServicer]
    code: 200
    input: []
    output: Heloc
    side_effects:
      - "maybe create EARLY_CLOSURE FeeAssessment"
      - "set covenants CURED; release LienRecord; maybe release Property"
      - "increments Heloc.version by 1"
  - method: GET
    path: "/helocs/{id}/payoff-quote"
    description: "Forward-projected payoff quote (variant of interest accrual)"
    roles: [LoanOfficer, LoanServicer, Auditor]
    code: 200
    input: ["as_of?"]
    output: "{ payoff_cents: integer, projected_interest_cents: integer, as_of: string }"
    side_effects: []
  - method: GET
    path: "/helocs/{id}/interest-quote"
    description: "Chronological accrued-interest quote as of current clock"
    roles: [LoanOfficer, LoanServicer, Auditor]
    code: 200
    input: []
    output: "{ accrued_interest_cents: integer, as_of: string }"
    side_effects: []

  # ---- Draw ----
  - method: POST
    path: "/helocs/{id}/draws"
    description: "Book a draw against available credit"
    roles: [LoanServicer]
    code: 201
    input: [amount_cents]
    output: Draw
    side_effects:
      - "debit current_balance_cents; recompute available_credit_cents"
      - "accrue chronological interest up to now"
      - "increments Heloc.version by 1"
  - method: GET
    path: "/helocs/{id}/draws"
    description: "List draws for a HELOC (FK reverse-reachability)"
    roles: [LoanOfficer, LoanServicer, Auditor]
    code: 200
    input: ["status?"]
    output: Draw[]
    side_effects: []
  - method: POST
    path: "/helocs/{id}/draws/{did}/reverse"
    description: "Reverse a BOOKED draw (compensating action)"
    roles: [LoanServicer]
    code: 200
    input: []
    output: Draw
    side_effects:
      - "credit current_balance_cents by draw.amount_cents; recompute available_credit_cents"
      - "increments Heloc.version by 1; increments Draw.version by 1"

  # ---- Payment ----
  - method: POST
    path: "/helocs/{id}/payments"
    description: "Post a payment; waterfall fee->interest->principal"
    roles: [LoanServicer, Borrower]
    code: 201
    input: [amount_cents]
    output: Payment
    side_effects:
      - "accrue chronological interest up to posted_at"
      - "allocate via waterfall; settle fees; reduce accrued_interest and principal"
      - "recompute available_credit_cents; reset delinquency_days if obligation cleared"
      - "increments Heloc.version by 1"
  - method: GET
    path: "/helocs/{id}/payments"
    description: "List payments for a HELOC (FK reverse-reachability)"
    roles: [LoanOfficer, LoanServicer, Auditor, Borrower]
    code: 200
    input: []
    output: Payment[]
    side_effects: []

  # ---- Covenant ----
  - method: POST
    path: "/helocs/{id}/covenants"
    description: "Attach a covenant (default trigger) to a HELOC"
    roles: [LoanOfficer]
    code: 201
    input: [covenant_type, threshold_value]
    output: Covenant
    side_effects: []
  - method: GET
    path: "/helocs/{id}/covenants"
    description: "List covenants for a HELOC (FK reverse-reachability)"
    roles: [LoanOfficer, LoanServicer, Auditor]
    code: 200
    input: ["status?"]
    output: Covenant[]
    side_effects: []
  - method: GET
    path: "/covenants/{id}"
    description: "Fetch a single covenant (establishes the covenants collection segment)"
    roles: [LoanOfficer, LoanServicer, Auditor]
    code: 200
    input: []
    output: Covenant
    side_effects: []
  - method: POST
    path: "/helocs/{id}/covenants/{cid}/evaluate"
    description: "Evaluate a covenant; SATISFIED/CURED -> BREACHED on threshold crossing; may freeze line"
    roles: [LoanServicer]
    code: 200
    input: []
    output: Covenant
    side_effects:
      - "maybe transition heloc DRAW -> FROZEN"
      - "increments Covenant.version by 1"
  - method: POST
    path: "/helocs/{id}/covenants/{cid}/cure"
    description: "Cure a breached covenant when metric back in compliance; waives ANNUAL fee in breach window"
    roles: [LoanServicer]
    code: 200
    input: []
    output: Covenant
    side_effects:
      - "waive OUTSTANDING ANNUAL fees in breach window"
      - "increments Covenant.version by 1"

  # ---- DefaultEvent / FeeAssessment (reverse-reachability) ----
  - method: GET
    path: "/helocs/{id}/default-events"
    description: "List default events for a HELOC (FK reverse-reachability)"
    roles: [LoanServicer, Auditor]
    code: 200
    input: []
    output: DefaultEvent[]
    side_effects: []
  - method: GET
    path: "/helocs/{id}/fee-assessments"
    description: "List fee assessments for a HELOC (FK reverse-reachability)"
    roles: [LoanOfficer, LoanServicer, Auditor, Borrower]
    code: 200
    input: ["fee_type?", "settlement_status?"]
    output: FeeAssessment[]
    side_effects: []

  # ---- LienRecord reverse-reachability by heloc ----
  - method: GET
    path: "/helocs/{id}/lien-records"
    description: "List LienRecords for a HELOC (FK reverse-reachability)"
    roles: [LoanOfficer, LoanServicer, Auditor]
    code: 200
    input: []
    output: LienRecord[]
    side_effects: []

  # ---- Covenant reverse-reachability for DefaultEvent.covenant_id ----
  - method: GET
    path: "/covenants/{id}/default-events"
    description: "List default events triggered by this covenant (FK reverse-reachability for DefaultEvent.covenant_id)"
    roles: [LoanServicer, Auditor]
    code: 200
    input: []
    output: DefaultEvent[]
    side_effects: []

  # ---- Test-driving clock ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the system clock for deterministic temporal tests"
    roles: [LoanServicer, LoanOfficer]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: []
  - method: POST
    path: "/helocs/{id}/advance-clock"
    description: "Advance the line's billing clock; assesses ANNUAL fees and updates delinquency_days / anniversary_count"
    roles: [LoanServicer]
    code: 200
    input: [to_iso8601]
    output: Heloc
    side_effects:
      - "assess ANNUAL FeeAssessment for each newly crossed in-draw anniversary"
      - "recompute delinquency_days, anniversary_count, accrued_interest_cents"
      - "increments Heloc.version by 1"

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing/invalid X-User-Role or X-User-ID headers"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "Acting role not permitted for this operation"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "LoanServicer declaring default is the same user who activated the line as LoanOfficer"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Path-referenced resource does not exist"
  - id: ERR_REFERENCE_NOT_FOUND
    http: 404
    condition: "Body FK reference (borrower_id/property_id/covenant_id) does not resolve"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Requested transition not defined from the resource's current state"
  - id: ERR_NO_BREACHED_COVENANT
    http: 409
    condition: "Default declaration references a covenant that is not BREACHED or not on this heloc"
  - id: ERR_KYC_NOT_CLEARED
    http: 409
    condition: "Activation attempted while borrower.kyc_status != CLEARED"
  - id: ERR_COVENANT_SET_INCOMPLETE
    http: 409
    condition: "Activation attempted without one covenant of each required type"
  - id: ERR_NO_ACTIVE_INDEX
    http: 409
    condition: "Activation attempted with no active (non-superseded) PRIME index rate"
  - id: ERR_LIEN_POSITION_CONFLICT
    http: 409
    condition: "FIRST-position activation on a property with non-zero senior lien balance"
  - id: ERR_DRAW_PERIOD_NOT_ELAPSED
    http: 409
    condition: "convert-to-repayment before draw period elapsed"
  - id: ERR_DRAWS_NOT_PERMITTED
    http: 409
    condition: "Draw attempted while heloc.status != DRAW"
  - id: ERR_INSUFFICIENT_CREDIT
    http: 422
    condition: "Draw amount exceeds available_credit_cents"
  - id: ERR_OVERPAYMENT
    http: 422
    condition: "Payment exceeds total owed (fees + interest + principal)"
  - id: ERR_BALANCE_NOT_ZERO
    http: 409
    condition: "Close attempted while principal or accrued interest is non-zero"
  - id: ERR_FEES_OUTSTANDING
    http: 409
    condition: "Close blocked by an OUTSTANDING FeeAssessment"
  - id: ERR_REVERSAL_UNDERFLOW
    http: 422
    condition: "Draw reversal would drive current_balance_cents below 0"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_indexrate_version does not match current IndexRate.version on supersede"
  - id: ERR_INVALID_REQUEST
    http: 422
    condition: "Body field constraint violated (negative amount, bad enum, score out of range, credit_limit below floor)"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: LoanOfficer
    description: "Originates lines: creates borrowers/properties/helocs/covenants and activates"
    identity: "opaque"
    exclusive_operations:
      - "POST /borrowers"
      - "POST /properties"
      - "POST /helocs"
      - "POST /helocs/{id}/covenants"
      - "POST /helocs/{id}/activate"
      - "PATCH /borrowers/{id}"
    shared_operations:
      - "GET reads on borrowers, properties, helocs, covenants, lien-records, fee-assessments"
      - "PATCH /properties/{id}"
  - name: LoanServicer
    description: "Services active lines: index publication, draws, payments, freeze/default/close, covenant evaluation"
    identity: "opaque"
    exclusive_operations:
      - "POST /index-rates"
      - "POST /index-rates/{id}/supersede"
      - "POST /helocs/{id}/draws"
      - "POST /helocs/{id}/draws/{did}/reverse"
      - "POST /helocs/{id}/convert-to-repayment"
      - "POST /helocs/{id}/freeze"
      - "POST /helocs/{id}/unfreeze"
      - "POST /helocs/{id}/declare-default"
      - "POST /helocs/{id}/close"
      - "POST /helocs/{id}/covenants/{cid}/evaluate"
      - "POST /helocs/{id}/covenants/{cid}/cure"
      - "POST /helocs/{id}/advance-clock"
    shared_operations:
      - "POST /helocs/{id}/payments (with Borrower)"
      - "PATCH /properties/{id} (with LoanOfficer)"
      - "GET reads"
      - "POST /_clock/set_current_utc (with LoanOfficer)"
  - name: Borrower
    description: "The obligor; may post payments and read own line's payments/fees"
    identity: "entity_backed:Borrower"
    exclusive_operations: []
    shared_operations:
      - "POST /helocs/{id}/payments (with LoanServicer)"
      - "GET /helocs/{id}/payments"
      - "GET /helocs/{id}/fee-assessments"
  - name: Auditor
    description: "Read-only oversight across all lines including default events (segregation-of-duties audit trail)"
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "GET reads on all resources including default-events"
