        grounds:
          - validations[priority=64]
          - errors.ERR_ALLOCATION_TYPE_NOT_ALLOWED
          - entities.BenefitCategory.fields.pretax_allowed
        distinguishing_aspect: "Violating priority 64 alone: the category is ACTIVE, the window OPEN, the account present and the amount well under every ceiling, so the ONLY defect is that pretax_amount_cents > 0 on a category whose pretax_allowed is false - the response must be ERR_ALLOCATION_TYPE_NOT_ALLOWED (422) and no Election row may be created."
        test_recipe:
          setup:
            - "Employer 'Post Tax Only Co' is ACTIVE in US-TX-AUS with program_cap_cents 5000000."
            - "One ACTIVE PARKING category with monthly_exclusion_limit_cents 30000, pretax_allowed false and posttax_allowed true exists."
            - "One ACTIVE employee holds a BenefitAccount for that category at version 1, and the 2026-08 window is OPEN with the clock at its 2026-08-01T00:00:00Z default."
