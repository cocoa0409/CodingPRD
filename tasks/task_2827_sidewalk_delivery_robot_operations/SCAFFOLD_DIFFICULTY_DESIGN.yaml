              as: PlatformAdmin
              captures: { s1: $.data.id }
            - call: "POST /sidewalk-segments/${s1}/transitions"
              payload: { action: "SURVEY" }
              as: PlatformAdmin
            - call: "POST /sidewalk-segments/${s1}/transitions"
              payload: { action: "APPROVE" }
              as: PlatformAdmin
            - call: "POST /service-zones/${z}/permit-transitions"
              payload: { action: "ACTIVATE_PERMIT" }
              as: PlatformAdmin
            - call: "POST /robots"
              payload: { zone_id: "${z}", asset_tag: "RBT-001", width_cm: 78.0, container_capacity_liters: 60.0, max_speed_cm_s: 150 }
              as: PlatformAdmin
              captures: { r: $.data.id }
            - call: "POST /robots/${r}/duty-transitions"
              payload: { action: "STAGE" }
              as: FleetDispatcher
            - call: "POST /robots/${r}/duty-transitions"
              payload: { action: "MAKE_AVAILABLE" }
              as: FleetDispatcher
            - call: "POST /incident-reports"
              payload: { zone_id: "${z}", robot_id: "${r}", category: "PEDESTRIAN_CONTACT", severity: "SERIOUS", narrative: "robot clipped a planter and a pedestrian tripped", estimated_damage_cents: 30000 }
              as: RemoteOperator
              as_user_id: "op-1"
              captures: { ir: $.data.id }
            - call: "POST /incident-reports/${ir}/transitions"
              payload: { action: "SUBMIT_MUNICIPAL", municipal_case_ref: "SF-2026-0801" }
              as: SafetyOfficer
              as_user_id: "so-1"
          trigger:
            - call: "POST /incident-reports/${ir}/transitions"
              payload: { action: "CLOSE" }
