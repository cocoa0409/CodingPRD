  - rule_id: non_linear_state_machine
    instances:
      - name: document_review_loop_increments_revision_round_only_on_entry_to_changes_requested
        grounds:
          - state_machines.DraftDocument.DRAFT_to_IN_REVIEW
          - state_machines.DraftDocument.IN_REVIEW_to_CHANGES_REQUESTED
          - state_machines.DraftDocument.CHANGES_REQUESTED_to_IN_REVIEW
          - entities.DraftDocument.fields.revision_round
          - entities.DraftDocument.fields.change_note
          - validations[priority=19]
        distinguishing_aspect: |
          The DraftDocument machine is cyclic: IN_REVIEW -> CHANGES_REQUESTED -> IN_REVIEW is a real
          loop with an observable counter, and the counter is asymmetric — it advances only on the
          entry into CHANGES_REQUESTED and explicitly NOT on the loop-back SUBMIT_REVIEW edge. After
          SUBMIT_REVIEW, REQUEST_CHANGES, SUBMIT_REVIEW, REQUEST_CHANGES the row must read
          revision_round == 2 and status CHANGES_REQUESTED, not 3 (counting every edge) and not 1
          (counting distinct visits or refusing the second loop). change_note must hold the second
          note, proving the field is overwritten on each entry rather than only on the first.
        test_recipe:
          setup:
            - "An ADOPTED charter (min_quorum_count 2, required_functions [FINANCE, LEGAL]) with one ACTIVE voting FINANCE member and one ACTIVE voting LEGAL member."
            - "A ReportingCycle in CLOSE_OPEN and a DraftDocument in DRAFT of doc_type EARNINGS_RELEASE authored by the FINANCE member, revision_round 0 and change_note null."
