      difficulty_instance: boundary_precision_check / quorum_exactly_met_vs_one_short
      rationale: Asserted as the failure path of the named §1.8 instance (1 attendee < required 2) and again in dual_variant_calc/quorum_seated_vs_authorized_basis.
  - name: error_term_limit_exceeded_covered
    claim_type: violation_to_error
    grounds:
    - errors[ERR_TERM_LIMIT_EXCEEDED]
    excluded_because:
      difficulty_instance: boundary_precision_check / term_cooloff_exactly_elapsed_vs_one_day_early
      rationale: Asserted as the one-day-early failure of the named §1.8 instance; also the priority-pair winner in priority_pair_validation_conflict/term_limit_constraint_beats_overlap_temporal.
  - name: error_coverage_gap_and_overlap_covered
