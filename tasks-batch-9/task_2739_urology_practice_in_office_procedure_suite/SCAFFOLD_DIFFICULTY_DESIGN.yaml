          setup:
            - "one urologist, one scheduler, one procedure nurse, one sterile processing tech"
            - "patient Noor Fadel, egfr 60"
            - "room Cysto A: CYSTO_SUITE, turnover_minutes 10"
            - "type CYSTOSCOPY: base 20, cleanup HIGH, requires_scope true, no antibiotic, no consignment, required_prep_codes []"
            - "scope SCP-9002 created but deliberately NOT commissioned, so hld_pass_at stays null while status is AVAILABLE and leak_test_required is false"
            - "the case is scheduled and CLEARED, so priorities 40, 42, 43, 48, 60 and 68 are all satisfied and priority 52 is the only violated rule"
            - "clock at 2026-09-14T14:00:00Z, exactly scheduled_start_at"
          setup_api_calls:
            - call: "POST /urology/providers"
              payload: { full_name: "Dr Ada Nour", npi: "1000000001", role_type: "UROLOGIST" }
