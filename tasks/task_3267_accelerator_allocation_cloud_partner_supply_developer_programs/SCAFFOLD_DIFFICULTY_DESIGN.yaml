scaffold_difficulty_design:
- rule_id: dual_variant_calc
  instances:
  - name: subscription_fee_forward_looking_vs_chronological
    grounds:
    - calculations.subscription_fee_provisional
    - calculations.subscription_fee_final
    - state_machines.EnterpriseSubscription.DRAFT_to_ACTIVE
    - state_machines.EnterpriseSubscription.ACTIVE_to_RECLAIMED
    - entities.EnterpriseSubscription.fields.seat_count
    distinguishing_aspect: 'For one subscription with seat_count 25 the forward-looking fee binds to

      25 seats while the chronological fee binds the SEAT_MIN floor of 40, so

      annual_fee_cents == 900000 at activation but settled_fee_cents == 1440000

      after reclaim — the two variants disagree by exactly 540000 cents on

      identical input.

      '
    test_recipe:
      setup:
      - Logical clock at 2026-09-01T00:00:00Z. Partner HELIOS qualified; SKU AC-100-PCIE at GENERAL_AVAILABILITY with 400 units allocated and its evaluation ring fence set; pool POOL-AMER-1 open; stack SL-TRAIN-1 released with entitlement_units 250; deployment DEP-1 activated on the SKU.
      setup_api_calls:
      - call: POST /accelerators/_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /accelerators/blueprints
        payload:
          blueprint_code: RA-8X-HGX
          blueprint_type: TRAINING_CLUSTER
          target_tdp_watts: 1400
          required_validation_minutes: 120
          evaluation_deadline_days: 30
        as: SupplyPlanner
        captures:
          bp_id: $.data.id
      - call: POST /accelerators/blueprints/${bp_id}/certify
        payload: {}
        as: SupplyPlanner
      - call: POST /accelerators/partners
        payload:
          legal_name: Helios Cloud Systems
          partner_type: CLOUD_PROVIDER
          destination_country: US
          export_restriction_tier: LICENSE_EXCEPTION
          origin_epoch_index: 5
        as: PartnerOps
        captures:
          pa_id: $.data.id
      - call: POST /accelerators/partners/${pa_id}/validations
        payload:
          validation_minutes: 240
          test_count: 6
          blueprint_id: ${bp_id}
        as: PartnerProgramManager
        captures:
          pa_ev: $.data.id
      - call: POST /accelerators/partners/${pa_id}/qualify
        payload: {}
        as: PartnerProgramManager
      - call: POST /accelerators/allocations
        payload:
          sku_code: AC-100-PCIE
          product_family: DATACENTER
          form_factor: PCLE
          hbm_capacity_gb: 80
          tdp_watts: 1350
          supply_ceiling_units: 10000
          long_term_availability_through: '2029-01-01T00:00:00Z'
        as: PlatformAdmin
        captures:
          sku_id: $.data.id
      - call: POST /accelerators/allocations/${sku_id}/advance_lifecycle
        payload: {}
        as: PlatformAdmin
      - call: POST /accelerators/supply-nodes
        payload:
          node_code: POOL-AMER-1
          product_sku_id: ${sku_id}
          node_region: AMERICAS
          capacity_units: 1000
          requested_hotness_tier: COOL
        as: SupplyPlanner
        captures:
          node_id: $.data.id
      - call: POST /accelerators/stack-licenses
        payload:
          license_code: SL-TRAIN-1
          product_sku_id: ${sku_id}
          stack_name: Training Suite
          entitlement_units: 250
          min_package_version: 1.0.0
          preview_stack_flag: false
        as: SupplyPlanner
        captures:
          st_id: $.data.id
      - call: POST /accelerators/stack-licenses/${st_id}/release
        payload: {}
        as: SupplyPlanner
      - call: GET /accelerators/partners/${pa_id}
        payload: {}
        as: PartnerOps
        as_user_id: ${pa_id}
        captures:
          pa_v: $.data.version
      - call: GET /accelerators/allocations/${sku_id}
        payload: {}
        as: PlatformAdmin
        captures:
          sku_alloc: $.data.allocated_units
      - call: POST /accelerators/allocation-holds
        payload:
          product_sku_id: ${sku_id}
          supply_node_id: ${node_id}
          quantity_units: 400
          hold_friction_tier: COOL
          expected_partner_version: ${pa_v}
          expected_allocated_units: ${sku_alloc}
        as: PartnerOps
        as_user_id: ${pa_id}
        captures:
          h_main: $.data.id
      - call: POST /accelerators/allocation-holds/${h_main}/commit
        payload:
          consume_reservation: false
        as: PartnerOps
        as_user_id: ${pa_id}
      - call: POST /accelerators/deployments
        payload:
          product_sku_id: ${sku_id}
          destination_country_code: US
          stack_manifest:
          - license_id: ${st_id}
            entitlement_units: 250
        as: SupportAccountManager
        captures:
          dep_id: $.data.id
      - call: POST /accelerators/deployments/${dep_id}/activate
        payload: {}
        as: SupportAccountManager
      - call: POST /accelerators/subscriptions
        payload:
          deployment_id: ${dep_id}
          support_tier: BUSINESS
          seat_count: 25
          licence_group:
          - license_id: ${st_id}
          trial_flag: true
        as: SupportAccountManager
        captures:
          sub_id: $.data.id
      trigger:
      - call: POST /accelerators/subscriptions/${sub_id}/activate
        payload: {}
        as: SupportAccountManager
        captures:
          sub_ann: $.data.annual_fee_cents
          sub_credit: $.data.support_credit_units
      - call: POST /accelerators/subscriptions/${sub_id}/reclaim
        payload: {}
        as: SupportAccountManager
        captures:
          sub_settled: $.data.settled_fee_cents
      assert:
      - ${sub_ann} == 900000
      - ${sub_settled} == 1440000
      - ${sub_settled} - ${sub_ann} == 540000
      - ${sub_credit} == 75
  - name: allocation_value_estimate_vs_confirm_saturating_ramp
    grounds:
    - calculations.allocation_value_estimate
    - calculations.allocation_value_confirm
    - entities.AllocationHold.fields.economic_tag
    - calculations.allocation_priority_ranking
    distinguishing_aspect: 'For one hold with allocation_gap_days 45 and quantity_units 500 the

      estimate saturates its time ramp at TIME_MAX so value_units is 800.0

      while the confirm score keeps the full 45 days and reaches 950.0 — two

      valid weighted scores over identical inputs that differ by 150.0 and

      therefore emit economic_tag HIGH_VALUE.

      '
    test_recipe:
      setup:
      - Logical clock at 2026-09-01T00:00:00Z. Partner HELIOS qualified with origin_epoch_index 5, a MEDIUM-horizon forecast acknowledged and committed at 1000 units, and an open COOL pool on SKU AC-100-PCIE.
      setup_api_calls:
      - call: POST /accelerators/_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /accelerators/blueprints
        payload:
          blueprint_code: RA-8X-HGX
          blueprint_type: TRAINING_CLUSTER
          target_tdp_watts: 1400
          required_validation_minutes: 120
          evaluation_deadline_days: 30
        as: SupplyPlanner
        captures:
          bp_id: $.data.id
      - call: POST /accelerators/blueprints/${bp_id}/certify
        payload: {}
        as: SupplyPlanner
      - call: POST /accelerators/partners
        payload:
          legal_name: Helios Cloud Systems
          partner_type: CLOUD_PROVIDER
          destination_country: US
          export_restriction_tier: LICENSE_EXCEPTION
          origin_epoch_index: 5
        as: PartnerOps
        captures:
          pa_id: $.data.id
      - call: POST /accelerators/partners/${pa_id}/validations
        payload:
          validation_minutes: 240
          test_count: 6
          blueprint_id: ${bp_id}
        as: PartnerProgramManager
        captures:
          pa_ev: $.data.id
      - call: POST /accelerators/partners/${pa_id}/qualify
        payload: {}
        as: PartnerProgramManager
      - call: POST /accelerators/allocations
        payload:
          sku_code: AC-100-PCIE
          product_family: DATACENTER
          form_factor: PCLE
          hbm_capacity_gb: 80
          tdp_watts: 1350
          supply_ceiling_units: 10000
          long_term_availability_through: '2029-01-01T00:00:00Z'
        as: PlatformAdmin
        captures:
          sku_id: $.data.id
      - call: POST /accelerators/supply-nodes
        payload:
          node_code: POOL-AMER-1
          product_sku_id: ${sku_id}
          node_region: AMERICAS
          capacity_units: 1000
          requested_hotness_tier: COOL
        as: SupplyPlanner
        captures:
          node_id: $.data.id
      - call: GET /accelerators/partners/${pa_id}
        payload: {}
        as: PartnerOps
        as_user_id: ${pa_id}
        captures:
          pa_v: $.data.version
      - call: POST /accelerators/_clock/set_current_utc
        payload:
          current_utc: '2026-09-18T00:00:00Z'
        as: PlatformAdmin
      - call: GET /accelerators/partners/${pa_id}
        payload: {}
        as: PartnerOps
        as_user_id: ${pa_id}
        captures:
          pa_v_ack: $.data.version
      - call: POST /accelerators/demand-forecasts
        payload:
          product_sku_id: ${sku_id}
          requested_quantity_units: 1000
          expected_partner_version: ${pa_v_ack}
        as: PartnerOps
        as_user_id: ${pa_id}
        captures:
          fc_id: $.data.id
      - call: POST /accelerators/demand-forecasts/${fc_id}/acknowledge
        payload: {}
        as: PartnerProgramManager
      - call: POST /accelerators/demand-forecasts/${fc_id}/commit
        payload:
          committed_quantity_units: 1000
        as: PartnerOps
        as_user_id: ${pa_id}
      - call: GET /accelerators/allocations/${sku_id}
        payload: {}
        as: PlatformAdmin
        captures:
          sku_alloc: $.data.allocated_units
      - call: GET /accelerators/partners/${pa_id}
        payload: {}
        as: PartnerOps
        as_user_id: ${pa_id}
        captures:
          pa_v_hold: $.data.version
      trigger:
      - call: POST /accelerators/allocation-holds
        payload:
          product_sku_id: ${sku_id}
          supply_node_id: ${node_id}
          quantity_units: 500
          hold_friction_tier: COOL
          forecast_id: ${fc_id}
          expected_partner_version: ${pa_v_hold}
          expected_allocated_units: ${sku_alloc}
        as: PartnerOps
        as_user_id: ${pa_id}
        captures:
          hold_est_id: $.data.id
          hold_tag: $.data.economic_tag
          hold_rate: $.data.committed_rate_v2
      assert:
      - ${hold_tag} == HIGH_VALUE
      - allocation_value_estimate for ${hold_est_id} == 800.0
      - allocation_value_confirm for ${hold_est_id} == 950.0
      - ${hold_rate} == 2.95
      - 'the two scores differ: confirm 950.0 > estimate 800.0'
- rule_id: combinatorial_formula
  instances:
  - name: allocation_commitment_fee_per_allocation_rounding_order
    grounds:
    - calculations.allocation_commitment_fee
    - calculations.committed_rate_v2
    - entities.SupplyNode.fields.total_committed_rate
    distinguishing_aspect: 'Per-allocation half-even rounding then summing yields

      node.committed_fee_cents == 23187, while summing the raw products first

      and rounding once yields 23188 — the two rounding orders are separated by

      exactly one cent on a two-hold pool, pinning mode (b).

      '
    test_recipe:
      setup:
      - Logical clock at 2026-09-01T00:00:00Z. Partner HELIOS qualified; SKU AC-100-PCIE; pool POOL-AMER-1 with capacity 1000; one MEDIUM-horizon forecast committed at 1000 units. Two holds exist at quantities 100 and 250, the second still REQUESTED.
      setup_api_calls:
