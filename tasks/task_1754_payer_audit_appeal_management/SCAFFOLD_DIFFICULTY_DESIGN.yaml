      - name: case_close_gated_by_children
        grounds:
          - state_machines.AuditCase.DETERMINATION_ISSUED_to_CLOSED
          - errors[ERR_OPEN_APPEALS_EXIST]
        distinguishing_aspect: |
          Pair AuditCase -> {AuditClaimLine, RecoupmentDemand}: the close
          transition's validity depends on the states of the case's claim lines
          (all terminal) and demands (all settled), not on the case's own fields.
        test_recipe:
          setup:
            - "Determined case with one line DENIED 100000 (no appeal) and one open demand 100000; clock advance finalizes the line after the L1 window lapses"
          setup_api_calls:
            - { call: "POST /payers", payload: { name: "P1", payer_type: "RAC", records_submission_days: 30, l1_deadline_days: 30, l2_deadline_days: 30, l3_deadline_days: 30, l4_deadline_days: 30, l5_deadline_days: 30, external_review_deadline_days: 30, concurrent_audit_cap: 10, hold_levels: [], interest_rate_bps_tier1: 100, interest_rate_bps_tier2: 200, interest_cap_pct: 25 }, as: RevenueCycleAdmin, captures: { p1: $.data.id } }
            - { call: "POST /issue-codes", payload: { code: "AUTH", category: "TECHNICAL", description: "Missing auth" }, as: RevenueCycleAdmin, captures: { ic: $.data.id } }
            - { call: "POST /audit-cases", payload: { payer_id: "${p1}", audit_type: "RAC_COMPLEX", received_at: "2026-08-01T00:00:00Z" }, as: HIMCoordinator, captures: { c1: $.data.id } }
            - { call: "POST /audit-cases/${c1}/claim-lines", payload: { claim_number: "L-1", patient_account_number: "PA-1", service_start_date: "2026-01-01T00:00:00Z", service_end_date: "2026-01-03T00:00:00Z", billed_amount_cents: 100000 }, as: HIMCoordinator, captures: { l1: $.data.id } }
            - { call: "GET /audit-cases/${c1}", payload: {}, as: Any, captures: { c1v: $.data.version } }
            - { call: "POST /audit-cases/${c1}/records-submissions", payload: { manifest_ref: "M1", expected_audit_case_version: "${c1v}" }, as: HIMCoordinator }
            - { call: "POST /audit-cases/${c1}/begin-payer-review", payload: {}, as: PayerAgent, as_user_id: "${p1}" }
            - { call: "POST /audit-cases/${c1}/determination", payload: { outcomes: [ { claim_line_id: "${l1}", outcome: "DENIED", denied_amount_cents: 100000, denial_category: "TECHNICAL", issue_code_id: "${ic}" } ] }, as: PayerAgent, as_user_id: "${p1}" }
            - { call: "POST /audit-cases/${c1}/recoupment-demands", payload: { principal_cents: 100000 }, as: PayerAgent, as_user_id: "${p1}", captures: { d1: $.data.id } }
          trigger:
            - { call: "POST /audit-cases/${c1}/close", payload: {}, as: DepartmentDirector, captures: { err1: $.data.error_id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: RevenueCycleAdmin }
            - { call: "GET /claim-lines/${l1}", payload: {}, as: Any, captures: { l_st: $.data.status } }
            - { call: "POST /audit-cases/${c1}/close", payload: {}, as: DepartmentDirector, captures: { err2: $.data.error_id } }
            - { call: "POST /recoupment-demands/${d1}/write-off", payload: {}, as: PFSAccountant }
            - { call: "POST /audit-cases/${c1}/close", payload: {}, as: DepartmentDirector, captures: { c_st: $.data.status } }
          assert:
            - "err1 == \"ERR_OPEN_APPEALS_EXIST\" (line DENIED is not terminal)"
            - "l_st == \"FINAL\" (L1 window 2026-08-31 lapsed with no appeal)"
            - "err2 == \"ERR_OPEN_APPEALS_EXIST\" (demand still DEMANDED)"
            - "c_st == \"CLOSED\" (line FINAL + demand WRITTEN_OFF -> close succeeds)"

  # ===================================================================
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # ===================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: claim_interval_overlap_half_open
        grounds:
          - calculations.claim_overlap_detection
          - errors[ERR_DUPLICATE_CLAIM_IN_OPEN_AUDIT]
        distinguishing_aspect: |
          Resource = (payer, claim_number) with HALF-OPEN service-interval
          semantics: [2026-01-05, 2026-01-12) collides with [2026-01-01,
          2026-01-10), but the adjacent [2026-01-10, 2026-01-20) touches the
          exclusive end and is accepted; the same claim_number under a
          DIFFERENT payer is also accepted (scope is per payer).
        test_recipe:
          setup:
            - "Payer P1 case C1 holding claim CLM-9 with service interval [2026-01-01, 2026-01-10); second P1 case C2 and a case under payer P2"
          setup_api_calls:
            - { call: "POST /payers", payload: { name: "P1", payer_type: "RAC", records_submission_days: 30, l1_deadline_days: 30, l2_deadline_days: 30, l3_deadline_days: 30, l4_deadline_days: 30, l5_deadline_days: 30, external_review_deadline_days: 30, concurrent_audit_cap: 10, hold_levels: [], interest_rate_bps_tier1: 100, interest_rate_bps_tier2: 200, interest_cap_pct: 25 }, as: RevenueCycleAdmin, captures: { p1: $.data.id } }
            - { call: "POST /payers", payload: { name: "P2", payer_type: "COMMERCIAL", records_submission_days: 30, l1_deadline_days: 30, l2_deadline_days: 30, l3_deadline_days: 30, l4_deadline_days: 30, l5_deadline_days: 30, external_review_deadline_days: 30, concurrent_audit_cap: 10, hold_levels: [], interest_rate_bps_tier1: 100, interest_rate_bps_tier2: 200, interest_cap_pct: 25 }, as: RevenueCycleAdmin, captures: { p2: $.data.id } }
            - { call: "POST /audit-cases", payload: { payer_id: "${p1}", audit_type: "RAC_COMPLEX", received_at: "2026-08-01T00:00:00Z" }, as: HIMCoordinator, captures: { c1: $.data.id } }
            - { call: "POST /audit-cases/${c1}/claim-lines", payload: { claim_number: "CLM-9", patient_account_number: "PA-1", service_start_date: "2026-01-01T00:00:00Z", service_end_date: "2026-01-10T00:00:00Z", billed_amount_cents: 100000 }, as: HIMCoordinator }
            - { call: "POST /audit-cases", payload: { payer_id: "${p1}", audit_type: "TARGETED_PROBE", received_at: "2026-08-02T00:00:00Z" }, as: HIMCoordinator, captures: { c2: $.data.id } }
            - { call: "POST /audit-cases", payload: { payer_id: "${p2}", audit_type: "COMMERCIAL_POSTPAY", received_at: "2026-08-02T00:00:00Z" }, as: HIMCoordinator, captures: { c3: $.data.id } }
          trigger:
            - { call: "POST /audit-cases/${c2}/claim-lines", payload: { claim_number: "CLM-9", patient_account_number: "PA-1", service_start_date: "2026-01-05T00:00:00Z", service_end_date: "2026-01-12T00:00:00Z", billed_amount_cents: 50000 }, as: HIMCoordinator, captures: { err_overlap: $.data.error_id } }
            - { call: "POST /audit-cases/${c2}/claim-lines", payload: { claim_number: "CLM-9", patient_account_number: "PA-1", service_start_date: "2026-01-10T00:00:00Z", service_end_date: "2026-01-20T00:00:00Z", billed_amount_cents: 50000 }, as: HIMCoordinator, captures: { adj_id: $.data.id } }
            - { call: "POST /audit-cases/${c3}/claim-lines", payload: { claim_number: "CLM-9", patient_account_number: "PA-1", service_start_date: "2026-01-05T00:00:00Z", service_end_date: "2026-01-12T00:00:00Z", billed_amount_cents: 50000 }, as: HIMCoordinator, captures: { cross_id: $.data.id } }
          assert:
            - "err_overlap == \"ERR_DUPLICATE_CLAIM_IN_OPEN_AUDIT\" (intersection [01-05, 01-10) non-empty)"
            - "adj_id is a valid id (adjacency at the exclusive end is NOT overlap)"
            - "cross_id is a valid id (overlap check is scoped to the same payer)"

      - name: payer_concurrent_audit_capacity
        grounds:
          - calculations.concurrent_audit_capacity
          - errors[ERR_CONCURRENT_AUDIT_CAP]
        distinguishing_aspect: |
          Resource = Payer with AGGREGATE-CAPACITY semantics (count of
          non-CLOSED cases at a point in time), not interval intersection: with
          concurrent_audit_cap 2, the second case (count 1 < 2) is accepted and
          the third (count 2 >= 2) is rejected — the boundary is exactly at cap.
        test_recipe:
          setup:
            - "Payer with concurrent_audit_cap 2"
          setup_api_calls:
            - { call: "POST /payers", payload: { name: "P1", payer_type: "RAC", records_submission_days: 30, l1_deadline_days: 30, l2_deadline_days: 30, l3_deadline_days: 30, l4_deadline_days: 30, l5_deadline_days: 30, external_review_deadline_days: 30, concurrent_audit_cap: 2, hold_levels: [], interest_rate_bps_tier1: 100, interest_rate_bps_tier2: 200, interest_cap_pct: 25 }, as: RevenueCycleAdmin, captures: { p1: $.data.id } }
          trigger:
            - { call: "POST /audit-cases", payload: { payer_id: "${p1}", audit_type: "RAC_COMPLEX", received_at: "2026-08-01T00:00:00Z" }, as: HIMCoordinator, captures: { c1: $.data.id } }
            - { call: "POST /audit-cases", payload: { payer_id: "${p1}", audit_type: "RAC_AUTOMATED", received_at: "2026-08-01T00:00:00Z" }, as: HIMCoordinator, captures: { c2: $.data.id } }
            - { call: "POST /audit-cases", payload: { payer_id: "${p1}", audit_type: "TARGETED_PROBE", received_at: "2026-08-01T00:00:00Z" }, as: HIMCoordinator, captures: { err_cap: $.data.error_id } }
          assert:
            - "c1 and c2 are valid ids (open_count 0 and 1 pass; count == cap - 1 is allowed)"
            - "err_cap == \"ERR_CONCURRENT_AUDIT_CAP\" (open_count == 2 >= cap at creation time)"

  # ===================================================================
  # Rule 9 — compensating_invariant (different conserved quantities)
  # ===================================================================
  - rule_id: compensating_invariant
    instances:
      - name: demand_principal_conservation
        grounds:
          - entities.RecoupmentDemand.fields.outstanding_principal_cents
          - state_machines.OffsetTransaction.APPLIED_to_REVERSED
        distinguishing_aspect: |
          Conserved quantity = demand principal cents: principal_cents ==
          sum(APPLIED offsets' principal_portion_cents) + written_off_cents +
          outstanding_principal_cents after every forward/compensating pair —
          500000 == 200000 + 0 + 300000 after the offset, and 500000 ==
          0 + 0 + 500000 after its reversal, with zero drift.
        test_recipe:
          setup:
            - "Determined case with line denied 500000; demand principal 500000 at current clock (0 interest); remittance gross 300000"
          setup_api_calls:
            - { call: "POST /payers", payload: { name: "P1", payer_type: "RAC", records_submission_days: 30, l1_deadline_days: 30, l2_deadline_days: 30, l3_deadline_days: 30, l4_deadline_days: 30, l5_deadline_days: 30, external_review_deadline_days: 30, concurrent_audit_cap: 10, hold_levels: [], interest_rate_bps_tier1: 100, interest_rate_bps_tier2: 200, interest_cap_pct: 25 }, as: RevenueCycleAdmin, captures: { p1: $.data.id } }
            - { call: "POST /issue-codes", payload: { code: "AUTH", category: "TECHNICAL", description: "Missing auth" }, as: RevenueCycleAdmin, captures: { ic: $.data.id } }
            - { call: "POST /audit-cases", payload: { payer_id: "${p1}", audit_type: "RAC_COMPLEX", received_at: "2026-08-01T00:00:00Z" }, as: HIMCoordinator, captures: { c1: $.data.id } }
            - { call: "POST /audit-cases/${c1}/claim-lines", payload: { claim_number: "L-1", patient_account_number: "PA-1", service_start_date: "2026-01-01T00:00:00Z", service_end_date: "2026-01-03T00:00:00Z", billed_amount_cents: 500000 }, as: HIMCoordinator, captures: { l1: $.data.id } }
            - { call: "GET /audit-cases/${c1}", payload: {}, as: Any, captures: { c1v: $.data.version } }
            - { call: "POST /audit-cases/${c1}/records-submissions", payload: { manifest_ref: "M1", expected_audit_case_version: "${c1v}" }, as: HIMCoordinator }
            - { call: "POST /audit-cases/${c1}/begin-payer-review", payload: {}, as: PayerAgent, as_user_id: "${p1}" }
            - { call: "POST /audit-cases/${c1}/determination", payload: { outcomes: [ { claim_line_id: "${l1}", outcome: "DENIED", denied_amount_cents: 500000, denial_category: "TECHNICAL", issue_code_id: "${ic}" } ] }, as: PayerAgent, as_user_id: "${p1}" }
            - { call: "POST /audit-cases/${c1}/recoupment-demands", payload: { principal_cents: 500000 }, as: PayerAgent, as_user_id: "${p1}", captures: { d1: $.data.id } }
            - { call: "POST /remittances", payload: { payer_id: "${p1}", gross_amount_cents: 300000 }, as: PayerAgent, as_user_id: "${p1}", captures: { rem: $.data.id } }
          trigger:
            - { call: "POST /recoupment-demands/${d1}/offsets", payload: { remittance_id: "${rem}", amount_cents: 200000 }, as: PFSAccountant, captures: { "off": $.data.id, off_prin: $.data.principal_portion_cents } }
            - { call: "GET /recoupment-demands/${d1}", payload: {}, as: Any, captures: { out_mid: $.data.outstanding_principal_cents, wo_mid: $.data.written_off_cents } }
            - { call: "POST /offset-transactions/${off}/reverse", payload: {}, as: PFSAccountant }
            - { call: "GET /recoupment-demands/${d1}", payload: {}, as: Any, captures: { out_end: $.data.outstanding_principal_cents, st_end: $.data.status } }
          assert:
            - "off_prin == 200000 and out_mid == 300000 (500000 == 200000 + 0 + 300000)"
            - "wo_mid == 0"
            - "out_end == 500000 and st_end == \"DEMANDED\" (500000 == 0 + 0 + 500000; reversal restores exactly, no drift)"

      - name: remittance_gross_conservation
        grounds:
          - entities.Remittance.fields.available_cents
          - entities.Remittance.fields.status
        distinguishing_aspect: |
          Conserved quantity = remittance gross cents: gross_amount_cents ==
          sum(APPLIED offsets' amount_cents) + available_cents at all times —
          300000 == 200000 + 100000 after allocation, and 300000 == 0 + 300000
          after reversal, with status recomputed PARTIALLY_ALLOCATED -> RECEIVED.
        test_recipe:
          setup:
            - "Determined case with line denied 500000; demand 500000 at current clock (0 interest); remittance gross 300000"
          setup_api_calls:
            - { call: "POST /payers", payload: { name: "P1", payer_type: "RAC", records_submission_days: 30, l1_deadline_days: 30, l2_deadline_days: 30, l3_deadline_days: 30, l4_deadline_days: 30, l5_deadline_days: 30, external_review_deadline_days: 30, concurrent_audit_cap: 10, hold_levels: [], interest_rate_bps_tier1: 100, interest_rate_bps_tier2: 200, interest_cap_pct: 25 }, as: RevenueCycleAdmin, captures: { p1: $.data.id } }
            - { call: "POST /issue-codes", payload: { code: "AUTH", category: "TECHNICAL", description: "Missing auth" }, as: RevenueCycleAdmin, captures: { ic: $.data.id } }
            - { call: "POST /audit-cases", payload: { payer_id: "${p1}", audit_type: "RAC_COMPLEX", received_at: "2026-08-01T00:00:00Z" }, as: HIMCoordinator, captures: { c1: $.data.id } }
            - { call: "POST /audit-cases/${c1}/claim-lines", payload: { claim_number: "L-1", patient_account_number: "PA-1", service_start_date: "2026-01-01T00:00:00Z", service_end_date: "2026-01-03T00:00:00Z", billed_amount_cents: 500000 }, as: HIMCoordinator, captures: { l1: $.data.id } }
            - { call: "GET /audit-cases/${c1}", payload: {}, as: Any, captures: { c1v: $.data.version } }
            - { call: "POST /audit-cases/${c1}/records-submissions", payload: { manifest_ref: "M1", expected_audit_case_version: "${c1v}" }, as: HIMCoordinator }
            - { call: "POST /audit-cases/${c1}/begin-payer-review", payload: {}, as: PayerAgent, as_user_id: "${p1}" }
            - { call: "POST /audit-cases/${c1}/determination", payload: { outcomes: [ { claim_line_id: "${l1}", outcome: "DENIED", denied_amount_cents: 500000, denial_category: "TECHNICAL", issue_code_id: "${ic}" } ] }, as: PayerAgent, as_user_id: "${p1}" }
            - { call: "POST /audit-cases/${c1}/recoupment-demands", payload: { principal_cents: 500000 }, as: PayerAgent, as_user_id: "${p1}", captures: { d1: $.data.id } }
          trigger:
            - { call: "POST /remittances", payload: { payer_id: "${p1}", gross_amount_cents: 300000 }, as: PayerAgent, as_user_id: "${p1}", captures: { rem: $.data.id, avail0: $.data.available_cents, st0: $.data.status } }
            - { call: "POST /recoupment-demands/${d1}/offsets", payload: { remittance_id: "${rem}", amount_cents: 200000 }, as: PFSAccountant, captures: { "off": $.data.id, off_amt: $.data.amount_cents } }
            - { call: "GET /remittances/${rem}", payload: {}, as: Any, captures: { avail1: $.data.available_cents, st1: $.data.status } }
            - { call: "POST /offset-transactions/${off}/reverse", payload: {}, as: PFSAccountant }
            - { call: "GET /remittances/${rem}", payload: {}, as: Any, captures: { avail2: $.data.available_cents, st2: $.data.status } }
          assert:
            - "avail0 == 300000 and st0 == \"RECEIVED\""
            - "off_amt == 200000 and avail1 == 100000 and st1 == \"PARTIALLY_ALLOCATED\" (300000 == 200000 + 100000)"
            - "avail2 == 300000 and st2 == \"RECEIVED\" (300000 == 0 + 300000 after the compensating reversal)"
