            - "the bond read shows obligated_amount == 1276.35 (captured as ${b1_obl}) and available_amount == 48723.65"
            - "the carrier read shows sanction_points == 2.0, open_claim_count == 1, custodial_status == ACTIVE"
            - "the ledger read returns exactly 1 entry with amount == 1234.60 and balance_after == 1276.35"
