          trigger:
            - call: "POST /records-desk/records-requests/${req_notoll_id}/clarification-request"
              payload: { question_text: "Please confirm the date range covered by the responsive records." }
              as: RecordsCoordinator
              captures: { e1: $.data.error_id }
            - call: "GET /records-desk/records-requests/${req_notoll_id}"
              as: RecordsCoordinator
            - call: "POST /records-desk/records-requests/${req_toll_id}/clarification-request"
              payload: { question_text: "Please confirm the date range covered by the responsive records." }
              as: RecordsCoordinator
          assert:
            - "trigger call 1: HTTP 422 with error_id ERR_TOLLING_NOT_PERMITTED"
            - "trigger call 2: status is still \"AWAITING_AGENCY_RESPONSE\", clarification_round_count == 0, clarification_opened_at == null, and version is unchanged from the value after submit"
            - "trigger call 3: HTTP 200 on the byte-identical payload; status == \"CLARIFICATION_REQUESTED\", clarification_round_count == 1, clarification_opened_at == \"2026-08-03T09:00:00Z\""
            - "trigger call 3: due_at_strict == \"2026-08-17T23:59:59.000Z\" == ${toll_due_strict} and due_at_tolled == due_at_strict, with tolled_days_total still 0 - opening a round tolls nothing"
            - "the only difference between the two calls is Agency.tolling_allowed, so the gate cannot be reading anything on the RecordsRequest itself"

      - name: appeal_ripeness_is_checked_before_venue_and_a_settled_appeal_is_final
        claim_type: priority_ordering
        grounds:
          - validations[priority=160]
          - validations[priority=162]
          - validations[priority=100]
          - entities.Agency.fields.appeal_venue
          - entities.Appeal.fields.ripeness_basis
        distinguishing_aspect: |
          One call violates BOTH the ripeness rule (priority 160) and the venue rule (priority 162), and
          the answer must be ERR_APPEAL_NOT_RIPE; only after the clock passes due_at_tolled does the very
          same wrong-venue payload switch its answer to ERR_APPEAL_VENUE_MISMATCH. The tail then pins
          that the appeal decision is single-shot: a second decision on a GRANTED appeal is
          ERR_INVALID_APPEAL_STATE, not an idempotent replay.
        test_recipe:
          setup:
            - "Clock at 2026-08-03T09:00:00Z. One Desk with a 500000-cent budget."
            - "One Agency: appeal_venue OMBUDS, appeal_decision_days 20, BUSINESS_DAYS, initial_response_days 10, no holidays, tolling_allowed true."
            - "One RecordsRequest submitted at 2026-08-03T09:00:00Z, so due_at_strict == due_at_tolled == 2026-08-17T23:59:59.000Z, sitting in AWAITING_AGENCY_RESPONSE."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: ManagingEditor
            - call: "POST /records-desk/desks"
              payload: { name: "Metro Investigations Desk", fee_budget_total_cents: 500000, retention_policy_days: 1095 }
              as: ManagingEditor
              captures: { desk_id: $.data.id }
            - call: "POST /records-desk/agencies"
              payload: { name: "Ombuds Reviewed Board", jurisdiction_code: "CA-OMB", statute_name: "CPRA", initial_response_days: 10, deadline_basis: "BUSINESS_DAYS", tolling_allowed: true, appeal_venue: "OMBUDS", appeal_decision_days: 20, search_fee_cents_per_hour: 3500, page_fee_cents: 25, max_waiver_cents: 10000 }
              as: RecordsCoordinator
              captures: { agency_id: $.data.id }
            - call: "GET /records-desk/desks/${desk_id}"
              as: RecordsCoordinator
              captures: { desk_v: $.data.version }
            - call: "POST /records-desk/records-requests"
              payload: { desk_id: "${desk_id}", agency_id: "${agency_id}", subject_summary: "Overdue response probe", requested_format: "CSV", estimated_page_count: 10, waiver_requested: false, public_interest_score: 40, expected_desk_version: "${desk_v}" }
              as: RecordsCoordinator
              captures: { req_id: $.data.id }
            - call: "POST /records-desk/records-requests/${req_id}/submit"
              payload: {}
              as: RecordsCoordinator
          trigger:
            - call: "POST /records-desk/appeals"
              payload: { request_id: "${req_id}", venue: "COURT", grounds: "The agency has blown the statutory deadline.", filing_fee_cents: 4500 }
              as: LegalCounsel
              captures: { e1: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-18T00:00:00Z" }
              as: LegalCounsel
            - call: "POST /records-desk/appeals"
              payload: { request_id: "${req_id}", venue: "COURT", grounds: "The agency has blown the statutory deadline.", filing_fee_cents: 4500 }
              as: LegalCounsel
              captures: { e2: $.data.error_id }
            - call: "POST /records-desk/appeals"
              payload: { request_id: "${req_id}", venue: "OMBUDS", grounds: "The agency has blown the statutory deadline.", filing_fee_cents: 4500 }
              as: LegalCounsel
              captures: { appeal_id: $.data.id }
            - call: "POST /records-desk/appeals/${appeal_id}/decision"
              payload: { outcome: "GRANTED", decision_rationale: "The ombuds ordered a response within ten days." }
              as: RecordsCoordinator
            - call: "POST /records-desk/appeals/${appeal_id}/decision"
              payload: { outcome: "DENIED", decision_rationale: "Attempted reversal of the settled appeal." }
              as: RecordsCoordinator
              captures: { e3: $.data.error_id }
          assert:
            - "trigger call 1: HTTP 409 with error_id ERR_APPEAL_NOT_RIPE - the clock is far before due_at_tolled, and although venue COURT also mismatches Agency.appeal_venue OMBUDS, priority 160 answers before priority 162"
            - "trigger call 1: no Appeal row is created, RecordsRequest.status is still \"AWAITING_AGENCY_RESPONSE\", Desk.open_appeal_count == 0 and Desk.fee_budget_committed_cents is unchanged"
            - "trigger call 3: HTTP 422 with error_id ERR_APPEAL_VENUE_MISMATCH on the SAME payload - once the clock is past due_at_tolled the ripeness gate passes and the venue gate becomes the answer"
            - "trigger call 4: HTTP 201; status == \"FILED\", ripeness_basis == \"OVERDUE\", filed_at == \"2026-08-18T00:00:00Z\", decision_due_at == \"2026-09-15T23:59:59.000Z\" (20 BUSINESS days from 2026-08-18 with no declared holidays)"
            - "trigger call 4: RecordsRequest.status == \"APPEAL_FILED\", Desk.open_appeal_count == 1, Desk.fee_budget_committed_cents == 4500 and Desk.fee_budget_available_cents == 495500"
            - "trigger call 5: HTTP 200; Appeal.status == \"GRANTED\", RecordsRequest.status back to \"AWAITING_AGENCY_RESPONSE\", Desk.open_appeal_count == 0, committed 0 and spent 4500"
            - "trigger call 6: HTTP 409 with error_id ERR_INVALID_APPEAL_STATE - the decision endpoint accepts only a FILED appeal"
            - "trigger call 6: Appeal.status is still \"GRANTED\", Appeal.decision_rationale is still the ombuds text from call 5, Desk.fee_budget_spent_cents is still 4500 and no counter moved"

      - name: field_definition_limit_binds_only_in_aggregate_and_name_conflict_wins
