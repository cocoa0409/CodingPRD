            - call: "POST /inland-marine/policies/${pol}/bind"
              payload: {}
              as: Underwriter
            - call: "POST /inland-marine/policies/${pol}/activate"
              payload: {}
              as: Underwriter
            - call: "POST /inland-marine/installation-floaters/${flt}/activate"
              payload: {}
              as: Underwriter
            - call: "POST /inland-marine/installation-floaters/${flt}/terminate"
              payload: { termination_reason: "ACCEPTANCE", termination_date: "2026-08-15" }
              as: Underwriter
            - call: "POST /inland-marine/installation-floaters/${flt}/terminate"
              payload: { termination_reason: "ACCEPTANCE", termination_date: "2026-10-01" }
