  - section: errors
    instances:

      - name: the_appeal_cycle_stops_at_the_second_appeal_and_a_short_term_tenant_cannot_claim
        claim_type: violation_to_error
        grounds:
          - validations.priority_64
          - validations.priority_59
          - state_machines.RelocationCase
          - global_constants.MAX_RELOCATION_APPEALS
        distinguishing_aspect: |
          Two different displacee_type values reach two different walls on the same parcel and the same
          ACCEPTED offer. The TENANT_90_DAY case rides the bounded cycle
          CLAIM_SUBMITTED -> CLAIM_DENIED -> APPEALED -> CLAIM_SUBMITTED twice; the third appeal is
          refused with ERR_APPEAL_LIMIT_REACHED and leaves the case parked in CLAIM_DENIED, which is
          NOT a terminal state - so the row is alive but has no legal move left. The
          TENANT_UNDER_90_DAY case is allowed to have eligibility determined, and only its claim
          submission is refused with ERR_TENANT_INELIGIBLE, so the refusal sits one step later than a
          naive reading of "ineligible" suggests.
        test_recipe:
          setup:
            - "The golden path through an ACCEPTED offer (net 21400000) on a tenant-occupied parcel, plus two OPENED relocation cases on that parcel: HH-A as TENANT_90_DAY and HH-B as TENANT_UNDER_90_DAY."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdministrator
              as_user_id: "pa-1"
            - call: "POST /mitigation-projects"
              payload: { project_code: "ERR-APPEAL-1", grant_program: "FMA", subrecipient_name: "City of Riverbend", total_federal_share_cap_cents: 500000000, period_of_performance_end_date: "2028-12-31" }
