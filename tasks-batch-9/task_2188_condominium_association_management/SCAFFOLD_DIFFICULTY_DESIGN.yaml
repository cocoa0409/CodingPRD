            - "PROBE A: the ABSTAIN ballot of unit ${ud} has counted == true yet contributes 0 to yes_weight_bp while its 1 bp stays in the denominator"
            - "PROBE B (6667 bp, one basis point more): create sa_b (total 1000000) with a freshly captured expected_association_version, open its ballot, cast YES from ${oa}/${ua}, ${ob}/${ub} and ${od}/${ud} and NO from ${oc}/${uc}, then close-ballot -> approval_status == APPROVED, eligible_weight_bp == 10000, yes_weight_bp == 6667, yes_share_bp == 6667, funding_status == UNFUNDED, and Association.reserve_designated_cents == 1000000"
            - "PROBE C (floor vs round_half_up): POST /units/${uc}/charges with entry_type COLLECTION_COST, amount_cents 200000, due_on 2026-04-01T00:00:00Z at clock 2026-10-18T00:00:00Z drives Unit.${uc} to LIEN_FILED with voting_eligible false (age 200 days, balance 200000 >= 180000, below the 360000 foreclosure trigger). Then create sa_c (total 1200000), open its ballot, cast YES from ${oa}/${ua} and ${ob}/${ub} only, and close-ballot -> eligible_weight_bp == 6667 (3333 + 3333 + 1, unit C excluded), yes_weight_bp == 6666, yes_share_bp == 9998 (floor of 9998.50008...; round_half_up would wrongly give 9999), approval_status == APPROVED, and Association.reserve_designated_cents == 2200000"
            - "PROBE D (empty-set boundary is distinct from failure): on a separate association whose only unit is LIEN_FILED, close-ballot returns HTTP 422 with error.id == ERR_NO_ELIGIBLE_VOTERS and leaves approval_status == BALLOTING — it does not report FAILED with yes_share_bp 0"

      - name: invoice_overrun_ceiling_floor_1358023_accepts_1358024_rejects
        grounds:
          - validations[priority=45]  # ERR_INVOICE_EXCEEDS_TOLERANCE
          - endpoints[POST /work-orders/{id}/invoice]
