              as: PlanningDirector
              as_user_id: "dual-1"
              captures: { e_self_approve: $.data.error_id }
            - call: "POST /otb/category-plans/${plan_id}/reject"
              payload: { rejection_reason: "self rejection" }
              as: PlanningDirector
              as_user_id: "dual-1"
              captures: { e_self_reject: $.data.error_id }
            - call: "POST /otb/category-plans/${plan_id}/reject"
              payload: { rejection_reason: "needs more depth" }
              as: PlanningDirector
              as_user_id: "director-1"
              captures: { rejected_status: $.data.status }
            - call: "POST /otb/category-plans/${plan_id}/submit"
              payload: { submission_note: "second pass" }
              as: MerchandisePlanner
              as_user_id: "dual-1"
              captures: { submitter2: $.data.submitted_by_user_id }
            - call: "POST /otb/category-plans/${plan_id}/approve"
