              as: TransportAdmin
              captures: { stu_a: $.data.id }
            - call: "POST /ridership-applications"
              payload: { district_id: "${d_id}", student_id: "${stu_a}", requested_route_id: "${r_id}", requested_stop_id: "${stop_id}" }
              as: TransportAdmin
              captures: { app_a: $.data.id }
            - call: "POST /ridership-applications/${app_a}/start-review"
              payload: {}
              as: TransportAdmin
            - call: "POST /ridership-applications/${app_a}/approve"
              payload: {}
              as: TransportAdmin
            - call: "POST /students"
              payload: { district_id: "${d_id}", parent_id: "par-2", full_name: "Second", grade: 6, home_lat: 40.05, home_lng: -75.0, rfid_uid: "RF-B" }
              as: TransportAdmin
              captures: { stu_b: $.data.id }
            - call: "POST /ridership-applications"
              payload: { district_id: "${d_id}", student_id: "${stu_b}", requested_route_id: "${r_id}", requested_stop_id: "${stop_id}" }
              as: TransportAdmin
              captures: { app_b: $.data.id }
            - call: "POST /ridership-applications/${app_b}/start-review"
              payload: {}
              as: TransportAdmin
            - call: "GET /routes/${r_id}"
              as: TransportAdmin
              captures: { r_vnow: $.data.version }
            - call: "POST /routes/${r_id}/posture"
              payload: { action: "RESTRICT", expected_route_version: "${r_vnow}" }
              as: TransportAdmin
          trigger:
            - call: "POST /ridership-applications/${app_b}/approve"
              payload: {}
              as: TransportAdmin
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 409"
            - "data.error_id == ERR_ROUTE_NOT_OPEN (p16 business_constraint beats p17 business_fiscal ERR_ROUTE_FULL)"

      - name: stale_version_beats_trip_in_flight_on_suspend
        grounds:
          - validations[priority=7]
          - validations[priority=9]
          - concurrency_rules[posture-change-stale-route]
          - state_machines.Route.OPEN_to_SUSPENDED
        distinguishing_aspect: |
          Error-category pair state (p7 ERR_STALE_VERSION) vs business_safety
          (p9 ERR_TRIP_IN_FLIGHT) — a DIFFERENT pair from instance 1. A SUSPEND carrying
          a stale expected_route_version on a route with an in-flight trip returns
          ERR_STALE_VERSION (p7) not ERR_TRIP_IN_FLIGHT (p9).
        test_recipe:
          setup:
            - "District + Route OPEN + Driver PRIMARY ACTIVE + one stop; a trip that is BOARDING (in-flight). Client holds an OLD route version captured before the assignment bumped it."
          setup_api_calls:
            - call: "POST /districts"
              payload: { name: "D1", school_lat: 40.0, school_lng: -75.0 }
              as: TransportAdmin
              captures: { d_id: $.data.id }
            - call: "POST /routes"
              payload: { district_id: "${d_id}", name: "R1", seat_capacity: 20 }
              as: TransportAdmin
              captures: { r_id: $.data.id, r_v0: $.data.version }
            - call: "POST /stops"
              payload: { route_id: "${r_id}", label: "S1", lat: 40.0, lng: -75.0, sequence: 1, scheduled_departure: "2026-09-01T07:00:00Z" }
              as: TransportAdmin
            - call: "POST /drivers"
              payload: { district_id: "${d_id}", full_name: "Drv A" }
              as: TransportAdmin
              captures: { drv_id: $.data.id }
            - call: "POST /routes/${r_id}/driver-assignments"
              payload: { driver_id: "${drv_id}", role: "PRIMARY", expected_route_version: "${r_v0}" }
              as: TransportAdmin
              captures: { asg_id: $.data.id }
            - call: "POST /bus-trips"
              payload: { route_id: "${r_id}", driver_assignment_id: "${asg_id}" }
              as: TransportAdmin
              captures: { trip_id: $.data.id }
            - call: "POST /bus-trips/${trip_id}/start-boarding"
              payload: {}
              as: Driver
              as_user_id: "${drv_id}"
          trigger:
            - call: "POST /routes/${r_id}/posture"
              payload: { action: "SUSPEND", expected_route_version: "${r_v0}" }
              as: TransportAdmin
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 412"
            - "data.error_id == ERR_STALE_VERSION (p7 state beats p9 business_safety ERR_TRIP_IN_FLIGHT; r_v0 is stale because the assignment bumped the version)"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: eligibility_distance_strict_gt_at_threshold
        grounds:
          - calculations.eligibility_determination
          - entities.District.fields.walk_threshold_miles
          - entities.RidershipApplication.fields.eligibility_basis
        distinguishing_aspect: |
          Numeric threshold metric on the start-review endpoint: distance uses strict
          '>' so a student whose rounded distance EQUALS the threshold (1.50 == 1.50) is
          NOT distance-eligible. With hazard_zone=false the basis is NONE.
        test_recipe:
          setup:
            - "District walk_threshold 1.5; Student home (40.02171,-75.0) rounds to 1.50, hazard_zone false; application UNDER_REVIEW path via start-review."
          setup_api_calls:
            - call: "POST /districts"
              payload: { name: "D1", school_lat: 40.0, school_lng: -75.0, walk_threshold_miles: 1.5 }
              as: TransportAdmin
              captures: { d_id: $.data.id }
            - call: "POST /routes"
              payload: { district_id: "${d_id}", name: "R1", seat_capacity: 10 }
              as: TransportAdmin
              captures: { r_id: $.data.id }
            - call: "POST /stops"
              payload: { route_id: "${r_id}", label: "S1", lat: 40.0, lng: -75.0, sequence: 1, scheduled_departure: "2026-09-01T07:00:00Z" }
              as: TransportAdmin
              captures: { stop_id: $.data.id }
            - call: "POST /students"
              payload: { district_id: "${d_id}", parent_id: "par-1", full_name: "Edge", grade: 4, home_lat: 40.02171, home_lng: -75.0, rfid_uid: "RF-E", hazard_zone: false }
              as: TransportAdmin
              captures: { stu_id: $.data.id }
            - call: "POST /ridership-applications"
              payload: { district_id: "${d_id}", student_id: "${stu_id}", requested_route_id: "${r_id}", requested_stop_id: "${stop_id}" }
              as: TransportAdmin
              captures: { app_id: $.data.id }
          trigger:
            - call: "POST /ridership-applications/${app_id}/start-review"
              payload: {}
              as: TransportAdmin
              captures: { basis: $.data.eligibility_basis }
          assert:
            - "Student.${stu_id}.home_distance_miles == 1.5"
            - "RidershipApplication.${app_id}.eligibility_basis == NONE (1.50 > 1.50 is false)"

      - name: missed_bus_window_inclusive_deadline
        grounds:
          - calculations.missed_bus_window
          - entities.District.fields.missed_bus_grace_minutes
          - validations[priority=19]
          - state_machines.BusTrip.BOARDING_to_IN_TRANSIT
        distinguishing_aspect: |
          A DIFFERENT metric (clock/time, not distance) reached through a DIFFERENT
          endpoint (POST /missed-bus-reports): the grace deadline is inclusive (<=).
          Stop seq2 scheduled 07:10Z, grace 10 -> deadline 07:20:00Z; filing AT exactly
          07:20:00Z is accepted (timely), proving '<=' not '<'.
        test_recipe:
          setup:
            - "District grace 10; Route OPEN; stops seq1@07:00 seq2@07:10; trip departed both stops (current_stop_sequence past 2) so seq2 is departed; student never tapped on. Clock set to 07:20:00Z exactly."
          setup_api_calls:
            - call: "POST /districts"
              payload: { name: "D1", school_lat: 40.0, school_lng: -75.0, missed_bus_grace_minutes: 10 }
              as: TransportAdmin
              captures: { d_id: $.data.id }
            - call: "POST /routes"
              payload: { district_id: "${d_id}", name: "R1", seat_capacity: 20 }
              as: TransportAdmin
              captures: { r_id: $.data.id, r_v0: $.data.version }
            - call: "POST /stops"
              payload: { route_id: "${r_id}", label: "S1", lat: 40.0, lng: -75.0, sequence: 1, scheduled_departure: "2026-09-01T07:00:00Z" }
              as: TransportAdmin
            - call: "POST /stops"
              payload: { route_id: "${r_id}", label: "S2", lat: 40.01, lng: -75.0, sequence: 2, scheduled_departure: "2026-09-01T07:10:00Z" }
              as: TransportAdmin
            - call: "POST /drivers"
              payload: { district_id: "${d_id}", full_name: "Drv A" }
              as: TransportAdmin
              captures: { drv_id: $.data.id }
            - call: "POST /routes/${r_id}/driver-assignments"
              payload: { driver_id: "${drv_id}", role: "PRIMARY", expected_route_version: "${r_v0}" }
              as: TransportAdmin
              captures: { asg_id: $.data.id }
            - call: "POST /students"
              payload: { district_id: "${d_id}", parent_id: "par-1", full_name: "Misser", grade: 4, home_lat: 40.05, home_lng: -75.0, rfid_uid: "RF-M" }
              as: TransportAdmin
              captures: { stu_id: $.data.id }
            - call: "POST /bus-trips"
              payload: { route_id: "${r_id}", driver_assignment_id: "${asg_id}" }
              as: TransportAdmin
              captures: { trip_id: $.data.id }
            - call: "POST /bus-trips/${trip_id}/start-boarding"
              payload: {}
              as: Driver
              as_user_id: "${drv_id}"
            - call: "POST /bus-trips/${trip_id}/depart-stop"
              payload: { stop_sequence: 1 }
              as: Driver
              as_user_id: "${drv_id}"
            - call: "POST /bus-trips/${trip_id}/depart-stop"
              payload: { stop_sequence: 2 }
              as: Driver
              as_user_id: "${drv_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T07:20:00Z" }
              as: TransportAdmin
          trigger:
            - call: "POST /missed-bus-reports"
              payload: { district_id: "${d_id}", student_id: "${stu_id}", bus_trip_id: "${trip_id}", reported_stop_sequence: 2 }
              as: Parent
