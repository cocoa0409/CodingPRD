            - call: "POST /api/allocations"
              payload: { order_id: "${o2_id}", cohort_id: "${coh_id}", qty_male: 5, qty_female: 5, expected_order_version: "${o2_v2}" }
              as: FacilityManager
            - call: "GET /api/orders/${o2_id}"
              as: FacilityManager
              captures: { o2_v3: $.data.version }
            - call: "POST /api/orders"
              payload: { strain_id: "${strain_id}", quantity_male: 5, quantity_female: 5, min_age_weeks: 4, max_age_weeks: 6, min_weight_g: 18.0, max_weight_g: 22.0, required_delivery_date: "2026-10-13T12:00:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { o3_id: $.data.id }
            - call: "POST /api/orders/${o3_id}/transition"
              payload: { target_state: "SOURCING" }
              as: FacilityManager
              captures: { o3_v2: $.data.version }
            - call: "POST /api/allocations"
              payload: { order_id: "${o3_id}", cohort_id: "${coh_id}", qty_male: 5, qty_female: 5, expected_order_version: "${o3_v2}" }
              as: FacilityManager
            - call: "GET /api/orders/${o3_id}"
