  # ===========================================================================
  # Section: validations (Table 4 claims)
  # ===========================================================================
  - section: validations
    instances:
      - name: missing_auth_headers_returns_unauthenticated
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request whose X-User-Role is absent/undeclared (Anonymous is not a declared role) is rejected 401 ERR_UNAUTHENTICATED before any other check."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /playtests/studies"
              as: Anonymous
              captures: { err: "$.data.error_id"}
          assert:
            - "err == ERR_UNAUTHENTICATED with HTTP 401"
      - name: participant_cannot_create_study_returns_forbidden
        claim_type: violation_to_error
        grounds: ["validations[priority=2]", "errors[ERR_FORBIDDEN]", "roles[Participant]"]
        distinguishing_aspect: "POST /playtests/studies lists ResearchOpsAdmin only; a Participant caller is rejected 403 ERR_FORBIDDEN regardless of payload validity."
        test_recipe:
          setup: ["participant P exists"]
          setup_api_calls:
            - call: "POST /playtests/participants"
              payload: { email: "rb0-p@x.com", full_name: "RB Zero", age_years: 25, region_code: "US-W", platform_tags: ["PC"] }
              as: ResearchOpsAdmin
              captures: { p_id: "$.data.id"}
          trigger:
            - call: "POST /playtests/studies"
              payload: { title: "Forbidden Study", code: "NOPE", min_age: 18, max_age: 35, allowed_regions: ["US-W"], required_platforms: ["PC"], cohort_capacity: 10, incentive_budget_cents: 1000 }
              as: Participant
              as_user_id: "${p_id}"
              captures: { err: "$.data.error_id"}
          assert:
            - "err == ERR_FORBIDDEN with HTTP 403"
      - name: forbidden_outranks_not_found
        claim_type: priority_ordering
        grounds: ["validations[priority=2]", "validations[priority=4]", "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "A single request violating both priority-2 (role) and priority-4 (target does not exist) returns the priority-2 error: Participant attempting to ban a non-existent participant gets 403 ERR_FORBIDDEN, not 404."
        test_recipe:
          setup: ["participant P exists"]
          setup_api_calls:
            - call: "POST /playtests/participants"
              payload: { email: "pr1-p@x.com", full_name: "PR One", age_years: 25, region_code: "US-W", platform_tags: ["PC"] }
              as: ResearchOpsAdmin
              captures: { p_id: "$.data.id"}
          trigger:
            - call: "POST /playtests/participants/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/ban"
              payload: {}
              as: Participant
              as_user_id: "${p_id}"
              captures: { err: "$.data.error_id"}
          assert:
            - "err == ERR_FORBIDDEN with HTTP 403  # authorization (priority 2) beats existence (priority 4)"
