# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
#
# Domain: digital-estate-fiduciary-access (task_2737)
# 9 rule_ids × >= 2 instances = 25 instances.
#
# Every numeric literal in an `assert:` was computed by executing the relevant
# §1.3 formula with its declared `constants:` in Python before being written
# here. The logical clock starts at 2026-08-01T00:00:00Z on a fresh server;
# every date-sensitive chain sets it explicitly.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: alternate_basis_decay_diverges_from_date_of_death_appraisal
        grounds:
          - calculations.asset_appraised_value
          - calculations.estate_valuation_rollup
          - entities.DigitalAsset.fields.appraised_value_cents
          - entities.DigitalAsset.fields.appraised_basis
          - entities.ValuationRun.fields.basis
          - validations[priority=57]
        distinguishing_aspect: |
          The DATE_OF_DEATH variant multiplies by nothing while the ALTERNATE variant multiplies
          the same quoted_value_cents by (10000 - DECAY_BP_PER_MONTH[CLOUD_STORAGE] * 6) / 10000
          before netting the transfer fee, so the identical single-asset inventory appraises at
          400033 cents on one basis and 388032 cents on the other — a 12001-cent divergence that
          a single-variant implementation cannot produce.
        test_recipe:
          setup:
            - "clock at 2026-08-01T00:00:00Z; one CLOUD_STORAGE platform CloudVault with transfer_fee_cents 0, request_fee_cents 0 and license_terminates_at_death false"
            - "one estate with date_of_death 2026-02-14, so alternate_valuation_date is 2026-08-14"
            - "one EXECUTOR fiduciary whose letters are ISSUED, backed by a VERIFIED death certificate and VERIFIED letters of authority"
            - "one CLOUD_STORAGE DigitalAsset with quoted_value_cents 400033, classified TRANSFERABLE and disclosed to CATALOG_DISCLOSED by an approved CATALOG_ACCESS request"
            - "one BeneficiaryDesignation holding the whole estate at share_bp 10000, so the share total is exactly 10000"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: EstateAdmin
            - call: "POST /platforms"
              payload: { name: "CloudVault", platform_type: "CLOUD_STORAGE", form_code: "CV-FORM-1", review_window_days: 14, refund_policy: "NONE", supports_online_tool: true, supports_transfer: true, supports_memorialization: true, supports_deletion: true, requires_court_order_for_content: false, license_terminates_at_death: false, transfer_fee_cents: 0, request_fee_cents: 0 }
              as: EstateAdmin
              captures: { p_cloud_id: $.data.id }
            - call: "POST /estates"
              payload: { decedent_name: "Rowan Ives", date_of_death: "2026-02-14", domicile_state: "CA", court_case_number: "PR-2737-A" }
              as: EstateAdmin
              captures: { est_id: $.data.id }
            - call: "POST /estates/${est_id}/fiduciaries"
              payload: { full_name: "Dana Ives", appointment_type: "EXECUTOR", court_reference: "APPT-2737-1" }
              as: CourtRegistrar
              captures: { fid1_id: $.data.id }
            - call: "POST /estates/${est_id}/documents"
              payload: { doc_type: "DEATH_CERTIFICATE", reference_number: "DC-1", issued_on: "2026-02-16", jurisdiction: "CA" }
              as: CourtRegistrar
              captures: { dc_id: $.data.id }
            - call: "POST /documents/${dc_id}/transitions"
              payload: { action: "VERIFY" }
              as: CourtRegistrar
            - call: "POST /estates/${est_id}/documents"
              payload: { doc_type: "LETTERS_OF_AUTHORITY", reference_number: "LOA-1", issued_on: "2026-03-01", jurisdiction: "CA", fiduciary_id: "${fid1_id}" }
              as: CourtRegistrar
              captures: { loa_id: $.data.id }
            - call: "POST /documents/${loa_id}/transitions"
              payload: { action: "VERIFY" }
              as: CourtRegistrar
            - call: "POST /estates/${est_id}/digital-assets"
              payload: { platform_id: "${p_cloud_id}", category: "CLOUD_STORAGE", account_handle: "vault-primary", quoted_value_cents: 400033 }
              as: Fiduciary
              as_user_id: "${fid1_id}"
              captures: { a_cloud_id: $.data.id }
            - call: "POST /estates/${est_id}/beneficiary-designations"
              payload: { beneficiary_name: "Ives Family Trust", share_bp: 10000, source: "WILL" }
              as: Fiduciary
              as_user_id: "${fid1_id}"
              captures: { ben_id: $.data.id }
            - call: "POST /estates/${est_id}/platform-requests"
              payload: { platform_id: "${p_cloud_id}", request_type: "CATALOG_ACCESS", requested_scope: "CATALOG_ONLY", death_certificate_document_id: "${dc_id}", letters_document_id: "${loa_id}", platform_form_code: "CV-FORM-1" }
              as: Fiduciary
              as_user_id: "${fid1_id}"
              captures: { req_id: $.data.id }
            - call: "POST /platform-requests/${req_id}/transitions"
              payload: { action: "SUBMIT" }
              as: Fiduciary
              as_user_id: "${fid1_id}"
            - call: "POST /platform-requests/${req_id}/transitions"
              payload: { action: "START_REVIEW" }
              as: PlatformCompliance
              as_user_id: "${p_cloud_id}"
            - call: "POST /platform-requests/${req_id}/transitions"
              payload: { action: "DECIDE", decision: "APPROVED" }
              as: PlatformCompliance
              as_user_id: "${p_cloud_id}"
            - call: "GET /estates/${est_id}"
              payload: {}
              as: Fiduciary
              as_user_id: "${fid1_id}"
              captures: { est_v1: $.data.version }
          trigger:
            - call: "POST /estates/${est_id}/valuation-runs"
              payload: { basis: "DATE_OF_DEATH", expected_estate_version: "${est_v1}" }
              as: Fiduciary
              as_user_id: "${fid1_id}"
              captures: { run_dod_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-20T00:00:00Z" }
              as: EstateAdmin
            - call: "GET /estates/${est_id}"
              payload: {}
              as: Fiduciary
              as_user_id: "${fid1_id}"
              captures: { est_v2: $.data.version }
            - call: "POST /estates/${est_id}/valuation-runs"
              payload: { basis: "ALTERNATE", expected_estate_version: "${est_v2}" }
              as: Fiduciary
              as_user_id: "${fid1_id}"
              captures: { run_alt_id: $.data.id }
          assert:
            - "ValuationRun.${run_dod_id}.basis == DATE_OF_DEATH"
            - "ValuationRun.${run_dod_id}.included_asset_count == 1"
            - "ValuationRun.${run_dod_id}.gross_value_cents == 400033"
            - "ValuationRun.${run_dod_id}.deduction_cap_cents == 25000"
            - "ValuationRun.${run_dod_id}.admin_deduction_cents == 0"
            - "ValuationRun.${run_dod_id}.taxable_value_cents == 400033"
            - "ValuationRun.${run_alt_id}.basis == ALTERNATE"
            - "ValuationRun.${run_alt_id}.gross_value_cents == 388032"
            - "ValuationRun.${run_alt_id}.taxable_value_cents == 388032"
            - "ValuationRun.${run_dod_id}.gross_value_cents - ValuationRun.${run_alt_id}.gross_value_cents == 12001"
            - "ValuationRun.${run_dod_id}.status == SUPERSEDED"
            - "ValuationRun.${run_alt_id}.status == COMPUTED"
            - "DigitalAsset.${a_cloud_id}.appraised_value_cents == 388032"
            - "DigitalAsset.${a_cloud_id}.appraised_basis == ALTERNATE"
            - "Estate.${est_id}.gross_digital_estate_cents == 388032"
            - "BeneficiaryDesignation.${ben_id}.planned_allocation_cents == 388032"

      - name: unused_period_refund_diverges_from_prorata_daily_on_identical_interval
        grounds:
          - calculations.refund_entitlement
          - entities.CancellationOrder.fields.refund_policy_snapshot
          - entities.RefundClaim.fields.method
          - entities.RefundClaim.fields.claimed_cents
          - entities.SubscriptionTerm.fields.term_days
        distinguishing_aspect: |
          PRORATA_DAILY prices all 291 claimed days while UNUSED_PERIOD collapses them to
          floor(291/30) * 30 = 270 billable days, so two subscription assets with byte-identical
          terms (period_fee_cents 11999, term_days 365) and the identical claimed interval
          2026-03-16..2026-12-31 yield 9566 and 8876 cents respectively — a 690-cent divergence
          driven only by the policy snapshotted on the CancellationOrder.
        test_recipe:
          setup:
            - "clock at 2026-08-01T00:00:00Z; two SUBSCRIPTION platforms — StreamOne with refund_policy PRORATA_DAILY and ReadDeck with refund_policy UNUSED_PERIOD, both review_window_days 7, transfer_fee_cents 0, request_fee_cents 0"
            - "one estate with date_of_death 2026-02-14 and an ISSUED-letters EXECUTOR fiduciary"
            - "one SUBSCRIPTION DigitalAsset on each platform, each with a SubscriptionTerm 2026-01-01..2026-12-31, billing_interval ANNUAL, period_fee_cents 11999, auto_renew true (term_days 365)"
            - "each asset disclosed by its own approved CATALOG_ACCESS request, which auto-created a PENDING CancellationOrder carrying that platform's refund_policy as refund_policy_snapshot"
            - "both cancellation orders REQUESTed with effective_date 2026-03-15 and CONFIRMed by their platform"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: EstateAdmin
            - call: "POST /platforms"
              payload: { name: "StreamOne", platform_type: "SUBSCRIPTION", form_code: "SO-FORM-9", review_window_days: 7, refund_policy: "PRORATA_DAILY", supports_online_tool: false, supports_transfer: false, supports_memorialization: false, supports_deletion: true, requires_court_order_for_content: false, license_terminates_at_death: true, transfer_fee_cents: 0, request_fee_cents: 0 }
              as: EstateAdmin
              captures: { p_stream_id: $.data.id }
            - call: "POST /platforms"
              payload: { name: "ReadDeck", platform_type: "SUBSCRIPTION", form_code: "RD-FORM-4", review_window_days: 7, refund_policy: "UNUSED_PERIOD", supports_online_tool: false, supports_transfer: false, supports_memorialization: false, supports_deletion: true, requires_court_order_for_content: false, license_terminates_at_death: true, transfer_fee_cents: 0, request_fee_cents: 0 }
              as: EstateAdmin
              captures: { p_read_id: $.data.id }
            - call: "POST /estates"
              payload: { decedent_name: "Rowan Ives", date_of_death: "2026-02-14", domicile_state: "CA", court_case_number: "PR-2737-B" }
              as: EstateAdmin
              captures: { est_id: $.data.id }
            - call: "POST /estates/${est_id}/fiduciaries"
              payload: { full_name: "Dana Ives", appointment_type: "EXECUTOR", court_reference: "APPT-2737-1" }
              as: CourtRegistrar
              captures: { fid1_id: $.data.id }
            - call: "POST /estates/${est_id}/documents"
              payload: { doc_type: "DEATH_CERTIFICATE", reference_number: "DC-1", issued_on: "2026-02-16", jurisdiction: "CA" }
              as: CourtRegistrar
              captures: { dc_id: $.data.id }
            - call: "POST /documents/${dc_id}/transitions"
              payload: { action: "VERIFY" }
              as: CourtRegistrar
            - call: "POST /estates/${est_id}/documents"
              payload: { doc_type: "LETTERS_OF_AUTHORITY", reference_number: "LOA-1", issued_on: "2026-03-01", jurisdiction: "CA", fiduciary_id: "${fid1_id}" }
              as: CourtRegistrar
              captures: { loa_id: $.data.id }
            - call: "POST /documents/${loa_id}/transitions"
              payload: { action: "VERIFY" }
              as: CourtRegistrar
            - call: "POST /estates/${est_id}/digital-assets"
              payload: { platform_id: "${p_stream_id}", category: "SUBSCRIPTION", account_handle: "streamone-annual", quoted_value_cents: 0 }
              as: Fiduciary
              as_user_id: "${fid1_id}"
              captures: { a_stream_id: $.data.id }
            - call: "POST /estates/${est_id}/digital-assets"
              payload: { platform_id: "${p_read_id}", category: "SUBSCRIPTION", account_handle: "readdeck-annual", quoted_value_cents: 0 }
              as: Fiduciary
              as_user_id: "${fid1_id}"
              captures: { a_read_id: $.data.id }
            - call: "POST /digital-assets/${a_stream_id}/subscription-terms"
              payload: { term_start_date: "2026-01-01", term_end_date: "2026-12-31", billing_interval: "ANNUAL", period_fee_cents: 11999, auto_renew: true }
              as: Fiduciary
              as_user_id: "${fid1_id}"
              captures: { t_stream_id: $.data.id }
            - call: "POST /digital-assets/${a_read_id}/subscription-terms"
              payload: { term_start_date: "2026-01-01", term_end_date: "2026-12-31", billing_interval: "ANNUAL", period_fee_cents: 11999, auto_renew: true }
              as: Fiduciary
              as_user_id: "${fid1_id}"
              captures: { t_read_id: $.data.id }
            - call: "POST /estates/${est_id}/platform-requests"
              payload: { platform_id: "${p_stream_id}", request_type: "CATALOG_ACCESS", requested_scope: "CATALOG_ONLY", death_certificate_document_id: "${dc_id}", letters_document_id: "${loa_id}", platform_form_code: "SO-FORM-9" }
              as: Fiduciary
              as_user_id: "${fid1_id}"
              captures: { req_stream_id: $.data.id }
            - call: "POST /platform-requests/${req_stream_id}/transitions"
              payload: { action: "SUBMIT" }
              as: Fiduciary
              as_user_id: "${fid1_id}"
            - call: "POST /platform-requests/${req_stream_id}/transitions"
              payload: { action: "START_REVIEW" }
              as: PlatformCompliance
              as_user_id: "${p_stream_id}"
            - call: "POST /platform-requests/${req_stream_id}/transitions"
              payload: { action: "DECIDE", decision: "APPROVED" }
              as: PlatformCompliance
              as_user_id: "${p_stream_id}"
            - call: "POST /estates/${est_id}/platform-requests"
              payload: { platform_id: "${p_read_id}", request_type: "CATALOG_ACCESS", requested_scope: "CATALOG_ONLY", death_certificate_document_id: "${dc_id}", letters_document_id: "${loa_id}", platform_form_code: "RD-FORM-4" }
              as: Fiduciary
              as_user_id: "${fid1_id}"
              captures: { req_read_id: $.data.id }
            - call: "POST /platform-requests/${req_read_id}/transitions"
              payload: { action: "SUBMIT" }
              as: Fiduciary
              as_user_id: "${fid1_id}"
            - call: "POST /platform-requests/${req_read_id}/transitions"
              payload: { action: "START_REVIEW" }
              as: PlatformCompliance
              as_user_id: "${p_read_id}"
            - call: "POST /platform-requests/${req_read_id}/transitions"
              payload: { action: "DECIDE", decision: "APPROVED" }
              as: PlatformCompliance
              as_user_id: "${p_read_id}"
            - call: "GET /cancellation-orders"
              payload: { asset_id: "${a_stream_id}" }
              as: Fiduciary
              as_user_id: "${fid1_id}"
              captures: { co_stream_id: "$.data[0].id" }
            - call: "GET /cancellation-orders"
              payload: { asset_id: "${a_read_id}" }
              as: Fiduciary
              as_user_id: "${fid1_id}"
              captures: { co_read_id: "$.data[0].id" }
            - call: "POST /cancellation-orders/${co_stream_id}/transitions"
              payload: { action: "REQUEST", effective_date: "2026-03-15" }
              as: Fiduciary
              as_user_id: "${fid1_id}"
            - call: "POST /cancellation-orders/${co_stream_id}/transitions"
              payload: { action: "CONFIRM", platform_reference: "SO-CANCEL-1", auto_renew_stopped: true }
              as: PlatformCompliance
              as_user_id: "${p_stream_id}"
            - call: "POST /cancellation-orders/${co_read_id}/transitions"
              payload: { action: "REQUEST", effective_date: "2026-03-15" }
              as: Fiduciary
              as_user_id: "${fid1_id}"
            - call: "POST /cancellation-orders/${co_read_id}/transitions"
              payload: { action: "CONFIRM", platform_reference: "RD-CANCEL-1", auto_renew_stopped: true }
              as: PlatformCompliance
              as_user_id: "${p_read_id}"
          trigger:
            - call: "POST /cancellation-orders/${co_stream_id}/refund-claims"
              payload: { claimed_period_start: "2026-03-16", claimed_period_end: "2026-12-31", pursuit_cost_cents: 0 }
              as: Fiduciary
              as_user_id: "${fid1_id}"
              captures: { claim_prorata_id: $.data.id }
            - call: "POST /cancellation-orders/${co_read_id}/refund-claims"
              payload: { claimed_period_start: "2026-03-16", claimed_period_end: "2026-12-31", pursuit_cost_cents: 0 }
              as: Fiduciary
              as_user_id: "${fid1_id}"
              captures: { claim_unused_id: $.data.id }
          assert:
            - "SubscriptionTerm.${t_stream_id}.term_days == 365"
            - "SubscriptionTerm.${t_read_id}.term_days == 365"
            - "CancellationOrder.${co_stream_id}.refund_policy_snapshot == PRORATA_DAILY"
            - "CancellationOrder.${co_read_id}.refund_policy_snapshot == UNUSED_PERIOD"
            - "RefundClaim.${claim_prorata_id}.method == PRORATA_DAILY"
            - "RefundClaim.${claim_prorata_id}.claimed_days == 291"
            - "RefundClaim.${claim_prorata_id}.claimed_cents == 9566"
            - "RefundClaim.${claim_unused_id}.method == UNUSED_PERIOD"
            - "RefundClaim.${claim_unused_id}.claimed_days == 291"
            - "RefundClaim.${claim_unused_id}.claimed_cents == 8876"
            - "RefundClaim.${claim_prorata_id}.claimed_cents - RefundClaim.${claim_unused_id}.claimed_cents == 690"
            - "RefundClaim.${claim_prorata_id}.status == FILED"
            - "RefundClaim.${claim_unused_id}.status == FILED"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: authority_precedence_combines_rank_specificity_category_and_court_order_clamp
        grounds:
          - calculations.platform_authority_precedence
          - entities.AuthorityDirective.fields.precedence_rank
          - entities.AuthorityDirective.fields.asset_category
          - entities.Platform.fields.requires_court_order_for_content
          - entities.Document.fields.doc_type
          - validations[priority=45]
        distinguishing_aspect: |
          The resolved scope is a function of five inputs drawn from three entities — directive
          precedence_rank (AuthorityDirective), platform_id specificity, asset_category match,
          Platform.requires_court_order_for_content, and the existence of a VERIFIED COURT_ORDER
          Document — and no single input predicts it: the same three directives resolve to
          CATALOG_ONLY/ONLINE_TOOL for CloudVault, CATALOG_ONLY/TRUST_PROVISION for SocialHub
          filtered by asset_category SOCIAL_PROFILE, CATALOG_AND_CONTENT/WILL_PROVISION for
          SocialHub unfiltered, and CATALOG_ONLY/WILL_PROVISION with clamp_reason
          COURT_ORDER_REQUIRED for BankTrust until a court order is verified.
        test_recipe:
          setup:
            - "clock at 2026-08-01T00:00:00Z; three platforms — CloudVault (supports_online_tool true, requires_court_order_for_content false), SocialHub (supports_online_tool false, requires_court_order_for_content false), BankTrust (supports_online_tool true, requires_court_order_for_content true)"
            - "one estate with a VERIFIED death certificate and an ISSUED-letters EXECUTOR fiduciary"
            - "three RECORDED directives: a catch-all WILL_PROVISION granting CATALOG_AND_CONTENT (rank 2, specificity 0); a category-scoped TRUST_PROVISION on SOCIAL_PROFILE granting CATALOG_ONLY (rank 2, specificity 1); a platform-scoped ONLINE_TOOL on CloudVault granting CATALOG_ONLY (rank 1, specificity 2)"
            - "no COURT_ORDER document exists yet"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: EstateAdmin
            - call: "POST /platforms"
              payload: { name: "CloudVault", platform_type: "CLOUD_STORAGE", form_code: "CV-FORM-1", review_window_days: 14, refund_policy: "NONE", supports_online_tool: true, supports_transfer: true, supports_memorialization: true, supports_deletion: true, requires_court_order_for_content: false, license_terminates_at_death: false, transfer_fee_cents: 0, request_fee_cents: 0 }
              as: EstateAdmin
              captures: { p_cloud_id: $.data.id }
            - call: "POST /platforms"
              payload: { name: "SocialHub", platform_type: "SOCIAL", form_code: "SH-FORM-6", review_window_days: 30, refund_policy: "NONE", supports_online_tool: false, supports_transfer: false, supports_memorialization: true, supports_deletion: true, requires_court_order_for_content: false, license_terminates_at_death: false, transfer_fee_cents: 0, request_fee_cents: 0 }
              as: EstateAdmin
              captures: { p_social_id: $.data.id }
            - call: "POST /platforms"
              payload: { name: "BankTrust", platform_type: "FINANCIAL", form_code: "BT-FORM-2", review_window_days: 21, refund_policy: "NONE", supports_online_tool: true, supports_transfer: true, supports_memorialization: false, supports_deletion: false, requires_court_order_for_content: true, license_terminates_at_death: false, transfer_fee_cents: 2500, request_fee_cents: 30000 }
              as: EstateAdmin
              captures: { p_bank_id: $.data.id }
            - call: "POST /estates"
              payload: { decedent_name: "Rowan Ives", date_of_death: "2026-02-14", domicile_state: "CA", court_case_number: "PR-2737-C" }
              as: EstateAdmin
              captures: { est_id: $.data.id }
            - call: "POST /estates/${est_id}/fiduciaries"
              payload: { full_name: "Dana Ives", appointment_type: "EXECUTOR", court_reference: "APPT-2737-1" }
              as: CourtRegistrar
              captures: { fid1_id: $.data.id }
            - call: "POST /estates/${est_id}/documents"
              payload: { doc_type: "DEATH_CERTIFICATE", reference_number: "DC-1", issued_on: "2026-02-16", jurisdiction: "CA" }
              as: CourtRegistrar
              captures: { dc_id: $.data.id }
            - call: "POST /documents/${dc_id}/transitions"
              payload: { action: "VERIFY" }
              as: CourtRegistrar
            - call: "POST /estates/${est_id}/documents"
              payload: { doc_type: "LETTERS_OF_AUTHORITY", reference_number: "LOA-1", issued_on: "2026-03-01", jurisdiction: "CA", fiduciary_id: "${fid1_id}" }
              as: CourtRegistrar
              captures: { loa_id: $.data.id }
            - call: "POST /documents/${loa_id}/transitions"
              payload: { action: "VERIFY" }
              as: CourtRegistrar
            - call: "POST /estates/${est_id}/authority-directives"
              payload: { directive_type: "WILL_PROVISION", scope: "CATALOG_AND_CONTENT", instrument_reference: "WILL-ART-7", executed_on: "2026-03-05" }
              as: CourtRegistrar
              captures: { d_will_id: $.data.id }
            - call: "POST /estates/${est_id}/authority-directives"
              payload: { directive_type: "TRUST_PROVISION", scope: "CATALOG_ONLY", asset_category: "SOCIAL_PROFILE", instrument_reference: "TRUST-SEC-4", executed_on: "2026-03-06" }
              as: CourtRegistrar
              captures: { d_trust_id: $.data.id }
            - call: "POST /estates/${est_id}/authority-directives"
              payload: { directive_type: "ONLINE_TOOL", scope: "CATALOG_ONLY", platform_id: "${p_cloud_id}", instrument_reference: "CV-LEGACY-CONTACT", executed_on: "2026-03-07" }
              as: CourtRegistrar
              captures: { d_tool_id: $.data.id }
          trigger:
            - call: "GET /estates/${est_id}/authority-resolution"
              payload: { platform_id: "${p_cloud_id}" }
              as: Fiduciary
              as_user_id: "${fid1_id}"
