# =============================================================================
# Task 1334: Location Scouting & Film Permit Coordination
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 rules x 2 instances = 18 instances
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  # Rule 1 — dual_variant_calc: two calculations, each with two valid variants
  # producing different results, on DIFFERENT entity domains.
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: permit_fee_business_vs_calendar_day_model_weekend_window
        grounds:
          - calculations.permit_fee
          - calculations.business_days_between
          - entities.PermitApplication.fields.fee_cents
        distinguishing_aspect: |
          Entity domain = PermitApplication fee. For the SAME shoot window
          2026-08-08 (Sat) .. 2026-08-11 (Tue), the calendar-day variant counts
          4 days (fee 460000) while the authoritative business-day variant
          counts 2 days (Aug 10, 11; fee 280000) — identical inputs, different
          results; the SUBMIT transition must persist the business-day value.
        test_recipe:
          setup:
            - "Jurisdiction J1: base 100000, per_day 50000, per_lane 20000, large_cast_threshold 50, multiplier 12500, lead_time_business_days 2, no holidays"
            - "Owner, Location (jurisdiction J1), Production cast_size 40 (no multiplier)"
            - "Agreement EXECUTED covering 2026-08-08..2026-08-11"
            - "Clock at 2026-08-05 (Wed) so submit yields business_days_available = Aug 6,7 = 2 >= 2 (lead time satisfied)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:00:00Z" }
              as: FilmOffice
            - call: "POST /jurisdictions"
              payload: { code: "LA-CITY", name: "Los Angeles City", lead_time_business_days: 2, notification_lead_calendar_days: 3, notification_radius_ft: 500, base_fee_cents: 100000, per_day_fee_cents: 50000, per_lane_fee_cents: 20000, large_cast_threshold: 50, large_cast_multiplier_bps: 12500, min_liability_limit_cents: 100000000, police_monitor_lane_threshold: 2, holidays: [] }
              as: FilmOffice
              captures: { jur_id: $.data.id }
            - call: "POST /owners"
              payload: { legal_name: "Owner One", contact_email: "owner1@x.com", default_day_rate_cents: 150000 }
              as: LocationManager
              captures: { owner_id: $.data.id }
            - call: "POST /locations"
              payload: { name: "Loc A", address: "100 Main St", jurisdiction_id: "${jur_id}", owner_id: "${owner_id}", deposit_floor_cents: 200000, buffer_days: 2, max_shoot_hours_per_day: 14 }
              as: LocationManager
              captures: { loc_id: $.data.id }
            - call: "POST /productions"
              payload: { title: "Prod A", production_company: "Co A", cast_size: 40, umbrella_liability_limit_cents: 100000000 }
              as: LocationManager
              captures: { prod_id: $.data.id, prod_v: $.data.version }
            - call: "POST /productions/${prod_id}/scout-packages"
              payload: { location_id: "${loc_id}", photo_count: 6, coverage_score_pct: 80, scout_date: "2026-08-04" }
              as: LocationManager
              captures: { sp_id: $.data.id }
            - call: "POST /productions/${prod_id}/scout-packages/${sp_id}/submit"
              payload: {}
              as: LocationManager
            - call: "POST /productions/${prod_id}/scout-packages/${sp_id}/review"
              payload: { decision: "ACCEPT" }
              as: FilmOffice
            - call: "POST /productions/${prod_id}/owner-agreements"
              payload: { location_id: "${loc_id}", shoot_start_date: "2026-08-08", shoot_end_date: "2026-08-11" }
              as: LocationManager
              captures: { agr_id: $.data.id }
            - call: "POST /productions/${prod_id}/owner-agreements/${agr_id}/propose"
              payload: { proposed_day_rate_cents: 150000 }
              as: LocationManager
            - call: "POST /productions/${prod_id}/owner-agreements/${agr_id}/accept"
              payload: {}
              as: OwnerRep
              as_user_id: "${owner_id}"
          trigger:
            - call: "POST /productions/${prod_id}/permit-applications"
              payload: { location_id: "${loc_id}", shoot_start_date: "2026-08-08", shoot_end_date: "2026-08-11", closed_lanes: 2, shoot_hours_per_day: 12, expected_production_version: "${prod_v}" }
              as: LocationManager
              captures: { pa_id: $.data.id }
            - call: "POST /productions/${prod_id}/permit-applications/${pa_id}/submit"
              payload: {}
              as: LocationManager
          assert:
            - "PermitApplication.${pa_id}.fee_cents == 280000 (business-day model: days=2 -> 100000 + 2*50000 + 2*2*20000)"
            - "PermitApplication.${pa_id}.fee_cents != 460000 (calendar-day model would be days=4 -> 100000 + 4*50000 + 4*2*20000)"
            - "PermitApplication.${pa_id}.lead_time_satisfied == true"

      - name: shoot_day_compliance_strict_vs_lenient_resolved_high_complaint
        grounds:
          - calculations.shoot_day_compliance
          - state_machines.ShootDay.IN_PROGRESS_to_COMPLETED
          - entities.ShootDay.fields.compliance_status
        distinguishing_aspect: |
          Entity domain = ShootDay compliance (distinct from Rule-1 instance 1's
          PermitApplication fee domain). A HIGH complaint that is later RESOLVED
          still yields persisted strict compliance_status == VIOLATION (2 points,
          all complaints count) while the lenient_display projection over the
          same rows yields COMPLIANT (resolved excluded) — the persisted field
          must follow the strict variant.
        test_recipe:
          setup:
            - "Full READY chain on J1 with cast_size 40, permit 2026-08-10..2026-08-12, lanes 0, hours 8 -> monitors_required 1; one FILM_OFFICER confirmed"
            - "Clock advanced to 2026-08-10 and ops sweep run so the day is IN_PROGRESS"
            - "A HIGH complaint filed against the day and then acknowledged and resolved"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: FilmOffice
            - call: "POST /jurisdictions"
              payload: { code: "LA-CITY", name: "Los Angeles City", lead_time_business_days: 5, notification_lead_calendar_days: 3, notification_radius_ft: 500, base_fee_cents: 100000, per_day_fee_cents: 50000, per_lane_fee_cents: 20000, large_cast_threshold: 50, large_cast_multiplier_bps: 12500, min_liability_limit_cents: 100000000, police_monitor_lane_threshold: 2, holidays: [] }
              as: FilmOffice
              captures: { jur_id: $.data.id }
            - call: "POST /owners"
              payload: { legal_name: "Owner One", contact_email: "owner1@x.com", default_day_rate_cents: 150000 }
              as: LocationManager
              captures: { owner_id: $.data.id }
            - call: "POST /locations"
              payload: { name: "Loc A", address: "100 Main St", jurisdiction_id: "${jur_id}", owner_id: "${owner_id}", deposit_floor_cents: 200000, buffer_days: 2, max_shoot_hours_per_day: 14 }
              as: LocationManager
              captures: { loc_id: $.data.id }
            - call: "POST /productions"
              payload: { title: "Prod A", production_company: "Co A", cast_size: 40, umbrella_liability_limit_cents: 100000000 }
              as: LocationManager
              captures: { prod_id: $.data.id, prod_v: $.data.version }
            - call: "POST /productions/${prod_id}/scout-packages"
              payload: { location_id: "${loc_id}", photo_count: 6, coverage_score_pct: 80, scout_date: "2026-08-01" }
              as: LocationManager
              captures: { sp_id: $.data.id }
            - call: "POST /productions/${prod_id}/scout-packages/${sp_id}/submit"
              payload: {}
              as: LocationManager
            - call: "POST /productions/${prod_id}/scout-packages/${sp_id}/review"
              payload: { decision: "ACCEPT" }
              as: FilmOffice
            - call: "POST /productions/${prod_id}/owner-agreements"
              payload: { location_id: "${loc_id}", shoot_start_date: "2026-08-10", shoot_end_date: "2026-08-12" }
              as: LocationManager
              captures: { agr_id: $.data.id }
            - call: "POST /productions/${prod_id}/owner-agreements/${agr_id}/propose"
              payload: { proposed_day_rate_cents: 150000 }
              as: LocationManager
            - call: "POST /productions/${prod_id}/owner-agreements/${agr_id}/accept"
              payload: {}
              as: OwnerRep
              as_user_id: "${owner_id}"
            - call: "POST /productions/${prod_id}/permit-applications"
              payload: { location_id: "${loc_id}", shoot_start_date: "2026-08-10", shoot_end_date: "2026-08-12", closed_lanes: 0, shoot_hours_per_day: 8, expected_production_version: "${prod_v}" }
              as: LocationManager
              captures: { pa_id: $.data.id }
            - call: "POST /productions/${prod_id}/permit-applications/${pa_id}/submit"
              payload: {}
              as: LocationManager
            - call: "POST /productions/${prod_id}/permit-applications/${pa_id}/start-review"
              payload: {}
              as: FilmOffice
            - call: "POST /productions/${prod_id}/insurance-certificates"
              payload: { jurisdiction_id: "${jur_id}", insurer_name: "InsureCo", umbrella_limit_cents: 100000000, indemnity_clause_ref: "IND-1", effective_date: "2026-08-01", expiry_date: "2026-08-31" }
              as: LocationManager
              captures: { ic_id: $.data.id }
            - call: "POST /productions/${prod_id}/insurance-certificates/${ic_id}/verify"
              payload: {}
              as: FilmOffice
            - call: "POST /productions/${prod_id}/permit-applications/${pa_id}/decide"
              payload: { decision: "ISSUE" }
              as: FilmOffice
            - call: "POST /productions/${prod_id}/notifications"
              payload: { permit_application_id: "${pa_id}", households_reached: 40, radius_ft_used: 500 }
              as: LocationManager
              captures: { notif_id: $.data.id }
            - call: "POST /productions/${prod_id}/notifications/${notif_id}/acknowledge"
              payload: {}
              as: FilmOffice
            - call: "POST /productions/${prod_id}/deposit-accounts"
              payload: { location_id: "${loc_id}" }
              as: LocationManager
              captures: { dep_id: $.data.id }
            - call: "POST /productions/${prod_id}/deposit-accounts/${dep_id}/deposit"
              payload: { amount_cents: 225000 }
              as: LocationManager
            - call: "POST /productions/${prod_id}/walkthrough-reports"
              payload: { location_id: "${loc_id}", kind: "PRE", signed_by_owner: true, signed_by_manager: true }
              as: LocationManager
              captures: { pre_id: $.data.id }
            - call: "POST /productions/${prod_id}/walkthrough-reports/${pre_id}/sign"
              payload: {}
              as: LocationManager
            - call: "POST /productions/${prod_id}/shoot-days"
              payload: { permit_application_id: "${pa_id}", location_id: "${loc_id}", shoot_date: "2026-08-10", planned_hours: 8 }
              as: LocationManager
              captures: { sd_id: $.data.id }
            - call: "POST /productions/${prod_id}/monitor-assignments"
              payload: { shoot_day_id: "${sd_id}", monitor_type: "FILM_OFFICER", officer_badge: "FO-1", hours_booked: 8 }
              as: LocationManager
              captures: { ma_id: $.data.id }
            - call: "POST /productions/${prod_id}/monitor-assignments/${ma_id}/confirm"
              payload: {}
              as: FilmOffice
            - call: "GET /productions/${prod_id}/shoot-days/${sd_id}"
              as: LocationManager
              captures: { sd_ver: $.data.version }
            - call: "POST /productions/${prod_id}/shoot-days/${sd_id}/mark-ready"
              payload: { expected_shoot_day_version: "${sd_ver}" }
              as: LocationManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T08:00:00Z" }
              as: FilmOffice
            - call: "POST /_ops/sweep"
              payload: {}
              as: FilmOffice
            - call: "POST /productions/${prod_id}/complaints"
              payload: { shoot_day_id: "${sd_id}", category: "NOISE", severity: "HIGH" }
              as: OwnerRep
              as_user_id: "${owner_id}"
              captures: { cmp_id: $.data.id }
            - call: "POST /productions/${prod_id}/complaints/${cmp_id}/acknowledge"
              payload: {}
              as: LocationManager
            - call: "POST /productions/${prod_id}/complaints/${cmp_id}/resolve"
              payload: { resolution_note: "Quieter generators deployed" }
              as: LocationManager
          trigger:
