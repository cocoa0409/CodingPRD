            - "Coaching assignment ca1 for d1 on v1, session 2026-08-05T14:00:00Z to 16:00:00Z, due_at 2026-08-19T16:00:00Z, status ASSIGNED."
            - "Challenge ch (VIOLATION_NOT_SUPPORTED on v1) submitted at 2026-08-01, assigned, then INFO_REQUESTED with info_response_deadline 2026-08-31T00:00:00Z; v1 has under_challenge true and the certified measure is 0.000."
