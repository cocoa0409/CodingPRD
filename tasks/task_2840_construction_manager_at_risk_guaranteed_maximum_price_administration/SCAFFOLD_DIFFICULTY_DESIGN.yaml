      - name: scope_change_classification_three_level_cascade_stales_reconciled_estimates
        grounds:
          - state_machines.ChangeEvent.UNDER_REVIEW_to_CLASSIFIED_scope_change
          - state_machines.ProgressiveEstimate.RECONCILED_reconciliation_stale
          - calculations.proposed_gmp_rollup
          - entities.CmarProject.fields.pending_amendment_count
          - entities.CmarProject.fields.proposed_gmp_amount
          - entities.ProgressiveEstimate.fields.reconciliation_stale
        distinguishing_aspect: |
          Classifying one change event as SCOPE_CHANGE propagates three levels - a new AMENDMENT
          GmpProposal is minted, the project's pending_amendment_count and proposed_gmp_amount
          move, and then EVERY already-RECONCILED ProgressiveEstimate is flagged
          reconciliation_stale - and the propagation is state-filtered: the SUBMITTED estimate
          on the same project stays reconciliation_stale false, so the cascade cannot be
          implemented as an unconditional update over the project's estimates.
        test_recipe:
          setup:
            - "one CmarProject 'Harborview Civic Center' with gmp_status EXECUTED at gmp_amount 1245897.60 and pending_amendment_count 0"
            - "two RECONCILED ProgressiveEstimate rows (SD at 950000.00, CD_100 at 1000000.00) both with reconciliation_stale false"
            - "one SUBMITTED ProgressiveEstimate row (GMP_BASIS at 1000000.00) with reconciliation_stale false"
