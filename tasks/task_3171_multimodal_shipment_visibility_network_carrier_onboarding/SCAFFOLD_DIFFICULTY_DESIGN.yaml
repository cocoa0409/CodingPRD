  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: quality_gate_exactly_seventy_activates_sixty_nine_fails
        grounds:
          - calculations.data_quality_score_epoch
          - state_machines.CarrierConnection.TESTING_to_ACTIVE
          - errors.ERR_QUALITY_GATE_NOT_MET
        distinguishing_aspect: |
          Boundary on the quality-score metric via the activate endpoint with
          >= semantics: a TMS connection scoring exactly 70 (completeness 80)
          activates, while an identical connection scoring 69 (completeness
          77 -> round_half_up(68.95)) is rejected — one unit below the gate.
        test_recipe:
          setup:
            - "Two TMS connections (different carriers to avoid testing-window conflicts), both TESTING with window [2026-09-01, 2026-09-10]."
            - "Each posts two on-time heartbeats in a 6000-minute window (expected_count 25, cadence_raw 8): connection A completeness 80 -> score 70; connection B completeness 77 -> score 69."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /carriers"
              payload: { carrier_name: "GateA", scac_code: "GATA" }
              as: NetworkOps
              captures: { gb_car_a: $.data.id }
            - call: "POST /carriers/${gb_car_a}/connections"
              payload: { channel: "TMS", supported_modes: ["TRUCKLOAD"] }
              as: NetworkOps
              captures: { gb_conn_a: $.data.id }
            - call: "POST /connections/${gb_conn_a}/submit-credentials"
              payload: { credential_ref: "vault://gata" }
              as: CarrierRep
              as_user_id: "${gb_car_a}"
            - call: "POST /connections/${gb_conn_a}/begin-testing"
              payload: { testing_window_start: "2026-09-01T00:00:00Z", testing_window_end: "2026-09-10T00:00:00Z" }
              as: NetworkOps
            - call: "POST /carriers"
              payload: { carrier_name: "GateB", scac_code: "GATB" }
              as: NetworkOps
              captures: { gb_car_b: $.data.id }
