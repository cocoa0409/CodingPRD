            - { call: "POST /api/transactions", payload: { card_id: "${card_id}", tender_type: "CAMPUS_CASH", amount_cents: 999, idempotency_key: "cyc-1", merchant_id: "${m_id}" }, as: MerchantUser, as_user_id: "${m_id}" }
            - call: "POST /api/merchants/${m_id}/settlements"
