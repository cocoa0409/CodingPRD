          assert:
            - "Exactly at the cap is allowed: 420 existing + 60 new == 480 == ASSOCIATE_DAILY_MINUTES_CAP, so ${task_at_cap} is created with HTTP 201"
            - "No pairwise rule fires on that call: 07:01 <= 07:00 is false, so priority 61 (ERR_ASSOCIATE_SCHEDULE_CONFLICT) is not in play and the only relevant rule is the aggregate"
            - "One minute over the cap is refused: 420 + 60 + 1 == 481 > 480, so the call returns HTTP 422 with ${err_cap} == ERR_ASSOCIATE_DAILY_CAP_EXCEEDED"
            - "The refused window is individually blameless — [08:02, 08:03] on 2026-08-03 overlaps nothing and is only 1 minute long — proving the constraint is collective, not pairwise"
            - "No LabelTask row was created by the refused call: GET /price-integrity/label-tasks?assigned_associate_id=${la1} returns total_count 2 at that point"
            - "The accumulator resets on the UTC calendar day: the byte-identical window moved to 2026-08-04 succeeds as ${task_next_day} with HTTP 201, since la1's 2026-08-04 total is 0 + 1 == 1"
