  # ===========================================================================
  - section: validations
    instances:
      - name: missing_x_user_id_header_returns_400
        claim_type: violation_to_error
        grounds:
          - validations[priority=1]
          - errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]
        distinguishing_aspect: "A request without X-User-ID/X-User-Role headers is rejected 400 before any role or existence check."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /dog-park/areas"
              payload: {}
              as: ParkAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (the test omits the X-User-ID header)"

      - name: anonymous_cannot_list_visits
        claim_type: violation_to_error
        grounds:
          - validations[priority=2]
          - errors[ERR_INSUFFICIENT_PERMISSIONS]
        distinguishing_aspect: "Anonymous is a declared role valid only for POST /members; any other endpoint returns 403."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /dog-park/visits"
              payload: {}
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INSUFFICIENT_PERMISSIONS"

      - name: member_cannot_read_other_member
        claim_type: violation_to_error
        grounds:
          - validations[priority=4]
          - errors[ERR_NOT_OWNER]
        distinguishing_aspect: "Member role reading another member's profile is rejected ERR_NOT_OWNER even though both members exist."
        test_recipe:
          setup: ["two registered members"]
          setup_api_calls:
            - call: "POST /dog-park/members"
              payload: { full_name: "M One", email: "m1@x.com" }
              as: Anonymous
              captures: { m1_id: $.data.id }
            - call: "POST /dog-park/members"
              payload: { full_name: "M Two", email: "m2@x.com" }
              as: Anonymous
              captures: { m2_id: $.data.id }
          trigger:
            - call: "GET /dog-park/members/${m2_id}"
              payload: {}
              as: Member
              as_user_id: "${m1_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_OWNER (path memberId != X-User-ID for Member role)"

      - name: steward_flag_required_for_triage
        claim_type: violation_to_error
        grounds:
          - validations[priority=3]
          - errors[ERR_NOT_A_STEWARD]
        distinguishing_aspect: "A member without is_steward calling with X-User-Role: Steward is rejected before the transition is evaluated."
        test_recipe:
          setup: ["clock 2026-08-01; subject member; plain member (no steward flag); report FILED by ParkAdmin"]
          setup_api_calls:
            - call: "POST /dog-park/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ParkAdmin
            - call: "POST /dog-park/members"
              payload: { full_name: "Sub Ject", email: "subject@x.com" }
              as: Anonymous
              captures: { sub_id: $.data.id }
            - call: "POST /dog-park/members"
              payload: { full_name: "Plain Member", email: "plain@x.com" }
              as: Anonymous
              captures: { pm_id: $.data.id }
            - call: "POST /dog-park/incident-reports"
              payload: { subject_member_id: "${sub_id}", severity: "MINOR", occurred_at: "2026-08-01T10:00:00Z", description: "rough play" }
              as: ParkAdmin
              captures: { r_id: $.data.id }
          trigger:
            - call: "POST /dog-park/incident-reports/${r_id}/advance"
              payload: { to: "UNDER_REVIEW" }
              as: Steward
              as_user_id: "${pm_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_A_STEWARD (Member.${pm_id}.is_steward == false)"

      - name: service_requires_steward_flag
        claim_type: violation_to_error
        grounds:
          - validations[priority=3]
          - errors[ERR_NOT_A_STEWARD]
        distinguishing_aspect: "Waste-station servicing with X-User-Role: Steward by a non-steward member is rejected; the station is unchanged."
        test_recipe:
          setup: ["area with one waste station; plain member without steward flag"]
          setup_api_calls:
            - call: "POST /dog-park/areas"
              payload: { name: "Main", size_class_restriction: "LARGE", capacity: 4, peak_capacity: 4 }
              as: ParkAdmin
              captures: { a_id: $.data.id }
            - call: "POST /dog-park/areas/${a_id}/waste-stations"
              payload: { name: "North Bin" }
              as: ParkAdmin
              captures: { ws_id: $.data.id }
            - call: "POST /dog-park/members"
              payload: { full_name: "Plain Member", email: "plain@x.com" }
              as: Anonymous
              captures: { pm_id: $.data.id }
          trigger:
            - call: "POST /dog-park/waste-stations/${ws_id}/service"
              payload: {}
              as: Steward
              as_user_id: "${pm_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_A_STEWARD"
            - "WasteStation.${ws_id}.fill_pct remains 0 and last_serviced_at remains null"

      - name: checkin_both_dog_and_pass_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=5]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "Supplying both dog_id and guest_pass_id violates the exactly-one-of request shape."
        test_recipe:
          setup: ["clock 2026-08-03; SMALL area; active member with VERIFIED SMALL dog and one ISSUED SMALL pass valid_on 2026-08-03"]
          setup_api_calls:
            - call: "POST /dog-park/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T10:00:00Z" }
              as: ParkAdmin
            - call: "POST /dog-park/areas"
              payload: { name: "Small Side", size_class_restriction: "SMALL", capacity: 4, peak_capacity: 4 }
              as: ParkAdmin
              captures: { a_id: $.data.id }
            - call: "POST /dog-park/members"
              payload: { full_name: "Own Er", email: "owner@x.com" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /dog-park/members/${m_id}/dogs"
              payload: { name: "Pip", size_class: "SMALL", license_number: "LIC-1", vaccination_expires_on: "2027-06-01" }
              as: Member
              as_user_id: "${m_id}"
              captures: { d_id: $.data.id }
            - call: "POST /dog-park/dogs/${d_id}/verify"
              payload: { decision: "VERIFIED" }
              as: ParkAdmin
            - call: "POST /dog-park/members/${m_id}/memberships"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /dog-park/guest-passes"
              payload: { guest_dog_size_class: "SMALL", valid_on: "2026-08-03" }
              as: Member
              as_user_id: "${m_id}"
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /dog-park/visits/check-in"
              payload: { area_id: "${a_id}", dog_id: "${d_id}", guest_pass_id: "${p_id}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST (exactly one of dog_id / guest_pass_id)"

      - name: self_incident_report_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=10]
          - errors[ERR_SELF_REPORT_NOT_ALLOWED]
        distinguishing_aspect: "A member filing a report with subject_member_id equal to their own id is rejected."
        test_recipe:
          setup: ["clock 2026-08-01; active member"]
          setup_api_calls:
            - call: "POST /dog-park/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ParkAdmin
            - call: "POST /dog-park/members"
              payload: { full_name: "Own Er", email: "owner@x.com" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /dog-park/members/${m_id}/dogs"
              payload: { name: "Rex", size_class: "LARGE", license_number: "LIC-1", vaccination_expires_on: "2027-06-01" }
              as: Member
              as_user_id: "${m_id}"
              captures: { d_id: $.data.id }
            - call: "POST /dog-park/dogs/${d_id}/verify"
              payload: { decision: "VERIFIED" }
              as: ParkAdmin
            - call: "POST /dog-park/members/${m_id}/memberships"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
          trigger:
            - call: "POST /dog-park/incident-reports"
              payload: { subject_member_id: "${m_id}", severity: "MINOR", occurred_at: "2026-08-01T10:00:00Z", description: "my own dog" }
              as: Member
              as_user_id: "${m_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_SELF_REPORT_NOT_ALLOWED"

      - name: verify_dog_expired_vaccination_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=9]
          - errors[ERR_VACCINATION_EXPIRED]
        distinguishing_aspect: "Verification of a dog whose vaccination already expired (2026-07-01 vs clock 2026-08-01) is rejected at the safety layer."
        test_recipe:
          setup: ["clock 2026-08-01; member; dog with vaccination_expires_on 2026-07-01 (SUBMITTED)"]
          setup_api_calls:
            - call: "POST /dog-park/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ParkAdmin
            - call: "POST /dog-park/members"
              payload: { full_name: "Own Er", email: "owner@x.com" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /dog-park/members/${m_id}/dogs"
              payload: { name: "Rex", size_class: "LARGE", license_number: "LIC-1", vaccination_expires_on: "2026-07-01" }
              as: Member
              as_user_id: "${m_id}"
              captures: { d_id: $.data.id }
          trigger:
            - call: "POST /dog-park/dogs/${d_id}/verify"
              payload: { decision: "VERIFIED" }
              as: ParkAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_VACCINATION_EXPIRED"
            - "Dog.${d_id}.verification_status remains SUBMITTED"

      - name: redeem_pass_wrong_date_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=11]
          - errors[ERR_GUEST_PASS_NOT_REDEEMABLE]
        distinguishing_aspect: "A pass valid_on 2026-08-05 cannot be redeemed on 2026-08-04; date gate is temporal, distinct from the state gate."
        test_recipe:
          setup: ["clock 2026-08-04; SMALL area; active member; ISSUED pass valid_on 2026-08-05"]
          setup_api_calls:
            - call: "POST /dog-park/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-04T10:00:00Z" }
              as: ParkAdmin
            - call: "POST /dog-park/areas"
              payload: { name: "Small Side", size_class_restriction: "SMALL", capacity: 4, peak_capacity: 4 }
              as: ParkAdmin
              captures: { a_id: $.data.id }
            - call: "POST /dog-park/members"
              payload: { full_name: "Spon Sor", email: "sponsor@x.com" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /dog-park/members/${m_id}/dogs"
              payload: { name: "Rex", size_class: "LARGE", license_number: "LIC-1", vaccination_expires_on: "2027-06-01" }
              as: Member
              as_user_id: "${m_id}"
              captures: { d_id: $.data.id }
            - call: "POST /dog-park/dogs/${d_id}/verify"
              payload: { decision: "VERIFIED" }
              as: ParkAdmin
            - call: "POST /dog-park/members/${m_id}/memberships"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /dog-park/guest-passes"
              payload: { guest_dog_size_class: "SMALL", valid_on: "2026-08-05" }
              as: Member
              as_user_id: "${m_id}"
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /dog-park/visits/check-in"
              payload: { area_id: "${a_id}", guest_pass_id: "${p_id}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_GUEST_PASS_NOT_REDEEMABLE (valid_on 2026-08-05 != current date 2026-08-04)"
            - "GuestPass.${p_id}.status remains ISSUED"

      - name: checkin_rejected_when_area_closure_active
        claim_type: violation_to_error
        grounds:
          - validations[priority=11]
          - errors[ERR_AREA_CLOSED]
          - state_machines.AreaClosure.SCHEDULED_to_ACTIVE
        distinguishing_aspect: "An ACTIVE closure on the area blocks check-in with ERR_AREA_CLOSED even when capacity is free."
        test_recipe:
          setup: ["clock 2026-08-01; SMALL area with closure [2026-08-01, 2026-08-05) activated by the run; active member with VERIFIED SMALL dog"]
