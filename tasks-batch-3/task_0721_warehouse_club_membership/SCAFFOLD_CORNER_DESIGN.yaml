              payload: { plan_id: "${plan_id}", primary_member_name: "Elig Mem" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /payments"
              payload: { membership_id: "${m_id}", purpose: "SIGNUP", outcome: "SUCCEEDED" }
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /transactions"
              payload: { membership_id: "${m_id}" }
              as: RegisterClerk
              captures: { txn_id: $.data.id }
            - call: "POST /transactions/${txn_id}/lines"
              payload: { product_id: "${prod_a}", qty: 5 }
              as: RegisterClerk
            - call: "POST /transactions/${txn_id}/lines"
              payload: { product_id: "${prod_b}", qty: 5 }
              as: RegisterClerk
          trigger:
            - call: "POST /transactions/${txn_id}/finalize"
              payload: {}
              as: RegisterClerk
          assert:
            - "Transaction.${txn_id}.reward_accrued_cents == 800"

      - name: cancel_refund_full_term_same_day
        claim_type: Correct Result
        grounds:
          - 'calculations.cancel_refund'
          - 'entities.FeeEvent.fields.amount_cents'
        distinguishing_aspect: "Cancel variant full_term_unused: cancelling on activation day (elapsed_days==0, remaining 365) refunds the full annual_fee 6000 → CANCEL_REFUND amount_cents == -6000."
        test_recipe:
