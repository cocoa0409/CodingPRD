              as: ReimbursementAnalyst
              captures: { wis_id: $.data.id }
            - call: "POST /wage-index-submissions/${wis_id}/occ-mix-responses"
              payload: { category: "RN", reported_hours: 1200000.00, reported_salaries_cents: 4200000000 }
