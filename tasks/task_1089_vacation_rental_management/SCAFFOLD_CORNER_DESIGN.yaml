  # =====================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: pricing_rule_create_correct_version_succeeds
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[pricing-rule-create-stale-property]", endpoints]
        distinguishing_aspect: "Creating a PricingRule with expected_property_version equal to the property's current version succeeds (201) and increments Property.version."
        test_recipe:
          setup: ["A property at version 1 (freshly created, never mutated)."]
          setup_api_calls:
            - { call: "POST /owners", payload: { legal_name: "Oz", email: "oz@x.com", default_management_fee_pct: 20 }, as: PlatformAdmin, captures: { oz: "$.data.id" } }
            - { call: "POST /properties", payload: { owner_id: "${oz}", address: "Z", city: "Austin", state_code: "TX", jurisdiction_code: "TX-ATX", base_nightly_rate_cents: 20000, cleaning_fee_cents: 15000, max_occupancy: 6 }, as: PropertyManager, captures: { pz: "$.data.id", vz: "$.data.version" } }
          trigger:
            - { call: "POST /properties/${pz}/pricing-rules", payload: { rule_type: "SEASONAL", multiplier_bps: 12000, start_date: "2026-07-01T00:00:00Z", end_date: "2026-07-31T00:00:00Z", priority: 1, expected_property_version: "${vz}" }, as: PropertyManager, captures: { prid: "$.data.id", active: "$.data.active" } }
          assert:
            - "PricingRule.${prid}.active == true"
            - "Property.${pz}.version == 2"

      - name: pricing_rule_create_stale_version_returns_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[pricing-rule-create-stale-property]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "After one pricing-rule create bumps Property.version to 2, a second create still carrying the original expected_property_version (1) is rejected ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["A property at version 1; one pricing rule created with expected_property_version = the captured original version (bumps to 2)."]
          setup_api_calls:
            - { call: "POST /owners", payload: { legal_name: "Oaa", email: "oaa@x.com", default_management_fee_pct: 20 }, as: PlatformAdmin, captures: { oaa: "$.data.id" } }
            - { call: "POST /properties", payload: { owner_id: "${oaa}", address: "AA", city: "Austin", state_code: "TX", jurisdiction_code: "TX-ATX", base_nightly_rate_cents: 20000, cleaning_fee_cents: 15000, max_occupancy: 6 }, as: PropertyManager, captures: { paa: "$.data.id", vaa: "$.data.version" } }
            - { call: "POST /properties/${paa}/pricing-rules", payload: { rule_type: "SEASONAL", multiplier_bps: 12000, start_date: "2026-07-01T00:00:00Z", end_date: "2026-07-31T00:00:00Z", priority: 1, expected_property_version: "${vaa}" }, as: PropertyManager }
          trigger:
            - { call: "POST /properties/${paa}/pricing-rules", payload: { rule_type: "SEASONAL", multiplier_bps: 13000, start_date: "2026-08-01T00:00:00Z", end_date: "2026-08-31T00:00:00Z", priority: 2, expected_property_version: "${vaa}" }, as: PropertyManager, captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_STALE_VERSION"

