# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth probe across the claim-extraction guide's nine sections. Instances
# already covered by §1.8 are emitted as excluded_because stubs.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: estate_create_missing_required_field
        claim_type: required_fields
        grounds: [entities.Estate.fields.seller_name, "validations[priority=3]", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /estates without seller_name is rejected with ERR_VALIDATION (400); no estate is created."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /estates"
              payload: { seller_email: "x@e.com", auction_starts_at: "2026-03-02T10:00:00Z", auction_ends_at: "2026-03-20T10:00:00Z" }
              as: Operator
              captures: { err: $.data.error_id }
          assert:
            - "trigger POST /estates returns 400 with error_id == ERR_VALIDATION"

      - name: lot_create_invalid_condition_grade
        claim_type: type_constraints
        grounds: [entities.Lot.fields.condition_grade, "validations[priority=3]", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "condition_grade outside {A,B,C,D} (e.g. 'Z') is rejected with ERR_VALIDATION (400)."
        test_recipe:
          setup: ["Estate E in CATALOGING."]
          setup_api_calls:
            - call: "POST /estates"
              payload: { seller_name: "Ec1", seller_email: "ec1@e.com", auction_starts_at: "2026-03-02T10:00:00Z", auction_ends_at: "2026-03-20T10:00:00Z" }
              as: Operator
              captures: { e_id: $.data.id }
          trigger:
            - call: "POST /lots"
              payload: { estate_id: "${e_id}", title: "L", description: "d", category: "misc", condition_grade: "Z", starting_bid_cents: 1000 }
              as: Operator
              captures: { err: $.data.error_id }
          assert:
            - "trigger POST /lots returns 400 with error_id == ERR_VALIDATION"

      - name: estate_get_not_found
        claim_type: not_found
        grounds: [entities.Estate, "validations[priority=4]", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /estates/{unknown-uuid} returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /estates/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Operator
              captures: { err: $.data.error_id }
          assert:
            - "trigger GET /estates/00000000-0000-4000-8000-000000000000 returns 404 with error_id == ERR_NOT_FOUND"

      - name: estate_create_system_fields_defaulted
        claim_type: system_fields
        grounds: [entities.Estate.fields.status, entities.Estate.fields.extended_count, entities.Estate.fields.gross_sales_cents]
        distinguishing_aspect: "A freshly created estate is CATALOGING with version 1, extended_count 0, and all money fields 0 — server-generated, not client-supplied."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /estates"
              payload: { seller_name: "Sys", seller_email: "sys@e.com", auction_starts_at: "2026-03-02T10:00:00Z", auction_ends_at: "2026-03-20T10:00:00Z" }
              as: Operator
              captures: { e_id: $.data.id }
          assert:
            - "Estate.${e_id}.status == CATALOGING"
            - "Estate.${e_id}.version == 1"
            - "Estate.${e_id}.extended_count == 0"
            - "Estate.${e_id}.gross_sales_cents == 0"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: estate_open_requires_listed_lot
        claim_type: precondition_enforcement
        grounds: [state_machines.Estate.CATALOGING_to_LIVE, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Opening an estate that has no LISTED lot is rejected with ERR_INVALID_STATE (409); estate stays CATALOGING."
        test_recipe:
          setup: ["Estate E in CATALOGING with no listed lots."]
          setup_api_calls:
            - call: "POST /estates"
              payload: { seller_name: "Eo1", seller_email: "eo1@e.com", auction_starts_at: "2026-03-02T10:00:00Z", auction_ends_at: "2026-03-20T10:00:00Z" }
              as: Operator
              captures: { e_id: $.data.id }
          trigger:
            - call: "POST /estates/${e_id}/open"
              payload: {}
              as: Operator
              captures: { err: $.data.error_id }
          assert:
            - "trigger POST /estates/${e_id}/open returns 409 with error_id == ERR_INVALID_STATE"
            - "Estate.${e_id}.status == CATALOGING"

      - name: estate_settle_before_close_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Estate.CLOSED_to_SETTLED, "validations[priority=6]", "errors[ERR_ESTATE_NOT_CLOSED]"]
        distinguishing_aspect: "Settling an estate that is still CATALOGING (not CLOSED) is rejected with ERR_ESTATE_NOT_CLOSED (409)."
        test_recipe:
          setup: ["Estate E in CATALOGING."]
          setup_api_calls:
            - call: "POST /estates"
              payload: { seller_name: "Es1", seller_email: "es1@e.com", auction_starts_at: "2026-03-02T10:00:00Z", auction_ends_at: "2026-03-20T10:00:00Z" }
              as: Operator
              captures: { e_id: $.data.id }
          trigger:
            - call: "POST /estates/${e_id}/settle"
              payload: {}
              as: Operator
              captures: { err: $.data.error_id }
          assert:
            - "trigger POST /estates/${e_id}/settle returns 409 with error_id == ERR_ESTATE_NOT_CLOSED"

      - name: estate_open_twice_rejected
        claim_type: idempotency
        grounds: [state_machines.Estate.CATALOGING_to_LIVE, "validations[priority=6]", "errors[ERR_ESTATE_NOT_CATALOGING]"]
        distinguishing_aspect: "Re-opening an already LIVE estate is rejected with ERR_ESTATE_NOT_CATALOGING (409); the second open is not idempotent-accepted."
        test_recipe:
          setup: ["Estate E with a LISTED lot, already opened (LIVE)."]
          setup_api_calls:
            - call: "POST /estates"
              payload: { seller_name: "Et1", seller_email: "et1@e.com", auction_starts_at: "2026-03-02T10:00:00Z", auction_ends_at: "2026-03-20T10:00:00Z" }
              as: Operator
              captures: { e_id: $.data.id }
            - call: "POST /lots"
              payload: { estate_id: "${e_id}", title: "L", description: "d", category: "misc", condition_grade: "B", starting_bid_cents: 1000 }
              as: Operator
              captures: { l_id: $.data.id }
            - call: "POST /photos"
              payload: { lot_id: "${l_id}", image_url: "http://img/l.jpg" }
              as: Operator
            - call: "PATCH /lots/${l_id}"
              payload: { status: "CATALOGED" }
              as: Operator
            - call: "PATCH /lots/${l_id}"
              payload: { status: "LISTED" }
              as: Operator
            - call: "POST /estates/${e_id}/open"
              payload: {}
              as: Operator
          trigger:
            - call: "POST /estates/${e_id}/open"
              payload: {}
              as: Operator
              captures: { err: $.data.error_id }
          assert:
            - "trigger POST /estates/${e_id}/open returns 409 with error_id == ERR_ESTATE_NOT_CATALOGING"

      - name: lot_withdraw_requires_passed
        claim_type: invalid_transition
        grounds: [state_machines.Lot.PASSED_to_WITHDRAWN, "validations[priority=7]", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "PATCH a DRAFT lot to WITHDRAWN (only PASSED->WITHDRAWN is legal) is rejected with ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["Estate E in CATALOGING with a DRAFT lot."]
          setup_api_calls:
            - call: "POST /estates"
              payload: { seller_name: "Ew1", seller_email: "ew1@e.com", auction_starts_at: "2026-03-02T10:00:00Z", auction_ends_at: "2026-03-20T10:00:00Z" }
              as: Operator
              captures: { e_id: $.data.id }
            - call: "POST /lots"
              payload: { estate_id: "${e_id}", title: "L", description: "d", category: "misc", condition_grade: "B", starting_bid_cents: 1000 }
              as: Operator
              captures: { l_id: $.data.id }
          trigger:
            - call: "PATCH /lots/${l_id}"
              payload: { status: "WITHDRAWN" }
              as: Operator
              captures: { err: $.data.error_id }
          assert:
            - "trigger PATCH /lots/${l_id} returns 409 with error_id == ERR_INVALID_STATE"
            - "Lot.${l_id}.status == DRAFT"

  # ===========================================================================
  - section: calculations
    instances:
      - name: reserve_not_met_lot_passes
        claim_type: correct_result
        grounds: [calculations.lot_sale_determination, state_machines.Lot.SELLING_to_PASSED, entities.Lot.fields.reserve_cents]
        distinguishing_aspect: "A lot with reserve 10000 whose only bid is 9900 (< reserve) goes PASSED at close with hammer_price_cents null — the reserve boundary is >= reserve."
        test_recipe:
          setup: ["Estate live; verified B1; lot L starting 9900 reserve 10000; B1 bids 9900."]
          setup_api_calls:
            - call: "POST /estates"
              payload: { seller_name: "Er1", seller_email: "er1@e.com", auction_starts_at: "2026-03-02T10:00:00Z", auction_ends_at: "2026-03-20T10:00:00Z" }
              as: Operator
              captures: { e_id: $.data.id }
            - call: "POST /buyers"
              payload: { display_name: "B1", email: "b1@x.com" }
              as: Anonymous
              captures: { b1_id: $.data.id }
            - call: "POST /buyers/${b1_id}/verify"
              payload: {}
              as: Operator
            - call: "POST /lots"
              payload: { estate_id: "${e_id}", title: "L", description: "d", category: "misc", condition_grade: "B", starting_bid_cents: 9900, reserve_cents: 10000 }
              as: Operator
              captures: { l_id: $.data.id }
            - call: "POST /photos"
              payload: { lot_id: "${l_id}", image_url: "http://img/l.jpg" }
              as: Operator
            - call: "PATCH /lots/${l_id}"
              payload: { status: "CATALOGED" }
              as: Operator
            - call: "PATCH /lots/${l_id}"
              payload: { status: "LISTED" }
              as: Operator
            - call: "POST /estates/${e_id}/open"
              payload: {}
              as: Operator
            - call: "GET /lots/${l_id}"
              payload: {}
              as: Operator
              captures: { lv: $.data.version }
            - call: "POST /bids"
              payload: { lot_id: "${l_id}", buyer_id: "${b1_id}", amount_cents: 9900, expected_lot_version: "${lv}" }
              as: Buyer
              as_user_id: "${b1_id}"
          trigger:
            - call: "POST /estates/${e_id}/close"
              payload: {}
              as: Operator
          assert:
            - "Lot.${l_id}.status == PASSED"
            - "Lot.${l_id}.hammer_price_cents == null"

      - name: soft_close_extends_auction_end
        claim_type: correct_result
        grounds: [calculations.soft_close_extension, entities.Estate.fields.extended_count, entities.Estate.fields.soft_close_seconds]
        distinguishing_aspect: "A bid accepted at 09:59:00 (60s before auction_ends_at 10:00:00, inside the 300s soft-close window) pushes auction_ends_at forward and increments extended_count to 1."
        test_recipe:
          setup: ["Estate live with auction_ends_at 2026-03-20T10:00:00Z, soft_close 300; lot L SELLING; verified B1; clock set to 2026-03-20T09:59:00Z."]
          setup_api_calls:
            - call: "POST /estates"
              payload: { seller_name: "Esc", seller_email: "esc@e.com", auction_starts_at: "2026-03-02T10:00:00Z", auction_ends_at: "2026-03-20T10:00:00Z", soft_close_seconds: 300 }
              as: Operator
              captures: { e_id: $.data.id }
            - call: "POST /buyers"
              payload: { display_name: "B1", email: "b1@x.com" }
              as: Anonymous
              captures: { b1_id: $.data.id }
            - call: "POST /buyers/${b1_id}/verify"
              payload: {}
              as: Operator
            - call: "POST /lots"
              payload: { estate_id: "${e_id}", title: "L", description: "d", category: "misc", condition_grade: "B", starting_bid_cents: 1000 }
              as: Operator
              captures: { l_id: $.data.id }
            - call: "POST /photos"
              payload: { lot_id: "${l_id}", image_url: "http://img/l.jpg" }
              as: Operator
            - call: "PATCH /lots/${l_id}"
              payload: { status: "CATALOGED" }
              as: Operator
            - call: "PATCH /lots/${l_id}"
              payload: { status: "LISTED" }
              as: Operator
            - call: "POST /estates/${e_id}/open"
              payload: {}
              as: Operator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-20T09:59:00Z" }
              as: Operator
            - call: "GET /lots/${l_id}"
              payload: {}
              as: Operator
              captures: { lv: $.data.version }
          trigger:
            - call: "POST /bids"
              payload: { lot_id: "${l_id}", buyer_id: "${b1_id}", amount_cents: 1000, expected_lot_version: "${lv}" }
              as: Buyer
              as_user_id: "${b1_id}"
          assert:
            - "Estate.${e_id}.extended_count == 1"
            - "Estate.${e_id}.auction_ends_at == 2026-03-20T10:05:00Z"

      - name: estate_provisional_vs_final_gross_calc
        claim_type: variant_divergence
        grounds: [calculations.estate_settlement]
        excluded_because:
          difficulty_instance: dual_variant_calc / estate_provisional_vs_final_gross
          rationale: "The provisional-vs-final gross divergence is the asserted core of the named §1.8 instance."

      - name: order_charges_rounding_calc
        claim_type: correct_result
        grounds: [calculations.order_charges]
        excluded_because:
          difficulty_instance: combinatorial_formula / order_premium_aggregate_vs_perlot_rounding
          rationale: "order_charges rounding order and totals are asserted by the named §1.8 instance."

  # ===========================================================================
  - section: validations
    instances:
      - name: list_lots_invalid_limit
        claim_type: violation_to_error
        grounds: ["validations[priority=3]", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "GET /estates/{id}/lots with limit 0 (below the min of 1) returns ERR_VALIDATION (400)."
        test_recipe:
          setup: ["Estate E exists."]
          setup_api_calls:
            - call: "POST /estates"
              payload: { seller_name: "Ep1", seller_email: "ep1@e.com", auction_starts_at: "2026-03-02T10:00:00Z", auction_ends_at: "2026-03-20T10:00:00Z" }
              as: Operator
              captures: { e_id: $.data.id }
          trigger:
            - call: "GET /estates/${e_id}/lots"
              payload: { limit: 0 }
              as: Operator
              captures: { err: $.data.error_id }
          assert:
            - "trigger GET /estates/${e_id}/lots returns 400 with error_id == ERR_VALIDATION"

      - name: bid_priority_conflict_state_vs_increment
        claim_type: priority_ordering
        grounds: ["validations[priority=7]", "validations[priority=13]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / bid_state_outranks_increment
          rationale: "The state-vs-increment priority conflict on POST /bids is the named §1.8 instance."

  # ===========================================================================
  - section: endpoints
    instances:
      - name: lot_photos_reverse_list
        claim_type: computed_read
        grounds: [entities.Photo.fields.lot_id, entities.Lot.fields.photo_count]
        distinguishing_aspect: "GET /lots/{id}/photos returns the Photo[] attached to the lot (reverse-reachability), and Lot.photo_count reflects the number attached."
        test_recipe:
          setup: ["Estate CATALOGING; lot L with two photos attached."]
          setup_api_calls:
            - call: "POST /estates"
              payload: { seller_name: "Eph", seller_email: "eph@e.com", auction_starts_at: "2026-03-02T10:00:00Z", auction_ends_at: "2026-03-20T10:00:00Z" }
              as: Operator
              captures: { e_id: $.data.id }
            - call: "POST /lots"
              payload: { estate_id: "${e_id}", title: "L", description: "d", category: "misc", condition_grade: "B", starting_bid_cents: 1000 }
              as: Operator
              captures: { l_id: $.data.id }
            - call: "POST /photos"
              payload: { lot_id: "${l_id}", image_url: "http://img/1.jpg", is_primary: true }
              as: Operator
            - call: "POST /photos"
              payload: { lot_id: "${l_id}", image_url: "http://img/2.jpg" }
              as: Operator
          trigger:
            - call: "GET /lots/${l_id}/photos"
              payload: {}
              as: Operator
          assert:
            - "trigger GET /lots/${l_id}/photos returns 200 with a Photo[] of length 2"
            - "Lot.${l_id}.photo_count == 2"

      - name: bids_filtered_by_buyer
        claim_type: listing
        grounds: [entities.Bid.fields.buyer_id, entities.Bid.fields.lot_id]
        distinguishing_aspect: "GET /bids?buyer_id={b} returns only that buyer's bids (reverse-reachability for Bid.buyer_id)."
        test_recipe:
          setup: ["Estate live; verified B1; lot L SELLING; B1 places one bid of 1000."]
          setup_api_calls:
            - call: "POST /estates"
              payload: { seller_name: "Ebd", seller_email: "ebd@e.com", auction_starts_at: "2026-03-02T10:00:00Z", auction_ends_at: "2026-03-20T10:00:00Z" }
              as: Operator
              captures: { e_id: $.data.id }
            - call: "POST /buyers"
              payload: { display_name: "B1", email: "b1@x.com" }
              as: Anonymous
              captures: { b1_id: $.data.id }
            - call: "POST /buyers/${b1_id}/verify"
              payload: {}
              as: Operator
            - call: "POST /lots"
              payload: { estate_id: "${e_id}", title: "L", description: "d", category: "misc", condition_grade: "B", starting_bid_cents: 1000 }
              as: Operator
              captures: { l_id: $.data.id }
            - call: "POST /photos"
              payload: { lot_id: "${l_id}", image_url: "http://img/l.jpg" }
              as: Operator
            - call: "PATCH /lots/${l_id}"
              payload: { status: "CATALOGED" }
              as: Operator
            - call: "PATCH /lots/${l_id}"
              payload: { status: "LISTED" }
              as: Operator
            - call: "POST /estates/${e_id}/open"
              payload: {}
              as: Operator
            - call: "GET /lots/${l_id}"
              payload: {}
              as: Operator
              captures: { lv: $.data.version }
            - call: "POST /bids"
              payload: { lot_id: "${l_id}", buyer_id: "${b1_id}", amount_cents: 1000, expected_lot_version: "${lv}" }
              as: Buyer
              as_user_id: "${b1_id}"
          trigger:
            - call: "GET /bids"
              payload: { buyer_id: "${b1_id}" }
              as: Operator
          assert:
            - "trigger GET /bids returns 200 with a Bid[] of length 1 whose buyer_id == ${b1_id}"

  # ===========================================================================
  - section: errors
    instances:
      - name: pay_insufficient_amount
        claim_type: violation_to_error
        grounds: ["validations[priority=15]", "errors[ERR_INSUFFICIENT_PAYMENT]", entities.Order.fields.total_cents]
        distinguishing_aspect: "Paying an order (total 12690) with amount_cents 12000 (< total) is rejected with ERR_INSUFFICIENT_PAYMENT (402); order stays UNPAID."
        test_recipe:
          setup: ["Estate: B1 wins L1 (hammer 10000) -> order O1 total 12690, UNPAID."]
          setup_api_calls:
            - call: "POST /estates"
              payload: { seller_name: "Ein", seller_email: "ein@e.com", auction_starts_at: "2026-03-02T10:00:00Z", auction_ends_at: "2026-03-20T10:00:00Z" }
              as: Operator
              captures: { e_id: $.data.id }
            - call: "POST /buyers"
              payload: { display_name: "B1", email: "b1@x.com" }
              as: Anonymous
              captures: { b1_id: $.data.id }
            - call: "POST /buyers/${b1_id}/verify"
              payload: {}
              as: Operator
            - call: "POST /lots"
              payload: { estate_id: "${e_id}", title: "L1", description: "d", category: "misc", condition_grade: "B", starting_bid_cents: 10000 }
              as: Operator
              captures: { l1_id: $.data.id }
            - call: "POST /photos"
              payload: { lot_id: "${l1_id}", image_url: "http://img/l1.jpg" }
              as: Operator
            - call: "PATCH /lots/${l1_id}"
              payload: { status: "CATALOGED" }
              as: Operator
            - call: "PATCH /lots/${l1_id}"
              payload: { status: "LISTED" }
              as: Operator
            - call: "POST /estates/${e_id}/open"
              payload: {}
              as: Operator
            - call: "GET /lots/${l1_id}"
              payload: {}
              as: Operator
              captures: { l1v: $.data.version }
            - call: "POST /bids"
              payload: { lot_id: "${l1_id}", buyer_id: "${b1_id}", amount_cents: 10000, expected_lot_version: "${l1v}" }
              as: Buyer
              as_user_id: "${b1_id}"
            - call: "POST /estates/${e_id}/close"
              payload: {}
              as: Operator
            - call: "GET /orders"
              payload: {}
              as: Operator
              captures: { o1_id: "$.data[0].id" }
          trigger:
            - call: "POST /orders/${o1_id}/pay"
              payload: { amount_cents: 12000 }
              as: Buyer
              as_user_id: "${b1_id}"
              captures: { err: $.data.error_id }
          assert:
            - "trigger POST /orders/${o1_id}/pay returns 402 with error_id == ERR_INSUFFICIENT_PAYMENT"
            - "Order.${o1_id}.payment_status == UNPAID"

      - name: pay_already_paid_order
        claim_type: violation_to_error
        grounds: ["validations[priority=7]", "errors[ERR_ORDER_ALREADY_PAID]", state_machines.Order.UNPAID_to_PAID]
        distinguishing_aspect: "A second pay on an already-PAID order is rejected with ERR_ORDER_ALREADY_PAID (409)."
        test_recipe:
          setup: ["Estate: B1 wins L1 -> order O1 total 12690, already PAID."]
          setup_api_calls:
            - call: "POST /estates"
              payload: { seller_name: "Eap", seller_email: "eap@e.com", auction_starts_at: "2026-03-02T10:00:00Z", auction_ends_at: "2026-03-20T10:00:00Z" }
              as: Operator
              captures: { e_id: $.data.id }
            - call: "POST /buyers"
              payload: { display_name: "B1", email: "b1@x.com" }
              as: Anonymous
              captures: { b1_id: $.data.id }
            - call: "POST /buyers/${b1_id}/verify"
              payload: {}
              as: Operator
            - call: "POST /lots"
              payload: { estate_id: "${e_id}", title: "L1", description: "d", category: "misc", condition_grade: "B", starting_bid_cents: 10000 }
              as: Operator
              captures: { l1_id: $.data.id }
            - call: "POST /photos"
              payload: { lot_id: "${l1_id}", image_url: "http://img/l1.jpg" }
              as: Operator
            - call: "PATCH /lots/${l1_id}"
              payload: { status: "CATALOGED" }
              as: Operator
            - call: "PATCH /lots/${l1_id}"
              payload: { status: "LISTED" }
              as: Operator
            - call: "POST /estates/${e_id}/open"
              payload: {}
              as: Operator
