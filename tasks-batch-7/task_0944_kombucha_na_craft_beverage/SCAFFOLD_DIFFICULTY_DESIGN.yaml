              payload: { label: "Mother L" }
              as: ProductionOperator
              captures: { sc_id: $.data.id }
            - call: "POST /vessels"
              payload: { code: "FV-12", capacity_liters: 500.0 }
              as: ProductionOperator
              captures: { v_id: $.data.id }
          trigger:
            - call: "POST /batches"
              payload: { batch_code: "B-12001", recipe_id: "${rec_id}", scoby_culture_id: "${sc_id}", vessel_id: "${v_id}", pitched_liters: 400.0, planned_f2_days: 3 }
              as: ProductionOperator
              captures: { err: $.data.error_id }
          assert:
            - "the response error_id is ERR_VESSEL_UNAVAILABLE with HTTP 409"
            - "Vessel.${v_id}.state == DIRTY"
            - "Vessel.${v_id}.current_batch_id == null"
            - "ScobyCulture.${sc_id}.pitch_count == 0"
            - "ScobyCulture.${sc_id}.vitality_score == 100"

