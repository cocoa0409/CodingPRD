              captures: { ppg: $.data.price_cents_per_gallon, total: $.data.invoice_total_cents }
          assert:
            - "DeliveryOrder.${order_id}.price_cents_per_gallon == 338   # 350 - tier2 12"
            - "DeliveryOrder.${order_id}.invoice_total_cents == 110660   # 320*338=108160 + 2500 off_route"

      - name: auto_delivery_target_fill_to_capacity
        claim_type: Correct Result
        grounds: [calculations.auto_delivery_target, calculations.tank_reorder_projection, endpoints]
        distinguishing_aspect: "AUTOMATIC DUE tank (proj 150 of cap 500) generates an order with requested_gallons = 500-150 = 350."
        test_recipe:
          setup: ["AUTOMATIC tank cap 500 k 1800 thr 30 monitor false cur 450; one DD reading 167 at 2026-01-01; clock 2026-01-02 => proj 150 DUE."]
          setup_api_calls:
