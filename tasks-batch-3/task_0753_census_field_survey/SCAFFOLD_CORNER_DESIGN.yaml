  # --------------------------------- RBAC -------------------------------------
  - section: rbac
    instances:
      - name: enumerator_cannot_create_project
        claim_type: unauthorized_role
        grounds:
          - roles.SurveyAdmin
          - errors[ERR_INSUFFICIENT_PERMISSIONS]
        distinguishing_aspect: "An Enumerator calling POST /survey-projects (SurveyAdmin-exclusive) is denied ERR_INSUFFICIENT_PERMISSIONS (403)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /survey-projects"
              payload: { name: "Wave AG", region_code: "R1", default_language: "EN", supported_languages: ["EN"] }
              as: Enumerator
              captures: { err: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_INSUFFICIENT_PERMISSIONS"

      - name: field_supervisor_cannot_create_area
        claim_type: unauthorized_role
        grounds:
          - roles.SurveyAdmin
          - errors[ERR_INSUFFICIENT_PERMISSIONS]
        distinguishing_aspect: "A FieldSupervisor calling POST /survey-projects/{id}/assignment-areas (SurveyAdmin-exclusive) is denied ERR_INSUFFICIENT_PERMISSIONS (403)."
        test_recipe:
          setup: ["A project exists."]
          setup_api_calls:
            - call: "POST /survey-projects"
              payload: { name: "Wave AH", region_code: "R1", default_language: "EN", supported_languages: ["EN"] }
              as: SurveyAdmin
              captures: { proj_id: $.data.id }
          trigger:
            - call: "POST /survey-projects/${proj_id}/assignment-areas"
              payload: { area_code: "A1", budget_cents: 1000000 }
              as: FieldSupervisor
              captures: { err: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_INSUFFICIENT_PERMISSIONS"

  # ------------------- Cross-Cutting Complexity Layers ------------------------
  - section: cross_cutting
    instances:
      - name: reassign_stale_case_version_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[assignment-create-stale-case]
          - errors[ERR_STALE_CASE_VERSION]
          - entities.Case.fields.version
        distinguishing_aspect: "A second assignment carrying the pre-first-assignment expected_case_version (stale) is rejected ERR_STALE_CASE_VERSION (412)."
        test_recipe:
          setup: ["An IN_FIELD area, ACTIVE E1 and E2, a case first assigned to E1 (its version now advanced from the observed case_v)."]
          setup_api_calls:
            - call: "POST /survey-projects"
              payload: { name: "Wave AI", region_code: "R1", default_language: "EN", supported_languages: ["EN"] }
              as: SurveyAdmin
              captures: { proj_id: $.data.id }
            - call: "POST /survey-projects/${proj_id}/open"
              payload: {}
              as: SurveyAdmin
            - call: "POST /survey-projects/${proj_id}/assignment-areas"
              payload: { area_code: "A1", budget_cents: 1000000 }
              as: SurveyAdmin
              captures: { area_id: $.data.id }
            - call: "POST /assignment-areas/${area_id}/open"
              payload: {}
              as: SurveyAdmin
            - call: "POST /survey-projects/${proj_id}/enumerators"
              payload: { full_name: "E1", languages: ["EN"], hourly_rate_cents: 3000 }
              as: SurveyAdmin
              captures: { en1_id: $.data.id }
            - call: "POST /enumerators/${en1_id}/hire"
              payload: {}
              as: SurveyAdmin
            - call: "POST /enumerators/${en1_id}/activate"
              payload: {}
              as: SurveyAdmin
            - call: "POST /survey-projects/${proj_id}/enumerators"
              payload: { full_name: "E2", languages: ["EN"], hourly_rate_cents: 3000 }
              as: SurveyAdmin
              captures: { en2_id: $.data.id }
            - call: "POST /enumerators/${en2_id}/hire"
              payload: {}
              as: SurveyAdmin
            - call: "POST /enumerators/${en2_id}/activate"
              payload: {}
              as: SurveyAdmin
            - call: "POST /assignment-areas/${area_id}/cases"
              payload: { address: "A St", respondent_language: "EN" }
              as: SurveyAdmin
              captures: { case_id: $.data.id, case_v: $.data.version }
            - call: "POST /cases/${case_id}/assignments"
              payload: { enumerator_id: "${en1_id}", expected_case_version: "${case_v}" }
              as: FieldSupervisor
          trigger:
            - call: "POST /cases/${case_id}/assignments"
              payload: { enumerator_id: "${en2_id}", expected_case_version: "${case_v}" }
              as: FieldSupervisor
              captures: { err: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_STALE_CASE_VERSION"
            - "trigger response HTTP status == 412"

      - name: reassign_supersede_bumps_case_version
        claim_type: optimistic_concurrency
        grounds:
          - state_machines.CaseAssignment.ACTIVE_to_SUPERSEDED
          - entities.Case.fields.version
          - entities.CaseAssignment.fields.status
        distinguishing_aspect: "Reassigning with the current case version supersedes the prior assignment (SUPERSEDED), repoints assigned_enumerator_id to E2, and bumps Case.version to 3."
        test_recipe:
          setup: ["An IN_FIELD area, ACTIVE E1 and E2; a case assigned to E1 (version=2); the current version re-read as case_v2."]
          setup_api_calls:
            - call: "POST /survey-projects"
              payload: { name: "Wave AJ", region_code: "R1", default_language: "EN", supported_languages: ["EN"] }
              as: SurveyAdmin
              captures: { proj_id: $.data.id }
            - call: "POST /survey-projects/${proj_id}/open"
              payload: {}
              as: SurveyAdmin
            - call: "POST /survey-projects/${proj_id}/assignment-areas"
              payload: { area_code: "A1", budget_cents: 1000000 }
              as: SurveyAdmin
              captures: { area_id: $.data.id }
            - call: "POST /assignment-areas/${area_id}/open"
              payload: {}
              as: SurveyAdmin
            - call: "POST /survey-projects/${proj_id}/enumerators"
              payload: { full_name: "E1", languages: ["EN"], hourly_rate_cents: 3000 }
              as: SurveyAdmin
              captures: { en1_id: $.data.id }
            - call: "POST /enumerators/${en1_id}/hire"
              payload: {}
              as: SurveyAdmin
            - call: "POST /enumerators/${en1_id}/activate"
              payload: {}
              as: SurveyAdmin
            - call: "POST /survey-projects/${proj_id}/enumerators"
              payload: { full_name: "E2", languages: ["EN"], hourly_rate_cents: 3000 }
              as: SurveyAdmin
              captures: { en2_id: $.data.id }
            - call: "POST /enumerators/${en2_id}/hire"
              payload: {}
              as: SurveyAdmin
            - call: "POST /enumerators/${en2_id}/activate"
              payload: {}
              as: SurveyAdmin
            - call: "POST /assignment-areas/${area_id}/cases"
              payload: { address: "A St", respondent_language: "EN" }
              as: SurveyAdmin
              captures: { case_id: $.data.id, case_v: $.data.version }
            - call: "POST /cases/${case_id}/assignments"
              payload: { enumerator_id: "${en1_id}", expected_case_version: "${case_v}" }
              as: FieldSupervisor
              captures: { asg1_id: $.data.id }
            - call: "GET /cases/${case_id}"
              payload: {}
              as: FieldSupervisor
              captures: { case_v2: $.data.version }
          trigger:
            - call: "POST /cases/${case_id}/assignments"
              payload: { enumerator_id: "${en2_id}", expected_case_version: "${case_v2}" }
              as: FieldSupervisor
          assert:
            - "CaseAssignment.${asg1_id}.status == SUPERSEDED"
            - "Case.${case_id}.assigned_enumerator_id == ${en2_id}"
            - "Case.${case_id}.version == 3"

      - name: budget_committed_reconciles_after_attempt
        claim_type: derived_field_reconciliation
        grounds:
          - calculations.attempt_pay_commit
          - entities.AssignmentArea.fields.budget_remaining_cents
        distinguishing_aspect: "After a 60-minute IN_PERSON attempt at hourly_rate 3000, budget_committed_cents=3000 and budget_remaining_cents=97000 for a 100000 budget."
        test_recipe:
          setup: ["An IN_FIELD area (budget 100000), ACTIVE E1 (hourly 3000), one case assigned to E1."]
          setup_api_calls:
            - call: "POST /survey-projects"
              payload: { name: "Wave AK", region_code: "R1", default_language: "EN", supported_languages: ["EN"] }
              as: SurveyAdmin
              captures: { proj_id: $.data.id }
            - call: "POST /survey-projects/${proj_id}/open"
              payload: {}
              as: SurveyAdmin
            - call: "POST /survey-projects/${proj_id}/assignment-areas"
              payload: { area_code: "A1", budget_cents: 100000 }
              as: SurveyAdmin
              captures: { area_id: $.data.id }
            - call: "POST /assignment-areas/${area_id}/open"
              payload: {}
              as: SurveyAdmin
            - call: "POST /survey-projects/${proj_id}/enumerators"
              payload: { full_name: "E1", languages: ["EN"], hourly_rate_cents: 3000 }
              as: SurveyAdmin
              captures: { en1_id: $.data.id }
            - call: "POST /enumerators/${en1_id}/hire"
              payload: {}
              as: SurveyAdmin
            - call: "POST /enumerators/${en1_id}/activate"
              payload: {}
              as: SurveyAdmin
            - call: "POST /assignment-areas/${area_id}/cases"
              payload: { address: "A St", respondent_language: "EN" }
              as: SurveyAdmin
              captures: { case_id: $.data.id, case_v: $.data.version }
            - call: "POST /cases/${case_id}/assignments"
              payload: { enumerator_id: "${en1_id}", expected_case_version: "${case_v}" }
              as: FieldSupervisor
          trigger:
            - call: "POST /cases/${case_id}/attempts"
              payload: { mode: "IN_PERSON", window_start: "2026-03-01T10:00:00Z", window_end: "2026-03-01T11:00:00Z", disposition: "NO_ONE_HOME", mileage_miles: 0 }
              as: Enumerator
              as_user_id: "${en1_id}"
          assert:
            - "AssignmentArea.${area_id}.budget_committed_cents == 3000"
            - "AssignmentArea.${area_id}.budget_remaining_cents == 97000"

      - name: attempt_budget_exceeded_returns_402
        claim_type: rate_threshold_triggers
        grounds:
          - validations[priority=18]
          - errors[ERR_AREA_BUDGET_EXCEEDED]
        distinguishing_aspect: "An attempt whose committed pay (3000) exceeds budget_remaining_cents (100) returns ERR_AREA_BUDGET_EXCEEDED (402)."
        test_recipe:
          setup: ["An IN_FIELD area with budget 100, ACTIVE E1 (hourly 3000), one case assigned to E1."]
          setup_api_calls:
            - call: "POST /survey-projects"
              payload: { name: "Wave AL", region_code: "R1", default_language: "EN", supported_languages: ["EN"] }
              as: SurveyAdmin
              captures: { proj_id: $.data.id }
            - call: "POST /survey-projects/${proj_id}/open"
              payload: {}
              as: SurveyAdmin
            - call: "POST /survey-projects/${proj_id}/assignment-areas"
              payload: { area_code: "A1", budget_cents: 100 }
              as: SurveyAdmin
              captures: { area_id: $.data.id }
            - call: "POST /assignment-areas/${area_id}/open"
              payload: {}
              as: SurveyAdmin
            - call: "POST /survey-projects/${proj_id}/enumerators"
              payload: { full_name: "E1", languages: ["EN"], hourly_rate_cents: 3000 }
