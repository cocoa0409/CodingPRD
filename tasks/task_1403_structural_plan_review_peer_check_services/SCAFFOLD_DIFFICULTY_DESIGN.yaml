              as: Reviewer
              as_user_id: "${rev_id}"
          assert:
            - "${err} == ERR_UNRESOLVED_COMMENTS_REMAIN (OPEN comment on the engagement blocks the cycle's approval)"
            - "after verify, Engagement.${eng_id}.unresolved_comment_count == 0 and second approve succeeds"
            - "ReviewCycle.${cyc2}.status == APPROVED and ReviewCycle.${cyc_id}.status == SUPERSEDED"

      - name: record_seal_gated_by_deferred_submittal_states
        grounds:
          - state_machines.ReviewRecord.DRAFT_to_SEALED
          - calculations.deferred_pending_count
          - errors[ERR_DEFERRED_SUBMITTALS_OUTSTANDING]
        distinguishing_aspect: |
          Pair ReviewRecord x DeferredSubmittal: the record's SEALED transition
