              payload: {}
              as: DataSteward
              captures: { pia: $.data.id }
            - call: "POST /privacy/assessments/${pia}/submit"
              payload: {}
              as: BusinessOwner
              as_user_id: "bo-1"
            - call: "POST /privacy/assessments/${pia}/request-changes"
              payload: {}
              as: LegalCounsel
              as_user_id: "lc-1"
          trigger:
            - call: "POST /privacy/assessments/${pia}/approve"
              payload: {}
              as: LegalCounsel
              as_user_id: "bo-1"
              captures: { err: $.data.error_id }
            - call: "GET /privacy/assessments/${pia}"
              payload: {}
              as: LegalCounsel
              captures: { pia_st: $.data.status }
          assert:
            - "error_id == ERR_INVALID_STATE_TRANSITION (state p5 outranks SoD p7 even though the caller IS the submitter)"
            - "assessment remains CHANGES_REQUESTED; no final_score written"

      - name: referential_vs_temporal_on_transfer_create
        grounds:
