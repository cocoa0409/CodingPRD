    description: "Report an incident"
    roles: [TrackOps, SafetyOfficer]
    code: 201
    input: [session_id, severity, reported_by_user_id]
    output: Incident
    side_effects:
      - "status=OPEN"
      - "TrackDay.open_incident_count += 1"
      - "If severity in {MEDIUM, HIGH, CRITICAL}: parent session → RED"
      - "If severity in {HIGH, CRITICAL}: TrackDay.status → STOPPED"
      - "TrackDay.posture recomputed; TrackDay.version incremented"

  - method: GET
    path: "/tracks/{tid}/track-days/{tdid}/incidents/{iid}"
