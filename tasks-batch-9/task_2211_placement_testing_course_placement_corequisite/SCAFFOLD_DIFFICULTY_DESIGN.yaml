            - "${base0} == 69.9 and ${conf0} == 69.9 and ${vdays0} == 180 and ${place0} == \"PROVISIONAL\" and ${ev0} == \"UNVERIFIED\""
            - "${err_finalize_early} == \"ERR_EVIDENCE_NOT_VERIFIED\" (422) — the placement axis is gated on the evidence axis"
            - "${place1} == \"PROVISIONAL\" and ${ev1} == \"UNVERIFIED\" — the rejected finalize moved NEITHER axis"
            - "${ev2} == \"VERIFIED\" and ${place2} == \"PROVISIONAL\" — the evidence axis moved alone"
            - "${conf2} == 69.9 and ${vdays2} == 180 — verifying evidence never re-scores the determination"
            - "${place3} == \"FINAL\" and ${ev3} == \"VERIFIED\" — the placement axis moved alone on the second finalize"
            - "${err_manual_dispute} == \"ERR_INVALID_STATE\" (409) — VERIFIED -> DISPUTED is reachable only as a void cascade"
            - "${placement_status} == \"FINAL\" and ${hold} == false"

      - name: appeal_info_requested_cycle_two_rounds_then_round_limit
        grounds:
          - state_machines.PlacementAppeal.UNDER_REVIEW_to_INFO_REQUESTED
          - state_machines.PlacementAppeal.INFO_REQUESTED_to_UNDER_REVIEW
          - entities.PlacementAppeal.fields.revision_round
          - validations[priority=24]
          - errors.ERR_APPEAL_ROUND_LIMIT
        distinguishing_aspect: |
          PlacementAppeal.state contains a genuine two-node cycle
          (UNDER_REVIEW <-> INFO_REQUESTED) whose termination is governed by a
          counter that only ONE of the two edges increments: revision_round is
          bumped on resubmit, never on request-info, and the guard is checked on
          request-info. The appeal therefore survives exactly two full laps and
          the third request-info is ERR_APPEAL_ROUND_LIMIT while the appeal STAYS
          in UNDER_REVIEW — the failed guard is not a terminal transition. An
          implementation that counts request-info calls, or that treats the limit
          as a dead end, diverges on lap two or on the post-rejection state.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-02T00:00:00Z."
            - "Courses MATH-050 (level_rank 50, units 5.0) and MATH-100 (level_rank 100, units 4.0), both ACTIVE."
            - "One ACTIVE PlacementRule TRANSCRIPT_GPA -> MATH-050 (min_hs_gpa 2.0, V1)."
            - "Student SH: hs_gpa 2.50, hs_transcript_status VERIFIED, transcript_recorded_at 2025-06-01T00:00:00Z; determined_by_user_id will be staff-1."
            - "A PROVISIONAL determination on MATH-050 created at 2026-08-01T00:00:00Z (default clock), so the appeal is filed 1 day into the 30-day APPEAL_FILING_WINDOW_DAYS."
            - "The appeal is reviewed by registrar-1 (!= staff-1, satisfying SoD-2). Every resubmit lands well inside filed_at + APPEAL_RESUBMIT_DAYS (14)."
          setup_api_calls:
            - call: "POST /courses"
              payload: { course_code: "MATH-050", title: "Pre-Algebra", subject_area: "MATH", level_rank: 50, units: 5.0, is_support_course: false, transfer_level: false }
              as: SystemAdmin
              as_user_id: "admin-1"
              captures: { c_050: $.data.id }
            - call: "POST /courses"
              payload: { course_code: "MATH-100", title: "College Algebra", subject_area: "MATH", level_rank: 100, units: 4.0, is_support_course: false, transfer_level: true }
              as: SystemAdmin
              as_user_id: "admin-1"
              captures: { c_100: $.data.id }
            - call: "POST /placement-rules"
              payload: { subject_area: "MATH", measure_type: "TRANSCRIPT_GPA", target_course_id: "${c_050}", priority_rank: 10, min_hs_gpa: 2.0, effective_from: "2026-07-01T00:00:00Z", version_label: "V1" }
              as: AssessmentDirector
              as_user_id: "director-1"
              captures: { r_050: $.data.id }
            - call: "POST /placement-rules/${r_050}/activate"
              payload: {}
              as: AssessmentDirector
              as_user_id: "director-1"
            - call: "POST /students"
              payload: { student_number: "SH", full_name: "Student H", race_ethnicity_code: "AIAN", hs_gpa: 2.50, hs_transcript_status: "VERIFIED", transcript_recorded_at: "2025-06-01T00:00:00Z" }
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { sh_id: $.data.id, sh_v: $.data.version }
            - call: "POST /placement-determinations"
              payload: { student_id: "${sh_id}", subject_area: "MATH", expected_student_version: "${sh_v}" }
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { det: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-02T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "admin-1"
            - call: "GET /placement-determinations/${det}"
              payload: {}
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { det_v: $.data.version }
            - call: "POST /placement-appeals"
              payload: { determination_id: "${det}", requested_course_id: "${c_100}", grounds: "NEW_TRANSCRIPT", statement: "A corrected transcript raises my GPA.", expected_determination_version: "${det_v}" }
              as: Student
              as_user_id: "${sh_id}"
              captures: { app: $.data.id, round0: $.data.revision_round, state0: $.data.state }
            - call: "POST /placement-appeals/${app}/start-review"
              payload: {}
              as: Registrar
              as_user_id: "registrar-1"
              captures: { state1: $.data.state, reviewer: $.data.reviewed_by_user_id }
          trigger:
            - call: "POST /placement-appeals/${app}/request-info"
              payload: { info_request_note: "Attach the corrected transcript." }
              as: Registrar
              as_user_id: "registrar-1"
              captures: { state2: $.data.state, round2: $.data.revision_round, note2: $.data.info_request_note }
            - call: "POST /placement-appeals/${app}/resubmit"
              payload: { statement: "Corrected transcript attached, lap one." }
              as: Student
              as_user_id: "${sh_id}"
              captures: { state3: $.data.state, round3: $.data.revision_round, note3: $.data.info_request_note }
            - call: "POST /placement-appeals/${app}/request-info"
              payload: { info_request_note: "The attachment is unsigned; resend." }
              as: Registrar
              as_user_id: "registrar-1"
              captures: { state4: $.data.state, round4: $.data.revision_round }
            - call: "POST /placement-appeals/${app}/resubmit"
              payload: { statement: "Signed transcript attached, lap two." }
              as: Student
              as_user_id: "${sh_id}"
              captures: { state5: $.data.state, round5: $.data.revision_round }
            - call: "POST /placement-appeals/${app}/request-info"
              payload: { info_request_note: "One more document, please." }
              as: Registrar
              as_user_id: "registrar-1"
              captures: { err_round_limit: $.data.error_id }
            - call: "GET /placement-appeals/${app}"
              payload: {}
              as: Registrar
              as_user_id: "registrar-1"
              captures: { state6: $.data.state, round6: $.data.revision_round }
          assert:
            - "${state0} == \"SUBMITTED\" and ${round0} == 0 and PlacementDetermination.${det}.placement_state == \"APPEALED\""
            - "${state1} == \"UNDER_REVIEW\" and ${reviewer} == \"registrar-1\""
            - "${state2} == \"INFO_REQUESTED\" and ${round2} == 0 — request-info does NOT increment the counter"
            - "${note2} == \"Attach the corrected transcript.\""
            - "${state3} == \"UNDER_REVIEW\" and ${round3} == 1 and ${note3} == null — lap one closed; resubmit increments and clears the note"
            - "${state4} == \"INFO_REQUESTED\" and ${round4} == 1 — the guard 1 < 2 still passes"
            - "${state5} == \"UNDER_REVIEW\" and ${round5} == 2 — lap two closed"
            - "${err_round_limit} == \"ERR_APPEAL_ROUND_LIMIT\" (422) — the guard 2 < 2 fails"
            - "${state6} == \"UNDER_REVIEW\" and ${round6} == 2 — the appeal is still decidable; the rejected request-info is not terminal"
            - "PlacementAppeal.${app}.statement == \"Signed transcript attached, lap two.\" — the last accepted resubmit is the one on file"

      - name: section_pairing_paired_to_broken_to_paired_reentry
        grounds:
          - state_machines.Section.UNPAIRED_to_PAIRED
          - state_machines.Section.PAIRED_to_PAIR_BROKEN
          - state_machines.Section.PAIR_BROKEN_to_PAIRED
          - entities.Section.fields.linked_section_id
          - calculations.section_available_seats
        distinguishing_aspect: |
          Section.pairing_state re-enters PAIRED from PAIR_BROKEN, and the loop is
          not a reset: linked_section_id is RETAINED (not cleared) while broken,
          so the row both advertises a dead partner and reports the committed_only
          seat variant. The observable signature of one lap is a non-monotonic seat
          sequence — 2 (paired to a 2-seat support), 5 (broken, own capacity), 3
          (re-paired to a 3-seat support) — that no linear pairing_state model can
          produce. Re-entry also requires the PRIMARY to still be PLANNED, so the
          cancellation must not have closed it.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-10T00:00:00Z."
            - "Courses MATH-100 (units 4.0, is_support_course false) and MATH-100S (units 2.0, is_support_course true, level_rank 90)."
            - "ACTIVE COREQUISITE CourseRequisite MATH-100 -> MATH-100S."
            - "Sections all PLANNED: secP (MATH-100, seat_capacity 5, meets 17:00-18:00), secS1 (MATH-100S, seat_capacity 2, meets 18:00-19:00), secS2 (MATH-100S, seat_capacity 3, meets 19:00-20:00), all term_code 2026FA."
            - "No PlacementRule has coreq_required == true, so nothing forces secP to be PAIRED."
            - "No Registration exists anywhere, which keeps the seat arithmetic pure capacity."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "admin-1"
            - call: "POST /courses"
              payload: { course_code: "MATH-100", title: "College Algebra", subject_area: "MATH", level_rank: 100, units: 4.0, is_support_course: false, transfer_level: true }
              as: SystemAdmin
              as_user_id: "admin-1"
              captures: { c_p: $.data.id }
            - call: "POST /courses"
              payload: { course_code: "MATH-100S", title: "Algebra Support", subject_area: "MATH", level_rank: 90, units: 2.0, is_support_course: true, transfer_level: false }
              as: SystemAdmin
              as_user_id: "admin-1"
              captures: { c_s: $.data.id }
            - call: "POST /course-requisites"
              payload: { course_id: "${c_p}", requisite_course_id: "${c_s}", requisite_type: "COREQUISITE", enforcement: "WARNING" }
              as: SystemAdmin
              as_user_id: "admin-1"
              captures: { req: $.data.id }
            - call: "POST /sections"
              payload: { course_id: "${c_p}", term_code: "2026FA", room_code: "R301", meets_start_at: "2026-09-01T17:00:00Z", meets_end_at: "2026-09-01T18:00:00Z", seat_capacity: 5 }
              as: Registrar
              as_user_id: "registrar-1"
              captures: { secP: $.data.id }
            - call: "POST /sections"
              payload: { course_id: "${c_s}", term_code: "2026FA", room_code: "R302", meets_start_at: "2026-09-01T18:00:00Z", meets_end_at: "2026-09-01T19:00:00Z", seat_capacity: 2 }
              as: Registrar
              as_user_id: "registrar-1"
              captures: { secS1: $.data.id }
            - call: "POST /sections"
              payload: { course_id: "${c_s}", term_code: "2026FA", room_code: "R303", meets_start_at: "2026-09-01T19:00:00Z", meets_end_at: "2026-09-01T20:00:00Z", seat_capacity: 3 }
              as: Registrar
              as_user_id: "registrar-1"
              captures: { secS2: $.data.id }
          trigger:
            - call: "POST /sections/${secP}/pair"
              payload: { support_section_id: "${secS1}" }
              as: Registrar
              as_user_id: "registrar-1"
              captures: { pair1: $.data.pairing_state, link1: $.data.linked_section_id, av1: $.data.available_seats, role1: $.data.role_in_pair }
            - call: "POST /sections/${secS1}/status"
              payload: { target_status: "CANCELLED" }
              as: Registrar
              as_user_id: "registrar-1"
              captures: { s1_status: $.data.status }
            - call: "GET /sections/${secP}"
              payload: {}
              as: Registrar
              as_user_id: "registrar-1"
              captures: { pair2: $.data.pairing_state, link2: $.data.linked_section_id, av2: $.data.available_seats, status2: $.data.status }
            - call: "POST /sections/${secP}/pair"
              payload: { support_section_id: "${secS2}" }
              as: Registrar
              as_user_id: "registrar-1"
              captures: { pair3: $.data.pairing_state, link3: $.data.linked_section_id, av3: $.data.available_seats }
            - call: "GET /sections/${secS2}"
              payload: {}
              as: Registrar
              as_user_id: "registrar-1"
              captures: { s2_pair: $.data.pairing_state, s2_role: $.data.role_in_pair, s2_link: $.data.linked_section_id, s2_av: $.data.available_seats }
          assert:
            - "${pair1} == \"PAIRED\" and ${role1} == \"PRIMARY\" and ${link1} == \"${secS1}\""
            - "${av1} == 2 — paired_conservative: min(5 - 0 - 0, 2 - 0 - 0)"
            - "${s1_status} == \"CANCELLED\" and Section.${secS1}.pairing_state == \"PAIR_BROKEN\""
            - "${pair2} == \"PAIR_BROKEN\" and ${status2} == \"PLANNED\" — the PRIMARY OPEN -> CLOSED hop does not fire because secP was never OPEN"
            - "${link2} == \"${secS1}\" — linked_section_id is RETAINED for audit while broken, pointing at a CANCELLED section"
            - "${av2} == 5 — the variant reverts to committed_only: max(0, 5 - 0)"
            - "${pair3} == \"PAIRED\" and ${link3} == \"${secS2}\" — PAIR_BROKEN -> PAIRED re-entry repoints the link"
            - "${av3} == 3 — paired_conservative against the new partner: min(5 - 0 - 0, 3 - 0 - 0)"
            - "${s2_pair} == \"PAIRED\" and ${s2_role} == \"SUPPORT\" and ${s2_link} == \"${secP}\" and ${s2_av} == 3"
            - "the seat sequence 2 -> 5 -> 3 is non-monotonic, which only a re-enterable pairing axis can produce"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: attempt_void_five_hop_cascade_to_waitlist_promotion
        grounds:
          - state_machines.TestAttempt.SCORED_to_VOIDED
          - state_machines.PlacementDetermination.VERIFIED_to_DISPUTED
          - state_machines.Registration.ENROLLED_to_DENIED
          - state_machines.Registration.WAITLISTED_to_ENROLLED
          - calculations.section_available_seats
          - entities.Student.fields.remaining_attempts
        distinguishing_aspect: |
          Depth-5 chain rooted at a single void, where each hop is CAUSED by the
          previous one: HOP 1 voids the attempt and hands back a retake credit;
          HOP 2 flips the sourcing determination's evidence axis to DISPUTED;
          HOP 3 denies that student's live registrations for the placed and
          corequisite courses; HOP 4 denies the cross-linked companion row and
          returns any consumed override; HOP 5 uses the seats released by HOPs
          3-4 to promote the waitlist, which itself re-runs the ENROLLED side
          effects and mints a NEW companion row on the support half. The chain
          therefore both destroys and creates Registrations in one request.
        test_recipe:
          setup:
            - "Logical clock left at its startup default 2026-08-01T00:00:00Z."
            - "Courses MATH-100 (units 4.0) and MATH-100S (units 2.0, is_support_course true); ACTIVE COREQUISITE MATH-100 -> MATH-100S."
            - "ACTIVE PlacementRule TEST_SCORE -> MATH-100 with coreq_required true and coreq_course_id MATH-100S (min_score 500, V1)."
            - "secP (MATH-100, seat_capacity 1) PAIRED with secS (MATH-100S, seat_capacity 5) while both are PLANNED, then both OPEN — secP must be PAIRED to open because an ACTIVE coreq_required rule targets MATH-100."
