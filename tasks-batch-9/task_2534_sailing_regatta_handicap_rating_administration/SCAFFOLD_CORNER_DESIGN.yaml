            - { call: "POST /regatta-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T15:00:00Z" }, as: ClubAdmin, as_user_id: "ops-desk-1" }
            - { call: "POST /regatta-ops/race-results", payload: { race_id: "${r1}", entry_id: "${e_a}", finish_status: "FINISHED", elapsed_seconds: 3900.0 }, as: RaceOfficer, as_user_id: "${m_pro}" }
            - { call: "POST /regatta-ops/protests", payload: { race_id: "${r1}", protestor_entry_id: "${e_a}", protestee_entry_id: "${e_b}", rule_cited: "RRS_10", incident_utc: "2026-08-05T14:30:00Z" }, as: Competitor, as_user_id: "${m_h1}", captures: { prt: $.data.id } }
          trigger:
            - { call: "POST /regatta-ops/protests/${prt}/invalidate", payload: {}, as: JuryChair, as_user_id: "${m_jc}" }
            - { call: "POST /regatta-ops/protests/${prt}/invalidate", payload: { reason_code: "OUT_OF_TIME" }, as: JuryChair, as_user_id: "${m_jc}" }
            - { call: "POST /regatta-ops/protests/${prt}/invalidate", payload: { reason_code: "NO_VALID_HAIL" }, as: JuryChair, as_user_id: "${m_jc}" }
            - { call: "POST /regatta-ops/protests/${prt}/schedule-hearing", payload: { jury_panel_id: "${pnl}", hearing_utc: "2026-08-05T18:00:00Z" }, as: JuryChair, as_user_id: "${m_jc}" }
            - { call: "POST /regatta-ops/protests/${prt}/reopen", payload: {}, as: JuryChair, as_user_id: "${m_jc}" }
            - { call: "GET /regatta-ops/protests/${prt}", payload: {}, as: JuryChair, as_user_id: "${m_jc}" }
          assert:
            - "trigger call 1 returns HTTP 422 with error_id ERR_INVALID_REQUEST: reason_code is a required input, and Protest.${prt}.status stays FILED"
            - "trigger call 2 returns HTTP 200 with Protest.${prt}.status == INVALID and invalid_reason_code == OUT_OF_TIME"
            - "trigger call 3 returns HTTP 409 with error_id ERR_INVALID_STATE, and invalid_reason_code is still OUT_OF_TIME, not NO_VALID_HAIL"
            - "trigger call 4 returns HTTP 409 with error_id ERR_INVALID_STATE: INVALID is terminal, so no hearing can be scheduled on it"
            - "trigger call 5 returns HTTP 409 with error_id ERR_INVALID_STATE: reopen is reachable only from DECIDED, and reopen_count stays 0"
            - "trigger call 6 returns HTTP 200 with status INVALID, decision NONE, jury_panel_id null, hearing_utc null and evidence_count 0"
            - "Regatta.${reg}.status is still RACING: final_race_count is 0 against planned_race_count 6, so closing the last open protest bubbles nothing"

  # =========================================================================
  # From Table 6 (Errors)
  # =========================================================================
  # Every error id of section 1.6 must be triggerable. The ids already driven by the
  # sections above and by SCAFFOLD_DIFFICULTY_DESIGN.yaml are not repeated here; the
  # instances below close the remaining gaps, and the OCC 412s are closed in the
  # complexity_layers section.
  - section: errors
    instances:

      - name: entry_certificate_not_covering_series_start_returns_certificate_expired
        claim_type: error_triggerable
        grounds:
          - errors[ERR_CERTIFICATE_EXPIRED]
          - validations[priority 26 ERR_CERTIFICATE_EXPIRED]
          - entities.Regatta.fields.series_start_utc
        distinguishing_aspect: |
          Coverage is judged against Regatta.series_start_utc with BOTH bounds inclusive: a
          certificate whose valid_from is 2026-08-06 (one day after the series start) and one whose
          valid_until is 2026-08-04T23:59:59Z (one second before it) are each 422
          ERR_CERTIFICATE_EXPIRED, while a certificate whose valid_until is exactly
          2026-08-05T00:00:00Z is accepted.
        test_recipe:
          setup:
            - "A regatta with series_start_utc 2026-08-05T00:00:00Z and the notice of race published."
            - "Three MONOHULL boats with DRAFT certificates: A valid 2026-08-06 to 2026-12-31, B valid 2026-08-04 to exactly 2026-08-05T00:00:00Z, and C valid 2026-01-01 to 2026-08-04T23:59:59Z."
          setup_api_calls:
            - { call: "POST /regatta-ops/club-members", payload: { full_name: "Piers Holt", email: "piers.holt@yc.test" }, as: ClubAdmin, as_user_id: "ops-desk-1", captures: { m_ch: $.data.id } }
