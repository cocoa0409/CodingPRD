              as: ProcurementOfficer
              as_user_id: "U-OFFICER-1"
              captures: { c_s51_id: $.data.id }
            - call: "POST /procurement/solicitations/${c_s51_id}/issue"
              payload: {}
              as: ProcurementOfficer
