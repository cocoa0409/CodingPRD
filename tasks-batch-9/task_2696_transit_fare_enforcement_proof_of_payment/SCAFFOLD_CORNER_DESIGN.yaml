      - name: citation_two_dimension_parallel_shape
        claim_type: parallel
        excluded_because:
          difficulty_instance: citation_adjudication_and_settlement_dimensions_advance_independently
          rationale: "The parallel state_machine_shape claim — that Citation's adjudication_status and settlement_status advance independently and combine correctly — is exactly what the §1.8 non_linear_state_machine instance drives (CONTESTED x PLAN_ACTIVE, then REDUCED x PLAN_ACTIVE), including the version accounting across both dimensions."

      - name: appeal_supplement_loop_returns_to_submitted
        claim_type: cyclic
        excluded_because:
          difficulty_instance: appeal_supplement_cycle_returns_to_submitted_with_round_index_two
          rationale: "The cyclic-shape claim (entity loops back and the loop's termination condition APPEAL_MAX_ROUNDS is respected) is fully asserted by that §1.8 instance, which walks SUBMITTED -> SUPPLEMENT_REQUESTED -> SUBMITTED and then proves the second request-supplement is refused at round_index 2."

      - name: zone_revisits_designated_through_pending_signage
        claim_type: valid_transition
        excluded_because:
          difficulty_instance: fare_zone_returns_from_suspended_to_designated_through_pending_signage
          rationale: "The SUSPENDED -> PENDING_SIGNAGE -> DESIGNATED re-entry path, the only non-forward transition pair in the FareZone machine, is walked end-to-end by that §1.8 instance including the second designated_at stamp."

      - name: signage_deficiency_cascade_down_to_children
        claim_type: cascade_down
        excluded_because:
          difficulty_instance: signage_audit_deficiency_cascades_three_links_to_pending_encounter_void
          rationale: "The cascade-down side-effect pattern (parent change reaches children, only non-terminal children affected) is asserted three links deep by that §1.8 instance: audit -> zone SUSPENDED -> deployment VOIDED -> PENDING encounter VOIDED, with an already-terminal encounter left alone."

      - name: appeal_grant_ledger_sync_to_citation_balance
        claim_type: ledger_sync
        excluded_because:
          difficulty_instance: appeal_grant_cascades_four_links_to_dismissal_reversal_ledger_row
          rationale: "The ledger-sync pattern (a state change updates an ancestor's derived money field and the before/after reconciles) is asserted by that §1.8 instance, which follows an appeal GRANTED through dismissal, WRITTEN_OFF, plan cancellation and the DISMISSAL_REVERSAL ledger row that drives amount_paid_cents to 0."

      - name: dismissal_compensation_leaves_no_money_drift
        claim_type: compensation
        excluded_because:
          difficulty_instance: citation_money_identity_survives_direct_payment_service_credit_and_dismissal_reversal
          rationale: "The compensation pattern (undo transition reverses the original side effects with no drift) is asserted by that §1.8 compensating_invariant instance, which checks the signed ledger sum against amount_paid_cents across a direct payment, a service credit and the reversal."

      - name: activation_guarded_by_zone_designation
        claim_type: guarded_transitions
        excluded_because:
          difficulty_instance: deployment_activation_depends_on_fare_zone_designation_state
          rationale: "The guarded-transition claim (A -> B only if a different entity C is in state X) is asserted for the only cross-entity guard in the deployment machine by that §1.8 cross_entity_state_dependency instance, which tests activate against a PENDING_SIGNAGE zone, a SUSPENDED zone and a DESIGNATED zone."

