  - section: validations
    instances:
      - name: missing_auth_header_returns_400
        claim_type: violation_to_error
        grounds: ['validations[priority=1]', 'errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]']
        distinguishing_aspect: "Requests without X-User-ID/X-User-Role fail priority 1 before anything else."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /psm/units", as: PsmManager, captures: { err: $.data.error_id } }
          assert: ["with headers omitted: error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http 400"]

      - name: unit_create_forbidden_for_requester_role
        claim_type: violation_to_error
        grounds: ['validations[priority=2]', 'errors[ERR_INSUFFICIENT_PERMISSIONS]']
        distinguishing_aspect: "Requester lacks POST /psm/units; role check fires even with a valid payload."
