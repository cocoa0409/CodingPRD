# =============================================================================
# §1.9 Scaffold Corner Design — task 1952 rental reimbursement & loss-of-use
# Enumerative breadth coverage of every testable claim in §1.1–§1.7 that §1.8
# does not already cover. Sections/claim_types follow references/
# claim-extraction-guide.md. Stubs mark corners already asserted inside a
# §1.8 difficulty instance. All chains replay from empty-DB; logical clock
# default is 2026-08-01T00:00:00Z unless a chain sets it.
# =============================================================================
scaffold_corner_design:
  # ============================================================ 1. Entities
  - section: entities
    instances:
      - name: claim_creation_applies_computed_defaults
        claim_type: creation
        grounds: [entities.Claim.fields.rental_reserve_cents, entities.Claim.fields.rental_track_status, entities.Claim.fields.overall_status, calculations.rental_reserve_reconciliation]
        distinguishing_aspect: "POST /claims initializes computed/system fields server-side: reserve = limit x cap, aggregates zeroed, three status dimensions at OPEN/OPEN/NONE."
        test_recipe:
          setup: ["Policy holder POL-100 exists"]
          setup_api_calls:
            - { call: "POST /policyholders", payload: { full_name: "Pat Holder", policy_number: "POL-100", contact_email: "pat@x.com" }, as: SystemAdmin, captures: { ph_id: $.data.id } }
          trigger:
            - { call: "POST /claims", payload: { policyholder_id: "${ph_id}", incident_date: "2026-07-28", coverage_daily_limit_cents: 6000, coverage_duration_cap_days: 20, loss_of_use_per_diem_cents: 3500 }, as: ClaimsAdjuster, captures: { cl_id: $.data.id, reserve: $.data.rental_reserve_cents } }
          assert:
            - "Claim.rental_reserve_cents == 120000 (6000 x 20) without any client input"
            - "Claim.authorized_days_total == 0 and recovery_balance_cents == 0"
            - "Claim.rental_track_status == OPEN, loss_of_use_track_status == NONE, overall_status == OPEN, version == 1"

      - name: claim_missing_required_field_rejected
        claim_type: required_fields
        grounds: [entities.Claim.fields.coverage_daily_limit_cents, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting the required input coverage_daily_limit_cents is a 400 ERR_INVALID_REQUEST before any business check runs."
        test_recipe:
          setup: ["Policy holder POL-100 exists"]
          setup_api_calls:
            - { call: "POST /policyholders", payload: { full_name: "Pat Holder", policy_number: "POL-100", contact_email: "pat@x.com" }, as: SystemAdmin, captures: { ph_id: $.data.id } }
          trigger:
            - { call: "POST /claims", payload: { policyholder_id: "${ph_id}", incident_date: "2026-07-28", coverage_duration_cap_days: 20, loss_of_use_per_diem_cents: 3500 }, as: ClaimsAdjuster, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST and http status == 400"

      - name: reservation_invalid_enum_rejected
        claim_type: type_constraints
        grounds: [entities.RentalReservation.fields.vehicle_class, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "vehicle_class outside {ECONOMY, STANDARD, PREMIUM} is rejected as ERR_INVALID_REQUEST at creation."
        test_recipe:
          setup: ["Verified claim with APPROVED repair order and ACTIVE partner"]
          setup_api_calls:
            - { call: "POST /policyholders", payload: { full_name: "Pat Holder", policy_number: "POL-100", contact_email: "pat@x.com" }, as: SystemAdmin, captures: { ph_id: $.data.id } }
            - { call: "POST /repair-shops", payload: { shop_name: "Ace Auto Body", shop_code: "SHOP-1" }, as: SystemAdmin, captures: { shop_id: $.data.id } }
            - { call: "POST /rental-partners", payload: { partner_name: "RentCo", partner_code: "RC-1", economy_rate_cents: 4500, standard_rate_cents: 6000, premium_rate_cents: 9000, economy_capacity: 2, standard_capacity: 1, premium_capacity: 1 }, as: SystemAdmin, captures: { rp_id: $.data.id } }
            - { call: "POST /claims", payload: { policyholder_id: "${ph_id}", incident_date: "2026-07-28", coverage_daily_limit_cents: 6000, coverage_duration_cap_days: 20, loss_of_use_per_diem_cents: 3500 }, as: ClaimsAdjuster, captures: { cl_id: $.data.id, cl_v: $.data.version } }
            - { call: "POST /coverage-verifications", payload: { claim_id: "${cl_id}", expected_claim_version: "${cl_v}" }, as: ClaimsAdjuster, captures: { cv_id: $.data.id } }
            - { call: "POST /coverage-verifications/${cv_id}/decide", payload: { decision: "VERIFIED", rental_eligible: true, loss_of_use_eligible: true }, as: ClaimsAdjuster }
            - { call: "POST /repair-orders", payload: { claim_id: "${cl_id}", estimated_completion_date: "2026-08-14", labor_hours_estimate: 12 }, as: RepairShop, as_user_id: "${shop_id}", captures: { ro_id: $.data.id } }
            - { call: "POST /repair-orders/${ro_id}/approve", payload: {}, as: ClaimsAdjuster }
            - { call: "GET /claims/${cl_id}", payload: {}, as: ClaimsAdjuster, captures: { cl_v3: $.data.version } }
          trigger:
            - { call: "POST /rental-reservations", payload: { claim_id: "${cl_id}", rental_partner_id: "${rp_id}", repair_order_id: "${ro_id}", vehicle_class: "LUXURY", pickup_date: "2026-08-05", authorized_return_date: "2026-08-15", expected_claim_version: "${cl_v3}" }, as: RentalDeskAgent, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST"

      - name: get_claim_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_CLAIM_NOT_FOUND]", "validations[priority=3]"]
        distinguishing_aspect: "Reading a random UUID that was never registered returns ERR_CLAIM_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /claims/00000000-0000-0000-0000-000000000000", payload: {}, as: ClaimsAdjuster, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_CLAIM_NOT_FOUND and http status == 404"

      - name: milestone_immutable_record_has_no_version
        claim_type: immutability
        grounds: [entities.RepairMilestone]
        distinguishing_aspect: "RepairMilestone is common_fields:false — its creation response carries id and created_at but no version/updated_at, and no update endpoint exists."
        test_recipe:
          setup: ["Repair order IN_PROGRESS on a verified claim (no reservation needed)"]
          setup_api_calls:
            - { call: "POST /policyholders", payload: { full_name: "Pat Holder", policy_number: "POL-100", contact_email: "pat@x.com" }, as: SystemAdmin, captures: { ph_id: $.data.id } }
            - { call: "POST /repair-shops", payload: { shop_name: "Ace Auto Body", shop_code: "SHOP-1" }, as: SystemAdmin, captures: { shop_id: $.data.id } }
            - { call: "POST /claims", payload: { policyholder_id: "${ph_id}", incident_date: "2026-07-28", coverage_daily_limit_cents: 6000, coverage_duration_cap_days: 20, loss_of_use_per_diem_cents: 3500 }, as: ClaimsAdjuster, captures: { cl_id: $.data.id } }
            - { call: "POST /repair-orders", payload: { claim_id: "${cl_id}", estimated_completion_date: "2026-08-14", labor_hours_estimate: 12 }, as: RepairShop, as_user_id: "${shop_id}", captures: { ro_id: $.data.id } }
            - { call: "POST /repair-orders/${ro_id}/approve", payload: {}, as: ClaimsAdjuster }
            - { call: "POST /repair-orders/${ro_id}/start", payload: {}, as: RepairShop, as_user_id: "${shop_id}" }
          trigger:
            - { call: "POST /repair-orders/${ro_id}/milestones", payload: { milestone_type: "PARTS_DELAYED", note: "bumper on backorder" }, as: RepairShop, as_user_id: "${shop_id}", captures: { ms_id: $.data.id, ms_reported: $.data.reported_at } }
          assert:
            - "Response contains id and created_at/reported_at but no version and no updated_at field"
            - "RepairMilestone.reported_at == 2026-08-01T00:00:00Z (logical clock default — no set_current_utc call was made)"

      - name: policyholder_claims_list_paginates
        claim_type: listing
        grounds: [response_envelope, entities.Claim.fields.policyholder_id]
        distinguishing_aspect: "limit/offset/has_more/total_count behave per the fixed envelope: 3 claims, page of 2 -> has_more true; offset 2 -> 1 item, has_more false."
        test_recipe:
          setup: ["Policy holder with 3 claims"]
          setup_api_calls:
            - { call: "POST /policyholders", payload: { full_name: "Pat Holder", policy_number: "POL-100", contact_email: "pat@x.com" }, as: SystemAdmin, captures: { ph_id: $.data.id } }
            - { call: "POST /claims", payload: { policyholder_id: "${ph_id}", incident_date: "2026-07-01", coverage_daily_limit_cents: 6000, coverage_duration_cap_days: 20, loss_of_use_per_diem_cents: 3500 }, as: ClaimsAdjuster }
            - { call: "POST /claims", payload: { policyholder_id: "${ph_id}", incident_date: "2026-07-02", coverage_daily_limit_cents: 6000, coverage_duration_cap_days: 20, loss_of_use_per_diem_cents: 3500 }, as: ClaimsAdjuster }
            - { call: "POST /claims", payload: { policyholder_id: "${ph_id}", incident_date: "2026-07-03", coverage_daily_limit_cents: 6000, coverage_duration_cap_days: 20, loss_of_use_per_diem_cents: 3500 }, as: ClaimsAdjuster }
          trigger:
            - { call: "GET /policyholders/${ph_id}/claims?limit=2&offset=0", payload: {}, as: ClaimsAdjuster }
            - { call: "GET /policyholders/${ph_id}/claims?limit=2&offset=2", payload: {}, as: ClaimsAdjuster }
          assert:
            - "Page 1: total_count == 3, has_more == true, 2 items returned"
            - "Page 2 (offset 2): has_more == false, exactly 1 item returned"

      - name: reservation_create_body_fk_not_found
        claim_type: parent_relationships
        grounds: ["validations[priority=4]", "errors[ERR_CLAIM_NOT_FOUND]"]
        distinguishing_aspect: "A body-referenced claim_id that does not exist yields ERR_CLAIM_NOT_FOUND (404) — body FK existence is validated like path existence."
        test_recipe:
          setup: ["Partner, shop, and one real claim registered (the real claim only supplies a well-formed version token); the reservation targets a bogus claim_id"]
          setup_api_calls:
            - { call: "POST /repair-shops", payload: { shop_name: "Ace Auto Body", shop_code: "SHOP-1" }, as: SystemAdmin }
            - { call: "POST /rental-partners", payload: { partner_name: "RentCo", partner_code: "RC-1", economy_rate_cents: 4500, standard_rate_cents: 6000, premium_rate_cents: 9000, economy_capacity: 2, standard_capacity: 1, premium_capacity: 1 }, as: SystemAdmin, captures: { rp_id: $.data.id } }
            - { call: "POST /policyholders", payload: { full_name: "Pat Holder", policy_number: "POL-100", contact_email: "pat@x.com" }, as: SystemAdmin, captures: { ph_id: $.data.id } }
            - { call: "POST /claims", payload: { policyholder_id: "${ph_id}", incident_date: "2026-07-28", coverage_daily_limit_cents: 6000, coverage_duration_cap_days: 20, loss_of_use_per_diem_cents: 3500 }, as: ClaimsAdjuster, captures: { cl_v: $.data.version } }
          trigger:
            - { call: "POST /rental-reservations", payload: { claim_id: "00000000-0000-0000-0000-000000000000", rental_partner_id: "${rp_id}", repair_order_id: "00000000-0000-0000-0000-000000000000", vehicle_class: "STANDARD", pickup_date: "2026-08-05", authorized_return_date: "2026-08-15", expected_claim_version: "${cl_v}" }, as: RentalDeskAgent, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_CLAIM_NOT_FOUND and http status == 404"

      - name: partner_created_with_active_default
        claim_type: defaults
        grounds: [entities.RentalPartner.fields.status]
        distinguishing_aspect: "RentalPartner.status defaults to ACTIVE at creation (suspend is a separate explicit action)."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /rental-partners", payload: { partner_name: "RentCo", partner_code: "RC-1", economy_rate_cents: 4500, standard_rate_cents: 6000, premium_rate_cents: 9000, economy_capacity: 2, standard_capacity: 1, premium_capacity: 1 }, as: SystemAdmin, captures: { rp_status: $.data.status } }
          assert:
            - "RentalPartner.status == ACTIVE"

  # ====================================================== 2. State Machines
  - section: state_machines
    instances:
      - name: reservation_create_initial_state_and_snapshot
        claim_type: initial_state
        grounds: [state_machines.RentalReservation, entities.RentalReservation.fields.rate_card_snapshot]
        distinguishing_aspect: "A created reservation starts DRAFT with the partner rate card snapshotted and provisional estimate computed (10 days x 6000 = 60000)."
        test_recipe:
          setup: ["Verified claim with APPROVED repair order, ACTIVE partner"]
          setup_api_calls:
            - { call: "POST /policyholders", payload: { full_name: "Pat Holder", policy_number: "POL-100", contact_email: "pat@x.com" }, as: SystemAdmin, captures: { ph_id: $.data.id } }
            - { call: "POST /repair-shops", payload: { shop_name: "Ace Auto Body", shop_code: "SHOP-1" }, as: SystemAdmin, captures: { shop_id: $.data.id } }
            - { call: "POST /rental-partners", payload: { partner_name: "RentCo", partner_code: "RC-1", economy_rate_cents: 4500, standard_rate_cents: 6000, premium_rate_cents: 9000, economy_capacity: 2, standard_capacity: 1, premium_capacity: 1 }, as: SystemAdmin, captures: { rp_id: $.data.id } }
            - { call: "POST /claims", payload: { policyholder_id: "${ph_id}", incident_date: "2026-07-28", coverage_daily_limit_cents: 6000, coverage_duration_cap_days: 20, loss_of_use_per_diem_cents: 3500 }, as: ClaimsAdjuster, captures: { cl_id: $.data.id, cl_v: $.data.version } }
            - { call: "POST /coverage-verifications", payload: { claim_id: "${cl_id}", expected_claim_version: "${cl_v}" }, as: ClaimsAdjuster, captures: { cv_id: $.data.id } }
            - { call: "POST /coverage-verifications/${cv_id}/decide", payload: { decision: "VERIFIED", rental_eligible: true, loss_of_use_eligible: true }, as: ClaimsAdjuster }
            - { call: "POST /repair-orders", payload: { claim_id: "${cl_id}", estimated_completion_date: "2026-08-14", labor_hours_estimate: 12 }, as: RepairShop, as_user_id: "${shop_id}", captures: { ro_id: $.data.id } }
            - { call: "POST /repair-orders/${ro_id}/approve", payload: {}, as: ClaimsAdjuster }
            - { call: "GET /claims/${cl_id}", payload: {}, as: ClaimsAdjuster, captures: { cl_v3: $.data.version } }
          trigger:
            - { call: "POST /rental-reservations", payload: { claim_id: "${cl_id}", rental_partner_id: "${rp_id}", repair_order_id: "${ro_id}", vehicle_class: "STANDARD", pickup_date: "2026-08-05", authorized_return_date: "2026-08-15", expected_claim_version: "${cl_v3}" }, as: RentalDeskAgent, captures: { st: $.data.status, days: $.data.authorized_days, rate: $.data.daily_rate_cents, est: $.data.estimated_charge_cents } }
          assert:
            - "Reservation.status == DRAFT (initial state)"
            - "authorized_days == 10, daily_rate_cents == 6000 (snapshot of STANDARD rate), estimated_charge_cents == 60000"

      - name: authorize_twice_rejected
        claim_type: idempotency
        grounds: [state_machines.RentalReservation.DRAFT_to_AUTHORIZED, "errors[ERR_RESERVATION_INVALID_STATE]"]
        distinguishing_aspect: "Repeating the authorize trigger on an AUTHORIZED reservation fails with ERR_RESERVATION_INVALID_STATE and must not double-debit the reserve."
        test_recipe:
          setup: ["Reservation AUTHORIZED (reserve 60000 after first authorize)"]
          setup_api_calls:
            - { call: "POST /policyholders", payload: { full_name: "Pat Holder", policy_number: "POL-100", contact_email: "pat@x.com" }, as: SystemAdmin, captures: { ph_id: $.data.id } }
            - { call: "POST /repair-shops", payload: { shop_name: "Ace Auto Body", shop_code: "SHOP-1" }, as: SystemAdmin, captures: { shop_id: $.data.id } }
            - { call: "POST /rental-partners", payload: { partner_name: "RentCo", partner_code: "RC-1", economy_rate_cents: 4500, standard_rate_cents: 6000, premium_rate_cents: 9000, economy_capacity: 2, standard_capacity: 1, premium_capacity: 1 }, as: SystemAdmin, captures: { rp_id: $.data.id } }
            - { call: "POST /claims", payload: { policyholder_id: "${ph_id}", incident_date: "2026-07-28", coverage_daily_limit_cents: 6000, coverage_duration_cap_days: 20, loss_of_use_per_diem_cents: 3500 }, as: ClaimsAdjuster, captures: { cl_id: $.data.id, cl_v: $.data.version } }
            - { call: "POST /coverage-verifications", payload: { claim_id: "${cl_id}", expected_claim_version: "${cl_v}" }, as: ClaimsAdjuster, captures: { cv_id: $.data.id } }
            - { call: "POST /coverage-verifications/${cv_id}/decide", payload: { decision: "VERIFIED", rental_eligible: true, loss_of_use_eligible: true }, as: ClaimsAdjuster }
            - { call: "POST /repair-orders", payload: { claim_id: "${cl_id}", estimated_completion_date: "2026-08-14", labor_hours_estimate: 12 }, as: RepairShop, as_user_id: "${shop_id}", captures: { ro_id: $.data.id } }
            - { call: "POST /repair-orders/${ro_id}/approve", payload: {}, as: ClaimsAdjuster }
            - { call: "GET /claims/${cl_id}", payload: {}, as: ClaimsAdjuster, captures: { cl_v3: $.data.version } }
            - { call: "POST /rental-reservations", payload: { claim_id: "${cl_id}", rental_partner_id: "${rp_id}", repair_order_id: "${ro_id}", vehicle_class: "STANDARD", pickup_date: "2026-08-05", authorized_return_date: "2026-08-15", expected_claim_version: "${cl_v3}" }, as: RentalDeskAgent, captures: { res_id: $.data.id } }
            - { call: "POST /rental-reservations/${res_id}/authorize", payload: {}, as: RentalDeskAgent }
          trigger:
            - { call: "POST /rental-reservations/${res_id}/authorize", payload: {}, as: RentalDeskAgent, captures: { err: $.data.error_id } }
            - { call: "GET /claims/${cl_id}", payload: {}, as: ClaimsAdjuster, captures: { reserve: $.data.rental_reserve_cents } }
          assert:
            - "error_id == ERR_RESERVATION_INVALID_STATE"
            - "Claim.rental_reserve_cents == 60000 (single debit — no double-application of the side effect)"

      - name: cancel_from_terminal_state_rejected
        claim_type: terminal_state_lockdown
        grounds: [state_machines.RentalReservation, "errors[ERR_RESERVATION_INVALID_STATE]"]
        distinguishing_aspect: "CANCELLED is terminal: a second cancel on the same reservation fails with ERR_RESERVATION_INVALID_STATE."
        test_recipe:
          setup: ["Reservation created (DRAFT) then cancelled"]
          setup_api_calls:
            - { call: "POST /policyholders", payload: { full_name: "Pat Holder", policy_number: "POL-100", contact_email: "pat@x.com" }, as: SystemAdmin, captures: { ph_id: $.data.id } }
            - { call: "POST /repair-shops", payload: { shop_name: "Ace Auto Body", shop_code: "SHOP-1" }, as: SystemAdmin, captures: { shop_id: $.data.id } }
            - { call: "POST /rental-partners", payload: { partner_name: "RentCo", partner_code: "RC-1", economy_rate_cents: 4500, standard_rate_cents: 6000, premium_rate_cents: 9000, economy_capacity: 2, standard_capacity: 1, premium_capacity: 1 }, as: SystemAdmin, captures: { rp_id: $.data.id } }
            - { call: "POST /claims", payload: { policyholder_id: "${ph_id}", incident_date: "2026-07-28", coverage_daily_limit_cents: 6000, coverage_duration_cap_days: 20, loss_of_use_per_diem_cents: 3500 }, as: ClaimsAdjuster, captures: { cl_id: $.data.id, cl_v: $.data.version } }
            - { call: "POST /coverage-verifications", payload: { claim_id: "${cl_id}", expected_claim_version: "${cl_v}" }, as: ClaimsAdjuster, captures: { cv_id: $.data.id } }
            - { call: "POST /coverage-verifications/${cv_id}/decide", payload: { decision: "VERIFIED", rental_eligible: true, loss_of_use_eligible: true }, as: ClaimsAdjuster }
            - { call: "POST /repair-orders", payload: { claim_id: "${cl_id}", estimated_completion_date: "2026-08-14", labor_hours_estimate: 12 }, as: RepairShop, as_user_id: "${shop_id}", captures: { ro_id: $.data.id } }
            - { call: "POST /repair-orders/${ro_id}/approve", payload: {}, as: ClaimsAdjuster }
            - { call: "GET /claims/${cl_id}", payload: {}, as: ClaimsAdjuster, captures: { cl_v3: $.data.version } }
            - { call: "POST /rental-reservations", payload: { claim_id: "${cl_id}", rental_partner_id: "${rp_id}", repair_order_id: "${ro_id}", vehicle_class: "STANDARD", pickup_date: "2026-08-05", authorized_return_date: "2026-08-15", expected_claim_version: "${cl_v3}" }, as: RentalDeskAgent, captures: { res_id: $.data.id } }
            - { call: "POST /rental-reservations/${res_id}/cancel", payload: {}, as: RentalDeskAgent }
          trigger:
            - { call: "POST /rental-reservations/${res_id}/cancel", payload: {}, as: RentalDeskAgent, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_RESERVATION_INVALID_STATE (terminal CANCELLED lockdown)"

      - name: verification_decide_twice_rejected
        claim_type: invalid_transition
        grounds: [state_machines.CoverageVerification, "errors[ERR_VERIFICATION_ALREADY_DECIDED]"]
        distinguishing_aspect: "decide on an already-VERIFIED verification fails with ERR_VERIFICATION_ALREADY_DECIDED."
        test_recipe:
          setup: ["Verification created and decided VERIFIED"]
          setup_api_calls:
            - { call: "POST /policyholders", payload: { full_name: "Pat Holder", policy_number: "POL-100", contact_email: "pat@x.com" }, as: SystemAdmin, captures: { ph_id: $.data.id } }
            - { call: "POST /claims", payload: { policyholder_id: "${ph_id}", incident_date: "2026-07-28", coverage_daily_limit_cents: 6000, coverage_duration_cap_days: 20, loss_of_use_per_diem_cents: 3500 }, as: ClaimsAdjuster, captures: { cl_id: $.data.id, cl_v: $.data.version } }
            - { call: "POST /coverage-verifications", payload: { claim_id: "${cl_id}", expected_claim_version: "${cl_v}" }, as: ClaimsAdjuster, captures: { cv_id: $.data.id } }
            - { call: "POST /coverage-verifications/${cv_id}/decide", payload: { decision: "VERIFIED", rental_eligible: true, loss_of_use_eligible: true }, as: ClaimsAdjuster }
          trigger:
            - { call: "POST /coverage-verifications/${cv_id}/decide", payload: { decision: "DENIED", denial_reason: "late" }, as: ClaimsAdjuster, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_VERIFICATION_ALREADY_DECIDED"

      - name: repair_order_complete_from_approved_rejected
        claim_type: invalid_transition
        grounds: [state_machines.RepairOrder, "errors[ERR_REPAIR_ORDER_INVALID_STATE]"]
        distinguishing_aspect: "complete requires IN_PROGRESS; calling it from APPROVED (skipping start) fails with ERR_REPAIR_ORDER_INVALID_STATE."
        test_recipe:
          setup: ["Repair order APPROVED (not started)"]
          setup_api_calls:
            - { call: "POST /policyholders", payload: { full_name: "Pat Holder", policy_number: "POL-100", contact_email: "pat@x.com" }, as: SystemAdmin, captures: { ph_id: $.data.id } }
            - { call: "POST /repair-shops", payload: { shop_name: "Ace Auto Body", shop_code: "SHOP-1" }, as: SystemAdmin, captures: { shop_id: $.data.id } }
            - { call: "POST /claims", payload: { policyholder_id: "${ph_id}", incident_date: "2026-07-28", coverage_daily_limit_cents: 6000, coverage_duration_cap_days: 20, loss_of_use_per_diem_cents: 3500 }, as: ClaimsAdjuster, captures: { cl_id: $.data.id } }
            - { call: "POST /repair-orders", payload: { claim_id: "${cl_id}", estimated_completion_date: "2026-08-14", labor_hours_estimate: 12 }, as: RepairShop, as_user_id: "${shop_id}", captures: { ro_id: $.data.id } }
            - { call: "POST /repair-orders/${ro_id}/approve", payload: {}, as: ClaimsAdjuster }
          trigger:
            - { call: "POST /repair-orders/${ro_id}/complete", payload: {}, as: RepairShop, as_user_id: "${shop_id}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_REPAIR_ORDER_INVALID_STATE"

      - name: lou_pay_before_approve_rejected
        claim_type: invalid_transition
        grounds: [state_machines.LossOfUseClaim, "errors[ERR_LOU_INVALID_STATE]"]
        distinguishing_aspect: "pay requires APPROVED; paying a SUBMITTED loss-of-use claim fails with ERR_LOU_INVALID_STATE."
        test_recipe:
