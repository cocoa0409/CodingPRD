              payload: { name: "Eligible Freight", account_type: "SINGLE_LOCATION", home_location_id: "${loc_id}", billing_mode: "DIRECT" }
              as: DealerAdmin
              captures: { fleet_id: $.data.id }
            - call: "POST /casings"
              payload: { fleet_account_id: "${fleet_id}", casing_serial: "CS-4039", brand: "Bridgestone", casing_spec_code: "ANY", intended_position: "DRIVE", scrap_weight_lbs: 135 }
              as: DealerAdmin
              captures: { casing_id: $.data.id }
            - call: "POST /casings/${casing_id}/collect"
              payload: { collected_at_location_id: "${loc_id}" }
              as: TireTechnician
            - call: "POST /service-locations/${loc_id}/scrap-manifests"
              payload: { hauler_permit_number: "HP-4039", hauler_capacity_lbs: 1000 }
              as: ComplianceOfficer
              as_user_id: "officer-signer"
              captures: { man_id: $.data.id }
          trigger:
            - call: "POST /scrap-manifests/${man_id}/sign"
              payload: { signed_at: "2026-08-30T09:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "officer-signer"
              captures: { e1: $.data.error_id }
            - call: "POST /scrap-manifests/${man_id}/lines"
              payload: { casing_id: "${casing_id}" }
              as: ComplianceOfficer
              as_user_id: "officer-signer"
              captures: { e2: $.data.error_id }
          assert:
            - "signing the empty manifest returns 422 with data.error_id == \"ERR_MANIFEST_EMPTY\""
            - "adding the merely COLLECTED casing returns 422 with data.error_id == \"ERR_CASING_NOT_SCRAP_ELIGIBLE\""
            - "the manifest is still DRAFT with tire_count == 0 and total_weight_lbs == 0"
            - "Casing.${casing_id}.status is still \"COLLECTED\" and scrap_manifest_id is still null"

      - name: state_and_concurrency_error_index
        claim_type: error_triggerable
        grounds:
          - errors.ERR_CASING_INVALID_STATE
          - errors.ERR_STALE_CASING_VERSION
          - errors.ERR_RETREAD_SLOT_CONFLICT
          - errors.ERR_AGREEMENT_WINDOW_OVERLAP
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / retread_reschedule_depends_on_casing_state
          rationale: "The state-machine 409s, the OCC 412s and both temporal-overlap 409s are each triggered by named §1.8 instances (retread_reschedule_depends_on_casing_state, retread_line_half_open_slots_with_asymmetric_cooldown_buffer and agreement_windows_closed_inclusive_touching_endpoints_conflict), so repeating them here would duplicate assertions."

  # -------------------------------------------------------------------
  - section: rbac
    instances:

      - name: billing_clerk_cannot_create_fleet_account_or_set_clock
        claim_type: exclusive_operations
        grounds:
          - roles.DealerAdmin.exclusive_operations
          - validations.priority_2_auth
          - errors.ERR_UNAUTHORIZED
        distinguishing_aspect: "DealerAdmin's exclusive operations are exclusive against every other role, including the test-driving clock endpoint: a BillingClerk and a PlantScheduler each get 403 ERR_UNAUTHORIZED, and the refusal happens before any body validation, so even a malformed body still yields 403 rather than 400."
        test_recipe:
          setup: ["one location so a well-formed fleet-account body exists"]
          setup_api_calls:
            - call: "POST /service-locations"
              payload: { name: "Rbac Commercial", location_code: "RBC", state_code: "OH", road_service_response_minutes_committed: 120, scrap_permit_number: "OH-SCRAP-4040", scrap_permit_expires_on: "2027-06-30" }
              as: DealerAdmin
              captures: { loc_id: $.data.id }
          trigger:
            - call: "POST /fleet-accounts"
              payload: { name: "Sneaky Freight", account_type: "SINGLE_LOCATION", home_location_id: "${loc_id}", billing_mode: "DIRECT" }
              as: BillingClerk
              captures: { e1: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-01-01T00:00:00Z" }
              as: PlantScheduler
              captures: { e2: $.data.error_id }
            - call: "POST /fleet-accounts"
              payload: { name: "Sneaky Freight Two", account_type: "NOT_A_TYPE", home_location_id: "${loc_id}", billing_mode: "DIRECT" }
              as: BillingClerk
              captures: { e3: $.data.error_id }
          assert:
            - "both exclusive-operation attempts return 403 with data.error_id == \"ERR_UNAUTHORIZED\""
            - "the malformed-body attempt also returns 403 ERR_UNAUTHORIZED, not 400 — priority 2 precedes priority 6"
            - "GET /fleet-accounts as DealerAdmin returns total_count == 0"
            - "the logical clock is still at its default 2026-08-01T00:00:00Z, so the refused clock call had no effect"

      - name: casing_read_is_shared_across_all_six_reader_roles
        claim_type: shared_operations
        grounds:
          - endpoints.GET_/casings/{casing_id}
          - roles.FleetManager.identity
          - roles.TireTechnician.identity
        distinguishing_aspect: "One read endpoint is legitimately shared by six roles with three different identity models: two opaque-identity roles, two more opaque compliance/production roles, an entity_backed FleetManager whose X-User-ID is the FleetAccount id, and an entity_backed TireTechnician whose X-User-ID is a Technician id. All six must get the identical payload."
        test_recipe:
          setup: ["one fleet, one technician, one casing"]
          setup_api_calls:
            - call: "POST /service-locations"
              payload: { name: "Shared Commercial", location_code: "SHC", state_code: "OH", road_service_response_minutes_committed: 120, scrap_permit_number: "OH-SCRAP-4041", scrap_permit_expires_on: "2027-06-30" }
              as: DealerAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /fleet-accounts"
              payload: { name: "Shared Freight", account_type: "SINGLE_LOCATION", home_location_id: "${loc_id}", billing_mode: "DIRECT" }
              as: DealerAdmin
              captures: { fleet_id: $.data.id }
            - call: "POST /service-locations/${loc_id}/technicians"
              payload: { name: "Shar E", certification_level: "LEVEL_2" }
              as: DealerAdmin
              captures: { tech_id: $.data.id }
            - call: "POST /casings"
              payload: { fleet_account_id: "${fleet_id}", casing_serial: "CS-4041", brand: "Bridgestone", casing_spec_code: "ANY", intended_position: "DRIVE", scrap_weight_lbs: 136 }
              as: DealerAdmin
              captures: { casing_id: $.data.id }
          trigger:
            - call: "GET /casings/${casing_id}"
              payload: {}
              as: DealerAdmin
            - call: "GET /casings/${casing_id}"
              payload: {}
              as: FleetManager
              as_user_id: "${fleet_id}"
            - call: "GET /casings/${casing_id}"
              payload: {}
              as: TireTechnician
              as_user_id: "${tech_id}"
            - call: "GET /casings/${casing_id}"
              payload: {}
              as: CasingInspector
              as_user_id: "inspector-1"
            - call: "GET /casings/${casing_id}"
              payload: {}
              as: PlantScheduler
            - call: "GET /casings/${casing_id}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-signer"
          assert:
            - "all six reads return 200 with data.id == ${casing_id} and identical field values"
            - "the FleetManager read succeeds because its X-User-ID is exactly ${fleet_id}, the casing's owning fleet"
            - "no read mutates the row: version is 1 in every response"

      - name: fleet_manager_cannot_read_another_fleets_cost_per_mile
        claim_type: segregation_of_duties
        grounds:
          - roles.FleetManager.identity
          - errors.ERR_FLEET_SCOPE_VIOLATION
          - endpoints.GET_/fleet-accounts/{fleet_account_id}/cost-per-mile
        distinguishing_aspect: "FleetManager is entity_backed, so role membership alone is insufficient: the same role and the same endpoint yield 200 for the caller's own fleet and 403 ERR_FLEET_SCOPE_VIOLATION for a peer fleet, which is a data-scope check rather than an endpoint-permission check."
        test_recipe:
          setup: ["two fleets at one location, no tire assets on either (an empty result is enough to distinguish 200 from 403)"]
          setup_api_calls:
            - call: "POST /service-locations"
              payload: { name: "Scope Commercial", location_code: "SPC2", state_code: "OH", road_service_response_minutes_committed: 120, scrap_permit_number: "OH-SCRAP-4042", scrap_permit_expires_on: "2027-06-30" }
              as: DealerAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /fleet-accounts"
              payload: { name: "Scope Fleet A", account_type: "SINGLE_LOCATION", home_location_id: "${loc_id}", billing_mode: "DIRECT" }
              as: DealerAdmin
              captures: { fleetA_id: $.data.id }
            - call: "POST /fleet-accounts"
              payload: { name: "Scope Fleet B", account_type: "SINGLE_LOCATION", home_location_id: "${loc_id}", billing_mode: "DIRECT" }
              as: DealerAdmin
              captures: { fleetB_id: $.data.id }
          trigger:
            - call: "GET /fleet-accounts/${fleetB_id}/cost-per-mile"
              payload: { variant: "HISTORICAL_ACTUAL" }
              as: FleetManager
              as_user_id: "${fleetA_id}"
              captures: { err: $.data.error_id }
            - call: "GET /fleet-accounts/${fleetA_id}/cost-per-mile"
              payload: { variant: "HISTORICAL_ACTUAL" }
              as: FleetManager
              as_user_id: "${fleetA_id}"
            - call: "GET /fleet-accounts/${fleetB_id}/cost-per-mile"
              payload: { variant: "HISTORICAL_ACTUAL" }
              as: DealerAdmin
          assert:
            - "the cross-fleet read returns 403 with data.error_id == \"ERR_FLEET_SCOPE_VIOLATION\", not 404 and not an empty 200"
            - "the same caller reading its own fleet returns 200 with group_count == 0 and excluded_asset_count == 0"
            - "DealerAdmin reads fleet B successfully, so the endpoint itself is not restricted — only the FleetManager identity is scoped"

      - name: billing_clerk_cannot_grade_the_casing_it_will_later_bill
        claim_type: role_model
        grounds:
          - roles.BillingClerk.description
          - roles.CasingInspector.exclusive_operations
          - errors.ERR_UNAUTHORIZED
        distinguishing_aspect: "The role model separates the party that CREATES casing credit from the party that CONSUMES it: BillingClerk is refused on inspect and reject, and CasingInspector is refused on invoice creation, so no single role can both mint and spend the ledger balance."
        test_recipe:
          setup: ["one CROSS_LOCATION fleet with a DRIVE policy and one COLLECTED casing"]
          setup_api_calls:
            - call: "POST /service-locations"
              payload: { name: "Sepduty Commercial", location_code: "SPD", state_code: "OH", road_service_response_minutes_committed: 120, scrap_permit_number: "OH-SCRAP-4043", scrap_permit_expires_on: "2027-06-30" }
              as: DealerAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /fleet-accounts"
              payload: { name: "Sepduty Freight", account_type: "NATIONAL_ACCOUNT", home_location_id: "${loc_id}", billing_mode: "CROSS_LOCATION" }
              as: DealerAdmin
              captures: { fleet_id: $.data.id }
            - call: "POST /fleet-accounts/${fleet_id}/tire-policies"
              payload: { position: "DRIVE", target_pressure_psi: 100, pressure_tolerance_pct: 0.10, min_tread_depth_32nds: 4, pull_point_32nds: 6, max_retread_count: 3, approved_brands: ["Bridgestone"], new_tire_tread_depth_32nds: 24, casing_spec_code: "ANY" }
              as: DealerAdmin
            - call: "POST /casings"
              payload: { fleet_account_id: "${fleet_id}", casing_serial: "CS-4043", brand: "Bridgestone", casing_spec_code: "ANY", intended_position: "DRIVE", scrap_weight_lbs: 137 }
              as: DealerAdmin
              captures: { casing_id: $.data.id }
            - call: "POST /casings/${casing_id}/collect"
              payload: { collected_at_location_id: "${loc_id}" }
              as: TireTechnician
              captures: { casing_v: $.data.version }
            - call: "GET /fleet-accounts/${fleet_id}"
              payload: {}
              as: BillingClerk
              captures: { fleet_v: $.data.version }
          trigger:
            - call: "POST /casings/${casing_id}/inspect"
              payload: { grade: "A", expected_casing_version: "${casing_v}" }
              as: BillingClerk
              captures: { e1: $.data.error_id }
            - call: "POST /casings/${casing_id}/reject"
              payload: { rejection_reason: "Trying anyway" }
              as: BillingClerk
              captures: { e2: $.data.error_id }
            - call: "POST /cross-location-invoices"
              payload: { fleet_account_id: "${fleet_id}", billing_period_start: "2026-08-01", billing_period_end: "2026-08-31", expected_fleet_account_version: "${fleet_v}" }
              as: CasingInspector
              as_user_id: "inspector-1"
              captures: { e3: $.data.error_id }
          assert:
            - "all three attempts return 403 with data.error_id == \"ERR_UNAUTHORIZED\""
            - "Casing.${casing_id}.status is still \"COLLECTED\" with inspection_grade null and provisional_credit_cents 0"
            - "FleetAccount.${fleet_id}.casing_credit_balance_cents == 0 and GET /casing-credit-entries?fleet_account_id=${fleet_id} returns total_count == 0"
            - "GET /cross-location-invoices?fleet_account_id=${fleet_id} returns total_count == 0"

      - name: create_casing_missing_x_user_role_returns_unauthenticated
        claim_type: authentication
        grounds:
          - validations.priority_1_authentication
          - errors.ERR_UNAUTHENTICATED
        distinguishing_aspect: "Authentication precedes authorization and everything else: with no X-User-Role header the response is 401 ERR_UNAUTHENTICATED, distinct from the 403 ERR_UNAUTHORIZED a recognised-but-wrong role receives, and it fires even when the body is invalid."
        test_recipe:
          setup: ["one fleet so the body would otherwise be valid; the trigger requests omit the X-User-Role header entirely"]
          setup_api_calls:
            - call: "POST /service-locations"
              payload: { name: "Anon Commercial", location_code: "ANC", state_code: "OH", road_service_response_minutes_committed: 120, scrap_permit_number: "OH-SCRAP-4044", scrap_permit_expires_on: "2027-06-30" }
              as: DealerAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /fleet-accounts"
              payload: { name: "Anon Freight", account_type: "SINGLE_LOCATION", home_location_id: "${loc_id}", billing_mode: "DIRECT" }
              as: DealerAdmin
              captures: { fleet_id: $.data.id }
          trigger:
            - call: "POST /casings"
              payload: { fleet_account_id: "${fleet_id}", casing_serial: "CS-4044", brand: "Bridgestone", casing_spec_code: "ANY", intended_position: "DRIVE", scrap_weight_lbs: 138 }
              captures: { e1: $.data.error_id }
            - call: "GET /casings"
              payload: { fleet_account_id: "${fleet_id}" }
              captures: { e2: $.data.error_id }
          assert:
            - "both header-less requests return 401 with data.error_id == \"ERR_UNAUTHENTICATED\" and response_type == \"error\""
            - "reads are guarded too: the anonymous list is refused rather than returning a public projection"
            - "GET /casings as DealerAdmin returns total_count == 0, so the refused write created nothing"

  # -------------------------------------------------------------------
  - section: cross_cutting_complexity_layers
    instances:

      - name: casing_inspect_with_superseded_version_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.casing-inspect-supersede
          - validations.priority_10_concurrency
          - errors.ERR_STALE_CASING_VERSION
        distinguishing_aspect: "The stale token is captured at creation and superseded by the collect hop, so the casing is in a perfectly legal COLLECTED state for inspect and ONLY the version is wrong — which is how this instance isolates the 412 from the 409 that a bad state would produce."
        test_recipe:
          setup:
            - "one fleet with a DRIVE policy and one casing created (version 1) then collected (version 2)"
            - "the version captured before the collect is deliberately reused"
          setup_api_calls:
            - call: "POST /service-locations"
              payload: { name: "Occ Commercial", location_code: "OCC", state_code: "OH", road_service_response_minutes_committed: 120, scrap_permit_number: "OH-SCRAP-4045", scrap_permit_expires_on: "2027-06-30" }
              as: DealerAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /fleet-accounts"
              payload: { name: "Occ Freight", account_type: "SINGLE_LOCATION", home_location_id: "${loc_id}", billing_mode: "DIRECT" }
              as: DealerAdmin
              captures: { fleet_id: $.data.id }
            - call: "POST /fleet-accounts/${fleet_id}/tire-policies"
              payload: { position: "DRIVE", target_pressure_psi: 100, pressure_tolerance_pct: 0.10, min_tread_depth_32nds: 4, pull_point_32nds: 6, max_retread_count: 3, approved_brands: ["Bridgestone"], new_tire_tread_depth_32nds: 24, casing_spec_code: "ANY" }
              as: DealerAdmin
            - call: "POST /casings"
              payload: { fleet_account_id: "${fleet_id}", casing_serial: "CS-4045", brand: "Bridgestone", casing_spec_code: "ANY", intended_position: "DRIVE", scrap_weight_lbs: 139 }
              as: DealerAdmin
              captures: { casing_id: $.data.id, stale_v: $.data.version }
            - call: "POST /casings/${casing_id}/collect"
              payload: { collected_at_location_id: "${loc_id}" }
              as: TireTechnician
              captures: { fresh_v: $.data.version }
          trigger:
            - call: "POST /casings/${casing_id}/inspect"
              payload: { grade: "A", expected_casing_version: "${stale_v}" }
              as: CasingInspector
              as_user_id: "inspector-1"
              captures: { err: $.data.error_id }
            - call: "POST /casings/${casing_id}/inspect"
              payload: { grade: "A", expected_casing_version: "${fresh_v}" }
              as: CasingInspector
              as_user_id: "inspector-1"
          assert:
            - "${stale_v} is 1 and ${fresh_v} is 2 — the collect hop bumped the row"
            - "the stale-token inspect returns 412 with data.error_id == \"ERR_STALE_CASING_VERSION\""
            - "after the refusal Casing.${casing_id}.status is still \"COLLECTED\", inspection_grade is null, and NO CasingCreditEntry was posted"
            - "the fresh-token inspect returns 200 with status \"INSPECTED\", grade \"A\", version 3, and exactly one ACCRUAL entry of 12000 cents (no agreement, so DEFAULT_CASING_CREDIT_CENTS at GRADE_FACTOR_A)"
            - "FleetAccount.${fleet_id}.casing_credit_balance_cents == 12000 only after the accepted call"

      - name: invoice_creation_with_superseded_fleet_version_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.invoice-create-stale-fleet
          - validations.priority_10_concurrency
          - errors.ERR_STALE_FLEET_VERSION
        distinguishing_aspect: "The guarded row is the FLEET, not the invoice, because a concurrent casing grading changes the credit balance the invoice is about to consume. The OCC check also sits above the whole fiscal ladder, so a stale token yields 412 rather than any of the priority 28/36/37 errors."
        test_recipe:
          setup:
            - "a CROSS_LOCATION fleet with an ACTIVE agreement (tier_discount_pct 0.125, casing_credit_rate_cents 15000) and one COMPLETED NORMAL call worth 12820 cents"
            - "the fleet version is captured, then a grade-B casing inspection bumps it"
          setup_api_calls:
            - call: "POST /service-locations"
              payload: { name: "Occfleet Commercial", location_code: "OCF", state_code: "OH", road_service_response_minutes_committed: 120, scrap_permit_number: "OH-SCRAP-4046", scrap_permit_expires_on: "2027-06-30" }
              as: DealerAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /fleet-accounts"
              payload: { name: "Occfleet Freight", account_type: "NATIONAL_ACCOUNT", home_location_id: "${loc_id}", billing_mode: "CROSS_LOCATION" }
              as: DealerAdmin
              captures: { fleet_id: $.data.id }
            - call: "POST /national-agreements"
              payload: { fleet_account_id: "${fleet_id}", agreement_code: "OCF-2026", effective_from: "2026-07-01", effective_to: "2026-12-31", tier_discount_pct: 0.125, casing_credit_rate_cents: 15000, emergency_response_minutes: 90, emergency_labor_rate_cents_per_hour: 13000 }
              as: DealerAdmin
              captures: { agr_id: $.data.id }
            - call: "POST /national-agreements/${agr_id}/activate"
              payload: {}
              as: DealerAdmin
            - call: "POST /fleet-accounts/${fleet_id}/tire-policies"
              payload: { position: "DRIVE", target_pressure_psi: 100, pressure_tolerance_pct: 0.10, min_tread_depth_32nds: 4, pull_point_32nds: 6, max_retread_count: 3, approved_brands: ["Bridgestone"], new_tire_tread_depth_32nds: 24, casing_spec_code: "ANY" }
              as: DealerAdmin
            - call: "POST /fleet-accounts/${fleet_id}/vehicles"
              payload: { unit_number: "T-127", vehicle_type: "TRACTOR", current_odometer_miles: 14000 }
              as: DealerAdmin
              captures: { veh_id: $.data.id }
            - call: "POST /service-locations/${loc_id}/technicians"
              payload: { name: "Occ T", certification_level: "LEVEL_2" }
              as: DealerAdmin
              captures: { tech_id: $.data.id }
            - call: "POST /road-service-calls"
              payload: { fleet_account_id: "${fleet_id}", vehicle_id: "${veh_id}", service_location_id: "${loc_id}", priority: "NORMAL", complaint: "Slow leak", reported_at: "2026-08-05T13:00:00Z" }
              as: DispatchCoordinator
              captures: { call_id: $.data.id }
            - call: "POST /road-service-calls/${call_id}/dispatch"
              payload: { dispatched_at: "2026-08-05T13:05:00Z", dispatch_miles: 2, technician_id: "${tech_id}" }
              as: DispatchCoordinator
            - call: "POST /road-service-calls/${call_id}/arrive"
              payload: { arrived_at: "2026-08-05T13:30:00Z" }
              as: TireTechnician
              as_user_id: "${tech_id}"
            - call: "POST /road-service-calls/${call_id}/complete"
              payload: { closed_at: "2026-08-05T14:00:00Z", labor_hours: 0.25 }
              as: TireTechnician
              as_user_id: "${tech_id}"
            - call: "GET /fleet-accounts/${fleet_id}"
              payload: {}
              as: BillingClerk
              captures: { stale_fleet_v: $.data.version }
            - call: "POST /casings"
              payload: { fleet_account_id: "${fleet_id}", casing_serial: "CS-4046", brand: "Bridgestone", casing_spec_code: "ANY", intended_position: "DRIVE", scrap_weight_lbs: 141 }
              as: DealerAdmin
              captures: { casing_id: $.data.id }
            - call: "POST /casings/${casing_id}/collect"
              payload: { collected_at_location_id: "${loc_id}" }
              as: TireTechnician
              captures: { casing_v: $.data.version }
            - call: "POST /casings/${casing_id}/inspect"
              payload: { grade: "B", expected_casing_version: "${casing_v}" }
              as: CasingInspector
              as_user_id: "inspector-1"
          trigger:
            - call: "POST /cross-location-invoices"
              payload: { fleet_account_id: "${fleet_id}", billing_period_start: "2026-08-01", billing_period_end: "2026-08-31", expected_fleet_account_version: "${stale_fleet_v}" }
              as: BillingClerk
              captures: { err: $.data.error_id }
            - call: "GET /fleet-accounts/${fleet_id}"
              payload: {}
              as: BillingClerk
              captures: { fresh_fleet_v: $.data.version }
            - call: "POST /cross-location-invoices"
              payload: { fleet_account_id: "${fleet_id}", billing_period_start: "2026-08-01", billing_period_end: "2026-08-31", expected_fleet_account_version: "${fresh_fleet_v}" }
              as: BillingClerk
              captures: { inv_id: $.data.id }
          assert:
            - "the grade-B inspection accrued 15000 * 0.70 * 1.00 == 10500 cents, so FleetAccount.casing_credit_balance_cents == 10500 and the fleet version advanced past ${stale_fleet_v}"
            - "the stale-token creation returns 412 with data.error_id == \"ERR_STALE_FLEET_VERSION\""
            - "after the refusal RoadServiceCall.${call_id}.billing_status is still \"UNBILLED\" with cross_location_invoice_id null, and GET /cross-location-invoices?fleet_account_id=${fleet_id} returns total_count == 0"
            - "the retry with ${fresh_fleet_v} returns 201 with subtotal_cents 12820, discount_cents 1603, net_before_credit_cents 11217, credit_applied_cents 2804 (floor(0.25 * 11217)) and total_cents 8413"
            - "the 412 fired even though the request was fiscally valid, confirming priority 10 sits above priorities 28, 36 and 37"

      - name: selector_skips_on_call_technician_even_when_top_ranked
        claim_type: selector_policy
        grounds:
          - calculations.technician_dispatch_selector
          - state_machines.Technician
        distinguishing_aspect: "The candidate predicate filters on status == AVAILABLE before any ranking, so a technician who would win every tie-break — same location, same TIA certification, same zero completed calls, earlier created_at — is skipped purely because dispatch put them ON_CALL. This is the one selector claim that no ranking rule can produce."
        test_recipe:
          setup:
            - "one location with two TIA_CERTIFIED technicians created in order T1 then T2, both AVAILABLE with completed_call_count 0"
            - "call A dispatched explicitly to T1, leaving T1 ON_CALL and still at zero completed calls"
            - "call B opened as EMERGENCY with no technician named"
          setup_api_calls:
            - call: "POST /service-locations"
              payload: { name: "Skip Commercial", location_code: "SKC", state_code: "OH", road_service_response_minutes_committed: 120, scrap_permit_number: "OH-SCRAP-4047", scrap_permit_expires_on: "2027-06-30" }
              as: DealerAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /fleet-accounts"
              payload: { name: "Skip Freight", account_type: "SINGLE_LOCATION", home_location_id: "${loc_id}", billing_mode: "DIRECT" }
              as: DealerAdmin
              captures: { fleet_id: $.data.id }
            - call: "POST /fleet-accounts/${fleet_id}/vehicles"
              payload: { unit_number: "T-128", vehicle_type: "TRACTOR", current_odometer_miles: 20000 }
              as: DealerAdmin
              captures: { veh1_id: $.data.id }
            - call: "POST /fleet-accounts/${fleet_id}/vehicles"
              payload: { unit_number: "T-129", vehicle_type: "TRACTOR", current_odometer_miles: 21000 }
              as: DealerAdmin
              captures: { veh2_id: $.data.id }
            - call: "POST /service-locations/${loc_id}/technicians"
              payload: { name: "Skip One", certification_level: "TIA_CERTIFIED" }
              as: DealerAdmin
              captures: { tech1_id: $.data.id }
            - call: "POST /service-locations/${loc_id}/technicians"
              payload: { name: "Skip Two", certification_level: "TIA_CERTIFIED" }
              as: DealerAdmin
              captures: { tech2_id: $.data.id }
            - call: "POST /road-service-calls"
              payload: { fleet_account_id: "${fleet_id}", vehicle_id: "${veh1_id}", service_location_id: "${loc_id}", priority: "NORMAL", complaint: "Call A", reported_at: "2026-08-31T08:00:00Z" }
              as: DispatchCoordinator
              captures: { callA_id: $.data.id }
            - call: "POST /road-service-calls/${callA_id}/dispatch"
              payload: { dispatched_at: "2026-08-31T08:10:00Z", dispatch_miles: 6, technician_id: "${tech1_id}" }
              as: DispatchCoordinator
            - call: "POST /road-service-calls"
              payload: { fleet_account_id: "${fleet_id}", vehicle_id: "${veh2_id}", service_location_id: "${loc_id}", priority: "EMERGENCY", complaint: "Call B", reported_at: "2026-08-31T09:00:00Z" }
              as: DispatchCoordinator
              captures: { callB_id: $.data.id }
          trigger:
            - call: "POST /road-service-calls/${callB_id}/dispatch"
              payload: { dispatched_at: "2026-08-31T09:05:00Z", dispatch_miles: 6 }
              as: DispatchCoordinator
          assert:
            - "at trigger time Technician.${tech1_id}.status == \"ON_CALL\" with completed_call_count 0 and Technician.${tech2_id}.status == \"AVAILABLE\" with completed_call_count 0"
            - "RoadServiceCall.${callB_id}.technician_id == ${tech2_id} — the status filter beat the created_at tie-break that would have chosen ${tech1_id}"
            - "Technician.${tech2_id}.status == \"ON_CALL\" and Vehicle.${veh2_id}.status == \"OUT_OF_SERVICE\" after the dispatch"
            - "call A is untouched: dispatch_status \"DISPATCHED\" with technician_id ${tech1_id}"

      - name: cascading_side_effects_layer_index
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers
        excluded_because:
          difficulty_instance: transitive_cascade / retread_completion_ledger_cascade_depth_five
          rationale: "A five-hop cascade from one job completion through the ledger, the fleet balance and every OPEN invoice is asserted there with literal values at each hop."

      - name: dual_variant_calculation_layer_index
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers
        excluded_because:
          difficulty_instance: dual_variant_calc / casing_credit_provisional_vs_production_verified
          rationale: "Both credit variants, their divergence and the ADJUSTMENT delta that reconciles them are asserted there."

  # -------------------------------------------------------------------
  - section: consistency_model
    instances:

      - name: invoice_creation_response_already_carries_every_derived_field
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - calculations.cross_location_invoice_rollup
        distinguishing_aspect: "Consistency is immediate: the creation response itself already carries line_count, subtotal, discount, net, credit_applied and total, and the claimed call already reads as INVOICED in a follow-up GET with no settling step — while the fleet's credit balance is deliberately NOT yet reduced, because the ledger APPLICATION posts at submit."
        test_recipe:
          setup:
            - "a CROSS_LOCATION fleet with an ACTIVE agreement (tier_discount_pct 0.125, casing_credit_rate_cents 15000)"
            - "one COMPLETED NORMAL call worth 12820 cents and one grade-B casing accrual of 10500 cents"
          setup_api_calls:
            - call: "POST /service-locations"
              payload: { name: "Immediate Commercial", location_code: "IMC", state_code: "OH", road_service_response_minutes_committed: 120, scrap_permit_number: "OH-SCRAP-4048", scrap_permit_expires_on: "2027-06-30" }
              as: DealerAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /fleet-accounts"
              payload: { name: "Immediate Freight", account_type: "NATIONAL_ACCOUNT", home_location_id: "${loc_id}", billing_mode: "CROSS_LOCATION" }
              as: DealerAdmin
              captures: { fleet_id: $.data.id }
            - call: "POST /national-agreements"
              payload: { fleet_account_id: "${fleet_id}", agreement_code: "IMM-2026", effective_from: "2026-07-01", effective_to: "2026-12-31", tier_discount_pct: 0.125, casing_credit_rate_cents: 15000, emergency_response_minutes: 90, emergency_labor_rate_cents_per_hour: 13000 }
              as: DealerAdmin
              captures: { agr_id: $.data.id }
            - call: "POST /national-agreements/${agr_id}/activate"
              payload: {}
              as: DealerAdmin
            - call: "POST /fleet-accounts/${fleet_id}/tire-policies"
              payload: { position: "DRIVE", target_pressure_psi: 100, pressure_tolerance_pct: 0.10, min_tread_depth_32nds: 4, pull_point_32nds: 6, max_retread_count: 3, approved_brands: ["Bridgestone"], new_tire_tread_depth_32nds: 24, casing_spec_code: "ANY" }
              as: DealerAdmin
            - call: "POST /fleet-accounts/${fleet_id}/vehicles"
              payload: { unit_number: "T-130", vehicle_type: "TRACTOR", current_odometer_miles: 33000 }
              as: DealerAdmin
              captures: { veh_id: $.data.id }
            - call: "POST /service-locations/${loc_id}/technicians"
              payload: { name: "Imm T", certification_level: "LEVEL_2" }
              as: DealerAdmin
              captures: { tech_id: $.data.id }
            - call: "POST /road-service-calls"
              payload: { fleet_account_id: "${fleet_id}", vehicle_id: "${veh_id}", service_location_id: "${loc_id}", priority: "NORMAL", complaint: "Slow leak", reported_at: "2026-08-05T13:00:00Z" }
              as: DispatchCoordinator
              captures: { call_id: $.data.id }
            - call: "POST /road-service-calls/${call_id}/dispatch"
              payload: { dispatched_at: "2026-08-05T13:05:00Z", dispatch_miles: 2, technician_id: "${tech_id}" }
              as: DispatchCoordinator
            - call: "POST /road-service-calls/${call_id}/arrive"
              payload: { arrived_at: "2026-08-05T13:30:00Z" }
              as: TireTechnician
              as_user_id: "${tech_id}"
            - call: "POST /road-service-calls/${call_id}/complete"
              payload: { closed_at: "2026-08-05T14:00:00Z", labor_hours: 0.25 }
              as: TireTechnician
              as_user_id: "${tech_id}"
            - call: "POST /casings"
              payload: { fleet_account_id: "${fleet_id}", casing_serial: "CS-4048", brand: "Bridgestone", casing_spec_code: "ANY", intended_position: "DRIVE", scrap_weight_lbs: 142 }
              as: DealerAdmin
              captures: { casing_id: $.data.id }
            - call: "POST /casings/${casing_id}/collect"
              payload: { collected_at_location_id: "${loc_id}" }
              as: TireTechnician
              captures: { casing_v: $.data.version }
            - call: "POST /casings/${casing_id}/inspect"
              payload: { grade: "B", expected_casing_version: "${casing_v}" }
              as: CasingInspector
              as_user_id: "inspector-1"
            - call: "GET /fleet-accounts/${fleet_id}"
              payload: {}
              as: BillingClerk
              captures: { fleet_v: $.data.version }
          trigger:
            - call: "POST /cross-location-invoices"
              payload: { fleet_account_id: "${fleet_id}", billing_period_start: "2026-08-01", billing_period_end: "2026-08-31", expected_fleet_account_version: "${fleet_v}" }
              as: BillingClerk
              captures: { inv_id: $.data.id }
            - call: "GET /road-service-calls/${call_id}"
              payload: {}
              as: BillingClerk
            - call: "GET /fleet-accounts/${fleet_id}"
              payload: {}
              as: BillingClerk
          assert:
            - "the creation response alone reports line_count 1, subtotal_cents 12820, discount_cents 1603, net_before_credit_cents 11217, credit_applied_cents 2804 and total_cents 8413 — no second read is needed to see the rollup"
            - "the immediately following GET of the call shows billing_status \"INVOICED\" and cross_location_invoice_id == ${inv_id}"
            - "the immediately following GET of the fleet still shows casing_credit_balance_cents == 10500 with exactly one ACCRUAL entry — the APPLICATION is posted at submit, so this is a deliberate design point rather than eventual consistency"
            - "national_agreement_id on the invoice equals ${agr_id}, resolved at creation from the ACTIVE agreement covering billing_period_start"
