      - name: protest_filing_rejections_before_the_window_opens_and_for_invalid_parties
        claim_type: error_triggerable
        grounds:
          - errors[ERR_PROTEST_WINDOW_NOT_OPEN]
          - errors[ERR_PROTEST_PARTIES_INVALID]
          - validations[priority 36 ERR_PROTEST_WINDOW_NOT_OPEN]
          - validations[priority 38 ERR_PROTEST_PARTIES_INVALID]
        distinguishing_aspect: |
          The protest window opens on the first result and the incident must fall inside the race's
          own sailing interval, both bounds inclusive: a protest against a race with no results is
          409 ERR_PROTEST_WINDOW_NOT_OPEN, protestor equal to protestee, an incident at 13:50 (before
          actual_start_utc 13:55) and an incident at 15:00:01 (one second after results_closed_utc)
          are each 422 ERR_PROTEST_PARTIES_INVALID, and an incident at exactly 13:55:00 is accepted.
        test_recipe:
          setup:
            - "A light RACING world with entries A and B both ACCEPTED in the CONFIRMED division A, a SEATED panel, and PRO/TIMEKEEPER/SIGNALS confirmed for 2026-08-05T12:00:00Z to 20:00:00Z."
            - "Race 1 (6.0 nm, scheduled 2026-08-05T14:00:00Z) was started at exactly 13:55:00Z; the clock was moved to 2026-08-05T15:00:00Z and entry A's FINISHED result stamped results_closed_utc 15:00:00Z."
            - "Race 2 (6.0 nm, scheduled 2026-08-05T16:00:00Z) exists with no result at all, and its prestart window 15:55-16:00 is clear of race 1's 13:55-14:00 by more than 3 minutes."
          setup_api_calls:
            - { call: "POST /regatta-ops/club-members", payload: { full_name: "Piers Holt", email: "piers.holt@yc.test" }, as: ClubAdmin, as_user_id: "ops-desk-1", captures: { m_ch: $.data.id } }
