              as: CustomsCoordinator
              captures: { rec_id: $.data.id }
            - call: "POST /brand-protection/customs-recordations/${rec_id}/record"
              payload: { recordation_number: "CBP-0001" }
              as: CustomsCoordinator
            - call: "POST /brand-protection/diversion-investigations"
              payload: { brand_id: "${brand_id}", source_kind: "BORDER_SEIZURE", lot_code: "LOT-77", recordation_id: "${rec_id}", seller_id: "${seller_id}", seizure_ref: "SZ-1", port_code: "USLAX", seized_qty: 400, declared_value_cents: 900000 }
              as: CustomsCoordinator
