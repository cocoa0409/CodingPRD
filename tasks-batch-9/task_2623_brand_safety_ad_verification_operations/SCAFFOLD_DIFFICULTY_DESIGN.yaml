      - name: mfa_score_exactly_at_flag_threshold_flags_one_point_below_does_not
        grounds:
          - calculations.mfa_score
          - entities.PageClassification.fields.mfa_flag
          - entities.Publisher.fields.mfa_page_count
          - endpoints.POST_page_classifications
        distinguishing_aspect: |
          Metric: mfa_score, at MFA_FLAG_THRESHOLD, on a third distinct endpoint
          - POST /page-classifications. With sourced_traffic_pct 0.40 and
          ad_density_ratio 0.70 the components are 28.00 + 25 + 8.00 + 9.00 =
          exactly 70.00, which must set mfa_flag (comparison is >=), while
          originality_score 41 gives 8.85 originality points and a total of
          69.85, which must not. refresh_seconds 15 also sits exactly on the
          25-point band edge (0 < s <= 15), so a > comparison there silently
          drops 13 points and both pages come out unflagged.
        test_recipe:
          setup:
