            - { call: "GET /respite/caregivers/${cg}/allocations", as: Coordinator, captures: { alloc: "$.data[0].id" } }
            - { call: "POST /respite/caregivers/${cg}/status-transitions", payload: { target_status: "SUSPENDED" }, as: Coordinator }
          trigger:
            - { call: "POST /respite/vouchers", payload: { allocation_id: "${alloc}", caregiver_id: "${cg}", authorized_hours: 2 }, as: Coordinator, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_CAREGIVER_NOT_ACTIVE"
            - "HTTP status == 422"

