              captures: { c_d_id: $.data.id }
            - call: "POST /candidacies/${c_a_id}/submit-petition"
              payload: {}
              as: Candidate
              as_user_id: "${s_a_id}"
            - call: "POST /candidacies/${c_b_id}/submit-petition"
              payload: {}
              as: Candidate
              as_user_id: "${s_b_id}"
            - call: "POST /candidacies/${c_d_id}/submit-petition"
              payload: {}
              as: Candidate
              as_user_id: "${s_d_id}"
            - call: "POST /candidacies/${c_a_id}/approve"
