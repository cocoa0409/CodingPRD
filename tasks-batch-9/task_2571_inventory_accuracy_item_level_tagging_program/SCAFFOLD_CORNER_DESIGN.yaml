            - "GET /inventory-integrity/tag-batches/${batch1} still reads status \"RECEIVED\" with verification_outcome null and sampled_units 0"
            - "a payload of sampled_units 50 / readable_units 51 returns 422 ERR_INVALID_VERIFICATION_COUNTS, and so does sampled 50 / readable 30 / unencoded 25 whose sum is 55"
            - "sampled 50 / readable 50 / duplicates 0 / unencoded 0 returns 200 with read_rate_bps 10000, verification_outcome \"PASS\" and status \"VERIFIED_PASS\""

      - name: count_submit_without_a_covering_shrink_period_rejected
