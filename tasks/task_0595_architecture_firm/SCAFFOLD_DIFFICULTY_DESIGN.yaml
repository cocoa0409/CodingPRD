  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: staff_timesheet_half_open_interval_admits_adjacency_rejects_strict_overlap
        grounds:
          - validations[priority=14]
          - errors[ERR_TIME_ENTRY_OVERLAP]
          - entities.TimeEntry.fields.start_utc
          - entities.TimeEntry.fields.end_utc
          - entities.StaffMember.fields.id
        distinguishing_aspect: |
          Interval semantics #1, on the StaffMember resource: the timesheet interval is
          HALF-OPEN [start_utc, end_utc) with capacity 1, so a new entry starting exactly when an
          existing one ends (17:00:00Z == 17:00:00Z) is ACCEPTED (201), while an entry starting
          one hour before that end (16:00:00Z) is REJECTED with ERR_TIME_ENTRY_OVERLAP.
        test_recipe:
          setup:
            - "An executed project (labor_budget_cents 10000000, so no fiscal gate fires) with its SD phase ACTIVE."
            - "One existing DRAFT TimeEntry for the architect covering 2026-05-04T09:00:00Z to 2026-05-04T17:00:00Z."
