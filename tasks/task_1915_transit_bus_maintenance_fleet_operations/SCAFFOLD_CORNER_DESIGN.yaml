            - { call: "POST /fleet/work-orders/${wo}/events", payload: { event_type: "START" }, as: MaintenanceSupervisor }
            - { call: "POST /fleet/parts/${pold}/supersede", payload: { new_part_id: "${pnew}" }, as: PartsClerk }
          trigger:
            - { call: "POST /fleet/work-orders/${wo}/part-lines", payload: { part_id: "${pold}", qty: 1 }, as: PartsClerk, captures: { err: $.data.error_id } }
            - { call: "POST /fleet/work-orders/${wo}/part-lines", payload: { part_id: "${pnew}", qty: 1 }, as: PartsClerk, captures: { ln: $.data.id } }
          assert:
