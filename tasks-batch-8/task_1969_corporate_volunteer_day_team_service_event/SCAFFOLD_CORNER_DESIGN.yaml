          trigger:
            - { call: "POST /procurement-orders/${ord1}/approve", payload: {}, as: ProcurementOfficer, as_user_id: "cem-1", captures: { err: $.data.error_id } }
            - { call: "POST /procurement-orders/${ord1}/approve", payload: {}, as: ProcurementOfficer, as_user_id: "po-1", captures: { ok_status: $.data.status } }
          assert:
            - "same-user approve: error_id == ERR_SEGREGATION_OF_DUTIES_VIOLATION (403)"
