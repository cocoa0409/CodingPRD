          Two state rules are violated at once by the same call: priority 23 wants voting_status ==
          CLOSED for a tally and priority 24 forbids tabulating an EXPIRED ballot. The ballot was
          closed after closes_at so it went OPEN -> EXPIRED, and the tally must surface the
          LOWER-numbered rule's error, 409 ERR_INVALID_BALLOT_STATE, not ERR_BALLOT_EXPIRED.
