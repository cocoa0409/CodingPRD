        distinguishing_aspect: "With a 400000 STRUCTURE_REPAIR_ONLY source (specificity 1, no admin retention) and a 2000000 UNRESTRICTED source (specificity 0, retention allowed), a 900000 STRUCTURE_REPAIR request must produce two lines in that order: 400000 net with 0 retention, then 500000 net with 17500 retention. Ordering by availability or by created_at alone would draw the whole 900000 from the unrestricted source and retain 31500."
