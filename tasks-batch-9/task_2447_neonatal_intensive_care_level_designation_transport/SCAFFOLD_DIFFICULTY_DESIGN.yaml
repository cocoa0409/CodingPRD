              payload: {}
              as: IntakeNeonatologist
              as_user_id: "${unit_a}:intake-1"
          trigger:
            - call: "GET /nicu-units/${unit_a}"
              payload: {}
              as: IntakeNeonatologist
              as_user_id: "${unit_a}:intake-1"
              captures: { v_r2: $.data.version }
            - call: "POST /referrals/${ref_r1}/revoke-acceptance"
              payload: { expected_unit_version: "${v_r2}" }
              as: IntakeNeonatologist
              as_user_id: "${unit_a}:intake-1"
          assert:
            - "Before the revoke: staffed_bed_target 1 + escalation_bed_count 0 == occupied 0 + held 1 + available 0"
            - "After the revoke: staffed_bed_target 1 + escalation_bed_count 0 == occupied 0 + held 0 + available 1"
            - "Referral.${ref_r1}.status == REVOKED and BedReservation.${res_r1}.status == RELEASED with released_reason == REVOKED"
            - "Referral.${ref_r2}.status == DEFERRED still, with decision_reason == NO_BED and NicuUnit.${unit_a}.deferral_queue_depth == 1"
            - "NicuUnit.${unit_a}.census_posture == OPEN after the revoke and CLOSED before it"
            - "NicuUnit.${unit_a}.version is strictly greater than ${v_r2} — the compensation is itself a versioned write"
            - "No BedReservation row was deleted; the released row remains readable with its history"

      - name: milk_volume_ledger_conserved_across_administration_reversal
        grounds:
          - calculations.milk_volume_ledger
          - state_machines.MilkBatch.administer
          - state_machines.MilkBatch.reverse_administration
          - entities.MilkBatch.fields.remaining_ml
          - entities.Admission.fields.milk_administered_ml
        distinguishing_aspect: |
          A different conserved quantity: MILLILITRES. volume_ml ==
          administered_ml + discarded_ml + remaining_ml must hold at every step,
          and the reversal must also walk the batch status back to VERIFIED and
          re-derive the admission's milk_administered_ml to 0.0 — a two-entity
          restoration, unlike the single-ledger bed instance.
        test_recipe:
          setup:
            - "Prelude as above."
            - "One ADMITTED admission at Regional NICU A with a VERIFIED MOTHERS_OWN batch of 120.0 ml (received by nurse-1, verified by nurse-2)."
          setup_api_calls:
            - *k_clock
            - *k_std1
            - *k_std2
            - *k_std3
            - *k_unit_a
            - *k_unit_b
            - *k_cred_neo
            - *k_cred_rn
            - *k_vent
            - *k_hfov
            - call: "POST /referrals"
              payload: { referring_unit_id: "${unit_b}", receiving_unit_id: "${unit_a}", referral_kind: "INBOUND_NEONATAL", case_reference: "CASE-R3", gestational_age_weeks: 29.0, birth_weight_grams: 1200, support_modality: "ROOM_AIR" }
              as: ReferringClinician
              as_user_id: "${unit_b}:ref-1"
              captures: { ref_r3: $.data.id }
            - call: "GET /nicu-units/${unit_a}"
              payload: {}
              as: IntakeNeonatologist
              as_user_id: "${unit_a}:intake-1"
              captures: { v_r3: $.data.version }
            - call: "POST /referrals/${ref_r3}/accept"
              payload: { expected_unit_version: "${v_r3}" }
              as: IntakeNeonatologist
              as_user_id: "${unit_a}:intake-1"
            - call: "POST /admissions"
              payload: { referral_id: "${ref_r3}" }
              as: IntakeNeonatologist
              as_user_id: "${unit_a}:intake-1"
              captures: { adm_r3: $.data.id }
            - call: "POST /milk-batches"
              payload: { admission_id: "${adm_r3}", donor_type: "MOTHERS_OWN", volume_ml: 120.0, expressed_at: "2026-08-01T00:00:00Z", label_code: "LBL-R3" }
              as: BedsideNurse
              as_user_id: "nurse-1"
              captures: { batch_r3: $.data.id }
            - call: "POST /milk-batches/${batch_r3}/verify"
              payload: { label_code: "LBL-R3" }
              as: BedsideNurse
              as_user_id: "nurse-2"
          trigger:
            - call: "POST /milk-batches/${batch_r3}/administrations"
              payload: { volume_ml: 40.0 }
              as: BedsideNurse
              as_user_id: "nurse-3"
            - call: "POST /milk-batches/${batch_r3}/administrations/reverse"
              payload: { volume_ml: 40.0 }
              as: BedsideNurse
              as_user_id: "nurse-3"
          assert:
            - "After the administration: administered_ml == 40.0, discarded_ml == 0.0, remaining_ml == 80.0, and 120.0 == 40.0 + 0.0 + 80.0"
            - "After the administration: MilkBatch.${batch_r3}.status == PARTIALLY_ADMINISTERED and Admission.${adm_r3}.milk_administered_ml == 40.0"
            - "After the reversal: administered_ml == 0.0, discarded_ml == 0.0, remaining_ml == 120.0, and 120.0 == 0.0 + 0.0 + 120.0"
            - "After the reversal: MilkBatch.${batch_r3}.status == VERIFIED (walked back, not left PARTIALLY_ADMINISTERED)"
            - "After the reversal: Admission.${adm_r3}.milk_administered_ml == 0.0 and the admission's version increased twice"
            - "verified_by_user_id remains nurse-2 — the compensation does not erase the verification history"
