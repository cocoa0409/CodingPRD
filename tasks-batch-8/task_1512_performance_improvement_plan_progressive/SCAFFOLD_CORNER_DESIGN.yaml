              payload: { concern_id: "${concern_id}", template_id: "${tpl_id}", start_date: "2026-08-01T00:00:00Z" }
              as: HRBusinessPartner
              as_user_id: "${hrbp_id}"
              captures: { pip_id: $.data.id, pip_v_create: $.data.version }
            - call: "POST /hr-org-units/${ou_id}/employees/${emp_id}/pips/${pip_id}/issue"
              payload: { expected_pip_version: "${pip_v_create}" }
              as: HRBusinessPartner
              as_user_id: "${hrbp_id}"
            - call: "POST /hr-org-units/${ou_id}/employees/${emp_id}/pips/${pip_id}/check-ins"
              payload: { scheduled_for: "2026-08-11T00:00:00Z" }
              as: HRBusinessPartner
              as_user_id: "${hrbp_id}"
            - call: "POST /hr-org-units/${ou_id}/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: HRSystemAdmin
            - call: "POST /hr-org-units/${ou_id}/employees/${emp_id}/pips/${pip_id}/outcome-decisions"
              payload: { proposed_outcome: "TERMINATION", rationale: "Proposing termination pending legal review." }
              as: HRBusinessPartner
              as_user_id: "${hrbp_id}"
              captures: { decision_id: $.data.id }
            - call: "POST /hr-org-units/${ou_id}/employees/${emp_id}/pips/${pip_id}/legal-reviews"
              payload: { assigned_counsel_id: "${counsel_id}" }
              as: HRBusinessPartner
              as_user_id: "${hrbp_id}"
              captures: { review_id: $.data.id }
            - call: "POST /hr-org-units/${ou_id}/employees/${emp_id}/pips/${pip_id}/legal-reviews/${review_id}/claim"
              payload: {}
              as: LegalCounsel
              as_user_id: "${counsel_id}"
          trigger:
            - call: "POST /hr-org-units/${ou_id}/employees/${emp_id}/pips/${pip_id}/legal-reviews/${review_id}/submit"
              payload:
                risk_factors: ["WHISTLEBLOWER_HISTORY", "RETALIATION_WINDOW"]
                recommendation: "REJECT"
                rationale: "Employee filed a whistleblower complaint 6 weeks ago and is within the retaliation-safe harbor window; termination would create material legal exposure."
              as: LegalCounsel
              as_user_id: "${counsel_id}"
          assert:
            - "LegalReview.${review_id}.status == SUBMITTED"
            - "OutcomeDecision.${decision_id}.status == SUPERSEDED (cascade on REJECT)"

  # ===========================================================================
  # Section: consistency_model — immediate consistency.
  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_consistency_cascade_visible_in_same_response
        claim_type: immediate_consistency
        grounds:
          - complexity_profile.consistency_model
        distinguishing_aspect: |
          consistency_model = immediate. After a mutation, subsequent
          GETs in the same test (no artificial delay) observe the
          cascaded state (e.g., PIP issue -> concern status update
          -> employee active_pip_id update) atomically.
        test_recipe:
          setup:
            - "PIP P1 ready to issue"
          setup_api_calls:
            - call: "POST /hr-org-units"
              payload: { name: "OU1" }
              as: HRSystemAdmin
              captures: { ou_id: $.data.id }
            - call: "POST /hr-org-units/${ou_id}/employees"
              payload: { full_name: "Boss", email: "m@x.com", job_family: "ENGINEERING", job_level: 6 }
              as: HRSystemAdmin
              captures: { mgr_id: $.data.id }
            - call: "POST /hr-org-units/${ou_id}/employees"
              payload: { full_name: "HRBP", email: "h@x.com", job_family: "OPERATIONS", job_level: 7 }
              as: HRSystemAdmin
              captures: { hrbp_id: $.data.id }
            - call: "POST /hr-org-units/${ou_id}/employees"
              payload: { full_name: "E1", email: "e@x.com", job_family: "ENGINEERING", job_level: 5, manager_id: "${mgr_id}" }
              as: HRSystemAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /hr-org-units/${ou_id}/employees/${emp_id}/coaching-log-entries"
              payload: { occurred_at: "2026-07-01T10:00:00Z", category: "QUALITY", severity: "DOCUMENTED", narrative: "Documented coaching." }
              as: Manager
              as_user_id: "${mgr_id}"
              captures: { cle1: $.data.id }
            - call: "POST /hr-org-units/${ou_id}/employees/${emp_id}/coaching-log-entries"
              payload: { occurred_at: "2026-07-08T10:00:00Z", category: "QUALITY", severity: "DOCUMENTED", narrative: "Second documented coaching." }
              as: Manager
              as_user_id: "${mgr_id}"
              captures: { cle2: $.data.id }
            - call: "POST /hr-org-units/${ou_id}/employees/${emp_id}/performance-concerns"
              payload: { category: "QUALITY", summary: "Quality below bar", coaching_log_entry_ids: ["${cle1}", "${cle2}"] }
              as: Manager
              as_user_id: "${mgr_id}"
              captures: { concern_id: $.data.id }
            - call: "POST /hr-org-units/${ou_id}/employees/${emp_id}/performance-concerns/${concern_id}/submit"
              payload: {}
              as: Manager
              as_user_id: "${mgr_id}"
            - call: "POST /hr-org-units/${ou_id}/employees/${emp_id}/performance-concerns/${concern_id}/accept"
              payload: {}
              as: HRBusinessPartner
              as_user_id: "${hrbp_id}"
            - call: "POST /hr-org-units/${ou_id}/pip-templates"
              payload:
                name: "T"
                category: "QUALITY"
                goal_blueprints:
                  - { metric_key: "defects", target_value: 2, unit: "count", weight: 100 }
                duration_days: 30
                check_in_cadence_days: 10
              as: HRBusinessPartner
              as_user_id: "${hrbp_id}"
              captures: { tpl_id: $.data.id }
            - call: "POST /hr-org-units/${ou_id}/pip-templates/${tpl_id}/publish"
              payload: {}
              as: HRBusinessPartner
              as_user_id: "${hrbp_id}"
            - call: "POST /hr-org-units/${ou_id}/employees/${emp_id}/pips"
              payload: { concern_id: "${concern_id}", template_id: "${tpl_id}", start_date: "2026-08-01T00:00:00Z" }
              as: HRBusinessPartner
              as_user_id: "${hrbp_id}"
              captures: { pip_id: $.data.id, pip_v_create: $.data.version }
          trigger:
            - call: "POST /hr-org-units/${ou_id}/employees/${emp_id}/pips/${pip_id}/issue"
              payload: { expected_pip_version: "${pip_v_create}" }
              as: HRBusinessPartner
              as_user_id: "${hrbp_id}"
            - call: "GET /hr-org-units/${ou_id}/employees/${emp_id}/performance-concerns/${concern_id}"
              payload: {}
              as: HRBusinessPartner
              as_user_id: "${hrbp_id}"
              captures: { concern_status: $.data.status }
            - call: "GET /hr-org-units/${ou_id}/employees/${emp_id}"
              payload: {}
              as: HRBusinessPartner
              as_user_id: "${hrbp_id}"
              captures: { emp_active_pip: $.data.active_pip_id }
          assert:
            - "PerformanceConcern.${concern_id}.status == SUPERSEDED_BY_PIP (visible in immediate follow-up GET)"
            - "Employee.${emp_id}.active_pip_id == ${pip_id} (visible in immediate follow-up GET)"
