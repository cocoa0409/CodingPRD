        grounds:
          - state_machines.IngredientPurchase.DELIVERED_to_PAID
          - state_machines.Supplier.APPROVED_to_PREFERRED
          - calculations.supplier_reliability_and_standing
          - entities.Supplier.fields.cash_flow_received_cents
        distinguishing_aspect: |
          Paying one sourcing order promotes the producer to PREFERRED, and that promotion - not the
          payment call itself - auto-confirms the producer's other REQUESTED orders: after paying the
          first order the producer is still APPROVED and the third order stays REQUESTED, and only the
          second payment that crosses the 500000-cent threshold promotes the producer and confirms it.
