      - name: error_full_unavailable_downtime_blocks_in_scope_reads_with_cds_unavailable
        claim_type: error_triggerable
        grounds:
          - errors.ERR_CDS_UNAVAILABLE
          - state_machines.DowntimeEvent.transitions[SCHEDULED->ACTIVE]
        distinguishing_aspect: "A FULL_UNAVAILABLE window rejects in-scope READS as well as mutations with ERR_CDS_UNAVAILABLE (409), which a READ_ONLY window would not do; ContentRequest reads stay available because they are outside the frozen scope."
        test_recipe:
          setup:
            - "A DRAFT order set, then a SYSTEM_WIDE FULL_UNAVAILABLE downtime window covering the current clock instant, activated."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: POST /cds/clinicians
