              as: MaintenanceTechnician
              as_user_id: "tech-1"
            - call: "POST /park-ops/part-requisitions"
              payload: { attraction_id: "${a1}", part_number: "PN-CC-A", quantity: 1, unit_cost_cents: 10000, needed_by_date: "2026-08-10", downtime_event_id: "${d1}" }
              as: MaintenanceTechnician
              as_user_id: "tech-1"
              captures: { r1: "$.data.id" }
            - call: "POST /park-ops/part-requisitions"
              payload: { attraction_id: "${a1}", part_number: "PN-CC-B", quantity: 1, unit_cost_cents: 20000, needed_by_date: "2026-08-10" }
              as: MaintenanceTechnician
              as_user_id: "tech-1"
              captures: { r2: "$.data.id" }
            - call: "POST /park-ops/part-requisitions"
              payload: { attraction_id: "${a2}", part_number: "PN-CC-C", quantity: 1, unit_cost_cents: 50000, needed_by_date: "2026-08-10", downtime_event_id: "${d2}" }
              as: MaintenanceTechnician
              as_user_id: "tech-1"
              captures: { r3: "$.data.id" }
          trigger:
            - call: "POST /park-ops/part-requisitions/${r1}/backorder"
              payload: { expected_availability_date: "2026-08-09" }
              as: MaintenanceManager
              as_user_id: "mgr-1"
            - call: "POST /park-ops/part-requisitions/${r2}/backorder"
              payload: { expected_availability_date: "2026-08-09" }
              as: MaintenanceManager
              as_user_id: "mgr-1"
            - call: "POST /park-ops/part-requisitions/${r3}/backorder"
              payload: { expected_availability_date: "2026-08-09" }
              as: MaintenanceManager
              as_user_id: "mgr-1"
