            - "FundingAdvance.${c15_a}.approved_advance_amount_cents == 0, effective_advance_rate_bps == 0, rate_adjustment_codes == [] and invoice_age_days_at_funding == null"
            - "InventoryUnit.${c15_u}.funding_status == \"PENDING_FUNDING\" after the trigger while title_custody_status is still LENDER_HELD - the dimensions move independently"
            - "Dealer.${c15_d}.status == \"ACTIVE\" after the activate, proving PROSPECT was the initial value and not a permanent one"

      - name: title_released_for_sale_is_terminal_and_rejects_a_return_to_lender_held
