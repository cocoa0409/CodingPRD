  - rule_id: cross_entity_state_dependency
    instances:

      - name: dispatch_requires_approved_permit_covering_the_whole_order
        grounds:
          - state_machines.WorkOrder.PLANNED_to_SCHEDULED
          - state_machines.PermitApplication.SUBMITTED_to_APPROVED
          - validations.priority_10_ERR_PERMIT_NOT_APPROVED
          - validations.priority_10_ERR_PERMIT_WINDOW_ELAPSED
          - calculations.crew_labor_hours
          - calculations.closure_corridor_utilization
          - entities.Jobsite.fields.requires_sidewalk_closure
        distinguishing_aspect: |
          Whether a WorkOrder may be SCHEDULED depends on a different entity's state
          and on a different entity's date window: the same dispatch payload is
          refused with ERR_PERMIT_NOT_APPROVED 409 while the jobsite's permit is
          SUBMITTED and accepted once it is APPROVED, and a second dispatch whose
          computed scheduled_end_utc 2026-08-20T02:15:00Z pokes past the permit's
          closure_end_utc 2026-08-20T00:00:00Z is refused with
          ERR_PERMIT_WINDOW_ELAPSED 409 even though its scheduled_start_utc is
          inside the window. Checking only the start instant, or only the permit
          status, admits one of the two refusals.
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z for the permit work (clears the 5-day lead time on a 2026-08-10 closure start), then 2026-08-19T00:00:00Z for the dispatches."
            - "Municipality HRB-01: permit_lead_time_days 5, max_concurrent_closure_linear_feet 800, rental_tax_rate_bp 890."
            - "Jobsite with requires_sidewalk_closure true and site_condition SOIL."
            - "One permit: 300 ft PARTIAL over [2026-08-10T00:00:00Z, 2026-08-20T00:00:00Z), submitted but not yet decided."
            - "CONSTRUCTION contract 500 ft, NONE screen, term 3, no add-ons -> monthly 27000, install_labor 47500, one_time 78500."
            - "Two crews, each daily_capacity_hours 12.0, so the capacity gate cannot fire; the account credit_limit_cents is 100000000."
            - "A DELIVERY_INSTALL order (4.25 h) and a RELOCATION order (6.25 h) both sit in PLANNED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fence-rentals/municipalities"
              payload: { name: "City of Harbor Point", jurisdiction_code: "HRB-01", permit_lead_time_days: 5, max_concurrent_closure_linear_feet: 800, rental_tax_rate_bp: 890, permit_review_rounds_allowed: 2, allows_solid_wind_screen: true }
              as: PlatformAdmin
              captures: { m1_id: "$.data.id"}
            - call: "POST /fence-rentals/accounts"
              payload: { legal_name: "Ridgeline Builders LLC", billing_email: "ap@ridgeline.example", credit_limit_cents: 100000000 }
              as: AccountManager
              as_user_id: "am-001"
              captures: { a1_id: "$.data.id"}
            - call: "POST /fence-rentals/products"
              payload: { code: "PANEL-CL-10", category: "FENCE_PANEL", description: "10 ft chain-link fence panel", panel_length_ft: 10, unit_monthly_rate_cents: 0, replacement_cost_cents_per_unit: 24000, fleet_age_months: 18, wind_load_rating_mph: 90, owned_count: 400 }
              as: PlatformAdmin
            - call: "POST /fence-rentals/crews"
              payload: { crew_code: "CRW-A", depot_code: "DEP-1", daily_capacity_hours: 12.0 }
              as: DispatchCoordinator
              as_user_id: "dc-001"
              captures: { c1_id: "$.data.id"}
            - call: "POST /fence-rentals/crews"
              payload: { crew_code: "CRW-B", depot_code: "DEP-1", daily_capacity_hours: 12.0 }
              as: DispatchCoordinator
              as_user_id: "dc-001"
              captures: { c2_id: "$.data.id"}
            - call: "POST /fence-rentals/jobsites"
              payload: { customer_account_id: "${a1_id}", municipality_id: "${m1_id}", site_label: "Quay Street Tower", address_line: "11 Quay Street", site_condition: "SOIL", phase_count: 3, requires_sidewalk_closure: true }
              as: AccountManager
              as_user_id: "am-001"
              captures: { j1_id: "$.data.id", j1_v: "$.data.version"}
            - call: "GET /fence-rentals/municipalities/${m1_id}"
              as: MunicipalLiaison
              as_user_id: "ml-001"
              captures: { committed_before: "$.data.committed_closure_linear_feet"}
            - call: "POST /fence-rentals/permits"
              payload: { jobsite_id: "${j1_id}", closure_linear_feet: 300, closure_start_utc: "2026-08-10T00:00:00Z", closure_end_utc: "2026-08-20T00:00:00Z", sidewalk_closure_type: "PARTIAL" }
              as: MunicipalLiaison
              as_user_id: "ml-001"
              captures: { pm_id: "$.data.id"}
            - call: "POST /fence-rentals/permits/${pm_id}/submit"
              payload: {}
              as: MunicipalLiaison
              as_user_id: "ml-001"
              captures: { pm_status_submitted: "$.data.status"}
            - call: "POST /fence-rentals/jobsites/${j1_id}/quotes"
              payload: { expected_jobsite_version: "${j1_v}", contract_type: "CONSTRUCTION", linear_feet: 500, panel_product_code: "PANEL-CL-10", term_months: 3, wind_screen: "NONE" }
              as: AccountManager
              as_user_id: "am-001"
              captures: { q1_id: "$.data.id"}
            - call: "POST /fence-rentals/quotes/${q1_id}/issue"
              payload: {}
              as: AccountManager
              as_user_id: "am-001"
            - call: "POST /fence-rentals/quotes/${q1_id}/accept"
              payload: { accepted_by_name: "R. Vance" }
              as: CustomerContact
              as_user_id: "${a1_id}"
            - call: "POST /fence-rentals/contracts"
              payload: { quote_id: "${q1_id}", terms_acknowledged_by: "R. Vance" }
              as: AccountManager
              as_user_id: "am-001"
              captures: { c_id: "$.data.id"}
            - call: "POST /fence-rentals/contracts/${c_id}/work-orders"
              payload: { work_order_type: "DELIVERY_INSTALL", ordered_linear_feet: 500 }
              as: DispatchCoordinator
              as_user_id: "dc-001"
              captures: { wi_id: "$.data.id"}
            - call: "POST /fence-rentals/contracts/${c_id}/work-orders"
              payload: { work_order_type: "RELOCATION", ordered_linear_feet: 500, phase_from: 1, phase_to: 2 }
              as: DispatchCoordinator
              as_user_id: "dc-001"
              captures: { wrel_id: "$.data.id"}
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-19T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /fence-rentals/work-orders/${wi_id}/dispatch"
              payload: { crew_id: "${c1_id}", scheduled_start_utc: "2026-08-19T18:00:00Z" }
              as: DispatchCoordinator
              as_user_id: "dc-001"
            - call: "POST /fence-rentals/permits/${pm_id}/municipal-decision"
              payload: { decision: "APPROVE", reviewer_note: "lane shift approved as drawn" }
              as: MunicipalLiaison
              as_user_id: "ml-001"
              captures: { pm_status_approved: "$.data.status", pm_decided: "$.data.decided_at_utc"}
            - call: "POST /fence-rentals/work-orders/${wi_id}/dispatch"
              payload: { crew_id: "${c1_id}", scheduled_start_utc: "2026-08-19T18:00:00Z" }
              as: DispatchCoordinator
              as_user_id: "dc-001"
              captures: { wi_status: "$.data.status", wi_hours: "$.data.estimated_labor_hours", wi_end: "$.data.scheduled_end_utc"}
            - call: "GET /fence-rentals/municipalities/${m1_id}"
              as: MunicipalLiaison
              as_user_id: "ml-001"
              captures: { committed_after: "$.data.committed_closure_linear_feet"}
            - call: "POST /fence-rentals/work-orders/${wrel_id}/dispatch"
              payload: { crew_id: "${c2_id}", scheduled_start_utc: "2026-08-19T20:00:00Z" }
              as: DispatchCoordinator
              as_user_id: "dc-001"
          assert:
            - "the captured committed_before == 0"
            - "the captured pm_status_submitted == SUBMITTED"
            - "the first trigger call returns status code 409 with error_id == ERR_PERMIT_NOT_APPROVED"
            - "after the first trigger call WorkOrder.${wi_id}.status == PLANNED and crew_id == null"
            - "the captured pm_status_approved == APPROVED"
            - "the captured pm_decided == 2026-08-19T00:00:00Z"
            - "the captured wi_status == SCHEDULED"
            - "the captured wi_hours == 4.25"
            - "the captured wi_end == 2026-08-19T22:15:00Z"
            - "the captured committed_after == 300"
            - "the last trigger call returns status code 409 with error_id == ERR_PERMIT_WINDOW_ELAPSED"
            - "WorkOrder.${wrel_id}.status == PLANNED and WorkOrder.${wrel_id}.crew_id == null"
            - "WorkOrder.${wrel_id}.estimated_labor_hours == null"
            - "PermitApplication.${pm_id}.status == APPROVED and revision_round == 0"

      - name: contract_conversion_requires_accepted_quote_and_pins_version
        grounds:
          - state_machines.Quote.ACCEPTED_to_CONVERTED
          - validations.priority_9_ERR_QUOTE_STATE
          - entities.RentalContract.fields.pinned_quote_version
          - entities.RentalContract.fields.fleet_commitments
          - entities.RentalContract.fields.current_phase
        distinguishing_aspect: |
          POST /contracts is gated on a different entity's state and must answer
          ERR_QUOTE_STATE 409 for a DRAFT quote, ERR_QUOTE_STATE 409 for an ISSUED
          quote, succeed exactly once on the ACCEPTED quote while copying
          pinned_quote_version from the version observed at accept time, and answer
          ERR_QUOTE_STATE 409 again for the second conversion of the now-CONVERTED
          quote. Four calls with the identical body produce three different
          outcomes only if the gate reads the quote's live state each time.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Municipality HRB-01, rental_tax_rate_bp 890."
            - "Jobsite SOIL, phase_count 3, requires_sidewalk_closure false."
            - "One CONSTRUCTION quote: 500 ft, NONE screen, term 3, no add-ons -> monthly 27000, install_labor 47500, one_time 78500, panel_unit_count 50."
            - "No work order, invoice or permit is ever created."
