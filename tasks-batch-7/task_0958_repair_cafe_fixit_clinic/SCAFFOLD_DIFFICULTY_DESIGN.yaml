          assert:
            - "error_id == ERR_EVENT_PHASE_FORBIDS; FixerShift.${sh}.status stays CONFIRMED"

  - rule_id: resource_temporal_overlap
    instances:
      - name: fixer_double_booking_half_open
        grounds:
          - validations[priority=7]
          - entities.FixerShift.fields.start_time
        distinguishing_aspect: |
          Resource = FixerProfile's time; HALF-OPEN interval semantics: a new shift whose
          start equals the existing shift's end (adjacent, 12:00 after 08:00-12:00) is
          ALLOWED, while a true overlap (11:00-13:00) is rejected with ERR_SHIFT_OVERLAP.
        test_recipe:
          setup: ["Fixer F with skill; two stations S1/S2 cap 1 each; existing shift 08:00-12:00 at S1"]
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T09:00:00Z" }, as: Coordinator }
            - { call: "POST /api/repair-events", payload: { name: "Cafe Omicron", starts_at: "2026-06-01T06:00:00Z", ends_at: "2026-06-01T22:00:00Z", intake_item_cap: 5 }, as: Coordinator, captures: { ev: $.data.id } }
            - { call: "POST /api/stations", payload: { event_id: "${ev}", category: "BIKE", label: "B1", capacity: 1 }, as: Coordinator, captures: { s1: $.data.id } }
            - { call: "POST /api/stations", payload: { event_id: "${ev}", category: "BIKE", label: "B2", capacity: 1 }, as: Coordinator, captures: { s2: $.data.id } }
            - { call: "POST /api/fixer-profiles", payload: { display_name: "Fixer A", email: "a@x.com", safety_induction_completed_at: "2026-01-01T00:00:00Z" }, as: Coordinator, captures: { fx: $.data.id } }
            - { call: "POST /api/fixer-skills", payload: { fixer_id: "${fx}", category: "BIKE", level: 3 }, as: Coordinator }
            - { call: "POST /api/fixer-shifts", payload: { fixer_id: "${fx}", station_id: "${s1}", event_id: "${ev}", start_time: "2026-06-01T08:00:00Z", end_time: "2026-06-01T12:00:00Z" }, as: Coordinator, captures: { sh1: $.data.id } }
          trigger:
            - { call: "POST /api/fixer-shifts", payload: { fixer_id: "${fx}", station_id: "${s2}", event_id: "${ev}", start_time: "2026-06-01T12:00:00Z", end_time: "2026-06-01T14:00:00Z" }, as: Coordinator, captures: { sh2: $.data.id } }
            - { call: "POST /api/fixer-shifts", payload: { fixer_id: "${fx}", station_id: "${s2}", event_id: "${ev}", start_time: "2026-06-01T11:00:00Z", end_time: "2026-06-01T13:00:00Z" }, as: Coordinator, captures: { err: $.data.error_id } }
          assert:
            - "Adjacent shift accepted: FixerShift.${sh2}.status == SIGNED_UP (half-open: end == start is no overlap)"
            - "Overlapping shift: error_id == ERR_SHIFT_OVERLAP"
      - name: station_closed_interval_capacity_counting
        grounds:
          - validations[priority=8]
          - entities.Station.fields.capacity
        distinguishing_aspect: |
          Resource = Station's shift book (different resource, DIFFERENT interval
          semantics): overlap counting uses CLOSED intervals, so back-to-back shifts
          touching at 12:00 both count. With capacity 2 and existing 08:00-12:00 plus
          12:00-16:00, a third 12:00-13:00 shift sees count 2 >= capacity and is rejected —
          under the fixer's half-open rule only one of them would have counted.
        test_recipe:
          setup: ["Station cap 2; fixer A shift 08:00-12:00; fixer B shift 12:00-16:00 (accepted: closed count 1 < 2)"]
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T09:00:00Z" }, as: Coordinator }
            - { call: "POST /api/repair-events", payload: { name: "Cafe Pi", starts_at: "2026-06-01T06:00:00Z", ends_at: "2026-06-01T22:00:00Z", intake_item_cap: 5 }, as: Coordinator, captures: { ev: $.data.id } }
            - { call: "POST /api/stations", payload: { event_id: "${ev}", category: "TEXTILE", label: "T1", capacity: 2 }, as: Coordinator, captures: { st: $.data.id } }
            - { call: "POST /api/fixer-profiles", payload: { display_name: "Fixer A", email: "a@x.com", safety_induction_completed_at: "2026-01-01T00:00:00Z" }, as: Coordinator, captures: { fa: $.data.id } }
            - { call: "POST /api/fixer-profiles", payload: { display_name: "Fixer B", email: "b@x.com", safety_induction_completed_at: "2026-01-01T00:00:00Z" }, as: Coordinator, captures: { fb: $.data.id } }
            - { call: "POST /api/fixer-profiles", payload: { display_name: "Fixer C", email: "c@x.com", safety_induction_completed_at: "2026-01-01T00:00:00Z" }, as: Coordinator, captures: { fc: $.data.id } }
            - { call: "POST /api/fixer-shifts", payload: { fixer_id: "${fa}", station_id: "${st}", event_id: "${ev}", start_time: "2026-06-01T08:00:00Z", end_time: "2026-06-01T12:00:00Z" }, as: Coordinator, captures: { sha: $.data.id } }
            - { call: "POST /api/fixer-shifts", payload: { fixer_id: "${fb}", station_id: "${st}", event_id: "${ev}", start_time: "2026-06-01T12:00:00Z", end_time: "2026-06-01T16:00:00Z" }, as: Coordinator, captures: { shb: $.data.id } }
          trigger:
            - { call: "POST /api/fixer-shifts", payload: { fixer_id: "${fc}", station_id: "${st}", event_id: "${ev}", start_time: "2026-06-01T12:00:00Z", end_time: "2026-06-01T13:00:00Z" }, as: Coordinator, captures: { err: $.data.error_id } }
          assert:
            - "FixerShift.${shb} was ACCEPTED despite touching shift A at 12:00 (closed count 1 < capacity 2)"
            - "Third shift: error_id == ERR_STATION_INTERVAL_CAPACITY_EXCEEDED (closed-interval count 2 >= capacity 2 at t=12:00)"

  - rule_id: compensating_invariant
    instances:
      - name: parts_reserve_release_conserves_on_hand
        grounds:
          - calculations.invariant_part_stock_conservation
          - state_machines.PartReservation.RESERVED_to_RELEASED
        distinguishing_aspect: |
          Conserved quantity = physical stock units: reserve(3) then release MUST leave
          quantity_on_hand == 10 and quantity_reserved == 0 exactly; commit is the only
          operation allowed to move on_hand (reserve 3, commit 3 -> on_hand 7).
        test_recipe:
          setup:
            - "PartStock on_hand 10; item IN_REPAIR at an INTAKE_OPEN event with fixer F"
            - "reservation R1 qty 3 (then released); reservation R2 qty 3 (then committed)"
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T09:00:00Z" }, as: Coordinator }
            - { call: "POST /api/repair-events", payload: { name: "Cafe Rho", starts_at: "2026-06-01T08:00:00Z", ends_at: "2026-06-01T16:00:00Z", intake_item_cap: 5 }, as: Coordinator, captures: { ev: $.data.id } }
            - { call: "POST /api/stations", payload: { event_id: "${ev}", category: "ELECTRONICS", label: "E1", capacity: 1 }, as: Coordinator, captures: { st: $.data.id } }
            - { call: "POST /api/fixer-profiles", payload: { display_name: "Fixer A", email: "a@x.com", safety_induction_completed_at: "2026-01-01T00:00:00Z" }, as: Coordinator, captures: { fx: $.data.id } }
            - { call: "POST /api/fixer-skills", payload: { fixer_id: "${fx}", category: "ELECTRONICS", level: 4 }, as: Coordinator }
            - { call: "POST /api/fixer-shifts", payload: { fixer_id: "${fx}", station_id: "${st}", event_id: "${ev}", start_time: "2026-06-01T08:00:00Z", end_time: "2026-06-01T12:00:00Z" }, as: Coordinator, captures: { sh: $.data.id } }
            - { call: "POST /api/repair-events/${ev}/publish", as: Coordinator }
            - { call: "POST /api/fixer-shifts/${sh}/confirm", as: Coordinator }
            - { call: "POST /api/fixer-shifts/${sh}/check-in", as: Fixer, as_user_id: "${fx}" }
            - { call: "POST /api/stations/${st}/open", as: Coordinator }
            - { call: "POST /api/repair-events/${ev}/open-intake", as: Coordinator }
            - { call: "POST /api/visitors", payload: { full_name: "Visitor One", email: "v1@x.com" }, as: IntakeVolunteer, captures: { vs: $.data.id } }
            - { call: "POST /api/waivers", payload: { visitor_id: "${vs}", safety_clause_accepted: true }, as: IntakeVolunteer }
            - { call: "POST /api/repair-items", payload: { event_id: "${ev}", visitor_id: "${vs}", category: "ELECTRONICS", description: "Amp", weight_kg_estimated: 4.0 }, as: IntakeVolunteer, captures: { it: $.data.id, itv: $.data.version } }
            - { call: "POST /api/repair-items/${it}/triage-records", payload: { severity: 3, estimated_difficulty: 2, diagnosis: "caps", expected_item_version: "${itv}" }, as: Fixer, as_user_id: "${fx}" }
            - { call: "POST /api/repair-items/${it}/enqueue", as: Coordinator }
            - { call: "POST /api/repair-items/${it}/assign", payload: {}, as: Coordinator }
            - { call: "POST /api/repair-items/${it}/start-repair", as: Fixer, as_user_id: "${fx}" }
            - { call: "POST /api/part-stocks", payload: { sku: "CAP-470U", name: "470uF cap", category: "ELECTRONICS", unit_cost_cents: 120, quantity_on_hand: 10 }, as: Coordinator, captures: { stk: $.data.id } }
            - { call: "POST /api/part-reservations", payload: { part_stock_id: "${stk}", repair_item_id: "${it}", quantity: 3 }, as: Fixer, as_user_id: "${fx}", captures: { r1: $.data.id } }
          trigger:
            - { call: "POST /api/part-reservations/${r1}/release", as: Fixer, as_user_id: "${fx}" }
            - { call: "POST /api/part-reservations", payload: { part_stock_id: "${stk}", repair_item_id: "${it}", quantity: 3 }, as: Fixer, as_user_id: "${fx}", captures: { r2: $.data.id } }
            - { call: "POST /api/part-reservations/${r2}/commit", as: Fixer, as_user_id: "${fx}" }
            - { call: "GET /api/part-stocks/${stk}", as: Coordinator }
          assert:
            - "After reserve(3)+release: quantity_on_hand == 10 AND quantity_reserved == 0 (invariant held before the commit)"
            - "Final: quantity_on_hand == 7 (only the commit moved it) AND quantity_reserved == 0 AND quantity_available == 7"
            - "PartReservation.${r1}.status == RELEASED; PartReservation.${r2}.status == COMMITTED"
      - name: station_seat_checkin_checkout_conserves_count
        grounds:
          - calculations.invariant_station_seat_conservation
          - state_machines.FixerShift.CHECKED_IN_to_COMPLETED
        distinguishing_aspect: |
          Conserved quantity = station seat occupancy (different from stock units):
          check-in then check-out MUST return checked_in_fixer_count to its prior value 0
          and the count MUST always equal the number of CHECKED_IN shifts.
        test_recipe:
          setup: ["Event PUBLISHED; station cap 1; fixer F CONFIRMED shift 08:00-12:00; clock 09:00; count starts 0"]
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T09:00:00Z" }, as: Coordinator }
            - { call: "POST /api/repair-events", payload: { name: "Cafe Sigma", starts_at: "2026-06-01T08:00:00Z", ends_at: "2026-06-01T16:00:00Z", intake_item_cap: 5 }, as: Coordinator, captures: { ev: $.data.id } }
            - { call: "POST /api/stations", payload: { event_id: "${ev}", category: "BIKE", label: "B1", capacity: 1 }, as: Coordinator, captures: { st: $.data.id } }
            - { call: "POST /api/fixer-profiles", payload: { display_name: "Fixer A", email: "a@x.com", safety_induction_completed_at: "2026-01-01T00:00:00Z" }, as: Coordinator, captures: { fx: $.data.id } }
            - { call: "POST /api/fixer-skills", payload: { fixer_id: "${fx}", category: "BIKE", level: 3 }, as: Coordinator }
            - { call: "POST /api/fixer-shifts", payload: { fixer_id: "${fx}", station_id: "${st}", event_id: "${ev}", start_time: "2026-06-01T08:00:00Z", end_time: "2026-06-01T12:00:00Z" }, as: Coordinator, captures: { sh: $.data.id } }
            - { call: "POST /api/repair-events/${ev}/publish", as: Coordinator }
            - { call: "POST /api/fixer-shifts/${sh}/confirm", as: Coordinator }
          trigger:
            - { call: "POST /api/fixer-shifts/${sh}/check-in", as: Fixer, as_user_id: "${fx}" }
            - { call: "POST /api/fixer-shifts/${sh}/check-out", payload: { completion: true }, as: Fixer, as_user_id: "${fx}" }
            - { call: "GET /api/stations/${st}", as: Coordinator }
          assert:
            - "After check-in: checked_in_fixer_count == 1 (== count of CHECKED_IN shifts)"
            - "After check-out: checked_in_fixer_count == 0 — the forward/compensating pair conserved the seat count"
