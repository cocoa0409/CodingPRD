          Metric: the physiologic stabilization score, on POST
          /transport-runs/{id}/stabilize. All four targets are hit exactly on
          their inclusive bounds (36.5 C at the low end of [36.5, 37.5], glucose
          exactly 45, mean BP exactly equal to the gestational age in weeks, SpO2
          exactly 90 at the low end of [90, 95]) so the score is 100 and departure
          is permitted. No other boundary instance touches this formula or this
          endpoint.
