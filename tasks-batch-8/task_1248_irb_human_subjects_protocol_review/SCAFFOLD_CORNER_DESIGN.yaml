      - name: occ_stale_meeting_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[agenda-item-add-stale-meeting-version]", "errors[ERR_STALE_MEETING_VERSION]"]
        distinguishing_aspect: "OCC on BoardMeeting.version: an agenda-item add carrying the pre-add version fails with ERR_STALE_MEETING_VERSION (412) after a first add bumped it; re-reading and retrying with the fresh version succeeds."
