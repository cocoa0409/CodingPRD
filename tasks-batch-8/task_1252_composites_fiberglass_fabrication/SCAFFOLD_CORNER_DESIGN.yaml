            - { call: "POST /molds", payload: { mold_code: "MOLD-TA1", maintenance_interval_cycles: 10, prototype_parts_required: 1, tooling_phase: "PRODUCTION" }, as: ToolingEngineer, captures: { mold1: $.data.id } }
            - { call: "POST /molds", payload: { mold_code: "MOLD-TA2", maintenance_interval_cycles: 10, prototype_parts_required: 1, tooling_phase: "PRODUCTION" }, as: ToolingEngineer, captures: { mold2: $.data.id } }
            - { call: "POST /molds", payload: { mold_code: "MOLD-TA3", maintenance_interval_cycles: 10, prototype_parts_required: 1, tooling_phase: "PRODUCTION" }, as: ToolingEngineer, captures: { mold3: $.data.id } }
            - { call: "POST /ply-books", payload: { part_number: "PN-100", revision: "A", part_area_m2: 2.0, plies: [ { seq: 1, material_code: "CF-200", orientation_deg: 0, areal_weight_g_m2: 200 } ], resin_system: "POLYESTER", target_fiber_volume_pct: 0.5 }, as: ToolingEngineer, captures: { pb_id: $.data.id } }
            - { call: "POST /ply-books/${pb_id}/approve", payload: {}, as: ToolingEngineer }
            - { call: "POST /cure-equipment", payload: { equipment_code: "AC-1", kind: "AUTOCLAVE", max_parts_per_cycle: 5, turnaround_minutes: 30, max_temperature_c: 250, max_pressure_bar: 7 }, as: ShopManager, captures: { ac_id: $.data.id } }
            - { call: "POST /work-orders", payload: { work_order_no: "WO-TA1", part_number: "PN-100", mold_id: "${mold1}", ply_book_id: "${pb_id}", quantity: 1, due_date: "2026-07-01T00:00:00Z" }, as: ShopManager, captures: { wo1: $.data.id } }
            - { call: "POST /work-orders", payload: { work_order_no: "WO-TA2", part_number: "PN-100", mold_id: "${mold2}", ply_book_id: "${pb_id}", quantity: 1, due_date: "2026-07-01T00:00:00Z" }, as: ShopManager, captures: { wo2: $.data.id } }
