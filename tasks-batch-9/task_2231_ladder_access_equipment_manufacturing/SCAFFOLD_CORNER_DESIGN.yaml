          to_iso8601: '2026-08-01T00:00:00Z'
        as: SystemOperator
      - call: POST /ladder-ops/products
        payload:
          model_code: FG-EXT-24-IA
          product_type: EXTENSION_LADDER
          material: FIBERGLASS_PULTRUSION
          duty_rating: TYPE_IA
          working_length_ft: 24.0
          retail_sku: SKU-FG24IA
        as: DesignEngineer
        as_user_id: eng-1
        captures:
          p1: $.data.id
          p1v: $.data.version
      - call: POST /ladder-ops/design-revisions
        payload:
          product_id: ${p1}
          revision_label: A
          joint_type: RIVETED
          structural_margin_pct: 6.5
          rail_section_modulus_in3: 0.25
          expected_product_version: ${p1v}
        as: DesignEngineer
        as_user_id: eng-1
        captures:
          r1: $.data.id
      - call: POST /ladder-ops/design-revisions/${r1}/submit
        payload: {}
        as: DesignEngineer
        as_user_id: eng-1
      - call: POST /ladder-ops/design-revisions/${r1}/review
        payload:
          decision: APPROVE
        as: DesignApprover
        as_user_id: appr-1
      - call: POST /ladder-ops/test-benches
        payload:
          bench_code: BENCH-1
          max_load_capacity_lb: 5000
          cooldown_minutes: 60
        as: TestLabTechnician
        captures:
          b1: $.data.id
      - call: POST /ladder-ops/test-campaigns
        payload:
          product_id: ${p1}
          design_revision_id: ${r1}
          purpose: DESIGN_QUALIFICATION
        as: TestLabTechnician
        captures:
          c1: $.data.id
      - call: POST /ladder-ops/bench-reservations
        payload:
          test_bench_id: ${b1}
          test_campaign_id: ${c1}
          start_at: '2026-08-03T08:00:00Z'
          end_at: '2026-08-03T12:00:00Z'
        as: TestLabTechnician
        captures:
          res1: $.data.id
      - call: POST /ladder-ops/test-campaigns/${c1}/start
        payload:
          bench_reservation_id: ${res1}
        as: TestLabTechnician
      - call: POST /ladder-ops/test-campaigns/${c1}/load-tests
        payload:
          test_code: STATIC_VERTICAL
          applied_load_lb: 1400.0
          measured_deflection_in: 1.2
          permanent_set_in: 0.01
        as: TestLabTechnician
      - call: POST /ladder-ops/test-campaigns/${c1}/load-tests
        payload:
          test_code: RAIL_BENDING
          applied_load_lb: 1400.0
          measured_deflection_in: 1.2
          permanent_set_in: 0.01
        as: TestLabTechnician
      - call: POST /ladder-ops/test-campaigns/${c1}/load-tests
        payload:
          test_code: SLIP_RESISTANCE
          applied_load_lb: 1400.0
          measured_deflection_in: 1.2
          permanent_set_in: 0.01
        as: TestLabTechnician
      - call: POST /ladder-ops/test-campaigns/${c1}/load-tests
        payload:
          test_code: ELECTRICAL_LEAKAGE
          applied_load_lb: 1400.0
          measured_deflection_in: 1.2
          permanent_set_in: 0.01
        as: TestLabTechnician
      - call: POST /ladder-ops/test-campaigns/${c1}/load-tests
        payload:
          test_code: RIVET_SHEAR
          applied_load_lb: 1400.0
          measured_deflection_in: 1.2
          permanent_set_in: 0.01
        as: TestLabTechnician
      - call: POST /ladder-ops/test-campaigns/${c1}/conclude
        payload: {}
        as: TestLabTechnician
      - call: POST /ladder-ops/products/${p1}/freeze-design
        payload:
          frozen_revision_id: ${r1}
        as: DesignApprover
        as_user_id: appr-1
      trigger:
      - call: POST /ladder-ops/production-lots
        payload:
          product_id: ${p1}
          design_revision_id: ${r1}
          lot_code: LOT-0001
          planned_units: 500
          pultrusion_batch_id: PB-77
        as: ProductionSupervisor
        captures:
          lnew: $.data.id
      assert:
      - HTTP status == 201
      - ProductionLot.${lnew}.planned_units == 500
      - ProductionLot.${lnew}.produced_units == 0
      - ProductionLot.${lnew}.units_wip == 0
      - ProductionLot.${lnew}.units_quarantined == 0
      - ProductionLot.${lnew}.units_released == 0
      - ProductionLot.${lnew}.units_scrapped == 0
      - ProductionLot.${lnew}.status == OPEN
      - ProductionLot.${lnew}.joint_sample_count == 0
      - ProductionLot.${lnew}.required_joint_sample_count == 0
      - ProductionLot.${lnew}.conformance_index == null
      - ProductionLot.${lnew}.released_at == null
      - ProductionLot.${lnew}.disposition == null
  - name: consumer_registration_recall_event_id_is_computed_not_input
