              as: ContractAdmin
              captures: { rec_b: $.data.id }
            - call: "GET /contracts/${cid}/seats"
              as: ContractAdmin
              captures: { seat_a: $.data.0.id, seat_a_v: $.data.0.version, seat_b: $.data.1.id, seat_b_v: $.data.1.version }
            - call: "POST /contracts/${cid}/seats/${seat_a}/assign"
              payload: { recruiter_id: "${rec_a}", expected_seat_version: "${seat_a_v}" }
              as: SeatAdmin
            - call: "POST /contracts/${cid}/seats/${seat_b}/assign"
              payload: { recruiter_id: "${rec_b}", expected_seat_version: "${seat_b_v}" }
              as: SeatAdmin
            - call: "GET /contracts/${cid}"
              as: ContractAdmin
              captures: { cv1: $.data.version }
            - call: "POST /contracts/${cid}/renewal-events"
              payload: { event_kind: "TRUE_UP", seats_delta: -2, expected_contract_version: "${cv1}" }
              as: Auditor
              captures: { ev_tu: $.data.id }
            - call: "GET /contracts/${cid}"
              as: ContractAdmin
              captures: { cv2: $.data.version }
            - call: "POST /contracts/${cid}/renewal-events"
              payload: { event_kind: "SUSPENSION", expected_contract_version: "${cv2}" }
              as: Auditor
              captures: { ev_su: $.data.id }
            - call: "POST /renewal-events/${ev_su}/approve"
              as: Auditor
            - call: "POST /contracts/${cid}/suspend"
              as: Auditor
          trigger:
            - call: "POST /renewal-events/${ev_tu}/approve"
              as: Auditor
              captures: { err: $.data.error_id }
          assert:
            - "rejected with ERR_INVALID_STATE (contract is SUSPENDED; priority 4 state) — not ERR_TRUEUP_BOUNDS (priority 14 business_fiscal), even though both violations hold"

  # =====================================================================
  # Rule 6 — boundary_precision_check (2 instances, different metrics/endpoints)
  # =====================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: budget_exhausted_at_exact_budget
        grounds:
          - state_machines.JobPosting.ACTIVE_to_EXHAUSTED
          - entities.JobPosting.fields.spent_cents
          - errors[ERR_PACING_VIOLATION]
        distinguishing_aspect: |
          Numeric threshold boundary on the spend metric: the system
          auto-transition to EXHAUSTED fires at spent_cents >= budget_cents,
          so a spend that lands spent_cents exactly ON budget_cents
          succeeds and exhausts the posting (>= boundary), while any
          further spend — even 1 cent — is rejected.
        test_recipe:
          setup:
            - "ACTIVE PRO contract with one assigned seat"
            - "EVEN posting budget_cents=2000, daily_cap_cents=2000, window 2026-09-01..2026-09-11 (total_days=10), with a RESERVED slot on 2026-09-10"
            - "logical clock set to 2026-09-10T12:00:00Z (day 10, elapsed_days=10, EVEN cumulative_cap = floor(2000*10/10) = 2000); posting ACTIVE"
          setup_api_calls:
            - call: "POST /contracts"
              payload: { contract_number: "C-BND-1", product_tier: "RECRUITER_PRO", seat_cap: 5 }
              as: ContractAdmin
              captures: { cid: $.data.id }
            - call: "POST /contracts/${cid}/activate"
              payload: { seats_purchased_initial: 1 }
              as: ContractAdmin
            - call: "POST /recruiters"
              payload: { email: "r9@x.com", full_name: "R Nine", home_contract_id: "${cid}" }
              as: ContractAdmin
              captures: { rec1: $.data.id }
            - call: "GET /contracts/${cid}/seats"
              as: ContractAdmin
              captures: { seat1: $.data.0.id, seat1_v: $.data.0.version }
            - call: "POST /contracts/${cid}/seats/${seat1}/assign"
              payload: { recruiter_id: "${rec1}", expected_seat_version: "${seat1_v}" }
              as: SeatAdmin
            - call: "POST /contracts/${cid}/job-postings"
              payload: { title: "BndJob", budget_cents: 2000, daily_cap_cents: 2000, pacing_mode: "EVEN", start_at: "2026-09-01T00:00:00Z", end_at: "2026-09-11T00:00:00Z", created_by_seat_id: "${seat1}" }
              as: SeatAdmin
              captures: { jp: $.data.id }
            - call: "POST /contracts/${cid}/job-postings/${jp}/promoted-slots"
              payload: { slot_date: "2026-09-10", reserved_cents: 2000 }
              as: SeatAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T12:00:00Z" }
              as: ContractAdmin
            - call: "POST /contracts/${cid}/job-postings/${jp}/activate"
              as: SeatAdmin
          trigger:
            - call: "POST /contracts/${cid}/job-postings/${jp}/record-spend"
              payload: { amount_cents: 1999 }
              as: SeatAdmin
              captures: { spent_a: $.data.spent_cents, st_a: $.data.posting_status }
            - call: "POST /contracts/${cid}/job-postings/${jp}/record-spend"
              payload: { amount_cents: 1 }
              as: SeatAdmin
              captures: { spent_b: $.data.spent_cents, st_b: $.data.posting_status }
            - call: "POST /contracts/${cid}/job-postings/${jp}/record-spend"
              payload: { amount_cents: 1 }
              as: SeatAdmin
              captures: { err_c: $.data.error_id }
          assert:
            - "after 1999: spent_cents == 1999 and posting_status == ACTIVE (1999 < 2000, not yet exhausted)"
            - "after +1: spent_cents == 2000 and posting_status == EXHAUSTED (boundary uses >=, fires exactly at budget)"
            - "third spend rejected with ERR_INVALID_STATE (posting no longer ACTIVE) — the exhaustion boundary locked the posting the instant spent_cents reached budget_cents exactly"

      - name: aggregation_floor_exactly_25_vs_24
        grounds:
          - entities.TalentInsightReport.fields.aggregation_floor
          - validations[priority=10]
          - errors[ERR_AGGREGATION_FLOOR]
        distinguishing_aspect: |
          Empty-collection / count boundary on a different metric
          (matched_count) through a different endpoint (publish): a report
          with matched_count == 25 publishes (>= floor), a report with
          matched_count == 24 is rejected with ERR_AGGREGATION_FLOOR — the
          floor comparison is >= 25, not > 25.
