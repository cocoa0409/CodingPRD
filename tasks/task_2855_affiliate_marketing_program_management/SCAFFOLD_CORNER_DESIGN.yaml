  - section: validations
    instances:

      - name: batch_state_check_precedes_approval_limit_check
        claim_type: priority_ordering
        grounds:
          - validations[priority 25]
          - validations[priority 49]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / batch_state_check_outranks_approval_limit_on_approve
          rationale: "That instance already approves a DRAFT batch whose net_payable_cents exceeds APPROVAL_LIMIT_CENTS and asserts ERR_BATCH_NOT_VALIDATED (priority 25) rather than ERR_APPROVAL_LIMIT_EXCEEDED (priority 49), then validates and re-approves to see the 422."
      - name: fraud_hold_check_precedes_tax_document_check_on_release
        claim_type: priority_ordering
        grounds:
          - validations[priority 34]
          - validations[priority 48]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / fraud_hold_check_outranks_tax_document_check_on_release_hold
          rationale: "That instance already releases a HELD_FRAUD line belonging to a partner with no VALID tax document and asserts ERR_FRAUD_HOLD_NOT_CLEARABLE (priority 34) instead of ERR_TAX_DOCUMENT_INVALID (priority 48)."
      - name: effective_window_check_precedes_policy_overlap_check
        claim_type: priority_ordering
        grounds:
          - validations[priority 37]
          - validations[priority 39]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / effective_window_check_outranks_policy_overlap_on_activate
          rationale: "That instance already activates a policy whose effective_from is not before its effective_to while an overlapping ACTIVE policy exists, and asserts ERR_INVALID_EFFECTIVE_WINDOW (priority 37) rather than ERR_POLICY_WINDOW_OVERLAP (priority 39)."
      - name: decide_requires_applicant_affiliate_still_eligible
        claim_type: cross_entity_validation
        grounds:
          - validations[priority 27]
          - errors[ERR_AFFILIATE_NOT_ELIGIBLE]
