            - call: "POST /disclosure/content-requirements"
              payload: { undertaking_id: "${und_id}", kind: "ENTERPRISE_STATISTICS", label: "Enterprise Statistics", weight_bp: 1, waivable: false }
              as: DisclosureOfficer
              as_user_id: "off-prep"
