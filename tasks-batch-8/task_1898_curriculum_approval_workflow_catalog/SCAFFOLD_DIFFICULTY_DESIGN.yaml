  - rule_id: boundary_precision_check
    instances:
      - name: accreditor_threshold_exactly_50_triggers
        grounds:
          - calculations.substantive_change_score
          - entities.Proposal.fields.accreditor_notification_required
        distinguishing_aspect: |
          Boundary metric = substantive_change_score observed at the decisions endpoint:
          the rule is >= NOTIFY_THRESHOLD (50), so a FINAL score of exactly 50 (10 base +
          25 delta + 15 cross-listing) sets accreditor_notification_required = true, while
          35 (same proposal without the cross-listing factor) leaves it false.
        test_recipe:
          setup:
            - "Departments CS and MATH; term T1 OPEN"
            - "Course C (CS 301, credits 4) cross-listed PENDING with M (MATH 210); course D (CS 302, credits 4) not cross-listed"
            - "COURSE_CHANGE proposal PA on C (proposed 3 credits, delta exactly 0.25) and PB on D (same payload shape)"
          setup_api_calls:
            - { call: "POST /curriculum/departments", payload: { dept_name: "Computer Science", subject_codes: ["CS"], college: "Engineering" }, as: Registrar, as_user_id: "reg-1", captures: { dept_cs: $.data.id } }
            - { call: "POST /curriculum/departments", payload: { dept_name: "Mathematics", subject_codes: ["MATH"], college: "Sciences" }, as: Registrar, as_user_id: "reg-1", captures: { dept_math: $.data.id } }
