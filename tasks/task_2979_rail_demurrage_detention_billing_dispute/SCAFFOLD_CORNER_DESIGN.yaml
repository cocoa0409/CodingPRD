              captures: { dsp1_id: $.data.id }
          trigger:
            - call: "POST /demurrage/disputes"
              payload: { invoice_id: "${inv_id}", scope: "WHOLE_INVOICE", grounds: "RAILROAD_CAUSED_DELAY", narrative: "Second reader replays the same version.", claimed_credit_cents: 10000, expected_invoice_version: "${inv_v1}" }
              as: Customer
