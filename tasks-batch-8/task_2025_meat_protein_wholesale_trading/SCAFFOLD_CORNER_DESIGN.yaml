            - { call: "POST /api/products", payload: { product_code: "RIBEYE-WF", kind: "PRIMAL", species: "BEEF", max_fat_pct: 12.0, shelf_life_days: 21, required_temp_max_f: 40 }, as: DeskAdmin, captures: { rib_id: "$.data.id" } }
