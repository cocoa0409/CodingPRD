# =============================================================================
# PRD-Bench Scaffold — Prepaid Restaurant Ticketing & Experience Reservations
# Difficulty target: beyond Expert (§0.4 Expert band, upper end)
# =============================================================================

scenario: |
  Generate task harder than expert level!

  2616. Prepaid Restaurant Ticketing & Experience Reservations (Tock): ticketed
  seating inventory by service, party size and turn time, prepaid deposit versus
  full prepayment and cancellation forfeiture policy, dynamic pricing by day of
  week and demand tier, ticket transfer, resale prevention and name-change rules,
  waitlist and release of unsold inventory close to service, dietary note capture
  and kitchen prep implications, event and multi-course experience packaging with
  add-ons, refund exceptions and guest goodwill credit

domain_name: prepaid-restaurant-ticketing
api_prefix: ""

complexity_profile:
  primary_archetype: Quota / allocation
  secondary_archetype: Pricing engine
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation

  entity_topology: flat
  # Every write is a top-level collection POST carrying explicit foreign keys in
  # the body (`POST /ticket-classes` with `service_id`, `POST /reservations` with
  # `ticket_class_id`). No entity is addressed through a parent-nested write path.
  # Reads add reverse-index endpoints only (filtered lists plus four
  # `/restaurants/{id}/<segment>` config indexes) so every FK is discoverable.

  state_machine_shape: parallel
  # Reservation carries TWO independent state dimensions on the same row —
  # `fulfillment_status` (PENDING→CONFIRMED→SEATED→COMPLETED plus CANCELLED /
  # NO_SHOW / TRANSFERRED_OUT / EXPIRED) and `payment_status` (UNPAID→
  # DEPOSIT_PAID→FULLY_PAID plus PARTIALLY_REFUNDED / REFUNDED / FORFEITED /
  # TRANSFERRED) — which advance on different triggers and gate each other only
  # at pinned crossing points. Layered on top: WaitlistEntry is cyclic
  # (WAITING→OFFERED→WAITING), DietaryNote is cyclic
  # (PENDING→PREP_REJECTED→PENDING), TicketClass is cyclic
  # (OPEN→SOLD_OUT→OPEN and OPEN→PAUSED→OPEN), and RefundException is a
  # branching fork (REQUESTED→{APPROVED,DENIED}) with divergent side-effect sets.

  relationship_patterns:
    - one_to_many          # Service → TicketClass → Reservation
    - many_to_many         # ReservationAddOn junction (Reservation × AddOn)
    - self_referential     # Reservation.transferred_from_reservation_id → Reservation.id
    - cross_aggregate      # GoodwillCredit → RefundException → Reservation → Service

  role_model: segregation_of_duties
  # A GuestServices operator who requested a RefundException may not decide it,
  # and the operator who decided it may not issue the compensating GoodwillCredit.
  # Both checks compare `X-User-ID` values recorded on the entities.

  consistency_model: immediate

# -----------------------------------------------------------------------------
# §1.0 Response Envelope (FIXED — verbatim)
# -----------------------------------------------------------------------------
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# -----------------------------------------------------------------------------
# §1.1 Entity-Relationship Table
# -----------------------------------------------------------------------------
entities:

  - name: Restaurant
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: trading name of the restaurant
        constraints: "non-empty, max 120 chars, unique across Restaurant"
      - name: service_charge_bp
        type: integer
        source: input
        description: kitchen service charge in basis points applied per charge line
        default: 725
        constraints: "0 <= service_charge_bp <= 3000"
      - name: hold_ttl_minutes
        type: integer
        source: input
        description: minutes a PENDING Reservation hold survives before hold-sweep expires it
        default: 20
        constraints: "1 <= hold_ttl_minutes <= 1440"
      - name: offer_ttl_minutes
        type: integer
        source: input
        description: minutes an OFFERED WaitlistEntry stays claimable; MUST be at or below hold_ttl_minutes so an offer always lapses before the hold reservation it minted
        default: 15
        constraints: "1 <= offer_ttl_minutes <= hold_ttl_minutes"
      - name: max_offer_rounds
        type: integer
        source: input
        description: how many times one WaitlistEntry may be promoted before it EXPIRES
        default: 2
        constraints: "1 <= max_offer_rounds <= 5"
      - name: max_name_changes
        type: integer
        source: input
        description: per-Reservation cap on primary_guest_name changes
        default: 1
        constraints: "0 <= max_name_changes <= 5"
      - name: name_change_cutoff_minutes
        type: integer
        source: input
        description: name changes are refused this many minutes before Service.seating_start_utc
        default: 240
        constraints: "0 <= name_change_cutoff_minutes <= 20160"
      - name: transfer_cutoff_minutes
        type: integer
        source: input
        description: ticket transfers are refused this many minutes before Service.seating_start_utc
        default: 1440
        constraints: "0 <= transfer_cutoff_minutes <= 20160"
      - name: max_transfers_per_guest
        type: integer
        source: input
        description: cap on Guest.transfers_initiated_count enforced at transfer time
        default: 2
        constraints: "0 <= max_transfers_per_guest <= 20"
      - name: no_show_grace_minutes
        type: integer
        source: input
        description: minutes after Reservation.seat_from_utc before a no-show may be declared
        default: 30
        constraints: "0 <= no_show_grace_minutes <= 240"
      - name: goodwill_credit_cap_cents
        type: integer
        source: input
        description: per-issue ceiling on GoodwillCredit.issued_cents
        default: 20000
        constraints: ">= 0"
      - name: prep_lead_minutes
        type: integer
        source: input
        description: length of the closed kitchen prep window that precedes each seating
        default: 45
        constraints: "1 <= prep_lead_minutes <= 240"
      - name: refund_scrutiny_threshold_cents
        type: integer
        source: input
        description: Guest.lifetime_refunded_cents above this value raises Guest.refund_scrutiny_flag
        default: 30000
        constraints: ">= 0"

  - name: Guest
    parent: null
    common_fields: true
    fields:
      - name: email
        type: string
        source: input
        description: guest login email; also the final deterministic tie-break key for waitlist ranking
        constraints: "non-empty, unique across Guest, max 160 chars"
      - name: display_name
        type: string
        source: input
        description: guest display name, used as the default successor primary_guest_name on transfer
        constraints: "non-empty, max 120 chars"
      - name: is_broker_flagged
        type: boolean
        source: input
        description: resale-prevention flag; a flagged guest may not receive a ticket transfer
        default: false
      - name: no_show_strikes
        type: integer
        source: computed
        description: count of Reservations of this guest in fulfillment_status NO_SHOW
        default: 0
      - name: completed_reservations_count
        type: integer
        source: computed
        description: count of Reservations of this guest in fulfillment_status COMPLETED
        default: 0
      - name: transfers_initiated_count
        type: integer
        source: computed
        description: count of Reservations of this guest in fulfillment_status TRANSFERRED_OUT
        default: 0
      - name: lifetime_refunded_cents
        type: integer
        source: computed
        description: sum of Reservation.refunded_cents over all Reservations whose guest_id is this guest
        default: 0
      - name: refund_scrutiny_flag
        type: boolean
        source: computed
        description: true once lifetime_refunded_cents > Restaurant.refund_scrutiny_threshold_cents of the restaurant that triggered the recompute
        default: false

  - name: Table
    parent: null
    common_fields: true
    fields:
      - name: restaurant_id
        type: string
        source: input
        description: "FK -> Restaurant.id; the restaurant that owns this table"
      - name: table_code
        type: string
        source: input
        description: floor-plan label
        constraints: "non-empty, unique per restaurant_id"
      - name: seats_min
        type: integer
        source: input
        description: smallest party the table may host
        constraints: "1 <= seats_min <= seats_max"
      - name: seats_max
        type: integer
        source: input
        description: largest party the table may host
        constraints: "seats_max >= seats_min, seats_max <= 20"
      - name: turn_buffer_minutes
        type: integer
        source: input
        description: reset minutes appended to Service.turn_time_minutes when computing occupancy
        default: 15
        constraints: "0 <= turn_buffer_minutes <= 120"

  - name: ExperiencePackage
    parent: null
    common_fields: true
    fields:
      - name: restaurant_id
        type: string
        source: input
        description: "FK -> Restaurant.id; the restaurant that sells this multi-course experience"
      - name: name
        type: string
        source: input
        description: experience name, e.g. "Eight Course Tasting"
        constraints: "non-empty, unique per restaurant_id"
      - name: course_count
        type: integer
        source: input
        description: number of courses in the experience
        constraints: "1 <= course_count <= 30"
      - name: base_price_cents
        type: integer
        source: input
        description: undiscounted list price per cover before any multiplier
        constraints: ">= 1"
      - name: prepayment_mode
        type: enum
        source: input
        description: whether the guest prepays a deposit or the full ticket at booking
        constraints: "one of {DEPOSIT, FULL}"
      - name: deposit_bp
        type: integer
        source: input
        description: deposit share of grand_total_cents in basis points; ignored when prepayment_mode is FULL
        default: 3000
        constraints: "1 <= deposit_bp <= 10000"
      - name: forfeiture_schedule_code
        type: enum
        source: input
        description: which cancellation forfeiture ladder applies
        default: STANDARD
        constraints: "one of {STANDARD, STRICT}"
      - name: forfeiture_basis
        type: enum
        source: input
        description: which amount the forfeiture percentage is applied to on cancellation
        default: DEPOSIT_BASIS
        constraints: "one of {DEPOSIT_BASIS, FULL_TICKET_BASIS}"
      - name: release_discount_bp
        type: integer
        source: input
        description: discount in basis points applied to release-run inventory offered off the waitlist
        default: 1500
        constraints: "0 <= release_discount_bp <= 5000"
      - name: kitchen_prep_minutes_per_cover
        type: integer
        source: input
        description: baseline kitchen prep minutes each cover consumes in its prep window
        default: 10
        constraints: "0 <= kitchen_prep_minutes_per_cover <= 240"
      - name: min_party_size
        type: integer
        source: input
        description: smallest bookable party for this experience
        constraints: "1 <= min_party_size <= max_party_size"
      - name: max_party_size
        type: integer
        source: input
        description: largest bookable party for this experience
        constraints: "max_party_size >= min_party_size, max_party_size <= 20"

  - name: AddOn
    parent: null
    common_fields: true
    fields:
      - name: restaurant_id
        type: string
        source: input
        description: "FK -> Restaurant.id; the restaurant that sells this add-on"
      - name: name
        type: string
        source: input
        description: add-on name; primary sort key for the pinned per-line charge accumulation order
        constraints: "non-empty, unique per restaurant_id"
      - name: price_cents
        type: integer
        source: input
        description: unit list price in cents
        constraints: ">= 1"
      - name: prep_minutes_per_unit
        type: integer
        source: input
        description: kitchen prep minutes consumed per ordered unit
        default: 0
        constraints: "0 <= prep_minutes_per_unit <= 120"
      - name: max_qty_per_cover
        type: integer
        source: input
        description: per-cover quantity ceiling; the line cap is max_qty_per_cover * Reservation.party_size
        default: 1
        constraints: "1 <= max_qty_per_cover <= 20"
      - name: order_cutoff_minutes
        type: integer
        source: input
        description: add-on orders are refused this many minutes before Service.seating_start_utc
        default: 1440
        constraints: "0 <= order_cutoff_minutes <= 20160"
      - name: requires_kitchen_ack
        type: boolean
        source: input
        description: reserved marker copied onto ReservationAddOn.ack_required at order time
        default: false

  - name: Service
    parent: null
    common_fields: true
    fields:
      - name: restaurant_id
        type: string
        source: input
        description: "FK -> Restaurant.id; the restaurant running this service"
      - name: service_date
        type: string
        source: input
        description: calendar date of the service in YYYY-MM-DD; sole input to day_of_week
        constraints: "ISO 8601 calendar date"
      - name: day_of_week
        type: enum
        source: computed
        description: proleptic-Gregorian weekday of service_date; drives the day-of-week price multiplier
        constraints: "one of {MON, TUE, WED, THU, FRI, SAT, SUN}"
      - name: meal_period
        type: enum
        source: input
        description: which sitting of the day this service covers
        constraints: "one of {LUNCH, DINNER}"
      - name: seating_start_utc
        type: datetime
        source: input
        description: first legal seat_from_utc and the anchor for every cutoff / release / forfeiture window
        constraints: "ISO 8601 UTC, strictly before seating_end_utc"
      - name: seating_end_utc
        type: datetime
        source: input
        description: last legal seat_from_utc; also the instant after which hold-sweep closes the service
        constraints: "ISO 8601 UTC, strictly after seating_start_utc"
      - name: turn_time_minutes
        type: integer
        source: input
        description: minutes a party occupies its table before the table turn buffer is added
        constraints: "15 <= turn_time_minutes <= 480"
      - name: demand_tier
        type: enum
        source: input
        description: demand band feeding the tier price multiplier
        default: STANDARD
        constraints: "one of {LOW, STANDARD, HIGH, PEAK}"
      - name: seats_capacity
        type: integer
        source: input
        description: ceiling on the sum of TicketClass.seats_allocated across this service
        constraints: ">= 1"
      - name: unsold_release_bp
        type: integer
        source: input
        description: share of each OPEN TicketClass's seats_available converted to release inventory by a release run
        default: 5000
        constraints: "0 <= unsold_release_bp <= 10000"
      - name: release_lead_minutes
        type: integer
        source: input
        description: a release run is only legal inside [seating_start_utc - release_lead_minutes, seating_start_utc)
        default: 180
        constraints: "1 <= release_lead_minutes <= 10080"
      - name: waitlist_policy
        type: enum
        source: input
        description: selects which of the two waitlist promotion ranking variants applies
        default: FAIR_QUEUE
        constraints: "one of {FAIR_QUEUE, YIELD_WEIGHTED}"
      - name: kitchen_prep_capacity_minutes
        type: integer
        source: input
        description: aggregate prep-minute ceiling for any set of reservations whose closed prep windows intersect
        default: 600
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: service lifecycle state
        default: DRAFT
        constraints: "one of {DRAFT, PUBLISHED, CLOSED, CANCELLED}"
      - name: release_run_count
        type: integer
        source: computed
        description: number of release runs executed against this service; also the run_seq of the next run minus one
        default: 0
      - name: seats_released_total
        type: integer
        source: computed
        description: cumulative seats moved into release inventory by all release runs of this service
        default: 0
      - name: last_release_released_count
        type: integer
        source: computed
        description: seats moved into release inventory by the most recent release run only; 0 before the first run
        default: 0
      - name: last_release_promoted_count
        type: integer
        source: computed
        description: WaitlistEntry rows promoted to OFFERED by the most recent release run only; 0 when the candidate set was empty
        default: 0
      - name: covers_confirmed
        type: integer
        source: computed
        description: sum of Reservation.party_size over this service's reservations in fulfillment_status IN {CONFIRMED, SEATED, COMPLETED}
        default: 0
      - name: gross_charged_cents
        type: integer
        source: computed
        description: sum of PaymentTransaction.amount_cents with kind IN {DEPOSIT_CHARGE, BALANCE_CHARGE, GOODWILL_REDEMPTION, TRANSFER_IN} over this service's reservations
        default: 0
      - name: refunded_cents
        type: integer
        source: computed
        description: sum of PaymentTransaction.amount_cents with kind == REFUND over this service's reservations
        default: 0
      - name: forfeited_cents
        type: integer
        source: computed
        description: sum of PaymentTransaction.amount_cents with kind == FORFEITURE minus kind == FORFEITURE_REVERSAL over this service's reservations
        default: 0
      - name: net_settled_cents
        type: integer
        source: computed
        description: gross_charged_cents minus refunded_cents
        default: 0

  - name: TicketClass
    parent: null
    common_fields: true
    fields:
      - name: service_id
        type: string
        source: input
        description: "FK -> Service.id; the service whose seats this class sells"
      - name: package_id
        type: string
        source: input
        description: "FK -> ExperiencePackage.id; the experience packaged into this class"
      - name: seats_allocated
        type: integer
        source: input
        description: fixed size of this class's seat pool; never mutated after creation
        constraints: ">= 1"
      - name: min_party_size
        type: integer
        source: input
        description: smallest party this class accepts; defaults to ExperiencePackage.min_party_size
        constraints: "min_party_size >= ExperiencePackage.min_party_size"
      - name: max_party_size
        type: integer
        source: input
        description: largest party this class accepts; defaults to ExperiencePackage.max_party_size
        constraints: "max_party_size <= ExperiencePackage.max_party_size"
      - name: seats_sold
        type: integer
        source: computed
        description: seats held by reservations in fulfillment_status IN {CONFIRMED, SEATED, COMPLETED}; maintained incrementally by every transition
        default: 0
      - name: seats_held
        type: integer
        source: computed
        description: seats held by reservations in fulfillment_status PENDING; maintained incrementally by every transition
        default: 0
      - name: seats_released
        type: integer
        source: computed
        description: unsold seats converted to release inventory by a release run and not yet offered; maintained incrementally
        default: 0
      - name: seats_available
        type: integer
        source: computed
        description: unreserved seats still sellable at list price; maintained incrementally, initialised to seats_allocated
        default: 0
      - name: sell_through_bp
        type: integer
        source: computed
        description: floor(10000 * (seats_sold + seats_held) / seats_allocated); sole input to the scarcity price step, so a mere hold already moves the price
        default: 0
      - name: list_price_per_cover_cents
        type: integer
        source: computed
        description: current per-cover price from ticket_price_per_cover with the LIST drawing pool, i.e. steps 1 through 4 without the release discount
        default: 0
      - name: release_price_per_cover_cents
        type: integer
        source: computed
        description: current per-cover price from ticket_price_per_cover with the RELEASED drawing pool, i.e. list_price_per_cover_cents after ExperiencePackage.release_discount_bp
        default: 0
      - name: status
        type: enum
        source: system
        description: sellability state of the class
        default: OPEN
        constraints: "one of {OPEN, PAUSED, SOLD_OUT, RELEASED, CLOSED}"

  - name: Reservation
    parent: null
    common_fields: true
    fields:
      - name: service_id
        type: string
        source: system
        description: "FK -> Service.id; copied from TicketClass.service_id at creation and never changed"
      - name: ticket_class_id
        type: string
        source: input
        description: "FK -> TicketClass.id; the seat pool this reservation draws from"
      - name: guest_id
        type: string
        source: input
        description: "FK -> Guest.id; the account that owns the ticket"
      - name: assigned_table_id
        type: string
        source: system
        description: "FK -> Table.id; null until a table is assigned"
        default: null
      - name: transferred_from_reservation_id
        type: string
        source: system
        description: "FK -> Reservation.id; set on a successor created by a ticket transfer, null otherwise"
        default: null
      - name: party_size
        type: integer
        source: input
        description: number of covers
        constraints: "TicketClass.min_party_size <= party_size <= TicketClass.max_party_size"
      - name: primary_guest_name
        type: string
        source: input
        description: name printed on the ticket; mutated by name-change and by transfer
        constraints: "non-empty, max 120 chars"
      - name: fulfillment_status
        type: enum
        source: system
        description: seating-side state dimension
        default: PENDING
        constraints: "one of {PENDING, CONFIRMED, SEATED, COMPLETED, CANCELLED, NO_SHOW, TRANSFERRED_OUT, EXPIRED}"
      - name: payment_status
        type: enum
        source: computed
        description: money-side state dimension, derived by payment_status_derivation from the ledger
        default: UNPAID
        constraints: "one of {UNPAID, DEPOSIT_PAID, FULLY_PAID, PARTIALLY_REFUNDED, REFUNDED, FORFEITED, TRANSFERRED}"
      - name: is_release_priced
        type: boolean
        source: system
        description: true when the reservation was minted from release inventory by a release run
        default: false
      - name: price_locked_per_cover_cents
        type: integer
        source: system
        description: per-cover price frozen at creation; never re-priced afterwards
      - name: ticket_subtotal_cents
        type: integer
        source: computed
        description: price_locked_per_cover_cents * party_size
        default: 0
      - name: add_on_total_cents
        type: integer
        source: computed
        description: sum of ReservationAddOn.line_subtotal_cents over this reservation's add-on lines
        default: 0
      - name: service_charge_cents
        type: integer
        source: computed
        description: per-line rounded service charge total from reservation_charge_breakdown
        default: 0
      - name: grand_total_cents
        type: integer
        source: computed
        description: ticket_subtotal_cents + add_on_total_cents + service_charge_cents
        default: 0
      - name: deposit_due_cents
        type: integer
        source: computed
        description: amount the first DEPOSIT_CHARGE must equal; frozen at the instant the first DEPOSIT_CHARGE lands
        default: 0
      - name: deposit_frozen
        type: boolean
        source: system
        description: true once a DEPOSIT_CHARGE has landed, after which deposit_due_cents stops tracking grand_total_cents
        default: false
      - name: balance_due_cents
        type: integer
        source: computed
        description: max(0, grand_total_cents - amount_paid_cents)
        default: 0
      - name: amount_paid_cents
        type: integer
        source: computed
        description: ledger roll-up of inbound money; see money_ledger_rollup
        default: 0
      - name: goodwill_applied_cents
        type: integer
        source: computed
        description: sum of PaymentTransaction.amount_cents with kind == GOODWILL_REDEMPTION on this reservation
        default: 0
      - name: refunded_cents
        type: integer
        source: computed
        description: sum of PaymentTransaction.amount_cents with kind == REFUND on this reservation
        default: 0
      - name: forfeited_cents
        type: integer
        source: computed
        description: sum of kind == FORFEITURE minus sum of kind == FORFEITURE_REVERSAL on this reservation
        default: 0
      - name: hold_expires_at_utc
        type: datetime
        source: system
        description: instant a PENDING hold lapses; null once the reservation leaves PENDING
        default: null
      - name: seat_from_utc
        type: datetime
        source: system
        description: assigned seating start; null until a table is assigned
        default: null
      - name: seat_to_utc
        type: datetime
        source: computed
        description: seat_from_utc + Service.turn_time_minutes + Table.turn_buffer_minutes; null until a table is assigned
        default: null
      - name: prep_minutes_total
        type: integer
        source: computed
        description: kitchen prep minutes this reservation demands in its closed prep window
        default: 0
      - name: name_change_count
        type: integer
        source: system
        description: number of successful name changes on this reservation; reset to 0 on a transfer successor
        default: 0
      - name: cancel_settlement_basis
        type: enum
        source: system
        description: which cancellation_settlement variant actually ran; null until the reservation settles
        default: null
        constraints: "one of {DEPOSIT_BASIS, FULL_TICKET_BASIS, NO_SHOW_FULL, RESTAURANT_INITIATED} or null"

  - name: ReservationAddOn
    parent: null
    common_fields: true
    fields:
      - name: reservation_id
        type: string
        source: input
        description: "FK -> Reservation.id; the reservation this add-on line belongs to"
      - name: add_on_id
        type: string
        source: input
        description: "FK -> AddOn.id; the add-on ordered"
      - name: qty
        type: integer
        source: input
        description: units ordered on this line
        constraints: "qty >= 1 and qty <= AddOn.max_qty_per_cover * Reservation.party_size"
      - name: unit_price_cents_locked
        type: integer
        source: system
        description: AddOn.price_cents frozen at order time; survives later AddOn price edits
      - name: line_subtotal_cents
        type: integer
        source: computed
        description: unit_price_cents_locked * qty
        default: 0
      - name: line_service_charge_cents
        type: integer
        source: computed
        description: round_half_up(line_subtotal_cents * Restaurant.service_charge_bp / 10000), rounded on this line alone
        default: 0
      - name: line_prep_minutes
        type: integer
        source: computed
        description: AddOn.prep_minutes_per_unit * qty
        default: 0
      - name: ack_required
        type: boolean
        source: system
        description: copy of AddOn.requires_kitchen_ack at order time
        default: false

  - name: DietaryNote
    parent: null
    common_fields: true
    fields:
      - name: reservation_id
        type: string
        source: input
        description: "FK -> Reservation.id; the reservation this note belongs to"
      - name: guest_index
        type: integer
        source: input
        description: which cover in the party the note applies to, 1-based
        constraints: "1 <= guest_index <= Reservation.party_size"
      - name: restriction_code
        type: enum
        source: input
        description: the dietary restriction being declared
        constraints: "one of {GLUTEN, DAIRY, SHELLFISH, NUT, SOY, VEGAN, PESCATARIAN, OTHER}"
      - name: severity
        type: enum
        source: input
        description: clinical severity; sole input to prep_minutes and to the ack gate
        constraints: "one of {INFO, ALLERGY, ANAPHYLAXIS}"
      - name: note_text
        type: string
        source: input
        description: free-text detail for the kitchen
        default: ""
        constraints: "max 500 chars"
      - name: prep_minutes
        type: integer
        source: computed
        description: SEVERITY_PREP_MINUTES[severity] from dietary_prep_minutes
        default: 0
      - name: ack_status
        type: enum
        source: system
        description: kitchen acknowledgement state
        default: PENDING
        constraints: "one of {PENDING, ACKED, PREP_REJECTED}"
      - name: reject_reason_code
        type: enum
        source: system
        description: why the kitchen rejected the note; null unless ack_status is PREP_REJECTED
        default: null
        constraints: "one of {CROSS_CONTAMINATION_RISK, INGREDIENT_UNAVAILABLE, DETAIL_INSUFFICIENT} or null"
      - name: amend_count
        type: integer
        source: system
        description: number of times the guest amended this note out of PREP_REJECTED
        default: 0
      - name: acked_by_user_id
        type: string
        source: system
        description: X-User-ID of the KitchenLead who last decided this note; null while PENDING
        default: null

  - name: WaitlistEntry
    parent: null
    common_fields: true
    fields:
      - name: service_id
        type: string
        source: input
        description: "FK -> Service.id; the service being waited for"
      - name: guest_id
        type: string
        source: input
        description: "FK -> Guest.id; the waiting guest"
      - name: requested_package_id
        type: string
        source: input
        description: "FK -> ExperiencePackage.id; when non-null the entry is only eligible for ticket classes of this package"
        default: null
      - name: offered_reservation_id
        type: string
        source: system
        description: "FK -> Reservation.id; the hold reservation minted by the current offer, null while WAITING"
        default: null
      - name: party_size
        type: integer
        source: input
        description: covers requested
        constraints: "1 <= party_size <= 20"
      - name: status
        type: enum
        source: system
        description: waitlist lifecycle state
        default: WAITING
        constraints: "one of {WAITING, OFFERED, CLAIMED, EXPIRED, WITHDRAWN}"
      - name: offer_round
        type: integer
        source: system
        description: how many offers this entry has already received; compared against Restaurant.max_offer_rounds
        default: 0
      - name: offer_expires_at_utc
        type: datetime
        source: system
        description: instant the current offer lapses; null while not OFFERED
        default: null
      - name: priority_penalty_applied
        type: boolean
        source: system
        description: true once the owning guest's refund_scrutiny_flag propagated to this entry
        default: false
      - name: priority_score
        type: integer
        source: computed
        description: waitlist_priority_score output; the YIELD_WEIGHTED ranking key
        default: 0

  - name: PaymentTransaction
    parent: null
    common_fields: false
    fields:
      - name: reservation_id
        type: string
        source: input
        description: "FK -> Reservation.id; the reservation whose ledger this row belongs to"
      - name: goodwill_credit_id
        type: string
        source: system
        description: "FK -> GoodwillCredit.id; set only on GOODWILL_REDEMPTION rows, null otherwise"
        default: null
      - name: kind
        type: enum
        source: input
        description: ledger row type; fixes the sign of signed_amount_cents
        constraints: "one of {DEPOSIT_CHARGE, BALANCE_CHARGE, GOODWILL_REDEMPTION, TRANSFER_IN, TRANSFER_OUT, REFUND, FORFEITURE, FORFEITURE_REVERSAL}"
      - name: amount_cents
        type: integer
        source: input
        description: unsigned magnitude of the ledger row
        constraints: ">= 1"
      - name: signed_amount_cents
        type: integer
        source: computed
        description: "+amount_cents for kind IN {DEPOSIT_CHARGE, BALANCE_CHARGE, GOODWILL_REDEMPTION, TRANSFER_IN, FORFEITURE_REVERSAL}; -amount_cents for kind IN {TRANSFER_OUT, REFUND, FORFEITURE}"
      - name: memo_code
        type: enum
        source: system
        description: why the row was written
        constraints: "one of {GUEST_PREPAY, GUEST_BALANCE, CREDIT_APPLIED, TRANSFER_MOVE, GUEST_CANCEL, NO_SHOW, SERVICE_CANCEL, HOLD_LAPSE, REFUND_EXCEPTION}"

  - name: RefundException
    parent: null
    common_fields: true
    fields:
      - name: reservation_id
        type: string
        source: input
        description: "FK -> Reservation.id; the settled reservation the guest is contesting"
      - name: reason_code
        type: enum
        source: input
        description: stated ground for the exception
        constraints: "one of {MEDICAL, TRAVEL_DISRUPTION, KITCHEN_ERROR, WEATHER, OTHER}"
      - name: requested_cents
        type: integer
        source: input
        description: additional refund the guest asks for on top of refunded_cents already returned
        constraints: "1 <= requested_cents <= Reservation.amount_paid_cents - Reservation.refunded_cents"
      - name: status
        type: enum
        source: system
        description: adjudication state
        default: REQUESTED
        constraints: "one of {REQUESTED, APPROVED, DENIED}"
      - name: requested_by_user_id
        type: string
        source: system
        description: X-User-ID of whoever filed the request; blocks that same id from deciding it
      - name: decided_by_user_id
        type: string
        source: system
        description: X-User-ID of the GuestServices operator who decided; null while REQUESTED
        default: null
      - name: approved_cents
        type: integer
        source: system
        description: cents actually released back to the guest; 0 on DENIED
        default: 0
      - name: shortfall_cents
        type: integer
        source: computed
        description: requested_cents - approved_cents; the ceiling for a compensating GoodwillCredit
        default: 0
      - name: decision_note_code
        type: enum
        source: system
        description: adjudication rationale
        default: null
        constraints: "one of {POLICY_EXCEPTION, PARTIAL_GOODWILL, EVIDENCE_INSUFFICIENT, OUT_OF_POLICY} or null"

  - name: GoodwillCredit
    parent: null
    common_fields: true
    fields:
      - name: refund_exception_id
        type: string
        source: input
        description: "FK -> RefundException.id; the APPROVED exception whose shortfall this credit compensates"
      - name: guest_id
        type: string
        source: system
        description: "FK -> Guest.id; copied from the exception's reservation at issue time"
      - name: restaurant_id
        type: string
        source: system
        description: "FK -> Restaurant.id; copied from the exception's reservation service at issue time"
      - name: issued_cents
        type: integer
        source: input
        description: face value of the credit
        constraints: "1 <= issued_cents <= min(Restaurant.goodwill_credit_cap_cents, RefundException.shortfall_cents)"
      - name: expires_at_utc
        type: datetime
        source: input
        description: instant after which the credit may no longer be redeemed
        constraints: "ISO 8601 UTC, strictly after the logical clock at issue time"
      - name: redeemed_cents
        type: integer
        source: computed
        description: sum of PaymentTransaction.amount_cents with kind == GOODWILL_REDEMPTION and goodwill_credit_id == this credit
        default: 0
      - name: revoked_cents
        type: integer
        source: system
        description: cents clawed back by revocation
        default: 0
      - name: remaining_cents
        type: integer
        source: computed
        description: issued_cents - redeemed_cents - revoked_cents
        default: 0
      - name: status
        type: enum
        source: system
        description: credit lifecycle state
        default: ISSUED
        constraints: "one of {ISSUED, PARTIALLY_REDEEMED, EXHAUSTED, REVOKED}"
      - name: issued_by_user_id
        type: string
        source: system
        description: X-User-ID of the GuestServices operator who issued the credit; must differ from RefundException.decided_by_user_id

# -----------------------------------------------------------------------------
# §1.2 State Machine Table
#
# `state_machine_shape: parallel` — Reservation carries two independent state
# dimensions on one row, so every machine below names the field it governs via
# `state_field:`. Reservation appears twice (fulfillment_status and
# payment_status) and the two advance on different triggers.
# -----------------------------------------------------------------------------
state_machines:

  - entity: Service
    state_field: status
    initial_state: DRAFT
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /services/{id}/publish"
        actor: RestaurantManager
        preconditions:
          - "service.status == DRAFT"
          - "at least one TicketClass exists with service_id == service.id"
          - "sum of TicketClass.seats_allocated over the service <= service.seats_capacity"
          - "service.seating_start_utc is strictly after the logical clock"
        side_effects:
          - "every TicketClass of the service is recomputed by the seat-pool precedence ladder (OPEN when seats_available > 0)"
          - "reservations become creatable against the service"
      - from: PUBLISHED
        to: CLOSED
        trigger: "POST /services/{id}/hold-sweep with close_service = true"
        actor: PlatformAdmin
        preconditions:
          - "service.status == PUBLISHED"
          - "the logical clock is at or after service.seating_end_utc"
          - "no Reservation of the service is in fulfillment_status PENDING (run the sweep first)"
        side_effects:
          - "every TicketClass of the service moves to CLOSED"
          - "service.net_settled_cents is recomputed as gross_charged_cents - refunded_cents"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /services/{id}/cancel"
        actor: RestaurantManager
        preconditions:
          - "service.status == DRAFT"
        side_effects:
          - "every TicketClass of the service moves to CLOSED"
      - from: PUBLISHED
        to: CANCELLED
        trigger: "POST /services/{id}/cancel"
        actor: RestaurantManager
        preconditions:
          - "service.status == PUBLISHED"
        side_effects:
          - "every Reservation with fulfillment_status IN {PENDING, CONFIRMED} moves to CANCELLED with cancel_settlement_basis = RESTAURANT_INITIATED"
          - "each such reservation is refunded in full: a REFUND PaymentTransaction of amount_paid_cents - refunded_cents is written with memo_code = SERVICE_CANCEL, forfeited_cents stays 0"
          - "every WaitlistEntry with status IN {WAITING, OFFERED} moves to WITHDRAWN"
          - "every TicketClass of the service moves to CLOSED"
          - "service.refunded_cents and service.net_settled_cents are recomputed"
        note: "restaurant-initiated cancellation never forfeits, regardless of forfeiture_schedule_code or hours to service"

  - entity: TicketClass
    state_field: status
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: PAUSED
        trigger: "POST /ticket-classes/{id}/pause"
        actor: RestaurantManager
        preconditions:
          - "ticket_class.status == OPEN"
        side_effects:
          - "the class stops accepting new reservations and stops being an eligible waitlist promotion target"
      - from: PAUSED
        to: OPEN
        trigger: "POST /ticket-classes/{id}/resume"
        actor: RestaurantManager
        preconditions:
          - "ticket_class.status == PAUSED"
          - "the owning Service is in status PUBLISHED"
        side_effects:
          - "the seat-pool precedence ladder is re-evaluated; this row fires when seats_released == 0 and seats_available > 0"
      - from: PAUSED
        to: RELEASED
        trigger: "POST /ticket-classes/{id}/resume"
        actor: RestaurantManager
        preconditions:
          - "ticket_class.status == PAUSED"
          - "the owning Service is in status PUBLISHED"
        side_effects:
          - "the seat-pool precedence ladder is re-evaluated; this row fires when seats_released > 0"
      - from: PAUSED
        to: SOLD_OUT
        trigger: "POST /ticket-classes/{id}/resume"
        actor: RestaurantManager
        preconditions:
          - "ticket_class.status == PAUSED"
          - "the owning Service is in status PUBLISHED"
        side_effects:
          - "the seat-pool precedence ladder is re-evaluated; this row fires when seats_released == 0 and seats_available == 0"
      - from: OPEN
        to: SOLD_OUT
        trigger: "system, on any seat-consuming write (POST /reservations, waitlist claim, release-run promotion)"
        actor: system
        preconditions:
          - "after the write, seats_available == 0 and seats_released == 0"
        side_effects:
          - "further POST /reservations against this class fail with ERR_TICKET_CLASS_NOT_SELLABLE"
      - from: SOLD_OUT
        to: OPEN
        trigger: "system, on any seat-restoring write (cancel, no-show, hold expiry)"
        actor: system
        preconditions:
          - "after the write, seats_available > 0 and seats_released == 0"
        side_effects:
          - "when the restoring write was a cancel or a no-show, the highest-ranked eligible WaitlistEntry is promoted (see cascade B); a hold expiry never promotes"
      - from: OPEN
        to: RELEASED
        trigger: "POST /services/{id}/release-run"
        actor: RestaurantManager
        preconditions:
          - "the owning Service is in status PUBLISHED"
          - "the logical clock is at or after service.seating_start_utc - service.release_lead_minutes"
          - "after the run, seats_released > 0"
        side_effects:
          - "seats_released is credited with floor(seats_available * service.unsold_release_bp / 10000) and seats_available is debited by the same count"
          - "list_price_per_cover_cents for release-priced sales is discounted by ExperiencePackage.release_discount_bp"
      - from: SOLD_OUT
        to: RELEASED
        trigger: "POST /services/{id}/release-run"
        actor: RestaurantManager
        preconditions:
          - "the owning Service is in status PUBLISHED"
          - "after the run, seats_released > 0"
        side_effects:
          - "same seat move as OPEN -> RELEASED; fires when a previously exhausted class regains inventory from a concurrent cancel earlier in the same epoch"
      - from: RELEASED
        to: SOLD_OUT
        trigger: "system, on any seat-consuming write"
        actor: system
        preconditions:
          - "after the write, seats_released == 0 and seats_available == 0"
        side_effects:
          - "the class stops being an eligible waitlist promotion target"
      - from: RELEASED
        to: OPEN
        trigger: "system, on any seat-restoring write"
        actor: system
        preconditions:
          - "after the write, seats_released == 0 and seats_available > 0"
        side_effects:
          - "subsequent sales revert to list price (is_release_priced = false)"
      - from: OPEN
        to: CLOSED
        trigger: "POST /services/{id}/cancel or POST /services/{id}/hold-sweep with close_service = true"
        actor: system
        preconditions:
          - "the owning Service left PUBLISHED or DRAFT"
        side_effects: []
      - from: PAUSED
        to: CLOSED
        trigger: "POST /services/{id}/cancel or POST /services/{id}/hold-sweep with close_service = true"
        actor: system
        preconditions:
          - "the owning Service left PUBLISHED or DRAFT"
        side_effects: []
      - from: SOLD_OUT
        to: CLOSED
        trigger: "POST /services/{id}/cancel or POST /services/{id}/hold-sweep with close_service = true"
        actor: system
        preconditions:
          - "the owning Service left PUBLISHED or DRAFT"
        side_effects: []
      - from: RELEASED
        to: CLOSED
        trigger: "POST /services/{id}/cancel or POST /services/{id}/hold-sweep with close_service = true"
        actor: system
        preconditions:
          - "the owning Service left PUBLISHED or DRAFT"
        side_effects: []
    note: |
      Seat-pool precedence ladder (pinned, evaluated after EVERY seat move on the
      class, in this order): (1) status == PAUSED is sticky and only resume leaves
      it; (2) status == CLOSED is terminal; (3) seats_released > 0 -> RELEASED;
      (4) seats_available > 0 -> OPEN; (5) otherwise SOLD_OUT. RELEASED therefore
      outranks OPEN when both pools are non-empty.

  - entity: Reservation
    state_field: fulfillment_status
    initial_state: PENDING
    terminal_states: [COMPLETED, CANCELLED, NO_SHOW, TRANSFERRED_OUT, EXPIRED]
    transitions:
      - from: PENDING
        to: CONFIRMED
        trigger: "POST /reservations/{id}/confirm"
        actor: Guest
        preconditions:
          - "reservation.fulfillment_status == PENDING"
          - "the logical clock is strictly before reservation.hold_expires_at_utc"
          - "reservation.payment_status IN {DEPOSIT_PAID, FULLY_PAID} (ERR_DEPOSIT_NOT_SETTLED otherwise)"
          - "the owning TicketClass is not CLOSED"
        side_effects:
          - "reservation.hold_expires_at_utc is cleared to null"
          - "reservation.deposit_frozen is set to true, freezing deposit_due_cents against later add-on or price changes"
          - "TicketClass.seats_held is debited by party_size and seats_sold is credited by party_size (the seat-pool total is unchanged)"
          - "Service.covers_confirmed is credited by party_size"
      - from: PENDING
        to: EXPIRED
        trigger: "POST /services/{id}/hold-sweep"
        actor: PlatformAdmin
        preconditions:
          - "reservation.fulfillment_status == PENDING"
          - "the logical clock is at or after reservation.hold_expires_at_utc"
        side_effects:
          - "TicketClass.seats_held is debited by party_size and the seats return to the pool they came from (seats_released when is_release_priced, else seats_available)"
          - "the seat-pool precedence ladder is re-evaluated, but NO waitlist promotion is triggered"
          - "any amount_paid_cents is refunded in full with memo_code = HOLD_LAPSE"
          - "when the reservation came from a waitlist offer, that WaitlistEntry returns to WAITING with offer_round incremented, or moves to EXPIRED once offer_round reaches Restaurant.max_offer_rounds"
      - from: PENDING
        to: CANCELLED
        trigger: "POST /reservations/{id}/cancel"
        actor: Guest
        preconditions:
          - "reservation.fulfillment_status == PENDING"
        side_effects:
          - "cancellation_settlement runs; a PENDING reservation is always settled at 0 bp forfeiture regardless of hours to service, because the seats were never sold"
          - "TicketClass.seats_held is debited by party_size and the seats return to their originating pool"
          - "any linked WaitlistEntry moves to WITHDRAWN"
      - from: CONFIRMED
        to: SEATED
        trigger: "POST /reservations/{id}/seat"
        actor: RestaurantManager
        preconditions:
          - "reservation.fulfillment_status == CONFIRMED"
          - "reservation.assigned_table_id is not null"
          - "every DietaryNote of the reservation with severity == ANAPHYLAXIS has ack_status == ACKED"
          - "no DietaryNote of the reservation is in ack_status PREP_REJECTED"
          - "the logical clock is at or after reservation.seat_from_utc"
        side_effects:
          - "reservation.seat_to_utc is pinned to seat_from_utc + Service.turn_time_minutes"
      - from: CONFIRMED
        to: NO_SHOW
        trigger: "POST /reservations/{id}/no-show"
        actor: RestaurantManager
        preconditions:
          - "reservation.fulfillment_status == CONFIRMED"
          - "the logical clock is at or after reservation.seat_from_utc + Restaurant.no_show_grace_minutes"
        side_effects:
          - "cancel_settlement_basis is set to NO_SHOW_FULL and the entire amount_paid_cents balance is forfeited (FORFEITURE row, memo_code = NO_SHOW)"
          - "Guest.no_show_strikes is credited by 1, depressing that guest's waitlist_priority_score everywhere"
          - "TicketClass.seats_sold is debited by party_size and the seats return to seats_available"
          - "the seat-pool precedence ladder is re-evaluated; on a SOLD_OUT -> OPEN transition the highest-ranked eligible WaitlistEntry is promoted"
          - "Service.covers_confirmed is debited by party_size and Service.forfeited_cents is credited"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /reservations/{id}/cancel"
        actor: Guest
        preconditions:
          - "reservation.fulfillment_status == CONFIRMED"
          - "the logical clock is strictly before reservation.seat_from_utc"
        side_effects:
          - "cancellation_settlement runs on the package's forfeiture_basis and forfeiture_schedule_code, writing at most one FORFEITURE row and at most one REFUND row with memo_code = GUEST_CANCEL"
          - "TicketClass.seats_sold is debited by party_size and the seats return to seats_available"
          - "the seat-pool precedence ladder is re-evaluated; on a SOLD_OUT -> OPEN transition the highest-ranked eligible WaitlistEntry is promoted"
          - "Service.covers_confirmed is debited, Service.refunded_cents and Service.forfeited_cents are credited, Service.net_settled_cents is recomputed"
          - "Guest.lifetime_refunded_cents is credited by the refund; crossing Restaurant.refund_scrutiny_threshold_cents raises Guest.refund_scrutiny_flag"
      - from: CONFIRMED
        to: TRANSFERRED_OUT
        trigger: "POST /reservations/{id}/transfer"
        actor: Guest
        preconditions:
          - "reservation.fulfillment_status == CONFIRMED"
          - "reservation.payment_status == FULLY_PAID (ERR_TRANSFER_REQUIRES_FULL_PAYMENT otherwise)"
          - "the logical clock is at or before service.seating_start_utc - Restaurant.transfer_cutoff_minutes"
          - "the recipient Guest has is_broker_flagged == false"
          - "reservation.transferred_from_reservation_id is null (a transferred ticket may not be transferred onward)"
          - "the initiating Guest.transfers_initiated_count is strictly below Restaurant.max_transfers_per_guest"
        side_effects:
          - "a successor Reservation is created for the recipient guest in fulfillment_status CONFIRMED with transferred_from_reservation_id pointing at this row, identical party_size, price_locked_per_cover_cents, add-on lines and totals"
          - "a TRANSFER_OUT PaymentTransaction of amount_paid_cents is written on this row and a matching TRANSFER_IN row on the successor (memo_code = TRANSFER_MOVE), so cash is conserved across the pair"
          - "payment_status on this row becomes TRANSFERRED; the successor inherits FULLY_PAID"
          - "every DietaryNote is copied to the successor with ack_status reset to PENDING"
          - "Guest.transfers_initiated_count on the initiator is credited by 1"
          - "TicketClass seat counters are unchanged (the seats move with the successor, they are not returned to the pool)"
      - from: SEATED
        to: COMPLETED
        trigger: "POST /reservations/{id}/complete"
        actor: RestaurantManager
        preconditions:
          - "reservation.fulfillment_status == SEATED"
          - "reservation.payment_status == FULLY_PAID (ERR_BALANCE_OUTSTANDING otherwise)"
        side_effects:
          - "Guest.completed_reservations_count is credited by 1, lifting that guest's waitlist_priority_score"
          - "Service.gross_charged_cents is reconciled against the reservation ledger"
        note: "this is the sole crossing point where the fulfillment dimension is gated by the payment dimension"

  - entity: Reservation
    state_field: payment_status
    initial_state: UNPAID
    terminal_states: [REFUNDED, FORFEITED, TRANSFERRED]
    transitions:
      - from: UNPAID
        to: DEPOSIT_PAID
        trigger: "POST /reservations/{id}/payments"
        actor: Guest
        preconditions:
          - "the cumulative amount_paid_cents after the payment is at or above deposit_due_cents but strictly below grand_total_cents"
          - "reservation.fulfillment_status NOT IN {CANCELLED, NO_SHOW, EXPIRED, TRANSFERRED_OUT, COMPLETED}"
        side_effects:
          - "a DEPOSIT_CHARGE PaymentTransaction is written with memo_code = GUEST_PREPAY"
          - "balance_due_cents is recomputed as grand_total_cents - amount_paid_cents"
      - from: UNPAID
        to: FULLY_PAID
        trigger: "POST /reservations/{id}/payments"
        actor: Guest
        preconditions:
          - "the cumulative amount_paid_cents after the payment is at or above grand_total_cents"
        side_effects:
          - "a DEPOSIT_CHARGE PaymentTransaction is written when the reservation had paid nothing yet, otherwise a BALANCE_CHARGE row"
          - "balance_due_cents becomes 0"
      - from: DEPOSIT_PAID
        to: FULLY_PAID
        trigger: "POST /reservations/{id}/payments"
        actor: Guest
        preconditions:
          - "the cumulative amount_paid_cents after the payment is at or above grand_total_cents"
        side_effects:
          - "a BALANCE_CHARGE PaymentTransaction is written with memo_code = GUEST_BALANCE"
          - "balance_due_cents becomes 0, unblocking POST /reservations/{id}/complete and POST /reservations/{id}/transfer"
      - from: DEPOSIT_PAID
        to: PARTIALLY_REFUNDED
        trigger: "POST /reservations/{id}/cancel with a forfeiture band strictly between 0 bp and full retention"
        actor: Guest
        preconditions:
          - "cancellation_settlement yields refund_cents > 0 and retained_cents > 0"
        side_effects:
          - "one FORFEITURE row and one REFUND row are written; refunded_cents + forfeited_cents == amount_paid_cents"
      - from: FULLY_PAID
        to: PARTIALLY_REFUNDED
        trigger: "POST /reservations/{id}/cancel with a forfeiture band strictly between 0 bp and full retention"
        actor: Guest
        preconditions:
          - "cancellation_settlement yields refund_cents > 0 and retained_cents > 0"
        side_effects:
          - "one FORFEITURE row and one REFUND row are written"
      - from: DEPOSIT_PAID
        to: REFUNDED
        trigger: "POST /reservations/{id}/cancel at 0 bp forfeiture, or POST /services/{id}/cancel, or hold expiry"
        actor: Guest
        preconditions:
          - "cancellation_settlement yields retained_cents == 0"
        side_effects:
          - "a single REFUND row for the whole amount_paid_cents is written; forfeited_cents stays 0"
      - from: FULLY_PAID
        to: REFUNDED
        trigger: "POST /reservations/{id}/cancel at 0 bp forfeiture, or POST /services/{id}/cancel"
        actor: Guest
        preconditions:
          - "cancellation_settlement yields retained_cents == 0"
        side_effects:
          - "a single REFUND row for the whole amount_paid_cents is written"
      - from: DEPOSIT_PAID
        to: FORFEITED
        trigger: "POST /reservations/{id}/cancel where retention consumes everything paid, or POST /reservations/{id}/no-show"
        actor: Guest
        preconditions:
          - "cancellation_settlement yields refund_cents == 0 and retained_cents == amount_paid_cents"
        side_effects:
          - "a single FORFEITURE row for the whole amount_paid_cents is written; refunded_cents stays 0"
      - from: FULLY_PAID
        to: FORFEITED
        trigger: "POST /reservations/{id}/cancel where retention consumes everything paid, or POST /reservations/{id}/no-show"
        actor: Guest
        preconditions:
          - "cancellation_settlement yields refund_cents == 0"
        side_effects:
          - "a single FORFEITURE row for the whole amount_paid_cents is written"
      - from: FORFEITED
        to: PARTIALLY_REFUNDED
        trigger: "POST /refund-exceptions/{id}/decide with decision APPROVED"
        actor: GuestServices
        preconditions:
          - "refund_exception.status == REQUESTED"
          - "0 < approved_cents < forfeited_cents"
        side_effects:
          - "a FORFEITURE_REVERSAL row of approved_cents and a REFUND row of approved_cents are written with memo_code = REFUND_EXCEPTION, keeping the signed ledger sum aligned with amount_paid - refunded - forfeited"
          - "forfeited_cents is debited by approved_cents and refunded_cents is credited by approved_cents"
        note: "this is the compensating transition; it is the only way a terminal payment state is re-opened"
      - from: PARTIALLY_REFUNDED
        to: REFUNDED
        trigger: "POST /refund-exceptions/{id}/decide with decision APPROVED for the entire remaining forfeiture"
        actor: GuestServices
        preconditions:
          - "approved_cents == forfeited_cents"
        side_effects:
          - "forfeited_cents becomes 0 and refunded_cents becomes amount_paid_cents"
      - from: FULLY_PAID
        to: TRANSFERRED
        trigger: "POST /reservations/{id}/transfer"
        actor: Guest
        preconditions:
          - "reservation.fulfillment_status moves to TRANSFERRED_OUT in the same request"
        side_effects:
          - "a TRANSFER_OUT row of amount_paid_cents is written on this row"
    note: |
      payment_status is derived (source: computed) and is re-derived after every
      ledger write, in this pinned order: (1) fulfillment_status ==
      TRANSFERRED_OUT -> TRANSFERRED; (2) amount_paid_cents == 0 -> UNPAID;
      (3) refunded_cents + forfeited_cents == 0 -> FULLY_PAID when
      amount_paid_cents >= grand_total_cents, else DEPOSIT_PAID when
      amount_paid_cents >= deposit_due_cents, else UNPAID; (4) refunded_cents ==
      amount_paid_cents -> REFUNDED; (5) forfeited_cents == amount_paid_cents ->
      FORFEITED; (6) otherwise PARTIALLY_REFUNDED.

  - entity: WaitlistEntry
    state_field: status
    initial_state: WAITING
    terminal_states: [CLAIMED, EXPIRED, WITHDRAWN]
    transitions:
      - from: WAITING
        to: OFFERED
        trigger: "system, on POST /services/{id}/release-run or on a cancel/no-show driven SOLD_OUT -> OPEN transition"
        actor: system
        preconditions:
          - "entry.status == WAITING"
          - "entry.party_size fits the candidate TicketClass min_party_size..max_party_size band"
          - "the candidate TicketClass has enough seats in the drawing pool for entry.party_size"
          - "entry.requested_package_id is null or equals the candidate TicketClass.package_id"
          - "entry.offer_round < Restaurant.max_offer_rounds"
        side_effects:
          - "a PENDING Reservation is created for the entry's guest and stored on entry.offered_reservation_id, with is_release_priced set to true when the seats were drawn from seats_released"
          - "TicketClass.seats_held is credited by entry.party_size and the drawing pool is debited by the same count"
          - "entry.offer_expires_at_utc is set to the logical clock plus Restaurant.offer_ttl_minutes"
        note: |
          Drawing-pool discipline (pinned): a release-run promotion draws ONLY
          from seats_released and mints a release-priced hold; a cancel or
          no-show promotion draws ONLY from seats_available and mints a
          list-priced hold. Ranking follows waitlist_priority_score under the
          Service's waitlist_policy variant.
      - from: OFFERED
        to: WAITING
        trigger: "POST /services/{id}/hold-sweep, when the offer's hold reservation expires"
        actor: PlatformAdmin
        preconditions:
          - "entry.status == OFFERED"
          - "the logical clock is at or after entry.offer_expires_at_utc"
          - "entry.offer_round + 1 < Restaurant.max_offer_rounds"
        side_effects:
          - "entry.offer_round is credited by 1"
          - "entry.offered_reservation_id is cleared to null and entry.offer_expires_at_utc is cleared"
          - "the entry's priority_score is re-derived, and it falls by 100 per elapsed offer round under the YIELD_WEIGHTED variant"
        note: "this is the cycle edge; an entry may loop WAITING -> OFFERED -> WAITING until offer_round reaches Restaurant.max_offer_rounds"
      - from: OFFERED
        to: EXPIRED
        trigger: "POST /services/{id}/hold-sweep, when the offer lapses on the final permitted round"
        actor: PlatformAdmin
        preconditions:
          - "entry.status == OFFERED"
          - "the logical clock is at or after entry.offer_expires_at_utc"
          - "entry.offer_round + 1 == Restaurant.max_offer_rounds"
        side_effects:
          - "entry.offer_round is credited by 1 and the entry stops being an eligible promotion target"
        note: "termination condition of the cycle"
      - from: OFFERED
        to: CLAIMED
        trigger: "POST /waitlist-entries/{id}/claim"
        actor: Guest
        preconditions:
          - "entry.status == OFFERED"
          - "the logical clock is strictly before entry.offer_expires_at_utc"
          - "the offered Reservation's TicketClass.status IN {OPEN, RELEASED, SOLD_OUT} (PAUSED is refused with ERR_TICKET_CLASS_NOT_SELLABLE)"
          - "entry.offered_reservation_id is in fulfillment_status PENDING"
        side_effects:
          - "the offered Reservation stays PENDING; the guest must still pay the deposit and confirm before hold_expires_at_utc"
          - "entry.offer_expires_at_utc is cleared"
        note: "SOLD_OUT is deliberately claimable because the offer's own hold is what exhausted the pool"
      - from: WAITING
        to: WITHDRAWN
        trigger: "POST /waitlist-entries/{id}/withdraw or POST /services/{id}/cancel"
        actor: Guest
        preconditions:
          - "entry.status == WAITING"
        side_effects: []
      - from: OFFERED
        to: WITHDRAWN
        trigger: "POST /waitlist-entries/{id}/withdraw or POST /services/{id}/cancel"
        actor: Guest
        preconditions:
          - "entry.status == OFFERED"
        side_effects:
          - "the offered PENDING Reservation moves to CANCELLED and its held seats return to their originating pool"

  - entity: DietaryNote
    state_field: ack_status
    initial_state: PENDING
    terminal_states: [ACKED]
    transitions:
      - from: PENDING
        to: ACKED
        trigger: "POST /dietary-notes/{id}/ack with decision ACCEPT"
        actor: KitchenLead
        preconditions:
          - "note.ack_status == PENDING"
          - "the owning Reservation is in fulfillment_status CONFIRMED"
          - "the logical clock is strictly before service.seating_start_utc"
        side_effects:
          - "note.acked_by_user_id records the acting KitchenLead"
          - "the reservation's prep_minutes_total is re-derived, which re-tests the Service kitchen-prep capacity window"
      - from: PENDING
        to: PREP_REJECTED
        trigger: "POST /dietary-notes/{id}/ack with decision REJECT"
        actor: KitchenLead
        preconditions:
          - "note.ack_status == PENDING"
          - "reject_reason_code is supplied"
        side_effects:
          - "note.reject_reason_code is stored"
          - "POST /reservations/{id}/assign-table and POST /reservations/{id}/seat are both blocked with ERR_DIETARY_NOTE_PREP_REJECTED until the note is amended"
      - from: PREP_REJECTED
        to: PENDING
        trigger: "POST /dietary-notes/{id}/amend"
        actor: Guest
        preconditions:
          - "note.ack_status == PREP_REJECTED"
          - "note.amend_count < 3"
        side_effects:
          - "note.amend_count is credited by 1, reject_reason_code and acked_by_user_id are cleared, prep_minutes is re-derived from the amended severity"
        note: "the PENDING -> PREP_REJECTED -> PENDING cycle is capped at 3 amendments per note"

  - entity: RefundException
    state_field: status
    initial_state: REQUESTED
    terminal_states: [APPROVED, DENIED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /refund-exceptions/{id}/decide with decision APPROVED"
        actor: GuestServices
        preconditions:
          - "exception.status == REQUESTED"
          - "the acting X-User-ID differs from exception.requested_by_user_id (ERR_SEGREGATION_OF_DUTIES otherwise)"
          - "0 < approved_cents <= exception.requested_cents"
          - "approved_cents <= reservation.forfeited_cents"
        side_effects:
          - "approved_cents and decision_note_code are stored, shortfall_cents is derived as requested_cents - approved_cents"
          - "the reservation is credited a FORFEITURE_REVERSAL row and debited a REFUND row, both of approved_cents"
          - "Guest.lifetime_refunded_cents is credited; crossing Restaurant.refund_scrutiny_threshold_cents raises Guest.refund_scrutiny_flag, which in turn penalises that guest's WAITING waitlist entries (cascade C)"
          - "when shortfall_cents > 0 a GoodwillCredit becomes issuable up to that amount"
      - from: REQUESTED
        to: DENIED
        trigger: "POST /refund-exceptions/{id}/decide with decision DENIED"
        actor: GuestServices
        preconditions:
          - "exception.status == REQUESTED"
          - "the acting X-User-ID differs from exception.requested_by_user_id"
        side_effects:
          - "approved_cents stays 0 and shortfall_cents becomes the whole requested_cents"
          - "no PaymentTransaction row is written and no GoodwillCredit may be issued (ERR_REFUND_EXCEPTION_NOT_APPROVED)"
        note: "the two fork arms have disjoint side-effect sets: APPROVED touches three entities, DENIED touches none"

  - entity: GoodwillCredit
    state_field: status
    initial_state: ISSUED
    terminal_states: [EXHAUSTED, REVOKED]
    transitions:
      - from: ISSUED
        to: PARTIALLY_REDEEMED
        trigger: "POST /goodwill-credits/{id}/redemptions"
        actor: Guest
        preconditions:
          - "credit.status == ISSUED"
          - "0 < amount_cents < credit.remaining_cents"
          - "the logical clock is strictly before credit.expires_at_utc"
          - "the target Reservation belongs to credit.guest_id and its Service belongs to credit.restaurant_id"
        side_effects:
          - "a GOODWILL_REDEMPTION PaymentTransaction of amount_cents is written on the target reservation with memo_code = CREDIT_APPLIED"
          - "credit.redeemed_cents is credited and remaining_cents is debited"
          - "the target reservation's amount_paid_cents rises, possibly advancing its payment_status"
      - from: ISSUED
        to: EXHAUSTED
        trigger: "POST /goodwill-credits/{id}/redemptions"
        actor: Guest
        preconditions:
          - "credit.status == ISSUED"
          - "amount_cents == credit.remaining_cents"
        side_effects:
          - "remaining_cents becomes 0 and the credit stops being redeemable (ERR_GOODWILL_CREDIT_EXHAUSTED)"
      - from: PARTIALLY_REDEEMED
        to: EXHAUSTED
        trigger: "POST /goodwill-credits/{id}/redemptions"
        actor: Guest
        preconditions:
          - "credit.status == PARTIALLY_REDEEMED"
          - "amount_cents == credit.remaining_cents"
        side_effects:
          - "remaining_cents becomes 0"
      - from: ISSUED
        to: REVOKED
        trigger: "POST /goodwill-credits/{id}/revoke"
        actor: GuestServices
        preconditions:
          - "credit.status == ISSUED"
          - "the acting X-User-ID differs from credit.issued_by_user_id"
        side_effects:
          - "revoked_cents is set to remaining_cents and remaining_cents becomes 0, so issued_cents == redeemed_cents + revoked_cents + remaining_cents still holds"
          - "no PaymentTransaction row is written; already-redeemed cents are never clawed back"
      - from: PARTIALLY_REDEEMED
        to: REVOKED
        trigger: "POST /goodwill-credits/{id}/revoke"
        actor: GuestServices
        preconditions:
          - "credit.status == PARTIALLY_REDEEMED"
          - "the acting X-User-ID differs from credit.issued_by_user_id"
        side_effects:
          - "revoked_cents is set to the unredeemed remainder and remaining_cents becomes 0"

# -----------------------------------------------------------------------------
# §1.2.1 Concurrency Rules
#
# Each entry below survives the mandatory filter: a second request sent strictly
# after the first has fully completed observes NO state field that would reject
# it, because the underlying product semantics allow the second create to stand
# alongside (or supersede) the first. All three are CREATE-with-supersede shapes
# resolved by OCC on the parent's `version`.
# -----------------------------------------------------------------------------
concurrency_rules:

  - rule_id: reservation-create-stale-ticket-class
    parent_entity: TicketClass
    write_endpoint: "POST /reservations"
    occ_field: "expected_ticket_class_version"
    description: |
      Creating a Reservation against a TicketClass whose version has advanced
      since the client last read it is rejected. A second create is otherwise
      perfectly legitimate — the class still has seats, is still OPEN, and the
      requesting guest has no reservation of their own on it — but the quoted
      price the client is holding was computed from a seat-pool snapshot that
      has since moved across a scarcity step, so the stale view must be
      refreshed before the seats are committed.
    error_id: ERR_STALE_TICKET_CLASS_VERSION
    http_status: 412

  - rule_id: addon-add-stale-reservation
    parent_entity: Reservation
    write_endpoint: "POST /reservations/{id}/add-ons"
    occ_field: "expected_reservation_version"
    description: |
      Appending a ReservationAddOn line to a Reservation whose version has
      advanced since the client last read it is rejected. Add-on lines are
      additive and the same add-on may legitimately appear on several lines, so
      no state precondition rejects the second append; the danger is that the
      client's view of grand_total_cents and balance_due_cents predates another
      line (or a goodwill redemption) and the per-cover quantity ceiling would
      be evaluated against stale totals.
    error_id: ERR_STALE_RESERVATION_VERSION
    http_status: 412

  - rule_id: goodwill-redeem-stale-credit
    parent_entity: GoodwillCredit
    write_endpoint: "POST /goodwill-credits/{id}/redemptions"
    occ_field: "expected_goodwill_credit_version"
    description: |
      Redeeming against a GoodwillCredit whose version has advanced since the
      client last read it is rejected. Partial redemptions are legitimate and
      repeatable while remaining_cents is positive, so nothing in the credit's
      state machine refuses a second redemption; the stale-version check exists
      because the client's remaining_cents figure may predate an earlier
      redemption or a revocation and would otherwise overdraw the credit.
    error_id: ERR_STALE_GOODWILL_CREDIT_VERSION
    http_status: 412

# -----------------------------------------------------------------------------
# §1.3 Calculation Rules Table
# -----------------------------------------------------------------------------
calculations:

  - name: ticket_price_per_cover
    trigger: "GET /ticket-classes/{id}/price-quote, and again inside POST /reservations to lock price_locked_per_cover_cents"
    algorithm: tiered_pricing
    formula: |
      # Step 1 — day-of-week and demand-tier factors, combined multiplicatively.
      dow_bp  = DOW_BP[service.day_of_week]          # day_of_week derived from service.service_date
      tier_bp = TIER_BP[service.demand_tier]
      combined_bp = round_half_up(dow_bp * tier_bp / 10000)

      # Step 2 — nested clamp. The floor is applied BEFORE the cap, so a
      # configuration with both bounds crossed resolves to the cap.
      effective_bp = min(PRICE_CAP_BP, max(PRICE_FLOOR_BP, combined_bp))

      # Step 3 — apply to the package's base price.
      list_price = round_half_up(package.base_price_cents * effective_bp / 10000)

      # Step 4 — scarcity step, keyed on the class's own sell-through, which
      # counts BOTH sold and held seats against the full allocation.
      sell_through_bp = floor((tc.seats_sold + tc.seats_held) * 10000 / tc.seats_allocated)
      if   sell_through_bp >= SCARCITY_HIGH_BP:   scarcity_bp = SCARCITY_HIGH_STEP_BP
      elif sell_through_bp >= SCARCITY_MID_BP:    scarcity_bp = SCARCITY_MID_STEP_BP
      else:                                      scarcity_bp = 0
      quoted = round_half_up(list_price * (10000 + scarcity_bp) / 10000)

      # Step 5 — release-priced seats are discounted off the scarcity-adjusted
      # figure, never off the pre-scarcity list price.
      if drawing_pool == RELEASED:
          quoted = round_half_up(quoted * (10000 - package.release_discount_bp) / 10000)

      return quoted
    input_set: "the TicketClass's own seats_sold and seats_held only, read BEFORE the current write credits its own seats (a reservation never prices itself into a higher scarcity step); reservations in fulfillment_status CANCELLED, NO_SHOW, EXPIRED and TRANSFERRED_OUT have already been removed from those counters and are therefore excluded"
    constants:
      DOW_BP: { MON: 9500, TUE: 9500, WED: 9500, THU: 10000, FRI: 11500, SAT: 12500, SUN: 11000 }
      TIER_BP: { LOW: 9000, STANDARD: 10000, HIGH: 12000, PEAK: 14500 }
      PRICE_CAP_BP: 18000
      PRICE_FLOOR_BP: 8500
      SCARCITY_HIGH_BP: 8000
      SCARCITY_HIGH_STEP_BP: 1500
      SCARCITY_MID_BP: 5000
      SCARCITY_MID_STEP_BP: 800
    precision: "integer cents, round_half_up at every named step; basis-point intermediates are also rounded half-up before the clamp"
    note: |
      Worked references (all asserted as literals downstream):
        base 12000, SAT, HIGH, 0/20 sold  -> 12500*12000/10000 = 15000 bp -> 18000
        base 12000, SAT, HIGH, 15/20      -> sell_through 7500 -> +800 bp  -> 19440
        base 12000, SAT, HIGH, 16/20      -> sell_through 8000 -> +1500 bp -> 20700
        base 12000, SAT, PEAK, 0/20 sold  -> 18125 bp clamped to 18000     -> 21600
        base 12000, SAT, HIGH, 2/6 sold, release_discount_bp 1500          -> 15300

  - name: reservation_charge_breakdown
    trigger: "POST /reservations, POST /reservations/{id}/add-ons, and any GET of the reservation"
    algorithm: aggregation
    formula: |
      ticket_subtotal_cents  = price_locked_per_cover_cents * party_size
      ticket_service_charge  = round_half_up(ticket_subtotal_cents * restaurant.service_charge_bp / 10000)

      # PINNED: the service charge is rounded ONCE PER LINE and the rounded
      # per-line figures are then summed. Summing the raw subtotals first and
      # rounding once at the end is the wrong variant and diverges by cents.
      add_on_total_cents = 0
      service_charge_cents = ticket_service_charge
      for line in reservation_add_ons ordered by add_on.name ascending, then line.created_at ascending:
          line.line_subtotal_cents        = line.unit_price_cents_locked * line.qty
          line.line_service_charge_cents  = round_half_up(line.line_subtotal_cents * restaurant.service_charge_bp / 10000)
          add_on_total_cents   += line.line_subtotal_cents
          service_charge_cents += line.line_service_charge_cents

      grand_total_cents = ticket_subtotal_cents + add_on_total_cents + service_charge_cents

      # Deposit is computed from the grand total AT FIRST QUOTE and then frozen
      # by POST /reservations/{id}/confirm; later add-on lines raise the grand
      # total and the balance, never the deposit.
      if package.prepayment_mode == FULL:
          deposit_due_cents = grand_total_cents
      elif not deposit_frozen:
          deposit_due_cents = round_half_up(grand_total_cents * package.deposit_bp / 10000)
      # else: deposit_due_cents retains its frozen value

      balance_due_cents = max(0, grand_total_cents - amount_paid_cents)
    input_set: "the reservation's own ReservationAddOn lines; lines are never soft-deleted, so all lines ever appended are included"
    constants:
      LINE_SORT_KEY: "add_on.name ascending, then ReservationAddOn.created_at ascending"
    precision: "integer cents, round_half_up, rounded independently per charge line"
    note: |
      Worked reference (service_charge_bp 725): unit 18000, party 2 ->
      subtotal 36000, ticket charge 2610, grand 38610, deposit_bp 3000 ->
      11583, balance 27027. Append Caviar 4500x2 (line 9000, charge 653) and
      Wine 8500x2 (line 17000, charge 1233): add_on_total 26000,
      service_charge 4496, grand 66496. The forbidden sum-then-round variant
      would give 4495 and 66495 — a deliberate one-cent discriminator.

  - name: cancellation_settlement
    trigger: "POST /reservations/{id}/cancel, POST /reservations/{id}/no-show, POST /services/{id}/cancel, and hold expiry inside POST /services/{id}/hold-sweep"
    algorithm: threshold
    formula: |
      # Evaluation order is PINNED and each step consumes the previous result.
      # (1) Determine the settlement basis code.
      if trigger == SERVICE_CANCEL:            basis_code = RESTAURANT_INITIATED
      elif trigger == NO_SHOW:                 basis_code = NO_SHOW_FULL
      else:                                    basis_code = package.forfeiture_basis   # DEPOSIT_BASIS | FULL_TICKET_BASIS

      # (2) Short-circuit arms that bypass the ladder entirely.
      if basis_code == RESTAURANT_INITIATED or trigger == HOLD_LAPSE
         or reservation.fulfillment_status == PENDING:
          band_bp = 0; rebook_fee_cents = 0
          retained_cents = 0
          refund_cents   = amount_paid_cents
          return
      if basis_code == NO_SHOW_FULL:
          band_bp = 10000; rebook_fee_cents = 0
          retained_cents = amount_paid_cents
          refund_cents   = 0
          return

      # (3) Hours to service, as an exact decimal on the logical clock.
      hours_to_service = (service.seating_start_utc - now_utc) / 3600 seconds

      # (4) Ladder lookup, selected by the package's forfeiture_schedule_code.
      #     Comparisons are >= so an exact band edge takes the CHEAPER band.
      band_bp = first matching row of FORFEITURE_LADDER[package.forfeiture_schedule_code]

      # (5) Basis amount, selected by the package's INDEPENDENT forfeiture_basis.
      basis_cents = deposit_due_cents  if basis_code == DEPOSIT_BASIS  else grand_total_cents
      raw_forfeit_cents = round_half_up(basis_cents * band_bp / 10000)

      # (6) The rebooking fee band is keyed on the FORFEITURE AMOUNT, not on the
      #     basis, the band_bp, or the hours — so the fee depends on the output
      #     of step 5 and cannot be read off the calendar.
      rebook_fee_cents = REBOOK_FEE_BANDS lookup on raw_forfeit_cents

      # (7) Cap retention at what the guest actually paid; the shortfall is
      #     never chased.
      retained_cents = min(amount_paid_cents, raw_forfeit_cents + rebook_fee_cents)
      refund_cents   = amount_paid_cents - retained_cents
      forfeited_cents += retained_cents
      refunded_cents  += refund_cents
    input_set: "the single reservation being settled; its amount_paid_cents already includes any GOODWILL_REDEMPTION cents, which are therefore refundable and forfeitable like cash"
    constants:
      FORFEITURE_LADDER:
        STANDARD:
          - { min_hours: 72, band_bp: 0 }
          - { min_hours: 24, band_bp: 5000 }
          - { min_hours: 0,  band_bp: 10000 }
        STRICT:
          - { min_hours: 168, band_bp: 0 }
          - { min_hours: 72,  band_bp: 5000 }
          - { min_hours: 24,  band_bp: 8000 }
          - { min_hours: 0,   band_bp: 10000 }
      REBOOK_FEE_BANDS:
        - { max_forfeit_cents: 0,     fee_cents: 0 }
        - { max_forfeit_cents: 9999,  fee_cents: 500 }
        - { max_forfeit_cents: 39999, fee_cents: 1500 }
        - { max_forfeit_cents: null,  fee_cents: 3000 }
    precision: "integer cents, round_half_up; hours_to_service is compared as an exact decimal, never truncated to whole hours"
    variants:
      - name: deposit_basis
        when: "package.forfeiture_basis == DEPOSIT_BASIS"
        difference: "the band is applied to deposit_due_cents, so a mid-ladder cancellation usually leaves a refund"
      - name: full_ticket_basis
        when: "package.forfeiture_basis == FULL_TICKET_BASIS"
        difference: "the band is applied to grand_total_cents; with a 3000 bp deposit even the 5000 bp band exceeds everything paid, so retention saturates at amount_paid_cents and the refund collapses to 0"
    note: |
      Divergence reference — two packages identical except forfeiture_basis,
      reservation paid 11583 of a 38610 grand total, cancelled at exactly 48.0
      hours on the STANDARD ladder:
        DEPOSIT_BASIS     -> raw 5792,  fee 500,  retained 6292,  refund 5291 -> PARTIALLY_REFUNDED
        FULL_TICKET_BASIS -> raw 19305, fee 1500, retained 11583, refund 0    -> FORFEITED
      Boundary reference — the same reservation cancelled at exactly 72.0 hours
      on the STANDARD ladder: band 0 bp, fee 0, retained 0, refund 11583 -> REFUNDED.

  - name: waitlist_priority_score
    trigger: "on WaitlistEntry create, on every offer-round change, on Guest counter changes, and whenever a promotion candidate set is ranked"
    algorithm: weighted_scoring
    formula: |
      score = BASE_SCORE
            + PARTY_WEIGHT     * entry.party_size
            + LOYALTY_WEIGHT   * min(guest.completed_reservations_count, LOYALTY_CAP)
            - STRIKE_PENALTY   * guest.no_show_strikes
            - SCRUTINY_PENALTY * (1 if entry.priority_penalty_applied else 0)
            - ROUND_PENALTY    * entry.offer_round
      priority_score = max(0, score)
    input_set: "WaitlistEntry rows with status == WAITING whose party_size fits the candidate TicketClass band and whose requested_package_id is null or matches the candidate class's package_id; OFFERED, CLAIMED, EXPIRED and WITHDRAWN entries are excluded from every candidate set"
    constants:
      BASE_SCORE: 1000
      PARTY_WEIGHT: 50
      LOYALTY_WEIGHT: 25
      LOYALTY_CAP: 8
      STRIKE_PENALTY: 300
      SCRUTINY_PENALTY: 200
      ROUND_PENALTY: 100
    precision: "integer score, no rounding; the score is a ranking key only and never enters a money figure"
    variants:
      - name: fair_queue
        when: "service.waitlist_policy == FAIR_QUEUE"
        difference: "priority_score is still computed and persisted but is IGNORED for ordering; candidates are ranked by WaitlistEntry.created_at ascending, then guest.email ascending"
      - name: yield_weighted
        when: "service.waitlist_policy == YIELD_WEIGHTED"
        difference: "candidates are ranked by priority_score descending, then WaitlistEntry.created_at ascending, then guest.email ascending"
    note: |
      Divergence reference — two WAITING entries on the same service, e1 created
      first with party_size 2 (score 1100) and e2 created second with party_size
      3 (score 1150), one seat pool of 3 released seats: FAIR_QUEUE promotes e1,
      YIELD_WEIGHTED promotes e2. Other references: one no-show strike -> 800;
      offer_round 1 -> 1000; priority_penalty_applied -> 900. Ordering never
      consults any random id; created_at then email are the only tie-breaks.

  - name: dietary_prep_minutes
    trigger: "on DietaryNote create, ack, and amend; on ReservationAddOn create; and on POST /reservations/{id}/assign-table"
    algorithm: aggregation
    formula: |
      base = reservation.party_size * package.kitchen_prep_minutes_per_cover
      note_minutes = sum over the reservation's DietaryNote rows of
                     SEVERITY_PREP_MINUTES[note.severity]
      addon_minutes = sum over the reservation's ReservationAddOn lines of
                      (add_on.prep_minutes_per_unit * line.qty)
      prep_minutes_total = base + note_minutes + addon_minutes
    input_set: "all DietaryNote rows of the reservation regardless of ack_status (a PENDING allergy still consumes kitchen time) and all ReservationAddOn lines"
    constants:
      SEVERITY_PREP_MINUTES: { INFO: 0, ALLERGY: 6, ANAPHYLAXIS: 15 }
    precision: "whole minutes, no rounding"
    note: |
      References with kitchen_prep_minutes_per_cover 12: party 2 alone -> 24;
      plus one ANAPHYLAXIS note -> 39; plus a caviar add-on at 4 minutes per
      unit, qty 2 -> 32.

  - name: release_run_allocation
    trigger: "POST /services/{id}/release-run"
    algorithm: waterfall_allocation
    formula: |
      released_total = 0
      promoted = []
      for tc in TicketClasses of the service with status IN {OPEN, SOLD_OUT},
             ordered by tc.created_at ascending:
          n = floor(tc.seats_available * service.unsold_release_bp / 10000)
          tc.seats_available -= n
          tc.seats_released  += n
          released_total     += n
          re-evaluate tc against the seat-pool precedence ladder

      # Promotion pass, run only after every class has been released, so an
      # early class never consumes a later class's inventory.
      for tc in the same order:
          while tc.seats_released > 0:
              pick the highest-ranked eligible WAITING entry under the
              service's waitlist_policy variant; stop if none fits
              mint a release-priced PENDING hold for it and move it to OFFERED
      service.release_run_count            += 1
      service.seats_released_total         += released_total
      service.last_release_released_count   = released_total
      service.last_release_promoted_count   = len(promoted)
    input_set: "TicketClasses of the service in status OPEN or SOLD_OUT only; PAUSED and CLOSED classes are skipped entirely and their seats_available is left untouched"
    constants:
      RELEASE_CLASS_ORDER: "TicketClass.created_at ascending"
    precision: "whole seats, floor (a partial seat is never released)"
    note: |
      Reference: seats_allocated 6, one confirmed party of 2 (seats_sold 2,
      seats_available 4), unsold_release_bp 10000 -> 4 seats released, class
      moves OPEN -> RELEASED. Two WAITING entries of party_size 2 are then both
      promoted, taking seats_held to 4 and seats_released to 0, which drives the
      class RELEASED -> SOLD_OUT inside the same request.

  - name: table_turn_occupancy
    trigger: "POST /reservations/{id}/assign-table"
    algorithm: interval_merge
    formula: |
      candidate_from = reservation.seat_from_utc
      candidate_to   = candidate_from + service.turn_time_minutes + table.turn_buffer_minutes
      # HALF-OPEN interval [from, to). Adjacency is therefore ALLOWED: a
      # reservation starting exactly at another's `to` does not collide.
      for other in Reservations with assigned_table_id == table.id
                   and fulfillment_status IN {CONFIRMED, SEATED}:
          other_from = other.seat_from_utc
          other_to   = other_from + other_service.turn_time_minutes + table.turn_buffer_minutes
          if candidate_from < other_to and other_from < candidate_to:
              reject with ERR_TABLE_TURN_CONFLICT
    input_set: "reservations already assigned to the same Table in fulfillment_status CONFIRMED or SEATED; CANCELLED, NO_SHOW, EXPIRED, TRANSFERRED_OUT and COMPLETED occupancies are released and excluded"
    constants:
      INTERVAL_SEMANTICS: half_open_start_inclusive_end_exclusive
    precision: "whole minutes on the logical clock"
    note: |
      Reference with turn_time_minutes 150 and turn_buffer_minutes 15 (165 min):
      R1 seated from 2026-09-12T22:00:00Z occupies [22:00, 00:45). A second
      assignment at 2026-09-13T00:45:00Z is ACCEPTED (adjacency); the same
      assignment at 00:44:00Z is REJECTED.

  - name: kitchen_prep_window_load
    trigger: "POST /reservations/{id}/assign-table"
    algorithm: interval_merge
    formula: |
      # CLOSED interval [seat_from - prep_lead_minutes, seat_from]. Touching
      # endpoints DO collide — the opposite semantics from table_turn_occupancy,
      # because a prep pass that ends exactly as another begins still shares the
      # same pass on the line.
      cand_lo = reservation.seat_from_utc - restaurant.prep_lead_minutes
      cand_hi = reservation.seat_from_utc
      load = reservation.prep_minutes_total
      for other in Reservations of the SAME service with assigned_table_id not null
                   and fulfillment_status IN {CONFIRMED, SEATED}:
          o_lo = other.seat_from_utc - restaurant.prep_lead_minutes
          o_hi = other.seat_from_utc
          if cand_lo <= o_hi and o_lo <= cand_hi:
              load += other.prep_minutes_total
      if load > service.kitchen_prep_capacity_minutes:
          reject with ERR_KITCHEN_PREP_OVERSUBSCRIBED
    input_set: "reservations of the same Service that already hold a table assignment and are in fulfillment_status CONFIRMED or SEATED; the candidate's own prep_minutes_total is always included"
    constants:
      INTERVAL_SEMANTICS: closed_both_endpoints_inclusive
    precision: "whole minutes; the aggregate is compared with strict greater-than, so a load exactly equal to capacity is accepted"
    note: |
      Reference with prep_lead_minutes 45 and kitchen_prep_capacity_minutes 40:
      R1 seats at 22:00 with prep 24 -> window [21:15, 22:00]; R2 seats at 22:45
      with prep 24 -> window [22:00, 22:45]. The windows touch at 22:00, so the
      aggregate is 48 > 40 and R2's assignment is rejected. The resource here is
      the Service's kitchen line, a different resource from the Table above.

  - name: seat_pool_reconciliation
    trigger: "after every seat-moving write: reservation create, confirm, cancel, no-show, hold expiry, release run, waitlist promotion"
    algorithm: aggregation
    formula: |
      tc.seats_sold      = sum(party_size) over reservations of the class with
                           fulfillment_status IN {CONFIRMED, SEATED, COMPLETED, TRANSFERRED_OUT}
      tc.seats_held      = sum(party_size) over reservations of the class with
                           fulfillment_status == PENDING
      # seats_released is a persisted pool, not a rollup: it is credited by
      # release_run_allocation and debited by release-priced holds.
      tc.seats_available = tc.seats_allocated - tc.seats_sold - tc.seats_held - tc.seats_released
      tc.sell_through_bp = floor((tc.seats_sold + tc.seats_held) * 10000 / tc.seats_allocated)
      INVARIANT: seats_allocated == seats_sold + seats_held + seats_released + seats_available
    input_set: "reservations of the TicketClass in fulfillment_status PENDING, CONFIRMED, SEATED, COMPLETED or TRANSFERRED_OUT; CANCELLED, NO_SHOW and EXPIRED rows are excluded so their seats return to the pool"
    constants:
      TRANSFER_TREATMENT: "a TRANSFERRED_OUT row and its successor together contribute party_size ONCE, because the predecessor's seats move to the successor rather than returning to the pool"
    precision: "whole seats"
    note: "successor reservations created by transfer count under seats_sold; the TRANSFERRED_OUT predecessor is excluded from the sum to avoid double counting"

  - name: payment_ledger_reconciliation
    trigger: "after every PaymentTransaction write and on every GET of a Reservation"
    algorithm: projection
    formula: |
      signed_amount_cents = +amount_cents for kind IN {DEPOSIT_CHARGE, BALANCE_CHARGE,
                                                       GOODWILL_REDEMPTION, TRANSFER_IN,
                                                       FORFEITURE_REVERSAL}
                            -amount_cents for kind IN {TRANSFER_OUT, REFUND, FORFEITURE}

      amount_paid_cents = sum(amount_cents) over kinds {DEPOSIT_CHARGE, BALANCE_CHARGE,
                                                       GOODWILL_REDEMPTION, TRANSFER_IN}
      refunded_cents    = sum(amount_cents) over kind REFUND
      forfeited_cents   = sum(amount_cents) over kind FORFEITURE
                          - sum(amount_cents) over kind FORFEITURE_REVERSAL
      goodwill_applied_cents = sum(amount_cents) over kind GOODWILL_REDEMPTION

      INVARIANT I1: sum(signed_amount_cents) over the reservation's rows
                    == amount_paid_cents - refunded_cents - forfeited_cents
      INVARIANT I2: for a fully settled reservation (payment_status IN
                    {REFUNDED, FORFEITED, PARTIALLY_REFUNDED}),
                    amount_paid_cents == refunded_cents + forfeited_cents
    input_set: "every PaymentTransaction row of the reservation, replayed in created_at ascending order; rows are immutable (PaymentTransaction has common_fields: false) so the replay is deterministic"
    constants:
      REPLAY_ORDER: "PaymentTransaction.created_at ascending"
    precision: "integer cents; no rounding occurs in the ledger, every row carries an already-rounded figure"
    note: |
      Reference: paid 11583, cancelled at 48h on DEPOSIT_BASIS -> FORFEITURE
      6292 and REFUND 5291. Signed sum = 11583 - 5291 - 6292 = 0, and
      11583 == 6292 + 5291. Approving a 3000-cent refund exception writes
      FORFEITURE_REVERSAL +3000 and REFUND -3000, leaving the signed sum at 0
      while refunded rises to 8291 and forfeited falls to 3292.

  - name: goodwill_credit_balance
    trigger: "on GoodwillCredit issue, redemption and revocation"
    algorithm: aggregation
    formula: |
      redeemed_cents  = sum(amount_cents) over PaymentTransaction rows with
                        kind == GOODWILL_REDEMPTION and goodwill_credit_id == credit.id
      remaining_cents = issued_cents - redeemed_cents - revoked_cents
      INVARIANT I3: issued_cents == redeemed_cents + revoked_cents + remaining_cents
      status = REVOKED   if revoked_cents > 0
               EXHAUSTED if remaining_cents == 0
               PARTIALLY_REDEEMED if 0 < redeemed_cents < issued_cents
               ISSUED    otherwise
      # Status precedence is PINNED in the order written above.
    input_set: "GOODWILL_REDEMPTION PaymentTransaction rows carrying this credit's id; redemptions against other credits of the same guest are excluded"
    constants:
      ISSUE_CEILING: "min(restaurant.goodwill_credit_cap_cents, refund_exception.shortfall_cents)"
    precision: "integer cents"
    note: |
      Reference: exception requests 6292, 3000 approved -> shortfall 3292; a
      3292-cent credit is issued (liability 3292), then revoked in full ->
      revoked 3292, remaining 0, status REVOKED, liability back to 0.

  - name: guest_refund_scrutiny
    trigger: "after every REFUND PaymentTransaction write"
    algorithm: threshold
    formula: |
      guest.lifetime_refunded_cents += refund_amount_cents
      if guest.lifetime_refunded_cents > restaurant.refund_scrutiny_threshold_cents:
          guest.refund_scrutiny_flag = true
          for entry in WaitlistEntries of that guest with status == WAITING:
              entry.priority_penalty_applied = true
              re-derive entry.priority_score
      # Strict greater-than: a lifetime total exactly equal to the threshold
      # does NOT raise the flag.
    input_set: "REFUND rows across every reservation of the guest at every restaurant; FORFEITURE and FORFEITURE_REVERSAL rows do not move the counter"
    constants:
      COMPARISON: strict_greater_than
    precision: "integer cents"
    note: "the flag is one-way; it is never cleared, and it only penalises entries that are WAITING at the moment the threshold is crossed"

# -----------------------------------------------------------------------------
# §1.4 Validation Rules Table (Ordered by Priority)
#
# Domain ordering rationale: authentication, then authorization and ownership,
# then existence, then request shape, then segregation of duties, then optimistic
# concurrency, then state preconditions, then GUEST SAFETY (dietary), then
# temporal conflicts, then referential coherence, then capacity/quota, and money
# checks last. Safety precedes every scheduling and money check because an
# unacknowledged anaphylaxis note is a clinical risk, not an inconvenience.
# -----------------------------------------------------------------------------
validations:

  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and non-empty"
    error_id: ERR_MISSING_AUTH_HEADERS
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "X-User-Role is one of the five declared roles"
    error_id: ERR_UNKNOWN_ROLE
    http_status: 401
    applies_to: all

  - priority: 3
    category: auth
    check: "the acting role appears in the endpoint's roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 4
    category: auth
    check: "for entity_backed roles the acting X-User-ID owns the target: a Guest's X-User-ID equals reservation.guest_id / waitlist_entry.guest_id / goodwill_credit.guest_id, and a RestaurantManager's or KitchenLead's X-User-ID equals the restaurant that owns the service, table, package or add-on"
    error_id: ERR_FORBIDDEN_RESOURCE_OWNER
    http_status: 403
    applies_to: "all guest-scoped and restaurant-scoped endpoints"

  - priority: 5
    category: existence
    check: "every id in the request path exists, validated left to right"
    error_id: "ERR_RESTAURANT_NOT_FOUND | ERR_GUEST_NOT_FOUND | ERR_TABLE_NOT_FOUND | ERR_PACKAGE_NOT_FOUND | ERR_ADDON_NOT_FOUND | ERR_SERVICE_NOT_FOUND | ERR_TICKET_CLASS_NOT_FOUND | ERR_RESERVATION_NOT_FOUND | ERR_RESERVATION_ADDON_NOT_FOUND | ERR_DIETARY_NOTE_NOT_FOUND | ERR_WAITLIST_ENTRY_NOT_FOUND | ERR_PAYMENT_TRANSACTION_NOT_FOUND | ERR_REFUND_EXCEPTION_NOT_FOUND | ERR_GOODWILL_CREDIT_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with a path id"

  - priority: 6
    category: existence
    check: "every foreign key in the request body references an existing row"
    error_id: "the matching ERR_*_NOT_FOUND from priority 5"
    http_status: 404
    applies_to: "all POST endpoints carrying foreign keys"

  - priority: 7
    category: business_constraint
    check: "request body satisfies the declared schema: required fields present, types correct, enum values recognised, integers within their declared ranges, datetimes ISO 8601 UTC"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: all

  - priority: 8
    category: business_constraint
    check: "limit is between 1 and 100 and offset is at or above 0"
    error_id: ERR_INVALID_PAGINATION
    http_status: 400
    applies_to: "all list endpoints"

  - priority: 9
    category: auth
    check: "the acting X-User-ID differs from refund_exception.requested_by_user_id when deciding, and differs from goodwill_credit.issued_by_user_id when revoking, and the GoodwillCredit issuer differs from refund_exception.decided_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /refund-exceptions/{id}/decide, POST /goodwill-credits, POST /goodwill-credits/{id}/revoke"

  - priority: 10
    category: state
    check: "expected_ticket_class_version equals the TicketClass's current version"
    error_id: ERR_STALE_TICKET_CLASS_VERSION
    http_status: 412
    applies_to: "POST /reservations"

  - priority: 11
    category: state
    check: "expected_reservation_version equals the Reservation's current version"
    error_id: ERR_STALE_RESERVATION_VERSION
    http_status: 412
    applies_to: "POST /reservations/{id}/add-ons"

  - priority: 12
    category: state
    check: "expected_goodwill_credit_version equals the GoodwillCredit's current version"
    error_id: ERR_STALE_GOODWILL_CREDIT_VERSION
    http_status: 412
    applies_to: "POST /goodwill-credits/{id}/redemptions"

  - priority: 13
    category: state
    check: "the owning Service is in status PUBLISHED"
    error_id: ERR_SERVICE_NOT_PUBLISHED
    http_status: 409
    applies_to: "POST /reservations, POST /waitlist-entries, POST /services/{id}/release-run, POST /ticket-classes/{id}/resume"

  - priority: 14
    category: state
    check: "the Service is in the status the operation requires (DRAFT to publish, DRAFT or PUBLISHED to cancel, PUBLISHED to close)"
    error_id: ERR_SERVICE_INVALID_STATE
    http_status: 409
    applies_to: "POST /services/{id}/publish, POST /services/{id}/cancel, POST /services/{id}/hold-sweep, POST /ticket-classes"

  - priority: 15
    category: state
    check: "the TicketClass is sellable: status IN {OPEN, RELEASED} for a direct reservation, and IN {OPEN, RELEASED, SOLD_OUT} for a waitlist claim; PAUSED and CLOSED always fail"
    error_id: ERR_TICKET_CLASS_NOT_SELLABLE
    http_status: 409
    applies_to: "POST /reservations, POST /waitlist-entries/{id}/claim"

  - priority: 16
    category: state
    check: "the TicketClass is in the status the operation requires (OPEN to pause, PAUSED to resume)"
    error_id: ERR_TICKET_CLASS_INVALID_STATE
    http_status: 409
    applies_to: "POST /ticket-classes/{id}/pause, POST /ticket-classes/{id}/resume"

  - priority: 17
    category: state
    check: "the Reservation's fulfillment_status permits the operation per the state machine"
    error_id: ERR_RESERVATION_INVALID_STATE
    http_status: 409
    applies_to: "POST /reservations/{id}/confirm, /payments, /add-ons, /dietary-notes, /assign-table, /seat, /complete, /no-show, /cancel, /name-change, /transfer"

  - priority: 18
    category: state
    check: "the logical clock is strictly before reservation.hold_expires_at_utc for a PENDING reservation"
    error_id: ERR_HOLD_EXPIRED
    http_status: 409
    applies_to: "POST /reservations/{id}/confirm, POST /reservations/{id}/payments, POST /waitlist-entries/{id}/claim"

  - priority: 19
    category: state
    check: "reservation.payment_status IN {DEPOSIT_PAID, FULLY_PAID} before confirming"
    error_id: ERR_DEPOSIT_NOT_SETTLED
    http_status: 409
    applies_to: "POST /reservations/{id}/confirm"

  - priority: 20
    category: state
    check: "reservation.payment_status == FULLY_PAID before completing"
    error_id: ERR_BALANCE_OUTSTANDING
    http_status: 409
    applies_to: "POST /reservations/{id}/complete"

  - priority: 21
    category: state
    check: "reservation.payment_status == FULLY_PAID before transferring"
    error_id: ERR_TRANSFER_REQUIRES_FULL_PAYMENT
    http_status: 409
    applies_to: "POST /reservations/{id}/transfer"

  - priority: 22
    category: state
    check: "the WaitlistEntry is in the status the operation requires (OFFERED to claim, WAITING or OFFERED to withdraw)"
    error_id: ERR_WAITLIST_ENTRY_INVALID_STATE
    http_status: 409
    applies_to: "POST /waitlist-entries/{id}/claim, POST /waitlist-entries/{id}/withdraw"

  - priority: 23
    category: state
    check: "the logical clock is strictly before waitlist_entry.offer_expires_at_utc"
    error_id: ERR_OFFER_EXPIRED
    http_status: 409
    applies_to: "POST /waitlist-entries/{id}/claim"

  - priority: 24
    category: state
    check: "the DietaryNote is in the ack_status the operation requires (PENDING to ack, PREP_REJECTED to amend)"
    error_id: ERR_DIETARY_NOTE_INVALID_STATE
    http_status: 409
    applies_to: "POST /dietary-notes/{id}/ack, POST /dietary-notes/{id}/amend"

  - priority: 25
    category: state
    check: "the RefundException is still in status REQUESTED"
    error_id: ERR_REFUND_EXCEPTION_ALREADY_DECIDED
    http_status: 409
    applies_to: "POST /refund-exceptions/{id}/decide"

  - priority: 26
    category: state
    check: "the RefundException is in status APPROVED before a compensating credit may be issued"
    error_id: ERR_REFUND_EXCEPTION_NOT_APPROVED
    http_status: 409
    applies_to: "POST /goodwill-credits"

  - priority: 27
    category: state
    check: "PINNED per endpoint so that priority 27 and priority 28 never shadow each other: for POST /goodwill-credits/{id}/revoke the GoodwillCredit must be in status ISSUED or PARTIALLY_REDEEMED; for POST /goodwill-credits/{id}/redemptions the GoodwillCredit must not be in status REVOKED, and an EXHAUSTED credit falls through to priority 28"
    error_id: ERR_GOODWILL_CREDIT_INVALID_STATE
    http_status: 409
    applies_to: "POST /goodwill-credits/{id}/redemptions, POST /goodwill-credits/{id}/revoke"

  - priority: 28
    category: state
    check: "goodwill_credit.remaining_cents is strictly above 0"
    error_id: ERR_GOODWILL_CREDIT_EXHAUSTED
    http_status: 409
    applies_to: "POST /goodwill-credits/{id}/redemptions"

  - priority: 29
    category: state
    check: "the logical clock is strictly before goodwill_credit.expires_at_utc"
    error_id: ERR_GOODWILL_CREDIT_EXPIRED
    http_status: 409
    applies_to: "POST /goodwill-credits/{id}/redemptions"

  - priority: 30
    category: business_safety
    check: "every DietaryNote of the reservation with severity == ANAPHYLAXIS has ack_status == ACKED before a table is assigned or the party is seated"
    error_id: ERR_DIETARY_ACK_REQUIRED
    http_status: 422
    applies_to: "POST /reservations/{id}/assign-table, POST /reservations/{id}/seat"

  - priority: 31
    category: business_safety
    check: "no DietaryNote of the reservation is in ack_status PREP_REJECTED"
    error_id: ERR_DIETARY_NOTE_PREP_REJECTED
    http_status: 422
    applies_to: "POST /reservations/{id}/assign-table, POST /reservations/{id}/seat"

  - priority: 32
    category: business_safety
    check: "dietary_note.amend_count is strictly below 3"
    error_id: ERR_DIETARY_AMEND_LIMIT
    http_status: 422
    applies_to: "POST /dietary-notes/{id}/amend"

  - priority: 33
    category: business_temporal
    check: "the candidate half-open occupancy [seat_from, seat_from + turn_time + turn_buffer) does not overlap any CONFIRMED or SEATED occupancy already on the table; adjacency at the exact endpoint is allowed"
    error_id: ERR_TABLE_TURN_CONFLICT
    http_status: 409
    applies_to: "POST /reservations/{id}/assign-table"

  - priority: 34
    category: business_referential
    check: "the target Table belongs to the same Restaurant as the reservation's Service"
    error_id: ERR_TABLE_RESTAURANT_MISMATCH
    http_status: 422
    applies_to: "POST /reservations/{id}/assign-table"

  - priority: 35
    category: business_referential
    check: "table.seats_min <= reservation.party_size <= table.seats_max"
    error_id: ERR_TABLE_PARTY_SIZE_MISMATCH
    http_status: 422
    applies_to: "POST /reservations/{id}/assign-table"

  - priority: 36
    category: business_referential
    check: "the ExperiencePackage referenced by a TicketClass belongs to the same Restaurant as the Service"
    error_id: ERR_PACKAGE_RESTAURANT_MISMATCH
    http_status: 422
    applies_to: "POST /ticket-classes"

  - priority: 37
    category: business_referential
    check: "the AddOn belongs to the same Restaurant as the reservation's Service"
    error_id: ERR_ADDON_RESTAURANT_MISMATCH
    http_status: 422
    applies_to: "POST /reservations/{id}/add-ons"

  - priority: 38
    category: business_referential
    check: "the redemption target Reservation belongs to goodwill_credit.guest_id and its Service belongs to goodwill_credit.restaurant_id"
    error_id: ERR_GOODWILL_TARGET_MISMATCH
    http_status: 422
    applies_to: "POST /goodwill-credits/{id}/redemptions"

  - priority: 39
    category: business_constraint
    check: "the aggregate prep load over every reservation whose closed prep window [seat_from - prep_lead_minutes, seat_from] touches the candidate's window does not exceed service.kitchen_prep_capacity_minutes"
    error_id: ERR_KITCHEN_PREP_OVERSUBSCRIBED
    http_status: 422
    applies_to: "POST /reservations/{id}/assign-table"

  - priority: 40
    category: business_temporal
    check: "the logical clock is at or after reservation.seat_from_utc + restaurant.no_show_grace_minutes"
    error_id: ERR_NO_SHOW_TOO_EARLY
    http_status: 422
    applies_to: "POST /reservations/{id}/no-show"

  - priority: 41
    category: business_temporal
    check: "the logical clock is at or after reservation.seat_from_utc"
    error_id: ERR_SEATING_TOO_EARLY
    http_status: 422
    applies_to: "POST /reservations/{id}/seat"

  - priority: 42
    category: business_temporal
    check: "the logical clock is at or before service.seating_start_utc - restaurant.name_change_cutoff_minutes"
    error_id: ERR_NAME_CHANGE_CUTOFF_PASSED
    http_status: 422
    applies_to: "POST /reservations/{id}/name-change"

  - priority: 43
    category: business_temporal
    check: "the logical clock is at or before service.seating_start_utc - restaurant.transfer_cutoff_minutes"
    error_id: ERR_TRANSFER_CUTOFF_PASSED
    http_status: 422
    applies_to: "POST /reservations/{id}/transfer"

  - priority: 44
    category: business_temporal
    check: "the logical clock is at or before service.seating_start_utc - add_on.order_cutoff_minutes"
    error_id: ERR_ADDON_ORDER_CUTOFF_PASSED
    http_status: 422
    applies_to: "POST /reservations/{id}/add-ons"

  - priority: 45
    category: business_temporal
    check: "the logical clock is at or after service.seating_start_utc - service.release_lead_minutes"
    error_id: ERR_RELEASE_WINDOW_NOT_OPEN
    http_status: 422
    applies_to: "POST /services/{id}/release-run"

  - priority: 46
    category: business_temporal
    check: "the logical clock is strictly before reservation.seat_from_utc when cancelling a CONFIRMED reservation"
    error_id: ERR_CANCEL_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /reservations/{id}/cancel"

  - priority: 47
    category: business_constraint
    check: "reservation.name_change_count is strictly below restaurant.max_name_changes"
    error_id: ERR_NAME_CHANGE_LIMIT_REACHED
    http_status: 422
    applies_to: "POST /reservations/{id}/name-change"

  - priority: 48
    category: business_constraint
    check: "the transfer recipient Guest has is_broker_flagged == false"
    error_id: ERR_RESALE_SUSPECTED
    http_status: 422
    applies_to: "POST /reservations/{id}/transfer"

  - priority: 49
    category: business_constraint
    check: "reservation.transferred_from_reservation_id is null (a ticket received by transfer may not be transferred onward)"
    error_id: ERR_ONWARD_TRANSFER_FORBIDDEN
    http_status: 422
    applies_to: "POST /reservations/{id}/transfer"

  - priority: 50
    category: business_constraint
    check: "the initiating guest.transfers_initiated_count is strictly below restaurant.max_transfers_per_guest"
    error_id: ERR_TRANSFER_LIMIT_REACHED
    http_status: 422
    applies_to: "POST /reservations/{id}/transfer"

  - priority: 51
    category: business_constraint
    check: "the transfer recipient differs from the current holder"
    error_id: ERR_TRANSFER_TO_SELF
    http_status: 422
    applies_to: "POST /reservations/{id}/transfer"

  - priority: 52
    category: business_constraint
    check: "ticket_class.min_party_size <= party_size <= ticket_class.max_party_size, and the class band lies inside the package band"
    error_id: ERR_PARTY_SIZE_OUT_OF_BAND
    http_status: 422
    applies_to: "POST /reservations, POST /ticket-classes, POST /waitlist-entries"

  - priority: 53
    category: business_constraint
    check: "1 <= guest_index <= reservation.party_size"
    error_id: ERR_GUEST_INDEX_OUT_OF_RANGE
    http_status: 422
    applies_to: "POST /reservations/{id}/dietary-notes"

  - priority: 54
    category: business_constraint
    check: "qty is at or above 1 and at or below add_on.max_qty_per_cover * reservation.party_size, counting quantities already ordered on other lines for the same add-on"
    error_id: ERR_ADDON_QTY_INVALID
    http_status: 422
    applies_to: "POST /reservations/{id}/add-ons"

  - priority: 55
    category: business_constraint
    check: "the sum of TicketClass.seats_allocated across the service does not exceed service.seats_capacity"
    error_id: ERR_SERVICE_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /ticket-classes, POST /services/{id}/publish"

  - priority: 56
    category: business_constraint
    check: "the guest has no other reservation on the same Service in fulfillment_status PENDING, CONFIRMED or SEATED"
    error_id: ERR_DUPLICATE_ACTIVE_RESERVATION
    http_status: 422
    applies_to: "POST /reservations"

  - priority: 57
    category: business_constraint
    check: "the guest has no other WaitlistEntry on the same Service in status WAITING or OFFERED"
    error_id: ERR_DUPLICATE_WAITLIST_ENTRY
    http_status: 422
    applies_to: "POST /waitlist-entries"

  - priority: 58
    category: business_constraint
    check: "offer_round is strictly below restaurant.max_offer_rounds, enforced in two places: (a) as a promotion-eligibility filter inside release-run and cancel/no-show promotion, where an entry at the cap is silently skipped rather than errored, and (b) as a hard 422 on POST /waitlist-entries when the acting guest already has an EXPIRED entry on the same service whose offer_round reached restaurant.max_offer_rounds, so an exhausted guest cannot re-queue for the same service"
    error_id: ERR_OFFER_ROUNDS_EXHAUSTED
    http_status: 422
    applies_to: "POST /waitlist-entries, waitlist promotion inside POST /services/{id}/release-run"

  - priority: 59
    category: business_constraint
    check: "the drawing pool holds at least party_size seats (seats_available for a list-priced sale, seats_released for a release-priced promotion)"
    error_id: ERR_INSUFFICIENT_SEATS
    http_status: 409
    applies_to: "POST /reservations, waitlist promotion"

  - priority: 60
    category: business_fiscal
    check: "amount_cents does not exceed reservation.balance_due_cents"
    error_id: ERR_PAYMENT_EXCEEDS_BALANCE
    http_status: 402
    applies_to: "POST /reservations/{id}/payments"

  - priority: 61
    category: business_fiscal
    check: "the first payment on a reservation is at least deposit_due_cents"
    error_id: ERR_PAYMENT_BELOW_DEPOSIT
    http_status: 402
    applies_to: "POST /reservations/{id}/payments"

  - priority: 62
    category: business_fiscal
    check: "requested_cents does not exceed reservation.amount_paid_cents - reservation.refunded_cents"
    error_id: ERR_REFUND_REQUEST_EXCEEDS_PAID
    http_status: 402
    applies_to: "POST /refund-exceptions"

  - priority: 63
    category: business_fiscal
    check: "approved_cents does not exceed refund_exception.requested_cents"
    error_id: ERR_APPROVED_EXCEEDS_REQUESTED
    http_status: 402
    applies_to: "POST /refund-exceptions/{id}/decide"

  - priority: 64
    category: business_fiscal
    check: "approved_cents does not exceed reservation.forfeited_cents, so a reversal can never manufacture cash"
    error_id: ERR_APPROVED_EXCEEDS_FORFEITED
    http_status: 402
    applies_to: "POST /refund-exceptions/{id}/decide"

  - priority: 65
    category: business_fiscal
    check: "issued_cents does not exceed min(restaurant.goodwill_credit_cap_cents, refund_exception.shortfall_cents)"
    error_id: ERR_GOODWILL_EXCEEDS_CAP
    http_status: 402
    applies_to: "POST /goodwill-credits"

  - priority: 66
    category: business_fiscal
    check: "amount_cents does not exceed goodwill_credit.remaining_cents"
    error_id: ERR_GOODWILL_REDEMPTION_EXCEEDS_REMAINING
    http_status: 402
    applies_to: "POST /goodwill-credits/{id}/redemptions"

  - priority: 67
    category: business_fiscal
    check: "amount_cents does not exceed the target reservation's balance_due_cents"
    error_id: ERR_GOODWILL_EXCEEDS_BALANCE_DUE
    http_status: 402
    applies_to: "POST /goodwill-credits/{id}/redemptions"

# -----------------------------------------------------------------------------
# §1.5 API Endpoint Table
#
# api_prefix is "" and every write is a flat top-level collection POST carrying
# explicit foreign keys. Templated ids are always literally `{id}`. Every FK in
# §1.1 is reverse-reachable either through a `/restaurants/{id}/<segment>` or
# `/reservations/{id}/<segment>` sub-resource index or through a filtered list on
# the child's own collection.
# -----------------------------------------------------------------------------
endpoints:

  # --- Restaurant configuration -------------------------------------------
  - method: POST
    path: "/restaurants"
    description: "register a restaurant and its ticketing policy knobs"
    roles: [PlatformAdmin]
    code: 201
    input: ["name", "service_charge_bp?", "hold_ttl_minutes?", "offer_ttl_minutes?", "max_offer_rounds?", "max_name_changes?", "name_change_cutoff_minutes?", "transfer_cutoff_minutes?", "max_transfers_per_guest?", "no_show_grace_minutes?", "goodwill_credit_cap_cents?", "prep_lead_minutes?", "refund_scrutiny_threshold_cents?"]
    output: Restaurant
    side_effects: ["none"]

  - method: GET
    path: "/restaurants/{id}"
    description: "read one restaurant"
    roles: [PlatformAdmin, RestaurantManager, KitchenLead, GuestServices, Guest]
    code: 200
    input: []
    output: Restaurant
    side_effects: []

  - method: GET
    path: "/restaurants"
    description: "list restaurants"
    roles: [PlatformAdmin, RestaurantManager, KitchenLead, GuestServices, Guest]
    code: 200
    input: ["name?", "limit?", "offset?"]
    output: Restaurant[]
    side_effects: []

  - method: GET
    path: "/restaurants/{id}/tables"
    description: "list the tables of a restaurant (reverse index for Table.restaurant_id)"
    roles: [PlatformAdmin, RestaurantManager, KitchenLead]
    code: 200
    input: ["limit?", "offset?"]
    output: Table[]
    side_effects: []

  - method: GET
    path: "/restaurants/{id}/experience-packages"
    description: "list the experience packages of a restaurant (reverse index for ExperiencePackage.restaurant_id)"
    roles: [PlatformAdmin, RestaurantManager, KitchenLead, GuestServices, Guest]
    code: 200
    input: ["limit?", "offset?"]
    output: ExperiencePackage[]
    side_effects: []

  - method: GET
    path: "/restaurants/{id}/add-ons"
    description: "list the add-ons of a restaurant (reverse index for AddOn.restaurant_id)"
    roles: [PlatformAdmin, RestaurantManager, KitchenLead, GuestServices, Guest]
    code: 200
    input: ["limit?", "offset?"]
    output: AddOn[]
    side_effects: []

  - method: GET
    path: "/restaurants/{id}/services"
    description: "list the services of a restaurant (reverse index for Service.restaurant_id)"
    roles: [PlatformAdmin, RestaurantManager, KitchenLead, GuestServices, Guest]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Service[]
    side_effects: []

  - method: POST
    path: "/tables"
    description: "create a table with its seat band and turn buffer"
    roles: [RestaurantManager]
    code: 201
    input: ["restaurant_id", "table_code", "seats_min", "seats_max", "turn_buffer_minutes?"]
    output: Table
    side_effects: ["none"]

  - method: GET
    path: "/tables/{id}"
    description: "read one table"
    roles: [PlatformAdmin, RestaurantManager, KitchenLead]
    code: 200
    input: []
    output: Table
    side_effects: []

  - method: POST
    path: "/experience-packages"
    description: "create a multi-course experience package with its prepayment and forfeiture policy"
    roles: [RestaurantManager]
    code: 201
    input: ["restaurant_id", "name", "course_count", "base_price_cents", "prepayment_mode", "deposit_bp?", "forfeiture_schedule_code?", "forfeiture_basis?", "release_discount_bp?", "kitchen_prep_minutes_per_cover?", "min_party_size", "max_party_size"]
    output: ExperiencePackage
    side_effects: ["none"]

  - method: GET
    path: "/experience-packages/{id}"
    description: "read one experience package"
    roles: [PlatformAdmin, RestaurantManager, KitchenLead, GuestServices, Guest]
    code: 200
    input: []
    output: ExperiencePackage
    side_effects: []

  - method: POST
    path: "/add-ons"
    description: "create a bookable add-on with its prep cost and order cutoff"
    roles: [RestaurantManager]
    code: 201
    input: ["restaurant_id", "name", "price_cents", "prep_minutes_per_unit?", "max_qty_per_cover?", "order_cutoff_minutes?", "requires_kitchen_ack?"]
    output: AddOn
    side_effects: ["none"]

  - method: GET
    path: "/add-ons/{id}"
    description: "read one add-on"
    roles: [PlatformAdmin, RestaurantManager, KitchenLead, GuestServices, Guest]
    code: 200
    input: []
    output: AddOn
    side_effects: []

  # --- Guests ---------------------------------------------------------------
  - method: POST
    path: "/guests"
    description: "register a guest"
    roles: [PlatformAdmin]
    code: 201
    input: ["email", "display_name", "is_broker_flagged?"]
    output: Guest
    side_effects: ["none"]

  - method: GET
    path: "/guests/{id}"
    description: "read one guest, including the counters that feed waitlist ranking"
    roles: [PlatformAdmin, RestaurantManager, GuestServices, Guest]
    code: 200
    input: []
    output: Guest
    side_effects: []

  - method: GET
    path: "/guests"
    description: "list guests"
    roles: [PlatformAdmin, RestaurantManager, GuestServices]
    code: 200
    input: ["email?", "is_broker_flagged?", "refund_scrutiny_flag?", "limit?", "offset?"]
    output: Guest[]
    side_effects: []

  # --- Services -------------------------------------------------------------
  - method: POST
    path: "/services"
    description: "create a service (one seating date and meal period) in DRAFT"
    roles: [RestaurantManager]
    code: 201
    input: ["restaurant_id", "service_date", "meal_period", "seating_start_utc", "seating_end_utc", "turn_time_minutes", "seats_capacity", "demand_tier?", "unsold_release_bp?", "release_lead_minutes?", "waitlist_policy?", "kitchen_prep_capacity_minutes?"]
    output: Service
    side_effects: ["derives day_of_week from service_date"]

  - method: GET
    path: "/services/{id}"
    description: "read one service, including its money rollups and release-run counters"
    roles: [PlatformAdmin, RestaurantManager, KitchenLead, GuestServices, Guest]
    code: 200
    input: []
    output: Service
    side_effects: []

  - method: GET
    path: "/services"
    description: "list services"
    roles: [PlatformAdmin, RestaurantManager, KitchenLead, GuestServices, Guest]
    code: 200
    input: ["restaurant_id?", "status?", "service_date?", "demand_tier?", "limit?", "offset?"]
    output: Service[]
    side_effects: []

  - method: POST
    path: "/services/{id}/publish"
    description: "move a DRAFT service to PUBLISHED, opening its ticket classes for sale"
    roles: [RestaurantManager]
    code: 200
    input: []
    output: Service
    side_effects: ["every TicketClass of the service is re-evaluated against the seat-pool precedence ladder", "reservations become creatable"]

  - method: POST
    path: "/services/{id}/demand-tier"
    description: "re-tier a service, which re-prices every unsold cover on every one of its ticket classes"
    roles: [RestaurantManager]
    code: 200
    input: ["demand_tier"]
    output: Service
    side_effects: ["re-runs ticket_price_per_cover for every TicketClass of the service", "already-locked Reservation.price_locked_per_cover_cents values are untouched"]

  - method: POST
    path: "/services/{id}/cancel"
    description: "cancel a service; every live reservation is refunded in full and every live waitlist entry is withdrawn"
    roles: [RestaurantManager]
    code: 200
    input: ["reason_code?"]
    output: Service
    side_effects: ["cancels every PENDING and CONFIRMED Reservation with cancel_settlement_basis RESTAURANT_INITIATED", "writes a full REFUND PaymentTransaction per affected reservation with memo_code SERVICE_CANCEL", "withdraws every WAITING and OFFERED WaitlistEntry", "closes every TicketClass", "recomputes refunded_cents and net_settled_cents"]

  - method: POST
    path: "/services/{id}/release-run"
    description: "release unsold inventory close to service and promote waitlist entries onto the released seats"
    roles: [RestaurantManager]
    code: 200
    input: []
    output: Service
    side_effects: ["runs release_run_allocation over the service's OPEN and SOLD_OUT ticket classes in created_at order", "moves each affected TicketClass to RELEASED", "promotes eligible WAITING entries to OFFERED and mints release-priced PENDING hold reservations", "increments release_run_count and sets last_release_released_count and last_release_promoted_count", "may drive a class RELEASED -> SOLD_OUT inside the same request"]

  - method: POST
    path: "/services/{id}/hold-sweep"
    description: "expire every lapsed PENDING hold on the service, recycle the seats, and optionally close the service"
    roles: [PlatformAdmin]
    code: 200
    input: ["close_service?"]
    output: Service
    side_effects: ["moves every PENDING Reservation past hold_expires_at_utc to EXPIRED and refunds anything paid with memo_code HOLD_LAPSE", "returns each swept reservation's seats to their originating pool without triggering any waitlist promotion", "returns the linked WaitlistEntry to WAITING with offer_round incremented, or to EXPIRED on the final round", "closes the service and every TicketClass when close_service is true"]

  # --- Ticket classes -------------------------------------------------------
  - method: POST
    path: "/ticket-classes"
    description: "allocate seats of a service to an experience package as a sellable ticket class"
    roles: [RestaurantManager]
    code: 201
    input: ["service_id", "package_id", "seats_allocated", "min_party_size", "max_party_size"]
    output: TicketClass
    side_effects: ["initialises seats_available to seats_allocated", "computes list_price_per_cover_cents and release_price_per_cover_cents"]

  - method: GET
    path: "/ticket-classes/{id}"
    description: "read one ticket class, including the full seat pool breakdown"
    roles: [PlatformAdmin, RestaurantManager, KitchenLead, GuestServices, Guest]
    code: 200
    input: []
    output: TicketClass
    side_effects: []

  - method: GET
    path: "/ticket-classes"
    description: "list ticket classes (reverse index for TicketClass.service_id and TicketClass.package_id)"
    roles: [PlatformAdmin, RestaurantManager, KitchenLead, GuestServices, Guest]
    code: 200
    input: ["service_id?", "package_id?", "status?", "limit?", "offset?"]
    output: TicketClass[]
    side_effects: []

  - method: GET
    path: "/ticket-classes/{id}/price-quote"
    description: "re-derive and return the class with a freshly computed sell_through_bp, list_price_per_cover_cents and release_price_per_cover_cents"
    roles: [PlatformAdmin, RestaurantManager, GuestServices, Guest]
    code: 200
    input: []
    output: TicketClass
    side_effects: ["recomputes the three derived pricing fields from the current seat pool; persists no other change"]

  - method: POST
    path: "/ticket-classes/{id}/pause"
    description: "suspend sales on a ticket class without releasing its seats"
    roles: [RestaurantManager]
    code: 200
    input: []
    output: TicketClass
    side_effects: ["the class stops accepting reservations and stops being an eligible waitlist promotion target"]

  - method: POST
    path: "/ticket-classes/{id}/resume"
    description: "resume sales on a paused ticket class, re-deriving its status from the seat pool"
    roles: [RestaurantManager]
    code: 200
    input: []
    output: TicketClass
    side_effects: ["re-evaluates the seat-pool precedence ladder, landing on RELEASED, OPEN or SOLD_OUT"]

  # --- Reservations ---------------------------------------------------------
  - method: POST
    path: "/reservations"
    description: "hold seats on a ticket class, locking the quoted per-cover price"
    roles: [Guest]
    code: 201
    input: ["ticket_class_id", "guest_id", "party_size", "primary_guest_name", "expected_ticket_class_version"]
    output: Reservation
    side_effects: ["copies service_id from the ticket class", "locks price_locked_per_cover_cents from ticket_price_per_cover", "runs reservation_charge_breakdown to set ticket_subtotal_cents, service_charge_cents, grand_total_cents and deposit_due_cents", "credits TicketClass.seats_held and debits seats_available", "sets hold_expires_at_utc to the logical clock plus Restaurant.hold_ttl_minutes", "re-evaluates the seat-pool precedence ladder", "increments TicketClass.version by 1"]

  - method: GET
    path: "/reservations/{id}"
    description: "read one reservation with both state dimensions and the full money breakdown"
    roles: [PlatformAdmin, RestaurantManager, KitchenLead, GuestServices, Guest]
    code: 200
    input: []
    output: Reservation
    side_effects: []

  - method: GET
    path: "/reservations"
    description: "list reservations (reverse index for service_id, ticket_class_id, guest_id, assigned_table_id and transferred_from_reservation_id)"
    roles: [PlatformAdmin, RestaurantManager, KitchenLead, GuestServices, Guest]
    code: 200
    input: ["ticket_class_id?", "service_id?", "guest_id?", "assigned_table_id?", "transferred_from_reservation_id?", "fulfillment_status?", "payment_status?", "limit?", "offset?"]
    output: Reservation[]
    side_effects: []

  - method: GET
    path: "/reservations/{id}/dietary-notes"
    description: "list the dietary notes of a reservation (reverse index for DietaryNote.reservation_id)"
    roles: [PlatformAdmin, RestaurantManager, KitchenLead, GuestServices, Guest]
    code: 200
    input: ["ack_status?", "limit?", "offset?"]
    output: DietaryNote[]
    side_effects: []

  - method: POST
    path: "/reservations/{id}/payments"
    description: "take a prepayment (deposit or balance) against the reservation"
    roles: [Guest, GuestServices]
    code: 201
    input: ["amount_cents"]
    output: Reservation
    side_effects: ["writes a DEPOSIT_CHARGE or BALANCE_CHARGE PaymentTransaction", "re-derives amount_paid_cents, balance_due_cents and payment_status", "increments Reservation.version by 1"]

  - method: POST
    path: "/reservations/{id}/confirm"
    description: "convert a paid hold into a confirmed booking and freeze the deposit"
    roles: [Guest]
    code: 200
    input: []
    output: Reservation
    side_effects: ["clears hold_expires_at_utc and sets deposit_frozen to true", "moves party_size seats from TicketClass.seats_held to seats_sold", "credits Service.covers_confirmed", "increments Reservation.version by 1"]

  - method: POST
    path: "/reservations/{id}/add-ons"
    description: "append an add-on line to the reservation, re-running the per-line service charge"
    roles: [Guest]
    code: 201
    input: ["add_on_id", "qty", "expected_reservation_version"]
    output: ReservationAddOn
    side_effects: ["locks unit_price_cents_locked from AddOn.price_cents", "re-runs reservation_charge_breakdown with per-line rounding", "raises grand_total_cents and balance_due_cents but never the frozen deposit_due_cents", "re-runs dietary_prep_minutes", "increments Reservation.version by 1"]

  - method: POST
    path: "/reservations/{id}/dietary-notes"
    description: "capture a dietary note for one cover in the party"
    roles: [Guest]
    code: 201
    input: ["guest_index", "restriction_code", "severity", "note_text?"]
    output: DietaryNote
    side_effects: ["derives prep_minutes from severity", "re-runs dietary_prep_minutes on the reservation", "an ANAPHYLAXIS note blocks assign-table and seat until it is ACKED"]

  - method: POST
    path: "/reservations/{id}/assign-table"
    description: "assign a table and a seating instant, testing both the table turn interval and the aggregate kitchen prep window"
    roles: [RestaurantManager]
    code: 200
    input: ["table_id", "seat_from_utc"]
    output: Reservation
    side_effects: ["sets assigned_table_id and seat_from_utc", "runs table_turn_occupancy on the half-open turn interval", "runs kitchen_prep_window_load on the closed prep interval", "increments Reservation.version by 1"]

  - method: POST
    path: "/reservations/{id}/seat"
    description: "seat the party, pinning the end of its turn"
    roles: [RestaurantManager]
    code: 200
    input: []
    output: Reservation
    side_effects: ["sets seat_to_utc to seat_from_utc plus Service.turn_time_minutes", "increments Reservation.version by 1"]

  - method: POST
    path: "/reservations/{id}/complete"
    description: "complete a seated reservation; refused while any balance is outstanding"
    roles: [RestaurantManager]
    code: 200
    input: []
    output: Reservation
    side_effects: ["credits Guest.completed_reservations_count", "reconciles Service.gross_charged_cents", "increments Reservation.version by 1"]

  - method: POST
    path: "/reservations/{id}/no-show"
    description: "declare a no-show after the grace period, forfeiting everything paid"
    roles: [RestaurantManager]
    code: 200
    input: []
    output: Reservation
    side_effects: ["writes a FORFEITURE PaymentTransaction for the whole amount_paid_cents with memo_code NO_SHOW", "credits Guest.no_show_strikes", "returns party_size seats to TicketClass.seats_available", "promotes the highest-ranked eligible WaitlistEntry on a SOLD_OUT -> OPEN transition", "debits Service.covers_confirmed and credits Service.forfeited_cents", "increments Reservation.version by 1"]

  - method: POST
    path: "/reservations/{id}/cancel"
    description: "cancel a hold or a confirmed booking, running the forfeiture ladder and the rebooking-fee band"
    roles: [Guest, GuestServices]
    code: 200
    input: []
    output: Reservation
    side_effects: ["runs cancellation_settlement and writes at most one FORFEITURE and at most one REFUND PaymentTransaction with memo_code GUEST_CANCEL", "returns the seats to their originating pool", "promotes the highest-ranked eligible WaitlistEntry on a SOLD_OUT -> OPEN transition", "updates Service.refunded_cents, forfeited_cents, covers_confirmed and net_settled_cents", "credits Guest.lifetime_refunded_cents and may raise Guest.refund_scrutiny_flag", "increments Reservation.version by 1"]

  - method: POST
    path: "/reservations/{id}/name-change"
    description: "change the primary guest name on a ticket, subject to the per-reservation cap and the cutoff"
    roles: [Guest]
    code: 200
    input: ["primary_guest_name"]
    output: Reservation
    side_effects: ["credits name_change_count", "increments Reservation.version by 1"]

  - method: POST
    path: "/reservations/{id}/transfer"
    description: "transfer a fully paid ticket to another guest, minting a successor reservation and moving the cash"
    roles: [Guest]
    code: 201
    input: ["recipient_guest_id", "recipient_guest_name?"]
    output: Reservation
    side_effects: ["creates a CONFIRMED successor Reservation with transferred_from_reservation_id set and identical party_size, locked price, add-on lines and totals", "writes a TRANSFER_OUT row on the predecessor and a TRANSFER_IN row on the successor with memo_code TRANSFER_MOVE", "moves the predecessor to TRANSFERRED_OUT and TRANSFERRED, the successor to CONFIRMED and FULLY_PAID", "copies every DietaryNote to the successor with ack_status reset to PENDING", "credits Guest.transfers_initiated_count on the initiator", "leaves TicketClass seat counters unchanged", "increments Reservation.version by 1 on the predecessor"]
    note: "the response body is the successor reservation, which is the only way to learn its id"

  # --- Reservation add-on lines --------------------------------------------
  - method: GET
    path: "/reservation-add-ons/{id}"
    description: "read one add-on line with its independently rounded service charge"
    roles: [PlatformAdmin, RestaurantManager, KitchenLead, GuestServices, Guest]
    code: 200
    input: []
    output: ReservationAddOn
    side_effects: []

  - method: GET
    path: "/reservation-add-ons"
    description: "list add-on lines (reverse index for ReservationAddOn.reservation_id and add_on_id)"
    roles: [PlatformAdmin, RestaurantManager, KitchenLead, GuestServices, Guest]
    code: 200
    input: ["reservation_id?", "add_on_id?", "limit?", "offset?"]
    output: ReservationAddOn[]
    side_effects: []

  # --- Dietary notes --------------------------------------------------------
  - method: GET
    path: "/dietary-notes/{id}"
    description: "read one dietary note"
    roles: [PlatformAdmin, RestaurantManager, KitchenLead, GuestServices, Guest]
    code: 200
    input: []
    output: DietaryNote
    side_effects: []

  - method: POST
    path: "/dietary-notes/{id}/ack"
    description: "kitchen acknowledgement of a dietary note, either accepting it or rejecting it back to the guest"
    roles: [KitchenLead]
    code: 200
    input: ["decision", "reject_reason_code?"]
    output: DietaryNote
    side_effects: ["moves ack_status to ACKED or PREP_REJECTED", "records acked_by_user_id", "re-runs dietary_prep_minutes on the reservation"]

  - method: POST
    path: "/dietary-notes/{id}/amend"
    description: "amend a prep-rejected note and send it back to the kitchen"
    roles: [Guest]
    code: 200
    input: ["restriction_code?", "severity?", "note_text?"]
    output: DietaryNote
    side_effects: ["returns ack_status to PENDING", "credits amend_count", "clears reject_reason_code and acked_by_user_id", "re-derives prep_minutes from the amended severity"]

  # --- Payment ledger -------------------------------------------------------
  - method: GET
    path: "/payment-transactions/{id}"
    description: "read one immutable ledger row"
    roles: [PlatformAdmin, RestaurantManager, GuestServices, Guest]
    code: 200
    input: []
    output: PaymentTransaction
    side_effects: []

  - method: GET
    path: "/payment-transactions"
    description: "list ledger rows in created_at order (reverse index for PaymentTransaction.reservation_id and goodwill_credit_id)"
    roles: [PlatformAdmin, RestaurantManager, GuestServices, Guest]
    code: 200
    input: ["reservation_id?", "goodwill_credit_id?", "kind?", "limit?", "offset?"]
    output: PaymentTransaction[]
    side_effects: []

  # --- Waitlist -------------------------------------------------------------
  - method: POST
    path: "/waitlist-entries"
    description: "join the waitlist for a service, optionally restricted to one experience package"
    roles: [Guest]
    code: 201
    input: ["service_id", "guest_id", "party_size", "requested_package_id?"]
    output: WaitlistEntry
    side_effects: ["computes priority_score from waitlist_priority_score", "sets priority_penalty_applied from the guest's current refund_scrutiny_flag"]

  - method: GET
    path: "/waitlist-entries/{id}"
    description: "read one waitlist entry with its current offer round and score"
    roles: [PlatformAdmin, RestaurantManager, GuestServices, Guest]
    code: 200
    input: []
    output: WaitlistEntry
    side_effects: []

  - method: GET
    path: "/waitlist-entries"
    description: "list waitlist entries (reverse index for service_id, guest_id, requested_package_id and offered_reservation_id)"
    roles: [PlatformAdmin, RestaurantManager, GuestServices, Guest]
    code: 200
    input: ["service_id?", "guest_id?", "requested_package_id?", "offered_reservation_id?", "status?", "limit?", "offset?"]
    output: WaitlistEntry[]
    side_effects: []

  - method: POST
    path: "/waitlist-entries/{id}/claim"
    description: "claim an outstanding offer, keeping its hold reservation alive for payment"
    roles: [Guest]
    code: 200
    input: []
    output: WaitlistEntry
    side_effects: ["moves the entry to CLAIMED and clears offer_expires_at_utc", "leaves the offered Reservation PENDING so the guest must still pay and confirm before hold_expires_at_utc"]

  - method: POST
    path: "/waitlist-entries/{id}/withdraw"
    description: "leave the waitlist, cancelling any outstanding offer hold"
    roles: [Guest]
    code: 200
    input: []
    output: WaitlistEntry
    side_effects: ["moves the entry to WITHDRAWN", "cancels the offered PENDING Reservation and returns its seats to their originating pool"]

  # --- Refund exceptions ----------------------------------------------------
  - method: POST
    path: "/refund-exceptions"
    description: "file a refund exception against a settled reservation"
    roles: [Guest, GuestServices]
    code: 201
    input: ["reservation_id", "reason_code", "requested_cents"]
    output: RefundException
    side_effects: ["records requested_by_user_id from X-User-ID, which the decider may not match"]

  - method: GET
    path: "/refund-exceptions/{id}"
    description: "read one refund exception"
    roles: [PlatformAdmin, RestaurantManager, GuestServices, Guest]
    code: 200
    input: []
    output: RefundException
    side_effects: []

  - method: GET
    path: "/refund-exceptions"
    description: "list refund exceptions (reverse index for RefundException.reservation_id)"
    roles: [PlatformAdmin, RestaurantManager, GuestServices, Guest]
    code: 200
    input: ["reservation_id?", "status?", "reason_code?", "limit?", "offset?"]
    output: RefundException[]
    side_effects: []

  - method: POST
    path: "/refund-exceptions/{id}/decide"
    description: "approve or deny a refund exception; approval partially reverses the forfeiture"
    roles: [GuestServices]
    code: 200
    input: ["decision", "decision_note_code", "approved_cents?"]
    output: RefundException
    side_effects: ["records decided_by_user_id and derives shortfall_cents", "on APPROVED writes a FORFEITURE_REVERSAL and a REFUND PaymentTransaction of approved_cents with memo_code REFUND_EXCEPTION", "on APPROVED re-derives the reservation's payment_status out of FORFEITED", "on APPROVED credits Guest.lifetime_refunded_cents and may raise Guest.refund_scrutiny_flag, which penalises that guest's WAITING waitlist entries", "on DENIED writes nothing beyond the exception row"]

  # --- Goodwill credits -----------------------------------------------------
  - method: POST
    path: "/goodwill-credits"
    description: "issue a goodwill credit against the unapproved shortfall of a decided exception"
    roles: [GuestServices]
    code: 201
    input: ["refund_exception_id", "issued_cents", "expires_at_utc"]
    output: GoodwillCredit
    side_effects: ["copies guest_id and restaurant_id from the exception's reservation", "records issued_by_user_id, which must differ from the exception's decided_by_user_id", "initialises remaining_cents to issued_cents"]

  - method: GET
    path: "/goodwill-credits/{id}"
    description: "read one goodwill credit with its issued/redeemed/revoked/remaining breakdown"
    roles: [PlatformAdmin, RestaurantManager, GuestServices, Guest]
    code: 200
    input: []
    output: GoodwillCredit
    side_effects: []

  - method: GET
    path: "/goodwill-credits"
    description: "list goodwill credits (reverse index for guest_id, restaurant_id and refund_exception_id)"
    roles: [PlatformAdmin, RestaurantManager, GuestServices, Guest]
    code: 200
    input: ["guest_id?", "restaurant_id?", "refund_exception_id?", "status?", "limit?", "offset?"]
    output: GoodwillCredit[]
    side_effects: []

  - method: POST
    path: "/goodwill-credits/{id}/redemptions"
    description: "redeem part or all of a goodwill credit against a reservation balance"
    roles: [Guest, GuestServices]
    code: 201
    input: ["reservation_id", "amount_cents", "expected_goodwill_credit_version"]
    output: PaymentTransaction
    side_effects: ["writes a GOODWILL_REDEMPTION PaymentTransaction with memo_code CREDIT_APPLIED and goodwill_credit_id set", "credits redeemed_cents and debits remaining_cents", "raises the target reservation's amount_paid_cents and may advance its payment_status", "increments GoodwillCredit.version by 1"]

  - method: POST
    path: "/goodwill-credits/{id}/revoke"
    description: "claw back the unredeemed remainder of a goodwill credit"
    roles: [GuestServices]
    code: 200
    input: ["reason_code?"]
    output: GoodwillCredit
    side_effects: ["sets revoked_cents to the unredeemed remainder and remaining_cents to 0", "moves the credit to REVOKED", "writes no PaymentTransaction, so already-redeemed cents stay with the guest"]

  # --- Test-driving surface -------------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "set the server's logical clock, which every deadline, cutoff, expiry and forfeiture-ladder comparison reads. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z; it MUST NOT fall back to real wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: ["current_utc"]
    output: null
    side_effects: ["all subsequent time comparisons use the supplied instant", "no entity is mutated and no sweep is triggered"]

# -----------------------------------------------------------------------------
# §1.6 Error Code Catalog
# -----------------------------------------------------------------------------
errors:

  # --- authentication / authorization -------------------------------------
  - id: ERR_MISSING_AUTH_HEADERS
    http: 401
    condition: "X-User-Role or X-User-ID is absent or empty"
  - id: ERR_UNKNOWN_ROLE
    http: 401
    condition: "X-User-Role is not one of Guest, RestaurantManager, KitchenLead, GuestServices, PlatformAdmin"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the acting role is not listed on the endpoint"
  - id: ERR_FORBIDDEN_RESOURCE_OWNER
    http: 403
    condition: "an entity_backed role acts on a resource it does not own"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the acting X-User-ID already occupies an incompatible step: deciding an exception it filed, issuing a credit for an exception it decided, or revoking a credit it issued"

  # --- not found ------------------------------------------------------------
  - id: ERR_RESTAURANT_NOT_FOUND
    http: 404
    condition: "no Restaurant with the supplied id"
  - id: ERR_GUEST_NOT_FOUND
    http: 404
    condition: "no Guest with the supplied id"
  - id: ERR_TABLE_NOT_FOUND
    http: 404
    condition: "no Table with the supplied id"
  - id: ERR_PACKAGE_NOT_FOUND
    http: 404
    condition: "no ExperiencePackage with the supplied id"
  - id: ERR_ADDON_NOT_FOUND
    http: 404
    condition: "no AddOn with the supplied id"
  - id: ERR_SERVICE_NOT_FOUND
    http: 404
    condition: "no Service with the supplied id"
  - id: ERR_TICKET_CLASS_NOT_FOUND
    http: 404
    condition: "no TicketClass with the supplied id"
  - id: ERR_RESERVATION_NOT_FOUND
    http: 404
    condition: "no Reservation with the supplied id"
  - id: ERR_RESERVATION_ADDON_NOT_FOUND
    http: 404
    condition: "no ReservationAddOn with the supplied id"
  - id: ERR_DIETARY_NOTE_NOT_FOUND
    http: 404
    condition: "no DietaryNote with the supplied id"
  - id: ERR_WAITLIST_ENTRY_NOT_FOUND
    http: 404
    condition: "no WaitlistEntry with the supplied id"
  - id: ERR_PAYMENT_TRANSACTION_NOT_FOUND
    http: 404
    condition: "no PaymentTransaction with the supplied id"
  - id: ERR_REFUND_EXCEPTION_NOT_FOUND
    http: 404
    condition: "no RefundException with the supplied id"
  - id: ERR_GOODWILL_CREDIT_NOT_FOUND
    http: 404
    condition: "no GoodwillCredit with the supplied id"

  # --- request shape --------------------------------------------------------
  - id: ERR_VALIDATION
    http: 400
    condition: "missing required field, wrong type, unrecognised enum value, out-of-range integer, or malformed ISO 8601 datetime"
  - id: ERR_INVALID_PAGINATION
    http: 400
    condition: "limit outside 1..100 or offset below 0"

  # --- optimistic concurrency ----------------------------------------------
  - id: ERR_STALE_TICKET_CLASS_VERSION
    http: 412
    condition: "expected_ticket_class_version does not equal the TicketClass's current version"
  - id: ERR_STALE_RESERVATION_VERSION
    http: 412
    condition: "expected_reservation_version does not equal the Reservation's current version"
  - id: ERR_STALE_GOODWILL_CREDIT_VERSION
    http: 412
    condition: "expected_goodwill_credit_version does not equal the GoodwillCredit's current version"

  # --- state preconditions --------------------------------------------------
  - id: ERR_SERVICE_NOT_PUBLISHED
    http: 409
    condition: "the operation requires a PUBLISHED Service and the service is DRAFT, CLOSED or CANCELLED"
  - id: ERR_SERVICE_INVALID_STATE
    http: 409
    condition: "the Service is not in the status this transition requires"
  - id: ERR_TICKET_CLASS_NOT_SELLABLE
    http: 409
    condition: "the TicketClass is PAUSED or CLOSED, or is SOLD_OUT for a direct reservation"
  - id: ERR_TICKET_CLASS_INVALID_STATE
    http: 409
    condition: "the TicketClass is not in the status this transition requires (pause needs OPEN, resume needs PAUSED)"
  - id: ERR_RESERVATION_INVALID_STATE
    http: 409
    condition: "the Reservation's fulfillment_status does not permit the operation"
  - id: ERR_HOLD_EXPIRED
    http: 409
    condition: "the logical clock is at or after reservation.hold_expires_at_utc"
  - id: ERR_DEPOSIT_NOT_SETTLED
    http: 409
    condition: "confirm attempted while payment_status is UNPAID"
  - id: ERR_BALANCE_OUTSTANDING
    http: 409
    condition: "complete attempted while payment_status is not FULLY_PAID"
  - id: ERR_TRANSFER_REQUIRES_FULL_PAYMENT
    http: 409
    condition: "transfer attempted while payment_status is not FULLY_PAID"
  - id: ERR_WAITLIST_ENTRY_INVALID_STATE
    http: 409
    condition: "the WaitlistEntry is not in the status this transition requires"
  - id: ERR_OFFER_EXPIRED
    http: 409
    condition: "the logical clock is at or after waitlist_entry.offer_expires_at_utc"
  - id: ERR_DIETARY_NOTE_INVALID_STATE
    http: 409
    condition: "ack attempted on a note that is not PENDING, or amend attempted on a note that is not PREP_REJECTED"
  - id: ERR_REFUND_EXCEPTION_ALREADY_DECIDED
    http: 409
    condition: "decide attempted on an exception that is already APPROVED or DENIED"
  - id: ERR_REFUND_EXCEPTION_NOT_APPROVED
    http: 409
    condition: "a goodwill credit is issued against an exception that is still REQUESTED or was DENIED"
  - id: ERR_GOODWILL_CREDIT_INVALID_STATE
    http: 409
    condition: "revoke attempted on a GoodwillCredit that is already EXHAUSTED or REVOKED, or a redemption attempted on a REVOKED credit"
  - id: ERR_GOODWILL_CREDIT_EXHAUSTED
    http: 409
    condition: "redemption attempted on an EXHAUSTED credit, whose remaining_cents is 0"
  - id: ERR_GOODWILL_CREDIT_EXPIRED
    http: 409
    condition: "the logical clock is at or after goodwill_credit.expires_at_utc"
  - id: ERR_INSUFFICIENT_SEATS
    http: 409
    condition: "the drawing pool holds fewer than party_size seats"
  - id: ERR_TABLE_TURN_CONFLICT
    http: 409
    condition: "the candidate half-open turn interval overlaps an existing CONFIRMED or SEATED occupancy on the same table"

  # --- guest safety ---------------------------------------------------------
  - id: ERR_DIETARY_ACK_REQUIRED
    http: 422
    condition: "an ANAPHYLAXIS dietary note on the reservation is still PENDING when a table is assigned or the party is seated"
  - id: ERR_DIETARY_NOTE_PREP_REJECTED
    http: 422
    condition: "a dietary note on the reservation is in ack_status PREP_REJECTED"
  - id: ERR_DIETARY_AMEND_LIMIT
    http: 422
    condition: "amend attempted on a note whose amend_count has already reached 3"

  # --- referential coherence ------------------------------------------------
  - id: ERR_TABLE_RESTAURANT_MISMATCH
    http: 422
    condition: "the target Table belongs to a different Restaurant than the reservation's Service"
  - id: ERR_TABLE_PARTY_SIZE_MISMATCH
    http: 422
    condition: "party_size falls outside table.seats_min..table.seats_max"
  - id: ERR_PACKAGE_RESTAURANT_MISMATCH
    http: 422
    condition: "the ExperiencePackage belongs to a different Restaurant than the Service"
  - id: ERR_ADDON_RESTAURANT_MISMATCH
    http: 422
    condition: "the AddOn belongs to a different Restaurant than the reservation's Service"
  - id: ERR_GOODWILL_TARGET_MISMATCH
    http: 422
    condition: "the redemption target Reservation belongs to another guest, or to a service of another restaurant"

  # --- temporal windows -----------------------------------------------------
  - id: ERR_NO_SHOW_TOO_EARLY
    http: 422
    condition: "no-show declared before seat_from_utc plus no_show_grace_minutes"
  - id: ERR_SEATING_TOO_EARLY
    http: 422
    condition: "seat attempted before reservation.seat_from_utc"
  - id: ERR_NAME_CHANGE_CUTOFF_PASSED
    http: 422
    condition: "name change attempted inside name_change_cutoff_minutes of seating_start_utc"
  - id: ERR_TRANSFER_CUTOFF_PASSED
    http: 422
    condition: "transfer attempted inside transfer_cutoff_minutes of seating_start_utc"
  - id: ERR_ADDON_ORDER_CUTOFF_PASSED
    http: 422
    condition: "add-on ordered inside the add-on's order_cutoff_minutes of seating_start_utc"
  - id: ERR_RELEASE_WINDOW_NOT_OPEN
    http: 422
    condition: "release run fired earlier than release_lead_minutes before seating_start_utc"
  - id: ERR_CANCEL_WINDOW_CLOSED
    http: 422
    condition: "a CONFIRMED reservation is cancelled at or after its seat_from_utc"

  # --- resale prevention and quotas ----------------------------------------
  - id: ERR_NAME_CHANGE_LIMIT_REACHED
    http: 422
    condition: "name_change_count has already reached restaurant.max_name_changes"
  - id: ERR_RESALE_SUSPECTED
    http: 422
    condition: "the transfer recipient has is_broker_flagged true"
  - id: ERR_ONWARD_TRANSFER_FORBIDDEN
    http: 422
    condition: "the reservation was itself received by transfer"
  - id: ERR_TRANSFER_LIMIT_REACHED
    http: 422
    condition: "the initiating guest's transfers_initiated_count has reached restaurant.max_transfers_per_guest"
  - id: ERR_TRANSFER_TO_SELF
    http: 422
    condition: "the transfer recipient is the current holder"
  - id: ERR_PARTY_SIZE_OUT_OF_BAND
    http: 422
    condition: "party_size falls outside the ticket class band, or a class band falls outside its package band"
  - id: ERR_GUEST_INDEX_OUT_OF_RANGE
    http: 422
    condition: "guest_index is below 1 or above reservation.party_size"
  - id: ERR_ADDON_QTY_INVALID
    http: 422
    condition: "qty is below 1, or the cumulative quantity for that add-on exceeds max_qty_per_cover times party_size"
  - id: ERR_SERVICE_CAPACITY_EXCEEDED
    http: 422
    condition: "the sum of seats_allocated across the service's ticket classes exceeds seats_capacity"
  - id: ERR_DUPLICATE_ACTIVE_RESERVATION
    http: 422
    condition: "the guest already holds a PENDING, CONFIRMED or SEATED reservation on the same service"
  - id: ERR_DUPLICATE_WAITLIST_ENTRY
    http: 422
    condition: "the guest already has a WAITING or OFFERED entry on the same service"
  - id: ERR_OFFER_ROUNDS_EXHAUSTED
    http: 422
    condition: "a guest re-joins the waitlist of a service on which an earlier entry of theirs already EXPIRED with offer_round == restaurant.max_offer_rounds"
  - id: ERR_KITCHEN_PREP_OVERSUBSCRIBED
    http: 422
    condition: "the aggregate prep load over the touching closed prep windows exceeds service.kitchen_prep_capacity_minutes"

  # --- money ----------------------------------------------------------------
  - id: ERR_PAYMENT_EXCEEDS_BALANCE
    http: 402
    condition: "amount_cents exceeds reservation.balance_due_cents"
  - id: ERR_PAYMENT_BELOW_DEPOSIT
    http: 402
    condition: "the first payment on a reservation is below deposit_due_cents"
  - id: ERR_REFUND_REQUEST_EXCEEDS_PAID
    http: 402
    condition: "requested_cents exceeds amount_paid_cents minus refunded_cents"
  - id: ERR_APPROVED_EXCEEDS_REQUESTED
    http: 402
    condition: "approved_cents exceeds requested_cents"
  - id: ERR_APPROVED_EXCEEDS_FORFEITED
    http: 402
    condition: "approved_cents exceeds the reservation's current forfeited_cents"
  - id: ERR_GOODWILL_EXCEEDS_CAP
    http: 402
    condition: "issued_cents exceeds the smaller of goodwill_credit_cap_cents and the exception's shortfall_cents"
  - id: ERR_GOODWILL_REDEMPTION_EXCEEDS_REMAINING
    http: 402
    condition: "amount_cents exceeds goodwill_credit.remaining_cents"
  - id: ERR_GOODWILL_EXCEEDS_BALANCE_DUE
    http: 402
    condition: "amount_cents exceeds the target reservation's balance_due_cents"

# -----------------------------------------------------------------------------
# §1.7 RBAC Matrix
#
# role_model: segregation_of_duties. GuestServices is deliberately opaque so that
# the same human operator identifier can be compared across three recorded steps
# (requested_by_user_id, decided_by_user_id, issued_by_user_id) without any of
# them being an entity id.
# -----------------------------------------------------------------------------
roles:

  - name: Guest
    description: "a diner who buys, pays for, amends, transfers, cancels and waitlists tickets, and who redeems goodwill credit"
    identity: "entity_backed:Guest"
    exclusive_operations:
      - "POST /reservations"
      - "POST /reservations/{id}/confirm"
      - "POST /reservations/{id}/add-ons"
      - "POST /reservations/{id}/dietary-notes"
      - "POST /reservations/{id}/name-change"
      - "POST /reservations/{id}/transfer"
      - "POST /dietary-notes/{id}/amend"
      - "POST /waitlist-entries"
      - "POST /waitlist-entries/{id}/claim"
      - "POST /waitlist-entries/{id}/withdraw"
    shared_operations:
      - "POST /reservations/{id}/payments (with GuestServices)"
      - "POST /reservations/{id}/cancel (with GuestServices)"
      - "POST /refund-exceptions (with GuestServices)"
      - "POST /goodwill-credits/{id}/redemptions (with GuestServices)"
      - "all GET reads scoped to the acting guest's own reservations, waitlist entries and credits, plus the public restaurant, package, add-on, service and ticket-class catalogue"

  - name: RestaurantManager
    description: "front-of-house operator who configures the restaurant, publishes services, allocates ticket classes, prices demand tiers, runs release runs and works the floor"
    identity: "entity_backed:Restaurant"
    exclusive_operations:
      - "POST /tables"
      - "POST /experience-packages"
      - "POST /add-ons"
      - "POST /services"
      - "POST /services/{id}/publish"
      - "POST /services/{id}/demand-tier"
      - "POST /services/{id}/cancel"
      - "POST /services/{id}/release-run"
      - "POST /ticket-classes"
      - "POST /ticket-classes/{id}/pause"
      - "POST /ticket-classes/{id}/resume"
      - "POST /reservations/{id}/assign-table"
      - "POST /reservations/{id}/seat"
      - "POST /reservations/{id}/complete"
      - "POST /reservations/{id}/no-show"
    shared_operations:
      - "all GET reads scoped to the acting restaurant's own tables, packages, add-ons, services, ticket classes, reservations, waitlist entries, ledger rows, exceptions and credits"

  - name: KitchenLead
    description: "back-of-house lead whose only write authority is acknowledging or prep-rejecting dietary notes; deliberately cannot seat, price, or touch money"
    identity: "entity_backed:Restaurant"
    exclusive_operations:
      - "POST /dietary-notes/{id}/ack"
    shared_operations:
      - "all GET reads scoped to the acting restaurant, including reservation dietary notes and prep minutes"

  - name: GuestServices
    description: "opaque customer-care operator who files, adjudicates and compensates refund exceptions; the segregation-of-duties checks compare this role's X-User-ID across the request, decide and issue steps"
    identity: "opaque"
    exclusive_operations:
      - "POST /refund-exceptions/{id}/decide"
      - "POST /goodwill-credits"
      - "POST /goodwill-credits/{id}/revoke"
    shared_operations:
      - "POST /reservations/{id}/payments (with Guest)"
      - "POST /reservations/{id}/cancel (with Guest)"
      - "POST /refund-exceptions (with Guest)"
      - "POST /goodwill-credits/{id}/redemptions (with Guest)"
      - "all GET reads across every restaurant and guest"

  - name: PlatformAdmin
    description: "opaque platform operator who onboards restaurants and guests, drives the hold-sweep, and sets the logical clock"
    identity: "opaque"
    exclusive_operations:
      - "POST /restaurants"
      - "POST /guests"
      - "POST /services/{id}/hold-sweep"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "all GET reads across every restaurant and guest"
