            - { call: "POST /members/${m2}/decide", payload: { decision: "APPROVE" }, as: SiteDirector, as_user_id: "${dir_id}" }
            - call: "POST /club-days"
              payload: { site_id: "${site_id}", date: "2026-08-03" }
              as: SiteDirector
              as_user_id: "${dir_id}"
              captures: { day: $.data.id }
            - call: "POST /program-areas"
              payload: { site_id: "${site_id}", name: "Gym", capacity: 30, risk_tier: "STANDARD" }
              as: PlatformAdmin
              captures: { area: $.data.id }
