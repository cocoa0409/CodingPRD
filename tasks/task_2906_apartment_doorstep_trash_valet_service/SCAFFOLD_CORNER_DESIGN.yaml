          setup:
            - "Property 'Cedar Ridge' unit_count 4, contract ACTIVE, residents 101-104"
            - "Two onboarded and classified contractors A and B"
            - "Night 2026-09-01 with one ASSIGNED route over 101-102 held by contractor A"
