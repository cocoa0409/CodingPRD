            - call: "POST /wholesale-channel/brokers"
              payload: { legal_name: "Second Readonly Brokers LLC", nmls_id: "NMLS-3325936", home_state: "NV", volume_expectation_cents: 50000000 }
              as: ChannelManager
              captures: { b936: $.data.id }
          trigger:
            - call: "GET /wholesale-channel/loan-submissions"
              payload: { broker_id: "${b936}" }
              as: Any
              as_user_id: "${b}"
            - call: "GET /wholesale-channel/loan-submissions"
              payload: {}
              as: Anonymous
              captures: { error_id_noread: $.data.error_id }
          assert:
            - "the first read returns 200 with exactly 0 rows, because the filter is by broker_id and not by the caller"
            - "GET /wholesale-channel/loan-submissions?broker_id=${b} returns exactly 1 row"
            - "the headerless read returns 400 and error_id_noread == ERR_MISSING_USER_CONTEXT"

  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:

      - name: stale_broker_version_on_underwrite_is_rejected_with_412
        claim_type: optimistic_concurrency
        grounds:
          - complexity_profile.complexity_layers
          - concurrency_rules[loan-underwrite-stale-broker]
          - errors.ERR_STALE_VERSION
          - validations[priority=4]
        distinguishing_aspect: "OCC on the Broker version: a client that observed the version before a licence revocation advanced it is refused with 412 ERR_STALE_VERSION even though the loan's own state still permits underwriting."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Broker B approved with a submitted loan; the client has captured the broker version from the submission response."
          setup_api_calls:
            - *k_clock
            - *k_broker
            - *k_lic
            - *k_fin
            - *k_fin_pass
            - *k_pe
            - *k_pe_app
            - *k_plan
            - *k_approve
            - *k_sheet
            - *k_quote
            - *k_submit
            - call: "POST /wholesale-channel/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /wholesale-channel/brokers/${b}/licenses/${lic}/revoke"
              payload: {}
              as: ComplianceOfficer
              captures: { b_v_after_revoke: $.data.version }
            - call: "POST /wholesale-channel/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /wholesale-channel/loan-submissions/${l}/underwrite"
              payload: { expected_broker_version: "${b_v_sub}" }
              as: Underwriter
              as_user_id: "uw-dana"
              captures: { error_id_stale: $.data.error_id }
          assert:
            - "the response status is 412 and error_id_stale == ERR_STALE_VERSION"
            - "b_v_sub != b_v_after_revoke, proving the version advanced between the capture and the write"
            - "LoanSubmission.${l}.status is still SUBMITTED"
            - "GET /wholesale-channel/brokers/${b} reports status SUSPENDED"

      - name: soft_posture_reinstatement_keeps_every_derived_counter_exactly
        claim_type: derived_field_reconciliation
        grounds:
          - calculations.broker_suspension_triggers
          - entities.Broker.fields.rolling_quality_score
          - state_machines.Broker.transitions.APPROVED_to_SUSPENDED
        distinguishing_aspect: "A suspension and its compensating reinstatement must leave the broker's four derived counters exactly where they started, with no drift introduced by the cascade."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Broker B approved with a submitted loan and clean posture."
          setup_api_calls:
            - *k_clock
            - *k_broker
            - *k_lic
            - *k_fin
            - *k_fin_pass
            - *k_pe
            - *k_pe_app
            - *k_plan
            - *k_approve
            - *k_sheet
            - *k_quote
            - *k_submit
          trigger:
            - call: "POST /wholesale-channel/brokers/${b}/suspend"
              payload: { reason: "routine posture review by channel management" }
              as: ChannelManager
              captures: { b_v_susp937: $.data.version, susp_reason: $.data.suspended_reason }
            - call: "POST /wholesale-channel/brokers/${b}/reinstate"
              payload: {}
              as: ChannelManager
              captures: { b_v_rein937: $.data.version }
          assert:
            - "the suspension returns 200 with susp_reason == \"routine posture review by channel management\" and status SUSPENDED"
            - "Broker.${b}.rolling_quality_score == 100.00 and financial_strength_score == 78.00 after reinstatement"
            - "Broker.${b}.rolling_funded_volume_cents == 0 and active_loan_count == 0 after reinstatement"
            - "Broker.${b}.suspended_reason is null after reinstatement"
            - "b_v_rein937 > b_v_susp937"

      - name: pagination_with_filtering_and_has_more_on_quality_reviews
        claim_type: pagination_with_filtering
        grounds:
          - complexity_profile.complexity_layers
          - response_envelope.pagination_defaults
          - endpoints.GET_/wholesale-channel/brokers/{id}/quality-control-reviews
        distinguishing_aspect: "Filter and page interact: the broker filter narrows total_count, and has_more reflects the filtered set rather than the whole table."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Broker B approved with three funded loans; two carry NON_DEFECT reviews and one carries a review that is already remediated."
          setup_api_calls:
            - *k_clock
            - *k_broker
            - *k_lic
            - *k_fin
            - *k_fin_pass
            - *k_pe
            - *k_pe_app
            - *k_plan
            - *k_approve
            - *k_sheet
            - *k_quote
            - *k_submit
            - *k_uw
            - *k_cond
            - *k_ctc
            - *k_fund
            - call: "POST /wholesale-channel/quality-control-reviews"
              payload: { loan_submission_id: "${l}", defect_type: "NON_DEFECT", severity: "MINOR", remediation_status: "NONE" }
              as: QualityControlAnalyst
              as_user_id: "qc-priya"
              captures: { qc938a: $.data.id }
          trigger:
            - call: "GET /wholesale-channel/brokers/${b}/quality-control-reviews"
              payload: { outcome: "CLEAR", limit: 1, offset: 0 }
              as: Any
            - call: "GET /wholesale-channel/brokers/${b}/quality-control-reviews"
              payload: { limit: 1, offset: 0 }
              as: Any
          assert:
            - "the filtered page returns exactly 1 row with total_count == 1 and has_more == false"
            - "the unfiltered page returns exactly 1 row with total_count == 1 and has_more == false"
            - "GET /wholesale-channel/brokers/${b}/quality-control-reviews with no parameters returns exactly 1 row with limit defaulting to 10"
            - "the returned row has outcome CLEAR and remediation_status NONE"

      - name: error_defect_remediation_open_on_fund
        claim_type: violation_to_error
        grounds:
          - errors.ERR_DEFECT_REMEDIATION_OPEN
        distinguishing_aspect: "The remediation gate on funding is already asserted as the observable failure of the cascade §1.8 instance."
        excluded_because:
          difficulty_instance: transitive_cascade / qc_open_defect_cascade_blocks_closing_through_three_hops
          rationale: "Asserted as the failure path of the named §1.8 instance."

      - name: error_stale_version_on_underwrite
        claim_type: violation_to_error
        grounds:
          - errors.ERR_STALE_VERSION
        distinguishing_aspect: "The OCC stale-version rejection is asserted by the concurrency_rules corner in the cross-cutting-complexity-layers section."
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / loan_underwriting_requires_broker_approved_and_not_blocked
          rationale: "The matching OCC test_recipe lives in the cross-cutting-complexity-layers corner for the same write endpoint; duplicating it here would assert the same call twice."

      - name: error_repurchase_window_expired_after_calendar_crossing
        claim_type: violation_to_error
        grounds:
          - errors.ERR_REPURCHASE_WINDOW_EXPIRED
          - state_machines.LoanSubmission.transitions.FUNDED_to_REPURCHASED
          - validations[priority=23]
        distinguishing_aspect: "The window is measured against the logical clock, so advancing past review.repurchase_due_at converts a previously-valid repurchase into a 409 rather than silently processing it."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Broker B approved with a funded loan and a CRITICAL LICENSE_DEFECT review whose window closes 2026-10-01T00:00:00Z."
          setup_api_calls:
            - *k_clock
            - *k_broker
            - *k_lic
            - *k_fin
            - *k_fin_pass
            - *k_pe
            - *k_pe_app
            - *k_plan
            - *k_approve
            - *k_sheet
            - *k_quote
            - *k_submit
            - *k_uw
            - *k_cond
            - *k_ctc
            - *k_fund
            - call: "POST /wholesale-channel/quality-control-reviews"
              payload: { loan_submission_id: "${l}", defect_type: "LICENSE_DEFECT", severity: "CRITICAL", remediation_status: "NONE" }
              as: QualityControlAnalyst
              captures: { qc915: $.data.id, qc915_due: $.data.repurchase_due_at }
            - call: "POST /wholesale-channel/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-05T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /wholesale-channel/quality-control-reviews/${qc915}/repurchase"
              payload: {}
              as: QualityControlAnalyst
              captures: { error_id_window: $.data.error_id }
          assert:
            - "the review was created with repurchase_required == true and repurchase_due_at == 2026-10-01T00:00:00Z"
            - "the repurchase returns 409 and error_id_window == ERR_REPURCHASE_WINDOW_EXPIRED"
            - "LoanSubmission.${l}.status is still FUNDED and repurchase_exposure_cents == 0"
            - "Broker.${b}.rolling_funded_volume_cents is still 40000000"