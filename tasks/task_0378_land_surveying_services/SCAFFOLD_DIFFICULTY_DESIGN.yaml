  # =========================================================================
  # Rule 9 — Compensating-action invariants across DIFFERENT conserved quantities
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: instrument_availability_conserved_on_reserve_then_cancel
        grounds:
          - state_machines.InstrumentReservation.status
          - state_machines.FieldAssignment.SCHEDULED_to_CANCELLED
          - entities.Instrument.fields.status
        distinguishing_aspect: |
          Conserved quantity = instrument availability. Invariant: an Instrument is AVAILABLE iff it has
          zero HELD reservations. Reserving flips it RESERVED (one HELD reservation); cancelling the
          assignment releases that reservation and the instrument returns to AVAILABLE — net availability
          identical to before. Formula: instrument.status==AVAILABLE <=> count(reservations HELD for it)==0.
        test_recipe:
          setup:
            - "An instrument AVAILABLE, reserved by a SCHEDULED assignment (now RESERVED, one HELD reservation)."
          setup_api_calls:
            - call: "POST /crew-members"
              payload: { full_name: "Coord Q", role_type: "COORDINATOR" }
              as: Coordinator
              captures: { coord_id: $.data.id }
            - call: "POST /crew-members"
              payload: { full_name: "Res Q", role_type: "RESEARCHER" }
              as: Coordinator
              as_user_id: "${coord_id}"
              captures: { res_id: $.data.id }
            - call: "POST /crew-members"
              payload: { full_name: "Tech Q", role_type: "TECH" }
              as: Coordinator
              as_user_id: "${coord_id}"
              captures: { tech_id: $.data.id }
            - call: "POST /instruments"
              payload: { asset_tag: "TAG-Q1", instrument_type: "LEVEL", calibration_due_on: "2027-01-01T00:00:00.000Z" }
              as: Coordinator
              as_user_id: "${coord_id}"
              captures: { instr_id: $.data.id }
            - call: "POST /survey-orders"
              payload: { client_name: "InvCo", survey_type: "BOUNDARY", parcel_apn: "APN-17", county_fips: "06037", acreage: 3, rush: false, requested_due_date: "2026-08-01T00:00:00.000Z" }
              as: Coordinator
              as_user_id: "${coord_id}"
              captures: { order_id: $.data.id }
            - call: "POST /research-packets"
              payload: { order_id: "${order_id}", assigned_researcher_id: "${res_id}", encumbrance_count: 0 }
              as: Coordinator
              as_user_id: "${coord_id}"
              captures: { rp_id: $.data.id }
            - call: "POST /survey-orders/${order_id}/start-research"
              payload: {}
              as: Coordinator
              as_user_id: "${coord_id}"
            - call: "POST /research-packets/${rp_id}/begin"
              payload: {}
              as: Researcher
              as_user_id: "${res_id}"
            - call: "POST /research-packets/${rp_id}/clear"
              payload: {}
              as: Researcher
              as_user_id: "${res_id}"
            - call: "POST /survey-orders/${order_id}/clear-research"
              payload: {}
              as: Coordinator
              as_user_id: "${coord_id}"
            - call: "POST /field-assignments"
              payload: { order_id: "${order_id}", crew_member_id: "${tech_id}", scheduled_start: "2026-07-01T09:00:00.000Z", scheduled_end: "2026-07-01T13:00:00.000Z" }
              as: Coordinator
              as_user_id: "${coord_id}"
              captures: { fa_id: $.data.id }
            - call: "POST /instrument-reservations"
              payload: { assignment_id: "${fa_id}", instrument_id: "${instr_id}" }
              as: Coordinator
              as_user_id: "${coord_id}"
              captures: { resv_id: $.data.id }
          trigger:
            - call: "POST /field-assignments/${fa_id}/cancel"
              payload: {}
              as: Coordinator
              as_user_id: "${coord_id}"
          assert:
            - "FieldAssignment.${fa_id}.status == CANCELLED"
            - "InstrumentReservation.${resv_id}.status == RELEASED"
            - "Instrument.${instr_id}.status == AVAILABLE (identical to pre-reservation state)"

      - name: crew_open_count_conserved_on_schedule_then_complete
        grounds:
          - state_machines.FieldAssignment.IN_PROGRESS_to_COMPLETED
          - entities.CrewMember.fields.open_assignment_count
        distinguishing_aspect: |
          Conserved quantity = crew open_assignment_count (a DIFFERENT conserved quantity than instrument
          availability). Invariant: open_assignment_count equals the count of the crew's FieldAssignments
          in {SCHEDULED, IN_PROGRESS}. Scheduling raises it by 1; completing the assignment lowers it by 1,
          returning the count to its pre-schedule value (0). Formula: open_assignment_count == |{FA: crew, status IN {SCHEDULED,IN_PROGRESS}}|.
        test_recipe:
          setup:
            - "A fresh TECH crew member (open_assignment_count == 0) and a FIELD_READY order."
          setup_api_calls:
            - call: "POST /crew-members"
