scenario: "Pretrial Services & Electronic Monitoring: risk assessment & release recommendation, condition & check-in schedule, GPS/EM enrollment & zone/curfew, violation alert & response, court-date reminder & FTA, drug/alcohol test schedule, level adjustment, reporting"
domain_name: pretrial-services-electronic-monitoring
api_prefix: ""

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - scheduled_actions
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - self_referential      # LedgerEntry.reverses_entry_id references another LedgerEntry
  role_model: segregation_of_duties
  consistency_model: immediate
  difficulty: Expert

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Defendant
    parent: null
    common_fields: true
    fields:
      - name: case_number
        type: string
        source: input
        description: "Court case identifier; unique across defendants."
        constraints: "unique; non-empty"
      - name: full_name
        type: string
        source: input
        description: "Defendant legal name."
      - name: date_of_birth
        type: string
        source: input
        description: "ISO 8601 date of birth (YYYY-MM-DD)."
      - name: indigent
        type: boolean
        source: input
        default: false
        description: "Indigency flag; selects the ADJUSTED supervision-fee variant when true."
      - name: supervision_status
        type: enum
        source: system
        default: PRETRIAL_PENDING
        description: "Lifecycle status."
        constraints: "one of {PRETRIAL_PENDING, ACTIVE, DISCHARGED, TERMINATED}"
      - name: supervision_level
        type: enum
        source: computed
        default: null
        description: "Supervision intensity; null until a ReleaseOrder is ORDERED, then set from the linked assessment's recommended_level; mutated by level adjustments and automatic escalation."
        constraints: "one of {null, MINIMUM, MEDIUM, MAXIMUM}"
      - name: risk_tier
        type: enum
        source: computed
        default: null
        description: "Set when a RiskAssessment is APPROVED; derived from that assessment's recommended_level (MINIMUM->LOW, MEDIUM->MODERATE, MAXIMUM->HIGH)."
        constraints: "one of {null, LOW, MODERATE, HIGH}"
      - name: cumulative_violation_score
        type: integer
        source: computed
        default: 0
        description: "Sum of severity_points across this defendant's ViolationEvents in status ADJUDICATED_SANCTION whose adjudicated_at is within VIOLATION_WINDOW_DAYS of the current clock; see calculations.cumulative_violation_score."
      - name: balance_owed_cents
        type: integer
        source: computed
        default: 0
        description: "Conserved money balance; equals the signed sum of this defendant's LedgerEntry.amount_cents (see calculations invariant ledger_balance_conservation)."
  - name: RiskAssessment
    parent: null
    common_fields: true
    fields:
      - name: defendant_id
        type: string
        source: input
        description: "FK -> Defendant.id"
      - name: instrument_type
        type: enum
        source: input
        description: "Scoring instrument; selects the risk_score variant."
        constraints: "one of {SCREENING, FULL}"
      - name: prior_failures
        type: integer
        source: input
        description: "Count of prior failures-to-appear."
        constraints: ">= 0"
      - name: pending_charges_count
        type: integer
        source: input
        description: "Count of pending charges."
        constraints: ">= 0"
      - name: pending_violent_charge
        type: boolean
        source: input
        default: false
        description: "Whether any pending charge is violent; forces recommended_level MAXIMUM regardless of raw_score."
      - name: employment_status
        type: enum
        source: input
        description: "Employment factor (FULL instrument only)."
        constraints: "one of {EMPLOYED, UNEMPLOYED}"
      - name: residence_stability
        type: enum
        source: input
        description: "Residence factor (FULL instrument only)."
        constraints: "one of {STABLE, UNSTABLE}"
      - name: substance_flag
        type: boolean
        source: input
        default: false
        description: "Substance-abuse factor (FULL instrument only)."
      - name: status
        type: enum
        source: system
        default: DRAFT
        description: "Assessment lifecycle."
        constraints: "one of {DRAFT, SUBMITTED, APPROVED, REJECTED}"
      - name: raw_score
        type: integer
        source: computed
        default: null
        description: "Computed on submission per calculations.risk_score; null while DRAFT."
      - name: recommended_level
        type: enum
        source: computed
        default: null
        description: "Computed on submission per calculations.recommended_level."
        constraints: "one of {null, MINIMUM, MEDIUM, MAXIMUM}"
      - name: submitted_by_user_id
        type: string
        source: system
        default: null
        description: "X-User-ID of the actor who moved DRAFT->SUBMITTED; the approver MUST differ (segregation of duties)."
  - name: ReleaseOrder
    parent: null
    common_fields: true
    fields:
      - name: defendant_id
        type: string
        source: input
        description: "FK -> Defendant.id"
      - name: assessment_id
        type: string
        source: input
        description: "FK -> RiskAssessment.id; the assessment this order relies upon."
      - name: decision
        type: enum
        source: input
        description: "Judicial decision."
        constraints: "one of {RELEASE, DETAIN}"
      - name: ordered_conditions
        type: array
        source: input
        description: "Array of supervision-condition enums attached to this order."
        constraints: "subset of {CURFEW, NO_CONTACT, GPS_MONITORING, DRUG_TESTING, CHECK_IN}"
      - name: status
        type: enum
        source: system
        default: PROPOSED
        description: "Order lifecycle."
        constraints: "one of {PROPOSED, ORDERED, DENIED, VACATED}"
  - name: CheckIn
    parent: null
    common_fields: true
    fields:
      - name: defendant_id
        type: string
        source: input
        description: "FK -> Defendant.id"
      - name: due_at
        type: datetime
        source: input
        description: "ISO 8601 UTC instant the check-in is due."
      - name: completed_at
        type: datetime
        source: system
        default: null
        description: "Set to the current clock when transitioned to COMPLETED."
      - name: origin
        type: enum
        source: system
        default: MANUAL
        description: "MANUAL when scheduled by an officer; ESCALATION when auto-created by a supervision-level escalation cascade."
        constraints: "one of {MANUAL, ESCALATION}"
      - name: status
        type: enum
        source: system
        default: SCHEDULED
        description: "Check-in lifecycle."
        constraints: "one of {SCHEDULED, COMPLETED, MISSED}"
  - name: EMDevice
    parent: null
    common_fields: true
    fields:
      - name: model_name
        type: string
        source: input
        description: "GPS/EM device model / inventory pool label."
      - name: total_units
        type: integer
        source: input
        description: "Total units in this pool."
        constraints: ">= 0"
      - name: available_units
        type: integer
        source: computed
        description: "Conserved device count; equals total_units minus the count of EMEnrollment rows referencing this pool in status {ACTIVE, SUSPENDED} (see invariant device_unit_conservation)."
  - name: EMEnrollment
    parent: null
    common_fields: true
    fields:
      - name: defendant_id
        type: string
        source: input
        description: "FK -> Defendant.id"
      - name: device_id
        type: string
        source: input
        description: "FK -> EMDevice.id"
      - name: status
        type: enum
        source: system
        default: PENDING
        description: "Enrollment lifecycle."
        constraints: "one of {PENDING, ACTIVE, SUSPENDED, TERMINATED}"
      - name: activated_at
        type: datetime
        source: system
        default: null
        description: "Set to the current clock on the PENDING->ACTIVE transition."
  - name: CurfewWindow
    parent: null
    common_fields: false
    fields:
      - name: enrollment_id
        type: string
        source: input
        description: "FK -> EMEnrollment.id"
      - name: day_of_week
        type: integer
        source: input
        description: "Day of week, 0=Monday .. 6=Sunday."
        constraints: "0..6"
      - name: start_minute
        type: integer
        source: input
        description: "Curfew window start, minutes from local midnight (inclusive)."
        constraints: "0..1439"
      - name: end_minute
        type: integer
        source: input
        description: "Curfew window end, minutes from local midnight (exclusive). Window is the half-open interval [start_minute, end_minute)."
        constraints: "1..1440; end_minute > start_minute"
  - name: LocationPing
    parent: null
    common_fields: false
    fields:
      - name: enrollment_id
        type: string
        source: input
        description: "FK -> EMEnrollment.id"
      - name: pinged_at
        type: datetime
        source: input
        description: "ISO 8601 UTC instant of the GPS ping."
      - name: at_home
        type: boolean
        source: input
        description: "Whether the device is at the approved residence at ping time."
      - name: is_curfew_violation
        type: boolean
        source: computed
        description: "True iff at_home is false AND the ping's minute-of-day falls within a matching CurfewWindow half-open interval; see calculations.curfew_ping_evaluation."
  - name: ViolationEvent
    parent: null
    common_fields: true
    fields:
      - name: defendant_id
        type: string
        source: input
        description: "FK -> Defendant.id"
      - name: violation_type
        type: enum
        source: input
        description: "Kind of violation."
        constraints: "one of {CURFEW, MISSED_CHECK_IN, POSITIVE_TEST, FTA, NEW_ARREST, OTHER}"
      - name: severity
        type: enum
        source: input
        description: "Severity band; maps to severity_points."
        constraints: "one of {MINOR, MODERATE, MAJOR}"
      - name: severity_points
        type: integer
        source: computed
        description: "Set when adjudicated to ADJUDICATED_SANCTION: MINOR=3, MODERATE=6, MAJOR=10; 0 otherwise."
      - name: status
        type: enum
        source: system
        default: REPORTED
        description: "Violation review lifecycle (fork-join on adjudication)."
        constraints: "one of {REPORTED, UNDER_REVIEW, ADJUDICATED_SANCTION, ADJUDICATED_DISMISS}"
      - name: reported_by_user_id
        type: string
        source: system
        default: null
        description: "X-User-ID of the reporting SupervisingOfficer; the adjudicator MUST differ (segregation of duties)."
      - name: adjudicated_by_user_id
        type: string
        source: system
        default: null
        description: "X-User-ID of the JudicialOfficer who adjudicated."
      - name: adjudicated_at
        type: datetime
        source: system
        default: null
        description: "Current clock stamped on the transition into an ADJUDICATED_* state."
      - name: source_ref
        type: string
        source: system
        default: null
        description: "Provenance id (originating CheckIn / CourtEvent / DrugTest) when this violation was auto-created by a cascade; free identifier, not a validated foreign key."
  - name: CourtEvent
    parent: null
    common_fields: true
    fields:
      - name: defendant_id
        type: string
        source: input
        description: "FK -> Defendant.id"
      - name: hearing_at
        type: datetime
        source: input
        description: "ISO 8601 UTC scheduled hearing instant."
      - name: reminder_lead_days
        type: integer
        source: input
        default: 3
        description: "Days before the hearing that a reminder is due."
        constraints: ">= 0"
      - name: reminder_due_at
        type: datetime
        source: computed
        description: "hearing_at minus reminder_lead_days (whole days); see calculations note."
      - name: status
        type: enum
        source: system
        default: SCHEDULED
        description: "Court-event lifecycle."
        constraints: "one of {SCHEDULED, APPEARED, FTA, CONTINUED}"
  - name: DrugTest
    parent: null
    common_fields: true
    fields:
      - name: defendant_id
        type: string
        source: input
        description: "FK -> Defendant.id"
      - name: site_id
        type: string
        source: input
        description: "FK -> TestingSite.id"
      - name: test_kind
        type: enum
        source: input
        description: "Panel kind."
        constraints: "one of {DRUG, ALCOHOL}"
      - name: slot_start
        type: datetime
        source: input
        description: "ISO 8601 UTC collection slot start (inclusive)."
      - name: slot_end
        type: datetime
        source: computed
        description: "slot_start plus TEST_SLOT_MINUTES; slot occupies the half-open interval [slot_start, slot_end)."
      - name: status
        type: enum
        source: system
        default: SCHEDULED
        description: "Drug-test lifecycle."
        constraints: "one of {SCHEDULED, COLLECTED, RESULT_POSITIVE, RESULT_NEGATIVE, MISSED}"
      - name: result_recorded_at
        type: datetime
        source: system
        default: null
        description: "Current clock stamped when a RESULT_* status is set."
  - name: TestingSite
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Collection site name."
      - name: slot_capacity
        type: integer
        source: input
        description: "Maximum number of tests (status in {SCHEDULED, COLLECTED}) whose slots may overlap a given instant at this site."
        constraints: ">= 1"
  - name: LedgerEntry
    parent: null
    common_fields: false
    fields:
      - name: defendant_id
        type: string
        source: input
        description: "FK -> Defendant.id"
      - name: entry_type
        type: enum
        source: input
        description: "Ledger entry kind."
        constraints: "one of {CHARGE, PAYMENT, WAIVER, REVERSAL}"
      - name: amount_cents
        type: integer
        source: computed
        description: "Signed amount added to balance_owed_cents: CHARGE positive; PAYMENT and WAIVER negative; REVERSAL equals the negation of the referenced entry's amount_cents."
      - name: reverses_entry_id
        type: string
        source: input
        default: null
        description: "For REVERSAL entries: id of the prior LedgerEntry being reversed (self-reference within the ledger; not a validated cross-entity foreign key)."
      - name: source
        type: enum
        source: system
        default: MANUAL
        description: "Origin of the entry."
        constraints: "one of {SUPERVISION_FEE, MANUAL}"
  - name: LevelAdjustment
    parent: null
    common_fields: false
    fields:
      - name: defendant_id
        type: string
        source: input
        description: "FK -> Defendant.id"
      - name: from_level
        type: enum
        source: system
        default: null
        description: "Defendant.supervision_level immediately before this adjustment."
        constraints: "one of {null, MINIMUM, MEDIUM, MAXIMUM}"
      - name: to_level
        type: enum
        source: input
        description: "Target supervision level."
        constraints: "one of {MINIMUM, MEDIUM, MAXIMUM}"
      - name: source
        type: enum
        source: system
        default: MANUAL
        description: "MANUAL for officer/judicial adjustments; AUTO_ESCALATION when created by the violation-sanction escalation cascade."
        constraints: "one of {MANUAL, AUTO_ESCALATION}"
      - name: reason
        type: string
        source: input
        default: null
        description: "Free-text justification (optional for MANUAL)."
      - name: adjusted_by_user_id
        type: string
        source: system
        default: null
        description: "X-User-ID of the actor for MANUAL adjustments; null for AUTO_ESCALATION."

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: RiskAssessment
    initial_state: DRAFT
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /assessments/{id}/transition {to_status: SUBMITTED}"
        actor: IntakeOfficer
        preconditions:
          - "assessment.status == DRAFT"
          - "all scoring inputs present for the instrument_type"
        side_effects:
          - "compute raw_score per calculations.risk_score"
          - "compute recommended_level per calculations.recommended_level"
          - "set submitted_by_user_id = X-User-ID"
      - from: SUBMITTED
        to: DRAFT
        trigger: "POST /assessments/{id}/transition {to_status: DRAFT}"
        actor: JudicialOfficer
        preconditions:
          - "assessment.status == SUBMITTED"
        side_effects:
          - "clear submitted_by_user_id (kickback for revision)"
        note: "Revision loop — DRAFT<->SUBMITTED makes this machine cyclic."
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /assessments/{id}/transition {to_status: APPROVED}"
        actor: JudicialOfficer
        preconditions:
          - "assessment.status == SUBMITTED"
          - "X-User-ID != assessment.submitted_by_user_id (segregation of duties)"
        side_effects:
          - "set Defendant.risk_tier from recommended_level (MINIMUM->LOW, MEDIUM->MODERATE, MAXIMUM->HIGH)"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /assessments/{id}/transition {to_status: REJECTED}"
        actor: JudicialOfficer
        preconditions:
          - "assessment.status == SUBMITTED"
          - "X-User-ID != assessment.submitted_by_user_id (segregation of duties)"
        side_effects: []
  - entity: ReleaseOrder
    initial_state: PROPOSED
    terminal_states: [DENIED, VACATED]
    transitions:
      - from: PROPOSED
        to: ORDERED
        trigger: "POST /release-orders/{id}/transition {to_status: ORDERED}"
        actor: JudicialOfficer
        preconditions:
          - "order.status == PROPOSED"
          - "the linked RiskAssessment (order.assessment_id) is in status APPROVED (cross-entity dependency)"
        side_effects:
          - "if decision == RELEASE: set Defendant.supervision_status = ACTIVE"
          - "if decision == RELEASE: set Defendant.supervision_level = linked assessment.recommended_level"
      - from: PROPOSED
        to: DENIED
        trigger: "POST /release-orders/{id}/transition {to_status: DENIED}"
        actor: JudicialOfficer
        preconditions:
          - "order.status == PROPOSED"
        side_effects: []
      - from: ORDERED
        to: VACATED
        trigger: "POST /release-orders/{id}/transition {to_status: VACATED}"
        actor: JudicialOfficer
        preconditions:
          - "order.status == ORDERED"
        side_effects:
          - "set Defendant.supervision_status = TERMINATED"
  - entity: Defendant
    initial_state: PRETRIAL_PENDING
    terminal_states: [DISCHARGED, TERMINATED]
    transitions:
      - from: PRETRIAL_PENDING
        to: ACTIVE
        trigger: "system side-effect of ReleaseOrder PROPOSED->ORDERED with decision RELEASE"
        actor: system
        preconditions:
          - "defendant.supervision_status == PRETRIAL_PENDING"
        side_effects:
          - "supervision_level set from the ordering assessment"
      - from: ACTIVE
        to: DISCHARGED
        trigger: "POST /defendants/{id}/transition {to_status: DISCHARGED}"
        actor: JudicialOfficer
        preconditions:
          - "defendant.supervision_status == ACTIVE"
        side_effects: []
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /defendants/{id}/transition {to_status: TERMINATED}"
        actor: JudicialOfficer
        preconditions:
          - "defendant.supervision_status == ACTIVE"
        side_effects: []
  - entity: CheckIn
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, MISSED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /check-ins/{id}/transition {to_status: COMPLETED}"
        actor: Defendant
        preconditions:
          - "check_in.status == SCHEDULED"
          - "acting Defendant owns this check-in (X-User-ID == check_in.defendant_id) OR actor is SupervisingOfficer"
        side_effects:
          - "set completed_at = current clock"
      - from: SCHEDULED
        to: MISSED
        trigger: "POST /check-ins/{id}/transition {to_status: MISSED}"
        actor: SupervisingOfficer
        preconditions:
          - "check_in.status == SCHEDULED"
          - "current clock > check_in.due_at"
        side_effects:
          - "cascade: auto-create ViolationEvent {violation_type: MISSED_CHECK_IN, severity: MODERATE, source_ref: check_in.id} in status REPORTED"
  - entity: EMEnrollment
    initial_state: PENDING
    terminal_states: [TERMINATED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /em-enrollments/{id}/transition {to_status: ACTIVE}"
        actor: SupervisingOfficer
        preconditions:
          - "enrollment.status == PENDING"
          - "Defendant.supervision_status == ACTIVE (cross-entity dependency)"
          - "the defendant has a ReleaseOrder in status ORDERED whose ordered_conditions contains GPS_MONITORING"
          - "the referenced EMDevice.available_units >= 1"
        side_effects:
          - "assign a unit: EMDevice.available_units decremented by 1"
          - "set activated_at = current clock"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /em-enrollments/{id}/transition {to_status: SUSPENDED}"
        actor: SupervisingOfficer
        preconditions:
          - "enrollment.status == ACTIVE"
        side_effects: []
        note: "Device unit stays assigned while SUSPENDED."
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /em-enrollments/{id}/transition {to_status: ACTIVE}"
        actor: SupervisingOfficer
        preconditions:
          - "enrollment.status == SUSPENDED"
        side_effects: []
        note: "Resume — ACTIVE<->SUSPENDED loop makes this machine cyclic; no new unit assigned."
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /em-enrollments/{id}/transition {to_status: TERMINATED}"
        actor: SupervisingOfficer
        preconditions:
          - "enrollment.status == ACTIVE"
        side_effects:
          - "return the unit: EMDevice.available_units incremented by 1"
      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /em-enrollments/{id}/transition {to_status: TERMINATED}"
        actor: SupervisingOfficer
        preconditions:
          - "enrollment.status == SUSPENDED"
        side_effects:
          - "return the unit: EMDevice.available_units incremented by 1"
  - entity: ViolationEvent
    initial_state: REPORTED
    terminal_states: [ADJUDICATED_SANCTION, ADJUDICATED_DISMISS]
    transitions:
      - from: REPORTED
        to: UNDER_REVIEW
        trigger: "POST /violations/{id}/transition {to_status: UNDER_REVIEW}"
        actor: JudicialOfficer
        preconditions:
          - "violation.status == REPORTED"
        side_effects: []
      - from: UNDER_REVIEW
        to: ADJUDICATED_SANCTION
        trigger: "POST /violations/{id}/transition {to_status: ADJUDICATED_SANCTION}"
        actor: JudicialOfficer
        preconditions:
          - "violation.status == UNDER_REVIEW"
          - "X-User-ID != violation.reported_by_user_id (segregation of duties)"
        side_effects:
          - "set severity_points from severity (MINOR=3, MODERATE=6, MAJOR=10); set adjudicated_by_user_id, adjudicated_at"
          - "recompute Defendant.cumulative_violation_score (calculations.cumulative_violation_score)"
          - "cascade (depth>=3): if cumulative_violation_score >= ESCALATION_THRESHOLD then Defendant.supervision_level escalates one step (MINIMUM->MEDIUM->MAXIMUM); that level change itself creates a LevelAdjustment {source: AUTO_ESCALATION} AND an ESCALATION CheckIn due at current clock + ESCALATED_CHECKIN_DAYS"
      - from: UNDER_REVIEW
        to: ADJUDICATED_DISMISS
        trigger: "POST /violations/{id}/transition {to_status: ADJUDICATED_DISMISS}"
        actor: JudicialOfficer
        preconditions:
          - "violation.status == UNDER_REVIEW"
          - "X-User-ID != violation.reported_by_user_id (segregation of duties)"
        side_effects:
          - "set adjudicated_by_user_id, adjudicated_at; severity_points stays 0; no escalation (divergent branch)"
  - entity: CourtEvent
    initial_state: SCHEDULED
    terminal_states: [APPEARED, FTA, CONTINUED]
    transitions:
      - from: SCHEDULED
        to: APPEARED
        trigger: "POST /court-events/{id}/transition {to_status: APPEARED}"
        actor: SupervisingOfficer
        preconditions:
          - "court_event.status == SCHEDULED"
        side_effects: []
      - from: SCHEDULED
        to: FTA
        trigger: "POST /court-events/{id}/transition {to_status: FTA}"
        actor: SupervisingOfficer
        preconditions:
          - "court_event.status == SCHEDULED"
          - "current clock > hearing_at + FTA_GRACE_HOURS (FTA_GRACE_HOURS = 2 hours)"
        side_effects:
          - "cascade (depth>=2): auto-create ViolationEvent {violation_type: FTA, severity: MAJOR, source_ref: court_event.id} in status REPORTED"
      - from: SCHEDULED
        to: CONTINUED
        trigger: "POST /court-events/{id}/transition {to_status: CONTINUED}"
        actor: SupervisingOfficer
        preconditions:
          - "court_event.status == SCHEDULED"
        side_effects: []
  - entity: DrugTest
    initial_state: SCHEDULED
    terminal_states: [RESULT_POSITIVE, RESULT_NEGATIVE, MISSED]
    transitions:
      - from: SCHEDULED
        to: COLLECTED
        trigger: "POST /drug-tests/{id}/transition {to_status: COLLECTED}"
        actor: SupervisingOfficer
        preconditions:
          - "drug_test.status == SCHEDULED"
        side_effects: []
      - from: COLLECTED
        to: RESULT_POSITIVE
        trigger: "POST /drug-tests/{id}/transition {to_status: RESULT_POSITIVE}"
        actor: SupervisingOfficer
        preconditions:
          - "drug_test.status == COLLECTED"
        side_effects:
          - "set result_recorded_at = current clock"
          - "cascade: auto-create ViolationEvent {violation_type: POSITIVE_TEST, severity: MODERATE, source_ref: drug_test.id} in status REPORTED"
      - from: COLLECTED
        to: RESULT_NEGATIVE
        trigger: "POST /drug-tests/{id}/transition {to_status: RESULT_NEGATIVE}"
        actor: SupervisingOfficer
        preconditions:
          - "drug_test.status == COLLECTED"
        side_effects:
          - "set result_recorded_at = current clock"
      - from: SCHEDULED
        to: MISSED
        trigger: "POST /drug-tests/{id}/transition {to_status: MISSED}"
        actor: SupervisingOfficer
        preconditions:
          - "drug_test.status == SCHEDULED"
          - "current clock > drug_test.slot_end"
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version)
# =============================================================================
concurrency_rules:
  - rule_id: level-adjustment-stale-defendant
    parent_entity: Defendant
    write_endpoint: "POST /defendants/{id}/level-adjustments"
    occ_field: "expected_defendant_version"
    description: |
      Recording a manual LevelAdjustment against a Defendant whose version has
      advanced since the client last observed it is rejected. A prior adjustment
      (or an automatic escalation cascade) legitimately supersedes the client's
      view of the current supervision_level, so the stale-version write is
      refused rather than silently overwriting the newer level.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: curfew-window-stale-enrollment
    parent_entity: EMEnrollment
    write_endpoint: "POST /em-enrollments/{id}/curfew-windows"
    occ_field: "expected_enrollment_version"
    description: |
      Adding a CurfewWindow to an EMEnrollment whose version has advanced since
      the client last observed it is rejected. Another curfew edit or a
      lifecycle transition on the enrollment has moved the version, so the
      client's window set is stale and the write is refused.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: risk_score
    trigger: "RiskAssessment DRAFT->SUBMITTED"
    algorithm: weighted_scoring
    formula: |
      FULL:      raw_score = prior_failures*W_PF + pending_charges_count*W_PC
                             + (employment_status==UNEMPLOYED ? W_EMP : 0)
                             + (residence_stability==UNSTABLE ? W_RES : 0)
                             + (substance_flag ? W_SUB : 0)
      SCREENING: raw_score = prior_failures*W_PF + pending_charges_count*W_PC
    input_set: "The single RiskAssessment being submitted; no other entities."
    constants:
      W_PF: 4
      W_PC: 2
      W_EMP: 3
      W_RES: 3
      W_SUB: 5
    precision: "integer points"
    variants:
      - name: SCREENING
        when: "instrument_type == SCREENING"
        difference: "Uses only prior_failures and pending_charges_count; the three FULL-only factors are ignored, producing a strictly lower-or-equal score than FULL on identical inputs."
      - name: FULL
        when: "instrument_type == FULL"
        difference: "Adds employment, residence, and substance factors."
  - name: recommended_level
    trigger: "RiskAssessment DRAFT->SUBMITTED (after raw_score)"
    algorithm: threshold
    formula: |
      if pending_violent_charge:            recommended_level = MAXIMUM
      elif raw_score >= T_MAX:              recommended_level = MAXIMUM
      elif raw_score >= T_MED:              recommended_level = MEDIUM
      else:                                 recommended_level = MINIMUM
    input_set: "raw_score and pending_violent_charge of the assessment being submitted."
    constants:
      T_MED: 8
      T_MAX: 16
    precision: "exact integer comparison; boundary is inclusive (>=)"
    variants:
      - name: violent_override
        when: "pending_violent_charge == true"
        difference: "Forces MAXIMUM regardless of raw_score, overriding the threshold ladder."
  - name: supervision_fee
    trigger: "POST /defendants/{id}/fees"
    algorithm: tiered_pricing
    formula: |
      sup_line  = round_half_up( DAILY_SUPERVISION_CENTS * supervision_days * (1 + ADMIN_FEE_PCT) )
      em_line   = round_half_up( EM_DAILY_CENTS         * em_days          * (1 + ADMIN_FEE_PCT) )
      test_line = round_half_up( PER_TEST_CENTS         * scheduled_test_count * (1 + ADMIN_FEE_PCT) )
      # PINNED ORDER: round each line to whole cents FIRST, THEN sum.
      ASSESSED  charge_amount_cents = sup_line + em_line + test_line
      ADJUSTED  charge_amount_cents = test_line          # supervision and EM lines waived
    input_set: "supervision_days, em_days, scheduled_test_count from the request; Defendant.indigent selects the variant."
    constants:
      DAILY_SUPERVISION_CENTS: 300
      EM_DAILY_CENTS: 650
      PER_TEST_CENTS: 2500
      ADMIN_FEE_PCT: 0.075
    precision: "whole cents, round_half_up, applied PER LINE before summation"
    variants:
      - name: ASSESSED
        when: "Defendant.indigent == false"
        difference: "Charges all three lines; the pinned per-line rounding order can differ from sum-then-round by one cent (e.g., 22576 vs 22575 for days=15, em_days=10, tests=4)."
      - name: ADJUSTED
        when: "Defendant.indigent == true"
        difference: "Waives the supervision and EM lines entirely; only the testing line is charged (a different money total on a different entity domain than risk_score)."
  - name: cumulative_violation_score
    trigger: "ViolationEvent UNDER_REVIEW->ADJUDICATED_SANCTION"
    algorithm: aggregation
    formula: |
      cumulative_violation_score =
        sum( v.severity_points
             for v in ViolationEvent
             where v.defendant_id == this.defendant_id
               and v.status == ADJUDICATED_SANCTION
               and v.adjudicated_at >= (current_clock - VIOLATION_WINDOW_DAYS days) )
      if cumulative_violation_score >= ESCALATION_THRESHOLD: trigger supervision-level escalation cascade
    input_set: "This defendant's ADJUDICATED_SANCTION violations whose adjudicated_at is within the rolling window; ties/ordering irrelevant (pure sum)."
    constants:
      VIOLATION_WINDOW_DAYS: 90
      ESCALATION_THRESHOLD: 10
      ESCALATED_CHECKIN_DAYS: 7
    precision: "integer points; threshold boundary inclusive (>=)"
  - name: curfew_ping_evaluation
    trigger: "POST /em-enrollments/{id}/pings"
    algorithm: interval_merge
    formula: |
      m = minute_of_day(pinged_at)   # 0..1439, UTC
      d = day_of_week(pinged_at)     # 0=Mon..6=Sun
      in_window = exists CurfewWindow w on this enrollment with
                    w.day_of_week == d and w.start_minute <= m < w.end_minute   # half-open
      is_curfew_violation = (at_home == false) and in_window
      if is_curfew_violation: auto-create ViolationEvent {violation_type: CURFEW, severity: MINOR, source_ref: ping.id} REPORTED
    input_set: "The ping and the CurfewWindow rows on its enrollment; boundary at end_minute is EXCLUSIVE."
    constants:
      TEST_SLOT_MINUTES: 30
    precision: "minute granularity; window is [start_minute, end_minute)"

# Invariants (conservation) — pinned formulas over entity fields:
#   ledger_balance_conservation: for every Defendant D,
#       D.balance_owed_cents == sum(le.amount_cents for le in LedgerEntry where le.defendant_id == D.id)
#     A CHARGE and its REVERSAL therefore net to exactly 0 (conserved quantity: money, in cents).
#   device_unit_conservation: for every EMDevice P,
#       P.available_units == P.total_units - count(EMEnrollment e where e.device_id == P.id and e.status in {ACTIVE, SUSPENDED})
#     An ACTIVATE (assign) paired with its TERMINATE (return) leaves available_units unchanged (conserved quantity: device units).

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "acting role is permitted for this operation (per §1.7)"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "all path-referenced resources exist (validated left-to-right)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with a path id"
  - priority: 4
    category: state
    check: "target resource is in a state from which the requested transition/operation is legal"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition and mutation endpoints"
  - priority: 5
    category: state
    check: "for EM activation: the enrollment's Defendant is in supervision_status ACTIVE"
    error_id: ERR_DEFENDANT_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /em-enrollments/{id}/transition"
  - priority: 6
    category: business_constraint
    check: "segregation of duties: assessment approver/rejecter != submitter; violation adjudicator != reporter"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: "POST /assessments/{id}/transition, POST /violations/{id}/transition"
  - priority: 7
    category: business_safety
    check: "required ordered condition present: DRUG_TESTING to schedule a DrugTest; GPS_MONITORING to activate an EMEnrollment"
    error_id: ERR_CONDITION_NOT_ORDERED
    http_status: 409
    applies_to: "POST /drug-tests, POST /em-enrollments/{id}/transition"
  - priority: 8
    category: business_referential
    check: "for ReleaseOrder ORDERED: the linked RiskAssessment is in status APPROVED"
    error_id: ERR_ASSESSMENT_NOT_APPROVED
    http_status: 409
    applies_to: "POST /release-orders/{id}/transition"
  - priority: 9
    category: business_temporal
    check: "curfew window does not overlap an existing window on the same enrollment and same day_of_week ([start,end) half-open; adjacency allowed)"
    error_id: ERR_CURFEW_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /em-enrollments/{id}/curfew-windows"
  - priority: 10
    category: business_temporal
    check: "requested drug-test slot does not exceed site slot_capacity (count of {SCHEDULED,COLLECTED} tests whose [slot_start,slot_end) overlaps the request must be < slot_capacity)"
    error_id: ERR_SLOT_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /drug-tests"
  - priority: 11
    category: business_temporal
    check: "time-gated transition precondition reached (FTA requires clock > hearing_at + grace; MISSED check-in requires clock > due_at; MISSED test requires clock > slot_end)"
    error_id: ERR_PRECONDITION_TIME_NOT_REACHED
    http_status: 409
    applies_to: "POST /court-events/{id}/transition, POST /check-ins/{id}/transition, POST /drug-tests/{id}/transition"
  - priority: 12
    category: business_fiscal
    check: "for EM activation: the referenced EMDevice has available_units >= 1"
    error_id: ERR_NO_DEVICE_AVAILABLE
    http_status: 409
    applies_to: "POST /em-enrollments/{id}/transition"
  - priority: 13
    category: state
    check: "OCC: expected_<parent>_version matches the parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /defendants/{id}/level-adjustments, POST /em-enrollments/{id}/curfew-windows"
  - priority: 14
    category: business_constraint
    check: "request body field types/enums/ranges valid and required fields present"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all POST/PATCH"
  - priority: 15
    category: business_constraint
    check: "enum field value is a member of the declared set"
    error_id: ERR_INVALID_ENUM
    http_status: 422
    applies_to: "all POST/PATCH with enum inputs"

# =============================================================================
# §1.5 API Endpoint Table
