  # ---------------------------------------------------------------------------
  # Rule 9 — compensating_invariant (different conserved quantities)
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: d_invariant_restitution_conservation
        grounds:
          - state_machines.RestitutionPayment.ALLOCATED_to_RETURNED
          - calculations.restitution_allocation_calc
          - entities.Settlement.fields.fulfilled_cents
          - entities.Settlement.fields.outstanding_cents
        distinguishing_aspect: |
          Conserved quantity = per-settlement restitution dollars: for the
          EXECUTED settlement, outstanding_cents + fulfilled_cents ==
          restitution_amount_cents (5000) before allocation, after allocating
          3000, and after the compensating mark-returned reverses it — a cascade
          that ran end-to-end but drifted would fail the pinned formula.
        test_recipe:
          setup:
            - "Complaint SETTLEMENT_PENDING with EXECUTED settlement (restitution 5000); payment1 3000 ALLOCATED (fulfilled 3000 / outstanding 2000)"
          setup_api_calls:
            - call: "POST /consumer-protection/consumers"
              payload: { full_name: "C V", email: "cv@x.com", state_code: "OR" }
              as: Anonymous
              captures: { con: $.data.id }
