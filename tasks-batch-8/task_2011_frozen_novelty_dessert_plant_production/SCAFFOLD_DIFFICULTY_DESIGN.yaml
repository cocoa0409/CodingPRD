            - { call: "POST /lines", payload: { line_code: "L-1", format: NOVELTY, rate_units_per_hour: 12000 }, as: PlantManager, captures: { l1: $.data.id } }
            - { call: "POST /tunnels", payload: { tunnel_code: "T-1", max_units_per_hour: 20000 }, as: PlantManager, captures: { t1: $.data.id } }
            - { call: "POST /production-runs", payload: { run_code: "R-A", product_id: "${p_bar}", line_id: "${l1}", planned_units: 1000, scheduled_start: "2026-08-10T10:00:00Z" }, as: ProductionPlanner, captures: { ra: $.data.id } }
            - { call: "POST /tunnel-bookings", payload: { tunnel_id: "${t1}", run_id: "${ra}", start_at: "2026-08-10T10:00:00Z", end_at: "2026-08-10T12:00:00Z" }, as: ProductionPlanner }
            - { call: "POST /production-runs", payload: { run_code: "R-B", product_id: "${p_bar}", line_id: "${l1}", planned_units: 1000, scheduled_start: "2026-08-10T13:00:00Z" }, as: ProductionPlanner, captures: { rb: $.data.id } }
          trigger:
            - call: "POST /tunnel-bookings"
              payload: { tunnel_id: "${t1}", run_id: "${rb}", start_at: "2026-08-10T12:29:00Z", end_at: "2026-08-10T13:29:00Z" }
              as: ProductionPlanner
              captures: { err_29: $.data.error_id }
            - call: "POST /tunnel-bookings"
              payload: { tunnel_id: "${t1}", run_id: "${rb}", start_at: "2026-08-10T12:30:00Z", end_at: "2026-08-10T13:30:00Z" }
              as: ProductionPlanner
              captures: { bk_ok: $.data.id, bk_status: $.data.status }
          assert:
            - "12:29 start (29-minute gap): ERR_TUNNEL_WINDOW_CONFLICT"
            - "12:30 start (exactly TUNNEL_BUFFER_MINUTES == 30 gap): 201 success, status == BOOKED"
            - "the >= boundary admits exact adjacency-after-buffer; one minute less fails"

  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: assign_mix_requires_released_state
        grounds:
          - state_machines.ProductionRun.SCHEDULED_to_MIX_ASSIGNED
          - validations[priority=10]
          - errors[ERR_MIX_NOT_RELEASED]
        distinguishing_aspect: |
          Entity pair ProductionRun -> MixBatch: the run's SCHEDULED -> MIX_ASSIGNED
          transition is gated on the MIX BATCH's state (must be RELEASED). A batch that
          is only PASTEURIZED blocks the transition with ERR_MIX_NOT_RELEASED.
        test_recipe:
          setup:
            - "Product BAR-VAN-70; run R-G SCHEDULED; mix batch MB-G pasteurized but NOT released (QA never released it)"
          setup_api_calls:
            - { call: "POST /products", payload: { sku_code: "BAR-VAN-70", product_name: "Vanilla Bar 70ml", format: NOVELTY, flavor_family: VANILLA, allergens: [MILK], fill_volume_ml_per_unit: 70, target_overrun_pct: 40, units_per_pallet: 100, shelf_life_days: 540 }, as: PlantManager, captures: { p_bar: $.data.id } }
            - { call: "POST /lines", payload: { line_code: "L-1", format: NOVELTY, rate_units_per_hour: 12000 }, as: PlantManager, captures: { l1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T08:00:00Z" }, as: PlantManager }
            - { call: "POST /mix-batches", payload: { batch_code: "MB-G", product_id: "${p_bar}", litres_produced: 500 }, as: ProductionPlanner, captures: { m1: $.data.id } }
            - { call: "POST /mix-batches/${m1}/pasteurize", payload: {}, as: LineOperator, as_user_id: "op_1" }
            - { call: "POST /production-runs", payload: { run_code: "R-G", product_id: "${p_bar}", line_id: "${l1}", planned_units: 1000, scheduled_start: "2026-08-10T14:00:00Z" }, as: ProductionPlanner, captures: { r1: $.data.id } }
          trigger:
            - call: "POST /production-runs/${r1}/assign-mix"
              payload: { mix_batch_id: "${m1}" }
              as: ProductionPlanner
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_MIX_NOT_RELEASED (batch is PASTEURIZED, not RELEASED)"
            - "Run.${r1}.status remains SCHEDULED and mix_batch_id remains null"

      - name: lot_release_blocked_by_open_complaint
        grounds:
          - state_machines.InventoryLot.QUARANTINED_to_AVAILABLE
          - validations[priority=32]
          - errors[ERR_COMPLAINT_STILL_OPEN]
        distinguishing_aspect: |
          Different entity pair than the sibling instance: InventoryLot ->
          QualityComplaint. A QUARANTINED lot cannot be released while ANY complaint on
          a lot of the same run_id is UNDER_REVIEW or LAB_TEST — the lot's transition
          set depends on the complaint machine's state.
        test_recipe:
          setup:
            - "Completed lot of BAR-VAN-70 from run R-H; lot quarantined manually by qa_1"
            - "Complaint QC-H on the lot is UNDER_REVIEW (filed by QA)"
            - "Release attempted by qa_2 (passes segregation-of-duties, so only the complaint gate can fire)"
          setup_api_calls:
