  - rule_id: resource_temporal_overlap
    instances:
      - name: irrigation_half_open_adjacency_allowed_overlap_rejected
        grounds:
          - calculations.irrigation_overlap_check
          - errors[ERR_IRRIGATION_OVERLAP]
          - concurrency_rules[irrigation-create-stale-season]
        distinguishing_aspect: |
          Interval semantics = HALF-OPEN [start, end) on resource (season, zone): a window
          starting exactly when another ends (11:00) is legal, and so is one ending exactly when
          another starts; a true intersection (10:30-11:30 vs 10:00-11:00) conflicts; a different
          zone never conflicts. No buffer is required — the exact opposite of bed occupancy.
        test_recipe:
          setup:
            - "Season PLANTING, budget 100000; irrigation A zone Z1 [2026-08-20T10:00, 11:00) planned 100"
          setup_api_calls:
            - { call: "POST /api/volunteers", payload: { full_name: "V One", email: "v1@x.com", date_of_birth: "1990-05-20" }, as: GardenAdmin, captures: { v1_id: $.data.id } }
            - { call: "POST /api/seasons", payload: { name: "2026 Summer", signup_opens_at: "2026-07-01T00:00:00Z", signup_closes_at: "2026-08-10T00:00:00Z", season_starts_at: "2026-08-01T00:00:00Z", season_ends_at: "2026-11-30T00:00:00Z", water_budget_gallons: 100000 }, as: GardenAdmin, captures: { season_id: $.data.id } }
            - { call: "POST /api/beds", payload: { bed_code: "B-01", size_sq_ft: 100, sun_exposure: "FULL", irrigation_zone: "Z1" }, as: GardenAdmin, captures: { bed_id: $.data.id } }
            - { call: "POST /api/seasons/${season_id}/transition", payload: { to_state: "OPEN_ENROLLMENT" }, as: GardenAdmin }
            - { call: "POST /api/crop-plans", payload: { season_id: "${season_id}", bed_id: "${bed_id}", proposer_volunteer_id: "${v1_id}", crop_type: "Tomato", plant_family: "Solanaceae", requested_sq_ft: 60, planned_start_date: "2026-08-01", planned_end_date: "2026-09-01" }, as: GardenAdmin, captures: { plan_id: $.data.id } }
            - { call: "POST /api/crop-plans/${plan_id}/transition", payload: { to_state: "APPROVED" }, as: GardenAdmin }
            - { call: "POST /api/seasons/${season_id}/transition", payload: { to_state: "PLANTING" }, as: GardenAdmin }
            - { call: "GET /api/seasons/${season_id}", as: GardenAdmin, captures: { sv0: $.data.version } }
            - { call: "POST /api/irrigation-schedules", payload: { season_id: "${season_id}", zone: "Z1", planned_start_at: "2026-08-20T10:00:00Z", planned_end_at: "2026-08-20T11:00:00Z", planned_gallons: 100, expected_season_version: "${sv0}" }, as: GardenAdmin, captures: { irr_a: $.data.id } }
          trigger:
            - { call: "GET /api/seasons/${season_id}", as: GardenAdmin, captures: { sv1: $.data.version } }
            - { call: "POST /api/irrigation-schedules", payload: { season_id: "${season_id}", zone: "Z1", planned_start_at: "2026-08-20T11:00:00Z", planned_end_at: "2026-08-20T12:00:00Z", planned_gallons: 100, expected_season_version: "${sv1}" }, as: GardenAdmin, captures: { irr_b: $.data.id } }
            - { call: "GET /api/seasons/${season_id}", as: GardenAdmin, captures: { sv2: $.data.version } }
            - { call: "POST /api/irrigation-schedules", payload: { season_id: "${season_id}", zone: "Z1", planned_start_at: "2026-08-20T10:30:00Z", planned_end_at: "2026-08-20T11:30:00Z", planned_gallons: 100, expected_season_version: "${sv2}" }, as: GardenAdmin, captures: { err_c: $.data.error_id } }
            - { call: "GET /api/seasons/${season_id}", as: GardenAdmin, captures: { sv3: $.data.version } }
            - { call: "POST /api/irrigation-schedules", payload: { season_id: "${season_id}", zone: "Z1", planned_start_at: "2026-08-20T09:00:00Z", planned_end_at: "2026-08-20T10:00:00Z", planned_gallons: 100, expected_season_version: "${sv3}" }, as: GardenAdmin, captures: { irr_d: $.data.id } }
            - { call: "GET /api/seasons/${season_id}", as: GardenAdmin, captures: { sv4: $.data.version } }
            - { call: "POST /api/irrigation-schedules", payload: { season_id: "${season_id}", zone: "Z2", planned_start_at: "2026-08-20T10:30:00Z", planned_end_at: "2026-08-20T11:30:00Z", planned_gallons: 100, expected_season_version: "${sv4}" }, as: GardenAdmin, captures: { irr_e: $.data.id } }
          assert:
            - "B created (starts exactly at A.end: half-open adjacency legal)"
            - "err_c == ERR_IRRIGATION_OVERLAP (10:30 < 11:00 and 10:00 < 11:30)"
            - "D created (ends exactly at A.start)"
            - "E created (same clock overlap but different zone)"
            - "GET /api/seasons/${season_id}: water_committed_gallons == 400 (A+B+D+E)"

      - name: bed_occupancy_requires_fourteen_day_buffer
        grounds:
          - calculations.bed_occupancy_window_check
          - errors[ERR_BED_OCCUPANCY_OVERLAP]
        distinguishing_aspect: |
          Interval semantics = CLOSED dates PLUS a mandatory 14-day cover-crop buffer on resource
          GardenBed — strictly different geometry from irrigation's half-open adjacency: B may
          start on A.end + 14d + 1 (09-16) but NOT on A.end + 14d exactly (09-15, strict <), and
          a plan entirely BEFORE A also needs the buffer on the other side (07-17 + 14 < 08-01).
        test_recipe:
          setup:
            - "Season OPEN_ENROLLMENT; bed B-01 size 200; plan A 10sqft Solanaceae [08-01..09-01] APPROVED"
          setup_api_calls:
            - { call: "POST /api/volunteers", payload: { full_name: "V One", email: "v1@x.com", date_of_birth: "1990-05-20" }, as: GardenAdmin, captures: { v1_id: $.data.id } }
            - { call: "POST /api/seasons", payload: { name: "2026 Summer", signup_opens_at: "2026-07-01T00:00:00Z", signup_closes_at: "2026-08-10T00:00:00Z", season_starts_at: "2026-08-01T00:00:00Z", season_ends_at: "2026-11-30T00:00:00Z", water_budget_gallons: 1000 }, as: GardenAdmin, captures: { season_id: $.data.id } }
            - { call: "POST /api/beds", payload: { bed_code: "B-01", size_sq_ft: 200, sun_exposure: "FULL", irrigation_zone: "Z1" }, as: GardenAdmin, captures: { bed_id: $.data.id } }
            - { call: "POST /api/seasons/${season_id}/transition", payload: { to_state: "OPEN_ENROLLMENT" }, as: GardenAdmin }
            - { call: "POST /api/crop-plans", payload: { season_id: "${season_id}", bed_id: "${bed_id}", proposer_volunteer_id: "${v1_id}", crop_type: "Tomato", plant_family: "Solanaceae", requested_sq_ft: 10, planned_start_date: "2026-08-01", planned_end_date: "2026-09-01" }, as: GardenAdmin, captures: { plan_a: $.data.id } }
            - { call: "POST /api/crop-plans/${plan_a}/transition", payload: { to_state: "APPROVED" }, as: GardenAdmin }
            - { call: "POST /api/crop-plans", payload: { season_id: "${season_id}", bed_id: "${bed_id}", proposer_volunteer_id: "${v1_id}", crop_type: "Beans", plant_family: "Fabaceae", requested_sq_ft: 10, planned_start_date: "2026-09-16", planned_end_date: "2026-10-01" }, as: GardenAdmin, captures: { plan_b: $.data.id } }
            - { call: "POST /api/crop-plans", payload: { season_id: "${season_id}", bed_id: "${bed_id}", proposer_volunteer_id: "${v1_id}", crop_type: "Kale", plant_family: "Brassicaceae", requested_sq_ft: 10, planned_start_date: "2026-09-15", planned_end_date: "2026-09-20" }, as: GardenAdmin, captures: { plan_c: $.data.id } }
            - { call: "POST /api/crop-plans", payload: { season_id: "${season_id}", bed_id: "${bed_id}", proposer_volunteer_id: "${v1_id}", crop_type: "Squash", plant_family: "Cucurbitaceae", requested_sq_ft: 10, planned_start_date: "2026-07-01", planned_end_date: "2026-07-17" }, as: GardenAdmin, captures: { plan_d: $.data.id } }
          trigger:
            - { call: "POST /api/crop-plans/${plan_b}/transition", payload: { to_state: "APPROVED" }, as: GardenAdmin, captures: { b_status: $.data.status } }
            - { call: "POST /api/crop-plans/${plan_c}/transition", payload: { to_state: "APPROVED" }, as: GardenAdmin, captures: { err_c: $.data.error_id } }
            - { call: "POST /api/crop-plans/${plan_d}/transition", payload: { to_state: "APPROVED" }, as: GardenAdmin, captures: { d_status: $.data.status } }
          assert:
            - "b_status == APPROVED (A.end 09-01 + 14d = 09-15 < 09-16: buffer satisfied)"
            - "err_c == ERR_BED_OCCUPANCY_OVERLAP (09-15 < 09-15 is false: exact buffer edge still conflicts)"
            - "d_status == APPROVED (D.end 07-17 + 14d = 07-31 < A.start 08-01: before-side buffer satisfied)"

  - rule_id: compensating_invariant
    instances:
      - name: tool_unit_conservation_across_return_damage_writeoff
        grounds:
          - state_machines.ToolCheckout.OPEN_to_PARTIAL_RETURN
          - state_machines.ToolCheckout.OPEN_to_RETURNED
          - state_machines.ToolCheckout.OPEN_to_CLOSED_LOSS
          - entities.ToolItem.fields.available_count
          - entities.ToolItem.fields.checked_out_count
          - entities.ToolItem.fields.in_maintenance_count
          - entities.ToolItem.fields.written_off_count
        distinguishing_aspect: |
          Conserved quantity = physical tool units: total_count == available + checked_out +
          in_maintenance + written_off across every compensating pair (checkout/return-GOOD,
          return-DAMAGED/restore, checkout/write-off). A damaged return diverts units to
          maintenance instead of available; a write-off diverts to written_off and drops the
          borrower to PROBATION.
        test_recipe:
          setup:
            - "V1 oriented+signed; tool 'Hoe set' total_count 5 (HAND)"
          setup_api_calls:
            - { call: "POST /api/volunteers", payload: { full_name: "V One", email: "v1@x.com", date_of_birth: "1990-05-20" }, as: GardenAdmin, captures: { v1_id: $.data.id } }
            - { call: "POST /api/volunteers/${v1_id}/orientation/complete", as: GardenAdmin }
            - { call: "POST /api/volunteers/${v1_id}/waiver/sign", as: GardenAdmin }
            - { call: "POST /api/tools", payload: { tool_name: "Hoe set", category: "HAND", total_count: 5 }, as: GardenAdmin, captures: { tool_id: $.data.id } }
          trigger:
            - { call: "POST /api/tool-checkouts", payload: { tool_id: "${tool_id}", volunteer_id: "${v1_id}", qty: 2 }, as: Volunteer, as_user_id: "${v1_id}", captures: { co1: $.data.id } }
            - { call: "GET /api/tools/${tool_id}", as: GardenAdmin, captures: { a1: $.data.available_count, o1: $.data.checked_out_count } }
            - { call: "POST /api/tool-checkouts/${co1}/transition", payload: { to_state: "RETURNED", qty_returned: 1, condition_on_return: "DAMAGED" }, as: Volunteer, as_user_id: "${v1_id}", captures: { st_p: $.data.status } }
            - { call: "POST /api/tool-checkouts/${co1}/transition", payload: { to_state: "RETURNED", qty_returned: 1, condition_on_return: "GOOD" }, as: Volunteer, as_user_id: "${v1_id}", captures: { st_r: $.data.status } }
            - { call: "GET /api/tools/${tool_id}", as: GardenAdmin, captures: { a2: $.data.available_count, o2: $.data.checked_out_count, m2: $.data.in_maintenance_count } }
            - { call: "POST /api/tools/${tool_id}/restore", payload: { qty: 1 }, as: GardenAdmin }
            - { call: "GET /api/tools/${tool_id}", as: GardenAdmin, captures: { a3: $.data.available_count, m3: $.data.in_maintenance_count } }
            - { call: "POST /api/tool-checkouts", payload: { tool_id: "${tool_id}", volunteer_id: "${v1_id}", qty: 2 }, as: Volunteer, as_user_id: "${v1_id}", captures: { co2: $.data.id } }
            - { call: "POST /api/tool-checkouts/${co2}/transition", payload: { to_state: "CLOSED_LOSS" }, as: GardenAdmin }
            - { call: "GET /api/tools/${tool_id}", as: GardenAdmin, captures: { a4: $.data.available_count, o4: $.data.checked_out_count, m4: $.data.in_maintenance_count, w4: $.data.written_off_count } }
            - { call: "GET /api/volunteers/${v1_id}", as: GardenAdmin, captures: { v1_stand: $.data.standing } }
          assert:
            - "after checkout of 2: a1 == 3, o1 == 2 (sum with 0/0 = 5)"
            - "st_p == PARTIAL_RETURN after returning 1 of 2 DAMAGED"
            - "st_r == RETURNED after returning the remainder 1 GOOD"
            - "after both returns: a2 == 4, o2 == 0, m2 == 1 (4+0+1+0 == 5)"
            - "after restore: a3 == 5, m3 == 0"
            - "after write-off of 2: a4 == 3, o4 == 0, m4 == 0, w4 == 2 (3+0+0+2 == 5 — conservation holds)"
            - "v1_stand == PROBATION (loss cascade)"

      - name: slot_occupancy_conserved_across_cancel_and_promotion
        grounds:
          - calculations.slot_occupancy
          - calculations.waitlist_promotion_select
          - state_machines.ShiftSignup.CONFIRMED_to_CANCELLED
          - state_machines.ShiftSignup.WAITLISTED_to_CONFIRMED
        distinguishing_aspect: |
          Conserved quantity = occupied spots on the slot: cancel(CONFIRMED) frees exactly one
          spot and the paired promotion fills exactly one, so confirmed_count is unchanged (3)
          across the action pair when an eligible waitlisted candidate exists; the waitlist
          counter decrements and the freed-then-refilled slot never leaves FULL.
        test_recipe:
          setup:
            - "Season OPEN_ENROLLMENT; slot capacity_total 3 / capacity_youth 1; V1-V4 oriented+signed adults"
            - "S1, S2, S3 CONFIRMED (slot FULL); S4 WAITLISTED at position 1"
          setup_api_calls:
            - { call: "POST /api/volunteers", payload: { full_name: "V One", email: "v1@x.com", date_of_birth: "1990-05-20" }, as: GardenAdmin, captures: { v1_id: $.data.id } }
