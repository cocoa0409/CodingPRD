          trigger:
            - { call: "POST /items/${i}/conservation-assessments", payload: { expected_item_version: "${iv}", condition_grade_observed: "POOR", urgency_score: 60, treatment_estimate_hours: 5 }, as: Archivist, captures: { a1: $.data.id } }
            - { call: "POST /items/${i}/conservation-assessments", payload: { expected_item_version: "${iv}", condition_grade_observed: "FAIR", urgency_score: 40, treatment_estimate_hours: 2 }, as: Archivist, captures: { err: $.data.error_id } }
            - { call: "GET /items/${i}", as: Archivist, captures: { iv2: $.data.version, cur: $.data.current_assessment_id } }
            - { call: "POST /items/${i}/conservation-assessments", payload: { expected_item_version: "${iv2}", condition_grade_observed: "FAIR", urgency_score: 40, treatment_estimate_hours: 2 }, as: Archivist, captures: { a2: $.data.id } }
            - { call: "GET /items/${i}/conservation-assessments", as: Archivist }
          assert:
            - "first create succeeds (${a1})"
            - "second create with stale version: error_id == ERR_STALE_VERSION (${err}), http 412; no assessment created"
            - "item version advanced exactly once (${iv2} == ${iv} + 1); current_assessment_id == ${a1} (${cur})"
            - "retry with fresh version succeeds (${a2}); assessment list shows ${a1} SUPERSEDED and ${a2} DRAFT"

      - name: scheduled_cooling_off_sweep
        claim_type: scheduled_actions
        grounds:
          - state_machines.DeaccessionProposal
          - entities.DeaccessionProposal.fields.finalize_not_before
          - errors[ERR_COOLING_OFF_NOT_ELAPSED]
        distinguishing_aspect: "Deferred action: finalize is blocked while the 30-day cooling-off runs (ERR_COOLING_OFF_NOT_ELAPSED); the clock sweep at exactly finalize_not_before moves APPROVED -> COOLED_OFF and finalize succeeds — equality admits."
        test_recipe:
          setup: ["proposal P APPROVED at 2026-08-01T00:00:00Z (finalize_not_before 2026-08-31T00:00:00Z) over one PENDING_CATALOG item; TRANSFER disposal"]
          setup_api_calls:
            - { call: "POST /storage-zones", payload: { zone_code: "Z1", name: "Vault A" }, as: Registrar, captures: { z: $.data.id } }
