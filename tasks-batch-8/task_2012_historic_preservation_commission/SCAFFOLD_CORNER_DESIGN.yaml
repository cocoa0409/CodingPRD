# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Task 2012: Historic Preservation Commission & Certificate of Appropriateness
# Breadth coverage of §1.1–§1.7 claims not already covered by §1.8.
# Logical clock default 2026-08-01T00:00:00Z unless a recipe sets it.
# =============================================================================

scaffold_corner_design:
  - section: entities
    instances:
      - name: district_creation_defaults
        claim_type: creation
        grounds: ["entities.HistoricDistrict"]
        distinguishing_aspect: "A newly created district starts ACTIVE with zero census counters, STABLE posture, and version 1."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls:
            - call: "POST /preservation/districts"
              payload: { name: "Old Town", boundary_description: "Blocks 1-9", significance_tier: "LOCAL" }
              as: PreservationStaff
              captures: { d_id: $.data.id, d_status: $.data.status, d_cc: $.data.contributing_count, d_tc: $.data.total_inventory_count, d_posture: $.data.preservation_posture, d_v: $.data.version }
          trigger: []
          assert:
            - "response code 201; status == ACTIVE; contributing_count == 0; total_inventory_count == 0; preservation_posture == STABLE; version == 1"

      - name: property_get_not_found_returns_404
        claim_type: not_found
        grounds: ["entities.Property", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET on a well-formed but non-existent property id returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /preservation/properties/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: PreservationStaff
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND and http status 404"

      - name: guideline_set_version_no_increments_per_district
        claim_type: computed_field
        grounds: ["entities.DesignGuidelineSet.fields.version_no"]
        distinguishing_aspect: "version_no is assigned per-district monotonically: first set 1, second set 2."
        test_recipe:
          setup: ["one district"]
          setup_api_calls:
            - call: "POST /preservation/districts"
              payload: { name: "Old Town", boundary_description: "Blocks 1-9", significance_tier: "LOCAL" }
              as: PreservationStaff
              captures: { d_id: $.data.id }
            - call: "POST /preservation/districts/${d_id}/guideline-sets"
              payload: { title: "DG-1", sections: [{ section_code: "S1", text: "Siding" }] }
              as: PreservationStaff
              captures: { gs1_id: $.data.id, gs1_v: $.data.version_no }
          trigger:
            - call: "POST /preservation/districts/${d_id}/guideline-sets"
              payload: { title: "DG-2", sections: [{ section_code: "S1", text: "Siding revised" }] }
              as: PreservationStaff
              captures: { gs2_id: $.data.id, gs2_v: $.data.version_no }
          assert:
            - "DesignGuidelineSet.${gs1_id}.version_no == 1 and .status == DRAFT"
            - "DesignGuidelineSet.${gs2_id}.version_no == 2"

      - name: application_computed_fee_input_ignored
        claim_type: computed_field
        grounds: ["entities.Application.fields.provisional_fee_cents"]
        distinguishing_aspect: "A client-supplied provisional_fee_cents in the create body is ignored; the server computes 10100 from the work items."
        test_recipe:
          setup: ["one owner and one property outside any district"]
          setup_api_calls:
            - call: "POST /preservation/owners"
              payload: { full_name: "Sam Owner", email: "sam@x.com", mailing_address: "20 Main St" }
              as: PreservationStaff
              captures: { o_id: $.data.id }
            - call: "POST /preservation/properties"
              payload: { address: "3 Rural Rd", parcel_number: "P-2000", owner_id: "${o_id}", contributing_status: "NON_CONTRIBUTING", construction_year: 1980, assessed_value_cents: 3000000 }
              as: PreservationStaff
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /preservation/applications"
              payload: { property_id: "${p_id}", owner_id: "${o_id}", application_type: "ALTERATION", is_visible_from_public_way: false, after_the_fact: false, work_items: [{ category: "SITE_WORK", description: "path", estimated_cost_cents: 50000 }], provisional_fee_cents: 1 }
              as: Applicant
              as_user_id: "${o_id}"
              captures: { app_id: $.data.id, prov: $.data.provisional_fee_cents }
          assert:
            - "Application.${app_id}.provisional_fee_cents == 10100 (10000 + round(0.002*50000)), not the client-supplied 1"

      - name: public_comment_has_no_version_field
        claim_type: immutability
        grounds: ["entities.PublicComment"]
        distinguishing_aspect: "PublicComment is common_fields: false — records expose id and created_at but no version/updated_at, and no update endpoint exists."
        test_recipe:
          setup: ["a SCHEDULED hearing (commission-track application accepted into a meeting)"]
          setup_api_calls:
            - call: "POST /preservation/districts"
              payload: { name: "Old Town", boundary_description: "Blocks 1-9", significance_tier: "LOCAL" }
              as: PreservationStaff
              captures: { d_id: $.data.id }
            - call: "POST /preservation/owners"
              payload: { full_name: "Ted Owner", email: "ted@x.com", mailing_address: "21 Main St" }
              as: PreservationStaff
              captures: { o_id: $.data.id }
            - call: "POST /preservation/properties"
              payload: { address: "11 Elm", parcel_number: "P-2100", district_id: "${d_id}", owner_id: "${o_id}", contributing_status: "NON_CONTRIBUTING", construction_year: 1945, assessed_value_cents: 5000000 }
              as: PreservationStaff
              captures: { p_id: $.data.id }
            - call: "POST /preservation/applications"
              payload: { property_id: "${p_id}", owner_id: "${o_id}", application_type: "ADDITION", is_visible_from_public_way: true, after_the_fact: false, work_items: [{ category: "ADDITION", description: "sunroom", estimated_cost_cents: 1100000 }] }
              as: Applicant
              as_user_id: "${o_id}"
              captures: { app_id: $.data.id }
            - call: "POST /preservation/applications/${app_id}/begin-review"
              payload: {}
              as: PreservationStaff
            - call: "POST /preservation/applications/${app_id}/accept-completeness"
              payload: { verified_work_items: [{ category: "ADDITION", verified_cost_cents: 1100000 }] }
              as: PreservationStaff
              as_user_id: "staff-1"
            - call: "POST /preservation/meetings"
              payload: { meeting_date: "2026-09-01T00:00:00Z", location: "City Hall", agenda_capacity: 2 }
              as: PreservationStaff
              captures: { m_id: $.data.id }
            - call: "POST /preservation/hearings"
              payload: { application_id: "${app_id}", meeting_id: "${m_id}", notice_posted_at: "2026-08-10T00:00:00Z" }
              as: PreservationStaff
              captures: { h_id: $.data.id }
          trigger:
            - call: "POST /preservation/hearings/${h_id}/comments"
              payload: { commenter_name: "Neighbor Ned", stance: "OPPOSE", comment_text: "Too tall" }
              as: Applicant
              as_user_id: "${o_id}"
              captures: { c_id: $.data.id }
          assert:
            - "PublicComment response exposes id, created_at, hearing_id, stance, submitted_at — and no version/updated_at keys"

  - section: state_machines
    instances:
      - name: application_initial_state_submitted
        claim_type: initial_state
        grounds: ["state_machines.Application"]
        distinguishing_aspect: "A newly created application starts in SUBMITTED."
        test_recipe:
          setup: ["owner + property"]
          setup_api_calls:
            - call: "POST /preservation/owners"
              payload: { full_name: "Uma Owner", email: "uma@x.com", mailing_address: "22 Main St" }
              as: PreservationStaff
              captures: { o_id: $.data.id }
            - call: "POST /preservation/properties"
              payload: { address: "14 Elm", parcel_number: "P-2200", owner_id: "${o_id}", contributing_status: "NON_CONTRIBUTING", construction_year: 1977, assessed_value_cents: 3500000 }
              as: PreservationStaff
              captures: { p_id: $.data.id }
            - call: "POST /preservation/applications"
              payload: { property_id: "${p_id}", owner_id: "${o_id}", application_type: "ALTERATION", is_visible_from_public_way: false, after_the_fact: false, work_items: [{ category: "SITE_WORK", description: "wall", estimated_cost_cents: 60000 }] }
              as: Applicant
              as_user_id: "${o_id}"
              captures: { app_id: $.data.id, st: $.data.status }
          trigger: []
          assert:
            - "Application.${app_id}.status == SUBMITTED"

      - name: begin_review_twice_returns_invalid_state
        claim_type: invalid_transition
        grounds: ["state_machines.Application.SUBMITTED_to_UNDER_STAFF_REVIEW", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Second begin-review on an application already UNDER_STAFF_REVIEW fails with ERR_INVALID_STATE (idempotency guard)."
        test_recipe:
          setup: ["application SUBMITTED, one successful begin-review"]
          setup_api_calls:
            - call: "POST /preservation/owners"
              payload: { full_name: "Vic Owner", email: "vic@x.com", mailing_address: "23 Main St" }
              as: PreservationStaff
              captures: { o_id: $.data.id }
            - call: "POST /preservation/properties"
              payload: { address: "16 Elm", parcel_number: "P-2300", owner_id: "${o_id}", contributing_status: "NON_CONTRIBUTING", construction_year: 1979, assessed_value_cents: 3500000 }
              as: PreservationStaff
              captures: { p_id: $.data.id }
            - call: "POST /preservation/applications"
              payload: { property_id: "${p_id}", owner_id: "${o_id}", application_type: "ALTERATION", is_visible_from_public_way: false, after_the_fact: false, work_items: [{ category: "SITE_WORK", description: "wall", estimated_cost_cents: 60000 }] }
              as: Applicant
              as_user_id: "${o_id}"
              captures: { app_id: $.data.id }
            - call: "POST /preservation/applications/${app_id}/begin-review"
              payload: {}
              as: PreservationStaff
          trigger:
            - call: "POST /preservation/applications/${app_id}/begin-review"
              payload: {}
              as: PreservationStaff
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE; Application remains UNDER_STAFF_REVIEW"

      - name: decide_on_terminal_application_rejected
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.Application"]
        distinguishing_aspect: "A second decide on an APPROVED application fails with ERR_INVALID_STATE — terminal lockdown."
        test_recipe:
          setup: ["STAFF-track application APPROVED"]
          setup_api_calls:
            - call: "POST /preservation/owners"
              payload: { full_name: "Wes Owner", email: "wes@x.com", mailing_address: "24 Main St" }
              as: PreservationStaff
              captures: { o_id: $.data.id }
            - call: "POST /preservation/properties"
              payload: { address: "18 Elm", parcel_number: "P-2400", owner_id: "${o_id}", contributing_status: "NON_CONTRIBUTING", construction_year: 1981, assessed_value_cents: 3500000 }
              as: PreservationStaff
              captures: { p_id: $.data.id }
            - call: "POST /preservation/applications"
              payload: { property_id: "${p_id}", owner_id: "${o_id}", application_type: "ALTERATION", is_visible_from_public_way: false, after_the_fact: false, work_items: [{ category: "SITE_WORK", description: "wall", estimated_cost_cents: 200000 }] }
              as: Applicant
              as_user_id: "${o_id}"
              captures: { app_id: $.data.id }
            - call: "POST /preservation/applications/${app_id}/begin-review"
              payload: {}
              as: PreservationStaff
            - call: "POST /preservation/applications/${app_id}/accept-completeness"
              payload: { verified_work_items: [{ category: "SITE_WORK", verified_cost_cents: 200000 }] }
              as: PreservationStaff
              as_user_id: "staff-1"
            - call: "POST /preservation/applications/${app_id}/decide"
              payload: { outcome: "APPROVE" }
              as: PreservationStaff
              as_user_id: "staff-2"
          trigger:
            - call: "POST /preservation/applications/${app_id}/decide"
              payload: { outcome: "DENY", denial_rationale_sections: ["S1"] }
              as: PreservationStaff
              as_user_id: "staff-2"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE; Application remains APPROVED"

      - name: withdraw_at_hearing_open_zero_refund
        claim_type: side_effect_execution
        grounds: ["state_machines.Application.HEARING_OPEN_to_WITHDRAWN", "calculations.fee_refund_schedule"]
        distinguishing_aspect: "Withdrawal at HEARING_OPEN refunds 0% of the 55500-cent paid fee, zeroes the balance, withdraws the hearing, and frees the agenda slot."
        test_recipe:
          setup: ["COMMISSION-track application fully paid (55500 cents), hearing OPENED in a capacity-2 meeting"]
          setup_api_calls:
            - call: "POST /preservation/districts"
              payload: { name: "Old Town", boundary_description: "Blocks 1-9", significance_tier: "LOCAL" }
              as: PreservationStaff
              captures: { d_id: $.data.id }
            - call: "POST /preservation/owners"
              payload: { full_name: "Xia Owner", email: "xia@x.com", mailing_address: "25 Main St" }
              as: PreservationStaff
              captures: { o_id: $.data.id }
            - call: "POST /preservation/properties"
              payload: { address: "20 Elm", parcel_number: "P-2500", district_id: "${d_id}", owner_id: "${o_id}", contributing_status: "NON_CONTRIBUTING", construction_year: 1938, assessed_value_cents: 5500000 }
              as: PreservationStaff
              captures: { p_id: $.data.id }
            - call: "POST /preservation/applications"
              payload: { property_id: "${p_id}", owner_id: "${o_id}", application_type: "ADDITION", is_visible_from_public_way: true, after_the_fact: false, work_items: [{ category: "ADDITION", description: "sunroom", estimated_cost_cents: 1100000 }] }
              as: Applicant
              as_user_id: "${o_id}"
              captures: { app_id: $.data.id }
            - call: "POST /preservation/applications/${app_id}/begin-review"
              payload: {}
              as: PreservationStaff
            - call: "POST /preservation/applications/${app_id}/accept-completeness"
              payload: { verified_work_items: [{ category: "ADDITION", verified_cost_cents: 1100000 }] }
              as: PreservationStaff
              as_user_id: "staff-1"
            - call: "POST /preservation/meetings"
              payload: { meeting_date: "2026-09-01T00:00:00Z", location: "City Hall", agenda_capacity: 2 }
              as: PreservationStaff
              captures: { m_id: $.data.id }
            - call: "POST /preservation/hearings"
              payload: { application_id: "${app_id}", meeting_id: "${m_id}", notice_posted_at: "2026-08-10T00:00:00Z" }
              as: PreservationStaff
              captures: { h_id: $.data.id }
            - call: "POST /preservation/hearings/${h_id}/open"
              payload: {}
              as: Commissioner
            - call: "POST /preservation/applications/${app_id}/fee-payments"
              payload: { amount_cents: 55500 }
              as: Applicant
              as_user_id: "${o_id}"
          trigger:
            - call: "POST /preservation/applications/${app_id}/withdraw"
              payload: {}
              as: Applicant
              as_user_id: "${o_id}"
              captures: { refunded: $.data.refunded_fee_cents, bal: $.data.fee_balance_cents }
          assert:
            - "Application.${app_id}.refunded_fee_cents == 0 (HEARING_OPEN stage refunds 0%)"
            - "Application.${app_id}.fee_balance_cents == 0 and status == WITHDRAWN"
            - "Hearing.${h_id}.status == WITHDRAWN"
            - "CommissionMeeting.${m_id}.scheduled_hearing_count == 0"

      - name: finalize_denial_window_boundary
        claim_type: precondition_enforcement
        grounds: ["state_machines.Application.DENIED_to_DENIED_FINAL"]
        distinguishing_aspect: "finalize-denial is rejected at exactly decided_at + 30 days (window still inclusive for appeals) and succeeds one day later."
        test_recipe:
          setup: ["STAFF-track application DENIED with decided_at == 2026-08-10T00:00:00Z"]
          setup_api_calls:
            - call: "POST /preservation/owners"
              payload: { full_name: "Yara Owner", email: "yara@x.com", mailing_address: "26 Main St" }
              as: PreservationStaff
              captures: { o_id: $.data.id }
            - call: "POST /preservation/properties"
              payload: { address: "22 Elm", parcel_number: "P-2600", owner_id: "${o_id}", contributing_status: "NON_CONTRIBUTING", construction_year: 1983, assessed_value_cents: 3500000 }
              as: PreservationStaff
              captures: { p_id: $.data.id }
            - call: "POST /preservation/applications"
              payload: { property_id: "${p_id}", owner_id: "${o_id}", application_type: "ALTERATION", is_visible_from_public_way: false, after_the_fact: false, work_items: [{ category: "SITE_WORK", description: "wall", estimated_cost_cents: 200000 }] }
              as: Applicant
              as_user_id: "${o_id}"
              captures: { app_id: $.data.id }
            - call: "POST /preservation/applications/${app_id}/begin-review"
              payload: {}
              as: PreservationStaff
            - call: "POST /preservation/applications/${app_id}/accept-completeness"
              payload: { verified_work_items: [{ category: "SITE_WORK", verified_cost_cents: 200000 }] }
              as: PreservationStaff
              as_user_id: "staff-1"
            - call: "POST /preservation/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: PreservationStaff
            - call: "POST /preservation/applications/${app_id}/decide"
              payload: { outcome: "DENY", denial_rationale_sections: ["S2"] }
              as: PreservationStaff
              as_user_id: "staff-2"
            - call: "POST /preservation/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-09T00:00:00Z" }
              as: PreservationStaff
          trigger:
            - call: "POST /preservation/applications/${app_id}/finalize-denial"
              payload: {}
              as: PreservationStaff
              captures: { err: $.data.error_id }
            - call: "POST /preservation/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T00:00:00Z" }
              as: PreservationStaff
            - call: "POST /preservation/applications/${app_id}/finalize-denial"
              payload: {}
              as: PreservationStaff
              captures: { st: $.data.status }
          assert:
            - "at exactly decided_at + 30 days: error_id == ERR_INVALID_STATE (appeal window still open)"
            - "at decided_at + 31 days: status == DENIED_FINAL"

      - name: guideline_adopt_supersedes_prior
        claim_type: side_effect_execution
        grounds: ["state_machines.DesignGuidelineSet.DRAFT_to_ADOPTED"]
        distinguishing_aspect: "Adopting a second guideline set supersedes the first; at most one ADOPTED set per district."
        test_recipe:
          setup: ["district with DG-1 adopted"]
          setup_api_calls:
            - call: "POST /preservation/districts"
              payload: { name: "Old Town", boundary_description: "Blocks 1-9", significance_tier: "LOCAL" }
              as: PreservationStaff
              captures: { d_id: $.data.id }
            - call: "POST /preservation/districts/${d_id}/guideline-sets"
              payload: { title: "DG-1", sections: [{ section_code: "S1", text: "Siding" }] }
              as: PreservationStaff
              captures: { gs1_id: $.data.id }
            - call: "POST /preservation/guideline-sets/${gs1_id}/adopt"
              payload: {}
              as: PreservationStaff
            - call: "POST /preservation/districts/${d_id}/guideline-sets"
              payload: { title: "DG-2", sections: [{ section_code: "S1", text: "Siding v2" }] }
              as: PreservationStaff
              captures: { gs2_id: $.data.id }
          trigger:
            - call: "POST /preservation/guideline-sets/${gs2_id}/adopt"
              payload: {}
              as: PreservationStaff
              captures: { gs2_status: $.data.status }
          assert:
            - "DesignGuidelineSet.${gs2_id}.status == ADOPTED with adopted_at set"
            - "DesignGuidelineSet.${gs1_id}.status == SUPERSEDED"

      - name: delay_lazy_expiry_at_end_boundary
        claim_type: valid_transition
        grounds: ["state_machines.DemolitionDelay.ACTIVE_to_EXPIRED", "calculations.demolition_delay_schedule"]
        distinguishing_aspect: "A LOCAL delay approved 2026-08-01 has provisional end 2026-10-30; at exactly that instant a read reports EXPIRED (half-open end-exclusive semantics)."
        test_recipe:
          setup: ["DEMOLITION application approved at 2026-08-01T00:00:00Z on a LOCAL-tier property"]
          setup_api_calls:
            - call: "POST /preservation/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PreservationStaff
            - call: "POST /preservation/districts"
              payload: { name: "Old Town", boundary_description: "Blocks 1-9", significance_tier: "LOCAL" }
              as: PreservationStaff
              captures: { d_id: $.data.id }
            - call: "POST /preservation/owners"
              payload: { full_name: "Zoe Owner", email: "zoe@x.com", mailing_address: "27 Main St" }
              as: PreservationStaff
              captures: { o_id: $.data.id }
            - call: "POST /preservation/properties"
              payload: { address: "24 Elm", parcel_number: "P-2700", district_id: "${d_id}", owner_id: "${o_id}", contributing_status: "NON_CONTRIBUTING", construction_year: 1910, assessed_value_cents: 6000000 }
              as: PreservationStaff
              captures: { p_id: $.data.id }
            - call: "POST /preservation/applications"
              payload: { property_id: "${p_id}", owner_id: "${o_id}", application_type: "DEMOLITION", is_visible_from_public_way: true, after_the_fact: false, work_items: [{ category: "DEMOLITION", description: "raze", estimated_cost_cents: 500000 }] }
              as: Applicant
              as_user_id: "${o_id}"
              captures: { app_id: $.data.id }
            - call: "POST /preservation/applications/${app_id}/begin-review"
              payload: {}
              as: PreservationStaff
            - call: "POST /preservation/applications/${app_id}/accept-completeness"
              payload: { verified_work_items: [{ category: "DEMOLITION", verified_cost_cents: 500000 }] }
              as: PreservationStaff
              as_user_id: "staff-1"
            - call: "POST /preservation/meetings"
              payload: { meeting_date: "2026-09-01T00:00:00Z", location: "City Hall", agenda_capacity: 2 }
              as: PreservationStaff
              captures: { m_id: $.data.id }
            - call: "POST /preservation/hearings"
              payload: { application_id: "${app_id}", meeting_id: "${m_id}", notice_posted_at: "2026-08-10T00:00:00Z" }
              as: PreservationStaff
              captures: { h_id: $.data.id }
            - call: "POST /preservation/hearings/${h_id}/open"
              payload: {}
              as: Commissioner
            - call: "POST /preservation/applications/${app_id}/decide"
              payload: { outcome: "APPROVE" }
              as: Commissioner
            - call: "GET /preservation/demolition-delays"
              payload: { application_id: "${app_id}" }
              as: PreservationStaff
              captures: { delay_id: "$.data[0].id" }
            - call: "POST /preservation/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-30T00:00:00Z" }
              as: PreservationStaff
          trigger:
            - call: "GET /preservation/demolition-delays/${delay_id}"
              payload: {}
              as: PreservationStaff
              captures: { dl_status: $.data.status, dl_end: $.data.provisional_delay_end }
          assert:
            - "DemolitionDelay.${delay_id}.provisional_delay_end == 2026-10-30T00:00:00Z (2026-08-01 + 90 days)"
            - "at clock == provisional_delay_end the delay reports status EXPIRED (end-exclusive)"

  - section: calculations
    instances:
      - name: track_one_dollar_below_threshold_staff
        claim_type: correct_result
        grounds: ["calculations.review_track_determination"]
        distinguishing_aspect: "verified_cost_cents == 999999 (one cent below the 1000000 threshold) selects STAFF and no hearing surcharge is assessed."
        test_recipe:
          setup: ["LOCAL district; NON_CONTRIBUTING property; ALTERATION verified at 999999"]
          setup_api_calls:
            - call: "POST /preservation/districts"
              payload: { name: "Old Town", boundary_description: "Blocks 1-9", significance_tier: "LOCAL" }
              as: PreservationStaff
