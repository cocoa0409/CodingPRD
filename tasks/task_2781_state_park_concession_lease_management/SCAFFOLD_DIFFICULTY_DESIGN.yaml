            - "The canonical ACTIVE lease with base_fee_pct 5.00 (category rates 6.50 lodging / 5.00 food-beverage / 4.50 retail / 7.00 activity) and an APPROVED operating plan covering 2027-03-01..2027-12-31."
            - "The logical clock is at 2027-05-02, so the April 2027 period is closed."
            - "No report exists yet on the lease."
