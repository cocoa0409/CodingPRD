              as: Employer
              as_user_id: "${emp_su}"
              captures: { camp_su: $.data.id }
            - call: "POST /api/campaigns/${camp_su}/activate"
              payload: {}
              as: Employer
              as_user_id: "${emp_su}"
            - call: "POST /api/sponsored-jobs"
              payload: { campaign_id: "${camp_su}", job_posting_id: "${post_su}", cpc_bid_cents: 300, cpa_bid_cents: 900 }
              as: Employer
              as_user_id: "${emp_su}"
              captures: { sj_su: $.data.id }
            - call: "POST /api/sponsored-jobs/${sj_su}/pacing-holds"
              payload: { amount_cents: 600 }
              as: Employer
              as_user_id: "${emp_su}"
              captures: { hold_su: $.data.id }
          trigger:
            - call: "POST /api/employers/${emp_su}/suspend"
              payload: { reason: "Misleading posting: pay-to-start fee" }
              as: TrustReviewer
          assert:
            - "link 1: Employer.${emp_su}.status == SUSPENDED and billing_status == FROZEN"
            - "link 2: JobPosting.${post_su}.state == SUSPENDED and Campaign.${camp_su}.status == PAUSED"
            - "link 3: SponsoredJob.${sj_su}.status == PAUSED"
            - "link 4: PacingHold.${hold_su}.status == RELEASED and Campaign.${camp_su}.held_cents == 0"

  # ===========================================================================
  # Rule 5 — priority_pair_validation_conflict (>= 2 instances, different pairs)
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
