          setup:
            - "A delivered CUSTOM_FABRICATED appliance, max_protrusive_mm 8.00, starting_advancement_mm 4.75."
            - "A SIGNED standard written order dated 2026-05-10 against a face-to-face encounter on 2026-04-20."
            - "Logical clock at 2026-06-01, no titration visits yet."
