          - endpoints."POST /_clock/set_current_utc"
        distinguishing_aspect: "rate_lock_expires_at is issue-clock plus exactly RATE_LOCK_DAYS (31) days, and the sweep fires on strict inequality: setting the clock to exactly 2026-09-01T00:00:00Z reports expired_contract_count 0 and leaves the contract ISSUED with liability 20606, while one second later reports 1 and zeroes both the contract's and the branch's liability."
        test_recipe:
          setup:
