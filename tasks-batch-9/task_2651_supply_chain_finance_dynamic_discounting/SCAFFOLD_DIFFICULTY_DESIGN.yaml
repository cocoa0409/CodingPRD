# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task 2651 - Supply Chain Finance & Dynamic Discounting
# 9 rule_id blocks / 22 instances. Every grounds ref resolves into SCAFFOLD.yaml §1.1-§1.7.
# Every numeric assert below was computed by executing the referenced calculations[].formula.
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: early_payment_discount_pay_date_vs_value_date_basis
        grounds:
          - calculations.early_payment_discount
          - calculations.days_early
          - entities.EarlyPayment.fields.value_date
          - entities.Invoice.fields.provisional_discount_cents
          - entities.Invoice.fields.final_discount_cents
          - entities.Invoice.fields.discount_true_up_cents
          - state_machines.EarlyPayment.REMITTED_to_CONFIRMED
        distinguishing_aspect: |
          This variant pair lives on the EarlyPayment cash domain: identical invoice face 108751 and
          identical accepted APR 800 bps yield discount 1353 on PAY_DATE_BASIS (56 days from
          execution_date 2026-08-05) and 1305 on VALUE_DATE_BASIS (54 days from value_date
          2026-08-07), a signed true-up of exactly -48 cents booked at settlement confirmation.
        test_recipe:
          setup:
            - "Buyer with self-funding enabled and a 100000000-cent credit limit; SELF_ONLY programme OPEN"
            - "Supplier fully onboarded (idv PASSED, bank VERIFIED, payment_ready_at stamped)"
            - "One invoice of face 108751 (three lines at 875 bps tax), net_due_date 2026-09-30"
            - "An ACCEPTED offer at 800 bps with requested_pay_date 2026-08-05, and a RESERVED EarlyPayment"
            - "Logical clock advanced to 2026-08-05 so execution_date is 2026-08-05 and value_date is 2026-08-07"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformOps
            - call: "POST /buyers"
              payload: { legal_name: "Northwind Retail Group", tax_id: "987654321", credit_limit_cents: 100000000, self_funding_enabled: true, reclass_days_threshold: 30, reclass_apr_threshold_bps: 900 }
              as: PlatformOps
              captures: { buyer_id: "$.data.id" }
            - call: "POST /buyer-programs"
              payload: { buyer_id: "${buyer_id}", name: "Q3 Dynamic Discounting", program_type: "SUPPLIER_NAMED", max_acceptable_apr_bps: 1200, min_days_early: 5, concentration_cap_pct: 100.00, funding_policy: "SELF_ONLY" }
              as: BuyerAdmin
              as_user_id: "${buyer_id}"
              captures: { program_id: "$.data.id" }
            - call: "POST /buyer-programs/${program_id}/open"
              payload: {}
              as: BuyerAdmin
              as_user_id: "${buyer_id}"
            - call: "POST /suppliers"
              payload: { legal_name: "Acme Components Ltd", tax_id_last4: "7788", remittance_email: "ap@acme.example" }
              as: PlatformOps
              captures: { supplier_id: "$.data.id" }
            - call: "POST /suppliers/${supplier_id}/onboarding/submit"
              payload: {}
              as: Supplier
              as_user_id: "${supplier_id}"
            - call: "POST /suppliers/${supplier_id}/bank-accounts"
              payload: { routing_number: "021000021", account_last4: "4321" }
              as: Supplier
              as_user_id: "${supplier_id}"
              captures: { bank_id: "$.data.id", md_code: "$.data.micro_deposit_code" }
            - call: "POST /bank-accounts/${bank_id}/micro-deposit/confirm"
              payload: { code: "${md_code}" }
              as: Supplier
              as_user_id: "${supplier_id}"
            - call: "POST /suppliers/${supplier_id}/idv/adjudicate"
              payload: { decision: "PASSED", identity_score: 92 }
              as: PlatformOps
            - call: "POST /auction-sessions"
              payload: { program_id: "${program_id}", opens_at: "2026-08-02T00:00:00Z", closes_at: "2026-08-31T00:00:00Z" }
              as: BuyerAdmin
              as_user_id: "${buyer_id}"
              captures: { session_id: "$.data.id" }
            - call: "POST /payable-files"
              payload: { program_id: "${program_id}", filename: "AP-2026-08-01.csv", declared_row_count: 1, declared_total_cents: 108751, rows: [ { invoice_number: "INV-1001", approval_date: "2026-07-20T00:00:00Z", net_due_date: "2026-09-30T00:00:00Z", supplier_id: "${supplier_id}", lines: [ { line_no: 1, line_amount_cents: 33333, tax_rate_bps: 875 }, { line_no: 2, line_amount_cents: 33333, tax_rate_bps: 875 }, { line_no: 3, line_amount_cents: 33334, tax_rate_bps: 875 } ] } ] }
              as: BuyerAdmin
              as_user_id: "${buyer_id}"
              captures: { file_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-02T00:00:00Z" }
              as: PlatformOps
            - call: "GET /invoices"
              payload: { file_id: "${file_id}" }
              as: BuyerAdmin
              as_user_id: "${buyer_id}"
              captures: { invoice_id: "$.data[0].id", invoice_version: "$.data[0].version" }
            - call: "POST /discount-offers"
              payload: { invoice_id: "${invoice_id}", session_id: "${session_id}", offered_apr_bps: 800, requested_pay_date: "2026-08-05T00:00:00Z", acceptance_deadline: "2026-08-10T00:00:00Z", expected_invoice_version: "${invoice_version}" }
              as: Supplier
              as_user_id: "${supplier_id}"
              captures: { offer_id: "$.data.id" }
            - call: "POST /discount-offers/${offer_id}/accept"
              payload: {}
              as: BuyerAdmin
              as_user_id: "${buyer_id}"
              captures: { offer_version_accepted: "$.data.version" }
            - call: "POST /early-payments"
              payload: { offer_id: "${offer_id}", expected_offer_version: "${offer_version_accepted}" }
              as: BuyerTreasury
              as_user_id: "${buyer_id}"
              captures: { ep_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T00:00:00Z" }
              as: PlatformOps
            - call: "POST /early-payments/${ep_id}/execute"
              payload: {}
              as: BuyerTreasury
              as_user_id: "${buyer_id}"
          trigger:
            - call: "POST /early-payments/${ep_id}/settlement/confirm"
              payload: {}
              as: BuyerTreasury
              as_user_id: "${buyer_id}"
          assert:
            - "EarlyPayment.${ep_id}.days_early == 56 before the trigger (PAY_DATE_BASIS from execution_date 2026-08-05)"
            - "Invoice.${invoice_id}.provisional_discount_cents == 1353"
            - "EarlyPayment.${ep_id}.value_date == 2026-08-07T00:00:00Z"
            - "Invoice.${invoice_id}.final_discount_cents == 1305"
            - "Invoice.${invoice_id}.discount_true_up_cents == -48"
            - "EarlyPayment.${ep_id}.net_payment_cents == 107446"
            - "EarlyPayment.${ep_id}.funder_fee_cents == 0"
            - "EarlyPayment.${ep_id}.settlement_status == CONFIRMED and funding_status == RELEASED"
            - "Invoice.${invoice_id}.status == EARLY_PAID"

      - name: supplier_concentration_face_basis_vs_funded_basis
        grounds:
          - calculations.supplier_concentration
          - entities.BuyerProgram.fields.concentration_cap_pct
          - entities.Invoice.fields.face_amount_cents
          - entities.EarlyPayment.fields.net_payment_cents
          - validations[priority=25]
        distinguishing_aspect: |
          This variant pair lives on the supplier/programme risk domain, not on EarlyPayment cash:
          with supplier A holding a 60000-cent invoice and supplier B a 40000-cent invoice, the
          FACE_BASIS share of supplier A is exactly 60.00 while the FUNDED_BASIS share is 100.00,
          because only supplier A's payment reached funding_status RELEASED and net cash excludes
          both the discount and supplier B's unfunded face.
        test_recipe:
          setup:
            - "SELF_ONLY programme OPEN with concentration_cap_pct 100.00 so neither award is blocked"
            - "Two onboarded suppliers, A with invoice face 60000 and B with invoice face 40000, same programme"
            - "Supplier A's invoice fully settled (EarlyPayment RELEASED); supplier B's invoice still ELIGIBLE"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformOps
            - call: "POST /buyers"
              payload: { legal_name: "Meridian Foods Inc", tax_id: "112223334", credit_limit_cents: 100000000, self_funding_enabled: true, reclass_days_threshold: 30, reclass_apr_threshold_bps: 900 }
              as: PlatformOps
              captures: { buyer_id: "$.data.id" }
            - call: "POST /buyer-programs"
              payload: { buyer_id: "${buyer_id}", name: "Concentration Watch", program_type: "SUPPLIER_NAMED", max_acceptable_apr_bps: 1200, min_days_early: 5, concentration_cap_pct: 100.00, funding_policy: "SELF_ONLY" }
              as: BuyerAdmin
              as_user_id: "${buyer_id}"
              captures: { program_id: "$.data.id" }
            - call: "POST /buyer-programs/${program_id}/open"
              payload: {}
              as: BuyerAdmin
              as_user_id: "${buyer_id}"
            - call: "POST /suppliers"
              payload: { legal_name: "Supplier Alpha SA", tax_id_last4: "1111", remittance_email: "ar@alpha.example" }
              as: PlatformOps
              captures: { sa_id: "$.data.id" }
            - call: "POST /suppliers/${sa_id}/onboarding/submit"
              payload: {}
              as: Supplier
              as_user_id: "${sa_id}"
            - call: "POST /suppliers/${sa_id}/bank-accounts"
              payload: { routing_number: "021000021", account_last4: "4321" }
              as: Supplier
              as_user_id: "${sa_id}"
              captures: { sa_bank_id: "$.data.id", sa_code: "$.data.micro_deposit_code" }
            - call: "POST /bank-accounts/${sa_bank_id}/micro-deposit/confirm"
              payload: { code: "${sa_code}" }
              as: Supplier
              as_user_id: "${sa_id}"
            - call: "POST /suppliers/${sa_id}/idv/adjudicate"
              payload: { decision: "PASSED", identity_score: 90 }
              as: PlatformOps
            - call: "POST /suppliers"
              payload: { legal_name: "Supplier Beta SB", tax_id_last4: "2222", remittance_email: "ar@beta.example" }
              as: PlatformOps
              captures: { sb_id: "$.data.id" }
            - call: "POST /suppliers/${sb_id}/onboarding/submit"
              payload: {}
              as: Supplier
              as_user_id: "${sb_id}"
            - call: "POST /suppliers/${sb_id}/bank-accounts"
              payload: { routing_number: "011000015", account_last4: "9876" }
              as: Supplier
              as_user_id: "${sb_id}"
