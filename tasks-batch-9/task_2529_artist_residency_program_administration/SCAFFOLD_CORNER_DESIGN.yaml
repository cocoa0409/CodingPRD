              payload: { full_name: "Ada Rivet", email: "ada.rivet@example.org",
                         affiliation_org: "North Shore Collective", citizenship_country: "US",
                         treaty_country: false, declared_annual_income_cents: 2000000 }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { art: "$.data.id" }
            - call: "POST /cycles/${cyc}/stage"
              payload: { to_status: "OPEN" }
              as: ProgramAdmin
              as_user_id: "admin-01"
            - call: "POST /residencies"
              payload: { cycle_id: "${cyc}", applicant_id: "${art}", discipline_id: "${disc}" }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { res: "$.data.id" }
            - call: "POST /residencies/${res}/schedule"
              payload: { session_start_date: "2026-11-02", session_length_weeks: 8 }
              as: ProgramAdmin
              as_user_id: "admin-01"
            - call: "GET /obligations"
              payload: { residency_id: "${res}", obligation_type: "OPEN_STUDIO" }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { ob: "$.data[0].id" }
            - call: "POST /obligations/${ob}/progress"
              payload: { action: "LOG_COMPLETION", attendance: 40 }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { ob_v1: "$.data.version" }
          trigger:
            - call: "POST /obligations/${ob}/progress"
              payload: { action: "LOG_COMPLETION", attendance: 40 }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { err: "$.data.error_id" }
          assert:
            - "the first LOG_COMPLETION drove the transition: status == 'SATISFIED', completed_count == 1, total_attendance == 40"
            - "the repeat returns 409 ERR_OBLIGATION_NOT_PENDING, and the row is untouched: completed_count is still 1, total_attendance still 40 and version still ${ob_v1}"
            - "the residency ledger is likewise untouched by the rejected call: obligations_completed_total == 1 and obligations_required_total == 5 both before and after"
            - "WAIVE is refused from SATISFIED for the same reason: 409 ERR_OBLIGATION_NOT_PENDING"
            - "a multi-count row is NOT idempotent after one call: on the COMMUNITY_WORKSHOP row (required_count 2) the first LOG_COMPLETION leaves status 'PENDING' with completed_count 1, the second returns 200 with status 'SATISFIED' and completed_count 2, and only a third returns 409 ERR_OBLIGATION_NOT_PENDING"
            - "attendance accumulates rather than replacing: two LOG_COMPLETION calls with attendance 40 and 15 on the workshop row leave total_attendance == 55"

      - name: terminate_cascade_reaches_the_cycle_ledger
        claim_type: ledger_sync
        grounds: ["state_machines.Residency[IN_RESIDENCE -> TERMINATED]", "calculations.cycle_stipend_ledger"]
        excluded_because:
          difficulty_instance: terminate_residency_repricing_chain_reaches_the_cycle_ledger
          rationale: "The four-link TERMINATE chain (actual_weeks -> VOIDed disbursements -> FINAL_SETTLED repricing -> Cycle.stipend_committed_cents / stipend_uncommitted_cents) is already asserted end-to-end with pre-computed literals at every link by the §1.8 transitive_cascade instance, including the ordering sensitivity that makes link 3 depend on link 2. Restating it here would duplicate that instance's asserts rather than add breadth."

      - name: withdraw_compensates_the_whole_acceptance
        claim_type: compensation
        grounds: ["state_machines.Residency[SCHEDULED -> WITHDRAWN]", "entities.Cycle.stipend_committed_cents", "entities.Cycle.slots_filled_count"]
        excluded_because:
          difficulty_instance: cycle_money_and_slot_ledgers_return_to_pre_award_values_after_withdrawal
          rationale: "The WITHDRAW compensation - the full committed stipend released, disbursements VOIDED, obligations WAIVED, assignments released, the VisaCase denied, and both the money and slot ledgers restored to their exact pre-acceptance values with no drift - is the subject of the §1.8 compensating_invariant instance, which captures the pre-award ledger snapshot and reconciles it after the undo."

  # ===================================================================================
  # From Table 3 (Calculations)
  # ===================================================================================
  - section: calculations
    instances:

      - name: visa_backlog_constant_switches_on_the_high_volume_country_list
        claim_type: constants_applied
        grounds: ["calculations.visa_timeline", "constants.HIGH_VOLUME_VISA_COUNTRIES", "constants.VISA_BACKLOG_DAYS_HIGH_VOLUME", "constants.VISA_BACKLOG_DAYS_DEFAULT", "constants.VISA_LEAD_DAYS"]
        distinguishing_aspect: "Two residencies with the IDENTICAL session_start_date get filing deadlines 24 days apart, purely because one applicant's citizenship_country is a member of HIGH_VOLUME_VISA_COUNTRIES: 45 - 21 = 24. The constant is selected by set membership, so a country NOT in the list must fall back to the default rather than to some interpolated value, and earliest_entry_date (which uses a different constant) must be identical for both."
        test_recipe:
          setup: ["One OPEN cycle, one discipline, and two international applicants - citizenship IN (a member of HIGH_VOLUME_VISA_COUNTRIES) and citizenship FR (not a member). Both get an invited residency scheduled for exactly 2026-11-02, 8 weeks. The clock stays at the 2026-08-01 default."]
          setup_api_calls:
            - call: "POST /cycles"
              payload: { code: "CY-2027", open_at: "2026-08-01T00:00:00Z", close_at: "2026-09-30T00:00:00Z",
                         application_fee_cents: 5000, panel_quorum: 2, cohort_target_size: 10,
                         alumni_reserve_pct: 0.25, stipend_pool_cents: 20000000, slate_min_score: 60.00,
                         stipend_weekly_rate_cents: 70000, session_length_options_weeks: [4, 5, 8, 9] }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { cyc: "$.data.id" }
            - call: "POST /disciplines"
              payload: { cycle_id: "${cyc}", code: "SCULPT", name: "Sculpture", portfolio_min_items: 1,
                         portfolio_max_items: 6, required_media_types: ["IMAGE"], requires_hazmat_review: false,
                         cohort_min_slots: 1, cohort_max_slots: 6, required_capability_tags: ["WELDING"],
                         required_ventilation_class: "LOCAL" }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { disc: "$.data.id" }
            - call: "POST /applicants"
              payload: { full_name: "Ishan Rao", email: "ishan.rao@example.org",
                         affiliation_org: "Studio Deccan", citizenship_country: "IN",
                         treaty_country: true, declared_annual_income_cents: 1800000 }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { art_in: "$.data.id" }
            - call: "POST /applicants"
              payload: { full_name: "Camille Roux", email: "camille.roux@example.org",
                         affiliation_org: "Atelier Sud", citizenship_country: "FR",
                         treaty_country: true, declared_annual_income_cents: 1900000 }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { art_fr: "$.data.id" }
            - call: "POST /cycles/${cyc}/stage"
              payload: { to_status: "OPEN" }
              as: ProgramAdmin
              as_user_id: "admin-01"
            - call: "POST /residencies"
              payload: { cycle_id: "${cyc}", applicant_id: "${art_in}", discipline_id: "${disc}" }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { res_in: "$.data.id" }
            - call: "POST /residencies"
              payload: { cycle_id: "${cyc}", applicant_id: "${art_fr}", discipline_id: "${disc}" }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { res_fr: "$.data.id" }
            - call: "POST /residencies/${res_in}/schedule"
              payload: { session_start_date: "2026-11-02", session_length_weeks: 8 }
              as: ProgramAdmin
              as_user_id: "admin-01"
            - call: "POST /residencies/${res_fr}/schedule"
              payload: { session_start_date: "2026-11-02", session_length_weeks: 8 }
              as: ProgramAdmin
              as_user_id: "admin-01"
          trigger:
            - call: "GET /visa-cases"
              payload: { residency_id: "${res_in}" }
              as: VisaCoordinator
              as_user_id: "visa-01"
              captures: { vc_in: "$.data[0].id" }
            - call: "GET /visa-cases"
              payload: { residency_id: "${res_fr}" }
              as: VisaCoordinator
              as_user_id: "visa-01"
              captures: { vc_fr: "$.data[0].id" }
          assert:
            - "the IN case takes the high-volume constant: backlog_days == 45 and filing_deadline_date == '2026-06-20' (2026-11-02 minus 90 + 45 = 135 days)"
            - "the FR case takes the default: backlog_days == 21 and filing_deadline_date == '2026-07-14' (2026-11-02 minus 90 + 21 = 111 days)"
            - "the gap is exactly the constant difference: the two deadlines are 24 days apart, matching VISA_BACKLOG_DAYS_HIGH_VOLUME - VISA_BACKLOG_DAYS_DEFAULT"
            - "earliest_entry_date is driven by a DIFFERENT constant and is therefore identical for both cases: '2026-10-03' (2026-11-02 minus VISA_EARLIEST_ENTRY_LEAD_DAYS 30)"
            - "the countdown is measured against the logical clock 2026-08-01, so both are already overdue: days_to_filing_deadline == -42 for the IN case and -18 for the FR case"
            - "case_type is decided by session length alone and not by country: both 8-week cases read 'B1_SHORT_TERM', because 8 < VISA_J1_MIN_SESSION_WEEKS 9"
            - "membership is exact, not prefix or case-insensitive: an applicant with citizenship_country 'IE' (not in the list) also gets backlog_days 21"

      - name: visa_timeline_is_re_derived_when_the_residency_is_rescheduled
        claim_type: forward_looking
        grounds: ["calculations.visa_timeline", "endpoints[POST /residencies/{id}/schedule]", "entities.VisaCase.filing_deadline_date"]
        distinguishing_aspect: "The whole timeline is a forward-looking projection of the sponsored residency: nothing on the VisaCase itself is touched by a reschedule, yet filing_deadline_date, earliest_entry_date, days_to_filing_deadline and case_type must all move - and case_type can flip B1 -> J1 across the 9-week boundary. A cached-at-creation implementation passes the create test and fails this one."
        test_recipe:
          setup: ["An invited residency for an IN applicant (high-volume backlog 45) scheduled 2026-11-02 for 8 weeks, with its auto-created VisaCase still in INITIATED. The clock stays at 2026-08-01."]
          setup_api_calls:
