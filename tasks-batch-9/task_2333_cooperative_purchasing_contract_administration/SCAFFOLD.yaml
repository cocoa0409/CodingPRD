  - priority: 51
    category: business_constraint
    check: "RECOMMEND_AWARD requires every RESPONSIVE response to carry a non-null technical_score, and MARK_RESPONSIVE requires technical_score in the request body"
    error_id: ERR_TECHNICAL_SCORE_MISSING
