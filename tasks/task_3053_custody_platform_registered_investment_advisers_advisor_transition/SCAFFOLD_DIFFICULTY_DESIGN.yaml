  - rule_id: cross_entity_state_dependency
    instances:

      - name: account_activation_requires_firm_entitlement_and_current_agreement
        grounds:
          - state_machines.HouseholdAccount.PENDING_to_OPEN
          - state_machines.AdvisorFirmEntitlement.REQUESTED_to_GRANTED
          - validations[priority=16]
          - validations[priority=21]
        distinguishing_aspect: "HouseholdAccount's PENDING -> OPEN edge depends on the AdviserFirm x HouseholdAccount pair through two different parents: the firm must own a CURRENT executed agreement and must hold a GRANTED TRADING_AUTHORIZATION or BILLING entitlement — an account whose firm has only a REQUESTED entitlement stays PENDING."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Firm with EXECUTED agreement A and two accounts under one household."
          setup_api_calls:
            - *c_clock
            - *c_firm
            - *c_agr
            - *c_agr_submit
            - *c_agr_exec
            - *c_house
            - call: "POST /ria/accounts"
              payload: { household_id: "${h_id}", firm_id: "${f_id}", account_number: "RIA-105001", account_type: "INDIVIDUAL", householding_consent: "OP_IN" }
              as: AdvisorOperationsLead
              captures: { acct_noent_id: $.data.id }
            - &c_ent_tr_req
              call: "POST /ria/firm-entitlements"
              payload: { firm_id: "${f_id}", entitlement_code: "TRADING_AUTHORIZATION", requested_custody_agreement_id: "${agr_id}" }
              as: AdvisorOperationsLead
              captures: { ent_tr_id2: $.data.id }
          trigger:
            - call: "POST /ria/accounts/${acct_noent_id}/activate"
              payload: {}
              as: CustodyOperationsOfficer
              captures: { err_req: $.data.error_id }
            - call: "POST /ria/firm-entitlements/${ent_tr_id2}/grant"
              payload: {}
              as: CustodyOperationsOfficer
            - call: "POST /ria/accounts/${acct_noent_id}/activate"
              payload: {}
              as: CustodyOperationsOfficer
          assert:
            - "the first activation is rejected with error_id ERR_ENTITLEMENT_NOT_GRANTED while the entitlement is REQUESTED"
            - "HouseholdAccount.${acct_noent_id}.account_status == PENDING after the rejected activation"
            - "the second activation succeeds and HouseholdAccount.${acct_noent_id}.account_status == OPEN"
            - "AdvisorFirm.${f_id}.entitlement_count == 1"
            - "the account's activation also required the firm's EXECUTED agreement, so revoking that entitlement again leaves a later re-activation rejected"

      - name: money_movement_authorization_depends_on_standing_instruction_state
        grounds:
          - state_machines.MoneyMovementInstruction.PENDING_AUTHORIZATION_to_AUTHORIZED
          - state_machines.StandingInstruction.PENDING_to_VERIFIED
          - state_machines.StandingInstruction.VERIFIED_to_EXPIRED
          - validations[priority=23]
        distinguishing_aspect: "MoneyMovementInstruction's PENDING_AUTHORIZATION -> AUTHORIZED edge depends on the StandingInstruction x MoneyMovementInstruction pair, and the dependency is a clock-dependent one: the same verified instruction permits authorization on day 6 and forbids it on day 7 after the logical clock advances."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Firm with EXECUTED agreement and GRANTED MONEY_MOVEMENT entitlement, firm_posture OPEN."
            - "One household with an OPEN INDIVIDUAL account; a standing instruction verified at a logical instant 6 days before the authorization attempt."
          setup_api_calls:
            - *c_clock
            - *c_firm
            - *c_agr
            - *c_agr_submit
            - *c_agr_exec
            - *c_ent_mm2
            - call: "POST /ria/firm-entitlements/${ent_pay_id}/grant"
              payload: {}
              as: CustodyOperationsOfficer
            - *c_house
            - call: "POST /ria/accounts"
              payload: { household_id: "${h_id}", firm_id: "${f_id}", account_number: "RIA-106001", account_type: "INDIVIDUAL", householding_consent: "OP_IN" }
              as: AdvisorOperationsLead
              captures: { acct_id: $.data.id }
            - call: "POST /ria/accounts/${acct_id}/activate"
              payload: {}
              as: CustodyOperationsOfficer
            - call: "POST /ria/accounts/${acct_id}/standing-instructions"
              payload: { instruction_type: "THIRD_PARTY_DISBURSEMENT", payee_name: "Alvarez Charitable Trust", periodic_limit_cents: 5000000 }
              as: AdvisorOperationsLead
              captures: { si_id: $.data.id, si_tok: $.data.verification_token }
            - call: "POST /ria/accounts/${acct_id}/standing-instructions"
              payload: { instruction_type: "WIRE", payee_name: "Escrow Services Inc", periodic_limit_cents: 5000000 }
              as: AdvisorOperationsLead
              captures: { si2_id: $.data.id, si2_tok: $.data.verification_token }
          trigger:
            - call: "POST /ria/standing-instructions/${si_id}/verify"
              payload: { verification_token: "${si_tok}" }
