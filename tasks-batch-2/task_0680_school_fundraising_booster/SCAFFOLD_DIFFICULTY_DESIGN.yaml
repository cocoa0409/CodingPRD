  - rule_id: boundary_precision_check
    instances:
      # --- #1: prize-tier threshold inclusive >= (numeric threshold crossing) ---
      - name: prize_tier_earned_at_exact_threshold
        grounds:
          - calculations.prize_tier_earned
          - entities.Seller.fields.earned_prize_tier_id
          - entities.PrizeTier.fields.threshold_cents
        distinguishing_aspect: |
          Numeric threshold boundary on the SELLER credited metric via the pay
          endpoint: credited_cents == threshold_cents (10825 == 10825) EARNS the
          tier (>=), whereas a tier at 10826 would NOT be earned. Inclusive
          boundary pinned.
        test_recipe:
          setup:
            - "ACTIVE CATALOG campaign, 1 seller, 1 product (price2000/cost800/stock100); two tiers: AT (10825) and ABOVE (10826)."
            - "One PLACED+PENDING order of 5 units (total 10825)."
