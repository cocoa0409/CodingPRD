# =============================================================================
# Task 0136 — Wealth Management & Trust Accounting
# Scaffold (§1.0 – §1.7)
# =============================================================================

scenario: |
  Wealth Management & Trust Accounting: trustee/beneficiary, revocable/irrevocable
  trust, distribution rules, annual K-1, trust income tax, GST generation-skipping
  tax, Grantor Trust.

domain_name: trust-accounting
api_prefix: /trusts

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - version_pinning_on_approval
    - scheduled_deferred_actions
    - rate_threshold_triggers
    - optimistic_concurrency

  entity_topology: hybrid
  # Trust is the aggregate root, with Trustees/Beneficiaries/Assets nested.
  # Transactions are append-only event log under Trust. TaxYear and K1 are
  # cross-cutting (K1 references both TaxYear and Beneficiary).

  state_machine_shape: cyclic
  # TaxYear: OPEN → CLOSING → CLOSED → AMENDED → CLOSED (cycle)
  # K1: DRAFT → ISSUED → SUPERSEDED → ISSUED (cycle on amendment)
  # Distribution: branching PROPOSED → {APPROVED → EXECUTED, REJECTED}
  # Trust: revocable variant allows AMENDMENT loop; irrevocable cannot

  relationship_patterns:
    - one_to_many        # Trust → Trustees, Beneficiaries, Assets, Transactions, Distributions
    - cross_aggregate    # K1 references both TaxYear and Beneficiary
    - polymorphic        # Distribution.beneficiary_id may target an income-only or remainder beneficiary

  role_model: segregation_of_duties
  # Grantor proposes/funds; Trustee approves & executes; Beneficiary reads own K-1.
  # Auditor reads everything but mutates nothing. Tax Preparer can close TaxYears
  # but cannot create/modify Trusts or Distributions. The same identity cannot
  # both propose and approve a Distribution.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Trust
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: name,                  type: string,   source: input,    description: "Trust legal name" }
      - { name: trust_type,            type: enum,     source: input,    description: "REVOCABLE | IRREVOCABLE", constraints: "Immutable after status=ACTIVE." }
      - { name: grantor_tax_status,    type: enum,     source: input,    description: "GRANTOR | NON_GRANTOR. GRANTOR means all income flows to grantor's 1040 and trust pays no entity-level tax. May only be GRANTOR if trust_type=REVOCABLE OR has_grantor_powers=true.", constraints: "GRANTOR forbidden when trust_type=IRREVOCABLE AND has_grantor_powers=false." }
      - { name: has_grantor_powers,    type: boolean,  source: input,    description: "Whether grantor retains powers (IRC §671–679) making an IRREVOCABLE trust still a grantor trust", default: false }
      - { name: grantor_user_id,       type: string,   source: input,    description: "Opaque identifier of the natural person who created/funded the trust (Grantor role)" }
      - { name: situs_state,           type: string,   source: input,    description: "Two-letter US state code; affects state income tax (not modeled) and statutory rules" }
      - { name: inception_date,        type: datetime, source: input,    description: "Date the trust instrument was executed; immutable once ACTIVE" }
      - { name: status,                type: enum,     source: system,   description: "DRAFT | ACTIVE | TERMINATED | REVOKED" }
      - { name: principal_balance,     type: number,   source: computed, description: "Sum of asset book values currently classified as principal. USD, 2dp." }
      - { name: income_balance,        type: number,   source: computed, description: "Undistributed accounting income held in the trust (USD, 2dp). Increases on INCOME transactions, decreases on income distributions and on TaxYear closing tax payment." }
      - { name: gst_exemption_used,    type: number,   source: computed, description: "Cumulative GST exemption applied across taxable distributions; capped at GST_EXEMPTION_LIMIT (constant)" }
      - { name: current_tax_year_id,   type: string,   source: system,   description: "Pointer to the TaxYear currently in OPEN or CLOSING state for this trust; null when no open year" }

  - name: Trustee
    parent: Trust
    common_fields: true
    fields:
      - { name: trust_id,    type: string, source: system, description: "Parent trust id" }
      - { name: user_id,     type: string, source: input,  description: "Opaque platform user id for the trustee" }
      - { name: full_name,   type: string, source: input,  description: "Trustee's legal name" }
      - { name: is_primary,  type: boolean, source: input, description: "Primary trustee (exactly one per ACTIVE trust). The primary trustee is the sole signatory for irrevocable Trust amendments." }
      - { name: status,      type: enum,   source: system, description: "ACTIVE | RESIGNED | REMOVED" }

  - name: Beneficiary
    parent: Trust
    common_fields: true
    fields:
      - { name: trust_id,            type: string,  source: system, description: "Parent trust id" }
      - { name: full_name,           type: string,  source: input,  description: "Beneficiary legal name" }
      - { name: relation_class,      type: enum,    source: input,  description: "SPOUSE | CHILD | GRANDCHILD | OTHER_LINEAL | NON_LINEAL — drives GST 'skip person' classification" }
      - { name: is_skip_person,      type: boolean, source: computed, description: "True iff relation_class is GRANDCHILD or further-removed lineal descendant, or NON_LINEAL who is >= 37.5 years younger than the grantor. Formula pinned in calculations.gst_skip_person_determination." }
      - { name: beneficiary_class,   type: enum,    source: input,  description: "INCOME | REMAINDER | INCOME_AND_REMAINDER" }
      - { name: distribution_tier,   type: enum,    source: input,  description: "TIER_1 (mandatory income distributee) | TIER_2 (discretionary). Drives DNI tier allocation in calculations.k1_dni_allocation." }
      - { name: status,              type: enum,    source: system, description: "ACTIVE | TERMINATED" }
      - { name: birth_date,          type: datetime, source: input, description: "Used for skip-person age determination" }

  - name: Asset
    parent: Trust
    common_fields: true
    fields:
      - { name: trust_id,       type: string, source: system, description: "Parent trust id" }
      - { name: description,    type: string, source: input,  description: "Asset description" }
      - { name: asset_class,    type: enum,   source: input,  description: "CASH | EQUITY | BOND | REAL_ESTATE | OTHER" }
      - { name: book_value,     type: number, source: input,  description: "Carrying value at funding/acquisition (USD, 2dp). Adjusted by income capitalization or principal-side transactions." }
      - { name: classification, type: enum,   source: input,  description: "PRINCIPAL | INCOME. Determines which Trust balance the asset contributes to. Once an asset is CASH+INCOME it is a candidate for income-only distributions." }
      - { name: status,         type: enum,   source: system, description: "FUNDED | DISTRIBUTED | SOLD" }

  - name: Transaction
    parent: Trust
    common_fields: false   # append-only event log: id, created_at only
    fields:
      - { name: trust_id,        type: string,   source: system, description: "Parent trust id" }
      - { name: tax_year_id,     type: string,   source: system, description: "TaxYear this transaction was booked into (pinned at creation by transaction_date)" }
      - { name: txn_type,        type: enum,     source: input,  description: "INCOME_ORDINARY | INCOME_INTEREST | INCOME_DIVIDEND | INCOME_CAPITAL_GAIN | EXPENSE_ADMINISTRATIVE | EXPENSE_INVESTMENT" }
      - { name: amount,          type: number,   source: input,  description: "Always positive USD, 2dp. Sign is implied by txn_type (income increases, expense decreases)." }
      - { name: transaction_date, type: datetime, source: input, description: "Event date; must fall inside an OPEN or CLOSING TaxYear for this trust (ERR_TAX_YEAR_CLOSED otherwise)" }
      - { name: principal_or_income, type: enum, source: input,  description: "PRINCIPAL | INCOME — accounting classification. Capital gains default to PRINCIPAL unless the trust instrument allocates them to INCOME (irrelevant here; the field is explicit)." }
      - { name: description,     type: string,   source: input,  description: "Free-text memo" }

  - name: Distribution
    parent: Trust
    common_fields: true
    fields:
      - { name: trust_id,         type: string,   source: system, description: "Parent trust id" }
      - { name: beneficiary_id,   type: string,   source: input,  description: "Recipient beneficiary id" }
      - { name: tax_year_id,      type: string,   source: system, description: "TaxYear into which this distribution is booked (resolved by scheduled_date)" }
      - { name: scheduled_date,   type: datetime, source: input,  description: "Date the distribution is to be paid; must fall inside an OPEN TaxYear" }
      - { name: amount_principal, type: number,   source: input,  description: "USD, 2dp, >=0. Reduces principal_balance on EXECUTED." }
      - { name: amount_income,    type: number,   source: input,  description: "USD, 2dp, >=0. Reduces income_balance on EXECUTED; carries DNI on K-1." }
      - { name: distribution_type, type: enum,    source: input,  description: "MANDATORY (tier-1 income) | DISCRETIONARY | TERMINATING" }
      - { name: status,           type: enum,     source: system, description: "PROPOSED → APPROVED → EXECUTED | REJECTED. PROPOSED is created by a Grantor; APPROVED by a Trustee (cannot be the same user_id — segregation of duties)." }
      - { name: proposed_by_user_id, type: string, source: system, description: "User who created the PROPOSED distribution" }
      - { name: approved_by_user_id, type: string, source: system, description: "Trustee who approved; null until APPROVED. MUST differ from proposed_by_user_id." }
      - { name: gst_taxable,      type: boolean,  source: computed, description: "True iff beneficiary.is_skip_person AND trust.gst_exemption_used + this_distribution_total > GST_EXEMPTION_LIMIT (pinned in calculations.gst_taxable_classification)" }
      - { name: gst_tax_amount,   type: number,   source: computed, description: "USD, 2dp. 0 unless gst_taxable; otherwise = (taxable_portion * GST_TAX_RATE), see calculations.gst_tax_computation." }

  - name: TaxYear
    parent: Trust
    common_fields: true
    fields:
      - { name: trust_id,          type: string,   source: system, description: "Parent trust id" }
      - { name: calendar_year,     type: integer,  source: input,  description: "Four-digit calendar year (e.g., 2026). Unique per (trust_id, calendar_year)." }
      - { name: start_date,        type: datetime, source: system, description: "First day of calendar year, derived" }
      - { name: end_date,          type: datetime, source: system, description: "Last day of calendar year, derived" }
      - { name: status,            type: enum,     source: system, description: "OPEN | CLOSING | CLOSED | AMENDED. CLOSED is reopenable (→AMENDED) for K-1 corrections." }
      - { name: dni,               type: number,   source: computed, description: "Distributable Net Income computed at CLOSING. See calculations.dni_computation. Pinned at CLOSING; recomputed on AMENDED." }
      - { name: trust_taxable_income, type: number, source: computed, description: "Income retained by the trust and taxed at trust rates. For GRANTOR trusts always 0. For NON_GRANTOR trusts = DNI - total_executed_income_distributions (floored at 0)." }
      - { name: trust_income_tax,  type: number,   source: computed, description: "USD, 2dp. Applied via tiered compressed brackets. See calculations.trust_income_tax_computation. 0 for grantor trusts." }
      - { name: closed_at,         type: datetime, source: system, description: "When CLOSING→CLOSED occurred (null before)" }

  - name: K1
    parent: TaxYear
    common_fields: true
    fields:
      - { name: tax_year_id,           type: string, source: system, description: "Parent TaxYear id" }
      - { name: trust_id,              type: string, source: system, description: "Parent trust id (denormalized for indexing)" }
      - { name: beneficiary_id,        type: string, source: system, description: "Beneficiary the K-1 is for. Exactly one K-1 per (tax_year_id, beneficiary_id) in ISSUED status; older copies are SUPERSEDED." }
      - { name: ordinary_income_share, type: number, source: computed, description: "Share of DNI character: ordinary income. Allocated per calculations.k1_dni_allocation (tier-1 then tier-2, pro-rata within tier)." }
      - { name: interest_income_share, type: number, source: computed, description: "Share of DNI character: interest" }
      - { name: dividend_income_share, type: number, source: computed, description: "Share of DNI character: dividends" }
      - { name: capital_gain_share,    type: number, source: computed, description: "Share of capital gains passed out (only if distribution_type=TERMINATING or trust instrument allocates capital gains to income)" }
      - { name: total_distributed,     type: number, source: computed, description: "Sum of amount_income + amount_principal for EXECUTED distributions to this beneficiary in this TaxYear" }
      - { name: status,                type: enum,   source: system, description: "DRAFT | ISSUED | SUPERSEDED. DRAFT created with TaxYear at year start; ISSUED on CLOSING→CLOSED; SUPERSEDED when an AMENDED K-1 is later ISSUED." }
      - { name: snapshot_distribution_version_sum, type: integer, source: system, description: "Pinned sum of Distribution.version values used to compute this K-1, recorded on ISSUED. Re-issuing requires this to match the current sum, else ERR_K1_STALE_REFERENCE (Version-pinning on approval, §0.2)." }
      - { name: issued_at,             type: datetime, source: system, description: "When this K-1 became ISSUED; null while DRAFT" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Trust
    initial_state: DRAFT
    terminal_states: [TERMINATED, REVOKED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /trusts/{trustId}/activate"
        actor: Grantor
        preconditions:
          - "Exactly one Trustee with is_primary=true and status=ACTIVE (ERR_NO_PRIMARY_TRUSTEE)"
          - "At least one Beneficiary with status=ACTIVE (ERR_NO_BENEFICIARY)"
          - "An open TaxYear exists for the calendar_year of inception_date (ERR_NO_OPEN_TAX_YEAR)"
        side_effects:
          - "trust_type and inception_date become immutable"
          - "Trust.principal_balance = sum(Asset.book_value where classification=PRINCIPAL and status=FUNDED) — initial computation"
          - "Trust.income_balance = sum(Asset.book_value where classification=INCOME and status=FUNDED) — initial computation"

      - from: ACTIVE
        to: REVOKED
        trigger: "POST /trusts/{trustId}/revoke"
        actor: Grantor
        preconditions:
          - "trust_type MUST be REVOCABLE (ERR_IRREVOCABLE_CANNOT_REVOKE)"
          - "No Distribution in APPROVED status (ERR_HAS_APPROVED_DISTRIBUTIONS)"
          - "No TaxYear in CLOSING status (ERR_TAX_YEAR_CLOSING_IN_PROGRESS)"
        side_effects:
          - "Trust.principal_balance and income_balance are returned to grantor (zeroed)"
          - "All ACTIVE Beneficiaries → TERMINATED"
          - "All FUNDED Assets → DISTRIBUTED (returned to grantor)"
          - "Cascade depth-3: revoke → asset DISTRIBUTED → recompute principal_balance → may zero income_balance via final true-up"

      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /trusts/{trustId}/terminate"
        actor: Trustee
        preconditions:
          - "All Assets in DISTRIBUTED or SOLD (ERR_HAS_UNDISTRIBUTED_ASSETS)"
          - "principal_balance == 0 AND income_balance == 0 (ERR_NONZERO_BALANCE)"
          - "current_tax_year_id refers to a TaxYear in CLOSED or AMENDED status (ERR_TAX_YEAR_NOT_CLOSED)"
        side_effects:
          - "All ACTIVE Beneficiaries → TERMINATED"

  - entity: Beneficiary
    initial_state: ACTIVE
    terminal_states: [TERMINATED]
    transitions:
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /trusts/{trustId}/beneficiaries/{beneficiaryId}/terminate"
        actor: Trustee
        preconditions:
          - "No Distribution in PROPOSED or APPROVED status for this beneficiary (ERR_HAS_PENDING_DISTRIBUTIONS)"
          - "Trust.status must be ACTIVE (ERR_TRUST_NOT_ACTIVE)"
        side_effects: []

  - entity: Distribution
    initial_state: PROPOSED
    terminal_states: [EXECUTED, REJECTED]
    transitions:
      - from: PROPOSED
        to: APPROVED
        trigger: "POST /trusts/{trustId}/distributions/{distributionId}/approve"
        actor: Trustee
        preconditions:
          - "Trust.status == ACTIVE (ERR_TRUST_NOT_ACTIVE)"
          - "Beneficiary.status == ACTIVE (ERR_BENEFICIARY_TERMINATED)"
          - "TaxYear referenced by tax_year_id is in OPEN status (ERR_TAX_YEAR_NOT_OPEN)"
          - "Approver user_id != Distribution.proposed_by_user_id (ERR_SEGREGATION_OF_DUTIES — same person cannot propose and approve)"
          - "amount_principal <= Trust.principal_balance (ERR_INSUFFICIENT_PRINCIPAL)"
          - "amount_income <= Trust.income_balance (ERR_INSUFFICIENT_INCOME)"
        side_effects:
          - "approved_by_user_id pinned to acting trustee"
          - "gst_taxable and gst_tax_amount recomputed per calculations.gst_taxable_classification and calculations.gst_tax_computation"

      - from: APPROVED
        to: EXECUTED
        trigger: "POST /trusts/{trustId}/distributions/{distributionId}/execute"
        actor: Trustee
        preconditions:
          - "Trust.principal_balance >= amount_principal AND Trust.income_balance >= amount_income (re-checked at execution time — balances may have moved since APPROVED)"
          - "Beneficiary.status == ACTIVE (ERR_BENEFICIARY_TERMINATED)"
        side_effects:
          - "Trust.principal_balance -= amount_principal"
          - "Trust.income_balance -= amount_income"
          - "Trust.gst_exemption_used += min(amount_principal + amount_income, max(0, GST_EXEMPTION_LIMIT - Trust.gst_exemption_used)) — exemption applied first, see calculations.gst_tax_computation"
          - "If gst_taxable: Trust.income_balance -= gst_tax_amount (GST tax paid by trust on distribution; reduces income_balance further)"
          - "Cascade depth-3: execute → balance adjustment → K-1 DRAFT for this beneficiary recomputed (ordinary_income_share, total_distributed, etc.) → TaxYear.dni_running_sum recomputed (held in dni field as it accrues)"

      - from: PROPOSED
        to: REJECTED
        trigger: "POST /trusts/{trustId}/distributions/{distributionId}/reject"
        actor: Trustee
        preconditions:
          - "Trust.status == ACTIVE OR REVOKED (rejecting a stale proposal on a revoked trust is allowed)"
        side_effects: []

      - from: APPROVED
        to: REJECTED
        trigger: "POST /trusts/{trustId}/distributions/{distributionId}/reject"
        actor: Trustee
        preconditions:
          - "Rejecter user_id != approved_by_user_id (segregation again — a different trustee must reject an approved-but-not-executed distribution)"
        side_effects:
          - "approved_by_user_id retained for audit but distribution is dead"

  - entity: TaxYear
    initial_state: OPEN
    terminal_states: []   # CLOSED is reopenable to AMENDED
    transitions:
      - from: OPEN
        to: CLOSING
        trigger: "POST /trusts/{trustId}/tax-years/{taxYearId}/begin-close"
        actor: TaxPreparer
        preconditions:
          - "current_clock.now >= end_date (ERR_TAX_YEAR_NOT_ENDED) — closing cannot start before calendar year ends"
          - "No Distribution in APPROVED status for this tax_year_id (ERR_HAS_APPROVED_DISTRIBUTIONS — execute or reject first)"
          - "All Distribution in PROPOSED for this tax_year_id are auto-rejected (side effect, not precondition)"
        side_effects:
          - "All PROPOSED Distributions in this tax year auto-transition to REJECTED"
          - "TaxYear.dni recomputed and pinned via calculations.dni_computation"
          - "Per-Beneficiary K-1 DRAFTs refreshed with current shares (ordinary_income_share, interest_income_share, dividend_income_share, capital_gain_share) per calculations.k1_dni_allocation"

      - from: CLOSING
        to: CLOSED
        trigger: "POST /trusts/{trustId}/tax-years/{taxYearId}/finalize"
        actor: TaxPreparer
        preconditions:
          - "All K-1 records for this tax_year_id in DRAFT can transition (no missing beneficiary; one DRAFT K-1 per ACTIVE Beneficiary at year-end)"
        side_effects:
          - "TaxYear.trust_taxable_income recomputed per calculations.trust_taxable_income_computation"
          - "TaxYear.trust_income_tax recomputed per calculations.trust_income_tax_computation"
          - "Trust.income_balance -= trust_income_tax (trust pays its tax out of retained income; if income_balance < trust_income_tax, this triggers ERR_INSUFFICIENT_INCOME_FOR_TAX and finalize is rejected)"
          - "All DRAFT K-1 for this tax_year_id → ISSUED, snapshot_distribution_version_sum pinned, issued_at set"
          - "TaxYear.closed_at = clock.now"
          - "Trust.current_tax_year_id moves to the next year's OPEN TaxYear if one exists (system-created on first transaction of the new year)"
          - "Cascade depth-3: finalize → tax computed → income_balance reduced → K-1 amounts already pinned (so they do NOT change) → ISSUED snapshot taken"

      - from: CLOSED
        to: AMENDED
        trigger: "POST /trusts/{trustId}/tax-years/{taxYearId}/amend"
        actor: TaxPreparer
        preconditions:
          - "No newer TaxYear for this trust is in CLOSED (ERR_NEWER_YEAR_CLOSED — cannot amend a year if a later year has already been closed; must amend forward)"
        side_effects:
          - "All ISSUED K-1 for this tax_year_id → SUPERSEDED"
          - "New DRAFT K-1 records created (one per ACTIVE-at-year-end Beneficiary)"

      - from: AMENDED
        to: CLOSED
        trigger: "POST /trusts/{trustId}/tax-years/{taxYearId}/finalize"
        actor: TaxPreparer
        preconditions:
          - "snapshot_distribution_version_sum for each new DRAFT K-1 MUST equal the live sum at re-issuance (Version-pinning, ERR_K1_STALE_REFERENCE)"
        side_effects:
          - "Same as CLOSING→CLOSED, with new K-1 ISSUED (older copies remain SUPERSEDED)"
          - "Difference in trust_income_tax (new - old) applied to Trust.income_balance (positive = additional tax owed and debited; negative = refund credited)"

  - entity: K1
    initial_state: DRAFT
    terminal_states: []   # SUPERSEDED is reachable only via amendment cycle
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "system: TaxYear CLOSING→CLOSED or AMENDED→CLOSED"
        actor: system
        preconditions:
          - "K-1 totals computed and pinned"
        side_effects:
          - "snapshot_distribution_version_sum recorded"
          - "issued_at = clock.now"

      - from: ISSUED
        to: SUPERSEDED
        trigger: "system: TaxYear CLOSED→AMENDED"
        actor: system
        preconditions: []
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - scenario: "Two trustees approve the same PROPOSED Distribution simultaneously"
    guarantee: "Exactly one approval succeeds; the second sees the distribution already APPROVED"
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on Distribution.status PROPOSED→APPROVED"

  - scenario: "Approve and reject arrive simultaneously on the same PROPOSED Distribution"
    guarantee: "Exactly one transition takes effect; loser observes the resulting non-PROPOSED state"
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on Distribution.status"

  - scenario: "Two executions race on two APPROVED Distributions that individually fit principal_balance but together do not"
    guarantee: "First execution succeeds; second observes the reduced balance and fails the precondition"
    error_id: ERR_INSUFFICIENT_PRINCIPAL
    http_status: 409
    serialization: "First-writer-wins on Trust.principal_balance debit"

  - scenario: "Two executions race on two APPROVED Distributions that individually fit income_balance but together do not"
    guarantee: "First execution succeeds; second observes the reduced balance and fails the precondition"
    error_id: ERR_INSUFFICIENT_INCOME
    http_status: 409
    serialization: "First-writer-wins on Trust.income_balance debit"

  - scenario: "Two amend requests on the same CLOSED TaxYear arrive simultaneously"
    guarantee: "Exactly one amendment cycle starts; the second sees status=AMENDED and is rejected"
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on TaxYear.status CLOSED→AMENDED"

  - scenario: "Finalize and another Distribution.execute race on the same TaxYear"
    guarantee: "Finalize requires CLOSING status (no APPROVED Distributions); if execute lands first the year stays OPEN-able-to-CLOSING and finalize precondition fails; if begin-close lands first, the execute observes TaxYear not OPEN"
    error_id: ERR_TAX_YEAR_NOT_OPEN
    http_status: 409
    serialization: "First-writer-wins on TaxYear.status OPEN→CLOSING"

  - scenario: "PATCH on Trust with stale version while another mutation just incremented it"
    guarantee: "Stale writer is rejected by optimistic concurrency"
    error_id: ERR_VERSION_MISMATCH
    http_status: 409
    serialization: "Compare-and-swap on Trust.version"

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: dni_computation
    trigger: "TaxYear OPEN→CLOSING (begin-close), and recomputed on CLOSED→AMENDED"
    algorithm: aggregation
    formula: |
      # DNI (Distributable Net Income) — IRC §643(a) style, simplified.
      # Source set: all Transactions where transaction_date falls within
      # [TaxYear.start_date, TaxYear.end_date] (inclusive on both ends),
      # joined to the parent Trust, and the parent Trust.status IN {ACTIVE, REVOKED, TERMINATED}.
      ordinary_income = sum(Transaction.amount where txn_type=INCOME_ORDINARY)
      interest_income = sum(Transaction.amount where txn_type=INCOME_INTEREST)
      dividend_income = sum(Transaction.amount where txn_type=INCOME_DIVIDEND)
      capital_gain    = sum(Transaction.amount where txn_type=INCOME_CAPITAL_GAIN
                            AND principal_or_income=INCOME)
      admin_expense   = sum(Transaction.amount where txn_type=EXPENSE_ADMINISTRATIVE)
      invest_expense  = sum(Transaction.amount where txn_type=EXPENSE_INVESTMENT)

      gross_income = ordinary_income + interest_income + dividend_income + capital_gain
      deductible_expense = admin_expense + invest_expense
      DNI = round_half_up(max(0, gross_income - deductible_expense), 2)
    input_set: "Transactions in TaxYear date range, plus the trust's character-tagged buckets"
    constants: {}
    precision: "2 decimal places, round_half_up"
    variants: []

  - name: trust_taxable_income_computation
    trigger: "TaxYear CLOSING→CLOSED (finalize), and on AMENDED→CLOSED"
    algorithm: forward_looking
    formula: |
      # Dual-variant: same trust-year inputs produce different trust_taxable_income
      # depending on Trust.grantor_tax_status.
      if Trust.grantor_tax_status == GRANTOR:
        # Grantor variant: all income flows to grantor's 1040. Trust pays no entity tax.
        trust_taxable_income = 0.00
      else:
        # Non-grantor variant: trust is taxed on whatever income it RETAINS,
        # i.e. DNI not distributed.
        executed_income_distributions = sum(Distribution.amount_income
            where status=EXECUTED AND tax_year_id=TaxYear.id)
        trust_taxable_income = round_half_up(max(0, TaxYear.dni - executed_income_distributions), 2)
    input_set: "TaxYear.dni and EXECUTED Distributions for this tax_year_id; Trust.grantor_tax_status"
    constants: {}
    precision: "2 decimal places, round_half_up"
    variants:
      - name: grantor_trust_variant
        when: "Trust.grantor_tax_status == GRANTOR (either REVOCABLE, or IRREVOCABLE with has_grantor_powers=true)"
        difference: "trust_taxable_income is forced to 0.00 regardless of DNI; grantor reports the income personally. trust_income_tax also becomes 0.00. Identical Transactions and Distributions therefore yield a different trust_taxable_income value vs. the non_grantor_variant."
      - name: non_grantor_variant
        when: "Trust.grantor_tax_status == NON_GRANTOR"
        difference: "Trust is a separate taxpayer. trust_taxable_income = max(0, DNI - executed_income_distributions). Same inputs produce a positive number where the grantor variant produces 0."

  - name: trust_income_tax_computation
    trigger: "TaxYear CLOSING→CLOSED and AMENDED→CLOSED"
    algorithm: tiered_pricing
    formula: |
      # Compressed trust tax brackets (simplified for benchmark; bands explicit).
      # Applied to trust_taxable_income. For grantor trusts this is always 0.
      taxable = TaxYear.trust_taxable_income
      if taxable <= 0:
        tax = 0.00
      else:
        # Marginal-rate, tier-boundary allocation.
        # Process tiers in ascending order; portion in each tier taxed at that tier's rate.
        tiers = [
          (0,        BRACKET_1_TOP, BRACKET_1_RATE),  # 0.00 .. 3_100.00 @ 10%
          (BRACKET_1_TOP, BRACKET_2_TOP, BRACKET_2_RATE),  # 3_100.01 .. 11_150.00 @ 24%
          (BRACKET_2_TOP, BRACKET_3_TOP, BRACKET_3_RATE),  # 11_150.01 .. 15_200.00 @ 35%
          (BRACKET_3_TOP, INF,          BRACKET_4_RATE),  # > 15_200.00 @ 37%
        ]
        tax = 0.00
        remaining = taxable
        prev_top = 0.00
        for (lo, hi, rate) in tiers:
          band_width = hi - lo if hi != INF else remaining
          band_taxable = min(remaining, band_width) if hi != INF else remaining
          if band_taxable <= 0: break
          tax += band_taxable * rate
          remaining -= band_taxable
          prev_top = hi
        tax = round_half_up(tax, 2)   # rounding done ONCE at the end of accumulation,
                                       # NOT per band. This is the pinned order.
    input_set: "TaxYear.trust_taxable_income, bracket constants"
    constants:
      BRACKET_1_TOP: 3100.00
      BRACKET_2_TOP: 11150.00
      BRACKET_3_TOP: 15200.00
      BRACKET_1_RATE: 0.10
      BRACKET_2_RATE: 0.24
      BRACKET_3_RATE: 0.35
      BRACKET_4_RATE: 0.37
    precision: "2 decimal places, round_half_up; rounding applied once at end of cumulative tax sum, NOT per band (pinned order)."
    variants: []

  - name: gst_skip_person_determination
    trigger: "Beneficiary creation; recomputed if relation_class or birth_date changes via PATCH"
    algorithm: threshold
    formula: |
      # IRC §2613-style "skip person" test.
      if Beneficiary.relation_class IN {GRANDCHILD}:
        is_skip_person = true
      elif Beneficiary.relation_class == OTHER_LINEAL:
        # great-grandchild and further-removed lineals
        age_diff_years = years_between(Trust.inception_date_or_grantor_dob, Beneficiary.birth_date)
        is_skip_person = (age_diff_years >= GST_GENERATION_GAP_YEARS)
      elif Beneficiary.relation_class == NON_LINEAL:
        age_diff_years = years_between(grantor_dob_proxy=Trust.inception_date, Beneficiary.birth_date)
        is_skip_person = (age_diff_years >= GST_GENERATION_GAP_YEARS)
      else:   # SPOUSE, CHILD
        is_skip_person = false

      # Boundary precision: GST_GENERATION_GAP_YEARS == 37.5; we use >= so 37.5 exactly is a skip person.
      # 37.49999 (e.g. born 37 years 5 months and 29 days after grantor) is NOT a skip person.
    input_set: "Beneficiary fields, Trust.inception_date"
    constants:
      GST_GENERATION_GAP_YEARS: 37.5
    precision: "Age difference computed in years to 2 decimal places using day-count (days/365.25), then compared with >="
    variants: []

  - name: gst_taxable_classification
    trigger: "Distribution PROPOSED→APPROVED and APPROVED→EXECUTED"
    algorithm: threshold
    formula: |
      # A distribution to a skip person is GST-taxable to the extent
      # it exceeds the trust's remaining GST exemption.
      total_amount = Distribution.amount_principal + Distribution.amount_income
      remaining_exemption = max(0, GST_EXEMPTION_LIMIT - Trust.gst_exemption_used)
      taxable_portion = max(0, total_amount - remaining_exemption) if Beneficiary.is_skip_person else 0.00
      gst_taxable = (Beneficiary.is_skip_person AND taxable_portion > 0)
      # Boundary: if total_amount exactly equals remaining_exemption, taxable_portion = 0, gst_taxable = false.
      # If total_amount = remaining_exemption + 0.01, taxable_portion = 0.01, gst_taxable = true.
    input_set: "Distribution amounts, Beneficiary.is_skip_person, Trust.gst_exemption_used, constant GST_EXEMPTION_LIMIT"
    constants:
      GST_EXEMPTION_LIMIT: 13610000.00
      # Simplified per-trust lifetime exemption; cumulative across distributions.
    precision: "2 decimal places, round_half_up"
    variants: []

  - name: gst_tax_computation
    trigger: "Distribution APPROVED→EXECUTED (only when gst_taxable=true)"
    algorithm: threshold
    formula: |
      # GST tax is computed AFTER exemption is allocated.
      # Evaluation order (pinned): (1) classify gst_taxable via gst_taxable_classification,
      # (2) compute taxable_portion = max(0, total_amount - remaining_exemption),
      # (3) gst_tax_amount = round_half_up(taxable_portion * GST_TAX_RATE, 2).
      # This is a CIRCULAR-LOOKING dependency: gst_exemption_used affects taxable_portion,
      # and the executed distribution then writes back to gst_exemption_used.
      # Pinned order: exemption is allocated FIRST (consumed on execute up to remaining cap),
      # THEN tax is computed on the residual.
      if Distribution.gst_taxable:
        total_amount = Distribution.amount_principal + Distribution.amount_income
        exemption_applied = min(total_amount, max(0, GST_EXEMPTION_LIMIT - Trust.gst_exemption_used))
        taxable_portion = total_amount - exemption_applied
        gst_tax_amount = round_half_up(taxable_portion * GST_TAX_RATE, 2)
      else:
        gst_tax_amount = 0.00
    input_set: "Distribution.amount_principal, Distribution.amount_income, Trust.gst_exemption_used (pre-execute value), constants"
    constants:
      GST_TAX_RATE: 0.40
      GST_EXEMPTION_LIMIT: 13610000.00
    precision: "2 decimal places, round_half_up; evaluation order pinned: exemption first, tax second."
    variants: []

  - name: k1_dni_allocation
    trigger: "TaxYear OPEN→CLOSING, also each Distribution APPROVED→EXECUTED (DRAFT K-1 refresh)"
    algorithm: waterfall_allocation
    formula: |
      # Waterfall: allocate DNI character to beneficiaries in tier order, then pro-rata within tier.
      # Order is PINNED: TIER_1 receives DNI first up to their income distributions;
      # TIER_2 receives any remainder up to their income distributions.
      # Character (ordinary/interest/dividend/cap-gain) flows through proportionally to total DNI.
      #
      # For each beneficiary B, define dist_income_B = sum(EXECUTED.amount_income for B in this TaxYear).
      #
      # Step 1: tier_1_total = sum(dist_income_B for B where distribution_tier=TIER_1)
      # Step 2: tier_2_total = sum(dist_income_B for B where distribution_tier=TIER_2)
      # Step 3: dni_to_tier_1 = min(DNI, tier_1_total)
      # Step 4: dni_remaining = DNI - dni_to_tier_1
      # Step 5: dni_to_tier_2 = min(dni_remaining, tier_2_total)
      # Step 6: For each B in TIER_1: B_share = (dist_income_B / tier_1_total) * dni_to_tier_1 (or 0 if tier_1_total==0)
      # Step 7: For each B in TIER_2: B_share = (dist_income_B / tier_2_total) * dni_to_tier_2 (or 0 if tier_2_total==0)
      #
      # Within B_share, split by character pro-rata:
      #   ordinary_income_share = B_share * (ordinary_income / DNI)
      #   interest_income_share = B_share * (interest_income / DNI)
      #   dividend_income_share = B_share * (dividend_income / DNI)
      #   capital_gain_share    = B_share * (capital_gain / DNI)   (only if distribution_type=TERMINATING for B's largest distribution; else 0)
      #
      # Rounding is PINNED: per-beneficiary pro-rata products are rounded to 2dp AFTER all multiplications
      # for that beneficiary, NOT after each character split. The four character shares for a single
      # beneficiary MUST sum exactly to that beneficiary's rounded B_share; the largest character bucket
      # absorbs any 0.01 rounding remainder.
      #
      # Boundary: if DNI==0 then all character shares are 0.00 for every beneficiary.
    input_set: "DNI from dni_computation, executed Distribution.amount_income per beneficiary, Beneficiary.distribution_tier, character buckets from dni_computation"
    constants: {}
    precision: "2 decimal places, round_half_up. Rounding order pinned: B_share rounded first, then character split absorbs remainder into largest bucket."
    variants: []

  - name: trust_balance_recomputation
    trigger: "Asset state change (FUNDED|DISTRIBUTED|SOLD), Transaction creation, Distribution EXECUTED, TaxYear finalize"
    algorithm: aggregation
    formula: |
      Trust.principal_balance =
          sum(Asset.book_value where classification=PRINCIPAL AND status=FUNDED)
        + sum(Transaction.amount where principal_or_income=PRINCIPAL AND txn_type IN {INCOME_*})
        - sum(Transaction.amount where principal_or_income=PRINCIPAL AND txn_type IN {EXPENSE_*})
        - sum(Distribution.amount_principal where status=EXECUTED)

      Trust.income_balance =
          sum(Asset.book_value where classification=INCOME AND status=FUNDED)
        + sum(Transaction.amount where principal_or_income=INCOME AND txn_type IN {INCOME_*})
        - sum(Transaction.amount where principal_or_income=INCOME AND txn_type IN {EXPENSE_*})
        - sum(Distribution.amount_income where status=EXECUTED)
        - sum(Distribution.gst_tax_amount where status=EXECUTED AND gst_taxable=true)
        - sum(TaxYear.trust_income_tax where status IN {CLOSED, AMENDED})
    input_set: "Assets, Transactions, EXECUTED Distributions, CLOSED/AMENDED TaxYears"
    constants: {}
    precision: "2 decimal places, round_half_up at the final sum, not per term."
    variants: []

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role permitted for this endpoint per §1.7 RBAC"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "All path-segment IDs resolve to existing resources, validated left-to-right (Trust before Trustee/Beneficiary/Asset/Transaction/Distribution/TaxYear; TaxYear before K1)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all resource endpoints

  - priority: 4
    category: existence
    check: "If body references a sibling entity (Distribution.beneficiary_id, Transaction.tax_year_id derivation), that entity exists under the same Trust"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "POST /trusts/{trustId}/distributions, POST /trusts/{trustId}/transactions"

  - priority: 5
    category: state
    check: "Optimistic concurrency: version in body matches current resource version on PATCH"
    error_id: ERR_VERSION_MISMATCH
    http_status: 409
    applies_to: "PATCH endpoints on Trust, Trustee, Beneficiary, Asset, Distribution"

  - priority: 6
    category: state
    check: "Target resource is in a state from which this operation is allowed (per §1.2 state machines)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "All state-transition action endpoints (activate/approve/execute/reject/revoke/terminate/begin-close/finalize/amend)"

  - priority: 7
    category: business_referential
    check: "Beneficiary referenced in Distribution must have status=ACTIVE at time of approval"
    error_id: ERR_BENEFICIARY_TERMINATED
    http_status: 409
    applies_to: "POST /distributions/{id}/approve, /execute"

  - priority: 8
    category: business_safety
    check: "Segregation of duties: same user_id cannot both propose and approve a Distribution; same user_id cannot both approve and reject the same APPROVED Distribution"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /distributions/{id}/approve, /reject"

  - priority: 9
    category: business_safety
    check: "Court-of-law immutability: an IRREVOCABLE trust cannot transition to REVOKED, and trust_type cannot be PATCHed once status=ACTIVE; grantor_tax_status cannot change once status=ACTIVE"
    error_id: ERR_IRREVOCABLE_CANNOT_REVOKE
    http_status: 403
    applies_to: "POST /trusts/{id}/revoke; PATCH /trusts/{id}"

  - priority: 10
    category: business_temporal
    check: "Transaction.transaction_date and Distribution.scheduled_date MUST fall inside an OPEN (or, for Transactions, OPEN-or-CLOSING) TaxYear of this trust"
    error_id: ERR_TAX_YEAR_CLOSED
    http_status: 409
    applies_to: "POST /trusts/{id}/transactions, POST /trusts/{id}/distributions"

  - priority: 11
    category: business_temporal
    check: "TaxYear cannot begin-close before its end_date has passed (clock-based)"
    error_id: ERR_TAX_YEAR_NOT_ENDED
    http_status: 409
    applies_to: "POST /trusts/{id}/tax-years/{tyId}/begin-close"

  - priority: 12
    category: business_constraint
    check: "Trust amendment chain: amend(year N) is forbidden if any year > N is already CLOSED (must amend in order)"
    error_id: ERR_NEWER_YEAR_CLOSED
    http_status: 409
    applies_to: "POST /trusts/{id}/tax-years/{tyId}/amend"

  - priority: 13
    category: business_constraint
    check: "Activation requires exactly one is_primary trustee (ACTIVE) and at least one ACTIVE beneficiary"
    error_id: ERR_NO_PRIMARY_TRUSTEE
    http_status: 409
    applies_to: "POST /trusts/{id}/activate"

  - priority: 14
    category: business_constraint
    check: "GRANTOR tax status incompatible with IRREVOCABLE trust_type unless has_grantor_powers=true"
    error_id: ERR_GRANTOR_STATUS_INCOMPATIBLE
    http_status: 422
    applies_to: "POST /trusts; PATCH /trusts/{id} (while DRAFT)"

  - priority: 15
    category: business_fiscal
    check: "Distribution.amount_principal <= Trust.principal_balance at approve-time and again at execute-time"
    error_id: ERR_INSUFFICIENT_PRINCIPAL
    http_status: 409
    applies_to: "POST /distributions/{id}/approve, /execute"

  - priority: 16
    category: business_fiscal
    check: "Distribution.amount_income <= Trust.income_balance at approve-time and again at execute-time"
    error_id: ERR_INSUFFICIENT_INCOME
    http_status: 409
    applies_to: "POST /distributions/{id}/approve, /execute"

  - priority: 17
    category: business_fiscal
    check: "TaxYear finalize: Trust.income_balance >= computed trust_income_tax (cannot finalize a year whose retained-income tax exceeds the trust's available income_balance)"
    error_id: ERR_INSUFFICIENT_INCOME_FOR_TAX
    http_status: 409
    applies_to: "POST /trusts/{id}/tax-years/{tyId}/finalize"

  - priority: 18
    category: business_constraint
    check: "Termination requires zero balances and no FUNDED assets"
    error_id: ERR_NONZERO_BALANCE
    http_status: 409
    applies_to: "POST /trusts/{id}/terminate"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- System / Test-driving endpoints ----
  - method: POST
    path: "/_clock/advance"
    description: "Advance the test clock to a specific ISO 8601 timestamp. REQUIRED for any TaxYear.begin-close test (cannot wait for wall-clock year-end)."
    roles: [TaxPreparer, Trustee, Grantor]
    code: 200
    input: [to_timestamp]
    output: null
    side_effects:
      - "All subsequent now() lookups return the advanced timestamp."

  # ---- Trust CRUD + lifecycle ----
  - method: POST
    path: "/trusts"
    description: "Create a Trust in DRAFT"
    roles: [Grantor]
    code: 201
    input: [name, trust_type, grantor_tax_status, has_grantor_powers, situs_state, inception_date]
    output: Trust
    side_effects:
      - "Trust.status=DRAFT; grantor_user_id pinned to X-User-ID"
      - "principal_balance=0, income_balance=0, gst_exemption_used=0"

  - method: GET
    path: "/trusts/{trustId}"
    description: "Read a Trust"
    roles: [Grantor, Trustee, Beneficiary, TaxPreparer, Auditor]
    code: 200
    input: []
    output: Trust
    side_effects: []

  - method: GET
    path: "/trusts"
    description: "List Trusts visible to caller (paginated; filters: status, trust_type)"
    roles: [Grantor, Trustee, TaxPreparer, Auditor]
    code: 200
    input: ["limit?", "offset?", "status?", "trust_type?"]
    output: "Trust[]"
    side_effects: []

  - method: PATCH
    path: "/trusts/{trustId}"
    description: "Update mutable fields of a Trust (situs_state, name). trust_type and grantor_tax_status only mutable while status=DRAFT."
    roles: [Grantor]
    code: 200
    input: ["name?", "situs_state?", "trust_type?", "grantor_tax_status?", "has_grantor_powers?", "version"]
    output: Trust
    side_effects: []

  - method: POST
    path: "/trusts/{trustId}/activate"
    description: "Transition Trust DRAFT→ACTIVE"
    roles: [Grantor]
    code: 200
    input: []
    output: Trust
    side_effects:
      - "Per state machine. Recomputes principal_balance and income_balance from Assets."

  - method: POST
    path: "/trusts/{trustId}/revoke"
    description: "Revoke a REVOCABLE Trust"
    roles: [Grantor]
    code: 200
    input: []
    output: Trust
    side_effects:
      - "Cascade per state machine"

  - method: POST
    path: "/trusts/{trustId}/terminate"
    description: "Terminate an exhausted Trust"
    roles: [Trustee]
    code: 200
    input: []
    output: Trust
    side_effects: []

  # ---- Trustee ----
  - method: POST
    path: "/trusts/{trustId}/trustees"
    description: "Add a Trustee (allowed in any non-terminal Trust state)"
    roles: [Grantor]
    code: 201
    input: [user_id, full_name, is_primary]
    output: Trustee
    side_effects:
      - "If is_primary=true and another is_primary already exists, that prior trustee is demoted (is_primary=false) — cascade depth-2"

  - method: GET
    path: "/trusts/{trustId}/trustees/{trusteeId}"
    description: "Read a Trustee"
    roles: [Grantor, Trustee, TaxPreparer, Auditor]
    code: 200
    input: []
    output: Trustee
    side_effects: []

  # ---- Beneficiary ----
  - method: POST
    path: "/trusts/{trustId}/beneficiaries"
    description: "Add a Beneficiary"
    roles: [Grantor]
    code: 201
    input: [full_name, relation_class, beneficiary_class, distribution_tier, birth_date]
    output: Beneficiary
    side_effects:
      - "is_skip_person recomputed per calculations.gst_skip_person_determination"

  - method: GET
    path: "/trusts/{trustId}/beneficiaries/{beneficiaryId}"
    description: "Read a Beneficiary"
    roles: [Grantor, Trustee, Beneficiary, TaxPreparer, Auditor]
    code: 200
    input: []
    output: Beneficiary
    side_effects: []

  - method: POST
    path: "/trusts/{trustId}/beneficiaries/{beneficiaryId}/terminate"
    description: "Terminate a Beneficiary"
    roles: [Trustee]
    code: 200
    input: []
    output: Beneficiary
    side_effects: []

  # ---- Asset ----
  - method: POST
    path: "/trusts/{trustId}/assets"
    description: "Add an Asset"
    roles: [Grantor, Trustee]
    code: 201
    input: [description, asset_class, book_value, classification]
    output: Asset
    side_effects:
      - "Trust principal_balance or income_balance increases by book_value depending on classification"

  - method: GET
    path: "/trusts/{trustId}/assets/{assetId}"
    description: "Read an Asset"
    roles: [Grantor, Trustee, TaxPreparer, Auditor]
    code: 200
    input: []
    output: Asset
    side_effects: []

  # ---- Transaction (append-only) ----
  - method: POST
    path: "/trusts/{trustId}/transactions"
    description: "Record an INCOME or EXPENSE Transaction. tax_year_id is resolved server-side from transaction_date."
    roles: [Trustee]
    code: 201
    input: [txn_type, amount, transaction_date, principal_or_income, description]
    output: Transaction
    side_effects:
      - "Trust principal_balance or income_balance updates per principal_or_income"
      - "If transaction_date is in a CLOSING year: still allowed; that year's DRAFT K-1s and DNI snapshot are recomputed"

  - method: GET
    path: "/trusts/{trustId}/transactions/{transactionId}"
    description: "Read a Transaction"
    roles: [Grantor, Trustee, TaxPreparer, Auditor]
    code: 200
    input: []
    output: Transaction
    side_effects: []

  - method: GET
    path: "/trusts/{trustId}/transactions"
    description: "List Transactions (paginated; filters: tax_year_id, txn_type, date range)"
    roles: [Grantor, Trustee, TaxPreparer, Auditor]
    code: 200
    input: ["limit?", "offset?", "tax_year_id?", "txn_type?", "from?", "to?"]
    output: "Transaction[]"
    side_effects: []

  # ---- Distribution ----
  - method: POST
    path: "/trusts/{trustId}/distributions"
    description: "Propose a Distribution (status=PROPOSED)"
    roles: [Grantor, Trustee]
    code: 201
    input: [beneficiary_id, scheduled_date, amount_principal, amount_income, distribution_type]
    output: Distribution
    side_effects:
      - "proposed_by_user_id pinned to X-User-ID"
      - "gst_taxable preview computed (informational on PROPOSED; pinned on APPROVED)"

  - method: GET
    path: "/trusts/{trustId}/distributions/{distributionId}"
    description: "Read a Distribution"
    roles: [Grantor, Trustee, Beneficiary, TaxPreparer, Auditor]
    code: 200
    input: []
    output: Distribution
    side_effects: []

  - method: POST
    path: "/trusts/{trustId}/distributions/{distributionId}/approve"
    description: "Approve a PROPOSED Distribution"
    roles: [Trustee]
    code: 200
    input: []
    output: Distribution
    side_effects:
      - "approved_by_user_id pinned; gst_taxable and gst_tax_amount finalized; status→APPROVED"

  - method: POST
    path: "/trusts/{trustId}/distributions/{distributionId}/execute"
    description: "Execute an APPROVED Distribution"
    roles: [Trustee]
    code: 200
    input: []
    output: Distribution
    side_effects:
      - "Trust.principal_balance -= amount_principal"
      - "Trust.income_balance -= amount_income (and -= gst_tax_amount if taxable)"
      - "Trust.gst_exemption_used += exemption_applied"
      - "K-1 DRAFT for this beneficiary in this TaxYear recomputed (depth-3 cascade)"

  - method: POST
    path: "/trusts/{trustId}/distributions/{distributionId}/reject"
    description: "Reject a PROPOSED or APPROVED Distribution"
    roles: [Trustee]
    code: 200
    input: []
    output: Distribution
    side_effects: []

  # ---- TaxYear ----
  - method: POST
    path: "/trusts/{trustId}/tax-years"
    description: "Open a TaxYear for a specific calendar_year (idempotent on (trust_id, calendar_year))"
    roles: [Trustee, TaxPreparer]
    code: 201
    input: [calendar_year]
    output: TaxYear
    side_effects:
      - "start_date and end_date derived"
      - "DRAFT K-1 records auto-created at finalize-time, not at TaxYear creation"
      - "If this is the first TaxYear for the Trust, Trust.current_tax_year_id is set"

  - method: GET
    path: "/trusts/{trustId}/tax-years/{taxYearId}"
    description: "Read a TaxYear"
    roles: [Grantor, Trustee, TaxPreparer, Auditor]
    code: 200
    input: []
    output: TaxYear
    side_effects: []

  - method: POST
    path: "/trusts/{trustId}/tax-years/{taxYearId}/begin-close"
    description: "Begin closing the TaxYear (OPEN→CLOSING). Auto-rejects PROPOSED Distributions in this year."
    roles: [TaxPreparer]
    code: 200
    input: []
    output: TaxYear
    side_effects:
      - "Auto-reject PROPOSED Distributions"
      - "Recompute TaxYear.dni"
      - "Recompute DRAFT K-1 shares (depth-3 cascade)"

  - method: POST
    path: "/trusts/{trustId}/tax-years/{taxYearId}/finalize"
    description: "Finalize the TaxYear (CLOSING→CLOSED or AMENDED→CLOSED)"
    roles: [TaxPreparer]
    code: 200
    input: []
    output: TaxYear
    side_effects:
      - "Compute trust_taxable_income and trust_income_tax"
      - "Debit Trust.income_balance by trust_income_tax"
      - "Issue K-1s (DRAFT→ISSUED) and pin snapshot_distribution_version_sum"

  - method: POST
    path: "/trusts/{trustId}/tax-years/{taxYearId}/amend"
    description: "Reopen a CLOSED TaxYear for K-1 corrections"
    roles: [TaxPreparer]
    code: 200
    input: []
    output: TaxYear
    side_effects:
      - "ISSUED K-1s→SUPERSEDED; new DRAFT K-1s created"

  # ---- K-1 ----
  - method: GET
    path: "/trusts/{trustId}/tax-years/{taxYearId}/k1s"
    description: "List K-1 records (DRAFT, ISSUED, SUPERSEDED) for the TaxYear (filters: status, beneficiary_id)"
    roles: [Grantor, Trustee, TaxPreparer, Auditor, Beneficiary]
    code: 200
    input: ["limit?", "offset?", "status?", "beneficiary_id?"]
    output: "K1[]"
    side_effects:
      - "Beneficiary role sees only their own K-1s (filtered server-side)"

  - method: GET
    path: "/trusts/{trustId}/tax-years/{taxYearId}/k1s/{k1Id}"
    description: "Read a specific K-1"
    roles: [Grantor, Trustee, TaxPreparer, Auditor, Beneficiary]
    code: 200
    input: []
    output: K1
    side_effects:
      - "If caller role is Beneficiary, k1.beneficiary_id MUST equal X-User-ID else 403"

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED,           http: 401, condition: "Missing or unparseable X-User-Role / X-User-ID headers" }
  - { id: ERR_FORBIDDEN,                 http: 403, condition: "Authenticated role not permitted for this endpoint" }
  - { id: ERR_NOT_FOUND,                 http: 404, condition: "A path-segment or referenced resource does not exist within this Trust scope" }
  - { id: ERR_VERSION_MISMATCH,          http: 409, condition: "PATCH supplied version != current resource version" }
  - { id: ERR_INVALID_STATE,             http: 409, condition: "Target resource is not in a state from which this transition is allowed" }
  - { id: ERR_BENEFICIARY_TERMINATED,    http: 409, condition: "Beneficiary referenced by a distribution operation has status=TERMINATED" }
  - { id: ERR_SEGREGATION_OF_DUTIES,     http: 403, condition: "Same user_id attempts both propose+approve, or approve+reject, on a Distribution" }
  - { id: ERR_IRREVOCABLE_CANNOT_REVOKE, http: 403, condition: "Revoke attempted on a Trust with trust_type=IRREVOCABLE; or mutation of trust_type/grantor_tax_status after ACTIVE" }
  - { id: ERR_TAX_YEAR_CLOSED,           http: 409, condition: "Attempted to record a Transaction or schedule a Distribution in a CLOSED/AMENDED (non-OPEN) TaxYear" }
  - { id: ERR_TAX_YEAR_NOT_OPEN,         http: 409, condition: "Operation requires the referenced TaxYear to be in OPEN status (e.g., approving a Distribution)" }
  - { id: ERR_TAX_YEAR_NOT_ENDED,        http: 409, condition: "begin-close requested before TaxYear.end_date has passed (clock-based)" }
  - { id: ERR_TAX_YEAR_CLOSING_IN_PROGRESS, http: 409, condition: "Revoke attempted while a TaxYear is in CLOSING status" }
  - { id: ERR_TAX_YEAR_NOT_CLOSED,       http: 409, condition: "Terminate attempted while current TaxYear is not CLOSED/AMENDED" }
  - { id: ERR_NEWER_YEAR_CLOSED,         http: 409, condition: "Amend attempted on a year while a later year has already been CLOSED" }
  - { id: ERR_NO_PRIMARY_TRUSTEE,        http: 409, condition: "Activation lacks exactly one ACTIVE is_primary trustee" }
  - { id: ERR_NO_BENEFICIARY,            http: 409, condition: "Activation lacks at least one ACTIVE beneficiary" }
  - { id: ERR_NO_OPEN_TAX_YEAR,          http: 409, condition: "Activation requires an open TaxYear matching inception_date's calendar year" }
  - { id: ERR_GRANTOR_STATUS_INCOMPATIBLE, http: 422, condition: "grantor_tax_status=GRANTOR combined with trust_type=IRREVOCABLE and has_grantor_powers=false" }
  - { id: ERR_INSUFFICIENT_PRINCIPAL,    http: 409, condition: "Distribution amount_principal exceeds current Trust.principal_balance" }
  - { id: ERR_INSUFFICIENT_INCOME,       http: 409, condition: "Distribution amount_income exceeds current Trust.income_balance" }
  - { id: ERR_INSUFFICIENT_INCOME_FOR_TAX, http: 409, condition: "Finalize would require paying trust_income_tax exceeding current Trust.income_balance" }
  - { id: ERR_HAS_APPROVED_DISTRIBUTIONS, http: 409, condition: "Operation blocked because APPROVED Distributions exist (revoke, begin-close)" }
  - { id: ERR_HAS_PENDING_DISTRIBUTIONS, http: 409, condition: "Beneficiary terminate blocked because PROPOSED or APPROVED Distributions reference this beneficiary" }
  - { id: ERR_HAS_UNDISTRIBUTED_ASSETS,  http: 409, condition: "Terminate blocked because at least one Asset has status=FUNDED" }
  - { id: ERR_NONZERO_BALANCE,           http: 409, condition: "Terminate blocked because principal_balance or income_balance is non-zero" }
  - { id: ERR_TRUST_NOT_ACTIVE,          http: 409, condition: "Operation requires Trust.status=ACTIVE (e.g., distribution approve, beneficiary terminate)" }
  - { id: ERR_K1_STALE_REFERENCE,        http: 409, condition: "K-1 re-issuance (AMENDED→CLOSED) detected that the underlying sum of Distribution.version values has drifted since the prior amendment snapshot" }
  - { id: ERR_BAD_REQUEST,               http: 400, condition: "Body fails JSON-shape, type, or range validation (e.g., negative amount, malformed enum)" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Grantor
    description: "The natural person who creates and funds the trust. Has authority over DRAFT-state Trust configuration, initial funding (Assets), and proposing distributions. Cannot approve or execute distributions (segregation of duties)."
    identity: "opaque"
    # Grantor identity is opaque: there's no separate Grantor entity. Trust.grantor_user_id stores the
    # X-User-ID of the user who created the Trust. Authorization compares X-User-ID == Trust.grantor_user_id.
    exclusive_operations:
      - "POST /trusts — Create Trust"
      - "PATCH /trusts/{id} — Update DRAFT Trust fields"
      - "POST /trusts/{id}/activate — Activate Trust"
      - "POST /trusts/{id}/revoke — Revoke REVOCABLE Trust"
      - "POST /trusts/{id}/trustees — Add Trustee"
      - "POST /trusts/{id}/beneficiaries — Add Beneficiary"
    shared_operations:
      - "POST /trusts/{id}/assets — Add Asset (also Trustee)"
      - "POST /trusts/{id}/distributions — Propose Distribution (also Trustee)"
      - "GET reads (Trust, Trustee, Beneficiary, Asset, Transaction, Distribution, TaxYear, K1)"
      - "POST /_clock/advance"

  - name: Trustee
    description: "Fiduciary who administers the trust. Records Transactions, proposes/approves/executes/rejects Distributions, opens TaxYears, terminates Beneficiaries and the Trust. The primary trustee is identified by Trustee.is_primary=true."
    identity: "entity_backed:Trustee"
    # X-User-Role=Trustee + X-User-ID=<some Trustee.user_id> — the Trustee record must exist under
    # the trust referenced in the URL path, with Trustee.status=ACTIVE.
    exclusive_operations:
      - "POST /trusts/{id}/transactions — Record Transaction"
      - "POST /trusts/{id}/distributions/{id}/approve — Approve Distribution"
      - "POST /trusts/{id}/distributions/{id}/execute — Execute Distribution"
      - "POST /trusts/{id}/distributions/{id}/reject — Reject Distribution"
      - "POST /trusts/{id}/beneficiaries/{id}/terminate — Terminate Beneficiary"
      - "POST /trusts/{id}/terminate — Terminate Trust"
    shared_operations:
      - "POST /trusts/{id}/assets — Add Asset (also Grantor)"
      - "POST /trusts/{id}/distributions — Propose Distribution (also Grantor)"
      - "POST /trusts/{id}/tax-years — Open TaxYear (also TaxPreparer)"
      - "GET reads"
      - "POST /_clock/advance"

  - name: Beneficiary
    description: "A recipient of trust distributions. Read-only access, and only to their own K-1 and Beneficiary record."
    identity: "entity_backed:Beneficiary"
    exclusive_operations: []
    shared_operations:
      - "GET /trusts/{id}/beneficiaries/{beneficiaryId} — only if beneficiaryId == X-User-ID"
      - "GET /trusts/{id}/tax-years/{tyId}/k1s — server filters to only K-1s with beneficiary_id == X-User-ID"
      - "GET /trusts/{id}/tax-years/{tyId}/k1s/{k1Id} — only if k1.beneficiary_id == X-User-ID"
      - "GET /trusts/{id}/distributions/{id} — only if Distribution.beneficiary_id == X-User-ID"

  - name: TaxPreparer
    description: "Operator who closes and amends TaxYears, computes DNI / trust_taxable_income / trust_income_tax. Cannot create or mutate Trusts, Trustees, Beneficiaries, Assets, Transactions, or Distributions (segregation of duties: tax computation is independent from trust administration)."
    identity: "opaque"
    exclusive_operations:
      - "POST /trusts/{id}/tax-years/{tyId}/begin-close"
      - "POST /trusts/{id}/tax-years/{tyId}/finalize"
      - "POST /trusts/{id}/tax-years/{tyId}/amend"
    shared_operations:
      - "POST /trusts/{id}/tax-years — Open TaxYear (also Trustee)"
      - "GET reads"
      - "POST /_clock/advance"

  - name: Auditor
    description: "Independent read-only role. Sees everything (no scope filtering), mutates nothing. Distinct from Grantor: an auditor reading another grantor's trust is allowed."
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "All GET endpoints across all Trusts (no ownership filter)"
      - "POST /_clock/advance"
