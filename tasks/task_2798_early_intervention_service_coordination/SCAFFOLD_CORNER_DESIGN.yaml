      - name: coordinator_ownership_restricts_writes_but_never_reads
        claim_type: peer_ownership_isolation
        grounds:
          - roles.ServiceCoordinator
          - validations[priority 16 -> ERR_NOT_RESOURCE_OWNER]
          - validations[priority 19 -> ERR_REFERRAL_STATE_INVALID]
        distinguishing_aspect: |
          Ownership is enforced on writes only: coordinator B is refused both the monthly contact log
          and the case exit on coordinator A's referral, yet the same identity may GET that referral
          and its caseload-neighbour data, because every read under /ei is a shared operation. The
          exit attempt also violates nothing else, while a REACHED_AGE_THREE exit by the true owner
          would fail on the transition plan — so the 403 must be returned before any state or
          completeness check runs.
