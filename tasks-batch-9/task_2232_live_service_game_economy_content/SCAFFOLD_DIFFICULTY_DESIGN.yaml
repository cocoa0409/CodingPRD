            - "LiveEvent.${evt_c_id}.reserved_ccu_at_approval == 4000"
            - "CapacityCluster.${cluster_id}.reserved_ccu == 10000"

      - name: offer_sku_closed_interval_cooldown_conflict
        grounds:
          - calculations.offer_sku_window_conflict
          - validations[priority=25]
          - errors[ERR_OFFER_SKU_WINDOW_CONFLICT]
          - state_machines.Offer.OFFLINE_to_LIVE
        distinguishing_aspect: |
          Closed intervals with a symmetric 24-hour cooldown and no aggregate notion — a single
          collision is fatal: a candidate starting exactly 24h after the LIVE sibling's
          window_end is refused, while shifting the start one second later clears the cooldown
          and publishes; this is the opposite interval arithmetic from the cluster instance's
          half-open windows and end-only buffer.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; season S7 LIVE, content_posture ON_TRACK, economy_health HEALTHY."
            - "Offer PACK_A (BUNDLE, single line sku COIN_PACK, window 2026-08-01 -> 2026-08-10) is APPROVED and LIVE."
            - "Offer PACK_B shares the line sku COIN_PACK with window_start 2026-08-11T00:00:00Z, exactly PACK_A.window_end + 24h; it is APPROVED and OFFLINE."
            - "Offer PACK_C is identical to PACK_B except window_start 2026-08-11T00:00:01Z; it is APPROVED and OFFLINE."
