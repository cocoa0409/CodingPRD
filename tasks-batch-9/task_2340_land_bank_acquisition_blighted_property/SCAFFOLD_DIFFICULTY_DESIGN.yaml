              payload: {}
              as: InventoryManager
              as_user_id: "inv-1"
              captures: { p_v: $.data.version }
            - call: "POST /land-bank/properties/${p_id}/maintenance-orders"
              payload: { work_type: "MOW", contractor_id: "${ctr_id}", funding_source_id: "${fs_id}", window_start: "2026-09-01T00:00:00Z", window_end: "2026-09-03T00:00:00Z", expected_property_version: "${p_v}" }
              as: InventoryManager
              as_user_id: "inv-1"
              captures: { mo_id: $.data.id, est: $.data.estimated_cost_cents }
            - call: "GET /land-bank/funding-sources/${fs_id}"
              payload: {}
              as: CountyTreasurer
              as_user_id: "treas-1"
              captures: { auth_mid: $.data.authorized_cents, avail_mid: $.data.available_cents, comm_mid: $.data.committed_cents, disb_mid: $.data.disbursed_cents }
          trigger:
            - call: "POST /land-bank/maintenance-orders/${mo_id}/cancel"
              payload: { cancelled_reason: "Parcel scheduled for immediate side-lot transfer" }
              as: InventoryManager
              as_user_id: "inv-1"
              captures: { mo_status: $.data.status }
            - call: "GET /land-bank/funding-sources/${fs_id}"
              payload: {}
              as: CountyTreasurer
              as_user_id: "treas-1"
              captures: { auth_after: $.data.authorized_cents, avail_after: $.data.available_cents, comm_after: $.data.committed_cents, disb_after: $.data.disbursed_cents, status_after: $.data.status }
          assert:
            - "${est} == 19703 and ${reserve} == 50000  # round_half_up(0.05 * 1000000)"
            - "${auth_mid} == 1000000 and ${avail_mid} == 980297 and ${comm_mid} == 19703 and ${disb_mid} == 0  # identity holds while committed"
            - "${mo_status} == CANCELLED and MaintenanceOrder.${mo_id}.actual_cost_cents == null"
            - "${comm_after} == 0 and ${disb_after} == 0 and ${avail_after} == 1000000  # the compensation is exact: no cent is stranded"
            - "${auth_after} == ${avail_after} + ${comm_after} + ${disb_after}  # authorized == available + committed + disbursed, after"
            - "${status_after} == ACTIVE and FundingSource.${fs_id}.reserve_floor_cents == 50000"

