scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: guarantee_draw_projected_vs_actual_diverge
        grounds:
          - calculations.income_guarantee_draw
          - entities.IncomeGuarantee.fields.total_advanced_cents
          - entities.IncomeGuarantee.fields.projected_total_draw_cents
        distinguishing_aspect: |
          Dual-variant logic on the FINANCE entity IncomeGuarantee: with one ATTESTED month
          (draw 800000) and eleven unreconciled months, the ACTUAL variant (total_advanced_cents)
          is 800000 while the PROJECTED variant (projected_total_draw_cents) is 800000 + 11 *
          2000000 = 22800000 for identical stored data; a different entity domain than the
          retention-risk variant instance.
        test_recipe:
          setup:
            - "Physician (EXPERIENCED, FAMILY_MEDICINE) with an OnboardingCase and an EXECUTED offer (monthly guarantee 2000000 cents, term 12, start 2027-06-01, capacity 1000)"
            - "Logical clock at 2027-06-05; guarantee ACTIVE"
            - "Month-1 milestone REPORTED with actual_wrvu 120 (target 100 -> attained) and collections 1200000, then ATTESTED"
          setup_api_calls:
            - { call: "POST /onboarding/physicians", payload: { full_name: "Dr. Ada", specialty: "FAMILY_MEDICINE", email: "ada@x.com", hire_type: "EXPERIENCED" }, as: Recruiter, captures: { phys_id: "$.data.id" } }
            - { call: "POST /onboarding/onboarding-cases", payload: { physician_id: "${phys_id}", target_start_date: "2027-06-01" }, as: Recruiter, captures: { case_id: "$.data.id", case_v: "$.data.version" } }
            - { call: "POST /onboarding/offers", payload: { onboarding_case_id: "${case_id}", expected_onboarding_case_version: "${case_v}", base_salary_cents: 25000000, signing_bonus_cents: 2000000, guarantee_monthly_cents: 2000000, guarantee_term_months: 12, panel_capacity: 1000, proposed_start_date: "2027-06-01", expires_at: "2026-08-01T00:00:00Z" }, as: Recruiter, captures: { offer_id: "$.data.id" } }
            - { call: "POST /onboarding/offers/${offer_id}/extend", payload: {}, as: Recruiter }
            - { call: "POST /onboarding/offers/${offer_id}/accept", payload: {}, as: Physician, as_user_id: "${phys_id}" }
            - { call: "POST /onboarding/offers/${offer_id}/execute", payload: {}, as: ContractAdministrator }
            - { call: "GET /onboarding/income-guarantees?onboarding_case_id=${case_id}", payload: {}, as: FinanceAnalyst, captures: { gar_id: "$.data[0].id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-06-05T00:00:00Z" }, as: SystemOperator }
            - { call: "POST /onboarding/income-guarantees/${gar_id}/activate", payload: {}, as: FinanceAnalyst }
            - { call: "GET /onboarding/ramp-milestones?onboarding_case_id=${case_id}&month_offset=1", payload: {}, as: PracticeManager, captures: { ms1: "$.data[0].id" } }
            - { call: "POST /onboarding/ramp-milestones/${ms1}/report", payload: { actual_wrvu: 120, collections_cents: 1200000 }, as: PracticeManager }
            - { call: "POST /onboarding/ramp-milestones/${ms1}/attest", payload: {}, as: FinanceAnalyst }
          trigger:
            - { call: "GET /onboarding/income-guarantees/${gar_id}", payload: {}, as: FinanceAnalyst, captures: { adv: "$.data.total_advanced_cents", proj: "$.data.projected_total_draw_cents", forg: "$.data.forgiveness_accrued_cents", outst: "$.data.outstanding_balance_cents" } }
          assert:
            - "IncomeGuarantee.${gar_id}.total_advanced_cents == 800000 (ACTUAL variant: 2000000 - min(1200000, 1800000))"
            - "IncomeGuarantee.${gar_id}.projected_total_draw_cents == 22800000 (PROJECTED variant: 800000 + 11 * 2000000)"
            - "IncomeGuarantee.${gar_id}.projected_total_draw_cents != IncomeGuarantee.${gar_id}.total_advanced_cents"
            - "IncomeGuarantee.${gar_id}.forgiveness_accrued_cents == 100000 and outstanding_balance_cents == 700000"

      - name: retention_score_trailing_vs_leading_diverge
        grounds:
          - calculations.retention_risk_score
          - entities.RetentionRiskSnapshot.fields.variant
          - entities.RetentionRiskSnapshot.fields.score
        distinguishing_aspect: |
          Dual-variant logic on the OPERATIONAL-RISK domain (RetentionRiskSnapshot of the case),
          a different entity domain than IncomeGuarantee: with 2 ATTESTED months (1 missed) and 1
          due-but-unreported month at clock 2027-09-20, TRAILING scores 57.50 (missed ratio over
          attested only: 1/2) while LEADING scores 63.33 (adds the unreported due month: 2/3 and
          next-month panel expectation) for identical stored data.
        test_recipe:
          setup:
            - "Executed offer pipeline (start 2027-06-01, monthly guarantee 2000000, capacity 1000); no panel opening"
            - "Two ACTIVE CLINIC templates totaling 800 weekly minutes (480 weekday 1, 320 weekday 2) -> schedule_risk component 33.33"
            - "Guarantee ACTIVE; month 1 ATTESTED attained (120/100), month 2 ATTESTED missed (100/150), month 3 left PENDING with its window (closes 2027-09-15) expired by the clock at 2027-09-20 without an epoch sweep"
            - "An ACTIVE mentorship with one D30 NEUTRAL check-in (sentiment component 40)"
            - "Logical clock 2027-09-20 -> current_month_offset 3; panel size 0; months_due = {1,2,3}"
          setup_api_calls:
            - { call: "POST /onboarding/physicians", payload: { full_name: "Dr. Bree", specialty: "FAMILY_MEDICINE", email: "bree@x.com", hire_type: "EXPERIENCED" }, as: Recruiter, captures: { phys_id: "$.data.id" } }
            - { call: "POST /onboarding/onboarding-cases", payload: { physician_id: "${phys_id}", target_start_date: "2027-06-01" }, as: Recruiter, captures: { case_id: "$.data.id", case_v: "$.data.version" } }
            - { call: "POST /onboarding/offers", payload: { onboarding_case_id: "${case_id}", expected_onboarding_case_version: "${case_v}", base_salary_cents: 25000000, signing_bonus_cents: 2000000, guarantee_monthly_cents: 2000000, guarantee_term_months: 12, panel_capacity: 1000, proposed_start_date: "2027-06-01", expires_at: "2026-08-01T00:00:00Z" }, as: Recruiter, captures: { offer_id: "$.data.id" } }
            - { call: "POST /onboarding/offers/${offer_id}/extend", payload: {}, as: Recruiter }
            - { call: "POST /onboarding/offers/${offer_id}/accept", payload: {}, as: Physician, as_user_id: "${phys_id}" }
            - { call: "POST /onboarding/offers/${offer_id}/execute", payload: {}, as: ContractAdministrator }
            - { call: "POST /onboarding/schedule-templates", payload: { onboarding_case_id: "${case_id}", weekday: 1, start_minute: 480, end_minute: 960, block_type: "CLINIC" }, as: PracticeManager, captures: { tpl1: "$.data.id" } }
            - { call: "POST /onboarding/schedule-templates/${tpl1}/activate", payload: {}, as: PracticeManager }
            - { call: "POST /onboarding/schedule-templates", payload: { onboarding_case_id: "${case_id}", weekday: 2, start_minute: 480, end_minute: 800, block_type: "CLINIC" }, as: PracticeManager, captures: { tpl2: "$.data.id" } }
            - { call: "POST /onboarding/schedule-templates/${tpl2}/activate", payload: {}, as: PracticeManager }
            - { call: "GET /onboarding/income-guarantees?onboarding_case_id=${case_id}", payload: {}, as: FinanceAnalyst, captures: { gar_id: "$.data[0].id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-06-05T00:00:00Z" }, as: SystemOperator }
            - { call: "POST /onboarding/income-guarantees/${gar_id}/activate", payload: {}, as: FinanceAnalyst }
            - { call: "GET /onboarding/ramp-milestones?onboarding_case_id=${case_id}&month_offset=1", payload: {}, as: PracticeManager, captures: { ms1: "$.data[0].id" } }
            - { call: "POST /onboarding/ramp-milestones/${ms1}/report", payload: { actual_wrvu: 120, collections_cents: 1200000 }, as: PracticeManager }
            - { call: "POST /onboarding/ramp-milestones/${ms1}/attest", payload: {}, as: FinanceAnalyst }
            - { call: "GET /onboarding/ramp-milestones?onboarding_case_id=${case_id}&month_offset=2", payload: {}, as: PracticeManager, captures: { ms2: "$.data[0].id" } }
            - { call: "POST /onboarding/ramp-milestones/${ms2}/report", payload: { actual_wrvu: 100, collections_cents: 600000 }, as: PracticeManager }
            - { call: "POST /onboarding/ramp-milestones/${ms2}/attest", payload: {}, as: FinanceAnalyst }
            - { call: "POST /onboarding/physicians", payload: { full_name: "Dr. Mentor", specialty: "FAMILY_MEDICINE", email: "mentor@x.com", hire_type: "LEADERSHIP" }, as: Recruiter, captures: { mentor_id: "$.data.id" } }
            - { call: "POST /onboarding/physicians/${mentor_id}/mark-active", payload: {}, as: OnboardingDirector }
            - { call: "GET /onboarding/onboarding-cases/${case_id}", payload: {}, as: OnboardingDirector, captures: { case_v_now: "$.data.version" } }
            - { call: "POST /onboarding/mentorship-assignments", payload: { onboarding_case_id: "${case_id}", mentor_physician_id: "${mentor_id}", expected_onboarding_case_version: "${case_v_now}" }, as: OnboardingDirector, captures: { ma_id: "$.data.id" } }
            - { call: "POST /onboarding/mentorship-assignments/${ma_id}/check-ins", payload: { day_marker: "D30", sentiment: "NEUTRAL" }, as: MentorPhysician, as_user_id: "${mentor_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-09-20T00:00:00Z" }, as: SystemOperator }
          trigger:
            - { call: "POST /onboarding/retention-snapshots", payload: { onboarding_case_id: "${case_id}", variant: "TRAILING" }, as: OnboardingDirector, captures: { snap_t: "$.data.id", score_t: "$.data.score", band_t: "$.data.risk_band" } }
            - { call: "POST /onboarding/retention-snapshots", payload: { onboarding_case_id: "${case_id}", variant: "LEADING" }, as: OnboardingDirector, captures: { snap_l: "$.data.id", score_l: "$.data.score", band_l: "$.data.risk_band" } }
          assert:
            - "Snapshot ${snap_t}: milestone_risk == 50.00, panel_risk == 100.00, sentiment_risk == 40.00, schedule_risk == 33.33, score == 57.50, risk_band == HIGH"
            - "Snapshot ${snap_l}: milestone_risk == 66.67, panel_risk == 100.00, sentiment_risk == 40.00, schedule_risk == 33.33, score == 63.33, risk_band == HIGH"
            - "Snapshot scores differ (57.50 != 63.33) for identical stored data"
            - "OnboardingCase.${case_id}.latest_risk_score == 63.33 and latest_risk_band == HIGH and at_risk == true after the second snapshot"

  - rule_id: combinatorial_formula
    instances:
      - name: guarantee_draw_multifactor_credit_penalty_cap
        grounds:
          - calculations.income_guarantee_draw
          - entities.RampMilestone.fields.attained
          - entities.IncomeGuarantee.fields.total_advanced_cents
        distinguishing_aspect: |
          Mode (a): >= 3 inputs (collections_cents, attained flag, monthly_guarantee_cents) with
          non-linear interaction (nested min with the credit cap, max with the zero floor, and a
          conditional 10% credit penalty branch on the missed state): three attested months give
          draws 800000 (attained, collections 1200000), 920000 (missed, collections 1200000 ->
          credit 1080000) and 200000 (attained, collections 2500000 -> credit capped at 1800000).
        test_recipe:
          setup:
            - "Executed offer pipeline (start 2027-06-01, monthly guarantee 2000000, term 12, capacity 1000); guarantee ACTIVE at clock 2027-06-05"
            - "Months 1-3 REPORTED and ATTESTED with (actual_wrvu, collections): (120, 1200000) attained; (100, 1200000) missed; (250, 2500000) attained"
          setup_api_calls:
            - { call: "POST /onboarding/physicians", payload: { full_name: "Dr. Cam", specialty: "FAMILY_MEDICINE", email: "cam@x.com", hire_type: "EXPERIENCED" }, as: Recruiter, captures: { phys_id: "$.data.id" } }
            - { call: "POST /onboarding/onboarding-cases", payload: { physician_id: "${phys_id}", target_start_date: "2027-06-01" }, as: Recruiter, captures: { case_id: "$.data.id", case_v: "$.data.version" } }
            - { call: "POST /onboarding/offers", payload: { onboarding_case_id: "${case_id}", expected_onboarding_case_version: "${case_v}", base_salary_cents: 25000000, signing_bonus_cents: 2000000, guarantee_monthly_cents: 2000000, guarantee_term_months: 12, panel_capacity: 1000, proposed_start_date: "2027-06-01", expires_at: "2026-08-01T00:00:00Z" }, as: Recruiter, captures: { offer_id: "$.data.id" } }
            - { call: "POST /onboarding/offers/${offer_id}/extend", payload: {}, as: Recruiter }
            - { call: "POST /onboarding/offers/${offer_id}/accept", payload: {}, as: Physician, as_user_id: "${phys_id}" }
            - { call: "POST /onboarding/offers/${offer_id}/execute", payload: {}, as: ContractAdministrator }
            - { call: "GET /onboarding/income-guarantees?onboarding_case_id=${case_id}", payload: {}, as: FinanceAnalyst, captures: { gar_id: "$.data[0].id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-06-05T00:00:00Z" }, as: SystemOperator }
            - { call: "POST /onboarding/income-guarantees/${gar_id}/activate", payload: {}, as: FinanceAnalyst }
            - { call: "GET /onboarding/ramp-milestones?onboarding_case_id=${case_id}&month_offset=1", payload: {}, as: PracticeManager, captures: { ms1: "$.data[0].id" } }
            - { call: "POST /onboarding/ramp-milestones/${ms1}/report", payload: { actual_wrvu: 120, collections_cents: 1200000 }, as: PracticeManager }
            - { call: "POST /onboarding/ramp-milestones/${ms1}/attest", payload: {}, as: FinanceAnalyst }
            - { call: "GET /onboarding/ramp-milestones?onboarding_case_id=${case_id}&month_offset=2", payload: {}, as: PracticeManager, captures: { ms2: "$.data[0].id" } }
            - { call: "POST /onboarding/ramp-milestones/${ms2}/report", payload: { actual_wrvu: 100, collections_cents: 1200000 }, as: PracticeManager }
            - { call: "POST /onboarding/ramp-milestones/${ms2}/attest", payload: {}, as: FinanceAnalyst }
            - { call: "GET /onboarding/ramp-milestones?onboarding_case_id=${case_id}&month_offset=3", payload: {}, as: PracticeManager, captures: { ms3: "$.data[0].id" } }
            - { call: "POST /onboarding/ramp-milestones/${ms3}/report", payload: { actual_wrvu: 250, collections_cents: 2500000 }, as: PracticeManager }
            - { call: "POST /onboarding/ramp-milestones/${ms3}/attest", payload: {}, as: FinanceAnalyst }
          trigger:
            - { call: "GET /onboarding/income-guarantees/${gar_id}", payload: {}, as: FinanceAnalyst }
          assert:
            - "IncomeGuarantee.${gar_id}.total_advanced_cents == 1920000 (800000 + 920000 + 200000)"
            - "IncomeGuarantee.${gar_id}.months_reconciled == 3"
            - "IncomeGuarantee.${gar_id}.forgiveness_accrued_cents == 200000 (2 attained months * 100000)"
            - "IncomeGuarantee.${gar_id}.outstanding_balance_cents == 1720000 (1920000 - 0 - 200000)"
            - "IncomeGuarantee.${gar_id}.projected_total_draw_cents == 19920000 (1920000 + 9 * 2000000)"
            - "RampMilestone month 2 (missed) contributed 920000: credit = round(1200000 * 0.9) = 1080000; the missed branch is observably different from the attained branch (800000) for identical collections"

      - name: retention_score_per_term_rounding_order_pinned
        grounds:
          - calculations.retention_risk_score
          - entities.RetentionRiskSnapshot.fields.score
          - entities.RetentionRiskSnapshot.fields.risk_band
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters. Components milestone 33.33 (1 missed of
          3 attested), panel 94.50 (expected 200 = 2000 * 0.10 at month offset 1, current 11),
          sentiment 100 (one CRISIS check-in), schedule 98.00 (24 of 1200 minutes). Pinned order
          (round each weighted term HALF_UP, then sum): 11.67 + 23.63 + 25.00 + 14.70 = 75.00 ->
          CRITICAL. The alternative (sum raw terms then round once) yields 74.99 -> HIGH. The
          scaffold pins the per-term order and the test asserts score == 75.00 and band CRITICAL.
        test_recipe:
          setup:
            - "Full go-live pipeline for an EXPERIENCED FAMILY_MEDICINE physician with panel_capacity 2000: credentials (license/DEA/Medicare) APPROVED, training COMPLETE, four CLINIC templates totalling 1220 weekly minutes (480 + 480 + 240 + 20 ... see calls: 480+480+240+24 = 1224), clock 2027-06-05, panel OPEN"
            - "Census adjusted +11 (current_size 11)"
            - "Guarantee ACTIVE; months 1-3 ATTESTED with exactly one miss: (120/100 attained), (160/150 attained), (100/200 missed)"
            - "Templates retired down to 24 weekly minutes (retire the 480, 480 and 240 blocks; panel auto-freezes)"
            - "ACTIVE mentorship with one D30 CRISIS check-in"
            - "Clock remains in June 2027 so current_month_offset == 1"
          setup_api_calls:
            - { call: "POST /onboarding/physicians", payload: { full_name: "Dr. Dee", specialty: "FAMILY_MEDICINE", email: "dee@x.com", hire_type: "EXPERIENCED" }, as: Recruiter, captures: { phys_id: "$.data.id" } }
            - { call: "POST /onboarding/onboarding-cases", payload: { physician_id: "${phys_id}", target_start_date: "2027-06-01" }, as: Recruiter, captures: { case_id: "$.data.id", case_v: "$.data.version" } }
            - { call: "POST /onboarding/offers", payload: { onboarding_case_id: "${case_id}", expected_onboarding_case_version: "${case_v}", base_salary_cents: 25000000, signing_bonus_cents: 2000000, guarantee_monthly_cents: 2000000, guarantee_term_months: 12, panel_capacity: 2000, proposed_start_date: "2027-06-01", expires_at: "2026-08-01T00:00:00Z" }, as: Recruiter, captures: { offer_id: "$.data.id" } }
            - { call: "POST /onboarding/offers/${offer_id}/extend", payload: {}, as: Recruiter }
            - { call: "POST /onboarding/offers/${offer_id}/accept", payload: {}, as: Physician, as_user_id: "${phys_id}" }
            - { call: "POST /onboarding/offers/${offer_id}/execute", payload: {}, as: ContractAdministrator }
            - { call: "POST /onboarding/credential-items", payload: { onboarding_case_id: "${case_id}", item_type: "STATE_LICENSE", expires_on: "2028-06-01", document_ref: "doc-lic" }, as: CredentialingSpecialist, captures: { lic: "$.data.id" } }
            - { call: "POST /onboarding/credential-items/${lic}/submit-docs", payload: {}, as: CredentialingSpecialist, as_user_id: "cs-1" }
            - { call: "POST /onboarding/credential-items/${lic}/verify", payload: {}, as: CredentialingSpecialist, as_user_id: "cs-2" }
            - { call: "POST /onboarding/credential-items/${lic}/file", payload: {}, as: CredentialingSpecialist, as_user_id: "cs-1" }
            - { call: "POST /onboarding/credential-items/${lic}/approve", payload: {}, as: OnboardingDirector }
            - { call: "POST /onboarding/credential-items", payload: { onboarding_case_id: "${case_id}", item_type: "DEA_REGISTRATION", expires_on: "2028-06-01", document_ref: "doc-dea" }, as: CredentialingSpecialist, captures: { dea: "$.data.id" } }
            - { call: "POST /onboarding/credential-items/${dea}/submit-docs", payload: {}, as: CredentialingSpecialist, as_user_id: "cs-1" }
            - { call: "POST /onboarding/credential-items/${dea}/verify", payload: {}, as: CredentialingSpecialist, as_user_id: "cs-2" }
            - { call: "POST /onboarding/credential-items/${dea}/file", payload: {}, as: CredentialingSpecialist, as_user_id: "cs-1" }
            - { call: "POST /onboarding/credential-items/${dea}/approve", payload: {}, as: OnboardingDirector }
            - { call: "POST /onboarding/credential-items", payload: { onboarding_case_id: "${case_id}", item_type: "PAYER_ENROLLMENT_MEDICARE", payer_code: "MCR", document_ref: "doc-mcr" }, as: CredentialingSpecialist, captures: { mcr: "$.data.id" } }
            - { call: "POST /onboarding/credential-items/${mcr}/submit-docs", payload: {}, as: CredentialingSpecialist, as_user_id: "cs-1" }
            - { call: "POST /onboarding/credential-items/${mcr}/verify", payload: {}, as: CredentialingSpecialist, as_user_id: "cs-2" }
            - { call: "POST /onboarding/credential-items/${mcr}/file", payload: {}, as: CredentialingSpecialist, as_user_id: "cs-1" }
            - { call: "POST /onboarding/credential-items/${mcr}/approve", payload: {}, as: OnboardingDirector }
            - { call: "GET /onboarding/training-plans?onboarding_case_id=${case_id}", payload: {}, as: PracticeManager, captures: { plan_id: "$.data[0].id" } }
            - { call: "GET /onboarding/training-modules?training_plan_id=${plan_id}&module_code=EHR_FUNDAMENTALS", payload: {}, as: PracticeManager, captures: { mod1: "$.data[0].id" } }
            - { call: "POST /onboarding/training-modules/${mod1}/schedule", payload: {}, as: PracticeManager }
