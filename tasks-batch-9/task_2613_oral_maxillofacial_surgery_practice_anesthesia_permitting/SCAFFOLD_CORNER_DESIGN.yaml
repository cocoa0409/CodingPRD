      - name: path_ids_are_resolved_before_the_body_is_checked
        claim_type: cascading_validation
        grounds:
          - validations[priority=3]
          - validations[priority=4]
          - errors[ERR_RESOURCE_NOT_FOUND]
        distinguishing_aspect: "Existence of the path anchor is checked before body shape: a request against an unknown caseId whose body is ALSO missing required fields must answer ERR_RESOURCE_NOT_FOUND (404), never ERR_INVALID_REQUEST (400), because priority 3 runs ahead of priority 4."
        test_recipe:
          setup:
            - "an empty system with only the logical clock set"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-11T10:00:00Z" }
              as: PracticeAdministrator
          trigger:
            - call: "POST /surgical-cases/00000000-0000-0000-0000-0000000000ff/pre-anesthesia-evaluations"
              payload: { asa_class_recorded: 2 }
              as: AnesthesiaCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404 with data.error_id == ERR_RESOURCE_NOT_FOUND"
            - "the response is NOT 400 ERR_INVALID_REQUEST even though evaluator_staff_id, airway_class_recorded and expected_case_version are all missing from the body"

