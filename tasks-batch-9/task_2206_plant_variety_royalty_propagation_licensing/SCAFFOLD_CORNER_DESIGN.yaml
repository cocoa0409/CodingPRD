              payload: {}
              as: LicensingOfficer
              as_user_id: "officer-2"
          assert:
            - "The accept RESPONSE BODY itself has review_status ACCEPTED, final_total_cents 3500, late_fee_cents 0, booked_amount_cents 3500 and accepted_by_user_id \"officer-2\""
            - "A subsequent GET /royalty-reports/${r_id} returns exactly the same field values"
            - "A subsequent GET /royalty-line-items/${l_id} shows billable_units 100, final_amount_cents 3500 and overrun_flagged false"
            - "A subsequent GET /propagators/${p_id} shows royalty_payable_cents 3500 - the ledger moved inside the accept call, not on a later sweep"
            - "No endpoint exists to flush or refresh derived state; the derived fields are always current"

