# =============================================================================
# §1.9 Scaffold Corner Design (breadth coverage of §1.1–§1.7 testable claims
# not already covered by §1.8). Walks references/claim-extraction-guide.md.
# =============================================================================
scaffold_corner_design:

  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: complaint_create_computed_priority_p3
        claim_type: Computed Fields
        grounds: [calculations.complaint_priority_score, entities.Complaint.fields.priority]
        distinguishing_aspect: "A CAT/STRAY complaint scores 15*1.0 = 15.00 -> priority P3 (below the P2 threshold of 30)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /dispatch/complaints"
              payload: { reporter_name: "Q1", reporter_phone: "555-3001", zone: "EAST", animal_type: "CAT", complaint_type: "STRAY" }
              as: Dispatcher
              captures: { cid: $.data.id, sev: $.data.severity_score }
          assert:
            - "${sev} == 15.00"
            - "Complaint.${cid}.priority == P3"

      - name: complaint_default_vulnerable_false
        claim_type: Defaults
        grounds: [entities.Complaint.fields.involves_vulnerable_victim]
        distinguishing_aspect: "Omitting involves_vulnerable_victim defaults it to false and applies no +15 bonus."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /dispatch/complaints"
              payload: { reporter_name: "Q2", reporter_phone: "555-3002", zone: "EAST", animal_type: "DOG", complaint_type: "STRAY" }
              as: Dispatcher
              captures: { cid: $.data.id, vv: $.data.involves_vulnerable_victim, sev: $.data.severity_score }
          assert:
            - "${vv} == false"
            - "${sev} == 18.00"

      - name: officer_system_fields_generated
        claim_type: System Fields
        grounds: [entities.Officer.fields.active_dispatch_count]
        distinguishing_aspect: "A newly created Officer has server-minted id/created_at and active_dispatch_count defaulting to 0."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /dispatch/officers"
              payload: { name: "Sys Ofc", badge_number: "SB1", territory_zone: "WEST", shift_start_at: "2026-03-01T00:00:00Z", shift_end_at: "2026-03-02T00:00:00Z" }
              as: Supervisor
              captures: { oid: $.data.id, adc: $.data.active_dispatch_count }
          assert:
            - "${adc} == 0"
            - "Officer.${oid}.id is a server-minted UUID with no type prefix"

      - name: investigation_note_immutable_no_version
        claim_type: Immutability
        grounds: [entities.InvestigationNote.fields.body]
        distinguishing_aspect: "InvestigationNote is common_fields:false — its create response carries id and created_at but no version/updated_at, and there is no update endpoint."
        test_recipe:
          setup: ["A case exists to attach a note to."]
          setup_api_calls:
            - call: "POST /dispatch/complaints"
              payload: { reporter_name: "N1", reporter_phone: "555-3003", zone: "EAST", animal_type: "DOG", complaint_type: "CRUELTY" }
              as: Dispatcher
              captures: { cx: $.data.id }
            - call: "POST /dispatch/officers"
              payload: { name: "Note Ofc", badge_number: "NB1", territory_zone: "EAST", shift_start_at: "2026-03-01T00:00:00Z", shift_end_at: "2026-03-02T00:00:00Z" }
              as: Supervisor
              captures: { off: $.data.id }
            - call: "POST /dispatch/cases"
              payload: { complaint_id: "${cx}", assigned_officer_id: "${off}", case_type: "CRUELTY" }
              as: Supervisor
              captures: { ca: $.data.id }
          trigger:
            - call: "POST /dispatch/cases/${ca}/notes"
              payload: { note_type: "OBSERVATION", body: "Animal appears healthy." }
              as: Supervisor
              captures: { nid: $.data.id }
          assert:
            - "InvestigationNote.${nid}.case_id == ${ca}"
            - "the create response includes id and created_at but no version and no updated_at"

      - name: complaint_missing_required_complaint_type_rejected
        claim_type: Required Fields
        grounds: ["errors[ERR_INVALID_REQUEST]", entities.Complaint.fields.complaint_type]
        distinguishing_aspect: "Omitting the required complaint_type field yields ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /dispatch/complaints"
              payload: { reporter_name: "Bad", reporter_phone: "555-3004", zone: "EAST", animal_type: "DOG" }
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_REQUEST"

      - name: complaint_invalid_enum_zone_rejected
        claim_type: Type Constraints
        grounds: ["errors[ERR_INVALID_REQUEST]", entities.Complaint.fields.zone]
        distinguishing_aspect: "A zone value outside {NORTH,SOUTH,EAST,WEST,CENTRAL} yields ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /dispatch/complaints"
              payload: { reporter_name: "Bad2", reporter_phone: "555-3005", zone: "MARS", animal_type: "DOG", complaint_type: "STRAY" }
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_REQUEST"

      - name: complaint_not_found_returns_404
        claim_type: Not Found
        grounds: ["errors[ERR_COMPLAINT_NOT_FOUND]"]
        distinguishing_aspect: "GET on a non-existent complaint id returns ERR_COMPLAINT_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /dispatch/complaints/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_COMPLAINT_NOT_FOUND"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: dispatch_initial_state_is_pending
        claim_type: Initial State
        grounds: [state_machines.Dispatch.initial_state]
        distinguishing_aspect: "A freshly created Dispatch starts in PENDING."
        test_recipe:
          setup: ["An on-duty officer and a NEW complaint exist."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: Supervisor
            - call: "POST /dispatch/complaints"
              payload: { reporter_name: "IS1", reporter_phone: "555-3101", zone: "NORTH", animal_type: "DOG", complaint_type: "STRAY" }
              as: Dispatcher
              captures: { cx: $.data.id }
            - call: "POST /dispatch/officers"
              payload: { name: "IS Ofc", badge_number: "ISB1", territory_zone: "NORTH", shift_start_at: "2026-03-01T00:00:00Z", shift_end_at: "2026-03-02T00:00:00Z" }
              as: Supervisor
              captures: { off: $.data.id }
          trigger:
            - call: "POST /dispatch/dispatches"
              payload: { complaint_id: "${cx}", officer_id: "${off}", scheduled_start_at: "2026-03-01T09:00:00Z", scheduled_end_at: "2026-03-01T10:00:00Z" }
              as: Dispatcher
              captures: { st: $.data.status }
          assert:
            - "${st} == PENDING"

      - name: clear_dispatch_cascades_complaint_to_resolved
        claim_type: Cross-entity
        grounds: [state_machines.Dispatch.EN_ROUTE_to_CLEARED, state_machines.Complaint.DISPATCHED_to_RESOLVED]
        distinguishing_aspect: "Clearing an EN_ROUTE dispatch transitions its linked Complaint DISPATCHED -> RESOLVED and decrements the officer's active_dispatch_count."
        test_recipe:
          setup: ["An officer has accepted a dispatch on a complaint (complaint is DISPATCHED, dispatch EN_ROUTE)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: Supervisor
            - call: "POST /dispatch/complaints"
              payload: { reporter_name: "CC1", reporter_phone: "555-3102", zone: "NORTH", animal_type: "DOG", complaint_type: "STRAY" }
              as: Dispatcher
              captures: { cx: $.data.id }
            - call: "POST /dispatch/officers"
              payload: { name: "CC Ofc", badge_number: "CCB1", territory_zone: "NORTH", shift_start_at: "2026-03-01T00:00:00Z", shift_end_at: "2026-03-02T00:00:00Z" }
              as: Supervisor
              captures: { off: $.data.id }
            - call: "POST /dispatch/dispatches"
              payload: { complaint_id: "${cx}", officer_id: "${off}", scheduled_start_at: "2026-03-01T09:00:00Z", scheduled_end_at: "2026-03-01T10:00:00Z" }
              as: Dispatcher
              captures: { d: $.data.id }
            - call: "POST /dispatch/dispatches/${d}/accept"
              payload: {}
              as: FieldOfficer
              as_user_id: "${off}"
          trigger:
            - call: "POST /dispatch/dispatches/${d}/clear"
              payload: { field_outcome: "RESOLVED_ON_SCENE" }
              as: FieldOfficer
              as_user_id: "${off}"
          assert:
            - "Dispatch.${d}.status == CLEARED"
            - "Complaint.${cx}.status == RESOLVED"
            - "Officer.${off}.active_dispatch_count == 0"

      - name: accept_cleared_dispatch_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: ["errors[ERR_INVALID_STATE]", state_machines.Dispatch.EN_ROUTE_to_CLEARED]
        distinguishing_aspect: "Accepting a dispatch already in CLEARED yields ERR_INVALID_STATE."
        test_recipe:
          setup: ["A dispatch has been accepted and cleared (terminal CLEARED)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: Supervisor
            - call: "POST /dispatch/complaints"
              payload: { reporter_name: "IV1", reporter_phone: "555-3103", zone: "NORTH", animal_type: "DOG", complaint_type: "STRAY" }
              as: Dispatcher
              captures: { cx: $.data.id }
            - call: "POST /dispatch/officers"
              payload: { name: "IV Ofc", badge_number: "IVB1", territory_zone: "NORTH", shift_start_at: "2026-03-01T00:00:00Z", shift_end_at: "2026-03-02T00:00:00Z" }
              as: Supervisor
              captures: { off: $.data.id }
            - call: "POST /dispatch/dispatches"
              payload: { complaint_id: "${cx}", officer_id: "${off}", scheduled_start_at: "2026-03-01T09:00:00Z", scheduled_end_at: "2026-03-01T10:00:00Z" }
              as: Dispatcher
              captures: { d: $.data.id }
            - call: "POST /dispatch/dispatches/${d}/accept"
              payload: {}
              as: FieldOfficer
              as_user_id: "${off}"
            - call: "POST /dispatch/dispatches/${d}/clear"
              payload: { field_outcome: "RESOLVED_ON_SCENE" }
              as: FieldOfficer
              as_user_id: "${off}"
          trigger:
            - call: "POST /dispatch/dispatches/${d}/accept"
              payload: {}
              as: FieldOfficer
              as_user_id: "${off}"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_STATE"

      - name: close_open_case_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: ["errors[ERR_INVALID_STATE]", state_machines.Case.SUBSTANTIATED_to_CLOSED]
        distinguishing_aspect: "Closing a case that is still OPEN (not resolved) yields ERR_INVALID_STATE."
        test_recipe:
          setup: ["A case exists in OPEN state."]
          setup_api_calls:
            - call: "POST /dispatch/complaints"
              payload: { reporter_name: "OC1", reporter_phone: "555-3104", zone: "NORTH", animal_type: "DOG", complaint_type: "STRAY" }
              as: Dispatcher
              captures: { cx: $.data.id }
            - call: "POST /dispatch/officers"
              payload: { name: "OC Ofc", badge_number: "OCB1", territory_zone: "NORTH", shift_start_at: "2026-03-01T00:00:00Z", shift_end_at: "2026-03-02T00:00:00Z" }
              as: Supervisor
              captures: { off: $.data.id }
            - call: "POST /dispatch/cases"
              payload: { complaint_id: "${cx}", assigned_officer_id: "${off}", case_type: "STRAY" }
              as: Supervisor
              captures: { ca: $.data.id }
          trigger:
            - call: "POST /dispatch/cases/${ca}/close"
              payload: {}
              as: Supervisor
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_STATE"

      - name: pay_citation_twice_returns_already_resolved
        claim_type: Idempotency
        grounds: ["errors[ERR_CITATION_ALREADY_RESOLVED]", state_machines.Citation.ISSUED_to_PAID]
        distinguishing_aspect: "Paying an already-PAID citation a second time yields ERR_CITATION_ALREADY_RESOLVED."
        test_recipe:
          setup: ["A citation has been issued and paid once."]
          setup_api_calls:
            - call: "POST /dispatch/complaints"
              payload: { reporter_name: "PC1", reporter_phone: "555-3105", zone: "NORTH", animal_type: "DOG", complaint_type: "STRAY" }
              as: Dispatcher
              captures: { cx: $.data.id }
            - call: "POST /dispatch/officers"
              payload: { name: "PC Ofc", badge_number: "PCB1", territory_zone: "NORTH", shift_start_at: "2026-03-01T00:00:00Z", shift_end_at: "2026-03-02T00:00:00Z" }
              as: Supervisor
              captures: { off: $.data.id }
            - call: "POST /dispatch/cases"
              payload: { complaint_id: "${cx}", assigned_officer_id: "${off}", case_type: "STRAY" }
              as: Supervisor
              captures: { ca: $.data.id }
            - call: "POST /dispatch/cases/${ca}/investigate"
              payload: {}
              as: Supervisor
            - call: "POST /dispatch/citations"
              payload: { case_id: "${ca}", violation_code: "UNLICENSED", issued_to_name: "PC Owner", issued_to_ref: "OWNER-PC" }
              as: Supervisor
              captures: { cit: $.data.id }
            - call: "POST /dispatch/citations/${cit}/pay"
              payload: {}
              as: Dispatcher
          trigger:
            - call: "POST /dispatch/citations/${cit}/pay"
              payload: {}
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_CITATION_ALREADY_RESOLVED"

      - name: escalate_cascade_depth3_full_chain
        claim_type: Cross-entity
        grounds: [state_machines.QuarantineHold.ACTIVE_to_ESCALATED]
        excluded_because:
          difficulty_instance: transitive_cascade / escalate_hold_impound_rabies_case_depth3
          rationale: "The full QuarantineHold -> Impound -> RabiesReport -> Case escalation cascade is asserted end-to-end by the named §1.8 instance."

  # ---------------------------------------------------------------------------
  - section: calculations
    instances:
      - name: summary_empty_db_returns_zeros
        claim_type: Correct Result
        grounds: [calculations.dispatch_dashboard_summary]
        distinguishing_aspect: "On an empty DB the summary returns integer zeros for counts and 0.00 for total_outstanding_fines (empty-aggregate boundary)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /dispatch/reports/summary"
              payload: {}
              as: Supervisor
          assert:
            - "response data.total_complaints == 0"
            - "response data.open_cases == 0"
            - "response data.active_quarantine_holds == 0"
            - "response data.total_outstanding_fines == 0.00"

      - name: citation_fine_leash_first_offense_constant
        claim_type: Constants Applied
        grounds: [calculations.citation_fine, entities.Citation.fields.fine_amount]
        distinguishing_aspect: "A first-offense LEASH citation applies VIOLATION_FINE[LEASH]=75 with multiplier 1.0 -> fine_amount 75.00."
        test_recipe:
          setup: ["A stray case is UNDER_INVESTIGATION with no prior citations for the owner ref."]
          setup_api_calls:
            - call: "POST /dispatch/complaints"
              payload: { reporter_name: "LF1", reporter_phone: "555-3106", zone: "NORTH", animal_type: "DOG", complaint_type: "STRAY" }
              as: Dispatcher
              captures: { cx: $.data.id }
            - call: "POST /dispatch/officers"
              payload: { name: "LF Ofc", badge_number: "LFB1", territory_zone: "NORTH", shift_start_at: "2026-03-01T00:00:00Z", shift_end_at: "2026-03-02T00:00:00Z" }
              as: Supervisor
              captures: { off: $.data.id }
            - call: "POST /dispatch/cases"
              payload: { complaint_id: "${cx}", assigned_officer_id: "${off}", case_type: "STRAY" }
              as: Supervisor
              captures: { ca: $.data.id }
            - call: "POST /dispatch/cases/${ca}/investigate"
              payload: {}
              as: Supervisor
          trigger:
            - call: "POST /dispatch/citations"
              payload: { case_id: "${ca}", violation_code: "LEASH", issued_to_name: "LF Owner", issued_to_ref: "OWNER-LF" }
              as: Supervisor
              captures: { f: $.data.fine_amount }
          assert:
            - "${f} == 75.00"

  # ---------------------------------------------------------------------------
  - section: validations
    instances:
      - name: officer_capacity_exceeded_on_second_dispatch
        claim_type: Aggregate validation
        grounds: ["validations[priority=9]", "errors[ERR_OFFICER_CAPACITY_EXCEEDED]"]
        distinguishing_aspect: "With max_daily_dispatches=1 and one active dispatch, a second (non-overlapping) dispatch to the same officer yields ERR_OFFICER_CAPACITY_EXCEEDED."
        test_recipe:
          setup: ["Officer capped at 1 daily dispatch already has a PENDING dispatch on complaint1 (window 09:00-10:00)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: Supervisor
            - call: "POST /dispatch/complaints"
              payload: { reporter_name: "CE1", reporter_phone: "555-3201", zone: "NORTH", animal_type: "DOG", complaint_type: "STRAY" }
              as: Dispatcher
              captures: { cx1: $.data.id }
            - call: "POST /dispatch/complaints"
              payload: { reporter_name: "CE2", reporter_phone: "555-3202", zone: "NORTH", animal_type: "DOG", complaint_type: "STRAY" }
              as: Dispatcher
              captures: { cx2: $.data.id }
            - call: "POST /dispatch/officers"
              payload: { name: "Cap Ofc", badge_number: "CAPB1", territory_zone: "NORTH", shift_start_at: "2026-03-01T00:00:00Z", shift_end_at: "2026-03-02T00:00:00Z", max_daily_dispatches: 1 }
              as: Supervisor
              captures: { off: $.data.id }
            - call: "POST /dispatch/dispatches"
              payload: { complaint_id: "${cx1}", officer_id: "${off}", scheduled_start_at: "2026-03-01T09:00:00Z", scheduled_end_at: "2026-03-01T10:00:00Z" }
              as: Dispatcher
              captures: { d1: $.data.id }
          trigger:
            - call: "POST /dispatch/dispatches"
              payload: { complaint_id: "${cx2}", officer_id: "${off}", scheduled_start_at: "2026-03-01T12:00:00Z", scheduled_end_at: "2026-03-01T13:00:00Z" }
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_OFFICER_CAPACITY_EXCEEDED"

      - name: quarantine_on_stray_case_not_eligible
        claim_type: Cross-entity validation
        grounds: ["validations[priority=6]", "errors[ERR_CASE_TYPE_NOT_ELIGIBLE]"]
        distinguishing_aspect: "Placing a quarantine hold on a STRAY case (case_type not BITE/DANGEROUS_DOG) yields ERR_CASE_TYPE_NOT_ELIGIBLE."
        test_recipe:
          setup: ["A STRAY case is UNDER_INVESTIGATION."]
          setup_api_calls:
            - call: "POST /dispatch/complaints"
              payload: { reporter_name: "QE1", reporter_phone: "555-3203", zone: "NORTH", animal_type: "DOG", complaint_type: "STRAY" }
              as: Dispatcher
              captures: { cx: $.data.id }
            - call: "POST /dispatch/officers"
              payload: { name: "QE Ofc", badge_number: "QEB1", territory_zone: "NORTH", shift_start_at: "2026-03-01T00:00:00Z", shift_end_at: "2026-03-02T00:00:00Z" }
              as: Supervisor
              captures: { off: $.data.id }
            - call: "POST /dispatch/cases"
              payload: { complaint_id: "${cx}", assigned_officer_id: "${off}", case_type: "STRAY" }
              as: Supervisor
              captures: { ca: $.data.id }
            - call: "POST /dispatch/cases/${ca}/investigate"
              payload: {}
              as: Supervisor
          trigger:
            - call: "POST /dispatch/quarantine-holds"
              payload: { case_id: "${ca}", hold_type: "HOME_QUARANTINE", start_at: "2026-03-01T00:00:00Z" }
              as: Supervisor
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_CASE_TYPE_NOT_ELIGIBLE"

      - name: quarantine_release_before_due_rejected
        claim_type: Temporal validation
        grounds: ["validations[priority=7]", "errors[ERR_QUARANTINE_NOT_ELAPSED]"]
        distinguishing_aspect: "Releasing a bite hold one day before release_due_at (clock 2026-03-10 vs due 2026-03-11) yields ERR_QUARANTINE_NOT_ELAPSED (the reject side of the inclusive boundary)."
        test_recipe:
          setup: ["A bite case has an ACTIVE hold started 2026-03-01 (due 2026-03-11); clock is 2026-03-10."]
          setup_api_calls:
            - call: "POST /dispatch/complaints"
              payload: { reporter_name: "QR1", reporter_phone: "555-3204", zone: "NORTH", animal_type: "DOG", complaint_type: "BITE" }
              as: Dispatcher
              captures: { cx: $.data.id }
            - call: "POST /dispatch/officers"
              payload: { name: "QR Ofc", badge_number: "QRB1", territory_zone: "NORTH", shift_start_at: "2026-03-01T00:00:00Z", shift_end_at: "2026-03-02T00:00:00Z" }
              as: Supervisor
              captures: { off: $.data.id }
            - call: "POST /dispatch/cases"
              payload: { complaint_id: "${cx}", assigned_officer_id: "${off}", case_type: "BITE" }
              as: Supervisor
              captures: { ca: $.data.id }
            - call: "POST /dispatch/cases/${ca}/investigate"
              payload: {}
              as: Supervisor
            - call: "POST /dispatch/quarantine-holds"
              payload: { case_id: "${ca}", hold_type: "HOME_QUARANTINE", start_at: "2026-03-01T00:00:00Z" }
              as: Supervisor
              captures: { qh: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-10T00:00:00Z" }
              as: Supervisor
          trigger:
            - call: "POST /dispatch/quarantine-holds/${qh}/release"
              payload: {}
              as: Supervisor
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_QUARANTINE_NOT_ELAPSED"

  # ---------------------------------------------------------------------------
  - section: endpoints
    instances:
      - name: list_dispatches_filtered_by_officer
        claim_type: Listing
        grounds: [endpoints, entities.Dispatch.fields.officer_id]
        distinguishing_aspect: "GET /dispatch/dispatches?officer_id=... returns exactly the two dispatches created for that officer, with total_count 2."
        test_recipe:
          setup: ["An officer has two PENDING dispatches on two complaints with non-overlapping windows."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: Supervisor
            - call: "POST /dispatch/complaints"
              payload: { reporter_name: "LD1", reporter_phone: "555-3301", zone: "NORTH", animal_type: "DOG", complaint_type: "STRAY" }
              as: Dispatcher
              captures: { cx1: $.data.id }
            - call: "POST /dispatch/complaints"
              payload: { reporter_name: "LD2", reporter_phone: "555-3302", zone: "NORTH", animal_type: "DOG", complaint_type: "STRAY" }
              as: Dispatcher
              captures: { cx2: $.data.id }
            - call: "POST /dispatch/officers"
              payload: { name: "LD Ofc", badge_number: "LDB1", territory_zone: "NORTH", shift_start_at: "2026-03-01T00:00:00Z", shift_end_at: "2026-03-02T00:00:00Z" }
              as: Supervisor
              captures: { off: $.data.id }
            - call: "POST /dispatch/dispatches"
              payload: { complaint_id: "${cx1}", officer_id: "${off}", scheduled_start_at: "2026-03-01T09:00:00Z", scheduled_end_at: "2026-03-01T10:00:00Z" }
              as: Dispatcher
            - call: "POST /dispatch/dispatches"
              payload: { complaint_id: "${cx2}", officer_id: "${off}", scheduled_start_at: "2026-03-01T11:00:00Z", scheduled_end_at: "2026-03-01T12:00:00Z" }
              as: Dispatcher
          trigger:
            - call: "GET /dispatch/dispatches"
              payload: { officer_id: "${off}" }
              as: Dispatcher
          assert:
            - "response total_count == 2"
            - "every element has officer_id == ${off}"

      - name: cases_list_pagination_defaults
        claim_type: Listing
        grounds: [endpoints, response_envelope.pagination_defaults]
        distinguishing_aspect: "GET /dispatch/cases with no pagination params applies limit 10, offset 0, and reports total_count with has_more=false for two cases."
        test_recipe:
          setup: ["Two cases exist across two complaints."]
          setup_api_calls:
            - call: "POST /dispatch/complaints"
              payload: { reporter_name: "PG1", reporter_phone: "555-3303", zone: "NORTH", animal_type: "DOG", complaint_type: "STRAY" }
              as: Dispatcher
              captures: { cx1: $.data.id }
            - call: "POST /dispatch/complaints"
              payload: { reporter_name: "PG2", reporter_phone: "555-3304", zone: "NORTH", animal_type: "DOG", complaint_type: "STRAY" }
              as: Dispatcher
              captures: { cx2: $.data.id }
            - call: "POST /dispatch/officers"
              payload: { name: "PG Ofc", badge_number: "PGB1", territory_zone: "NORTH", shift_start_at: "2026-03-01T00:00:00Z", shift_end_at: "2026-03-02T00:00:00Z" }
              as: Supervisor
              captures: { off: $.data.id }
            - call: "POST /dispatch/cases"
              payload: { complaint_id: "${cx1}", assigned_officer_id: "${off}", case_type: "STRAY" }
              as: Supervisor
            - call: "POST /dispatch/cases"
              payload: { complaint_id: "${cx2}", assigned_officer_id: "${off}", case_type: "CRUELTY" }
              as: Supervisor
          trigger:
            - call: "GET /dispatch/cases"
              payload: {}
              as: Dispatcher
          assert:
            - "response total_count == 2"
            - "response has_more == false"
            - "response array length == 2 (default limit 10 not exceeded)"

  # ---------------------------------------------------------------------------
  - section: errors
    instances:
      - name: impound_release_not_found
        claim_type: Not Found
        grounds: ["errors[ERR_IMPOUND_NOT_FOUND]"]
        distinguishing_aspect: "Releasing a non-existent impound id yields ERR_IMPOUND_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /dispatch/impounds/00000000-0000-0000-0000-000000000000/release"
              payload: { disposition: "REDEEMED" }
              as: Supervisor
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_IMPOUND_NOT_FOUND"

      - name: error_active_quarantine_hold_on_close
        claim_type: Violation → Error
        grounds: ["errors[ERR_ACTIVE_QUARANTINE_HOLD]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / safety_beats_fiscal_on_case_close
          rationale: "ERR_ACTIVE_QUARANTINE_HOLD is the winning error asserted by the named §1.8 priority-conflict instance."

      - name: error_complaint_not_dispatchable
        claim_type: Violation → Error
        grounds: ["errors[ERR_COMPLAINT_NOT_DISPATCHABLE]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / referential_beats_temporal_on_dispatch_create
          rationale: "ERR_COMPLAINT_NOT_DISPATCHABLE is the winning error asserted by the named §1.8 instance."

      - name: error_officer_off_duty
        claim_type: Violation → Error
        grounds: ["errors[ERR_OFFICER_OFF_DUTY]"]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / dispatch_blocked_by_officer_off_duty
          rationale: "ERR_OFFICER_OFF_DUTY is asserted directly by the named §1.8 instance."

      - name: error_officer_schedule_conflict
        claim_type: Violation → Error
        grounds: ["errors[ERR_OFFICER_SCHEDULE_CONFLICT]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / officer_dispatch_buffer_conflict
          rationale: "ERR_OFFICER_SCHEDULE_CONFLICT is asserted directly by the named §1.8 instance."

      - name: error_outstanding_citations_on_close
        claim_type: Violation → Error
        grounds: ["errors[ERR_OUTSTANDING_CITATIONS]"]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / case_close_blocked_by_issued_citation
          rationale: "ERR_OUTSTANDING_CITATIONS is asserted directly by the named §1.8 instance."

  # ---------------------------------------------------------------------------
  - section: rbac
    instances:
      - name: dispatcher_cannot_create_officer
        claim_type: RBAC denial
        grounds: [roles, "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "A Dispatcher calling POST /dispatch/officers (a Supervisor-exclusive op) is denied with ERR_UNAUTHORIZED."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /dispatch/officers"
              payload: { name: "X", badge_number: "XB", territory_zone: "NORTH", shift_start_at: "2026-03-01T00:00:00Z", shift_end_at: "2026-03-02T00:00:00Z" }
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_UNAUTHORIZED"

      - name: fieldofficer_cannot_close_case
        claim_type: RBAC denial
        grounds: [roles, "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "A FieldOfficer calling POST /dispatch/cases/{id}/close (Supervisor-exclusive) is denied with ERR_UNAUTHORIZED."
        test_recipe:
          setup: ["A case exists; a field officer identity is available."]
          setup_api_calls:
            - call: "POST /dispatch/complaints"
              payload: { reporter_name: "RB1", reporter_phone: "555-3401", zone: "NORTH", animal_type: "DOG", complaint_type: "STRAY" }
              as: Dispatcher
              captures: { cx: $.data.id }
            - call: "POST /dispatch/officers"
              payload: { name: "RB Ofc", badge_number: "RBB1", territory_zone: "NORTH", shift_start_at: "2026-03-01T00:00:00Z", shift_end_at: "2026-03-02T00:00:00Z" }
              as: Supervisor
              captures: { off: $.data.id }
            - call: "POST /dispatch/cases"
              payload: { complaint_id: "${cx}", assigned_officer_id: "${off}", case_type: "STRAY" }
              as: Supervisor
              captures: { ca: $.data.id }
          trigger:
            - call: "POST /dispatch/cases/${ca}/close"
              payload: {}
              as: FieldOfficer
              as_user_id: "${off}"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_UNAUTHORIZED"

      - name: accept_dispatch_by_unassigned_officer_rejected
        claim_type: RBAC denial
        grounds: [roles, "errors[ERR_NOT_ASSIGNED_OFFICER]", state_machines.Dispatch.PENDING_to_EN_ROUTE]
        distinguishing_aspect: "A FieldOfficer whose X-User-ID differs from Dispatch.officer_id cannot accept the dispatch: ERR_NOT_ASSIGNED_OFFICER (ownership check on entity_backed:Officer)."
        test_recipe:
          setup: ["Two officers exist; a PENDING dispatch is assigned to officer A. Officer B attempts to accept it."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: Supervisor
            - call: "POST /dispatch/complaints"
              payload: { reporter_name: "OW1", reporter_phone: "555-3402", zone: "NORTH", animal_type: "DOG", complaint_type: "STRAY" }
              as: Dispatcher
              captures: { cx: $.data.id }
            - call: "POST /dispatch/officers"
              payload: { name: "Ofc A2", badge_number: "AB2", territory_zone: "NORTH", shift_start_at: "2026-03-01T00:00:00Z", shift_end_at: "2026-03-02T00:00:00Z" }
              as: Supervisor
              captures: { offA: $.data.id }
            - call: "POST /dispatch/officers"
              payload: { name: "Ofc B2", badge_number: "BB2", territory_zone: "NORTH", shift_start_at: "2026-03-01T00:00:00Z", shift_end_at: "2026-03-02T00:00:00Z" }
              as: Supervisor
              captures: { offB: $.data.id }
            - call: "POST /dispatch/dispatches"
              payload: { complaint_id: "${cx}", officer_id: "${offA}", scheduled_start_at: "2026-03-01T09:00:00Z", scheduled_end_at: "2026-03-01T10:00:00Z" }
              as: Dispatcher
              captures: { d: $.data.id }
          trigger:
            - call: "POST /dispatch/dispatches/${d}/accept"
              payload: {}
              as: FieldOfficer
              as_user_id: "${offB}"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_NOT_ASSIGNED_OFFICER"

  # ---------------------------------------------------------------------------
  - section: cross_cutting
    instances:
      - name: impound_create_stale_case_version_conflict
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[impound-create-stale-case]", "errors[ERR_STALE_CASE_VERSION]"]
        distinguishing_aspect: "After impound1 bumps Case.version, a second impound (different kennel) carrying the pre-impound1 expected_case_version is rejected with ERR_STALE_CASE_VERSION (412), while the kennel-overlap check is bypassed by using a different kennel."
        test_recipe:
          setup: ["A bite case is UNDER_INVESTIGATION (version captured as cav). Impound1 lands in kennel1, advancing Case.version."]
          setup_api_calls:
            - call: "POST /dispatch/complaints"
              payload: { reporter_name: "SV1", reporter_phone: "555-3501", zone: "NORTH", animal_type: "DOG", complaint_type: "BITE" }
              as: Dispatcher
              captures: { cx: $.data.id }
            - call: "POST /dispatch/officers"
              payload: { name: "SV Ofc", badge_number: "SVB1", territory_zone: "NORTH", shift_start_at: "2026-03-01T00:00:00Z", shift_end_at: "2026-03-02T00:00:00Z" }
              as: Supervisor
              captures: { off: $.data.id }
            - call: "POST /dispatch/kennels"
              payload: { code: "K-A", facility_zone: "NORTH" }
              as: Supervisor
              captures: { ken1: $.data.id }
            - call: "POST /dispatch/kennels"
              payload: { code: "K-B", facility_zone: "NORTH" }
              as: Supervisor
              captures: { ken2: $.data.id }
            - call: "POST /dispatch/cases"
              payload: { complaint_id: "${cx}", assigned_officer_id: "${off}", case_type: "BITE" }
              as: Supervisor
              captures: { ca: $.data.id }
            - call: "POST /dispatch/cases/${ca}/investigate"
              payload: {}
              as: Supervisor
              captures: { cav: $.data.version }
            - call: "POST /dispatch/impounds"
              payload: { case_id: "${ca}", kennel_id: "${ken1}", impounded_at: "2026-03-01T00:00:00Z", hold_until: "2026-03-05T00:00:00Z", expected_case_version: "${cav}" }
              as: Supervisor
              captures: { imp1: $.data.id }
          trigger:
            - call: "POST /dispatch/impounds"
              payload: { case_id: "${ca}", kennel_id: "${ken2}", impounded_at: "2026-03-01T00:00:00Z", hold_until: "2026-03-05T00:00:00Z", expected_case_version: "${cav}" }
              as: Supervisor
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_STALE_CASE_VERSION"

      - name: kennel_occupied_reflects_impound_immediately
        claim_type: derived_field_reconciliation
        grounds: [entities.Kennel.fields.occupied_slots]
        excluded_because:
          difficulty_instance: compensating_invariant / kennel_occupied_slots_conserved
          rationale: "Immediate reconciliation of Kennel.occupied_slots on impound create/release is asserted (occ1==1 then 0) by the named §1.8 instance."

  # ---------------------------------------------------------------------------
  - section: consistency_model
    instances:
      - name: citation_issue_updates_case_ledger_same_request
        claim_type: immediate
        grounds: [entities.Case.fields.outstanding_fines_total]
        excluded_because:
          difficulty_instance: compensating_invariant / case_outstanding_fines_conserved
          rationale: "Immediate update of Case.outstanding_fines_total on citation issue/pay is asserted by the named §1.8 instance."
