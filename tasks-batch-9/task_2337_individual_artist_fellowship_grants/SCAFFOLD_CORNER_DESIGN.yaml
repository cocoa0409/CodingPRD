      - name: eligible_application_count_reconciles_across_every_source_change
        claim_type: derived_field_reconciliation
        grounds:
          - entities.DisciplineCategory.fields.eligible_application_count
          - endpoints[POST /grants/appeals/{appeal_id}/decide]
        distinguishing_aspect: |
          The counter must track its source rows in all three directions: 0 before
          any determination, 1 and then 2 as ELIGIBLE determinations land, still 2
          when a third application is determined INELIGIBLE, and 3 once an upheld
          ELIGIBILITY_DETERMINATION_ERROR appeal reinstates that application. An
          implementation that counts on read from the wrong predicate, or that
          forgets the appeal-remedy increment, diverges at the last step.
        test_recipe:
