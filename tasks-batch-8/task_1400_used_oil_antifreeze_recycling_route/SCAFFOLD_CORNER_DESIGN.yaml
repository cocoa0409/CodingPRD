# =============================================================================
# SCAFFOLD_CORNER_DESIGN — §1.9 Coverage Index for Non-Difficulty Tests
# Used-Oil & Antifreeze Recycling Route
#
# Enumerative breadth coverage of every §1.1-§1.7 claim NOT already covered
# by §1.8. Organized by the claim-extraction-guide's nine sections.
# =============================================================================

scaffold_corner_design:

  # ==========================================================================
  # Section 1: Entities — creation, retrieval, defaults, computed fields
  # ==========================================================================
  - section: entities
    instances:
      - name: customer_create_required_fields_and_defaults
        claim_type: creation_and_defaults
        grounds:
          - entities.Customer
        distinguishing_aspect: "POST with all required input fields creates Customer in PROSPECT with prepaid_balance_cents=0, outstanding_charge_cents=0, halogen_violation_count=0; system fields id/created_at/version stamped."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /recycle-routes/customers", payload: { legal_name: "NewCo", epa_generator_id: "EPAGEN000100", market_zone: "COASTAL", credit_terms: "NET30" }, as: RoutePlanner, captures: { cid: "$.data.id", st: "$.data.status", bal: "$.data.prepaid_balance_cents", ver: "$.data.version" } }
          assert:
            - "Customer.${cid}.status == PROSPECT (initial_state)"
            - "Customer.${cid}.prepaid_balance_cents == 0 (default)"
            - "Customer.${cid}.outstanding_charge_cents == 0 (default)"
            - "Customer.${cid}.halogen_violation_count == 0 (default)"
            - "Customer.${cid}.version == 1 (common_fields)"
            - "Customer.${cid}.id is a UUID; created_at is ISO 8601 with three fractional digits"

      - name: customer_get_by_id_returns_stored_data
        claim_type: retrieval
        grounds:
          - entities.Customer
        distinguishing_aspect: "GET /customers/{id} returns the same Customer with all input fields preserved."
        test_recipe:
          setup: ["Customer created"]
          setup_api_calls:
            - { call: "POST /recycle-routes/customers", payload: { legal_name: "Fetch Me", epa_generator_id: "EPAGEN000101", market_zone: "SOUTH", credit_terms: "CHARGE_ONLY" }, as: RoutePlanner, captures: { cid: "$.data.id" } }
          trigger:
            - { call: "GET /recycle-routes/customers/${cid}", payload: {}, as: RoutePlanner, captures: { name: "$.data.legal_name", zone: "$.data.market_zone", terms: "$.data.credit_terms" } }
          assert:
            - "Customer.${cid}.legal_name == 'Fetch Me'"
            - "Customer.${cid}.market_zone == SOUTH"
            - "Customer.${cid}.credit_terms == CHARGE_ONLY"

      - name: customer_get_nonexistent_returns_404
        claim_type: not_found
        grounds:
          - entities.Customer
          - errors[ERR_CUSTOMER_NOT_FOUND]
        distinguishing_aspect: "GET /customers/{uuid-with-no-row} returns 404 ERR_CUSTOMER_NOT_FOUND."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /recycle-routes/customers/00000000-0000-0000-0000-000000000000", payload: {}, as: RoutePlanner, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_CUSTOMER_NOT_FOUND"
            - "HTTP status == 404"

      - name: customer_create_missing_required_field_returns_400
        claim_type: required_fields_missing
        grounds:
          - entities.Customer
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /customers missing required input field `legal_name` returns 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /recycle-routes/customers", payload: { epa_generator_id: "EPAGEN000102", market_zone: "NORTH", credit_terms: "NET30" }, as: RoutePlanner, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_INVALID_REQUEST"
            - "HTTP status == 400"

      - name: customer_create_invalid_enum_returns_400
        claim_type: invalid_enum
        grounds:
          - entities.Customer.fields.market_zone
          - errors[ERR_INVALID_ENUM]
        distinguishing_aspect: "market_zone='CENTRAL' (not in {NORTH, SOUTH, COASTAL}) returns 400 ERR_INVALID_ENUM."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /recycle-routes/customers", payload: { legal_name: "BadEnum", epa_generator_id: "EPAGEN000103", market_zone: "CENTRAL", credit_terms: "NET30" }, as: RoutePlanner, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_INVALID_ENUM"
            - "HTTP status == 400"

      - name: customer_computed_field_input_ignored
        claim_type: computed_field_input_ignored
        grounds:
          - entities.Customer.fields.prepaid_balance_cents
        distinguishing_aspect: "Client-supplied prepaid_balance_cents in POST body is ignored; server sets it to 0."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /recycle-routes/customers", payload: { legal_name: "Hacker", epa_generator_id: "EPAGEN000104", market_zone: "NORTH", credit_terms: "PREPAY", prepaid_balance_cents: 99999 }, as: RoutePlanner, captures: { cid: "$.data.id", bal: "$.data.prepaid_balance_cents" } }
          assert:
            - "Customer.${cid}.prepaid_balance_cents == 0 (input value 99999 ignored)"

      - name: tank_system_fields_input_ignored
        claim_type: system_fields_immutable
        grounds:
          - entities.Tank
          - entities.Tank.fields.current_volume_gallons
        distinguishing_aspect: "Tank.current_volume_gallons is computed; client cannot set it directly via /tanks create."
        test_recipe:
          setup: ["Customer and TankSite exist"]
          setup_api_calls:
            - { call: "POST /recycle-routes/customers", payload: { legal_name: "SysT", epa_generator_id: "EPAGEN000105", market_zone: "NORTH", credit_terms: "NET30" }, as: RoutePlanner, captures: { cid: "$.data.id" } }
            - { call: "POST /recycle-routes/tank-sites", payload: { customer_id: "${cid}", site_address: "1 Sys Rd", density_zone: "URBAN" }, as: RoutePlanner, captures: { sid: "$.data.id" } }
          trigger:
            - { call: "POST /recycle-routes/tanks", payload: { tank_site_id: "${sid}", tank_kind: "USED_OIL", capacity_gallons: 500, ownership: "COMPANY_OWNED", current_volume_gallons: 999 }, as: TankInstaller, captures: { tid: "$.data.id", vol: "$.data.current_volume_gallons" } }
          assert:
            - "Tank.${tid}.current_volume_gallons == 0 (input 999 ignored)"
            - "Tank.${tid}.ownership_status == PENDING_INSTALL (initial state)"
            - "Tank.${tid}.quarantine_status == CLEAR (initial state)"

      - name: route_stop_window_validation
        claim_type: invalid_range
        grounds:
          - entities.RouteStop.fields.scheduled_window_end
          - errors[ERR_INVALID_STOP_WINDOW]
        distinguishing_aspect: "scheduled_window_end <= scheduled_window_start is rejected."
        test_recipe:
          setup: ["Customer/site/tank/route all set up"]
          setup_api_calls:
            - { call: "POST /recycle-routes/customers", payload: { legal_name: "Wnd", epa_generator_id: "EPAGEN000106", market_zone: "NORTH", credit_terms: "NET30" }, as: RoutePlanner, captures: { cid: "$.data.id" } }
            - { call: "POST /recycle-routes/tank-sites", payload: { customer_id: "${cid}", site_address: "1 Wnd Rd", density_zone: "URBAN" }, as: RoutePlanner, captures: { sid: "$.data.id" } }
            - { call: "POST /recycle-routes/tanks", payload: { tank_site_id: "${sid}", tank_kind: "USED_OIL", capacity_gallons: 500, ownership: "CUSTOMER_OWNED" }, as: TankInstaller, captures: { tid: "$.data.id" } }
            - { call: "POST /recycle-routes/tanks/${tid}/register-existing", payload: {}, as: TankInstaller }
            - { call: "POST /recycle-routes/customers/${cid}/activate", payload: {}, as: RoutePlanner }
            - { call: "POST /recycle-routes/drivers", payload: { driver_name: "Wnd", cdl_class: "B", hazmat_endorsement: true }, as: RoutePlanner, captures: { drv_id: "$.data.id" } }
            - { call: "POST /recycle-routes/routes", payload: { route_code: "WND", scheduled_date: "2026-08-05", driver_id: "${drv_id}", vehicle_capacity_gallons: 500, density_zone: "URBAN" }, as: RoutePlanner, captures: { rid: "$.data.id", rv: "$.data.version" } }
          trigger:
            - { call: "POST /recycle-routes/routes/${rid}/route-stops", payload: { tank_site_id: "${sid}", tank_id: "${tid}", scheduled_window_start: "10:00", scheduled_window_end: "09:00", sequence: 1, estimated_volume_gallons: 100, expected_route_version: "${rv}" }, as: RoutePlanner, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_INVALID_STOP_WINDOW"
            - "HTTP status == 400"

      - name: pagination_default_and_fields
        claim_type: pagination_defaults
        grounds:
          - response_envelope
        distinguishing_aspect: "GET /customers with no query params returns limit=10, offset=0, total_count, has_more fields in response."
        test_recipe:
          setup: ["Three customers created"]
          setup_api_calls:
            - { call: "POST /recycle-routes/customers", payload: { legal_name: "P1", epa_generator_id: "EPAGEN000110", market_zone: "NORTH", credit_terms: "NET30" }, as: RoutePlanner }
            - { call: "POST /recycle-routes/customers", payload: { legal_name: "P2", epa_generator_id: "EPAGEN000111", market_zone: "NORTH", credit_terms: "NET30" }, as: RoutePlanner }
            - { call: "POST /recycle-routes/customers", payload: { legal_name: "P3", epa_generator_id: "EPAGEN000112", market_zone: "NORTH", credit_terms: "NET30" }, as: RoutePlanner }
          trigger:
            - { call: "GET /recycle-routes/customers", payload: {}, as: RoutePlanner }
          assert:
            - "Response envelope contains meta.api_request_id and meta.api_request_timestamp"
            - "Response envelope response_type == 'array'"
            - "Response data has pagination fields: limit, offset, total_count, has_more"
            - "Default limit == 10; default offset == 0"
            - "total_count == 3"
            - "has_more == false"

  # ==========================================================================
  # Section 2: State Machines — invalid transitions, terminal lockdown, initial state
  # ==========================================================================
  - section: state_machines
    instances:
      - name: customer_activate_from_active_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.Customer.transitions
          - errors[ERR_CUSTOMER_NOT_PROSPECT]
        distinguishing_aspect: "Activate on an already-ACTIVE customer returns ERR_CUSTOMER_NOT_PROSPECT."
        test_recipe:
          setup: ["Customer activated once"]
          setup_api_calls:
            - { call: "POST /recycle-routes/customers", payload: { legal_name: "T1", epa_generator_id: "EPAGEN000120", market_zone: "NORTH", credit_terms: "NET30" }, as: RoutePlanner, captures: { cid: "$.data.id" } }
            - { call: "POST /recycle-routes/tank-sites", payload: { customer_id: "${cid}", site_address: "1 T", density_zone: "URBAN" }, as: RoutePlanner, captures: { sid: "$.data.id" } }
            - { call: "POST /recycle-routes/tanks", payload: { tank_site_id: "${sid}", tank_kind: "USED_OIL", capacity_gallons: 100, ownership: "CUSTOMER_OWNED" }, as: TankInstaller, captures: { tid: "$.data.id" } }
            - { call: "POST /recycle-routes/tanks/${tid}/register-existing", payload: {}, as: TankInstaller }
            - { call: "POST /recycle-routes/customers/${cid}/activate", payload: {}, as: RoutePlanner }
          trigger:
            - { call: "POST /recycle-routes/customers/${cid}/activate", payload: {}, as: RoutePlanner, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_CUSTOMER_NOT_PROSPECT"
            - "HTTP status == 409"

      - name: customer_terminated_lockdown
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Customer
        distinguishing_aspect: "TERMINATED customer cannot be suspended, activated, or terminated again."
        test_recipe:
          setup: ["Customer terminated (all balances zero)"]
          setup_api_calls:
            - { call: "POST /recycle-routes/customers", payload: { legal_name: "Term", epa_generator_id: "EPAGEN000121", market_zone: "NORTH", credit_terms: "NET30" }, as: RoutePlanner, captures: { cid: "$.data.id" } }
            - { call: "POST /recycle-routes/tank-sites", payload: { customer_id: "${cid}", site_address: "1 Term", density_zone: "URBAN" }, as: RoutePlanner, captures: { sid: "$.data.id" } }
            - { call: "POST /recycle-routes/tanks", payload: { tank_site_id: "${sid}", tank_kind: "USED_OIL", capacity_gallons: 100, ownership: "CUSTOMER_OWNED" }, as: TankInstaller, captures: { tid: "$.data.id" } }
            - { call: "POST /recycle-routes/tanks/${tid}/register-existing", payload: {}, as: TankInstaller }
            - { call: "POST /recycle-routes/customers/${cid}/activate", payload: {}, as: RoutePlanner }
            - { call: "POST /recycle-routes/customers/${cid}/terminate", payload: {}, as: RoutePlanner }
          trigger:
            - { call: "POST /recycle-routes/customers/${cid}/suspend", payload: {}, as: RoutePlanner, captures: { err1: "$.data.error_id" } }
            - { call: "POST /recycle-routes/customers/${cid}/terminate", payload: {}, as: RoutePlanner, captures: { err2: "$.data.error_id" } }
          assert:
            - "Both calls return 409 with state error"
            - "error ids are ERR_CUSTOMER_NOT_ACTIVE"

      - name: pickup_ticket_provisional_initial_state
        claim_type: initial_state
        grounds:
          - state_machines.PickupTicket
        distinguishing_aspect: "Newly created PickupTicket starts in PROVISIONAL."
        test_recipe:
          setup: ["Full chain through to a COMPLETED stop with metered volume"]
          setup_api_calls:
            - { call: "POST /recycle-routes/customers", payload: { legal_name: "Init PT", epa_generator_id: "EPAGEN000122", market_zone: "NORTH", credit_terms: "NET30" }, as: RoutePlanner, captures: { cid: "$.data.id" } }
            - { call: "POST /recycle-routes/tank-sites", payload: { customer_id: "${cid}", site_address: "1 Init", density_zone: "URBAN", route_eligibility_override: true }, as: RoutePlanner, captures: { sid: "$.data.id" } }
            - { call: "POST /recycle-routes/tanks", payload: { tank_site_id: "${sid}", tank_kind: "USED_OIL", capacity_gallons: 500, ownership: "CUSTOMER_OWNED" }, as: TankInstaller, captures: { tid: "$.data.id" } }
            - { call: "POST /recycle-routes/tanks/${tid}/register-existing", payload: {}, as: TankInstaller }
            - { call: "POST /recycle-routes/tanks/${tid}/record-intake", payload: { gallons: 100 }, as: RoutePlanner }
            - { call: "POST /recycle-routes/customers/${cid}/activate", payload: {}, as: RoutePlanner }
            - { call: "POST /recycle-routes/drivers", payload: { driver_name: "Init", cdl_class: "B", hazmat_endorsement: true }, as: RoutePlanner, captures: { drv: "$.data.id" } }
            - { call: "POST /recycle-routes/market-prices", payload: { market_zone: "NORTH", tank_kind: "USED_OIL", effective_date: "2026-08-01", price_cents_per_gal: 50 }, as: Regulator }
            - { call: "POST /recycle-routes/routes", payload: { route_code: "INIT", scheduled_date: "2026-08-05", driver_id: "${drv}", vehicle_capacity_gallons: 500, density_zone: "URBAN" }, as: RoutePlanner, captures: { rid: "$.data.id", rv: "$.data.version" } }
            - { call: "POST /recycle-routes/routes/${rid}/route-stops", payload: { tank_site_id: "${sid}", tank_id: "${tid}", scheduled_window_start: "08:00", scheduled_window_end: "09:00", sequence: 1, estimated_volume_gallons: 100, expected_route_version: "${rv}" }, as: RoutePlanner, captures: { sid2: "$.data.id" } }
            - { call: "POST /recycle-routes/routes/${rid}/dispatch", payload: {}, as: RoutePlanner }
            - { call: "POST /recycle-routes/route-stops/${sid2}/arrive", payload: {}, as: Driver, as_user_id: "${drv}" }
            - { call: "POST /recycle-routes/route-stops/${sid2}/begin-screening", payload: {}, as: Driver, as_user_id: "${drv}" }
            - { call: "POST /recycle-routes/route-stops/${sid2}/sample-screenings", payload: { halogen_ppm: 10, water_pct: 1.0, ph_level: 7.0 }, as: LabTech }
          trigger:
            - { call: "POST /recycle-routes/route-stops/${sid2}/pickup-tickets", payload: { client_request_id: "INIT-PT", metered_volume_gallons: 100 }, as: Driver, as_user_id: "${drv}", captures: { pt: "$.data.id", st: "$.data.payment_status" } }
          assert:
            - "PickupTicket.${pt}.payment_status == PROVISIONAL (initial state)"

      - name: ticket_settle_on_adjusted_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.PickupTicket
          - errors[ERR_TICKET_NOT_PROVISIONAL]
        distinguishing_aspect: "Settle on an ADJUSTED (terminal) ticket returns ERR_TICKET_NOT_PROVISIONAL."
        test_recipe:
          setup: ["Ticket ADJUSTED via dispute+adjust flow"]
          setup_api_calls:
            - { call: "POST /recycle-routes/customers", payload: { legal_name: "T2", epa_generator_id: "EPAGEN000123", market_zone: "NORTH", credit_terms: "NET30" }, as: RoutePlanner, captures: { cid: "$.data.id" } }
            - { call: "POST /recycle-routes/tank-sites", payload: { customer_id: "${cid}", site_address: "1 T2", density_zone: "URBAN", route_eligibility_override: true }, as: RoutePlanner, captures: { sid: "$.data.id" } }
            - { call: "POST /recycle-routes/tanks", payload: { tank_site_id: "${sid}", tank_kind: "USED_OIL", capacity_gallons: 500, ownership: "CUSTOMER_OWNED" }, as: TankInstaller, captures: { tid: "$.data.id" } }
            - { call: "POST /recycle-routes/tanks/${tid}/register-existing", payload: {}, as: TankInstaller }
            - { call: "POST /recycle-routes/tanks/${tid}/record-intake", payload: { gallons: 100 }, as: RoutePlanner }
            - { call: "POST /recycle-routes/customers/${cid}/activate", payload: {}, as: RoutePlanner }
            - { call: "POST /recycle-routes/drivers", payload: { driver_name: "T2", cdl_class: "B", hazmat_endorsement: true }, as: RoutePlanner, captures: { drv: "$.data.id" } }
            - { call: "POST /recycle-routes/market-prices", payload: { market_zone: "NORTH", tank_kind: "USED_OIL", effective_date: "2026-08-01", price_cents_per_gal: 50 }, as: Regulator }
            - { call: "POST /recycle-routes/routes", payload: { route_code: "T2", scheduled_date: "2026-08-05", driver_id: "${drv}", vehicle_capacity_gallons: 500, density_zone: "URBAN" }, as: RoutePlanner, captures: { rid: "$.data.id", rv: "$.data.version" } }
            - { call: "POST /recycle-routes/routes/${rid}/route-stops", payload: { tank_site_id: "${sid}", tank_id: "${tid}", scheduled_window_start: "08:00", scheduled_window_end: "09:00", sequence: 1, estimated_volume_gallons: 100, expected_route_version: "${rv}" }, as: RoutePlanner, captures: { sid2: "$.data.id" } }
            - { call: "POST /recycle-routes/routes/${rid}/dispatch", payload: {}, as: RoutePlanner }
            - { call: "POST /recycle-routes/route-stops/${sid2}/arrive", payload: {}, as: Driver, as_user_id: "${drv}" }
            - { call: "POST /recycle-routes/route-stops/${sid2}/begin-screening", payload: {}, as: Driver, as_user_id: "${drv}" }
            - { call: "POST /recycle-routes/route-stops/${sid2}/sample-screenings", payload: { halogen_ppm: 10, water_pct: 1.0, ph_level: 7.0 }, as: LabTech }
            - { call: "POST /recycle-routes/route-stops/${sid2}/pickup-tickets", payload: { client_request_id: "T2-PT", metered_volume_gallons: 100 }, as: Driver, as_user_id: "${drv}", captures: { pt: "$.data.id" } }
            - { call: "POST /recycle-routes/pickup-tickets/${pt}/dispute", payload: {}, as: SettlementClerk }
            - { call: "POST /recycle-routes/pickup-tickets/${pt}/adjust", payload: { corrected_metered_volume_gallons: 80 }, as: SettlementClerk }
            - { call: "GET /recycle-routes/customers/${cid}", payload: {}, as: SettlementClerk, captures: { cv: "$.data.version" } }
          trigger:
            - { call: "POST /recycle-routes/pickup-tickets/${pt}/settle", payload: { expected_customer_version: "${cv}" }, as: SettlementClerk, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_TICKET_NOT_PROVISIONAL"
            - "HTTP status == 409"
            - "Terminal state lockdown: no further transitions on ADJUSTED ticket"

  # ==========================================================================
  # Section 3: Calculations — correct results, input set filtering, precision
  # ==========================================================================
  - section: calculations
    instances:
      - name: halogen_surcharge_tier_0
        claim_type: correct_result
        grounds:
          - calculations.settlement_amount
        distinguishing_aspect: "halogen_violation_count=0 yields surcharge_cents=0."
        test_recipe:
          setup: ["Customer halogen_violation_count=0; tank USED_OIL 100 gal; price=+50"]
          setup_api_calls:
            - { call: "POST /recycle-routes/customers", payload: { legal_name: "T0", epa_generator_id: "EPAGEN000130", market_zone: "NORTH", credit_terms: "NET30" }, as: RoutePlanner, captures: { cid: "$.data.id" } }
            - { call: "POST /recycle-routes/tank-sites", payload: { customer_id: "${cid}", site_address: "T0", density_zone: "URBAN", route_eligibility_override: true }, as: RoutePlanner, captures: { sid: "$.data.id" } }
            - { call: "POST /recycle-routes/tanks", payload: { tank_site_id: "${sid}", tank_kind: "USED_OIL", capacity_gallons: 500, ownership: "CUSTOMER_OWNED" }, as: TankInstaller, captures: { tid: "$.data.id" } }
            - { call: "POST /recycle-routes/tanks/${tid}/register-existing", payload: {}, as: TankInstaller }
            - { call: "POST /recycle-routes/tanks/${tid}/record-intake", payload: { gallons: 100 }, as: RoutePlanner }
            - { call: "POST /recycle-routes/customers/${cid}/activate", payload: {}, as: RoutePlanner }
            - { call: "POST /recycle-routes/drivers", payload: { driver_name: "T0", cdl_class: "B", hazmat_endorsement: true }, as: RoutePlanner, captures: { drv: "$.data.id" } }
            - { call: "POST /recycle-routes/market-prices", payload: { market_zone: "NORTH", tank_kind: "USED_OIL", effective_date: "2026-08-01", price_cents_per_gal: 50 }, as: Regulator }
            - { call: "POST /recycle-routes/routes", payload: { route_code: "T0", scheduled_date: "2026-08-05", driver_id: "${drv}", vehicle_capacity_gallons: 500, density_zone: "URBAN" }, as: RoutePlanner, captures: { rid: "$.data.id", rv: "$.data.version" } }
            - { call: "POST /recycle-routes/routes/${rid}/route-stops", payload: { tank_site_id: "${sid}", tank_id: "${tid}", scheduled_window_start: "08:00", scheduled_window_end: "09:00", sequence: 1, estimated_volume_gallons: 100, expected_route_version: "${rv}" }, as: RoutePlanner, captures: { sid2: "$.data.id" } }
            - { call: "POST /recycle-routes/routes/${rid}/dispatch", payload: {}, as: RoutePlanner }
            - { call: "POST /recycle-routes/route-stops/${sid2}/arrive", payload: {}, as: Driver, as_user_id: "${drv}" }
            - { call: "POST /recycle-routes/route-stops/${sid2}/begin-screening", payload: {}, as: Driver, as_user_id: "${drv}" }
            - { call: "POST /recycle-routes/route-stops/${sid2}/sample-screenings", payload: { halogen_ppm: 10, water_pct: 1.0, ph_level: 7.0 }, as: LabTech }
          trigger:
            - { call: "POST /recycle-routes/route-stops/${sid2}/pickup-tickets", payload: { client_request_id: "T0-PT", metered_volume_gallons: 100 }, as: Driver, as_user_id: "${drv}", captures: { sur: "$.data.surcharge_cents", net: "$.data.net_amount_cents" } }
          assert:
