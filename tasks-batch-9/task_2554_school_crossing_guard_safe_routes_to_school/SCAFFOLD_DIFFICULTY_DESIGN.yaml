          - state_machines.AbsenceReport.OFFER_OUT_to_RESCINDED
          - entities.School.fields.covered_post_count
          - entities.School.fields.uncovered_post_count
        distinguishing_aspect: |
          A different conserved quantity: a headcount partition rather than money.
          active_post_count == covered_post_count + uncovered_post_count must hold at
          every one of five observation points as two absences open and then close,
          and coverage_rate_pct must walk 100.00 -> 50.00 -> 0.00 -> 50.00 -> 100.00
          with posture OPEN -> RESTRICTED -> SUSPENDED -> RESTRICTED -> OPEN. The
          50.00 stops also pin the strict-inequality rule that exactly 50.00 is
