          Whether POST /batch-orders/{id}/start-fill is allowed depends on no field of the
          BatchOrder at all: it depends on FillingSuite.posture, which is itself derived from the
          investigation_status of EmSample rows belonging to a third entity. One grade-B viable-air
          sample at cfu 20 (action limit 10) drives posture to RESTRICTED and start-fill to
          ERR_SUITE_NOT_OPEN; moving the excursion OPEN -> INVESTIGATING does NOT relax the gate
