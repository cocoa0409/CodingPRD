    - endpoints.POST /api/_clock/set_current_utc
    - state_machines.TransitionTask.transitions.PENDING_to_IN_PROGRESS
    - entities.PortfolioAccount.fields.completion_pct_bps
    distinguishing_aspect: Advancing the account clock past a task's due date flips it to FAILED and moves completion_pct_bps to 10000 because the only task is now terminal.
    test_recipe:
      setup:
