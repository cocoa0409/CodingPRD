# =============================================================================
# Task 0944 — §1.9 Scaffold Corner Design (breadth coverage)
# Sections and claim_types come from references/claim-extraction-guide.md.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: create_recipe_returns_every_declared_field_at_version_one
        claim_type: Creation
        grounds:
          - entities.Recipe
          - endpoints[POST /recipes]
        distinguishing_aspect: "POST /recipes with the seven required fields returns 201 and a Recipe whose recipe_version_number is 1, version is 1 and active_label_approval_id is null."
        test_recipe:
          setup: ["Empty database, logical clock at its 2026-05-01T00:00:00Z default."]
          setup_api_calls:
            - call: "POST /vessels"
              payload: { code: "FV-A", capacity_liters: 300.0 }
              as: ProductionOperator
          trigger:
            - call: "POST /recipes"
              payload: { name: "Yuzu Sparkler", style: "BOTANICAL_SODA", target_ph_ceiling: 3.4, planned_f1_days: 6, planned_f2_days: 2, base_gravity_brix: 6.5, intended_abv_class: "NON_ALCOHOLIC" }
              as: ProductionOperator
              captures: { rec_id: $.data.id }
          assert:
            - "the response code is 201"
            - "Recipe.${rec_id}.recipe_version_number == 1"
            - "Recipe.${rec_id}.version == 1"
            - "Recipe.${rec_id}.active_label_approval_id == null"
            - "Recipe.${rec_id}.style == BOTANICAL_SODA"
            - "Recipe.${rec_id}.target_ph_ceiling == 3.4"

      - name: recipe_optional_fields_take_their_declared_defaults
        claim_type: Defaults
        grounds:
          - entities.Recipe.fields.f2_added_sugar_g_per_l
          - entities.Recipe.fields.pasteurization_required
          - entities.Account.fields.credit_terms_days
        distinguishing_aspect: "Omitting f2_added_sugar_g_per_l and pasteurization_required yields 0 and false; omitting credit_terms_days on an account yields WHOLESALE_DEFAULT_TERMS_DAYS (30)."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /recipes"
              payload: { name: "Plain Kombucha", style: "KOMBUCHA", target_ph_ceiling: 3.5, planned_f1_days: 6, planned_f2_days: 3, base_gravity_brix: 7.0, intended_abv_class: "NON_ALCOHOLIC" }
              as: ProductionOperator
              captures: { rec_id: $.data.id }
            - call: "POST /accounts"
              payload: { account_name: "Default Terms Co", channel: "WHOLESALE_DISTRIBUTOR", credit_limit: 1000.0 }
              as: SalesRep
              captures: { acct_id: $.data.id }
          assert:
            - "Recipe.${rec_id}.f2_added_sugar_g_per_l == 0"
            - "Recipe.${rec_id}.pasteurization_required == false"
            - "Account.${acct_id}.credit_terms_days == 30"
            - "Account.${acct_id}.status == ONBOARDING"
            - "Account.${acct_id}.alcoholic_license_on_file == false"

      - name: get_recipe_with_an_unknown_id_returns_not_found
        claim_type: Not Found
        grounds:
          - errors[ERR_PRODUCTION_RESOURCE_NOT_FOUND]
          - validations[priority=5]
        distinguishing_aspect: "A syntactically valid but unused UUID on GET /recipes/{id} yields ERR_PRODUCTION_RESOURCE_NOT_FOUND with HTTP 404, not an empty 200."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "GET /recipes/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: ProductionOperator
              captures: { err: $.data.error_id }
          assert:
            - "the response error_id is ERR_PRODUCTION_RESOURCE_NOT_FOUND with HTTP 404"

      - name: vessel_create_missing_required_capacity_returns_validation
        claim_type: Required Fields
        grounds:
          - validations[priority=19]
          - endpoints[POST /vessels]
        distinguishing_aspect: "POST /vessels without capacity_liters is refused with ERR_VALIDATION and no Vessel row is created."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /vessels"
              payload: { code: "FV-MISSING" }
              as: ProductionOperator
              captures: { err: $.data.error_id }
          assert:
            - "the response error_id is ERR_VALIDATION with HTTP 400"

      - name: ingredient_type_outside_the_declared_enum_is_refused
        claim_type: Type Constraints
        grounds:
          - validations[priority=20]
          - entities.IngredientLot.fields.ingredient_type
        distinguishing_aspect: "An ingredient_type of COFFEE, which is not one of the six declared members, is refused with ERR_VALIDATION."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /ingredient-lots"
              payload: { ingredient_type: "COFFEE", supplier_lot_code: "X-1", received_on_date: "2026-04-20T00:00:00.000Z", expiry_date: "2027-01-01T00:00:00.000Z", quantity_received: 10.0 }
              as: ProductionOperator
              captures: { err: $.data.error_id }
          assert:
            - "the response error_id is ERR_VALIDATION with HTTP 400"

      - name: scoby_generation_number_and_vitality_are_computed_not_supplied
        claim_type: Computed Fields
        grounds:
          - entities.ScobyCulture.fields.generation_number
          - entities.ScobyCulture.fields.vitality_score
          - calculations.scoby_vitality_score
          - state_machines.ScobyCulture.create_founder_or_daughter
        distinguishing_aspect: "A founder culture is generation 1 with vitality 100; its daughter is generation 2 with vitality 96, both derived rather than taken from the request."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - call: "POST /scoby-cultures"
              payload: { label: "Founder" }
              as: ProductionOperator
              captures: { g1: $.data.id }
          trigger:
            - call: "POST /scoby-cultures"
              payload: { label: "Daughter", parent_culture_id: "${g1}" }
              as: ProductionOperator
              captures: { g2: $.data.id }
          assert:
            - "ScobyCulture.${g1}.generation_number == 1"
            - "ScobyCulture.${g1}.vitality_score == 100"
            - "ScobyCulture.${g2}.generation_number == 2"
            - "ScobyCulture.${g2}.vitality_score == 96"
            - "ScobyCulture.${g2}.parent_culture_id == ${g1}"
            - "GET /scoby-cultures/${g1}/daughters returns exactly 1 row whose id is ${g2}"

      - name: qa_reading_is_append_only_and_carries_no_version_field
        claim_type: Immutability
        grounds:
          - entities.QaReading
          - endpoints[GET /batches/{id}/qa-readings]
        distinguishing_aspect: "QaReading declares common_fields false, so a recorded reading exposes id and created_at but no version and no updated_at, and there is no endpoint that mutates one."
        test_recipe:
          setup: ["One batch pitched at the default clock into a sanitised vessel."]
          setup_api_calls:
            - call: "POST /recipes"
              payload: { name: "House Ginger", style: "KOMBUCHA", target_ph_ceiling: 3.5, planned_f1_days: 6, planned_f2_days: 3, base_gravity_brix: 7.0, intended_abv_class: "NON_ALCOHOLIC" }
              as: ProductionOperator
              captures: { rec_id: $.data.id }
            - call: "POST /scoby-cultures"
              payload: { label: "Mother Q" }
              as: ProductionOperator
              captures: { sc_id: $.data.id }
            - call: "POST /vessels"
              payload: { code: "FV-17", capacity_liters: 500.0 }
              as: ProductionOperator
              captures: { v_id: $.data.id }
            - call: "POST /vessels/${v_id}/cip-start"
              payload: {}
              as: ProductionOperator
            - call: "POST /vessels/${v_id}/cip-complete"
              payload: {}
              as: ProductionOperator
            - call: "POST /batches"
              payload: { batch_code: "B-17001", recipe_id: "${rec_id}", scoby_culture_id: "${sc_id}", vessel_id: "${v_id}", pitched_liters: 400.0, planned_f2_days: 3 }
              as: ProductionOperator
              captures: { b_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-04T00:00:00.000Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /batches/${b_id}/qa-readings"
              payload: { reading_type: "F1", reading_at: "2026-05-03T00:00:00.000Z", ph: 3.80, temperature_c: 24.0, brix: 6.0, abv_pct: 0.10 }
              as: ProductionOperator
          assert:
            - "the response code is 201 and the QaReading body carries id and created_at but neither version nor updated_at"
            - "the QaReading's day_index == 2"
            - "the QaReading's flagged == false"
            - "GET /batches/${b_id}/qa-readings returns exactly 1 row"

      - name: finished_lot_list_returns_the_declared_pagination_envelope
        claim_type: Listing
        grounds:
          - response_envelope.pagination_fields
          - endpoints[GET /finished-lots]
        distinguishing_aspect: "GET /finished-lots on an empty finished-goods store returns response_type array with total_count 0, has_more false, limit 10 and offset 0."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "GET /finished-lots"
              payload: {}
              as: SalesRep
          assert:
            - "the response meta carries api_request_id and api_request_timestamp"
            - "response_type == array"
            - "total_count == 0, has_more == false, limit == 10, offset == 0"

      - name: batch_system_fields_supplied_by_the_client_are_input_ignored
        claim_type: System Fields
        grounds:
          - entities.Batch.fields.ferment_stage
          - entities.Batch.fields.qa_disposition
          - endpoints[POST /batches]
        distinguishing_aspect: "A pitch that smuggles ferment_stage PACKAGED and qa_disposition CONFORMING into the body is refused with ERR_VALIDATION because neither is a declared input; the server never accepts a client-chosen state."
        test_recipe:
          setup: ["A recipe, an ACTIVE culture and a SANITIZED vessel."]
          setup_api_calls:
            - call: "POST /recipes"
              payload: { name: "House Ginger", style: "KOMBUCHA", target_ph_ceiling: 3.5, planned_f1_days: 6, planned_f2_days: 3, base_gravity_brix: 7.0, intended_abv_class: "NON_ALCOHOLIC" }
              as: ProductionOperator
              captures: { rec_id: $.data.id }
            - call: "POST /scoby-cultures"
              payload: { label: "Mother R" }
              as: ProductionOperator
              captures: { sc_id: $.data.id }
            - call: "POST /vessels"
              payload: { code: "FV-18", capacity_liters: 500.0 }
              as: ProductionOperator
              captures: { v_id: $.data.id }
            - call: "POST /vessels/${v_id}/cip-start"
              payload: {}
              as: ProductionOperator
            - call: "POST /vessels/${v_id}/cip-complete"
              payload: {}
              as: ProductionOperator
          trigger:
            - call: "POST /batches"
              payload: { batch_code: "B-18001", recipe_id: "${rec_id}", scoby_culture_id: "${sc_id}", vessel_id: "${v_id}", pitched_liters: 400.0, planned_f2_days: 3, ferment_stage: "PACKAGED", qa_disposition: "CONFORMING" }
              as: ProductionOperator
              captures: { err: $.data.error_id }
          assert:
            - "the response error_id is ERR_VALIDATION with HTTP 400"
            - "Vessel.${v_id}.state == SANITIZED"
            - "Vessel.${v_id}.current_batch_id == null"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: cip_complete_from_sanitized_is_an_invalid_transition
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Vessel.complete_cip
          - validations[priority=29]
          - errors[ERR_VESSEL_UNAVAILABLE]
        distinguishing_aspect: "A second cip-complete on a vessel already in SANITIZED is refused with ERR_VESSEL_UNAVAILABLE and does not move cip_completed_at."
        test_recipe:
          setup: ["One vessel taken through a full CIP cycle, so it is SANITIZED."]
          setup_api_calls:
            - call: "POST /vessels"
              payload: { code: "FV-19", capacity_liters: 400.0 }
              as: ProductionOperator
              captures: { v_id: $.data.id }
            - call: "POST /vessels/${v_id}/cip-start"
              payload: {}
              as: ProductionOperator
            - call: "POST /vessels/${v_id}/cip-complete"
              payload: {}
              as: ProductionOperator
          trigger:
            - call: "POST /vessels/${v_id}/cip-complete"
              payload: {}
              as: ProductionOperator
              captures: { err: $.data.error_id }
          assert:
            - "the response error_id is ERR_VESSEL_UNAVAILABLE with HTTP 409"
            - "Vessel.${v_id}.state == SANITIZED"
            - "Vessel.${v_id}.cip_completed_at == 2026-05-01T00:00:00.000Z"

      - name: a_new_batch_starts_in_f1_active_with_a_pending_disposition
        claim_type: Initial State
        grounds:
          - state_machines.Batch.pitch_batch
          - entities.Batch.fields.ferment_stage
          - entities.Batch.fields.occupancy_end_at
        distinguishing_aspect: "A pitch at the default clock creates a Batch whose ferment_stage is F1_ACTIVE, qa_disposition PENDING, remaining_liters equal to pitched_liters, and occupancy_end_at exactly nine days later."
        test_recipe:
          setup: ["A recipe with planned_f1_days 6, an ACTIVE culture and a SANITIZED vessel; clock at its 2026-05-01T00:00:00Z default."]
          setup_api_calls:
            - call: "POST /recipes"
              payload: { name: "House Ginger", style: "KOMBUCHA", target_ph_ceiling: 3.5, planned_f1_days: 6, planned_f2_days: 3, base_gravity_brix: 7.0, intended_abv_class: "NON_ALCOHOLIC" }
              as: ProductionOperator
              captures: { rec_id: $.data.id }
            - call: "POST /scoby-cultures"
              payload: { label: "Mother S" }
              as: ProductionOperator
              captures: { sc_id: $.data.id }
            - call: "POST /vessels"
              payload: { code: "FV-20", capacity_liters: 500.0 }
              as: ProductionOperator
              captures: { v_id: $.data.id }
            - call: "POST /vessels/${v_id}/cip-start"
              payload: {}
              as: ProductionOperator
            - call: "POST /vessels/${v_id}/cip-complete"
              payload: {}
              as: ProductionOperator
          trigger:
            - call: "POST /batches"
              payload: { batch_code: "B-20001", recipe_id: "${rec_id}", scoby_culture_id: "${sc_id}", vessel_id: "${v_id}", pitched_liters: 450.0, planned_f2_days: 3 }
              as: ProductionOperator
              captures: { b_id: $.data.id }
          assert:
            - "the response code is 201"
            - "Batch.${b_id}.ferment_stage == F1_ACTIVE"
            - "Batch.${b_id}.qa_disposition == PENDING"
            - "Batch.${b_id}.pitched_at == 2026-05-01T00:00:00.000Z"
            - "Batch.${b_id}.occupancy_end_at == 2026-05-10T00:00:00.000Z"
            - "Batch.${b_id}.remaining_liters == 450.0"
            - "Batch.${b_id}.flagged_reading_count == 0"
            - "Vessel.${v_id}.state == OCCUPIED"
            - "ScobyCulture.${sc_id}.pitch_count == 1"
            - "ScobyCulture.${sc_id}.vitality_score == 94"

      - name: a_passed_reverification_resets_the_pitch_count_and_lifts_vitality
        claim_type: cyclic
        grounds:
          - state_machines.ScobyCulture.open_reverification
          - state_machines.ScobyCulture.reverification_pass
          - calculations.scoby_vitality_score
          - constants.SCOBY_REVERIFICATION_BONUS
        distinguishing_aspect: "The ACTIVE -> REVERIFICATION_PENDING -> ACTIVE loop closes: a generation-2 culture pitched once sits at 90, and a PASS resets pitch_count to 0, sets reverification_count to 1 and recomputes vitality to 100 clamped from 111."
        test_recipe:
          setup: ["A generation-2 culture that has been pitched once, so pitch_count is 1 and vitality_score is 90, sent out for reverification."]
          setup_api_calls:
            - call: "POST /recipes"
              payload: { name: "House Ginger", style: "KOMBUCHA", target_ph_ceiling: 3.5, planned_f1_days: 6, planned_f2_days: 3, base_gravity_brix: 7.0, intended_abv_class: "NON_ALCOHOLIC" }
              as: ProductionOperator
              captures: { rec_id: $.data.id }
            - call: "POST /scoby-cultures"
              payload: { label: "Mother AL" }
              as: ProductionOperator
              captures: { g1: $.data.id }
            - call: "POST /scoby-cultures"
              payload: { label: "Daughter AL", parent_culture_id: "${g1}" }
              as: ProductionOperator
              captures: { g2: $.data.id }
            - call: "POST /vessels"
              payload: { code: "FV-43", capacity_liters: 500.0 }
              as: ProductionOperator
              captures: { v_id: $.data.id }
            - call: "POST /vessels/${v_id}/cip-start"
              payload: {}
              as: ProductionOperator
            - call: "POST /vessels/${v_id}/cip-complete"
              payload: {}
              as: ProductionOperator
            - call: "POST /batches"
              payload: { batch_code: "B-43001", recipe_id: "${rec_id}", scoby_culture_id: "${g2}", vessel_id: "${v_id}", pitched_liters: 400.0, planned_f2_days: 3 }
              as: ProductionOperator
            - call: "POST /scoby-cultures/${g2}/reverify"
              payload: {}
              as: QaManager
          trigger:
            - call: "POST /scoby-cultures/${g2}/reverify-result"
              payload: { outcome: "PASS" }
              as: QaManager
          assert:
            - "ScobyCulture.${g2}.state == ACTIVE"
            - "ScobyCulture.${g2}.pitch_count == 0"
            - "ScobyCulture.${g2}.reverification_count == 1"
            - "ScobyCulture.${g2}.last_reverified_at == 2026-05-01T00:00:00.000Z"
            - "ScobyCulture.${g2}.vitality_score == 100"
            - "ScobyCulture.${g2}.retire_reason == null"

      - name: a_retired_culture_cannot_be_pitched_again
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.ScobyCulture.manual_retire
          - validations[priority=28]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "RETIRED is terminal on ScobyCulture, so a pitch naming a retired culture is refused with ERR_INVALID_STATE and the vessel stays SANITIZED."
        test_recipe:
          setup: ["A recipe, a SANITIZED vessel and a culture that has been retired with reason OPERATOR."]
          setup_api_calls:
            - call: "POST /recipes"
              payload: { name: "House Ginger", style: "KOMBUCHA", target_ph_ceiling: 3.5, planned_f1_days: 6, planned_f2_days: 3, base_gravity_brix: 7.0, intended_abv_class: "NON_ALCOHOLIC" }
              as: ProductionOperator
              captures: { rec_id: $.data.id }
            - call: "POST /scoby-cultures"
              payload: { label: "Mother T" }
              as: ProductionOperator
              captures: { sc_id: $.data.id }
            - call: "POST /vessels"
              payload: { code: "FV-21", capacity_liters: 500.0 }
              as: ProductionOperator
              captures: { v_id: $.data.id }
            - call: "POST /vessels/${v_id}/cip-start"
              payload: {}
              as: ProductionOperator
            - call: "POST /vessels/${v_id}/cip-complete"
              payload: {}
              as: ProductionOperator
            - call: "POST /scoby-cultures/${sc_id}/retire"
              payload: { retire_reason: "OPERATOR" }
              as: ProductionOperator
          trigger:
            - call: "POST /batches"
              payload: { batch_code: "B-21001", recipe_id: "${rec_id}", scoby_culture_id: "${sc_id}", vessel_id: "${v_id}", pitched_liters: 400.0, planned_f2_days: 3 }
              as: ProductionOperator
              captures: { err: $.data.error_id }
          assert:
            - "the response error_id is ERR_INVALID_STATE with HTTP 409"
            - "ScobyCulture.${sc_id}.state == RETIRED"
            - "ScobyCulture.${sc_id}.retire_reason == OPERATOR"
            - "ScobyCulture.${sc_id}.pitch_count == 0"
            - "Vessel.${v_id}.state == SANITIZED"

      - name: an_eighth_generation_daughter_is_refused_at_the_lineage_cap
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.ScobyCulture.create_founder_or_daughter
          - validations[priority=44]
          - constants.SCOBY_GENERATION_CAP
          - errors[ERR_SCOBY_GENERATION_CAP]
        distinguishing_aspect: "A lineage of seven generations is legal, and the split that would produce generation 8 is refused with ERR_SCOBY_GENERATION_CAP, leaving the generation-7 culture ACTIVE."
        test_recipe:
          setup: ["A founder culture split down to generation 7."]
          setup_api_calls:
            - call: "POST /scoby-cultures"
              payload: { label: "G1" }
              as: ProductionOperator
              captures: { g1: $.data.id }
            - call: "POST /scoby-cultures"
              payload: { label: "G2", parent_culture_id: "${g1}" }
              as: ProductionOperator
              captures: { g2: $.data.id }
            - call: "POST /scoby-cultures"
              payload: { label: "G3", parent_culture_id: "${g2}" }
              as: ProductionOperator
              captures: { g3: $.data.id }
            - call: "POST /scoby-cultures"
              payload: { label: "G4", parent_culture_id: "${g3}" }
              as: ProductionOperator
              captures: { g4: $.data.id }
            - call: "POST /scoby-cultures"
              payload: { label: "G5", parent_culture_id: "${g4}" }
              as: ProductionOperator
              captures: { g5: $.data.id }
            - call: "POST /scoby-cultures"
              payload: { label: "G6", parent_culture_id: "${g5}" }
              as: ProductionOperator
              captures: { g6: $.data.id }
            - call: "POST /scoby-cultures"
              payload: { label: "G7", parent_culture_id: "${g6}" }
              as: ProductionOperator
              captures: { g7: $.data.id }
          trigger:
            - call: "POST /scoby-cultures"
              payload: { label: "G8", parent_culture_id: "${g7}" }
              as: ProductionOperator
              captures: { err: $.data.error_id }
          assert:
            - "the response error_id is ERR_SCOBY_GENERATION_CAP with HTTP 422"
            - "ScobyCulture.${g7}.generation_number == 7"
            - "ScobyCulture.${g7}.state == ACTIVE"
            - "ScobyCulture.${g7}.vitality_score == 76"

      - name: reverification_failure_contaminates_the_culture_and_nonconforms_its_inflight_batch
        claim_type: Cross-entity
        grounds:
          - state_machines.ScobyCulture.reverification_fail
          - state_machines.Batch.qa_cascade_nonconforming
          - entities.ScobyCulture.fields.retire_reason
        distinguishing_aspect: "A FAIL result moves the culture to CONTAMINATED with retire_reason CONTAMINATION and drives its still-fermenting batch to qa_disposition NONCONFORMING while leaving ferment_stage untouched."
        test_recipe:
          setup: ["One batch in F1_ACTIVE pitched from an ACTIVE culture that has been sent for reverification."]
          setup_api_calls:
            - call: "POST /recipes"
              payload: { name: "House Ginger", style: "KOMBUCHA", target_ph_ceiling: 3.5, planned_f1_days: 6, planned_f2_days: 3, base_gravity_brix: 7.0, intended_abv_class: "NON_ALCOHOLIC" }
              as: ProductionOperator
              captures: { rec_id: $.data.id }
            - call: "POST /scoby-cultures"
              payload: { label: "Mother U" }
              as: ProductionOperator
              captures: { sc_id: $.data.id }
            - call: "POST /vessels"
              payload: { code: "FV-22", capacity_liters: 500.0 }
              as: ProductionOperator
              captures: { v_id: $.data.id }
            - call: "POST /vessels/${v_id}/cip-start"
              payload: {}
              as: ProductionOperator
            - call: "POST /vessels/${v_id}/cip-complete"
              payload: {}
              as: ProductionOperator
            - call: "POST /batches"
              payload: { batch_code: "B-22001", recipe_id: "${rec_id}", scoby_culture_id: "${sc_id}", vessel_id: "${v_id}", pitched_liters: 400.0, planned_f2_days: 3 }
              as: ProductionOperator
              captures: { b_id: $.data.id }
            - call: "POST /scoby-cultures/${sc_id}/reverify"
              payload: {}
              as: QaManager
