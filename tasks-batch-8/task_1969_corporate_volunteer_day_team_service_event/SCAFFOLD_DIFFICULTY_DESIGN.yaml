  - rule_id: resource_temporal_overlap
    instances:
      - name: vehicle_turnaround_buffer_exact_30_minutes
        grounds:
          - calculations.vehicle_window_conflict
          - errors[ERR_VEHICLE_SCHEDULE_CONFLICT]
        distinguishing_aspect: |
          Interval semantics = half-open windows PLUS a 30-minute turnaround buffer on the
          Vehicle resource: a new manifest departing at exactly existing.return_at + 30 min is
          ALLOWED (adjacency at the buffer), while departing 1 minute earlier collides and is
          REJECTED with ERR_VEHICLE_SCHEDULE_CONFLICT.
        test_recipe:
          setup:
            - "Event in PLANNING; vehicle V (40 seats); manifest M1 BOOKED 08:00-10:00 on event day"
          setup_api_calls:
            - { call: "POST /service-events", payload: { name: "Day O", event_start_at: "2026-08-20T09:00:00Z", event_end_at: "2026-08-20T15:00:00Z", budget_cents: 1000000 }, as: CommunityEngagementManager, captures: { ev1: $.data.id } }
            - { call: "POST /vehicles", payload: { name: "Bus-7", seat_capacity: 40 }, as: LogisticsCoordinator, captures: { veh1: $.data.id } }
            - { call: "POST /transport-manifests", payload: { event_id: "${ev1}", vehicle_id: "${veh1}", depart_at: "2026-08-20T08:00:00Z", return_at: "2026-08-20T10:00:00Z", cost_cents: 5000 }, as: LogisticsCoordinator, captures: { man1: $.data.id } }
          trigger:
            - { call: "POST /transport-manifests", payload: { event_id: "${ev1}", vehicle_id: "${veh1}", depart_at: "2026-08-20T10:30:00Z", return_at: "2026-08-20T12:00:00Z", cost_cents: 4000 }, as: LogisticsCoordinator, captures: { man2: $.data.id } }
            - { call: "POST /transport-manifests", payload: { event_id: "${ev1}", vehicle_id: "${veh1}", depart_at: "2026-08-20T10:29:00Z", return_at: "2026-08-20T12:00:00Z", cost_cents: 4000 }, as: LogisticsCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "M2 at exactly return_at + 30 min (10:30): created (201), id captured — buffer adjacency is legal"
            - "M3 at 10:29 (one minute inside the buffer): error_id == ERR_VEHICLE_SCHEDULE_CONFLICT"
            - "M1 remains BOOKED and unaffected"

      - name: vendor_day_aggregate_capacity_boundary
        grounds:
          - calculations.meal_plan_total
          - errors[ERR_VENDOR_CAPACITY_EXCEEDED]
        distinguishing_aspect: |
          DIFFERENT interval semantics from the vehicle buffer rule: not geometric overlap but
          AGGREGATE calendar-day pooling on the vendor resource — MealPlans sharing vendor_name
          and UTC event date sum their ordered_headcount against VENDOR_DAILY_CAPACITY (6).
          4 + 2 == 6 is ALLOWED (equality at capacity); a further 1 pushes 7 > 6 and is REJECTED.
