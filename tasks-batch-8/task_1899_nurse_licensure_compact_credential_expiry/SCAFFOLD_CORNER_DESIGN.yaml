            - { call: "POST /credentialing/packet-items/${item_att}/submit-evidence", payload: { evidence_ref: "e4" }, as: Nurse, as_user_id: "${n_id}" }
            - { call: "POST /credentialing/packet-items/${item_lv}/verify", payload: {}, as: CredentialingSpecialist, as_user_id: "spec-1" }
            - { call: "POST /credentialing/packet-items/${item_bls}/verify", payload: {}, as: CredentialingSpecialist, as_user_id: "spec-1" }
            - { call: "POST /credentialing/packet-items/${item_comp}/verify", payload: {}, as: CredentialingSpecialist, as_user_id: "spec-1" }
