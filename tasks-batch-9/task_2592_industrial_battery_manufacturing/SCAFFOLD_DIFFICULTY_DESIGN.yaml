# =====================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
#   Task 2592 - Industrial Battery Manufacturing
#   9 rule_ids / 21 instances. Every literal below was computed by
#   executing the corresponding calculations[].formula from SCAFFOLD.yaml
#   with its declared constants and rounding order.
#   Logical clock startup default: 2026-08-01T00:00:00Z.
# =====================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:

      - name: formation_energy_provisional_nameplate_vs_final_metered
        grounds:
          - calculations.formation_energy_charge
          - entities.FormationRun.fields.estimated_energy_kwh
          - entities.FormationRun.fields.provisional_charge_cents
          - entities.FormationRun.fields.final_charge_cents
          - entities.FormationRun.fields.reserved_emission_g
          - entities.FormationRun.fields.consumed_emission_g
          - state_machines.FormationRun.run_state.SCHEDULED_to_CHARGING
          - state_machines.FormationRun.run_state.CHARGING_to_COMPLETED
        distinguishing_aspect: |
          Energy accounting on a FormationRun: the provisional_nameplate variant prices
          min(theoretical, bay nameplate * 0.85) over the SCHEDULED window while the
          final_metered variant prices the metered reading over the ACTUAL window, so the
          same run yields provisional_charge_cents 2210 / reserved_emission_g 255.00 and
          final_charge_cents 2126 / consumed_emission_g 250.00 - both energy quantity and
          band mix differ.
        test_recipe:
          setup:
            - "One plant with peak tariff 25 cents/kWh, off-peak 15 cents/kWh and a 100000.00 g monthly lead-emission permit."
            - "One APPROVED LEAD_ACID design (12 cells x 2.0 V, 465.0 Ah, charge factor 1.5) and a lot of quantity 9 advanced to FORMATION."
            - "One formation bay rated 20.00 kW with a 45 minute cooldown."
            - "A run scheduled 2026-09-02T06:00Z-12:00Z (2 off-peak + 4 peak hours), started at 05:00Z and completed at 13:00Z with 100.00 metered kWh (3 off-peak + 5 peak hours)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlantAdmin
            - call: "POST /plants"
              payload: { name: "Riverside Battery Works", site_code: "PLT-RIV", licensed_chemistries: ["LEAD_ACID", "LITHIUM_LFP"], permit_status: "ACTIVE", monthly_lead_emission_permit_g: 100000.00, peak_tariff_cents_per_kwh: 25.00, offpeak_tariff_cents_per_kwh: 15.00, lead_initial_inventory_kg: 10000.000 }
              as: PlantAdmin
              captures: { plant_id: $.data.id }
            - call: "POST /workers"
              payload: { plant_id: "${plant_id}", full_name: "Ada Engineer", job_class: "ENGINEER", hire_date: "2020-01-01T00:00:00Z" }
              as: PlantAdmin
              captures: { eng_a_id: $.data.id }
            - call: "POST /workers"
              payload: { plant_id: "${plant_id}", full_name: "Ben Engineer", job_class: "ENGINEER", hire_date: "2020-01-01T00:00:00Z" }
              as: PlantAdmin
              captures: { eng_b_id: $.data.id }
            - call: "POST /workers"
              payload: { plant_id: "${plant_id}", full_name: "Cara Supervisor", job_class: "PRODUCTION", hire_date: "2020-01-01T00:00:00Z" }
              as: PlantAdmin
              captures: { sup_a_id: $.data.id }
            - call: "POST /cell-designs"
              payload: { code: "CD-LEAD-465", chemistry: "LEAD_ACID", plate_type: "TUBULAR", cells_per_battery: 12, cell_nominal_voltage_v: 2.0, nominal_capacity_ah: 465.0, rated_cycles: 1500, warranty_months: 60, pack_weight_kg: 900.000, lead_content_kg: 300.000, formation_charge_factor: 1.5, list_price_cents: 500000 }
              as: DesignEngineer
              as_user_id: "${eng_a_id}"
              captures: { design_id: $.data.id }
            - call: "POST /cell-designs/${design_id}/review-actions"
              payload: { action: "SUBMIT" }
              as: DesignEngineer
              as_user_id: "${eng_a_id}"
            - call: "POST /cell-designs/${design_id}/review-actions"
              payload: { action: "APPROVE" }
              as: DesignEngineer
              as_user_id: "${eng_b_id}"
            - call: "POST /formation-bays"
              payload: { plant_id: "${plant_id}", bay_code: "BAY-1", rated_power_kw: 20.00, cooldown_minutes: 45 }
              as: PlantAdmin
              captures: { bay_id: $.data.id }
            - call: "POST /production-lots"
              payload: { plant_id: "${plant_id}", cell_design_id: "${design_id}", lot_code: "LOT-0001", quantity: 9 }
              as: ProductionSupervisor
              as_user_id: "${sup_a_id}"
              captures: { lot_id: $.data.id }
            - call: "POST /production-lots/${lot_id}/advance"
              payload: { to_state: "PLATE_PRODUCTION" }
              as: ProductionSupervisor
              as_user_id: "${sup_a_id}"
            - call: "POST /production-lots/${lot_id}/advance"
              payload: { to_state: "FORMATION" }
              as: ProductionSupervisor
              as_user_id: "${sup_a_id}"
            - call: "POST /formation-runs"
              payload: { lot_id: "${lot_id}", bay_id: "${bay_id}", scheduled_start_at: "2026-09-02T06:00:00Z", scheduled_end_at: "2026-09-02T12:00:00Z" }
              as: ProductionSupervisor
              as_user_id: "${sup_a_id}"
              captures: { run_id: $.data.id, provisional_cents: $.data.provisional_charge_cents, reserved_g: $.data.reserved_emission_g }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-02T05:00:00Z" }
              as: PlantAdmin
            - call: "POST /formation-runs/${run_id}/start"
              payload: { actual_start_at: "2026-09-02T05:00:00Z" }
              as: ProductionSupervisor
              as_user_id: "${sup_a_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-02T13:00:00Z" }
              as: PlantAdmin
          trigger:
            - call: "POST /formation-runs/${run_id}/complete"
              payload: { metered_energy_kwh: 100.00, formation_capacity_pct: 95.00, actual_end_at: "2026-09-02T13:00:00Z" }
              as: ProductionSupervisor
              as_user_id: "${sup_a_id}"
          assert:
            - "FormationRun.${run_id}.estimated_energy_kwh == 102.00   # nameplate 20.00 kW * 6 h * 0.85 binds below theoretical 150.66"
            - "FormationRun.${run_id}.scheduled_peak_hours == 4.0000 and FormationRun.${run_id}.scheduled_offpeak_hours == 2.0000"
            - "FormationRun.${run_id}.provisional_charge_cents == 2210"
            - "FormationRun.${run_id}.reserved_emission_g == 255.00"
            - "FormationRun.${run_id}.actual_peak_hours == 5.0000 and FormationRun.${run_id}.actual_offpeak_hours == 3.0000"
            - "FormationRun.${run_id}.final_charge_cents == 2126"
            - "FormationRun.${run_id}.consumed_emission_g == 250.00"
            - "FormationRun.${run_id}.final_charge_cents != FormationRun.${run_id}.provisional_charge_cents"
            - "FormationRun.${run_id}.capacity_validation_result == PASS   # 95.00 >= FORMATION_CAPACITY_MIN_PCT 92.00"
            - "Plant.${plant_id}.emission_reserved_g == 0.00 and Plant.${plant_id}.emission_consumed_g == 250.00"
            - "Plant.${plant_id}.formation_energy_charge_cents == 2126"

      - name: worker_exposure_air_twa_90d_vs_blood_peak_180d
        grounds:
          - calculations.worker_exposure_index
          - entities.Worker.fields.exposure_index
          - entities.Worker.fields.exposure_index_variant
          - entities.ExposureSample.fields.resulting_worker_index
          - entities.ExposureSample.fields.resulting_variant
          - state_machines.Worker.removal_status.ACTIVE_to_MEDICAL_REMOVAL
        distinguishing_aspect: |
          Industrial-hygiene risk scoring on a Worker (a different entity domain from the
          FormationRun energy accounting): the air_twa_90d variant is a duration-weighted
          90-day mean against the 50 ug/m3 PEL and yields 80.00, while the blood_peak_180d
          variant is an unweighted 180-day maximum against the 30 ug/dL BLL limit and yields
          110.00 for the same worker on the same day - and only the second variant crosses
          REMOVAL_INDEX_THRESHOLD.
        test_recipe:
          setup:
            - "One plant with a SAFETY-class officer and one PRODUCTION worker hired 2020-01-01."
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "One AIR sample already on file: 60.00 ug/m3 over 480 minutes on 2026-08-15."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlantAdmin
            - call: "POST /plants"
              payload: { name: "Riverside Battery Works", site_code: "PLT-RIV", licensed_chemistries: ["LEAD_ACID"], permit_status: "ACTIVE", monthly_lead_emission_permit_g: 100000.00, peak_tariff_cents_per_kwh: 25.00, offpeak_tariff_cents_per_kwh: 15.00, lead_initial_inventory_kg: 10000.000 }
              as: PlantAdmin
              captures: { plant_id: $.data.id }
            - call: "POST /workers"
              payload: { plant_id: "${plant_id}", full_name: "Sam Safety", job_class: "SAFETY", hire_date: "2020-01-01T00:00:00Z" }
              as: PlantAdmin
              captures: { saf_a_id: $.data.id }
            - call: "POST /workers"
              payload: { plant_id: "${plant_id}", full_name: "Pat Plate", job_class: "PRODUCTION", hire_date: "2020-01-01T00:00:00Z" }
              as: PlantAdmin
              captures: { worker_id: $.data.id }
            - call: "POST /workers/${worker_id}/exposure-samples"
              payload: { sample_type: "AIR", sampled_at: "2026-08-15T14:00:00Z", air_lead_ug_per_m3: 60.00, sample_duration_minutes: 480 }
              as: SafetyOfficer
              as_user_id: "${saf_a_id}"
              captures: { air_1_index: $.data.resulting_worker_index }
          trigger:
            - call: "POST /workers/${worker_id}/exposure-samples"
              payload: { sample_type: "AIR", sampled_at: "2026-08-20T14:00:00Z", air_lead_ug_per_m3: 20.00, sample_duration_minutes: 480 }
              as: SafetyOfficer
              as_user_id: "${saf_a_id}"
              captures: { air_2_index: $.data.resulting_worker_index, air_2_variant: $.data.resulting_variant }
            - call: "POST /workers/${worker_id}/exposure-samples"
              payload: { sample_type: "BLOOD", sampled_at: "2026-08-25T09:00:00Z", blood_lead_ug_per_dl: 33.0 }
              as: SafetyOfficer
              as_user_id: "${saf_a_id}"
              captures: { blood_index: $.data.resulting_worker_index, blood_variant: $.data.resulting_variant, blood_removed: $.data.triggered_removal }
          assert:
            - "${air_1_index} == 120.00   # single 60.00 ug/m3 sample: 60/50*100"
            - "${air_2_index} == 80.00    # duration-weighted twa 40.000 over the two AIR samples"
            - "${air_2_variant} == AIR_TWA_90D"
            - "${blood_index} == 110.00   # 33.0/30*100, unweighted peak"
            - "${blood_variant} == BLOOD_PEAK_180D"
            - "${blood_removed} == true"
            - "Worker.${worker_id}.exposure_index == 110.00 and Worker.${worker_id}.exposure_index_variant == BLOOD_PEAK_180D"
            - "Worker.${worker_id}.removal_status == MEDICAL_REMOVAL and Worker.${worker_id}.removal_count == 1"
            - "GET /workers/${worker_id}/exposure-index returns air_twa_90d_index == 80.00 and blood_peak_180d_index == 110.00 and governing_variant == BLOOD_PEAK_180D"
            - "Plant.${plant_id}.open_medical_removal_count == 1 and Plant.${plant_id}.compliance_posture == RESTRICTED"

  - rule_id: combinatorial_formula
    instances:

      - name: formation_charge_per_band_rounding_order_mode_b
        grounds:
          - calculations.formation_energy_charge
          - entities.Plant.fields.peak_tariff_cents_per_kwh
          - entities.Plant.fields.offpeak_tariff_cents_per_kwh
          - entities.FormationRun.fields.final_charge_cents
          - state_machines.FormationRun.run_state.CHARGING_to_COMPLETED
        distinguishing_aspect: |
          Mode (b) nested rounding: the pinned order rounds EACH tariff band to whole cents
          before summing, so 62.50 kWh peak * 25 = 1562.50 -> 1563 and 37.50 kWh off-peak *
          15 = 562.50 -> 563 give final_charge_cents 2126, whereas the rejected sum-then-round
          order gives 2125 for byte-identical inputs - a one-cent gap that only appears
          because both band products land exactly on a half cent.
        test_recipe:
          setup:
            - "Plant tariffs 25 / 15 cents per kWh; LEAD_ACID lot of quantity 9 in FORMATION; bay rated 20.00 kW."
            - "Run scheduled 2026-09-02T06:00Z-12:00Z, started 05:00Z, actual window 05:00Z-13:00Z = 3 off-peak + 5 peak hours."
            - "Metered energy exactly 100.00 kWh so the 5/8 - 3/8 split lands on 62.50 / 37.50 kWh."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlantAdmin
            - call: "POST /plants"
              payload: { name: "Riverside Battery Works", site_code: "PLT-RIV", licensed_chemistries: ["LEAD_ACID"], permit_status: "ACTIVE", monthly_lead_emission_permit_g: 100000.00, peak_tariff_cents_per_kwh: 25.00, offpeak_tariff_cents_per_kwh: 15.00, lead_initial_inventory_kg: 10000.000 }
              as: PlantAdmin
              captures: { plant_id: $.data.id }
            - call: "POST /workers"
              payload: { plant_id: "${plant_id}", full_name: "Ada Engineer", job_class: "ENGINEER", hire_date: "2020-01-01T00:00:00Z" }
              as: PlantAdmin
              captures: { eng_a_id: $.data.id }
            - call: "POST /workers"
              payload: { plant_id: "${plant_id}", full_name: "Ben Engineer", job_class: "ENGINEER", hire_date: "2020-01-01T00:00:00Z" }
              as: PlantAdmin
              captures: { eng_b_id: $.data.id }
            - call: "POST /workers"
              payload: { plant_id: "${plant_id}", full_name: "Cara Supervisor", job_class: "PRODUCTION", hire_date: "2020-01-01T00:00:00Z" }
              as: PlantAdmin
              captures: { sup_a_id: $.data.id }
            - call: "POST /cell-designs"
              payload: { code: "CD-LEAD-465", chemistry: "LEAD_ACID", plate_type: "TUBULAR", cells_per_battery: 12, cell_nominal_voltage_v: 2.0, nominal_capacity_ah: 465.0, rated_cycles: 1500, warranty_months: 60, pack_weight_kg: 900.000, lead_content_kg: 300.000, formation_charge_factor: 1.5, list_price_cents: 500000 }
              as: DesignEngineer
              as_user_id: "${eng_a_id}"
              captures: { design_id: $.data.id }
            - call: "POST /cell-designs/${design_id}/review-actions"
              payload: { action: "SUBMIT" }
              as: DesignEngineer
              as_user_id: "${eng_a_id}"
            - call: "POST /cell-designs/${design_id}/review-actions"
              payload: { action: "APPROVE" }
              as: DesignEngineer
              as_user_id: "${eng_b_id}"
            - call: "POST /formation-bays"
              payload: { plant_id: "${plant_id}", bay_code: "BAY-1", rated_power_kw: 20.00, cooldown_minutes: 45 }
              as: PlantAdmin
              captures: { bay_id: $.data.id }
            - call: "POST /production-lots"
              payload: { plant_id: "${plant_id}", cell_design_id: "${design_id}", lot_code: "LOT-0001", quantity: 9 }
              as: ProductionSupervisor
              as_user_id: "${sup_a_id}"
              captures: { lot_id: $.data.id }
            - call: "POST /production-lots/${lot_id}/advance"
              payload: { to_state: "PLATE_PRODUCTION" }
              as: ProductionSupervisor
              as_user_id: "${sup_a_id}"
            - call: "POST /production-lots/${lot_id}/advance"
              payload: { to_state: "FORMATION" }
              as: ProductionSupervisor
              as_user_id: "${sup_a_id}"
            - call: "POST /formation-runs"
              payload: { lot_id: "${lot_id}", bay_id: "${bay_id}", scheduled_start_at: "2026-09-02T06:00:00Z", scheduled_end_at: "2026-09-02T12:00:00Z" }
              as: ProductionSupervisor
              as_user_id: "${sup_a_id}"
              captures: { run_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-02T05:00:00Z" }
              as: PlantAdmin
            - call: "POST /formation-runs/${run_id}/start"
              payload: { actual_start_at: "2026-09-02T05:00:00Z" }
              as: ProductionSupervisor
              as_user_id: "${sup_a_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-02T13:00:00Z" }
              as: PlantAdmin
          trigger:
            - call: "POST /formation-runs/${run_id}/complete"
              payload: { metered_energy_kwh: 100.00, formation_capacity_pct: 92.00, actual_end_at: "2026-09-02T13:00:00Z" }
              as: ProductionSupervisor
              as_user_id: "${sup_a_id}"
              captures: { final_cents: $.data.final_charge_cents }
          assert:
            - "${final_cents} == 2126"
            - "${final_cents} != 2125   # 2125 is the value produced by the REJECTED sum-then-round order"
            - "FormationRun.${run_id}.actual_peak_hours == 5.0000 and FormationRun.${run_id}.actual_offpeak_hours == 3.0000"
            - "Plant.${plant_id}.formation_energy_charge_cents == 2126"
            - "FormationRun.${run_id}.capacity_validation_result == PASS   # 92.00 is exactly FORMATION_CAPACITY_MIN_PCT"

      - name: motive_power_sizing_design_charger_circular_order_mode_c
        grounds:
          - calculations.motive_power_sizing
          - entities.FleetSizingRequest.fields.required_ah
          - entities.FleetSizingRequest.fields.selected_cell_design_id
          - entities.FleetSizingRequest.fields.selected_charger_id
          - entities.FleetSizingRequest.fields.selected_charge_hours
          - entities.FleetSizingRequest.fields.evaluated_design_count
          - validations[priority=15]
        distinguishing_aspect: |
          Mode (c) circular-looking dependency with a pinned evaluation order: required_ah
          depends on the candidate's chemistry (DoD cap) while charger feasibility depends on
          the candidate's capacity, so the selector walks designs by nominal_capacity_ah ASC
          and skips the 800.0 Ah LEAD_ACID pack (required_ah 791, only charger needs 7.36 h >
          the 6.00 h window) to select the 900.0 Ah LITHIUM_LFP pack (required_ah 703,
          charge 4.25 h) - a cheapest-charger-first or capacity-only order would pick the
          lead pack and fail.
        test_recipe:
          setup:
            - "One plant; two APPROVED designs at 24.0 V nominal: DA = LEAD_ACID 800.0 Ah / 1200.000 kg / 700000 cents, DB = LITHIUM_LFP 900.0 Ah / 1000.000 kg / 900000 cents."
            - "Two AVAILABLE chargers at 24.0 V: C1 LEAD_ACID 100 A / 120000 cents, C3 LITHIUM_LFP 200 A / 250000 cents."
            - "Application: 6 CLASS_I forklifts, 6.00 kWh per shift, 2 shifts/day, 5 C ambient, 24.0 V required, 1500.000 kg compartment, 6.00 h charge window, chemistry_preference ANY."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlantAdmin
            - call: "POST /plants"
              payload: { name: "Riverside Battery Works", site_code: "PLT-RIV", licensed_chemistries: ["LEAD_ACID", "LITHIUM_LFP"], permit_status: "ACTIVE", monthly_lead_emission_permit_g: 100000.00, peak_tariff_cents_per_kwh: 25.00, offpeak_tariff_cents_per_kwh: 15.00, lead_initial_inventory_kg: 10000.000 }
              as: PlantAdmin
              captures: { plant_id: $.data.id }
            - call: "POST /workers"
              payload: { plant_id: "${plant_id}", full_name: "Ada Engineer", job_class: "ENGINEER", hire_date: "2020-01-01T00:00:00Z" }
              as: PlantAdmin
              captures: { eng_a_id: $.data.id }
            - call: "POST /workers"
              payload: { plant_id: "${plant_id}", full_name: "Ben Engineer", job_class: "ENGINEER", hire_date: "2020-01-01T00:00:00Z" }
              as: PlantAdmin
              captures: { eng_b_id: $.data.id }
            - call: "POST /cell-designs"
              payload: { code: "CD-DA-800", chemistry: "LEAD_ACID", plate_type: "TUBULAR", cells_per_battery: 12, cell_nominal_voltage_v: 2.0, nominal_capacity_ah: 800.0, rated_cycles: 1500, warranty_months: 60, pack_weight_kg: 1200.000, lead_content_kg: 500.000, formation_charge_factor: 1.5, list_price_cents: 700000 }
              as: DesignEngineer
              as_user_id: "${eng_a_id}"
              captures: { design_da_id: $.data.id }
            - call: "POST /cell-designs/${design_da_id}/review-actions"
              payload: { action: "SUBMIT" }
              as: DesignEngineer
              as_user_id: "${eng_a_id}"
            - call: "POST /cell-designs/${design_da_id}/review-actions"
              payload: { action: "APPROVE" }
              as: DesignEngineer
              as_user_id: "${eng_b_id}"
            - call: "POST /cell-designs"
              payload: { code: "CD-DB-900", chemistry: "LITHIUM_LFP", plate_type: "PRISMATIC_CELL", cells_per_battery: 8, cell_nominal_voltage_v: 3.0, nominal_capacity_ah: 900.0, rated_cycles: 3000, warranty_months: 84, pack_weight_kg: 1000.000, lead_content_kg: 0.000, formation_charge_factor: 1.1, list_price_cents: 900000 }
              as: DesignEngineer
              as_user_id: "${eng_a_id}"
              captures: { design_db_id: $.data.id }
            - call: "POST /cell-designs/${design_db_id}/review-actions"
              payload: { action: "SUBMIT" }
              as: DesignEngineer
              as_user_id: "${eng_a_id}"
            - call: "POST /cell-designs/${design_db_id}/review-actions"
              payload: { action: "APPROVE" }
              as: DesignEngineer
              as_user_id: "${eng_b_id}"
            - call: "POST /chargers"
              payload: { model_code: "CHG-C1-100A", chemistry_compatibility: "LEAD_ACID", output_voltage_v: 24.0, output_amps: 100, charge_profile: "FERRO", price_cents: 120000 }
              as: FleetEngineer
              captures: { charger_c1_id: $.data.id }
            - call: "POST /chargers"
              payload: { model_code: "CHG-C3-200A", chemistry_compatibility: "LITHIUM_LFP", output_voltage_v: 24.0, output_amps: 200, charge_profile: "LITHIUM_CCCV", price_cents: 250000 }
              as: FleetEngineer
              captures: { charger_c3_id: $.data.id }
          trigger:
            - call: "POST /fleet-sizing-requests"
              payload: { plant_id: "${plant_id}", application_name: "Cold store pallet handling", forklift_class: "CLASS_I", forklift_count: 6, shift_energy_kwh_per_shift: 6.00, shifts_per_day: 2, ambient_temp_c: 5, required_voltage_v: 24.0, compartment_max_kg: 1500.000, charge_window_hours: 6.00, chemistry_preference: "ANY" }
              as: FleetEngineer
              captures: { sizing_id: $.data.id, sel_design: $.data.selected_cell_design_id, sel_charger: $.data.selected_charger_id }
          assert:
            - "FleetSizingRequest.${sizing_id}.daily_energy_kwh == 12.00"
            - "FleetSizingRequest.${sizing_id}.temp_derate_factor == 1.1000   # min(1 + (15-5)*0.01, 1.25)"
            - "FleetSizingRequest.${sizing_id}.reserve_factor == 1.15         # shifts_per_day >= 2"
            - "FleetSizingRequest.${sizing_id}.evaluated_design_count == 2"
            - "${sel_design} == ${design_db_id}   # the 800.0 Ah lead pack was evaluated FIRST and skipped for charger infeasibility"
            - "${sel_charger} == ${charger_c3_id}"
