# =============================================================================
# Task 1541 — Sports Agency Contract & Cap Management
# SCAFFOLD_DIFFICULTY_DESIGN.yaml — §1.8 Test Targeting Index
# 2 instances per each of the 9 difficulty rules (18 total).
# =============================================================================

scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  # Rule 1 — dual_variant_calc (≥2 instances, different entity domains)
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: contract_aav_ltbe_vs_ultbe_projection
        grounds:
          - calculations.contract_aav
          - entities.Contract.fields.aav_cents
        distinguishing_aspect: |
          Same base_salary/escalator/bonus/incentive inputs produce different
          aav_cents when incentives are treated as LTBE (included in
          per_year_cap_hit) vs ULTBE (excluded). Entity domain: Contract /
          salary-cap accounting. With base=10,000,000, escalator=0.10, years=3,
          bonus=3,000,000, incentive=1,500,000, the LTBE variant yields
          aav_cents = 12,533,333 while a hypothetical ULTBE variant would
          yield round_half_up((33,100,000 + 3,000,000) / 3) = 12,033,333 —
          a delta of exactly 500,000 cents (the incentive_per_year term).
        test_recipe:
          setup:
            - "LeagueOfficer creates Team T1 and CapSeason for 2026 (cap_limit 200,000,000, luxury 250,000,000)"
            - "LeagueOfficer creates Agency A1 (fee_cap_pct 0.03)"
            - "AgencyManager AM1 registers and certifies Agent AG1"
            - "AG1 registers Client C1 (primary_agent_id=AG1)"
          setup_api_calls:
            - call: "POST /teams"
              payload: { name: "Meteor FC", league_code: "NBA" }
              as: LeagueOfficer
              captures: { team_id: $.data.id }
            - call: "POST /teams/${team_id}/cap_seasons"
              payload: { season_year: 2026, cap_limit_cents: 200000000, luxury_threshold_cents: 250000000 }
              as: LeagueOfficer
              captures: { cap_season_id: $.data.id }
            - call: "POST /agencies"
              payload: { name: "Apex Sports", fee_cap_pct: 0.03 }
              as: LeagueOfficer
              captures: { agency_id: $.data.id }
            - call: "POST /agencies/${agency_id}/agents"
              payload: { full_name: "Alice Agent", email: "alice@apex.example", cert_number: "CERT-001", is_manager: true }
              as: AgencyManager
              captures: { manager_id: $.data.id }
            - call: "POST /agencies/${agency_id}/agents/${manager_id}/certify"
              payload: {}
              as: AgencyManager
              as_user_id: "${manager_id}"
            - call: "POST /agencies/${agency_id}/agents"
              payload: { full_name: "Bob Agent", email: "bob@apex.example", cert_number: "CERT-002" }
              as: AgencyManager
              as_user_id: "${manager_id}"
              captures: { agent_id: $.data.id }
            - call: "POST /agencies/${agency_id}/agents/${agent_id}/certify"
              payload: {}
              as: AgencyManager
              as_user_id: "${manager_id}"
            - call: "POST /agencies/${agency_id}/clients"
              payload: { primary_agent_id: "${agent_id}", full_name: "Carlos Client", position: "PG" }
              as: Agent
              as_user_id: "${agent_id}"
              captures: { client_id: $.data.id }
          trigger:
            - call: "POST /agencies/${agency_id}/clients/${client_id}/contracts"
              payload: { team_id: "${team_id}", cap_season_id: "${cap_season_id}", start_season_year: 2026, years: 3, base_salary_cents: 10000000, guaranteed_cents: 25000000, signing_bonus_cents: 3000000, incentive_cents: 1500000, escalator_pct: 0.10 }
              as: Agent
              as_user_id: "${agent_id}"
              captures: { contract_id: $.data.id, aav: $.data.aav_cents, total_value: $.data.total_value_cents }
          assert:
            - "Contract.${contract_id}.aav_cents == 12533333  # LTBE-inclusive: round_half_up(37,600,000 / 3)"
            - "Contract.${contract_id}.total_value_cents == 37600000  # base_sum 33,100,000 + bonus 3,000,000 + incentive 1,500,000"
            - "Hypothetical ULTBE aav_cents would be 12,033,333 — LTBE inclusion differs by exactly 500,000 cents (incentive_per_year term)"

      - name: endorsement_agent_fee_tiered_vs_flat_variant
        grounds:
          - calculations.endorsement_agent_fee
          - entities.EndorsementDeal.fields.agent_fee_cents
        distinguishing_aspect: |
          EndorsementDeal agent_fee_cents is computed via a tiered rate
          (10/15/20% by deal size) THEN capped at Agency.fee_cap_pct —
          different entity domain (EndorsementDeal / marketing income) from
          contract_aav. A $2M deal under fee_cap_pct=0.03 yields
          min(30,000,000, 6,000,000) = 6,000,000 (cap binds); a $500K deal
          under a generous fee_cap_pct=0.20 yields min(5,000,000, 10,000,000)
          = 5,000,000 (tier binds). The two inputs produce different binding
          behaviors from the same rule — the dual-variant axis is which
          branch (tier vs cap) wins.
        test_recipe:
          setup:
            - "LeagueOfficer creates Agency A1 with fee_cap_pct 0.03 (cap will bind)"
            - "LeagueOfficer creates Agency A2 with fee_cap_pct 0.20 (tier will bind)"
            - "Both agencies have a certified agent + an active client"
            - "Logical clock remains at default 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "CapBound Agency", fee_cap_pct: 0.03 }
              as: LeagueOfficer
              captures: { agency1_id: $.data.id }
            - call: "POST /agencies"
              payload: { name: "TierBound Agency", fee_cap_pct: 0.20 }
              as: LeagueOfficer
              captures: { agency2_id: $.data.id }
            - call: "POST /agencies/${agency1_id}/agents"
              payload: { full_name: "Manager One", email: "m1@a.example", cert_number: "M001", is_manager: true }
              as: AgencyManager
              captures: { m1_id: $.data.id }
            - call: "POST /agencies/${agency1_id}/agents/${m1_id}/certify"
              payload: {}
              as: AgencyManager
              as_user_id: "${m1_id}"
            - call: "POST /agencies/${agency1_id}/agents"
              payload: { full_name: "Agent One", email: "a1@a.example", cert_number: "A001" }
              as: AgencyManager
              as_user_id: "${m1_id}"
              captures: { a1_id: $.data.id }
            - call: "POST /agencies/${agency1_id}/agents/${a1_id}/certify"
              payload: {}
              as: AgencyManager
              as_user_id: "${m1_id}"
            - call: "POST /agencies/${agency1_id}/clients"
              payload: { primary_agent_id: "${a1_id}", full_name: "Client One", position: "SG" }
              as: Agent
              as_user_id: "${a1_id}"
              captures: { c1_id: $.data.id }
            - call: "POST /agencies/${agency2_id}/agents"
              payload: { full_name: "Manager Two", email: "m2@b.example", cert_number: "M002", is_manager: true }
              as: AgencyManager
              captures: { m2_id: $.data.id }
            - call: "POST /agencies/${agency2_id}/agents/${m2_id}/certify"
              payload: {}
              as: AgencyManager
              as_user_id: "${m2_id}"
            - call: "POST /agencies/${agency2_id}/agents"
              payload: { full_name: "Agent Two", email: "a2@b.example", cert_number: "A002" }
              as: AgencyManager
              as_user_id: "${m2_id}"
              captures: { a2_id: $.data.id }
            - call: "POST /agencies/${agency2_id}/agents/${a2_id}/certify"
              payload: {}
              as: AgencyManager
              as_user_id: "${m2_id}"
            - call: "POST /agencies/${agency2_id}/clients"
              payload: { primary_agent_id: "${a2_id}", full_name: "Client Two", position: "SF" }
              as: Agent
              as_user_id: "${a2_id}"
              captures: { c2_id: $.data.id }
            - call: "POST /agencies/${agency1_id}/clients/${c1_id}/endorsements"
              payload: { brand_name: "ShoeBrand", deal_value_cents: 200000000, start_date: "2026-08-01T00:00:00Z", end_date: "2027-08-01T00:00:00Z" }
              as: Agent
              as_user_id: "${a1_id}"
              captures: { deal1_id: $.data.id }
            - call: "POST /agencies/${agency2_id}/clients/${c2_id}/endorsements"
              payload: { brand_name: "DrinkCo", deal_value_cents: 50000000, start_date: "2026-08-01T00:00:00Z", end_date: "2027-08-01T00:00:00Z" }
              as: Agent
              as_user_id: "${a2_id}"
              captures: { deal2_id: $.data.id }
          trigger:
            - call: "POST /agencies/${agency1_id}/clients/${c1_id}/endorsements/${deal1_id}/approve"
              payload: {}
              as: AgencyManager
              as_user_id: "${m1_id}"
            - call: "POST /agencies/${agency2_id}/clients/${c2_id}/endorsements/${deal2_id}/approve"
              payload: {}
              as: AgencyManager
              as_user_id: "${m2_id}"
          assert:
            - "EndorsementDeal.${deal1_id}.agent_fee_cents == 6000000   # cap branch wins: min(30M, 6M)"
            - "EndorsementDeal.${deal2_id}.agent_fee_cents == 5000000   # tier branch wins: min(5M, 10M)"
            - "EndorsementDeal.${deal1_id}.agent_fee_cents != EndorsementDeal.${deal2_id}.agent_fee_cents  # divergent variants on same calculation rule"

  # ---------------------------------------------------------------------------
  # Rule 2 — combinatorial_formula (≥2 instances, different modes a/b/c)
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: contract_aav_nested_rounding_order
        grounds:
          - calculations.contract_aav
        distinguishing_aspect: |
          Mode (b) — nested rounding where the order matters. contract_aav
          rounds at three distinct steps: per-year escalator application,
          bonus/incentive proration, and the final aav division. The scaffold
          pins per-year-then-sum: per_year_cap_hit values are computed and
          rounded first, then summed, then divided. The alternative order
          (sum exact, then round) produces a different total. With
          base=10,000,000, escalator=0.075, years=2, bonus=1,000,001,
          incentive=500,001: per-year bases are 10,000,000 and
          round_half_up(10,000,000*1.075)=10,750,000; bonus_prorated =
          round_half_up(1,000,001/2) = 500,001 (rounds up from 500,000.5);
          incentive_per_year = round_half_up(500,001/2) = 250,001; per-year
          cap hits = 10,750,001 and 11,500,001; total = 22,250,002;
          aav = round_half_up(22,250,002/2) = 11,125,001. A different
          rounding order would produce a different cents value.
        test_recipe:
          setup:
            - "Agency, certified agent, client, team, cap season all provisioned"
          setup_api_calls:
            - call: "POST /teams"
              payload: { name: "Rockets", league_code: "NBA" }
              as: LeagueOfficer
              captures: { team_id: $.data.id }
            - call: "POST /teams/${team_id}/cap_seasons"
              payload: { season_year: 2026, cap_limit_cents: 300000000, luxury_threshold_cents: 350000000 }
              as: LeagueOfficer
              captures: { cs_id: $.data.id }
            - call: "POST /agencies"
              payload: { name: "Precision Agency", fee_cap_pct: 0.04 }
              as: LeagueOfficer
              captures: { agency_id: $.data.id }
            - call: "POST /agencies/${agency_id}/agents"
              payload: { full_name: "M", email: "m@p.example", cert_number: "MM1", is_manager: true }
              as: AgencyManager
              captures: { m_id: $.data.id }
            - call: "POST /agencies/${agency_id}/agents/${m_id}/certify"
              payload: {}
              as: AgencyManager
              as_user_id: "${m_id}"
            - call: "POST /agencies/${agency_id}/agents"
              payload: { full_name: "A", email: "a@p.example", cert_number: "AA1" }
              as: AgencyManager
              as_user_id: "${m_id}"
              captures: { a_id: $.data.id }
            - call: "POST /agencies/${agency_id}/agents/${a_id}/certify"
              payload: {}
              as: AgencyManager
              as_user_id: "${m_id}"
            - call: "POST /agencies/${agency_id}/clients"
              payload: { primary_agent_id: "${a_id}", full_name: "P", position: "C" }
              as: Agent
              as_user_id: "${a_id}"
              captures: { c_id: $.data.id }
          trigger:
            - call: "POST /agencies/${agency_id}/clients/${c_id}/contracts"
              payload: { team_id: "${team_id}", cap_season_id: "${cs_id}", start_season_year: 2026, years: 2, base_salary_cents: 10000000, guaranteed_cents: 15000000, signing_bonus_cents: 1000001, incentive_cents: 500001, escalator_pct: 0.075 }
              as: Agent
              as_user_id: "${a_id}"
              captures: { contract_id: $.data.id }
          assert:
            - "Contract.${contract_id}.aav_cents == 11125001  # per-year rounding then division, per scaffold's pinned order"
            - "Contract.${contract_id}.total_value_cents == 22250002  # 20,750,000 base_sum + 1,000,001 bonus + 500,001 incentive"

      - name: proposal_accept_capacity_three_input_threshold
        grounds:
          - calculations.cap_space_projection
          - validations[priority=9]
          - state_machines.Proposal.SUBMITTED_to_ACCEPTED
        distinguishing_aspect: |
          Mode (a) — a formula with ≥3 inputs and non-linear interaction.
          Acceptance requires THREE inputs to interact: committed_cents,
          reserved_cents (which is decremented by the accepted proposal's own
          aav BEFORE the hard-cap check), and proposed_aav_cents, evaluated
          against TWO thresholds (luxury_threshold at submit-time vs
          cap_limit at accept-time). The hard cap check is
          `committed + proposed_aav <= cap_limit`; the reserved release is a
          side effect, so reserved_cents does not enter the formula at
          accept-time (it is reserved against luxury only). This conditional
          branch on endpoint (submit vs accept) and on entity state
          (reserved_included vs excluded) makes the formula non-linear.
        test_recipe:
          setup:
            - "CapSeason 2026: cap_limit=200,000,000, luxury=250,000,000"
            - "Existing SIGNED contract contributing committed_cents=100,000,000"
            - "An open (SUBMITTED) proposal P1 with proposed_aav_cents=50,000,000 → reserved=50,000,000"
            - "A second DRAFT proposal P2 with proposed_aav_cents=100,000,000 ready to submit+accept"
          setup_api_calls:
            - call: "POST /teams"
              payload: { name: "Capsters", league_code: "NBA" }
              as: LeagueOfficer
              captures: { team_id: $.data.id }
            - call: "POST /teams/${team_id}/cap_seasons"
              payload: { season_year: 2026, cap_limit_cents: 200000000, luxury_threshold_cents: 250000000 }
              as: LeagueOfficer
              captures: { cs_id: $.data.id }
            - call: "POST /agencies"
              payload: { name: "Threshold Agency", fee_cap_pct: 0.03 }
              as: LeagueOfficer
              captures: { agency_id: $.data.id }
            - call: "POST /agencies/${agency_id}/agents"
              payload: { full_name: "Mgr", email: "m@t.example", cert_number: "MT1", is_manager: true }
              as: AgencyManager
              captures: { m_id: $.data.id }
            - call: "POST /agencies/${agency_id}/agents/${m_id}/certify"
              payload: {}
              as: AgencyManager
              as_user_id: "${m_id}"
            - call: "POST /agencies/${agency_id}/agents"
              payload: { full_name: "Agt", email: "a@t.example", cert_number: "AT1" }
              as: AgencyManager
              as_user_id: "${m_id}"
              captures: { a_id: $.data.id }
            - call: "POST /agencies/${agency_id}/agents/${a_id}/certify"
              payload: {}
              as: AgencyManager
              as_user_id: "${m_id}"
            - call: "POST /agencies/${agency_id}/clients"
              payload: { primary_agent_id: "${a_id}", full_name: "P1", position: "PF" }
              as: Agent
              as_user_id: "${a_id}"
              captures: { c1_id: $.data.id }
            # Establish committed_cents=100M via a signed contract for client c1
            - call: "POST /agencies/${agency_id}/clients/${c1_id}/contracts"
              payload: { team_id: "${team_id}", cap_season_id: "${cs_id}", start_season_year: 2026, years: 1, base_salary_cents: 100000000, guaranteed_cents: 100000000, signing_bonus_cents: 0, incentive_cents: 0, escalator_pct: 0 }
              as: Agent
              as_user_id: "${a_id}"
              captures: { contract1_id: $.data.id }
            - call: "POST /agencies/${agency_id}/clients/${c1_id}/contracts/${contract1_id}/proposals"
              payload: { proposed_by_agent_id: "${a_id}", proposed_aav_cents: 100000000, proposed_guaranteed_cents: 100000000 }
              as: Agent
              as_user_id: "${a_id}"
              captures: { p1_id: $.data.id, cap_v_1: $.data.version }
            - call: "GET /teams/${team_id}/cap_seasons/${cs_id}"
              as: LeagueOfficer
              captures: { cs_v_before_p1: $.data.version }
            - call: "POST /agencies/${agency_id}/clients/${c1_id}/contracts/${contract1_id}/proposals/${p1_id}/submit"
              payload: { expected_cap_season_version: "${cs_v_before_p1}" }
              as: Agent
              as_user_id: "${a_id}"
            - call: "POST /agencies/${agency_id}/clients/${c1_id}/contracts/${contract1_id}/proposals/${p1_id}/accept"
              payload: {}
              as: Team
              as_user_id: "${team_id}"
            - call: "GET /agencies/${agency_id}/clients/${c1_id}/contracts/${contract1_id}"
              as: Agent
              as_user_id: "${a_id}"
              captures: { contract1_v: $.data.version }
            - call: "POST /agencies/${agency_id}/clients/${c1_id}/contracts/${contract1_id}/sign"
              payload: { expected_contract_version: "${contract1_v}" }
              as: Agent
              as_user_id: "${a_id}"
            # Now committed=100M, reserved=0. Open second client+contract for P2.
            - call: "POST /agencies/${agency_id}/clients"
              payload: { primary_agent_id: "${a_id}", full_name: "P2", position: "SG" }
              as: Agent
              as_user_id: "${a_id}"
              captures: { c2_id: $.data.id }
            - call: "POST /agencies/${agency_id}/clients/${c2_id}/contracts"
              payload: { team_id: "${team_id}", cap_season_id: "${cs_id}", start_season_year: 2026, years: 1, base_salary_cents: 50000000, guaranteed_cents: 50000000, signing_bonus_cents: 0, incentive_cents: 0, escalator_pct: 0 }
              as: Agent
              as_user_id: "${a_id}"
              captures: { contract2_id: $.data.id }
            - call: "POST /agencies/${agency_id}/clients/${c2_id}/contracts/${contract2_id}/proposals"
              payload: { proposed_by_agent_id: "${a_id}", proposed_aav_cents: 50000000, proposed_guaranteed_cents: 50000000 }
              as: Agent
              as_user_id: "${a_id}"
              captures: { p2_id: $.data.id }
            - call: "GET /teams/${team_id}/cap_seasons/${cs_id}"
              as: LeagueOfficer
              captures: { cs_v_pre_p2: $.data.version }
            - call: "POST /agencies/${agency_id}/clients/${c2_id}/contracts/${contract2_id}/proposals/${p2_id}/submit"
              payload: { expected_cap_season_version: "${cs_v_pre_p2}" }
              as: Agent
              as_user_id: "${a_id}"
            # reserved=50M now. Third contract with proposed_aav=100M will test accept boundary.
            - call: "POST /agencies/${agency_id}/clients"
              payload: { primary_agent_id: "${a_id}", full_name: "P3", position: "C" }
              as: Agent
              as_user_id: "${a_id}"
              captures: { c3_id: $.data.id }
            - call: "POST /agencies/${agency_id}/clients/${c3_id}/contracts"
              payload: { team_id: "${team_id}", cap_season_id: "${cs_id}", start_season_year: 2026, years: 1, base_salary_cents: 100000000, guaranteed_cents: 100000000, signing_bonus_cents: 0, incentive_cents: 0, escalator_pct: 0 }
              as: Agent
              as_user_id: "${a_id}"
              captures: { contract3_id: $.data.id }
            - call: "POST /agencies/${agency_id}/clients/${c3_id}/contracts/${contract3_id}/proposals"
              payload: { proposed_by_agent_id: "${a_id}", proposed_aav_cents: 100000000, proposed_guaranteed_cents: 100000000 }
              as: Agent
              as_user_id: "${a_id}"
              captures: { p3_id: $.data.id }
            - call: "GET /teams/${team_id}/cap_seasons/${cs_id}"
              as: LeagueOfficer
              captures: { cs_v_pre_p3: $.data.version }
            - call: "POST /agencies/${agency_id}/clients/${c3_id}/contracts/${contract3_id}/proposals/${p3_id}/submit"
              payload: { expected_cap_season_version: "${cs_v_pre_p3}" }
              as: Agent
              as_user_id: "${a_id}"
            # After p3 submit: committed=100M, reserved=150M (50+100). Luxury check passed: 100+150 <= 250.
          trigger:
            # Accept P3 — boundary: committed(100M) + proposed(100M) = 200M == cap_limit (200M). Should SUCCEED.
            - call: "POST /agencies/${agency_id}/clients/${c3_id}/contracts/${contract3_id}/proposals/${p3_id}/accept"
              payload: {}
              as: Team
              as_user_id: "${team_id}"
          assert:
            - "Proposal.${p3_id}.status == ACCEPTED  # boundary: committed+proposed == cap_limit, so accept succeeds (<=)"
            - "CapSeason.${cs_id}.committed_cents == 100000000   # accept does NOT post; only sign does"
            - "CapSeason.${cs_id}.reserved_cents == 50000000    # p3's 100M reservation released; p2's 50M still reserved"

  # ---------------------------------------------------------------------------
  # Rule 3 — non_linear_state_machine (≥2 instances, different entities)
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: proposal_counter_resubmit_cycle
        grounds:
          - state_machines.Proposal.SUBMITTED_to_COUNTERED
          - state_machines.Proposal.COUNTERED_to_SUBMITTED
        distinguishing_aspect: |
          Proposal has a true cycle: SUBMITTED -> COUNTERED -> SUBMITTED ->
          COUNTERED -> ... Multiple rounds possible; each round adjusts
          CapSeason.reserved_cents. This is non-linear (cyclic) on the
          Proposal entity.
        test_recipe:
          setup:
            - "Agency, certified agent, client, team, cap season provisioned"
            - "Contract in NEGOTIATING; Proposal P1 in DRAFT"
          setup_api_calls:
            - call: "POST /teams"
              payload: { name: "Cycle Team", league_code: "NBA" }
              as: LeagueOfficer
              captures: { team_id: $.data.id }
            - call: "POST /teams/${team_id}/cap_seasons"
              payload: { season_year: 2026, cap_limit_cents: 500000000, luxury_threshold_cents: 600000000 }
              as: LeagueOfficer
              captures: { cs_id: $.data.id }
            - call: "POST /agencies"
              payload: { name: "Cycle Agency", fee_cap_pct: 0.03 }
              as: LeagueOfficer
              captures: { agency_id: $.data.id }
            - call: "POST /agencies/${agency_id}/agents"
              payload: { full_name: "Mgr", email: "m@c.example", cert_number: "MC1", is_manager: true }
              as: AgencyManager
              captures: { m_id: $.data.id }
            - call: "POST /agencies/${agency_id}/agents/${m_id}/certify"
              payload: {}
              as: AgencyManager
              as_user_id: "${m_id}"
            - call: "POST /agencies/${agency_id}/agents"
              payload: { full_name: "Agt", email: "a@c.example", cert_number: "AC1" }
              as: AgencyManager
              as_user_id: "${m_id}"
              captures: { a_id: $.data.id }
            - call: "POST /agencies/${agency_id}/agents/${a_id}/certify"
              payload: {}
              as: AgencyManager
              as_user_id: "${m_id}"
            - call: "POST /agencies/${agency_id}/clients"
              payload: { primary_agent_id: "${a_id}", full_name: "P", position: "PG" }
              as: Agent
              as_user_id: "${a_id}"
              captures: { c_id: $.data.id }
            - call: "POST /agencies/${agency_id}/clients/${c_id}/contracts"
              payload: { team_id: "${team_id}", cap_season_id: "${cs_id}", start_season_year: 2026, years: 4, base_salary_cents: 20000000, guaranteed_cents: 50000000, signing_bonus_cents: 0, incentive_cents: 0, escalator_pct: 0.05 }
              as: Agent
              as_user_id: "${a_id}"
              captures: { contract_id: $.data.id }
            - call: "POST /agencies/${agency_id}/clients/${c_id}/contracts/${contract_id}/proposals"
              payload: { proposed_by_agent_id: "${a_id}", proposed_aav_cents: 22000000, proposed_guaranteed_cents: 55000000 }
              as: Agent
              as_user_id: "${a_id}"
              captures: { p_id: $.data.id }
            - call: "GET /teams/${team_id}/cap_seasons/${cs_id}"
              as: LeagueOfficer
              captures: { cs_v0: $.data.version }
            - call: "POST /agencies/${agency_id}/clients/${c_id}/contracts/${contract_id}/proposals/${p_id}/submit"
              payload: { expected_cap_season_version: "${cs_v0}" }
              as: Agent
              as_user_id: "${a_id}"
          trigger:
            # Round 1: Team counters 22M -> 21M
            - call: "POST /agencies/${agency_id}/clients/${c_id}/contracts/${contract_id}/proposals/${p_id}/counter"
              payload: { counter_aav_cents: 21000000 }
              as: Team
              as_user_id: "${team_id}"
            # Agent resubmits at 21.5M
            - call: "POST /agencies/${agency_id}/clients/${c_id}/contracts/${contract_id}/proposals/${p_id}/resubmit"
              payload: { proposed_aav_cents: 21500000 }
              as: Agent
              as_user_id: "${a_id}"
            # Round 2: Team counters 21.5M -> 21.2M
            - call: "POST /agencies/${agency_id}/clients/${c_id}/contracts/${contract_id}/proposals/${p_id}/counter"
              payload: { counter_aav_cents: 21200000 }
              as: Team
              as_user_id: "${team_id}"
          assert:
            - "Proposal.${p_id}.status == COUNTERED   # completed second loop iteration"
            - "Proposal.${p_id}.proposed_aav_cents == 21200000"
            - "CapSeason.${cs_id}.reserved_cents == 21200000   # reserved tracks latest counter amount"

      - name: contract_parallel_dimensions_signing_x_cap_posting
        grounds:
          - state_machines.Contract
          - entities.Contract.fields.signing_status
          - entities.Contract.fields.cap_posting_status
        distinguishing_aspect: |
          Contract carries TWO independent state dimensions that evolve
          together but with distinct transition sets: signing_status
          (NEGOTIATING -> SIGNED -> VOIDED) and cap_posting_status
          (UNPOSTED -> POSTED -> REVERSED). Different entity from Proposal.
          Voiding a NEGOTIATING contract produces (VOIDED, REVERSED) but
          committed_cents is unchanged (never posted); voiding a SIGNED
          contract produces the same state pair but also debits
          committed_cents and voids fee entries. Same target state pair,
          divergent side-effect sets depending on prior dimension value.
        test_recipe:
          setup:
            - "Two separate agencies/clients/contracts in NEGOTIATING; one contract signed, the other left NEGOTIATING"
          setup_api_calls:
            - call: "POST /teams"
              payload: { name: "Dim Team", league_code: "NBA" }
              as: LeagueOfficer
              captures: { team_id: $.data.id }
            - call: "POST /teams/${team_id}/cap_seasons"
              payload: { season_year: 2026, cap_limit_cents: 500000000, luxury_threshold_cents: 600000000 }
              as: LeagueOfficer
              captures: { cs_id: $.data.id }
            - call: "POST /agencies"
              payload: { name: "Dim Agency", fee_cap_pct: 0.03 }
              as: LeagueOfficer
              captures: { agency_id: $.data.id }
            - call: "POST /agencies/${agency_id}/agents"
              payload: { full_name: "Mgr", email: "m@d.example", cert_number: "MD1", is_manager: true }
              as: AgencyManager
              captures: { m_id: $.data.id }
            - call: "POST /agencies/${agency_id}/agents/${m_id}/certify"
              payload: {}
              as: AgencyManager
              as_user_id: "${m_id}"
            - call: "POST /agencies/${agency_id}/agents"
              payload: { full_name: "Agt", email: "a@d.example", cert_number: "AD1" }
              as: AgencyManager
              as_user_id: "${m_id}"
              captures: { a_id: $.data.id }
            - call: "POST /agencies/${agency_id}/agents/${a_id}/certify"
              payload: {}
              as: AgencyManager
              as_user_id: "${m_id}"
            - call: "POST /agencies/${agency_id}/clients"
              payload: { primary_agent_id: "${a_id}", full_name: "Signed Player", position: "SG" }
              as: Agent
              as_user_id: "${a_id}"
              captures: { c_signed_id: $.data.id }
            - call: "POST /agencies/${agency_id}/clients"
              payload: { primary_agent_id: "${a_id}", full_name: "Neg Player", position: "SF" }
              as: Agent
              as_user_id: "${a_id}"
              captures: { c_neg_id: $.data.id }
            # Signed path
            - call: "POST /agencies/${agency_id}/clients/${c_signed_id}/contracts"
              payload: { team_id: "${team_id}", cap_season_id: "${cs_id}", start_season_year: 2026, years: 1, base_salary_cents: 30000000, guaranteed_cents: 30000000, signing_bonus_cents: 0, incentive_cents: 0, escalator_pct: 0 }
              as: Agent
              as_user_id: "${a_id}"
              captures: { contract_signed_id: $.data.id }
            - call: "POST /agencies/${agency_id}/clients/${c_signed_id}/contracts/${contract_signed_id}/proposals"
              payload: { proposed_by_agent_id: "${a_id}", proposed_aav_cents: 30000000, proposed_guaranteed_cents: 30000000 }
              as: Agent
              as_user_id: "${a_id}"
              captures: { p_signed_id: $.data.id }
            - call: "GET /teams/${team_id}/cap_seasons/${cs_id}"
              as: LeagueOfficer
              captures: { cs_v_s: $.data.version }
            - call: "POST /agencies/${agency_id}/clients/${c_signed_id}/contracts/${contract_signed_id}/proposals/${p_signed_id}/submit"
              payload: { expected_cap_season_version: "${cs_v_s}" }
              as: Agent
              as_user_id: "${a_id}"
            - call: "POST /agencies/${agency_id}/clients/${c_signed_id}/contracts/${contract_signed_id}/proposals/${p_signed_id}/accept"
              payload: {}
              as: Team
              as_user_id: "${team_id}"
            - call: "GET /agencies/${agency_id}/clients/${c_signed_id}/contracts/${contract_signed_id}"
              as: Agent
              as_user_id: "${a_id}"
              captures: { csig_v: $.data.version }
            - call: "POST /agencies/${agency_id}/clients/${c_signed_id}/contracts/${contract_signed_id}/sign"
              payload: { expected_contract_version: "${csig_v}" }
              as: Agent
              as_user_id: "${a_id}"
            # Negotiating path
            - call: "POST /agencies/${agency_id}/clients/${c_neg_id}/contracts"
              payload: { team_id: "${team_id}", cap_season_id: "${cs_id}", start_season_year: 2026, years: 1, base_salary_cents: 20000000, guaranteed_cents: 20000000, signing_bonus_cents: 0, incentive_cents: 0, escalator_pct: 0 }
              as: Agent
              as_user_id: "${a_id}"
              captures: { contract_neg_id: $.data.id }
          trigger:
            - call: "POST /agencies/${agency_id}/clients/${c_signed_id}/contracts/${contract_signed_id}/void"
              payload: {}
              as: AgencyManager
              as_user_id: "${m_id}"
            - call: "POST /agencies/${agency_id}/clients/${c_neg_id}/contracts/${contract_neg_id}/void"
              payload: {}
              as: AgencyManager
              as_user_id: "${m_id}"
          assert:
            - "Contract.${contract_signed_id}.signing_status == VOIDED"
            - "Contract.${contract_signed_id}.cap_posting_status == REVERSED"
            - "Contract.${contract_neg_id}.signing_status == VOIDED"
            - "Contract.${contract_neg_id}.cap_posting_status == REVERSED"
            - "CapSeason.${cs_id}.committed_cents == 0   # signed void debited the 30M it had posted"
            - "FeeLedgerEntry for contract ${contract_signed_id} has status == VOIDED"

  # ---------------------------------------------------------------------------
  # Rule 4 — transitive_cascade (≥2 instances, different triggers, depths ≥3 and ≥2)
  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: agent_suspend_cascade_depth3
        grounds:
          - state_machines.Agent.CERTIFIED_to_SUSPENDED
          - state_machines.Proposal.SUBMITTED_to_WITHDRAWN
        distinguishing_aspect: |
          Depth-3 cascade from agent suspension trigger:
          Agent.cert_status -> SUSPENDED   (level 1)
          causes each in-flight Proposal authored by agent -> WITHDRAWN  (level 2)
          causes CapSeason.reserved_cents -= withdrawn aav  (level 3)
          Each link is caused by the previous one, not by the original
          suspend action as a fan-out.
        test_recipe:
          setup:
            - "Agent AG1 with one SUBMITTED proposal (reserved 25M) and one COUNTERED proposal (reserved 30M) on two separate contracts/clients"
          setup_api_calls:
            - call: "POST /teams"
              payload: { name: "Cascade Team", league_code: "NBA" }
              as: LeagueOfficer
              captures: { team_id: $.data.id }
            - call: "POST /teams/${team_id}/cap_seasons"
              payload: { season_year: 2026, cap_limit_cents: 500000000, luxury_threshold_cents: 600000000 }
              as: LeagueOfficer
              captures: { cs_id: $.data.id }
            - call: "POST /agencies"
              payload: { name: "Cascade Agency", fee_cap_pct: 0.03 }
              as: LeagueOfficer
              captures: { agency_id: $.data.id }
            - call: "POST /agencies/${agency_id}/agents"
              payload: { full_name: "Mgr", email: "m@ca.example", cert_number: "MCA", is_manager: true }
              as: AgencyManager
              captures: { m_id: $.data.id }
            - call: "POST /agencies/${agency_id}/agents/${m_id}/certify"
              payload: {}
              as: AgencyManager
              as_user_id: "${m_id}"
            - call: "POST /agencies/${agency_id}/agents"
              payload: { full_name: "Agt", email: "a@ca.example", cert_number: "ACA" }
              as: AgencyManager
              as_user_id: "${m_id}"
              captures: { a_id: $.data.id }
            - call: "POST /agencies/${agency_id}/agents/${a_id}/certify"
              payload: {}
              as: AgencyManager
              as_user_id: "${m_id}"
            # Client 1 + contract + SUBMITTED proposal 25M
            - call: "POST /agencies/${agency_id}/clients"
              payload: { primary_agent_id: "${a_id}", full_name: "P1", position: "PG" }
              as: Agent
              as_user_id: "${a_id}"
              captures: { c1_id: $.data.id }
            - call: "POST /agencies/${agency_id}/clients/${c1_id}/contracts"
              payload: { team_id: "${team_id}", cap_season_id: "${cs_id}", start_season_year: 2026, years: 1, base_salary_cents: 25000000, guaranteed_cents: 25000000, signing_bonus_cents: 0, incentive_cents: 0, escalator_pct: 0 }
              as: Agent
              as_user_id: "${a_id}"
              captures: { con1_id: $.data.id }
            - call: "POST /agencies/${agency_id}/clients/${c1_id}/contracts/${con1_id}/proposals"
              payload: { proposed_by_agent_id: "${a_id}", proposed_aav_cents: 25000000, proposed_guaranteed_cents: 25000000 }
              as: Agent
              as_user_id: "${a_id}"
              captures: { p1_id: $.data.id }
            - call: "GET /teams/${team_id}/cap_seasons/${cs_id}"
              as: LeagueOfficer
              captures: { cs_v_1: $.data.version }
            - call: "POST /agencies/${agency_id}/clients/${c1_id}/contracts/${con1_id}/proposals/${p1_id}/submit"
              payload: { expected_cap_season_version: "${cs_v_1}" }
              as: Agent
              as_user_id: "${a_id}"
            # Client 2 + contract + COUNTERED proposal 30M
            - call: "POST /agencies/${agency_id}/clients"
              payload: { primary_agent_id: "${a_id}", full_name: "P2", position: "SF" }
              as: Agent
              as_user_id: "${a_id}"
              captures: { c2_id: $.data.id }
            - call: "POST /agencies/${agency_id}/clients/${c2_id}/contracts"
              payload: { team_id: "${team_id}", cap_season_id: "${cs_id}", start_season_year: 2026, years: 1, base_salary_cents: 30000000, guaranteed_cents: 30000000, signing_bonus_cents: 0, incentive_cents: 0, escalator_pct: 0 }
              as: Agent
              as_user_id: "${a_id}"
              captures: { con2_id: $.data.id }
            - call: "POST /agencies/${agency_id}/clients/${c2_id}/contracts/${con2_id}/proposals"
              payload: { proposed_by_agent_id: "${a_id}", proposed_aav_cents: 32000000, proposed_guaranteed_cents: 32000000 }
              as: Agent
              as_user_id: "${a_id}"
              captures: { p2_id: $.data.id }
            - call: "GET /teams/${team_id}/cap_seasons/${cs_id}"
              as: LeagueOfficer
              captures: { cs_v_2: $.data.version }
            - call: "POST /agencies/${agency_id}/clients/${c2_id}/contracts/${con2_id}/proposals/${p2_id}/submit"
              payload: { expected_cap_season_version: "${cs_v_2}" }
              as: Agent
              as_user_id: "${a_id}"
            - call: "POST /agencies/${agency_id}/clients/${c2_id}/contracts/${con2_id}/proposals/${p2_id}/counter"
              payload: { counter_aav_cents: 30000000 }
              as: Team
              as_user_id: "${team_id}"
            # Now reserved = 25M + 30M = 55M
          trigger:
            - call: "POST /agencies/${agency_id}/agents/${a_id}/suspend"
              payload: {}
              as: AgencyManager
              as_user_id: "${m_id}"
          assert:
            - "Agent.${a_id}.cert_status == SUSPENDED  # level 1"
            - "Proposal.${p1_id}.status == WITHDRAWN   # level 2 (was SUBMITTED)"
            - "Proposal.${p2_id}.status == WITHDRAWN   # level 2 (was COUNTERED)"
            - "CapSeason.${cs_id}.reserved_cents == 0  # level 3 — both reservations released"

      - name: contract_void_cascade_depth2_via_fee_reversal
        grounds:
          - state_machines.Contract.SIGNED_to_VOIDED
        distinguishing_aspect: |
          Depth-2 cascade from contract void trigger (different originating
          trigger than agent suspend):
          Contract.signing_status -> VOIDED   (level 1)
          causes FeeLedgerEntry[contract] ACCRUED -> VOIDED AND
          CapSeason.committed_cents -= aav_cents (level 2)
          Trigger is a manager-driven void, not an agent suspension.
        test_recipe:
          setup:
            - "Client with a SIGNED contract (aav 40M); committed 40M; one ACCRUED FeeLedgerEntry"
          setup_api_calls:
            - call: "POST /teams"
              payload: { name: "VoidTeam", league_code: "NBA" }
              as: LeagueOfficer
              captures: { team_id: $.data.id }
            - call: "POST /teams/${team_id}/cap_seasons"
              payload: { season_year: 2026, cap_limit_cents: 500000000, luxury_threshold_cents: 600000000 }
              as: LeagueOfficer
              captures: { cs_id: $.data.id }
            - call: "POST /agencies"
              payload: { name: "VoidAgency", fee_cap_pct: 0.03 }
