              captures: { co_err_cross: $.data.error_id }
            - call: "DELETE /sales-orders/${co_a_id}/lines/00000000-0000-4000-8000-000000000908"
              payload: {}
              as: Brewer
              as_user_id: "${co_id}"
              captures: { co_err_unknown: $.data.error_id }
            - call: "DELETE /sales-orders/${co_a_id}/lines/${co_line_a}"
