      - name: validating_a_delivery_makes_an_in_flight_protest_resolution_stale
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[protest-resolve-stale-objective]
          - validations[priority=9]
          - errors[ERR_STALE_OBJECTIVE_VERSION]
          - state_machines.RetailDelivery.transitions.REPORTED_to_VALIDATED
        distinguishing_aspect: "The staleness comes from a DIFFERENT entity's write: validating a retail delivery recomputes the objective's achieved_units and bumps DealerObjective.version, so the manager's pending UPHELD decision — computed from a basis that has since moved — is refused with 412. The objective version, not the protest version, is the guarded field."
        test_recipe:
          setup:
            - "One ACTIVE DEALER_STAIR_STEP program, one dealer with historical_volume_units 4, one objective (objective_units 4) with one OPEN protest claiming 3 basis units, one VALIDATED delivery already counted, and one REPORTED delivery not yet counted."
