            - call: "POST /work-orders"
              payload: { quote_id: "${q_id}", part_line_id: "${pl_id}", qty_ordered: 4, qty_started: 4 }
              as: ShopAdmin
              captures: { wo_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/allocate-material"
              payload: {}
              as: MaterialController
              captures: { wo_v: $.data.version }
            - call: "POST /work-orders/${wo_id}/release"
              payload: { expected_work_order_version: "${wo_v}" }
              as: ShopAdmin
            - call: "POST /machine-slots"
              payload: { machine_class: "MILL_3AX", machine_code: "VF2-StA", routing_op_id: "${op1_id}", start_min: 0, end_min: 60 }
              as: Scheduler
            - call: "POST /inspection-stations"
              payload: { name: "CMM-B", supports_mode: "ALL", buffer_min: 15 }
              as: Inspector
              captures: { st_id: $.data.id }
            - call: "POST /inspections"
              payload: { work_order_id: "${wo_id}", inspection_station_id: "${st_id}", mode: "FINAL", window_start_min: 100, window_end_min: 160 }
              as: Inspector
          trigger:
            - call: "POST /inspections"
