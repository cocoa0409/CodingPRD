            - "MONETARY_CREDIT + AVOIDED_COST_PAYOUT program (cap 1000000, tum 4); tariff import 30000 / export 12000 / ns 4500; OPERATING application; R1 (2026-08) import 0 export 100000 posted (credit 1200 cents); R1' identical period import 0 export 50000000... no: export 50000 posted with fresh version, superseding R1."
