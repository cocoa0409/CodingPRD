          The two dimensions gate independently: completing a SCHEDULED pickup is
          ERR_PICKUP_NOT_COMPLETABLE even with a sealed manifest, adding or resealing after SEALED is
          ERR_MANIFEST_SEALED, reconciling a SEALED manifest whose truck has not left is
