          assert:
            - "the registration returns 201 and its data.id is the identity the caller must present afterwards"
            - "the four following Anonymous calls all return 403 'ERR_ROLE_NOT_PERMITTED', including the read of the just-created proponent and the clock write"
            - "the same read as X-Role: Proponent with X-User-ID: ${new_prop_id} returns 200 with ${self_score} == 100.00"
            - "no X-User-ID is required on POST /proponents — priority 1 exempts the Anonymous role from the user header"
            - "Anonymous is a DECLARED role, so these refusals are 403 and not the 401 an unknown role string would produce"

      - name: the_clock_endpoint_is_the_only_write_shared_across_roles
        claim_type: shared_operations
        grounds:
          - endpoints[POST /_clock/set_current_utc]
          - roles.Proponent.shared_operations
          - roles.Auditor.shared_operations
        distinguishing_aspect: >-
          Three roles may advance the same single global clock, and there is no
          per-role or per-caller clock: whoever moves it, every subsequent
          derivation for every party reads the new instant. That shared mutable
          reference is what makes the temporal rules testable from any role.
        test_recipe:
          setup:
            - "One species and one proponent exist; the clock is at 2026-10-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: {to_iso8601: "2026-10-01T00:00:00Z"}
              as: WildlifeAgency
              as_user_id: "fws-user-registrar"
            - call: "POST /species"
              payload: {scientific_name: "Gopherus agassizii", common_name: "Desert tortoise", listing_status: "ENDANGERED", take_authorization_unit: "INDIVIDUALS", take_density_per_acre: 0.40, recovery_unit_population: 4000, survey_season_start_month: 4, survey_season_end_month: 7}
              as: WildlifeAgency
              as_user_id: "fws-user-registrar"
              captures: {species_e_id: "$.data.id"}
            - call: "POST /proponents"
              payload: {org_name: "Sunrise Logistics Park LLC", contact_email: "permits@sunrise-park.example", is_federal_agency: false}
              as: Anonymous
              captures: {proponent_id: "$.data.id"}
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: {to_iso8601: "2026-11-01T00:00:00Z"}
              as: Proponent
              as_user_id: "${proponent_id}"
            - call: "POST /_clock/set_current_utc"
              payload: {to_iso8601: "2026-12-01T00:00:00Z"}
              as: Auditor
            - call: "POST /_clock/set_current_utc"
              payload: {to_iso8601: "2027-01-15T00:00:00Z"}
              as: WildlifeAgency
              as_user_id: "fws-user-registrar"
            - call: "POST /_clock/set_current_utc"
              payload: {to_iso8601: "2027-02-01T00:00:00Z"}
              as: Anonymous
              captures: {e_clock: "$.data.error_id"}
            - call: "POST /project-actions"
              payload: {proponent_id: "${proponent_id}", action_name: "Clock Witness Action", action_type: "NON_FEDERAL", footprint_acres: 200.00, county_code: "06037", construction_start_date: "2027-01-01", construction_end_date: "2027-12-31"}
              as: Proponent
              as_user_id: "${proponent_id}"
              captures: {action_id: "$.data.id", action_created: "$.data.created_at"}
          assert:
            - "the Proponent, Auditor and WildlifeAgency clock writes all return 200"
            - "the Anonymous clock write returns 403 ${e_clock} == 'ERR_ROLE_NOT_PERMITTED' and leaves the clock where the agency put it"
            - "${action_created} == '2027-01-15T00:00:00Z': the row created afterwards is stamped from the logical clock, not from wall-clock time, and it saw the LAST successful write regardless of which role made it"
            - "the clock never advances on its own between calls: two consecutive reads of any created_at-stamped write with no clock call in between are identical"
            - "an instant expressed as 2027-01-15T00:00:00.000Z is accepted and denotes the same instant as 2027-01-15T00:00:00Z"

