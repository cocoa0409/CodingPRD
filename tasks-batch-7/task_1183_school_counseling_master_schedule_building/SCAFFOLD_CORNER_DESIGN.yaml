            - call: "POST /scheduling/students"
              payload: { external_ref: "XX", full_name: "X Stu", grade_level: 9, counselor_id: "${c_xy}" }
              as: Administrator
              captures: { s_x: "$.data.id" }
            - call: "POST /scheduling/students"
              payload: { external_ref: "YY", full_name: "Y Stu", grade_level: 9, counselor_id: "${c_xy}" }
              as: Administrator
              captures: { s_y: "$.data.id" }
            - call: "POST /scheduling/terms"
              payload: { code: "2070-FALL", periods_per_day: 8, max_students_per_section: 32, class_size_target: 25 }
              as: Administrator
              captures: { t_xy: "$.data.id" }
          trigger:
            - call: "GET /scheduling/students/${s_y}/schedule"
              as: Student
              as_user_id: "${s_x}"
              captures: { xy_err: "$.data.error_id" }
            - call: "GET /scheduling/students/${s_x}/schedule"
              as: Student
              as_user_id: "${s_x}"
          assert:
            - "cross-student read returns ERR_FORBIDDEN_OWNERSHIP (403)"
            - "own-schedule read returns 200"

  # ===========================================================================
  # Section: cross_cutting_layers
  # ===========================================================================
  - section: cross_cutting_layers
    instances:
      - name: rebalance_epoch_prevents_double_move
        claim_type: ops_run_checkpoint
        grounds:
          - calculations.rebalance_move_selector
          - entities.ScheduleEntry.fields.epoch_placed
        distinguishing_aspect: "A student whose epoch_placed == term.rebalance_epoch is skipped by the move selector — no student moves twice within one epoch even when their receiving section is itself a later donor."
        test_recipe:
          setup:
            - "term LOCKED; course k_ep with sections pinned so the sweep order would revisit a just-moved student (donor sec_d 8 enrolled, target 4; receivers arranged so a moved student's new section later appears as a donor)"
          setup_api_calls:
            - call: "POST /scheduling/counselors"
              payload: { full_name: "C Ep", max_caseload: 100 }
              as: Administrator
              captures: { c_ep: "$.data.id" }
            - call: "POST /scheduling/terms"
              payload: { code: "2071-FALL", periods_per_day: 8, max_students_per_section: 32, class_size_target: 4 }
              as: Administrator
              captures: { t_ep: "$.data.id" }
            # NOTE for the test-generator: chain to LOCKED with the pinned
            # section loads.
            - call: "GET /scheduling/terms/${t_ep}"
              as: Administrator
              captures: { t_ep_v: "$.data.version" }
          trigger:
            - call: "POST /scheduling/terms/${t_ep}/rebalance-runs"
              payload: { expected_term_version: "${t_ep_v}" }
              as: Administrator
              captures: { ep_run: "$.data.id", ep_moves: "$.data.moves_proposed" }
          assert:
            - "every ScheduleEntry created by the run has epoch_placed == 1"
            - "no student appears as the source of more than one MOVED entry in this run (double-move prevented by the epoch guard)"
      - name: derived_counts_reconcile_after_drop
        claim_type: derived_field_reconciliation
        grounds:
          - entities.Section.fields.enrolled_count
          - entities.Section.fields.cohort_counts
          - entities.Section.fields.under_enrolled
        distinguishing_aspect: "After a DROP executes, enrolled_count, cohort_counts and under_enrolled reconcile: capacity 4 dropping from 2 to 1 enrolled flips under_enrolled (1 < ceil(0.5*4)=2) to true."
        test_recipe:
          setup:
            - "term CHANGE_WINDOW; sec_der capacity 4 with 2 IEP enrollments; APPROVED DROP cr_der for one of them"
          setup_api_calls:
            - call: "POST /scheduling/counselors"
              payload: { full_name: "C Der", max_caseload: 50 }
              as: Administrator
              captures: { c_der: "$.data.id" }
            - call: "POST /scheduling/terms"
              payload: { code: "2072-FALL", periods_per_day: 8, max_students_per_section: 32, class_size_target: 25 }
              as: Administrator
              captures: { t_der: "$.data.id" }
            # NOTE for the test-generator: chain to CHANGE_WINDOW with sec_der
            # (capacity 4) holding exactly 2 IEP enrollments; DROP approved.
            - call: "GET /scheduling/sections"
              as: Administrator
              captures: { sec_der: "$.data[0].id" }
          trigger:
            - call: "POST /scheduling/change-requests/${cr_der}/execute"
              payload: {}
              as: Administrator
            - call: "GET /scheduling/sections/${sec_der}"
              as: Administrator
              captures: { der_count: "$.data.enrolled_count", der_under: "$.data.under_enrolled" }
          assert:
            - "enrolled_count == 1 and cohort_counts.IEP == 1"
            - "under_enrolled == true (1 < 2 == ceil(0.5*4))"
      - name: close_collection_cascades_draft_withdrawal
        claim_type: cascading_side_effects
        grounds:
          - state_machines.AcademicTerm.COLLECTING_to_TALLYING
        distinguishing_aspect: "close-collection withdraws every DRAFT request of the term and recomputes total_requested_seats: 3 DRAFT + 2 SUBMITTED primaries end with total_requested_seats == 2."
        test_recipe:
          setup:
            - "term COLLECTING with 3 DRAFT and 2 SUBMITTED primary requests (5 distinct students/courses)"
          setup_api_calls:
            - call: "POST /scheduling/counselors"
              payload: { full_name: "C Casc", max_caseload: 100 }
              as: Administrator
              captures: { c_casc: "$.data.id" }
            - call: "POST /scheduling/terms"
              payload: { code: "2073-FALL", periods_per_day: 8, max_students_per_section: 32, class_size_target: 25 }
              as: Administrator
              captures: { t_casc: "$.data.id" }
            # NOTE for the test-generator: 5 students, 5 courses; submit 2
            # requests, leave 3 in DRAFT.
          trigger:
            - call: "POST /scheduling/terms/${t_casc}/close-collection"
              payload: {}
              as: Administrator
              captures: { casc_seats: "$.data.total_requested_seats", casc_posture: "$.data.posture" }
            - call: "GET /scheduling/course-requests"
              as: Administrator
              captures: { casc_rows: "$.data" }
          assert:
            - "posture == TALLYING and total_requested_seats == 2"
            - "all 3 previously-DRAFT requests read state == WITHDRAWN"

  # ===========================================================================
  # Section: consistency_model
  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_visibility_of_execute_effects
        claim_type: immediate_consistency
        grounds:
          - state_machines.ScheduleChangeRequest.APPROVED_to_EXECUTED
        distinguishing_aspect: "All execute side effects are visible in the same request's response and in immediately-following reads (no async lag): request state, entry state, section counts, student load."
        test_recipe:
          setup:
            - "term CHANGE_WINDOW; APPROVED ADD request cr_imm for student s_imm into section sec_imm"
          setup_api_calls:
            - call: "POST /scheduling/counselors"
              payload: { full_name: "C Imm", max_caseload: 50 }
              as: Administrator
              captures: { c_imm: "$.data.id" }
            - call: "POST /scheduling/terms"
              payload: { code: "2074-FALL", periods_per_day: 8, max_students_per_section: 32, class_size_target: 25 }
              as: Administrator
              captures: { t_imm: "$.data.id" }
            # NOTE for the test-generator: chain to the pinned APPROVED ADD.
            - call: "POST /scheduling/students"
              payload: { external_ref: "IMM", full_name: "Imm Stu", grade_level: 9, counselor_id: "${c_imm}" }
              as: Administrator
              captures: { s_imm: "$.data.id" }
          trigger:
            - call: "POST /scheduling/change-requests/${cr_imm}/execute"
              payload: {}
              as: Administrator
              captures: { imm_state: "$.data.state" }
            - call: "GET /scheduling/students/${s_imm}/schedule"
              as: Administrator
              captures: { imm_entries: "$.data" }
          assert:
            - "execute response state == EXECUTED"
            - "the immediately-following schedule read shows the new ENROLLED entry (origin == CHANGE_REQUEST)"
