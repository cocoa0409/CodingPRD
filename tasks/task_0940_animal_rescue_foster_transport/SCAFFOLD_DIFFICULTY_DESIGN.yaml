            - "A FosterHome with dog_slot_capacity 4 and max_headcount 6 and zero consumption."
            - "A FosterApplication for DOG in application_status APPROVED whose home check PASSED on 2026-05-02, so home_check_expires_at is 2026-10-29T00:00:00Z and the axis has lapsed."
