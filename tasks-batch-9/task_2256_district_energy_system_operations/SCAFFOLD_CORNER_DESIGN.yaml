  - section: RBAC
    instances:
      - name: all_six_roles_drive_one_utility_from_registration_to_settlement
        claim_type: Can perform all exclusive_operations and shared_operations
        grounds:
          - roles[SystemController, DispatchOperator, NetworkEngineer, FieldTechnician, BillingAnalyst, CustomerAccount]
          - endpoints[POST /district-energy/network-loops]
          - endpoints[POST /district-energy/invoices/{invoice_id}/payments]
          - endpoints[GET /district-energy/network-loops/{loop_id}/emissions-summary]
        distinguishing_aspect: "The six-role matrix is only credible if one chain can be driven end to end without a single role reaching outside its own column: the controller registers the plant and reviews, the dispatcher forecasts and commits, the engineer records the buried asset and sizes the expansion, the technician meters, the analyst tariffs and bills, and the customer settles — and the four shared reads still answer for the peer roles that need them."
        test_recipe:
          setup:
            - "An empty database and the logical clock at 2026-08-01T00:00:00Z."
            - "Every call below is made by exactly the role that owns the operation in §1.7."
