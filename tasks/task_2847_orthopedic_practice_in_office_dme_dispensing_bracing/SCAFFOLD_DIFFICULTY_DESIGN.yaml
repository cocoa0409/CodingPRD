          assert:
            - "${cs_at_create} == DRAFT and ${fs_at_create} == UNVERIFIED"
            - "${cs_after_mn} == DOCUMENTED and ${fs_after_mn} == UNVERIFIED"
            - "${cs_after_ioas} == DOCUMENTED and ${fs_after_ioas} == UNVERIFIED"
            - "${cs_after_cv} == DOCUMENTED and ${fs_after_cv} == VERIFIED"
            - "${cs_after_res} == RESERVED and ${fs_after_res} == VERIFIED"
            - "${cs_after_adjust} == RESERVED and ${fs_after_adjust} == VERIFIED"
            - "${cs_after_fit} == FITTED and ${fs_after_fit} == VERIFIED"
            - "${cs_final} == DELIVERED and ${fs_final} == BILLED"
            - "the RESERVED -> RESERVED self-loop kept ClinicParLevel.${par_lso_id}.reserved_qty at 1 (no double reservation) until dispense"
            - "FittingRecord rows for DispenseEncounter.${enc_id} number 2, and only the second one carries delivery_signature_role PATIENT"
            - "Fitter.${fitter_a_id}.fitting_minutes_booked == 60"
            - "ClinicParLevel.${par_lso_id}.on_hand_qty == 9 and ClinicParLevel.${par_lso_id}.reserved_qty == 0"

      - name: custom_fab_order_adjustment_cycle_third_request_rejected
        grounds:
          - state_machines.CustomFabOrder.READY_FOR_FITTING_to_ADJUSTMENT_REQUESTED
          - state_machines.CustomFabOrder.ADJUSTMENT_REQUESTED_to_IN_FABRICATION
          - entities.CustomFabOrder.fields.adjustment_rounds
          - validations[priority=57]
          - errors[ERR_ADJUSTMENT_LIMIT_REACHED]
        distinguishing_aspect: |
          Non-linear shape #2 is a CYCLE on CustomFabOrder:
          READY_FOR_FITTING -> ADJUSTMENT_REQUESTED -> IN_FABRICATION ->
          READY_FOR_FITTING can be traversed exactly FAB_ADJUSTMENT_ROUND_LIMIT
          (2) times, adjustment_rounds counting the laps, and the third
          REQUEST_ADJUSTMENT is refused with ERR_ADJUSTMENT_LIMIT_REACHED while
          the order stays in READY_FOR_FITTING. This is a loop with a
          termination condition, not the parallel dimensions of instance 1 nor
          the fork-join of instance 3, and it lives on a different entity.
        test_recipe:
          setup:
            - "one accredited clinic licensed for FOOT_ANKLE, one attested custom-fab-capable supplier, one CUSTOM_FABRICATED product"
            - "one encounter documented and awaiting the device, with a fabrication order that has already been delivered and sent back for adjustment TWICE and is now READY_FOR_FITTING again"
          setup_api_calls:
            - call: "POST /dme/clinics"
              payload: { name: "North Ortho", state_code: "OH", accreditation_body: "ABC", accreditation_expires_on: "2027-06-30", ioas_supervision_level: "DIRECT", dispensing_specialties: ["FOOT_ANKLE"] }
              as: PracticeAdmin
