              as: StoreAssociate
              captures: { order_id: "$.data.id"}
            - call: "PATCH /variants/${v_id}"
              payload: { status: "DISCONTINUED" }
              as: MerchandisingAdmin
          trigger:
            - call: "POST /orders/${order_id}/reserve"
              payload: {}
              as: StoreAssociate
              captures: { err: "$.data.error_id"}
          assert:
            - "${err} == ERR_VARIANT_NOT_SELLABLE"
            - "HTTP 409"
            - "Order.${order_id}.fulfillment_status is still DRAFT"

      - name: return_before_fulfilment_returns_invalid_return_state
        claim_type: violation_to_error
        grounds: ["validations[priority=7]", "errors[ERR_INVALID_RETURN_STATE]"]
        distinguishing_aspect: "A return may only be filed against a fulfilled, captured order: filing against a merely RESERVED order returns ERR_INVALID_RETURN_STATE (409), demonstrating the ReturnRequest -> Order guard on the creation path."
        test_recipe:
