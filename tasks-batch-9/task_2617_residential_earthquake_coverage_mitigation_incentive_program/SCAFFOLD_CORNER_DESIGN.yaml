            - call: "POST /eqp/inspections"
              payload: { project_id: "${pj_id}", window_start: "2026-08-04T09:00:00Z", window_end: "2026-08-04T11:00:00Z" }
              as: FieldInspector
              as_user_id: "insp-1"
              captures: { in_id: $.data.id }
            - call: "POST /eqp/_clock/set_current_utc"
              payload: { current_utc: "2026-08-04T10:00:00Z" }
