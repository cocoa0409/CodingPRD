  - name: error_no_eligible_supply_is_exercised_by_the_supplier_state_dependency
    claim_type: error_triggerable
    grounds:
    - errors[ERR_NO_ELIGIBLE_SUPPLY]
    excluded_because:
      difficulty_instance: cross_entity_state_dependency / order_aggregation_depends_on_supplier_producer_state
      rationale: Asserted as the failure path of the named difficulty instance, which suspends the only supplier and expects HTTP 422 ERR_NO_ELIGIBLE_SUPPLY.
  - name: error_dock_capacity_exceeded_is_exercised_by_the_dock_geometry_instance
    claim_type: error_triggerable
    grounds:
    - errors[ERR_DOCK_CAPACITY_EXCEEDED]
    excluded_because:
      difficulty_instance: resource_temporal_overlap / dock_slot_aggregate_capacity_with_sanitation_buffer_geometry
      rationale: The third trigger call of that instance pushes 6+5+5 pallets past a 12-pallet slot and asserts the error id directly.
  - name: error_sanitation_buffer_violation_is_exercised_by_the_dock_geometry_instance
    claim_type: error_triggerable
    grounds:
    - errors[ERR_SANITATION_BUFFER_VIOLATION]
    excluded_because:
      difficulty_instance: resource_temporal_overlap / dock_slot_aggregate_capacity_with_sanitation_buffer_geometry
      rationale: The fourth trigger call of that instance books a RAW_ANIMAL slot inside the 45-minute buffer and asserts the error id directly.
  - name: error_stop_window_overlap_is_exercised_by_the_route_window_instance
    claim_type: error_triggerable
    grounds:
    - errors[ERR_STOP_WINDOW_OVERLAP]
    excluded_because:
      difficulty_instance: resource_temporal_overlap / route_stop_exclusive_window_allows_adjacency_rejects_zero_length
      rationale: The first trigger call of that instance overlaps an existing stop and asserts the error id directly.
  - name: error_order_not_invoiced_is_exercised_by_the_payment_priority_instance
    claim_type: error_triggerable
    grounds:
    - errors[ERR_ORDER_NOT_INVOICED]
    excluded_because:
      difficulty_instance: priority_pair_validation_conflict / payment_state_check_precedes_fiscal_overpayment_check
      rationale: That instance asserts ERR_ORDER_NOT_INVOICED as the winning error on a dual-failure payment.
  - name: error_producer_not_compliant_is_exercised_by_the_dock_priority_instance
    claim_type: error_triggerable
    grounds:
    - errors[ERR_PRODUCER_NOT_COMPLIANT]
    excluded_because:
      difficulty_instance: priority_pair_validation_conflict / dock_safety_check_precedes_capacity_constraint_check
      rationale: That instance asserts ERR_PRODUCER_NOT_COMPLIANT as the winning error on a dual-failure appointment booking.
  - name: error_allocations_not_staged_is_exercised_by_the_dispatch_dependency_instance
    claim_type: error_triggerable
    grounds:
    - errors[ERR_ALLOCATIONS_NOT_STAGED]
    excluded_because:
      difficulty_instance: cross_entity_state_dependency / route_dispatch_depends_on_allocation_staging_state
      rationale: The first trigger call of that instance dispatches a route whose allocations are still RESERVED and asserts the error id directly.
  - name: error_review_cycle_limit_and_segregation_pairs_are_enumerated_elsewhere
    claim_type: error_triggerable
    grounds:
    - errors[ERR_REVIEW_CYCLE_LIMIT]
    excluded_because:
      difficulty_instance: non_linear_state_machine / producer_changes_requested_resubmission_cycle
      rationale: The cyclic difficulty instance drives review_cycles to 2 on the same loop this corner walks to 3; the limit itself is asserted live by the corner instance fourth_request_changes_hits_the_review_cycle_limit.
