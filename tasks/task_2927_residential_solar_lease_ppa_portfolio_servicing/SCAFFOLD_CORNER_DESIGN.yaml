          assert:
            - "the reconcile response itself already carries status CREDIT_ISSUED, credit_cents 1837, gross_due_cents 13660, credit_applied_cents 0, net_due_cents 13660, total_invoiced_cents 13660"
            - "the immediately following agreement read shows credit_earned_cents 1837, credit_applied_cents 0 and credit_balance_cents 1837 — no lag, no stale denormalised copy"
            - "the outage-creation response itself already carries the agreement-side projection consequence: a subsequent read shows monitoring_status OUTAGE_OPEN and open_outage_count 1"
            - "the final period read returns exactly the same settlement figures as the reconcile response, field for field"
            - "no endpoint requires a second call, a retry or a delay for any of these values to appear"

      - name: a_rejected_write_leaves_no_partial_state_behind
        claim_type: atomicity_of_rejection
        grounds:
          - complexity_profile.consistency_model
          - validations[priority=12].buyer_field_coherence
          - errors[ERR_BUYER_FIELD_MISMATCH]
          - state_machines.SolarAgreement.ACTIVE_to_TRANSFER_PENDING
        distinguishing_aspect: "A TransferCase creation has a documented cross-entity side effect (agreement ACTIVE -> TRANSFER_PENDING plus a version bump), so a coherence rejection is the sharpest partial-write probe in the domain: the agreement must be untouched, and the retry that succeeds must produce exactly one transition, not two."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z."
            - "One ACTIVE PPA agreement (A1 terms) owned by Dana Reyes, plus a prospective buyer Homeowner."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PortfolioAdmin
            - call: "POST /servicing/homeowners"
              payload: { full_name: "Dana Reyes", email: "dana.reyes@example.com", state_code: "CA", fico_score: 742, dti_ratio: 0.28, monthly_income_cents: 1150000 }
              as: PortfolioAdmin
              as_user_id: "u_admin_1"
              captures: { hoM2_id: $.data.id }
            - call: "POST /servicing/homeowners"
              payload: { full_name: "Priya Nair", email: "priya.nair@example.com", state_code: "CA", fico_score: 760, dti_ratio: 0.24, monthly_income_cents: 1400000 }
              as: PortfolioAdmin
              as_user_id: "u_admin_1"
              captures: { buyM2_id: $.data.id }
            - call: "POST /servicing/utility-tariffs"
              payload: { utility_code: "PGE", tariff_code: "NEM2-ETOUC", generation: "NEM_2", retail_rate_per_kwh_millicents: 32500, export_credit_rate_per_kwh_millicents: 28000, monthly_fixed_charge_cents: 1500, effective_from_date: "2020-04-15", grandfathers_predecessors: true }
              as: PortfolioAdmin
              as_user_id: "u_admin_1"
              captures: { tM2_id: $.data.id }
            - call: "POST /servicing/agreements"
              payload: { homeowner_id: "${hoM2_id}", tariff_id: "${tM2_id}", site_address: "918 Alder Way, Fremont CA", state_code: "CA", product_type: "PPA", term_years: 20, contract_start_date: "2025-01-01", escalator_pct: 0.029, guaranteed_annual_kwh: 9600, system_dc_kw: 7.20, guarantee_band_pct: 0.05, base_ppa_rate_per_kwh_millicents: 14750 }
              as: ServicingAgent
              as_user_id: "u_agent_1"
              captures: { agM2_id: $.data.id }
            - call: "POST /servicing/agreements/${agM2_id}/activate"
              payload: {}
              as: ServicingAgent
              as_user_id: "u_agent_1"
              captures: { agM2_ver: $.data.version }
          trigger:
            - call: "POST /servicing/transfer-cases"
              payload: { agreement_id: "${agM2_id}", transfer_type: "ASSUMPTION", closing_date: "2026-09-15" }
              as: ServicingAgent
              as_user_id: "u_agent_1"
            - call: "POST /servicing/transfer-cases"
              payload: { agreement_id: "${agM2_id}", transfer_type: "ASSUMPTION", closing_date: "2026-09-15", buyer_homeowner_id: "${hoM2_id}" }
              as: ServicingAgent
              as_user_id: "u_agent_1"
            - call: "POST /servicing/transfer-cases"
              payload: { agreement_id: "${agM2_id}", transfer_type: "ASSUMPTION", closing_date: "2026-09-15", buyer_homeowner_id: "${buyM2_id}" }
              as: ServicingAgent
              as_user_id: "u_agent_1"
              captures: { tcM2_id: $.data.id }
          assert:
            - "the first call returns 422 ERR_BUYER_FIELD_MISMATCH (an ASSUMPTION with no buyer)"
            - "the second call returns 422 ERR_BUYER_FIELD_MISMATCH (the buyer is the current homeowner)"
            - "after both rejections SolarAgreement.${agM2_id}.lifecycle_state is still ACTIVE and version is still ${agM2_ver}: the cross-entity side effect never ran"
            - "after both rejections GET /servicing/transfer-cases?agreement_id=${agM2_id} returns total_count 0"
            - "the third call returns 201 with status CREDIT_REVIEW, seller_homeowner_id == ${hoM2_id} and buyer_homeowner_id == ${buyM2_id}"
            - "SolarAgreement.${agM2_id}.lifecycle_state == TRANSFER_PENDING and version == ${agM2_ver} + 1 — exactly one transition, produced by the one accepted request"
