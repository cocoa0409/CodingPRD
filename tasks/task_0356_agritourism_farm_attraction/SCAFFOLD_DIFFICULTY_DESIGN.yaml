              as: FarmManager
            - call: "POST /farms/${farm_id}/admission-windows"
              payload: { starts_at: "2026-10-20T14:00:00Z", ends_at: "2026-10-20T16:00:00Z", capacity: 5 }
              as: FarmManager
              captures: { window_id: $.data.id, win_v0: $.data.version }
            - call: "POST /visitors"
              payload: { email: "pv@x.com", full_name: "Penny Valid" }
              as: FarmManager
              captures: { visitor_id: $.data.id }
            - call: "POST /farms/${farm_id}/season-passes"
              payload: { visitor_id: "${visitor_id}", valid_from: "2026-10-01T00:00:00Z", valid_until: "2026-11-01T00:00:00Z" }
              as: FarmManager
              captures: { pass_id: $.data.id }
            - call: "POST /reservations"
              payload: { window_id: "${window_id}", visitor_id: "${visitor_id}", adult_count: 1, child_count: 0, expected_window_version: "${win_v0}", season_pass_id: "${pass_id}" }
              as: Visitor
              as_user_id: "${visitor_id}"
              captures: { res_id: $.data.id }
            - call: "POST /season-passes/${pass_id}/revoke"
              payload: {}
              as: FarmManager
          trigger:
            - call: "POST /reservations/${res_id}/confirm"
              payload: {}
              as: Visitor
              as_user_id: "${visitor_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_PASS_NOT_VALID"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      # --- Instance 1: pumpkin weight >= breakpoint (weigh-out endpoint) ---
      - name: pumpkin_breakpoint_exactly_20lb_is_flat
        grounds:
          - calculations.pumpkin_charge
          - entities.PricingPolicy.fields.heavy_pumpkin_lb
        distinguishing_aspect: |
          Metric: pumpkin weight at the heavy breakpoint via POST weigh-out. A pumpkin weighing exactly
          20.0 lb (== heavy_pumpkin_lb) is billed flat-each 2500 (>= boundary), NOT per-lb 3000; a 19.0 lb
          pumpkin is per-lb 2850. The >= boundary is decisive.
        test_recipe:
          setup:
            - "CHECKED_IN reservation; two pumpkins added, one to be weighed at exactly 20.0 lb, one at 19.0 lb."
          setup_api_calls:
            - call: "POST /farms"
              payload: { name: "Boundary Farm" }
              as: FarmManager
              captures: { farm_id: $.data.id }
            - call: "POST /farms/${farm_id}/pricing-policies"
              payload: { adult_admission_cents: 2000, child_admission_cents: 1200, hayride_pass_cents: 800, maze_pass_cents: 600, upick_pass_cents: 1000, pumpkin_per_lb_cents: 150, pumpkin_flat_each_cents: 2500, season_pass_price_cents: 8000, heavy_pumpkin_lb: 20 }
              as: FarmManager
              captures: { policy_id: $.data.id }
            - call: "POST /pricing-policies/${policy_id}/activate"
              payload: {}
              as: FarmManager
            - call: "POST /farms/${farm_id}/admission-windows"
              payload: { starts_at: "2026-10-11T14:00:00Z", ends_at: "2026-10-11T16:00:00Z", capacity: 10 }
              as: FarmManager
              captures: { window_id: $.data.id, win_v0: $.data.version }
            - call: "POST /visitors"
              payload: { email: "bd@x.com", full_name: "Brett Bound" }
              as: FarmManager
              captures: { visitor_id: $.data.id }
            - call: "POST /reservations"
              payload: { window_id: "${window_id}", visitor_id: "${visitor_id}", adult_count: 1, child_count: 0, expected_window_version: "${win_v0}" }
              as: Visitor
              as_user_id: "${visitor_id}"
              captures: { res_id: $.data.id }
            - call: "POST /reservations/${res_id}/confirm"
              payload: {}
              as: Visitor
              as_user_id: "${visitor_id}"
            - call: "POST /reservations/${res_id}/waivers"
              payload: { participant_name: "Brett Bound" }
              as: Visitor
              as_user_id: "${visitor_id}"
            - call: "POST /reservations/${res_id}/check-in"
              payload: {}
              as: GateAgent
            - call: "POST /reservations/${res_id}/pumpkin-purchases"
              payload: { estimated_weight_lb: 20 }
              as: Visitor
              as_user_id: "${visitor_id}"
              captures: { pk20: $.data.id }
            - call: "POST /reservations/${res_id}/pumpkin-purchases"
              payload: { estimated_weight_lb: 19 }
              as: Visitor
              as_user_id: "${visitor_id}"
              captures: { pk19: $.data.id }
            - call: "POST /pumpkin-purchases/${pk19}/weigh-out"
              payload: { scale_weight_lb: 19 }
              as: GateAgent
          trigger:
            - call: "POST /pumpkin-purchases/${pk20}/weigh-out"
              payload: { scale_weight_lb: 20 }
              as: GateAgent
              captures: { charge20: $.data.charge_cents }
          assert:
            - "PumpkinPurchase.${pk20}.charge_cents == 2500"
            - "PumpkinPurchase.${pk19}.charge_cents == 2850"

      # --- Instance 2: window seats_available >= request (reservations endpoint), exact fit ---
      - name: window_seats_exact_fit_succeeds_one_over_rejects
        grounds:
          - validations[priority=13]
          - calculations.window_seats
          - entities.AdmissionWindow.fields.seats_available
        distinguishing_aspect: |
          A different metric (window seat count) reached through a different endpoint (POST /reservations):
          with seats_available == 3, a reservation of participant_count 3 succeeds (>= holds at equality)
          while a participant_count 4 reservation is rejected ERR_WINDOW_SOLD_OUT; the boundary is exact.
        test_recipe:
          setup:
            - "Farm OPEN; window capacity 3, no prior reservations (seats_available 3)."
            - "A participant_count 4 reservation is rejected; then a participant_count 3 reservation succeeds and exhausts the window."
          setup_api_calls:
            - call: "POST /farms"
              payload: { name: "Fit Farm" }
              as: FarmManager
              captures: { farm_id: $.data.id }
            - call: "POST /farms/${farm_id}/pricing-policies"
              payload: { adult_admission_cents: 2000, child_admission_cents: 1200, hayride_pass_cents: 800, maze_pass_cents: 600, upick_pass_cents: 1000, pumpkin_per_lb_cents: 150, pumpkin_flat_each_cents: 2500, season_pass_price_cents: 8000 }
              as: FarmManager
              captures: { policy_id: $.data.id }
            - call: "POST /pricing-policies/${policy_id}/activate"
              payload: {}
              as: FarmManager
            - call: "POST /farms/${farm_id}/admission-windows"
              payload: { starts_at: "2026-10-11T14:00:00Z", ends_at: "2026-10-11T16:00:00Z", capacity: 3 }
              as: FarmManager
              captures: { window_id: $.data.id, win_v0: $.data.version }
            - call: "POST /visitors"
              payload: { email: "f1@x.com", full_name: "Fred Fit" }
              as: FarmManager
              captures: { v1: $.data.id }
            - call: "POST /visitors"
              payload: { email: "f2@x.com", full_name: "Fiona Fit" }
              as: FarmManager
              captures: { v2: $.data.id }
            - call: "POST /reservations"
              payload: { window_id: "${window_id}", visitor_id: "${v2}", adult_count: 4, child_count: 0, expected_window_version: "${win_v0}" }
              as: Visitor
              as_user_id: "${v2}"
              captures: { rej_err: $.data.error_id }
          trigger:
            - call: "POST /reservations"
              payload: { window_id: "${window_id}", visitor_id: "${v1}", adult_count: 2, child_count: 1, expected_window_version: "${win_v0}" }
              as: Visitor
              as_user_id: "${v1}"
              captures: { ok_id: $.data.id }
          assert:
            - "Reservation.${ok_id}.participant_count == 3"
            - "Reservation.${ok_id}.status == PENDING"
            - "AdmissionWindow.${window_id}.seats_available == 0"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      # --- Instance 1: Reservation confirm depends on Farm.operational_status ---
      - name: reservation_confirm_blocked_when_farm_weather_hold
        grounds:
          - state_machines.Reservation.PENDING_to_CONFIRMED
          - entities.Farm.fields.operational_status
          - validations[priority=5]
        distinguishing_aspect: |
          Entity pair Reservation -> Farm: a PENDING reservation cannot move to CONFIRMED while its owning
          Farm.operational_status == WEATHER_HOLD; the confirm returns ERR_FARM_NOT_OPEN and the reservation
          stays PENDING — Reservation's valid transition depends on the Farm's posture.
