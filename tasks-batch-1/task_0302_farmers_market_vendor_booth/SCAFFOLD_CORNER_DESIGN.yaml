              payload: {}
              as: MarketAdmin
            - call: "POST /applications/${app}/approve"
              payload: { review_note: "ok" }
              as: MarketAdmin
          trigger:
            - call: "POST /booth-assignments"
              payload: { market_id: "${mkt}", booth_id: "${booth}", vendor_id: "${ven}", assignment_type: "SEASON", expected_booth_version: "${booth_v}" }
              as: Vendor
              as_user_id: "${ven}"
