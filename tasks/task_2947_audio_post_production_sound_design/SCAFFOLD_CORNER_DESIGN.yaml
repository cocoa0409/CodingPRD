              as: FacilityAdmin
              as_user_id: "admin-1"
              captures: { asset_three_id: $.data.id }
          trigger:
            - call: "GET /library-assets?limit=0"
              as: FacilityAdmin
              as_user_id: "admin-1"
              captures: { limit_zero_error: $.data.error_id }
            - call: "GET /library-assets?limit=101"
              as: FacilityAdmin
              as_user_id: "admin-1"
              captures: { limit_over_max_error: $.data.error_id }
            - call: "GET /library-assets?offset=-1"
              as: FacilityAdmin
              as_user_id: "admin-1"
              captures: { negative_offset_error: $.data.error_id }
            - call: "GET /library-assets?limit=2&offset=0"
              as: FacilityAdmin
              as_user_id: "admin-1"
            - call: "GET /library-assets?limit=2&offset=2"
              as: FacilityAdmin
              as_user_id: "admin-1"
