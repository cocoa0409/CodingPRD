              captures: { t1: $.data.id }
            - call: "POST /dairy/orders"
              payload: { store_id: "${s1}", trip_id: "${t1}", lines: [{ product_id: "${pl}", quantity_units: 20 }], delivery_window_start: "2026-08-10T08:00:00Z", delivery_window_end: "2026-08-10T08:30:00Z" }
              as: DistributorOwner
              as_user_id: "${d1}"
              captures: { o1: $.data.id }
            - { call: "POST /dairy/orders/${o1}/confirm", payload: {}, as: DistributorOwner, as_user_id: "${d1}" }
            - call: "POST /dairy/orders"
              payload: { store_id: "${s1}", trip_id: "${t1}", lines: [{ product_id: "${pl}", quantity_units: 40 }], delivery_window_start: "2026-08-10T08:35:00Z", delivery_window_end: "2026-08-10T09:00:00Z" }
              as: DistributorOwner
              as_user_id: "${d1}"
              captures: { o2: $.data.id }
          trigger:
