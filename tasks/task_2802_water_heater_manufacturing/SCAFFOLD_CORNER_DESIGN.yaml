        distinguishing_aspect: >
          The range spans two production periods, so only a full-string ASCII comparison resolves it: the
          population is 202608-00002, 202608-00003 and 202609-00001. An implementation that parses the 5-digit
          suffix and compares 2 <= n <= 1 resolves an empty population and returns ERR_RECALL_SCOPE_EMPTY, and one
          that compares only the period drags in 202609-00002. The serial sequence restarts at 00001 in the new
          period, which is what makes the numeric shortcut fail.
