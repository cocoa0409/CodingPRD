# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Municipal Transfer of Development Rights (TDR) Program — task 2756
# Breadth walk of references/claim-extraction-guide.md against SCAFFOLD.yaml
# §1.1–§1.7. Corners already asserted by §1.8 appear as excluded_because stubs.
# =============================================================================
scaffold_corner_design:

  - section: entities
    instances:

      - name: party_creation_returns_the_full_declared_field_set
        claim_type: creation
        grounds:
          - entities.Party
          - endpoints.POST_tdr_parties
          - response_envelope.success
        distinguishing_aspect: "A party created with every declared input returns 201 with all system and computed fields at their declared defaults and the common fields minted by the server."
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z (the startup default — no clock call is made)"
            - "no parties exist"
          setup_api_calls: []
          trigger:
            - call: "POST /tdr/parties"
              payload: { kind: "LANDOWNER", legal_name: "Ridge Farm LLC", contact_email: "ridge@example.org", neighborhood_code: "NB-EAST" }
              as: ProgramAdministrator
              captures: { own_id: $.data.id }
          assert:
            - "the response is 201 with response_type object and meta.api_request_id present"
            - "Party.${own_id}.kind == LANDOWNER and legal_name == Ridge Farm LLC and contact_email == ridge@example.org"
            - "Party.${own_id}.neighborhood_code == NB-EAST"
            - "Party.${own_id}.cash_balance_cents == 0 and fee_revenue_cents == 0"
            - "Party.${own_id}.units_held == 0 and certificates_held_count == 0"
            - "Party.${own_id}.status == ACTIVE"
            - "Party.${own_id}.version == 1 and id is a bare UUID with no type prefix"
            - "Party.${own_id}.created_at == 2026-08-01T00:00:00.000Z and updated_at == 2026-08-01T00:00:00.000Z"

      - name: party_neighborhood_code_defaults_to_null_when_omitted
        claim_type: defaults
        grounds:
          - entities.Party.fields.neighborhood_code
          - entities.ReceivingArea.fields.eligible_sending_area_codes
        distinguishing_aspect: "Optional inputs fall back to their declared defaults rather than to an empty string: an omitted neighborhood_code is null, and an omitted eligible_sending_area_codes is the empty list, which means every sending area is eligible."
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "no parties and no receiving areas exist"
          setup_api_calls: []
          trigger:
            - call: "POST /tdr/parties"
              payload: { kind: "DEVELOPER", legal_name: "Core Block Partners", contact_email: "core@example.org" }
              as: ProgramAdministrator
              captures: { dev_id: $.data.id }
            - call: "POST /tdr/receiving-areas"
              payload: { code: "RA-CORE", name: "Core Receiving Area", neighborhood_code: "NB-CORE", base_density_units_per_acre: 4.0, max_bonus_pct: 0.35, absorption_cap_units: 500, design_review_required: false }
              as: ProgramAdministrator
              captures: { ra_id: $.data.id }
          assert:
            - "Party.${dev_id}.neighborhood_code == null"
            - "ReceivingArea.${ra_id}.eligible_sending_area_codes == [] (empty list, not null)"
            - "ReceivingArea.${ra_id}.absorbed_units == 0 and reserved_units == 0"
            - "ReceivingArea.${ra_id}.status == DRAFT (the declared initial_state, not ACTIVE)"
            - "ReceivingArea.${ra_id}.version == 1"

      - name: account_action_credit_without_amount_is_rejected
        claim_type: required_fields
        grounds:
          - endpoints.POST_tdr_parties_id_account-actions
          - validations.priority_4_ERR_INVALID_REQUEST
        distinguishing_aspect: "amount_cents is optional in the endpoint signature but conditionally required: CREDIT and DEBIT need it while SUSPEND and REINSTATE forbid it, so a CREDIT with no amount is a shape error, not a fiscal one."
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "one DEVELOPER party at version 1 with cash_balance_cents 0"
          setup_api_calls:
            - call: "POST /tdr/parties"
              payload: { kind: "DEVELOPER", legal_name: "Core Block Partners", contact_email: "core@example.org", neighborhood_code: "NB-CORE" }
              as: ProgramAdministrator
              captures: { dev_id: $.data.id, dev_v: $.data.version }
          trigger:
            - call: "POST /tdr/parties/${dev_id}/account-actions"
              payload: { action: "CREDIT", expected_party_version: "${dev_v}" }
              as: ProgramAdministrator
            - call: "POST /tdr/parties/${dev_id}/account-actions"
              payload: { action: "SUSPEND", amount_cents: 100, expected_party_version: "${dev_v}" }
              as: ProgramAdministrator
          assert:
            - "the CREDIT without amount_cents returns 400 ERR_INVALID_REQUEST"
            - "the SUSPEND carrying an amount_cents returns 400 ERR_INVALID_REQUEST"
            - "Party.${dev_id}.cash_balance_cents == 0 and status == ACTIVE and version == 1 (neither rejected call wrote anything)"

      - name: sending_parcel_invalid_soil_class_enum_rejected
        claim_type: type_constraints
        grounds:
          - entities.SendingParcel.fields.soil_class
          - entities.Party.fields.contact_email
          - validations.priority_4_ERR_INVALID_REQUEST
        distinguishing_aspect: "Field-level constraints are enforced before any business rule: an out-of-enum soil_class and a contact_email with no '@' both return ERR_INVALID_REQUEST even though the referenced parents are perfectly valid."
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "one LANDOWNER party and one ACTIVE sending area SA-EAST"
          setup_api_calls:
            - call: "POST /tdr/parties"
              payload: { kind: "LANDOWNER", legal_name: "Ridge Farm LLC", contact_email: "ridge@example.org", neighborhood_code: "NB-EAST" }
              as: ProgramAdministrator
              captures: { own_id: $.data.id }
            - call: "POST /tdr/sending-areas"
              payload: { code: "SA-EAST", name: "East Ridge", neighborhood_code: "NB-EAST", allocation_formula_version: "V1_NET_ACRE", base_rate_units_per_acre: 0.25, gross_discount_factor: 0.80, equity_tier: "UNDERSERVED", sending_cap_units: 200 }
              as: ProgramAdministrator
              captures: { sa_id: $.data.id }
            - call: "POST /tdr/sending-areas/${sa_id}/activate"
              payload: {}
              as: ProgramAdministrator
          trigger:
            - call: "POST /tdr/sending-parcels"
              payload: { owner_party_id: "${own_id}", sending_area_id: "${sa_id}", apn: "APN-BAD", gross_acres: 100.00, constrained_acres: 22.00, soil_class: "ROCKY", existing_dwelling_units: 2 }
              as: ProgramAdministrator
            - call: "POST /tdr/parties"
              payload: { kind: "DEVELOPER", legal_name: "No At Sign Ltd", contact_email: "core-example.org", neighborhood_code: "NB-CORE" }
              as: ProgramAdministrator
          assert:
            - "the parcel with soil_class ROCKY returns 400 ERR_INVALID_REQUEST"
            - "the party with a contact_email lacking '@' returns 400 ERR_INVALID_REQUEST"
            - "GET /tdr/sending-parcels?sending_area_id=${sa_id} returns total_count 0"
            - "GET /tdr/parties?kind=DEVELOPER returns total_count 0"

      - name: sending_parcel_baseline_is_computed_not_supplied
        claim_type: computed_fields
        grounds:
          - entities.SendingParcel.fields.baseline_allocation_units
          - entities.SendingParcel.fields.remaining_units
          - calculations.parcel_baseline_allocation
        distinguishing_aspect: "baseline_allocation_units is not in the endpoint's input list at all — it is derived at enrollment from acreage, soil class, dwelling count, and the area's formula version, and the derived remaining_units mirrors it exactly."
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "one LANDOWNER party; ACTIVE sending area SA-EAST with allocation_formula_version V1_NET_ACRE and base_rate_units_per_acre 0.25"
          setup_api_calls:
            - call: "POST /tdr/parties"
              payload: { kind: "LANDOWNER", legal_name: "Ridge Farm LLC", contact_email: "ridge@example.org", neighborhood_code: "NB-EAST" }
              as: ProgramAdministrator
              captures: { own_id: $.data.id }
            - call: "POST /tdr/sending-areas"
              payload: { code: "SA-EAST", name: "East Ridge", neighborhood_code: "NB-EAST", allocation_formula_version: "V1_NET_ACRE", base_rate_units_per_acre: 0.25, gross_discount_factor: 0.80, equity_tier: "UNDERSERVED", sending_cap_units: 200 }
              as: ProgramAdministrator
              captures: { sa_id: $.data.id }
            - call: "POST /tdr/sending-areas/${sa_id}/activate"
              payload: {}
              as: ProgramAdministrator
          trigger:
            - call: "POST /tdr/sending-parcels"
              payload: { owner_party_id: "${own_id}", sending_area_id: "${sa_id}", apn: "APN-STAT", gross_acres: 50.00, constrained_acres: 10.00, soil_class: "STATEWIDE", existing_dwelling_units: 1 }
              as: ProgramAdministrator
              captures: { parcel_id: $.data.id }
          assert:
            - "SendingParcel.${parcel_id}.baseline_allocation_units == 10 (floor(40.00 * 0.25 * 1.10) = floor(11.0) = 11, minus 1 dwelling)"
            - "SendingParcel.${parcel_id}.remaining_units == 10 and severed_units == 0"
            - "SendingParcel.${parcel_id}.restricted_acres == 0.00"
            - "SendingParcel.${parcel_id}.easement_status == NONE and parcel_status == UNSEVERED"
            - "SendingArea.${sa_id}.severed_units_total == 0"

      - name: sending_parcel_unknown_id_returns_not_found
        claim_type: not_found
        grounds:
          - errors.ERR_SENDING_PARCEL_NOT_FOUND
          - validations.priority_3_path_existence
        distinguishing_aspect: "A syntactically valid UUID that names no row returns the entity's own 404 error id — not a generic 404 and not ERR_INVALID_REQUEST — and the path check runs before any body validation."
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "no sending parcels and no severance applications exist"
          setup_api_calls: []
          trigger:
            - call: "GET /tdr/sending-parcels/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ProgramAdministrator
            - call: "GET /tdr/certificates/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ProgramAdministrator
          assert:
            - "the parcel read returns 404 ERR_SENDING_PARCEL_NOT_FOUND"
            - "the certificate read returns 404 ERR_CERTIFICATE_NOT_FOUND"
            - "both responses use response_type error with data.error_id and data.message present"

      - name: sending_area_listing_honors_pagination_and_filters
        claim_type: listing
        grounds:
          - endpoints.GET_tdr_sending-areas
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "The list envelope reports limit, offset, total_count, and has_more against the FILTERED set, and the declared default limit of 10 applies when the client sends none; offset walks the same ordering without repeats."
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "three sending areas exist in NB-EAST — SA-E1 and SA-E2 are ACTIVE, SA-E3 is left DRAFT — plus one ACTIVE area SA-W1 in NB-WEST"
          setup_api_calls:
            - call: "POST /tdr/sending-areas"
              payload: { code: "SA-E1", name: "East One", neighborhood_code: "NB-EAST", allocation_formula_version: "V1_NET_ACRE", base_rate_units_per_acre: 0.25, gross_discount_factor: 0.80, equity_tier: "UNDERSERVED", sending_cap_units: 200 }
              as: ProgramAdministrator
              captures: { sa1: $.data.id }
            - call: "POST /tdr/sending-areas/${sa1}/activate"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /tdr/sending-areas"
              payload: { code: "SA-E2", name: "East Two", neighborhood_code: "NB-EAST", allocation_formula_version: "V2_GROSS_DISCOUNTED", base_rate_units_per_acre: 0.25, gross_discount_factor: 0.80, equity_tier: "MODERATE", sending_cap_units: 200 }
              as: ProgramAdministrator
              captures: { sa2: $.data.id }
            - call: "POST /tdr/sending-areas/${sa2}/activate"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /tdr/sending-areas"
              payload: { code: "SA-E3", name: "East Three", neighborhood_code: "NB-EAST", allocation_formula_version: "V1_NET_ACRE", base_rate_units_per_acre: 0.25, gross_discount_factor: 0.80, equity_tier: "HIGH_VALUE", sending_cap_units: 200 }
              as: ProgramAdministrator
              captures: { sa3: $.data.id }
            - call: "POST /tdr/sending-areas"
              payload: { code: "SA-W1", name: "West One", neighborhood_code: "NB-WEST", allocation_formula_version: "V1_NET_ACRE", base_rate_units_per_acre: 0.25, gross_discount_factor: 0.80, equity_tier: "HIGH_VALUE", sending_cap_units: 200 }
              as: ProgramAdministrator
              captures: { sa4: $.data.id }
            - call: "POST /tdr/sending-areas/${sa4}/activate"
              payload: {}
              as: ProgramAdministrator
          trigger:
            - call: "GET /tdr/sending-areas"
              payload: {}
              as: ProgramAdministrator
            - call: "GET /tdr/sending-areas"
              payload: { neighborhood_code: "NB-EAST", status: "ACTIVE" }
              as: ProgramAdministrator
            - call: "GET /tdr/sending-areas"
              payload: { neighborhood_code: "NB-EAST", limit: 1, offset: 1 }
              as: ProgramAdministrator
          assert:
            - "the unfiltered list returns response_type array with total_count 4, limit 10, offset 0, has_more false"
            - "the NB-EAST + ACTIVE list returns total_count 2 containing exactly ${sa1} and ${sa2}"
            - "the NB-EAST + ACTIVE list excludes ${sa3} (DRAFT) and ${sa4} (NB-WEST)"
            - "the limit 1 / offset 1 page over NB-EAST returns exactly 1 row, total_count 3, has_more true"
            - "the limit 1 / offset 1 page returns a different row than limit 1 / offset 0 over the same filter"

      - name: certificate_read_returns_the_stored_unit_ledger
        claim_type: retrieval
        grounds:
          - endpoints.GET_tdr_certificates_id
          - entities.Certificate
          - calculations.rights_ledger_identity
        distinguishing_aspect: "A freshly certified certificate reads back with the whole ledger consistent — units_face equals units_remaining, every consumption counter is zero, and the lineage fields identify a root certificate."
        test_recipe:
          setup:
            - "logical clock at 2026-08-10T00:00:00Z"
            - "LANDOWNER party; ACTIVE sending area SA-EAST (cap 200, V1_NET_ACRE, base_rate 0.25) in NB-EAST"
            - "parcel APN-001 (100.00 / 22.00 / PRIME / 2 dwellings) severed for its full 22 units and certified"
          setup_api_calls:
            - call: "POST /tdr/_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /tdr/parties"
              payload: { kind: "LANDOWNER", legal_name: "Ridge Farm LLC", contact_email: "ridge@example.org", neighborhood_code: "NB-EAST" }
              as: ProgramAdministrator
              captures: { own_id: $.data.id }
            - call: "POST /tdr/sending-areas"
              payload: { code: "SA-EAST", name: "East Ridge", neighborhood_code: "NB-EAST", allocation_formula_version: "V1_NET_ACRE", base_rate_units_per_acre: 0.25, gross_discount_factor: 0.80, equity_tier: "UNDERSERVED", sending_cap_units: 200 }
              as: ProgramAdministrator
              captures: { sa_id: $.data.id }
            - call: "POST /tdr/sending-areas/${sa_id}/activate"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /tdr/sending-parcels"
              payload: { owner_party_id: "${own_id}", sending_area_id: "${sa_id}", apn: "APN-001", gross_acres: 100.00, constrained_acres: 22.00, soil_class: "PRIME", existing_dwelling_units: 2 }
              as: ProgramAdministrator
              captures: { parcel_id: $.data.id }
            - call: "POST /tdr/severance-applications"
              payload: { sending_parcel_id: "${parcel_id}", applicant_party_id: "${own_id}", requested_units: 22 }
              as: Landowner
              as_user_id: "${own_id}"
              captures: { app_id: $.data.id }
            - call: "POST /tdr/severance-applications/${app_id}/screen"
              payload: {}
              as: SeveranceReviewer
              as_user_id: "rev-1"
            - call: "POST /tdr/severance-applications/${app_id}/review-decision"
              payload: { decision: "APPROVE" }
              as: SeveranceReviewer
              as_user_id: "rev-1"
            - call: "POST /tdr/severance-applications/${app_id}/certify"
              payload: {}
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { cert_id: $.data.id, eas_id: $.data.conservation_easement_id }
          trigger:
            - call: "GET /tdr/certificates/${cert_id}"
              payload: {}
              as: Landowner
              as_user_id: "${own_id}"
          assert:
            - "the read returns 200 with response_type object"
            - "Certificate.${cert_id}.units_face == 22 and units_remaining == 22"
            - "Certificate.${cert_id}.units_split_out == 0 and units_encumbered == 0 and units_redeemed == 0 and units_retired == 0"
            - "Certificate.${cert_id}.split_count == 0 and generation == 1 and parent_certificate_id == null"
            - "Certificate.${cert_id}.lifecycle_status == ISSUED and market_status == HELD"
            - "Certificate.${cert_id}.holder_party_id == ${own_id} and origin_sending_area_id == ${sa_id}"
            - "Certificate.${cert_id}.origin_neighborhood_code == NB-EAST and conservation_easement_id == ${eas_id}"
            - "Certificate.${cert_id}.serial_number == TDR-SA-EAST-00001 and issued_at == 2026-08-10T00:00:00Z"

      - name: certificate_transfer_log_is_append_only_and_versionless
        claim_type: immutability
        grounds:
          - entities.CertificateTransfer
          - endpoints.GET_tdr_certificate-transfers
          - state_machines.SeveranceApplication.APPROVED_to_CERTIFIED
        distinguishing_aspect: "CertificateTransfer is declared common_fields false, so it carries only id and created_at — no version and no update endpoint anywhere in §1.5. The chain of title is written only as new rows, and the ISSUANCE row is seq_no 1 with a null from_party_id."
        test_recipe:
          setup:
            - "logical clock at 2026-08-10T00:00:00Z"
            - "LANDOWNER party; ACTIVE SA-EAST; parcel APN-001 (100.00 / 22.00 / PRIME / 2) severed for 22 units and certified"
          setup_api_calls:
            - call: "POST /tdr/_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /tdr/parties"
              payload: { kind: "LANDOWNER", legal_name: "Ridge Farm LLC", contact_email: "ridge@example.org", neighborhood_code: "NB-EAST" }
              as: ProgramAdministrator
              captures: { own_id: $.data.id }
            - call: "POST /tdr/sending-areas"
              payload: { code: "SA-EAST", name: "East Ridge", neighborhood_code: "NB-EAST", allocation_formula_version: "V1_NET_ACRE", base_rate_units_per_acre: 0.25, gross_discount_factor: 0.80, equity_tier: "UNDERSERVED", sending_cap_units: 200 }
              as: ProgramAdministrator
              captures: { sa_id: $.data.id }
            - call: "POST /tdr/sending-areas/${sa_id}/activate"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /tdr/sending-parcels"
              payload: { owner_party_id: "${own_id}", sending_area_id: "${sa_id}", apn: "APN-001", gross_acres: 100.00, constrained_acres: 22.00, soil_class: "PRIME", existing_dwelling_units: 2 }
              as: ProgramAdministrator
              captures: { parcel_id: $.data.id }
            - call: "POST /tdr/severance-applications"
              payload: { sending_parcel_id: "${parcel_id}", applicant_party_id: "${own_id}", requested_units: 22 }
              as: Landowner
              as_user_id: "${own_id}"
              captures: { app_id: $.data.id }
            - call: "POST /tdr/severance-applications/${app_id}/screen"
              payload: {}
              as: SeveranceReviewer
              as_user_id: "rev-1"
            - call: "POST /tdr/severance-applications/${app_id}/review-decision"
              payload: { decision: "APPROVE" }
              as: SeveranceReviewer
              as_user_id: "rev-1"
            - call: "POST /tdr/severance-applications/${app_id}/certify"
              payload: {}
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { cert_id: $.data.id }
          trigger:
            - call: "GET /tdr/certificate-transfers"
              payload: { certificate_id: "${cert_id}" }
              as: ProgramAdministrator
          assert:
            - "the list returns total_count 1"
            - "the single row has transfer_type ISSUANCE, seq_no 1, from_party_id null, to_party_id ${own_id}, units 22, price_cents null"
            - "the row has recorded_at == 2026-08-10T00:00:00Z and market_transaction_id == null"
            - "the row exposes id and created_at only — no version and no updated_at field"
            - "no PUT, PATCH, or DELETE endpoint exists for /tdr/certificate-transfers anywhere in §1.5"

      - name: severance_application_naming_an_unknown_parcel_is_not_found
        claim_type: parent_relationships
        grounds:
          - entities.SeveranceApplication.fields.sending_parcel_id
          - validations.priority_5_body_foreign_keys
          - errors.ERR_SENDING_PARCEL_NOT_FOUND
        distinguishing_aspect: "A body foreign key that names no row is a 404 on the PARENT entity's error id, resolved at priority 5 — before ownership, party-kind, or any state check on the application itself."
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "one LANDOWNER party exists; no sending parcels exist"
          setup_api_calls:
            - call: "POST /tdr/parties"
              payload: { kind: "LANDOWNER", legal_name: "Ridge Farm LLC", contact_email: "ridge@example.org", neighborhood_code: "NB-EAST" }
              as: ProgramAdministrator
              captures: { own_id: $.data.id }
          trigger:
            - call: "POST /tdr/severance-applications"
              payload: { sending_parcel_id: "00000000-0000-4000-8000-000000000000", applicant_party_id: "${own_id}", requested_units: 5 }
              as: Landowner
              as_user_id: "${own_id}"
          assert:
            - "the call returns 404 ERR_SENDING_PARCEL_NOT_FOUND"
            - "the call does NOT return ERR_INVALID_REQUEST or ERR_NOT_RESOURCE_OWNER"
            - "GET /tdr/severance-applications?applicant_party_id=${own_id} returns total_count 0"

      - name: certificate_graph_is_reachable_through_lineage_and_redemption_junction
        claim_type: graph
        grounds:
          - complexity_profile.entity_topology
          - entities.Certificate.fields.parent_certificate_id
          - entities.CertificateRedemption
          - endpoints.GET_tdr_certificates
          - endpoints.GET_tdr_certificate-redemptions
        distinguishing_aspect: "The graph topology is navigable in both directions: the self-referential split lineage is reachable by filtering certificates on parent_certificate_id, and the many-to-many junction between Certificate and ReceivingSiteApplication is reachable from either side of CertificateRedemption."
        test_recipe:
          setup:
            - "logical clock at 2026-08-10T00:00:00Z"
            - "LANDOWNER and DEVELOPER parties; ACTIVE SA-EAST; a 22-unit certificate held by the landowner"
            - "ACTIVE receiving area RA-CORE (base_density 4.0, max_bonus_pct 0.35, cap 500, design_review_required false)"
            - "the certificate has been split once, leaving a generation-2 child of 8 units"
          setup_api_calls:
            - call: "POST /tdr/_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /tdr/parties"
              payload: { kind: "LANDOWNER", legal_name: "Ridge Farm LLC", contact_email: "ridge@example.org", neighborhood_code: "NB-EAST" }
              as: ProgramAdministrator
              captures: { own_id: $.data.id }
            - call: "POST /tdr/sending-areas"
              payload: { code: "SA-EAST", name: "East Ridge", neighborhood_code: "NB-EAST", allocation_formula_version: "V1_NET_ACRE", base_rate_units_per_acre: 0.25, gross_discount_factor: 0.80, equity_tier: "UNDERSERVED", sending_cap_units: 200 }
              as: ProgramAdministrator
              captures: { sa_id: $.data.id }
            - call: "POST /tdr/sending-areas/${sa_id}/activate"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /tdr/sending-parcels"
              payload: { owner_party_id: "${own_id}", sending_area_id: "${sa_id}", apn: "APN-001", gross_acres: 100.00, constrained_acres: 22.00, soil_class: "PRIME", existing_dwelling_units: 2 }
              as: ProgramAdministrator
              captures: { parcel_id: $.data.id }
            - call: "POST /tdr/severance-applications"
              payload: { sending_parcel_id: "${parcel_id}", applicant_party_id: "${own_id}", requested_units: 22 }
              as: Landowner
              as_user_id: "${own_id}"
              captures: { app_id: $.data.id }
            - call: "POST /tdr/severance-applications/${app_id}/screen"
              payload: {}
              as: SeveranceReviewer
              as_user_id: "rev-1"
            - call: "POST /tdr/severance-applications/${app_id}/review-decision"
              payload: { decision: "APPROVE" }
              as: SeveranceReviewer
              as_user_id: "rev-1"
            - call: "POST /tdr/severance-applications/${app_id}/certify"
              payload: {}
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { cert_id: $.data.id, eas_id: $.data.conservation_easement_id, cert_v: $.data.version }
            - call: "POST /tdr/certificates/${cert_id}/split"
              payload: { units: 8, expected_certificate_version: "${cert_v}" }
              as: Landowner
              as_user_id: "${own_id}"
              captures: { child_id: $.data.id }
          trigger:
            - call: "GET /tdr/certificates"
              payload: { parent_certificate_id: "${cert_id}" }
              as: ProgramAdministrator
            - call: "GET /tdr/certificates"
              payload: { conservation_easement_id: "${eas_id}" }
              as: ProgramAdministrator
            - call: "GET /tdr/certificate-redemptions"
              payload: { certificate_id: "${cert_id}" }
              as: ProgramAdministrator
          assert:
            - "the parent_certificate_id filter returns total_count 1 containing exactly ${child_id}"
            - "Certificate.${child_id}.generation == 2 and units_face == 8 and units_remaining == 8"
            - "the conservation_easement_id filter returns total_count 2 containing both ${cert_id} and ${child_id}"
            - "the redemption filter returns total_count 0 with response_type array (an empty junction is a list, not a 404)"
            - "Certificate.${cert_id}.split_count == 1 and units_split_out == 8 and units_remaining == 14"
            - "ConservationEasement.${eas_id}.units_issued_total == 22 and units_outstanding == 22"

  # ===========================================================================
  # §1.9.2 State machines
  # ===========================================================================
  - section: state_machines
    instances:

      - name: severance_application_is_born_in_submitted_with_a_zeroed_decision_record
        claim_type: initial_state
        grounds:
          - state_machines.SeveranceApplication.initial_state
          - endpoints.POST_tdr_severance-applications
          - entities.SeveranceApplication
        distinguishing_aspect: "The declared initial_state is SUBMITTED, and every field the review cycle later writes starts empty: revision_round 0, allocated_units 0, residual_units_retained 0, and all three actor stamps null. No screening has happened, so the application is not yet attributable to any reviewer."
        test_recipe:
          setup:
            - "logical clock left at its 2026-08-01T00:00:00Z startup default (no clock call at all)"
            - "LANDOWNER party; ACTIVE sending area SA-EAST; parcel APN-001 (100.00 / 22.00 / PRIME / 2) with baseline_allocation_units 22"
          setup_api_calls:
            - call: "POST /tdr/parties"
              payload: { kind: "LANDOWNER", legal_name: "Ridge Farm LLC", contact_email: "ridge@example.org", neighborhood_code: "NB-EAST" }
              as: ProgramAdministrator
              captures: { own_id: $.data.id }
            - call: "POST /tdr/sending-areas"
              payload: { code: "SA-EAST", name: "East Ridge", neighborhood_code: "NB-EAST", allocation_formula_version: "V1_NET_ACRE", base_rate_units_per_acre: 0.25, gross_discount_factor: 0.80, equity_tier: "UNDERSERVED", sending_cap_units: 200 }
              as: ProgramAdministrator
              captures: { sa_id: $.data.id }
            - call: "POST /tdr/sending-areas/${sa_id}/activate"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /tdr/sending-parcels"
              payload: { owner_party_id: "${own_id}", sending_area_id: "${sa_id}", apn: "APN-001", gross_acres: 100.00, constrained_acres: 22.00, soil_class: "PRIME", existing_dwelling_units: 2 }
              as: ProgramAdministrator
              captures: { parcel_id: $.data.id }
          trigger:
            - call: "POST /tdr/severance-applications"
              payload: { sending_parcel_id: "${parcel_id}", applicant_party_id: "${own_id}", requested_units: 22 }
              as: Landowner
              as_user_id: "${own_id}"
              captures: { app_id: $.data.id }
          assert:
            - "the call returns 201"
            - "SeveranceApplication.${app_id}.status == SUBMITTED"
            - "SeveranceApplication.${app_id}.revision_round == 0 and allocated_units == 0 and residual_units_retained == 0"
            - "SeveranceApplication.${app_id}.screened_by_user_id == null and decided_by_user_id == null and certified_by_user_id == null"
            - "SeveranceApplication.${app_id}.applied_formula_version == null and denial_reason == null"
            - "SeveranceApplication.${app_id}.version == 1 and created_at == 2026-08-01T00:00:00Z"
            - "SendingParcel.${parcel_id}.severed_units == 0 and parcel_status == UNSEVERED (filing alone severs nothing)"

      - name: screening_an_application_already_under_review_is_rejected
        claim_type: invalid_transitions
        grounds:
          - state_machines.SeveranceApplication.SUBMITTED_to_UNDER_REVIEW
          - validations.priority_11_application_screenable
          - errors.ERR_APPLICATION_NOT_SCREENABLE
        distinguishing_aspect: "SUBMITTED -> UNDER_REVIEW is the only transition that accepts the screen trigger, so a second screen on an application already in UNDER_REVIEW is refused rather than re-stamping screened_by_user_id with the second reviewer's id."
        test_recipe:
          setup:
            - "logical clock left at its 2026-08-01T00:00:00Z startup default"
            - "LANDOWNER party; ACTIVE SA-EAST; parcel APN-001; application for 22 units screened once by reviewer rev-1"
          setup_api_calls:
            - call: "POST /tdr/parties"
              payload: { kind: "LANDOWNER", legal_name: "Ridge Farm LLC", contact_email: "ridge@example.org", neighborhood_code: "NB-EAST" }
              as: ProgramAdministrator
              captures: { own_id: $.data.id }
            - call: "POST /tdr/sending-areas"
              payload: { code: "SA-EAST", name: "East Ridge", neighborhood_code: "NB-EAST", allocation_formula_version: "V1_NET_ACRE", base_rate_units_per_acre: 0.25, gross_discount_factor: 0.80, equity_tier: "UNDERSERVED", sending_cap_units: 200 }
              as: ProgramAdministrator
              captures: { sa_id: $.data.id }
            - call: "POST /tdr/sending-areas/${sa_id}/activate"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /tdr/sending-parcels"
              payload: { owner_party_id: "${own_id}", sending_area_id: "${sa_id}", apn: "APN-001", gross_acres: 100.00, constrained_acres: 22.00, soil_class: "PRIME", existing_dwelling_units: 2 }
              as: ProgramAdministrator
              captures: { parcel_id: $.data.id }
            - call: "POST /tdr/severance-applications"
              payload: { sending_parcel_id: "${parcel_id}", applicant_party_id: "${own_id}", requested_units: 22 }
              as: Landowner
              as_user_id: "${own_id}"
              captures: { app_id: $.data.id }
            - call: "POST /tdr/severance-applications/${app_id}/screen"
              payload: {}
              as: SeveranceReviewer
              as_user_id: "rev-1"
          trigger:
            - call: "POST /tdr/severance-applications/${app_id}/screen"
              payload: {}
              as: SeveranceReviewer
              as_user_id: "rev-2"
          assert:
            - "the second screen returns 409 ERR_APPLICATION_NOT_SCREENABLE"
            - "SeveranceApplication.${app_id}.status == UNDER_REVIEW (unchanged)"
            - "SeveranceApplication.${app_id}.screened_by_user_id == rev-1 — the refused call did not restamp it to rev-2"
            - "SeveranceApplication.${app_id}.version == 2 — the refused call did not bump the version"

      - name: activating_an_already_active_sending_area_is_rejected_not_a_no_op
        claim_type: idempotency
        grounds:
          - state_machines.SendingArea.DRAFT_to_ACTIVE
          - validations.priority_48_area_not_draft
          - errors.ERR_AREA_NOT_DRAFT
        distinguishing_aspect: "Activation is not idempotent by design: the DRAFT -> ACTIVE transition requires status == DRAFT, so a repeat activation is a 409 rather than a silent success, and it must not bump the area's version."
        test_recipe:
          setup:
            - "logical clock left at its 2026-08-01T00:00:00Z startup default"
            - "sending area SA-EAST created and activated once"
          setup_api_calls:
            - call: "POST /tdr/sending-areas"
              payload: { code: "SA-EAST", name: "East Ridge", neighborhood_code: "NB-EAST", allocation_formula_version: "V1_NET_ACRE", base_rate_units_per_acre: 0.25, gross_discount_factor: 0.80, equity_tier: "UNDERSERVED", sending_cap_units: 200 }
              as: ProgramAdministrator
              captures: { sa_id: $.data.id }
            - call: "POST /tdr/sending-areas/${sa_id}/activate"
              payload: {}
              as: ProgramAdministrator
          trigger:
            - call: "POST /tdr/sending-areas/${sa_id}/activate"
              payload: {}
              as: ProgramAdministrator
          assert:
            - "the first activation returned 200 with SendingArea.${sa_id}.status == ACTIVE and version == 2"
            - "the second activation returns 409 ERR_AREA_NOT_DRAFT"
            - "SendingArea.${sa_id}.status == ACTIVE and version == 2 after the refusal"

      - name: certified_severance_application_accepts_no_further_transition
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.SeveranceApplication.terminal_states
          - validations.priority_11_application_screenable
          - validations.priority_12_application_in_review
          - validations.priority_13_application_revisable
          - validations.priority_14_application_approved
        distinguishing_aspect: "CERTIFIED is terminal, and each of the four workflow triggers refuses it with its OWN state error rather than a single generic one — screen with ERR_APPLICATION_NOT_SCREENABLE, review-decision with ERR_APPLICATION_NOT_IN_REVIEW, resubmit with ERR_APPLICATION_NOT_REVISABLE, and a second certify with ERR_APPLICATION_NOT_APPROVED. In particular the repeat certify must not mint a second certificate."
        test_recipe:
          setup:
            - "logical clock at 2026-08-10T00:00:00Z"
            - "LANDOWNER party; ACTIVE SA-EAST; parcel APN-001 severed for all 22 units and certified (certificate exists)"
          setup_api_calls:
            - call: "POST /tdr/_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /tdr/parties"
              payload: { kind: "LANDOWNER", legal_name: "Ridge Farm LLC", contact_email: "ridge@example.org", neighborhood_code: "NB-EAST" }
