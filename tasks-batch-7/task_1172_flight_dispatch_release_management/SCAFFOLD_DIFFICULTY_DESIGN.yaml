  - rule_id: cross_entity_state_dependency
    instances:
      - name: release_submit_gated_on_plan_locked
        grounds:
          - state_machines.FlightRelease.DRAFT_to_PENDING_SIGNATURES
          - state_machines.FlightPlan.LOCKED_to_COMPUTED
          - errors[ERR_PLAN_NOT_LOCKED]
        distinguishing_aspect: |
          Entity pair FlightRelease -> FlightPlan: submit is valid only while
          the referenced plan is LOCKED; a recompute (LOCKED -> COMPUTED) after
          release creation breaks the gate, submit fails with
          ERR_PLAN_NOT_LOCKED, and re-locking restores it.
        test_recipe:
          setup:
            - "Standard chain: leg L1, plan computed + LOCKED, manifest, release DRAFT"
          setup_api_calls:
            - { call: "POST /dispatch/stations", payload: { iata_code: "KAAA", runway_length_m: 2500, alternate_distance_nm: 10, min_ceiling_ft: 200, min_visibility_m: 800 }, as: DispatchSupervisor, captures: { sta: $.data.id } }
            - { call: "POST /dispatch/stations", payload: { iata_code: "KBBB", runway_length_m: 2500, alternate_distance_nm: 0, min_ceiling_ft: 200, min_visibility_m: 800 }, as: DispatchSupervisor, captures: { stb: $.data.id } }
            - { call: "POST /dispatch/stations", payload: { iata_code: "KAL1", runway_length_m: 2500, alternate_distance_nm: 90, min_ceiling_ft: 200, min_visibility_m: 800 }, as: DispatchSupervisor, captures: { alt1: $.data.id } }
            - { call: "POST /dispatch/aircraft", payload: { tail_no: "N100AA", type_code: "A320", oew_kg: 42000, mzfw_kg: 61000, mtow_kg: 73500, mlw_kg: 64500, fuel_capacity_kg: 19000, cruise_tas_kts: 450, burn_kg_per_hour: 2600, min_runway_m: 1800, lemac_m: 17.0, mac_m: 4.0 }, as: DispatchSupervisor, captures: { ac1: $.data.id } }
            - { call: "POST /dispatch/dispatchers", payload: { name: "Dana One", license_no: "D001", max_active_legs: 6 }, as: DispatchSupervisor, captures: { d1: $.data.id } }
            - { call: "POST /dispatch/captains", payload: { name: "Cole One", license_no: "C001", qualified_type_codes: ["A320"] }, as: DispatchSupervisor, captures: { c1: $.data.id } }
            - { call: "POST /dispatch/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T08:00:00Z" }, as: DispatchSupervisor }
            - { call: "POST /dispatch/weather-packages", payload: { station_id: "${stb}", valid_from_utc: "2026-05-01T09:00:00Z", valid_to_utc: "2026-05-01T13:00:00Z", ceiling_ft: 1000, visibility_m: 5000 }, as: DispatchSupervisor, captures: { wxb: $.data.id } }
            - { call: "POST /dispatch/legs", payload: { flight_no: "FD230", dep_station_id: "${sta}", arr_station_id: "${stb}", aircraft_id: "${ac1}", captain_id: "${c1}", distance_nm: 1200, sched_dep_utc: "2026-05-01T10:00:00Z", sched_arr_utc: "2026-05-01T12:30:00Z", dispatcher_id: "${d1}" }, as: Dispatcher, as_user_id: "${d1}", captures: { leg1: $.data.id, leg1_v: $.data.version } }
            - { call: "POST /dispatch/plans", payload: { leg_id: "${leg1}", route_code: "DCT KLOSE DCT", cruise_altitude_ft: 35000, forecast_wind_kts: 30, wind_assumption: "FORECAST", expected_leg_version: "${leg1_v}" }, as: Dispatcher, as_user_id: "${d1}", captures: { plan1: $.data.id } }
            - { call: "POST /dispatch/plans/${plan1}/lock", as: Dispatcher, as_user_id: "${d1}" }
            - { call: "POST /dispatch/manifests", payload: { leg_id: "${leg1}", pax_count: 150, bags_count: 150, cargo_kg: 3000 }, as: Dispatcher, as_user_id: "${d1}" }
            - { call: "POST /dispatch/releases", payload: { leg_id: "${leg1}" }, as: Dispatcher, as_user_id: "${d1}", captures: { rel1: $.data.id } }
          trigger:
            - { call: "POST /dispatch/plans/${plan1}/recompute", as: Dispatcher, as_user_id: "${d1}", captures: { plan1_status_mid: $.data.status } }
            - { call: "POST /dispatch/releases/${rel1}/submit", as: Dispatcher, as_user_id: "${d1}", captures: { submit_err: $.data.error_id } }
            - { call: "POST /dispatch/plans/${plan1}/lock", as: Dispatcher, as_user_id: "${d1}" }
            - { call: "POST /dispatch/releases/${rel1}/submit", as: Dispatcher, as_user_id: "${d1}", captures: { rel1_status: $.data.status } }
          assert:
            - "plan1_status_mid == COMPUTED (recompute broke the gate)"
            - "submit_err == ERR_PLAN_NOT_LOCKED (release submit depends on sibling plan state)"
            - "after re-lock, rel1_status == PENDING_SIGNATURES"

      - name: leg_depart_gated_on_release_and_shift
        grounds:
          - state_machines.FlightLeg.SCHEDULED_to_DEPARTED (ops_status machine)
          - errors[ERR_INVALID_STATE]
          - errors[ERR_NO_ACTIVE_SHIFT]
        distinguishing_aspect: |
          Entity pairs FlightLeg -> FlightRelease AND FlightLeg -> DeskShift
          (different pairs than release->plan): depart requires BOTH a
          RELEASED release and an ACTIVE shift covering the clock; PENDING
          release -> ERR_INVALID_STATE; RELEASED but clock outside the shift
          window -> ERR_NO_ACTIVE_SHIFT; both satisfied -> DEPARTED.
        test_recipe:
          setup:
            - "Standard chain through submit (release PENDING_SIGNATURES); D1 shift window 06:00-14:00"
          setup_api_calls:
            - { call: "POST /dispatch/stations", payload: { iata_code: "KAAA", runway_length_m: 2500, alternate_distance_nm: 10, min_ceiling_ft: 200, min_visibility_m: 800 }, as: DispatchSupervisor, captures: { sta: $.data.id } }
            - { call: "POST /dispatch/stations", payload: { iata_code: "KBBB", runway_length_m: 2500, alternate_distance_nm: 0, min_ceiling_ft: 200, min_visibility_m: 800 }, as: DispatchSupervisor, captures: { stb: $.data.id } }
            - { call: "POST /dispatch/stations", payload: { iata_code: "KAL1", runway_length_m: 2500, alternate_distance_nm: 90, min_ceiling_ft: 200, min_visibility_m: 800 }, as: DispatchSupervisor, captures: { alt1: $.data.id } }
            - { call: "POST /dispatch/aircraft", payload: { tail_no: "N100AA", type_code: "A320", oew_kg: 42000, mzfw_kg: 61000, mtow_kg: 73500, mlw_kg: 64500, fuel_capacity_kg: 19000, cruise_tas_kts: 450, burn_kg_per_hour: 2600, min_runway_m: 1800, lemac_m: 17.0, mac_m: 4.0 }, as: DispatchSupervisor, captures: { ac1: $.data.id } }
            - { call: "POST /dispatch/dispatchers", payload: { name: "Dana One", license_no: "D001", max_active_legs: 6 }, as: DispatchSupervisor, captures: { d1: $.data.id } }
            - { call: "POST /dispatch/captains", payload: { name: "Cole One", license_no: "C001", qualified_type_codes: ["A320"] }, as: DispatchSupervisor, captures: { c1: $.data.id } }
            - { call: "POST /dispatch/desks", payload: { code: "K1", region: "WEST", max_dispatchers: 1 }, as: DispatchSupervisor, captures: { k1: $.data.id } }
            - { call: "POST /dispatch/desk-shifts", payload: { dispatcher_id: "${d1}", desk_id: "${k1}", shift_start_utc: "2026-05-01T06:00:00Z", shift_end_utc: "2026-05-01T14:00:00Z" }, as: DispatchSupervisor, captures: { sh1: $.data.id } }
            - { call: "POST /dispatch/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T08:00:00Z" }, as: DispatchSupervisor }
            - { call: "POST /dispatch/weather-packages", payload: { station_id: "${stb}", valid_from_utc: "2026-05-01T09:00:00Z", valid_to_utc: "2026-05-01T13:00:00Z", ceiling_ft: 1000, visibility_m: 5000 }, as: DispatchSupervisor, captures: { wxb: $.data.id } }
            - { call: "POST /dispatch/legs", payload: { flight_no: "FD240", dep_station_id: "${sta}", arr_station_id: "${stb}", aircraft_id: "${ac1}", captain_id: "${c1}", distance_nm: 1200, sched_dep_utc: "2026-05-01T10:00:00Z", sched_arr_utc: "2026-05-01T12:30:00Z", dispatcher_id: "${d1}" }, as: Dispatcher, as_user_id: "${d1}", captures: { leg1: $.data.id, leg1_v: $.data.version } }
            - { call: "POST /dispatch/plans", payload: { leg_id: "${leg1}", route_code: "DCT KLOSE DCT", cruise_altitude_ft: 35000, forecast_wind_kts: 30, wind_assumption: "FORECAST", expected_leg_version: "${leg1_v}" }, as: Dispatcher, as_user_id: "${d1}", captures: { plan1: $.data.id } }
            - { call: "POST /dispatch/plans/${plan1}/lock", as: Dispatcher, as_user_id: "${d1}" }
            - { call: "POST /dispatch/manifests", payload: { leg_id: "${leg1}", pax_count: 150, bags_count: 150, cargo_kg: 3000 }, as: Dispatcher, as_user_id: "${d1}" }
            - { call: "POST /dispatch/releases", payload: { leg_id: "${leg1}" }, as: Dispatcher, as_user_id: "${d1}", captures: { rel1: $.data.id } }
            - { call: "POST /dispatch/releases/${rel1}/submit", as: Dispatcher, as_user_id: "${d1}" }
          trigger:
            - { call: "POST /dispatch/legs/${leg1}/depart", as: Dispatcher, as_user_id: "${d1}", captures: { dep_err1: $.data.error_id } }
            - { call: "POST /dispatch/releases/${rel1}/sign", payload: {}, as: Dispatcher, as_user_id: "${d1}" }
            - { call: "POST /dispatch/releases/${rel1}/sign", payload: {}, as: Captain, as_user_id: "${c1}" }
            - { call: "POST /dispatch/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T20:00:00Z" }, as: DispatchSupervisor }
            - { call: "POST /dispatch/legs/${leg1}/depart", as: Dispatcher, as_user_id: "${d1}", captures: { dep_err2: $.data.error_id } }
            - { call: "POST /dispatch/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T10:30:00Z" }, as: DispatchSupervisor }
            - { call: "POST /dispatch/legs/${leg1}/depart", as: Dispatcher, as_user_id: "${d1}", captures: { dep_ok: $.data.ops_status, mon_ok: $.data.monitor_status } }
          assert:
            - "dep_err1 == ERR_INVALID_STATE (release only PENDING_SIGNATURES — cross-entity gate on FlightRelease)"
            - "dep_err2 == ERR_NO_ACTIVE_SHIFT (release now RELEASED, but no ACTIVE DeskShift covers 20:00 — cross-entity gate on DeskShift)"
            - "dep_ok == DEPARTED and mon_ok == MONITORING once both gates pass"

  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: weather_window_half_open_adjacency
        grounds:
          - validations[priority=7]
          - errors[ERR_WEATHER_WINDOW_OVERLAP]
          - entities.WeatherPackage.fields.valid_to_utc
        distinguishing_aspect: |
          Resource Station, half-open [from, to) semantics: a package starting
          exactly at the existing package's end (13:00 == 13:00, adjacency) is
          ACCEPTED, while one straddling the boundary (12:30-14:00) is rejected
          with ERR_WEATHER_WINDOW_OVERLAP.
        test_recipe:
          setup:
            - "Station KWTH with an ACTIVE package [09:00, 13:00)"
          setup_api_calls:
            - { call: "POST /dispatch/stations", payload: { iata_code: "KWTH", runway_length_m: 2500, alternate_distance_nm: 50, min_ceiling_ft: 200, min_visibility_m: 800 }, as: DispatchSupervisor, captures: { stw: $.data.id } }
            - { call: "POST /dispatch/weather-packages", payload: { station_id: "${stw}", valid_from_utc: "2026-05-01T09:00:00Z", valid_to_utc: "2026-05-01T13:00:00Z", ceiling_ft: 1000, visibility_m: 5000 }, as: DispatchSupervisor, captures: { wx1: $.data.id } }
          trigger:
            - { call: "POST /dispatch/weather-packages", payload: { station_id: "${stw}", valid_from_utc: "2026-05-01T13:00:00Z", valid_to_utc: "2026-05-01T17:00:00Z", ceiling_ft: 900, visibility_m: 4000 }, as: DispatchSupervisor, captures: { wx2: $.data.id } }
            - { call: "POST /dispatch/weather-packages", payload: { station_id: "${stw}", valid_from_utc: "2026-05-01T12:30:00Z", valid_to_utc: "2026-05-01T14:00:00Z", ceiling_ft: 900, visibility_m: 4000 }, as: DispatchSupervisor, captures: { wx3_err: $.data.error_id } }
          assert:
            - "wx2 created (201) — adjacency is allowed under half-open semantics"
            - "wx3_err == ERR_WEATHER_WINDOW_OVERLAP — [12:30,14:00) intersects both [09:00,13:00) and [13:00,17:00)"

      - name: shift_rest_buffer_rejects_adjacency
        grounds:
          - validations[priority=6]
          - errors[ERR_REST_VIOLATION]
          - entities.DeskShift.fields.shift_end_utc
        distinguishing_aspect: |
          Resource Dispatcher, DIFFERENT interval semantics than the weather
          half-open rule: back-to-back shifts (adjacency, gap 0) are REJECTED
          because non-overlapping shifts need a >= 30 minute rest buffer;
          gap exactly 30 minutes is accepted (boundary).
        test_recipe:
          setup:
            - "Dispatcher D5, Desk K5 (max_dispatchers 2); existing shift [06:00, 14:00)"
          setup_api_calls:
            - { call: "POST /dispatch/dispatchers", payload: { name: "Dana Five", license_no: "D005", max_active_legs: 6 }, as: DispatchSupervisor, captures: { d5: $.data.id } }
            - { call: "POST /dispatch/desks", payload: { code: "K5", region: "EAST", max_dispatchers: 2 }, as: DispatchSupervisor, captures: { k5: $.data.id } }
            - { call: "POST /dispatch/desk-shifts", payload: { dispatcher_id: "${d5}", desk_id: "${k5}", shift_start_utc: "2026-05-01T06:00:00Z", shift_end_utc: "2026-05-01T14:00:00Z" }, as: DispatchSupervisor, captures: { sh1: $.data.id } }
          trigger:
            - { call: "POST /dispatch/desk-shifts", payload: { dispatcher_id: "${d5}", desk_id: "${k5}", shift_start_utc: "2026-05-01T14:00:00Z", shift_end_utc: "2026-05-01T22:00:00Z" }, as: DispatchSupervisor, captures: { sh2_err: $.data.error_id } }
            - { call: "POST /dispatch/desk-shifts", payload: { dispatcher_id: "${d5}", desk_id: "${k5}", shift_start_utc: "2026-05-01T14:30:00Z", shift_end_utc: "2026-05-01T22:00:00Z" }, as: DispatchSupervisor, captures: { sh3: $.data.id } }
          assert:
            - "sh2_err == ERR_REST_VIOLATION — gap 0 < 30 min; weather-style adjacency is NOT allowed for shifts"
            - "sh3 created (201) — gap exactly 30 min == REST_BUFFER_MIN is accepted (>= boundary)"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: desk_quota_conserved_across_shift_lifecycle
        grounds:
          - entities.Desk.fields.active_shift_count
          - entities.Desk.fields.free_slots
          - calculations.desk_auto_select
        distinguishing_aspect: |
          Conserved quantity = per-desk slot quota: at every instant t,
          active_shift_count(t) + free_slots(t) == max_dispatchers. Shift
          activation (clock enters window) and its compensation (clock leaves
          window) move the split but never the sum (1 == 1 at both probes).
        test_recipe:
          setup:
            - "Desk K_A with max_dispatchers 1; Dispatcher D6 with shift [06:00, 14:00) at K_A"
          setup_api_calls:
            - { call: "POST /dispatch/dispatchers", payload: { name: "Dana Six", license_no: "D006", max_active_legs: 6 }, as: DispatchSupervisor, captures: { d6: $.data.id } }
            - { call: "POST /dispatch/desks", payload: { code: "KA", region: "WEST", max_dispatchers: 1 }, as: DispatchSupervisor, captures: { ka: $.data.id } }
            - { call: "POST /dispatch/desk-shifts", payload: { dispatcher_id: "${d6}", desk_id: "${ka}", shift_start_utc: "2026-05-01T06:00:00Z", shift_end_utc: "2026-05-01T14:00:00Z" }, as: DispatchSupervisor, captures: { sh1: $.data.id } }
          trigger:
            - { call: "POST /dispatch/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T10:00:00Z" }, as: DispatchSupervisor }
            - { call: "GET /dispatch/desks/${ka}", as: DispatchSupervisor, captures: { occ_in: $.data.active_shift_count, free_in: $.data.free_slots } }
            - { call: "POST /dispatch/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T15:00:00Z" }, as: DispatchSupervisor }
            - { call: "GET /dispatch/desks/${ka}", as: DispatchSupervisor, captures: { occ_out: $.data.active_shift_count, free_out: $.data.free_slots } }
          assert:
            - "occ_in == 1 and free_in == 0 (shift ACTIVE inside its window)"
            - "occ_out == 0 and free_out == 1 (compensating deactivation when the clock passes 14:00)"
            - "occ_in + free_in == 1 == occ_out + free_out == Desk.max_dispatchers — quota conserved, no drift"

      - name: global_leg_assignment_ledger_conserved
        grounds:
          - calculations.dispatcher_workload
          - state_machines.FlightLeg.SCHEDULED_to_CANCELLED
          - entities.Dispatcher.fields.workload_leg_count
        distinguishing_aspect: |
          Different conserved quantity than the desk quota: the global
          assignment ledger — sum over all dispatchers of workload_leg_count
          equals the count of legs with ops_status IN {SCHEDULED, DEPARTED}.
          Forward action (leg create, +1) paired with its compensating action
          (leg cancel, -1) returns every dispatcher's count to baseline.
        test_recipe:
          setup:
            - "Stations/aircraft/captain; Dispatcher D7 (max_active_legs 6); no legs yet (baseline 0)"
          setup_api_calls:
            - { call: "POST /dispatch/stations", payload: { iata_code: "KAAA", runway_length_m: 2500, alternate_distance_nm: 10, min_ceiling_ft: 200, min_visibility_m: 800 }, as: DispatchSupervisor, captures: { sta: $.data.id } }
            - { call: "POST /dispatch/stations", payload: { iata_code: "KBBB", runway_length_m: 2500, alternate_distance_nm: 0, min_ceiling_ft: 200, min_visibility_m: 800 }, as: DispatchSupervisor, captures: { stb: $.data.id } }
            - { call: "POST /dispatch/aircraft", payload: { tail_no: "N100AA", type_code: "A320", oew_kg: 42000, mzfw_kg: 61000, mtow_kg: 73500, mlw_kg: 64500, fuel_capacity_kg: 19000, cruise_tas_kts: 450, burn_kg_per_hour: 2600, min_runway_m: 1800, lemac_m: 17.0, mac_m: 4.0 }, as: DispatchSupervisor, captures: { ac1: $.data.id } }
            - { call: "POST /dispatch/dispatchers", payload: { name: "Dana Seven", license_no: "D007", max_active_legs: 6 }, as: DispatchSupervisor, captures: { d7: $.data.id } }
            - { call: "POST /dispatch/captains", payload: { name: "Cole One", license_no: "C001", qualified_type_codes: ["A320"] }, as: DispatchSupervisor, captures: { c1: $.data.id } }
            - { call: "POST /dispatch/legs", payload: { flight_no: "FD250", dep_station_id: "${sta}", arr_station_id: "${stb}", aircraft_id: "${ac1}", captain_id: "${c1}", distance_nm: 400, sched_dep_utc: "2026-05-01T10:00:00Z", sched_arr_utc: "2026-05-01T11:00:00Z", dispatcher_id: "${d7}" }, as: Dispatcher, as_user_id: "${d7}", captures: { leg1: $.data.id } }
            - { call: "POST /dispatch/legs", payload: { flight_no: "FD251", dep_station_id: "${sta}", arr_station_id: "${stb}", aircraft_id: "${ac1}", captain_id: "${c1}", distance_nm: 400, sched_dep_utc: "2026-05-01T12:00:00Z", sched_arr_utc: "2026-05-01T13:00:00Z", dispatcher_id: "${d7}" }, as: Dispatcher, as_user_id: "${d7}", captures: { leg2: $.data.id } }
            - { call: "GET /dispatch/dispatchers/${d7}", as: DispatchSupervisor, captures: { cnt_mid: $.data.workload_leg_count } }
          trigger:
            - { call: "POST /dispatch/legs/${leg2}/cancel", payload: { reason_code: "OPS" }, as: Dispatcher, as_user_id: "${d7}", captures: { leg2_status: $.data.ops_status } }
            - { call: "GET /dispatch/dispatchers/${d7}", as: DispatchSupervisor, captures: { cnt_end: $.data.workload_leg_count } }
          assert:
            - "cnt_mid == 2 after two creates (forward actions)"
            - "leg2_status == CANCELLED (compensating action)"
            - "cnt_end == 1 — exactly the remaining SCHEDULED leg; global sum over dispatchers (1) == count of legs with ops_status IN {SCHEDULED, DEPARTED} (1): ledger conserved, zero drift"
