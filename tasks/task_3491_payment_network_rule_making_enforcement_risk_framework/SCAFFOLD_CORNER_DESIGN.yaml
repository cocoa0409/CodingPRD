            - "no ReturnRecord exists for ${e1} and the entry remains SETTLED"

      - name: attestation_accept_without_audit_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=29]
        distinguishing_aspect: "With no enforcement pending (priority 28 passes), acceptance still fails 422 ERR_AUDIT_REQUIRED because the participant has no COMPLETED audit ending on or after 2026-01-01 — the audit gate is independently enforced."
        test_recipe:
          setup: ["P1 ACTIVE; attestation 2026 SUBMITTED on 2026-09-01; no audits exist; no enforcement actions exist."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /network/participants"
              payload: { legal_name: "Bank One", participant_type: "BOTH", routing_number: "111000025" }
              as: PlatformAdmin
              captures: { p1: $.data.id }
            - call: "POST /network/participants/${p1}/transition"
              payload: { to_state: "ACTIVE" }
              as: PlatformAdmin
            - call: "POST /network/attestations"
              payload: { participant_id: "${p1}", period_year: 2026 }
              as: PlatformAdmin
              captures: { att: $.data.id }
            - call: "POST /network/attestations/${att}/transition"
              payload: { to_state: "SUBMITTED", attestation_text: "We attest compliance for 2026" }
              as: ParticipantOfficer
              as_user_id: "${p1}"
          trigger:
            - call: "POST /network/attestations/${att}/transition"
              payload: { to_state: "ACCEPTED" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response status is 422 with data.error_id == ERR_AUDIT_REQUIRED (not ERR_UNRESOLVED_ENFORCEMENT — no enforcement exists)"
            - "ComplianceAttestation.${att} remains SUBMITTED"

      - name: guidance_create_on_non_effective_proposal_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=15]
        distinguishing_aspect: "Guidance may only interpret an EFFECTIVE rule: publishing against a DRAFT proposal fails 409 ERR_PROPOSAL_NOT_EFFECTIVE even with a correct transaction-code pairing and current OCC version."
        test_recipe:
          setup: ["WEB code (version 1); proposal RP sitting in DRAFT."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /network/transaction-codes"
              payload: { code: "WEB", entry_class: "DEBIT", authorization_requirement: "ORAL_RECORDED", return_timeframe_banking_days: 30, account_validation_required: true, warranty_obligations: "ODFI warrants WEB account validation" }
              as: PlatformAdmin
              captures: { tc_web: $.data.id, tcv: $.data.version }
