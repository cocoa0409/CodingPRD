  - rule_id: non_linear_state_machine
    instances:
      - name: objective_protest_cycle_with_denied_destination_pinned_by_round_index
        grounds:
          - state_machines.DealerObjective.PROPOSED_to_PROTESTED
          - state_machines.DealerObjective.PROTESTED_to_REVISED
          - state_machines.DealerObjective.REVISED_to_PROTESTED
          - calculations.objective_units_proposal
          - validations[priority=24]
          - concurrency_rules[protest-resolve-stale-objective]
        distinguishing_aspect: |
          The non-linearity is a bounded CYCLE on DealerObjective: PROPOSED -> PROTESTED -> REVISED
          -> PROTESTED, and the exit state of the second round is decided by protest.round_index
          alone — a round-2 DENIED returns the objective to REVISED (not to PROPOSED, which is
          where a round-1 DENIED would land it), after which protest_round == 2 makes a third
          protest impossible.
        test_recipe:
          setup:
            - "Dealer D-500 in region WEST with historical_volume_units 16 and market_opportunity_bps 1500."
            - "One ACTIVE DEALER_STAIR_STEP program STAIR-CYC-AUG with tier_schedule [{1, 5000 bps, 30000}, {2, 10000 bps, 50000}], MARGINAL, window [2026-08-01, 2026-09-01)."
            - "One PROPOSED DealerObjective for D-500 created with stretch_bps 1000, so uplift_bps == min(5000, 1500 + 1000) == 2500, basis_units == 16 and objective_units == 20."
            - "No deliveries at all, so achieved_units stays 0 and the payout arithmetic never masks the state transitions."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: IncentiveController
              as_user_id: "u-controller-1"
            - call: "POST /incentives/dealers"
              payload: { dealer_code: "D-500", name: "Cascade Motor Sales", region_code: "WEST", historical_volume_units: 16, market_opportunity_bps: 1500 }
              as: IncentiveController
              as_user_id: "u-controller-1"
              captures: { dealer_id: $.data.id }
            - call: "POST /incentives/programs"
              payload: { program_code: "STAIR-CYC-AUG", name: "August Stair Step Cycle", incentive_type: "DEALER_STAIR_STEP", effective_from: "2026-08-01T00:00:00.000Z", effective_to: "2026-09-01T00:00:00.000Z", per_unit_amount_cents: 0, budget_cents: 50000000, stack_group: "AUG-STAIR", priority_rank: 42, tier_schedule: [{ tier_index: 1, threshold_bps: 5000, per_unit_bonus_cents: 30000 }, { tier_index: 2, threshold_bps: 10000, per_unit_bonus_cents: 50000 }], tier_bonus_mode: "MARGINAL" }
              as: ProgramDesigner
              as_user_id: "u-designer-1"
              captures: { prog_id: $.data.id }
            - call: "POST /incentives/programs/${prog_id}/eligibility-rules"
              payload: { model_code: "MX5", region_code: "WEST", build_date_from: "2026-05-01T00:00:00.000Z", build_date_to: "2026-07-31T00:00:00.000Z", allowed_deal_types: ["CASH"] }
              as: ProgramDesigner
              as_user_id: "u-designer-1"
            - call: "POST /incentives/programs/${prog_id}/submit"
              payload: {}
              as: ProgramDesigner
              as_user_id: "u-designer-1"
            - call: "POST /incentives/programs/${prog_id}/approve"
              payload: {}
              as: IncentiveController
              as_user_id: "u-controller-1"
            - call: "POST /incentives/programs/${prog_id}/objectives"
              payload: { dealer_id: "${dealer_id}", stretch_bps: 1000 }
              as: FieldSalesManager
              as_user_id: "u-fsm-1"
              captures: { obj_id: $.data.id, units_at_creation: $.data.objective_units, basis_at_creation: $.data.basis_units }
          trigger:
            - call: "POST /incentives/objectives/${obj_id}/protests"
              payload: { claimed_basis_units: 12, reason: "Two 2025 fleet deliveries were double counted in the historical basis." }
              as: Dealer
              as_user_id: "${dealer_id}"
              captures: { protest1_id: $.data.id, protest1_round: $.data.round_index }
            - call: "GET /incentives/objectives/${obj_id}"
              payload: {}
              as: FieldSalesManager
              as_user_id: "u-fsm-1"
              captures: { obj_v1: $.data.version, status_after_protest1: $.data.status, round_after_protest1: $.data.protest_round }
            - call: "POST /incentives/objectives/${obj_id}/protests/${protest1_id}/resolve"
              payload: { resolution: "UPHELD", expected_objective_version: "${obj_v1}" }
              as: FieldSalesManager
              as_user_id: "u-fsm-1"
              captures: { protest1_status: $.data.status, protest1_resolved_units: $.data.resolved_units }
            - call: "GET /incentives/objectives/${obj_id}"
              payload: {}
              as: FieldSalesManager
              as_user_id: "u-fsm-1"
              captures: { status_after_uphold: $.data.status, basis_after_uphold: $.data.basis_units, units_after_uphold: $.data.objective_units }
            - call: "POST /incentives/objectives/${obj_id}/protests"
              payload: { claimed_basis_units: 10, reason: "Second protest: two additional units were courtesy transfers, not retail." }
              as: Dealer
              as_user_id: "${dealer_id}"
              captures: { protest2_id: $.data.id, protest2_round: $.data.round_index }
            - call: "GET /incentives/objectives/${obj_id}"
              payload: {}
              as: FieldSalesManager
              as_user_id: "u-fsm-1"
              captures: { obj_v2: $.data.version }
            - call: "POST /incentives/objectives/${obj_id}/protests/${protest2_id}/resolve"
              payload: { resolution: "DENIED", expected_objective_version: "${obj_v2}" }
              as: FieldSalesManager
              as_user_id: "u-fsm-1"
              captures: { protest2_status: $.data.status, protest2_resolved_units: $.data.resolved_units }
            - call: "GET /incentives/objectives/${obj_id}"
              payload: {}
              as: FieldSalesManager
              as_user_id: "u-fsm-1"
              captures: { status_after_denial: $.data.status, basis_after_denial: $.data.basis_units, units_after_denial: $.data.objective_units, round_after_denial: $.data.protest_round }
            - call: "POST /incentives/objectives/${obj_id}/protests"
              payload: { claimed_basis_units: 9, reason: "Third protest, must be refused." }
              as: Dealer
              as_user_id: "${dealer_id}"
          assert:
            - "${basis_at_creation} == 16 and ${units_at_creation} == 20 (round_half_up(16 * 12500 / 10000))"
            - "${protest1_round} == 1 and ${status_after_protest1} == PROTESTED and ${round_after_protest1} == 1"
            - "${protest1_status} == UPHELD and ${protest1_resolved_units} == 15"
            - "${status_after_uphold} == REVISED and ${basis_after_uphold} == 12 and ${units_after_uphold} == 15 (round_half_up(12 * 12500 / 10000))"
            - "${protest2_round} == 2 (the REVISED -> PROTESTED edge re-enters the cycle)"
            - "${protest2_status} == DENIED and ${protest2_resolved_units} == null"
            - "${status_after_denial} == REVISED — pinned by round_index == 2, NOT PROPOSED"
            - "${basis_after_denial} == 12 and ${units_after_denial} == 15, byte-identical to the pre-round-2 values because the DENIED branch recomputes nothing"
            - "${round_after_denial} == 2"
            - "the third POST /incentives/objectives/${obj_id}/protests returns HTTP 409 with data.error_id == ERR_PROTEST_LIMIT_REACHED"
            - "DealerObjective.${obj_id}.achieved_units == 0 and payout_cents == 0 and tier_attained == 0 throughout"

      - name: claim_validation_and_payment_dimensions_advance_independently
        grounds:
          - state_machines.Claim.SUBMITTED_to_VALIDATED
          - state_machines.Claim.UNPAID_to_SCHEDULED
          - entities.Claim.fields.validation_status
          - entities.Claim.fields.payment_status
          - entities.PaymentBatch.fields.held_claim_count
          - errors[ERR_CLAIM_NOT_VALIDATED]
        distinguishing_aspect: |
          The second non-linear machine is on a DIFFERENT entity, Claim, and its non-linearity is
          PARALLEL dimensions rather than a cycle: validation_status and payment_status advance on
          the same row independently, coupled only by the guard that payment_status cannot leave
          UNPAID before validation_status is VALIDATED, and the test ends in the combined state
