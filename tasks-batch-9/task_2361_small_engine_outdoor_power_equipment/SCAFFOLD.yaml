# =============================================================================
# PRD Benchmark Scaffold — task_2361_small_engine_outdoor_power_equipment
# §1.0–§1.7. Difficulty design (§1.8) and corner design (§1.9) live in the two
# sibling files SCAFFOLD_DIFFICULTY_DESIGN.yaml / SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  2361. Small Engine & Outdoor Power Equipment Plant (outdoor power equipment manufacturer): engine assembly with machining of critical components, torque monitoring and hot test on the line, emission certification family definition with durability testing and production line audits, seasonal production planning with pre-season builds and channel inventory positioning, mixed product lines across mowers, snow equipment and generators with shared engine platforms, supplier quality for carburetors, ignition and castings with incoming inspection, safety standards compliance including blade brake and operator presence controls, dealer versus mass retail channel product differentiation, service part and repair network support with parts availability commitments

domain_name: "small-engine-opp-plant"
api_prefix: ""          # flat top-level collections; no single owning resource path

complexity_profile:
  difficulty_level: expert_plus     # deliberately above §0.4 Expert: 14 entities, 54 endpoints, 15 calculation rules, 9 state machines
  primary_archetype: compliance_audit
  secondary_archetype: quota_allocation
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - optimistic_concurrency

  entity_topology: graph
  # EnginePlatform is shared by many ProductModels (shared engine platforms);
  # EngineUnit joins four independent aggregates (BuildOrder, MachiningRun, two
  # ComponentLots); ServicePart references itself through a supersession chain;
  # ProductionLineAudit resolves its emission family by traversing
  # BuildOrder -> ProductModel -> EnginePlatform -> CertificationFamily.

  state_machine_shape: cyclic
  # CertificationFamily loops CERTIFIED -> AUDIT_HOLD -> DURABILITY_TESTING ->
  # DURABILITY_COMPLETE -> SUBMITTED -> CERTIFIED. EngineUnit carries two
  # independent dimensions (build_state x conformance_state) with a rework
  # cycle. MachiningRun and ProductionLineAudit fork on a computed statistic.

  relationship_patterns:
    - one_to_many
    - self_referential      # ServicePart.superseded_by_part_id -> ServicePart.id
    - cross_aggregate       # EngineUnit binds BuildOrder + MachiningRun + 2 ComponentLots

  role_model: segregation_of_duties
  # The CertificationEngineer who submits a family may not be the user who
  # certifies it; the QualityEngineer who inspected a lot may not be the user
  # who grants its deviation acceptance. Roles otherwise own disjoint resources.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  # ---------------------------------------------------------------- emissions
  - name: CertificationFamily
    parent: null
    common_fields: true
    fields:
      - name: family_code
        type: string
        source: input
        description: EPA/CARB engine family designation, unique across all families
        constraints: "1..40 chars, [A-Z0-9-]; unique -> ERR_DUPLICATE_CODE"
      - name: model_year
        type: integer
        source: input
        description: certification model year
        constraints: "2026..2035"
      - name: emission_standard
        type: enum
        source: input
        description: standard the family is certified against; selects the deterioration-factor variant
        constraints: "EPA_PHASE3 | CARB_2024"
      - name: displacement_min_cc
        type: integer
        source: input
        description: lower displacement bound of the family
        constraints: "50..1000"
      - name: displacement_max_cc
        type: integer
        source: input
        description: upper displacement bound of the family
        constraints: ">= displacement_min_cc, <= 1000"
      - name: durability_hours
        type: integer
        source: input
        description: emission durability period used to extrapolate a partial durability run
        constraints: "125 | 250 | 500 | 1000"
      - name: family_emission_limit_g_per_kwh
        type: number
        source: input
        description: regulatory family limit; certified emission must not exceed it
        constraints: "> 0, 2 decimals"
      - name: declared_baseline_emission_g_per_kwh
        type: number
        source: input
        description: low-hour production baseline the deterioration factor is applied to (NOT the durability run's initial reading)
        constraints: "> 0, 2 decimals"
      - name: status
        type: enum
        source: system
        description: certification lifecycle state
        default: DRAFT
        constraints: "DRAFT | DURABILITY_TESTING | DURABILITY_COMPLETE | SUBMITTED | CERTIFIED | AUDIT_HOLD | SUSPENDED"
      - name: deterioration_factor
        type: number
        source: computed
        description: latest completed durability run's deterioration factor (calculations.deterioration_factor_and_certified_emission)
        default: null
        constraints: "4 decimals, round_half_up"
      - name: certified_emission_g_per_kwh
        type: number
        source: computed
        description: declared baseline aged by the deterioration factor
        default: null
        constraints: "2 decimals, round_half_up"
      - name: compliance_margin_pct
        type: number
        source: computed
        description: headroom of certified emission under the family limit
        default: null
        constraints: "2 decimals, round_half_up; may be negative"
      - name: submitted_by_user_id
        type: string
        source: system
        description: X-User-ID that last submitted the family; segregation-of-duties comparand at certify time
        default: null
      - name: certified_by_user_id
        type: string
        source: system
        description: X-User-ID that certified the family
        default: null
      - name: certified_at
        type: datetime
        source: system
        description: logical-clock instant of the latest certify
        default: null
      - name: cumulative_audit_failures
        type: integer
        source: computed
        description: count of ProductionLineAudit rows that ended FAILED for this family; drives AUDIT_HOLD vs SUSPENDED
        default: 0
      - name: audit_hold_at
        type: datetime
        source: system
        description: logical-clock instant the family last entered AUDIT_HOLD; a re-submit requires a durability run completed after it
        default: null

  - name: EnginePlatform
    parent: CertificationFamily
    common_fields: true
    fields:
      - name: certification_family_id
        type: string
        source: input
        description: FK -> CertificationFamily.id; the emission family this platform is certified under
      - name: platform_code
        type: string
        source: input
        description: shared engine platform designation (e.g. 208SS)
        constraints: "1..30 chars, unique -> ERR_DUPLICATE_CODE"
      - name: displacement_cc
        type: integer
        source: input
        description: platform displacement; must fall inside the family's declared range
        constraints: "50..1000; family.displacement_min_cc <= v <= family.displacement_max_cc"
      - name: torque_spec_nm
        type: number
        source: input
        description: nominal fastener torque for line torque monitoring
        constraints: "> 0, 1 decimal"
      - name: torque_tolerance_pct
        type: number
        source: input
        description: fractional tolerance band applied to torque_spec_nm (0.05 = +/-5%)
        constraints: "0.01..0.20, 2 decimals"
      - name: required_fastener_count
        type: integer
        source: input
        description: number of torque readings a unit must report, exactly
        constraints: "1..12"
      - name: hot_test_min_rpm
        type: integer
        source: input
        description: inclusive lower governed-speed bound for hot test
        constraints: "500..8000"
      - name: hot_test_max_rpm
        type: integer
        source: input
        description: inclusive upper governed-speed bound for hot test
        constraints: "> hot_test_min_rpm, <= 8000"
      - name: certification_posture
        type: enum
        source: computed
        description: derived gate over the owning family's status (calculations.platform_certification_posture)
        default: PENDING
        constraints: "PENDING | OPEN | RESTRICTED | FROZEN"

  - name: DurabilityTestRun
    parent: CertificationFamily
    common_fields: true
    fields:
      - name: certification_family_id
        type: string
        source: input
        description: FK -> CertificationFamily.id; family whose deterioration factor this run establishes
      - name: engine_platform_id
        type: string
        source: input
        description: FK -> EnginePlatform.id; the physical platform occupied for the test window
      - name: scheduled_start_at
        type: datetime
        source: input
        description: inclusive start of the platform occupation window
      - name: scheduled_end_at
        type: datetime
        source: input
        description: exclusive end of the platform occupation window
        constraints: "> scheduled_start_at"
      - name: target_hours
        type: integer
        source: input
        description: hours the run is planned to accumulate
        constraints: "1..2000"
      - name: initial_emission_g_per_kwh
        type: number
        source: input
        description: measured emission at run start (green-engine reading)
        constraints: "> 0, 2 decimals"
      - name: accumulated_hours
        type: integer
        source: input
        description: hours actually accumulated, supplied at completion; below family.durability_hours it forces extrapolation
        default: null
        constraints: "1..2000"
      - name: final_emission_g_per_kwh
        type: number
        source: input
        description: measured emission at run end, supplied at completion
        default: null
        constraints: "> 0, 2 decimals"
      - name: df_method
        type: enum
        source: computed
        description: variant selected from the family's emission_standard
        default: null
        constraints: "MULTIPLICATIVE | ADDITIVE"
      - name: computed_deterioration_factor
        type: number
        source: computed
        description: this run's deterioration factor, after extrapolation
        default: null
        constraints: "4 decimals, round_half_up"
      - name: extrapolated
        type: boolean
        source: computed
        description: true when accumulated_hours < family.durability_hours
        default: false
      - name: status
        type: enum
        source: system
        description: run lifecycle
        default: SCHEDULED
        constraints: "SCHEDULED | COMPLETED"
      - name: completed_at
        type: datetime
        source: system
        description: logical-clock instant of completion
        default: null

  # ------------------------------------------------------------ product lines
  - name: ProductModel
    parent: EnginePlatform
    common_fields: true
    fields:
      - name: engine_platform_id
        type: string
        source: input
        description: FK -> EnginePlatform.id; shared engine platform this finished-goods model is built on
      - name: model_code
        type: string
        source: input
        description: saleable model designation
        constraints: "1..30 chars, unique -> ERR_DUPLICATE_CODE"
      - name: product_line
        type: enum
        source: input
        description: equipment family; selects the required safety standard and season start
        constraints: "WALK_MOWER | RIDING_MOWER | SNOW_THROWER | GENERATOR"
      - name: channel
        type: enum
        source: input
        description: dealer versus mass-retail differentiation
        constraints: "DEALER | MASS_RETAIL | DUAL"
      - name: blade_brake_type
        type: enum
        source: input
        description: blade brake provision; must be NONE for GENERATOR
        constraints: "BLADE_BRAKE_CLUTCH | ENGINE_KILL | NONE"
      - name: operator_presence_type
        type: enum
        source: input
        description: operator presence control; must match product_line per validations[priority=90]
        constraints: "BAIL | SEAT_SWITCH | TWO_HAND | CO_SHUTOFF"
      - name: warranty_months
        type: integer
        source: input
        description: consumer warranty; dealer-channel models carry longer coverage
        constraints: "12..120; >= 36 when channel IN {DEALER, DUAL}, >= 24 when channel == MASS_RETAIL"
      - name: standard_cost_cents
        type: integer
        source: input
        description: standard build cost per unit, used for build value and carry cost
        constraints: ">= 1"
      - name: msrp_cents
        type: integer
        source: input
        description: manufacturer suggested retail price
        constraints: ">= standard_cost_cents"
      - name: dealer_share_pct
        type: number
        source: input
        description: fraction of a build allocated to the dealer channel before caps
        constraints: "0.00..1.00, 2 decimals; == 1.00 when channel == DEALER, == 0.00 when channel == MASS_RETAIL, strictly between when DUAL"
      - name: dealer_cap_units
        type: integer
        source: input
        description: maximum finished units the dealer channel may absorb per build order; excess becomes unallocated
        constraints: ">= 0"
      - name: mass_retail_cap_units
        type: integer
        source: input
        description: maximum finished units the mass-retail channel may absorb per build order; excess spills to dealer
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: model lifecycle
        default: DRAFT
        constraints: "DRAFT | RELEASED | SUSPENDED"
      - name: released_at
        type: datetime
        source: system
        description: logical-clock instant of the latest release
        default: null

  - name: SafetyCertification
    parent: ProductModel
    common_fields: false
    fields:
      - name: product_model_id
        type: string
        source: input
        description: FK -> ProductModel.id; model whose blade-brake / operator-presence performance was measured
      - name: standard_code
        type: enum
        source: input
        description: safety standard the test was run under; must match the model's product_line
        constraints: "ANSI_B71_1 | ANSI_B71_3 | UL_2201"
      - name: blade_stop_time_ms
        type: integer
        source: input
        description: measured blade stop time; MUST be null for GENERATOR models and non-null otherwise
        default: null
        constraints: "1..10000 or null"
      - name: opc_stop_time_ms
        type: integer
        source: input
        description: measured operator-presence (or CO shutoff) response time
        constraints: "1..10000"
      - name: tested_on
        type: string
        source: input
        description: ISO date of the bench test; latest tested_on wins when several certifications exist
        constraints: "YYYY-MM-DD"
      - name: expires_on
        type: string
        source: input
        description: ISO date the certification remains valid through, inclusive
        constraints: "YYYY-MM-DD, > tested_on"
      - name: result
        type: enum
        source: computed
        description: PASSED when both measured times sit within constants, else FAILED
        constraints: "PASSED | FAILED"
      - name: tested_by_user_id
        type: string
        source: system
        description: X-User-ID of the ComplianceOfficer who recorded the test

  # --------------------------------------------------------- supplier quality
  - name: Supplier
    parent: null
    common_fields: true
    fields:
      - name: supplier_code
        type: string
        source: input
        description: supplier designation
        constraints: "1..30 chars, unique -> ERR_DUPLICATE_CODE"
      - name: name
        type: string
        source: input
        description: supplier legal name
        constraints: "1..120 chars"
      - name: component_category
        type: enum
        source: input
        description: the single component family this supplier ships
        constraints: "CARBURETOR | IGNITION | CASTING"
      - name: criticality
        type: enum
        source: computed
        description: CASTING -> CRITICAL (zero-defect acceptance), otherwise MAJOR
        constraints: "CRITICAL | MAJOR"
      - name: approval_status
        type: enum
        source: system
        description: supplier standing; SUSPENDED is terminal and blocks new receipts
        default: APPROVED
        constraints: "APPROVED | PROBATION | SUSPENDED"
      - name: incoming_inspection_level
        type: enum
        source: computed
        description: sampling severity applied to the NEXT received lot (calculations.supplier_inspection_level_ladder)
        default: NORMAL
        constraints: "SKIP_LOT | REDUCED | NORMAL | TIGHTENED"
      - name: rolling_defect_ppm
        type: integer
        source: computed
        description: pooled sample defect rate in parts-per-million over all inspected lots (calculations.supplier_defect_ppm, variant POOLED)
        default: 0
      - name: inspected_lot_count
        type: integer
        source: computed
        description: number of lots of this supplier whose status IN {ACCEPTED, REJECTED, DEVIATION_ACCEPTED}
        default: 0
      - name: consecutive_accepted_lots
        type: integer
        source: computed
        description: accepted-lot streak; reset to 0 by any rejection
        default: 0

  - name: ComponentLot
    parent: Supplier
    common_fields: true
    fields:
      - name: supplier_id
        type: string
        source: input
        description: FK -> Supplier.id; shipper of this lot
      - name: lot_code
        type: string
        source: input
        description: supplier lot designation
        constraints: "1..30 chars, unique per supplier_id -> ERR_DUPLICATE_CODE"
      - name: lot_quantity
        type: integer
        source: input
        description: pieces received
        constraints: "1..100000"
      - name: component_category
        type: enum
        source: computed
        description: copied from the supplier at receipt
        constraints: "CARBURETOR | IGNITION | CASTING"
      - name: inspection_level_at_receipt
        type: enum
        source: computed
        description: supplier.incoming_inspection_level frozen at receipt; later ladder moves do NOT re-plan this lot
        constraints: "SKIP_LOT | REDUCED | NORMAL | TIGHTENED"
      - name: sample_size
        type: integer
        source: computed
        description: pieces to inspect, from calculations.lot_sample_plan
      - name: acceptance_number
        type: integer
        source: computed
        description: maximum defects still accepted, from calculations.lot_sample_plan
      - name: defects_found
        type: integer
        source: input
        description: defects observed in the sample, supplied at inspection
        default: null
        constraints: "0..sample_size"
      - name: status
        type: enum
        source: system
        description: lot disposition
        default: RECEIVED
        constraints: "RECEIVED | ACCEPTED | REJECTED | DEVIATION_ACCEPTED | QUARANTINED"
      - name: accepted_qty
        type: integer
        source: computed
        description: pieces released to the line (lot_quantity - defects_found on acceptance, 0 otherwise)
        default: 0
      - name: consumed_qty
        type: integer
        source: computed
        description: pieces consumed by staged EngineUnits
        default: 0
      - name: remaining_qty
        type: integer
        source: computed
        description: accepted_qty - consumed_qty; conserved quantity of the stage/cancel invariant
        default: 0
      - name: defect_ppm
        type: integer
        source: computed
        description: this lot's own sample defect rate in ppm, round_half_up to integer
        default: null
      - name: inspected_by_user_id
        type: string
        source: system
        description: X-User-ID of the inspecting QualityEngineer; segregation-of-duties comparand at deviation acceptance
        default: null
      - name: deviation_approved_by_user_id
        type: string
        source: system
        description: X-User-ID of the ComplianceOfficer who granted the deviation
        default: null
      - name: deviation_flag
        type: boolean
        source: computed
        description: true once the lot has been deviation-accepted; taints every unit built from it
        default: false

  - name: MachiningRun
    parent: EnginePlatform
    common_fields: true
    fields:
      - name: engine_platform_id
        type: string
        source: input
        description: FK -> EnginePlatform.id; platform whose critical component is being machined
      - name: casting_lot_id
        type: string
        source: input
        description: FK -> ComponentLot.id; the CASTING lot fed into this run
      - name: component_type
        type: enum
        source: input
        description: critical component machined in this run
        constraints: "CRANKSHAFT | CYLINDER_BORE | CAMSHAFT"
      - name: criticality
        type: enum
        source: computed
        description: CRANKSHAFT and CYLINDER_BORE -> CRITICAL (Cpk gate 1.33), CAMSHAFT -> MAJOR (gate 1.00)
        constraints: "CRITICAL | MAJOR"
      - name: lsl_mm
        type: number
        source: input
        description: lower specification limit of the controlled dimension
        constraints: "5 decimals, < usl_mm"
      - name: usl_mm
        type: number
        source: input
        description: upper specification limit of the controlled dimension
        constraints: "5 decimals"
      - name: measurements
        type: array
        source: input
        description: dimension samples in mm supplied at close; at least MIN_CAPABILITY_SAMPLE entries
        default: null
        constraints: "array of numbers, 5 decimals each"
      - name: sample_count
        type: integer
        source: computed
        description: length of measurements
        default: 0
      - name: mean_mm
        type: number
        source: computed
        description: arithmetic mean of measurements, 5 decimals
        default: null
      - name: sigma_mm
        type: number
        source: computed
        description: sample standard deviation (n-1 divisor), 6 decimals
        default: null
      - name: cpk
        type: number
        source: computed
        description: process capability index (calculations.process_capability_cpk)
        default: null
        constraints: "4 decimals, round_half_up; capped at 9.9999 when sigma_mm == 0"
      - name: status
        type: enum
        source: system
        description: run disposition; only CLOSED runs may feed engine assembly
        default: OPEN
        constraints: "OPEN | CLOSED | CAPABILITY_HOLD"
      - name: closed_at
        type: datetime
        source: system
        description: logical-clock instant of the latest close attempt
        default: null

  # ------------------------------------------------------- production planning
  - name: AssemblyLine
    parent: null
    common_fields: true
    fields:
      - name: line_code
        type: string
        source: input
        description: assembly line designation
        constraints: "1..20 chars, unique -> ERR_DUPLICATE_CODE"
      - name: supported_product_lines
        type: array
        source: input
        description: product lines this line can build
        constraints: "non-empty array of WALK_MOWER | RIDING_MOWER | SNOW_THROWER | GENERATOR"
      - name: weekly_capacity_units
        type: integer
        source: input
        description: units the line can build in one production week
        constraints: "1..100000"
      - name: changeover_gap_weeks
        type: integer
        source: input
        description: minimum whole-week separation required between orders of DIFFERENT product lines on this line
        default: 1
        constraints: "0..4"
      - name: status
        type: enum
        source: input
        description: line availability, set at creation
        default: RUNNING
        constraints: "RUNNING | DOWN"

  - name: BuildOrder
    parent: ProductModel
    common_fields: true
    fields:
      - name: product_model_id
        type: string
        source: input
        description: FK -> ProductModel.id; model being built
      - name: assembly_line_id
        type: string
        source: input
        description: FK -> AssemblyLine.id; line occupied for the production weeks
      - name: season
        type: enum
        source: input
        description: pre-season builds carry inventory to the season start; in-season builds do not
        constraints: "PRE_SEASON | IN_SEASON"
      - name: production_week
        type: string
        source: input
        description: ISO date of the first occupied production week; MUST be a Monday
        constraints: "YYYY-MM-DD, weekday == Monday"
      - name: week_span
        type: integer
        source: input
        description: number of consecutive weeks occupied, inclusive of production_week
        constraints: "1..8"
      - name: planned_quantity
        type: integer
        source: input
        description: units planned across the whole span
        constraints: "1..100000"
      - name: build_value_cents
        type: integer
        source: computed
        description: planned_quantity * ProductModel.standard_cost_cents; the tier key for carry rate
      - name: carry_weeks
        type: integer
        source: computed
        description: whole weeks from production_week to the product line's season start, 0 for IN_SEASON
        default: 0
      - name: carry_rate
        type: number
        source: computed
        description: weekly carry rate selected from build_value_cents (calculations.build_carry_cost)
        constraints: "4 decimals"
      - name: carry_cost_cents
        type: integer
        source: computed
        description: pre-season inventory carry cost, whole cents round_half_up
        default: 0
      - name: total_committed_cents
        type: integer
        source: computed
        description: build_value_cents + carry_cost_cents
      - name: staged_quantity
        type: integer
        source: computed
        description: EngineUnits of this order with build_state IN {STAGED, ASSEMBLED, HOT_TESTED}
        default: 0
      - name: built_quantity
        type: integer
        source: computed
        description: EngineUnits of this order with build_state == RELEASED; the allocation pool
        default: 0
      - name: allocated_dealer_units
        type: integer
        source: computed
        description: units positioned to the dealer channel by the latest allocation run
        default: 0
      - name: allocated_mass_retail_units
        type: integer
        source: computed
        description: units positioned to the mass-retail channel by the latest allocation run
        default: 0
      - name: unallocated_units
        type: integer
        source: computed
        description: built units held back by channel caps; conserved-quantity slack of the allocation invariant
        default: 0
      - name: allocation_status
        type: enum
        source: system
        description: whether an allocation run currently stands
        default: UNALLOCATED
        constraints: "UNALLOCATED | ALLOCATED"
      - name: allocation_run_at
        type: datetime
        source: system
        description: logical-clock instant of the latest allocation run
        default: null
      - name: status
        type: enum
        source: system
        description: order lifecycle; HELD is imposed by an emission-family cascade and lifted by re-certification
        default: PLANNED
        constraints: "PLANNED | RELEASED | IN_PRODUCTION | HELD | COMPLETED"
      - name: held_reason
        type: string
        source: system
        description: why the order is HELD (family AUDIT_HOLD or family SUSPENDED)
        default: null
      - name: status_before_hold
        type: enum
        source: system
        description: status captured when HELD was imposed, restored when the family returns to CERTIFIED
        default: null
        constraints: "PLANNED | RELEASED | IN_PRODUCTION"
      - name: released_at
        type: datetime
        source: system
        description: logical-clock instant of release to the floor
        default: null

  - name: EngineUnit
    parent: BuildOrder
    common_fields: true
    fields:
      - name: build_order_id
        type: string
        source: input
        description: FK -> BuildOrder.id; order this unit is built against
      - name: machining_run_id
        type: string
        source: input
        description: FK -> MachiningRun.id; the CLOSED machining run supplying the critical component
      - name: carburetor_lot_id
        type: string
        source: input
        description: FK -> ComponentLot.id; lot supplying this unit's carburetor
      - name: ignition_lot_id
        type: string
        source: input
        description: FK -> ComponentLot.id; lot supplying this unit's ignition module
      - name: serial_number
        type: string
        source: input
        description: engine serial
        constraints: "1..30 chars, unique -> ERR_DUPLICATE_CODE"
      - name: build_state
        type: enum
        source: system
        description: physical build dimension, independent of conformance_state
        default: STAGED
        constraints: "STAGED | ASSEMBLED | HOT_TESTED | RELEASED | CANCELLED"
      - name: conformance_state
        type: enum
        source: system
        description: quality dimension, independent of build_state
        default: PENDING
        constraints: "PENDING | CONFORMING | NONCONFORMING | QUARANTINED"
      - name: torque_readings
        type: array
        source: input
        description: per-station torque results supplied by the line, exactly EnginePlatform.required_fastener_count entries
        default: null
        constraints: "array of objects { station: integer, torque_nm: number(1 decimal) }"
      - name: out_of_spec_fastener_count
        type: integer
        source: computed
        description: readings outside the inclusive torque band (calculations.torque_conformance)
        default: null
      - name: measured_rpm
        type: integer
        source: input
        description: governed speed observed on the hot test stand
        default: null
        constraints: "0..10000"
      - name: measured_emission_g_per_kwh
        type: number
        source: input
        description: emission observed on the hot test stand
        default: null
        constraints: "> 0, 2 decimals"
      - name: hot_test_emission_threshold
        type: number
        source: computed
        description: emission ceiling applied to this unit, tightened for deviation-sourced units
        default: null
        constraints: "2 decimals, round_half_up"
      - name: deviation_sourced
        type: boolean
        source: computed
        description: true when any consumed lot has deviation_flag == true
        default: false
      - name: rework_count
        type: integer
        source: computed
        description: number of rework cycles this unit has been through
        default: 0
      - name: released_at
        type: datetime
        source: system
        description: logical-clock instant the unit was released to finished goods
        default: null

  - name: ProductionLineAudit
    parent: BuildOrder
    common_fields: true
    fields:
      - name: build_order_id
        type: string
        source: input
        description: FK -> BuildOrder.id; the running order whose released units are sampled
      - name: certification_family_id
        type: string
        source: computed
        description: "resolved emission family (not a client input): BuildOrder -> ProductModel -> EnginePlatform -> CertificationFamily, snapshotted at schedule time"
      - name: audit_week
        type: string
        source: input
        description: ISO date of the audited production week; MUST be a Monday
        constraints: "YYYY-MM-DD, weekday == Monday"
      - name: required_sample_size
        type: integer
        source: computed
        description: max(MIN_AUDIT_SAMPLE, ceil(build_order.built_quantity * AUDIT_SAMPLE_FRACTION)) frozen at schedule time
      - name: units_tested
        type: integer
        source: input
        description: units actually pulled and tested, supplied at recording
        default: null
        constraints: ">= 1"
      - name: units_failed
        type: integer
        source: input
        description: sampled units that failed, supplied at recording
        default: null
        constraints: "0..units_tested"
      - name: max_measured_emission_g_per_kwh
        type: number
        source: input
        description: worst emission observed across the sample, supplied at recording
        default: null
        constraints: "> 0, 2 decimals"
      - name: failure_rate
        type: number
        source: computed
        description: units_failed / units_tested (calculations.audit_outcome_evaluation)
        default: null
        constraints: "4 decimals, round_half_up"
      - name: failure_reason
        type: enum
        source: computed
        description: why the audit failed; emission breach outranks rate breach when both hold
        default: null
        constraints: "EMISSION_LIMIT_EXCEEDED | FAILURE_RATE_EXCEEDED | null"
      - name: status
        type: enum
        source: system
        description: audit lifecycle
        default: SCHEDULED
        constraints: "SCHEDULED | PASSED | FAILED"
      - name: recorded_by_user_id
        type: string
        source: system
        description: X-User-ID of the ComplianceOfficer who recorded the result
        default: null

  # ------------------------------------------------------------ service parts
  - name: ServicePart
    parent: EnginePlatform
    common_fields: true
    fields:
      - name: engine_platform_id
        type: string
        source: input
        description: FK -> EnginePlatform.id; platform this part services
      - name: part_number
        type: string
        source: input
        description: service part number
        constraints: "1..30 chars, unique -> ERR_DUPLICATE_CODE"
      - name: category
        type: enum
        source: input
        description: service part family
        constraints: "CARBURETOR_KIT | IGNITION_MODULE | BLADE_ASSEMBLY | FILTER_KIT"
      - name: superseded_by_part_id
        type: string
        source: system
        description: FK -> ServicePart.id; successor in the supersession chain, set by the supersede action
        default: null
      - name: on_hand_qty
        type: integer
        source: input
        description: pieces available to the repair network
        constraints: ">= 0"
      - name: committed_availability_years
        type: integer
        source: input
        description: years of parts availability committed after last production
        constraints: ">= 7"
      - name: last_production_year
        type: integer
        source: input
        description: final model year the part was produced for
        constraints: "2020..2060"
      - name: dealer_lead_time_days
        type: integer
        source: input
        description: promised days to ship for dealer-channel requests
        default: 2
        constraints: "1..30"
      - name: mass_retail_lead_time_days
        type: integer
        source: input
        description: promised days to ship for mass-retail-channel requests
        default: 5
        constraints: "1..60"
      - name: commitment_expires_year
        type: integer
        source: computed
        description: last_production_year + committed_availability_years; obsoletion requires the clock year to be strictly greater
      - name: filled_request_count
        type: integer
        source: computed
        description: requests on this part with status == FILLED
        default: 0
      - name: substituted_request_count
        type: integer
        source: computed
        description: requests on this part with status == SUBSTITUTED
        default: 0
      - name: backordered_request_count
        type: integer
        source: computed
        description: requests on this part with status == BACKORDERED
        default: 0
      - name: fill_rate_pct
        type: number
        source: computed
        description: parts availability commitment metric (calculations.parts_fill_rate_and_promise)
        default: null
        constraints: "2 decimals, round_half_up; null when the part has no requests"
      - name: status
        type: enum
        source: system
        description: part lifecycle
        default: ACTIVE
        constraints: "ACTIVE | SUPERSEDED | OBSOLETE"

  - name: PartsFulfillmentRequest
    parent: ServicePart
    common_fields: true
    fields:
      - name: service_part_id
        type: string
        source: input
        description: FK -> ServicePart.id; part the repair network asked for
      - name: shipped_from_part_id
        type: string
        source: computed
        description: FK -> ServicePart.id; part the pieces actually came from (equals service_part_id unless substituted)
        default: null
      - name: requested_quantity
        type: integer
        source: input
        description: pieces requested
        constraints: ">= 1"
      - name: channel
        type: enum
        source: input
        description: requesting channel; selects the promised lead time
        constraints: "DEALER | MASS_RETAIL"
      - name: requester_user_id
        type: string
        source: system
        description: X-User-ID of the ChannelPartner that raised the request; scopes the request listing
      - name: status
        type: enum
        source: system
        description: fulfillment outcome
        constraints: "FILLED | BACKORDERED | SUBSTITUTED"
      - name: promised_ship_date
        type: string
        source: computed
        description: ISO date promised to the repair network, recomputed when a backorder is substituted
        constraints: "YYYY-MM-DD"

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  - entity: CertificationFamily
    initial_state: DRAFT
    terminal_states: [SUSPENDED]
    transitions:
      - from: DRAFT
        to: DURABILITY_TESTING
        trigger: "POST /durability-tests"
        actor: CertificationEngineer
        preconditions:
          - "family.status IN {DRAFT, DURABILITY_TESTING, AUDIT_HOLD}"
          - "payload expected_certification_family_version == family.version (concurrency_rules[durability-create-stale-family])"
          - "engine_platform.certification_family_id == family.id"
          - "scheduled_end_at > scheduled_start_at"
          - "no other DurabilityTestRun with status IN {SCHEDULED, COMPLETED} on the same engine_platform_id overlaps [scheduled_start_at, scheduled_end_at)"
        side_effects:
          - "DurabilityTestRun created with status SCHEDULED and df_method set from family.emission_standard"
          - "increments CertificationFamily.version by 1"
          - "recompute EnginePlatform.certification_posture for every platform of the family -> RESTRICTED (calculations.platform_certification_posture)"
      - from: AUDIT_HOLD
        to: DURABILITY_TESTING
        trigger: "POST /durability-tests"
        actor: CertificationEngineer
        preconditions:
          - "family.status == AUDIT_HOLD"
          - "payload expected_certification_family_version == family.version"
          - "scheduled_start_at >= family.audit_hold_at (the remediation run must start after the hold was imposed)"
        side_effects:
          - "same as DRAFT -> DURABILITY_TESTING"
          - "held BuildOrders of this family stay HELD until the family is CERTIFIED again"
        note: "Cycle re-entry after a failed production line audit; loop bounded by CertificationFamily.cumulative_audit_failures < AUDIT_FAILURE_SUSPEND_COUNT."
      - from: DURABILITY_TESTING
        to: DURABILITY_TESTING
        trigger: "POST /durability-tests"
        actor: CertificationEngineer
        preconditions:
          - "family.status == DURABILITY_TESTING"
          - "payload expected_certification_family_version == family.version"
          - "the new window does not overlap any SCHEDULED or COMPLETED run on that platform"
        side_effects:
          - "an additional DurabilityTestRun is created SCHEDULED; the family stays DURABILITY_TESTING"
          - "increments CertificationFamily.version by 1 — which is exactly why a client holding the pre-call version is rejected by concurrency_rules[durability-create-stale-family]"
        note: "A family may carry several scheduled runs (different platforms or non-overlapping windows on one platform); the first completion moves the family to DURABILITY_COMPLETE and the latest COMPLETED run owns the deterioration factor."
      - from: DURABILITY_TESTING
        to: DURABILITY_COMPLETE
        trigger: "POST /durability-tests/{id}/complete"
        actor: CertificationEngineer
        preconditions:
          - "run.status == SCHEDULED"
          - "accumulated_hours >= 1 and final_emission_g_per_kwh > 0"
        side_effects:
          - "DurabilityTestRun -> COMPLETED, completed_at = clock"
          - "run.computed_deterioration_factor and run.extrapolated set (calculations.deterioration_factor_and_certified_emission)"
          - "family.deterioration_factor / certified_emission_g_per_kwh / compliance_margin_pct recomputed from this run"
          - "family.status -> DURABILITY_COMPLETE"
        note: "A family with several SCHEDULED runs moves to DURABILITY_COMPLETE on the first completion; the latest COMPLETED run always owns the family's deterioration_factor."
      - from: DURABILITY_COMPLETE
        to: SUBMITTED
        trigger: "POST /certification-families/{id}/submit"
        actor: CertificationEngineer
        preconditions:
          - "family.status == DURABILITY_COMPLETE"
          - "family.certified_emission_g_per_kwh IS NOT NULL"
        side_effects:
          - "family.status -> SUBMITTED; family.submitted_by_user_id = X-User-ID"
      - from: SUBMITTED
        to: CERTIFIED
        trigger: "POST /certification-families/{id}/certify"
        actor: ComplianceOfficer
        preconditions:
          - "family.status == SUBMITTED"
          - "X-User-ID != family.submitted_by_user_id (segregation of duties)"
          - "family.certified_emission_g_per_kwh <= family.family_emission_limit_g_per_kwh"
          - "family.compliance_margin_pct >= MIN_COMPLIANCE_MARGIN_PCT"
        side_effects:
          - "family.status -> CERTIFIED; certified_by_user_id = X-User-ID; certified_at = clock"
          - "recompute EnginePlatform.certification_posture -> OPEN for every platform of the family"
          - "COMPENSATION: every BuildOrder of this family with status == HELD returns to its status_before_hold; held_reason and status_before_hold cleared"
          - "held BuildOrders' EngineUnits with conformance_state == QUARANTINED return to conformance_state PENDING (build_state untouched)"
          - "ProductModels SUSPENDED by the hold are NOT auto-released: a model release re-checks its safety certification, so the PlantAdmin must call POST /product-models/{id}/release explicitly"
      - from: CERTIFIED
        to: AUDIT_HOLD
        trigger: "POST /line-audits/{id}/record (result FAILED)"
        actor: ComplianceOfficer
        preconditions:
          - "audit.status == SCHEDULED"
          - "audit outcome evaluates to FAILED (calculations.audit_outcome_evaluation)"
          - "family.cumulative_audit_failures + 1 < AUDIT_FAILURE_SUSPEND_COUNT"
        side_effects:
          - "CASCADE L1: audit.status -> FAILED, failure_reason set, recorded_by_user_id = X-User-ID"
          - "CASCADE L2: family.cumulative_audit_failures += 1; family.status -> AUDIT_HOLD; family.audit_hold_at = clock"
          - "CASCADE L2b: every EnginePlatform of the family -> certification_posture RESTRICTED; every ProductModel on those platforms with status == RELEASED -> SUSPENDED"
          - "CASCADE L3: every BuildOrder of those models with status IN {PLANNED, RELEASED, IN_PRODUCTION} -> HELD; status_before_hold captured; held_reason = 'FAMILY_AUDIT_HOLD'"
          - "CASCADE L4: for each newly HELD BuildOrder, every EngineUnit with build_state IN {STAGED, ASSEMBLED, HOT_TESTED} -> conformance_state QUARANTINED"
          - "CASCADE L4b: for each newly HELD BuildOrder, allocated_dealer_units / allocated_mass_retail_units reset to 0, unallocated_units = built_quantity, allocation_status -> UNALLOCATED"
      - from: AUDIT_HOLD
        to: SUSPENDED
        trigger: "POST /line-audits/{id}/record (result FAILED)"
        actor: ComplianceOfficer
        preconditions:
          - "audit.status == SCHEDULED"
          - "audit outcome evaluates to FAILED"
          - "family.cumulative_audit_failures + 1 >= AUDIT_FAILURE_SUSPEND_COUNT"
        side_effects:
          - "family.cumulative_audit_failures += 1; family.status -> SUSPENDED (terminal)"
          - "every EnginePlatform of the family -> certification_posture FROZEN"
          - "every BuildOrder of the family with status IN {PLANNED, RELEASED, IN_PRODUCTION, HELD} -> HELD with held_reason = 'FAMILY_SUSPENDED'"
          - "EngineUnit and allocation cascades identical to the AUDIT_HOLD case"
      - from: CERTIFIED
        to: SUSPENDED
        trigger: "POST /line-audits/{id}/record (result FAILED)"
        actor: ComplianceOfficer
        preconditions:
          - "family.cumulative_audit_failures + 1 >= AUDIT_FAILURE_SUSPEND_COUNT"
        side_effects:
          - "identical to AUDIT_HOLD -> SUSPENDED"
        note: "Reachable when a family already carrying AUDIT_FAILURE_SUSPEND_COUNT-1 failures was re-certified and then fails again."

  - entity: DurabilityTestRun
    initial_state: SCHEDULED
    terminal_states: [COMPLETED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /durability-tests/{id}/complete"
        actor: CertificationEngineer
        preconditions:
          - "run.status == SCHEDULED"
        side_effects:
          - "see CertificationFamily DURABILITY_TESTING -> DURABILITY_COMPLETE"

  - entity: EnginePlatform
    initial_state: PENDING
    terminal_states: [FROZEN]
    transitions:
      - from: PENDING
        to: RESTRICTED
        trigger: "system (recompute on owning family status change to DURABILITY_TESTING / DURABILITY_COMPLETE / SUBMITTED / AUDIT_HOLD)"
        actor: system
        preconditions: ["owning family status changed"]
        side_effects: ["certification_posture = RESTRICTED; BuildOrder release blocked with ERR_FAMILY_NOT_CERTIFIED"]
      - from: RESTRICTED
        to: OPEN
        trigger: "POST /certification-families/{id}/certify"
        actor: ComplianceOfficer
        preconditions: ["family.status -> CERTIFIED"]
        side_effects: ["certification_posture = OPEN; BuildOrder release permitted"]
      - from: OPEN
        to: RESTRICTED
        trigger: "POST /line-audits/{id}/record (result FAILED, family -> AUDIT_HOLD)"
        actor: ComplianceOfficer
        preconditions: ["family -> AUDIT_HOLD"]
        side_effects: ["certification_posture = RESTRICTED"]
      - from: RESTRICTED
        to: FROZEN
        trigger: "POST /line-audits/{id}/record (result FAILED, family -> SUSPENDED)"
        actor: ComplianceOfficer
        preconditions: ["family -> SUSPENDED"]
        side_effects: ["certification_posture = FROZEN (terminal, mirrors the family's terminal SUSPENDED)"]
      - from: OPEN
        to: FROZEN
        trigger: "POST /line-audits/{id}/record (result FAILED, family -> SUSPENDED)"
        actor: ComplianceOfficer
        preconditions: ["family -> SUSPENDED"]
        side_effects: ["certification_posture = FROZEN"]
    note: "This machine is a pure projection of the owning family's status (calculations.platform_certification_posture) — it has no independent trigger of its own."

  - entity: ProductModel
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: RELEASED
        trigger: "POST /product-models/{id}/release"
        actor: PlantAdmin
        preconditions:
          - "model.status IN {DRAFT, SUSPENDED}"
          - "a SafetyCertification exists for the model with result == PASSED (latest by tested_on DESC, created_at DESC)"
          - "that certification's expires_on >= clock date (inclusive)"
        side_effects:
          - "model.status -> RELEASED; released_at = clock"
      - from: RELEASED
        to: SUSPENDED
        trigger: "POST /line-audits/{id}/record (result FAILED)"
        actor: ComplianceOfficer
        preconditions:
          - "the model's platform belongs to the family whose audit failed"
        side_effects:
          - "model.status -> SUSPENDED (blocks new BuildOrder creation with ERR_MODEL_STATE_INVALID)"
      - from: SUSPENDED
        to: RELEASED
        trigger: "POST /product-models/{id}/release"
        actor: PlantAdmin
        preconditions:
          - "platform.certification_posture == OPEN"
          - "latest PASSED SafetyCertification still valid at the clock date"
        side_effects:
          - "model.status -> RELEASED; released_at = clock"
        note: "Cycle: a model suspended by an audit failure returns to service only after re-certification plus an explicit re-release."

  - entity: Supplier
    initial_state: APPROVED
    terminal_states: [SUSPENDED]
    transitions:
      - from: APPROVED
        to: PROBATION
        trigger: "POST /component-lots/{id}/inspect"
        actor: QualityEngineer
        preconditions:
          - "recomputed rolling_defect_ppm > PPM_PROBATION_THRESHOLD and <= PPM_SUSPEND_THRESHOLD"
        side_effects:
          - "CASCADE L2: approval_status -> PROBATION; incoming_inspection_level -> TIGHTENED"
          - "CASCADE L3: every ComponentLot of this supplier with status IN {RECEIVED, ACCEPTED} and remaining_qty > 0 -> QUARANTINED"
          - "CASCADE L4: every EngineUnit with build_state == STAGED whose carburetor_lot_id or ignition_lot_id is one of those quarantined lots -> conformance_state QUARANTINED"
      - from: APPROVED
        to: SUSPENDED
        trigger: "POST /component-lots/{id}/inspect"
        actor: QualityEngineer
        preconditions:
          - "recomputed rolling_defect_ppm > PPM_SUSPEND_THRESHOLD"
        side_effects:
          - "approval_status -> SUSPENDED (terminal); incoming_inspection_level -> TIGHTENED"
          - "same lot-quarantine and unit-quarantine cascade as PROBATION"
          - "POST /component-lots is rejected for this supplier with ERR_SUPPLIER_SUSPENDED"
      - from: PROBATION
        to: SUSPENDED
        trigger: "POST /component-lots/{id}/inspect"
        actor: QualityEngineer
        preconditions:
          - "recomputed rolling_defect_ppm > PPM_SUSPEND_THRESHOLD"
        side_effects:
          - "as above"
      - from: PROBATION
        to: APPROVED
        trigger: "POST /component-lots/{id}/inspect"
        actor: QualityEngineer
        preconditions:
          - "recomputed rolling_defect_ppm <= PPM_PROBATION_THRESHOLD"
          - "consecutive_accepted_lots >= REDUCED_STREAK"
        side_effects:
          - "approval_status -> APPROVED; incoming_inspection_level -> REDUCED or SKIP_LOT per calculations.supplier_inspection_level_ladder"
        note: "Recovery cycle APPROVED -> PROBATION -> APPROVED; SUSPENDED never recovers."

  - entity: ComponentLot
    initial_state: RECEIVED
    terminal_states: []
    transitions:
      - from: RECEIVED
        to: ACCEPTED
        trigger: "POST /component-lots/{id}/inspect"
        actor: QualityEngineer
        preconditions:
          - "lot.status == RECEIVED"
          - "0 <= defects_found <= lot.sample_size"
          - "defects_found <= lot.acceptance_number"
        side_effects:
          - "lot.status -> ACCEPTED; accepted_qty = lot_quantity - defects_found; remaining_qty = accepted_qty; defect_ppm set"
          - "supplier.inspected_lot_count += 1; supplier.consecutive_accepted_lots += 1; supplier.rolling_defect_ppm recomputed (POOLED variant)"
          - "supplier.incoming_inspection_level re-derived (calculations.supplier_inspection_level_ladder)"
          - "lot.inspected_by_user_id = X-User-ID"
      - from: RECEIVED
        to: REJECTED
        trigger: "POST /component-lots/{id}/inspect"
        actor: QualityEngineer
        preconditions:
          - "lot.status == RECEIVED"
          - "defects_found > lot.acceptance_number"
        side_effects:
          - "CASCADE L1: lot.status -> REJECTED; accepted_qty = 0; remaining_qty = 0; defect_ppm set; inspected_by_user_id = X-User-ID"
          - "supplier.inspected_lot_count += 1; supplier.consecutive_accepted_lots = 0; supplier.rolling_defect_ppm recomputed"
          - "then the Supplier APPROVED -> PROBATION / SUSPENDED cascade above (L2 -> L3 -> L4) if a threshold is crossed"
      - from: REJECTED
        to: DEVIATION_ACCEPTED
        trigger: "POST /component-lots/{id}/deviation-accept"
        actor: ComplianceOfficer
        preconditions:
          - "lot.status IN {REJECTED, QUARANTINED}"
          - "X-User-ID != lot.inspected_by_user_id (segregation of duties)"
          - "lot.component_category != CASTING (critical castings are never deviation-accepted)"
        side_effects:
          - "lot.status -> DEVIATION_ACCEPTED; deviation_flag = true; accepted_qty = lot_quantity - defects_found; remaining_qty = accepted_qty"
          - "lot.deviation_approved_by_user_id = X-User-ID"
          - "every EngineUnit later built from this lot gets deviation_sourced = true and a tightened hot-test threshold"
          - "supplier.rolling_defect_ppm is NOT revised — the sample defects still count against the supplier"
      - from: QUARANTINED
        to: DEVIATION_ACCEPTED
        trigger: "POST /component-lots/{id}/deviation-accept"
        actor: ComplianceOfficer
        preconditions:
          - "lot.status == QUARANTINED"
          - "X-User-ID != lot.inspected_by_user_id"
          - "lot.component_category != CASTING"
        side_effects:
          - "as above; defects_found may be null (never inspected) in which case accepted_qty = lot_quantity"
      - from: RECEIVED
        to: QUARANTINED
        trigger: "POST /component-lots/{id}/inspect on a SIBLING lot that pushes the supplier onto PROBATION/SUSPENDED (cascade)"
        actor: system
        preconditions:
          - "lot.status == RECEIVED and its supplier crossed PPM_PROBATION_THRESHOLD"
        side_effects:
          - "lot.status -> QUARANTINED; the lot may no longer be inspected (ERR_LOT_STATE_INVALID)"
      - from: ACCEPTED
        to: QUARANTINED
        trigger: "POST /component-lots/{id}/inspect on a SIBLING lot that pushes the supplier onto PROBATION/SUSPENDED (cascade)"
        actor: system
        preconditions:
          - "lot.status == ACCEPTED and lot.remaining_qty > 0"
        side_effects:
          - "lot.status -> QUARANTINED; further EngineUnit staging from this lot is rejected with ERR_COMPONENT_LOT_NOT_RELEASABLE"
          - "then EngineUnits with build_state == STAGED consuming this lot -> conformance_state QUARANTINED"

  - entity: MachiningRun
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /machining-runs/{id}/close"
        actor: QualityEngineer
        preconditions:
          - "run.status IN {OPEN, CAPABILITY_HOLD}"
          - "len(measurements) >= MIN_CAPABILITY_SAMPLE"
          - "cpk >= CPK_GATE_CRITICAL when criticality == CRITICAL, else cpk >= CPK_GATE_MAJOR"
        side_effects:
          - "sample_count / mean_mm / sigma_mm / cpk written (calculations.process_capability_cpk); status -> CLOSED; closed_at = clock"
          - "the run becomes eligible to feed POST /engine-units"
      - from: OPEN
        to: CAPABILITY_HOLD
        trigger: "POST /machining-runs/{id}/close"
        actor: QualityEngineer
        preconditions:
          - "run.status IN {OPEN, CAPABILITY_HOLD}"
          - "len(measurements) >= MIN_CAPABILITY_SAMPLE"
          - "cpk below the criticality's gate"
        side_effects:
          - "cpk fields written; status -> CAPABILITY_HOLD; closed_at = clock"
          - "POST /engine-units referencing this run is rejected with ERR_MACHINING_RUN_NOT_CLOSED"
      - from: CAPABILITY_HOLD
        to: CLOSED
        trigger: "POST /machining-runs/{id}/close (re-measured sample)"
        actor: QualityEngineer
        preconditions:
          - "run.status == CAPABILITY_HOLD"
          - "new measurements clear the gate"
        side_effects:
          - "capability fields overwritten with the new sample; status -> CLOSED"
      - from: CAPABILITY_HOLD
        to: CAPABILITY_HOLD
        trigger: "POST /machining-runs/{id}/close (still incapable)"
        actor: QualityEngineer
        preconditions:
          - "run.status == CAPABILITY_HOLD and the new sample also misses the gate"
        side_effects:
          - "capability fields overwritten; status stays CAPABILITY_HOLD"
        note: "Branching fork on a computed statistic with a re-entrant hold arm; CLOSED is terminal (a second close from CLOSED returns ERR_MACHINING_RUN_STATE_INVALID)."

  - entity: BuildOrder
    initial_state: PLANNED
    terminal_states: [COMPLETED]
    transitions:
      - from: PLANNED
        to: RELEASED
        trigger: "POST /build-orders/{id}/release"
        actor: ProductionPlanner
        preconditions:
          - "order.status == PLANNED"
          - "assembly_line.status == RUNNING"
          - "product_model.status == RELEASED"
          - "the model's latest PASSED SafetyCertification is valid at the clock date"
          - "engine_platform.certification_posture == OPEN"
        side_effects:
          - "order.status -> RELEASED; released_at = clock"
      - from: RELEASED
        to: IN_PRODUCTION
        trigger: "POST /engine-units (first unit staged against the order)"
        actor: QualityEngineer
        preconditions:
          - "order.status == RELEASED"
        side_effects:
          - "order.status -> IN_PRODUCTION; order.staged_quantity += 1"
      - from: IN_PRODUCTION
        to: IN_PRODUCTION
        trigger: "POST /engine-units, POST /engine-units/{id}/release, POST /engine-units/{id}/cancel"
        actor: QualityEngineer
        preconditions:
          - "order.status == IN_PRODUCTION"
          - "order.built_quantity < order.planned_quantity"
        side_effects:
          - "order.staged_quantity / built_quantity recomputed (calculations.build_order_progress)"
      - from: IN_PRODUCTION
        to: COMPLETED
        trigger: "POST /engine-units/{id}/release (the unit that reaches planned_quantity)"
        actor: QualityEngineer
        preconditions:
          - "order.built_quantity + 1 == order.planned_quantity"
        side_effects:
          - "order.built_quantity += 1; order.status -> COMPLETED (terminal)"
          - "further POST /engine-units against the order is rejected with ERR_BUILD_ORDER_NOT_ACCEPTING_UNITS"
          - "allocation runs remain permitted on a COMPLETED order"
      - from: PLANNED
        to: HELD
        trigger: "POST /line-audits/{id}/record (result FAILED) — cascade L3"
        actor: system
        preconditions:
          - "the order's model sits on a platform of the family whose audit failed"
        side_effects:
          - "status_before_hold = PLANNED; status -> HELD; held_reason set"
      - from: RELEASED
        to: HELD
        trigger: "POST /line-audits/{id}/record (result FAILED) — cascade L3"
        actor: system
        preconditions: ["as above"]
        side_effects:
          - "status_before_hold = RELEASED; status -> HELD; held_reason set"
          - "cascade L4: STAGED/ASSEMBLED/HOT_TESTED units -> conformance QUARANTINED"
          - "cascade L4b: allocation counters reset (unallocated_units = built_quantity)"
      - from: IN_PRODUCTION
        to: HELD
        trigger: "POST /line-audits/{id}/record (result FAILED) — cascade L3"
        actor: system
        preconditions: ["as above"]
        side_effects:
          - "status_before_hold = IN_PRODUCTION; status -> HELD; held_reason set; L4 and L4b as above"
      - from: HELD
        to: PLANNED
        trigger: "POST /certification-families/{id}/certify (compensation)"
        actor: ComplianceOfficer
        preconditions:
          - "order.status == HELD and order.status_before_hold == PLANNED"
          - "family.status -> CERTIFIED"
        side_effects:
          - "status restored to PLANNED; held_reason and status_before_hold cleared"
      - from: HELD
        to: RELEASED
        trigger: "POST /certification-families/{id}/certify (compensation)"
        actor: ComplianceOfficer
        preconditions:
          - "order.status == HELD and order.status_before_hold == RELEASED"
        side_effects:
          - "status restored to RELEASED; QUARANTINED units of the order return to conformance PENDING"
      - from: HELD
        to: IN_PRODUCTION
        trigger: "POST /certification-families/{id}/certify (compensation)"
        actor: ComplianceOfficer
        preconditions:
          - "order.status == HELD and order.status_before_hold == IN_PRODUCTION"
        side_effects:
          - "status restored to IN_PRODUCTION; QUARANTINED units of the order return to conformance PENDING"
          - "allocation counters are NOT restored — the planner must re-run POST /build-orders/{id}/allocations/run"

  - entity: EngineUnit
    initial_state: STAGED
    terminal_states: [RELEASED, CANCELLED]
    transitions:
      - from: STAGED
        to: ASSEMBLED
        trigger: "POST /engine-units/{id}/torque-record"
        actor: QualityEngineer
        preconditions:
          - "unit.build_state == STAGED"
          - "unit.conformance_state IN {PENDING, NONCONFORMING} (a QUARANTINED unit cannot progress)"
          - "len(torque_readings) == platform.required_fastener_count"
        side_effects:
          - "out_of_spec_fastener_count computed (calculations.torque_conformance)"
          - "build_state -> ASSEMBLED"
          - "conformance_state -> NONCONFORMING when out_of_spec_fastener_count > 0, otherwise left at PENDING"
      - from: ASSEMBLED
        to: HOT_TESTED
        trigger: "POST /engine-units/{id}/hot-test"
        actor: QualityEngineer
        preconditions:
          - "unit.build_state == ASSEMBLED"
          - "unit.conformance_state == PENDING (a NONCONFORMING unit must be reworked first)"
          - "measured_rpm and measured_emission_g_per_kwh supplied"
        side_effects:
          - "hot_test_emission_threshold computed (tightened for deviation_sourced units)"
          - "build_state -> HOT_TESTED"
          - "conformance_state -> CONFORMING when rpm inside [hot_test_min_rpm, hot_test_max_rpm] AND emission <= threshold, else NONCONFORMING"
      - from: HOT_TESTED
        to: RELEASED
        trigger: "POST /engine-units/{id}/release"
        actor: QualityEngineer
        preconditions:
          - "unit.build_state == HOT_TESTED"
          - "unit.conformance_state == CONFORMING"
          - "build_order.status IN {RELEASED, IN_PRODUCTION}"
        side_effects:
          - "build_state -> RELEASED (terminal); released_at = clock"
          - "build_order.built_quantity += 1, staged_quantity -= 1; order may auto-COMPLETE"
          - "the unit joins the allocation pool of its build order"
      - from: ASSEMBLED
        to: STAGED
        trigger: "POST /engine-units/{id}/rework"
        actor: QualityEngineer
        preconditions:
          - "unit.build_state IN {ASSEMBLED, HOT_TESTED}"
          - "unit.conformance_state == NONCONFORMING"
          - "unit.rework_count < MAX_REWORK_CYCLES"
        side_effects:
          - "rework_count += 1; build_state -> STAGED; conformance_state -> PENDING"
          - "torque_readings, out_of_spec_fastener_count, measured_rpm, measured_emission_g_per_kwh, hot_test_emission_threshold cleared to null"
          - "component consumption is NOT re-charged — the unit keeps its original lots"
      - from: HOT_TESTED
        to: STAGED
        trigger: "POST /engine-units/{id}/rework"
        actor: QualityEngineer
        preconditions: ["as above"]
        side_effects: ["as above"]
        note: "Rework closes the conformance cycle PENDING -> NONCONFORMING -> PENDING while the build dimension steps backwards independently."
      - from: STAGED
        to: CANCELLED
        trigger: "POST /engine-units/{id}/cancel"
        actor: QualityEngineer
        preconditions:
          - "unit.build_state IN {STAGED, ASSEMBLED, HOT_TESTED}"
        side_effects:
          - "COMPENSATION: build_state -> CANCELLED (terminal); conformance_state left unchanged"
          - "carburetor lot and ignition lot each get consumed_qty -= 1 and remaining_qty += 1 (invariant accepted_qty == consumed_qty + remaining_qty holds)"
          - "build_order.staged_quantity -= 1"
      - from: ASSEMBLED
        to: CANCELLED
        trigger: "POST /engine-units/{id}/cancel"
        actor: QualityEngineer
        preconditions: ["as above"]
        side_effects: ["as above"]
      - from: HOT_TESTED
        to: CANCELLED
        trigger: "POST /engine-units/{id}/cancel"
        actor: QualityEngineer
        preconditions: ["as above"]
        side_effects: ["as above"]
      - from: STAGED
        to: STAGED
        trigger: "POST /line-audits/{id}/record (FAILED) or POST /component-lots/{id}/inspect (supplier probation) — conformance cascade"
        actor: system
        preconditions:
          - "unit.build_state IN {STAGED, ASSEMBLED, HOT_TESTED}"
        side_effects:
          - "conformance_state -> QUARANTINED (build_state untouched); release and hot-test are then rejected with ERR_UNIT_NONCONFORMING"
        note: "Parallel dimensions: the cascade moves only the conformance axis, which is why the build axis shows the same from/to state."

  - entity: ProductionLineAudit
    initial_state: SCHEDULED
    terminal_states: [PASSED, FAILED]
    transitions:
      - from: SCHEDULED
        to: PASSED
        trigger: "POST /line-audits/{id}/record"
        actor: ComplianceOfficer
        preconditions:
          - "audit.status == SCHEDULED"
          - "units_tested >= audit.required_sample_size"
          - "units_tested <= build_order.built_quantity"
          - "failure_rate <= AUDIT_MAX_FAILURE_RATE AND max_measured_emission_g_per_kwh <= family.family_emission_limit_g_per_kwh"
        side_effects:
          - "failure_rate written; status -> PASSED; recorded_by_user_id = X-User-ID"
          - "family status and cumulative_audit_failures unchanged"
      - from: SCHEDULED
        to: FAILED
        trigger: "POST /line-audits/{id}/record"
        actor: ComplianceOfficer
        preconditions:
          - "audit.status == SCHEDULED"
          - "failure_rate > AUDIT_MAX_FAILURE_RATE OR max_measured_emission_g_per_kwh > family.family_emission_limit_g_per_kwh"
        side_effects:
          - "failure_rate and failure_reason written (EMISSION_LIMIT_EXCEEDED outranks FAILURE_RATE_EXCEEDED); status -> FAILED"
          - "drives the 5-level family cascade documented under CertificationFamily CERTIFIED -> AUDIT_HOLD"

  - entity: ServicePart
    initial_state: ACTIVE
    terminal_states: [OBSOLETE]
    transitions:
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "POST /service-parts/{id}/supersede"
        actor: PlantAdmin
        preconditions:
          - "part.status == ACTIVE"
          - "successor_part_id != part.id and successor is not already in this part's supersession chain (cycle check)"
          - "successor.engine_platform_id == part.engine_platform_id"
          - "successor.status == ACTIVE"
          - "resulting chain depth <= MAX_SUPERSESSION_DEPTH"
        side_effects:
          - "CASCADE L1: part.status -> SUPERSEDED; part.superseded_by_part_id = successor_part_id"
          - "CASCADE L2: this part's BACKORDERED requests, in created_at ASC order, become SUBSTITUTED while successor.on_hand_qty covers requested_quantity; successor.on_hand_qty decremented; shipped_from_part_id = successor id; promised_ship_date recomputed from the clock"
          - "CASCADE L3: fill_rate_pct recomputed on BOTH the superseded part and the successor (calculations.parts_fill_rate_and_promise)"
      - from: ACTIVE
        to: OBSOLETE
        trigger: "POST /service-parts/{id}/obsolete"
        actor: PlantAdmin
        preconditions:
          - "part.status IN {ACTIVE, SUPERSEDED}"
          - "clock year > part.commitment_expires_year"
          - "part.backordered_request_count == 0"
        side_effects:
          - "part.status -> OBSOLETE (terminal); new requests rejected with ERR_PART_STATE_INVALID"
      - from: SUPERSEDED
        to: OBSOLETE
        trigger: "POST /service-parts/{id}/obsolete"
        actor: PlantAdmin
        preconditions: ["as above"]
        side_effects: ["as above"]

  - entity: PartsFulfillmentRequest
    initial_state: BACKORDERED
    terminal_states: [FILLED, SUBSTITUTED]
    transitions:
      - from: BACKORDERED
        to: FILLED
        trigger: "POST /parts-requests (resolved inside the creating call when stock covers the request)"
        actor: ChannelPartner
        preconditions:
          - "part.status == ACTIVE"
          - "part.on_hand_qty >= requested_quantity"
        side_effects:
          - "status -> FILLED; shipped_from_part_id = service_part_id; part.on_hand_qty -= requested_quantity"
          - "promised_ship_date = clock date + dealer_lead_time_days or mass_retail_lead_time_days per channel"
          - "part.filled_request_count += 1; part.fill_rate_pct recomputed"
        note: "The request is minted BACKORDERED and settles to FILLED within the same request when stock suffices; a request that cannot be covered stays BACKORDERED with promised_ship_date = clock date + BACKORDER_PROMISE_DAYS."
      - from: BACKORDERED
        to: SUBSTITUTED
        trigger: "POST /service-parts/{id}/supersede (cascade L2)"
        actor: system
        preconditions:
          - "request.status == BACKORDERED"
          - "successor.on_hand_qty >= request.requested_quantity at the moment this request is processed (created_at ASC order)"
        side_effects:
          - "status -> SUBSTITUTED; shipped_from_part_id = successor id; successor.on_hand_qty decremented"
          - "promised_ship_date recomputed from the clock and the successor's channel lead time"
          - "both parts' counters and fill_rate_pct recomputed"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on the parent's `version` — the only mechanism)
# =============================================================================
concurrency_rules:
  - rule_id: durability-create-stale-family
    parent_entity: CertificationFamily
    write_endpoint: "POST /durability-tests"
    occ_field: "expected_certification_family_version"
    description: |
      Scheduling a DurabilityTestRun against a CertificationFamily whose
      version has advanced since the client last read it is rejected. A newly
      scheduled run legitimately supersedes the family's prior deterioration
      basis, so a client whose view of the family is stale would otherwise
      overwrite a run it never saw.
    error_id: ERR_STALE_FAMILY_VERSION
    http_status: 412

  - rule_id: allocation-run-stale-build-order
    parent_entity: BuildOrder
    write_endpoint: "POST /build-orders/{id}/allocations/run"
    occ_field: "expected_build_order_version"
    description: |
      Running channel allocation on a BuildOrder whose version has advanced
      since the client last read it is rejected. A fresh allocation run
      legitimately replaces the standing dealer/mass-retail split, so a
      client acting on a stale pool size would silently discard a split that
      another writer already committed.
    error_id: ERR_STALE_BUILD_ORDER_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: deterioration_factor_and_certified_emission
    trigger: "POST /durability-tests/{id}/complete (writes DurabilityTestRun.computed_deterioration_factor / extrapolated and CertificationFamily.deterioration_factor / certified_emission_g_per_kwh / compliance_margin_pct)"
    algorithm: deterioration_extrapolation
    input_set: |
      The single DurabilityTestRun being completed, plus its CertificationFamily.
      The family's deterioration_factor is always the value of the MOST RECENTLY
      COMPLETED run of that family, ordered by completed_at DESC, created_at DESC;
      runs with status == SCHEDULED are excluded.
    formula: |
      # Step 1 — variant selection from the family's emission_standard.
      #   EPA_PHASE3  -> MULTIPLICATIVE (df is a dimensionless ratio)
      #   CARB_2024   -> ADDITIVE       (df is a g/kWh offset)
      # Step 2 — raw deterioration over the run.
      if df_method == MULTIPLICATIVE:
          df_raw = final_emission_g_per_kwh / initial_emission_g_per_kwh
      else:
          df_raw = final_emission_g_per_kwh - initial_emission_g_per_kwh
      # Step 3 — extrapolation to the full durability period. Both variants scale
      # by the SAME factor, but a ratio scales around 1 and an offset scales around 0.
      extrapolated = accumulated_hours < family.durability_hours
      scale = family.durability_hours / accumulated_hours   if extrapolated else 1
      if df_method == MULTIPLICATIVE:
          df = 1 + (df_raw - 1) * scale
      else:
          df = df_raw * scale
      df = round_half_up(df, 4)                      # PINNED: df is rounded BEFORE step 4
      # Step 4 — age the DECLARED BASELINE (never the run's initial reading).
      if df_method == MULTIPLICATIVE:
          certified = family.declared_baseline_emission_g_per_kwh * df
      else:
          certified = family.declared_baseline_emission_g_per_kwh + df
      certified = round_half_up(certified, 2)         # PINNED: rounded BEFORE the margin
      # Step 5 — headroom under the family limit, from the ROUNDED certified value.
      margin_pct = round_half_up(
          (family.family_emission_limit_g_per_kwh - certified)
          / family.family_emission_limit_g_per_kwh * 100, 2)
    constants:
      MIN_COMPLIANCE_MARGIN_PCT: 5.00
    precision: "deterioration_factor 4 decimals, certified_emission 2 decimals, compliance_margin_pct 2 decimals, all round_half_up; each step consumes the previous step's ROUNDED value"
    variants:
      - name: MULTIPLICATIVE
        when: "family.emission_standard == EPA_PHASE3"
        difference: "df = final/initial, extrapolated as 1 + (df-1)*scale, applied as baseline * df. With baseline 4.00, initial 5.00, final 6.40, durability 500 h fully accumulated: df 1.2800, certified 5.12, margin 36.00 against an 8.00 limit."
      - name: ADDITIVE
        when: "family.emission_standard == CARB_2024"
        difference: "df = final-initial, extrapolated as df*scale, applied as baseline + df. Same inputs: df 1.4000, certified 5.40, margin 32.50 — a 0.28 g/kWh divergence from MULTIPLICATIVE on identical measurements."

  - name: supplier_defect_ppm
    trigger: "POST /component-lots/{id}/inspect (POOLED written to Supplier.rolling_defect_ppm); GET /suppliers/{id}/scorecard (PER_LOT_AVERAGE computed on read as scorecard_average_ppm)"
    algorithm: aggregation
    input_set: |
      Every ComponentLot of the supplier with status IN {ACCEPTED, REJECTED,
      DEVIATION_ACCEPTED} and sample_size > 0, i.e. inspected lots only. Lots with
      status IN {RECEIVED, QUARANTINED} and SKIP_LOT lots (sample_size == 0) are
      excluded from both variants. A deviation acceptance does NOT remove a lot's
      defects from either aggregate.
    formula: |
      # POOLED (stored, gates the ladder): one ratio over the union of samples.
      pooled = round_half_up(sum(lot.defects_found) / sum(lot.sample_size) * 1_000_000, 0)
      # PER_LOT_AVERAGE (read-only scorecard): mean of already-rounded per-lot rates,
      # in created_at ASC order (order does not change the mean; pinned for auditability).
      per_lot = [ round_half_up(lot.defects_found / lot.sample_size * 1_000_000, 0)
                  for lot in inspected_lots ]
      average = round_half_up(sum(per_lot) / len(per_lot), 0)
    constants:
      PPM_PROBATION_THRESHOLD: 25000
      PPM_SUSPEND_THRESHOLD: 100000
    precision: "integer ppm, round_half_up at every rounding point"
    variants:
      - name: POOLED
        when: "always — this is Supplier.rolling_defect_ppm and the only value the inspection-level ladder and the PROBATION/SUSPENDED transitions read"
        difference: "Weights each lot by its sample size. Lots with samples 40 (0 defects) and 10 (2 defects) pool to 2/50 -> 40000 ppm."
      - name: PER_LOT_AVERAGE
        when: "GET /suppliers/{id}/scorecard only, as scorecard_average_ppm"
        difference: "Weights every lot equally. The same two lots average (0 + 200000)/2 -> 100000 ppm, 2.5x the pooled value, and would cross PPM_SUSPEND_THRESHOLD while the pooled value does not."

  - name: lot_sample_plan
    trigger: "POST /component-lots (sample_size and acceptance_number frozen at receipt)"
    algorithm: tiered_sampling
    input_set: "The lot's own lot_quantity plus the supplier's incoming_inspection_level and criticality AS OF the receipt call. A later ladder move never re-plans an already-received lot."
    formula: |
      level = supplier.incoming_inspection_level      # snapshotted into inspection_level_at_receipt
      if level == SKIP_LOT:   sample_size = 0
      elif level == REDUCED:  sample_size = max(5,  ceil(lot_quantity * 0.02))
      elif level == NORMAL:   sample_size = max(8,  ceil(lot_quantity * 0.05))
      else:                   sample_size = max(13, ceil(lot_quantity * 0.10))   # TIGHTENED
      sample_size = min(sample_size, lot_quantity)
      if supplier.criticality == CRITICAL:            # CASTING suppliers
          acceptance_number = 0
      else:
          acceptance_number = floor(sample_size * 0.10)
    constants:
      REDUCED_FRACTION: 0.02
      NORMAL_FRACTION: 0.05
      TIGHTENED_FRACTION: 0.10
      REDUCED_MIN: 5
      NORMAL_MIN: 8
      TIGHTENED_MIN: 13
      MAJOR_ACCEPTANCE_FRACTION: 0.10
    precision: "integers; ceil on the sample fraction, floor on the acceptance number"

  - name: supplier_inspection_level_ladder
    trigger: "POST /component-lots/{id}/inspect (after supplier_defect_ppm POOLED is recomputed)"
    algorithm: threshold
    input_set: "The supplier's recomputed rolling_defect_ppm and consecutive_accepted_lots. A supplier whose approval_status is already SUSPENDED is skipped entirely — SUSPENDED is terminal."
    formula: |
      if supplier.approval_status == SUSPENDED: return            # terminal, no ladder
      if rolling_defect_ppm > PPM_SUSPEND_THRESHOLD:
          approval_status = SUSPENDED; level = TIGHTENED
      elif rolling_defect_ppm > PPM_PROBATION_THRESHOLD:
          approval_status = PROBATION; level = TIGHTENED
      else:
          approval_status = APPROVED
          if consecutive_accepted_lots >= SKIP_LOT_STREAK:  level = SKIP_LOT
          elif consecutive_accepted_lots >= REDUCED_STREAK: level = REDUCED
          else:                                            level = NORMAL
    constants:
      PPM_PROBATION_THRESHOLD: 25000
      PPM_SUSPEND_THRESHOLD: 100000
      REDUCED_STREAK: 3
      SKIP_LOT_STREAK: 5
    precision: "integer comparisons; both ppm thresholds are STRICT (>), so exactly 25000 ppm keeps a supplier APPROVED"

  - name: process_capability_cpk
    trigger: "POST /machining-runs/{id}/close (writes sample_count, mean_mm, sigma_mm, cpk and forks the run to CLOSED or CAPABILITY_HOLD)"
    algorithm: threshold
    input_set: "The measurements array supplied in the close call only; prior close attempts on the same run are discarded, not pooled."
    formula: |
      n = len(measurements)
      if n < MIN_CAPABILITY_SAMPLE: reject ERR_CAPABILITY_SAMPLE_INSUFFICIENT
      mean  = round_half_up(sum(measurements) / n, 5)
      sigma = round_half_up(sqrt(sum((x - mean)**2 for x in measurements) / (n - 1)), 6)   # n-1 divisor
      if sigma == 0:
          cpk = 9.9999                                   # capped, perfectly centred sample
      else:
          cpk = round_half_up(min(usl_mm - mean, mean - lsl_mm) / (3 * sigma), 4)
      gate = CPK_GATE_CRITICAL if criticality == CRITICAL else CPK_GATE_MAJOR
      status = CLOSED if cpk >= gate else CAPABILITY_HOLD     # INCLUSIVE at the gate
    constants:
      MIN_CAPABILITY_SAMPLE: 5
      CPK_GATE_CRITICAL: 1.33
      CPK_GATE_MAJOR: 1.00
    precision: "mean 5 decimals, sigma 6 decimals, cpk 4 decimals, round_half_up; the gate comparison uses the ROUNDED cpk"

  - name: torque_conformance
    trigger: "POST /engine-units/{id}/torque-record (writes out_of_spec_fastener_count and may set conformance_state NONCONFORMING)"
    algorithm: threshold
    input_set: "The torque_readings array of the call; its length MUST equal the platform's required_fastener_count."
    formula: |
      lower = round_half_up(platform.torque_spec_nm * (1 - platform.torque_tolerance_pct), 2)
      upper = round_half_up(platform.torque_spec_nm * (1 + platform.torque_tolerance_pct), 2)
      out_of_spec_fastener_count = count(r for r in torque_readings
                                        if r.torque_nm < lower or r.torque_nm > upper)   # band INCLUSIVE
      conformance_state = NONCONFORMING if out_of_spec_fastener_count > 0 else unchanged (PENDING)
    constants:
      MAX_REWORK_CYCLES: 2      # bound on the conformance rework cycle that clears these readings
    precision: "band bounds 2 decimals round_half_up; readings compared at 1 decimal; with spec 22.0 Nm and tolerance 0.05 the inclusive band is [20.90, 23.10]"

  - name: hot_test_conformance
    trigger: "POST /engine-units/{id}/hot-test (writes hot_test_emission_threshold and sets conformance_state CONFORMING or NONCONFORMING)"
    algorithm: threshold
    input_set: "The unit's measured_rpm and measured_emission_g_per_kwh, its platform's rpm window, and the certified_emission_g_per_kwh of the family owning that platform."
    formula: |
      multiplier = DEVIATION_EMISSION_MULTIPLIER if unit.deviation_sourced else STANDARD_EMISSION_MULTIPLIER
      hot_test_emission_threshold = round_half_up(family.certified_emission_g_per_kwh * multiplier, 2)
      rpm_ok      = platform.hot_test_min_rpm <= measured_rpm <= platform.hot_test_max_rpm      # INCLUSIVE
      emission_ok = measured_emission_g_per_kwh <= hot_test_emission_threshold                   # INCLUSIVE
      conformance_state = CONFORMING if (rpm_ok and emission_ok) else NONCONFORMING
    constants:
      STANDARD_EMISSION_MULTIPLIER: 1.10
      DEVIATION_EMISSION_MULTIPLIER: 1.00
    precision: "threshold 2 decimals round_half_up; with certified 5.12 the standard threshold is 5.63 and the deviation-sourced threshold is 5.12"

  - name: build_carry_cost
    trigger: "POST /build-orders (writes build_value_cents, carry_weeks, carry_rate, carry_cost_cents, total_committed_cents)"
    algorithm: tiered_pricing
    input_set: "The order's planned_quantity and week_span, its ProductModel.standard_cost_cents and product_line, and the SEASON_START constant for that product line."
    formula: |
      build_value_cents = planned_quantity * model.standard_cost_cents
      # PINNED EVALUATION ORDER (mode (c) circular-looking dependency): the tier is
      # selected from build_value_cents ONLY. total_committed_cents includes the carry
      # cost, but the carry cost NEVER re-selects the tier from that larger total.
      if   build_value_cents <  CARRY_TIER_1_CEILING: carry_rate = CARRY_RATE_SMALL
      elif build_value_cents <  CARRY_TIER_2_CEILING: carry_rate = CARRY_RATE_MEDIUM
      else:                                          carry_rate = CARRY_RATE_LARGE
      if season == PRE_SEASON:
          season_start = SEASON_START[model.product_line]
          carry_weeks = floor((season_start - production_week).days / 7)
      else:
          carry_weeks = 0
      carry_cost_cents = round_half_up(build_value_cents * carry_rate * carry_weeks, 0)
      total_committed_cents = build_value_cents + carry_cost_cents
    constants:
      CARRY_TIER_1_CEILING: 5000000
      CARRY_TIER_2_CEILING: 20000000
      CARRY_RATE_SMALL: 0.0040
      CARRY_RATE_MEDIUM: 0.0030
      CARRY_RATE_LARGE: 0.0020
      SEASON_START_WALK_MOWER: "2027-03-01"
      SEASON_START_RIDING_MOWER: "2027-03-15"
      SEASON_START_SNOW_THROWER: "2026-11-02"
      SEASON_START_GENERATOR: "2027-05-03"
    precision: "whole cents, round_half_up; carry_rate carried at 4 decimals; the tier ceilings are exclusive lower / inclusive upper so 20000000 lands on CARRY_RATE_LARGE"
    variants: []

  - name: channel_allocation_waterfall
    trigger: "POST /build-orders/{id}/allocations/run (writes allocated_dealer_units, allocated_mass_retail_units, unallocated_units, allocation_status, allocation_run_at)"
    algorithm: waterfall_allocation
    input_set: "The pool is exactly BuildOrder.built_quantity — EngineUnits with build_state == RELEASED. STAGED/ASSEMBLED/HOT_TESTED/CANCELLED units and units of other orders are excluded."
    formula: |
      pool = build_order.built_quantity
      if pool == 0: reject ERR_NO_ALLOCATABLE_UNITS
      # Step 1 — PINNED ROUNDING ORDER (mode (b)): floor both raw shares, then hand the
      # single remaining unit to the larger fractional part. Ties go to DEALER by bucket
      # priority — never by entity id.
      raw_dealer = pool * model.dealer_share_pct
      raw_mass   = pool * (1 - model.dealer_share_pct)
      dealer = floor(raw_dealer); mass = floor(raw_mass)
      remainder = pool - dealer - mass                       # 0 or 1
      if remainder == 1:
          if (raw_dealer - dealer) >= (raw_mass - mass): dealer += 1     # >= : DEALER wins ties
          else:                                         mass   += 1
      # Step 2 — mass-retail cap first; its overflow SPILLS to dealer.
      if mass > model.mass_retail_cap_units:
          dealer += mass - model.mass_retail_cap_units
          mass = model.mass_retail_cap_units
      # Step 3 — dealer cap last; its excess is HELD BACK, not spilled.
      unallocated = 0
      if dealer > model.dealer_cap_units:
          unallocated = dealer - model.dealer_cap_units
          dealer = model.dealer_cap_units
      # Invariant: dealer + mass + unallocated == build_order.built_quantity
    constants: {}
    precision: "whole units; floor on both raw shares; remainder distribution is exactly one unit for a two-bucket split"

  - name: build_order_progress
    trigger: "POST /engine-units, POST /engine-units/{id}/release, POST /engine-units/{id}/cancel (writes BuildOrder.staged_quantity, built_quantity and may auto-COMPLETE the order)"
    algorithm: aggregation
    input_set: "EngineUnits of the order: staged_quantity counts build_state IN {STAGED, ASSEMBLED, HOT_TESTED}; built_quantity counts build_state == RELEASED; build_state == CANCELLED counts toward neither."
    formula: |
      staged_quantity = count(units where build_state IN {STAGED, ASSEMBLED, HOT_TESTED})
      built_quantity  = count(units where build_state == RELEASED)
      if built_quantity == planned_quantity: status = COMPLETED
      # Capacity guard on POST /engine-units:
      #   staged_quantity + built_quantity + 1 > planned_quantity -> ERR_BUILD_ORDER_QUANTITY_EXCEEDED
    constants: {}
    precision: "integer counts"

  - name: audit_outcome_evaluation
    trigger: "POST /build-orders/{id}/line-audits (writes required_sample_size); POST /line-audits/{id}/record (writes failure_rate, failure_reason, status)"
    algorithm: threshold
    input_set: "At schedule time, BuildOrder.built_quantity. At record time, the units_tested / units_failed / max_measured_emission_g_per_kwh of the call and the family_emission_limit_g_per_kwh of the audit's snapshotted certification_family_id."
    formula: |
      # schedule
      required_sample_size = max(MIN_AUDIT_SAMPLE,
                                 ceil(build_order.built_quantity * AUDIT_SAMPLE_FRACTION))
      # record
      failure_rate = round_half_up(units_failed / units_tested, 4)
      emission_breach = max_measured_emission_g_per_kwh > family.family_emission_limit_g_per_kwh
      rate_breach     = failure_rate > AUDIT_MAX_FAILURE_RATE          # STRICT: 0.2500 passes
      if emission_breach: status = FAILED; failure_reason = EMISSION_LIMIT_EXCEEDED   # outranks
      elif rate_breach:   status = FAILED; failure_reason = FAILURE_RATE_EXCEEDED
      else:               status = PASSED; failure_reason = null
    constants:
      MIN_AUDIT_SAMPLE: 2
      AUDIT_SAMPLE_FRACTION: 0.02
      AUDIT_MAX_FAILURE_RATE: 0.25
      AUDIT_FAILURE_SUSPEND_COUNT: 2
    precision: "failure_rate 4 decimals round_half_up; the rate gate is STRICT so 1 failure in 4 tested (0.2500) PASSES and 2 in 4 (0.5000) FAILS"

  - name: platform_certification_posture
    trigger: "POST /durability-tests, POST /certification-families/{id}/certify, POST /line-audits/{id}/record (recomputes EnginePlatform.certification_posture for every platform of the family)"
    algorithm: projection
    input_set: "The owning CertificationFamily.status only — the posture is a pure projection with no independent state."
    formula: |
      DRAFT                                              -> PENDING
      DURABILITY_TESTING | DURABILITY_COMPLETE | SUBMITTED | AUDIT_HOLD -> RESTRICTED
      CERTIFIED                                          -> OPEN
      SUSPENDED                                          -> FROZEN
      # BuildOrder release requires posture == OPEN, else ERR_FAMILY_NOT_CERTIFIED
    constants: {}
    precision: "enum projection; recomputed inside the same request that changes the family's status (consistency_model immediate)"

  - name: safety_certification_result
    trigger: "POST /safety-certifications (writes SafetyCertification.result)"
    algorithm: threshold
    input_set: "The blade_stop_time_ms and opc_stop_time_ms of the call; the required standard_code and blade nullability come from the model's product_line."
    formula: |
      blade_ok = blade_stop_time_ms IS NULL or blade_stop_time_ms <= MAX_BLADE_STOP_MS   # INCLUSIVE
      opc_ok   = opc_stop_time_ms <= MAX_OPC_STOP_MS                                    # INCLUSIVE
      result = PASSED if (blade_ok and opc_ok) else FAILED
      # Model release selects the LATEST certification by tested_on DESC, created_at DESC
      # among rows with result == PASSED, then requires expires_on >= clock date (INCLUSIVE).
    constants:
      MAX_BLADE_STOP_MS: 3000
      MAX_OPC_STOP_MS: 1000
    precision: "integer milliseconds; both bounds inclusive, so exactly 3000 ms / 1000 ms PASS"

  - name: parts_fill_rate_and_promise
    trigger: "POST /parts-requests, POST /service-parts/{id}/supersede (writes ServicePart counters and fill_rate_pct, and PartsFulfillmentRequest.promised_ship_date)"
    algorithm: aggregation
    input_set: "PartsFulfillmentRequests whose shipped_from_part_id (for FILLED and SUBSTITUTED) or service_part_id (for BACKORDERED) is this part. A part with no requests at all has fill_rate_pct == null, not 0.00."
    formula: |
      served = filled_request_count + substituted_request_count
      total  = served + backordered_request_count
      fill_rate_pct = null if total == 0 else round_half_up(served / total * 100, 2)
      # promised ship date, from the logical clock's DATE component
      if status == FILLED or status == SUBSTITUTED:
          lead = part.dealer_lead_time_days if channel == DEALER else part.mass_retail_lead_time_days
      else:                       # BACKORDERED
          lead = BACKORDER_PROMISE_DAYS
      promised_ship_date = clock_date + lead days
    constants:
      BACKORDER_PROMISE_DAYS: 21
    precision: "fill_rate_pct 2 decimals round_half_up (2 served of 3 -> 66.67); promised_ship_date is a calendar date, no weekend/holiday adjustment"

  - name: supersession_chain_resolution
    trigger: "POST /service-parts/{id}/supersede (validates the chain, then substitutes backorders and recomputes both parts' fill rates)"
    algorithm: topological
    input_set: "The supersession chain reachable from the successor by following superseded_by_part_id, plus this part's PartsFulfillmentRequests with status == BACKORDERED."
    formula: |
      # Step 1 — cycle detection: walk successor -> superseded_by_part_id ... ; if the walk
      # reaches part.id (or successor_part_id == part.id) reject ERR_SUPERSESSION_CYCLE.
      # Step 2 — depth: 1 + length of the successor's existing chain; > MAX_SUPERSESSION_DEPTH
      #          rejects with ERR_SUPERSESSION_CYCLE.
      # Step 3 — backorder substitution, in created_at ASC order (never by id):
      for req in backordered_requests_of(part) ordered by created_at ASC:
          if successor.on_hand_qty >= req.requested_quantity:
              req.status = SUBSTITUTED; req.shipped_from_part_id = successor.id
              req.promised_ship_date = clock_date + successor lead time for req.channel
              successor.on_hand_qty -= req.requested_quantity
          else:
              leave BACKORDERED (no partial fills; later smaller requests are NOT skipped ahead)
      # Step 4 — recompute counters and fill_rate_pct on BOTH parts.
    constants:
      MAX_SUPERSESSION_DEPTH: 5
    precision: "integer quantities; substitution order is created_at ASC with no id fallback; a request that does not fit is skipped without blocking the remaining requests"

# =============================================================================
# §1.4 Validation Rules Table (evaluated in ascending priority; the FIRST
# violated row decides the response — later rows are never reported)
# =============================================================================
validations:

  # ---- 1-2 authentication / authorization -----------------------------------
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present, and X-User-Role is one of the six §1.7 roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "the acting role appears in the endpoint's roles list"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  # ---- 3 request shape ------------------------------------------------------
  - priority: 3
    category: business_constraint
    check: |
      Request body / query schema: required fields present, types correct, enum members known,
      numbers inside their declared range, dates ISO-formatted. Also covers:
      production_week and audit_week fall on a Monday; scheduled_end_at > scheduled_start_at;
      expires_on > tested_on; usl_mm > lsl_mm; hot_test_max_rpm > hot_test_min_rpm;
      displacement_max_cc >= displacement_min_cc; msrp_cents >= standard_cost_cents;
      defects_found <= lot.sample_size; units_failed <= units_tested;
      pagination limit inside 1..100 and offset >= 0.
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

  # ---- 4-15 existence: path ids left-to-right, then body FKs ---------------
  - priority: 4
    category: existence
    check: "certification family referenced by path {id} or by body certification_family_id exists"
    error_id: ERR_CERTIFICATION_FAMILY_NOT_FOUND
    http_status: 404
    applies_to: "POST /certification-families/{id}/submit, POST /certification-families/{id}/certify, GET /certification-families/{id}, GET /certification-families/{id}/engine-platforms, POST /engine-platforms, POST /durability-tests"
  - priority: 5
    category: existence
    check: "engine platform referenced by path {id} or by body engine_platform_id exists"
    error_id: ERR_ENGINE_PLATFORM_NOT_FOUND
    http_status: 404
    applies_to: "GET /engine-platforms/{id}, GET /engine-platforms/{id}/product-models, POST /durability-tests, POST /product-models, POST /machining-runs, POST /service-parts"
  - priority: 6
    category: existence
    check: "durability test run referenced by path {id} exists"
    error_id: ERR_DURABILITY_TEST_NOT_FOUND
    http_status: 404
    applies_to: "GET /durability-tests/{id}, POST /durability-tests/{id}/complete"
  - priority: 7
    category: existence
    check: "product model referenced by path {id} or by body product_model_id exists"
    error_id: ERR_PRODUCT_MODEL_NOT_FOUND
    http_status: 404
    applies_to: "GET /product-models/{id}, GET /product-models/{id}/safety-certifications, POST /product-models/{id}/release, POST /safety-certifications, POST /build-orders"
  - priority: 8
    category: existence
    check: "supplier referenced by path {id} or by body supplier_id exists"
    error_id: ERR_SUPPLIER_NOT_FOUND
    http_status: 404
    applies_to: "GET /suppliers/{id}/scorecard, POST /component-lots"
  - priority: 9
    category: existence
    check: "component lot referenced by path {id} or by body casting_lot_id / carburetor_lot_id / ignition_lot_id exists"
    error_id: ERR_COMPONENT_LOT_NOT_FOUND
    http_status: 404
    applies_to: "GET /component-lots/{id}, POST /component-lots/{id}/inspect, POST /component-lots/{id}/deviation-accept, POST /machining-runs, POST /engine-units"
  - priority: 10
    category: existence
    check: "machining run referenced by path {id} or by body machining_run_id exists"
    error_id: ERR_MACHINING_RUN_NOT_FOUND
    http_status: 404
    applies_to: "GET /machining-runs/{id}, POST /machining-runs/{id}/close, POST /engine-units"
  - priority: 11
    category: existence
    check: "assembly line referenced by body assembly_line_id exists"
    error_id: ERR_ASSEMBLY_LINE_NOT_FOUND
    http_status: 404
    applies_to: "POST /build-orders"
  - priority: 12
    category: existence
    check: "build order referenced by path {id} or by body build_order_id exists"
    error_id: ERR_BUILD_ORDER_NOT_FOUND
    http_status: 404
    applies_to: "GET /build-orders/{id}, POST /build-orders/{id}/release, POST /build-orders/{id}/allocations/run, POST /build-orders/{id}/allocations/reset, POST /build-orders/{id}/line-audits, GET /build-orders/{id}/line-audits, POST /engine-units"
  - priority: 13
    category: existence
    check: "engine unit referenced by path {id} exists"
    error_id: ERR_ENGINE_UNIT_NOT_FOUND
    http_status: 404
    applies_to: "GET /engine-units/{id}, POST /engine-units/{id}/torque-record, POST /engine-units/{id}/hot-test, POST /engine-units/{id}/release, POST /engine-units/{id}/rework, POST /engine-units/{id}/cancel"
  - priority: 14
    category: existence
    check: "production line audit referenced by path {id} exists"
    error_id: ERR_LINE_AUDIT_NOT_FOUND
    http_status: 404
    applies_to: "POST /line-audits/{id}/record"
  - priority: 15
    category: existence
    check: "service part referenced by path {id} or by body successor_part_id / service_part_id exists"
    error_id: ERR_SERVICE_PART_NOT_FOUND
    http_status: 404
    applies_to: "GET /service-parts/{id}, GET /service-parts/{id}/requests, POST /service-parts/{id}/supersede, POST /service-parts/{id}/obsolete, POST /parts-requests"

  # ---- 16 uniqueness --------------------------------------------------------
  - priority: 16
    category: business_referential
    check: "code uniqueness: family_code, platform_code, model_code, supplier_code, line_code, part_number and serial_number are globally unique; lot_code is unique within its supplier_id"
    error_id: ERR_DUPLICATE_CODE
    http_status: 409
    applies_to: "POST /certification-families, POST /engine-platforms, POST /product-models, POST /suppliers, POST /assembly-lines, POST /component-lots, POST /service-parts, POST /engine-units"

  # ---- 17-18 optimistic concurrency ----------------------------------------
  - priority: 17
    category: state
    check: "expected_certification_family_version == certification_family.version (concurrency_rules[durability-create-stale-family])"
    error_id: ERR_STALE_FAMILY_VERSION
    http_status: 412
    applies_to: "POST /durability-tests"
  - priority: 18
    category: state
    check: "expected_build_order_version == build_order.version (concurrency_rules[allocation-run-stale-build-order])"
    error_id: ERR_STALE_BUILD_ORDER_VERSION
    http_status: 412
    applies_to: "POST /build-orders/{id}/allocations/run"

  # ---- 19-29 target state preconditions ------------------------------------
  - priority: 19
    category: state
    check: "family status fits the operation: IN {DRAFT, DURABILITY_TESTING, AUDIT_HOLD} for POST /durability-tests, == DURABILITY_COMPLETE for submit, == SUBMITTED for certify"
    error_id: ERR_FAMILY_STATE_INVALID
    http_status: 409
    applies_to: "POST /durability-tests, POST /certification-families/{id}/submit, POST /certification-families/{id}/certify"
  - priority: 20
    category: state
    check: "durability run status == SCHEDULED"
    error_id: ERR_DURABILITY_TEST_STATE_INVALID
    http_status: 409
    applies_to: "POST /durability-tests/{id}/complete"
  - priority: 21
    category: state
    check: "lot status == RECEIVED for inspect; lot status IN {REJECTED, QUARANTINED} for deviation-accept"
    error_id: ERR_LOT_STATE_INVALID
    http_status: 409
    applies_to: "POST /component-lots/{id}/inspect, POST /component-lots/{id}/deviation-accept"
  - priority: 22
    category: state
    check: "machining run status IN {OPEN, CAPABILITY_HOLD} (a CLOSED run cannot be re-closed)"
    error_id: ERR_MACHINING_RUN_STATE_INVALID
    http_status: 409
    applies_to: "POST /machining-runs/{id}/close"
  - priority: 23
    category: state
    check: "model status IN {DRAFT, SUSPENDED} for release; model status == RELEASED when a build order is created against it"
    error_id: ERR_MODEL_STATE_INVALID
    http_status: 409
    applies_to: "POST /product-models/{id}/release, POST /build-orders"
  - priority: 24
    category: state
    check: "build order status == PLANNED"
    error_id: ERR_BUILD_ORDER_NOT_PLANNED
    http_status: 409
    applies_to: "POST /build-orders/{id}/release"
  - priority: 25
    category: state
    check: "build order status IN {RELEASED, IN_PRODUCTION} when staging a unit; a HELD or COMPLETED order refuses new units"
    error_id: ERR_BUILD_ORDER_NOT_ACCEPTING_UNITS
    http_status: 409
    applies_to: "POST /engine-units"
  - priority: 26
    category: state
    check: "unit build_state fits the action: STAGED for torque-record, ASSEMBLED for hot-test, HOT_TESTED for release, IN {ASSEMBLED, HOT_TESTED} for rework, IN {STAGED, ASSEMBLED, HOT_TESTED} for cancel"
    error_id: ERR_UNIT_STATE_INVALID
    http_status: 409
    applies_to: "POST /engine-units/{id}/torque-record, POST /engine-units/{id}/hot-test, POST /engine-units/{id}/release, POST /engine-units/{id}/rework, POST /engine-units/{id}/cancel"
  - priority: 27
    category: state
    check: "audit status == SCHEDULED (a PASSED or FAILED audit cannot be re-recorded)"
    error_id: ERR_AUDIT_STATE_INVALID
    http_status: 409
    applies_to: "POST /line-audits/{id}/record"
  - priority: 28
    category: state
    check: "the build order has no ProductionLineAudit with status == SCHEDULED"
    error_id: ERR_AUDIT_ALREADY_OPEN
    http_status: 409
    applies_to: "POST /build-orders/{id}/line-audits"
  - priority: 29
    category: state
    check: "part status == ACTIVE for supersede and for a new fulfillment request; IN {ACTIVE, SUPERSEDED} for obsolete; the successor part status == ACTIVE"
    error_id: ERR_PART_STATE_INVALID
    http_status: 409
    applies_to: "POST /service-parts/{id}/supersede, POST /service-parts/{id}/obsolete, POST /parts-requests"

  # ---- 30 segregation of duties -------------------------------------------
  - priority: 30
    category: auth
    check: "X-User-ID != certification_family.submitted_by_user_id on certify; X-User-ID != component_lot.inspected_by_user_id on deviation-accept"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /certification-families/{id}/certify, POST /component-lots/{id}/deviation-accept"

  # ---- 31-43 safety / compliance ------------------------------------------
  - priority: 31
    category: business_safety
    check: "supplier.approval_status != SUSPENDED"
    error_id: ERR_SUPPLIER_SUSPENDED
    http_status: 409
    applies_to: "POST /component-lots"
  - priority: 32
    category: business_safety
    check: "standard_code matches the model's product_line: WALK_MOWER and RIDING_MOWER -> ANSI_B71_1, SNOW_THROWER -> ANSI_B71_3, GENERATOR -> UL_2201"
    error_id: ERR_SAFETY_STANDARD_MISMATCH
    http_status: 422
    applies_to: "POST /safety-certifications"
  - priority: 33
    category: business_safety
    check: |
      Control configuration coherence. On POST /product-models: operator_presence_type must be
      BAIL for WALK_MOWER, SEAT_SWITCH for RIDING_MOWER, TWO_HAND for SNOW_THROWER, CO_SHUTOFF for
      GENERATOR; blade_brake_type must be NONE for GENERATOR and IN {BLADE_BRAKE_CLUTCH, ENGINE_KILL}
      otherwise; warranty_months >= 36 when channel IN {DEALER, DUAL} and >= 24 when MASS_RETAIL.
      On POST /safety-certifications: blade_stop_time_ms must be null for a GENERATOR model and
      non-null for every other product_line.
    error_id: ERR_SAFETY_CONTROL_REQUIRED
    http_status: 422
    applies_to: "POST /product-models, POST /safety-certifications"
  - priority: 34
    category: business_safety
    check: "the model has a SafetyCertification with result == PASSED (latest by tested_on DESC, created_at DESC)"
    error_id: ERR_SAFETY_CERTIFICATION_MISSING
    http_status: 409
    applies_to: "POST /product-models/{id}/release, POST /build-orders/{id}/release"
  - priority: 35
    category: business_safety
    check: "that latest PASSED certification has expires_on >= the logical clock's date (inclusive)"
    error_id: ERR_SAFETY_CERTIFICATION_EXPIRED
    http_status: 409
    applies_to: "POST /product-models/{id}/release, POST /build-orders/{id}/release"
  - priority: 36
    category: business_safety
    check: "family.certified_emission_g_per_kwh <= family.family_emission_limit_g_per_kwh"
    error_id: ERR_CERTIFIED_EMISSION_EXCEEDS_LIMIT
    http_status: 422
    applies_to: "POST /certification-families/{id}/certify"
  - priority: 37
    category: business_safety
    check: "family.compliance_margin_pct >= MIN_COMPLIANCE_MARGIN_PCT (5.00)"
    error_id: ERR_COMPLIANCE_MARGIN_TOO_LOW
    http_status: 422
    applies_to: "POST /certification-families/{id}/certify"
  - priority: 38
    category: business_safety
    check: "len(measurements) >= MIN_CAPABILITY_SAMPLE (5)"
    error_id: ERR_CAPABILITY_SAMPLE_INSUFFICIENT
    http_status: 422
    applies_to: "POST /machining-runs/{id}/close"
  - priority: 39
    category: business_safety
    check: "machining_run.status == CLOSED"
    error_id: ERR_MACHINING_RUN_NOT_CLOSED
    http_status: 409
    applies_to: "POST /engine-units"
  - priority: 40
    category: business_safety
    check: "each consumed lot has status IN {ACCEPTED, DEVIATION_ACCEPTED}; a RECEIVED, REJECTED or QUARANTINED lot may not feed the line"
    error_id: ERR_COMPONENT_LOT_NOT_RELEASABLE
    http_status: 409
    applies_to: "POST /engine-units, POST /machining-runs"
  - priority: 41
    category: business_safety
    check: "unit.conformance_state == PENDING for hot-test, == CONFORMING for release, == NONCONFORMING for rework; a QUARANTINED unit is refused by all three"
    error_id: ERR_UNIT_NONCONFORMING
    http_status: 409
    applies_to: "POST /engine-units/{id}/hot-test, POST /engine-units/{id}/release, POST /engine-units/{id}/rework"
  - priority: 42
    category: business_safety
    check: "assembly_line.status == RUNNING"
    error_id: ERR_ASSEMBLY_LINE_DOWN
    http_status: 409
    applies_to: "POST /build-orders/{id}/release"

  # ---- 43-49 referential coherence ----------------------------------------
  - priority: 43
    category: business_referential
    check: "engine_platform.certification_posture == OPEN (i.e. the owning family is CERTIFIED)"
    error_id: ERR_FAMILY_NOT_CERTIFIED
    http_status: 409
    applies_to: "POST /build-orders/{id}/release"
  - priority: 44
    category: business_referential
    check: |
      Platform coherence: durability run's engine_platform belongs to the body's certification_family;
      the machining run's engine_platform_id equals the unit's build order model's engine_platform_id;
      a successor service part shares the engine_platform_id of the part it supersedes.
    error_id: ERR_PLATFORM_MISMATCH
    http_status: 409
    applies_to: "POST /durability-tests, POST /engine-units, POST /service-parts/{id}/supersede"
  - priority: 45
    category: business_referential
    check: "carburetor_lot_id resolves to a CARBURETOR lot, ignition_lot_id to an IGNITION lot, casting_lot_id to a CASTING lot"
    error_id: ERR_COMPONENT_CATEGORY_MISMATCH
    http_status: 422
    applies_to: "POST /engine-units, POST /machining-runs"
  - priority: 46
    category: business_referential
    check: "family.displacement_min_cc <= platform.displacement_cc <= family.displacement_max_cc"
    error_id: ERR_DISPLACEMENT_OUT_OF_FAMILY
    http_status: 422
    applies_to: "POST /engine-platforms"
  - priority: 47
    category: business_referential
    check: "dealer_share_pct == 1.00 when channel == DEALER, == 0.00 when channel == MASS_RETAIL, strictly between 0.00 and 1.00 when channel == DUAL"
    error_id: ERR_CHANNEL_SHARE_MISMATCH
    http_status: 422
    applies_to: "POST /product-models"
  - priority: 48
    category: business_referential
    check: "successor_part_id != {id}, the successor's chain does not lead back to {id}, and the resulting chain depth <= MAX_SUPERSESSION_DEPTH (5)"
    error_id: ERR_SUPERSESSION_CYCLE
    http_status: 409
    applies_to: "POST /service-parts/{id}/supersede"
  - priority: 49
    category: business_referential
    check: "the model's product_line appears in assembly_line.supported_product_lines"
    error_id: ERR_LINE_PRODUCT_LINE_UNSUPPORTED
    http_status: 422
    applies_to: "POST /build-orders"

  # ---- 50-53 temporal ------------------------------------------------------
  - priority: 50
    category: business_temporal
    check: "no DurabilityTestRun with status IN {SCHEDULED, COMPLETED} on the same engine_platform_id overlaps the half-open window [scheduled_start_at, scheduled_end_at); touching windows are allowed"
    error_id: ERR_PLATFORM_TEST_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /durability-tests"
  - priority: 51
    category: business_temporal
    check: "no other BuildOrder with status IN {PLANNED, RELEASED, IN_PRODUCTION} on the same assembly_line and a DIFFERENT product_line occupies a week within changeover_gap_weeks of any week this order occupies"
    error_id: ERR_LINE_CHANGEOVER_CONFLICT
    http_status: 409
    applies_to: "POST /build-orders"
  - priority: 52
    category: business_temporal
    check: "PRE_SEASON requires production_week < SEASON_START[product_line]; IN_SEASON requires production_week >= SEASON_START[product_line]"
    error_id: ERR_SEASON_WINDOW_MISMATCH
    http_status: 422
    applies_to: "POST /build-orders"
  - priority: 53
    category: business_temporal
    check: "the logical clock's year > part.commitment_expires_year (last_production_year + committed_availability_years)"
    error_id: ERR_AVAILABILITY_COMMITMENT_ACTIVE
    http_status: 409
    applies_to: "POST /service-parts/{id}/obsolete"

  # ---- 54-58 constraint satisfaction --------------------------------------
  - priority: 54
    category: business_constraint
    check: "len(torque_readings) == platform.required_fastener_count, exactly"
    error_id: ERR_TORQUE_READING_COUNT_MISMATCH
    http_status: 422
    applies_to: "POST /engine-units/{id}/torque-record"
  - priority: 55
    category: business_constraint
    check: "unit.rework_count < MAX_REWORK_CYCLES (2)"
    error_id: ERR_REWORK_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "POST /engine-units/{id}/rework"
  - priority: 56
    category: business_constraint
    check: "units_tested >= audit.required_sample_size"
    error_id: ERR_AUDIT_SAMPLE_TOO_SMALL
    http_status: 422
    applies_to: "POST /line-audits/{id}/record"
  - priority: 57
    category: business_constraint
    check: "units_tested <= build_order.built_quantity"
    error_id: ERR_AUDIT_SAMPLE_EXCEEDS_POPULATION
    http_status: 422
    applies_to: "POST /line-audits/{id}/record"
  - priority: 58
    category: business_constraint
    check: "part.backordered_request_count == 0"
    error_id: ERR_OPEN_BACKORDERS_EXIST
    http_status: 409
    applies_to: "POST /service-parts/{id}/obsolete"

  # ---- 59-62 capacity / quota (fiscal checks last) ------------------------
  - priority: 59
    category: business_fiscal
    check: "for every week this order occupies, the aggregate per-week load — ceil(planned_quantity / week_span) summed over orders with status IN {PLANNED, RELEASED, IN_PRODUCTION} on that line and week — is <= assembly_line.weekly_capacity_units"
    error_id: ERR_LINE_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /build-orders"
  - priority: 60
    category: business_fiscal
    check: "build_order.staged_quantity + build_order.built_quantity + 1 <= build_order.planned_quantity"
    error_id: ERR_BUILD_ORDER_QUANTITY_EXCEEDED
    http_status: 409
    applies_to: "POST /engine-units"
  - priority: 61
    category: business_fiscal
    check: "each consumed lot has remaining_qty >= 1"
    error_id: ERR_COMPONENT_LOT_DEPLETED
    http_status: 409
    applies_to: "POST /engine-units"
  - priority: 62
    category: business_fiscal
    check: "build_order.built_quantity >= 1 (an order with an empty released pool has nothing to allocate)"
    error_id: ERR_NO_ALLOCATABLE_UNITS
    http_status: 422
    applies_to: "POST /build-orders/{id}/allocations/run"

# =============================================================================
# §1.5 API Endpoint Table (54 endpoints; api_prefix is "", so every path below
# is absolute). All list endpoints accept limit?/offset? and return the
# pagination fields declared in response_envelope.
# =============================================================================
endpoints:

  # ---- logical clock (test-driving endpoint) --------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Sets the server's logical UTC clock. Before any call the clock reads exactly 2026-08-01T00:00:00Z and MUST NOT fall back to wall-clock time; every expiry, promise date, carry-week and season comparison in this scaffold reads this clock."
    roles: [PlantAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["logical clock repositioned; no entity is mutated"]

  # ---- emission certification families -------------------------------------
  - method: POST
    path: "/certification-families"
    description: "Declares an emission certification family (engine family designation, displacement band, durability period, family limit and declared production baseline)."
    roles: [CertificationEngineer]
    code: 201
    input: [family_code, model_year, emission_standard, displacement_min_cc, displacement_max_cc, durability_hours, family_emission_limit_g_per_kwh, declared_baseline_emission_g_per_kwh]
    output: CertificationFamily
    side_effects: ["family created with status DRAFT, cumulative_audit_failures 0, version 1"]
  - method: GET
    path: "/certification-families/{id}"
    description: "Reads one certification family including its computed deterioration factor, certified emission, compliance margin and version."
    roles: [PlantAdmin, CertificationEngineer, ComplianceOfficer, QualityEngineer, ProductionPlanner]
    code: 200
    input: []
    output: CertificationFamily
    side_effects: []
  - method: GET
    path: "/certification-families/{id}/engine-platforms"
    description: "Lists the engine platforms certified under this family (FK reverse-reachability for EnginePlatform.certification_family_id)."
    roles: [PlantAdmin, CertificationEngineer, ComplianceOfficer, QualityEngineer, ProductionPlanner]
    code: 200
    input: ["limit?", "offset?"]
    output: EnginePlatform[]
    side_effects: []
  - method: POST
    path: "/certification-families/{id}/submit"
    description: "Submits a family whose durability testing is complete for certification review."
    roles: [CertificationEngineer]
    code: 200
    input: []
    output: CertificationFamily
    side_effects: ["status DURABILITY_COMPLETE -> SUBMITTED", "submitted_by_user_id = X-User-ID (segregation-of-duties comparand)"]
  - method: POST
    path: "/certification-families/{id}/certify"
    description: "Certifies a submitted family. Enforces segregation of duties against the submitter, the family emission limit and the minimum compliance margin, and compensates any hold imposed by an earlier production line audit failure."
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: CertificationFamily
    side_effects:
      - "status SUBMITTED -> CERTIFIED; certified_by_user_id = X-User-ID; certified_at = clock"
      - "recompute EnginePlatform.certification_posture -> OPEN for every platform of the family"
      - "COMPENSATION: HELD BuildOrders restored to status_before_hold; their QUARANTINED EngineUnits return to conformance_state PENDING"
      - "allocation counters are NOT restored; SUSPENDED ProductModels are NOT auto-released"
  - method: POST
    path: "/engine-platforms"
    description: "Creates a shared engine platform under a family, with its torque specification and hot-test speed window."
    roles: [PlantAdmin]
    code: 201
    input: [certification_family_id, platform_code, displacement_cc, torque_spec_nm, torque_tolerance_pct, required_fastener_count, hot_test_min_rpm, hot_test_max_rpm]
    output: EnginePlatform
    side_effects: ["certification_posture initialised by projection from the family's current status"]
  - method: GET
    path: "/engine-platforms/{id}"
    description: "Reads one engine platform including its derived certification_posture."
    roles: [PlantAdmin, CertificationEngineer, ComplianceOfficer, QualityEngineer, ProductionPlanner]
    code: 200
    input: []
    output: EnginePlatform
    side_effects: []
  - method: GET
    path: "/engine-platforms/{id}/product-models"
    description: "Lists the finished-goods models built on this platform (FK reverse-reachability for ProductModel.engine_platform_id)."
    roles: [PlantAdmin, CertificationEngineer, ComplianceOfficer, QualityEngineer, ProductionPlanner]
    code: 200
    input: ["limit?", "offset?"]
    output: ProductModel[]
    side_effects: []

  # ---- durability testing ---------------------------------------------------
  - method: POST
    path: "/durability-tests"
    description: "Schedules a durability test run, occupying the platform over the half-open window [scheduled_start_at, scheduled_end_at). Guarded by OCC on the family's version because a new run supersedes the family's prior deterioration basis."
    roles: [CertificationEngineer]
    code: 201
    input: [certification_family_id, engine_platform_id, scheduled_start_at, scheduled_end_at, target_hours, initial_emission_g_per_kwh, expected_certification_family_version]
    output: DurabilityTestRun
    side_effects:
      - "run created with status SCHEDULED and df_method projected from family.emission_standard"
      - "family.status -> DURABILITY_TESTING (from DRAFT or AUDIT_HOLD; already-testing families stay DURABILITY_TESTING and may carry several SCHEDULED runs)"
      - "increments CertificationFamily.version by 1"
      - "recompute EnginePlatform.certification_posture -> RESTRICTED for every platform of the family"
  - method: GET
    path: "/durability-tests/{id}"
    description: "Reads one durability test run including its computed deterioration factor and extrapolation flag."
    roles: [PlantAdmin, CertificationEngineer, ComplianceOfficer, QualityEngineer, ProductionPlanner]
    code: 200
    input: []
    output: DurabilityTestRun
    side_effects: []
  - method: GET
    path: "/durability-tests"
    description: "Lists durability test runs, filterable by family, platform and status (FK reverse-reachability for both of DurabilityTestRun's FKs)."
    roles: [PlantAdmin, CertificationEngineer, ComplianceOfficer, QualityEngineer, ProductionPlanner]
    code: 200
    input: ["certification_family_id?", "engine_platform_id?", "status?", "limit?", "offset?"]
    output: DurabilityTestRun[]
    side_effects: []
  - method: POST
    path: "/durability-tests/{id}/complete"
    description: "Closes a durability run with its accumulated hours and final emission reading, computing the deterioration factor (extrapolated when the run fell short of the family's durability period) and the family's certified emission and compliance margin."
    roles: [CertificationEngineer]
    code: 200
    input: [accumulated_hours, final_emission_g_per_kwh]
    output: DurabilityTestRun
    side_effects:
      - "run status SCHEDULED -> COMPLETED; completed_at = clock; computed_deterioration_factor and extrapolated written"
      - "family.deterioration_factor / certified_emission_g_per_kwh / compliance_margin_pct recomputed (calculations.deterioration_factor_and_certified_emission)"
      - "family.status -> DURABILITY_COMPLETE"

  # ---- product models and safety -------------------------------------------
  - method: POST
    path: "/product-models"
    description: "Creates a finished-goods model on a shared engine platform, pinning its channel differentiation (dealer share, channel caps, warranty) and its blade-brake / operator-presence configuration."
    roles: [PlantAdmin]
    code: 201
    input: [engine_platform_id, model_code, product_line, channel, blade_brake_type, operator_presence_type, warranty_months, standard_cost_cents, msrp_cents, dealer_share_pct, dealer_cap_units, mass_retail_cap_units]
    output: ProductModel
    side_effects: ["model created with status DRAFT"]
  - method: GET
    path: "/product-models/{id}"
    description: "Reads one product model."
    roles: [PlantAdmin, CertificationEngineer, ComplianceOfficer, QualityEngineer, ProductionPlanner]
    code: 200
    input: []
    output: ProductModel
    side_effects: []
  - method: GET
    path: "/product-models/{id}/safety-certifications"
    description: "Lists the safety certifications recorded for this model, newest tested_on first (FK reverse-reachability for SafetyCertification.product_model_id)."
    roles: [PlantAdmin, CertificationEngineer, ComplianceOfficer, QualityEngineer, ProductionPlanner]
    code: 200
    input: ["limit?", "offset?"]
    output: SafetyCertification[]
    side_effects: []
  - method: POST
    path: "/safety-certifications"
    description: "Records an immutable blade-brake / operator-presence bench test against a model under the standard its product line requires."
    roles: [ComplianceOfficer]
    code: 201
    input: [product_model_id, standard_code, "blade_stop_time_ms?", opc_stop_time_ms, tested_on, expires_on]
    output: SafetyCertification
    side_effects: ["result computed PASSED/FAILED (calculations.safety_certification_result); tested_by_user_id = X-User-ID; row is immutable — no update endpoint exists"]
  - method: POST
    path: "/product-models/{id}/release"
    description: "Releases a model for production, requiring a currently valid PASSED safety certification. Also the re-release path for a model suspended by a production line audit failure."
    roles: [PlantAdmin]
    code: 200
    input: []
    output: ProductModel
    side_effects: ["status DRAFT|SUSPENDED -> RELEASED; released_at = clock"]

  # ---- supplier quality -----------------------------------------------------
  - method: POST
    path: "/suppliers"
    description: "Registers a component supplier for exactly one component category; CASTING suppliers are CRITICAL and inspected to zero acceptance."
    roles: [PlantAdmin]
    code: 201
    input: [supplier_code, name, component_category]
    output: Supplier
    side_effects: ["criticality derived from component_category; approval_status APPROVED; incoming_inspection_level NORMAL; rolling_defect_ppm 0"]
  - method: GET
    path: "/suppliers/{id}/scorecard"
    description: "Computed read: the supplier's stored POOLED rolling_defect_ppm alongside the PER_LOT_AVERAGE variant computed on read, so the two aggregation choices can be compared side by side."
    roles: [PlantAdmin, CertificationEngineer, ComplianceOfficer, QualityEngineer, ProductionPlanner]
    code: 200
    input: []
    output: { supplier_id: string, rolling_defect_ppm: integer, scorecard_average_ppm: integer, inspected_lot_count: integer, consecutive_accepted_lots: integer, approval_status: string, incoming_inspection_level: string, criticality: string }
    side_effects: []
  - method: POST
    path: "/component-lots"
    description: "Receives a supplier lot and freezes its incoming-inspection sampling plan (sample size and acceptance number) from the supplier's inspection level at that moment."
    roles: [QualityEngineer]
    code: 201
    input: [supplier_id, lot_code, lot_quantity]
    output: ComponentLot
    side_effects: ["status RECEIVED; component_category and inspection_level_at_receipt snapshotted; sample_size and acceptance_number computed (calculations.lot_sample_plan)"]
  - method: GET
    path: "/component-lots/{id}"
    description: "Reads one component lot including its sampling plan and its accepted / consumed / remaining quantities."
    roles: [PlantAdmin, CertificationEngineer, ComplianceOfficer, QualityEngineer, ProductionPlanner]
    code: 200
    input: []
    output: ComponentLot
    side_effects: []
  - method: GET
    path: "/component-lots"
    description: "Lists component lots, filterable by supplier, status and category (FK reverse-reachability for ComponentLot.supplier_id)."
    roles: [PlantAdmin, CertificationEngineer, ComplianceOfficer, QualityEngineer, ProductionPlanner]
    code: 200
    input: ["supplier_id?", "status?", "component_category?", "limit?", "offset?"]
    output: ComponentLot[]
    side_effects: []
  - method: POST
    path: "/component-lots/{id}/inspect"
    description: "Records the incoming-inspection result for a received lot; accepts or rejects against the frozen acceptance number and re-derives the supplier's pooled defect rate and inspection level."
    roles: [QualityEngineer]
    code: 200
    input: [defects_found]
    output: ComponentLot
    side_effects:
      - "lot -> ACCEPTED or REJECTED; accepted_qty / remaining_qty / defect_ppm written; inspected_by_user_id = X-User-ID"
      - "supplier.inspected_lot_count, consecutive_accepted_lots and rolling_defect_ppm recomputed (calculations.supplier_defect_ppm, POOLED)"
      - "supplier.incoming_inspection_level and approval_status re-derived (calculations.supplier_inspection_level_ladder)"
      - "on crossing PPM_PROBATION_THRESHOLD: sibling lots with status IN {RECEIVED, ACCEPTED} and remaining_qty > 0 -> QUARANTINED, then their STAGED EngineUnits -> conformance_state QUARANTINED"
  - method: POST
    path: "/component-lots/{id}/deviation-accept"
    description: "Grants a deviation acceptance on a rejected or quarantined non-casting lot, releasing it to the line with a taint flag. Requires an approver different from the inspector."
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: ComponentLot
    side_effects:
      - "status -> DEVIATION_ACCEPTED; deviation_flag true; accepted_qty / remaining_qty recomputed; deviation_approved_by_user_id = X-User-ID"
      - "units later built from this lot become deviation_sourced and are hot-tested against the tighter threshold"
      - "supplier.rolling_defect_ppm is deliberately NOT revised"

  # ---- machining of critical components ------------------------------------
  - method: POST
    path: "/machining-runs"
    description: "Opens a machining run for a critical component against an accepted casting lot, with the controlled dimension's specification limits."
    roles: [QualityEngineer]
    code: 201
    input: [engine_platform_id, casting_lot_id, component_type, lsl_mm, usl_mm]
    output: MachiningRun
    side_effects: ["status OPEN; criticality derived from component_type"]
  - method: GET
    path: "/machining-runs/{id}"
    description: "Reads one machining run including its capability statistics."
    roles: [PlantAdmin, CertificationEngineer, ComplianceOfficer, QualityEngineer, ProductionPlanner]
    code: 200
    input: []
    output: MachiningRun
    side_effects: []
  - method: GET
    path: "/machining-runs"
    description: "Lists machining runs, filterable by platform, casting lot and status (FK reverse-reachability for both of MachiningRun's FKs)."
    roles: [PlantAdmin, CertificationEngineer, ComplianceOfficer, QualityEngineer, ProductionPlanner]
    code: 200
    input: ["engine_platform_id?", "casting_lot_id?", "status?", "limit?", "offset?"]
    output: MachiningRun[]
    side_effects: []
  - method: POST
    path: "/machining-runs/{id}/close"
    description: "Closes a machining run with its dimensional sample, computing Cpk and forking to CLOSED or CAPABILITY_HOLD against the criticality's capability gate."
    roles: [QualityEngineer]
    code: 200
    input: [measurements]
    output: MachiningRun
    side_effects: ["sample_count / mean_mm / sigma_mm / cpk written (calculations.process_capability_cpk); status -> CLOSED or CAPABILITY_HOLD; closed_at = clock"]

  # ---- seasonal production planning ----------------------------------------
  - method: POST
    path: "/assembly-lines"
    description: "Creates an assembly line with its supported product lines, weekly capacity and changeover gap."
    roles: [PlantAdmin]
    code: 201
    input: [line_code, supported_product_lines, weekly_capacity_units, "changeover_gap_weeks?", "status?"]
    output: AssemblyLine
    side_effects: ["line created; status defaults to RUNNING and changeover_gap_weeks to 1"]
  - method: POST
    path: "/build-orders"
    description: "Plans a build order over consecutive production weeks on a line, computing the build value, pre-season carry weeks, carry rate and carry cost. Enforces aggregate weekly capacity and the changeover buffer between different product lines."
    roles: [ProductionPlanner]
    code: 201
    input: [product_model_id, assembly_line_id, season, production_week, week_span, planned_quantity]
    output: BuildOrder
    side_effects: ["status PLANNED; build_value_cents / carry_weeks / carry_rate / carry_cost_cents / total_committed_cents computed (calculations.build_carry_cost); allocation_status UNALLOCATED"]
  - method: GET
    path: "/build-orders/{id}"
    description: "Reads one build order including progress counters, allocation split and version."
    roles: [PlantAdmin, CertificationEngineer, ComplianceOfficer, QualityEngineer, ProductionPlanner]
    code: 200
    input: []
    output: BuildOrder
    side_effects: []
  - method: GET
    path: "/build-orders"
    description: "Lists build orders, filterable by model, line, status and season (FK reverse-reachability for both of BuildOrder's FKs)."
    roles: [PlantAdmin, CertificationEngineer, ComplianceOfficer, QualityEngineer, ProductionPlanner]
    code: 200
    input: ["product_model_id?", "assembly_line_id?", "status?", "season?", "limit?", "offset?"]
    output: BuildOrder[]
    side_effects: []
  - method: POST
    path: "/build-orders/{id}/release"
    description: "Releases a planned order to the floor. Requires a running line, a released model with a currently valid PASSED safety certification, and a platform whose certification posture is OPEN."
    roles: [ProductionPlanner]
    code: 200
    input: []
    output: BuildOrder
    side_effects: ["status PLANNED -> RELEASED; released_at = clock"]
  - method: POST
    path: "/build-orders/{id}/allocations/run"
    description: "Positions the order's released units across the dealer and mass-retail channels through the waterfall, honouring both channel caps. Guarded by OCC on the order's version because a re-run replaces the standing split."
    roles: [ProductionPlanner]
    code: 200
    input: [expected_build_order_version]
    output: BuildOrder
    side_effects:
      - "allocated_dealer_units / allocated_mass_retail_units / unallocated_units written (calculations.channel_allocation_waterfall)"
      - "allocation_status -> ALLOCATED; allocation_run_at = clock"
      - "increments BuildOrder.version by 1"
  - method: POST
    path: "/build-orders/{id}/allocations/reset"
    description: "Compensating action for an allocation run: returns every positioned unit to the unallocated pool without touching the units themselves."
    roles: [ProductionPlanner]
    code: 200
    input: []
    output: BuildOrder
    side_effects:
      - "allocated_dealer_units = 0; allocated_mass_retail_units = 0; unallocated_units = built_quantity; allocation_status -> UNALLOCATED; allocation_run_at = null"
      - "invariant built_quantity == allocated_dealer_units + allocated_mass_retail_units + unallocated_units preserved"
  - method: POST
    path: "/build-orders/{id}/line-audits"
    description: "Schedules a production line audit against a running order for a given production week, freezing the required sample size from the order's released population."
    roles: [ComplianceOfficer]
    code: 201
    input: [audit_week]
    output: ProductionLineAudit
    side_effects: ["audit created SCHEDULED; certification_family_id resolved through the order's model and platform; required_sample_size computed (calculations.audit_outcome_evaluation)"]
  - method: GET
    path: "/build-orders/{id}/line-audits"
    description: "Lists the production line audits of an order (FK reverse-reachability for ProductionLineAudit.build_order_id)."
    roles: [PlantAdmin, CertificationEngineer, ComplianceOfficer, QualityEngineer, ProductionPlanner]
    code: 200
    input: ["limit?", "offset?"]
    output: ProductionLineAudit[]
    side_effects: []
  - method: POST
    path: "/line-audits/{id}/record"
    description: "Records a production line audit result. A failure drives the five-level family cascade: audit FAILED -> family AUDIT_HOLD or SUSPENDED -> platform posture and model suspension -> build orders HELD -> units quarantined and allocations reset."
    roles: [ComplianceOfficer]
    code: 200
    input: [units_tested, units_failed, max_measured_emission_g_per_kwh]
    output: ProductionLineAudit
    side_effects:
      - "failure_rate / failure_reason / status written (calculations.audit_outcome_evaluation); recorded_by_user_id = X-User-ID"
      - "on FAILED: family.cumulative_audit_failures += 1 and family -> AUDIT_HOLD (or SUSPENDED at AUDIT_FAILURE_SUSPEND_COUNT)"
      - "on FAILED: platform posture -> RESTRICTED/FROZEN; RELEASED models -> SUSPENDED; PLANNED/RELEASED/IN_PRODUCTION build orders -> HELD; their non-released units -> conformance QUARANTINED; their allocation counters reset"
      - "on PASSED: nothing outside the audit row changes"

  # ---- engine assembly, torque monitoring and hot test ---------------------
  - method: POST
    path: "/engine-units"
    description: "Stages an engine unit against a released build order, consuming one piece from the carburetor lot and one from the ignition lot and binding a closed machining run."
    roles: [QualityEngineer]
    code: 201
    input: [build_order_id, machining_run_id, carburetor_lot_id, ignition_lot_id, serial_number]
    output: EngineUnit
    side_effects:
      - "unit created with build_state STAGED, conformance_state PENDING; deviation_sourced set from the consumed lots' deviation_flag"
      - "each consumed lot: consumed_qty += 1, remaining_qty -= 1 (invariant accepted_qty == consumed_qty + remaining_qty)"
      - "build_order.staged_quantity += 1; order RELEASED -> IN_PRODUCTION on the first unit"
  - method: GET
    path: "/engine-units/{id}"
    description: "Reads one engine unit including both state dimensions, torque results and hot-test values."
    roles: [PlantAdmin, CertificationEngineer, ComplianceOfficer, QualityEngineer, ProductionPlanner]
    code: 200
    input: []
    output: EngineUnit
    side_effects: []
  - method: GET
    path: "/engine-units"
    description: "Lists engine units, filterable by build order, machining run, either consumed lot, and both state dimensions (FK reverse-reachability for all four EngineUnit FKs)."
    roles: [PlantAdmin, CertificationEngineer, ComplianceOfficer, QualityEngineer, ProductionPlanner]
    code: 200
    input: ["build_order_id?", "machining_run_id?", "carburetor_lot_id?", "ignition_lot_id?", "build_state?", "conformance_state?", "limit?", "offset?"]
    output: EngineUnit[]
    side_effects: []
  - method: POST
    path: "/engine-units/{id}/torque-record"
    description: "Records the line's torque monitoring readings for a staged unit; exactly required_fastener_count readings are expected and any reading outside the inclusive tolerance band makes the unit nonconforming."
    roles: [QualityEngineer]
    code: 200
    input: [torque_readings]
    output: EngineUnit
    side_effects: ["out_of_spec_fastener_count computed (calculations.torque_conformance); build_state -> ASSEMBLED; conformance_state -> NONCONFORMING when any reading is out of band"]
  - method: POST
    path: "/engine-units/{id}/hot-test"
    description: "Records the hot-test result for an assembled unit against the platform's speed window and an emission threshold derived from the family's certified emission — tightened to the certified value itself for deviation-sourced units."
    roles: [QualityEngineer]
    code: 200
    input: [measured_rpm, measured_emission_g_per_kwh]
    output: EngineUnit
    side_effects: ["hot_test_emission_threshold computed; build_state -> HOT_TESTED; conformance_state -> CONFORMING or NONCONFORMING (calculations.hot_test_conformance)"]
  - method: POST
    path: "/engine-units/{id}/release"
    description: "Releases a conforming hot-tested unit to finished goods, adding it to the build order's allocation pool and possibly completing the order."
    roles: [QualityEngineer]
    code: 200
    input: []
    output: EngineUnit
    side_effects: ["build_state -> RELEASED; released_at = clock", "build_order.built_quantity += 1, staged_quantity -= 1; order auto-COMPLETES at planned_quantity (calculations.build_order_progress)"]
  - method: POST
    path: "/engine-units/{id}/rework"
    description: "Sends a nonconforming unit back to staging, clearing its torque and hot-test measurements without re-charging component consumption."
    roles: [QualityEngineer]
    code: 200
    input: []
    output: EngineUnit
    side_effects: ["rework_count += 1; build_state -> STAGED; conformance_state -> PENDING; torque_readings, out_of_spec_fastener_count, measured_rpm, measured_emission_g_per_kwh, hot_test_emission_threshold cleared"]
  - method: POST
    path: "/engine-units/{id}/cancel"
    description: "Compensating action for staging: scraps an unreleased unit and returns its consumed carburetor and ignition pieces to their lots."
    roles: [QualityEngineer]
    code: 200
    input: []
    output: EngineUnit
    side_effects: ["build_state -> CANCELLED", "each consumed lot: consumed_qty -= 1, remaining_qty += 1", "build_order.staged_quantity -= 1"]

  # ---- service parts and the repair network --------------------------------
  - method: POST
    path: "/service-parts"
    description: "Creates a service part for a platform with its on-hand stock, channel lead times and parts-availability commitment."
    roles: [PlantAdmin]
    code: 201
    input: [engine_platform_id, part_number, category, on_hand_qty, committed_availability_years, last_production_year, "dealer_lead_time_days?", "mass_retail_lead_time_days?"]
    output: ServicePart
    side_effects: ["status ACTIVE; commitment_expires_year = last_production_year + committed_availability_years; fill_rate_pct null until the first request"]
  - method: GET
    path: "/service-parts/{id}"
    description: "Reads one service part including its supersession pointer, request counters and fill rate."
    roles: [PlantAdmin, CertificationEngineer, ComplianceOfficer, QualityEngineer, ProductionPlanner, ChannelPartner]
    code: 200
    input: []
    output: ServicePart
    side_effects: []
  - method: GET
    path: "/service-parts"
    description: "Lists service parts, filterable by platform, supersession predecessor pointer, status and category (FK reverse-reachability for ServicePart.engine_platform_id and the self-referential ServicePart.superseded_by_part_id)."
    roles: [PlantAdmin, CertificationEngineer, ComplianceOfficer, QualityEngineer, ProductionPlanner, ChannelPartner]
    code: 200
    input: ["engine_platform_id?", "superseded_by_part_id?", "status?", "category?", "limit?", "offset?"]
    output: ServicePart[]
    side_effects: []
  - method: POST
    path: "/service-parts/{id}/supersede"
    description: "Points a part at its successor, rejecting self-supersession, platform mismatches, chains that loop back and chains deeper than the maximum, then substitutes this part's open backorders from the successor's stock in created_at order."
    roles: [PlantAdmin]
    code: 200
    input: [successor_part_id]
    output: ServicePart
    side_effects:
      - "status ACTIVE -> SUPERSEDED; superseded_by_part_id set"
      - "open BACKORDERED requests become SUBSTITUTED while the successor's stock covers them, in created_at ASC order; successor.on_hand_qty decremented; promised_ship_date recomputed"
      - "counters and fill_rate_pct recomputed on BOTH parts (calculations.supersession_chain_resolution)"
  - method: POST
    path: "/service-parts/{id}/obsolete"
    description: "Retires a part once its parts-availability commitment has expired and no backorder is open."
    roles: [PlantAdmin]
    code: 200
    input: []
    output: ServicePart
    side_effects: ["status -> OBSOLETE (terminal)"]
  - method: GET
    path: "/service-parts/{id}/requests"
    description: "Lists the fulfillment requests raised against this part (FK reverse-reachability for PartsFulfillmentRequest.service_part_id and shipped_from_part_id). A ChannelPartner sees only rows whose requester_user_id equals its own X-User-ID; every other role sees all rows."
    roles: [PlantAdmin, CertificationEngineer, ComplianceOfficer, QualityEngineer, ProductionPlanner, ChannelPartner]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: PartsFulfillmentRequest[]
    side_effects: []
  - method: POST
    path: "/parts-requests"
    description: "Raises a repair-network parts request; settles to FILLED against on-hand stock inside the same call or remains BACKORDERED with the backorder promise date."
    roles: [ChannelPartner]
    code: 201
    input: [service_part_id, requested_quantity, channel]
    output: PartsFulfillmentRequest
    side_effects:
      - "request created; status FILLED (stock decremented) or BACKORDERED; shipped_from_part_id and promised_ship_date written"
      - "requester_user_id = X-User-ID; part counters and fill_rate_pct recomputed (calculations.parts_fill_rate_and_promise)"

# =============================================================================
# §1.6 Error Code Catalog (every id is the error_id of exactly one §1.4 row)
# =============================================================================
errors:

  # ---- authentication / authorization --------------------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID missing, or X-User-Role is not one of the six declared roles"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "the acting role is not listed in the endpoint's roles (e.g. ChannelPartner calling GET /build-orders/{id}, QualityEngineer calling POST /certification-families/{id}/certify)"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the certifying ComplianceOfficer's X-User-ID equals family.submitted_by_user_id, or the deviation approver's X-User-ID equals lot.inspected_by_user_id"

  # ---- request shape --------------------------------------------------------
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing or malformed body/query field: unknown enum member, out-of-range number, malformed ISO date, non-Monday production_week or audit_week, scheduled_end_at <= scheduled_start_at, usl_mm <= lsl_mm, defects_found > sample_size, units_failed > units_tested, pagination limit outside 1..100"

  # ---- existence ------------------------------------------------------------
  - id: ERR_CERTIFICATION_FAMILY_NOT_FOUND
    http: 404
    condition: "the certification family in the path or in certification_family_id does not exist"
  - id: ERR_ENGINE_PLATFORM_NOT_FOUND
    http: 404
    condition: "the engine platform in the path or in engine_platform_id does not exist"
  - id: ERR_DURABILITY_TEST_NOT_FOUND
    http: 404
    condition: "the durability test run in the path does not exist"
  - id: ERR_PRODUCT_MODEL_NOT_FOUND
    http: 404
    condition: "the product model in the path or in product_model_id does not exist"
  - id: ERR_SUPPLIER_NOT_FOUND
    http: 404
    condition: "the supplier in the path or in supplier_id does not exist"
  - id: ERR_COMPONENT_LOT_NOT_FOUND
    http: 404
    condition: "the component lot in the path or in casting_lot_id / carburetor_lot_id / ignition_lot_id does not exist"
  - id: ERR_MACHINING_RUN_NOT_FOUND
    http: 404
    condition: "the machining run in the path or in machining_run_id does not exist"
  - id: ERR_ASSEMBLY_LINE_NOT_FOUND
    http: 404
    condition: "the assembly line in assembly_line_id does not exist"
  - id: ERR_BUILD_ORDER_NOT_FOUND
    http: 404
    condition: "the build order in the path or in build_order_id does not exist"
  - id: ERR_ENGINE_UNIT_NOT_FOUND
    http: 404
    condition: "the engine unit in the path does not exist"
  - id: ERR_LINE_AUDIT_NOT_FOUND
    http: 404
    condition: "the production line audit in the path does not exist"
  - id: ERR_SERVICE_PART_NOT_FOUND
    http: 404
    condition: "the service part in the path or in successor_part_id / service_part_id does not exist"

  # ---- uniqueness -----------------------------------------------------------
  - id: ERR_DUPLICATE_CODE
    http: 409
    condition: "family_code, platform_code, model_code, supplier_code, line_code, part_number or serial_number already exists, or lot_code already exists for that supplier"

  # ---- optimistic concurrency ----------------------------------------------
  - id: ERR_STALE_FAMILY_VERSION
    http: 412
    condition: "expected_certification_family_version does not equal the family's current version on POST /durability-tests"
  - id: ERR_STALE_BUILD_ORDER_VERSION
    http: 412
    condition: "expected_build_order_version does not equal the order's current version on POST /build-orders/{id}/allocations/run"

  # ---- state preconditions -------------------------------------------------
  - id: ERR_FAMILY_STATE_INVALID
    http: 409
    condition: "the family's status does not admit the operation: scheduling a run outside {DRAFT, DURABILITY_TESTING, AUDIT_HOLD}, submitting outside DURABILITY_COMPLETE, certifying outside SUBMITTED (including any operation on a SUSPENDED family)"
  - id: ERR_DURABILITY_TEST_STATE_INVALID
    http: 409
    condition: "completing a durability run whose status is already COMPLETED"
  - id: ERR_LOT_STATE_INVALID
    http: 409
    condition: "inspecting a lot whose status is not RECEIVED, or deviation-accepting a lot outside {REJECTED, QUARANTINED}"
  - id: ERR_MACHINING_RUN_STATE_INVALID
    http: 409
    condition: "closing a machining run whose status is already CLOSED"
  - id: ERR_MODEL_STATE_INVALID
    http: 409
    condition: "releasing an already RELEASED model, or creating a build order against a model whose status is not RELEASED"
  - id: ERR_BUILD_ORDER_NOT_PLANNED
    http: 409
    condition: "releasing a build order whose status is not PLANNED (already RELEASED, IN_PRODUCTION, HELD or COMPLETED)"
  - id: ERR_BUILD_ORDER_NOT_ACCEPTING_UNITS
    http: 409
    condition: "staging a unit against an order whose status is PLANNED, HELD or COMPLETED"
  - id: ERR_UNIT_STATE_INVALID
    http: 409
    condition: "the unit's build_state does not admit the action (torque-record outside STAGED, hot-test outside ASSEMBLED, release outside HOT_TESTED, rework outside {ASSEMBLED, HOT_TESTED}, cancel on a RELEASED or CANCELLED unit)"
  - id: ERR_UNIT_NONCONFORMING
    http: 409
    condition: "the unit's conformance_state blocks the action: hot-testing a NONCONFORMING or QUARANTINED unit, releasing a unit that is not CONFORMING, reworking a unit that is not NONCONFORMING"
  - id: ERR_AUDIT_STATE_INVALID
    http: 409
    condition: "recording a production line audit whose status is already PASSED or FAILED"
  - id: ERR_AUDIT_ALREADY_OPEN
    http: 409
    condition: "scheduling a second audit on an order that already has a SCHEDULED audit"
  - id: ERR_PART_STATE_INVALID
    http: 409
    condition: "superseding a part that is not ACTIVE, naming a successor that is not ACTIVE, obsoleting an already OBSOLETE part, or requesting a part that is not ACTIVE"

  # ---- safety / compliance -------------------------------------------------
  - id: ERR_SUPPLIER_SUSPENDED
    http: 409
    condition: "receiving a lot from a supplier whose approval_status is SUSPENDED"
  - id: ERR_SAFETY_STANDARD_MISMATCH
    http: 422
    condition: "standard_code does not match the model's product_line (mowers ANSI_B71_1, snow equipment ANSI_B71_3, generators UL_2201)"
  - id: ERR_SAFETY_CONTROL_REQUIRED
    http: 422
    condition: "operator-presence type, blade-brake type, channel warranty floor or blade_stop_time_ms nullability contradicts the model's product_line or channel"
  - id: ERR_SAFETY_CERTIFICATION_MISSING
    http: 409
    condition: "the model has no SafetyCertification with result == PASSED"
  - id: ERR_SAFETY_CERTIFICATION_EXPIRED
    http: 409
    condition: "the model's latest PASSED SafetyCertification has expires_on earlier than the logical clock's date"
  - id: ERR_CERTIFIED_EMISSION_EXCEEDS_LIMIT
    http: 422
    condition: "certifying a family whose certified_emission_g_per_kwh exceeds family_emission_limit_g_per_kwh"
  - id: ERR_COMPLIANCE_MARGIN_TOO_LOW
    http: 422
    condition: "certifying a family whose compliance_margin_pct is below 5.00 while still inside the limit"
  - id: ERR_CAPABILITY_SAMPLE_INSUFFICIENT
    http: 422
    condition: "closing a machining run with fewer than 5 measurements"
  - id: ERR_MACHINING_RUN_NOT_CLOSED
    http: 409
    condition: "staging a unit against a machining run whose status is OPEN or CAPABILITY_HOLD"
  - id: ERR_COMPONENT_LOT_NOT_RELEASABLE
    http: 409
    condition: "a referenced lot's status is RECEIVED, REJECTED or QUARANTINED rather than ACCEPTED or DEVIATION_ACCEPTED"
  - id: ERR_ASSEMBLY_LINE_DOWN
    http: 409
    condition: "releasing a build order onto a line whose status is DOWN"

  # ---- referential coherence ----------------------------------------------
  - id: ERR_FAMILY_NOT_CERTIFIED
    http: 409
    condition: "releasing a build order whose platform certification_posture is PENDING, RESTRICTED or FROZEN instead of OPEN"
  - id: ERR_PLATFORM_MISMATCH
    http: 409
    condition: "the durability run's platform is not in the named family, the machining run's platform differs from the build order model's platform, or a successor service part sits on a different platform"
  - id: ERR_COMPONENT_CATEGORY_MISMATCH
    http: 422
    condition: "a lot reference points at the wrong component category (carburetor slot fed an IGNITION lot, machining run fed a non-CASTING lot, etc.)"
  - id: ERR_DISPLACEMENT_OUT_OF_FAMILY
    http: 422
    condition: "the platform's displacement_cc falls outside the family's declared displacement band"
  - id: ERR_CHANNEL_SHARE_MISMATCH
    http: 422
    condition: "dealer_share_pct contradicts the model's channel (DEALER requires 1.00, MASS_RETAIL requires 0.00, DUAL requires a value strictly between)"
  - id: ERR_SUPERSESSION_CYCLE
    http: 409
    condition: "successor_part_id equals the part itself, the successor's chain leads back to the part, or the resulting chain would exceed 5 links"
  - id: ERR_LINE_PRODUCT_LINE_UNSUPPORTED
    http: 422
    condition: "the model's product_line is absent from the assembly line's supported_product_lines"

  # ---- temporal -----------------------------------------------------------
  - id: ERR_PLATFORM_TEST_WINDOW_OVERLAP
    http: 409
    condition: "the requested durability window overlaps another SCHEDULED or COMPLETED run on the same platform; windows that merely touch at an endpoint are accepted"
  - id: ERR_LINE_CHANGEOVER_CONFLICT
    http: 409
    condition: "another active order of a different product_line occupies a week within changeover_gap_weeks of a week this order would occupy on the same line"
  - id: ERR_SEASON_WINDOW_MISMATCH
    http: 422
    condition: "a PRE_SEASON order's production_week is not before its product line's season start, or an IN_SEASON order's production_week is before it"
  - id: ERR_AVAILABILITY_COMMITMENT_ACTIVE
    http: 409
    condition: "obsoleting a part while the logical clock's year is still within last_production_year + committed_availability_years"

  # ---- constraint satisfaction --------------------------------------------
  - id: ERR_TORQUE_READING_COUNT_MISMATCH
    http: 422
    condition: "the number of torque readings differs from the platform's required_fastener_count"
  - id: ERR_REWORK_LIMIT_EXCEEDED
    http: 409
    condition: "reworking a unit that has already been reworked MAX_REWORK_CYCLES (2) times"
  - id: ERR_AUDIT_SAMPLE_TOO_SMALL
    http: 422
    condition: "units_tested is below the audit's frozen required_sample_size"
  - id: ERR_AUDIT_SAMPLE_EXCEEDS_POPULATION
    http: 422
    condition: "units_tested exceeds the order's built_quantity"
  - id: ERR_OPEN_BACKORDERS_EXIST
    http: 409
    condition: "obsoleting a part that still has BACKORDERED requests"

  # ---- capacity / quota ---------------------------------------------------
  - id: ERR_LINE_CAPACITY_EXCEEDED
    http: 409
    condition: "the aggregate per-week load on the line would exceed weekly_capacity_units in at least one occupied week"
  - id: ERR_BUILD_ORDER_QUANTITY_EXCEEDED
    http: 409
    condition: "staging another unit would push staged_quantity + built_quantity past planned_quantity"
  - id: ERR_COMPONENT_LOT_DEPLETED
    http: 409
    condition: "a referenced lot has remaining_qty == 0"
  - id: ERR_NO_ALLOCATABLE_UNITS
    http: 422
    condition: "running channel allocation on an order whose built_quantity is 0"

# =============================================================================
# §1.7 RBAC Matrix — peer roles with two segregation-of-duties gates
# =============================================================================
roles:

  - name: PlantAdmin
    description: "Plant master-data owner: engine platforms, product models, assembly lines, service parts and the logical clock."
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /engine-platforms"
      - "POST /product-models"
      - "POST /product-models/{id}/release"
      - "POST /suppliers"
      - "POST /assembly-lines"
      - "POST /service-parts"
      - "POST /service-parts/{id}/supersede"
      - "POST /service-parts/{id}/obsolete"
    shared_operations:
      - "every GET endpoint except the ChannelPartner-scoped view of GET /service-parts/{id}/requests"

  - name: CertificationEngineer
    description: "Owns emission certification families and durability testing; submits a family for review but may never certify it."
    identity: opaque
    exclusive_operations:
      - "POST /certification-families"
      - "POST /certification-families/{id}/submit"
      - "POST /durability-tests"
      - "POST /durability-tests/{id}/complete"
    shared_operations:
      - "every GET endpoint except the ChannelPartner-scoped view of GET /service-parts/{id}/requests"

  - name: ComplianceOfficer
    description: "Regulatory authority: certifies families, records safety certifications, grants component deviations and runs production line audits. Barred from acting as its own submitter or inspector."
    identity: opaque
    exclusive_operations:
      - "POST /certification-families/{id}/certify"
      - "POST /safety-certifications"
      - "POST /component-lots/{id}/deviation-accept"
      - "POST /build-orders/{id}/line-audits"
      - "POST /line-audits/{id}/record"
    shared_operations:
      - "every GET endpoint except the ChannelPartner-scoped view of GET /service-parts/{id}/requests"

  - name: QualityEngineer
    description: "Owns incoming inspection, machining capability and the assembly line: torque monitoring, hot test, unit release, rework and cancellation."
    identity: opaque
    exclusive_operations:
      - "POST /component-lots"
      - "POST /component-lots/{id}/inspect"
      - "POST /machining-runs"
      - "POST /machining-runs/{id}/close"
      - "POST /engine-units"
      - "POST /engine-units/{id}/torque-record"
      - "POST /engine-units/{id}/hot-test"
      - "POST /engine-units/{id}/release"
      - "POST /engine-units/{id}/rework"
      - "POST /engine-units/{id}/cancel"
    shared_operations:
      - "every GET endpoint except the ChannelPartner-scoped view of GET /service-parts/{id}/requests"

  - name: ProductionPlanner
    description: "Owns seasonal production planning: build orders, release to the floor and channel inventory positioning."
    identity: opaque
    exclusive_operations:
      - "POST /build-orders"
      - "POST /build-orders/{id}/release"
      - "POST /build-orders/{id}/allocations/run"
      - "POST /build-orders/{id}/allocations/reset"
    shared_operations:
      - "every GET endpoint except the ChannelPartner-scoped view of GET /service-parts/{id}/requests"

  - name: ChannelPartner
    description: "Dealer or mass-retail service counter. Raises parts requests and sees only the service-part surface; every production, certification and supplier read is closed to it."
    identity: opaque
    exclusive_operations:
      - "POST /parts-requests"
    shared_operations:
      - "GET /service-parts/{id}"
      - "GET /service-parts"
      - "GET /service-parts/{id}/requests (scoped: only rows whose requester_user_id equals the caller's X-User-ID)"
    note: "identity is opaque — PartsFulfillmentRequest.requester_user_id stores the operator id for scoping and MUST NEVER be required to equal any entity's id."
