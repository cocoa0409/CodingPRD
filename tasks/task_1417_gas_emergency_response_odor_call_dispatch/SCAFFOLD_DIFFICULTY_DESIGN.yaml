              payload: { responsibility: "INSIDE_CUSTOMER", basis: "CUSTOMER_APPLIANCE_TRACE", expected_incident_version: "${inc_b_v}" }
              as: Supervisor
              as_user_id: "sup-1"
              captures: { det_b: "$.data.id" }
          trigger:
            - call: "POST /gas-ops/responsibility-determinations/${det_a}/finalize"
              payload: {}
              as: Supervisor
              as_user_id: "sup-2"
            - call: "POST /gas-ops/responsibility-determinations/${det_b}/finalize"
              payload: {}
              as: Supervisor
              as_user_id: "sup-2"
