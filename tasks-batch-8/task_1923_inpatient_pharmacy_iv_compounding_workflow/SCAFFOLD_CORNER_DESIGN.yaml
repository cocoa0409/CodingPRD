        distinguishing_aspect: "Activating a protocol whose expires_at precedes the current clock -> ERR_PROTOCOL_EXPIRED (422): clock set to 2026-08-05 vs expires_at 2026-08-03."
        test_recipe:
          setup: ["Shortage drug + substitute; protocol DRAFT expiring 2026-08-03; clock advanced to 2026-08-05"]
          setup_api_calls:
            - call: "POST /pharmacy/drug-products"
