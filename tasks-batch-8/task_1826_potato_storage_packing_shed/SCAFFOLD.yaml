  path: /potato-shed/field-lots/{id}/assessments
  description: 'List assessments of a lot (reverse-reach GradeOutAssessment.field_lot_id); list order pinned: created_at ASC'
  roles:
  - ShedAdmin
  - StorageManager
  - QualityAssuranceManager
  - SettlementClerk
  code: 200
