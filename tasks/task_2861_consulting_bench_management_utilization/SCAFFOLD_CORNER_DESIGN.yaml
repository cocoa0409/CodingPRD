        test_recipe:
          setup:
            - "Clock at 2026-08-03. One NA group, one CLOUD_ARCH skill, one never-staffed CONSULTANT holding a proficiency-3 assertion."
            - "A bench-run at 2026-08-17 escalates the spell to ESCALATED_L1; the consultant is then enrolled in a programme with cohort 2026-09-01..2026-09-30, target proficiency 5, seat_capacity 2."
            - "A bench-run once the clock reaches 2026-09-01 moves the programme PLANNED -> RUNNING."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T00:00:00Z" }
