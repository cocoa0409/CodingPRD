    description: "Mark a no-show; releases linked item back to PLANNED"
    roles: [FrontDesk]
    code: 200
    input: []
    output: Appointment
    side_effects: ["status=NO_SHOW; linked SCHEDULED item->PLANNED, appointment_id cleared"]

  # ---------------- Predeterminations ----------------
  - method: POST
    path: "/predeterminations"
    description: "Request carrier pre-determination for a treatment-plan item"
    roles: [BillingSpecialist]
    code: 201
    input: [treatment_plan_item_id, patient_coverage_id]
    output: Predetermination
    side_effects: ["status=PENDING; submitted_fee_cents=item.fee_cents; item.predetermination_id set; runs frequency_and_waiting_eligibility + annual-max check"]

  - method: GET
    path: "/predeterminations"
    description: "List predeterminations (FK reverse-reachability for Predetermination.treatment_plan_item_id and .patient_coverage_id)"
    roles: [BillingSpecialist, Clinician, FrontDesk]
    code: 200
    input: ["treatment_plan_item_id?", "patient_coverage_id?", "status?"]
    output: "Predetermination[]"
    side_effects: []

  - method: GET
    path: "/predeterminations/{predeterminationId}"
    description: "Get a predetermination"
    roles: [BillingSpecialist, Clinician, FrontDesk]
    code: 200
    input: []
    output: Predetermination
    side_effects: []

  - method: POST
    path: "/predeterminations/{predeterminationId}/approve"
    description: "Approve (or re-approve from REQUIRES_REVALIDATION) a predetermination"
    roles: [BillingSpecialist]
    code: 200
    input: [approved_benefit_cents, valid_until_date]
    output: Predetermination
    side_effects: ["status=APPROVED; record approved_benefit_cents + valid_until_date"]

  - method: POST
    path: "/predeterminations/{predeterminationId}/deny"
    description: "Deny a predetermination"
    roles: [BillingSpecialist]
    code: 200
    input: []
    output: Predetermination
    side_effects: ["status=DENIED"]

  # ---------------- Claims ----------------
  - method: POST
    path: "/claims"
    description: "Create a claim for a COMPLETED treatment-plan item"
    roles: [BillingSpecialist]
    code: 201
    input: [patient_id, treatment_plan_item_id, patient_coverage_id]
    output: Claim
    side_effects: ["submission_status=DRAFT; adjudication_status=PENDING; billed_fee_cents=item.fee_cents"]

  - method: GET
    path: "/claims"
    description: "List claims (FK reverse-reachability for Claim.patient_id/.treatment_plan_item_id/.patient_coverage_id)"
    roles: [BillingSpecialist, Clinician, FrontDesk]
    code: 200
    input: ["patient_id?", "treatment_plan_item_id?", "patient_coverage_id?", "adjudication_status?", "submission_status?"]
    output: "Claim[]"
    side_effects: []

  - method: GET
    path: "/claims/{claimId}"
    description: "Get a claim"
    roles: [BillingSpecialist, Clinician, FrontDesk, Patient]
    code: 200
    input: []
    output: Claim
    side_effects: []

  - method: POST
    path: "/claims/{claimId}/attachments"
    description: "Attach a supporting document to a claim"
    roles: [BillingSpecialist]
    code: 201
    input: [attachment_type, document_ref]
    output: ClaimAttachment
    side_effects: []

  - method: GET
    path: "/claims/{id}/attachments"
    description: "List a claim's attachments (FK reverse-reachability for ClaimAttachment.claim_id)"
    roles: [BillingSpecialist, Clinician, FrontDesk]
    code: 200
    input: []
    output: "ClaimAttachment[]"
    side_effects: []

  - method: POST
    path: "/claims/{claimId}/submit"
    description: "Submit a claim to the carrier (submission DRAFT->SUBMITTED)"
    roles: [BillingSpecialist]
    code: 200
    input: []
    output: Claim
    side_effects: ["submission_status=SUBMITTED"]

  - method: POST
    path: "/claims/{claimId}/adjudicate"
    description: "Adjudicate a submitted claim; computes carrier_paid_cents and cascades the coverage accumulator"
    roles: [BillingSpecialist]
    code: 200
    input: []
    output: Claim
    side_effects: ["carrier_paid_cents=adjudicated_benefit; adjudication_status=PAID|PARTIALLY_PAID; cascade coverage accumulator + annual_max + predetermination revalidation; patient.balance_owed_cents recomputed"]

  - method: POST
    path: "/claims/{claimId}/deny"
    description: "Carrier denial (adjudication PENDING->DENIED)"
    roles: [BillingSpecialist]
    code: 200
    input: []
    output: Claim
    side_effects: ["adjudication_status=DENIED; patient_responsibility_cents=billed_fee_cents; patient.balance_owed_cents recomputed"]

  - method: POST
    path: "/claims/{claimId}/void"
    description: "Void a paid claim; compensates the coverage accumulator"
    roles: [BillingSpecialist]
    code: 200
    input: []
    output: Claim
    side_effects: ["adjudication_status=VOID; coverage.annual_benefit_used_cents -= carrier_paid_cents; recompute annual_max_reached; patient.balance_owed_cents recomputed"]

  # ---------------- Recare Recall ----------------
  - method: POST
    path: "/recare-recalls"
    description: "Create a recare recall for a patient"
    roles: [FrontDesk]
    code: 201
    input: [patient_id, recall_type, interval_months, last_visit_date]
    output: RecareRecall
    side_effects: ["status=ACTIVE; next_due_date=last_visit_date+interval_months"]

  - method: GET
    path: "/recare-recalls"
    description: "List recare recalls (FK reverse-reachability for RecareRecall.patient_id)"
    roles: [FrontDesk, Clinician, BillingSpecialist]
    code: 200
    input: ["patient_id?", "status?"]
    output: "RecareRecall[]"
    side_effects: []

  - method: GET
    path: "/recare-recalls/{recareRecallId}"
    description: "Get a recare recall"
    roles: [FrontDesk, Clinician, BillingSpecialist, Patient]
    code: 200
    input: []
    output: RecareRecall
    side_effects: []

  - method: POST
    path: "/recare-recalls/{recareRecallId}/fulfill"
    description: "Mark a recall visit done and roll the cadence forward"
    roles: [FrontDesk]
    code: 200
    input: [visit_date]
    output: RecareRecall
    side_effects: ["last_visit_date=visit_date; next_due_date recomputed = visit_date + interval_months; status reset to ACTIVE"]

  # ---------------- Payment Plans ----------------
  - method: POST
    path: "/payment-plans"
    description: "Finance a claim's patient responsibility over installments (supersede-guarded by OCC on Claim.version)"
    roles: [BillingSpecialist]
    code: 201
    input: [patient_id, claim_id, installment_count, expected_claim_version]
    output: PaymentPlan
    side_effects: ["principal_cents=claim.patient_responsibility_cents; compute installment schedule; status=ACTIVE; increments Claim.version by 1; patient.balance_owed_cents recomputed"]

  - method: GET
    path: "/payment-plans"
    description: "List payment plans (FK reverse-reachability for PaymentPlan.patient_id and .claim_id)"
    roles: [BillingSpecialist, FrontDesk]
    code: 200
    input: ["patient_id?", "claim_id?", "status?"]
    output: "PaymentPlan[]"
    side_effects: []

  - method: GET
    path: "/payment-plans/{paymentPlanId}"
    description: "Get a payment plan"
    roles: [BillingSpecialist, FrontDesk, Patient]
    code: 200
    input: []
    output: PaymentPlan
    side_effects: []

  - method: POST
    path: "/payment-plans/{paymentPlanId}/post-installment"
    description: "Post an installment payment; PAID_OFF when fully paid"
    roles: [BillingSpecialist]
    code: 200
    input: [amount_cents]
    output: PaymentPlan
    side_effects: ["amount_posted_cents+=amount_cents; remaining_balance_cents recomputed; if amount_posted>=principal: status=PAID_OFF; patient.balance_owed_cents recomputed"]

  - method: POST
    path: "/payment-plans/{paymentPlanId}/reverse-installment"
    description: "Reverse the most recent installment (compensation; restores remaining balance)"
    roles: [BillingSpecialist]
    code: 200
    input: [amount_cents]
    output: PaymentPlan
    side_effects: ["amount_posted_cents-=amount_cents; remaining_balance_cents recomputed; status reverts ACTIVE if it was PAID_OFF; patient.balance_owed_cents recomputed"]

  - method: POST
    path: "/payment-plans/{paymentPlanId}/default"
    description: "Mark a payment plan DEFAULTED"
    roles: [BillingSpecialist]
    code: 200
    input: []
    output: PaymentPlan
    side_effects: ["status=DEFAULTED; patient.balance_owed_cents recomputed"]

  # ---------------- Test-driving clock (deterministic time) ----------------
  - method: POST
    path: "/_clock/set"
    description: "Set the deterministic system clock (drives waiting/frequency/recare-due evaluation and predetermination expiry)"
    roles: [FrontDesk, BillingSpecialist]
    code: 200
    input: [now_iso8601]
    output: "{ now_iso8601: string }"
    side_effects: ["system clock set; recare recalls whose next_due_date <= now flip ACTIVE->DUE; predeterminations past valid_until_date flip PENDING->EXPIRED"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- auth ---
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-ID/X-User-Role header missing or role unknown" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for this operation" }
  # --- not found ---
  - { id: ERR_PATIENT_NOT_FOUND, http: 404, condition: "Patient id does not resolve" }
  - { id: ERR_PROVIDER_NOT_FOUND, http: 404, condition: "Provider id does not resolve" }
  - { id: ERR_OPERATORY_NOT_FOUND, http: 404, condition: "Operatory id does not resolve" }
  - { id: ERR_INSURANCE_PLAN_NOT_FOUND, http: 404, condition: "InsurancePlan id does not resolve" }
  - { id: ERR_COVERAGE_NOT_FOUND, http: 404, condition: "PatientCoverage id does not resolve" }
  - { id: ERR_TREATMENT_PLAN_NOT_FOUND, http: 404, condition: "TreatmentPlan id does not resolve" }
  - { id: ERR_ITEM_NOT_FOUND, http: 404, condition: "TreatmentPlanItem id does not resolve" }
  - { id: ERR_APPOINTMENT_NOT_FOUND, http: 404, condition: "Appointment id does not resolve" }
  - { id: ERR_PREDETERMINATION_NOT_FOUND, http: 404, condition: "Predetermination id does not resolve" }
  - { id: ERR_CLAIM_NOT_FOUND, http: 404, condition: "Claim id does not resolve" }
  - { id: ERR_RECALL_NOT_FOUND, http: 404, condition: "RecareRecall id does not resolve" }
  - { id: ERR_PAYMENT_PLAN_NOT_FOUND, http: 404, condition: "PaymentPlan id does not resolve" }
  # --- validation ---
  - { id: ERR_VALIDATION, http: 422, condition: "Missing required field, bad enum, or conditional field absent (surface/pocket_depth_mm)" }
  # --- concurrency ---
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_claim_version on POST /payment-plans does not match Claim.version" }
  # --- state ---
  - { id: ERR_INVALID_STATE, http: 409, condition: "Transition not allowed from the resource's current state" }
  - { id: ERR_PLAN_HAS_NO_ITEMS, http: 409, condition: "Propose attempted on a plan with no PLANNED items" }
  - { id: ERR_PLAN_NOT_ACCEPTED, http: 409, condition: "Scheduling an item whose plan is not ACCEPTED" }
  - { id: ERR_PLAN_ITEMS_NOT_COMPLETE, http: 409, condition: "Complete attempted while non-CANCELLED items are not all COMPLETED" }
  - { id: ERR_PREDETERMINATION_NOT_APPROVED, http: 409, condition: "Scheduling an item that requires predetermination whose predetermination is not APPROVED" }
  - { id: ERR_ITEM_NOT_COMPLETED, http: 409, condition: "Claim create attempted on an item not in COMPLETED" }
  - { id: ERR_CLAIM_MISSING_ATTACHMENT, http: 409, condition: "Submit attempted on a claim with no attachments" }
  - { id: ERR_CLAIM_NOT_SUBMITTED, http: 409, condition: "Adjudicate attempted before submission_status is SUBMITTED/ACKNOWLEDGED" }
  - { id: ERR_CLAIM_NOT_VOIDABLE, http: 409, condition: "Void attempted on a claim not in PAID/PARTIALLY_PAID" }
  - { id: ERR_CLAIM_HAS_ACTIVE_PAYMENT_PLAN, http: 409, condition: "Void attempted on a claim with an ACTIVE PaymentPlan" }
  # --- referential / business ---
  - { id: ERR_PROVIDER_TYPE_MISMATCH, http: 409, condition: "HYGIENIST provider assigned to an OPERATIVE appointment, or inactive/closed resource, or coverage patient mismatch" }
  - { id: ERR_PATIENT_INACTIVE, http: 409, condition: "Operation requires Patient.status==ACTIVE" }
  # --- temporal ---
  - { id: ERR_OPERATORY_DOUBLE_BOOKED, http: 409, condition: "Appointment chair-time overlaps an existing non-terminal appointment on the same operatory (buffered) or provider (unbuffered)" }
  - { id: ERR_WAITING_PERIOD_NOT_MET, http: 409, condition: "MAJOR waiting period or same-cdt frequency gap not satisfied at predetermination create" }
  # --- fiscal ---
  - { id: ERR_ANNUAL_MAX_REACHED, http: 402, condition: "Coverage annual maximum already reached when requesting a benefit-bearing predetermination" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: FrontDesk
    description: "Front-desk staff: registration, operatories, scheduling, recare recall, plan accept/cancel."
    identity: opaque
    exclusive_operations:
      - "POST /patients — register patient"
      - "POST /patients/{id}/deactivate — deactivate patient"
      - "POST /providers — create provider"
      - "POST /providers/{id}/deactivate — deactivate provider"
      - "POST /operatories — create operatory"
      - "POST /operatories/{id}/close — close operatory"
      - "POST /appointments — schedule appointment"
      - "POST /appointments/{id}/check-in — check in"
      - "POST /appointments/{id}/cancel — cancel appointment"
      - "POST /appointments/{id}/no-show — mark no-show"
      - "POST /treatment-plans/{id}/accept — accept plan"
      - "POST /treatment-plans/{id}/cancel — cancel plan"
      - "POST /recare-recalls — create recall"
      - "POST /recare-recalls/{id}/fulfill — fulfill recall"
    shared_operations:
      - "GET reads across patients, providers, operatories, coverages, plans, items, appointments, predeterminations, claims, recalls"
      - "POST /_clock/set — set test clock (shared with BillingSpecialist)"

  - name: Clinician
    description: "Dentist/hygienist: charting, treatment planning, plan propose/revise/complete, visit completion."
    identity: entity_backed:Provider
    exclusive_operations:
      - "POST /patients/{id}/tooth-chart — record chart entry"
      - "POST /treatment-plans — create plan"
      - "POST /treatment-plans/{id}/items — add item"
      - "POST /treatment-plans/{id}/propose — propose plan"
      - "POST /treatment-plans/{id}/revise — revise plan"
      - "POST /treatment-plans/{id}/complete — complete plan"
      - "POST /appointments/{id}/complete — complete visit"
    shared_operations:
      - "GET reads across all resources"

  - name: BillingSpecialist
    description: "Insurance/billing: plans, coverages, predetermination, claims/attachments, adjudication, payment plans."
    identity: opaque
    exclusive_operations:
      - "POST /insurance-plans — create plan config"
      - "POST /patient-coverages — attach coverage"
      - "POST /patient-coverages/{id}/terminate — terminate coverage"
      - "POST /predeterminations — request predetermination"
      - "POST /predeterminations/{id}/approve — approve"
      - "POST /predeterminations/{id}/deny — deny"
      - "POST /claims — create claim"
      - "POST /claims/{id}/attachments — attach document"
      - "POST /claims/{id}/submit — submit claim"
      - "POST /claims/{id}/adjudicate — adjudicate"
      - "POST /claims/{id}/deny — deny claim"
      - "POST /claims/{id}/void — void claim"
      - "POST /payment-plans — create payment plan"
      - "POST /payment-plans/{id}/post-installment — post installment"
      - "POST /payment-plans/{id}/reverse-installment — reverse installment"
      - "POST /payment-plans/{id}/default — default plan"
    shared_operations:
      - "GET reads across all resources"
      - "POST /_clock/set — set test clock (shared with FrontDesk)"

  - name: Patient
    description: "Patient self-service read of own records."
    identity: entity_backed:Patient
    exclusive_operations: []
    shared_operations:
      - "GET /patients/{id} — own record"
      - "GET /tooth-chart-entries?patient_id — own chart"
      - "GET /tooth-chart-entries/{id} — own chart entry"
      - "GET /patient-coverages/{id} — own coverage"
      - "GET /treatment-plans/{id} — own plan"
      - "GET /treatment-plan-items?treatment_plan_id — own plan items"
      - "GET /treatment-plan-items/{id} — own item"
      - "GET /appointments/{id} — own appointment"
      - "GET /claims/{id} — own claim"
      - "GET /recare-recalls/{id} — own recall"
      - "GET /payment-plans/{id} — own payment plan"
