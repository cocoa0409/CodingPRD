        claim_type: peer_roles
        grounds: [roles.ConciergeAgent, roles.AccountManager, endpoints.POST./concierge/members]
        distinguishing_aspect: "A ConciergeAgent calling POST /concierge/members (an AccountManager-exclusive op) is rejected with ERR_FORBIDDEN_ROLE (403)."
