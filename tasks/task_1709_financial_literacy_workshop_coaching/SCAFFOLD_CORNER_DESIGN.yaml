          assert:
            - "err == ERR_FORBIDDEN"

      - name: coach_cannot_suspend_coach_returns_403
        claim_type: rbac_deny
        grounds:
          - roles
          - errors[ERR_FORBIDDEN]
        distinguishing_aspect: "Coach calling ProgramAdmin-exclusive POST /coaches/{id}/suspend gets ERR_FORBIDDEN even for another coach's record."
        test_recipe:
          setup: ["two certified coaches K1, K2"]
          setup_api_calls:
            - { call: "POST /coaches", payload: { full_name: "CK1", email: "ck1@x.org", max_caseload: 5 }, as: ProgramAdmin, captures: { c1: "$.data.id" } }
            - { call: "POST /coaches", payload: { full_name: "CK2", email: "ck2@x.org", max_caseload: 5 }, as: ProgramAdmin, captures: { c2: "$.data.id" } }
            - { call: "POST /coaches/${c1}/certify", payload: {}, as: ProgramAdmin }
            - { call: "POST /coaches/${c2}/certify", payload: {}, as: ProgramAdmin }
          trigger:
            - { call: "POST /coaches/${c2}/suspend", payload: {}, as: Coach, as_user_id: "${c1}", captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_FORBIDDEN"

      - name: unassigned_coach_cannot_mark_attendance_returns_403
        claim_type: rbac_deny
        grounds:
          - roles
          - validations[priority=2]
        distinguishing_aspect: "Coach role IS allowed on mark-attendance, but ownership fails: the acting coach is not the workshop's coach_id -> ERR_FORBIDDEN."
        test_recipe:
