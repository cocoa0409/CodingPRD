              as: VenueAdmin
              as_user_id: "admin-1"
              captures: { err_missing: $.data.error_id }
            - call: "POST /events/${ev1_id}/gates"
              payload: { gate_code: "GX", access_zone_id: "${z2_id}", throughput_per_minute: 20 }
              as: VenueAdmin
              as_user_id: "admin-1"
              captures: { err_cross: $.data.error_id }
            - call: "POST /events/${ev1_id}/gates"
              payload: { gate_code: "G1", access_zone_id: "${z1_id}", throughput_per_minute: 20 }
              as: VenueAdmin
              as_user_id: "admin-1"
              captures: { g_id: $.data.id, g_zone: $.data.access_zone_id, g_lanes: $.data.lanes_open, g_status: $.data.status }
            - call: "POST /events/${ev1_id}/advance-status"
              payload: { target_status: "ON_SALE" }
              as: VenueAdmin
