          - entities.Booking.fields.pricing_tier
        distinguishing_aspect: |
          Boundary on the peak-window metric via POST bookings: with peak window [7,15), a slot at
          local_hour=15 is OFF_PEAK (15 is excluded), priced at offpeak_fee_cents; local_hour=14 is PEAK.
          Tests the exact >= start AND < end edge.
        test_recipe:
          setup:
            - "Course peak_start_hour=7, peak_end_hour=15, peak_fee_cents=8000, offpeak_fee_cents=5000, PUBLIC golfer."
            - "Slot at local_hour=15 (the exclusive end boundary). Clock 2026-06-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ProShop
            - call: "POST /golf/courses"
