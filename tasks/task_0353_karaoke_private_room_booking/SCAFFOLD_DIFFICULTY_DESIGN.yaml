          assert:
            - "Reservation.${res_id}.status == NO_SHOW"
            - "Customer.${cust_id}.no_show_strikes == 1"
            - "QueueEntry.${q_id}.status == CANCELLED"
            - "GET /venues/${v_id}/reservations/${res_id}/payments includes one Payment with kind == FORFEIT and amount_cents == 3600"

      # ---- Instance 2 (depth >=2): close -> {settlement payment, queue SKIPPED, room AVAILABLE} ----
      - name: close_cascade_room_release_depth2
        grounds:
          - state_machines.Reservation.CHECKED_IN_to_CLOSED
