        grounds: [roles, endpoints, "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "POST /shifts is CashierAttendant-exclusive; a StationManager gets ERR_FORBIDDEN 403 (peer-role separation)."
        test_recipe:
          setup: ["One station."]
          setup_api_calls:
            - call: "POST /stations"
              payload: { name: "S", brand: "Acme" }
              as: StationManager
              captures: { st: $.data.id }
          trigger:
            - call: "POST /shifts"
              payload: { station_id: "${st}", opening_float_cents: 20000 }
              as: StationManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 403"
            - "data.error_id == ERR_FORBIDDEN"

      - name: non_owner_cashier_cannot_close_shift
        claim_type: ownership_denied
        grounds: ["validations[priority=5]", roles, "errors[ERR_NOT_SHIFT_OWNER]"]
        distinguishing_aspect: "A different CashierAttendant (cash2) closing cash1's shift gets ERR_NOT_SHIFT_OWNER 403 — entity-level owner check on cashier_user_id."
        test_recipe:
          setup: ["A COUNTING shift owned by cash1."]
          setup_api_calls:
            - call: "POST /stations"
              payload: { name: "S", brand: "Acme" }
              as: StationManager
              captures: { st: $.data.id }
            - call: "POST /shifts"
              payload: { station_id: "${st}", opening_float_cents: 20000 }
              as: CashierAttendant
              as_user_id: "cash1"
              captures: { sh: $.data.id }
            - call: "POST /shifts/${sh}/begin-count"
              payload: {}
              as: CashierAttendant
              as_user_id: "cash1"
              captures: { sh_v: $.data.version }
          trigger:
            - call: "POST /shifts/${sh}/close"
              payload: { counted_drawer_cents: 20000, expected_shift_version: "${sh_v}" }
              as: CashierAttendant
              as_user_id: "cash2"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 403"
            - "data.error_id == ERR_NOT_SHIFT_OWNER"

      - name: missing_auth_header_unauthenticated
        claim_type: auth_required
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request without X-User-Role/X-User-ID returns ERR_UNAUTHENTICATED 401 before any other check."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /stations/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 401"
            - "data.error_id == ERR_UNAUTHENTICATED"

  # =========================================================================
  # Cross-Cutting Complexity Layers — OCC stale-version
  # =========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_tank_version_on_delivery_post
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[deliver-into-stale-tank]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Posting delivery d2 with expected_tank_version equal to the version observed before d1 was posted (now stale) returns ERR_STALE_VERSION 412."
        test_recipe:
          setup: ["Tank with version observed as tk_v0; delivery d1 posted (bumps tank version); a second delivery d2 still carries the stale tk_v0."]
          setup_api_calls:
            - call: "POST /stations"
              payload: { name: "S", brand: "Acme" }
              as: StationManager
              captures: { st: $.data.id }
            - call: "POST /fuel-grades"
              payload: { station_id: "${st}", code: "REGULAR", octane: 87 }
              as: StationManager
              captures: { gr: $.data.id }
            - call: "POST /tanks"
              payload: { station_id: "${st}", fuel_grade_id: "${gr}", label: "T1", capacity_gallons: 10000, reorder_point_gallons: 1500 }
              as: StationManager
              captures: { tk: $.data.id, tk_v0: $.data.version }
            - call: "POST /deliveries"
              payload: { station_id: "${st}", tank_id: "${tk}", vendor_name: "DSD", net_gallons: 1000, unit_cost_cents: 280 }
              as: StationManager
              captures: { d1: $.data.id }
            - call: "POST /deliveries/${d1}/post"
              payload: { expected_tank_version: "${tk_v0}" }
              as: StationManager
            - call: "POST /deliveries"
              payload: { station_id: "${st}", tank_id: "${tk}", vendor_name: "DSD", net_gallons: 1000, unit_cost_cents: 280 }
              as: StationManager
              captures: { d2: $.data.id }
          trigger:
            - call: "POST /deliveries/${d2}/post"
              payload: { expected_tank_version: "${tk_v0}" }
              as: StationManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 412"
            - "data.error_id == ERR_STALE_VERSION"

      - name: occ_stale_shift_version_on_settle
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[settle-into-stale-shift]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Settling t2 with expected_shift_version captured before t1's settle (which bumped the shift) returns ERR_STALE_VERSION 412."
        test_recipe:
          setup: ["Two CAPTURED CASH fuel sales t1, t2 on the same OPEN shift; shift version captured once as sh_v1 before either settles."]
          setup_api_calls:
            - call: "POST /stations"
              payload: { name: "S", brand: "Acme" }
              as: StationManager
              captures: { st: $.data.id }
            - call: "POST /fuel-grades"
              payload: { station_id: "${st}", code: "REGULAR", octane: 87 }
              as: StationManager
              captures: { gr: $.data.id }
            - call: "POST /fuel-grades/${gr}/reprice"
              payload: { new_price_cents: 419 }
              as: StationManager
            - call: "POST /tanks"
              payload: { station_id: "${st}", fuel_grade_id: "${gr}", label: "T1", capacity_gallons: 10000, reorder_point_gallons: 1500 }
              as: StationManager
              captures: { tk: $.data.id, tk_v0: $.data.version }
            - call: "POST /pumps"
              payload: { station_id: "${st}", tank_id: "${tk}", number: 1 }
              as: StationManager
              captures: { pm: $.data.id }
            - call: "POST /deliveries"
              payload: { station_id: "${st}", tank_id: "${tk}", vendor_name: "DSD", net_gallons: 5000, unit_cost_cents: 280 }
              as: StationManager
              captures: { d1: $.data.id }
            - call: "POST /deliveries/${d1}/post"
              payload: { expected_tank_version: "${tk_v0}" }
              as: StationManager
            - call: "POST /shifts"
              payload: { station_id: "${st}", opening_float_cents: 20000 }
              as: CashierAttendant
              as_user_id: "cash1"
              captures: { sh: $.data.id, sh_v1: $.data.version }
            - call: "POST /fuel-transactions"
              payload: { station_id: "${st}", pump_id: "${pm}", shift_id: "${sh}", gallons: 12, tender: "CASH" }
              as: CashierAttendant
              captures: { t1: $.data.id }
            - call: "POST /fuel-transactions/${t1}/capture"
              payload: {}
              as: CashierAttendant
            - call: "POST /fuel-transactions"
              payload: { station_id: "${st}", pump_id: "${pm}", shift_id: "${sh}", gallons: 10, tender: "CASH" }
              as: CashierAttendant
              captures: { t2: $.data.id }
            - call: "POST /fuel-transactions/${t2}/capture"
              payload: {}
              as: CashierAttendant
            - call: "POST /fuel-transactions/${t1}/settle"
              payload: { expected_shift_version: "${sh_v1}" }
              as: CashierAttendant
          trigger:
            - call: "POST /fuel-transactions/${t2}/settle"
              payload: { expected_shift_version: "${sh_v1}" }
              as: CashierAttendant
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 412"
            - "data.error_id == ERR_STALE_VERSION (sh_v1 went stale when t1 settled)"

  # =========================================================================
