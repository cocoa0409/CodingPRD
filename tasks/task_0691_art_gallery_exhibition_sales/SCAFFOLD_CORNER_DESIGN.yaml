        distinguishing_aspect: "buyer_total 400000: pay 300000 (PARTIALLY_PAID) then pay 150000 -> would reach 450000 -> ERR_OVERPAYMENT 409."
        test_recipe:
          setup: ["Invoiced sale buyer_total 400000 (buyer NY); one 300000 payment posted."]
          setup_api_calls:
            - call: "POST /galleries"
              payload: { name: "Ovp", home_state_code: "CA", sales_tax_rate_bps: 875, default_consignment_split_bps: 5000 }
              as: GalleryAdmin
              captures: { g: $.data.id }
            - call: "POST /artists"
              payload: { gallery_id: "${g}", full_name: "Op2 A" }
              as: GalleryAdmin
              captures: { a: $.data.id }
            - call: "POST /artworks"
              payload: { gallery_id: "${g}", artist_id: "${a}", title: "Op2 W", list_price_cents: 400000, insured_value_cents: 400000 }
              as: GalleryAdmin
              captures: { aw: $.data.id }
            - call: "POST /sales"
              payload: { gallery_id: "${g}", artwork_id: "${aw}", buyer_name: "Op2 B", buyer_state_code: "NY", gross_amount_cents: 400000 }
              as: SalesAssociate
              captures: { s: $.data.id }
            - call: "POST /sales/${s}/invoice"
              payload: {}
              as: SalesAssociate
              captures: { sv: $.data.version }
            - call: "POST /sales/${s}/payments"
              payload: { amount_cents: 300000, expected_sale_version: "${sv}" }
              as: SalesAssociate
              captures: { sv2: $.data.version }
          trigger:
            - call: "POST /sales/${s}/payments"
              payload: { amount_cents: 150000, expected_sale_version: "${sv2}" }
