      - name: shed_key_lifecycle_overdue_loss_and_standing_gates
        claim_type: side_effect_execution
        grounds: [state_machines.ShedKey, "errors[ERR_KEY_LIMIT_EXCEEDED]", "errors[ERR_VOLUNTEER_NOT_IN_GOOD_STANDING]", "errors[ERR_INVALID_KEY_STATE]", entities.Volunteer.fields.held_key_count]
        distinguishing_aspect: "Key lifecycle exercises four rules at once: one-key-per-holder quota, scheduler-driven CHECKED_OUT -> OVERDUE at due_back_at, LOST cascading holder standing GOOD -> PROBATION, and PROBATION then blocking any further checkout (ERR_VOLUNTEER_NOT_IN_GOOD_STANDING)."
        test_recipe:
          setup: ["keys K1, K2 registered; holder H oriented+signed+GOOD"]
          setup_api_calls:
            - { call: "POST /api/volunteers", payload: { full_name: "Holder", email: "h@x.com", date_of_birth: "1990-05-20" }, as: GardenAdmin, captures: { h_id: $.data.id } }
            - { call: "POST /api/volunteers/${h_id}/orientation/complete", as: GardenAdmin }
            - { call: "POST /api/volunteers/${h_id}/waiver/sign", as: GardenAdmin }
            - { call: "POST /api/shed-keys", payload: { key_code: "K-1" }, as: GardenAdmin, captures: { k1: $.data.id } }
            - { call: "POST /api/shed-keys", payload: { key_code: "K-2" }, as: GardenAdmin, captures: { k2: $.data.id } }
          trigger:
            - { call: "POST /api/shed-keys/${k1}/transition", payload: { to_state: "CHECKED_OUT", holder_volunteer_id: "${h_id}", due_back_at: "2026-08-05T00:00:00Z" }, as: GardenAdmin, captures: { k1_st: $.data.status } }
            - { call: "POST /api/shed-keys/${k2}/transition", payload: { to_state: "CHECKED_OUT", holder_volunteer_id: "${h_id}", due_back_at: "2026-08-06T00:00:00Z" }, as: GardenAdmin, captures: { err_limit: $.data.error_id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-06T00:00:00Z" }, as: GardenAdmin }
            - { call: "POST /api/_scheduler/run_epoch", as: GardenAdmin }
            - { call: "GET /api/shed-keys/${k1}", as: GardenAdmin, captures: { k1_overdue: $.data.status } }
            - { call: "POST /api/shed-keys/${k1}/transition", payload: { to_state: "RETURNED" }, as: GardenAdmin, captures: { k1_ret: $.data.status } }
            - { call: "POST /api/shed-keys/${k1}/transition", payload: { to_state: "RETURNED" }, as: GardenAdmin, captures: { err_rereturn: $.data.error_id } }
            - { call: "POST /api/shed-keys/${k2}/transition", payload: { to_state: "CHECKED_OUT", holder_volunteer_id: "${h_id}", due_back_at: "2026-08-07T00:00:00Z" }, as: GardenAdmin }
            - { call: "POST /api/shed-keys/${k2}/transition", payload: { to_state: "LOST" }, as: GardenAdmin, captures: { k2_lost: $.data.status } }
            - { call: "GET /api/volunteers/${h_id}", as: GardenAdmin, captures: { h_stand: $.data.standing, h_keys: $.data.held_key_count } }
            - { call: "POST /api/shed-keys/${k1}/transition", payload: { to_state: "CHECKED_OUT", holder_volunteer_id: "${h_id}", due_back_at: "2026-08-08T00:00:00Z" }, as: GardenAdmin, captures: { err_standing: $.data.error_id } }
          assert:
            - "k1_st == CHECKED_OUT"
            - "err_limit == ERR_KEY_LIMIT_EXCEEDED (held_key_count already 1)"
            - "k1_overdue == OVERDUE (epoch past due_back_at 2026-08-05)"
            - "k1_ret == RETURNED and holder cleared"
            - "err_rereturn == ERR_INVALID_KEY_STATE (AVAILABLE key cannot be returned)"
            - "k2_lost == LOST and h_stand == PROBATION (loss cascade) and h_keys == 0"
            - "err_standing == ERR_VOLUNTEER_NOT_IN_GOOD_STANDING (PROBATION blocks checkout)"

      - name: shed_key_registry_cap_at_four
        claim_type: capacity_boundary
        grounds: ["errors[ERR_KEY_REGISTRY_FULL]", "validations[priority=14]"]
        distinguishing_aspect: "The shed has a global registry cap of 4 non-RETIRED keys; the 5th registration fails while exactly 4 succeed."
