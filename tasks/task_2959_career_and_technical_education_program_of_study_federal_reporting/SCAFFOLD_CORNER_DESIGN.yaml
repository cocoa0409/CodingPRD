      - name: admin_cap_cents_is_five_percent_of_allocation_rounded_half_up
        claim_type: constants_applied
        grounds:
          - calculations.grant_obligation_rollup
          - entities.GrantAward.fields.admin_cap_cents
          - endpoints[POST /cte/grant-awards]
        distinguishing_aspect: |
          ADMIN_CAP_PCT is 0.05 and the scaffold pins round_half_up, so three allocations are chosen to straddle a
          half-cent tie: 4999990 gives an exact .5 remainder that must round UP to 250000, 4999989 must round DOWN to
          249999, and 5000000 lands exactly on 250000. A banker's-rounding or truncating implementation returns 249999
          for the first allocation and is caught here; the freshly created rows must also all report indirect_rate 0.0812,
          the tier for a direct total of zero.
        test_recipe:
          setup:
            - "Empty database. The logical clock is pinned to its startup default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CteDirector
              as_user_id: "u_dir_1"
          trigger:
            - call: "POST /cte/grant-awards"
              payload: { fiscal_year: 2026, allocation_cents: 4999990, obligation_window_start: "2026-07-01", obligation_window_end: "2027-06-30" }
              as: GrantFiscalOfficer
              as_user_id: "u_fis_1"
              captures: { ga_id: $.data.id, ga_cap: $.data.admin_cap_cents, ga_rate: $.data.indirect_rate, ga_rem: $.data.remaining_cents }
            - call: "POST /cte/grant-awards"
              payload: { fiscal_year: 2027, allocation_cents: 4999989, obligation_window_start: "2026-07-01", obligation_window_end: "2027-06-30" }
              as: GrantFiscalOfficer
              as_user_id: "u_fis_1"
              captures: { gb_id: $.data.id, gb_cap: $.data.admin_cap_cents, gb_rate: $.data.indirect_rate, gb_rem: $.data.remaining_cents }
            - call: "POST /cte/grant-awards"
              payload: { fiscal_year: 2028, allocation_cents: 5000000, obligation_window_start: "2026-07-01", obligation_window_end: "2027-06-30" }
              as: GrantFiscalOfficer
              as_user_id: "u_fis_1"
              captures: { gc_id: $.data.id, gc_cap: $.data.admin_cap_cents, gc_rate: $.data.indirect_rate, gc_rem: $.data.remaining_cents }
          assert:
            - "${ga_cap} == 250000"
            - "${gb_cap} == 249999"
            - "${gc_cap} == 250000"
            - "${ga_rate} == 0.0812 and ${gb_rate} == 0.0812 and ${gc_rate} == 0.0812"
            - "${ga_rem} == 4999990 and ${gb_rem} == 4999989 and ${gc_rem} == 5000000"
            - "GrantAward.${ga_id}.direct_obligated_cents == 0 and indirect_pool_cents == 0 and obligated_cents == 0 and admin_obligated_cents == 0"
            - "GrantAward.${ga_id}.status == OPEN"

