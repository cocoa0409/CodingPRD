  - section: calculations
    instances:
      - name: spoilage_fifo_variant_cost
        claim_type: Variant Selection
        grounds: [calculations.spoilage_valuation, entities.Venue.fields.spoilage_valuation]
        distinguishing_aspect: "Under FIFO (the variant §1.8 did NOT test), the same 120-bun SPILLAGE across lots 100@30 then 100@50 costs 4000 = 100*30 + 20*50, not the 4800 weighted-average figure."
        test_recipe:
          setup: ["Venue spoilage_valuation=FIFO; stand with bun lot A 100@30 (older) then lot B 100@50; SPILLAGE 120."]
          setup_api_calls:
            - call: "POST /concessions/venues"
              payload: { name: "V15", venue_share_pct: 10, share_basis: "GROSS", spoilage_valuation: "FIFO", service_fee_pct: 0 }
              as: ConcessionsManager
              captures: { v_id: $.data.id }
            - call: "POST /concessions/products"
              payload: { venue_id: "${v_id}", sku: "BUN", name: "Bun", base_price_cents: 0, unit_cost_cents: 30, perishable: true }
              as: ConcessionsManager
              captures: { p_id: $.data.id }
            - call: "POST /concessions/events"
              payload: { venue_id: "${v_id}", name: "E15", doors_time: "2026-07-14T18:00:00.000Z", end_time: "2026-07-14T23:00:00.000Z" }
              as: ConcessionsManager
              captures: { e_id: $.data.id }
            - call: "POST /concessions/events/${e_id}/open-doors"
              payload: {}
              as: ConcessionsManager
            - call: "POST /concessions/stands"
              payload: { event_id: "${e_id}", name: "S15", demand_tier: "MID", expected_orders_per_hour: 40 }
              as: ConcessionsManager
              captures: { s_id: $.data.id }
            - call: "POST /concessions/inventory-lots"
              payload: { stand_id: "${s_id}", product_id: "${p_id}", received_qty: 100, unit_cost_cents: 30, par_level: 200, reorder_point: 20 }
              as: StockRunner
            - call: "POST /concessions/inventory-lots"
              payload: { stand_id: "${s_id}", product_id: "${p_id}", received_qty: 100, unit_cost_cents: 50, par_level: 200, reorder_point: 20 }
              as: StockRunner
          trigger:
            - call: "POST /concessions/waste-records"
