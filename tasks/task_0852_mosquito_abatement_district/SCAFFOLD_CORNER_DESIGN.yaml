              payload: { action: "ASSIGN", assigned_applicator_id: "${tech_id}" }
              as: AbatementManager
              as_user_id: "u-mgr-1"
          trigger:
            - call: "POST /service-requests/${req_id}/transitions"
              payload: { action: "INSPECT" }
              as: FieldTech
              as_user_id: "${tech_id}"
              captures: { handling_mid: $.data.handling_status, verification_mid: $.data.verification_status }
            - call: "POST /service-requests/${req_id}/transitions"
              payload: { action: "RESOLVE", resolution_note: "Closing without a finding" }
