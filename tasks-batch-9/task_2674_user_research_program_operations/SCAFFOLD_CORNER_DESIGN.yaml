      - name: evidence_strength_ignores_links_of_purged_artifacts
        claim_type: Input Set Filtering
        excluded_because:
          difficulty_instance: consent_revocation_five_hop_evidence_withdrawal
          rationale: "The §1.8 transitive_cascade instance recomputes evidence_strength after a revocation purges an artifact and asserts that the inadmissible link leaves both the strength and distinct_participant_count, which is exactly the input-set-filtering claim for this calculation."
      - name: per_link_contributions_are_rounded_before_they_are_summed
        claim_type: Precision
        excluded_because:
          difficulty_instance: evidence_strength_rounds_per_link_then_sums
          rationale: "The §1.8 combinatorial_formula instance is built precisely to separate round-then-sum from sum-then-round on a DIARY_STUDY multiplier where the two orders differ in the second decimal."
      - name: urgency_multiplier_at_the_fourteen_day_edge
        claim_type: threshold
        excluded_because:
          difficulty_instance: triage_urgency_multiplier_at_exactly_fourteen_days
          rationale: "The §1.8 boundary_precision_check instance triages the same request at 15, 14 and 13 days to deadline, covering threshold-1 / threshold / threshold+1 for request_priority_score."
      - name: surcharge_tier_boundaries_on_pool_utilization
        claim_type: tiered_pricing
        excluded_because:
          difficulty_instance: reservation_surcharge_at_exactly_half_utilization
          rationale: "The §1.8 boundary_precision_check instance sits utilization exactly on 0.50 and shows the 5 percent band applying, while reservation_surcharge_reads_pre_state_utilization covers the cross-tier walk inside one batch."
      - name: forward_estimate_counts_pending_recruitments
        claim_type: forward_looking
        excluded_because:
          difficulty_instance: incentive_forward_estimate_vs_chronological_actual
          rationale: "The §1.8 dual_variant_calc instance runs FORWARD_ESTIMATE over open recruitments and re-runs it after the set changes, which is the forward-looking claim for incentive_settlement."
      - name: settlement_pays_in_created_at_order
        claim_type: waterfall_allocation
        excluded_because:
          difficulty_instance: incentive_forward_estimate_vs_chronological_actual
          rationale: "The same §1.8 instance walks CHRONOLOGICAL_ACTUAL in created_at order across COMPLETED, SCREENED_OUT and unfielded rows, so the waterfall ordering and remainder handling are already asserted."
      - name: variant_switch_reconciles_the_pool_ledger
        claim_type: Reconciliation
        excluded_because:
          difficulty_instance: incentive_forward_estimate_vs_chronological_actual
          rationale: "The §1.8 instance asserts the ledger delta at the moment the advisory estimate is replaced by the binding settlement, which is the reconciliation claim."
      - name: provisional_and_corroborated_diverge_on_the_same_links
        claim_type: Variant Divergence
        excluded_because:
          difficulty_instance: finding_strength_provisional_vs_corroborated
          rationale: "The §1.8 dual_variant_calc instance computes both variants over an identical link set and asserts the exact delta, covering divergence in full."
      - name: variant_follows_the_findings_status
        claim_type: Variant Selection
        excluded_because:
          difficulty_instance: finding_strength_provisional_vs_corroborated
          rationale: "The same §1.8 instance shows PROVISIONAL applying while the finding is DRAFT and CORROBORATED taking over on lock, including the unlock path back to PROVISIONAL."
      - name: session_intervals_are_compared_as_half_open_ranges
        claim_type: interval_merge
        excluded_because:
          difficulty_instance: participant_session_buffer_is_half_open_on_both_sides
          rationale: "The §1.8 resource_temporal_overlap instance tests abutting, buffer-adjacent and overlapping session intervals for one participant, which covers the interval arithmetic claims."
      - name: pool_ledger_totals_survive_add_and_reversal
        claim_type: aggregation
        excluded_because:
          difficulty_instance: pool_cents_conserved_when_invitations_are_withdrawn
          rationale: "The §1.8 compensating_invariant instance asserts the running pool totals after each reservation and after each release, covering running-total-after-add and after-reversal."
  - section: validations
    instances:
      - name: duplicate_external_ref_inside_one_pool_is_rejected
        claim_type: Violation → Error
        grounds:
          - validations[priority 50] ERR_DUPLICATE_EXTERNAL_REF
          - entities.Participant.external_ref
        distinguishing_aspect: "The uniqueness scope is the pool, not the installation: the same customer reference is refused inside one pool and accepted in a second pool."
        test_recipe:
          setup:
            - "Two pools, the first already holding participant P-A01"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ResearchOpsAdmin
              as_user_id: "u_ops_1"
            - call: "POST /participant-pools"
              payload: { name: "Dup pool A", pool_type: "CUSTOMER_LIST", contact_cap_per_window: 2, contact_window_days: 30, incentive_budget_cents: 100000 }
              as: ResearchOpsAdmin
              as_user_id: "u_ops_1"
              captures: { pool_a: $.data.id }
            - call: "POST /participant-pools"
              payload: { name: "Dup pool B", pool_type: "EXTERNAL_PANEL", contact_cap_per_window: 2, contact_window_days: 30, incentive_budget_cents: 100000 }
              as: ResearchOpsAdmin
              as_user_id: "u_ops_1"
              captures: { pool_b: $.data.id }
            - call: "POST /participant-pools/${pool_a}/participants"
              payload: { external_ref: "P-A01", segment: "POWER_USER", locale: "en-US", pii_on_file: true }
              as: ResearchOpsAdmin
              as_user_id: "u_ops_1"
          trigger:
            - call: "POST /participant-pools/${pool_a}/participants"
              payload: { external_ref: "P-A01", segment: "NEW_USER", locale: "de-DE", pii_on_file: false }
              as: ResearchOpsAdmin
              as_user_id: "u_ops_1"
            - call: "POST /participant-pools/${pool_b}/participants"
