        distinguishing_aspect: >-
          The same two roles split on two endpoints of the same entity: both may register a prescriber,
          but only the LabManager may change standing, so the optician's PATCH is refused while the
          manager's identical PATCH succeeds and fires the standing cascade.
        test_recipe:
          setup:
