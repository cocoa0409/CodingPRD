              as: IntakeCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "FeeWaiverRequest.${fwr_id}.required_document_count == 4"
            - "error_id == ERR_FEE_WAIVER_DOCS_INSUFFICIENT; status remains DRAFT"

