            - call: "POST /studios"
              payload: { legal_name: "Northlight Studio", contact_email: "dev@northlight.example", country_code: "SE" }
              as: PlatformAdmin
              captures: { studio_id: $.data.id }
            - call: "POST /studios"
              payload: { legal_name: "Farshore Games", contact_email: "hi@farshore.example", country_code: "PL" }
              as: PlatformAdmin
              captures: { other_studio_id: $.data.id }
            - call: "POST /publishers"
