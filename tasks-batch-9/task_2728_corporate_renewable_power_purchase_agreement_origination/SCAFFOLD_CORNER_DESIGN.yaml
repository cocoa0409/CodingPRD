          assert:
            - "before the trigger Deal.${deal_id}.status == EXECUTED, cp_total_count == 3, cp_completion_pct == 0.00, posted_credit_support_usd == 500000.00 and released_credit_support_usd == 0"
            - "before the trigger ConditionPrecedent.${cp_permit_id}.status == FAILED with cure_deadline == 2026-08-16T00:00:00Z and resolved_by_user_id == u_orig_1, while the other two are PENDING"
            - "the trigger returns 200 with Deal.${deal_id}.status == TERMINATED, terminated_at == 2026-09-01T00:00:00Z and termination_reason == CP_FAILURE"
            - "both previously PENDING conditions precedent are now FAILED with resolved_at == 2026-09-01T00:00:00Z and cure_deadline null"
            - "ConditionPrecedent.${cp_permit_id} is still FAILED with resolved_by_user_id u_orig_1 and cure_deadline 2026-08-16T00:00:00Z - the cascade did not re-resolve the condition that vested the right"
            - "Deal.${deal_id}.cp_completion_pct == 0.00, recomputed over three FAILED rows (FAILED is not cleared)"
            - "CreditSupportInstrument.${cash_id}.status == RELEASED with closed_at == 2026-09-01T00:00:00Z - RELEASED and not DRAWN, because termination_reason is CP_FAILURE"
            - "Deal.${deal_id}.posted_credit_support_usd == 0, released_credit_support_usd == 500000.00 and drawn_credit_support_usd == 0, so the 500000.00 moved bucket to bucket without changing the total"
            - "Project.${project_id}.contracted_mw == 0 and available_mw == 100.000, so the 25.000 MW reservation was handed back"
            - "DealAllocation.${alloc_id}.status is unchanged at CONFIRMED, because the allocation-withdrawal sweep is declared only on the TERMS_AGREED termination path"

      - name: state_machine_cyclic_shape_negotiation_loop
        claim_type: cyclic
        grounds:
          - state_machines.Deal.TERMS_AGREED_to_UNDER_NEGOTIATION
          - state_machines.Deal.UNDER_NEGOTIATION_to_TERM_SHEET_ISSUED
        excluded_because:
          difficulty_instance: non_linear_state_machine / deal_negotiation_cycle_with_independent_credit_dimension
          rationale: "The named §1.8 instance drives the deal around the TERM_SHEET_ISSUED -> TERMS_AGREED -> UNDER_NEGOTIATION -> TERM_SHEET_ISSUED loop and asserts the loop counter, the re-pricing on each pass and the refusal to re-open once credit is APPROVED."

      - name: state_machine_parallel_dimensions_status_and_credit_status
        claim_type: parallel
        grounds:
          - state_machines.Deal.credit_status.SUBMITTED_to_DECLINED
          - state_machines.Deal.credit_status.DECLINED_to_SUBMITTED
        excluded_because:
          difficulty_instance: non_linear_state_machine / deal_negotiation_cycle_with_independent_credit_dimension
          rationale: "The same §1.8 instance moves the credit_status dimension through SUBMITTED -> DECLINED -> SUBMITTED -> APPROVED while the status dimension loops independently, and asserts the combined state after each write."

      - name: state_machine_branching_shape_condition_precedent_fork
        claim_type: branching
        grounds:
          - state_machines.ConditionPrecedent.PENDING_to_SATISFIED
          - state_machines.ConditionPrecedent.PENDING_to_WAIVED
          - state_machines.ConditionPrecedent.FAILED_to_PENDING
        excluded_because:
          difficulty_instance: non_linear_state_machine / condition_precedent_fail_recure_loop_then_three_way_fork
          rationale: "The named §1.8 instance exercises the FAIL/RECURE loop and then all three outbound forks (SATISFY, WAIVE, FAIL) from PENDING on three sibling conditions of one deal."

      - name: state_machine_guarded_transition_execute_requires_qualified_buyer
        claim_type: guarded transitions
        grounds:
          - state_machines.Deal.TERMS_AGREED_to_EXECUTED
          - validations.priority_11_ERR_OFFTAKER_NOT_QUALIFIED
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / execute_blocked_by_conditional_then_under_review_anchor_offtaker
          rationale: "The named §1.8 instance is exactly the cross-entity guard: the identical execute request is refused twice for the buyer's state and then succeeds once the buyer reaches QUALIFIED, with the deal untouched in between."

      - name: side_effect_bubble_up_cp_completion_drives_effective
        claim_type: bubble up
        grounds:
          - state_machines.Deal.EXECUTED_to_EFFECTIVE
          - calculations.cp_completion_pct
        excluded_because:
          difficulty_instance: transitive_cascade / milestone_advance_five_hop_cascade_to_effective_and_security_release
          rationale: "The named §1.8 instance asserts the bubble-up: the last child condition clearing takes cp_completion_pct to exactly 100.00 and the parent deal auto-transitions EXECUTED to EFFECTIVE in the same request."

      - name: side_effect_conditional_cascade_milestone_matches_cp_type
        claim_type: conditional cascade
        grounds:
          - endpoints.POST_/ppa/projects/{id}/advance-milestone
          - state_machines.ConditionPrecedent.PENDING_to_SATISFIED
        excluded_because:
          difficulty_instance: transitive_cascade / milestone_advance_five_hop_cascade_to_effective_and_security_release
          rationale: "The same §1.8 instance asserts that a project milestone satisfies only the PENDING condition whose cp_type matches that milestone and leaves the sibling conditions alone."

      - name: side_effect_ledger_sync_posted_support_totals
        claim_type: ledger sync
        grounds:
          - state_machines.CreditSupportInstrument.PROPOSED_to_POSTED
          - state_machines.CreditSupportInstrument.POSTED_to_RELEASED
        excluded_because:
          difficulty_instance: compensating_invariant / credit_support_usd_conserved_across_post_and_release
          rationale: "The named §1.8 instance reconciles the deal-level posted / released / drawn ledger against the child instruments after each post and each release."

      - name: side_effect_compensation_cancel_transfer_reverses_the_ledger
        claim_type: compensation
        grounds:
          - state_machines.EnvironmentalAttributeBatch.TRANSFERRED_to_MINTED
          - endpoints.POST_/ppa/attribute-batches/{id}/cancel-transfer
        excluded_because:
          difficulty_instance: compensating_invariant / attribute_mwh_conserved_across_transfer_and_cancel_transfer
          rationale: "The named §1.8 instance asserts that cancel-transfer reverses every side effect of transfer - the ledger bucket, the allocation breakdown and the recipient link - with no drift."

  - section: calculations
    instances:
      - name: sustainability_score_sums_all_four_additive_components_to_100_00
        claim_type: correct_result
        grounds:
          - calculations.offtaker_sustainability_score
          - endpoints.POST_/ppa/offtakers/{id}/submit-qualification
          - entities.Offtaker.fields.sustainability_score
        distinguishing_aspect: |
          The additive sustainability score is a separate chain from the weighted
          credit score, computed on the same request, and the two must not be
          confused. A buyer holding all four commitments scores exactly 100.00 =
          40 + 30 + 20 + 10, which is the only input combination that saturates the
          scale, and it is the combination that clears the QUALIFY gate of 70.00
          with room to spare while the credit score sits at 83.70.
        test_recipe:
          setup:
            - "No prior state beyond the logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /ppa/offtakers"
              payload: { legal_name: "Northwind Retail Inc", credit_rating: "A", rating_agency: "SP", reported_ebitda_usd: 60000000.00, net_debt_to_ebitda: 2.5, disclosure_framework: "CDP_AND_TCFD", has_science_based_target: true, re100_member: true, scope2_target_year: 2030 }
              as: Originator
              as_user_id: "u_orig_1"
              captures: { buyer_id: $.data.id }
          trigger:
            - call: "POST /ppa/offtakers/${buyer_id}/submit-qualification"
              payload: {}
              as: Originator
              as_user_id: "u_orig_1"
          assert:
            - "immediately after creation Offtaker.${buyer_id}.sustainability_score is null - creation computes nothing"
            - "the trigger returns 200 with sustainability_score == 100.00 = PTS_SBT 40 + PTS_RE100 30 + PTS_NEAR_TERM 20 + PTS_DISCLOSING 10"
            - "credit_score == 83.70 on the same response, so the additive chain and the weighted chain are both run and neither overwrites the other"
            - "qualification_status == UNDER_REVIEW and version == 2"

      - name: sustainability_near_term_year_boundary_2030_counts_2031_and_null_do_not
        claim_type: constants_applied
        grounds:
          - calculations.offtaker_sustainability_score
          - entities.Offtaker.fields.scope2_target_year
        distinguishing_aspect: |
          NEAR_TERM_YEAR is 2030 and the comparison is inclusive, so a 2030 target
          earns the 20 points and a 2031 target earns nothing - a one-year change in a
          single field moves the score by a full 20.00. The third buyer proves that an
          omitted scope2_target_year contributes 0 rather than raising an error, which
          is the failure mode a naive implementation hits by treating null as a
          comparison operand. All three buyers are otherwise identical, so the only
          moving part is the constant boundary.
        test_recipe:
          setup:
            - "Three buyers identical except for scope2_target_year: 2030, 2031 and omitted. All three declare a science-based target, no RE100 membership and disclosure_framework NONE, so the only variable component is the near-term one."
          setup_api_calls:
            - call: "POST /ppa/offtakers"
