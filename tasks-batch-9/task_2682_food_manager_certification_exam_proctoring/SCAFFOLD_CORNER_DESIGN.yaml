          - errors.ERR_PROCTOR_NOT_REMOTE_CERTIFIED
          - errors.ERR_SITE_LANGUAGE_UNSUPPORTED
          - errors.ERR_SITE_REQUIRED_FOR_IN_PERSON
        distinguishing_aspect: |
          Six distinct eligibility rejections all reachable from ONE candidate holding three codes, and each
          must name its own error rather than a generic 422: the jurisdiction rejects the form's accreditation
          body (ANSI_LEGACY) and the form's language (ES) separately; the proctor is rejected for the form's
          language and — separately — for not being remote_certified; the site is rejected for the form's
          language; and the site/mode pairing is rejected in BOTH directions (IN_PERSON without a site and
          REMOTE with one) under the same ERR_SITE_REQUIRED_FOR_IN_PERSON. Priority order is load-bearing: the
          ES sitting is booked at an ES site with an ES proctor, so an implementation that checked the site or
          proctor first would answer ERR_SITE_LANGUAGE_UNSUPPORTED instead of ERR_LANGUAGE_NOT_ACCEPTED.
