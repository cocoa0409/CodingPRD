  - rule_id: cross_entity_state_dependency
    instances:
      - name: claim_settlement_gated_by_schedule_warranty_status
        grounds:
          - validations[priority=21]
          - validations[priority=37]
          - state_machines.AircraftSchedule.warranty_status.COMPLIANT_to_BREACHED
          - state_machines.AircraftSchedule.warranty_status.BREACHED_to_WAIVED
          - state_machines.AircraftSchedule.coverage_status.ACTIVE_to_SUSPENDED_WARRANTY
          - state_machines.Claim.adjustment_status.RESERVED_to_SETTLED
          - calculations.hull_settlement_amount
        distinguishing_aspect: |
          The gate crosses Claim -> AircraftSchedule on the WARRANTY dimension, and the dependency is
          not merely "blocked / allowed": the schedule's warranty_status decides WHICH settlement
          bases exist. While warranty_status == BREACHED a RESERVED claim cannot be settled on any
          basis (ERR_PILOT_WARRANTY_BREACHED, priority 21, which outranks the basis rule at priority
          37). After a WAIVER the same claim settles - but only on DEPRECIATED_VALUE, because
          AGREED_VALUE demands warranty_status == COMPLIANT and a waived breach is permanently not
          compliant. The scaffold deliberately makes the reserve reachable while the hull is
          SUSPENDED_WARRANTY so that priority 21 is what fires, not the claim-state rule at 15.
        test_recipe:
          setup:
            - "Clock at 2026-08-15T00:00:00Z, advanced to 2026-11-01T00:00:00Z before the loss is notified."
            - "One BOUND FLEET policy, WORLDWIDE, base_hull_rate_ppm 18000, hull_deductible_ppm 15000, hull_aggregate_limit_cents 900000000."
            - "One INSTRUCTIONAL schedule on a 2016 airframe (hull_new_value_cents 66000000), agreed_value_cents 45000000, warranty driven to COMPLIANT by an EVIDENCE_VERIFIED finding; hull_premium_cents 1771875."
            - "One HULL_DAMAGE claim with loss_date 2026-10-15, a 40000000-cent assessment (ctl_ratio_ppm 888888, so ctl_flag true and loss_type promoted to TOTAL_LOSS), salvage TENDERED, RESERVED at 45000000 by adj-1."
