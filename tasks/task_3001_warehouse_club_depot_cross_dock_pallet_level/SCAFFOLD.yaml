    roles: [DepotPlanner]
    code: 200
    input: []
    output: CrossDockRun
    side_effects:
      - "allocations transition PROPOSED -> COMMITTED -> SHIPPED in allocation_score DESC, created_at ASC order"
      - "shipped pallets ALLOCATED -> SHIPPED"
      - "run -> COMMITTED, committed_at set; increments CrossDockRun.version by 1"
