          Recipe approval is checked at start, not at create: the job schedules happily against an unapproved
          recipe and only the start returns 409, after which approving the recipe lets the identical start
          through with changeover_minutes 60 (matching family, equal cavities, condition 90).
        test_recipe:
          setup:
            - "Furnace FUR-X12 with ACTIVE Campaign CMP-X12 and machine IS-X12"
            - "FLINT recipe BR-X12 created but NOT approved"
            - "APPROVED design BD-X12 (8 cavities) with AVAILABLE mold set MS-X12 (8 cavities, NNPB, condition 90)"
            - "SCHEDULED job PJ-X12 over 2026-08-01T00:00:00Z..2026-08-03T00:00:00Z"
          setup_api_calls:
            - call: "POST /glass-plant/furnaces"
              payload: { code: "FUR-X12", design_pull_tpd: 300.00, refractory_life_total_units: 100000.00 }
              as: PlantManager
              captures: { f: "$.data.id" }
            - call: "POST /glass-plant/campaigns"
              payload: { furnace_id: "${f}", code: "CMP-X12", target_pull_tpd: 300.00, window_start_at: "2026-08-01T00:00:00Z", window_end_at: "2026-08-11T00:00:00Z" }
              as: PlantManager
              captures: { cmp: "$.data.id" }
            - call: "POST /glass-plant/campaigns/${cmp}/activate"
              payload: {}
              as: PlantManager
            - call: "POST /glass-plant/batch-recipes"
              payload: { furnace_id: "${f}", code: "BR-X12", color: "FLINT", cullet_ratio_pct: 40.00, soda_ash_kg_per_ton: 180.00, colorant_kg_per_ton: 0.00 }
              as: BatchHouseTech
              captures: { br: "$.data.id" }
            - call: "POST /glass-plant/forming-machines"
              payload: { furnace_id: "${f}", code: "IS-X12", section_count: 10, max_cavities: 40, primary_mold_family: "NNPB", changeover_buffer_minutes: 45 }
              as: PlantManager
              captures: { m: "$.data.id" }
            - call: "POST /glass-plant/customers"
              payload: { name: "Zeta2 Filling", account_code: "CUST-X12", palletization_standard: "EURO_1200x800", complaint_ppm_threshold: 5000.00 }
              as: PlantManager
              captures: { c: "$.data.id" }
            - call: "POST /glass-plant/bottle-designs"
              payload: { customer_id: "${c}", code: "BD-X12", color: "FLINT", capacity_ml: 500.00, nominal_weight_g: 190.00, min_wall_thickness_mm: 1.80, cavity_count: 8, target_line_speed_bpm: 500.00, container_price_usd: 0.1500, mold_owner: "CUSTOMER" }
              as: MoldEngineer
              captures: { d: "$.data.id" }
            - call: "POST /glass-plant/bottle-designs/${d}/submit"
              payload: {}
              as: MoldEngineer
            - call: "POST /glass-plant/bottle-designs/${d}/risk-signoff"
              payload: {}
              as: QualityEngineer
              as_user_id: "qe-1"
            - call: "POST /glass-plant/bottle-designs/${d}/approve"
              payload: {}
              as: QualityEngineer
              as_user_id: "qe-2"
            - call: "POST /glass-plant/mold-sets"
              payload: { bottle_design_id: "${d}", code: "MS-X12", cavity_count: 8, mold_family: "NNPB", owner: "CUSTOMER", condition_score: 90 }
              as: MoldEngineer
              captures: { ms: "$.data.id" }
            - call: "GET /glass-plant/furnaces/${f}"
              payload: {}
              as: PlantScheduler
              captures: { fv: "$.data.version" }
            - call: "POST /glass-plant/production-jobs"
              payload: { campaign_id: "${cmp}", furnace_id: "${f}", forming_machine_id: "${m}", batch_recipe_id: "${br}", bottle_design_id: "${d}", mold_set_id: "${ms}", code: "PJ-X12", window_start_at: "2026-08-01T00:00:00Z", window_end_at: "2026-08-03T00:00:00Z", planned_pull_tpd: 300.00, expected_furnace_version: "${fv}" }
              as: PlantScheduler
              captures: { j: "$.data.id" }
          trigger:
            - call: "POST /glass-plant/production-jobs/${j}/start"
              payload: {}
              as: PlantScheduler
          assert:
            - "HTTP 409 and data.error_id == ERR_RECIPE_NOT_APPROVED"
            - "ProductionJob.${j}.status == SCHEDULED and changeover_minutes == 0"
            - "MoldSet.${ms}.status == AVAILABLE and FormingMachine.${m}.status == IDLE with mounted_cavities 0"
            - "BatchRecipe.${br}.approved == false"
            - "after POST /glass-plant/batch-recipes/${br}/approve the same start returns 200 with status RUNNING and changeover_minutes == 60"

      - name: campaign_activation_on_a_cold_furnace_rejected
        claim_type: error_triggerable
        grounds:
          - errors.ERR_FURNACE_POSTURE_BLOCKED
          - validations.priority_18
          - calculations.furnace_posture_derivation
        distinguishing_aspect: |
          A furnace holding a REBUILD_SCHEDULED campaign is COLD, so activating the next campaign is a 409
          even though its refractory is untouched at 100.00%; closing the rebuilt campaign restores
          OPERATING and the same activation then projects 3000.00 nominal wear units.
        test_recipe:
          setup:
            - "Furnace FUR-X13 with Campaign CMP-X13-A (2026-08-01 to 2026-08-11) activated, wound down and rebuild-scheduled for 2026-08-12..2026-08-28, leaving posture COLD"
            - "PLANNED Campaign CMP-X13-B (300.00 tpd, 2026-08-12 to 2026-08-22)"
          setup_api_calls:
            - call: "POST /glass-plant/furnaces"
              payload: { code: "FUR-X13", design_pull_tpd: 300.00, refractory_life_total_units: 100000.00 }
              as: PlantManager
              captures: { f: "$.data.id" }
            - call: "POST /glass-plant/campaigns"
              payload: { furnace_id: "${f}", code: "CMP-X13-A", target_pull_tpd: 300.00, window_start_at: "2026-08-01T00:00:00Z", window_end_at: "2026-08-11T00:00:00Z" }
              as: PlantManager
              captures: { cmpa: "$.data.id" }
            - call: "POST /glass-plant/campaigns/${cmpa}/activate"
              payload: {}
              as: PlantManager
            - call: "POST /glass-plant/campaigns"
              payload: { furnace_id: "${f}", code: "CMP-X13-B", target_pull_tpd: 300.00, window_start_at: "2026-08-12T00:00:00Z", window_end_at: "2026-08-22T00:00:00Z" }
              as: PlantManager
              captures: { cmpb: "$.data.id" }
            - call: "POST /glass-plant/campaigns/${cmpa}/wind-down"
              payload: {}
              as: PlantManager
            - call: "POST /glass-plant/campaigns/${cmpa}/schedule-rebuild"
              payload: { rebuild_window_start_at: "2026-08-12T00:00:00Z", rebuild_window_end_at: "2026-08-28T00:00:00Z" }
              as: PlantManager
          trigger:
            - call: "POST /glass-plant/campaigns/${cmpb}/activate"
              payload: {}
              as: PlantManager
          assert:
            - "HTTP 409 and data.error_id == ERR_FURNACE_POSTURE_BLOCKED"
            - "Furnace.${f}.posture == COLD and refractory_remaining_pct == 100.00"
            - "Campaign.${cmpb}.status == PLANNED, version == 1 and projected_refractory_units_nominal == 0.00"
            - "after POST /glass-plant/campaigns/${cmpa}/close the furnace posture is OPERATING and Campaign.${cmpa}.status == CLOSED"
            - "the same activation then returns 200 with status ACTIVE and projected_refractory_units_nominal == 3000.00"

      - name: completing_an_aborted_color_change_rejected
        claim_type: error_triggerable
        grounds:
          - errors.ERR_COLOR_CHANGE_STATE_INVALID
          - validations.priority_17
          - state_machines.ColorChange.SCHEDULED_to_ABORTED
        distinguishing_aspect: |
          ABORTED is terminal for a colour change: both complete and a second abort return 409, the furnace
          never leaves FLINT, and the version stays at 2 - the abort itself was the only write.
        test_recipe:
          setup:
            - "Furnace FUR-X14 (current_color FLINT)"
            - "ColorChange CC-X14 to AMBER over 2026-07-28T00:00:00Z..2026-07-30T00:00:00Z, already aborted"
          setup_api_calls:
            - call: "POST /glass-plant/furnaces"
              payload: { code: "FUR-X14", design_pull_tpd: 300.00, refractory_life_total_units: 100000.00 }
              as: PlantManager
              captures: { f: "$.data.id" }
            - call: "POST /glass-plant/color-changes"
              payload: { furnace_id: "${f}", to_color: "AMBER", window_start_at: "2026-07-28T00:00:00Z", window_end_at: "2026-07-30T00:00:00Z", transition_loss_tons: 10.00 }
              as: BatchHouseTech
              captures: { cc: "$.data.id" }
            - call: "POST /glass-plant/color-changes/${cc}/abort"
              payload: { reason: "cullet supply interruption" }
              as: BatchHouseTech
          trigger:
            - call: "POST /glass-plant/color-changes/${cc}/complete"
              payload: {}
              as: BatchHouseTech
          assert:
            - "HTTP 409 and data.error_id == ERR_COLOR_CHANGE_STATE_INVALID"
            - "ColorChange.${cc}.status == ABORTED and version == 2"
            - "Furnace.${f}.current_color == FLINT and version == 1"
            - "a second POST /glass-plant/color-changes/${cc}/abort also returns 409 ERR_COLOR_CHANGE_STATE_INVALID"
            - "the window had elapsed (window_end_at 2026-07-30 is before the clock), so this is the state check and not ERR_WINDOW_NOT_ELAPSED"

      - name: unknown_path_ids_return_entity_specific_not_found_codes
        claim_type: error_triggerable
        grounds:
          - validations.priority_5
          - errors.ERR_CAMPAIGN_NOT_FOUND
          - errors.ERR_BATCH_RECIPE_NOT_FOUND
          - errors.ERR_COLOR_CHANGE_NOT_FOUND
          - errors.ERR_FORMING_MACHINE_NOT_FOUND
          - errors.ERR_CUSTOMER_NOT_FOUND
          - errors.ERR_BOTTLE_DESIGN_NOT_FOUND
          - errors.ERR_PROGRAM_NOT_FOUND
          - errors.ERR_PRODUCTION_JOB_NOT_FOUND
          - errors.ERR_PACK_LOT_NOT_FOUND
          - errors.ERR_COMPLAINT_NOT_FOUND
        distinguishing_aspect: |
          Each collection answers with its own not-found code rather than a shared generic one: the same
          unknown uuid 00000000-0000-4000-8000-000000000000 produces ERR_CAMPAIGN_NOT_FOUND on the campaign
          path, ERR_PACK_LOT_NOT_FOUND on the lot path, and so on across all thirteen collections.
        test_recipe:
          setup:
            - "An empty plant; the uuid 00000000-0000-4000-8000-000000000000 belongs to no collection"
          setup_api_calls: []
          trigger:
            - call: "GET /glass-plant/campaigns/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PlantManager
          assert:
            - "HTTP 404 and data.error_id == ERR_CAMPAIGN_NOT_FOUND"
            - "GET /glass-plant/batch-recipes/00000000-0000-4000-8000-000000000000 returns 404 ERR_BATCH_RECIPE_NOT_FOUND"
            - "GET /glass-plant/color-changes/00000000-0000-4000-8000-000000000000 returns 404 ERR_COLOR_CHANGE_NOT_FOUND"
            - "GET /glass-plant/forming-machines/00000000-0000-4000-8000-000000000000 returns 404 ERR_FORMING_MACHINE_NOT_FOUND"
            - "GET /glass-plant/customers/00000000-0000-4000-8000-000000000000 returns 404 ERR_CUSTOMER_NOT_FOUND"
            - "GET /glass-plant/bottle-designs/00000000-0000-4000-8000-000000000000 returns 404 ERR_BOTTLE_DESIGN_NOT_FOUND"
            - "GET /glass-plant/lightweighting-programs/00000000-0000-4000-8000-000000000000 returns 404 ERR_PROGRAM_NOT_FOUND"
            - "GET /glass-plant/production-jobs/00000000-0000-4000-8000-000000000000 returns 404 ERR_PRODUCTION_JOB_NOT_FOUND"
            - "GET /glass-plant/pack-lots/00000000-0000-4000-8000-000000000000 returns 404 ERR_PACK_LOT_NOT_FOUND"
            - "GET /glass-plant/complaints/00000000-0000-4000-8000-000000000000 returns 404 ERR_COMPLAINT_NOT_FOUND"
            - "GET /glass-plant/furnaces/00000000-0000-4000-8000-000000000000 returns 404 ERR_FURNACE_NOT_FOUND"

      - name: lot_state_invalid_error_triggerable
        claim_type: error_triggerable
        grounds:
          - errors.ERR_LOT_STATE_INVALID
          - validations.priority_15
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / complaint_create_blocked_until_pack_lot_reaches_shipped
          rationale: "The named §1.8 instance walks the lot through IN_AGING, PALLETIZED and SHIPPED and asserts the 409 ERR_LOT_STATE_INVALID at each premature stage."

      - name: no_inspection_records_error_triggerable
        claim_type: error_triggerable
        grounds:
          - errors.ERR_NO_INSPECTION_RECORDS
          - validations.priority_41
        excluded_because:
          difficulty_instance: boundary_precision_check / release_with_zero_inspection_records_fails_closed
          rationale: "The named §1.8 instance releases a lot with zero readings and asserts the 409, then adds a single reading and releases successfully."

      - name: cavity_capacity_exceeded_error_triggerable
        claim_type: error_triggerable
        grounds:
          - errors.ERR_CAVITY_CAPACITY_EXCEEDED
          - validations.priority_40
        excluded_because:
          difficulty_instance: compensating_invariant / mold_unmount_returns_cavities_to_the_machine_capacity_pool
          rationale: "The named §1.8 instance fills the machine's cavity pool, hits the 409 on the next mount, unmounts and proves the freed cavities let the same start succeed."

      - name: color_mismatch_error_triggerable
        claim_type: error_triggerable
        grounds:
          - errors.ERR_COLOR_MISMATCH
          - validations.priority_25
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / color_mismatch_outranks_machine_window_conflict_on_job_create
          rationale: "The named §1.8 instance triggers ERR_COLOR_MISMATCH on a job whose recipe colour differs from the furnace's current_color."

      - name: machine_window_conflict_error_triggerable
        claim_type: error_triggerable
        grounds:
          - errors.ERR_MACHINE_WINDOW_CONFLICT
          - validations.priority_35
        excluded_because:
          difficulty_instance: resource_temporal_overlap / forming_machine_half_open_windows_plus_changeover_buffer
          rationale: "The named §1.8 instance probes the half-open boundary and the changeover buffer on one machine and asserts the 409 on the overlapping create."

      - name: color_change_window_conflict_error_triggerable
        claim_type: error_triggerable
        grounds:
          - errors.ERR_COLOR_CHANGE_WINDOW_CONFLICT
          - validations.priority_36
        excluded_because:
          difficulty_instance: resource_temporal_overlap / color_change_closed_intervals_and_rolling_thirty_day_cap_on_furnace
          rationale: "The named §1.8 instance asserts the closed-interval overlap 409 on a touching colour-change window."

      - name: color_change_rate_exceeded_error_triggerable
        claim_type: error_triggerable
        grounds:
          - errors.ERR_COLOR_CHANGE_RATE_EXCEEDED
          - validations.priority_37
        excluded_because:
          difficulty_instance: resource_temporal_overlap / color_change_closed_intervals_and_rolling_thirty_day_cap_on_furnace
          rationale: "The same §1.8 instance schedules a fifth colour change inside the rolling 30-day window and asserts the 409."

      - name: pull_capacity_exceeded_error_triggerable
        claim_type: error_triggerable
        grounds:
          - errors.ERR_PULL_CAPACITY_EXCEEDED
          - validations.priority_47
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / campaign_not_active_outranks_pull_capacity_on_job_create
          rationale: "The named §1.8 instance exhausts the campaign pull pool and asserts the 409 ERR_PULL_CAPACITY_EXCEEDED once the higher-priority campaign-state violation is cleared."

      - name: campaign_not_active_error_triggerable
        claim_type: error_triggerable
        grounds:
          - errors.ERR_CAMPAIGN_NOT_ACTIVE
          - validations.priority_9
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / campaign_not_active_outranks_pull_capacity_on_job_create
          rationale: "The same §1.8 instance creates a job against a PLANNED campaign and asserts the 409 ERR_CAMPAIGN_NOT_ACTIVE."

      - name: design_not_approved_error_triggerable
        claim_type: error_triggerable
        grounds:
          - errors.ERR_DESIGN_NOT_APPROVED
          - validations.priority_13
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / job_start_blocked_until_bottle_design_reaches_approved
          rationale: "The named §1.8 instance starts a job at each design state below APPROVED and asserts the 409 ERR_DESIGN_NOT_APPROVED every time."

  - section: rbac
    instances:
      - name: plant_manager_cannot_approve_a_batch_recipe
        claim_type: exclusive_operations
        grounds:
          - roles.BatchHouseTech.exclusive_operations
          - endpoints.POST_/glass-plant/batch-recipes/{batch_recipe_id}/approve
          - validations.priority_3
        distinguishing_aspect: |
          Recipe approval is BatchHouseTech's exclusive operation: PlantManager and QualityEngineer both get
          403 with approved still false, and only the BatchHouseTech call flips the flag - so the gate is the
          role and not the recipe's own state.
        test_recipe:
          setup:
            - "Furnace FUR-R1 with unapproved FLINT recipe BR-R1 (cullet 40.00)"
          setup_api_calls:
            - call: "POST /glass-plant/furnaces"
              payload: { code: "FUR-R1", design_pull_tpd: 300.00, refractory_life_total_units: 100000.00 }
              as: PlantManager
              captures: { f: "$.data.id" }
            - call: "POST /glass-plant/batch-recipes"
              payload: { furnace_id: "${f}", code: "BR-R1", color: "FLINT", cullet_ratio_pct: 40.00, soda_ash_kg_per_ton: 180.00, colorant_kg_per_ton: 0.00 }
              as: BatchHouseTech
              captures: { br: "$.data.id" }
          trigger:
            - call: "POST /glass-plant/batch-recipes/${br}/approve"
              payload: {}
              as: PlantManager
          assert:
            - "HTTP 403 and data.error_id == ERR_ROLE_NOT_PERMITTED"
            - "BatchRecipe.${br}.approved == false and version == 1"
            - "the same call as QualityEngineer also returns 403 ERR_ROLE_NOT_PERMITTED"
            - "the same call as BatchHouseTech returns 200 with approved true and version 2"

      - name: every_operating_role_shares_the_furnace_read
        claim_type: shared_operations
        grounds:
          - roles.PlantScheduler.shared_operations
          - roles.BatchHouseTech.shared_operations
          - roles.MoldEngineer.shared_operations
          - roles.WarehouseOperator.shared_operations
          - roles.CustomerRep.shared_operations
        distinguishing_aspect: |
          The furnace detail read is shared by the six plant-side roles but is absent from CustomerRep's
          shared reads, so the identical GET succeeds for PlantScheduler, BatchHouseTech, MoldEngineer,
          QualityEngineer and WarehouseOperator and is 403 for a CustomerRep.
        test_recipe:
          setup:
            - "Furnace FUR-R2 (design_pull_tpd 300.00, refractory_life_total_units 100000.00)"
            - "Customer CUST-R2 exists so a CustomerRep identity is available"
          setup_api_calls:
            - call: "POST /glass-plant/furnaces"
              payload: { code: "FUR-R2", design_pull_tpd: 300.00, refractory_life_total_units: 100000.00 }
              as: PlantManager
              captures: { f: "$.data.id" }
            - call: "POST /glass-plant/customers"
              payload: { name: "Iota2 Filling", account_code: "CUST-R2", palletization_standard: "EURO_1200x800", complaint_ppm_threshold: 5000.00 }
              as: PlantManager
              captures: { c: "$.data.id" }
          trigger:
            - call: "GET /glass-plant/furnaces/${f}"
              payload: {}
              as: WarehouseOperator
          assert:
            - "HTTP 200 with data.code == FUR-R2, posture OPERATING and refractory_remaining_pct 100.00"
            - "the same GET as PlantScheduler, BatchHouseTech, MoldEngineer and QualityEngineer also returns 200"
            - "the same GET as CustomerRep with X-User-ID ${c} returns 403 ERR_ROLE_NOT_PERMITTED"
            - "GET /glass-plant/customers/${c} as CustomerRep with X-User-ID ${c} returns 200, so the refusal is endpoint-scoped and not a blanket ban on the role"

      - name: batch_house_tech_cannot_palletize_an_aged_lot
        claim_type: exclusive_operations
        grounds:
          - roles.WarehouseOperator.exclusive_operations
          - endpoints.POST_/glass-plant/pack-lots/{pack_lot_id}/palletize
