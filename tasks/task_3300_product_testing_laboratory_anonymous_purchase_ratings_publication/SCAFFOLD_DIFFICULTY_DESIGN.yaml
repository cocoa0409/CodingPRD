scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: po_tax_per_line_vs_sum_then_round
        grounds: [calculations.po_tax, entities.PurchaseOrder.fields.tax_cents]
        distinguishing_aspect: "PurchaseOrder fiscal domain: per-line-round-then-sum (pinned) yields a different tax_cents than sum-then-round for identical lines — dual-variant on money."
        test_recipe:
          setup: ["category ACTIVE", "program SAMPLE_SOURCING with one sample", "clock at default 2026-09-01"]
          setup_api_calls:
            - call: "POST /product-categories"
              payload: { name: "Vacuums", refresh_cycle_months: 24, market_share_pct: 50, member_interest_pct: 50 }
              as: LabManager
              captures: { cat_id: $.data.id, cat_v: $.data.version }
            - call: "POST /test-programs"
              payload: { category_id: "${cat_id}", fiscal_year: 2026, budget_cents: 1000000 }
              as: LabManager
              as_user_id: "lm-1"
              captures: { prog_id: $.data.id }
            - call: "POST /lab-protocols"
              payload: { category_id: "${cat_id}", protocol_code: "VAC-01", measurement_repeat_min: 2, perf_weight_pct: 60, reliability_weight_pct: 30 }
              as: LabManager
              captures: { proto_id: $.data.id }
            - call: "POST /lab-protocols/${proto_id}/transitions"
              payload: { action: "submit_review" }
              as: LabManager
            - call: "POST /lab-protocols/${proto_id}/transitions"
              payload: { action: "activate", expected_category_version: "${cat_v}" }
              as: MethodologyOfficer
              captures: { proto_v: $.data.version }
            - call: "POST /test-programs/${prog_id}/transitions"
              payload: { action: "approve" }
              as: EditorialDirector
              as_user_id: "ed-1"
            - call: "POST /test-samples"
              payload: { program_id: "${prog_id}", model_label: "ModelX", required_units: 3 }
              as: LabManager
              captures: { samp_id: $.data.id }
            - call: "POST /test-programs/${prog_id}/transitions"
              payload: { action: "start_sourcing" }
              as: LabManager
          trigger:
            - call: "POST /purchase-orders"
              payload: { program_id: "${prog_id}", buyer_alias: "alias-7", retailer_name: "BigBox Retail", receipt_doc_ref: "RCPT-1", shipping_cents: 0, lines: [ { sample_id: "${samp_id}", unit_price_cents: 333, qty: 1, tax_rate_bp: 1500 }, { sample_id: "${samp_id}", unit_price_cents: 333, qty: 1, tax_rate_bp: 1500 }, { sample_id: "${samp_id}", unit_price_cents: 333, qty: 1, tax_rate_bp: 1500 } ] }
              as: PurchasingAgent
              captures: { po_tax: $.data.tax_cents, po_total: $.data.total_cents }
          assert:
            - "PurchaseOrder.tax_cents == 150 (per-line: round_half_up(333*1500/10000)=round_half_up(49.95)=50 each; 50*3=150)"
            - "PurchaseOrder.total_cents == 1149"
            - "sum-then-round variant would give round_half_up(149.85)=150 here by coincidence; the discriminating fixture is po_tax_nested_rounding_order (rule combinatorial_formula instance 2)"
      - name: measurement_score_two_stage_vs_flat
        grounds: [calculations.measurement_score, entities.TestSample.fields.lab_score]
        distinguishing_aspect: "TestSample lab domain: two-stage per-metric mean (pinned) differs from flat mean over raw rows when metric repeat counts are unequal — dual-variant on lab scoring, a different entity domain than PurchaseOrder money."
        test_recipe:
          setup: ["program in TESTING with one sample required_units=1; measurements: metric A 3 rows (100,100,100), metric B 1 row (50); repeat_min=1 so testing_complete after 1 row per unit for each metric presence is not required — tested via start_scoring lab_score"]
          setup_api_calls:
            - call: "POST /product-categories"
              payload: { name: "Blenders", refresh_cycle_months: 12, market_share_pct: 40, member_interest_pct: 60 }
              as: LabManager
              captures: { cat_id: $.data.id, cat_v: $.data.version }
            - call: "POST /test-programs"
              payload: { category_id: "${cat_id}", fiscal_year: 2026, budget_cents: 500000 }
              as: LabManager
              as_user_id: "lm-1"
              captures: { prog_id: $.data.id }
            - call: "POST /lab-protocols"
              payload: { category_id: "${cat_id}", protocol_code: "BLD-01", measurement_repeat_min: 1, perf_weight_pct: 50, reliability_weight_pct: 25 }
              as: LabManager
              captures: { proto_id: $.data.id }
            - call: "POST /lab-protocols/${proto_id}/transitions"
              payload: { action: "submit_review" }
              as: LabManager
            - call: "POST /lab-protocols/${proto_id}/transitions"
              payload: { action: "activate", expected_category_version: "${cat_v}" }
              as: MethodologyOfficer
            - call: "POST /test-programs/${prog_id}/transitions"
              payload: { action: "approve" }
              as: EditorialDirector
              as_user_id: "ed-1"
            - call: "POST /test-samples"
              payload: { program_id: "${prog_id}", model_label: "Blendy", required_units: 1 }
              as: LabManager
              captures: { samp_id: $.data.id }
            - call: "POST /test-programs/${prog_id}/transitions"
              payload: { action: "start_sourcing" }
              as: LabManager
            - call: "POST /purchase-orders"
              payload: { program_id: "${prog_id}", buyer_alias: "alias-9", retailer_name: "ShopMart", receipt_doc_ref: "RCPT-9", shipping_cents: 0, lines: [ { sample_id: "${samp_id}", unit_price_cents: 1000, qty: 1, tax_rate_bp: 0 } ] }
              as: PurchasingAgent
              captures: { po_id: $.data.id }
            - call: "POST /purchase-orders/${po_id}/transitions"
              payload: { action: "place" }
              as: PurchasingAgent
              as_user_id: "pa-1"
            - call: "POST /purchase-orders/${po_id}/transitions"
              payload: { action: "receive" }
              as: PurchasingAgent
              as_user_id: "pa-1"
            - call: "POST /test-programs/${prog_id}/transitions"
              payload: { action: "start_testing" }
              as: LabManager
            - call: "POST /measurements"
              payload: { sample_id: "${samp_id}", unit_index: 1, metric_code: "POWER", value_num: 100 }
              as: LabTechnician
            - call: "POST /measurements"
              payload: { sample_id: "${samp_id}", unit_index: 1, metric_code: "POWER", value_num: 100 }
              as: LabTechnician
            - call: "POST /measurements"
              payload: { sample_id: "${samp_id}", unit_index: 1, metric_code: "POWER", value_num: 100 }
              as: LabTechnician
            - call: "POST /measurements"
              payload: { sample_id: "${samp_id}", unit_index: 1, metric_code: "NOISE", value_num: 50 }
              as: LabTechnician
          trigger:
            - call: "POST /test-programs/${prog_id}/transitions"
              payload: { action: "start_scoring" }
              as: LabManager
            - call: "GET /test-samples/${samp_id}"
              as: LabManager
              captures: { lab_score: $.data.lab_score }
          assert:
            - "TestSample.lab_score == 75.0 (two-stage: POWER mean 100, NOISE mean 50, overall (100+50)/2)"
            - "flat-mean variant would give (100*3+50)/4 = 87.5 — pinned result differs"
  - rule_id: combinatorial_formula
    instances:
      - name: selection_score_multi_input_nonlinear
        grounds: [calculations.selection_score, entities.ProductCategory.fields.selection_score]
        distinguishing_aspect: "Mode (a): >=3 inputs (market_share, member_interest, months_since capped, refresh_cycle_months) with nested min/floor non-linear interaction on ProductCategory."
        test_recipe:
          setup: ["two categories, one never published (last_published_at null -> months_since = 60 cap), clock default 2026-09-01"]
          setup_api_calls:
            - call: "POST /product-categories"
              payload: { name: "Vacuums", refresh_cycle_months: 24, market_share_pct: 50, member_interest_pct: 50 }
              as: LabManager
              captures: { cat_id: $.data.id, cat_v: $.data.version }
          trigger:
            - call: "POST /_cycle/run"
              payload: {}
              as: LabManager
            - call: "GET /product-categories/${cat_id}"
              as: LabManager
              captures: { score: $.data.selection_score }
          assert:
            - "ProductCategory.selection_score == 62.5 (months_since=60 -> urgency=min(100, round_half_up(100*60/24,2))=100; 0.40*50+0.35*50+0.25*100 = 20+17.5+25 = 62.5)"
      - name: po_tax_nested_rounding_order
        grounds: [calculations.po_tax]
        distinguishing_aspect: "Mode (b): nested rounding where order matters — round per line then sum (pinned) vs sum then round; different mode than selection_score's mode (a)."
        test_recipe:
          setup: ["program SAMPLE_SOURCING with sample", "clock default"]
          setup_api_calls:
            - call: "POST /product-categories"
              payload: { name: "Mowers", refresh_cycle_months: 36, market_share_pct: 30, member_interest_pct: 30 }
              as: LabManager
              captures: { cat_id: $.data.id, cat_v: $.data.version }
            - call: "POST /test-programs"
              payload: { category_id: "${cat_id}", fiscal_year: 2026, budget_cents: 1000000 }
              as: LabManager
              as_user_id: "lm-1"
              captures: { prog_id: $.data.id }
            - call: "POST /lab-protocols"
              payload: { category_id: "${cat_id}", protocol_code: "MOW-01", measurement_repeat_min: 1, perf_weight_pct: 40, reliability_weight_pct: 40 }
              as: LabManager
              captures: { proto_id: $.data.id }
            - call: "POST /lab-protocols/${proto_id}/transitions"
              payload: { action: "submit_review" }
              as: LabManager
            - call: "POST /lab-protocols/${proto_id}/transitions"
              payload: { action: "activate", expected_category_version: "${cat_v}" }
              as: MethodologyOfficer
            - call: "POST /test-programs/${prog_id}/transitions"
              payload: { action: "approve" }
              as: EditorialDirector
              as_user_id: "ed-1"
            - call: "POST /test-samples"
              payload: { program_id: "${prog_id}", model_label: "Mow1", required_units: 3 }
              as: LabManager
              captures: { samp_id: $.data.id }
            - call: "POST /test-programs/${prog_id}/transitions"
              payload: { action: "start_sourcing" }
              as: LabManager
          trigger:
            - call: "POST /purchase-orders"
              payload: { program_id: "${prog_id}", buyer_alias: "alias-3", retailer_name: "ToolMart", receipt_doc_ref: "RCPT-3", shipping_cents: 0, lines: [ { sample_id: "${samp_id}", unit_price_cents: 1, qty: 1, tax_rate_bp: 5000 }, { sample_id: "${samp_id}", unit_price_cents: 1, qty: 1, tax_rate_bp: 5000 }, { sample_id: "${samp_id}", unit_price_cents: 1, qty: 1, tax_rate_bp: 5000 } ] }
              as: PurchasingAgent
              captures: { po_tax: $.data.tax_cents }
          assert:
            - "PurchaseOrder.tax_cents == 3 (per-line: round(0.5)=1 half_up each; 1*3=3)"
            - "sum-then-round variant would give round(1.5)=2 — pinned order differs by 1 cent"
  - rule_id: non_linear_state_machine
    instances:
      - name: protocol_draft_review_cycle
        grounds: [state_machines.LabProtocol.DRAFT_to_IN_REVIEW, state_machines.LabProtocol.IN_REVIEW_to_DRAFT]
        distinguishing_aspect: "Cyclic loop DRAFT -> IN_REVIEW -> DRAFT on LabProtocol — non-linear revision cycle."
        test_recipe:
          setup: ["category exists; protocol created DRAFT"]
          setup_api_calls:
            - call: "POST /product-categories"
              payload: { name: "Dryers", refresh_cycle_months: 24, market_share_pct: 20, member_interest_pct: 20 }
              as: LabManager
              captures: { cat_id: $.data.id, cat_v: $.data.version }
            - call: "POST /lab-protocols"
              payload: { category_id: "${cat_id}", protocol_code: "DRY-01", measurement_repeat_min: 1, perf_weight_pct: 50, reliability_weight_pct: 25 }
              as: LabManager
              captures: { proto_id: $.data.id }
            - call: "POST /lab-protocols/${proto_id}/transitions"
              payload: { action: "submit_review" }
              as: LabManager
          trigger:
            - call: "POST /lab-protocols/${proto_id}/transitions"
              payload: { action: "return_draft" }
              as: MethodologyOfficer
            - call: "POST /lab-protocols/${proto_id}/transitions"
              payload: { action: "submit_review" }
              as: LabManager
              captures: { st: $.data.status }
          assert:
            - "LabProtocol.status == IN_REVIEW after the DRAFT loop"
            - "loop can repeat: return_draft again returns DRAFT without error"
      - name: publication_revision_loop
        grounds: [state_machines.RatingPublication.UNDER_REVIEW_to_REVISION_REQUESTED, state_machines.RatingPublication.REVISION_REQUESTED_to_UNDER_REVIEW]
        distinguishing_aspect: "Cyclic loop UNDER_REVIEW -> REVISION_REQUESTED -> UNDER_REVIEW on RatingPublication — a different entity than LabProtocol."
        test_recipe:
          setup: ["program READY_FOR_PUBLICATION with one SCORED sample; publication DRAFT with one rated model; submitted"]
          setup_api_calls:
            - call: "POST /product-categories"
              payload: { name: "Washers", refresh_cycle_months: 24, market_share_pct: 50, member_interest_pct: 50 }
              as: LabManager
              captures: { cat_id: $.data.id, cat_v: $.data.version }
            - call: "POST /test-programs"
              payload: { category_id: "${cat_id}", fiscal_year: 2026, budget_cents: 500000 }
              as: LabManager
              as_user_id: "lm-1"
              captures: { prog_id: $.data.id }
            - call: "POST /lab-protocols"
              payload: { category_id: "${cat_id}", protocol_code: "WSH-01", measurement_repeat_min: 1, perf_weight_pct: 60, reliability_weight_pct: 30 }
              as: LabManager
              captures: { proto_id: $.data.id }
            - call: "POST /lab-protocols/${proto_id}/transitions"
              payload: { action: "submit_review" }
              as: LabManager
            - call: "POST /lab-protocols/${proto_id}/transitions"
              payload: { action: "activate", expected_category_version: "${cat_v}" }
              as: MethodologyOfficer
            - call: "POST /test-programs/${prog_id}/transitions"
              payload: { action: "approve" }
              as: EditorialDirector
              as_user_id: "ed-1"
            - call: "POST /test-samples"
              payload: { program_id: "${prog_id}", model_label: "WashA", required_units: 1 }
              as: LabManager
              captures: { samp_id: $.data.id }
            - call: "POST /test-programs/${prog_id}/transitions"
              payload: { action: "start_sourcing" }
              as: LabManager
            - call: "POST /purchase-orders"
              payload: { program_id: "${prog_id}", buyer_alias: "alias-1", retailer_name: "HomeDepot", receipt_doc_ref: "R1", shipping_cents: 0, lines: [ { sample_id: "${samp_id}", unit_price_cents: 50000, qty: 1, tax_rate_bp: 0 } ] }
              as: PurchasingAgent
              captures: { po_id: $.data.id }
            - call: "POST /purchase-orders/${po_id}/transitions"
              payload: { action: "place" }
              as: PurchasingAgent
              as_user_id: "pa-1"
            - call: "POST /purchase-orders/${po_id}/transitions"
              payload: { action: "receive" }
              as: PurchasingAgent
              as_user_id: "pa-1"
            - call: "POST /purchase-orders/${po_id}/transitions"
              payload: { action: "verify" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /test-programs/${prog_id}/transitions"
              payload: { action: "start_testing" }
              as: LabManager
            - call: "POST /measurements"
              payload: { sample_id: "${samp_id}", unit_index: 1, metric_code: "WASH", value_num: 90 }
              as: LabTechnician
            - call: "POST /test-programs/${prog_id}/transitions"
              payload: { action: "start_scoring" }
              as: LabManager
            - call: "POST /test-programs/${prog_id}/transitions"
              payload: { action: "ready" }
              as: LabManager
            - call: "POST /rating-publications"
              payload: { program_id: "${prog_id}", embargo_until: "2026-09-01T00:00:00Z", version_note: "v1" }
              as: ContentEditor
              captures: { pub_id: $.data.id }
            - call: "POST /rating-publications/${pub_id}/transitions"
              payload: { action: "add_rated_model", sample_id: "${samp_id}" }
              as: ContentEditor
            - call: "POST /rating-publications/${pub_id}/transitions"
              payload: { action: "submit" }
              as: ContentEditor
          trigger:
            - call: "POST /rating-publications/${pub_id}/transitions"
              payload: { action: "request_revision" }
              as: EditorialDirector
            - call: "POST /rating-publications/${pub_id}/transitions"
              payload: { action: "submit" }
              as: ContentEditor
              captures: { st: $.data.status }
          assert:
            - "RatingPublication.status == UNDER_REVIEW after revision loop"
  - rule_id: transitive_cascade
    instances:
      - name: safety_tier3_depth3_cascade
        grounds: [state_machines.SafetyFinding.OPEN_to_ESCALATED, state_machines.RatingPublication.PUBLISHED_to_WITHDRAWN]
        distinguishing_aspect: "Depth-3 cascade: escalate tier-3 finding -> RatedModel designations flip NOT_RECOMMENDED -> PUBLISHED publication WITHDRAWN -> category last_published_at recomputed; distinct trigger from cycle cascade."
        test_recipe:
          setup: ["published publication whose program's sample has an overall >= 80 (RECOMMENDED); CRITICAL hazard finding logged (tier 3)"]
          setup_api_calls:
            - call: "POST /product-categories"
              payload: { name: "Washers", refresh_cycle_months: 24, market_share_pct: 50, member_interest_pct: 50 }
              as: LabManager
              captures: { cat_id: $.data.id, cat_v: $.data.version }
            - call: "POST /test-programs"
              payload: { category_id: "${cat_id}", fiscal_year: 2026, budget_cents: 500000 }
              as: LabManager
              as_user_id: "lm-1"
              captures: { prog_id: $.data.id }
            - call: "POST /lab-protocols"
              payload: { category_id: "${cat_id}", protocol_code: "WSH-01", measurement_repeat_min: 1, perf_weight_pct: 60, reliability_weight_pct: 30 }
              as: LabManager
              captures: { proto_id: $.data.id }
            - call: "POST /lab-protocols/${proto_id}/transitions"
              payload: { action: "submit_review" }
              as: LabManager
            - call: "POST /lab-protocols/${proto_id}/transitions"
              payload: { action: "activate", expected_category_version: "${cat_v}" }
              as: MethodologyOfficer
            - call: "POST /test-programs/${prog_id}/transitions"
              payload: { action: "approve" }
              as: EditorialDirector
              as_user_id: "ed-1"
            - call: "POST /test-samples"
              payload: { program_id: "${prog_id}", model_label: "WashA", required_units: 1 }
              as: LabManager
              captures: { samp_id: $.data.id }
            - call: "POST /test-programs/${prog_id}/transitions"
              payload: { action: "start_sourcing" }
              as: LabManager
            - call: "POST /purchase-orders"
              payload: { program_id: "${prog_id}", buyer_alias: "alias-1", retailer_name: "HomeDepot", receipt_doc_ref: "R1", shipping_cents: 0, lines: [ { sample_id: "${samp_id}", unit_price_cents: 50000, qty: 1, tax_rate_bp: 0 } ] }
              as: PurchasingAgent
              captures: { po_id: $.data.id }
            - call: "POST /purchase-orders/${po_id}/transitions"
              payload: { action: "place" }
              as: PurchasingAgent
              as_user_id: "pa-1"
            - call: "POST /purchase-orders/${po_id}/transitions"
              payload: { action: "receive" }
              as: PurchasingAgent
              as_user_id: "pa-1"
            - call: "POST /purchase-orders/${po_id}/transitions"
              payload: { action: "verify" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /test-programs/${prog_id}/transitions"
              payload: { action: "start_testing" }
              as: LabManager
            - call: "POST /measurements"
              payload: { sample_id: "${samp_id}", unit_index: 1, metric_code: "WASH", value_num: 90 }
              as: LabTechnician
            - call: "POST /test-programs/${prog_id}/transitions"
              payload: { action: "start_scoring" }
              as: LabManager
            - call: "POST /test-programs/${prog_id}/transitions"
              payload: { action: "ready" }
              as: LabManager
            - call: "POST /rating-publications"
              payload: { program_id: "${prog_id}", embargo_until: "2026-09-01T00:00:00Z", version_note: "v1" }
              as: ContentEditor
              captures: { pub_id: $.data.id }
            - call: "POST /rating-publications/${pub_id}/transitions"
              payload: { action: "add_rated_model", sample_id: "${samp_id}" }
              as: ContentEditor
            - call: "POST /rating-publications/${pub_id}/transitions"
              payload: { action: "submit" }
              as: ContentEditor
            - call: "GET /test-programs/${prog_id}"
              as: EditorialDirector
              captures: { prog_v: $.data.version }
            - call: "POST /rating-publications/${pub_id}/transitions"
              payload: { action: "approve", expected_program_version: "${prog_v}" }
              as: EditorialDirector
            - call: "POST /rating-publications/${pub_id}/transitions"
              payload: { action: "publish" }
              as: EditorialDirector
            - call: "POST /safety-findings"
              payload: { program_id: "${prog_id}", sample_id: "${samp_id}", severity: "CRITICAL", description_text: "shock hazard", hazard_flag: true }
              as: SafetyOfficer
              captures: { sf_id: $.data.id, sf_tier: $.data.escalation_tier }
          trigger:
            - call: "POST /safety-findings/${sf_id}/transitions"
              payload: { action: "escalate" }
              as: SafetyOfficer
            - call: "GET /rating-publications/${pub_id}"
              as: SafetyOfficer
              captures: { pub_status: $.data.status, pub_desig: $.data.rated_models }
          assert:
            - "SafetyFinding.escalation_tier == 3"
            - "rated_models[0].designation == NOT_RECOMMENDED (cascade hop 2)"
            - "RatingPublication.status == WITHDRAWN (cascade hop 3)"
      - name: cycle_run_depth2_member_lapse
        grounds: [calculations.grace_window, state_machines.Member.ACTIVE_to_LAPSED]
        distinguishing_aspect: "Depth-2 cascade from a different trigger (POST /_cycle/run): subscription EXPIRED -> Member LAPSED; plus selection_score recompute as parallel epoch effect."
        test_recipe:
          setup: ["member with subscription term_end 2026-09-02, grace 14 days (grace_until 2026-09-16); clock advanced past grace_until"]
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "m1@x.com", full_name: "M One" }
              as: Member
              captures: { m_id: $.data.id }
            - call: "POST /members/${m_id}/transitions"
              payload: { action: "add_subscription", plan_tier: "DIGITAL", term_start: "2026-09-01T00:00:00Z", term_end: "2026-09-02T00:00:00Z" }
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-17T00:00:00Z" }
              as: LabManager
          trigger:
            - call: "POST /_cycle/run"
              payload: {}
              as: LabManager
              captures: { lapsed: $.data.members_lapsed }
          assert:
            - "cycle run output members_lapsed == 1 (subscription EXPIRED -> Member LAPSED cascade hop 2)"
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: ready_blocks_state_vs_safety_pair
        grounds: ["validations[priority=4]", "validations[priority=7]"]
        distinguishing_aspect: "Pair (state vs business_safety): ready action on a program in SCORING with a tier-2 OPEN finding -> ERR_SAFETY_GATE; the same action from TESTING (wrong state, finding also present) -> ERR_INVALID_STATE wins at priority 4."
        test_recipe:
          setup: ["program in TESTING (measurements incomplete) with an OPEN tier-2-eligible finding: CRITICAL, hazard false, recalled_model_count 2 — recalled count requires SCORED NOT_RECOMMENDED models which is unreachable pre-scoring, so use CRITICAL hazard_flag true (tier 3) which also gates ready; program never reaches SCORING"]
          setup_api_calls:
            - call: "POST /product-categories"
