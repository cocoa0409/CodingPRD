              captures: { sl2_id: $.data.id }
            - call: "POST /roster-slots"
              payload: { team_id: "${tm1_id}", student_id: "${st3_id}", slot_role: "STARTER" }
              as: Coach
              as_user_id: "${c_id}"
              captures: { sl3_id: $.data.id }
            - call: "POST /roster-slots"
              payload: { team_id: "${tm1_id}", student_id: "${st4_id}", slot_role: "SUB" }
              as: Coach
