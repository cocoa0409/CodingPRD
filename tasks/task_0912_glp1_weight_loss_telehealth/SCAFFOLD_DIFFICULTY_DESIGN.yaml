      - name: supply_lot_windowed_aggregate_capacity
        grounds:
          - validations[priority=12]
          - errors[ERR_LOT_CAPACITY_EXCEEDED]
          - entities.SupplyLot.fields.window_capacity_units
          - state_machines.PharmacyOrder.CREATED_to_RESERVED
