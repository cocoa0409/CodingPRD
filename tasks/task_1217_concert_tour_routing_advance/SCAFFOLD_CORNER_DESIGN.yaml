# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml — task_1217_concert_tour_routing_advance
# §1.9 Coverage Index for Non-Difficulty Tests (breadth probe)
# =============================================================================

scaffold_corner_design:

  # =========================================================================
  # §1 — Entities
  # =========================================================================
  - section: entities
    instances:
      - name: tour_creation_required_fields
        claim_type: creation
        grounds: ["entities.Tour.fields.tour_name", "endpoints.POST_/tours"]
        distinguishing_aspect: "POST /tours with missing tour_name returns 400 ERR_INVALID_REQUEST; with all required fields returns 201 with id, version=1, status=PLANNING, posture=OPEN."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: TourManager
          trigger:
            - call: "POST /tours"
              payload: { tour_name: "X", artist_name: "Y", window_start_date: "2026-07-01", window_end_date: "2026-08-01" }
              as: TourManager
              captures: { tid: $.data.id, ver: $.data.version, st: $.data.status, po: $.data.posture }
          assert:
            - "ver == 1 (common_fields version starts at 1)"
            - "st == PLANNING (initial_state)"
            - "po == OPEN (posture initial_state)"

      - name: venue_retrieval_not_found
        claim_type: not_found
        grounds: ["entities.Venue", "endpoints.GET_/tours/{tourId}/venues/{venueId}", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET with a non-existent venueId returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["One tour exists"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: TourManager
            - call: "POST /tours"
              payload: { tour_name: "T", artist_name: "A", window_start_date: "2026-07-01", window_end_date: "2026-08-01" }
              as: TourManager
              captures: { tid: $.data.id }
          trigger:
            - call: "GET /tours/${tid}/venues/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: TourManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_NOT_FOUND"

      - name: market_listing_pagination_defaults
        claim_type: listing
        grounds: ["response_envelope.pagination_defaults", "endpoints.GET_/tours/{tourId}/markets"]
        distinguishing_aspect: "GET /tours/{id}/markets without params returns at most 10 items, with limit/offset/total_count/has_more fields per §1.0."
        test_recipe:
          setup: ["Tour with 3 markets"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: TourManager
            - call: "POST /tours"
              payload: { tour_name: "T", artist_name: "A", window_start_date: "2026-07-01", window_end_date: "2026-08-01" }
              as: TourManager
              captures: { tid: $.data.id }
            - call: "POST /tours/${tid}/markets"
              payload: { market_code: "A", metro_name: "A", country_code: "US", radius_miles: 50, exclusivity_window_days: 30, territory_rank: 1 }
              as: TourManager
            - call: "POST /tours/${tid}/markets"
              payload: { market_code: "B", metro_name: "B", country_code: "US", radius_miles: 50, exclusivity_window_days: 30, territory_rank: 2 }
              as: TourManager
            - call: "POST /tours/${tid}/markets"
              payload: { market_code: "C", metro_name: "C", country_code: "US", radius_miles: 50, exclusivity_window_days: 30, territory_rank: 3 }
              as: TourManager
          trigger:
            - call: "GET /tours/${tid}/markets"
              payload: {}
              as: TourManager
              captures: { first_id: "$.data[0].id", first_code: "$.data[0].market_code" }
          assert:
            - "response is a Market[] of length 3 (total_count=3 in envelope)"
            - "first_id non-empty and first_code is one of A|B|C"

      - name: routing_leg_computed_drive_minutes
        claim_type: computed_fields
        grounds: ["entities.RoutingLeg.fields.drive_minutes", "calculations.routing_leg_drive_time"]
        distinguishing_aspect: "drive_minutes and crew_rest_required are computed on create; client-supplied values ignored."
        test_recipe:
          setup: ["Tour with two markets"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: TourManager
            - call: "POST /tours"
              payload: { tour_name: "T", artist_name: "A", window_start_date: "2026-07-01", window_end_date: "2026-09-01" }
              as: TourManager
              captures: { tid: $.data.id }
            - call: "POST /tours/${tid}/markets"
              payload: { market_code: "A", metro_name: "A", country_code: "US", radius_miles: 50, exclusivity_window_days: 30, territory_rank: 1 }
              as: TourManager
              captures: { m1: $.data.id }
            - call: "POST /tours/${tid}/markets"
              payload: { market_code: "B", metro_name: "B", country_code: "US", radius_miles: 50, exclusivity_window_days: 30, territory_rank: 2 }
              as: TourManager
              captures: { m2: $.data.id }
          trigger:
            - call: "POST /tours/${tid}/routing-legs"
              payload: { from_market_id: "${m1}", to_market_id: "${m2}", travel_date: "2026-08-01", drive_miles: 110, leg_index: 1 }
              as: TourManager
              captures: { dm: $.data.drive_minutes, rr: $.data.crew_rest_required }
          assert:
            - "dm == round(110 * 60 / 55) = 120"
            - "rr == false (120 < 480)"

  # =========================================================================
  # §2 — State Machines
  # =========================================================================
  - section: state_machines
    instances:
      - name: cancel_show_from_settled_returns_invalid_state
        claim_type: invalid_transition
        grounds: ["state_machines.Show", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Cancel on a terminal-state show (SETTLED or CANCELLED) returns ERR_INVALID_STATE with no side effects."
        test_recipe:
          setup: ["Show already CANCELLED"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: TourManager
            - call: "POST /tours"
              payload: { tour_name: "T", artist_name: "A", window_start_date: "2026-07-01", window_end_date: "2026-09-01" }
              as: TourManager
              captures: { tid: $.data.id }
            - call: "POST /tours/${tid}/markets"
              payload: { market_code: "X", metro_name: "X", country_code: "US", radius_miles: 50, exclusivity_window_days: 30, territory_rank: 1 }
              as: TourManager
              captures: { mid: $.data.id }
            - call: "POST /tours/${tid}/venues"
              payload: { market_id: "${mid}", venue_name: "V", capacity: 100, base_rent_cents: 1000, curfew_local_time: "23:00", available_dates: ["2026-08-01"] }
              as: TourManager
              captures: { vid: $.data.id }
            - call: "POST /tours/${tid}/start-routing"
              payload: {}
              as: TourManager
            - call: "POST /tours/${tid}/shows"
              payload: { market_id: "${mid}", venue_id: "${vid}", show_date: "2026-08-01", on_sale_at: "2026-07-01T00:00:00Z", avg_ticket_price_cents: 5000 }
              as: TourManager
              captures: { sid: $.data.id }
            - call: "POST /tours/${tid}/shows/${sid}/cancel"
              payload: {}
              as: TourManager
          trigger:
            - call: "POST /tours/${tid}/shows/${sid}/cancel"
              payload: {}
              as: TourManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE (second cancel on terminal CANCELLED)"

      - name: initial_state_tour_is_planning
        claim_type: initial_state
        grounds: ["state_machines.Tour"]
        distinguishing_aspect: "Freshly created Tour has status=PLANNING, posture=OPEN, all projected/settled aggregates = 0."
        test_recipe:
          setup: ["Empty"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: TourManager
          trigger:
            - call: "POST /tours"
              payload: { tour_name: "T", artist_name: "A", window_start_date: "2026-07-01", window_end_date: "2026-08-01" }
              as: TourManager
              captures: { st: $.data.status, po: $.data.posture, pg: $.data.projected_gross_cents, sg: $.data.settled_gross_cents }
          assert:
            - "st == PLANNING and po == OPEN and pg == 0 and sg == 0"

      - name: terminal_state_settlement_paid_lockdown
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.Settlement"]
        distinguishing_aspect: "Settlement in PAID has no outgoing transitions; any further transition call returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["Show PERFORMED with Settlement submitted, verified, paid"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: TourManager
            - call: "POST /tours"
              payload: { tour_name: "T", artist_name: "A", window_start_date: "2026-07-01", window_end_date: "2026-09-01" }
              as: TourManager
              captures: { tid: $.data.id }
            - call: "POST /tours/${tid}/markets"
              payload: { market_code: "X", metro_name: "X", country_code: "US", radius_miles: 50, exclusivity_window_days: 30, territory_rank: 1 }
              as: TourManager
              captures: { mid: $.data.id }
            - call: "POST /tours/${tid}/venues"
              payload: { market_id: "${mid}", venue_name: "V", capacity: 100, base_rent_cents: 1000, curfew_local_time: "23:00", available_dates: ["2026-08-01"] }
              as: TourManager
              captures: { vid: $.data.id }
            - call: "POST /tours/${tid}/start-routing"
              payload: {}
              as: TourManager
            - call: "POST /tours/${tid}/shows"
              payload: { market_id: "${mid}", venue_id: "${vid}", show_date: "2026-08-01", on_sale_at: "2026-07-01T00:00:00Z", avg_ticket_price_cents: 5000 }
              as: TourManager
              captures: { sid: $.data.id }
            - call: "POST /tours/${tid}/shows/${sid}/holds"
              payload: { promoter_name: "P", guarantee_cents: 100000, versus_pct: 70 }
              as: Promoter
              captures: { hid: $.data.id }
            - call: "POST /tours/${tid}/shows/${sid}/holds/${hid}/accept"
              payload: {}
              as: Promoter
            - call: "GET /tours/${tid}"
              payload: {}
              as: TourManager
              captures: { tv: $.data.version }
            - call: "POST /tours/${tid}/shows/${sid}/confirm"
              payload: { expected_tour_version: "${tv}" }
              as: TourManager
            - call: "POST /tours/${tid}/shows/${sid}/advance-packet/sections/tech_rider/submit"
              payload: {}
              as: TourManager
            - call: "GET /tours/${tid}/shows/${sid}/advance-packet"
              payload: {}
              as: TourManager
              captures: { pr1: $.data.packet_revision }
            - call: "POST /tours/${tid}/shows/${sid}/advance-packet/sections/tech_rider/approve"
              payload: { expected_packet_revision: "${pr1}" }
              as: VenueRep
            - call: "POST /tours/${tid}/shows/${sid}/advance-packet/sections/hospitality/submit"
              payload: {}
              as: TourManager
            - call: "GET /tours/${tid}/shows/${sid}/advance-packet"
              payload: {}
              as: TourManager
              captures: { pr2: $.data.packet_revision }
            - call: "POST /tours/${tid}/shows/${sid}/advance-packet/sections/hospitality/approve"
              payload: { expected_packet_revision: "${pr2}" }
              as: VenueRep
            - call: "POST /tours/${tid}/shows/${sid}/advance-packet/sections/immigration/submit"
              payload: {}
              as: TourManager
            - call: "GET /tours/${tid}/shows/${sid}/advance-packet"
              payload: {}
              as: TourManager
              captures: { pr3: $.data.packet_revision }
            - call: "POST /tours/${tid}/shows/${sid}/advance-packet/sections/immigration/approve"
              payload: { expected_packet_revision: "${pr3}" }
              as: VenueRep
            - call: "POST /tours/${tid}/shows/${sid}/advance"
              payload: {}
              as: TourManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T00:00:01Z" }
              as: TourManager
            - call: "POST /tours/${tid}/shows/${sid}/mark-performed"
              payload: {}
              as: TourManager
            - call: "POST /tours/${tid}/shows/${sid}/settlement/submit"
              payload: { box_office_gross_cents: 500000, taxes_cents: 30000, facility_fees_cents: 20000, promoter_expenses_cents: 50000 }
              as: Promoter
            - call: "POST /tours/${tid}/shows/${sid}/settlement/verify"
              payload: {}
              as: SettlementAccountant
            - call: "POST /tours/${tid}/shows/${sid}/settlement/pay"
              payload: {}
              as: SettlementAccountant
          trigger:
            - call: "POST /tours/${tid}/shows/${sid}/settlement/verify"
              payload: {}
              as: SettlementAccountant
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE (PAID is terminal)"

      - name: tour_open_on_sale_precondition_no_confirmed
        claim_type: precondition_enforcement
        grounds: ["state_machines.Tour.ROUTING_to_ON_SALE", "errors[ERR_NO_CONFIRMED_SHOWS]"]
        distinguishing_aspect: "POST /tours/{id}/open-on-sale with no CONFIRMED show returns ERR_NO_CONFIRMED_SHOWS."
        test_recipe:
          setup: ["Tour in ROUTING with zero shows"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: TourManager
            - call: "POST /tours"
              payload: { tour_name: "T", artist_name: "A", window_start_date: "2026-07-01", window_end_date: "2026-08-01" }
              as: TourManager
              captures: { tid: $.data.id }
            - call: "POST /tours/${tid}/markets"
              payload: { market_code: "X", metro_name: "X", country_code: "US", radius_miles: 50, exclusivity_window_days: 30, territory_rank: 1 }
              as: TourManager
              captures: { mid: $.data.id }
            - call: "POST /tours/${tid}/venues"
              payload: { market_id: "${mid}", venue_name: "V", capacity: 100, base_rent_cents: 1000, curfew_local_time: "23:00", available_dates: ["2026-08-01"] }
              as: TourManager
            - call: "POST /tours/${tid}/start-routing"
              payload: {}
              as: TourManager
          trigger:
            - call: "POST /tours/${tid}/open-on-sale"
              payload: {}
              as: TourManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_NO_CONFIRMED_SHOWS"

      - name: cascade_down_cancel_releases_venue_date
        claim_type: side_effect_execution
        grounds: ["state_machines.Show.CONFIRMED_to_CANCELLED", "entities.Venue.fields.booked_dates"]
        distinguishing_aspect: "Confirmed show's cancel removes show_date from venue.booked_dates (cascade-down)."
        test_recipe:
          setup: ["Show confirmed, venue booked_dates contains 2026-08-01"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: TourManager
            - call: "POST /tours"
              payload: { tour_name: "T", artist_name: "A", window_start_date: "2026-07-01", window_end_date: "2026-09-01" }
              as: TourManager
              captures: { tid: $.data.id }
            - call: "POST /tours/${tid}/markets"
              payload: { market_code: "X", metro_name: "X", country_code: "US", radius_miles: 50, exclusivity_window_days: 30, territory_rank: 1 }
              as: TourManager
              captures: { mid: $.data.id }
            - call: "POST /tours/${tid}/venues"
              payload: { market_id: "${mid}", venue_name: "V", capacity: 100, base_rent_cents: 1000, curfew_local_time: "23:00", available_dates: ["2026-08-01"] }
              as: TourManager
              captures: { vid: $.data.id }
            - call: "POST /tours/${tid}/start-routing"
              payload: {}
              as: TourManager
            - call: "POST /tours/${tid}/shows"
              payload: { market_id: "${mid}", venue_id: "${vid}", show_date: "2026-08-01", on_sale_at: "2026-07-01T00:00:00Z", avg_ticket_price_cents: 5000 }
              as: TourManager
              captures: { sid: $.data.id }
            - call: "POST /tours/${tid}/shows/${sid}/holds"
              payload: { promoter_name: "P", guarantee_cents: 100000, versus_pct: 70 }
              as: Promoter
              captures: { hid: $.data.id }
            - call: "POST /tours/${tid}/shows/${sid}/holds/${hid}/accept"
              payload: {}
              as: Promoter
            - call: "GET /tours/${tid}"
              payload: {}
              as: TourManager
              captures: { tv: $.data.version }
            - call: "POST /tours/${tid}/shows/${sid}/confirm"
              payload: { expected_tour_version: "${tv}" }
              as: TourManager
          trigger:
            - call: "POST /tours/${tid}/shows/${sid}/cancel"
              payload: {}
              as: TourManager
            - call: "GET /tours/${tid}/venues/${vid}"
              payload: {}
              as: TourManager
              captures: { bd: $.data.booked_dates }
          assert:
            - "bd == [] (date released by cascade)"

  # =========================================================================
  # §3 — Calculations
  # =========================================================================
  - section: calculations
    instances:
      - name: variance_flag_at_exactly_threshold
        claim_type: correct_result
        grounds: ["calculations.settlement_variance_flag"]
        distinguishing_aspect: "abs(variance_cents) == VARIANCE_THRESHOLD_CENTS (50000) yields MINOR (>=, not >); 49999 yields NONE."
        test_recipe:
          setup:
            - "Show with capacity=100, price=10000, tickets_sold=100 → expected_gross=1000000"
            - "Settlement A: gross=1050000 (variance=+50000, flag MINOR)"
            - "Settlement B on different show: gross=1049999 (variance=+49999, flag NONE)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: TourManager
            - call: "POST /tours"
              payload: { tour_name: "T", artist_name: "A", window_start_date: "2026-07-01", window_end_date: "2026-09-01" }
              as: TourManager
              captures: { tid: $.data.id }
            - call: "POST /tours/${tid}/markets"
              payload: { market_code: "X", metro_name: "X", country_code: "US", radius_miles: 50, exclusivity_window_days: 30, territory_rank: 1 }
              as: TourManager
              captures: { mid: $.data.id }
            - call: "POST /tours/${tid}/venues"
              payload: { market_id: "${mid}", venue_name: "V", capacity: 100, base_rent_cents: 1000, curfew_local_time: "23:00", available_dates: ["2026-08-01"] }
              as: TourManager
              captures: { vid: $.data.id }
            - call: "POST /tours/${tid}/start-routing"
              payload: {}
              as: TourManager
            - call: "POST /tours/${tid}/shows"
              payload: { market_id: "${mid}", venue_id: "${vid}", show_date: "2026-08-01", on_sale_at: "2026-07-01T00:00:00Z", avg_ticket_price_cents: 10000 }
              as: TourManager
              captures: { sid: $.data.id }
            - call: "POST /tours/${tid}/shows/${sid}/holds"
              payload: { promoter_name: "P", guarantee_cents: 100000, versus_pct: 70 }
              as: Promoter
              captures: { hid: $.data.id }
            - call: "POST /tours/${tid}/shows/${sid}/holds/${hid}/accept"
              payload: {}
              as: Promoter
            - call: "GET /tours/${tid}"
              payload: {}
              as: TourManager
              captures: { tv: $.data.version }
            - call: "POST /tours/${tid}/shows/${sid}/confirm"
              payload: { expected_tour_version: "${tv}" }
              as: TourManager
            - call: "PATCH /tours/${tid}/shows/${sid}/tickets"
              payload: { tickets_sold: 100 }
              as: Promoter
            - call: "POST /tours/${tid}/shows/${sid}/advance-packet/sections/tech_rider/submit"
              payload: {}
              as: TourManager
            - call: "GET /tours/${tid}/shows/${sid}/advance-packet"
              payload: {}
              as: TourManager
              captures: { pr1: $.data.packet_revision }
            - call: "POST /tours/${tid}/shows/${sid}/advance-packet/sections/tech_rider/approve"
              payload: { expected_packet_revision: "${pr1}" }
              as: VenueRep
            - call: "POST /tours/${tid}/shows/${sid}/advance-packet/sections/hospitality/submit"
              payload: {}
              as: TourManager
            - call: "GET /tours/${tid}/shows/${sid}/advance-packet"
              payload: {}
              as: TourManager
              captures: { pr2: $.data.packet_revision }
            - call: "POST /tours/${tid}/shows/${sid}/advance-packet/sections/hospitality/approve"
              payload: { expected_packet_revision: "${pr2}" }
              as: VenueRep
            - call: "POST /tours/${tid}/shows/${sid}/advance-packet/sections/immigration/submit"
              payload: {}
              as: TourManager
            - call: "GET /tours/${tid}/shows/${sid}/advance-packet"
              payload: {}
              as: TourManager
              captures: { pr3: $.data.packet_revision }
            - call: "POST /tours/${tid}/shows/${sid}/advance-packet/sections/immigration/approve"
              payload: { expected_packet_revision: "${pr3}" }
              as: VenueRep
            - call: "POST /tours/${tid}/shows/${sid}/advance"
              payload: {}
              as: TourManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T00:00:01Z" }
              as: TourManager
            - call: "POST /tours/${tid}/shows/${sid}/mark-performed"
              payload: {}
              as: TourManager
          trigger:
            - call: "POST /tours/${tid}/shows/${sid}/settlement/submit"
              payload: { box_office_gross_cents: 1050000, taxes_cents: 0, facility_fees_cents: 0, promoter_expenses_cents: 0 }
              as: Promoter
              captures: { flag: $.data.variance_flag }
          assert:
            - "flag == MINOR (variance=50000, threshold uses >=)"

      - name: marketing_cpa_null_when_no_sales
        claim_type: correct_result
        grounds: ["calculations.marketing_cpa", "entities.MarketingSpend.fields.cpa_cents"]
        distinguishing_aspect: "MarketingSpend with attributed_ticket_sales=0 has cpa_cents=null, not 0 or undefined."
        test_recipe:
          setup: ["Show with no sales yet"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: TourManager
            - call: "POST /tours"
              payload: { tour_name: "T", artist_name: "A", window_start_date: "2026-07-01", window_end_date: "2026-08-01" }
              as: TourManager
              captures: { tid: $.data.id }
            - call: "POST /tours/${tid}/markets"
              payload: { market_code: "X", metro_name: "X", country_code: "US", radius_miles: 50, exclusivity_window_days: 30, territory_rank: 1 }
              as: TourManager
