# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests) — task_0607
# Breadth probe across §1.1–§1.7. Same seven-point contract & §1.5 lint gates as §1.8.
# Names are unique across the union of §1.8 and §1.9.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_rate_plan_returns_201_with_defaults
        claim_type: Creation
        grounds:
          - entities.RatePlan
          - endpoints
        distinguishing_aspect: "POST /rate-plans with all required fields -> 201; status defaults to ACTIVE; id/created_at/version system-minted."
        test_recipe:
          setup: ["Empty DB; UnderwritingOps acting"]
          setup_api_calls: []
          trigger:
            - call: "POST /rate-plans"
              payload: { name: "TX UBI", state_code: "TX", base_premium_cents: 150000, per_mile_rate_cents: 1.0, included_miles_per_period: 800, hard_brake_weight: 2.0, speeding_weight: 1.0, phone_use_weight: 1.0 }
              as: UnderwritingOps
              captures: { rp_id: $.data.id }
          assert:
            - "response status == 201"
            - "RatePlan.${rp_id}.status == ACTIVE"
            - "RatePlan.${rp_id}.version == 1"

      - name: create_driver_missing_email_returns_validation
        claim_type: Required Fields
        grounds:
          - entities.Driver.fields.email
          - "errors[ERR_VALIDATION]"
        distinguishing_aspect: "POST /drivers without email (required, source input, no default) -> ERR_VALIDATION (422)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /drivers"
              payload: { full_name: "No Email", state_code: "CA" }
              as: DriverUser
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_VALIDATION"
            - "http status == 422"

      - name: get_driver_nonexistent_returns_not_found
        claim_type: Not Found
        grounds:
          - entities.Driver
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "GET /drivers/{id} with a non-existent UUID -> ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /drivers/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: UnderwritingOps
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NOT_FOUND"
            - "http status == 404"

      - name: list_drivers_pagination_envelope
        claim_type: Listing
        grounds:
          - entities.Driver
          - endpoints
        distinguishing_aspect: "GET /drivers returns a paginated array envelope with total_count and has_more pagination fields."
        test_recipe:
          setup: ["Two drivers registered"]
          setup_api_calls:
            - call: "POST /drivers"
              payload: { email: "p1@x.com", full_name: "P One", state_code: "CA" }
              as: UnderwritingOps
            - call: "POST /drivers"
              payload: { email: "p2@x.com", full_name: "P Two", state_code: "CA" }
              as: UnderwritingOps
          trigger:
            - call: "GET /drivers"
              payload: { limit: 1, offset: 0 }
              as: UnderwritingOps
          assert:
            - "response_type == array"
            - "pagination total_count == 2 and has_more == true"

      - name: driver_computed_lifetime_safe_miles_starts_zero
        claim_type: Computed Fields
        grounds:
          - entities.Driver.fields.lifetime_safe_miles
        distinguishing_aspect: "Driver.lifetime_safe_miles is computed and starts at 0 on registration; any client-supplied value is ignored."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /drivers"
              payload: { email: "comp@x.com", full_name: "Comp", state_code: "CA" }
              as: UnderwritingOps
              captures: { d_id: $.data.id }
          assert:
            - "Driver.${d_id}.lifetime_safe_miles == 0"
            - "Driver.${d_id}.telematics_opted_out == false"

      - name: duplicate_email_registration_rejected
        claim_type: Type Constraints
        grounds:
          - "validations[priority=26]"
          - "errors[ERR_DUPLICATE_EMAIL]"
        distinguishing_aspect: "Registering a second driver with a case-insensitively equal email -> ERR_DUPLICATE_EMAIL (409)."
        test_recipe:
          setup: ["One driver with email dup@x.com"]
          setup_api_calls:
            - call: "POST /drivers"
              payload: { email: "dup@x.com", full_name: "First", state_code: "CA" }
              as: UnderwritingOps
          trigger:
            - call: "POST /drivers"
              payload: { email: "DUP@x.com", full_name: "Second", state_code: "CA" }
              as: UnderwritingOps
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_DUPLICATE_EMAIL"
            - "http status == 409"

  # ===========================================================================
  - section: state_machines
