            - "ExtrusionLine.${line}.status == DOWN (link 2, caused by the run hold)"
            - "LineAssignment.${asg2}.status == CANCELLED (link 3, caused by the line going down)"
            - "WorkOrder.${wo2}.status == CONFIRMED (revert: no remaining SCHEDULED/ACTIVE assignments, no COMPLETED runs)"

      - name: batch_quarantine_cascade
        grounds:
          - state_machines.BlendBatch.CONSUMED_to_QUARANTINED
          - state_machines.ProductionRun.RUNNING_to_HOLD
          - state_machines.ExtrusionLine.RUNNING_to_DOWN
          - state_machines.LineAssignment.SCHEDULED_to_CANCELLED
        distinguishing_aspect: |
          Depth-3 chain with a DIFFERENT trigger (POST /blend-batches/{id}/qc
          QUARANTINE on a CONSUMED batch): batch -> QUARANTINED (link 1) holds
          the consuming run (link 2), which stops the line (link 3), which
          cancels the scheduled assignment (link 4). Same propagation segment
          as spc_ooc_hold_cascade but a distinct originating transition.
        test_recipe:
          setup:
            - "Run1 RUNNING consuming batch1 (CONSUMED); assignment A2 SCHEDULED on the same line"
