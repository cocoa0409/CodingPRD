  # --- InventoryFinancingLine ---
  - method: POST
    path: "/roastery/financing-lines"
    description: "Open an inventory financing line"
    roles: [RiskManager]
    code: 201
    input: [lender_name, facility_limit_usd, advance_rate_pct]
    output: InventoryFinancingLine
    side_effects:
      - "financing_status = OPEN; utilized_usd = 0; collateral_value_usd = 0"

  - method: GET
    path: "/roastery/financing-lines/{id}"
    description: "Fetch one financing line"
    roles: [RiskManager, Trader]
    code: 200
    input: []
    output: InventoryFinancingLine
    side_effects: []

  - method: POST
    path: "/roastery/financing-lines/{line_id}/reserves"
    description: "Pledge a green lot to the line (creates FinancingReserve)"
    roles: [RiskManager]
    code: 201
    input: [green_lot_id, reserved_lbs]
    output: FinancingReserve
    side_effects:
      - "reserve_advance_usd computed via calc_financing_reserve_advance"
      - "GreenLot.available_lbs -= reserved_lbs"
      - "line.utilized_usd += reserve_advance_usd; line.collateral_value_usd += (reserved_lbs * landed_cost_usd_per_lb)"
      - "WarehousePosition recompute"
      - "increments InventoryFinancingLine.version by 1"

  - method: POST
    path: "/roastery/financing-reserves/{reserve_id}/release"
    description: "Release a FinancingReserve, returning pledged mass to the open pool"
    roles: [RiskManager]
    code: 200
    input: []
    output: FinancingReserve
    side_effects:
      - "reserve_status ACTIVE → RELEASED"
      - "GreenLot.available_lbs += reserved_lbs"
      - "line.utilized_usd -= reserve_advance_usd; line.collateral_value_usd -= (reserved_lbs * landed_cost_usd_per_lb)"
      - "WarehousePosition recompute"
      - "increments FinancingReserve.version by 1; increments InventoryFinancingLine.version by 1"

  - method: POST
    path: "/roastery/financing-lines/{line_id}/suspend"
    description: "Suspend a financing line"
    roles: [RiskManager]
    code: 200
    input: []
    output: InventoryFinancingLine
    side_effects: ["increments InventoryFinancingLine.version by 1"]

  - method: POST
    path: "/roastery/financing-lines/{line_id}/unsuspend"
    description: "Un-suspend a financing line"
    roles: [RiskManager]
    code: 200
    input: []
    output: InventoryFinancingLine
    side_effects: ["increments InventoryFinancingLine.version by 1"]

