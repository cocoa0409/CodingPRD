      - name: duplicate_content_hash_same_panel_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=16]", "errors[ERR_DUPLICATE]"]
        distinguishing_aspect: "content_hash uniqueness is scoped per panel: the same hash on a DIFFERENT panel succeeds, on the SAME panel is rejected with ERR_DUPLICATE."
        test_recipe:
          setup: ["two panels P-DH1, P-DH2; P-DH1 already has RELEASED program with hash H"]
          setup_api_calls:
            - call: "POST /panel-shop/customers"
