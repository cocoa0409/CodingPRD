            - { call: "POST /records/video-assets/${asset_id}/depicted-individuals", payload: { display_label: "SUBJECT-1", relationship: "WITNESS" }, as: RecordsClerk, as_user_id: "clerk-1", captures: { witness_id: $.data.id } }
            - { call: "POST /records/video-assets/${asset_id}/depicted-individuals", payload: { display_label: "SUBJECT-2", relationship: "JUVENILE" }, as: RecordsClerk, as_user_id: "clerk-1", captures: { juvenile_id: $.data.id } }
            - { call: "POST /records/requests", payload: { requester_id: "${requester_id}", received_at: "2026-08-01T00:00:00Z", subject_incident_number: "INC-2026-0630", requested_date_from: "2026-07-24T00:00:00Z", requested_date_to: "2026-07-25T00:00:00Z", scope_narrative: "All BWC video for INC-2026-0630" }, as: RecordsClerk, as_user_id: "clerk-1", captures: { req_id: $.data.id, req_v1: $.data.version } }
            - { call: "POST /records/requests/${req_id}/scope-clarification", payload: { scope_narrative: "Interview room only", requested_date_from: "2026-07-24T00:00:00Z", requested_date_to: "2026-07-24T23:59:59Z", expected_request_version: "${req_v1}" }, as: RecordsClerk, as_user_id: "clerk-1" }
            - { call: "POST /records/requests/${req_id}/responsive-records", payload: { video_asset_id: "${asset_id}" }, as: RecordsClerk, as_user_id: "clerk-1", captures: { rec_id: $.data.id } }
            - { call: "POST /records/responsive-records/${rec_id}/inclusion", payload: { inclusion_status: "RESPONSIVE" }, as: RecordsClerk, as_user_id: "clerk-1" }
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-05T14:30:00Z" }, as: RecordsClerk, as_user_id: "clerk-1" }
