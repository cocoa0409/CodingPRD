              as: ResortOps
              captures: { result: $.data.result }
          assert:
            - "LiftScan.result == GRANTED"

      - name: non_full_epic_blacked_out_on_listed_date
        claim_type: violation_to_error
        grounds:
          - calculations.scan_access_decision
          - entities.PassProduct.fields.blackout_dates
          - entities.LiftScan.fields.denial_reason
        distinguishing_aspect: "A LOCAL pass scanning on a listed blackout date is DENIED with denial_reason=BLACKOUT."
        test_recipe:
          setup:
            - "Clock 2026-02-26 (blackout). LOCAL product blackout_dates=['2026-02-26']. ACTIVE pass at EPIC resort."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-26T08:00:00Z" }
              as: NetworkAdmin
            - call: "POST /pass-products"
              payload: { tier: "LOCAL", price_cents: 5000, blackout_dates: ["2026-02-26"], ikon_interchange_enabled: false }
              as: NetworkAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /resorts"
              payload: { name: "Local Blackout", home_network: "EPIC" }
              as: NetworkAdmin
              captures: { resort_id: $.data.id }
            - call: "POST /passes"
              payload: { pass_product_id: "${prod_id}", holder_name: "Local Holder" }
              as: ResortOps
              captures: { pass_id: $.data.id, tok: $.data.magnetic_token }
            - call: "POST /passes/${pass_id}/activate"
              payload: {}
              as: ResortOps
          trigger:
            - call: "POST /passes/${pass_id}/scan"
              payload: { resort_id: "${resort_id}", presented_token: "${tok}" }
              as: ResortOps
              captures: { result: $.data.result, reason: $.data.denial_reason }
          assert:
            - "LiftScan.result == DENIED"
            - "LiftScan.denial_reason == BLACKOUT"

      - name: scan_inactive_pass_denied_not_active
        claim_type: calculation_branch
        grounds:
          - calculations.scan_access_decision
          - entities.LiftScan.fields.denial_reason
          - entities.Pass.fields.status
        distinguishing_aspect: "Scanning a token-valid but ISSUED (not yet ACTIVE) pass is DENIED with denial_reason=NOT_ACTIVE."
        test_recipe:
          setup:
            - "FULL_EPIC ISSUED pass (not activated) at an EPIC resort."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-27T08:00:00Z" }
              as: NetworkAdmin
            - call: "POST /pass-products"
              payload: { tier: "FULL_EPIC", price_cents: 8000, ikon_interchange_enabled: false }
              as: NetworkAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /resorts"
              payload: { name: "NotActive Mtn", home_network: "EPIC" }
              as: NetworkAdmin
              captures: { resort_id: $.data.id }
            - call: "POST /passes"
              payload: { pass_product_id: "${prod_id}", holder_name: "NA Holder" }
              as: ResortOps
