  - method: GET
    path: /branch-office/financial-periods/{id}
    description: Fetch one financial period.
    roles: [HomeOfficeAdmin, Advisor]
    code: 200
    input: []
    output: BranchFinancialPeriod
    side_effects: []
  - method: POST
    path: /branch-office/financial-periods/{id}/charges
