      - name: missing_or_bogus_auth_headers_return_unauthenticated
        claim_type: Violation to Error
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
          - auth_contract
          - roles[VendorRep]
        distinguishing_aspect: "Three separate authentication failures all yield ERR_UNAUTHENTICATED (401) and never a 403: a blank X-User-Role, a blank X-User-ID, and an X-User-ID that does not resolve to a Vendor while acting as VendorRep."
        test_recipe:
          setup: ["One Vendor exists so a valid VendorRep identity is possible."]
          setup_api_calls:
            - call: "POST /udi/vendors"
              payload: { name: "Ortholux Medical", vendor_code: "ORTHO-1" }
              as: InventoryLead
              as_user_id: "il-01"
              captures: { vendor_id: "$.data.id" }
          trigger:
            - call: "GET /udi/vendors/${vendor_id}"
              payload: {}
              as: ""
              as_user_id: "il-01"
              captures: { err1: "$.data.error_id" }
            - call: "GET /udi/vendors/${vendor_id}"
              payload: {}
              as: InventoryLead
              as_user_id: ""
              captures: { err2: "$.data.error_id" }
            - call: "GET /udi/vendors/${vendor_id}"
              payload: {}
              as: VendorRep
              as_user_id: "00000000-0000-4000-8000-0000000000ff"
              captures: { err3: "$.data.error_id" }
          assert:
            - "All three calls return HTTP 401 with error_id == ERR_UNAUTHENTICATED"
            - "None of them returns ERR_UNAUTHORIZED"

