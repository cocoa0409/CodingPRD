# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3393_institutional_accreditation_self_study_site_visit_sanction
#
# Depth probe: 2+ instances per §0.5 Difficulty Rule, grounded in SCAFFOLD.yaml
# §1.1–§1.7. YAML anchors for the canonical accreditation pipeline are defined
# at first use (document order) and aliased by later instances in THIS file.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: cfi_public_private_variant_divergence
        grounds:
          - calculations.composite_financial_index
          - entities.IndicatorReport.fields.cfi_variant_used
          - entities.Institution.fields.legal_status
        distinguishing_aspect: |
          Dual-variant calculation on the FINANCE domain: identical ratios
          (prr 0.10, vr 0.05, nor 0.02) yield CFI 1.25 under the PRIVATE
          variant but 2.00 under the PUBLIC variant (0.50 appropriation bonus
          included because sar 0.25 >= 0.20) — same inputs, different entity
          configuration, different number.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z (server default)."
            - "Institution P (PRIVATE_NONPROFIT) and institution Q (PUBLIC), each with a DUE indicator report for 2026."
          setup_api_calls:
            - call: "POST /accreditation/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: CommissionAdmin
            - call: "POST /accreditation/institutions"
              payload: { legal_name: "Prairie Private College", legal_status: "PRIVATE_NONPROFIT", state_code: "IA", fte_enrollment: 800, degree_levels_offered: ["ASSOCIATE", "BACCALAUREATE"] }
              as: CommissionAdmin
              captures: { inst_p_id: $.data.id }
            - call: "POST /accreditation/institutions"
              payload: { legal_name: "Northern Public University", legal_status: "PUBLIC", state_code: "MN", fte_enrollment: 500, degree_levels_offered: ["ASSOCIATE"] }
              as: CommissionAdmin
              captures: { inst_q_id: $.data.id }
            - call: "POST /accreditation/institutions/${inst_p_id}/indicator-reports"
              payload: { period_start: "2026-01-01", period_end: "2026-12-31" }
              as: CommissionStaff
              captures: { rep_p_id: $.data.id }
            - call: "POST /accreditation/institutions/${inst_q_id}/indicator-reports"
              payload: { period_start: "2026-01-01", period_end: "2026-12-31" }
              as: CommissionStaff
              captures: { rep_q_id: $.data.id }
            - call: "POST /accreditation/indicator-reports/${rep_p_id}/submit"
              payload: { primary_reserve_ratio: 0.10, viability_ratio: 0.05, net_operating_ratio: 0.02, enrollment_change_pct: -9.0, completion_rate: 51.0, retention_rate: 71.0, fte_enrollment: 800 }
              as: InstitutionLiaison
              as_user_id: "${inst_p_id}"
            - call: "POST /accreditation/indicator-reports/${rep_q_id}/submit"
              payload: { primary_reserve_ratio: 0.10, viability_ratio: 0.05, net_operating_ratio: 0.02, state_appropriation_ratio: 0.25, enrollment_change_pct: -9.0, completion_rate: 51.0, retention_rate: 71.0, fte_enrollment: 500 }
              as: InstitutionLiaison
              as_user_id: "${inst_q_id}"
          trigger:
            - call: "GET /accreditation/institutions/${inst_p_id}/indicator-reports"
              payload: {}
              as: CommissionStaff
              captures: { p_cfi: "$.data[0].cfi_value", p_variant: "$.data[0].cfi_variant_used" }
            - call: "GET /accreditation/institutions/${inst_q_id}/indicator-reports"
              payload: {}
              as: CommissionStaff
              captures: { q_cfi: "$.data[0].cfi_value", q_variant: "$.data[0].cfi_variant_used" }
          assert:
            - "IndicatorReport.${rep_p_id}.cfi_value == 1.25 and cfi_variant_used == PRIVATE"
            - "IndicatorReport.${rep_q_id}.cfi_value == 2.00 and cfi_variant_used == PUBLIC"
            - "same financial ratios produce cfi values differing by exactly 0.75 (the 0.50 bonus reweighted into the two-component public formula)"

      - name: readiness_self_reported_vs_team_verified
        grounds:
          - calculations.assurance_readiness_score
          - entities.AssuranceArgument.fields.readiness_self_reported
          - entities.AssuranceArgument.fields.readiness_team_verified
        distinguishing_aspect: |
          Dual-variant calculation on the EVIDENCE domain (different subject
          than the finance CFI): the same 16-item evidence set scores 100.00
          under SELF_REPORTED (all items count) but 60.00 under TEAM_VERIFIED
          (only the 9 verified items count) — variant divergence on identical
          underlying data.
        test_recipe:
          setup:
            - "CANDIDATE institution with an INITIAL_ACCREDITATION cycle in EVALUATION_ACTIVE; assurance argument locked with 16 evidence items (MISSION 3, INTEGRITY 3, TEACHING_QUALITY 4, TEACHING_EVALUATION 3, RESOURCES_PLANNING 3); a confirmed 4-member team; exactly 9 items verified (3 MISSION, 2 INTEGRITY, 1 TEACHING_QUALITY, 0 TEACHING_EVALUATION, 3 RESOURCES_PLANNING)."
