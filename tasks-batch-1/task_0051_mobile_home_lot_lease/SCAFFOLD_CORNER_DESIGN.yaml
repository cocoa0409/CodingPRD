            - call: "POST /lots"
              payload: { community_id: "${comm_id}", lot_number: "A1", base_rent_cents: 60000 }
              as: ParkManager
          trigger:
            - call: "POST /lots"
              payload: { community_id: "${comm_id}", lot_number: "A1", base_rent_cents: 70000 }
              as: ParkManager
          assert:
            - "response error_id == ERR_DUPLICATE_LOT_NUMBER"
            - "http status == 409"

      - name: duplicate_ballot_for_lot_rejected
        claim_type: Violation → Error
        grounds:
          - validations[priority=17]
          - errors[ERR_DUPLICATE_BALLOT]
        distinguishing_aspect: "Casting a second ballot for the same lot in the same OPEN vote returns ERR_DUPLICATE_BALLOT (409)."
        test_recipe:
          setup:
            - "An OPEN conversion vote over a CA community with one occupied (frozen) lot that already cast a YES ballot"
          setup_api_calls:
            - call: "POST /communities"
              payload: { name: "Db Park", state_code: "CA" }
