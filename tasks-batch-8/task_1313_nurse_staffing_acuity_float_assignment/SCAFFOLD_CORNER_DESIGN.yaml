      - name: skill_mix_float_cap_at_floor_boundary
        claim_type: boundary
        grounds: [state_machines.ShiftAssignment.ACCEPTED_to_CONFIRMED, "errors[ERR_SKILL_MIX_VIOLATION]"]
        distinguishing_aspect: "Float share cap is floor(counted/2): the second float confirm at counted 4 passes (2 <= 2); the third float confirm at counted 5 fails (3 > floor(5/2) = 2)."
        test_recipe:
          setup: ["ICU unit with matrix; DAY shift required 4 (census 2/3/2/1); two CORE nurses accepted+confirmed; floats G1, G2 accepted+confirmed; G3 ACCEPTED awaiting confirm"]
          setup_api_calls:
            - call: "POST /units"
              payload: { name: "ICU C6", unit_type: "ICU", bed_count: 12, incentive_budget_cents: 500000 }
              as: NurseAdmin
              captures: { u: $.data.id }
