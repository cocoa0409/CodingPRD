        distinguishing_aspect: "The site version is read, then a third-party roster write bumps it, and the order quotes the pre-bump value: 412 ERR_STALE_ALARM_SITE_VERSION is returned even though the site has only one chargeable occurrence and would also have failed priority 49 ERR_SUSPENSION_BASIS_NO_LONGER_MET — concurrency is checked first."
        test_recipe:
          setup:
            - "Clock 2026-09-20T01:00:00Z; incident 1 is COUNTED. The site version is captured, then a third ECV contact is added, which bumps AlarmSite.version again."
          setup_api_calls:
            - *k_clock
            - *k_sched
            - *k_sched_on
            - *k_co
            - *k_site
            - *k_c1
            - *k_c2
            - *k_sys1
            - *k_app1
            - *k_clock_sep
            - *k_dr1
            - *k_dr1_val
            - *k_clock_sep_1h
            - *k_dr1_disp
