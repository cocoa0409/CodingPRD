      - name: cascade_down_from_segment_cancellation
        claim_type: cascade_down
        excluded_because:
          difficulty_instance: segment_cancellation_depth_four_cascade
          rationale: "The §1.8 transitive_cascade instance already walks LINK 1 -> 2a -> 2b -> 3a/3b -> 4 end to end and asserts every intermediate row, which is a strict superset of the cascade-down claim."

      - name: compensation_reverses_cascade_side_effects
        claim_type: compensation
        excluded_because:
          difficulty_instance: ancillary_obligation_void_restores_obligated_cents_ledger
          rationale: "The §1.8 compensating_invariant instance voids a cascade-created ancillary obligation and reconciles the booking ledger back to its pre-cascade value with no drift."

      - name: parallel_state_dimensions_advance_independently
        claim_type: parallel
        excluded_because:
          difficulty_instance: obligation_election_and_settlement_axes_advance_independently
          rationale: "The §1.8 non_linear_state_machine instance is exactly the parallel-shape claim for RefundObligation's election_status and settlement_status axes."

      - name: fork_join_branches_both_reach_report_filed
        claim_type: fork_join
        excluded_because:
          difficulty_instance: tarmac_event_fork_join_exemption_versus_deplane_branches
          rationale: "The §1.8 instance drives both DELAY_ACTIVE forks and their join at REPORT_FILED with divergent side effects asserted per branch."

      - name: guarded_transition_requires_cross_entity_state
        claim_type: guarded
        excluded_because:
          difficulty_instance: tarmac_report_blocked_while_segment_still_scheduled
          rationale: "The §1.8 cross_entity_state_dependency instance is the guarded-transition claim: file-report is admitted only once the parent FlightSegment has left SCHEDULED/DELAYED."

  # ==========================================================================
  # 3. CALCULATIONS  (claim-extraction-guide "From Table 3 (Calculations)")
  # ==========================================================================
  - section: calculations
    instances:

      - name: denied_boarding_no_compensation_at_sixty_minute_boundary
        claim_type: constants_applied
        grounds: ["calculations.denied_boarding_compensation.constants.INVOLUNTARY_NO_COMP_MAX_MINUTES", "state_machines.DeniedBoardingRecord.transitions.RECORDED_to_FINALIZED.side_effects"]
        distinguishing_aspect: "A substitute arrival exactly 60 minutes late sits AT the no-compensation ceiling, so statutory_compensation_cents and compensation_cents are both 0, no obligation row is written, and the skip is recorded as suppressed_obligation_count == 1 rather than as a zero-amount obligation."
        test_recipe:
          setup: ["Booking with total_fare_cents = 60000 and one domestic segment scheduled to arrive 2026-08-10T14:00:00Z; an INVOLUNTARY denied-boarding record with one_way_fare_cents = 45000 and substitute arrival 2026-08-10T15:00:00Z."]
          setup_api_calls:
            - call: "POST /compliance/policy-profiles"
              payload: { carrier_code: "ZQ" }
              as: ComplianceAdmin
              as_user_id: "admin_1"
              captures: { pol_id: "$.data.id" }
            - call: "POST /compliance/passengers"
              payload: { email: "pat@example.com", full_name: "Pat Rivera" }
              as: ComplianceOfficer
              as_user_id: "officer_1"
              captures: { pax_id: "$.data.id" }
            - call: "POST /compliance/bookings"
              payload: { passenger_id: "${pax_id}", policy_profile_id: "${pol_id}", record_locator: "ABC123", total_fare_cents: 60000, payment_method: "CREDIT_CARD" }
              as: ComplianceOfficer
              as_user_id: "officer_1"
              captures: { bk_id: "$.data.id" }
            - call: "POST /compliance/bookings/${bk_id}/flight-segments"
              payload: { sequence_index: 1, flight_number: "ZQ410", origin_iata: "ORD", destination_iata: "DFW", is_international: false, scheduled_departure_utc: "2026-08-10T12:00:00Z", scheduled_arrival_utc: "2026-08-10T14:00:00Z", segment_fare_cents: 60000 }
              as: OpsController
              as_user_id: "ops_1"
              captures: { seg1_id: "$.data.id" }
            - call: "POST /compliance/denied-boarding-records"
              payload: { booking_id: "${bk_id}", flight_segment_id: "${seg1_id}", category: "INVOLUNTARY", oversale_confirmed: true, written_disclosure_provided: true, one_way_fare_cents: 45000, substitute_arrival_utc: "2026-08-10T15:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "officer_1"
              captures: { dbr_id: "$.data.id" }
          trigger:
            - call: "POST /compliance/denied-boarding-records/${dbr_id}/finalize"
              payload: { finalized_at_utc: "2026-08-10T16:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "officer_1"
          assert:
            - "DeniedBoardingRecord.${dbr_id}.status == FINALIZED and DeniedBoardingRecord.${dbr_id}.effective_category == INVOLUNTARY"
            - "DeniedBoardingRecord.${dbr_id}.substitute_delay_minutes == 60"
            - "DeniedBoardingRecord.${dbr_id}.statutory_compensation_cents == 0"
            - "DeniedBoardingRecord.${dbr_id}.compensation_cents == 0"
            - "GET /compliance/refund-obligations with booking_id = ${bk_id} returns total_count == 0"
            - "Booking.${bk_id}.suppressed_obligation_count == 1"
            - "Booking.${bk_id}.total_refund_obligated_cents == 0 and Booking.${bk_id}.disruption_posture == NORMAL"

      - name: disability_complaint_answer_window_uses_thirty_day_constant
        claim_type: constants_applied
        grounds: ["calculations.complaint_deadline_resolution.formula", "entities.PolicyProfile.complaint_answer_deadline_days_disability"]
        distinguishing_aspect: "Selecting category DISABILITY swaps the 60-day general answer window for the 30-day disability window, which makes answer_due_utc coincide exactly with ack_due_utc at 2026-09-04T09:00:00Z instead of falling on 2026-10-04T09:00:00Z."
        test_recipe:
          setup: ["Booking under a default PolicyProfile (ack 30 d, answer 60 d general, 30 d disability)."]
          setup_api_calls:
            - call: "POST /compliance/policy-profiles"
              payload: { carrier_code: "ZQ" }
              as: ComplianceAdmin
              as_user_id: "admin_1"
              captures: { pol_id: "$.data.id" }
            - call: "POST /compliance/passengers"
              payload: { email: "pat@example.com", full_name: "Pat Rivera", requires_disability_assistance: true }
              as: ComplianceOfficer
              as_user_id: "officer_1"
              captures: { pax_id: "$.data.id" }
            - call: "POST /compliance/bookings"
              payload: { passenger_id: "${pax_id}", policy_profile_id: "${pol_id}", record_locator: "ABC123", total_fare_cents: 50000, payment_method: "CREDIT_CARD" }
              as: ComplianceOfficer
              as_user_id: "officer_1"
              captures: { bk_id: "$.data.id" }
          trigger:
            - call: "POST /compliance/consumer-complaints"
              payload: { booking_id: "${bk_id}", category: "DISABILITY", channel: "PHONE", received_at_utc: "2026-08-05T09:00:00Z", summary: "Wheelchair assistance was not provided at the gate." }
              as: ComplianceOfficer
              as_user_id: "officer_1"
              captures: { cmp_id: "$.data.id" }
          assert:
            - "ConsumerComplaint.${cmp_id}.category == DISABILITY and ConsumerComplaint.${cmp_id}.status == RECEIVED"
            - "ConsumerComplaint.${cmp_id}.ack_due_utc == 2026-09-04T09:00:00Z"
            - "ConsumerComplaint.${cmp_id}.answer_due_utc == 2026-09-04T09:00:00Z"
            - "PolicyProfile.${pol_id}.complaint_answer_deadline_days_disability == 30 and PolicyProfile.${pol_id}.complaint_answer_deadline_days_general == 60"

      - name: international_itinerary_uses_thirty_hour_bag_threshold
        claim_type: correct_result
        grounds: ["calculations.baggage_delivery_delay.formula", "calculations.booking_ledger_recompute.itinerary_scope"]
        distinguishing_aspect: "A 29.0-hour delivery is ON TIME because one international segment flipped the booking's itinerary_scope to INTERNATIONAL and raised the threshold to 30 h — the same bag on a domestic itinerary would be 17 hours past the 12 h limit."
        test_recipe:
          setup: ["Booking with total_fare_cents = 90000 and one segment with is_international = true, so itinerary_scope = INTERNATIONAL."]
          setup_api_calls:
            - call: "POST /compliance/policy-profiles"
              payload: { carrier_code: "ZQ" }
              as: ComplianceAdmin
              as_user_id: "admin_1"
              captures: { pol_id: "$.data.id" }
