            - "ReturnStep.${step4_id}: min_start_at == 2026-09-21T12:00:00.000Z, dwell_complete_at == 2026-09-23T12:00:00.000Z (48h)"
            - "ReturnStep.${step5_id}: min_start_at == 2026-09-25T12:00:00.000Z, dwell_complete_at == 2026-09-27T12:00:00.000Z (48h)"
            - "all five steps are PASSED with cleared_by_clinician_id == ${doc_h_id}"
            - "ConcussionCase.${case_id}.rtp_stage == 5 and earliest_return_at == 2026-09-28T12:00:00.000Z"

      - name: provisional_versus_final_return_date_variants
        claim_type: variant_divergence
        grounds:
          - calculations.case_return_readiness_timeline
        excluded_because:
          difficulty_instance: dual_variant_calc / case_provisional_projection_diverges_from_accrued_return_date
          rationale: "That §1.8 instance asserts both variants and their five-day delta on the same case."

      - name: preliminary_versus_adjudicated_compliance_variants
        claim_type: variant_selection
        grounds:
          - calculations.club_compliance_score
        excluded_because:
          difficulty_instance: dual_variant_calc / club_compliance_preliminary_diverges_from_adjudicated_score
          rationale: "That §1.8 instance asserts which variant drives escalation and which one only publishes, at both FINDINGS_ISSUED and CLOSED_UPHELD."

      - name: fine_ledger_reconciliation_on_variant_switch
        claim_type: reconciliation
        grounds:
          - calculations.club_posture_propagation
        excluded_because:
          difficulty_instance: compensating_invariant / dismissed_audit_vacates_club_fine_ledger_without_drift
          rationale: "The ledger delta when an audit leaves the counted set is that instance's asserted invariant."

  - section: validations
    instances:
      - name: evaluation_for_player_not_on_either_game_club_rejected
        claim_type: cross_entity_validation
        grounds:
          - validations.priority_22
          - errors.ERR_PLAYER_CLUB_MISMATCH
        distinguishing_aspect: "Validity depends on the referenced game, not the caller: a Northshore physician evaluating his own Northshore player is inside his club scope yet still refused with ERR_PLAYER_CLUB_MISMATCH because Northshore is neither the home nor the away club of the Harbor City v Ridgeway game."
        test_recipe:
          setup: ["Three clubs, a Northshore physician and player, and a live Harbor City v Ridgeway game"]
          setup_api_calls:
            - *k_clock_aug1
            - *k_club_h
            - *k_club_r
            - call: "POST /concussion-program/clubs"
              payload: { name: "Northshore Pilots", market_code: "NSP", exemption_slots_total: 2 }
              as: LeagueAdmin
              captures: { club_n_id: $.data.id }
            - *k_doc_n
            - call: "POST /concussion-program/players"
              payload: { club_id: "${club_n_id}", full_name: "P Novak", jersey_number: 11, position: "QB" }
              as: LeagueAdmin
              captures: { player_n1_id: $.data.id }
            - *k_game
            - *k_clock_kick
            - *k_game_live
            - *k_clock_1805
          trigger:
            - call: "POST /concussion-program/sideline-evaluations"
              payload: { player_id: "${player_n1_id}", game_id: "${game_id}", trigger_source: "CLUB_MEDICAL_STAFF" }
              as: ClubPhysician
              as_user_id: "${doc_n_id}"
          assert:
            - "response status 422 with error_id ERR_PLAYER_CLUB_MISMATCH"
            - "GET /concussion-program/sideline-evaluations?game_id=${game_id} returns meta.total_count == 0"
            - "Player.${player_n1_id}.availability_status == AVAILABLE"

      - name: expired_credential_blocks_clinician_write
        claim_type: temporal_validation
        grounds:
          - validations.priority_23
          - errors.ERR_CLINICIAN_CREDENTIAL_EXPIRED
        distinguishing_aspect: "The credential check is strictly-after-now, so a clinician whose credential_expires_at is 2026-09-01T00:00:00Z cannot file a baseline test on 2026-09-13 even with a perfectly fresh expected_player_version."
        test_recipe:
          setup: ["Harbor City with a lapsed physician (credential expiring 2026-09-01) and K Mbeki at version 1"]
          setup_api_calls:
            - *k_clock_aug1
            - *k_club_h
            - call: "POST /concussion-program/clinicians"
              payload: { full_name: "Dr Lapsed", affiliation: "CLUB_AFFILIATED", license_number: "LIC-1009", credential_expires_at: "2026-09-01T00:00:00Z", club_id: "${club_h_id}" }
              as: LeagueAdmin
              captures: { doc_exp_id: $.data.id }
            - *k_player
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-13T18:05:00Z" }
              as: LeagueAdmin
          trigger:
            - call: "POST /concussion-program/baseline-tests"
              payload: { player_id: "${player_id}", season_year: 2026, composite_score: 88, reaction_time_ms: 520, symptom_score: 0, expected_player_version: "${player_v1}" }
              as: ClubPhysician
              as_user_id: "${doc_exp_id}"
          assert:
            - "response status 422 with error_id ERR_CLINICIAN_CREDENTIAL_EXPIRED"
            - "Player.${player_id}.baseline_status == NONE and version == 1"
            - "GET /concussion-program/baseline-tests?player_id=${player_id} returns meta.total_count == 0"

      - name: evaluation_in_scheduled_game_rejected
        claim_type: violation_to_error
        grounds:
          - validations.priority_24
          - errors.ERR_GAME_NOT_IN_PROGRESS
        distinguishing_aspect: "Sideline work is confined to live football: opening an evaluation while the game is still SCHEDULED returns ERR_GAME_NOT_IN_PROGRESS, and the identical call succeeds once the game is advanced to IN_PROGRESS."
        test_recipe:
          setup: ["Harbor City with Dr Osei on duty, K Mbeki with a baseline, and a still-SCHEDULED week-1 game, clock 2026-09-13T18:05:00Z"]
          setup_api_calls:
            - *k_clock_aug1
            - *k_club_h
            - *k_club_r
            - *k_doc_h
            - *k_obs
            - *k_player
            - *k_baseline
            - *k_game
            - *k_clock_1805
          trigger:
            - call: "POST /concussion-program/sideline-evaluations"
              payload: { player_id: "${player_id}", game_id: "${game_id}", trigger_source: "UNAFFILIATED_OBSERVER" }
              as: UnaffiliatedObserver
              as_user_id: "${obs_id}"
            - call: "POST /concussion-program/games/${game_id}/advance-status"
              payload: { to_status: "IN_PROGRESS" }
              as: LeagueAdmin
            - call: "POST /concussion-program/sideline-evaluations"
              payload: { player_id: "${player_id}", game_id: "${game_id}", trigger_source: "UNAFFILIATED_OBSERVER" }
              as: UnaffiliatedObserver
              as_user_id: "${obs_id}"
              captures: { eval_ok_id: $.data.id }
          assert:
            - "trigger 1: response status 422 with error_id ERR_GAME_NOT_IN_PROGRESS"
            - "trigger 3: response status 201 with SidelineEvaluation.${eval_ok_id}.status == INITIATED"
            - "trigger 3: SidelineEvaluation.${eval_ok_id}.protocol_deadline_at == 2026-09-13T18:20:00.000Z"

      - name: locker_room_exam_consultant_must_be_eligible
        claim_type: violation_to_error
        grounds:
          - validations.priority_20
          - errors.ERR_EXAM_INC_INELIGIBLE
        distinguishing_aspect: "The examination consultant must be an unaffiliated observer or independent consultant and never the examining physician: naming the club's second physician is refused with ERR_EXAM_INC_INELIGIBLE, and naming the examining physician himself is refused for the same reason, while Dr Osei is accepted."
        test_recipe:
          setup: ["The canonical evaluation in SCREENED with two Harbor City physicians and Dr Osei available, clock 2026-09-13T18:10:00Z"]
          setup_api_calls:
            - *k_clock_aug1
            - *k_club_h
