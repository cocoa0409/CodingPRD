          Empty-collection boundary rather than a numeric one: the only application is still
          SUBMITTED, so the ranking input set is empty and the run must return HTTP 200 with
          awarded_count 0, waitlisted_count 0 and both id arrays empty while still advancing the
          program year to ACTIVE - not a 4xx, not a division-by-zero, and not an award to an
          undetermined application.
