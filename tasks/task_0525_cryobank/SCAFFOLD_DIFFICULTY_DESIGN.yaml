  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: retest_vs_quarantine_temporal_release
        grounds:
          - validations[priority=5]
          - validations[priority=6]
        distinguishing_aspect: |
          Category pair business_safety (ERR_RETEST_NOT_NEGATIVE p5) vs business_temporal
          (ERR_QUARANTINE_NOT_ELAPSED p6): a release attempt violating BOTH (retest_negative=false AND clock
          before quarantine_release_date) returns the higher-priority ERR_RETEST_NOT_NEGATIVE.
        test_recipe:
          setup:
            - "Specimen in QUARANTINE with retest_negative=false and quarantine_release_date 2026-06-01, clock still at default 2026-05-01."
          setup_api_calls:
            - { call: "POST /donors", payload: { display_code: "D-9", full_name: "Donor Nine", donor_type: "SPERM", blood_type: "O_POS", family_limit: 10 }, as: ScreeningOfficer, captures: { donor_id: "$.data.id" } }
            - { call: "POST /screening-applications", payload: { donor_id: "${donor_id}", fda_risk_flag: false, genetic_carrier_count: 0, partner_screening_required: false }, as: ScreeningOfficer, captures: { app_id: "$.data.id" } }
            - { call: "POST /screening-applications/${app_id}/start-review", payload: {}, as: ScreeningOfficer }
            - { call: "POST /screening-applications/${app_id}/approve", payload: {}, as: ScreeningOfficer }
            - { call: "POST /specimens", payload: { donor_id: "${donor_id}", collection_date: "2026-05-01T00:00:00Z", initial_vial_count: 5, quarantine_release_date: "2026-06-01T00:00:00Z", retest_negative: false }, as: LabTech, captures: { spec_id: "$.data.id" } }
            - { call: "POST /specimens/${spec_id}/begin-quarantine", payload: { dewar_code: "T-9" }, as: LabTech }
          trigger:
            - { call: "POST /specimens/${spec_id}/release-quarantine", payload: {}, as: ComplianceOfficer, captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_RETEST_NOT_NEGATIVE (p5 wins over p6 ERR_QUARANTINE_NOT_ELAPSED)"
            - "Specimen.${spec_id}.status == QUARANTINE (unchanged)"

      - name: consent_vs_family_limit_on_reservation
        grounds:
          - validations[priority=9]
          - validations[priority=10]
        distinguishing_aspect: |
          Category pair business_referential (ERR_CONSENT_MISSING p9) vs business_constraint
