# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN — task_1017 (Test Targeting Index, §1.8)
# 9 rules x 2 instances = 18 instances. Every instance grounds in SCAFFOLD.yaml.
# All literal asserts pre-computed against the pinned formulas/constants.
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: dvc_patronage_dividend_estimated_rate_on_member
        grounds:
          - calculations.patronage_dividend
          - entities.Member.fields.patronage_dividend_cents
          - entities.FiscalYear.fields.patronage_rate
          - state_machines.PatronageAllocation.DRAFT_to_FINALIZED
        distinguishing_aspect: "Dual-variant on the MEMBER domain: ESTIMATED uses fiscal_year.patronage_rate (0.05) -> dividend 1000; the FINAL variant with declared_rate 0.08 on the identical patronage_cents_ytd=20000 would yield 1600, a different number."
        test_recipe:
          setup:
            - "OPEN FiscalYear patronage_rate=0.05, equity_share_price_cents=10000."
            - "Member M ACTIVE (equity 10000, approved) with patronage_cents_ytd=20000 accrued from one finalized member sale of a patronage-eligible EACH product (base 10000, qty 2)."
            - "A DRAFT ESTIMATED PatronageAllocation created against the OPEN year, then FINALIZED."
          setup_api_calls:
            - { call: "POST /coop/fiscal-years", payload: { year: 2026, patronage_rate: 0.05, equity_share_price_cents: 10000 }, as: CoopAdmin, captures: { fy_id: "$.data.id" } }
            - { call: "POST /coop/vendors", payload: { name: "Green Farms" }, as: InventoryManager, captures: { v_id: "$.data.id" } }
            - { call: "POST /coop/vendors/${v_id}/set-status", payload: { status: "APPROVED" }, as: InventoryManager }
            - { call: "POST /coop/products", payload: { vendor_id: "${v_id}", sku: "OATS", name: "Bulk Oats", department: "GROCERY", unit_type: "EACH", base_price_cents: 10000, reorder_point: 0, reorder_qty: 10, is_taxable: false, is_prepared_food: false }, as: InventoryManager, captures: { p_id: "$.data.id" } }
            - { call: "POST /coop/inventory-lots", payload: { product_id: "${p_id}", vendor_id: "${v_id}", received_qty: 10, unit_cost_cents: 5000 }, as: InventoryManager, captures: { lot_id: "$.data.id" } }
            - { call: "POST /coop/inventory-lots/${lot_id}/post", payload: {}, as: InventoryManager }
            - { call: "POST /coop/members", payload: { full_name: "Mara O", email: "mara@x.com" }, as: CoopAdmin, captures: { m_id: "$.data.id" } }
            - { call: "POST /coop/members/${m_id}/equity-contribution", payload: { amount_cents: 10000 }, as: FinanceManager }
            - { call: "POST /coop/members/${m_id}/approve", payload: {}, as: CoopAdmin }
            - { call: "POST /coop/registers", payload: { name: "R1" }, as: Cashier, captures: { reg_id: "$.data.id" } }
            - { call: "POST /coop/registers/${reg_id}/set-open", payload: { is_open: true }, as: Cashier }
            - { call: "POST /coop/sales", payload: { register_id: "${reg_id}", member_id: "${m_id}" }, as: Cashier, captures: { s_id: "$.data.id" } }
            - { call: "POST /coop/sales/${s_id}/lines", payload: { product_id: "${p_id}", inventory_lot_id: "${lot_id}", quantity: 2 }, as: Cashier }
            - { call: "POST /coop/sales/${s_id}/finalize", payload: {}, as: Cashier }
            - { call: "GET /coop/fiscal-years/${fy_id}", payload: {}, as: FinanceManager, captures: { fy_ver: "$.data.version" } }
            - { call: "POST /coop/patronage-allocations", payload: { fiscal_year_id: "${fy_id}", method: "ESTIMATED", expected_fiscal_year_version: "${fy_ver}" }, as: FinanceManager, captures: { alloc_id: "$.data.id" } }
          trigger:
            - { call: "POST /coop/patronage-allocations/${alloc_id}/finalize", payload: {}, as: FinanceManager }
          assert:
            - "Member.${m_id}.patronage_dividend_cents == 1000"
            - "PatronageAllocation.${alloc_id}.total_dividend_cents == 1000"
            - "PatronageAllocation.${alloc_id}.status == FINALIZED"

      - name: dvc_shrink_fifo_vs_weighted_average_on_lot
        grounds:
          - calculations.shrink_writeoff_cost
          - entities.Product.fields.last_shrink_cost_cents
          - entities.Product.fields.inventory_value_cents
          - entities.InventoryLot.fields.qty_shrunk
        distinguishing_aspect: "Dual-variant on the INVENTORYLOT domain: FIFO write-off of 12 units across lots 10@100 then 10@200 costs 1400 (applied to last_shrink_cost_cents); the weighted-average basis for the identical shrink would cost 12*150=1800, a different number."
        test_recipe:
          setup:
            - "Product P with two POSTED lots: lot A received 10 @ unit_cost 100 (created first), lot B received 10 @ unit_cost 200 (created later). qty_on_hand A=10, B=10."
          setup_api_calls:
            - { call: "POST /coop/vendors", payload: { name: "Co-op Dairy" }, as: InventoryManager, captures: { v_id: "$.data.id" } }
            - { call: "POST /coop/vendors/${v_id}/set-status", payload: { status: "APPROVED" }, as: InventoryManager }
            - { call: "POST /coop/products", payload: { vendor_id: "${v_id}", sku: "MILK", name: "Milk Qt", department: "GROCERY", unit_type: "EACH", base_price_cents: 300, reorder_point: 0, reorder_qty: 20 }, as: InventoryManager, captures: { p_id: "$.data.id" } }
            - { call: "POST /coop/inventory-lots", payload: { product_id: "${p_id}", vendor_id: "${v_id}", received_qty: 10, unit_cost_cents: 100 }, as: InventoryManager, captures: { lot_a: "$.data.id" } }
            - { call: "POST /coop/inventory-lots/${lot_a}/post", payload: {}, as: InventoryManager }
            - { call: "POST /coop/inventory-lots", payload: { product_id: "${p_id}", vendor_id: "${v_id}", received_qty: 10, unit_cost_cents: 200 }, as: InventoryManager, captures: { lot_b: "$.data.id" } }
            - { call: "POST /coop/inventory-lots/${lot_b}/post", payload: {}, as: InventoryManager }
          trigger:
            - { call: "POST /coop/products/${p_id}/shrink", payload: { quantity: 12 }, as: InventoryManager }
          assert:
            - "Product.${p_id}.last_shrink_cost_cents == 1400"
            - "InventoryLot.${lot_a}.qty_on_hand == 0"
            - "InventoryLot.${lot_a}.qty_shrunk == 10"
            - "InventoryLot.${lot_b}.qty_on_hand == 8"
            - "InventoryLot.${lot_b}.qty_shrunk == 2"
            - "Product.${p_id}.inventory_value_cents == 1600"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: cf_mode_a_member_deal_suppresses_working_discount
        grounds:
          - calculations.sale_line_price
          - entities.Promotion.fields.member_only
          - entities.Member.fields.is_working_member
          - state_machines.WorkingMemberShift.SCHEDULED_to_COMPLETED
        distinguishing_aspect: "Mode (a) non-linear stacking: >=3 inputs (base price, member_only promo, is_working_member) with a conditional branch — because the applied promo is member_only, the 10% working-member discount is suppressed, so unit stays 400 (line 800), NOT 400*0.9=360 (line 720)."
        test_recipe:
          setup:
            - "OPEN FiscalYear. Product P EACH base 500, non-taxable. MEMBER_DEAL promo_price 400 (member_only) active over the clock 2026-07-01."
            - "Member M ACTIVE and is_working_member (one COMPLETED 12h shift). Register OPEN. Member sale with one line qty 2."
          setup_api_calls:
            - { call: "POST /coop/fiscal-years", payload: { year: 2026, patronage_rate: 0.05, equity_share_price_cents: 10000 }, as: CoopAdmin, captures: { fy_id: "$.data.id" } }
            - { call: "POST /coop/vendors", payload: { name: "V" }, as: InventoryManager, captures: { v_id: "$.data.id" } }
            - { call: "POST /coop/vendors/${v_id}/set-status", payload: { status: "APPROVED" }, as: InventoryManager }
            - { call: "POST /coop/products", payload: { vendor_id: "${v_id}", sku: "TEA", name: "Herbal Tea", department: "GROCERY", unit_type: "EACH", base_price_cents: 500, reorder_point: 0, reorder_qty: 10, is_taxable: false }, as: InventoryManager, captures: { p_id: "$.data.id" } }
            - { call: "POST /coop/promotions", payload: { product_id: "${p_id}", deal_type: "MEMBER_DEAL", promo_price_cents: 400, member_only: true, start_date: "2026-06-01T00:00:00Z", end_date: "2026-08-01T00:00:00Z" }, as: InventoryManager, captures: { promo_id: "$.data.id" } }
            - { call: "POST /coop/inventory-lots", payload: { product_id: "${p_id}", vendor_id: "${v_id}", received_qty: 10, unit_cost_cents: 200 }, as: InventoryManager, captures: { lot_id: "$.data.id" } }
            - { call: "POST /coop/inventory-lots/${lot_id}/post", payload: {}, as: InventoryManager }
            - { call: "POST /coop/members", payload: { full_name: "Wren W", email: "wren@x.com" }, as: CoopAdmin, captures: { m_id: "$.data.id" } }
            - { call: "POST /coop/members/${m_id}/equity-contribution", payload: { amount_cents: 10000 }, as: FinanceManager }
            - { call: "POST /coop/members/${m_id}/approve", payload: {}, as: CoopAdmin }
            - { call: "POST /coop/working-shifts", payload: { member_id: "${m_id}", department: "GROCERY", start_at: "2026-07-01T08:00:00Z", end_at: "2026-07-01T20:00:00Z" }, as: CoopAdmin, captures: { sh_id: "$.data.id" } }
            - { call: "POST /coop/working-shifts/${sh_id}/complete", payload: {}, as: InventoryManager }
            - { call: "POST /coop/registers", payload: { name: "R1" }, as: Cashier, captures: { reg_id: "$.data.id" } }
            - { call: "POST /coop/registers/${reg_id}/set-open", payload: { is_open: true }, as: Cashier }
            - { call: "POST /coop/sales", payload: { register_id: "${reg_id}", member_id: "${m_id}" }, as: Cashier, captures: { s_id: "$.data.id" } }
          trigger:
            - { call: "POST /coop/sales/${s_id}/lines", payload: { product_id: "${p_id}", inventory_lot_id: "${lot_id}", quantity: 2 }, as: Cashier }
            - { call: "POST /coop/sales/${s_id}/finalize", payload: {}, as: Cashier }
          assert:
            - "Member.${m_id}.is_working_member == true"
            - "Sale.${s_id}.subtotal_cents == 800"
            - "Sale.${s_id}.tax_total_cents == 0"
            - "Sale.${s_id}.total_cents == 800"

      - name: cf_mode_b_round_per_line_then_sum_tax
        grounds:
          - calculations.sale_totals
          - calculations.sale_line_price
          - entities.Sale.fields.tax_total_cents
        distinguishing_aspect: "Mode (b) rounding-order: two taxable lines of subtotal 706 each round to line tax 56 apiece -> summed tax_total 112; the sum-then-round order (1412*0.08=112.96 -> 113) is a different cent. Scaffold pins round-per-line-then-sum."
        test_recipe:
          setup:
            - "Non-member sale on OPEN register with two lines of the same taxable EACH product (base 706), qty 1 each."
          setup_api_calls:
            - { call: "POST /coop/vendors", payload: { name: "V" }, as: InventoryManager, captures: { v_id: "$.data.id" } }
            - { call: "POST /coop/vendors/${v_id}/set-status", payload: { status: "APPROVED" }, as: InventoryManager }
            - { call: "POST /coop/products", payload: { vendor_id: "${v_id}", sku: "SOAP", name: "Castile Soap", department: "GROCERY", unit_type: "EACH", base_price_cents: 706, reorder_point: 0, reorder_qty: 10, is_taxable: true }, as: InventoryManager, captures: { p_id: "$.data.id" } }
            - { call: "POST /coop/inventory-lots", payload: { product_id: "${p_id}", vendor_id: "${v_id}", received_qty: 10, unit_cost_cents: 300 }, as: InventoryManager, captures: { lot_id: "$.data.id" } }
            - { call: "POST /coop/inventory-lots/${lot_id}/post", payload: {}, as: InventoryManager }
            - { call: "POST /coop/registers", payload: { name: "R1" }, as: Cashier, captures: { reg_id: "$.data.id" } }
            - { call: "POST /coop/registers/${reg_id}/set-open", payload: { is_open: true }, as: Cashier }
            - { call: "POST /coop/sales", payload: { register_id: "${reg_id}" }, as: Cashier, captures: { s_id: "$.data.id" } }
            - { call: "POST /coop/sales/${s_id}/lines", payload: { product_id: "${p_id}", inventory_lot_id: "${lot_id}", quantity: 1 }, as: Cashier }
            - { call: "POST /coop/sales/${s_id}/lines", payload: { product_id: "${p_id}", inventory_lot_id: "${lot_id}", quantity: 1 }, as: Cashier }
          trigger:
            - { call: "POST /coop/sales/${s_id}/finalize", payload: {}, as: Cashier }
          assert:
            - "Sale.${s_id}.subtotal_cents == 1412"
            - "Sale.${s_id}.tax_total_cents == 112"
            - "Sale.${s_id}.total_cents == 1524"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: nlsm_sale_parallel_payment_independent_of_checkout
        grounds:
          - state_machines.Sale.UNPAID_to_PAID
          - state_machines.Sale.BUILDING_to_FINALIZED
          - entities.Sale.fields.payment_status
          - entities.Sale.fields.checkout_status
        distinguishing_aspect: "Parallel dimensions on the Sale entity: paying a BUILDING sale advances payment_status UNPAID->PAID while checkout_status stays BUILDING, proving the two axes evolve independently."
        test_recipe:
          setup:
            - "OPEN register; a fresh BUILDING/UNPAID sale (no lines needed)."
          setup_api_calls:
            - { call: "POST /coop/registers", payload: { name: "R1" }, as: Cashier, captures: { reg_id: "$.data.id" } }
            - { call: "POST /coop/registers/${reg_id}/set-open", payload: { is_open: true }, as: Cashier }
            - { call: "POST /coop/sales", payload: { register_id: "${reg_id}" }, as: Cashier, captures: { s_id: "$.data.id" } }
          trigger:
            - { call: "POST /coop/sales/${s_id}/pay", payload: {}, as: Cashier }
          assert:
            - "Sale.${s_id}.payment_status == PAID"
            - "Sale.${s_id}.checkout_status == BUILDING"

      - name: nlsm_board_proposal_revision_cycle
        grounds:
          - state_machines.BoardProposal.DRAFT_to_UNDER_REVIEW
          - state_machines.BoardProposal.UNDER_REVIEW_to_DRAFT
          - state_machines.BoardProposal.UNDER_REVIEW_to_VOTING
        distinguishing_aspect: "Cyclic shape on the BoardProposal entity: SUBMIT (DRAFT->UNDER_REVIEW) then REQUEST_REVISIONS (UNDER_REVIEW->DRAFT) loops back to DRAFT, from which a second SUBMIT then OPEN_VOTING reaches VOTING."
        test_recipe:
          setup:
            - "A DRAFT board proposal."
          setup_api_calls:
            - { call: "POST /coop/board-proposals", payload: { title: "Bylaw A", proposal_type: "BYLAW" }, as: BoardAdmin, captures: { bp_id: "$.data.id" } }
            - { call: "POST /coop/board-proposals/${bp_id}/advance", payload: { action: "SUBMIT" }, as: BoardAdmin }
            - { call: "POST /coop/board-proposals/${bp_id}/advance", payload: { action: "REQUEST_REVISIONS" }, as: BoardAdmin }
          trigger:
            - { call: "POST /coop/board-proposals/${bp_id}/advance", payload: { action: "SUBMIT" }, as: BoardAdmin }
            - { call: "POST /coop/board-proposals/${bp_id}/advance", payload: { action: "OPEN_VOTING" }, as: BoardAdmin }
          assert:
            - "BoardProposal.${bp_id}.status == VOTING"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: tc_sale_finalize_depletes_lot_flags_reorder
        grounds:
          - state_machines.Sale.BUILDING_to_FINALIZED
          - calculations.reorder_flag
          - entities.InventoryLot.fields.qty_on_hand
          - entities.Product.fields.needs_reorder
        distinguishing_aspect: "Depth-3 chain from sale finalize: Sale FINALIZED (A) -> InventoryLot.qty_on_hand 10->8 (B, caused by A) -> Product.qty_on_hand_total 8 <= reorder_point 8 sets needs_reorder true (C, caused by B crossing the threshold)."
        test_recipe:
          setup:
            - "Product reorder_point 8; one POSTED lot received 10 (on_hand 10); OPEN register; non-member sale, one line qty 2."
          setup_api_calls:
            - { call: "POST /coop/vendors", payload: { name: "V" }, as: InventoryManager, captures: { v_id: "$.data.id" } }
            - { call: "POST /coop/vendors/${v_id}/set-status", payload: { status: "APPROVED" }, as: InventoryManager }
            - { call: "POST /coop/products", payload: { vendor_id: "${v_id}", sku: "RICE", name: "Brown Rice", department: "BULK", unit_type: "EACH", base_price_cents: 400, reorder_point: 8, reorder_qty: 20 }, as: InventoryManager, captures: { p_id: "$.data.id" } }
            - { call: "POST /coop/inventory-lots", payload: { product_id: "${p_id}", vendor_id: "${v_id}", received_qty: 10, unit_cost_cents: 200 }, as: InventoryManager, captures: { lot_id: "$.data.id" } }
            - { call: "POST /coop/inventory-lots/${lot_id}/post", payload: {}, as: InventoryManager }
            - { call: "POST /coop/registers", payload: { name: "R1" }, as: Cashier, captures: { reg_id: "$.data.id" } }
            - { call: "POST /coop/registers/${reg_id}/set-open", payload: { is_open: true }, as: Cashier }
            - { call: "POST /coop/sales", payload: { register_id: "${reg_id}" }, as: Cashier, captures: { s_id: "$.data.id" } }
            - { call: "POST /coop/sales/${s_id}/lines", payload: { product_id: "${p_id}", inventory_lot_id: "${lot_id}", quantity: 2 }, as: Cashier }
          trigger:
            - { call: "POST /coop/sales/${s_id}/finalize", payload: {}, as: Cashier }
          assert:
            - "InventoryLot.${lot_id}.qty_on_hand == 8"
            - "Product.${p_id}.qty_on_hand_total == 8"
            - "Product.${p_id}.needs_reorder == true"

      - name: tc_allocation_finalize_credits_member_equity_then_year
        grounds:
          - state_machines.PatronageAllocation.DRAFT_to_FINALIZED
          - calculations.patronage_dividend
          - entities.Member.fields.equity_paid_in_cents
          - entities.FiscalYear.fields.total_equity_cents
        distinguishing_aspect: "Depth-3 money chain from allocation finalize: PatronageAllocation FINALIZED (A) -> Member.equity_paid_in_cents 10000->10200 via retained 200 (B, caused by A) -> FiscalYear.total_equity_cents 10000->10200 (C, caused by B's equity credit). Different trigger and propagation pattern from the inventory cascade."
        test_recipe:
          setup:
            - "OPEN FiscalYear patronage_rate 0.05; Member M ACTIVE with equity 10000 and patronage_cents_ytd 20000; a DRAFT ESTIMATED allocation."
          setup_api_calls:
            - { call: "POST /coop/fiscal-years", payload: { year: 2026, patronage_rate: 0.05, equity_share_price_cents: 10000 }, as: CoopAdmin, captures: { fy_id: "$.data.id" } }
            - { call: "POST /coop/vendors", payload: { name: "V" }, as: InventoryManager, captures: { v_id: "$.data.id" } }
            - { call: "POST /coop/vendors/${v_id}/set-status", payload: { status: "APPROVED" }, as: InventoryManager }
            - { call: "POST /coop/products", payload: { vendor_id: "${v_id}", sku: "OATS", name: "Oats", department: "GROCERY", unit_type: "EACH", base_price_cents: 10000, reorder_point: 0, reorder_qty: 10, is_taxable: false }, as: InventoryManager, captures: { p_id: "$.data.id" } }
            - { call: "POST /coop/inventory-lots", payload: { product_id: "${p_id}", vendor_id: "${v_id}", received_qty: 10, unit_cost_cents: 5000 }, as: InventoryManager, captures: { lot_id: "$.data.id" } }
            - { call: "POST /coop/inventory-lots/${lot_id}/post", payload: {}, as: InventoryManager }
            - { call: "POST /coop/members", payload: { full_name: "Mara O", email: "mara@x.com" }, as: CoopAdmin, captures: { m_id: "$.data.id" } }
            - { call: "POST /coop/members/${m_id}/equity-contribution", payload: { amount_cents: 10000 }, as: FinanceManager }
            - { call: "POST /coop/members/${m_id}/approve", payload: {}, as: CoopAdmin }
            - { call: "POST /coop/registers", payload: { name: "R1" }, as: Cashier, captures: { reg_id: "$.data.id" } }
            - { call: "POST /coop/registers/${reg_id}/set-open", payload: { is_open: true }, as: Cashier }
            - { call: "POST /coop/sales", payload: { register_id: "${reg_id}", member_id: "${m_id}" }, as: Cashier, captures: { s_id: "$.data.id" } }
            - { call: "POST /coop/sales/${s_id}/lines", payload: { product_id: "${p_id}", inventory_lot_id: "${lot_id}", quantity: 2 }, as: Cashier }
            - { call: "POST /coop/sales/${s_id}/finalize", payload: {}, as: Cashier }
            - { call: "GET /coop/fiscal-years/${fy_id}", payload: {}, as: FinanceManager, captures: { fy_ver: "$.data.version" } }
            - { call: "POST /coop/patronage-allocations", payload: { fiscal_year_id: "${fy_id}", method: "ESTIMATED", expected_fiscal_year_version: "${fy_ver}" }, as: FinanceManager, captures: { alloc_id: "$.data.id" } }
          trigger:
            - { call: "POST /coop/patronage-allocations/${alloc_id}/finalize", payload: {}, as: FinanceManager }
          assert:
            - "Member.${m_id}.equity_paid_in_cents == 10200"
            - "FiscalYear.${fy_id}.total_equity_cents == 10200"
            - "PatronageAllocation.${alloc_id}.total_retained_cents == 200"

  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: ppvc_state_beats_fiscal_on_finalize
        grounds:
          - validations[priority=4]
          - validations[priority=9]
          - errors[ERR_REGISTER_CLOSED]
          - errors[ERR_INSUFFICIENT_INVENTORY]
        distinguishing_aspect: "Category pair {state, business_fiscal}: a finalize that violates BOTH register-closed (state, prio 4) and insufficient-inventory (business_fiscal, prio 9) returns ERR_REGISTER_CLOSED, proving state outranks fiscal."
        test_recipe:
          setup:
            - "Sale built while register OPEN with a line qty 5 against a lot of only received_qty 3 (insufficient at finalize); register then CLOSED before finalize."
          setup_api_calls:
            - { call: "POST /coop/vendors", payload: { name: "V" }, as: InventoryManager, captures: { v_id: "$.data.id" } }
            - { call: "POST /coop/vendors/${v_id}/set-status", payload: { status: "APPROVED" }, as: InventoryManager }
            - { call: "POST /coop/products", payload: { vendor_id: "${v_id}", sku: "NUTS", name: "Cashews", department: "BULK", unit_type: "EACH", base_price_cents: 400, reorder_point: 0, reorder_qty: 10 }, as: InventoryManager, captures: { p_id: "$.data.id" } }
            - { call: "POST /coop/inventory-lots", payload: { product_id: "${p_id}", vendor_id: "${v_id}", received_qty: 3, unit_cost_cents: 200 }, as: InventoryManager, captures: { lot_id: "$.data.id" } }
            - { call: "POST /coop/inventory-lots/${lot_id}/post", payload: {}, as: InventoryManager }
            - { call: "POST /coop/registers", payload: { name: "R1" }, as: Cashier, captures: { reg_id: "$.data.id" } }
            - { call: "POST /coop/registers/${reg_id}/set-open", payload: { is_open: true }, as: Cashier }
            - { call: "POST /coop/sales", payload: { register_id: "${reg_id}" }, as: Cashier, captures: { s_id: "$.data.id" } }
            - { call: "POST /coop/sales/${s_id}/lines", payload: { product_id: "${p_id}", inventory_lot_id: "${lot_id}", quantity: 5 }, as: Cashier }
            - { call: "POST /coop/registers/${reg_id}/set-open", payload: { is_open: false }, as: Cashier }
          trigger:
            - { call: "POST /coop/sales/${s_id}/finalize", payload: {}, as: Cashier, captures: { err: "$.data.error_id" } }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_REGISTER_CLOSED"

      - name: ppvc_safety_beats_referential_on_add_line
        grounds:
          - validations[priority=5]
          - validations[priority=7]
          - errors[ERR_PRODUCT_RECALLED]
          - errors[ERR_LOT_PRODUCT_MISMATCH]
        distinguishing_aspect: "Category pair {business_safety, business_referential}: adding a line whose product is RECALLED (safety, prio 5) AND whose inventory_lot_id belongs to a different product (referential, prio 7) returns ERR_PRODUCT_RECALLED, proving safety outranks referential."
        test_recipe:
          setup:
            - "Product P1 set to RECALLED. Separate product P2 with POSTED lot L2. OPEN register, BUILDING sale."
          setup_api_calls:
            - { call: "POST /coop/vendors", payload: { name: "V" }, as: InventoryManager, captures: { v_id: "$.data.id" } }
            - { call: "POST /coop/vendors/${v_id}/set-status", payload: { status: "APPROVED" }, as: InventoryManager }
            - { call: "POST /coop/products", payload: { vendor_id: "${v_id}", sku: "P1", name: "Spinach", department: "PRODUCE", unit_type: "EACH", base_price_cents: 300, reorder_point: 0, reorder_qty: 10 }, as: InventoryManager, captures: { p1_id: "$.data.id" } }
            - { call: "POST /coop/products", payload: { vendor_id: "${v_id}", sku: "P2", name: "Kale", department: "PRODUCE", unit_type: "EACH", base_price_cents: 300, reorder_point: 0, reorder_qty: 10 }, as: InventoryManager, captures: { p2_id: "$.data.id" } }
            - { call: "POST /coop/inventory-lots", payload: { product_id: "${p2_id}", vendor_id: "${v_id}", received_qty: 10, unit_cost_cents: 100 }, as: InventoryManager, captures: { l2_id: "$.data.id" } }
            - { call: "POST /coop/inventory-lots/${l2_id}/post", payload: {}, as: InventoryManager }
            - { call: "PATCH /coop/products/${p1_id}", payload: { status: "RECALLED" }, as: InventoryManager }
            - { call: "POST /coop/registers", payload: { name: "R1" }, as: Cashier, captures: { reg_id: "$.data.id" } }
            - { call: "POST /coop/registers/${reg_id}/set-open", payload: { is_open: true }, as: Cashier }
            - { call: "POST /coop/sales", payload: { register_id: "${reg_id}" }, as: Cashier, captures: { s_id: "$.data.id" } }
          trigger:
            - { call: "POST /coop/sales/${s_id}/lines", payload: { product_id: "${p1_id}", inventory_lot_id: "${l2_id}", quantity: 1 }, as: Cashier, captures: { err: "$.data.error_id" } }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_PRODUCT_RECALLED"

  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: bpc_reorder_point_at_threshold_via_finalize
        grounds:
          - calculations.reorder_flag
          - entities.Product.fields.needs_reorder
          - state_machines.Sale.BUILDING_to_FINALIZED
        distinguishing_aspect: "Boundary <= on inventory quantity via POST /coop/sales/{id}/finalize: reorder_point 8, on_hand lands exactly on 8 (10 minus 2), and needs_reorder flips true because the test is <= (at the point), not < ."
        test_recipe:
          setup:
            - "Product reorder_point 8; POSTED lot received 10; OPEN register; non-member sale line qty 2 -> on_hand 8 after finalize."
          setup_api_calls:
            - { call: "POST /coop/vendors", payload: { name: "V" }, as: InventoryManager, captures: { v_id: "$.data.id" } }
            - { call: "POST /coop/vendors/${v_id}/set-status", payload: { status: "APPROVED" }, as: InventoryManager }
            - { call: "POST /coop/products", payload: { vendor_id: "${v_id}", sku: "BEAN", name: "Black Beans", department: "BULK", unit_type: "EACH", base_price_cents: 250, reorder_point: 8, reorder_qty: 20 }, as: InventoryManager, captures: { p_id: "$.data.id" } }
            - { call: "POST /coop/inventory-lots", payload: { product_id: "${p_id}", vendor_id: "${v_id}", received_qty: 10, unit_cost_cents: 100 }, as: InventoryManager, captures: { lot_id: "$.data.id" } }
            - { call: "POST /coop/inventory-lots/${lot_id}/post", payload: {}, as: InventoryManager }
            - { call: "POST /coop/registers", payload: { name: "R1" }, as: Cashier, captures: { reg_id: "$.data.id" } }
            - { call: "POST /coop/registers/${reg_id}/set-open", payload: { is_open: true }, as: Cashier }
            - { call: "POST /coop/sales", payload: { register_id: "${reg_id}" }, as: Cashier, captures: { s_id: "$.data.id" } }
            - { call: "POST /coop/sales/${s_id}/lines", payload: { product_id: "${p_id}", inventory_lot_id: "${lot_id}", quantity: 2 }, as: Cashier }
          trigger:
            - { call: "POST /coop/sales/${s_id}/finalize", payload: {}, as: Cashier }
          assert:
            - "Product.${p_id}.qty_on_hand_total == 8"
            - "Product.${p_id}.needs_reorder == true"

      - name: bpc_working_hours_at_threshold_via_shift_complete
        grounds:
          - calculations.working_member_hours
          - entities.Member.fields.is_working_member
          - state_machines.WorkingMemberShift.SCHEDULED_to_COMPLETED
        distinguishing_aspect: "Boundary >= on hours via POST /coop/working-shifts/{id}/complete: a 12h shift lands working_hours_balance exactly on WORKING_MEMBER_MIN_HOURS 12, and is_working_member flips true because the test is >= (at the threshold), not > . Different metric and endpoint than the reorder boundary."
        test_recipe:
          setup:
            - "Member M (any status; hours accrue regardless). One SCHEDULED 12h shift (08:00-20:00)."
          setup_api_calls:
            - { call: "POST /coop/members", payload: { full_name: "Ivy H", email: "ivy@x.com" }, as: CoopAdmin, captures: { m_id: "$.data.id" } }
            - { call: "POST /coop/working-shifts", payload: { member_id: "${m_id}", department: "GROCERY", start_at: "2026-07-02T08:00:00Z", end_at: "2026-07-02T20:00:00Z" }, as: CoopAdmin, captures: { sh_id: "$.data.id" } }
          trigger:
            - { call: "POST /coop/working-shifts/${sh_id}/complete", payload: {}, as: InventoryManager }
          assert:
            - "Member.${m_id}.working_hours_balance == 12"
            - "Member.${m_id}.is_working_member == true"

  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: cesd_sale_finalize_requires_register_open
        grounds:
          - state_machines.Sale.BUILDING_to_FINALIZED
          - entities.Register.fields.status
          - errors[ERR_REGISTER_CLOSED]
        distinguishing_aspect: "Entity pair (Sale, Register): a fully valid, in-stock sale cannot finalize while its Register.status == CLOSED, returning ERR_REGISTER_CLOSED."
        test_recipe:
          setup:
            - "Sale built (line in stock) while register OPEN, then register CLOSED; finalize attempted."
          setup_api_calls:
            - { call: "POST /coop/vendors", payload: { name: "V" }, as: InventoryManager, captures: { v_id: "$.data.id" } }
            - { call: "POST /coop/vendors/${v_id}/set-status", payload: { status: "APPROVED" }, as: InventoryManager }
            - { call: "POST /coop/products", payload: { vendor_id: "${v_id}", sku: "APL", name: "Apples", department: "PRODUCE", unit_type: "EACH", base_price_cents: 150, reorder_point: 0, reorder_qty: 10 }, as: InventoryManager, captures: { p_id: "$.data.id" } }
            - { call: "POST /coop/inventory-lots", payload: { product_id: "${p_id}", vendor_id: "${v_id}", received_qty: 10, unit_cost_cents: 80 }, as: InventoryManager, captures: { lot_id: "$.data.id" } }
            - { call: "POST /coop/inventory-lots/${lot_id}/post", payload: {}, as: InventoryManager }
            - { call: "POST /coop/registers", payload: { name: "R1" }, as: Cashier, captures: { reg_id: "$.data.id" } }
            - { call: "POST /coop/registers/${reg_id}/set-open", payload: { is_open: true }, as: Cashier }
            - { call: "POST /coop/sales", payload: { register_id: "${reg_id}" }, as: Cashier, captures: { s_id: "$.data.id" } }
            - { call: "POST /coop/sales/${s_id}/lines", payload: { product_id: "${p_id}", inventory_lot_id: "${lot_id}", quantity: 1 }, as: Cashier }
            - { call: "POST /coop/registers/${reg_id}/set-open", payload: { is_open: false }, as: Cashier }
          trigger:
            - { call: "POST /coop/sales/${s_id}/finalize", payload: {}, as: Cashier, captures: { err: "$.data.error_id" } }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_REGISTER_CLOSED"

      - name: cesd_lot_post_requires_vendor_approved
        grounds:
          - state_machines.InventoryLot.DRAFT_to_POSTED
          - entities.Vendor.fields.status
          - errors[ERR_VENDOR_NOT_APPROVED]
        distinguishing_aspect: "Entity pair (InventoryLot, Vendor): a DRAFT lot cannot be POSTED while its Vendor.status == PENDING, returning ERR_VENDOR_NOT_APPROVED. A different entity pair than (Sale, Register)."
        test_recipe:
          setup:
            - "Vendor left PENDING (never approved); Product ACTIVE; DRAFT lot created."
          setup_api_calls:
            - { call: "POST /coop/vendors", payload: { name: "Unvetted DSD" }, as: InventoryManager, captures: { v_id: "$.data.id" } }
            - { call: "POST /coop/products", payload: { vendor_id: "${v_id}", sku: "HNY", name: "Local Honey", department: "GROCERY", unit_type: "EACH", base_price_cents: 900, reorder_point: 0, reorder_qty: 10 }, as: InventoryManager, captures: { p_id: "$.data.id" } }
            - { call: "POST /coop/inventory-lots", payload: { product_id: "${p_id}", vendor_id: "${v_id}", received_qty: 6, unit_cost_cents: 500 }, as: InventoryManager, captures: { lot_id: "$.data.id" } }
          trigger:
            - { call: "POST /coop/inventory-lots/${lot_id}/post", payload: {}, as: InventoryManager, captures: { err: "$.data.error_id" } }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_VENDOR_NOT_APPROVED"

  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: rto_promotion_window_overlap_on_product
        grounds:
          - validations[priority=6]
          - entities.Promotion.fields.start_date
          - entities.Promotion.fields.end_date
          - errors[ERR_PROMO_WINDOW_OVERLAP]
        distinguishing_aspect: "Resource = Product promo calendar, half-open [start,end) date intervals with adjacency allowed: a second promo [07-10, 07-15) overlaps an existing [07-05, 07-12) on the same product and is rejected with ERR_PROMO_WINDOW_OVERLAP."
        test_recipe:
          setup:
            - "Product P with one existing promotion window 2026-07-05..2026-07-12."
          setup_api_calls:
            - { call: "POST /coop/vendors", payload: { name: "V" }, as: InventoryManager, captures: { v_id: "$.data.id" } }
            - { call: "POST /coop/products", payload: { vendor_id: "${v_id}", sku: "JAM", name: "Berry Jam", department: "GROCERY", unit_type: "EACH", base_price_cents: 650, reorder_point: 0, reorder_qty: 10 }, as: InventoryManager, captures: { p_id: "$.data.id" } }
            - { call: "POST /coop/promotions", payload: { product_id: "${p_id}", deal_type: "AD", promo_price_cents: 500, start_date: "2026-07-05T00:00:00Z", end_date: "2026-07-12T00:00:00Z" }, as: InventoryManager, captures: { promo1: "$.data.id" } }
          trigger:
            - { call: "POST /coop/promotions", payload: { product_id: "${p_id}", deal_type: "AD", promo_price_cents: 450, start_date: "2026-07-10T00:00:00Z", end_date: "2026-07-15T00:00:00Z" }, as: InventoryManager, captures: { err: "$.data.error_id" } }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_PROMO_WINDOW_OVERLAP"

      - name: rto_shift_rest_buffer_on_member
        grounds:
          - validations[priority=6]
          - entities.WorkingMemberShift.fields.start_at
          - entities.WorkingMemberShift.fields.end_at
          - errors[ERR_SHIFT_OVERLAP]
        distinguishing_aspect: "Resource = Member schedule, datetime intervals with a REST_BUFFER_MINUTES=60 gap rule (adjacency NOT allowed): a second shift starting only 30 min after the first ends is closer than the 60-min buffer and is rejected with ERR_SHIFT_OVERLAP. Different interval semantics than the promo half-open adjacency-allowed rule."
        test_recipe:
          setup:
            - "Member M with one SCHEDULED shift 2026-07-05T08:00..12:00."
          setup_api_calls:
            - { call: "POST /coop/members", payload: { full_name: "Bo K", email: "bo@x.com" }, as: CoopAdmin, captures: { m_id: "$.data.id" } }
            - { call: "POST /coop/working-shifts", payload: { member_id: "${m_id}", department: "CAFE_DELI", start_at: "2026-07-05T08:00:00Z", end_at: "2026-07-05T12:00:00Z" }, as: CoopAdmin, captures: { sh1: "$.data.id" } }
          trigger:
            - { call: "POST /coop/working-shifts", payload: { member_id: "${m_id}", department: "CAFE_DELI", start_at: "2026-07-05T12:30:00Z", end_at: "2026-07-05T14:00:00Z" }, as: CoopAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_SHIFT_OVERLAP"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: ci_inventory_units_conserved_on_sale_refund
        grounds:
          - state_machines.Sale.BUILDING_to_FINALIZED
          - state_machines.Sale.PAID_to_REFUNDED
          - entities.InventoryLot.fields.received_qty
          - entities.InventoryLot.fields.qty_on_hand
        distinguishing_aspect: "Conserved quantity = lot physical units: after finalize (sold 3, on_hand 7) then pay then refund (sold 0, on_hand 10), the invariant received_qty(10) == qty_on_hand(10) + qty_sold(0) + qty_shrunk(0) holds exactly with zero drift."
        test_recipe:
          setup:
            - "POSTED lot received 10; OPEN register; non-member sale, line qty 3; finalized; paid."
          setup_api_calls:
            - { call: "POST /coop/vendors", payload: { name: "V" }, as: InventoryManager, captures: { v_id: "$.data.id" } }
            - { call: "POST /coop/vendors/${v_id}/set-status", payload: { status: "APPROVED" }, as: InventoryManager }
            - { call: "POST /coop/products", payload: { vendor_id: "${v_id}", sku: "GRN", name: "Granola", department: "GROCERY", unit_type: "EACH", base_price_cents: 350, reorder_point: 0, reorder_qty: 10 }, as: InventoryManager, captures: { p_id: "$.data.id" } }
            - { call: "POST /coop/inventory-lots", payload: { product_id: "${p_id}", vendor_id: "${v_id}", received_qty: 10, unit_cost_cents: 150 }, as: InventoryManager, captures: { lot_id: "$.data.id" } }
            - { call: "POST /coop/inventory-lots/${lot_id}/post", payload: {}, as: InventoryManager }
            - { call: "POST /coop/registers", payload: { name: "R1" }, as: Cashier, captures: { reg_id: "$.data.id" } }
            - { call: "POST /coop/registers/${reg_id}/set-open", payload: { is_open: true }, as: Cashier }
            - { call: "POST /coop/sales", payload: { register_id: "${reg_id}" }, as: Cashier, captures: { s_id: "$.data.id" } }
            - { call: "POST /coop/sales/${s_id}/lines", payload: { product_id: "${p_id}", inventory_lot_id: "${lot_id}", quantity: 3 }, as: Cashier }
            - { call: "POST /coop/sales/${s_id}/finalize", payload: {}, as: Cashier }
            - { call: "POST /coop/sales/${s_id}/pay", payload: {}, as: Cashier }
          trigger:
            - { call: "POST /coop/sales/${s_id}/refund", payload: {}, as: Cashier }
          assert:
            - "InventoryLot.${lot_id}.qty_on_hand == 10"
            - "InventoryLot.${lot_id}.qty_sold == 0"
            - "InventoryLot.${lot_id}.qty_shrunk == 0"
            - "InventoryLot.${lot_id}.received_qty == 10"

      - name: ci_equity_money_conserved_on_member_drop
        grounds:
          - state_machines.Member.ACTIVE_to_DROPPED
          - calculations.equity_conservation
          - entities.Member.fields.equity_paid_in_cents
          - entities.FiscalYear.fields.total_equity_cents
        distinguishing_aspect: "Conserved quantity = equity money: contributing 15000 raises FiscalYear.total_equity_cents to 15000; dropping the member refunds it, so total_equity_cents returns to 0 and member equity is 0, keeping total_equity_cents == sum of non-DROPPED member equity. Different conserved quantity type (money vs units)."
        test_recipe:
          setup:
            - "OPEN FiscalYear; Member M ACTIVE with equity 15000 contributed."
          setup_api_calls:
            - { call: "POST /coop/fiscal-years", payload: { year: 2026, patronage_rate: 0.05, equity_share_price_cents: 10000 }, as: CoopAdmin, captures: { fy_id: "$.data.id" } }
            - { call: "POST /coop/members", payload: { full_name: "Cy D", email: "cy@x.com" }, as: CoopAdmin, captures: { m_id: "$.data.id" } }
            - { call: "POST /coop/members/${m_id}/equity-contribution", payload: { amount_cents: 15000 }, as: FinanceManager }
            - { call: "POST /coop/members/${m_id}/approve", payload: {}, as: CoopAdmin }
          trigger:
            - { call: "POST /coop/members/${m_id}/drop", payload: {}, as: CoopAdmin }
          assert:
            - "Member.${m_id}.equity_paid_in_cents == 0"
            - "Member.${m_id}.membership_status == DROPPED"
            - "FiscalYear.${fy_id}.total_equity_cents == 0"
