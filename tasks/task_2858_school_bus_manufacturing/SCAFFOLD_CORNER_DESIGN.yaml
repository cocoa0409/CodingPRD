          assert:
            - "the order is created ACTIVE at award (§1.4 records a fresh order ON_TRACK); the posture is asserted from the first declared recomputation point onward"
            - "minting the unit is a recomputation point and lands on AT_RISK: at_risk_unit_count == 1 (the unit is PLANNED) and days_to_promise == 34 < 45"
            - "after the slot commit the posture is ON_TRACK with at_risk_unit_count == 0 and liquidated_damages_cents == 0"
            - "setting the clock to 2026-10-20 does not change the posture: the GET still reads ON_TRACK with liquidated_damages_cents 0"
            - "the build advance to BODY_JOINED recomputes and lands on BREACHED (clock_date > 2026-10-05, delivered 0 < 1) with at_risk_unit_count == 0 and liquidated_damages_cents == 0"
            - "the release reverts the bus to PLANNED, so the recomputation keeps BREACHED and now charges min(1 * 15 * 7500, round_half_up(16090216 * 0.05)) == min(112500, 804511) == 112500"
            - "BREACHED is absorbing — no later recomputation in this recipe returns the order to AT_RISK or ON_TRACK"

      - name: dealer_standing_crosses_the_restrict_and_suspend_thresholds_by_count
        claim_type: threshold
        grounds:
          - calculations.dealer_recall_exposure
          - entities.Dealer.fields.certification_standing
          - entities.RemedyTask.fields.kits_reserved
          - state_machines.RecallCampaign.transitions[DRAFT->LAUNCHED].side_effects
        distinguishing_aspect: |
          One launch fixes three dealers at open_recall_unit_count 1, 2 and 4, landing exactly on both
          threshold boundaries at once: 1 -> GOOD, 2 -> RESTRICTED (>= 2 and < 4), 4 -> SUSPENDED (>= 4).
          The escalation cascade then follows standing rather than count, so only the six tasks of the two
          non-GOOD dealers reserve an extra kit: reserved_kits == 7 + 6 == 13 of 20. Completing one of the
          SUSPENDED dealer's tasks walks the boundary back down (4 -> 3 -> RESTRICTED) while the completed
          task's already-escalated sibling keeps FACTORY_DIRECTED, proving escalation is one-way.
        test_recipe:
          setup:
            - "TYPE_C_CONV + DSL-100 + TX 2026-2027 PUBLISHED profile"
            - "Three dealers D-TX-A (1 legacy DIESEL unit), D-TX-B (2) and D-TX-C (4), all delivered in May 2026 at the default clock 2026-08-01"
            - "DRAFT campaign RC-DSL-20 over TYPE_C_CONV/DIESEL, window 2026-01-01..2026-07-31, kits_per_unit 1, total_kits 20"
          setup_api_calls:
            - call: "POST /bus-models"
              payload: { model_code: "TYPE_C_CONV", body_class: "TYPE_C", base_seat_capacity: 71, base_emergency_exit_count: 5, base_price_cents: 12750000, body_joint_strength_kn: 58.0, max_battery_bays: 6, curb_weight_lb: 21500 }
