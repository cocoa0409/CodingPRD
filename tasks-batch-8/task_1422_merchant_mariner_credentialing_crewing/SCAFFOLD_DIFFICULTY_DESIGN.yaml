            - { call: "POST /mariners/${m_id}/drug-tests", payload: { test_type: "PRE_EMPLOYMENT", scheduled_date: "2026-01-02T00:00:00Z" }, as: CredentialingOfficer, captures: { dt_id: $.data.id } }
            - { call: "POST /mariners/${m_id}/drug-tests/${dt_id}/record-result", payload: { result: "NEGATIVE", collected_date: "2026-01-02T00:00:00Z" }, as: CredentialingOfficer }
            - { call: "POST /mariners/${m_id}/activate", payload: {}, as: FleetAdmin }
            - { call: "POST /training-courses", payload: { course_code: "TC3-CD", title: "Course D", provider: "MaritimeEd", start_date: "2026-09-01T00:00:00Z", end_date: "2026-09-03T00:00:00Z", seat_capacity: 5, cost_cents: 100000 }, as: FleetAdmin, captures: { cd_id: $.data.id } }
            - { call: "POST /training-courses", payload: { course_code: "TC3-CA", title: "Course A", provider: "MaritimeEd", start_date: "2026-09-10T00:00:00Z", end_date: "2026-09-12T00:00:00Z", seat_capacity: 5, cost_cents: 100000 }, as: FleetAdmin, captures: { ca_id: $.data.id } }
            - { call: "POST /training-courses", payload: { course_code: "TC3-CB", title: "Course B", provider: "MaritimeEd", start_date: "2026-10-01T00:00:00Z", end_date: "2026-10-03T00:00:00Z", seat_capacity: 5, cost_cents: 100000 }, as: FleetAdmin, captures: { cb_id: $.data.id } }
            - { call: "POST /training-courses", payload: { course_code: "TC3-CC", title: "Course C", provider: "MaritimeEd", start_date: "2026-10-10T00:00:00Z", end_date: "2026-10-12T00:00:00Z", seat_capacity: 5, cost_cents: 100000 }, as: FleetAdmin, captures: { cc_id: $.data.id } }
            - { call: "POST /training-courses/${cd_id}/enrollments", payload: {}, as: Mariner, as_user_id: "${m_id}", captures: { ed_id: $.data.id } }
            - { call: "POST /training-enrollments/${ed_id}/approve", payload: {}, as: CrewingManager, as_user_id: "cm-003" }
            - { call: "POST /training-enrollments/${ed_id}/enroll", payload: {}, as: FleetAdmin }
            - { call: "POST /training-enrollments/${ed_id}/record-completion", payload: { outcome: "NO_SHOW" }, as: FleetAdmin, captures: { ed_status: $.data.status } }
            - { call: "POST /training-courses/${ca_id}/enrollments", payload: {}, as: Mariner, as_user_id: "${m_id}", captures: { ea_id: $.data.id } }
            - { call: "POST /training-enrollments/${ea_id}/approve", payload: {}, as: CrewingManager, as_user_id: "cm-003" }
            - { call: "POST /training-enrollments/${ea_id}/enroll", payload: {}, as: FleetAdmin, captures: { ea_prov: $.data.provisional_amount_cents } }
            - { call: "POST /training-courses/${cb_id}/enrollments", payload: {}, as: Mariner, as_user_id: "${m_id}", captures: { eb_id: $.data.id } }
            - { call: "POST /training-courses/${cc_id}/enrollments", payload: {}, as: Mariner, as_user_id: "${m_id}", captures: { ec_id: $.data.id } }
            - { call: "POST /training-enrollments/${ec_id}/approve", payload: {}, as: CrewingManager, as_user_id: "cm-003" }
          trigger:
            - { call: "POST /training-enrollments/${ea_id}/record-completion", payload: { outcome: "NO_SHOW" }, as: FleetAdmin, captures: { ea_status: $.data.status } }
            - { call: "GET /mariners/${m_id}", as: FleetAdmin, captures: { m_strikes: $.data.no_show_strike_count, m_priv: $.data.training_privileges } }
            - { call: "GET /training-enrollments/${eb_id}", as: FleetAdmin, captures: { eb_status: $.data.status } }
            - { call: "GET /training-enrollments/${ec_id}", as: FleetAdmin, captures: { ec_status: $.data.status } }
            - { call: "GET /mariners/${m_id}/training-budgets", as: FleetAdmin, captures: { b_res: "$.data[0].reserved_cents", b_used: "$.data[0].used_cents" } }
            - { call: "GET /training-courses/${ca_id}", as: FleetAdmin, captures: { ca_reserved: $.data.seats_reserved } }
          assert:
            - "ed_status == NO_SHOW (first strike applied earlier)"
            - "ea_prov == 80000 (min(100000, 200000) x 0.80 DIRECT)"
            - "ea_status == NO_SHOW (hop 1) and its 80000 reservation released"
            - "m_strikes == 2 and m_priv == SUSPENDED (hop 2: strike threshold at >= 2)"
            - "eb_status == REJECTED and ec_status == CANCELLED (hop 3: privilege suspension cascades to OTHER open enrollments)"
            - "b_res == 0 and b_used == 0 (both NO_SHOW reservations fully released; nothing ever reimbursed)"
            - "ca_reserved == 1 (NO_SHOW consumes the seat even though the budget reservation is released)"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: confirm_state_error_beats_safety_error
        grounds:
          - validations[priority=9]
          - validations[priority=10]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_MARINER_NOT_CLEAR]
        distinguishing_aspect: |
          Category pair state-vs-business_safety: the assignment is CANCELLED (state gate
          broken) AND the mariner is BLOCKED (safety gate broken). Priority 9 (state) fires
          before priority 10 (safety), so the observable error is ERR_INVALID_STATE, never
          ERR_MARINER_NOT_CLEAR, for this dual-failure request.
        test_recipe:
          setup:
            - "M activated; vessel/slot/plan; A PROPOSED then CANCELLED; then M suspended (posture BLOCKED)"
          setup_api_calls:
            - { call: "POST /mariners", payload: { full_name: "Priority One", mariner_reference_number: "MRN-PP1-1", home_port_code: "SFO", hire_channel: "DIRECT", rank_track: "DECK", rank_grade: 5, primary_endorsement_code: "DECK_AB" }, as: FleetAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /mariners/${m_id}/medical-certificates", payload: { cert_type: "USCG_MEDICAL", issue_date: "2026-01-01T00:00:00Z", expiry_date: "2027-06-01T00:00:00Z" }, as: CredentialingOfficer }
            - { call: "POST /mariners/${m_id}/credentials", payload: { credential_type: "MMC_BASE", endorsement_code: "DECK_AB", issue_date: "2026-01-01T00:00:00Z", expiry_date: "2030-01-01T00:00:00Z" }, as: CredentialingOfficer }
            - { call: "POST /mariners/${m_id}/drug-tests", payload: { test_type: "PRE_EMPLOYMENT", scheduled_date: "2026-01-02T00:00:00Z" }, as: CredentialingOfficer, captures: { dt_id: $.data.id } }
            - { call: "POST /mariners/${m_id}/drug-tests/${dt_id}/record-result", payload: { result: "NEGATIVE", collected_date: "2026-01-02T00:00:00Z" }, as: CredentialingOfficer }
            - { call: "POST /mariners/${m_id}/activate", payload: {}, as: FleetAdmin }
            - { call: "POST /vessels", payload: { vessel_name: "SS Priority", imo_number: "IMO-PP1", vessel_class: "CONTAINER", flag_state: "US" }, as: FleetAdmin, captures: { v_id: $.data.id } }
            - { call: "POST /vessels/${v_id}/manning-slots", payload: { position_code: "AB", rank_track: "DECK", min_rank_grade: 2, required_endorsement_code: "DECK_AB", is_critical_position: false, standard_tour_days: 90 }, as: PortCaptain, captures: { s_id: $.data.id } }
            - { call: "POST /vessels/${v_id}/activate", payload: {}, as: FleetAdmin, captures: { v_ver: $.data.version } }
            - { call: "POST /vessels/${v_id}/rotation-plans", payload: { effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-08-01T00:00:00Z", standard_tour_days: 90, max_handover_overlap_days: 3, expected_vessel_version: "${v_ver}" }, as: CrewingManager }
            - { call: "POST /assignments", payload: { mariner_id: "${m_id}", manning_slot_id: "${s_id}", assignment_channel: "DIRECT_HIRE", sign_on_date: "2026-08-10T00:00:00Z", planned_relief_date: "2026-11-10T00:00:00Z", local_join: true }, as: CrewingManager, captures: { a_id: $.data.id } }
            - { call: "POST /assignments/${a_id}/cancel", payload: {}, as: CrewingManager }
            - { call: "POST /mariners/${m_id}/suspend", payload: {}, as: FleetAdmin, captures: { m_posture: $.data.readiness_posture } }
          trigger:
            - { call: "POST /assignments/${a_id}/confirm", payload: {}, as: CrewingManager, captures: { err: $.data.error_id } }
          assert:
            - "m_posture == BLOCKED (safety gate would also fail)"
            - "err == ERR_INVALID_STATE (priority 9 state beats priority 10 business_safety on a CANCELLED assignment)"
      - name: enroll_safety_error_beats_fiscal_error
        grounds:
          - validations[priority=10]
          - validations[priority=15]
          - errors[ERR_MARINER_NOT_CLEAR]
          - errors[ERR_TRAINING_BUDGET_EXCEEDED]
        distinguishing_aspect: |
          Category pair business_safety-vs-business_fiscal (different pair than the state/safety
          instance): at enroll time the mariner is BLOCKED (safety) AND the budget is too small
          (fiscal: available 1000 < provisional 160000). Priority 10 fires before priority 15,
          so ERR_MARINER_NOT_CLEAR is returned, not ERR_TRAINING_BUDGET_EXCEEDED.
        test_recipe:
          setup:
            - "M activated with annual_training_cap_cents 1000; course cost 250000"
            - "Enrollment REQUESTED -> APPROVED while CLEAR; then M suspended -> BLOCKED (budget never consulted yet)"
          setup_api_calls:
            - { call: "POST /mariners", payload: { full_name: "Priority Two", mariner_reference_number: "MRN-PP2-1", home_port_code: "SFO", hire_channel: "DIRECT", rank_track: "DECK", rank_grade: 5, primary_endorsement_code: "DECK_AB", annual_training_cap_cents: 1000 }, as: FleetAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /mariners/${m_id}/medical-certificates", payload: { cert_type: "USCG_MEDICAL", issue_date: "2026-01-01T00:00:00Z", expiry_date: "2027-06-01T00:00:00Z" }, as: CredentialingOfficer }
            - { call: "POST /mariners/${m_id}/credentials", payload: { credential_type: "MMC_BASE", endorsement_code: "DECK_AB", issue_date: "2026-01-01T00:00:00Z", expiry_date: "2030-01-01T00:00:00Z" }, as: CredentialingOfficer }
            - { call: "POST /mariners/${m_id}/drug-tests", payload: { test_type: "PRE_EMPLOYMENT", scheduled_date: "2026-01-02T00:00:00Z" }, as: CredentialingOfficer, captures: { dt_id: $.data.id } }
            - { call: "POST /mariners/${m_id}/drug-tests/${dt_id}/record-result", payload: { result: "NEGATIVE", collected_date: "2026-01-02T00:00:00Z" }, as: CredentialingOfficer }
            - { call: "POST /mariners/${m_id}/activate", payload: {}, as: FleetAdmin }
            - { call: "POST /training-courses", payload: { course_code: "PP2-C1", title: "Expensive Course", provider: "MaritimeEd", start_date: "2026-09-01T00:00:00Z", end_date: "2026-09-05T00:00:00Z", seat_capacity: 5, cost_cents: 250000 }, as: FleetAdmin, captures: { course_id: $.data.id } }
            - { call: "POST /training-courses/${course_id}/enrollments", payload: {}, as: Mariner, as_user_id: "${m_id}", captures: { e_id: $.data.id } }
            - { call: "POST /training-enrollments/${e_id}/approve", payload: {}, as: CrewingManager, as_user_id: "cm-010" }
            - { call: "POST /mariners/${m_id}/suspend", payload: {}, as: FleetAdmin }
          trigger:
            - { call: "POST /training-enrollments/${e_id}/enroll", payload: {}, as: FleetAdmin, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_MARINER_NOT_CLEAR (priority 10 business_safety beats priority 15 business_fiscal even though 160000 provisional > 1000 available)"
      - name: reimburse_sod_error_beats_state_error
        grounds:
          - validations[priority=8]
          - validations[priority=9]
          - errors[ERR_SOD_REIMBURSE_SAME_APPROVER]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          Category pair auth(SoD)-vs-state (a third distinct pair): the reimburser IS the
          approver (same X-User-ID, SoD violation at priority 8) AND the enrollment is APPROVED
          not COMPLETED (state violation at priority 9). SoD fires first:
          ERR_SOD_REIMBURSE_SAME_APPROVER, not ERR_INVALID_STATE.
        test_recipe:
          setup:
            - "M activated; course; enrollment REQUESTED -> APPROVED by X-User-ID cm-777"
          setup_api_calls:
            - { call: "POST /mariners", payload: { full_name: "Priority Three", mariner_reference_number: "MRN-PP3-1", home_port_code: "SFO", hire_channel: "DIRECT", rank_track: "DECK", rank_grade: 5, primary_endorsement_code: "DECK_AB" }, as: FleetAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /mariners/${m_id}/medical-certificates", payload: { cert_type: "USCG_MEDICAL", issue_date: "2026-01-01T00:00:00Z", expiry_date: "2027-06-01T00:00:00Z" }, as: CredentialingOfficer }
            - { call: "POST /mariners/${m_id}/credentials", payload: { credential_type: "MMC_BASE", endorsement_code: "DECK_AB", issue_date: "2026-01-01T00:00:00Z", expiry_date: "2030-01-01T00:00:00Z" }, as: CredentialingOfficer }
            - { call: "POST /mariners/${m_id}/drug-tests", payload: { test_type: "PRE_EMPLOYMENT", scheduled_date: "2026-01-02T00:00:00Z" }, as: CredentialingOfficer, captures: { dt_id: $.data.id } }
            - { call: "POST /mariners/${m_id}/drug-tests/${dt_id}/record-result", payload: { result: "NEGATIVE", collected_date: "2026-01-02T00:00:00Z" }, as: CredentialingOfficer }
            - { call: "POST /mariners/${m_id}/activate", payload: {}, as: FleetAdmin }
            - { call: "POST /training-courses", payload: { course_code: "PP3-C1", title: "SoD Course", provider: "MaritimeEd", start_date: "2026-09-01T00:00:00Z", end_date: "2026-09-05T00:00:00Z", seat_capacity: 5, cost_cents: 100000 }, as: FleetAdmin, captures: { course_id: $.data.id } }
            - { call: "POST /training-courses/${course_id}/enrollments", payload: {}, as: Mariner, as_user_id: "${m_id}", captures: { e_id: $.data.id } }
            - { call: "POST /training-enrollments/${e_id}/approve", payload: {}, as: CrewingManager, as_user_id: "cm-777" }
          trigger:
            - { call: "POST /training-enrollments/${e_id}/reimburse", payload: { receipt_amount_cents: 50000 }, as: FleetAdmin, as_user_id: "cm-777", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_SOD_REIMBURSE_SAME_APPROVER (priority 8 SoD beats priority 9 state; enrollment is APPROVED, not COMPLETED)"

  - rule_id: boundary_precision_check
    instances:
      - name: upgrade_eligibility_exactly_360_days_qualifies
        grounds:
          - calculations.upgrade_eligibility
          - errors[ERR_UPGRADE_REQUIREMENTS_NOT_MET]
        distinguishing_aspect: |
          Boundary on the verified-days metric (>= semantics) reached through POST
          /mariners/{id}/credentials: 360.0 qualifying days exactly meets days_required 360
          (eligible), 359.0 fails with shortfall 1.0. Course requirement held equal (both
          mariners completed the CHIEF_MATE course) so days are the sole discriminator.
        test_recipe:
          setup:
            - "Mariner MA: 360-day OCEAN EIGHT_HOUR record (2024-01-01..2024-12-25 inclusive, leap year) VERIFIED; CHIEF_MATE-granting course COMPLETED"
            - "Mariner MB: identical but 2024-01-01..2024-12-24 (359 days)"
            - "Clock at default 2026-08-01; lookback window starts 2023-08-01 (both records inside)"
          setup_api_calls:
            - { call: "POST /mariners", payload: { full_name: "Boundary A", mariner_reference_number: "MRN-BP1-A", home_port_code: "SFO", hire_channel: "DIRECT", rank_track: "DECK", rank_grade: 5, primary_endorsement_code: "DECK_AB" }, as: FleetAdmin, captures: { ma_id: $.data.id } }
            - { call: "POST /mariners/${ma_id}/medical-certificates", payload: { cert_type: "USCG_MEDICAL", issue_date: "2026-01-01T00:00:00Z", expiry_date: "2027-06-01T00:00:00Z" }, as: CredentialingOfficer }
            - { call: "POST /mariners/${ma_id}/credentials", payload: { credential_type: "MMC_BASE", endorsement_code: "DECK_AB", issue_date: "2026-01-01T00:00:00Z", expiry_date: "2030-01-01T00:00:00Z" }, as: CredentialingOfficer }
            - { call: "POST /mariners/${ma_id}/drug-tests", payload: { test_type: "PRE_EMPLOYMENT", scheduled_date: "2026-01-02T00:00:00Z" }, as: CredentialingOfficer, captures: { dta_id: $.data.id } }
            - { call: "POST /mariners/${ma_id}/drug-tests/${dta_id}/record-result", payload: { result: "NEGATIVE", collected_date: "2026-01-02T00:00:00Z" }, as: CredentialingOfficer }
            - { call: "POST /mariners/${ma_id}/activate", payload: {}, as: FleetAdmin }
            - { call: "POST /vessels", payload: { vessel_name: "SS Boundary", imo_number: "IMO-BP1", vessel_class: "CONTAINER", flag_state: "US" }, as: FleetAdmin, captures: { v_id: $.data.id } }
            - { call: "POST /mariners/${ma_id}/sea-service-records", payload: { vessel_id: "${v_id}", position_code: "OICNW", rank_track: "DECK", rank_grade: 5, service_region: "OCEAN", watch_schedule: "EIGHT_HOUR", start_date: "2024-01-01T00:00:00Z", end_date: "2024-12-25T00:00:00Z" }, as: Mariner, as_user_id: "${ma_id}", captures: { ra_id: $.data.id } }
