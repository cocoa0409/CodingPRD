            - call: "POST /merchants/${merch_id}/cost-documentations"
              payload: { base_mdr_pct: 1.85, assessment_pct: 0.14, per_item_fee_cents: 10, evidence_uri: "s3://acq/az/2026-07.pdf", expected_merchant_version: "${merch_v0}" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { doc_a_id: $.data.id }
            - call: "POST /surcharge-programs"
              payload: { merchant_id: "${merch_id}", jurisdiction_id: "${jur_az_id}", cost_documentation_id: "${doc_a_id}", program_type: "SURCHARGE", consistency_scope: "BRAND_LEVEL" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { prog_id: $.data.id, prog_v0: $.data.version }
            - call: "POST /surcharge-programs/${prog_id}/rate-rules"
              payload: { brand: "VISA", product_tier: "ALL", rate_pct: 2.19, effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-12-31T00:00:00Z", expected_program_version: "${prog_v0}" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /surcharge-programs/${prog_id}/network-registrations"
              payload: { network: "VISA", registration_ref: "VS-2940-AZ-021" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { reg_id: $.data.id }
            - call: "POST /network-registrations/${reg_id}/decision"
