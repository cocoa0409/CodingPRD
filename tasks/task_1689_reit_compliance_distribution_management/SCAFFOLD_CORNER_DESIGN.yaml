              captures: { reit_id: $.data.id }
            - call: "POST /reit-compliance/asset-holdings"
              payload: { reit_id: "${reit_id}", asset_name: "Spec House", asset_class: "REAL_ESTATE", held_by_trs: false, is_dealer_inventory: true, acquisition_date: "2024-06-15", value_cents: 1000000 }
              as: ComplianceOfficer
              captures: { a_id: $.data.id }
            - call: "POST /reit-compliance/asset-sales"
              payload: { reit_id: "${reit_id}", asset_holding_id: "${a_id}", sale_price_cents: 1500000, basis_cents: 1000000, sale_date: "2026-06-09" }
              as: ComplianceOfficer
              captures: { s_id: $.data.id }
          trigger:
            - call: "POST /reit-compliance/asset-sales/${s_id}/analyze"
              payload: {}
              as: ComplianceOfficer
              captures: { months: $.data.holding_period_months, prohib: $.data.is_prohibited, tax: $.data.prohibited_tax_cents }
          assert:
            - "holding_period_months == 24 (floor(720/30))"
            - "is_prohibited == false and prohibited_tax_cents == 0"

      - name: negative_ep_clamps_ordinary_bucket_to_zero
        claim_type: correct_result
        grounds: [calculations.calc_ep_balance, calculations.calc_dividend_characterization]
        distinguishing_aspect: "E&P may go negative; with current_ep_balance_cents == -100000 and cg_pool == 0, a 50000 dividend characterizes as ordinary 0 / capital gain 0 / return_of_capital 50000."
        test_recipe:
          setup: ["Reit R1 ACTIVE; POSTED FEDERAL_TAX 100000 with no income (E&P -100000); requirement POSTED ti 0 ncg 0 (required 0)"]
          setup_api_calls:
            - call: "POST /reit-compliance/reits"
              payload: { legal_name: "C7 REIT", ticker: "C7RE", charter_ownership_limit_pct: 9.8, taxable_year_start: "2026-01-01" }
