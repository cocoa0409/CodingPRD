# =====================================================================================
# §1.9 Scaffold Corner Design (Breadth Probe)
# Task 2721 — Deposit Insurance Determination & Failed Institution Resolution
#
# Taxonomy: the nine sections of references/claim-extraction-guide.md.
# Corners already asserted by SCAFFOLD_DIFFICULTY_DESIGN.yaml are emitted as
# `excluded_because:` stubs naming the covering §1.8 instance.
# Every numeric literal below was produced by executing the §1.3 formulas as code.
# =====================================================================================
scaffold_corner_design:

  # ===================================================================================
  - section: entities
    instances:
      - name: institution_created_with_all_required_fields_returns_201
        claim_type: creation
        grounds:
          - entities.Institution
          - endpoints[POST /institutions]
        distinguishing_aspect: "POST /institutions with all five required inputs returns 201 and echoes every declared field, with status PRE_FAILURE_MONITORING and all aggregates at their declared defaults."
        test_recipe:
          setup:
            - "Empty database; the logical clock has been pinned to 2026-08-03T09:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: ClosingManager
          trigger:
            - call: "POST /institutions"
              payload: { cert_number: "60001", legal_name: "Kootenai Pioneer Bank", charter_state: "ID", book_asset_value_cents: 40000000, estimated_liquidation_recovery_cents: 30000000 }
              as: ClosingManager
              captures: { c_inst_id: $.data.id }
          assert:
            - "HTTP 201; response_type == 'object'; meta.api_request_id and meta.api_request_timestamp are present"
            - "data.cert_number == '60001', data.legal_name == 'Kootenai Pioneer Bank', data.charter_state == 'ID', data.book_asset_value_cents == 40000000, data.estimated_liquidation_recovery_cents == 30000000"
            - "data.status == 'PRE_FAILURE_MONITORING', data.franchise_marketing_status == 'NOT_STARTED', data.least_cost_status == 'NOT_STARTED'"
            - "data.readiness_standardized == false, data.total_deposit_balance_cents == 0, data.depositor_record_count == 0, data.aggregate_insured_cents == 0, data.aggregate_certificate_face_cents == 0, data.uninsured_claim_count == 0, data.receivership_cash_cents == 0"
            - "data.failure_datetime == null, data.bid_deadline_at == null, data.least_cost_test_variant == null, data.liquidation_baseline_cents == null, data.resolution_method == null"
            - "data.id, data.created_at, data.updated_at are present and data.version == 1"

      - name: institution_get_by_id_returns_stored_values
        claim_type: retrieval
        grounds:
          - endpoints[GET /institutions/{id}]
          - entities.Institution
        distinguishing_aspect: "GET /institutions/{id} returns exactly the values written by the create call, with no mutation of version."
        test_recipe:
          setup:
            - "One Institution 60002 exists at status PRE_FAILURE_MONITORING with version 1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: ClosingManager
            - call: "POST /institutions"
              payload: { cert_number: "60002", legal_name: "Bannock Savings", charter_state: "ID", book_asset_value_cents: 12000000, estimated_liquidation_recovery_cents: 9000000 }
              as: ClosingManager
              captures: { r_inst_id: $.data.id }
          trigger:
            - call: "GET /institutions/${r_inst_id}"
              as: ReceivershipTrustee
          assert:
            - "HTTP 200 with data.id == ${r_inst_id}, data.cert_number == '60002', data.book_asset_value_cents == 12000000"
            - "data.version == 1 — a read does not bump the version"
            - "data.status == 'PRE_FAILURE_MONITORING'"

      - name: institution_list_pagination_reports_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints[GET /institutions]
          - response_envelope.pagination_fields
        distinguishing_aspect: "With three institutions stored, limit=2/offset=0 returns 2 rows with total_count 3 and has_more true, and offset=2 returns 1 row with has_more false."
        test_recipe:
          setup:
            - "Three Institutions exist: 60003 (WA), 60004 (WA), 60005 (OR)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: ClosingManager
            - call: "POST /institutions"
              payload: { cert_number: "60003", legal_name: "Alpha Bank", charter_state: "WA", book_asset_value_cents: 1000000, estimated_liquidation_recovery_cents: 500000 }
              as: ClosingManager
            - call: "POST /institutions"
              payload: { cert_number: "60004", legal_name: "Beta Bank", charter_state: "WA", book_asset_value_cents: 2000000, estimated_liquidation_recovery_cents: 900000 }
              as: ClosingManager
            - call: "POST /institutions"
              payload: { cert_number: "60005", legal_name: "Gamma Bank", charter_state: "OR", book_asset_value_cents: 3000000, estimated_liquidation_recovery_cents: 1200000 }
              as: ClosingManager
          trigger:
            - call: "GET /institutions"
              payload: { limit: 2, offset: 0 }
              as: ClosingManager
            - call: "GET /institutions"
              payload: { limit: 2, offset: 2 }
              as: ClosingManager
            - call: "GET /institutions"
              payload: { charter_state: "WA" }
              as: ClosingManager
          assert:
            - "trigger[0]: response_type == 'array', exactly 2 rows returned, total_count == 3, has_more == true, limit == 2, offset == 0"
            - "trigger[1]: exactly 1 row returned, total_count == 3, has_more == false, offset == 2"
            - "trigger[2]: exactly 2 rows returned with charter_state == 'WA', total_count == 2, has_more == false, and the default limit of 10 is applied"

      - name: deposit_account_get_with_unknown_id_returns_not_found
        claim_type: not_found
        grounds:
          - validations[priority=13]
          - errors[ERR_ACCOUNT_NOT_FOUND]
        distinguishing_aspect: "A syntactically valid but unknown UUID on GET /deposit-accounts/{id} yields ERR_ACCOUNT_NOT_FOUND with HTTP 404, not an empty 200."
        test_recipe:
          setup:
            - "Empty database apart from the pinned clock; no DepositAccount rows exist."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: ClosingManager
          trigger:
            - call: "GET /deposit-accounts/00000000-0000-0000-0000-0000000000ff"
              as: ClaimsAgent
              captures: { nf_error_id: "$.data.error_id", nf_message: "$.data.message" }
          assert:
            - "HTTP 404 with response_type == 'error' and data.error_id == 'ERR_ACCOUNT_NOT_FOUND'"
            - "data.message is a non-empty string"

      - name: institution_create_missing_required_charter_state_returns_invalid_request
        claim_type: required_fields
        grounds:
          - validations[priority=22]
          - errors[ERR_INVALID_REQUEST]
          - entities.Institution.fields.charter_state
        distinguishing_aspect: "charter_state has source input with no default, so omitting it returns ERR_INVALID_REQUEST (400) and creates no row."
        test_recipe:
          setup:
            - "Empty database apart from the pinned clock."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: ClosingManager
          trigger:
            - call: "POST /institutions"
              payload: { cert_number: "60006", legal_name: "Missing Field Bank", book_asset_value_cents: 1000000, estimated_liquidation_recovery_cents: 500000 }
              as: ClosingManager
              captures: { mf_error_id: "$.data.error_id" }
            - call: "GET /institutions"
              as: ClosingManager
          assert:
            - "trigger[0] returns HTTP 400 with data.error_id == 'ERR_INVALID_REQUEST'"
            - "trigger[1] returns total_count == 0 — the rejected create persisted nothing"

      - name: deposit_account_omitted_optional_fields_take_declared_defaults
        claim_type: defaults
        grounds:
          - entities.DepositAccount.fields.accrued_interest_cents
          - entities.DepositAccount.fields.broker_name
          - entities.DepositAccount.fields.recordkeeping_status
        distinguishing_aspect: "Omitting accrued_interest_cents, broker_name and recordkeeping_status on a SINGLE account yields 0, null and null respectively — never a 400 and never a non-zero interest figure."
        test_recipe:
          setup:
            - "Institution 60007 exists with depositor Priya."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: ClosingManager
            - call: "POST /institutions"
              payload: { cert_number: "60007", legal_name: "Defaults Bank", charter_state: "WA", book_asset_value_cents: 1000000, estimated_liquidation_recovery_cents: 500000 }
              as: ClosingManager
              captures: { df_inst_id: $.data.id }
            - call: "POST /institutions/${df_inst_id}/depositor-records"
              payload: { tin_hash: "TIN-PRIYA-60007", legal_name: "Priya Menon", depositor_type: "NATURAL_PERSON", contact_email: "priya@example.com" }
              as: ClaimsAgent
              captures: { df_dep_id: $.data.id }
          trigger:
            - call: "POST /deposit-accounts"
              payload: { institution_id: "${df_inst_id}", primary_depositor_id: "${df_dep_id}", account_number: "P-0001", ownership_category: "SINGLE", balance_cents: 500000, opened_at: "2024-01-15T00:00:00Z" }
              as: ClaimsAgent
              captures: { df_acct_id: $.data.id }
          assert:
            - "HTTP 201 with data.accrued_interest_cents == 0, data.broker_name == null, data.recordkeeping_status == null"
            - "data.insurance_status == 'PENDING', data.hold_status == 'NONE', data.transition_status == 'PENDING'"
            - "data.held_amount_cents == 0 and data.attributed_amount_cents == 0"

      - name: institution_aggregate_fields_ignored_input_on_create
        claim_type: computed_fields
        grounds:
          - entities.Institution.fields.total_deposit_balance_cents
          - entities.Institution.fields.aggregate_insured_cents
          - calculations.institution_aggregate_reconciliation
        distinguishing_aspect: "total_deposit_balance_cents and aggregate_insured_cents are source computed, so client-supplied values in the create body are ignored and both read 0 — the reconciliation recompute is the only writer."
        test_recipe:
          setup:
            - "Empty database apart from the pinned clock."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: ClosingManager
          trigger:
            - call: "POST /institutions"
              payload: { cert_number: "60008", legal_name: "Computed Bank", charter_state: "WA", book_asset_value_cents: 1000000, estimated_liquidation_recovery_cents: 500000, total_deposit_balance_cents: 999999, aggregate_insured_cents: 888888 }
              as: ClosingManager
              captures: { cf_inst_id: $.data.id }
            - call: "GET /institutions/${cf_inst_id}"
              as: ClosingManager
          assert:
            - "trigger[1] response data.total_deposit_balance_cents == 0 and data.aggregate_insured_cents == 0 — the supplied 999999 / 888888 were ignored"
            - "trigger[1] response data.book_asset_value_cents == 1000000 — declared inputs are still honoured"

      - name: depositor_record_notice_fields_ignored_input_on_create
        claim_type: system_fields
        grounds:
          - entities.DepositorRecord.fields.notice_status
          - entities.DepositorRecord.fields.notice_sent_at
        distinguishing_aspect: "notice_status and notice_sent_at are source system, so a client attempting to create a depositor already at notice_status ACKNOWLEDGED gets PENDING / null instead."
        test_recipe:
          setup:
            - "Institution 60009 exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: ClosingManager
            - call: "POST /institutions"
              payload: { cert_number: "60009", legal_name: "System Fields Bank", charter_state: "WA", book_asset_value_cents: 1000000, estimated_liquidation_recovery_cents: 500000 }
              as: ClosingManager
              captures: { sf_inst_id: $.data.id }
          trigger:
            - call: "POST /institutions/${sf_inst_id}/depositor-records"
              payload: { tin_hash: "TIN-SF-60009", legal_name: "Quinn Alvarez", depositor_type: "BUSINESS", contact_email: "quinn@example.com", notice_status: "ACKNOWLEDGED", notice_sent_at: "2020-01-01T00:00:00Z" }
              as: ClaimsAgent
              captures: { sf_dep_id: $.data.id }
          assert:
            - "data.notice_status == 'PENDING' and data.notice_sent_at == null and data.acknowledged_at == null"
            - "data.notice_template_code == null, data.certified_insured_cents == 0, data.certified_uninsured_cents == 0, data.attributed_total_cents == 0"
            - "data.id is server-minted, data.created_at and data.updated_at are server-stamped, data.version == 1"

      - name: deposit_account_invalid_ownership_category_enum_returns_invalid_request
        claim_type: type_constraints
        grounds:
          - entities.DepositAccount.fields.ownership_category
          - validations[priority=22]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "ownership_category accepts only the six declared members, so 'CHECKING' returns ERR_INVALID_REQUEST (400); likewise a negative balance_cents is rejected."
        test_recipe:
          setup:
            - "Institution 60010 exists with depositor Rafi."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: ClosingManager
            - call: "POST /institutions"
              payload: { cert_number: "60010", legal_name: "Enum Bank", charter_state: "WA", book_asset_value_cents: 1000000, estimated_liquidation_recovery_cents: 500000 }
              as: ClosingManager
              captures: { en_inst_id: $.data.id }
            - call: "POST /institutions/${en_inst_id}/depositor-records"
              payload: { tin_hash: "TIN-RAFI-60010", legal_name: "Rafi Haddad", depositor_type: "NATURAL_PERSON", contact_email: "rafi@example.com" }
              as: ClaimsAgent
              captures: { en_dep_id: $.data.id }
          trigger:
            - call: "POST /deposit-accounts"
              payload: { institution_id: "${en_inst_id}", primary_depositor_id: "${en_dep_id}", account_number: "R-0001", ownership_category: "CHECKING", balance_cents: 100000, opened_at: "2024-01-15T00:00:00Z" }
              as: ClaimsAgent
              captures: { en_error_id: "$.data.error_id" }
            - call: "POST /deposit-accounts"
              payload: { institution_id: "${en_inst_id}", primary_depositor_id: "${en_dep_id}", account_number: "R-0002", ownership_category: "SINGLE", balance_cents: -1, opened_at: "2024-01-15T00:00:00Z" }
              as: ClaimsAgent
              captures: { en_error_id2: "$.data.error_id" }
          assert:
            - "trigger[0] returns HTTP 400 with data.error_id == 'ERR_INVALID_REQUEST' (undeclared enum member)"
            - "trigger[1] returns HTTP 400 with data.error_id == 'ERR_INVALID_REQUEST' (balance_cents must be >= 0)"
            - "GET /deposit-accounts with institution_id == ${en_inst_id} returns total_count == 0"

      - name: ownership_interest_immutable_carries_no_version_field
        claim_type: immutability
        grounds:
          - entities.OwnershipInterest
          - endpoints[POST /deposit-accounts/{id}/ownership-interests]
          - endpoints[GET /deposit-accounts/{id}/ownership-interests]
        distinguishing_aspect: "OwnershipInterest declares common_fields false: its create response and its list rows expose no version field, and §1.5 declares no PUT/PATCH/DELETE endpoint for it, so a designated_share_bps correction can only be made by adding a further row."
        test_recipe:
          setup:
            - "Institution 60011 has depositors Sara and Tomas and one JOINT account J-0001 of 40000000 cents."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: ClosingManager
            - call: "POST /institutions"
              payload: { cert_number: "60011", legal_name: "Immutable Bank", charter_state: "WA", book_asset_value_cents: 40000000, estimated_liquidation_recovery_cents: 20000000 }
              as: ClosingManager
              captures: { im_inst_id: $.data.id }
            - call: "POST /institutions/${im_inst_id}/depositor-records"
              payload: { tin_hash: "TIN-SARA-60011", legal_name: "Sara Bianchi", depositor_type: "NATURAL_PERSON", contact_email: "sara@example.com" }
              as: ClaimsAgent
              captures: { im_sara_id: $.data.id }
            - call: "POST /institutions/${im_inst_id}/depositor-records"
              payload: { tin_hash: "TIN-TOMAS-60011", legal_name: "Tomas Bianchi", depositor_type: "NATURAL_PERSON", contact_email: "tomas@example.com" }
              as: ClaimsAgent
              captures: { im_tomas_id: $.data.id }
            - call: "POST /deposit-accounts"
              payload: { institution_id: "${im_inst_id}", primary_depositor_id: "${im_sara_id}", account_number: "J-0001", ownership_category: "JOINT", balance_cents: 40000000, accrued_interest_cents: 0, opened_at: "2024-02-01T00:00:00Z" }
              as: ClaimsAgent
              captures: { im_acct_id: $.data.id }
          trigger:
            - call: "POST /deposit-accounts/${im_acct_id}/ownership-interests"
              payload: { depositor_record_id: "${im_sara_id}", interest_role: "CO_OWNER", designated_share_bps: 5000 }
              as: ClaimsAgent
              captures: { im_oi_id: $.data.id }
            - call: "GET /deposit-accounts/${im_acct_id}/ownership-interests"
              payload: { interest_role: "CO_OWNER" }
              as: ClaimsAgent
          assert:
            - "trigger[0] returns HTTP 201 with data.deposit_account_id == ${im_acct_id}, data.depositor_record_id == ${im_sara_id}, data.interest_role == 'CO_OWNER', data.designated_share_bps == 5000"
            - "trigger[0] response contains NO version key — OwnershipInterest declares common_fields false"
            - "trigger[1] returns total_count == 1 and the row is byte-identical to the created one"
            - "§1.5 declares no PUT, PATCH or DELETE endpoint on any /ownership-interests path, so the row cannot be edited or removed"

      - name: depositor_record_create_under_unknown_institution_returns_not_found
        claim_type: parent_relationships
        grounds:
          - validations[priority=10]
          - errors[ERR_INSTITUTION_NOT_FOUND]
          - endpoints[POST /institutions/{id}/depositor-records]
        distinguishing_aspect: "The nested create resolves its {id} parent segment first: an unknown institution id yields ERR_INSTITUTION_NOT_FOUND (404), not ERR_INVALID_REQUEST and not an orphan depositor."
        test_recipe:
          setup:
            - "Empty database apart from the pinned clock; no Institution rows exist."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: ClosingManager
          trigger:
            - call: "POST /institutions/00000000-0000-0000-0000-0000000000aa/depositor-records"
              payload: { tin_hash: "TIN-ORPHAN", legal_name: "Orphan Depositor", depositor_type: "NATURAL_PERSON", contact_email: "orphan@example.com" }
              as: ClaimsAgent
              captures: { pr_error_id: "$.data.error_id" }
            - call: "GET /depositor-records"
              as: ClaimsAgent
          assert:
            - "trigger[0] returns HTTP 404 with data.error_id == 'ERR_INSTITUTION_NOT_FOUND'"
            - "trigger[1] returns total_count == 0"

      - name: deposit_account_cross_institution_depositor_reference_rejected
        claim_type: foreign_key_integrity
        grounds:
          - validations[priority=34]
          - errors[ERR_DEPOSITOR_INSTITUTION_MISMATCH]
          - complexity_profile.entity_topology
        distinguishing_aspect: "Entity topology is flat, so cross-reference integrity is enforced in the body, not the URL: an account whose institution_id and primary_depositor_id belong to two different institutions returns ERR_DEPOSITOR_INSTITUTION_MISMATCH (422) even though both ids exist."
        test_recipe:
          setup:
            - "Two Institutions 60012 and 60013 exist; depositor Umi belongs to 60012."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: ClosingManager
            - call: "POST /institutions"
              payload: { cert_number: "60012", legal_name: "Home Institution Bank", charter_state: "WA", book_asset_value_cents: 1000000, estimated_liquidation_recovery_cents: 500000 }
              as: ClosingManager
              captures: { fk_inst1_id: $.data.id }
            - call: "POST /institutions"
              payload: { cert_number: "60013", legal_name: "Other Institution Bank", charter_state: "WA", book_asset_value_cents: 1000000, estimated_liquidation_recovery_cents: 500000 }
              as: ClosingManager
              captures: { fk_inst2_id: $.data.id }
            - call: "POST /institutions/${fk_inst1_id}/depositor-records"
              payload: { tin_hash: "TIN-UMI-60012", legal_name: "Umi Tanaka", depositor_type: "NATURAL_PERSON", contact_email: "umi@example.com" }
              as: ClaimsAgent
              captures: { fk_dep_id: $.data.id }
          trigger:
            - call: "POST /deposit-accounts"
              payload: { institution_id: "${fk_inst2_id}", primary_depositor_id: "${fk_dep_id}", account_number: "U-0001", ownership_category: "SINGLE", balance_cents: 100000, opened_at: "2024-01-15T00:00:00Z" }
              as: ClaimsAgent
              captures: { fk_error_id: "$.data.error_id" }
          assert:
            - "HTTP 422 with data.error_id == 'ERR_DEPOSITOR_INSTITUTION_MISMATCH'"
            - "GET /deposit-accounts with institution_id == ${fk_inst2_id} returns total_count == 0 and with institution_id == ${fk_inst1_id} returns total_count == 0"

      - name: brokered_pass_through_account_missing_required_recordkeeping_status_rejected
        claim_type: required_fields
        grounds:
          - validations[priority=22]
          - entities.DepositAccount.fields.recordkeeping_status
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "broker_name and recordkeeping_status are conditionally required: present exactly when ownership_category == BROKERED_PASS_THROUGH. Omitting recordkeeping_status on a brokered account returns ERR_INVALID_REQUEST (400), and supplying broker_name on a SINGLE account is rejected by the same rule."
        test_recipe:
          setup:
            - "Institution 60014 exists with broker depositor Vantage Deposits."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: ClosingManager
            - call: "POST /institutions"
              payload: { cert_number: "60014", legal_name: "Conditional Field Bank", charter_state: "WA", book_asset_value_cents: 1000000, estimated_liquidation_recovery_cents: 500000 }
              as: ClosingManager
              captures: { cd_inst_id: $.data.id }
            - call: "POST /institutions/${cd_inst_id}/depositor-records"
              payload: { tin_hash: "TIN-VANTAGE-60014", legal_name: "Vantage Deposits LLC", depositor_type: "BROKER", contact_email: "ops@vantage.example.com" }
              as: ClaimsAgent
              captures: { cd_broker_id: $.data.id }
          trigger:
            - call: "POST /deposit-accounts"
              payload: { institution_id: "${cd_inst_id}", primary_depositor_id: "${cd_broker_id}", account_number: "V-0001", ownership_category: "BROKERED_PASS_THROUGH", balance_cents: 100000, opened_at: "2024-01-15T00:00:00Z", broker_name: "Vantage Deposits LLC" }
              as: ClaimsAgent
              captures: { cd_error_id: "$.data.error_id" }
            - call: "POST /deposit-accounts"
              payload: { institution_id: "${cd_inst_id}", primary_depositor_id: "${cd_broker_id}", account_number: "V-0002", ownership_category: "SINGLE", balance_cents: 100000, opened_at: "2024-01-15T00:00:00Z", broker_name: "Vantage Deposits LLC", recordkeeping_status: "COMPLETE" }
              as: ClaimsAgent
              captures: { cd_error_id2: "$.data.error_id" }
          assert:
            - "trigger[0] returns HTTP 400 with data.error_id == 'ERR_INVALID_REQUEST' — recordkeeping_status is required when ownership_category == BROKERED_PASS_THROUGH"
            - "trigger[1] returns HTTP 400 with data.error_id == 'ERR_INVALID_REQUEST' — broker_name / recordkeeping_status must be absent on a SINGLE account"
            - "GET /deposit-accounts with institution_id == ${cd_inst_id} returns total_count == 0"

  # ===================================================================================
  - section: state_machines
    instances:
      - name: initial_state_new_entities_start_in_declared_initial_states
        claim_type: initial_state
        grounds:
          - state_machines.Institution.initial_state
          - state_machines.ReadinessSubmission.initial_state
          - state_machines.DepositAccount.initial_state
        distinguishing_aspect: "A freshly created Institution reads PRE_FAILURE_MONITORING, a freshly created ReadinessSubmission reads RECEIVED, and a freshly created Bidder reads PENDING — none of them is pre-advanced by the create call, and the DepositAccount starts at the full triple PENDING / NONE / PENDING."
        test_recipe:
          setup:
            - "Empty database with the clock pinned to 2026-08-03T09:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: ClosingManager
            - call: "POST /institutions"
              payload: { cert_number: "61001", legal_name: "Initial State Bank", charter_state: "WA", book_asset_value_cents: 10000000, estimated_liquidation_recovery_cents: 4000000 }
              as: ClosingManager
              captures: { is_inst_id: $.data.id }
            - call: "POST /institutions/${is_inst_id}/depositor-records"
              payload: { tin_hash: "TIN-IS-1", legal_name: "Aliyah Cross", depositor_type: "NATURAL_PERSON", contact_email: "aliyah@example.com" }
              as: ClaimsAgent
              captures: { is_dep_id: $.data.id }
          trigger:
            - call: "GET /institutions/${is_inst_id}"
              as: ClosingManager
            - call: "POST /deposit-accounts"
              payload: { institution_id: "${is_inst_id}", primary_depositor_id: "${is_dep_id}", account_number: "IS-0001", ownership_category: "SINGLE", balance_cents: 1000000, accrued_interest_cents: 0, opened_at: "2024-03-01T00:00:00Z" }
              as: ClaimsAgent
              captures: { is_acct_id: $.data.id }
            - call: "POST /institutions/${is_inst_id}/readiness-submissions"
              payload: { file_format: "FDIC_STANDARD_V2", record_count: 1, malformed_record_count: 0, reported_deposit_total_cents: 1000000 }
              as: ClosingManager
              captures: { is_sub_id: $.data.id }
            - call: "POST /bidders"
              payload: { legal_name: "Initial Bidder", cert_number: "61002", tier1_capital_ratio_bps: 1400, camels_composite: 2 }
              as: ResolutionAnalyst
              captures: { is_bidder_id: $.data.id }
          assert:
            - "trigger[0]: data.status == 'PRE_FAILURE_MONITORING', data.franchise_marketing_status == 'NOT_STARTED', data.least_cost_status == 'NOT_STARTED'"
            - "trigger[1]: data.insurance_status == 'PENDING', data.hold_status == 'NONE', data.transition_status == 'PENDING' — all three dimensions at their initial values"
            - "trigger[2]: data.status == 'RECEIVED', data.standardization_score_bps == null, data.deposit_total_variance_bps == null, data.rejection_reason == null"
            - "trigger[3]: data.qualification_status == 'PENDING', data.qualified_at == null, data.disqualification_reason == null"
            - "after trigger[2], GET /institutions/${is_inst_id} shows status == 'READINESS_COLLECTION' — the first submission is what advances the institution, not the institution create"

      - name: valid_transition_standardize_promotes_submission_and_institution_to_resolution_ready
        claim_type: valid_transition
        grounds:
          - state_machines.ReadinessSubmission.RECEIVED_to_STANDARDIZED
          - state_machines.Institution.READINESS_COLLECTION_to_RESOLUTION_READY
          - calculations.readiness_standardization_score
        distinguishing_aspect: "One standardize call writes both computed bps figures, flips the submission to STANDARDIZED, and bubbles up to institution.readiness_standardized == true plus status RESOLUTION_READY in the same request."
        test_recipe:
          setup:
            - "Institution 61003 holds one SINGLE account of 1000000 cents and one RECEIVED submission asserting the same total."
            - "record_count 1 / malformed_record_count 0 gives standardization_score_bps = floor(1 * 10000 / 1) = 10000; booked_total = 1000000 so deposit_total_variance_bps = floor(0 * 10000 / 1000000) = 0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: ClosingManager
            - call: "POST /institutions"
              payload: { cert_number: "61003", legal_name: "Standardize Bank", charter_state: "WA", book_asset_value_cents: 10000000, estimated_liquidation_recovery_cents: 4000000 }
              as: ClosingManager
              captures: { st_inst_id: $.data.id }
            - call: "POST /institutions/${st_inst_id}/depositor-records"
              payload: { tin_hash: "TIN-ST-1", legal_name: "Bela Ortiz", depositor_type: "NATURAL_PERSON", contact_email: "bela@example.com" }
              as: ClaimsAgent
              captures: { st_dep_id: $.data.id }
            - call: "POST /deposit-accounts"
              payload: { institution_id: "${st_inst_id}", primary_depositor_id: "${st_dep_id}", account_number: "ST-0001", ownership_category: "SINGLE", balance_cents: 1000000, accrued_interest_cents: 0, opened_at: "2024-03-01T00:00:00Z" }
              as: ClaimsAgent
              captures: { st_acct_id: $.data.id }
            - call: "POST /institutions/${st_inst_id}/readiness-submissions"
              payload: { file_format: "FDIC_STANDARD_V2", record_count: 1, malformed_record_count: 0, reported_deposit_total_cents: 1000000 }
              as: ClosingManager
              captures: { st_sub_id: $.data.id }
          trigger:
            - call: "POST /readiness-submissions/${st_sub_id}/standardize"
              as: ClosingManager
            - call: "GET /institutions/${st_inst_id}"
              as: ClosingManager
          assert:
            - "trigger[0]: HTTP 200 with data.status == 'STANDARDIZED', data.standardization_score_bps == 10000, data.deposit_total_variance_bps == 0, data.rejection_reason == null, data.version == 2"
            - "trigger[1]: data.readiness_standardized == true, data.status == 'RESOLUTION_READY'"
            - "trigger[1]: data.total_deposit_balance_cents == 1000000 and data.depositor_record_count == 1 — recomputed by the same transition"

      - name: fork_standardize_rejects_on_score_floor_and_on_total_variance
        claim_type: side_effect_execution
        grounds:
          - state_machines.ReadinessSubmission.RECEIVED_to_REJECTED
          - calculations.readiness_standardization_score
          - entities.ReadinessSubmission.fields.rejection_reason
        distinguishing_aspect: "The REJECTED arm is reached two different ways and the gate order fixes rejection_reason: 3 malformed of 100 gives score 9700 < 9800 so SCORE_BELOW_FLOOR wins even though variance is 0, while a clean file whose reported total is 1010000 against a booked 1000000 gives variance 100 > 25 so TOTAL_VARIANCE_EXCEEDED. Neither arm touches the institution."
        test_recipe:
          setup:
            - "Institution 61004 holds one SINGLE account of 1000000 cents and a submission with record_count 100 / malformed_record_count 3 / reported 1000000."
            - "Institution 61005 holds one SINGLE account of 1000000 cents and a submission with record_count 1 / malformed_record_count 0 / reported 1010000."
            - "Arm 1: score = floor((100 - 3) * 10000 / 100) = 9700 < 9800 -> SCORE_BELOW_FLOOR; variance = 0."
            - "Arm 2: score = 10000; variance = floor(abs(1010000 - 1000000) * 10000 / 1000000) = 100 > 25 -> TOTAL_VARIANCE_EXCEEDED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: ClosingManager
            - call: "POST /institutions"
              payload: { cert_number: "61004", legal_name: "Score Floor Bank", charter_state: "WA", book_asset_value_cents: 10000000, estimated_liquidation_recovery_cents: 4000000 }
              as: ClosingManager
              captures: { rj_inst1_id: $.data.id }
            - call: "POST /institutions/${rj_inst1_id}/depositor-records"
              payload: { tin_hash: "TIN-RJ-1", legal_name: "Cora Duval", depositor_type: "NATURAL_PERSON", contact_email: "cora@example.com" }
              as: ClaimsAgent
              captures: { rj_dep1_id: $.data.id }
            - call: "POST /deposit-accounts"
              payload: { institution_id: "${rj_inst1_id}", primary_depositor_id: "${rj_dep1_id}", account_number: "RJ-0001", ownership_category: "SINGLE", balance_cents: 1000000, accrued_interest_cents: 0, opened_at: "2024-03-01T00:00:00Z" }
              as: ClaimsAgent
            - call: "POST /institutions/${rj_inst1_id}/readiness-submissions"
              payload: { file_format: "VENDOR_CSV", record_count: 100, malformed_record_count: 3, reported_deposit_total_cents: 1000000 }
              as: ClosingManager
              captures: { rj_sub1_id: $.data.id }
            - call: "POST /institutions"
              payload: { cert_number: "61005", legal_name: "Variance Bank", charter_state: "WA", book_asset_value_cents: 10000000, estimated_liquidation_recovery_cents: 4000000 }
              as: ClosingManager
              captures: { rj_inst2_id: $.data.id }
            - call: "POST /institutions/${rj_inst2_id}/depositor-records"
              payload: { tin_hash: "TIN-RJ-2", legal_name: "Dane Whitlock", depositor_type: "NATURAL_PERSON", contact_email: "dane@example.com" }
              as: ClaimsAgent
              captures: { rj_dep2_id: $.data.id }
            - call: "POST /deposit-accounts"
              payload: { institution_id: "${rj_inst2_id}", primary_depositor_id: "${rj_dep2_id}", account_number: "RJ-0002", ownership_category: "SINGLE", balance_cents: 1000000, accrued_interest_cents: 0, opened_at: "2024-03-01T00:00:00Z" }
              as: ClaimsAgent
            - call: "POST /institutions/${rj_inst2_id}/readiness-submissions"
              payload: { file_format: "LEGACY_FIXED_WIDTH", record_count: 1, malformed_record_count: 0, reported_deposit_total_cents: 1010000 }
              as: ClosingManager
              captures: { rj_sub2_id: $.data.id }
          trigger:
            - call: "POST /readiness-submissions/${rj_sub1_id}/standardize"
              as: ClosingManager
            - call: "POST /readiness-submissions/${rj_sub2_id}/standardize"
              as: ClosingManager
            - call: "GET /institutions/${rj_inst1_id}"
              as: ClosingManager
          assert:
            - "trigger[0]: HTTP 200 with data.status == 'REJECTED', data.standardization_score_bps == 9700, data.deposit_total_variance_bps == 0, data.rejection_reason == 'SCORE_BELOW_FLOOR'"
            - "trigger[1]: HTTP 200 with data.status == 'REJECTED', data.standardization_score_bps == 10000, data.deposit_total_variance_bps == 100, data.rejection_reason == 'TOTAL_VARIANCE_EXCEEDED'"
            - "trigger[2]: data.status == 'READINESS_COLLECTION' and data.readiness_standardized == false — the rejected arm leaves the institution untouched"

      - name: precondition_close_without_standardized_readiness_returns_not_ready
        claim_type: precondition_enforcement
        grounds:
          - state_machines.Institution.RESOLUTION_READY_to_CLOSED_IN_RECEIVERSHIP.preconditions
          - validations[priority=40]
          - errors[ERR_INSTITUTION_NOT_READY]
        distinguishing_aspect: "close is refused with ERR_INSTITUTION_NOT_READY (409) while the institution sits at READINESS_COLLECTION with an un-standardized submission, and the account is NOT frozen."
        test_recipe:
          setup:
            - "Institution 61006 has one RECEIVED submission that has not been standardized and one SINGLE account."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: ClosingManager
            - call: "POST /institutions"
              payload: { cert_number: "61006", legal_name: "Not Ready Bank", charter_state: "WA", book_asset_value_cents: 10000000, estimated_liquidation_recovery_cents: 4000000 }
              as: ClosingManager
              captures: { nr_inst_id: $.data.id }
            - call: "POST /institutions/${nr_inst_id}/depositor-records"
              payload: { tin_hash: "TIN-NR-1", legal_name: "Efua Mensah", depositor_type: "NATURAL_PERSON", contact_email: "efua@example.com" }
              as: ClaimsAgent
              captures: { nr_dep_id: $.data.id }
            - call: "POST /deposit-accounts"
              payload: { institution_id: "${nr_inst_id}", primary_depositor_id: "${nr_dep_id}", account_number: "NR-0001", ownership_category: "SINGLE", balance_cents: 1000000, accrued_interest_cents: 0, opened_at: "2024-03-01T00:00:00Z" }
              as: ClaimsAgent
              captures: { nr_acct_id: $.data.id }
            - call: "POST /institutions/${nr_inst_id}/readiness-submissions"
              payload: { file_format: "FDIC_STANDARD_V2", record_count: 1, malformed_record_count: 0, reported_deposit_total_cents: 1000000 }
              as: ClosingManager
              captures: { nr_sub_id: $.data.id }
          trigger:
            - call: "POST /institutions/${nr_inst_id}/close"
              as: ClosingManager
              captures: { nr_error_id: "$.data.error_id" }
            - call: "GET /deposit-accounts/${nr_acct_id}"
              as: ClosingManager
          assert:
            - "trigger[0]: HTTP 409 with data.error_id == 'ERR_INSTITUTION_NOT_READY'"
            - "trigger[1]: data.insurance_status == 'PENDING' — the refused close ran no cascade"
            - "GET /institutions/${nr_inst_id} still shows status == 'READINESS_COLLECTION' and failure_datetime == null"

      - name: idempotency_second_close_returns_institution_already_closed
        claim_type: idempotency
        grounds:
          - validations[priority=41]
          - errors[ERR_INSTITUTION_ALREADY_CLOSED]
          - state_machines.Institution
        distinguishing_aspect: "The same close trigger fired twice succeeds once and then returns ERR_INSTITUTION_ALREADY_CLOSED (409); failure_datetime keeps the first closure's timestamp even though the clock has since advanced."
        test_recipe:
          setup:
            - "Institution 61007 is at RESOLUTION_READY with readiness_standardized true; the clock reads 2026-08-03T09:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: ClosingManager
            - call: "POST /institutions"
              payload: { cert_number: "61007", legal_name: "Double Close Bank", charter_state: "WA", book_asset_value_cents: 10000000, estimated_liquidation_recovery_cents: 4000000 }
              as: ClosingManager
              captures: { dc_inst_id: $.data.id }
            - call: "POST /institutions/${dc_inst_id}/depositor-records"
              payload: { tin_hash: "TIN-DC-1", legal_name: "Fatima Noor", depositor_type: "NATURAL_PERSON", contact_email: "fatima@example.com" }
              as: ClaimsAgent
              captures: { dc_dep_id: $.data.id }
            - call: "POST /deposit-accounts"
              payload: { institution_id: "${dc_inst_id}", primary_depositor_id: "${dc_dep_id}", account_number: "DC-0001", ownership_category: "SINGLE", balance_cents: 1000000, accrued_interest_cents: 0, opened_at: "2024-03-01T00:00:00Z" }
              as: ClaimsAgent
            - call: "POST /institutions/${dc_inst_id}/readiness-submissions"
              payload: { file_format: "FDIC_STANDARD_V2", record_count: 1, malformed_record_count: 0, reported_deposit_total_cents: 1000000 }
              as: ClosingManager
              captures: { dc_sub_id: $.data.id }
            - call: "POST /readiness-submissions/${dc_sub_id}/standardize"
              as: ClosingManager
            - call: "POST /institutions/${dc_inst_id}/close"
              as: ClosingManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T17:00:00Z" }
              as: ClosingManager
          trigger:
            - call: "POST /institutions/${dc_inst_id}/close"
              as: ClosingManager
              captures: { dc_error_id: "$.data.error_id" }
            - call: "GET /institutions/${dc_inst_id}"
              as: ClosingManager
          assert:
            - "trigger[0]: HTTP 409 with data.error_id == 'ERR_INSTITUTION_ALREADY_CLOSED'"
            - "trigger[1]: data.failure_datetime == '2026-08-03T09:00:00Z' — the first closure's stamp survives, it is not restamped to 17:00"
            - "trigger[1]: data.status == 'CLOSED_IN_RECEIVERSHIP' and data.version is unchanged from the value read straight after the successful close"

      - name: invalid_transition_standardize_on_already_standardized_submission_rejected
        claim_type: invalid_transitions
        grounds:
          - validations[priority=42]
          - errors[ERR_SUBMISSION_NOT_PENDING]
          - state_machines.ReadinessSubmission.terminal_states
        distinguishing_aspect: "STANDARDIZED is terminal for ReadinessSubmission, so a second standardize on the same submission returns ERR_SUBMISSION_NOT_PENDING (409) and does not re-run the score calculation."
        test_recipe:
          setup:
            - "Institution 61008 has a submission already at STANDARDIZED (score 10000, variance 0)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: ClosingManager
            - call: "POST /institutions"
              payload: { cert_number: "61008", legal_name: "Terminal Submission Bank", charter_state: "WA", book_asset_value_cents: 10000000, estimated_liquidation_recovery_cents: 4000000 }
              as: ClosingManager
              captures: { ts_inst_id: $.data.id }
            - call: "POST /institutions/${ts_inst_id}/depositor-records"
              payload: { tin_hash: "TIN-TS-1", legal_name: "Gustav Lind", depositor_type: "NATURAL_PERSON", contact_email: "gustav@example.com" }
              as: ClaimsAgent
              captures: { ts_dep_id: $.data.id }
            - call: "POST /deposit-accounts"
              payload: { institution_id: "${ts_inst_id}", primary_depositor_id: "${ts_dep_id}", account_number: "TS-0001", ownership_category: "SINGLE", balance_cents: 1000000, accrued_interest_cents: 0, opened_at: "2024-03-01T00:00:00Z" }
              as: ClaimsAgent
            - call: "POST /institutions/${ts_inst_id}/readiness-submissions"
              payload: { file_format: "FDIC_STANDARD_V2", record_count: 1, malformed_record_count: 0, reported_deposit_total_cents: 1000000 }
              as: ClosingManager
              captures: { ts_sub_id: $.data.id }
            - call: "POST /readiness-submissions/${ts_sub_id}/standardize"
              as: ClosingManager
          trigger:
            - call: "POST /readiness-submissions/${ts_sub_id}/standardize"
              as: ClosingManager
              captures: { ts_error_id: "$.data.error_id" }
          assert:
            - "HTTP 409 with data.error_id == 'ERR_SUBMISSION_NOT_PENDING'"
            - "GET /institutions/${ts_inst_id}/readiness-submissions with status == 'STANDARDIZED' returns total_count == 1 and that row's version == 2 — the refused call bumped nothing"

      - name: cascade_down_close_freezes_only_this_institutions_pending_accounts
        claim_type: cascade_down
        grounds:
          - state_machines.Institution.RESOLUTION_READY_to_CLOSED_IN_RECEIVERSHIP.side_effects
          - state_machines.DepositAccount.PENDING_to_FROZEN_FOR_DETERMINATION
        distinguishing_aspect: "The close cascade flips every PENDING account of the closing institution — including the RETIREMENT one — and reaches no account of a second, still-open institution."
        test_recipe:
          setup:
            - "Institution 61009 holds a SINGLE account of 500000 and a RETIREMENT account of 300000 (booked total 800000) and is at RESOLUTION_READY."
            - "Institution 61010 holds one SINGLE account of 900000 and is still at PRE_FAILURE_MONITORING."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: ClosingManager
            - call: "POST /institutions"
              payload: { cert_number: "61009", legal_name: "Cascade Source Bank", charter_state: "WA", book_asset_value_cents: 10000000, estimated_liquidation_recovery_cents: 4000000 }
              as: ClosingManager
              captures: { cs_inst1_id: $.data.id }
            - call: "POST /institutions/${cs_inst1_id}/depositor-records"
              payload: { tin_hash: "TIN-CS-1", legal_name: "Hina Sato", depositor_type: "NATURAL_PERSON", contact_email: "hina@example.com" }
              as: ClaimsAgent
              captures: { cs_dep1_id: $.data.id }
            - call: "POST /deposit-accounts"
              payload: { institution_id: "${cs_inst1_id}", primary_depositor_id: "${cs_dep1_id}", account_number: "CS-0001", ownership_category: "SINGLE", balance_cents: 500000, accrued_interest_cents: 0, opened_at: "2024-03-01T00:00:00Z" }
              as: ClaimsAgent
              captures: { cs_acct1_id: $.data.id }
            - call: "POST /deposit-accounts"
              payload: { institution_id: "${cs_inst1_id}", primary_depositor_id: "${cs_dep1_id}", account_number: "CS-0002", ownership_category: "RETIREMENT", balance_cents: 300000, accrued_interest_cents: 0, opened_at: "2024-04-01T00:00:00Z" }
              as: ClaimsAgent
              captures: { cs_acct2_id: $.data.id }
            - call: "POST /institutions/${cs_inst1_id}/readiness-submissions"
              payload: { file_format: "FDIC_STANDARD_V2", record_count: 2, malformed_record_count: 0, reported_deposit_total_cents: 800000 }
              as: ClosingManager
              captures: { cs_sub_id: $.data.id }
            - call: "POST /readiness-submissions/${cs_sub_id}/standardize"
              as: ClosingManager
            - call: "POST /institutions"
              payload: { cert_number: "61010", legal_name: "Untouched Bank", charter_state: "OR", book_asset_value_cents: 5000000, estimated_liquidation_recovery_cents: 2000000 }
              as: ClosingManager
              captures: { cs_inst2_id: $.data.id }
            - call: "POST /institutions/${cs_inst2_id}/depositor-records"
              payload: { tin_hash: "TIN-CS-2", legal_name: "Ivan Petrov", depositor_type: "NATURAL_PERSON", contact_email: "ivan@example.com" }
              as: ClaimsAgent
              captures: { cs_dep2_id: $.data.id }
            - call: "POST /deposit-accounts"
              payload: { institution_id: "${cs_inst2_id}", primary_depositor_id: "${cs_dep2_id}", account_number: "CS-0003", ownership_category: "SINGLE", balance_cents: 900000, accrued_interest_cents: 0, opened_at: "2024-03-01T00:00:00Z" }
              as: ClaimsAgent
              captures: { cs_acct3_id: $.data.id }
          trigger:
            - call: "POST /institutions/${cs_inst1_id}/close"
              as: ClosingManager
            - call: "GET /deposit-accounts"
              payload: { institution_id: "${cs_inst1_id}", insurance_status: "FROZEN_FOR_DETERMINATION" }
              as: ClosingManager
            - call: "GET /deposit-accounts/${cs_acct3_id}"
              as: ClosingManager
          assert:
            - "trigger[0]: HTTP 200 with data.status == 'CLOSED_IN_RECEIVERSHIP', data.failure_datetime == '2026-08-03T09:00:00Z', data.total_deposit_balance_cents == 800000, data.depositor_record_count == 1"
            - "trigger[1]: total_count == 2 — both the SINGLE and the RETIREMENT account flipped, the ownership category is irrelevant to the freeze"
            - "trigger[2]: data.insurance_status == 'PENDING' — the second institution's account is outside the cascade scope"

      - name: conditional_cascade_zero_uninsured_certify_skips_holds_and_certificate
        claim_type: conditional_cascade
        grounds:
          - state_machines.InsuranceDetermination.UNDER_REVIEW_to_CERTIFIED.side_effects
          - calculations.uninsured_hold_allocation
          - entities.DepositorRecord.fields.notice_template_code
        distinguishing_aspect: "With a fully insured depositor (1000000 cents, far below SMDIA 25000000) the certify cascade runs L1, L2 and L5 but skips L3 and L4 entirely: no hold, no ReceivershipCertificate, and the notice goes out as FULLY_INSURED rather than PARTIALLY_UNINSURED."
        test_recipe:
          setup:
            - "Institution 61011 is CLOSED_IN_RECEIVERSHIP with one depositor holding a single SINGLE account of 1000000 cents."
            - "insured = min(1000000, 25000000) = 1000000; uninsured = max(0, 1000000 - 25000000) = 0."
            - "prepare is performed by user U-AGENT-A and certify by user U-CERT-A so segregation of duties holds."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: ClosingManager
            - call: "POST /institutions"
