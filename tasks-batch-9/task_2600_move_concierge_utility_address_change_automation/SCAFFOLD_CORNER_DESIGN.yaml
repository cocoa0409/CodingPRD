      - name: temporal_validation_move_date_horizon_and_past_grace_boundaries
        claim_type: temporal_validation
        grounds:
          - "validations[priority=29]"
          - "errors[ERR_MOVE_DATE_OUT_OF_RANGE]"
        distinguishing_aspect: |
          Both ends of the acceptance window measured from the logical clock, one day inside and
          one day outside each: clock_date 2026-08-01 accepts 2027-01-28 (exactly +180) and
          2026-07-02 (exactly -30) while rejecting 2027-01-29 and 2026-07-01. This is the only
          rule in the system whose bound is expressed in days on both sides of the clock, so an
          off-by-one in either direction is otherwise invisible.
        test_recipe:
          setup:
