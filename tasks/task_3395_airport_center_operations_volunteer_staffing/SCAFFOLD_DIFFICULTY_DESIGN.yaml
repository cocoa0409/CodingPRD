  - rule_id: priority_pair_validation_conflict
    instances:
      - name: center_closed_beats_guest_ineligible
        grounds:
          - validations[priority=6]
          - validations[priority=7]
          - errors[ERR_CENTER_CLOSED]
          - errors[ERR_GUEST_INELIGIBLE]
        distinguishing_aspect: |
          Error-category pair state vs business_safety: one check-in request that
          violates both (center posture CLOSED AND guest verification expired)
          must surface the state error ERR_CENTER_CLOSED, never
          ERR_GUEST_INELIGIBLE.
        test_recipe:
          setup:
            - "Clock 2026-09-01; center with NO site agreement (posture CLOSED)"
            - "Guest whose verification_expires_on 2026-08-15 is already past"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /centers"
              payload: { name: "Iota Center", airport_code: "MIA", occupancy_cap: 20, required_daily_confirmed_assignments: 1 }
              as: PlatformAdmin
              captures: { c_id: $.data.id }
            - call: "POST /guests"
              payload: { full_name: "Expired Guest", category: "VETERAN", verification_expires_on: "2026-08-15" }
              as: Anonymous
              captures: { g_id: $.data.id }
          trigger:
