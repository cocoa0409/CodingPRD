          birth_year: 1964
          birth_month: 7
        as: ClaimsSpecialist
        captures:
          wb: $.data.id
          wb_ver: $.data.version
      - call: POST /ssa/claims
        payload:
          worker_id: ${wa}
          claim_type: RETIREMENT
          entitlement_month: 2026-06
        as: Claimant
        as_user_id: ${wa}
        captures:
          ca: $.data.id
      - call: POST /ssa/claims
        payload:
