            - "posting_count == 2 and last_posted_at is non-null"

      - name: clock_advance_rejects_zero_and_over_range_day_counts
        claim_type: Conditional Action
        grounds:
          - validations[priority=22]
          - errors.ERR_INVALID_ADVANCE_DAYS
          - endpoints.POST_/servicing/_clock/advance
        distinguishing_aspect: "The advance endpoint accepts 1 through 3650 whole days inclusive and rejects both 0 and 4000 with ERR_INVALID_ADVANCE_DAYS."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "POST /servicing/_clock/advance"
              payload: { days: 0 }
              as: ProgramAdmin
              captures: { error_id: "$.data.error_id" }
          assert:
            - "the response status is 422 and error_id == ERR_INVALID_ADVANCE_DAYS"
            - "a second advance of 3650 days succeeds and reports advanced_days 3650"
            - "a third advance of 4000 days returns 422 ERR_INVALID_ADVANCE_DAYS"

  # ===========================================================================
  - section: errors
    instances:

      - name: invalid_request_triggerable_on_missing_required_field
        claim_type: violation_to_error
        grounds:
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "ERR_INVALID_REQUEST is reachable on a create endpoint when a required body field is omitted, independent of the path-existence 404."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "POST /servicing/partners"
              payload: { loyalty_program_code: "NO_NAME" }
              as: ProgramAdmin
              captures: { error_id: "$.data.error_id" }
          assert:
            - "the response status is 400 and error_id == ERR_INVALID_REQUEST"

      - name: stale_version_triggerable_on_renewal_round
        claim_type: violation_to_error
        grounds:
          - errors.ERR_STALE_VERSION
          - concurrency_rules[renewal-round-stale-program]
        distinguishing_aspect: "ERR_STALE_VERSION fires when the renewal write carries an expected_program_version one behind the observed program version."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. One ACTIVE program at version 1."
          setup_api_calls:
            - *c_clock
            - *c_partner_b
            - *c_agreement
            - *c_neg
            - *c_exec
            - *c_program
          trigger:
            - call: "POST /servicing/credit-programs/${g_id}/open-renewal"
              payload: { expected_program_version: "${g_v0} - 1", to_status: "RENEWAL_NEGOTIATION" }
              as: ProgramAdmin
              captures: { error_id: "$.data.error_id" }
          assert:
            - "the response status is 412 and error_id == ERR_STALE_VERSION"
            - "CreditProgram.${g_id}.program_status == ACTIVE (the rejected OCC write changed nothing)"

      - name: invalid_promo_term_triggerable
        claim_type: violation_to_error
        grounds:
          - errors.ERR_INVALID_PROMO_TERM
        distinguishing_aspect: "A promo_term_months outside {6,12,18,24} is rejected at transaction creation."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. One program and account."
          setup_api_calls:
            - *c_clock
            - *c_partner_b
            - *c_agreement
            - *c_neg
            - *c_exec
            - *c_program
            - *c_app
            - *c_decide
            - *c_acct
          trigger:
            - call: "POST /servicing/transactions"
              payload: { account_id: "${acct_id}", merchant_name: "Coldgate Rope", amount_cents: 50000, transaction_channel: "IN_STORE", promo_requested: true, promo_term_months: 9 }
              as: Cardholder
              as_user_id: "${acct_id}"
              captures: { error_id: "$.data.error_id" }
          assert:
            - "the response status is 422 and error_id == ERR_INVALID_PROMO_TERM"

      - name: invalid_state_triggerable_on_transfer_execute
        claim_type: violation_to_error
        grounds:
          - errors.ERR_INVALID_STATE
        excluded_because:
          difficulty_instance: program_close_requires_completed_portfolio_transfer
          rationale: "ERR_INVALID_STATE on a transfer/program transition is asserted as this §1.8 instance's failure path."

      - name: resource_not_found_triggerable_on_filtered_list_absent_id
        claim_type: violation_to_error
        grounds:
          - errors.ERR_RESOURCE_NOT_FOUND
        distinguishing_aspect: "A path-segment id that names no program returns ERR_RESOURCE_NOT_FOUND rather than an empty summary body."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "GET /servicing/credit-programs/00000000-0000-4000-8000-000000000000/summary"
              payload: {}
              as: ProgramAdmin
              captures: { error_id: "$.data.error_id" }
          assert:
            - "the response status is 404 and error_id == ERR_RESOURCE_NOT_FOUND"

      - name: unauthenticated_and_unauthorized_error_triggerable
        claim_type: violation_to_error
        grounds:
          - errors.ERR_UNAUTHENTICATED
          - errors.ERR_UNAUTHORIZED
        distinguishing_aspect: "An Underwriter calling a ProgramAdmin-only settlement transition is rejected with ERR_UNAUTHORIZED while a role-less call yields ERR_UNAUTHENTICATED — auth before authorization."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. One program in WINDING_DOWN with a proposed transfer."
          setup_api_calls:
            - *c_clock
            - *c_partner_b
            - *c_agreement
            - *c_neg
            - *c_exec
            - *c_program
            - *c_app
            - *c_decide
            - *c_acct
            - call: "POST /servicing/accounts/${acct_id}/post-payment"
              payload: { payment_amount_cents: 100 }
              as: Cardholder
              as_user_id: "${acct_id}"
            - call: "POST /servicing/credit-programs/${g_id}/open-renewal"
              payload: { expected_program_version: "${g_v0}", to_status: "WINDING_DOWN" }
              as: ProgramAdmin
              captures: { g_v1: "$.data.version" }
            - call: "POST /servicing/transfer-agreements"
              payload: { program_id: "${g_id}", buyer_role: "RETAILER" }
              as: ProgramAdmin
              captures: { t_id: "$.data.id" }
          trigger:
            - call: "POST /servicing/transfer-agreements/${t_id}/accept"
              payload: { accepted_by_role: "ISSUER" }
              as: Underwriter
              as_user_id: "uw-2201"
              captures: { error_id: "$.data.error_id" }
          assert:
            - "the response status is 403 and error_id == ERR_UNAUTHORIZED"
            - "WindDownTransfer.${t_id}.transfer_status == PROPOSED (the denial changed nothing)"


  # ===========================================================================
  - section: rbac
    instances:

      - name: rbac_underwriter_cannot_suspend_partner
        claim_type: Exclusive Operations
