scenario: |
  1965. Employee Referral Program Administration (talent acquisition team): eligible role & referral submission with duplicate/prior-candidate rules, referrer eligibility (role/tenure) & exclusions, referral status tracking through hiring stages, bonus tiers & payment milestone (hire + retention period), tax treatment & payroll processing, gaming/abuse detection, program analytics by source quality, campaign bonuses for hard-to-fill roles

domain_name: employee-referral-program
api_prefix: /erp

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: pricing_engine
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Employee
    parent: null
    common_fields: true
    fields:
      - { name: employee_number, type: string, source: input, description: "Unique HR employee number", constraints: "unique across employees" }
      - { name: full_name, type: string, source: input, description: "Employee full name" }
      - { name: email, type: string, source: input, description: "Work email; compared (normalized) against candidate email for self-referral detection" }
      - { name: department, type: string, source: input, description: "Department code the employee belongs to" }
      - { name: job_level, type: enum, source: input, description: "IC | SENIOR | MANAGER | DIRECTOR | EXECUTIVE" }
      - { name: is_recruiter, type: boolean, source: input, default: false, description: "True for talent-acquisition recruiters (exclusion rules apply)" }
      - { name: hire_date, type: datetime, source: input, description: "Employment start; tenure computed against the logical clock" }
      - { name: employment_status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | TERMINATED" }
      - { name: terminated_at, type: datetime, source: system, description: "Set when terminated; null otherwise" }
      - { name: tenure_days, type: integer, source: computed, description: "floor((now - hire_date)/86400) against logical clock; negative floor toward zero if hire_date in future" }
      - { name: fraud_strikes, type: integer, source: system, default: 0, description: "Count of CONFIRMED abuse cases for this employee" }
      - { name: risk_score, type: number, source: computed, default: 0, description: "Decayed weighted sum of CONFIRMED abuse cases; see fraud_risk_score calculation" }
      - { name: referral_suspended, type: boolean, source: computed, default: false, description: "true iff risk_score >= SUSPEND_THRESHOLD (100)" }
      - { name: annual_provisional_cents, type: integer, source: computed, default: 0, description: "Sum of amount_cents over the employee's milestones with status in {EARNED, APPROVED, BATCHED, PAID} whose earned_at falls in the current calendar year, minus amount_cents of milestones CLAWED_BACK in the current calendar year" }
      - { name: annual_committed_cents, type: integer, source: computed, default: 0, description: "Same as annual_provisional_cents but counting only {APPROVED, BATCHED, PAID} (EARNED excluded); CLAWED_BACK subtracted" }

  - name: Candidate
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Candidate full name" }
      - { name: email, type: string, source: input, description: "Contact email; identity key for duplicate detection" }
      - { name: normalized_email, type: string, source: computed, description: "lower(trim(email)); used for all identity comparisons" }
      - { name: phone, type: string, source: input, description: "Optional contact phone" }
      - { name: prior_application_at, type: datetime, source: input, description: "Timestamp of a prior direct application outside the referral program, if any; seeds last_terminal_outcome_at" }
      - { name: global_status, type: enum, source: system, default: AVAILABLE, description: "AVAILABLE | IN_PROCESS | HIRED | DEPARTED" }
      - { name: last_terminal_outcome_at, type: datetime, source: system, description: "When the candidate last reached a terminal outcome (rejected/not-selected/withdrawn referral, or prior_application_at at creation); null if never" }
      - { name: cooldown_until, type: datetime, source: computed, description: "last_terminal_outcome_at + duplicate_cooldown_months (calendar months, day clamped to month end); null when last_terminal_outcome_at is null" }
      - { name: hired_via_referral_id, type: string, source: system, description: "FK -> Referral.id; set when global_status becomes HIRED; null otherwise" }
      - { name: departed_at, type: datetime, source: system, description: "When a hired candidate left the company (drives retention failure and clawback); null otherwise" }

  - name: JobRequisition
    parent: null
    common_fields: true
    fields:
      - { name: req_number, type: string, source: input, description: "Unique requisition number", constraints: "unique" }
      - { name: title, type: string, source: input, description: "Job title" }
      - { name: department, type: string, source: input, description: "Hiring department code" }
      - { name: level, type: enum, source: input, description: "IC | SENIOR | MANAGER | DIRECTOR | EXECUTIVE; selects bonus tier" }
      - { name: referral_eligible, type: boolean, source: input, default: true, description: "Whether referrals are accepted for this requisition" }
      - { name: hard_to_fill, type: boolean, source: input, default: false, description: "Flags the requisition as hard-to-fill (campaign targeting metadata)" }
      - { name: openings, type: integer, source: input, default: 1, description: "Number of hires that fill this requisition; must be >= 1" }
      - { name: filled_count, type: integer, source: system, default: 0, description: "Hires made against this requisition" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | OPEN | PAUSED | FILLED | CANCELLED" }
      - { name: opened_at, type: datetime, source: system, description: "When first opened; null while DRAFT" }
      - { name: filled_by_candidate_id, type: string, source: system, description: "FK -> Candidate.id of the candidate whose hire filled the last opening; null until FILLED" }
      - { name: open_referral_count, type: integer, source: computed, default: 0, description: "Count of referrals for this requisition whose status is non-terminal" }

  - name: PolicyVersion
    parent: null
    common_fields: true
    fields:
      - { name: effective_from, type: datetime, source: input, description: "Start of effectiveness window (inclusive); half-open interval [effective_from, effective_to)" }
      - { name: effective_to, type: datetime, source: input, description: "End of effectiveness window (exclusive); null = open-ended" }
      - { name: min_tenure_days, type: integer, source: input, default: 90, description: "Minimum referrer tenure in days (>= comparison)" }
      - { name: duplicate_cooldown_months, type: integer, source: input, default: 6, description: "Candidate re-referral cooldown window in calendar months" }
      - { name: referral_expiry_days, type: integer, source: input, default: 45, description: "Days a referral may sit in SUBMITTED/UNDER_REVIEW/NEEDS_INFO before auto-expiry" }
      - { name: hire_pct, type: integer, source: input, default: 30, description: "Percent of gross bonus paid at the HIRE milestone (1..99); RETENTION pays the remainder" }
      - { name: retention_days, type: integer, source: input, default: 180, description: "Days the hire must remain employed after hire_date for the RETENTION milestone" }
      - { name: clawback_days, type: integer, source: input, default: 90, description: "Days after retention met during which departure triggers clawback of a PAID retention milestone" }
      - { name: annual_cap_cents, type: integer, source: input, default: 2000000, description: "Max referral bonus cents payable to one referrer per calendar year" }
      - { name: velocity_limit, type: integer, source: input, default: 5, description: "Referrals per rolling 7 days at or above which a VELOCITY abuse case is auto-raised (>= comparison)" }
      - { name: tier_ic_cents, type: integer, source: input, default: 150000, description: "Base bonus for IC-level requisitions" }
      - { name: tier_senior_cents, type: integer, source: input, default: 300000, description: "Base bonus for SENIOR-level requisitions" }
      - { name: tier_manager_cents, type: integer, source: input, default: 500000, description: "Base bonus for MANAGER-level requisitions" }
      - { name: tier_director_cents, type: integer, source: input, default: 650000, description: "Base bonus for DIRECTOR-level requisitions" }
      - { name: tier_executive_cents, type: integer, source: input, default: 800000, description: "Base bonus for EXECUTIVE-level requisitions" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | ACTIVE | SUPERSEDED | RETIRED; at most one ACTIVE at any time" }
      - { name: note, type: string, source: input, description: "Free-form policy note" }

  - name: Campaign
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Campaign name" }
      - { name: job_requisition_id, type: string, source: input, description: "FK -> JobRequisition.id; campaign covers exactly one requisition" }
      - { name: multiplier_bps, type: integer, source: input, description: "Bonus multiplier in basis points (15000 = 1.5x); applied to tier base" }
      - { name: flat_addon_cents, type: integer, source: input, description: "Flat cents added on top of the multiplied base" }
      - { name: window_start, type: datetime, source: input, description: "Campaign window start (inclusive); CLOSED interval semantics [window_start, window_end]" }
      - { name: window_end, type: datetime, source: input, description: "Campaign window end (inclusive); CLOSED interval semantics" }
      - { name: budget_cents, type: integer, source: input, description: "Total campaign uplift budget" }
      - { name: max_payouts, type: integer, source: input, description: "Optional cap on number of referrals that may attach this campaign; null = unlimited" }
      - { name: reserved_cents, type: integer, source: system, default: 0, description: "Uplift reserved by attached non-terminal referrals" }
      - { name: spent_cents, type: integer, source: system, default: 0, description: "Uplift converted to earned (net of forfeits/clawbacks)" }
      - { name: remaining_cents, type: integer, source: computed, description: "= budget_cents - reserved_cents - spent_cents; invariant reserved + spent + remaining == budget" }
      - { name: payouts_count, type: integer, source: system, default: 0, description: "Referrals currently attached to this campaign (non-terminal, uplift may be 0)" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | ACTIVE | PAUSED | EXHAUSTED | ENDED | CANCELLED" }

  - name: Referral
    parent: null
    common_fields: true
    fields:
      - { name: referrer_id, type: string, source: input, description: "FK -> Employee.id of the referring employee" }
      - { name: candidate_id, type: string, source: system, description: "FK -> Candidate.id; resolved from candidate_id input or matched/created from candidate_email" }
      - { name: job_requisition_id, type: string, source: input, description: "FK -> JobRequisition.id" }
      - { name: campaign_id, type: string, source: system, description: "FK -> Campaign.id attached at submission when an ACTIVE campaign covers the requisition and window contains submitted_at; null otherwise" }
      - { name: policy_version_id, type: string, source: system, description: "FK -> PolicyVersion.id pinned at submission (the ACTIVE policy at that instant); all rule constants for this referral read from this version" }
      - { name: status, type: enum, source: system, default: SUBMITTED, description: "SUBMITTED | UNDER_REVIEW | NEEDS_INFO | QUALIFIED | SCREENING | INTERVIEWING | OFFER_EXTENDED | HIRED | COMPLETED | REJECTED_DUPLICATE | REJECTED_PRIOR_CANDIDATE | REJECTED_OTHER | NOT_SELECTED | WITHDRAWN | EXPIRED | FORFEITED | RETENTION_FAILED" }
      - { name: submitted_at, type: datetime, source: system, description: "Logical-clock timestamp of submission" }
      - { name: note, type: string, source: input, description: "Referrer note" }
      - { name: bonus_base_cents, type: integer, source: computed, description: "Tier base for the requisition level read from the pinned policy at submission" }
      - { name: campaign_uplift_cents, type: integer, source: computed, default: 0, description: "Uplift granted at submission (clipped to campaign remaining budget at that instant); 0 when no campaign attached or referrer is EXECUTIVE" }
      - { name: bonus_total_cents, type: integer, source: computed, description: "= min(bonus_base_cents + campaign_uplift_cents, annual_provisional_cap_remaining at submission); provisional gross" }
      - { name: hire_date, type: datetime, source: input, description: "Actual hire start date, set by the hire action; must be <= now" }
      - { name: retention_due_at, type: datetime, source: computed, description: "= hire_date + retention_days (pinned policy); null until HIRED" }
      - { name: clawback_until, type: datetime, source: computed, description: "= retention_due_at + clawback_days; null until HIRED" }
      - { name: last_decision_reason, type: string, source: system, description: "Machine-readable reason for the last adverse transition (e.g. DUPLICATE, REQ_FILLED, REQ_CANCELLED, ABUSE_CONFIRMED)" }
      - { name: uplift_spent_cents, type: integer, source: system, default: 0, description: "Portion of campaign_uplift_cents already converted to campaign.spent_cents (hire share + retention share as earned)" }

  - name: BonusMilestone
    parent: null
    common_fields: true
    fields:
      - { name: referral_id, type: string, source: system, description: "FK -> Referral.id" }
      - { name: kind, type: enum, source: system, description: "HIRE | RETENTION" }
      - { name: amount_cents, type: integer, source: computed, description: "HIRE = round_half_up(bonus_total_cents * hire_pct / 100); RETENTION = bonus_total_cents - hire amount (remainder absorbs rounding)" }
      - { name: withholding_cents, type: integer, source: computed, description: "Computed at APPROVE time from the referrer's TaxProfile method; locked thereafter" }
      - { name: net_cents, type: integer, source: computed, description: "= amount_cents - withholding_cents" }
      - { name: status, type: enum, source: system, default: PENDING, description: "PENDING | EARNED | APPROVED | BATCHED | PAID | FORFEITED | CLAWED_BACK" }
      - { name: earned_at, type: datetime, source: system, description: "When the milestone became EARNED; null until then" }
      - { name: payroll_batch_id, type: string, source: system, description: "FK -> PayrollBatch.id while BATCHED (or for a CLAWED_BACK milestone attached as a recovery line); null otherwise" }
      - { name: recovery_status, type: enum, source: system, description: "PENDING | RECOVERED; only meaningful on CLAWED_BACK milestones (money to claw back); null otherwise" }
      - { name: approved_by_user_id, type: string, source: system, description: "X-User-ID that approved the milestone" }

  - name: PayrollBatch
    parent: null
    common_fields: true
    fields:
      - { name: period_label, type: string, source: input, description: "Payroll period label (e.g. 2026-08A)" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN | SEALED | EXPORTED | CONFIRMED_PAID | CANCELLED" }
      - { name: total_gross_cents, type: integer, source: computed, default: 0, description: "Sum of amount_cents over attached milestones with status BATCHED, minus amount_cents of attached CLAWED_BACK recovery lines" }
      - { name: total_withholding_cents, type: integer, source: computed, default: 0, description: "Sum of withholding_cents over attached BATCHED milestones" }
      - { name: total_net_cents, type: integer, source: computed, default: 0, description: "= total_gross_cents - total_withholding_cents" }
      - { name: milestone_count, type: integer, source: computed, default: 0, description: "Count of attached milestones (BATCHED plus CLAWED_BACK recovery lines)" }

  - name: AbuseCase
    parent: null
    common_fields: true
    fields:
      - { name: employee_id, type: string, source: input, description: "FK -> Employee.id; the subject referrer" }
      - { name: referral_id, type: string, source: input, description: "FK -> Referral.id; the referral that evidenced the abuse, if any" }
      - { name: case_type, type: enum, source: input, description: "SELF_REFERRAL | VELOCITY | DUPLICATE_RING | RESUME_FARM | MANUAL" }
      - { name: risk_weight, type: integer, source: computed, description: "SELF_REFERRAL 40 | VELOCITY 25 | DUPLICATE_RING 35 | RESUME_FARM 50 | MANUAL 20" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN | UNDER_REVIEW | CONFIRMED | DISMISSED" }
      - { name: raised_by_user_id, type: string, source: system, description: "X-User-ID of the raiser; the literal string 'system' for auto-raised cases" }
      - { name: decided_by_user_id, type: string, source: system, description: "X-User-ID of the ComplianceOfficer who confirmed/dismissed" }
      - { name: confirmed_at, type: datetime, source: system, description: "When confirmed; drives risk-score decay clock" }
      - { name: resolution_note, type: string, source: input, description: "Decision note" }

  - name: TaxProfile
    parent: null
    common_fields: true
    fields:
      - { name: employee_id, type: string, source: system, description: "FK -> Employee.id; 1:1 with Employee" }
      - { name: filing_status, type: enum, source: input, description: "SINGLE | MARRIED | HEAD_OF_HOUSEHOLD" }
      - { name: withholding_method, type: enum, source: input, description: "FLAT | AGGREGATE; selects the withholding calculation variant" }
      - { name: supplemental_rate_bps, type: integer, source: input, description: "Optional flat-rate override in basis points; null = default 2200 (22%)" }
      - { name: ytd_carryover_cents, type: integer, source: input, default: 0, description: "Referral-bonus gross paid earlier this calendar year outside this system (migration carryover); feeds the AGGREGATE bracket base" }
      - { name: ytd_paid_gross_cents, type: integer, source: system, default: 0, description: "Sum of amount_cents of this employee's milestones that reached PAID in the current calendar year (maintained at confirm-paid)" }
      - { name: status, type: enum, source: system, default: SUBMITTED, description: "SUBMITTED | VERIFIED; payout approval requires VERIFIED" }

  - name: ReferralEvent
    parent: null
    common_fields: false
    fields:
      - { name: referral_id, type: string, source: system, description: "FK -> Referral.id" }
      - { name: event_type, type: string, source: system, description: "Machine name of the transition or system action (e.g. SUBMIT, REVIEW, HIRE, FORFEIT)" }
      - { name: from_state, type: string, source: system, description: "Referral status before the event" }
      - { name: to_state, type: string, source: system, description: "Referral status after the event" }
      - { name: actor_user_id, type: string, source: system, description: "X-User-ID of the actor; 'system' for automatic transitions" }
      - { name: note, type: string, source: system, description: "Optional note carried from the triggering request" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Employee
    initial_state: ACTIVE
    terminal_states: [TERMINATED]
    transitions:
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /erp/employees/{id}/terminate"
        actor: PlatformAdmin
        preconditions:
          - "employment_status == ACTIVE"
        side_effects:
          - "terminated_at = now (logical clock)"
          - "Every BonusMilestone for referrals where referrer_id == this employee with status in {EARNED, APPROVED, BATCHED} transitions to FORFEITED; a BATCHED milestone is detached from its PayrollBatch (payroll_batch_id = null) and the batch totals recompute (batch.version increments)"
          - "Each forfeiture releases the referral's remaining campaign reservation: referral.uplift_spent_cents and Campaign.reserved_cents/spent_cents adjust per campaign_settlement (reserved -= outstanding share, spent -= earned-but-forfeited share)"
  - entity: Candidate
    initial_state: AVAILABLE
    terminal_states: []
    transitions:
      - from: AVAILABLE
        to: IN_PROCESS
        trigger: "system (a referral for this candidate is created)"
        actor: system
        preconditions: []
        side_effects: []
      - from: IN_PROCESS
        to: AVAILABLE
        trigger: "system (the candidate's last non-terminal referral reaches a terminal state)"
        actor: system
        preconditions: []
        side_effects:
          - "last_terminal_outcome_at = now; cooldown_until recomputes"
      - from: IN_PROCESS
        to: HIRED
        trigger: "system (POST /erp/referrals/{id}/hire succeeds on one of the candidate's referrals)"
        actor: system
        preconditions: []
        side_effects:
          - "hired_via_referral_id = the hired referral's id"
      - from: HIRED
        to: DEPARTED
        trigger: "POST /erp/candidates/{id}/record-departure"
        actor: Recruiter
        preconditions:
          - "global_status == HIRED"
        side_effects:
          - "departed_at = payload terminated_at"
          - "Retention/clawback consequences are applied by the next POST /erp/_ops/evaluate sweep (see Referral HIRED transitions)"

  - entity: JobRequisition
    initial_state: DRAFT
    terminal_states: [FILLED, CANCELLED]
    transitions:
      - from: DRAFT
        to: OPEN
        trigger: "POST /erp/job-requisitions/{id}/open"
        actor: TalentAdmin
        preconditions: []
        side_effects:
          - "opened_at = now"
      - from: OPEN
        to: PAUSED
        trigger: "POST /erp/job-requisitions/{id}/pause"
        actor: TalentAdmin
        preconditions: []
        side_effects: []
      - from: PAUSED
        to: OPEN
        trigger: "POST /erp/job-requisitions/{id}/resume"
        actor: TalentAdmin
        preconditions: []
        side_effects: []
        note: "OPEN -> PAUSED -> OPEN cycle is allowed unlimited times"
      - from: OPEN
        to: FILLED
        trigger: "system (a hire raises filled_count to == openings)"
        actor: system
        preconditions: []
        side_effects:
          - "filled_by_candidate_id = the candidate just hired"
          - "Every other non-terminal referral for this requisition transitions to NOT_SELECTED with last_decision_reason REQ_FILLED; each releases its remaining campaign reservation"
      - from: OPEN
        to: CANCELLED
        trigger: "POST /erp/job-requisitions/{id}/cancel"
        actor: TalentAdmin
        preconditions: []
        side_effects:
          - "Every non-terminal referral for this requisition transitions to NOT_SELECTED with last_decision_reason REQ_CANCELLED; each releases its remaining campaign reservation"
      - from: PAUSED
        to: CANCELLED
        trigger: "POST /erp/job-requisitions/{id}/cancel"
        actor: TalentAdmin
        preconditions: []
        side_effects:
          - "Same NOT_SELECTED cascade as OPEN -> CANCELLED"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /erp/job-requisitions/{id}/cancel"
        actor: TalentAdmin
        preconditions: []
        side_effects: []

  - entity: PolicyVersion
    initial_state: DRAFT
    terminal_states: [SUPERSEDED, RETIRED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /erp/policy-versions/{id}/activate"
        actor: TalentAdmin
        preconditions:
          - "Its [effective_from, effective_to) window does not overlap any other PolicyVersion in DRAFT or ACTIVE (half-open semantics: touching endpoints do not overlap)"
          - "effective_from <= now (cannot activate a future policy)"
        side_effects:
          - "The previously ACTIVE PolicyVersion (if any) transitions to SUPERSEDED (its version increments)"
      - from: DRAFT
        to: RETIRED
        trigger: "POST /erp/policy-versions/{id}/retire"
        actor: TalentAdmin
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system (another PolicyVersion is activated)"
        actor: system
        preconditions: []
        side_effects:
          - "Already-submitted referrals keep their pinned policy_version_id; new submissions pin the newly ACTIVE policy"

  - entity: Campaign
    initial_state: DRAFT
    terminal_states: [ENDED, CANCELLED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /erp/campaigns/{id}/activate"
        actor: TalentAdmin
        preconditions:
          - "A PolicyVersion is currently ACTIVE (ERR_NO_ACTIVE_POLICY otherwise)"
          - "window_end >= now (ERR_CAMPAIGN_WINDOW_EXPIRED otherwise)"
        side_effects: []
      - from: ACTIVE
        to: PAUSED
        trigger: "POST /erp/campaigns/{id}/pause"
        actor: TalentAdmin
        preconditions: []
        side_effects: []
      - from: PAUSED
        to: ACTIVE
        trigger: "POST /erp/campaigns/{id}/activate"
        actor: TalentAdmin
        preconditions:
          - "window_end >= now (ERR_CAMPAIGN_WINDOW_EXPIRED otherwise)"
        side_effects: []
      - from: ACTIVE
        to: EXHAUSTED
        trigger: "system (spent_cents reaches == budget_cents after a milestone earn converts reserved uplift)"
        actor: system
        preconditions: []
        side_effects:
          - "No new referrals may attach this campaign while EXHAUSTED"
      - from: EXHAUSTED
        to: ACTIVE
        trigger: "system (spent_cents falls below budget_cents after a forfeit or clawback release)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: ENDED
        trigger: "system (POST /erp/_ops/evaluate sweep finds window_end < now)"
        actor: system
        preconditions: []
        side_effects:
          - "Remaining reservations are released: every attached non-terminal referral keeps campaign_id but its unpaid uplift share is released from reserved_cents (uplift already earned stays in spent_cents)"
      - from: PAUSED
        to: ENDED
        trigger: "system (POST /erp/_ops/evaluate sweep finds window_end < now)"
        actor: system
        preconditions: []
        side_effects:
          - "Same reservation release as ACTIVE -> ENDED"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /erp/campaigns/{id}/end"
        actor: TalentAdmin
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /erp/campaigns/{id}/end"
        actor: TalentAdmin
        preconditions: []
        side_effects:
          - "Same reservation release as ENDED"
      - from: PAUSED
        to: CANCELLED
        trigger: "POST /erp/campaigns/{id}/end"
        actor: TalentAdmin
        preconditions: []
        side_effects:
          - "Same reservation release as ENDED"
      - from: EXHAUSTED
        to: CANCELLED
        trigger: "POST /erp/campaigns/{id}/end"
        actor: TalentAdmin
        preconditions: []
        side_effects:
          - "Same reservation release as ENDED"

  - entity: Referral
    initial_state: SUBMITTED
    terminal_states: [COMPLETED, REJECTED_DUPLICATE, REJECTED_PRIOR_CANDIDATE, REJECTED_OTHER, NOT_SELECTED, WITHDRAWN, EXPIRED, FORFEITED, RETENTION_FAILED]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /erp/referrals/{id}/review"
        actor: Recruiter
        preconditions: []
        side_effects: ["ReferralEvent appended (REVIEW)"]
      - from: UNDER_REVIEW
        to: NEEDS_INFO
        trigger: "POST /erp/referrals/{id}/request-info"
        actor: Recruiter
        preconditions: []
        side_effects: ["ReferralEvent appended (REQUEST_INFO)"]
      - from: NEEDS_INFO
        to: UNDER_REVIEW
        trigger: "POST /erp/referrals/{id}/provide-info"
        actor: Recruiter
        preconditions: []
        side_effects: ["ReferralEvent appended (PROVIDE_INFO)"]
        note: "UNDER_REVIEW <-> NEEDS_INFO cycle is allowed unlimited times; Employee role may also call provide-info on own referral"
      - from: UNDER_REVIEW
        to: QUALIFIED
        trigger: "POST /erp/referrals/{id}/qualify"
        actor: Recruiter
        preconditions: []
        side_effects: ["ReferralEvent appended (QUALIFY)"]
      - from: UNDER_REVIEW
        to: REJECTED_DUPLICATE
        trigger: "POST /erp/referrals/{id}/reject with reason_code=DUPLICATE"
        actor: Recruiter
        preconditions: []
        side_effects: ["last_decision_reason = DUPLICATE", "campaign reservation released", "ReferralEvent appended (REJECT)"]
      - from: UNDER_REVIEW
        to: REJECTED_PRIOR_CANDIDATE
        trigger: "POST /erp/referrals/{id}/reject with reason_code=PRIOR_CANDIDATE"
        actor: Recruiter
        preconditions: []
        side_effects: ["last_decision_reason = PRIOR_CANDIDATE", "campaign reservation released", "ReferralEvent appended (REJECT)"]
      - from: UNDER_REVIEW
        to: REJECTED_OTHER
        trigger: "POST /erp/referrals/{id}/reject with reason_code=OTHER"
        actor: Recruiter
        preconditions: []
        side_effects: ["last_decision_reason = OTHER", "campaign reservation released", "ReferralEvent appended (REJECT)"]
      - from: QUALIFIED
        to: SCREENING
        trigger: "POST /erp/referrals/{id}/advance with to_state=SCREENING"
        actor: Recruiter
        preconditions: []
        side_effects: ["ReferralEvent appended (ADVANCE)"]
      - from: SCREENING
        to: INTERVIEWING
        trigger: "POST /erp/referrals/{id}/advance with to_state=INTERVIEWING"
        actor: Recruiter
        preconditions: []
        side_effects: ["ReferralEvent appended (ADVANCE)"]
      - from: INTERVIEWING
        to: OFFER_EXTENDED
        trigger: "POST /erp/referrals/{id}/advance with to_state=OFFER_EXTENDED"
        actor: HiringManager
        preconditions: []
        side_effects: ["ReferralEvent appended (ADVANCE)"]
      - from: OFFER_EXTENDED
        to: INTERVIEWING
        trigger: "POST /erp/referrals/{id}/offer-declined"
        actor: HiringManager
        preconditions: []
        side_effects: ["ReferralEvent appended (OFFER_DECLINED)"]
        note: "Declined offers loop back into INTERVIEWING; cycle is allowed unlimited times"
      - from: OFFER_EXTENDED
        to: HIRED
        trigger: "POST /erp/referrals/{id}/hire"
        actor: HiringManager
        preconditions:
          - "hire_date <= now (ERR_HIRE_DATE_IN_FUTURE otherwise)"
        side_effects:
          - "retention_due_at and clawback_until computed from the pinned policy"
          - "Candidate transitions IN_PROCESS -> HIRED; hired_via_referral_id set"
          - "JobRequisition.filled_count += 1; if filled_count == openings the requisition transitions OPEN -> FILLED, which NOT_SELECTs every other non-terminal referral (reason REQ_FILLED) and releases their campaign reservations"
          - "BonusMilestone(kind=HIRE) created in EARNED with amount_cents per milestone_split; BonusMilestone(kind=RETENTION) created in PENDING"
          - "Campaign settlement (if attached): hire uplift share round_half_up(campaign_uplift_cents * hire_pct / 100) moves reserved_cents -> spent_cents; if spent_cents == budget_cents the campaign auto-transitions ACTIVE -> EXHAUSTED"
          - "ReferralEvent appended (HIRE)"
      - from: QUALIFIED
        to: NOT_SELECTED
        trigger: "POST /erp/referrals/{id}/not-selected"
        actor: Recruiter
        preconditions: []
        side_effects: ["campaign reservation released", "ReferralEvent appended (NOT_SELECTED)"]
      - from: SCREENING
        to: NOT_SELECTED
        trigger: "POST /erp/referrals/{id}/not-selected"
        actor: Recruiter
        preconditions: []
        side_effects: ["campaign reservation released", "ReferralEvent appended (NOT_SELECTED)"]
      - from: INTERVIEWING
        to: NOT_SELECTED
        trigger: "POST /erp/referrals/{id}/not-selected"
        actor: Recruiter
        preconditions: []
        side_effects: ["campaign reservation released", "ReferralEvent appended (NOT_SELECTED)"]
      - from: OFFER_EXTENDED
        to: NOT_SELECTED
        trigger: "POST /erp/referrals/{id}/not-selected"
        actor: HiringManager
        preconditions: []
        side_effects: ["campaign reservation released", "ReferralEvent appended (NOT_SELECTED)"]
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /erp/referrals/{id}/withdraw"
        actor: Employee
        preconditions: ["X-User-ID == referral.referrer_id"]
        side_effects: ["campaign reservation released", "ReferralEvent appended (WITHDRAW)"]
      - from: UNDER_REVIEW
        to: WITHDRAWN
        trigger: "POST /erp/referrals/{id}/withdraw"
        actor: Employee
        preconditions: ["X-User-ID == referral.referrer_id"]
        side_effects: ["campaign reservation released", "ReferralEvent appended (WITHDRAW)"]
      - from: NEEDS_INFO
        to: WITHDRAWN
        trigger: "POST /erp/referrals/{id}/withdraw"
        actor: Employee
        preconditions: ["X-User-ID == referral.referrer_id"]
        side_effects: ["campaign reservation released", "ReferralEvent appended (WITHDRAW)"]
      - from: QUALIFIED
        to: WITHDRAWN
        trigger: "POST /erp/referrals/{id}/withdraw"
        actor: Employee
        preconditions: ["X-User-ID == referral.referrer_id"]
        side_effects: ["campaign reservation released", "ReferralEvent appended (WITHDRAW)"]
      - from: SCREENING
        to: WITHDRAWN
        trigger: "POST /erp/referrals/{id}/withdraw"
        actor: Employee
        preconditions: ["X-User-ID == referral.referrer_id"]
        side_effects: ["campaign reservation released", "ReferralEvent appended (WITHDRAW)"]
      - from: INTERVIEWING
        to: WITHDRAWN
        trigger: "POST /erp/referrals/{id}/withdraw"
        actor: Employee
        preconditions: ["X-User-ID == referral.referrer_id"]
        side_effects: ["campaign reservation released", "ReferralEvent appended (WITHDRAW)"]
      - from: OFFER_EXTENDED
        to: WITHDRAWN
        trigger: "POST /erp/referrals/{id}/withdraw"
        actor: Employee
        preconditions: ["X-User-ID == referral.referrer_id"]
        side_effects: ["campaign reservation released", "ReferralEvent appended (WITHDRAW)"]
      - from: HIRED
        to: COMPLETED
        trigger: "system (POST /erp/_ops/evaluate sweep: now >= retention_due_at and candidate not DEPARTED)"
        actor: system
        preconditions: []
        side_effects:
          - "The RETENTION milestone transitions PENDING -> EARNED (earned_at = now)"
          - "Campaign settlement (if attached): retention uplift share (campaign_uplift_cents - hire share) moves reserved_cents -> spent_cents; if spent_cents == budget_cents the campaign auto-transitions ACTIVE -> EXHAUSTED"
          - "ReferralEvent appended (RETENTION_MET)"
      - from: HIRED
        to: RETENTION_FAILED
        trigger: "system (POST /erp/_ops/evaluate sweep: candidate DEPARTED with departed_at < retention_due_at)"
        actor: system
        preconditions: []
        side_effects:
          - "The RETENTION milestone transitions PENDING -> FORFEITED; remaining campaign reservation released"
          - "The HIRE milestone is NOT clawed back (hire bonus is earned at hire)"
          - "ReferralEvent appended (RETENTION_FAILED)"
      - from: SUBMITTED
        to: EXPIRED
        trigger: "system (POST /erp/_ops/evaluate sweep: now > submitted_at + referral_expiry_days)"
        actor: system
        preconditions: []
        side_effects: ["campaign reservation released", "ReferralEvent appended (EXPIRE)"]
      - from: UNDER_REVIEW
        to: EXPIRED
        trigger: "system (POST /erp/_ops/evaluate sweep: now > submitted_at + referral_expiry_days)"
        actor: system
        preconditions: []
        side_effects: ["campaign reservation released", "ReferralEvent appended (EXPIRE)"]
      - from: NEEDS_INFO
        to: EXPIRED
        trigger: "system (POST /erp/_ops/evaluate sweep: now > submitted_at + referral_expiry_days)"
        actor: system
        preconditions: []
        side_effects: ["campaign reservation released", "ReferralEvent appended (EXPIRE)"]
      - from: SUBMITTED
        to: FORFEITED
        trigger: "system (an AbuseCase naming this referral is confirmed)"
        actor: system
        preconditions: []
        side_effects: ["last_decision_reason = ABUSE_CONFIRMED", "milestones in {PENDING, EARNED, APPROVED, BATCHED} -> FORFEITED (BATCHED detached from batch; batch totals recompute and batch.version increments)", "campaign reservation and earned-but-unpaid uplift shares released (spent_cents reduced for earned shares)", "ReferralEvent appended (FORFEIT)"]
      - from: UNDER_REVIEW
        to: FORFEITED
        trigger: "system (an AbuseCase naming this referral is confirmed)"
        actor: system
        preconditions: []
        side_effects: ["Same cascade as SUBMITTED -> FORFEITED"]
      - from: NEEDS_INFO
        to: FORFEITED
        trigger: "system (an AbuseCase naming this referral is confirmed)"
        actor: system
        preconditions: []
        side_effects: ["Same cascade as SUBMITTED -> FORFEITED"]
      - from: QUALIFIED
        to: FORFEITED
        trigger: "system (an AbuseCase naming this referral is confirmed)"
        actor: system
        preconditions: []
        side_effects: ["Same cascade as SUBMITTED -> FORFEITED"]
      - from: SCREENING
        to: FORFEITED
        trigger: "system (an AbuseCase naming this referral is confirmed)"
        actor: system
        preconditions: []
        side_effects: ["Same cascade as SUBMITTED -> FORFEITED"]
      - from: INTERVIEWING
        to: FORFEITED
        trigger: "system (an AbuseCase naming this referral is confirmed)"
        actor: system
        preconditions: []
        side_effects: ["Same cascade as SUBMITTED -> FORFEITED"]
      - from: OFFER_EXTENDED
        to: FORFEITED
        trigger: "system (an AbuseCase naming this referral is confirmed)"
        actor: system
        preconditions: []
        side_effects: ["Same cascade as SUBMITTED -> FORFEITED"]
      - from: HIRED
        to: FORFEITED
        trigger: "system (an AbuseCase naming this referral is confirmed)"
        actor: system
        preconditions: []
        side_effects: ["Same cascade as SUBMITTED -> FORFEITED; PAID milestones remain PAID (recovery only via clawback)"]

  - entity: BonusMilestone
    initial_state: PENDING
    terminal_states: [PAID, FORFEITED, CLAWED_BACK]
    transitions:
      - from: PENDING
        to: EARNED
        trigger: "system (hire creates HIRE milestone directly in EARNED; retention sweep earns the RETENTION milestone)"
        actor: system
        preconditions: []
        side_effects: ["earned_at = now"]
      - from: EARNED
        to: APPROVED
        trigger: "POST /erp/milestones/{id}/approve"
        actor: PayrollProcessor
        preconditions:
          - "Referrer's TaxProfile exists and status == VERIFIED (ERR_TAX_PROFILE_NOT_VERIFIED otherwise)"
          - "annual_committed_cents + amount_cents <= annual_cap_cents of the referral's pinned policy (ERR_ANNUAL_CAP_EXCEEDED otherwise)"
        side_effects:
          - "withholding_cents and net_cents computed per tax_withholding (variant selected by TaxProfile.withholding_method, using ytd_paid_gross_cents + ytd_carryover_cents at this instant) and locked"
          - "approved_by_user_id set"
      - from: APPROVED
        to: BATCHED
        trigger: "POST /erp/payroll-batches/{id}/milestones"
        actor: PayrollProcessor
        preconditions:
          - "Target PayrollBatch status == OPEN (ERR_BATCH_NOT_OPEN otherwise)"
          - "Milestone not already attached to a batch (ERR_MILESTONE_NOT_BATCHABLE otherwise)"
        side_effects:
          - "payroll_batch_id set; batch totals recompute; batch.version increments"
      - from: BATCHED
        to: APPROVED
        trigger: "POST /erp/payroll-batches/{id}/milestones/{milestone_id}/remove"
        actor: PayrollProcessor
        preconditions:
          - "Batch status == OPEN (ERR_BATCH_NOT_OPEN otherwise)"
        side_effects:
          - "payroll_batch_id cleared; batch totals recompute; batch.version increments"
      - from: BATCHED
        to: PAID
        trigger: "system (POST /erp/payroll-batches/{id}/confirm-paid on its batch)"
        actor: system
        preconditions: []
        side_effects:
          - "Referrer TaxProfile.ytd_paid_gross_cents += amount_cents (calendar-year accumulator)"
      - from: EARNED
        to: FORFEITED
        trigger: "system (referrer termination, abuse confirmation, or POST /erp/milestones/{id}/forfeit)"
        actor: PayrollProcessor
        preconditions: []
        side_effects: ["Campaign earned share released from spent_cents if the referral is attached to a campaign"]
      - from: APPROVED
        to: FORFEITED
        trigger: "system (referrer termination, abuse confirmation, or POST /erp/milestones/{id}/forfeit)"
        actor: PayrollProcessor
        preconditions: []
        side_effects: ["Campaign earned share released from spent_cents if attached"]
      - from: BATCHED
        to: FORFEITED
        trigger: "system (referrer termination or abuse confirmation)"
        actor: system
        preconditions: []
        side_effects: ["Detached from batch (payroll_batch_id = null); batch totals recompute and batch.version increments", "Campaign earned share released from spent_cents if attached"]
      - from: PAID
        to: CLAWED_BACK
        trigger: "system (POST /erp/_ops/evaluate sweep: candidate DEPARTED with departed_at < clawback_until and this milestone is the RETENTION milestone)"
        actor: system
        preconditions: []
        side_effects:
          - "recovery_status = PENDING"
          - "Campaign retention share released from spent_cents if attached (may flip EXHAUSTED -> ACTIVE)"
          - "Referrer annual accumulators subtract amount_cents for the current calendar year"

  - entity: PayrollBatch
    initial_state: OPEN
    terminal_states: [CONFIRMED_PAID, CANCELLED]
    transitions:
      - from: OPEN
        to: SEALED
        trigger: "POST /erp/payroll-batches/{id}/seal"
        actor: PayrollProcessor
        preconditions: []
        side_effects: ["No further milestone add/remove allowed"]
      - from: SEALED
        to: EXPORTED
        trigger: "POST /erp/payroll-batches/{id}/export"
        actor: PayrollProcessor
        preconditions: []
        side_effects: ["Milestones exported in deterministic order: earned_at ASC, tie-break Referral.created_at ASC"]
      - from: EXPORTED
        to: CONFIRMED_PAID
        trigger: "POST /erp/payroll-batches/{id}/confirm-paid"
        actor: TalentAdmin
        preconditions: []
        side_effects:
          - "Every attached BATCHED milestone -> PAID (ytd_paid_gross_cents accumulates per employee)"
          - "Every attached CLAWED_BACK recovery line: recovery_status -> RECOVERED"
        note: "Segregation of duties: PayrollProcessor prepares/approves; TalentAdmin confirms payment"
      - from: OPEN
        to: CANCELLED
        trigger: "POST /erp/payroll-batches/{id}/cancel"
        actor: PayrollProcessor
        preconditions: []
        side_effects: ["All attached BATCHED milestones -> APPROVED (detached); recovery lines stay CLAWED_BACK with recovery_status PENDING (detached)"]

  - entity: AbuseCase
    initial_state: OPEN
    terminal_states: [CONFIRMED, DISMISSED]
    transitions:
      - from: OPEN
        to: UNDER_REVIEW
        trigger: "POST /erp/abuse-cases/{id}/start-review"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: []
      - from: OPEN
        to: CONFIRMED
        trigger: "POST /erp/abuse-cases/{id}/confirm"
        actor: ComplianceOfficer
        preconditions:
          - "deciding X-User-ID != raised_by_user_id (ERR_SOD_VIOLATION otherwise)"
        side_effects:
          - "confirmed_at = now; decided_by_user_id set"
          - "Employee.fraud_strikes += 1; risk_score recomputed; if risk_score >= 100 the employee becomes referral_suspended"
          - "If referral_id is set and the referral is non-terminal, the referral cascades to FORFEITED (see Referral FORFEITED transitions)"
      - from: UNDER_REVIEW
        to: CONFIRMED
        trigger: "POST /erp/abuse-cases/{id}/confirm"
        actor: ComplianceOfficer
        preconditions:
          - "deciding X-User-ID != raised_by_user_id (ERR_SOD_VIOLATION otherwise)"
        side_effects: ["Same cascade as OPEN -> CONFIRMED"]
      - from: OPEN
        to: DISMISSED
        trigger: "POST /erp/abuse-cases/{id}/dismiss"
        actor: ComplianceOfficer
        preconditions:
          - "deciding X-User-ID != raised_by_user_id (ERR_SOD_VIOLATION otherwise)"
        side_effects: ["decided_by_user_id set; no risk-score impact"]
      - from: UNDER_REVIEW
        to: DISMISSED
        trigger: "POST /erp/abuse-cases/{id}/dismiss"
        actor: ComplianceOfficer
        preconditions:
          - "deciding X-User-ID != raised_by_user_id (ERR_SOD_VIOLATION otherwise)"
        side_effects: ["decided_by_user_id set; no risk-score impact"]

  - entity: TaxProfile
    initial_state: SUBMITTED
    terminal_states: []
    transitions:
      - from: SUBMITTED
        to: VERIFIED
        trigger: "POST /erp/employees/{id}/tax-profile/verify"
        actor: PayrollProcessor
        preconditions: []
        side_effects: []
      - from: VERIFIED
        to: SUBMITTED
        trigger: "PUT /erp/employees/{id}/tax-profile (any update re-opens verification)"
        actor: Employee
        preconditions: []
        side_effects: ["ytd_paid_gross_cents is preserved across re-submission"]

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: campaign-patch-stale-version
    parent_entity: Campaign
    write_endpoint: "PATCH /erp/campaigns/{id}"
    occ_field: "expected_campaign_version"
    description: |
      Updating a Campaign whose version has advanced beyond the version the
      client last observed is rejected. This covers the case where another
      writer has legitimately edited the campaign (budget, window, or rates)
      since the client's read, making the client's edit basis stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: batch-add-milestone-stale-version
    parent_entity: PayrollBatch
    write_endpoint: "POST /erp/payroll-batches/{id}/milestones"
    occ_field: "expected_payroll_batch_version"
    description: |
      Attaching a milestone to a PayrollBatch whose version has advanced beyond
      the version the client last observed is rejected. Adding a milestone
      legitimately mutates the batch (totals recompute), so a client whose
      last-observed version is stale must re-read before adding.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: batch-remove-milestone-stale-version
    parent_entity: PayrollBatch
    write_endpoint: "POST /erp/payroll-batches/{id}/milestones/{milestone_id}/remove"
    occ_field: "expected_payroll_batch_version"
    description: |
      Removing a milestone from a PayrollBatch whose version has advanced
      beyond the version the client last observed is rejected; the client must
      re-read the batch and re-issue the removal against the fresh version.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: tenure_days
    trigger: "Computed on read of Employee and evaluated at referral submission"
    algorithm: chronological
    formula: |
      tenure_days = max(0, floor((now_utc - hire_date) / 86400))
      where now_utc is the logical clock.
    input_set: "The single Employee row; logical clock"
    constants:
      SECONDS_PER_DAY: 86400
    precision: "integer days, floor"

  - name: candidate_cooldown
    trigger: "Computed when last_terminal_outcome_at changes and evaluated at referral submission"
    algorithm: chronological
    formula: |
      cooldown_until = add_calendar_months(last_terminal_outcome_at, duplicate_cooldown_months)
      add_calendar_months: month arithmetic with the day clamped to the target
      month's last day (e.g. 2026-01-31 + 6 months = 2026-07-31;
      2025-08-31 + 6 months = 2026-02-28).
      A new referral is blocked iff now < cooldown_until (strict); at
      now == cooldown_until the referral is allowed.
    input_set: "The single Candidate row; pinned policy duplicate_cooldown_months; logical clock"
    constants: {}
    precision: "second precision on the resulting timestamp"

  - name: bonus_quote
    trigger: "At POST /erp/referrals submission (after all validations pass)"
    algorithm: tiered_pricing
    formula: |
      # Evaluation order is pinned (mode-c): each step reads only values
      # fixed in earlier steps.
      1. base = tier_cents(requisition.level) from the PINNED policy
         (tier_ic_cents / tier_senior_cents / tier_manager_cents /
          tier_director_cents / tier_executive_cents)
      2. campaign attachment: the candidate set is Campaign rows with
         job_requisition_id == referral.job_requisition_id AND
         status == ACTIVE AND window_start <= submitted_at <= window_end
         (closed interval). At most one such campaign can exist because
         same-requisition campaign windows may not overlap. If the set is
         empty, uplift = 0 and campaign_id = null.
      3. If a campaign is attached AND referrer.job_level != EXECUTIVE:
           raw_uplift = round_half_up(base * multiplier_bps / 10000) - base
                        + flat_addon_cents
           uplift = min(raw_uplift, budget_cents - reserved_cents - spent_cents)
         If referrer.job_level == EXECUTIVE: uplift = 0 (executives earn the
         base tier only; campaign still attaches and counts payouts_count).
      4. If campaign attaches and uplift == 0 because remaining budget was 0,
         the referral still attaches (campaign_id set, campaign_uplift_cents 0).
      5. provisional_cap_remaining = annual_cap_cents
           - referrer.annual_provisional_cents   (evaluated BEFORE this bonus)
      6. bonus_total_cents = min(base + uplift, provisional_cap_remaining),
         floored at 0.
    input_set: "Requisition, pinned PolicyVersion, optional Campaign, referrer Employee annual accumulator"
    constants: {}
    precision: "integer cents; round_half_up at the single marked rounding point in step 3"
    variants:
      - name: with_campaign
        when: "An ACTIVE campaign covers the requisition at submitted_at"
        difference: "uplift computed and clipped against campaign remaining budget"
      - name: without_campaign
        when: "No ACTIVE campaign covers the requisition"
        difference: "uplift = 0; bonus_total_cents = min(base, provisional_cap_remaining)"

  - name: milestone_split
    trigger: "At Referral -> HIRED (creates both milestones)"
    algorithm: waterfall_allocation
    formula: |
      hire_amount     = round_half_up(bonus_total_cents * hire_pct / 100)
      retention_amount = bonus_total_cents - hire_amount
      # Rounding order is pinned (mode-b): HIRE is rounded FIRST; RETENTION is
      # the remainder so hire + retention == bonus_total_cents exactly.
      Campaign uplift shares split with the same pinned order:
      hire_uplift_share     = round_half_up(campaign_uplift_cents * hire_pct / 100)
      retention_uplift_share = campaign_uplift_cents - hire_uplift_share
    input_set: "The Referral row (bonus_total_cents, campaign_uplift_cents) and pinned policy hire_pct"
    constants: {}
    precision: "integer cents; round_half_up; retention absorbs rounding"

  - name: tax_withholding
    trigger: "At BonusMilestone EARNED -> APPROVED (locked at that instant)"
    algorithm: tiered_pricing
    formula: |
      # Variant selected by the referrer's TaxProfile.withholding_method.
      # base_ytd = tax_profile.ytd_carryover_cents + tax_profile.ytd_paid_gross_cents
      # (evaluated at the approve instant — approval ORDER matters).
      FLAT:
        rate_bps = tax_profile.supplemental_rate_bps if not null else 2200
        withholding_cents = round_half_up(amount_cents * rate_bps / 10000)
      AGGREGATE (progressive bracket over cumulative referral wages):
        bracket_tax(x) =
            15% of x                    for 0      <= x <  500000
          ; 75000 + 25% of (x - 500000) for 500000 <= x < 1500000
          ; 325000 + 35% of (x - 1500000) for x >= 1500000
        withholding_cents = bracket_tax(base_ytd + amount_cents)
                            - bracket_tax(base_ytd)
      net_cents = amount_cents - withholding_cents
    input_set: "The BonusMilestone row and the referrer's TaxProfile"
    constants:
      FLAT_RATE_BPS: 2200
      BRACKET_1_LIMIT: 500000
      BRACKET_1_BPS: 1500
      BRACKET_2_LIMIT: 1500000
      BRACKET_2_BPS: 2500
      BRACKET_3_BPS: 3500
    precision: "integer cents; round_half_up; bracket boundary membership as shown (lower bound inclusive)"
    variants:
      - name: flat
        when: "TaxProfile.withholding_method == FLAT"
        difference: "Constant proportional rate; independent of ytd"
      - name: aggregate
        when: "TaxProfile.withholding_method == AGGREGATE"
        difference: "Marginal bracket on cumulative ytd; same amount yields different withholding depending on ytd and on approval order"

  - name: annual_cap_accumulators
    trigger: "Recomputed on any BonusMilestone status change and read at submission (provisional) and approve (committed)"
    algorithm: aggregation
    formula: |
      Let M = the referrer's BonusMilestones whose earned_at falls in the
      calendar year of now (inclusive of Jan 1 00:00:00, exclusive of next
      Jan 1 00:00:00), joined via Referral.referrer_id.
      annual_provisional_cents =
          sum(amount_cents for m in M if m.status in {EARNED, APPROVED, BATCHED, PAID})
        - sum(amount_cents for m in M if m.status == CLAWED_BACK)
      annual_committed_cents =
          sum(amount_cents for m in M if m.status in {APPROVED, BATCHED, PAID})
        - sum(amount_cents for m in M if m.status == CLAWED_BACK)
      FORFEITED milestones contribute 0 to both.
    input_set: "All BonusMilestones joined through Referral to the referrer, filtered by earned_at calendar year and status sets above"
    constants: {}
    precision: "integer cents"

  - name: campaign_settlement
    trigger: "At referral submission (reserve), milestone earn (convert), referral terminal (release), milestone forfeit/clawback (release earned share), campaign end (release outstanding)"
    algorithm: waterfall_allocation
    formula: |
      reserve(submission):  reserved_cents += campaign_uplift_cents
      convert(earn):        reserved_cents -= share; spent_cents += share
                            (share = hire_uplift_share at HIRE earn,
                             retention_uplift_share at RETENTION earn)
      release(terminal):    reserved_cents -= (campaign_uplift_cents - uplift_spent_cents)
      release(forfeit of EARNED/APPROVED/BATCHED): spent_cents -= share_already_converted
      release(clawback):    spent_cents -= retention_uplift_share
      INVARIANT (pinned): reserved_cents + spent_cents + remaining_cents
                          == budget_cents at all times,
                          remaining_cents = budget_cents - reserved_cents - spent_cents,
                          and all three are >= 0.
      EXHAUSTED iff spent_cents == budget_cents (auto from ACTIVE);
      back to ACTIVE iff spent_cents < budget_cents (auto from EXHAUSTED).
    input_set: "The Campaign row and the referral's campaign_uplift_cents / uplift_spent_cents"
    constants: {}
    precision: "integer cents"

  - name: fraud_risk_score
    trigger: "Recomputed on AbuseCase confirm and on read of Employee"
    algorithm: decay_function
    formula: |
      weight(case_type) = SELF_REFERRAL 40 | VELOCITY 25 | DUPLICATE_RING 35
                          | RESUME_FARM 50 | MANUAL 20
      For each CONFIRMED case of the employee:
        contribution = weight * 0.5 ^ (floor((now - confirmed_at)/86400) / 180)
                       where the division by 180 is real division of full days
      risk_score = min(500, round_half_up(sum(contributions)))
      referral_suspended = (risk_score >= 100)
    input_set: "Employee's AbuseCases with status == CONFIRMED; logical clock"
    constants:
      SUSPEND_THRESHOLD: 100
      SCORE_CAP: 500
      HALFLIFE_DAYS: 180
    precision: "score rounded half-up to integer after summation"

  - name: referral_velocity
    trigger: "Evaluated at every successful POST /erp/referrals"
    algorithm: threshold
    formula: |
      n = count of the referrer's referrals with submitted_at in
          [now - 7*86400, now]  (closed window, inclusive both ends)
      If n >= velocity_limit (of the ACTIVE policy at evaluation time):
        auto-raise AbuseCase(case_type=VELOCITY, raised_by_user_id='system')
        naming the new referral. The submission itself still succeeds.
    input_set: "The referrer's Referral rows by submitted_at; ACTIVE policy velocity_limit"
    constants:
      VELOCITY_WINDOW_DAYS: 7
    precision: "integer count; >= boundary"

  - name: source_quality
    trigger: "On read of GET /erp/analytics/source-quality"
    algorithm: aggregation
    formula: |
      Group Referral rows by the requested dimension
      (REFERRER_LEVEL = referrer.job_level | REQ_DEPARTMENT = requisition.department
       | CAMPAIGN = campaign attached or not), counting only referrals with
      submitted_at in [window_start, window_end] (inclusive both ends;
      defaults: window_start = -infinity, window_end = now).
      Per group:
        submissions       = count(referrals)
        hires             = count(referrals ever reaching HIRED/COMPLETED/RETENTION_FAILED)
        retention_met     = count(status == COMPLETED)
        hire_rate_raw     = hires / submissions            (0 when submissions == 0)
        hire_rate_adjusted = (hires + 5) / (submissions + 10)
        low_confidence    = submissions < 10
        total_bonus_paid_cents = sum of PAID milestone amounts of the group's referrals
      Groups with submissions == 0 are omitted from the output.
    input_set: "All Referral rows in the submitted_at window, with their milestones"
    constants:
      SMOOTHING_K: 5
      LOW_CONFIDENCE_MIN: 10
    precision: "rates as decimal fractions rounded half-up to 6 decimal places"
    variants:
      - name: raw
        when: "hire_rate_raw field"
        difference: "Unsmoothed hires/submissions"
      - name: adjusted
        when: "hire_rate_adjusted field"
        difference: "Beta-smoothed (hires+K)/(submissions+2K) with K=5; diverges from raw most at small samples"

  - name: duplicate_ring_detection
    trigger: "Evaluated at every successful POST /erp/referrals"
    algorithm: aggregation
    formula: |
      distinct_referrers = count(distinct referrer_id) over non-terminal
        referrals for the same candidate with submitted_at in [now - 90d, now]
      If distinct_referrers >= 3: auto-raise AbuseCase(case_type=DUPLICATE_RING,
        raised_by_user_id='system') on the newest referral's referrer.
    input_set: "Non-terminal referrals for the candidate within the rolling 90-day window"
    constants:
      RING_WINDOW_DAYS: 90
      RING_MIN_REFERRERS: 3
    precision: "integer count; >= boundary"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present; role recognized", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: business_constraint, check: "Request body shape: required fields present, types valid, enum values in range, openings >= 1, dates parseable", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all" }
  - { priority: 3, category: business_constraint, check: "Enum fields carry a declared member (job_level, level, case_type, filing_status, withholding_method, to_state, reason_code)", error_id: ERR_INVALID_ENUM, http_status: 400, applies_to: "all" }
  - { priority: 4, category: auth, check: "Role is listed in the endpoint's roles", error_id: ERR_FORBIDDEN, http_status: 403, applies_to: "all" }
  - { priority: 5, category: auth, check: "Ownership: Employee role may only act as/on behalf of itself (referrer_id == X-User-ID on submit; withdraw/tax-profile/own-referral reads scoped to self)", error_id: ERR_FORBIDDEN, http_status: 403, applies_to: "POST /erp/referrals, POST /erp/referrals/{id}/withdraw, PUT /erp/employees/{id}/tax-profile, GET /erp/employees/{id}/referrals, GET /erp/referrals/{id}" }
  - { priority: 6, category: existence, check: "Path-templated resources exist, validated left-to-right (employee, candidate, requisition, policy, campaign, referral, milestone, batch, case)", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all" }
  - { priority: 7, category: state, check: "Target resource is in a state from which the requested transition exists (non-terminal invalid from-state)", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all action endpoints" }
  - { priority: 7, category: state, check: "Target resource is in a terminal state; every transition is rejected", error_id: ERR_ALREADY_TERMINAL, http_status: 409, applies_to: "all action endpoints" }
  - { priority: 8, category: state, check: "Requisition status == OPEN at referral submission", error_id: ERR_REQUISITION_NOT_OPEN, http_status: 409, applies_to: "POST /erp/referrals" }
  - { priority: 9, category: state, check: "OCC: expected_*_version matches the parent's current version", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "PATCH /erp/campaigns/{id}, POST /erp/payroll-batches/{id}/milestones, POST /erp/payroll-batches/{id}/milestones/{milestone_id}/remove" }
  - { priority: 10, category: business_safety, check: "Abuse decision maker is not the case raiser (decided X-User-ID != raised_by_user_id)", error_id: ERR_SOD_VIOLATION, http_status: 403, applies_to: "POST /erp/abuse-cases/{id}/confirm, POST /erp/abuse-cases/{id}/dismiss" }
  - { priority: 11, category: business_safety, check: "Referrer is not referral_suspended (risk_score >= 100)", error_id: ERR_REFERRER_SUSPENDED, http_status: 422, applies_to: "POST /erp/referrals" }
  - { priority: 12, category: business_safety, check: "Candidate normalized_email != referrer's normalized email (self-referral); on failure the submission is rejected AND an auto AbuseCase(SELF_REFERRAL, raised_by='system') naming the referrer is created", error_id: ERR_SELF_REFERRAL, http_status: 422, applies_to: "POST /erp/referrals" }
  - { priority: 13, category: business_referential, check: "Candidate not in cooldown: candidate.cooldown_until is null or now >= cooldown_until; also candidate.global_status != HIRED (hired candidates are permanently blocked from new referrals)", error_id: ERR_CANDIDATE_IN_COOLDOWN, http_status: 422, applies_to: "POST /erp/referrals" }
  - { priority: 14, category: business_referential, check: "No duplicate: no other referral exists with the same candidate_id AND same job_requisition_id in a non-terminal status", error_id: ERR_DUPLICATE_REFERRAL, http_status: 409, applies_to: "POST /erp/referrals" }
  - { priority: 15, category: business_constraint, check: "Referrer employment_status == ACTIVE (TERMINATED referrers cannot submit)", error_id: ERR_REFERRER_NOT_ACTIVE, http_status: 422, applies_to: "POST /erp/referrals" }
  - { priority: 16, category: business_constraint, check: "Referrer tenure_days >= min_tenure_days of the ACTIVE policy", error_id: ERR_REFERRER_INELIGIBLE_TENURE, http_status: 422, applies_to: "POST /erp/referrals" }
  - { priority: 17, category: business_constraint, check: "Referrer exclusion: not (is_recruiter AND requisition.department == referrer.department) and not (job_level in {MANAGER, DIRECTOR, EXECUTIVE} AND requisition.department == referrer.department)", error_id: ERR_REFERRER_EXCLUDED, http_status: 422, applies_to: "POST /erp/referrals" }
  - { priority: 18, category: business_constraint, check: "Requisition.referral_eligible == true", error_id: ERR_ROLE_NOT_REFERRAL_ELIGIBLE, http_status: 422, applies_to: "POST /erp/referrals" }
  - { priority: 19, category: business_constraint, check: "An ACTIVE PolicyVersion exists to pin", error_id: ERR_NO_ACTIVE_POLICY, http_status: 422, applies_to: "POST /erp/referrals, POST /erp/campaigns/{id}/activate" }
  - { priority: 20, category: business_temporal, check: "Policy window overlap: a new/activating PolicyVersion's [effective_from, effective_to) must not overlap another DRAFT/ACTIVE policy's window; half-open semantics: touching endpoints do NOT overlap", error_id: ERR_POLICY_WINDOW_CONFLICT, http_status: 409, applies_to: "POST /erp/policy-versions, POST /erp/policy-versions/{id}/activate" }
  - { priority: 21, category: business_temporal, check: "Campaign window overlap: for the same job_requisition_id, [window_start, window_end] must not overlap another campaign in DRAFT/ACTIVE/PAUSED/EXHAUSTED; CLOSED semantics: touching endpoints DO overlap", error_id: ERR_CAMPAIGN_WINDOW_CONFLICT, http_status: 409, applies_to: "POST /erp/campaigns, PATCH /erp/campaigns/{id}" }
  - { priority: 22, category: business_temporal, check: "Campaign window not already elapsed on activation (window_end >= now)", error_id: ERR_CAMPAIGN_WINDOW_EXPIRED, http_status: 422, applies_to: "POST /erp/campaigns/{id}/activate" }
  - { priority: 23, category: business_temporal, check: "hire_date <= now on the hire action", error_id: ERR_HIRE_DATE_IN_FUTURE, http_status: 422, applies_to: "POST /erp/referrals/{id}/hire" }
  - { priority: 24, category: business_fiscal, check: "Campaign budget floor on edit: new budget_cents >= reserved_cents + spent_cents", error_id: ERR_CAMPAIGN_BUDGET_EXCEEDED, http_status: 422, applies_to: "PATCH /erp/campaigns/{id}" }
  - { priority: 25, category: business_fiscal, check: "Annual cap at approve: referrer.annual_committed_cents + amount_cents <= annual_cap_cents (pinned policy)", error_id: ERR_ANNUAL_CAP_EXCEEDED, http_status: 422, applies_to: "POST /erp/milestones/{id}/approve" }
  - { priority: 26, category: business_referential, check: "Milestone approve gate: referrer's TaxProfile exists with status == VERIFIED", error_id: ERR_TAX_PROFILE_NOT_VERIFIED, http_status: 422, applies_to: "POST /erp/milestones/{id}/approve" }
  - { priority: 27, category: state, check: "Payroll batch is OPEN for add/remove/cancel; milestone attachable only from APPROVED (positive) or CLAWED_BACK with recovery_status PENDING (recovery line)", error_id: ERR_BATCH_NOT_OPEN, http_status: 409, applies_to: "POST /erp/payroll-batches/{id}/milestones, POST /erp/payroll-batches/{id}/milestones/{milestone_id}/remove" }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- test-driving / ops ---
  - { method: POST, path: "/erp/_clock/set_current_utc", description: "Set the logical clock. Startup default is exactly 2026-08-01T00:00:00Z; before any set call the clock reads this default and never falls back to wall-clock time.", roles: [PlatformAdmin], code: 200, input: ["to_iso8601"], output: { now_iso8601: string }, side_effects: ["Logical clock advanced (monotone not required; tests may move backward)"] }
  - { method: POST, path: "/erp/_ops/evaluate", description: "Operations sweep against the logical clock: earns due RETENTION milestones (Referral HIRED -> COMPLETED), fails retention for departed hires (HIRED -> RETENTION_FAILED), claws back PAID retention milestones within the clawback window, expires stale SUBMITTED/UNDER_REVIEW/NEEDS_INFO referrals, ends campaigns whose window_end < now.", roles: [TalentAdmin], code: 200, output: { retention_earned: integer, retention_failed: integer, clawed_back: integer, expired: integer, campaigns_ended: integer }, side_effects: ["All sweep transitions with their cascades"] }

  # --- Employee ---
  - { method: POST, path: "/erp/employees", description: "Create an employee", roles: [PlatformAdmin], code: 201, input: ["employee_number", "full_name", "email", "department", "job_level", "hire_date", "is_recruiter?"], output: Employee, side_effects: [] }
  - { method: GET, path: "/erp/employees", description: "List employees", roles: [PlatformAdmin, TalentAdmin, Recruiter, HiringManager, PayrollProcessor, ComplianceOfficer, Employee], code: 200, input: ["department?", "job_level?", "employment_status?", "limit?", "offset?"], output: "Employee[]", side_effects: [] }
  - { method: GET, path: "/erp/employees/{id}", description: "Get one employee (computed fields included)", roles: [PlatformAdmin, TalentAdmin, Recruiter, HiringManager, PayrollProcessor, ComplianceOfficer, Employee], code: 200, input: [], output: Employee, side_effects: [] }
  - { method: POST, path: "/erp/employees/{id}/terminate", description: "Terminate an employee; forfeits unpaid milestones (cascade)", roles: [PlatformAdmin], code: 200, input: [], output: Employee, side_effects: ["Milestone forfeiture cascade; campaign settlement releases"] }
  - { method: PUT, path: "/erp/employees/{id}/tax-profile", description: "Create-or-update (upsert) the employee's 1:1 TaxProfile; any update resets status to SUBMITTED", roles: [Employee, PayrollProcessor], code: 200, input: ["filing_status", "withholding_method", "supplemental_rate_bps?", "ytd_carryover_cents?"], output: TaxProfile, side_effects: ["On update of a VERIFIED profile: status -> SUBMITTED (ytd_paid_gross_cents preserved)"] }
  - { method: POST, path: "/erp/employees/{id}/tax-profile/verify", description: "Verify a submitted tax profile", roles: [PayrollProcessor], code: 200, input: [], output: TaxProfile, side_effects: [] }
  - { method: GET, path: "/erp/employees/{id}/tax-profile", description: "Get the employee's tax profile (array of 0..1)", roles: [Employee, PayrollProcessor, TalentAdmin], code: 200, input: [], output: "TaxProfile[]", side_effects: [] }
  - { method: GET, path: "/erp/employees/{id}/referrals", description: "List referrals submitted by this employee", roles: [PlatformAdmin, TalentAdmin, Recruiter, HiringManager, PayrollProcessor, ComplianceOfficer, Employee], code: 200, input: ["status?", "limit?", "offset?"], output: "Referral[]", side_effects: [] }
  - { method: GET, path: "/erp/employees/{id}/abuse-cases", description: "List abuse cases naming this employee", roles: [PlatformAdmin, TalentAdmin, ComplianceOfficer], code: 200, input: ["status?", "limit?", "offset?"], output: "AbuseCase[]", side_effects: [] }

  # --- Candidate ---
  - { method: POST, path: "/erp/candidates", description: "Register a candidate (records prior direct application when prior_application_at given)", roles: [Recruiter, TalentAdmin], code: 201, input: ["full_name", "email", "phone?", "prior_application_at?"], output: Candidate, side_effects: ["last_terminal_outcome_at = prior_application_at when provided; cooldown_until computed"] }
  - { method: GET, path: "/erp/candidates", description: "List candidates", roles: [PlatformAdmin, TalentAdmin, Recruiter, HiringManager, PayrollProcessor, ComplianceOfficer], code: 200, input: ["global_status?", "hired_via_referral_id?", "limit?", "offset?"], output: "Candidate[]", side_effects: [] }
  - { method: GET, path: "/erp/candidates/{id}", description: "Get one candidate", roles: [PlatformAdmin, TalentAdmin, Recruiter, HiringManager, PayrollProcessor, ComplianceOfficer], code: 200, input: [], output: Candidate, side_effects: [] }
  - { method: GET, path: "/erp/candidates/{id}/referrals", description: "List referrals for this candidate", roles: [PlatformAdmin, TalentAdmin, Recruiter, HiringManager, ComplianceOfficer], code: 200, input: ["status?", "limit?", "offset?"], output: "Referral[]", side_effects: [] }
  - { method: POST, path: "/erp/candidates/{id}/record-departure", description: "Record that a hired candidate left the company", roles: [Recruiter, TalentAdmin], code: 200, input: ["terminated_at"], output: Candidate, side_effects: ["global_status HIRED -> DEPARTED; departed_at set"] }

  # --- JobRequisition ---
  - { method: POST, path: "/erp/job-requisitions", description: "Create a requisition (starts DRAFT)", roles: [TalentAdmin], code: 201, input: ["req_number", "title", "department", "level", "referral_eligible?", "hard_to_fill?", "openings?"], output: JobRequisition, side_effects: [] }
  - { method: GET, path: "/erp/job-requisitions", description: "List requisitions", roles: [PlatformAdmin, TalentAdmin, Recruiter, HiringManager, PayrollProcessor, ComplianceOfficer, Employee], code: 200, input: ["status?", "department?", "level?", "filled_by_candidate_id?", "limit?", "offset?"], output: "JobRequisition[]", side_effects: [] }
  - { method: GET, path: "/erp/job-requisitions/{id}", description: "Get one requisition", roles: [PlatformAdmin, TalentAdmin, Recruiter, HiringManager, PayrollProcessor, ComplianceOfficer, Employee], code: 200, input: [], output: JobRequisition, side_effects: [] }
  - { method: POST, path: "/erp/job-requisitions/{id}/open", description: "Open a DRAFT requisition", roles: [TalentAdmin], code: 200, input: [], output: JobRequisition, side_effects: ["opened_at = now"] }
  - { method: POST, path: "/erp/job-requisitions/{id}/pause", description: "Pause an OPEN requisition", roles: [TalentAdmin], code: 200, input: [], output: JobRequisition, side_effects: [] }
  - { method: POST, path: "/erp/job-requisitions/{id}/resume", description: "Resume a PAUSED requisition", roles: [TalentAdmin], code: 200, input: [], output: JobRequisition, side_effects: [] }
  - { method: POST, path: "/erp/job-requisitions/{id}/cancel", description: "Cancel a DRAFT/OPEN/PAUSED requisition; NOT_SELECTs its non-terminal referrals", roles: [TalentAdmin], code: 200, input: [], output: JobRequisition, side_effects: ["Referral NOT_SELECTED cascade with campaign reservation release"] }
  - { method: GET, path: "/erp/job-requisitions/{id}/referrals", description: "List referrals for this requisition", roles: [PlatformAdmin, TalentAdmin, Recruiter, HiringManager, ComplianceOfficer], code: 200, input: ["status?", "limit?", "offset?"], output: "Referral[]", side_effects: [] }
  - { method: GET, path: "/erp/job-requisitions/{id}/campaigns", description: "List campaigns covering this requisition", roles: [PlatformAdmin, TalentAdmin, Recruiter, HiringManager, ComplianceOfficer], code: 200, input: ["status?", "limit?", "offset?"], output: "Campaign[]", side_effects: [] }

  # --- PolicyVersion ---
  - { method: POST, path: "/erp/policy-versions", description: "Create a policy version (DRAFT); omitted rule fields take the documented defaults", roles: [TalentAdmin], code: 201, input: ["effective_from", "effective_to?", "min_tenure_days?", "duplicate_cooldown_months?", "referral_expiry_days?", "hire_pct?", "retention_days?", "clawback_days?", "annual_cap_cents?", "velocity_limit?", "tier_ic_cents?", "tier_senior_cents?", "tier_manager_cents?", "tier_director_cents?", "tier_executive_cents?", "note?"], output: PolicyVersion, side_effects: [] }
  - { method: GET, path: "/erp/policy-versions", description: "List policy versions", roles: [PlatformAdmin, TalentAdmin, Recruiter, HiringManager, PayrollProcessor, ComplianceOfficer], code: 200, input: ["status?", "limit?", "offset?"], output: "PolicyVersion[]", side_effects: [] }
  - { method: GET, path: "/erp/policy-versions/{id}", description: "Get one policy version", roles: [PlatformAdmin, TalentAdmin, Recruiter, HiringManager, PayrollProcessor, ComplianceOfficer], code: 200, input: [], output: PolicyVersion, side_effects: [] }
  - { method: POST, path: "/erp/policy-versions/{id}/activate", description: "Activate a DRAFT policy; supersedes the currently ACTIVE one", roles: [TalentAdmin], code: 200, input: [], output: PolicyVersion, side_effects: ["Previous ACTIVE policy -> SUPERSEDED"] }
  - { method: POST, path: "/erp/policy-versions/{id}/retire", description: "Retire a DRAFT policy", roles: [TalentAdmin], code: 200, input: [], output: PolicyVersion, side_effects: [] }

  # --- Campaign ---
  - { method: POST, path: "/erp/campaigns", description: "Create a campaign (DRAFT); closed-window overlap check against same-requisition campaigns", roles: [TalentAdmin], code: 201, input: ["name", "job_requisition_id", "multiplier_bps", "flat_addon_cents", "window_start", "window_end", "budget_cents", "max_payouts?"], output: Campaign, side_effects: [] }
  - { method: GET, path: "/erp/campaigns", description: "List campaigns", roles: [PlatformAdmin, TalentAdmin, Recruiter, HiringManager, PayrollProcessor, ComplianceOfficer], code: 200, input: ["status?", "job_requisition_id?", "limit?", "offset?"], output: "Campaign[]", side_effects: [] }
  - { method: GET, path: "/erp/campaigns/{id}", description: "Get one campaign", roles: [PlatformAdmin, TalentAdmin, Recruiter, HiringManager, PayrollProcessor, ComplianceOfficer], code: 200, input: [], output: Campaign, side_effects: [] }
  - { method: PATCH, path: "/erp/campaigns/{id}", description: "Edit a DRAFT/ACTIVE/PAUSED campaign (OCC-guarded); budget may not drop below reserved+spent; window edits re-run the overlap check", roles: [TalentAdmin], code: 200, input: ["expected_campaign_version", "name?", "multiplier_bps?", "flat_addon_cents?", "window_start?", "window_end?", "budget_cents?", "max_payouts?"], output: Campaign, side_effects: ["increments Campaign.version by 1"] }
  - { method: POST, path: "/erp/campaigns/{id}/activate", description: "Activate a DRAFT or PAUSED campaign", roles: [TalentAdmin], code: 200, input: [], output: Campaign, side_effects: [] }
  - { method: POST, path: "/erp/campaigns/{id}/pause", description: "Pause an ACTIVE campaign", roles: [TalentAdmin], code: 200, input: [], output: Campaign, side_effects: [] }
  - { method: POST, path: "/erp/campaigns/{id}/end", description: "End (cancel) a campaign from any non-terminal state; releases outstanding reservations", roles: [TalentAdmin], code: 200, input: [], output: Campaign, side_effects: ["Reservation release cascade"] }

  # --- Referral ---
  - { method: POST, path: "/erp/referrals", description: "Submit a referral. Identify the candidate by candidate_id OR by candidate_email (matched on normalized_email; created when unknown). Pins the ACTIVE policy, attaches a covering ACTIVE campaign, computes the bonus quote.", roles: [Employee, Recruiter], code: 201, input: ["referrer_id", "job_requisition_id", "candidate_id?", "candidate_email?", "candidate_full_name?", "candidate_phone?", "note?"], output: Referral, side_effects: ["Candidate created/matched; candidate AVAILABLE -> IN_PROCESS; campaign reserve; velocity/duplicate-ring auto-cases; policy pinned; bonus quote computed; ReferralEvent(SUBMIT)"] }
  - { method: GET, path: "/erp/referrals", description: "List referrals with filters (Employee role sees only own)", roles: [PlatformAdmin, TalentAdmin, Recruiter, HiringManager, PayrollProcessor, ComplianceOfficer, Employee], code: 200, input: ["status?", "referrer_id?", "candidate_id?", "job_requisition_id?", "campaign_id?", "policy_version_id?", "limit?", "offset?"], output: "Referral[]", side_effects: [] }
  - { method: GET, path: "/erp/referrals/{id}", description: "Get one referral", roles: [PlatformAdmin, TalentAdmin, Recruiter, HiringManager, PayrollProcessor, ComplianceOfficer, Employee], code: 200, input: [], output: Referral, side_effects: [] }
  - { method: POST, path: "/erp/referrals/{id}/review", description: "Move SUBMITTED -> UNDER_REVIEW", roles: [Recruiter], code: 200, input: [], output: Referral, side_effects: ["ReferralEvent(REVIEW)"] }
  - { method: POST, path: "/erp/referrals/{id}/request-info", description: "Move UNDER_REVIEW -> NEEDS_INFO", roles: [Recruiter], code: 200, input: ["note?"], output: Referral, side_effects: ["ReferralEvent(REQUEST_INFO)"] }
  - { method: POST, path: "/erp/referrals/{id}/provide-info", description: "Move NEEDS_INFO -> UNDER_REVIEW", roles: [Recruiter, Employee], code: 200, input: ["note?"], output: Referral, side_effects: ["ReferralEvent(PROVIDE_INFO)"] }
  - { method: POST, path: "/erp/referrals/{id}/qualify", description: "Move UNDER_REVIEW -> QUALIFIED", roles: [Recruiter], code: 200, input: [], output: Referral, side_effects: ["ReferralEvent(QUALIFY)"] }
  - { method: POST, path: "/erp/referrals/{id}/reject", description: "Move UNDER_REVIEW -> REJECTED_DUPLICATE / REJECTED_PRIOR_CANDIDATE / REJECTED_OTHER by reason_code", roles: [Recruiter], code: 200, input: ["reason_code", "note?"], output: Referral, side_effects: ["Reservation release; ReferralEvent(REJECT)"] }
  - { method: POST, path: "/erp/referrals/{id}/advance", description: "Advance through hiring stages: QUALIFIED->SCREENING->INTERVIEWING->OFFER_EXTENDED", roles: [Recruiter, HiringManager], code: 200, input: ["to_state", "note?"], output: Referral, side_effects: ["ReferralEvent(ADVANCE)"] }
  - { method: POST, path: "/erp/referrals/{id}/offer-declined", description: "Move OFFER_EXTENDED -> INTERVIEWING (declined offer loop)", roles: [Recruiter, HiringManager], code: 200, input: ["note?"], output: Referral, side_effects: ["ReferralEvent(OFFER_DECLINED)"] }
  - { method: POST, path: "/erp/referrals/{id}/hire", description: "Move OFFER_EXTENDED -> HIRED; creates milestones, settles campaign hire share, may fill the requisition", roles: [HiringManager], code: 200, input: ["hire_date", "note?"], output: Referral, side_effects: ["Candidate -> HIRED; requisition filled_count += 1 (maybe FILLED with sibling NOT_SELECTED cascade); milestones created; campaign settlement; ReferralEvent(HIRE)"] }
  - { method: POST, path: "/erp/referrals/{id}/not-selected", description: "Move QUALIFIED/SCREENING/INTERVIEWING/OFFER_EXTENDED -> NOT_SELECTED", roles: [Recruiter, HiringManager], code: 200, input: ["note?"], output: Referral, side_effects: ["Reservation release; ReferralEvent(NOT_SELECTED)"] }
  - { method: POST, path: "/erp/referrals/{id}/withdraw", description: "Referrer withdraws an in-flight referral (any non-terminal state before HIRED)", roles: [Employee], code: 200, input: ["note?"], output: Referral, side_effects: ["Reservation release; ReferralEvent(WITHDRAW)"] }
  - { method: GET, path: "/erp/referrals/{id}/milestones", description: "List the referral's bonus milestones", roles: [PlatformAdmin, TalentAdmin, Recruiter, HiringManager, PayrollProcessor, ComplianceOfficer, Employee], code: 200, input: [], output: "BonusMilestone[]", side_effects: [] }
  - { method: GET, path: "/erp/referrals/{id}/events", description: "List the referral's append-only event log", roles: [PlatformAdmin, TalentAdmin, Recruiter, HiringManager, PayrollProcessor, ComplianceOfficer, Employee], code: 200, input: ["limit?", "offset?"], output: "ReferralEvent[]", side_effects: [] }

  # --- BonusMilestone ---
  - { method: GET, path: "/erp/milestones", description: "List milestones with filters", roles: [PlatformAdmin, TalentAdmin, Recruiter, PayrollProcessor, ComplianceOfficer], code: 200, input: ["referral_id?", "payroll_batch_id?", "status?", "kind?", "limit?", "offset?"], output: "BonusMilestone[]", side_effects: [] }
  - { method: GET, path: "/erp/milestones/{id}", description: "Get one milestone", roles: [PlatformAdmin, TalentAdmin, Recruiter, PayrollProcessor, ComplianceOfficer], code: 200, input: [], output: BonusMilestone, side_effects: [] }
  - { method: POST, path: "/erp/milestones/{id}/approve", description: "Approve an EARNED milestone; locks withholding per the referrer's tax profile; enforces annual cap", roles: [PayrollProcessor], code: 200, input: [], output: BonusMilestone, side_effects: ["withholding_cents/net_cents computed and locked; approved_by_user_id set"] }
  - { method: POST, path: "/erp/milestones/{id}/forfeit", description: "Manually forfeit an EARNED or APPROVED milestone", roles: [PayrollProcessor, ComplianceOfficer], code: 200, input: ["reason"], output: BonusMilestone, side_effects: ["Campaign earned share release"] }

  # --- PayrollBatch ---
  - { method: POST, path: "/erp/payroll-batches", description: "Create a payroll batch (OPEN)", roles: [PayrollProcessor], code: 201, input: ["period_label"], output: PayrollBatch, side_effects: [] }
  - { method: GET, path: "/erp/payroll-batches", description: "List payroll batches", roles: [PlatformAdmin, TalentAdmin, PayrollProcessor], code: 200, input: ["status?", "limit?", "offset?"], output: "PayrollBatch[]", side_effects: [] }
  - { method: GET, path: "/erp/payroll-batches/{id}", description: "Get one payroll batch", roles: [PlatformAdmin, TalentAdmin, PayrollProcessor], code: 200, input: [], output: PayrollBatch, side_effects: [] }
  - { method: POST, path: "/erp/payroll-batches/{id}/milestones", description: "Attach an APPROVED milestone (payout line) or a CLAWED_BACK milestone with recovery PENDING (negative recovery line) to an OPEN batch (OCC-guarded)", roles: [PayrollProcessor], code: 200, input: ["milestone_id", "expected_payroll_batch_version"], output: PayrollBatch, side_effects: ["Milestone APPROVED -> BATCHED (or recovery line attached); totals recompute; increments PayrollBatch.version by 1"] }
  - { method: POST, path: "/erp/payroll-batches/{id}/milestones/{milestone_id}/remove", description: "Detach a milestone from an OPEN batch (OCC-guarded)", roles: [PayrollProcessor], code: 200, input: ["expected_payroll_batch_version"], output: PayrollBatch, side_effects: ["Milestone BATCHED -> APPROVED (recovery lines detach unchanged); totals recompute; increments PayrollBatch.version by 1"] }
  - { method: POST, path: "/erp/payroll-batches/{id}/seal", description: "Seal an OPEN batch", roles: [PayrollProcessor], code: 200, input: [], output: PayrollBatch, side_effects: [] }
  - { method: POST, path: "/erp/payroll-batches/{id}/export", description: "Export a SEALED batch (deterministic milestone order: earned_at ASC, tie-break Referral.created_at ASC)", roles: [PayrollProcessor], code: 200, input: [], output: PayrollBatch, side_effects: [] }
  - { method: POST, path: "/erp/payroll-batches/{id}/confirm-paid", description: "Confirm payment of an EXPORTED batch (segregation of duties: TalentAdmin confirms what PayrollProcessor prepared)", roles: [TalentAdmin], code: 200, input: [], output: PayrollBatch, side_effects: ["BATCHED milestones -> PAID; ytd_paid_gross_cents accumulates; recovery lines -> RECOVERED"] }
  - { method: POST, path: "/erp/payroll-batches/{id}/cancel", description: "Cancel an OPEN batch; attached milestones return to APPROVED / recovery PENDING", roles: [PayrollProcessor], code: 200, input: [], output: PayrollBatch, side_effects: ["Detach cascade"] }

  # --- AbuseCase ---
  - { method: POST, path: "/erp/abuse-cases", description: "Raise an abuse case against an employee (manual); auto-cases are created by the system with raised_by_user_id='system'", roles: [Recruiter, TalentAdmin, ComplianceOfficer], code: 201, input: ["employee_id", "referral_id?", "case_type", "note?"], output: AbuseCase, side_effects: ["raised_by_user_id = X-User-ID"] }
  - { method: GET, path: "/erp/abuse-cases", description: "List abuse cases", roles: [PlatformAdmin, TalentAdmin, ComplianceOfficer], code: 200, input: ["employee_id?", "referral_id?", "status?", "case_type?", "limit?", "offset?"], output: "AbuseCase[]", side_effects: [] }
  - { method: GET, path: "/erp/abuse-cases/{id}", description: "Get one abuse case", roles: [PlatformAdmin, TalentAdmin, ComplianceOfficer], code: 200, input: [], output: AbuseCase, side_effects: [] }
  - { method: POST, path: "/erp/abuse-cases/{id}/start-review", description: "Move OPEN -> UNDER_REVIEW", roles: [ComplianceOfficer], code: 200, input: [], output: AbuseCase, side_effects: [] }
  - { method: POST, path: "/erp/abuse-cases/{id}/confirm", description: "Confirm a case: strikes, risk-score recompute, possible suspension, referral FORFEIT cascade", roles: [ComplianceOfficer], code: 200, input: ["resolution_note?"], output: AbuseCase, side_effects: ["Employee strike + risk recompute; referral FORFEITED cascade with milestone/batch/campaign settlement"] }
  - { method: POST, path: "/erp/abuse-cases/{id}/dismiss", description: "Dismiss a case (no risk impact)", roles: [ComplianceOfficer], code: 200, input: ["resolution_note?"], output: AbuseCase, side_effects: [] }

  # --- Analytics ---
  - { method: GET, path: "/erp/analytics/source-quality", description: "Source-quality analytics per source_quality calculation", roles: [TalentAdmin, Recruiter], code: 200, input: ["group_by", "window_start?", "window_end?"], output: { groups: array }, side_effects: [] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or unrecognized X-User-Role / X-User-ID headers" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, unparseable value, openings < 1, or neither candidate_id nor candidate_email supplied" }
  - { id: ERR_INVALID_ENUM, http: 400, condition: "Enum field carries an undeclared member" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not allowed on endpoint, or Employee role acting on another employee's resource" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path-templated resource does not exist (left-to-right)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Transition not defined from the resource's current (non-terminal) state" }
  - { id: ERR_ALREADY_TERMINAL, http: 409, condition: "Transition attempted from a terminal state" }
  - { id: ERR_REQUISITION_NOT_OPEN, http: 409, condition: "Referral submitted against a requisition not in OPEN" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not match the parent entity's current version" }
  - { id: ERR_SOD_VIOLATION, http: 403, condition: "ComplianceOfficer attempts to confirm/dismiss a case they raised" }
  - { id: ERR_REFERRER_SUSPENDED, http: 422, condition: "Referrer risk_score >= 100 at submission" }
  - { id: ERR_SELF_REFERRAL, http: 422, condition: "Candidate normalized email equals the referrer's; auto SELF_REFERRAL abuse case created" }
  - { id: ERR_CANDIDATE_IN_COOLDOWN, http: 422, condition: "now < candidate.cooldown_until, or candidate.global_status == HIRED" }
  - { id: ERR_DUPLICATE_REFERRAL, http: 409, condition: "Non-terminal referral already exists for the same candidate and requisition" }
  - { id: ERR_REFERRER_NOT_ACTIVE, http: 422, condition: "Referrer employment_status is ON_LEAVE or TERMINATED at submission" }
  - { id: ERR_REFERRER_INELIGIBLE_TENURE, http: 422, condition: "Referrer tenure_days < policy min_tenure_days" }
  - { id: ERR_REFERRER_EXCLUDED, http: 422, condition: "Recruiter referring into own department, or MANAGER+ referring into own department" }
  - { id: ERR_ROLE_NOT_REFERRAL_ELIGIBLE, http: 422, condition: "Requisition.referral_eligible is false" }
  - { id: ERR_NO_ACTIVE_POLICY, http: 422, condition: "No ACTIVE PolicyVersion exists to pin / gate campaign activation" }
  - { id: ERR_POLICY_WINDOW_CONFLICT, http: 409, condition: "Policy [effective_from, effective_to) overlaps another DRAFT/ACTIVE policy (half-open; touching allowed)" }
  - { id: ERR_CAMPAIGN_WINDOW_CONFLICT, http: 409, condition: "Campaign [window_start, window_end] overlaps another non-terminal campaign for the same requisition (closed; touching conflicts)" }
  - { id: ERR_CAMPAIGN_WINDOW_EXPIRED, http: 422, condition: "Activating a campaign whose window_end < now" }
  - { id: ERR_HIRE_DATE_IN_FUTURE, http: 422, condition: "hire action with hire_date > now" }
  - { id: ERR_CAMPAIGN_BUDGET_EXCEEDED, http: 422, condition: "Campaign edit would drop budget_cents below reserved_cents + spent_cents" }
  - { id: ERR_ANNUAL_CAP_EXCEEDED, http: 422, condition: "Milestone approve would push referrer annual_committed_cents above annual_cap_cents" }
  - { id: ERR_TAX_PROFILE_NOT_VERIFIED, http: 422, condition: "Milestone approve while referrer's tax profile missing or not VERIFIED" }
  - { id: ERR_BATCH_NOT_OPEN, http: 409, condition: "Milestone add/remove or cancel attempted on a non-OPEN batch" }
  - { id: ERR_MILESTONE_NOT_BATCHABLE, http: 409, condition: "Milestone attach attempted from a status other than APPROVED or CLAWED_BACK(recovery PENDING), or already attached" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Platform operator; manages employees and the logical clock"
    identity: opaque
    exclusive_operations: ["POST /erp/employees", "POST /erp/employees/{id}/terminate", "POST /erp/_clock/set_current_utc"]
    shared_operations: ["GET reads"]
  - name: TalentAdmin
    description: "Talent acquisition administrator; owns requisitions, policies, campaigns, ops sweep, and payroll payment confirmation"
    identity: opaque
    exclusive_operations: ["POST /erp/job-requisitions and lifecycle actions", "POST /erp/policy-versions and activate/retire", "POST/PATCH /erp/campaigns and lifecycle actions", "POST /erp/_ops/evaluate", "POST /erp/payroll-batches/{id}/confirm-paid"]
    shared_operations: ["candidates create", "record-departure", "abuse-case raise", "GET reads", "analytics"]
  - name: Recruiter
    description: "Talent acquisition recruiter; reviews and advances referrals through hiring stages"
    identity: "entity_backed:Employee"
    exclusive_operations: ["POST /erp/referrals/{id}/review", "POST /erp/referrals/{id}/request-info", "POST /erp/referrals/{id}/qualify", "POST /erp/referrals/{id}/reject"]
    shared_operations: ["POST /erp/referrals (on behalf of a referrer)", "advance / offer-declined / not-selected (shared with HiringManager)", "provide-info", "candidates create", "record-departure", "abuse-case raise", "GET reads", "analytics"]
  - name: HiringManager
    description: "Hiring manager; advances late stages and makes hire / not-selected decisions"
    identity: "entity_backed:Employee"
    exclusive_operations: ["POST /erp/referrals/{id}/hire"]
    shared_operations: ["advance / offer-declined / not-selected (shared with Recruiter)", "GET reads"]
  - name: Employee
    description: "Regular employee acting as referrer; scoped to own resources"
    identity: "entity_backed:Employee"
    exclusive_operations: ["POST /erp/referrals/{id}/withdraw"]
    shared_operations: ["POST /erp/referrals (as self)", "provide-info on own referral", "PUT own tax-profile", "GET own referrals/tax-profile"]
  - name: PayrollProcessor
    description: "Payroll operator; verifies tax profiles, approves/forfeits milestones, prepares payroll batches (cannot confirm payment)"
    identity: opaque
    exclusive_operations: ["POST /erp/employees/{id}/tax-profile/verify", "POST /erp/milestones/{id}/approve", "POST /erp/payroll-batches and seal/export/cancel", "POST /erp/payroll-batches/{id}/milestones and remove"]
    shared_operations: ["PUT tax-profile", "milestone forfeit (shared with ComplianceOfficer)", "GET reads"]
  - name: ComplianceOfficer
    description: "Compliance reviewer; decides abuse cases (cannot decide cases they raised)"
    identity: opaque
    exclusive_operations: ["POST /erp/abuse-cases/{id}/start-review", "POST /erp/abuse-cases/{id}/confirm", "POST /erp/abuse-cases/{id}/dismiss"]
    shared_operations: ["abuse-case raise", "milestone forfeit (shared with PayrollProcessor)", "GET reads"]
