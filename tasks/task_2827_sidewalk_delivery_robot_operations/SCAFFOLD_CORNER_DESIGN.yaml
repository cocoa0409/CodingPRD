      - name: segment_approval_below_the_ordinance_clearance_is_refused
        claim_type: violation_to_error
        grounds:
          - "validations[priority=69]"
          - "errors.ERR_CLEARANCE_INSUFFICIENT"
          - "state_machines.SidewalkSegment.SURVEYED_to_APPROVED"
          - "entities.ServiceZone.fields.ordinance_min_clearance_cm"
        distinguishing_aspect: >-
          Accessibility clearance is enforced at approval time against the zone ordinance, and the
          comparison is inclusive: 88.0 cm of measured clearance against a 90.0 cm ordinance is 422
          ERR_CLEARANCE_INSUFFICIENT and the segment stays SURVEYED, while exactly 90.0 cm is approved -
          which is a different rule and a different threshold from the robot-specific clearance margin
          checked when a route is planned.
        test_recipe:
          setup:
            - "logical clock at 2026-08-03T09:00:00.000Z"
            - "ServiceZone Z1 PROVISIONED with ordinance_min_clearance_cm 90.0 and max_crossing_risk 45.0"
            - "segment SL is SURVEYED with measured_clearance_cm 88.0 and crossing_risk_score 1.0"
            - "segment SO is SURVEYED with measured_clearance_cm 90.0 and crossing_risk_score 1.0"
            - "both segments pass the crossing-risk ceiling, so only the clearance rule can differ between them"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T09:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /service-zones"
              payload: { name: "Mission District", municipality_code: "SF", ordinance_min_clearance_cm: 90.0, ordinance_max_speed_cm_s: 160, operating_window_start_utc_hhmm: "0700", operating_window_end_utc_hhmm: "2100", max_concurrent_robots: 2, planning_haul_m: 800.0, planning_crossings: 2, remedy_budget_cents: 50000 }
              as: PlatformAdmin
              captures: { z: $.data.id }
            - call: "POST /sidewalk-segments"
              payload: { zone_id: "${z}", segment_code: "SL", segment_type: "WALKWAY", length_m: 200.0, measured_clearance_cm: 88.0, surface_grade_pct: 2.0, sightline_m: 40.0, pedestrian_flow_per_min: 5.0, curb_ramp_present: true }
              as: PlatformAdmin
              captures: { slow: $.data.id }
            - call: "POST /sidewalk-segments/${slow}/transitions"
              payload: { action: "SURVEY" }
              as: PlatformAdmin
            - call: "POST /sidewalk-segments"
              payload: { zone_id: "${z}", segment_code: "SO", segment_type: "WALKWAY", length_m: 200.0, measured_clearance_cm: 90.0, surface_grade_pct: 2.0, sightline_m: 40.0, pedestrian_flow_per_min: 5.0, curb_ramp_present: true }
              as: PlatformAdmin
              captures: { sok: $.data.id }
            - call: "POST /sidewalk-segments/${sok}/transitions"
              payload: { action: "SURVEY" }
              as: PlatformAdmin
          trigger:
            - call: "POST /sidewalk-segments/${slow}/transitions"
              payload: { action: "APPROVE" }
              as: PlatformAdmin
            - call: "POST /sidewalk-segments/${sok}/transitions"
              payload: { action: "APPROVE" }
              as: PlatformAdmin
          assert:
            - "the APPROVE of SL returns 422 with error_id ERR_CLEARANCE_INSUFFICIENT"
            - "SidewalkSegment.${slow}.status == SURVEYED and SidewalkSegment.${slow}.version == 2 after the refusal"
            - "the APPROVE of SO returns 200 with SidewalkSegment.${sok}.status == APPROVED"
            - "SidewalkSegment.${sok}.version == 3"
            - "GET /sidewalk-segments?zone_id=${z}&status=APPROVED reports total_count == 1"
      - name: arrival_is_refused_while_a_takeover_is_open
        claim_type: cascading_validation
        grounds:
