            - "after enrollment the same request succeeds: Subscription created with origin == USED_DEALER, status == PENDING_ACTIVATION"
            - "Radio.${radioD_id}.activation_status still DEACTIVATED until the new ACTIVATE signal acks (state re-enters via DEACTIVATED -> REGISTERED loop)"

      - name: campaign_activation_gated_by_step_count_and_window
        grounds:
          - state_machines.OfferCampaign.DRAFT_to_ACTIVE
          - entities.OfferStep.fields.campaign_id
        distinguishing_aspect: |
          Entity pair: OfferCampaign -> OfferStep (different pair from instance
          1's Dealer -> Radio). Campaign activation is forbidden while its child
          step set is empty and while now > window_end_at; adding a step flips
          the outcome without touching the campaign row.
        test_recipe:
          setup:
            - "campaign CG1 DRAFT, window [2026-08-01, 2026-12-01], phase WINBACK, zero steps"
            - "plan PZ for the step"
          setup_api_calls:
            - call: "POST /api/v1/package-tiers"
              payload: { code: "TEE", name: "TierEE", channel_entitlements: ["CH1"], includes_streaming: true, min_hardware_generation: "GEN1" }
              as: PlatformAdmin
              captures: { tierEE_id: $.data.id }
            - call: "POST /api/v1/subscription-plans"
              payload: { code: "PZ", name: "PZ", package_tier_id: "${tierEE_id}", service_mode: "STREAMING_ONLY", is_trial: false, term_kind: "MONTHLY", term_length_days: 30, price_cents: 3000, auto_renew_default: false }
              as: PlatformAdmin
              captures: { pz_id: $.data.id }
            - call: "POST /api/v1/offer-campaigns"
              payload: { code: "CG1", name: "Camp1", lifecycle_phase: "WINBACK", window_start_at: "2026-08-01T00:00:00Z", window_end_at: "2026-12-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { cg1_id: $.data.id }
          trigger:
            - call: "POST /api/v1/offer-campaigns/${cg1_id}/activate"
              payload: {}
              as: PlatformAdmin
              captures: { errCG: $.data.error_id }
            - call: "POST /api/v1/offer-campaigns/${cg1_id}/steps"
              payload: { step_index: 0, plan_id: "${pz_id}", step_up_rank: 0, discount_pct_bps: 0, flat_discount_cents: 0 }
              as: PlatformAdmin
            - call: "POST /api/v1/offer-campaigns/${cg1_id}/activate"
              payload: {}
              as: PlatformAdmin
              captures: { cg1_state: $.data.state }
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/v1/offer-campaigns/${cg1_id}/pause"
              payload: {}
              as: PlatformAdmin
            - call: "POST /api/v1/offer-campaigns/${cg1_id}/activate"
              payload: {}
              as: PlatformAdmin
              captures: { errCG2: $.data.error_id }
          assert:
            - "first activate rejected (zero OfferStep children) — child-state gate"
            - "after adding one step, activate succeeds: state == ACTIVE"
            - "after clock passes window_end_at, reactivation from PAUSED rejected with ERR_CAMPAIGN_WINDOW (window_end_at > now fails)"

  - rule_id: resource_temporal_overlap
    instances:
      - name: campaign_phase_window_overlap_adjacency_allowed
        grounds:
          - calculations.campaign_overlap_check
          - state_machines.OfferCampaign.DRAFT_to_ACTIVE
          - errors[ERR_CAMPAIGN_OVERLAP]
        distinguishing_aspect: |
          Interval semantics: half-open [start, end) on the phase-window
          dimension of OfferCampaign. Touching endpoints (A ends exactly when B
          starts) do NOT overlap; a one-second earlier start DOES. PAUSED
          campaigns still occupy. Resource: the (lifecycle_phase) window space.
        test_recipe:
          setup:
            - "plan PZ2; campaign CA POST_TRIAL window [2026-09-01T00:00:00Z, 2026-10-01T00:00:00Z) ACTIVE with one step"
            - "campaign CB POST_TRIAL window [2026-10-01T00:00:00Z, 2026-11-01T00:00:00Z) DRAFT with one step (adjacent)"
            - "campaign CC POST_TRIAL window [2026-09-30T23:59:59Z, 2026-11-01T00:00:00Z) DRAFT with one step (overlaps by 1 second)"
          setup_api_calls:
            - call: "POST /api/v1/package-tiers"
              payload: { code: "TFF", name: "TierFF", channel_entitlements: ["CH1"], includes_streaming: true, min_hardware_generation: "GEN1" }
