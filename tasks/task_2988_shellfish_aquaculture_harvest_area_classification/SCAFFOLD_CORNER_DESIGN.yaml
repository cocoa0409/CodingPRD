      - name: upgrading_two_ranks_in_one_decision_returns_classification_step_skipped
        claim_type: violation_to_error
        grounds:
          - validations[priority=64]
          - errors[ERR_CLASSIFICATION_STEP_SKIPPED]
          - state_machines[GrowingArea.classification PROHIBITED -> RESTRICTED]
        distinguishing_aspect: |
          Downgrades may skip ranks (APPROVED straight to PROHIBITED) but upgrades must improve the
          restrictiveness rank by exactly 1, so PROHIBITED -> APPROVED is refused while the very next
          PROHIBITED -> RESTRICTED call on the same area succeeds — and that successful upgrade
          leaves harvest_status at CLOSED_SAMPLE_FAILURE because reopening is the other dimension.
        test_recipe:
          setup:
            - "GrowingArea GA-114 with five ACCEPTED MPN-2 samples (eligible_classification APPROVED, accepted_sample_count 5)."
            - "The authority then recorded a PROHIBITED decision, a rank-skipping DOWNGRADE which is legal and which also coupled harvest_status to CLOSED_SAMPLE_FAILURE."
            - "The area's version is re-read immediately before each decision so the OCC guard always matches."
          setup_api_calls:
            - call: "POST /shellfish/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ShellfishControlAuthority
            - call: "POST /shellfish/growing-areas"
              payload: { code: "GA-114", water_body: "Pamlico Sound", rainfall_closure_threshold_in: 1.0, rainfall_closure_hours: 96, reopen_sample_count_required: 3, clean_sample_mpn_limit: 14.0, conditional_management_plan_on_file: false }
              as: ShellfishControlAuthority
              captures: { area: $.data.id }
            - call: "POST /shellfish/growing-areas/${area}/water-samples"
              payload: { station_code: "ST-1", collected_at: "2026-07-01T09:00:00Z", fecal_coliform_mpn: 2, water_temp_c: 24.0, salinity_ppt: 30.0 }
              as: ShellfishControlAuthority
            - call: "POST /shellfish/growing-areas/${area}/water-samples"
              payload: { station_code: "ST-1", collected_at: "2026-07-02T09:00:00Z", fecal_coliform_mpn: 2, water_temp_c: 24.0, salinity_ppt: 30.0 }
              as: ShellfishControlAuthority
            - call: "POST /shellfish/growing-areas/${area}/water-samples"
              payload: { station_code: "ST-1", collected_at: "2026-07-03T09:00:00Z", fecal_coliform_mpn: 2, water_temp_c: 24.0, salinity_ppt: 30.0 }
              as: ShellfishControlAuthority
            - call: "POST /shellfish/growing-areas/${area}/water-samples"
              payload: { station_code: "ST-1", collected_at: "2026-07-04T09:00:00Z", fecal_coliform_mpn: 2, water_temp_c: 24.0, salinity_ppt: 30.0 }
              as: ShellfishControlAuthority
            - call: "POST /shellfish/growing-areas/${area}/water-samples"
              payload: { station_code: "ST-1", collected_at: "2026-07-05T09:00:00Z", fecal_coliform_mpn: 2, water_temp_c: 24.0, salinity_ppt: 30.0 }
              as: ShellfishControlAuthority
            - call: "GET /shellfish/growing-areas/${area}"
              payload: {}
              as: ShellfishControlAuthority
              captures: { area_v: $.data.version }
            - call: "POST /shellfish/growing-areas/${area}/classification-decisions"
              payload: { classification: "PROHIBITED", expected_area_version: "${area_v}", decision_note: "pollution source investigation opened" }
              as: ShellfishControlAuthority
            - call: "GET /shellfish/growing-areas/${area}"
              payload: {}
              as: ShellfishControlAuthority
              captures: { area_v2: $.data.version }
          trigger:
            - call: "POST /shellfish/growing-areas/${area}/classification-decisions"
              payload: { classification: "APPROVED", expected_area_version: "${area_v2}", decision_note: "source removed" }
              as: ShellfishControlAuthority
            - call: "POST /shellfish/growing-areas/${area}/classification-decisions"
              payload: { classification: "RESTRICTED", expected_area_version: "${area_v2}", decision_note: "one rank at a time" }
              as: ShellfishControlAuthority
          assert:
            - "First call: HTTP 409 with data.error_id == ERR_CLASSIFICATION_STEP_SKIPPED (rank 3 -> 0 improves by 3, not 1)"
            - "Second call: HTTP 200 with data.classification == RESTRICTED — the same ${area_v2} is still current because the refused decision did not bump the version"
            - "After the second call data.harvest_status == CLOSED_SAMPLE_FAILURE, so the upgrade did not reopen the area"
            - "GET /shellfish/growing-areas/${area} reports eligible_classification == APPROVED throughout (the eligibility is data-driven and independent of the administrative classification)"

      - name: upgrade_beyond_what_the_data_supports_is_refused
        claim_type: violation_to_error
        grounds:
          - validations[priority=63]
          - errors[ERR_CLASSIFICATION_NOT_SUPPORTED_BY_DATA]
          - state_machines[GrowingArea.classification APPROVED -> PROHIBITED via the sample sweep]
        distinguishing_aspect: |
          The fifth MPN-200 sample drives the system sweep (geometric mean 200.0 > 14.0 with a
          PROHIBITED eligibility) and the authority then cannot upgrade even one rank, because
          eligible_classification is PROHIBITED and the rule demands an eligibility at least as
          permissive as the request.
        test_recipe:
          setup:
            - "GrowingArea GA-114 with default configuration."
            - "Five ACCEPTED MPN-200 samples at ST-1 collected 2026-07-01..2026-07-05 at 09:00:00Z: geometric_mean_mpn 200.0, p90_mpn 200.0, eligible_classification PROHIBITED."
            - "The sample sweep therefore fired on the fifth ingest: classification PROHIBITED, harvest_status CLOSED_SAMPLE_FAILURE."
          setup_api_calls:
            - call: "POST /shellfish/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ShellfishControlAuthority
            - call: "POST /shellfish/growing-areas"
              payload: { code: "GA-114", water_body: "Pamlico Sound", rainfall_closure_threshold_in: 1.0, rainfall_closure_hours: 96, reopen_sample_count_required: 3, clean_sample_mpn_limit: 14.0, conditional_management_plan_on_file: false }
              as: ShellfishControlAuthority
              captures: { area: $.data.id }
            - call: "POST /shellfish/growing-areas/${area}/water-samples"
              payload: { station_code: "ST-1", collected_at: "2026-07-01T09:00:00Z", fecal_coliform_mpn: 200, water_temp_c: 24.0, salinity_ppt: 30.0 }
              as: ShellfishControlAuthority
            - call: "POST /shellfish/growing-areas/${area}/water-samples"
              payload: { station_code: "ST-1", collected_at: "2026-07-02T09:00:00Z", fecal_coliform_mpn: 200, water_temp_c: 24.0, salinity_ppt: 30.0 }
              as: ShellfishControlAuthority
            - call: "POST /shellfish/growing-areas/${area}/water-samples"
              payload: { station_code: "ST-1", collected_at: "2026-07-03T09:00:00Z", fecal_coliform_mpn: 200, water_temp_c: 24.0, salinity_ppt: 30.0 }
              as: ShellfishControlAuthority
            - call: "POST /shellfish/growing-areas/${area}/water-samples"
              payload: { station_code: "ST-1", collected_at: "2026-07-04T09:00:00Z", fecal_coliform_mpn: 200, water_temp_c: 24.0, salinity_ppt: 30.0 }
              as: ShellfishControlAuthority
            - call: "POST /shellfish/growing-areas/${area}/water-samples"
              payload: { station_code: "ST-1", collected_at: "2026-07-05T09:00:00Z", fecal_coliform_mpn: 200, water_temp_c: 24.0, salinity_ppt: 30.0 }
              as: ShellfishControlAuthority
            - call: "GET /shellfish/growing-areas/${area}"
              payload: {}
              as: ShellfishControlAuthority
              captures: { area_v: $.data.version }
          trigger:
            - call: "POST /shellfish/growing-areas/${area}/classification-decisions"
              payload: { classification: "RESTRICTED", expected_area_version: "${area_v}", decision_note: "operator appeal" }
              as: ShellfishControlAuthority
          assert:
            - "HTTP 409 with data.error_id == ERR_CLASSIFICATION_NOT_SUPPORTED_BY_DATA"
            - "data.error_id is not ERR_CLASSIFICATION_STEP_SKIPPED (PROHIBITED -> RESTRICTED IS a one-rank upgrade) and not ERR_INSUFFICIENT_SAMPLE_DATA"
            - "GET /shellfish/growing-areas/${area} reports classification == PROHIBITED, harvest_status == CLOSED_SAMPLE_FAILURE, geometric_mean_mpn == 200.0, p90_mpn == 200.0 and eligible_classification == PROHIBITED"

      - name: resubmission_beyond_the_revision_limit_is_refused
        claim_type: violation_to_error
        grounds:
          - validations[priority=67]
          - errors[ERR_REVISION_LIMIT_EXCEEDED]
          - entities.Lease.fields.revision_round
          - state_machines[Lease.status REVISION_REQUESTED -> UNDER_REVIEW]
        distinguishing_aspect: |
          MAX_REVISION_ROUNDS is 3 and revision_round counts completed RE-ENTRIES, not submissions:
          the first submit leaves revision_round 0, three resubmissions take it to 3, and the fourth
          is refused with the lease parked in REVISION_REQUESTED rather than being denied.
        test_recipe:
          setup:
            - "GrowingArea GA-114 APPROVED/OPEN; DRAFT Lease L-2988-01 created by op-1."
            - "The lease was submitted, objected to on navigation, and resubmitted three times; each resubmission incremented revision_round, which now reads 3."
            - "The fourth navigation objection has just parked it back in REVISION_REQUESTED."
          setup_api_calls:
            - call: "POST /shellfish/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ShellfishControlAuthority
            - call: "POST /shellfish/growing-areas"
              payload: { code: "GA-114", water_body: "Pamlico Sound", rainfall_closure_threshold_in: 1.0, rainfall_closure_hours: 96, reopen_sample_count_required: 3, clean_sample_mpn_limit: 14.0, conditional_management_plan_on_file: false }
