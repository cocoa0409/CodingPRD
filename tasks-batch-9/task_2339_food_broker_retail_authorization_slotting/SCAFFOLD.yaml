  - method: GET
    path: "/promotion-events"
    description: "List promotion and demo events filtered by authorization_id, event_type, store_code or state (FK reverse-reachability for Authorization)."
    roles: [BrokerAdmin, BrokerAccountManager, BrokerAuditManager, RetailerBuyer, PrincipalPortalUser]
    code: 200
    input: ["authorization_id?", "event_type?", "store_code?", "state?", "limit?", "offset?"]
    output: PromotionEvent[]
    side_effects: []

  - method: POST
    path: "/promotion-events/{promotionEventId}/commit"
    description: "Commit the event with the retailer (PLANNED→COMMITTED). Requires an AUTHORIZED (not AT_RISK) authorization, a future window, and for DEMO_SAMPLING free buffered demo-slot capacity at the store."
    roles: [BrokerAccountManager]
    code: 200
    input: []
    output: PromotionEvent
    side_effects: ["state PLANNED→COMMITTED, committed_at stamped", "The buffered demo window now occupies one of the store's max_concurrent_demos slots"]

  - method: POST
    path: "/promotion-events/{promotionEventId}/execute"
    description: "Record execution after the window has elapsed (COMMITTED→EXECUTED) with the funding actually delivered, capped at 110% of plan."
    roles: [BrokerAccountManager]
    code: 200
    input: [actual_funding_cents]
    output: PromotionEvent
    side_effects: ["state COMMITTED→EXECUTED, actual_funding_cents persisted", "PROMO_BILLBACK recovery now nets against this proven funding"]

  - method: POST
    path: "/promotion-events/{promotionEventId}/cancel"
    description: "Cancel a planned or committed event (→CANCELLED), releasing any demo slot it held."
    roles: [BrokerAccountManager]
    code: 200
    input: []
    output: PromotionEvent
    side_effects: ["state → CANCELLED", "The event stops counting toward ERR_DEMO_SLOT_CAPACITY"]

  # ------------------------------------ Deductions & post-audit recovery
  - method: POST
    path: "/deductions"
    description: "Retailer takes a deduction against a principal (PROMO_BILLBACK requires promotion_event_id; DUPLICATE_BILLBACK requires original_deduction_id)."
    roles: [RetailerBuyer]
    code: 201
    input: [retailer_id, principal_id, reason_code, amount_cents, deduction_date, "promotion_event_id?", "original_deduction_id?"]
    output: Deduction
    side_effects: ["settlement_state = OPEN, dispute_state = NOT_DISPUTED, open_cents = amount_cents", "Principal.open_deduction_cents, liability_ratio_bps and credit_posture re-derived"]

  - method: GET
    path: "/deductions/{deductionId}"
    description: "Read one deduction including recovered/conceded/open split, substantiation_doc_count, filed_by_user_id, approved_by_user_id and both state dimensions."
    roles: [BrokerAdmin, BrokerAccountManager, BrokerAuditManager, RetailerBuyer, PrincipalPortalUser]
    code: 200
    input: []
    output: Deduction
    side_effects: []

  - method: GET
    path: "/deductions"
    description: "List deductions filtered by retailer_id, principal_id, promotion_event_id, original_deduction_id, reason_code or either state dimension (FK reverse-reachability for Retailer, Principal, PromotionEvent and the self-referential duplicate link)."
    roles: [BrokerAdmin, BrokerAccountManager, BrokerAuditManager, RetailerBuyer, PrincipalPortalUser]
    code: 200
    input: ["retailer_id?", "principal_id?", "promotion_event_id?", "original_deduction_id?", "reason_code?", "settlement_state?", "dispute_state?", "limit?", "offset?"]
    output: Deduction[]
    side_effects: []

  - method: POST
    path: "/deductions/{deductionId}/dispute"
    description: "File (or refile after a denial) a post-audit claim inside the retailer's dispute window. Refiling resets substantiation and is bounded by MAX_REFILES = 2."
    roles: [BrokerAccountManager]
    code: 200
    input: [claim_amount_cents]
    output: Deduction
    side_effects: ["dispute_state NOT_DISPUTED|DENIED→FILED, filed_by_user_id = X-User-ID, substantiation_doc_count = 0", "refile_count += 1 and denial_reason cleared when refiling from DENIED", "settlement_state stays OPEN — open_cents is untouched"]

  - method: POST
    path: "/deductions/{deductionId}/substantiate"
    description: "Attach one substantiation document to a filed claim (FILED→SUBSTANTIATED; repeat calls only increment the counter)."
    roles: [BrokerAccountManager]
    code: 200
    input: [document_ref]
    output: Deduction
    side_effects: ["substantiation_doc_count += 1", "dispute_state FILED→SUBSTANTIATED on the first document"]

  - method: POST
    path: "/deductions/{deductionId}/approve-recovery"
    description: "Audit approval of a post-audit recovery. Exclusive to BrokerAuditManager and forbidden to the X-User-ID that filed the claim. Computes the recoverable amount by reason_code and settles the deduction."
    roles: [BrokerAuditManager]
    code: 200
    input: []
    output: Deduction
    side_effects:
      - "dispute_state SUBSTANTIATED→APPROVED, approved_by_user_id = X-User-ID"
      - "recovered_cents / conceded_cents / open_cents set per calculations.post_audit_recovery; settlement_state OPEN→RECOVERED (or →CONCEDED when nothing is recoverable)"
      - "PROMO_BILLBACK: promotion_event.settled_funding_cents += conceded_cents and EXECUTED→SETTLED once it covers actual_funding_cents; the authorization's promo_settled_funding_cents and trade_spend_total_cents are recomputed"
      - "Principal.open_deduction_cents, liability_ratio_bps and credit_posture re-derived"

  - method: POST
    path: "/deductions/{deductionId}/deny-recovery"
    description: "Audit denial of a post-audit recovery (SUBSTANTIATED→DENIED). Money-neutral: the deduction stays OPEN with open_cents unchanged."
    roles: [BrokerAuditManager]
    code: 200
    input: [denial_reason]
    output: Deduction
    side_effects: ["dispute_state SUBSTANTIATED→DENIED, denial_reason recorded", "recovered_cents, conceded_cents and open_cents unchanged; Principal.open_deduction_cents unchanged"]

  - method: POST
    path: "/deductions/{deductionId}/concede"
    description: "Broker concedes the deduction without recovery (settlement_state OPEN→CONCEDED)."
    roles: [BrokerAccountManager]
    code: 200
    input: []
    output: Deduction
    side_effects: ["conceded_cents = amount_cents - recovered_cents, open_cents → 0", "PROMO_BILLBACK: promotion_event.settled_funding_cents += conceded_cents and EXECUTED→SETTLED once it covers actual_funding_cents", "Principal.open_deduction_cents and credit_posture re-derived"]

  # ---------------------------------------------------------- Test-driving
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical UTC clock, which every deadline, window, blackout, dispute-window and buffer rule reads. Before any call the clock reads exactly 2026-08-01T00:00:00Z (mandatory server startup default; it MUST NOT fall back to wall-clock time)."
    roles: [BrokerAdmin, BrokerAccountManager, BrokerAuditManager, RetailerBuyer, PrincipalPortalUser]
    code: 200
    input: [current_utc]
    output: |
      { current_utc: string }
    side_effects: ["The logical clock is set; all subsequent temporal evaluations use it"]

# =============================================================================
# §1.6 Error Code Catalog (every code is triggerable by at least one §1.5 call)
# =============================================================================
errors:
  # --- auth / shape -----------------------------------------------------------
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role or X-User-ID header missing, or X-User-Role is not one of the five declared roles" }
  - { id: ERR_ROLE_FORBIDDEN, http: 403, condition: "The acting role is not listed in the endpoint's roles" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, wrong type, unknown enum member, out-of-range number, malformed date, item_ids outside 1..5, amortization_periods outside 1..12, DEMO_SAMPLING without store_code, RETAILER_LEVEL conflict rule without retailer_id (or NATIONAL with one), catalog REJECTED without reject_reason" }
  - { id: ERR_UPC_CHECK_DIGIT_INVALID, http: 400, condition: "Item.upc is 12 digits but fails the GS1 mod-10 check digit" }

  # --- existence -------------------------------------------------------------
  - { id: ERR_RETAILER_NOT_FOUND, http: 404, condition: "retailerId / retailer_id does not exist" }
  - { id: ERR_PRINCIPAL_NOT_FOUND, http: 404, condition: "principalId / principal_id / principal_a_id / principal_b_id does not exist" }
  - { id: ERR_AGREEMENT_NOT_FOUND, http: 404, condition: "agreementId does not exist" }
  - { id: ERR_CONFLICT_RULE_NOT_FOUND, http: 404, condition: "conflictRuleId does not exist" }
  - { id: ERR_ITEM_NOT_FOUND, http: 404, condition: "itemId or an element of item_ids / authorized_item_ids does not exist" }
  - { id: ERR_REVIEW_NOT_FOUND, http: 404, condition: "reviewId / review_id does not exist" }
  - { id: ERR_PRESENTATION_NOT_FOUND, http: 404, condition: "presentationId / presentation_id does not exist" }
  - { id: ERR_DEAL_NOT_FOUND, http: 404, condition: "dealId does not exist" }
  - { id: ERR_AUTHORIZATION_NOT_FOUND, http: 404, condition: "authorizationId / authorization_id does not exist" }
  - { id: ERR_SNAPSHOT_NOT_FOUND, http: 404, condition: "snapshotId does not exist" }
  - { id: ERR_PROMOTION_NOT_FOUND, http: 404, condition: "promotionEventId / promotion_event_id does not exist" }
  - { id: ERR_DEDUCTION_NOT_FOUND, http: 404, condition: "deductionId / original_deduction_id does not exist" }

  # --- ownership scope -------------------------------------------------------
  - { id: ERR_RETAILER_SCOPE_FORBIDDEN, http: 403, condition: "A RetailerBuyer acts on a review, deal, authorization, snapshot or deduction belonging to a different retailer than its X-User-ID" }
  - { id: ERR_PRINCIPAL_SCOPE_FORBIDDEN, http: 403, condition: "A PrincipalPortalUser reads a resource belonging to a different principal than its X-User-ID" }

  # --- optimistic concurrency (§1.2.1) --------------------------------------
  - { id: ERR_STALE_PRINCIPAL_VERSION, http: 412, condition: "expected_principal_version does not equal Principal.version at accept time" }
  - { id: ERR_STALE_AUTHORIZATION_VERSION, http: 412, condition: "expected_authorization_version does not equal Authorization.version at posting time" }
  - { id: ERR_STALE_REVIEW_VERSION, http: 412, condition: "expected_review_version does not equal CategoryReview.version at decide time" }

  # --- state preconditions ---------------------------------------------------
  - { id: ERR_INVALID_STATE, http: 409, condition: "The target entity is in a state from which the requested transition does not exist (including every terminal state: TERMINATED, DECIDED, ACCEPTED/DECLINED presentation, RECOVERED/WRITTEN_OFF/REJECTED deal, DISCONTINUED authorization, SETTLED/CANCELLED promotion, RECOVERED/CONCEDED deduction, APPROVED dispute, VALIDATED catalog)" }
  - { id: ERR_REVIEW_NOT_OPEN, http: 409, condition: "Submitting a presentation while the review is not OPEN" }
  - { id: ERR_REVIEW_NOT_DECIDED, http: 409, condition: "Accepting a slotting deal before its review has been DECIDED" }
  - { id: ERR_PRESENTATION_NOT_ACCEPTED, http: 409, condition: "Accepting a slotting deal whose presentation is not ACCEPTED" }
  - { id: ERR_PRESENTATION_DECLINED, http: 409, condition: "Proposing on a deal whose presentation has been DECLINED" }
  - { id: ERR_PRINCIPAL_NOT_ACTIVE, http: 409, condition: "Submitting a presentation, accepting a deal or submitting catalog data while the principal is PROSPECT, SUSPENDED or TERMINATED (as the operation requires)" }
  - { id: ERR_PRINCIPAL_TERMINATED, http: 409, condition: "Activating a commission agreement for a TERMINATED principal" }
  - { id: ERR_PRINCIPAL_HAS_NO_AGREEMENT, http: 409, condition: "Activating a principal that has no ACTIVE commission agreement" }
  - { id: ERR_PRINCIPAL_HAS_LIVE_AUTHORIZATIONS, http: 409, condition: "Terminating a principal that still has PENDING_SETUP, AUTHORIZED or AT_RISK authorizations" }
  - { id: ERR_AGREEMENT_HAS_OPEN_NEGOTIATION, http: 409, condition: "Terminating an agreement while a deal for the same (principal, retailer, category_code) is PROPOSED or COUNTERED" }
  - { id: ERR_AUTHORIZATION_NOT_AUTHORIZED, http: 409, condition: "Committing a promotion for an authorization that is PENDING_SETUP or DISCONTINUED" }
  - { id: ERR_AUTHORIZATION_AT_RISK, http: 409, condition: "Committing a promotion for an authorization whose void rate has put it AT_RISK" }
  - { id: ERR_AUTHORIZATION_HAS_LIVE_PROMOTION, http: 409, condition: "Discontinuing an authorization that still has a COMMITTED or EXECUTED promotion" }
  - { id: ERR_DEDUCTION_ALREADY_SETTLED, http: 409, condition: "Disputing, approving, denying or conceding a deduction whose settlement_state is no longer OPEN" }
  - { id: ERR_SNAPSHOT_ALREADY_REVERSED, http: 409, condition: "Reversing a POSTING entry that is already reversed, or reversing a REVERSAL entry" }
  - { id: ERR_ACCEPT_BY_OFFEROR, http: 409, condition: "The side that made the standing offer tries to accept it (RetailerBuyer while last_offer_side == RETAILER, BrokerAccountManager while last_offer_side == BROKER)" }

  # --- temporal --------------------------------------------------------------
  - { id: ERR_REVIEW_SUBMISSION_CLOSED, http: 422, condition: "The logical clock has reached the review's submission_deadline" }
  - { id: ERR_SUBMISSION_WINDOW_STILL_OPEN, http: 422, condition: "Locking a review before its submission_deadline" }
  - { id: ERR_REVIEW_WINDOW_CLOSED, http: 422, condition: "Deciding outside the half-open [review_window_start, review_window_end) window" }
  - { id: ERR_REVIEW_WINDOW_STARTED, http: 422, condition: "Reopening a review on or after review_window_start" }
  - { id: ERR_DISPUTE_WINDOW_CLOSED, http: 422, condition: "Filing or refiling a claim more than Retailer.deduction_dispute_window_days after deduction_date" }
  - { id: ERR_PROMO_WINDOW_IN_PAST, http: 422, condition: "Committing a promotion whose window_start is before the logical clock" }
  - { id: ERR_PROMO_NOT_ELAPSED, http: 422, condition: "Executing a promotion before its window_end" }

  # --- safety / compliance ---------------------------------------------------
  - { id: ERR_PRINCIPAL_CONFLICT, http: 409, condition: "An ACTIVE conflict rule pairs the submitting principal with a principal already presented in this category review" }
  - { id: ERR_CATEGORY_EXCLUSIVITY, http: 409, condition: "Another principal holds an ACTIVE, date-covering exclusive_in_category agreement for this (retailer, category_code)" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "The X-User-ID approving or denying a recovery is the same user that filed the claim" }
  - { id: ERR_SUBSTANTIATION_INSUFFICIENT, http: 409, condition: "Approving a recovery with fewer than 2 substantiation documents" }

  # --- referential integrity -------------------------------------------------
  - { id: ERR_NO_ACTIVE_COMMISSION_AGREEMENT, http: 422, condition: "No ACTIVE agreement for (principal, retailer, category_code) covers the logical clock date" }
  - { id: ERR_ITEM_CATALOG_NOT_VALIDATED, http: 422, condition: "An item in the presentation or award is not in catalog_state VALIDATED" }
  - { id: ERR_CATALOG_GTIN_MISMATCH, http: 422, condition: "gtin14 is not exactly '00' + Item.upc" }
  - { id: ERR_CATALOG_SHELF_LIFE_TOO_SHORT, http: 422, condition: "shelf_life_days is below the 30-day minimum" }
  - { id: ERR_ITEM_NOT_IN_SUBMITTED_PRESENTATION, http: 422, condition: "An authorized_item_ids element is not listed by any SUBMITTED presentation of this review" }
  - { id: ERR_ITEM_PRINCIPAL_MISMATCH, http: 422, condition: "A presentation lists an item owned by a different principal" }
  - { id: ERR_DUPLICATE_LINK_INVALID, http: 422, condition: "DUPLICATE_BILLBACK without a valid original_deduction_id of equal amount for the same (retailer, principal), or pointing at itself" }
  - { id: ERR_PROMO_LINK_INVALID, http: 422, condition: "PROMO_BILLBACK without a promotion_event_id whose authorization belongs to the same principal and retailer" }

  # --- constraints -----------------------------------------------------------
  - { id: ERR_CHAIN_CODE_DUPLICATE, http: 409, condition: "Retailer.chain_code already exists" }
  - { id: ERR_PRINCIPAL_CODE_DUPLICATE, http: 409, condition: "Principal.code already exists" }
  - { id: ERR_UPC_DUPLICATE, http: 409, condition: "Item.upc already exists (globally, across principals)" }
  - { id: ERR_CONFLICT_RULE_DUPLICATE, http: 409, condition: "A conflict rule already exists for the same unordered principal pair, category_code, scope and retailer_id" }
  - { id: ERR_CONFLICT_RULE_SELF, http: 409, condition: "principal_a_id == principal_b_id" }
  - { id: ERR_PRESENTATION_DUPLICATE, http: 409, condition: "A presentation already exists for this (review_id, principal_id)" }
  - { id: ERR_AGREEMENT_WINDOW_OVERLAP, http: 409, condition: "Activation would leave two ACTIVE agreements with overlapping half-open windows for the same (principal, retailer, category_code)" }
  - { id: ERR_REVIEW_BLACKOUT_CONFLICT, http: 409, condition: "The new review window falls inside another review's blackout-buffered window for the same (retailer, category_code)" }
  - { id: ERR_REVIEW_CALENDAR_INVALID, http: 409, condition: "review_window_start >= review_window_end, submission_deadline not strictly before review_window_start, or a reopen deadline outside (now, review_window_start)" }
  - { id: ERR_DEMO_SLOT_CAPACITY, http: 409, condition: "The store already has max_concurrent_demos buffer-overlapping DEMO_SAMPLING events committed or executed" }
  - { id: ERR_NEGOTIATION_ROUNDS_EXHAUSTED, http: 409, condition: "round_index has already reached MAX_NEGOTIATION_ROUNDS = 3" }
  - { id: ERR_COUNTER_NOT_HIGHER, http: 409, condition: "A retailer counter is not strictly higher than current_fee_per_store_cents" }
  - { id: ERR_PROPOSAL_NOT_LOWER, http: 409, condition: "A broker re-proposal from COUNTERED is not strictly lower than current_fee_per_store_cents" }
  - { id: ERR_REFILE_LIMIT_REACHED, http: 409, condition: "refile_count has already reached MAX_REFILES = 2" }
  - { id: ERR_REVIEW_REOPEN_LIMIT, http: 409, condition: "reopen_count has already reached MAX_REVIEW_REOPENS = 1" }
  - { id: ERR_STORE_COUNT_EXCEEDS_CHAIN, http: 409, condition: "store_count_in_scope or authorized_store_count exceeds Retailer.total_store_count" }
  - { id: ERR_CLAIM_EXCEEDS_DEDUCTION, http: 409, condition: "claim_amount_cents exceeds the deduction's amount_cents" }
  - { id: ERR_PERIOD_ALREADY_POSTED, http: 409, condition: "A live POSTING already exists for this (authorization_id, period_index)" }
  - { id: ERR_PERIOD_OUT_OF_SEQUENCE, http: 409, condition: "period_index != Authorization.periods_reported + 1" }
  - { id: ERR_DISTRIBUTION_EXCEEDS_REPORTED, http: 409, condition: "distributed_store_count > reported_store_count" }
  - { id: ERR_REPORTED_EXCEEDS_AUTHORIZED, http: 409, condition: "reported_store_count > Authorization.authorized_store_count" }
  - { id: ERR_SNAPSHOT_NOT_LATEST, http: 409, condition: "Reversing a POSTING that is not the highest live period_index of its authorization" }

  # --- fiscal ----------------------------------------------------------------
  - { id: ERR_REVIEW_SLOTS_EXCEEDED, http: 409, condition: "count(authorized_item_ids) exceeds CategoryReview.slots_remaining" }
  - { id: ERR_PRINCIPAL_CREDIT_RESTRICTED, http: 409, condition: "Principal.credit_posture == RESTRICTED at presentation submit or deal accept" }
  - { id: ERR_SLOTTING_BUDGET_EXCEEDED, http: 409, condition: "slotting_committed_cents + quoted_fee_cents exceeds Principal.slotting_budget_cents" }
  - { id: ERR_PROMO_FUNDING_OVERRUN, http: 409, condition: "actual_funding_cents exceeds 110% of planned_funding_cents" }

# =============================================================================
# §1.7 RBAC Matrix (peer roles + segregation of duties on post-audit recovery)
# =============================================================================
roles:
  - name: BrokerAdmin
    description: "Broker contract administrator: retailers, principals, principal agreements and principal conflict rules."
    identity: "opaque"
    exclusive_operations:
      - "POST /retailers"
      - "POST /principals"
      - "PATCH /principals/{principalId}"
      - "POST /principals/{principalId}/status"
      - "POST /commission-agreements"
      - "POST /commission-agreements/{agreementId}/activate"
      - "POST /commission-agreements/{agreementId}/terminate"
      - "POST /conflict-rules"
      - "POST /conflict-rules/{conflictRuleId}/waive"
    shared_operations:
      - "All GET reads (retailers, principals, agreements, conflict rules, items, reviews, presentations, deals, authorizations, snapshots, promotions, deductions)"
      - "GET /principals/{principalId}/commission-statement"
      - "GET /authorizations/{authorizationId}/voids-report"
      - "POST /_clock/set_current_utc"

  - name: BrokerAccountManager
    description: "Broker account team: new item setup and catalog submission, presentation preparation, slotting negotiation from the broker side, promotion and demo execution, and filing post-audit claims."
    identity: "opaque"
    exclusive_operations:
      - "POST /items"
      - "POST /items/{itemId}/catalog-submissions"
      - "POST /presentations"
      - "POST /presentations/{presentationId}/submit"
      - "POST /slotting-deals"
      - "POST /slotting-deals/{dealId}/propose"
      - "POST /promotion-events"
      - "POST /promotion-events/{promotionEventId}/commit"
      - "POST /promotion-events/{promotionEventId}/execute"
      - "POST /promotion-events/{promotionEventId}/cancel"
      - "POST /deductions/{deductionId}/dispute"
      - "POST /deductions/{deductionId}/substantiate"
      - "POST /deductions/{deductionId}/concede"
    shared_operations:
      - "POST /slotting-deals/{dealId}/accept (only when last_offer_side == RETAILER)"
      - "All GET reads"
      - "GET /principals/{principalId}/commission-statement"
      - "GET /authorizations/{authorizationId}/voids-report"
      - "POST /_clock/set_current_utc"

  - name: BrokerAuditManager
    description: "Broker deduction-audit control. Sole approver/denier of post-audit recoveries and, by segregation of duties, never the user who filed the claim."
    identity: "opaque"
    exclusive_operations:
      - "POST /deductions/{deductionId}/approve-recovery"
      - "POST /deductions/{deductionId}/deny-recovery"
    shared_operations:
      - "All GET reads"
      - "GET /principals/{principalId}/commission-statement"
      - "GET /authorizations/{authorizationId}/voids-report"
      - "POST /_clock/set_current_utc"
    constraints:
      - "X-User-ID MUST differ from Deduction.filed_by_user_id (ERR_SEGREGATION_OF_DUTIES, 403) — the approval is invalid even though the role is correct."
      - "Cannot file or substantiate a claim (those are BrokerAccountManager-exclusive), so the two halves of the control can never be performed by one identity."

  - name: RetailerBuyer
    description: "Retail category buyer: owns the category review calendar, catalog validation decisions, the retailer side of slotting negotiation, awards, store-level distribution reporting, authorization voids and deductions."
    identity: "entity_backed:Retailer"
    exclusive_operations:
      - "POST /category-reviews"
      - "POST /category-reviews/{reviewId}/open"
      - "POST /category-reviews/{reviewId}/lock"
      - "POST /category-reviews/{reviewId}/reopen"
      - "POST /category-reviews/{reviewId}/decide"
      - "POST /items/{itemId}/catalog-decision"
      - "POST /slotting-deals/{dealId}/counter"
      - "POST /slotting-deals/{dealId}/reject"
      - "POST /authorizations/{authorizationId}/discontinue"
      - "POST /distribution-snapshots"
      - "POST /distribution-snapshots/{snapshotId}/reverse"
      - "POST /deductions"
    shared_operations:
      - "POST /slotting-deals/{dealId}/accept (only when last_offer_side == BROKER)"
      - "All GET reads except GET /principals/{principalId}/commission-statement"
      - "GET /authorizations/{authorizationId}/voids-report"
      - "POST /_clock/set_current_utc"
    constraints:
      - "X-User-ID equals a Retailer.id. Every write must target a resource whose retailer chain resolves to that id — review.retailer_id, deal → presentation → review.retailer_id, authorization.retailer_id, snapshot → authorization.retailer_id, deduction.retailer_id (ERR_RETAILER_SCOPE_FORBIDDEN, 403)."
      - "POST /items/{itemId}/catalog-decision is exempt from the scope check: items are chain-agnostic."

  - name: PrincipalPortalUser
    description: "Manufacturer-side read-only portal user. Sees its own items, presentations, deals, authorizations, distribution, promotions, deductions and commission statement, and nothing else."
    identity: "entity_backed:Principal"
    exclusive_operations: []
    shared_operations:
      - "GET /principals/{principalId}, GET /items, GET /items/{itemId}, GET /presentations, GET /presentations/{presentationId}, GET /slotting-deals, GET /slotting-deals/{dealId}, GET /authorizations, GET /authorizations/{authorizationId}, GET /authorizations/{authorizationId}/voids-report, GET /distribution-snapshots, GET /distribution-snapshots/{snapshotId}, GET /promotion-events, GET /promotion-events/{promotionEventId}, GET /deductions, GET /deductions/{deductionId}, GET /commission-agreements, GET /commission-agreements/{agreementId}, GET /category-reviews, GET /category-reviews/{reviewId}, GET /retailers, GET /retailers/{retailerId}"
      - "GET /principals/{principalId}/commission-statement"
      - "POST /_clock/set_current_utc"
    constraints:
      - "X-User-ID equals a Principal.id; reads of another principal's resources return ERR_PRINCIPAL_SCOPE_FORBIDDEN (403)."
      - "Holds no write operation on the business surface: every POST/PATCH other than the clock endpoint returns ERR_ROLE_FORBIDDEN (403)."
