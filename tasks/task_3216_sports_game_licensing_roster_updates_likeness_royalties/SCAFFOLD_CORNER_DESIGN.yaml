              as: RightsOfficer
              captures: { ath_id: $.data.id }
            - call: "POST /licensing/likeness-grants"
              payload: { athlete_id: "${ath_id}", agreement_id: "${agr_id}", grant_kind: "GROUP_PA", term_start_on: "2026-01-01", term_end_on: "2026-12-31", royalty_share_bps: 100, payment_destination: "pa-11" }
              as: RightsOfficer
              captures: { grant_id: $.data.id }
            - call: "POST /licensing/likeness-grants/${grant_id}/grant"
              payload: {}
              as: RightsOfficer
            - call: "POST /licensing/roster-batches"
              payload: { season_id: "${season_id}", batch_label: "B1", submitted_by: "op-1" }
              as: RosterOperator
              as_user_id: "op-1"
              captures: { b1_id: $.data.id }
            - call: "POST /licensing/roster-batches/${b1_id}/entries"
              payload: { athlete_id: "${ath_id}", entry_kind: "ADD", overall_rating: 80 }
              as: RosterOperator
              as_user_id: "op-1"
            - call: "POST /licensing/roster-batches/${b1_id}/validate"
              payload: {}
              as: RosterOperator
              as_user_id: "op-1"
            - call: "POST /licensing/roster-batches"
              payload: { season_id: "${season_id}", batch_label: "B2", submitted_by: "op-1" }
              as: RosterOperator
              as_user_id: "op-1"
              captures: { b2_id: $.data.id }
            - call: "POST /licensing/roster-batches/${b2_id}/entries"
              payload: { athlete_id: "${ath_id}", entry_kind: "UPDATE_ATTRIBUTE", overall_rating: 81 }
              as: RosterOperator
              as_user_id: "op-1"
            - call: "POST /licensing/roster-batches/${b2_id}/validate"
              payload: {}
              as: RosterOperator
              as_user_id: "op-1"
            - call: "GET /licensing/seasons/${season_id}"
              payload: {}
              as: LiveOpsManager
              captures: { sv: $.data.version }
            - call: "POST /licensing/roster-batches/${b1_id}/publish"
              payload: { expected_season_version: "${sv}" }
              as: RosterReviewer
              as_user_id: "reviewer-1"
          trigger:
            - call: "POST /licensing/roster-batches/${b2_id}/publish"
              payload: { expected_season_version: "${sv}" }
              as: RosterReviewer
              as_user_id: "reviewer-2"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 412 with error_id == ERR_STALE_SEASON_VERSION — B1's publish bumped LiveSeason.version, so the stale expected value is rejected"
            - "RosterBatch.${b2_id}.batch_status remains VALIDATED"

