              payload: { decision: "APPROVE", comment: "Cleared for execution." }
              as: EmploymentCounsel
              as_user_id: "u-counsel-1"
            - call: "POST /owbpa-disclosures"
              payload: { plan_id: "${plan_id}" }
              as: EmploymentCounsel
              as_user_id: "u-counsel-1"
              captures: { disclosure_id: $.data.id }
            - call: "POST /selections/${sel_alice}/deliver-notice"
              payload: { script_code: "MANAGER_SCRIPT_UNION" }
              as: RestructuringLead
              as_user_id: "u-lead-1"
