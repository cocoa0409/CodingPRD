              as: OrderDesk
              as_user_id: "desk-a"
              captures: { batch_id: $.data.id }
            - call: "POST /benefits/media-orders"
              payload: { election_id: "${el_id}", transit_media_id: "${med_id}", order_batch_id: "${batch_id}", quantity: 1, coverage_start_at: "2026-08-01T00:00:00Z", coverage_end_at: "2026-08-31T00:00:00Z", expected_election_version: "${el_v}" }
              as: OrderDesk
