  # ---------------------------------------------------------------
  # Rule 4: transitive_cascade — depth>=3 and depth>=2, different triggers
  # ---------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: co_approve_three_hop_budget_cascade
        grounds:
          - state_machines.ChangeOrder.PROPOSED_to_APPROVED
          - calculations.site_budget_variance
          - calculations.program_budget_rollup
        distinguishing_aspect: |
          Depth-3 cascade triggered by change-order approval: approve mutates
          Site.approved_co_cents (link 1), the ledger mutation pushes the final
          variance ratio to 667bp so Site.budget_posture flips WITHIN -> WATCH
          (link 2), and the posture flip adds 25% of the 600000-cent overrun to
          RolloutProgram.contingency_reserved_cents, flipping the program to
          GUARDED because 150000 * 2 > pool 250000 (link 3).
        test_recipe:
          setup:
            - "Awarded site, base 9000000, allocation 10000000; program contingency_pool_cents 250000; PROPOSED change order +600000"
          setup_api_calls:
            - { call: "POST /rollout/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: ProgramDirector }
            - call: "POST /rollout/programs"
              payload: { name: "FY26 Rollout", fiscal_year: 2026, total_budget_cents: 500000000, contingency_pool_cents: 250000 }
              as: ProgramDirector
              captures: { prog: $.data.id }
            - { call: "POST /rollout/programs/${prog}/activate", payload: {}, as: ProgramDirector }
            - call: "POST /rollout/markets"
              payload: { program_id: "${prog}", name: "DFW", state_code: "TX", max_concurrent_vendor_crews: 2 }
              as: ProgramDirector
              captures: { mkt: $.data.id }
            - call: "POST /rollout/municipality-profiles"
              payload: { municipality_code: "TX-DAL", statutory_review_days: 10, observed_avg_review_days: 20, permit_validity_days: 180, fee_base_cents: 50000, fee_per_sqft_cents: 250 }
              as: PermitCoordinator
