      - name: stale_set_version_on_row_replace
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[cutpoint-rows-replace-stale-set]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Row replace carries expected_cutpoint_set_version; after a successful replace (version 1 -> 2) a second replace carrying the old version fails with 412 ERR_STALE_VERSION."
        test_recipe:
          setup: ["Cycle in SETUP; DRAFT set with one row; version captured from create response"]
