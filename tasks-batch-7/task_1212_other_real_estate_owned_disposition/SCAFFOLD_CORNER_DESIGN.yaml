            - { call: "POST /api/listing-agreements/${l_id}/activate", payload: {}, as: OREOSpecialist }
          trigger:
            - { call: "GET /api/listing-agreements", payload: { broker_id: "${b_id}" }, as: Broker, as_user_id: "${b_id}" }
