            - "the third batch returns 409 ERR_DEPLETION_RECORD_OUT_OF_ORDER because 2026-08-10 is not strictly greater than the stored maximum 2026-08-17"
            - "the closing GET reports exactly 3 depletion_records, remaining_qty == 8900, trailing_avg_usage_qty == 3700, actual_runout_date == 2026-09-14 and version == 2 - the two rejected batches wrote nothing at all"

      - name: plate_order_links_three_parents_and_each_dangling_reference_raises_its_own_404
        claim_type: cross_reference_link
        grounds:
          - endpoints[POST /plate-orders]
          - endpoints[GET /plate-orders]
          - endpoints[GET /plate-orders/{id}]
          - endpoints[POST /plate-orders/{id}/cancel]
          - validations[priority=6]
          - validations[priority=10]
          - validations[priority=11]
          - validations[priority=12]
          - errors[ERR_ARTWORK_VERSION_NOT_FOUND]
          - errors[ERR_PRINTER_NOT_FOUND]
          - errors[ERR_PRINTER_PROOF_NOT_FOUND]
          - errors[ERR_PLATE_ORDER_NOT_FOUND]
          - entities.PlateOrder.fields.printer_proof_id
          - entities.ArtworkAsset.fields.committed_plate_cost_cents
        distinguishing_aspect: |
          One request body carries three foreign keys, so the linking contract needs
          three separate refusals, each isolated by keeping the other two references
          valid: a wrong version is 404 ERR_ARTWORK_VERSION_NOT_FOUND, a wrong
          printer is 404 ERR_PRINTER_NOT_FOUND and a wrong proof is 404
          ERR_PRINTER_PROOF_NOT_FOUND. A collapsed implementation answers all three
          with whichever id it happens to look up first, or with a generic 400/422.
          The valid triple then has to do real linking work - echo all three ids,
          price the set at 163000 and charge the ledger of the asset it reaches only
          through artwork_version_id -> ArtworkAsset - and must be discoverable in
          reverse from the proof. The final call proves the path id is checked too.
