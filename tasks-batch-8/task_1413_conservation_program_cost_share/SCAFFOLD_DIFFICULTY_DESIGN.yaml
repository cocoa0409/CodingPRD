            - { call: "GET /eqip/practice-items/${item}", payload: {}, as: ProgramAdmin, captures: { cs3: $.data.certification_status, ps3: $.data.payment_status } }
            - { call: "GET /eqip/advance-payments/${adv}", payload: {}, as: ProgramAdmin, captures: { adv_st: $.data.status, adv_appl: $.data.applied_cents, adv_out: $.data.outstanding_cents } }
