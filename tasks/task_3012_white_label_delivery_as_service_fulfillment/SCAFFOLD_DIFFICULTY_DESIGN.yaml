  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: settle_reverse_restores_billing_balance_exactly
        grounds:
          - state_machines.RefundClaim.APPROVED_to_SETTLED
          - state_machines.RefundClaim.SETTLED_to_REVERSED
          - entities.Merchant.fields.billing_balance_cents
        distinguishing_aspect: "Conserved quantity: Merchant.billing_balance_cents. Forward settle debits merchant_share_cents and flips order billing to REFUNDED; the compensating reverse restores exactly the same amount and flips billing back to SETTLED — settle-then-reverse leaves balance 700, bit-identical to the pre-settle value, and merchant_share + platform_share == claimed 500 throughout."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Merchant billing 1200, split 50. o1 delivered (invoice 500, balance 700 after settle of billing). Claim CUSTOMER_UNAVAILABLE 500 APPROVED (shares 250/250)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /merchants"
              payload: { name: "CI Merchant", billing_balance_cents: 1200, default_refund_split_merchant_pct: 50, late_credit_enabled: true }
              as: PlatformAdmin
              captures: { m_id: $.data.id }
            - call: "POST /merchants/${m_id}/activate"
              payload: {}
              as: PlatformAdmin
