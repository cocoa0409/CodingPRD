scaffold_difficulty_design:

  # ===========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: criticality_neonate_panic_vs_adult_critical_high_on_same_k_value
        grounds:
          - calculations.criticality_classify
          - calculations.criticality_classify.variants.standard
          - calculations.criticality_classify.variants.neonate_override
          - entities.Patient.fields.age_band
          - entities.Result.fields.criticality
          - state_machines.Result.transitions.PROVISIONAL_to_RELEASED
        distinguishing_aspect: |
          Identical Result inputs (analyte_code=K, numeric_value=6.50, critical_high=6.00) produce
          criticality=PANIC for a NEONATE patient and criticality=CRITICAL_HIGH for an ADULT patient.
          The two variants operate on different entity domains via patient.age_band (Patient entity),
          satisfying rule 1's different-entity-domain clause when paired with instance 2 (which
          operates on LabOrder, not Patient).
        test_recipe:
          setup:
            - "Clock pinned to 2026-05-28T08:00:00Z"
            - "Two patients exist: pat_neo born 2026-05-20 (age 8 days → NEONATE) and pat_adult born 1990-01-01 (ADULT)"
            - "Two LabOrders, one per patient, each in status=ACCESSIONED with one ACCESSIONED Specimen and one COMPLETED InstrumentRun"
            - "One PROVISIONAL Result on each order with identical numeric_value=6.50, critical_high=6.00, critical_low=2.50, reference_low=3.50, reference_high=5.10"
          setup_api_calls:
            - call: "POST /clinicians"
              payload: { npi: "1000000001", full_name: "Director One", role_type: "LAB_DIRECTOR", phone_e164: "+12025550100" }
              as: Anonymous
              as_user_id: "bootstrap"
              captures: { dir_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-28T08:00:00Z" }
              as: LabDirector
              as_user_id: "${dir_id}"
            - call: "POST /clinicians"
              payload: { npi: "1000000002", full_name: "Tech One", role_type: "LAB_TECH", phone_e164: "+12025550101", backup_clinician_id: "${dir_id}" }
              as: LabDirector
              as_user_id: "${dir_id}"
              captures: { lt_id: $.data.id }
            - call: "POST /clinicians"
              payload: { npi: "1000000003", full_name: "Phleb One", role_type: "PHLEBOTOMIST", phone_e164: "+12025550102", backup_clinician_id: "${dir_id}" }
              as: LabDirector
              as_user_id: "${dir_id}"
              captures: { phleb_id: $.data.id }
            - call: "POST /clinicians"
              payload: { npi: "1000000004", full_name: "Provider One", role_type: "ORDERING_PROVIDER", phone_e164: "+12025550103", backup_clinician_id: "${dir_id}" }
              as: LabDirector
              as_user_id: "${dir_id}"
              captures: { op_id: $.data.id }
            - call: "POST /instruments"
              payload: { instrument_code: "BCM-1", analyte_panels_supported: ["CMP", "CBC", "TROP", "GLUC"], qc_buffer_minutes: 5 }
              as: LabDirector
              as_user_id: "${dir_id}"
              captures: { inst_id: $.data.id }
            - call: "POST /patients"
              payload: { mrn: "MRN-NEO001", full_name: "Neo Baby", date_of_birth: "2026-05-20" }
              as: LabTech
              as_user_id: "${lt_id}"
              captures: { pat_neo: $.data.id }
            - call: "POST /patients"
              payload: { mrn: "MRN-ADL001", full_name: "Adult One", date_of_birth: "1990-01-01" }
              as: LabTech
              as_user_id: "${lt_id}"
              captures: { pat_adult: $.data.id }
            - call: "POST /patients/${pat_neo}/lab-orders"
              payload: { ordering_clinician_id: "${op_id}", panel_code: "CMP", priority: "ROUTINE" }
              as: OrderingProvider
              as_user_id: "${op_id}"
              captures: { ord_neo: $.data.id }
            - call: "POST /patients/${pat_adult}/lab-orders"
              payload: { ordering_clinician_id: "${op_id}", panel_code: "CMP", priority: "ROUTINE" }
              as: OrderingProvider
              as_user_id: "${op_id}"
              captures: { ord_adult: $.data.id }
            - call: "POST /lab-orders/${ord_neo}/specimens"
              payload: { collector_clinician_id: "${phleb_id}", container_code: "GREEN" }
              as: Phlebotomist
              as_user_id: "${phleb_id}"
              captures: { sp_neo: $.data.id }
            - call: "POST /specimens/${sp_neo}/collect"
              payload: {}
              as: Phlebotomist
              as_user_id: "${phleb_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-28T08:10:00Z" }
              as: LabDirector
              as_user_id: "${dir_id}"
            - call: "POST /lab-orders/${ord_adult}/specimens"
              payload: { collector_clinician_id: "${phleb_id}", container_code: "GREEN" }
              as: Phlebotomist
              as_user_id: "${phleb_id}"
              captures: { sp_adult: $.data.id }
            - call: "POST /specimens/${sp_adult}/collect"
              payload: {}
              as: Phlebotomist
              as_user_id: "${phleb_id}"
            - call: "POST /specimens/${sp_neo}/transit"
              payload: {}
              as: Phlebotomist
              as_user_id: "${phleb_id}"
            - call: "POST /specimens/${sp_adult}/transit"
              payload: {}
              as: Phlebotomist
              as_user_id: "${phleb_id}"
            - call: "POST /specimens/${sp_neo}/accession"
              payload: {}
              as: LabTech
              as_user_id: "${lt_id}"
            - call: "POST /specimens/${sp_adult}/accession"
              payload: {}
              as: LabTech
              as_user_id: "${lt_id}"
            - call: "POST /instrument-runs"
              payload: { instrument_id: "${inst_id}", specimen_id: "${sp_neo}", scheduled_start: "2026-05-28T09:00:00Z", scheduled_end: "2026-05-28T09:20:00Z" }
              as: LabTech
              as_user_id: "${lt_id}"
              captures: { run_neo: $.data.id }
            - call: "POST /instrument-runs/${run_neo}/complete"
              payload: {}
              as: LabTech
              as_user_id: "${lt_id}"
            - call: "POST /instrument-runs"
              payload: { instrument_id: "${inst_id}", specimen_id: "${sp_adult}", scheduled_start: "2026-05-28T09:30:00Z", scheduled_end: "2026-05-28T09:50:00Z" }
              as: LabTech
              as_user_id: "${lt_id}"
              captures: { run_adult: $.data.id }
            - call: "POST /instrument-runs/${run_adult}/complete"
              payload: {}
              as: LabTech
              as_user_id: "${lt_id}"
            - call: "POST /results"
              payload: { lab_order_id: "${ord_neo}", specimen_id: "${sp_neo}", run_id: "${run_neo}", analyte_code: "K", numeric_value: 6.50, unit: "mmol/L", reference_low: 3.50, reference_high: 5.10, critical_low: 2.50, critical_high: 6.00 }
              as: LabTech
              as_user_id: "${lt_id}"
              captures: { res_neo: $.data.id, ord_neo_v: $.data.version }
            - call: "POST /results"
              payload: { lab_order_id: "${ord_adult}", specimen_id: "${sp_adult}", run_id: "${run_adult}", analyte_code: "K", numeric_value: 6.50, unit: "mmol/L", reference_low: 3.50, reference_high: 5.10, critical_low: 2.50, critical_high: 6.00 }
              as: LabTech
              as_user_id: "${lt_id}"
              captures: { res_adult: $.data.id }
            - call: "GET /lab-orders/${ord_neo}"
              payload: {}
              as: LabTech
              as_user_id: "${lt_id}"
              captures: { ord_neo_version: $.data.version }
            - call: "GET /lab-orders/${ord_adult}"
              payload: {}
              as: LabTech
              as_user_id: "${lt_id}"
              captures: { ord_adult_version: $.data.version }
          trigger:
            - call: "POST /results/${res_neo}/release"
              payload: { expected_lab_order_version: "${ord_neo_version}" }
              as: LabTech
              as_user_id: "${lt_id}"
              captures: { res_neo_after: $.data.criticality }
            - call: "POST /results/${res_adult}/release"
              payload: { expected_lab_order_version: "${ord_adult_version}" }
              as: LabTech
              as_user_id: "${lt_id}"
              captures: { res_adult_after: $.data.criticality }
          assert:
            - "Result.${res_neo}.criticality == 'PANIC'"
            - "Result.${res_adult}.criticality == 'CRITICAL_HIGH'"
            - "Patient.${pat_neo}.age_band == 'NEONATE'"
            - "Patient.${pat_adult}.age_band == 'ADULT'"

      - name: tat_clinical_chronology_vs_lab_processing_on_lab_order
        grounds:
          - calculations.turn_around_time_compute
          - calculations.turn_around_time_compute.variants.clinical_chronology
          - calculations.turn_around_time_compute.variants.lab_processing
          - entities.LabOrder.fields.turn_around_time_minutes
        distinguishing_aspect: |
          Identical LabOrder.ordered_at, Specimen.accessioned_at, and Result.released_at produce
          turn_around_time_minutes=90 for the clinical_chronology variant (ordered → released) and
          60 for the lab_processing variant (accessioned → released) — a 30-minute divergence on
          the same row. Operates on LabOrder (not Patient or Result), distinct entity domain from
          instance 1.
        test_recipe:
          setup:
            - "Clock initially 2026-05-28T08:00:00Z; will be advanced during the chain"
            - "A LabOrder ord_t was ordered at exactly 08:00:00Z (current clock at POST)"
            - "Its sole Specimen sp_t accessioned at 08:30:00Z (30 min later)"
            - "Its Result res_t was created at 08:35:00Z and released at exactly 09:30:00Z (60 min after accession, 90 min after order)"
          setup_api_calls:
            - call: "POST /clinicians"
              payload: { npi: "2000000001", full_name: "Director TAT", role_type: "LAB_DIRECTOR", phone_e164: "+12025550200" }
              as: Anonymous
              as_user_id: "bootstrap"
              captures: { dir_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-28T08:00:00Z" }
              as: LabDirector
              as_user_id: "${dir_id}"
            - call: "POST /clinicians"
              payload: { npi: "2000000002", full_name: "Tech TAT", role_type: "LAB_TECH", phone_e164: "+12025550201", backup_clinician_id: "${dir_id}" }
              as: LabDirector
              as_user_id: "${dir_id}"
              captures: { lt_id: $.data.id }
            - call: "POST /clinicians"
              payload: { npi: "2000000003", full_name: "Phleb TAT", role_type: "PHLEBOTOMIST", phone_e164: "+12025550202", backup_clinician_id: "${dir_id}" }
              as: LabDirector
              as_user_id: "${dir_id}"
              captures: { phleb_id: $.data.id }
            - call: "POST /clinicians"
              payload: { npi: "2000000004", full_name: "Provider TAT", role_type: "ORDERING_PROVIDER", phone_e164: "+12025550203", backup_clinician_id: "${dir_id}" }
              as: LabDirector
              as_user_id: "${dir_id}"
              captures: { op_id: $.data.id }
            - call: "POST /instruments"
              payload: { instrument_code: "BCM-T1", analyte_panels_supported: ["GLUC"], qc_buffer_minutes: 5 }
              as: LabDirector
              as_user_id: "${dir_id}"
              captures: { inst_id: $.data.id }
            - call: "POST /patients"
              payload: { mrn: "MRN-TAT001", full_name: "TAT Patient", date_of_birth: "1985-05-05" }
              as: LabTech
              as_user_id: "${lt_id}"
              captures: { pat_id: $.data.id }
            - call: "POST /patients/${pat_id}/lab-orders"
              payload: { ordering_clinician_id: "${op_id}", panel_code: "GLUC", priority: "ROUTINE" }
              as: OrderingProvider
              as_user_id: "${op_id}"
              captures: { ord_t: $.data.id }
            - call: "POST /lab-orders/${ord_t}/specimens"
              payload: { collector_clinician_id: "${phleb_id}", container_code: "GRAY" }
              as: Phlebotomist
              as_user_id: "${phleb_id}"
              captures: { sp_t: $.data.id }
            - call: "POST /specimens/${sp_t}/collect"
              payload: {}
              as: Phlebotomist
              as_user_id: "${phleb_id}"
            - call: "POST /specimens/${sp_t}/transit"
              payload: {}
              as: Phlebotomist
              as_user_id: "${phleb_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-28T08:30:00Z" }
              as: LabDirector
              as_user_id: "${dir_id}"
            - call: "POST /specimens/${sp_t}/accession"
              payload: {}
              as: LabTech
              as_user_id: "${lt_id}"
            - call: "POST /instrument-runs"
              payload: { instrument_id: "${inst_id}", specimen_id: "${sp_t}", scheduled_start: "2026-05-28T08:35:00Z", scheduled_end: "2026-05-28T08:55:00Z" }
              as: LabTech
              as_user_id: "${lt_id}"
              captures: { run_t: $.data.id }
            - call: "POST /instrument-runs/${run_t}/complete"
              payload: {}
              as: LabTech
              as_user_id: "${lt_id}"
            - call: "POST /results"
              payload: { lab_order_id: "${ord_t}", specimen_id: "${sp_t}", run_id: "${run_t}", analyte_code: "GLUCOSE", numeric_value: 90.00, unit: "mg/dL", reference_low: 70.00, reference_high: 110.00, critical_low: 40.00, critical_high: 500.00 }
              as: LabTech
              as_user_id: "${lt_id}"
              captures: { res_t: $.data.id }
            - call: "GET /lab-orders/${ord_t}"
              payload: {}
              as: LabTech
              as_user_id: "${lt_id}"
              captures: { ord_t_version: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-28T09:30:00Z" }
              as: LabDirector
              as_user_id: "${dir_id}"
            - call: "POST /results/${res_t}/release"
              payload: { expected_lab_order_version: "${ord_t_version}" }
              as: LabTech
              as_user_id: "${lt_id}"
          trigger:
            - call: "GET /lab-orders/${ord_t}"
              payload: {}
              as: LabTech
              as_user_id: "${lt_id}"
              captures: { tat_default: $.data.turn_around_time_minutes }
            - call: "GET /lab-orders/${ord_t}?tat_variant=lab_processing"
              payload: {}
              as: LabTech
              as_user_id: "${lt_id}"
              captures: { tat_lab: $.data.turn_around_time_minutes }
          assert:
            - "LabOrder.${ord_t}.turn_around_time_minutes == 90"
            - "GET /lab-orders/${ord_t}?tat_variant=lab_processing -> data.turn_around_time_minutes == 60"
            - "LabOrder.${ord_t}.status == 'RESULTED'"

  # ===========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: criticality_classify_three_input_nonlinear_with_age_branch
        grounds:
          - calculations.criticality_classify
          - calculations.criticality_classify.constants.NEONATE_K_PANIC_HIGH
          - calculations.criticality_classify.constants.NEONATE_GLUCOSE_PANIC_LOW
          - entities.Result.fields.criticality
          - entities.Patient.fields.age_band
        distinguishing_aspect: |
          MODE (a) — formula has 4 inputs (numeric_value, critical_low/high, reference_low/high,
          patient.age_band, analyte_code) with non-linear interaction: tier selection (NORMAL /
          ABNORMAL / CRITICAL_LOW / CRITICAL_HIGH) then conditional NEONATE branch that overrides
          the tier to PANIC for specific analyte+value combinations. Distinct from instance 2
          which uses MODE (c) (pinned evaluation order on TAT timestamps).
        test_recipe:
          setup:
            - "Clock pinned to 2026-05-28T08:00:00Z"
            - "Three ACCESSIONED LabOrders, each with one COMPLETED InstrumentRun and a PROVISIONAL Result"
            - "Result A: ADULT, K, numeric_value=4.50, ref [3.5,5.1], crit [2.5,6.0] → expect NORMAL"
            - "Result B: ADULT, K, numeric_value=6.00, ref [3.5,5.1], crit [2.5,6.0] → numeric_value >= critical_high → CRITICAL_HIGH"
            - "Result C: NEONATE, GLUCOSE, numeric_value=40.00, ref [70,110], crit [40,500] → standard would give CRITICAL_LOW; NEONATE override -> PANIC because numeric_value <= NEONATE_GLUCOSE_PANIC_LOW"
          setup_api_calls:
            - call: "POST /clinicians"
              payload: { npi: "3000000001", full_name: "Director Comb", role_type: "LAB_DIRECTOR", phone_e164: "+12025550300" }
              as: Anonymous
              as_user_id: "bootstrap"
              captures: { dir_id: $.data.id }
