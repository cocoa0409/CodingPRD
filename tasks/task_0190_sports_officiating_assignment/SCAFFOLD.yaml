    side_effects: ["CrewSlot -> OFFERED; Assignment created OFFERED with frozen distance_miles + provisional_pay_cents", "increments Game.version by 1"]

  - method: GET
    path: "/assignments"
    description: "List/filter assignments by any of their FKs (game_id, official_id, crew_slot_id) — collapses all Assignment FKs into one filtered list"
    roles: [LeagueAdmin, Assignor, Official, Evaluator]
    code: 200
    input: ["game_id?", "official_id?", "crew_slot_id?", "limit?", "offset?"]
    output: "Assignment[]"
    side_effects: []

  - method: GET
    path: "/assignments/{id}"
    description: "Get an assignment"
    roles: [LeagueAdmin, Assignor, Official, Evaluator]
    code: 200
    input: []
    output: Assignment
    side_effects: []

