              payload: { provider_name: "X", record_type: "DIAGNOSTIC", severity_score: 70, confirms_qualifying_injury: true }
              as: RecordsAnalyst
              captures: { r1_high: $.data.id }
            - call: "POST /settlement-programs/${pid_high}/claims/${cid_high}/medical-records"
