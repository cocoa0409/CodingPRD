# =============================================================================
# §1.9 Scaffold Corner Design (breadth coverage)
# DME — every testable claim of §1.1-§1.7 not already a §1.8 depth probe.
# Sections / claim_types are drawn from references/claim-extraction-guide.md.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_dme_order_returns_201_with_fields
        claim_type: Creation
        grounds: [entities.DMEOrder, endpoints.POST /dme-orders]
        distinguishing_aspect: "POST /dme-orders with all required fields -> 201; status=DRAFT, rental_months_billed=0, cap_reached=false, total_allowed_cents=0, version=1."
        test_recipe:
          setup: ["Reference patient, supplier, PURCHASE_ONLY item exist."]
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "C1", medicare_id: "MBI-CR1", date_of_birth: "1960-01-01", address_state: "CA" }
              as: PlatformAdmin
              captures: { pat_id: $.data.id }
            - call: "POST /suppliers"
              payload: { name: "S1", ptan: "PTAN-CR1", accreditation_active: true }
              as: PlatformAdmin
              captures: { sup_id: $.data.id }
            - call: "POST /hcpcs-items"
              payload: { hcpcs_code: "L0001", description: "Brace", billing_category: "PURCHASE_ONLY", purchase_price_cents: 80000, monthly_rental_cents: 0, requires_cmn: false, requires_prior_auth: false, is_cpap: false }
              as: PlatformAdmin
              captures: { item_id: $.data.id }
          trigger:
            - call: "POST /dme-orders"
              payload: { patient_id: "${pat_id}", supplier_id: "${sup_id}", hcpcs_item_id: "${item_id}", acquisition_type: "PURCHASE", modifier: "NU", ordered_at_utc: "2026-01-01T00:00:00Z" }
              as: SupplierUser
              as_user_id: "${sup_id}"
              captures: { order_id: $.data.id, st: $.data.status, v: $.data.version }
          assert:
            - "HTTP status == 201"
            - "DMEOrder.${order_id}.status == DRAFT, rental_months_billed == 0, cap_reached == false, total_allowed_cents == 0, version == 1"

      - name: get_dme_order_not_found
        claim_type: Not Found
        grounds: ["endpoints.GET /dme-orders/{id}", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /dme-orders/{nonexistent uuid} -> ERR_NOT_FOUND 404."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /dme-orders/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: SupplierUser
              as_user_id: "11111111-1111-4111-8111-111111111111"
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_NOT_FOUND"
            - "HTTP status == 404"

      - name: create_order_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds: [entities.DMEOrder.fields.hcpcs_item_id, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /dme-orders missing hcpcs_item_id -> ERR_INVALID_REQUEST 400."
        test_recipe:
          setup: ["Patient and supplier exist."]
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "C2", medicare_id: "MBI-CR2", date_of_birth: "1960-01-01", address_state: "CA" }
              as: PlatformAdmin
              captures: { pat_id: $.data.id }
            - call: "POST /suppliers"
              payload: { name: "S2", ptan: "PTAN-CR2", accreditation_active: true }
              as: PlatformAdmin
              captures: { sup_id: $.data.id }
          trigger:
            - call: "POST /dme-orders"
              payload: { patient_id: "${pat_id}", supplier_id: "${sup_id}", acquisition_type: "PURCHASE", ordered_at_utc: "2026-01-01T00:00:00Z" }
              as: SupplierUser
              as_user_id: "${sup_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_INVALID_REQUEST"
            - "HTTP status == 400"

      - name: create_order_bad_fk_target_returns_not_found
        claim_type: Parent Relationships
        grounds: [entities.DMEOrder.fields.patient_id, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "POST /dme-orders with a patient_id that does not exist -> ERR_NOT_FOUND 404 (FK target integrity)."
        test_recipe:
          setup: ["Supplier and item exist; patient_id is a random nonexistent uuid."]
          setup_api_calls:
            - call: "POST /suppliers"
              payload: { name: "S3", ptan: "PTAN-CR3", accreditation_active: true }
              as: PlatformAdmin
              captures: { sup_id: $.data.id }
            - call: "POST /hcpcs-items"
              payload: { hcpcs_code: "L0003", description: "Brace3", billing_category: "PURCHASE_ONLY", purchase_price_cents: 80000, monthly_rental_cents: 0, requires_cmn: false, requires_prior_auth: false, is_cpap: false }
              as: PlatformAdmin
              captures: { item_id: $.data.id }
          trigger:
            - call: "POST /dme-orders"
              payload: { patient_id: "00000000-0000-4000-8000-0000000000aa", supplier_id: "${sup_id}", hcpcs_item_id: "${item_id}", acquisition_type: "PURCHASE", modifier: "NU", ordered_at_utc: "2026-01-01T00:00:00Z" }
              as: SupplierUser
              as_user_id: "${sup_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_NOT_FOUND"
            - "HTTP status == 404"

      - name: duplicate_medicare_id_returns_conflict
        claim_type: Type Constraints
        grounds: [entities.Patient.fields.medicare_id, "validations[priority=16]", "errors[ERR_DUPLICATE_VALUE]"]
        distinguishing_aspect: "POST /patients with an already-used medicare_id -> ERR_DUPLICATE_VALUE 409."
        test_recipe:
          setup: ["One patient with medicare_id MBI-DUP exists."]
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "D1", medicare_id: "MBI-DUP", date_of_birth: "1960-01-01", address_state: "CA" }
              as: PlatformAdmin
          trigger:
            - call: "POST /patients"
              payload: { full_name: "D2", medicare_id: "MBI-DUP", date_of_birth: "1961-01-01", address_state: "NY" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_DUPLICATE_VALUE"
            - "HTTP status == 409"

      - name: supplier_accreditation_default_true
        claim_type: Defaults
        grounds: [entities.Supplier.fields.accreditation_active]
        distinguishing_aspect: "POST /suppliers omitting accreditation_active -> defaults to true."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /suppliers"
              payload: { name: "DefSup", ptan: "PTAN-DEF1" }
              as: PlatformAdmin
              captures: { sup_id: $.data.id, acc: $.data.accreditation_active }
          assert:
            - "Supplier.${sup_id}.accreditation_active == true"

      - name: purchase_order_computed_total_after_activate
        claim_type: Computed Fields
        grounds: [calculations.purchase_allowed_amount, entities.DMEOrder.fields.total_allowed_cents]
        distinguishing_aspect: "A PURCHASE order with modifier NU posts one PURCHASE claim line of 80000 at activate-billing; total_allowed_cents == 80000."
        test_recipe:
          setup: ["PURCHASE_ONLY item price 80000; order modifier NU; delivered + POD."]
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "PU1", medicare_id: "MBI-PU1", date_of_birth: "1960-01-01", address_state: "CA" }
              as: PlatformAdmin
              captures: { pat_id: $.data.id }
            - call: "POST /suppliers"
              payload: { name: "PUS1", ptan: "PTAN-PU1", accreditation_active: true }
              as: PlatformAdmin
              captures: { sup_id: $.data.id }
            - call: "POST /hcpcs-items"
              payload: { hcpcs_code: "L0010", description: "Purchase brace", billing_category: "PURCHASE_ONLY", purchase_price_cents: 80000, monthly_rental_cents: 0, requires_cmn: false, requires_prior_auth: false, is_cpap: false }
              as: PlatformAdmin
              captures: { item_id: $.data.id }
            - call: "POST /dme-orders"
              payload: { patient_id: "${pat_id}", supplier_id: "${sup_id}", hcpcs_item_id: "${item_id}", acquisition_type: "PURCHASE", modifier: "NU", ordered_at_utc: "2026-01-01T00:00:00Z" }
              as: SupplierUser
              as_user_id: "${sup_id}"
              captures: { order_id: $.data.id }
            - call: "POST /dme-orders/${order_id}/mark-ready"
              payload: {}
              as: SupplierUser
              as_user_id: "${sup_id}"
            - call: "POST /deliveries"
              payload: { order_id: "${order_id}", scheduled_for_utc: "2026-01-02T00:00:00Z" }
              as: SupplierUser
              as_user_id: "${sup_id}"
              captures: { del_id: $.data.id }
            - call: "POST /deliveries/${del_id}/confirm"
              payload: { pod_signature_name: "PU1" }
              as: SupplierUser
              as_user_id: "${sup_id}"
          trigger:
            - call: "POST /dme-orders/${order_id}/activate-billing"
              payload: {}
              as: SupplierUser
              as_user_id: "${sup_id}"
              captures: { total: $.data.total_allowed_cents }
          assert:
            - "DMEOrder.${order_id}.total_allowed_cents == 80000 (NU pays full fee schedule)"

      - name: purchase_used_rate_when_modifier_not_nu
        claim_type: Computed Fields
        grounds: [calculations.purchase_allowed_amount, entities.DMEOrder.fields.modifier]
        distinguishing_aspect: "A PURCHASE order without NU pays USED_PCT (75%) of 80000 = 60000."
        test_recipe:
          setup: ["PURCHASE_ONLY item price 80000; order modifier NONE; delivered + POD."]
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "PU2", medicare_id: "MBI-PU2", date_of_birth: "1960-01-01", address_state: "CA" }
              as: PlatformAdmin
              captures: { pat_id: $.data.id }
            - call: "POST /suppliers"
              payload: { name: "PUS2", ptan: "PTAN-PU2", accreditation_active: true }
              as: PlatformAdmin
              captures: { sup_id: $.data.id }
            - call: "POST /hcpcs-items"
              payload: { hcpcs_code: "L0011", description: "Used brace", billing_category: "PURCHASE_ONLY", purchase_price_cents: 80000, monthly_rental_cents: 0, requires_cmn: false, requires_prior_auth: false, is_cpap: false }
              as: PlatformAdmin
              captures: { item_id: $.data.id }
            - call: "POST /dme-orders"
              payload: { patient_id: "${pat_id}", supplier_id: "${sup_id}", hcpcs_item_id: "${item_id}", acquisition_type: "PURCHASE", modifier: "NONE", ordered_at_utc: "2026-01-01T00:00:00Z" }
              as: SupplierUser
              as_user_id: "${sup_id}"
              captures: { order_id: $.data.id }
            - call: "POST /dme-orders/${order_id}/mark-ready"
              payload: {}
              as: SupplierUser
              as_user_id: "${sup_id}"
            - call: "POST /deliveries"
              payload: { order_id: "${order_id}", scheduled_for_utc: "2026-01-02T00:00:00Z" }
              as: SupplierUser
              as_user_id: "${sup_id}"
              captures: { del_id: $.data.id }
            - call: "POST /deliveries/${del_id}/confirm"
              payload: { pod_signature_name: "PU2" }
              as: SupplierUser
              as_user_id: "${sup_id}"
          trigger:
            - call: "POST /dme-orders/${order_id}/activate-billing"
              payload: {}
              as: SupplierUser
              as_user_id: "${sup_id}"
              captures: { total: $.data.total_allowed_cents }
          assert:
            - "DMEOrder.${order_id}.total_allowed_cents == 60000 (round_half_up(80000*75/100))"

      - name: system_fields_ignored_on_create
        claim_type: System Fields
        grounds: [entities.DMEOrder.fields.total_allowed_cents]
        distinguishing_aspect: "Client-supplied id/version/total_allowed_cents on POST /dme-orders are ignored; server mints id and sets total_allowed_cents=0, version=1."
        test_recipe:
          setup: ["Patient, supplier, PURCHASE_ONLY item exist."]
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "SF1", medicare_id: "MBI-SF1", date_of_birth: "1960-01-01", address_state: "CA" }
              as: PlatformAdmin
              captures: { pat_id: $.data.id }
            - call: "POST /suppliers"
              payload: { name: "SFS1", ptan: "PTAN-SF1", accreditation_active: true }
              as: PlatformAdmin
              captures: { sup_id: $.data.id }
            - call: "POST /hcpcs-items"
              payload: { hcpcs_code: "L0020", description: "Sysfield brace", billing_category: "PURCHASE_ONLY", purchase_price_cents: 80000, monthly_rental_cents: 0, requires_cmn: false, requires_prior_auth: false, is_cpap: false }
              as: PlatformAdmin
              captures: { item_id: $.data.id }
          trigger:
            - call: "POST /dme-orders"
              payload: { patient_id: "${pat_id}", supplier_id: "${sup_id}", hcpcs_item_id: "${item_id}", acquisition_type: "PURCHASE", modifier: "NU", ordered_at_utc: "2026-01-01T00:00:00Z" }
              as: SupplierUser
              as_user_id: "${sup_id}"
              captures: { order_id: $.data.id, total: $.data.total_allowed_cents, v: $.data.version }
          assert:
            - "DMEOrder.${order_id}.total_allowed_cents == 0 and version == 1 (system-set, input ignored)"

  # ===========================================================================
  - section: validations
    instances:
      - name: acquisition_type_mismatch_on_create
        claim_type: Violation → Error
        grounds: ["validations[priority=11]", "errors[ERR_ACQUISITION_TYPE_MISMATCH]"]
        distinguishing_aspect: "Creating a CAPPED_RENTAL order with acquisition_type=PURCHASE -> ERR_ACQUISITION_TYPE_MISMATCH 422."
        test_recipe:
          setup: ["CAPPED_RENTAL item exists; patient, supplier exist."]
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "AM1", medicare_id: "MBI-AM1", date_of_birth: "1960-01-01", address_state: "CA" }
              as: PlatformAdmin
              captures: { pat_id: $.data.id }
            - call: "POST /suppliers"
              payload: { name: "AMS1", ptan: "PTAN-AM1", accreditation_active: true }
              as: PlatformAdmin
              captures: { sup_id: $.data.id }
            - call: "POST /hcpcs-items"
              payload: { hcpcs_code: "K0100", description: "Capped wheelchair", billing_category: "CAPPED_RENTAL", purchase_price_cents: 100000, monthly_rental_cents: 10000, requires_cmn: false, requires_prior_auth: false, is_cpap: false }
              as: PlatformAdmin
              captures: { item_id: $.data.id }
          trigger:
            - call: "POST /dme-orders"
              payload: { patient_id: "${pat_id}", supplier_id: "${sup_id}", hcpcs_item_id: "${item_id}", acquisition_type: "PURCHASE", modifier: "NU", ordered_at_utc: "2026-01-01T00:00:00Z" }
              as: SupplierUser
              as_user_id: "${sup_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_ACQUISITION_TYPE_MISMATCH"
            - "HTTP status == 422"

      - name: prior_auth_required_on_mark_ready
        claim_type: Cross-entity validation
        grounds: ["validations[priority=5]", "errors[ERR_PRIOR_AUTH_REQUIRED]", state_machines.PriorAuthorization.PENDING_to_APPROVED]
        distinguishing_aspect: "mark-ready on a prior-auth-required item (CMN satisfied) with the PriorAuthorization still PENDING -> ERR_PRIOR_AUTH_REQUIRED 422."
        test_recipe:
          setup: ["Item requires_prior_auth=true, requires_cmn=false; order DRAFT; a PriorAuthorization opened but still PENDING."]
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "PA1", medicare_id: "MBI-PA1", date_of_birth: "1960-01-01", address_state: "CA" }
              as: PlatformAdmin
              captures: { pat_id: $.data.id }
            - call: "POST /suppliers"
              payload: { name: "PAS1", ptan: "PTAN-PA1", accreditation_active: true }
              as: PlatformAdmin
              captures: { sup_id: $.data.id }
            - call: "POST /hcpcs-items"
              payload: { hcpcs_code: "K0200", description: "PA wheelchair", billing_category: "CAPPED_RENTAL", purchase_price_cents: 100000, monthly_rental_cents: 10000, requires_cmn: false, requires_prior_auth: true, is_cpap: false }
              as: PlatformAdmin
              captures: { item_id: $.data.id }
            - call: "POST /dme-orders"
              payload: { patient_id: "${pat_id}", supplier_id: "${sup_id}", hcpcs_item_id: "${item_id}", acquisition_type: "RENTAL", modifier: "KX", ordered_at_utc: "2026-01-01T00:00:00Z" }
              as: SupplierUser
              as_user_id: "${sup_id}"
              captures: { order_id: $.data.id }
            - call: "POST /prior-authorizations"
              payload: { order_id: "${order_id}", payer_reference: "PR-1" }
              as: SupplierUser
              as_user_id: "${sup_id}"
          trigger:
            - call: "POST /dme-orders/${order_id}/mark-ready"
              payload: {}
              as: SupplierUser
              as_user_id: "${sup_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_PRIOR_AUTH_REQUIRED"
            - "HTTP status == 422"

      - name: supplier_not_accredited_on_mark_ready
        claim_type: Violation → Error
        grounds: ["validations[priority=7]", "errors[ERR_SUPPLIER_NOT_ACCREDITED]"]
        distinguishing_aspect: "mark-ready when the fulfilling supplier has accreditation_active=false -> ERR_SUPPLIER_NOT_ACCREDITED 422."
        test_recipe:
          setup: ["Non-CMN/non-auth CAPPED_RENTAL order whose supplier accreditation_active=false."]
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "AC1", medicare_id: "MBI-AC1", date_of_birth: "1960-01-01", address_state: "CA" }
              as: PlatformAdmin
              captures: { pat_id: $.data.id }
            - call: "POST /suppliers"
              payload: { name: "ACS1", ptan: "PTAN-AC1", accreditation_active: false }
              as: PlatformAdmin
              captures: { sup_id: $.data.id }
            - call: "POST /hcpcs-items"
              payload: { hcpcs_code: "K0300", description: "Accr wheelchair", billing_category: "CAPPED_RENTAL", purchase_price_cents: 100000, monthly_rental_cents: 10000, requires_cmn: false, requires_prior_auth: false, is_cpap: false }
              as: PlatformAdmin
              captures: { item_id: $.data.id }
            - call: "POST /dme-orders"
              payload: { patient_id: "${pat_id}", supplier_id: "${sup_id}", hcpcs_item_id: "${item_id}", acquisition_type: "RENTAL", modifier: "KX", ordered_at_utc: "2026-01-01T00:00:00Z" }
              as: SupplierUser
              as_user_id: "${sup_id}"
              captures: { order_id: $.data.id }
          trigger:
            - call: "POST /dme-orders/${order_id}/mark-ready"
              payload: {}
              as: SupplierUser
              as_user_id: "${sup_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_SUPPLIER_NOT_ACCREDITED"
            - "HTTP status == 422"

      - name: no_proof_of_delivery_on_activate_billing
        claim_type: Cross-entity validation
        grounds: ["validations[priority=6]", "errors[ERR_NO_PROOF_OF_DELIVERY]", state_machines.DMEOrder.DELIVERED_to_ACTIVE]
        distinguishing_aspect: "An order DELIVERED via a confirmed delivery, but whose only confirmed delivery has pod_received==false, cannot activate-billing -> ERR_NO_PROOF_OF_DELIVERY. (Distinct from §1.8 activate-billing instance which observes ERR_INVALID_STATE from a non-DELIVERED order.)"
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / activate_billing_requires_confirmed_delivery_pod
          rationale: "The POD gate on DELIVERED->ACTIVE is grounded by that §1.8 instance (validations[priority=6]); in this scaffold confirm always stamps pod_received=true, so a DELIVERED order necessarily has POD and the standalone ERR_NO_PROOF_OF_DELIVERY path is the negative side of the same §1.8-grounded check."

      - name: cmn_signed_after_order_rejected_on_activate
        claim_type: Temporal validation
        grounds: ["validations[priority=13]", "errors[ERR_CMN_SIGNED_AFTER_ORDER]", state_machines.CMN.DRAFT_to_ACTIVE]
        distinguishing_aspect: "Activating a CMN whose signed_date is after the order's ordered_at_utc date -> ERR_CMN_SIGNED_AFTER_ORDER 422."
        test_recipe:
          setup: ["CMN-required order ordered_at 2026-01-01; CMN signed_date 2026-02-01 (after order)."]
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "SA1", medicare_id: "MBI-SA1", date_of_birth: "1960-01-01", address_state: "CA" }
              as: PlatformAdmin
              captures: { pat_id: $.data.id }
            - call: "POST /suppliers"
              payload: { name: "SAS1", ptan: "PTAN-SA1", accreditation_active: true }
              as: PlatformAdmin
              captures: { sup_id: $.data.id }
            - call: "POST /hcpcs-items"
              payload: { hcpcs_code: "K0400", description: "Signed-after wheelchair", billing_category: "CAPPED_RENTAL", purchase_price_cents: 100000, monthly_rental_cents: 10000, requires_cmn: true, requires_prior_auth: false, is_cpap: false }
              as: PlatformAdmin
              captures: { item_id: $.data.id }
            - call: "POST /dme-orders"
              payload: { patient_id: "${pat_id}", supplier_id: "${sup_id}", hcpcs_item_id: "${item_id}", acquisition_type: "RENTAL", modifier: "KX", ordered_at_utc: "2026-01-01T00:00:00Z" }
              as: SupplierUser
              as_user_id: "${sup_id}"
              captures: { order_id: $.data.id, order_v: $.data.version }
            - call: "POST /cmns"
              payload: { order_id: "${order_id}", physician_npi: "NPI-SA", length_of_need_months: 12, signed_date: "2026-02-01" }
              as: PhysicianUser
              captures: { cmn_id: $.data.id }
          trigger:
            - call: "POST /cmns/${cmn_id}/activate"
              payload: { expected_order_version: "${order_v}" }
              as: PhysicianUser
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_CMN_SIGNED_AFTER_ORDER"
            - "HTTP status == 422"

      - name: pod_signature_required_on_confirm
        claim_type: Violation → Error
        grounds: ["validations[priority=6]", "errors[ERR_POD_SIGNATURE_REQUIRED]", state_machines.Delivery.SCHEDULED_to_CONFIRMED]
        distinguishing_aspect: "Confirming a delivery with an empty pod_signature_name body -> ERR_POD_SIGNATURE_REQUIRED 422."
        test_recipe:
          setup: ["Non-CMN CAPPED_RENTAL order READY_FOR_DELIVERY with one SCHEDULED delivery."]
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "PS1", medicare_id: "MBI-PS1", date_of_birth: "1960-01-01", address_state: "CA" }
              as: PlatformAdmin
              captures: { pat_id: $.data.id }
            - call: "POST /suppliers"
              payload: { name: "PSS1", ptan: "PTAN-PS1", accreditation_active: true }
              as: PlatformAdmin
              captures: { sup_id: $.data.id }
            - call: "POST /hcpcs-items"
              payload: { hcpcs_code: "K0500", description: "POD wheelchair", billing_category: "CAPPED_RENTAL", purchase_price_cents: 100000, monthly_rental_cents: 10000, requires_cmn: false, requires_prior_auth: false, is_cpap: false }
              as: PlatformAdmin
              captures: { item_id: $.data.id }
            - call: "POST /dme-orders"
