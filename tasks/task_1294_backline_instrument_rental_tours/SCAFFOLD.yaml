scenario: |
  Backline & Instrument Rental for Tours (backline rental company): gear catalog & availability across dates/cities, rider fulfillment & substitution approval, delivery/pickup logistics & tech labor, damage assessment & repair charge, cartage & flight case management, cross-rental from partner vendors, insurance & deposit handling, maintenance cycle between rentals

domain_name: backline-tour-rental
api_prefix: /backline

complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation
  entity_topology: hybrid
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
  role_model: hierarchical_override
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Artist
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: Artist or band legal name used on contracts
      - name: tier
        type: enum
        source: input
        description: Commercial tier driving deposit policy
        constraints: "enum {STANDARD, PREMIUM, PLATINUM}; default STANDARD"
        default: STANDARD
      - name: deposit_credit_cents
        type: integer
        source: computed
        description: "Running deposit balance in cents: sum of held deposits minus forfeited/returned amounts; starts 0"
        default: 0
      - name: deposit_waived
        type: boolean
        source: input
        description: "PLATINUM artists may have deposit waived by OpsManager; when true, required deposit computes to 0"
        default: false
      - name: risk_score
        type: integer
        source: computed
        description: "0-100 risk score derived from damage claim history; higher = riskier; drives insurance surcharge eligibility"

  - name: Tour
    parent: null
    common_fields: true
    fields:
      - name: artist_id
        type: string
        source: input
        description: "FK -> Artist.id; the artist headlining this tour"
      - name: name
        type: string
        source: input
        description: Tour display name
      - name: status
        type: enum
        source: system
        description: "Tour lifecycle; DRAFT on creation"
        constraints: "enum {DRAFT, ACTIVE, COMPLETED, CANCELLED}"
      - name: start_date
        type: datetime
        source: input
        description: "First tour day (date granularity, UTC midnight)"
      - name: end_date
        type: datetime
        source: input
        description: "Last tour day inclusive (date granularity, UTC midnight); must be >= start_date"
      - name: insurance_policy_id
        type: string
        source: input
        description: "External insurance policy reference; required before activation unless artist.deposit_waived is true"
      - name: projected_rental_fee_cents
        type: integer
        source: computed
        description: "Forward-looking fee over CONFIRMED+DRAFT reservation lines, computed at quote time"
        default: 0
      - name: final_settlement_cents
        type: integer
        source: computed
        description: "Chronological settlement total computed at tour completion from delivered+returned lines minus credits"
        default: 0
      - name: stop_count
        type: integer
        source: computed
        description: "Denormalized count of TourStop children; reconciled on every stop create/delete"
        default: 0

  - name: TourStop
    parent: Tour
    common_fields: true
    fields:
      - name: tour_id
        type: string
        source: input
        description: "FK -> Tour.id; owning tour"
      - name: city_code
        type: string
        source: input
        description: "IATA-style city code where gear must be present (e.g. LAX, NYC, NASH)"
      - name: venue_date
        type: datetime
        source: input
        description: "Show date (UTC midnight); must lie within [tour.start_date, tour.end_date]"
      - name: load_in_ts
        type: datetime
        source: input
        description: "Load-in timestamp; must precede venue_date + 20:00 same day"
      - name: status
        type: enum
        source: system
        description: "Stop lifecycle"
        constraints: "enum {PLANNED, GEAR_STAGED, SHOW_READY, LOADED_OUT, SETTLED, CANCELLED}"
      - name: rider_revision
        type: integer
        source: system
        description: "Increments on every rider line mutation on this stop; used for stale-rider detection"
        default: 0

  - name: RiderLine
    parent: TourStop
    common_fields: true
    fields:
      - name: tour_stop_id
        type: string
        source: input
        description: "FK -> TourStop.id; stop this rider line belongs to"
      - name: gear_model_id
        type: string
        source: input
        description: "FK -> GearModel.id; requested model"
      - name: quantity
        type: integer
        source: input
        description: "Requested quantity; >= 1"
      - name: status
        type: enum
        source: system
        description: "Rider line fulfillment lifecycle"
        constraints: "enum {REQUESTED, SOURCED, SUBSTITUTION_PENDING, APPROVED, FULFILLED, SHORTED, CANCELLED}"
      - name: fulfilled_by_reservation_id
        type: string
        source: system
        description: "FK -> ReservationLine.id (nullable); set when sourcing completes"
      - name: substitution_of_line_id
        type: string
        source: input
        description: "FK -> RiderLine.id (nullable); when this line substitutes another, links to the replaced line"
      - name: substitution_reason
        type: string
        source: input
        description: "Free-text reason recorded when a substitution is proposed"

  - name: GearModel
    parent: null
    common_fields: true
    fields:
      - name: sku
        type: string
        source: input
        description: "Unique catalog SKU"
        constraints: "unique across GearModel"
      - name: category
        type: enum
        source: input
        description: "Instrument category"
        constraints: "enum {GUITAR, BASS, DRUMS, KEYS, AMP, PA, BACKLINE_MISC}"
      - name: daily_rate_cents
        type: integer
        source: input
        description: "Base daily rental rate in cents; >= 0"
      - name: replacement_value_cents
        type: integer
        source: input
        description: "Full replacement value in cents; caps damage claims and drives deposit tiers; > 0"
      - name: weight_class
        type: enum
        source: input
        description: "Cartage weight class driving flight-case requirement"
        constraints: "enum {HAND_CARRY, STANDARD, HEAVY, OVERSIZE}"
      - name: substitute_model_ids
        type: array
        source: input
        description: "Ordered array of GearModel.id values acceptable as substitutes; earlier entries preferred"
        default: []

  - name: GearUnit
    parent: GearModel
    common_fields: true
    fields:
      - name: gear_model_id
        type: string
        source: input
        description: "FK -> GearModel.id; catalog model of this physical unit"
      - name: serial_number
        type: string
        source: input
        description: "Manufacturer serial; unique"
        constraints: "unique across GearUnit"
      - name: home_city_code
        type: string
        source: input
        description: "Depot city where the unit is based; drives cartage zone pricing"
      - name: status
        type: enum
        source: system
        description: "Unit operational lifecycle"
        constraints: "enum {AVAILABLE, RESERVED, OUT_ON_RENTAL, IN_TRANSIT, MAINTENANCE, QUARANTINED, RETIRED}"
      - name: condition_score
        type: integer
        source: computed
        description: "0-100; starts 100; decremented by damage assessments; < 40 forces MAINTENANCE before next rental"
        default: 100
      - name: rental_days_since_service
        type: integer
        source: computed
        description: "Accumulated on-rental days since last completed maintenance; >= 30 forces MAINTENANCE gate at check-in"
        default: 0
      - name: flight_case_required
        type: boolean
        source: computed
        description: "Derived from GearModel.weight_class: true for HEAVY or OVERSIZE"
      - name: active_reservation_id
        type: string
        source: system
        description: "FK -> ReservationLine.id (nullable); the reservation currently holding this unit, if any"

  - name: ReservationLine
    parent: Tour
    common_fields: true
    fields:
      - name: tour_id
        type: string
        source: input
        description: "FK -> Tour.id; tour holding the reservation"
      - name: rider_line_id
        type: string
        source: input
        description: "FK -> RiderLine.id; the rider line this reservation sources"
      - name: gear_unit_id
        type: string
        source: system
        description: "FK -> GearUnit.id (nullable); assigned at sourcing; null until SOURCED"
      - name: origin_city_code
        type: string
        source: input
        description: "City where gear is handed over"
      - name: dest_city_code
        type: string
        source: input
        description: "City where gear is returned"
      - name: start_date
        type: datetime
        source: input
        description: "Rental start (UTC midnight, half-open interval start, inclusive)"
      - name: end_date
        type: datetime
        source: input
        description: "Rental end (UTC midnight, half-open interval end, exclusive); must be > start_date"
      - name: status
        type: enum
        source: system
        description: "Reservation lifecycle"
        constraints: "enum {DRAFT, SOURCED, DISPATCHED, DELIVERED, RETURNED, INSPECTED, SETTLED, CANCELLED}"
      - name: quoted_fee_cents
        type: integer
        source: computed
        description: "Forward-looking fee at sourcing time per rental_fee_quote (provisional variant)"
        default: 0
      - name: settled_fee_cents
        type: integer
        source: computed
        description: "Chronological final fee per rental_fee_settlement (final variant); null until SETTLED"
      - name: deposit_held_cents
        type: integer
        source: computed
        description: "Deposit blocked on the artist at SOURCED time per deposit_hold_rule"
        default: 0
      - name: is_cross_rental
        type: boolean
        source: system
        description: "True when this reservation is fulfilled by a partner vendor unit via CrossRentalRequest"
        default: false

  - name: Shipment
    parent: Tour
    common_fields: true
    fields:
      - name: tour_id
        type: string
        source: input
        description: "FK -> Tour.id; tour this cartage leg serves"
      - name: from_city_code
        type: string
        source: input
        description: "Origin city"
      - name: to_city_code
        type: string
        source: input
        description: "Destination city"
      - name: ship_date
        type: datetime
        source: input
        description: "Planned ship date (UTC midnight)"
      - name: status
        type: enum
        source: system
        description: "Cartage leg lifecycle"
        constraints: "enum {PLANNED, LOADING, IN_TRANSIT, DELIVERED, CLOSED, CANCELLED}"
      - name: tech_labor_minutes
        type: integer
        source: computed
        description: "Total tech labor minutes booked against this leg; sum over ShipmentLine.labor_minutes"
        default: 0
      - name: capacity_kg
        type: integer
        source: input
        description: "Truck/flight capacity in kg for this leg; > 0"
      - name: booked_weight_kg
        type: integer
        source: computed
        description: "Sum of ShipmentLine.weight_kg over non-cancelled lines; must never exceed capacity_kg"
        default: 0

  - name: ShipmentLine
    parent: Shipment
    common_fields: true
    fields:
      - name: shipment_id
        type: string
        source: input
        description: "FK -> Shipment.id; parent cartage leg"
      - name: gear_unit_id
        type: string
        source: input
        description: "FK -> GearUnit.id; unit being moved"
      - name: flight_case_id
        type: string
        source: input
        description: "FK -> FlightCase.id (nullable); case assigned when unit.flight_case_required"
      - name: weight_kg
        type: integer
        source: input
        description: "Declared weight incl. case; >= 0"
      - name: labor_minutes
        type: integer
        source: input
        description: "Tech labor minutes for load/unload of this line; >= 0"
      - name: status
        type: enum
        source: system
        description: "Line lifecycle"
        constraints: "enum {BOOKED, LOADED, DELIVERED, CANCELLED}"

  - name: FlightCase
    parent: null
    common_fields: true
    fields:
      - name: case_code
        type: string
        source: input
        description: "Unique case identifier painted on the shell"
        constraints: "unique across FlightCase"
      - name: size_class
        type: enum
        source: input
        description: "Case size; must be >= the gear's weight_class requirement mapping"
        constraints: "enum {SMALL, MEDIUM, LARGE, TRUNK}"
      - name: home_city_code
        type: string
        source: input
        description: "Depot city"
      - name: status
        type: enum
        source: system
        description: "Case lifecycle"
        constraints: "enum {AVAILABLE, ASSIGNED, IN_TRANSIT, MAINTENANCE, RETIRED}"

  - name: PartnerVendor
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Vendor company name
      - name: city_codes
        type: array
        source: input
        description: "Array of city codes where this vendor can supply gear"
      - name: commission_bps
        type: integer
        source: input
        description: "Commission in basis points (100 bps = 1%) charged on cross-rental revenue; 0-3000"
      - name: status
        type: enum
        source: system
        description: "Vendor onboarding status"
        constraints: "enum {PENDING, APPROVED, SUSPENDED}"

  - name: CrossRentalRequest
    parent: ReservationLine
    common_fields: true
    fields:
      - name: reservation_line_id
        type: string
        source: input
        description: "FK -> ReservationLine.id; the reservation that could not be sourced in-house"
      - name: partner_vendor_id
        type: string
        source: input
        description: "FK -> PartnerVendor.id; vendor being asked"
      - name: gear_model_id
        type: string
        source: input
        description: "FK -> GearModel.id; model requested from the vendor"
      - name: status
        type: enum
        source: system
        description: "Cross-rental negotiation lifecycle"
        constraints: "enum {REQUESTED, ACCEPTED, REJECTED, FULFILLED, SETTLED, CANCELLED}"
      - name: vendor_rate_cents_per_day
        type: integer
        source: input
        description: "Vendor's daily rate in cents; set at request time; >= 0"
      - name: commission_cents
        type: integer
        source: computed
        description: "Commission owed to us by vendor per cross_rental_settlement; null until SETTLED"

  - name: MaintenanceTicket
    parent: GearUnit
    common_fields: true
    fields:
      - name: gear_unit_id
        type: string
        source: input
        description: "FK -> GearUnit.id; unit under service"
      - name: opened_reason
        type: enum
        source: input
        description: "Why the ticket was opened"
        constraints: "enum {SCHEDULED_CYCLE, DAMAGE_REPAIR, CONDITION_THRESHOLD, POST_FLIGHT_INSPECTION}"
      - name: status
        type: enum
        source: system
        description: "Maintenance lifecycle"
        constraints: "enum {OPEN, IN_PROGRESS, AWAITING_PARTS, COMPLETED, CANCELLED}"
      - name: opened_at
        type: datetime
        source: system
        description: "Timestamp ticket entered OPEN"
      - name: closed_at
        type: datetime
        source: system
        description: "Timestamp ticket entered COMPLETED or CANCELLED (nullable)"
      - name: service_cost_cents
        type: integer
        source: input
        description: "Actual service cost recorded at completion; >= 0"
      - name: condition_delta
        type: integer
        source: input
        description: "Condition-score restoration applied at completion; 0-100; new score = min(100, old + delta)"

  - name: DamageClaim
    parent: ReservationLine
    common_fields: true
    fields:
      - name: reservation_line_id
        type: string
        source: input
        description: "FK -> ReservationLine.id; the rental under which damage was found"
      - name: gear_unit_id
        type: string
        source: input
        description: "FK -> GearUnit.id; damaged unit"
      - name: assessed_severity
        type: enum
        source: input
        description: "Damage severity bucket"
        constraints: "enum {COSMETIC, MINOR, MAJOR, TOTAL_LOSS}"
      - name: repair_estimate_cents
        type: integer
        source: input
        description: "Assessor's repair estimate in cents; >= 0; ignored for TOTAL_LOSS (uses replacement value)"
      - name: status
        type: enum
        source: system
        description: "Claim lifecycle"
        constraints: "enum {FILED, ASSESSED, CHARGED, DISPUTED, WAIVED, PAID}"
      - name: charge_cents
        type: integer
        source: computed
        description: "Final charge per damage_charge_rule; null until CHARGED"
      - name: filed_by_user_id
        type: string
        source: system
        description: "Server-stamped from the acting WarehouseTech's X-User-ID at claim creation (via reservation inspect); segregation-of-duties anchor"

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Tour
    initial_state: DRAFT
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /backline/tours/{id}/activate"
        actor: TourManager
        preconditions:
          - "tour.status == DRAFT"
          - "tour has >= 1 TourStop child with status == PLANNED"
          - "artist.deposit_waived == true OR tour.insurance_policy_id is non-null"
          - "sum of deposit_hold_rule over all SOURCED reservations of artist <= artist.deposit_credit_cents + required headroom (fiscal gate evaluated at activation)"
        side_effects:
          - "increments Tour.version"
          - "recomputes tour.projected_rental_fee_cents via rental_fee_quote over DRAFT+SOURCED reservation lines"
      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /backline/tours/{id}/complete"
        actor: TourManager
        preconditions:
          - "tour.status == ACTIVE"
          - "every TourStop child has status IN {SETTLED, CANCELLED}"
          - "every ReservationLine of tour has status IN {SETTLED, CANCELLED}"
          - "no DamageClaim linked to tour's reservation lines has status IN {FILED, ASSESSED, DISPUTED}"
        side_effects:
          - "increments Tour.version"
          - "computes tour.final_settlement_cents via rental_fee_settlement (chronological variant)"
          - "releases any unforfeited artist deposit: artist.deposit_credit_cents re-derived via deposit_hold_rule reconciliation"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /backline/tours/{id}/cancel"
        actor: TourManager
        preconditions: ["tour.status == DRAFT"]
        side_effects:
          - "increments Tour.version"
          - "cascades: every TourStop child with status == PLANNED transitions to CANCELLED"
          - "cascades: every RiderLine of those stops with status IN {REQUESTED, SOURCED, SUBSTITUTION_PENDING, APPROVED} transitions to CANCELLED"
          - "cascades: every ReservationLine with status == DRAFT transitions to CANCELLED"
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /backline/tours/{id}/cancel"
        actor: OpsManager
        preconditions:
          - "tour.status == ACTIVE"
          - "no ReservationLine of tour has status IN {DISPATCHED, DELIVERED}"
        side_effects:
          - "increments Tour.version"
          - "cascades: non-terminal TourStop children transition to CANCELLED"
          - "cascades: each SOURCED ReservationLine transitions to CANCELLED; each cancel releases its GearUnit (unit.status RESERVED -> AVAILABLE, unit.active_reservation_id := null)"
          - "cascades: unit release triggers maintenance_cycle_gate re-check per released unit (unit with rental_days_since_service >= 30 enters MAINTENANCE and a MaintenanceTicket is opened)"

  - entity: TourStop
    initial_state: PLANNED
    terminal_states: [SETTLED, CANCELLED]
    transitions:
      - from: PLANNED
        to: GEAR_STAGED
        trigger: "POST /backline/tour-stops/{id}/stage"
        actor: LogisticsCoordinator
        preconditions:
          - "stop.status == PLANNED"
          - "parent tour.status == ACTIVE"
          - "every RiderLine of stop has status IN {SOURCED, APPROVED, FULFILLED, CANCELLED} (no REQUESTED or SUBSTITUTION_PENDING left)"
          - "at least one Shipment with to_city_code == stop.city_code and status IN {DELIVERED} covers this stop"
        side_effects:
          - "increments TourStop.version"
          - "each ReservationLine feeding this stop with status == DELIVERED remains; gear staged flag recorded via stop status"
      - from: GEAR_STAGED
        to: SHOW_READY
        trigger: "POST /backline/tour-stops/{id}/show-ready"
        actor: WarehouseTech
        preconditions:
          - "stop.status == GEAR_STAGED"
          - "every RiderLine of stop has status IN {FULFILLED, CANCELLED}"
        side_effects: ["increments TourStop.version"]
      - from: SHOW_READY
        to: LOADED_OUT
        trigger: "POST /backline/tour-stops/{id}/load-out"
        actor: WarehouseTech
        preconditions: ["stop.status == SHOW_READY"]
        side_effects:
          - "increments TourStop.version"
          - "every ReservationLine feeding this stop with status == DELIVERED transitions to RETURNED; each such transition runs the check-in cascade on its GearUnit (see ReservationLine DELIVERED->RETURNED)"
      - from: LOADED_OUT
        to: SETTLED
        trigger: "POST /backline/tour-stops/{id}/settle"
        actor: TourManager
        preconditions:
          - "stop.status == LOADED_OUT"
          - "every ReservationLine feeding this stop has status IN {SETTLED, CANCELLED}"
        side_effects: ["increments TourStop.version"]
      - from: PLANNED
        to: CANCELLED
        trigger: "POST /backline/tour-stops/{id}/cancel"
        actor: TourManager
        preconditions: ["stop.status == PLANNED"]
        side_effects:
          - "increments TourStop.version"
          - "cascades: RiderLine children with status IN {REQUESTED, SOURCED, SUBSTITUTION_PENDING, APPROVED} transition to CANCELLED"
          - "cascades: ReservationLine children sourced for this stop with status IN {DRAFT, SOURCED} transition to CANCELLED, releasing their GearUnits (RESERVED -> AVAILABLE)"

  - entity: RiderLine
    initial_state: REQUESTED
    terminal_states: [FULFILLED, SHORTED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: SOURCED
        trigger: "POST /backline/rider-lines/{id}/source"
        actor: LogisticsCoordinator
        preconditions:
          - "line.status == REQUESTED"
          - "parent stop.status == PLANNED"
          - "availability_selector finds a GearUnit (see gear_availability_window calc) OR an approved CrossRentalRequest path is used with use_cross_rental=true"
        side_effects:
          - "increments RiderLine.version"
          - "creates ReservationLine (status DRAFT -> immediately SOURCED via unit assignment) and sets line.fulfilled_by_reservation_id"
          - "assigned GearUnit.status AVAILABLE -> RESERVED; unit.active_reservation_id := new reservation id"
          - "computes reservation.quoted_fee_cents via rental_fee_quote (forward-looking variant)"
          - "computes reservation.deposit_held_cents via deposit_hold_rule; debits artist.deposit_credit_cents by that amount"
          - "increments parent TourStop.rider_revision"
      - from: SOURCED
        to: SUBSTITUTION_PENDING
        trigger: "POST /backline/rider-lines/{id}/propose-substitution"
        actor: LogisticsCoordinator
        preconditions:
          - "line.status == SOURCED"
          - "payload substitute_gear_model_id appears in the requested GearModel.substitute_model_ids array"
          - "a GearUnit of the substitute model is available in the window per gear_availability_window"
        side_effects:
          - "increments RiderLine.version"
          - "increments parent TourStop.rider_revision"
      - from: SUBSTITUTION_PENDING
        to: APPROVED
        trigger: "POST /backline/rider-lines/{id}/approve-substitution"
        actor: TourManager
        preconditions:
          - "line.status == SUBSTITUTION_PENDING"
          - "payload expected_tour_stop_rider_revision == current parent TourStop.rider_revision (OCC guard)"
        side_effects:
          - "increments RiderLine.version"
          - "old ReservationLine transitions SOURCED -> CANCELLED; its GearUnit released (RESERVED -> AVAILABLE; deposit credited back via deposit_hold_rule compensation)"
          - "new ReservationLine created against substitute GearUnit; unit AVAILABLE -> RESERVED"
          - "recomputes new reservation.quoted_fee_cents and deposit_held_cents; artist.deposit_credit_cents re-debited"
          - "net deposit delta applied via deposit_hold_rule reconciliation"
      - from: SUBSTITUTION_PENDING
        to: SOURCED
        trigger: "POST /backline/rider-lines/{id}/reject-substitution"
        actor: TourManager
        preconditions: ["line.status == SUBSTITUTION_PENDING"]
        side_effects:
          - "increments RiderLine.version (revision loop back to SOURCED; cycle SOURCED -> SUBSTITUTION_PENDING -> SOURCED permitted)"
          - "increments parent TourStop.rider_revision"
      - from: SOURCED
        to: FULFILLED
        trigger: "POST /backline/rider-lines/{id}/mark-fulfilled"
        actor: WarehouseTech
        preconditions:
          - "line.status IN {SOURCED, APPROVED}"
          - "linked ReservationLine.status == DELIVERED"
        side_effects: ["increments RiderLine.version"]
      - from: APPROVED
        to: FULFILLED
        trigger: "POST /backline/rider-lines/{id}/mark-fulfilled"
        actor: WarehouseTech
        preconditions:
          - "line.status IN {SOURCED, APPROVED}"
          - "linked ReservationLine.status == DELIVERED"
        side_effects: ["increments RiderLine.version"]
      - from: REQUESTED
        to: SHORTED
        trigger: "POST /backline/rider-lines/{id}/mark-shorted"
        actor: LogisticsCoordinator
        preconditions:
          - "line.status == REQUESTED"
          - "availability_selector over gear_availability_window returns empty candidate set AND no approved PartnerVendor covers the stop city (empty-pool fallback)"
        side_effects:
          - "increments RiderLine.version"
          - "applies shortage_credit_rule to tour.projected_rental_fee_cents"
      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /backline/rider-lines/{id}/cancel"
        actor: TourManager
        preconditions: ["line.status IN {REQUESTED, SOURCED, SUBSTITUTION_PENDING, APPROVED}"]
        side_effects:
          - "increments RiderLine.version"
          - "if a ReservationLine exists and is in {DRAFT, SOURCED}, it transitions to CANCELLED and releases its GearUnit (RESERVED -> AVAILABLE; deposit credited back)"

  - entity: GearUnit
    initial_state: AVAILABLE
    terminal_states: [RETIRED]
    transitions:
      - from: AVAILABLE
        to: RESERVED
        trigger: "system: assigned by rider-line sourcing"
        actor: system
        preconditions:
          - "unit.status == AVAILABLE"
          - "unit.condition_score >= 40"
          - "unit.rental_days_since_service < 30"
        side_effects: ["unit.active_reservation_id := reservation id", "increments GearUnit.version"]
      - from: RESERVED
        to: OUT_ON_RENTAL
        trigger: "system: reservation DISPATCHED"
        actor: system
        preconditions: ["unit.status == RESERVED"]
        side_effects: ["increments GearUnit.version"]
      - from: OUT_ON_RENTAL
        to: IN_TRANSIT
        trigger: "system: unit booked onto a ShipmentLine that transitions to LOADED"
        actor: system
        preconditions: ["unit.status == OUT_ON_RENTAL"]
        side_effects: ["increments GearUnit.version"]
      - from: IN_TRANSIT
        to: OUT_ON_RENTAL
        trigger: "system: shipment DELIVERED"
        actor: system
        preconditions: ["unit.status == IN_TRANSIT"]
        side_effects: ["increments GearUnit.version"]
      - from: OUT_ON_RENTAL
        to: AVAILABLE
        trigger: "system: reservation check-in (DELIVERED -> RETURNED) with clean inspection"
        actor: system
        preconditions:
          - "unit.status IN {OUT_ON_RENTAL, IN_TRANSIT}"
          - "maintenance_cycle_gate does not force MAINTENANCE (rental_days_since_service + new days < 30 AND condition_score >= 40)"
        side_effects:
          - "unit.rental_days_since_service += rental day count of the completed reservation"
          - "unit.active_reservation_id := null"
          - "increments GearUnit.version"
      - from: OUT_ON_RENTAL
        to: MAINTENANCE
        trigger: "system: check-in when maintenance_cycle_gate trips (days >= 30 or condition_score < 40)"
        actor: system
        preconditions: ["unit.status IN {OUT_ON_RENTAL, IN_TRANSIT}"]
        side_effects:
          - "opens MaintenanceTicket with opened_reason IN {SCHEDULED_CYCLE, CONDITION_THRESHOLD}"
          - "increments GearUnit.version"
      - from: MAINTENANCE
        to: AVAILABLE
        trigger: "POST /backline/maintenance-tickets/{id}/complete"
        actor: WarehouseTech
        preconditions:
          - "ticket.status == IN_PROGRESS (ticket for this unit)"
          - "ticket.service_cost_cents and ticket.condition_delta supplied"
        side_effects:
          - "unit.condition_score := min(100, unit.condition_score + condition_delta)"
          - "unit.rental_days_since_service := 0"
          - "unit.active_reservation_id := null"
          - "increments GearUnit.version"
      - from: QUARANTINED
        to: MAINTENANCE
        trigger: "system: damage claim ASSESSED with severity IN {MAJOR, TOTAL_LOSS}"
        actor: system
        preconditions: ["unit.status == QUARANTINED"]
        side_effects: ["opens MaintenanceTicket opened_reason DAMAGE_REPAIR", "increments GearUnit.version"]
      - from: OUT_ON_RENTAL
        to: QUARANTINED
        trigger: "system: DamageClaim FILED against this unit's active reservation"
        actor: system
        preconditions: ["unit.status IN {OUT_ON_RENTAL, IN_TRANSIT}"]
        side_effects: ["increments GearUnit.version"]
      - from: AVAILABLE
        to: RETIRED
        trigger: "POST /backline/gear-units/{id}/retire"
        actor: OpsManager
        preconditions:
          - "unit.status == AVAILABLE"
          - "no ReservationLine with status IN {DRAFT, SOURCED, DISPATCHED, DELIVERED} references this unit"
        side_effects: ["increments GearUnit.version"]
      - from: RESERVED
        to: AVAILABLE
        trigger: "system: reservation CANCELLED (compensation release)"
        actor: system
        preconditions: ["unit.status == RESERVED"]
        side_effects: ["unit.active_reservation_id := null", "increments GearUnit.version"]

  - entity: ReservationLine
    initial_state: DRAFT
    terminal_states: [SETTLED, CANCELLED]
    transitions:
      - from: DRAFT
        to: SOURCED
        trigger: "system: unit assignment during rider-line sourcing"
        actor: system
        preconditions: ["reservation.status == DRAFT", "gear_unit_id assigned"]
        side_effects: ["increments ReservationLine.version"]
      - from: SOURCED
        to: DISPATCHED
        trigger: "POST /backline/reservation-lines/{id}/dispatch"
        actor: LogisticsCoordinator
        preconditions:
          - "reservation.status == SOURCED"
          - "parent tour.status == ACTIVE"
          - "parent tour has at least one Shipment with status IN {PLANNED, LOADING} whose to_city_code == reservation.dest_city_code"
        side_effects:
          - "unit.status RESERVED -> OUT_ON_RENTAL (no-op for cross-rental reservations, which hold no in-house unit)"
          - "increments ReservationLine.version"
      - from: DISPATCHED
        to: DELIVERED
        trigger: "POST /backline/reservation-lines/{id}/mark-delivered"
        actor: LogisticsCoordinator
        preconditions: ["reservation.status == DISPATCHED"]
        side_effects: ["increments ReservationLine.version"]
      - from: DELIVERED
        to: RETURNED
        trigger: "system: stop load-out or POST /backline/reservation-lines/{id}/check-in"
        actor: WarehouseTech
        preconditions: ["reservation.status == DELIVERED"]
        side_effects:
          - "check-in cascade on GearUnit: unit transitions OUT_ON_RENTAL -> AVAILABLE or -> MAINTENANCE per maintenance_cycle_gate"
          - "unit.rental_days_since_service += rental_days of this reservation when it returns to AVAILABLE"
          - "increments ReservationLine.version"
      - from: RETURNED
        to: INSPECTED
        trigger: "POST /backline/reservation-lines/{id}/inspect"
        actor: WarehouseTech
        preconditions:
          - "reservation.status == RETURNED"
          - "if payload records damage, a DamageClaim is created in same request (atomic) and unit QUARANTINED"
        side_effects: ["increments ReservationLine.version"]
      - from: INSPECTED
        to: SETTLED
        trigger: "POST /backline/reservation-lines/{id}/settle"
        actor: TourManager
        preconditions:
          - "reservation.status == INSPECTED"
          - "no DamageClaim on this reservation has status IN {FILED, ASSESSED, DISPUTED}"
        side_effects:
          - "computes settled_fee_cents via rental_fee_settlement (chronological variant)"
          - "releases deposit_held_cents back to artist.deposit_credit_cents via deposit_hold_rule, minus any PAID damage charge_cents on this reservation"
          - "increments ReservationLine.version"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /backline/reservation-lines/{id}/cancel or cascade"
        actor: TourManager
        preconditions: ["reservation.status IN {DRAFT, SOURCED}"]
        side_effects: ["increments ReservationLine.version"]
      - from: SOURCED
        to: CANCELLED
        trigger: "POST /backline/reservation-lines/{id}/cancel or cascade"
        actor: TourManager
        preconditions: ["reservation.status IN {DRAFT, SOURCED}"]
        side_effects:
          - "releases GearUnit (RESERVED -> AVAILABLE)"
          - "credits reservation.deposit_held_cents back to artist.deposit_credit_cents"
          - "increments ReservationLine.version"

  - entity: Shipment
    initial_state: PLANNED
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: PLANNED
        to: LOADING
        trigger: "POST /backline/shipments/{id}/begin-loading"
        actor: LogisticsCoordinator
        preconditions: ["shipment.status == PLANNED"]
        side_effects: ["increments Shipment.version"]
      - from: LOADING
        to: IN_TRANSIT
        trigger: "POST /backline/shipments/{id}/depart"
        actor: LogisticsCoordinator
        preconditions:
          - "shipment.status == LOADING"
          - "every ShipmentLine of shipment has status IN {LOADED, CANCELLED}"
          - "booked_weight_kg <= capacity_kg (re-validated)"
        side_effects:
          - "each LOADED ShipmentLine's GearUnit transitions OUT_ON_RENTAL -> IN_TRANSIT"
          - "each assigned FlightCase transitions ASSIGNED -> IN_TRANSIT"
          - "increments Shipment.version"
      - from: IN_TRANSIT
        to: DELIVERED
        trigger: "POST /backline/shipments/{id}/mark-delivered"
        actor: LogisticsCoordinator
        preconditions: ["shipment.status == IN_TRANSIT"]
        side_effects:
          - "each non-cancelled ShipmentLine transitions to DELIVERED"
          - "each such line's GearUnit transitions IN_TRANSIT -> OUT_ON_RENTAL"
          - "each FlightCase transitions IN_TRANSIT -> AVAILABLE at destination (home_city_code updated to shipment.to_city_code)"
          - "increments Shipment.version"
      - from: DELIVERED
        to: CLOSED
        trigger: "POST /backline/shipments/{id}/close"
        actor: LogisticsCoordinator
        preconditions: ["shipment.status == DELIVERED"]
        side_effects: ["increments Shipment.version"]
      - from: PLANNED
        to: CANCELLED
        trigger: "POST /backline/shipments/{id}/cancel"
        actor: LogisticsCoordinator
        preconditions:
          - "shipment.status IN {PLANNED, LOADING}"
          - "no ShipmentLine has status == LOADED"
        side_effects:
          - "each BOOKED ShipmentLine transitions to CANCELLED"
          - "each assigned FlightCase released (ASSIGNED -> AVAILABLE)"
          - "increments Shipment.version"
      - from: LOADING
        to: CANCELLED
        trigger: "POST /backline/shipments/{id}/cancel"
        actor: LogisticsCoordinator
        preconditions:
          - "shipment.status IN {PLANNED, LOADING}"
          - "no ShipmentLine has status == LOADED"
        side_effects:
          - "each BOOKED ShipmentLine transitions to CANCELLED"
          - "each assigned FlightCase released (ASSIGNED -> AVAILABLE)"
          - "increments Shipment.version"

  - entity: ShipmentLine
    initial_state: BOOKED
    terminal_states: [DELIVERED, CANCELLED]
    transitions:
      - from: BOOKED
        to: LOADED
        trigger: "POST /backline/shipment-lines/{id}/load"
        actor: WarehouseTech
        preconditions:
          - "line.status == BOOKED"
          - "parent shipment.status == LOADING"
          - "adding line.weight_kg keeps shipment.booked_weight_kg <= shipment.capacity_kg"
          - "if unit.flight_case_required then line.flight_case_id is non-null and case.status == AVAILABLE"
        side_effects:
          - "assigned FlightCase transitions AVAILABLE -> ASSIGNED"
          - "recomputes shipment.booked_weight_kg and shipment.tech_labor_minutes (derived-field reconciliation)"
          - "increments ShipmentLine.version"
      - from: LOADED
        to: DELIVERED
        trigger: "system: shipment DELIVERED"
        actor: system
        preconditions: ["line.status == LOADED"]
        side_effects: ["increments ShipmentLine.version"]
      - from: BOOKED
        to: CANCELLED
        trigger: "POST /backline/shipment-lines/{id}/cancel or shipment cancel cascade"
        actor: LogisticsCoordinator
        preconditions: ["line.status == BOOKED"]
        side_effects: ["recomputes shipment.booked_weight_kg", "increments ShipmentLine.version"]

  - entity: CrossRentalRequest
    initial_state: REQUESTED
    terminal_states: [REJECTED, SETTLED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: ACCEPTED
        trigger: "POST /backline/cross-rental-requests/{id}/accept"
        actor: PartnerVendorRep
        preconditions:
          - "request.status == REQUESTED"
          - "acting PartnerVendorRep's vendor id == request.partner_vendor_id"
          - "vendor.status == APPROVED"
        side_effects: ["increments CrossRentalRequest.version"]
      - from: REQUESTED
        to: REJECTED
        trigger: "POST /backline/cross-rental-requests/{id}/reject"
        actor: PartnerVendorRep
        preconditions: ["request.status == REQUESTED", "acting PartnerVendorRep's vendor id == request.partner_vendor_id"]
        side_effects: ["increments CrossRentalRequest.version"]
      - from: ACCEPTED
        to: FULFILLED
        trigger: "POST /backline/cross-rental-requests/{id}/mark-fulfilled"
        actor: PartnerVendorRep
        preconditions: ["request.status == ACCEPTED"]
        side_effects:
          - "linked ReservationLine marked is_cross_rental := true and transitions DRAFT -> SOURCED without consuming an in-house GearUnit"
          - "deposit_held_cents still computed via deposit_hold_rule against artist (cross-rental does not waive deposit)"
          - "increments CrossRentalRequest.version"
      - from: FULFILLED
        to: SETTLED
        trigger: "POST /backline/cross-rental-requests/{id}/settle"
        actor: OpsManager
        preconditions:
          - "request.status == FULFILLED"
          - "linked ReservationLine.status == SETTLED"
        side_effects:
          - "computes commission_cents via cross_rental_settlement"
          - "increments CrossRentalRequest.version"
      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /backline/cross-rental-requests/{id}/cancel"
        actor: LogisticsCoordinator
        preconditions: ["request.status IN {REQUESTED, ACCEPTED}"]
        side_effects: ["increments CrossRentalRequest.version"]
      - from: ACCEPTED
        to: CANCELLED
        trigger: "POST /backline/cross-rental-requests/{id}/cancel"
        actor: LogisticsCoordinator
        preconditions: ["request.status IN {REQUESTED, ACCEPTED}"]
        side_effects: ["increments CrossRentalRequest.version"]

  - entity: MaintenanceTicket
    initial_state: OPEN
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: OPEN
        to: IN_PROGRESS
        trigger: "POST /backline/maintenance-tickets/{id}/start"
        actor: WarehouseTech
        preconditions: ["ticket.status == OPEN"]
        side_effects: ["increments MaintenanceTicket.version"]
      - from: IN_PROGRESS
        to: AWAITING_PARTS
        trigger: "POST /backline/maintenance-tickets/{id}/await-parts"
        actor: WarehouseTech
        preconditions: ["ticket.status == IN_PROGRESS"]
        side_effects: ["increments MaintenanceTicket.version"]
      - from: AWAITING_PARTS
        to: IN_PROGRESS
        trigger: "POST /backline/maintenance-tickets/{id}/resume"
        actor: WarehouseTech
        preconditions: ["ticket.status == AWAITING_PARTS"]
        side_effects: ["increments MaintenanceTicket.version (cycle IN_PROGRESS -> AWAITING_PARTS -> IN_PROGRESS permitted)"]
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /backline/maintenance-tickets/{id}/complete"
        actor: WarehouseTech
        preconditions:
          - "ticket.status == IN_PROGRESS"
          - "payload supplies service_cost_cents >= 0 and condition_delta in [0, 100]"
        side_effects:
          - "unit.condition_score := min(100, unit.condition_score + condition_delta)"
          - "unit.rental_days_since_service := 0"
          - "unit.status MAINTENANCE -> AVAILABLE"
          - "ticket.closed_at := now"
          - "increments MaintenanceTicket.version"
      - from: OPEN
        to: CANCELLED
        trigger: "POST /backline/maintenance-tickets/{id}/cancel"
        actor: OpsManager
        preconditions: ["ticket.status IN {OPEN, AWAITING_PARTS}"]
        side_effects: ["increments MaintenanceTicket.version"]
      - from: AWAITING_PARTS
        to: CANCELLED
        trigger: "POST /backline/maintenance-tickets/{id}/cancel"
        actor: OpsManager
        preconditions: ["ticket.status IN {OPEN, AWAITING_PARTS}"]
        side_effects: ["increments MaintenanceTicket.version"]

  - entity: DamageClaim
    initial_state: FILED
    terminal_states: [CHARGED, WAIVED, PAID]
    transitions:
      - from: FILED
        to: ASSESSED
        trigger: "POST /backline/damage-claims/{id}/assess"
        actor: OpsManager
        preconditions:
          - "claim.status == FILED"
          - "acting OpsManager's X-User-ID != claim.filed_by_user_id (segregation of duties: filer cannot assess own claim)"
        side_effects:
          - "if severity IN {MAJOR, TOTAL_LOSS}: unit QUARANTINED -> MAINTENANCE and MaintenanceTicket opened (DAMAGE_REPAIR)"
          - "unit.condition_score decremented per damage_condition_impact (COSMETIC -5, MINOR -15, MAJOR -35, TOTAL_LOSS -100, floor 0)"
          - "artist.risk_score recomputed via artist_risk_score"
          - "increments DamageClaim.version"
      - from: ASSESSED
        to: CHARGED
        trigger: "POST /backline/damage-claims/{id}/charge"
        actor: TourManager
        preconditions: ["claim.status == ASSESSED"]
        side_effects:
          - "computes charge_cents via damage_charge_rule"
          - "increments DamageClaim.version"
      - from: ASSESSED
        to: DISPUTED
        trigger: "POST /backline/damage-claims/{id}/dispute"
        actor: TourManager
        preconditions: ["claim.status == ASSESSED"]
        side_effects: ["increments DamageClaim.version"]
      - from: DISPUTED
        to: CHARGED
        trigger: "POST /backline/damage-claims/{id}/charge"
        actor: OpsManager
        preconditions: ["claim.status == DISPUTED"]
        side_effects:
          - "computes charge_cents via damage_charge_rule (dispute does not change the formula)"
          - "increments DamageClaim.version"
      - from: DISPUTED
        to: WAIVED
        trigger: "POST /backline/damage-claims/{id}/waive"
        actor: OpsManager
        preconditions: ["claim.status IN {ASSESSED, DISPUTED}"]
        side_effects: ["increments DamageClaim.version"]
      - from: ASSESSED
        to: WAIVED
        trigger: "POST /backline/damage-claims/{id}/waive"
        actor: OpsManager
        preconditions: ["claim.status IN {ASSESSED, DISPUTED}"]
        side_effects: ["increments DamageClaim.version"]
      - from: CHARGED
        to: PAID
        trigger: "POST /backline/damage-claims/{id}/mark-paid"
        actor: TourManager
        preconditions: ["claim.status == CHARGED"]
        side_effects:
          - "charge_cents deducted from artist.deposit_credit_cents at reservation settle time (see ReservationLine INSPECTED -> SETTLED); PAID marks cash receipt"
          - "increments DamageClaim.version"

  - entity: PartnerVendor
    initial_state: PENDING
    terminal_states: []
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /backline/partner-vendors/{id}/approve"
        actor: OpsManager
        preconditions: ["vendor.status == PENDING"]
        side_effects: ["increments PartnerVendor.version"]
      - from: APPROVED
        to: SUSPENDED
        trigger: "POST /backline/partner-vendors/{id}/suspend"
        actor: OpsManager
        preconditions: ["vendor.status == APPROVED"]
        side_effects:
          - "increments PartnerVendor.version"
          - "cascades: each CrossRentalRequest of vendor with status IN {REQUESTED, ACCEPTED} transitions to CANCELLED"
      - from: SUSPENDED
        to: APPROVED
        trigger: "POST /backline/partner-vendors/{id}/approve"
        actor: OpsManager
        preconditions: ["vendor.status == SUSPENDED"]
        side_effects: ["increments PartnerVendor.version (reinstatement cycle APPROVED -> SUSPENDED -> APPROVED permitted)"]

  - entity: FlightCase
    initial_state: AVAILABLE
    terminal_states: [RETIRED]
    transitions:
      - from: AVAILABLE
        to: ASSIGNED
        trigger: "system: booked onto a ShipmentLine that loads"
        actor: system
        preconditions: ["case.status == AVAILABLE"]
        side_effects: ["increments FlightCase.version"]
      - from: ASSIGNED
        to: IN_TRANSIT
        trigger: "system: shipment departs"
        actor: system
        preconditions: ["case.status == ASSIGNED"]
        side_effects: ["increments FlightCase.version"]
      - from: IN_TRANSIT
        to: AVAILABLE
        trigger: "system: shipment delivered"
        actor: system
        preconditions: ["case.status == IN_TRANSIT"]
        side_effects: ["case.home_city_code := shipment.to_city_code", "increments FlightCase.version"]
      - from: AVAILABLE
        to: MAINTENANCE
        trigger: "POST /backline/flight-cases/{id}/send-to-maintenance"
        actor: WarehouseTech
        preconditions: ["case.status == AVAILABLE"]
        side_effects: ["increments FlightCase.version"]
      - from: MAINTENANCE
        to: AVAILABLE
        trigger: "POST /backline/flight-cases/{id}/return-to-service"
        actor: WarehouseTech
        preconditions: ["case.status == MAINTENANCE"]
        side_effects: ["increments FlightCase.version"]
      - from: ASSIGNED
        to: AVAILABLE
        trigger: "system: shipment cancelled (compensation release)"
        actor: system
        preconditions: ["case.status == ASSIGNED"]
        side_effects: ["increments FlightCase.version"]
      - from: AVAILABLE
        to: RETIRED
        trigger: "POST /backline/flight-cases/{id}/retire"
        actor: OpsManager
        preconditions:
          - "case.status == AVAILABLE"
          - "no ShipmentLine with status IN {BOOKED, LOADED} references this case"
        side_effects: ["increments FlightCase.version"]

# =============================================================================
# §1.2.1 Concurrency Rules (true races only, OCC on parent version)
# =============================================================================
concurrency_rules:
  - rule_id: tour-activate-stale-tour
    parent_entity: Tour
    write_endpoint: "POST /backline/tours/{id}/activate"
    occ_field: expected_tour_version
    description: |
      Activating a Tour whose version has advanced since the client last read
      it is rejected. The version may have advanced because another writer
      added a TourStop or toggled artist deposit terms, changing the activation
      precondition basis (stop_count, deposit gate) under the client's feet.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: rider-substitute-approve-stale-stop
    parent_entity: TourStop
    write_endpoint: "POST /backline/rider-lines/{id}/approve-substitution"
    occ_field: expected_tour_stop_rider_revision
    description: |
      Approving a substitution against a TourStop whose rider_revision has
      advanced since the client last observed it is rejected. The revision
      advances on every rider-line mutation of that stop, so a stale approval
      may bless a substitution whose sibling lines have since changed.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: reservation-settle-stale-reservation
    parent_entity: ReservationLine
    write_endpoint: "POST /backline/reservation-lines/{id}/settle"
    occ_field: expected_reservation_version
    description: |
      Settling a ReservationLine whose version has advanced since the client
      last read it is rejected. The version advances when a DamageClaim is
      filed or when the check-in cascade adjusts the unit, so a stale settle
      would compute rental_fee_settlement against an obsolete inspection basis.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: gear_availability_window
    description: "Selector: pick the GearUnit to source for a rider line within a date window and city"
    trigger: "RiderLine REQUESTED -> SOURCED sourcing"
    algorithm: constraint_propagation
    formula: |
      candidate_set = GearUnit u where
        u.gear_model_id == line.gear_model_id
        AND u.status == AVAILABLE
        AND u.condition_score >= 40
        AND u.rental_days_since_service < 30
        AND NOT EXISTS ReservationLine r where r.gear_unit_id == u.id
            AND r.status IN {SOURCED, DISPATCHED, DELIVERED}
            AND r.start_date < window.end_date AND r.end_date > window.start_date
            (half-open interval overlap; adjacent windows where r.end_date == window.start_date do NOT overlap)
      # Buffer rule: units whose home_city_code != stop city require a 1-day transit buffer:
      # for such units, the effective window start is window.start_date - 1 day.
      ranking: order by (u.home_city_code == stop.city_code) DESC,
               then u.rental_days_since_service ASC,
               then u.created_at ASC
      tie-break: created_at ASC (never id)
      fallback: empty candidate_set -> attempt CrossRentalRequest path if use_cross_rental
                and an APPROVED PartnerVendor covers stop.city_code; else ERR_GEAR_UNAVAILABLE
                (or mark-shorted per rider-line SHORTED transition)
    input_set: "GearUnit rows of the requested model; ReservationLine rows in occupied statuses"
    constants:
      MIN_CONDITION_SCORE: 40
      MAX_RENTAL_DAYS_SINCE_SERVICE: 30
      TRANSIT_BUFFER_DAYS: 1
    precision: "date-granularity UTC; half-open [start_date, end_date) overlap arithmetic"
    variants:
      - name: in_house
        when: "candidate_set non-empty"
        difference: "consumes an in-house GearUnit; unit RESERVED"
      - name: cross_rental
        when: "candidate_set empty and use_cross_rental=true and approved vendor covers city"
        difference: "no in-house unit consumed; ReservationLine.is_cross_rental := true; vendor rate used in fee quote instead of model daily rate"

  - name: rental_fee_quote
    description: "Forward-looking provisional fee for a reservation, computed at sourcing time"
    trigger: "RiderLine sourcing and substitution approval"
    algorithm: forward_looking
    formula: |
      days = (end_date - start_date) in whole days (half-open; minimum 1)
      base_rate = is_cross_rental ? vendor_rate_cents_per_day : gear_model.daily_rate_cents
      base = base_rate * days
      # Cartage zone multiplier by (origin_city, dest_city) pair:
      #   same city -> 1.00; same region (both in {LAX,SFO,SEA,PDX} or both in {NYC,BOS,PHI,DC} or both in {NASH,ATL,MEM}) -> 1.10; cross-region -> 1.25
      zone_mult = zone_multiplier(origin_city_code, dest_city_code)
      cartage = round_half_up(base * (zone_mult - 1.0))
      # Insurance surcharge: 8% of base when artist.risk_score >= 50, else 0 (boundary: >= 50 triggers)
      insurance = artist.risk_score >= 50 ? round_half_up(base * 0.08) : 0
      quoted_fee_cents = base + cartage + insurance
    input_set: "ReservationLine fields + GearModel.daily_rate_cents or vendor rate + Artist.risk_score at quote time"
    constants:
      INSURANCE_RISK_THRESHOLD: 50
      INSURANCE_SURCHARGE_PCT: 0.08
      ZONE_LOCAL: 1.00
      ZONE_REGIONAL: 1.10
      ZONE_CROSS_REGION: 1.25
    precision: "integer cents; each of cartage and insurance rounded round_half_up to whole cents BEFORE summing (pinned order: round-per-component then sum)"
    variants:
      - name: provisional
        when: "at sourcing/quote time (forward-looking)"
        difference: "uses current artist.risk_score and full half-open day count; stored in quoted_fee_cents"

  - name: rental_fee_settlement
    description: "Chronological final fee computed at reservation settle; differs from quote"
    trigger: "ReservationLine INSPECTED -> SETTLED"
    algorithm: chronological
    formula: |
      days = (end_date - start_date) in whole days (half-open; minimum 1)
      base_rate = is_cross_rental ? vendor_rate_cents_per_day : gear_model.daily_rate_cents
      base = base_rate * days
      # Late-return penalty processed chronologically: each started 24h block past end_date
      # until actual check-in timestamp adds 1 extra day at 150% of base_rate, computed per block
      late_blocks = ceil(max(0, checked_in_at - end_date) / 24h)
      late_fee = late_blocks * round_half_up(base_rate * 1.5)
      cartage = round_half_up(base * (zone_multiplier(origin_city_code, dest_city_code) - 1.0))
      # Insurance uses risk_score AT SETTLE TIME (not quote time) — primary divergence from quote
      insurance = artist.risk_score >= 50 ? round_half_up(base * 0.08) : 0
      # Shortage credit: if the rider line was marked SHORTED at any point, credit 100% of base
      shortage_credit = rider_line.was_shorted ? base : 0
      settled_fee_cents = base + cartage + insurance + late_fee - shortage_credit
      floor: settled_fee_cents = max(0, settled_fee_cents)
    input_set: "ReservationLine + check-in timestamp + Artist.risk_score at settle + rider-line shorted flag"
    constants:
      LATE_MULTIPLIER: 1.5
      INSURANCE_RISK_THRESHOLD: 50
      INSURANCE_SURCHARGE_PCT: 0.08
    precision: "integer cents; per-component round_half_up then sum; floor at 0 applied last"
    variants:
      - name: final
        when: "at settle time (chronological)"
        difference: "adds late_fee from actual check-in; uses settle-time risk_score; subtracts shortage credit; floored at 0. Provisional vs final can differ for identical window/rate data whenever risk_score crosses 50 between quote and settle or a late return occurs."

  - name: deposit_hold_rule
    description: "Deposit blocked per sourced reservation; tiered by replacement value"
    trigger: "ReservationLine DRAFT -> SOURCED; compensated on cancel/settle"
    algorithm: tiered_pricing
    formula: |
      rv = gear_model.replacement_value_cents
      # Marginal tiers on replacement value:
      #   first 200_000 cents (=$2,000)         -> 20%
      #   next  300_000 cents (=$2,000-$5,000)  -> 15%
      #   remainder above 500_000               -> 10%
      deposit = 0.20 * min(rv, 200_000)
              + 0.15 * min(max(rv - 200_000, 0), 300_000)
              + 0.10 * max(rv - 500_000, 0)
      deposit_held_cents = round_half_up(deposit)
      if artist.deposit_waived: deposit_held_cents = 0
      # Boundary: rv == 200_000 exactly falls entirely in tier 1 (20000 cents? no: 0.20*200000 = 40_000 cents)
      # Boundary: rv == 500_000 exactly uses tier1 + tier2 only (40_000 + 45_000 = 85_000 cents)
    input_set: "GearModel.replacement_value_cents; Artist.deposit_waived"
    constants:
      TIER1_CAP: 200_000
      TIER1_RATE: 0.20
      TIER2_CAP: 300_000
      TIER2_RATE: 0.15
      TIER3_RATE: 0.10
    precision: "integer cents; round_half_up once at the end (sum-then-round; pinned to contrast with rental_fee_quote's round-per-component)"
    variants: []

  - name: damage_charge_rule
    description: "Charge assessed on a damage claim"
    trigger: "DamageClaim -> CHARGED"
    algorithm: threshold
    formula: |
      if assessed_severity == TOTAL_LOSS:
        charge = gear_model.replacement_value_cents
      else:
        charge = repair_estimate_cents
      # Deposit coverage: charge draws from deposit_held_cents of the linked reservation first;
      # any remainder above deposit_held is billed directly (observable as overage_cents)
      overage_cents = max(0, charge - linked_reservation.deposit_held_cents)
      charge_cents = charge
      # Boundary: charge == deposit_held exactly -> overage 0 (>= vs > pinned: overage only when strictly greater)
    input_set: "DamageClaim severity + estimate; GearModel.replacement_value_cents; ReservationLine.deposit_held_cents"
    constants: {}
    precision: "integer cents; no rounding needed"
    variants: []

  - name: cross_rental_settlement
    description: "Commission owed to us by the partner vendor at cross-rental settle"
    trigger: "CrossRentalRequest FULFILLED -> SETTLED"
    algorithm: aggregation
    formula: |
      vendor_revenue = vendor_rate_cents_per_day * days   # days from linked reservation window
      commission_cents = round_half_up(vendor_revenue * vendor.commission_bps / 10_000)
      # Boundary: commission_bps == 0 -> commission 0; bps == 3000 -> 30%
    input_set: "CrossRentalRequest.vendor_rate_cents_per_day; reservation window; PartnerVendor.commission_bps"
    constants:
      BPS_DENOMINATOR: 10_000
    precision: "integer cents; round_half_up once"
    variants: []

  - name: maintenance_cycle_gate
    description: "Decides whether a returning unit goes to AVAILABLE or MAINTENANCE"
    trigger: "ReservationLine DELIVERED -> RETURNED check-in cascade"
    algorithm: threshold
    formula: |
      projected_days = unit.rental_days_since_service + reservation_rental_days
      force_maintenance = (projected_days >= 30) OR (unit.condition_score < 40)
      # Boundary: projected_days == 30 exactly forces MAINTENANCE (>= pinned)
      # Boundary: condition_score == 40 exactly does NOT force (strictly < 40)
      if force_maintenance: open MaintenanceTicket (SCHEDULED_CYCLE if days-tripped else CONDITION_THRESHOLD)
    input_set: "GearUnit.rental_days_since_service + condition_score; reservation rental days"
    constants:
      MAX_RENTAL_DAYS_SINCE_SERVICE: 30
      MIN_CONDITION_SCORE: 40
    precision: "integer day arithmetic"
    variants: []

  - name: artist_risk_score
    description: "Derived artist risk from damage claim history"
    trigger: "DamageClaim assessment and PAID settlement"
    algorithm: weighted_scoring
    formula: |
      # window: claims assessed within trailing 365 days, most recent first
      weights: COSMETIC 2, MINOR 5, MAJOR 12, TOTAL_LOSS 30
      # recency multiplier: claims within 90 days x2, 91-365 days x1
      raw = sum(weight(severity) * recency_mult(assessed_at))
      risk_score = min(100, raw)
      # floor 0; recompute from scratch on each triggering event (no incremental drift)
    input_set: "DamageClaim rows of the artist's reservations with status IN {ASSESSED, CHARGED, DISPUTED, PAID}, assessed_at within trailing 365 days"
    constants:
      W_COSMETIC: 2
      W_MINOR: 5
      W_MAJOR: 12
      W_TOTAL_LOSS: 30
      RECENCY_WINDOW_DAYS: 90
      RECENCY_MULT: 2
      CAP: 100
    precision: "integer; cap at 100"
    variants: []

  - name: shortage_credit_rule
    description: "Projected-fee credit when a rider line is marked SHORTED"
    trigger: "RiderLine REQUESTED -> SHORTED"
    algorithm: aggregation
    formula: |
      credit = gear_model.daily_rate_cents * line.quantity * tour_stop_day_count
      tour.projected_rental_fee_cents = max(0, tour.projected_rental_fee_cents - credit)
    input_set: "GearModel.daily_rate_cents; RiderLine.quantity; stop day count (1 per stop)"
    constants:
      STOP_DAY_COUNT: 1
    precision: "integer cents"
    variants: []

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; role value is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Role permitted for this endpoint per RBAC matrix"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Path-templated resources exist, validated left-to-right (tour before stop before line)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 4
    category: state
    check: "Target resource's current state permits the requested transition per §1.2"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 5
    category: state
    check: "OCC expected_*_version matches the parent entity's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: ["POST /backline/tours/{id}/activate", "POST /backline/rider-lines/{id}/approve-substitution", "POST /backline/reservation-lines/{id}/settle"]
  - priority: 6
    category: business_safety
    check: "Segregation of duties: DamageClaim assessor X-User-ID must differ from claim.filed_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: ["POST /backline/damage-claims/{id}/assess"]
  - priority: 7
    category: business_safety
    check: "GearUnit condition/service gate: condition_score >= 40 and rental_days_since_service < 30 before sourcing"
    error_id: ERR_UNIT_NOT_SERVICEABLE
    http_status: 422
    applies_to: ["POST /backline/rider-lines/{id}/source"]
  - priority: 8
    category: business_temporal
    check: "Half-open interval overlap: no conflicting SOURCED/DISPATCHED/DELIVERED reservation on the candidate unit for the window (adjacent end==start permitted); cross-city units require 1-day transit buffer"
    error_id: ERR_GEAR_UNAVAILABLE
    http_status: 409
    applies_to: ["POST /backline/rider-lines/{id}/source", "POST /backline/rider-lines/{id}/propose-substitution"]
  - priority: 9
    category: business_temporal
    check: "TourStop.venue_date within [tour.start_date, tour.end_date]; load_in_ts before venue_date 20:00; reservation start_date < end_date"
    error_id: ERR_INVALID_WINDOW
    http_status: 422
    applies_to: ["POST /backline/tours/{id}/stops", "POST /backline/rider-lines/{id}/source"]
  - priority: 10
    category: business_constraint
    check: "Substitute model must appear in GearModel.substitute_model_ids"
    error_id: ERR_SUBSTITUTION_NOT_ALLOWED
    http_status: 422
    applies_to: ["POST /backline/rider-lines/{id}/propose-substitution"]
  - priority: 11
    category: business_constraint
    check: "Shipment capacity: loading a line keeps booked_weight_kg <= capacity_kg; flight-case required when unit.flight_case_required"
    error_id: ERR_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: ["POST /backline/shipment-lines/{id}/load", "POST /backline/shipments/{id}/lines"]
  - priority: 12
    category: business_constraint
    check: "Flight-case requirement: unit.flight_case_required implies flight_case_id present with case.status == AVAILABLE and adequate size_class"
    error_id: ERR_FLIGHT_CASE_REQUIRED
    http_status: 422
    applies_to: ["POST /backline/shipment-lines/{id}/load", "POST /backline/shipments/{id}/lines"]
  - priority: 13
    category: business_referential
    check: "Cross-rental integrity: vendor.status == APPROVED and vendor.city_codes contains stop city; acting PartnerVendorRep belongs to request.partner_vendor_id"
    error_id: ERR_VENDOR_NOT_ELIGIBLE
    http_status: 422
    applies_to: ["POST /backline/cross-rental-requests", "POST /backline/cross-rental-requests/{id}/accept"]
  - priority: 14
    category: business_fiscal
    check: "Deposit headroom: artist.deposit_credit_cents - (sum of held deposits) - new deposit_held_cents >= 0 at sourcing; activation re-checks aggregate"
    error_id: ERR_DEPOSIT_INSUFFICIENT
    http_status: 402
    applies_to: ["POST /backline/rider-lines/{id}/source", "POST /backline/tours/{id}/activate"]
  - priority: 15
    category: business_fiscal
    check: "Tour activation requires insurance_policy_id unless artist.deposit_waived"
    error_id: ERR_INSURANCE_REQUIRED
    http_status: 422
    applies_to: ["POST /backline/tours/{id}/activate"]
  - priority: 16
    category: business_constraint
    check: "Required request fields present and well-typed; enum values in declared sets; quantities >= 1; dates parse as ISO8601"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- clock (test-driving; mandatory default) ---
  - method: POST
    path: "/backline/_clock/set_current_utc"
    description: "Sets the server's logical clock. Before any call, the clock defaults to exactly 2026-08-01T00:00:00Z and MUST NOT fall back to wall-clock time."
    roles: [OpsManager]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: []

  # --- Artists ---
  - method: POST
    path: "/backline/artists"
    description: "Register an artist"
    roles: [OpsManager]
    code: 201
    input: [legal_name, "tier?", "deposit_waived?"]
    output: Artist
    side_effects: []
  - method: POST
    path: "/backline/artists/{id}/deposit-topups"
    description: "Post a deposit top-up: increases artist.deposit_credit_cents by amount_cents (real-world cashier op for prepaid damage deposits)"
    roles: [OpsManager, TourManager]
    code: 200
    input: [amount_cents]
    output: Artist
    side_effects: ["artist.deposit_credit_cents += amount_cents", "increments Artist.version"]
  - method: GET
    path: "/backline/artists/{id}"
    description: "Fetch artist including computed deposit_credit_cents and risk_score"
    roles: [OpsManager, TourManager, LogisticsCoordinator]
    code: 200
    input: []
    output: Artist
    side_effects: []
  - method: GET
    path: "/backline/artists"
    description: "List artists (paginated)"
    roles: [OpsManager, TourManager, LogisticsCoordinator]
    code: 200
    input: ["limit?", "offset?", "tier?"]
    output: Artist[]
    side_effects: []
  - method: PATCH
    path: "/backline/artists/{id}"
    description: "Update artist mutable fields (tier, deposit_waived)"
    roles: [OpsManager]
    code: 200
    input: ["tier?", "deposit_waived?"]
    output: Artist
    side_effects: ["increments Artist.version"]

  # --- Tours ---
  - method: POST
    path: "/backline/tours"
    description: "Create a tour in DRAFT"
    roles: [TourManager]
    code: 201
    input: [artist_id, name, start_date, end_date, "insurance_policy_id?"]
    output: Tour
    side_effects: []
  - method: GET
    path: "/backline/tours/{id}"
    description: "Fetch tour"
    roles: [OpsManager, TourManager, LogisticsCoordinator, WarehouseTech]
    code: 200
    input: []
    output: Tour
    side_effects: []
  - method: GET
    path: "/backline/tours"
    description: "List tours (paginated; filterable)"
    roles: [OpsManager, TourManager, LogisticsCoordinator, WarehouseTech]
    code: 200
    input: ["limit?", "offset?", "artist_id?", "status?"]
    output: Tour[]
    side_effects: []
  - method: POST
    path: "/backline/tours/{id}/activate"
    description: "Activate a DRAFT tour (OCC-guarded)"
    roles: [TourManager]
    code: 200
    input: [expected_tour_version]
    output: Tour
    side_effects: ["increments Tour.version", "recomputes projected_rental_fee_cents"]
  - method: POST
    path: "/backline/tours/{id}/complete"
    description: "Complete an ACTIVE tour; computes final settlement"
    roles: [TourManager]
    code: 200
    input: []
    output: Tour
    side_effects: ["increments Tour.version", "runs rental_fee_settlement", "releases deposits"]
  - method: POST
    path: "/backline/tours/{id}/cancel"
    description: "Cancel a tour with cascade"
    roles: [TourManager, OpsManager]
    code: 200
    input: []
    output: Tour
    side_effects: ["increments Tour.version", "cascades to stops, rider lines, reservations, gear units"]

  # --- Tour stops ---
  - method: POST
    path: "/backline/tours/{id}/stops"
    description: "Add a stop to a tour"
    roles: [TourManager]
    code: 201
    input: [city_code, venue_date, load_in_ts]
    output: TourStop
    side_effects: ["increments parent Tour.version", "recomputes tour.stop_count"]
  - method: GET
    path: "/backline/tours/{id}/stops"
    description: "List stops of a tour"
    roles: [OpsManager, TourManager, LogisticsCoordinator, WarehouseTech]
    code: 200
    input: ["limit?", "offset?"]
    output: TourStop[]
    side_effects: []
  - method: GET
    path: "/backline/tour-stops/{id}"
    description: "Fetch one stop"
    roles: [OpsManager, TourManager, LogisticsCoordinator, WarehouseTech]
    code: 200
    input: []
    output: TourStop
    side_effects: []
  - method: POST
    path: "/backline/tour-stops/{id}/stage"
    description: "PLANNED -> GEAR_STAGED"
    roles: [LogisticsCoordinator]
    code: 200
    input: []
    output: TourStop
    side_effects: ["increments TourStop.version"]
  - method: POST
    path: "/backline/tour-stops/{id}/show-ready"
    description: "GEAR_STAGED -> SHOW_READY"
    roles: [WarehouseTech]
    code: 200
    input: []
    output: TourStop
    side_effects: ["increments TourStop.version"]
  - method: POST
    path: "/backline/tour-stops/{id}/load-out"
    description: "SHOW_READY -> LOADED_OUT; returns all delivered reservations"
    roles: [WarehouseTech]
    code: 200
    input: []
    output: TourStop
    side_effects: ["increments TourStop.version", "cascades ReservationLine DELIVERED -> RETURNED", "maintenance_cycle_gate per unit"]
  - method: POST
    path: "/backline/tour-stops/{id}/settle"
    description: "LOADED_OUT -> SETTLED"
    roles: [TourManager]
    code: 200
    input: []
    output: TourStop
    side_effects: ["increments TourStop.version"]
  - method: POST
    path: "/backline/tour-stops/{id}/cancel"
    description: "PLANNED -> CANCELLED with cascade"
    roles: [TourManager]
    code: 200
    input: []
    output: TourStop
    side_effects: ["increments TourStop.version", "cascades rider lines and reservations"]

  # --- Rider lines ---
  - method: POST
    path: "/backline/tour-stops/{id}/rider-lines"
    description: "Add a rider line to a stop"
    roles: [TourManager]
    code: 201
    input: [gear_model_id, quantity, "substitution_of_line_id?", "substitution_reason?"]
    output: RiderLine
    side_effects: ["increments parent TourStop.rider_revision", "increments TourStop.version"]
  - method: GET
    path: "/backline/tour-stops/{id}/rider-lines"
    description: "List rider lines of a stop"
    roles: [OpsManager, TourManager, LogisticsCoordinator, WarehouseTech]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: RiderLine[]
    side_effects: []
  - method: GET
    path: "/backline/rider-lines"
    description: "List rider lines across stops (filterable by model, reservation, substitution link)"
    roles: [OpsManager, TourManager, LogisticsCoordinator, WarehouseTech]
    code: 200
    input: ["limit?", "offset?", "gear_model_id?", "fulfilled_by_reservation_id?", "substitution_of_line_id?", "status?"]
    output: RiderLine[]
    side_effects: []
  - method: GET
    path: "/backline/rider-lines/{id}"
    description: "Fetch one rider line"
    roles: [OpsManager, TourManager, LogisticsCoordinator, WarehouseTech]
    code: 200
    input: []
    output: RiderLine
    side_effects: []
  - method: POST
    path: "/backline/rider-lines/{id}/source"
    description: "Source the line: pick unit (or cross-rental), create SOURCED reservation"
    roles: [LogisticsCoordinator]
    code: 200
    input: [origin_city_code, dest_city_code, start_date, end_date, "use_cross_rental?", "partner_vendor_id?", "vendor_rate_cents_per_day?"]
    output: ReservationLine
    side_effects: ["assigns GearUnit (RESERVED)", "computes quoted_fee_cents", "computes + debits deposit_held_cents", "increments TourStop.rider_revision"]
  - method: POST
    path: "/backline/rider-lines/{id}/propose-substitution"
    description: "SOURCED -> SUBSTITUTION_PENDING"
    roles: [LogisticsCoordinator]
    code: 200
    input: [substitute_gear_model_id, substitution_reason]
    output: RiderLine
    side_effects: ["increments RiderLine.version", "increments TourStop.rider_revision"]
  - method: POST
    path: "/backline/rider-lines/{id}/approve-substitution"
    description: "SUBSTITUTION_PENDING -> APPROVED (OCC-guarded on stop rider_revision)"
    roles: [TourManager]
    code: 200
    input: [expected_tour_stop_rider_revision]
    output: RiderLine
    side_effects: ["cancels old reservation + releases unit + credits deposit", "creates new reservation + reserves substitute unit + debits deposit", "increments RiderLine.version"]
  - method: POST
    path: "/backline/rider-lines/{id}/reject-substitution"
    description: "SUBSTITUTION_PENDING -> SOURCED (revision loop)"
    roles: [TourManager]
    code: 200
    input: []
    output: RiderLine
    side_effects: ["increments RiderLine.version", "increments TourStop.rider_revision"]
  - method: POST
    path: "/backline/rider-lines/{id}/mark-fulfilled"
    description: "SOURCED/APPROVED -> FULFILLED after delivery"
    roles: [WarehouseTech]
    code: 200
    input: []
    output: RiderLine
    side_effects: ["increments RiderLine.version"]
  - method: POST
    path: "/backline/rider-lines/{id}/mark-shorted"
    description: "REQUESTED -> SHORTED when no unit and no vendor can cover"
    roles: [LogisticsCoordinator]
    code: 200
    input: []
    output: RiderLine
    side_effects: ["increments RiderLine.version", "applies shortage_credit_rule"]
  - method: POST
    path: "/backline/rider-lines/{id}/cancel"
    description: "Cancel a non-terminal rider line"
    roles: [TourManager]
    code: 200
    input: []
    output: RiderLine
    side_effects: ["increments RiderLine.version", "may cancel linked reservation and release unit"]

  # --- Gear catalog ---
  - method: POST
    path: "/backline/gear-models"
    description: "Create a catalog model"
    roles: [OpsManager]
    code: 201
    input: [sku, category, daily_rate_cents, replacement_value_cents, weight_class, "substitute_model_ids?"]
    output: GearModel
    side_effects: []
  - method: GET
    path: "/backline/gear-models/{id}"
    description: "Fetch a model"
    roles: [OpsManager, TourManager, LogisticsCoordinator, WarehouseTech]
    code: 200
    input: []
    output: GearModel
    side_effects: []
  - method: GET
    path: "/backline/gear-models"
    description: "List models (paginated, filterable)"
