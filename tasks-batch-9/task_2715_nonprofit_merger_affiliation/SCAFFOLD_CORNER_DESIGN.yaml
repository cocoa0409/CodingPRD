        distinguishing_aspect: |
          A waiver is not a clearance: the finding is accepted as unresolved, yet it must
          leave the exposure input set exactly as a clearance does, and it must satisfy the
          same all-children-terminal aggregate that closes diligence. So one call has to
          move three things at once - the finding to WAIVED, the deal to DILIGENCE_CLOSED,
          and the next assessment's open_diligence_exposure_cents from 33250000 to 0,
          restoring reserve_months from 4.00 to 5.99. The waiver is also segregated: the
          diligence lead who raised the finding may not waive it.
