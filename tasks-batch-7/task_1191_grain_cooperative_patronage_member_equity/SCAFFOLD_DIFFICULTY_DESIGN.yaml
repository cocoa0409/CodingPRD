              payload: { member_id: "${m24}", kind: "RETIREMENT", certificate_ids: ["${cert24}"], requested_amount_cents: 100, appointment_at: "2031-10-01T10:15:00Z" }
              as: Member
              as_user_id: "${m24}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_APPOINTMENT_CONFLICT  # 10:15 slot overlaps [10:00, 10:30)"
            - "RedemptionRequest for ${m24} not created"

  # ============================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # ============================================================
  - rule_id: compensating_invariant
    instances:
      - name: patronage_pool_conservation_across_allocation_reverse
        grounds:
          - calculations.patronage_pool_reconciliation_invariant
        distinguishing_aspect: |
          Conserved quantity: patronage_pool_cents. Forward action (close_provisional
          allocates pool across members) + compensating action (reverse an allocation)
          must leave sum(cash_paid + qualified_equity_issued + nonqualified) over
          non-REVERSED allocations == fiscal_year.patronage_pool_cents. The
          reversed allocation's cents return to the unallocated residual — the
          pool total itself is unchanged.
        test_recipe:
          setup:
            - "District DIST-Q, Members M25 and M26, FY14 CLOSED_PROVISIONAL"
            - "Two PROVISIONAL allocations exist (one per member) totalling patronage_pool_cents"
          setup_api_calls:
            - call: "POST /coop/_clock/set_current_utc"
              payload: { to_iso8601: "2025-09-01T00:00:00Z" }
              as: CoopAdmin
            - call: "POST /coop/delegate_districts"
              payload: { code: "DIST-Q", name: "District Q", max_delegates: 3 }
              as: CoopAdmin
              captures: { dist_q: $.data.id }
            - call: "POST /coop/members"
              payload: { patron_ref: "P-025", legal_name: "Uma Farm", member_class: "INDIVIDUAL", joined_at: "2020-01-01T00:00:00Z", delegate_district_id: "${dist_q}", is_producer_member: true }
              as: CoopRegistrar
              captures: { m25: $.data.id }
            - call: "POST /coop/members"
              payload: { patron_ref: "P-026", legal_name: "Vic Farm", member_class: "INDIVIDUAL", joined_at: "2020-01-01T00:00:00Z", delegate_district_id: "${dist_q}", is_producer_member: true }
              as: CoopRegistrar
              captures: { m26: $.data.id }
            - call: "POST /coop/fiscal_years"
              payload: { year_code: "FY2026", start_date: "2025-09-01T00:00:00Z", end_date: "2026-08-31T00:00:00Z", net_margin_cents: 100000, retained_reserve_pct: 0.20, qualified_payout_pct: 0.40 }
              as: CoopAccountant
              captures: { fy14: $.data.id }
            - call: "POST /coop/deliveries"
              payload: { member_id: "${m25}", fiscal_year_id: "${fy14}", commodity: "CORN", gross_bushels: 500, dockage_pct: 0.0, is_patron_sourced: true }
              as: ElevatorOperator
              captures: { d_m25: $.data.id }
            - call: "POST /coop/deliveries/${d_m25}/settle"
              payload: {}
              as: ElevatorOperator
            - call: "POST /coop/deliveries"
              payload: { member_id: "${m26}", fiscal_year_id: "${fy14}", commodity: "CORN", gross_bushels: 500, dockage_pct: 0.0, is_patron_sourced: true }
              as: ElevatorOperator
              captures: { d_m26: $.data.id }
            - call: "POST /coop/deliveries/${d_m26}/settle"
              payload: {}
              as: ElevatorOperator
            - call: "POST /coop/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: CoopAdmin
            - call: "POST /coop/fiscal_years/${fy14}/close_provisional"
              payload: {}
              as: CoopAccountant
            - call: "GET /coop/fiscal_years/${fy14}/allocations"
              payload: {}
              as: CoopAccountant
              captures: { alloc_m25: "$.data[0].id" }
          trigger:
            - call: "POST /coop/allocations/${alloc_m25}/reverse"
              payload: { reason: "audit correction" }
              as: CoopAccountant
            - call: "GET /coop/fiscal_years/${fy14}"
              payload: {}
              as: CoopAccountant
          assert:
            - "PatronageAllocation.${alloc_m25}.status == REVERSED"
            - "FiscalYear.${fy14}.patronage_pool_cents unchanged (== 80000)"
            - "sum(cash_paid + qualified_equity_issued + nonqualified) over non-REVERSED allocations == patronage_pool_cents (invariant)"

      - name: certificate_face_value_conservation_across_estate_distribution
        grounds:
          - calculations.certificate_face_value_conservation
        distinguishing_aspect: |
          Conserved quantity: certificate face_value_cents. Forward action
          (certificate issued at face_value) + compensating actions (partial
          disbursements + final redemption + possible reissue after amendment)
          must satisfy: outstanding_cents + sum(disbursements against cert) ==
          face_value_cents. Different conserved quantity from instance 1 (pool
          cents vs certificate face value cents).
        test_recipe:
          setup:
            - "District DIST-R, Member M27, FY15 CLOSED_FINAL with 1 ACTIVE cert C27 face_value=60000c"
            - "Two partial disbursements of 20000c and 15000c have been made"
          setup_api_calls:
            - call: "POST /coop/_clock/set_current_utc"
              payload: { to_iso8601: "2025-09-01T00:00:00Z" }
              as: CoopAdmin
            - call: "POST /coop/delegate_districts"
              payload: { code: "DIST-R", name: "District R", max_delegates: 3 }
              as: CoopAdmin
              captures: { dist_r: $.data.id }
            - call: "POST /coop/members"
              payload: { patron_ref: "P-027", legal_name: "Walt Farm", member_class: "INDIVIDUAL", joined_at: "2020-01-01T00:00:00Z", delegate_district_id: "${dist_r}", is_producer_member: true }
              as: CoopRegistrar
              captures: { m27: $.data.id }
            - call: "POST /coop/fiscal_years"
              payload: { year_code: "FY2026", start_date: "2025-09-01T00:00:00Z", end_date: "2026-08-31T00:00:00Z", net_margin_cents: 200000, retained_reserve_pct: 0.10, qualified_payout_pct: 0.20 }
              as: CoopAccountant
              captures: { fy15: $.data.id }
            - call: "POST /coop/deliveries"
              payload: { member_id: "${m27}", fiscal_year_id: "${fy15}", commodity: "CORN", gross_bushels: 1000, dockage_pct: 0.0, is_patron_sourced: true }
              as: ElevatorOperator
              captures: { d_m27: $.data.id }
            - call: "POST /coop/deliveries/${d_m27}/settle"
              payload: {}
              as: ElevatorOperator
            - call: "POST /coop/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: CoopAdmin
            - call: "POST /coop/fiscal_years/${fy15}/close_provisional"
              payload: {}
              as: CoopAccountant
            - call: "POST /coop/fiscal_years/${fy15}/begin_audit"
              payload: {}
              as: ExternalAuditor
            - call: "GET /coop/fiscal_years/${fy15}"
              payload: {}
              as: CoopAccountant
              captures: { fy15_v_pre_final: $.data.version }
            - call: "POST /coop/fiscal_years/${fy15}/finalize_close"
              payload: { expected_fiscal_year_version: "${fy15_v_pre_final}" }
              as: CoopAccountant
            - call: "GET /coop/members/${m27}/certificates"
              payload: {}
              as: Member
              as_user_id: "${m27}"
              captures: { cert27: "$.data[0].id", cert27_face: "$.data[0].face_value_cents", cert27_v0: "$.data[0].version" }
            - call: "POST /coop/_clock/set_current_utc"
              payload: { to_iso8601: "2031-09-01T00:00:00Z" }
              as: CoopAdmin
            - call: "POST /coop/redemption_requests"
              payload: { member_id: "${m27}", kind: "RETIREMENT", certificate_ids: ["${cert27}"], requested_amount_cents: 20000, appointment_at: "2031-10-01T10:00:00Z" }
              as: Member
              as_user_id: "${m27}"
              captures: { req_a: $.data.id }
            - call: "POST /coop/redemption_requests/${req_a}/submit_for_review"
              payload: {}
              as: Member
              as_user_id: "${m27}"
            - call: "POST /coop/board_resolutions"
              payload: { resolution_code: "RES-RET-A", kind: "APPROVE_RETIREMENT", subject_ref_id: "${req_a}", quorum_required: 1, voting_opens_at: "2031-09-01T00:00:00Z", voting_closes_at: "2031-09-02T00:00:00Z" }
              as: BoardSecretary
              captures: { res_a2: $.data.id }
            - call: "POST /coop/delegate_districts/${dist_r}/delegates"
              payload: { member_id: "${m27}", term_start: "2025-01-01T00:00:00Z", term_end: "2035-01-01T00:00:00Z" }
              as: CoopRegistrar
              captures: { del_m27: $.data.id }
            - call: "POST /coop/board_resolutions/${res_a2}/open_voting"
              payload: {}
              as: BoardSecretary
            - call: "POST /coop/_clock/set_current_utc"
              payload: { to_iso8601: "2031-09-03T00:00:00Z" }
              as: CoopAdmin
            - call: "POST /coop/board_resolutions/${res_a2}/record_vote"
              payload: { delegate_id: "${del_m27}", vote: "FOR" }
              as: BoardSecretary
            - call: "POST /coop/redemption_requests/${req_a}/decide"
              payload: { decision: "APPROVE", resolution_id: "${res_a2}" }
              as: BoardSecretary
            - call: "GET /coop/certificates/${cert27}"
              payload: {}
              as: CoopTreasurer
              captures: { cert27_v1: $.data.version }
            - call: "POST /coop/redemption_requests/${req_a}/disburse"
              payload: { expected_certificate_versions: ["${cert27_v1}"] }
              as: CoopTreasurer
          trigger:
            - call: "GET /coop/certificates/${cert27}"
              payload: {}
              as: CoopTreasurer
          assert:
            - "EquityCertificate.${cert27}.status == PARTIALLY_REDEEMED"
            - "EquityCertificate.${cert27}.outstanding_cents + 20000 == EquityCertificate.${cert27}.face_value_cents"
            - "Invariant: outstanding_cents + sum(disbursements) == face_value_cents holds"
