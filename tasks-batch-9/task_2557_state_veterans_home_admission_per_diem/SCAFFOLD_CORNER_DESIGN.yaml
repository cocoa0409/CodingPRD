            - call: "GET /svh/care-units/${nu_id}"
              payload: {}
              as: AdmissionsCoordinator
              captures: { nu_v: "$.data.version" }
            - call: "POST /svh/applicants/${app_id}/admission-decision"
              payload: { decision: "APPROVED", care_unit_id: "${nu_id}", clinical_assessment_id: "${asmt_id}", expected_care_unit_version: "${nu_v}", admission_date: "2026-08-01" }
              as: AdmissionsCoordinator
              as_user_id: "coordinator-1"
              captures: { res_id: "$.data.id" }
            - call: "POST /svh/residents/${res_id}/trust-fund-transactions"
              payload: { txn_type: "DEPOSIT", amount_cents: 50000, effective_date: "2026-08-01", memo: "family deposit" }
              as: BusinessOfficeManager
              as_user_id: "bom-1"
              captures: { d_id: "$.data.id", d_signed: "$.data.signed_amount_cents", d_bal: "$.data.balance_after_cents", d_rev0: "$.data.reversed", d_by: "$.data.recorded_by_user_id" }
          trigger:
            - call: "POST /svh/trust-fund-transactions/${d_id}/reverse"
              payload: { memo: "recorder tries to undo their own entry" }
              as: BusinessOfficeManager
              as_user_id: "bom-1"
              captures: { sod_err: "$.data.error_id" }
            - call: "POST /svh/trust-fund-transactions/${d_id}/reverse"
              payload: { memo: "second operator reverses" }
              as: BusinessOfficeManager
              as_user_id: "bom-2"
              captures: { r_id: "$.data.id", r_type: "$.data.txn_type", r_amt: "$.data.amount_cents", r_signed: "$.data.signed_amount_cents", r_bal: "$.data.balance_after_cents", r_target: "$.data.reverses_transaction_id", r_by: "$.data.recorded_by_user_id" }
            - call: "POST /svh/trust-fund-transactions/${d_id}/reverse"
              payload: { memo: "third attempt by the original recorder" }
              as: BusinessOfficeManager
              as_user_id: "bom-1"
              captures: { again_err: "$.data.error_id" }
            - call: "POST /svh/trust-fund-transactions/${r_id}/reverse"
              payload: { memo: "reversing the reversal" }
              as: BusinessOfficeManager
              as_user_id: "bom-3"
              captures: { chain_err: "$.data.error_id" }
            - call: "GET /svh/trust-fund-transactions/${d_id}"
              payload: {}
              as: BusinessOfficeManager
              as_user_id: "bom-1"
              captures: { d_rev1: "$.data.reversed" }
            - call: "GET /svh/residents/${res_id}"
              payload: {}
              as: BusinessOfficeManager
              as_user_id: "bom-1"
              captures: { res_bal: "$.data.trust_fund_balance_cents" }
            - call: "GET /svh/trust-fund-transactions"
              payload: { resident_id: "${res_id}", limit: 10 }
              as: BusinessOfficeManager
              as_user_id: "bom-1"
              captures: { txn_total: "$.meta.total_count" }
            - call: "GET /svh/trust-fund-transactions"
              payload: { resident_id: "${res_id}", reversed: true, limit: 10 }
              as: BusinessOfficeManager
              as_user_id: "bom-1"
              captures: { rev_total: "$.meta.total_count", rev_first: "$.data[0].id" }
          assert:
            - "d_signed == 50000"
            - "d_bal == 50000"
            - "d_rev0 == false"
            - "d_by == bom-1"
            - "the recorder's own reversal attempt returns HTTP 403"
            - "sod_err == ERR_SEGREGATION_OF_DUTIES"
            - "the second operator's reversal returns HTTP 201"
            - "r_type == REVERSAL"
            - "r_amt == 50000"
            - "r_signed == -50000"
            - "r_bal == 0"
            - "r_target == ${d_id}"
            - "r_by == bom-2"
            - "the recorder's post-reversal attempt returns HTTP 409"
            - "again_err == ERR_TRANSACTION_ALREADY_REVERSED"
            - "reversing the REVERSAL row returns HTTP 409"
            - "chain_err == ERR_TRANSACTION_ALREADY_REVERSED"
            - "d_rev1 == true"
            - "res_bal == 0"
            - "txn_total == 2"
            - "rev_total == 1"
            - "rev_first == ${d_id}"

      - name: err_home_recognition_state_invalid_for_mismatched_action
        claim_type: error_triggerable
        grounds:
          - errors.ERR_HOME_RECOGNITION_STATE_INVALID
          - validations[priority=60,ERR_HOME_RECOGNITION_STATE_INVALID]
          - endpoints.POST_svh_veterans_homes_id_recognition
        distinguishing_aspect: |
          Each recognition action is legal from exactly ONE standing: GRANT only from PROVISIONAL,
          SUSPEND only from RECOGNIZED, RESTORE only from SUSPENDED. Every mismatch answers 409
          ERR_HOME_RECOGNITION_STATE_INVALID and leaves recognition_status and
          recognition_effective_date untouched - an implementation that treats the action as an
          idempotent setter would return 200 and silently rewrite the effective date.
        test_recipe:
          setup:
            - "Home A is created with the default recognition_status RECOGNIZED and recognition_effective_date 2026-07-01."
            - "Home B is created with recognition_status PROVISIONAL and recognition_effective_date 2026-07-15."
            - "Neither home has any care unit, so decertified_unit_count is 0 for both and RESTORE is never blocked by a decertified unit."
          setup_api_calls:
            - call: "POST /svh/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: StateProgramAdmin
            - call: "POST /svh/veterans-homes"
              payload: { name: "Larkspur State Veterans Home", state_code: "MN", recognition_effective_date: "2026-07-01" }
              as: StateProgramAdmin
              captures: { a_id: "$.data.id", a_status0: "$.data.recognition_status", a_eff0: "$.data.recognition_effective_date", a_dec: "$.data.decertified_unit_count" }
            - call: "POST /svh/veterans-homes"
              payload: { name: "Meadowlark State Veterans Home", state_code: "MN", recognition_status: "PROVISIONAL", recognition_effective_date: "2026-07-15" }
              as: StateProgramAdmin
              captures: { b_id: "$.data.id", b_status0: "$.data.recognition_status" }
          trigger:
            - call: "POST /svh/veterans-homes/${a_id}/recognition"
              payload: { action: "GRANT", effective_date: "2026-08-01", note: "grant on an already recognized home" }
              as: StateProgramAdmin
              captures: { a_grant_err: "$.data.error_id" }
            - call: "POST /svh/veterans-homes/${a_id}/recognition"
              payload: { action: "RESTORE", effective_date: "2026-08-01", note: "restore on a recognized home" }
              as: StateProgramAdmin
              captures: { a_restore_err: "$.data.error_id" }
            - call: "POST /svh/veterans-homes/${b_id}/recognition"
              payload: { action: "SUSPEND", effective_date: "2026-08-01", note: "suspend on a provisional home" }
              as: StateProgramAdmin
              captures: { b_suspend_err: "$.data.error_id" }
            - call: "GET /svh/veterans-homes/${a_id}"
              payload: {}
              as: StateProgramAdmin
              captures: { a_status1: "$.data.recognition_status", a_eff1: "$.data.recognition_effective_date" }
            - call: "POST /svh/veterans-homes/${b_id}/recognition"
              payload: { action: "GRANT", effective_date: "2026-08-01", note: "federal recognition granted" }
              as: StateProgramAdmin
              captures: { b_status1: "$.data.recognition_status", b_eff1: "$.data.recognition_effective_date", b_reason1: "$.data.recognition_suspended_reason" }
            - call: "POST /svh/veterans-homes/${a_id}/recognition"
              payload: { action: "SUSPEND", effective_date: "2026-08-02", note: "state-initiated suspension" }
              as: StateProgramAdmin
              captures: { a_status2: "$.data.recognition_status", a_reason2: "$.data.recognition_suspended_reason" }
            - call: "POST /svh/veterans-homes/${a_id}/recognition"
              payload: { action: "SUSPEND", effective_date: "2026-08-03", note: "suspend twice" }
              as: StateProgramAdmin
              captures: { a_suspend_err: "$.data.error_id" }
            - call: "POST /svh/veterans-homes/${a_id}/recognition"
              payload: { action: "RESTORE", effective_date: "2026-08-04", note: "restored after review" }
              as: StateProgramAdmin
              captures: { a_status3: "$.data.recognition_status", a_eff3: "$.data.recognition_effective_date", a_reason3: "$.data.recognition_suspended_reason" }
          assert:
            - "a_status0 == RECOGNIZED"
            - "a_eff0 == 2026-07-01"
            - "a_dec == 0"
            - "b_status0 == PROVISIONAL"
            - "the GRANT on the RECOGNIZED home returns HTTP 409"
            - "a_grant_err == ERR_HOME_RECOGNITION_STATE_INVALID"
            - "the RESTORE on the RECOGNIZED home returns HTTP 409"
            - "a_restore_err == ERR_HOME_RECOGNITION_STATE_INVALID"
            - "the SUSPEND on the PROVISIONAL home returns HTTP 409"
            - "b_suspend_err == ERR_HOME_RECOGNITION_STATE_INVALID"
            - "a_status1 == RECOGNIZED"
            - "a_eff1 == 2026-07-01"
            - "b_status1 == RECOGNIZED"
            - "b_eff1 == 2026-08-01"
            - "b_reason1 == null"
            - "a_status2 == SUSPENDED"
            - "a_reason2 == UNIT_DECERTIFIED"
            - "the second SUSPEND returns HTTP 409"
            - "a_suspend_err == ERR_HOME_RECOGNITION_STATE_INVALID"
            - "a_status3 == RECOGNIZED"
            - "a_eff3 == 2026-08-04"
            - "a_reason3 == null"

      - name: err_no_waitlist_entry_for_unit_on_admission_decision
        claim_type: error_triggerable
        grounds:
          - errors.ERR_NO_WAITLIST_ENTRY_FOR_UNIT
          - validations[priority=76,ERR_NO_WAITLIST_ENTRY_FOR_UNIT]
          - state_machines.WaitlistEntry
        distinguishing_aspect: |
          The waitlist entry must exist on the DECISION'S care unit, not merely somewhere in the home: an
          applicant queued only on Nursing A cannot be admitted to Nursing B even though B is certified,
          OPEN, level-matched and has free beds. Once the B entry exists the identical decision succeeds,
          and the A entry is cascaded to CANCELLED while the B entry becomes ADMITTED - so the error is
          about entry-to-unit alignment, not about the applicant's overall queue standing.
        test_recipe:
          setup:
            - "One RECOGNIZED VeteransHome with two CERTIFIED NURSING units, Nursing A and Nursing B, each licensed_bed_count 2 with 0 out of service."
            - "One ELIGIBLE applicant holding a single ACTIVE WaitlistEntry on Nursing A, with a SUBMITTED NURSING assessment authored by assessor-1."
          setup_api_calls:
            - call: "POST /svh/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
