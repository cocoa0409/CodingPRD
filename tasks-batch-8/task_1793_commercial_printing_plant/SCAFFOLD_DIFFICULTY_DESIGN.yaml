# =============================================================================
# §1.8 Scaffold Difficulty Design — Commercial Printing Plant
# 21 instances across the nine Difficulty Rules (>= 2 per rule).
# All asserted numerics were pre-computed from the pinned formulas in §1.3.
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: estimate_provisional_vs_gang_final_invoice
        grounds:
          - calculations.estimate_provisional_total
          - calculations.gang_make_ready_allocation
          - entities.Invoice.fields.base_amount_cents
          - entities.Job.fields.total_price_cents
          - entities.Job.fields.allocated_make_ready_cents
        distinguishing_aspect: |
          Cost-accounting domain (Estimate/Invoice): the provisional variant
          snapshots job.total_price_cents = 211418 at accept, while the
          final_invoice variant substitutes the gang-allocated make-ready
          (48000 for the standalone 100000) and re-derives the discount tier
          from the adjusted subtotal 159418 (0% tier), yielding invoice
          base_amount_cents = 159418 for identical delivered quantity —
          a 52000-cent divergence caused purely by variant selection.
        test_recipe:
          setup:
            - "Customer C (limit 100000000), stock S (9c/sheet, threshold 0), PO 10000 fully received"
            - "Estimate E1: Q=4000, one signature up=2 MR=100000 rate=37250 stock S, finishing [PERF], spoilage 3/2, SHIP, due 2026-08-20 -> provisional total 211418 (0% tier)"
            - "Estimate E2: Q=6000, one signature up=2 MR=120000 rate=37250 stock S, finishing [SCORE], spoilage 3/2, SHIP, due 2026-08-21 -> provisional total 272118"
            - "Both estimates QUOTED and ACCEPTED; both jobs PLATED via proof upload + approve"
            - "GangRun G on stock S / WEB / anchor 2026-08-20 with both members, LOCKED (allocations 48000 to earliest-created J1, 72000 to J2)"
            - "Gang press run (run_quantity 10000) completed; both jobs BINDERY -> bindery ticket completed -> READY_TO_SHIP; J1 delivered exactly 4000"
          setup_api_calls:
            - { call: "POST /customers", payload: { name: "Gang Cust", credit_limit_cents: 100000000, default_tolerance_pct: 5 }, as: PlantManager, captures: { cust: $.data.id } }
            - { call: "POST /paper-stocks", payload: { name: "80G", grade: "COATED", cost_per_sheet_cents: 9, reorder_threshold_sheets: 0, reorder_quantity_sheets: 20000 }, as: PurchasingManager, captures: { stock: $.data.id } }
            - { call: "POST /paper-purchase-orders", payload: { paper_stock_id: "${stock}", ordered_sheets: 10000, cost_per_sheet_cents: 9 }, as: PurchasingManager, captures: { po: $.data.id } }
            - { call: "POST /paper-purchase-orders/${po}/receive", payload: { sheets_received: 10000 }, as: PurchasingManager }
            - { call: "POST /estimates", payload: { customer_id: "${cust}", job_name: "G1", quantity_ordered: 4000, press_type: "WEB", binding_method: "SADDLE_STITCH", fulfillment_type: "SHIP", signatures: [ { name: "S1", pages: 16, up_count: 2, paper_stock_id: "${stock}", make_ready_cents: 100000, rate_per_thousand_cents: 37250 } ], finishing_options: ["PERF"], press_spoilage_pct: 3, bindery_spoilage_pct: 2, included_proof_rounds: 2, quote_valid_days: 30, due_date: "2026-08-20T00:00:00Z" }, as: Estimator, captures: { e1: $.data.id, j1_total: $.data.total_price_cents } }
            - { call: "POST /estimates", payload: { customer_id: "${cust}", job_name: "G2", quantity_ordered: 6000, press_type: "WEB", binding_method: "SADDLE_STITCH", fulfillment_type: "SHIP", signatures: [ { name: "S1", pages: 16, up_count: 2, paper_stock_id: "${stock}", make_ready_cents: 120000, rate_per_thousand_cents: 37250 } ], finishing_options: ["SCORE"], press_spoilage_pct: 3, bindery_spoilage_pct: 2, included_proof_rounds: 2, quote_valid_days: 30, due_date: "2026-08-21T00:00:00Z" }, as: Estimator, captures: { e2: $.data.id } }
            - { call: "POST /estimates/${e1}/quote", payload: {}, as: Estimator }
            - { call: "POST /estimates/${e2}/quote", payload: {}, as: Estimator }
            - { call: "POST /estimates/${e1}/accept", payload: {}, as: Customer, as_user_id: "${cust}", captures: { j1: $.data.id } }
            - { call: "POST /estimates/${e2}/accept", payload: {}, as: Customer, as_user_id: "${cust}", captures: { j2: $.data.id } }
            - { call: "POST /proofs", payload: { job_id: "${j1}", file_uri: "s3://g1.pdf" }, as: PrepressOperator, captures: { p1: $.data.id } }
            - { call: "POST /proofs", payload: { job_id: "${j2}", file_uri: "s3://g2.pdf" }, as: PrepressOperator, captures: { p2: $.data.id } }
            - { call: "POST /proofs/${p1}/approve", payload: {}, as: Customer, as_user_id: "${cust}" }
            - { call: "POST /proofs/${p2}/approve", payload: {}, as: Customer, as_user_id: "${cust}" }
            - { call: "POST /gang-runs", payload: { paper_stock_id: "${stock}", press_type: "WEB", anchor_due_date: "2026-08-20T00:00:00Z" }, as: PressScheduler, captures: { gang: $.data.id, gv: $.data.version } }
            - { call: "POST /gang-runs/${gang}/members", payload: { job_id: "${j1}", expected_gang_run_version: "${gv}" }, as: PressScheduler, captures: { gv2: $.data.version } }
            - { call: "POST /gang-runs/${gang}/members", payload: { job_id: "${j2}", expected_gang_run_version: "${gv2}" }, as: PressScheduler }
            - { call: "POST /gang-runs/${gang}/lock", payload: {}, as: PressScheduler, captures: { alloc1: "$.data.members[0].allocated_make_ready_cents" } }
            - { call: "POST /presses", payload: { name: "W1", press_type: "WEB", rated_impressions_per_hour: 10000, make_ready_minutes_base: 45, washup_buffer_minutes: 30 }, as: PlantManager, captures: { press: $.data.id, pv: $.data.version } }
            - { call: "POST /press-runs", payload: { press_id: "${press}", gang_run_id: "${gang}", run_quantity: 10000, scheduled_start: "2026-08-10T08:00:00Z", expected_press_version: "${pv}" }, as: PressScheduler, captures: { run: $.data.id } }
            - { call: "POST /press-runs/${run}/complete", payload: { gross_impressions: 5000, sheets_used: 5254, waste_sheets: 100 }, as: PressScheduler }
            - { call: "POST /bindery-tickets", payload: { job_id: "${j1}", operation: "FOLD", sequence_no: 1 }, as: PlantManager, captures: { bt1: $.data.id } }
            - { call: "POST /bindery-tickets/${bt1}/complete", payload: { pieces_completed: 4000 }, as: PlantManager }
            - { call: "POST /jobs/${j1}/record-delivery", payload: { delivered_quantity: 4000 }, as: PlantManager }
          trigger:
            - { call: "POST /invoices", payload: { job_id: "${j1}" }, as: PlantManager, captures: { inv: $.data.id } }
          assert:
            - "Job.${j1}.total_price_cents == 211418 (provisional snapshot unchanged)"
            - "GangRun.${gang}.members[0].allocated_make_ready_cents == 48000"
            - "Invoice.${inv}.gang_make_ready_allocated_cents == 48000"
            - "Invoice.${inv}.base_amount_cents == 159418 (final variant: adjusted subtotal 159418 at 0% tier x billable 4000/4000)"
            - "Invoice.${inv}.base_amount_cents != Job.${j1}.total_price_cents"

      - name: reprint_provisional_vs_final_credit
        grounds:
          - calculations.reprint_credit
          - entities.ReprintClaim.fields.provisional_credit_cents
          - entities.ReprintClaim.fields.final_credit_cents
          - state_machines.ReprintClaim.UNDER_REVIEW_to_APPROVED
        distinguishing_aspect: |
          Liability domain (ReprintClaim/Invoice), distinct from the
          cost-accounting domain of estimate_provisional_vs_gang_final_invoice:
          provisional credit keys off invoice.base_amount_cents (405962) while
          final credit keys off invoice.total_due_cents including postage
          (532590); both are computed from identical claim inputs in one
          approval transaction and MUST differ because postage_cents = 253256 > 0.
        test_recipe:
          setup:
            - "Customer C (limit 100000000), stock S, PO 50000 fully received"
            - "Estimate: Q=10002, two identical signatures (up=2, MR=150000, rate=37250, stock S), finishing [PERF,SCORE], spoilage 3/2, fulfillment MAIL, due 2026-08-20 -> provisional total 773267"
            - "Job driven to FULFILLED via proof approve -> press run -> bindery -> mail drop of 10502 pieces (zip_counts 90210:5200 / 90401:5000 / 10001:302, postage 253256)"
            - "PRODUCTION invoice issued: base 811923 (overrun boundary), postage 253256, total_due 1065179"
            - "Claim filed for defect_qty 5251 (exactly half of delivered 10502), reviewed by PlantManager pm-1"
          setup_api_calls:
            - { call: "POST /customers", payload: { name: "Mail Cust", credit_limit_cents: 100000000, default_tolerance_pct: 5 }, as: PlantManager, captures: { cust: $.data.id } }
            - { call: "POST /paper-stocks", payload: { name: "80G", grade: "COATED", cost_per_sheet_cents: 9, reorder_threshold_sheets: 0, reorder_quantity_sheets: 20000 }, as: PurchasingManager, captures: { stock: $.data.id } }
            - { call: "POST /paper-purchase-orders", payload: { paper_stock_id: "${stock}", ordered_sheets: 50000, cost_per_sheet_cents: 9 }, as: PurchasingManager, captures: { po: $.data.id } }
            - { call: "POST /paper-purchase-orders/${po}/receive", payload: { sheets_received: 50000 }, as: PurchasingManager }
            - { call: "POST /estimates", payload: { customer_id: "${cust}", job_name: "Mailer", quantity_ordered: 10002, press_type: "WEB", binding_method: "SADDLE_STITCH", fulfillment_type: "MAIL", signatures: [ { name: "A", pages: 16, up_count: 2, paper_stock_id: "${stock}", make_ready_cents: 150000, rate_per_thousand_cents: 37250 }, { name: "B", pages: 16, up_count: 2, paper_stock_id: "${stock}", make_ready_cents: 150000, rate_per_thousand_cents: 37250 } ], finishing_options: ["PERF", "SCORE"], press_spoilage_pct: 3, bindery_spoilage_pct: 2, included_proof_rounds: 2, quote_valid_days: 30, due_date: "2026-08-20T00:00:00Z" }, as: Estimator, captures: { est: $.data.id } }
            - { call: "POST /estimates/${est}/quote", payload: {}, as: Estimator }
            - { call: "POST /estimates/${est}/accept", payload: {}, as: Customer, as_user_id: "${cust}", captures: { job: $.data.id } }
            - { call: "POST /proofs", payload: { job_id: "${job}", file_uri: "s3://m1.pdf" }, as: PrepressOperator, captures: { proof: $.data.id } }
            - { call: "POST /proofs/${proof}/approve", payload: {}, as: Customer, as_user_id: "${cust}" }
            - { call: "POST /presses", payload: { name: "W1", press_type: "WEB", rated_impressions_per_hour: 10000, make_ready_minutes_base: 45, washup_buffer_minutes: 30 }, as: PlantManager, captures: { press: $.data.id, pv: $.data.version } }
            - { call: "POST /press-runs", payload: { press_id: "${press}", job_id: "${job}", run_quantity: 10002, scheduled_start: "2026-08-10T08:00:00Z", expected_press_version: "${pv}" }, as: PressScheduler, captures: { run: $.data.id } }
            - { call: "POST /press-runs/${run}/complete", payload: { gross_impressions: 10002, sheets_used: 10600, waste_sheets: 300 }, as: PressScheduler }
            - { call: "POST /bindery-tickets", payload: { job_id: "${job}", operation: "FOLD", sequence_no: 1 }, as: PlantManager, captures: { bt: $.data.id } }
            - { call: "POST /bindery-tickets/${bt}/complete", payload: { pieces_completed: 10502 }, as: PlantManager }
            - { call: "POST /mail-drops", payload: { job_id: "${job}", drop_date: "2026-08-25", destination_entry: "NONE", piece_weight_oz: 3.5, zip_counts: [ { zip5: "90210", pieces: 5200 }, { zip5: "90401", pieces: 5000 }, { zip5: "10001", pieces: 302 } ] }, as: MailSpecialist, captures: { drop: $.data.id } }
            - { call: "POST /mail-drops/${drop}/presort", payload: {}, as: MailSpecialist }
            - { call: "POST /mail-drops/${drop}/drop", payload: {}, as: MailSpecialist }
            - { call: "POST /invoices", payload: { job_id: "${job}" }, as: PlantManager, captures: { inv: $.data.id } }
            - { call: "POST /invoices/${inv}/issue", payload: {}, as: PlantManager }
            - { call: "POST /reprint-claims", payload: { job_id: "${job}", claimed_defect: "COLOR_SHIFT", defect_qty: 5251 }, as: Customer, as_user_id: "${cust}", captures: { claim: $.data.id } }
            - { call: "POST /reprint-claims/${claim}/review", payload: {}, as: PlantManager, as_user_id: "pm-1" }
          trigger:
            - { call: "POST /reprint-claims/${claim}/approve", payload: { resolution: "CREDIT", liability_pct: 100 }, as: PlantManager, as_user_id: "pm-2", captures: { final_credit: $.data.final_credit_cents, prov_credit: $.data.provisional_credit_cents } }
          assert:
            - "ReprintClaim.${claim}.provisional_credit_cents == 405962 (round_half_up(811923 x 1.00 x 5251/10502))"
            - "ReprintClaim.${claim}.final_credit_cents == 532590 (round_half_up(1065179 x 1.00 x 5251/10502), capped at total_due 1065179)"
            - "ReprintClaim.${claim}.provisional_credit_cents != ReprintClaim.${claim}.final_credit_cents"
            - "Invoice.${inv}.credit_applied_cents == 532590"
            - "Invoice.${inv}.amount_outstanding_cents == 532589"

  - rule_id: combinatorial_formula
    instances:
      - name: per_signature_rounding_order
        grounds:
          - calculations.estimate_provisional_total
          - entities.Estimate.fields.running_cost_cents
        distinguishing_aspect: |
          Mode (b) nested rounding order: 5001 impressions at 37250 cents/M gives
          186287.25 cents per signature; pinned rule rounds PER SIGNATURE then
          sums -> running_cost_cents = 372574, whereas sum-then-round would give
          372575. The scaffold forbids the latter; the 1-cent delta is observable.
        test_recipe:
          setup: ["Customer and stock exist; nothing else"]
          setup_api_calls:
            - { call: "POST /customers", payload: { name: "R Cust", credit_limit_cents: 100000000, default_tolerance_pct: 5 }, as: PlantManager, captures: { cust: $.data.id } }
            - { call: "POST /paper-stocks", payload: { name: "80G", grade: "COATED", cost_per_sheet_cents: 9, reorder_threshold_sheets: 0, reorder_quantity_sheets: 20000 }, as: PurchasingManager, captures: { stock: $.data.id } }
          trigger:
            - { call: "POST /estimates", payload: { customer_id: "${cust}", job_name: "Round", quantity_ordered: 10002, press_type: "WEB", binding_method: "SADDLE_STITCH", fulfillment_type: "SHIP", signatures: [ { name: "A", pages: 16, up_count: 2, paper_stock_id: "${stock}", make_ready_cents: 150000, rate_per_thousand_cents: 37250 }, { name: "B", pages: 16, up_count: 2, paper_stock_id: "${stock}", make_ready_cents: 150000, rate_per_thousand_cents: 37250 } ], finishing_options: ["PERF", "SCORE"], press_spoilage_pct: 3, bindery_spoilage_pct: 2, included_proof_rounds: 2, quote_valid_days: 30, due_date: "2026-08-20T00:00:00Z" }, as: Estimator, captures: { est: $.data.id } }
          assert:
            - "Estimate.${est}.impressions_per_signature == [5001, 5001]"
            - "Estimate.${est}.running_cost_cents == 372574 (per-signature round then sum; NOT 372575)"
            - "Estimate.${est}.paper_sheets_total == 10512"
            - "Estimate.${est}.paper_cost_cents == 94608"
            - "Estimate.${est}.subtotal_cents == 797182"
            - "Estimate.${est}.total_price_cents == 773267"

      - name: tiered_discount_evaluation_order
        grounds:
          - calculations.estimate_provisional_total
          - entities.Estimate.fields.discount_pct
          - entities.Estimate.fields.subtotal_cents
        distinguishing_aspect: |
          Mode (c) circular-looking dependency with pinned evaluation order: the
          discount tier is keyed on the PRE-DISCOUNT subtotal, not the total.
          Constructed so subtotal_cents == 500000 exactly (tier boundary, >=
          inclusive): tier = 3% and total = 485000. If the tier were keyed on the
          post-discount total (485000 < 500000 -> 0%), the total would be 500000 —
          a self-contradiction that pins the evaluation order.
        test_recipe:
          setup: ["Customer and stock (9c/sheet) exist"]
          setup_api_calls:
            - { call: "POST /customers", payload: { name: "T Cust", credit_limit_cents: 100000000, default_tolerance_pct: 5 }, as: PlantManager, captures: { cust: $.data.id } }
            - { call: "POST /paper-stocks", payload: { name: "80G", grade: "COATED", cost_per_sheet_cents: 9, reorder_threshold_sheets: 0, reorder_quantity_sheets: 20000 }, as: PurchasingManager, captures: { stock: $.data.id } }
          trigger:
            - { call: "POST /estimates", payload: { customer_id: "${cust}", job_name: "Tier", quantity_ordered: 4000, press_type: "WEB", binding_method: "SADDLE_STITCH", fulfillment_type: "SHIP", signatures: [ { name: "A", pages: 16, up_count: 2, paper_stock_id: "${stock}", make_ready_cents: 388582, rate_per_thousand_cents: 37250 } ], finishing_options: ["PERF"], press_spoilage_pct: 3, bindery_spoilage_pct: 2, included_proof_rounds: 2, quote_valid_days: 30, due_date: "2026-08-20T00:00:00Z" }, as: Estimator, captures: { est: $.data.id } }
          assert:
            - "Estimate.${est}.running_cost_cents == 74500"
            - "Estimate.${est}.paper_sheets_total == 2102"
            - "Estimate.${est}.paper_cost_cents == 18918"
            - "Estimate.${est}.subtotal_cents == 500000 (388582 + 74500 + 18918 + 18000)"
            - "Estimate.${est}.discount_pct == 3 (500000 satisfies >= TIER1_MIN_CENTS)"
            - "Estimate.${est}.total_price_cents == 485000"

      - name: overrun_underrun_nested_minmax
        grounds:
          - calculations.overrun_underrun_billing
          - entities.Invoice.fields.billable_quantity
          - entities.Invoice.fields.shortage_credit_cents
        distinguishing_aspect: |
          Mode (a) >=3 inputs with non-linear interaction: billable quantity is
          min(D, Q+allowed) clamped below by the shortage branch, with allowed =
          floor(Q*t/100) = 500; the underrun branch (D=9400 < 9502) bills D and
          subtracts a shortage credit on the 102 missing-to-band pieces, producing
          total_due 718840 — unreachable by any linear proration.
        test_recipe:
          setup:
            - "Standard SHIP job (Q=10002, two signatures, total 773267) driven to READY_TO_SHIP, then delivered 9400 (below the inclusive band [9502, 10502])"
          setup_api_calls:
            - { call: "POST /customers", payload: { name: "U Cust", credit_limit_cents: 100000000, default_tolerance_pct: 5 }, as: PlantManager, captures: { cust: $.data.id } }
            - { call: "POST /paper-stocks", payload: { name: "80G", grade: "COATED", cost_per_sheet_cents: 9, reorder_threshold_sheets: 0, reorder_quantity_sheets: 20000 }, as: PurchasingManager, captures: { stock: $.data.id } }
            - { call: "POST /paper-purchase-orders", payload: { paper_stock_id: "${stock}", ordered_sheets: 50000, cost_per_sheet_cents: 9 }, as: PurchasingManager, captures: { po: $.data.id } }
            - { call: "POST /paper-purchase-orders/${po}/receive", payload: { sheets_received: 50000 }, as: PurchasingManager }
            - { call: "POST /estimates", payload: { customer_id: "${cust}", job_name: "Under", quantity_ordered: 10002, press_type: "WEB", binding_method: "SADDLE_STITCH", fulfillment_type: "SHIP", signatures: [ { name: "A", pages: 16, up_count: 2, paper_stock_id: "${stock}", make_ready_cents: 150000, rate_per_thousand_cents: 37250 }, { name: "B", pages: 16, up_count: 2, paper_stock_id: "${stock}", make_ready_cents: 150000, rate_per_thousand_cents: 37250 } ], finishing_options: ["PERF", "SCORE"], press_spoilage_pct: 3, bindery_spoilage_pct: 2, included_proof_rounds: 2, quote_valid_days: 30, due_date: "2026-08-20T00:00:00Z" }, as: Estimator, captures: { est: $.data.id } }
            - { call: "POST /estimates/${est}/quote", payload: {}, as: Estimator }
            - { call: "POST /estimates/${est}/accept", payload: {}, as: Customer, as_user_id: "${cust}", captures: { job: $.data.id } }
            - { call: "POST /proofs", payload: { job_id: "${job}", file_uri: "s3://u1.pdf" }, as: PrepressOperator, captures: { proof: $.data.id } }
            - { call: "POST /proofs/${proof}/approve", payload: {}, as: Customer, as_user_id: "${cust}" }
            - { call: "POST /presses", payload: { name: "W1", press_type: "WEB", rated_impressions_per_hour: 10000, make_ready_minutes_base: 45, washup_buffer_minutes: 30 }, as: PlantManager, captures: { press: $.data.id, pv: $.data.version } }
            - { call: "POST /press-runs", payload: { press_id: "${press}", job_id: "${job}", run_quantity: 10002, scheduled_start: "2026-08-10T08:00:00Z", expected_press_version: "${pv}" }, as: PressScheduler, captures: { run: $.data.id } }
            - { call: "POST /press-runs/${run}/complete", payload: { gross_impressions: 9400, sheets_used: 10000, waste_sheets: 500 }, as: PressScheduler }
            - { call: "POST /bindery-tickets", payload: { job_id: "${job}", operation: "FOLD", sequence_no: 1 }, as: PlantManager, captures: { bt: $.data.id } }
            - { call: "POST /bindery-tickets/${bt}/complete", payload: { pieces_completed: 9400 }, as: PlantManager }
            - { call: "POST /jobs/${job}/record-delivery", payload: { delivered_quantity: 9400 }, as: PlantManager }
          trigger:
            - { call: "POST /invoices", payload: { job_id: "${job}" }, as: PlantManager, captures: { inv: $.data.id } }
          assert:
            - "Invoice.${inv}.billable_quantity == 9400"
            - "Invoice.${inv}.base_amount_cents == 726726 (round_half_up(773267 x 9400/10002))"
            - "Invoice.${inv}.shortage_credit_cents == 7886 (round_half_up(773267 x 102/10002))"
            - "Invoice.${inv}.total_due_cents == 718840"

  - rule_id: non_linear_state_machine
    instances:
      - name: proof_revision_cycle_with_overage_fee
        grounds:
          - state_machines.Proof.AWAITING_CUSTOMER_to_CHANGES_REQUESTED
          - state_machines.Proof.CHANGES_REQUESTED_to_SUPERSEDED
          - state_machines.Proof.AWAITING_CUSTOMER_to_APPROVED
          - calculations.proof_overage_fee
          - entities.Job.fields.proof_rounds_used
        distinguishing_aspect: |
          Cyclic machine on Proof: AWAITING_CUSTOMER -> CHANGES_REQUESTED ->
          (new upload) SUPERSEDED with a fresh AWAITING_CUSTOMER round; three
          rounds complete the loop twice before approval, and the cycle count
          feeds a cross-entity fee (proof_rounds_used 3 - included 2 = 1 billable
          round) — a linear pipeline cannot express either the loop or the fee.
        test_recipe:
          setup: ["Accepted SHIP job (standard Q=10002 two-signature spec) in PREPRESS"]
          setup_api_calls:
            - { call: "POST /customers", payload: { name: "Cyc Cust", credit_limit_cents: 100000000, default_tolerance_pct: 5 }, as: PlantManager, captures: { cust: $.data.id } }
            - { call: "POST /paper-stocks", payload: { name: "80G", grade: "COATED", cost_per_sheet_cents: 9, reorder_threshold_sheets: 0, reorder_quantity_sheets: 20000 }, as: PurchasingManager, captures: { stock: $.data.id } }
            - { call: "POST /estimates", payload: { customer_id: "${cust}", job_name: "Cyc", quantity_ordered: 10002, press_type: "WEB", binding_method: "SADDLE_STITCH", fulfillment_type: "SHIP", signatures: [ { name: "A", pages: 16, up_count: 2, paper_stock_id: "${stock}", make_ready_cents: 150000, rate_per_thousand_cents: 37250 }, { name: "B", pages: 16, up_count: 2, paper_stock_id: "${stock}", make_ready_cents: 150000, rate_per_thousand_cents: 37250 } ], finishing_options: ["PERF", "SCORE"], press_spoilage_pct: 3, bindery_spoilage_pct: 2, included_proof_rounds: 2, quote_valid_days: 30, due_date: "2026-08-20T00:00:00Z" }, as: Estimator, captures: { est: $.data.id } }
            - { call: "POST /estimates/${est}/quote", payload: {}, as: Estimator }
            - { call: "POST /estimates/${est}/accept", payload: {}, as: Customer, as_user_id: "${cust}", captures: { job: $.data.id } }
