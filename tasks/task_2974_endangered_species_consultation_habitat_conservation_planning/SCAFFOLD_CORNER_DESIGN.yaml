          - calculations.funding_assurance_status
          - errors[ERR_RESERVE_CONTRIBUTION_INSUFFICIENT]
        distinguishing_aspect: >-
          The reserve is the FIRST bucket and is drained to exactly its remaining
          balance, never past it: a 700000-cent CHANGED cost against a 538555-cent
          reserve draws 538555 and leaves required_additional_cents 161445 with
          reserve_remaining_cents at exactly 0. permittee_borne_cents is the WHOLE
          700000 even though only 161445 is still owed — the reserve was the
          permittee's money to begin with. The response then flows into
          endowment_secured_cents, pushing funded_ratio above 1.
        test_recipe:
          setup:
            - "Canonical fixture through permit issuance: changed_circumstance_reserve_cents 538555, reserve_drawn_cents 0, endowment_secured_cents 5026514, plan_status IMPLEMENTING."
