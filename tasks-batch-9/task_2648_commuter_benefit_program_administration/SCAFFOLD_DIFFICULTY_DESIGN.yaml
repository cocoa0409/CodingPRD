              as_user_id: "desk-catalog"
              captures: { med_half_id: $.data.id }
            - call: "POST /benefits/transit-media"
              payload: { sku: "AUS-UNDER", media_type: "PAPER_PASS", region_code: "US-TX-AUS", eligible_category_type: "TRANSIT_PASS", unit_price_cents: 1019, replacement_fee_cents: 500, requires_physical_fulfillment: true }
              as: OrderDesk
              as_user_id: "desk-catalog"
              captures: { med_under_id: $.data.id }
            - call: "POST /benefits/employees"
              payload: { employer_id: "${er_id}", external_ref: "AUS-P1", work_region_code: "US-TX-AUS", payroll_cycle: "MONTHLY", hire_date: "2026-02-01T00:00:00Z" }
