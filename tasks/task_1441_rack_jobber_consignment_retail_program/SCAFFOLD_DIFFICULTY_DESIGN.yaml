            - { call: "POST /products", payload: { program_id: "${prog}", sku: "EGG-001", name: "Eggs Dozen", jobber_cost_cents: 100, min_retail_cents: 150, units_per_facing: 12 }, as: JobberAdmin, captures: { prod: "$.data.id" } }
            - { call: "POST /price-directives", payload: { store_agreement_id: "${agr}", product_id: "${prod}", price_cents: 200, effective_from: "2026-08-01T00:00:00Z", expected_store_agreement_version: "${agr_v}" }, as: JobberAdmin }
            - { call: "POST /scan-events", payload: { store_agreement_id: "${agr}", product_id: "${prod}", event_type: "SALE", quantity: 10, scanned_at: "2026-08-01T10:00:00Z", client_event_id: "s-1" }, as: RetailerManager, as_user_id: "${store}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T00:00:00Z" }, as: JobberAdmin }
            - { call: "POST /audit-counts", payload: { store_agreement_id: "${agr}", scope: "FULL" }, as: JobberAdmin, captures: { aud: "$.data.id" } }
            - { call: "POST /audit-counts/${aud}/start", payload: {}, as: FieldAuditor, as_user_id: "aud-1" }
            - { call: "POST /audit-counts/${aud}/submit", payload: { counted_lines: [ { product_id: "${prod}", counted_units: 0 } ] }, as: FieldAuditor, as_user_id: "aud-1" }
            - { call: "POST /settlement-statements", payload: { store_agreement_id: "${agr}", period_index: 0 }, as: JobberFinance, as_user_id: "fin-1", captures: { stmt: "$.data.id", stmt_v: "$.data.version" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-08T00:00:00Z" }, as: JobberAdmin }
          trigger:
            - { call: "POST /settlement-statements/${stmt}/finalize", payload: { expected_settlement_statement_version: "${stmt_v}" }, as: JobberFinance, as_user_id: "fin-1", captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_AUDIT_NOT_CERTIFIED (http 409)"
            - "SettlementStatement.${stmt}.status remains PROVISIONAL and variant_used stays PROVISIONAL"
            - "AuditCount.${aud}.status remains SUBMITTED (no auto-certify side effect)"

  - rule_id: resource_temporal_overlap
    instances:
      - name: space_allocation_half_open_adjacency
        grounds: [calculations.space_capacity_check, "validations[priority=17]", "errors[ERR_SPACE_WINDOW_OVERLAP]"]
        distinguishing_aspect: |
          Interval semantics = half-open [start, end) on the SpaceAllocation resource:
          a window starting exactly when another ends (2026-09-01 == 2026-09-01) does
          NOT intersect and is accepted, while a one-day-overlap window is rejected —
          adjacency is permitted.
        test_recipe:
          setup:
            - "ACTIVE agreement; store total_facings 100; W1 SNACKS 10 facings [2026-08-01, 2026-09-01) already created"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: JobberAdmin }
            - { call: "POST /programs", payload: { name: "AdjacencyCo" }, as: JobberAdmin, captures: { prog: "$.data.id" } }
            - { call: "POST /stores", payload: { name: "WideStore", store_code: "WIDE", total_facings: 100 }, as: JobberAdmin, captures: { store: "$.data.id" } }
            - { call: "POST /agreements", payload: { program_id: "${prog}", store_id: "${store}", base_margin_pct: 0.25, shrink_retailer_share_pct: 0.5, restock_value_cap_cents: 50000 }, as: JobberAdmin, captures: { agr: "$.data.id" } }
            - { call: "POST /agreements/${agr}/submit", payload: {}, as: JobberAdmin }
            - { call: "POST /agreements/${agr}/accept", payload: {}, as: RetailerManager, as_user_id: "${store}" }
            - { call: "POST /space-allocations", payload: { store_agreement_id: "${agr}", category: "SNACKS", facings: 10, window_start_date: "2026-08-01", window_end_date: "2026-09-01" }, as: JobberAdmin, captures: { w1: "$.data.id" } }
          trigger:
            - { call: "POST /space-allocations", payload: { store_agreement_id: "${agr}", category: "SNACKS", facings: 10, window_start_date: "2026-09-01", window_end_date: "2026-10-01" }, as: JobberAdmin, captures: { w2: "$.data.id" } }
            - { call: "POST /space-allocations", payload: { store_agreement_id: "${agr}", category: "SNACKS", facings: 5, window_start_date: "2026-08-31", window_end_date: "2026-10-01" }, as: JobberAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "w2 created successfully — [2026-09-01, 2026-10-01) touches but does not intersect [2026-08-01, 2026-09-01)"
            - "err == ERR_SPACE_WINDOW_OVERLAP — [2026-08-31, ...) intersects W1 by one day"
            - "SpaceAllocation.${w2}.status == PLANNED (future window); SpaceAllocation.${w1}.status == ACTIVE"

      - name: promotion_gap_buffer_semantics
        grounds: [calculations.promo_gap_check, "validations[priority=18]", "errors[ERR_PROMO_GAP_VIOLATION]"]
        distinguishing_aspect: |
          Interval semantics = CLOSED windows plus a mandatory buffer on the
          (program, product) promo calendar — the opposite geometric treatment from
          space allocations: with promo_min_gap_days 1, a promo starting the day after
          another ends (2026-08-11 after 2026-08-10) is REJECTED, and only a start
          with a full gap day (2026-08-12) is accepted.
        test_recipe:
          setup:
            - "Program (default promo_min_gap_days 1) with product; X1 promo [2026-08-01, 2026-08-10] already created"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: JobberAdmin }
            - { call: "POST /programs", payload: { name: "GapCo" }, as: JobberAdmin, captures: { prog: "$.data.id" } }
            - { call: "POST /stores", payload: { name: "Store Z", store_code: "STZ", total_facings: 50 }, as: JobberAdmin, captures: { store: "$.data.id" } }
            - { call: "POST /products", payload: { program_id: "${prog}", sku: "COF-001", name: "Cold Brew", jobber_cost_cents: 100, min_retail_cents: 150, units_per_facing: 12 }, as: JobberAdmin, captures: { prod: "$.data.id" } }
            - { call: "POST /promotions", payload: { program_id: "${prog}", product_id: "${prod}", name: "Early August", depth_pct: 0.10, jobber_funding_pct: 0.5, start_date: "2026-08-01", end_date: "2026-08-10" }, as: JobberAdmin, captures: { x1: "$.data.id" } }
          trigger:
            - { call: "POST /promotions", payload: { program_id: "${prog}", product_id: "${prod}", name: "Too Soon", depth_pct: 0.15, jobber_funding_pct: 0.5, start_date: "2026-08-11", end_date: "2026-08-15" }, as: JobberAdmin, captures: { err: "$.data.error_id" } }
            - { call: "POST /promotions", payload: { program_id: "${prog}", product_id: "${prod}", name: "Gap OK", depth_pct: 0.15, jobber_funding_pct: 0.5, start_date: "2026-08-12", end_date: "2026-08-15" }, as: JobberAdmin, captures: { x3: "$.data.id" } }
          assert:
            - "err == ERR_PROMO_GAP_VIOLATION — (2026-08-11 - 2026-08-10) = 1 day is NOT > promo_min_gap_days 1"
            - "x3 created — (2026-08-12 - 2026-08-10) = 2 > 1 satisfies the buffer"
            - "Promotion.${x1}.status == DRAFT and Promotion.${x3}.status == DRAFT (gap check runs at create, independent of scheduling)"

  - rule_id: compensating_invariant
    instances:
      - name: restock_then_rma_units_conserved
        grounds: [entities.InventoryBalance.fields.on_hand_units, state_machines.ServiceVisit.COUNTS_SUBMITTED_to_CONFIRMED, state_machines.MarkdownAuthorization.APPROVED_to_APPLIED]
        distinguishing_aspect: |
          Conserved quantity = InventoryBalance.on_hand_units (UNITS): a confirmed
          restock of 40 followed by an applied RETURN_TO_VENDOR of the same 40 units
          restores on_hand to exactly its pre-pair value 0, with the ledger identity
          on_hand == delivered - scanned + customer_returns - shrink - rma holding at
          every step.
        test_recipe:
          setup:
            - "ACTIVE agreement (cap 50000); directive 200; route drv-1; no prior inventory (on_hand 0)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: JobberAdmin }
            - { call: "POST /programs", payload: { name: "UnitConserve" }, as: JobberAdmin, captures: { prog: "$.data.id" } }
            - { call: "POST /stores", payload: { name: "Store U", store_code: "STU", total_facings: 60 }, as: JobberAdmin, captures: { store: "$.data.id" } }
            - { call: "POST /agreements", payload: { program_id: "${prog}", store_id: "${store}", base_margin_pct: 0.25, shrink_retailer_share_pct: 0.5, restock_value_cap_cents: 50000 }, as: JobberAdmin, captures: { agr: "$.data.id" } }
            - { call: "POST /agreements/${agr}/submit", payload: {}, as: JobberAdmin }
            - { call: "POST /agreements/${agr}/accept", payload: {}, as: RetailerManager, as_user_id: "${store}", captures: { agr_v: "$.data.version" } }
            - { call: "POST /products", payload: { program_id: "${prog}", sku: "DOG-001", name: "Dog Treats", jobber_cost_cents: 100, min_retail_cents: 150, units_per_facing: 12 }, as: JobberAdmin, captures: { prod: "$.data.id" } }
            - { call: "POST /price-directives", payload: { store_agreement_id: "${agr}", product_id: "${prod}", price_cents: 200, effective_from: "2026-08-01T00:00:00Z", expected_store_agreement_version: "${agr_v}" }, as: JobberAdmin }
            - { call: "POST /routes", payload: { program_id: "${prog}", name: "Route U", assigned_driver_id: "drv-1" }, as: JobberAdmin, captures: { route: "$.data.id" } }
            - { call: "POST /service-visits", payload: { route_id: "${route}", store_agreement_id: "${agr}", scheduled_date: "2026-08-01" }, as: JobberAdmin, captures: { visit: "$.data.id" } }
            - { call: "POST /service-visits/${visit}/check-in", payload: {}, as: RouteDriver, as_user_id: "drv-1" }
            - { call: "POST /service-visits/${visit}/submit-counts", payload: { lines: [ { product_id: "${prod}", counted_units: 0, restock_units: 40 } ] }, as: RouteDriver, as_user_id: "drv-1" }
            - { call: "POST /service-visits/${visit}/confirm", payload: {}, as: RetailerManager, as_user_id: "${store}" }
            - { call: "POST /markdown-authorizations", payload: { store_agreement_id: "${agr}", product_id: "${prod}", auth_type: "RETURN_TO_VENDOR", units: 40 }, as: JobberAdmin, captures: { md: "$.data.id" } }
            - { call: "POST /markdown-authorizations/${md}/approve", payload: {}, as: RetailerManager, as_user_id: "${store}" }
          trigger:
            - { call: "POST /markdown-authorizations/${md}/apply", payload: {}, as: JobberAdmin }
            - { call: "GET /inventory-balances", payload: { store_agreement_id: "${agr}", product_id: "${prod}" }, as: JobberAdmin }
          assert:
            - "after confirm (forward action): on_hand_units == 40, lifetime_delivered_units == 40"
            - "after RMA apply (compensating action): on_hand_units == 0 — exactly the pre-pair value"
            - "lifetime_rma_units == 40, lifetime_scanned_units == 0, lifetime_shrink_units == 0, lifetime_customer_return_units == 0"
            - "identity holds: 0 == 40 (delivered) - 0 (scanned) + 0 (returns) - 0 (shrink) - 40 (rma)"
            - "MarkdownAuthorization.${md}.credit_cents == 0 (RMA moves units, not money)"

      - name: sale_then_void_cents_conserved
        grounds: [entities.ScanEvent.fields.line_value_cents, entities.SettlementStatement.fields.gross_scanned_sales_cents, state_machines.ScanEvent]
        distinguishing_aspect: |
          Conserved quantity = period gross_scanned_sales_cents (MONEY — a different
          quantity than units): a MATCHED SALE of 5 units (+1000 cents) followed by
          its compensating VOID (-1000 cents) leaves the generated statement's gross
          at exactly 0 and the balance's lifetime_scanned_units at 0.
        test_recipe:
          setup:
            - "ACTIVE agreement (est shrink 0); directive 200; no restock (scan may drive on_hand negative transiently)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: JobberAdmin }
            - { call: "POST /programs", payload: { name: "VoidCo" }, as: JobberAdmin, captures: { prog: "$.data.id" } }
            - { call: "POST /stores", payload: { name: "Store V2", store_code: "SV2", total_facings: 50 }, as: JobberAdmin, captures: { store: "$.data.id" } }
            - { call: "POST /agreements", payload: { program_id: "${prog}", store_id: "${store}", base_margin_pct: 0.25, shrink_retailer_share_pct: 0.5, restock_value_cap_cents: 50000, estimated_shrink_rate: 0.0 }, as: JobberAdmin, captures: { agr: "$.data.id" } }
            - { call: "POST /agreements/${agr}/submit", payload: {}, as: JobberAdmin }
            - { call: "POST /agreements/${agr}/accept", payload: {}, as: RetailerManager, as_user_id: "${store}", captures: { agr_v: "$.data.version" } }
            - { call: "POST /products", payload: { program_id: "${prog}", sku: "BUN-001", name: "Hot Dog Buns", jobber_cost_cents: 100, min_retail_cents: 150, units_per_facing: 12 }, as: JobberAdmin, captures: { prod: "$.data.id" } }
            - { call: "POST /price-directives", payload: { store_agreement_id: "${agr}", product_id: "${prod}", price_cents: 200, effective_from: "2026-08-01T00:00:00Z", expected_store_agreement_version: "${agr_v}" }, as: JobberAdmin }
          trigger:
            - { call: "POST /scan-events", payload: { store_agreement_id: "${agr}", product_id: "${prod}", event_type: "SALE", quantity: 5, scanned_at: "2026-08-01T10:00:00Z", client_event_id: "sale-1" }, as: RetailerManager, as_user_id: "${store}", captures: { sale: "$.data.id" } }
            - { call: "POST /scan-events", payload: { store_agreement_id: "${agr}", product_id: "${prod}", event_type: "VOID", quantity: 5, scanned_at: "2026-08-01T10:05:00Z", client_event_id: "void-1", void_of_event_id: "${sale}" }, as: RetailerManager, as_user_id: "${store}", captures: { void_line: "$.data.line_value_cents" } }
            - { call: "POST /settlement-statements", payload: { store_agreement_id: "${agr}", period_index: 0 }, as: JobberFinance, as_user_id: "fin-1", captures: { stmt: "$.data.id" } }
            - { call: "GET /inventory-balances", payload: { store_agreement_id: "${agr}", product_id: "${prod}" }, as: JobberAdmin }
          assert:
            - "SALE line_value_cents == 1000; VOID line_value_cents == -1000 (exact negation of target)"
            - "SettlementStatement.${stmt}: gross_scanned_sales_cents == 0, scanned_units == 0, retailer_margin_cents == 0, net_payable_to_jobber_cents == 0"
            - "InventoryBalance[0]: on_hand_units == 0 (SALE -5 then VOID +5), lifetime_scanned_units == 0"
            - "conserved quantity: gross cents identical to a world where neither event occurred"
