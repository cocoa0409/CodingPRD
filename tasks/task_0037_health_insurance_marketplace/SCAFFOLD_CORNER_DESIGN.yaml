scaffold_corner_design:

  # ───────────────────────── Entities ─────────────────────────
  - section: entities
    instances:
      - name: create_household_returns_201_with_system_fields
        claim_type: Creation
        grounds: ["entities.Household.fields.applicant_user_id", "endpoints"]
        distinguishing_aspect: "POST /households with coverage_year+rating_area returns 201; data has server-minted id, version==1, household_magi_cents==0, applicant_user_id set from X-User-ID."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /households"
              payload: { coverage_year: 2026, rating_area: "RA01" }
              as: Applicant
              as_user_id: "c-1"
              captures: { hh_id: $.data.id, v: $.data.version }
          assert:
            - "response status == 201"
            - "Household.${hh_id}.version == 1"
            - "Household.${hh_id}.household_magi_cents == 0"
            - "Household.${hh_id}.countable_size == 0"
            - "Household.${hh_id}.applicant_user_id == 'c-1'"

      - name: get_household_not_found_returns_404
        claim_type: Not Found
        grounds: ["endpoints", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /households/{id} with a non-existent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /households/00000000-0000-4000-8000-000000000000"
              as: MarketplaceAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response status == 404"
            - "response.data.error_id == 'ERR_NOT_FOUND'"

      - name: create_household_missing_required_field_returns_422
        claim_type: Required Fields
        grounds: ["endpoints", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /households missing rating_area (required, no default) returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /households"
              payload: { coverage_year: 2026 }
              as: Applicant
              as_user_id: "c-3"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 422"
            - "response.data.error_id == 'ERR_INVALID_REQUEST'"

      - name: member_default_applies_for_coverage_true
        claim_type: Defaults
        grounds: ["entities.HouseholdMember.fields.applies_for_coverage", "entities.HouseholdMember.fields.annual_income_cents"]
        distinguishing_aspect: "POST member omitting applies_for_coverage applies default true and omitting annual_income_cents applies default 0; the member counts toward countable_size."
        test_recipe:
          setup: ["Household exists."]
          setup_api_calls:
            - call: "POST /households"
              payload: { coverage_year: 2026, rating_area: "RA01" }
              as: Applicant
              as_user_id: "c-4"
              captures: { hh_id: $.data.id }
          trigger:
            - call: "POST /households/${hh_id}/members"
              payload: { full_name: "Def Ault", relationship: "PRIMARY", tax_filing_status: "FILER" }
              as: Applicant
              as_user_id: "c-4"
              captures: { mem_id: $.data.id }
          assert:
            - "HouseholdMember.${mem_id}.applies_for_coverage == true"
            - "HouseholdMember.${mem_id}.annual_income_cents == 0"
            - "Household.${hh_id}.countable_size == 1"

      - name: health_plan_immutable_no_version_field
        claim_type: Immutability
        grounds: ["entities.HealthPlan", "entities.HealthPlan.fields.csr_eligible"]
        distinguishing_aspect: "HealthPlan is common_fields:false (event/config): created with only id+created_at, no version field; csr_eligible computed true for SILVER."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /health-plans"
              payload: { rating_area: "RA01", coverage_year: 2026, metal_tier: "SILVER", gross_premium_cents: 50000, is_slcsp_benchmark: true }
              as: MarketplaceAdmin
              captures: { plan_id: $.data.id }
          assert:
            - "response status == 201"
            - "HealthPlan.${plan_id}.csr_eligible == true"

      - name: health_plan_csr_eligible_false_for_bronze
        claim_type: Computed Fields
        grounds: ["entities.HealthPlan.fields.csr_eligible", "entities.HealthPlan.fields.metal_tier"]
        distinguishing_aspect: "csr_eligible is computed false for a BRONZE plan (CSR attaches only to SILVER); input value is ignored."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /health-plans"
              payload: { rating_area: "RA01", coverage_year: 2026, metal_tier: "BRONZE", gross_premium_cents: 30000 }
              as: MarketplaceAdmin
              captures: { plan_id: $.data.id }
          assert:
            - "HealthPlan.${plan_id}.csr_eligible == false"

      - name: member_invalid_relationship_enum_returns_422
        claim_type: Type Constraints
        grounds: ["entities.HouseholdMember.fields.relationship", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST member with relationship not in {PRIMARY,SPOUSE,DEPENDENT} returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["Household exists."]
          setup_api_calls:
            - call: "POST /households"
              payload: { coverage_year: 2026, rating_area: "RA01" }
              as: Applicant
              as_user_id: "c-7"
              captures: { hh_id: $.data.id }
          trigger:
            - call: "POST /households/${hh_id}/members"
              payload: { full_name: "Bad Enum", relationship: "COUSIN", tax_filing_status: "FILER", annual_income_cents: 100 }
              as: Applicant
              as_user_id: "c-7"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 422"
            - "response.data.error_id == 'ERR_INVALID_REQUEST'"

      - name: application_requires_existing_household_parent
        claim_type: Parent Relationships
        grounds: ["entities.Application.fields.household_id", "errors[ERR_REFERENCED_NOT_FOUND]"]
        distinguishing_aspect: "POST /applications with a household_id that does not exist returns ERR_REFERENCED_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /applications"
              payload: { household_id: "00000000-0000-4000-8000-000000000abc", enrollment_window: "OEP" }
              as: Applicant
              as_user_id: "c-8"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 404"
            - "response.data.error_id == 'ERR_REFERENCED_NOT_FOUND'"

  # ───────────────────────── State Machines ─────────────────────────
  - section: state_machines
    instances:
      - name: application_initial_state_is_draft
        claim_type: Initial State
        grounds: ["state_machines.Application", "entities.Application.fields.status"]
        distinguishing_aspect: "A freshly POSTed application has status DRAFT and submitted_at null."
        test_recipe:
          setup: ["Household exists."]
          setup_api_calls:
            - call: "POST /households"
              payload: { coverage_year: 2026, rating_area: "RA01" }
              as: Applicant
              as_user_id: "c-9"
              captures: { hh_id: $.data.id }
          trigger:
            - call: "POST /applications"
              payload: { household_id: "${hh_id}", enrollment_window: "OEP" }
              as: Applicant
              as_user_id: "c-9"
              captures: { app_id: $.data.id }
          assert:
            - "Application.${app_id}.status == 'DRAFT'"
            - "Application.${app_id}.submitted_at == null"

      - name: determine_from_draft_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: ["state_machines.Application.SUBMITTED_to_DETERMINED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "POST /applications/{id}/determine on a DRAFT (not SUBMITTED) application returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["DRAFT application exists."]
          setup_api_calls:
            - call: "POST /households"
              payload: { coverage_year: 2026, rating_area: "RA01" }
              as: Applicant
              as_user_id: "c-10"
              captures: { hh_id: $.data.id }
            - call: "POST /households/${hh_id}/members"
              payload: { full_name: "Draft P", relationship: "PRIMARY", tax_filing_status: "FILER", annual_income_cents: 3000000 }
              as: Applicant
              as_user_id: "c-10"
            - call: "POST /applications"
              payload: { household_id: "${hh_id}", enrollment_window: "OEP" }
              as: Applicant
              as_user_id: "c-10"
              captures: { app_id: $.data.id }
          trigger:
            - call: "POST /applications/${app_id}/determine"
              as: MarketplaceAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "response.data.error_id == 'ERR_INVALID_STATE'"

      - name: cancel_from_cancelled_terminal_lockdown
        claim_type: Terminal State Lockdown
        grounds: ["state_machines.Application.DRAFT_to_CANCELLED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "After cancel (terminal CANCELLED), a second cancel returns ERR_INVALID_STATE (409); no transitions leave CANCELLED."
        test_recipe:
          setup: ["A CANCELLED application exists."]
          setup_api_calls:
            - call: "POST /households"
              payload: { coverage_year: 2026, rating_area: "RA01" }
              as: Applicant
              as_user_id: "c-11"
              captures: { hh_id: $.data.id }
            - call: "POST /applications"
              payload: { household_id: "${hh_id}", enrollment_window: "OEP" }
              as: Applicant
              as_user_id: "c-11"
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/cancel"
              as: Applicant
              as_user_id: "c-11"
          trigger:
            - call: "POST /applications/${app_id}/cancel"
              as: Applicant
              as_user_id: "c-11"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "response.data.error_id == 'ERR_INVALID_STATE'"

      - name: sep_deny_branch_sets_denied
        claim_type: Valid Transition
        grounds: ["state_machines.SepRequest.PENDING_to_DENIED", "entities.SepRequest.fields.status"]
        distinguishing_aspect: "POST /sep-requests/{id}/deny on a PENDING SEP sets status DENIED (branch B of the fork)."
        test_recipe:
          setup: ["A PENDING SepRequest exists."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-18T00:00:00Z" }
              as: MarketplaceAdmin
            - call: "POST /households"
              payload: { coverage_year: 2026, rating_area: "RA01" }
              as: Applicant
              as_user_id: "c-12"
              captures: { hh_id: $.data.id }
            - call: "POST /applications"
              payload: { household_id: "${hh_id}", enrollment_window: "SEP" }
              as: Applicant
              as_user_id: "c-12"
              captures: { app_id: $.data.id }
            - call: "POST /sep-requests"
              payload: { application_id: "${app_id}", qualifying_event_type: "BIRTH", event_date: "2026-06-16" }
              as: Applicant
              as_user_id: "c-12"
              captures: { sep_id: $.data.id }
          trigger:
            - call: "POST /sep-requests/${sep_id}/deny"
              as: MarketplaceAdmin
          assert:
            - "SepRequest.${sep_id}.status == 'DENIED'"

      - name: sep_approve_requires_application_draft
        claim_type: guarded transitions
        grounds: ["state_machines.SepRequest.PENDING_to_APPROVED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "SEP approval requires the linked Application.status == DRAFT; approving a SEP whose application is already CANCELLED returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["PENDING SepRequest whose linked Application has been CANCELLED."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-18T00:00:00Z" }
              as: MarketplaceAdmin
            - call: "POST /households"
              payload: { coverage_year: 2026, rating_area: "RA01" }
              as: Applicant
              as_user_id: "c-13"
              captures: { hh_id: $.data.id }
            - call: "POST /applications"
              payload: { household_id: "${hh_id}", enrollment_window: "SEP" }
              as: Applicant
              as_user_id: "c-13"
              captures: { app_id: $.data.id }
            - call: "POST /sep-requests"
              payload: { application_id: "${app_id}", qualifying_event_type: "BIRTH", event_date: "2026-06-16" }
              as: Applicant
              as_user_id: "c-13"
              captures: { sep_id: $.data.id }
            - call: "POST /applications/${app_id}/cancel"
              as: Applicant
              as_user_id: "c-13"
          trigger:
            - call: "POST /sep-requests/${sep_id}/approve"
              as: MarketplaceAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "response.data.error_id == 'ERR_INVALID_STATE'"

      - name: terminate_enrollment_from_active
        claim_type: Valid Transition
        grounds: ["state_machines.Enrollment.ACTIVE_to_TERMINATED", "entities.Enrollment.fields.lifecycle_status"]
        distinguishing_aspect: "An ACTIVE enrollment (paid + effectuated) terminates to lifecycle_status TERMINATED."
        test_recipe:
          setup: ["An ACTIVE enrollment exists (binder paid, effectuated)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-10T00:00:00Z" }
              as: MarketplaceAdmin
            - call: "POST /health-plans"
              payload: { rating_area: "RA01", coverage_year: 2026, metal_tier: "SILVER", gross_premium_cents: 50000, is_slcsp_benchmark: true }
              as: MarketplaceAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /households"
              payload: { coverage_year: 2026, rating_area: "RA01" }
              as: Applicant
              as_user_id: "c-14"
              captures: { hh_id: $.data.id }
            - call: "POST /households/${hh_id}/members"
              payload: { full_name: "Active P", relationship: "PRIMARY", tax_filing_status: "FILER", annual_income_cents: 3000000 }
              as: Applicant
              as_user_id: "c-14"
            - call: "POST /applications"
              payload: { household_id: "${hh_id}", enrollment_window: "OEP" }
              as: Applicant
              as_user_id: "c-14"
              captures: { app_id: $.data.id }
            - call: "GET /households/${hh_id}"
              as: Applicant
              as_user_id: "c-14"
              captures: { hh_v: $.data.version }
            - call: "POST /applications/${app_id}/submit"
              payload: { expected_household_version: "${hh_v}" }
              as: Applicant
              as_user_id: "c-14"
            - call: "POST /applications/${app_id}/determine"
              as: MarketplaceAdmin
            - call: "GET /households/${hh_id}"
              as: Applicant
              as_user_id: "c-14"
              captures: { hh_v2: $.data.version }
            - call: "POST /enrollments"
              payload: { application_id: "${app_id}", plan_id: "${plan_id}", elected_aptc_monthly_cents: 45000, expected_household_version: "${hh_v2}" }
              as: Applicant
              as_user_id: "c-14"
              captures: { enr_id: $.data.id }
            - call: "POST /enrollments/${enr_id}/pay-binder"
              as: Applicant
              as_user_id: "c-14"
            - call: "POST /enrollments/${enr_id}/effectuate"
              as: MarketplaceAdmin
          trigger:
            - call: "POST /enrollments/${enr_id}/terminate"
              as: Applicant
              as_user_id: "c-14"
          assert:
            - "Enrollment.${enr_id}.lifecycle_status == 'TERMINATED'"

      - name: effectuate_succeeds_after_binder_paid
        claim_type: Side Effect Execution
        grounds: ["state_machines.Enrollment.PENDING_EFFECTUATION_to_ACTIVE", "entities.Enrollment.fields.lifecycle_status"]
        distinguishing_aspect: "After pay-binder (payment PAID), effectuate moves lifecycle_status PENDING_EFFECTUATION -> ACTIVE while payment_status stays PAID."
        test_recipe:
          setup: ["A PAID, PENDING_EFFECTUATION enrollment exists."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-10T00:00:00Z" }
              as: MarketplaceAdmin
            - call: "POST /health-plans"
              payload: { rating_area: "RA01", coverage_year: 2026, metal_tier: "SILVER", gross_premium_cents: 50000, is_slcsp_benchmark: true }
              as: MarketplaceAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /households"
              payload: { coverage_year: 2026, rating_area: "RA01" }
              as: Applicant
              as_user_id: "c-15"
              captures: { hh_id: $.data.id }
            - call: "POST /households/${hh_id}/members"
              payload: { full_name: "Paid P", relationship: "PRIMARY", tax_filing_status: "FILER", annual_income_cents: 3000000 }
              as: Applicant
              as_user_id: "c-15"
            - call: "POST /applications"
              payload: { household_id: "${hh_id}", enrollment_window: "OEP" }
              as: Applicant
              as_user_id: "c-15"
              captures: { app_id: $.data.id }
            - call: "GET /households/${hh_id}"
              as: Applicant
              as_user_id: "c-15"
              captures: { hh_v: $.data.version }
            - call: "POST /applications/${app_id}/submit"
              payload: { expected_household_version: "${hh_v}" }
              as: Applicant
              as_user_id: "c-15"
            - call: "POST /applications/${app_id}/determine"
              as: MarketplaceAdmin
            - call: "GET /households/${hh_id}"
              as: Applicant
              as_user_id: "c-15"
              captures: { hh_v2: $.data.version }
            - call: "POST /enrollments"
              payload: { application_id: "${app_id}", plan_id: "${plan_id}", elected_aptc_monthly_cents: 45000, expected_household_version: "${hh_v2}" }
              as: Applicant
              as_user_id: "c-15"
              captures: { enr_id: $.data.id }
            - call: "POST /enrollments/${enr_id}/pay-binder"
              as: Applicant
              as_user_id: "c-15"
          trigger:
            - call: "POST /enrollments/${enr_id}/effectuate"
              as: MarketplaceAdmin
          assert:
            - "Enrollment.${enr_id}.lifecycle_status == 'ACTIVE'"
            - "Enrollment.${enr_id}.payment_status == 'PAID'"

  # ───────────────────────── Calculations ─────────────────────────
  - section: calculations
    instances:
      - name: csr_plus_tier_at_150_pct_boundary
        claim_type: Correct Result
        grounds: ["calculations.csr_tier", "calculations.fpl_percent", "entities.EligibilityDetermination.fields.csr_tier"]
        distinguishing_aspect: "Household at exactly fpl_percent 150.00 (PRIMARY income 2250000, size 1) determines csr_tier CSR94 ('CSR Plus'), the inclusive top of the band; applicable_pct 0.000000 and max_aptc equals the full benchmark 50000."
        test_recipe:
          setup: ["Household size 1, income 2250000 -> fpl_percent 150.00; benchmark SILVER 50000."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-10T00:00:00Z" }
              as: MarketplaceAdmin
            - call: "POST /health-plans"
              payload: { rating_area: "RA01", coverage_year: 2026, metal_tier: "SILVER", gross_premium_cents: 50000, is_slcsp_benchmark: true }
              as: MarketplaceAdmin
            - call: "POST /households"
              payload: { coverage_year: 2026, rating_area: "RA01" }
              as: Applicant
              as_user_id: "c-16"
              captures: { hh_id: $.data.id }
            - call: "POST /households/${hh_id}/members"
              payload: { full_name: "Csr Plus", relationship: "PRIMARY", tax_filing_status: "FILER", annual_income_cents: 2250000 }
              as: Applicant
              as_user_id: "c-16"
            - call: "POST /applications"
              payload: { household_id: "${hh_id}", enrollment_window: "OEP" }
              as: Applicant
              as_user_id: "c-16"
              captures: { app_id: $.data.id }
            - call: "GET /households/${hh_id}"
              as: Applicant
              as_user_id: "c-16"
              captures: { hh_v: $.data.version }
            - call: "POST /applications/${app_id}/submit"
              payload: { expected_household_version: "${hh_v}" }
              as: Applicant
              as_user_id: "c-16"
          trigger:
            - call: "POST /applications/${app_id}/determine"
              as: MarketplaceAdmin
              captures: { det_id: $.data.id }
          assert:
            - "EligibilityDetermination.${det_id}.fpl_percent_snapshot == 150.00"
            - "EligibilityDetermination.${det_id}.csr_tier == 'CSR94'"
            - "EligibilityDetermination.${det_id}.applicable_pct == 0.000000"
            - "EligibilityDetermination.${det_id}.max_aptc_monthly_cents == 50000"

      - name: applied_aptc_clamped_by_plan_gross_premium
        claim_type: Constants Applied
        grounds: ["calculations.applied_aptc", "entities.Enrollment.fields.applied_aptc_monthly_cents", "entities.Enrollment.fields.net_premium_monthly_cents"]
        distinguishing_aspect: "When elected APTC and max both exceed the plan's gross premium, applied_aptc is clamped to the plan gross (BRONZE plan 30000 < max 45000) giving applied 30000 and net 0."
        test_recipe:
          setup: ["Determined household max_aptc 45000 (income 3000000), enrolling in a BRONZE plan gross 30000 electing 45000."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-10T00:00:00Z" }
              as: MarketplaceAdmin
            - call: "POST /health-plans"
              payload: { rating_area: "RA01", coverage_year: 2026, metal_tier: "SILVER", gross_premium_cents: 50000, is_slcsp_benchmark: true }
              as: MarketplaceAdmin
            - call: "POST /health-plans"
              payload: { rating_area: "RA01", coverage_year: 2026, metal_tier: "BRONZE", gross_premium_cents: 30000 }
              as: MarketplaceAdmin
              captures: { bronze_id: $.data.id }
            - call: "POST /households"
              payload: { coverage_year: 2026, rating_area: "RA01" }
              as: Applicant
              as_user_id: "c-17"
              captures: { hh_id: $.data.id }
            - call: "POST /households/${hh_id}/members"
              payload: { full_name: "Clamp P", relationship: "PRIMARY", tax_filing_status: "FILER", annual_income_cents: 3000000 }
              as: Applicant
              as_user_id: "c-17"
            - call: "POST /applications"
              payload: { household_id: "${hh_id}", enrollment_window: "OEP" }
              as: Applicant
              as_user_id: "c-17"
              captures: { app_id: $.data.id }
            - call: "GET /households/${hh_id}"
              as: Applicant
              as_user_id: "c-17"
              captures: { hh_v: $.data.version }
            - call: "POST /applications/${app_id}/submit"
              payload: { expected_household_version: "${hh_v}" }
              as: Applicant
              as_user_id: "c-17"
            - call: "POST /applications/${app_id}/determine"
              as: MarketplaceAdmin
            - call: "GET /households/${hh_id}"
              as: Applicant
              as_user_id: "c-17"
              captures: { hh_v2: $.data.version }
          trigger:
            - call: "POST /enrollments"
              payload: { application_id: "${app_id}", plan_id: "${bronze_id}", elected_aptc_monthly_cents: 45000, expected_household_version: "${hh_v2}" }
              as: Applicant
              as_user_id: "c-17"
              captures: { enr_id: $.data.id }
          assert:
