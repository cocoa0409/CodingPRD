              payload: { name: "Metro Internal Medicine", nrmp_program_code: "1140140M0", specialty_code: "IM", quota_positions: 2, visa_sponsorship_allowed: true, soap_participating: true, min_step2_score: 220, img_accepted: true }
              as: NrmpAdmin
              captures: { prog_id: "$.data.id" }
          trigger:
            - call: "POST /faculty-members"
              payload: { program_id: "${prog_id}", full_name: "Alan Reyes", is_program_director: false, is_committee_member: true, conflict_applicant_ids: [] }
              as: ProgramCoordinator
              captures: { f1_id: "$.data.id" }
            - call: "GET /faculty-members/${f1_id}"
              payload: {}
              as: ProgramCoordinator
            - call: "GET /faculty-members"
              payload: { is_committee_member: true }
              as: ProgramCoordinator
          assert:
            - "the create returns HTTP 201 and the read-back returns HTTP 200 with the same id"
            - "the read-back reports full_name 'Alan Reyes', is_committee_member true and is_program_director false"
            - "the read-back reports conflict_applicant_ids == [] and scheduled_load == 0.00 and realized_load == 0.00"
            - "the filtered list reports total_count == 1 and its single row is ${f1_id}"

      - name: adjacent_panel_seats_are_allowed_while_overlapping_seats_are_not
        claim_type: conditional_action
        grounds:
          - endpoints.POST /interview-assignments
          - errors.ERR_INTERVIEWER_DOUBLE_BOOKED
        excluded_because:
          difficulty_instance: interviewer_half_open_adjacency_allowed_but_one_hour_overlap_rejected
          rationale: >
            The half-open [start_at, end_at) adjacency boundary on panel seats - gap zero admitted, one hour
            of overlap refused - is the §1.8 resource-overlap instance.


  # ===========================================================================
  # Errors - Table 6 rows across the 28 error ids of §1.4, one instance per
  # priority band that §1.8 does not already own: auth (1, 2), ownership (8),
  # safety (7), temporal (9), uniqueness (10) and the four fiscal ceilings (11).
  # The four ids whose only interesting corner is a priority race or an
  # interval boundary are stubbed against their §1.8 owners.
  # ===========================================================================
  - section: errors
    instances:
      - name: a_program_create_with_no_identity_headers_returns_unauthenticated
        claim_type: error_response_shape
        grounds:
          - errors.ERR_UNAUTHENTICATED
          - validations.priority 1
          - response_envelope.error
        distinguishing_aspect: >
          Priority 1 runs before everything: the body here is a perfectly valid program create, so the only
          defect is the absent X-User-ID / X-User-Role pair. The response is 401 with the standard error
          envelope - an error_id and a human-readable message - and no Program row is written.
        test_recipe:
          setup:
            - "empty database"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: NrmpAdmin
          trigger:
            - call: "POST /programs"
              payload: { name: "Metro Internal Medicine", nrmp_program_code: "1140140M0", specialty_code: "IM", quota_positions: 2, visa_sponsorship_allowed: true, soap_participating: true, min_step2_score: 220, img_accepted: true }
              as: null
          assert:
            - "the trigger returns HTTP 401 with data.error_id == 'ERR_UNAUTHENTICATED'"
            - "data.message is a non-empty string"
            - "GET /programs as NrmpAdmin reports total_count == 0"

      - name: a_coordinator_cannot_create_a_program
        claim_type: error_status_code
        grounds:
          - errors.ERR_FORBIDDEN_ROLE
          - validations.priority 2
          - endpoints.POST /programs
        distinguishing_aspect: >
          POST /programs lists NrmpAdmin alone. ProgramCoordinator is a declared role of the system, so the
          header value is recognised - it is simply not on this endpoint's list, which is 403
          ERR_FORBIDDEN_ROLE at priority 2, decided before the body is examined at all.
        test_recipe:
          setup:
            - "empty database"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: NrmpAdmin
          trigger:
            - call: "POST /programs"
              payload: { name: "Metro Internal Medicine", nrmp_program_code: "1140140M0", specialty_code: "IM", quota_positions: 2, visa_sponsorship_allowed: true, soap_participating: true, min_step2_score: 220, img_accepted: true }
              as: ProgramCoordinator
          assert:
            - "the trigger returns HTTP 403 with data.error_id == 'ERR_FORBIDDEN_ROLE'"
            - "GET /programs as NrmpAdmin reports total_count == 0"

