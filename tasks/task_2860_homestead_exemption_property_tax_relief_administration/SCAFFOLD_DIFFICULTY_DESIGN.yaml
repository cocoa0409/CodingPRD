      - name: application_information_request_cycle_bounded_at_two_rounds
        grounds:
          - state_machines.ExemptionApplication.UNDER_REVIEW_to_INFO_REQUESTED
          - state_machines.ExemptionApplication.INFO_REQUESTED_to_UNDER_REVIEW
          - entities.ExemptionApplication.fields.info_request_round
          - validations[priority=25]
          - errors[ERR_INFO_REQUEST_LIMIT_REACHED]
        distinguishing_aspect: |
          The non-linearity here is a CYCLE on ExemptionApplication: UNDER_REVIEW -> INFO_REQUESTED
          -> UNDER_REVIEW traversed twice, with info_request_round advancing 0 -> 1 -> 2 and the
          third REQUEST_INFO rejected by ERR_INFO_REQUEST_LIMIT_REACHED while the row stays
          UNDER_REVIEW — a bounded loop, not a forward-only pipeline.
        test_recipe:
          setup:
            - "ReliefProgram HOMESTEAD_BASIC exists and Parcel P1 has version 1 with no grants, so Parcel.version is never bumped by any call in this chain."
            - "Application A1 for TaxpayerAccount T on P1 is UNDER_REVIEW after its first VerificationCheck row, with info_request_round 0 and intake_user_id clerk-01."
