  # ---------------------------------------------------------------------------
  - section: calculations
    instances:
      - name: waste_event_depletes_lot_and_charges_cost
        claim_type: Correct Result
        grounds: [calculations.waste_cost, entities.WasteEvent.fields.cost_cents, entities.InventoryLot.fields.qty_on_hand]
        distinguishing_aspect: "A WasteEvent of 3 units against a lot @ 200 -> cost_cents 600 and lot.qty_on_hand drops from 10 to 7."
        test_recipe:
          setup: ["A KIT lot qty 10 @ 200."]
          setup_api_calls:
            - call: "POST /api/client-sites"
              payload: { name: "HQ", client_name: "Acme", employer_subsidy_pct: 0.5, daily_subsidy_cap_cents: 1000, food_cost_target_pct: 0.32 }
              as: SiteAdmin
              captures: { site_id: "$.data.id" }
            - call: "POST /api/vendors"
              payload: { name: "FreshCo", category: "PRODUCE" }
              as: SiteAdmin
              captures: { vendor_id: "$.data.id" }
            - call: "POST /api/purchase-orders"
              payload: { vendor_id: "${vendor_id}", client_site_id: "${site_id}", lines: [ { ingredient: "LETTUCE", qty: 10, unit_cost_cents: 200 } ] }
              as: CafeteriaManager
              captures: { po_id: "$.data.id" }
            - call: "POST /api/purchase-orders/${po_id}/issue"
              payload: {}
              as: CafeteriaManager
            - call: "POST /api/purchase-orders/${po_id}/receive"
              payload: {}
              as: CafeteriaManager
            - call: "GET /api/inventory-lots?purchase_order_id=${po_id}"
              payload: {}
              as: CafeteriaManager
              captures: { lot_id: "$.data[0].id" }
          trigger:
            - call: "POST /api/waste-events"
              payload: { client_site_id: "${site_id}", inventory_lot_id: "${lot_id}", qty: 3, reason: "SPOILAGE" }
              as: CafeteriaManager
              captures: { waste_id: "$.data.id", cc: "$.data.cost_cents" }
          assert:
            - "WasteEvent.${waste_id}.cost_cents == 600"
            - "InventoryLot.${lot_id}.qty_on_hand == 7"

      - name: satisfaction_avg_rounds_two_places
        claim_type: Correct Result
        grounds: [calculations.satisfaction_avg, entities.ClientSite.fields.satisfaction_avg]
        distinguishing_aspect: "Two surveys rating 5 and 4 -> ClientSite.satisfaction_avg == 4.5 (mean rounded half-up to 2dp)."
        test_recipe:
          setup: ["A site with a CLOSED-free survey target session; two surveys 5 and 4."]
          setup_api_calls:
            - call: "POST /api/client-sites"
              payload: { name: "HQ", client_name: "Acme", employer_subsidy_pct: 0.5, daily_subsidy_cap_cents: 1000, food_cost_target_pct: 0.32 }
              as: SiteAdmin
              captures: { site_id: "$.data.id" }
            - call: "POST /api/satisfaction-surveys"
              payload: { client_site_id: "${site_id}", rating: 5 }
              as: Diner
              as_user_id: "diner-1"
            - call: "POST /api/satisfaction-surveys"
              payload: { client_site_id: "${site_id}", rating: 4 }
              as: Diner
              as_user_id: "diner-2"
          trigger:
            - call: "GET /api/client-sites/${site_id}"
              payload: {}
              as: FinanceController
              captures: { sa: "$.data.satisfaction_avg" }
          assert:
            - "ClientSite.${site_id}.satisfaction_avg == 4.5"

