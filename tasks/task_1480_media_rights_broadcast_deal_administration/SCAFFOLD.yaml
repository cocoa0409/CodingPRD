  side_effects:
  - status → CREDITED
  - make_good_credit_cents zeroed
- method: POST
  path: /deals/{dealId}/broadcast-events
  description: Schedule a broadcast event
  roles:
  - ProductionAuditor
  code: 201
  input:
  - obligation_id
  - event_code
  - scheduled_kickoff_utc
  output: BroadcastEvent
  side_effects:
  - status = SCHEDULED
- method: GET
  path: /deals/{dealId}/broadcast-events
  description: List broadcast events
  roles:
  - RightsManager
  - BidCoordinator
  - FinanceController
  - ProductionAuditor
  - ComplianceOfficer
  code: 200
  input:
  - limit?
  - offset?
  - status?
  - obligation_id?
  - deal_id?
  output: BroadcastEvent[]
  side_effects: []
- method: GET
  path: /deals/{dealId}/broadcast-events/{eventId}
  description: Get a broadcast event
  roles:
  - RightsManager
  - BidCoordinator
  - FinanceController
  - ProductionAuditor
  - ComplianceOfficer
  code: 200
  input: []
  output: BroadcastEvent
