              as: CampaignDirector
              as_user_id: "u_dir_1"
            - call: "POST /advocacy/milestones"
              payload: { campaign_id: "${camp_id}", kind: "FLOOR_VOTE", label: "Unaligned window", window_start: "2026-09-01T00:00:30Z", window_end: "2026-09-10T00:00:00Z" }
              as: CampaignDirector
              as_user_id: "u_dir_1"
            - call: "POST /advocacy/milestones"
              payload: { campaign_id: "${camp_id}", kind: "FLOOR_VOTE", label: "Floor vote", window_start: "2026-09-01T00:00:00Z", window_end: "2026-09-10T00:00:00Z" }
