  # -------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: tool_revision_cycle_requalification
        grounds:
          - state_machines.Tool.PRODUCTION_to_UNDER_REVISION
          - state_machines.Tool.UNDER_REVISION_to_QUALIFICATION
          - state_machines.Tool.QUALIFICATION_to_PRODUCTION
          - entities.Tool.fields.drawing_revision
          - entities.Tool.fields.qualified_drawing_revision
        distinguishing_aspect: |
          Cyclic machine on Tool: PRODUCTION -> UNDER_REVISION -> QUALIFICATION
          -> PRODUCTION loop (revision cycles), with drawing_revision advancing
          1 -> 2 and qualified_drawing_revision re-pinning from 1 to 2 at the
          second approve-production. A linear pipeline could never re-enter
          QUALIFICATION.
        test_recipe:
          setup:
            - "Tool TC at PRODUCTION (drawing_revision 1, qualified_drawing_revision 1) with a still-valid TOOL cleanliness cert"
          setup_api_calls:
            - { call: "POST /tools", payload: { tool_code: "TC", part_number: "P-C", tool_type: MATCHED_SET, min_gauge_mm: 1.000, max_gauge_mm: 3.000, cleanliness_grade: FOOD, prototype_cost: 2200.00 }, as: ToolingEngineer, captures: { tool_id: $.data.id } }
            - { call: "POST /tools/${tool_id}/complete-prototype", as: ToolingEngineer }
            - { call: "POST /tools/${tool_id}/submit-qualification", as: ToolingEngineer }
            - { call: "POST /cleanliness-certificates", payload: { subject_type: TOOL, subject_id: "${tool_id}", grade: FOOD, issued_at: "2026-04-01T00:00:00Z", expires_at: "2026-09-01T00:00:00Z", cert_body: "LabA" }, as: QualityInspector }
            - { call: "POST /tools/${tool_id}/approve-production", payload: { production_cost: 12000.00, rated_lifetime_shots: 120000 }, as: ToolingEngineer, captures: { rev1: $.data.qualified_drawing_revision } }
          trigger:
            - { call: "POST /tools/${tool_id}/revise", as: ToolingEngineer, captures: { st_rev: $.data.status, dr2: $.data.drawing_revision } }
            - { call: "POST /tools/${tool_id}/submit-qualification", as: ToolingEngineer, captures: { st_qual: $.data.status } }
            - { call: "POST /tools/${tool_id}/approve-production", payload: { production_cost: 12500.00, rated_lifetime_shots: 120000 }, as: ToolingEngineer, captures: { st_prod: $.data.status, qdr2: $.data.qualified_drawing_revision } }
          assert:
            - "After revise: status == UNDER_REVISION (captured ${st_rev}), drawing_revision == 2 (captured ${dr2})"
            - "After resubmit: status == QUALIFICATION (captured ${st_qual}) — cycle re-entry"
            - "After second approve: status == PRODUCTION (captured ${st_prod}), qualified_drawing_revision == 2 (captured ${qdr2}; was ${rev1} == 1)"
      - name: order_parallel_dimensions_rework_hold_loop
        grounds:
          - state_machines.ProductionOrder(schedule_status).RUNNING_to_ON_HOLD
          - state_machines.ProductionOrder(schedule_status).ON_HOLD_to_RUNNING
          - state_machines.ProductionOrder(quality_status).PENDING_to_REWORK_HOLD
          - state_machines.ProductionOrder(quality_status).REWORK_HOLD_to_PENDING
        distinguishing_aspect: |
          Parallel state dimensions on ProductionOrder (distinct entity from the
          Tool cycle): a REWORK disposition moves quality PENDING -> REWORK_HOLD
          while independently forcing schedule RUNNING -> ON_HOLD; resume then
          cycles both dimensions back (ON_HOLD -> RUNNING, REWORK_HOLD ->
          PENDING). Neither dimension alone captures the order's state.
        test_recipe:
          setup:
            - "RUNNING INDUSTRIAL order O-W (qty 100) with 5.900kg RESERVED, one COMPLETED run (50 good shots), no inspections dispositioned yet"
          setup_api_calls:
            - { call: "POST /material-lots", payload: { lot_code: "LW", resin_type: ABS, gauge_mm: 1.500, cleanliness_grade_required: INDUSTRIAL, quantity_kg: 10.000, unit_cost_per_kg: 9.00 }, as: MaterialsPlanner, captures: { lot_id: $.data.id } }
            - { call: "POST /cleanliness-certificates", payload: { subject_type: MATERIAL_LOT, subject_id: "${lot_id}", grade: INDUSTRIAL, issued_at: "2026-04-01T00:00:00Z", expires_at: "2026-09-01T00:00:00Z", cert_body: "LabA" }, as: QualityInspector }
            - { call: "POST /tools", payload: { tool_code: "TW", part_number: "P-W", tool_type: FORM_MOLD, min_gauge_mm: 1.000, max_gauge_mm: 3.000, cleanliness_grade: INDUSTRIAL, prototype_cost: 1500.00 }, as: ToolingEngineer, captures: { tool_id: $.data.id } }
            - { call: "POST /tools/${tool_id}/complete-prototype", as: ToolingEngineer }
            - { call: "POST /tools/${tool_id}/submit-qualification", as: ToolingEngineer }
            - { call: "POST /cleanliness-certificates", payload: { subject_type: TOOL, subject_id: "${tool_id}", grade: INDUSTRIAL, issued_at: "2026-04-01T00:00:00Z", expires_at: "2026-09-01T00:00:00Z", cert_body: "LabA" }, as: QualityInspector }
            - { call: "POST /tools/${tool_id}/approve-production", payload: { production_cost: 9000.00, rated_lifetime_shots: 90000 }, as: ToolingEngineer }
            - { call: "POST /packaging-specs", payload: { spec_code: "S-W", spec_type: STOCK, cleanliness_grade: INDUSTRIAL, per_pack_cost: 0.40 }, as: PackagingEngineer, captures: { spec_id: $.data.id } }
            - { call: "POST /machine-resources", payload: { resource_code: "ST-W", resource_type: FORMING_STATION, cleanliness_grade: INDUSTRIAL, machine_rate_per_hour: 55.00 }, as: ProductionScheduler, captures: { station_id: $.data.id } }
            - { call: "POST /machine-resources", payload: { resource_code: "B-W", resource_type: INSPECTION_BOOTH, cleanliness_grade: INDUSTRIAL, machine_rate_per_hour: 25.00 }, as: ProductionScheduler, captures: { booth_id: $.data.id } }
            - { call: "POST /production-orders", payload: { order_code: "OW", part_number: "P-W", resin_type: ABS, ordered_qty: 100, required_gauge_mm: 1.500, cleanliness_grade: INDUSTRIAL, spec_nominal_wall_mm: 1.300, spec_min_wall_mm: 1.230, nominal_part_weight_kg: 0.050, std_cycle_time_s: 30, std_machine_rate_per_hour: 55.00, tool_id: "${tool_id}", packaging_spec_id: "${spec_id}", is_prototype_order: false }, as: ProductionScheduler, captures: { order_id: $.data.id } }
            - { call: "POST /material-allocations", payload: { production_order_id: "${order_id}", source_type: VIRGIN_LOT, lot_id: "${lot_id}", qty_kg: 5.900 }, as: ProductionScheduler }
            - { call: "GET /production-orders/${order_id}", as: Any, captures: { o_ver: $.data.version } }
            - { call: "POST /production-orders/${order_id}/stage", payload: { expected_production_order_version: "${o_ver}" }, as: ProductionScheduler }
            - { call: "POST /forming-runs", payload: { production_order_id: "${order_id}", station_id: "${station_id}", planned_start: "2026-05-02T10:00:00Z", planned_end: "2026-05-02T10:30:00Z", oven_temp_c: 170.0, cycle_time_s: 30, shots_planned: 50 }, as: ProductionScheduler, captures: { run_id: $.data.id } }
            - { call: "POST /forming-runs/${run_id}/complete", payload: { shots_completed: 50, scrap_weight_kg: 0.000, actual_end: "2026-05-02T10:30:00Z" }, as: ProductionScheduler }
            - { call: "POST /quality-inspections", payload: { production_order_id: "${order_id}", forming_run_id: "${run_id}", booth_id: "${booth_id}", inspection_type: FIRST_ARTICLE, scheduled_start: "2026-05-02T11:00:00Z", scheduled_end: "2026-05-02T11:30:00Z", wall_measurements_mm: [1.240, 1.250] }, as: QualityInspector, as_user_id: qi-1, captures: { insp_id: $.data.id } }
          trigger:
            - { call: "POST /quality-inspections/${insp_id}/disposition", payload: { disposition: REWORK }, as: QualityInspector, as_user_id: qi-2 }
            - { call: "GET /production-orders/${order_id}", as: Any, captures: { sched_hold: $.data.schedule_status, qual_hold: $.data.quality_status } }
            - { call: "POST /production-orders/${order_id}/resume", as: ProductionScheduler }
            - { call: "GET /production-orders/${order_id}", as: Any, captures: { sched_run: $.data.schedule_status, qual_pend: $.data.quality_status } }
          assert:
            - "After REWORK: schedule_status == ON_HOLD (captured ${sched_hold}) AND quality_status == REWORK_HOLD (captured ${qual_hold}) — both dimensions moved"
            - "After resume: schedule_status == RUNNING (captured ${sched_run}) AND quality_status == PENDING (captured ${qual_pend}) — both dimensions cycle back"
  # -------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: run_complete_depth3_completion_cascade
        grounds:
          - state_machines.FormingRun.SCHEDULED_to_COMPLETED
          - state_machines.ProductionOrder(schedule_status).RUNNING_to_COMPLETED
          - state_machines.MaterialAllocation.RESERVED_to_CONSUMED
          - state_machines.MaterialLot.CERTIFIED_to_DEPLETED
          - calculations.order_cost
        distinguishing_aspect: |
          Depth-3 cascade from a single trigger (POST /forming-runs/{id}/complete):
          run completion pushes order.shots_completed to target (hop 1: order ->
          COMPLETED because quality already RELEASED); order completion consumes
          its RESERVED allocation and rewrites lot.allocated_kg/consumed_kg (hop
          2); the lot's derived available_kg hitting exactly 0 flips the lot to
          DEPLETED (hop 3). Each hop is caused by the previous hop's mutation.
        test_recipe:
          setup:
            - "CERTIFIED lot sized exactly 5.900kg (== order requirement) so consumption zeroes available_kg"
            - "Order O-C qty 100 RUNNING, quality already RELEASED via FIRST_ARTICLE PASS after run 1 (10 shots)"
          setup_api_calls:
            - { call: "POST /material-lots", payload: { lot_code: "LC", resin_type: PETG, gauge_mm: 1.500, cleanliness_grade_required: INDUSTRIAL, quantity_kg: 5.900, unit_cost_per_kg: 10.00 }, as: MaterialsPlanner, captures: { lot_id: $.data.id } }
