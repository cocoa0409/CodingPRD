- rule_id: resource_temporal_overlap
  instances:
  - name: trap_date_must_precede_clinic_day_strictly
    grounds:
    - validations[priority=10]
    - entities.TrappingAppointment.fields.trap_date
    distinguishing_aspect: 'Interval semantics: strict precedence — trap_date equal to the

      slot''s clinic-day service_date is rejected (half-open precedence,

      adjacency is NOT allowed); the trap interval [trap_date, day) must

      be non-empty. Resource: ClinicSlot''s day. Distinct from the

      sibling''s point-in-window semantics.

      '
    test_recipe:
      setup:
      - Clinic day on 2026-08-28 with an OPEN slot; cat AT_LARGE
      setup_api_calls:
      - call: POST /tnr/caretakers
        payload:
          full_name: Tem Poral
          phone: 555-16
          email: tem@x.com
        as: ProgramCoordinator
        captures:
          ct_id: $.data.id
      - call: POST /tnr/colonies
        payload:
          name: Time Col
          address: 8 Time
          caretaker_id: ${ct_id}
          estimated_population: 1
        as: ProgramCoordinator
        captures:
          col_id: $.data.id
      - call: POST /tnr/colonies/${col_id}/cats
        payload:
          intake_tag: TM1
          sex: MALE
          approximate_age_months: 24
        as: ProgramCoordinator
        captures:
          cat1: $.data.id
      - call: POST /tnr/partner-clinics
        payload:
          name: TimeVet
          voucher_reimbursement_cents: 10000
        as: ProgramCoordinator
        captures:
          clin_id: $.data.id
      - call: POST /tnr/clinic-days
        payload:
          clinic_id: ${clin_id}
          service_date: '2026-08-28T00:00:00Z'
          base_capacity: 1
          surge_capacity: 0
        as: ClinicStaff
        captures:
          day_id: $.data.id
      - call: GET /tnr/clinic-days/${day_id}/slots
        payload: {}
        as: ClinicStaff
        captures:
          slot1: $.data[0].id
      trigger:
      - call: GET /tnr/clinic-days/${day_id}
        payload: {}
        as: ClinicStaff
        captures:
          day_id_v17: $.data.version
      - call: POST /tnr/appointments
        payload:
          cat_id: ${cat1}
          clinic_slot_id: ${slot1}
          trap_date: '2026-08-28T00:00:00Z'
          expected_clinic_day_version: ${day_id_v17}
        as: Caretaker
        as_user_id: ${ct_id}
      assert:
      - response error_id == ERR_TEMPORAL_CONFLICT with http 422 (same-day trapping violates strict precedence)
  - name: voucher_expiry_month_window
    grounds:
    - calculations.voucher_monthly_issuance_cap
    - state_machines.Voucher.ISSUED_to_EXPIRED
    distinguishing_aspect: 'Interval semantics: calendar-month TTL window — a voucher issued in

      month M expires only when current_month >= M + 3 (inclusive month

      arithmetic, NOT a rolling 90-day window); a voucher issued

      2026-08-31 still counts August as month 0 and expires in November.

      Resource: Voucher''s validity window. Different semantics from the

      sibling''s strict-precedence rule (month-granular inclusive window

      vs datetime strict ordering).

      '
    test_recipe:
      setup:
      - Clock at 2026-08-31; voucher issued (issued_month 2026-08); clock advanced to 2026-11-15 (M+3 boundary)
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-31T12:00:00Z'
        as: ProgramCoordinator
      - call: POST /tnr/caretakers
        payload:
          full_name: Win Dow
          phone: 555-17
          email: win@x.com
        as: ProgramCoordinator
        captures:
          ct_id: $.data.id
      - call: POST /tnr/vouchers
        payload:
          caretaker_id: ${ct_id}
          face_value_cents: 4000
          funding_source: MUNICIPAL_GRANT
        as: ProgramCoordinator
        captures:
          v_id: $.data.id
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-10-31T12:00:00Z'
        as: ProgramCoordinator
      - call: POST /tnr/vouchers/expire-sweep
        payload: {}
        as: ProgramCoordinator
      - call: GET /tnr/vouchers/${v_id}
        payload: {}
        as: ProgramCoordinator
        captures:
          v_status_oct: $.data.status
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-11-15T12:00:00Z'
        as: ProgramCoordinator
      trigger:
      - call: POST /tnr/vouchers/expire-sweep
        payload: {}
        as: ProgramCoordinator
      assert:
      - Voucher.${v_id}.status after October sweep == ISSUED (2 months elapsed < 3)
      - Voucher.${v_id}.status after November sweep == EXPIRED (3 calendar months elapsed, inclusive month arithmetic)
- rule_id: compensating_invariant
  instances:
