  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: rejecting_a_previously_verified_document_restores_the_parts_cost_aggregate
        grounds:
          - calculations.documentation_completeness
          - entities.RebuiltApplication.fields.documented_parts_cost_cents
          - calculations.documentation_completeness
          - state_machines.PartsDocument.VERIFIED_to_REJECTED
          - endpoints[POST /v1/parts-documents/{id}/reject]
        distinguishing_aspect: |
          Conserved quantity #1 — RebuiltApplication.documented_parts_cost_cents must always equal
          the exact sum of amount_cents over PartsDocument rows in state VERIFIED. After three
          documents are verified (200000 + 50000 + 30000 = 280000) the compensating VERIFIED ->
          REJECTED transition on the 50000 RESTRAINT document must subtract exactly its own
          contribution back out to 230000, with no drift and no double subtraction on replay, and
          must also walk documentation_completeness_pct back from 100.00 to 66.67.
        test_recipe:
          setup:
            - "a SEDAN vehicle on a SALVAGE title with an application in DRAFT"
            - "three parts documents covering STRUCTURAL 200000, RESTRAINT 50000 and LIGHTING 30000, all VERIFIED"
          setup_api_calls:
            - call: "POST /v1/vehicles"
              payload: { vin: "1HGCM82633A005901", model_year: 2019, make: "Honda", model: "Accord", body_class: "SEDAN", registered_state_code: "NV" }
              as: StateTitleClerk
              as_user_id: "clerk-01"
              captures: { veh_id: $.data.id }
            - call: "POST /v1/rebuilders"
              payload: { legal_name: "Sierra Rebuilders LLC", license_number: "RB-1014", license_expires_at: "2027-06-30T00:00:00Z", bond_amount_cents: 2500000 }
              as: ProgramAdmin
