            - call: "GET /tdr/parties/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ProgramAdministrator
            - call: "GET /tdr/sending-areas/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ProgramAdministrator
            - call: "GET /tdr/receiving-areas/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ProgramAdministrator
            - call: "GET /tdr/appraisal-schedules/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ProgramAdministrator
            - call: "GET /tdr/sending-parcels/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ProgramAdministrator
            - call: "GET /tdr/severance-applications/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ProgramAdministrator
            - call: "GET /tdr/conservation-easements/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ProgramAdministrator
            - call: "GET /tdr/conservation-easements/00000000-0000-4000-8000-000000000000/inspections"
              payload: {}
              as: ProgramAdministrator
            - call: "GET /tdr/certificates/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ProgramAdministrator
            - call: "GET /tdr/certificate-transfers/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ProgramAdministrator
            - call: "GET /tdr/market-transactions/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ProgramAdministrator
            - call: "GET /tdr/receiving-site-applications/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ProgramAdministrator
            - call: "GET /tdr/certificate-redemptions/00000000-0000-4000-8000-000000000000"
              payload: {}
