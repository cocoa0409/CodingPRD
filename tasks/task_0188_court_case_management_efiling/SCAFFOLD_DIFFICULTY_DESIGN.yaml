  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: fee_assess_then_reject_releases_fee_invariant
        grounds:
          - state_machines.Filing.UNDER_REVIEW_to_REJECTED
          - entities.Filing.fields.fee_status
          - entities.Case.fields.total_fees_assessed_cents
        distinguishing_aspect: |
          Conserved quantity = Case.total_fees_assessed_cents. A COMPLAINT filing assessed
          (fee_status ASSESSED) and then REJECTED must release the fee (fee_status->NONE),
          leaving total_fees_assessed_cents identical to its pre-filing value (0): the
          forward assess and the compensating reject net to zero drift in the assessed sum.
        test_recipe:
          setup:
            - "An OPEN case (first complaint already accepted+paid); a second complaint filing assessed then rejected."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00.000Z" }
              as: SystemAdmin
            - call: "POST /courts"
              payload: { name: "Sup Ct Q", jurisdiction_code: "CA", filing_fee_cents: 43500, business_days_only: true, holidays: [], appeal_window_days: 30 }
              as: SystemAdmin
              captures: { court_id: $.data.id }
            - call: "POST /cases"
              payload: { court_id: "${court_id}", caption: "Acme v Beta", case_type: "CONTRACT" }
              as: Clerk
              captures: { case_id: $.data.id }
            - call: "POST /parties"
              payload: { case_id: "${case_id}", display_name: "Acme", role: "PLAINTIFF", attorney_user_id: "att_1" }
              as: Clerk
              captures: { p_pl_id: $.data.id }
            - call: "POST /filings"
              payload: { case_id: "${case_id}", filed_by_party_id: "${p_pl_id}", document_type: "ANSWER", title: "Answer" }
              as: Attorney
              as_user_id: "att_1"
              captures: { f0_id: $.data.id }
            - call: "POST /filings/${f0_id}/claim-review"
              payload: {}
              as: Clerk
            - call: "POST /filings/${f0_id}/accept"
              payload: {}
              as: Clerk
            - call: "GET /cases/${case_id}"
              payload: {}
              as: Clerk
              captures: { assessed_before: $.data.total_fees_assessed_cents }
            - call: "POST /filings"
              payload: { case_id: "${case_id}", filed_by_party_id: "${p_pl_id}", document_type: "COMPLAINT", title: "Complaint 2" }
              as: Attorney
              as_user_id: "att_1"
              captures: { f2_id: $.data.id }
            - call: "POST /filings/${f2_id}/claim-review"
              payload: {}
              as: Clerk
          trigger:
            - call: "POST /filings/${f2_id}/reject"
              payload: { rejection_reason: "Wrong court" }
              as: Clerk
              captures: { fee_status: $.data.fee_status }
            - call: "GET /cases/${case_id}"
              payload: {}
              as: Clerk
              captures: { assessed_after: $.data.total_fees_assessed_cents }
          assert:
            - "Filing.${f2_id}.fee_status == 'NONE'"
            - "Case.${case_id}.total_fees_assessed_cents == 0"

      - name: judgment_vacate_restores_open_deadline_count_invariant
        grounds:
          - state_machines.Judgment.ENTERED_to_VACATED
          - state_machines.Case.OPEN_to_JUDGMENT_ENTERED
          - entities.Case.fields.open_deadline_count
          - entities.Deadline.fields.status
        distinguishing_aspect: |
          A different conserved quantity = Case.open_deadline_count. Entering a judgment
          creates an APPEAL deadline (count +1); vacating that judgment must vacate that
          same APPEAL deadline (count -1), restoring open_deadline_count to its
          pre-judgment value (0) with no orphaned PENDING APPEAL deadline left behind.
        test_recipe:
          setup:
            - "An OPEN case with no pending deadlines; a judgment entered (creating an APPEAL deadline) then vacated."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00.000Z" }
              as: SystemAdmin
            - call: "POST /courts"
              payload: { name: "Sup Ct R", jurisdiction_code: "CA", filing_fee_cents: 43500, business_days_only: true, holidays: [], appeal_window_days: 30 }
              as: SystemAdmin
              captures: { court_id: $.data.id }
            - call: "POST /cases"
              payload: { court_id: "${court_id}", caption: "Acme v Beta", case_type: "CONTRACT" }
              as: Clerk
              captures: { case_id: $.data.id }
            - call: "POST /parties"
              payload: { case_id: "${case_id}", display_name: "Acme", role: "PLAINTIFF", attorney_user_id: "att_1" }
              as: Clerk
              captures: { p_pl_id: $.data.id }
            - call: "POST /parties"
              payload: { case_id: "${case_id}", display_name: "Beta", role: "DEFENDANT", attorney_user_id: "att_2" }
              as: Clerk
              captures: { p_df_id: $.data.id }
            - call: "POST /filings"
              payload: { case_id: "${case_id}", filed_by_party_id: "${p_pl_id}", document_type: "COMPLAINT", title: "Complaint" }
              as: Attorney
              as_user_id: "att_1"
              captures: { f_comp_id: $.data.id }
            - call: "POST /filings/${f_comp_id}/pay-fee"
              payload: {}
              as: Clerk
            - call: "POST /filings/${f_comp_id}/claim-review"
              payload: {}
              as: Clerk
            - call: "POST /filings/${f_comp_id}/accept"
              payload: {}
              as: Clerk
            - call: "POST /cases/${case_id}/open"
              payload: {}
              as: Clerk
              captures: { case_v: $.data.version }
            - call: "GET /cases/${case_id}"
              payload: {}
              as: Clerk
              captures: { count_before: $.data.open_deadline_count }
            - call: "POST /judgments"
              payload: { case_id: "${case_id}", judgment_type: "TRIAL", prevailing_party_id: "${p_pl_id}", principal_cents: 0, interest_rate_bps: 0, expected_case_version: "${case_v}" }
              as: Judge
              captures: { j_id: $.data.id }
          trigger:
            - call: "POST /judgments/${j_id}/vacate"
              payload: {}
              as: Judge
            - call: "GET /cases/${case_id}"
              payload: {}
              as: Clerk
              captures: { count_after: $.data.open_deadline_count, status_after: $.data.status }
          assert:
            - "Case.${case_id}.status == 'OPEN'"
            - "Case.${case_id}.open_deadline_count == 0"
            - "Judgment.${j_id}.status == 'VACATED'"
