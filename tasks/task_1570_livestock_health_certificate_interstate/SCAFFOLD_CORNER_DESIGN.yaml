            - "Adjacent covering row [2026-06-01, 2026-09-01) is accepted (half-open adjacency, no overlap) and unblocks submit: status 'PENDING_REVIEW', provisional_fee_cents == 4250 (2500 + 150*5 + 1000)"

      - name: certificate_species_mismatch_rejected
