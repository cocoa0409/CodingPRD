scenario: |
  Center-Based Senior Primary Care Panel Growth & Full-Risk Economics (Oak Street Health): community center placement in senior-dense neighborhoods with events and outreach driving patient acquisition, patient attribution through Medicare Advantage plan assignment and primary care selection changes, panel size limits per care team enabling long visits and proactive outreach, full-risk arrangements where the practice bears total cost of care with plan revenue share, transportation provision to reduce missed visits with routing and no-show recovery, urgent care access and after-hours triage to divert emergency department use, care team staffing model with community health workers and behavioral integration, center-level profitability ramp from opening through panel maturity

domain_name: senior-primary-care
api_prefix: /senior-care

complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - ops_run_checkpoint
    - scheduled_actions
  entity_topology: hybrid
  state_machine_shape: compound
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: Center
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Center display name" }
      - { name: neighborhood_code, type: string, source: input, description: "Senior-dense neighborhood code (e.g., CHI-SOUTH-04)" }
      - { name: opened_on, type: string, source: input, description: "ISO date the center opened for patients" }
      - { name: maturity_months, type: integer, source: computed, default: 0, description: "Whole calendar months elapsed since opened_on at the logical clock; recomputed by the monthly close run" }
      - { name: profitability_tier, type: enum, source: computed, description: "RAMP | BREAKEVEN | MATURE — derived from cumulative_contribution_cents and panel_fill_ratio at monthly close", constraints: "RAMP | BREAKEVEN | MATURE" }
      - { name: panel_fill_ratio, type: number, source: computed, description: "Sum of ACTIVE panel member counts across the center's care teams divided by sum of their panel_cap values; 4-decimal round_half_up" }
      - { name: cumulative_contribution_cents, type: integer, source: computed, description: "Running sum of settled monthly contribution (revenue share minus total cost of care) across closed months; negative while ramping" }
      - { name: ed_referral_count_current_month, type: integer, source: computed, default: 0, description: "Count of TriageCase rows resolving RESOLVED_ED or EXPIRED in the current logical month for patients attributed to this center; resets to 0 when the logical clock crosses a month boundary" }
      - { name: status, type: enum, source: system, description: "Center lifecycle", constraints: "PRE_OPEN | OPEN | SATURATED | CLOSED" }

  - name: CareTeam
    parent: Center
    common_fields: true
    fields:
      - { name: center_id, type: string, source: system, description: "FK -> Center.id; owning center" }
      - { name: team_label, type: string, source: input, description: "Human label, e.g. Team Blue" }
      - { name: panel_cap, type: integer, source: input, description: "Maximum ACTIVE-attributed patients allowed on this team; positive integer, min 1" }
      - { name: physician_count, type: integer, source: input, description: "Licensed physicians staffed" }
      - { name: chw_count, type: integer, source: input, description: "Community health workers staffed" }
      - { name: behavioral_count, type: integer, source: input, description: "Behavioral health clinicians staffed" }
      - { name: staffing_score, type: number, source: computed, description: "physician_count*1.0 + chw_count*0.5 + behavioral_count*0.75; 2-decimal round_half_up; recomputed on any staffing field change" }
      - { name: active_panel_count, type: integer, source: computed, default: 0, description: "Count of PatientAttribution rows in ACTIVE state pointing at this team" }
      - { name: waitlist_depth, type: integer, source: computed, default: 0, description: "Count of PatientAttribution rows in WAITLISTED state for this team" }
      - { name: accepting, type: boolean, source: system, default: true, description: "False once the team is closed by the panel-breach cascade or admin action" }

  - name: Patient
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Patient legal name" }
      - { name: date_of_birth, type: string, source: input, description: "ISO date; must place patient at age >= 60 at logical clock time" }
      - { name: zip_code, type: string, source: input, description: "5-digit ZIP of residence" }
      - { name: risk_score, type: number, source: input, description: "Hierarchical-condition risk score, >= 0.50 and <= 4.00, 2-decimal input" }
      - { name: transport_dependent, type: boolean, source: input, default: false, description: "Whether patient needs practice-provided rides" }
      - { name: no_show_strikes, type: integer, source: computed, default: 0, description: "Count of COMPLETED_NO_SHOW appointments in trailing 90 days; recomputed by nightly sweep" }

  - name: HealthPlan
    parent: null
    common_fields: true
    fields:
      - { name: plan_name, type: string, source: input, description: "Medicare Advantage plan name" }
      - { name: contract_type, type: enum, source: input, description: "FULL_RISK | SHARED_SAVINGS — only FULL_RISK accrues total-cost-of-care settlement", constraints: "FULL_RISK | SHARED_SAVINGS" }
      - { name: base_pmpm_cents, type: integer, source: input, description: "Base per-member-per-month capitation before risk adjustment, in cents" }
      - { name: risk_adjust_factor, type: number, source: input, description: "Multiplier applied to Patient.risk_score; 0.80–1.60" }
      - { name: revenue_share_pct, type: number, source: input, description: "Practice share of plan premium for FULL_RISK contracts; 0.50–1.00" }

  - name: PatientAttribution
    parent: Patient
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: system, description: "FK -> Patient.id; attributed patient" }
      - { name: health_plan_id, type: string, source: input, description: "FK -> HealthPlan.id; MA plan assignment source" }
      - { name: care_team_id, type: string, source: input, description: "FK -> CareTeam.id; selected care team" }
      - { name: effective_month, type: string, source: input, description: "YYYY-MM month the attribution takes effect; must be >= current logical month" }
      - { name: status, type: enum, source: system, description: "Attribution lifecycle", constraints: "PENDING | ACTIVE | WAITLISTED | DISENROLLED | REATTRIBUTED" }
      - { name: disenrolled_month, type: string, source: system, description: "YYYY-MM the patient disenrolled, set on DISENROLLED transition; null otherwise" }

  - name: Appointment
    parent: CareTeam
    common_fields: true
    fields:
      - { name: care_team_id, type: string, source: system, description: "FK -> CareTeam.id; team performing the visit" }
      - { name: patient_id, type: string, source: input, description: "FK -> Patient.id; visiting patient" }
      - { name: room_id, type: string, source: input, description: "FK -> CenterRoom.id; exam room reserved" }
      - { name: start_utc, type: string, source: input, description: "ISO8601 start; must be at a 20-minute boundary within center hours" }
      - { name: duration_minutes, type: integer, source: input, description: "20 | 40 | 60 — long-visit model" }
      - { name: kind, type: enum, source: input, description: "PRIMARY | BEHAVIORAL | CHW_OUTREACH", constraints: "PRIMARY | BEHAVIORAL | CHW_OUTREACH" }
      - { name: status, type: enum, source: system, description: "Visit lifecycle", constraints: "SCHEDULED | CHECKED_IN | COMPLETED | COMPLETED_NO_SHOW | CANCELLED" }
      - { name: cost_cents, type: integer, source: computed, description: "Internal cost booked to cost of care on COMPLETED or COMPLETED_NO_SHOW; see cost_of_care_booking" }

  - name: CenterRoom
    parent: Center
    common_fields: true
    fields:
      - { name: center_id, type: string, source: system, description: "FK -> Center.id; owning center" }
      - { name: room_label, type: string, source: input, description: "Room label (R1, R2...)" }
      - { name: supports_behavioral, type: boolean, source: input, default: false, description: "Whether room is equipped for BEHAVIORAL appointments" }

  - name: Vehicle
    parent: Center
    common_fields: true
    fields:
      - { name: center_id, type: string, source: system, description: "FK -> Center.id; owning center" }
      - { name: plate, type: string, source: input, description: "Vehicle plate identifier" }
      - { name: seat_capacity, type: integer, source: input, description: "Passenger seats available for routing; min 1" }
      - { name: wheelchair_capable, type: boolean, source: input, default: false, description: "Whether vehicle can carry a wheelchair passenger" }

  - name: RideRequest
    parent: Appointment
    common_fields: true
    fields:
      - { name: appointment_id, type: string, source: system, description: "FK -> Appointment.id; ride serves this visit" }
      - { name: patient_id, type: string, source: system, description: "FK -> Patient.id; copied from appointment at creation" }
      - { name: pickup_window_start, type: string, source: computed, description: "appointment.start_utc minus 90 minutes" }
      - { name: pickup_window_end, type: string, source: computed, description: "appointment.start_utc minus 30 minutes" }
      - { name: assigned_vehicle_id, type: string, source: system, description: "FK -> Vehicle.id; set by dispatch transition; null while REQUESTED" }
      - { name: status, type: enum, source: system, description: "Ride lifecycle", constraints: "REQUESTED | DISPATCHED | EN_ROUTE | DELIVERED | FAILED_NO_SHOW | RECOVERED | CANCELLED" }
      - { name: failure_count, type: integer, source: system, default: 0, description: "Times this ride entered FAILED_NO_SHOW then recovered" }

  - name: TriageCase
    parent: Patient
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: system, description: "FK -> Patient.id; caller patient" }
      - { name: channel, type: enum, source: input, description: "AFTER_HOURS_LINE | WALK_IN | CARE_TEAM_ESCALATION", constraints: "AFTER_HOURS_LINE | WALK_IN | CARE_TEAM_ESCALATION" }
      - { name: severity, type: enum, source: input, description: "LOW | MODERATE | HIGH", constraints: "LOW | MODERATE | HIGH" }
      - { name: disposition, type: enum, source: system, description: "URGENT_CARE_BOOKED | ED_REFERRED | SELF_CARE_ADVISED — null until resolved", constraints: "URGENT_CARE_BOOKED | ED_REFERRED | SELF_CARE_ADVISED" }
      - { name: diversion_success, type: boolean, source: computed, description: "True only when disposition == URGENT_CARE_BOOKED and the linked urgent-care appointment completes; false when ED_REFERRED" }
      - { name: status, type: enum, source: system, description: "Triage lifecycle", constraints: "OPEN | RESOLVED_DIVERTED | RESOLVED_ED | RESOLVED_SELF_CARE | EXPIRED" }

  - name: CostOfCareClaim
    parent: Center
    common_fields: true
    fields:
      - { name: center_id, type: string, source: system, description: "FK -> Center.id; center bearing the cost" }
      - { name: patient_id, type: string, source: input, description: "FK -> Patient.id; member the cost belongs to" }
      - { name: service_month, type: string, source: input, description: "YYYY-MM the service occurred in; must be <= current logical month" }
      - { name: category, type: enum, source: input, description: "ED_VISIT | INPATIENT | SPECIALIST | PHARMACY | TRANSPORT | INTERNAL_VISIT", constraints: "ED_VISIT | INPATIENT | SPECIALIST | PHARMACY | TRANSPORT | INTERNAL_VISIT" }
      - { name: amount_cents, type: integer, source: input, description: "Claimed amount, positive integer cents" }
      - { name: adjudicated_amount_cents, type: integer, source: system, description: "Final allowed amount after adjudication; set by adjudicate transition" }
      - { name: status, type: enum, source: system, description: "Claim lifecycle", constraints: "SUBMITTED | ADJUDICATED | SETTLED | REJECTED" }

  - name: MonthlySettlement
    parent: Center
    common_fields: true
    fields:
      - { name: center_id, type: string, source: system, description: "FK -> Center.id; center being settled" }
      - { name: period_month, type: string, source: input, description: "YYYY-MM of the close; unique per center" }
      - { name: member_months, type: integer, source: computed, description: "Count of PatientAttribution rows ACTIVE during the period for this center; day-count prorated per panel_revenue_accrual" }
      - { name: accrued_revenue_cents, type: integer, source: computed, description: "Per-member-month capitation accrued for the period (chronological variant at provisional; forward-looking at final)" }
      - { name: total_cost_of_care_cents, type: integer, source: computed, description: "Sum of adjudicated claims + booked internal visit costs + dispatched ride costs for the period" }
      - { name: contribution_cents, type: integer, source: computed, description: "accrued_revenue_cents minus total_cost_of_care_cents; may be negative" }
      - { name: status, type: enum, source: system, description: "Settlement lifecycle", constraints: "OPEN | CLOSED_PROVISIONAL | FINALIZED | VOIDED" }

  - name: OutreachEvent
    parent: Center
    common_fields: true
    fields:
      - { name: center_id, type: string, source: system, description: "FK -> Center.id; hosting center" }
      - { name: event_label, type: string, source: input, description: "Event name (health fair, bingo night)" }
      - { name: scheduled_on, type: string, source: input, description: "ISO date of the event; must not be in the past at creation" }
      - { name: expected_attendance, type: integer, source: input, description: "Projected attendees; min 1" }
      - { name: attributed_signups, type: integer, source: computed, default: 0, description: "Count of PatientAttribution rows created with this event as source" }

state_machines:
  - entity: Center
    initial_state: PRE_OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: PRE_OPEN
        to: OPEN
        trigger: "POST /senior-care/centers/{centerId}/open"
        actor: NetworkOperator
        preconditions:
          - "Center is PRE_OPEN (ERR_CENTER_NOT_PRE_OPEN)"
          - "Center has at least one CareTeam (ERR_CENTER_HAS_NO_TEAMS)"
          - "Center has at least one CenterRoom (ERR_CENTER_HAS_NO_ROOMS)"
        side_effects:
          - "status -> OPEN"
      - from: OPEN
        to: SATURATED
        trigger: "system (automatic when panel_fill_ratio >= 1.0000 at any attribution activation or monthly close)"
        actor: system
        preconditions: []
        side_effects:
          - "status -> SATURATED"
          - "Every CareTeam of the center with active_panel_count >= panel_cap has accepting set to false"
          - "Existing PENDING attributions targeting full teams transition to WAITLISTED"
      - from: SATURATED
        to: OPEN
        trigger: "system (automatic when panel_fill_ratio < 0.9000 after a disenrollment or panel-cap increase)"
        actor: system
        preconditions: []
        side_effects:
          - "status -> OPEN"
          - "CareTeams with active_panel_count < panel_cap have accepting set to true"
          - "Waitlist promotion sweep runs: WAITLISTED attributions promote to PENDING in created_at ASC order while headroom exists"
      - from: OPEN
        to: CLOSED
        trigger: "POST /senior-care/centers/{centerId}/close"
        actor: NetworkOperator
        preconditions:
          - "No PatientAttribution in PENDING, ACTIVE, or WAITLISTED state for any team of this center (ERR_CENTER_HAS_ACTIVE_PANEL)"
          - "No MonthlySettlement in OPEN or CLOSED_PROVISIONAL (ERR_CENTER_HAS_OPEN_SETTLEMENT)"
        side_effects:
          - "status -> CLOSED"
          - "All Vehicles and CenterRooms of the center become unassignable"

      - from: SATURATED
        to: CLOSED
        trigger: "POST /senior-care/centers/{centerId}/close"
        actor: NetworkOperator
        preconditions:
          - "No PatientAttribution in PENDING, ACTIVE, or WAITLISTED state for any team of this center (ERR_CENTER_HAS_ACTIVE_PANEL)"
          - "No MonthlySettlement in OPEN or CLOSED_PROVISIONAL (ERR_CENTER_HAS_OPEN_SETTLEMENT)"
        side_effects:
          - "status -> CLOSED"
          - "All Vehicles and CenterRooms of the center become unassignable"

  - entity: CareTeam
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: ACTIVE
        trigger: "PATCH /senior-care/care-teams/{teamId} (panel_cap or staffing change)"
        actor: NetworkOperator
        preconditions:
          - "panel_cap >= active_panel_count when lowered (ERR_INVALID_REQUEST)"
        side_effects:
          - "staffing_score recomputed"
          - "increments CareTeam.version by 1"
          - "if panel_cap raised while Center is SATURATED: re-evaluate Center OPEN/SATURATED and run waitlist promotion"
    note: "CareTeam carries no lifecycle states beyond ACTIVE; the machine exists to pin version-bump and recompute side effects on mutation."

  - entity: PatientAttribution
    initial_state: PENDING
    terminal_states: [DISENROLLED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /senior-care/patient-attributions/{attrId}/activate"
        actor: EnrollmentCoordinator
        preconditions:
          - "Attribution is PENDING (ERR_ATTRIBUTION_NOT_PENDING)"
          - "effective_month <= current logical month (ERR_ATTRIBUTION_NOT_YET_EFFECTIVE)"
          - "Target CareTeam.accepting is true (ERR_TEAM_NOT_ACCEPTING)"
          - "CareTeam.active_panel_count < panel_cap (ERR_PANEL_CAP_REACHED)"
          - "Patient has no other ACTIVE or PENDING attribution (ERR_PATIENT_ALREADY_ATTRIBUTED)"
        side_effects:
          - "status -> ACTIVE"
          - "CareTeam.active_panel_count += 1"
          - "If center panel_fill_ratio reaches >= 1.0000: Center -> SATURATED cascade"
      - from: PENDING
        to: WAITLISTED
        trigger: "system (automatic on panel-breach cascade or activation attempt against a full team when overflow policy is WAITLIST)"
        actor: system
        preconditions:
          - "Target team is full (active_panel_count >= panel_cap)"
        side_effects:
          - "status -> WAITLISTED"
          - "CareTeam.waitlist_depth += 1"
      - from: WAITLISTED
        to: PENDING
        trigger: "system (waitlist promotion sweep when headroom opens)"
        actor: system
        preconditions:
          - "Target CareTeam.active_panel_count < panel_cap"
          - "This attribution is earliest by created_at ASC among WAITLISTED rows for the team"
        side_effects:
          - "status -> PENDING"
          - "CareTeam.waitlist_depth -= 1"
      - from: ACTIVE
        to: DISENROLLED
        trigger: "POST /senior-care/patient-attributions/{attrId}/disenroll"
        actor: EnrollmentCoordinator
        preconditions:
          - "Attribution is ACTIVE (ERR_ATTRIBUTION_NOT_ACTIVE)"
        side_effects:
          - "status -> DISENROLLED; disenrolled_month = current logical month"
          - "CareTeam.active_panel_count -= 1"
          - "If center was SATURATED and panel_fill_ratio drops < 0.9000: Center -> OPEN and waitlist promotion sweep"
      - from: DISENROLLED
        to: REATTRIBUTED
        trigger: "POST /senior-care/patient-attributions/{attrId}/reattribute"
        actor: EnrollmentCoordinator
        preconditions:
          - "Attribution is DISENROLLED (ERR_ATTRIBUTION_NOT_DISENROLLED)"
          - "A new PENDING attribution for the same patient is supplied via payload new_attribution_id and is in PENDING (ERR_NEW_ATTRIBUTION_NOT_PENDING)"
          - "New attribution's effective_month > this row's disenrolled_month (ERR_REATTRIBUTION_MONTH_NOT_AFTER_DISENROLL)"
        side_effects:
          - "status -> REATTRIBUTED (row becomes a historical link; the new PENDING attribution is the live record)"
          - "The new attribution may then be activated normally"

  - entity: Appointment
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, COMPLETED_NO_SHOW, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: CHECKED_IN
        trigger: "POST /senior-care/appointments/{apptId}/check-in"
        actor: FrontDesk
        preconditions:
          - "Appointment is SCHEDULED (ERR_APPOINTMENT_NOT_SCHEDULED)"
          - "Logical clock within [start_utc - 30m, start_utc + duration] (ERR_CHECKIN_WINDOW_MISSED)"
        side_effects:
          - "status -> CHECKED_IN"
      - from: CHECKED_IN
        to: COMPLETED
        trigger: "POST /senior-care/appointments/{apptId}/complete"
        actor: CareTeamLead
        preconditions:
          - "Appointment is CHECKED_IN (ERR_APPOINTMENT_NOT_CHECKED_IN)"
        side_effects:
          - "status -> COMPLETED"
          - "Book cost_of_care_booking: cost_cents computed and added to the open MonthlySettlement's total_cost_of_care_cents as INTERNAL_VISIT"
          - "If the appointment's RideRequest is EN_ROUTE or DISPATCHED: ride -> DELIVERED and TRANSPORT cost booked"
      - from: SCHEDULED
        to: COMPLETED_NO_SHOW
        trigger: "system (nightly sweep marks SCHEDULED appointments whose end time has passed)"
        actor: system
        preconditions:
          - "Logical clock past start_utc + duration_minutes"
        side_effects:
          - "status -> COMPLETED_NO_SHOW"
          - "cost_cents booked at 50% of full-visit cost (round_half_up to cents)"
          - "Patient.no_show_strikes += 1"
          - "If strikes >= 3: subsequent RideRequest creation for this patient is rejected (ERR_TRANSPORT_PRIVILEGE_SUSPENDED)"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /senior-care/appointments/{apptId}/cancel"
        actor: FrontDesk
        preconditions:
          - "Appointment is SCHEDULED (ERR_APPOINTMENT_NOT_SCHEDULED)"
          - "Logical clock before start_utc (ERR_CANCEL_TOO_LATE)"
        side_effects:
          - "status -> CANCELLED"
          - "Any linked RideRequest in REQUESTED or DISPATCHED -> CANCELLED; EN_ROUTE rides unaffected"

  - entity: RideRequest
    initial_state: REQUESTED
    terminal_states: [DELIVERED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: DISPATCHED
        trigger: "POST /senior-care/ride-requests/{rideId}/dispatch"
        actor: TransportDispatcher
        preconditions:
          - "Ride is REQUESTED (ERR_RIDE_NOT_REQUESTED)"
          - "vehicle_id in payload exists, belongs to the appointment's center, and is wheelchair_capable if patient requires it (ERR_VEHICLE_INELIGIBLE)"
          - "Vehicle has free seat capacity across all DISPATCHED/EN_ROUTE rides whose pickup windows overlap this ride's pickup window (ERR_VEHICLE_CAPACITY_EXCEEDED)"
          - "Patient.no_show_strikes < 3 (ERR_TRANSPORT_PRIVILEGE_SUSPENDED)"
        side_effects:
          - "status -> DISPATCHED; assigned_vehicle_id set"
      - from: DISPATCHED
        to: EN_ROUTE
        trigger: "POST /senior-care/ride-requests/{rideId}/start-pickup"
        actor: TransportDispatcher
        preconditions:
          - "Ride is DISPATCHED (ERR_RIDE_NOT_DISPATCHED)"
          - "Logical clock within [pickup_window_start, pickup_window_end] (ERR_PICKUP_WINDOW_MISSED)"
        side_effects:
          - "status -> EN_ROUTE"
      - from: DISPATCHED
        to: CANCELLED
        trigger: "system (cascade when the linked appointment is cancelled)"
        actor: system
        preconditions: []
        side_effects:
          - "status -> CANCELLED; no transport cost booked"
      - from: REQUESTED
        to: CANCELLED
        trigger: "system (cascade when the linked appointment is cancelled)"
        actor: system
        preconditions: []
        side_effects:
          - "status -> CANCELLED; no transport cost booked"
      - from: EN_ROUTE
        to: FAILED_NO_SHOW
        trigger: "POST /senior-care/ride-requests/{rideId}/mark-no-show"
        actor: TransportDispatcher
        preconditions:
          - "Ride is EN_ROUTE (ERR_RIDE_NOT_EN_ROUTE)"
        side_effects:
          - "status -> FAILED_NO_SHOW; failure_count += 1"
          - "TRANSPORT cost booked at 100% of ride cost"
      - from: FAILED_NO_SHOW
        to: RECOVERED
        trigger: "POST /senior-care/ride-requests/{rideId}/recover"
        actor: TransportDispatcher
        preconditions:
          - "Ride is FAILED_NO_SHOW (ERR_RIDE_NOT_FAILED)"
          - "Logical clock still before appointment.start_utc + appointment.duration (ERR_RECOVERY_WINDOW_MISSED)"
        side_effects:
          - "status -> RECOVERED then immediately re-enters REQUESTED state with the same id (recovery resets to REQUESTED)"
          - "note: RECOVERED is transient; the observable resting state after recovery is REQUESTED"
      - from: EN_ROUTE
        to: DELIVERED
        trigger: "system (automatic when the linked appointment transitions CHECKED_IN -> COMPLETED)"
        actor: system
        preconditions: []
        side_effects:
          - "status -> DELIVERED"
          - "TRANSPORT cost booked at 100% of ride cost to cost of care"
      - from: DISPATCHED
        to: DELIVERED
        trigger: "system (automatic when the linked appointment transitions CHECKED_IN -> COMPLETED before pickup was started)"
        actor: system
        preconditions: []
        side_effects:
          - "status -> DELIVERED"
          - "TRANSPORT cost booked at 100% of ride cost to cost of care"

  - entity: TriageCase
    initial_state: OPEN
    terminal_states: [RESOLVED_DIVERTED, RESOLVED_ED, RESOLVED_SELF_CARE, EXPIRED]
    transitions:
      - from: OPEN
        to: RESOLVED_DIVERTED
        trigger: "POST /senior-care/triage-cases/{caseId}/divert"
        actor: TriageNurse
        preconditions:
          - "Case is OPEN (ERR_TRIAGE_NOT_OPEN)"
          - "severity != HIGH (ERR_SEVERITY_REQUIRES_ED)"
          - "Payload urgent_appointment_id references a SCHEDULED Appointment of kind PRIMARY within the next 24h of logical clock (ERR_URGENT_SLOT_INVALID)"
        side_effects:
          - "status -> RESOLVED_DIVERTED; disposition = URGENT_CARE_BOOKED"
          - "Linked appointment kind internally flagged as urgent-fill (no state change)"
      - from: OPEN
        to: RESOLVED_ED
        trigger: "POST /senior-care/triage-cases/{caseId}/refer-ed"
        actor: TriageNurse
        preconditions:
          - "Case is OPEN (ERR_TRIAGE_NOT_OPEN)"
        side_effects:
          - "status -> RESOLVED_ED; disposition = ED_REFERRED; diversion_success = false"
          - "Center.ed_referral_count_current_month += 1"
          - "If ed_referral_count_current_month crosses the ED_DIVERSION_FLOOR threshold, center profitability_tier recompute flags a review at next close"
      - from: OPEN
        to: RESOLVED_SELF_CARE
        trigger: "POST /senior-care/triage-cases/{caseId}/advise-self-care"
        actor: TriageNurse
        preconditions:
          - "Case is OPEN (ERR_TRIAGE_NOT_OPEN)"
          - "severity == LOW (ERR_SEVERITY_TOO_HIGH_FOR_SELF_CARE)"
        side_effects:
          - "status -> RESOLVED_SELF_CARE; disposition = SELF_CARE_ADVISED"
      - from: OPEN
        to: EXPIRED
        trigger: "system (OPEN cases older than 24h at nightly sweep)"
        actor: system
        preconditions: []
        side_effects:
          - "status -> EXPIRED; disposition remains null; treated as ED-equivalent failure in diversion-rate calculation"

  - entity: CostOfCareClaim
    initial_state: SUBMITTED
    terminal_states: [SETTLED, REJECTED]
    transitions:
      - from: SUBMITTED
        to: ADJUDICATED
        trigger: "POST /senior-care/cost-claims/{claimId}/adjudicate"
        actor: ClaimsAdjudicator
        preconditions:
          - "Claim is SUBMITTED (ERR_CLAIM_NOT_SUBMITTED)"
          - "Payload adjudicated_amount_cents is 0 <= value <= amount_cents (ERR_ADJUDICATED_AMOUNT_INVALID)"
          - "The MonthlySettlement for the claim's center+service_month is OPEN or CLOSED_PROVISIONAL (ERR_SETTLEMENT_FINALIZED)"
        side_effects:
          - "status -> ADJUDICATED; adjudicated_amount_cents set"
          - "Settlement.total_cost_of_care_cents recomputed"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /senior-care/cost-claims/{claimId}/reject"
        actor: ClaimsAdjudicator
        preconditions:
          - "Claim is SUBMITTED (ERR_CLAIM_NOT_SUBMITTED)"
        side_effects:
          - "status -> REJECTED; adjudicated_amount_cents = 0"
      - from: ADJUDICATED
        to: SETTLED
        trigger: "system (automatic when the settlement for its service_month finalizes)"
        actor: system
        preconditions: []
        side_effects:
          - "status -> SETTLED"

  - entity: MonthlySettlement
    initial_state: OPEN
    terminal_states: [FINALIZED, VOIDED]
    transitions:
      - from: OPEN
        to: CLOSED_PROVISIONAL
        trigger: "POST /senior-care/monthly-settlements/{settlementId}/close-provisional"
        actor: FinanceAnalyst
        preconditions:
          - "Settlement is OPEN (ERR_SETTLEMENT_NOT_OPEN)"
          - "Logical clock is in a later month than period_month (ERR_PERIOD_STILL_OPEN)"
        side_effects:
          - "status -> CLOSED_PROVISIONAL"
          - "accrued_revenue_cents computed with the chronological (actuals) variant of panel_revenue_accrual"
          - "total_cost_of_care_cents and contribution_cents computed"
          - "Center.cumulative_contribution_cents += contribution_cents (provisional posting)"
      - from: CLOSED_PROVISIONAL
        to: FINALIZED
        trigger: "POST /senior-care/monthly-settlements/{settlementId}/finalize"
        actor: FinanceController
        preconditions:
          - "Settlement is CLOSED_PROVISIONAL (ERR_SETTLEMENT_NOT_PROVISIONAL)"
          - "No SUBMITTED claims remain for this center+period (ERR_CLAIMS_STILL_PENDING)"
        side_effects:
          - "status -> FINALIZED"
          - "accrued_revenue_cents recomputed with the forward-looking (proration-reconciled) variant; delta vs provisional applied to Center.cumulative_contribution_cents"
          - "All ADJUDICATED claims for the period -> SETTLED"
          - "Center.maturity_months, panel_fill_ratio, and profitability_tier recomputed (profitability_ramp_tier)"
      - from: OPEN
        to: VOIDED
        trigger: "POST /senior-care/monthly-settlements/{settlementId}/void"
        actor: FinanceController
        preconditions:
          - "Settlement is OPEN (ERR_SETTLEMENT_NOT_OPEN)"
          - "No ADJUDICATED claims reference the period (ERR_CLAIMS_ALREADY_ADJUDICATED)"
        side_effects:
          - "status -> VOIDED"

concurrency_rules:
  - rule_id: attribution-activate-stale-team
    parent_entity: CareTeam
    write_endpoint: "POST /senior-care/patient-attributions/{attrId}/activate"
    occ_field: "expected_care_team_version"
    description: |
      Activating a PatientAttribution against a CareTeam whose version has advanced
      since the client last observed it is rejected. This captures the case where
      another activation or a panel-cap change has just bumped the team (which may
      legitimately have consumed the final headroom under the panel-cap rule) and
      the current writer's view of the team is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: settlement-close-stale-center
    parent_entity: Center
    write_endpoint: "POST /senior-care/monthly-settlements/{settlementId}/close-provisional"
    occ_field: "expected_center_version"
    description: |
      Closing a MonthlySettlement provisionally against a Center whose version has
      advanced since the client last observed it is rejected. This captures the case
      where another settlement posting has just mutated cumulative_contribution_cents
      and the current writer's view of the center ledger is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

calculations:
  - name: panel_revenue_accrual
    trigger: "MonthlySettlement close-provisional (chronological variant) and finalize (forward-looking variant)"
    algorithm: chronological
    formula: |
      member_months_patient(p) = days ACTIVE in period for attribution a of patient p / days_in_period
      base_pmpm(p) = plan.base_pmpm_cents * plan.risk_adjust_factor * patient.risk_score
      accrued_revenue_cents = round_half_up( sum over patients of base_pmpm(p) * member_months_patient(p) * plan.revenue_share_pct )
      Each patient's ACTIVE interval in the period runs from the logical-clock date of the
      PENDING->ACTIVE transition (or period start, whichever is later) through the logical-clock
      date of disenrollment (or period end, whichever is earlier), inclusive of both endpoints.
      Rounding order is pinned: compute each patient's contribution at full precision,
      round each per-patient contribution half-up to whole cents FIRST, then sum.
      (Summing then rounding produces different cents and is NOT the rule.)
    input_set: "PatientAttribution rows with status ACTIVE or DISENROLLED whose ACTIVE interval intersects the period; REATTRIBUTED rows count through their disenrolled_month only"
    constants:
      DAYS_IN_MONTH_LOOKUP: calendar
    precision: "0 decimal places (whole cents), round_half_up per patient then sum"
    variants:
      - name: chronological_actuals
        when: "close-provisional"
        difference: "Full-month convention: any patient ACTIVE at least one day in the period counts member_months_patient(p) = 1; late-arriving claims do not change member months"
      - name: forward_looking_reconciled
        when: "finalize"
        difference: "Day-proration convention: member_months_patient(p) = days ACTIVE in period / days_in_period; produces a delta vs provisional that posts to the center ledger"

  - name: risk_adjusted_pmpm_quote
    trigger: "GET /senior-care/health-plans/{planId}/quote?risk_score="
    algorithm: tiered_pricing
    formula: |
      quote = base_pmpm_cents * clamp(risk_score, 0.50, 4.00) * risk_adjust_factor
      then apply maturity multiplier by the center's profitability_tier at quote time:
        RAMP      -> 0.95x
        BREAKEVEN -> 1.00x
        MATURE    -> 1.05x
      quote_cents = round_half_up(base_pmpm_cents * risk_score * risk_adjust_factor * maturity_multiplier)
      Non-linear: three multiplicative inputs plus a conditional branch on center tier.
    input_set: "HealthPlan + Patient.risk_score + Center.profitability_tier"
    constants:
      TIER_MULTIPLIER_RAMP: 0.95
      TIER_MULTIPLIER_BREAKEVEN: 1.00
      TIER_MULTIPLIER_MATURE: 1.05
    precision: "0 decimal places (whole cents), round_half_up"

  - name: outcome_adjusted_panel_value
    trigger: "monthly close run, after cost_of_care_booking aggregation"
    algorithm: aggregation
    formula: |
      Panel value adjusts revenue by clinical outcomes (different entity domain from the
      ride-cost booking; this calc prices CareTeam performance, not Center cost):
        base_value = accrued_revenue_cents for the center-month
        if ed_diversion_rate >= 0.8000: base_value * 1.05
        elif ed_diversion_rate >= 0.6000: base_value * 1.00
        else: base_value * 0.97
        then + staffing_score_bonus = round_half_up( sum of CareTeam.staffing_score across the center * 150 cents )
        panel_value_cents = round_half_up( base_value * tier_multiplier ) + staffing_score_bonus
      Nested rounding is pinned: tier_multiplier applied and rounded FIRST, staffing bonus
      rounded SECOND, then the two are summed. Reversing the rounding order (sum then round)
      yields different cents and is NOT the rule.
    input_set: "Center month settlement, center's CareTeams, TriageCase resolutions in period"
    constants:
      DIVERSION_BONUS_HIGH: 1.05
      DIVERSION_BONUS_MID: 1.00
      DIVERSION_PENALTY_LOW: 0.97
      STAFFING_SCORE_CENTS: 150
    precision: "0 decimal places (whole cents), round_half_up at each pinned stage"

  - name: cost_of_care_booking
    trigger: "Appointment completion/no-show and ride delivery/failure"
    algorithm: aggregation
    formula: |
      internal_visit_cost_cents = base by kind: PRIMARY 18000, BEHAVIORAL 22000, CHW_OUTREACH 9000
      scaled by duration: duration_minutes/40 as a multiplier (20 -> 0.5, 40 -> 1.0, 60 -> 1.5)
      no-show bookings at 50% of the scaled amount, round_half_up to cents
      ride_cost_cents = 3200 flat per DELIVERED or FAILED_NO_SHOW ride
      Evaluation order is pinned: total_cost_of_care_cents = adjudicated_claims + internal_visit_bookings + transport_bookings;
      contribution_cents = accrued_revenue_cents - total_cost_of_care_cents;
      profitability_tier is THEN derived from contribution — never the reverse.
    input_set: "Appointments in COMPLETED/COMPLETED_NO_SHOW, rides DELIVERED/FAILED_NO_SHOW, claims ADJUDICATED for the period"
    constants:
      COST_PRIMARY: 18000
      COST_BEHAVIORAL: 22000
      COST_CHW: 9000
      RIDE_FLAT_COST: 3200
      NO_SHOW_FACTOR: 0.5
    precision: "0 decimal places (whole cents), round_half_up at each booking line before aggregation"

  - name: profitability_ramp_tier
    trigger: "MonthlySettlement finalize"
    algorithm: threshold
    formula: |
      Tier selection is a three-way branch on (maturity_months, cumulative_contribution_cents,
      panel_fill_ratio) with nested conditionals (non-linear mode (a)):
      if center.maturity_months < 12: tier = RAMP
      elif center.cumulative_contribution_cents < 0: tier = RAMP
      elif center.panel_fill_ratio < 0.7500: tier = BREAKEVEN
      else: tier = MATURE
      Boundaries are inclusive on the lower side: maturity_months == 12 exits RAMP only if
      cumulative_contribution_cents >= 0; panel_fill_ratio == 0.7500 exactly qualifies for MATURE.
      pinned maturity_months rule: whole calendar months elapsed between opened_on and the
      logical clock date (day-of-month ignored — a center opened on 2026-01-15 reaches
      maturity_months == 12 when the clock enters 2027-01).
    input_set: "Center.maturity_months, cumulative_contribution_cents, panel_fill_ratio at finalize time"
    constants:
      RAMP_MONTHS: 12
      MATURE_FILL_RATIO: 0.75
    precision: "tier enum"

  - name: ed_diversion_rate
    trigger: "TriageCase resolution and nightly sweep (EXPIRED)"
    algorithm: aggregation
    formula: |
      diversion_rate = RESOLVED_DIVERTED cases / (RESOLVED_DIVERTED + RESOLVED_ED + EXPIRED) for the center-month
      RESOLVED_SELF_CARE cases are excluded from both numerator and denominator
      Monthly ED-referral floor: if RESOLVED_ED + EXPIRED > ED_DIVERSION_FLOOR, flag profitability review
    input_set: "TriageCase rows for patients attributed to the center, resolved in the period"
    constants:
      ED_DIVERSION_FLOOR: 10
    precision: "4 decimal places, round_half_up"

  - name: vehicle_capacity_overlap
    trigger: "RideRequest dispatch"
    algorithm: interval_merge
    formula: |
      A candidate vehicle is feasible when, for every instant within the new ride's
      pickup window [start,end], concurrent occupied seats (from DISPATCHED/EN_ROUTE rides
      whose pickup windows overlap with a NON-ZERO intersection) + 1 <= seat_capacity.
      Windows touching at exactly one endpoint (end == other.start) do NOT overlap —
      adjacency is free; a 1-minute buffer is NOT applied.
      Half-open interval semantics: [start, end).
    input_set: "RideRequests DISPATCHED or EN_ROUTE on the same vehicle"
    constants: {}
    precision: "boolean"

validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and role declared in §1.7"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Role permitted for this operation per §1.5 roles"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Path resource ids exist, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all resource endpoints"
  - priority: 4
    category: business_constraint
    check: "Request body well-formed; required fields present; enum values legal; numeric ranges honored (risk_score 0.50-4.00, panel_cap >= 1, adjudicated 0..amount)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all mutation endpoints"
  - priority: 5
    category: business_temporal
    check: "Temporal field legality: effective_month >= current logical month; scheduled_on not in past; appointment start on 20-minute boundary; service_month <= current logical month"
    error_id: ERR_TEMPORAL_VIOLATION
    http_status: 422
    applies_to: "creation endpoints with date/month inputs"
  - priority: 6
    category: state
    check: "Target entity in the required state for the transition (e.g., attribution PENDING, claim SUBMITTED, settlement CLOSED_PROVISIONAL)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 7
    category: business_referential
    check: "Cross-references consistent: appointment.patient attributed to appointment.care_team's center; ride appointment exists; triage urgent slot belongs to same center; BEHAVIORAL appointments require room.supports_behavioral == true"
    error_id: ERR_CROSS_REFERENCE_MISMATCH
    http_status: 422
    applies_to: "appointment create, ride create, triage divert"
  - priority: 8
    category: business_temporal
    check: "Resource interval conflicts: room half-open overlap for appointments; vehicle capacity-overlap for ride dispatch"
    error_id: ERR_SCHEDULE_CONFLICT
    http_status: 409
    applies_to: "appointment create, ride dispatch"
  - priority: 9
    category: business_safety
    check: "Clinical safety gates: HIGH severity triage must go to ED; self-care only for LOW; wheelchair patient needs wheelchair_capable vehicle"
    error_id: ERR_SAFETY_GATE_VIOLATION
    http_status: 422
    applies_to: "triage divert/self-care, ride dispatch"
  - priority: 10
    category: business_constraint
    check: "Quota gates: panel_cap headroom, team accepting flag, patient transport privilege (strikes < 3)"
    error_id: ERR_QUOTA_EXCEEDED
    http_status: 409
    applies_to: "attribution activate, ride dispatch"
  - priority: 11
    category: business_fiscal
    check: "Fiscal gates: settlement period closed for new claims; FULL_RISK-only settlement operations; claims adjudicated before finalize"
    error_id: ERR_FISCAL_GATE_VIOLATION
    http_status: 409
    applies_to: "claim submit/adjudicate, settlement close/finalize"

