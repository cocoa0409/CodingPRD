            - call: "POST /carts/${cart_id}/activate"
              payload: {}
              as: Dispatcher
            - call: "POST /service-plans"
              payload: { account_id: "${acct_id}", stream: "TRASH", frequency: "WEEKLY", base_monthly_fee_cents: 1000 }
              as: Dispatcher
              captures: { plan_id: $.data.id }
            - call: "POST /service-plans/${plan_id}/activate"
              payload: {}
              as: Dispatcher
            - call: "POST /accounts/${acct_id}/activate"
              payload: {}
              as: Dispatcher
            - call: "POST /accounts/${acct_id}/special-pickups"
              payload: { kind: "BULK", requested_date: "2026-05-12T00:00:00Z" }
              as: ResidentAccount
              as_user_id: "${acct_id}"
              captures: { sp_a: $.data.id }
            - call: "POST /accounts/${acct_id}/special-pickups"
              payload: { kind: "BULK", requested_date: "2026-05-13T00:00:00Z" }
              as: ResidentAccount
              as_user_id: "${acct_id}"
              captures: { sp_b: $.data.id }
          trigger:
            - call: "POST /special-pickups/${sp_a}/approve"
              payload: {}
              as: Dispatcher
              captures: { fee_a: $.data.quoted_fee_cents }
            - call: "POST /special-pickups/${sp_b}/reject"
              payload: {}
              as: Dispatcher
          assert:
            - "SpecialPickup.${sp_a}.status == APPROVED and SpecialPickup.${sp_a}.quoted_fee_cents == 3500"
            - "SpecialPickup.${sp_b}.status == REJECTED and SpecialPickup.${sp_b}.quoted_fee_cents == 0"

  # =========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: account_close_cascades_carts_and_plans_depth3
        grounds:
          - state_machines.ServiceAccount.ACTIVE_to_CLOSED
          - state_machines.Cart.ACTIVE_to_RETIRED
          - state_machines.ServicePlan.ACTIVE_to_TERMINATED
        distinguishing_aspect: "Depth-3 cascade from account close: closing the account (A) retires its carts (B) and terminates its plans (C); B and C are consequences of A's CLOSED transition, each a distinct downstream entity."
        test_recipe:
          setup:
            - "ACTIVE account with one ACTIVE cart and one ACTIVE plan, no open invoices."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { service_address: "15 Ash St", rate_class: "RESIDENTIAL" }
              as: Dispatcher
              captures: { acct_id: $.data.id }
            - call: "POST /carts"
              payload: { account_id: "${acct_id}", stream: "TRASH", size_gallons: 96 }
              as: Dispatcher
              captures: { cart_id: $.data.id }
            - call: "POST /carts/${cart_id}/activate"
              payload: {}
              as: Dispatcher
            - call: "POST /service-plans"
              payload: { account_id: "${acct_id}", stream: "TRASH", frequency: "WEEKLY", base_monthly_fee_cents: 1000 }
              as: Dispatcher
              captures: { plan_id: $.data.id }
            - call: "POST /service-plans/${plan_id}/activate"
              payload: {}
              as: Dispatcher
            - call: "POST /accounts/${acct_id}/activate"
              payload: {}
              as: Dispatcher
          trigger:
            - call: "POST /accounts/${acct_id}/close"
              payload: {}
              as: Billing
          assert:
            - "ServiceAccount.${acct_id}.status == CLOSED"
            - "Cart.${cart_id}.status == RETIRED"
            - "ServicePlan.${plan_id}.status == TERMINATED"
      - name: route_cancel_cascades_pending_stops_depth2
        grounds:
          - state_machines.Route.DISPATCHED_to_CANCELLED
          - state_machines.Stop.PENDING_to_SKIPPED
          - entities.Stop.fields.status
        distinguishing_aspect: "Depth-2 cascade from a different trigger (route cancel): cancelling a DISPATCHED route (A) skips its PENDING stops (B); B is a consequence of A's CANCELLED transition — a distinct propagation pattern from account-close."
        test_recipe:
          setup:
            - "A DISPATCHED route with two PENDING stops."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { service_address: "17 Fir St", rate_class: "RESIDENTIAL" }
              as: Dispatcher
              captures: { acct_id: $.data.id }
            - call: "POST /routes"
              payload: { service_date: "2026-05-14T00:00:00Z", stream: "TRASH", assigned_driver_id: "drv-6" }
              as: Dispatcher
              captures: { route_id: $.data.id }
            - call: "POST /routes/${route_id}/stops"
              payload: { account_id: "${acct_id}", sequence: 1 }
              as: Dispatcher
              captures: { stop1_id: $.data.id }
            - call: "POST /routes/${route_id}/stops"
              payload: { account_id: "${acct_id}", sequence: 2 }
              as: Dispatcher
              captures: { stop2_id: $.data.id }
            - call: "POST /routes/${route_id}/dispatch"
              payload: {}
              as: Dispatcher
          trigger:
            - call: "POST /routes/${route_id}/cancel"
              payload: {}
              as: Dispatcher
          assert:
            - "Route.${route_id}.status == CANCELLED"
            - "Stop.${stop1_id}.status == SKIPPED"
            - "Stop.${stop2_id}.status == SKIPPED"

  # =========================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_fiscal_on_route_complete
        grounds:
          - validations[priority=8]
          - validations[priority=18]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "state (priority 8, ERR_INVALID_STATE) vs business_constraint (priority 18, ERR_STOPS_PENDING): completing a PLANNED route that also has PENDING stops fails state first — ERR_INVALID_STATE wins, not ERR_STOPS_PENDING."
        test_recipe:
          setup:
            - "A PLANNED route (never dispatched/started) that has one PENDING stop."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { service_address: "19 Holly St", rate_class: "RESIDENTIAL" }
              as: Dispatcher
              captures: { acct_id: $.data.id }
            - call: "POST /routes"
              payload: { service_date: "2026-05-15T00:00:00Z", stream: "TRASH", assigned_driver_id: "drv-7" }
              as: Dispatcher
              captures: { route_id: $.data.id }
            - call: "POST /routes/${route_id}/stops"
              payload: { account_id: "${acct_id}", sequence: 1 }
              as: Dispatcher
          trigger:
            - call: "POST /routes/${route_id}/complete"
              payload: {}
              as: Driver
              captures: { eid: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_INVALID_STATE"
      - name: existence_beats_safety_on_special_approve
        grounds:
          - validations[priority=4]
          - validations[priority=11]
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "existence (priority 4, ERR_NOT_FOUND) vs business_safety (priority 11, ERR_HAZARD_CLASS_REQUIRED): approving a non-existent special-pickup id returns ERR_NOT_FOUND before any hazard-class safety check can run — different error-category pair than instance 1."
        test_recipe:
          setup:
            - "Empty DB (no special pickups created)."
          setup_api_calls: []
          trigger:
            - call: "POST /special-pickups/00000000-0000-0000-0000-000000000000/approve"
              payload: {}
              as: Dispatcher
              captures: { eid: $.data.error_id }
          assert:
            - "response status == 404"
            - "data.error_id == ERR_NOT_FOUND"

  # =========================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: diversion_rate_meets_floor_exactly_no_penalty
        grounds:
          - calculations.diversion_penalty
          - entities.Invoice.fields.diversion_penalty_cents
