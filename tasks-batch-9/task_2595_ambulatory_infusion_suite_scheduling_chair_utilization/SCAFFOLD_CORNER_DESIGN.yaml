            - "All seven cross-patient calls return HTTP 403 with error_id 'ERR_PATIENT_NOT_OWNER': ${e_read_patient}, ${e_read_risk}, ${e_read_visit}, ${e_read_plan}, ${e_read_reminder}, ${e_answer_reminder}, ${e_cancel_visit}"
            - "None of them returns 404 — ${staff_read_mrn} == 'MRN-0002' proves the row exists and is readable by staff"
            - "${own_mrn} == 'MRN-0001' and ${ap1_cancelled} == 'CANCELLED' — the same patient reaches their own record and their own visit"
            - "Appointment.${ap2}.schedule_status == 'TENTATIVE' — the refused cross-patient cancel changed nothing"
            - "ReminderContact.${rc2}.outcome == 'NO_RESPONSE' and sequence_number == 1 — the refused answer was not recorded"
            - "Chair.${ch1}.committed_minutes == 240 — only patient one's 240 minutes were released, patient two's are on a different service_date"
            - "GET /appointments as Scheduler returns 2 rows — the ownership check scopes the Patient role only"

      - name: the_reporting_nurse_cannot_review_or_close_her_own_reaction
        claim_type: segregation_of_duties
        grounds:
          - roles[InfusionNurse].exclusive_operations
          - roles[MedicalDirector].exclusive_operations
          - errors[ERR_UNAUTHORIZED]
          - entities.AdverseEvent.fields.reported_by_nurse_id
        distinguishing_aspect: |
          The reaction workflow is deliberately split: the nurse who was at the chair records
          the event and is stamped into reported_by_nurse_id, and only the MedicalDirector may
          open and close the review that lifts the grade 3 readiness block. Neither half can
          reach the other — the director cannot record a bedside event either — so the two
          steps can never be performed by the same actor no matter which credentials are
          replayed. This is the one place where the peer-role wall is a clinical control
          rather than an ownership boundary.
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z. Standing center, chair, nurse N1 (capacity 6), drug with requires_lab_gate true, 10-unit lot, MID template, one 70 kg patient with an ACTIVE 6-cycle plan."
            - "Cycle 1 on 2026-08-10 at 540 is authorized, confirmed, lab resulted, compounded, checked in and started at 09:00, so the visit is INFUSING."
            - "At 09:40 nurse N1 records a grade 3 reaction with action ABORT, which blocks readiness."
