            - call: "POST /authority-applications/${app70_id}/submit"
              payload: {}
              as: CarrierRep
              as_user_id: "${c70_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /authority-applications/${app70_id}/vetting-review"
              payload: { disposition: "PUBLISH", findings: "no adverse vetting findings" }
              as: VettingAnalyst
              as_user_id: "staff-va-001"
            - call: "GET /operating-authorities"
