      - name: lien_proportional_cap_overflow_waterfall
        claim_type: correct_result
        grounds:
          - calculations.lien_proportional_cap
          - calculations.contingency_fee
          - calculations.net_to_client
        distinguishing_aspect: |
          When total_asserted > distributable_to_liens, lien_proportional_cap
          applies floor(asserted * SHRINK_RATIO) per lien and distributes the
          residual remainder one cent at a time starting from oldest created_at.
          With gross=1_000_000, pre-suit fee=333_300, distributable=666_700, and
          two liens A=400_000 (older) B=600_000 (newer), SHRINK_RATIO=
          666_700/1_000_000=0.6667; floor caps are A=266_680, B=400_020 — sum
          666_700 (no remainder). Each lien receives exactly the floored amount.
        test_recipe:
          setup:
            - "Active CA Case ready to settle at gross=1_000_000 (pre-suit). Two MedicalLiens asserted 400_000 and 600_000 (A older than B)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
