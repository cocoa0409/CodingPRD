  # =========================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: late_cancel_window_exact_12h_is_timely_refund
        grounds:
          - calculations.refund_on_cancel
          - state_machines.Reservation.RESERVED_to_CANCELLED
          - entities.Reservation.fields.drop_in_fee_charged_cents
        distinguishing_aspect: "Numeric threshold boundary on the LATE_CANCEL_WINDOW_HOURS=12 metric via POST /box/reservations/{id}/cancel: hours_before == 12 is timely (refund granted, drop_in_fee_charged_cents -> 0), proving the boundary is >= not >."
        test_recipe:
          setup:
            - "DROP_IN RESERVED reservation (charged 2500) on a session starting 2026-06-10T18:00Z; clock at exactly 2026-06-10T06:00Z (12h before)."
          setup_api_calls:
            - call: "POST /box/coaches"
              payload: { full_name: "Coach B6", email: "cb6@x.com", certified: true }
              as: BoxManager
              captures: { coach_id: $.data.id }
