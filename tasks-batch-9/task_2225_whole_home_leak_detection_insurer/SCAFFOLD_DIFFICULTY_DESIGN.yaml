  - rule_id: non_linear_state_machine
    instances:
      - name: device_parallel_dimensions_independent
        grounds:
          - state_machines.Device.lifecycle_state.ARMED_to_LEARNING
          - state_machines.Device.valve_state.OPEN_to_CLOSED
          - state_machines.Device.monitor_mode.NORMAL_to_SNOOZE
          - state_machines.BaselineProfile.learning_state.COMPLETE_to_INVALIDATED
          - state_machines.BaselineProfile.learning_state.INVALIDATED_to_COLLECTING
          - entities.Device.fields.close_count
        distinguishing_aspect: |
          The Device entity carries THREE independent state dimensions (lifecycle_state, valve_state, monitor_mode) and
          a firmware push that drives lifecycle_state ARMED -> LEARNING -> (re-entry) must leave valve_state CLOSED and
          monitor_mode SNOOZE untouched, proving the dimensions are orthogonal rather than a single linear status; the
          combined state LEARNING + CLOSED + SNOOZE is legal and still accepts telemetry. The other instance of this
          rule is on BaselineProfile, a different entity, and exercises a cycle rather than parallel dimensions.
        test_recipe:
