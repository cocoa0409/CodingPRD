              as: FirmAdmin
              captures: { r1: $.data.id }
            - call: "POST /projects"
              payload: { project_number: "FP-2601", building_name: "Rio Grande Distribution Center", jurisdiction_code: "TX-AUS", jurisdiction_state: "TX", occupancy_type: "STORAGE", building_height_ft: 42.0, underground_lead_in_loss_psi: 5.0, lead_engineer_id: "${e1}", ahj_reviewer_id: "${r1}" }
              as: FirmAdmin
              captures: { p1: $.data.id }
            - call: "POST /hazard-areas"
              payload: { project_id: "${p1}", label: "Rack Storage Bay A", hazard_class: "ORDINARY_2", commodity_class: "CLASS_IV", storage_height_ft: 18.0, ceiling_height_ft: 36.0, area_sqft: 24000.0, sprinkler_system_type: "WET", ceiling_slope_pct: 4.0 }
              as: DesignEngineer
              as_user_id: "${e1}"
              captures: { ha1: $.data.id }
            - call: "POST /hazard-areas"
              payload: { project_id: "${p1}", label: "Backstock Shelf", hazard_class: "ORDINARY_1", commodity_class: "CLASS_II", storage_height_ft: 6.0, ceiling_height_ft: 14.0, area_sqft: 3000.0, sprinkler_system_type: "WET" }
              as: DesignEngineer
              as_user_id: "${e1}"
              captures: { ha_ii: $.data.id }
          trigger:
            - call: "POST /auxiliary-systems"
              payload: { project_id: "${p1}", hazard_area_id: "${ha1}", system_type: "IN_RACK", label: "Rack level 3 in-rack heads", in_rack_head_count: 10 }
              as: DesignEngineer
              as_user_id: "${e1}"
              captures: { aux_ok: $.data.id }
            - call: "POST /auxiliary-systems"
              payload: { project_id: "${p1}", hazard_area_id: "${ha_ii}", system_type: "IN_RACK", label: "Backstock in-rack heads", in_rack_head_count: 10 }
              as: DesignEngineer
              as_user_id: "${e1}"
              captures: { err_mismatch: $.data.error_id }
          assert:
            - "first trigger: HTTP 201 with AuxiliarySystem.${aux_ok}.demand_gpm == 300.0 and interlock_required == false"
            - "second trigger: HTTP 422 with error_id == ERR_IN_RACK_HAZARD_MISMATCH"
            - "Project.${p1}.auxiliary_demand_gpm == 300.0 - the refused row never entered the ledger"
            - "GET /auxiliary-systems?project_id=${p1}&hazard_area_id=${ha_ii} returns total_count == 0"

  # =====================================================================
  # 2 - STATE MACHINES  (claim-extraction-guide, "From Table 2 (State Machines)")
  # =====================================================================
  - section: state_machines
    instances:

      - name: shop_drawing_walks_draft_through_conflicted_to_coordinated
        claim_type: valid_transition
        grounds:
          - state_machines.ShopDrawing.DRAFT_to_IN_COORDINATION
          - state_machines.ShopDrawing.IN_COORDINATION_to_CONFLICTED
          - state_machines.ShopDrawing.CONFLICTED_to_IN_COORDINATION
          - state_machines.ShopDrawing.IN_COORDINATION_to_COORDINATED
          - state_machines.TradeClearance.PENDING_to_CONFLICT_OPEN
          - state_machines.TradeClearance.CONFLICT_OPEN_to_CLEARED
          - entities.ShopDrawing.fields.cleared_trade_count
        distinguishing_aspect: |
          The sheet's state is a pure function of its three clearance rows: opening the first item
          moves DRAFT -> IN_COORDINATION, a BLOCKING conflict drives IN_COORDINATION -> CONFLICTED,
          clearing that same item returns the sheet to IN_COORDINATION with cleared_trade_count 1,
          and only the third CLEARED row (cleared_trade_count == required_trade_count == 3) promotes
          it to COORDINATED. A server that promotes on the second clearance fails the claim.
        test_recipe:
          setup:
            - "Project FP-2601 with hydraulic calculation HC-1 SEALED by Dana Ruiz (QC passed by Priya Nair, RAW_TEST margin exactly 10.00 psi -> ADEQUATE)"
            - "Shop drawing FP-101 raised over HC-1 with three PENDING trade clearances: structural 96-120 in, mechanical 120-144 in, lighting 144-168 in"
          setup_api_calls:
            - call: "POST /engineers"
              payload: { full_name: "Dana Ruiz", license_state: "TX", license_number: "PE-77120", license_status: "ACTIVE" }
              as: FirmAdmin
              captures: { e1: $.data.id }
            - call: "POST /engineers"
              payload: { full_name: "Priya Nair", license_state: "TX", license_number: "PE-80455", license_status: "ACTIVE" }
              as: FirmAdmin
              captures: { e2: $.data.id }
            - call: "POST /ahj-reviewers"
              payload: { full_name: "Marisol Vega", jurisdiction_code: "TX-AUS" }
              as: FirmAdmin
              captures: { r1: $.data.id }
            - call: "POST /projects"
              payload: { project_number: "FP-2601", building_name: "Rio Grande Distribution Center", jurisdiction_code: "TX-AUS", jurisdiction_state: "TX", occupancy_type: "STORAGE", building_height_ft: 42.0, underground_lead_in_loss_psi: 5.0, lead_engineer_id: "${e1}", ahj_reviewer_id: "${r1}" }
              as: FirmAdmin
              captures: { p1: $.data.id }
            - call: "POST /hazard-areas"
              payload: { project_id: "${p1}", label: "Rack Storage Bay A", hazard_class: "ORDINARY_2", commodity_class: "CLASS_IV", storage_height_ft: 18.0, ceiling_height_ft: 36.0, area_sqft: 24000.0, sprinkler_system_type: "WET", ceiling_slope_pct: 4.0 }
              as: DesignEngineer
              as_user_id: "${e1}"
              captures: { ha1: $.data.id }
            - call: "POST /auxiliary-systems"
              payload: { project_id: "${p1}", system_type: "STANDPIPE_CLASS_I", label: "Stair 1 and 2 standpipes", riser_count: 2 }
              as: DesignEngineer
              as_user_id: "${e1}"
              captures: { aux1: $.data.id }
            - call: "POST /hydraulic-calculations"
              payload: { project_id: "${p1}", hazard_area_id: "${ha1}", method: "AREA_DENSITY", k_factor: 25.2 }
              as: DesignEngineer
              as_user_id: "${e1}"
              captures: { hc1: $.data.id }
            - call: "POST /hydraulic-calculations/${hc1}/iterations"
              payload: { iteration_index: 1, pipe_size_in: "2", length_ft: 150.0, fitting_equivalent_ft: 40.0, flow_gpm: 110.0, elevation_change_ft: 0.0 }
              as: DesignEngineer
              as_user_id: "${e1}"
            - call: "POST /hydraulic-calculations/${hc1}/iterations"
              payload: { iteration_index: 2, pipe_size_in: "4", length_ft: 90.0, fitting_equivalent_ft: 5.0, flow_gpm: 420.0, elevation_change_ft: 0.0 }
              as: DesignEngineer
              as_user_id: "${e1}"
            - call: "POST /flow-tests"
              payload: { project_id: "${p1}", hydrant_tag: "H-14", static_psi: 80.0, residual_psi: 64.0, flow_gpm: 2250.0, tested_at: "2026-05-14T15:00:00Z" }
              as: DesignEngineer
              as_user_id: "${e1}"
              captures: { ft1: $.data.id }
            - call: "POST /water-supply-evaluations"
              payload: { project_id: "${p1}", flow_test_id: "${ft1}", governing_hydraulic_calculation_id: "${hc1}", evaluation_basis: "RAW_TEST" }
              as: DesignEngineer
              as_user_id: "${e1}"
              captures: { wse_prelim: $.data.id }
            - call: "POST /hydraulic-calculations/${hc1}/iterations"
              payload: { iteration_index: 3, pipe_size_in: "6", length_ft: 60.0, fitting_equivalent_ft: 5.0, flow_gpm: 880.0, elevation_change_ft: 8.0, is_supply_connection: true }
              as: DesignEngineer
              as_user_id: "${e1}"
            - call: "POST /water-supply-evaluations"
              payload: { project_id: "${p1}", flow_test_id: "${ft1}", governing_hydraulic_calculation_id: "${hc1}", evaluation_basis: "RAW_TEST" }
              as: DesignEngineer
              as_user_id: "${e1}"
              captures: { wse_raw: $.data.id }
            - call: "POST /hydraulic-calculations/${hc1}/qc-review"
              payload: { disposition: "PASS", review_note: "Independent QC check complete" }
              as: QcReviewer
              as_user_id: "${e2}"
            - call: "POST /hydraulic-calculations/${hc1}/seal"
              payload: {}
              as: DesignEngineer
              as_user_id: "${e1}"
            - call: "POST /shop-drawings"
              payload: { project_id: "${p1}", hydraulic_calculation_id: "${hc1}", sheet_number: "FP-101" }
              as: Contractor
              captures: { sd1: $.data.id }
            - call: "POST /shop-drawings/${sd1}/trade-clearances"
              payload: { trade: "STRUCTURAL", elevation_low_in: 96.0, elevation_high_in: 120.0 }
              as: Contractor
              captures: { tc1: $.data.id }
            - call: "POST /shop-drawings/${sd1}/trade-clearances"
              payload: { trade: "MECHANICAL", elevation_low_in: 120.0, elevation_high_in: 144.0 }
              as: Contractor
              captures: { tc2: $.data.id }
            - call: "POST /shop-drawings/${sd1}/trade-clearances"
              payload: { trade: "LIGHTING", elevation_low_in: 144.0, elevation_high_in: 168.0 }
              as: Contractor
              captures: { tc3: $.data.id }
          trigger:
            - call: "POST /trade-clearances/${tc1}/record"
              payload: { outcome: "CONFLICT_OPEN", conflict_severity: "BLOCKING", note: "Sprinkler main clashes with the beam flange" }
              as: DesignEngineer
              as_user_id: "${e1}"
            - call: "POST /trade-clearances/${tc1}/record"
              payload: { outcome: "CLEARED", conflict_severity: "Main re-routed below the beam", note: "Coordinated in the field" }
              as: DesignEngineer
              as_user_id: "${e1}"
            - call: "POST /trade-clearances/${tc2}/record"
              payload: { outcome: "CLEARED", note: "Coordinated in the field" }
              as: DesignEngineer
              as_user_id: "${e1}"
            - call: "POST /trade-clearances/${tc3}/record"
              payload: { outcome: "CLEARED", note: "Coordinated in the field" }
              as: DesignEngineer
              as_user_id: "${e1}"
          assert:
            - "after the ShopDrawing create: ShopDrawing.${sd1}.state == DRAFT, required_trade_count == 3, cleared_trade_count == 0"
            - "after the first TradeClearance create: ShopDrawing.${sd1}.state == IN_COORDINATION"
            - "after trigger 1: TradeClearance.${tc1}.state == CONFLICT_OPEN, conflict_severity == BLOCKING, ShopDrawing.${sd1}.state == CONFLICTED, cleared_trade_count == 0"
            - "after trigger 2: TradeClearance.${tc1}.state == CLEARED, ShopDrawing.${sd1}.state == IN_COORDINATION, cleared_trade_count == 1"
            - "after trigger 3: ShopDrawing.${sd1}.cleared_trade_count == 2 and state == IN_COORDINATION"
            - "after trigger 4: ShopDrawing.${sd1}.cleared_trade_count == 3 and state == COORDINATED"
            - "GET /shop-drawings/${sd1}/trade-clearances?state=CLEARED returns total_count == 3"

