  - rule_id: transitive_cascade
    instances:

      - name: event_cancel_voids_orders_then_attendees_then_releases_seats
        grounds:
          - state_machines.Event.ONSALE_to_CANCELLED
          - entities.SeatBlock.fields.seats_taken
          - entities.TicketType.fields.sold_count
          - entities.RefundRequest.fields.policy
        distinguishing_aspect: |
          Depth-4 cascade triggered by POST /api/events/{id}/cancel: Event CANCELLED causes the
          Order to go VOIDED/REFUND_PENDING, which causes its Attendees to go VOIDED, which
          causes SeatBlock.seats_taken 2 -> 0 and TicketType.sold_count 2 -> 0, and the
          REFUND_PENDING order in turn causes an auto-created APPROVED FEE_INCLUDED
          RefundRequest of 10728 cents. Each hop is caused by the previous hop, not by the
          original call.
        test_recipe:
          setup:
            - "ONSALE Event E (fee_mode PASS_ON) has a RESERVED TicketType T price 5000 quantity_total 10 with SeatBlock SB row A covering seats 1..10."
            - "Buyer B has one PAID Order holding seats 3 and 4: subtotal 10000, fee_total 728, buyer_total 10728."
            - "Before the trigger SeatBlock.seats_taken == 2 and TicketType.sold_count == 2."
            - "Logical clock at 2026-07-05T10:00:00Z."
          setup_api_calls:
            - call: "POST /api/organizers"
              payload: { display_name: "Cascade Hall Co", contact_email: "ops@cascadehall.example" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { org_id: $.data.id }
