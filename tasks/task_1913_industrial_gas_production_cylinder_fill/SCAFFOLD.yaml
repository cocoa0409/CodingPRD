    roles: [LogisticsCoordinator]
    code: 200
    input: [driver_id]
    output: DeliveryRoute
    side_effects: ["PLANNED -> DRIVER_ASSIGNED per state machine (safety and temporal validations); increments DeliveryRoute.version by 1"]
  - method: POST
    path: "/api/routes/{routeId}/dispatch"
    description: "Dispatch an assigned route; revalidates certs against the current clock"
    roles: [LogisticsCoordinator]
    code: 200
    input: []
    output: DeliveryRoute
    side_effects: ["DRIVER_ASSIGNED -> DISPATCHED; increments DeliveryRoute.version by 1"]
  - method: POST
    path: "/api/routes/{routeId}/set-status"
    description: "Complete (Coordinator or the assigned Driver) or cancel (Coordinator only)"
    roles: [LogisticsCoordinator, Driver]
    code: 200
    input: [target_status]
    output: DeliveryRoute
    side_effects: ["DISPATCHED -> COMPLETED, or PLANNED/DRIVER_ASSIGNED/DISPATCHED -> CANCELLED; increments DeliveryRoute.version by 1"]

  # --- BulkInstallation ---
  - method: POST
    path: "/api/bulk-installations"
    description: "Propose a customer-site bulk tank; seeds an INITIAL_LOAD telemetry reading"
    roles: [PlantManager]
    code: 201
    input: [customer_id, product_code, capacity_liters, initial_level_liters, reorder_point_liters, max_order_qty_liters]
    output: BulkInstallation
    side_effects:
      - "Creates TelemetryReading(source INITIAL_LOAD, measured_at = clock)"
      - "status = PROPOSED"
  - method: GET
    path: "/api/bulk-installations"
    description: "List installations with filters"
    roles: [PlantManager, ProductionOperator, LabAnalyst, QualityManager, LogisticsCoordinator, BillingClerk, Driver]
    code: 200
    input: ["limit?", "offset?", "customer_id?", "status?"]
    output: "BulkInstallation[]"
    side_effects: []
  - method: GET
    path: "/api/bulk-installations/{installationId}"
    description: "Get one installation"
    roles: [PlantManager, ProductionOperator, LabAnalyst, QualityManager, LogisticsCoordinator, BillingClerk, Driver]
    code: 200
    input: []
    output: BulkInstallation
    side_effects: []
  - method: POST
    path: "/api/bulk-installations/{installationId}/set-status"
    description: "PROPOSED -> INSTALLED -> ACTIVE <-> PAUSED -> DECOMMISSIONED"
    roles: [PlantManager]
    code: 200
    input: [target_status]
    output: BulkInstallation
    side_effects: ["Installation transition per state machine; decommission cancels PENDING replenishment orders; increments BulkInstallation.version by 1"]

  # --- ReplenishmentOrder ---
  - method: POST
    path: "/api/replenishment-orders"
    description: "Create a replenishment order under installation OCC; supersedes any PENDING order"
    roles: [LogisticsCoordinator]
    code: 201
    input: [installation_id, scheduled_delivery_at, expected_installation_version]
    output: ReplenishmentOrder
    side_effects:
      - "OCC: expected_installation_version must equal the installation's current version (else ERR_STALE_VERSION 412)"
      - "Installation must be ACTIVE (ERR_INSTALLATION_INVALID_STATE); gap rule per replenishment_order_qty constants (ERR_REPLENISHMENT_WINDOW_CONFLICT)"
      - "requested_qty_liters = min(capacity - current_level, 20000, max_order_qty_liters); <= 0 -> ERR_INVALID_REQUEST"
      - "Existing PENDING order on the installation -> SUPERSEDED with superseded_by_order_id set"
      - "Increments BulkInstallation.version by 1"
  - method: GET
    path: "/api/replenishment-orders"
    description: "List replenishment orders with filters"
    roles: [PlantManager, ProductionOperator, LabAnalyst, QualityManager, LogisticsCoordinator, BillingClerk, Driver]
    code: 200
    input: ["limit?", "offset?", "installation_id?", "status?"]
    output: "ReplenishmentOrder[]"
    side_effects: []
  - method: GET
    path: "/api/replenishment-orders/{orderId}"
    description: "Get one replenishment order"
    roles: [PlantManager, ProductionOperator, LabAnalyst, QualityManager, LogisticsCoordinator, BillingClerk, Driver]
    code: 200
    input: []
    output: ReplenishmentOrder
    side_effects: []
  - method: POST
    path: "/api/replenishment-orders/{orderId}/set-status"
    description: "DELIVERED posts a SYSTEM_REPLENISHMENT telemetry reading; CANCELLED stops the order"
    roles: [LogisticsCoordinator]
    code: 200
    input: [target_status]
    output: ReplenishmentOrder
    side_effects:
      - "DELIVERED: delivered_at = clock; system TelemetryReading on the installation at current_level + requested_qty (capped at capacity), measured_at = delivered_at; current_level recomputes"
      - "Increments ReplenishmentOrder.version and BulkInstallation.version by 1"

  # --- BlendOrder ---
  - method: POST
    path: "/api/blend-orders"
    description: "Quote a custom gas mixture; computes cost, fee, and total at creation"
    roles: [BillingClerk]
    code: 201
    input: [customer_id, batch_qty_liters, components]
    output: BlendOrder
    side_effects:
      - "Customer must be ACTIVE (ERR_ACCOUNT_NOT_ACTIVE); composition validated (ERR_BLEND_COMPONENT_SUM_INVALID)"
      - "component_cost_cents, service_fee_cents, total_price_cents computed per blend_price_quote (pinned evaluation order)"
      - "status = DRAFT"
  - method: GET
    path: "/api/blend-orders"
    description: "List blend orders with filters"
    roles: [PlantManager, ProductionOperator, LabAnalyst, QualityManager, LogisticsCoordinator, BillingClerk, Driver]
    code: 200
    input: ["limit?", "offset?", "customer_id?", "status?"]
    output: "BlendOrder[]"
    side_effects: []
  - method: GET
    path: "/api/blend-orders/{blendOrderId}"
    description: "Get one blend order"
    roles: [PlantManager, ProductionOperator, LabAnalyst, QualityManager, LogisticsCoordinator, BillingClerk, Driver]
    code: 200
    input: []
    output: BlendOrder
    side_effects: []
  - method: POST
    path: "/api/blend-orders/{blendOrderId}/approve"
    description: "Quality approval of a quoted blend"
    roles: [QualityManager]
    code: 200
    input: []
    output: BlendOrder
    side_effects: ["DRAFT -> APPROVED; increments BlendOrder.version by 1"]
  - method: POST
    path: "/api/blend-orders/{blendOrderId}/start-blend"
    description: "Start blending; server selects source tanks per component"
    roles: [ProductionOperator]
    code: 200
    input: []
    output: BlendOrder
    side_effects: ["APPROVED|REWORK -> BLENDING; tank selector per component stamped onto components; increments BlendOrder.version by 1"]
  - method: POST
    path: "/api/blend-orders/{blendOrderId}/complete-blend"
    description: "Complete blending; draws component quantities from the selected tanks"
    roles: [ProductionOperator]
    code: 200
    input: []
    output: BlendOrder
    side_effects: ["BLENDING -> AWAITING_ANALYSIS; tank draws per state machine; blended_by_user_id = X-User-ID; increments BlendOrder.version and tank versions"]

  # --- BillingRun ---
  - method: POST
    path: "/api/billing-runs"
    description: "Open a billing run for a period"
    roles: [BillingClerk]
    code: 201
    input: [period_start, period_end]
    output: BillingRun
    side_effects: ["status = DRAFT"]
  - method: GET
    path: "/api/billing-runs"
    description: "List billing runs"
    roles: [PlantManager, ProductionOperator, LabAnalyst, QualityManager, LogisticsCoordinator, BillingClerk, Driver]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "BillingRun[]"
    side_effects: []
  - method: GET
    path: "/api/billing-runs/{billingRunId}"
    description: "Get one billing run"
    roles: [PlantManager, ProductionOperator, LabAnalyst, QualityManager, LogisticsCoordinator, BillingClerk, Driver]
    code: 200
    input: []
    output: BillingRun
    side_effects: []
  - method: POST
    path: "/api/billing-runs/{billingRunId}/finalize"
    description: "Sweep overdue rentals and compute per-line demurrage charges"
    roles: [BillingClerk]
    code: 200
    input: []
    output: BillingRun
    side_effects: ["DRAFT -> FINALIZED; overdue sweep + charge_lines computation per state machine"]
  - method: POST
    path: "/api/billing-runs/{billingRunId}/post"
