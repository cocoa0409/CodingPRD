            - { call: "POST /fair-lending/corrective-action-plans/${cap1}/extend", payload: { new_due_date: "2026-05-01" }, as: ComplianceDirector, captures: { err: $.data.error_id } }
            - { call: "POST /fair-lending/corrective-action-plans/${cap1}/extend", payload: { new_due_date: "2026-09-30" }, as: ComplianceDirector, captures: { cap_status: $.data.status, cap_due: $.data.due_date } }
          assert:
            - "on due_date 2026-06-30 itself: overdue_cap_ids == [] (due_date strictly-before rule)"
            - "on 2026-07-01: overdue_cap_ids contains ${cap1}; CAP -> OVERDUE"
            - "extend with 2026-05-01 (before current logical date) -> 400 ERR_INVALID_REQUEST"
            - "extend with 2026-09-30 -> EXECUTING, due_date == 2026-09-30"

      - name: cap_director_threshold_equality
        claim_type: rate_threshold_triggers
        grounds:
          - "state_machines.CorrectiveActionPlan.SUBMITTED_to_EXECUTING"
          - "errors[ERR_DIRECTOR_APPROVAL_REQUIRED]"
        distinguishing_aspect: "Approval authority threshold is >= : pool 24999999 approves under FairLendingOfficer, pool exactly 25000000 demands ComplianceDirector (403 ERR_DIRECTOR_APPROVAL_REQUIRED for the officer; director succeeds)."
        test_recipe:
          setup: ["run R COMPUTED; findings F1 (harmed [p1]) and F2 (harmed [p2]) both SUBSTANTIATED; CAP1 pool 24999999 SUBMITTED; CAP2 pool 25000000 SUBMITTED"]
          setup_api_calls:
            - { call: "POST /fair-lending/markets", payload: { name: "Metro One", msa_code: "M001", protected_group_population_share: 0.40, peer_group_code: "PG7" }, as: BankAdmin, captures: { m1: $.data.id } }
            - { call: "POST /fair-lending/branches", payload: { market_id: "${m1}", name: "Main", tract_minority_pct: 55.0, opened_on: "2020-01-15" }, as: BankAdmin, captures: { b1: $.data.id } }
            - { call: "POST /fair-lending/loan-officers", payload: { branch_id: "${b1}", full_name: "Officer One" }, as: BankAdmin, captures: { o1: $.data.id } }
            - { call: "POST /fair-lending/applications", payload: { market_id: "${m1}", branch_id: "${b1}", loan_officer_id: "${o1}", product_type: CONVENTIONAL, applicant_group: CONTROL, outcome: ORIGINATED, note_rate_bps: 700, loan_amount_cents: 30000000, credit_score: 720, dti_pct: 36.0, application_date: "2026-01-05", decision_date: "2026-01-20" }, as: LendingDataOps, captures: { c1: $.data.id } }
            - { call: "POST /fair-lending/applications", payload: { market_id: "${m1}", branch_id: "${b1}", loan_officer_id: "${o1}", product_type: CONVENTIONAL, applicant_group: PROTECTED_1, outcome: ORIGINATED, note_rate_bps: 700, loan_amount_cents: 30000000, credit_score: 715, dti_pct: 36.0, application_date: "2026-02-01", decision_date: "2026-02-10" }, as: LendingDataOps, captures: { p1: $.data.id } }
            - { call: "POST /fair-lending/applications", payload: { market_id: "${m1}", branch_id: "${b1}", loan_officer_id: "${o1}", product_type: CONVENTIONAL, applicant_group: PROTECTED_1, outcome: ORIGINATED, note_rate_bps: 700, loan_amount_cents: 30000000, credit_score: 716, dti_pct: 36.0, application_date: "2026-02-02", decision_date: "2026-02-11" }, as: LendingDataOps, captures: { p2: $.data.id } }
            - { call: "POST /fair-lending/applications/${c1}/validate", payload: {}, as: LendingDataOps }
            - { call: "POST /fair-lending/applications/${p1}/validate", payload: {}, as: LendingDataOps }
            - { call: "POST /fair-lending/applications/${p2}/validate", payload: {}, as: LendingDataOps }
            - { call: "POST /fair-lending/analysis-runs", payload: { market_id: "${m1}", product_type: CONVENTIONAL, prohibited_basis: RACE, period_start: "2026-01-01", period_end: "2026-04-01" }, as: FairLendingAnalyst, captures: { r1: $.data.id } }
            - { call: "POST /fair-lending/analysis-runs/${r1}/lock", payload: {}, as: FairLendingAnalyst }
            - { call: "POST /fair-lending/analysis-runs/${r1}/compute", payload: {}, as: FairLendingAnalyst }
            - { call: "POST /fair-lending/findings", payload: { analysis_run_id: "${r1}", kind: PRICING_DISPARITY, notes: "f1" }, as: FairLendingAnalyst, as_user_id: "analyst-creator", captures: { f1: $.data.id } }
            - { call: "POST /fair-lending/findings", payload: { analysis_run_id: "${r1}", kind: PRICING_DISPARITY, notes: "f2" }, as: FairLendingAnalyst, as_user_id: "analyst-creator", captures: { f2: $.data.id } }
            - { call: "POST /fair-lending/findings/${f1}/begin-review", payload: {}, as: FairLendingAnalyst }
            - { call: "POST /fair-lending/findings/${f2}/begin-review", payload: {}, as: FairLendingAnalyst }
            - { call: "POST /fair-lending/findings/${f1}/substantiate", payload: { harmed_application_ids: ["${p1}"] }, as: FairLendingOfficer, as_user_id: "officer-sub", captures: { f1_v: $.data.version } }
            - { call: "POST /fair-lending/findings/${f2}/substantiate", payload: { harmed_application_ids: ["${p2}"] }, as: FairLendingOfficer, as_user_id: "officer-sub", captures: { f2_v: $.data.version } }
            - { call: "POST /fair-lending/corrective-action-plans", payload: { finding_id: "${f1}", title: "small pool", pool_cents: 24999999, due_date: "2026-06-30", expected_finding_version: "${f1_v}" }, as: FairLendingAnalyst, captures: { cap1: $.data.id } }
            - { call: "POST /fair-lending/corrective-action-plans", payload: { finding_id: "${f2}", title: "threshold pool", pool_cents: 25000000, due_date: "2026-06-30", expected_finding_version: "${f2_v}" }, as: FairLendingAnalyst, captures: { cap2: $.data.id } }
            - { call: "POST /fair-lending/corrective-action-plans/${cap1}/submit", payload: {}, as: FairLendingAnalyst }
            - { call: "POST /fair-lending/corrective-action-plans/${cap2}/submit", payload: {}, as: FairLendingAnalyst }
          trigger:
            - { call: "POST /fair-lending/corrective-action-plans/${cap1}/approve", payload: {}, as: FairLendingOfficer, as_user_id: "officer-1", captures: { cap1_status: $.data.status } }
            - { call: "POST /fair-lending/corrective-action-plans/${cap2}/approve", payload: {}, as: FairLendingOfficer, as_user_id: "officer-1", captures: { err: $.data.error_id } }
            - { call: "POST /fair-lending/corrective-action-plans/${cap2}/approve", payload: {}, as: ComplianceDirector, as_user_id: "director-3", captures: { cap2_status: $.data.status } }
          assert:
            - "pool 24999999 (< threshold): FairLendingOfficer approve -> EXECUTING"
            - "pool exactly 25000000 (>= threshold): FairLendingOfficer approve -> 403 ERR_DIRECTOR_APPROVAL_REQUIRED"
            - "same CAP by ComplianceDirector -> EXECUTING (payment generated: 25000000 on p2)"

      - name: cascade_coverage_covered
        claim_type: cascading_side_effects
        grounds:
          - "complexity_profile.complexity_layers"
        excluded_because:
          difficulty_instance: disburse_to_cap_complete_to_finding_close_to_run_rollup
          rationale: "N-level cascade end-to-end and ordering are asserted by the two named §1.8 transitive_cascade instances."

      - name: dual_variant_coverage_covered
        claim_type: dual_variant_calculation
        grounds:
          - "complexity_profile.complexity_layers"
        excluded_because:
          difficulty_instance: denial_ratio_net_vs_raw_divergence
          rationale: "Both variants and their divergence are asserted by the two named §1.8 dual_variant_calc instances."

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_consistency_read_after_write
        claim_type: immediate
        grounds:
          - "complexity_profile.consistency_model"
        distinguishing_aspect: "Immediate consistency: the approve response body already shows APPROVED with decided fields set, a follow-up GET of the exception and of the application's has_exception agree, and the officer scorecard reflects approved_exception_count == 1 in the same read."
        test_recipe:
          setup: ["officer O1 ACTIVE; VALIDATED app a1; exception e1 REQUESTED"]
          setup_api_calls:
            - { call: "POST /fair-lending/markets", payload: { name: "Metro One", msa_code: "M001", protected_group_population_share: 0.40, peer_group_code: "PG7" }, as: BankAdmin, captures: { m1: $.data.id } }
            - { call: "POST /fair-lending/branches", payload: { market_id: "${m1}", name: "Main", tract_minority_pct: 55.0, opened_on: "2020-01-15" }, as: BankAdmin, captures: { b1: $.data.id } }
            - { call: "POST /fair-lending/loan-officers", payload: { branch_id: "${b1}", full_name: "Officer One" }, as: BankAdmin, captures: { o1: $.data.id } }
            - { call: "POST /fair-lending/applications", payload: { market_id: "${m1}", branch_id: "${b1}", loan_officer_id: "${o1}", product_type: CONVENTIONAL, applicant_group: CONTROL, outcome: ORIGINATED, note_rate_bps: 700, loan_amount_cents: 30000000, credit_score: 720, dti_pct: 36.0, application_date: "2026-01-05", decision_date: "2026-01-20" }, as: LendingDataOps, captures: { a1: $.data.id } }
            - { call: "POST /fair-lending/applications/${a1}/validate", payload: {}, as: LendingDataOps }
            - { call: "POST /fair-lending/pricing-exceptions", payload: { application_id: "${a1}", kind: FEE_WAIVER, requested_rate_bps: 700, justification: "fee" }, as: LoanOfficer, as_user_id: "${o1}", captures: { e1: $.data.id } }
          trigger:
            - { call: "POST /fair-lending/pricing-exceptions/${e1}/approve", payload: {}, as: FairLendingOfficer, captures: { e_status: $.data.status, e_decider: $.data.decided_by_user_id } }
            - { call: "GET /fair-lending/pricing-exceptions/${e1}", payload: {}, as: FairLendingOfficer, captures: { e_get: $.data.status } }
            - { call: "GET /fair-lending/applications/${a1}", payload: {}, as: FairLendingOfficer, captures: { a_exc: $.data.has_exception } }
            - { call: "GET /fair-lending/loan-officers/${o1}/risk-scorecard", payload: {}, as: FairLendingOfficer, captures: { exc_cnt: $.data.approved_exception_count } }
          assert:
            - "approve response: status == APPROVED, decided_by_user_id non-null (visible in the same request)"
            - "GET exception: status == APPROVED; GET application: has_exception == APPROVED"
            - "scorecard immediately shows approved_exception_count == 1 (no reconciliation lag)"
