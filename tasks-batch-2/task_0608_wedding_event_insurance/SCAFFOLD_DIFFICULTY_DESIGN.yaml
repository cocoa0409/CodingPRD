            - call: "POST /policies/${policy_id}/bind"
              payload: {}
              as: UnderwritingAgent
            - call: "POST /policies/${policy_id}/pay"
              payload: { amount_cents: 45000 }
              as: Policyholder
              as_user_id: "ph-1"
            - call: "POST /policies/${policy_id}/activate-coverage"
              payload: {}
