              as: ModelApprover
              as_user_id: "u_appr_1"
              captures: { sod_err: $.data.error_id }
            - call: "POST /revalidation-tasks/${task_id}/disposition"
              payload: { action: "START_REVIEW" }
              as: PlatformAdmin
              as_user_id: "u_appr_1"
              captures: { sod_err_admin: $.data.error_id }
            - call: "POST /revalidation-tasks/${task_id}/disposition"
              payload: { action: "START_REVIEW" }
              as: ModelApprover
              as_user_id: "u_appr_2"
              captures: { task_state: $.data.status, task_reviewer: $.data.reviewer_user_id }
            - call: "POST /revalidation-tasks/${task_id}/disposition"
              payload: { action: "PASS", findings: "metrics stable, documentation current" }
