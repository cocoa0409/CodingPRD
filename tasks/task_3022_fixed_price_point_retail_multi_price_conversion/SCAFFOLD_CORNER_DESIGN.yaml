              payload: { store_id: "${store_id}", price_point_id: "${pp125_id}", audited_at: "2026-09-03T00:00:00Z", observed_item_count: 80, mismatched_item_count: 5 }
              as: StoreOperationsManager
              captures: { audit_id: $.data.id }
          trigger:
            - call: "POST /merchandise/price-integrity-audits/${audit_id}/resolve"
              payload: {}
              as: StoreOperationsManager
            - call: "POST /merchandise/price-integrity-audits/${audit_id}/resolve"
              payload: {}
              as: StoreOperationsManager
              captures: { err: $.data.error_id }
          assert:
            - "the first resolve returns 200 and PriceIntegrityAudit.${audit_id}.status == RESOLVED"
            - "the second resolve returns 409 and err == ERR_AUDIT_ALREADY_RESOLVED"
            - "PriceIntegrityAudit.${audit_id}.result == VIOLATION is unchanged — resolution does not launder the verdict"
            - "Store.${store_id}.open_violation_count == 0 and Store.${store_id}.price_integrity_audit_count == 1"

      - name: land_side_gate_rejects_pass_through_before_receipt
        claim_type: Precondition Enforcement
        grounds:
