      - name: drill_ratio_ignores_deficient_duplicate_stale_and_foreign_drills
        claim_type: input_set_filtering
        grounds:
          - calculations.drill_compliance_ratio
          - endpoints["GET /practices/{practiceId}/compliance-summary"]
        distinguishing_aspect: "Four different exclusions are exercised against one MODERATE_SEDATION requirement set: a deficient drill, a duplicate of an already-covered type, a drill older than the 365-day window, and a drill type the level does not require. Only two of the four required types end up covered, so the ratio is 0.50 - a row count would have said 5 of 4."
        test_recipe:
          setup:
            - "logical clock 2026-09-01T10:00:00Z, so the trailing window opens at 2025-09-01T10:00:00Z"
            - "MODERATE_SEDATION permit requiring AIRWAY_OBSTRUCTION, LARYNGOSPASM, LOCAL_ANESTHETIC_TOXICITY, CARDIAC_ARREST"
