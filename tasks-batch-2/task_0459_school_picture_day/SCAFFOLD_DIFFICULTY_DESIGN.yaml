            - call: "POST /api/picture-day-sessions/${sess}/open-gallery"
              payload: {}
              as: SchoolCoordinator
          trigger:
            - call: "POST /api/photos/${ph}/match"
              payload: {}
              as: StudioPhotographer
              captures: { err: $.data.error_id }
          assert:
            - "match returns ERR_SESSION_NOT_CAPTURING (state, priority 7), HTTP 409"
            - "It does NOT return ERR_NO_MATCH_CANDIDATE (safety, priority 10) even though no candidate would match"

