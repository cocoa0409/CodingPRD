          Pair state (P5) vs business_safety (P6): completing a work order that
          is NOT SCHEDULED and also lacks verified ADAS calibration must yield
          ERR_WORK_ORDER_NOT_SCHEDULED (state, priority 5), never
          ERR_CALIBRATION_NOT_VERIFIED (safety, priority 6).
        test_recipe:
          setup:
            - "FL regulation; policyholder + COMPREHENSIVE policy; ADAS-certified shop serving 336"
            - "Claim requires_adas_calibration=true, routed, work order ACCEPTED but never SCHEDULED, no calibration event exists"
