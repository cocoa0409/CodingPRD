      - name: layer_rental_unit_version_increments_on_every_write_that_touches_it
        claim_type: optimistic_concurrency
        grounds:
          - "complexity_profile.complexity_layers.optimistic_concurrency"
          - "entities.RentalUnit.common_fields"
          - "state_machines.RentalUnit.transitions.IN_STOCK_to_RESERVED"
          - "state_machines.RentalUnit.transitions.RESERVED_to_IN_STOCK"
        distinguishing_aspect: >-
          version is the OCC token other endpoints compare against, so it must advance on writes the client never
          addressed directly: the unit is created at 1, an allocation driven by POST /reservations makes it 2, and
          the compensating release makes it 3 — it never rolls back to 1 when the state returns to IN_STOCK. An
          implementation that only bumps version on direct writes to /rental-units leaves it at 1 for all three
          reads.
        test_recipe:
          setup:
            - "logical clock parked at 2026-08-03T09:00:00Z by the PlatformAdmin clock endpoint"
            - "membership plan SIG4: item_slots 3, monthly_fee_cents 10000, monthly_swaps_allowed 2, shipping_cadence_days 7, waiver_monthly_fee_cents 1800, waiver_coverage_cents 10000"
            - "two ACTIVE technicians T-INSP-1 and T-REP-2, both repair_certified and photography_certified"
            - "style AUR-GOWN-01: GOWN, retail_price_cents 48000, acquisition_cost_cents 21000, size_run [S, M, L], expected_rental_turns_per_unit 12, planned_eol_value_cents 9000, forecast_monthly_requests 8, avg_rental_days 6, planned_depth_units 3"
            - "one size-M grade-A unit AUR-GOWN-001 of style AUR-GOWN-01, freshly created and never touched"
            - "member Nora Ellery on SIG4 is ACTIVE with no reservations"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /membership-plans"
              payload: { code: "SIG4", name: "Signature 4", item_slots: 3, monthly_fee_cents: 10000, monthly_swaps_allowed: 2, shipping_cadence_days: 7, waiver_monthly_fee_cents: 1800, waiver_coverage_cents: 10000 }
              as: PlatformAdmin
              captures: { plan_sig4_id: "$.data.id" }
            - call: "POST /technicians"
              payload: { employee_code: "T-INSP-1", full_name: "Ivo Sandoval", repair_certified: true, photography_certified: true, status: "ACTIVE" }
              as: PlatformAdmin
              captures: { tech_insp_id: "$.data.id" }
            - call: "POST /technicians"
              payload: { employee_code: "T-REP-2", full_name: "Marta Lindqvist", repair_certified: true, photography_certified: true, status: "ACTIVE" }
              as: PlatformAdmin
              captures: { tech_rep_id: "$.data.id" }
            - call: "POST /styles"
              payload: { style_code: "AUR-GOWN-01", brand: "Aurelia", category: "GOWN", retail_price_cents: 48000, acquisition_cost_cents: 21000, size_run: ["S", "M", "L"], expected_rental_turns_per_unit: 12, planned_eol_value_cents: 9000, forecast_monthly_requests: 8, avg_rental_days: 6, planned_depth_units: 3 }
              as: InventoryPlanner
              captures: { style_gown_id: "$.data.id" }
            - call: "POST /styles/${style_gown_id}/rental-units"
              payload: { unit_code: "AUR-GOWN-001", size: "M", acquisition_cost_cents: 21000, condition_grade: "A" }
              as: InventoryPlanner
              captures: { unit1_id: "$.data.id" }
            - call: "POST /members"
              payload: { membership_plan_id: "${plan_sig4_id}", email: "nora@example.com", full_name: "Nora Ellery", waiver_active: false, preferred_categories: ["GOWN", "DRESS"], size_profile: "M" }
              as: PlatformAdmin
              captures: { member_id: "$.data.id" }
          trigger:
            - call: "GET /rental-units/${unit1_id}"
              payload: {}
              as: InventoryPlanner
            - call: "POST /reservations"
              payload: { style_id: "${style_gown_id}", requested_size: "M", requested_start_date: "2026-08-05", requested_end_date: "2026-08-09" }
              as: Member
              as_user_id: "${member_id}"
              captures: { res1_id: "$.data.id" }
            - call: "GET /rental-units/${unit1_id}"
              payload: {}
              as: InventoryPlanner
            - call: "POST /reservations/${res1_id}/release"
              payload: {}
              as: Member
              as_user_id: "${member_id}"
            - call: "GET /rental-units/${unit1_id}"
              payload: {}
              as: InventoryPlanner
          assert:
            - "first GET: RentalUnit.version == 1 and availability_state == IN_STOCK"
            - "reservation: HTTP 201 with Reservation.allocated_unit_id == ${unit1_id}"
            - "second GET: RentalUnit.version == 2 and availability_state == RESERVED"
            - "release: HTTP 200 with Reservation.state == RELEASED"
            - "third GET: RentalUnit.version == 3 and availability_state == IN_STOCK"
            - "third GET: RentalUnit.created_at is unchanged from the first GET while updated_at is later"
      - name: layer_stale_unit_version_on_a_resale_listing_is_rejected_then_the_fresh_token_wins
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules.resale-supersede-stale-unit"
          - "validations.priority 13"
          - "errors[ERR_STALE_UNIT_VERSION]"
          - "endpoints.POST /resale-listings"
        distinguishing_aspect: >-
          The token is captured BEFORE the retirement, and the retirement itself increments RentalUnit.version, so
          the listing attempt carries a value that is exactly one behind and must return 412
          ERR_STALE_UNIT_VERSION. Priority 13 sits ahead of priority 46, so the stale token wins even though the
          unit is RETIRED and the request would otherwise be legal; re-reading the version and resending the
          identical body then produces the listing.
        test_recipe:
          setup:
            - "logical clock parked at 2026-08-03T09:00:00Z"
            - "style AUR-GOWN-01 with one grade-A size-M unit AUR-GOWN-001"
            - "the unit's version is read while it is still IN_STOCK, then the unit is retired with retirement_reason PLANNED_REFRESH, which increments its version"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /styles"
              payload: { style_code: "AUR-GOWN-01", brand: "Aurelia", category: "GOWN", retail_price_cents: 48000, acquisition_cost_cents: 21000, size_run: ["S", "M", "L"], expected_rental_turns_per_unit: 12, planned_eol_value_cents: 9000, forecast_monthly_requests: 8, avg_rental_days: 6, planned_depth_units: 3 }
              as: InventoryPlanner
              captures: { style_gown_id: "$.data.id" }
            - call: "POST /styles/${style_gown_id}/rental-units"
              payload: { unit_code: "AUR-GOWN-001", size: "M", acquisition_cost_cents: 21000, condition_grade: "A" }
              as: InventoryPlanner
              captures: { unit1_id: "$.data.id" }
            - call: "GET /rental-units/${unit1_id}"
              payload: {}
              as: InventoryPlanner
              captures: { stale_v: "$.data.version" }
            - call: "POST /rental-units/${unit1_id}/retirement"
              payload: { retirement_reason: "PLANNED_REFRESH" }
              as: InventoryPlanner
          trigger:
            - call: "POST /resale-listings"
              payload: { rental_unit_id: "${unit1_id}", expected_rental_unit_version: "${stale_v}", channel: "OUTLET" }
              as: InventoryPlanner
            - call: "GET /rental-units/${unit1_id}"
              payload: {}
              as: InventoryPlanner
              captures: { fresh_v: "$.data.version" }
            - call: "POST /resale-listings"
              payload: { rental_unit_id: "${unit1_id}", expected_rental_unit_version: "${fresh_v}", channel: "OUTLET" }
              as: InventoryPlanner
          assert:
            - "stale token: HTTP 412 with error_id == ERR_STALE_UNIT_VERSION"
            - "stale token: GET /resale-listings?rental_unit_id=${unit1_id} returns total_count == 0"
            - "fresh token: HTTP 201 with ResaleListing.state == LISTED and base_price_cents == 21600 and list_price_cents == 21600"
            - "fresh token: ResaleListing.channel_fee_cents == 2592 and net_recovery_cents == 18608 and floor_adjusted == false"
            - "GET /rental-units/${unit1_id} reports availability_state == RETIRED"
      - name: layer_receipt_cascade_chain_end_to_end
        claim_type: cascading_side_effects
        grounds:
