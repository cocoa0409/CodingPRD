# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Carpet & Upholstery Cleaning — Expert tier
# Breadth probe: every testable claim §1.1–§1.7 declares that §1.8 does not
# already cover. `excluded_because:` stubs cite the §1.8 instance that covers
# a corner already. All recipes use only §1.5 endpoints; literals pre-computed.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_customer_returns_201_with_defaults
        claim_type: Creation
        grounds:
          - entities.Customer.fields.full_name
          - entities.Customer.fields.status
          - entities.Customer.fields.wallet_credit_cents
        distinguishing_aspect: "POST /customers with full_name+email returns 201; status defaults ACTIVE, wallet_credit_cents defaults 0, id/created_at/version system-minted."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /customers"
              payload: { full_name: "New Cust", email: "new@x.com" }
              as: Customer
              captures: { cust_id: $.data.id }
          assert:
            - "response.http_status == 201"
            - "Customer.${cust_id}.status == ACTIVE"
            - "Customer.${cust_id}.wallet_credit_cents == 0"
            - "Customer.${cust_id}.version == 1"

      - name: create_cleaning_job_defaults_draft_unbilled
        claim_type: Defaults
        grounds:
          - entities.CleaningJob.fields.lifecycle_status
          - entities.CleaningJob.fields.billing_status
          - entities.CleaningJob.fields.move_furniture
          - entities.CleaningJob.fields.total_sqft
        distinguishing_aspect: "POST /cleaning-jobs without move_furniture/recurring_plan_id defaults move_furniture=false, lifecycle_status=DRAFT, billing_status=UNBILLED, total_sqft=0, recurring_plan_id=null."
        test_recipe:
          setup: ["One ACTIVE customer and one STEAM catalog"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "JobDef", email: "jobdef@x.com" }
              as: Customer
              captures: { cust_id: $.data.id }
            - call: "POST /service-catalogs"
              payload: { service_type: "STEAM", base_rate_cents_per_sqft: 50, stain_addon_cents: 2500, pet_addon_cents: 1800, protectant_cents_per_sqft: 12, move_furniture_flat_cents: 3000, dry_time_minutes: 240 }
              as: ServiceManager
              captures: { cat_id: $.data.id }
          trigger:
            - call: "POST /cleaning-jobs"
              payload: { customer_id: "${cust_id}", service_catalog_id: "${cat_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { job_id: $.data.id }
          assert:
            - "CleaningJob.${job_id}.lifecycle_status == DRAFT"
            - "CleaningJob.${job_id}.billing_status == UNBILLED"
            - "CleaningJob.${job_id}.move_furniture == false"
            - "CleaningJob.${job_id}.total_sqft == 0"
            - "CleaningJob.${job_id}.recurring_plan_id == null"

      - name: get_cleaning_job_not_found
        claim_type: Not Found
        grounds:
          - errors[ERR_JOB_NOT_FOUND]
          - endpoints
        distinguishing_aspect: "GET /cleaning-jobs/{id} for a random UUID returns ERR_JOB_NOT_FOUND with 404."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /cleaning-jobs/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ServiceManager
              captures: { err: $.data.error_id }
          assert:
            - "response.http_status == 404"
            - "response.data.error_id == ERR_JOB_NOT_FOUND"

      - name: create_room_missing_required_field
        claim_type: Required Fields
        grounds:
          - entities.RoomAssessment.fields.area_sqft
          - validations[priority=4]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /cleaning-jobs/{id}/rooms omitting area_sqft returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["A DRAFT job"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "RoomReq", email: "rr@x.com" }
              as: Customer
              captures: { cust_id: $.data.id }
            - call: "POST /service-catalogs"
              payload: { service_type: "STEAM", base_rate_cents_per_sqft: 50, stain_addon_cents: 2500, pet_addon_cents: 1800, protectant_cents_per_sqft: 12, move_furniture_flat_cents: 3000, dry_time_minutes: 240 }
              as: ServiceManager
              captures: { cat_id: $.data.id }
            - call: "POST /cleaning-jobs"
              payload: { customer_id: "${cust_id}", service_catalog_id: "${cat_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { job_id: $.data.id }
          trigger:
            - call: "POST /cleaning-jobs/${job_id}/rooms"
              payload: { area_label: "NoSqft", soiling_level: "LIGHT" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.http_status == 422"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: create_room_invalid_soiling_enum
        claim_type: Type Constraints
        grounds:
          - entities.RoomAssessment.fields.soiling_level
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST room with soiling_level='FILTHY' (not in LIGHT/MODERATE/HEAVY) returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["A DRAFT job"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "EnumRoom", email: "er@x.com" }
              as: Customer
              captures: { cust_id: $.data.id }
            - call: "POST /service-catalogs"
              payload: { service_type: "STEAM", base_rate_cents_per_sqft: 50, stain_addon_cents: 2500, pet_addon_cents: 1800, protectant_cents_per_sqft: 12, move_furniture_flat_cents: 3000, dry_time_minutes: 240 }
              as: ServiceManager
              captures: { cat_id: $.data.id }
            - call: "POST /cleaning-jobs"
              payload: { customer_id: "${cust_id}", service_catalog_id: "${cat_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { job_id: $.data.id }
          trigger:
            - call: "POST /cleaning-jobs/${job_id}/rooms"
              payload: { area_label: "Bad", area_sqft: 100, soiling_level: "FILTHY" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.http_status == 422"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: create_room_zero_sqft_rejected
        claim_type: Type Constraints
        grounds:
          - entities.RoomAssessment.fields.area_sqft
          - validations[priority=4]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "Boundary: area_sqft=0 violates the >=1 bound and returns ERR_INVALID_REQUEST (422); empty-quantity edge on a distinct field from the §1.8 escalation-count boundary."
        test_recipe:
          setup: ["A DRAFT job"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "ZeroSqft", email: "zs@x.com" }
              as: Customer
              captures: { cust_id: $.data.id }
            - call: "POST /service-catalogs"
              payload: { service_type: "STEAM", base_rate_cents_per_sqft: 50, stain_addon_cents: 2500, pet_addon_cents: 1800, protectant_cents_per_sqft: 12, move_furniture_flat_cents: 3000, dry_time_minutes: 240 }
              as: ServiceManager
              captures: { cat_id: $.data.id }
            - call: "POST /cleaning-jobs"
              payload: { customer_id: "${cust_id}", service_catalog_id: "${cat_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { job_id: $.data.id }
          trigger:
            - call: "POST /cleaning-jobs/${job_id}/rooms"
              payload: { area_label: "Zero", area_sqft: 0, soiling_level: "LIGHT" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.http_status == 422"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: duplicate_customer_email_rejected
        claim_type: Type Constraints
        grounds:
          - entities.Customer.fields.email
          - errors[ERR_EMAIL_TAKEN]
        distinguishing_aspect: "A second POST /customers with an email already used returns ERR_EMAIL_TAKEN (409)."
        test_recipe:
          setup: ["One customer registered with dupe@x.com"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "First", email: "dupe@x.com" }
              as: Customer
              captures: { first_id: $.data.id }
          trigger:
            - call: "POST /customers"
              payload: { full_name: "Second", email: "dupe@x.com" }
              as: Customer
              captures: { err: $.data.error_id }
          assert:
            - "response.http_status == 409"
            - "response.data.error_id == ERR_EMAIL_TAKEN"

      - name: duplicate_service_type_catalog_rejected
        claim_type: Type Constraints
        grounds:
          - entities.ServiceCatalog.fields.service_type
          - errors[ERR_SERVICE_TYPE_TAKEN]
        distinguishing_aspect: "A second ACTIVE STEAM catalog returns ERR_SERVICE_TYPE_TAKEN (409)."
        test_recipe:
          setup: ["One ACTIVE STEAM catalog"]
          setup_api_calls:
            - call: "POST /service-catalogs"
              payload: { service_type: "STEAM", base_rate_cents_per_sqft: 50, stain_addon_cents: 2500, pet_addon_cents: 1800, protectant_cents_per_sqft: 12, move_furniture_flat_cents: 3000, dry_time_minutes: 240 }
              as: ServiceManager
              captures: { cat_id: $.data.id }
          trigger:
            - call: "POST /service-catalogs"
              payload: { service_type: "STEAM", base_rate_cents_per_sqft: 60, stain_addon_cents: 2500, pet_addon_cents: 1800, protectant_cents_per_sqft: 12, move_furniture_flat_cents: 3000, dry_time_minutes: 240 }
              as: ServiceManager
              captures: { err: $.data.error_id }
          assert:
            - "response.http_status == 409"
            - "response.data.error_id == ERR_SERVICE_TYPE_TAKEN"

      - name: wallet_ledger_immutable_entity_no_version
        claim_type: Immutability
        grounds:
          - entities.WalletLedgerEntry
        distinguishing_aspect: "WalletLedgerEntry is common_fields:false — entries carry id+created_at only, are append-only (no update endpoint), and have no version field."
        test_recipe:
          setup: ["A customer with one GUARANTEE_CREDIT ledger entry from a granted claim (reuse §1.8 grant chain shape)"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "LedgerImm", email: "li@x.com" }
              as: Customer
              captures: { cust_id: $.data.id }
            - call: "POST /service-catalogs"
              payload: { service_type: "STEAM", base_rate_cents_per_sqft: 50, stain_addon_cents: 2500, pet_addon_cents: 1800, protectant_cents_per_sqft: 12, move_furniture_flat_cents: 3000, dry_time_minutes: 240 }
              as: ServiceManager
              captures: { cat_id: $.data.id }
            - call: "POST /crews"
              payload: { crew_name: "Rig-LI", supported_service_type: "STEAM", turnaround_buffer_minutes: 30 }
              as: Dispatcher
              captures: { crew_id: $.data.id, crew_v: $.data.version }
            - call: "POST /cleaning-jobs"
              payload: { customer_id: "${cust_id}", service_catalog_id: "${cat_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { job_id: $.data.id }
            - call: "POST /cleaning-jobs/${job_id}/rooms"
              payload: { area_label: "Rm", area_sqft: 100, soiling_level: "LIGHT" }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /cleaning-jobs/${job_id}/quote"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /cleaning-jobs/${job_id}/book"
              payload: { crew_id: "${crew_id}", start_minute: 0, end_minute: 120, expected_crew_version: "${crew_v}" }
              as: Dispatcher
            - call: "POST /cleaning-jobs/${job_id}/start"
              payload: {}
              as: Dispatcher
            - call: "POST /cleaning-jobs/${job_id}/complete"
              payload: { completed_at_minute: 200 }
              as: Dispatcher
            - call: "POST /guarantee-claims"
              payload: { cleaning_job_id: "${job_id}", reason: "x", filed_at_minute: 300 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { claim_id: $.data.id }
            - call: "POST /guarantee-claims/${claim_id}/grant"
              payload: {}
              as: ServiceManager
          trigger:
            - call: "GET /customers/${cust_id}/wallet-ledger"
              payload: {}
              as: ServiceManager
          assert:
            - "GET /customers/${cust_id}/wallet-ledger returns 1 WalletLedgerEntry row"
            - "first WalletLedgerEntry.reason == GUARANTEE_CREDIT"
            - "first WalletLedgerEntry.delta_cents == 2000"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: quote_from_already_quoted_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.CleaningJob.DRAFT_to_QUOTED
          - errors[ERR_JOB_NOT_DRAFT]
        distinguishing_aspect: "Quoting a job already in QUOTED returns ERR_JOB_NOT_DRAFT (409); no re-freeze of quoted_price_cents."
        test_recipe:
          setup: ["A QUOTED job"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "ReQuote", email: "rq@x.com" }
              as: Customer
              captures: { cust_id: $.data.id }
            - call: "POST /service-catalogs"
              payload: { service_type: "STEAM", base_rate_cents_per_sqft: 50, stain_addon_cents: 2500, pet_addon_cents: 1800, protectant_cents_per_sqft: 12, move_furniture_flat_cents: 3000, dry_time_minutes: 240 }
              as: ServiceManager
              captures: { cat_id: $.data.id }
            - call: "POST /cleaning-jobs"
              payload: { customer_id: "${cust_id}", service_catalog_id: "${cat_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { job_id: $.data.id }
            - call: "POST /cleaning-jobs/${job_id}/rooms"
              payload: { area_label: "Rm", area_sqft: 100, soiling_level: "LIGHT" }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /cleaning-jobs/${job_id}/quote"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /cleaning-jobs/${job_id}/quote"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.http_status == 409"
            - "response.data.error_id == ERR_JOB_NOT_DRAFT"

      - name: add_room_to_quoted_job_rejected
        claim_type: Invalid Transitions
        grounds:
          - state_machines.CleaningJob.DRAFT_to_QUOTED
          - errors[ERR_JOB_NOT_DRAFT]
        distinguishing_aspect: "Adding a room to a non-DRAFT (QUOTED) job returns ERR_JOB_NOT_DRAFT (409) — rooms/add-ons are DRAFT-only."
        test_recipe:
          setup: ["A QUOTED job"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "AddAfterQuote", email: "aaq@x.com" }
              as: Customer
              captures: { cust_id: $.data.id }
            - call: "POST /service-catalogs"
              payload: { service_type: "STEAM", base_rate_cents_per_sqft: 50, stain_addon_cents: 2500, pet_addon_cents: 1800, protectant_cents_per_sqft: 12, move_furniture_flat_cents: 3000, dry_time_minutes: 240 }
              as: ServiceManager
              captures: { cat_id: $.data.id }
            - call: "POST /cleaning-jobs"
              payload: { customer_id: "${cust_id}", service_catalog_id: "${cat_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { job_id: $.data.id }
            - call: "POST /cleaning-jobs/${job_id}/rooms"
              payload: { area_label: "Rm", area_sqft: 100, soiling_level: "LIGHT" }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /cleaning-jobs/${job_id}/quote"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /cleaning-jobs/${job_id}/rooms"
              payload: { area_label: "Late", area_sqft: 50, soiling_level: "LIGHT" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.http_status == 409"
            - "response.data.error_id == ERR_JOB_NOT_DRAFT"

      - name: start_unbooked_quoted_job_rejected
        claim_type: Invalid Transitions
        grounds:
          - state_machines.CleaningJob.BOOKED_to_IN_PROGRESS
          - errors[ERR_JOB_NOT_BOOKED]
        distinguishing_aspect: "Starting a job still in QUOTED (never booked) returns ERR_JOB_NOT_BOOKED (409)."
        test_recipe:
          setup: ["A QUOTED job, never booked"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "StartEarly", email: "se@x.com" }
              as: Customer
              captures: { cust_id: $.data.id }
            - call: "POST /service-catalogs"
              payload: { service_type: "STEAM", base_rate_cents_per_sqft: 50, stain_addon_cents: 2500, pet_addon_cents: 1800, protectant_cents_per_sqft: 12, move_furniture_flat_cents: 3000, dry_time_minutes: 240 }
              as: ServiceManager
              captures: { cat_id: $.data.id }
            - call: "POST /cleaning-jobs"
              payload: { customer_id: "${cust_id}", service_catalog_id: "${cat_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { job_id: $.data.id }
            - call: "POST /cleaning-jobs/${job_id}/rooms"
              payload: { area_label: "Rm", area_sqft: 100, soiling_level: "LIGHT" }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /cleaning-jobs/${job_id}/quote"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /cleaning-jobs/${job_id}/start"
              payload: {}
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "response.http_status == 409"
            - "response.data.error_id == ERR_JOB_NOT_BOOKED"

      - name: cancel_completed_job_rejected_terminal
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.CleaningJob.lifecycle_status
          - errors[ERR_JOB_NOT_QUOTED]
        distinguishing_aspect: "A COMPLETED job is terminal on the lifecycle axis; cancel (defined only from DRAFT/QUOTED/BOOKED) is rejected — server returns a 409 state error (ERR_JOB_NOT_QUOTED), no slot/billing change."
        test_recipe:
          setup: ["A COMPLETED job"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "CancelDone", email: "cdone@x.com" }
              as: Customer
              captures: { cust_id: $.data.id }
            - call: "POST /service-catalogs"
              payload: { service_type: "STEAM", base_rate_cents_per_sqft: 50, stain_addon_cents: 2500, pet_addon_cents: 1800, protectant_cents_per_sqft: 12, move_furniture_flat_cents: 3000, dry_time_minutes: 240 }
              as: ServiceManager
              captures: { cat_id: $.data.id }
            - call: "POST /crews"
              payload: { crew_name: "Rig-CD", supported_service_type: "STEAM", turnaround_buffer_minutes: 30 }
              as: Dispatcher
              captures: { crew_id: $.data.id, crew_v: $.data.version }
            - call: "POST /cleaning-jobs"
              payload: { customer_id: "${cust_id}", service_catalog_id: "${cat_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { job_id: $.data.id }
            - call: "POST /cleaning-jobs/${job_id}/rooms"
              payload: { area_label: "Rm", area_sqft: 100, soiling_level: "LIGHT" }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /cleaning-jobs/${job_id}/quote"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /cleaning-jobs/${job_id}/book"
              payload: { crew_id: "${crew_id}", start_minute: 600, end_minute: 720, expected_crew_version: "${crew_v}" }
              as: Dispatcher
            - call: "POST /cleaning-jobs/${job_id}/start"
              payload: {}
              as: Dispatcher
            - call: "POST /cleaning-jobs/${job_id}/complete"
              payload: { completed_at_minute: 800 }
              as: Dispatcher
          trigger:
            - call: "POST /cleaning-jobs/${job_id}/cancel"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.http_status == 409"
            - "response.data.error_id == ERR_JOB_NOT_QUOTED"

      - name: grant_already_granted_claim_rejected
        claim_type: Idempotency
        grounds:
          - state_machines.GuaranteeClaim.FILED_to_GRANTED
          - errors[ERR_CLAIM_NOT_FILED]
        distinguishing_aspect: "Granting a claim already GRANTED returns ERR_CLAIM_NOT_FILED (409); no second re-clean job or wallet credit."
        test_recipe:
          setup: ["A GRANTED claim with a completed origin job within window"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "ReGrant", email: "rg2@x.com" }
              as: Customer
              captures: { cust_id: $.data.id }
            - call: "POST /service-catalogs"
              payload: { service_type: "STEAM", base_rate_cents_per_sqft: 50, stain_addon_cents: 2500, pet_addon_cents: 1800, protectant_cents_per_sqft: 12, move_furniture_flat_cents: 3000, dry_time_minutes: 240 }
              as: ServiceManager
              captures: { cat_id: $.data.id }
            - call: "POST /crews"
              payload: { crew_name: "Rig-RG", supported_service_type: "STEAM", turnaround_buffer_minutes: 30 }
              as: Dispatcher
              captures: { crew_id: $.data.id, crew_v: $.data.version }
            - call: "POST /cleaning-jobs"
              payload: { customer_id: "${cust_id}", service_catalog_id: "${cat_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { job_id: $.data.id }
            - call: "POST /cleaning-jobs/${job_id}/rooms"
              payload: { area_label: "Rm", area_sqft: 100, soiling_level: "LIGHT" }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /cleaning-jobs/${job_id}/quote"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /cleaning-jobs/${job_id}/book"
              payload: { crew_id: "${crew_id}", start_minute: 600, end_minute: 720, expected_crew_version: "${crew_v}" }
              as: Dispatcher
            - call: "POST /cleaning-jobs/${job_id}/start"
              payload: {}
              as: Dispatcher
            - call: "POST /cleaning-jobs/${job_id}/complete"
              payload: { completed_at_minute: 800 }
              as: Dispatcher
            - call: "POST /guarantee-claims"
              payload: { cleaning_job_id: "${job_id}", reason: "x", filed_at_minute: 900 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { claim_id: $.data.id }
            - call: "POST /guarantee-claims/${claim_id}/grant"
              payload: {}
              as: ServiceManager
          trigger:
            - call: "POST /guarantee-claims/${claim_id}/grant"
