  - section: consistency_model
    instances:
      - name: immediate_balance_visible_in_create_response
        claim_type: immediate
        grounds: [entities.Episode.fields.balance_due_cents, calculations.episode_balance_due]
        distinguishing_aspect: "balance_due_cents == 160000 is visible in the same POST /episodes response that creates the episode (immediate consistency)."
