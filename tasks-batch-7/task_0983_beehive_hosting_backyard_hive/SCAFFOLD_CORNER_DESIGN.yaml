            - { call: "POST /api/inspections", payload: { hive_id: "${hv2}", inspected_at: "2026-05-10T00:00:00Z", mites_counted: 0, bees_sampled: 300, disease_flag: false, brood_score: 9, queen_seen: true, stores_kg: 12.0 }, as: Beekeeper, as_user_id: "bk-1", captures: { i2: $.data.id } }
            - { call: "POST /api/inspections/${i2}/submit", payload: {}, as: Beekeeper, as_user_id: "bk-1" }
