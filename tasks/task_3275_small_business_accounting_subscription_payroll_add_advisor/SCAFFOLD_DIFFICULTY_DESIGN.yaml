              payload: { payment_method_token: "pm_card_visa" }
              as: CompanyUser
              as_user_id: "${company_p_admin_id}"
            - &k_bc_p
              call: "POST /api/companies/${company_p_id}/bank_connections"
              payload: { company_id: "${company_p_id}", institution_name: "Chase", external_account_mask: "1111", consent_expires_at: "2026-09-15T00:00:00Z" }
              as: CompanyUser
              as_user_id: "${company_p_admin_id}"
              captures: { bc_p_id: $.data.id }
            - call: "POST /api/companies/${company_p_id}/bank_connections/${bc_p_id}/authorize"
              payload: {}
              as: CompanyUser
              as_user_id: "${company_p_admin_id}"
            - call: "POST /api/_clock/set_current_utc"
              payload: { current_utc: "2026-09-20T00:00:00Z" }   # past consent_expires_at
              as: PlatformAdmin
            - call: "POST /api/_sync/bank_feed_tick"
              payload: { bank_connection_id: "${bc_p_id}" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/companies/${company_p_id}/reconciliations"
