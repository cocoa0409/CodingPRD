# Scaffold Difficulty Design (SKILL.md §1.8) for task_2698
# Superfund Site Remediation & Responsible Party Allocation
#
# Nine §0.5 rule_id blocks, two differentiated instances each (18 total).
# Every grounds: entry resolves into SCAFFOLD.yaml §1.1-§1.6; every setup_api_calls entry is a
# structured call against a §1.5 endpoint; every ${var} is bound by an earlier captures:;
# every formula-derived assert is a literal computed with Decimal/ROUND_HALF_UP against §1.3.
#
# Fixed operator identities used throughout (opaque roles):
#   rpm-001  RemedialProjectManager who creates sites and authors RI/FS documents
#   rpm-002  RemedialProjectManager who reviews/approves RI/FS documents (segregation of duties)
#   rpm-003  RemedialProjectManager who signs Records of Decision (segregation of duties)
#   af-001   AllocationFacilitator
#   sc-001   SettlementCounsel
#   cm-001   CommunityMember
# Entity-backed roles carry their own ids: PRPRepresentative -> PotentiallyResponsibleParty.id,
# Contractor -> RemediationContract.id.

scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:

      - name: allocation_share_provisional_vs_final_diverge_on_waste_in_verification
        grounds:
          - calculations.allocation_share_computation
          - entities.AllocationShare.fields.provisional_pct
          - entities.AllocationShare.fields.final_pct
          - entities.WasteInRecord.fields.effective_volume_tons
          - state_machines.AllocationRound.DRAFTING_to_BALLOTING
          - state_machines.AllocationRound.BALLOTING_to_ADOPTED
          - state_machines.WasteInRecord.SUBMITTED_to_VERIFIED
          - state_machines.WasteInRecord.SUBMITTED_to_REJECTED
        distinguishing_aspect: |
          This instance's two variants diverge over the COST-ALLOCATION domain (WasteInRecord volumes
          feeding AllocationShare percentages): the provisional variant values still-SUBMITTED claims at
          volume_tons while the final variant counts only VERIFIED verified_volume_tons, so the same four
          parties ballot on 65.56/28.91/5.12/0.41 and are bound by 67.95/31.57/0.00/0.48.
        test_recipe:
          setup:
            - "Site BUCKEYE listed on the NPL with an RI/FS opened, so listing_status == RI_FS_UNDERWAY."
            - "Four noticed PARTICIPATING parties: P1 (4000 t class II), P2 (1000 t class I), P3 (500 t class IV), P4 (40 t class IV)."
            - "Two ownership periods: P1 holds 5936 days (1962-03-01..1978-06-01), P2 holds 6058 days (1978-06-01..1995-01-01)."
            - "Round 1 opened with weights 5000/3000/2000 bp while every waste-in record is still SUBMITTED, then moved to BALLOTING so provisional_pct is frozen."
            - "AFTER the freeze: P1's claim is cut to 3600 t, P2's 1000 t and P4's 40 t are verified as claimed, and P3's 500 t is REJECTED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-01-04T09:00:00Z" }
              as: RemedialProjectManager
              as_user_id: "rpm-001"
            - call: "POST /sites"
              payload: { name: "Buckeye Drum Yard", epa_region: 5, hrs_score: 42.75 }
              as: RemedialProjectManager
              as_user_id: "rpm-001"
              captures: { site_id: $.data.id }
            - call: "POST /sites/${site_id}/list-on-npl"
              payload: { listing_reference: "FR-2027-BDY-0417" }
              as: RemedialProjectManager
              as_user_id: "rpm-001"
            - call: "POST /sites/${site_id}/prps"
              payload: { legal_name: "Acme Solvents Inc", party_type: "GENERATOR", viability_score: 80 }
              as: RemedialProjectManager
              as_user_id: "rpm-001"
              captures: { prp1: $.data.id }
            - call: "POST /sites/${site_id}/prps"
              payload: { legal_name: "Northshore Plating Co", party_type: "GENERATOR", viability_score: 70 }
              as: RemedialProjectManager
              as_user_id: "rpm-001"
              captures: { prp2: $.data.id }
            - call: "POST /sites/${site_id}/prps"
              payload: { legal_name: "Delta Haulers LLC", party_type: "TRANSPORTER", viability_score: 40 }
              as: RemedialProjectManager
              as_user_id: "rpm-001"
              captures: { prp3: $.data.id }
            - call: "POST /sites/${site_id}/prps"
              payload: { legal_name: "Tiny Print Shop LLC", party_type: "GENERATOR", viability_score: 25 }
              as: RemedialProjectManager
              as_user_id: "rpm-001"
              captures: { prp4: $.data.id }
            - call: "POST /prps/${prp1}/notice"
              payload: { notice_reference: "GNL-2027-0001" }
              as: RemedialProjectManager
              as_user_id: "rpm-001"
            - call: "POST /prps/${prp2}/notice"
              payload: { notice_reference: "GNL-2027-0002" }
              as: RemedialProjectManager
              as_user_id: "rpm-001"
            - call: "POST /prps/${prp3}/notice"
              payload: { notice_reference: "GNL-2027-0003" }
              as: RemedialProjectManager
              as_user_id: "rpm-001"
            - call: "POST /prps/${prp4}/notice"
              payload: { notice_reference: "GNL-2027-0004" }
              as: RemedialProjectManager
              as_user_id: "rpm-001"
            - call: "POST /prps/${prp1}/response"
              payload: { election: "PARTICIPATE" }
              as: PRPRepresentative
              as_user_id: "${prp1}"
            - call: "POST /prps/${prp2}/response"
              payload: { election: "PARTICIPATE" }
              as: PRPRepresentative
              as_user_id: "${prp2}"
            - call: "POST /prps/${prp3}/response"
              payload: { election: "PARTICIPATE" }
              as: PRPRepresentative
              as_user_id: "${prp3}"
            - call: "POST /prps/${prp4}/response"
              payload: { election: "PARTICIPATE" }
              as: PRPRepresentative
              as_user_id: "${prp4}"
            - call: "POST /sites/${site_id}/ownership-periods"
              payload: { prp_id: "${prp1}", start_date: "1962-03-01", end_date: "1978-06-01", acquisition_type: "PURCHASE" }
              as: RemedialProjectManager
              as_user_id: "rpm-001"
            - call: "POST /sites/${site_id}/ownership-periods"
              payload: { prp_id: "${prp2}", start_date: "1978-06-01", end_date: "1995-01-01", acquisition_type: "MERGER" }
              as: RemedialProjectManager
              as_user_id: "rpm-001"
            - call: "POST /sites/${site_id}/waste-in-records"
              payload: { prp_id: "${prp1}", volume_tons: 4000, toxicity_class: "II", evidence_grade: "A", disposal_year: 1971 }
              as: RemedialProjectManager
              as_user_id: "rpm-001"
              captures: { w1: $.data.id }
            - call: "POST /sites/${site_id}/waste-in-records"
              payload: { prp_id: "${prp2}", volume_tons: 1000, toxicity_class: "I", evidence_grade: "A", disposal_year: 1983 }
              as: RemedialProjectManager
              as_user_id: "rpm-001"
              captures: { w2: $.data.id }
            - call: "POST /sites/${site_id}/waste-in-records"
              payload: { prp_id: "${prp3}", volume_tons: 500, toxicity_class: "IV", evidence_grade: "C", disposal_year: 1988 }
              as: RemedialProjectManager
              as_user_id: "rpm-001"
              captures: { w3: $.data.id }
            - call: "POST /sites/${site_id}/waste-in-records"
              payload: { prp_id: "${prp4}", volume_tons: 40, toxicity_class: "IV", evidence_grade: "B", disposal_year: 1990 }
              as: RemedialProjectManager
              as_user_id: "rpm-001"
              captures: { w4: $.data.id }
            - call: "POST /sites/${site_id}/remedial-investigations"
              payload: { scope_summary: "Groundwater plume delineation, OU-1", exposure_medium: "GROUNDWATER" }
              as: RemedialProjectManager
              as_user_id: "rpm-001"
              captures: { ri_id: $.data.id }
            - call: "GET /sites/${site_id}"
              payload: {}
              as: AllocationFacilitator
              as_user_id: "af-001"
              captures: { site_v: $.data.version }
            - call: "POST /sites/${site_id}/allocation-rounds"
              payload: { weight_volume_bp: 5000, weight_toxicity_bp: 3000, weight_ownership_bp: 2000, expected_site_version: "${site_v}" }
              as: AllocationFacilitator
              as_user_id: "af-001"
              captures: { round_id: $.data.id }
            - call: "POST /allocation-rounds/${round_id}/balloting"
              payload: {}
              as: AllocationFacilitator
              as_user_id: "af-001"
            - call: "POST /waste-in-records/${w1}/verification"
              payload: { decision: "VERIFIED", verified_volume_tons: 3600, verification_note: "Manifest tonnage reconciled; 400 t unsupported." }
              as: RemedialProjectManager
              as_user_id: "rpm-001"
            - call: "POST /waste-in-records/${w2}/verification"
              payload: { decision: "VERIFIED", verified_volume_tons: 1000 }
              as: RemedialProjectManager
              as_user_id: "rpm-001"
            - call: "POST /waste-in-records/${w3}/verification"
              payload: { decision: "REJECTED", verification_note: "No manifest, no witness statement." }
              as: RemedialProjectManager
              as_user_id: "rpm-001"
            - call: "POST /waste-in-records/${w4}/verification"
              payload: { decision: "VERIFIED", verified_volume_tons: 40 }
              as: RemedialProjectManager
              as_user_id: "rpm-001"
          trigger:
            - call: "POST /allocation-rounds/${round_id}/ballots"
              payload: { ballot: "ACCEPT", ballot_rationale: "Gore factors accepted." }
              as: PRPRepresentative
              as_user_id: "${prp1}"
            - call: "POST /allocation-rounds/${round_id}/ballots"
              payload: { ballot: "ACCEPT" }
              as: PRPRepresentative
              as_user_id: "${prp2}"
            - call: "POST /allocation-rounds/${round_id}/ballots"
              payload: { ballot: "ACCEPT" }
              as: PRPRepresentative
              as_user_id: "${prp3}"
            - call: "POST /allocation-rounds/${round_id}/ballots"
              payload: { ballot: "ACCEPT" }
              as: PRPRepresentative
              as_user_id: "${prp4}"
          assert:
            - "AllocationRound.${round_id}.status == ADOPTED"
            - "AllocationRound.${round_id}.share_count == 4 and balloted_count == 4 and accept_share_pct == 100.00"
            - "AllocationShare(round=${round_id}, prp=${prp1}).provisional_pct == 65.56"
            - "AllocationShare(round=${round_id}, prp=${prp2}).provisional_pct == 28.91"
            - "AllocationShare(round=${round_id}, prp=${prp3}).provisional_pct == 5.12"
            - "AllocationShare(round=${round_id}, prp=${prp4}).provisional_pct == 0.41"
            - "AllocationShare(round=${round_id}, prp=${prp1}).final_pct == 67.95"
            - "AllocationShare(round=${round_id}, prp=${prp2}).final_pct == 31.57"
            - "AllocationShare(round=${round_id}, prp=${prp3}).final_pct == 0.00"
            - "AllocationShare(round=${round_id}, prp=${prp4}).final_pct == 0.48"
            - "AllocationShare(round=${round_id}, prp=${prp1}).final_pct != AllocationShare(round=${round_id}, prp=${prp1}).provisional_pct"
            - "AllocationShare(round=${round_id}, prp=${prp3}).disposition == ALLOCATED (a rejected claim zeroes the percentage, it does not remove the party)"
            - "AllocationRound.${round_id}.allocated_share_total_pct == 100.00 and orphan_share_pct == 0.00 and settled_share_pct == 0.00"
            - "PotentiallyResponsibleParty.${prp1}.verified_volume_tons == 3600 and submitted_volume_tons == 3600"
            - "Site.${site_id}.verified_waste_volume_tons == 4640"

      - name: risk_assessment_central_tendency_vs_rme_diverge_on_same_sample_set
        grounds:
          - calculations.risk_assessment
          - entities.RemedialInvestigation.fields.central_tendency_epc_ug_per_l
          - entities.RemedialInvestigation.fields.rme_epc_ug_per_l
          - entities.RemedialInvestigation.fields.central_tendency_risk
          - entities.RemedialInvestigation.fields.rme_risk
          - entities.RemedialInvestigation.fields.hazard_index
          - entities.ContaminantSample.fields.qa_status
          - state_machines.RemedialInvestigation.DRAFT_to_UNDER_REVIEW
        distinguishing_aspect: |
          This instance's two variants diverge over the HUMAN-HEALTH-RISK domain on a single immutable
          ContaminantSample set (no allocation entity involved): the central-tendency variant averages
          only qa_status == VALID samples (20.000 ug/L -> 0.0001000) while the RME variant takes the
          maximum over VALID+ESTIMATED (60.0 ug/L -> 0.0003000), a 3x divergence from identical rows.
        test_recipe:
          setup:
            - "Site listed on the NPL with one RI/FS in DRAFT whose exposure_medium == GROUNDWATER."
            - "Five samples: GROUNDWATER 24.0 VALID, GROUNDWATER 16.0 VALID, GROUNDWATER 60.0 ESTIMATED, SOIL 900.0 VALID (wrong medium), GROUNDWATER 500.0 REJECTED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-02-01T08:00:00Z" }
              as: RemedialProjectManager
              as_user_id: "rpm-001"
            - call: "POST /sites"
              payload: { name: "Willow Creek Solvent Recovery", epa_region: 4, hrs_score: 51.20 }
              as: RemedialProjectManager
              as_user_id: "rpm-001"
              captures: { site_id: $.data.id }
            - call: "POST /sites/${site_id}/list-on-npl"
              payload: { listing_reference: "FR-2027-WCS-0102" }
              as: RemedialProjectManager
              as_user_id: "rpm-001"
            - call: "POST /sites/${site_id}/remedial-investigations"
              payload: { scope_summary: "OU-1 groundwater risk assessment", exposure_medium: "GROUNDWATER" }
              as: RemedialProjectManager
              as_user_id: "rpm-001"
              captures: { ri_id: $.data.id }
            - call: "POST /remedial-investigations/${ri_id}/samples"
              payload: { medium: "GROUNDWATER", contaminant: "TRICHLOROETHENE", concentration_ug_per_l: 24.0, qa_status: "VALID", collected_at: "2027-01-11T14:00:00Z", lab_reference: "LAB-A-0001" }
              as: RemedialProjectManager
              as_user_id: "rpm-001"
            - call: "POST /remedial-investigations/${ri_id}/samples"
              payload: { medium: "GROUNDWATER", contaminant: "TETRACHLOROETHENE", concentration_ug_per_l: 16.0, qa_status: "VALID", collected_at: "2027-01-11T15:00:00Z", lab_reference: "LAB-A-0002" }
              as: RemedialProjectManager
              as_user_id: "rpm-001"
            - call: "POST /remedial-investigations/${ri_id}/samples"
              payload: { medium: "GROUNDWATER", contaminant: "VINYL_CHLORIDE", concentration_ug_per_l: 60.0, qa_status: "ESTIMATED", collected_at: "2027-01-12T09:00:00Z", lab_reference: "LAB-A-0003" }
              as: RemedialProjectManager
              as_user_id: "rpm-001"
            - call: "POST /remedial-investigations/${ri_id}/samples"
              payload: { medium: "SOIL", contaminant: "TRICHLOROETHENE", concentration_ug_per_l: 900.0, qa_status: "VALID", collected_at: "2027-01-12T10:00:00Z", lab_reference: "LAB-A-0004" }
              as: RemedialProjectManager
              as_user_id: "rpm-001"
            - call: "POST /remedial-investigations/${ri_id}/samples"
              payload: { medium: "GROUNDWATER", contaminant: "VINYL_CHLORIDE", concentration_ug_per_l: 500.0, qa_status: "REJECTED", collected_at: "2027-01-12T11:00:00Z", lab_reference: "LAB-A-0005" }
              as: RemedialProjectManager
              as_user_id: "rpm-001"
          trigger:
            - call: "POST /remedial-investigations/${ri_id}/submission"
              payload: {}
              as: RemedialProjectManager
              as_user_id: "rpm-001"
          assert:
            - "RemedialInvestigation.${ri_id}.status == UNDER_REVIEW"
            - "RemedialInvestigation.${ri_id}.valid_sample_count == 2 (the SOIL VALID sample and the REJECTED groundwater sample are both excluded)"
            - "RemedialInvestigation.${ri_id}.central_tendency_epc_ug_per_l == 20.000"
            - "RemedialInvestigation.${ri_id}.rme_epc_ug_per_l == 60.0"
            - "RemedialInvestigation.${ri_id}.central_tendency_risk == 0.0001000"
            - "RemedialInvestigation.${ri_id}.rme_risk == 0.0003000"
            - "RemedialInvestigation.${ri_id}.rme_risk == 3 * RemedialInvestigation.${ri_id}.central_tendency_risk"
            - "RemedialInvestigation.${ri_id}.hazard_index == 12.00"
            - "RemedialInvestigation.${ri_id}.action_level_exceeded == true"

  - rule_id: combinatorial_formula
    instances:

      - name: remedy_npv_rounds_each_annual_term_before_summation
        grounds:
          - calculations.remedy_npv
          - calculations.remedy_score
          - entities.RemedyAlternative.fields.npv_cents
          - entities.RemedyAlternative.fields.cost_score
          - entities.RemedyAlternative.fields.remedy_score
          - entities.RemedyAlternative.fields.discount_rate_bp
        distinguishing_aspect: |
          Mode (b) instance - order-of-operations trap: the 30 annual O&M terms are each discounted and
          rounded to whole cents BEFORE entering the sum (1808406854), whereas discounting the whole
          stream and rounding once at the end yields 1808406853; a one-cent divergence no estimate can hide.
        test_recipe:
          setup:
            - "Site listed on the NPL with one RI/FS in DRAFT (exposure_medium GROUNDWATER)."
            - "Two remedy alternatives priced with a 700 bp discount rate over a 30-year O&M horizon: PUMP_AND_TREAT capital 1250000000 / annual 45000000, MNA capital 620000000 / annual 22000000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-02-10T08:00:00Z" }
              as: RemedialProjectManager
              as_user_id: "rpm-001"
            - call: "POST /sites"
              payload: { name: "Copper Flats Plating", epa_region: 8, hrs_score: 39.10 }
              as: RemedialProjectManager
              as_user_id: "rpm-001"
              captures: { site_id: $.data.id }
            - call: "POST /sites/${site_id}/list-on-npl"
              payload: { listing_reference: "FR-2027-CFP-0210" }
              as: RemedialProjectManager
              as_user_id: "rpm-001"
            - call: "POST /sites/${site_id}/remedial-investigations"
              payload: { scope_summary: "OU-2 feasibility study, groundwater", exposure_medium: "GROUNDWATER" }
              as: RemedialProjectManager
              as_user_id: "rpm-001"
              captures: { ri_id: $.data.id }
          trigger:
            - call: "POST /remedial-investigations/${ri_id}/remedy-alternatives"
              payload: { label: "PUMP_AND_TREAT", capital_cost_cents: 1250000000, annual_om_cost_cents: 45000000, om_years: 30, discount_rate_bp: 700, effectiveness_score: 90, implementability_score: 62 }
              as: RemedialProjectManager
              as_user_id: "rpm-001"
              captures: { alt_a: $.data.id }
            - call: "POST /remedial-investigations/${ri_id}/remedy-alternatives"
              payload: { label: "MONITORED_NATURAL_ATTENUATION", capital_cost_cents: 620000000, annual_om_cost_cents: 22000000, om_years: 30, discount_rate_bp: 700, effectiveness_score: 74, implementability_score: 96 }
              as: RemedialProjectManager
              as_user_id: "rpm-001"
              captures: { alt_b: $.data.id }
          assert:
            - "RemedyAlternative.${alt_a}.npv_cents == 1808406854"
            - "RemedyAlternative.${alt_a}.npv_cents != 1808406853 (sum-then-round is off by one cent)"
            - "RemedyAlternative.${alt_b}.npv_cents == 892998906"
            - "RemedyAlternative.${alt_a}.cost_score == 63.83"
            - "RemedyAlternative.${alt_b}.cost_score == 82.14"
            - "RemedyAlternative.${alt_a}.remedy_score == 74.97 (RI action_level_exceeded still false at create, so WEIGHTS_NORMAL applies)"
            - "RemedyAlternative.${alt_b}.remedy_score == 83.33"
            - "RemedyAlternative.${alt_a}.selected_by_rod_id == null"

      - name: oversight_indirect_tier_keyed_on_pre_fee_direct_subtotal
        grounds:
          - calculations.oversight_cost_reimbursement
          - calculations.cost_recovery_ledger
          - entities.Site.fields.oversight_direct_cents
          - entities.Site.fields.oversight_indirect_rate_bp
          - entities.Site.fields.oversight_indirect_cents
          - entities.Site.fields.oversight_billed_cents
          - entities.Site.fields.total_response_cost_cents
        distinguishing_aspect: |
          Mode (c) instance - conditional-input trap: the indirect tier is selected from the PRE-FEE
          direct subtotal and the whole subtotal is then re-rated at the new tier, so direct 4600000
          bills 5313000 (1550 bp) rather than the 5186500 produced by keying the tier on the billed
          total, and a third posting to direct 6000000 re-rates the entire subtotal at 1275 bp.
        test_recipe:
          setup:
            - "Site listed on the NPL with no ConsentDecree, so cost_posture is OPEN and no oversight cap applies."
            - "Oversight postings accumulate: 3000000, then +1600000 (direct 4600000, still tier 1), then +1400000 (direct 6000000, crossing into tier 2)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-03-01T08:00:00Z" }
              as: RemedialProjectManager
              as_user_id: "rpm-001"
            - call: "POST /sites"
              payload: { name: "Redmill Wood Treating", epa_region: 6, hrs_score: 33.40 }
              as: RemedialProjectManager
              as_user_id: "rpm-001"
              captures: { site_id: $.data.id }
            - call: "POST /sites/${site_id}/list-on-npl"
              payload: { listing_reference: "FR-2027-RWT-0301" }
              as: RemedialProjectManager
              as_user_id: "rpm-001"
            - call: "POST /sites/${site_id}/oversight-costs"
              payload: { incurred_cents: 3000000, cost_category: "RI_FS_OVERSIGHT", incurred_on: "2027-02-15" }
              as: RemedialProjectManager
              as_user_id: "rpm-001"
          trigger:
            - call: "POST /sites/${site_id}/oversight-costs"
              payload: { incurred_cents: 1600000, cost_category: "RI_FS_OVERSIGHT", incurred_on: "2027-02-28" }
              as: RemedialProjectManager
              as_user_id: "rpm-001"
            - call: "GET /sites/${site_id}/cost-ledger"
              payload: {}
              as: RemedialProjectManager
              as_user_id: "rpm-001"
            - call: "POST /sites/${site_id}/oversight-costs"
              payload: { incurred_cents: 1400000, cost_category: "LEGAL_SUPPORT", incurred_on: "2027-03-01" }
              as: RemedialProjectManager
              as_user_id: "rpm-001"
          assert:
            - "After the first posting only: Site.${site_id}.oversight_direct_cents == 3000000, oversight_indirect_rate_bp == 1550, oversight_indirect_cents == 465000, oversight_billed_cents == 3465000"
            - "After the second posting: Site.${site_id}.oversight_direct_cents == 4600000"
            - "After the second posting: Site.${site_id}.oversight_indirect_rate_bp == 1550"
            - "After the second posting: Site.${site_id}.oversight_indirect_cents == 713000"
            - "After the second posting: Site.${site_id}.oversight_billed_cents == 5313000"
            - "After the second posting: Site.${site_id}.oversight_billed_cents != 5186500 (the tier-on-billed-total answer)"
            - "GET /sites/${site_id}/cost-ledger returns total_response_cost_cents == 5313000, recovered_cost_cents == 0, orphan_write_off_cents == 0, unrecovered_cost_cents == 5313000, ledger_balanced == true"
            - "GET /sites/${site_id}/cost-ledger returns oversight_cap_utilization_pct == null (no ENTERED decree governs the site)"
            - "After the third posting: Site.${site_id}.oversight_direct_cents == 6000000, oversight_indirect_rate_bp == 1275, oversight_indirect_cents == 765000, oversight_billed_cents == 6765000"
            - "After the third posting: Site.${site_id}.oversight_indirect_cents != 902500 (no marginal/blended tier arithmetic: the whole 6000000 subtotal is re-rated at 1275 bp, not 5000000 at 1550 bp plus 1000000 at 1275 bp)"
