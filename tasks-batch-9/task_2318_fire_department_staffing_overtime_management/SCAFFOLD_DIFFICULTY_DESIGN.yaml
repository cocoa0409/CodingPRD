              as: StaffingOfficer
              captures: { eng48: "$.data.id" }
            - call: "POST /fire-ops/apparatus"
              payload: { station_id: "${st48}", unit_designation: "HAZMAT-48", apparatus_type: "HAZMAT", minimum_crew_size: 1, required_certifications: ["HAZMAT_TECH"], closure_priority: 20, closure_exempt: false }
              as: StaffingOfficer
              captures: { haz48: "$.data.id" }
            - call: "POST /fire-ops/firefighters"
              payload: { station_id: "${st48}", full_name: "R Ramos", rank: "FIREFIGHTER", platoon: "C", seniority_rank: 1, kelly_day_cycle_position: 1, certifications: ["HAZMAT_TECH"], hourly_rate_cents: 4237 }
              as: StaffingOfficer
              captures: { ff48a: "$.data.id" }
            - call: "POST /fire-ops/hiring-rosters"
              payload: { station_id: "${st48}", roster_type: "VOLUNTARY_OT", certification_scope: "NONE" }
              as: StaffingOfficer
            - call: "POST /fire-ops/duty-shifts"
              payload: { station_id: "${st48}", shift_date: "2026-08-11", platoon: "C" }
              as: StaffingOfficer
              captures: { sh48: "$.data.id" }
            - call: "POST /fire-ops/duty-shifts/${sh48}/publish"
              payload: {}
              as: StaffingOfficer
            - call: "GET /fire-ops/vacancies"
              payload: { duty_shift_id: "${sh48}", apparatus_id: "${haz48}", status: "OPEN" }
              as: StaffingOfficer
              captures: { vac48haz: "$.data[0].id" }
            - call: "POST /fire-ops/vacancies/${vac48haz}/offer"
              payload: { hiring_mode: "VOLUNTARY", offer_hours: 24 }
              as: StaffingOfficer
              captures: { off48: "$.data.id" }
            - call: "GET /fire-ops/duty-shifts/${sh48}"
