        distinguishing_aspect: "A still-SETTLED donation refunded at 2026-08-31T00:00:00Z — one day past settled_at + 60 days — returns 422 ERR_REFUND_WINDOW_EXPIRED, isolating the temporal rule from the state rule."
        test_recipe:
          setup:
            - "PUBLISHED campaign with one 10000-cent gift settled at the 2026-07-01T00:00:00Z clock default; no match pool."
            - "Clock advanced to 2026-08-31T00:00:00Z, which is 61 days after settled_at."
          setup_api_calls:
            - call: "POST /api/organizations"
