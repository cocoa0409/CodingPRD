              as: BuyingPointAdmin
              captures: { bp: $.data.id }
            - call: "POST /buying-points/growers"
              payload: { name: "Grower One", farm_number: "F-1001" }
              as: BuyingPointAdmin
              captures: { g1: $.data.id }
            - { call: "POST /buying-points/warehouses", payload: { buying_point_id: "${bp}", name: "WH-G", compartment: GENERAL, capacity_tons: 2000 }, as: BuyingPointAdmin }
            - { call: "POST /buying-points/growers/${g1}/suspend", payload: {}, as: BuyingPointAdmin }
          trigger:
            - call: "POST /buying-points/loads"
              payload: { grower_id: "${g1}", crop_year: 2026 }
              as: Grower
              as_user_id: "${g1}"
              captures: { e1: $.data.error_id }
            - call: "POST /buying-points/loads"
              payload: { grower_id: "${g1}", crop_year: 2026 }
              as: BuyingPointAdmin
              captures: { e2: $.data.error_id }
            - { call: "POST /buying-points/growers/${g1}/reinstate", payload: {}, as: BuyingPointAdmin }
            - call: "POST /buying-points/loads"
              payload: { grower_id: "${g1}", crop_year: 2026 }
              as: Grower
              as_user_id: "${g1}"
              captures: { load_ok: $.data.id }
          assert:
            - "Grower-role create while SUSPENDED: error_id == ERR_GROWER_SUSPENDED (409)"
            - "Admin-role create while SUSPENDED: error_id == ERR_GROWER_SUSPENDED (role-independent gate)"
            - "After reinstate: create succeeds, FarmerStockLoad.${load_ok}.status == REPORTED and Grower.${g1}.no_show_strikes == 0"

  # ---------------------------------------------------------------- Rule 8
  - rule_id: resource_temporal_overlap
    instances:
      - name: dryer_half_open_adjacency_allowed
        grounds:
          - validations[priority=9]
          - errors[ERR_DRYER_OVERLAP]
          - entities.DryerBooking.fields.ends_at
        distinguishing_aspect: |
          Resource Dryer, half-open interval semantics: booking B2 whose start
          equals B1's computed end is ALLOWED (adjacency is not a conflict
          under [start, end)), while a start one hour inside the window is
          rejected — contrast the closed-interval-plus-buffer dock semantics
          of the paired instance on ShellerContract.
        test_recipe:
          setup:
            - "Foundation (schedule ACTIVE, WH-G 2000, dryer D1 12t/6h); grower G1; loads B1/B2/B3 each 24.0t graded at moisture 11.2 => drying REQUIRED (each booking spans 2 cycles = 12h)"
