            - call: "POST /rescreen-appointments"
              payload: { episode_id: "${ep_w2_id}", slot_id: "${slot_w3_id}" }
              as: ProgramAdmin
              captures: { appt_w3_id: "$.data.id" }
          assert:
            - "11-hour gap: HTTP 409 with data.error_id == ERR_FAMILY_BURDEN_BUFFER, measured against the ATTENDED appointment ${appt_w1_id} on slot ${slot_w1_id} — the two slot windows do not intersect at all"
            - "ClinicSlot.${slot_w2_id}.booked_count == 0 and FollowUpEpisode.${ep_w2_id}.status is still PENDING_SCHEDULING with attempt_count == 0 after the rejection"
            - "Exactly-24-hour gap: HTTP 201, RescreenAppointment.${appt_w3_id}.status == BOOKED and infant_id == ${w_id} (abs difference == 86400 s is allowed)"
            - "FollowUpEpisode.${ep_w2_id}.status == SCHEDULED with attempt_count == 1 and ClinicSlot.${slot_w3_id}.status == FULL"
            - "FollowUpEpisode.${ep_w1_id}.status == SUPERSEDED and RescreenAppointment.${appt_w1_id}.status == ATTENDED — superseding an escalated episode does not cancel an already-attended appointment"

  - rule_id: compensating_invariant
    instances:
      - name: navigation_budget_units_released_when_interpreter_appointment_cancelled
        grounds:
          - calculations.navigation_units_cost
          - entities.Facility.fields.navigation_budget_units_remaining
          - entities.NavigationTask.fields.units_reserved
          - state_machines.RescreenAppointment.BOOKED_to_CANCELLED
          - endpoints.POST_rescreen_appointments_id_close
        distinguishing_aspect: |
          Conserved quantity 1 — the facility's navigation BUDGET UNITS. Booking an interpreter
          appointment mints a task costing 2 base + 3 interpreter = 5 units and drops remaining
          from 40 to 35; cancelling the appointment cancels the task and credits the units back to
          exactly 40, with remaining + sum(units_reserved of UNASSIGNED/OPEN/COMPLETED tasks)
          == 40 at both observation points. A CANCELLED task must not keep its reservation.
        test_recipe:
          setup:
            - "BH1 (BIRTH_HOSPITAL, R1, navigation_budget_units_total 40) with screener S1 and navigator N1 (region R1, languages EN and ES); AC1 (AUDIOLOGY_CLINIC, R1) with audiologist A1."
            - "Infant T born 2026-08-02T00:00:00Z, preferred_language ES, interpreter_required true — so no language gap and an interpreter surcharge on every task."
            - "Birth screen REFERs, creating a RESCREEN episode; one RESCREEN slot exists at 2026-08-10T09:00:00Z with capacity 1."
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "BH1", facility_type: "BIRTH_HOSPITAL", region_code: "R1", navigation_budget_units_total: 40 }
              as: ProgramAdmin
              captures: { bh_id: "$.data.id" }
            - call: "POST /facilities"
              payload: { name: "AC1", facility_type: "AUDIOLOGY_CLINIC", region_code: "R1" }
              as: ProgramAdmin
              captures: { ac_id: "$.data.id" }
            - call: "POST /providers"
              payload: { facility_id: "${bh_id}", provider_type: "SCREENER", full_name: "S1", region_code: "R1" }
              as: ProgramAdmin
              captures: { s1_id: "$.data.id" }
            - call: "POST /providers"
              payload: { facility_id: "${bh_id}", provider_type: "NAVIGATOR", full_name: "N1", region_code: "R1", languages: ["EN", "ES"] }
              as: ProgramAdmin
              captures: { n1_id: "$.data.id" }
            - call: "POST /providers"
              payload: { facility_id: "${ac_id}", provider_type: "AUDIOLOGIST", full_name: "A1", region_code: "R1" }
              as: ProgramAdmin
              captures: { a1_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T06:00:00Z" }
              as: ProgramAdmin
            - call: "POST /infants"
              payload: { birth_facility_id: "${bh_id}", birth_datetime: "2026-08-02T00:00:00Z", birth_setting: "INPATIENT", gestational_age_weeks: 39, preferred_language: "ES", interpreter_required: true, guardian_name: "G-T", guardian_contact_phone: "5551401" }
              as: FacilityScreener
              as_user_id: "${s1_id}"
              captures: { t_id: "$.data.id" }
            - call: "POST /screening-encounters"
              payload: { infant_id: "${t_id}", facility_id: "${bh_id}", performed_by_provider_id: "${s1_id}", encounter_type: "BIRTH_ADMISSION", method: "AABR", performed_at: "2026-08-02T05:00:00Z", left_ear_result: "REFER", right_ear_result: "REFER" }
              as: FacilityScreener
              as_user_id: "${s1_id}"
            - call: "GET /follow-up-episodes"
              payload: { infant_id: "${t_id}", status: "PENDING_SCHEDULING" }
              as: ProgramAdmin
              captures: { ep_t_id: "$.data[0].id" }
            - call: "POST /clinic-slots"
              payload: { facility_id: "${ac_id}", provider_id: "${a1_id}", starts_at: "2026-08-10T09:00:00Z", ends_at: "2026-08-10T10:00:00Z", slot_type: "RESCREEN", total_capacity: 1 }
              as: ProgramAdmin
              captures: { slot_t_id: "$.data.id" }
          trigger:
            - call: "POST /rescreen-appointments"
              payload: { episode_id: "${ep_t_id}", slot_id: "${slot_t_id}", interpreter_needed: true }
              as: Navigator
              as_user_id: "${n1_id}"
              captures: { appt_t_id: "$.data.id", itask_id: "$.data.linked_navigation_task_id" }
            - call: "GET /facilities/${bh_id}"
              payload: {}
              as: ProgramAdmin
            - call: "POST /rescreen-appointments/${appt_t_id}/close"
              payload: { disposition: "CANCELLED", reason: "family rescheduling" }
              as: Navigator
              as_user_id: "${n1_id}"
            - call: "GET /facilities/${bh_id}"
              payload: {}
              as: ProgramAdmin
          assert:
            - "After booking: NavigationTask.${itask_id}.task_type == INTERPRETER_SESSION with units_reserved == 5 (2 base + 3 interpreter), budget_shortfall_flag == false, funding_facility_id == ${bh_id}"
            - "After booking: Facility.${bh_id}.navigation_budget_units_remaining == 35 and 35 + 5 == navigation_budget_units_total 40"
            - "After cancelling: NavigationTask.${itask_id}.status == CANCELLED and Facility.${bh_id}.navigation_budget_units_remaining == 40 — the reservation is fully released, no drift"
            - "After cancelling: RescreenAppointment.${appt_t_id}.status == CANCELLED, ClinicSlot.${slot_t_id}.booked_count == 0 and status == OPEN, FollowUpEpisode.${ep_t_id}.status == PENDING_SCHEDULING"
            - "Infant.${t_id}.ltf_risk_score == 0 after the cancel (0 setting + 0 language gap because N1 speaks ES + 0 missed + 0 age_pressure - 0 relief, the cancelled task no longer relieves)"

      - name: penalty_points_ledger_restored_exactly_when_waiver_reverses_assessment
        grounds:
          - calculations.reporting_penalty_assessment
          - entities.Facility.fields.penalty_points_balance
          - entities.FacilityReport.fields.assessed_penalty_points
          - state_machines.FacilityReport.ACCEPTED_to_PENALTY_WAIVED
          - endpoints.POST_facility_reports_id_waive_penalty
        distinguishing_aspect: |
          A DIFFERENT conserved quantity — the facility's PENALTY POINTS ledger, where
          penalty_points_balance must always equal sum(assessed_penalty_points over non-waived
          ACCEPTED reports) + manual_adjustment_points_total. A late report with variance 2 is
          assessed round_half_up(7 * 1.25) = 9 at close (WATCH), and the waiver subtracts exactly
          9 to return the balance to 0 and the posture to COMPLIANT — no partial credit, no
          re-running of the tier.
        test_recipe:
          setup:
            - "BH1 (BIRTH_HOSPITAL, R1) with screener S1 and one infant D born 2026-08-05T00:00:00Z who PASSES at birth admission (actual 1 screen / 0 refers)."
            - "ReportingPeriod August [2026-08-01T00:00:00Z, 2026-09-01T00:00:00Z) with submission_due_datetime 2026-09-02T00:00:00Z."
            - "BH1 files on 2026-09-03T00:00:00Z — after the due date, so submitted_late is true — attesting 3 screens / 0 refers, i.e. variance_case_count 2 and base_points 2*2 + 3 = 7."
            - "Auditor 'auditor-1' ACCEPTs the report while the period is still OPEN; the period is then closed on 2026-09-04T00:00:00Z."
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "BH1", facility_type: "BIRTH_HOSPITAL", region_code: "R1" }
              as: ProgramAdmin
              captures: { bh_id: "$.data.id" }
            - call: "POST /providers"
              payload: { facility_id: "${bh_id}", provider_type: "SCREENER", full_name: "S1", region_code: "R1" }
              as: ProgramAdmin
              captures: { s1_id: "$.data.id" }
            - call: "POST /reporting-periods"
              payload: { period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z", submission_due_datetime: "2026-09-02T00:00:00Z" }
              as: ProgramAdmin
              captures: { per_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T06:00:00Z" }
              as: ProgramAdmin
            - call: "POST /infants"
              payload: { birth_facility_id: "${bh_id}", birth_datetime: "2026-08-05T00:00:00Z", birth_setting: "INPATIENT", gestational_age_weeks: 39, guardian_name: "G-D", guardian_contact_phone: "5551501" }
              as: FacilityScreener
              as_user_id: "${s1_id}"
              captures: { d_id: "$.data.id" }
            - call: "POST /screening-encounters"
              payload: { infant_id: "${d_id}", facility_id: "${bh_id}", performed_by_provider_id: "${s1_id}", encounter_type: "BIRTH_ADMISSION", method: "OAE", performed_at: "2026-08-05T04:00:00Z", left_ear_result: "PASS", right_ear_result: "PASS" }
              as: FacilityScreener
              as_user_id: "${s1_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-03T00:00:00Z" }
              as: ProgramAdmin
            - call: "GET /facilities/${bh_id}"
              payload: {}
              as: FacilityAdmin
              as_user_id: "${bh_id}"
              captures: { bh_ver: "$.data.version" }
            - call: "POST /facility-reports"
              payload: { facility_id: "${bh_id}", reporting_period_id: "${per_id}", attested_screened_count: 3, attested_refer_count: 0, expected_facility_version: "${bh_ver}" }
              as: FacilityAdmin
              as_user_id: "${bh_id}"
              captures: { rep_d_id: "$.data.id" }
            - call: "POST /facility-reports/${rep_d_id}/review"
              payload: { decision: "ACCEPT", note: "variance acknowledged" }
              as: ProgramAuditor
              as_user_id: "auditor-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-04T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /reporting-periods/${per_id}/close"
              payload: {}
              as: ProgramAdmin
          trigger:
            - call: "GET /facilities/${bh_id}"
              payload: {}
              as: ProgramAdmin
            - call: "POST /facility-reports/${rep_d_id}/waive-penalty"
              payload: { waiver_reason: "documented data-system outage during the reporting window" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "GET /facilities/${bh_id}"
              payload: {}
              as: ProgramAdmin
          assert:
            - "Before the waiver: FacilityReport.${rep_d_id}.submitted_late == true, variance_case_count == 2, assessed_penalty_points == 9 (round_half_up(7 * 1.25) = round_half_up(8.75))"
            - "Before the waiver: Facility.${bh_id}.penalty_points_balance == 9 and reporting_compliance_status == WATCH, and the ledger reconciles: 9 == 9 assessed + 0 manual_adjustment_points_total"
            - "After the waiver: FacilityReport.${rep_d_id}.status == PENALTY_WAIVED with waiver_reason stored and assessed_penalty_points still 9 (the assessment is not erased, only its ledger effect)"
            - "After the waiver: Facility.${bh_id}.penalty_points_balance == 0 and reporting_compliance_status == COMPLIANT, and the ledger reconciles: 0 == 0 non-waived assessed + 0 manual"
            - "Facility.${bh_id}.version incremented by the waiver, and a second waive attempt by the accepting operator 'auditor-1' is irrelevant here because ProgramAdmin 'admin-1' != accepted_by_user_id"
