              as: BureauCoordinator
              captures: { hotel_a_id: $.data.id }
            - call: "POST /housing/hotels"
              payload: { name: "Airport Inn", distance_to_venue_miles: 4.5, room_tax_pct: 0.12, total_rooms: 120 }
