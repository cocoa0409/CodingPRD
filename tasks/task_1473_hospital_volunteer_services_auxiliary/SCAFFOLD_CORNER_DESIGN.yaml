  # ===========================================================================
  - section: calculations
    instances:
      - name: posture_grace_window_clock_positions
        claim_type: correct_result
        grounds:
          - calculations.compliance_posture
        distinguishing_aspect: "Posture is a pure function of expires_at + logical clock with INCLUSIVE 30-day windows both directions: CLEAR at clearance, RESTRICTED 17 days before expiry, RESTRICTED exactly 30 days after expiry (boundary), FROZEN at 31 days after."
        test_recipe:
          setup: ["Volunteer approved (ONBOARDING); BACKGROUND/HEALTH_TB/HEALTH_FLU all CLEARED adjudicated at 2026-08-01T00:00:00Z (TB/FLU expire 2027-08-01T00:00:00Z, BG 2028-08-01T00:00:00Z)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: VolunteerServicesDirector }
            - { call: "POST /auxiliary/volunteer-applications", payload: { full_name: "Posture Pat", date_of_birth: "1990-01-01", email: "pp@x.org", phone: "555-9501" }, as: VolunteerCoordinator, captures: { app: $.data.id } }
            - { call: "POST /auxiliary/volunteer-applications/${app}/start-review", as: VolunteerCoordinator }
            - { call: "POST /auxiliary/volunteer-applications/${app}/decide", payload: { decision: "APPROVE" }, as: VolunteerServicesDirector, captures: { v_id: $.data.volunteer_id } }
            - { call: "POST /auxiliary/clearances", payload: { volunteer_id: "${v_id}", clearance_type: "BACKGROUND", document_ref: "bg-1" }, as: Screener, as_user_id: "screener-1", captures: { c1: $.data.id } }
            - { call: "POST /auxiliary/clearances/${c1}/adjudicate", payload: { decision: "CLEARED" }, as: Screener, as_user_id: "screener-2" }
            - { call: "POST /auxiliary/clearances", payload: { volunteer_id: "${v_id}", clearance_type: "HEALTH_TB", document_ref: "tb-1" }, as: Screener, as_user_id: "screener-1", captures: { c2: $.data.id } }
            - { call: "POST /auxiliary/clearances/${c2}/adjudicate", payload: { decision: "CLEARED" }, as: Screener, as_user_id: "screener-2" }
            - { call: "POST /auxiliary/clearances", payload: { volunteer_id: "${v_id}", clearance_type: "HEALTH_FLU", document_ref: "fl-1" }, as: Screener, as_user_id: "screener-1", captures: { c3: $.data.id } }
            - { call: "POST /auxiliary/clearances/${c3}/adjudicate", payload: { decision: "CLEARED" }, as: Screener, as_user_id: "screener-2" }
          trigger:
            - { call: "GET /auxiliary/volunteers/${v_id}/summary", as: VolunteerCoordinator, captures: { p_clear: $.data.compliance_posture } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-07-15T00:00:00Z" }, as: VolunteerServicesDirector }
            - { call: "GET /auxiliary/volunteers/${v_id}/summary", as: VolunteerCoordinator, captures: { p_soon: $.data.compliance_posture } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-08-31T00:00:00Z" }, as: VolunteerServicesDirector }
            - { call: "GET /auxiliary/volunteers/${v_id}/summary", as: VolunteerCoordinator, captures: { p_grace: $.data.compliance_posture } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-09-01T00:00:00Z" }, as: VolunteerServicesDirector }
            - { call: "GET /auxiliary/volunteers/${v_id}/summary", as: VolunteerCoordinator, captures: { p_frozen: $.data.compliance_posture } }
          assert:
            - "2026-08-01: posture == CLEAR"
            - "2027-07-15 (17 days before TB/FLU expiry, inside EXPIRING_SOON 30d): posture == RESTRICTED"
            - "2027-08-31 (exactly expires_at + 30 days, grace INCLUSIVE): posture == RESTRICTED"
            - "2027-09-01 (31 days past expiry): posture == FROZEN"

      - name: service_year_hours_no_show_penalty_math
        claim_type: correct_result
        grounds:
          - calculations.service_year_hours
        distinguishing_aspect: "Pinned evaluation order: 5.00 approved hours minus 2 x 2.0 NO_SHOW penalties = 1.00 (not floored — distinct from the floor case in shift_complete_no_show_reconciliation). NO_SHOW rows are selected by Shift.end_at inside the service-year window."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; volunteer V fully ACTIVE"
            - "Shifts S1 2026-08-03 08:00-12:00 and S2 2026-08-04 08:00-12:00 PUBLISHED; V CONFIRMED on both; no entries logged for either"
            - "Both shifts completed at clock 2026-08-05T00:00:00Z (two NO_SHOWs); entry E: 300 min GIFT_SHOP on 2026-08-05"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: VolunteerServicesDirector }
