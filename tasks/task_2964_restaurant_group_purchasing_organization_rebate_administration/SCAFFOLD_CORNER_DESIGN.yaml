      - name: accrue_skips_unaccruable_lines_instead_of_failing_the_batch
        claim_type: bulk_action
        grounds:
          - endpoints["POST /purchase-batches/{batch_id}/accrue"]
          - calculations.rate_card_selection
          - validations[priority=36]
        distinguishing_aspect: |
          Accrue is all-or-skip, not all-or-nothing: with two accruable lines, one
          MATCHED line whose invoice date no APPROVED card covers, and one
          UNMATCHED line, the call must return 200, create exactly two accruals,
          stamp NO_RATE_CARD on the third and still move the batch to ACCRUED. A
          transactional implementation would either 422 the whole batch or create
          a zero-value accrual for the skipped lines.
