      - name: invoice_state_check_precedes_the_matter_budget_check
        claim_type: priority_conflict
        grounds:
          - validations[priority=8]
          - validations[priority=26]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / invoice_state_precedence_over_budget_cap
          rationale: "The named §1.8 instance drives an invoice into ADJUSTED with an allowed amount that also blows the budget cap and asserts ERR_INVOICE_NOT_APPROVABLE rather than ERR_BUDGET_CAP_EXCEEDED, which is exactly this priority pair."

      - name: assessment_creation_depends_on_the_rate_plan_state
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=9]
          - errors.ERR_RATE_PLAN_NOT_ACTIVE
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / assessment_creation_gated_by_rate_plan_draft_state
          rationale: "The named §1.8 instance refuses an assessment against a DRAFT rate plan and then succeeds unchanged after activation, covering both the invalid and valid sides of the cross-entity dependency."

      - name: risk_service_windows_must_clear_the_thirty_day_buffer
        claim_type: temporal_validation
        grounds:
          - validations[priority=18]
          - errors.ERR_SERVICE_WINDOW_CONFLICT
        excluded_because:
          difficulty_instance: resource_temporal_overlap / risk_service_half_open_window_with_thirty_day_buffer
          rationale: "The named §1.8 instance walks the buffered half-open boundary day by day, which subsumes any single temporal-conflict probe of this rule."

      - name: panel_capacity_is_evaluated_over_overlapping_windows
        claim_type: aggregate_validation
        grounds:
          - validations[priority=20]
          - errors.ERR_PANEL_CAPACITY_EXCEEDED
        excluded_because:
          difficulty_instance: resource_temporal_overlap / panel_firm_window_scoped_capacity_of_two
          rationale: "The named §1.8 instance fills a capacity of two with overlapping engagements, refuses the third client-directed request and then frees a slot by closing one, which is the aggregate claim for this rule."

      - name: third_party_election_is_checked_before_the_policy_period
        claim_type: conditional_validation
        grounds:
          - validations[priority=12]
          - validations[priority=13]
          - errors.ERR_THIRD_PARTY_COVERAGE_NOT_ELECTED
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / third_party_election_precedence_over_policy_period
          rationale: "The named §1.8 instance reports a CUSTOMER claim outside the period on a policy without the third-party election and asserts ERR_THIRD_PARTY_COVERAGE_NOT_ELECTED, covering the with-flag and without-flag behaviour together with the priority pair."

      - name: segregation_of_duties_is_checked_before_the_retention_gate
        claim_type: cascading_validation
        grounds:
          - validations[priority=10]
          - validations[priority=25]
          - errors.ERR_SEGREGATION_OF_DUTIES
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / sod_precedence_over_retention_not_satisfied
          rationale: "The named §1.8 instance has the auditing user approve an invoice on a claim whose retention is unsatisfied and asserts ERR_SEGREGATION_OF_DUTIES, pinning the order in which the two checks run."

