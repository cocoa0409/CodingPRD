            - "LoanerAssignment.${asg_id}.selected_by == SERVER_SELECTED"
            - "LoanerAssignment.${asg_id}.status == RESERVED"
            - "LoanerUnit.${loaner_c}.status == RESERVED"
            - "LoanerUnit.${loaner_c}.assignment_count == 1"
            - "LoanerUnit.${loaner_a}.status == AVAILABLE"
            - "LoanerUnit.${loaner_b}.status == AVAILABLE"
            - "LoanerUnit.${loaner_d}.status == AVAILABLE"

      - name: service_age_diverges_between_the_two_age_basis_variants
        claim_type: Variant Divergence
        grounds:
          - calculations.unit_service_age.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / unit_service_age_manufacture_vs_season_basis_diverge
          rationale: "That instance runs both variants on manufacture_date 2016-09-15 and asserts 9/false vs 10/true plus the condemn_required flip."

      - name: settlement_rounding_order_diverges_between_the_two_variants
        claim_type: Variant Divergence
        grounds:
          - calculations.shipment_settlement_total.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / shipment_settlement_provisional_vs_final_rounding_order_diverge
          rationale: "That instance asserts provisional 21678 vs final 21679 and the 1-cent delta surviving the discount tier and the surcharge."

      - name: weighted_site_terms_are_capped_before_they_are_summed
        claim_type: Correct Result
        grounds:
          - calculations.shell_test_severity_index.constants.SITE_CONTRIBUTION_CAP
        excluded_because:
          difficulty_instance: combinatorial_formula / severity_index_per_site_cap_applied_before_summation
          rationale: "That instance uses 400/600/900 g to prove the capped 450.0 result rather than the uncapped 560.0."

      - name: settlement_discount_tier_is_chosen_from_gross_cents
        claim_type: Variant Selection
        grounds:
          - calculations.shipment_settlement_total.formula
          - calculations.turnaround_commitment.formula
        excluded_because:
          difficulty_instance: combinatorial_formula / settlement_tier_selected_from_gross_then_surcharge_on_net
          rationale: "That instance asserts provisional 16058 with the tier chosen from gross and the surcharge charged on net, alongside the clamped STANDARD due date."

      - name: severity_index_pass_band_boundary_is_inclusive
        claim_type: Precision
        grounds:
          - calculations.shell_test_severity_index.formula
        excluded_because:
          difficulty_instance: boundary_precision_check / severity_index_exactly_at_pass_limit_is_inclusive_pass
          rationale: "That instance pins 300.0 == pass_si_max to PASS and 302.0 to REPAIR."

      - name: part_buckets_always_resum_to_received_qty
        claim_type: Correct Result
        grounds:
          - calculations.part_stock_ledger.invariant
        excluded_because:
          difficulty_instance: compensating_invariant / part_stock_buckets_sum_to_received_across_reserve_install_cancel
          rationale: "That instance walks reserve, install and cancel and re-sums on_hand + reserved + consumed to received_qty 10 after every step."

      - name: disposition_counters_always_resum_to_counted_unit_count
        claim_type: Correct Result
        grounds:
          - calculations.shipment_unit_disposition_ledger.invariant
        excluded_because:
          difficulty_instance: compensating_invariant / shipment_disposition_ledger_sums_to_counted_after_void_and_release
          rationale: "That instance re-sums the four disposition counters to counted_unit_count 2 after a certify, a void and a release."

  # ===========================================================================
  - section: validations
    instances:

      - name: identify_a_unit_against_a_discontinued_model_rejected
        claim_type: Violation → Error
        grounds:
          - validations.v-model-reconditionable
          - errors.ERR_MODEL_NOT_RECONDITIONABLE
        distinguishing_aspect: |
          A ModelSpec created with reconditionable false is a shell the
          manufacturer no longer authorises for refurbishment: identify must fail
          with ERR_MODEL_NOT_RECONDITIONABLE / 422 and the unit must stay in
          RECEIVED with model_spec_id null, so it can never enter the test flow.
        test_recipe:
          setup:
            - "one ACCEPTED shipment with one registered unit and a ModelSpec whose reconditionable is false"
          setup_api_calls:
            - *k_clock
            - *k_acct
            - *k_waiver
            - call: "POST /model-specs"
              payload: { manufacturer: "Riddell", model_code: "XX-1998", standard_code: "ND002", shell_material: "POLYCARBONATE", max_service_life_years: 10, warranty_years: 5, record_retention_years: 3, pass_si_max: 300.0, repair_si_max: 360.0, max_retest_count: 3, reconditionable: false, required_component_codes: ["SHELL"], component_criteria: [{ code: "SHELL", metric: "crack_length_mm", metric_direction: "HIGHER_IS_WORSE", replace_threshold: 4.0, fail_threshold: 6.0, unit: "mm" }] }
              as: PlantManager
              captures: { model_dead_id: $.data.id }
            - &k_ship1
              call: "POST /intake-shipments"
              payload: { customer_account_id: "${acct_id}", sport: "FOOTBALL", service_tier: "STANDARD", declared_unit_count: 1, season_start_date: "2026-08-25T00:00:00Z", season_end_date: "2026-11-20T00:00:00Z" }
              as: IntakeClerk
              captures: { ship_id: $.data.id }
            - &k_count1
              call: "POST /intake-shipments/${ship_id}/count"
              payload: { counted_unit_count: 1 }
              as: IntakeClerk
            - &k_unit1
              call: "POST /equipment-units"
              payload: { intake_shipment_id: "${ship_id}", serial_number: "SN-0001", declared_model_code: "SF-2026" }
              as: IntakeClerk
              captures: { u1_id: $.data.id }
            - &k_accept1
              call: "POST /intake-shipments/${ship_id}/accept"
              payload: { discrepancy_resolution: "MATCHED" }
              as: IntakeClerk
          trigger:
            - call: "POST /equipment-units/${u1_id}/identify"
              payload: { model_spec_id: "${model_dead_id}", manufacture_date: "2018-09-15T00:00:00Z", age_basis: "MANUFACTURE_DATE" }
              as: IntakeClerk
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 422"
            - "response error_id == ERR_MODEL_NOT_RECONDITIONABLE"
            - "EquipmentUnit.${u1_id}.recon_status == RECEIVED"
            - "EquipmentUnit.${u1_id}.model_spec_id == null"
            - "EquipmentUnit.${u1_id}.service_age_years == null"

      - name: registering_more_units_than_were_counted_rejected
        claim_type: Violation → Error
        grounds:
          - validations.v-unit-count-cap
          - errors.ERR_UNIT_COUNT_EXCEEDED
        distinguishing_aspect: |
          The physical count is the authority: with counted_unit_count 1 already
          matched by SN-0001, registering SN-0002 must fail with
          ERR_UNIT_COUNT_EXCEEDED / 409 and units_registered must stay 1 — the
          aggregate cap is evaluated against the shipment, not the request.
        test_recipe:
          setup:
            - "one COUNTED shipment with counted_unit_count 1 and one registered unit"
          setup_api_calls:
            - *k_clock
            - *k_acct
            - *k_waiver
            - *k_model
            - *k_ship1
            - *k_count1
            - *k_unit1
          trigger:
            - call: "POST /equipment-units"
              payload: { intake_shipment_id: "${ship_id}", serial_number: "SN-0002", declared_model_code: "SF-2026" }
              as: IntakeClerk
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 409"
            - "response error_id == ERR_UNIT_COUNT_EXCEEDED"
            - "IntakeShipment.${ship_id}.units_registered == 1"
            - "IntakeShipment.${ship_id}.status == COUNTED"
            - "GET /equipment-units?intake_shipment_id=${ship_id} returns total_count 1"

      - name: accept_before_every_counted_unit_is_registered_rejected
        claim_type: Violation → Error
        grounds:
          - validations.v-unit-registration-complete
          - errors.ERR_UNIT_REGISTRATION_INCOMPLETE
        distinguishing_aspect: |
          Acceptance is the point where the plant takes custody of a known
          inventory, so units_registered 1 against counted_unit_count 2 must fail
          with ERR_UNIT_REGISTRATION_INCOMPLETE / 409, leaving the shipment in
          COUNTED with accepted_at, committed_due_at and provisional_total_cents
          all still null.
        test_recipe:
          setup:
            - "one COUNTED shipment with counted_unit_count 2 but only SN-0001 registered"
          setup_api_calls:
            - *k_clock
            - *k_acct
            - *k_waiver
            - *k_model
            - call: "POST /intake-shipments"
              payload: { customer_account_id: "${acct_id}", sport: "FOOTBALL", service_tier: "STANDARD", declared_unit_count: 2, season_start_date: "2026-08-25T00:00:00Z", season_end_date: "2026-11-20T00:00:00Z" }
              as: IntakeClerk
              captures: { ship_id: $.data.id }
            - call: "POST /intake-shipments/${ship_id}/count"
              payload: { counted_unit_count: 2 }
              as: IntakeClerk
            - *k_unit1
          trigger:
            - call: "POST /intake-shipments/${ship_id}/accept"
              payload: { discrepancy_resolution: "MATCHED" }
              as: IntakeClerk
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 409"
            - "response error_id == ERR_UNIT_REGISTRATION_INCOMPLETE"
            - "IntakeShipment.${ship_id}.status == COUNTED"
            - "IntakeShipment.${ship_id}.units_registered == 1"
            - "IntakeShipment.${ship_id}.accepted_at == null"
            - "IntakeShipment.${ship_id}.committed_due_at == null"
            - "IntakeShipment.${ship_id}.provisional_total_cents == null"
            - "CustomerAccount.${acct_id}.open_shipment_count == 0"

      - name: duplicate_serial_under_the_same_account_rejected
        claim_type: Violation → Error
        grounds:
          - validations.v-serial-unique-per-account
          - errors.ERR_SERIAL_DUPLICATE
        distinguishing_aspect: |
          Uniqueness is scoped to the owning CustomerAccount, not to the
          shipment: SN-0001 registered under shipment A blocks SN-0001 under
          shipment B of the same account with ERR_SERIAL_DUPLICATE / 409, so a
          school cannot end up with two traceability histories for one shell.
        test_recipe:
          setup:
            - "one account with shipment A (counted 1) holding SN-0001, and a second COUNTED shipment B (counted 1) with nothing registered"
          setup_api_calls:
            - *k_clock
            - *k_acct
            - *k_waiver
            - *k_model
            - *k_ship1
            - *k_count1
            - *k_unit1
            - call: "POST /intake-shipments"
              payload: { customer_account_id: "${acct_id}", sport: "FOOTBALL", service_tier: "STANDARD", declared_unit_count: 1, season_start_date: "2026-08-25T00:00:00Z", season_end_date: "2026-11-20T00:00:00Z" }
              as: IntakeClerk
              captures: { ship_b_id: $.data.id }
            - call: "POST /intake-shipments/${ship_b_id}/count"
              payload: { counted_unit_count: 1 }
              as: IntakeClerk
          trigger:
            - call: "POST /equipment-units"
              payload: { intake_shipment_id: "${ship_b_id}", serial_number: "SN-0001", declared_model_code: "SF-2026" }
              as: IntakeClerk
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 409"
            - "response error_id == ERR_SERIAL_DUPLICATE"
            - "IntakeShipment.${ship_b_id}.units_registered == 0"
            - "GET /equipment-units?intake_shipment_id=${ship_b_id} returns total_count 0"

      - name: the_same_serial_under_a_different_account_is_accepted
        claim_type: Satisfaction → Pass
        grounds:
          - validations.v-serial-unique-per-account
        distinguishing_aspect: |
          The mirror of the duplicate-serial rule: SN-0001 already exists under
          Northside High, but a shipment belonging to Eastview Prep may register
          its own SN-0001 and get 201 — an implementation that made the serial
          globally unique would wrongly reject a different school's equipment.
        test_recipe:
          setup:
            - "Northside High with shipment A (counted 1) holding SN-0001"
            - "a second CustomerAccount Eastview Prep with its own COUNTED shipment (counted 1)"
          setup_api_calls:
            - *k_clock
            - *k_acct
            - *k_waiver
            - *k_model
            - *k_ship1
            - *k_count1
            - *k_unit1
            - call: "POST /customer-accounts"
              payload: { org_name: "Eastview Prep", org_type: "SCHOOL", sport: "FOOTBALL", contact_email: "ad@eastview.example" }
              as: PlantManager
              captures: { acct2_id: $.data.id }
            - call: "POST /intake-shipments"
              payload: { customer_account_id: "${acct2_id}", sport: "FOOTBALL", service_tier: "STANDARD", declared_unit_count: 1, season_start_date: "2026-08-25T00:00:00Z", season_end_date: "2026-11-20T00:00:00Z" }
              as: IntakeClerk
              captures: { ship_c_id: $.data.id }
            - call: "POST /intake-shipments/${ship_c_id}/count"
              payload: { counted_unit_count: 1 }
              as: IntakeClerk
          trigger:
            - call: "POST /equipment-units"
              payload: { intake_shipment_id: "${ship_c_id}", serial_number: "SN-0001", declared_model_code: "SF-2026" }
              as: IntakeClerk
              captures: { u_other_id: $.data.id }
          assert:
            - "HTTP 201"
            - "EquipmentUnit.${u_other_id}.serial_number == SN-0001"
            - "EquipmentUnit.${u_other_id}.recon_status == RECEIVED"
            - "IntakeShipment.${ship_c_id}.units_registered == 1"
            - "IntakeShipment.${ship_id}.units_registered == 1"

      - name: booking_a_shell_test_before_the_required_inspections_rejected
        claim_type: Cascading validation
        grounds:
          - validations.v-inspection-complete-before-test
          - errors.ERR_INSPECTION_INCOMPLETE
        distinguishing_aspect: |
          v-inspection-complete-before-test (67) is a cascading check: it reads
          the rollup produced by the component-inspection calculation, so a unit
          disassembled but never inspected has inspection_verdict_summary PENDING
          and POST /shell-tests must fail with ERR_INSPECTION_INCOMPLETE / 409
          even though the bench is calibrated and the window is free.
        test_recipe:
          setup:
            - "one unit identified and disassembled, with no ComponentInspection rows"
            - "one calibrated TestBench"
          setup_api_calls:
            - *k_clock
            - *k_acct
            - *k_waiver
            - *k_model
            - *k_ship1
            - *k_count1
            - *k_unit1
            - *k_accept1
            - &k_ident18
              call: "POST /equipment-units/${u1_id}/identify"
              payload: { model_spec_id: "${model_id}", manufacture_date: "2018-09-15T00:00:00Z", age_basis: "MANUFACTURE_DATE" }
              as: IntakeClerk
            - &k_disasm
              call: "POST /equipment-units/${u1_id}/disassemble"
              payload: {}
              as: Technician
              as_user_id: "tech-1"
            - *k_bench
            - *k_cal
          trigger:
            - call: "POST /shell-tests"
              payload: { equipment_unit_id: "${u1_id}", test_bench_id: "${bench_id}", window_start: "2026-08-01T09:00:00Z", window_end: "2026-08-01T10:00:00Z", conditioning: "AMBIENT" }
              as: Technician
              as_user_id: "tech-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 409"
            - "response error_id == ERR_INSPECTION_INCOMPLETE"
            - "EquipmentUnit.${u1_id}.inspection_verdict_summary == PENDING"
            - "EquipmentUnit.${u1_id}.recon_status == DISASSEMBLED"
            - "EquipmentUnit.${u1_id}.retest_count == 0"
            - "GET /shell-tests?equipment_unit_id=${u1_id} returns total_count 0"

      - name: a_second_inspection_for_the_same_component_rejected
        claim_type: Violation → Error
        grounds:
          - validations.v-no-duplicate-inspection
          - errors.ERR_DUPLICATE_INSPECTION
        distinguishing_aspect: |
          ComponentInspection rows are immutable, so re-measuring SHELL on the
          same unit must fail with ERR_DUPLICATE_INSPECTION / 409 rather than
          overwrite the recorded verdict; the original PASS row and the CLEAR
          rollup survive untouched.
        test_recipe:
          setup:
            - "one disassembled unit with one SHELL inspection at 1.50 mm (verdict PASS)"
          setup_api_calls:
            - *k_clock
            - *k_acct
            - *k_waiver
            - *k_model
            - *k_ship1
            - *k_count1
            - *k_unit1
            - *k_accept1
            - *k_ident18
            - *k_disasm
            - &k_insp_ok
              call: "POST /equipment-units/${u1_id}/inspections"
              payload: { component_code: "SHELL", measurement_value: 1.50, measurement_unit: "mm", note: "no crown cracking" }
              as: Technician
              as_user_id: "tech-1"
              captures: { insp1_id: $.data.id }
          trigger:
            - call: "POST /equipment-units/${u1_id}/inspections"
              payload: { component_code: "SHELL", measurement_value: 5.00, measurement_unit: "mm", note: "second look" }
              as: Technician
              as_user_id: "tech-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 409"
            - "response error_id == ERR_DUPLICATE_INSPECTION"
            - "ComponentInspection.${insp1_id}.measurement_value == 1.50"
            - "ComponentInspection.${insp1_id}.verdict == PASS"
            - "EquipmentUnit.${u1_id}.inspection_verdict_summary == CLEAR"
            - "EquipmentUnit.${u1_id}.condemn_required == false"
            - "GET /equipment-units/${u1_id}/inspections returns total_count 1"

      - name: signing_pass_on_a_unit_flagged_for_condemnation_rejected
        claim_type: Cross-entity validation
        grounds:
          - validations.v-condemn-required-blocks-certification
          - errors.ERR_CONDEMN_REQUIRED
          - calculations.component_inspection_verdict.downstream_effects
        distinguishing_aspect: |
          The impact rig says PASS (severity_index 300.0) but a SHELL inspection
          at 6.50 mm (>= fail_threshold 6.0) already set condemn_required, and
          v-condemn-required-blocks-certification (61) outranks the
          determination-consistency rule: signing PASS must fail with
          ERR_CONDEMN_REQUIRED / 422 and leave the unit in TESTED. Only a CONDEMN
          determination can close this unit out.
        test_recipe:
          setup:
            - "one unit whose SHELL inspection measured 6.50 mm -> verdict FAIL, inspection_verdict_summary FAIL, condemn_required true"
            - "a COMPLETED shell test on that unit with computed_result PASS"
          setup_api_calls:
            - *k_clock
            - *k_acct
            - *k_waiver
            - *k_model
            - *k_ship1
            - *k_count1
            - *k_unit1
            - *k_accept1
            - *k_ident18
            - *k_disasm
            - call: "POST /equipment-units/${u1_id}/inspections"
              payload: { component_code: "SHELL", measurement_value: 6.50, measurement_unit: "mm", note: "crown crack beyond the fail limit" }
              as: Technician
              as_user_id: "tech-1"
            - *k_bench
            - *k_cal
            - &k_test1
              call: "POST /shell-tests"
              payload: { equipment_unit_id: "${u1_id}", test_bench_id: "${bench_id}", window_start: "2026-08-01T09:00:00Z", window_end: "2026-08-01T10:00:00Z", conditioning: "AMBIENT" }
              as: Technician
              as_user_id: "tech-1"
              captures: { t1_id: $.data.id }
            - &k_impacts_pass
              call: "POST /shell-tests/${t1_id}/record-impacts"
              payload: { peak_g_front: 300, peak_g_side: 300, peak_g_crown: 300 }
              as: Technician
              as_user_id: "tech-1"
          trigger:
            - call: "POST /shell-tests/${t1_id}/determine"
              payload: { determination: "PASS" }
              as: CertifyingInspector
              as_user_id: "insp-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 422"
            - "response error_id == ERR_CONDEMN_REQUIRED"
            - "EquipmentUnit.${u1_id}.condemn_required == true"
            - "EquipmentUnit.${u1_id}.inspection_verdict_summary == FAIL"
            - "EquipmentUnit.${u1_id}.recon_status == TESTED"
            - "ShellTest.${t1_id}.status == COMPLETED"
            - "ShellTest.${t1_id}.computed_result == PASS"
            - "ShellTest.${t1_id}.determination == null"

      - name: a_determination_that_contradicts_the_rig_without_a_reason_rejected
        claim_type: Violation → Error
        grounds:
          - validations.v-determination-consistency
          - errors.ERR_DETERMINATION_MISMATCH
        distinguishing_aspect: |
          computed_result PASS with determination REPAIR and no override_reason is
          an unexplained deviation: ERR_DETERMINATION_MISMATCH / 422, ShellTest
          stays COMPLETED with determination null. The same call with an
          override_reason would be accepted (that is the escalation path), so the
          rule keys on the missing justification, not on the values.
        test_recipe:
          setup:
            - "one COMPLETED shell test with computed_result PASS on a unit with condemn_required false"
          setup_api_calls:
            - *k_clock
            - *k_acct
            - *k_waiver
            - *k_model
            - *k_ship1
            - *k_count1
            - *k_unit1
            - *k_accept1
            - *k_ident18
            - *k_disasm
            - *k_insp_ok
            - *k_bench
            - *k_cal
            - *k_test1
            - *k_impacts_pass
          trigger:
            - call: "POST /shell-tests/${t1_id}/determine"
              payload: { determination: "REPAIR" }
              as: CertifyingInspector
              as_user_id: "insp-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 422"
            - "response error_id == ERR_DETERMINATION_MISMATCH"
            - "ShellTest.${t1_id}.status == COMPLETED"
            - "ShellTest.${t1_id}.computed_result == PASS"
            - "ShellTest.${t1_id}.determination == null"
            - "ShellTest.${t1_id}.determined_at == null"
            - "EquipmentUnit.${u1_id}.recon_status == TESTED"

      - name: an_override_cannot_downgrade_a_repair_result_to_pass
        claim_type: Violation → Error
        grounds:
          - validations.v-determination-override-direction
          - errors.ERR_DETERMINATION_UPGRADE_FORBIDDEN
        distinguishing_aspect: |
          The override is one-directional under PASS < REPAIR < CONDEMN: with
          computed_result REPAIR (severity_index 310.0 from 300/340/290 g) a
          signed PASS plus a reason must fail with
          ERR_DETERMINATION_UPGRADE_FORBIDDEN / 422 — an inspector may be
          stricter than the rig, never more lenient — while the same override
          shape pointing at CONDEMN is legal.
        test_recipe:
          setup:
            - "one COMPLETED shell test whose computed_result is REPAIR (severity_index 310.0)"
          setup_api_calls:
            - *k_clock
            - *k_acct
            - *k_waiver
            - *k_model
            - *k_ship1
            - *k_count1
