            - { call: "POST /score-sheets", payload: { registration_id: "${r1}", criteria_scores: [{ criterion: "EXTERIOR", points: 9 }, { criterion: "INTERIOR", points: 8 }, { criterion: "ENGINE", points: 8 }, { criterion: "AUTHENTICITY", points: 9 }, { criterion: "CONDITION", points: 8 }] }, as: Judge, as_user_id: "${j1}", captures: { s1: $.data.id } }
          trigger:
            - { call: "POST /score-sheets/${s1}/submit", payload: {}, as: Judge, as_user_id: "${j1}", captures: { st1: $.data.status } }
            - { call: "POST /score-sheets/${s1}/reopen", payload: { reason: "math error" }, as: Organizer, captures: { st2: $.data.status } }
            - { call: "POST /score-sheets/${s1}/submit", payload: {}, as: Judge, as_user_id: "${j1}", captures: { st3: $.data.status } }
            - { call: "GET /events/${ev}", payload: {}, as: Organizer, captures: { life: $.data.lifecycle_status } }
          assert:
