  # Rule 3 — non_linear_state_machine (different entities)
  - rule_id: non_linear_state_machine
    instances:
      - name: dq_branching_protest_paths
        grounds:
          - state_machines.Disqualification.COACH_NOTIFIED_to_PROTESTED
          - state_machines.Disqualification.PROTESTED_to_UPHELD
          - state_machines.Disqualification.PROTESTED_to_OVERTURNED
          - state_machines.Disqualification.UPHELD_to_CONFIRMED
        distinguishing_aspect: |
          Disqualification is a branching fork-join machine: two DQs recorded identically diverge at
          PROTESTED — one reaches CONFIRMED via UPHELD (entry becomes DQ), the other OVERTURNED
          (entry never leaves SEEDED) — a non-linear shape on a different entity than LaneAssignment.
        test_recipe:
          setup:
            - "Event IN_PROGRESS; two lanes AUTO_CONFIRMED; judge holds CONFIRMED STROKE_TURN_JUDGE assignment; clock at 2026-08-15T10:00:00Z for notification"
