  - rule_id: combinatorial_formula
    instances:
      - name: defect_score_rounds_per_severity_before_summing
        grounds:
          - calculations.severity_weighted_defect_score
          - calculations.format_revision_window
          - entities.FormatReview.fields.severity_weighted_defect_score
          - entities.FormatReview.fields.turnaround_bdays
          - state_machines.FormatReview.PENDING_REVIEW_to_REVISIONS_REQUIRED
        distinguishing_aspect: |
          The score composes four sub-results in a pinned order — density_factor at 4 decimals,
          then three independently rounded per-severity terms at 2 decimals, then their sum — so
          page_count 101 with counts 1/2/4 must yield exactly 8.17; the unsanctioned order (sum
          the three raw products, round once) yields 8.18, and the same request also
          composes the cycle-1 revision window and the business-day turnaround from two other
          calculations.
        test_recipe:
          setup:
            - "Term 2026FA is OPEN with format_review_deposit_deadline 2026-12-04T17:00:00Z."
            - "A MASTERS candidate's THESIS of 101 pages has a HELD_PASS defense and a PENDING_REVIEW cycle-1 FormatReview opened at 2026-10-05T09:00:00Z."
            - "Thesis.format_cycle_count is 1 and analyst_turnaround_bdays_total is 0."
            - "The logical clock stands at 2026-10-12T09:00:00Z — 5 business days after the cycle opened."
          setup_api_calls:
            - call: "POST /graduate-school/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: Registrar
              as_user_id: "reg-1"
            - call: "POST /graduate-school/terms"
              payload: { code: "2026FA", defense_deadline: "2026-11-13T23:59:59Z", format_review_deposit_deadline: "2026-12-04T17:00:00Z", degree_conferral_date: "2026-12-18T00:00:00Z", announcement_lead_business_days: 10 }
              as: Registrar
              as_user_id: "reg-1"
              captures: { term_id: $.data.id }
            - call: "POST /graduate-school/students"
