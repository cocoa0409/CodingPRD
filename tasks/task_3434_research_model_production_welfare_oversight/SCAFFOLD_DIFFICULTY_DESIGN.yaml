              as: LogisticsCoordinator
              captures: { ship2_id: $.data.id }
            - call: "POST /api/shipments"
              payload: { order_id: "${o3_id}", vehicle_code: "VH1", vehicle_barrier_cert: "VF", sanitized_at: "2026-10-12T09:00:00Z", departure_date: "2026-10-12T12:00:00Z", planned_arrival_date: "2026-10-13T06:00:00Z", expected_order_version: "${o3_v3}" }
              as: LogisticsCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "Shipment.${ship2_id} created with status PLANNED  (departure == shipment 1 arrival is legal under half-open windows)"
            - "Shipment.${ship2_id}.status == PLANNED"
            - "error_id == ERR_VEHICLE_SCHEDULE_CONFLICT  ([2026-10-12T12:00, 2026-10-13T06:00) overlaps shipment 2's [2026-10-12T08:00, 2026-10-13T08:00))"
            - "HTTP status == 409"

      - name: room_cage_aggregate_capacity_boundary
        grounds:
          - calculations.room_occupied_cages
          - validations[priority=8]
          - errors[ERR_CAGE_CAPACITY_EXCEEDED]
        distinguishing_aspect: |
          Aggregate-capacity interval semantics on BarrierRoom (different
          resource and different semantics than the pairwise vehicle window):
          occupancy is the SUM of concurrent colony-pair and cohort holdings;
          9 of 10 cages occupied accepts nothing requiring 2 cages, and the
          rejected write leaves occupancy untouched at 9.
        test_recipe:
          setup:
            - "Room cage_capacity 10; colony with 4 breeding pairs (4 cages); cohort1 of 13M/12F = 25 animals (ceil(25/5) = 5 cages) -> occupied 9"
          setup_api_calls:
            - call: "POST /api/facilities"
              payload: { name: "Site Alpha", site_code: "SA", registration_number: "REG-001", registration_expires_at: "2027-09-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /api/rooms"
              payload: { facility_id: "${fac_id}", room_code: "R1", barrier_level: "VF", excluded_agents: ["MHV", "MPV"], cage_capacity: 10 }
              as: FacilityManager
              captures: { room_id: $.data.id }
            - call: "POST /api/strains"
              payload: { strain_code: "C57BL6J", species: "MOUSE", immune_class: "IMMUNOCOMPETENT", breeding_type: "INBRED", min_barrier_level: "MPF", gestation_days: 21, wean_age_days: 21, typical_litter_size: 6, base_price_cents: 1000 }
              as: PlatformAdmin
              captures: { strain_id: $.data.id }
            - call: "POST /api/protocols"
              payload: { facility_id: "${fac_id}", protocol_number: "P-100", pi_name: "Dr. Xu", species: "MOUSE", approved_animal_quota: 1000, effective_date: "2026-09-01T00:00:00Z", expiration_date: "2029-09-01T00:00:00Z" }
              as: FacilityManager
              as_user_id: "fm_1"
              captures: { prot_id: $.data.id }
            - call: "POST /api/protocols/${prot_id}/transition"
              payload: { target_state: "SUBMITTED" }
              as: FacilityManager
              as_user_id: "fm_1"
            - call: "POST /api/protocols/${prot_id}/transition"
              payload: { target_state: "UNDER_REVIEW" }
              as: IACUCReviewer
              as_user_id: "rev_1"
            - call: "POST /api/protocols/${prot_id}/transition"
              payload: { target_state: "APPROVED" }
              as: IACUCReviewer
              as_user_id: "rev_1"
            - call: "POST /api/colonies"
              payload: { room_id: "${room_id}", strain_id: "${strain_id}", protocol_id: "${prot_id}", breeding_pair_count: 4 }
              as: FacilityManager
              captures: { col_id: $.data.id }
            - call: "POST /api/colonies/${col_id}/transition"
              payload: { target_state: "EXPANDING" }
              as: FacilityManager
            - call: "POST /api/cohorts"
              payload: { colony_id: "${col_id}", birth_date: "2026-09-01T00:00:00Z", count_male: 13, count_female: 12, avg_weight_g_male: 20.0, avg_weight_g_female: 20.0 }
              as: FacilityManager
              captures: { coh1_id: $.data.id }
          trigger:
            - call: "POST /api/cohorts"
              payload: { colony_id: "${col_id}", birth_date: "2026-09-01T00:00:00Z", count_male: 3, count_female: 3, avg_weight_g_male: 20.0, avg_weight_g_female: 20.0 }
              as: FacilityManager
              captures: { err: $.data.error_id }
          assert:
            - "Cohort.${coh1_id} created (occupied 4 + ceil(25/5) = 9 <= 10)"
            - "error_id == ERR_CAGE_CAPACITY_EXCEEDED  (9 + ceil(6/5) = 11 > 10)"
            - "HTTP status == 422"
            - "BarrierRoom.${room_id}.occupied_cages == 9  (rejected write changes nothing)"

  - rule_id: compensating_invariant
    instances:
      - name: reserve_release_conserves_cohort_headcount
        grounds:
          - state_machines.Allocation.RESERVED_to_RELEASED
          - entities.Cohort.fields.reserved_male
          - entities.Cohort.fields.count_male
        distinguishing_aspect: |
          Conserved quantity = cohort headcount: the invariant
          count_sex == available_sex + reserved_sex + consumed_sex holds across
          the reserve/release pair, and release restores the exact pre-reserve
          tuple (10M/10F, reserved 0/0, status HOLD) with zero drift.
        test_recipe:
          setup:
            - "PRODUCTION colony; HOLD cohort 10M/10F; order for 4M/4F in SOURCING (quote 8000, credit 100000)"
          setup_api_calls:
            - call: "POST /api/facilities"
              payload: { name: "Site Alpha", site_code: "SA", registration_number: "REG-001", registration_expires_at: "2027-09-01T00:00:00Z" }
