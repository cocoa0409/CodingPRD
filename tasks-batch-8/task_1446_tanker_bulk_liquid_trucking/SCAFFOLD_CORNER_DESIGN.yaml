# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Tanker & Bulk Liquid Trucking
# =============================================================================
scaffold_corner_design:
  # ===========================================================================
  - section: entities
    instances:
      - name: customer_created_with_defaults
        claim_type: creation
        grounds: [entities.Customer, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST with only required fields yields status ACTIVE, dedicated_program_enrolled false (default), exposure_cents 0, version 1."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - { call: "POST /bulk-liquid/customers", payload: { name: "Acme Chem", credit_limit_cents: 5000000 }, as: FleetAdmin, captures: { cust: $.data.id, st: $.data.status, dp: $.data.dedicated_program_enrolled, ex: $.data.exposure_cents, v: $.data.version } }
          trigger: []
          assert:
            - "Customer.${cust}.status == ACTIVE; dedicated_program_enrolled == false; exposure_cents == 0; version == 1"
      - name: product_missing_required_field_rejected
        claim_type: required_fields
        grounds: [entities.Product, "validations[priority=4]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required placard_code yields ERR_INVALID_REQUEST (400) before any persistence."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /bulk-liquid/products", payload: { name: "Diesel ULSD", compatibility_group: PETROLEUM, hazmat_class: CLASS_3_FLAMMABLE, packing_group: II, density_lb_per_gal: 7.0, temp_coeff_per_degF: 0.0007 }, as: FleetAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST (http 400)"
      - name: product_invalid_enum_rejected
        claim_type: type_constraints
        grounds: [entities.Product.fields.compatibility_group, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "compatibility_group 'RADIOACTIVE' is not a declared enum member -> ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /bulk-liquid/products", payload: { name: "Mystery", compatibility_group: RADIOACTIVE, hazmat_class: NONE, packing_group: NONE, density_lb_per_gal: 8.0, temp_coeff_per_degF: 0.0005, placard_code: "NONE" }, as: FleetAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST (http 400)"
      - name: shipment_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_SHIPMENT_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but unknown UUID yields ERR_SHIPMENT_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /bulk-liquid/shipments/00000000-0000-4000-8000-000000000000", as: Dispatcher, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_SHIPMENT_NOT_FOUND (http 404)"
      - name: trailer_tare_sum_rejected
        claim_type: type_constraints
        grounds: [entities.TankTrailer.fields.tare_weight_lb, "errors[ERR_TARE_AXLE_MISMATCH]"]
        distinguishing_aspect: "tare axles 6000+9000+9999 = 24999 != tare_weight_lb 25000 -> ERR_TARE_AXLE_MISMATCH (422)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /bulk-liquid/trailers", payload: { unit_number: "T-X", capacity_gallons: 8000, tare_weight_lb: 25000, tare_steer_lb: 6000, tare_drive_lb: 9000, tare_trailer_lb: 9999, steer_axle_rating_lb: 12000, drive_axle_rating_lb: 34000, trailer_axle_rating_lb: 34000, gvwr_lb: 80000 }, as: FleetAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_TARE_AXLE_MISMATCH (http 422)"
      - name: trailer_duplicate_unit_number_rejected
        claim_type: creation
        grounds: [entities.TankTrailer.fields.unit_number, "errors[ERR_DUPLICATE_UNIT_NUMBER]"]
        distinguishing_aspect: "Second trailer with the same unit_number violates uniqueness -> ERR_DUPLICATE_UNIT_NUMBER (409)."
        test_recipe:
          setup: ["one trailer T-101 exists"]
          setup_api_calls:
            - { call: "POST /bulk-liquid/trailers", payload: { unit_number: "T-101", capacity_gallons: 8000, tare_weight_lb: 25000, tare_steer_lb: 6000, tare_drive_lb: 9000, tare_trailer_lb: 10000, steer_axle_rating_lb: 12000, drive_axle_rating_lb: 34000, trailer_axle_rating_lb: 34000, gvwr_lb: 80000 }, as: FleetAdmin }
          trigger:
            - { call: "POST /bulk-liquid/trailers", payload: { unit_number: "T-101", capacity_gallons: 5000, tare_weight_lb: 20000, tare_steer_lb: 5000, tare_drive_lb: 8000, tare_trailer_lb: 7000, steer_axle_rating_lb: 12000, drive_axle_rating_lb: 34000, trailer_axle_rating_lb: 34000, gvwr_lb: 70000 }, as: FleetAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_DUPLICATE_UNIT_NUMBER (http 409)"
      - name: compatibility_rule_duplicate_pair_rejected
        claim_type: creation
        grounds: [entities.CompatibilityRule, "errors[ERR_DUPLICATE_COMPATIBILITY_RULE]"]
        distinguishing_aspect: "(PETROLEUM, PETROLEUM) rule pair is unique; second insert -> ERR_DUPLICATE_COMPATIBILITY_RULE (409)."
        test_recipe:
          setup: ["rule (PETROLEUM, PETROLEUM) exists"]
          setup_api_calls:
            - { call: "POST /bulk-liquid/compatibility-rules", payload: { prior_group: PETROLEUM, next_group: PETROLEUM, required_wash_level: NONE }, as: FleetAdmin }
          trigger:
            - { call: "POST /bulk-liquid/compatibility-rules", payload: { prior_group: PETROLEUM, next_group: PETROLEUM, required_wash_level: FLUSH }, as: FleetAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_DUPLICATE_COMPATIBILITY_RULE (http 409)"
      - name: shipment_create_extra_field_rejected
        claim_type: required_fields
        grounds: ["validations[priority=4]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Unknown body field 'status' on create is rejected (strict payload), not silently ignored."
        test_recipe:
          setup: ["customer and product exist"]
          setup_api_calls:
            - { call: "POST /bulk-liquid/customers", payload: { name: "Acme Chem", credit_limit_cents: 1000000000 }, as: FleetAdmin, captures: { cust: $.data.id } }
            - { call: "POST /bulk-liquid/products", payload: { name: "Diesel ULSD", compatibility_group: PETROLEUM, hazmat_class: CLASS_3_FLAMMABLE, packing_group: II, density_lb_per_gal: 7.0, temp_coeff_per_degF: 0.0007, placard_code: "UN1993" }, as: FleetAdmin, captures: { prod: $.data.id } }
          trigger:
            - { call: "POST /bulk-liquid/shipments", payload: { customer_id: "${cust}", product_id: "${prod}", ordered_gallons: 1000, route_miles: 100, rate_per_gal_cents: 100, status: "RECONCILED" }, as: Dispatcher, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST (http 400); no shipment is persisted"
      - name: customers_list_pagination
        claim_type: listing
        grounds: [response_envelope.pagination_fields]
        distinguishing_aspect: "limit=2 over 3 customers yields total_count 3 and has_more true; offset=2 yields the last page with has_more false."
        test_recipe:
          setup: ["three customers exist"]
          setup_api_calls:
            - { call: "POST /bulk-liquid/customers", payload: { name: "C1", credit_limit_cents: 1000 }, as: FleetAdmin }
            - { call: "POST /bulk-liquid/customers", payload: { name: "C2", credit_limit_cents: 1000 }, as: FleetAdmin }
            - { call: "POST /bulk-liquid/customers", payload: { name: "C3", credit_limit_cents: 1000 }, as: FleetAdmin }
          trigger:
            - { call: "GET /bulk-liquid/customers?limit=2", as: Dispatcher }
            - { call: "GET /bulk-liquid/customers?limit=2&offset=2", as: Dispatcher }
          assert:
            - "page 1: 2 items, total_count == 3, has_more == true"
            - "page 2: 1 item, total_count == 3, has_more == false"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: shipment_created_in_draft
        claim_type: initial_state
        grounds: [state_machines.Shipment]
        distinguishing_aspect: "Newly created shipment starts in DRAFT with all assignment fields null."
        test_recipe:
          setup: ["customer and product exist"]
          setup_api_calls:
            - { call: "POST /bulk-liquid/customers", payload: { name: "Acme Chem", credit_limit_cents: 1000000000 }, as: FleetAdmin, captures: { cust: $.data.id } }
            - { call: "POST /bulk-liquid/products", payload: { name: "Diesel ULSD", compatibility_group: PETROLEUM, hazmat_class: CLASS_3_FLAMMABLE, packing_group: II, density_lb_per_gal: 7.0, temp_coeff_per_degF: 0.0007, placard_code: "UN1993" }, as: FleetAdmin, captures: { prod: $.data.id } }
          trigger:
            - { call: "POST /bulk-liquid/shipments", payload: { customer_id: "${cust}", product_id: "${prod}", ordered_gallons: 1000, route_miles: 100, rate_per_gal_cents: 100 }, as: Dispatcher, captures: { ship: $.data.id, st: $.data.status, tr: $.data.trailer_id } }
          assert:
            - "Shipment.${ship}.status == DRAFT; trailer_id == null; wash_cert_id == null; weights_verified_at == null"
      - name: cancel_reconciled_shipment_rejected
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Shipment, "errors[ERR_SHIPMENT_INVALID_STATE]"]
        distinguishing_aspect: "RECONCILED is terminal: cancel is rejected with ERR_SHIPMENT_INVALID_STATE and no side effects fire."
        test_recipe:
          setup:
            - "Fully reconciled 1000-gal shipment (accepted delivery, no incidents)"
          setup_api_calls:
            - { call: "POST /bulk-liquid/customers", payload: { name: "Acme Chem", credit_limit_cents: 1000000000 }, as: FleetAdmin, captures: { cust: $.data.id } }
            - { call: "POST /bulk-liquid/products", payload: { name: "Diesel ULSD", compatibility_group: PETROLEUM, hazmat_class: CLASS_3_FLAMMABLE, packing_group: II, density_lb_per_gal: 7.0, temp_coeff_per_degF: 0.0007, placard_code: "UN1993" }, as: FleetAdmin, captures: { prod: $.data.id } }
            - { call: "POST /bulk-liquid/compatibility-rules", payload: { prior_group: PETROLEUM, next_group: PETROLEUM, required_wash_level: NONE }, as: FleetAdmin }
            - { call: "POST /bulk-liquid/trailers", payload: { unit_number: "T-101", capacity_gallons: 8000, tare_weight_lb: 25000, tare_steer_lb: 6000, tare_drive_lb: 9000, tare_trailer_lb: 10000, steer_axle_rating_lb: 12000, drive_axle_rating_lb: 34000, trailer_axle_rating_lb: 34000, gvwr_lb: 80000 }, as: FleetAdmin, captures: { trl: $.data.id } }
            - { call: "POST /bulk-liquid/drivers", payload: { full_name: "Dana Roe", cdl_number: "CDL-1", tanker_endorsement: true, hazmat_endorsement: true, endorsement_expires_on: "2027-06-01" }, as: FleetAdmin, captures: { drv: $.data.id } }
            - { call: "POST /bulk-liquid/loading-racks", payload: { rack_code: "R-1", terminal_name: "Baytown", authorized_groups: [PETROLEUM], open_hour: 6, close_hour: 22, meter_id: "M-1" }, as: FleetAdmin, captures: { rack: $.data.id } }
            - { call: "POST /bulk-liquid/shipments", payload: { customer_id: "${cust}", product_id: "${prod}", ordered_gallons: 1000, route_miles: 500, rate_per_gal_cents: 100 }, as: Dispatcher, captures: { ship: $.data.id } }
            - { call: "POST /bulk-liquid/shipments/${ship}/plan", payload: { trailer_id: "${trl}", driver_id: "${drv}", rack_id: "${rack}", rack_window_start: "2026-08-02T10:00:00Z", rack_window_end: "2026-08-02T12:00:00Z" }, as: Dispatcher }
            - { call: "POST /bulk-liquid/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T10:30:00Z" }, as: FleetAdmin }
            - { call: "POST /bulk-liquid/shipments/${ship}/check-in", as: TerminalOperator, as_user_id: "op-meter" }
            - { call: "POST /bulk-liquid/shipments/${ship}/close-meter", payload: { meter_start_gal: 0, meter_end_gal: 1000, observed_temp_F: 60 }, as: TerminalOperator, as_user_id: "op-meter" }
            - { call: "POST /bulk-liquid/shipments/${ship}/record-weights", payload: { steer_lb: 6600, drive_lb: 12500, trailer_lb: 12900 }, as: TerminalOperator, as_user_id: "op-scale" }
            - { call: "POST /bulk-liquid/shipments/${ship}/confirm-placards", payload: { observed_placard_code: "UN1993" }, as: TerminalOperator, as_user_id: "op-meter" }
            - { call: "POST /bulk-liquid/spill-response-plans", payload: { customer_id: "${cust}", product_id: "${prod}", equipment_checklist: ["pads"] }, as: CustomerRep, as_user_id: "${cust}", captures: { srp: $.data.id } }
            - { call: "POST /bulk-liquid/spill-response-plans/${srp}/submit", as: CustomerRep, as_user_id: "${cust}" }
            - { call: "POST /bulk-liquid/spill-response-plans/${srp}/approve", as: SafetyOfficer, as_user_id: "so-1" }
            - { call: "POST /bulk-liquid/shipments/${ship}/depart", as: Dispatcher }
            - { call: "POST /bulk-liquid/shipments/${ship}/start-delivery", as: Driver, as_user_id: "${drv}" }
            - { call: "GET /bulk-liquid/delivery-tickets?shipment_id=${ship}", as: Dispatcher, captures: { dtick: "$.data[0].id" } }
            - { call: "POST /bulk-liquid/delivery-tickets/${dtick}/close", payload: { delivered_observed_gal: 1000, delivered_temp_F: 60, retain_sample_ml: 250 }, as: Driver, as_user_id: "${drv}" }
            - { call: "POST /bulk-liquid/shipments/${ship}/reconcile", as: FleetAdmin }
          trigger:
            - { call: "POST /bulk-liquid/shipments/${ship}/cancel", as: Dispatcher, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_SHIPMENT_INVALID_STATE (http 409)"
            - "Shipment.${ship}.status remains RECONCILED; final_total_cents unchanged (119000 = 100000 + 4000 + 15000 - 0)"
      - name: double_cancel_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Shipment.DRAFT_to_CANCELLED, "errors[ERR_SHIPMENT_INVALID_STATE]"]
        distinguishing_aspect: "Second cancel on an already-CANCELLED shipment is rejected (idempotency via state lockout)."
        test_recipe:
          setup: ["shipment created then cancelled"]
          setup_api_calls:
            - { call: "POST /bulk-liquid/customers", payload: { name: "Acme Chem", credit_limit_cents: 1000000000 }, as: FleetAdmin, captures: { cust: $.data.id } }
            - { call: "POST /bulk-liquid/products", payload: { name: "Diesel ULSD", compatibility_group: PETROLEUM, hazmat_class: CLASS_3_FLAMMABLE, packing_group: II, density_lb_per_gal: 7.0, temp_coeff_per_degF: 0.0007, placard_code: "UN1993" }, as: FleetAdmin, captures: { prod: $.data.id } }
            - { call: "POST /bulk-liquid/shipments", payload: { customer_id: "${cust}", product_id: "${prod}", ordered_gallons: 1000, route_miles: 100, rate_per_gal_cents: 100 }, as: Dispatcher, captures: { ship: $.data.id } }
            - { call: "POST /bulk-liquid/shipments/${ship}/cancel", as: Dispatcher }
          trigger:
            - { call: "POST /bulk-liquid/shipments/${ship}/cancel", as: Dispatcher, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_SHIPMENT_INVALID_STATE (http 409)"
      - name: certify_twice_rejected
        claim_type: invalid_transition
        grounds: [state_machines.TankWashCertificate.SCHEDULED_to_CERTIFIED, "errors[ERR_CERT_INVALID_STATE]"]
        distinguishing_aspect: "certify on an already-CERTIFIED certificate -> ERR_CERT_INVALID_STATE."
        test_recipe:
          setup: ["FLUSH certificate already CERTIFIED"]
          setup_api_calls:
            - { call: "POST /bulk-liquid/trailers", payload: { unit_number: "T-101", capacity_gallons: 8000, tare_weight_lb: 25000, tare_steer_lb: 6000, tare_drive_lb: 9000, tare_trailer_lb: 10000, steer_axle_rating_lb: 12000, drive_axle_rating_lb: 34000, trailer_axle_rating_lb: 34000, gvwr_lb: 80000 }, as: FleetAdmin, captures: { trl: $.data.id } }
            - { call: "POST /bulk-liquid/wash-bays", payload: { bay_code: "WB-1", supported_wash_levels: [FLUSH], cleanup_buffer_minutes: 30 }, as: FleetAdmin, captures: { bay: $.data.id } }
            - { call: "POST /bulk-liquid/tank-wash-certificates", payload: { trailer_id: "${trl}", wash_bay_id: "${bay}", wash_level: FLUSH, window_start: "2026-08-02T06:00:00Z", window_end: "2026-08-02T07:00:00Z" }, as: WashOperator, captures: { cert: $.data.id } }
            - { call: "POST /bulk-liquid/tank-wash-certificates/${cert}/certify", as: WashOperator }
          trigger:
            - { call: "POST /bulk-liquid/tank-wash-certificates/${cert}/certify", as: WashOperator, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_CERT_INVALID_STATE (http 409)"
      - name: incident_close_from_reported_rejected
        claim_type: invalid_transition
        grounds: [state_machines.SpillIncident, "errors[ERR_INCIDENT_INVALID_STATE]"]
        distinguishing_aspect: "close from REPORTED (skipping UNDER_REVIEW) -> ERR_INCIDENT_INVALID_STATE; review step cannot be skipped."
        test_recipe:
          setup:
            - "Shipment IN_TRANSIT with a MINOR incident REPORTED (never reviewed)"
          setup_api_calls:
            - { call: "POST /bulk-liquid/customers", payload: { name: "Acme Chem", credit_limit_cents: 1000000000 }, as: FleetAdmin, captures: { cust: $.data.id } }
            - { call: "POST /bulk-liquid/products", payload: { name: "Diesel ULSD", compatibility_group: PETROLEUM, hazmat_class: CLASS_3_FLAMMABLE, packing_group: II, density_lb_per_gal: 7.0, temp_coeff_per_degF: 0.0007, placard_code: "UN1993" }, as: FleetAdmin, captures: { prod: $.data.id } }
            - { call: "POST /bulk-liquid/compatibility-rules", payload: { prior_group: PETROLEUM, next_group: PETROLEUM, required_wash_level: NONE }, as: FleetAdmin }
            - { call: "POST /bulk-liquid/trailers", payload: { unit_number: "T-101", capacity_gallons: 8000, tare_weight_lb: 25000, tare_steer_lb: 6000, tare_drive_lb: 9000, tare_trailer_lb: 10000, steer_axle_rating_lb: 12000, drive_axle_rating_lb: 34000, trailer_axle_rating_lb: 34000, gvwr_lb: 80000 }, as: FleetAdmin, captures: { trl: $.data.id } }
            - { call: "POST /bulk-liquid/drivers", payload: { full_name: "Dana Roe", cdl_number: "CDL-1", tanker_endorsement: true, hazmat_endorsement: true, endorsement_expires_on: "2027-06-01" }, as: FleetAdmin, captures: { drv: $.data.id } }
            - { call: "POST /bulk-liquid/loading-racks", payload: { rack_code: "R-1", terminal_name: "Baytown", authorized_groups: [PETROLEUM], open_hour: 6, close_hour: 22, meter_id: "M-1" }, as: FleetAdmin, captures: { rack: $.data.id } }
            - { call: "POST /bulk-liquid/shipments", payload: { customer_id: "${cust}", product_id: "${prod}", ordered_gallons: 1000, route_miles: 500, rate_per_gal_cents: 100 }, as: Dispatcher, captures: { ship: $.data.id } }
            - { call: "POST /bulk-liquid/shipments/${ship}/plan", payload: { trailer_id: "${trl}", driver_id: "${drv}", rack_id: "${rack}", rack_window_start: "2026-08-02T10:00:00Z", rack_window_end: "2026-08-02T12:00:00Z" }, as: Dispatcher }
            - { call: "POST /bulk-liquid/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T10:30:00Z" }, as: FleetAdmin }
            - { call: "POST /bulk-liquid/shipments/${ship}/check-in", as: TerminalOperator, as_user_id: "op-meter" }
            - { call: "POST /bulk-liquid/shipments/${ship}/close-meter", payload: { meter_start_gal: 0, meter_end_gal: 1000, observed_temp_F: 60 }, as: TerminalOperator, as_user_id: "op-meter" }
            - { call: "POST /bulk-liquid/shipments/${ship}/record-weights", payload: { steer_lb: 6600, drive_lb: 12500, trailer_lb: 12900 }, as: TerminalOperator, as_user_id: "op-scale" }
            - { call: "POST /bulk-liquid/shipments/${ship}/confirm-placards", payload: { observed_placard_code: "UN1993" }, as: TerminalOperator, as_user_id: "op-meter" }
            - { call: "POST /bulk-liquid/spill-response-plans", payload: { customer_id: "${cust}", product_id: "${prod}", equipment_checklist: ["pads"] }, as: CustomerRep, as_user_id: "${cust}", captures: { srp: $.data.id } }
            - { call: "POST /bulk-liquid/spill-response-plans/${srp}/submit", as: CustomerRep, as_user_id: "${cust}" }
            - { call: "POST /bulk-liquid/spill-response-plans/${srp}/approve", as: SafetyOfficer, as_user_id: "so-1" }
            - { call: "POST /bulk-liquid/shipments/${ship}/depart", as: Dispatcher }
            - { call: "POST /bulk-liquid/shipments/${ship}/spill-incidents", payload: { occurred_at: "2026-08-02T11:00:00Z", gallons_spilled: 5 }, as: Driver, as_user_id: "${drv}", captures: { inc: $.data.id } }
          trigger:
            - { call: "POST /bulk-liquid/spill-incidents/${inc}/close", as: SafetyOfficer, as_user_id: "so-1", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INCIDENT_INVALID_STATE (http 409): incident is REPORTED, not UNDER_REVIEW"
      - name: closemeter_sets_trailer_last_product_group
        claim_type: side_effect_execution
        grounds: [state_machines.Shipment.LOADING_to_LOADED, entities.TankTrailer.fields.last_product_group]
        distinguishing_aspect: "close-meter writes product.compatibility_group onto trailer.last_product_group (null -> PETROLEUM), which then drives wash requirements for the next load."
        test_recipe:
          setup: ["shipment in LOADING"]
          setup_api_calls:
            - { call: "POST /bulk-liquid/customers", payload: { name: "Acme Chem", credit_limit_cents: 1000000000 }, as: FleetAdmin, captures: { cust: $.data.id } }
            - { call: "POST /bulk-liquid/products", payload: { name: "Diesel ULSD", compatibility_group: PETROLEUM, hazmat_class: CLASS_3_FLAMMABLE, packing_group: II, density_lb_per_gal: 7.0, temp_coeff_per_degF: 0.0007, placard_code: "UN1993" }, as: FleetAdmin, captures: { prod: $.data.id } }
            - { call: "POST /bulk-liquid/compatibility-rules", payload: { prior_group: PETROLEUM, next_group: PETROLEUM, required_wash_level: NONE }, as: FleetAdmin }
            - { call: "POST /bulk-liquid/trailers", payload: { unit_number: "T-101", capacity_gallons: 8000, tare_weight_lb: 25000, tare_steer_lb: 6000, tare_drive_lb: 9000, tare_trailer_lb: 10000, steer_axle_rating_lb: 12000, drive_axle_rating_lb: 34000, trailer_axle_rating_lb: 34000, gvwr_lb: 80000 }, as: FleetAdmin, captures: { trl: $.data.id } }
            - { call: "POST /bulk-liquid/drivers", payload: { full_name: "Dana Roe", cdl_number: "CDL-1", tanker_endorsement: true, hazmat_endorsement: true, endorsement_expires_on: "2027-06-01" }, as: FleetAdmin, captures: { drv: $.data.id } }
            - { call: "POST /bulk-liquid/loading-racks", payload: { rack_code: "R-1", terminal_name: "Baytown", authorized_groups: [PETROLEUM], open_hour: 6, close_hour: 22, meter_id: "M-1" }, as: FleetAdmin, captures: { rack: $.data.id } }
            - { call: "POST /bulk-liquid/shipments", payload: { customer_id: "${cust}", product_id: "${prod}", ordered_gallons: 1000, route_miles: 100, rate_per_gal_cents: 100 }, as: Dispatcher, captures: { ship: $.data.id } }
