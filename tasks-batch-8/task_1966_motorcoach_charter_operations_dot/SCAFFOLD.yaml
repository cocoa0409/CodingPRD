      - "GET /api/v1/drivers/{id}"
      - "POST /api/v1/drivers/{id}/check-rest"
      - "GET /api/v1/quotes"
      - "GET /api/v1/quotes/{id}"
      - "POST /api/v1/quotes/{id}/check-expiry"
      - "GET /api/v1/orders"
      - "GET /api/v1/orders/{id}"
      - "POST /api/v1/orders/{id}/cancel"
      - "POST /api/v1/orders/{id}/itinerary-change"
      - "POST /api/v1/orders/{order_id}/trip-logs"
      - "POST /api/v1/orders/{order_id}/incidents"
      - "POST /api/v1/orders/{order_id}/breakdowns"
      - "GET /api/v1/orders/{order_id}/trip-logs"
