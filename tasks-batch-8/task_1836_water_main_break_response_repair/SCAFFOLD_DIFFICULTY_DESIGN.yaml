            - call: "POST /traffic-permits"
              payload: { break_report_id: "${brB}", street_block: "ELM-200-BLK", valid_from: "2026-08-10T00:00:00Z", valid_to: "2026-08-12T00:00:00Z", control_plan: LANE_CLOSURE }
