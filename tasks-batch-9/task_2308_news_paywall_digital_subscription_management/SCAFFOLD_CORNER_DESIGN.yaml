# SCAFFOLD_CORNER_DESIGN.yaml - §1.9 breadth coverage index for
# task_2308_news_paywall_digital_subscription_management.
# The nine sections below are the nine sections of references/claim-extraction-guide.md,
# walked row-by-row against this scaffold's §1.1-§1.7. Corners already asserted by a
# §1.8 instance carry an excluded_because stub instead of a test_recipe.
# Every literal was computed by executing the §1.3 formulas.

scaffold_corner_design:
  - section: entities
    instances:
      - name: offer_plan_created_with_declared_defaults
        claim_type: Creation
        grounds:
          - entities.OfferPlan
          - endpoints[POST /paywall/offer-plans]
        distinguishing_aspect: "A freshly authored plan must come back 201 with status DRAFT, price_change_state NONE, active_subscription_count 0 and version 1 - none of which the client sent."
        test_recipe:
          setup:
            - "Empty database; logical clock at its default 2026-08-01T00:00:00Z."
          setup_api_calls: []
          trigger:
            - call: "POST /paywall/offer-plans"
              payload: { name: "Digital Basic", bundle_type: "DIGITAL_ONLY", intro_price_cents: 499, intro_cycles: 1, standard_price_cents: 1499, standard_from_cycle: 2, cycle_days: 30 }
              as: RevenueManager
              captures: { plan_new: "$.data.id", plan_new_v: "$.data.version" }
          assert:
            - "the response status is 201"
            - "OfferPlan.${plan_new}.status == DRAFT"
            - "OfferPlan.${plan_new}.price_change_state == NONE"
            - "OfferPlan.${plan_new}.active_subscription_count == 0"
            - "OfferPlan.${plan_new}.version == 1"
            - "OfferPlan.${plan_new}.name == Digital Basic"
            - "OfferPlan.${plan_new}.standard_price_cents == 1499"
            - "the response carries meta.api_request_id, meta.api_request_timestamp and response_type == object"

      - name: offer_plan_retrieved_by_id_matches_stored_row
        claim_type: Retrieval
        grounds:
          - endpoints[GET /paywall/offer-plans/{id}]
        distinguishing_aspect: "The single-resource GET must echo the stored plan field for field, including the system-assigned status and version, not a re-derived object."
        test_recipe:
          setup:
            - "One DRAFT DIGITAL_ONLY plan created at clock 2026-09-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /paywall/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: SubscriptionOpsAgent
            - call: "POST /paywall/offer-plans"
              payload: { name: "Digital Read", bundle_type: "DIGITAL_ONLY", intro_price_cents: 499, intro_cycles: 1, standard_price_cents: 1499, standard_from_cycle: 2, cycle_days: 30 }
              as: RevenueManager
              captures: { plan_r: "$.data.id" }
          trigger:
            - call: "GET /paywall/offer-plans/${plan_r}"
              payload: {}
              as: SubscriptionOpsAgent
              captures: { plan_r_status: "$.data.status" }
          assert:
            - "the response status is 200"
            - "OfferPlan.${plan_r}.status == DRAFT"
            - "OfferPlan.${plan_r}.intro_price_cents == 499"
            - "OfferPlan.${plan_r}.intro_cycles == 1"
            - "OfferPlan.${plan_r}.cycle_days == 30"
            - "OfferPlan.${plan_r}.version == 1"

      - name: offer_plan_list_paginates_with_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints[GET /paywall/offer-plans]
          - response_envelope.pagination_fields
        distinguishing_aspect: "With three plans stored, limit 2 must return exactly 2 rows with total_count 3 and has_more true; offset 2 must return the last row with has_more false."
        test_recipe:
          setup:
            - "Three DIGITAL_ONLY plans created in order at clock 2026-09-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /paywall/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: SubscriptionOpsAgent
            - call: "POST /paywall/offer-plans"
              payload: { name: "List Plan 1", bundle_type: "DIGITAL_ONLY", intro_price_cents: 499, intro_cycles: 1, standard_price_cents: 1499, standard_from_cycle: 2, cycle_days: 30 }
              as: RevenueManager
              captures: { lp1: "$.data.id" }
            - call: "POST /paywall/offer-plans"
              payload: { name: "List Plan 2", bundle_type: "DIGITAL_ONLY", intro_price_cents: 599, intro_cycles: 1, standard_price_cents: 1599, standard_from_cycle: 2, cycle_days: 30 }
              as: RevenueManager
              captures: { lp2: "$.data.id" }
            - call: "POST /paywall/offer-plans"
              payload: { name: "List Plan 3", bundle_type: "DIGITAL_ONLY", intro_price_cents: 699, intro_cycles: 1, standard_price_cents: 1699, standard_from_cycle: 2, cycle_days: 30 }
              as: RevenueManager
              captures: { lp3: "$.data.id" }
          trigger:
            - call: "GET /paywall/offer-plans"
              payload: { limit: 2, offset: 0 }
              as: RevenueManager
              captures: { first_page_head: "$.data[0].id" }
            - call: "GET /paywall/offer-plans"
              payload: { limit: 2, offset: 2 }
              as: RevenueManager
              captures: { second_page_head: "$.data[0].id" }
          assert:
            - "the first page returns 2 rows with total_count == 3 and has_more == true"
            - "the second page returns 1 row with total_count == 3 and has_more == false"
            - "response_type == array on both pages"
            - "the second page's single row is OfferPlan.${lp3}"

      - name: unknown_subscription_id_returns_not_found
        claim_type: Not Found
        grounds:
          - validations[priority=9]
          - errors[ERR_SUBSCRIPTION_NOT_FOUND]
        distinguishing_aspect: "A syntactically valid UUID that matches no Subscription row must yield 404 ERR_SUBSCRIPTION_NOT_FOUND, not 400 and not an empty 200."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "GET /paywall/subscriptions/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: SubscriptionOpsAgent
              captures: { err_nf: "$.data.error_id" }
          assert:
            - "the response status is 404 and error_id == ERR_SUBSCRIPTION_NOT_FOUND"
            - "the response carries response_type == error and a non-empty message"

      - name: subscription_create_missing_required_offer_plan_id_rejected
        claim_type: Required Fields
        grounds:
          - validations[priority=4]
          - endpoints[POST /paywall/subscriptions]
        distinguishing_aspect: "offer_plan_id has source input with no default, so omitting it must fail body-shape validation with ERR_INVALID_REQUEST (400) before any existence or state check runs."
        test_recipe:
          setup:
            - "One registered reader and one ACTIVE plan exist, but the request omits offer_plan_id entirely (its version is carried, which is what makes the omission the only defect)."
          setup_api_calls:
            - call: "POST /paywall/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: SubscriptionOpsAgent
            - call: "POST /paywall/readers"
              payload: { email: "reqfield@mail.test", is_registered: true }
              as: SubscriptionOpsAgent
              captures: { rd_rf: "$.data.id" }
            - call: "POST /paywall/offer-plans"
              payload: { name: "Digital ReqField", bundle_type: "DIGITAL_ONLY", intro_price_cents: 499, intro_cycles: 1, standard_price_cents: 1499, standard_from_cycle: 2, cycle_days: 30 }
              as: RevenueManager
              captures: { plan_rf: "$.data.id" }
            - call: "POST /paywall/offer-plans/${plan_rf}/activate"
              payload: {}
              as: RevenueManager
              captures: { plan_rf_v: "$.data.version" }
          trigger:
            - call: "POST /paywall/subscriptions"
              payload: { reader_id: "${rd_rf}", expected_offer_plan_version: "${plan_rf_v}" }
              as: SubscriptionOpsAgent
              captures: { err_req: "$.data.error_id" }
          assert:
            - "the response status is 400 and error_id == ERR_INVALID_REQUEST"
            - "Subscription rows == 0"

      - name: reader_defaults_applied_when_optional_fields_omitted
        claim_type: Defaults
        grounds:
          - entities.Reader
          - endpoints[POST /paywall/readers]
        distinguishing_aspect: "Every Reader input field is optional, so an empty body must produce is_registered false, propensity_band MEDIUM, engagement_score 0.00, churn_risk_band SEVERE, card_status MISSING and an empty meter."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /paywall/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: SubscriptionOpsAgent
          trigger:
            - call: "POST /paywall/readers"
              payload: {}
              as: SubscriptionOpsAgent
              captures: { rd_def: "$.data.id" }
          assert:
            - "the response status is 201"
            - "Reader.${rd_def}.is_registered == false"
            - "Reader.${rd_def}.propensity_band == MEDIUM"
            - "Reader.${rd_def}.engagement_score == 0.00"
            - "Reader.${rd_def}.churn_risk_band == SEVERE"
            - "Reader.${rd_def}.card_status == MISSING"
            - "Reader.${rd_def}.card_updater_status == NOT_APPLICABLE"
            - "Reader.${rd_def}.entitlement_source == NONE"
            - "Reader.${rd_def}.metered_distinct_article_count == 0"
            - "Reader.${rd_def}.meter_period_started_on == 2026-09-01"
            - "Reader.${rd_def}.intervention_count_in_period == 0"

      - name: subscription_create_computed_cycle_fields_input_ignored
        claim_type: Computed Fields
        grounds:
          - entities.Subscription.fields.cycle_index
          - entities.Subscription.fields.next_cycle_price_cents
          - calculations.cycle_base_price_resolution
        distinguishing_aspect: "cycle_index, next_cycle_price_cents and pending_credit_cents are computed/system; client-supplied values for them must be discarded and the server's own derivation stored."
        test_recipe:
          setup:
            - "One ACTIVE DIGITAL_ONLY plan (intro 499 for cycle 1, standard 1499 from cycle 2) and one registered reader, at clock 2026-09-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /paywall/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: SubscriptionOpsAgent
            - call: "POST /paywall/offer-plans"
              payload: { name: "Digital Ignore", bundle_type: "DIGITAL_ONLY", intro_price_cents: 499, intro_cycles: 1, standard_price_cents: 1499, standard_from_cycle: 2, cycle_days: 30 }
              as: RevenueManager
              captures: { plan_ig: "$.data.id" }
            - call: "POST /paywall/offer-plans/${plan_ig}/activate"
              payload: {}
              as: RevenueManager
              captures: { plan_ig_v: "$.data.version" }
            - call: "POST /paywall/readers"
              payload: { email: "ignore@mail.test", is_registered: true }
              as: SubscriptionOpsAgent
              captures: { rd_ig: "$.data.id" }
          trigger:
            - call: "POST /paywall/subscriptions"
              payload: { reader_id: "${rd_ig}", offer_plan_id: "${plan_ig}", expected_offer_plan_version: "${plan_ig_v}", cycle_index: 7, next_cycle_price_cents: 1, pending_credit_cents: 9999, lifecycle_status: "ACTIVE" }
              as: SubscriptionOpsAgent
              captures: { sub_ig: "$.data.id" }
          assert:
            - "Subscription.${sub_ig}.cycle_index == 1"
            - "Subscription.${sub_ig}.next_cycle_price_cents == 1499"
            - "Subscription.${sub_ig}.pending_credit_cents == 0"
            - "Subscription.${sub_ig}.lifecycle_status == PENDING_ACTIVATION"
            - "Subscription.${sub_ig}.dunning_status == CURRENT"
            - "Subscription.${sub_ig}.print_fulfillment_status == NOT_APPLICABLE"
            - "Subscription.${sub_ig}.cycle_start_on == 2026-09-01"

      - name: group_account_system_fields_input_ignored
        claim_type: System Fields
        grounds:
          - entities.GroupAccount
          - endpoints[POST /paywall/group-accounts]
        distinguishing_aspect: "id, created_at, updated_at, version and status are server-minted on GroupAccount; supplying them must not override the server's values."
        test_recipe:
          setup:
            - "One ACTIVE INSTITUTIONAL_SEAT plan (5000 from cycle 1, per_seat_price_cents 400) at clock 2026-09-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /paywall/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: SubscriptionOpsAgent
            - call: "POST /paywall/offer-plans"
              payload: { name: "Institution Sys", bundle_type: "INSTITUTIONAL_SEAT", intro_price_cents: 5000, intro_cycles: 0, standard_price_cents: 5000, standard_from_cycle: 1, cycle_days: 30, per_seat_price_cents: 400 }
              as: RevenueManager
              captures: { plan_sys: "$.data.id" }
            - call: "POST /paywall/offer-plans/${plan_sys}/activate"
              payload: {}
              as: RevenueManager
          trigger:
            - call: "POST /paywall/group-accounts"
              payload: { name: "Sys Library", admin_email: "sys@univ.edu", allowed_email_domain: "univ.edu", seat_capacity: 3, offer_plan_id: "${plan_sys}", id: "00000000-0000-0000-0000-000000000001", version: 42, status: "SUSPENDED", seats_assigned_count: 7 }
              as: SubscriptionOpsAgent
              captures: { grp_sys: "$.data.id" }
          assert:
            - "GroupAccount.${grp_sys}.id != 00000000-0000-0000-0000-000000000001"
            - "GroupAccount.${grp_sys}.version == 1"
            - "GroupAccount.${grp_sys}.status == ACTIVE"
            - "GroupAccount.${grp_sys}.seats_assigned_count == 0"
            - "GroupAccount.${grp_sys}.seats_available_count == 3"
            - "GroupAccount.${grp_sys}.created_at and updated_at are server-generated ISO 8601 UTC timestamps"

      - name: hold_type_outside_enum_rejected
        claim_type: Type Constraints
        grounds:
          - validations[priority=4]
          - entities.Hold.fields.hold_type
        distinguishing_aspect: "hold_type is a closed enum {VACATION_DELIVERY, PAUSE_BILLING, DELIVERY_INTERRUPTION}; a fourth value must fail body-shape validation with 400 rather than being stored."
        test_recipe:
          setup:
            - "ACTIVE PRINT_DIGITAL plan and an ACTIVE subscription whose cycle-1 invoice of 999 is PAID, at clock 2026-09-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /paywall/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: SubscriptionOpsAgent
            - call: "POST /paywall/offer-plans"
              payload: { name: "Print Enum", bundle_type: "PRINT_DIGITAL", intro_price_cents: 999, intro_cycles: 1, standard_price_cents: 1899, standard_from_cycle: 2, cycle_days: 30, print_component_cents: 900, print_deliveries_per_cycle: 4, print_delivery_days: ["SUN"] }
              as: RevenueManager
              captures: { plan_en: "$.data.id" }
            - call: "POST /paywall/offer-plans/${plan_en}/activate"
              payload: {}
              as: RevenueManager
              captures: { plan_en_v: "$.data.version" }
            - call: "POST /paywall/readers"
              payload: { email: "enum@mail.test", is_registered: true }
              as: SubscriptionOpsAgent
              captures: { rd_en: "$.data.id" }
            - call: "POST /paywall/subscriptions"
              payload: { reader_id: "${rd_en}", offer_plan_id: "${plan_en}", expected_offer_plan_version: "${plan_en_v}" }
              as: SubscriptionOpsAgent
              captures: { sub_en: "$.data.id" }
            - call: "GET /paywall/subscriptions/${sub_en}/invoices"
              payload: {}
              as: SubscriptionOpsAgent
              captures: { inv_en: "$.data[0].id" }
            - call: "POST /paywall/invoices/${inv_en}/payment-attempts"
              payload: { outcome: "SUCCEEDED", amount_cents: 999 }
              as: SubscriptionOpsAgent
          trigger:
            - call: "POST /paywall/subscriptions/${sub_en}/holds"
              payload: { hold_type: "SABBATICAL", start_date: "2026-09-10", end_date: "2026-09-14" }
              as: SubscriptionOpsAgent
              captures: { err_enum: "$.data.error_id" }
          assert:
            - "the response status is 400 and error_id == ERR_INVALID_REQUEST"
            - "Hold rows on Subscription.${sub_en} == 0"

      - name: payment_attempt_rows_are_immutable_and_versionless
        claim_type: Immutability
        grounds:
          - entities.PaymentAttempt
          - endpoints[GET /paywall/invoices/{id}/payment-attempts]
        distinguishing_aspect: "PaymentAttempt declares common_fields false, so its rows expose only id and created_at (no version, no updated_at) and §1.5 exposes no update or delete route for them."
        test_recipe:
          setup:
            - "ACTIVE DIGITAL_ONLY plan and a subscription whose cycle-1 invoice of 499 received one SOFT_DECLINE and then one SUCCEEDED attempt, at clock 2026-09-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /paywall/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: SubscriptionOpsAgent
            - call: "POST /paywall/offer-plans"
              payload: { name: "Digital Immutable", bundle_type: "DIGITAL_ONLY", intro_price_cents: 499, intro_cycles: 1, standard_price_cents: 1499, standard_from_cycle: 2, cycle_days: 30 }
              as: RevenueManager
              captures: { plan_im: "$.data.id" }
            - call: "POST /paywall/offer-plans/${plan_im}/activate"
              payload: {}
              as: RevenueManager
              captures: { plan_im_v: "$.data.version" }
            - call: "POST /paywall/readers"
              payload: { email: "immutable@mail.test", is_registered: true }
              as: SubscriptionOpsAgent
              captures: { rd_im: "$.data.id" }
            - call: "POST /paywall/subscriptions"
              payload: { reader_id: "${rd_im}", offer_plan_id: "${plan_im}", expected_offer_plan_version: "${plan_im_v}" }
              as: SubscriptionOpsAgent
              captures: { sub_im: "$.data.id" }
            - call: "GET /paywall/subscriptions/${sub_im}/invoices"
              payload: {}
              as: SubscriptionOpsAgent
              captures: { inv_im: "$.data[0].id" }
            - call: "POST /paywall/invoices/${inv_im}/payment-attempts"
              payload: { outcome: "SOFT_DECLINE", amount_cents: 499, decline_code: "do_not_honor" }
              as: SubscriptionOpsAgent
            - call: "POST /paywall/invoices/${inv_im}/payment-attempts"
              payload: { outcome: "SUCCEEDED", amount_cents: 499 }
              as: SubscriptionOpsAgent
          trigger:
            - call: "GET /paywall/invoices/${inv_im}/payment-attempts"
              payload: {}
              as: SubscriptionOpsAgent
              captures: { att_first: "$.data[0].attempt_no" }
          assert:
            - "the list returns 2 rows with attempt_no 1 then 2 in created_at ASC order"
            - "each row exposes id and created_at but no version and no updated_at field"
            - "row 1 has outcome SOFT_DECLINE, is_final false and decline_code do_not_honor"
            - "row 2 has outcome SUCCEEDED and is_final false"
            - "no PATCH, PUT or DELETE route exists for payment attempts in §1.5"

      - name: seat_create_under_unknown_group_account_not_found
        claim_type: Parent Relationships
        grounds:
          - validations[priority=14]
          - errors[ERR_GROUP_ACCOUNT_NOT_FOUND]
        distinguishing_aspect: "Seat's parent is GroupAccount, so a nested create under a non-existent group must 404 on the parent before the OCC or capacity checks are reached."
        test_recipe:
          setup:
            - "One registered reader and one real GroupAccount exist (so a genuine, current group version can be read from the server), but the nested create targets a different, non-existent group id."
          setup_api_calls:
            - call: "POST /paywall/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: SubscriptionOpsAgent
            - call: "POST /paywall/readers"
              payload: { email: "orphan@univ.edu", is_registered: true }
              as: SubscriptionOpsAgent
              captures: { rd_orph: "$.data.id" }
            - call: "POST /paywall/offer-plans"
              payload: { name: "Seats Orphan", bundle_type: "INSTITUTIONAL_SEAT", intro_price_cents: 5000, intro_cycles: 1, standard_price_cents: 5000, standard_from_cycle: 2, cycle_days: 30, per_seat_price_cents: 400 }
              as: RevenueManager
              captures: { plan_orph: "$.data.id" }
            - call: "POST /paywall/offer-plans/${plan_orph}/activate"
              payload: {}
              as: RevenueManager
            - call: "POST /paywall/group-accounts"
              payload: { name: "Univ Orphan Group", admin_email: "bursar@univ.edu", allowed_email_domain: "univ.edu", seat_capacity: 2, offer_plan_id: "${plan_orph}" }
              as: SubscriptionOpsAgent
              captures: { grp_orph: "$.data.id", grp_orph_v: "$.data.version" }
          trigger:
            - call: "POST /paywall/group-accounts/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/seats"
              payload: { reader_id: "${rd_orph}", starts_on: "2026-09-05", expected_group_account_version: "${grp_orph_v}" }
              as: GroupAdmin
              as_user_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              captures: { err_parent: "$.data.error_id" }
          assert:
            - "the response status is 404 and error_id == ERR_GROUP_ACCOUNT_NOT_FOUND"
            - "error_id != ERR_STALE_GROUP_ACCOUNT_VERSION and error_id != ERR_UNAUTHORIZED"
            - "Seat rows == 0 and GroupAccount.${grp_orph}.seats_assigned_count == 0"

      - name: institutional_subscription_joins_reader_plan_and_group
        claim_type: Parent Relationships
        grounds:
          - complexity_profile.entity_topology
          - entities.Subscription.fields.group_account_id
          - endpoints[GET /paywall/subscriptions]
        distinguishing_aspect: "entity_topology is graph: one Subscription row simultaneously references Reader, OfferPlan and GroupAccount, and each of the three filtered lists must find it."
        test_recipe:
          setup:
            - "ACTIVE INSTITUTIONAL_SEAT plan funding GroupAccount 'Univ Library G' (seat_capacity 2) with a funding subscription created for the library admin reader, at clock 2026-09-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /paywall/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: SubscriptionOpsAgent
            - call: "POST /paywall/offer-plans"
              payload: { name: "Institution Graph", bundle_type: "INSTITUTIONAL_SEAT", intro_price_cents: 5000, intro_cycles: 0, standard_price_cents: 5000, standard_from_cycle: 1, cycle_days: 30, per_seat_price_cents: 400 }
              as: RevenueManager
              captures: { plan_g: "$.data.id" }
            - call: "POST /paywall/offer-plans/${plan_g}/activate"
              payload: {}
              as: RevenueManager
            - call: "POST /paywall/readers"
              payload: { email: "libadming@univ.edu", is_registered: true }
              as: SubscriptionOpsAgent
              captures: { rd_g: "$.data.id" }
            - call: "POST /paywall/group-accounts"
              payload: { name: "Univ Library G", admin_email: "libadming@univ.edu", allowed_email_domain: "univ.edu", seat_capacity: 2, offer_plan_id: "${plan_g}" }
              as: SubscriptionOpsAgent
              captures: { grp_g: "$.data.id" }
            - call: "GET /paywall/offer-plans/${plan_g}"
              payload: {}
              as: SubscriptionOpsAgent
              captures: { plan_g_v: "$.data.version" }
            - call: "POST /paywall/subscriptions"
              payload: { reader_id: "${rd_g}", offer_plan_id: "${plan_g}", expected_offer_plan_version: "${plan_g_v}", group_account_id: "${grp_g}" }
              as: SubscriptionOpsAgent
              captures: { sub_g: "$.data.id" }
          trigger:
            - call: "GET /paywall/subscriptions"
              payload: { group_account_id: "${grp_g}" }
              as: SubscriptionOpsAgent
              captures: { found_by_group: "$.data[0].id" }
            - call: "GET /paywall/subscriptions"
              payload: { reader_id: "${rd_g}" }
              as: SubscriptionOpsAgent
              captures: { found_by_reader: "$.data[0].id" }
            - call: "GET /paywall/subscriptions"
              payload: { offer_plan_id: "${plan_g}" }
              as: SubscriptionOpsAgent
              captures: { found_by_plan: "$.data[0].id" }
          assert:
            - "each of the three filtered lists returns exactly 1 row, Subscription.${sub_g}"
            - "Subscription.${sub_g}.reader_id == ${rd_g}"
            - "Subscription.${sub_g}.offer_plan_id == ${plan_g}"
            - "Subscription.${sub_g}.group_account_id == ${grp_g}"
            - "OfferPlan.${plan_g}.active_subscription_count == 1"

  - section: state_machines
    instances:
      - name: offer_plan_starts_in_draft_status
        claim_type: initial_state
        grounds:
          - state_machines.OfferPlan.initial_state
        distinguishing_aspect: "The OfferPlan status machine declares initial_state DRAFT and the price-change machine declares initial_state NONE; both must hold on a newly created plan without any activation call."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /paywall/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: SubscriptionOpsAgent
          trigger:
            - call: "POST /paywall/offer-plans"
              payload: { name: "Digital Initial", bundle_type: "DIGITAL_ONLY", intro_price_cents: 499, intro_cycles: 1, standard_price_cents: 1499, standard_from_cycle: 2, cycle_days: 30 }
              as: RevenueManager
              captures: { plan_init: "$.data.id" }
          assert:
            - "OfferPlan.${plan_init}.status == DRAFT"
            - "OfferPlan.${plan_init}.price_change_state == NONE"
            - "OfferPlan.${plan_init}.pending_price_cents == null"
            - "OfferPlan.${plan_init}.notice_sent_on == null"

      - name: offer_plan_activate_moves_draft_to_active
        claim_type: valid_transition
        grounds:
          - state_machines.OfferPlan.DRAFT_to_ACTIVE
          - endpoints[POST /paywall/offer-plans/{id}/activate]
        distinguishing_aspect: "The activate action must flip status DRAFT -> ACTIVE and bump version from 1 to 2, leaving the price-change dimension untouched at NONE."
        test_recipe:
          setup:
            - "One DRAFT DIGITAL_ONLY plan at version 1, clock 2026-09-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /paywall/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: SubscriptionOpsAgent
            - call: "POST /paywall/offer-plans"
              payload: { name: "Digital Activate", bundle_type: "DIGITAL_ONLY", intro_price_cents: 499, intro_cycles: 1, standard_price_cents: 1499, standard_from_cycle: 2, cycle_days: 30 }
              as: RevenueManager
              captures: { plan_ac: "$.data.id" }
          trigger:
            - call: "POST /paywall/offer-plans/${plan_ac}/activate"
              payload: {}
              as: RevenueManager
              captures: { plan_ac_status: "$.data.status", plan_ac_v: "$.data.version" }
          assert:
            - "the response status is 200"
            - "OfferPlan.${plan_ac}.status == ACTIVE"
            - "OfferPlan.${plan_ac}.version == 2"
            - "OfferPlan.${plan_ac}.price_change_state == NONE"

      - name: offer_plan_activate_twice_rejected
        claim_type: idempotency
        grounds:
          - validations[priority=22]
          - errors[ERR_PLAN_ALREADY_ACTIVE]
        distinguishing_aspect: "Re-issuing activate on an ACTIVE plan must fail with 409 ERR_PLAN_ALREADY_ACTIVE and must not bump version a second time - the action is not idempotent by design."
        test_recipe:
          setup:
            - "One ACTIVE DIGITAL_ONLY plan at version 2, clock 2026-09-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /paywall/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: SubscriptionOpsAgent
            - call: "POST /paywall/offer-plans"
              payload: { name: "Digital Twice", bundle_type: "DIGITAL_ONLY", intro_price_cents: 499, intro_cycles: 1, standard_price_cents: 1499, standard_from_cycle: 2, cycle_days: 30 }
              as: RevenueManager
              captures: { plan_tw: "$.data.id" }
            - call: "POST /paywall/offer-plans/${plan_tw}/activate"
              payload: {}
              as: RevenueManager
          trigger:
            - call: "POST /paywall/offer-plans/${plan_tw}/activate"
              payload: {}
              as: RevenueManager
              captures: { err_twice: "$.data.error_id" }
          assert:
            - "the response status is 409 and error_id == ERR_PLAN_ALREADY_ACTIVE"
            - "OfferPlan.${plan_tw}.status == ACTIVE"
            - "OfferPlan.${plan_tw}.version == 2"

      - name: price_change_notices_without_scheduled_change_rejected
        claim_type: invalid_transition
        grounds:
          - validations[priority=23]
          - errors[ERR_PRICE_CHANGE_STATE_INVALID]
        distinguishing_aspect: "The price-change dimension has no NONE -> NOTICE_SENT edge, so dispatching notices on a plan with price_change_state NONE must be refused with 409 rather than inventing a notice."
        test_recipe:
          setup:
            - "One ACTIVE DIGITAL_ONLY plan with price_change_state NONE, clock 2026-09-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /paywall/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: SubscriptionOpsAgent
            - call: "POST /paywall/offer-plans"
              payload: { name: "Digital NoChange", bundle_type: "DIGITAL_ONLY", intro_price_cents: 499, intro_cycles: 1, standard_price_cents: 1499, standard_from_cycle: 2, cycle_days: 30 }
              as: RevenueManager
              captures: { plan_nc: "$.data.id" }
            - call: "POST /paywall/offer-plans/${plan_nc}/activate"
              payload: {}
              as: RevenueManager
          trigger:
            - call: "POST /paywall/offer-plans/${plan_nc}/price-change/notices"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { err_state: "$.data.error_id" }
          assert:
            - "the response status is 409 and error_id == ERR_PRICE_CHANGE_STATE_INVALID"
            - "OfferPlan.${plan_nc}.price_change_state == NONE"
            - "OfferPlan.${plan_nc}.notice_sent_on == null"

      - name: price_change_apply_without_notices_rejected
        claim_type: precondition_enforcement
        grounds:
          - validations[priority=35]
          - errors[ERR_PRICE_NOTICE_NOT_SENT]
        distinguishing_aspect: "Applying a SCHEDULED change passes the state check (priority 23 admits SCHEDULED and NOTICE_SENT) and must then be stopped by the regulation precondition notice_sent_on is not null."
        test_recipe:
          setup:
            - "One ACTIVE DIGITAL_ONLY plan with a SCHEDULED price change to 1799 effective 2026-10-01 and no notices dispatched, clock 2026-09-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /paywall/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: SubscriptionOpsAgent
            - call: "POST /paywall/offer-plans"
              payload: { name: "Digital NoNotice", bundle_type: "DIGITAL_ONLY", intro_price_cents: 499, intro_cycles: 1, standard_price_cents: 1499, standard_from_cycle: 2, cycle_days: 30 }
              as: RevenueManager
              captures: { plan_nn: "$.data.id" }
            - call: "POST /paywall/offer-plans/${plan_nn}/activate"
              payload: {}
              as: RevenueManager
              captures: { plan_nn_v: "$.data.version" }
            - call: "POST /paywall/offer-plans/${plan_nn}/price-change"
              payload: { pending_price_cents: 1799, pending_effective_on: "2026-10-01", grandfather_policy: "GRANDFATHER_EXISTING", expected_offer_plan_version: "${plan_nn_v}" }
              as: RevenueManager
          trigger:
            - call: "POST /paywall/offer-plans/${plan_nn}/price-change/apply"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-2"
              captures: { err_notice_missing: "$.data.error_id" }
          assert:
            - "the response status is 409 and error_id == ERR_PRICE_NOTICE_NOT_SENT"
            - "OfferPlan.${plan_nn}.price_change_state == SCHEDULED"
            - "OfferPlan.${plan_nn}.standard_price_cents == 1499"
            - "OfferPlan.${plan_nn}.pending_price_cents == 1799"

      - name: price_change_apply_before_effective_date_rejected
        claim_type: precondition_enforcement
        grounds:
          - validations[priority=37]
          - errors[ERR_PRICE_CHANGE_NOT_EFFECTIVE_YET]
        distinguishing_aspect: "With notices dispatched but the clock still before pending_effective_on, apply must be refused - the noticed change may not take effect early even though every other precondition holds."
        test_recipe:
          setup:
            - "One ACTIVE DIGITAL_ONLY plan with a price change to 1799 effective 2026-10-01, notices dispatched on 2026-09-01 by officer-1, clock still 2026-09-30T00:00:00Z."
          setup_api_calls:
            - call: "POST /paywall/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: SubscriptionOpsAgent
