        distinguishing_aspect: "Two schema-layer faults compete: window_kind 'MAYBE' is outside the enum (priority 17) and hours_offered is exactly 0 (priority 19). Priority 17 is earlier, so the answer is 422 ERR_VALIDATION and specifically not ERR_ZERO_HOURS_NOT_ALLOWED, even though both are 422."
