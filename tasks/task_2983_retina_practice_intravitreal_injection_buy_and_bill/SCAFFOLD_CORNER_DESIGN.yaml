      - name: corner_waterfall_with_no_enrollment_leaves_the_whole_coinsurance_on_the_patient
        claim_type: correct_result
        grounds:
          - calculations.patient_responsibility_waterfall
          - calculations.claim_margin.variants.provisional
          - endpoints.POST_/claims
        distinguishing_aspect: "With no AssistanceEnrollment on file the waterfall degenerates cleanly: total_allowed 28000 + 0 + 10000 == 38000 because PayerDrugPolicy.wastage_reimbursed is false, coinsurance round_half_up(38000 * 0.10) == 3800, assistance_enrollment_id null, foundation 0, and the 3800 stays with the patient because it is above WRITEOFF_THRESHOLD_CENTS. The provisional margin is negative (38000 - 10 * 15000 == -112000): eight of the ten billed units are unreimbursed wastage."
        test_recipe:
          setup:
            - "the corner prologue with encounter ENC-NP DOCUMENTED by CL1 and ATTESTED by CL2"
            - "no assistance enrollment exists for P-NP"
          setup_api_calls:
            - *k_clk
            - *k_pay_comm
            - *k_pay_np
            - *k_pay_mcr
            - *k_drug_ref
            - *k_pol_np_ref
            - *k_pt_np
            - *k_cl1
            - *k_cl2
            - *k_lot
            - *k_img_np
            - *k_plan_np
            - *k_plan_np_act
            - *k_enc_np
            - *k_enc_np_doc
            - *k_enc_np_att
          trigger:
            - call: "POST /claims"
              payload: { injection_encounter_id: "${k_enc_np_id}" }
              as: BillingSpecialist
              captures: { k_claim_np_id: $.data.id, k_claim_np_allowed: $.data.total_allowed_cents, k_claim_np_coins: $.data.coinsurance_cents, k_claim_np_found: $.data.foundation_applied_cents, k_claim_np_resp: $.data.patient_responsibility_cents, k_claim_np_wo: $.data.practice_writeoff_cents, k_claim_np_prov: $.data.provisional_margin_cents }
          assert:
            - "${k_claim_np_allowed} == 38000 and ${k_claim_np_coins} == 3800"
            - "${k_claim_np_found} == 0 and Claim.${k_claim_np_id}.assistance_enrollment_id == null"
            - "${k_claim_np_resp} == 3800 and ${k_claim_np_wo} == 0"
            - "${k_claim_np_prov} == -112000"
            - "Claim.${k_claim_np_id}.realized_margin_cents == null and actual_acquisition_cost_cents == null before any remittance"
            - "Claim.${k_claim_np_id}.wastage_allowed_cents == 0 while wastage_billed_cents == 112000"
            - "Claim.${k_claim_np_id}.hcpcs_code == \"J2778\" and modifiers == [\"RT\", \"JW\"]"
            - "InjectionEncounter.${k_enc_np_id}.status == BILLED"

