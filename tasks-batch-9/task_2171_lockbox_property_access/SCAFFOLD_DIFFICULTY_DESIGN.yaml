# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# task_2171 — Real Estate Lockbox & Property Access Control
# Nine §0.5 rules; 22 instances. Logical clock default: 2026-08-01T00:00:00Z.
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: replacement_charge_flat_schedule_vs_depreciated_book
        grounds:
          - calculations.replacement_charge_amount
          - state_machines.Lockbox.ASSIGNED_to_MISSING
          - entities.BillingCharge.fields.variant_applied
          - entities.BillingCharge.fields.amount_cents
        distinguishing_aspect: |
          Two structurally identical lockboxes (12000 cents, in service since 2025-08-01) reported
          missing on the same logical day produce 12000 cents under flat_schedule and 4560 cents
          under depreciated_book — the dual variant lives on the Lockbox/BillingCharge money domain.
        test_recipe:
          setup:
            - "Association with default policy; logical clock at 2026-08-15T00:00:00Z"
            - "Members Ana (m1) and Ben (m2), both ACTIVE, both with outstanding_balance_cents 0 and loss_report_count 0"
            - "Lockboxes LB-0001 (assigned to Ana) and LB-0002 (assigned to Ben), both replacement_cost_cents 12000, both in_service_since 2025-08-01, both in status ASSIGNED"
          setup_api_calls:
            - call: "POST /associations"
              payload: { name: "Cascade Regional Association", jurisdiction_code: "WA-KING" }
              as: AssociationAdmin
              as_user_id: "admin-1"
              captures: { assoc_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00Z" }
              as: AssociationAdmin
              as_user_id: "admin-1"
            - call: "POST /members"
              payload: { association_id: "${assoc_id}", full_name: "Ana Reyes", email: "ana@example.com", dues_paid_through: "2027-01-31" }
              as: AssociationAdmin
              as_user_id: "admin-1"
              captures: { m1_id: $.data.id }
            - call: "POST /members"
              payload: { association_id: "${assoc_id}", full_name: "Ben Ortiz", email: "ben@example.com", dues_paid_through: "2027-01-31" }
              as: AssociationAdmin
              as_user_id: "admin-1"
              captures: { m2_id: $.data.id }
            - call: "POST /lockboxes"
              payload: { association_id: "${assoc_id}", serial_number: "LB-0001", model: "LB_PRO", replacement_cost_cents: 12000, in_service_since: "2025-08-01" }
              as: AssociationAdmin
              as_user_id: "admin-1"
              captures: { box1_id: $.data.id, box1_v: $.data.version }
            - call: "POST /lockboxes"
              payload: { association_id: "${assoc_id}", serial_number: "LB-0002", model: "LB_PRO", replacement_cost_cents: 12000, in_service_since: "2025-08-01" }
              as: AssociationAdmin
              as_user_id: "admin-1"
              captures: { box2_id: $.data.id, box2_v: $.data.version }
            - call: "POST /lockboxes/${box1_id}/state"
              payload: { action: "ASSIGN", member_id: "${m1_id}", expected_lockbox_version: "${box1_v}" }
              as: AssociationAdmin
              as_user_id: "admin-1"
              captures: { box1_v2: $.data.version }
            - call: "POST /lockboxes/${box2_id}/state"
              payload: { action: "ASSIGN", member_id: "${m2_id}", expected_lockbox_version: "${box2_v}" }
              as: AssociationAdmin
              as_user_id: "admin-1"
              captures: { box2_v2: $.data.version }
          trigger:
            - call: "POST /lockboxes/${box1_id}/state"
              payload: { action: "REPORT_LOST", expected_lockbox_version: "${box1_v2}" }
              as: AssociationAdmin
              as_user_id: "admin-1"
            - call: "POST /lockboxes/${box2_id}/state"
              payload: { action: "REPORT_STOLEN", police_report_number: "SPD-2026-4417", expected_lockbox_version: "${box2_v2}" }
              as: AssociationAdmin
              as_user_id: "admin-1"
          assert:
            - "GET /billing-charges?member_id=${m1_id}&charge_type=REPLACEMENT returns exactly 1 row with amount_cents == 12000"
            - "That row has variant_applied == \"FLAT_SCHEDULE\""
            - "GET /billing-charges?member_id=${m2_id}&charge_type=REPLACEMENT returns exactly 1 row with amount_cents == 4560"
            - "That row has variant_applied == \"DEPRECIATED_BOOK\""
            - "GET /members/${m1_id} returns outstanding_balance_cents == 12300"
            - "GET /members/${m2_id} returns outstanding_balance_cents == 4674"
            - "GET /lockboxes/${box1_id} returns status == \"MISSING\" and loss_type == \"LOST\""
            - "GET /lockboxes/${box2_id} returns status == \"MISSING\" and loss_type == \"STOLEN\""

      - name: recovery_rate_closing_cohort_vs_removal_activity
        grounds:
          - calculations.lockbox_recovery_rate
          - entities.LockboxPlacement.fields.on_time
          - entities.Association.fields.recovery_rate_pct
          - endpoints["GET /associations/{associationId}/recovery-summary"]
        distinguishing_aspect: |
          The same three placements yield recovery_rate_pct 50.00 under closing_cohort (denominator
          anchored on CLOSED listings' close_date) and 66.67 under removal_activity (denominator
          anchored on placement removal activity) — the dual variant lives on the Association
          operational-metric domain, not on the money domain of the replacement charge.
        test_recipe:
          setup:
            - "Association with removal_grace_days 3; agent Ana owns three listings each carrying one placed lockbox"
            - "Listing A closed 2026-08-10 (deadline 2026-08-13T00:00:00Z), its placement REMOVED on 2026-08-12 => on_time true"
            - "Listing B closed 2026-08-10 (deadline 2026-08-13T00:00:00Z), its placement still DELINQUENT after the compliance run of 2026-08-20"
            - "Listing C WITHDRAWN on 2026-08-08 (deadline 2026-08-11T00:00:00Z), its placement REMOVED on 2026-08-12 => on_time false"
