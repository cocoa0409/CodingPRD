      - call: GET /hub/enrollments/${enr_id}/copay-assistances
        as: FinancialCounselor
        captures:
          st: $.data[0].status
      assert:
      - first match with the observed version succeeds (201) and advances enrollment.version to ${enr_v} + 1
      - 'second match with the same (now stale) version: HTTP 412 and ${err} == ERR_STALE_VERSION'
      - the first assistance ${asst_id} is still ACTIVE (${st} == ACTIVE) — the stale write applied no supersede
  - name: occ_outcome_report_with_stale_version_rejected
    claim_type: optimistic_concurrency
    grounds:
