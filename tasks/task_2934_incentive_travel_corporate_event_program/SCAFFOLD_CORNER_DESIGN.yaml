  - name: site_inspection_action_stamps_actor_and_clock_then_locks_out_repeats
    claim_type: action_endpoint
    grounds:
    - §1.5 POST /destinations/{destination_id}/site-inspection, POST /destinations/{destination_id}/shortlist
    - §1.2 Destination inspection_status and status machines
    - §1.1 Destination.inspected_by_user_id, inspected_at
    - §1.4 priority 11 ERR_DESTINATION_STATE_INVALID, priority 4 ERR_DESTINATION_NOT_FOUND
    distinguishing_aspect: |
      Picks the one action pair in §1.5 that writes provenance rather than money: site-inspection stamps the acting X-User-ID and the logical clock onto the row, and shortlist is gated on that stamp having happened. The logical clock is moved off its default first, so an implementation using wall-clock time is caught by an exact timestamp comparison rather than a fuzzy one. It then closes the action off from both sides — inspecting twice and shortlisting an uninspected candidate both fail with the same state error, which is the precondition-enforcement half of the claim.
      No §1.8 instance touches the destination lifecycle at all, and the section-2 precondition_enforcement instance works on the program advance chain instead.
    test_recipe:
      setup: Empty database. A 5000000-cent program at SOURCING owns two candidate destinations, Lisbon
        (risk 35) and Seville (risk 28). Before Lisbon is inspected the logical clock is moved to 2026-08-05T09:30:00Z
        by POST /_clock/set_current_utc. Lisbon is then inspected by user sm-01 with a score of 82 and
        shortlisted; Seville is left untouched in CANDIDATE.
      setup_api_calls:
      - call: POST /programs
        payload:
          name: FY26 Presidents Circle
          fiscal_year: 2026
          qualification_metric: NET_REVENUE_CENTS
          sales_period_start: '2026-01-01T00:00:00Z'
          sales_period_end: '2026-06-30T00:00:00Z'
          budget_total_cents: 5000000
        as: ProgramDirector
        as_user_id: pd-01
        captures:
          p_id: $.data.id
      - call: POST /award-tiers
        payload:
          program_id: ${p_id}
          tier_code: PLATINUM
          tier_rank: 1
          qualification_threshold: 250000000
          budget_per_qualifier_cents: 2500000
          guest_allowance: 1
          air_cabin_class: BUSINESS
          upgrade_allowance_cents: 150000
          service_load_bp: 1275
        as: ProgramDirector
        as_user_id: pd-01
        captures:
          t1_id: $.data.id
      - call: POST /award-tiers
        payload:
          program_id: ${p_id}
          tier_code: GOLD
          tier_rank: 2
          qualification_threshold: 150000000
          budget_per_qualifier_cents: 1600000
          guest_allowance: 1
          air_cabin_class: PREMIUM_ECONOMY
          upgrade_allowance_cents: 40000
          service_load_bp: 800
        as: ProgramDirector
        as_user_id: pd-01
        captures:
          t2_id: $.data.id
      - call: POST /destinations
        payload:
          program_id: ${p_id}
          city: Lisbon
          country_code: PT
          per_person_cost_cents: 431757
          risk_score: 35
          air_gateway_code: LIS
        as: SourcingManager
        as_user_id: sm-01
        captures:
          d1_id: $.data.id
      - call: POST /destinations
        payload:
          program_id: ${p_id}
          city: Seville
          country_code: ES
          per_person_cost_cents: 388000
          risk_score: 28
          air_gateway_code: SVQ
        as: SourcingManager
        as_user_id: sm-01
        captures:
          d2_id: $.data.id
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-05T09:30:00Z'
        as: SourcingManager
        as_user_id: sm-01
      - call: POST /destinations/${d1_id}/site-inspection
        payload:
          inspection_score: 82
        as: SourcingManager
        as_user_id: sm-01
      - call: POST /destinations/${d1_id}/shortlist
        payload: {}
        as: SourcingManager
        as_user_id: sm-01
      - call: POST /qualifiers
        payload:
          program_id: ${p_id}
          employee_code: S-1001
          full_name: Ana Reyes
          baseline_metric: 180000000
          actual_metric: 260000000
          guest_count: 1
        as: SalesOpsAnalyst
        as_user_id: so-01
        captures:
          qa_id: $.data.id
      - call: POST /qualifiers/${qa_id}/review
        payload: {}
        as: SalesOpsAnalyst
        as_user_id: so-01
      - call: POST /programs/${p_id}/advance
        payload:
          to_status: SOURCING
        as: ProgramDirector
        as_user_id: pd-01
      trigger:
      - GET /destinations/${d1_id} as SourcingManager sm-01.
      - 'POST /destinations/${d1_id}/site-inspection {"inspection_score": 91} as SourcingManager sm-01
        — a second inspection of the same row.'
      - POST /destinations/${d2_id}/shortlist as SourcingManager sm-01 — shortlisting a row that was never
        inspected.
      - POST /destinations/${d1_id}/shortlist as SourcingManager sm-01 — shortlisting a row that is already
        shortlisted.
      - 'POST /destinations/00000000-0000-0000-0000-000000009999/site-inspection {"inspection_score":
        80} as SourcingManager sm-01.'
      assert:
      - GET /destinations/${d1_id} shows inspection_status "INSPECTED", inspection_score 82, inspected_by_user_id
        "sm-01" and inspected_at exactly "2026-08-05T09:30:00Z" — the logical clock value, not the wall
        clock and not the default 2026-08-01T00:00:00Z.
      - The same read shows status "SHORTLISTED" — the two dimensions are separate fields and the shortlist
        action moved only the second one.
      - The second site-inspection is rejected with ERR_DESTINATION_STATE_INVALID and HTTP 409; inspection_score
        stays 82 and inspected_at stays 2026-08-05T09:30:00Z, so the rejected call overwrote nothing.
      - Shortlisting Seville is rejected with ERR_DESTINATION_STATE_INVALID and HTTP 409 because its inspection_status
        is still "NOT_INSPECTED"; GET /destinations/${d2_id} still shows status "CANDIDATE".
      - Re-shortlisting Lisbon is rejected with ERR_DESTINATION_STATE_INVALID and HTTP 409 — the action
        is not idempotent-by-success, it is a declared edge out of CANDIDATE only.
      - The inspection of a non-existent id returns ERR_DESTINATION_NOT_FOUND with HTTP 404.
      - 'GET /destinations?program_id=${p_id}&inspection_status=INSPECTED returns total_count 1 and GET
        /destinations?program_id=${p_id}&status=CANDIDATE returns total_count 1: the two status dimensions
        filter independently.'
  - name: notify_qualifiers_bulk_action_reports_partial_skip_counts_and_never_errors
    claim_type: bulk_action
    grounds:
    - §1.5 POST /programs/{program_id}/notify-qualifiers (output block, side effects)
    - §1.2 Qualifier QUALIFIED -> NOTIFIED (bulk trigger with skip semantics)
    - §1.1 Qualifier.notified_at
    - §1.4 priority 3 ERR_ROLE_NOT_PERMITTED
    distinguishing_aspect: |
      The only bulk endpoint in §1.5, and the only place in the scaffold where an ineligible row is skipped instead of erroring. The instance is built so that the two outcomes are both present on the first call (two QUALIFIED winners notified, one DISQUALIFIED row skipped) and so that a second, fully redundant call still returns 200 with every row skipped — skip-not-rollback and skip-not-error are different behaviours from every other endpoint here, and an implementation that raised on the already-notified rows would fail the second call. It also checks the four-field output contract, since notified_qualifier_ids and skipped_qualifier_ids must partition the program's qualifier set exactly.
    test_recipe:
      setup: 'Empty database. The canonical 5000000-cent program is at CONTRACTED with three reviewed
