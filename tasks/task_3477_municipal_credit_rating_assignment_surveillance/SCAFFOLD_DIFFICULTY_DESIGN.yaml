              as: SurveillanceOfficer
              captures: { hop1_obl: $.data.status }
            - call: "GET /muni/ratings/${rating_id}"
              payload: {}
              as: SurveillanceOfficer
              captures: { hop1_posture: $.data.surveillance_posture }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2028-02-26T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /muni/disclosure-obligations/${ob1}"
              payload: {}
              as: SurveillanceOfficer
              captures: { hop2_obl: $.data.status }
            - call: "GET /muni/ratings/${rating_id}"
              payload: {}
              as: SurveillanceOfficer
              captures: { hop2_posture: $.data.surveillance_posture, hop2_status: $.data.status }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2028-03-27T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /muni/ratings/${rating_id}"
              payload: {}
              as: SurveillanceOfficer
              captures: { hop3_status: $.data.status, hop3_reason: $.data.withdraw_reason }
            - call: "GET /muni/issuers/${iss}"
              payload: {}
              as: SurveillanceOfficer
              captures: { hop3_flag: $.data.delinquent_flag }
          assert:
            - "hop 1 at 2028-01-27 (> due 2028-01-26, <= +30d): obligation ${ob1} == OVERDUE and posture == GRACE, rating still PUBLISHED"
            - "hop 2 at 2028-02-26 (> due+30d 2028-02-25): obligation == DELINQUENT, posture == DELINQUENT, rating still PUBLISHED; OBLIGATION_DELINQUENT notification logged"
            - "hop 3 at 2028-03-27 (> due+60d 2028-03-26): obligation == DEFAULTED, Issuer.delinquent_flag == true, Rating.status == WITHDRAWN with withdraw_reason NON_DISCLOSURE; RATING_WITHDRAWN notification logged after OBLIGATION_DELINQUENT"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: appeal_state_precondition_beats_window_temporal
        grounds:
          - validations[priority=6]
          - validations[priority=9]
          - errors[ERR_RATING_STATE_INVALID]
          - errors[ERR_APPEAL_WINDOW_CLOSED]
        distinguishing_aspect: "state-vs-business_temporal pair: an appeal filed against a PUBLISHED rating long after the 120h window violates both priority-6 state and priority-9 temporal rules; the state error ERR_RATING_STATE_INVALID (409) must win over ERR_APPEAL_WINDOW_CLOSED (422)."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. GO rating PUBLISHED at 2026-09-08T00:00:00Z (appeal window ended 2026-09-07T10:30:00Z; no appeal filed)."
          setup_api_calls:
            - *c_default
            - *mk_issuer
            - *mk_cv_go
            - *act_cv_go
            - *mk_eng_go
            - *accept_go
            - *doc_audit
            - *doc_budget
            - *doc_tax
            - *doc_debt
            - *score_a
            - *sched_std
            - *c_open
            - *open_std
            - *votes_aab
            - *vote_a2
            - *vote_bbb3
            - *close_std
            - *get_rating
            - *c_publish
            - *publish_std
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /muni/ratings/${rating_id}/appeals"
              payload: { new_information_codes: ["PENSION_VALUATION"] }
              as: Issuer
              as_user_id: "${iss}"
              captures: { conflict_err: "$.data.error_id" }
          assert:
            - "the response status is 409 and error_id == ERR_RATING_STATE_INVALID (priority 6 state beats priority 9 temporal)"
            - "error_id != ERR_APPEAL_WINDOW_CLOSED even though the 120h window expired weeks earlier"
            - "no Appeal row is created (GET /muni/ratings/${rating_id}/appeals returns an empty list)"

      - name: recused_vote_safety_beats_duplicate_constraint
        grounds:
          - validations[priority=8]
          - validations[priority=10]
          - errors[ERR_RECUSED_VOTER_VOTE_FORBIDDEN]
          - errors[ERR_DUPLICATE_COMMITTEE_VOTE]
        distinguishing_aspect: "business_safety-vs-business_constraint pair: a voter who recorded a RECUSAL and then attempts a VOTE violates both the recusal-integrity safety rule (403, priority 8) and the one-entry-per-voter constraint (409, priority 10); ERR_RECUSED_VOTER_VOTE_FORBIDDEN must win — a different category pair than state/temporal."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. GO engagement COMMITTEE_READY; session scheduled 2026-09-02T10:00-12:00Z and opened at 10:30; voter-1 has recorded a RECUSAL."
          setup_api_calls:
            - *c_default
            - *mk_issuer
            - *mk_cv_go
            - *act_cv_go
            - *mk_eng_go
            - *accept_go
            - *doc_audit
            - *doc_budget
            - *doc_tax
            - *doc_debt
            - *score_a
            - *sched_std
            - *c_open
            - *open_std
            - call: "POST /muni/committee-sessions/${sess}/votes"
              payload: { voter_id: "voter-1", recusal_reason: "conflict of interest" }
              as: CommitteeMember
              as_user_id: "voter-1"
          trigger:
            - call: "POST /muni/committee-sessions/${sess}/votes"
              payload: { voter_id: "voter-1", notch_vote: "A" }
              as: CommitteeMember
              as_user_id: "voter-1"
              captures: { conflict_err: "$.data.error_id" }
          assert:
            - "the response status is 403 and error_id == ERR_RECUSED_VOTER_VOTE_FORBIDDEN (priority 8 safety beats priority 10 constraint)"
            - "error_id != ERR_DUPLICATE_COMMITTEE_VOTE even though voter-1 already has a recorded entry"
            - "session still has exactly one vote row for voter-1, of kind RECUSAL (GET /muni/committee-sessions/${sess}/votes)"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: anchor_boundary_3_5000_inclusive_maps_A
        grounds:
          - calculations.weighted_scorecard
          - entities.AnalyticalScorecard.fields.anchor_notch
        distinguishing_aspect: "Numeric threshold boundary on the scorecard endpoint: GO weights (0.20,0.20,0.20,0.15,0.10,0.15) with scores (4,4,3,4,4,2) land exactly on 3.5000; the anchor threshold is INCLUSIVE (>= 3.50 -> A), while scores (4,4,3,4,3,2) at 3.4000 fall to BBB — boundary precision on the weighted-score metric."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. GO engagement at ANALYSIS (documents complete)."
          setup_api_calls:
            - *c_default
            - *mk_issuer
            - *mk_cv_go
            - *act_cv_go
            - *mk_eng_go
            - *accept_go
            - *doc_audit
            - *doc_budget
            - *doc_tax
            - *doc_debt
          trigger:
            - call: "POST /muni/engagements/${eng_go}/scorecard"
              payload: { score_economy: 4, score_management: 4, score_budgetary_performance: 3, score_flexibility: 4, score_liquidity: 4, score_debt_profile: 2, expected_engagement_version: "${eng_go_v}" }
              as: LeadAnalyst
              as_user_id: "analyst-1"
              captures: { sc_ws: $.data.weighted_score, sc_anchor: $.data.anchor_notch }
            - call: "GET /muni/engagements/${eng_go}"
              payload: {}
              as: LeadAnalyst
              as_user_id: "analyst-1"
              captures: { eng_v2: $.data.version }
            - call: "POST /muni/engagements/${eng_go}/scorecard"
              payload: { score_economy: 4, score_management: 4, score_budgetary_performance: 3, score_flexibility: 4, score_liquidity: 3, score_debt_profile: 2, expected_engagement_version: "${eng_v2}" }
              as: LeadAnalyst
              as_user_id: "analyst-1"
              captures: { sc2_ws: $.data.weighted_score, sc2_anchor: $.data.anchor_notch }
          assert:
            - "first submission: weighted_score == 3.5 (exactly the A threshold 3.5000) and anchor_notch == A (inclusive >=)"
            - "second (superseding) submission: weighted_score == 3.4 and anchor_notch == BBB (one liquidity point drops below the boundary)"
            - "boundary metric is the rounded 4-decimal weighted_score; comparison applies after rounding"

      - name: quorum_exactly_three_votes_completes
        grounds:
          - calculations.committee_outcome_tally
          - state_machines.CommitteeSession.IN_SESSION_to_COMPLETED
        distinguishing_aspect: "Count boundary on the session-close endpoint (a different metric and endpoint than the scorecard boundary): exactly QUORUM_MIN_VOTES == 3 non-recusal votes completes the session; the boundary is inclusive (>= 3)."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. GO engagement COMMITTEE_READY with indicative A; session opened 2026-09-02T10:30:00Z; exactly 3 of 5 pool members vote."
          setup_api_calls:
            - *c_default
            - *mk_issuer
            - *mk_cv_go
            - *act_cv_go
            - *mk_eng_go
            - *accept_go
            - *doc_audit
            - *doc_budget
            - *doc_tax
            - *doc_debt
            - *score_a
            - *sched_std
            - *c_open
            - *open_std
          trigger:
            - *votes_aab
            - *vote_a2
            - *vote_bbb3
            - call: "POST /muni/committee-sessions/${sess}/close"
              payload: {}
              as: CommitteeChair
              as_user_id: "chair-1"
              captures: { sess_status: $.data.status, sess_outcome: $.data.outcome_notch, sess_reason: $.data.adjourn_reason }
          assert:
            - "exactly 3 votes (== QUORUM_MIN_VOTES) closes COMPLETED with outcome_notch == A (median of A,A,BBB) and adjourn_reason null"
            - "Rating created with notch == A and assigned_at == 2026-09-02T10:30:00Z"
            - "voter-4 and voter-5 hold no vote rows; the session completed without them (quorum is a floor, not unanimity)"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: escalated_review_blocks_committee_scheduling
        grounds:
          - state_machines.CriteriaReviewItem.PENDING_to_ESCALATED
          - endpoints.POST_/muni/engagements/{id}/committee-sessions
          - errors[ERR_ESCALATED_REVIEW_BLOCKS_SCHEDULING]
        distinguishing_aspect: "CommitteeSession x CriteriaReviewItem pair: scheduling a session for a NEW engagement of the same issuer is rejected while an ESCALATED review item (spawned by a criteria change on a DIFFERENT, already-published rating) is open — the session's valid transition depends on another entity's state."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Issuer has a PUBLISHED GO rating (2026-09-08T00:00:00Z). Criteria GO-2026.2 activated 2026-09-08 -> review item PENDING due 2026-12-07T00:00:00Z; clock advanced to 2026-12-08T00:00:00Z -> item ESCALATED. A second GO engagement for the same issuer is driven to COMMITTEE_READY (issuer not delinquent; criteria cv_go2 ACTIVE)."
          setup_api_calls:
            - *c_default
            - *mk_issuer
            - *mk_cv_go
            - *act_cv_go
            - *mk_eng_go
            - *accept_go
            - *doc_audit
            - *doc_budget
            - *doc_tax
            - *doc_debt
            - *score_a
            - *sched_std
            - *c_open
            - *open_std
            - *votes_aab
            - *vote_a2
            - *vote_bbb3
            - *close_std
            - *get_rating
            - *c_publish
            - *publish_std
            - *mk_cv_go2
            - call: "POST /muni/criteria-versions/${cv_go2}/activate"
              payload: {}
              as: SurveillanceOfficer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-08T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /muni/engagements"
              payload: { issuer_id: "${iss}", solicitation: "SOLICITED", credit_type: "GENERAL_OBLIGATION", jurisdiction_code: "US-CA" }
              as: Issuer
              as_user_id: "${iss}"
              captures: { eng2: $.data.id }
            - call: "POST /muni/engagements/${eng2}/accept-terms"
              payload: { fee_payment_cents: 4500000, apply_credit_cents: 0 }
              as: Issuer
              as_user_id: "${iss}"
            - call: "POST /muni/engagements/${eng2}/documents"
              payload: { document_code: "AUDIT_FY" }
              as: Issuer
              as_user_id: "${iss}"
            - call: "POST /muni/engagements/${eng2}/documents"
              payload: { document_code: "ADOPTED_BUDGET" }
              as: Issuer
              as_user_id: "${iss}"
            - call: "POST /muni/engagements/${eng2}/documents"
              payload: { document_code: "TAX_BASE_REPORT" }
              as: Issuer
              as_user_id: "${iss}"
            - call: "POST /muni/engagements/${eng2}/documents"
              payload: { document_code: "DEBT_STATEMENT" }
              as: Issuer
