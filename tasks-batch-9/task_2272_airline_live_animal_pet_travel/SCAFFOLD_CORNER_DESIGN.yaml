      - name: connection_above_maximum_window_rejected
        claim_type: interval_merge
        grounds:
          - calculations.connection_welfare_window
          - validations.priority_48
          - errors.ERR_CONNECTION_EXCEEDS_MAXIMUM
        distinguishing_aspect: "The connection window is bounded on BOTH sides: 721 minutes between arrival 15:00Z and the next departure 03:01Z the following day is one minute past MAX_CONNECTION_MINUTES 720, so the second segment is refused with 422 ERR_CONNECTION_EXCEEDS_MAXIMUM rather than accepted with 4 required welfare checks."
        test_recipe:
          setup:
            - "Stations HKG (HK), LAX (US), JFK (US); AN101 HKG->LAX arriving 2026-09-10T15:00Z and AN209 LAX->JFK departing 2026-09-11T03:01Z"
            - "A CARGO reservation whose screened animal holds a RESERVED sequence-1 segment on AN101"
