  - section: validations
    instances:
      - name: duplicate_loan_number_rejected_within_a_trust_but_free_across_trusts
        claim_type: violation_to_error
        grounds:
          - validations[priority=33]
          - errors.ERR_DUPLICATE_LOAN_NUMBER
        distinguishing_aspect: "Uniqueness is scoped to (trust_id, loan_number), not global: the identical loan number that is refused with ERR_DUPLICATE_LOAN_NUMBER (409) inside one securitization is accepted with 201 in a second trust. A global unique index would break the second call, and no index at all would break the first."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; two independent trusts."
          setup_api_calls:
            - call: "POST /special-servicing/trusts"
              payload: { deal_name: "CMBS 2026-V21", closing_date: "2026-01-15T00:00:00Z", original_controlling_class_balance_usd: 40000000 }
              as: PlatformAdmin
              as_user_id: "admin-001"
              captures: { trust_a_id: "$.data.id" }
            - call: "POST /special-servicing/trusts"
              payload: { deal_name: "CMBS 2026-V22", closing_date: "2026-02-15T00:00:00Z", original_controlling_class_balance_usd: 25000000 }
              as: PlatformAdmin
              as_user_id: "admin-001"
              captures: { trust_b_id: "$.data.id" }
            - call: "POST /special-servicing/loans"
              payload: { trust_id: "${trust_a_id}", loan_number: "L-SHARED-01", original_balance_usd: 12000000, current_principal_balance_usd: 10000000, note_rate_pct: 6.0, monthly_debt_service_usd: 65000, maturity_date: "2029-06-01T00:00:00Z", securitization_value_usd: 15000000 }
              as: MasterServicer
              as_user_id: "ms-001"
              captures: { loan_a_id: "$.data.id", loan_a_number: "$.data.loan_number" }
          trigger:
            - call: "POST /special-servicing/loans"
              payload: { trust_id: "${trust_a_id}", loan_number: "L-SHARED-01", original_balance_usd: 8000000, current_principal_balance_usd: 7500000, note_rate_pct: 5.75, monthly_debt_service_usd: 48000, maturity_date: "2030-03-01T00:00:00Z", securitization_value_usd: 9000000 }
              as: MasterServicer
              as_user_id: "ms-001"
              captures: { duplicate_error: "$.data.error_id" }
            - call: "POST /special-servicing/loans"
              payload: { trust_id: "${trust_b_id}", loan_number: "L-SHARED-01", original_balance_usd: 8000000, current_principal_balance_usd: 7500000, note_rate_pct: 5.75, monthly_debt_service_usd: 48000, maturity_date: "2030-03-01T00:00:00Z", securitization_value_usd: 9000000 }
              as: MasterServicer
              as_user_id: "ms-001"
              captures: { loan_b_id: "$.data.id", loan_b_number: "$.data.loan_number" }
            - call: "GET /special-servicing/loans"
              payload: { trust_id: "${trust_a_id}" }
              as: MasterServicer
              as_user_id: "ms-001"
              captures: { trust_a_first_loan: "$.data[0].id" }
          assert:
            - "The second loan in trust A returns HTTP 409 with error_id ERR_DUPLICATE_LOAN_NUMBER"
            - "The same loan_number in trust B returns HTTP 201 with a new id and loan_number L-SHARED-01"
            - "GET /loans?trust_id=trust A returns exactly one row, total_count 1 — the refused create left no trace"
            - "Trust A version is unchanged by the refused call"
            - "The comparison is on the exact stored string: loan_number is not normalised, trimmed or case-folded by the uniqueness check"

      - name: modification_deposit_exactly_at_the_floor_is_accepted
        claim_type: satisfaction_to_pass
        grounds:
          - validations[priority=26]
          - calculations.request_deposit_floor
        distinguishing_aspect: "The deposit floor is inclusive: a MODIFICATION request wired with exactly 25,000.00 — the floor to the cent — is accepted with 201, and the row lands in SUBMITTED with its analysis fields still null. A strict greater-than comparison would refuse the compliant borrower."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; a loan in SPECIAL_SERVICING."
            - "The caller is the Borrower identity for that loan, i.e. X-User-ID == loan_id."
          setup_api_calls:
            - call: "POST /special-servicing/trusts"
              payload: { deal_name: "CMBS 2026-V23", closing_date: "2026-01-15T00:00:00Z", original_controlling_class_balance_usd: 40000000 }
              as: PlatformAdmin
              as_user_id: "admin-001"
              captures: { trust_id: "$.data.id" }
            - call: "POST /special-servicing/loans"
              payload: { trust_id: "${trust_id}", loan_number: "L-V23", original_balance_usd: 12000000, current_principal_balance_usd: 10000000, note_rate_pct: 6.0, monthly_debt_service_usd: 65000, maturity_date: "2029-06-01T00:00:00Z", securitization_value_usd: 15000000 }
              as: MasterServicer
              as_user_id: "ms-001"
              captures: { loan_id: "$.data.id" }
