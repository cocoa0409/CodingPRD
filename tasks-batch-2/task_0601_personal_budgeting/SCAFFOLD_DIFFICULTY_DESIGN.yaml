# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index) — task_0601
# 9 rule_ids x >= 2 instances = 18 instances total.
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: net_worth_cleared_vs_pending_aware
        grounds:
          - calculations.net_worth_rollup
          - entities.Household.fields.net_worth_cents
          - entities.Household.fields.projected_net_worth_cents
        distinguishing_aspect: |
          On a Household (account/net-worth domain): a single PENDING outflow of -5000 makes
          projected_net_worth_cents == 5000 while net_worth_cents == 10000 — the cleared variant
          excludes PENDING, the pending-aware variant includes it, so the two diverge by exactly 5000.
        test_recipe:
          setup:
            - "Household with one DEPOSITORY account, opening_balance_cents=10000"
            - "One PENDING transaction amount_cents=-5000 (not posted)"
          setup_api_calls:
            - call: "POST /households"
              payload: { name: "H1", owner_email: "o@x.com", owner_display_name: "Owner" }
              as: PlatformAdmin
              captures: { hh_id: $.data.id, owner_id: $.data.owner_member_id }
            - call: "POST /households/${hh_id}/accounts"
              payload: { institution_name: "Bank", account_type: "DEPOSITORY", opening_balance_cents: 10000 }
              as: HouseholdOwner
              as_user_id: "${owner_id}"
              captures: { acc_id: $.data.id }
            - call: "POST /accounts/${acc_id}/transactions"
              payload: { amount_cents: -5000, merchant_name: "Store" }
              as: PlatformAdmin
              captures: { txn_id: $.data.id }
          trigger:
            - call: "GET /households/${hh_id}"
              payload: {}
              as: HouseholdOwner
              as_user_id: "${owner_id}"
          assert:
            - "Household.${hh_id}.net_worth_cents == 10000"
            - "Household.${hh_id}.projected_net_worth_cents == 5000"

      - name: envelope_allocated_vs_available
        grounds:
          - calculations.envelope_accounting
          - entities.BudgetCategory.fields.allocated_cents
          - entities.BudgetCategory.fields.available_cents
        distinguishing_aspect: |
          On a BudgetCategory (envelope domain, different entity from net-worth): with allocated_cents=10000
          and a POSTED outflow of -3000, allocated_cents stays 10000 while available_cents becomes 7000 —
          allocated is the static plan, available subtracts spent, so the two diverge by spent magnitude 3000.
        test_recipe:
          setup:
            - "Household with current OPEN period, category Groceries allocated_cents=10000"
            - "One POSTED, categorized outflow -3000 against Groceries"
          setup_api_calls:
            - call: "POST /households"
              payload: { name: "H2", owner_email: "o2@x.com", owner_display_name: "Owner2" }
              as: PlatformAdmin
              captures: { hh_id: $.data.id, owner_id: $.data.owner_member_id }
            - call: "POST /households/${hh_id}/budget-periods"
              payload: { month: "2026-01", income_expected_cents: 10000 }
              as: HouseholdOwner
              as_user_id: "${owner_id}"
              captures: { period_id: $.data.id }
            - call: "POST /households/${hh_id}/budget-periods/${period_id}/categories"
              payload: { name: "Groceries", allocated_cents: 10000 }
              as: HouseholdOwner
              as_user_id: "${owner_id}"
              captures: { cat_id: $.data.id }
            - call: "POST /households/${hh_id}/accounts"
              payload: { institution_name: "Bank", account_type: "DEPOSITORY", opening_balance_cents: 50000 }
              as: HouseholdOwner
              as_user_id: "${owner_id}"
              captures: { acc_id: $.data.id }
            - call: "POST /accounts/${acc_id}/transactions"
              payload: { amount_cents: -3000, merchant_name: "Mart", budget_category_id: "${cat_id}" }
              as: PlatformAdmin
              captures: { txn_id: $.data.id }
            - call: "POST /accounts/${acc_id}/transactions/${txn_id}/post"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "GET /households/budget-categories/${cat_id}"
              payload: {}
              as: HouseholdOwner
              as_user_id: "${owner_id}"
          assert:
            - "BudgetCategory.${cat_id}.allocated_cents == 10000"
            - "BudgetCategory.${cat_id}.available_cents == 7000"
            - "BudgetCategory.${cat_id}.spent_cents == 3000"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: net_worth_signed_multi_account_nonlinear
        grounds:
          - calculations.net_worth_rollup
          - entities.Account.fields.account_type
          - entities.Account.fields.cleared_balance_cents
        distinguishing_aspect: |
          Mode (a): net_worth_cents combines >=3 inputs with non-linear sign selection on account_type —
          a DEPOSITORY +20000, an INVESTMENT +30000, and a CREDIT -8000 (liability negated) yield
          20000 + 30000 - 8000 = 42000, where the CREDIT balance flips sign by branch on account_type.
        test_recipe:
          setup:
            - "Household with DEPOSITORY (opening 20000), INVESTMENT (opening 30000), CREDIT (opening 8000)"
            - "No transactions"
          setup_api_calls:
            - call: "POST /households"
              payload: { name: "H3", owner_email: "o3@x.com", owner_display_name: "Owner3" }
              as: PlatformAdmin
              captures: { hh_id: $.data.id, owner_id: $.data.owner_member_id }
            - call: "POST /households/${hh_id}/accounts"
              payload: { institution_name: "Bank", account_type: "DEPOSITORY", opening_balance_cents: 20000 }
              as: HouseholdOwner
              as_user_id: "${owner_id}"
            - call: "POST /households/${hh_id}/accounts"
              payload: { institution_name: "Broker", account_type: "INVESTMENT", opening_balance_cents: 30000 }
              as: HouseholdOwner
              as_user_id: "${owner_id}"
            - call: "POST /households/${hh_id}/accounts"
              payload: { institution_name: "Card", account_type: "CREDIT", opening_balance_cents: 8000 }
              as: HouseholdOwner
              as_user_id: "${owner_id}"
          trigger:
            - call: "GET /households/${hh_id}"
              payload: {}
              as: HouseholdOwner
              as_user_id: "${owner_id}"
          assert:
            - "Household.${hh_id}.net_worth_cents == 42000"

      - name: cash_flow_chronological_same_day_order
        grounds:
          - calculations.cash_flow_forecast
          - entities.RecurringBill.fields.day_of_month
          - entities.RecurringBill.fields.amount_cents
        distinguishing_aspect: |
          Mode (c): cash_flow_forecast pins an explicit chronological evaluation order — bills due on the
          same day are applied in (day_of_month, created_at ASC) order, never id — so the running balance
          is well-defined; with cash 10000 and two bills due day 5 (-4000 then -7000) the min projected
          balance is -1000 (10000-4000-7000), not order-ambiguous.
        test_recipe:
          setup:
            - "Clock set to 2026-02-01; household with DEPOSITORY cleared 10000"
            - "Two SCHEDULED bills both day_of_month=5: payee A amount 4000 (created first), payee B amount 7000"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /households"
              payload: { name: "H4", owner_email: "o4@x.com", owner_display_name: "Owner4" }
              as: PlatformAdmin
              captures: { hh_id: $.data.id, owner_id: $.data.owner_member_id }
            - call: "POST /households/${hh_id}/budget-periods"
              payload: { month: "2026-02", income_expected_cents: 0 }
              as: HouseholdOwner
              as_user_id: "${owner_id}"
              captures: { period_id: $.data.id }
            - call: "POST /households/${hh_id}/budget-periods/${period_id}/categories"
              payload: { name: "Bills", allocated_cents: 0 }
              as: HouseholdOwner
              as_user_id: "${owner_id}"
              captures: { cat_id: $.data.id }
            - call: "POST /households/${hh_id}/accounts"
              payload: { institution_name: "Bank", account_type: "DEPOSITORY", opening_balance_cents: 10000 }
              as: HouseholdOwner
              as_user_id: "${owner_id}"
            - call: "POST /households/${hh_id}/recurring-bills"
              payload: { payee: "A", amount_cents: 4000, day_of_month: 5, funding_category_id: "${cat_id}" }
              as: HouseholdOwner
              as_user_id: "${owner_id}"
            - call: "POST /households/${hh_id}/recurring-bills"
              payload: { payee: "B", amount_cents: 7000, day_of_month: 5, funding_category_id: "${cat_id}" }
              as: HouseholdOwner
              as_user_id: "${owner_id}"
          trigger:
            - call: "GET /households/${hh_id}/cash-flow-forecast"
              payload: { horizon_days: 30 }
              as: HouseholdOwner
              as_user_id: "${owner_id}"
          assert:
            - "cash-flow-forecast.min_projected_balance_cents == -1000"
            - "cash-flow-forecast.shortfall == true"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: transaction_recategorize_cycle
        grounds:
          - state_machines.Transaction.POSTED_to_RECATEGORIZED
          - state_machines.Transaction.RECATEGORIZED_to_POSTED
        distinguishing_aspect: |
          On Transaction: POSTED -> RECATEGORIZED -> POSTED forms a cycle — a posted txn can be
          recategorized repeatedly, returning to POSTED each time, so after two recategorizes the
          final budget_category_id is the second target and status is POSTED again.
        test_recipe:
          setup:
            - "Household with OPEN period and two categories Food and Fun; a POSTED txn -2000 in Food"
          setup_api_calls:
            - call: "POST /households"
              payload: { name: "H5", owner_email: "o5@x.com", owner_display_name: "Owner5" }
              as: PlatformAdmin
              captures: { hh_id: $.data.id, owner_id: $.data.owner_member_id }
            - call: "POST /households/${hh_id}/budget-periods"
              payload: { month: "2026-01", income_expected_cents: 20000 }
              as: HouseholdOwner
              as_user_id: "${owner_id}"
              captures: { period_id: $.data.id }
            - call: "POST /households/${hh_id}/budget-periods/${period_id}/categories"
              payload: { name: "Food", allocated_cents: 10000 }
              as: HouseholdOwner
              as_user_id: "${owner_id}"
              captures: { food_id: $.data.id }
            - call: "POST /households/${hh_id}/budget-periods/${period_id}/categories"
              payload: { name: "Fun", allocated_cents: 10000 }
              as: HouseholdOwner
              as_user_id: "${owner_id}"
              captures: { fun_id: $.data.id }
            - call: "POST /households/${hh_id}/accounts"
              payload: { institution_name: "Bank", account_type: "DEPOSITORY", opening_balance_cents: 50000 }
              as: HouseholdOwner
              as_user_id: "${owner_id}"
              captures: { acc_id: $.data.id }
            - call: "POST /accounts/${acc_id}/transactions"
              payload: { amount_cents: -2000, merchant_name: "Cafe", budget_category_id: "${food_id}" }
              as: PlatformAdmin
              captures: { txn_id: $.data.id }
            - call: "POST /accounts/${acc_id}/transactions/${txn_id}/post"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /accounts/${acc_id}/transactions/${txn_id}/recategorize"
              payload: { budget_category_id: "${fun_id}" }
              as: HouseholdOwner
              as_user_id: "${owner_id}"
            - call: "POST /accounts/${acc_id}/transactions/${txn_id}/recategorize"
              payload: { budget_category_id: "${food_id}" }
              as: HouseholdOwner
              as_user_id: "${owner_id}"
              captures: { final_status: $.data.status, final_cat: $.data.budget_category_id }
          assert:
            - "Transaction.${txn_id}.status == POSTED"
            - "Transaction.${txn_id}.budget_category_id == ${food_id}"
            - "BudgetCategory.${fun_id}.spent_cents == 0"
            - "BudgetCategory.${food_id}.spent_cents == 2000"

      - name: goal_funded_reopen_cycle
        grounds:
          - state_machines.Goal.ACTIVE_to_FUNDED
          - state_machines.Goal.FUNDED_to_ACTIVE
          - calculations.goal_funding
        distinguishing_aspect: |
          On Goal (different entity from Transaction): ACTIVE -> FUNDED -> ACTIVE is a cycle — funding
          to target flips FUNDED, then PATCH raising target above funded reopens to ACTIVE, so the same
          goal moves FUNDED then back to ACTIVE driven by two different triggers.
        test_recipe:
          setup:
            - "Household OPEN period; category Vacation allocated 10000; goal target 5000 funded to 5000 (FUNDED)"
          setup_api_calls:
            - call: "POST /households"
              payload: { name: "H6", owner_email: "o6@x.com", owner_display_name: "Owner6" }
              as: PlatformAdmin
              captures: { hh_id: $.data.id, owner_id: $.data.owner_member_id }
            - call: "POST /households/${hh_id}/budget-periods"
              payload: { month: "2026-01", income_expected_cents: 10000 }
              as: HouseholdOwner
              as_user_id: "${owner_id}"
              captures: { period_id: $.data.id }
            - call: "POST /households/${hh_id}/budget-periods/${period_id}/categories"
              payload: { name: "Vacation", allocated_cents: 10000 }
              as: HouseholdOwner
              as_user_id: "${owner_id}"
              captures: { cat_id: $.data.id }
            - call: "POST /households/${hh_id}/goals"
              payload: { name: "Trip", target_cents: 5000, funding_category_id: "${cat_id}" }
              as: HouseholdOwner
              as_user_id: "${owner_id}"
              captures: { goal_id: $.data.id }
            - call: "POST /households/${hh_id}/goals/${goal_id}/contribute"
              payload: { amount_cents: 5000 }
              as: HouseholdOwner
              as_user_id: "${owner_id}"
          trigger:
            - call: "PATCH /households/${hh_id}/goals/${goal_id}"
              payload: { target_cents: 8000 }
              as: HouseholdOwner
              as_user_id: "${owner_id}"
              captures: { goal_status: $.data.status }
          assert:
            - "Goal.${goal_id}.status == ACTIVE"
            - "Goal.${goal_id}.funded_cents == 5000"
            - "Goal.${goal_id}.target_cents == 8000"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: post_to_envelope_to_posture_depth3
        grounds:
          - state_machines.Transaction.PENDING_to_POSTED
          - calculations.envelope_accounting
          - entities.Household.fields.posture
        distinguishing_aspect: |
          Depth-3 chain from transaction post: posting a -12000 outflow (A) mutates BudgetCategory
          spent/available pushing it OVER (B, caused by A); that OVER state (B) then drives
          Household.posture to OVERSPENT (C, caused by B) — each hop caused by the previous, not by post directly.
        test_recipe:
          setup:
            - "Household OPEN period; category Food allocated 10000; PENDING outflow -12000 categorized to Food"
          setup_api_calls:
            - call: "POST /households"
              payload: { name: "H7", owner_email: "o7@x.com", owner_display_name: "Owner7" }
              as: PlatformAdmin
              captures: { hh_id: $.data.id, owner_id: $.data.owner_member_id }
            - call: "POST /households/${hh_id}/budget-periods"
              payload: { month: "2026-01", income_expected_cents: 10000 }
              as: HouseholdOwner
              as_user_id: "${owner_id}"
              captures: { period_id: $.data.id }
            - call: "POST /households/${hh_id}/budget-periods/${period_id}/categories"
              payload: { name: "Food", allocated_cents: 10000 }
              as: HouseholdOwner
              as_user_id: "${owner_id}"
              captures: { cat_id: $.data.id }
            - call: "POST /households/${hh_id}/accounts"
              payload: { institution_name: "Bank", account_type: "DEPOSITORY", opening_balance_cents: 50000 }
              as: HouseholdOwner
              as_user_id: "${owner_id}"
              captures: { acc_id: $.data.id }
            - call: "POST /accounts/${acc_id}/transactions"
              payload: { amount_cents: -12000, merchant_name: "Mart", budget_category_id: "${cat_id}" }
              as: PlatformAdmin
              captures: { txn_id: $.data.id }
          trigger:
            - call: "POST /accounts/${acc_id}/transactions/${txn_id}/post"
              payload: {}
              as: PlatformAdmin
          assert:
            - "BudgetCategory.${cat_id}.available_cents == -2000"
            - "BudgetCategory.${cat_id}.envelope_state == OVER"
            - "Household.${hh_id}.posture == OVERSPENT"

      - name: remove_to_envelope_to_posture_depth2
        grounds:
          - state_machines.Transaction.POSTED_to_REMOVED
          - calculations.envelope_accounting
          - entities.Household.fields.posture
        distinguishing_aspect: |
          Depth-2 chain from a different trigger (transaction remove): removing the OVER-causing POSTED
          outflow (A) recomputes its BudgetCategory back to non-OVER (B, caused by A), which then clears
          Household.posture back to HEALTHY (C, caused by B); origin trigger differs from the post cascade.
        test_recipe:
          setup:
            - "Household where Food is OVER (available -2000) and posture OVERSPENT, from a POSTED -12000 txn"
          setup_api_calls:
            - call: "POST /households"
              payload: { name: "H8", owner_email: "o8@x.com", owner_display_name: "Owner8" }
              as: PlatformAdmin
              captures: { hh_id: $.data.id, owner_id: $.data.owner_member_id }
            - call: "POST /households/${hh_id}/budget-periods"
              payload: { month: "2026-01", income_expected_cents: 10000 }
              as: HouseholdOwner
              as_user_id: "${owner_id}"
              captures: { period_id: $.data.id }
            - call: "POST /households/${hh_id}/budget-periods/${period_id}/categories"
              payload: { name: "Food", allocated_cents: 10000 }
              as: HouseholdOwner
              as_user_id: "${owner_id}"
              captures: { cat_id: $.data.id }
            - call: "POST /households/${hh_id}/accounts"
              payload: { institution_name: "Bank", account_type: "DEPOSITORY", opening_balance_cents: 50000 }
              as: HouseholdOwner
              as_user_id: "${owner_id}"
              captures: { acc_id: $.data.id }
            - call: "POST /accounts/${acc_id}/transactions"
              payload: { amount_cents: -12000, merchant_name: "Mart", budget_category_id: "${cat_id}" }
              as: PlatformAdmin
              captures: { txn_id: $.data.id }
            - call: "POST /accounts/${acc_id}/transactions/${txn_id}/post"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /accounts/${acc_id}/transactions/${txn_id}/remove"
              payload: {}
              as: PlatformAdmin
          assert:
            - "BudgetCategory.${cat_id}.available_cents == 10000"
            - "BudgetCategory.${cat_id}.envelope_state == FUNDED"
            - "Household.${hh_id}.posture == HEALTHY"

  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: frozen_beats_insufficient_envelope
        grounds:
          - validations[priority=7]
          - validations[priority=11]
        distinguishing_aspect: |
          business_safety (priority 7, ERR_HOUSEHOLD_FROZEN) vs business_fiscal (priority 11,
          ERR_INSUFFICIENT_ENVELOPE): a frozen household + a goal contribution that also exceeds the
          envelope returns ERR_HOUSEHOLD_FROZEN, proving the safety check fires before the fiscal check.
        test_recipe:
          setup:
            - "Frozen household; goal whose funding category has available 1000; contribution 9000 attempted"
          setup_api_calls:
            - call: "POST /households"
              payload: { name: "H9", owner_email: "o9@x.com", owner_display_name: "Owner9" }
              as: PlatformAdmin
              captures: { hh_id: $.data.id, owner_id: $.data.owner_member_id }
            - call: "POST /households/${hh_id}/budget-periods"
              payload: { month: "2026-01", income_expected_cents: 1000 }
              as: HouseholdOwner
              as_user_id: "${owner_id}"
              captures: { period_id: $.data.id }
            - call: "POST /households/${hh_id}/budget-periods/${period_id}/categories"
              payload: { name: "Save", allocated_cents: 1000 }
              as: HouseholdOwner
              as_user_id: "${owner_id}"
              captures: { cat_id: $.data.id }
            - call: "POST /households/${hh_id}/goals"
              payload: { name: "Fund", target_cents: 20000, funding_category_id: "${cat_id}" }
              as: HouseholdOwner
              as_user_id: "${owner_id}"
              captures: { goal_id: $.data.id }
            - call: "POST /households/${hh_id}/freeze"
              payload: {}
              as: HouseholdOwner
              as_user_id: "${owner_id}"
          trigger:
            - call: "POST /households/${hh_id}/goals/${goal_id}/contribute"
              payload: { amount_cents: 9000 }
              as: HouseholdOwner
              as_user_id: "${owner_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_HOUSEHOLD_FROZEN"
            - "http_status == 409"

      - name: forbidden_beats_not_found
        grounds:
          - validations[priority=2]
          - validations[priority=3]
        distinguishing_aspect: |
          auth (priority 2, ERR_FORBIDDEN) vs existence (priority 3, ERR_NOT_FOUND) — a different
          error-category pair from the safety-vs-fiscal conflict: a HouseholdMember (never permitted the
          OWNER-only archive op) targets a non-existent account id, so both the role check and the existence
          check would fail; ERR_FORBIDDEN is returned, proving auth is evaluated before existence.
        test_recipe:
          setup:
            - "Household with owner and an invited MEMBER; archive attempted on a non-existent account id by the MEMBER"
          setup_api_calls:
            - call: "POST /households"
              payload: { name: "H10", owner_email: "o10@x.com", owner_display_name: "Owner10" }
              as: PlatformAdmin
              captures: { hh_id: $.data.id, owner_id: $.data.owner_member_id }
            - call: "POST /households/${hh_id}/members"
              payload: { email: "m10@x.com", display_name: "Mem10" }
              as: HouseholdOwner
              as_user_id: "${owner_id}"
              captures: { mem_id: $.data.id }
          trigger:
            - call: "POST /households/${hh_id}/accounts/00000000-0000-0000-0000-000000000000/archive"
              payload: {}
              as: HouseholdMember
              as_user_id: "${mem_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_FORBIDDEN"
            - "http_status == 403"

  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: goal_funds_at_exact_target
        grounds:
          - calculations.goal_funding
          - state_machines.Goal.ACTIVE_to_FUNDED
        distinguishing_aspect: |
          Numeric >= boundary on Goal.funded_cents vs target_cents: a contribution bringing funded_cents
          to exactly target_cents (5000 == 5000) transitions the goal to FUNDED, whereas 4999 would not —
          the threshold is >=, reachable via the contribute endpoint.
        test_recipe:
          setup:
            - "Household OPEN period; category Save allocated 5000; goal target 5000"
          setup_api_calls:
            - call: "POST /households"
              payload: { name: "H11", owner_email: "o11@x.com", owner_display_name: "Owner11" }
              as: PlatformAdmin
              captures: { hh_id: $.data.id, owner_id: $.data.owner_member_id }
            - call: "POST /households/${hh_id}/budget-periods"
              payload: { month: "2026-01", income_expected_cents: 5000 }
              as: HouseholdOwner
              as_user_id: "${owner_id}"
              captures: { period_id: $.data.id }
            - call: "POST /households/${hh_id}/budget-periods/${period_id}/categories"
              payload: { name: "Save", allocated_cents: 5000 }
              as: HouseholdOwner
              as_user_id: "${owner_id}"
              captures: { cat_id: $.data.id }
            - call: "POST /households/${hh_id}/goals"
              payload: { name: "Buffer", target_cents: 5000, funding_category_id: "${cat_id}" }
              as: HouseholdOwner
              as_user_id: "${owner_id}"
              captures: { goal_id: $.data.id }
          trigger:
            - call: "POST /households/${hh_id}/goals/${goal_id}/contribute"
              payload: { amount_cents: 5000 }
              as: HouseholdOwner
              as_user_id: "${owner_id}"
          assert:
            - "Goal.${goal_id}.funded_cents == 5000"
            - "Goal.${goal_id}.status == FUNDED"

      - name: archive_blocked_by_nonzero_pending_count
        grounds:
          - validations[priority=9]
          - state_machines.Account.LINKED_to_ARCHIVED
        distinguishing_aspect: |
          Zero-vs-nonzero count boundary on a different metric (PENDING transaction count) and a different
          endpoint (account archive): an account with exactly one PENDING transaction is rejected with
          ERR_PENDING_TRANSACTIONS_EXIST, while zero PENDING would archive successfully.
        test_recipe:
          setup:
            - "Household with one DEPOSITORY account carrying one PENDING transaction"
          setup_api_calls:
            - call: "POST /households"
              payload: { name: "H12", owner_email: "o12@x.com", owner_display_name: "Owner12" }
              as: PlatformAdmin
              captures: { hh_id: $.data.id, owner_id: $.data.owner_member_id }
            - call: "POST /households/${hh_id}/accounts"
              payload: { institution_name: "Bank", account_type: "DEPOSITORY", opening_balance_cents: 10000 }
              as: HouseholdOwner
              as_user_id: "${owner_id}"
              captures: { acc_id: $.data.id }
            - call: "POST /accounts/${acc_id}/transactions"
              payload: { amount_cents: -1000, merchant_name: "Store" }
              as: PlatformAdmin
              captures: { txn_id: $.data.id }
          trigger:
            - call: "POST /households/${hh_id}/accounts/${acc_id}/archive"
              payload: {}
              as: HouseholdOwner
              as_user_id: "${owner_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_PENDING_TRANSACTIONS_EXIST"
            - "http_status == 409"

  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: transaction_create_blocked_by_account_archived
        grounds:
          - state_machines.Account.LINKED_to_ARCHIVED
          - entities.Account.fields.status
          - validations[priority=6]
        distinguishing_aspect: |
          Transaction->Account pair: ingesting a Transaction is gated on its parent Account.status; the
          account is archived clean (no PENDING transactions), and a subsequent ingest on that ARCHIVED
          account is rejected with ERR_ACCOUNT_ARCHIVED — a transition valid for one entity (Account)
          forbids an operation on a related entity (Transaction).
        test_recipe:
          setup:
            - "Household; one DEPOSITORY account archived while it has zero PENDING transactions"
          setup_api_calls:
            - call: "POST /households"
              payload: { name: "H13", owner_email: "o13@x.com", owner_display_name: "Owner13" }
              as: PlatformAdmin
              captures: { hh_id: $.data.id, owner_id: $.data.owner_member_id }
            - call: "POST /households/${hh_id}/accounts"
              payload: { institution_name: "Bank", account_type: "DEPOSITORY", opening_balance_cents: 10000 }
              as: HouseholdOwner
              as_user_id: "${owner_id}"
              captures: { acc_id: $.data.id }
            - call: "POST /households/${hh_id}/accounts/${acc_id}/archive"
              payload: {}
              as: HouseholdOwner
              as_user_id: "${owner_id}"
          trigger:
            - call: "POST /accounts/${acc_id}/transactions"
              payload: { amount_cents: -500, merchant_name: "Late" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_ACCOUNT_ARCHIVED"
            - "http_status == 409"

      - name: contribute_blocked_by_household_frozen
        grounds:
          - state_machines.Goal.ACTIVE_to_FUNDED
          - entities.Household.fields.posture
          - validations[priority=7]
        distinguishing_aspect: |
          Goal->Household pair (different from Transaction->Account): a Goal contribution is gated on the
          parent Household.posture; while the household is FROZEN, contribute is rejected with
          ERR_HOUSEHOLD_FROZEN even though the envelope and goal are otherwise valid.
        test_recipe:
          setup:
            - "Household OPEN period; category Save allocated 9000; ACTIVE goal target 9000; household FROZEN"
          setup_api_calls:
            - call: "POST /households"
              payload: { name: "H14", owner_email: "o14@x.com", owner_display_name: "Owner14" }
              as: PlatformAdmin
              captures: { hh_id: $.data.id, owner_id: $.data.owner_member_id }
            - call: "POST /households/${hh_id}/budget-periods"
              payload: { month: "2026-01", income_expected_cents: 9000 }
              as: HouseholdOwner
              as_user_id: "${owner_id}"
              captures: { period_id: $.data.id }
            - call: "POST /households/${hh_id}/budget-periods/${period_id}/categories"
              payload: { name: "Save", allocated_cents: 9000 }
              as: HouseholdOwner
              as_user_id: "${owner_id}"
              captures: { cat_id: $.data.id }
            - call: "POST /households/${hh_id}/goals"
              payload: { name: "Buf", target_cents: 9000, funding_category_id: "${cat_id}" }
              as: HouseholdOwner
              as_user_id: "${owner_id}"
              captures: { goal_id: $.data.id }
            - call: "POST /households/${hh_id}/freeze"
              payload: {}
              as: HouseholdOwner
              as_user_id: "${owner_id}"
          trigger:
            - call: "POST /households/${hh_id}/goals/${goal_id}/contribute"
              payload: { amount_cents: 5000 }
              as: HouseholdOwner
              as_user_id: "${owner_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_HOUSEHOLD_FROZEN"
            - "http_status == 409"

  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: duplicate_period_month_rejected
        grounds:
          - validations[priority=10]
          - entities.BudgetPeriod.fields.month
        distinguishing_aspect: |
          On BudgetPeriod: two periods occupying the same calendar-month interval (month=2026-01) collide —
          the second create is rejected with ERR_DUPLICATE_RESOURCE. Interval semantics: month is a discrete
          closed point, exact-equality occupancy (one period per month per household).
        test_recipe:
          setup:
            - "Household with an OPEN period for 2026-01; attempt a second period for 2026-01"
          setup_api_calls:
            - call: "POST /households"
              payload: { name: "H15", owner_email: "o15@x.com", owner_display_name: "Owner15" }
              as: PlatformAdmin
              captures: { hh_id: $.data.id, owner_id: $.data.owner_member_id }
            - call: "POST /households/${hh_id}/budget-periods"
              payload: { month: "2026-01", income_expected_cents: 0 }
              as: HouseholdOwner
              as_user_id: "${owner_id}"
              captures: { p1_id: $.data.id }
          trigger:
            - call: "POST /households/${hh_id}/budget-periods"
              payload: { month: "2026-01", income_expected_cents: 0 }
              as: HouseholdOwner
              as_user_id: "${owner_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_DUPLICATE_RESOURCE"
            - "http_status == 409"

      - name: recurring_bill_due_day_buffer_collision
        grounds:
          - validations[priority=10b]
          - entities.RecurringBill.fields.day_of_month
          - entities.RecurringBill.fields.payee
        distinguishing_aspect: |
          On a different resource entity (RecurringBill, not BudgetPeriod) with different interval semantics:
          a new SCHEDULED bill for payee "Rent" on day_of_month 16 collides with an existing SCHEDULED "Rent"
          bill on day_of_month 15 because 16 falls within the +/-2-day recurring due-day buffer — adjacency-
          buffer overlap, unlike BudgetPeriod's exact single-point month occupancy. Rejected with
          ERR_BILL_SLOT_CONFLICT.
        test_recipe:
          setup:
            - "Household OPEN period; category Bills; one SCHEDULED bill payee Rent day_of_month 15"
          setup_api_calls:
            - call: "POST /households"
              payload: { name: "H16", owner_email: "o16@x.com", owner_display_name: "Owner16" }
              as: PlatformAdmin
              captures: { hh_id: $.data.id, owner_id: $.data.owner_member_id }
            - call: "POST /households/${hh_id}/budget-periods"
              payload: { month: "2026-01", income_expected_cents: 0 }
              as: HouseholdOwner
              as_user_id: "${owner_id}"
              captures: { period_id: $.data.id }
            - call: "POST /households/${hh_id}/budget-periods/${period_id}/categories"
              payload: { name: "Bills", allocated_cents: 0 }
              as: HouseholdOwner
              as_user_id: "${owner_id}"
              captures: { cat_id: $.data.id }
            - call: "POST /households/${hh_id}/recurring-bills"
              payload: { payee: "Rent", amount_cents: 120000, day_of_month: 15, funding_category_id: "${cat_id}" }
              as: HouseholdOwner
              as_user_id: "${owner_id}"
          trigger:
            - call: "POST /households/${hh_id}/recurring-bills"
              payload: { payee: "Rent", amount_cents: 120000, day_of_month: 16, funding_category_id: "${cat_id}" }
              as: HouseholdOwner
              as_user_id: "${owner_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_BILL_SLOT_CONFLICT"
            - "http_status == 409"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: goal_abandon_conserves_envelope_available
        grounds:
          - state_machines.Goal.ACTIVE_to_ABANDONED
          - calculations.envelope_accounting
          - entities.BudgetCategory.fields.available_cents
        distinguishing_aspect: |
          Conserved quantity = funding BudgetCategory.available_cents. Forward action (contribute 4000)
          lowers available from 10000 to 6000; compensating action (abandon -> reverse all contributions)
          restores available to exactly 10000, leaving the envelope available unchanged across the pair.
        test_recipe:
          setup:
            - "Household OPEN period; category Save allocated 10000; goal funded by a 4000 contribution"
          setup_api_calls:
            - call: "POST /households"
              payload: { name: "H17", owner_email: "o17@x.com", owner_display_name: "Owner17" }
              as: PlatformAdmin
              captures: { hh_id: $.data.id, owner_id: $.data.owner_member_id }
            - call: "POST /households/${hh_id}/budget-periods"
              payload: { month: "2026-01", income_expected_cents: 10000 }
              as: HouseholdOwner
              as_user_id: "${owner_id}"
              captures: { period_id: $.data.id }
            - call: "POST /households/${hh_id}/budget-periods/${period_id}/categories"
              payload: { name: "Save", allocated_cents: 10000 }
              as: HouseholdOwner
              as_user_id: "${owner_id}"
              captures: { cat_id: $.data.id }
            - call: "POST /households/${hh_id}/goals"
              payload: { name: "Trip", target_cents: 20000, funding_category_id: "${cat_id}" }
              as: HouseholdOwner
              as_user_id: "${owner_id}"
              captures: { goal_id: $.data.id }
            - call: "POST /households/${hh_id}/goals/${goal_id}/contribute"
              payload: { amount_cents: 4000 }
              as: HouseholdOwner
              as_user_id: "${owner_id}"
          trigger:
            - call: "POST /households/${hh_id}/goals/${goal_id}/abandon"
              payload: {}
              as: HouseholdOwner
              as_user_id: "${owner_id}"
          assert:
            - "Goal.${goal_id}.status == ABANDONED"
            - "Goal.${goal_id}.funded_cents == 0"
            - "BudgetCategory.${cat_id}.available_cents == 10000"

      - name: txn_post_then_remove_conserves_account_cleared_balance
        grounds:
          - state_machines.Transaction.PENDING_to_POSTED
          - state_machines.Transaction.POSTED_to_REMOVED
          - calculations.net_worth_rollup
          - entities.Account.fields.cleared_balance_cents
        distinguishing_aspect: |
          Different conserved quantity = Account.cleared_balance_cents. Forward action (post -3000) drops
          cleared_balance from 10000 to 7000; compensating action (remove the same txn) restores it to
          exactly 10000, conserving the account's cleared balance across the post/remove pair.
        test_recipe:
          setup:
            - "Household; DEPOSITORY account opening 10000; one PENDING txn -3000, then posted"
          setup_api_calls:
            - call: "POST /households"
              payload: { name: "H18", owner_email: "o18@x.com", owner_display_name: "Owner18" }
              as: PlatformAdmin
              captures: { hh_id: $.data.id, owner_id: $.data.owner_member_id }
            - call: "POST /households/${hh_id}/accounts"
              payload: { institution_name: "Bank", account_type: "DEPOSITORY", opening_balance_cents: 10000 }
              as: HouseholdOwner
              as_user_id: "${owner_id}"
              captures: { acc_id: $.data.id }
            - call: "POST /accounts/${acc_id}/transactions"
              payload: { amount_cents: -3000, merchant_name: "Store" }
              as: PlatformAdmin
              captures: { txn_id: $.data.id }
            - call: "POST /accounts/${acc_id}/transactions/${txn_id}/post"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /accounts/${acc_id}/transactions/${txn_id}/remove"
              payload: {}
              as: PlatformAdmin
          assert:
            - "Account.${acc_id}.cleared_balance_cents == 10000"
            - "Transaction.${txn_id}.status == REMOVED"
