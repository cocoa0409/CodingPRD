            - "${m_b_pen} == 1040 == round_half_up(29722 * 0.035) == round_half_up(1040.27) and ${m_b_total} == 30762"
            - "the penalty is computed on each membership's own base, so a single hard-coded 1050 fails on B"

      - name: correct_result_volunteer_buyout_at_season_close_reopens_a_settled_balance
        claim_type: correct_result
        grounds:
          - calculations.volunteer_credit_balance
          - state_machines[Season].OPEN_to_CLOSED
          - state_machines[Membership, dimension=dues_status].PAID_to_INVOICED
          - entities.Membership.fields.volunteer_buyout_cents
        distinguishing_aspect: |
          The buyout is the only figure in the model that is assessed AFTER the invoice is settled,
          so it is the only way a membership at dues_status PAID with balance_due_cents 0 can acquire
          a fresh balance. Two things must both hold: the shortfall is measured against
          volunteer_credits_required, which is itself derived from the count of CONFIRMED or
          COMPLETED registrations rather than from the category constant alone, and the re-opening
          must NOT re-derive invoice_total_cents or amount_paid_cents.
        test_recipe:
          setup:
            - "One COUPLE category, volunteer_credits_required 2 per swimmer, seasonal dues 30000, bond 0, initiation 0."
            - "One household joining on the open_date with one swimmer, so the invoice is 30000 + 14500 = 44500 base plus the late penalty."
            - "The swimmer is registered BEFORE the invoice (so line 4 picks it up while PENDING) and CONFIRMED after it (so volunteer_credits_required becomes 2)."
            - "No volunteer assignment is ever created, so volunteer_credits_earned stays 0 and the shortfall is the full requirement."
          setup_api_calls:
            - call: "POST /swim-club/_clock/set_current_utc"
              payload: { to_iso8601: "2027-05-22T09:00:00Z" }
              as: SystemOperator
            - call: "POST /swim-club/membership-categories"
              payload: { code: "COUPLE", label: "Couple", bond_cents: 0, initiation_fee_cents: 0, seasonal_dues_cents: 30000, guest_pass_allotment: 2, max_household_size: 4, volunteer_credits_required: 2, waitlist_required: false, proration_allowed: true, party_privileges: true }
              as: MembershipChair
              captures: { cat_id: $.data.id }
            - call: "POST /swim-club/seasons"
              payload: { year: 2027, open_date: "2027-05-22", close_date: "2027-09-06", dues_due_date: "2027-04-15", baseline_bather_load: 0, bather_load_capacity: 120 }
              as: BoardPresident
              captures: { s27_id: $.data.id }
            - call: "POST /swim-club/seasons/${s27_id}/open"
              payload: {}
              as: PoolManager
            - call: "POST /swim-club/households"
              payload: { primary_contact_name: "Buyout Household", address_line: "131 Cedar Court", residency: "IN_DISTRICT", member_count: 2, prior_member: false }
              as: MembershipChair
              captures: { h_id: $.data.id }
            - call: "POST /swim-club/memberships"
              payload: { household_id: "${h_id}", membership_category_id: "${cat_id}", season_id: "${s27_id}", join_date: "2027-05-22", bond_payment_plan: "FULL" }
              as: MembershipChair
              captures: { m_id: $.data.id, m_req_0: $.data.volunteer_credits_required }
            - call: "POST /swim-club/swim-team-registrations"
              payload: { membership_id: "${m_id}", season_id: "${s27_id}", swimmer_name: "Tess Alard", swimmer_birthdate: "2013-04-04", squad: "JUNIOR" }
              as: SwimTeamCoach
              captures: { r_id: $.data.id, r_seq: $.data.squad_seq, r_fee: $.data.assessed_fee_cents }
            - call: "POST /swim-club/memberships/${m_id}/invoice"
              payload: {}
              as: Treasurer
              captures: { m_l1: $.data.assessed_dues_cents, m_l4: $.data.swim_team_fee_cents, m_pen: $.data.late_penalty_cents, m_total: $.data.invoice_total_cents, m_bal_1: $.data.balance_due_cents, m_req_1: $.data.volunteer_credits_required }
            - call: "POST /swim-club/swim-team-registrations/${r_id}/transitions"
              payload: { to_status: "CONFIRMED" }
              as: SwimTeamCoach
              captures: { r_status_1: $.data.status }
            - call: "GET /swim-club/memberships/${m_id}"
              payload: {}
              as: Treasurer
              captures: { m_req_2: $.data.volunteer_credits_required, m_earned_2: $.data.volunteer_credits_earned, m_buyout_2: $.data.volunteer_buyout_cents }
            - call: "POST /swim-club/memberships/${m_id}/payments"
              payload: { amount_cents: 46058, allocation: "DUES" }
              as: Treasurer
              captures: { m_dues_3: $.data.dues_status, m_paid_3: $.data.amount_paid_cents, m_bal_3: $.data.balance_due_cents }
          trigger:
            - call: "POST /swim-club/_clock/set_current_utc"
              payload: { to_iso8601: "2027-09-06T20:00:00Z" }
              as: SystemOperator
            - call: "POST /swim-club/seasons/${s27_id}/close"
              payload: {}
              as: PoolManager
              captures: { s_status: $.data.status, s_posture: $.data.facility_posture }
            - call: "GET /swim-club/memberships/${m_id}"
              payload: {}
              as: Treasurer
              captures: { m_dues_4: $.data.dues_status, m_access_4: $.data.access_status, m_req_4: $.data.volunteer_credits_required, m_earned_4: $.data.volunteer_credits_earned, m_buyout_4: $.data.volunteer_buyout_cents, m_total_4: $.data.invoice_total_cents, m_paid_4: $.data.amount_paid_cents, m_bal_4: $.data.balance_due_cents, m_l1_4: $.data.assessed_dues_cents }
            - call: "GET /swim-club/swim-team-registrations/${r_id}"
              payload: {}
              as: SwimTeamCoach
              captures: { r_status_4: $.data.status }
          assert:
            - "${r_seq} == 1 and ${r_fee} == 14500 == round_half_up(14500 * (1 - min(0.0625 * 0, 0.25)))"
            - "${m_req_0} == 0 at creation and ${m_req_1} == 0 at invoicing time, because the registration is still PENDING and only CONFIRMED or COMPLETED registrations count"
            - "${m_l1} == 30000, ${m_l4} == 14500, so the invoice base is 44500"
            - "${m_pen} == 1558 == round_half_up(44500 * 0.035) == round_half_up(1557.5): the half-cent rounds UP, so 1557 is wrong"
            - "${m_total} == 46058 and ${m_bal_1} == 46058"
            - "${r_status_1} == CONFIRMED and ${m_req_2} == 2 == min(10, 2 * 1): confirming the swimmer raises the requirement AFTER the invoice was cut"
            - "${m_earned_2} == 0 and ${m_buyout_2} == 0: the buyout is not assessed at confirmation time"
            - "${m_dues_3} == PAID with ${m_paid_3} == 46058 and ${m_bal_3} == 0: the membership is fully settled before the season closes"
            - "the close is HTTP 200 with ${s_status} == CLOSED and ${s_posture} == CLOSED"
            - "${r_status_4} == COMPLETED and ${m_access_4} == LAPSED: the close cascade advanced both, and ${m_req_4} == 2 still, since COMPLETED counts exactly like CONFIRMED"
            - "${m_earned_4} == 0 and ${m_buyout_4} == 7000 == max(0, 2 - 0) * 3500"
            - "${m_bal_4} == 7000 == max(0, 46058 + 7000 - 46058): the buyout is added on top of the settled invoice, not folded into it"
            - "${m_total_4} == 46058, ${m_paid_4} == 46058 and ${m_l1_4} == 30000: closing re-derives NOTHING except the buyout and the balance"
            - "${m_dues_4} == INVOICED: the PAID -> INVOICED re-opening edge fired because the recomputed balance is strictly positive"

      - name: input_set_filtering_only_open_major_findings_move_the_posture
        claim_type: input_set_filtering
        grounds:
          - calculations.facility_posture_derivation
          - entities.Season.fields.open_major_finding_count
          - state_machines[InspectionFinding]
          - endpoints[POST /swim-club/inspection-findings]
        distinguishing_aspect: |
          Three separate filters have to be applied together and each one is independently
          falsifiable: MINOR findings are excluded by severity no matter how many there are,
          REMEDIATION_SUBMITTED findings are still INCLUDED because submitting a fix is not the same
          as having it verified, and VERIFIED_CLOSED findings are excluded by status. An
          implementation that counted all non-VERIFIED_CLOSED findings would restrict on the MINORs;
          one that counted only OPEN findings would release the restriction at
          REMEDIATION_SUBMITTED.
        test_recipe:
          setup:
            - "One OPEN 2027 season with no findings, so facility_posture starts at OPEN."
            - "Findings are recorded by hi-001 and verified by hi-002, satisfying the two-person control at priority 5."
            - "MAJOR_FINDING_RESTRICT_THRESHOLD is 2, so a single MAJOR must NOT restrict."
          setup_api_calls:
            - call: "POST /swim-club/_clock/set_current_utc"
              payload: { to_iso8601: "2027-06-10T09:00:00Z" }
              as: SystemOperator
            - call: "POST /swim-club/seasons"
              payload: { year: 2027, open_date: "2027-05-22", close_date: "2027-09-06", dues_due_date: "2027-04-15", baseline_bather_load: 0, bather_load_capacity: 120 }
              as: BoardPresident
              captures: { s27_id: $.data.id }
            - call: "POST /swim-club/seasons/${s27_id}/open"
              payload: {}
              as: PoolManager
              captures: { p_open: $.data.facility_posture, maj_0: $.data.open_major_finding_count, crit_0: $.data.open_critical_finding_count }
          trigger:
            - call: "POST /swim-club/inspection-findings"
              payload: { season_id: "${s27_id}", inspected_on: "2027-06-10", inspector_name: "K. Adeyemi", finding_code: "SIGNAGE-01", severity: "MINOR", narrative: "Depth marker paint faded at the 3-foot mark." }
              as: HealthInspector
              as_user_id: hi-001
              captures: { f_min1_id: $.data.id }
            - call: "POST /swim-club/inspection-findings"
              payload: { season_id: "${s27_id}", inspected_on: "2027-06-10", inspector_name: "K. Adeyemi", finding_code: "SIGNAGE-02", severity: "MINOR", narrative: "Rescue-tube storage clip missing from the north stand." }
              as: HealthInspector
              as_user_id: hi-001
              captures: { f_min2_id: $.data.id }
            - call: "POST /swim-club/inspection-findings"
              payload: { season_id: "${s27_id}", inspected_on: "2027-06-10", inspector_name: "K. Adeyemi", finding_code: "SIGNAGE-03", severity: "MINOR", narrative: "Bather-load placard illegible at the gate." }
              as: HealthInspector
              as_user_id: hi-001
              captures: { f_min3_id: $.data.id }
            - call: "GET /swim-club/seasons/${s27_id}"
              payload: {}
              as: PoolManager
              captures: { p_after_minors: $.data.facility_posture, maj_1: $.data.open_major_finding_count }
            - call: "POST /swim-club/inspection-findings"
              payload: { season_id: "${s27_id}", inspected_on: "2027-06-11", inspector_name: "K. Adeyemi", finding_code: "CHEM-04", severity: "MAJOR", narrative: "Free chlorine below the required minimum on two consecutive readings." }
              as: HealthInspector
              as_user_id: hi-001
              captures: { f_maj1_id: $.data.id, p_after_maj1: $.data.status }
            - call: "GET /swim-club/seasons/${s27_id}"
              payload: {}
              as: PoolManager
              captures: { p_one_major: $.data.facility_posture, maj_2: $.data.open_major_finding_count }
            - call: "POST /swim-club/inspection-findings"
              payload: { season_id: "${s27_id}", inspected_on: "2027-06-11", inspector_name: "K. Adeyemi", finding_code: "FENCE-07", severity: "MAJOR", narrative: "Self-latching gate fails to latch from the pull side." }
              as: HealthInspector
              as_user_id: hi-001
              captures: { f_maj2_id: $.data.id }
            - call: "GET /swim-club/seasons/${s27_id}"
              payload: {}
              as: PoolManager
              captures: { p_two_majors: $.data.facility_posture, maj_3: $.data.open_major_finding_count, closure_3: $.data.closure_started_at }
            - call: "POST /swim-club/inspection-findings/${f_maj1_id}/transitions"
              payload: { to_status: "REMEDIATION_SUBMITTED", remediation_note: "Chlorinator feed rate corrected; two clear readings logged." }
              as: PoolManager
              as_user_id: pm-001
              captures: { f_maj1_status_1: $.data.status }
            - call: "GET /swim-club/seasons/${s27_id}"
              payload: {}
              as: PoolManager
              captures: { p_after_submit: $.data.facility_posture, maj_4: $.data.open_major_finding_count }
            - call: "POST /swim-club/inspection-findings/${f_maj1_id}/transitions"
              payload: { to_status: "VERIFIED_CLOSED" }
              as: HealthInspector
              as_user_id: hi-002
              captures: { f_maj1_status_2: $.data.status }
            - call: "GET /swim-club/seasons/${s27_id}"
              payload: {}
              as: PoolManager
              captures: { p_after_close: $.data.facility_posture, maj_5: $.data.open_major_finding_count }
          assert:
            - "${p_open} == OPEN with ${maj_0} == 0 and ${crit_0} == 0 on a fresh season"
            - "${p_after_minors} == OPEN and ${maj_1} == 0: three MINOR findings are filtered out by severity and change nothing"
            - "${p_after_maj1} == OPEN as the finding's own initial status, and ${p_one_major} == OPEN with ${maj_2} == 1: one MAJOR is below the threshold of 2"
            - "${p_two_majors} == RESTRICTED with ${maj_3} == 2: the threshold comparison is >= and fires exactly at 2"
            - "${closure_3} == null: RESTRICTED is not CLOSED, so no closure instant is stamped and no cascade runs"
            - "${f_maj1_status_1} == REMEDIATION_SUBMITTED and ${p_after_submit} == RESTRICTED with ${maj_4} == 2: a submitted remediation is still an OPEN-side status and keeps counting"
            - "${f_maj1_status_2} == VERIFIED_CLOSED and ${p_after_close} == OPEN with ${maj_5} == 1: only verification removes a finding from the input set"
            - "the three MINOR findings are still status OPEN at the end, proving they were excluded by severity and not by having been closed"

      - name: constants_applied_weekend_and_weekday_guest_fees_use_distinct_rates
        claim_type: constants_applied
        grounds:
          - calculations.guest_visit_settlement
          - entities.GuestVisit.fields.is_weekend
          - entities.GuestVisit.fields.fee_charged_cents
          - endpoints[POST /swim-club/guest-visits]
        distinguishing_aspect: |
          Both constants are exercised on identical guest counts with the pass path deliberately
          switched off - the category grants 0 passes, so guest_pass_balance is 0 and passes_used is
          0 under PASS_FIRST on both days. That isolates the unit fee: the ONLY difference between
          the two visits is the day of week of visit_start_iso. A single hard-coded rate, or a
          weekend test that keys off the recording clock instead of the visit instant, produces the
          same number twice. Two households are used because DELINQUENCY_TOLERANCE_CENTS is 0, so
          the first fee would otherwise lock its own household out of a second visit.
        test_recipe:
          setup:
            - "One SINGLE category with guest_pass_allotment 0, bond 0 and initiation 0."
            - "One OPEN 2027 season with guest_settlement_policy PASS_FIRST."
            - "Two households A and B, each with an invoiced ACTIVE membership and guest_pass_balance 0."
            - "The clock sits at 2027-07-11T09:00Z, so both visit instants are in the past as priority 61 requires."
          setup_api_calls:
            - call: "POST /swim-club/_clock/set_current_utc"
              payload: { to_iso8601: "2027-07-11T09:00:00Z" }
              as: SystemOperator
            - call: "POST /swim-club/membership-categories"
              payload: { code: "SINGLE", label: "Single", bond_cents: 0, initiation_fee_cents: 0, seasonal_dues_cents: 20000, guest_pass_allotment: 0, max_household_size: 2, volunteer_credits_required: 0, waitlist_required: false, proration_allowed: true, party_privileges: false }
              as: MembershipChair
              captures: { cat_id: $.data.id, cat_passes: $.data.guest_pass_allotment }
            - call: "POST /swim-club/seasons"
              payload: { year: 2027, open_date: "2027-05-22", close_date: "2027-09-06", dues_due_date: "2027-04-15", baseline_bather_load: 0, bather_load_capacity: 120, guest_settlement_policy: "PASS_FIRST" }
              as: BoardPresident
              captures: { s27_id: $.data.id, s27_policy: $.data.guest_settlement_policy }
            - call: "POST /swim-club/seasons/${s27_id}/open"
              payload: {}
              as: PoolManager
            - call: "POST /swim-club/households"
              payload: { primary_contact_name: "Weekend Guest Household", address_line: "141 Cedar Court", residency: "IN_DISTRICT", member_count: 1, prior_member: false }
              as: MembershipChair
              captures: { h_a_id: $.data.id }
            - call: "POST /swim-club/households"
              payload: { primary_contact_name: "Weekday Guest Household", address_line: "142 Cedar Court", residency: "IN_DISTRICT", member_count: 1, prior_member: false }
              as: MembershipChair
              captures: { h_b_id: $.data.id }
            - call: "POST /swim-club/memberships"
              payload: { household_id: "${h_a_id}", membership_category_id: "${cat_id}", season_id: "${s27_id}", join_date: "2027-07-01", bond_payment_plan: "FULL" }
              as: MembershipChair
              captures: { m_a_id: $.data.id }
            - call: "POST /swim-club/memberships"
              payload: { household_id: "${h_b_id}", membership_category_id: "${cat_id}", season_id: "${s27_id}", join_date: "2027-07-01", bond_payment_plan: "FULL" }
              as: MembershipChair
              captures: { m_b_id: $.data.id }
            - call: "POST /swim-club/memberships/${m_a_id}/invoice"
              payload: {}
              as: Treasurer
            - call: "POST /swim-club/memberships/${m_b_id}/invoice"
              payload: {}
              as: Treasurer
            - call: "GET /swim-club/households/${h_a_id}"
              payload: {}
              as: PoolManager
              captures: { h_a_v0: $.data.version, h_a_granted: $.data.guest_pass_allotment_granted, h_a_bal_0: $.data.guest_pass_balance }
            - call: "GET /swim-club/households/${h_b_id}"
              payload: {}
              as: PoolManager
              captures: { h_b_v0: $.data.version }
          trigger:
