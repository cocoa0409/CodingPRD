            - "GET /fee-ledger-entries?assignment_id=${a1} now returns exactly 3 rows: SCRIPT_FEE_ACCRUAL +3500000, GUARANTEE_OFFSET -1750000, FEE_REVERSAL -1750000, summing to exactly 0"
            - "No pre-existing FeeLedgerEntry row was mutated or deleted: the two setup rows are byte-identical, and FeeLedgerEntry carries no version field (common_fields false)"
            - "Season.${se}.script_fee_committed_cents == 0, byte-identical to its value before the assignment was created"
            - "RoomSeat.${s1}.guarantee_slots_consumed == 0 and guarantee_slots_remaining == 1 (back to episodic_guarantee_count)"
            - "Episode.${ep1}.script_readiness == NOT_STARTED (the voided assignment was the episode's last non-terminal one)"
            - "Milestone.${m1}.status == PENDING and its due_date is unchanged at 2026-09-21T23:59:59.999Z"
            - "POST /milestones/${m1}/deliver now returns 409 ERR_MILESTONE_NOT_DELIVERABLE"
            - "A second POST /script-assignments/${a1}/void returns 409 ERR_ASSIGNMENT_ALREADY_TERMINAL and appends no further ledger entry"
            - "Season.${se}.ready_script_count == 0 and coverage_gap == 1"

      - name: withdrawing_a_seat_offer_restores_room_capacity_and_season_burn_exactly
        grounds:
          - calculations.seat_capacity_conservation
          - calculations.seat_capacity_conservation.formula
          - calculations.room_weekly_burn
          - calculations.season_staffing_commitment
          - entities.WritersRoom.fields.filled_seat_count
          - entities.WritersRoom.fields.open_seat_count
          - entities.WritersRoom.fields.confirmed_seat_count
          - state_machines.RoomSeat.transitions.OFFERED_to_WITHDRAWN
          - endpoints.POST_/room-seats/{seat_id}/withdraw
        distinguishing_aspect: |
          The conserved quantity here is a COUNT of a physical resource rather than money:
          seat_capacity == filled_seat_count + open_seat_count must hold at every one of four
          observation points, and the WITHDRAWN seat row must survive (it is history, not a deletion)
          while contributing to neither counter. The instance also pins the burn arithmetic around the
          compensation: an OFFERED seat never enters seat_subtotal_weekly_cents, so the burn stays at the
          bare 200000 facility surcharge through offer and withdraw, and the freed capacity is genuinely
          reusable - the identical offer succeeds again afterwards.
        test_recipe:
          setup:
            - "Agreement AG (facility TIER_1 200000, IN_PERSON surcharge 1.0); season SE with staffing_budget_weekly_cents 5000000."
            - "Room RM (IN_PERSON, seat_capacity 3) moved to STAFFING, so filled_seat_count 0 / open_seat_count 3 / weekly_burn_cents 200000 and Season.staffing_commitment_weekly_cents 200000."
            - "W1 (STORY_EDITOR) holds an OPEN availability window covering 2026-09-01..2027-03-01."
            - "Seat S1 is offered to W1 at 600000 and left in OFFERED."
          setup_api_calls:
            - call: "POST /guild-agreements"
              payload: *AGP
              as: GuildAdministrator
              captures: { ag: "$.data.id" }
            - call: "POST /writers"
              payload: { legal_name: "Sloane Reyes", guild_member_id: "GM-SHOW", agreement_id: "${ag}", career_episodic_credits: 20, is_showrunner_eligible: true }
              as: GuildAdministrator
              captures: { sr: "$.data.id" }
            - call: "POST /writers"
              payload: { legal_name: "Wanda Cole", guild_member_id: "GM-1001", agreement_id: "${ag}", career_episodic_credits: 3 }
              as: GuildAdministrator
              captures: { w1: "$.data.id" }
            - call: "POST /seasons"
              payload: { guild_agreement_id: "${ag}", showrunner_writer_id: "${sr}", title: "Nightfall S1", episode_order: 8, length_format: "ONE_HOUR", production_start_date: "2026-11-02T00:00:00Z", staffing_window_start: "2026-08-01T00:00:00Z", staffing_window_end: "2026-09-30T00:00:00Z", ready_script_target: 1, guarantee_application_mode: "FORWARD_COMMIT", staffing_budget_weekly_cents: 5000000, script_fee_budget_cents: 60000000 }
              as: StudioExecutive
              captures: { se: "$.data.id" }
            - call: "POST /writers/${w1}/availability-windows"
              payload: { start_date: "2026-08-15T00:00:00Z", end_date: "2027-06-01T00:00:00Z", commitment_type: "EXCLUSIVE" }
              as: Writer
              as_user_id: "${w1}"
              captures: { aw1: "$.data.id" }
            - call: "POST /seasons/${se}/rooms"
              payload: { name: "Main Room", format: "IN_PERSON", seat_capacity: 3, duration_weeks_committed: 26, start_date: "2026-09-01T00:00:00Z", end_date: "2027-03-01T00:00:00Z", diversity_seats_required: 0 }
              as: Showrunner
              as_user_id: "${sr}"
              captures: { rm: "$.data.id" }
            - call: "POST /rooms/${rm}/open-staffing"
              payload: {}
              as: Showrunner
              as_user_id: "${sr}"
              captures: { rv1: "$.data.version" }
            - call: "POST /rooms/${rm}/seats"
              payload: { writer_id: "${w1}", level_at_hire: "STORY_EDITOR", offered_weekly_compensation_cents: 600000, exclusivity: "EXCLUSIVE", start_date: "2026-09-01T00:00:00Z", end_date: "2027-03-01T00:00:00Z", episodic_guarantee_count: 0, diversity_program_funded: false, expected_room_version: "${rv1}" }
              as: Showrunner
              as_user_id: "${sr}"
              captures: { s1: "$.data.id" }
          trigger:
            - call: "POST /room-seats/${s1}/withdraw"
              payload: { reason: "Offer superseded by a competing bid." }
              as: Showrunner
              as_user_id: "${sr}"
            - call: "GET /rooms/${rm}"
              payload: {}
              as: Showrunner
              as_user_id: "${sr}"
              captures: { rv2: "$.data.version" }
            - call: "POST /rooms/${rm}/seats"
              payload: { writer_id: "${w1}", level_at_hire: "STORY_EDITOR", offered_weekly_compensation_cents: 600000, exclusivity: "EXCLUSIVE", start_date: "2026-09-01T00:00:00Z", end_date: "2027-03-01T00:00:00Z", episodic_guarantee_count: 0, diversity_program_funded: false, expected_room_version: "${rv2}" }
              as: Showrunner
              as_user_id: "${sr}"
              captures: { s2: "$.data.id" }
          assert:
            - "Observation 1 (after open-staffing): WritersRoom.${rm}.filled_seat_count == 0, open_seat_count == 3, confirmed_seat_count == 0, seat_subtotal_weekly_cents == 0, weekly_burn_cents == 200000, Season.${se}.staffing_commitment_weekly_cents == 200000"
            - "Observation 2 (after the offer, before the trigger): filled_seat_count == 1, open_seat_count == 2, confirmed_seat_count == 0, seat_subtotal_weekly_cents == 0, weekly_burn_cents == 200000"
            - "Observation 3 (after trigger call 1): RoomSeat.${s1}.status == WITHDRAWN, filled_seat_count == 0, open_seat_count == 3, weekly_burn_cents == 200000, Season.${se}.staffing_commitment_weekly_cents == 200000 - byte-identical to observation 1"
            - "The withdrawn row still exists: GET /room-seats?room_id=${rm}&status=WITHDRAWN returns exactly 1 row and GET /room-seats/${s1} returns 200"
            - "AvailabilityWindow.${aw1}.status == OPEN throughout (it was never consumed, because the offer was never accepted)"
            - "Writer.${w1}.active_seat_count == 0 at observation 3"
            - "Observation 4 (after trigger call 3, the identical offer replayed): RoomSeat.${s2}.status == OFFERED, filled_seat_count == 1, open_seat_count == 2, and seat_capacity == filled_seat_count + open_seat_count == 3 at every one of the four observations"
            - "A second POST /room-seats/${s1}/withdraw returns 409 ERR_SEAT_NOT_OFFERED"
