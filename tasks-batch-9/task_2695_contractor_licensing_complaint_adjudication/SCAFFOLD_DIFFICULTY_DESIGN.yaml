            - "License.${lc_ov_id}.compliance_posture == COMPLIANT"

      - name: qualifier_designation_windows_are_closed_so_the_end_date_is_still_occupied
        grounds:
          - validations[priority=52]
          - errors[ERR_QUALIFIER_CAPACITY_EXCEEDED]
          - entities.QualifierAssignment.fields.effective_to
          - entities.QualifyingIndividual.fields.active_qualification_count
          - endpoints[POST /licensing/qualifier-assignments]
        distinguishing_aspect: |
          A different resource (one person's concurrent-designation capacity) with the OPPOSITE interval
          semantics: [effective_from, effective_to] is CLOSED, so two designations ending 2026-12-31 still
          occupy 2026-12-31 and a third designation effective that day is refused, while 2027-01-01 is free.
          The successful row also proves active_qualification_count counts ACTIVE rows (3) rather than rows
          occupying any single date (2).
        test_recipe:
          setup:
            - "clock at 2026-08-01 and three C-10 licences A, B and C, each minted through its own qualifier so no cascade designation belongs to the person under test"
            - "the shared qualifier SHARED-Q is then designated RESPONSIBLE_MANAGING_EMPLOYEE on A and on B, each window running [2026-08-01, 2026-12-31] and superseding that licence's cascade designation"
            - "each designation presents the licence version captured immediately beforehand"
          setup_api_calls:
