            - call: "POST /productions/${prod_id}/policies/${gl_id}/bind"
              payload: { expected_production_version: "${prod_v}" }
              as: BrokerAgent
            - call: "GET /productions/${prod_id}"
              payload: {}
              as: BrokerAgent
              captures: { prod_v2: $.data.version }
            - call: "POST /productions/${prod_id}/policies/${ft_id}/bind"
              payload: { expected_production_version: "${prod_v2}" }
              as: BrokerAgent
            - call: "POST /productions/${prod_id}/activate"
              payload: {}
              as: BrokerAgent
            - call: "POST /productions/${prod_id}/foreign-travel-extensions"
              payload:
                territory_code: "FR"
                travel_window_start: "2026-07-01T00:00:00Z"
                travel_window_end: "2026-07-15T00:00:00Z"
                travelers_count: 5
