            - "Segment.${seg_id}.status == APPROVED with rejection_count 1, so the backwards REJECT hop still consumed a version"
            - "GET /cdp/segments/${seg_id} reports version 5 — the read does not advance the counter"
            - "a repeated APPROVE returns 409 ERR_INVALID_STATE and leaves version at 5 — refused writes never increment"

      - name: source_quarantines_when_dq_pass_rate_breaches_floor_at_min_sample
        claim_type: rate_threshold_triggers
