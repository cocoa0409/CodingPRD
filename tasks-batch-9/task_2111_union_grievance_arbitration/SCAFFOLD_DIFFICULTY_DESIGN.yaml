  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: settlement_exposure_tier_nested_min_max_branch
        grounds:
          - calculations.settlement_exposure_authority_tier
          - entities.SettlementOffer.fields.exposure_cents
          - entities.SettlementOffer.fields.authority_tier
          - entities.ContractClause.fields.monetary_cap_cents
        distinguishing_aspect: |
          Mode (a) instance: exposure combines four inputs (monetary, back-pay hours at
          the grievant's rate, an enum-keyed term loading whose REINSTATEMENT arm is
          itself a max(), and a precedent-setting multiplier) and is then clamped by a
          nested min() against the clause cap BEFORE tier selection, so 650000 becomes
          500000 and lands in NEGOTIATOR rather than the uncapped tier.
        test_recipe:
          setup:
            - "Local 2100 agreement with director ceiling 250000 and negotiator ceiling 1500000."
            - "Clause ART-19 (SAFETY, expedited, monetary cap 500000)."
            - "Grievant EMP-1 at 3500 cents/hour, steward STW-1."
            - "One grievance filed on the expedited clause on 2026-08-01 with discovery 2026-07-25 (7 elapsed days against the halved 15-day window)."
            - "Two DRAFT employer offers on that grievance: offer A is monetary 300000 plus 20 back-pay hours plus POLICY_CHANGE terms and is precedent-setting; offer B is a bare REINSTATEMENT with no money."
          setup_api_calls:
            - call: "POST /labor-relations/bargaining-units"
              payload: { name: "Municipal Services Local 2100", local_number: "L2100", contract_effective_date: "2025-01-01T00:00:00Z", contract_expiry_date: "2027-12-31T00:00:00Z" }
              as: LaborRelationsDirector
              as_user_id: "lr-dir-01"
              captures: { bu_id: $.data.id }
