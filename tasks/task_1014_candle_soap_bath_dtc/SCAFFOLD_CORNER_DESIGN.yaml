        test_recipe:
          setup: ["Customer c1 owns an order with one line; a second customer c2 exists."]
          setup_api_calls:
            - { call: "POST /products", payload: { product_type: "SOAP", collection_name: "Ow", scent_family: "CITRUS", title: "Ow" }, as: MerchOps, captures: { p1: "$.data.id" } }
