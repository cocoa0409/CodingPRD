              captures: { first_asset: "$.data[0].id" }
          assert:
            - "HTTP 403 with ${err_asset} == ERR_UNAUTHORIZED — asset registration belongs to PlatformAdmin alone"
            - "HTTP 403 with ${err_clock} == ERR_UNAUTHORIZED — only PlatformAdmin may move the logical clock"
            - "HTTP 403 with ${err_plan} == ERR_UNAUTHORIZED and ${err_scope} == ERR_UNAUTHORIZED — planning writes belong to ProgramManager"
            - "HTTP 403 with ${err_rem} == ERR_UNAUTHORIZED — a RemediationOwner cannot assign work to itself"
            - "HTTP 403 with ${err_finding} == ERR_UNAUTHORIZED — filing findings is the Tester's exclusive operation, and the refusal beats the unresolvable engagement_id in the body"
            - "HTTP 403 with ${err_verify} == ERR_UNAUTHORIZED — verification is limited to Tester and ComplianceOfficer"
            - "${plan_state} == DRAFT and ${plan_ver} == 1 — none of the refused writes changed anything"
            - "the asset list still holds exactly one row with total_count == 1 and ${first_asset} == the asset created in setup"

      - name: header_and_role_checks_run_before_any_path_id_is_resolved
        claim_type: unauthorized_denial
        grounds:
          - errors[ERR_MISSING_AUTH_HEADERS]
          - errors[ERR_INVALID_ROLE]
          - errors[ERR_UNAUTHORIZED]
          - errors[ERR_TEST_PLAN_NOT_FOUND]
          - errors[ERR_REMEDIATION_NOT_FOUND]
          - validations.priority_1
          - validations.priority_2
          - validations.priority_3
          - validations.priority_4
        distinguishing_aspect: "The same unresolvable id produces three different answers depending only on the headers: 401 for a blank X-User-ID, 401 for a role outside the declared five, 403 for a valid but unauthorized role, and only for the correctly authorized role does the 404 finally surface — pinning the priority 1 to 2 to 3 to 4 ladder."
        test_recipe:
          setup:
            - "No domain data is required; every call targets ids that do not exist."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /pentest/test-plans/00000000-0000-0000-0000-0000000000aa/activate"
              payload: {}
              as: ProgramManager
              as_user_id: ""
              captures: { err_blank_id: $.data.error_id }
            - call: "POST /pentest/test-plans/00000000-0000-0000-0000-0000000000aa/activate"
              payload: {}
              as: SecurityLead
              as_user_id: "sl-1"
              captures: { err_bad_role: $.data.error_id }
            - call: "POST /pentest/test-plans/00000000-0000-0000-0000-0000000000aa/activate"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { err_forbidden: $.data.error_id }
            - call: "POST /pentest/test-plans/00000000-0000-0000-0000-0000000000aa/activate"
              payload: {}
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { err_missing_plan: $.data.error_id }
            - call: "POST /pentest/remediations/00000000-0000-0000-0000-0000000000bb/submit"
              payload: { evidence_uri: "s3://evidence/ghost" }
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { err_submit_role: $.data.error_id }
            - call: "POST /pentest/remediations/00000000-0000-0000-0000-0000000000bb/submit"
              payload: { evidence_uri: "s3://evidence/ghost" }
              as: RemediationOwner
              as_user_id: "owner-1"
              captures: { err_submit_404: $.data.error_id }
            - call: "GET /pentest/test-plans"
              payload: { limit: 10, offset: 0 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { probe: "$.data[0].id" }
          assert:
            - "HTTP 401 with ${err_blank_id} == ERR_MISSING_AUTH_HEADERS for the blank X-User-ID"
            - "HTTP 401 with ${err_bad_role} == ERR_INVALID_ROLE for a role name outside the five declared roles"
            - "HTTP 403 with ${err_forbidden} == ERR_UNAUTHORIZED — the officer is refused on role, not told the plan is missing"
            - "HTTP 404 with ${err_missing_plan} == ERR_TEST_PLAN_NOT_FOUND only once the role is the authorized one"
            - "HTTP 403 with ${err_submit_role} == ERR_UNAUTHORIZED then HTTP 404 with ${err_submit_404} == ERR_REMEDIATION_NOT_FOUND on the identical path — the ladder repeats on a second endpoint"
            - "the plan list is empty with total_count == 0 and ${probe} resolves to nothing, so no refused call created state"

      - name: operations_declared_shared_accept_both_owners_and_no_third_role
