              as: PlatformAdmin
            - call: "POST /auction-events/${event_id}/open"
              payload: {}
              as: AuctionOps
            - call: "POST /auction-lots/${lot_id}/bids"
              payload: { bidder_id: "${first_id}", amount_cents: 20000000 }
              as: Bidder
              as_user_id: "${first_id}"
              captures: { bid_1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T17:20:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /auction-lots/${lot_id}/bids"
              payload: { bidder_id: "${second_id}", amount_cents: 20500000 }
              as: Bidder
              as_user_id: "${second_id}"
              captures: { bid_2: $.data.id, bid_2_status: $.data.bid_status, bid_2_above: $.data.is_above_reserve, bid_2_ext: $.data.triggered_extension, bid_2_at: $.data.placed_at }
            - call: "GET /bids/${bid_1}"
              payload: {}
              as: AuctionOps
              captures: { bid_1_status: $.data.bid_status }
            - call: "GET /auction-lots/${lot_id}"
              payload: {}
              as: AuctionOps
              captures: { high: $.data.current_high_bid_cents, lot_state: $.data.lot_status, ext_count: $.data.extension_count, close_at: $.data.bid_close_at }
            - call: "GET /bidders/${first_id}"
              payload: {}
              as: AuctionOps
              captures: { first_avail: $.data.deposit_available_cents, first_funded: $.data.deposit_funded_cents }
            - call: "GET /bidders/${second_id}"
              payload: {}
              as: AuctionOps
              captures: { second_avail: $.data.deposit_available_cents }
            - call: "GET /deposit-holds?auction_lot_id=${lot_id}&status=RELEASED"
              payload: {}
              as: AuctionOps
              captures: { released_reason: "$.data[0].released_reason", released_owner: "$.data[0].bidder_id" }
            - call: "GET /deposit-holds?auction_lot_id=${lot_id}&status=HELD"
              payload: {}
              as: AuctionOps
              captures: { held_amount: "$.data[0].amount_cents", held_owner: "$.data[0].bidder_id" }
          assert:
            - "${bid_2_status} == WINNING, ${bid_2_above} == true, ${bid_2_ext} == false and ${bid_2_at} == 2026-09-15T17:20:00Z"
            - "${bid_1_status} == OUTBID in the very next read — the demotion is not deferred"
            - "${high} == 20500000, ${lot_state} == OPEN, ${ext_count} == 0 and ${close_at} == 2026-09-15T18:00:00Z (17:20 is 40 minutes out, far outside the 60-second extension trigger)"
            - "${first_avail} == 1000000 with ${first_funded} == 1000000 (the released hold is available again at once)"
            - "${second_avail} == 0 (the new hold is deducted at once)"
            - "The RELEASED list has total_count == 1 with ${released_reason} == OUTBID and ${released_owner} == ${first_id}"
            - "The HELD list has total_count == 1 with ${held_amount} == 1000000 and ${held_owner} == ${second_id}"
            - "GET /bids?auction_lot_id=${lot_id} returns total_count == 2 with both rows already carrying their final statuses"
