          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "After run #1 is created (bumping campaign.version), a second create still carrying the pre-create expected_campaign_version fails with 412 ERR_STALE_VERSION — the OCC tier fires before the state-tier ERR_ACTIVE_LOTTERY_EXISTS."
