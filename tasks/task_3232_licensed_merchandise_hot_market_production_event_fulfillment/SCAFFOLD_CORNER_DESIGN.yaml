            - "the unknown-team filter returns an empty array with total_count 0 and has_more false"
            - "ProductionOrder.${pow2_id}.status == PARALLEL_HOLD"

      - name: design_reversal_only_valid_from_rejected_state
        claim_type: conditional action
        grounds:
          - endpoints.PUT_/designs/{design_id}/submit
          - state_machines.Design.transitions.APPROVAL_REJECTED_to_PENDING_LICENSOR_APPROVAL
        distinguishing_aspect: "The resubmission endpoint is refused on an APPROVED design, so it is a conditional action gated on APPROVAL_REJECTED rather than a general design update route."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Licensor LICX with an APPROVED design DSGX."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
