              captures: { state1: $.data.approval_state, prov1: $.data.provisional_security_cost_cents }
            - call: "GET /exec-protection/executives/${exec_id}"
              payload: {}
              as: ProtectionManager
              as_user_id: "${mgr_id}"
              captures: { committed_after: $.data.committed_budget_cents, rem_after: $.data.remaining_budget_cents, spent_after: $.data.spent_budget_cents }
          assert:
            - "at creation the identity holds trivially: committed_budget_cents == 0, spent_budget_cents == 0, remaining_budget_cents == 100000000, and 0 + 0 + 100000000 == annual_security_budget_cents"
            - "after submit-for-approval: provisional_security_cost_cents == 112500, committed_budget_cents == 112500, spent_budget_cents == 0, remaining_budget_cents == 99887500, and 112500 + 0 + 99887500 == 100000000"
            - "before the DENY: SecurityStaff.${lead_id}.committed_detail_hours == 10 and the assignment is CONFIRMED with cost_cents == 112500 and cost_basis == PROVISIONAL"
            - "the DENY succeeds with HTTP 200 even though Trip.briefing_ack_at is null — validations[priority=32] applies only to an APPROVE decision"
            - "after the DENY: approval_state == DENIED and denied_reason == 'destination advisory withdrawn by the insurer'"
            - "after the DENY the money ledger is restored exactly: committed_budget_cents == 0, spent_budget_cents == 0, remaining_budget_cents == 100000000, and 0 + 0 + 100000000 == 100000000 — identical to the pre-submit values, with no residue of 112500 anywhere"
            - "the compensation did NOT route the commitment through spending: spent_budget_cents was 0 at every observation point"
            - "Trip.provisional_security_cost_cents is STILL 112500 after the DENY — the trip's own frozen figure is not rewritten; it leaves the committed sum because DENIED is not one of {PENDING_REVIEW, PENDING_COMPLIANCE, APPROVED}"
            - "cascade CH-D hop 2 and hop 3 also restore the staff ledger: the assignment is CANCELLED with cost_cents == 0, cost_basis == VOID, cancelled_reason == 'TRIP_DENIED', and SecurityStaff.${lead_id}.committed_detail_hours == 0 (its pre-creation value) while released_detail_hours == 0"

      - name: vendor_suspension_restores_the_hours_ledger_without_touching_completed_rows
        grounds:
          - calculations.commitment_ledgers
          - entities.Vendor.committed_engagement_hours
          - state_machines.VendorEngagement.ACTIVE_to_CANCELLED
          - state_machines.VendorEngagement.ACTIVE_to_COMPLETED
          - state_machines.Vendor.AVAILABLE_to_SUSPENDED
          - endpoints.POST_/exec-protection/vendors/{id}/suspend
        distinguishing_aspect: |
          A different conserved quantity TYPE from the money instance above: HOURS, in the
          Q_VENDOR_HOURS ledger Vendor.committed_engagement_hours == SUM of engagement_hours
          over that vendor's ACTIVE engagements. Two things must hold at once after the
          compensator (vendor suspension, cascade CH-A hop 2) fires: the ledger returns to
          its exact pre-creation value of 0, and the compensation touches ONLY the rows that
          are still ACTIVE — an engagement that already left ACTIVE by being COMPLETED had
          already been debited from the ledger by its own completion, so cancelling it again
          would drive the ledger negative, and its recorded engagement_cost_cents must
          survive intact because that money has already been earned. The engagement type is
          GROUND_SECURITY, so cascade CH-A hop 3 (the LOCAL_LIAISON advance-item removal) is
          deliberately not in play and the instance isolates the ledger arithmetic.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z; TIER_3 executive, budget 100000000, residential_component 10.00; PT rated LOW; one APPROVED assessment"
            - "one trip 2026-09-10T00:00:00Z..2026-09-12T00:00:00Z with one wide leg in PT; the trip is never submitted so no money ledger is involved"
            - "one AVAILABLE GROUND_SECURITY vendor in PT, max_concurrent_engagements 2, retainer 50000, hourly 10000"
            - "engagement E1 2026-09-10T08:00:00Z..2026-09-10T12:00:00Z (4h, cost 90000) left ACTIVE, and engagement E2 2026-09-10T12:00:00Z..2026-09-10T18:00:00Z (6h, cost 110000) driven to COMPLETED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemOperator
              as_user_id: "ops-1"
            - call: "POST /exec-protection/security-staff"
              payload: { full_name: "Ana Analyst", staff_role: "ANALYST", certification_expires_at: "2027-01-01T00:00:00Z", hourly_rate_cents: 9000 }
              as: SystemOperator
              as_user_id: "ops-1"
              captures: { analyst_id: $.data.id }
            - call: "POST /exec-protection/security-staff"
              payload: { full_name: "Mia Manager", staff_role: "MANAGER", certification_expires_at: "2027-01-01T00:00:00Z", hourly_rate_cents: 11000 }
              as: SystemOperator
              as_user_id: "ops-1"
              captures: { mgr_id: $.data.id }
