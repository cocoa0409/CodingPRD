              payload: { term_start_date: "2027-01-01", term_end_date: "2029-12-31", indemnification_acknowledged: true }
              as: AuthorizedOfficer
              captures: { p_id: "$.data.id" }
            - call: "POST /osup/permits/${p_id}/noncompliance-actions"
              payload: { severity: "MINOR", action_type: "WARNING", cited_provision: "36 CFR 251.56(a) clause 1", cure_deadline_date: "2027-06-30" }
              as: AuthorizedOfficer
              as_user_id: "officer-1"
            - call: "POST /osup/permits/${p_id}/noncompliance-actions"
              payload: { severity: "MINOR", action_type: "WARNING", cited_provision: "36 CFR 251.56(a) clause 2", cure_deadline_date: "2027-06-30" }
              as: AuthorizedOfficer
