            - call: "POST /cosmfg/formulas/${fm}/stability-studies"
              payload: { chamber_id: "${ch}", study_type: "ACCELERATED" }
              as: QAManager
              captures: { s3: $.data.id }
            - call: "GET /cosmfg/stability-chambers/${ch}"
              as: QAManager
              captures: { ch_cnt: $.data.active_study_count }
          assert:
            - "Third study while 2 IN_PROGRESS rejected with error_id ERR_CHAMBER_CAPACITY_EXCEEDED"
            - "After study ${s1} fails (COMPLETED_FAIL frees the slot), the retry succeeds as ${s3}"
            - "StabilityChamber.${ch}.active_study_count == 2 at the end"

