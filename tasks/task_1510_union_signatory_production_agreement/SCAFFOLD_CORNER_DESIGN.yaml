  # ===================================================================
  # Section: consistency_model
  # ===================================================================
  - section: consistency_model
    instances:
      - name: immediate_visibility_of_computed_fields_on_create
        claim_type: immediate
        grounds:
          - "complexity_profile.consistency_model"
          - "entities.Production.fields.compliance_posture"
          - "entities.Production.fields.status"
        distinguishing_aspect: "Immediate consistency: the POST /productions response itself carries status REGISTERED, compliance_posture CLEAR, and version 1 — no re-read or reconciliation delay needed."
        test_recipe:
          setup: ["SIGNATORY company"]
          setup_api_calls:
            - { call: "POST /union-compliance/producer-companies", payload: { legal_name: "Dropwort LLC", fein: "20-0000056" }, as: ProducerRep, captures: { co_id: $.data.id } }
            - { call: "POST /union-compliance/signatory-applications", payload: { producer_company_id: "${co_id}", requested_agreement_scope: "NEW_MEDIA", estimated_slate_budget_cents: 20000000 }, as: ProducerRep, as_user_id: "${co_id}", captures: { app_id: $.data.id } }
            - { call: "POST /union-compliance/signatory-applications/${app_id}/submit", payload: {}, as: ProducerRep, as_user_id: "${co_id}" }
            - { call: "POST /union-compliance/signatory-applications/${app_id}/decide", payload: { decision: "APPROVE" }, as: UnionRep }
          trigger:
            - { call: "POST /union-compliance/productions", payload: { producer_company_id: "${co_id}", title: "Dropwort Dell", agreement_tier: "ULTRA_LOW_BUDGET", budget_cents: 20000000 }, as: ProducerRep, as_user_id: "${co_id}", captures: { st: $.data.status, po: $.data.compliance_posture, v: $.data.version, prod_id: $.data.id } }
          assert:
            - "${st} == REGISTERED"
            - "${po} == CLEAR"
            - "${v} == 1"
            - "response envelope response_type == 'object' with meta.api_request_id present"

  # ===================================================================
  # Section: errors (triggerability stubs for errors already exercised
  # as the failure path of 1.8 difficulty instances)
  # ===================================================================
  - section: errors
    instances:
      - name: err_empty_report_basic_trigger
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_EMPTY_REPORT]"
        excluded_because:
          difficulty_instance: contribution_report_empty_log_set_rejected
          rationale: "ERR_EMPTY_REPORT is asserted as the failure path of the named 1.8 instance (empty vs one-element inclusion set)."
      - name: err_company_not_signatory_basic_trigger
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_COMPANY_NOT_SIGNATORY]"
        excluded_because:
          difficulty_instance: production_create_requires_signatory_company
          rationale: "ERR_COMPANY_NOT_SIGNATORY is asserted as the failure path of the named 1.8 instance."
      - name: err_duplicate_work_log_basic_trigger
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_DUPLICATE_WORK_LOG]"
        excluded_because:
          difficulty_instance: work_log_same_date_point_occupancy
          rationale: "ERR_DUPLICATE_WORK_LOG is asserted as the failure path of the named 1.8 instance."
      - name: err_fm_overlap_basic_trigger
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_FM_OVERLAP]"
        excluded_because:
          difficulty_instance: force_majeure_half_open_interval_overlap
          rationale: "ERR_FM_OVERLAP is asserted as the failure path of the named 1.8 instance."
      - name: err_filing_window_expired_basic_trigger
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_FILING_WINDOW_EXPIRED]"
        excluded_because:
          difficulty_instance: grievance_filing_temporal_beats_cross_production_referential
          rationale: "ERR_FILING_WINDOW_EXPIRED is asserted as the failure path of the named 1.8 instance; the tolling extension variant is covered separately by corner instance filing_window_tolling_extends_deadline."
      - name: err_production_state_on_start_basic_trigger
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_PRODUCTION_STATE]"
        excluded_because:
          difficulty_instance: start_production_state_error_beats_staffing_safety
          rationale: "ERR_PRODUCTION_STATE on start-production is asserted by the named 1.8 instance; other ERR_PRODUCTION_STATE surfaces are covered by crew_activate_before_in_production_rejected, fm_declare_before_bond_rejected and closed_production_start_rejected_terminal_lockdown."
      - name: bond_forfeit_ledger_totals_trigger
        claim_type: violation_to_error
        grounds:
          - "state_machines.Bond.UNDERFUNDED_to_FORFEITED"
        excluded_because:
          difficulty_instance: audit_close_bond_forfeit_company_cascade
          rationale: "Forfeiture ledger totals (total_forfeited_cents == 2500000, amount_held_cents == 0) are asserted by the named 1.8 instance."
