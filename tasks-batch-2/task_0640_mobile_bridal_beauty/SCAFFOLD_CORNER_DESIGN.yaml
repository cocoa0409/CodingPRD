              payload: {}
              as: Coordinator
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_FORBIDDEN_ROLE"

      - name: non_owner_client_cannot_cancel_event
        claim_type: ownership_violation
        grounds: ["validations[priority=4]", "errors[ERR_NOT_EVENT_OWNER]"]
        distinguishing_aspect: "A Client whose id != event.client_id cancelling the event -> ERR_NOT_EVENT_OWNER (403)."
        test_recipe:
          setup: ["event owned by client-1, QUOTED"]
          setup_api_calls:
            - call: "POST /bridal-beauty/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Coordinator
            - call: "POST /bridal-beauty/artists"
              payload: { display_name: "L1", skill_tier: "LEAD", hair_rate_per_face_cents: 20000, makeup_rate_per_face_cents: 25000, travel_rate_per_km_cents: 600, max_faces_per_hour: 2 }
              as: Coordinator
              captures: { l1_id: $.data.id }
            - call: "POST /bridal-beauty/events"
              payload: { client_id: "client-1", event_date_utc: "2026-07-15T08:00:00Z", ready_by_utc: "2026-07-15T12:00:00Z", venue_distance_km: 10, trial_required: false }
              as: Client
              as_user_id: "client-1"
              captures: { e_id: $.data.id }
            - call: "POST /bridal-beauty/events/${e_id}/faces"
              payload: { person_label: "BRIDE", service_type: "HAIR", is_bride: true }
              as: Client
              as_user_id: "client-1"
              captures: { f1: $.data.id }
            - call: "POST /bridal-beauty/faces/${f1}/confirm"
              payload: {}
              as: Client
              as_user_id: "client-1"
            - call: "POST /bridal-beauty/events/${e_id}/quote"
              payload: {}
              as: Coordinator
          trigger:
            - call: "POST /bridal-beauty/events/${e_id}/cancel"
              payload: { reason: "CLIENT_CHOICE" }
              as: Client
              as_user_id: "client-2"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NOT_EVENT_OWNER"

      - name: missing_auth_header_returns_unauthenticated
        claim_type: forbidden_role
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A call with no X-User-Role/X-User-ID headers -> ERR_UNAUTHENTICATED (401)."
        test_recipe:
          setup: ["empty DB"]
