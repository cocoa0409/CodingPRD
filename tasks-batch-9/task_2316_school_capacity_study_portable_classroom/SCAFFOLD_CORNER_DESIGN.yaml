      - name: exclusive_operations_are_refused_to_every_other_role
        claim_type: role_matrix
        grounds: [roles.DistrictAdmin, roles.FacilitiesPlanner, roles.CapacityCertifier, roles.PermitCoordinator, roles.BuildingOfficial, "validations[2]"]
        distinguishing_aspect: "The interesting pairs are the ones a lazy implementation would collapse: planner cannot certify and certifier cannot submit, coordinator cannot decide and official cannot refile, and only the admin may patch a room. The shared projection endpoint must accept both the admin and the planner, so a blanket role check on the whole entity fails."
