          - entities.Subscriber.fields.cycle_start_date
          - entities.EquipmentAssignment.fields.deployed_at
          - calculations.install_invoice_total
        distinguishing_aspect: |
          Cascade chain Z, depth 4, triggered from the FIELD-OPERATIONS side (POST
          /install-work-orders/{id}/completion) rather than the transport side used by
          backhaul_degradation_cascade_freezes_sector_releases_hold_expires_request: hop 1 moves the
