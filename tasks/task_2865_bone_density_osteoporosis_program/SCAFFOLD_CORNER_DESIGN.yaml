      - name: passing_daily_qc_writes_the_device_control_fields_and_is_immediately_readable
        claim_type: action_endpoint_side_effects
        grounds:
          - endpoints[POST /bone-density/densitometers/{id}/qc-runs]
          - calculations.qc_deviation_and_result
          - entities.Densitometer[last_qc_result, last_qc_run_at, consecutive_qc_pass_count]
        distinguishing_aspect: "A DAILY_QC run is an immutable child write whose whole effect is on its parent's control fields: 1.0050 against a 1.0000/0.0100 phantom yields deviation_g_cm2 0.0050 and deviation_sd_units 0.500 with result PASS, and a second run at exactly 1.0100 is deviation_sd_units 1.000 which is still PASS because the warn band is exclusive, leaving the device ACTIVE with consecutive_qc_pass_count 2 and last_qc_run_at at the second run's instant."
        test_recipe:
          setup:
            - "One ACTIVE densitometer with a 1.0000 / 0.0100 phantom baseline and no QC history."
          setup_api_calls:
            - call: "POST /bone-density/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-02T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /bone-density/densitometers"
              payload: { serial_number: "HLG-0001", manufacturer: "HOLOGIC", model: "Horizon A", site_code: "MAIN", phantom_baseline_bmd_g_cm2: 1.0000, phantom_baseline_sd_g_cm2: 0.0100, appointment_buffer_minutes: 15, daily_scan_capacity: 12 }
              as: ProgramAdmin
              captures: { dev_a_id: $.data.id }
          trigger:
            - call: "POST /bone-density/densitometers/${dev_a_id}/qc-runs"
              payload: { purpose: "DAILY_QC", phantom_bmd_g_cm2: 1.0050, scan_mode: "ARRAY" }
              as: Technologist
              as_user_id: "tech-001"
              captures: { qc1_id: $.data.id }
            - call: "POST /bone-density/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-03T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /bone-density/densitometers/${dev_a_id}/qc-runs"
              payload: { purpose: "DAILY_QC", phantom_bmd_g_cm2: 1.0100, scan_mode: "ARRAY" }
              as: Technologist
              as_user_id: "tech-001"
              captures: { qc2_id: $.data.id }
          assert:
            - "the first trigger response status is 201 with deviation_g_cm2 0.0050, deviation_sd_units 0.500, result PASS, shift_detected false, calibration_event_id null and performed_by_user_id tech-001"
            - "the first trigger response has performed_at_utc 2026-03-02T08:00:00Z"
            - "the third trigger response has deviation_g_cm2 0.0100, deviation_sd_units 1.000 and result PASS"
            - "Densitometer.${dev_a_id}.status == ACTIVE"
            - "Densitometer.${dev_a_id}.last_qc_result == PASS"
            - "Densitometer.${dev_a_id}.last_qc_run_at == 2026-03-03T08:00:00Z"
            - "Densitometer.${dev_a_id}.consecutive_qc_pass_count == 2"
            - "Densitometer.${dev_a_id}.qc_hold_started_at is null and qc_hold_reason_code is null"
            - "GET /bone-density/qc-runs?densitometer_id=${dev_a_id}&purpose=DAILY_QC returns total_count 2 with ${qc2_id} first, because the list is ordered performed_at_utc DESC"
            - "GET /bone-density/qc-runs/${qc1_id} returns deviation_sd_units 0.500 and result PASS unchanged"
