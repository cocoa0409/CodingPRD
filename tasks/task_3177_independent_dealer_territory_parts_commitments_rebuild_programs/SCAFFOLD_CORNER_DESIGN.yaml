            - "the read reports fulfilled_units == 0 and fill_rate_pct == 0.0"
            - "after POST /dealer-network/parts-order-batches/${bt_id}/receive with ordered_ref \"OEM-ORD-9101\" the read reports fulfilled_units == 10 and fill_rate_pct == 100.0"
            - "after that receipt the read reports committed_units == 0 and available_commitment_units == 63"

      - name: dealer_sales_manager_cannot_act_for_another_dealer
        claim_type: Standard CRUD plus Conditional Action
        grounds:
          - validations[priority=2]
          - endpoints.POST_/dealer-network/equipment-orders
          - roles.DealerSalesManager
        distinguishing_aspect: "The entity-backed role is scoped to its own identity: a DealerSalesManager whose X-User-ID is dealer A is refused with 403 ERR_UNAUTHORIZED when the payload names dealer B, and the same payload succeeds when the ids match."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Two dealers, T-410 and T-411."
          setup_api_calls:
            - *n_clock
            - *n_dealer
            - call: "POST /dealer-network/dealers"
              payload: { legal_name: "Coastal Lift Systems", home_state_code: "CA", territory_code: "T-411" }
              as: DealerNetworkManager
              captures: { d_other: $.data.id }
          trigger:
            - call: "POST /dealer-network/equipment-orders"
              payload: { dealer_id: "${d_other}", product_family: "EXCAVATION", machine_serial: "SN-6300", list_price_cents: 50000000, requested_at: "2026-08-20T00:00:00Z" }
              as: DealerSalesManager
              as_user_id: "${d_id}"
              captures: { err: $.data.error_id }
            - call: "POST /dealer-network/equipment-orders"
              payload: { dealer_id: "${d_id}", product_family: "EXCAVATION", machine_serial: "SN-6300", list_price_cents: 50000000, requested_at: "2026-08-20T00:00:00Z" }
              as: DealerSalesManager
              as_user_id: "${d_id}"
              captures: { eq_ok: $.data.id }
          assert:
            - "the cross-dealer call returns 403 with err == ERR_UNAUTHORIZED"
            - "GET /dealer-network/equipment-orders?dealer_id=${d_other} returns 0 rows"
            - "the own-dealer call returns 201 and EquipmentOrder.${eq_ok}.dealer_id == ${d_id}"

      - name: equipment_order_cancel_releases_the_trade_in_track
        claim_type: Action endpoint
        grounds:
          - endpoints.POST_/dealer-network/equipment-orders/{id}/cancel
          - state_machines.EquipmentOrder.SUBMITTED_to_CANCELLED
          - entities.TradeInUnit.fields.status
        distinguishing_aspect: "Cancelling a SUBMITTED order is refused precisely when the order is DRAFT and accepted from SUBMITTED, and the accepted cancel leaves the attached trade-in row reachable but no longer on the live remarketing track."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. One dealer T-410 with a SUBMITTED equipment order carrying trade_in_serial SN-6005."
          setup_api_calls:
            - *n_clock
            - *n_dealer
            - call: "POST /dealer-network/equipment-orders"
              payload: { dealer_id: "${d_id}", product_family: "EXCAVATION", machine_serial: "SN-6400", list_price_cents: 50000000, trade_in_serial: "SN-6005", requested_at: "2026-08-20T00:00:00Z" }
              as: DealerSalesManager
              as_user_id: "${d_id}"
              captures: { eq_id: $.data.id }
            - call: "POST /dealer-network/equipment-orders/${eq_id}/submit"
              payload: {}
              as: DealerSalesManager
              as_user_id: "${d_id}"
          trigger:
            - call: "POST /dealer-network/equipment-orders/${eq_id}/cancel"
              payload: {}
              as: DealerSalesManager
              as_user_id: "${d_id}"
          assert:
            - "the cancel returns 200 and EquipmentOrder.${eq_id}.status == CANCELLED"
            - "GET /dealer-network/equipment-orders/${eq_id}/trade-ins returns exactly 1 row still readable"
            - "GET /dealer-network/trade-in-units?status=APPRAISED returns 0 rows after the cancel"
            - "a second cancel of the same order returns 409 with error_id ERR_INVALID_STATE"

  # ===========================================================================
  - section: errors
    instances:

      - name: stale_dealer_version_on_agreement_create_returns_stale_version
        claim_type: Optimistic concurrency
        grounds:
          - errors.ERR_STALE_VERSION
          - concurrency_rules[agreement-create-stale-dealer]
          - endpoints.POST_/dealer-network/dealer-agreements
        distinguishing_aspect: "A create carrying the dealer's previous version is refused with 412 ERR_STALE_VERSION while the same payload with the freshly read version returns 201, so the stale check is decided by the version alone and not by the payload."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. One dealer T-410 whose version has advanced once since the client last read it."
          setup_api_calls:
            - *n_clock
            - *n_dealer
            - call: "POST /dealer-network/dealer-agreements"
              payload: { dealer_id: "${d_id}", product_family: "EARTHMOVING", territory_code: "T-410", exclusivity_level: "SHARED", start_at: "2026-09-01T00:00:00Z", end_at: "2027-09-01T00:00:00Z", performance_plan_share_pct: 15, expected_dealer_version: "${d_v}" }
              as: DealerNetworkManager
          trigger:
            - call: "POST /dealer-network/dealer-agreements"
              payload: { dealer_id: "${d_id}", product_family: "EXCAVATION", territory_code: "T-410", exclusivity_level: "SHARED", start_at: "2026-09-01T00:00:00Z", end_at: "2027-09-01T00:00:00Z", performance_plan_share_pct: 20, expected_dealer_version: "${d_v}" }
              as: DealerNetworkManager
              captures: { err: $.data.error_id }
            - call: "GET /dealer-network/dealers/${d_id}"
              payload: {}
              as: DealerNetworkManager
              captures: { d_v_now: $.data.version }
            - call: "POST /dealer-network/dealer-agreements"
              payload: { dealer_id: "${d_id}", product_family: "EXCAVATION", territory_code: "T-410", exclusivity_level: "SHARED", start_at: "2026-09-01T00:00:00Z", end_at: "2027-09-01T00:00:00Z", performance_plan_share_pct: 20, expected_dealer_version: "${d_v_now}" }
              as: DealerNetworkManager
          assert:
            - "the stale create returns 412 with err == ERR_STALE_VERSION"
            - "the stale attempt created no EARTHMOVING agreement for ${d_id} beyond the one already on file"
            - "the re-read create returns 201"
            - "GET /dealer-network/dealers/${d_id} reports version == ${d_v_now} + 1 after the successful create"

      - name: rebuild_claim_approve_without_repair_priority_returns_no_restriction_priority
        claim_type: Violation to Error
