      - name: distributor_authorization_threshold_needs_two_distinct_technicians
        claim_type: rate_threshold_triggers
        grounds:
          - state_machines.Distributor.PENDING_TRAINING_to_AUTHORIZED
          - entities.Distributor.fields.trained_technician_count
          - endpoints[POST /clm/distributors/{id}/training-completions]
        distinguishing_aspect: "The authorization threshold is a conjunction of a headcount and a module-coverage condition, and this walk satisfies the module half first: one technician holding BOTH modules still leaves the distributor in PENDING_TRAINING, and only the second distinct technician flips it — so a count of training rows (which is already 2) cannot stand in for the count of technicians."
        test_recipe:
          setup: ["Distributor D-01 in PENDING_TRAINING with two technicians T-201 and T-202 and no training rows"]
          setup_api_calls:
            - call: "POST /clm/distributors"
              payload: { distributor_code: "D-01", legal_name: "Bay Laundry Supply", territory_code: "TX-CENTRAL", territory_exclusive: true }
              as: ChannelManager
