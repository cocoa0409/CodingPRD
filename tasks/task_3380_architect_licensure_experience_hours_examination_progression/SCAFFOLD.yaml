scenario: "Architect Licensure Experience Hours & Examination Progression (NCARB): record establishment for candidates with education evaluation against accredited degree requirements or alternative paths, experience program hour reporting across practice areas with supervisor verification and submission deadlines, examination division scheduling with rolling clock rules governing how long passed divisions remain valid, retake waiting periods and score reporting with confidentiality of test content, jurisdiction-specific requirements layered on national standards including supplemental exams, certification issuance enabling reciprocal licensure across jurisdictions with transmittal to state boards, continuing education tracking for certificate maintenance, disciplinary reporting between jurisdictions"
domain_name: architect-licensure-experience-examination
api_prefix: /licensure

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: temporal_windowing
  complexity_layers:
    - cascading_side_effects
    - derived_field_reconciliation
    - rate_threshold_triggers
    - optimistic_concurrency
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate
  notes: |
    Difficulty is carried by deadline arithmetic (8-month full-credit window,
    60-month experience horizon, 60-month rolling exam clock, 60-day retake
    wait, 365-day attempt window, 45-day verification reassignment window,
    24-month CE periods), jurisdiction-layered requirement overrides, and
    cyclic state machines — not by endpoint count (40 endpoints).

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# 1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:
  - name: Candidate
    parent: null
    common_fields: true
    fields:
      - { name: email, type: string, source: input, description: "unique login email", constraints: "unique across candidates" }
      - { name: full_name, type: string, source: input, description: "legal full name" }
      - { name: password, type: string, source: input, description: "login password; stored, never returned in responses" }
      - { name: home_jurisdiction_code, type: string, source: input, description: "code of the Jurisdiction the candidate seeks initial licensure in; must resolve to an existing Jurisdiction.code" }
      - { name: education_status, type: enum, source: system, description: "education sub-status", default: NONE, constraints: "one of NONE, SATISFIED" }
      - { name: experience_status, type: enum, source: system, description: "experience-program sub-status", default: NOT_STARTED, constraints: "one of NOT_STARTED, IN_PROGRESS, COMPLETE" }
      - { name: exam_status, type: enum, source: system, description: "examination sub-status", default: NOT_AUTHORIZED, constraints: "one of NOT_AUTHORIZED, AUTHORIZED, ALL_PASSED" }
      - { name: certificate_eligible, type: boolean, source: computed, description: "persisted recompute of calculations.certificate_eligibility; refreshed on every input change", default: false }
      - { name: record_standing, type: enum, source: system, description: "disciplinary standing", default: CLEAR, constraints: "one of CLEAR, FLAGGED" }
  - name: Jurisdiction
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "unique jurisdiction code, e.g. 'CA'", constraints: "unique" }
      - { name: name, type: string, source: input, description: "board name" }
      - { name: requires_supplemental_exam, type: boolean, source: input, description: "true when this board layers a supplemental exam on national standards", default: false }
      - { name: min_total_experience_hours, type: integer, source: input, description: "jurisdiction override of national experience total", default: 3740 }
      - { name: ce_hours_required, type: integer, source: input, description: "total CE hours required per 24-month renewal period", default: 24 }
      - { name: ce_hsw_hours_required, type: integer, source: input, description: "HSW-subset CE hours required per period", default: 12 }
      - { name: ce_carry_over_allowed, type: boolean, source: input, description: "true when excess hours from the immediately preceding period (capped at 12) may count toward the current period", default: false }
  - name: Supervisor
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "supervising architect name" }
      - { name: license_number, type: string, source: input, description: "architect license number", constraints: "unique" }
      - { name: jurisdiction_code, type: string, source: input, description: "code of licensing jurisdiction; must resolve to an existing Jurisdiction.code" }
      - { name: license_status, type: enum, source: input, description: "whether the supervisor license is current", default: ACTIVE, constraints: "one of ACTIVE, INACTIVE" }
  - name: EducationEvaluation
    parent: null
    common_fields: true
    fields:
      - { name: candidate_id, type: string, source: input, description: "FK -> Candidate.id; owner of this evaluation" }
      - { name: path_type, type: enum, source: input, description: "education path", constraints: "one of ACCREDITED_DEGREE, ALTERNATIVE_PATH" }
      - { name: institution_name, type: string, source: input, description: "school or program name" }
      - { name: semester_credit_hours, type: integer, source: input, description: "total semester credit hours; must be >= 64 when path_type is ALTERNATIVE_PATH" }
      - { name: status, type: enum, source: system, description: "review state", default: SUBMITTED, constraints: "one of SUBMITTED, SATISFIED, DEFICIENT" }
      - { name: deficiency_notes, type: string, source: system, description: "reviewer notes; required when decision is DEFICIENT, null otherwise", default: null }
      - { name: review_count, type: integer, source: system, description: "number of completed reviews", default: 0 }
  - name: ExperienceReport
    parent: null
    common_fields: true
    fields:
      - { name: candidate_id, type: string, source: input, description: "FK -> Candidate.id; reporter" }
      - { name: supervisor_id, type: string, source: input, description: "FK -> Supervisor.id; verifying supervisor" }
      - { name: practice_area, type: enum, source: input, description: "AXP-style practice area", constraints: "one of PRACTICE_MANAGEMENT, PROJECT_MANAGEMENT, PROGRAMMING_ANALYSIS, PROJECT_PLANNING_DESIGN, PROJECT_DEVELOPMENT_DOCUMENTATION, CONSTRUCTION_EVALUATION" }
      - { name: hours, type: number, source: input, description: "reported work hours; must be > 0 and <= 2000" }
      - { name: work_period_start, type: string, source: input, description: "first work date, ISO date; half-open interval start" }
      - { name: work_period_end, type: string, source: input, description: "day after last work date, ISO date; half-open interval end; must be > work_period_start" }
      - { name: work_setting, type: enum, source: input, description: "employment setting", default: ARCHITECTURAL_FIRM, constraints: "one of ARCHITECTURAL_FIRM, GOVERNMENT, OTHER" }
      - { name: status, type: enum, source: system, description: "report lifecycle", default: DRAFT, constraints: "one of DRAFT, SUBMITTED, VERIFIED, RETURNED" }
      - { name: submitted_at, type: datetime, source: system, description: "logical-clock timestamp of most recent DRAFT-or-RETURNED -> SUBMITTED transition; drives the locked credit tier", default: null }
      - { name: credit_pct, type: integer, source: system, description: "locked credit percentage stamped at submit time: 100 if submitted within 8 calendar months of work_period_end, 50 if within 60 months, else submit rejected", default: 0 }
      - { name: credited_hours, type: integer, source: system, description: "round_half_up(hours * credit_pct / 100) to integer, stamped at verify time; 0 while unverified", default: 0 }
      - { name: return_reason, type: string, source: system, description: "supervisor comment on RETURN", default: null }
  - name: ExamAuthorization
    parent: null
    common_fields: true
    fields:
      - { name: candidate_id, type: string, source: input, description: "Candidate.id value receiving authorization; discoverable via the candidate's exam-progress list (no reverse GET required)" }
      - { name: jurisdiction_code, type: string, source: input, description: "authorizing board's Jurisdiction.code; must resolve to an existing Jurisdiction.code" }
      - { name: status, type: enum, source: system, description: "authorization state", default: ACTIVE, constraints: "one of ACTIVE" }
  - name: ExamDivisionProgress
    parent: null
    common_fields: true
    fields:
      - { name: candidate_id, type: string, source: input, description: "FK -> Candidate.id" }
      - { name: authorization_id, type: string, source: system, description: "ExamAuthorization.id that created this row (one row per division per authorization)" }
      - { name: division_code, type: enum, source: system, description: "examination division", constraints: "one of PCM, PJM, PA, PPD, PDD, CE" }
      - { name: status, type: enum, source: system, description: "division lifecycle", default: ELIGIBLE, constraints: "one of ELIGIBLE, SCHEDULED, PASSED, FAILED, EXPIRED" }
      - { name: scheduled_date, type: string, source: system, description: "sitting date (ISO date) while SCHEDULED; null otherwise", default: null }
      - { name: attempt_count, type: integer, source: system, description: "number of scored attempts", default: 0 }
      - { name: attempt_dates, type: array, source: system, description: "sitting dates of all scored attempts, chronological", default: [] }
      - { name: last_failed_at, type: string, source: system, description: "sitting date of most recent FAIL result", default: null }
      - { name: passed_at, type: string, source: system, description: "sitting date of the PASS result currently conferring credit", default: null }
      - { name: expires_at, type: string, source: system, description: "passed_at + 60 calendar months (rolling clock); pass is expired when current date >= expires_at", default: null }
      - { name: result, type: enum, source: system, description: "most recent scored result", default: null, constraints: "one of PASS, FAIL" }
      - { name: scaled_score, type: integer, source: system, description: "0-100 scaled score of most recent attempt; only PASS/FAIL plus this scalar are ever exposed - item-level content is confidential", default: null }
  - name: SupplementalExam
    parent: null
    common_fields: true
    fields:
      - { name: candidate_id, type: string, source: input, description: "FK -> Candidate.id" }
      - { name: jurisdiction_code, type: string, source: input, description: "board whose supplemental exam this is; Jurisdiction.requires_supplemental_exam must be true" }
      - { name: exam_date, type: string, source: input, description: "sitting date (ISO date); must be >= current date; retakes require exam_date >= previous exam_date + 90 days" }
      - { name: status, type: enum, source: system, description: "result state", default: REGISTERED, constraints: "one of REGISTERED, PASSED, FAILED" }
      - { name: result, type: enum, source: system, description: "board-reported outcome", default: null, constraints: "one of PASS, FAIL" }
  - name: Certificate
    parent: null
    common_fields: true
    fields:
      - { name: candidate_id, type: string, source: system, description: "FK -> Candidate.id; certificate holder" }
      - { name: serial_number, type: string, source: system, description: "server-minted certificate serial" }
      - { name: home_jurisdiction_code, type: string, source: system, description: "snapshot of candidate.home_jurisdiction_code at issuance" }
      - { name: ce_hours_required, type: integer, source: system, description: "snapshot of home Jurisdiction.ce_hours_required at issuance" }
      - { name: ce_hsw_hours_required, type: integer, source: system, description: "snapshot of home Jurisdiction.ce_hsw_hours_required at issuance" }
      - { name: status, type: enum, source: system, description: "certificate lifecycle", default: ACTIVE, constraints: "one of ACTIVE, LAPSED, REVOKED" }
      - { name: issued_at, type: datetime, source: system, description: "issuance timestamp (logical clock)" }
      - { name: period_start, type: string, source: system, description: "current CE period start (ISO date, inclusive)" }
      - { name: period_end, type: string, source: system, description: "current CE period end (ISO date, exclusive); period length is 24 calendar months" }
      - { name: renewal_count, type: integer, source: system, description: "number of successful renewals", default: 0 }
      - { name: ce_hours_current_period, type: integer, source: computed, description: "sum of non-voided CEEntry.hours with completed_date in [period_start, period_end)" }
      - { name: ce_hsw_current_period, type: integer, source: computed, description: "same sum restricted to entries with hsw = true" }
      - { name: lifetime_ce_hours, type: integer, source: computed, description: "sum of non-voided CEEntry.hours across all periods; never reset by renewal, lapse, or reinstatement" }
  - name: CEEntry
    parent: null
    common_fields: true
    fields:
      - { name: certificate_id, type: string, source: input, description: "FK -> Certificate.id" }
      - { name: hours, type: integer, source: input, description: "CE hours earned; 1..24" }
      - { name: hsw, type: boolean, source: input, description: "true when hours count as Health-Safety-Welfare" }
      - { name: completed_date, type: string, source: input, description: "ISO date the course completed; must be <= current date" }
      - { name: provider, type: string, source: input, description: "course provider name" }
      - { name: voided, type: boolean, source: system, description: "true after void action; voided entries count toward nothing", default: false }
  - name: Transmittal
    parent: null
    common_fields: true
    fields:
      - { name: certificate_id, type: string, source: input, description: "FK -> Certificate.id being transmitted" }
      - { name: jurisdiction_code, type: string, source: input, description: "destination board; must resolve to an existing Jurisdiction.code" }
      - { name: status, type: enum, source: system, description: "transmittal lifecycle", default: REQUESTED, constraints: "one of REQUESTED, LICENSE_GRANTED, LICENSE_DENIED, CANCELLED" }
      - { name: denial_reason, type: string, source: system, description: "board reason when LICENSE_DENIED", default: null }
  - name: DisciplinaryReport
    parent: null
    common_fields: true
    fields:
      - { name: candidate_id, type: string, source: input, description: "FK -> Candidate.id being reported" }
      - { name: jurisdiction_code, type: string, source: input, description: "reporting board; must resolve to an existing Jurisdiction.code" }
      - { name: allegation, type: string, source: input, description: "non-empty description of alleged misconduct" }
      - { name: filed_by_user_id, type: string, source: system, description: "X-User-ID of the filing BoardAdministrator; resolver must differ (segregation of duties)" }
      - { name: status, type: enum, source: system, description: "report lifecycle", default: OPEN, constraints: "one of OPEN, RESOLVED_CLEAR, RESOLVED_SANCTION" }
      - { name: resolution_notes, type: string, source: system, description: "resolver notes", default: null }

# ---------------------------------------------------------------------------
# 1.2 State Machine Table
# ---------------------------------------------------------------------------
state_machines:
  - entity: Candidate
    initial_state: "education_status=NONE, experience_status=NOT_STARTED, exam_status=NOT_AUTHORIZED, record_standing=CLEAR"
    terminal_states: [record_standing=FLAGGED]
    note: "Four guarded sub-status dimensions on one entity; certificate_eligible is a persisted recompute (calculations.certificate_eligibility) refreshed after every transition below."
    transitions:
      - from: education_status=NONE
        to: education_status=SATISFIED
        trigger: "POST /education-evaluations/{id}/review with decision=SATISFIED"
        actor: NcarbAdministrator
        preconditions: ["the EducationEvaluation belongs to this candidate", "evaluation status == SUBMITTED"]
        side_effects: ["recompute candidate.certificate_eligible"]
      - from: experience_status=NOT_STARTED
        to: experience_status=IN_PROGRESS
        trigger: "first ExperienceReport of this candidate reaches VERIFIED"
        actor: Supervisor
        preconditions: []
        side_effects: ["candidate.updated_at refreshed"]
      - from: experience_status=IN_PROGRESS
        to: experience_status=COMPLETE
        trigger: "verify of the report that completes calculations.experience_completion_gate"
        actor: Supervisor
        preconditions: ["all six area minima met by VERIFIED credited_hours", "total credited >= max(3740, home jurisdiction min_total_experience_hours)"]
        side_effects: ["recompute candidate.certificate_eligible (link 2 of verify cascade)"]
      - from: exam_status=NOT_AUTHORIZED
        to: exam_status=AUTHORIZED
        trigger: "POST /candidates/{id}/exam-authorizations"
        actor: BoardAdministrator
        preconditions: ["candidate exists", "jurisdiction_code resolves"]
        side_effects: ["create six ExamDivisionProgress rows (PCM, PJM, PA, PPD, PDD, CE), all ELIGIBLE"]
      - from: exam_status=AUTHORIZED
        to: exam_status=ALL_PASSED
        trigger: "report-score PASS on the last non-PASSED division"
        actor: NcarbAdministrator
        preconditions: ["after this transition all six divisions have status == PASSED"]
        side_effects: ["recompute candidate.certificate_eligible"]
      - from: exam_status=ALL_PASSED
        to: exam_status=AUTHORIZED
        trigger: "expiry sweep expires a PASSED division (rolling clock)"
        actor: system
        preconditions: ["a PASSED division's expires_at <= current date"]
        side_effects: ["recompute candidate.certificate_eligible"]
      - from: record_standing=CLEAR
        to: record_standing=FLAGGED
        trigger: "POST /disciplinary-reports/{id}/resolve with outcome=SANCTION"
        actor: NcarbAdministrator
        preconditions: ["report status == OPEN"]
        side_effects:
          - "link 1 of sanction cascade: candidate.record_standing := FLAGGED"
          - "link 2 (caused by link 1): the candidate's non-REVOKED Certificate, if any, transitions to REVOKED"
          - "recompute candidate.certificate_eligible (record_standing must be CLEAR)"
  - entity: EducationEvaluation
    initial_state: SUBMITTED
    terminal_states: [SATISFIED]
    transitions:
      - from: SUBMITTED
        to: SATISFIED
        trigger: "POST /education-evaluations/{id}/review decision=SATISFIED"
        actor: NcarbAdministrator
        preconditions: ["evaluation status == SUBMITTED"]
        side_effects: ["candidate.education_status := SATISFIED", "review_count += 1", "recompute candidate.certificate_eligible"]
      - from: SUBMITTED
        to: DEFICIENT
        trigger: "POST /education-evaluations/{id}/review decision=DEFICIENT"
        actor: NcarbAdministrator
        preconditions: ["evaluation status == SUBMITTED", "deficiency_notes present (non-empty)"]
        side_effects: ["review_count += 1", "deficiency_notes recorded"]
      - from: DEFICIENT
        to: SUBMITTED
        trigger: "POST /education-evaluations/{id}/resubmit"
        actor: Candidate
        preconditions: ["evaluation status == DEFICIENT", "caller is the owning candidate"]
        side_effects: ["deficiency_notes cleared to null", "input fields (path_type, institution_name, semester_credit_hours) replaced when provided"]
  - entity: ExperienceReport
    initial_state: DRAFT
    terminal_states: [VERIFIED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /experience-reports/{id}/submit"
        actor: Candidate
        preconditions:
          - "caller owns the report"
          - "report status == DRAFT"
          - "supervisor exists and Supervisor.license_status == ACTIVE"
          - "work period does not overlap any SUBMITTED or VERIFIED report of the same candidate (half-open [start, end); adjacency allowed)"
          - "submitted date <= work_period_end + 60 calendar months (else ERR_EXPERIENCE_TOO_OLD)"
        side_effects: ["submitted_at := logical clock now", "credit_pct stamped: 100 when submitted date <= work_period_end + 8 calendar months, else 50"]
      - from: RETURNED
        to: SUBMITTED
        trigger: "POST /experience-reports/{id}/submit (resubmission)"
        actor: Candidate
        preconditions: ["same as DRAFT -> SUBMITTED, with report status == RETURNED"]
        side_effects: ["submitted_at restamped to now", "credit_pct restamped from new submitted_at", "return_reason cleared"]
      - from: SUBMITTED
        to: VERIFIED
        trigger: "POST /experience-reports/{id}/verify"
        actor: Supervisor
        preconditions: ["report status == SUBMITTED", "caller X-User-ID == report.supervisor_id", "Supervisor.license_status == ACTIVE at verify time"]
        side_effects:
          - "credited_hours := round_half_up(hours * credit_pct / 100) to integer"
          - "link 1 of verify cascade: recompute per-area sums; if calculations.experience_completion_gate now holds, candidate.experience_status -> COMPLETE (NOT_STARTED -> IN_PROGRESS applied first when this is the first VERIFIED report)"
          - "link 2 (caused by link 1): recompute candidate.certificate_eligible"
      - from: SUBMITTED
        to: RETURNED
        trigger: "POST /experience-reports/{id}/return"
        actor: Supervisor
        preconditions: ["report status == SUBMITTED", "caller X-User-ID == report.supervisor_id"]
        side_effects: ["return_reason recorded", "candidate.total credited totals unchanged (SUBMITTED contributes 0)"]
      - from: SUBMITTED
        to: SUBMITTED
        trigger: "POST /experience-reports/{id}/reassign"
        actor: Candidate
        preconditions:
          - "caller owns the report"
          - "report status == SUBMITTED"
          - "current date >= submitted date + 45 days (verification reassignment window)"
          - "new supervisor exists, differs from current, and has license_status == ACTIVE"
        side_effects: ["supervisor_id := new_supervisor_id", "submitted_at and credit_pct PRESERVED (locked tier survives reassignment)"]
  - entity: ExamDivisionProgress
    initial_state: ELIGIBLE
    terminal_states: []
    note: "Cyclic: ELIGIBLE -> SCHEDULED -> FAILED -> SCHEDULED (retake) and PASSED -> EXPIRED -> SCHEDULED (rolling clock) loops are both legal."
    transitions:
      - from: ELIGIBLE
        to: SCHEDULED
        trigger: "POST /exam-progress/{id}/schedule"
        actor: Candidate
        preconditions:
          - "caller owns the progress row"
          - "scheduled_date >= current date (ERR_SCHEDULE_DATE_PAST otherwise)"
          - "fewer than 3 attempt_dates d with d > scheduled_date - 365 days (attempt window)"
          - "no other SCHEDULED division or REGISTERED supplemental exam of the same candidate shares the calendar day (ERR_EXAM_DAY_CONFLICT)"
        side_effects: ["scheduled_date recorded"]
      - from: FAILED
        to: SCHEDULED
        trigger: "POST /exam-progress/{id}/schedule"
        actor: Candidate
        preconditions:
          - "all ELIGIBLE -> SCHEDULED preconditions"
          - "scheduled_date >= last_failed_at + 60 days (retake wait, ERR_RETAKE_WAIT_NOT_ELAPSED)"
        side_effects: ["scheduled_date recorded"]
      - from: EXPIRED
        to: SCHEDULED
        trigger: "POST /exam-progress/{id}/schedule"
        actor: Candidate
        preconditions: ["all ELIGIBLE -> SCHEDULED preconditions (attempt_dates still count toward the 365-day window; expired passes do not confer credit)"]
        side_effects: ["scheduled_date recorded", "passed_at/expires_at/result/scaled_score retained as history until next score"]
      - from: SCHEDULED
        to: PASSED
        trigger: "POST /exam-progress/{id}/report-score with result=PASS"
        actor: NcarbAdministrator
        preconditions: ["status == SCHEDULED", "current date >= scheduled_date", "0 <= scaled_score <= 100"]
        side_effects:
          - "attempt_count += 1; attempt_dates append scheduled_date"
          - "passed_at := scheduled_date; expires_at := passed_at + 60 calendar months"
          - "result := PASS; scaled_score stored; scheduled_date := null"
          - "if all six divisions now PASSED: candidate.exam_status -> ALL_PASSED and certificate_eligible recompute"
      - from: SCHEDULED
        to: FAILED
        trigger: "POST /exam-progress/{id}/report-score with result=FAIL"
        actor: NcarbAdministrator
        preconditions: ["status == SCHEDULED", "current date >= scheduled_date", "0 <= scaled_score <= 100"]
        side_effects: ["attempt_count += 1; attempt_dates append scheduled_date", "last_failed_at := scheduled_date", "result := FAIL; scheduled_date := null"]
      - from: PASSED
        to: EXPIRED
        trigger: "POST /_maintenance/run_expiry_sweep when current date >= expires_at"
        actor: system
        preconditions: ["status == PASSED", "expires_at <= current date (expiry is inclusive at the boundary day)"]
        side_effects:
          - "link 1 of expiry cascade: this division loses credit (candidate.exam_status ALL_PASSED -> AUTHORIZED when applicable)"
          - "link 2 (caused by link 1): recompute candidate.certificate_eligible"
  - entity: SupplementalExam
    initial_state: REGISTERED
    terminal_states: [PASSED, FAILED]
    transitions:
      - from: REGISTERED
        to: PASSED
        trigger: "POST /supplemental-exams/{id}/report-result result=PASS"
        actor: BoardAdministrator
        preconditions: ["status == REGISTERED", "current date >= exam_date"]
        side_effects: ["result := PASS", "recompute candidate.certificate_eligible (satisfies supplemental requirement when jurisdiction requires it)"]
      - from: REGISTERED
        to: FAILED
        trigger: "POST /supplemental-exams/{id}/report-result result=FAIL"
        actor: BoardAdministrator
        preconditions: ["status == REGISTERED", "current date >= exam_date"]
        side_effects: ["result := FAIL", "a new SupplementalExam row may be REGISTERED only with exam_date >= this exam_date + 90 days"]
  - entity: Certificate
    initial_state: ACTIVE
    terminal_states: [REVOKED]
    transitions:
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /certificates/{id}/renew within the renewal window"
        actor: Candidate
        preconditions:
          - "caller owns the certificate"
          - "period_end - 60 days <= current date < period_end (renewal window)"
          - "CE requirement satisfied per calculations.ce_period_compliance using the home jurisdiction's CURRENT ce_carry_over_allowed flag"
        side_effects: ["period_start := period_end; period_end := period_end + 24 calendar months", "renewal_count += 1", "carry-over bookkeeping: carry_available for the new period = min(max(0, just-ended period total hours - ce_hours_required), 12)"]
      - from: ACTIVE
        to: LAPSED
        trigger: "POST /_maintenance/run_expiry_sweep when current date >= period_end"
        actor: system
        preconditions: ["status == ACTIVE", "current date >= period_end"]
        side_effects: ["status := LAPSED (lapse is unconditional at period end; CE sufficiency only matters at renew time)"]
      - from: LAPSED
        to: ACTIVE
        trigger: "POST /certificates/{id}/renew (reinstatement mode)"
        actor: Candidate
        preconditions:
          - "caller owns the certificate"
          - "current date <= period_end + 12 calendar months (reinstatement window, ERR_REINSTATEMENT_WINDOW_CLOSED)"
          - "non-voided entries with completed_date in [period_start, period_end) total >= ce_hours_required AND hsw subset >= ce_hsw_hours_required + 4 (reinstatement penalty)"
        side_effects: ["status := ACTIVE", "period_start := current date; period_end := current date + 24 calendar months", "renewal_count += 1", "carry_available reset to 0"]
      - from: ACTIVE
        to: REVOKED
        trigger: "sanction cascade link 2 (disciplinary resolve with outcome=SANCTION)"
        actor: system
        preconditions: ["candidate.record_standing became FLAGGED via link 1"]
        side_effects: ["link 3 of sanction cascade: every Transmittal of this certificate with status == REQUESTED transitions to CANCELLED (terminal transmittals LICENSE_GRANTED / LICENSE_DENIED are untouched)"]
      - from: LAPSED
        to: REVOKED
        trigger: "sanction cascade link 2"
        actor: system
        preconditions: ["candidate.record_standing became FLAGGED via link 1"]
        side_effects: ["same link-3 transmittal cancellation as ACTIVE -> REVOKED"]
  - entity: Transmittal
    initial_state: REQUESTED
    terminal_states: [LICENSE_GRANTED, LICENSE_DENIED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: LICENSE_GRANTED
        trigger: "POST /transmittals/{id}/decide outcome=GRANT"
        actor: BoardAdministrator
        preconditions: ["status == REQUESTED", "certificate status == ACTIVE at decision time"]
        side_effects: ["reciprocal licensure recorded for certificate.candidate_id in jurisdiction_code"]
      - from: REQUESTED
        to: LICENSE_DENIED
        trigger: "POST /transmittals/{id}/decide outcome=DENY"
        actor: BoardAdministrator
        preconditions: ["status == REQUESTED", "denial_reason present"]
        side_effects: ["denial_reason recorded", "a new transmittal to the same jurisdiction may be requested afterwards"]
      - from: REQUESTED
        to: CANCELLED
        trigger: "sanction cascade link 3 (certificate revoked)"
        actor: system
        preconditions: ["owning certificate transitioned to REVOKED"]
        side_effects: []
  - entity: DisciplinaryReport
    initial_state: OPEN
    terminal_states: [RESOLVED_CLEAR, RESOLVED_SANCTION]
    transitions:
      - from: OPEN
        to: RESOLVED_CLEAR
        trigger: "POST /disciplinary-reports/{id}/resolve outcome=CLEAR"
        actor: NcarbAdministrator
        preconditions: ["status == OPEN", "resolver X-User-ID != filed_by_user_id (segregation of duties)"]
        side_effects: ["no certificate or standing changes"]
      - from: OPEN
        to: RESOLVED_SANCTION
        trigger: "POST /disciplinary-reports/{id}/resolve outcome=SANCTION"
        actor: NcarbAdministrator
        preconditions: ["status == OPEN", "resolver X-User-ID != filed_by_user_id"]
        side_effects: ["sanction cascade link 1: candidate.record_standing := FLAGGED (then links 2 and 3 fire)"]

# ---------------------------------------------------------------------------
# 1.2.1 Concurrency Rules (OCC on parent version only)
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: jurisdiction-update-stale-version
    parent_entity: Jurisdiction
    write_endpoint: "PATCH /jurisdictions/{id}"
    occ_field: expected_jurisdiction_version
    description: |
      Updating a Jurisdiction's requirement flags with an
      expected_jurisdiction_version that no longer matches the stored
      Jurisdiction.version is rejected: another writer has modified the
      jurisdiction since the caller last observed it, so the caller's edit
      would silently discard that writer's change.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: supervisor-update-stale-version
    parent_entity: Supervisor
    write_endpoint: "PATCH /supervisors/{id}"
    occ_field: expected_supervisor_version
    description: |
      Updating a Supervisor's license data with an
      expected_supervisor_version that no longer matches the stored
      Supervisor.version is rejected: the caller's view of the supervisor
      record is stale relative to an intervening accepted update.
    error_id: ERR_STALE_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# 1.3 Calculation Rules Table
# ---------------------------------------------------------------------------
calculations:
  - name: experience_credit_tiering
    trigger: "stamped at POST /experience-reports/{id}/submit (locked variant); recomputed on read of GET /candidates/{id}/summary (projected variant)"
    algorithm: threshold
    formula: |
      Let months_after = calendar-month addition on ISO dates.
      tier_pct(date_submitted, work_end):
        if date_submitted <= work_end + 8 months:  100
        elif date_submitted <= work_end + 60 months: 50
        else: REJECT with ERR_EXPERIENCE_TOO_OLD (submit-time only)
      locked:  credit_pct stamped at submit using date(now); never recomputed.
      credited_hours at verify = round_half_up(hours * credit_pct / 100) to
      INTEGER, computed PER REPORT, then area totals sum the integers.
      Rounding order is pinned: per-report rounding first, sum second.
    input_set: "the single ExperienceReport being submitted/verified"
    constants:
      full_credit_window_months: 8
      half_credit_horizon_months: 60
      half_credit_pct: 50
      min_hours_per_report: 1
      max_hours_per_report: 2000
    precision: "credited_hours integer, round_half_up applied per report (3.5 -> 4)"
    variants:
      - name: locked_credit
        when: "official totals: area sums, experience completion gate, total_credited_hours"
        difference: "uses the tier stamped at submitted_at; a report submitted inside the 8-month window keeps 100% forever even if verified years later"
      - name: projected_preview
        when: "GET /candidates/{id}/summary projected_credited_hours field (what-if the candidate submitted all DRAFT reports and got everything verified today)"
        difference: "re-tiers every DRAFT and SUBMITTED report against the CURRENT date and adds VERIFIED credited_hours; diverges from locked whenever the clock crossed a tier boundary after submission"
  - name: area_progress_aggregation
    trigger: "on every ExperienceReport verify, and on read of summary"
    algorithm: aggregation
    formula: |
      For each of the six practice areas:
        area_credited[area] = SUM(credited_hours) over reports of this
        candidate with status == VERIFIED and this practice_area.
      total_credited_hours = SUM over all areas.
      DRAFT, SUBMITTED, RETURNED reports contribute exactly 0.
    input_set: "ExperienceReport rows of the candidate with status == VERIFIED only"
    constants:
      practice_area_min_hours:
        PRACTICE_MANAGEMENT: 160
        PROJECT_MANAGEMENT: 360
        PROGRAMMING_ANALYSIS: 260
        PROJECT_PLANNING_DESIGN: 1360
        PROJECT_DEVELOPMENT_DOCUMENTATION: 1520
        CONSTRUCTION_EVALUATION: 80
    precision: "integer hours"
  - name: experience_completion_gate
    trigger: "evaluated after every verify (drives candidate.experience_status -> COMPLETE)"
    algorithm: threshold
    formula: |
      complete = (for every area: area_credited[area] >= practice_area_min_hours[area])
                 AND total_credited_hours >= max(3740, home_jurisdiction.min_total_experience_hours)
      Boundary is INCLUSIVE: an area at exactly its minimum counts.
    input_set: "area_progress_aggregation output plus candidate.home_jurisdiction_code -> Jurisdiction.min_total_experience_hours"
    constants:
      national_total_hours_required: 3740
    precision: "integer hours; >= boundary inclusive"
  - name: rolling_clock_validity
    trigger: "POST /_maintenance/run_expiry_sweep; also read by summary and certificate_eligibility"
    algorithm: threshold
    formula: |
      For each division row with status == PASSED:
        valid(now) = current_date < expires_at   (expires_at = passed_at + 60 months)
      Sweep: every PASSED row with current_date >= expires_at -> EXPIRED.
      all_divisions_valid = (count of rows with status == PASSED and current_date < expires_at) == 6
      Because expiry is evaluated per division against its own passed_at,
      the earliest pass anchors the effective window: with passes at T1 < T2,
      once now >= T1 + 60 months the first division lapses even though the
      second remains valid until T2 + 60 months. Inputs: set of passed_at
      dates (6 rows), current date, rolling_clock_months; nested min/max
      over the pass set decides both the expired set and all_divisions_valid.
    input_set: "ExamDivisionProgress rows of the candidate (status, passed_at, expires_at)"
    constants:
      rolling_clock_months: 60
    precision: "day granularity; boundary day is EXPIRED (current_date >= expires_at)"
  - name: retake_eligibility
    trigger: "POST /exam-progress/{id}/schedule when status == FAILED; attempt-window check on every schedule"
    algorithm: chronological
    formula: |
      retake_ok = (status != FAILED) OR (scheduled_date >= last_failed_at + 60 days)
      window_ok = count(d in attempt_dates where d > scheduled_date - 365 days) < 3
      Both must hold. Processing is chronological over attempt_dates; the
      comparison against the 365-day cutoff is STRICT (an attempt exactly
      365 days before the new sitting date no longer counts).
    input_set: "the division row's attempt_dates, last_failed_at, and requested scheduled_date"
    constants:
      retake_wait_days: 60
      attempt_limit_count: 3
      attempt_limit_window_days: 365
    precision: "day granularity; retake boundary inclusive (sitting on last_failed_at + 60 days is allowed); attempt-window cutoff strict"
  - name: ce_period_compliance
    trigger: "POST /certificates/{id}/renew"
    algorithm: aggregation
    formula: |
      period_hours = SUM(hours) over non-voided CEEntry with
                     completed_date in [period_start, period_end)  -- half-open
      period_hsw   = same sum over entries with hsw == true
      carry        = min(max(0, previous_period_total - ce_hours_required), 12)
                     where previous_period_total is the total logged in the
                     immediately preceding period (0 for the first period or
                     after reinstatement)
      strict_ok     = period_hours >= ce_hours_required AND period_hsw >= ce_hsw_hours_required
      carryover_ok  = (period_hours + carry) >= ce_hours_required AND period_hsw >= ce_hsw_hours_required
      Reinstatement (LAPSED) uses strict_ok with the HSW threshold raised by 4
      and NEVER applies carry.
    input_set: "CEEntry rows of the certificate with voided == false; certificate period bounds; home Jurisdiction.ce_carry_over_allowed (live read at renew time)"
    constants:
      ce_renewal_period_months: 24
      ce_carry_over_max_hours: 12
      renewal_open_days: 60
      lapsed_reinstatement_window_months: 12
      reinstatement_penalty_hsw_hours: 4
      max_ce_entry_hours: 24
    precision: "integer hours; >= boundary inclusive"
    variants:
      - name: period_strict
        when: "certificate's home Jurisdiction.ce_carry_over_allowed == false at renew time"
        difference: "only current-period hours count; identical entry history yields ERR_CE_HOURS_INSUFFICIENT where the carry-over variant succeeds"
      - name: carry_over
        when: "ce_carry_over_allowed == true at renew time"
        difference: "adds min(previous-period excess, 12) to current-period total"
  - name: certificate_eligibility
    trigger: "recomputed after every transition that changes an input (education review, report verify, report-score, supplemental result, expiry sweep, disciplinary sanction)"
    algorithm: constraint_propagation
    formula: |
      eligible = candidate.education_status == SATISFIED
                 AND candidate.experience_status == COMPLETE
                 AND all six ExamDivisionProgress rows have status == PASSED
                 AND (home_jurisdiction.requires_supplemental_exam == false
                      OR exists SupplementalExam of candidate for home jurisdiction with status == PASSED)
                 AND candidate.record_standing == CLEAR
      Result persisted on candidate.certificate_eligible.
    input_set: "Candidate sub-statuses, ExamDivisionProgress, SupplementalExam, home Jurisdiction flags"
    constants: {}
    precision: "boolean"

# ---------------------------------------------------------------------------
# 1.4 Validation Rules Table (ordered by priority; first failure wins)
# ---------------------------------------------------------------------------
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present; role is a declared role", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all endpoints" }
  - { priority: 2, category: auth, check: "caller role is in the endpoint's roles list", error_id: ERR_UNAUTHORIZED, http_status: 403, applies_to: "all endpoints" }
  - { priority: 2, category: auth, check: "ownership: Candidate callers act only on their own resources (X-User-ID == candidate id in path, or resource.candidate_id); Supervisor verify/return requires X-User-ID == report.supervisor_id", error_id: ERR_UNAUTHORIZED, http_status: 403, applies_to: "candidate-scoped and supervisor-scoped endpoints" }
  - { priority: 3, category: existence, check: "path parameters resolve to existing resources, left to right", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all endpoints with path ids" }
  - { priority: 3, category: existence, check: "body references resolve: supervisor_id, candidate_id, new_supervisor_id", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "POST /experience-reports, POST /experience-reports/{id}/reassign, POST /disciplinary-reports" }
  - { priority: 3, category: business_referential, check: "jurisdiction_code values resolve to an existing Jurisdiction.code", error_id: ERR_JURISDICTION_UNKNOWN, http_status: 422, applies_to: "endpoints taking jurisdiction_code or home_jurisdiction_code" }
  - { priority: 4, category: state, check: "target resource state permits the transition (per state machine); generic rejection for any from-state not listing the trigger", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all action endpoints" }
  - { priority: 4, category: state, check: "scheduling a division whose status is PASSED", error_id: ERR_DIVISION_ALREADY_PASSED, http_status: 409, applies_to: "POST /exam-progress/{id}/schedule" }
  - { priority: 4, category: state, check: "scheduling a division whose status is SCHEDULED", error_id: ERR_DIVISION_ALREADY_SCHEDULED, http_status: 409, applies_to: "POST /exam-progress/{id}/schedule" }
  - { priority: 4, category: state, check: "certificate issuance when a non-REVOKED certificate already exists for the candidate", error_id: ERR_CERTIFICATE_EXISTS, http_status: 409, applies_to: "POST /candidates/{id}/certificate" }
  - { priority: 4, category: state, check: "creating an education evaluation while another evaluation of the candidate is SUBMITTED (only one open evaluation)", error_id: ERR_EVALUATION_ALREADY_OPEN, http_status: 409, applies_to: "POST /candidates/{id}/education-evaluations" }
  - { priority: 4, category: state, check: "transmittal or certificate issuance against a certificate/candidate requiring certificate ACTIVE or eligibility", error_id: ERR_CERTIFICATE_NOT_ACTIVE, http_status: 409, applies_to: "POST /certificates/{id}/transmittals" }
  - { priority: 4, category: state, check: "OCC: expected_<parent>_version must equal stored parent version on PATCH endpoints", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "PATCH /jurisdictions/{id}, PATCH /supervisors/{id}" }
  - { priority: 5, category: business_safety, check: "no OPEN DisciplinaryReport exists for the candidate when transmitting a certificate or issuing one", error_id: ERR_OPEN_DISCIPLINARY_BLOCK, http_status: 409, applies_to: "POST /certificates/{id}/transmittals, POST /candidates/{id}/certificate" }
  - { priority: 5, category: business_safety, check: "disciplinary resolver identity differs from filed_by_user_id (segregation of duties)", error_id: ERR_SEGREGATION_OF_DUTIES, http_status: 403, applies_to: "POST /disciplinary-reports/{id}/resolve" }
  - { priority: 5, category: business_safety, check: "certificate issuance requires candidate.certificate_eligible == true", error_id: ERR_ELIGIBILITY_NOT_MET, http_status: 409, applies_to: "POST /candidates/{id}/certificate" }
  - { priority: 6, category: business_referential, check: "report submit and verify require the assigned Supervisor.license_status == ACTIVE", error_id: ERR_SUPERVISOR_NOT_ACTIVE, http_status: 422, applies_to: "POST /experience-reports/{id}/submit, POST /experience-reports/{id}/verify" }
  - { priority: 6, category: business_referential, check: "verify/return caller must be the report's assigned supervisor", error_id: ERR_SUPERVISOR_MISMATCH, http_status: 403, applies_to: "POST /experience-reports/{id}/verify, POST /experience-reports/{id}/return" }
  - { priority: 6, category: business_referential, check: "supplemental exam registration only for a jurisdiction with requires_supplemental_exam == true", error_id: ERR_SUPPLEMENTAL_NOT_REQUIRED, http_status: 422, applies_to: "POST /candidates/{id}/supplemental-exams" }
  - { priority: 7, category: business_temporal, check: "experience older than the horizon: submitted date > work_period_end + 60 months", error_id: ERR_EXPERIENCE_TOO_OLD, http_status: 422, applies_to: "POST /experience-reports/{id}/submit" }
  - { priority: 7, category: business_temporal, check: "retake wait: from FAILED, scheduled_date >= last_failed_at + 60 days", error_id: ERR_RETAKE_WAIT_NOT_ELAPSED, http_status: 422, applies_to: "POST /exam-progress/{id}/schedule" }
  - { priority: 7, category: business_temporal, check: "attempt window: fewer than 3 attempts with date > scheduled_date - 365 days", error_id: ERR_ATTEMPT_LIMIT_EXCEEDED, http_status: 422, applies_to: "POST /exam-progress/{id}/schedule" }
  - { priority: 7, category: business_temporal, check: "scheduled_date/exam_date must be >= current date", error_id: ERR_SCHEDULE_DATE_PAST, http_status: 422, applies_to: "POST /exam-progress/{id}/schedule, POST /candidates/{id}/supplemental-exams" }
  - { priority: 7, category: business_temporal, check: "reassignment window: current date >= submitted date + 45 days", error_id: ERR_REASSIGN_WINDOW_NOT_OPEN, http_status: 422, applies_to: "POST /experience-reports/{id}/reassign" }
  - { priority: 7, category: business_temporal, check: "supplemental retake: new registration exam_date >= previous FAILED exam_date + 90 days", error_id: ERR_SUPPLEMENTAL_RETAKE_WAIT, http_status: 422, applies_to: "POST /candidates/{id}/supplemental-exams" }
  - { priority: 7, category: business_temporal, check: "renewal window: ACTIVE renewal requires period_end - 60 days <= current date < period_end", error_id: ERR_RENEWAL_WINDOW_NOT_OPEN, http_status: 422, applies_to: "POST /certificates/{id}/renew" }
  - { priority: 7, category: business_temporal, check: "reinstatement window: LAPSED renewal requires current date <= period_end + 12 months", error_id: ERR_REINSTATEMENT_WINDOW_CLOSED, http_status: 422, applies_to: "POST /certificates/{id}/renew" }
  - { priority: 7, category: business_temporal, check: "CE entry completed_date must be <= current date", error_id: ERR_CE_ENTRY_INVALID, http_status: 422, applies_to: "POST /certificates/{id}/ce-entries" }
  - { priority: 8, category: business_constraint, check: "required fields present, enums valid, ranges respected (hours 1..2000, CE hours 1..24, scaled_score 0..100, ALTERNATIVE_PATH semester_credit_hours >= 64, DEFICIENT review requires deficiency_notes, DENY requires denial_reason)", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all mutating endpoints" }
  - { priority: 8, category: business_constraint, check: "work_period_end > work_period_start", error_id: ERR_WORK_PERIOD_INVALID, http_status: 422, applies_to: "POST /experience-reports" }
  - { priority: 8, category: business_constraint, check: "hours outside 1..2000", error_id: ERR_HOURS_OUT_OF_RANGE, http_status: 422, applies_to: "POST /experience-reports" }
  - { priority: 8, category: business_constraint, check: "work period [start, end) must not overlap any SUBMITTED or VERIFIED report of the same candidate; adjacency (end == start) is allowed", error_id: ERR_WORK_PERIOD_OVERLAP, http_status: 409, applies_to: "POST /experience-reports/{id}/submit" }
  - { priority: 8, category: business_constraint, check: "exam calendar day conflict: no other SCHEDULED division or REGISTERED supplemental exam of the candidate on the same calendar date", error_id: ERR_EXAM_DAY_CONFLICT, http_status: 409, applies_to: "POST /exam-progress/{id}/schedule, POST /candidates/{id}/supplemental-exams" }
  - { priority: 8, category: business_constraint, check: "jurisdiction code uniqueness", error_id: ERR_JURISDICTION_CODE_EXISTS, http_status: 409, applies_to: "POST /jurisdictions" }
  - { priority: 8, category: business_constraint, check: "no second REQUESTED transmittal of the same certificate to the same jurisdiction", error_id: ERR_TRANSMITTAL_DUPLICATE, http_status: 409, applies_to: "POST /certificates/{id}/transmittals" }
  - { priority: 8, category: business_constraint, check: "CE sufficiency per calculations.ce_period_compliance (variant selected by home jurisdiction's live ce_carry_over_allowed; reinstatement uses strict + 4 HSW penalty)", error_id: ERR_CE_HOURS_INSUFFICIENT, http_status: 422, applies_to: "POST /certificates/{id}/renew" }

# ---------------------------------------------------------------------------
# 1.5 API Endpoint Table (all paths under api_prefix /licensure)
# ---------------------------------------------------------------------------
endpoints:
  - method: POST
    path: "/licensure/_clock/set_current_utc"
    description: "Sets the logical clock used by every date/deadline rule. Server startup default (before any set call) is exactly 2026-09-01T00:00:00Z and never falls back to wall-clock time."
    roles: [NcarbAdministrator]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: [no entity mutations; only the logical clock advances]
  - method: POST
    path: "/licensure/_maintenance/run_expiry_sweep"
    description: "Ops-run checkpoint: applies time-based transitions at the current logical clock - PASSED exam divisions with expires_at <= today become EXPIRED (rolling clock), ACTIVE certificates with period_end <= today become LAPSED."
    roles: [NcarbAdministrator]
    code: 200
    input: []
    output: { expired_divisions: integer, lapsed_certificates: integer }
    side_effects: [ExamDivisionProgress PASSED->EXPIRED cascades, Certificate ACTIVE->LAPSED]
  - method: POST
    path: "/licensure/candidates"
    description: "Register a candidate record. Client-sent id/created_at/version are ignored."
    roles: [Anonymous]
    code: 201
    input: [email, full_name, password, home_jurisdiction_code]
    output: Candidate
    side_effects: [sub-status defaults NONE/NOT_STARTED/NOT_AUTHORIZED/CLEAR, certificate_eligible=false]
  - method: GET
    path: "/licensure/candidates/{id}"
    description: "Read one candidate including sub-statuses."
    roles: [Candidate, NcarbAdministrator, BoardAdministrator]
    code: 200
    input: []
    output: Candidate
    side_effects: []
  - method: GET
    path: "/licensure/candidates/{id}/summary"
    description: "Computed progress read: education/experience/exam status, per-area credited sums, locked vs projected credited hours, eligibility, certificate status."
    roles: [Candidate, NcarbAdministrator, BoardAdministrator]
    code: 200
    input: []
    output: { candidate_id: string, education_status: string, experience_status: string, exam_status: string, record_standing: string, certificate_eligible: boolean, total_credited_hours: integer, locked_credited_hours: integer, projected_credited_hours: integer, area_progress: object, certificate_status: string, open_disciplinary_count: integer }
    side_effects: []
  - method: POST
    path: "/licensure/jurisdictions"
    description: "Create a jurisdiction board with national-standard overrides."
    roles: [NcarbAdministrator]
    code: 201
    input: [code, name, "requires_supplemental_exam?", "min_total_experience_hours?", "ce_hours_required?", "ce_hsw_hours_required?", "ce_carry_over_allowed?"]
    output: Jurisdiction
    side_effects: []
  - method: PATCH
    path: "/licensure/jurisdictions/{id}"
    description: "Update jurisdiction flags/overrides. OCC-guarded via expected_jurisdiction_version. Live ce_carry_over_allowed is read at each certificate renewal."
    roles: [NcarbAdministrator]
    code: 200
    input: [expected_jurisdiction_version, "name?", "requires_supplemental_exam?", "min_total_experience_hours?", "ce_hours_required?", "ce_hsw_hours_required?", "ce_carry_over_allowed?"]
    output: Jurisdiction
    side_effects: [increments Jurisdiction.version by 1]
  - method: POST
    path: "/licensure/supervisors"
    description: "Register a supervising architect."
    roles: [NcarbAdministrator]
    code: 201
    input: [full_name, license_number, jurisdiction_code]
    output: Supervisor
    side_effects: []
  - method: PATCH
    path: "/licensure/supervisors/{id}"
    description: "Update supervisor license data (e.g. license_status ACTIVE<->INACTIVE). OCC-guarded via expected_supervisor_version."
    roles: [NcarbAdministrator]
    code: 200
    input: [expected_supervisor_version, "full_name?", "license_status?", "jurisdiction_code?"]
    output: Supervisor
    side_effects: [increments Supervisor.version by 1]
  - method: POST
    path: "/licensure/candidates/{id}/education-evaluations"
    description: "Submit an education evaluation (accredited degree or alternative path). Only one SUBMITTED evaluation per candidate."
    roles: [Candidate]
    code: 201
    input: [path_type, institution_name, semester_credit_hours]
    output: EducationEvaluation
    side_effects: [status SUBMITTED]
  - method: GET
    path: "/licensure/candidates/{id}/education-evaluations"
    description: "List a candidate's education evaluations."
    roles: [Candidate, NcarbAdministrator]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: EducationEvaluation[]
    side_effects: []
  - method: POST
    path: "/licensure/education-evaluations/{id}/review"
    description: "Adjudicate an evaluation. DEFICIENT requires deficiency_notes."
    roles: [NcarbAdministrator]
    code: 200
    input: [decision, "deficiency_notes?"]
    output: EducationEvaluation
    side_effects: [EducationEvaluation SUBMITTED->SATISFIED|DEFICIENT; on SATISFIED candidate.education_status := SATISFIED and eligibility recompute]
  - method: POST
    path: "/licensure/education-evaluations/{id}/resubmit"
    description: "Candidate resubmits a DEFICIENT evaluation after remediation (cyclic loop)."
    roles: [Candidate]
    code: 200
    input: ["path_type?", "institution_name?", "semester_credit_hours?"]
    output: EducationEvaluation
    side_effects: [EducationEvaluation DEFICIENT->SUBMITTED]
  - method: POST
    path: "/licensure/experience-reports"
    description: "Create a DRAFT experience report. Overlap and supervisor checks happen at submit, not here."
    roles: [Candidate]
    code: 201
    input: [candidate_id, supervisor_id, practice_area, hours, work_period_start, work_period_end, "work_setting?"]
    output: ExperienceReport
    side_effects: []
  - method: GET
    path: "/licensure/experience-reports/{id}"
    description: "Read one experience report including stamped credit fields."
    roles: [Candidate, Supervisor, NcarbAdministrator]
    code: 200
    input: []
    output: ExperienceReport
    side_effects: []
  - method: GET
    path: "/licensure/experience-reports"
    description: "Filtered list of experience reports (FK reverse lookup)."
    roles: [Candidate, Supervisor, NcarbAdministrator]
    code: 200
    input: ["candidate_id?", "supervisor_id?", "status?", "practice_area?", "limit?", "offset?"]
    output: ExperienceReport[]
    side_effects: []
  - method: POST
    path: "/licensure/experience-reports/{id}/submit"
    description: "Submit a DRAFT or RETURNED report; stamps submitted_at and locks credit_pct (100 within 8 months of work end, 50 within 60 months)."
    roles: [Candidate]
    code: 200
    input: []
    output: ExperienceReport
    side_effects: [ExperienceReport -> SUBMITTED with credit tier stamped]
  - method: POST
    path: "/licensure/experience-reports/{id}/verify"
    description: "Assigned supervisor verifies a SUBMITTED report; stamps credited_hours and drives completion cascade."
    roles: [Supervisor]
    code: 200
    input: []
    output: ExperienceReport
    side_effects: [ExperienceReport SUBMITTED->VERIFIED, credited_hours stamped, candidate.experience_status recompute, certificate_eligible recompute]
  - method: POST
    path: "/licensure/experience-reports/{id}/return"
    description: "Assigned supervisor returns a SUBMITTED report for correction."
    roles: [Supervisor]
    code: 200
    input: [return_reason]
    output: ExperienceReport
    side_effects: [ExperienceReport SUBMITTED->RETURNED]
  - method: POST
    path: "/licensure/experience-reports/{id}/reassign"
    description: "Reassign an unanswered SUBMITTED report to a new supervisor after the 45-day window; locked tier is preserved."
    roles: [Candidate]
    code: 200
    input: [new_supervisor_id]
    output: ExperienceReport
    side_effects: [supervisor_id replaced; submitted_at and credit_pct unchanged]
  - method: POST
    path: "/licensure/candidates/{id}/exam-authorizations"
    description: "Board grants authorization to test; creates six ExamDivisionProgress rows (PCM, PJM, PA, PPD, PDD, CE), all ELIGIBLE."
    roles: [BoardAdministrator]
    code: 201
    input: [jurisdiction_code]
    output: ExamAuthorization
    side_effects: [candidate.exam_status NOT_AUTHORIZED->AUTHORIZED, six ExamDivisionProgress rows created]
  - method: GET
    path: "/licensure/candidates/{id}/exam-progress"
    description: "List the candidate's six division progress rows with status, dates, attempt history, scaled_score, ordered by division_code ascending (CE, PA, PCM, PDD, PJM, PPD). Item-level exam content is never exposed."
    roles: [Candidate, BoardAdministrator, NcarbAdministrator]
    code: 200
    input: ["division_code?", "status?"]
    output: ExamDivisionProgress[]
    side_effects: []
  - method: POST
    path: "/licensure/exam-progress/{id}/schedule"
    description: "Schedule a sitting from ELIGIBLE, FAILED (60-day retake wait), or EXPIRED. Enforces attempt window (3 per 365 days) and exam-day conflict."
    roles: [Candidate]
    code: 200
    input: [scheduled_date]
    output: ExamDivisionProgress
    side_effects: [ExamDivisionProgress -> SCHEDULED]
  - method: POST
    path: "/licensure/exam-progress/{id}/report-score"
    description: "Report a scored result for a sitting whose date has arrived. PASS sets passed_at and the 60-month rolling-clock expiry; FAIL starts the retake wait."
    roles: [NcarbAdministrator]
    code: 200
    input: [result, scaled_score]
    output: ExamDivisionProgress
    side_effects: [SCHEDULED->PASSED|FAILED, attempt history append, possible exam_status ALL_PASSED + eligibility recompute]
  - method: POST
    path: "/licensure/candidates/{id}/supplemental-exams"
    description: "Register for a jurisdiction's supplemental exam (only when that board requires one). Retakes require exam_date >= previous exam_date + 90 days."
    roles: [Candidate]
    code: 201
    input: [jurisdiction_code, exam_date]
    output: SupplementalExam
    side_effects: [SupplementalExam REGISTERED]
  - method: GET
    path: "/licensure/candidates/{id}/supplemental-exams"
    description: "List a candidate's supplemental exam registrations."
    roles: [Candidate, BoardAdministrator, NcarbAdministrator]
    code: 200
    input: ["status?"]
    output: SupplementalExam[]
    side_effects: []
  - method: POST
    path: "/licensure/supplemental-exams/{id}/report-result"
    description: "Board reports PASS/FAIL for a registered supplemental exam."
    roles: [BoardAdministrator]
    code: 200
    input: [result]
    output: SupplementalExam
    side_effects: [REGISTERED->PASSED|FAILED; on PASS eligibility recompute]
  - method: POST
    path: "/licensure/candidates/{id}/certificate"
    description: "Issue the national certificate. Requires candidate.certificate_eligible == true and no OPEN disciplinary reports; snapshots home jurisdiction CE requirements."
    roles: [NcarbAdministrator]
    code: 201
    input: []
    output: Certificate
    side_effects: ["Certificate ACTIVE with period (today, today+24 months)"]
  - method: GET
    path: "/licensure/candidates/{id}/certificate"
    description: "Reverse lookup: the candidate's certificate history (array, length 0-1 while non-REVOKED). "
    roles: [Candidate, NcarbAdministrator, BoardAdministrator]
    code: 200
    input: []
    output: Certificate[]
    side_effects: []
  - method: GET
    path: "/licensure/certificates/{id}"
    description: "Read one certificate including computed CE period totals."
    roles: [Candidate, NcarbAdministrator, BoardAdministrator]
    code: 200
    input: []
    output: Certificate
    side_effects: []
  - method: POST
    path: "/licensure/certificates/{id}/renew"
    description: "Dual-mode: ACTIVE renews inside the window [period_end-60d, period_end); LAPSED reinstates within period_end+12mo with a +4 HSW penalty and strict CE accounting."
    roles: [Candidate]
    code: 200
    input: []
    output: Certificate
    side_effects: [period advance or reinstatement; renewal_count += 1]
  - method: POST
    path: "/licensure/certificates/{id}/ce-entries"
    description: "Log a continuing-education entry (allowed while ACTIVE or LAPSED)."
    roles: [Candidate]
    code: 201
    input: [hours, hsw, completed_date, provider]
    output: CEEntry
    side_effects: [recompute ce_hours_current_period, ce_hsw_current_period, lifetime_ce_hours]
  - method: GET
    path: "/licensure/certificates/{id}/ce-entries"
    description: "List CE entries of a certificate."
    roles: [Candidate, NcarbAdministrator]
    code: 200
    input: ["voided?", "limit?", "offset?"]
    output: CEEntry[]
    side_effects: []
  - method: POST
    path: "/licensure/ce-entries/{id}/void"
    description: "Void an erroneous CE entry; excluded from all totals afterwards."
    roles: [Candidate]
    code: 200
    input: []
    output: CEEntry
    side_effects: [voided := true; recompute CE totals]
  - method: POST
    path: "/licensure/certificates/{id}/transmittals"
    description: "Request transmittal of an ACTIVE certificate to a jurisdiction board for reciprocal licensure. Blocked by OPEN disciplinary reports."
    roles: [Candidate]
    code: 201
    input: [jurisdiction_code]
    output: Transmittal
    side_effects: [Transmittal REQUESTED]
  - method: GET
    path: "/licensure/certificates/{id}/transmittals"
    description: "List transmittals of a certificate."
    roles: [Candidate, BoardAdministrator, NcarbAdministrator]
    code: 200
    input: ["status?"]
    output: Transmittal[]
    side_effects: []
  - method: POST
    path: "/licensure/transmittals/{id}/decide"
    description: "Destination board grants or denies reciprocal licensure. DENY requires denial_reason."
    roles: [BoardAdministrator]
    code: 200
    input: [outcome, "denial_reason?"]
    output: Transmittal
    side_effects: [Transmittal REQUESTED->LICENSE_GRANTED|LICENSE_DENIED]
  - method: POST
    path: "/licensure/disciplinary-reports"
    description: "Board files a disciplinary report against a candidate; filed_by_user_id recorded from X-User-ID."
    roles: [BoardAdministrator]
    code: 201
    input: [candidate_id, jurisdiction_code, allegation]
    output: DisciplinaryReport
    side_effects: [DisciplinaryReport OPEN]
  - method: POST
    path: "/licensure/disciplinary-reports/{id}/resolve"
    description: "Council resolves a report. Resolver must differ from filer (segregation of duties). SANCTION fires the depth-3 cascade."
    roles: [NcarbAdministrator]
    code: 200
    input: [outcome, "resolution_notes?"]
    output: DisciplinaryReport
    side_effects: [OPEN->RESOLVED_CLEAR|RESOLVED_SANCTION; on SANCTION: candidate FLAGGED -> certificate REVOKED -> REQUESTED transmittals CANCELLED]
  - method: GET
    path: "/licensure/candidates/{id}/disciplinary-reports"
    description: "List disciplinary reports filed against a candidate."
    roles: [Candidate, BoardAdministrator, NcarbAdministrator]
    code: 200
    input: ["status?"]
    output: DisciplinaryReport[]
    side_effects: []

# ---------------------------------------------------------------------------
# 1.6 Error Code Catalog
# ---------------------------------------------------------------------------
errors:
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "missing required field, invalid enum, range violation, or conditional field absent (deficiency_notes on DEFICIENT, denial_reason on DENY)" }
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "missing or invalid X-User-Role / X-User-ID headers" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "role not permitted for endpoint, or caller does not own the target resource" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "path or body id reference does not resolve" }
  - { id: ERR_JURISDICTION_UNKNOWN, http: 422, condition: "jurisdiction_code does not match any Jurisdiction.code" }
  - { id: ERR_JURISDICTION_CODE_EXISTS, http: 409, condition: "jurisdiction code already registered" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "state machine rejects the trigger from the current state (generic)" }
  - { id: ERR_EVALUATION_ALREADY_OPEN, http: 409, condition: "candidate already has a SUBMITTED education evaluation" }
  - { id: ERR_ALTERNATIVE_CREDITS_INSUFFICIENT, http: 422, condition: "ALTERNATIVE_PATH evaluation with semester_credit_hours < 64" }
  - { id: ERR_WORK_PERIOD_INVALID, http: 422, condition: "work_period_end <= work_period_start" }
  - { id: ERR_HOURS_OUT_OF_RANGE, http: 422, condition: "report hours outside 1..2000" }
  - { id: ERR_WORK_PERIOD_OVERLAP, http: 409, condition: "work period [start, end) overlaps a SUBMITTED or VERIFIED report of the same candidate" }
  - { id: ERR_EXPERIENCE_TOO_OLD, http: 422, condition: "submit date > work_period_end + 60 calendar months" }
  - { id: ERR_SUPERVISOR_NOT_ACTIVE, http: 422, condition: "assigned supervisor license_status != ACTIVE at submit or verify" }
  - { id: ERR_SUPERVISOR_MISMATCH, http: 403, condition: "verify/return caller is not the report's assigned supervisor" }
  - { id: ERR_REASSIGN_WINDOW_NOT_OPEN, http: 422, condition: "reassign attempted before submitted date + 45 days, or new supervisor same/inactive" }
  - { id: ERR_DIVISION_ALREADY_PASSED, http: 409, condition: "schedule attempted on a PASSED division" }
  - { id: ERR_DIVISION_ALREADY_SCHEDULED, http: 409, condition: "schedule attempted on a SCHEDULED division" }
  - { id: ERR_RETAKE_WAIT_NOT_ELAPSED, http: 422, condition: "scheduled_date < last_failed_at + 60 days" }
  - { id: ERR_ATTEMPT_LIMIT_EXCEEDED, http: 422, condition: "3 scored attempts already fall within (scheduled_date - 365 days, scheduled_date]" }
  - { id: ERR_SCHEDULE_DATE_PAST, http: 422, condition: "scheduled_date or exam_date before current date" }
  - { id: ERR_EXAM_DAY_CONFLICT, http: 409, condition: "another SCHEDULED division or REGISTERED supplemental exam of the candidate occupies the same calendar day" }
  - { id: ERR_SUPPLEMENTAL_NOT_REQUIRED, http: 422, condition: "jurisdiction does not require a supplemental exam" }
  - { id: ERR_SUPPLEMENTAL_RETAKE_WAIT, http: 422, condition: "supplemental retake exam_date < previous FAILED exam_date + 90 days" }
  - { id: ERR_ELIGIBILITY_NOT_MET, http: 409, condition: "certificate issuance while candidate.certificate_eligible == false" }
  - { id: ERR_CERTIFICATE_EXISTS, http: 409, condition: "candidate already holds a non-REVOKED certificate" }
  - { id: ERR_CERTIFICATE_NOT_ACTIVE, http: 409, condition: "operation requires certificate status ACTIVE (transmittal)" }
  - { id: ERR_RENEWAL_WINDOW_NOT_OPEN, http: 422, condition: "ACTIVE renewal outside [period_end - 60 days, period_end)" }
  - { id: ERR_REINSTATEMENT_WINDOW_CLOSED, http: 422, condition: "LAPSED renewal after period_end + 12 calendar months" }
  - { id: ERR_CE_HOURS_INSUFFICIENT, http: 422, condition: "CE totals below required thresholds for the applicable renewal variant" }
  - { id: ERR_CE_ENTRY_INVALID, http: 422, condition: "CE entry hours outside 1..24 or completed_date in the future" }
  - { id: ERR_OPEN_DISCIPLINARY_BLOCK, http: 409, condition: "OPEN disciplinary report blocks certificate issuance and transmittal" }
  - { id: ERR_TRANSMITTAL_DUPLICATE, http: 409, condition: "a REQUESTED transmittal to the same jurisdiction already exists for this certificate" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "disciplinary resolver X-User-ID equals filed_by_user_id" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match stored version (OCC)" }

# ---------------------------------------------------------------------------
# 1.7 RBAC Matrix
# ---------------------------------------------------------------------------
roles:
  - name: Anonymous
    description: "unauthenticated registrant"
    identity: opaque
    exclusive_operations: ["POST /licensure/candidates"]
    shared_operations: []
  - name: Candidate
    description: "licensure candidate acting on their own record (X-User-ID == Candidate.id)"
    identity: "entity_backed:Candidate"
    exclusive_operations:
      - "POST /licensure/candidates/{id}/education-evaluations, POST /licensure/education-evaluations/{id}/resubmit"
      - "POST /licensure/experience-reports, POST /licensure/experience-reports/{id}/submit, /reassign"
      - "POST /licensure/exam-progress/{id}/schedule"
      - "POST /licensure/candidates/{id}/supplemental-exams"
      - "POST /licensure/certificates/{id}/renew, /ce-entries, /transmittals, POST /licensure/ce-entries/{id}/void"
    shared_operations: ["GET reads of own candidates/experience-reports/exam-progress/education-evaluations/supplemental-exams/certificate/ce-entries/transmittals/disciplinary-reports/summary"]
  - name: Supervisor
    description: "licensed architect verifying experience reports assigned to them (X-User-ID == Supervisor.id == report.supervisor_id)"
    identity: "entity_backed:Supervisor"
    exclusive_operations: ["POST /licensure/experience-reports/{id}/verify", "POST /licensure/experience-reports/{id}/return"]
    shared_operations: ["GET /licensure/experience-reports, GET /licensure/experience-reports/{id}"]
  - name: BoardAdministrator
    description: "state/jurisdiction board staff; grants exam authorizations, reports supplemental results, decides transmittals, files disciplinary reports"
    identity: opaque
    exclusive_operations:
      - "POST /licensure/candidates/{id}/exam-authorizations"
      - "POST /licensure/supplemental-exams/{id}/report-result"
      - "POST /licensure/transmittals/{id}/decide"
      - "POST /licensure/disciplinary-reports"
    shared_operations: ["GET reads of candidates, exam-progress, supplemental-exams, certificates, transmittals, disciplinary-reports, summaries"]
  - name: NcarbAdministrator
    description: "national council staff; operates clock/sweep, jurisdictions, supervisors, education review, exam scoring, certificate issuance, disciplinary resolution"
    identity: opaque
    exclusive_operations:
      - "POST /licensure/_clock/set_current_utc, POST /licensure/_maintenance/run_expiry_sweep"
      - "POST /licensure/jurisdictions, PATCH /licensure/jurisdictions/{id}"
      - "POST /licensure/supervisors, PATCH /licensure/supervisors/{id}"
      - "POST /licensure/education-evaluations/{id}/review"
      - "POST /licensure/exam-progress/{id}/report-score"
      - "POST /licensure/candidates/{id}/certificate"
      - "POST /licensure/disciplinary-reports/{id}/resolve"
    shared_operations: ["GET reads across the surface"]
