        distinguishing_aspect: "A four-hop chain over four DIFFERENT entities, where each hop exists only because the previous one fired. Hop 1 is the TestOrder entering REPORTED_FAIL; hop 2 is the Product leaving CERTIFIED for SUSPENDED, which can only happen because a failing order exists; hop 3 is the ISSUED certificate being WITHDRAWN, which is keyed on the product having left CERTIFIED; hop 4 is the RELEASED batch being pulled to STOP_DISTRIBUTION, which is keyed on the certificate no longer being ISSUED. Removing any single intermediate hop leaves the last hop unexplained. The trigger is a laboratory reporting a measurement above a limit. This is a distribution-side cascade driven by a test result."
