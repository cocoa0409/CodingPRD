  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_finalize_with_stale_version_after_cancel_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[milk-check-finalize-stale]
          - errors[ERR_STALE_MILK_CHECK_VERSION]
        distinguishing_aspect: "Create check (version 1) -> cancel with expected version 1 (succeeds, version -> 2) -> finalize still carrying the now-stale version 1 => ERR_STALE_MILK_CHECK_VERSION (412). OCC (priority 4) fires before the state check."
        test_recipe:
          setup:
            - "A PROVISIONAL MilkCheck at version 1, then CANCELLED (version 2); a finalize replays the stale version-1 token."
          setup_api_calls:
            - call: "POST /herds"
              payload: { name: "OCC Dairy", federal_order_number: "30" }
              as: HerdManager
              captures: { h_id: $.data.id }
            - call: "POST /herds/coop-price-sheets"
              payload: { herd_id: "${h_id}", settlement_month: "2026-06", fat_price_per_lb: 2.805, protein_price_per_lb: 3.515, other_solids_price_per_lb: 0.405, ppd_per_cwt: 1.205, advance_rate_per_cwt: 16.00 }
              as: CoopSettlementAgent
              captures: { ps_id: $.data.id }
            - call: "POST /herds/milk-checks"
              payload: { herd_id: "${h_id}", price_sheet_id: "${ps_id}" }
              as: CoopSettlementAgent
              captures: { mc_id: $.data.id, mc_v0: $.data.version }
            - call: "POST /herds/milk-checks/${mc_id}/cancel"
              payload: { expected_milk_check_version: "${mc_v0}" }
              as: CoopSettlementAgent
          trigger:
            - call: "POST /herds/milk-checks/${mc_id}/finalize"
              payload: { expected_milk_check_version: "${mc_v0}" }
              as: CoopSettlementAgent
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 412"
            - "response.data.error_id == ERR_STALE_MILK_CHECK_VERSION"

      - name: cascade_calving_first_parity_opens_single_lactation
        claim_type: cascading_side_effects
        grounds:
          - state_machines.Animal.HEIFER_to_ACTIVE
          - entities.CalvingEvent.fields.opened_lactation_id
          - entities.CalvingEvent.fields.closed_lactation_id
          - entities.Herd.fields.active_animal_count
        distinguishing_aspect: "First calving of a HEIFER opens exactly one OPEN lactation (opened_lactation_id set, closed_lactation_id null) and lifts Herd.active_animal_count to 1."
        test_recipe:
          setup: ["A HEIFER with a CONFIRMED breeding event ready to calve (clock 2026-01-10)."]
          setup_api_calls:
            - call: "POST /herds/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-10T00:00:00Z" }
              as: HerdManager
