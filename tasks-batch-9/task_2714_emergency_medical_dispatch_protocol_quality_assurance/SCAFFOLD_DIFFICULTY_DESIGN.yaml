  - rule_id: combinatorial_formula
    instances:
      - name: section_rounding_before_weighting_changes_the_pre_penalty_score
        grounds:
          - calculations.review_composite_score
          - entities.ScoreSheet.fields.pre_arrival_pct
          - entities.Review.fields.pre_penalty_composite_score
          - calculations.determinant_accuracy_penalty
        distinguishing_aspect: |
          Multi-step rounding order: with sections 18/20, 26/30, 2/3 and 5/7 the pinned order
          (round each section to 2 dp, then weight, then round to 1 dp) gives
          pre_penalty_composite_score 79.1, whereas weighting the unrounded fractions and rounding
          once at the end gives 79.0 — a one-tick divergence that only the pinned order reproduces.
        test_recipe:
          setup:
            - "Program with target_compliance_pct 90.0, watch_floor_pct 80.0, hours_owed_restriction_threshold 6.0."
            - "APPROVED protocol version with weights 0.20 / 0.35 / 0.30 / 0.15."
            - "One dispatcher, one CHEST_PAIN call dispatched 10-C-4, targeted into an OPEN period."
            - "Sheet scored 18/20 case entry, 26/30 key questions, 2/3 pre-arrival, 5/7 final coding, reviewer code 10-C-2 (same level C, so identical response mode and resource)."
          setup_api_calls:
            - call: "POST /audit-programs"
              payload: { name: "Harbor EMD QA", accreditation_body: "IAED", target_compliance_pct: 90.0, watch_floor_pct: 80.0, high_risk_target_pct: 85.0, hours_owed_restriction_threshold: 6.0 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { prog_id: $.data.id }
            - call: "POST /audit-programs/${prog_id}/protocol-versions"
              payload: { protocol_family: "MPDS_CARDSET", version_label: "MPDS-13.0", effective_from: "2026-07-01T00:00:00Z", case_entry_weight: 0.2000, key_questions_weight: 0.3500, pre_arrival_weight: 0.3000, final_coding_weight: 0.1500 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { pv_id: $.data.id }
            - call: "POST /protocol-versions/${pv_id}/approve"
              payload: { approval_note: "adopted" }
              as: MedicalDirector
              as_user_id: "dir-1"
            - call: "POST /dispatchers"
              payload: { program_id: "${prog_id}", employee_code: "EMD-301", full_name: "Casey Lund" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { d1_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-20T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /dispatchers/${d1_id}/call-records"
              payload: { call_reference: "C-3001", call_type: "CHEST_PAIN", received_at: "2026-08-05T09:00:00Z", dispatched_determinant_code: "10-C-4" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { c1_id: $.data.id }
            - call: "POST /audit-programs/${prog_id}/sampling-periods"
              payload: { call_type: "CHEST_PAIN", period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z", sampling_mode: "MIXED", target_sample_count: 1 }
              as: QaSupervisor
              as_user_id: "sup-1"
              captures: { sp_id: $.data.id }
            - call: "POST /sampling-periods/${sp_id}/target-review"
              payload: { call_record_id: "${c1_id}", selection_reason: "COMPLAINT" }
              as: QaSupervisor
              as_user_id: "sup-1"
              captures: { r1_id: $.data.id, r1_v: $.data.version }
            - call: "POST /reviews/${r1_id}/scores"
              payload: { expected_review_version: "${r1_v}", case_entry_points_earned: 18, case_entry_points_possible: 20, key_questions_points_earned: 26, key_questions_points_possible: 30, pre_arrival_points_earned: 2, pre_arrival_points_possible: 3, final_coding_points_earned: 5, final_coding_points_possible: 7, reviewer_determinant_code: "10-C-2" }
              as: QaReviewer
              as_user_id: "rev-1"
              captures: { sheet_id: $.data.id }
          trigger:
            - call: "POST /reviews/${r1_id}/finalize"
              payload: { finalization_note: "concur" }
              as: QaSupervisor
              as_user_id: "sup-1"
          assert:
            - "ScoreSheet.${sheet_id}.case_entry_pct == 90.00"
            - "ScoreSheet.${sheet_id}.key_questions_pct == 86.67"
            - "ScoreSheet.${sheet_id}.pre_arrival_pct == 66.67"
            - "ScoreSheet.${sheet_id}.final_coding_pct == 71.43"
            - "Review.${r1_id}.provisional_composite_score == 78.7"
            - "Review.${r1_id}.pre_penalty_composite_score == 79.1"
            - "Review.${r1_id}.determinant_accuracy == MINOR_MISCODE"
            - "Review.${r1_id}.penalty_points == 2.0"
            - "Review.${r1_id}.final_composite_score == 77.1"
            - "Dispatcher.${d1_id}.compliance_pct == 77.1"
            - "Dispatcher.${d1_id}.compliance_posture == PROBATION"
            - "Dispatcher.${d1_id}.remediation_hours_owed == 4.00"
            - "Dispatcher.${d1_id}.dispatch_privilege == FULL"

      - name: penalty_tier_selected_from_pre_penalty_not_post_penalty_score
        grounds:
          - calculations.determinant_accuracy_penalty
          - calculations.determinant_accuracy_classification
          - entities.Review.fields.penalty_points
          - entities.Review.fields.final_composite_score
        distinguishing_aspect: |
          Order-of-evaluation coupling: a sheet worth pre_penalty 90.0 with an UNDER_TRIAGE code
          lands in tier HIGH (multiplier 1.5), so penalty_points == 15.0 and
          final_composite_score == 75.0; selecting the tier from the post-penalty score instead
          would place it in MID and yield penalty 10.0 with final 80.0.
        test_recipe:
          setup:
            - "Program with target_compliance_pct 90.0, watch_floor_pct 80.0, hours_owed_restriction_threshold 6.0."
            - "One dispatcher, one CHEST_PAIN call dispatched 10-C-4 (rank 4, COLD, ALS)."
            - "Sheet scores exactly 90.00 in all four sections; the reviewer determines the correct code was 10-E-1 (rank 6, HOT, ALS), i.e. the call was under-triaged."
          setup_api_calls:
            - call: "POST /audit-programs"
              payload: { name: "Ridge EMD QA", accreditation_body: "IAED", target_compliance_pct: 90.0, watch_floor_pct: 80.0, high_risk_target_pct: 85.0, hours_owed_restriction_threshold: 6.0 }
              as: ProgramAdmin
              as_user_id: "admin-1"
