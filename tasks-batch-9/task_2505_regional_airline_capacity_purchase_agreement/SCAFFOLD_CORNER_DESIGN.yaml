      - name: per_leg_rounding_precedes_summation
        claim_type: precision
        grounds:
          - calculations.variable_flight_payment
        excluded_because:
          difficulty_instance: combinatorial_formula / variable_payment_rounds_per_leg_then_sums
          rationale: "That §1.8 instance contrasts the pinned per-leg rounding total against the sum-then-round reading on three legs chosen so the two answers differ by cents."

      - name: completion_factor_tier_boundary
        claim_type: threshold
        grounds:
          - calculations.completion_factor
          - calculations.performance_incentive_penalty
        excluded_because:
          difficulty_instance: boundary_precision_check / completion_factor_epsilon_pair_at_99_00_on_cycle_close
          rationale: "That §1.8 instance runs the epsilon pair straddling CF_TIER_HIGH_PCT and asserts both the metric and the point swing on cycle close."

      - name: performance_points_weighting_and_forfeiture
        claim_type: weighted_scoring
        grounds:
          - calculations.performance_incentive_penalty
        excluded_because:
          difficulty_instance: combinatorial_formula / performance_points_forfeiture_then_penalty_cap
          rationale: "That §1.8 instance drives the forfeiture branch with mixed-sign raw points and then clips the negative gross against penalty_cap_usd."

      - name: admin_fee_waterfall_tier_selection
        claim_type: waterfall_allocation
        grounds:
          - calculations.passthrough_reconciliation_settlement
        excluded_because:
          difficulty_instance: combinatorial_formula / passthrough_admin_fee_tier_pinned_to_step2_base
          rationale: "That §1.8 instance pins the tier to the Step-2 base while the Step-5 total crosses the next boundary, which is the whole point of the waterfall."

      - name: staffing_change_propagates_to_fixed_point
        claim_type: constraint_propagation
        grounds:
          - calculations.pilot_staffing_shortfall
        excluded_because:
          difficulty_instance: transitive_cascade / pilot_attrition_three_hop_grounds_newest_tail
          rationale: "That §1.8 instance follows one pilot loss through the base counters to a grounded tail and asserts the propagation settles in a single pass."

      - name: invoice_variant_divergence_on_identical_data
        claim_type: variant_divergence
        grounds:
          - calculations.invoice_settlement.variants
          - calculations.variable_flight_payment.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / invoice_provisional_vs_final_component_divergence
          rationale: "That §1.8 instance issues both variants over the same cycle and asserts every diverging component plus the exact total delta."

      - name: staffing_variant_selection_by_basis
        claim_type: variant_selection
        grounds:
          - calculations.pilot_staffing_shortfall.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / crew_staffing_headcount_vs_pipeline_divergence
          rationale: "That §1.8 instance asserts HEADCOUNT_BASIS and PIPELINE_BASIS on identical crew data, including the ATTRITION_DISCOUNT floor that makes them disagree."

      - name: passthrough_delta_reconciled_into_ledger
        claim_type: reconciliation
        grounds:
          - calculations.passthrough_reconciliation_settlement
          - entities.ScheduleCycle.fields.passthrough_settlement_usd
        excluded_because:
          difficulty_instance: dual_variant_calc / invoice_provisional_vs_final_component_divergence
          rationale: "That §1.8 instance asserts the estimate-to-settlement swap on the pass-through component when the invoice basis switches from PROVISIONAL to FINAL."

  # ===========================================================================
  # Guide section 4 — Validations
  # ===========================================================================
  - section: validations
    instances:
      - name: duplicate_tail_number_in_same_agreement_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=44]
          - errors[ERR_DUPLICATE_RESOURCE]
          - endpoints[POST /cpa/aircraft]
        distinguishing_aspect: "Tail-number uniqueness is scoped to agreement_id, and the rejected registration leaves no partial row behind."
        test_recipe:
          setup:
            - "One DRAFT agreement with one CrewBase and one registered tail N4001RG."
          setup_api_calls:
            - call: "POST /cpa/agreements"
              payload: { mainline_partner_name: "Summit Air", regional_carrier_name: "Cascade Regional", fixed_monthly_fee_usd: 250000.00, block_hour_rate_usd: 1450.75, departure_rate_usd: 320.00, aircraft_ownership_fee_usd: 62000.00, incentive_pool_cap_usd: 90000.00, penalty_cap_usd: 120000.00, term_end_date: "2029-12-31" }
              as: CPAAdministrator
              captures: { ag: $.data.id }
            - call: "POST /cpa/crew-bases"
              payload: { agreement_id: "${ag}", station_code: "MKE", pilots_required_per_aircraft: 1, aircraft_allocation_cap: 2 }
              as: RegionalOpsController
              captures: { base: $.data.id }
            - call: "POST /cpa/aircraft"
              payload: { agreement_id: "${ag}", assigned_base_id: "${base}", tail_number: "N4001RG", seat_count: 76, ownership: "REGIONAL_OWNED" }
              as: RegionalOpsController
              captures: { ac1: $.data.id }
          trigger:
            - call: "POST /cpa/aircraft"
              payload: { agreement_id: "${ag}", assigned_base_id: "${base}", tail_number: "N4001RG", seat_count: 50, ownership: "MAINLINE_OWNED" }
              as: RegionalOpsController
          assert:
            - "HTTP 409 with data.error_id == \"ERR_DUPLICATE_RESOURCE\""
            - "GET /cpa/aircraft?agreement_id=${ag} returns total_count == 1 and data[0].seat_count == 76 — the first registration is untouched"

      - name: same_station_code_allowed_under_a_second_agreement
        claim_type: satisfaction_to_pass
        grounds:
          - validations[priority=44]
          - endpoints[POST /cpa/crew-bases]
        distinguishing_aspect: "The uniqueness scope is per agreement, not global: the identical station_code is accepted under a different agreement, which is the positive counterpart of the duplicate-resource rule."
        test_recipe:
          setup:
            - "Two DRAFT agreements; the first already has a CrewBase at station MKE."
          setup_api_calls:
            - call: "POST /cpa/agreements"
              payload: { mainline_partner_name: "Summit Air", regional_carrier_name: "Cascade Regional", fixed_monthly_fee_usd: 250000.00, block_hour_rate_usd: 1450.75, departure_rate_usd: 320.00, aircraft_ownership_fee_usd: 62000.00, incentive_pool_cap_usd: 90000.00, penalty_cap_usd: 120000.00, term_end_date: "2029-12-31" }
              as: CPAAdministrator
              captures: { ag1: $.data.id }
            - call: "POST /cpa/agreements"
              payload: { mainline_partner_name: "Beacon Airways", regional_carrier_name: "Cascade Regional", fixed_monthly_fee_usd: 180000.00, block_hour_rate_usd: 1310.00, departure_rate_usd: 295.00, aircraft_ownership_fee_usd: 54000.00, incentive_pool_cap_usd: 60000.00, penalty_cap_usd: 80000.00, term_end_date: "2030-06-30" }
              as: CPAAdministrator
              captures: { ag2: $.data.id }
            - call: "POST /cpa/crew-bases"
              payload: { agreement_id: "${ag1}", station_code: "MKE", pilots_required_per_aircraft: 1, aircraft_allocation_cap: 2 }
              as: RegionalOpsController
              captures: { base1: $.data.id }
          trigger:
            - call: "POST /cpa/crew-bases"
              payload: { agreement_id: "${ag2}", station_code: "MKE", pilots_required_per_aircraft: 2, aircraft_allocation_cap: 3 }
              as: RegionalOpsController
              captures: { base2: $.data.id }
          assert:
            - "HTTP 201 with data.station_code == \"MKE\", data.agreement_id == ${ag2}, data.lifecycle_status == \"ACTIVE\""
            - "GET /cpa/crew-bases?agreement_id=${ag1} returns total_count == 1 and GET /cpa/crew-bases?agreement_id=${ag2} returns total_count == 1"
            - "The two bases have different ids and independent pilots_required_per_aircraft values (1 and 2)"

      - name: duplicate_passthrough_category_rejected_unless_prior_claim_was_rejected
        claim_type: conditional_validation
        grounds:
          - validations[priority=42]
          - errors[ERR_DUPLICATE_PASSTHROUGH_CATEGORY]
          - state_machines.PassThroughClaim.ACTUAL_SUBMITTED_to_REJECTED
        distinguishing_aspect: "The per-cycle category lock is conditional on the incumbent claim's status: a live claim blocks the category, but once that claim is REJECTED the same category may be re-opened."
        test_recipe:
          setup:
            - "ACTIVE agreement with one base and an OPEN cycle 2026-09 (published_departures 0) holding one AIRPORT_FEES claim."
          setup_api_calls:
            - call: "POST /cpa/agreements"
              payload: { mainline_partner_name: "Summit Air", regional_carrier_name: "Cascade Regional", fixed_monthly_fee_usd: 250000.00, block_hour_rate_usd: 1450.75, departure_rate_usd: 320.00, aircraft_ownership_fee_usd: 62000.00, incentive_pool_cap_usd: 90000.00, penalty_cap_usd: 120000.00, term_end_date: "2029-12-31" }
              as: CPAAdministrator
              captures: { ag: $.data.id }
            - call: "POST /cpa/crew-bases"
              payload: { agreement_id: "${ag}", station_code: "MKE", pilots_required_per_aircraft: 1, aircraft_allocation_cap: 1 }
              as: RegionalOpsController
              captures: { base: $.data.id }
            - call: "POST /cpa/agreements/${ag}/activate"
              payload: {}
              as: CPAAdministrator
            - call: "POST /cpa/schedule-cycles"
              payload: { agreement_id: "${ag}", cycle_month: "2026-09", published_departures: 0 }
              as: MainlineScheduler
              captures: { cyc: $.data.id }
            - call: "POST /cpa/schedule-cycles/${cyc}/open"
              payload: {}
              as: MainlineScheduler
            - call: "POST /cpa/pass-through-claims"
              payload: { cycle_id: "${cyc}", category: "AIRPORT_FEES", estimated_amount_usd: 4000.00 }
              as: RegionalOpsController
              as_user_id: "ops-1"
              captures: { c1: $.data.id }
          trigger:
            - call: "POST /cpa/pass-through-claims"
              payload: { cycle_id: "${cyc}", category: "AIRPORT_FEES", estimated_amount_usd: 4500.00 }
              as: RegionalOpsController
              as_user_id: "ops-1"
            - call: "POST /cpa/pass-through-claims/${c1}/submit-actual"
              payload: { actual_amount_usd: 9000.00, supporting_doc_ref: "DOC-C1" }
              as: RegionalOpsController
              as_user_id: "ops-1"
            - call: "POST /cpa/pass-through-claims/${c1}/reconcile"
              payload: { decision: "REJECT" }
              as: CPAAdministrator
              as_user_id: "admin-1"
            - call: "POST /cpa/pass-through-claims"
              payload: { cycle_id: "${cyc}", category: "AIRPORT_FEES", estimated_amount_usd: 4500.00 }
              as: RegionalOpsController
              as_user_id: "ops-1"
          assert:
            - "The first duplicate attempt returns HTTP 409 with data.error_id == \"ERR_DUPLICATE_PASSTHROUGH_CATEGORY\""
            - "After ${c1} reaches status \"REJECTED\", the identical create returns HTTP 201 with data.category == \"AIRPORT_FEES\" and data.status == \"SUBMITTED\""
            - "GET /cpa/pass-through-claims?cycle_id=${cyc} returns total_count == 2 — one REJECTED and one SUBMITTED"
            - "ScheduleCycle.${cyc}.estimated_passthrough_total_usd == 4500.00 — only the live claim's estimate counts"

      - name: flight_leg_arrival_before_departure_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=50]
          - errors[ERR_INVALID_INTERVAL]
          - endpoints[POST /cpa/flight-legs]
        distinguishing_aspect: "Interval sanity is a 422 unprocessable-entity rather than a 400 malformed request, and it is checked before the turn-buffer and duty-cap rules at priorities 52 and 54."
        test_recipe:
          setup:
            - "ACTIVE agreement, one base, one LINE_QUALIFIED captain, one IN_SERVICE tail, OPEN cycle 2026-09 with published_departures 5 and no legs."
          setup_api_calls:
            - call: "POST /cpa/agreements"
              payload: { mainline_partner_name: "Summit Air", regional_carrier_name: "Cascade Regional", fixed_monthly_fee_usd: 250000.00, block_hour_rate_usd: 1450.75, departure_rate_usd: 320.00, aircraft_ownership_fee_usd: 62000.00, incentive_pool_cap_usd: 90000.00, penalty_cap_usd: 120000.00, term_end_date: "2029-12-31" }
              as: CPAAdministrator
              captures: { ag: $.data.id }
