scaffold_difficulty_design:

  # ============================================================
  # Rule 1: Dual-variant calculations across different entity domains
  # ============================================================
  - rule_id: dual_variant_calc
    instances:
      - name: rmd_uniform_vs_single_life_on_account
        grounds:
          - calculations.compute_rmd_amount
          - calculations.compute_rmd_amount.variants.uniform_lifetime
          - calculations.compute_rmd_amount.variants.single_life_expectancy
          - entities.Account.fields.prior_year_end_balance_cents
          - entities.Account.fields.inherited_from_participant_id
        distinguishing_aspect: |
          Same Account.prior_year_end_balance_cents and same calendar tax_year produce two
          different required_amount_cents values depending on whether the account is original-owner
          (Uniform Lifetime divisor 26.5 at age 73) or Inherited (Single Life divisor 36.2 at age 50).
          The two variants operate on the Account entity domain — its RMD calculation.
        test_recipe:
          setup:
            - "Create Participant P_owner born 1953-01-15 (age 73 in 2026); _clock at 2026-01-02"
            - "Create Account A_own (TRADITIONAL, participant=P_owner)"
            - "Force A_own.prior_year_end_balance_cents = 10000000 via /_clock/advance-year after seeding $100,000 of contributions in 2025"
            - "Create Participant P_bene born 1976-01-15 (age 50 in 2026)"
            - "Create Account A_inh (TRADITIONAL, participant=P_bene, inherited_from_participant_id=P_owner.id), seeding prior_year_end_balance_cents=10000000 identically"
          trigger:
            - "GET /accounts/{A_own.id}/rmd?tax_year=2026"
            - "GET /accounts/{A_inh.id}/rmd?tax_year=2026"
          assert:
            - "RMDQuote for A_own has required_amount_cents == 377358"
            - "RMDQuote for A_inh has required_amount_cents == 276243"
            - "A_own.required_amount_cents != A_inh.required_amount_cents proving dual-variant"

      - name: drawdown_provisional_vs_chronological_on_beneficiaryclaim
        grounds:
          - calculations.project_inherited_drawdown
          - calculations.project_inherited_drawdown.variants.provisional_forward_looking
          - calculations.project_inherited_drawdown.variants.final_chronological
          - entities.BeneficiaryClaim.fields.deadline_date
          - endpoints["GET /beneficiary-claims/{claim_id}/projection"]
        distinguishing_aspect: |
          The forward-looking projection holds prior_year_end_balance fixed and multiplies a
          single RMD figure by remaining_years, whereas the chronological realization (year-by-year
          /_clock/advance-year sweeps) recomputes the divisor and balance every year so the cumulative
          drawdown diverges. The two variants operate on the BeneficiaryClaim entity domain — a
          fundamentally different entity from the Account-level RMD dual-variant above.
        test_recipe:
          setup:
            - "Create P_bene (age 50, born 1976-01-15) and an Inherited Account A_inh with prior_year_end_balance_cents=10000000 at clock 2026-01-02"
            - "BeneficiaryClaim B was created with claim_date=2026-01-02, deadline_date=2036-01-02"
          trigger:
            - "GET /beneficiary-claims/{B.id}/projection?as_of_date=2029-01-02"
            - "Sequence: POST /accounts/{A_inh.id}/distributions with the RMD amount each year then POST /_clock/advance-year, repeat for years 2029..2035; sum cumulative drawn cents"
          assert:
            - "projection.remaining_years == 7"
            - "projection.projected_rmd_cents == 276243"
            - "projection.projected_total_drawdown_cents == 1933701"
            - "Sum of chronological RMD-coded DistributionEvent.gross_amount_cents across years 2029..2035 != 1933701 (because divisor and balance change each year)"

  # ============================================================
  # Rule 2: Combinatorial formulas across different modes
  # ============================================================
  - rule_id: combinatorial_formula
    instances:
      - name: cap_age_status_nonlinear_branch
        # Mode (a): >= 3 inputs with non-linear conditional branches.
        grounds:
          - calculations.compute_applicable_contribution_cap
          - validations[priority=15]
          - validations[priority=16]
          - entities.Participant.fields.date_of_birth
          - entities.ContributionEvent.fields.contribution_type
        distinguishing_aspect: |
          Mode (a): cap depends on three inputs — Participant.date_of_birth, clock_year, and
          ContributionEvent.contribution_type — with non-linear branching: at exactly age 50 on
          Dec 31, the cap jumps from 700000 to 800000 cents; CATCHUP type is independently rejected
          if age<50 (a different validation, not just a cap diff). The branch matrix is age{<50,
          >=50} × type{REGULAR, CATCHUP} producing four outcome pairs.
        test_recipe:
          setup:
            - "Participant P49 born 1977-12-31, clock 2026-12-30 (age 48 on clock day, 49 on Dec 31 of clock_year)"
            - "Account A under P49 (TRADITIONAL, OPEN)"
            - "Participant P50 born 1976-12-31 (age 50 on Dec 31 2026)"
            - "Account B under P50 (TRADITIONAL, OPEN)"
          trigger:
            - "POST /accounts/{A.id}/contributions amount=700001, type=REGULAR (cap=700000)"
            - "POST /accounts/{A.id}/contributions amount=100000, type=CATCHUP (age 49 < 50)"
            - "POST /accounts/{B.id}/contributions amount=800000, type=CATCHUP"
          assert:
            - "First call returns 422 ERR_CONTRIBUTION_CAP_EXCEEDED (700001 > 700000)"
            - "Second call returns 422 ERR_CATCHUP_AGE_INELIGIBLE (priority 16 wins because cap with catchup would have been 700000 + 100000 = 800000 fine, but eligibility fails first)"
            - "Third call succeeds with 201 and B.ytd_contribution_cents == 800000"

      - name: rmd_then_withholding_nested_rounding_order
        # Mode (b): nested rounding order matters.
        grounds:
          - calculations.compute_rmd_amount
          - calculations.compute_federal_withholding
          - endpoints["POST /accounts/{account_id}/distributions"]
        distinguishing_aspect: |
          Mode (b): the system performs nested rounding — first round_half_up on
          compute_rmd_amount (10000000/26.5 = 377358.49 -> 377358 cents), then round_half_up on
          compute_federal_withholding (377358 * 0.10 = 37735.8 -> 37736 cents). If a naive
          implementation rounded the unrounded RMD (377358.49 * 0.10 = 37735.849 -> 37736 same
          result by luck) and then debited the unrounded 377358.49 it would produce 339622.64 net,
          but the scaffold pins integer-cents arithmetic on the rounded RMD, yielding net 339622.
          The order — round RMD first, then withholding — is fixed.
        test_recipe:
          setup:
            - "Same P_owner/A_own setup as rmd_uniform_vs_single_life_on_account, age 73, prior_year_end_balance_cents=10000000, clock 2026-02-01"
          trigger:
            - "GET /accounts/{A_own.id}/rmd?tax_year=2026"
            - "POST /accounts/{A_own.id}/distributions gross_amount_cents=377358, distribution_reason=RMD"
          assert:
            - "RMDQuote.required_amount_cents == 377358"
            - "DistributionEvent.federal_withholding_cents == 37736"
            - "DistributionEvent.net_amount_cents == 339622"
            - "A_own.balance_cents decreased by exactly 377358 (gross), not by 377358.49"

  # ============================================================
  # Rule 3: Non-linear state-machine shape on different entities
  # ============================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: conversion_request_fork_join_branching
        grounds:
          - state_machines.ConversionRequest
          - state_machines.ConversionRequest.PENDING_to_APPROVED
          - state_machines.ConversionRequest.PENDING_to_REJECTED
          - state_machines.ConversionRequest.PENDING_to_CANCELED
          - state_machines.ConversionRequest.APPROVED_to_COMPLETED
        distinguishing_aspect: |
          ConversionRequest is a branching (fork) state machine: PENDING forks into three mutually
          exclusive terminal-or-intermediate destinations {APPROVED, REJECTED, CANCELED}, and only
          the APPROVED branch may join to COMPLETED. The set of valid next-states from PENDING is
          three, not one — non-linear branching on the ConversionRequest entity.
        test_recipe:
          setup:
            - "Three ConversionRequest rows CR_a, CR_b, CR_c all PENDING from the same Participant"
          trigger:
            - "POST /conversion-requests/{CR_a.id}/approve (then POST /conversion-requests/{CR_a.id}/complete)"
            - "POST /conversion-requests/{CR_b.id}/reject"
            - "POST /conversion-requests/{CR_c.id}/cancel (acting as Participant)"
          assert:
            - "CR_a.status == COMPLETED"
            - "CR_b.status == REJECTED"
            - "CR_c.status == CANCELED"
            - "All three originated from the same PENDING fork demonstrating branching shape"

      - name: beneficiary_claim_cycle_claimed_suspended
        grounds:
          - state_machines.BeneficiaryClaim
          - state_machines.BeneficiaryClaim.CLAIMED_to_SUSPENDED
          - state_machines.BeneficiaryClaim.SUSPENDED_to_CLAIMED
        distinguishing_aspect: |
          BeneficiaryClaim has a CLAIMED <-> SUSPENDED cycle: a claim can be suspended by Compliance
          and then resumed back to CLAIMED, and the cycle can repeat indefinitely as long as
          current_date <= deadline_date. This is a cycle on a different entity (BeneficiaryClaim)
          than the ConversionRequest branching above.
        test_recipe:
          setup:
            - "Inherited Account A_inh with BeneficiaryClaim B in status=CLAIMED"
            - "Clock at 2027-03-01, deadline_date=2036-01-02"
          trigger:
            - "POST /beneficiary-claims/{B.id}/suspend"
            - "POST /beneficiary-claims/{B.id}/resume"
            - "POST /beneficiary-claims/{B.id}/suspend"
            - "POST /beneficiary-claims/{B.id}/resume"
          assert:
            - "After first suspend: B.status == SUSPENDED"
            - "After first resume: B.status == CLAIMED"
            - "After second suspend: B.status == SUSPENDED"
            - "After second resume: B.status == CLAIMED, B.version incremented by 4 from baseline"

  # ============================================================
  # Rule 4: Transitive cascade chains from different triggers
  # ============================================================
  - rule_id: transitive_cascade
    instances:
      - name: decease_cascade_three_links
        # depth 3, trigger = POST /participants/{id}/decease
        grounds:
          - state_machines.Account.OPEN_to_FROZEN  # via decease cascade
          - state_machines.ConversionRequest.PENDING_to_CANCELED
          - state_machines.Form1099R
          - endpoints["POST /participants/{participant_id}/decease"]
        distinguishing_aspect: |
          Triggering POST /participants/{id}/decease causes a 3-link transitive chain:
          (Link 1) Participant.is_deceased flips true; (Link 2) caused by Link 1's flag flip,
          every owned Account auto-transitions OPEN->FROZEN; (Link 3) caused by Link 2's Account
          FROZEN posture, every PENDING ConversionRequest referencing those accounts auto-cancels;
          each link is caused by the previous link's state mutation, not by the original action.
        test_recipe:
          setup:
            - "Participant P (alive) with two OPEN Accounts A1, A2"
            - "Three PENDING ConversionRequests CR1 (source=A1), CR2 (source=A2), CR3 (source=A1)"
          trigger:
            - "POST /participants/{P.id}/decease date_of_death=clock_date"
          assert:
            - "P.is_deceased == true (Link 1)"
            - "A1.status == FROZEN AND A2.status == FROZEN (Link 2, caused by Link 1)"
            - "CR1.status == CANCELED AND CR2.status == CANCELED AND CR3.status == CANCELED (Link 3, caused by Link 2)"

      - name: conversion_complete_cascade_three_links
        # depth 3, trigger = POST /conversion-requests/{id}/complete
        grounds:
          - state_machines.ConversionRequest.APPROVED_to_COMPLETED
          - entities.DistributionEvent
          - entities.Form1099R
        distinguishing_aspect: |
          Triggering POST /conversion-requests/{id}/complete causes a 3-link transitive chain
          originating from a different transition than decease above: (Link 1) ConversionRequest
          flips APPROVED->COMPLETED; (Link 2) caused by Link 1, a DistributionEvent is created
          and the ledger move debits source.balance_cents AND credits destination.balance_cents;
          (Link 3) caused by Link 2's DistributionEvent, a Form1099R is auto-issued with
          box7_distribution_code=G referencing that DistributionEvent.id.
        test_recipe:
          setup:
            - "Participant P with TRADITIONAL Account A_trad (balance 700000) and ROTH Account A_roth (balance 0)"
            - "ConversionRequest CR (source=A_trad, destination=A_roth, amount=700000, backdoor_flag=false), already APPROVED"
          trigger:
            - "POST /conversion-requests/{CR.id}/complete"
          assert:
            - "CR.status == COMPLETED AND CR.completed_distribution_id != null (Link 1)"
            - "A_trad.balance_cents == 0 AND A_roth.balance_cents == 700000 (Link 2, caused by Link 1)"
            - "Exactly one Form1099R exists with source_event_id == CR.completed_distribution_id, source_event_type=CONVERSION, box7_distribution_code=='G', box2a_taxable_amount_cents==700000 (Link 3, caused by Link 2)"

  # ============================================================
  # Rule 5: Validation priority conflicts across different error-category pairs
  # ============================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_fiscal_frozen_beats_cap
        grounds:
          - validations[priority=6]   # state ERR_ACCOUNT_FROZEN
          - validations[priority=15]  # business_fiscal ERR_CONTRIBUTION_CAP_EXCEEDED
        distinguishing_aspect: |
          State category (priority 6, ERR_ACCOUNT_FROZEN) must win over business_fiscal category
          (priority 15, ERR_CONTRIBUTION_CAP_EXCEEDED) when both would fail. Pair = {state, business_fiscal}.
        test_recipe:
          setup:
            - "Account A (TRADITIONAL), participant age 45, ytd_contribution_cents=700000 (already at cap)"
            - "POST /accounts/{A.id}/freeze => A.status=FROZEN"
          trigger:
            - "POST /accounts/{A.id}/contributions amount=100, type=REGULAR (would also exceed cap)"
          assert:
            - "Response is 409 ERR_ACCOUNT_FROZEN, NOT 422 ERR_CONTRIBUTION_CAP_EXCEEDED"

      - name: business_safety_vs_business_fiscal_segregation_beats_balance
        grounds:
          - validations[priority=14]  # business_safety ERR_SEGREGATION_VIOLATION
          - validations[priority=17]  # business_fiscal ERR_INSUFFICIENT_BALANCE
        distinguishing_aspect: |
          business_safety (priority 14, ERR_SEGREGATION_VIOLATION) must win over business_fiscal
          (priority 17, ERR_INSUFFICIENT_BALANCE) when both would apply on a conversion approve
          where the approver equals the participant AND the source balance is insufficient. Pair
          = {business_safety, business_fiscal} — a different error-category pair than the first
          instance.
        test_recipe:
          setup:
            - "Participant P; TRADITIONAL Account A_trad (balance 100000); ROTH Account A_roth (balance 0)"
            - "ConversionRequest CR (source=A_trad, dest=A_roth, amount=500000) created by P"
            - "Custodian acting with X-User-ID == P.id attempts to approve (segregation violation)"
          trigger:
            - "POST /conversion-requests/{CR.id}/approve with X-User-Role=Custodian, X-User-ID=P.id"
          assert:
            - "Response is 403 ERR_SEGREGATION_VIOLATION, NOT 422 ERR_INSUFFICIENT_BALANCE"

  # ============================================================
  # Rule 6: Boundary-precision checks on different metrics/endpoints
  # ============================================================
  - rule_id: boundary_precision_check
    instances:
      - name: catchup_age_exact_fifty
        # Numeric threshold boundary on age, on the contributions endpoint.
        grounds:
          - calculations.compute_applicable_contribution_cap
          - validations[priority=16]
          - endpoints["POST /accounts/{account_id}/contributions"]
        distinguishing_aspect: |
          The CATCHUP age threshold uses >=50 evaluated against age-on-Dec-31-of-clock_year.
          A participant who turns 50 on Dec 31 of clock_year is exactly age 50 and is eligible;
          one who turns 50 on Jan 1 of the FOLLOWING year is age 49 on Dec 31 of clock_year and
          is NOT eligible. Boundary is numeric, evaluated at POST /accounts/{id}/contributions.
        test_recipe:
          setup:
            - "Participant P_exact born 1976-12-31, clock 2026-06-01 (will be 50 on Dec 31 2026)"
            - "Account A_exact TRADITIONAL OPEN under P_exact"
            - "Participant P_off born 1977-01-01, clock 2026-06-01 (will be 49 on Dec 31 2026)"
            - "Account A_off TRADITIONAL OPEN under P_off"
          trigger:
            - "POST /accounts/{A_exact.id}/contributions amount=100000, type=CATCHUP"
            - "POST /accounts/{A_off.id}/contributions amount=100000, type=CATCHUP"
          assert:
            - "A_exact request returns 201, ContributionEvent created with status=POSTED"
            - "A_off request returns 422 ERR_CATCHUP_AGE_INELIGIBLE"

      - name: rmd_zero_pre_age73_versus_one_cent_post
        # Zero-quantity boundary on a different metric (RMD amount) at a different endpoint (GET /rmd).
        grounds:
          - calculations.compute_rmd_amount
          - endpoints["GET /accounts/{account_id}/rmd"]
        distinguishing_aspect: |
          The RMD endpoint returns required_amount_cents==0 for any Traditional account where
          participant age < 73 (no positive amount required). At exact age 73 on Dec 31 the
          formula produces a strictly positive amount (e.g., 377358 cents). Empty-set boundary
          on the RMD metric, evaluated through GET /accounts/{id}/rmd — a different endpoint and
          a different metric from the catchup-age boundary.
        test_recipe:
          setup:
            - "Participant P_under born 1955-01-15 (age 72 on Dec 31 2027 if clock=2027), Account A_under TRADITIONAL, prior_year_end_balance_cents=10000000"
            - "Participant P_at born 1954-12-31 (age 73 on Dec 31 2027), Account A_at TRADITIONAL, prior_year_end_balance_cents=10000000"
            - "Clock at 2027-01-02"
          trigger:
            - "GET /accounts/{A_under.id}/rmd?tax_year=2027"
            - "GET /accounts/{A_at.id}/rmd?tax_year=2027"
          assert:
            - "A_under RMDQuote.required_amount_cents == 0"
            - "A_at RMDQuote.required_amount_cents == 377358"

  # ============================================================
  # Rule 7: Cross-entity state dependencies across different entity pairs
  # ============================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: conversion_approve_depends_on_account_open
        # Pair: ConversionRequest <-> Account
        grounds:
          - state_machines.ConversionRequest.PENDING_to_APPROVED
          - state_machines.Account
          - validations[priority=6]
        distinguishing_aspect: |
          ConversionRequest.PENDING->APPROVED requires source_account.status==OPEN AND
          destination_account.status==OPEN. If either Account is FROZEN, the approve transition
          is rejected. Cross-entity dependency on the pair (ConversionRequest, Account).
        test_recipe:
          setup:
            - "ConversionRequest CR in PENDING with source A_trad (TRADITIONAL OPEN) and dest A_roth (ROTH OPEN)"
            - "POST /accounts/{A_roth.id}/freeze => A_roth.status=FROZEN"
          trigger:
            - "POST /conversion-requests/{CR.id}/approve"
          assert:
            - "Response is 409 ERR_ACCOUNT_FROZEN (the cross-entity precondition fails on the dest account)"
            - "CR.status remains PENDING"

      - name: distribution_depends_on_beneficiaryclaim_not_forfeited
        # Pair: DistributionEvent <-> BeneficiaryClaim — distinct from the prior pair.
        grounds:
          - state_machines.BeneficiaryClaim
          - state_machines.BeneficiaryClaim.CLAIMED_to_FORFEITED
          - state_machines.BeneficiaryClaim.SUSPENDED_to_FORFEITED
          - validations[priority=10]
          - endpoints["POST /accounts/{account_id}/distributions"]
        distinguishing_aspect: |
          A new DistributionEvent on an inherited Account requires the associated
          BeneficiaryClaim.status != FORFEITED. Cross-entity dependency on the pair
          (DistributionEvent, BeneficiaryClaim) — a different entity pair from the
          ConversionRequest/Account dependency above.
        test_recipe:
          setup:
            - "Inherited Account A_inh with BeneficiaryClaim B (claim_date=2026-01-02, deadline_date=2036-01-02), balance_cents=5000000"
            - "POST /_clock/advance days=3660 (cross deadline_date) => sweep flips B.status=FORFEITED and A_inh.status=FROZEN"
          trigger:
            - "POST /accounts/{A_inh.id}/distributions gross_amount_cents=10000, distribution_reason=NORMAL"
          assert:
            - "Response is 409 ERR_INHERITED_CLAIM_FORFEITED (priority 10 before ERR_ACCOUNT_FROZEN need not even fire)"
            - "B.status == FORFEITED, A_inh.balance_cents unchanged (no debit)"

  # ============================================================
  # Rule 8: Resource temporal-overlap conflicts across different interval semantics
  # ============================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: rmd_window_half_open_per_tax_year_per_account
        # Interval semantics: per-(account, tax_year) at most one RMD-coded distribution.
        # Half-open window: tax_year is a closed-on-Jan-1, open-on-following-Jan-1 interval.
        grounds:
          - concurrency_rules[RMD_already_taken]
          - validations[priority=20]
          - endpoints["POST /accounts/{account_id}/distributions"]
        distinguishing_aspect: |
          At most ONE RMD-coded DistributionEvent may occupy the half-open interval
          [Jan 1 of tax_year, Jan 1 of tax_year+1) for a given Account. A second RMD in the
          same window collides and is rejected. Geometric treatment: zero-overlap, half-open,
          per-(Account, tax_year) — first occupancy wins.
        test_recipe:
          setup:
            - "Account A_own (TRADITIONAL, prior_year_end_balance_cents=10000000), participant age 73, clock at 2026-02-01"
            - "First call: POST /accounts/{A_own.id}/distributions gross_amount_cents=377358, distribution_reason=RMD succeeds"
          trigger:
            - "Second call same day: POST /accounts/{A_own.id}/distributions gross_amount_cents=377358, distribution_reason=RMD"
            - "Third call after POST /_clock/advance-year (now clock=2027-01-02): POST /accounts/{A_own.id}/distributions gross_amount_cents=<new RMD amount>, distribution_reason=RMD"
          assert:
            - "Second call returns 409 ERR_RMD_ALREADY_TAKEN"
            - "Third call returns 201 (interval [2027-01-01, 2028-01-01) is fresh — first occupancy in new window)"

      - name: secure_10_year_window_closed_on_deadline_inclusive
        # Different interval semantics: a single closed-on-both-ends 10-year window per
        # BeneficiaryClaim; the deadline_date day itself is INCLUDED (distributions allowed up
        # to and including deadline_date). Aggregate capacity = full Account.balance_cents.
        grounds:
          - state_machines.BeneficiaryClaim.CLAIMED_to_FORFEITED
          - validations[priority=11]
          - entities.BeneficiaryClaim.fields.deadline_date
        distinguishing_aspect: |
          The SECURE 10-year window is a CLOSED interval [claim_date, deadline_date] (inclusive
          on both ends): a distribution dated exactly deadline_date succeeds, but a distribution
          dated deadline_date + 1 fails with ERR_SECURE_DEADLINE_EXPIRED. Different interval
          geometry from the RMD half-open window: this one tests inclusive-right boundary on a
          different resource entity (BeneficiaryClaim, not Account-RMD).
        test_recipe:
          setup:
            - "Inherited Account A_inh, BeneficiaryClaim B with claim_date=2026-01-02 and deadline_date=2036-01-02; balance_cents=5000000"
            - "POST /_clock/advance days=3653 => clock at exactly 2036-01-02 (10 years later, inclusive)"
            - "POST /accounts/{A_inh.id}/distributions gross_amount_cents=1000000, distribution_reason=NORMAL succeeds (clock == deadline_date allowed)"
          trigger:
            - "POST /_clock/advance days=1 => clock at 2036-01-03"
            - "POST /accounts/{A_inh.id}/distributions gross_amount_cents=1000000, distribution_reason=NORMAL"
          assert:
            - "First distribution at clock=2036-01-02 returns 201 (boundary inclusive)"
            - "Second distribution at clock=2036-01-03 returns 422 ERR_SECURE_DEADLINE_EXPIRED"

  # ============================================================
  # Rule 9: Compensating-action invariants across different conserved quantities
  # ============================================================
  - rule_id: compensating_invariant
    instances:
      - name: contribution_reverse_conserves_account_balance_cents
        grounds:
          - endpoints["POST /accounts/{account_id}/contributions"]
          - endpoints["POST /contributions/{contribution_id}/reverse"]
          - entities.Account.fields.balance_cents
        distinguishing_aspect: |
          Conserved quantity: Account.balance_cents (the Account's monetary balance).
          Forward action POST /accounts/{id}/contributions credits by amount_cents; compensating
          action POST /contributions/{id}/reverse creates an EXCESS_REMOVAL DistributionEvent
          of equal amount_cents and decrements Account.balance_cents. The invariant
          Account.balance_cents == balance_cents_before_pair MUST hold exactly after the pair.
        test_recipe:
          setup:
            - "Account A under Participant P_45 (age 45); A.balance_cents=0, A.ytd_contribution_cents=0"
          trigger:
            - "POST /accounts/{A.id}/contributions amount_cents=500000, type=REGULAR"
            - "Capture A.balance_cents = b1 (expected 500000); POST /contributions/{returned_id}/reverse"
          assert:
            - "After the contribution: A.balance_cents == 500000"
            - "After the reversal: A.balance_cents == 0 (matches the pre-pair value exactly)"
            - "A.ytd_contribution_cents == 0 after reversal"

      - name: conversion_complete_conserves_cross_account_total_cents
        grounds:
          - state_machines.ConversionRequest.APPROVED_to_COMPLETED
          - entities.Account.fields.balance_cents
          - entities.DistributionEvent
        distinguishing_aspect: |
          Conserved quantity: cross-account sum source.balance_cents + destination.balance_cents
          (a DIFFERENT type of conserved quantity than per-account balance_cents — this is a
          cross-aggregate sum). POST /conversion-requests/{id}/complete creates a DistributionEvent
          that debits source by amount_cents and credits destination by amount_cents in the same
          transaction; therefore the sum source.balance_cents + destination.balance_cents MUST be
