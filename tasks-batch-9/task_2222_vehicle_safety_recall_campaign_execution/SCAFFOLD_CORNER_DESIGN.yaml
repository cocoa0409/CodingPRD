        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.RecallCampaign
          - validations.priority_21
          - errors.ERR_STALE_CAMPAIGN_VERSION
        distinguishing_aspect: |
          The token is read BEFORE a population run silently bumps the campaign version, so the release
          arrives with a version that was correct when it was fetched; the OCC guard must return 412 and
          leave the remedy dimension alone, and the retry with the refreshed token then succeeds.
        test_recipe:
          setup:
            - "BASE-FILED for 26V-342 with one NE build record and an inclusion rule already stored; labor operation R342-01 flat 1.10 (2026-08-01..2027-12-31) exists."
            - "The campaign version is captured, then a population run mutates the campaign counters and bumps its version."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: SafetyEngineer
              as_user_id: "u-eng-1"
            - call: "POST /recall-campaigns"
              payload: { campaign_number: "26V-342", defect_type: "SAFETY_DEFECT", defect_description: "Inflator may rupture" }
