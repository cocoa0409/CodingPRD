  # =========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # =========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: booking_complete_cascade_depth_three_booking_to_sitter_counters_to_tier
        grounds:
          - "state_machines.Booking.IN_PROGRESS_to_COMPLETED"
          - "calculations.sitter_tier_score"
          - "entities.Sitter.fields.total_completed_bookings"
          - "entities.Sitter.fields.tier"
        distinguishing_aspect: |
          Depth-3 cascade originating from a DIFFERENT trigger
          (Booking IN_PROGRESS → COMPLETED, not InsuranceClaim PAID).
          Link 1 (caused by trigger): Booking.status := COMPLETED.
          Link 2 (caused by link 1): Sitter counters mutate —
          total_completed_bookings += 1, total_rating_sum += owner_rating,
          total_rating_count += 1.
          Link 3 (caused by link 2 — the counter mutations themselves
          trigger sitter_tier_score recompute): tier_score crosses the
          SILVER_MIN boundary (raw=40 from rating=3, completed=1), causing
          Sitter.tier to transition BRONZE → SILVER.
          Each link is caused by the previous link's mutation, not by the
          trigger directly.
        test_recipe:
          setup:
            - "Owner o5; Sitter s5 ACTIVE BRONZE tier_score=10; Pet p5; MG approved."
            - "Booking b5 in IN_PROGRESS state."
          setup_api_calls:
            - call: "POST /api/v1/owners/register"
              payload: { email: "o5@example.com", full_name: "O Five", phone: "+12025550601" }
              as: Anonymous
              captures: { o5_id: $.data.id }
