    output: { year: integer, status: string, counts: object, snapshot_counts: object, amended_counts: object, published_at: datetime, amended_at: datetime }
    side_effects: ["computes calc_annual_statistics LIVE variant on read when unpublished"]
  - method: POST
    path: /api/annual-statistics/{year}/publish
    description: "Freeze the current LIVE computation into a PUBLISHED snapshot"
    roles: [TitleIXCoordinator]
    code: 201
    input: []
    output: AnnualStatistic
    side_effects: ["creates AnnualStatistic row: status PUBLISHED, snapshot_counts = LIVE computation at publish instant, published_at = now", "ERR_DUPLICATE_RESOURCE if a row for year already exists"]
  - method: POST
    path: /api/annual-statistics/{year}/amend
    description: "Recompute and store amended_counts on a published year (PUBLISHED -> AMENDED; re-amendment self-loop)"
    roles: [TitleIXCoordinator]
    code: 200
    input: []
    output: AnnualStatistic
    side_effects: ["amended_counts = LIVE recomputation; amended_at = now; snapshot_counts unchanged"]

