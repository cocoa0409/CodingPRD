            - call: "POST /eoir/judges"
              payload: { court_id: "${court_id}", full_name: "Judge Other", max_pending_cases: 5 }
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { judge2: $.data.id }
            - *c_case_eng
            - *c_assign
