              as_user_id: "spec-1"
            - call: "POST /public-assistance/facilities"
              payload: { applicant_id: "${applicant_id}", name: "Riverside Pump Station", facility_type: "WATER_CONTROL", ownership: "PUBLIC" }
              as: ApplicantAgent
              as_user_id: "${applicant_id}"
              captures: { facility_id: $.data.id }
            - call: "POST /public-assistance/facilities/${facility_id}/screen"
              payload: {}
              as: ProgramSpecialist
              as_user_id: "spec-1"
          trigger:
            - call: "POST /public-assistance/projects"
              payload: { applicant_id: "${applicant_id}", facility_id: "${facility_id}", category: "C", title: "Over-scoped mitigation", scope_of_work: "Repair plus an oversized mitigation measure", estimated_repair_cost_cents: 3000000, mitigation_requested_cents: 3000001 }
              as: ApplicantAgent
              as_user_id: "${applicant_id}"
              captures: { err: $.data.error_id }
            - call: "POST /public-assistance/projects"
              payload: { applicant_id: "${applicant_id}", facility_id: "${facility_id}", category: "C", title: "Fully mitigated repair", scope_of_work: "Repair plus a mitigation measure of equal value", estimated_repair_cost_cents: 3000000, mitigation_requested_cents: 3000000 }
              as: ApplicantAgent
              as_user_id: "${applicant_id}"
              captures: { project_id: $.data.id }
          assert:
            - "3000001 against a 3000000 estimate -> HTTP 422 with error_id ERR_MITIGATION_EXCEEDS_REPAIR and no Project row created"
            - "3000000 against a 3000000 estimate -> HTTP 201"
            - "Project.${project_id}.mitigation_requested_cents == 3000000"
            - "Project.${project_id}.mitigation_approved_cents == 0 (the cap is only applied at cost review)"
            - "Project.${project_id}.status == DRAFT"

      - name: pnp_essential_non_critical_eligibility_without_sba_referral_rejected
        claim_type: conditional_validation
        grounds:
          - validations[priority 15]
          - errors[ERR_PNP_SBA_REFERRAL_REQUIRED]
          - state_machines.Applicant.PENDING_to_ELIGIBLE
