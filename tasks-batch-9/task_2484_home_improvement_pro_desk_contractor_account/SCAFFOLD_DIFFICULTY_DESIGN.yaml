          Resource = the store's will-call bays; interval semantics = half-open [stage_start, expires_at)
          compared against an aggregate capacity of will_call_bay_slots == 1. A staging that starts
          exactly when the incumbent expires (12:00 against [08:00, 12:00)) is accepted because the upper
