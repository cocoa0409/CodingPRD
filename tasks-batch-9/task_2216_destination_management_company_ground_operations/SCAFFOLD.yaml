# =============================================================================
# PRD Benchmark Seed Tables — task_2216
# Destination Management Company Ground Operations
# Difficulty target: above Expert (§0.4) — 12 entities, 66 endpoints,
# 9 state machines (parallel + cyclic + branching + compound), 8 calculations.
# =============================================================================

scenario: |
  2216. Destination Management Company Ground Operations (destination management company): program design with venue selection, activity curation and local supplier assembly for an incoming group, transportation planning across airport transfers, shuttles and dine-around logistics with manifest management, staffing plan for on-site coordinators, greeters and activity leads with credentialing, supplier contracting with deposit schedules, cancellation terms and insurance requirements, permits for street closures, special venues and off-premise events, on-site execution with production timelines, contingency plans and weather alternatives, program reconciliation with actual attendance versus guaranteed counts, client billing with markup transparency and supplier settlement

domain_name: dmc-ground-ops
api_prefix: "/dmc"

complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation

  entity_topology: graph
  # graph: ProgramElement carries two self-referential FKs (production-timeline
  # predecessor + weather-alternative), StaffAssignment is a polymorphic junction
  # over ProgramElement | TransportSegment, and ReconciliationLine /
  # SettlementPayment join across the Program, Supplier and SupplierContract
  # aggregates. No single ownership tree exists.

  state_machine_shape: parallel
  # Program carries two independent dimensions (execution_status ×
  # settlement_status), each with its own revert cycle. SupplierContract is
  # cyclic (SENT -> COUNTERED -> SENT negotiation rounds), Permit is branching
  # (SUBMITTED -> {APPROVED, DENIED, CONDITIONS_REQUESTED} with a cycle back),
  # and Program.execution_status COMPLETED is compound (derived from the
  # aggregate state of its ProgramElement children).

  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - polymorphic
    - cross_aggregate

  role_model: segregation_of_duties
  # A SupplierManager may not countersign a contract they sent; a Controller may
  # not release a settlement payment they approved.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: Program
    parent: null
    common_fields: true
    fields:
      - name: client_name
        type: string
        source: input
        description: Billing client (corporate account) for the incoming group.
        constraints: "1..120 chars"
      - name: group_name
        type: string
        source: input
        description: Name of the incoming group as it appears on signage.
        constraints: "1..120 chars"
      - name: arrival_date
        type: datetime
        source: input
        description: First instant of the program window (inclusive).
      - name: departure_date
        type: datetime
        source: input
        description: Last instant of the program window (inclusive).
        constraints: "must be strictly after arrival_date"
      - name: guaranteed_count
        type: integer
        source: input
        description: Contractual guaranteed head count the client warrants to the DMC.
        constraints: ">= 1"
      - name: markup_pct
        type: number
        source: input
        description: Disclosed markup applied to supplier cost on every reconciliation line.
        default: 0.18
        constraints: "0.05 <= markup_pct <= 0.35 (ERR_MARKUP_PCT_OUT_OF_BAND otherwise)"
      - name: execution_status
        type: enum
        source: system
        description: Design/operations dimension of the program lifecycle.
        default: DRAFT
        constraints: "DRAFT | DESIGN_LOCKED | CONFIRMED | IN_EXECUTION | COMPLETED | CANCELLED"
      - name: settlement_status
        type: enum
        source: system
        description: Money dimension of the program lifecycle; evolves independently of execution_status.
        default: NOT_STARTED
        constraints: "NOT_STARTED | RECONCILING | CLIENT_INVOICED | CREDITED | SETTLED"
      - name: element_count
        type: integer
        source: computed
        description: Count of ProgramElement rows whose program_id is this program, any status.
        default: 0
      - name: open_element_count
        type: integer
        source: computed
        description: Count of ProgramElement rows for this program with status IN {PLANNED, PERMIT_BLOCKED, READY}.
        default: 0
      - name: actual_attendance_total
        type: integer
        source: computed
        description: Sum of ProgramElement.actual_headcount over elements with status = DELIVERED.
        default: 0
      - name: estimated_client_total_cents
        type: integer
        source: computed
        description: ESTIMATE variant of program_client_total (§1.3), frozen at the CONFIRMED transition.
        default: 0
      - name: final_subtotal_cents
        type: integer
        source: computed
        description: Sum of ReconciliationLine.supplier_cost_cents over lines of this program with status = APPROVED.
        default: 0
      - name: disclosed_markup_cents
        type: integer
        source: computed
        description: Sum of ReconciliationLine.markup_cents over lines of this program with status = APPROVED.
        default: 0
      - name: management_fee_cents
        type: integer
        source: computed
        description: Tiered management fee from program_client_total FINAL variant (§1.3).
        default: 0
      - name: final_client_total_cents
        type: integer
        source: computed
        description: FINAL variant of program_client_total (§1.3) = final_subtotal + disclosed_markup + management_fee.
        default: 0
      - name: supplier_gross_payable_cents
        type: integer
        source: computed
        description: Equals final_subtotal_cents; the gross owed to all suppliers across APPROVED reconciliation lines.
        default: 0
      - name: supplier_settled_cents
        type: integer
        source: computed
        description: Sum of SettlementPayment.net_payable_cents for this program with status IN {APPROVED, PAID}.
        default: 0
      - name: supplier_open_payable_cents
        type: integer
        source: computed
        description: supplier_gross_payable_cents - supplier_settled_cents; conserved-money invariant anchor.
        default: 0
      - name: credit_note_cents
        type: integer
        source: computed
        description: Cumulative client credit issued by credit-invoice actions.
        default: 0
      - name: seated_guest_count
        type: integer
        source: computed
        description: Sum of TransportSegment.booked_seat_count over segments of this program; conserved-seat invariant anchor.
        default: 0
      - name: staffing_gap_count
        type: integer
        source: computed
        description: Monotonic counter incremented by one every time a StaffAssignment of this program leaves CONFIRMED for RELEASED or NO_SHOW; never decremented.
        default: 0
      - name: unseated_guest_count
        type: integer
        source: computed
        description: Cumulative count of ManifestEntry rows moved to RELEASED by a segment cancellation cascade.
        default: 0
      - name: invoice_issued_at
        type: datetime
        source: system
        description: Logical-clock instant at which the client invoice was issued; null until issue-invoice.
        default: null

  - name: Venue
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Venue trading name.
      - name: capacity_seated
        type: integer
        source: input
        description: Maximum seated-dinner capacity.
        constraints: ">= 0"
      - name: capacity_reception
        type: integer
        source: input
        description: Maximum standing-reception capacity.
        constraints: ">= 0"
      - name: turnover_buffer_minutes
        type: integer
        source: input
        description: Minutes of strike/reset required after an occupation ends before the next may start.
        default: 90
        constraints: ">= 0"
      - name: requires_special_venue_permit
        type: boolean
        source: input
        description: When true, an element booked here must carry a SPECIAL_VENUE permit in status APPROVED before mark-ready.
        default: false
      - name: status
        type: enum
        source: input
        description: Bookability of the venue.
        default: ACTIVE
        constraints: "ACTIVE | SUSPENDED"

  - name: Supplier
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: Registered legal name of the local supplier.
      - name: supplier_type
        type: enum
        source: input
        description: Category of service the supplier provides.
        constraints: "VENUE_SERVICES | TRANSPORT | ACTIVITY | STAFFING"
      - name: insurance_expires_on
        type: datetime
        source: input
        description: Expiry instant of the supplier's certificate of insurance (inclusive — valid while clock <= this instant).
      - name: insurance_liability_limit_cents
        type: integer
        source: input
        description: Per-occurrence liability limit carried on the certificate of insurance.
        constraints: ">= 0"
      - name: coi_verified
        type: boolean
        source: input
        description: Whether the DMC risk desk has verified the certificate of insurance document.
        default: false
      - name: status
        type: enum
        source: input
        description: Approval posture of the supplier in the DMC vendor file.
        default: PROSPECT
        constraints: "PROSPECT | APPROVED | SUSPENDED"

  - name: SupplierContract
    parent: null
    common_fields: true
    fields:
      - name: program_id
        type: string
        source: input
        description: FK -> Program.id; the program this contract is scoped to.
      - name: supplier_id
        type: string
        source: input
        description: FK -> Supplier.id; the contracted local supplier.
      - name: contract_value_cents
        type: integer
        source: input
        description: Total contracted value before reconciliation.
        constraints: ">= 1"
      - name: deposit_pct
        type: number
        source: input
        description: Fraction of contract_value_cents payable as deposit at countersignature.
        default: 0.3
        constraints: "0 <= deposit_pct <= 1"
      - name: cancellation_tier
        type: enum
        source: input
        description: Cancellation schedule applied by cancellation_penalty (§1.3).
        default: STANDARD
        constraints: "STANDARD | STRICT"
      - name: required_liability_limit_cents
        type: integer
        source: input
        description: Minimum insurance limit the DMC requires of this supplier for this program.
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: Contract negotiation and life-cycle state.
        default: DRAFT
        constraints: "DRAFT | SENT | COUNTERED | ACTIVE | CLOSED | TERMINATED"
      - name: round_count
        type: integer
        source: computed
        description: Number of completed send/counter negotiation rounds; capped by MAX_NEGOTIATION_ROUNDS.
        default: 0
      - name: deposit_due_cents
        type: integer
        source: computed
        description: round_half_up(contract_value_cents * deposit_pct), stamped at the COUNTERED/DRAFT -> ACTIVE transition.
        default: 0
      - name: deposit_paid_cents
        type: integer
        source: computed
        description: Deposit actually recorded as paid; equals deposit_due_cents once ACTIVE, reset to 0 on TERMINATED.
        default: 0
      - name: sent_by_user_id
        type: string
        source: system
        description: X-User-ID of the SupplierManager who last executed send; segregation-of-duties anchor.
        default: null
      - name: countersigned_by_user_id
        type: string
        source: system
        description: X-User-ID of the SupplierManager who countersigned; must differ from sent_by_user_id.
        default: null

  - name: ProgramElement
    parent: Program
    common_fields: true
    fields:
      - name: program_id
        type: string
        source: input
        description: FK -> Program.id; the program this element belongs to.
      - name: supplier_id
        type: string
        source: input
        description: FK -> Supplier.id; the local supplier delivering this element.
      - name: venue_id
        type: string
        source: input
        description: FK -> Venue.id; null for TRANSFER_BLOCK elements that occupy no venue.
        default: null
      - name: predecessor_element_id
        type: string
        source: input
        description: FK -> ProgramElement.id; production-timeline predecessor that must be DELIVERED first.
        default: null
      - name: alternative_for_element_id
        type: string
        source: input
        description: FK -> ProgramElement.id; when set, this element is the weather alternative (rain plan) for that element.
        default: null
      - name: element_type
        type: enum
        source: input
        description: Kind of curated program element.
        constraints: "ACTIVITY | DINE_AROUND | OFF_PREMISE_EVENT | TRANSFER_BLOCK"
      - name: title
        type: string
        source: input
        description: Element name printed on the production timeline.
      - name: starts_at
        type: datetime
        source: input
        description: Start of the element's venue occupation (half-open interval start, inclusive).
      - name: ends_at
        type: datetime
        source: input
        description: End of the element's venue occupation (half-open interval end, exclusive).
        constraints: "must be strictly after starts_at"
      - name: planned_headcount
        type: integer
        source: input
        description: Head count used for estimate billing and cancellation penalties.
        constraints: ">= 0"
      - name: guaranteed_headcount
        type: integer
        source: input
        description: Head count guaranteed to the supplier for this element.
        constraints: ">= 0"
      - name: per_person_cost_cents
        type: integer
        source: input
        description: Supplier cost per billed head for this element.
        constraints: ">= 0"
      - name: is_weather_dependent
        type: boolean
        source: input
        description: Whether the element may be swapped for its weather alternative.
        default: false
      - name: actual_headcount
        type: integer
        source: input
        description: Attendance recorded at the deliver transition; null until DELIVERED.
        default: null
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: Element execution state.
        default: PLANNED
        constraints: "PLANNED | PERMIT_BLOCKED | READY | DELIVERED | WEATHER_SWITCHED | CANCELLED"
      - name: delivered_at
        type: datetime
        source: system
        description: Logical-clock instant of the deliver transition; null otherwise.
        default: null
      - name: cancellation_penalty_cents
        type: integer
        source: computed
        description: Output of cancellation_penalty (§1.3), stamped at the cancel transition; 0 otherwise.
        default: 0

  - name: Permit
    parent: ProgramElement
    common_fields: true
    fields:
      - name: element_id
        type: string
        source: input
        description: FK -> ProgramElement.id; the element this permit authorises.
      - name: permit_type
        type: enum
        source: input
        description: Category of authorisation sought.
        constraints: "STREET_CLOSURE | SPECIAL_VENUE | OFF_PREMISE_ALCOHOL"
      - name: authority_name
        type: string
        source: input
        description: Issuing authority (municipality, licensing board).
      - name: lead_time_days_required
        type: integer
        source: input
        description: Minimum whole days that must separate submission from the element's starts_at.
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: Permit application state.
        default: DRAFT
        constraints: "DRAFT | SUBMITTED | CONDITIONS_REQUESTED | APPROVED | DENIED"
      - name: submitted_at
        type: datetime
        source: system
        description: Logical-clock instant of the most recent submit transition.
        default: null
      - name: decision_at
        type: datetime
        source: system
        description: Logical-clock instant of the most recent record-decision transition.
        default: null
      - name: conditions_note
        type: string
        source: input
        description: Conditions the authority attached when returning CONDITIONS_REQUESTED.
        default: null
      - name: resubmission_count
        type: integer
        source: computed
        description: Number of submit transitions beyond the first.
        default: 0

  - name: TransportSegment
    parent: Program
    common_fields: true
    fields:
      - name: program_id
        type: string
        source: input
        description: FK -> Program.id; the program this movement belongs to.
      - name: segment_type
        type: enum
        source: input
        description: Kind of ground movement.
        constraints: "ARRIVAL_TRANSFER | DEPARTURE_TRANSFER | SHUTTLE_LOOP | DINE_AROUND_LEG"
      - name: vehicle_code
        type: string
        source: input
        description: Operator's vehicle identifier; free text, not a managed resource.
      - name: origin
        type: string
        source: input
        description: Pick-up location label.
      - name: destination
        type: string
        source: input
        description: Drop-off location label.
      - name: depart_at
        type: datetime
        source: input
        description: Scheduled departure instant.
      - name: arrive_at
        type: datetime
        source: input
        description: Scheduled arrival instant.
        constraints: "must be strictly after depart_at"
      - name: seat_capacity
        type: integer
        source: input
        description: Seats available on the assigned vehicle.
        constraints: ">= 1"
      - name: wheelchair_accessible
        type: boolean
        source: input
        description: Whether the vehicle can carry a mobility-assist guest.
        default: false
      - name: booked_seat_count
        type: integer
        source: computed
        description: Sum of ManifestEntry.seat_count for this segment with status IN {ASSIGNED, CHECKED_IN}.
        default: 0
      - name: status
        type: enum
        source: system
        description: Movement state.
        default: SCHEDULED
        constraints: "SCHEDULED | DEPARTED | CANCELLED"
      - name: departed_at
        type: datetime
        source: system
        description: Logical-clock instant of the depart transition.
        default: null

  - name: ManifestEntry
    parent: TransportSegment
    common_fields: true
    fields:
      - name: segment_id
        type: string
        source: input
        description: FK -> TransportSegment.id; the movement this guest is manifested on.
      - name: guest_ref
        type: string
        source: input
        description: Guest reference code; unique per segment among entries with status IN {ASSIGNED, CHECKED_IN}.
      - name: guest_name
        type: string
        source: input
        description: Guest name as printed on the manifest.
      - name: seat_count
        type: integer
        source: input
        description: Seats this entry occupies (a guest with a companion may take 2).
        default: 1
        constraints: ">= 1"
      - name: mobility_assist
        type: boolean
        source: input
        description: Whether the guest requires a wheelchair-accessible vehicle.
        default: false
      - name: status
        type: enum
        source: system
        description: Manifest entry state.
        default: ASSIGNED
        constraints: "ASSIGNED | CHECKED_IN | RELEASED | NO_SHOW"
      - name: move_count
        type: integer
        source: computed
        description: Number of times this entry has been moved between segments.
        default: 0

  - name: StaffMember
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: Staff member's name.
      - name: role_type
        type: enum
        source: input
        description: On-site function this person is qualified for.
        constraints: "COORDINATOR | GREETER | ACTIVITY_LEAD"
      - name: badge_expires_on
        type: datetime
        source: input
        description: Expiry instant of the venue/airport access badge (inclusive).
      - name: first_aid_expires_on
        type: datetime
        source: input
        description: Expiry instant of the first-aid certification (inclusive).
      - name: pay_rate_cents_per_hour
        type: integer
        source: input
        description: Hourly rate used by staff_labor_cost (§1.3).
        constraints: ">= 0"
      - name: min_rest_minutes
        type: integer
        source: input
        description: Minimum minutes that must separate the end of one assignment from the start of the next.
        default: 600
        constraints: ">= 0"
      - name: max_daily_minutes
        type: integer
        source: input
        description: Maximum confirmed assignment minutes allowed within one UTC calendar day.
        default: 720
        constraints: ">= 0"
      - name: status
        type: enum
        source: input
        description: Employment posture.
        default: ACTIVE
        constraints: "ACTIVE | INACTIVE"
      - name: credential_status
        type: enum
        source: computed
        description: Output of staff_credential_status (§1.3), evaluated against the logical clock at read time.
        constraints: "VALID | EXPIRING | EXPIRED"
      - name: confirmed_minutes_total
        type: integer
        source: computed
        description: Sum of scheduled minutes over this member's StaffAssignment rows with status IN {CONFIRMED, CHECKED_IN, COMPLETED}.
        default: 0

  - name: StaffAssignment
    parent: null
    common_fields: true
    fields:
      - name: staff_id
        type: string
        source: input
        description: FK -> StaffMember.id; the assigned person.
      - name: program_id
        type: string
        source: input
        description: FK -> Program.id; the program being staffed.
      - name: element_id
        type: string
        source: input
        description: FK -> ProgramElement.id; set when target_type = ELEMENT, null otherwise.
        default: null
      - name: segment_id
        type: string
        source: input
        description: FK -> TransportSegment.id; set when target_type = SEGMENT, null otherwise.
        default: null
      - name: target_type
        type: enum
        source: input
        description: Polymorphic discriminator selecting which of element_id / segment_id is populated.
        constraints: "ELEMENT | SEGMENT"
      - name: role_type
        type: enum
        source: input
        description: Function performed on this assignment; must equal StaffMember.role_type.
        constraints: "COORDINATOR | GREETER | ACTIVITY_LEAD"
      - name: starts_at
        type: datetime
        source: input
        description: Assignment shift start (closed-interval start).
      - name: ends_at
        type: datetime
        source: input
        description: Assignment shift end (closed-interval end).
        constraints: "must be strictly after starts_at"
      - name: status
        type: enum
        source: system
        description: Assignment state.
        default: PROPOSED
        constraints: "PROPOSED | CONFIRMED | CHECKED_IN | COMPLETED | RELEASED | NO_SHOW"
      - name: check_in_at
        type: datetime
        source: system
        description: Logical-clock instant of the check-in transition.
        default: null
      - name: completed_at
        type: datetime
        source: system
        description: Logical-clock instant at which the assignment was completed by cascade.
        default: null
      - name: planned_labor_cost_cents
        type: integer
        source: computed
        description: PLANNED variant of staff_labor_cost (§1.3), stamped at the confirm transition.
        default: 0
      - name: actual_labor_cost_cents
        type: integer
        source: computed
        description: ACTUAL variant of staff_labor_cost (§1.3), stamped when the assignment reaches COMPLETED or NO_SHOW.
        default: 0

  - name: ReconciliationLine
    parent: Program
    common_fields: true
    fields:
      - name: program_id
        type: string
        source: input
        description: FK -> Program.id; the program being reconciled.
      - name: element_id
        type: string
        source: input
        description: FK -> ProgramElement.id; the element this line reconciles.
      - name: supplier_id
        type: string
        source: input
        description: FK -> Supplier.id; denormalised from the element for settlement grouping.
      - name: line_kind
        type: enum
        source: system
        description: Whether the line bills delivered service or a cancellation penalty.
        constraints: "DELIVERY | CANCELLATION_PENALTY"
      - name: guaranteed_headcount
        type: integer
        source: system
        description: Copy of ProgramElement.guaranteed_headcount at reconcile time.
      - name: actual_headcount
        type: integer
        source: system
        description: Copy of ProgramElement.actual_headcount at reconcile time; 0 for CANCELLATION_PENALTY lines.
      - name: billed_headcount
        type: integer
        source: computed
        description: FINAL variant of element_billable_headcount (§1.3); 0 for CANCELLATION_PENALTY lines.
        default: 0
      - name: supplier_cost_cents
        type: integer
        source: computed
        description: billed_headcount * element.per_person_cost_cents for DELIVERY lines; element.cancellation_penalty_cents for CANCELLATION_PENALTY lines.
        default: 0
      - name: markup_cents
        type: integer
        source: computed
        description: round_half_up(supplier_cost_cents * program.markup_pct) — rounded per line, then summed (§1.3).
        default: 0
      - name: client_charge_cents
        type: integer
        source: computed
        description: supplier_cost_cents + markup_cents.
        default: 0
      - name: variance_pct
        type: number
        source: computed
        description: abs(actual_headcount - guaranteed_headcount) / guaranteed_headcount for DELIVERY lines; 0 when guaranteed_headcount = 0 or line_kind = CANCELLATION_PENALTY.
        default: 0
      - name: variance_reason
        type: string
        source: input
        description: Operator explanation required when variance_pct exceeds VARIANCE_TOLERANCE_PCT.
        default: null
      - name: status
        type: enum
        source: system
        description: Line review state.
        default: DRAFT
        constraints: "DRAFT | APPROVED"

  - name: SettlementPayment
    parent: null
    common_fields: true
    fields:
      - name: program_id
        type: string
        source: input
        description: FK -> Program.id; the program being settled.
      - name: supplier_id
        type: string
        source: input
        description: FK -> Supplier.id; the payee.
      - name: contract_id
        type: string
        source: input
        description: FK -> SupplierContract.id; the contract the settlement discharges.
      - name: gross_cents
        type: integer
        source: computed
        description: Sum of ReconciliationLine.supplier_cost_cents for this program and supplier with status = APPROVED.
        default: 0
      - name: deposit_applied_cents
        type: integer
        source: computed
        description: Deposit credit consumed by the waterfall in settlement_net_payable (§1.3).
        default: 0
      - name: net_payable_cents
        type: integer
        source: computed
        description: max(0, gross_cents - deposit_applied_cents).
        default: 0
      - name: overpayment_credit_cents
        type: integer
        source: computed
        description: max(0, contract.deposit_paid_cents - gross_cents); deposit left stranded after the waterfall.
        default: 0
      - name: status
        type: enum
        source: system
        description: Settlement state.
        default: PENDING
        constraints: "PENDING | APPROVED | PAID | VOID"
      - name: approved_by_user_id
        type: string
        source: system
        description: X-User-ID of the Controller who approved; segregation-of-duties anchor.
        default: null
      - name: released_by_user_id
        type: string
        source: system
        description: X-User-ID of the Controller who released payment; must differ from approved_by_user_id.
        default: null

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  # --- Program, dimension 1 of 2 (parallel dimensions on one entity) ---------
  - entity: Program
    dimension: execution_status
    initial_state: DRAFT
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: DRAFT
        to: DESIGN_LOCKED
        trigger: "POST /dmc/programs/{program_id}/lock-design"
        actor: ProgramDirector
        preconditions:
          - "Program.execution_status == DRAFT"
          - "Program.element_count >= 1 (else ERR_PROGRAM_HAS_NO_ELEMENTS)"
          - "0.05 <= Program.markup_pct <= 0.35 (else ERR_MARKUP_PCT_OUT_OF_BAND)"
        side_effects:
          - "increments Program.version by 1"
          - "recomputes Program.element_count and Program.open_element_count"
        note: "Design lock freezes the element set; ProgramElement creation is refused while locked."
      - from: DESIGN_LOCKED
        to: DRAFT
        trigger: "POST /dmc/programs/{program_id}/unlock-design"
        actor: ProgramDirector
        preconditions:
          - "Program.execution_status == DESIGN_LOCKED"
          - "Program.settlement_status == NOT_STARTED"
          - "no StaffAssignment of this program has status IN {CHECKED_IN, COMPLETED} (else ERR_PROGRAM_ALREADY_STAFFED_ON_SITE)"
        side_effects:
          - "increments Program.version by 1"
        note: "Revert edge — makes the execution dimension cyclic (DRAFT -> DESIGN_LOCKED -> DRAFT)."
      - from: DESIGN_LOCKED
        to: CONFIRMED
        trigger: "POST /dmc/programs/{program_id}/confirm"
        actor: ProgramDirector
        preconditions:
          - "Program.execution_status == DESIGN_LOCKED"
          - "no ProgramElement of this program has status == PERMIT_BLOCKED (else ERR_PERMIT_NOT_APPROVED)"
          - "for every ProgramElement of this program with status IN {PLANNED, READY}, a SupplierContract exists with contract.program_id == element.program_id AND contract.supplier_id == element.supplier_id AND contract.status == ACTIVE (else ERR_NO_ACTIVE_SUPPLIER_CONTRACT)"
        side_effects:
          - "runs calculations.program_client_total variant ESTIMATE and writes Program.estimated_client_total_cents"
          - "increments Program.version by 1"
      - from: CONFIRMED
        to: IN_EXECUTION
        trigger: "POST /dmc/programs/{program_id}/start-execution"
        actor: OperationsCoordinator
        preconditions:
          - "Program.execution_status == CONFIRMED"
          - "logical clock now >= Program.arrival_date (else ERR_PROGRAM_WINDOW_NOT_OPEN)"
        side_effects:
          - "increments Program.version by 1"
      - from: IN_EXECUTION
        to: COMPLETED
        trigger: "system event — evaluated at the end of every ProgramElement transition into DELIVERED, WEATHER_SWITCHED or CANCELLED"
        actor: system
        preconditions:
          - "Program.execution_status == IN_EXECUTION"
          - "Program.open_element_count == 0 after the child element transition has been applied"
        side_effects:
          - "recomputes Program.actual_attendance_total as the sum of ProgramElement.actual_headcount over elements with status == DELIVERED"
          - "increments Program.version by 1"
        note: "Compound/bubble-up: the parent's terminal state is derived from the aggregate state of its ProgramElement children."
      - from: DRAFT | DESIGN_LOCKED | CONFIRMED | IN_EXECUTION
        to: CANCELLED
        trigger: "POST /dmc/programs/{program_id}/cancel"
        actor: ProgramDirector
        preconditions:
          - "Program.execution_status IN {DRAFT, DESIGN_LOCKED, CONFIRMED, IN_EXECUTION}"
          - "Program.settlement_status == NOT_STARTED (else ERR_PROGRAM_ALREADY_RECONCILING)"
        side_effects:
          - "every ProgramElement of this program with status IN {PLANNED, PERMIT_BLOCKED, READY} transitions to CANCELLED (each such element transition itself runs calculations.cancellation_penalty and its own staff-release cascade)"
          - "every TransportSegment of this program with status == SCHEDULED transitions to CANCELLED (each such segment transition itself runs its own ManifestEntry release cascade)"
          - "recomputes Program.open_element_count to 0"
          - "increments Program.version by 1"

  # --- Program, dimension 2 of 2 --------------------------------------------
  - entity: Program
    dimension: settlement_status
    initial_state: NOT_STARTED
    terminal_states: [SETTLED]
    transitions:
      - from: NOT_STARTED
        to: RECONCILING
        trigger: "POST /dmc/programs/{program_id}/reconcile"
        actor: ProgramDirector
        preconditions:
          - "Program.settlement_status == NOT_STARTED"
          - "Program.execution_status IN {COMPLETED, CANCELLED} (else ERR_PROGRAM_NOT_EXECUTION_FINAL)"
          - "at least one ProgramElement of this program has status IN {DELIVERED, CANCELLED} (else ERR_NO_RECONCILABLE_ELEMENTS)"
        side_effects:
          - "creates exactly one ReconciliationLine per ProgramElement of this program with status IN {DELIVERED, CANCELLED}, in element.starts_at ASC order with created_at ASC as tie-break; line_kind = DELIVERY for DELIVERED elements and CANCELLATION_PENALTY for CANCELLED elements"
          - "each created line runs calculations.element_billable_headcount variant FINAL then calculations.reconciliation_line_amounts, writing billed_headcount, supplier_cost_cents, markup_cents, client_charge_cents and variance_pct"
          - "recomputes Program.actual_attendance_total"
          - "increments Program.version by 1"
      - from: RECONCILING
        to: CLIENT_INVOICED
        trigger: "POST /dmc/programs/{program_id}/issue-invoice"
        actor: Controller
        preconditions:
          - "Program.settlement_status == RECONCILING"
          - "every ReconciliationLine of this program has status == APPROVED (else ERR_RECONCILIATION_LINES_PENDING)"
        side_effects:
          - "runs calculations.program_client_total variant FINAL and writes Program.final_subtotal_cents, Program.disclosed_markup_cents, Program.management_fee_cents, Program.final_client_total_cents"
          - "sets Program.invoice_issued_at to the logical clock instant"
          - "increments Program.version by 1"
      - from: CLIENT_INVOICED
        to: CREDITED
        trigger: "POST /dmc/programs/{program_id}/credit-invoice"
        actor: Controller
        preconditions:
          - "Program.settlement_status == CLIENT_INVOICED"
          - "no SettlementPayment of this program has status == PAID (else ERR_SETTLEMENT_ALREADY_PAID)"
        side_effects:
          - "Program.credit_note_cents += Program.final_client_total_cents"
          - "every ReconciliationLine of this program with status == APPROVED transitions to DRAFT; that line transition itself recomputes Program.final_subtotal_cents, Program.disclosed_markup_cents, Program.supplier_gross_payable_cents and Program.supplier_open_payable_cents"
          - "increments Program.version by 1"
      - from: CREDITED
        to: RECONCILING
        trigger: "system event — evaluated at the end of the credit-invoice request once every ReconciliationLine of the program has reached DRAFT"
        actor: system
        preconditions:
          - "Program.settlement_status == CREDITED"
          - "no ReconciliationLine of this program has status == APPROVED"
        side_effects:
          - "sets Program.management_fee_cents = 0, Program.final_client_total_cents = 0 and Program.invoice_issued_at = null"
          - "increments Program.version by 1"
        note: "Revert cycle on the settlement dimension: RECONCILING -> CLIENT_INVOICED -> CREDITED -> RECONCILING."
      - from: CLIENT_INVOICED
        to: SETTLED
        trigger: "system event — evaluated at the end of every SettlementPayment transition into PAID"
        actor: system
        preconditions:
          - "Program.settlement_status == CLIENT_INVOICED"
          - "Program.supplier_open_payable_cents == 0"
          - "at least one SettlementPayment of this program has status == PAID"
        side_effects:
          - "every SupplierContract of this program with status == ACTIVE transitions to CLOSED"
          - "increments Program.version by 1"

  # --- SupplierContract (cyclic negotiation rounds) --------------------------
  - entity: SupplierContract
    initial_state: DRAFT
    terminal_states: [CLOSED, TERMINATED]
    transitions:
      - from: DRAFT
        to: SENT
        trigger: "POST /dmc/supplier-contracts/{contract_id}/send"
        actor: SupplierManager
        preconditions:
          - "SupplierContract.status == DRAFT"
          - "Supplier.status == APPROVED for contract.supplier_id (else ERR_SUPPLIER_NOT_APPROVED)"
          - "Supplier.coi_verified == true AND Supplier.insurance_expires_on >= logical clock now AND Supplier.insurance_liability_limit_cents >= contract.required_liability_limit_cents (else ERR_SUPPLIER_INSURANCE_INSUFFICIENT)"
        side_effects:
          - "sets SupplierContract.sent_by_user_id = X-User-ID of the caller"
          - "SupplierContract.round_count += 1"
          - "increments SupplierContract.version by 1"
      - from: SENT
        to: COUNTERED
        trigger: "POST /dmc/supplier-contracts/{contract_id}/counter"
        actor: Supplier
        preconditions:
          - "SupplierContract.status == SENT"
          - "X-User-ID == SupplierContract.supplier_id (else ERR_NOT_RESOURCE_OWNER)"
          - "SupplierContract.round_count < 3 (else ERR_NEGOTIATION_ROUNDS_EXHAUSTED)"
        side_effects:
          - "sets SupplierContract.contract_value_cents = countered_value_cents from the request body"
          - "increments SupplierContract.version by 1"
      - from: COUNTERED
        to: SENT
        trigger: "POST /dmc/supplier-contracts/{contract_id}/send"
        actor: SupplierManager
        preconditions:
          - "SupplierContract.status == COUNTERED"
          - "SupplierContract.round_count < 3 (else ERR_NEGOTIATION_ROUNDS_EXHAUSTED)"
        side_effects:
          - "sets SupplierContract.sent_by_user_id = X-User-ID of the caller"
          - "SupplierContract.round_count += 1"
          - "increments SupplierContract.version by 1"
        note: "Cycle edge: SENT -> COUNTERED -> SENT, bounded by MAX_NEGOTIATION_ROUNDS = 3."
      - from: SENT | COUNTERED
        to: ACTIVE
        trigger: "POST /dmc/supplier-contracts/{contract_id}/countersign"
        actor: SupplierManager
        preconditions:
          - "SupplierContract.status IN {SENT, COUNTERED}"
          - "X-User-ID != SupplierContract.sent_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
          - "Supplier.insurance_expires_on >= logical clock now AND Supplier.insurance_liability_limit_cents >= contract.required_liability_limit_cents (else ERR_SUPPLIER_INSURANCE_INSUFFICIENT)"
        side_effects:
          - "sets SupplierContract.countersigned_by_user_id = X-User-ID of the caller"
          - "sets SupplierContract.deposit_due_cents = round_half_up(contract_value_cents * deposit_pct)"
          - "sets SupplierContract.deposit_paid_cents = SupplierContract.deposit_due_cents"
          - "increments SupplierContract.version by 1"
      - from: DRAFT | SENT | COUNTERED | ACTIVE
        to: TERMINATED
        trigger: "POST /dmc/supplier-contracts/{contract_id}/terminate"
        actor: SupplierManager
        preconditions:
          - "SupplierContract.status IN {DRAFT, SENT, COUNTERED, ACTIVE}"
          - "no SettlementPayment with contract_id == this contract has status IN {APPROVED, PAID} (else ERR_SETTLEMENT_ALREADY_PAID)"
        side_effects:
          - "sets SupplierContract.deposit_paid_cents = 0"
          - "every ProgramElement with element.program_id == contract.program_id AND element.supplier_id == contract.supplier_id AND status IN {PLANNED, PERMIT_BLOCKED, READY} transitions to CANCELLED (each such element transition itself runs calculations.cancellation_penalty and its own staff-release cascade)"
          - "increments SupplierContract.version by 1"
      - from: ACTIVE
        to: CLOSED
        trigger: "system event — cascaded from Program.settlement_status CLIENT_INVOICED -> SETTLED"
        actor: system
        preconditions:
          - "SupplierContract.status == ACTIVE"
          - "Program.settlement_status of contract.program_id has just become SETTLED"
        side_effects:
          - "increments SupplierContract.version by 1"

  # --- Permit (branching decision + revision cycle) -------------------------
  - entity: Permit
    initial_state: DRAFT
    terminal_states: [APPROVED, DENIED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /dmc/permits/{permit_id}/submit"
        actor: PermitOfficer
        preconditions:
          - "Permit.status == DRAFT"
          - "ProgramElement.status of permit.element_id IN {PLANNED, PERMIT_BLOCKED} (else ERR_INVALID_STATE_TRANSITION)"
          - "floor((element.starts_at - logical clock now) / 86400 seconds) >= Permit.lead_time_days_required (else ERR_PERMIT_LEAD_TIME_INSUFFICIENT)"
        side_effects:
          - "sets Permit.submitted_at to the logical clock instant"
          - "increments Permit.version by 1"
      - from: CONDITIONS_REQUESTED
        to: SUBMITTED
        trigger: "POST /dmc/permits/{permit_id}/submit"
        actor: PermitOfficer
        preconditions:
          - "Permit.status == CONDITIONS_REQUESTED"
          - "floor((element.starts_at - logical clock now) / 86400 seconds) >= Permit.lead_time_days_required (else ERR_PERMIT_LEAD_TIME_INSUFFICIENT)"
        side_effects:
          - "sets Permit.submitted_at to the logical clock instant"
          - "Permit.resubmission_count += 1"
          - "increments Permit.version by 1"
        note: "Cycle edge: SUBMITTED -> CONDITIONS_REQUESTED -> SUBMITTED."
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /dmc/permits/{permit_id}/record-decision with decision = APPROVED"
        actor: PermitOfficer
        preconditions:
          - "Permit.status == SUBMITTED"
        side_effects:
          - "sets Permit.decision_at to the logical clock instant"
          - "when ProgramElement.status of permit.element_id == PERMIT_BLOCKED and no Permit of that element has status IN {DRAFT, SUBMITTED, CONDITIONS_REQUESTED, DENIED}, that element transitions PERMIT_BLOCKED -> PLANNED"
          - "increments Permit.version by 1"
      - from: SUBMITTED
        to: CONDITIONS_REQUESTED
        trigger: "POST /dmc/permits/{permit_id}/record-decision with decision = CONDITIONS_REQUESTED"
        actor: PermitOfficer
        preconditions:
          - "Permit.status == SUBMITTED"
          - "conditions_note is present and non-empty in the request body (else ERR_INVALID_REQUEST)"
        side_effects:
          - "sets Permit.conditions_note from the request body and Permit.decision_at to the logical clock instant"
          - "increments Permit.version by 1"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /dmc/permits/{permit_id}/record-decision with decision = DENIED"
        actor: PermitOfficer
        preconditions:
          - "Permit.status == SUBMITTED"
        side_effects:
          - "sets Permit.decision_at to the logical clock instant"
          - "link 1: the ProgramElement identified by permit.element_id, when its status IN {PLANNED, READY}, transitions to PERMIT_BLOCKED"
          - "link 2: caused by link 1 — every StaffAssignment with element_id == that element and status IN {PROPOSED, CONFIRMED} transitions to RELEASED"
          - "link 3: caused by each link-2 release — the StaffMember of that assignment has confirmed_minutes_total decremented by the assignment's scheduled minutes, and Program.staffing_gap_count is incremented by one"
          - "increments Permit.version by 1"
        note: "Depth-4 transitive cascade: Permit -> ProgramElement -> StaffAssignment -> StaffMember/Program."

  # --- ProgramElement -------------------------------------------------------
  - entity: ProgramElement
    initial_state: PLANNED
    terminal_states: [DELIVERED, WEATHER_SWITCHED, CANCELLED]
    transitions:
      - from: PLANNED
        to: READY
        trigger: "POST /dmc/program-elements/{element_id}/mark-ready"
        actor: OperationsCoordinator
        preconditions:
          - "ProgramElement.status == PLANNED"
          - "Program.execution_status of element.program_id IN {CONFIRMED, IN_EXECUTION} (else ERR_PROGRAM_NOT_CONFIRMED)"
          - "no Permit with element_id == this element has status IN {DRAFT, SUBMITTED, CONDITIONS_REQUESTED, DENIED} (else ERR_PERMIT_NOT_APPROVED)"
          - "when Venue.requires_special_venue_permit == true for element.venue_id, a Permit with element_id == this element AND permit_type == SPECIAL_VENUE AND status == APPROVED exists (else ERR_PERMIT_NOT_APPROVED)"
          - "a SupplierContract exists with program_id == element.program_id AND supplier_id == element.supplier_id AND status == ACTIVE (else ERR_NO_ACTIVE_SUPPLIER_CONTRACT)"
          - "element.predecessor_element_id is null OR that element's status == DELIVERED (else ERR_PREDECESSOR_NOT_DELIVERED)"
        side_effects:
          - "increments ProgramElement.version by 1"
      - from: PLANNED | READY
        to: PERMIT_BLOCKED
        trigger: "system event — cascaded from Permit SUBMITTED -> DENIED"
        actor: system
        preconditions:
          - "ProgramElement.status IN {PLANNED, READY}"
          - "a Permit with element_id == this element has just transitioned to DENIED"
        side_effects:
          - "every StaffAssignment with element_id == this element and status IN {PROPOSED, CONFIRMED} transitions to RELEASED"
          - "recomputes Program.open_element_count (unchanged — PERMIT_BLOCKED is still an open status)"
          - "increments ProgramElement.version by 1"
      - from: PERMIT_BLOCKED
        to: PLANNED
        trigger: "system event — cascaded from Permit SUBMITTED -> APPROVED when the element has no remaining non-APPROVED permit"
        actor: system
        preconditions:
          - "ProgramElement.status == PERMIT_BLOCKED"
          - "no Permit with element_id == this element has status IN {DRAFT, SUBMITTED, CONDITIONS_REQUESTED, DENIED}"
        side_effects:
          - "increments ProgramElement.version by 1"
        note: "Cycle edge on the element machine: PLANNED -> PERMIT_BLOCKED -> PLANNED."
      - from: READY
        to: DELIVERED
        trigger: "POST /dmc/program-elements/{element_id}/deliver"
        actor: OperationsCoordinator
        preconditions:
          - "ProgramElement.status == READY"
          - "Program.execution_status of element.program_id == IN_EXECUTION (else ERR_PROGRAM_NOT_IN_EXECUTION)"
          - "logical clock now >= ProgramElement.starts_at (else ERR_ELEMENT_NOT_STARTED)"
          - "actual_headcount >= 0 is present in the request body (else ERR_INVALID_REQUEST)"
        side_effects:
          - "sets ProgramElement.actual_headcount from the request body and ProgramElement.delivered_at to the logical clock instant"
          - "every StaffAssignment with element_id == this element and status == CHECKED_IN transitions to COMPLETED; each such transition runs calculations.staff_labor_cost variant ACTUAL and writes actual_labor_cost_cents"
          - "every StaffAssignment with element_id == this element and status == CONFIRMED transitions to NO_SHOW; each such transition sets actual_labor_cost_cents = 0, decrements StaffMember.confirmed_minutes_total and increments Program.staffing_gap_count"
          - "recomputes Program.actual_attendance_total and Program.open_element_count"
          - "when Program.open_element_count reaches 0 and Program.execution_status == IN_EXECUTION, Program transitions IN_EXECUTION -> COMPLETED"
          - "increments ProgramElement.version by 1"
      - from: READY
        to: WEATHER_SWITCHED
        trigger: "POST /dmc/program-elements/{element_id}/weather-switch"
        actor: OperationsCoordinator
        preconditions:
          - "ProgramElement.status == READY"
          - "ProgramElement.is_weather_dependent == true (else ERR_ELEMENT_NOT_WEATHER_DEPENDENT)"
          - "Program.execution_status of element.program_id == IN_EXECUTION (else ERR_PROGRAM_NOT_IN_EXECUTION)"
          - "exactly one ProgramElement exists with alternative_for_element_id == this element's id AND status == PLANNED; when zero such elements exist the request is refused with ERR_NO_WEATHER_ALTERNATIVE, and when more than one exists the one with the earliest starts_at is selected, tie-broken by earliest created_at"
          - "the selected alternative element has no Permit with status IN {DRAFT, SUBMITTED, CONDITIONS_REQUESTED, DENIED} (else ERR_PERMIT_NOT_APPROVED)"
        side_effects:
          - "the selected alternative ProgramElement transitions PLANNED -> READY"
          - "every StaffAssignment with element_id == this element and status IN {PROPOSED, CONFIRMED} transitions to RELEASED; each such transition decrements StaffMember.confirmed_minutes_total (when the prior status was CONFIRMED) and increments Program.staffing_gap_count"
          - "recomputes Program.open_element_count"
          - "increments ProgramElement.version by 1"
      - from: PLANNED | PERMIT_BLOCKED | READY
        to: CANCELLED
        trigger: "POST /dmc/program-elements/{element_id}/cancel, or system event cascaded from Program cancel or SupplierContract terminate"
        actor: ProgramDirector | system
        preconditions:
          - "ProgramElement.status IN {PLANNED, PERMIT_BLOCKED, READY}"
          - "Program.settlement_status of element.program_id == NOT_STARTED (else ERR_PROGRAM_ALREADY_RECONCILING)"
        side_effects:
          - "runs calculations.cancellation_penalty and writes ProgramElement.cancellation_penalty_cents"
          - "every StaffAssignment with element_id == this element and status IN {PROPOSED, CONFIRMED} transitions to RELEASED; each such transition decrements StaffMember.confirmed_minutes_total (when the prior status was CONFIRMED) and increments Program.staffing_gap_count"
          - "recomputes Program.open_element_count"
          - "when Program.open_element_count reaches 0 and Program.execution_status == IN_EXECUTION, Program transitions IN_EXECUTION -> COMPLETED"
          - "increments ProgramElement.version by 1"

  # --- TransportSegment -----------------------------------------------------
  - entity: TransportSegment
    initial_state: SCHEDULED
    terminal_states: [DEPARTED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: DEPARTED
        trigger: "POST /dmc/transport-segments/{segment_id}/depart"
        actor: OperationsCoordinator
        preconditions:
          - "TransportSegment.status == SCHEDULED"
          - "Program.execution_status of segment.program_id == IN_EXECUTION (else ERR_PROGRAM_NOT_IN_EXECUTION)"
          - "logical clock now >= TransportSegment.depart_at (else ERR_SEGMENT_NOT_DUE)"
          - "TransportSegment.booked_seat_count >= 1 (else ERR_EMPTY_MANIFEST)"
        side_effects:
          - "sets TransportSegment.departed_at to the logical clock instant"
          - "every ManifestEntry with segment_id == this segment and status == ASSIGNED transitions to NO_SHOW"
          - "recomputes TransportSegment.booked_seat_count over entries with status IN {ASSIGNED, CHECKED_IN} (only CHECKED_IN entries remain)"
          - "recomputes Program.seated_guest_count"
          - "every StaffAssignment with segment_id == this segment and status == CHECKED_IN transitions to COMPLETED, running calculations.staff_labor_cost variant ACTUAL"
          - "increments TransportSegment.version by 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /dmc/transport-segments/{segment_id}/cancel, or system event cascaded from Program cancel"
        actor: OperationsCoordinator | system
        preconditions:
          - "TransportSegment.status == SCHEDULED"
        side_effects:
          - "link 1: every ManifestEntry with segment_id == this segment and status IN {ASSIGNED, CHECKED_IN} transitions to RELEASED"
          - "link 2: caused by each link-1 release — TransportSegment.booked_seat_count is decremented by that entry's seat_count and Program.unseated_guest_count is incremented by one"
          - "link 3: caused by link 2 — Program.seated_guest_count is recomputed as the sum of booked_seat_count over the program's segments"
          - "every StaffAssignment with segment_id == this segment and status IN {PROPOSED, CONFIRMED} transitions to RELEASED"
          - "increments TransportSegment.version by 1"
        note: "Depth-3 transitive cascade: TransportSegment -> ManifestEntry -> Program."

  # --- ManifestEntry --------------------------------------------------------
  - entity: ManifestEntry
    initial_state: ASSIGNED
    terminal_states: [RELEASED, NO_SHOW]
    transitions:
      - from: ASSIGNED
        to: ASSIGNED
        trigger: "POST /dmc/manifest-entries/{manifest_entry_id}/move"
        actor: OperationsCoordinator
        preconditions:
          - "ManifestEntry.status == ASSIGNED"
          - "source TransportSegment.status == SCHEDULED AND target TransportSegment.status == SCHEDULED (else ERR_INVALID_STATE_TRANSITION)"
          - "target_segment_id != ManifestEntry.segment_id (else ERR_INVALID_REQUEST)"
          - "target segment's program_id == source segment's program_id (else ERR_SEGMENT_PROGRAM_MISMATCH)"
          - "target.booked_seat_count + ManifestEntry.seat_count <= target.seat_capacity (else ERR_SEGMENT_CAPACITY_EXCEEDED)"
          - "when ManifestEntry.mobility_assist == true, target.wheelchair_accessible == true (else ERR_ACCESSIBILITY_UNMET)"
          - "no other ManifestEntry on the target segment with status IN {ASSIGNED, CHECKED_IN} has the same guest_ref (else ERR_DUPLICATE_MANIFEST_ENTRY)"
        side_effects:
          - "sets ManifestEntry.segment_id = target_segment_id and increments ManifestEntry.move_count by 1"
          - "source TransportSegment.booked_seat_count -= ManifestEntry.seat_count; target TransportSegment.booked_seat_count += ManifestEntry.seat_count"
          - "Program.seated_guest_count is recomputed and is unchanged by this transition (seat-conservation invariant)"
          - "increments ManifestEntry.version by 1"
        note: "Self-transition — the entry stays ASSIGNED while its segment_id changes."
      - from: ASSIGNED
        to: CHECKED_IN
        trigger: "POST /dmc/manifest-entries/{manifest_entry_id}/check-in"
        actor: OperationsCoordinator
        preconditions:
          - "ManifestEntry.status == ASSIGNED"
          - "TransportSegment.status of entry.segment_id == SCHEDULED (else ERR_INVALID_STATE_TRANSITION)"
          - "logical clock now >= (segment.depart_at - 120 minutes) (else ERR_CHECKIN_WINDOW_NOT_OPEN)"
        side_effects:
          - "TransportSegment.booked_seat_count unchanged (both ASSIGNED and CHECKED_IN count toward occupancy)"
          - "increments ManifestEntry.version by 1"
      - from: ASSIGNED | CHECKED_IN
        to: RELEASED
        trigger: "system event — cascaded from TransportSegment SCHEDULED -> CANCELLED"
        actor: system
        preconditions:
          - "ManifestEntry.status IN {ASSIGNED, CHECKED_IN}"
        side_effects:
          - "TransportSegment.booked_seat_count -= ManifestEntry.seat_count"
          - "Program.unseated_guest_count += 1"
          - "increments ManifestEntry.version by 1"
      - from: ASSIGNED
        to: NO_SHOW
        trigger: "system event — cascaded from TransportSegment SCHEDULED -> DEPARTED"
        actor: system
        preconditions:
          - "ManifestEntry.status == ASSIGNED at the moment the segment departs"
        side_effects:
          - "TransportSegment.booked_seat_count -= ManifestEntry.seat_count"
          - "increments ManifestEntry.version by 1"

  # --- StaffAssignment ------------------------------------------------------
  - entity: StaffAssignment
    initial_state: PROPOSED
    terminal_states: [COMPLETED, RELEASED, NO_SHOW]
    transitions:
      - from: PROPOSED
        to: CONFIRMED
        trigger: "POST /dmc/staff-assignments/{staff_assignment_id}/confirm"
        actor: ProgramDirector
        preconditions:
          - "StaffAssignment.status == PROPOSED"
          - "Program.execution_status of assignment.program_id IN {DESIGN_LOCKED, CONFIRMED, IN_EXECUTION} (else ERR_PROGRAM_NOT_CONFIRMED)"
          - "StaffMember.status of assignment.staff_id == ACTIVE (else ERR_STAFF_INACTIVE)"
          - "StaffMember.credential_status of assignment.staff_id == VALID (else ERR_CREDENTIAL_EXPIRED)"
          - "StaffAssignment.role_type == StaffMember.role_type (else ERR_STAFF_ROLE_MISMATCH)"
          - "no other StaffAssignment of the same staff_id with status IN {CONFIRMED, CHECKED_IN, COMPLETED} overlaps this assignment's closed interval [starts_at, ends_at] (else ERR_STAFF_ASSIGNMENT_OVERLAP)"
          - "for every other StaffAssignment of the same staff_id with status IN {CONFIRMED, CHECKED_IN, COMPLETED}, the gap between the two closed intervals is >= StaffMember.min_rest_minutes (else ERR_STAFF_REST_GAP_VIOLATION)"
          - "StaffMember.confirmed_minutes_total contribution within the UTC calendar day of starts_at, plus this assignment's minutes, is <= StaffMember.max_daily_minutes (else ERR_STAFF_DAILY_LIMIT_EXCEEDED)"
        side_effects:
          - "runs calculations.staff_labor_cost variant PLANNED and writes StaffAssignment.planned_labor_cost_cents"
          - "StaffMember.confirmed_minutes_total += the assignment's scheduled minutes"
          - "increments StaffAssignment.version by 1"
      - from: CONFIRMED
        to: CHECKED_IN
        trigger: "POST /dmc/staff-assignments/{staff_assignment_id}/check-in"
        actor: OperationsCoordinator
        preconditions:
          - "StaffAssignment.status == CONFIRMED"
          - "X-User-ID == StaffAssignment.staff_id (else ERR_NOT_RESOURCE_OWNER)"
          - "Program.execution_status of assignment.program_id == IN_EXECUTION (else ERR_PROGRAM_NOT_IN_EXECUTION)"
          - "logical clock now >= (StaffAssignment.starts_at - 60 minutes) AND logical clock now <= StaffAssignment.ends_at (else ERR_CHECKIN_WINDOW_NOT_OPEN)"
        side_effects:
          - "sets StaffAssignment.check_in_at to the logical clock instant"
          - "increments StaffAssignment.version by 1"
      - from: CHECKED_IN
        to: COMPLETED
        trigger: "system event — cascaded from ProgramElement READY -> DELIVERED or TransportSegment SCHEDULED -> DEPARTED"
        actor: system
        preconditions:
          - "StaffAssignment.status == CHECKED_IN"
        side_effects:
          - "sets StaffAssignment.completed_at to the logical clock instant"
          - "runs calculations.staff_labor_cost variant ACTUAL and writes StaffAssignment.actual_labor_cost_cents"
          - "increments StaffAssignment.version by 1"
      - from: CONFIRMED
        to: NO_SHOW
        trigger: "system event — cascaded from ProgramElement READY -> DELIVERED for assignments never checked in"
        actor: system
        preconditions:
          - "StaffAssignment.status == CONFIRMED at the moment the element is delivered"
        side_effects:
          - "sets StaffAssignment.actual_labor_cost_cents = 0"
          - "StaffMember.confirmed_minutes_total -= the assignment's scheduled minutes"
          - "Program.staffing_gap_count += 1"
          - "increments StaffAssignment.version by 1"
      - from: PROPOSED | CONFIRMED
        to: RELEASED
        trigger: "POST /dmc/staff-assignments/{staff_assignment_id}/release, or system event cascaded from ProgramElement -> PERMIT_BLOCKED / CANCELLED / WEATHER_SWITCHED or TransportSegment -> CANCELLED"
        actor: ProgramDirector | system
        preconditions:
          - "StaffAssignment.status IN {PROPOSED, CONFIRMED}"
        side_effects:
          - "when the prior status was CONFIRMED: StaffMember.confirmed_minutes_total -= the assignment's scheduled minutes and Program.staffing_gap_count += 1"
          - "when the prior status was PROPOSED: StaffMember.confirmed_minutes_total and Program.staffing_gap_count are unchanged"
          - "increments StaffAssignment.version by 1"

  # --- ReconciliationLine (cyclic reopen) -----------------------------------
  - entity: ReconciliationLine
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: APPROVED
        trigger: "POST /dmc/reconciliation-lines/{reconciliation_line_id}/approve"
        actor: ProgramDirector
        preconditions:
          - "ReconciliationLine.status == DRAFT"
          - "Program.settlement_status of line.program_id == RECONCILING (else ERR_PROGRAM_NOT_RECONCILING)"
          - "ReconciliationLine.variance_pct <= 0.10 OR ReconciliationLine.variance_reason is non-null and non-empty (else ERR_VARIANCE_REASON_REQUIRED)"
        side_effects:
          - "recomputes Program.final_subtotal_cents, Program.disclosed_markup_cents, Program.supplier_gross_payable_cents and Program.supplier_open_payable_cents"
          - "increments ReconciliationLine.version by 1"
      - from: APPROVED
        to: DRAFT
        trigger: "system event — cascaded from Program.settlement_status CLIENT_INVOICED -> CREDITED"
        actor: system
        preconditions:
          - "ReconciliationLine.status == APPROVED"
        side_effects:
          - "recomputes Program.final_subtotal_cents, Program.disclosed_markup_cents, Program.supplier_gross_payable_cents and Program.supplier_open_payable_cents"
          - "increments ReconciliationLine.version by 1"
        note: "Cycle edge: DRAFT -> APPROVED -> DRAFT when the client invoice is credited."

  # --- SettlementPayment ----------------------------------------------------
  - entity: SettlementPayment
    initial_state: PENDING
    terminal_states: [PAID, VOID]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /dmc/settlement-payments/{settlement_payment_id}/approve"
        actor: Controller
        preconditions:
          - "SettlementPayment.status == PENDING"
          - "Program.settlement_status of payment.program_id IN {RECONCILING, CLIENT_INVOICED} (else ERR_PROGRAM_NOT_RECONCILING)"
          - "SupplierContract.status of payment.contract_id == ACTIVE (else ERR_CONTRACT_NOT_ACTIVE)"
          - "SettlementPayment.net_payable_cents <= Program.supplier_open_payable_cents (else ERR_SETTLEMENT_EXCEEDS_OPEN_PAYABLE)"
        side_effects:
          - "sets SettlementPayment.approved_by_user_id = X-User-ID of the caller"
          - "Program.supplier_settled_cents += SettlementPayment.net_payable_cents and Program.supplier_open_payable_cents -= SettlementPayment.net_payable_cents"
          - "increments SettlementPayment.version by 1"
      - from: APPROVED
        to: PAID
        trigger: "POST /dmc/settlement-payments/{settlement_payment_id}/release"
        actor: Controller
        preconditions:
          - "SettlementPayment.status == APPROVED"
          - "X-User-ID != SettlementPayment.approved_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "sets SettlementPayment.released_by_user_id = X-User-ID of the caller"
          - "when Program.settlement_status == CLIENT_INVOICED and Program.supplier_open_payable_cents == 0, Program transitions CLIENT_INVOICED -> SETTLED"
          - "increments SettlementPayment.version by 1"
      - from: PENDING | APPROVED
        to: VOID
        trigger: "POST /dmc/settlement-payments/{settlement_payment_id}/void"
        actor: Controller
        preconditions:
          - "SettlementPayment.status IN {PENDING, APPROVED}"
        side_effects:
          - "when the prior status was APPROVED: Program.supplier_settled_cents -= SettlementPayment.net_payable_cents and Program.supplier_open_payable_cents += SettlementPayment.net_payable_cents, restoring the money-conservation invariant"
          - "when the prior status was PENDING: no Program money field changes"
          - "increments SettlementPayment.version by 1"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: element-create-stale-program
    parent_entity: Program
    write_endpoint: "POST /dmc/program-elements"
    occ_field: "expected_program_version"
    description: |
      Creating a ProgramElement against a Program whose version has advanced
      since the client last observed it is rejected. A newly created element
      legitimately supersedes the program's design snapshot (it changes
      element_count, open_element_count and therefore the estimate basis), so a
      writer holding a stale view of the program must re-read before adding.
    error_id: ERR_STALE_PROGRAM_VERSION
    http_status: 412

  - rule_id: settlement-create-stale-contract
    parent_entity: SupplierContract
    write_endpoint: "POST /dmc/settlement-payments"
    occ_field: "expected_contract_version"
    description: |
      Creating a SettlementPayment against a SupplierContract whose version has
      advanced since the client last observed it is rejected. The payment's
      gross and deposit-applied figures are derived from the contract's
      deposit_paid_cents and status at creation time, so a writer holding a
      stale contract view would settle against superseded deposit terms.
    error_id: ERR_STALE_CONTRACT_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: element_billable_headcount
    trigger: "ESTIMATE variant runs inside program_client_total at the Program DESIGN_LOCKED -> CONFIRMED transition; FINAL variant runs once per created ReconciliationLine during POST /dmc/programs/{program_id}/reconcile"
    algorithm: threshold
    formula: |
      # ESTIMATE variant — pre-execution, guarantee-or-plan whichever is larger
      estimate_billed = max(element.planned_headcount, element.guaranteed_headcount)

      # FINAL variant — post-execution, attrition floor protects the supplier
      attrition_floor = ceil(element.guaranteed_headcount * ATTRITION_FLOOR_PCT)
      final_billed    = max(attrition_floor, element.actual_headcount)

      # CANCELLATION_PENALTY lines are not head-count billed
      if line_kind == "CANCELLATION_PENALTY": final_billed = 0
    input_set: |
      ESTIMATE: every ProgramElement of the program with status IN {PLANNED, READY}
      (PERMIT_BLOCKED elements cannot exist at confirm time; CANCELLED,
      WEATHER_SWITCHED and DELIVERED elements are excluded).
      FINAL: every ProgramElement of the program with status IN {DELIVERED, CANCELLED},
      processed in element.starts_at ASC order with created_at ASC as tie-break.
    constants:
      ATTRITION_FLOOR_PCT: 0.85
    precision: "integer head count; ceil() applied to the attrition floor only"
    variants:
      - name: ESTIMATE
        when: "Program DESIGN_LOCKED -> CONFIRMED (no attendance recorded yet)"
        difference: "Uses max(planned_headcount, guaranteed_headcount) and ignores the attrition floor entirely."
      - name: FINAL
        when: "POST /dmc/programs/{program_id}/reconcile (attendance recorded)"
        difference: "Uses max(ceil(guaranteed_headcount * 0.85), actual_headcount); for the same element with planned 110, guaranteed 100 and actual 70 the two variants yield 110 and 85 respectively."

  - name: staff_labor_cost
    trigger: "PLANNED variant runs at StaffAssignment PROPOSED -> CONFIRMED; ACTUAL variant runs at StaffAssignment CHECKED_IN -> COMPLETED and at CONFIRMED -> NO_SHOW"
    algorithm: tiered_pricing
    formula: |
      # ---- minute basis differs per variant -------------------------------
      planned_minutes = (assignment.ends_at - assignment.starts_at) in whole minutes
      actual_minutes  = (assignment.completed_at - assignment.check_in_at) in whole minutes
                        # 0 when the assignment reached NO_SHOW (never checked in)

      minutes = planned_minutes  (PLANNED variant)  |  actual_minutes (ACTUAL variant)

      # ---- non-linear rate ladder over 3 inputs ---------------------------
      if minutes == 0:
        cost_cents = 0
      else:
        billable_minutes = max(minutes, MIN_CALL_OUT_MINUTES)
        regular_minutes  = min(billable_minutes, OT_THRESHOLD_MINUTES)
        ot_minutes       = max(0, billable_minutes - OT_THRESHOLD_MINUTES)
        regular_cents = round_half_up(regular_minutes / 60 * staff.pay_rate_cents_per_hour)
        ot_cents      = round_half_up(ot_minutes / 60 * staff.pay_rate_cents_per_hour * OT_MULTIPLIER)
        cost_cents    = regular_cents + ot_cents     # each leg rounded, THEN summed
    input_set: "The single StaffAssignment being transitioned, plus StaffMember.pay_rate_cents_per_hour of assignment.staff_id."
    constants:
      MIN_CALL_OUT_MINUTES: 240
      OT_THRESHOLD_MINUTES: 480
      OT_MULTIPLIER: 1.5
    precision: "cents, round_half_up applied separately to the regular leg and the overtime leg before summing"
    variants:
      - name: PLANNED
        when: "PROPOSED -> CONFIRMED; written to planned_labor_cost_cents"
        difference: "Minute basis is the scheduled window ends_at - starts_at, independent of any check-in."
      - name: ACTUAL
        when: "CHECKED_IN -> COMPLETED (written to actual_labor_cost_cents) and CONFIRMED -> NO_SHOW (written as 0)"
        difference: "Minute basis is completed_at - check_in_at, so a coordinator who checks in late and whose element is delivered early bills fewer minutes than planned — yet the 240-minute call-out floor can make the ACTUAL figure equal the PLANNED figure for short shifts."

  - name: reconciliation_line_amounts
    trigger: "Runs once per ReconciliationLine created by POST /dmc/programs/{program_id}/reconcile"
    algorithm: aggregation
    formula: |
      if line_kind == "DELIVERY":
        supplier_cost_cents = billed_headcount * element.per_person_cost_cents
      else:  # CANCELLATION_PENALTY
        supplier_cost_cents = element.cancellation_penalty_cents

      # ROUNDING ORDER IS PINNED: round the markup PER LINE, then sum the lines.
      # (Summing supplier_cost first and rounding the markup once would differ
      #  by up to one cent per line; the per-line order is normative.)
      markup_cents        = round_half_up(supplier_cost_cents * program.markup_pct)
      client_charge_cents = supplier_cost_cents + markup_cents

      if line_kind == "DELIVERY" and element.guaranteed_headcount > 0:
        variance_pct = abs(element.actual_headcount - element.guaranteed_headcount)
                       / element.guaranteed_headcount
      else:
        variance_pct = 0
    input_set: "One ProgramElement per line; program.markup_pct read from the parent Program at reconcile time."
    constants:
      VARIANCE_TOLERANCE_PCT: 0.10
    precision: "cents, round_half_up, applied per line before any summation; variance_pct kept to 4 decimal places, round_half_up"
    variants: []

  - name: program_client_total
    trigger: "ESTIMATE variant runs at Program DESIGN_LOCKED -> CONFIRMED; FINAL variant runs at Program RECONCILING -> CLIENT_INVOICED"
    algorithm: waterfall_allocation
    formula: |
      # ---- Evaluation order is PINNED (steps 1..6). The management fee is a
      # ---- component of the total, but its tier is keyed on the pre-fee base,
      # ---- never on the total. Without this pin the definition is circular.
      # step 1
      subtotal_cents = sum(line_or_element supplier_cost_cents over the input set)
      # step 2
      markup_total_cents = sum(line_or_element markup_cents over the input set)
      # step 3
      base_cents = subtotal_cents + markup_total_cents
      # step 4 — tier selected on base_cents (NOT on total_cents)
      if base_cents < FEE_TIER_1_CEILING:            fee_pct = FEE_PCT_TIER_1
      elif base_cents < FEE_TIER_2_CEILING:          fee_pct = FEE_PCT_TIER_2
      else:                                          fee_pct = FEE_PCT_TIER_3
      # step 5
      management_fee_cents = round_half_up(base_cents * fee_pct)
      # step 6
      total_cents = base_cents + management_fee_cents
    input_set: |
      ESTIMATE: every ProgramElement of the program with status IN {PLANNED, READY};
      per element supplier_cost_cents = element_billable_headcount(ESTIMATE) *
      per_person_cost_cents and markup_cents = round_half_up(that cost *
      program.markup_pct), summed after per-element rounding.
      FINAL: every ReconciliationLine of the program with status == APPROVED, using
      the line's stored supplier_cost_cents and markup_cents.
    constants:
      FEE_TIER_1_CEILING: 500000
      FEE_TIER_2_CEILING: 2000000
      FEE_PCT_TIER_1: 0.12
      FEE_PCT_TIER_2: 0.09
      FEE_PCT_TIER_3: 0.07
    precision: "cents, round_half_up; tier comparison is strict `<` against the ceiling, so base_cents == 500000 falls in tier 2 and base_cents == 2000000 falls in tier 3"
    variants:
      - name: ESTIMATE
        when: "Program confirm; written to Program.estimated_client_total_cents"
        difference: "Input set is open ProgramElements using ESTIMATE head counts; nothing is written to final_subtotal_cents / disclosed_markup_cents / management_fee_cents."
      - name: FINAL
        when: "Program issue-invoice; written to final_subtotal_cents, disclosed_markup_cents, management_fee_cents and final_client_total_cents"
        difference: "Input set is APPROVED ReconciliationLines using FINAL head counts and includes CANCELLATION_PENALTY lines, which the ESTIMATE variant cannot see."

  - name: cancellation_penalty
    trigger: "Runs at every ProgramElement transition into CANCELLED (operator cancel, Program cancel cascade, or SupplierContract terminate cascade)"
    algorithm: threshold
    formula: |
      days_to_service = floor((element.starts_at - logical_clock_now) / 86400 seconds)
      # negative when the element start has already passed -> treated as tier "<7"

      if contract.cancellation_tier == "STANDARD":
        if   days_to_service >= 30: pct = 0.00
        elif days_to_service >= 15: pct = 0.25
        elif days_to_service >= 7:  pct = 0.50
        else:                       pct = 1.00
      else:  # STRICT
        if   days_to_service >= 45: pct = 0.10
        elif days_to_service >= 30: pct = 0.35
        elif days_to_service >= 8:  pct = 0.75
        else:                       pct = 1.00

      penalty_cents = round_half_up(element.planned_headcount
                                    * element.per_person_cost_cents * pct)
    input_set: |
      The element being cancelled, plus the SupplierContract selected as follows:
      eligibility filter = contracts with program_id == element.program_id AND
      supplier_id == element.supplier_id AND status IN {SENT, COUNTERED, ACTIVE,
      TERMINATED}; ranking = status ACTIVE first, then TERMINATED, then COUNTERED,
      then SENT; tie-break = latest created_at, then earliest created_at is
      impossible because created_at is unique per row; fallback when the candidate
      set is empty = cancellation_tier defaults to STANDARD.
    constants:
      STANDARD_TIER_DAYS: [30, 15, 7]
      STANDARD_TIER_PCTS: [0.00, 0.25, 0.50, 1.00]
      STRICT_TIER_DAYS: [45, 30, 8]
      STRICT_TIER_PCTS: [0.10, 0.35, 0.75, 1.00]
    precision: "cents, round_half_up; tier comparisons are inclusive `>=`, so exactly 30 whole days out on STANDARD yields pct 0.00"
    variants: []

  - name: settlement_net_payable
    trigger: "Runs at POST /dmc/settlement-payments (creation), stamping gross_cents, deposit_applied_cents, net_payable_cents and overpayment_credit_cents"
    algorithm: waterfall_allocation
    formula: |
      # gross for this supplier on this program
      gross_cents = sum(line.supplier_cost_cents
                        for ReconciliationLine line
                        where line.program_id == payment.program_id
                          and line.supplier_id == payment.supplier_id
                          and line.status == "APPROVED")

      # deposit waterfall: the contract deposit is consumed by the supplier's
      # lines in a fixed order — CANCELLATION_PENALTY lines first, then DELIVERY
      # lines; within each group by element.starts_at ASC, tie-break created_at ASC.
      remaining_deposit = contract.deposit_paid_cents
      for line in ordered_lines:
        applied = min(remaining_deposit, line.supplier_cost_cents)
        remaining_deposit -= applied
      deposit_applied_cents   = contract.deposit_paid_cents - remaining_deposit
      net_payable_cents       = max(0, gross_cents - deposit_applied_cents)
      overpayment_credit_cents = remaining_deposit
    input_set: "APPROVED ReconciliationLines of (program_id, supplier_id); the SupplierContract identified by payment.contract_id supplies deposit_paid_cents."
    constants: {}
    precision: "integer cents; no rounding occurs — the waterfall only redistributes existing integer amounts, so deposit_applied_cents + overpayment_credit_cents == contract.deposit_paid_cents exactly"
    variants: []

  - name: staff_credential_status
    trigger: "Evaluated on every read of a StaffMember and inside the StaffAssignment PROPOSED -> CONFIRMED precondition"
    algorithm: decay_function
    formula: |
      earliest_expiry = min(staff.badge_expires_on, staff.first_aid_expires_on)
      if earliest_expiry < logical_clock_now:
        credential_status = "EXPIRED"
      elif earliest_expiry <= logical_clock_now + CREDENTIAL_EXPIRING_WINDOW_DAYS days:
        credential_status = "EXPIRING"
      else:
        credential_status = "VALID"
    input_set: "The single StaffMember row; both credential expiry fields are always populated."
    constants:
      CREDENTIAL_EXPIRING_WINDOW_DAYS: 14
    precision: "instant comparison at millisecond resolution; expiry exactly equal to the clock is still valid (EXPIRING, not EXPIRED)"
    variants: []

  - name: segment_seat_occupancy
    trigger: "Recomputed at POST /dmc/manifest-entries, at manifest move, at manifest release/no-show cascades, and at TransportSegment depart"
    algorithm: aggregation
    formula: |
      booked_seat_count = sum(entry.seat_count
                              for ManifestEntry entry
                              where entry.segment_id == segment.id
                                and entry.status IN {"ASSIGNED", "CHECKED_IN"})

      # capacity gate on create and on move (inclusive-equal is ALLOWED):
      reject when booked_seat_count + candidate.seat_count > segment.seat_capacity

      # program-level conserved quantity
      program.seated_guest_count = sum(segment.booked_seat_count
                                       for TransportSegment segment
                                       where segment.program_id == program.id)
    input_set: "ManifestEntry rows of the segment with status IN {ASSIGNED, CHECKED_IN}; RELEASED and NO_SHOW entries are excluded."
    constants: {}
    precision: "integer seats; the capacity comparison is strict `>` so filling the vehicle to exactly seat_capacity succeeds"
    variants: []

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
#
# Domain priority rationale: authentication -> authorization -> existence ->
# ownership -> request shape -> optimistic concurrency -> state preconditions ->
# safety & insurance compliance -> temporal geometry -> structural constraints ->
# referential prerequisites -> fiscal limits & segregation of duties.
# Insurance/credential compliance outranks scheduling geometry because the DMC
# may not put an uninsured supplier or an uncredentialed greeter in front of a
# client under any scheduling circumstance; fiscal checks run last because money
# figures are only meaningful once the operational picture is legal.
# =============================================================================
validations:

  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID request headers are present and X-User-Role is one of the six declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "X-User-Role is listed in the called endpoint's roles set in §1.5"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Every path-templated id resolves to an existing row, validated left-to-right"
    error_id: "ERR_PROGRAM_NOT_FOUND | ERR_VENUE_NOT_FOUND | ERR_SUPPLIER_NOT_FOUND | ERR_CONTRACT_NOT_FOUND | ERR_ELEMENT_NOT_FOUND | ERR_PERMIT_NOT_FOUND | ERR_SEGMENT_NOT_FOUND | ERR_MANIFEST_ENTRY_NOT_FOUND | ERR_STAFF_MEMBER_NOT_FOUND | ERR_STAFF_ASSIGNMENT_NOT_FOUND | ERR_RECONCILIATION_LINE_NOT_FOUND | ERR_SETTLEMENT_PAYMENT_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path parameters"

  - priority: 4
    category: existence
    check: "Every foreign-key id supplied in the request body resolves to an existing row, validated in the field order declared by the endpoint's input list"
    error_id: "ERR_PROGRAM_NOT_FOUND | ERR_VENUE_NOT_FOUND | ERR_SUPPLIER_NOT_FOUND | ERR_CONTRACT_NOT_FOUND | ERR_ELEMENT_NOT_FOUND | ERR_SEGMENT_NOT_FOUND | ERR_STAFF_MEMBER_NOT_FOUND"
    http_status: 404
    applies_to: "POST /dmc/supplier-contracts, POST /dmc/program-elements, POST /dmc/permits, POST /dmc/transport-segments, POST /dmc/manifest-entries, POST /dmc/staff-assignments, POST /dmc/settlement-payments, POST /dmc/manifest-entries/{manifest_entry_id}/move"

  - priority: 5
    category: auth
    check: "For entity_backed roles, X-User-ID equals the owning foreign key: Supplier acting on a SupplierContract must match contract.supplier_id; OperationsCoordinator checking in a StaffAssignment must match assignment.staff_id"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /dmc/supplier-contracts/{contract_id}/counter, POST /dmc/staff-assignments/{staff_assignment_id}/check-in"

  - priority: 6
    category: business_constraint
    check: "Request body shape: required fields present, enum values members of the declared set, integers >= their declared minimum, datetime pairs strictly ordered (ends_at > starts_at, arrive_at > depart_at, departure_date > arrival_date), pagination limit within 1..100 and offset >= 0"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"

  - priority: 7
    category: state
    check: "expected_program_version equals Program.version (POST /dmc/program-elements); expected_contract_version equals SupplierContract.version (POST /dmc/settlement-payments)"
    error_id: "ERR_STALE_PROGRAM_VERSION | ERR_STALE_CONTRACT_VERSION"
    http_status: 412
    applies_to: "POST /dmc/program-elements, POST /dmc/settlement-payments"

  - priority: 8
    category: state
    check: "The target row's current status is a declared `from:` state of the requested transition in §1.2"
    error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    applies_to: "all action endpoints"

  - priority: 9
    category: state
    check: "Program.execution_status == DRAFT when creating a ProgramElement (the design set is frozen once locked)"
    error_id: ERR_PROGRAM_DESIGN_LOCKED
    http_status: 409
    applies_to: "POST /dmc/program-elements, PATCH /dmc/program-elements/{element_id}"

  - priority: 10
    category: state
    check: "Program.settlement_status == NOT_STARTED when cancelling a Program or a ProgramElement"
    error_id: ERR_PROGRAM_ALREADY_RECONCILING
    http_status: 409
    applies_to: "POST /dmc/programs/{program_id}/cancel, POST /dmc/program-elements/{element_id}/cancel"

  - priority: 11
    category: state
    check: "Program.execution_status IN {COMPLETED, CANCELLED} when reconciling"
    error_id: ERR_PROGRAM_NOT_EXECUTION_FINAL
    http_status: 409
    applies_to: "POST /dmc/programs/{program_id}/reconcile"

  - priority: 12
    category: state
    check: "Program.settlement_status == RECONCILING when approving a ReconciliationLine, patching a ReconciliationLine, or approving a SettlementPayment (the latter also accepts CLIENT_INVOICED)"
    error_id: ERR_PROGRAM_NOT_RECONCILING
    http_status: 409
    applies_to: "POST /dmc/reconciliation-lines/{reconciliation_line_id}/approve, PATCH /dmc/reconciliation-lines/{reconciliation_line_id}, POST /dmc/settlement-payments/{settlement_payment_id}/approve"

  - priority: 13
    category: state
    check: "Program.execution_status IN {CONFIRMED, IN_EXECUTION} for mark-ready and IN {DESIGN_LOCKED, CONFIRMED, IN_EXECUTION} for assignment confirm; Program.execution_status == IN_EXECUTION for element deliver, element weather-switch, segment depart and staff check-in; logical clock >= Program.arrival_date for start-execution"
    error_id: "ERR_PROGRAM_NOT_CONFIRMED | ERR_PROGRAM_NOT_IN_EXECUTION | ERR_PROGRAM_WINDOW_NOT_OPEN"
    http_status: 409
    applies_to: "POST /dmc/program-elements/{element_id}/mark-ready, POST /dmc/program-elements/{element_id}/deliver, POST /dmc/program-elements/{element_id}/weather-switch, POST /dmc/transport-segments/{segment_id}/depart, POST /dmc/staff-assignments/{staff_assignment_id}/confirm, POST /dmc/staff-assignments/{staff_assignment_id}/check-in, POST /dmc/programs/{program_id}/start-execution"

  - priority: 14
    category: business_safety
    check: "Supplier.coi_verified == true AND Supplier.insurance_expires_on >= logical clock now AND Supplier.insurance_liability_limit_cents >= SupplierContract.required_liability_limit_cents"
    error_id: ERR_SUPPLIER_INSURANCE_INSUFFICIENT
    http_status: 422
    applies_to: "POST /dmc/supplier-contracts/{contract_id}/send, POST /dmc/supplier-contracts/{contract_id}/countersign"

  - priority: 15
    category: business_safety
    check: "Supplier.status == APPROVED for the contracted supplier"
    error_id: ERR_SUPPLIER_NOT_APPROVED
    http_status: 422
    applies_to: "POST /dmc/supplier-contracts/{contract_id}/send"

  - priority: 16
    category: business_safety
    check: "staff_credential_status(StaffMember) == VALID — the earliest of badge_expires_on and first_aid_expires_on is strictly after the logical clock plus the 14-day EXPIRING window"
    error_id: ERR_CREDENTIAL_EXPIRED
    http_status: 422
    applies_to: "POST /dmc/staff-assignments/{staff_assignment_id}/confirm"

  - priority: 17
    category: business_safety
    check: "StaffMember.status == ACTIVE"
    error_id: ERR_STAFF_INACTIVE
    http_status: 422
    applies_to: "POST /dmc/staff-assignments/{staff_assignment_id}/confirm"

  - priority: 18
    category: business_safety
    check: "When ManifestEntry.mobility_assist == true, the target TransportSegment.wheelchair_accessible == true"
    error_id: ERR_ACCESSIBILITY_UNMET
    http_status: 422
    applies_to: "POST /dmc/manifest-entries, POST /dmc/manifest-entries/{manifest_entry_id}/move"

  - priority: 19
    category: business_safety
    check: "No Permit of the element has status IN {DRAFT, SUBMITTED, CONDITIONS_REQUESTED, DENIED}; additionally, when the element's Venue.requires_special_venue_permit == true, an APPROVED SPECIAL_VENUE permit exists for the element; no element of the program is PERMIT_BLOCKED at program confirm"
    error_id: ERR_PERMIT_NOT_APPROVED
    http_status: 409
    applies_to: "POST /dmc/program-elements/{element_id}/mark-ready, POST /dmc/program-elements/{element_id}/weather-switch, POST /dmc/programs/{program_id}/confirm"

  - priority: 20
    category: business_temporal
    check: "floor((element.starts_at - logical clock now) / 86400 seconds) >= Permit.lead_time_days_required at submit time"
    error_id: ERR_PERMIT_LEAD_TIME_INSUFFICIENT
    http_status: 422
    applies_to: "POST /dmc/permits/{permit_id}/submit"

  - priority: 21
    category: business_temporal
    check: "ProgramElement.starts_at >= Program.arrival_date AND ProgramElement.ends_at <= Program.departure_date; TransportSegment.depart_at >= Program.arrival_date AND TransportSegment.arrive_at <= Program.departure_date"
    error_id: ERR_ELEMENT_OUTSIDE_PROGRAM_WINDOW
    http_status: 422
    applies_to: "POST /dmc/program-elements, POST /dmc/transport-segments"

  - priority: 22
    category: business_temporal
    check: |
      Venue occupation geometry — half-open intervals [starts_at, ends_at) with a
      FORWARD-ONLY turnover buffer attached to the tail of the incumbent
      occupation. For the candidate element C and every incumbent element E with
      E.venue_id == C.venue_id and E.status IN {PLANNED, PERMIT_BLOCKED, READY,
      DELIVERED}, reject when:
        C.starts_at < (E.ends_at + Venue.turnover_buffer_minutes)
        AND E.starts_at < C.ends_at
      Consequences pinned by this geometry: a candidate that ends exactly at an
      incumbent's starts_at is ACCEPTED (no buffer is required in front of an
      incumbent), while a candidate that starts exactly at an incumbent's ends_at
      is REJECTED unless the full turnover buffer has elapsed.
    error_id: ERR_VENUE_TURNOVER_CONFLICT
    http_status: 409
    applies_to: "POST /dmc/program-elements"

  - priority: 23
    category: business_temporal
    check: |
      Staff occupation geometry — CLOSED intervals [starts_at, ends_at] with no
      buffer, so touching endpoints collide. For the candidate assignment C and
      every incumbent assignment E with E.staff_id == C.staff_id and E.status IN
      {CONFIRMED, CHECKED_IN, COMPLETED}, reject when:
        C.starts_at <= E.ends_at AND E.starts_at <= C.ends_at
      A candidate starting exactly at an incumbent's ends_at is therefore
      REJECTED — the opposite treatment of adjacency from the venue rule.
    error_id: ERR_STAFF_ASSIGNMENT_OVERLAP
    http_status: 409
    applies_to: "POST /dmc/staff-assignments/{staff_assignment_id}/confirm"

  - priority: 24
    category: business_temporal
    check: "For every non-overlapping incumbent assignment E of the same staff_id with status IN {CONFIRMED, CHECKED_IN, COMPLETED}, the gap min(|C.starts_at - E.ends_at|, |E.starts_at - C.ends_at|) is >= StaffMember.min_rest_minutes"
    error_id: ERR_STAFF_REST_GAP_VIOLATION
    http_status: 409
    applies_to: "POST /dmc/staff-assignments/{staff_assignment_id}/confirm"

  - priority: 25
    category: business_temporal
    check: "The sum of scheduled minutes over the staff member's assignments with status IN {CONFIRMED, CHECKED_IN, COMPLETED} whose starts_at falls on the same UTC calendar day as the candidate's starts_at, plus the candidate's own minutes, is <= StaffMember.max_daily_minutes"
    error_id: ERR_STAFF_DAILY_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /dmc/staff-assignments/{staff_assignment_id}/confirm"

  - priority: 26
    category: business_temporal
    check: "Manifest check-in requires logical clock now >= segment.depart_at - 120 minutes; staff check-in requires logical clock now within [assignment.starts_at - 60 minutes, assignment.ends_at]"
    error_id: ERR_CHECKIN_WINDOW_NOT_OPEN
    http_status: 409
    applies_to: "POST /dmc/manifest-entries/{manifest_entry_id}/check-in, POST /dmc/staff-assignments/{staff_assignment_id}/check-in"

  - priority: 27
    category: business_temporal
    check: "Segment depart requires logical clock now >= depart_at; element deliver requires logical clock now >= starts_at"
    error_id: "ERR_SEGMENT_NOT_DUE | ERR_ELEMENT_NOT_STARTED"
    http_status: 409
    applies_to: "POST /dmc/transport-segments/{segment_id}/depart, POST /dmc/program-elements/{element_id}/deliver"

  - priority: 28
    category: business_constraint
    check: "Following predecessor_element_id transitively from the candidate element must terminate without revisiting the candidate; a self-reference or any cycle is rejected"
    error_id: ERR_ELEMENT_DEPENDENCY_CYCLE
    http_status: 422
    applies_to: "POST /dmc/program-elements, PATCH /dmc/program-elements/{element_id}"

  - priority: 29
    category: business_constraint
    check: "When alternative_for_element_id is supplied it must reference an element of the same program whose is_weather_dependent == true, must not equal the candidate's own predecessor_element_id, and the referenced element must not itself carry a non-null alternative_for_element_id"
    error_id: ERR_INVALID_WEATHER_ALTERNATIVE
    http_status: 422
    applies_to: "POST /dmc/program-elements, PATCH /dmc/program-elements/{element_id}"

  - priority: 30
    category: business_constraint
    check: "When venue_id is non-null: for element_type == DINE_AROUND the planned_headcount <= Venue.capacity_seated; for element_type IN {ACTIVITY, OFF_PREMISE_EVENT} the planned_headcount <= Venue.capacity_reception; Venue.status must be ACTIVE"
    error_id: ERR_VENUE_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /dmc/program-elements"

  - priority: 31
    category: business_constraint
    check: "segment.booked_seat_count + candidate.seat_count <= segment.seat_capacity (equality is accepted; the comparison that rejects is strictly greater-than)"
    error_id: ERR_SEGMENT_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /dmc/manifest-entries, POST /dmc/manifest-entries/{manifest_entry_id}/move"

  - priority: 32
    category: business_constraint
    check: "No other ManifestEntry on the same segment with status IN {ASSIGNED, CHECKED_IN} carries the same guest_ref"
    error_id: ERR_DUPLICATE_MANIFEST_ENTRY
    http_status: 409
    applies_to: "POST /dmc/manifest-entries, POST /dmc/manifest-entries/{manifest_entry_id}/move"

  - priority: 33
    category: business_constraint
    check: "SupplierContract.round_count < 3 before a send or counter transition"
    error_id: ERR_NEGOTIATION_ROUNDS_EXHAUSTED
    http_status: 422
    applies_to: "POST /dmc/supplier-contracts/{contract_id}/send, POST /dmc/supplier-contracts/{contract_id}/counter"

  - priority: 34
    category: business_constraint
    check: "The move target segment's program_id equals the source segment's program_id and target_segment_id differs from the entry's current segment_id"
    error_id: ERR_SEGMENT_PROGRAM_MISMATCH
    http_status: 422
    applies_to: "POST /dmc/manifest-entries/{manifest_entry_id}/move"

  - priority: 35
    category: business_constraint
    check: "StaffAssignment.role_type equals StaffMember.role_type; when target_type == ELEMENT then element_id is non-null and segment_id is null, and when target_type == SEGMENT then segment_id is non-null and element_id is null"
    error_id: ERR_STAFF_ROLE_MISMATCH
    http_status: 422
    applies_to: "POST /dmc/staff-assignments, POST /dmc/staff-assignments/{staff_assignment_id}/confirm"

  - priority: 36
    category: business_constraint
    check: "TransportSegment.booked_seat_count >= 1 at depart"
    error_id: ERR_EMPTY_MANIFEST
    http_status: 409
    applies_to: "POST /dmc/transport-segments/{segment_id}/depart"

  - priority: 37
    category: business_referential
    check: "A SupplierContract exists with program_id == element.program_id AND supplier_id == element.supplier_id AND status == ACTIVE"
    error_id: ERR_NO_ACTIVE_SUPPLIER_CONTRACT
    http_status: 409
    applies_to: "POST /dmc/program-elements/{element_id}/mark-ready, POST /dmc/programs/{program_id}/confirm"

  - priority: 38
    category: business_referential
    check: "element.predecessor_element_id is null OR the referenced element's status == DELIVERED"
    error_id: ERR_PREDECESSOR_NOT_DELIVERED
    http_status: 409
    applies_to: "POST /dmc/program-elements/{element_id}/mark-ready"

  - priority: 39
    category: business_referential
    check: "At least one ProgramElement exists with alternative_for_element_id == the switched element's id AND status == PLANNED"
    error_id: ERR_NO_WEATHER_ALTERNATIVE
    http_status: 409
    applies_to: "POST /dmc/program-elements/{element_id}/weather-switch"

  - priority: 40
    category: business_referential
    check: "At least one ProgramElement of the program has status IN {DELIVERED, CANCELLED} at reconcile time (empty-set edge)"
    error_id: ERR_NO_RECONCILABLE_ELEMENTS
    http_status: 422
    applies_to: "POST /dmc/programs/{program_id}/reconcile"

  - priority: 41
    category: business_referential
    check: "Every ReconciliationLine of the program has status == APPROVED at invoice issue"
    error_id: ERR_RECONCILIATION_LINES_PENDING
    http_status: 409
    applies_to: "POST /dmc/programs/{program_id}/issue-invoice"

  - priority: 42
    category: business_referential
    check: "SupplierContract.status == ACTIVE for payment.contract_id"
    error_id: ERR_CONTRACT_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /dmc/settlement-payments/{settlement_payment_id}/approve"

  - priority: 43
    category: business_referential
    check: "Program.element_count >= 1 at design lock"
    error_id: ERR_PROGRAM_HAS_NO_ELEMENTS
    http_status: 422
    applies_to: "POST /dmc/programs/{program_id}/lock-design"

  - priority: 44
    category: business_referential
    check: "No StaffAssignment of the program has status IN {CHECKED_IN, COMPLETED} at design unlock"
    error_id: ERR_PROGRAM_ALREADY_STAFFED_ON_SITE
    http_status: 409
    applies_to: "POST /dmc/programs/{program_id}/unlock-design"

  - priority: 45
    category: business_fiscal
    check: "0.05 <= Program.markup_pct <= 0.35"
    error_id: ERR_MARKUP_PCT_OUT_OF_BAND
    http_status: 422
    applies_to: "POST /dmc/programs, POST /dmc/programs/{program_id}/lock-design"

  - priority: 46
    category: business_fiscal
    check: "ReconciliationLine.variance_pct <= 0.10 OR ReconciliationLine.variance_reason is non-null and non-empty"
    error_id: ERR_VARIANCE_REASON_REQUIRED
    http_status: 422
    applies_to: "POST /dmc/reconciliation-lines/{reconciliation_line_id}/approve"

  - priority: 47
    category: business_fiscal
    check: "SettlementPayment.net_payable_cents <= Program.supplier_open_payable_cents"
    error_id: ERR_SETTLEMENT_EXCEEDS_OPEN_PAYABLE
    http_status: 422
    applies_to: "POST /dmc/settlement-payments/{settlement_payment_id}/approve"

  - priority: 48
    category: business_fiscal
    check: "No SettlementPayment of the program (or of the contract, for terminate) has status == PAID"
    error_id: ERR_SETTLEMENT_ALREADY_PAID
    http_status: 409
    applies_to: "POST /dmc/programs/{program_id}/credit-invoice, POST /dmc/supplier-contracts/{contract_id}/terminate"

  - priority: 49
    category: business_constraint
    check: "Segregation of duties: X-User-ID != SupplierContract.sent_by_user_id at countersign; X-User-ID != SettlementPayment.approved_by_user_id at release"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /dmc/supplier-contracts/{contract_id}/countersign, POST /dmc/settlement-payments/{settlement_payment_id}/release"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:

  # ---------- Test-driving surface -----------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Sets the server's logical clock. Every deadline, expiry, lead-time and check-in-window rule in this scaffold reads this clock, never wall-clock time. The clock's startup default is exactly 2026-08-01T00:00:00Z; before any call to this endpoint the logical clock reads that instant."
    roles: [ProgramDirector, OperationsCoordinator, SupplierManager, Controller, PermitOfficer]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: datetime }"
    side_effects:
      - "advances or rewinds the logical clock used by staff_credential_status, cancellation_penalty, permit lead-time checks and every check-in window"

  # ---------- Program ------------------------------------------------------
  - method: POST
    path: "/dmc/programs"
    description: "Creates a program shell for an incoming group."
    roles: [ProgramDirector]
    code: 201
    input: [client_name, group_name, arrival_date, departure_date, guaranteed_count, "markup_pct?"]
    output: Program
    side_effects:
      - "Program.execution_status = DRAFT, Program.settlement_status = NOT_STARTED, all computed money and count fields = 0"

  - method: GET
    path: "/dmc/programs/{program_id}"
    description: "Reads one program including every computed money and count field."
    roles: [ProgramDirector, OperationsCoordinator, SupplierManager, Controller, PermitOfficer]
    code: 200
    input: []
    output: Program
    side_effects: []

  - method: GET
    path: "/dmc/programs"
    description: "Lists programs with filtering and pagination."
    roles: [ProgramDirector, OperationsCoordinator, SupplierManager, Controller, PermitOfficer]
    code: 200
    input: ["execution_status?", "settlement_status?", "limit?", "offset?"]
    output: Program[]
    side_effects: []

  - method: GET
    path: "/dmc/programs/{program_id}/cost-summary"
    description: "Computed read exposing the markup-transparency breakdown the client is entitled to see."
    roles: [ProgramDirector, Controller]
    code: 200
    input: []
    output: "{ program_id: string, estimated_client_total_cents: integer, final_subtotal_cents: integer, disclosed_markup_cents: integer, management_fee_cents: integer, fee_pct_applied: number, final_client_total_cents: integer, supplier_gross_payable_cents: integer, supplier_settled_cents: integer, supplier_open_payable_cents: integer }"
    side_effects: []

  - method: POST
    path: "/dmc/programs/{program_id}/lock-design"
    description: "Freezes the element set so operations can begin permitting and staffing."
    roles: [ProgramDirector]
    code: 200
    input: []
    output: Program
    side_effects:
      - "Program.execution_status DRAFT -> DESIGN_LOCKED"
      - "increments Program.version by 1"

  - method: POST
    path: "/dmc/programs/{program_id}/unlock-design"
    description: "Reverts a locked design back to DRAFT so elements can be added or removed."
    roles: [ProgramDirector]
    code: 200
    input: []
    output: Program
    side_effects:
      - "Program.execution_status DESIGN_LOCKED -> DRAFT"
      - "increments Program.version by 1"

  - method: POST
    path: "/dmc/programs/{program_id}/confirm"
    description: "Confirms the program to the client and freezes the estimate."
    roles: [ProgramDirector]
    code: 200
    input: []
    output: Program
    side_effects:
      - "Program.execution_status DESIGN_LOCKED -> CONFIRMED"
      - "runs calculations.program_client_total variant ESTIMATE and writes Program.estimated_client_total_cents"
      - "increments Program.version by 1"

  - method: POST
    path: "/dmc/programs/{program_id}/start-execution"
    description: "Opens on-site execution once the group has landed."
    roles: [OperationsCoordinator]
    code: 200
    input: []
    output: Program
    side_effects:
      - "Program.execution_status CONFIRMED -> IN_EXECUTION"
      - "increments Program.version by 1"

  - method: POST
    path: "/dmc/programs/{program_id}/cancel"
    description: "Cancels the whole program, cascading into elements and transport."
    roles: [ProgramDirector]
    code: 200
    input: ["cancel_reason?"]
    output: Program
    side_effects:
      - "Program.execution_status -> CANCELLED"
      - "cancels every open ProgramElement (each stamping cancellation_penalty_cents and releasing its staff)"
      - "cancels every SCHEDULED TransportSegment (each releasing its manifest entries)"
      - "increments Program.version by 1"

  - method: POST
    path: "/dmc/programs/{program_id}/reconcile"
    description: "Opens reconciliation, materialising one ReconciliationLine per delivered or cancelled element."
    roles: [ProgramDirector]
    code: 200
    input: []
    output: Program
    side_effects:
      - "Program.settlement_status NOT_STARTED -> RECONCILING"
      - "creates ReconciliationLine rows and runs element_billable_headcount(FINAL) plus reconciliation_line_amounts on each"
      - "recomputes Program.actual_attendance_total"
      - "increments Program.version by 1"

  - method: POST
    path: "/dmc/programs/{program_id}/issue-invoice"
    description: "Issues the client invoice with the disclosed markup and the tiered management fee."
    roles: [Controller]
    code: 200
    input: []
    output: Program
    side_effects:
      - "Program.settlement_status RECONCILING -> CLIENT_INVOICED"
      - "runs calculations.program_client_total variant FINAL and writes final_subtotal_cents, disclosed_markup_cents, management_fee_cents, final_client_total_cents, invoice_issued_at"
      - "increments Program.version by 1"

  - method: POST
    path: "/dmc/programs/{program_id}/credit-invoice"
    description: "Credits an issued invoice and reopens reconciliation."
    roles: [Controller]
    code: 200
    input: [credit_reason]
    output: Program
    side_effects:
      - "Program.settlement_status CLIENT_INVOICED -> CREDITED, then the system transition CREDITED -> RECONCILING fires within the same request"
      - "Program.credit_note_cents += Program.final_client_total_cents"
      - "reverts every APPROVED ReconciliationLine to DRAFT, each recomputing the program money fields"
      - "clears management_fee_cents, final_client_total_cents and invoice_issued_at"
      - "increments Program.version by 1"

  # ---------- Venue --------------------------------------------------------
  - method: POST
    path: "/dmc/venues"
    description: "Registers a bookable venue with its turnover buffer."
    roles: [ProgramDirector]
    code: 201
    input: [name, capacity_seated, capacity_reception, "turnover_buffer_minutes?", "requires_special_venue_permit?", "status?"]
    output: Venue
    side_effects: []

  - method: GET
    path: "/dmc/venues/{venue_id}"
    description: "Reads one venue."
    roles: [ProgramDirector, OperationsCoordinator, SupplierManager, Controller, PermitOfficer]
    code: 200
    input: []
    output: Venue
    side_effects: []

  - method: GET
    path: "/dmc/venues"
    description: "Lists venues."
    roles: [ProgramDirector, OperationsCoordinator, SupplierManager, Controller, PermitOfficer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Venue[]
    side_effects: []

  # ---------- Supplier -----------------------------------------------------
  - method: POST
    path: "/dmc/suppliers"
    description: "Adds a local supplier to the vendor file with its certificate-of-insurance data."
    roles: [SupplierManager]
    code: 201
    input: [legal_name, supplier_type, insurance_expires_on, insurance_liability_limit_cents, "coi_verified?", "status?"]
    output: Supplier
    side_effects: []

  - method: PATCH
    path: "/dmc/suppliers/{supplier_id}"
    description: "Updates a supplier's insurance data or approval posture."
    roles: [SupplierManager]
    code: 200
    input: ["insurance_expires_on?", "insurance_liability_limit_cents?", "coi_verified?", "status?"]
    output: Supplier
    side_effects:
      - "increments Supplier.version by 1"

  - method: GET
    path: "/dmc/suppliers/{supplier_id}"
    description: "Reads one supplier."
    roles: [ProgramDirector, OperationsCoordinator, SupplierManager, Controller, PermitOfficer]
    code: 200
    input: []
    output: Supplier
    side_effects: []

  - method: GET
    path: "/dmc/suppliers"
    description: "Lists suppliers."
    roles: [ProgramDirector, OperationsCoordinator, SupplierManager, Controller, PermitOfficer]
    code: 200
    input: ["supplier_type?", "status?", "limit?", "offset?"]
    output: Supplier[]
    side_effects: []

  # ---------- SupplierContract --------------------------------------------
  - method: POST
    path: "/dmc/supplier-contracts"
    description: "Drafts a contract binding one supplier to one program with deposit and cancellation terms."
    roles: [SupplierManager]
    code: 201
    input: [program_id, supplier_id, contract_value_cents, required_liability_limit_cents, "deposit_pct?", "cancellation_tier?"]
    output: SupplierContract
    side_effects:
      - "SupplierContract.status = DRAFT, round_count = 0, deposit_due_cents = 0, deposit_paid_cents = 0"

  - method: GET
    path: "/dmc/supplier-contracts/{contract_id}"
    description: "Reads one contract."
    roles: [ProgramDirector, OperationsCoordinator, SupplierManager, Controller, PermitOfficer, Supplier]
    code: 200
    input: []
    output: SupplierContract
    side_effects: []

  - method: GET
    path: "/dmc/supplier-contracts"
    description: "Lists contracts filtered by program, supplier or status."
    roles: [ProgramDirector, OperationsCoordinator, SupplierManager, Controller, PermitOfficer, Supplier]
    code: 200
    input: ["program_id?", "supplier_id?", "status?", "limit?", "offset?"]
    output: SupplierContract[]
    side_effects: []

  - method: POST
    path: "/dmc/supplier-contracts/{contract_id}/send"
    description: "Sends (or re-sends after a counter) the contract to the supplier."
    roles: [SupplierManager]
    code: 200
    input: []
    output: SupplierContract
    side_effects:
      - "SupplierContract.status DRAFT|COUNTERED -> SENT"
      - "sets sent_by_user_id to the caller's X-User-ID and increments round_count by 1"
      - "increments SupplierContract.version by 1"

  - method: POST
    path: "/dmc/supplier-contracts/{contract_id}/counter"
    description: "Supplier counters the contract value, opening another negotiation round."
    roles: [Supplier]
    code: 200
    input: [countered_value_cents]
    output: SupplierContract
    side_effects:
      - "SupplierContract.status SENT -> COUNTERED"
      - "sets contract_value_cents = countered_value_cents"
      - "increments SupplierContract.version by 1"

  - method: POST
    path: "/dmc/supplier-contracts/{contract_id}/countersign"
    description: "Countersigns the contract, activating it and booking the deposit."
    roles: [SupplierManager]
    code: 200
    input: []
    output: SupplierContract
    side_effects:
      - "SupplierContract.status SENT|COUNTERED -> ACTIVE"
      - "sets countersigned_by_user_id, deposit_due_cents = round_half_up(contract_value_cents * deposit_pct) and deposit_paid_cents = deposit_due_cents"
      - "increments SupplierContract.version by 1"

  - method: POST
    path: "/dmc/supplier-contracts/{contract_id}/terminate"
    description: "Terminates the contract and cancels the supplier's open elements on that program."
    roles: [SupplierManager]
    code: 200
    input: ["termination_note?"]
    output: SupplierContract
    side_effects:
      - "SupplierContract.status -> TERMINATED and deposit_paid_cents = 0"
      - "cancels every open ProgramElement of the same (program_id, supplier_id), each stamping cancellation_penalty_cents and releasing its staff"
      - "increments SupplierContract.version by 1"

  # ---------- ProgramElement ----------------------------------------------
  - method: POST
    path: "/dmc/program-elements"
    description: "Adds a curated element (activity, dine-around, off-premise event or transfer block) to a DRAFT program. Guarded by optimistic concurrency on the parent program."
    roles: [ProgramDirector]
    code: 201
    input: [program_id, supplier_id, element_type, title, starts_at, ends_at, planned_headcount, guaranteed_headcount, per_person_cost_cents, expected_program_version, "venue_id?", "predecessor_element_id?", "alternative_for_element_id?", "is_weather_dependent?"]
    output: ProgramElement
    side_effects:
      - "ProgramElement.status = PLANNED"
      - "recomputes Program.element_count and Program.open_element_count"
      - "increments Program.version by 1"

  - method: GET
    path: "/dmc/program-elements/{element_id}"
    description: "Reads one program element."
    roles: [ProgramDirector, OperationsCoordinator, SupplierManager, Controller, PermitOfficer]
    code: 200
    input: []
    output: ProgramElement
    side_effects: []

  - method: GET
    path: "/dmc/program-elements"
    description: "Lists elements filtered by program, supplier, venue, production predecessor, weather-alternative parent or status."
    roles: [ProgramDirector, OperationsCoordinator, SupplierManager, Controller, PermitOfficer]
    code: 200
    input: ["program_id?", "supplier_id?", "venue_id?", "predecessor_element_id?", "alternative_for_element_id?", "status?", "limit?", "offset?"]
    output: ProgramElement[]
    side_effects: []

  - method: PATCH
    path: "/dmc/program-elements/{element_id}"
    description: "Reshapes an element while its program is still DRAFT: retitles it, re-scales the headcount, or rewires the production timeline (predecessor) and the rain plan (weather alternative). This is the only way an existing element's graph edges change, so it is where the production-timeline cycle check bites."
    roles: [ProgramDirector]
    code: 200
    input: ["title?", "planned_headcount?", "predecessor_element_id?", "alternative_for_element_id?", "is_weather_dependent?"]
    output: ProgramElement
    side_effects:
      - "increments ProgramElement.version by 1"
      - "leaves Program.element_count and Program.open_element_count unchanged"

  - method: POST
    path: "/dmc/program-elements/{element_id}/mark-ready"
    description: "Marks the element production-ready once permits, contract and predecessor are satisfied."
    roles: [OperationsCoordinator]
    code: 200
    input: []
    output: ProgramElement
    side_effects:
      - "ProgramElement.status PLANNED -> READY"
      - "increments ProgramElement.version by 1"

  - method: POST
    path: "/dmc/program-elements/{element_id}/deliver"
    description: "Records actual attendance and closes out the element on site."
    roles: [OperationsCoordinator]
    code: 200
    input: [actual_headcount]
    output: ProgramElement
    side_effects:
      - "ProgramElement.status READY -> DELIVERED, stamping actual_headcount and delivered_at"
      - "completes CHECKED_IN staff assignments (running staff_labor_cost variant ACTUAL) and marks CONFIRMED ones NO_SHOW"
      - "recomputes Program.actual_attendance_total, Program.open_element_count and Program.staffing_gap_count"
      - "may bubble Program.execution_status IN_EXECUTION -> COMPLETED"
      - "increments ProgramElement.version by 1"

  - method: POST
    path: "/dmc/program-elements/{element_id}/weather-switch"
    description: "Swaps a weather-dependent element for its rain plan."
    roles: [OperationsCoordinator]
    code: 200
    input: []
    output: ProgramElement
    side_effects:
      - "ProgramElement.status READY -> WEATHER_SWITCHED"
      - "promotes the selected alternative element PLANNED -> READY"
      - "releases this element's PROPOSED/CONFIRMED staff assignments"
      - "recomputes Program.open_element_count and may bubble Program to COMPLETED"
      - "increments ProgramElement.version by 1"

  - method: POST
    path: "/dmc/program-elements/{element_id}/cancel"
    description: "Cancels one element and stamps the contractual cancellation penalty."
    roles: [ProgramDirector]
    code: 200
    input: ["cancel_reason?"]
    output: ProgramElement
    side_effects:
      - "ProgramElement.status -> CANCELLED"
      - "runs calculations.cancellation_penalty and writes cancellation_penalty_cents"
      - "releases this element's PROPOSED/CONFIRMED staff assignments"
      - "recomputes Program.open_element_count and may bubble Program to COMPLETED"
      - "increments ProgramElement.version by 1"

  # ---------- Permit -------------------------------------------------------
  - method: POST
    path: "/dmc/permits"
    description: "Opens a permit application for an element (street closure, special venue or off-premise alcohol)."
    roles: [PermitOfficer]
    code: 201
    input: [element_id, permit_type, authority_name, lead_time_days_required]
    output: Permit
    side_effects:
      - "Permit.status = DRAFT, resubmission_count = 0"

  - method: GET
    path: "/dmc/permits/{permit_id}"
    description: "Reads one permit."
    roles: [ProgramDirector, OperationsCoordinator, SupplierManager, Controller, PermitOfficer]
    code: 200
    input: []
    output: Permit
    side_effects: []

  - method: GET
    path: "/dmc/permits"
    description: "Lists permits filtered by element or status."
    roles: [ProgramDirector, OperationsCoordinator, SupplierManager, Controller, PermitOfficer]
    code: 200
    input: ["element_id?", "status?", "limit?", "offset?"]
    output: Permit[]
    side_effects: []

  - method: POST
    path: "/dmc/permits/{permit_id}/submit"
    description: "Submits or resubmits the application to the issuing authority."
    roles: [PermitOfficer]
    code: 200
    input: []
    output: Permit
    side_effects:
      - "Permit.status DRAFT|CONDITIONS_REQUESTED -> SUBMITTED, stamping submitted_at"
      - "increments resubmission_count when resubmitting"
      - "increments Permit.version by 1"

  - method: POST
    path: "/dmc/permits/{permit_id}/record-decision"
    description: "Records the authority's decision: APPROVED, DENIED or CONDITIONS_REQUESTED."
    roles: [PermitOfficer]
    code: 200
    input: [decision, "conditions_note?"]
    output: Permit
    side_effects:
      - "Permit.status SUBMITTED -> APPROVED | DENIED | CONDITIONS_REQUESTED, stamping decision_at"
      - "on APPROVED, may unblock the element PERMIT_BLOCKED -> PLANNED"
      - "on DENIED, blocks the element and cascades staff releases into StaffMember.confirmed_minutes_total and Program.staffing_gap_count"
      - "increments Permit.version by 1"

  # ---------- TransportSegment --------------------------------------------
  - method: POST
    path: "/dmc/transport-segments"
    description: "Schedules a ground movement: airport transfer, shuttle loop or dine-around leg."
    roles: [OperationsCoordinator]
    code: 201
    input: [program_id, segment_type, vehicle_code, origin, destination, depart_at, arrive_at, seat_capacity, "wheelchair_accessible?"]
    output: TransportSegment
    side_effects:
      - "TransportSegment.status = SCHEDULED, booked_seat_count = 0"

  - method: GET
    path: "/dmc/transport-segments/{segment_id}"
    description: "Reads one transport segment."
    roles: [ProgramDirector, OperationsCoordinator, SupplierManager, Controller, PermitOfficer]
    code: 200
    input: []
    output: TransportSegment
    side_effects: []

  - method: GET
    path: "/dmc/transport-segments"
    description: "Lists transport segments filtered by program or status."
    roles: [ProgramDirector, OperationsCoordinator, SupplierManager, Controller, PermitOfficer]
    code: 200
    input: ["program_id?", "status?", "limit?", "offset?"]
    output: TransportSegment[]
    side_effects: []

  - method: POST
    path: "/dmc/transport-segments/{segment_id}/depart"
    description: "Departs the vehicle, no-showing any guest who never checked in."
    roles: [OperationsCoordinator]
    code: 200
    input: []
    output: TransportSegment
    side_effects:
      - "TransportSegment.status SCHEDULED -> DEPARTED, stamping departed_at"
      - "marks every ASSIGNED ManifestEntry NO_SHOW and recomputes booked_seat_count and Program.seated_guest_count"
      - "completes CHECKED_IN staff assignments on this segment"
      - "increments TransportSegment.version by 1"

  - method: POST
    path: "/dmc/transport-segments/{segment_id}/cancel"
    description: "Cancels a scheduled movement and releases its manifest."
    roles: [OperationsCoordinator]
    code: 200
    input: ["cancel_reason?"]
    output: TransportSegment
    side_effects:
      - "TransportSegment.status SCHEDULED -> CANCELLED"
      - "releases every ASSIGNED/CHECKED_IN ManifestEntry, incrementing Program.unseated_guest_count per entry"
      - "recomputes booked_seat_count and Program.seated_guest_count"
      - "releases PROPOSED/CONFIRMED staff assignments on this segment"
      - "increments TransportSegment.version by 1"

  # ---------- ManifestEntry -----------------------------------------------
  - method: POST
    path: "/dmc/manifest-entries"
    description: "Manifests a guest onto a transport segment."
    roles: [OperationsCoordinator]
    code: 201
    input: [segment_id, guest_ref, guest_name, "seat_count?", "mobility_assist?"]
    output: ManifestEntry
    side_effects:
      - "ManifestEntry.status = ASSIGNED, move_count = 0"
      - "recomputes TransportSegment.booked_seat_count and Program.seated_guest_count"

  - method: GET
    path: "/dmc/manifest-entries/{manifest_entry_id}"
    description: "Reads one manifest entry."
    roles: [ProgramDirector, OperationsCoordinator, SupplierManager, Controller, PermitOfficer]
    code: 200
    input: []
    output: ManifestEntry
    side_effects: []

  - method: GET
    path: "/dmc/manifest-entries"
    description: "Lists manifest entries filtered by segment or status."
    roles: [ProgramDirector, OperationsCoordinator, SupplierManager, Controller, PermitOfficer]
    code: 200
    input: ["segment_id?", "status?", "limit?", "offset?"]
    output: ManifestEntry[]
    side_effects: []

  - method: POST
    path: "/dmc/manifest-entries/{manifest_entry_id}/move"
    description: "Moves a guest to another scheduled segment of the same program."
    roles: [OperationsCoordinator]
    code: 200
    input: [target_segment_id]
    output: ManifestEntry
    side_effects:
      - "sets segment_id to the target and increments move_count"
      - "decrements the source segment's booked_seat_count and increments the target's by seat_count"
      - "leaves Program.seated_guest_count unchanged (seat-conservation invariant)"
      - "increments ManifestEntry.version by 1"

  - method: POST
    path: "/dmc/manifest-entries/{manifest_entry_id}/check-in"
    description: "Checks a guest in at the curb."
    roles: [OperationsCoordinator]
    code: 200
    input: []
    output: ManifestEntry
    side_effects:
      - "ManifestEntry.status ASSIGNED -> CHECKED_IN"
      - "TransportSegment.booked_seat_count unchanged"
      - "increments ManifestEntry.version by 1"

  # ---------- StaffMember --------------------------------------------------
  - method: POST
    path: "/dmc/staff-members"
    description: "Registers an on-site coordinator, greeter or activity lead with credential expiry dates."
    roles: [ProgramDirector]
    code: 201
    input: [full_name, role_type, badge_expires_on, first_aid_expires_on, pay_rate_cents_per_hour, "min_rest_minutes?", "max_daily_minutes?", "status?"]
    output: StaffMember
    side_effects:
      - "credential_status derived by calculations.staff_credential_status against the logical clock"

  - method: PATCH
    path: "/dmc/staff-members/{staff_member_id}"
    description: "Updates credentials, rate, rest/daily limits or employment posture."
    roles: [ProgramDirector]
    code: 200
    input: ["badge_expires_on?", "first_aid_expires_on?", "pay_rate_cents_per_hour?", "min_rest_minutes?", "max_daily_minutes?", "status?"]
    output: StaffMember
    side_effects:
      - "re-derives credential_status"
      - "increments StaffMember.version by 1"

  - method: GET
    path: "/dmc/staff-members/{staff_member_id}"
    description: "Reads one staff member with the credential status derived at the current logical clock."
    roles: [ProgramDirector, OperationsCoordinator, SupplierManager, Controller, PermitOfficer]
    code: 200
    input: []
    output: StaffMember
    side_effects: []

  - method: GET
    path: "/dmc/staff-members"
    description: "Lists staff members filtered by role, employment posture or derived credential status."
    roles: [ProgramDirector, OperationsCoordinator, SupplierManager, Controller, PermitOfficer]
    code: 200
    input: ["role_type?", "status?", "credential_status?", "limit?", "offset?"]
    output: StaffMember[]
    side_effects: []

  # ---------- StaffAssignment ---------------------------------------------
  - method: POST
    path: "/dmc/staff-assignments"
    description: "Proposes a shift for one staff member against either an element or a transport segment."
    roles: [ProgramDirector]
    code: 201
    input: [staff_id, program_id, target_type, role_type, starts_at, ends_at, "element_id?", "segment_id?"]
    output: StaffAssignment
    side_effects:
      - "StaffAssignment.status = PROPOSED; no credential, overlap, rest or daily check runs at proposal time"

  - method: GET
    path: "/dmc/staff-assignments/{staff_assignment_id}"
    description: "Reads one staff assignment."
    roles: [ProgramDirector, OperationsCoordinator, SupplierManager, Controller, PermitOfficer]
    code: 200
    input: []
    output: StaffAssignment
    side_effects: []

  - method: GET
    path: "/dmc/staff-assignments"
    description: "Lists staff assignments filtered by staff member, program, element, segment or status."
    roles: [ProgramDirector, OperationsCoordinator, SupplierManager, Controller, PermitOfficer]
    code: 200
    input: ["staff_id?", "program_id?", "element_id?", "segment_id?", "status?", "limit?", "offset?"]
    output: StaffAssignment[]
    side_effects: []

  - method: POST
    path: "/dmc/staff-assignments/{staff_assignment_id}/confirm"
    description: "Confirms the shift after credential, overlap, rest-gap and daily-limit checks."
    roles: [ProgramDirector]
    code: 200
    input: []
    output: StaffAssignment
    side_effects:
      - "StaffAssignment.status PROPOSED -> CONFIRMED"
      - "runs calculations.staff_labor_cost variant PLANNED and writes planned_labor_cost_cents"
      - "StaffMember.confirmed_minutes_total += the assignment's scheduled minutes"
      - "increments StaffAssignment.version by 1"

  - method: POST
    path: "/dmc/staff-assignments/{staff_assignment_id}/check-in"
    description: "The assigned staff member checks in on site."
    roles: [OperationsCoordinator]
    code: 200
    input: []
    output: StaffAssignment
    side_effects:
      - "StaffAssignment.status CONFIRMED -> CHECKED_IN, stamping check_in_at from the logical clock"
      - "increments StaffAssignment.version by 1"

  - method: POST
    path: "/dmc/staff-assignments/{staff_assignment_id}/release"
    description: "Releases a proposed or confirmed shift."
    roles: [ProgramDirector]
    code: 200
    input: ["release_reason?"]
    output: StaffAssignment
    side_effects:
      - "StaffAssignment.status PROPOSED|CONFIRMED -> RELEASED"
      - "when the prior status was CONFIRMED: decrements StaffMember.confirmed_minutes_total and increments Program.staffing_gap_count"
      - "increments StaffAssignment.version by 1"

  # ---------- ReconciliationLine ------------------------------------------
  - method: GET
    path: "/dmc/reconciliation-lines/{reconciliation_line_id}"
    description: "Reads one reconciliation line — the only discovery channel for lines synthesised by reconcile."
    roles: [ProgramDirector, OperationsCoordinator, SupplierManager, Controller, PermitOfficer]
    code: 200
    input: []
    output: ReconciliationLine
    side_effects: []

  - method: GET
    path: "/dmc/reconciliation-lines"
    description: "Lists reconciliation lines filtered by program, element, supplier or status."
    roles: [ProgramDirector, OperationsCoordinator, SupplierManager, Controller, PermitOfficer]
    code: 200
    input: ["program_id?", "element_id?", "supplier_id?", "status?", "limit?", "offset?"]
    output: ReconciliationLine[]
    side_effects: []

  - method: PATCH
    path: "/dmc/reconciliation-lines/{reconciliation_line_id}"
    description: "Records a variance explanation or corrects the recorded attendance on a DRAFT line."
    roles: [ProgramDirector]
    code: 200
    input: ["variance_reason?", "actual_headcount?"]
    output: ReconciliationLine
    side_effects:
      - "when actual_headcount is supplied, re-runs element_billable_headcount(FINAL) and reconciliation_line_amounts, rewriting billed_headcount, supplier_cost_cents, markup_cents, client_charge_cents and variance_pct"
      - "increments ReconciliationLine.version by 1"

  - method: POST
    path: "/dmc/reconciliation-lines/{reconciliation_line_id}/approve"
    description: "Approves a reconciliation line into the program's payable and billable totals."
    roles: [ProgramDirector]
    code: 200
    input: []
    output: ReconciliationLine
    side_effects:
      - "ReconciliationLine.status DRAFT -> APPROVED"
      - "recomputes Program.final_subtotal_cents, disclosed_markup_cents, supplier_gross_payable_cents and supplier_open_payable_cents"
      - "increments ReconciliationLine.version by 1"

  # ---------- SettlementPayment -------------------------------------------
  - method: POST
    path: "/dmc/settlement-payments"
    description: "Opens a supplier settlement against a contract, applying the deposit waterfall. Guarded by optimistic concurrency on the parent contract."
    roles: [Controller]
    code: 201
    input: [program_id, supplier_id, contract_id, expected_contract_version]
    output: SettlementPayment
    side_effects:
      - "SettlementPayment.status = PENDING"
      - "runs calculations.settlement_net_payable, writing gross_cents, deposit_applied_cents, net_payable_cents and overpayment_credit_cents"
      - "increments SupplierContract.version by 1"

  - method: GET
    path: "/dmc/settlement-payments/{settlement_payment_id}"
    description: "Reads one settlement payment."
    roles: [ProgramDirector, SupplierManager, Controller]
    code: 200
    input: []
    output: SettlementPayment
    side_effects: []

  - method: GET
    path: "/dmc/settlement-payments"
    description: "Lists settlement payments filtered by program, supplier, contract or status."
    roles: [ProgramDirector, SupplierManager, Controller]
    code: 200
    input: ["program_id?", "supplier_id?", "contract_id?", "status?", "limit?", "offset?"]
    output: SettlementPayment[]
    side_effects: []

  - method: POST
    path: "/dmc/settlement-payments/{settlement_payment_id}/approve"
    description: "Approves the settlement, moving the amount from open payable to settled."
    roles: [Controller]
    code: 200
    input: []
    output: SettlementPayment
    side_effects:
      - "SettlementPayment.status PENDING -> APPROVED, stamping approved_by_user_id"
      - "Program.supplier_settled_cents += net_payable_cents; Program.supplier_open_payable_cents -= net_payable_cents"
      - "increments SettlementPayment.version by 1"

  - method: POST
    path: "/dmc/settlement-payments/{settlement_payment_id}/release"
    description: "Releases funds to the supplier; must be a different Controller from the approver."
    roles: [Controller]
    code: 200
    input: []
    output: SettlementPayment
    side_effects:
      - "SettlementPayment.status APPROVED -> PAID, stamping released_by_user_id"
      - "may bubble Program.settlement_status CLIENT_INVOICED -> SETTLED, closing every ACTIVE contract of the program"
      - "increments SettlementPayment.version by 1"

  - method: POST
    path: "/dmc/settlement-payments/{settlement_payment_id}/void"
    description: "Voids a pending or approved settlement, restoring the program's open payable."
    roles: [Controller]
    code: 200
    input: ["void_reason?"]
    output: SettlementPayment
    side_effects:
      - "SettlementPayment.status PENDING|APPROVED -> VOID"
      - "when the prior status was APPROVED: Program.supplier_settled_cents -= net_payable_cents and Program.supplier_open_payable_cents += net_payable_cents"
      - "increments SettlementPayment.version by 1"

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:

  # --- auth / authz ---
  - id: ERR_UNAUTHENTICATED
    http_status: 401
    condition: "X-User-ID or X-User-Role header missing, empty or malformed"
    applies_to: ["all endpoints"]
  - id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    condition: "X-User-Role is not listed in the endpoint's roles"
    applies_to: ["all endpoints"]
  - id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    condition: "caller holds role Supplier and the targeted SupplierContract.supplier_id does not match the caller's own Supplier record"
    applies_to: ["POST /dmc/supplier-contracts/{contract_id}/counter"]
  - id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    condition: "the acting X-User-ID equals SupplierContract.sent_by_user_id at countersign, or equals SettlementPayment.approved_by_user_id at release"
    applies_to: ["POST /dmc/supplier-contracts/{contract_id}/countersign", "POST /dmc/settlement-payments/{settlement_payment_id}/release"]

  # --- existence ---
  - id: ERR_PROGRAM_NOT_FOUND
    http_status: 404
    condition: "path program_id, or body program_id, references no Program"
    applies_to: ["GET /dmc/programs/{program_id}", "GET /dmc/programs/{program_id}/cost-summary", "POST /dmc/programs/{program_id}/lock-design", "POST /dmc/programs/{program_id}/unlock-design", "POST /dmc/programs/{program_id}/confirm", "POST /dmc/programs/{program_id}/start-execution", "POST /dmc/programs/{program_id}/cancel", "POST /dmc/programs/{program_id}/reconcile", "POST /dmc/programs/{program_id}/issue-invoice", "POST /dmc/programs/{program_id}/credit-invoice", "POST /dmc/supplier-contracts", "POST /dmc/program-elements", "POST /dmc/transport-segments", "POST /dmc/staff-assignments", "POST /dmc/settlement-payments"]
  - id: ERR_VENUE_NOT_FOUND
    http_status: 404
    condition: "path venue_id, or body venue_id, references no Venue"
    applies_to: ["GET /dmc/venues/{venue_id}", "POST /dmc/program-elements"]
  - id: ERR_SUPPLIER_NOT_FOUND
    http_status: 404
    condition: "path supplier_id, or body supplier_id, references no Supplier"
    applies_to: ["GET /dmc/suppliers/{supplier_id}", "PATCH /dmc/suppliers/{supplier_id}", "POST /dmc/supplier-contracts", "POST /dmc/program-elements", "POST /dmc/settlement-payments"]
  - id: ERR_CONTRACT_NOT_FOUND
    http_status: 404
    condition: "path contract_id, or body contract_id, references no SupplierContract"
    applies_to: ["GET /dmc/supplier-contracts/{contract_id}", "POST /dmc/supplier-contracts/{contract_id}/send", "POST /dmc/supplier-contracts/{contract_id}/counter", "POST /dmc/supplier-contracts/{contract_id}/countersign", "POST /dmc/supplier-contracts/{contract_id}/terminate", "POST /dmc/settlement-payments"]
  - id: ERR_ELEMENT_NOT_FOUND
    http_status: 404
    condition: "path element_id, or body element_id / predecessor_element_id / alternative_for_element_id, references no ProgramElement"
    applies_to: ["GET /dmc/program-elements/{element_id}", "PATCH /dmc/program-elements/{element_id}", "POST /dmc/program-elements/{element_id}/mark-ready", "POST /dmc/program-elements/{element_id}/deliver", "POST /dmc/program-elements/{element_id}/weather-switch", "POST /dmc/program-elements/{element_id}/cancel", "POST /dmc/program-elements", "POST /dmc/permits", "POST /dmc/staff-assignments"]
  - id: ERR_PERMIT_NOT_FOUND
    http_status: 404
    condition: "path permit_id references no Permit"
    applies_to: ["GET /dmc/permits/{permit_id}", "POST /dmc/permits/{permit_id}/submit", "POST /dmc/permits/{permit_id}/record-decision"]
  - id: ERR_SEGMENT_NOT_FOUND
    http_status: 404
    condition: "path segment_id, or body segment_id / target_segment_id, references no TransportSegment"
    applies_to: ["GET /dmc/transport-segments/{segment_id}", "POST /dmc/transport-segments/{segment_id}/depart", "POST /dmc/transport-segments/{segment_id}/cancel", "POST /dmc/manifest-entries", "POST /dmc/manifest-entries/{manifest_entry_id}/move", "POST /dmc/staff-assignments"]
  - id: ERR_MANIFEST_ENTRY_NOT_FOUND
    http_status: 404
    condition: "path manifest_entry_id references no ManifestEntry"
    applies_to: ["GET /dmc/manifest-entries/{manifest_entry_id}", "POST /dmc/manifest-entries/{manifest_entry_id}/move", "POST /dmc/manifest-entries/{manifest_entry_id}/check-in"]
  - id: ERR_STAFF_MEMBER_NOT_FOUND
    http_status: 404
    condition: "path staff_member_id, or body staff_id, references no StaffMember"
    applies_to: ["GET /dmc/staff-members/{staff_member_id}", "PATCH /dmc/staff-members/{staff_member_id}", "POST /dmc/staff-assignments"]
  - id: ERR_STAFF_ASSIGNMENT_NOT_FOUND
    http_status: 404
    condition: "path staff_assignment_id references no StaffAssignment"
    applies_to: ["GET /dmc/staff-assignments/{staff_assignment_id}", "POST /dmc/staff-assignments/{staff_assignment_id}/confirm", "POST /dmc/staff-assignments/{staff_assignment_id}/check-in", "POST /dmc/staff-assignments/{staff_assignment_id}/release"]
  - id: ERR_RECONCILIATION_LINE_NOT_FOUND
    http_status: 404
    condition: "path reconciliation_line_id references no ReconciliationLine"
    applies_to: ["GET /dmc/reconciliation-lines/{reconciliation_line_id}", "PATCH /dmc/reconciliation-lines/{reconciliation_line_id}", "POST /dmc/reconciliation-lines/{reconciliation_line_id}/approve"]
  - id: ERR_SETTLEMENT_PAYMENT_NOT_FOUND
    http_status: 404
    condition: "path settlement_payment_id references no SettlementPayment"
    applies_to: ["GET /dmc/settlement-payments/{settlement_payment_id}", "POST /dmc/settlement-payments/{settlement_payment_id}/approve", "POST /dmc/settlement-payments/{settlement_payment_id}/release", "POST /dmc/settlement-payments/{settlement_payment_id}/void"]

  # --- request shape ---
  - id: ERR_INVALID_REQUEST
    http_status: 400
    condition: "a required body field is absent, a field has the wrong JSON type, an enum value is outside its declared set, a *_cents or *_count field is negative, ends_at <= starts_at, arrive_at <= depart_at, departure_date < arrival_date, seat_count < 1, or a pagination parameter is out of range (limit < 1 or limit > 100 or offset < 0)"
    applies_to: ["all write endpoints", "all list endpoints"]

  # --- optimistic concurrency (§1.2.1) ---
  - id: ERR_STALE_PROGRAM_VERSION
    http_status: 412
    condition: "expected_program_version does not equal the current Program.version"
    applies_to: ["POST /dmc/program-elements"]
  - id: ERR_STALE_CONTRACT_VERSION
    http_status: 412
    condition: "expected_contract_version does not equal the current SupplierContract.version"
    applies_to: ["POST /dmc/settlement-payments"]

  # --- state ---
  - id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    condition: "the requested transition is not declared in the entity's §1.2 transition list for its current state (includes every second application of a one-shot trigger)"
    applies_to: ["all action endpoints"]
  - id: ERR_PROGRAM_DESIGN_LOCKED
    http_status: 409
    condition: "an element-set mutation is attempted while Program.execution_status is not DRAFT"
    applies_to: ["POST /dmc/program-elements", "PATCH /dmc/program-elements/{element_id}"]
  - id: ERR_PROGRAM_ALREADY_RECONCILING
    http_status: 409
    condition: "reconcile is invoked while Program.settlement_status is not NOT_STARTED"
    applies_to: ["POST /dmc/programs/{program_id}/reconcile"]
  - id: ERR_PROGRAM_NOT_EXECUTION_FINAL
    http_status: 409
    condition: "reconcile is invoked while Program.execution_status is neither COMPLETED nor CANCELLED"
    applies_to: ["POST /dmc/programs/{program_id}/reconcile"]
  - id: ERR_PROGRAM_NOT_RECONCILING
    http_status: 409
    condition: "a reconciliation line is edited or approved, or the invoice is issued, while Program.settlement_status is not RECONCILING"
    applies_to: ["PATCH /dmc/reconciliation-lines/{reconciliation_line_id}", "POST /dmc/reconciliation-lines/{reconciliation_line_id}/approve", "POST /dmc/programs/{program_id}/issue-invoice"]
  - id: ERR_PROGRAM_NOT_CONFIRMED
    http_status: 409
    condition: "start-execution is invoked while Program.execution_status is not CONFIRMED"
    applies_to: ["POST /dmc/programs/{program_id}/start-execution"]
  - id: ERR_PROGRAM_NOT_IN_EXECUTION
    http_status: 409
    condition: "an on-site action (element deliver or weather-switch, staff check-in, segment depart, manifest check-in) is invoked while Program.execution_status is not IN_EXECUTION"
    applies_to: ["POST /dmc/program-elements/{element_id}/deliver", "POST /dmc/program-elements/{element_id}/weather-switch", "POST /dmc/staff-assignments/{staff_assignment_id}/check-in", "POST /dmc/transport-segments/{segment_id}/depart", "POST /dmc/manifest-entries/{manifest_entry_id}/check-in"]
  - id: ERR_PROGRAM_WINDOW_NOT_OPEN
    http_status: 409
    condition: "start-execution is invoked while the logical clock is strictly before Program.arrival_date at 00:00:00Z"
    applies_to: ["POST /dmc/programs/{program_id}/start-execution"]
  - id: ERR_PERMIT_NOT_APPROVED
    http_status: 409
    condition: "mark-ready is invoked while the element has at least one Permit whose status is not APPROVED, or while the element's status is PERMIT_BLOCKED"
    applies_to: ["POST /dmc/program-elements/{element_id}/mark-ready"]
  - id: ERR_CONTRACT_NOT_ACTIVE
    http_status: 409
    condition: "a settlement is opened against a SupplierContract whose status is not ACTIVE"
    applies_to: ["POST /dmc/settlement-payments"]
  - id: ERR_NO_ACTIVE_SUPPLIER_CONTRACT
    http_status: 409
    condition: "mark-ready is invoked while no ACTIVE SupplierContract exists for the element's (program_id, supplier_id)"
    applies_to: ["POST /dmc/program-elements/{element_id}/mark-ready"]
  - id: ERR_PREDECESSOR_NOT_DELIVERED
    http_status: 409
    condition: "mark-ready is invoked while predecessor_element_id is set and that predecessor's status is neither DELIVERED nor WEATHER_SWITCHED"
    applies_to: ["POST /dmc/program-elements/{element_id}/mark-ready"]
  - id: ERR_NO_WEATHER_ALTERNATIVE
    http_status: 409
    condition: "weather-switch is invoked and the pinned alternative selector returns the empty set"
    applies_to: ["POST /dmc/program-elements/{element_id}/weather-switch"]
  - id: ERR_RECONCILIATION_LINES_PENDING
    http_status: 409
    condition: "issue-invoice is invoked while at least one ReconciliationLine of the program is still DRAFT"
    applies_to: ["POST /dmc/programs/{program_id}/issue-invoice"]
  - id: ERR_PROGRAM_ALREADY_STAFFED_ON_SITE
    http_status: 409
    condition: "unlock-design is invoked while the program has at least one StaffAssignment whose status is CONFIRMED, CHECKED_IN or COMPLETED"
    applies_to: ["POST /dmc/programs/{program_id}/unlock-design"]
  - id: ERR_SETTLEMENT_ALREADY_PAID
    http_status: 409
    condition: "void is invoked on a SettlementPayment whose status is PAID or VOID"
    applies_to: ["POST /dmc/settlement-payments/{settlement_payment_id}/void"]
  - id: ERR_EMPTY_MANIFEST
    http_status: 409
    condition: "depart is invoked on a TransportSegment that has no ManifestEntry in status ASSIGNED or CHECKED_IN"
    applies_to: ["POST /dmc/transport-segments/{segment_id}/depart"]
  - id: ERR_CHECKIN_WINDOW_NOT_OPEN
    http_status: 409
    condition: "staff check-in is attempted while the logical clock is outside [starts_at - 60 minutes, ends_at]"
    applies_to: ["POST /dmc/staff-assignments/{staff_assignment_id}/check-in"]
  - id: ERR_SEGMENT_NOT_DUE
    http_status: 409
    condition: "depart is invoked while the logical clock is strictly before TransportSegment.depart_at"
    applies_to: ["POST /dmc/transport-segments/{segment_id}/depart"]
  - id: ERR_ELEMENT_NOT_STARTED
    http_status: 409
    condition: "deliver is invoked while the logical clock is strictly before ProgramElement.starts_at"
    applies_to: ["POST /dmc/program-elements/{element_id}/deliver"]
  - id: ERR_VENUE_TURNOVER_CONFLICT
    http_status: 409
    condition: "the candidate element's half-open interval [starts_at, ends_at) collides with a non-cancelled element at the same venue after extending the incumbent forward by Venue.turnover_buffer_minutes"
    applies_to: ["POST /dmc/program-elements"]
  - id: ERR_STAFF_ASSIGNMENT_OVERLAP
    http_status: 409
    condition: "the candidate shift's closed interval [starts_at, ends_at] touches or overlaps another PROPOSED/CONFIRMED/CHECKED_IN/COMPLETED shift of the same StaffMember"
    applies_to: ["POST /dmc/staff-assignments/{staff_assignment_id}/confirm"]
  - id: ERR_STAFF_REST_GAP_VIOLATION
    http_status: 409
    condition: "the gap between the candidate shift and the nearest non-overlapping confirmed shift of the same StaffMember is strictly less than StaffMember.min_rest_minutes"
    applies_to: ["POST /dmc/staff-assignments/{staff_assignment_id}/confirm"]
  - id: ERR_SEGMENT_CAPACITY_EXCEEDED
    http_status: 409
    condition: "booked_seat_count + candidate seat_count > TransportSegment.seat_capacity"
    applies_to: ["POST /dmc/manifest-entries", "POST /dmc/manifest-entries/{manifest_entry_id}/move"]
  - id: ERR_DUPLICATE_MANIFEST_ENTRY
    http_status: 409
    condition: "the same guest_ref is already manifested on the same TransportSegment in status ASSIGNED or CHECKED_IN"
    applies_to: ["POST /dmc/manifest-entries", "POST /dmc/manifest-entries/{manifest_entry_id}/move"]

  # --- safety / insurance / credentialing ---
  - id: ERR_SUPPLIER_INSURANCE_INSUFFICIENT
    http_status: 422
    condition: "at countersign, Supplier.coi_verified is false, or Supplier.insurance_liability_limit_cents < SupplierContract.required_liability_limit_cents, or Supplier.insurance_expires_on is on or before the logical clock's date"
    applies_to: ["POST /dmc/supplier-contracts/{contract_id}/countersign"]
  - id: ERR_SUPPLIER_NOT_APPROVED
    http_status: 422
    condition: "the referenced Supplier.status is not APPROVED"
    applies_to: ["POST /dmc/supplier-contracts", "POST /dmc/program-elements"]
  - id: ERR_CREDENTIAL_EXPIRED
    http_status: 422
    condition: "the StaffMember's derived credential_status is EXPIRED at the logical clock"
    applies_to: ["POST /dmc/staff-assignments/{staff_assignment_id}/confirm"]
  - id: ERR_STAFF_INACTIVE
    http_status: 422
    condition: "the referenced StaffMember.status is INACTIVE"
    applies_to: ["POST /dmc/staff-assignments/{staff_assignment_id}/confirm"]
  - id: ERR_ACCESSIBILITY_UNMET
    http_status: 422
    condition: "a ManifestEntry with mobility_assist true is placed on a TransportSegment whose wheelchair_accessible is false"
    applies_to: ["POST /dmc/manifest-entries", "POST /dmc/manifest-entries/{manifest_entry_id}/move"]
  - id: ERR_PERMIT_LEAD_TIME_INSUFFICIENT
    http_status: 422
    condition: "at submit, (element.starts_at - logical clock) in whole days is strictly less than Permit.lead_time_days_required"
    applies_to: ["POST /dmc/permits/{permit_id}/submit"]
  - id: ERR_STAFF_DAILY_LIMIT_EXCEEDED
    http_status: 422
    condition: "the candidate shift's minutes plus the StaffMember's already-confirmed minutes on the same UTC calendar day exceed StaffMember.max_daily_minutes"
    applies_to: ["POST /dmc/staff-assignments/{staff_assignment_id}/confirm"]

  # --- referential / constraint ---
  - id: ERR_ELEMENT_OUTSIDE_PROGRAM_WINDOW
    http_status: 422
    condition: "element starts_at is before Program.arrival_date at 00:00:00Z or ends_at is after Program.departure_date at 23:59:59Z"
    applies_to: ["POST /dmc/program-elements"]
  - id: ERR_ELEMENT_DEPENDENCY_CYCLE
    http_status: 422
    condition: "the supplied predecessor_element_id would close a cycle in the production-timeline graph (self-reference included)"
    applies_to: ["POST /dmc/program-elements", "PATCH /dmc/program-elements/{element_id}"]
  - id: ERR_INVALID_WEATHER_ALTERNATIVE
    http_status: 422
    condition: "alternative_for_element_id points at an element of a different program, or at an element whose is_weather_dependent is false, or the candidate is itself flagged is_weather_dependent"
    applies_to: ["POST /dmc/program-elements", "PATCH /dmc/program-elements/{element_id}"]
  - id: ERR_VENUE_CAPACITY_EXCEEDED
    http_status: 422
    condition: "planned_headcount exceeds Venue.capacity_seated for DINE_AROUND elements or Venue.capacity_reception for every other element type"
    applies_to: ["POST /dmc/program-elements"]
  - id: ERR_NEGOTIATION_ROUNDS_EXHAUSTED
    http_status: 422
    condition: "send is invoked when SupplierContract.round_count is already 3"
    applies_to: ["POST /dmc/supplier-contracts/{contract_id}/send"]
  - id: ERR_SEGMENT_PROGRAM_MISMATCH
    http_status: 422
    condition: "a move targets a TransportSegment belonging to a different Program, or a StaffAssignment's element_id / segment_id belongs to a different Program than program_id"
    applies_to: ["POST /dmc/manifest-entries/{manifest_entry_id}/move", "POST /dmc/staff-assignments"]
  - id: ERR_STAFF_ROLE_MISMATCH
    http_status: 422
    condition: "the assignment's role_type differs from StaffMember.role_type, or target_type is ELEMENT with segment_id supplied (or element_id absent), or target_type is SEGMENT with element_id supplied (or segment_id absent)"
    applies_to: ["POST /dmc/staff-assignments"]
  - id: ERR_PROGRAM_HAS_NO_ELEMENTS
    http_status: 422
    condition: "lock-design or confirm is invoked while Program.element_count is 0"
    applies_to: ["POST /dmc/programs/{program_id}/lock-design", "POST /dmc/programs/{program_id}/confirm"]
  - id: ERR_NO_RECONCILABLE_ELEMENTS
    http_status: 422
    condition: "reconcile is invoked and the reconcilable-element selector returns the empty set (no element is DELIVERED or CANCELLED)"
    applies_to: ["POST /dmc/programs/{program_id}/reconcile"]

  # --- fiscal ---
  - id: ERR_MARKUP_PCT_OUT_OF_BAND
    http_status: 422
    condition: "markup_pct is below 0.05 or above 0.35"
    applies_to: ["POST /dmc/programs"]
  - id: ERR_VARIANCE_REASON_REQUIRED
    http_status: 422
    condition: "a ReconciliationLine whose absolute variance_pct exceeds 0.10 is approved while variance_reason is null or blank"
    applies_to: ["POST /dmc/reconciliation-lines/{reconciliation_line_id}/approve"]
  - id: ERR_SETTLEMENT_EXCEEDS_OPEN_PAYABLE
    http_status: 422
    condition: "the computed net_payable_cents exceeds Program.supplier_open_payable_cents at approve time"
    applies_to: ["POST /dmc/settlement-payments/{settlement_payment_id}/approve"]

# =============================================================================
# §1.7 RBAC Permission Matrix
# =============================================================================
roles:
  - name: ProgramDirector
    description: "Owns program design: creates programs, curates elements, registers venues and staff, proposes/confirms/releases shifts, opens reconciliation and edits or approves reconciliation lines. Cannot touch the vendor file, permits or money movement."
    identity: opaque
    exclusive_operations:
      - "POST /dmc/programs"
      - "POST /dmc/venues"
      - "POST /dmc/staff-members"
      - "PATCH /dmc/staff-members/{staff_member_id}"
      - "POST /dmc/program-elements"
      - "POST /dmc/program-elements/{element_id}/cancel"
      - "POST /dmc/programs/{program_id}/lock-design"
      - "POST /dmc/programs/{program_id}/unlock-design"
      - "POST /dmc/programs/{program_id}/confirm"
      - "POST /dmc/programs/{program_id}/cancel"
      - "POST /dmc/programs/{program_id}/reconcile"
      - "POST /dmc/staff-assignments"
      - "POST /dmc/staff-assignments/{staff_assignment_id}/confirm"
      - "POST /dmc/staff-assignments/{staff_assignment_id}/release"
      - "PATCH /dmc/reconciliation-lines/{reconciliation_line_id}"
      - "POST /dmc/reconciliation-lines/{reconciliation_line_id}/approve"
    shared_operations:
      - "POST /_clock/set_current_utc"
      - "all GET endpoints except none"

  - name: OperationsCoordinator
    description: "Runs the ground operation: schedules transport, manages manifests, marks elements ready, delivers them, switches to weather alternatives, departs vehicles and checks staff in. Identity is backed by a StaffMember record so on-site check-in can be attributed."
    identity: "entity_backed:StaffMember"
    exclusive_operations:
      - "POST /dmc/programs/{program_id}/start-execution"
      - "POST /dmc/program-elements/{element_id}/mark-ready"
      - "POST /dmc/program-elements/{element_id}/deliver"
      - "POST /dmc/program-elements/{element_id}/weather-switch"
      - "POST /dmc/transport-segments"
      - "POST /dmc/transport-segments/{segment_id}/depart"
      - "POST /dmc/transport-segments/{segment_id}/cancel"
      - "POST /dmc/manifest-entries"
      - "POST /dmc/manifest-entries/{manifest_entry_id}/move"
      - "POST /dmc/manifest-entries/{manifest_entry_id}/check-in"
      - "POST /dmc/staff-assignments/{staff_assignment_id}/check-in"
    shared_operations:
      - "POST /_clock/set_current_utc"
      - "all GET endpoints except the settlement-payment reads"

  - name: SupplierManager
    description: "Owns the vendor file and the contracting cycle: onboards suppliers, maintains certificates of insurance, drafts, sends, countersigns and terminates contracts. Cannot design programs or move money."
    identity: opaque
    exclusive_operations:
      - "POST /dmc/suppliers"
      - "PATCH /dmc/suppliers/{supplier_id}"
      - "POST /dmc/supplier-contracts"
      - "POST /dmc/supplier-contracts/{contract_id}/send"
      - "POST /dmc/supplier-contracts/{contract_id}/countersign"
      - "POST /dmc/supplier-contracts/{contract_id}/terminate"
    shared_operations:
      - "POST /_clock/set_current_utc"
      - "all GET endpoints"

  - name: Supplier
    description: "External local supplier. Sees only contract reads and may counter a contract addressed to its own Supplier record; every other write is denied."
    identity: "entity_backed:Supplier"
    exclusive_operations:
      - "POST /dmc/supplier-contracts/{contract_id}/counter"
    shared_operations:
      - "GET /dmc/supplier-contracts/{contract_id}"
      - "GET /dmc/supplier-contracts"

  - name: Controller
    description: "Owns client billing and supplier settlement: issues and credits invoices, opens settlements, approves them and releases funds — with approve and release required to be different X-User-IDs."
    identity: opaque
    exclusive_operations:
      - "POST /dmc/programs/{program_id}/issue-invoice"
      - "POST /dmc/programs/{program_id}/credit-invoice"
      - "POST /dmc/settlement-payments"
      - "POST /dmc/settlement-payments/{settlement_payment_id}/approve"
      - "POST /dmc/settlement-payments/{settlement_payment_id}/release"
      - "POST /dmc/settlement-payments/{settlement_payment_id}/void"
    shared_operations:
      - "POST /_clock/set_current_utc"
      - "all GET endpoints"

  - name: PermitOfficer
    description: "Handles street-closure, special-venue and off-premise permitting with the issuing authorities. Owns the whole Permit lifecycle and nothing else."
    identity: opaque
    exclusive_operations:
      - "POST /dmc/permits"
      - "POST /dmc/permits/{permit_id}/submit"
      - "POST /dmc/permits/{permit_id}/record-decision"
    shared_operations:
      - "POST /_clock/set_current_utc"
      - "all GET endpoints except the settlement-payment reads"





