# =============================================================================
# Task 1718 — Insurance Cancellation & Nonrenewal Compliance (insurer policy services)
# Scaffold seed tables (§1.0–§1.7). §1.8 and §1.9 live in sibling files.
# =============================================================================

scenario: |
  Insurance Cancellation & Nonrenewal Compliance (insurer policy services): cancellation reason & statutory permissible grounds by state, notice period calculation & proof of mailing, pro-rata vs short-rate premium return, reinstatement window & lapse in coverage consequences, nonrenewal notice deadlines & required content, mortgagee/lienholder & additional interest notification, regulatory reporting on nonrenewal volumes, appeal & rescission-of-cancellation process

domain_name: insurance-cancellation-nonrenewal
api_prefix: /carrier

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: temporal_windowing
  complexity_layers:
    - scheduled_actions
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
  entity_topology: hybrid
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: StateFilingProfile
    parent: null
    common_fields: true
    fields:
      - { name: state_code, type: string, source: input, description: "US state code this filing profile governs; unique across StateFilingProfile rows with status=ACTIVE", constraints: "2-letter code; uniqueness enforced over rows where status = ACTIVE" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | RETIRED — only ACTIVE profiles are consulted by calculations", default: "DRAFT" }
      - { name: permissible_grounds, type: array, source: input, description: "List of cancellation ground codes this state permits mid-term: subset of {NONPAYMENT, MATERIAL_MISREPRESENTATION, SUBSTANTIAL_CHANGE_IN_RISK, LICENSE_SUSPENSION}" }
      - { name: nonpayment_notice_days, type: integer, source: input, description: "Statutory minimum days of advance notice for NONPAYMENT cancellations to the policyholder" }
      - { name: other_grounds_notice_days, type: integer, source: input, description: "Statutory minimum days of advance notice for all non-NONPAYMENT cancellation grounds to the policyholder" }
      - { name: mortgagee_notice_days, type: integer, source: input, description: "Statutory minimum days of advance notice owed to mortgagee/lienholder interests" }
      - { name: nonrenewal_notice_days, type: integer, source: input, description: "Statutory minimum days of advance notice before expiration for nonrenewal" }
      - { name: short_rate_penalty_pct, type: number, source: input, description: "Penalty fraction applied to unearned premium when cancellation is insured-requested and state allows short-rate (0.0 means pro-rata mandatory)" }
      - { name: reinstatement_window_days, type: integer, source: input, description: "Days after cancellation effective date during which reinstatement may be requested" }
      - { name: max_reinstatements, type: integer, source: input, description: "Maximum number of reinstatements permitted per policy term" }
      - { name: nonrenewal_content_codes, type: array, source: input, description: "Required content codes that must appear on every nonrenewal notice for this state: subset of {SPECIFIC_REASON, LOSS_HISTORY_SUMMARY, FAIR_PLAN_INFO, APPEAL_RIGHTS}" }
      - { name: version_note, type: string, source: input, description: "Free-text filing reference", default: "" }

  - name: Policyholder
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Insured legal name" }
      - { name: mailing_address, type: string, source: input, description: "Address used for proof-of-mailing notices" }
      - { name: email, type: string, source: input, description: "Contact email" }

  - name: InsuredInterest
    parent: Policy
    common_fields: true
    fields:
      - { name: policy_id, type: string, source: system, description: "FK -> Policy.id; the policy this interest attaches to" }
      - { name: interest_type, type: enum, source: input, description: "MORTGAGEE | LIENHOLDER | ADDITIONAL_INTEREST" }
      - { name: institution_name, type: string, source: input, description: "Name of the bank/lienholder/interested party" }
      - { name: mailing_address, type: string, source: input, description: "Notice address for this interest" }
      - { name: loan_number, type: string, source: input, description: "External loan reference", default: "" }

  - name: Policy
    parent: Policyholder
    common_fields: true
    fields:
      - { name: policyholder_id, type: string, source: system, description: "FK -> Policyholder.id; the named insured" }
      - { name: state_profile_id, type: string, source: input, description: "FK -> StateFilingProfile.id; the ACTIVE filing profile governing this policy; pinned at issuance" }
      - { name: policy_number, type: string, source: input, description: "Carrier-visible policy number; unique across all policies", constraints: "globally unique" }
      - { name: status, type: enum, source: system, description: "ACTIVE | CANCEL_PENDING | CANCELLED | NONRENEWAL_PENDING | EXPIRED" }
      - { name: term_start_date, type: string, source: input, description: "ISO date (YYYY-MM-DD) of coverage start" }
      - { name: term_end_date, type: string, source: input, description: "ISO date (YYYY-MM-DD) of scheduled expiration; must be strictly after term_start_date" }
      - { name: total_premium_cents, type: integer, source: input, description: "Written premium for the full term in cents; > 0" }
      - { name: cancellation_effective_date, type: string, source: system, description: "ISO date set when a cancellation becomes EFFECTIVE; null while active", default: null }
      - { name: reinstatements_used, type: integer, source: system, description: "Count of approved reinstatements this term", default: 0 }
      - { name: lapse_flag, type: boolean, source: computed, description: "true when coverage lapsed > 30 days past cancellation_effective_date without reinstatement; set by lapse sweep" }

  - name: CancellationCase
    parent: Policy
    common_fields: true
    fields:
      - { name: policy_id, type: string, source: system, description: "FK -> Policy.id; policy under cancellation" }
      - { name: ground_code, type: enum, source: input, description: "NONPAYMENT | MATERIAL_MISREPRESENTATION | SUBSTANTIAL_CHANGE_IN_RISK | LICENSE_SUSPENSION | INSURED_REQUEST" }
      - { name: requested_by_role, type: string, source: system, description: "Role that submitted the request (Underwriter or Policyholder)" }
      - { name: requested_on_date, type: string, source: system, description: "ISO date the case was submitted" }
      - { name: return_method, type: enum, source: computed, description: "PRO_RATA | SHORT_RATE — decided by ground + state profile; see return_premium calculation" }
      - { name: earliest_effective_date, type: string, source: computed, description: "ISO date = requested_on_date + applicable statutory notice days for the policyholder notice" }
      - { name: scheduled_effective_date, type: string, source: system, description: "ISO date the cancellation is scheduled to take effect (>= earliest_effective_date); set at approval" }
      - { name: return_premium_cents, type: integer, source: computed, description: "Refund owed to insured per the resolved return_method; finalized when the case becomes EFFECTIVE" }
      - { name: status, type: enum, source: system, description: "DRAFT | PENDING_APPROVAL | APPROVED | NOTICE_SENT | EFFECTIVE | RESCINDED | WITHDRAWN" }
      - { name: rescinded_reason, type: string, source: system, description: "Reason text when RESCINDED", default: "" }

  - name: NonrenewalCase
    parent: Policy
    common_fields: true
    fields:
      - { name: policy_id, type: string, source: system, description: "FK -> Policy.id; policy being nonrenewed" }
      - { name: reason_code, type: enum, source: input, description: "UNDERWRITING_GUIDELINES | LOSS_HISTORY | CARRIER_WITHDRAWAL | RISK_INELIGIBLE" }
      - { name: reason_text, type: string, source: input, description: "Specific reason prose included on the notice" }
      - { name: content_codes_present, type: array, source: input, description: "Content codes asserted on the notice; must cover the ACTIVE profile's nonrenewal_content_codes" }
      - { name: decided_on_date, type: string, source: system, description: "ISO date the nonrenewal was approved" }
      - { name: notice_deadline_date, type: string, source: computed, description: "ISO date = policy.term_end_date - profile.nonrenewal_notice_days; notices mailed after this date are late" }
      - { name: status, type: enum, source: system, description: "DRAFT | PENDING_APPROVAL | APPROVED | NOTICE_SENT | COMPLETED | RESCINDED" }

  - name: NoticeRecord
    parent: CancellationCase
    common_fields: true
    fields:
      - { name: cancellation_case_id, type: string, source: system, description: "FK -> CancellationCase.id; case this notice serves (exactly one of cancellation_case_id / nonrenewal_case_id set)" }
      - { name: nonrenewal_case_id, type: string, source: system, description: "FK -> NonrenewalCase.id; nonrenewal case this notice serves (exactly one of cancellation_case_id / nonrenewal_case_id set)" }
      - { name: recipient_kind, type: enum, source: input, description: "POLICYHOLDER | MORTGAGEE | LIENHOLDER | ADDITIONAL_INTEREST" }
      - { name: insured_interest_id, type: string, source: input, description: "FK -> InsuredInterest.id; required iff recipient_kind != POLICYHOLDER", default: null }
      - { name: mailed_on_date, type: string, source: input, description: "ISO date stamped by the mail room (proof of mailing)" }
      - { name: tracking_code, type: string, source: input, description: "USPS certificate-of-mailing or certified-mail number" }
      - { name: status, type: enum, source: system, description: "QUEUED | MAILED | DELIVERY_CONFIRMED | RETURNED_UNDELIVERABLE" }

  - name: PremiumLedgerEntry
    parent: Policy
    common_fields: false
    fields:
      - { name: policy_id, type: string, source: system, description: "FK -> Policy.id; policy this ledger line belongs to" }
      - { name: entry_kind, type: enum, source: system, description: "WRITTEN | RETURN_PRO_RATA | RETURN_SHORT_RATE | LAPSE_FEE | REINSTATEMENT_FEE" }
      - { name: amount_cents, type: integer, source: system, description: "Signed cents: positive = premium written/charged, negative = refund to insured" }
      - { name: effective_date, type: string, source: system, description: "ISO date the entry applies to" }
      - { name: cancellation_case_id, type: string, source: system, description: "FK -> CancellationCase.id; originating case for RETURN_* entries", default: null }

  - name: ReinstatementRequest
    parent: Policy
    common_fields: true
    fields:
      - { name: policy_id, type: string, source: system, description: "FK -> Policy.id; cancelled policy under reinstatement" }
      - { name: cancellation_case_id, type: string, source: system, description: "FK -> CancellationCase.id; the EFFECTIVE cancellation being reversed" }
      - { name: submitted_on_date, type: string, source: system, description: "ISO date the request was submitted" }
      - { name: lapse_days, type: integer, source: computed, description: "= submitted_on_date - policy.cancellation_effective_date, in whole days; 0 when same day" }
      - { name: reinstatement_fee_cents, type: integer, source: computed, description: "Fee charged per reinstatement_fee calculation" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | APPROVED | DENIED | EXPIRED" }

  - name: AppealCase
    parent: CancellationCase
    common_fields: true
    fields:
      - { name: cancellation_case_id, type: string, source: system, description: "FK -> CancellationCase.id; the cancellation under appeal" }
      - { name: policy_id, type: string, source: system, description: "FK -> Policy.id; denormalized for reporting queries" }
      - { name: filed_by, type: enum, source: input, description: "POLICYHOLDER | MORTGAGEE" }
      - { name: filed_on_date, type: string, source: system, description: "ISO date appeal was filed" }
      - { name: grounds_text, type: string, source: input, description: "Appellant's statement" }
      - { name: status, type: enum, source: system, description: "FILED | UNDER_REVIEW | UPHELD | OVERTURNED" }
      - { name: decided_on_date, type: string, source: system, description: "ISO date the appeal was decided", default: null }

  - name: RegulatoryReport
    parent: StateFilingProfile
    common_fields: true
    fields:
      - { name: state_profile_id, type: string, source: system, description: "FK -> StateFilingProfile.id; profile whose volume this reports" }
      - { name: report_period, type: string, source: input, description: "Calendar month in YYYY-MM form the report covers" }
      - { name: status, type: enum, source: system, description: "OPEN | FINALIZED" }
      - { name: nonrenewal_count, type: integer, source: computed, description: "Count of NonrenewalCase rows reaching COMPLETED within report_period for this state" }
      - { name: cancellation_count, type: integer, source: computed, description: "Count of CancellationCase rows reaching EFFECTIVE within report_period for this state" }
      - { name: rescinded_count, type: integer, source: computed, description: "Count of cases RESCINDED within report_period (cancellation + nonrenewal)" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: StateFilingProfile
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /carrier/state-profiles/{profileId}/activate"
        actor: ComplianceOfficer
        preconditions:
          - "No other StateFilingProfile with same state_code has status = ACTIVE (ERR_STATE_PROFILE_CONFLICT)"
        side_effects: []
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /carrier/state-profiles/{profileId}/retire"
        actor: ComplianceOfficer
        preconditions:
          - "No Policy with status IN {ACTIVE, CANCEL_PENDING, NONRENEWAL_PENDING} references this profile (ERR_STATE_PROFILE_IN_USE)"
        side_effects: []

  - entity: Policy
    initial_state: ACTIVE
    terminal_states: [CANCELLED, EXPIRED]
    transitions:
      - from: ACTIVE
        to: CANCEL_PENDING
        trigger: "POST /carrier/cancellation-cases/{caseId}/approve (on the case linked to this policy)"
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "Policy.status -> CANCEL_PENDING (notice window running; coverage continues until scheduled_effective_date)"
      - from: CANCEL_PENDING
        to: CANCELLED
        trigger: "system (clock sweep: current date >= CancellationCase.scheduled_effective_date while case.status = NOTICE_SENT)"
        actor: system
        preconditions:
          - "Linked CancellationCase.status = NOTICE_SENT"
          - "Every NoticeRecord for that case has status IN {MAILED, DELIVERY_CONFIRMED} (ERR_NOTICE_NOT_MAILED blocks the sweep and leaves the policy CANCEL_PENDING)"
        side_effects:
          - "Policy.cancellation_effective_date = case.scheduled_effective_date"
          - "CancellationCase.status -> EFFECTIVE"
          - "Post PremiumLedgerEntry entry_kind = RETURN_PRO_RATA or RETURN_SHORT_RATE per case.return_method (amount = case.return_premium_cents, negative)"
          - "RegulatoryReport for the profile & month of scheduled_effective_date: cancellation_count += 1 (creates OPEN report row if absent)"
      - from: ACTIVE
        to: NONRENEWAL_PENDING
        trigger: "POST /carrier/nonrenewal-cases/{caseId}/approve"
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "Policy.status -> NONRENEWAL_PENDING (coverage continues to term_end_date; no renewal offer will be made)"
      - from: NONRENEWAL_PENDING
        to: EXPIRED
        trigger: "system (clock sweep: current date >= policy.term_end_date while policy.status = NONRENEWAL_PENDING)"
        actor: system
        preconditions:
          - "Linked NonrenewalCase.status = NOTICE_SENT"
        side_effects:
          - "NonrenewalCase.status -> COMPLETED"
          - "RegulatoryReport for the profile & month of term_end_date: nonrenewal_count += 1 (creates OPEN report row if absent)"
      - from: CANCELLED
        to: ACTIVE
        trigger: "POST /carrier/reinstatement-requests/{requestId}/approve"
        actor: ComplianceOfficer
        preconditions:
          - "ReinstatementRequest.status = SUBMITTED"
          - "Policy.status = CANCELLED (ERR_POLICY_NOT_CANCELLED)"
          - "Policy.reinstatements_used < profile.max_reinstatements (ERR_REINSTATEMENT_LIMIT_REACHED)"
        side_effects:
          - "Policy.reinstatements_used += 1"
          - "Policy.cancellation_effective_date = null"
          - "ReinstatementRequest.status -> APPROVED"
          - "Post PremiumLedgerEntry entry_kind = REINSTATEMENT_FEE (amount = request.reinstatement_fee_cents, positive)"
          - "Originating CancellationCase.status stays EFFECTIVE (audit trail preserved)"
      - from: CANCEL_PENDING
        to: ACTIVE
        trigger: "POST /carrier/cancellation-cases/{caseId}/rescind (before EFFECTIVE)"
        actor: ComplianceOfficer
        preconditions:
          - "CancellationCase.status IN {APPROVED, NOTICE_SENT} (ERR_INVALID_STATE)"
        side_effects:
          - "CancellationCase.status -> RESCINDED"
          - "RegulatoryReport for the profile & current month: rescinded_count += 1 (creates OPEN report row if absent)"

  - entity: CancellationCase
    initial_state: DRAFT
    terminal_states: [EFFECTIVE, RESCINDED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: PENDING_APPROVAL
        trigger: "POST /carrier/cancellation-cases (create)"
        actor: "Underwriter | Policyholder"
        preconditions:
          - "ground_code = INSURED_REQUEST iff actor = Policyholder; non-INSURED_REQUEST grounds require actor = Underwriter (ERR_GROUND_ROLE_MISMATCH)"
          - "ground_code IN profile.permissible_grounds, or ground_code = INSURED_REQUEST (ERR_GROUND_NOT_PERMITTED_IN_STATE)"
          - "Policy.status = ACTIVE (ERR_POLICY_NOT_ACTIVE)"
          - "No other CancellationCase for this policy with status IN {DRAFT, PENDING_APPROVAL, APPROVED, NOTICE_SENT} (ERR_CANCELLATION_ALREADY_OPEN)"
        side_effects:
          - "Compute return_method and earliest_effective_date (see calculations)"
      - from: PENDING_APPROVAL
        to: APPROVED
        trigger: "POST /carrier/cancellation-cases/{caseId}/approve"
        actor: ComplianceOfficer
        preconditions:
          - "Segregation of duties: approving ComplianceOfficer's X-User-ID != the X-User-ID that created the case (ERR_SEGREGATION_OF_DUTIES)"
          - "scheduled_effective_date (payload) >= case.earliest_effective_date (ERR_EFFECTIVE_DATE_TOO_EARLY)"
        side_effects:
          - "Policy.status -> CANCEL_PENDING"
          - "case.scheduled_effective_date = payload value"
      - from: APPROVED
        to: NOTICE_SENT
        trigger: "POST /carrier/cancellation-cases/{caseId}/dispatch-notices"
        actor: Underwriter
        preconditions:
          - "Payload includes exactly one POLICYHOLDER notice plus one notice per InsuredInterest row on the policy with recipient_kind matching that row's interest_type (ERR_NOTICE_SET_INCOMPLETE)"
          - "Every notice's mailed_on_date <= current clock date (ERR_MAILING_DATE_IN_FUTURE)"
          - "Every notice's mailed_on_date + applicable statutory days for that recipient <= case.scheduled_effective_date (ERR_NOTICE_PERIOD_SHORTFALL)"
        side_effects:
          - "Create one NoticeRecord per payload entry with status = MAILED"
      - from: PENDING_APPROVAL
        to: WITHDRAWN
        trigger: "POST /carrier/cancellation-cases/{caseId}/withdraw"
        actor: "Underwriter | Policyholder"
        preconditions:
          - "Actor matches case.requested_by_role (ERR_FORBIDDEN_FOR_ROLE)"
        side_effects: []
      - from: APPROVED
        to: RESCINDED
        trigger: "POST /carrier/cancellation-cases/{caseId}/rescind"
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "Policy.status -> ACTIVE"
          - "RegulatoryReport rescinded_count += 1 for profile & current month"
      - from: NOTICE_SENT
        to: RESCINDED
        trigger: "POST /carrier/cancellation-cases/{caseId}/rescind"
        actor: ComplianceOfficer
        preconditions:
          - "Current clock date < case.scheduled_effective_date (ERR_ALREADY_EFFECTIVE)"
        side_effects:
          - "Policy.status -> ACTIVE"
          - "RegulatoryReport rescinded_count += 1 for profile & current month"
      - from: NOTICE_SENT
        to: EFFECTIVE
        trigger: "system (clock sweep at scheduled_effective_date)"
        actor: system
        preconditions: []
        side_effects:
          - "Policy.status -> CANCELLED; return premium ledger entry posted (see Policy CANCEL_PENDING -> CANCELLED)"

  - entity: NonrenewalCase
    initial_state: DRAFT
    terminal_states: [COMPLETED, RESCINDED]
    transitions:
      - from: DRAFT
        to: PENDING_APPROVAL
        trigger: "POST /carrier/nonrenewal-cases (create)"
        actor: Underwriter
        preconditions:
          - "Policy.status = ACTIVE (ERR_POLICY_NOT_ACTIVE)"
          - "No other NonrenewalCase for this policy with status IN {DRAFT, PENDING_APPROVAL, APPROVED, NOTICE_SENT} (ERR_NONRENEWAL_ALREADY_OPEN)"
          - "Current clock date <= policy.term_end_date - profile.nonrenewal_notice_days (ERR_NONRENEWAL_DEADLINE_PASSED)"
        side_effects:
          - "Compute notice_deadline_date"
      - from: PENDING_APPROVAL
        to: APPROVED
        trigger: "POST /carrier/nonrenewal-cases/{caseId}/approve"
        actor: ComplianceOfficer
        preconditions:
          - "Segregation of duties: approver X-User-ID != creator X-User-ID (ERR_SEGREGATION_OF_DUTIES)"
          - "content_codes_present covers every code in profile.nonrenewal_content_codes (ERR_NONRENEWAL_CONTENT_INCOMPLETE)"
        side_effects:
          - "Policy.status -> NONRENEWAL_PENDING"
          - "case.decided_on_date = current clock date"
      - from: APPROVED
        to: NOTICE_SENT
        trigger: "POST /carrier/nonrenewal-cases/{caseId}/dispatch-notices"
        actor: Underwriter
        preconditions:
          - "Payload includes exactly one POLICYHOLDER notice plus one notice per InsuredInterest row on the policy (ERR_NOTICE_SET_INCOMPLETE)"
          - "Every notice's mailed_on_date <= case.notice_deadline_date (ERR_NONRENEWAL_NOTICE_LATE)"
        side_effects:
          - "Create one NoticeRecord per payload entry with status = MAILED"
      - from: APPROVED
        to: RESCINDED
        trigger: "POST /carrier/nonrenewal-cases/{caseId}/rescind"
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "Policy.status -> ACTIVE"
          - "RegulatoryReport rescinded_count += 1 for profile & current month"
      - from: NOTICE_SENT
        to: COMPLETED
        trigger: "system (clock sweep at policy.term_end_date)"
        actor: system
        preconditions: []
        side_effects:
          - "Policy.status -> EXPIRED; nonrenewal_count incremented (see Policy NONRENEWAL_PENDING -> EXPIRED)"

  - entity: NoticeRecord
    initial_state: MAILED
    terminal_states: [DELIVERY_CONFIRMED, RETURNED_UNDELIVERABLE]
    transitions:
      - from: MAILED
        to: DELIVERY_CONFIRMED
        trigger: "POST /carrier/notices/{noticeId}/confirm-delivery"
        actor: Underwriter
        preconditions: []
        side_effects: []
      - from: MAILED
        to: RETURNED_UNDELIVERABLE
        trigger: "POST /carrier/notices/{noticeId}/mark-undeliverable"
        actor: Underwriter
        preconditions: []
        side_effects:
          - "If the parent case is a CancellationCase with status = NOTICE_SENT: Policy stays CANCEL_PENDING and the clock sweep refuses effectiveness until a replacement notice is dispatched (ERR_NOTICE_NOT_MAILED)"

  - entity: ReinstatementRequest
    initial_state: SUBMITTED
    terminal_states: [APPROVED, DENIED, EXPIRED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /carrier/reinstatement-requests/{requestId}/approve"
        actor: ComplianceOfficer
        preconditions:
          - "Segregation of duties vs requester (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "Policy CANCELLED -> ACTIVE (see Policy machine); REINSTATEMENT_FEE ledger entry posted"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /carrier/reinstatement-requests/{requestId}/deny"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: []
      - from: SUBMITTED
        to: EXPIRED
        trigger: "system (clock sweep: current date > policy.cancellation_effective_date + profile.reinstatement_window_days)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: AppealCase
    initial_state: FILED
    terminal_states: [UPHELD, OVERTURNED]
    note: "Creation (POST /carrier/appeals) requires the linked CancellationCase.status IN {NOTICE_SENT, EFFECTIVE}; otherwise ERR_INVALID_STATE"
    transitions:
      - from: FILED
        to: UNDER_REVIEW
        trigger: "POST /carrier/appeals/{appealId}/accept-for-review"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: []
      - from: UNDER_REVIEW
        to: UPHELD
        trigger: "POST /carrier/appeals/{appealId}/decide"
        actor: ComplianceOfficer
        preconditions:
          - "payload.decision = UPHELD"
          - "Segregation of duties: deciding officer != officer who accepted for review (ERR_SEGREGATION_OF_DUTIES)"
        side_effects: []
      - from: UNDER_REVIEW
        to: OVERTURNED
        trigger: "POST /carrier/appeals/{appealId}/decide"
        actor: ComplianceOfficer
        preconditions:
          - "payload.decision = OVERTURNED"
          - "Segregation of duties: deciding officer != officer who accepted for review (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "If linked CancellationCase.status = EFFECTIVE: case -> RESCINDED, Policy CANCELLED -> ACTIVE with reinstatements_used unchanged, a compensating PremiumLedgerEntry entry_kind = RETURN_PRO_RATA with positive amount equal to the negative return entry is posted, and RegulatoryReport rescinded_count += 1"

  - entity: RegulatoryReport
    initial_state: OPEN
    terminal_states: [FINALIZED]
    transitions:
      - from: OPEN
        to: FINALIZED
        trigger: "POST /carrier/regulatory-reports/{reportId}/finalize"
        actor: ComplianceOfficer
        preconditions:
          - "Current clock month > report.report_period (ERR_REPORT_PERIOD_STILL_OPEN)"
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: policy-reinstate-stale-version
    parent_entity: Policy
    write_endpoint: "POST /carrier/reinstatement-requests"
    occ_field: "expected_policy_version"
    description: |
      Creating a ReinstatementRequest against a Policy whose version has
      advanced since the client last observed it is rejected. This captures
      the case where another writer has just submitted a reinstatement
      request (which, once approved, would consume one of the policy's
      limited reinstatement slots) and the current writer's view of the
      policy is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: policy-cancellation-case-stale-version
    parent_entity: Policy
    write_endpoint: "POST /carrier/cancellation-cases"
    occ_field: "expected_policy_version"
    description: |
      Creating a CancellationCase against a Policy whose version has
      advanced since the client last observed it is rejected. The client's
      view of policy status (and of any already-open case) is stale, so
      the open-case exclusivity check would run against obsolete data.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: return_premium
    trigger: "CancellationCase creation (method pinned), re-finalized when the case becomes EFFECTIVE"
    algorithm: tiered_pricing
    formula: |
      term_days = (policy.term_end_date - policy.term_start_date) in whole days
      elapsed_days = (case.scheduled_effective_date - policy.term_start_date) in whole days,
                     clamped to [0, term_days]
      unearned_cents = round_half_up(policy.total_premium_cents * (term_days - elapsed_days) / term_days)
      PRO_RATA:  return_premium_cents = unearned_cents
      SHORT_RATE: return_premium_cents = round_half_up(unearned_cents * (1 - profile.short_rate_penalty_pct))
      Evaluation order pinned: compute term_days, then elapsed_days, then unearned_cents
      (rounded once), then apply penalty with a second rounding. Rounding twice in this
      order is mandatory — summing first then rounding is forbidden.
    input_set: "Policy (pinned StateFilingProfile), CancellationCase; only when case status moves DRAFT -> PENDING_APPROVAL (method pinned) and again on NOTICE_SENT -> EFFECTIVE (amount finalized)"
    constants:
      DAYS_IN_TERM: "derived per policy, never a constant"
    precision: "0 decimal places (whole cents), round_half_up"
    variants:
      - name: pro_rata
        when: "ground_code = INSURED_REQUEST AND profile.short_rate_penalty_pct = 0.0; OR ground_code is insurer-initiated (NONPAYMENT, MATERIAL_MISREPRESENTATION, SUBSTANTIAL_CHANGE_IN_RISK, LICENSE_SUSPENSION)"
        difference: "Full unearned premium returned; no penalty fraction applied"
      - name: short_rate
        when: "ground_code = INSURED_REQUEST AND profile.short_rate_penalty_pct > 0.0"
        difference: "Penalty fraction profile.short_rate_penalty_pct withheld from unearned premium — same inputs yield strictly smaller return_premium_cents than pro_rata"

  - name: notice_window
    trigger: "CancellationCase creation (earliest_effective_date); NonrenewalCase creation (notice_deadline_date)"
    algorithm: threshold
    formula: |
      Cancellation earliest_effective_date:
        base_days = (ground_code = NONPAYMENT) ? profile.nonpayment_notice_days
                                               : profile.other_grounds_notice_days
        recipient_days = max over recipients of required days:
          policyholder: base_days
          each InsuredInterest row: profile.mortgagee_notice_days
        earliest_effective_date = requested_on_date + max(base_days, recipient_days_if_any_interests)
        (INSURED_REQUEST uses other_grounds_notice_days tier.)
      Nonrenewal notice_deadline_date:
        notice_deadline_date = policy.term_end_date - profile.nonrenewal_notice_days
      Boundary precision: mailing on notice_deadline_date exactly is ON TIME (<=);
      mailing one day later is LATE. Effective date equal to earliest_effective_date
      exactly is PERMITTED (>=).
    input_set: "CancellationCase / NonrenewalCase, pinned StateFilingProfile, policy's InsuredInterest rows (all statuses)"
    constants: {}
    precision: "whole days; ISO date arithmetic, no time-of-day"
    variants: []

  - name: reinstatement_fee
    trigger: "ReinstatementRequest creation"
    algorithm: threshold
    formula: |
      window_days = profile.reinstatement_window_days
      lapse_days = submitted_on_date - policy.cancellation_effective_date (whole days, >= 0)
      Eligibility gate: lapse_days <= window_days else request rejected (ERR_REINSTATEMENT_WINDOW_CLOSED)
      Tiered fee on lapse_days (boundary: <= tier bound falls in lower tier):
        lapse_days <= 10             -> fee = 0
        10 < lapse_days <= 30        -> fee = 2500
        lapse_days > 30              -> fee = 5000
      Circular-looking dependency pinned: eligibility is evaluated on lapse_days FIRST,
      fee tier SECOND; the fee never feeds back into eligibility.
    input_set: "ReinstatementRequest, Policy (cancellation_effective_date), pinned StateFilingProfile"
    constants:
      TIER1_DAYS: 10
      TIER1_FEE_CENTS: 0
      TIER2_DAYS: 30
      TIER2_FEE_CENTS: 2500
      TIER3_FEE_CENTS: 5000
    precision: "whole days; whole cents"
    variants: []

  - name: nonrenewal_volume
    trigger: "system cascades (case reaches COMPLETED / EFFECTIVE / RESCINDED) and GET /carrier/regulatory-reports"
    algorithm: aggregation
    formula: |
      For RegulatoryReport row (profile P, period YYYY-MM):
        nonrenewal_count = count of NonrenewalCase with status = COMPLETED
          whose policy.state_profile_id = P.id and whose policy.term_end_date falls in the period
          [YYYY-MM-01, first day of next month) — left-closed, right-open
        cancellation_count = count of CancellationCase with status = EFFECTIVE
          whose policy.state_profile_id = P.id and whose scheduled_effective_date falls in the period
          [YYYY-MM-01, first day of next month)
        rescinded_count = count of CancellationCase + NonrenewalCase whose rescission date falls in period
      Tie-break / ordering: counts are order-insensitive; report rows are auto-created OPEN on first cascade hit
    input_set: "NonrenewalCase (status COMPLETED), CancellationCase (status EFFECTIVE or RESCINDED), joined through Policy to StateFilingProfile"
    constants: {}
    precision: "integer counts"
    variants: []

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and well-formed"
    error_id: ERR_MISSING_AUTH_CONTEXT
    http_status: 400
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Role permitted for this endpoint per §1.5 roles"
    error_id: ERR_FORBIDDEN_FOR_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Path ids resolve (profile, policyholder, policy, case, notice, request, appeal, report), validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all resource endpoints"
  - priority: 4
    category: state
    check: "Target resource in a state that admits the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 5
    category: business_safety
    check: "Segregation of duties: approver/decider X-User-ID must differ from the X-User-ID that performed the preceding step (case creator, review accepter)"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "approve / decide endpoints"
  - priority: 6
    category: business_safety
    check: "Statutory ground permitted: cancellation ground_code must be in the ACTIVE profile's permissible_grounds (or be INSURED_REQUEST)"
    error_id: ERR_GROUND_NOT_PERMITTED_IN_STATE
    http_status: 422
    applies_to: "POST /carrier/cancellation-cases"
  - priority: 7
    category: business_safety
    check: "Notice set completeness & statutory mailing windows (policyholder + every InsuredInterest; mailed_on_date + required days <= scheduled_effective_date; nonrenewal mailed_on_date <= notice_deadline_date)"
    error_id: "ERR_NOTICE_SET_INCOMPLETE | ERR_NOTICE_PERIOD_SHORTFALL | ERR_NONRENEWAL_NOTICE_LATE | ERR_MAILING_DATE_IN_FUTURE"
    http_status: 422
    applies_to: "dispatch-notices endpoints"
  - priority: 8
    category: business_temporal
    check: "scheduled_effective_date >= earliest_effective_date; nonrenewal created on/before notice_deadline_date; reinstatement within window"
    error_id: "ERR_EFFECTIVE_DATE_TOO_EARLY | ERR_NONRENEWAL_DEADLINE_PASSED | ERR_REINSTATEMENT_WINDOW_CLOSED"
    http_status: 422
    applies_to: "approve / create endpoints as applicable"
  - priority: 9
    category: business_constraint
    check: "Uniqueness: one open CancellationCase per policy; one open NonrenewalCase per policy; one ACTIVE profile per state_code; policy_number globally unique"
    error_id: "ERR_CANCELLATION_ALREADY_OPEN | ERR_NONRENEWAL_ALREADY_OPEN | ERR_STATE_PROFILE_CONFLICT | ERR_DUPLICATE_POLICY_NUMBER"
    http_status: 409
    applies_to: "create endpoints"
  - priority: 10
    category: business_referential
    check: "Referenced entities cohere: insured_interest_id belongs to the case's policy; profile is ACTIVE at policy issuance; retire target not referenced by live policies"
    error_id: "ERR_INTEREST_POLICY_MISMATCH | ERR_STATE_PROFILE_IN_USE | ERR_INVALID_REQUEST"
    http_status: 422
    applies_to: "notice dispatch, policy issuance, profile retire"
  - priority: 11
    category: business_fiscal
    check: "OCC: expected_policy_version equals Policy.version at write time"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /carrier/cancellation-cases, POST /carrier/reinstatement-requests"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Clock (test-driving; default time 2026-08-01T00:00:00Z) ---
  - method: POST
    path: "/carrier/_clock/set_current_utc"
    description: "Set the server's logical clock to an ISO-8601 UTC instant. Startup default (before any call) is exactly 2026-08-01T00:00:00Z; the logical clock never falls back to wall-clock time."
    roles: [ComplianceOfficer]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects:
      - "Advance clock; run sweeps: cancellation effectiveness, policy expiry, reinstatement expiry, lapse_flag recompute"

  # --- State filing profiles ---
