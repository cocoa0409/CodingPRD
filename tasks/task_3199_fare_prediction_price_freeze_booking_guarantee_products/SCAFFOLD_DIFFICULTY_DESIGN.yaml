            - "GuaranteeClaim.${c1_id}.claim_status remains UNDER_REVIEW and no payout is disbursed"
            - "GuaranteeClaim.${c1_id}.audit_ready == false because approver_user_id equals filer_user_id"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: boundary_overshoot_zero_hits_the_hedge_cap_exactly
        grounds:
          - calculations.guarantee_hedge_rebalance
          - entities.PriceFreeze.fields.capped_impact_cents
          - entities.PriceFreeze.fields.unhedged_exposure_cents
          - endpoints.POST_/fare/claims
        distinguishing_aspect: |
          The overshoot rule is left-closed and the absorption cap is left-closed, so a market price
          exactly equal to the active base fare yields overshoot 0 and capped impact 0, while a market
          price exactly one cent above the cap boundary yields the saturating 14952.00 — this is a
          numeric-threshold boundary on a different metric from the watch cooldown boundary.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Route R1 base 8900 with peak_price_day_index 4; itinerary I1 carries freeze F1 with manifest 8900 and cap 12460; a second itinerary I2 carries freeze F2 with the identical manifest and cap."
