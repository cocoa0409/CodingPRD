            - { call: "GET /change-orders/${coa}", payload: {}, as: OwnerRepPM, as_user_id: "pm-1", captures: { coa_st: $.data.status, coa_sb: $.data.superseded_by_id } }
          assert:
            - "cob_st == DRAFT   # successor created normally"
            - "coa_st == REJECTED and coa_sb == ${cob}   # predecessor auto-rejected with back-link"

      - name: duplicate_report_period_rejected
        claim_type: violation_to_error
        grounds:
          - "validations[priority=9]"
          - "errors[ERR_DUPLICATE_REPORT_PERIOD]"
        distinguishing_aspect: "At most one owner report per (program, period): a second POST for 2026-08 fails with ERR_DUPLICATE_REPORT_PERIOD even though the first is only DRAFT."
