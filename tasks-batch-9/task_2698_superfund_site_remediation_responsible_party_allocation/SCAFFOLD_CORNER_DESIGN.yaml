              as: SettlementCounsel
              as_user_id: "sc-001"
              captures: { action_2: $.data.id }
          assert:
            - "the first demand returns HTTP 201 with CostRecoveryAction.${action_1}.status == OFFERED and respondent_share_pct_at_offer == 99.28, stamped from the party as counsel read it"
            - "the rejection returns HTTP 200 with status == REJECTED and moves PotentiallyResponsibleParty.${prp_a}.status to RECALCITRANT, which increments that party's version"
            - "the follow-up demand carrying the stale ${prp_a_v} returns HTTP 412 with $.data.error_id == ERR_STALE_PRP_VERSION"
            - "the refusal is inert: GET /sites/${site_id}/cost-recovery-actions still reports total_count 1 and ${action_1}.status is still REJECTED"
            - "the re-read ${prp_a_v2} is strictly greater than ${prp_a_v} and the retried demand returns HTTP 201 with ${action_2}.status == OFFERED and respondent_share_pct_at_offer == 99.28"
            - "the two OCC rules are independent: this create carried no expected_site_version and the site's own version has moved many times since the round was opened"

      - name: corner_derived_party_totals_reconcile_after_add_verify_and_reject
        claim_type: derived_field_reconciliation
        grounds:
