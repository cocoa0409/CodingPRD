              as: ComplianceOfficer
              captures: { prod_flu: $.data.id }
            - call: "POST /immunization/stores/${store_s}/lots"
              payload: { vaccine_product_id: "${prod_flu}", lot_number: "L1", expiration_date: "2027-01-01", doses_received: 10 }
              as: StoreManager
              captures: { lot_l1: $.data.id }
            - call: "POST /immunization/clinic-events"
              payload: { store_id: "${store_s}", employer_name: "Acme Corp", event_start: "2026-09-01T10:00:00Z", event_end: "2026-09-01T12:00:00Z", mobile_lot_id: "${lot_l1}", doses_reserved: 4 }
              as: StoreManager
              captures: { event_e: $.data.id }
            - call: "POST /immunization/clinic-events/${event_e}/close"
              payload: {}
              as: StoreManager
            - call: "POST /immunization/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T11:00:00Z" }
              as: StoreManager
            - call: "POST /immunization/clinic-events/${event_e}/close"
              payload: {}
              as: StoreManager
            - call: "POST /immunization/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T12:00:00Z" }
              as: StoreManager
          trigger:
            - call: "POST /immunization/clinic-events/${event_e}/close"
              payload: {}
              as: StoreManager
              captures: { event_status: $.data.status, event_admin: $.data.doses_administered }
            - call: "GET /immunization/lots/${lot_l1}"
              as: StoreManager
              captures: { lot_avail_final: $.data.doses_available }
          assert:
            - "the close call at 09:00 returned 409 ERR_EVENT_NOT_ACTIVE (event still PLANNED — activation had not fired)"
            - "the close call at 11:00 returned 409 ERR_EVENT_STILL_RUNNING (ACTIVE but now 11:00 < event_end 12:00)"
            - "captured event_status == CLOSED (the 12:00 close succeeds at exactly event_end; the activation window is [start, end) so the event is no longer ACTIVE-gated on time)"
            - "captured event_admin == 0 and lot_avail_final == 10 (4 reserved returned unused; reconciliation invariant nets to zero administered)"

  # ===========================================================================
  # Rule 8 — resource_temporal_overlap (≥2 instances, DIFFERENT interval semantics)
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: appointment_slot_overlap_half_open_fixed_15min
        grounds:
          - validations[priority=10]
          - errors[ERR_SLOT_CONFLICT]
          - entities.ImmunizationAppointment.fields.slot_start
        distinguishing_aspect: |
          Interval semantics A — fixed-length half-open 15-minute slots on the
          store resource: [slot_start, slot_start+15min); a second non-walk-in
          booking at slot_start+15min exactly is back-to-back ADJACENT and
          allowed, while slot_start+14min overlaps and is rejected with
          ERR_SLOT_CONFLICT. Walk-ins bypass this check entirely.
        test_recipe:
          setup:
            - "Store S (CA); product FLU; protocol ACTIVE; adult patients P10a, P10b, P10c"
            - "Existing SCHEDULED appointment at 2026-09-02T10:00:00Z (occupies [10:00, 10:15))"
          setup_api_calls:
            - call: "POST /immunization/stores"
              payload: { store_number: "S-1500", state_code: "CA", address_line: "15 Main St" }
              as: StoreManager
              captures: { store_s: $.data.id }
            - call: "POST /immunization/vaccine-products"
              payload: { cvx_code: "141", name: "Influenza Quadrivalent", min_patient_age_years: 0, doses_per_series: 1, cash_price_cents: 5000, fridge_temp_min_c: 2.0, fridge_temp_max_c: 8.0, observation_minutes: 15 }
              as: ComplianceOfficer
              captures: { prod_flu: $.data.id }
            - call: "POST /immunization/state-protocols"
              payload: { state_code: "CA", vaccine_product_id: "${prod_flu}", authority_type: "STANDING_ORDER", min_patient_age_years: 0, registry_format: "HL7_VXU", registry_deadline_hours: 24, max_doses_per_patient_per_day: 2 }
              as: ComplianceOfficer
            - call: "POST /immunization/patients"
              payload: { full_name: "Pat Ten A", date_of_birth: "1980-01-01", state_code: "CA" }
              as: PharmacyTechnician
              captures: { pat_a: $.data.id }
            - call: "POST /immunization/patients"
              payload: { full_name: "Pat Ten B", date_of_birth: "1981-01-01", state_code: "CA" }
              as: PharmacyTechnician
              captures: { pat_b: $.data.id }
            - call: "POST /immunization/patients"
              payload: { full_name: "Pat Ten C", date_of_birth: "1982-01-01", state_code: "CA" }
              as: PharmacyTechnician
              captures: { pat_c: $.data.id }
            - call: "POST /immunization/appointments"
              payload: { store_id: "${store_s}", patient_id: "${pat_a}", vaccine_product_id: "${prod_flu}", slot_start: "2026-09-02T10:00:00Z" }
              as: PharmacyTechnician
              captures: { appt_first: $.data.id }
          trigger:
            - call: "POST /immunization/appointments"
              payload: { store_id: "${store_s}", patient_id: "${pat_b}", vaccine_product_id: "${prod_flu}", slot_start: "2026-09-02T10:14:00Z" }
              as: PharmacyTechnician
            - call: "POST /immunization/appointments"
              payload: { store_id: "${store_s}", patient_id: "${pat_c}", vaccine_product_id: "${prod_flu}", slot_start: "2026-09-02T10:15:00Z" }
              as: PharmacyTechnician
              captures: { appt_adjacent: $.data.id, appt_adjacent_status: $.data.status }
          assert:
            - "the 10:14 booking trigger returns 409 ERR_SLOT_CONFLICT ([10:14, 10:29) intersects [10:00, 10:15))"
            - "captured appt_adjacent_status == SCHEDULED — [10:15, 10:30) touches but does not overlap the half-open [10:00, 10:15); adjacency is allowed"
            - "a walk-in booking at 10:05 would bypass the slot check entirely (is_walk_in true) — covered by corner design"

      - name: clinic_event_mobile_lot_aggregate_capacity_overlapping_windows
        grounds:
          - validations[priority=16]
          - errors[ERR_MOBILE_LOT_OVER_RESERVED]
          - entities.ClinicEvent.fields.doses_reserved
        distinguishing_aspect: |
          Interval semantics B — different resource (VaccineLot as mobile
          inventory) and different geometry: caller-supplied variable-length
          windows with AGGREGATE capacity (sum of overlapping reservations
          must leave room), closed-start open-end with touching endpoints NOT
          overlapping. An event starting exactly at another's event_end
          coexists freely; an overlapping window whose reservation sum exceeds
          remaining capacity is rejected even though raw capacity alone
          (priority 15) passes.
        test_recipe:
          setup:
            - "Store S (CA); product FLU; lot L1 RELEASED with doses_available 10"
            - "Existing PLANNED event E1 on L1: 10:00–12:00, doses_reserved 6"
            - "Second event E2: 12:00–14:00, doses_reserved 9 — touching endpoint, no overlap → allowed even though 6 + 9 > 10"
            - "Third event E3: 11:00–13:00, doses_reserved 5 — overlaps both E1 and E2"
          setup_api_calls:
            - call: "POST /immunization/stores"
              payload: { store_number: "S-1600", state_code: "CA", address_line: "16 Main St" }
              as: StoreManager
              captures: { store_s: $.data.id }
            - call: "POST /immunization/vaccine-products"
              payload: { cvx_code: "141", name: "Influenza Quadrivalent", min_patient_age_years: 0, doses_per_series: 1, cash_price_cents: 5000, fridge_temp_min_c: 2.0, fridge_temp_max_c: 8.0, observation_minutes: 15 }
              as: ComplianceOfficer
              captures: { prod_flu: $.data.id }
            - call: "POST /immunization/stores/${store_s}/lots"
              payload: { vaccine_product_id: "${prod_flu}", lot_number: "L1", expiration_date: "2027-01-01", doses_received: 10 }
              as: StoreManager
              captures: { lot_l1: $.data.id }
            - call: "POST /immunization/clinic-events"
              payload: { store_id: "${store_s}", employer_name: "Acme Corp", event_start: "2026-09-01T10:00:00Z", event_end: "2026-09-01T12:00:00Z", mobile_lot_id: "${lot_l1}", doses_reserved: 6 }
              as: StoreManager
              captures: { event_e1: $.data.id }
            - call: "POST /immunization/clinic-events"
              payload: { store_id: "${store_s}", employer_name: "Beta LLC", event_start: "2026-09-01T12:00:00Z", event_end: "2026-09-01T14:00:00Z", mobile_lot_id: "${lot_l1}", doses_reserved: 9 }
              as: StoreManager
              captures: { event_e2: $.data.id, event_e2_status: $.data.status }
          trigger:
            - call: "POST /immunization/clinic-events"
              payload: { store_id: "${store_s}", employer_name: "Gamma Inc", event_start: "2026-09-01T11:00:00Z", event_end: "2026-09-01T13:00:00Z", mobile_lot_id: "${lot_l1}", doses_reserved: 5 }
              as: StoreManager
          assert:
            - "captured event_e2_status == PLANNED — E2 starts exactly at E1's event_end (touching endpoints, open-end semantics) so the two windows do NOT overlap and 6 + 9 > 10 is irrelevant"
            - "the E3 trigger returns 422 ERR_MOBILE_LOT_OVER_RESERVED: E3 overlaps E1 ([11:00,12:00) ∩ [10:00,12:00) non-empty), so 5 > 10 − 6 = 4 fails; raw capacity (5 <= 10) passed, proving priority 16 is the firing rule and the aggregate semantics differ from the fixed-slot rule"

  # ===========================================================================
  # Rule 9 — compensating_invariant (≥2 instances, DIFFERENT conserved quantities)
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: administer_then_void_conserves_lot_doses_available
        grounds:
          - state_machines.ImmunizationAppointment.CONSENTED_to_VACCINATED
          - state_machines.ImmunizationRecord.COMPLETED_to_VOIDED
          - entities.VaccineLot.fields.doses_available
        distinguishing_aspect: |
          Conserved quantity: VaccineLot.doses_available (dose inventory). The
          forward administer action (−1) paired with its compensating void
          (+1) must leave doses_available bit-identical to the
          pre-administration value, while the RegistrySubmission is pulled
          from the queue and the open ObservationSession auto-completes — no
          drift in the named quantity across the compensation.
        test_recipe:
          setup:
            - "Full administration completed at store S from lot L1 (doses_received 7 → doses_available 6 after administer; lot version 2)"
            - "The record's RegistrySubmission is still PENDING (voidable)"
            - "The record's ObservationSession is still IN_PROGRESS"
          setup_api_calls:
            - call: "POST /immunization/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T09:55:00Z" }
              as: StoreManager
            - call: "POST /immunization/stores"
              payload: { store_number: "S-1700", state_code: "CA", address_line: "17 Main St" }
              as: StoreManager
              captures: { store_s: $.data.id }
            - call: "POST /immunization/vaccine-products"
              payload: { cvx_code: "141", name: "Influenza Quadrivalent", min_patient_age_years: 0, doses_per_series: 1, cash_price_cents: 5000, fridge_temp_min_c: 2.0, fridge_temp_max_c: 8.0, observation_minutes: 15 }
              as: ComplianceOfficer
              captures: { prod_flu: $.data.id }
            - call: "POST /immunization/state-protocols"
              payload: { state_code: "CA", vaccine_product_id: "${prod_flu}", authority_type: "STANDING_ORDER", min_patient_age_years: 0, registry_format: "HL7_VXU", registry_deadline_hours: 24, max_doses_per_patient_per_day: 2 }
              as: ComplianceOfficer
            - call: "POST /immunization/patients"
              payload: { full_name: "Pat Eleven", date_of_birth: "1980-01-01", state_code: "CA" }
              as: PharmacyTechnician
              captures: { pat_p11: $.data.id }
            - call: "POST /immunization/stores/${store_s}/lots"
              payload: { vaccine_product_id: "${prod_flu}", lot_number: "L1", expiration_date: "2027-01-01", doses_received: 7 }
              as: StoreManager
              captures: { lot_l1: $.data.id }
            - call: "POST /immunization/appointments"
              payload: { store_id: "${store_s}", patient_id: "${pat_p11}", vaccine_product_id: "${prod_flu}", slot_start: "2026-09-01T10:00:00Z", is_walk_in: true }
              as: PharmacyTechnician
              captures: { appt_a: $.data.id, appt_a_v: $.data.version }
            - call: "POST /immunization/appointments/${appt_a}/check-in"
              as: PharmacyTechnician
              as_user_id: "user-tech-1"
            - call: "POST /immunization/appointments/${appt_a}/questionnaire"
              payload: { answers: { FEVER_TODAY: false, PREGNANT: false, IMMUNOCOMPROMISED: false, PRIOR_ANAPHYLAXIS: false } }
              as: PharmacyTechnician
            - call: "POST /immunization/appointments/${appt_a}/review-consent"
              payload: { expected_appointment_version: "${appt_a_v + 2}", outcome: "CLEAR" }
              as: Pharmacist
              as_user_id: "user-pharm-1"
            - call: "POST /immunization/appointments/${appt_a}/administer"
              payload: { lot_id: "${lot_l1}", expected_lot_version: 1 }
              as: Immunizer
              as_user_id: "user-imm-1"
              captures: { rec_id: $.data.id }
          trigger:
            - call: "POST /immunization/immunization-records/${rec_id}/void"
              payload: { reason: "patient developed cold feet; dose never actually injected" }
              as: Pharmacist
              captures: { rec_status: $.data.status }
            - call: "GET /immunization/lots/${lot_l1}"
              as: StoreManager
              captures: { lot_avail_after: $.data.doses_available, lot_version_after: $.data.version }
            - call: "GET /immunization/immunization-records/${rec_id}/registry-submissions"
              as: ComplianceOfficer
              captures: { subs_after: $.data }
            - call: "GET /immunization/immunization-records/${rec_id}/observation-sessions"
              as: Pharmacist
              captures: { obs_status_after: "$.data[0].status" }
          assert:
            - "captured rec_status == VOIDED"
            - "captured lot_avail_after == 7 — invariant: administer (−1) + void (+1) conserves VaccineLot.doses_available exactly at the pre-administration value"
            - "captured lot_version_after == 3 (each mutation bumped the lot version: administer 2, void 3)"
            - "captured subs_after is an empty array (the PENDING submission was removed from the reporting queue)"
            - "captured obs_status_after == COMPLETED (open observation auto-closed, bypassing the required_minutes floor)"

      - name: clinic_event_activation_checkout_and_close_return_conserve_mobile_lot_inventory
        grounds:
          - state_machines.ClinicEvent.PLANNED_to_ACTIVE
          - state_machines.ClinicEvent.ACTIVE_to_CLOSED
          - calculations.clinic_event_reconciliation
        distinguishing_aspect: |
          Different conserved quantity: mobile-lot inventory across a clinic
          event lifecycle. Invariant pinned by clinic_event_reconciliation:
          after activation checkout (−reserved), per-administration decrements
          (−1 each), and close return (+(reserved − administered)), the lot's
          doses_available equals (value before activation) − doses_administered
          — with 10 available, 6 reserved, 2 administered the final value is
          exactly 8, no drift from the reservation round-trip.
        test_recipe:
          setup:
            - "Store S (CA); product FLU; lot L1 RELEASED with 10 doses"
            - "ClinicEvent E: window 10:00–12:00, doses_reserved 6, activated by clock at 10:30 (lot → 4)"
            - "Two patients administered at the event under E (each −1 → lot 2; event.doses_administered 2)"
            - "Clock at 12:00 → close"
