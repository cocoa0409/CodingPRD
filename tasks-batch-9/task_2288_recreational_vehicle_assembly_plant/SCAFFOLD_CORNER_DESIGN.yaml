            - "no row was written by any of the four calls: a following POST /dealers that reuses dealer_code D-NOREGION with a region supplied is accepted with 201, and a following POST /suppliers that reuses supplier_code SUP-NOCAT with component_categories [\"CHASSIS\"] is accepted with 201"

