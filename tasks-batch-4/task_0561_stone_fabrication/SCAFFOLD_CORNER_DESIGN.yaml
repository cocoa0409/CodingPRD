scaffold_corner_design:
  # =========================================================================
  # Table 1 — Entities
  # =========================================================================
  - section: entities
    instances:
      - name: project_create_defaults_and_system_fields
        claim_type: Defaults
        grounds:
          - entities.Project.fields.status
          - entities.Project.fields.payment_status
          - endpoints
        distinguishing_aspect: "POST /projects returns status=INTAKE, payment_status=UNPAID, amount_paid_cents=0, version=1, and a server-minted id; success envelope response_type=object."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /projects"
              payload: { customer_name: "Ann", address: "1 A St", material_grade: "STANDARD" }
              as: SalesRep
              captures: { p_id: $.data.id }
          assert:
            - "Project.${p_id}.status == INTAKE"
            - "Project.${p_id}.payment_status == UNPAID"
            - "Project.${p_id}.amount_paid_cents == 0"
            - "Project.${p_id}.version == 1"
            - "response envelope response_type == object and meta.api_request_id present"

      - name: project_create_missing_required_field_returns_validation
        claim_type: Required Fields
        grounds:
          - "entities.Project.fields.material_grade"
          - "errors[ERR_VALIDATION]"
        distinguishing_aspect: "POST /projects omitting material_grade returns ERR_VALIDATION (400)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /projects"
              payload: { customer_name: "Bo", address: "2 B St" }
              as: SalesRep
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_VALIDATION"

      - name: project_create_invalid_enum_returns_validation
        claim_type: Type Constraints
        grounds:
          - "entities.Project.fields.material_grade"
          - "errors[ERR_VALIDATION]"
        distinguishing_aspect: "POST /projects with material_grade=MARBLE (not in {STANDARD,PREMIUM,EXOTIC}) returns ERR_VALIDATION (400)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /projects"
              payload: { customer_name: "Cy", address: "3 C St", material_grade: "MARBLE" }
              as: SalesRep
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_VALIDATION"

      - name: get_project_not_found_returns_404
        claim_type: Not Found
        grounds:
          - "entities.Project"
          - "errors[ERR_PROJECT_NOT_FOUND]"
        distinguishing_aspect: "GET /projects/{random uuid} returns ERR_PROJECT_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /projects/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: SalesRep
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_PROJECT_NOT_FOUND"

      - name: slab_intake_defaults_computed
        claim_type: Computed Fields
        grounds:
          - entities.Slab.fields.status
          - entities.Slab.fields.reserved_sqft
          - entities.Slab.fields.remaining_sqft
        distinguishing_aspect: "POST /slabs nominal 50 returns status=IN_STOCK, reserved_sqft=0, remaining_sqft=50.00."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /slabs"
              payload: { slab_label: "SL9", material_grade: "PREMIUM", nominal_sqft: 50 }
              as: Fabricator
              captures: { sl_id: $.data.id }
          assert:
            - "Slab.${sl_id}.status == IN_STOCK"
            - "Slab.${sl_id}.reserved_sqft == 0"
            - "Slab.${sl_id}.remaining_sqft == 50.00"

      - name: cutout_charge_cents_computed_snapshot
        claim_type: Computed Fields
        grounds: [entities.Cutout.fields.charge_cents]
        distinguishing_aspect: "Adding a SINK cutout snapshots charge_cents=15000 (CUTOUT_CHARGE_CENTS[SINK])."
        test_recipe:
          setup: ["A project with a MEASURED template."]
          setup_api_calls:
            - call: "POST /projects"
              payload: { customer_name: "Di", address: "4 D St", material_grade: "PREMIUM" }
              as: SalesRep
              captures: { p_id: $.data.id }
            - call: "POST /projects/${p_id}/templates"
              payload: { measured_sqft: 40, edge_profile: "OGEE", edge_linear_ft: 25 }
              as: Fabricator
              captures: { t_id: $.data.id }
          trigger:
            - call: "POST /templates/${t_id}/cutouts"
              payload: { cutout_type: "SINK" }
              as: Fabricator
              captures: { cut_id: $.data.id, ch: $.data.charge_cents }
          assert:
            - "Cutout.${cut_id}.charge_cents == 15000"

  # =========================================================================
  # Table 2 — State Machines
  # =========================================================================
  - section: state_machines
    instances:
      - name: qc_from_scheduled_returns_invalid_transition
        claim_type: Invalid Transitions
        grounds:
          - "state_machines.FabricationOrder.CUTTING_to_QC_PASSED"
          - "errors[ERR_INVALID_TRANSITION]"
        distinguishing_aspect: "Calling qc on a SCHEDULED fab order (qc requires CUTTING) returns ERR_INVALID_TRANSITION; no state change."
        test_recipe:
          setup: ["PREMIUM project, quote, deposit, approved template, slab, bay, fab order SCHEDULED."]
          setup_api_calls:
            - call: "POST /projects"
              payload: { customer_name: "Ed", address: "5 E St", material_grade: "PREMIUM" }
              as: SalesRep
              captures: { p_id: $.data.id, p_v0: $.data.version }
            - call: "POST /projects/${p_id}/quotes"
              payload: { expected_project_version: "${p_v0}", est_sqft: 40, material_grade: "PREMIUM", edge_profile: "OGEE", edge_linear_ft: 25, sink_count: 2, faucet_count: 0, cooktop_count: 0 }
              as: SalesRep
            - call: "POST /projects/${p_id}/payments"
              payload: { amount_cents: 170000, kind: "DEPOSIT" }
              as: SalesRep
            - call: "POST /projects/${p_id}/templates"
              payload: { measured_sqft: 40, edge_profile: "OGEE", edge_linear_ft: 25 }
              as: Fabricator
              captures: { t_id: $.data.id }
            - call: "POST /templates/${t_id}/approve"
              payload: {}
              as: Fabricator
            - call: "POST /slabs"
              payload: { slab_label: "SL1", material_grade: "PREMIUM", nominal_sqft: 50 }
              as: Fabricator
              captures: { sl_id: $.data.id }
            - call: "POST /bays"
              payload: { name: "BAY1" }
              as: ShopManager
              captures: { b_id: $.data.id }
            - call: "POST /fabrication-orders"
              payload: { project_id: "${p_id}", template_id: "${t_id}", slab_id: "${sl_id}", bay_id: "${b_id}", scheduled_start: "2026-06-10T08:00:00Z", scheduled_end: "2026-06-10T12:00:00Z", pieces: [ { label: "A", sqft: 25 } ] }
              as: Fabricator
              captures: { f_id: $.data.id }
          trigger:
            - call: "POST /fabrication-orders/${f_id}/qc"
              payload: { result: "PASS" }
              as: Fabricator
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_TRANSITION"
            - "FabricationOrder.${f_id}.status == SCHEDULED"

      - name: cancel_completed_fab_returns_invalid_transition_terminal
        claim_type: Terminal State Lockdown
        grounds:
          - "state_machines.FabricationOrder.QC_PASSED_to_COMPLETE"
          - "errors[ERR_INVALID_TRANSITION]"
        distinguishing_aspect: "Cancelling a COMPLETE (terminal) fab order returns ERR_INVALID_TRANSITION; slab stays CONSUMED."
        test_recipe:
          setup: ["PREMIUM project, quote, deposit, approved template, slab, bay, fab order COMPLETE (slab CONSUMED)."]
          setup_api_calls:
            - call: "POST /projects"
              payload: { customer_name: "Fi", address: "6 F St", material_grade: "PREMIUM" }
              as: SalesRep
              captures: { p_id: $.data.id, p_v0: $.data.version }
            - call: "POST /projects/${p_id}/quotes"
              payload: { expected_project_version: "${p_v0}", est_sqft: 40, material_grade: "PREMIUM", edge_profile: "OGEE", edge_linear_ft: 25, sink_count: 2, faucet_count: 0, cooktop_count: 0 }
              as: SalesRep
            - call: "POST /projects/${p_id}/payments"
              payload: { amount_cents: 170000, kind: "DEPOSIT" }
              as: SalesRep
            - call: "POST /projects/${p_id}/templates"
              payload: { measured_sqft: 40, edge_profile: "OGEE", edge_linear_ft: 25 }
              as: Fabricator
              captures: { t_id: $.data.id }
            - call: "POST /templates/${t_id}/approve"
              payload: {}
              as: Fabricator
            - call: "POST /slabs"
              payload: { slab_label: "SL1", material_grade: "PREMIUM", nominal_sqft: 50 }
              as: Fabricator
              captures: { sl_id: $.data.id }
            - call: "POST /bays"
              payload: { name: "BAY1" }
              as: ShopManager
              captures: { b_id: $.data.id }
            - call: "POST /fabrication-orders"
              payload: { project_id: "${p_id}", template_id: "${t_id}", slab_id: "${sl_id}", bay_id: "${b_id}", scheduled_start: "2026-06-10T08:00:00Z", scheduled_end: "2026-06-10T12:00:00Z", pieces: [ { label: "A", sqft: 25 }, { label: "B", sqft: 15 } ] }
              as: Fabricator
              captures: { f_id: $.data.id }
            - call: "POST /fabrication-orders/${f_id}/start-cut"
              payload: {}
              as: Fabricator
            - call: "POST /fabrication-orders/${f_id}/qc"
              payload: { result: "PASS" }
              as: Fabricator
            - call: "POST /fabrication-orders/${f_id}/complete"
              payload: {}
              as: Fabricator
          trigger:
            - call: "POST /fabrication-orders/${f_id}/cancel"
              payload: {}
              as: Fabricator
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_TRANSITION"
            - "Slab.${sl_id}.status == CONSUMED"

      - name: recut_loop_qc_fail_then_restart_cut
        claim_type: Valid Transition
        grounds:
          - state_machines.FabricationOrder.CUTTING_to_RECUTTING
          - state_machines.FabricationOrder.RECUTTING_to_CUTTING
        distinguishing_aspect: "qc FAIL moves CUTTING->RECUTTING, then start-cut moves RECUTTING->CUTTING (the recut cycle)."
        test_recipe:
          setup: ["PREMIUM project, quote, deposit, approved template, slab, bay, fab order CUTTING."]
          setup_api_calls:
            - call: "POST /projects"
              payload: { customer_name: "Gi", address: "7 G St", material_grade: "PREMIUM" }
              as: SalesRep
              captures: { p_id: $.data.id, p_v0: $.data.version }
            - call: "POST /projects/${p_id}/quotes"
              payload: { expected_project_version: "${p_v0}", est_sqft: 40, material_grade: "PREMIUM", edge_profile: "OGEE", edge_linear_ft: 25, sink_count: 2, faucet_count: 0, cooktop_count: 0 }
              as: SalesRep
            - call: "POST /projects/${p_id}/payments"
              payload: { amount_cents: 170000, kind: "DEPOSIT" }
              as: SalesRep
            - call: "POST /projects/${p_id}/templates"
              payload: { measured_sqft: 40, edge_profile: "OGEE", edge_linear_ft: 25 }
              as: Fabricator
              captures: { t_id: $.data.id }
            - call: "POST /templates/${t_id}/approve"
              payload: {}
              as: Fabricator
            - call: "POST /slabs"
              payload: { slab_label: "SL1", material_grade: "PREMIUM", nominal_sqft: 50 }
              as: Fabricator
              captures: { sl_id: $.data.id }
            - call: "POST /bays"
              payload: { name: "BAY1" }
              as: ShopManager
              captures: { b_id: $.data.id }
            - call: "POST /fabrication-orders"
              payload: { project_id: "${p_id}", template_id: "${t_id}", slab_id: "${sl_id}", bay_id: "${b_id}", scheduled_start: "2026-06-10T08:00:00Z", scheduled_end: "2026-06-10T12:00:00Z", pieces: [ { label: "A", sqft: 25 }, { label: "B", sqft: 15 } ] }
              as: Fabricator
              captures: { f_id: $.data.id }
            - call: "POST /fabrication-orders/${f_id}/start-cut"
              payload: {}
              as: Fabricator
          trigger:
            - call: "POST /fabrication-orders/${f_id}/qc"
              payload: { result: "FAIL" }
              as: Fabricator
            - call: "POST /fabrication-orders/${f_id}/start-cut"
              payload: {}
              as: Fabricator
              captures: { st: $.data.status }
          assert:
            - "FabricationOrder.${f_id}.status == CUTTING (after RECUTTING -> start-cut)"

      - name: warranty_seal_repair_branch_no_reopen
        claim_type: Side Effect Execution
        grounds: [state_machines.WarrantyClaim.SUBMITTED_to_RESOLVED, entities.Project.fields.status]
        distinguishing_aspect: "Resolving a claim SEAL_REPAIR sets resolution=SEAL_REPAIR, status=RESOLVED, and leaves Project INSTALLED (no production reopen), unlike the REPLACEMENT branch."
        test_recipe:
          setup: ["Full pipeline to install DONE (Project INSTALLED) with a SUBMITTED warranty claim within the window."]
          setup_api_calls:
            - call: "POST /projects"
              payload: { customer_name: "Ha", address: "8 H St", material_grade: "PREMIUM" }
              as: SalesRep
              captures: { p_id: $.data.id, p_v0: $.data.version }
            - call: "POST /projects/${p_id}/quotes"
              payload: { expected_project_version: "${p_v0}", est_sqft: 40, material_grade: "PREMIUM", edge_profile: "OGEE", edge_linear_ft: 25, sink_count: 2, faucet_count: 0, cooktop_count: 0 }
              as: SalesRep
            - call: "POST /projects/${p_id}/payments"
              payload: { amount_cents: 170000, kind: "DEPOSIT" }
              as: SalesRep
            - call: "POST /projects/${p_id}/templates"
              payload: { measured_sqft: 40, edge_profile: "OGEE", edge_linear_ft: 25 }
              as: Fabricator
              captures: { t_id: $.data.id }
            - call: "POST /templates/${t_id}/approve"
              payload: {}
              as: Fabricator
            - call: "POST /slabs"
              payload: { slab_label: "SL1", material_grade: "PREMIUM", nominal_sqft: 50 }
              as: Fabricator
              captures: { sl_id: $.data.id }
            - call: "POST /bays"
              payload: { name: "BAY1" }
              as: ShopManager
              captures: { b_id: $.data.id }
            - call: "POST /fabrication-orders"
              payload: { project_id: "${p_id}", template_id: "${t_id}", slab_id: "${sl_id}", bay_id: "${b_id}", scheduled_start: "2026-06-10T08:00:00Z", scheduled_end: "2026-06-10T12:00:00Z", pieces: [ { label: "A", sqft: 25 }, { label: "B", sqft: 15 } ] }
              as: Fabricator
              captures: { f_id: $.data.id }
            - call: "POST /fabrication-orders/${f_id}/start-cut"
              payload: {}
              as: Fabricator
            - call: "POST /fabrication-orders/${f_id}/qc"
              payload: { result: "PASS" }
              as: Fabricator
            - call: "POST /fabrication-orders/${f_id}/complete"
              payload: {}
              as: Fabricator
            - call: "POST /crews"
              payload: { name: "CREW1" }
              as: ShopManager
              captures: { c_id: $.data.id }
            - call: "POST /install-jobs"
              payload: { project_id: "${p_id}", fabrication_order_id: "${f_id}", crew_id: "${c_id}", install_date: "2026-06-15" }
              as: Installer
              captures: { ij_id: $.data.id }
            - call: "POST /install-jobs/${ij_id}/start"
              payload: {}
              as: Installer
            - call: "POST /install-jobs/${ij_id}/complete"
              payload: {}
              as: Installer
            - call: "POST /install-jobs/${ij_id}/warranty-claims"
              payload: { claim_type: "SEAL", description: "sealer worn" }
              as: Installer
              captures: { wc_id: $.data.id }
          trigger:
            - call: "POST /warranty-claims/${wc_id}/resolve"
              payload: { resolution: "SEAL_REPAIR" }
              as: Installer
          assert:
            - "WarrantyClaim.${wc_id}.status == RESOLVED"
            - "WarrantyClaim.${wc_id}.resolution == SEAL_REPAIR"
            - "Project.${p_id}.status == INSTALLED (no reopen)"

  # =========================================================================
  # Table 3 — Calculations
  # =========================================================================
  - section: calculations
    instances:
      - name: quote_standard_no_floor_correct_result
        claim_type: Correct Result
        grounds: [calculations.quote_pricing, entities.Quote.fields.quote_total_cents]
        distinguishing_aspect: "PREMIUM/OGEE/40sqft/25lf/2 sinks yields subtotal 340000 and quote_total 340000 (above MIN_JOB floor)."
        test_recipe:
          setup: ["PREMIUM project."]
          setup_api_calls:
            - call: "POST /projects"
              payload: { customer_name: "Io", address: "9 I St", material_grade: "PREMIUM" }
              as: SalesRep
              captures: { p_id: $.data.id, p_v0: $.data.version }
          trigger:
            - call: "POST /projects/${p_id}/quotes"
              payload: { expected_project_version: "${p_v0}", est_sqft: 40, material_grade: "PREMIUM", edge_profile: "OGEE", edge_linear_ft: 25, sink_count: 2, faucet_count: 0, cooktop_count: 0 }
              as: SalesRep
              captures: { q_id: $.data.id }
          assert:
            - "Quote.${q_id}.subtotal_cents == 340000"
            - "Quote.${q_id}.quote_total_cents == 340000"

      - name: final_invoice_recomputed_with_applied_change_order
        claim_type: Reconciliation
        grounds: [calculations.final_invoice, entities.ChangeOrder.fields.delta_cents, entities.Project.fields.final_invoice_cents]
        distinguishing_aspect: "Approving a non-reopening change order delta 50000 adds a taxed line round_half_up(50000*1.0875)=54375, moving final_invoice 369751 -> 424126."
        test_recipe:
          setup: ["PREMIUM project, quote, approved template (final_invoice 369751, two SINK cutouts), a DRAFT change order delta 50000 reopens_template=false."]
          setup_api_calls:
            - call: "POST /projects"
              payload: { customer_name: "Jo", address: "10 J St", material_grade: "PREMIUM" }
              as: SalesRep
              captures: { p_id: $.data.id, p_v0: $.data.version }
            - call: "POST /projects/${p_id}/quotes"
              payload: { expected_project_version: "${p_v0}", est_sqft: 40, material_grade: "PREMIUM", edge_profile: "OGEE", edge_linear_ft: 25, sink_count: 2, faucet_count: 0, cooktop_count: 0 }
              as: SalesRep
            - call: "POST /projects/${p_id}/templates"
              payload: { measured_sqft: 40, edge_profile: "OGEE", edge_linear_ft: 25 }
              as: Fabricator
              captures: { t_id: $.data.id }
            - call: "POST /templates/${t_id}/cutouts"
              payload: { cutout_type: "SINK" }
              as: Fabricator
            - call: "POST /templates/${t_id}/cutouts"
              payload: { cutout_type: "SINK" }
              as: Fabricator
            - call: "POST /templates/${t_id}/approve"
              payload: {}
              as: Fabricator
            - call: "GET /projects/${p_id}"
              payload: {}
              as: SalesRep
              captures: { p_vc: $.data.version }
            - call: "POST /projects/${p_id}/change-orders"
              payload: { expected_project_version: "${p_vc}", description: "extra faucet", delta_cents: 50000, reopens_template: false }
              as: SalesRep
              captures: { co_id: $.data.id }
          trigger:
            - call: "POST /change-orders/${co_id}/approve"
              payload: {}
              as: ShopManager
          assert:
            - "ChangeOrder.${co_id}.status == APPLIED"
            - "Project.${p_id}.final_invoice_cents == 424126"
            - "Template.${t_id}.status == APPROVED (reopens_template=false leaves it approved)"

      - name: change_order_reopens_template_default_true
        claim_type: Defaults
        grounds: [entities.ChangeOrder.fields.reopens_template]
        distinguishing_aspect: "Creating a change order without reopens_template applies the default true."
        test_recipe:
          setup: ["PREMIUM project with an ACTIVE quote."]
          setup_api_calls:
            - call: "POST /projects"
              payload: { customer_name: "Ka", address: "11 K St", material_grade: "PREMIUM" }
              as: SalesRep
              captures: { p_id: $.data.id, p_v0: $.data.version }
            - call: "POST /projects/${p_id}/quotes"
              payload: { expected_project_version: "${p_v0}", est_sqft: 40, material_grade: "PREMIUM", edge_profile: "OGEE", edge_linear_ft: 25, sink_count: 2, faucet_count: 0, cooktop_count: 0 }
              as: SalesRep
            - call: "GET /projects/${p_id}"
              payload: {}
              as: SalesRep
              captures: { p_vc: $.data.version }
          trigger:
            - call: "POST /projects/${p_id}/change-orders"
              payload: { expected_project_version: "${p_vc}", description: "tbd", delta_cents: 1000 }
              as: SalesRep
              captures: { co_id: $.data.id, ro: $.data.reopens_template }
          assert:
            - "ChangeOrder.${co_id}.reopens_template == true"

  # =========================================================================
  # Table 4 — Validations
  # =========================================================================
  - section: validations
    instances:
      - name: deposit_below_50pct_returns_deposit_too_low
        claim_type: Violation -> Error
        grounds:
          - "validations[priority=17]"
          - "errors[ERR_DEPOSIT_TOO_LOW]"
        distinguishing_aspect: "A DEPOSIT of 169999 (< 170000 = 50% of quoted 340000) returns ERR_DEPOSIT_TOO_LOW; the >= boundary complement of the §1.8 accept-at-170000 test."
        test_recipe:
          setup: ["PREMIUM project with ACTIVE quote quote_total 340000; no payments."]
          setup_api_calls:
            - call: "POST /projects"
              payload: { customer_name: "Lo", address: "12 L St", material_grade: "PREMIUM" }
              as: SalesRep
              captures: { p_id: $.data.id, p_v0: $.data.version }
            - call: "POST /projects/${p_id}/quotes"
              payload: { expected_project_version: "${p_v0}", est_sqft: 40, material_grade: "PREMIUM", edge_profile: "OGEE", edge_linear_ft: 25, sink_count: 2, faucet_count: 0, cooktop_count: 0 }
              as: SalesRep
          trigger:
            - call: "POST /projects/${p_id}/payments"
              payload: { amount_cents: 169999, kind: "DEPOSIT" }
              as: SalesRep
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_DEPOSIT_TOO_LOW"

      - name: balance_overpayment_returns_overpayment
        claim_type: Aggregate validation
        grounds:
          - "validations[priority=18]"
          - "errors[ERR_OVERPAYMENT]"
        distinguishing_aspect: "A BALANCE payment 340001 exceeding the basis (quoted 340000, no invoice) returns ERR_OVERPAYMENT."
        test_recipe:
          setup: ["PREMIUM project with ACTIVE quote 340000; no template so basis=quoted."]
          setup_api_calls:
            - call: "POST /projects"
              payload: { customer_name: "Mi", address: "13 M St", material_grade: "PREMIUM" }
              as: SalesRep
              captures: { p_id: $.data.id, p_v0: $.data.version }
            - call: "POST /projects/${p_id}/quotes"
              payload: { expected_project_version: "${p_v0}", est_sqft: 40, material_grade: "PREMIUM", edge_profile: "OGEE", edge_linear_ft: 25, sink_count: 2, faucet_count: 0, cooktop_count: 0 }
              as: SalesRep
          trigger:
            - call: "POST /projects/${p_id}/payments"
              payload: { amount_cents: 340001, kind: "BALANCE" }
              as: SalesRep
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_OVERPAYMENT"

      - name: payment_without_quote_returns_quote_required
        claim_type: Violation -> Error
        grounds:
          - "validations[priority=15]"
