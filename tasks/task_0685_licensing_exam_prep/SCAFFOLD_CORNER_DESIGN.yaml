              as: ContentAdmin
            - call: "POST /subscription-plans"
              payload: { tier: "BASIC", total_price_cents: 30000, down_payment_pct: 0.00, financing_months: 1, included_mock_credits: 3, pass_guarantee: false, guarantee_refund_pct: 0.0, includes_ce: false }
              as: ContentAdmin
              captures: { plan_id: "$.data.id" }
