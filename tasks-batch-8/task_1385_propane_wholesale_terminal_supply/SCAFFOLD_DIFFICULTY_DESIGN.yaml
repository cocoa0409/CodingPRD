  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: schedule_unschedule_conserves_truck_minutes_and_reserved
        grounds: [state_machines.DeliveryOrder.ALLOCATED_to_SCHEDULED, state_machines.DeliveryOrder.SCHEDULED_to_ALLOCATED, calculations.trip_hours_estimate]
        distinguishing_aspect: |
          Conserved quantity = truck weekly_committed_minutes (and terminal reserved_gal):
          scheduling adds est_trip_minutes (330) and the compensating unschedule subtracts
          exactly the same amount, while the order's reserved gallons never leave the pool.
        test_recipe:
          setup:
            - "Base fixture; truck U-01; FIXED contract; one 9000-gal order ALLOCATED (reserved 9000); clock pinned to Monday 2026-08-03 so the Aug-3 load window is in the current ISO week"
          setup_api_calls:
