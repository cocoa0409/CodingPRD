# =============================================================================
# Precinct Boundary & Redistricting Management — Seed Tables (Expert)
# =============================================================================

scenario: |
  861. Precinct Boundary & Redistricting Management: census-block & population
  balance, district plan & deviation, community-of-interest & VRA compliance
  check, precinct split & polling assignment, plan versioning & scenario
  compare, public-comment & hearing, adoption & GIS export,
  incumbent/geography report

domain_name: precinct-redistricting
api_prefix: ""   # multi-root (flat/graph) topology: jurisdictions, plans, precincts, polling-places, venues, hearings, etc. are all top-level collections

complexity_profile:
  primary_archetype: quota_allocation          # finite population pool partitioned across districts under deviation caps
  secondary_archetype: workflow_orchestration  # plan lifecycle: draft -> review -> comment -> hearing -> adopt -> export
  complexity_layers:
    - dual_variant_calculation      # population deviation (range vs max-abs); precinct voters (provisional vs certified)
    - cascading_side_effects        # adopt -> supersede siblings -> dismiss comments/cancel hearings; split -> reassign blocks -> recompute voters
    - optimistic_concurrency        # block-assignment supersede (Plan.version); polling-assignment supersede (Precinct.version)
    - derived_field_reconciliation  # district assigned_population / plan deviation metrics reconciled from block assignments

  entity_topology: graph            # many-to-many BlockAssignment (Block<->District via Plan); self-referential Plan and Precinct
  state_machine_shape: cyclic       # Plan revision loop HEARING_SCHEDULED -> UNDER_REVIEW; plus Precinct branching fork
  relationship_patterns:
    - many_to_many                  # census blocks <-> districts through BlockAssignment
    - self_referential              # Plan.parent_plan_id (scenario fork); Precinct.parent_precinct_id (split lineage)
    - cross_aggregate               # District/Plan compliance depends on CensusBlock demographics; Hearing occupies PollingPlace as venue
  role_model: segregation_of_duties # four-eyes: the plan's creator (X-User-ID) may not adopt it
  consistency_model: immediate

# =============================================================================
# Table 1.0: Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1.1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Jurisdiction
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Jurisdiction name (e.g. 'Maple County')" }
      - { name: state_code, type: string, source: input, description: "Two-letter USPS state code" }
      - { name: target_district_count, type: integer, source: input, description: "Number of districts the plan must produce", constraints: ">= 1" }
      - { name: required_majority_minority_districts, type: integer, source: input, default: 0, description: "VRA floor: minimum count of majority-minority districts a compliant plan must contain", constraints: ">= 0" }
      - { name: total_population, type: integer, source: computed, default: 0, description: "= sum of population over all CensusBlocks whose jurisdiction_id == this id" }
      - { name: voting_age_population_total, type: integer, source: computed, default: 0, description: "= sum of voting_age_population over all CensusBlocks in this jurisdiction" }
      - { name: ideal_district_population, type: number, source: computed, default: 0, description: "= total_population / target_district_count (exact quotient, 4 dp) — the equal-population target each district is measured against" }

  - name: CensusBlock
    parent: Jurisdiction
    common_fields: true
    fields:
      - { name: jurisdiction_id, type: string, source: system, description: "FK -> Jurisdiction.id; the jurisdiction this block belongs to" }
      - { name: geoid, type: string, source: input, description: "Census GEOID; unique within a jurisdiction (business key)" }
      - { name: population, type: integer, source: input, description: "Total resident population of the block", constraints: ">= 0" }
      - { name: voting_age_population, type: integer, source: input, description: "Voting-age population (VAP) of the block", constraints: ">= 0, <= population" }
      - { name: minority_vap, type: integer, source: input, description: "Any-part minority voting-age population of the block (for VRA)", constraints: ">= 0, <= voting_age_population" }
      - { name: registered_voters, type: integer, source: input, description: "Actual registered voters on file for the block (certified count)", constraints: ">= 0" }
      - { name: precinct_id, type: string, source: system, required: false, description: "FK -> Precinct.id; the ACTIVE precinct currently containing this block (null until assigned; reassigned on split/merge)" }

  - name: RedistrictingPlan
    parent: Jurisdiction
    common_fields: true
    fields:
      - { name: jurisdiction_id, type: string, source: system, description: "FK -> Jurisdiction.id; jurisdiction being redistricted" }
      - { name: name, type: string, source: input, description: "Plan / scenario label (e.g. 'Scenario B — COI-respecting')" }
      - { name: parent_plan_id, type: string, source: input, required: false, description: "FK -> RedistrictingPlan.id; source plan this scenario was forked from (null for a fresh plan). On create with a parent, districts and ACTIVE block assignments are deep-copied from the parent." }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of the Cartographer who created the plan; used for four-eyes segregation-of-duties at adoption" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT | UNDER_REVIEW | COMMENT_OPEN | HEARING_SCHEDULED | ADOPTED | REJECTED | SUPERSEDED" }
      - { name: max_abs_deviation_pct, type: number, source: computed, default: 0, description: "Max-absolute-deviation standard: max over districts of abs(deviation_pct), each district's deviation_pct rounded to 2 dp first (see plan_deviation_metrics)" }
      - { name: overall_deviation_range_pct, type: number, source: computed, default: 0, description: "Overall-range standard: (max district deviation_pct) - (min district deviation_pct), each rounded to 2 dp first" }
      - { name: majority_minority_district_count, type: integer, source: computed, default: 0, description: "Count of this plan's districts with is_majority_minority == true" }
      - { name: is_compliant, type: boolean, source: computed, default: false, description: "Compliance gate: within deviation AND VRA floor met AND all districts contiguous (see plan_compliance_gate)" }
      - { name: comment_opened_at, type: datetime, source: system, required: false, description: "Logical-clock instant the public-comment period was opened (null until open-comment)" }
      - { name: adopted_at, type: datetime, source: system, required: false, description: "Logical-clock instant the plan was adopted (null unless ADOPTED)" }

  - name: District
    parent: RedistrictingPlan
    common_fields: true
    fields:
      - { name: plan_id, type: string, source: system, description: "FK -> RedistrictingPlan.id; the plan this district belongs to" }
      - { name: district_number, type: integer, source: input, description: "District ordinal; unique within a plan", constraints: ">= 1" }
      - { name: name, type: string, source: input, required: false, description: "Optional district label" }
      - { name: is_contiguous, type: boolean, source: input, default: true, description: "Cartographer-asserted geometric contiguity flag for this district's blocks" }
      - { name: incumbent_name, type: string, source: input, required: false, description: "Sitting incumbent assigned to this district (geography report), null if open seat" }
      - { name: incumbent_home_geoid, type: string, source: input, required: false, description: "GEOID of the CensusBlock containing the incumbent's residence (business key, not an id FK)" }
      - { name: target_population, type: number, source: computed, default: 0, description: "= parent jurisdiction.ideal_district_population at time of read" }
      - { name: assigned_population, type: integer, source: computed, default: 0, description: "= sum of CensusBlock.population over ACTIVE BlockAssignments to this district" }
      - { name: deviation, type: integer, source: computed, default: 0, description: "= assigned_population - target_population (rounded to nearest integer)" }
      - { name: deviation_pct, type: number, source: computed, default: 0, description: "= (assigned_population - target_population) / target_population * 100, round_half_up to 2 dp; 0 when target_population == 0" }
      - { name: minority_vap_pct, type: number, source: computed, default: 0, description: "= sum(minority_vap)/sum(voting_age_population) * 100 over ACTIVE assignments, round_half_up 2 dp; 0 when VAP sum == 0" }
      - { name: is_majority_minority, type: boolean, source: computed, default: false, description: "= minority_vap_pct > 50.0 (STRICT greater-than; exactly 50.00 is NOT majority-minority)" }
      - { name: incumbent_retained, type: boolean, source: computed, default: false, description: "= true iff the CensusBlock whose geoid == incumbent_home_geoid has an ACTIVE BlockAssignment to this district; false when incumbent_home_geoid is null" }

  - name: BlockAssignment
    parent: RedistrictingPlan
    common_fields: true
    fields:
      - { name: plan_id, type: string, source: system, description: "FK -> RedistrictingPlan.id; plan the assignment lives in" }
      - { name: district_id, type: string, source: input, description: "FK -> District.id; district the block is assigned to" }
      - { name: census_block_id, type: string, source: input, description: "FK -> CensusBlock.id; block being assigned" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | SUPERSEDED | REMOVED" }

  - name: Precinct
    parent: Jurisdiction
    common_fields: true
    fields:
      - { name: jurisdiction_id, type: string, source: system, description: "FK -> Jurisdiction.id; jurisdiction the precinct is in" }
      - { name: name, type: string, source: input, description: "Precinct name/number" }
      - { name: parent_precinct_id, type: string, source: system, required: false, description: "FK -> Precinct.id; the precinct this one was split from (null for an original precinct)" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | SPLIT | MERGED | RETIRED" }
      - { name: voter_count_basis, type: enum, source: system, default: "PROVISIONAL", description: "PROVISIONAL | CERTIFIED — which variant registered_voters currently reflects" }
      - { name: registered_voters, type: integer, source: computed, default: 0, description: "Estimated/certified voters in this precinct (see precinct_registered_voters); 0 once SPLIT or MERGED" }

  - name: PollingPlace
    parent: Jurisdiction
    common_fields: true
    fields:
      - { name: jurisdiction_id, type: string, source: system, description: "FK -> Jurisdiction.id; jurisdiction the polling place serves" }
      - { name: name, type: string, source: input, description: "Polling place / civic building name (also usable as a hearing venue)" }
      - { name: address, type: string, source: input, description: "Street address" }
      - { name: capacity, type: integer, source: input, description: "Max registered voters this place can serve on election day", constraints: ">= 1" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | CLOSED" }
      - { name: assigned_registered_voters, type: integer, source: computed, default: 0, description: "= sum of Precinct.registered_voters over precincts with an ACTIVE PollingAssignment to this place" }
      - { name: utilization_pct, type: number, source: computed, default: 0, description: "= assigned_registered_voters / capacity * 100, round_half_up 2 dp" }
      - { name: is_over_capacity, type: boolean, source: computed, default: false, description: "= assigned_registered_voters > capacity (STRICT); exactly at capacity is NOT over" }

  - name: PollingAssignment
    parent: Precinct
    common_fields: true
    fields:
      - { name: precinct_id, type: string, source: system, description: "FK -> Precinct.id; precinct being assigned a polling place" }
      - { name: polling_place_id, type: string, source: input, description: "FK -> PollingPlace.id; polling place / early-voting site" }
      - { name: ev_start_date, type: string, source: input, description: "Early-voting window start date (YYYY-MM-DD), inclusive" }
      - { name: ev_end_date, type: string, source: input, description: "Early-voting window end date (YYYY-MM-DD), inclusive; must be >= ev_start_date" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | SUPERSEDED" }

  - name: Venue
    parent: Jurisdiction
    common_fields: true
    fields:
      - { name: jurisdiction_id, type: string, source: system, description: "FK -> Jurisdiction.id; jurisdiction the venue serves" }
      - { name: name, type: string, source: input, description: "Civic building / venue name used to host public hearings" }
      - { name: capacity, type: integer, source: input, description: "Seated capacity of the venue", constraints: ">= 1" }

  - name: Hearing
    parent: RedistrictingPlan
    common_fields: true
    fields:
      - { name: plan_id, type: string, source: system, description: "FK -> RedistrictingPlan.id; plan the hearing concerns" }
      - { name: venue_id, type: string, source: input, description: "FK -> Venue.id; civic building hosting the hearing" }
      - { name: scheduled_start, type: datetime, source: input, description: "Hearing start (ISO 8601 UTC)" }
      - { name: scheduled_end, type: datetime, source: input, description: "Hearing end (ISO 8601 UTC); must be strictly after scheduled_start" }
      - { name: status, type: enum, source: system, default: "SCHEDULED", description: "SCHEDULED | HELD | CANCELLED" }

  - name: PublicComment
    parent: RedistrictingPlan
    common_fields: true
    fields:
      - { name: plan_id, type: string, source: system, description: "FK -> RedistrictingPlan.id; plan being commented on" }
      - { name: commenter_name, type: string, source: input, description: "Name of the member of the public submitting the comment" }
      - { name: comment_text, type: string, source: input, description: "Body of the public comment" }
      - { name: disposition, type: enum, source: system, default: "PENDING", description: "PENDING | ACKNOWLEDGED | INCORPORATED | DISMISSED" }

  - name: ComplianceCheck
    parent: RedistrictingPlan
    common_fields: false
    fields:
      - { name: plan_id, type: string, source: system, description: "FK -> RedistrictingPlan.id; plan the check snapshots" }
      - { name: check_type, type: enum, source: input, description: "POPULATION_DEVIATION | VRA_MINORITY | CONTIGUITY" }
      - { name: result_status, type: enum, source: computed, description: "PASS | WARN | FAIL — computed at creation from the plan's live metrics for check_type" }
      - { name: max_abs_deviation_pct, type: number, source: computed, description: "Snapshot of plan.max_abs_deviation_pct at check time" }
      - { name: overall_deviation_range_pct, type: number, source: computed, description: "Snapshot of plan.overall_deviation_range_pct at check time" }
      - { name: majority_minority_district_count, type: integer, source: computed, description: "Snapshot of plan.majority_minority_district_count at check time" }
      - { name: detail, type: string, source: computed, description: "Human-readable summary of the finding" }

  - name: GISExport
    parent: RedistrictingPlan
    common_fields: true
    fields:
      - { name: plan_id, type: string, source: system, description: "FK -> RedistrictingPlan.id; plan being exported" }
      - { name: export_format, type: enum, source: input, description: "GEOJSON | SHAPEFILE" }
      - { name: status, type: enum, source: system, default: "COMPLETE", description: "COMPLETE | FAILED — set at creation; FAILED if plan is not ADOPTED" }
      - { name: block_count, type: integer, source: computed, default: 0, description: "= count of ACTIVE BlockAssignments in the plan at export time" }
      - { name: district_count, type: integer, source: computed, default: 0, description: "= count of districts in the plan" }
      - { name: checksum, type: string, source: computed, description: "Deterministic hex digest over (district_number, geoid) pairs sorted by district_number ASC then geoid ASC (never by id)" }

# =============================================================================
# Table 1.2: State Machine Table
# =============================================================================
state_machines:
  - entity: RedistrictingPlan
    initial_state: DRAFT
    terminal_states: [ADOPTED, REJECTED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: UNDER_REVIEW
        trigger: "POST /plans/{id}/submit-review"
        actor: Cartographer
        preconditions:
          - "plan has >= 1 District"
          - "every CensusBlock in the jurisdiction has exactly one ACTIVE BlockAssignment in this plan (complete partition)"
        side_effects: ["recompute plan deviation + VRA metrics"]

      - from: UNDER_REVIEW
        to: COMMENT_OPEN
        trigger: "POST /plans/{id}/open-comment"
        actor: CommissionChair
        preconditions:
          - "the latest ComplianceCheck of check_type=POPULATION_DEVIATION for this plan has result_status != FAIL"
        side_effects: ["set comment_opened_at = current logical-clock time"]

      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /plans/{id}/reject"
        actor: CommissionChair
        preconditions: []
        side_effects:
          - "all PENDING PublicComments on this plan -> DISMISSED"
          - "all SCHEDULED Hearings on this plan -> CANCELLED"

      - from: COMMENT_OPEN
        to: HEARING_SCHEDULED
        trigger: "POST /plans/{id}/hearings (schedule a hearing)"
        actor: CommissionChair
        preconditions:
          - "the created Hearing's venue and time pass resource_temporal_overlap (venue hearing overlap)"
        side_effects: ["create Hearing in SCHEDULED"]
        note: "Plan advances to HEARING_SCHEDULED the first time a hearing is scheduled while COMMENT_OPEN."

      - from: HEARING_SCHEDULED
        to: HEARING_SCHEDULED
        trigger: "POST /plans/{id}/hearings (schedule an additional hearing)"
        actor: CommissionChair
        preconditions:
          - "the created Hearing's venue and time pass resource_temporal_overlap (venue hearing overlap)"
        side_effects: ["create Hearing in SCHEDULED"]
        note: "Self-loop: additional hearings may be scheduled while already HEARING_SCHEDULED; status is unchanged."

      - from: HEARING_SCHEDULED
        to: UNDER_REVIEW
        trigger: "POST /plans/{id}/request-revision"
        actor: Demographer
        preconditions: []
        side_effects:
          - "all SCHEDULED Hearings on this plan -> CANCELLED"
        note: "Revision loop (cyclic): sends the plan back to be re-edited and re-reviewed."

      - from: HEARING_SCHEDULED
        to: ADOPTED
        trigger: "POST /plans/{id}/adopt"
        actor: CommissionChair
        preconditions:
          - "at least one Hearing on this plan is in status HELD"
          - "plan.is_compliant == true"
          - "acting X-User-ID != plan.created_by_user_id (four-eyes segregation of duties)"
        side_effects:
          - "set adopted_at = current logical-clock time"
          - "every other non-terminal RedistrictingPlan in the same jurisdiction -> SUPERSEDED (cascade)"
          - "create a GISExport (status COMPLETE) for this plan"

      - from: DRAFT
        to: SUPERSEDED
        trigger: "system (a sibling plan in the jurisdiction was adopted)"
        actor: system
        preconditions: []
        side_effects:
          - "all PENDING PublicComments on this plan -> DISMISSED"
          - "all SCHEDULED Hearings on this plan -> CANCELLED"

      - from: UNDER_REVIEW
        to: SUPERSEDED
        trigger: "system (a sibling plan in the jurisdiction was adopted)"
        actor: system
        preconditions: []
        side_effects:
          - "all PENDING PublicComments on this plan -> DISMISSED"
          - "all SCHEDULED Hearings on this plan -> CANCELLED"

      - from: COMMENT_OPEN
        to: SUPERSEDED
        trigger: "system (a sibling plan in the jurisdiction was adopted)"
        actor: system
        preconditions: []
        side_effects:
          - "all PENDING PublicComments on this plan -> DISMISSED"
          - "all SCHEDULED Hearings on this plan -> CANCELLED"

      - from: HEARING_SCHEDULED
        to: SUPERSEDED
        trigger: "system (a sibling plan in the jurisdiction was adopted)"
        actor: system
        preconditions: []
        side_effects:
          - "all PENDING PublicComments on this plan -> DISMISSED"
          - "all SCHEDULED Hearings on this plan -> CANCELLED"

  - entity: Precinct
    initial_state: ACTIVE
    terminal_states: [SPLIT, MERGED, RETIRED]
    transitions:
      - from: ACTIVE
        to: SPLIT
        trigger: "POST /precincts/{precinctId}/split"
        actor: ElectionClerk
        preconditions:
          - "precinct has >= 2 ACTIVE CensusBlocks (cannot split fewer than 2)"
          - "the split payload's two block-geoid groups partition exactly the precinct's current ACTIVE blocks (every block appears in exactly one group; no foreign blocks)"
        side_effects:
          - "create child precinct A and child precinct B, each parent_precinct_id = this precinct"
          - "reassign each CensusBlock.precinct_id to its child precinct (mutation on CensusBlock)"
          - "recompute registered_voters on both child precincts (mutation caused by the block reassignment)"
          - "this precinct.registered_voters -> 0"
        note: "Branching fork: divergent side effects vs MERGED/RETIRED."

      - from: ACTIVE
        to: MERGED
        trigger: "POST /precincts/{precinctId}/merge (merge into target_precinct_id)"
        actor: ElectionClerk
        preconditions:
          - "target precinct exists, is ACTIVE, and is in the same jurisdiction"
          - "target precinct != this precinct"
        side_effects:
          - "reassign every CensusBlock.precinct_id from this precinct to the target precinct"
          - "recompute target precinct.registered_voters"
          - "this precinct.registered_voters -> 0"

      - from: ACTIVE
        to: RETIRED
        trigger: "POST /precincts/{precinctId}/retire"
        actor: ElectionClerk
        preconditions:
          - "precinct has 0 ACTIVE CensusBlocks"
          - "precinct has no ACTIVE PollingAssignment"
        side_effects: []

  - entity: Hearing
    initial_state: SCHEDULED
    terminal_states: [HELD, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: HELD
        trigger: "POST /hearings/{hearingId}/hold"
        actor: CommissionChair
        preconditions:
          - "current logical-clock time >= scheduled_start"
        side_effects: []
        note: "A HELD hearing unlocks the plan's adopt precondition."

      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /hearings/{hearingId}/cancel"
        actor: CommissionChair
        preconditions: []
        side_effects:
          - "if the parent plan is HEARING_SCHEDULED and has no other SCHEDULED hearing, plan -> COMMENT_OPEN (cross-entity revert)"

  - entity: PublicComment
    initial_state: PENDING
    terminal_states: [ACKNOWLEDGED, INCORPORATED, DISMISSED]
    transitions:
      - from: PENDING
        to: ACKNOWLEDGED
        trigger: "POST /comments/{commentId}/disposition (disposition=ACKNOWLEDGED)"
        actor: CommissionChair
        preconditions: []
        side_effects: []
      - from: PENDING
        to: INCORPORATED
        trigger: "POST /comments/{commentId}/disposition (disposition=INCORPORATED)"
        actor: CommissionChair
        preconditions: []
        side_effects: []
      - from: PENDING
        to: DISMISSED
        trigger: "POST /comments/{commentId}/disposition (disposition=DISMISSED)"
        actor: CommissionChair
        preconditions: []
        side_effects: []
      - from: PENDING
        to: DISMISSED
        trigger: "system (parent plan rejected or superseded)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: BlockAssignment
    initial_state: ACTIVE
    terminal_states: [SUPERSEDED, REMOVED]
    transitions:
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system (a new ACTIVE BlockAssignment is created for the same (plan, census_block))"
        actor: system
        preconditions: []
        side_effects:
          - "recompute prior district.assigned_population and demographics"
      - from: ACTIVE
        to: REMOVED
        trigger: "POST /block-assignments/{blockAssignmentId}/remove"
        actor: Cartographer
        preconditions:
          - "parent plan.status IN {DRAFT, UNDER_REVIEW}"
        side_effects:
          - "recompute district.assigned_population, deviation, minority metrics (compensating)"
          - "recompute plan deviation + VRA metrics"

  - entity: PollingAssignment
    initial_state: ACTIVE
    terminal_states: [SUPERSEDED]
    transitions:
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system (a new ACTIVE PollingAssignment is created for the same precinct)"
        actor: system
        preconditions: []
        side_effects:
          - "recompute the old and new PollingPlace.assigned_registered_voters"

  - entity: PollingPlace
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /polling-places/{pollingPlaceId}/close"
        actor: ElectionClerk
        preconditions:
          - "polling place has no ACTIVE PollingAssignment"
        side_effects: []

# =============================================================================
# Table 1.2.1: Concurrency Rules (OCC on parent version)
# =============================================================================
concurrency_rules:
  - rule_id: block-assign-supersede-stale-plan
    parent_entity: RedistrictingPlan
    write_endpoint: "POST /plans/{id}/block-assignments"
    occ_field: "expected_plan_version"
    description: |
      Creating a BlockAssignment for a (plan, census_block) whose plan.version
      has advanced since the client last read it is rejected. A new assignment
      legitimately supersedes the prior ACTIVE assignment for that block, so a
      writer holding a stale plan view would silently overwrite an assignment
      change it never saw; the stale-version check rejects it.
    error_id: ERR_STALE_PLAN_VERSION
    http_status: 412

  - rule_id: polling-assign-supersede-stale-precinct
    parent_entity: Precinct
    write_endpoint: "POST /precincts/{precinctId}/polling-assignments"
    occ_field: "expected_precinct_version"
    description: |
      Creating a PollingAssignment for a precinct whose precinct.version has
      advanced since the client last read it is rejected. A new polling
      assignment supersedes the precinct's prior ACTIVE one, so a stale writer
      would clobber a reassignment it never observed; OCC rejects the stale
      version.
    error_id: ERR_STALE_PRECINCT_VERSION
    http_status: 412

# =============================================================================
# Table 1.3: Calculation Rules Table
# =============================================================================
calculations:
  - name: jurisdiction_ideal_population
    trigger: "any change to the jurisdiction's CensusBlocks (create) or on read of Jurisdiction/District"
    algorithm: aggregation
    formula: |
      total_population            = sum(cb.population for cb in CensusBlocks where cb.jurisdiction_id == J.id)
      voting_age_population_total = sum(cb.voting_age_population for those cb)
      ideal_district_population   = total_population / target_district_count      # exact quotient
      # ideal is rounded to 4 dp for storage/read; deviation math below uses the 4-dp value.
    input_set: "all CensusBlocks whose jurisdiction_id == J.id (no status filter — census blocks have no lifecycle)"
    precision: "ideal_district_population: 4 decimal places, round_half_up"

  - name: district_population_deviation
    trigger: "BlockAssignment create/supersede/remove touching this district; read of District"
    algorithm: aggregation
    formula: |
      assigned_population = sum(cb.population for cb via ACTIVE BlockAssignments to this district)
      target_population   = jurisdiction.ideal_district_population
      deviation           = round_half_up(assigned_population - target_population, 0)   # nearest integer
      if target_population == 0:
        deviation_pct = 0.00
      else:
        deviation_pct = round_half_up((assigned_population - target_population) / target_population * 100, 2)
    input_set: "BlockAssignments with status == ACTIVE for this district only (SUPERSEDED/REMOVED excluded)"
    precision: "deviation_pct: 2 decimal places, round_half_up"

  - name: plan_deviation_metrics
    trigger: "any District deviation change in the plan; read of RedistrictingPlan; ComplianceCheck create"
    algorithm: aggregation
    formula: |
      # ROUNDING ORDER IS PINNED (mode b): round EACH district's deviation_pct to 2 dp FIRST,
      # THEN take max/min/range over those rounded values. Do NOT range raw deviations then round.
      dps = [ d.deviation_pct for d in plan.districts ]          # each already 2-dp rounded per district_population_deviation
      if dps is empty:
        max_abs_deviation_pct        = 0.00
        overall_deviation_range_pct  = 0.00
      else:
        max_abs_deviation_pct       = max(abs(x) for x in dps)                 # MAX-ABSOLUTE standard
        overall_deviation_range_pct = max(dps) - min(dps)                      # OVERALL-RANGE standard
    input_set: "all Districts of the plan (a district with 0 ACTIVE blocks contributes deviation_pct computed against target)"
    precision: "2 decimal places, round_half_up (values already rounded per district)"
    variants:
      - name: max_absolute_deviation
        when: "adoption compliance gate and POPULATION_DEVIATION ComplianceCheck use this by default"
        difference: "max over districts of abs(deviation_pct); a plan with +4.9% and -4.9% districts scores 4.90"
      - name: overall_deviation_range
        when: "reported alongside for the total-deviation legal standard and scenario compare"
        difference: "(max deviation_pct) - (min deviation_pct); the same +4.9%/-4.9% plan scores 9.80 — DIFFERENT number, same inputs"

  - name: district_minority_vap
    trigger: "BlockAssignment create/supersede/remove touching this district; read of District; VRA ComplianceCheck"
    algorithm: aggregation
    formula: |
      sum_min = sum(cb.minority_vap for cb via ACTIVE BlockAssignments to this district)
      sum_vap = sum(cb.voting_age_population for those cb)
      if sum_vap == 0:
        minority_vap_pct = 0.00
      else:
        minority_vap_pct = round_half_up(sum_min / sum_vap * 100, 2)
      is_majority_minority = (minority_vap_pct > 50.0)          # STRICT: exactly 50.00 -> false
    input_set: "ACTIVE BlockAssignments to this district"
    precision: "minority_vap_pct: 2 decimal places, round_half_up"

  - name: plan_compliance_gate
    trigger: "read of RedistrictingPlan.is_compliant; adopt precondition; ComplianceCheck create"
    algorithm: threshold
    formula: |
      # >=3 inputs with conditional/tiered interaction (mode a):
      within_deviation      = (max_abs_deviation_pct <= MAX_ABS_DEVIATION_PCT)     # <= is inclusive at the boundary
      vra_floor_met         = (majority_minority_district_count >= jurisdiction.required_majority_minority_districts)
      all_contiguous        = every district in the plan has is_contiguous == true
      has_full_partition    = every CensusBlock in the jurisdiction has exactly one ACTIVE BlockAssignment in the plan
      is_compliant          = within_deviation AND vra_floor_met AND all_contiguous AND has_full_partition
    input_set: "all Districts of the plan + jurisdiction VRA floor + full-partition check over CensusBlocks"
    constants:
      MAX_ABS_DEVIATION_PCT: 5.0        # a district may deviate at most +/-5.00% from ideal
      MAX_OVERALL_RANGE_PCT: 10.0       # reported total-deviation ceiling (range standard)
    precision: "boolean; comparisons use 2-dp rounded deviation values"

  - name: precinct_registered_voters
    trigger: "Precinct create; split/merge block reassignment; certification"
    algorithm: aggregation
    formula: |
      blocks = CensusBlocks where precinct_id == P.id
      if P.voter_count_basis == PROVISIONAL:
        registered_voters = round_half_up( sum(cb.voting_age_population for cb in blocks) * REGISTRATION_RATE , 0 )
      else:  # CERTIFIED
        registered_voters = sum(cb.registered_voters for cb in blocks)
      if P.status in {SPLIT, MERGED}:
        registered_voters = 0
    input_set: "CensusBlocks currently pointing at this precinct (precinct_id == P.id)"
    constants:
      REGISTRATION_RATE: 0.85           # provisional estimate: share of VAP assumed registered
    precision: "registered_voters: integer, round_half_up"
    variants:
      - name: provisional_estimate
        when: "precinct still PROVISIONAL (freshly created or split child); no certified rolls loaded"
        difference: "= round(sum(VAP) * 0.85); a 1000-VAP precinct estimates 850 voters"
      - name: certified_count
        when: "certified voter rolls in force (voter_count_basis == CERTIFIED)"
        difference: "= sum(cb.registered_voters); the same precinct may certify e.g. 812 — DIFFERENT number, same blocks"

  - name: polling_place_utilization
    trigger: "PollingAssignment create/supersede; Precinct registered_voters change; read of PollingPlace"
    algorithm: threshold
    formula: |
      assigned_registered_voters = sum(P.registered_voters for P via ACTIVE PollingAssignments to this place)
      utilization_pct            = round_half_up(assigned_registered_voters / capacity * 100, 2)
      is_over_capacity           = (assigned_registered_voters > capacity)     # STRICT: exactly at capacity is NOT over
    input_set: "ACTIVE PollingAssignments to this PollingPlace"
    precision: "utilization_pct: 2 decimal places, round_half_up"

  - name: hearing_venue_overlap
    trigger: "POST /plans/{id}/hearings (before creating the Hearing)"
    algorithm: interval_merge
    formula: |
      # BUFFERED HALF-OPEN semantics on the Venue resource.
      # New hearing occupies [scheduled_start, scheduled_end); each SCHEDULED hearing at the
      # same venue reserves [start, end + SETUP_BUFFER_MINUTES) for teardown.
      # Conflict iff  new.start < existing.end + SETUP_BUFFER  AND  existing.start < new.end + SETUP_BUFFER
      # Back-to-back is allowed only when the gap between them is >= SETUP_BUFFER_MINUTES.
      for existing in SCHEDULED hearings where existing.venue_id == new.venue_id:
        if new.scheduled_start < existing.scheduled_end + SETUP_BUFFER
           and existing.scheduled_start < new.scheduled_end + SETUP_BUFFER:
          reject ERR_VENUE_TIME_CONFLICT
    input_set: "SCHEDULED hearings at the same Venue (any plan)"
    constants:
      SETUP_BUFFER_MINUTES: 60
    precision: "minute-resolution UTC datetimes"

  - name: ev_window_overlap
    trigger: "POST /precincts/{precinctId}/polling-assignments (before creating the assignment)"
    algorithm: interval_merge
    formula: |
      # CLOSED DATE-INTERVAL semantics on the PollingPlace resource, across DIFFERENT precincts.
      # Each ACTIVE assignment reserves [ev_start_date, ev_end_date] inclusive on both ends.
      # Conflict iff intervals share ANY date, INCLUDING a single shared endpoint date (touching conflicts).
      # Conflict iff  new.ev_start_date <= existing.ev_end_date  AND  existing.ev_start_date <= new.ev_end_date
      for existing in ACTIVE PollingAssignments where existing.polling_place_id == new.polling_place_id
                                                   and existing.precinct_id != new.precinct_id:
        if new.ev_start_date <= existing.ev_end_date and existing.ev_start_date <= new.ev_end_date:
          reject ERR_EV_WINDOW_CONFLICT
    input_set: "ACTIVE PollingAssignments at the same PollingPlace belonging to other precincts"
    precision: "date resolution (YYYY-MM-DD)"

  - name: compliance_check_result_status
    trigger: "POST /plans/{id}/compliance-checks (evaluated at creation for the given check_type)"
    algorithm: threshold
    formula: |
      if check_type == POPULATION_DEVIATION:
        if   plan.max_abs_deviation_pct <= 5.0:   result_status = PASS
        elif plan.max_abs_deviation_pct <= 10.0:  result_status = WARN
        else:                                     result_status = FAIL
      elif check_type == VRA_MINORITY:
        if plan.majority_minority_district_count < jurisdiction.required_majority_minority_districts:
          result_status = FAIL
        elif any district has 45.0 < minority_vap_pct <= 50.0:   # opportunity-but-not-majority
          result_status = WARN
        else:
          result_status = PASS
      elif check_type == CONTIGUITY:
        result_status = PASS if every district.is_contiguous else FAIL
    input_set: "the plan's live District metrics at check creation"
    constants:
      DEVIATION_PASS_PCT: 5.0
      DEVIATION_WARN_PCT: 10.0
    precision: "enum PASS | WARN | FAIL"

  - name: gis_export_checksum
    trigger: "GISExport create (on adopt or explicit export)"
    algorithm: aggregation
    formula: |
      pairs = [ (district.district_number, cb.geoid)
                for each ACTIVE BlockAssignment ba in plan,
                district = ba.district, cb = ba.census_block ]
      pairs_sorted = sort(pairs) by district_number ASC, then geoid ASC        # deterministic; NEVER by id/random
      block_count    = len(pairs_sorted)
      district_count = count of districts in the plan
      checksum       = sha256( join("|", ["{n}:{g}" for (n,g) in pairs_sorted]) ).hexdigest()
    input_set: "ACTIVE BlockAssignments of the plan at export time"
    precision: "checksum: lowercase hex string"

# =============================================================================
# Table 1.4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "acting role is authorized for the endpoint per the RBAC matrix"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "every resource id in the path exists, validated left-to-right"
    error_id: "ERR_JURISDICTION_NOT_FOUND / ERR_PLAN_NOT_FOUND / ERR_DISTRICT_NOT_FOUND / ERR_PRECINCT_NOT_FOUND / ERR_POLLING_PLACE_NOT_FOUND / ERR_HEARING_NOT_FOUND / ERR_COMMENT_NOT_FOUND / ERR_BLOCK_ASSIGNMENT_NOT_FOUND / ERR_EXPORT_NOT_FOUND / ERR_POLLING_ASSIGNMENT_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path ids"

  - priority: 4
    category: existence
    check: "referenced ids in the request body exist (district_id, census_block_id, polling_place_id, venue_id, parent_plan_id, target_precinct_id)"
    error_id: "ERR_DISTRICT_NOT_FOUND / ERR_CENSUS_BLOCK_NOT_FOUND / ERR_POLLING_PLACE_NOT_FOUND / ERR_PLAN_NOT_FOUND / ERR_PRECINCT_NOT_FOUND"
    http_status: 404
    applies_to: "POST endpoints carrying body FKs"

  - priority: 5
    category: state
    check: |
      target resource is in a state that permits the requested transition, INCLUDING cross-entity
      state gates: (i) block-assignment create AND block-assignment remove require the parent Plan.status
      IN {DRAFT, UNDER_REVIEW}; (ii) polling-assignment create requires the referenced PollingPlace.status
      == ACTIVE; (iii) merge requires the target Precinct.status == ACTIVE; (iv) hold requires the Hearing
      status == SCHEDULED; (v) scheduling a hearing requires the Plan.status IN {COMMENT_OPEN, HEARING_SCHEDULED}.
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints, POST /plans/{id}/block-assignments, POST /precincts/{precinctId}/polling-assignments"

  - priority: 6
    category: business_referential
    check: "cross-aggregate references are consistent: a District named in a block-assignment belongs to the same plan in the path; a CensusBlock belongs to the plan's jurisdiction; a merge target precinct is in the same jurisdiction; a Hearing venue (PollingPlace) is in the plan's jurisdiction"
    error_id: "ERR_DISTRICT_PLAN_MISMATCH / ERR_BLOCK_JURISDICTION_MISMATCH / ERR_PRECINCT_JURISDICTION_MISMATCH / ERR_VENUE_JURISDICTION_MISMATCH"
    http_status: 422
    applies_to: "POST /plans/{id}/block-assignments, POST /precincts/{precinctId}/merge, POST /plans/{id}/hearings"

  - priority: 7
    category: business_constraint
    check: "uniqueness & partition constraints: district_number unique within plan; geoid unique within jurisdiction; at most one ACTIVE BlockAssignment per (plan, census_block) [a second create supersedes, not duplicates]; split groups partition the precinct's blocks exactly"
    error_id: "ERR_DUPLICATE_DISTRICT_NUMBER / ERR_DUPLICATE_GEOID / ERR_INCOMPLETE_PARTITION"
    http_status: 409
    applies_to: "POST districts, POST census-blocks, POST split"

  - priority: 8
    category: business_temporal
    check: |
      temporal-overlap: (a) a Hearing must not overlap another SCHEDULED hearing at the same Venue under
      buffered half-open semantics (SETUP_BUFFER_MINUTES=60) — see hearing_venue_overlap; (b) a
      PollingAssignment's inclusive EV date window must not overlap another ACTIVE assignment at the same
      PollingPlace belonging to a DIFFERENT precinct, closed-interval with touching (shared endpoint date)
      counting as a conflict — see ev_window_overlap.
    error_id: "ERR_VENUE_TIME_CONFLICT / ERR_EV_WINDOW_CONFLICT"
    http_status: 409
    applies_to: "POST /plans/{id}/hearings, POST /precincts/{precinctId}/polling-assignments"

  - priority: 9
    category: business_constraint
    check: "capacity: assigning a precinct's voters to a PollingPlace must not push assigned_registered_voters strictly above capacity"
    error_id: ERR_POLLING_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /precincts/{precinctId}/polling-assignments"

  - priority: 10
    category: business_safety
    check: "four-eyes segregation of duties: the X-User-ID adopting a plan must differ from plan.created_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /plans/{id}/adopt"

  - priority: 11
    category: business_constraint
    check: "compliance gate: a plan may only be adopted when plan.is_compliant == true (deviation within cap, VRA floor met, all districts contiguous, full partition)"
    error_id: ERR_PLAN_NOT_COMPLIANT
    http_status: 422
    applies_to: "POST /plans/{id}/adopt"

  - priority: 12
    category: business_constraint
    check: "field-level validity: enum members valid; ev_end_date >= ev_start_date; scheduled_end strictly after scheduled_start; population/VAP non-negative and VAP <= population and minority_vap <= VAP; required body fields present"
    error_id: "ERR_VALIDATION / ERR_INVALID_DATE_RANGE"
    http_status: 422
    applies_to: all

  - priority: 13
    category: concurrency
    check: "OCC: expected_plan_version / expected_precinct_version must equal the current parent version"
    error_id: "ERR_STALE_PLAN_VERSION / ERR_STALE_PRECINCT_VERSION"
    http_status: 412
    applies_to: "POST /plans/{id}/block-assignments, POST /precincts/{precinctId}/polling-assignments"

# =============================================================================
# Table 1.5: API Endpoint Table
# =============================================================================
endpoints:
  # --- Test-driving clock ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock. Startup default is 2026-05-01T00:00:00Z; before any call the clock reads exactly this default and never falls back to wall-clock time."
    roles: [Cartographer, Demographer, CommissionChair, ElectionClerk]
    code: 200
    input: [to_iso8601]
    output: "null"
    side_effects: ["logical clock now reads to_iso8601 for all subsequent time-dependent rules"]

  # --- Jurisdiction ---
  - method: POST
    path: "/jurisdictions"
    description: "Create a jurisdiction to redistrict"
    roles: [Cartographer]
    code: 201
    input: [name, state_code, target_district_count, "required_majority_minority_districts?"]
    output: Jurisdiction
    side_effects: ["total_population=0, ideal_district_population=0"]

  - method: GET
    path: "/jurisdictions/{jurisdictionId}"
    description: "Read a jurisdiction incl. computed totals and ideal_district_population"
    roles: [Cartographer, Demographer, CommissionChair, ElectionClerk, PublicParticipant]
    code: 200
    input: []
    output: Jurisdiction
    side_effects: []

  # --- CensusBlock ---
  - method: POST
    path: "/jurisdictions/{jurisdictionId}/census-blocks"
    description: "Add a census block (population + demographic reference data)"
    roles: [Cartographer]
    code: 201
    input: [geoid, population, voting_age_population, minority_vap, registered_voters]
    output: CensusBlock
    side_effects: ["recompute jurisdiction total_population, voting_age_population_total, ideal_district_population", "precinct_id=null"]

  - method: GET
    path: "/census-blocks/{censusBlockId}"
    description: "Read a single census block"
    roles: [Cartographer, Demographer, CommissionChair, ElectionClerk, PublicParticipant]
    code: 200
    input: []
    output: CensusBlock
    side_effects: []

  - method: GET
    path: "/census-blocks"
    description: "List census blocks; filter by jurisdiction or current precinct"
    roles: [Cartographer, Demographer, CommissionChair, ElectionClerk, PublicParticipant]
    code: 200
    input: ["jurisdiction_id?", "precinct_id?"]
    output: CensusBlock[]
    side_effects: []

  # --- Precinct ---
  - method: POST
    path: "/jurisdictions/{jurisdictionId}/precincts"
    description: "Create a precinct and place census blocks in it"
    roles: [ElectionClerk]
    code: 201
    input: [name, "census_block_ids?"]
    output: Precinct
    side_effects: ["set CensusBlock.precinct_id = new precinct for each id in census_block_ids", "voter_count_basis=PROVISIONAL", "compute registered_voters (provisional)"]

  - method: GET
    path: "/precincts"
    description: "List precincts; filter by jurisdiction or split-parent"
    roles: [Cartographer, Demographer, CommissionChair, ElectionClerk, PublicParticipant]
    code: 200
    input: ["jurisdiction_id?", "parent_precinct_id?"]
    output: Precinct[]
    side_effects: []

  - method: GET
    path: "/precincts/{precinctId}"
    description: "Read a single precinct (incl. version and computed registered_voters)"
    roles: [Cartographer, Demographer, CommissionChair, ElectionClerk, PublicParticipant]
    code: 200
    input: []
    output: Precinct
    side_effects: []

  - method: POST
    path: "/precincts/{precinctId}/split"
    description: "Split an ACTIVE precinct into two child precincts partitioning its blocks"
    roles: [ElectionClerk]
    code: 201
    input: [child_a_name, child_a_block_geoids, child_b_name, child_b_block_geoids]
    output: Precinct
    side_effects:
      - "create child precinct A and B (parent_precinct_id = this precinct)"
      - "reassign each CensusBlock.precinct_id to its child (mutation on CensusBlock)"
      - "recompute both children's registered_voters (caused by reassignment)"
      - "this precinct.status=SPLIT, registered_voters=0"

  - method: POST
    path: "/precincts/{precinctId}/merge"
    description: "Merge an ACTIVE precinct's blocks into a target ACTIVE precinct"
    roles: [ElectionClerk]
    code: 200
    input: [target_precinct_id]
    output: Precinct
    side_effects:
      - "reassign every CensusBlock.precinct_id from this precinct to target"
      - "recompute target.registered_voters"
      - "this precinct.status=MERGED, registered_voters=0"

  - method: POST
    path: "/precincts/{precinctId}/retire"
    description: "Retire an empty ACTIVE precinct"
    roles: [ElectionClerk]
    code: 200
    input: []
    output: Precinct
    side_effects: ["status=RETIRED"]

  - method: POST
    path: "/precincts/{precinctId}/certify"
    description: "Switch an ACTIVE precinct's voter basis to CERTIFIED and recompute registered_voters from actual rolls"
    roles: [ElectionClerk]
    code: 200
    input: []
    output: Precinct
    side_effects: ["voter_count_basis=CERTIFIED", "recompute registered_voters = sum(cb.registered_voters) (certified variant)"]

  # --- Venue ---
  - method: POST
    path: "/jurisdictions/{jurisdictionId}/venues"
    description: "Create a hearing venue in a jurisdiction"
    roles: [ElectionClerk]
    code: 201
    input: [name, capacity]
    output: Venue
    side_effects: []

  - method: GET
    path: "/venues/{venueId}"
    description: "Read a single venue"
    roles: [Cartographer, Demographer, CommissionChair, ElectionClerk, PublicParticipant]
    code: 200
    input: []
    output: Venue
    side_effects: []

  - method: GET
    path: "/venues"
    description: "List venues; filter by jurisdiction"
    roles: [Cartographer, Demographer, CommissionChair, ElectionClerk, PublicParticipant]
    code: 200
    input: ["jurisdiction_id?"]
    output: Venue[]
    side_effects: []

  # --- PollingPlace ---
  - method: POST
    path: "/jurisdictions/{jurisdictionId}/polling-places"
    description: "Create a polling place / civic building (also usable as hearing venue)"
    roles: [ElectionClerk]
    code: 201
    input: [name, address, capacity]
    output: PollingPlace
    side_effects: ["status=ACTIVE, assigned_registered_voters=0"]

  - method: GET
    path: "/polling-places/{pollingPlaceId}"
    description: "Read a single polling place (incl. computed utilization)"
    roles: [Cartographer, Demographer, CommissionChair, ElectionClerk, PublicParticipant]
    code: 200
    input: []
    output: PollingPlace
    side_effects: []

  - method: GET
    path: "/polling-places"
    description: "List polling places; filter by jurisdiction"
    roles: [Cartographer, Demographer, CommissionChair, ElectionClerk, PublicParticipant]
    code: 200
    input: ["jurisdiction_id?"]
    output: PollingPlace[]
    side_effects: []

  - method: POST
    path: "/polling-places/{pollingPlaceId}/close"
    description: "Close a polling place (no ACTIVE polling assignments allowed)"
    roles: [ElectionClerk]
    code: 200
    input: []
    output: PollingPlace
    side_effects: ["status=CLOSED"]

  # --- PollingAssignment ---
  - method: POST
    path: "/precincts/{precinctId}/polling-assignments"
    description: "Assign a precinct to a polling place for an early-voting window (OCC on precinct)"
    roles: [ElectionClerk]
    code: 201
    input: [polling_place_id, ev_start_date, ev_end_date, expected_precinct_version]
    output: PollingAssignment
    side_effects:
      - "supersede the precinct's prior ACTIVE PollingAssignment (status=SUPERSEDED)"
      - "recompute old and new PollingPlace.assigned_registered_voters, utilization_pct, is_over_capacity"
      - "increments Precinct.version by 1"

  - method: GET
    path: "/polling-assignments/{pollingAssignmentId}"
    description: "Read a single polling assignment"
    roles: [Cartographer, Demographer, CommissionChair, ElectionClerk, PublicParticipant]
    code: 200
    input: []
    output: PollingAssignment
    side_effects: []

  - method: GET
    path: "/polling-assignments"
    description: "List polling assignments; filter by precinct or polling place"
    roles: [Cartographer, Demographer, CommissionChair, ElectionClerk, PublicParticipant]
    code: 200
    input: ["precinct_id?", "polling_place_id?"]
    output: PollingAssignment[]
    side_effects: []

  # --- RedistrictingPlan ---
  - method: POST
    path: "/jurisdictions/{jurisdictionId}/plans"
    description: "Create a plan; with parent_plan_id, fork (deep-copy districts + ACTIVE block assignments) from the parent"
    roles: [Cartographer]
    code: 201
    input: [name, "parent_plan_id?"]
    output: RedistrictingPlan
    side_effects:
      - "created_by_user_id = X-User-ID; status=DRAFT"
      - "if parent_plan_id set: copy each parent District and each ACTIVE parent BlockAssignment into the new plan"

  - method: GET
    path: "/plans"
    description: "List plans; filter by jurisdiction or fork-parent"
    roles: [Cartographer, Demographer, CommissionChair, ElectionClerk, PublicParticipant]
    code: 200
    input: ["jurisdiction_id?", "parent_plan_id?"]
    output: RedistrictingPlan[]
    side_effects: []

  - method: GET
    path: "/plans/{id}"
    description: "Read a plan incl. computed deviation + VRA metrics and is_compliant"
    roles: [Cartographer, Demographer, CommissionChair, ElectionClerk, PublicParticipant]
    code: 200
    input: []
    output: RedistrictingPlan
    side_effects: []

  - method: GET
    path: "/plans/{id}/comparison"
    description: "Scenario compare: computed deviation/VRA deltas between this plan and other_plan_id"
    roles: [Cartographer, Demographer, CommissionChair, ElectionClerk, PublicParticipant]
    code: 200
    input: [other_plan_id]
    output: "{ plan_id, other_plan_id, max_abs_deviation_pct_delta, overall_deviation_range_pct_delta, majority_minority_district_count_delta }"
    side_effects: []

  # --- District ---
  - method: POST
    path: "/plans/{id}/districts"
    description: "Create a district in a DRAFT plan"
    roles: [Cartographer]
    code: 201
    input: [district_number, "name?", "is_contiguous?", "incumbent_name?", "incumbent_home_geoid?"]
    output: District
    side_effects: ["assigned_population=0, deviation computed against ideal"]

  - method: GET
    path: "/plans/{id}/districts"
    description: "List a plan's districts with computed deviation + VRA fields (geography report)"
    roles: [Cartographer, Demographer, CommissionChair, ElectionClerk, PublicParticipant]
    code: 200
    input: []
    output: District[]
    side_effects: []

  # --- BlockAssignment ---
  - method: POST
    path: "/plans/{id}/block-assignments"
    description: "Assign a census block to a district in the plan (supersedes prior; OCC on plan)"
    roles: [Cartographer]
    code: 201
    input: [district_id, census_block_id, expected_plan_version]
    output: BlockAssignment
    side_effects:
      - "supersede any prior ACTIVE BlockAssignment for (plan, census_block) -> SUPERSEDED"
      - "recompute affected districts' assigned_population, deviation, minority metrics"
      - "recompute plan max_abs_deviation_pct, overall_deviation_range_pct, VRA count, is_compliant"
      - "increments RedistrictingPlan.version by 1"

  - method: GET
    path: "/block-assignments/{blockAssignmentId}"
    description: "Read a single block assignment"
    roles: [Cartographer, Demographer, CommissionChair, ElectionClerk, PublicParticipant]
    code: 200
    input: []
    output: BlockAssignment
    side_effects: []

  - method: GET
    path: "/block-assignments"
    description: "List block assignments; filter by plan, district, or census block"
    roles: [Cartographer, Demographer, CommissionChair, ElectionClerk, PublicParticipant]
    code: 200
    input: ["plan_id?", "district_id?", "census_block_id?"]
    output: BlockAssignment[]
    side_effects: []

  - method: POST
    path: "/block-assignments/{blockAssignmentId}/remove"
    description: "Remove (unassign) an ACTIVE block assignment; only in DRAFT/UNDER_REVIEW plans"
    roles: [Cartographer]
    code: 200
    input: []
    output: BlockAssignment
    side_effects:
      - "status=REMOVED"
      - "recompute district + plan metrics (compensating)"

  # --- ComplianceCheck ---
  - method: POST
    path: "/plans/{id}/compliance-checks"
    description: "Run a VRA / deviation / contiguity compliance check; snapshots live metrics"
    roles: [Demographer]
    code: 201
    input: [check_type]
    output: ComplianceCheck
    side_effects: ["compute result_status (PASS/WARN/FAIL) and snapshot metrics"]

  - method: GET
    path: "/plans/{id}/compliance-checks"
    description: "List compliance-check snapshots for a plan"
    roles: [Cartographer, Demographer, CommissionChair, ElectionClerk, PublicParticipant]
    code: 200
    input: []
    output: ComplianceCheck[]
    side_effects: []

  # --- Plan lifecycle ---
  - method: POST
    path: "/plans/{id}/submit-review"
    description: "Submit a DRAFT plan for review (requires complete partition + >=1 district)"
    roles: [Cartographer]
    code: 200
    input: []
    output: RedistrictingPlan
    side_effects: ["status=UNDER_REVIEW"]

  - method: POST
    path: "/plans/{id}/open-comment"
    description: "Open the public-comment period on an UNDER_REVIEW plan"
    roles: [CommissionChair]
    code: 200
    input: []
    output: RedistrictingPlan
    side_effects: ["status=COMMENT_OPEN", "comment_opened_at=current logical time"]

  - method: POST
    path: "/plans/{id}/request-revision"
    description: "Send a HEARING_SCHEDULED plan back for revision (cyclic)"
    roles: [Demographer]
    code: 200
    input: []
    output: RedistrictingPlan
    side_effects: ["status=UNDER_REVIEW", "cancel all SCHEDULED hearings"]

  - method: POST
    path: "/plans/{id}/reject"
    description: "Reject an UNDER_REVIEW plan (terminal)"
    roles: [CommissionChair]
    code: 200
    input: []
    output: RedistrictingPlan
    side_effects: ["status=REJECTED", "dismiss PENDING comments", "cancel SCHEDULED hearings"]

  - method: POST
    path: "/plans/{id}/adopt"
    description: "Adopt a compliant HEARING_SCHEDULED plan with a HELD hearing (four-eyes SoD)"
    roles: [CommissionChair]
    code: 200
    input: []
    output: RedistrictingPlan
    side_effects:
      - "status=ADOPTED, adopted_at=current logical time"
      - "every other non-terminal plan in the jurisdiction -> SUPERSEDED (cascade -> dismiss their comments + cancel their hearings)"
      - "create a GISExport (status=COMPLETE)"

  # --- Hearing ---
  - method: POST
    path: "/plans/{id}/hearings"
    description: "Schedule a public hearing at a venue; advances COMMENT_OPEN plan to HEARING_SCHEDULED"
    roles: [CommissionChair]
    code: 201
    input: [venue_id, scheduled_start, scheduled_end]
    output: Hearing
    side_effects: ["status=SCHEDULED", "if plan COMMENT_OPEN -> HEARING_SCHEDULED"]

  - method: GET
    path: "/hearings/{hearingId}"
    description: "Read a single hearing"
    roles: [Cartographer, Demographer, CommissionChair, ElectionClerk, PublicParticipant]
    code: 200
    input: []
    output: Hearing
    side_effects: []

  - method: GET
    path: "/hearings"
    description: "List hearings; filter by plan or venue"
    roles: [Cartographer, Demographer, CommissionChair, ElectionClerk, PublicParticipant]
    code: 200
    input: ["plan_id?", "venue_id?"]
    output: Hearing[]
    side_effects: []

  - method: POST
    path: "/hearings/{hearingId}/hold"
    description: "Mark a scheduled hearing as HELD (clock must be at/after scheduled_start)"
    roles: [CommissionChair]
    code: 200
    input: []
    output: Hearing
    side_effects: ["status=HELD"]

  - method: POST
    path: "/hearings/{hearingId}/cancel"
    description: "Cancel a scheduled hearing; may revert plan to COMMENT_OPEN"
    roles: [CommissionChair]
    code: 200
    input: []
    output: Hearing
    side_effects: ["status=CANCELLED", "if plan HEARING_SCHEDULED and no other SCHEDULED hearing -> COMMENT_OPEN"]

  # --- PublicComment ---
  - method: POST
    path: "/plans/{id}/comments"
    description: "Submit a public comment on a plan"
    roles: [PublicParticipant]
    code: 201
    input: [commenter_name, comment_text]
    output: PublicComment
    side_effects: ["disposition=PENDING"]

  - method: GET
    path: "/plans/{id}/comments"
    description: "List a plan's public comments"
    roles: [Cartographer, Demographer, CommissionChair, ElectionClerk, PublicParticipant]
    code: 200
    input: []
    output: PublicComment[]
    side_effects: []

  - method: POST
    path: "/comments/{commentId}/disposition"
    description: "Disposition a PENDING comment (acknowledge / incorporate / dismiss)"
    roles: [CommissionChair]
    code: 200
    input: [disposition]
    output: PublicComment
    side_effects: ["disposition set to the provided terminal value"]

  # --- GISExport ---
  - method: POST
    path: "/plans/{id}/exports"
    description: "Create a GIS export of the plan (COMPLETE if ADOPTED, else FAILED)"
    roles: [ElectionClerk]
    code: 201
    input: [export_format]
    output: GISExport
    side_effects: ["compute block_count, district_count, checksum; status COMPLETE if plan ADOPTED else FAILED"]

  - method: GET
    path: "/plans/{id}/exports"
    description: "List a plan's GIS exports"
    roles: [Cartographer, Demographer, CommissionChair, ElectionClerk, PublicParticipant]
    code: 200
    input: []
    output: GISExport[]
    side_effects: []

# =============================================================================
# Table 1.6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role/X-User-ID missing or role not recognized" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "acting role not permitted for this endpoint" }
  - { id: ERR_JURISDICTION_NOT_FOUND, http: 404, condition: "jurisdiction id in path does not exist" }
  - { id: ERR_PLAN_NOT_FOUND, http: 404, condition: "plan id in path/body/query does not exist" }
  - { id: ERR_DISTRICT_NOT_FOUND, http: 404, condition: "district id in path/body does not exist" }
  - { id: ERR_CENSUS_BLOCK_NOT_FOUND, http: 404, condition: "census_block_id in body does not exist" }
  - { id: ERR_PRECINCT_NOT_FOUND, http: 404, condition: "precinct id in path/body does not exist" }
  - { id: ERR_POLLING_PLACE_NOT_FOUND, http: 404, condition: "polling place / venue id does not exist" }
  - { id: ERR_POLLING_ASSIGNMENT_NOT_FOUND, http: 404, condition: "polling assignment id does not exist" }
  - { id: ERR_HEARING_NOT_FOUND, http: 404, condition: "hearing id in path does not exist" }
  - { id: ERR_COMMENT_NOT_FOUND, http: 404, condition: "comment id in path does not exist" }
  - { id: ERR_BLOCK_ASSIGNMENT_NOT_FOUND, http: 404, condition: "block assignment id in path does not exist" }
  - { id: ERR_EXPORT_NOT_FOUND, http: 404, condition: "export id in path does not exist" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "resource not in a state permitting the requested transition (incl. merge target not ACTIVE, hold on non-SCHEDULED)" }
  - { id: ERR_DISTRICT_PLAN_MISMATCH, http: 422, condition: "district_id in a block-assignment belongs to a different plan than the path plan" }
  - { id: ERR_BLOCK_JURISDICTION_MISMATCH, http: 422, condition: "census_block_id belongs to a different jurisdiction than the plan's" }
  - { id: ERR_PRECINCT_JURISDICTION_MISMATCH, http: 422, condition: "merge target precinct is in a different jurisdiction" }
  - { id: ERR_VENUE_JURISDICTION_MISMATCH, http: 422, condition: "hearing Venue is in a different jurisdiction than the plan's" }
  - { id: ERR_DUPLICATE_DISTRICT_NUMBER, http: 409, condition: "district_number already used within the plan" }
  - { id: ERR_DUPLICATE_GEOID, http: 409, condition: "geoid already used within the jurisdiction" }
  - { id: ERR_INCOMPLETE_PARTITION, http: 409, condition: "submit-review with unassigned/multiply-assigned blocks, or split groups that do not exactly partition the precinct's blocks" }
  - { id: ERR_VENUE_TIME_CONFLICT, http: 409, condition: "hearing time overlaps another SCHEDULED hearing at the same venue within SETUP_BUFFER_MINUTES" }
  - { id: ERR_EV_WINDOW_CONFLICT, http: 409, condition: "polling assignment EV date window overlaps the same precinct's other ACTIVE window" }
  - { id: ERR_POLLING_CAPACITY_EXCEEDED, http: 409, condition: "assigning the precinct would push polling place assigned_registered_voters strictly above capacity" }
  - { id: ERR_PRECINCT_NOT_EMPTY, http: 409, condition: "retire attempted on a precinct that still has ACTIVE blocks or an ACTIVE polling assignment" }
  - { id: ERR_POLLING_PLACE_IN_USE, http: 409, condition: "close attempted on a polling place with an ACTIVE polling assignment" }
  - { id: ERR_HEARING_NOT_STARTED, http: 409, condition: "hold attempted before the logical clock reaches scheduled_start" }
  - { id: ERR_DEVIATION_CHECK_FAILED, http: 422, condition: "open-comment when the latest POPULATION_DEVIATION compliance check is missing or FAIL" }
  - { id: ERR_NO_HELD_HEARING, http: 422, condition: "adopt attempted with no HELD hearing on the plan" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "adopting X-User-ID equals plan.created_by_user_id (four-eyes rule)" }
  - { id: ERR_PLAN_NOT_COMPLIANT, http: 422, condition: "adopt attempted while plan.is_compliant == false" }
  - { id: ERR_VALIDATION, http: 422, condition: "malformed body: missing required field, bad enum, negative count, VAP > population, minority_vap > VAP, split with < 2 blocks, merge target == self" }
  - { id: ERR_INVALID_DATE_RANGE, http: 422, condition: "ev_end_date < ev_start_date, or scheduled_end <= scheduled_start" }
  - { id: ERR_STALE_PLAN_VERSION, http: 412, condition: "expected_plan_version != plan.version on block-assignment create" }
  - { id: ERR_STALE_PRECINCT_VERSION, http: 412, condition: "expected_precinct_version != precinct.version on polling-assignment create" }

# =============================================================================
# Table 1.7: RBAC Matrix
# =============================================================================
roles:
  - name: Cartographer
    description: "Draws plans: manages jurisdictions, census-block reference data, plans, districts, and block assignments."
    identity: opaque
    exclusive_operations:
      - "POST /jurisdictions"
      - "POST /jurisdictions/{jurisdictionId}/census-blocks"
      - "POST /jurisdictions/{jurisdictionId}/plans"
      - "POST /plans/{id}/districts"
      - "POST /plans/{id}/block-assignments"
      - "POST /block-assignments/{blockAssignmentId}/remove"
      - "POST /plans/{id}/submit-review"
    shared_operations: ["all GET endpoints", "POST /_clock/set_current_utc"]

  - name: Demographer
    description: "Runs VRA / deviation / contiguity compliance checks and can send a hearing-stage plan back for revision."
    identity: opaque
    exclusive_operations:
      - "POST /plans/{id}/compliance-checks"
      - "POST /plans/{id}/request-revision"
    shared_operations: ["all GET endpoints", "POST /_clock/set_current_utc"]

  - name: CommissionChair
    description: "Chairs the commission: opens comment, schedules/holds/cancels hearings, dispositions comments, rejects and adopts plans. May not adopt a plan they created (four-eyes)."
    identity: opaque
    exclusive_operations:
      - "POST /plans/{id}/open-comment"
      - "POST /plans/{id}/reject"
      - "POST /plans/{id}/adopt"
      - "POST /plans/{id}/hearings"
      - "POST /hearings/{hearingId}/hold"
      - "POST /hearings/{hearingId}/cancel"
      - "POST /comments/{commentId}/disposition"
    shared_operations: ["all GET endpoints", "POST /_clock/set_current_utc"]

  - name: ElectionClerk
    description: "Manages precincts, polling places, polling assignments, and GIS exports."
    identity: opaque
    exclusive_operations:
      - "POST /jurisdictions/{jurisdictionId}/precincts"
      - "POST /precincts/{precinctId}/split"
      - "POST /precincts/{precinctId}/merge"
      - "POST /precincts/{precinctId}/retire"
      - "POST /precincts/{precinctId}/certify"
      - "POST /jurisdictions/{jurisdictionId}/venues"
      - "POST /jurisdictions/{jurisdictionId}/polling-places"
      - "POST /polling-places/{pollingPlaceId}/close"
      - "POST /precincts/{precinctId}/polling-assignments"
      - "POST /plans/{id}/exports"
    shared_operations: ["all GET endpoints", "POST /_clock/set_current_utc"]

  - name: PublicParticipant
    description: "Member of the public who submits comments during the comment period."
    identity: opaque
    exclusive_operations:
      - "POST /plans/{id}/comments"
    shared_operations: ["all GET endpoints"]
