            - { call: "POST /potato-shed/field-lots/${l_id}/assessments", payload: { assessment_date: "2026-08-05", us1_pct: 70.0, us2_pct: 20.0, cull_pct: 10.0, cumulative_shrink_cwt: 20.00, expected_field_lot_version: "${l_v}" }, as: StorageManager }
          trigger:
            - { call: "GET /potato-shed/field-lots/${l_id}", payload: {}, as: StorageManager, captures: { l_v2: "$.data.version" } }
            - { call: "POST /potato-shed/field-lots/${l_id}/assessments", payload: { assessment_date: "2026-08-12", us1_pct: 68.0, us2_pct: 20.0, cull_pct: 12.0, cumulative_shrink_cwt: 30.00, expected_field_lot_version: "${l_v2}" }, as: StorageManager }
            - { call: "GET /potato-shed/field-lots/${l_id}", payload: {}, as: StorageManager, captures: { l_shrink: "$.data.shrink_cwt", l_avail: "$.data.available_cwt" } }
          assert:
            - "l_shrink == 30.00 (re-baselined, not 50.00) and l_avail == 470.00"
            - "latest assessment selected by assessment_date: packable fraction now 0.88 (68+20)"

