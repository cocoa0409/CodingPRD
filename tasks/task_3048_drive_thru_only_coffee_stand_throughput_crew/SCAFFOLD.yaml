    output: Shift
    side_effects: []

  - method: GET
    path: "/shifts/{shiftId}"
    description: "Get a shift (includes deficit scores and version)"
    roles: [PlatformAdmin, RegionalManager, StandOperator, ShiftLead, CrewMember]
    code: 200
    input: []
    output: Shift
    side_effects: []

  - method: GET
    path: "/shifts"
    description: "List shifts, optionally by stand"
    roles: [PlatformAdmin, RegionalManager, StandOperator, ShiftLead, CrewMember]
    code: 200
    input: ["stand_id?", "status?", "limit?", "offset?"]
    output: "Shift[]"
    side_effects: []

  - method: POST
    path: "/shifts/{shiftId}/assignments"
