      - name: de_enrollment_reclaims_only_the_issued_handset
        claim_type: conditional_cascade
        grounds:
          - state_machines.Device.status.ISSUED_to_RECLAIM_PENDING
          - state_machines.Enrollment.device_status.DEVICE_ISSUED_to_RECLAIM_PENDING
          - calculations.device_inventory_conservation
          - calculations.device_issuance_freeze_window
        distinguishing_aspect: |
          The reclaim cascade is CONDITIONAL on the child's state: of three handsets owned
          by the carrier only the one in ISSUED becomes RECLAIM_PENDING when the enrollment
          is de-enrolled - the IN_STOCK spare and the terminal RETIRED unit are untouched -
          and the DAMAGED return that produced the RETIRED unit is what waived the re-issue
          freeze so the second issuance was legal at all.
