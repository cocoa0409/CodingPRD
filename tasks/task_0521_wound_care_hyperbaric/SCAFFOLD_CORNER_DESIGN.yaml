    - errors[ERR_PLAN_NOT_SUSPENDED]
    distinguishing_aspect: Calling resume on a plan still in ACTIVE returns ERR_PLAN_NOT_SUSPENDED (409); no state change.
    test_recipe:
      setup:
      - Plan ACTIVE.
      setup_api_calls:
