  - rule_id: non_linear_state_machine
    instances:
      - name: sire_acquisition_and_collection_dimensions_move_independently
        grounds:
          - state_machines.Sire.RESIDENT_to_RETIRED
          - state_machines.Sire.ELIGIBLE_to_SUSPENDED
          - entities.Sire.fields.acquisition_status
          - entities.Sire.fields.collection_status
        distinguishing_aspect: |
          Non-linearity on the SIRE entity takes the PARALLEL-DIMENSIONS form: retiring the bull moves
          acquisition_status RESIDENT -> RETIRED while collection_status stays ELIGIBLE, and the subsequent
          manual suspension moves collection_status ELIGIBLE -> SUSPENDED while acquisition_status stays
          RETIRED - four distinct combined states are reachable on one row.
        test_recipe:
          setup:
            - "Facility F-IA-04 (US, housing_capacity 2, bench_capacity 1) is APPROVED with resident_sire_count 1."
            - "Sire REG-B is RESIDENT on the acquisition dimension and ELIGIBLE on the collection dimension, all four required tests NEGATIVE until 2027-08-01."
            - "The logical clock stands at 2026-08-31T00:00:00Z."
          setup_api_calls:
            - call: "POST /genetics/facilities"
              payload: { code: "F-IA-04", country_code: "US", housing_capacity: 2, bench_capacity: 1, approved_export_countries: ["CA"] }
              as: ProgramDirector
              captures: { fac_id: "$.data.id" }
            - call: "POST /genetics/sires"
