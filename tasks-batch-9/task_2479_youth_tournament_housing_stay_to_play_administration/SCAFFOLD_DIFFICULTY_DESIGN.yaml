  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_fiscal_on_booking_create
        grounds:
          - validations[priority=21]
          - validations[priority=84]
          - errors.ERR_TOURNAMENT_NOT_OPEN
          - errors.ERR_ROOMS_EXCEED_ROSTER_REQUIREMENT
        distinguishing_aspect: |
          Error-category pair is state (priority 21, ERR_TOURNAMENT_NOT_OPEN, 409) versus
          business_fiscal (priority 84, ERR_ROOMS_EXCEED_ROSTER_REQUIREMENT, 422) on
          POST /housing/bookings. One request violates both: the tournament has already advanced
          to BOOKING_CLOSED and rooms_requested is 9 against a required_rooms_registered of 6.
          Priority 21 must win, so the response is 409 ERR_TOURNAMENT_NOT_OPEN and never the 422.
          Note the OCC check at priority 15 sits above both, so expected_registration_version is
          deliberately re-read after close-booking bumped the registration version.
        test_recipe:
          setup:
            - "Tournament advanced to posture BOOKING_CLOSED by close-booking."
            - "One EXECUTED HotelContract with a 20-room block, so no capacity rule can interfere."
            - "One registration with 13 players and 3 staff: required_rooms_registered 6."
            - "The registration's current version is re-read after CASCADE-CLOSE so the OCC check at priority 15 passes."
          setup_api_calls:
            - call: "POST /housing/tournaments"
              payload: { name: "Fall Classic 2026", rights_holder_org: "USYS", destination_org: "Metro CVB", start_date: "2026-09-10", end_date: "2026-09-13", booking_deadline: "2026-09-01T00:00:00Z", stay_to_play_required: true, share_pct_organizer: 0.50, share_pct_rights_holder: 0.30, share_pct_destination: 0.20 }
              as: HousingManager
              captures: { tourn_id: "$.data.id" }
            - call: "POST /housing/hotels"
              payload: { name: "Host Inn Metro", city: "Metro", total_rooms: 100, distance_miles_from_venue: 3.0 }
              as: HousingManager
              captures: { hotel_id: "$.data.id" }
            - call: "POST /housing/hotel-contracts"
              payload: { tournament_id: "${tourn_id}", hotel_id: "${hotel_id}", negotiated_nightly_rate_cents: 14900, rebate_model: "PER_ROOM_NIGHT_FLAT", rebate_flat_cents_per_room_night: 900, attrition_threshold_pct: 0.10, attrition_penalty_rate_cents_per_room_night: 900, cutoff_date: "2026-08-20" }
              as: HousingManager
              captures: { contract_id: "$.data.id" }
            - call: "POST /housing/room-blocks"
              payload: { contract_id: "${contract_id}", room_type: "DOUBLE_QUEEN", block_size_rooms: 20, arrival_date: "2026-09-10", departure_date: "2026-09-13", release_deadline: "2026-08-25" }
