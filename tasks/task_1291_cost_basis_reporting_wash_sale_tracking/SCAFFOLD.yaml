  # --- Clock (test-driving) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. The default startup clock is fixed at 2026-08-01T00:00:00Z (before any set_current_utc call) and MUST NOT fall back to real wall-clock time; this default is at-or-before every default fixture date so deadline/window rules are deterministic."
    roles: [FirmAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["logical clock advanced; may trigger TaxForm1099B CORRECTION_PENDING → FROZEN sweeps"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http: 400
    condition: "X-User-ID or X-User-Role header is missing or malformed"

  - id: ERR_FORBIDDEN_FOR_ROLE
    http: 403
    condition: "Caller role is valid but not permitted for this endpoint"

  - id: ERR_NOT_FOUND
    http: 404
    condition: "A path-template resource id does not exist within the firm scope"

  - id: ERR_INVALID_STATE_TRANSITION
    http: 409
    condition: "Target resource is not in the from-state required by the transition"

  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Malformed body, missing required field, non-positive quantity, or negative amount"

  - id: ERR_FOREIGN_KEY_UNRESOLVABLE
    http: 422
    condition: "A foreign key in the request body references a non-existent or cross-firm entity"

  - id: ERR_CUSTOMER_SUSPENDED
    http: 409
    condition: "Customer is SUSPENDED or CLOSED; blocks new dispositions and basis change requests"

  - id: ERR_ACCOUNT_RESTRICTED
    http: 409
    condition: "Account is RESTRICTED or CLOSED; blocks new dispositions and outbound transfer statements"

  - id: ERR_TAX_YEAR_CLOSED
    http: 422
    condition: "Disposition.trade_date is in a year earlier than BrokerageFirm.tax_year_open"

  - id: ERR_LOT_SCOPE_MISMATCH
    http: 422
    condition: "SPECIFIC_ID lot_allocation references a lot not on this Account or not on this Security"

  - id: ERR_INCOMPLETE_ACTION_PAYLOAD
    http: 422
    condition: "CorporateAction fields are inconsistent with action_type (missing ratio, missing acquirer, bad spinoff pct)"

  - id: ERR_INCOMPLETE_LOT_BASIS_DETAIL
    http: 422
    condition: "GIFT lot missing gift_donor_basis_cents or gift_fmv_cents_at_gift; INHERITANCE lot missing inherited_fmv_cents_at_death"

  - id: ERR_LOT_ALLOCATION_MISMATCH
    http: 422
    condition: "For SPECIFIC_ID: sum(lot_allocations.quantity) != Disposition.quantity"

  - id: ERR_INSUFFICIENT_LOT_QUANTITY
    http: 422
    condition: "Selected lots cannot cover Disposition.quantity"

  - id: ERR_SOD_VIOLATION
    http: 403
    condition: "Same TaxOps user attempting to APPROVE and APPLY the same BasisChangeRequest"

  - id: ERR_MISSING_SUPPORTING_DOC
    http: 422
    condition: "BasisChangeRequest.approve called without supporting_doc_ref"

  - id: ERR_CORRECTION_WINDOW_CLOSED
    http: 422
    condition: "TaxForm1099B.refile attempted after filed_at + correction_deadline_days"

  - id: ERR_SUPERSEDE_TARGET_INVALID
    http: 422
    condition: "TransferStatement.replaces_statement_id references a statement that is missing or not DELIVERED"

  - id: ERR_TRANSFER_ALREADY_SUPERSEDED
    http: 409
    condition: "redeliver attempted on a REJECTED statement that already has a DELIVERED replacement"

  - id: ERR_TRANSFER_INSUFFICIENT_POSITION
    http: 422
    condition: "OUTBOUND deliver: source account does not hold enough shares"

  - id: ERR_TRANSFER_MISSING_LOT_DETAIL
    http: 422
    condition: "deliver attempted with empty lots_payload"

  - id: ERR_FORM_FROZEN
    http: 409
    condition: "Disposition.correct attempted while an in-scope TaxForm1099B is FROZEN"

  - id: ERR_ACCOUNT_HAS_OPEN_LOTS
    http: 409
    condition: "Account.close attempted while any lot has quantity_remaining > 0 and lot_status not in {FULLY_DISPOSED, SUPERSEDED}"

  - id: ERR_CUSTOMER_HAS_OPEN_ACCOUNTS
    http: 409
    condition: "Customer.close attempted while any account is non-CLOSED"

  - id: ERR_PENDING_BASIS_REQUESTS
    http: 409
    condition: "Customer.close attempted while a BasisChangeRequest is PENDING, UNDER_REVIEW, or APPROVED"

  - id: ERR_STALE_ACCOUNT_VERSION
    http: 412
    condition: "OCC: expected_account_version does not match Account.version on transfer deliver"

  - id: ERR_STALE_LOT_VERSION
    http: 412
    condition: "OCC: expected_tax_lot_version does not match TaxLot.version on basis-change apply"

  - id: ERR_STALE_FORM_VERSION
    http: 412
    condition: "OCC: expected_customer_version does not match Customer.version on form generate, OR Customer mutated since generation on form file"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: FirmAdmin
    description: "Firm superuser: creates firms and customers, suspends/closes customers, files/refiles 1099-Bs"
    identity: opaque
    exclusive_operations:
      - "POST /firms"
      - "POST /firms/{firmId}/customers/{customerId}/suspend"
      - "POST /firms/{firmId}/customers/{customerId}/reinstate"
      - "POST /firms/{firmId}/customers/{customerId}/close"
      - "POST /firms/{firmId}/customers/{customerId}/tax_forms_1099b/{formId}/file"
      - "POST /firms/{firmId}/customers/{customerId}/tax_forms_1099b/{formId}/refile"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /firms/{firmId}/customers"
      - "POST /firms/{firmId}/customers/{customerId}/accounts"
      - "POST /firms/{firmId}/securities"
      - "POST /firms/{firmId}/accounts/{accountId}/tax_lots"
      - "POST /firms/{firmId}/accounts/{accountId}/dispositions"
      - "POST /firms/{firmId}/accounts/{accountId}/restrict"
      - "POST /firms/{firmId}/accounts/{accountId}/reopen"
      - "POST /firms/{firmId}/accounts/{accountId}/close"
      - "POST /firms/{firmId}/securities/{securityId}/corporate_actions"
      - "POST /firms/{firmId}/accounts/{accountId}/transfer_statements"
      - "POST /firms/{firmId}/customers/{customerId}/tax_forms_1099b"
      - "All GET endpoints"

  - name: TaxOps
    description: "Tax operations specialist: books lots/dispositions, settles, corrects, applies corporate actions, drives transfer statements, reviews and applies basis changes, generates 1099-Bs"
    identity: opaque
    exclusive_operations:
      - "POST /firms/{firmId}/dispositions/{dispositionId}/settle"
      - "POST /firms/{firmId}/dispositions/{dispositionId}/void"
      - "POST /firms/{firmId}/dispositions/{dispositionId}/correct"
      - "POST /firms/{firmId}/corporate_actions/{actionId}/apply"
      - "POST /firms/{firmId}/corporate_actions/{actionId}/cancel"
      - "POST /firms/{firmId}/transfer_statements/{stmtId}/deliver"
      - "POST /firms/{firmId}/transfer_statements/{stmtId}/accept"
      - "POST /firms/{firmId}/transfer_statements/{stmtId}/reject"
      - "POST /firms/{firmId}/transfer_statements/{stmtId}/redeliver"
      - "POST /firms/{firmId}/basis_change_requests/{reqId}/start_review"
      - "POST /firms/{firmId}/basis_change_requests/{reqId}/approve"
      - "POST /firms/{firmId}/basis_change_requests/{reqId}/apply"
      - "POST /firms/{firmId}/basis_change_requests/{reqId}/reject"
      - "POST /firms/{firmId}/customers/{customerId}/tax_forms_1099b/{formId}/generate"
    shared_operations:
      - "POST /firms/{firmId}/customers"
      - "POST /firms/{firmId}/customers/{customerId}/accounts"
      - "POST /firms/{firmId}/securities"
      - "POST /firms/{firmId}/accounts/{accountId}/tax_lots"
      - "POST /firms/{firmId}/accounts/{accountId}/dispositions"
      - "POST /firms/{firmId}/accounts/{accountId}/restrict"
      - "POST /firms/{firmId}/accounts/{accountId}/reopen"
      - "POST /firms/{firmId}/accounts/{accountId}/close"
      - "POST /firms/{firmId}/securities/{securityId}/corporate_actions"
      - "POST /firms/{firmId}/accounts/{accountId}/transfer_statements"
      - "POST /firms/{firmId}/customers/{customerId}/tax_forms_1099b"
      - "All GET endpoints"

  - name: CustomerService
    description: "Read-heavy support role: can book lots/dispositions on a customer's behalf, submit basis change requests for a customer, no settlement/correction power"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "POST /firms/{firmId}/accounts/{accountId}/tax_lots"
      - "POST /firms/{firmId}/accounts/{accountId}/dispositions"
      - "POST /firms/{firmId}/customers/{customerId}/basis_change_requests"
      - "All GET endpoints"

  - name: Customer
    description: "The taxpayer; can view own data, submit basis change requests, resubmit rejected requests"
    identity: "entity_backed:Customer"
    exclusive_operations:
      - "POST /firms/{firmId}/basis_change_requests/{reqId}/resubmit"
    shared_operations:
      - "POST /firms/{firmId}/customers/{customerId}/basis_change_requests"
      - "GET endpoints scoped to own customer_id"

  - name: Auditor
    description: "Read-only compliance role; cannot mutate"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "All GET endpoints"
