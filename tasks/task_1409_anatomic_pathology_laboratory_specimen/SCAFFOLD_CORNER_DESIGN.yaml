  - section: complexity_layers
    instances:
      - name: occ_stale_reassign_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[case-reassign-stale-version]
          - errors[ERR_STALE_CASE_VERSION]
        distinguishing_aspect: "OCC on Case.version: after a first reassign advances the version, a second reassign replaying the previously observed expected_case_version is rejected with ERR_STALE_CASE_VERSION (412) — two strictly sequential requests, deterministic."
        test_recipe:
          setup: ["WORKUP case assigned to p1; case version ${cv} observed after the assignment; a first reassign to p2 then succeeds and bumps the version"]
          setup_api_calls:
            - { call: "POST /pathology/patients", payload: { mrn: "MRN-CL1", full_name: "Occ One", date_of_birth: "1980-01-01" }, as: LabAdmin, captures: { pat: $.data.id } }
