              as_user_id: "ana-1"
          assert:
            - "hop 1: Cycle.${cyc1_id}.status == DOSE_DEVIATION and Cycle.${cyc1_id}.deviation_code == BI_POSITIVE"
            - "hop 1: Cycle.${cyc1_id}.delivered_dose_kgy == 30.00 and Cycle.${cyc1_id}.max_observed_dose_kgy == 30.00"
            - "hop 2: Lot.${lot1_id}.status == QUARANTINE, quarantine_reason == BI_POSITIVE, schedulable == false"
            - "hop 2: Lot.${lot1_id}.cumulative_dose_kgy == 0 (the DEVIATION branch never applies lot_cumulative_dose)"
            - "hop 3: ProductQualification.${q1_id}.status == AUDIT_DUE and next_audit_due_at == 2026-08-11T12:00:00Z"
            - "hop 4: Lot.${lot2_id}.status == RECEIVED, schedulable == false, staged_pallet_count == 0, available_pallet_count == 2"
            - "hop 4: Cycle.${cyc2_id}.status == PLANNED, loaded_pallet_count == 0, load_density_g_per_cm3 == 0.0"
            - "hop 4: GET /sterilization/load-positions?cycle_id=${cyc2_id} returns total_count == 0"
            - "GET /sterilization/load-positions?cycle_id=${cyc1_id} still returns total_count == 1 (the deviated cycle keeps its own load map)"

