            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-11T12:00:00Z" }
              as: RegistryOperations
              as_user_id: "ops-1"
            - call: "POST /registry/collection-bookings/${bk_2}/shipments"
