        distinguishing_aspect: "A second program with the same settlement_case_id whose window opens only 14 days after the first closes violates the closed-interval + 30-day-buffer rule and returns ERR_PROGRAM_WINDOW_CONFLICT — a different resource (RebateProgram) and different interval semantics than the half-open claim overlap."
