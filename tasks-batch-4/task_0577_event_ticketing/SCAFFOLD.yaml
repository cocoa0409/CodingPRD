# =============================================================================
# PRD Benchmark Seed Tables — task_0577_event_ticketing
# Live-Event Primary Ticketing & Box Office (Ticketmaster style)
# Difficulty: Expert
# =============================================================================

scenario: |
  577. Live-Event Primary Ticketing & Box Office (Ticketmaster style): event/seat-map
  & inventory hold, presale code & onsale queue, dynamic/platinum pricing & service
  fees, delivery (mobile/print/will-call), transfer & verified resale routing,
  refund/postponement & credit, access control/scan, settlement to promoter

domain_name: event-ticketing
api_prefix: "/"

# -----------------------------------------------------------------------------
# Complexity Profile
# -----------------------------------------------------------------------------
complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: pricing_engine
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: flat
  # Peer top-level resources (events, buyers, seats, holds, orders, tickets,
  # transfers, refund-requests, settlements) linked by foreign keys carried in
  # request/response bodies; no deep URL nesting for the mutating surface.

  state_machine_shape: parallel
  # Ticket carries three independent state dimensions (status × delivery_status ×
  # scan_status); Event carries a cyclic ONSALE<->POSTPONED reschedule loop.

  relationship_patterns:
    - one_to_many          # Event -> Seats/Holds/Orders; Order -> Tickets
    - cross_aggregate      # Ticket references Order + Seat + Buyer across aggregates

  role_model: peer_roles
  # Buyer owns purchase-side resources; BoxOffice operates inventory/refunds;
  # Promoter owns events/settlement; GateScanner performs access control only.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Buyer
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: name, type: string, source: input, description: "Buyer full name" }
      - { name: email, type: string, source: input, description: "Buyer email; unique per buyer" }
      - { name: credit_balance_cents, type: integer, source: computed, description: "Sum of amount_cents over this buyer's COMPLETED RefundRequests whose refund_destination==CREDIT; starts 0" }
      - { name: created_at, type: datetime, source: system, description: "ISO8601 UTC, 3 fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation incl. cascades" }
      - { name: version, type: integer, source: system, description: "Starts at 1, +1 per mutation" }

  - name: Event
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: promoter_id, type: string, source: input, description: "Opaque promoter operator id (equals the Promoter role's X-User-ID); NOT an entity FK" }
      - { name: name, type: string, source: input, description: "Event name" }
      - { name: venue_name, type: string, source: input, description: "Venue name" }
      - { name: event_datetime, type: datetime, source: input, description: "Scheduled start (ISO8601 UTC); must be strictly after current clock at create" }
      - { name: hold_ttl_minutes, type: integer, source: input, description: "Minutes an inventory hold stays ACTIVE before it may be swept to EXPIRED", default: 15 }
      - { name: purchase_window_minutes, type: integer, source: input, description: "Minutes an ADMITTED queue token grants for buying before its window lapses", default: 30 }
      - { name: presale_code, type: string, source: input, description: "Presale access code; null disables presale", default: null }
      - { name: presale_max_uses, type: integer, source: input, description: "Max holds admitted via presale_code", default: 0 }
      - { name: status, type: enum, source: system, description: "Lifecycle status", constraints: "DRAFT | ANNOUNCED | PRESALE | ONSALE | POSTPONED | CANCELED | COMPLETED" }
      - { name: total_capacity, type: integer, source: computed, description: "count(Seat where seat.event_id==this.id)" }
      - { name: seats_available, type: integer, source: computed, description: "count(Seat with status==AVAILABLE)" }
      - { name: seats_held, type: integer, source: computed, description: "count(Seat with status==HELD)" }
      - { name: seats_sold, type: integer, source: computed, description: "count(Seat with status==SOLD)" }
      - { name: pct_sold, type: number, source: computed, description: "(seats_sold / total_capacity) * 100 when total_capacity>0 else 0.0; drives dynamic pricing tier" }
      - { name: presale_uses_count, type: integer, source: computed, description: "count(Hold with presale_code==event.presale_code and status IN {ACTIVE,CONVERTED})" }
      - { name: created_at, type: datetime, source: system, description: "ISO8601 UTC" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation incl. cascades" }
      - { name: version, type: integer, source: system, description: "Starts at 1; +1 on status transitions AND on hold create (OCC parent); parent for hold-create OCC" }

  - name: PriceLevel
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: event_id, type: string, source: input, description: "FK -> Event.id" }
      - { name: name, type: string, source: input, description: "Price level / zone name" }
      - { name: base_face_value_cents, type: integer, source: input, description: "Base face value before dynamic multiplier; > 0" }
      - { name: is_platinum, type: boolean, source: input, description: "Platinum seats carry a 2.00x demand floor", default: false }
      - { name: service_fee_pct, type: number, source: input, description: "Per-ticket percentage service fee, e.g. 0.15" }
      - { name: service_fee_flat_cents, type: integer, source: input, description: "Per-ticket flat service fee added after percentage", default: 0 }
      - { name: dynamic_pricing_enabled, type: boolean, source: input, description: "When false, current_face_value_cents == base_face_value_cents regardless of pct_sold", default: true }
      - { name: created_at, type: datetime, source: system, description: "ISO8601 UTC" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on mutation" }
      - { name: version, type: integer, source: system, description: "Starts at 1, +1 per mutation" }

  - name: Seat
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: event_id, type: string, source: input, description: "FK -> Event.id" }
      - { name: price_level_id, type: string, source: input, description: "FK -> PriceLevel.id; must belong to the same event" }
      - { name: section, type: string, source: input, description: "Seat section label" }
      - { name: row, type: string, source: input, description: "Seat row label" }
      - { name: seat_number, type: string, source: input, description: "Seat number label; (section,row,seat_number) unique within event" }
      - { name: status, type: enum, source: system, description: "Inventory status", constraints: "AVAILABLE | HELD | SOLD" }
      - { name: current_face_value_cents, type: integer, source: computed, description: "Dynamic price per calc dynamic_seat_price using PriceLevel + Event.pct_sold" }
      - { name: created_at, type: datetime, source: system, description: "ISO8601 UTC" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on mutation incl. cascades" }
      - { name: version, type: integer, source: system, description: "Starts at 1, +1 per mutation" }

  - name: QueueToken
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: event_id, type: string, source: input, description: "FK -> Event.id" }
      - { name: buyer_id, type: string, source: input, description: "FK -> Buyer.id" }
      - { name: position, type: integer, source: system, description: "1-based FIFO position among WAITING tokens at enqueue time, ordered by created_at ASC" }
      - { name: status, type: enum, source: system, description: "Queue status", constraints: "WAITING | ADMITTED | EXPIRED" }
      - { name: admitted_at, type: datetime, source: system, description: "Clock value at admit; null until ADMITTED" }
      - { name: purchase_deadline, type: datetime, source: computed, description: "admitted_at + event.purchase_window_minutes; null until ADMITTED" }
      - { name: created_at, type: datetime, source: system, description: "ISO8601 UTC" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on mutation" }
      - { name: version, type: integer, source: system, description: "Starts at 1, +1 per mutation" }

  - name: Hold
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: event_id, type: string, source: input, description: "FK -> Event.id" }
      - { name: buyer_id, type: string, source: input, description: "FK -> Buyer.id; must equal acting Buyer X-User-ID" }
      - { name: seat_ids, type: array, source: input, description: "Non-empty list of Seat.id values held together" }
      - { name: presale_code, type: string, source: input, description: "Presale code supplied when event.status==PRESALE; null otherwise", default: null }
      - { name: status, type: enum, source: system, description: "Hold status", constraints: "ACTIVE | CONVERTED | RELEASED | EXPIRED" }
      - { name: face_subtotal_cents, type: integer, source: computed, description: "Snapshot at creation: sum of current_face_value_cents over held seats; frozen thereafter" }
      - { name: expires_at, type: datetime, source: computed, description: "created clock + event.hold_ttl_minutes; frozen at creation" }
      - { name: created_at, type: datetime, source: system, description: "ISO8601 UTC" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on mutation incl. cascades" }
      - { name: version, type: integer, source: system, description: "Starts at 1, +1 per mutation" }

  - name: Order
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: event_id, type: string, source: input, description: "FK -> Event.id; copied from hold at creation" }
      - { name: buyer_id, type: string, source: input, description: "FK -> Buyer.id; copied from hold at creation" }
      - { name: hold_id, type: string, source: input, description: "FK -> Hold.id; the ACTIVE hold being purchased" }
      - { name: delivery_method, type: enum, source: input, description: "Fulfillment channel", constraints: "MOBILE | PRINT | WILL_CALL" }
      - { name: status, type: enum, source: system, description: "Order status", constraints: "PENDING | PAID | PARTIALLY_REFUNDED | REFUNDED | CANCELED" }
      - { name: face_total_cents, type: integer, source: computed, description: "Snapshot at creation: sum of current_face_value_cents over the hold's seats; frozen (final/locked price)" }
      - { name: service_fee_cents, type: integer, source: computed, description: "Per calc order_service_fee: sum over seats of round_half_up(seat_face*service_fee_pct)+service_fee_flat_cents (round per seat THEN sum); frozen at creation" }
      - { name: order_total_cents, type: integer, source: computed, description: "face_total_cents + service_fee_cents; frozen at creation" }
      - { name: paid_amount_cents, type: integer, source: system, description: "order_total_cents captured at pay; 0 until PAID" }
      - { name: refunded_amount_cents, type: integer, source: computed, description: "sum(amount_cents) over this order's COMPLETED RefundRequests" }
      - { name: created_at, type: datetime, source: system, description: "ISO8601 UTC" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on mutation incl. cascades" }
      - { name: version, type: integer, source: system, description: "Starts at 1; +1 per mutation incl. pay and refund-request create (OCC parent)" }

  - name: Ticket
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: order_id, type: string, source: input, description: "FK -> Order.id" }
      - { name: seat_id, type: string, source: input, description: "FK -> Seat.id" }
      - { name: holder_buyer_id, type: string, source: input, description: "FK -> Buyer.id; current holder, changes on transfer accept" }
      - { name: face_value_cents, type: integer, source: system, description: "Locked seat current_face_value at order creation; frozen" }
      - { name: delivery_method, type: enum, source: system, description: "Copied from order", constraints: "MOBILE | PRINT | WILL_CALL" }
      - { name: status, type: enum, source: system, description: "Validity dimension", constraints: "VALID | REFUNDED | VOID" }
      - { name: delivery_status, type: enum, source: system, description: "Fulfillment dimension (independent of status/scan)", constraints: "PENDING | DELIVERED" }
      - { name: scan_status, type: enum, source: system, description: "Access-control dimension (independent of status/delivery)", constraints: "UNSCANNED | SCANNED" }
      - { name: created_at, type: datetime, source: system, description: "ISO8601 UTC" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on mutation incl. cascades" }
      - { name: version, type: integer, source: system, description: "Starts at 1, +1 per mutation" }

  - name: TicketTransfer
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: ticket_id, type: string, source: input, description: "FK -> Ticket.id" }
      - { name: from_buyer_id, type: string, source: input, description: "FK -> Buyer.id; current holder initiating (must equal X-User-ID)" }
      - { name: to_buyer_id, type: string, source: input, description: "FK -> Buyer.id; verified recipient" }
      - { name: kind, type: enum, source: input, description: "Transfer kind", constraints: "GIFT | RESALE" }
      - { name: list_price_cents, type: integer, source: input, description: "Resale price; required and > 0 when kind==RESALE, must be null when kind==GIFT", default: null }
      - { name: status, type: enum, source: system, description: "Transfer status", constraints: "INITIATED | ACCEPTED | DECLINED" }
      - { name: created_at, type: datetime, source: system, description: "ISO8601 UTC" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on mutation" }
      - { name: version, type: integer, source: system, description: "Starts at 1, +1 per mutation" }

  - name: RefundRequest
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: order_id, type: string, source: input, description: "FK -> Order.id" }
      - { name: reason, type: enum, source: input, description: "Refund reason", constraints: "CUSTOMER_REQUEST | POSTPONEMENT | EVENT_CANCELED" }
      - { name: refund_destination, type: enum, source: input, description: "Where funds go", constraints: "ORIGINAL | CREDIT" }
      - { name: ticket_ids, type: array, source: input, description: "Subset of the order's VALID Ticket.id to refund; when omitted, all currently-VALID tickets of the order", default: null }
      - { name: amount_cents, type: integer, source: computed, description: "sum(face_value_cents) over the included tickets (service fees are never refunded)" }
      - { name: status, type: enum, source: system, description: "Refund status", constraints: "REQUESTED | COMPLETED | REJECTED" }
      - { name: created_at, type: datetime, source: system, description: "ISO8601 UTC" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on mutation" }
      - { name: version, type: integer, source: system, description: "Starts at 1, +1 per mutation" }

  - name: Settlement
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: event_id, type: string, source: input, description: "FK -> Event.id; one settlement per event, created when event COMPLETED" }
      - { name: gross_face_cents, type: integer, source: computed, description: "GROSS variant: sum(face_value_cents) over ALL issued tickets of the event (status IN {VALID,REFUNDED,VOID})" }
      - { name: service_fees_cents, type: integer, source: computed, description: "sum(service_fee_cents) over the event's PAID/PARTIALLY_REFUNDED/REFUNDED orders; retained by platform, not paid to promoter" }
      - { name: refunds_cents, type: integer, source: computed, description: "sum(amount_cents) over COMPLETED RefundRequests of the event's orders" }
      - { name: net_to_promoter_cents, type: integer, source: computed, description: "NET variant: sum(face_value_cents) over tickets with status==VALID only" }
      - { name: status, type: enum, source: system, description: "Settlement status", constraints: "PENDING | FINALIZED" }
      - { name: created_at, type: datetime, source: system, description: "ISO8601 UTC" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on mutation" }
      - { name: version, type: integer, source: system, description: "Starts at 1, +1 per mutation" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Event
    field: status
    initial_state: DRAFT
    terminal_states: [CANCELED, COMPLETED]
    note: "Cyclic ONSALE<->POSTPONED reschedule loop; branching to CANCELED/COMPLETED."
    transitions:
      - from: DRAFT
        to: ANNOUNCED
        trigger: "POST /events/{event_id}/status (target_status=ANNOUNCED)"
        actor: Promoter
        preconditions: ["At least one PriceLevel exists for the event"]
        side_effects: ["increments Event.version by 1"]
      - from: [ANNOUNCED]
        to: PRESALE
        trigger: "POST /events/{event_id}/status (target_status=PRESALE)"
        actor: Promoter
        preconditions: ["event.presale_code is not null"]
        side_effects: ["increments Event.version by 1"]
      - from: [ANNOUNCED, PRESALE, POSTPONED]
        to: ONSALE
        trigger: "POST /events/{event_id}/status (target_status=ONSALE)"
        actor: Promoter
        preconditions: ["At least one Seat exists for the event"]
        side_effects: ["increments Event.version by 1"]
        note: "POSTPONED->ONSALE is the reschedule leg of the cycle"
      - from: ONSALE
        to: POSTPONED
        trigger: "POST /events/{event_id}/status (target_status=POSTPONED, new_event_datetime=<future>)"
        actor: Promoter
        preconditions: ["new_event_datetime strictly after current clock"]
        side_effects:
          - "Sets event.event_datetime = new_event_datetime"
          - "ACTIVE holds -> EXPIRED and their seats HELD -> AVAILABLE"
          - "increments Event.version by 1"
      - from: [DRAFT, ANNOUNCED, PRESALE, ONSALE, POSTPONED]
        to: CANCELED
        trigger: "POST /events/{event_id}/status (target_status=CANCELED)"
        actor: Promoter
        preconditions: []
        side_effects:
          - "CASCADE A link1: each PAID/PARTIALLY_REFUNDED Order -> REFUNDED (auto full EVENT_CANCELED refund created, destination ORIGINAL)"
          - "CASCADE A link1: each PENDING Order -> CANCELED and its Hold -> RELEASED"
          - "CASCADE A link2 (caused by Order->REFUNDED): every VALID Ticket of that order -> VOID"
          - "CASCADE A link3 (caused by Ticket->VOID): each ticket's Seat -> AVAILABLE"
          - "ACTIVE holds -> RELEASED; their seats HELD -> AVAILABLE"
          - "increments Event.version by 1"
      - from: ONSALE
        to: COMPLETED
        trigger: "POST /events/{event_id}/status (target_status=COMPLETED)"
        actor: Promoter
        preconditions: ["current clock >= event.event_datetime"]
        side_effects:
          - "Creates Settlement(status=PENDING) for the event"
          - "increments Event.version by 1"

  - entity: QueueToken
    field: status
    initial_state: WAITING
    terminal_states: [EXPIRED]
    transitions:
      - from: WAITING
        to: ADMITTED
        trigger: "POST /queue-tokens/{token_id}/admit"
        actor: BoxOffice
        preconditions:
          - "event.status == ONSALE"
          - "buyer has no other ADMITTED token for this event whose purchase_deadline >= current clock (queue admission-window overlap)"
        side_effects:
          - "Sets admitted_at = current clock; purchase_deadline = admitted_at + purchase_window_minutes"
      - from: ADMITTED
        to: EXPIRED
        trigger: "system (order created within window consumes token, OR window lapses)"
        actor: system
        preconditions: []
        side_effects: ["Token no longer usable to gate a hold/order"]

  - entity: Hold
    field: status
    initial_state: ACTIVE
    terminal_states: [CONVERTED, RELEASED, EXPIRED]
    transitions:
      - from: ACTIVE
        to: CONVERTED
        trigger: "system (POST /orders/{order_id}/pay on this hold's order)"
        actor: system
        preconditions: ["Order for this hold reached PAID"]
        side_effects:
          - "CASCADE B link2 (caused by Order->PAID via link1): the hold's Seats HELD -> SOLD"
      - from: ACTIVE
        to: RELEASED
        trigger: "POST /holds/{hold_id}/release or system (event CANCELED / order CANCELED)"
        actor: "Buyer or system"
        preconditions: ["No PAID order references this hold"]
        side_effects: ["Held Seats HELD -> AVAILABLE"]
      - from: ACTIVE
        to: EXPIRED
        trigger: "POST /events/{event_id}/sweep-holds (expires_at <= current clock) or system (event POSTPONED)"
        actor: "BoxOffice or system"
        preconditions: ["current clock >= expires_at (half-open: expires_at itself has lapsed)"]
        side_effects: ["Held Seats HELD -> AVAILABLE"]

  - entity: Order
    field: status
    initial_state: PENDING
    terminal_states: [REFUNDED, CANCELED]
    transitions:
      - from: PENDING
        to: PAID
        trigger: "POST /orders/{order_id}/pay"
        actor: Buyer
        preconditions:
          - "Hold is ACTIVE and not expired (current clock < hold.expires_at)"
          - "event.status IN {ONSALE, PRESALE}"
        side_effects:
          - "CASCADE B link1: Hold -> CONVERTED"
          - "Issues one Ticket per held seat (status VALID, scan_status UNSCANNED, face_value_cents = seat face locked at order creation)"
          - "Ticket.delivery_status = DELIVERED when delivery_method==MOBILE else PENDING"
          - "Sets paid_amount_cents = order_total_cents"
          - "increments Order.version by 1"
      - from: PENDING
        to: CANCELED
        trigger: "system (event CANCELED) — no direct buyer endpoint"
        actor: system
        preconditions: []
        side_effects: ["Hold -> RELEASED"]
      - from: [PAID, PARTIALLY_REFUNDED]
        to: PARTIALLY_REFUNDED
        trigger: "system (RefundRequest COMPLETED, refunded_amount_cents < face_total_cents)"
        actor: system
        preconditions: ["Included tickets are a strict subset of remaining VALID tickets"]
        side_effects:
          - "Included Tickets -> REFUNDED; their Seats -> AVAILABLE"
          - "If refund_destination==CREDIT: buyer.credit_balance_cents += amount_cents"
      - from: [PAID, PARTIALLY_REFUNDED]
        to: REFUNDED
        trigger: "system (RefundRequest COMPLETED covering all remaining VALID tickets) or system (event CANCELED)"
        actor: system
        preconditions: []
        side_effects:
          - "All remaining VALID Tickets -> REFUNDED (or VOID when event CANCELED); their Seats -> AVAILABLE"
          - "If refund_destination==CREDIT: buyer.credit_balance_cents += amount_cents"

  - entity: Ticket
    field: "status × delivery_status × scan_status (parallel dimensions)"
    initial_state: "VALID / PENDING-or-DELIVERED / UNSCANNED"
    terminal_states: [REFUNDED, VOID]
    note: "Three independent dimensions evolve separately: validity (status), fulfillment (delivery_status), access (scan_status)."
    transitions:
      - from: "delivery_status=PENDING"
        to: "delivery_status=DELIVERED"
        trigger: "POST /tickets/{ticket_id}/deliver"
        actor: BoxOffice
        preconditions: ["ticket.status == VALID", "delivery_status == PENDING"]
        side_effects: ["delivery_status -> DELIVERED (validity & scan dimensions unchanged)"]
      - from: "scan_status=UNSCANNED"
        to: "scan_status=SCANNED"
        trigger: "POST /tickets/{ticket_id}/scan"
        actor: GateScanner
        preconditions:
          - "ticket.status == VALID"
          - "ticket.delivery_status == DELIVERED"
          - "ticket.scan_status == UNSCANNED"
          - "event.status == ONSALE (cross-entity gate at door)"
        side_effects: ["scan_status -> SCANNED (validity & delivery dimensions unchanged)"]
      - from: "status=VALID"
        to: "status=REFUNDED"
        trigger: "system (RefundRequest COMPLETED including this ticket)"
        actor: system
        preconditions: ["ticket.status == VALID"]
        side_effects: ["Seat -> AVAILABLE"]
      - from: "status=VALID"
        to: "status=VOID"
        trigger: "system (event CANCELED)"
        actor: system
        preconditions: ["ticket.status == VALID"]
        side_effects: ["Seat -> AVAILABLE"]

  - entity: TicketTransfer
    field: status
    initial_state: INITIATED
    terminal_states: [ACCEPTED, DECLINED]
    transitions:
      - from: INITIATED
        to: ACCEPTED
        trigger: "POST /transfers/{transfer_id}/accept"
        actor: Buyer
        preconditions:
          - "Acting Buyer X-User-ID == to_buyer_id"
          - "Ticket.status == VALID and scan_status == UNSCANNED"
          - "event.status NOT IN {CANCELED, COMPLETED}"
        side_effects:
          - "Ticket.holder_buyer_id -> to_buyer_id"
      - from: INITIATED
        to: DECLINED
        trigger: "POST /transfers/{transfer_id}/decline"
        actor: Buyer
        preconditions: ["Acting Buyer X-User-ID == to_buyer_id"]
        side_effects: []

  - entity: RefundRequest
    field: status
    initial_state: REQUESTED
    terminal_states: [COMPLETED, REJECTED]
    transitions:
      - from: REQUESTED
        to: COMPLETED
        trigger: "POST /refund-requests/{refund_id}/approve"
        actor: BoxOffice
        preconditions:
          - "All included tickets still VALID"
          - "refund amount_cents <= order.face_total_cents - order.refunded_amount_cents"
        side_effects:
          - "Included Tickets -> REFUNDED; their Seats -> AVAILABLE"
          - "Order -> PARTIALLY_REFUNDED or REFUNDED per calc refund_balance"
          - "If refund_destination==CREDIT: buyer.credit_balance_cents += amount_cents"
      - from: REQUESTED
        to: REJECTED
        trigger: "POST /refund-requests/{refund_id}/reject"
        actor: BoxOffice
        preconditions: []
        side_effects: ["No inventory or ledger change"]

  - entity: Settlement
    field: status
    initial_state: PENDING
    terminal_states: [FINALIZED]
    transitions:
      - from: PENDING
        to: FINALIZED
        trigger: "POST /events/{event_id}/settlement/finalize"
        actor: "BoxOffice or Promoter"
        preconditions: ["event.status == COMPLETED"]
        side_effects:
          - "Freezes net_to_promoter_cents (NET variant: VALID tickets only), gross_face_cents, refunds_cents, service_fees_cents"

# -----------------------------------------------------------------------------
# §1.2.1 Concurrency Rules (OCC on parent version)
# -----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: hold-create-stale-event
    parent_entity: Event
    write_endpoint: "POST /events/{event_id}/holds"
    occ_field: "expected_event_version"
    description: |
      Creating a Hold against an Event whose version has advanced since the client
      last observed it is rejected. This captures the case where another writer has
      just created a hold or repriced/rescheduled the event (each legitimately
      bumps Event.version), so the current writer's view of seat prices and
      availability is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: refund-create-stale-order
    parent_entity: Order
    write_endpoint: "POST /orders/{order_id}/refund-requests"
    occ_field: "expected_order_version"
    description: |
      Creating a RefundRequest against an Order whose version has advanced since the
      client last observed it is rejected. This captures the case where another
      writer has just completed a partial refund (which legitimately supersedes the
      remaining refundable balance and bumps Order.version), so the current writer's
      view of what is still refundable is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: dynamic_seat_price
    trigger: "read of Seat.current_face_value_cents; snapshot into Hold.face_subtotal_cents and Order.face_total_cents at their creation"
    algorithm: tiered_pricing
    formula: |
      # ≥3 inputs with non-linear interaction (tier selection + platinum override + clamp)
      pct = event.pct_sold
      if not price_level.dynamic_pricing_enabled:
          multiplier = 1.00
      else:
          if pct < 50:        multiplier = 1.00
          elif pct < 80:      multiplier = 1.25   # boundary: pct >= 50 enters this tier
          else:               multiplier = 1.50   # boundary: pct >= 80
      if price_level.is_platinum:
          multiplier = max(multiplier, 2.00)      # platinum demand floor
      raw = round_half_up(price_level.base_face_value_cents * multiplier)
      floor_cents = price_level.base_face_value_cents
      ceil_cents  = price_level.base_face_value_cents * 3
      current_face_value_cents = min(max(raw, floor_cents), ceil_cents)  # nested min/max clamp
    constants:
      TIER1_PCT: 50
      TIER2_PCT: 80
      TIER1_MULT: 1.25
      TIER2_MULT: 1.50
      PLATINUM_FLOOR_MULT: 2.00
      CEIL_MULT: 3
    precision: "integer cents, round_half_up"
    variants:
      - name: current_dynamic
        when: "reading Seat.current_face_value_cents live"
        difference: "reflects the event's CURRENT pct_sold tier"
      - name: locked_final
        when: "Order.face_total_cents / Ticket.face_value_cents"
        difference: "frozen at order-creation pct_sold; does NOT re-price when pct_sold later crosses a tier"

  - name: order_service_fee
    trigger: "Order creation (POST /orders)"
    algorithm: aggregation
    formula: |
      # Rounding ORDER is pinned: round each seat's percentage fee to whole cents,
      # THEN sum. (Sum-then-round would differ by up to a cent.)
      service_fee_cents = 0
      for seat in hold.seats:
          seat_face = order.face_total snapshot for that seat  # locked seat face
          per_seat = round_half_up(seat_face * price_level.service_fee_pct) + price_level.service_fee_flat_cents
          service_fee_cents += per_seat
      # order_total_cents = face_total_cents + service_fee_cents
    input_set: "seats belonging to the order's hold; each seat's locked face at order creation"
    precision: "integer cents, round_half_up, PER-SEAT then sum"

  - name: refund_amount
    trigger: "RefundRequest creation and approval"
    algorithm: aggregation
    formula: |
      included = ticket_ids if provided else [t for t in order.tickets if t.status == VALID]
      amount_cents = sum(t.face_value_cents for t in included)   # service fees never refunded
    input_set: "the request's included tickets, all of which must currently be VALID"
    precision: "integer cents"

  - name: refund_balance
    trigger: "RefundRequest approval (COMPLETED)"
    algorithm: threshold
    formula: |
      order.refunded_amount_cents = sum(amount over COMPLETED refunds of this order)
      if order.refunded_amount_cents >= order.face_total_cents:  # boundary: full-face refunded
          order.status = REFUNDED
      else:
          order.status = PARTIALLY_REFUNDED
    input_set: "COMPLETED RefundRequests of the order"
    precision: "integer cents"

  - name: seat_inventory_counts
    trigger: "any Seat status change (hold create/release/expire, pay, refund, void)"
    algorithm: aggregation
    formula: |
      seats_available = count(Seat status==AVAILABLE)
      seats_held      = count(Seat status==HELD)
      seats_sold      = count(Seat status==SOLD)
      total_capacity  = count(Seat)
      # INVARIANT: seats_available + seats_held + seats_sold == total_capacity  (always)
      pct_sold = (seats_sold / total_capacity) * 100 if total_capacity > 0 else 0.0
    input_set: "all Seats of the event"
    precision: "integer counts; pct_sold is a real number"

  - name: buyer_credit_ledger
    trigger: "RefundRequest COMPLETED with refund_destination==CREDIT"
    algorithm: aggregation
    formula: |
      credit_balance_cents = sum(r.amount_cents
                                 for r in RefundRequests
                                 where r.status==COMPLETED
                                   and r.refund_destination==CREDIT
                                   and r.order.buyer_id == buyer.id)
      # INVARIANT (money conservation): a CREDIT refund increases credit_balance_cents
      # by EXACTLY the refund's amount_cents, and never otherwise.
    input_set: "the buyer's orders' COMPLETED CREDIT refunds"
    precision: "integer cents"

  - name: settlement_net_to_promoter
    trigger: "read of Settlement; frozen at POST /events/{event_id}/settlement/finalize"
    algorithm: aggregation
    formula: |
      gross_face_cents      = sum(t.face_value_cents for t in event.tickets)                 # all issued (VALID+REFUNDED+VOID)
      net_to_promoter_cents = sum(t.face_value_cents for t in event.tickets if t.status==VALID)  # VALID only
      service_fees_cents    = sum(o.service_fee_cents for o in event.orders if o.status IN {PAID, PARTIALLY_REFUNDED, REFUNDED})
      refunds_cents         = sum(r.amount_cents for r in event.refund_requests if r.status==COMPLETED)
    input_set: "event's issued tickets, PAID-family orders, COMPLETED refunds"
    precision: "integer cents"
    variants:
      - name: gross_settlement
        when: "operator dashboard estimate"
        difference: "counts ALL issued tickets' face (VALID+REFUNDED+VOID) -> gross_face_cents"
      - name: net_settlement
        when: "finalized payout to promoter"
        difference: "counts only VALID tickets' face -> net_to_promoter_cents; refunded/voided face excluded"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Acting role is permitted for the operation per §1.7; for entity_backed Buyer, X-User-ID owns the resource (buyer_id / holder_buyer_id / from_buyer_id)"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "All path ids and body FK ids resolve (validated left-to-right); e.g. price_level_id on seat create, hold_id on order create, ticket_ids on refund"
    error_id: "ERR_*_NOT_FOUND (entity-specific)"
    http_status: 404
    applies_to: all

  - priority: 4
    category: state
    check: "OCC: expected_<parent>_version matches parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /events/{event_id}/holds; POST /orders/{order_id}/refund-requests"

  - priority: 5
    category: state
    check: "Target resource is in a valid state for the requested transition (state machine from-set)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 6
    category: state
    check: "Event is in a purchasable state (ONSALE, or PRESALE with valid presale_code) for hold/order operations"
    error_id: ERR_EVENT_NOT_ON_SALE
    http_status: 409
    applies_to: "POST /events/{event_id}/holds; POST /orders"

  - priority: 7
    category: business_safety
    check: "Access control: scan requires ticket VALID + DELIVERED; transfer requires ticket VALID + UNSCANNED"
    error_id: "ERR_TICKET_NOT_DELIVERED | ERR_TICKET_ALREADY_SCANNED | ERR_TICKET_NOT_TRANSFERABLE"
    http_status: 409
    applies_to: "POST /tickets/{id}/scan; POST /transfers; POST /transfers/{id}/accept"

  - priority: 8
    category: business_constraint
    check: "Presale code valid & not exhausted; seat map uniqueness; queue admission-window non-overlap; empty seat set rejected"
    error_id: "ERR_INVALID_PRESALE_CODE | ERR_DUPLICATE_SEAT | ERR_ALREADY_ADMITTED | ERR_EMPTY_SEAT_SELECTION | ERR_NOT_ADMITTED"
    http_status: "409 | 422"
    applies_to: "POST /events/{id}/seats; POST /events/{id}/holds; POST /queue-tokens/{id}/admit"

  - priority: 9
    category: business_temporal
    check: "Hold not expired (clock < expires_at) at pay; admission window not lapsed (clock <= purchase_deadline)"
    error_id: "ERR_HOLD_EXPIRED | ERR_ADMISSION_WINDOW_EXPIRED"
    http_status: 409
    applies_to: "POST /orders; POST /orders/{id}/pay; POST /events/{id}/holds"

  - priority: 10
    category: business_referential
    check: "Seat belongs to the hold's event and is AVAILABLE; seat-hold overlap (no other ACTIVE unexpired hold on the seat)"
    error_id: "ERR_SEAT_UNAVAILABLE"
    http_status: 409
    applies_to: "POST /events/{event_id}/holds"

  - priority: 11
    category: business_fiscal
    check: "Hold requests at most MAX_SEATS_PER_HOLD (2) seats; refund amount does not exceed order's remaining refundable face balance"
    error_id: "ERR_CAPACITY_EXCEEDED | ERR_REFUND_EXCEEDS_BALANCE"
    http_status: 422
    applies_to: "POST /events/{id}/holds; POST /orders/{id}/refund-requests; POST /refund-requests/{id}/approve"

  - priority: 12
    category: state
    check: "Settlement finalize requires event COMPLETED"
    error_id: ERR_SETTLEMENT_NOT_READY
    http_status: 409
    applies_to: "POST /events/{event_id}/settlement/finalize"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Test-driving clock ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Server startup default is 2026-05-01T00:00:00Z; before any call the clock reads exactly this default and never falls back to wall-clock time."
    roles: [BoxOffice]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["Logical clock set to to_iso8601"]

  # --- Buyers ---
  - method: POST
    path: "/buyers"
    description: "Register a buyer"
    roles: [BoxOffice]
    code: 201
    input: [name, email]
    output: Buyer
    side_effects: ["credit_balance_cents=0, version=1"]
  - method: GET
    path: "/buyers/{buyer_id}"
    description: "Get a buyer (incl. computed credit_balance_cents)"
    roles: [Buyer, BoxOffice]
    code: 200
    input: []
    output: Buyer
    side_effects: []
  - method: GET
    path: "/buyers/{id}/queue-tokens"
    description: "List a buyer's queue tokens (reverse-reach QueueToken.buyer_id)"
    roles: [Buyer, BoxOffice]
    code: 200
    input: []
    output: QueueToken[]
    side_effects: []
  - method: GET
    path: "/buyers/{id}/transfers"
    description: "List transfers where the buyer is sender or recipient (reverse-reach TicketTransfer.from_buyer_id / to_buyer_id)"
    roles: [Buyer, BoxOffice]
    code: 200
    input: []
    output: TicketTransfer[]
    side_effects: []

  # --- Events ---
  - method: POST
    path: "/events"
    description: "Create an event in DRAFT"
    roles: [Promoter, BoxOffice]
    code: 201
    input: [promoter_id, name, venue_name, event_datetime, hold_ttl_minutes, purchase_window_minutes, "presale_code?", "presale_max_uses?"]
    output: Event
    side_effects: ["status=DRAFT, version=1, all counters=0"]
  - method: GET
    path: "/events/{event_id}"
    description: "Get an event (incl. computed inventory + pct_sold)"
    roles: [Buyer, BoxOffice, Promoter, GateScanner]
    code: 200
    input: []
    output: Event
    side_effects: []
  - method: POST
    path: "/events/{event_id}/status"
    description: "Drive the event lifecycle (ANNOUNCED/PRESALE/ONSALE/POSTPONED/CANCELED/COMPLETED)"
    roles: [Promoter, BoxOffice]
    code: 200
    input: [target_status, "new_event_datetime?"]
    output: Event
    side_effects: ["State-machine transition per §1.2 Event; increments Event.version by 1; cascades on CANCELED/POSTPONED/COMPLETED"]
  - method: POST
    path: "/events/{event_id}/price-levels"
    description: "Create a price level for the event"
    roles: [Promoter, BoxOffice]
    code: 201
    input: [name, base_face_value_cents, is_platinum, service_fee_pct, service_fee_flat_cents, dynamic_pricing_enabled]
    output: PriceLevel
    side_effects: []
  - method: GET
    path: "/events/{id}/price-levels"
    description: "List price levels of an event (reverse-reach PriceLevel.event_id)"
    roles: [Buyer, BoxOffice, Promoter]
    code: 200
    input: []
    output: PriceLevel[]
    side_effects: []
  - method: POST
    path: "/events/{event_id}/seats"
    description: "Create a seat in the event's seat map (AVAILABLE)"
    roles: [BoxOffice]
    code: 201
    input: [price_level_id, section, row, seat_number]
    output: Seat
    side_effects: ["status=AVAILABLE; increments event.total_capacity"]
  - method: POST
    path: "/events/{event_id}/queue-tokens"
    description: "Join the onsale queue (WAITING)"
    roles: [Buyer]
    code: 201
    input: [buyer_id]
    output: QueueToken
    side_effects: ["status=WAITING; position assigned FIFO"]
  - method: GET
    path: "/events/{id}/queue-tokens"
    description: "List an event's queue tokens (reverse-reach QueueToken.event_id)"
    roles: [Buyer, BoxOffice]
    code: 200
    input: []
    output: QueueToken[]
    side_effects: []
  - method: POST
    path: "/events/{event_id}/holds"
    description: "Create an inventory hold over one or more seats (OCC on Event.version)"
    roles: [Buyer]
    code: 201
    input: [seat_ids, buyer_id, expected_event_version, "presale_code?"]
    output: Hold
    side_effects:
      - "Seats AVAILABLE -> HELD"
      - "Snapshots face_subtotal_cents; sets expires_at = clock + hold_ttl_minutes"
      - "increments Event.version by 1"
  - method: POST
    path: "/events/{event_id}/sweep-holds"
    description: "Sweep expired holds (expires_at <= clock) to EXPIRED and release their seats"
    roles: [BoxOffice]
    code: 200
    input: []
    output: Event
    side_effects: ["ACTIVE holds with expires_at<=clock -> EXPIRED; their seats HELD -> AVAILABLE"]
  - method: POST
    path: "/events/{event_id}/settlement/finalize"
    description: "Finalize the event's settlement (freeze net_to_promoter_cents)"
    roles: [BoxOffice, Promoter]
    code: 200
    input: []
    output: Settlement
    side_effects: ["Settlement PENDING -> FINALIZED"]
  - method: GET
    path: "/events/{id}/settlement"
    description: "Read the event's settlement (reverse-reach Settlement.event_id; array of 0..1)"
    roles: [BoxOffice, Promoter]
    code: 200
    input: []
    output: Settlement[]
    side_effects: []

  # --- Seats ---
  - method: GET
    path: "/seats/{seat_id}"
    description: "Get a seat (incl. computed current_face_value_cents)"
    roles: [Buyer, BoxOffice, Promoter]
    code: 200
    input: []
    output: Seat
    side_effects: []
  - method: GET
    path: "/seats"
    description: "List seats filtered by event/price-level/status (reverse-reach Seat.event_id, Seat.price_level_id)"
    roles: [Buyer, BoxOffice, Promoter]
    code: 200
    input: ["event_id?", "price_level_id?", "status?"]
    output: Seat[]
    side_effects: []

  # --- Queue tokens ---
  - method: POST
    path: "/queue-tokens/{token_id}/admit"
    description: "Admit a WAITING token to ADMITTED and open its purchase window"
    roles: [BoxOffice]
    code: 200
    input: []
    output: QueueToken
    side_effects: ["status WAITING -> ADMITTED; admitted_at=clock; purchase_deadline=clock+purchase_window_minutes"]

  # --- Holds ---
  - method: GET
    path: "/holds/{hold_id}"
    description: "Get a hold"
    roles: [Buyer, BoxOffice]
    code: 200
    input: []
    output: Hold
    side_effects: []
  - method: GET
    path: "/holds"
    description: "List holds filtered by event/buyer (reverse-reach Hold.event_id, Hold.buyer_id)"
    roles: [Buyer, BoxOffice]
    code: 200
    input: ["event_id?", "buyer_id?"]
    output: Hold[]
    side_effects: []
  - method: POST
    path: "/holds/{hold_id}/release"
    description: "Release an ACTIVE hold and free its seats"
    roles: [Buyer, BoxOffice]
    code: 200
    input: []
    output: Hold
    side_effects: ["status ACTIVE -> RELEASED; seats HELD -> AVAILABLE"]

  # --- Orders ---
  - method: POST
    path: "/orders"
    description: "Create a PENDING order from an ACTIVE hold; locks face/fee snapshot"
    roles: [Buyer]
    code: 201
    input: [hold_id, delivery_method]
    output: Order
    side_effects:
      - "Copies event_id, buyer_id from hold"
      - "Locks face_total_cents (dynamic_seat_price locked_final), service_fee_cents (order_service_fee), order_total_cents"
  - method: GET
    path: "/orders/{order_id}"
    description: "Get an order (incl. computed refunded_amount_cents)"
    roles: [Buyer, BoxOffice]
    code: 200
    input: []
    output: Order
    side_effects: []
  - method: GET
    path: "/orders"
    description: "List orders filtered by event/buyer/hold (reverse-reach Order.event_id, Order.buyer_id, Order.hold_id)"
    roles: [Buyer, BoxOffice]
    code: 200
    input: ["event_id?", "buyer_id?", "hold_id?"]
    output: Order[]
    side_effects: []
  - method: POST
    path: "/orders/{order_id}/pay"
    description: "Pay a PENDING order; issues tickets and marks seats SOLD"
    roles: [Buyer]
    code: 200
    input: []
    output: Order
    side_effects:
      - "status PENDING -> PAID; Hold -> CONVERTED; held Seats -> SOLD"
      - "Issues one Ticket per seat (VALID, UNSCANNED, delivery per method)"
      - "Sets paid_amount_cents; increments Order.version by 1"
  - method: POST
    path: "/orders/{order_id}/refund-requests"
    description: "Create a refund request against a PAID/PARTIALLY_REFUNDED order (OCC on Order.version)"
    roles: [Buyer, BoxOffice]
    code: 201
    input: [reason, refund_destination, expected_order_version, "ticket_ids?"]
    output: RefundRequest
    side_effects:
      - "status=REQUESTED; amount_cents = refund_amount over included tickets"
      - "increments Order.version by 1"
  - method: GET
    path: "/orders/{id}/refund-requests"
    description: "List an order's refund requests (reverse-reach RefundRequest.order_id)"
    roles: [Buyer, BoxOffice]
    code: 200
    input: []
    output: RefundRequest[]
    side_effects: []

  # --- Refund requests ---
  - method: POST
    path: "/refund-requests/{refund_id}/approve"
    description: "Approve (complete) a refund request"
    roles: [BoxOffice]
    code: 200
    input: []
    output: RefundRequest
    side_effects:
      - "status REQUESTED -> COMPLETED; included Tickets -> REFUNDED; their Seats -> AVAILABLE"
      - "Order -> PARTIALLY_REFUNDED / REFUNDED; CREDIT destination credits buyer"
  - method: POST
    path: "/refund-requests/{refund_id}/reject"
    description: "Reject a refund request"
    roles: [BoxOffice]
    code: 200
    input: []
    output: RefundRequest
    side_effects: ["status REQUESTED -> REJECTED"]

  # --- Tickets ---
  - method: GET
    path: "/tickets/{ticket_id}"
    description: "Get a ticket (status × delivery_status × scan_status)"
    roles: [Buyer, BoxOffice, GateScanner]
    code: 200
    input: []
    output: Ticket
    side_effects: []
  - method: GET
    path: "/tickets"
    description: "List tickets filtered by order/seat/holder (reverse-reach Ticket.order_id, Ticket.seat_id, Ticket.holder_buyer_id)"
    roles: [Buyer, BoxOffice, GateScanner]
    code: 200
    input: ["order_id?", "seat_id?", "holder_buyer_id?"]
    output: Ticket[]
    side_effects: []
  - method: GET
    path: "/tickets/{id}/transfers"
    description: "List transfers for a ticket (reverse-reach TicketTransfer.ticket_id)"
    roles: [Buyer, BoxOffice]
    code: 200
    input: []
    output: TicketTransfer[]
    side_effects: []
  - method: POST
    path: "/tickets/{ticket_id}/deliver"
    description: "Mark a PRINT/WILL_CALL ticket DELIVERED"
    roles: [BoxOffice]
    code: 200
    input: []
    output: Ticket
    side_effects: ["delivery_status PENDING -> DELIVERED"]
  - method: POST
    path: "/tickets/{ticket_id}/scan"
    description: "Scan a ticket at the gate (access control)"
    roles: [GateScanner]
    code: 200
    input: []
    output: Ticket
    side_effects: ["scan_status UNSCANNED -> SCANNED"]

  # --- Transfers ---
  - method: POST
    path: "/transfers"
    description: "Initiate a ticket transfer (GIFT or verified RESALE routing)"
    roles: [Buyer]
    code: 201
    input: [ticket_id, to_buyer_id, kind, "list_price_cents?"]
    output: TicketTransfer
    side_effects: ["status=INITIATED"]
  - method: POST
    path: "/transfers/{transfer_id}/accept"
    description: "Recipient accepts the transfer; ticket holder is reassigned"
    roles: [Buyer]
    code: 200
    input: []
    output: TicketTransfer
    side_effects: ["status INITIATED -> ACCEPTED; Ticket.holder_buyer_id -> to_buyer_id"]
  - method: POST
    path: "/transfers/{transfer_id}/decline"
    description: "Recipient declines the transfer"
    roles: [Buyer]
    code: 200
    input: []
    output: TicketTransfer
    side_effects: ["status INITIATED -> DECLINED"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid auth headers or unknown role" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted for the operation, or entity_backed Buyer acting on a resource it does not own" }
  - { id: ERR_VALIDATION, http: 400, condition: "Malformed body, missing required field, bad enum, negative amount, or RESALE without positive list_price_cents / GIFT with list_price_cents" }
  - { id: ERR_EVENT_NOT_FOUND, http: 404, condition: "Event id does not resolve" }
  - { id: ERR_PRICE_LEVEL_NOT_FOUND, http: 404, condition: "price_level_id does not resolve or belongs to a different event" }
  - { id: ERR_SEAT_NOT_FOUND, http: 404, condition: "seat id in seat_ids does not resolve or belongs to a different event" }
  - { id: ERR_BUYER_NOT_FOUND, http: 404, condition: "buyer_id / to_buyer_id does not resolve" }
  - { id: ERR_QUEUE_TOKEN_NOT_FOUND, http: 404, condition: "queue token id does not resolve" }
  - { id: ERR_HOLD_NOT_FOUND, http: 404, condition: "hold_id does not resolve" }
  - { id: ERR_ORDER_NOT_FOUND, http: 404, condition: "order_id does not resolve" }
  - { id: ERR_TICKET_NOT_FOUND, http: 404, condition: "ticket id or a ticket_ids member does not resolve or belongs to another order" }
  - { id: ERR_TRANSFER_NOT_FOUND, http: 404, condition: "transfer id does not resolve" }
  - { id: ERR_REFUND_NOT_FOUND, http: 404, condition: "refund id does not resolve" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match parent's current version (OCC)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a valid state for the requested transition" }
  - { id: ERR_EVENT_NOT_ON_SALE, http: 409, condition: "Hold/order attempted while event not ONSALE (or PRESALE with a valid code)" }
  - { id: ERR_NOT_ADMITTED, http: 409, condition: "Hold during ONSALE without an ADMITTED queue token in-window for the buyer" }
  - { id: ERR_ALREADY_ADMITTED, http: 409, condition: "Admit rejected: buyer already has an ADMITTED token for the event whose purchase_deadline >= clock" }
  - { id: ERR_ADMISSION_WINDOW_EXPIRED, http: 409, condition: "Buyer's admission window lapsed (clock > purchase_deadline)" }
  - { id: ERR_INVALID_PRESALE_CODE, http: 409, condition: "Presale code missing/wrong or presale_uses_count >= presale_max_uses" }
  - { id: ERR_EMPTY_SEAT_SELECTION, http: 422, condition: "Hold create with an empty seat_ids array" }
  - { id: ERR_SEAT_UNAVAILABLE, http: 409, condition: "A requested seat is not AVAILABLE or is covered by another ACTIVE unexpired hold" }
  - { id: ERR_DUPLICATE_SEAT, http: 409, condition: "Seat (section,row,seat_number) already exists within the event" }
  - { id: ERR_HOLD_EXPIRED, http: 409, condition: "Order create or pay against a hold whose expires_at <= clock" }
  - { id: ERR_CAPACITY_EXCEEDED, http: 422, condition: "Hold requests more than MAX_SEATS_PER_HOLD (2) seats" }
  - { id: ERR_TICKET_NOT_DELIVERED, http: 409, condition: "Scan attempted on a ticket that is not DELIVERED" }
  - { id: ERR_TICKET_ALREADY_SCANNED, http: 409, condition: "Scan or transfer attempted on an already-SCANNED ticket" }
  - { id: ERR_TICKET_NOT_TRANSFERABLE, http: 409, condition: "Transfer of a ticket that is not VALID (REFUNDED/VOID) or already SCANNED" }
  - { id: ERR_REFUND_EXCEEDS_BALANCE, http: 422, condition: "Refund amount exceeds the order's remaining refundable face balance" }
  - { id: ERR_SETTLEMENT_NOT_READY, http: 409, condition: "Settlement finalize before the event is COMPLETED" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Buyer
    description: "Customer who queues, holds, buys, transfers/resells, requests refunds, and holds tickets."
    identity: "entity_backed:Buyer"
    exclusive_operations:
      - "POST /events/{id}/queue-tokens — join queue"
      - "POST /events/{id}/holds — create inventory hold"
      - "POST /orders — create order"
      - "POST /orders/{id}/pay — pay order"
      - "POST /transfers — initiate transfer/resale"
      - "POST /transfers/{id}/accept — accept transfer"
      - "POST /transfers/{id}/decline — decline transfer"
    shared_operations:
      - "POST /orders/{id}/refund-requests — request refund (shared with BoxOffice)"
      - "POST /holds/{id}/release — release own hold (shared with BoxOffice)"
      - "GET own buyers/holds/orders/tickets/transfers/queue-tokens and public event/seat reads"

  - name: BoxOffice
    description: "Operator managing inventory, delivery/will-call, queue admission, refunds, sweeps, and the logical clock."
    identity: "opaque"
    exclusive_operations:
      - "POST /_clock/set_current_utc — set logical clock"
      - "POST /buyers — register buyer"
      - "POST /events/{id}/seats — build seat map"
      - "POST /queue-tokens/{id}/admit — admit queue token"
      - "POST /events/{id}/sweep-holds — expire stale holds"
      - "POST /tickets/{id}/deliver — deliver/will-call pickup"
      - "POST /refund-requests/{id}/approve — approve refund"
      - "POST /refund-requests/{id}/reject — reject refund"
    shared_operations:
      - "POST /events, POST /events/{id}/status, POST /events/{id}/price-levels (shared with Promoter)"
      - "POST /orders/{id}/refund-requests, POST /holds/{id}/release (shared with Buyer)"
      - "POST /events/{id}/settlement/finalize, GET /events/{id}/settlement (shared with Promoter)"

  - name: Promoter
    description: "Event owner (opaque operator id stored as Event.promoter_id); manages lifecycle and views settlement."
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "POST /events — create own event (promoter_id == X-User-ID)"
      - "POST /events/{id}/status — drive lifecycle (shared with BoxOffice)"
      - "POST /events/{id}/price-levels — configure pricing (shared with BoxOffice)"
      - "POST /events/{id}/settlement/finalize, GET /events/{id}/settlement (shared with BoxOffice)"

  - name: GateScanner
    description: "Access-control operator at the venue gate; scans tickets only."
    identity: "opaque"
    exclusive_operations:
      - "POST /tickets/{id}/scan — scan ticket at gate"
    shared_operations:
      - "GET /tickets/{id}, GET /tickets, GET /events/{id} for gate lookups"
