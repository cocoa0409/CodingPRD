            - "TenantStatement ${pdst_id}.payment_status == PAID  # hop 3 caused by balance reaching 0"

      # --- instance 2: depth >= 2, payment reverse -> amount_paid -> payment_status
      - name: payment_reverse_amount_paid_status_recompute_depth2
        grounds:
          - state_machines.Payment.POSTED_to_REVERSED
          - calculations.statement_totals
          - entities.TenantStatement.fields.amount_paid_cents
          - entities.TenantStatement.fields.payment_status
        distinguishing_aspect: |
          One trigger (reverse) chains two caused hops: (1) Payment -> REVERSED
          decrements TenantStatement.amount_paid_cents; (2) that decrement recomputes
          balance_due_cents and flips payment_status PAID -> UNPAID. Hop 2 is caused
