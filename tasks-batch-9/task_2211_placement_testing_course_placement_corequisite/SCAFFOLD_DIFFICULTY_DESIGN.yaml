      - name: appeal_endorsement_state_precedes_reviewer_binding
        error_category_pair: "state (priority 8) x business_safety (priority 11)"
        grounds:
          - validations[priority=8].ERR_APPEAL_NOT_ENDORSED
          - validations[priority=11].ERR_NOT_APPEAL_REVIEWER
          - state_machines.PlacementAppeal.INSTRUCTOR_ENDORSED_to_GRANTED
        distinguishing_aspect: |
          A third distinct pair, and the counter-intuitive one: the actor-resource
          binding at priority 11 (a 403) is declared BELOW the state gate at
          priority 8 (a 409), so a stranger attempting a GRANT on a merely
          UNDER_REVIEW appeal is told ERR_APPEAL_NOT_ENDORSED, not
          ERR_NOT_APPEAL_REVIEWER. Implementations that hoist all identity checks
          to the top of the handler — the usual instinct — return the 403 and fail.
          The instance walks all four quadrants: both violated, state alone,
          binding alone, and both satisfied.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-02T00:00:00Z; the determination is created one day earlier at the 2026-08-01T00:00:00Z default."
            - "Courses MATH-050 (level_rank 50, units 5.0) and MATH-100 (level_rank 100, units 4.0), both ACTIVE — the endorse step requires the requested Course to be ACTIVE."
            - "One ACTIVE PlacementRule TRANSCRIPT_GPA -> MATH-050 (min_hs_gpa 2.0, V1); nothing targets MATH-100, so MATH-100 is reachable only by appeal."
            - "Student SS: hs_gpa 2.50 VERIFIED, transcript_recorded_at 2025-06-01T00:00:00Z; determination determined_by_user_id staff-1, base_confidence_score 31.3."
            - "Appeal filed by SS requesting MATH-100, then start-review by registrar-1 -> UNDER_REVIEW with reviewed_by_user_id registrar-1."
            - "registrar-2 is a second Registrar who is NOT the reviewer; instructor-1 differs from registrar-1 so SoD-3 holds; registrar-1 differs from staff-1 so SoD-2 holds."
          setup_api_calls:
            - call: "POST /courses"
              payload: { course_code: "MATH-050", title: "Pre-Algebra", subject_area: "MATH", level_rank: 50, units: 5.0, is_support_course: false, transfer_level: false }
              as: SystemAdmin
