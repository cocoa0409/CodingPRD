      - name: err_fleet_heterogeneity_triggerable
        claim_type: error_triggerable
        grounds: [ "errors[ERR_FLEET_HETEROGENEITY]" ]
        distinguishing_aspect: "Registering a crew member with qualified_fleet other than SINGLE_FLEET fails with ERR_FLEET_HETEROGENEITY — the single-fleet invariant is enforced at entry."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /ops/crew-members"
              payload: { employee_ref: "C9", crew_role: "CAPTAIN", qualified_fleet: "WIDEBODY", base_station_code: "DAL" }
              as: OpsController
              captures: { err: $.data.error_id }
          assert:
            - "error_id is ERR_FLEET_HETEROGENEITY or ERR_VALIDATION (enum gate) with HTTP 422/400 — the non-SINGLE_FLEET value is rejected at entry"

