              captures: { err: $.data.error_id }
            - call: "POST /orders"
              payload: { stand_id: "${stand_id}", source: "WINDOW", lane_code: "A", items: [{ recipe_id: "${recipe_id}", quantity: 1, modifier_names: [] }], expected_stand_version: "${stand_v}" }
              as: CrewMember
              as_user_id: "${taker_id}"
              captures: { window_order_id: $.data.id }
          assert:
            - "app order rejected with ERR_STAND_NOT_ACCEPTING_ORDERS (HTTP 409)"
            - "window order succeeds with 201 on the same THROTTLED stand, queue_status == MERGED"

      - name: shift_publish_blocked_until_operator_agreement_active
        grounds:
          - validations[priority=11]
          - errors[ERR_AGREEMENT_NOT_ACTIVE]
          - state_machines.Shift.DRAFT_to_PUBLISHED
        distinguishing_aspect: |
          Entity pair Shift → OperatorAgreement (different pair from the
          sibling): publish is rejected while the stand's agreement is merely
          APPROVED, and succeeds after activation — a cross-entity state
          precondition on a different relationship.
        test_recipe:
          setup:
            - "Stand APPROVED with agreement APPROVED but not yet ACTIVE; DRAFT shift fully staffed (2 assignments, LEAD covered)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - *c_region
            - *c_stand
            - *c_approve
            - *c_op
            - *c_taker
            - *c_lead
            - *c_agr
            - *c_agr_ok
            - call: "POST /shifts"
              payload: { stand_id: "${stand_id}", starts_at: "2026-09-01T07:00:00Z", ends_at: "2026-09-01T09:00:00Z", is_peak: false }
              as: StandOperator
              as_user_id: "${op_id}"
              captures: { shift_id: $.data.id, shift_v: $.data.version }
            - call: "POST /shifts/${shift_id}/assignments"
              payload: { crew_member_id: "${lead_id}", role: "LEAD", starts_at: "2026-09-01T07:00:00Z", ends_at: "2026-09-01T09:00:00Z", expected_shift_version: "${shift_v}" }
              as: StandOperator
              as_user_id: "${op_id}"
            - call: "GET /shifts/${shift_id}"
              payload: {}
              as: StandOperator
              as_user_id: "${op_id}"
              captures: { shift_v2: $.data.version }
            - call: "POST /shifts/${shift_id}/assignments"
              payload: { crew_member_id: "${taker_id}", role: "TAKER", starts_at: "2026-09-01T07:00:00Z", ends_at: "2026-09-01T09:00:00Z", expected_shift_version: "${shift_v2}" }
              as: StandOperator
              as_user_id: "${op_id}"
          trigger:
            - call: "POST /shifts/${shift_id}/publish"
              payload: {}
              as: StandOperator
              as_user_id: "${op_id}"
              captures: { err: $.data.error_id }
            - call: "POST /operator-agreements/${agr_id}/activate"
              payload: {}
              as: StandOperator
              as_user_id: "${op_id}"
            - call: "POST /shifts/${shift_id}/publish"
              payload: {}
              as: StandOperator
              as_user_id: "${op_id}"
              captures: { shift_status: $.data.status }
          assert:
            - "publish while agreement APPROVED fails with ERR_AGREEMENT_NOT_ACTIVE (HTTP 409)"
            - "after activation the same publish succeeds and Shift.${shift_id}.status == PUBLISHED"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: crew_assignment_overlap_half_open_adjacency
        grounds:
          - validations[priority=9]
          - errors[ERR_ASSIGNMENT_OVERLAP]
          - endpoints.POST_/shifts/{shiftId}/assignments
        distinguishing_aspect: |
          Resource CrewMember, half-open interval semantics: [07:00,09:00) then
          [09:00,11:00) is allowed because adjacency (end == start) does not
          intersect, while [08:30,10:00) intersects and is rejected with
          ERR_ASSIGNMENT_OVERLAP.
        test_recipe:
          setup:
            - "Stand OPEN with ACTIVE agreement; DRAFT shift 07:00-11:00; crew member already assigned 07:00-09:00."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - *c_region
            - *c_stand
            - *c_approve
            - *c_op
            - *c_taker
            - *c_agr
            - *c_agr_ok
            - *c_agr_act
            - *c_open
            - call: "POST /shifts"
              payload: { stand_id: "${stand_id}", starts_at: "2026-09-01T07:00:00Z", ends_at: "2026-09-01T11:00:00Z", is_peak: false }
              as: StandOperator
              as_user_id: "${op_id}"
              captures: { shift_id: $.data.id, shift_v: $.data.version }
            - call: "POST /shifts/${shift_id}/assignments"
              payload: { crew_member_id: "${taker_id}", role: "TAKER", starts_at: "2026-09-01T07:00:00Z", ends_at: "2026-09-01T09:00:00Z", expected_shift_version: "${shift_v}" }
              as: StandOperator
              as_user_id: "${op_id}"
              captures: { asg1: $.data.id }
            - call: "GET /shifts/${shift_id}"
              payload: {}
              as: StandOperator
              as_user_id: "${op_id}"
              captures: { shift_v2: $.data.version }
          trigger:
            - call: "POST /shifts/${shift_id}/assignments"
              payload: { crew_member_id: "${taker_id}", role: "RUNNER", starts_at: "2026-09-01T09:00:00Z", ends_at: "2026-09-01T11:00:00Z", expected_shift_version: "${shift_v2}" }
              as: StandOperator
              as_user_id: "${op_id}"
              captures: { asg2: $.data.id }
            - call: "GET /shifts/${shift_id}"
              payload: {}
              as: StandOperator
              as_user_id: "${op_id}"
              captures: { shift_v3: $.data.version }
            - call: "POST /shifts/${shift_id}/assignments"
              payload: { crew_member_id: "${taker_id}", role: "BAR", starts_at: "2026-09-01T08:30:00Z", ends_at: "2026-09-01T10:00:00Z", expected_shift_version: "${shift_v3}" }
              as: StandOperator
              as_user_id: "${op_id}"
              captures: { err: $.data.error_id }
          assert:
            - "adjacent assignment 09:00-11:00 succeeds (201) — half-open intervals permit end == start"
            - "overlapping assignment 08:30-10:00 rejected with ERR_ASSIGNMENT_OVERLAP (HTTP 409)"
            - "ShiftAssignment.${asg2}.status == ASSIGNED"

      - name: throughput_window_gap_buffer_semantics
        grounds:
          - validations[priority=9]
          - errors[ERR_WINDOW_OVERLAP]
          - endpoints.POST_/throughput-windows
        distinguishing_aspect: |
          Resource Stand, buffer-gap semantics (different from pure
          half-open adjacency): windows must be disjoint AND separated by >= 15
          minutes — a window 08:05-08:10 that overlaps nothing but sits only 5
          minutes after a 07:00-08:00 window is rejected, while 08:15-09:00
          (exactly 15 minutes) is accepted.
        test_recipe:
          setup:
            - "Stand created; existing window 07:00-08:00 on the stand."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - *c_region
            - *c_stand
            - call: "POST /throughput-windows"
              payload: { stand_id: "${stand_id}", starts_at: "2026-09-01T07:00:00Z", ends_at: "2026-09-01T08:00:00Z", target_cars: 5 }
              as: RegionalManager
              as_user_id: "rm-1"
              captures: { w1: $.data.id }
          trigger:
            - call: "POST /throughput-windows"
              payload: { stand_id: "${stand_id}", starts_at: "2026-09-01T08:15:00Z", ends_at: "2026-09-01T09:00:00Z", target_cars: 5 }
              as: RegionalManager
              as_user_id: "rm-1"
              captures: { w2: $.data.id }
            - call: "POST /throughput-windows"
              payload: { stand_id: "${stand_id}", starts_at: "2026-09-01T08:05:00Z", ends_at: "2026-09-01T08:10:00Z", target_cars: 2 }
              as: RegionalManager
              as_user_id: "rm-1"
              captures: { err: $.data.error_id }
          assert:
            - "window at exactly 15 minutes gap (08:15) succeeds with 201"
            - "window 08:05-08:10 — geometrically disjoint from both existing windows — rejected with ERR_WINDOW_OVERLAP (HTTP 409)"
            - "rejection is buffer-driven: 08:05 lies inside the 15-minute gap buffers of both 07:00-08:00 and 08:15-09:00, intersecting neither"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: capture_then_full_refund_conserves_net_sales_and_points
        grounds:
          - state_machines.Payment.AUTHORIZED_to_CAPTURED
          - state_machines.Payment.CAPTURED_to_REFUND_PENDING
          - state_machines.Payment.REFUND_PENDING_to_REFUNDED
          - calculations.loyalty_points_accrual
          - calculations.royalty_statement
        distinguishing_aspect: |
          Conserved quantity: stand net sales (Σcaptured − Σrefunded per month)
          and the customer's points. Capture(+5000, +50 pts) paired with its
          full approved refund(−5000, −50 pts) returns the royalty statement's
          gross_cents and the account's points to exactly their pre-capture
          values — zero drift.
        test_recipe:
          setup:
            - "Stand OPEN; loyalty account at 0 points; window order total 5000 authorized and captured in September 2026."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T06:00:00Z" }
              as: PlatformAdmin
            - *c_region
            - *c_stand
            - *c_approve
            - *c_op
            - *c_taker
            - *c_lead
            - *c_agr
            - *c_agr_ok
            - *c_agr_act
            - *c_open
            - call: "POST /recipes"
              payload: { name: "Keg 5000", channel: "CORE", base_price_cents: 5000, base_build_seconds: 120, temperature_class: "HOT" }
              as: PlatformAdmin
              captures: { recipe_id: $.data.id }
            - call: "POST /recipe-distributions"
              payload: { recipe_id: "${recipe_id}", stand_id: "${stand_id}" }
              as: PlatformAdmin
              captures: { dist_id: $.data.id }
            - call: "POST /recipe-distributions/${dist_id}/activate"
              payload: {}
              as: StandOperator
              as_user_id: "${op_id}"
            - call: "POST /loyalty-accounts"
              payload: { full_name: "Refundable Rita", home_stand_id: "${stand_id}" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - *c_stand_v
            - call: "POST /orders"
              payload: { stand_id: "${stand_id}", source: "WINDOW", lane_code: "A", loyalty_account_id: "${acct_id}", items: [{ recipe_id: "${recipe_id}", quantity: 1, modifier_names: [] }], expected_stand_version: "${stand_v}" }
              as: CrewMember
              as_user_id: "${taker_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/payments/authorize"
              payload: { card_token: "VISA-OK" }
              as: CrewMember
              as_user_id: "${taker_id}"
              captures: { pay_id: $.data.id }
            - call: "POST /orders/${order_id}/call-to-window"
              payload: {}
              as: ShiftLead
              as_user_id: "${lead_id}"
            - call: "POST /payments/${pay_id}/capture"
              payload: {}
              as: ShiftLead
              as_user_id: "${lead_id}"
          trigger:
            - call: "POST /payments/${pay_id}/refunds"
              payload: { amount_cents: 5000 }
              as: ShiftLead
              as_user_id: "${lead_id}"
              captures: { pending_status: $.data.status }
            - call: "POST /payments/${pay_id}/refund-decisions"
              payload: { decision: "APPROVE" }
              as: StandOperator
              as_user_id: "${op_id}"
              captures: { final_status: $.data.status, refunded: $.data.refunded_cents }
            - call: "GET /loyalty-accounts/${acct_id}"
              payload: {}
              as: StandOperator
              as_user_id: "${op_id}"
              captures: { points_after: $.data.points }
            - call: "GET /stands/${stand_id}/royalty-statement"
              payload: { month: "2026-09" }
              as: StandOperator
              as_user_id: "${op_id}"
              captures: { gross_after: $.data.gross_cents, royalty_after: $.data.royalty_cents }
          assert:
            - "refund of 5000 > 2000 routes through REFUND_PENDING before approval"
            - "Payment.${pay_id}.status == REFUNDED with captured_cents == 5000 and refunded_cents == 5000"
            - "LoyaltyAccount.${acct_id}.points == 0 (50 earned at capture, 50 reversed at refund)"
            - "royalty_statement.gross_cents == 0 and royalty_cents == 0 for 2026-09 — net-sales ledger invariant holds with zero drift"

      - name: lane_slot_reserve_and_release_conserve_stacking_capacity
        grounds:
          - calculations.lane_merge_position
          - state_machines.Order.AT_WINDOW_to_SERVED
          - errors[ERR_LANE_STACKING_FULL]
          - entities.Stand.fields.lane_occupancy
        distinguishing_aspect: |
          Conserved quantity: per-lane stacking capacity (occupied + free ==
          max_stack_cars). Reserving lane A's single slot makes a second
          lane-A window order fail with ERR_LANE_STACKING_FULL; the handoff's
          compensating release makes a third lane-A order succeed — capacity
          is conserved across reserve/release with no slot leak.
        test_recipe:
          setup:
            - "Stand OPEN with lane A capacity 1 and lane B capacity 9 (total 10 for approval); first lane-A window order MERGED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T06:00:00Z" }
              as: PlatformAdmin
            - *c_region
            - call: "POST /stands"
              payload: { region_id: "${region_id}", name: "Tight Stand", min_ingress_gap_seconds: 45, lane_configs: [{ lane_code: "A", max_stack_cars: 1 }, { lane_code: "B", max_stack_cars: 9 }] }
              as: PlatformAdmin
              captures: { stand_id: $.data.id }
            - *c_approve
            - *c_op
            - *c_taker
            - *c_lead
            - *c_agr
            - *c_agr_ok
            - *c_agr_act
            - *c_open
            - *c_recipe
            - *c_dist
            - *c_dist_act
            - *c_stand_v
            - call: "POST /orders"
              payload: { stand_id: "${stand_id}", source: "WINDOW", lane_code: "A", items: [{ recipe_id: "${recipe_id}", quantity: 1, modifier_names: [] }], expected_stand_version: "${stand_v}" }
              as: CrewMember
              as_user_id: "${taker_id}"
              captures: { order1_id: $.data.id }
          trigger:
            - call: "GET /stands/${stand_id}"
              payload: {}
              as: StandOperator
              as_user_id: "${op_id}"
              captures: { stand_v2: $.data.version, occ_mid: "$.data.lane_occupancy.A" }
            - call: "POST /orders"
              payload: { stand_id: "${stand_id}", source: "WINDOW", lane_code: "A", items: [{ recipe_id: "${recipe_id}", quantity: 1, modifier_names: [] }], expected_stand_version: "${stand_v2}" }
              as: CrewMember
              as_user_id: "${taker_id}"
              captures: { err: $.data.error_id }
            - call: "GET /order-items"
              payload: { order_id: "${order1_id}" }
              as: CrewMember
              as_user_id: "${taker_id}"
              captures: { item1_id: "$.data[0].id" }
            - call: "POST /order-items/${item1_id}/start-build"
              payload: {}
              as: CrewMember
              as_user_id: "${taker_id}"
            - call: "POST /order-items/${item1_id}/complete-build"
              payload: {}
              as: CrewMember
              as_user_id: "${taker_id}"
            - call: "POST /orders/${order1_id}/payments/authorize"
              payload: { card_token: "VISA-OK" }
              as: CrewMember
              as_user_id: "${taker_id}"
              captures: { pay1_id: $.data.id }
            - call: "POST /orders/${order1_id}/call-to-window"
              payload: {}
              as: ShiftLead
              as_user_id: "${lead_id}"
            - call: "POST /payments/${pay1_id}/capture"
              payload: {}
              as: ShiftLead
              as_user_id: "${lead_id}"
            - call: "POST /orders/${order1_id}/handoff"
              payload: {}
              as: ShiftLead
              as_user_id: "${lead_id}"
            - call: "GET /stands/${stand_id}"
              payload: {}
              as: StandOperator
              as_user_id: "${op_id}"
              captures: { stand_v3: $.data.version, occ_end: "$.data.lane_occupancy.A" }
            - call: "POST /orders"
              payload: { stand_id: "${stand_id}", source: "WINDOW", lane_code: "A", items: [{ recipe_id: "${recipe_id}", quantity: 1, modifier_names: [] }], expected_stand_version: "${stand_v3}" }
              as: CrewMember
              as_user_id: "${taker_id}"
              captures: { order3_id: $.data.id }
          assert:
            - "with order 1 MERGED in lane A, lane_occupancy.A == 1 (== max_stack_cars 1)"
            - "second lane-A window order rejected with ERR_LANE_STACKING_FULL (HTTP 409) even though lane B has 9 free slots"
            - "after handoff (compensating release) lane_occupancy.A == 0"
            - "third lane-A window order succeeds with 201 — occupied + free == max_stack_cars throughout"

