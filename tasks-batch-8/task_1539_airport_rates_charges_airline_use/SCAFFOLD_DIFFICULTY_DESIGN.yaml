  # ---------------------------------------------------------
  # Rule 7 — cross_entity_state_dependency (≥2, different entity pairs)
  # ---------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: rates_setting_publish_requires_fiscal_year_open
        grounds:
          - state_machines.RatesSetting
          - state_machines.FiscalYear
        distinguishing_aspect: |
          Pair: RatesSetting × FiscalYear. RatesSetting DRAFT → CONSULTATION
          (publish) is valid only while the parent FiscalYear is OPEN; on a
          DRAFT or CLOSED FiscalYear, publish is rejected with
          ERR_INVALID_STATE.
        test_recipe:
          setup:
            - "FY_XED in DRAFT (never opened). RatesSetting created is impossible because publish requires OPEN; instead, create RatesSetting on OPEN FY, then leave FY in DRAFT for a separate FY to demonstrate."
            - "Cleaner: create FY_XED, do NOT open it; attempt to create RatesSetting — but RatesSetting creation requires OPEN per publish precondition. We demonstrate the dependency on the publish side: FY OPEN → RS DRAFT → close FY via settlement finalize → attempt publish on the still-DRAFT RS — rejected."
          setup_api_calls:
            - call: "POST /airport/fiscal_years"
              payload: { year_label: "FY_XED", methodology: "RESIDUAL", airfield_opex_cents: 1000000, terminal_opex_cents: 0, nonairline_airfield_revenue_cents: 0, nonairline_terminal_revenue_cents: 0, terminal_total_space_sqft: 100000, forecast_landed_weight_kg: 1000, prior_year_surplus_cents: 0 }
