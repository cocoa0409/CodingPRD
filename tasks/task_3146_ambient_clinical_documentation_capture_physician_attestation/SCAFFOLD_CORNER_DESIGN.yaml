            - call: "GET /ambient-clinical-documentation/note-drafts/${draft}"
              payload: {}
              as: Physician
              as_user_id: "${phy}"
              captures: { v_attested: "$.data.version" }
          trigger:
            - call: "PATCH /ambient-clinical-documentation/note-drafts/${draft}"
              payload: { expected_note_draft_version: "${v_attested}", field_updates: [{ field_key: "chief_complaint", field_value: "edited post-attestation" }] }
              as: Physician
              as_user_id: "${phy}"
              captures: { err: "$.data.error_id" }
          assert:
            - "err == ERR_NOTE_LOCKED and HTTP status == 409 (OCC version was fresh; the lock is a state rule, not staleness)"
      - name: corner_unconfirmed_suggestions_expire_on_attestation
        claim_type: side_effect_execution
        grounds:
          - state_machines.CodeSuggestion.SUGGESTED_to_EXPIRED
          - errors[ERR_CODE_SUGGESTION_LOCKED]
        distinguishing_aspect: "Attestation expires every unconfirmed suggestion; a later confirm is rejected with ERR_CODE_SUGGESTION_LOCKED."
        test_recipe:
          setup: ["Draft IN_REVIEW (completeness 100) with one SUGGESTED diagnosis"]
          setup_api_calls:
