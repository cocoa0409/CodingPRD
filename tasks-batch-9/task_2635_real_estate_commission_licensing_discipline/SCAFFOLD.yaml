scenario: |
  Generate task harder than expert level!

  2635. Real Estate Commission Licensing & Discipline (state real estate commission): salesperson and broker licensing with education, examination and sponsoring broker affiliation, license transfer, inactive status and reactivation with continuing education requirements, brokerage supervision requirements including trust account maintenance and record retention, complaint intake covering misrepresentation, agency disclosure and commission disputes, trust account audits with shortage detection and immediate remediation orders, formal hearings, consent agreements and license sanctions with recovery fund payouts, team and advertising name approval rules, education provider and instructor approval oversight

domain_name: real-estate-commission-licensing-discipline
api_prefix: "/commission"

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: graph
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate
  difficulty_level: expert_plus
  notes: |
    Licensee is self-referential (supervising_broker_id -> Licensee.id) and carries TWO
    independent state dimensions (license_status x discipline_status). Trust-account
    shortage is a two-basis (BOOK vs BANK) ledger reconciliation over an append-only
    TrustLedgerEntry stream. Consent agreements are a bounded negotiation cycle
    (OFFERED <-> COUNTERED, MAX_CONSENT_ROUNDS). Recovery-fund payouts are a waterfall
    allocation over three simultaneous caps plus a reserve floor, with an assessment fee
    whose input is the very total it constrains (evaluation order pinned in §1.3).
    Segregation of duties is enforced on X-User-ID, not merely on role.

entities:
  - name: Licensee
    parent: null
    common_fields: true
    fields:
      - name: license_number
        type: string
        source: computed
        description: "`SP-` (SALESPERSON) or `BR-` (BROKER) prefix + 6-digit zero-padded per-person_type counter, incremented on each create, first value 000001"
        constraints: "unique; regex ^(SP|BR)-[0-9]{6}$"
      - name: person_type
        type: enum
        source: input
        description: "licence class applied for"
        constraints: "SALESPERSON | BROKER"
      - name: full_name
        type: string
        source: input
        description: "legal name of the applicant"
      - name: prelicense_hours
        type: integer
        source: input
        description: "classroom pre-licence education hours claimed at application"
        constraints: ">= 0"
      - name: license_status
        type: enum
        source: system
        description: "primary lifecycle dimension (see §1.2 Licensee/license_status)"
        default: APPLICANT
        constraints: "APPLICANT | EXAM_PASSED | ACTIVE | INACTIVE | SUSPENDED | EXPIRED | REVOKED | DENIED"
      - name: discipline_status
        type: enum
        source: system
        description: "second, independent lifecycle dimension (see §1.2 Licensee/discipline_status)"
        default: NONE
        constraints: "NONE | UNDER_INVESTIGATION | PENDING_HEARING | SANCTIONED | CLEARED"
      - name: exam_attempt_count
        type: integer
        source: system
        description: "number of licensing exam results recorded"
        default: 0
      - name: exam_best_score
        type: integer
        source: system
        description: "highest exam score recorded so far"
        default: 0
      - name: exam_passed_at
        type: datetime
        source: system
        description: "logical-clock instant of the first passing exam result; null until passed"
        default: null
      - name: sponsoring_brokerage_id
        type: string
        source: system
        description: "FK -> Brokerage.id; set by POST /licensees/{id}/affiliations, null while license_status IN {APPLICANT, EXAM_PASSED, REVOKED, DENIED}"
        default: null
      - name: supervising_broker_id
        type: string
        source: system
        description: "FK -> Licensee.id; self-referential supervising broker inside the sponsoring brokerage, null when unaffiliated"
        default: null
      - name: license_issued_at
        type: datetime
        source: system
        description: "logical-clock instant of the first EXAM_PASSED -> ACTIVE transition"
        default: null
      - name: license_expires_at
        type: datetime
        source: system
        description: "license_issued_at + LICENSE_TERM_DAYS (730); re-stamped on every reactivation"
        default: null
      - name: inactive_since
        type: datetime
        source: system
        description: "logical-clock instant of the most recent ACTIVE -> INACTIVE or ACTIVE -> EXPIRED transition; null while ACTIVE"
        default: null
      - name: ce_period_start_on
        type: string
        source: system
        description: "date (YYYY-MM-DD) opening the current continuing-education accrual window; stamped on issuance and on every reactivation"
        default: null
      - name: ce_hours_valid
        type: integer
        source: computed
        description: "sum of CourseCompletion.credit_hours where licensee_id == this.id AND credit_status == VALID AND course_type IN {CE_CORE, CE_ELECTIVE} AND completed_on >= ce_period_start_on (inclusive); 0 when ce_period_start_on is null"
        default: 0
      - name: ce_hours_required
        type: integer
        source: computed
        description: "see calculations.ce_requirement_hours; 12 while license_status == ACTIVE, escalated by inactive duration while INACTIVE or EXPIRED"
      - name: ce_deficient
        type: boolean
        source: computed
        description: "true when ce_hours_valid < ce_hours_required"
      - name: prior_sanction_count
        type: integer
        source: computed
        description: "count of SanctionOrder where respondent_licensee_id == this.id AND status IN {ISSUED, IN_DEFAULT, SATISFIED} (VACATED excluded)"
        default: 0
      - name: recovery_paid_cents
        type: integer
        source: computed
        description: "sum of RecoveryFundClaim.awarded_cents over claims whose sanction order's respondent_licensee_id == this.id AND claim.status IN {PARTIALLY_PAID, PAID}"
        default: 0
      - name: suspension_ends_at
        type: datetime
        source: system
        description: "effective_at + suspension_days of the SanctionOrder that drove ACTIVE -> SUSPENDED; null otherwise"
        default: null

  - name: Brokerage
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "registered brokerage name"
        constraints: "unique after normalization (see calculations.advertising_name_normalization)"
      - name: designated_broker_id
        type: string
        source: input
        description: "FK -> Licensee.id; the designated broker of record, must have person_type == BROKER"
      - name: status
        type: enum
        source: system
        description: "registration lifecycle (see §1.2 Brokerage)"
        default: PENDING
        constraints: "PENDING | ACTIVE | SUSPENDED | CLOSED"
      - name: trust_account_required
        type: boolean
        source: input
        description: "whether this brokerage must maintain an escrow trust account before activation"
        default: true
      - name: record_retention_years
        type: integer
        source: input
        description: "declared transaction-record retention period"
        default: 5
        constraints: ">= 3 and <= 10"
      - name: supervision_posture
        type: enum
        source: computed
        description: "see calculations.brokerage_supervision_posture; gates affiliation, advertising-name and trust-account operations"
        default: COMPLIANT
        constraints: "COMPLIANT | WATCH | RESTRICTED | FROZEN"
      - name: affiliated_licensee_count
        type: integer
        source: computed
        description: "count of Licensee where sponsoring_brokerage_id == this.id AND license_status == ACTIVE"
        default: 0
      - name: open_shortage_cents
        type: integer
        source: computed
        description: "sum of TrustAccount.shortage_cents over accounts where brokerage_id == this.id AND status IN {OPEN, RESTRICTED}"
        default: 0
      - name: open_complaint_count
        type: integer
        source: computed
        description: "count of Complaint where respondent_brokerage_id == this.id AND status IN {SUBMITTED, INVESTIGATION, AMENDMENT_REQUESTED, PROBABLE_CAUSE, CONSENT_PENDING, HEARING_SCHEDULED}"
        default: 0
      - name: overdue_remediation_count
        type: integer
        source: computed
        description: "count of TrustAudit whose trust account's brokerage_id == this.id AND status == REMEDIATION_ORDERED AND remediation_due_at < logical clock now"
        default: 0
      - name: new_affiliation_blocked
        type: boolean
        source: computed
        description: "true when supervision_posture IN {RESTRICTED, FROZEN}"

  - name: TrustAccount
    parent: Brokerage
    common_fields: true
    fields:
      - name: brokerage_id
        type: string
        source: input
        description: "FK -> Brokerage.id; owning brokerage"
      - name: bank_name
        type: string
        source: input
        description: "depository institution name"
      - name: account_type
        type: enum
        source: input
        description: "escrow money vs tenant security deposits"
        constraints: "ESCROW | SECURITY_DEPOSIT"
      - name: status
        type: enum
        source: system
        description: "see §1.2 TrustAccount"
        default: OPEN
        constraints: "OPEN | RESTRICTED | CLOSED"
      - name: book_obligation_cents
        type: integer
        source: computed
        description: "BOOK-basis obligations: sum(amount_cents WHERE entry_type == OBLIGATION_OPENED) - sum(amount_cents WHERE entry_type == OBLIGATION_RELEASED) over all TrustLedgerEntry rows of this account (no date filter)"
        default: 0
      - name: book_available_cents
        type: integer
        source: computed
        description: "BOOK-basis cash: sum(DEPOSIT) - sum(DISBURSEMENT) + sum(CORRECTION) over all TrustLedgerEntry rows of this account (no date filter); CORRECTION always adds"
        default: 0
      - name: shortage_cents
        type: integer
        source: computed
        description: "max(0, book_obligation_cents - book_available_cents)"
        default: 0
      - name: last_audited_at
        type: datetime
        source: system
        description: "logical-clock instant of the most recent TrustAudit fieldwork on this account"
        default: null

  - name: TrustLedgerEntry
    parent: TrustAccount
    common_fields: false
    fields:
      - name: trust_account_id
        type: string
        source: input
        description: "FK -> TrustAccount.id; owning trust account"
      - name: entry_type
        type: enum
        source: input
        description: "append-only ledger event class"
        constraints: "DEPOSIT | DISBURSEMENT | OBLIGATION_OPENED | OBLIGATION_RELEASED | CORRECTION"
      - name: amount_cents
        type: integer
        source: input
        description: "unsigned magnitude in cents; sign is implied by entry_type"
        constraints: "> 0"
      - name: effective_date
        type: string
        source: input
        description: "book date (YYYY-MM-DD) the entry hits the brokerage ledger"
      - name: cleared_date
        type: string
        source: input
        description: "bank clearing date (YYYY-MM-DD); null means uncleared and therefore excluded from BANK basis"
        default: null
      - name: transaction_reference
        type: string
        source: input
        description: "brokerage transaction reference; a CORRECTION must carry the transaction_reference of the DISBURSEMENT it reverses"
        constraints: "unique per (trust_account_id, entry_type, transaction_reference)"
      - name: memo
        type: string
        source: input
        description: "free-text note"
        default: null

  - name: TrustAudit
    parent: TrustAccount
    common_fields: true
    fields:
      - name: trust_account_id
        type: string
        source: input
        description: "FK -> TrustAccount.id; audited account"
      - name: auditor_user_id
        type: string
        source: input
        description: "opaque X-User-ID of the TrustAuditor who owns this audit; fieldwork and verification are restricted to this exact user id"
      - name: basis
        type: enum
        source: input
        description: "reconciliation basis selected at scheduling; drives calculations.trust_account_shortage variant"
        constraints: "BOOK | BANK"
      - name: as_of_date
        type: string
        source: input
        description: "reconciliation cut-off date (YYYY-MM-DD), inclusive on both bases"
      - name: fieldwork_start_at
        type: datetime
        source: input
        description: "start of the auditor's on-site window (inclusive)"
      - name: fieldwork_end_at
        type: datetime
        source: input
        description: "end of the auditor's on-site window (exclusive)"
      - name: status
        type: enum
        source: system
        description: "see §1.2 TrustAudit"
        default: SCHEDULED
        constraints: "SCHEDULED | FIELDWORK | FINDINGS_ISSUED | REMEDIATION_ORDERED | VERIFYING | ESCALATED | CLOSED"
      - name: bank_statement_balance_cents
        type: integer
        source: system
        description: "bank balance supplied at fieldwork; required on BANK basis, ignored on BOOK basis"
        default: null
      - name: cleared_through_date
        type: string
        source: system
        description: "date (YYYY-MM-DD) supplied at fieldwork; BANK basis counts only entries with cleared_date != null AND cleared_date <= min(as_of_date, cleared_through_date)"
        default: null
      - name: computed_shortage_cents
        type: integer
        source: system
        description: "output of calculations.trust_account_shortage frozen at fieldwork under this audit's basis"
        default: null
      - name: remediation_due_at
        type: datetime
        source: system
        description: "findings instant + REMEDIATION_DAYS (3) x 86400s; re-stamped on every failed verification round"
        default: null
      - name: remediation_round
        type: integer
        source: system
        description: "number of remediation orders issued on this audit (first ISSUE_FINDINGS with shortage > 0 sets 1)"
        default: 0
      - name: verified_shortage_cents
        type: integer
        source: system
        description: "shortage recomputed under this audit's basis at the latest VERIFY_REMEDIATION action"
        default: null

  - name: Complaint
    parent: null
    common_fields: true
    fields:
      - name: case_number
        type: string
        source: computed
        description: "`CMP-` + 6-digit zero-padded global counter, incremented on each create, first value 000001"
        constraints: "unique; regex ^CMP-[0-9]{6}$"
      - name: complainant_name
        type: string
        source: input
        description: "name of the person or entity filing"
      - name: respondent_licensee_id
        type: string
        source: input
        description: "FK -> Licensee.id; the licensee complained of"
      - name: respondent_brokerage_id
        type: string
        source: system
        description: "FK -> Brokerage.id; snapshot of the respondent's sponsoring_brokerage_id at intake, null when the respondent was unaffiliated"
        default: null
      - name: source_audit_id
        type: string
        source: system
        description: "FK -> TrustAudit.id; set only for complaints generated by audit escalation, null for public complaints"
        default: null
      - name: allegation_type
        type: enum
        source: input
        description: "statutory allegation class; drives ALLEGATION_WEIGHT in calculations.complaint_priority_score"
        constraints: "MISREPRESENTATION | AGENCY_DISCLOSURE | COMMISSION_DISPUTE | TRUST_SHORTAGE | ADVERTISING | UNLICENSED_ACTIVITY"
      - name: alleged_loss_cents
        type: integer
        source: input
        description: "monetary loss alleged by the complainant"
        default: 0
        constraints: ">= 0"
      - name: filed_at
        type: datetime
        source: system
        description: "logical-clock instant of intake"
      - name: statute_deadline_at
        type: datetime
        source: system
        description: "filed_at + STATUTE_DAYS (180) x 86400s; PROBABLE_CAUSE is barred at or after this instant"
      - name: status
        type: enum
        source: system
        description: "see §1.2 Complaint"
        default: SUBMITTED
        constraints: "SUBMITTED | INVESTIGATION | AMENDMENT_REQUESTED | PROBABLE_CAUSE | CONSENT_PENDING | HEARING_SCHEDULED | ADJUDICATED | DISMISSED | CLOSED_NO_ACTION"
      - name: screener_user_id
        type: string
        source: system
        description: "opaque X-User-ID of the CommissionCounsel who first dispositioned the complaint out of SUBMITTED"
        default: null
      - name: investigator_user_id
        type: string
        source: system
        description: "opaque X-User-ID recorded when disposition == INVESTIGATE; a Hearing panel chair MUST NOT equal this value"
        default: null
      - name: amendment_count
        type: integer
        source: system
        description: "number of accepted complainant amendments"
        default: 0
      - name: priority_score
        type: integer
        source: computed
        description: "see calculations.complaint_priority_score; INTAKE variant while status == SUBMITTED, INVESTIGATION variant once status != SUBMITTED"
        default: 0

  - name: ConsentAgreement
    parent: Complaint
    common_fields: true
    fields:
      - name: complaint_id
        type: string
        source: input
        description: "FK -> Complaint.id; the case being settled"
      - name: offered_by_user_id
        type: string
        source: system
        description: "opaque X-User-ID of the CommissionCounsel who created the offer; EXECUTE by this same user id is barred (segregation of duties)"
      - name: round_number
        type: integer
        source: system
        description: "negotiation round; 1 at creation, incremented on every REVISE"
        default: 1
      - name: status
        type: enum
        source: system
        description: "see §1.2 ConsentAgreement"
        default: OFFERED
        constraints: "OFFERED | COUNTERED | ACCEPTED | REJECTED | EXECUTED"
      - name: proposed_sanction_type
        type: enum
        source: input
        description: "sanction the commission proposes in the current round"
        constraints: "REPRIMAND | FINE | PROBATION | SUSPENSION | REVOCATION"
      - name: proposed_fine_cents
        type: integer
        source: input
        description: "fine proposed in the current round"
        default: 0
        constraints: ">= 0"
      - name: proposed_suspension_days
        type: integer
        source: input
        description: "suspension proposed in the current round"
        default: 0
        constraints: ">= 0"
      - name: counter_fine_cents
        type: integer
        source: system
        description: "respondent's most recent counter fine; null until a COUNTER is recorded"
        default: null
      - name: counter_suspension_days
        type: integer
        source: system
        description: "respondent's most recent counter suspension; null until a COUNTER is recorded"
        default: null
      - name: responded_by_user_id
        type: string
        source: system
        description: "X-User-ID (a Licensee id) of the respondent who last accepted or countered"
        default: null
      - name: executed_by_user_id
        type: string
        source: system
        description: "opaque X-User-ID of the CommissionCounsel who executed the agreement"
        default: null

  - name: Hearing
    parent: Complaint
    common_fields: true
    fields:
      - name: complaint_id
        type: string
        source: input
        description: "FK -> Complaint.id; the case being heard"
      - name: panel_chair_user_id
        type: string
        source: input
        description: "opaque X-User-ID of the HearingPanelChair presiding; treated as a schedulable resource for overlap purposes"
      - name: hearing_room
        type: string
        source: input
        description: "room identifier; treated as a schedulable resource with a turnover buffer"
      - name: scheduled_start_at
        type: datetime
        source: input
        description: "start of the hearing slot (inclusive)"
      - name: scheduled_end_at
        type: datetime
        source: input
        description: "end of the hearing slot (exclusive)"
      - name: status
        type: enum
        source: system
        description: "see §1.2 Hearing"
        default: SCHEDULED
        constraints: "SCHEDULED | CONVENED | CONTINUED | DECIDED"
      - name: continuance_count
        type: integer
        source: system
        description: "number of continuances granted; capped by MAX_CONTINUANCES (2)"
        default: 0
      - name: convened_at
        type: datetime
        source: system
        description: "logical-clock instant of the CONVENE action"
        default: null
      - name: decided_at
        type: datetime
        source: system
        description: "logical-clock instant of the DECIDE action"
        default: null
      - name: finding
        type: enum
        source: system
        description: "panel finding recorded at DECIDE"
        default: null
        constraints: "VIOLATION_FOUND | NO_VIOLATION"

  - name: SanctionOrder
    parent: Complaint
    common_fields: true
    fields:
      - name: complaint_id
        type: string
        source: system
        description: "FK -> Complaint.id; case that produced the order"
      - name: respondent_licensee_id
        type: string
        source: system
        description: "FK -> Licensee.id; copied from the complaint's respondent_licensee_id"
      - name: consent_agreement_id
        type: string
        source: system
        description: "FK -> ConsentAgreement.id; null when source == HEARING"
        default: null
      - name: hearing_id
        type: string
        source: system
        description: "FK -> Hearing.id; null when source == CONSENT"
        default: null
      - name: source
        type: enum
        source: system
        description: "which channel produced the order"
        constraints: "CONSENT | HEARING"
      - name: sanction_type
        type: enum
        source: system
        description: "for source == CONSENT copied from the executed agreement's proposed_sanction_type; for source == HEARING supplied at DECIDE"
        constraints: "REPRIMAND | FINE | PROBATION | SUSPENSION | REVOCATION"
      - name: fine_cents
        type: integer
        source: system
        description: "ordered fine in cents"
        default: 0
      - name: suspension_days
        type: integer
        source: system
        description: "ordered suspension length in days"
        default: 0
      - name: effective_at
        type: datetime
        source: system
        description: "logical-clock instant the order issued"
      - name: fine_due_at
        type: datetime
        source: system
        description: "effective_at + FINE_DUE_DAYS (30) x 86400s; null when fine_cents == 0"
        default: null
      - name: fine_paid_cents
        type: integer
        source: system
        description: "cumulative fine payments recorded against this order"
        default: 0
      - name: fund_credited_cents
        type: integer
        source: system
        description: "portion of fine_paid_cents credited into the RecoveryFund (100% of every payment; reversed on vacatur)"
        default: 0
      - name: status
        type: enum
        source: system
        description: "see §1.2 SanctionOrder"
        default: ISSUED
        constraints: "ISSUED | SATISFIED | IN_DEFAULT | VACATED"
      - name: vacated_at
        type: datetime
        source: system
        description: "logical-clock instant of vacatur"
        default: null

  - name: RecoveryFund
    parent: null
    common_fields: true
    fields:
      - name: balance_cents
        type: integer
        source: system
        description: "cash on hand; MUST always equal appropriated_cents + fine_credits_cents + clawed_back_cents - awarded_cents - assessment_cents"
        default: 0
      - name: appropriated_cents
        type: integer
        source: system
        description: "cumulative legislative appropriations received"
        default: 0
      - name: fine_credits_cents
        type: integer
        source: system
        description: "cumulative fine payments credited from SanctionOrder fine payments, net of vacatur reversals"
        default: 0
      - name: awarded_cents
        type: integer
        source: system
        description: "cumulative claim awards disbursed"
        default: 0
      - name: assessment_cents
        type: integer
        source: system
        description: "cumulative administrative assessment retained out of disbursements"
        default: 0
      - name: clawed_back_cents
        type: integer
        source: system
        description: "cumulative award clawbacks returned to the fund on vacatur"
        default: 0
    note: "singleton: exactly one row is created by system initialization at server startup with every counter at 0; readable at GET /commission/recovery-fund"

  - name: RecoveryFundClaim
    parent: SanctionOrder
    common_fields: true
    fields:
      - name: sanction_order_id
        type: string
        source: input
        description: "FK -> SanctionOrder.id; the disciplinary order the loss is attributed to"
      - name: claimant_name
        type: string
        source: input
        description: "injured member of the public"
      - name: claimed_loss_cents
        type: integer
        source: input
        description: "unreimbursed loss claimed"
        constraints: "> 0"
      - name: filed_at
        type: datetime
        source: system
        description: "logical-clock instant of filing"
      - name: status
        type: enum
        source: system
        description: "see §1.2 RecoveryFundClaim; FILED is transient and resolved to ELIGIBLE or DENIED inside the same request"
        default: FILED
        constraints: "FILED | ELIGIBLE | DENIED | PARTIALLY_PAID | PAID | CLAWED_BACK"
      - name: awarded_cents
        type: integer
        source: system
        description: "cumulative amount disbursed on this claim"
        default: 0
      - name: denial_reason
        type: enum
        source: system
        description: "populated only when status == DENIED"
        default: null
        constraints: "WINDOW_CLOSED | ORDER_NOT_DISCIPLINARY | ORDER_VACATED"
      - name: paid_at
        type: datetime
        source: system
        description: "logical-clock instant of the disbursement that first moved the claim out of ELIGIBLE"
        default: null

  - name: EducationProvider
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "approved education provider name"
        constraints: "unique"
      - name: admin_user_id
        type: string
        source: input
        description: "X-User-ID of the single ProviderAdmin who owns this provider's rows; when null the provider has no ProviderAdmin owner and only a LicensingAnalyst may write against it (see §1.4 priority 6)"
        default: null
      - name: status
        type: enum
        source: system
        description: "see §1.2 EducationProvider"
        default: PENDING
        constraints: "PENDING | APPROVED | PROBATION | SUSPENDED"
      - name: approved_at
        type: datetime
        source: system
        description: "logical-clock instant of the latest approval"
        default: null
      - name: approval_expires_at
        type: datetime
        source: system
        description: "approved_at + approval_years (POST /education-providers/{id}/approval payload, default 2) x 365 x 86400s"
        default: null
      - name: suspended_instructor_count
        type: integer
        source: computed
        description: "count of Instructor where education_provider_id == this.id AND status == SUSPENDED"
        default: 0
      - name: invalidated_credit_hours
        type: integer
        source: computed
        description: "sum of CourseCompletion.credit_hours where education_provider_id == this.id AND credit_status == INVALIDATED"
        default: 0

  - name: Instructor
    parent: EducationProvider
    common_fields: true
    fields:
      - name: education_provider_id
        type: string
        source: input
        description: "FK -> EducationProvider.id; employing provider"
      - name: licensee_id
        type: string
        source: input
        description: "FK -> Licensee.id; the instructor's own real-estate licence, null for non-licensee instructors"
        default: null
      - name: full_name
        type: string
        source: input
        description: "instructor legal name"
      - name: credential_type
        type: enum
        source: input
        description: "basis of teaching credential; LICENSED_BROKER requires licensee_id with person_type == BROKER and license_status == ACTIVE"
        constraints: "ATTORNEY | LICENSED_BROKER | SUBJECT_EXPERT"
      - name: status
        type: enum
        source: system
        description: "see §1.2 Instructor"
        default: PENDING
        constraints: "PENDING | APPROVED | SUSPENDED"
      - name: approved_at
        type: datetime
        source: system
        description: "logical-clock instant of approval"
        default: null
      - name: suspended_reason
        type: enum
        source: system
        description: "populated only when status == SUSPENDED"
        default: null
        constraints: "LICENSE_REVOKED | LICENSE_SUSPENDED"

  - name: CourseCompletion
    parent: null
    common_fields: false
    fields:
      - name: licensee_id
        type: string
        source: input
        description: "FK -> Licensee.id; student"
      - name: instructor_id
        type: string
        source: input
        description: "FK -> Instructor.id; instructor of record"
      - name: education_provider_id
        type: string
        source: input
        description: "FK -> EducationProvider.id; must equal the instructor's education_provider_id"
      - name: course_type
        type: enum
        source: input
        description: "credit class; only CE_CORE and CE_ELECTIVE count toward Licensee.ce_hours_valid"
        constraints: "PRELICENSE | POST_LICENSE | CE_CORE | CE_ELECTIVE"
      - name: credit_hours
        type: integer
        source: input
        description: "credit hours awarded"
        constraints: ">= 1 and <= 12"
      - name: completed_on
        type: string
        source: input
        description: "completion date (YYYY-MM-DD)"
      - name: credit_status
        type: enum
        source: system
        description: "VALID until invalidated by an instructor-suspension cascade"
        default: VALID
        constraints: "VALID | INVALIDATED"
      - name: invalidated_at
        type: datetime
        source: system
        description: "logical-clock instant of invalidation"
        default: null

  - name: AdvertisingName
    parent: Brokerage
    common_fields: true
    fields:
      - name: brokerage_id
        type: string
        source: input
        description: "FK -> Brokerage.id; brokerage the name is registered under"
      - name: team_lead_licensee_id
        type: string
        source: input
        description: "FK -> Licensee.id; required when kind == TEAM, MUST be null otherwise"
        default: null
      - name: kind
        type: enum
        source: input
        description: "registration class"
        constraints: "TEAM | DBA | BRANCH"
      - name: name_text
        type: string
        source: input
        description: "name exactly as it will appear in advertising"
      - name: normalized_name
        type: string
        source: computed
        description: "see calculations.advertising_name_normalization; uppercase, non-alphanumeric characters removed"
      - name: prohibited_term_hits
        type: integer
        source: computed
        description: "count of distinct PROHIBITED_TERMS appearing as substrings of normalized_name"
        default: 0
      - name: status
        type: enum
        source: system
        description: "see §1.2 AdvertisingName"
        default: SUBMITTED
        constraints: "SUBMITTED | APPROVED | REJECTED | REVOKED"
      - name: reviewed_by_user_id
        type: string
        source: system
        description: "opaque X-User-ID of the LicensingAnalyst who reviewed"
        default: null
      - name: rejection_reason
        type: enum
        source: system
        description: "populated when status IN {REJECTED, REVOKED}"
        default: null
        constraints: "PROHIBITED_TERM | NAME_TAKEN | TEAM_LEAD_INELIGIBLE | POSTURE_RESTRICTED | IMPLIES_BROKERAGE"

state_machines:
  - entity: Licensee
    state_field: license_status
    initial_state: APPLICANT
    terminal_states: [REVOKED, DENIED]
    transitions:
      - from: APPLICANT
        to: EXAM_PASSED
        trigger: "POST /commission/licensees/{id}/exam-results with score >= EXAM_PASS_SCORE (75)"
        actor: LicensingAnalyst
        preconditions:
          - "license_status == APPLICANT"
          - "exam_attempt_count < MAX_EXAM_ATTEMPTS (3)"
          - "prelicense_hours >= PRELICENSE_HOURS[person_type] (SALESPERSON 90, BROKER 180)"
        side_effects:
          - "exam_attempt_count += 1"
          - "exam_best_score = max(exam_best_score, score)"
          - "exam_passed_at = clock now"
      - from: APPLICANT
        to: APPLICANT
        trigger: "POST /commission/licensees/{id}/exam-results with score < 75 and exam_attempt_count < 2 before the call"
        actor: LicensingAnalyst
        preconditions:
          - "license_status == APPLICANT"
          - "exam_attempt_count < MAX_EXAM_ATTEMPTS (3)"
        side_effects:
          - "exam_attempt_count += 1"
          - "exam_best_score = max(exam_best_score, score)"
        note: "self-transition; the third failing result instead lands on DENIED"
      - from: APPLICANT
        to: DENIED
        trigger: "POST /commission/licensees/{id}/exam-results with score < 75 when exam_attempt_count == 2 before the call (i.e. this is attempt 3)"
        actor: LicensingAnalyst
        preconditions:
          - "license_status == APPLICANT"
        side_effects:
          - "exam_attempt_count = 3"
          - "exam_best_score = max(exam_best_score, score)"
      - from: EXAM_PASSED
        to: ACTIVE
        trigger: "POST /commission/licensees/{id}/affiliations (initial issuance)"
        actor: LicensingAnalyst
        preconditions:
          - "license_status == EXAM_PASSED"
          - "target Brokerage.status == ACTIVE"
          - "target Brokerage.supervision_posture NOT IN {RESTRICTED, FROZEN}"
          - "target Brokerage.affiliated_licensee_count < SUPERVISION_RATIO_MAX (25)"
          - "supervising_broker.license_status == ACTIVE AND supervising_broker.person_type == BROKER AND supervising_broker.sponsoring_brokerage_id == target brokerage id. SELF-SUPERVISION BOOTSTRAP EXEMPTION: when supervising_broker_id == the licensee being affiliated AND that licensee == target Brokerage.designated_broker_id, the ACTIVE and same-brokerage clauses are waived (person_type MUST still be BROKER) - this is the only path that seats the first broker in an empty brokerage"
          - "expected_brokerage_version == target Brokerage.version"
        side_effects:
          - "sponsoring_brokerage_id = target brokerage id; supervising_broker_id = supplied broker id"
          - "license_issued_at = clock now; license_expires_at = clock now + 730 days"
          - "ce_period_start_on = date(clock now)"
          - "increments Brokerage.version by 1; recomputes Brokerage.affiliated_licensee_count and supervision_posture"
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /commission/licensees/{id}/affiliations (license transfer to a different brokerage)"
        actor: LicensingAnalyst
        preconditions:
          - "license_status == ACTIVE"
          - "supplied brokerage_id != current sponsoring_brokerage_id"
          - "ce_deficient == false"
          - "discipline_status NOT IN {PENDING_HEARING, SANCTIONED}"
          - "target Brokerage.status == ACTIVE AND supervision_posture NOT IN {RESTRICTED, FROZEN}"
          - "target Brokerage.affiliated_licensee_count < SUPERVISION_RATIO_MAX (25)"
          - "expected_brokerage_version == target Brokerage.version"
        side_effects:
          - "sponsoring_brokerage_id and supervising_broker_id repointed to the target brokerage"
          - "every AdvertisingName with kind == TEAM AND team_lead_licensee_id == this licensee AND status == APPROVED -> REVOKED with rejection_reason TEAM_LEAD_INELIGIBLE"
          - "increments target Brokerage.version by 1; recomputes affiliated_licensee_count and supervision_posture on BOTH the prior and the target brokerage"
        note: "cyclic self-transition; the prior brokerage's counters must be recomputed too"
      - from: ACTIVE
        to: INACTIVE
        trigger: "POST /commission/licensees/{id}/status-changes with action == GO_INACTIVE"
        actor: Salesperson | Broker | LicensingAnalyst
        preconditions:
          - "license_status == ACTIVE"
          - "discipline_status NOT IN {PENDING_HEARING}"
          - "if person_type == BROKER: this licensee is not the designated_broker_id of any Brokerage with status == ACTIVE"
        side_effects:
          - "inactive_since = clock now; sponsoring_brokerage_id = null; supervising_broker_id = null"
          - "every Licensee whose supervising_broker_id == this licensee -> supervising_broker_id = the sponsoring brokerage's designated_broker_id"
          - "recomputes the prior Brokerage.affiliated_licensee_count and supervision_posture"
      - from: INACTIVE
        to: ACTIVE
        trigger: "POST /commission/licensees/{id}/status-changes with action == REACTIVATE"
        actor: Salesperson | Broker | LicensingAnalyst
        preconditions:
          - "license_status IN {INACTIVE, EXPIRED}"
          - "ce_hours_valid >= ce_hours_required (calculations.ce_requirement_hours)"
          - "reinstatement_fee_paid_cents == calculations.reactivation_fee_assessment exactly"
          - "target Brokerage.status == ACTIVE AND supervision_posture NOT IN {RESTRICTED, FROZEN}"
          - "target Brokerage.affiliated_licensee_count < SUPERVISION_RATIO_MAX (25)"
        side_effects:
          - "sponsoring_brokerage_id / supervising_broker_id set from the payload; inactive_since = null"
          - "license_expires_at = clock now + 730 days; ce_period_start_on = date(clock now)"
          - "recomputes target Brokerage.affiliated_licensee_count and supervision_posture"
        note: "cycle ACTIVE -> INACTIVE -> ACTIVE; every reactivation resets the CE accrual window"
      - from: EXPIRED
        to: ACTIVE
        trigger: "POST /commission/licensees/{id}/status-changes with action == REACTIVATE"
        actor: Salesperson | Broker | LicensingAnalyst
        preconditions:
          - "license_status == EXPIRED"
          - "ce_hours_valid >= ce_hours_required"
          - "reinstatement_fee_paid_cents == calculations.reactivation_fee_assessment exactly"
          - "target Brokerage.status == ACTIVE AND supervision_posture NOT IN {RESTRICTED, FROZEN}"
        side_effects:
          - "same as INACTIVE -> ACTIVE"
      - from: ACTIVE
        to: EXPIRED
        trigger: "POST /commission/compliance-sweeps step 1 (system) when license_expires_at <= clock now"
        actor: system
        preconditions:
          - "license_status == ACTIVE"
          - "license_expires_at <= clock now"
        side_effects:
          - "inactive_since = clock now; sponsoring_brokerage_id = null; supervising_broker_id = null"
          - "recomputes the prior Brokerage.affiliated_licensee_count and supervision_posture (a designated broker expiring drives that brokerage to FROZEN)"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system, caused by a SanctionOrder reaching ISSUED with sanction_type == SUSPENSION"
        actor: system
        preconditions:
          - "license_status == ACTIVE"
        side_effects:
          - "suspension_ends_at = order.effective_at + order.suspension_days x 86400s"
          - "sponsoring_brokerage_id retained; recomputes Brokerage.supervision_posture (designated broker suspended -> FROZEN)"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /commission/compliance-sweeps step 4 (system) when suspension_ends_at <= clock now AND the driving SanctionOrder.status == SATISFIED"
        actor: system
        preconditions:
          - "license_status == SUSPENDED"
          - "suspension_ends_at <= clock now"
          - "the SanctionOrder that drove the suspension has status == SATISFIED"
        side_effects:
          - "suspension_ends_at = null; recomputes Brokerage.supervision_posture"
        note: "cycle ACTIVE -> SUSPENDED -> ACTIVE; an unpaid fine keeps the licensee SUSPENDED indefinitely"
      - from: ACTIVE
        to: REVOKED
        trigger: "system, caused by a SanctionOrder reaching ISSUED with sanction_type == REVOCATION"
        actor: system
        preconditions:
          - "license_status IN {ACTIVE, INACTIVE, SUSPENDED, EXPIRED}"
        side_effects:
          - "sponsoring_brokerage_id = null; supervising_broker_id = null; suspension_ends_at = null"
          - "CASCADE L3: every Instructor with licensee_id == this licensee AND status IN {PENDING, APPROVED} -> SUSPENDED with suspended_reason LICENSE_REVOKED"
          - "CASCADE L4 (caused by L3): for each newly SUSPENDED instructor, every CourseCompletion with instructor_id == that instructor AND credit_status == VALID AND completed_on >= date(clock now) - INVALIDATION_LOOKBACK_DAYS (365) -> credit_status INVALIDATED, invalidated_at = clock now"
          - "CASCADE L5 (caused by L4): every student Licensee referenced by an invalidated CourseCompletion has ce_hours_valid and ce_deficient recomputed"
          - "sibling of L3: every EducationProvider with status == APPROVED that now has suspended_instructor_count >= 1 -> PROBATION"
          - "recomputes the prior Brokerage.affiliated_licensee_count and supervision_posture"
      - from: INACTIVE
        to: REVOKED
        trigger: "system, caused by a SanctionOrder reaching ISSUED with sanction_type == REVOCATION"
        actor: system
        preconditions:
          - "license_status == INACTIVE"
        side_effects:
          - "same cascade chain L3 -> L4 -> L5 as ACTIVE -> REVOKED"

  - entity: Licensee
    state_field: discipline_status
    initial_state: NONE
    terminal_states: []
    transitions:
      - from: NONE
        to: UNDER_INVESTIGATION
        trigger: "system, caused by a Complaint reaching INVESTIGATION (public screening or audit escalation)"
        actor: system
        preconditions:
          - "discipline_status IN {NONE, CLEARED}"
        side_effects:
          - "recomputes sponsoring Brokerage.supervision_posture (respondent who is a designated broker drives RESTRICTED)"
      - from: CLEARED
        to: UNDER_INVESTIGATION
        trigger: "system, caused by a later Complaint reaching INVESTIGATION"
        actor: system
        preconditions:
          - "discipline_status == CLEARED"
        side_effects:
          - "recomputes sponsoring Brokerage.supervision_posture"
        note: "cycle NONE/CLEARED -> UNDER_INVESTIGATION -> CLEARED -> UNDER_INVESTIGATION; this dimension evolves independently of license_status"
      - from: UNDER_INVESTIGATION
        to: PENDING_HEARING
        trigger: "system, caused by a Complaint reaching HEARING_SCHEDULED"
        actor: system
        preconditions:
          - "discipline_status == UNDER_INVESTIGATION"
        side_effects:
          - "licensee is barred from license transfer while PENDING_HEARING"
      - from: UNDER_INVESTIGATION
        to: SANCTIONED
        trigger: "system, caused by a SanctionOrder reaching ISSUED (consent channel)"
        actor: system
        preconditions:
          - "discipline_status IN {UNDER_INVESTIGATION, PENDING_HEARING}"
        side_effects:
          - "recomputes sponsoring Brokerage.supervision_posture"
      - from: PENDING_HEARING
        to: SANCTIONED
        trigger: "system, caused by a SanctionOrder reaching ISSUED (hearing channel)"
        actor: system
        preconditions:
          - "discipline_status == PENDING_HEARING"
        side_effects:
          - "recomputes sponsoring Brokerage.supervision_posture"
      - from: UNDER_INVESTIGATION
        to: CLEARED
        trigger: "system, caused by a Complaint reaching DISMISSED or CLOSED_NO_ACTION"
        actor: system
        preconditions:
          - "discipline_status == UNDER_INVESTIGATION"
          - "count of other Complaint rows with respondent_licensee_id == this licensee AND status IN {SUBMITTED, INVESTIGATION, AMENDMENT_REQUESTED, PROBABLE_CAUSE, CONSENT_PENDING, HEARING_SCHEDULED} == 0"
        side_effects:
          - "recomputes sponsoring Brokerage.supervision_posture"
      - from: SANCTIONED
        to: CLEARED
        trigger: "system, caused by the last non-VACATED SanctionOrder against this licensee reaching VACATED"
        actor: system
        preconditions:
          - "discipline_status == SANCTIONED"
          - "count of SanctionOrder with respondent_licensee_id == this licensee AND status IN {ISSUED, IN_DEFAULT, SATISFIED} == 0"
        side_effects:
          - "recomputes sponsoring Brokerage.supervision_posture"

  - entity: Brokerage
    state_field: status
    initial_state: PENDING
    terminal_states: [CLOSED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /commission/brokerages/{id}/activation"
        actor: LicensingAnalyst
        preconditions:
          - "status == PENDING"
          - "designated broker license_status == ACTIVE OR (license_status == EXAM_PASSED AND person_type == BROKER)"
          - "if trust_account_required == true: at least one TrustAccount with brokerage_id == this.id AND account_type == ESCROW AND status == OPEN exists"
        side_effects:
          - "activation does NOT issue the designated broker: the EXAM_PASSED broker still becomes ACTIVE only through POST /commission/licensees/{id}/affiliations with supervising_broker_id == their own id (the self-supervision bootstrap of validations priority 22), which is also what increments affiliated_licensee_count"
          - "recomputes supervision_posture"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system, caused by a SanctionOrder reaching ISSUED with sanction_type IN {SUSPENSION, REVOCATION} against this brokerage's designated broker"
        actor: system
        preconditions:
          - "status == ACTIVE"
        side_effects:
          - "supervision_posture -> FROZEN"
          - "every AdvertisingName with brokerage_id == this.id AND status == SUBMITTED -> REJECTED with rejection_reason POSTURE_RESTRICTED"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /commission/brokerages/{id}/activation (re-activation after the designated broker is restored)"
        actor: LicensingAnalyst
        preconditions:
          - "status == SUSPENDED"
          - "designated broker license_status == ACTIVE"
          - "open_shortage_cents == 0"
        side_effects:
          - "recomputes supervision_posture"
        note: "cycle ACTIVE -> SUSPENDED -> ACTIVE"
      - from: SUSPENDED
        to: CLOSED
        trigger: "system, caused by the designated broker reaching license_status == REVOKED while affiliated_licensee_count == 0"
        actor: system
        preconditions:
          - "status == SUSPENDED"
          - "affiliated_licensee_count == 0"
        side_effects:
          - "every TrustAccount with brokerage_id == this.id AND shortage_cents == 0 -> CLOSED"
        note: "ORDER IS NORMATIVE: a REVOCATION order against the designated broker drives ACTIVE -> SUSPENDED first (posture FROZEN, SUBMITTED advertising names rejected) and only then, in the same request and only when affiliated_licensee_count == 0, SUSPENDED -> CLOSED. A brokerage that still has affiliates therefore stops at SUSPENDED."

  - entity: TrustAccount
    state_field: status
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: RESTRICTED
        trigger: "system, CASCADE L2 caused by a TrustAudit on this account reaching REMEDIATION_ORDERED"
        actor: system
        preconditions:
          - "status == OPEN"
        side_effects:
          - "DISBURSEMENT ledger entries are barred; DEPOSIT, CORRECTION, OBLIGATION_OPENED and OBLIGATION_RELEASED still append normally"
          - "CASCADE L3 (caused by L2): owning Brokerage.open_shortage_cents and supervision_posture recomputed"
      - from: RESTRICTED
        to: OPEN
        trigger: "system, caused by a TrustAudit on this account reaching CLOSED with verified_shortage_cents == 0 while no other audit on the account is in REMEDIATION_ORDERED or ESCALATED"
        actor: system
        preconditions:
          - "status == RESTRICTED"
          - "shortage_cents == 0"
        side_effects:
          - "owning Brokerage.open_shortage_cents and supervision_posture recomputed"
        note: "cycle OPEN -> RESTRICTED -> OPEN"
      - from: OPEN
        to: CLOSED
        trigger: "system, caused by the owning Brokerage reaching CLOSED while shortage_cents == 0"
        actor: system
        preconditions:
          - "status == OPEN"
          - "shortage_cents == 0"
        side_effects:
          - "no further ledger entries are accepted"

  - entity: TrustAudit
    state_field: status
    initial_state: SCHEDULED
    terminal_states: [CLOSED]
    transitions:
      - from: SCHEDULED
        to: FIELDWORK
        trigger: "POST /commission/trust-audits/{id}/fieldwork"
        actor: TrustAuditor
        preconditions:
          - "status == SCHEDULED"
          - "X-User-ID == auditor_user_id"
          - "clock now >= fieldwork_start_at"
          - "if basis == BANK: bank_statement_balance_cents and cleared_through_date are both supplied"
        side_effects:
          - "computed_shortage_cents = calculations.trust_account_shortage under this audit's basis"
          - "bank_statement_balance_cents / cleared_through_date persisted"
          - "TrustAccount.last_audited_at = clock now"
      - from: FIELDWORK
        to: FINDINGS_ISSUED
        trigger: "POST /commission/trust-audits/{id}/disposition with action == ISSUE_FINDINGS"
        actor: TrustAuditor
        preconditions:
          - "status == FIELDWORK"
          - "X-User-ID == auditor_user_id"
          - "computed_shortage_cents != null"
        side_effects:
          - "CASCADE L1a: when computed_shortage_cents > 0 the audit immediately continues to REMEDIATION_ORDERED inside the same request"
          - "when computed_shortage_cents == 0 the audit immediately continues to CLOSED inside the same request (verified_shortage_cents = 0, no remediation order, no posture change)"
      - from: FINDINGS_ISSUED
        to: REMEDIATION_ORDERED
        trigger: "system, CASCADE L1b caused by ISSUE_FINDINGS with computed_shortage_cents > 0"
        actor: system
        preconditions:
          - "status == FINDINGS_ISSUED"
          - "computed_shortage_cents > 0"
        side_effects:
          - "remediation_round = 1; remediation_due_at = clock now + REMEDIATION_DAYS (3) x 86400s"
          - "CASCADE L2 (caused by this transition): TrustAccount OPEN -> RESTRICTED"
          - "CASCADE L3 (caused by L2): Brokerage.open_shortage_cents recomputed and supervision_posture recomputed (RESTRICTED when open_shortage_cents >= 100000, otherwise WATCH)"
          - "CASCADE L4 (caused by L3, only when the posture landed on RESTRICTED or FROZEN): every AdvertisingName with brokerage_id == that brokerage AND status == SUBMITTED -> REJECTED with rejection_reason POSTURE_RESTRICTED"
      - from: FINDINGS_ISSUED
        to: CLOSED
        trigger: "system, caused by ISSUE_FINDINGS with computed_shortage_cents == 0"
        actor: system
        preconditions:
          - "status == FINDINGS_ISSUED"
          - "computed_shortage_cents == 0"
        side_effects:
          - "verified_shortage_cents = 0; remediation_round stays 0; remediation_due_at stays null"
      - from: REMEDIATION_ORDERED
        to: VERIFYING
        trigger: "POST /commission/trust-audits/{id}/disposition with action == VERIFY_REMEDIATION"
        actor: TrustAuditor
        preconditions:
          - "status == REMEDIATION_ORDERED"
          - "X-User-ID == auditor_user_id (the same auditor must verify their own remediation order)"
        side_effects:
          - "verified_shortage_cents = calculations.trust_account_shortage recomputed under this audit's basis at the current clock"
          - "the audit immediately continues to CLOSED when verified_shortage_cents == 0, or back to REMEDIATION_ORDERED when verified_shortage_cents > 0, inside the same request"
      - from: VERIFYING
        to: CLOSED
        trigger: "system, caused by VERIFY_REMEDIATION with verified_shortage_cents == 0"
        actor: system
        preconditions:
          - "status == VERIFYING"
          - "verified_shortage_cents == 0"
        side_effects:
          - "TrustAccount RESTRICTED -> OPEN when shortage_cents == 0 and no other audit on the account is REMEDIATION_ORDERED or ESCALATED"
          - "Brokerage.open_shortage_cents and supervision_posture recomputed"
      - from: VERIFYING
        to: REMEDIATION_ORDERED
        trigger: "system, caused by VERIFY_REMEDIATION with verified_shortage_cents > 0"
        actor: system
        preconditions:
          - "status == VERIFYING"
          - "verified_shortage_cents > 0"
        side_effects:
          - "remediation_round += 1; remediation_due_at = clock now + REMEDIATION_DAYS (3) x 86400s"
        note: "cycle REMEDIATION_ORDERED -> VERIFYING -> REMEDIATION_ORDERED; each failed verification re-arms the 3-day clock"
      - from: REMEDIATION_ORDERED
        to: ESCALATED
        trigger: "POST /commission/trust-audits/{id}/disposition with action == ESCALATE, or POST /commission/compliance-sweeps step 2 when remediation_due_at < clock now"
        actor: TrustAuditor | system
        preconditions:
          - "status == REMEDIATION_ORDERED"
          - "for the manual action: X-User-ID == auditor_user_id AND remediation_round >= 2"
        side_effects:
          - "CASCADE L2 (caused by this transition): a Complaint is created with allegation_type TRUST_SHORTAGE, status INVESTIGATION, source_audit_id = this audit, respondent_licensee_id = the owning brokerage's designated_broker_id, respondent_brokerage_id = the owning brokerage, alleged_loss_cents = verified_shortage_cents OR computed_shortage_cents when verification never ran, investigator_user_id = auditor_user_id (or 'SYSTEM_SWEEP' when raised by the sweep), filed_at = clock now"
          - "CASCADE L3 (caused by L2): the respondent Licensee.discipline_status NONE|CLEARED -> UNDER_INVESTIGATION"
          - "CASCADE L4 (caused by L3): Brokerage.supervision_posture recomputed - the designated broker now being UNDER_INVESTIGATION pins the posture at RESTRICTED even after the audit stops counting as an overdue remediation"
      - from: ESCALATED
        to: CLOSED
        trigger: "POST /commission/trust-audits/{id}/disposition with action == CLOSE"
        actor: TrustAuditor
        preconditions:
          - "status == ESCALATED"
          - "X-User-ID == auditor_user_id"
          - "the escalated Complaint has status IN {ADJUDICATED, DISMISSED, CLOSED_NO_ACTION}"
        side_effects:
          - "verified_shortage_cents = calculations.trust_account_shortage recomputed under this audit's basis"
          - "TrustAccount RESTRICTED -> OPEN when shortage_cents == 0"
          - "Brokerage.supervision_posture recomputed"

  - entity: Complaint
    state_field: status
    initial_state: SUBMITTED
    terminal_states: [ADJUDICATED, DISMISSED, CLOSED_NO_ACTION]
    transitions:
      - from: SUBMITTED
        to: INVESTIGATION
        trigger: "POST /commission/complaints/{id}/disposition with disposition == INVESTIGATE"
        actor: CommissionCounsel
        preconditions:
          - "status == SUBMITTED"
          - "respondent Licensee.license_status != DENIED"
        side_effects:
          - "screener_user_id = X-User-ID; investigator_user_id = X-User-ID"
          - "priority_score switches to the INVESTIGATION variant"
          - "respondent Licensee.discipline_status NONE|CLEARED -> UNDER_INVESTIGATION"
          - "sponsoring Brokerage.open_complaint_count and supervision_posture recomputed"
      - from: SUBMITTED
        to: DISMISSED
        trigger: "POST /commission/complaints/{id}/disposition with disposition == DISMISS"
        actor: CommissionCounsel
        preconditions:
          - "status == SUBMITTED"
        side_effects:
          - "screener_user_id = X-User-ID"
          - "respondent Licensee.discipline_status UNDER_INVESTIGATION -> CLEARED when no other open complaint remains"
          - "sponsoring Brokerage.open_complaint_count and supervision_posture recomputed"
      - from: INVESTIGATION
        to: AMENDMENT_REQUESTED
        trigger: "POST /commission/complaints/{id}/disposition with disposition == REQUEST_AMENDMENT"
        actor: CommissionCounsel
        preconditions:
          - "status == INVESTIGATION"
          - "amendment_count < MAX_AMENDMENTS (2)"
        side_effects:
          - "investigation is paused; PROBABLE_CAUSE is unreachable until the complainant amends"
      - from: AMENDMENT_REQUESTED
        to: INVESTIGATION
        trigger: "POST /commission/complaints/{id}/amendments"
        actor: Public
        preconditions:
          - "status == AMENDMENT_REQUESTED"
          - "clock now < statute_deadline_at"
        side_effects:
          - "amendment_count += 1; alleged_loss_cents replaced by the amended value"
          - "priority_score recomputed under the INVESTIGATION variant"
        note: "cycle INVESTIGATION -> AMENDMENT_REQUESTED -> INVESTIGATION, at most MAX_AMENDMENTS (2) round trips"
      - from: INVESTIGATION
        to: PROBABLE_CAUSE
        trigger: "POST /commission/complaints/{id}/disposition with disposition == PROBABLE_CAUSE"
        actor: CommissionCounsel
        preconditions:
          - "status == INVESTIGATION"
          - "clock now < statute_deadline_at"
          - "priority_score >= PROBABLE_CAUSE_MIN_SCORE (40)"
        side_effects:
          - "the case becomes eligible for a consent offer or a hearing"
      - from: INVESTIGATION
        to: CLOSED_NO_ACTION
        trigger: "POST /commission/complaints/{id}/disposition with disposition == CLOSE_NO_ACTION"
        actor: CommissionCounsel
        preconditions:
          - "status == INVESTIGATION"
        side_effects:
          - "respondent Licensee.discipline_status UNDER_INVESTIGATION -> CLEARED when no other open complaint remains"
          - "sponsoring Brokerage.open_complaint_count and supervision_posture recomputed"
      - from: PROBABLE_CAUSE
        to: CONSENT_PENDING
        trigger: "POST /commission/complaints/{id}/consent-agreements"
        actor: CommissionCounsel
        preconditions:
          - "status == PROBABLE_CAUSE"
          - "no ConsentAgreement for this complaint with status IN {OFFERED, COUNTERED, ACCEPTED}"
        side_effects:
          - "a ConsentAgreement is created in OFFERED with round_number 1"
      - from: CONSENT_PENDING
        to: PROBABLE_CAUSE
        trigger: "system, caused by the complaint's ConsentAgreement reaching REJECTED"
        actor: system
        preconditions:
          - "status == CONSENT_PENDING"
        side_effects:
          - "the case returns to the hearing track; a new consent offer is permitted"
        note: "cycle PROBABLE_CAUSE -> CONSENT_PENDING -> PROBABLE_CAUSE"
      - from: CONSENT_PENDING
        to: ADJUDICATED
        trigger: "system, caused by the complaint's ConsentAgreement reaching EXECUTED"
        actor: system
        preconditions:
          - "status == CONSENT_PENDING"
        side_effects:
          - "a SanctionOrder is created with source CONSENT in status ISSUED"
          - "respondent Licensee.discipline_status -> SANCTIONED"
      - from: PROBABLE_CAUSE
        to: HEARING_SCHEDULED
        trigger: "POST /commission/complaints/{id}/hearings"
        actor: CommissionCounsel
        preconditions:
          - "status == PROBABLE_CAUSE"
          - "no ConsentAgreement for this complaint with status IN {OFFERED, COUNTERED, ACCEPTED}"
          - "no Hearing for this complaint with status IN {SCHEDULED, CONVENED, CONTINUED}"
        side_effects:
          - "a Hearing is created in SCHEDULED"
          - "respondent Licensee.discipline_status UNDER_INVESTIGATION -> PENDING_HEARING"
      - from: HEARING_SCHEDULED
        to: ADJUDICATED
        trigger: "system, caused by the complaint's Hearing reaching DECIDED with finding == VIOLATION_FOUND"
        actor: system
        preconditions:
          - "status == HEARING_SCHEDULED"
        side_effects:
          - "CASCADE L1: a SanctionOrder is created with source HEARING in status ISSUED"
          - "respondent Licensee.discipline_status PENDING_HEARING -> SANCTIONED"
      - from: HEARING_SCHEDULED
        to: CLOSED_NO_ACTION
        trigger: "system, caused by the complaint's Hearing reaching DECIDED with finding == NO_VIOLATION"
        actor: system
        preconditions:
          - "status == HEARING_SCHEDULED"
        side_effects:
          - "no SanctionOrder is created"
          - "respondent Licensee.discipline_status PENDING_HEARING -> CLEARED when no other open complaint remains"

  - entity: ConsentAgreement
    state_field: status
    initial_state: OFFERED
    terminal_states: [EXECUTED, REJECTED]
    transitions:
      - from: OFFERED
        to: COUNTERED
        trigger: "POST /commission/consent-agreements/{id}/respondent-response with action == COUNTER"
        actor: Respondent
        preconditions:
          - "status == OFFERED"
          - "X-User-ID == the complaint's respondent_licensee_id"
          - "round_number <= MAX_CONSENT_ROUNDS (3), which the REVISE guard already guarantees"
        side_effects:
          - "counter_fine_cents / counter_suspension_days recorded; responded_by_user_id = X-User-ID"
          - "no auto-termination: a counter at round_number == MAX_CONSENT_ROUNDS (3) still lands in COUNTERED, and the round cap is felt only when counsel next attempts a REVISE (validations priority 32 -> ERR_CONSENT_ROUND_LIMIT), leaving WITHDRAW as counsel's only remaining move"
      - from: COUNTERED
        to: OFFERED
        trigger: "POST /commission/consent-agreements/{id}/commission-action with action == REVISE"
        actor: CommissionCounsel
        preconditions:
          - "status == COUNTERED"
          - "round_number < MAX_CONSENT_ROUNDS (3)"
        side_effects:
          - "round_number += 1; proposed_sanction_type / proposed_fine_cents / proposed_suspension_days replaced by the revised values"
          - "counter_fine_cents and counter_suspension_days reset to null"
        note: "cycle OFFERED -> COUNTERED -> OFFERED, bounded by MAX_CONSENT_ROUNDS"
      - from: COUNTERED
        to: REJECTED
        trigger: "POST /commission/consent-agreements/{id}/commission-action with action == WITHDRAW"
        actor: CommissionCounsel
        preconditions:
          - "status == COUNTERED"
        side_effects:
          - "the owning Complaint returns CONSENT_PENDING -> PROBABLE_CAUSE, which re-opens the hearing route (validations priority 39 no longer sees an open agreement)"
        note: "the only exit from the bounded cycle once round_number == MAX_CONSENT_ROUNDS (3): REVISE is refused with ERR_CONSENT_ROUND_LIMIT and WITHDRAW is the sole legal successor"
      - from: OFFERED
        to: ACCEPTED
        trigger: "POST /commission/consent-agreements/{id}/respondent-response with action == ACCEPT"
        actor: Respondent
        preconditions:
          - "status == OFFERED"
          - "X-User-ID == the complaint's respondent_licensee_id"
        side_effects:
          - "responded_by_user_id = X-User-ID"
      - from: ACCEPTED
        to: EXECUTED
        trigger: "POST /commission/consent-agreements/{id}/commission-action with action == EXECUTE"
        actor: CommissionCounsel
        preconditions:
          - "status == ACCEPTED"
          - "X-User-ID != offered_by_user_id (segregation of duties)"
        side_effects:
          - "executed_by_user_id = X-User-ID"
          - "CASCADE L1: a SanctionOrder is created (source CONSENT, status ISSUED, sanction_type/fine_cents/suspension_days copied from the proposed_* fields, effective_at = clock now, fine_due_at = clock now + 30 days when fine_cents > 0)"
          - "CASCADE L2 (caused by L1): the owning Complaint CONSENT_PENDING -> ADJUDICATED and the respondent Licensee.discipline_status -> SANCTIONED"
          - "CASCADE L3 (caused by L2): when sanction_type == SUSPENSION the respondent Licensee ACTIVE -> SUSPENDED; when sanction_type == REVOCATION the respondent Licensee -> REVOKED with the L3/L4/L5 instructor-credit cascade"

  - entity: Hearing
    state_field: status
    initial_state: SCHEDULED
    terminal_states: [DECIDED]
    transitions:
      - from: SCHEDULED
        to: CONVENED
        trigger: "POST /commission/hearings/{id}/disposition with action == CONVENE"
        actor: HearingPanelChair
        preconditions:
          - "status == SCHEDULED"
          - "X-User-ID == panel_chair_user_id"
          - "clock now >= scheduled_start_at"
        side_effects:
          - "convened_at = clock now"
      - from: CONVENED
        to: CONTINUED
        trigger: "POST /commission/hearings/{id}/disposition with action == CONTINUE"
        actor: HearingPanelChair
        preconditions:
          - "status == CONVENED"
          - "X-User-ID == panel_chair_user_id"
          - "continuance_count < MAX_CONTINUANCES (2)"
          - "the new slot passes both overlap rules (validations priority 40 and 41) against every other Hearing with status IN {SCHEDULED, CONVENED, CONTINUED}"
        side_effects:
          - "continuance_count += 1; scheduled_start_at / scheduled_end_at / hearing_room replaced by the new slot"
          - "convened_at = null; the hearing immediately continues to SCHEDULED inside the same request"
      - from: CONTINUED
        to: SCHEDULED
        trigger: "system, caused by a granted continuance"
        actor: system
        preconditions:
          - "status == CONTINUED"
        side_effects:
          - "the hearing re-enters the room and panel-chair occupancy sets at its new slot"
        note: "cycle SCHEDULED -> CONVENED -> CONTINUED -> SCHEDULED, bounded by MAX_CONTINUANCES"
      - from: CONVENED
        to: DECIDED
        trigger: "POST /commission/hearings/{id}/disposition with action == DECIDE"
        actor: HearingPanelChair
        preconditions:
          - "status == CONVENED"
          - "X-User-ID == panel_chair_user_id"
          - "finding is supplied; when finding == VIOLATION_FOUND, sanction_type is supplied"
        side_effects:
          - "decided_at = clock now; finding recorded"
          - "CASCADE L1: when finding == VIOLATION_FOUND a SanctionOrder is created (source HEARING, status ISSUED, effective_at = clock now) and the Complaint HEARING_SCHEDULED -> ADJUDICATED"
          - "CASCADE L2 (caused by L1): the respondent Licensee.discipline_status PENDING_HEARING -> SANCTIONED and, per sanction_type, license_status ACTIVE -> SUSPENDED or -> REVOKED"
          - "CASCADE L3/L4/L5 (caused by L2 when license_status became REVOKED): every Instructor with licensee_id == the respondent AND status IN {PENDING, APPROVED} -> SUSPENDED (suspended_reason LICENSE_REVOKED), then every CourseCompletion with instructor_id == one of those instructors AND credit_status == VALID AND completed_on >= date(clock now) - INVALIDATION_LOOKBACK_DAYS (365) -> credit_status INVALIDATED, then every affected student Licensee's ce_hours_valid / ce_deficient recomputed - identical to the Licensee ACTIVE -> REVOKED L3/L4/L5 chain"
          - "when finding == NO_VIOLATION the Complaint HEARING_SCHEDULED -> CLOSED_NO_ACTION and no order is created"

  - entity: SanctionOrder
    state_field: status
    initial_state: ISSUED
    terminal_states: [VACATED]
    transitions:
      - from: ISSUED
        to: SATISFIED
        trigger: "POST /commission/sanction-orders/{id}/fine-payments when fine_paid_cents reaches fine_cents"
        actor: Respondent | LicensingAnalyst
        preconditions:
          - "status IN {ISSUED, IN_DEFAULT}"
          - "amount_cents <= fine_cents - fine_paid_cents"
        side_effects:
          - "fine_paid_cents += amount_cents; fund_credited_cents += amount_cents"
          - "RecoveryFund.fine_credits_cents += amount_cents and RecoveryFund.balance_cents += amount_cents; increments RecoveryFund.version by 1"
          - "SATISFIED is reached only when fine_paid_cents >= fine_cents (a partial payment leaves the order in its current state)"
      - from: IN_DEFAULT
        to: SATISFIED
        trigger: "POST /commission/sanction-orders/{id}/fine-payments (late cure) when fine_paid_cents reaches fine_cents"
        actor: Respondent | LicensingAnalyst
        preconditions:
          - "status == IN_DEFAULT"
        side_effects:
          - "same ledger effects as ISSUED -> SATISFIED"
        note: "cycle ISSUED -> IN_DEFAULT -> SATISFIED"
      - from: ISSUED
        to: IN_DEFAULT
        trigger: "POST /commission/compliance-sweeps step 3 (system) when fine_due_at < clock now AND fine_paid_cents < fine_cents"
        actor: system
        preconditions:
          - "status == ISSUED"
          - "fine_cents > 0 AND fine_paid_cents < fine_cents AND fine_due_at < clock now"
        side_effects:
          - "the respondent Licensee ACTIVE -> SUSPENDED with suspension_ends_at = clock now + DEFAULT_SUSPENSION_DAYS (90) x 86400s"
          - "sponsoring Brokerage.supervision_posture recomputed"
      - from: ISSUED
        to: VACATED
        trigger: "POST /commission/sanction-orders/{id}/vacatur"
        actor: HearingPanelChair
        preconditions:
          - "status IN {ISSUED, IN_DEFAULT, SATISFIED}"
          - "X-User-ID != the hearing's panel_chair_user_id when source == HEARING (a chair may not vacate their own order)"
        side_effects:
          - "vacated_at = clock now"
          - "COMPENSATION 1: RecoveryFund.fine_credits_cents -= fund_credited_cents and RecoveryFund.balance_cents -= fund_credited_cents; fund_credited_cents = 0 and fine_paid_cents = 0"
          - "COMPENSATION 2: every RecoveryFundClaim with sanction_order_id == this order AND status IN {PARTIALLY_PAID, PAID} -> CLAWED_BACK; RecoveryFund.clawed_back_cents += claim.awarded_cents and RecoveryFund.balance_cents += claim.awarded_cents; claim.awarded_cents = 0"
          - "COMPENSATION 3: every RecoveryFundClaim with status == ELIGIBLE -> DENIED with denial_reason ORDER_VACATED"
          - "COMPENSATION 4: the respondent Licensee SUSPENDED -> ACTIVE (suspension_ends_at = null) or REVOKED -> INACTIVE (inactive_since = clock now), and discipline_status SANCTIONED -> CLEARED when no other non-VACATED order remains"
          - "COMPENSATION 5: recomputes Licensee.prior_sanction_count / recovery_paid_cents and the sponsoring Brokerage.supervision_posture"
      - from: SATISFIED
        to: VACATED
        trigger: "POST /commission/sanction-orders/{id}/vacatur"
        actor: HearingPanelChair
        preconditions:
          - "status == SATISFIED"
        side_effects:
          - "same COMPENSATION 1-5 chain as ISSUED -> VACATED"
      - from: IN_DEFAULT
        to: VACATED
        trigger: "POST /commission/sanction-orders/{id}/vacatur"
        actor: HearingPanelChair
        preconditions:
          - "status == IN_DEFAULT"
        side_effects:
          - "same COMPENSATION 1-5 chain as ISSUED -> VACATED"

  - entity: RecoveryFundClaim
    state_field: status
    initial_state: FILED
    terminal_states: [DENIED, PAID, CLAWED_BACK]
    transitions:
      - from: FILED
        to: ELIGIBLE
        trigger: "POST /commission/sanction-orders/{id}/recovery-claims (same-request auto-evaluation)"
        actor: system
        preconditions:
          - "the order's status IN {ISSUED, IN_DEFAULT, SATISFIED}"
          - "the order's sanction_type IN {FINE, SUSPENSION, REVOCATION}"
          - "clock now < order.effective_at + CLAIM_WINDOW_DAYS (365) x 86400s"
        side_effects:
          - "the claim is queued for the next disbursement run on this order"
      - from: FILED
        to: DENIED
        trigger: "POST /commission/sanction-orders/{id}/recovery-claims (same-request auto-evaluation fails)"
        actor: system
        preconditions:
          - "the order's sanction_type IN {REPRIMAND, PROBATION} (denial_reason ORDER_NOT_DISCIPLINARY) OR clock now >= order.effective_at + 365 days (denial_reason WINDOW_CLOSED) OR order.status == VACATED (denial_reason ORDER_VACATED)"
        side_effects:
          - "denial_reason recorded; the claim never enters a disbursement run"
      - from: ELIGIBLE
        to: PARTIALLY_PAID
        trigger: "POST /commission/recovery-fund/disbursements when the waterfall awards 0 < awarded_cents < claimed_loss_cents"
        actor: RecoveryFundTrustee
        preconditions:
          - "status == ELIGIBLE"
          - "the awarded amount from calculations.recovery_fund_award_waterfall is > 0 and < claimed_loss_cents"
        side_effects:
          - "awarded_cents = award; paid_at = clock now"
          - "RecoveryFund.awarded_cents += award; RecoveryFund.balance_cents -= award"
          - "respondent Licensee.recovery_paid_cents recomputed"
      - from: ELIGIBLE
        to: PAID
        trigger: "POST /commission/recovery-fund/disbursements when the waterfall awards the full claimed_loss_cents"
        actor: RecoveryFundTrustee
        preconditions:
          - "status == ELIGIBLE"
          - "the awarded amount equals claimed_loss_cents"
        side_effects:
          - "same ledger effects as ELIGIBLE -> PARTIALLY_PAID"
      - from: PARTIALLY_PAID
        to: PAID
        trigger: "POST /commission/recovery-fund/disbursements (a later run tops the claim up to claimed_loss_cents)"
        actor: RecoveryFundTrustee
        preconditions:
          - "status == PARTIALLY_PAID"
          - "awarded_cents + new award == claimed_loss_cents"
        side_effects:
          - "awarded_cents += new award; fund counters updated as above"
      - from: PAID
        to: CLAWED_BACK
        trigger: "system, COMPENSATION 2 caused by the underlying SanctionOrder reaching VACATED"
        actor: system
        preconditions:
          - "status IN {PARTIALLY_PAID, PAID}"
        side_effects:
          - "RecoveryFund.clawed_back_cents += awarded_cents; RecoveryFund.balance_cents += awarded_cents; awarded_cents = 0"
      - from: ELIGIBLE
        to: DENIED
        trigger: "system, COMPENSATION 3 caused by the underlying SanctionOrder reaching VACATED"
        actor: system
        preconditions:
          - "status == ELIGIBLE"
        side_effects:
          - "denial_reason = ORDER_VACATED"

  - entity: EducationProvider
    state_field: status
    initial_state: PENDING
    terminal_states: [SUSPENDED]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /commission/education-providers/{id}/approval"
        actor: LicensingAnalyst
        preconditions:
          - "status == PENDING"
        side_effects:
          - "approved_at = clock now; approval_expires_at = clock now + approval_years (payload, default 2) x 365 x 86400s"
      - from: APPROVED
        to: PROBATION
        trigger: "system, sibling of CASCADE L3 caused by any Instructor of this provider reaching SUSPENDED"
        actor: system
        preconditions:
          - "status == APPROVED"
          - "suspended_instructor_count >= 1"
        side_effects:
          - "new CourseCompletion rows are still accepted, but a provider on PROBATION cannot approve new instructors"
      - from: PROBATION
        to: APPROVED
        trigger: "POST /commission/education-providers/{id}/approval (reinstatement)"
        actor: LicensingAnalyst
        preconditions:
          - "status == PROBATION"
          - "suspended_instructor_count == 0"
          - "invalidated_credit_hours < PROVIDER_SUSPEND_HOURS (60)"
        side_effects:
          - "approved_at = clock now; approval_expires_at = clock now + approval_years (payload, default 2) x 365 days - a reinstatement re-stamps both"
        note: "cycle APPROVED -> PROBATION -> APPROVED"
      - from: PROBATION
        to: SUSPENDED
        trigger: "POST /commission/compliance-sweeps step 5 (system) when invalidated_credit_hours >= PROVIDER_SUSPEND_HOURS (60)"
        actor: system
        preconditions:
          - "status == PROBATION"
          - "invalidated_credit_hours >= 60"
        side_effects:
          - "every Instructor of this provider with status IN {PENDING, APPROVED} -> SUSPENDED with suspended_reason LICENSE_SUSPENDED"
          - "no further CourseCompletion may be recorded against this provider"

  - entity: Instructor
    state_field: status
    initial_state: PENDING
    terminal_states: []
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /commission/instructors/{id}/approval"
        actor: LicensingAnalyst
        preconditions:
          - "status == PENDING"
          - "the owning EducationProvider.status == APPROVED"
          - "if credential_type == LICENSED_BROKER: licensee_id != null AND that Licensee.person_type == BROKER AND license_status == ACTIVE"
        side_effects:
          - "approved_at = clock now"
      - from: APPROVED
        to: SUSPENDED
        trigger: "system, CASCADE L3 caused by the linked Licensee reaching license_status REVOKED, or step 5 of the sweep suspending the provider"
        actor: system
        preconditions:
          - "status IN {PENDING, APPROVED}"
        side_effects:
          - "suspended_reason = LICENSE_REVOKED (licensee cascade) or LICENSE_SUSPENDED (provider cascade)"
          - "CASCADE L4 (caused by this transition): every CourseCompletion with instructor_id == this instructor AND credit_status == VALID AND completed_on >= date(clock now) - 365 days -> INVALIDATED"
      - from: PENDING
        to: SUSPENDED
        trigger: "system, CASCADE L3 caused by the linked Licensee reaching license_status REVOKED"
        actor: system
        preconditions:
          - "status == PENDING"
        side_effects:
          - "suspended_reason = LICENSE_REVOKED; no CourseCompletion exists to invalidate for an unapproved instructor"

  - entity: AdvertisingName
    state_field: status
    initial_state: SUBMITTED
    terminal_states: [REJECTED, REVOKED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /commission/advertising-names/{id}/review with decision == APPROVE"
        actor: LicensingAnalyst
        preconditions:
          - "status == SUBMITTED"
          - "prohibited_term_hits == 0"
          - "no other AdvertisingName with the same normalized_name AND status IN {SUBMITTED, APPROVED} exists (excluding this row)"
          - "owning Brokerage.supervision_posture NOT IN {RESTRICTED, FROZEN}"
          - "if kind == TEAM: team lead license_status == ACTIVE AND sponsoring_brokerage_id == brokerage_id AND normalized_name contains none of TEAM_FORBIDDEN_WORDS"
        side_effects:
          - "reviewed_by_user_id = X-User-ID"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /commission/advertising-names/{id}/review with decision == REJECT"
        actor: LicensingAnalyst
        preconditions:
          - "status == SUBMITTED"
        side_effects:
          - "reviewed_by_user_id = X-User-ID; rejection_reason supplied by the reviewer"
      - from: SUBMITTED
        to: REJECTED
        trigger: "system, CASCADE L4 caused by the owning Brokerage.supervision_posture entering RESTRICTED or FROZEN"
        actor: system
        preconditions:
          - "status == SUBMITTED"
        side_effects:
          - "rejection_reason = POSTURE_RESTRICTED; reviewed_by_user_id stays null"
      - from: APPROVED
        to: REVOKED
        trigger: "POST /commission/advertising-names/{id}/review with decision == REVOKE, or system when the TEAM lead transfers away or loses ACTIVE status"
        actor: LicensingAnalyst | system
        preconditions:
          - "status == APPROVED"
        side_effects:
          - "rejection_reason = TEAM_LEAD_INELIGIBLE for the system path, reviewer-supplied otherwise"
          - "the normalized_name is released for reuse by other brokerages"

concurrency_rules:
  - rule_id: ledger-entry-stale-trust-account
    parent_entity: TrustAccount
    write_endpoint: "POST /commission/trust-accounts/{id}/ledger-entries"
    occ_field: "expected_trust_account_version"
    description: |
      Appending a TrustLedgerEntry against a TrustAccount whose version has
      advanced since the client last read it is rejected. Appends are
      legitimately repeatable (a second, identical disbursement of the same
      amount under a new transaction_reference is a valid business event), so
      the only way to make "my view of the reconciled balance is current"
      enforceable is a stale-version check on the parent account.
    error_id: ERR_TRUST_ACCOUNT_VERSION_CONFLICT
    http_status: 412
  - rule_id: affiliation-stale-brokerage
    parent_entity: Brokerage
    write_endpoint: "POST /commission/licensees/{id}/affiliations"
    occ_field: "expected_brokerage_version"
    description: |
      Affiliating (or transferring) a licensee into a Brokerage whose version
      has advanced since the client last read it is rejected. Affiliating a
      second, different licensee into the same brokerage is a legitimate
      repeat operation, so the SUPERVISION_RATIO_MAX headroom the client
      believes it observed can only be pinned by a stale-version check.
    error_id: ERR_BROKERAGE_VERSION_CONFLICT
    http_status: 412
  - rule_id: disbursement-stale-recovery-fund
    parent_entity: RecoveryFund
    write_endpoint: "POST /commission/recovery-fund/disbursements"
    occ_field: "expected_recovery_fund_version"
    description: |
      Running a recovery-fund disbursement while holding a stale view of the
      fund is rejected. A disbursement run against a different sanction order
      is a legitimate repeat operation, so the distributable balance the
      trustee believes it observed can only be pinned by a stale-version check
      on the fund singleton.
    error_id: ERR_RECOVERY_FUND_VERSION_CONFLICT
    http_status: 412

calculations:
  - name: trust_account_shortage
    trigger: "POST /commission/trust-accounts/{id}/audits (preview is not persisted), POST /commission/trust-audits/{id}/fieldwork (persists computed_shortage_cents), POST /commission/trust-audits/{id}/disposition with action IN {VERIFY_REMEDIATION, CLOSE} (persists verified_shortage_cents); also recomputed for TrustAccount.book_obligation_cents / book_available_cents / shortage_cents on every TrustLedgerEntry append"
    algorithm: chronological
    formula: |
      # inclusion sets are basis-dependent; obligations never clear a bank account,
      # so only the CASH side of the ledger is filtered by cleared_date.
      obligation_set(basis, as_of_date, cleared_through_date) =
          { e in TrustLedgerEntry : e.trust_account_id == account.id
            AND e.entry_type IN {OBLIGATION_OPENED, OBLIGATION_RELEASED}
            AND e.effective_date <= as_of_date }          # identical on BOOK and BANK
      cash_set(BOOK, as_of_date, _) =
          { e : e.entry_type IN {DEPOSIT, DISBURSEMENT, CORRECTION}
            AND e.effective_date <= as_of_date }
      cash_set(BANK, as_of_date, cleared_through_date) =
          { e : e.entry_type IN {DEPOSIT, DISBURSEMENT, CORRECTION}
            AND e.cleared_date != null
            AND e.cleared_date <= min(as_of_date, cleared_through_date) }

      obligation_cents = sum(e.amount_cents for e in obligation_set where entry_type == OBLIGATION_OPENED)
                       - sum(e.amount_cents for e in obligation_set where entry_type == OBLIGATION_RELEASED)
      available_cents  = sum(e.amount_cents for e in cash_set where entry_type == DEPOSIT)
                       - sum(e.amount_cents for e in cash_set where entry_type == DISBURSEMENT)
                       + sum(e.amount_cents for e in cash_set where entry_type == CORRECTION)
      shortage_cents   = max(0, obligation_cents - available_cents)

      # TrustAccount.book_obligation_cents / book_available_cents / shortage_cents use
      # basis == BOOK with as_of_date = '9999-12-31' (i.e. no date filter at all).
    input_set: "every TrustLedgerEntry row of the account; no status filter exists on ledger entries (they are append-only and immutable). Date filters are inclusive on both ends as written above."
    constants:
      BOOK_AS_OF_SENTINEL: "9999-12-31"
    precision: "integer cents; no rounding is performed - all inputs are integers"
    variants:
      - name: book_basis
        when: "TrustAudit.basis == BOOK"
        difference: "cash entries are included by effective_date <= as_of_date regardless of cleared_date, so an uncleared deposit already offsets the obligation"
      - name: bank_basis
        when: "TrustAudit.basis == BANK"
        difference: "cash entries require cleared_date != null AND cleared_date <= min(as_of_date, cleared_through_date); an uncleared deposit is therefore invisible and the same ledger yields a strictly larger shortage"

  - name: complaint_priority_score
    trigger: "computed on every read of Complaint.priority_score; the variant is selected by Complaint.status; the INVESTIGATION variant is what validations priority 38 compares against PROBABLE_CAUSE_MIN_SCORE at POST /commission/complaints/{id}/disposition (disposition == PROBABLE_CAUSE), and it is refreshed by POST /commission/complaints/{id}/amendments"
    algorithm: weighted_scoring
    formula: |
      base = ALLEGATION_WEIGHT[complaint.allegation_type]
      harm = min(30, floor(complaint.alleged_loss_cents / 100000))        # 1 point per $1,000
      prior = min(20, 5 * respondent_licensee.prior_sanction_count)
      posture_bump =
          15 if respondent_brokerage.supervision_posture IN {RESTRICTED, FROZEN}
          else 5 if respondent_brokerage.supervision_posture == WATCH
          else 0                                                          # also 0 when respondent_brokerage_id is null
      INTAKE variant        : priority_score = min(100, base + harm)
      INVESTIGATION variant : priority_score = min(100, base + harm + prior + posture_bump)
    input_set: "the complaint itself, its respondent Licensee (prior_sanction_count counts only SanctionOrder rows with status IN {ISSUED, IN_DEFAULT, SATISFIED}), and its respondent Brokerage (null-safe)"
    constants:
      ALLEGATION_WEIGHT: { MISREPRESENTATION: 40, AGENCY_DISCLOSURE: 35, COMMISSION_DISPUTE: 20, TRUST_SHORTAGE: 50, ADVERTISING: 15, UNLICENSED_ACTIVITY: 60 }
      HARM_CENTS_PER_POINT: 100000
      HARM_POINT_CAP: 30
      PRIOR_POINTS_EACH: 5
      PRIOR_POINT_CAP: 20
      SCORE_CAP: 100
      PROBABLE_CAUSE_MIN_SCORE: 40
    precision: "integer points; floor on the harm term, min() caps applied after summation"
    variants:
      - name: intake
        when: "Complaint.status == SUBMITTED"
        difference: "prior and posture_bump are omitted entirely - the commission has not yet verified the respondent's history, so identical data scores lower at intake than under investigation"
      - name: investigation
        when: "Complaint.status != SUBMITTED"
        difference: "adds prior (capped at 20) and posture_bump (0/5/15); the same complaint row therefore reports a different priority_score before and after screening with no field of the complaint itself having changed"

  - name: recovery_fund_award_waterfall
    trigger: "POST /commission/recovery-fund/disbursements"
    algorithm: waterfall_allocation
    formula: |
      # STEP ORDER IS NORMATIVE. The administrative assessment is a function of the
      # very total it constrains; the circularity is resolved by a single re-pass,
      # never by iteration to a fixed point.
      # 1. candidate set (order-sensitive)
      candidates = [ c in RecoveryFundClaim :
                       c.sanction_order_id == payload.sanction_order_id
                       AND c.status IN {ELIGIBLE, PARTIALLY_PAID} ]
                   sorted by c.created_at ASC   # sole sort key; created_at is unique per row
      # 2. caps
      licensee_remaining = PER_LICENSEE_CAP_CENTS - order.respondent_licensee.recovery_paid_cents
      distributable      = fund.balance_cents - FUND_RESERVE_FLOOR_CENTS
      # 3. first pass
      awards = {}
      for c in candidates:                        # strictly in created_at ASC order
          claim_room = c.claimed_loss_cents - c.awarded_cents
          cap_room   = PER_CLAIM_CAP_CENTS - c.awarded_cents
          a = max(0, min(claim_room, cap_room, licensee_remaining, distributable))
          awards[c] = a
          licensee_remaining -= a
          distributable      -= a
      total_awarded = sum(awards.values())
      # 4. assessment from the total produced in step 3
      assessment_cents = round_half_up(total_awarded * ASSESSMENT_RATE)
      # 5. single re-pass: if the assessment would breach the reserve floor, shave the
      #    LAST claim in the created_at ASC order (never an earlier one), then recompute
      #    the assessment exactly once from the reduced total.
      if fund.balance_cents - total_awarded - assessment_cents < FUND_RESERVE_FLOOR_CENTS:
          deficit = FUND_RESERVE_FLOOR_CENTS - (fund.balance_cents - total_awarded - assessment_cents)
          last = candidates[-1]
          shave = min(deficit, awards[last])
          awards[last] -= shave
          total_awarded -= shave
          assessment_cents = round_half_up(total_awarded * ASSESSMENT_RATE)   # exactly one recompute
      # 6. commit
      each claim: awarded_cents += awards[claim]; status -> PAID when awarded_cents == claimed_loss_cents
                  else PARTIALLY_PAID when awards[claim] > 0
      fund.awarded_cents    += total_awarded
      fund.assessment_cents += assessment_cents
      fund.balance_cents    -= (total_awarded + assessment_cents)
    input_set: "RecoveryFundClaim rows of the named order with status IN {ELIGIBLE, PARTIALLY_PAID}, ordered by created_at ASC (no other order is permitted; id is never a sort key); the RecoveryFund singleton; the respondent Licensee's recovery_paid_cents"
    constants:
      PER_CLAIM_CAP_CENTS: 2000000
      PER_LICENSEE_CAP_CENTS: 5000000
      FUND_RESERVE_FLOOR_CENTS: 500000
      ASSESSMENT_RATE: 0.02
    precision: "integer cents; round_half_up on the assessment only, applied at most twice (once in step 4, once in step 5)"
    variants:
      - name: unconstrained_run
        when: "fund.balance_cents - total_awarded - assessment_cents >= FUND_RESERVE_FLOOR_CENTS after step 4"
        difference: "step 5 is skipped entirely and every award from step 3 is committed as computed"
      - name: floor_constrained_run
        when: "the step-4 assessment would push the balance below FUND_RESERVE_FLOOR_CENTS"
        difference: "only the last claim in created_at ASC order is shaved and the assessment is recomputed once; earlier claims keep their full step-3 award"

  - name: ce_requirement_hours
    trigger: "computed on every read of Licensee.ce_hours_required; enforced as a precondition of POST /commission/licensees/{id}/status-changes with action == REACTIVATE and as an input to calculations.reactivation_fee_assessment"
    algorithm: threshold
    formula: |
      if licensee.license_status == ACTIVE:
          ce_hours_required = CE_BASE_HOURS                       # 12
      else if licensee.license_status IN {INACTIVE, EXPIRED}:
          elapsed_seconds     = clock_now - licensee.inactive_since
          inactive_full_months = floor(elapsed_seconds / (INACTIVE_MONTH_DAYS * 86400))   # 30-day months
          ce_hours_required   = min(CE_HOUR_CAP,
                                    CE_BASE_HOURS + CE_INCREMENT_HOURS * floor(inactive_full_months / 6))
      else:
          ce_hours_required = CE_BASE_HOURS
    input_set: "the licensee row plus the logical clock; inactive_since is null while ACTIVE, in which case the ACTIVE branch applies"
    constants:
      CE_BASE_HOURS: 12
      CE_INCREMENT_HOURS: 3
      CE_HOUR_CAP: 36
      INACTIVE_MONTH_DAYS: 30
    precision: "integer hours; floor on both divisions, cap applied last"

  - name: reactivation_fee_assessment
    trigger: "POST /commission/licensees/{id}/status-changes with action == REACTIVATE; the payload's reinstatement_fee_paid_cents MUST equal this value exactly"
    algorithm: tiered_pricing
    formula: |
      # ROUNDING ORDER IS NORMATIVE: the monthly surcharge is rounded to whole cents
      # PER PERIOD and only then multiplied by the number of periods. Multiplying first
      # and rounding once produces a different total and is WRONG.
      late_periods      = min(LATE_PERIOD_CAP,
                              floor((clock_now - licensee.inactive_since) / (LATE_PERIOD_DAYS * 86400)))
      per_period_cents  = round_half_up(BASE_REINSTATEMENT_FEE_CENTS * LATE_MONTHLY_RATE)   # 262.5 -> 263
      excess_ce_hours   = licensee.ce_hours_required - CE_BASE_HOURS                        # from ce_requirement_hours
      fee_cents         = BASE_REINSTATEMENT_FEE_CENTS
                        + HOURLY_MAKEUP_FEE_CENTS * excess_ce_hours
                        + per_period_cents * late_periods
    input_set: "the licensee row (license_status IN {INACTIVE, EXPIRED}, inactive_since non-null) plus the logical clock and the output of calculations.ce_requirement_hours"
    constants:
      BASE_REINSTATEMENT_FEE_CENTS: 15000
      HOURLY_MAKEUP_FEE_CENTS: 2500
      LATE_MONTHLY_RATE: 0.0175
      LATE_PERIOD_DAYS: 30
      LATE_PERIOD_CAP: 24
      CE_BASE_HOURS: 12
    precision: "integer cents; round_half_up applied to the per-period surcharge BEFORE multiplication (round-then-multiply, never multiply-then-round)"

  - name: brokerage_supervision_posture
    trigger: "recomputed on every mutation that touches a Brokerage, any of its TrustAccounts or TrustAudits, any affiliated Licensee's license_status or discipline_status, any Complaint naming the brokerage, and on every POST /commission/compliance-sweeps"
    algorithm: threshold
    formula: |
      # FIRST MATCH WINS; the tiers are evaluated strictly top to bottom.
      designated = Licensee[brokerage.designated_broker_id]
      if brokerage.overdue_remediation_count >= 1
         OR designated.license_status IN {SUSPENDED, REVOKED, EXPIRED}
         OR brokerage.status == SUSPENDED:
            supervision_posture = FROZEN
      else if brokerage.open_shortage_cents >= SHORTAGE_RESTRICT_THRESHOLD_CENTS
         OR designated.discipline_status IN {UNDER_INVESTIGATION, PENDING_HEARING, SANCTIONED}
         OR designated.license_status == INACTIVE:
            supervision_posture = RESTRICTED
      else if brokerage.open_shortage_cents > 0
         OR brokerage.open_complaint_count >= WATCH_COMPLAINT_THRESHOLD:
            supervision_posture = WATCH
      else:
            supervision_posture = COMPLIANT
    input_set: "overdue_remediation_count counts TrustAudit rows with status == REMEDIATION_ORDERED AND remediation_due_at < clock now (ESCALATED audits no longer count); open_shortage_cents sums TrustAccount.shortage_cents over accounts with status IN {OPEN, RESTRICTED}; open_complaint_count counts Complaint rows with status IN {SUBMITTED, INVESTIGATION, AMENDMENT_REQUESTED, PROBABLE_CAUSE, CONSENT_PENDING, HEARING_SCHEDULED}"
    constants:
      SHORTAGE_RESTRICT_THRESHOLD_CENTS: 100000
      WATCH_COMPLAINT_THRESHOLD: 3
    precision: "exact integer comparisons; the shortage tier is `>=` (a shortage of exactly 100000 cents is RESTRICTED, 99999 is WATCH)"

  - name: advertising_name_normalization
    trigger: "POST /commission/advertising-names (computes normalized_name and prohibited_term_hits), POST /commission/advertising-names/{id}/review (re-evaluates uniqueness and the TEAM word rule against current state)"
    algorithm: aggregation
    formula: |
      normalized_name      = concat(c for c in uppercase(name_text) if c in [A-Z0-9])
      prohibited_term_hits = count(t for t in PROHIBITED_TERMS if t is a substring of normalized_name)
      team_word_hits       = count(w for w in TEAM_FORBIDDEN_WORDS if w is a substring of normalized_name)
      name_taken           = exists AdvertisingName other
                               where other.id != this.id
                               AND other.normalized_name == this.normalized_name
                               AND other.status IN {SUBMITTED, APPROVED}
    input_set: "the submitted name_text plus every AdvertisingName row with status IN {SUBMITTED, APPROVED} (REJECTED and REVOKED rows release their name for reuse)"
    constants:
      PROHIBITED_TERMS: ["REALTOR", "MLS", "COMMISSION", "STATEOF", "GUARANTEED", "OFFICIAL"]
      TEAM_FORBIDDEN_WORDS: ["REALTY", "REALESTATE", "BROKERAGE", "COMPANY", "AGENCY"]
    precision: "exact substring matching on the normalized (uppercase, alphanumeric-only) form; prohibited_term_hits == 0 is the approval boundary"

validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and X-User-Role is one of the nine roles declared in §1.7"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "the acting role appears in the endpoint's `roles:` list in §1.5"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all
  - priority: 3
    category: business_constraint
    check: "request body shape: every required field of the endpoint's `input:` is present, every enum value is a declared member, every integer respects its field `constraints:` (amount_cents > 0, credit_hours 1..12, record_retention_years 3..10, alleged_loss_cents >= 0), every datetime/date parses as ISO 8601"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all write endpoints"
  - priority: 4
    category: existence
    check: "every path id resolves, validated left to right (e.g. /trust-audits/{id} before its sub-path); the matching ERR_<ENTITY>_NOT_FOUND is returned"
    error_id: ERR_LICENSEE_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with a path id; sibling codes ERR_BROKERAGE_NOT_FOUND, ERR_TRUST_ACCOUNT_NOT_FOUND, ERR_TRUST_AUDIT_NOT_FOUND, ERR_COMPLAINT_NOT_FOUND, ERR_CONSENT_AGREEMENT_NOT_FOUND, ERR_HEARING_NOT_FOUND, ERR_SANCTION_ORDER_NOT_FOUND, ERR_EDUCATION_PROVIDER_NOT_FOUND, ERR_INSTRUCTOR_NOT_FOUND, ERR_ADVERTISING_NAME_NOT_FOUND, ERR_COURSE_COMPLETION_NOT_FOUND"
  - priority: 5
    category: existence
    check: "every foreign-key id supplied in the request body resolves to an existing row (brokerage_id, supervising_broker_id, designated_broker_id, team_lead_licensee_id, licensee_id, instructor_id, education_provider_id, sanction_order_id)"
    error_id: ERR_BROKERAGE_NOT_FOUND
    http_status: 404
    applies_to: "POST /commission/licensees/{id}/affiliations, POST /commission/licensees/{id}/status-changes, POST /commission/brokerages, POST /commission/education-providers/{id}/instructors, POST /commission/course-completions, POST /commission/advertising-names, POST /commission/recovery-fund/disbursements"
  - priority: 6
    category: auth
    check: "an entity_backed role may only act on its own resource: Salesperson/Broker X-User-ID == {id} of the licensee path segment; Respondent X-User-ID == the consent agreement's complaint.respondent_licensee_id or the sanction order's respondent_licensee_id; ProviderAdmin X-User-ID == EducationProvider.admin_user_id of the provider owning the target row (the provider named by the {id} path segment for instructor enrolment, or by education_provider_id in the body for a course completion), so a ProviderAdmin write against a provider whose admin_user_id is null is always refused"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /commission/licensees/{id}/status-changes, POST /commission/consent-agreements/{id}/respondent-response, POST /commission/sanction-orders/{id}/fine-payments, POST /commission/education-providers/{id}/instructors, POST /commission/course-completions"
  - priority: 7
    category: auth
    check: "X-User-ID == TrustAudit.auditor_user_id (the assigned auditor, and only that auditor, performs fieldwork, findings, verification, escalation and closure)"
    error_id: ERR_AUDITOR_MISMATCH
    http_status: 403
    applies_to: "POST /commission/trust-audits/{id}/fieldwork, POST /commission/trust-audits/{id}/disposition"
  - priority: 8
    category: auth
    check: "X-User-ID == Hearing.panel_chair_user_id"
    error_id: ERR_PANEL_CHAIR_MISMATCH
    http_status: 403
    applies_to: "POST /commission/hearings/{id}/disposition"
  - priority: 9
    category: state
    check: "the target row is in a `from:` state that §1.2 declares for the requested transition (including the action/disposition-specific from-state, e.g. VERIFY_REMEDIATION requires REMEDIATION_ORDERED, EXECUTE requires ACCEPTED, CONVENE requires SCHEDULED); a manual ESCALATE additionally requires TrustAudit.remediation_round >= 2, so escalating a first-round remediation order returns this same error; POST /commission/licensees/{id}/exam-results against a DENIED applicant is deliberately EXCLUDED from this rule - the attempt-cap error at priority 35 is the declared answer for a fourth examination attempt; POST /commission/complaints/{id}/consent-agreements and POST /commission/complaints/{id}/hearings against a complaint whose status is CONSENT_PENDING or HEARING_SCHEDULED are likewise EXCLUDED - ERR_CONSENT_ALREADY_OPEN at priority 39 is the declared answer whenever a negotiation or a hearing is already open on the case"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 10
    category: state
    check: "the trust account is not CLOSED"
    error_id: ERR_TRUST_ACCOUNT_CLOSED
    http_status: 409
    applies_to: "POST /commission/trust-accounts/{id}/ledger-entries, POST /commission/trust-accounts/{id}/audits"
  - priority: 11
    category: state
    check: "entry_type != DISBURSEMENT while TrustAccount.status == RESTRICTED. DISBURSEMENT is the ONLY entry type a remediation order bars: DEPOSIT, CORRECTION, OBLIGATION_OPENED and OBLIGATION_RELEASED all remain legal, because a brokerage under order must still be able to fund the shortage and to book obligations it has already incurred"
    error_id: ERR_ACCOUNT_RESTRICTED_NO_DISBURSEMENT
    http_status: 409
    applies_to: "POST /commission/trust-accounts/{id}/ledger-entries"
  - priority: 12
    category: state
    check: "the sanction order is not already VACATED; POST /commission/sanction-orders/{id}/recovery-claims is deliberately NOT covered - a claim filed against a VACATED order is accepted with 201 and auto-denied (FILED -> DENIED, denial_reason ORDER_VACATED) per the RecoveryFundClaim state machine"
    error_id: ERR_ORDER_ALREADY_VACATED
    http_status: 409
    applies_to: "POST /commission/sanction-orders/{id}/vacatur, POST /commission/sanction-orders/{id}/fine-payments"
  - priority: 13
    category: state
    check: "expected_trust_account_version == TrustAccount.version (see concurrency_rules.ledger-entry-stale-trust-account)"
    error_id: ERR_TRUST_ACCOUNT_VERSION_CONFLICT
    http_status: 412
    applies_to: "POST /commission/trust-accounts/{id}/ledger-entries"
  - priority: 14
    category: state
    check: "expected_brokerage_version == target Brokerage.version (see concurrency_rules.affiliation-stale-brokerage)"
    error_id: ERR_BROKERAGE_VERSION_CONFLICT
    http_status: 412
    applies_to: "POST /commission/licensees/{id}/affiliations"
  - priority: 15
    category: state
    check: "expected_recovery_fund_version == RecoveryFund.version (see concurrency_rules.disbursement-stale-recovery-fund)"
    error_id: ERR_RECOVERY_FUND_VERSION_CONFLICT
    http_status: 412
    applies_to: "POST /commission/recovery-fund/disbursements"
  - priority: 16
    category: business_safety
    check: "the target Brokerage.supervision_posture is NOT IN {RESTRICTED, FROZEN} (supervision integrity outranks every capacity, uniqueness and fiscal rule)"
    error_id: ERR_BROKERAGE_POSTURE_BLOCKED
    http_status: 409
    applies_to: "POST /commission/licensees/{id}/affiliations, POST /commission/licensees/{id}/status-changes (action == REACTIVATE), POST /commission/advertising-names/{id}/review (decision == APPROVE)"
  - priority: 17
    category: business_safety
    check: "segregation of duties on X-User-ID: a Hearing's panel_chair_user_id MUST NOT equal the complaint's investigator_user_id, and a consent agreement's EXECUTE actor MUST NOT equal offered_by_user_id, and a vacatur actor MUST NOT equal the vacated order's hearing panel_chair_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: "POST /commission/complaints/{id}/hearings, POST /commission/consent-agreements/{id}/commission-action (action == EXECUTE), POST /commission/sanction-orders/{id}/vacatur"
  - priority: 18
    category: business_safety
    check: "the licensee's discipline_status is NOT IN {PENDING_HEARING, SANCTIONED} for a transfer, and NOT IN {PENDING_HEARING} for GO_INACTIVE"
    error_id: ERR_DISCIPLINE_HOLD
    http_status: 409
    applies_to: "POST /commission/licensees/{id}/affiliations (transfer), POST /commission/licensees/{id}/status-changes"
  - priority: 19
    category: business_safety
    check: "prohibited_term_hits == 0 (a name containing any PROHIBITED_TERMS substring cannot be approved)"
    error_id: ERR_PROHIBITED_ADVERTISING_TERM
    http_status: 422
    applies_to: "POST /commission/advertising-names/{id}/review (decision == APPROVE)"
  - priority: 20
    category: business_safety
    check: "for kind == TEAM, normalized_name contains none of TEAM_FORBIDDEN_WORDS (a team name may not imply an independent brokerage)"
    error_id: ERR_TEAM_NAME_IMPLIES_BROKERAGE
    http_status: 422
    applies_to: "POST /commission/advertising-names/{id}/review (decision == APPROVE)"
  - priority: 21
    category: business_referential
    check: "for kind == TEAM, team_lead_licensee_id is non-null, that licensee's license_status == ACTIVE and sponsoring_brokerage_id == the AdvertisingName.brokerage_id; for kind IN {DBA, BRANCH}, team_lead_licensee_id MUST be null"
    error_id: ERR_TEAM_LEAD_NOT_AFFILIATED
    http_status: 422
    applies_to: "POST /commission/advertising-names, POST /commission/advertising-names/{id}/review (decision == APPROVE)"
  - priority: 22
    category: business_referential
    check: "supervising_broker.person_type == BROKER AND supervising_broker.license_status == ACTIVE AND supervising_broker.sponsoring_brokerage_id == the supplied brokerage_id. SELF-SUPERVISION BOOTSTRAP EXEMPTION: when supervising_broker_id == the licensee named in the path AND that licensee == the target Brokerage.designated_broker_id, the ACTIVE and same-brokerage clauses are waived; person_type MUST still be BROKER"
    error_id: ERR_SUPERVISING_BROKER_INELIGIBLE
    http_status: 422
    applies_to: "POST /commission/licensees/{id}/affiliations, POST /commission/licensees/{id}/status-changes (action == REACTIVATE)"
  - priority: 23
    category: business_referential
    check: "the designated_broker_id licensee has person_type == BROKER and license_status IN {EXAM_PASSED, ACTIVE}"
    error_id: ERR_DESIGNATED_BROKER_NOT_BROKER
    http_status: 422
    applies_to: "POST /commission/brokerages, POST /commission/brokerages/{id}/activation"
  - priority: 24
    category: business_referential
    check: "the supplied education_provider_id equals the instructor's education_provider_id"
    error_id: ERR_INSTRUCTOR_PROVIDER_MISMATCH
    http_status: 422
    applies_to: "POST /commission/course-completions"
  - priority: 25
    category: business_referential
    check: "for POST /commission/education-providers/{id}/instructors and POST /commission/instructors/{id}/approval the EducationProvider.status MUST be APPROVED (a PENDING, PROBATION or SUSPENDED provider may not enrol or approve instructors); for POST /commission/course-completions the provider status MUST be IN {APPROVED, PROBATION} (only a SUSPENDED or PENDING provider is barred from reporting completions)"
    error_id: ERR_PROVIDER_NOT_APPROVED
    http_status: 409
    applies_to: "POST /commission/education-providers/{id}/instructors, POST /commission/instructors/{id}/approval, POST /commission/course-completions"
  - priority: 26
    category: business_referential
    check: "the Instructor.status == APPROVED at the moment the completion is reported"
    error_id: ERR_INSTRUCTOR_NOT_APPROVED
    http_status: 409
    applies_to: "POST /commission/course-completions"
  - priority: 27
    category: business_referential
    check: "for entry_type == CORRECTION, a DISBURSEMENT entry with the same trust_account_id AND transaction_reference already exists"
    error_id: ERR_CORRECTION_TARGET_NOT_FOUND
    http_status: 422
    applies_to: "POST /commission/trust-accounts/{id}/ledger-entries"
  - priority: 28
    category: business_referential
    check: "when trust_account_required == true, at least one TrustAccount with account_type == ESCROW AND status == OPEN exists for the brokerage"
    error_id: ERR_TRUST_ACCOUNT_REQUIRED
    http_status: 409
    applies_to: "POST /commission/brokerages/{id}/activation"
  - priority: 29
    category: business_constraint
    check: "no other AdvertisingName with the same normalized_name AND status IN {SUBMITTED, APPROVED} exists"
    error_id: ERR_ADVERTISING_NAME_TAKEN
    http_status: 409
    applies_to: "POST /commission/advertising-names, POST /commission/advertising-names/{id}/review (decision == APPROVE)"
  - priority: 30
    category: business_constraint
    check: "(trust_account_id, entry_type, transaction_reference) is unique"
    error_id: ERR_DUPLICATE_TRANSACTION_REFERENCE
    http_status: 409
    applies_to: "POST /commission/trust-accounts/{id}/ledger-entries"
  - priority: 31
    category: business_constraint
    check: "target Brokerage.affiliated_licensee_count < SUPERVISION_RATIO_MAX (25) BEFORE the affiliation is applied"
    error_id: ERR_SUPERVISION_RATIO_EXCEEDED
    http_status: 409
    applies_to: "POST /commission/licensees/{id}/affiliations, POST /commission/licensees/{id}/status-changes (action == REACTIVATE)"
  - priority: 32
    category: business_constraint
    check: "a REVISE is only accepted while round_number < MAX_CONSENT_ROUNDS (3); at round_number == 3 the cycle is closed and WITHDRAW is counsel's only remaining move"
    error_id: ERR_CONSENT_ROUND_LIMIT
    http_status: 409
    applies_to: "POST /commission/consent-agreements/{id}/commission-action (action == REVISE)"
  - priority: 33
    category: business_constraint
    check: "continuance_count < MAX_CONTINUANCES (2)"
    error_id: ERR_CONTINUANCE_LIMIT
    http_status: 409
    applies_to: "POST /commission/hearings/{id}/disposition (action == CONTINUE)"
  - priority: 34
    category: business_constraint
    check: "amendment_count < MAX_AMENDMENTS (2)"
    error_id: ERR_AMENDMENT_LIMIT
    http_status: 409
    applies_to: "POST /commission/complaints/{id}/disposition (disposition == REQUEST_AMENDMENT)"
  - priority: 35
    category: business_constraint
    check: "exam_attempt_count < MAX_EXAM_ATTEMPTS (3) before the result is recorded; DENIED is the only reachable state with exam_attempt_count == 3 (the third failure lands there), and priority 9 excludes that case precisely so a fourth attempt answers with this error rather than ERR_INVALID_STATE"
    error_id: ERR_EXAM_ATTEMPTS_EXHAUSTED
    http_status: 409
    applies_to: "POST /commission/licensees/{id}/exam-results"
  - priority: 36
    category: business_constraint
    check: "prelicense_hours >= PRELICENSE_HOURS[person_type] (SALESPERSON 90, BROKER 180)"
    error_id: ERR_PRELICENSE_HOURS_INSUFFICIENT
    http_status: 422
    applies_to: "POST /commission/licensees/{id}/exam-results"
  - priority: 37
    category: business_constraint
    check: "ce_hours_valid >= ce_hours_required (calculations.ce_requirement_hours) at the moment of reactivation; the SAME rule and the SAME error answer the ce_deficient == false precondition of the ACTIVE -> ACTIVE transfer, where the requirement is the ACTIVE-branch CE_BASE_HOURS (12)"
    error_id: ERR_CE_HOURS_INSUFFICIENT
    http_status: 409
    applies_to: "POST /commission/licensees/{id}/status-changes (action == REACTIVATE), POST /commission/licensees/{id}/affiliations (transfer, i.e. the licensee is already ACTIVE)"
  - priority: 38
    category: business_constraint
    check: "priority_score (INVESTIGATION variant) >= PROBABLE_CAUSE_MIN_SCORE (40)"
    error_id: ERR_PROBABLE_CAUSE_SCORE_TOO_LOW
    http_status: 409
    applies_to: "POST /commission/complaints/{id}/disposition (disposition == PROBABLE_CAUSE)"
  - priority: 39
    category: business_constraint
    check: "no ConsentAgreement for the complaint has status IN {OFFERED, COUNTERED, ACCEPTED}, and no Hearing for the complaint has status IN {SCHEDULED, CONVENED, CONTINUED}. This rule OUTRANKS the generic from-state check in practice: priority 9 carves out complaints in CONSENT_PENDING and HEARING_SCHEDULED on these two endpoints precisely so that an already-open channel is reported as ERR_CONSENT_ALREADY_OPEN rather than ERR_INVALID_STATE. Once the channel closes (WITHDRAW puts the agreement in REJECTED and returns the complaint to PROBABLE_CAUSE) both endpoints are open again."
    error_id: ERR_CONSENT_ALREADY_OPEN
    http_status: 409
    applies_to: "POST /commission/complaints/{id}/consent-agreements, POST /commission/complaints/{id}/hearings"
  - priority: 40
    category: business_temporal
    check: "hearing-room occupancy with a turnover buffer: for every other Hearing with the same hearing_room AND status IN {SCHEDULED, CONVENED, CONTINUED}, the new slot must satisfy new.scheduled_start_at >= other.scheduled_end_at + 30 minutes OR new.scheduled_end_at + 30 minutes <= other.scheduled_start_at. Exact adjacency (gap 0) is a conflict; a gap of exactly 30 minutes is permitted"
    error_id: ERR_HEARING_ROOM_CONFLICT
    http_status: 409
    applies_to: "POST /commission/complaints/{id}/hearings, POST /commission/hearings/{id}/disposition (action == CONTINUE)"
  - priority: 41
    category: business_temporal
    check: "panel-chair occupancy as plain half-open exclusion: for every other Hearing with the same panel_chair_user_id AND status IN {SCHEDULED, CONVENED, CONTINUED}, the half-open intervals [start, end) must not intersect. Exact adjacency (new.start == other.end) is permitted - no buffer applies to people"
    error_id: ERR_PANEL_CHAIR_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /commission/complaints/{id}/hearings, POST /commission/hearings/{id}/disposition (action == CONTINUE)"
  - priority: 42
    category: business_temporal
    check: "auditor fieldwork capacity as an aggregate count, not pairwise exclusion: the number of other TrustAudit rows with the same auditor_user_id AND status IN {SCHEDULED, FIELDWORK, FINDINGS_ISSUED, REMEDIATION_ORDERED, VERIFYING} whose half-open window [fieldwork_start_at, fieldwork_end_at) intersects the new window must be < MAX_CONCURRENT_AUDIT_WINDOWS (2). Two overlapping windows are fine; a third overlapping window is rejected. Adjacency does not intersect"
    error_id: ERR_AUDITOR_WINDOW_CAPACITY
    http_status: 409
    applies_to: "POST /commission/trust-accounts/{id}/audits"
  - priority: 43
    category: business_temporal
    check: "clock now < Complaint.statute_deadline_at"
    error_id: ERR_STATUTE_DEADLINE_PASSED
    http_status: 409
    applies_to: "POST /commission/complaints/{id}/disposition (disposition == PROBABLE_CAUSE), POST /commission/complaints/{id}/amendments"
  - priority: 44
    category: business_temporal
    check: "clock now < SanctionOrder.effective_at + CLAIM_WINDOW_DAYS (365) x 86400s - the fund may not disburse against an order whose recovery window has closed"
    error_id: ERR_CLAIM_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /commission/recovery-fund/disbursements"
  - priority: 45
    category: business_temporal
    check: "clock now >= TrustAudit.fieldwork_start_at"
    error_id: ERR_FIELDWORK_NOT_STARTED
    http_status: 409
    applies_to: "POST /commission/trust-audits/{id}/fieldwork"
  - priority: 46
    category: business_temporal
    check: "clock now >= Hearing.scheduled_start_at"
    error_id: ERR_HEARING_NOT_STARTED
    http_status: 409
    applies_to: "POST /commission/hearings/{id}/disposition (action == CONVENE)"
  - priority: 47
    category: business_fiscal
    check: "RecoveryFund.balance_cents - FUND_RESERVE_FLOOR_CENTS (500000) > 0 before the waterfall runs"
    error_id: ERR_FUND_RESERVE_FLOOR
    http_status: 409
    applies_to: "POST /commission/recovery-fund/disbursements"
  - priority: 48
    category: business_fiscal
    check: "PER_LICENSEE_CAP_CENTS (5000000) - respondent Licensee.recovery_paid_cents > 0"
    error_id: ERR_LICENSEE_CAP_EXHAUSTED
    http_status: 409
    applies_to: "POST /commission/recovery-fund/disbursements"
  - priority: 49
    category: business_fiscal
    check: "at least one candidate claim with status IN {ELIGIBLE, PARTIALLY_PAID} exists for the order AND the waterfall's total_awarded > 0"
    error_id: ERR_NO_ELIGIBLE_CLAIMS
    http_status: 409
    applies_to: "POST /commission/recovery-fund/disbursements"
  - priority: 50
    category: business_fiscal
    check: "amount_cents <= fine_cents - fine_paid_cents"
    error_id: ERR_PAYMENT_EXCEEDS_BALANCE
    http_status: 422
    applies_to: "POST /commission/sanction-orders/{id}/fine-payments"
  - priority: 51
    category: business_fiscal
    check: "reinstatement_fee_paid_cents == calculations.reactivation_fee_assessment exactly (neither under- nor over-payment is accepted)"
    error_id: ERR_REINSTATEMENT_FEE_MISMATCH
    http_status: 422
    applies_to: "POST /commission/licensees/{id}/status-changes (action == REACTIVATE)"

endpoints:
  # ---------------------------------------------------------------- reads (27)
  - method: GET
    path: "/commission/licensees/{id}"
    description: "Read one licensee, including the computed ce_hours_required / ce_hours_valid / ce_deficient / prior_sanction_count / recovery_paid_cents fields and both status dimensions."
    roles: [LicensingAnalyst, TrustAuditor, CommissionCounsel, HearingPanelChair, RecoveryFundTrustee, Broker, Salesperson, Respondent, ProviderAdmin]
    code: 200
    input: []
    output: Licensee
    side_effects: [recompute ce_hours_required per calculations.ce_requirement_hours at read time]
  - method: GET
    path: "/commission/licensees"
    description: "List licensees. Reverse-reachability channel for Licensee.sponsoring_brokerage_id -> Brokerage.id and Licensee.supervising_broker_id -> Licensee.id."
    roles: [LicensingAnalyst, TrustAuditor, CommissionCounsel, HearingPanelChair, RecoveryFundTrustee, Broker, ProviderAdmin]
    code: 200
    input: ["sponsoring_brokerage_id?", "supervising_broker_id?", "license_status?", "discipline_status?", "person_type?", "limit?", "offset?"]
    output: Licensee[]
    side_effects: []
  - method: GET
    path: "/commission/brokerages/{id}"
    description: "Read one brokerage, including the computed supervision_posture and its four driver counters."
    roles: [LicensingAnalyst, TrustAuditor, CommissionCounsel, HearingPanelChair, Broker, Salesperson]
    code: 200
    input: []
    output: Brokerage
    side_effects: [recompute supervision_posture per calculations.brokerage_supervision_posture at read time]
  - method: GET
    path: "/commission/brokerages"
    description: "List brokerages. Reverse-reachability channel for Brokerage.designated_broker_id -> Licensee.id."
    roles: [LicensingAnalyst, TrustAuditor, CommissionCounsel, HearingPanelChair, Broker]
    code: 200
    input: ["designated_broker_id?", "status?", "supervision_posture?", "limit?", "offset?"]
    output: Brokerage[]
    side_effects: []
  - method: GET
    path: "/commission/trust-accounts/{id}"
    description: "Read one trust account with its book-basis obligation / available / shortage triple."
    roles: [LicensingAnalyst, TrustAuditor, CommissionCounsel, Broker]
    code: 200
    input: []
    output: TrustAccount
    side_effects: [recompute book_obligation_cents, book_available_cents, shortage_cents per calculations.trust_account_shortage variant book_basis]
  - method: GET
    path: "/commission/trust-accounts"
    description: "List trust accounts. Reverse-reachability channel for TrustAccount.brokerage_id -> Brokerage.id."
    roles: [LicensingAnalyst, TrustAuditor, CommissionCounsel, Broker]
    code: 200
    input: ["brokerage_id?", "status?", "account_type?", "limit?", "offset?"]
    output: TrustAccount[]
    side_effects: []
  - method: GET
    path: "/commission/trust-accounts/{id}/ledger-entries"
    description: "List the append-only ledger of one trust account in created_at ASC order. Reverse-reachability channel for TrustLedgerEntry.trust_account_id -> TrustAccount.id."
    roles: [LicensingAnalyst, TrustAuditor, CommissionCounsel, Broker]
    code: 200
    input: ["entry_type?", "limit?", "offset?"]
    output: TrustLedgerEntry[]
    side_effects: []
  - method: GET
    path: "/commission/trust-audits/{id}"
    description: "Read one trust account audit, including computed_shortage_cents, verified_shortage_cents, remediation_round and remediation_due_at."
    roles: [LicensingAnalyst, TrustAuditor, CommissionCounsel, Broker]
    code: 200
    input: []
    output: TrustAudit
    side_effects: []
  - method: GET
    path: "/commission/trust-audits"
    description: "List trust audits. Reverse-reachability channel for TrustAudit.trust_account_id -> TrustAccount.id."
    roles: [LicensingAnalyst, TrustAuditor, CommissionCounsel, Broker]
    code: 200
    input: ["trust_account_id?", "auditor_user_id?", "status?", "basis?", "limit?", "offset?"]
    output: TrustAudit[]
    side_effects: []
  - method: GET
    path: "/commission/complaints/{id}"
    description: "Read one complaint, including the status-selected variant of the computed priority_score."
    roles: [LicensingAnalyst, TrustAuditor, CommissionCounsel, HearingPanelChair, Respondent, Public]
    code: 200
    input: []
    output: Complaint
    side_effects: [recompute priority_score per calculations.complaint_priority_score using the variant selected by status]
  - method: GET
    path: "/commission/complaints"
    description: "List complaints. Reverse-reachability channel for Complaint.respondent_licensee_id -> Licensee.id, Complaint.respondent_brokerage_id -> Brokerage.id and Complaint.source_audit_id -> TrustAudit.id."
    roles: [LicensingAnalyst, TrustAuditor, CommissionCounsel, HearingPanelChair]
    code: 200
    input: ["respondent_licensee_id?", "respondent_brokerage_id?", "source_audit_id?", "status?", "allegation_type?", "limit?", "offset?"]
    output: Complaint[]
    side_effects: []
  - method: GET
    path: "/commission/complaints/{id}/consent-agreements"
    description: "List every consent agreement round for one complaint in created_at ASC order. Reverse-reachability channel for ConsentAgreement.complaint_id -> Complaint.id."
    roles: [LicensingAnalyst, CommissionCounsel, HearingPanelChair, Respondent]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ConsentAgreement[]
    side_effects: []
  - method: GET
    path: "/commission/complaints/{id}/hearings"
    description: "List every hearing of one complaint in created_at ASC order. Reverse-reachability channel for Hearing.complaint_id -> Complaint.id."
    roles: [LicensingAnalyst, CommissionCounsel, HearingPanelChair, Respondent]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Hearing[]
    side_effects: []
  - method: GET
    path: "/commission/consent-agreements/{id}"
    description: "Read one consent agreement round, including round_number, the commission's proposal and the respondent's counter."
    roles: [LicensingAnalyst, CommissionCounsel, HearingPanelChair, Respondent]
    code: 200
    input: []
    output: ConsentAgreement
    side_effects: []
  - method: GET
    path: "/commission/hearings/{id}"
    description: "Read one hearing, including room, window, continuance_count and finding."
    roles: [LicensingAnalyst, CommissionCounsel, HearingPanelChair, Respondent]
    code: 200
    input: []
    output: Hearing
    side_effects: []
  - method: GET
    path: "/commission/sanction-orders/{id}"
    description: "Read one sanction order, including fine_paid_cents, fund_credited_cents and vacated_at."
    roles: [LicensingAnalyst, CommissionCounsel, HearingPanelChair, RecoveryFundTrustee, Respondent, Public]
    code: 200
    input: []
    output: SanctionOrder
    side_effects: []
  - method: GET
    path: "/commission/sanction-orders"
    description: "List sanction orders. Reverse-reachability channel for SanctionOrder.complaint_id -> Complaint.id, SanctionOrder.respondent_licensee_id -> Licensee.id, SanctionOrder.consent_agreement_id -> ConsentAgreement.id and SanctionOrder.hearing_id -> Hearing.id."
    roles: [LicensingAnalyst, CommissionCounsel, HearingPanelChair, RecoveryFundTrustee]
    code: 200
    input: ["complaint_id?", "respondent_licensee_id?", "consent_agreement_id?", "hearing_id?", "status?", "sanction_type?", "limit?", "offset?"]
    output: SanctionOrder[]
    side_effects: []
  - method: GET
    path: "/commission/sanction-orders/{id}/recovery-claims"
    description: "List every recovery fund claim filed against one sanction order in created_at ASC order - the same order the waterfall consumes. Reverse-reachability channel for RecoveryFundClaim.sanction_order_id -> SanctionOrder.id."
    roles: [LicensingAnalyst, CommissionCounsel, RecoveryFundTrustee, Public]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: RecoveryFundClaim[]
    side_effects: []
  - method: GET
    path: "/commission/recovery-fund"
    description: "Read the singleton recovery fund ledger (balance and the five lifetime counters that must reconcile to it)."
    roles: [LicensingAnalyst, CommissionCounsel, RecoveryFundTrustee, Public]
    code: 200
    input: []
    output: RecoveryFund
    side_effects: []
  - method: GET
    path: "/commission/education-providers/{id}"
    description: "Read one education provider, including suspended_instructor_count and invalidated_credit_hours."
    roles: [LicensingAnalyst, CommissionCounsel, ProviderAdmin]
    code: 200
    input: []
    output: EducationProvider
    side_effects: []
  - method: GET
    path: "/commission/education-providers"
    description: "List education providers."
    roles: [LicensingAnalyst, CommissionCounsel, ProviderAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: EducationProvider[]
    side_effects: []
  - method: GET
    path: "/commission/instructors/{id}"
    description: "Read one instructor, including status and suspended_reason."
    roles: [LicensingAnalyst, CommissionCounsel, ProviderAdmin]
    code: 200
    input: []
    output: Instructor
    side_effects: []
  - method: GET
    path: "/commission/instructors"
    description: "List instructors. Reverse-reachability channel for Instructor.education_provider_id -> EducationProvider.id and Instructor.licensee_id -> Licensee.id."
    roles: [LicensingAnalyst, CommissionCounsel, ProviderAdmin]
    code: 200
    input: ["education_provider_id?", "licensee_id?", "status?", "credential_type?", "limit?", "offset?"]
    output: Instructor[]
    side_effects: []
  - method: GET
    path: "/commission/course-completions/{id}"
    description: "Read one course completion record, including credit_status and invalidated_at."
    roles: [LicensingAnalyst, CommissionCounsel, ProviderAdmin, Broker, Salesperson]
    code: 200
    input: []
    output: CourseCompletion
    side_effects: []
  - method: GET
    path: "/commission/course-completions"
    description: "List course completions. Reverse-reachability channel for CourseCompletion.licensee_id -> Licensee.id, CourseCompletion.instructor_id -> Instructor.id and CourseCompletion.education_provider_id -> EducationProvider.id."
    roles: [LicensingAnalyst, CommissionCounsel, ProviderAdmin, Broker, Salesperson]
    code: 200
    input: ["licensee_id?", "instructor_id?", "education_provider_id?", "credit_status?", "course_type?", "limit?", "offset?"]
    output: CourseCompletion[]
    side_effects: []
  - method: GET
    path: "/commission/advertising-names/{id}"
    description: "Read one advertising name registration, including normalized_name, prohibited_term_hits and rejection_reason."
    roles: [LicensingAnalyst, CommissionCounsel, Broker, Salesperson, Public]
    code: 200
    input: []
    output: AdvertisingName
    side_effects: []
  - method: GET
    path: "/commission/advertising-names"
    description: "List advertising names. Reverse-reachability channel for AdvertisingName.brokerage_id -> Brokerage.id and AdvertisingName.team_lead_licensee_id -> Licensee.id."
    roles: [LicensingAnalyst, CommissionCounsel, Broker, Public]
    code: 200
    input: ["brokerage_id?", "team_lead_licensee_id?", "status?", "kind?", "normalized_name?", "limit?", "offset?"]
    output: AdvertisingName[]
    side_effects: []
  # ------------------------------------------------- licensing writes (4)
  - method: POST
    path: "/commission/licensees"
    description: "Open a licence application. license_number is minted by the server as SP-###### for SALESPERSON and BR-###### for BROKER; license_status starts APPLICANT and discipline_status starts NONE."
    roles: [LicensingAnalyst]
    code: 201
    input: [person_type, full_name, prelicense_hours]
    output: Licensee
    side_effects: [mint license_number, set license_status = APPLICANT, set discipline_status = NONE, set exam_attempt_count = 0, set ce_hours_valid = 0, set prior_sanction_count = 0, set recovery_paid_cents = 0]
  - method: POST
    path: "/commission/licensees/{id}/exam-results"
    description: "Record one examination attempt. score >= 75 passes (APPLICANT -> EXAM_PASSED); a failure below the attempt cap keeps APPLICANT; the third failure moves the applicant to the terminal DENIED state."
    roles: [LicensingAnalyst]
    code: 200
    input: [score, taken_on]
    output: Licensee
    side_effects: [increment exam_attempt_count, set exam_best_score = max(exam_best_score, score), on pass set exam_passed_at and license_status = EXAM_PASSED, on third failure set license_status = DENIED]
  - method: POST
    path: "/commission/licensees/{id}/affiliations"
    description: "Affiliate the licensee with a sponsoring brokerage under a supervising broker. Used both for initial issuance (EXAM_PASSED -> ACTIVE) and for a transfer between brokerages (ACTIVE -> ACTIVE). Requires expected_brokerage_version and bumps the target Brokerage.version. A brokerage's designated broker seats themselves by passing supervising_broker_id == their own id (the self-supervision bootstrap exemption of validations priority 22)."
    roles: [LicensingAnalyst]
    code: 200
    input: [brokerage_id, supervising_broker_id, expected_brokerage_version]
    output: Licensee
    side_effects: [set sponsoring_brokerage_id and supervising_broker_id, on initial issuance set license_status = ACTIVE plus license_issued_at = clock now and license_expires_at = clock now + 730 days and ce_period_start_on = date(clock now), increment target Brokerage.affiliated_licensee_count, decrement the previous Brokerage.affiliated_licensee_count on a transfer, bump target Brokerage.version, recompute both brokerages' supervision_posture, REVOKE any APPROVED AdvertisingName of kind TEAM whose team_lead_licensee_id is this licensee when the transfer leaves its brokerage]
  - method: POST
    path: "/commission/licensees/{id}/status-changes"
    description: "Self-service or analyst-driven status change. action == GO_INACTIVE parks an ACTIVE licence (ACTIVE -> INACTIVE) and stamps inactive_since; action == REACTIVATE returns an INACTIVE or EXPIRED licence to ACTIVE and requires brokerage_id, supervising_broker_id and reinstatement_fee_paid_cents equal to calculations.reactivation_fee_assessment."
    roles: [Salesperson, Broker, LicensingAnalyst]
    code: 200
    input: [action, "brokerage_id?", "supervising_broker_id?", "reinstatement_fee_paid_cents?"]
    output: Licensee
    side_effects: [on GO_INACTIVE set license_status = INACTIVE plus inactive_since = clock now and decrement the brokerage's affiliated_licensee_count, on REACTIVATE set license_status = ACTIVE plus clear inactive_since and set license_expires_at = clock now + 730 days and ce_period_start_on = date(clock now) and reset ce_hours_valid to 0 and increment the new brokerage's affiliated_licensee_count, recompute supervision_posture of every touched brokerage]
  # ------------------------------------------------- brokerage writes (3)
  - method: POST
    path: "/commission/brokerages"
    description: "Register a brokerage in PENDING status under a designated broker."
    roles: [LicensingAnalyst]
    code: 201
    input: [name, designated_broker_id, trust_account_required, record_retention_years]
    output: Brokerage
    side_effects: [set status = PENDING, set affiliated_licensee_count = 0, set open_shortage_cents = 0, set open_complaint_count = 0, set overdue_remediation_count = 0, compute supervision_posture]
  - method: POST
    path: "/commission/brokerages/{id}/activation"
    description: "Activate a PENDING brokerage, or re-activate a SUSPENDED one once its designated broker is restored. When trust_account_required is true at least one ESCROW trust account in OPEN status must already exist."
    roles: [LicensingAnalyst]
    code: 200
    input: ["attestation_note?"]
    output: Brokerage
    side_effects: [set status = ACTIVE, recompute supervision_posture, bump version]
  - method: POST
    path: "/commission/brokerages/{id}/trust-accounts"
    description: "Open a trust account for the brokerage in OPEN status with a zero book position."
    roles: [LicensingAnalyst, Broker]
    code: 201
    input: [bank_name, account_type]
    output: TrustAccount
    side_effects: [set status = OPEN, set book_obligation_cents = 0, set book_available_cents = 0, set shortage_cents = 0]
  # ------------------------------------------------- trust writes (5)
  - method: POST
    path: "/commission/trust-accounts/{id}/ledger-entries"
    description: "Append one immutable entry to the trust ledger. Requires expected_trust_account_version and bumps TrustAccount.version. A CORRECTION must carry the transaction_reference of an existing DISBURSEMENT on the same account and compensates it exactly."
    roles: [Broker, LicensingAnalyst]
    code: 201
    input: [entry_type, amount_cents, effective_date, "cleared_date?", transaction_reference, "memo?", expected_trust_account_version]
    output: TrustLedgerEntry
    side_effects: [recompute TrustAccount.book_obligation_cents / book_available_cents / shortage_cents per calculations.trust_account_shortage variant book_basis, bump TrustAccount.version, recompute the owning Brokerage.open_shortage_cents and supervision_posture, on a posture leaving RESTRICTED or FROZEN leave already-REJECTED advertising names untouched]
  - method: POST
    path: "/commission/trust-accounts/{id}/audits"
    description: "Schedule an audit of the account with an explicit fieldwork window. The auditor's concurrent-window capacity is checked here, not at fieldwork time."
    roles: [TrustAuditor, LicensingAnalyst]
    code: 201
    input: [auditor_user_id, basis, as_of_date, fieldwork_start_at, fieldwork_end_at]
    output: TrustAudit
    side_effects: [set status = SCHEDULED, set remediation_round = 0]
  - method: POST
    path: "/commission/trust-audits/{id}/fieldwork"
    description: "Open fieldwork (SCHEDULED -> FIELDWORK) and persist computed_shortage_cents from calculations.trust_account_shortage under the audit's declared basis. For basis == BANK, bank_statement_balance_cents and cleared_through_date are required."
    roles: [TrustAuditor]
    code: 200
    input: ["bank_statement_balance_cents?", "cleared_through_date?"]
    output: TrustAudit
    side_effects: [set status = FIELDWORK, persist computed_shortage_cents per the audit's basis, set TrustAccount.last_audited_at = clock now]
  - method: POST
    path: "/commission/trust-audits/{id}/disposition"
    description: "Single disposition endpoint for the audit lifecycle. action == ISSUE_FINDINGS (FIELDWORK -> FINDINGS_ISSUED, then CASCADE L1b to REMEDIATION_ORDERED when computed_shortage_cents > 0, else straight to CLOSED); action == VERIFY_REMEDIATION (REMEDIATION_ORDERED -> VERIFYING, recomputes verified_shortage_cents); action == ESCALATE (REMEDIATION_ORDERED -> ESCALATED, opens a TRUST_SHORTAGE complaint); action == CLOSE (ESCALATED -> CLOSED)."
    roles: [TrustAuditor]
    code: 200
    input: [action, "remediation_days?", "note?"]
    output: TrustAudit
    side_effects: [set status per the action, on REMEDIATION_ORDERED set remediation_due_at = clock now + remediation_days x 86400 and increment remediation_round and move the TrustAccount to RESTRICTED and recompute the Brokerage posture and auto-REJECT every SUBMITTED AdvertisingName of that brokerage with rejection_reason = POSTURE_RESTRICTED, on VERIFY_REMEDIATION persist verified_shortage_cents and return to REMEDIATION_ORDERED when it is still positive, on CLOSED with verified_shortage_cents == 0 return the TrustAccount to OPEN, on ESCALATE create a Complaint in INVESTIGATION with allegation_type = TRUST_SHORTAGE and source_audit_id = this audit and respondent_licensee_id = the brokerage's designated broker]
  - method: POST
    path: "/commission/compliance-sweeps"
    description: "Idempotent housekeeping sweep evaluated against the logical clock in five fixed steps: (1) expire ACTIVE licences whose license_expires_at <= now, (2) escalate REMEDIATION_ORDERED audits whose remediation_due_at < now, (3) default ISSUED orders whose fine_due_at < now and fine_paid_cents < fine_cents, (4) restore SUSPENDED licensees whose suspension_ends_at <= now when the driving order is SATISFIED, (5) suspend PROBATION providers whose invalidated_credit_hours >= 60. Steps run strictly in this order; within a step rows are processed in created_at ASC order."
    roles: [LicensingAnalyst]
    code: 200
    input: []
    output: "{ expired_licensee_count: integer, escalated_audit_count: integer, defaulted_order_count: integer, restored_licensee_count: integer, suspended_provider_count: integer }"
    side_effects: [apply the five steps above, recompute every touched Brokerage.overdue_remediation_count and supervision_posture, create the escalation complaints of step 2]
  # ------------------------------------------------- complaint writes (4)
  - method: POST
    path: "/commission/complaints"
    description: "Intake a complaint in SUBMITTED status. case_number is minted as CMP-######; filed_at = clock now; statute_deadline_at = filed_at + 180 days; respondent_brokerage_id is copied from the respondent licensee's sponsoring_brokerage_id at intake; priority_score is the intake variant."
    roles: [Public, LicensingAnalyst, CommissionCounsel]
    code: 201
    input: [complainant_name, respondent_licensee_id, allegation_type, alleged_loss_cents, "narrative?"]
    output: Complaint
    side_effects: [mint case_number, set status = SUBMITTED, stamp filed_at and statute_deadline_at, copy respondent_brokerage_id from the respondent's sponsoring_brokerage_id, set screener_user_id = X-User-ID, set amendment_count = 0, compute priority_score with the intake variant, increment Brokerage.open_complaint_count and recompute supervision_posture]
  - method: POST
    path: "/commission/complaints/{id}/disposition"
    description: "Single screening/investigation disposition endpoint. disposition == INVESTIGATE (SUBMITTED -> INVESTIGATION, sets investigator_user_id and drives the respondent to discipline_status UNDER_INVESTIGATION); DISMISS (SUBMITTED -> DISMISSED); REQUEST_AMENDMENT (INVESTIGATION -> AMENDMENT_REQUESTED); PROBABLE_CAUSE (INVESTIGATION -> PROBABLE_CAUSE, gated on the investigation-variant priority_score and on the statute deadline); CLOSE_NO_ACTION (INVESTIGATION -> CLOSED_NO_ACTION)."
    roles: [CommissionCounsel]
    code: 200
    input: [disposition, "investigator_user_id?", "note?"]
    output: Complaint
    side_effects: [set status per the disposition, on INVESTIGATE set investigator_user_id and move the respondent Licensee.discipline_status to UNDER_INVESTIGATION and recompute the brokerage posture, on REQUEST_AMENDMENT increment amendment_count, on DISMISS or CLOSE_NO_ACTION move the respondent's discipline_status to CLEARED when no other open complaint remains and decrement Brokerage.open_complaint_count and recompute supervision_posture, recompute priority_score under the variant selected by the new status]
  - method: POST
    path: "/commission/complaints/{id}/amendments"
    description: "The complainant supplies the requested amendment, returning the case to INVESTIGATION (AMENDMENT_REQUESTED -> INVESTIGATION) and re-scoring it. Barred at or after statute_deadline_at."
    roles: [Public, LicensingAnalyst]
    code: 200
    input: [amendment_note, "amended_alleged_loss_cents?"]
    output: Complaint
    side_effects: [set status = INVESTIGATION, overwrite alleged_loss_cents when amended_alleged_loss_cents is supplied, recompute priority_score with the investigation variant]
  - method: POST
    path: "/commission/complaints/{id}/consent-agreements"
    description: "Open consent negotiation on a PROBABLE_CAUSE complaint (PROBABLE_CAUSE -> CONSENT_PENDING) by offering round 1. offered_by_user_id is the acting counsel's X-User-ID and is later barred from executing the same agreement."
    roles: [CommissionCounsel]
    code: 201
    input: [proposed_sanction_type, proposed_fine_cents, proposed_suspension_days]
    output: ConsentAgreement
    side_effects: [set status = OFFERED, set round_number = 1, set offered_by_user_id = X-User-ID, move the Complaint to CONSENT_PENDING]
  # ------------------------------------------------- consent writes (2)
  - method: POST
    path: "/commission/consent-agreements/{id}/respondent-response"
    description: "The respondent answers the current offer. action == ACCEPT (OFFERED -> ACCEPTED); action == COUNTER (OFFERED -> COUNTERED, including at the final round - a counter never terminates the negotiation by itself)."
    roles: [Respondent]
    code: 200
    input: [action, "counter_fine_cents?", "counter_suspension_days?"]
    output: ConsentAgreement
    side_effects: [set status per the action, record responded_by_user_id = X-User-ID, on COUNTER store counter_fine_cents and counter_suspension_days and leave round_number untouched]
  - method: POST
    path: "/commission/consent-agreements/{id}/commission-action"
    description: "Counsel's move. action == REVISE (COUNTERED -> OFFERED, increments round_number, requires proposed_fine_cents and proposed_suspension_days, refused with ERR_CONSENT_ROUND_LIMIT once round_number == 3); action == WITHDRAW (COUNTERED -> REJECTED, returning the Complaint to PROBABLE_CAUSE); action == EXECUTE (ACCEPTED -> EXECUTED) which issues the SanctionOrder via CASCADE L1 and MUST be performed by a different X-User-ID than offered_by_user_id."
    roles: [CommissionCounsel]
    code: 200
    input: [action, "proposed_fine_cents?", "proposed_suspension_days?"]
    output: ConsentAgreement
    side_effects: [on REVISE increment round_number and overwrite the proposed_* fields and set status = OFFERED, on WITHDRAW set status = REJECTED and return the Complaint to PROBABLE_CAUSE, on EXECUTE set status = EXECUTED and executed_by_user_id = X-User-ID and create a SanctionOrder (source CONSENT, status ISSUED) and move the Complaint to ADJUDICATED and drive the respondent's discipline_status to SANCTIONED plus the license_status consequence of the sanction_type, recompute the brokerage posture]
  # ------------------------------------------------- hearing writes (2)
  - method: POST
    path: "/commission/complaints/{id}/hearings"
    description: "Schedule a formal hearing on a PROBABLE_CAUSE complaint (PROBABLE_CAUSE -> HEARING_SCHEDULED). The panel chair must not be the complaint's investigator; the room needs a 30-minute turnover buffer and the chair needs a clear half-open window."
    roles: [CommissionCounsel]
    code: 201
    input: [panel_chair_user_id, hearing_room, scheduled_start_at, scheduled_end_at]
    output: Hearing
    side_effects: [set status = SCHEDULED, set continuance_count = 0, move the Complaint to HEARING_SCHEDULED, move the respondent Licensee.discipline_status UNDER_INVESTIGATION -> PENDING_HEARING, recompute the brokerage posture]
  - method: POST
    path: "/commission/hearings/{id}/disposition"
    description: "Panel chair's move. action == CONVENE (SCHEDULED -> CONVENED, only at or after scheduled_start_at); action == CONTINUE (CONVENED -> CONTINUED -> SCHEDULED with the supplied rescheduled window and optional new room, capped at 2 continuances); action == DECIDE (CONVENED -> DECIDED) with finding == VIOLATION_FOUND issuing the SanctionOrder via CASCADE L1 or finding == NO_VIOLATION closing the complaint."
    roles: [HearingPanelChair]
    code: 200
    input: [action, "finding?", "sanction_type?", "fine_cents?", "suspension_days?", "rescheduled_start_at?", "rescheduled_end_at?", "hearing_room?"]
    output: Hearing
    side_effects: [on CONVENE stamp convened_at, on CONTINUE increment continuance_count and rewrite scheduled_start_at / scheduled_end_at / hearing_room and re-run both overlap rules, on DECIDE stamp decided_at and record finding and (VIOLATION_FOUND) create a SanctionOrder (source HEARING, status ISSUED) plus move the Complaint to ADJUDICATED and cascade the licence consequence of the sanction_type, or (NO_VIOLATION) move the Complaint to CLOSED_NO_ACTION and the respondent's discipline_status to CLEARED, recompute the brokerage posture]
  # ------------------------------------------------- sanction / fund writes (5)
  - method: POST
    path: "/commission/sanction-orders/{id}/fine-payments"
    description: "Record a fine payment against an ISSUED or IN_DEFAULT order. 100% of every payment is credited into the recovery fund. The order becomes SATISFIED once fine_paid_cents reaches fine_cents."
    roles: [Respondent, LicensingAnalyst]
    code: 200
    input: [amount_cents, paid_on]
    output: SanctionOrder
    side_effects: [increase fine_paid_cents and fund_credited_cents by amount_cents, increase RecoveryFund.balance_cents and RecoveryFund.fine_credits_cents by amount_cents and bump RecoveryFund.version, set status = SATISFIED when fine_paid_cents == fine_cents]
  - method: POST
    path: "/commission/sanction-orders/{id}/vacatur"
    description: "Vacate an order on reconsideration (ISSUED / SATISFIED / IN_DEFAULT -> VACATED), firing the five-step COMPENSATION chain that unwinds every side effect the order ever produced. The acting chair must differ from the chair who decided the driving hearing."
    roles: [HearingPanelChair]
    code: 200
    input: [vacatur_reason]
    output: SanctionOrder
    side_effects: [set status = VACATED and stamp vacated_at, COMPENSATION 1 reverse the fine credits out of the RecoveryFund and bump RecoveryFund.version, COMPENSATION 2 claw back every PAID / PARTIALLY_PAID claim, COMPENSATION 3 deny every ELIGIBLE claim with denial_reason ORDER_VACATED, COMPENSATION 4 restore the respondent's license_status and discipline_status, COMPENSATION 5 recompute the respondent Licensee.prior_sanction_count and recovery_paid_cents (a VACATED order counts for neither) and recompute the sponsoring Brokerage.supervision_posture]
  - method: POST
    path: "/commission/sanction-orders/{id}/recovery-claims"
    description: "File a recovery fund claim against an order. The claim is auto-evaluated in the same request: FILED -> ELIGIBLE, or FILED -> DENIED with denial_reason WINDOW_CLOSED / ORDER_NOT_DISCIPLINARY / ORDER_VACATED."
    roles: [Public, RecoveryFundTrustee]
    code: 201
    input: [claimant_name, claimed_loss_cents]
    output: RecoveryFundClaim
    side_effects: [stamp filed_at, set awarded_cents = 0, run the same-request eligibility evaluation and set status plus denial_reason]
  - method: POST
    path: "/commission/recovery-fund/appropriations"
    description: "Credit a legislative appropriation into the singleton fund."
    roles: [RecoveryFundTrustee]
    code: 200
    input: [amount_cents, "appropriation_note?"]
    output: RecoveryFund
    side_effects: [increase balance_cents and appropriated_cents by amount_cents, bump version]
  - method: POST
    path: "/commission/recovery-fund/disbursements"
    description: "Run the award waterfall over one order's ELIGIBLE / PARTIALLY_PAID claims in created_at ASC order per calculations.recovery_fund_award_waterfall. Requires expected_recovery_fund_version and bumps RecoveryFund.version."
    roles: [RecoveryFundTrustee]
    code: 200
    input: [sanction_order_id, expected_recovery_fund_version]
    output: "{ total_awarded_cents: integer, assessment_cents: integer, balance_cents_after: integer, fund_version: integer, paid_claim_count: integer, partially_paid_claim_count: integer, shaved_claim_id: string }"
    side_effects: [award each candidate claim and set its status to PAID or PARTIALLY_PAID, increase RecoveryFund.awarded_cents and assessment_cents, decrease balance_cents by (total_awarded + assessment), increase the respondent Licensee.recovery_paid_cents by total_awarded, bump RecoveryFund.version]
  # ------------------------------------------------- education writes (5)
  - method: POST
    path: "/commission/education-providers"
    description: "Register an education provider in PENDING status."
    roles: [LicensingAnalyst]
    code: 201
    input: [name, "admin_user_id?"]
    output: EducationProvider
    side_effects: [set status = PENDING, set admin_user_id from input or null, set suspended_instructor_count = 0, set invalidated_credit_hours = 0]
  - method: POST
    path: "/commission/education-providers/{id}/approval"
    description: "Approve a PENDING provider or reinstate a PROBATION provider (PENDING / PROBATION -> APPROVED). approval_years defaults to 2."
    roles: [LicensingAnalyst]
    code: 200
    input: ["approval_years?"]
    output: EducationProvider
    side_effects: [set status = APPROVED, stamp approved_at = clock now and approval_expires_at = clock now + approval_years x 365 days]
  - method: POST
    path: "/commission/education-providers/{id}/instructors"
    description: "Enrol an instructor under an APPROVED provider, optionally linked to a licensee. The instructor starts PENDING."
    roles: [ProviderAdmin, LicensingAnalyst]
    code: 201
    input: ["licensee_id?", full_name, credential_type]
    output: Instructor
    side_effects: [set status = PENDING]
  - method: POST
    path: "/commission/instructors/{id}/approval"
    description: "Approve a PENDING instructor (PENDING -> APPROVED). Only an APPROVED provider's instructors may be approved."
    roles: [LicensingAnalyst]
    code: 200
    input: ["approval_note?"]
    output: Instructor
    side_effects: [set status = APPROVED, stamp approved_at]
  - method: POST
    path: "/commission/course-completions"
    description: "Report one completed course for one licensee. CE_CORE and CE_ELECTIVE hours count toward ce_hours_valid for the licensee's current CE period; PRELICENSE hours count toward Licensee.prelicense_hours."
    roles: [ProviderAdmin, LicensingAnalyst]
    code: 201
    input: [licensee_id, instructor_id, education_provider_id, course_type, credit_hours, completed_on]
    output: CourseCompletion
    side_effects:
      - "set credit_status = VALID"
      - "add credit_hours to Licensee.ce_hours_valid when course_type IN {CE_CORE, CE_ELECTIVE} and completed_on >= ce_period_start_on"
      - "add credit_hours to Licensee.prelicense_hours when course_type == PRELICENSE"
      - "recompute Licensee.ce_deficient against ce_hours_required"
  # ------------------------------------------------- advertising writes (2)
  - method: POST
    path: "/commission/advertising-names"
    description: "Submit a team, DBA or branch advertising name for approval. normalized_name and prohibited_term_hits are computed per calculations.advertising_name_normalization; the row starts SUBMITTED."
    roles: [Broker, LicensingAnalyst]
    code: 201
    input: [brokerage_id, "team_lead_licensee_id?", kind, name_text]
    output: AdvertisingName
    side_effects: [compute normalized_name and prohibited_term_hits, set status = SUBMITTED, reject a normalized_name already held by a SUBMITTED or APPROVED row]
  - method: POST
    path: "/commission/advertising-names/{id}/review"
    description: "Analyst review. decision == APPROVE (SUBMITTED -> APPROVED, re-runs the prohibited-term, team-word, uniqueness, team-lead and brokerage-posture gates against current state); decision == REJECT (SUBMITTED -> REJECTED); decision == REVOKE (APPROVED -> REVOKED)."
    roles: [LicensingAnalyst]
    code: 200
    input: [decision, "rejection_reason?"]
    output: AdvertisingName
    side_effects: [set status per the decision, record reviewed_by_user_id = X-User-ID, store rejection_reason on a rejection]
  # ------------------------------------------------- test-driving (1)
  - method: POST
    path: "/commission/_clock/set_current_utc"
    description: "Set the server's logical UTC clock, which every deadline, window, expiry, CE-period and elapsed-month rule in this scaffold reads. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z (the mandatory startup default); it MUST NOT fall back to real wall-clock time."
    roles: [LicensingAnalyst, TrustAuditor, CommissionCounsel, HearingPanelChair, RecoveryFundTrustee]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: [advance or rewind the logical clock only; no entity is mutated and no sweep is implied]

errors:
  # --- authentication / authorization
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or X-User-Role is not one of the ten declared roles"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "the acting role is not listed in the endpoint's roles"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "an entity_backed role acts on a resource that is not its own (X-User-ID does not match the resource's licensee / provider linkage)"
  - id: ERR_AUDITOR_MISMATCH
    http: 403
    condition: "a TrustAuditor other than TrustAudit.auditor_user_id attempts fieldwork or a disposition on that audit"
  - id: ERR_PANEL_CHAIR_MISMATCH
    http: 403
    condition: "a HearingPanelChair other than Hearing.panel_chair_user_id attempts a hearing disposition"
  # --- request shape
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "a required input field is absent, an enum value is not a declared member, an integer breaches its field constraints, or a date/datetime does not parse"
  # --- existence
  - id: ERR_LICENSEE_NOT_FOUND
    http: 404
    condition: "no Licensee with the supplied path or body id"
  - id: ERR_BROKERAGE_NOT_FOUND
    http: 404
    condition: "no Brokerage with the supplied path or body id"
  - id: ERR_TRUST_ACCOUNT_NOT_FOUND
    http: 404
    condition: "no TrustAccount with the supplied path id"
  - id: ERR_TRUST_AUDIT_NOT_FOUND
    http: 404
    condition: "no TrustAudit with the supplied path id"
  - id: ERR_COMPLAINT_NOT_FOUND
    http: 404
    condition: "no Complaint with the supplied path id"
  - id: ERR_CONSENT_AGREEMENT_NOT_FOUND
    http: 404
    condition: "no ConsentAgreement with the supplied path id"
  - id: ERR_HEARING_NOT_FOUND
    http: 404
    condition: "no Hearing with the supplied path id"
  - id: ERR_SANCTION_ORDER_NOT_FOUND
    http: 404
    condition: "no SanctionOrder with the supplied path or body id (including the disbursement payload's sanction_order_id)"
  - id: ERR_EDUCATION_PROVIDER_NOT_FOUND
    http: 404
    condition: "no EducationProvider with the supplied path or body id"
  - id: ERR_INSTRUCTOR_NOT_FOUND
    http: 404
    condition: "no Instructor with the supplied path or body id"
  - id: ERR_COURSE_COMPLETION_NOT_FOUND
    http: 404
    condition: "no CourseCompletion with the supplied path id"
  - id: ERR_ADVERTISING_NAME_NOT_FOUND
    http: 404
    condition: "no AdvertisingName with the supplied path id"
  # --- state preconditions
  - id: ERR_INVALID_STATE
    http: 409
    condition: "the target row's current state is not a declared `from:` state for the requested transition (wrong license_status, audit status, complaint status, consent status, hearing status, order status, provider status, instructor status or advertising status)"
  - id: ERR_TRUST_ACCOUNT_CLOSED
    http: 409
    condition: "a ledger append or audit scheduling is attempted on a CLOSED trust account"
  - id: ERR_ACCOUNT_RESTRICTED_NO_DISBURSEMENT
    http: 409
    condition: "entry_type == DISBURSEMENT on a RESTRICTED trust account (the only barred entry type; DEPOSIT, CORRECTION, OBLIGATION_OPENED and OBLIGATION_RELEASED still append normally)"
  - id: ERR_ORDER_ALREADY_VACATED
    http: 409
    condition: "a second vacatur, or a fine payment, is attempted against a VACATED sanction order (claim filing is exempt: it succeeds with 201 and an auto-denied ORDER_VACATED claim)"
  # --- optimistic concurrency
  - id: ERR_TRUST_ACCOUNT_VERSION_CONFLICT
    http: 412
    condition: "expected_trust_account_version does not equal the account's current version - a prior ledger append or audit cascade has advanced it"
  - id: ERR_BROKERAGE_VERSION_CONFLICT
    http: 412
    condition: "expected_brokerage_version does not equal the target brokerage's current version - a prior affiliation, activation or posture-bearing cascade has advanced it"
  - id: ERR_RECOVERY_FUND_VERSION_CONFLICT
    http: 412
    condition: "expected_recovery_fund_version does not equal the fund's current version - a prior appropriation, fine credit, clawback or disbursement has advanced it"
  # --- business: safety / supervision integrity
  - id: ERR_BROKERAGE_POSTURE_BLOCKED
    http: 409
    condition: "the brokerage's supervision_posture is RESTRICTED or FROZEN and the request would add an affiliation, reactivate a licence into it, or approve an advertising name for it"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 409
    condition: "the acting X-User-ID would occupy two incompatible roles in one matter: investigator and panel chair, consent offeror and consent executor, or deciding chair and vacating chair"
  - id: ERR_DISCIPLINE_HOLD
    http: 409
    condition: "a transfer or inactivation is attempted while the licensee's discipline_status is PENDING_HEARING (or SANCTIONED, for a transfer)"
  - id: ERR_PROHIBITED_ADVERTISING_TERM
    http: 422
    condition: "approval is attempted while prohibited_term_hits > 0"
  - id: ERR_TEAM_NAME_IMPLIES_BROKERAGE
    http: 422
    condition: "approval of a kind == TEAM name whose normalized_name contains one of REALTY, REALESTATE, BROKERAGE, COMPANY, AGENCY"
  # --- business: referential integrity
  - id: ERR_TEAM_LEAD_NOT_AFFILIATED
    http: 422
    condition: "a TEAM name has no team_lead_licensee_id, or its lead is not ACTIVE and affiliated with the same brokerage, or a DBA / BRANCH name supplies a team_lead_licensee_id"
  - id: ERR_SUPERVISING_BROKER_INELIGIBLE
    http: 422
    condition: "the supervising broker is not a BROKER, is not ACTIVE, or is not affiliated with the brokerage named in the same request"
  - id: ERR_DESIGNATED_BROKER_NOT_BROKER
    http: 422
    condition: "the designated broker is not person_type BROKER or is not in license_status EXAM_PASSED / ACTIVE"
  - id: ERR_INSTRUCTOR_PROVIDER_MISMATCH
    http: 422
    condition: "the education_provider_id in a course completion does not equal the instructor's education_provider_id"
  - id: ERR_PROVIDER_NOT_APPROVED
    http: 409
    condition: "the education provider is not APPROVED when enrolling an instructor, approving an instructor, or reporting a completion"
  - id: ERR_INSTRUCTOR_NOT_APPROVED
    http: 409
    condition: "the instructor is not APPROVED when a completion is reported"
  - id: ERR_CORRECTION_TARGET_NOT_FOUND
    http: 422
    condition: "a CORRECTION entry names a transaction_reference with no matching DISBURSEMENT on the same trust account"
  - id: ERR_TRUST_ACCOUNT_REQUIRED
    http: 409
    condition: "activation of a brokerage with trust_account_required == true and no OPEN ESCROW trust account"
  # --- business: constraint satisfaction
  - id: ERR_ADVERTISING_NAME_TAKEN
    http: 409
    condition: "another AdvertisingName with the same normalized_name is in status SUBMITTED or APPROVED"
  - id: ERR_DUPLICATE_TRANSACTION_REFERENCE
    http: 409
    condition: "(trust_account_id, entry_type, transaction_reference) already exists"
  - id: ERR_SUPERVISION_RATIO_EXCEEDED
    http: 409
    condition: "the target brokerage already supervises SUPERVISION_RATIO_MAX (25) licensees"
  - id: ERR_CONSENT_ROUND_LIMIT
    http: 409
    condition: "a REVISE is attempted when round_number already equals MAX_CONSENT_ROUNDS (3)"
  - id: ERR_CONTINUANCE_LIMIT
    http: 409
    condition: "a CONTINUE is attempted when continuance_count already equals MAX_CONTINUANCES (2)"
  - id: ERR_AMENDMENT_LIMIT
    http: 409
    condition: "a REQUEST_AMENDMENT is attempted when amendment_count already equals MAX_AMENDMENTS (2)"
  - id: ERR_EXAM_ATTEMPTS_EXHAUSTED
    http: 409
    condition: "a fourth examination attempt is recorded (exam_attempt_count already equals MAX_EXAM_ATTEMPTS (3))"
  - id: ERR_PRELICENSE_HOURS_INSUFFICIENT
    http: 422
    condition: "prelicense_hours below the person_type requirement (SALESPERSON 90, BROKER 180) when an exam result is recorded"
  - id: ERR_CE_HOURS_INSUFFICIENT
    http: 409
    condition: "reactivation is attempted while ce_hours_valid < ce_hours_required, or a transfer is attempted while the ACTIVE licensee is still ce_deficient (ce_hours_valid < 12 in the current CE period)"
  - id: ERR_PROBABLE_CAUSE_SCORE_TOO_LOW
    http: 409
    condition: "the investigation-variant priority_score is below PROBABLE_CAUSE_MIN_SCORE (40)"
  - id: ERR_CONSENT_ALREADY_OPEN
    http: 409
    condition: "a consent round or a hearing is opened while another consent agreement (OFFERED / COUNTERED / ACCEPTED) or hearing (SCHEDULED / CONVENED / CONTINUED) is live on the same complaint"
  # --- business: temporal
  - id: ERR_HEARING_ROOM_CONFLICT
    http: 409
    condition: "the requested room window is within the 30-minute turnover buffer of another live hearing in the same room (exact adjacency conflicts; a 30-minute gap does not)"
  - id: ERR_PANEL_CHAIR_DOUBLE_BOOKED
    http: 409
    condition: "the requested window intersects another live hearing chaired by the same panel_chair_user_id under half-open interval semantics (exact adjacency is allowed)"
  - id: ERR_AUDITOR_WINDOW_CAPACITY
    http: 409
    condition: "the auditor already has MAX_CONCURRENT_AUDIT_WINDOWS (2) live audits whose half-open fieldwork windows intersect the requested one"
  - id: ERR_STATUTE_DEADLINE_PASSED
    http: 409
    condition: "probable cause or an amendment is attempted at or after Complaint.statute_deadline_at"
  - id: ERR_CLAIM_WINDOW_CLOSED
    http: 409
    condition: "a disbursement is attempted at or after SanctionOrder.effective_at + CLAIM_WINDOW_DAYS (365)"
  - id: ERR_FIELDWORK_NOT_STARTED
    http: 409
    condition: "fieldwork is opened before TrustAudit.fieldwork_start_at"
  - id: ERR_HEARING_NOT_STARTED
    http: 409
    condition: "a CONVENE is attempted before Hearing.scheduled_start_at"
  # --- business: fiscal
  - id: ERR_FUND_RESERVE_FLOOR
    http: 409
    condition: "RecoveryFund.balance_cents is at or below FUND_RESERVE_FLOOR_CENTS (500000) so nothing is distributable"
  - id: ERR_LICENSEE_CAP_EXHAUSTED
    http: 409
    condition: "the respondent licensee's recovery_paid_cents has already reached PER_LICENSEE_CAP_CENTS (5000000)"
  - id: ERR_NO_ELIGIBLE_CLAIMS
    http: 409
    condition: "the order has no ELIGIBLE / PARTIALLY_PAID claim, or the waterfall produces total_awarded == 0"
  - id: ERR_PAYMENT_EXCEEDS_BALANCE
    http: 422
    condition: "amount_cents exceeds fine_cents - fine_paid_cents"
  - id: ERR_REINSTATEMENT_FEE_MISMATCH
    http: 422
    condition: "reinstatement_fee_paid_cents differs from calculations.reactivation_fee_assessment (under- or over-payment)"

roles:
  - name: LicensingAnalyst
    description: "commission licensing staff: applications, examinations, affiliations, brokerage registration, provider and instructor approval, advertising-name review and the compliance sweep"
    identity: opaque
    exclusive_operations: [create licensee, record exam result, create or change affiliation, register and activate brokerage, approve education provider, approve instructor, review advertising name, run compliance sweep]
    shared_operations: [read licensees and brokerages, open trust account, append ledger entry, schedule audit, intake complaint, record fine payment, enrol instructor, report course completion, submit advertising name, change licensee status, set the logical clock]
  - name: TrustAuditor
    description: "field auditor who examines brokerage trust accounts, computes shortages, orders remediation, verifies cures and escalates failures into complaints"
    identity: opaque
    exclusive_operations: [open fieldwork, issue findings, verify remediation, escalate audit, close audit]
    shared_operations: [schedule audit, read trust accounts and ledger entries, read licensees and brokerages, read complaints, set the logical clock]
  - name: CommissionCounsel
    description: "prosecuting counsel: screening dispositions, investigations, probable cause, consent negotiation and hearing scheduling"
    identity: opaque
    exclusive_operations: [screen or dispose complaint, request amendment, find probable cause, offer consent agreement, revise or execute consent agreement, schedule hearing]
    shared_operations: [intake complaint, read complaints and consent agreements and hearings, read sanction orders, set the logical clock]
  - name: HearingPanelChair
    description: "presiding officer of the formal hearing panel; also the only role that can vacate an order on reconsideration - and never the chair who decided it"
    identity: opaque
    exclusive_operations: [convene hearing, continue hearing, decide hearing, vacate sanction order]
    shared_operations: [read complaints and hearings and sanction orders, read licensees and brokerages, set the logical clock]
  - name: RecoveryFundTrustee
    description: "trustee of the recovery fund: appropriations and the award waterfall"
    identity: opaque
    exclusive_operations: [credit appropriation, run disbursement waterfall]
    shared_operations: [file recovery claim, read recovery fund and claims, read sanction orders and licensees, set the logical clock]
  - name: Broker
    description: "an ACTIVE licensee of person_type BROKER acting for a brokerage: trust account operation, advertising submissions and self-service status changes"
    identity: "entity_backed:Licensee"
    exclusive_operations: []
    shared_operations: [open trust account, append ledger entry, submit advertising name, change own licensee status, read own licensee and brokerage, read own trust accounts and ledger entries, read own course completions]
  - name: Salesperson
    description: "an ACTIVE licensee of person_type SALESPERSON: self-service inactivation and reactivation, own record reads"
    identity: "entity_backed:Licensee"
    exclusive_operations: []
    shared_operations: [change own licensee status, read own licensee, read own brokerage, read own course completions, read advertising names]
  - name: Respondent
    description: "the licensee named in a disciplinary matter, acting on the consent agreement and the fine payments of that matter only"
    identity: "entity_backed:Licensee"
    exclusive_operations: [accept or counter a consent offer]
    shared_operations: [record fine payment, read own complaint, read own consent agreements and hearings, read own sanction orders, read own licensee]
  - name: ProviderAdmin
    description: "administrator of an approved education provider: instructor enrolment and completion reporting"
    identity: "entity_backed:EducationProvider"
    exclusive_operations: []
    shared_operations: [enrol instructor, report course completion, read own provider and instructors, read own course completions, read licensees]
  - name: Public
    description: "unauthenticated-equivalent public actor: complaint intake, complaint amendment, recovery claim filing and public reads"
    identity: opaque
    exclusive_operations: [file a public complaint amendment]
    shared_operations: [intake complaint, file recovery claim, read complaints, read sanction orders, read recovery fund and claims, read advertising names]
