          setup:
            - "Event still DRAFT (never opened), capacity 5."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /studio-ops/studios"
              payload: { name: "P1", room_capacity_seats: 10 }
              as: StudioManager
              captures: { sid: $.data.id }
            - call: "POST /studio-ops/events"
              payload: { studio_id: "${sid}", title: "Draft Class", event_type: "PUBLIC_CLASS", start_utc: "2026-04-05T10:00:00Z", end_utc: "2026-04-05T12:00:00Z", seats_capacity: 5, price_cents_per_seat: 4500 }
