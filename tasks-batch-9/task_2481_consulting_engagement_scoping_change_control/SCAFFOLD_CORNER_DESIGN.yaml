scaffold_corner_design:
- section: entities
  instances:
  - name: client_creation_returns_defaults_and_system_fields
    claim_type: creation
    grounds:
    - entities.Client
    - endpoints[POST /consulting/clients]
    - entities.Client.fields.status
    distinguishing_aspect: 'A single POST /consulting/clients returns 201 with every declared field: the three computed/system defaults (status ACTIVE, completed_engagement_count 0, at_risk_engagement_count 0) are server-set and adverse_party_codes echoes the submitted array.'
    test_recipe:
      setup:
      - clock at 2026-08-03T09:00:00Z, empty database
      setup_api_calls: &id001
      - call: POST /consulting/_clock/set_current_utc
        payload:
          current_utc: '2026-08-03T09:00:00Z'
        as: PracticeAdmin
      trigger:
      - call: POST /consulting/clients
        payload:
          name: Northwind Retail Group
          client_code: NWR-001
          industry_code: RETAIL
          decision_process: COMMITTEE
          stated_budget_authority_cents: 80000000
          adverse_party_codes:
          - ACME-CORP
        as: PracticeAdmin
        captures:
          cl_id: $.data.id
      assert:
      - HTTP 201 with response_type 'object' and meta.api_request_id present
      - Client.${cl_id}.status == ACTIVE, completed_engagement_count == 0, at_risk_engagement_count == 0
      - Client.${cl_id}.client_code == 'NWR-001', decision_process == COMMITTEE, stated_budget_authority_cents == 80000000
      - Client.${cl_id}.adverse_party_codes == ['ACME-CORP'] and id, created_at, updated_at, version are all present
  - name: consultant_retrieval_returns_stored_row
    claim_type: retrieval
    grounds:
    - endpoints[GET /consulting/consultants/{id}]
    - entities.Consultant
    distinguishing_aspect: GET /consulting/consultants/{id} returns the exact row written by the create call, including the computed active_lead_deliverable_count default of 0.
    test_recipe:
      setup:
      - clock at 2026-08-03T09:00:00Z; one consultant P. Reyes (PARTNER, OPS, cost_rate 62000) exists
      setup_api_calls:
      - call: POST /consulting/_clock/set_current_utc
        payload:
          current_utc: '2026-08-03T09:00:00Z'
        as: PracticeAdmin
      - call: POST /consulting/clients
        payload:
          name: Northwind Retail Group
          client_code: NWR-001
          industry_code: RETAIL
          decision_process: COMMITTEE
          stated_budget_authority_cents: 80000000
          adverse_party_codes:
          - ACME-CORP
        as: PracticeAdmin
        captures:
          cl_id: $.data.id
      - call: POST /consulting/consultants
        payload:
          name: P. Reyes
          grade: PARTNER
          practice_code: OPS
          cost_rate_cents_per_hour: 62000
        as: PracticeAdmin
        captures:
          p_id: $.data.id
      trigger:
      - call: GET /consulting/consultants/${p_id}
        payload: {}
        as: EngagementPartner
        as_user_id: ${p_id}
      assert:
      - HTTP 200 and data.id == ${p_id}
      - Consultant.${p_id}.grade == PARTNER, practice_code == 'OPS', cost_rate_cents_per_hour == 62000
      - Consultant.${p_id}.quality_reviewer_certified == false and active_lead_deliverable_count == 0
  - name: opportunity_listing_paginates_with_total_count
    claim_type: listing
    grounds:
    - endpoints[GET /consulting/opportunities]
    - response_envelope.pagination_fields
    distinguishing_aspect: With three Opportunities for one client, GET /consulting/opportunities?client_id=..&limit=2&offset=0 returns 2 rows with total_count 3 and has_more true, and offset=2 returns the last row with has_more false.
    test_recipe:
      setup:
      - clock at 2026-08-03T09:00:00Z; three SCREENING Opportunities exist for the same client
      setup_api_calls:
      - call: POST /consulting/_clock/set_current_utc
        payload:
          current_utc: '2026-08-03T09:00:00Z'
        as: PracticeAdmin
      - call: POST /consulting/clients
        payload:
          name: Northwind Retail Group
          client_code: NWR-001
          industry_code: RETAIL
          decision_process: COMMITTEE
          stated_budget_authority_cents: 80000000
          adverse_party_codes:
          - ACME-CORP
        as: PracticeAdmin
        captures:
          cl_id: $.data.id
      - call: POST /consulting/consultants
        payload:
          name: P. Reyes
          grade: PARTNER
          practice_code: OPS
          cost_rate_cents_per_hour: 62000
        as: PracticeAdmin
        captures:
          p_id: $.data.id
      - call: POST /consulting/consultants
        payload:
          name: M. Osei
          grade: MANAGER
          practice_code: OPS
          cost_rate_cents_per_hour: 38000
        as: PracticeAdmin
        captures:
          m_id: $.data.id
      - call: POST /consulting/consultants
        payload:
          name: C. Vaz
          grade: CONSULTANT
          practice_code: OPS
          cost_rate_cents_per_hour: 24000
        as: PracticeAdmin
        captures:
          c_id: $.data.id
      - call: POST /consulting/consultants
        payload:
          name: Q. Haddad
          grade: MANAGER
          practice_code: OPS
          cost_rate_cents_per_hour: 40000
          quality_reviewer_certified: true
        as: PracticeAdmin
        captures:
          qr_id: $.data.id
      - call: POST /consulting/consultants
        payload:
          name: L. Brandt
          grade: PARTNER
          practice_code: OPS
          cost_rate_cents_per_hour: 70000
        as: PracticeAdmin
        captures:
          fl_id: $.data.id
      - call: POST /consulting/opportunities
        payload:
          client_id: ${cl_id}
          owner_partner_consultant_id: ${p_id}
          scoping_manager_consultant_id: ${m_id}
          requested_practice_code: OPS
          estimated_value_cents: 100000000
          stated_budget_cents: 60000000
          decision_maker_identified: true
          target_start_date: '2026-09-01'
          target_end_date: '2026-12-18'
          objective_summary: Pursuit 1
        as: EngagementPartner
        as_user_id: ${p_id}
        captures:
          o1_id: $.data.id
      - call: POST /consulting/opportunities
        payload:
          client_id: ${cl_id}
          owner_partner_consultant_id: ${p_id}
          scoping_manager_consultant_id: ${m_id}
          requested_practice_code: OPS
          estimated_value_cents: 100000000
          stated_budget_cents: 60000000
          decision_maker_identified: true
          target_start_date: '2026-09-01'
          target_end_date: '2026-12-18'
          objective_summary: Pursuit 2
        as: EngagementPartner
        as_user_id: ${p_id}
        captures:
          o2_id: $.data.id
      - call: POST /consulting/opportunities
        payload:
          client_id: ${cl_id}
          owner_partner_consultant_id: ${p_id}
          scoping_manager_consultant_id: ${m_id}
          requested_practice_code: OPS
          estimated_value_cents: 100000000
          stated_budget_cents: 60000000
          decision_maker_identified: true
          target_start_date: '2026-09-01'
          target_end_date: '2026-12-18'
          objective_summary: Pursuit 3
        as: EngagementPartner
        as_user_id: ${p_id}
        captures:
          o3_id: $.data.id
      trigger:
      - call: GET /consulting/opportunities?client_id=${cl_id}&limit=2&offset=0
        payload: {}
        as: EngagementPartner
        as_user_id: ${p_id}
      - call: GET /consulting/opportunities?client_id=${cl_id}&limit=2&offset=2
        payload: {}
        as: EngagementPartner
        as_user_id: ${p_id}
      assert:
      - the first call returns response_type 'array' with 2 items, total_count == 3, has_more == true, limit == 2, offset == 0
      - the second call returns 1 item with total_count == 3 and has_more == false
      - no id appears in both pages
  - name: opportunity_not_found_returns_404
    claim_type: not_found
    grounds:
    - errors[ERR_OPPORTUNITY_NOT_FOUND]
    - validations[priority=30]
    distinguishing_aspect: A well-formed but non-existent Opportunity id in the path returns 404 ERR_OPPORTUNITY_NOT_FOUND, not 422 or an empty 200.
    test_recipe:
      setup:
      - clock at 2026-08-03T09:00:00Z; consultants exist but no Opportunity has ever been created
      setup_api_calls:
      - call: POST /consulting/_clock/set_current_utc
        payload:
          current_utc: '2026-08-03T09:00:00Z'
        as: PracticeAdmin
      - call: POST /consulting/clients
        payload:
          name: Northwind Retail Group
          client_code: NWR-001
          industry_code: RETAIL
          decision_process: COMMITTEE
          stated_budget_authority_cents: 80000000
          adverse_party_codes:
          - ACME-CORP
        as: PracticeAdmin
        captures:
          cl_id: $.data.id
      - call: POST /consulting/consultants
        payload:
          name: P. Reyes
          grade: PARTNER
          practice_code: OPS
          cost_rate_cents_per_hour: 62000
        as: PracticeAdmin
        captures:
          p_id: $.data.id
      trigger:
      - call: GET /consulting/opportunities/00000000-0000-0000-0000-0000000000ff
        payload: {}
        as: EngagementPartner
        as_user_id: ${p_id}
        captures:
          err_id: $.data.error_id
      assert:
      - HTTP 404 with data.error_id == ERR_OPPORTUNITY_NOT_FOUND for id 00000000-0000-0000-0000-0000000000ff
      - response_type == 'error' and data.message is a non-empty string
