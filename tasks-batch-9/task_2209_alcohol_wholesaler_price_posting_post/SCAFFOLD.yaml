    side_effects: []

  # ---------------------------------------------------------------- compliance audits
  - method: POST
    path: /compliance-audits
    description: "Opens a compliance audit of a wholesaler's off-posted-price exposure for one month."
    roles: [ComplianceOfficer]
    success_code: 201
    input: [wholesaler_id, state_program_id, audit_period_month, expected_wholesaler_version]
    output: ComplianceAudit
    side_effects:
      - "increments the wholesaler's open_audit_count by 1 and increments Wholesaler.version by 1"

  - method: POST
    path: /compliance-audits/{id}/collect
    description: "Collects the wholesaler's flagged invoices for the audited month and records one finding per off-posted line."
    roles: [ComplianceOfficer]
    success_code: 200
    input: []
    output: ComplianceAudit
    side_effects:
      - "creates one AuditFinding per off-posted line of every collected invoice"
      - "moves every collected invoice's audit_status to UNDER_AUDIT and stamps its audit_id"
      - "sets finding_count, total_variance_cents and base_penalty_cents"
      - "increments ComplianceAudit.version by 1"

  - method: POST
    path: /compliance-audits/{id}/assess
    description: "Assesses the collected findings, escalating by the wholesaler's prior violation history."
    roles: [ComplianceOfficer]
    success_code: 200
    input: []
    output: ComplianceAudit
    side_effects:
      - "captures prior_violation_count, sets tier_multiplier and penalty_assessed_cents"
      - "adds the assessed penalty and the finding count to the wholesaler's running totals"
      - "moves every collected invoice's audit_status to ASSESSED"
      - "increments Wholesaler.version by 1 and ComplianceAudit.version by 1"

  - method: POST
    path: /compliance-audits/{id}/close
    description: "Closes an assessed compliance audit."
    roles: [ComplianceOfficer]
    success_code: 200
    input: []
    output: ComplianceAudit
    side_effects:
      - "increments ComplianceAudit.version by 1"

  - method: POST
    path: /compliance-audits/{id}/void
    description: "Voids an assessed compliance audit and reverses every effect the assessment produced."
    roles: [ComplianceOfficer]
    success_code: 200
    input: [void_reason]
    output: ComplianceAudit
    side_effects:
      - "subtracts the assessed penalty and the finding count from the wholesaler's running totals"
      - "returns every collected invoice's audit_status to NOT_AUDITED and clears its audit_id"
      - "increments Wholesaler.version by 1 and ComplianceAudit.version by 1"

  - method: GET
    path: /compliance-audits/{id}
    description: "Retrieves one compliance audit including its penalty figures."
    roles: [ComplianceOfficer, FilingAgent, CertifyingOfficer]
    success_code: 200
    input: []
    output: ComplianceAudit
    side_effects: []

  - method: GET
    path: /compliance-audits
    description: "Lists compliance audits."
    roles: [ComplianceOfficer, FilingAgent, CertifyingOfficer]
    success_code: 200
    input: ["wholesaler_id?", "state_program_id?", "audit_period_month?", "status?", "limit?", "offset?"]
    output: ComplianceAudit[]
    side_effects: []

  # ---------------------------------------------------------------- audit findings
  - method: GET
    path: /audit-findings/{id}
    description: "Retrieves one immutable audit finding."
    roles: [ComplianceOfficer, FilingAgent, CertifyingOfficer]
    success_code: 200
    input: []
    output: AuditFinding
    side_effects: []

  - method: GET
    path: /audit-findings
    description: "Lists immutable audit findings."
    roles: [ComplianceOfficer, FilingAgent, CertifyingOfficer]
    success_code: 200
    input: ["audit_id?", "invoice_line_id?", "finding_type?", "limit?", "offset?"]
    output: AuditFinding[]
    side_effects: []

  # ---------------------------------------------------------------- posting run
  - method: POST
    path: /posting-runs
    description: "Advances every posted schedule of a state program whose effective date and hold window have both passed, cascading supersession through items, tiers and schedules."
    roles: [ComplianceOfficer]
    success_code: 200
    input: [state_program_id]
    output: "{ state_program_id: string, run_at: string, processed_schedule_count: integer, effective_schedule_ids: string[], superseded_schedule_ids: string[] }"
    side_effects:
      - "moves every eligible POSTED schedule and its items to EFFECTIVE"
      - "moves each superseded prior item to SUPERSEDED and records supersedes_item_id on the superseding item"
      - "moves every ACTIVE quantity discount tier of a superseded item to INACTIVE"
      - "moves a schedule whose every item is superseded to SUPERSEDED and stamps its superseded_by_schedule_id"

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http_status: 401
    condition: "X-Role header missing or unknown, or X-User-ID missing for an entity-backed role"
    applies_to: ["all"]
  - id: ERR_UNAUTHORIZED
    http_status: 403
    condition: "the named role is not authorized for the endpoint, or X-User-ID does not resolve to an active LicenseeUser whose user_role matches the named role"
    applies_to: ["all"]
  - id: ERR_INVALID_REQUEST
    http_status: 400
    condition: "a required body field is missing, a field has the wrong type, an enum value is not a declared member, a numeric value is out of range, a datetime is not ISO-8601, or an interval is ordered end-before-start"
    applies_to: ["all endpoints with a request body"]
  - id: ERR_STATE_PROGRAM_NOT_FOUND
    http_status: 404
    condition: "the referenced StateProgram does not exist"
    applies_to: ["GET /state-programs/{id}", "POST /wholesalers", "POST /price-schedules", "POST /compliance-audits"]
  - id: ERR_WHOLESALER_NOT_FOUND
    http_status: 404
    condition: "the referenced Wholesaler does not exist"
    applies_to: ["GET /wholesalers/{id}", "GET /wholesalers/{id}/penalty-exposure", "POST /wholesalers/{id}/license-status", "POST /licensee-users", "POST /brands", "POST /price-schedules", "POST /retailer-invoices", "POST /compliance-audits"]
  - id: ERR_LICENSEE_USER_NOT_FOUND
    http_status: 404
    condition: "the referenced LicenseeUser does not exist"
    applies_to: ["GET /licensee-users/{id}"]
  - id: ERR_BRAND_NOT_FOUND
    http_status: 404
    condition: "the referenced Brand does not exist"
    applies_to: ["GET /brands/{id}", "POST /brands/{id}/approve", "POST /brands/{id}/reject", "POST /price-schedule-items"]
  - id: ERR_PRICE_SCHEDULE_NOT_FOUND
    http_status: 404
    condition: "the referenced PriceSchedule does not exist"
    applies_to: ["GET /price-schedules/{id}", "POST /price-schedules/{id}/submit", "POST /price-schedules/{id}/return-for-correction", "POST /price-schedules/{id}/certify", "POST /price-schedules/{id}/withdraw", "POST /price-schedule-items", "POST /combination-sales"]
  - id: ERR_PRICE_SCHEDULE_ITEM_NOT_FOUND
    http_status: 404
    condition: "the referenced PriceScheduleItem does not exist"
    applies_to: ["GET /price-schedule-items/{id}", "GET /price-schedule-items/{id}/posted-price", "POST /quantity-discount-tiers", "POST /combination-sales", "POST /hold-amendments", "POST /error-corrections", "POST /invoice-lines"]
  - id: ERR_QUANTITY_DISCOUNT_TIER_NOT_FOUND
    http_status: 404
    condition: "the referenced QuantityDiscountTier does not exist"
    applies_to: ["GET /quantity-discount-tiers/{id}"]
  - id: ERR_COMBINATION_SALE_NOT_FOUND
    http_status: 404
    condition: "the referenced CombinationSale does not exist"
    applies_to: ["GET /combination-sales/{id}"]
  - id: ERR_HOLD_AMENDMENT_NOT_FOUND
    http_status: 404
    condition: "the referenced HoldAmendment does not exist"
    applies_to: ["GET /hold-amendments/{id}", "POST /hold-amendments/{id}/accept", "POST /hold-amendments/{id}/reject", "POST /hold-amendments/{id}/revoke"]
  - id: ERR_ERROR_CORRECTION_NOT_FOUND
    http_status: 404
    condition: "the referenced ErrorCorrection does not exist"
    applies_to: ["GET /error-corrections/{id}", "POST /error-corrections/{id}/approve", "POST /error-corrections/{id}/deny"]
  - id: ERR_RETAILER_INVOICE_NOT_FOUND
    http_status: 404
    condition: "the referenced RetailerInvoice does not exist"
    applies_to: ["GET /retailer-invoices/{id}", "POST /retailer-invoices/{id}/validate", "POST /invoice-lines"]
  - id: ERR_INVOICE_LINE_NOT_FOUND
    http_status: 404
    condition: "the referenced InvoiceLine does not exist"
    applies_to: ["GET /invoice-lines/{id}"]
  - id: ERR_COMPLIANCE_AUDIT_NOT_FOUND
    http_status: 404
    condition: "the referenced ComplianceAudit does not exist"
    applies_to: ["GET /compliance-audits/{id}", "POST /compliance-audits/{id}/collect", "POST /compliance-audits/{id}/assess", "POST /compliance-audits/{id}/close", "POST /compliance-audits/{id}/void"]
  - id: ERR_AUDIT_FINDING_NOT_FOUND
    http_status: 404
    condition: "the referenced AuditFinding does not exist"
    applies_to: ["GET /audit-findings/{id}"]
  - id: ERR_FORBIDDEN_WHOLESALER_SCOPE
    http_status: 403
    condition: "an entity-backed role acts on a resource that does not belong to the acting LicenseeUser's wholesaler"
    applies_to: ["POST /brands", "POST /price-schedules", "POST /price-schedule-items", "POST /price-schedules/{id}/submit", "POST /price-schedules/{id}/certify", "POST /price-schedules/{id}/withdraw", "POST /quantity-discount-tiers", "POST /combination-sales", "POST /hold-amendments", "POST /error-corrections", "POST /retailer-invoices", "POST /invoice-lines", "POST /retailer-invoices/{id}/validate"]
  - id: ERR_STALE_SCHEDULE_VERSION
    http_status: 412
    condition: "expected_schedule_version does not equal the amending item's PriceSchedule.version"
    applies_to: ["POST /hold-amendments"]
  - id: ERR_STALE_WHOLESALER_VERSION
    http_status: 412
    condition: "expected_wholesaler_version does not equal Wholesaler.version"
    applies_to: ["POST /compliance-audits"]
  - id: ERR_INVALID_STATE
    http_status: 409
    condition: "the target entity is not in a state from which the requested transition is defined; on POST /hold-amendments the amending item's status is not POSTED; on POST /error-corrections the item's status is neither POSTED nor EFFECTIVE; on POST /invoice-lines the invoice's audit_status is not NOT_AUDITED; on POST /retailer-invoices/{id}/validate the invoice has no lines or its audit_status is not NOT_AUDITED"
    applies_to: ["all transition endpoints", "POST /hold-amendments", "POST /error-corrections", "POST /invoice-lines"]
  - id: ERR_LICENSE_NOT_ACTIVE
    http_status: 409
    condition: "the governing wholesaler's license_status is SUSPENDED"
    applies_to: ["POST /price-schedules/{id}/submit", "POST /retailer-invoices/{id}/validate"]
  - id: ERR_BRAND_NOT_REGISTERED
    http_status: 409
    condition: "a brand referenced by an item of the submitted schedule is not APPROVED, or its registration interval does not contain the schedule's effective_date"
    applies_to: ["POST /price-schedules/{id}/submit"]
  - id: ERR_BRAND_REGISTRATION_OVERLAP
    http_status: 409
    condition: "the requested brand registration interval overlaps an existing non-rejected registration for the same wholesaler, brand name and beverage class"
    applies_to: ["POST /brands"]
  - id: ERR_SELF_REFERENCE_NOT_ALLOWED
    http_status: 409
    condition: "the reference item of a hold amendment belongs to the same wholesaler as the amending item"
    applies_to: ["POST /hold-amendments"]
  - id: ERR_HOLD_WINDOW_CLOSED
    http_status: 409
    condition: "the amending item's post-and-hold window is not open at the current server time"
    applies_to: ["POST /hold-amendments", "POST /hold-amendments/{id}/accept"]
  - id: ERR_HOLD_WINDOW_OVERRUNS_EFFECTIVE
    http_status: 409
    condition: "the post-and-hold window computed at certification would not end strictly before the schedule's effective_date"
    applies_to: ["POST /price-schedules/{id}/certify"]
  - id: ERR_COMBINATION_COOLDOWN_VIOLATION
    http_status: 409
    condition: "the requested combination sale window is not separated from an existing ACTIVE window of the same wholesaler by at least the program's combo_cooldown_days"
    applies_to: ["POST /combination-sales"]
  - id: ERR_DUPLICATE_SCHEDULE_ITEM
    http_status: 409
    condition: "the schedule already carries an item with the same brand, size and bottles per case"
    applies_to: ["POST /price-schedule-items"]
  - id: ERR_DUPLICATE_POSTING_MONTH
    http_status: 409
    condition: "the wholesaler already has a non-withdrawn price schedule for the same posting month"
    applies_to: ["POST /price-schedules"]
  - id: ERR_DUPLICATE_AUDIT_PERIOD
    http_status: 409
    condition: "the wholesaler already has a non-void compliance audit for the same audit period month"
    applies_to: ["POST /compliance-audits"]
  - id: ERR_QUANTITY_DISCOUNT_PROHIBITED
    http_status: 422
    condition: "the governing state program has quantity_discount_allowed set to false"
    applies_to: ["POST /quantity-discount-tiers"]
  - id: ERR_COMBINATION_SALE_PROHIBITED
    http_status: 422
    condition: "the governing state program has combination_sale_allowed set to false"
    applies_to: ["POST /combination-sales"]
  - id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    condition: "the certifying user is the same licensee user recorded in the schedule's filed_by_user_id"
    applies_to: ["POST /price-schedules/{id}/certify"]
  - id: ERR_AMENDMENT_NOT_A_REDUCTION
    http_status: 422
    condition: "new_case_price_cents is greater than or equal to the amending item's current case_price_cents"
    applies_to: ["POST /hold-amendments"]
  - id: ERR_AMENDMENT_BELOW_REFERENCE
    http_status: 422
    condition: "new_case_price_cents is below the reference item's case_price_cents"
    applies_to: ["POST /hold-amendments"]
  - id: ERR_CASE_PRICE_EXCEEDS_UNIT_AGGREGATE
    http_status: 422
    condition: "unit_price_cents multiplied by bottles_per_case is less than case_price_cents"
    applies_to: ["POST /price-schedule-items"]
  - id: ERR_COMBINATION_BELOW_FLOOR
    http_status: 422
    condition: "combined_case_price_cents is below the computed min_allowed_price_cents"
    applies_to: ["POST /combination-sales"]
  - id: ERR_DISCOUNT_EXCEEDS_STATE_CAP
    http_status: 422
    condition: "discount_pct exceeds the program's max_quantity_discount_pct"
    applies_to: ["POST /quantity-discount-tiers"]
  - id: ERR_CORRECTION_EXCEEDS_CLERICAL_LIMIT
    http_status: 422
    condition: "the correction's variance_pct exceeds the clerical limit of 0.10"
    applies_to: ["POST /error-corrections"]
  - id: ERR_CORRECTION_LIMIT_EXCEEDED
    http_status: 409
    condition: "the schedule has already reached the program's max_corrections_per_schedule approved corrections"
    applies_to: ["POST /error-corrections/{id}/approve"]
  - id: ERR_CORRECTION_WINDOW_CLOSED
    http_status: 409
    condition: "the item's correction window has already ended at the current server time"
    applies_to: ["POST /error-corrections"]
  - id: ERR_SCHEDULE_HAS_NO_ITEMS
    http_status: 422
    condition: "the schedule being submitted carries zero price schedule items"
    applies_to: ["POST /price-schedules/{id}/submit"]
  - id: ERR_ZERO_QUANTITY_LINE
    http_status: 422
    condition: "cases_quantity and bottles_quantity are both zero"
    applies_to: ["POST /invoice-lines"]
  - id: ERR_COMBINATION_TOO_FEW_MEMBERS
    http_status: 422
    condition: "member_item_ids contains fewer than two distinct item identifiers"
    applies_to: ["POST /combination-sales"]
  - id: ERR_ITEM_NOT_ON_SAME_SCHEDULE
    http_status: 422
    condition: "a member item of the combination sale does not belong to the declared schedule"
    applies_to: ["POST /combination-sales"]
  - id: ERR_NO_FLAGGED_INVOICES
    http_status: 409
    condition: "no FLAGGED invoice of the audited wholesaler falls inside the audit period month"
    applies_to: ["POST /compliance-audits/{id}/collect"]

# =============================================================================
# Table 7: RBAC Permission Matrix
# =============================================================================
roles:
  - name: FilingAgent
    description: "A licensee user who prepares and files the wholesaler's price schedules, brand registrations, price instruments, amendments, corrections and retailer invoices."
    identity: "entity_backed:LicenseeUser"
    identity_note: "X-User-ID must resolve to an active LicenseeUser whose user_role is FILING_AGENT or DUAL_ROLE."
    exclusive_operations:
      - "POST /brands"
      - "POST /price-schedules"
      - "POST /price-schedule-items"
      - "POST /price-schedules/{id}/submit"
      - "POST /price-schedules/{id}/withdraw"
      - "POST /quantity-discount-tiers"
      - "POST /combination-sales"
      - "POST /hold-amendments"
      - "POST /error-corrections"
      - "POST /retailer-invoices"
      - "POST /invoice-lines"
      - "POST /retailer-invoices/{id}/validate"
    shared_operations:
      - "every GET endpoint"

  - name: CertifyingOfficer
    description: "A licensee user who certifies a filed price schedule, attesting to its accuracy and opening the post-and-hold window."
    identity: "entity_backed:LicenseeUser"
    identity_note: "X-User-ID must resolve to an active LicenseeUser whose user_role is CERTIFYING_OFFICER or DUAL_ROLE."
    exclusive_operations:
      - "POST /price-schedules/{id}/certify"
    shared_operations:
      - "every GET endpoint"

  - name: ComplianceOfficer
    description: "The state regulator who administers the posting program, adjudicates registrations, amendments and corrections, runs posting runs, and conducts off-posted-price audits."
    identity: "opaque"
    identity_note: "Authenticated by the X-Role header alone; no LicenseeUser record backs this role and no X-User-ID is required."
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /state-programs"
      - "POST /wholesalers"
      - "POST /wholesalers/{id}/license-status"
      - "POST /licensee-users"
      - "POST /brands/{id}/approve"
      - "POST /brands/{id}/reject"
      - "POST /price-schedules/{id}/return-for-correction"
      - "POST /hold-amendments/{id}/accept"
      - "POST /hold-amendments/{id}/reject"
      - "POST /hold-amendments/{id}/revoke"
      - "POST /error-corrections/{id}/approve"
      - "POST /error-corrections/{id}/deny"
      - "POST /compliance-audits"
      - "POST /compliance-audits/{id}/collect"
      - "POST /compliance-audits/{id}/assess"
      - "POST /compliance-audits/{id}/close"
      - "POST /compliance-audits/{id}/void"
      - "POST /posting-runs"
    shared_operations:
      - "every GET endpoint"
