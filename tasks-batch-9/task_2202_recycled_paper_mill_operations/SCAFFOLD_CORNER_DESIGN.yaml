          - validations.priority_14
          - validations.priority_15
          - validations.priority_16
          - validations.priority_17
          - validations.priority_18
          - validations.priority_19
        distinguishing_aspect: "The path-existence ladder is per-collection, not a single generic 404: the same well-formed but unknown UUID must yield ERR_SUPPLIER_NOT_FOUND on /suppliers, ERR_CUSTOMER_NOT_FOUND on /customers, ERR_PURCHASE_ORDER_NOT_FOUND on /fiber-purchase-orders, ERR_RECEIPT_NOT_FOUND on /fiber-receipts, ERR_INVENTORY_LOT_NOT_FOUND on /fiber-inventory-lots, ERR_GRADE_CHANGE_NOT_FOUND on /grade-changes, ERR_ROLL_SET_NOT_FOUND on /roll-sets, ERR_ORDER_NOT_FOUND on /customer-orders, ERR_PERMIT_NOT_FOUND on /effluent-permits, ERR_ENV_RECORD_NOT_FOUND on /effluent-readings, /sludge-manifests and /reject-streams alike (one code shared by three collections), and ERR_STEAM_ALLOCATION_NOT_FOUND on /steam-allocations. Every response is 404 and carries no data object."
        test_recipe:
          setup: ["An empty system apart from the clock; no row of any collection exists, so the id 00000000-0000-0000-0000-0000000000ff resolves nowhere."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: MillPlanner
              as_user_id: "planner-1"
          trigger:
            - call: "GET /suppliers/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: FiberBuyer
              as_user_id: "buyer-1"
            - call: "GET /customers/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: MillPlanner
              as_user_id: "planner-1"
            - call: "GET /fiber-purchase-orders/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: FiberBuyer
              as_user_id: "buyer-1"
            - call: "GET /fiber-receipts/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: QualityLab
              as_user_id: "lab-a"
            - call: "GET /fiber-inventory-lots/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: MachineOperator
              as_user_id: "op-1"
            - call: "GET /grade-changes/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: MillPlanner
              as_user_id: "planner-1"
            - call: "GET /roll-sets/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: MillPlanner
              as_user_id: "planner-1"
            - call: "GET /customer-orders/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: MillPlanner
              as_user_id: "planner-1"
            - call: "GET /effluent-permits/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: EnvironmentalOfficer
              as_user_id: "env-a"
            - call: "GET /effluent-readings/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: EnvironmentalOfficer
              as_user_id: "env-a"
            - call: "GET /sludge-manifests/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: EnvironmentalOfficer
              as_user_id: "env-a"
            - call: "GET /reject-streams/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: EnvironmentalOfficer
