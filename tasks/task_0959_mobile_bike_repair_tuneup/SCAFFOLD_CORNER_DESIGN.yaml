  - section: cross_cutting_layers
    instances:
      - name: occ_stale_resequence_returns_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[route-resequence-stale-version]"]
        distinguishing_aspect: "OCC on RouteDay.version: resequence with expected_route_day_version one behind current fails 412; with the current version it succeeds."
        test_recipe:
          setup: ["OPEN route day with two PLANNED stops (version advanced by stop additions)"]
          setup_api_calls:
            - { call: "POST /v1/zones", payload: { name: "Z1", base_callout_fee_cents: 2500 }, as: PlatformAdmin, captures: { zone_id: $.data.id } }
            - { call: "POST /v1/service-tiers", payload: { code: "BASIC", base_price_cents: 4900, included_minutes: 45, overage_rate_cents_per_min: 120, labor_warranty_days: 30 }, as: PlatformAdmin, captures: { tier_id: $.data.id } }
            - { call: "POST /v1/customers", payload: { name: "Ann", email: "ann@x.com", account_kind: "INDIVIDUAL" }, as: Dispatcher, captures: { cust1: $.data.id } }
            - { call: "POST /v1/customers", payload: { name: "Bob", email: "bob@x.com", account_kind: "INDIVIDUAL" }, as: Dispatcher, captures: { cust2: $.data.id } }
            - { call: "POST /v1/bikes", payload: { customer_id: "${cust1}", bike_type: "MECHANICAL" }, as: Dispatcher, captures: { bike1: $.data.id } }
            - { call: "POST /v1/bikes", payload: { customer_id: "${cust2}", bike_type: "MECHANICAL" }, as: Dispatcher, captures: { bike2: $.data.id } }
            - { call: "POST /v1/service-requests", payload: { customer_id: "${cust1}", bike_id: "${bike1}", zone_id: "${zone_id}", tier_id: "${tier_id}", window_start: "2026-05-02T09:00:00Z", window_end: "2026-05-02T11:00:00Z" }, as: Dispatcher, captures: { req1: $.data.id } }
            - { call: "POST /v1/service-requests", payload: { customer_id: "${cust2}", bike_id: "${bike2}", zone_id: "${zone_id}", tier_id: "${tier_id}", window_start: "2026-05-02T12:00:00Z", window_end: "2026-05-02T14:00:00Z" }, as: Dispatcher, captures: { req2: $.data.id } }
            - { call: "POST /v1/mechanics", payload: { name: "Mo", ebike_certified: false, home_zone_id: "${zone_id}" }, as: PlatformAdmin, captures: { mech_id: $.data.id } }
            - { call: "POST /v1/vans", payload: { plate: "VAN-1", zone_id: "${zone_id}", mechanic_id: "${mech_id}", max_stops_per_day: 8 }, as: PlatformAdmin, captures: { van_id: $.data.id } }
            - { call: "POST /v1/route-days", payload: { van_id: "${van_id}", date: "2026-05-02" }, as: Dispatcher, captures: { rd_id: $.data.id } }
            - { call: "POST /v1/route-days/${rd_id}/stops", payload: { service_request_id: "${req1}", planned_start: "2026-05-02T09:00:00Z", planned_end: "2026-05-02T10:00:00Z" }, as: Dispatcher, captures: { stop1: $.data.id } }
            - { call: "POST /v1/route-days/${rd_id}/stops", payload: { service_request_id: "${req2}", planned_start: "2026-05-02T12:00:00Z", planned_end: "2026-05-02T13:00:00Z" }, as: Dispatcher, captures: { stop2: $.data.id } }
            - { call: "GET /v1/route-days/${rd_id}", as: Dispatcher, captures: { rd_v: $.data.version } }
          trigger:
            - { call: "POST /v1/route-days/${rd_id}/resequence", payload: { stop_ids: ["${stop2}", "${stop1}"], expected_route_day_version: "${rd_v} - 1" }, as: Dispatcher, captures: { err: $.data.error_id } }
            - { call: "POST /v1/route-days/${rd_id}/resequence", payload: { stop_ids: ["${stop2}", "${stop1}"], expected_route_day_version: "${rd_v}" }, as: Dispatcher, captures: { ok_v: $.data.version } }
          assert:
            - "Stale call: error_id == ERR_STALE_VERSION (412)"
            - "Fresh call: 200 and RouteDay.version == rd_v + 1"

      - name: occ_stale_reschedule_returns_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[request-reschedule-stale-version]"]
        distinguishing_aspect: "OCC on ServiceRequest.version: a second reschedule carrying the pre-first-reschedule version fails 412 even though QUOTED is still a valid from-state."
        test_recipe:
          setup: ["one QUOTED request; its version captured at creation"]
          setup_api_calls:
            - { call: "POST /v1/zones", payload: { name: "Z1", base_callout_fee_cents: 2500 }, as: PlatformAdmin, captures: { zone_id: $.data.id } }
            - { call: "POST /v1/service-tiers", payload: { code: "BASIC", base_price_cents: 4900, included_minutes: 45, overage_rate_cents_per_min: 120, labor_warranty_days: 30 }, as: PlatformAdmin, captures: { tier_id: $.data.id } }
            - { call: "POST /v1/customers", payload: { name: "Ann", email: "ann@x.com", account_kind: "INDIVIDUAL" }, as: Dispatcher, captures: { cust_id: $.data.id } }
            - { call: "POST /v1/bikes", payload: { customer_id: "${cust_id}", bike_type: "MECHANICAL" }, as: Dispatcher, captures: { bike_id: $.data.id } }
            - { call: "POST /v1/service-requests", payload: { customer_id: "${cust_id}", bike_id: "${bike_id}", zone_id: "${zone_id}", tier_id: "${tier_id}", window_start: "2026-05-02T10:00:00Z", window_end: "2026-05-02T11:00:00Z" }, as: Dispatcher, captures: { req_id: $.data.id, req_v: $.data.version } }
          trigger:
            - { call: "POST /v1/service-requests/${req_id}/reschedule", payload: { window_start: "2026-05-03T10:00:00Z", window_end: "2026-05-03T11:00:00Z", expected_service_request_version: "${req_v}" }, as: Dispatcher, captures: { v2: $.data.version } }
            - { call: "POST /v1/service-requests/${req_id}/reschedule", payload: { window_start: "2026-05-04T10:00:00Z", window_end: "2026-05-04T11:00:00Z", expected_service_request_version: "${req_v}" }, as: Dispatcher, captures: { err: $.data.error_id } }
          assert:
            - "First reschedule: 200, version advanced (req_v + 1)"
            - "Second reschedule with stale version: error_id == ERR_STALE_VERSION (412); window unchanged"

      - name: list_filter_by_work_status
        claim_type: pagination_with_filtering
        grounds: [endpoints.list_service_requests]
        distinguishing_aspect: "Filter composition: GET /v1/service-requests?work_status=CANCELLED returns only the cancelled request, excluding QUOTED ones."
        test_recipe:
          setup: ["one customer with two requests; first cancelled"]
          setup_api_calls:
            - { call: "POST /v1/zones", payload: { name: "Z1", base_callout_fee_cents: 2500 }, as: PlatformAdmin, captures: { zone_id: $.data.id } }
            - { call: "POST /v1/service-tiers", payload: { code: "BASIC", base_price_cents: 4900, included_minutes: 45, overage_rate_cents_per_min: 120, labor_warranty_days: 30 }, as: PlatformAdmin, captures: { tier_id: $.data.id } }
            - { call: "POST /v1/customers", payload: { name: "Ann", email: "ann@x.com", account_kind: "INDIVIDUAL" }, as: Dispatcher, captures: { cust_id: $.data.id } }
            - { call: "POST /v1/bikes", payload: { customer_id: "${cust_id}", bike_type: "MECHANICAL" }, as: Dispatcher, captures: { bike1: $.data.id } }
            - { call: "POST /v1/bikes", payload: { customer_id: "${cust_id}", bike_type: "MECHANICAL" }, as: Dispatcher, captures: { bike2: $.data.id } }
            - { call: "POST /v1/service-requests", payload: { customer_id: "${cust_id}", bike_id: "${bike1}", zone_id: "${zone_id}", tier_id: "${tier_id}", window_start: "2026-05-02T10:00:00Z", window_end: "2026-05-02T11:00:00Z" }, as: Dispatcher, captures: { req1: $.data.id } }
            - { call: "POST /v1/service-requests", payload: { customer_id: "${cust_id}", bike_id: "${bike2}", zone_id: "${zone_id}", tier_id: "${tier_id}", window_start: "2026-05-02T13:00:00Z", window_end: "2026-05-02T14:00:00Z" }, as: Dispatcher, captures: { req2: $.data.id } }
            - { call: "POST /v1/service-requests/${req1}/events", payload: { event_type: "CANCEL" }, as: Dispatcher }
          trigger:
            - { call: "GET /v1/service-requests", payload: { customer_id: "${cust_id}", work_status: "CANCELLED" }, as: Dispatcher, captures: { first_ws: "$.data[0].work_status" } }
          assert:
            - "Filtered list contains exactly the cancelled request (total_count == 1, work_status == CANCELLED); unfiltered total_count == 2"

