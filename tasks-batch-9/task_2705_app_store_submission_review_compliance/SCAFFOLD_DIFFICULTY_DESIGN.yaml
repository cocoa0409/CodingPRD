            - "GET /expedite-requests?submission_id=${sub_a_id} returns 3 rows all in state REFUNDED; the ${exp3_id} row has granted_at == null, proving it was voided rather than refunded"
            - "GRANT exp4 on the new build -> 200 (legal again) and standing then reports expedite_credits_remaining == 1, credits_used_in_window == 1"

