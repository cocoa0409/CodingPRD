            - { call: "GET /api/escrow-files/${f}", payload: {}, as: EscrowOfficer, captures: { v2: $.data.version } }
            - { call: "POST /api/escrow-files/${f}/disbursements", payload: { payee_party_id: "${s}", amount_cents: 100000, purpose: "SELLER_PROCEEDS", expected_escrow_file_version: "${v2}" }, as: EscrowOfficer, captures: { d: $.data.id } }
            - { call: "POST /api/disbursements/${d}/approve", payload: {}, as: EscrowManager, as_user_id: "mgr-1" }
          trigger:
            - { call: "POST /api/disbursements/${d}/release", payload: {}, as: EscrowManager, as_user_id: "mgr-1", captures: { err: $.data.error_id } }
