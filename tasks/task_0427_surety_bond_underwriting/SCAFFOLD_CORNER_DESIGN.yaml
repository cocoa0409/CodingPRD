          trigger:
            - call: "POST /surety/cessions"
              payload: { bond_id: "${bond_id}", treaty_id: "${treaty_id}" }
              as: Underwriter
              captures: { cession_id: $.data.id }
          assert:
            - "Before cession SuretyProgram.${prog_id}.aggregate_available_cents == 42000000 (50,000,000 - 8,000,000)"
            - "After cession SuretyProgram.${prog_id}.aggregate_available_cents == 44000000 (net_retained dropped to 6,000,000)"

  # ---------------------------------------------------------------------------
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_renew_stale_version_after_rider_bump_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[bond-renew-stale-version]"
          - "errors[ERR_STALE_VERSION]"
          - state_machines.Rider.DRAFT_to_APPLIED
        distinguishing_aspect: "Client reads bond.version BEFORE applying a rider (which bumps the bond version); renewing with that now-stale expected_bond_version -> ERR_STALE_VERSION (412); bond stays ACTIVE."
        test_recipe:
          setup: ["an ACTIVE bond penal 5,000,000; client captured its version pre-rider; then a DECREASE rider is applied bumping the version"]
          setup_api_calls:
            - call: "POST /surety/programs"
              payload: { name: "CC3", single_limit_cents: 20000000, aggregate_limit_cents: 50000000, referral_threshold_cents: 25000000, loss_alert_threshold_cents: 50000000 }
              as: SeniorUnderwriter
              captures: { prog_id: $.data.id }
            - call: "POST /surety/principals"
              payload: { legal_name: "CC3Prin", credit_score: 700, working_capital_cents: 1000000 }
              as: Underwriter
              captures: { prin_id: $.data.id }
            - call: "POST /surety/indemnity-agreements"
              payload: { principal_id: "${prin_id}", indemnitor_count: 1, required_signature_count: 1 }
              as: Underwriter
              captures: { gia_id: $.data.id }
            - call: "POST /surety/indemnity-agreements/${gia_id}/sign"
              payload: {}
              as: Underwriter
            - call: "POST /surety/applications"
              payload: { principal_id: "${prin_id}", program_id: "${prog_id}", bond_type: "PERFORMANCE", requested_penal_sum_cents: 5000000, term_months: 12 }
              as: Underwriter
              captures: { app_id: $.data.id }
            - call: "POST /surety/applications/${app_id}/submit"
              payload: {}
              as: Underwriter
            - call: "POST /surety/applications/${app_id}/approve"
              payload: {}
              as: Underwriter
            - call: "POST /surety/bonds"
              payload: { application_id: "${app_id}" }
              as: Underwriter
              captures: { bond_id: $.data.id }
            - call: "POST /surety/bonds/${bond_id}/issue"
              payload: {}
              as: Underwriter
              captures: { bond_v_pre: $.data.version }
            - call: "POST /surety/riders"
              payload: { bond_id: "${bond_id}", rider_type: "DECREASE", penal_sum_delta_cents: -1000000 }
              as: Underwriter
              captures: { rider_id: $.data.id }
            - call: "POST /surety/riders/${rider_id}/apply"
              payload: {}
              as: Underwriter
          trigger:
            - call: "POST /surety/bonds/${bond_id}/renew"
              payload: { expected_bond_version: "${bond_v_pre}" }
              as: Underwriter
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 412; data.error_id == ERR_STALE_VERSION (expected_bond_version is stale after the rider bumped bond.version)"
            - "Bond.${bond_id}.status == ACTIVE (unchanged)"

