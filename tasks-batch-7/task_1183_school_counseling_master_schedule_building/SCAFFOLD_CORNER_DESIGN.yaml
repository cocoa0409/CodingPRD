          trigger:
            - call: "POST /scheduling/change-requests/${cr_coh}/execute"
              payload: {}
              as: Administrator
              captures: { coh_err: "$.data.error_id" }
          assert:
            - "error_id == ERR_COHORT_CAP_EXCEEDED (422): 2 == ceil(0.5*4) is the boundary (would become 3 > 2)"

  # ===========================================================================
  # Section: rbac
  # ===========================================================================
  - section: rbac
    instances:
      - name: counselor_cannot_schedule_sections
        claim_type: role_denial
        grounds:
          - roles
          - "validations[priority=2]"
        distinguishing_aspect: "Counselor role PATCHing a section is rejected ERR_UNAUTHORIZED — section scheduling is Administrator-exclusive."
        test_recipe:
          setup:
            - "term BUILDING with a DRAFT section sec_deny; counselor c_deny exists"
          setup_api_calls:
            - call: "POST /scheduling/counselors"
              payload: { full_name: "C Deny", max_caseload: 50 }
              as: Administrator
              captures: { c_deny: "$.data.id" }
            - call: "POST /scheduling/terms"
              payload: { code: "2068-FALL", periods_per_day: 8, max_students_per_section: 32, class_size_target: 25 }
              as: Administrator
              captures: { t_deny: "$.data.id" }
            # NOTE for the test-generator: chain to BUILDING with one DRAFT
            # section.
            - call: "GET /scheduling/sections"
              as: Administrator
              captures: { sec_deny: "$.data[0].id" }
            - call: "GET /scheduling/terms/${t_deny}"
              as: Administrator
              captures: { t_deny_v: "$.data.version" }
          trigger:
            - call: "PATCH /scheduling/sections/${sec_deny}"
              payload: { teacher_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", room_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", period: 1, capacity: 32, expected_term_version: "${t_deny_v}" }
              as: Counselor
              as_user_id: "${c_deny}"
              captures: { deny_err: "$.data.error_id" }
          assert:
            - "error_id == ERR_UNAUTHORIZED (403)"
      - name: counselor_cannot_claim_outside_caseload
        claim_type: ownership_denial
        grounds:
          - state_machines.ScheduleChangeRequest.SUBMITTED_to_COUNSELOR_REVIEW
          - "errors[ERR_FORBIDDEN_OWNERSHIP]"
        distinguishing_aspect: "A counselor claiming a request for a student NOT on their caseload fails ERR_FORBIDDEN_OWNERSHIP."
        test_recipe:
          setup:
            - "term CHANGE_WINDOW; counselors c_a (caseload owner) and c_b (not); SUBMITTED request cr_own for a student of c_a"
          setup_api_calls:
            - call: "POST /scheduling/counselors"
              payload: { full_name: "C A", max_caseload: 50 }
              as: Administrator
              captures: { c_a: "$.data.id" }
            - call: "POST /scheduling/counselors"
              payload: { full_name: "C B", max_caseload: 50 }
              as: Administrator
              captures: { c_b: "$.data.id" }
            - call: "POST /scheduling/terms"
              payload: { code: "2069-FALL", periods_per_day: 8, max_students_per_section: 32, class_size_target: 25 }
              as: Administrator
              captures: { t_own: "$.data.id" }
            # NOTE for the test-generator: chain to CHANGE_WINDOW with a
            # SUBMITTED change request for a c_a student.
          trigger:
            - call: "POST /scheduling/change-requests/${cr_own}/claim"
              payload: {}
              as: Counselor
              as_user_id: "${c_b}"
              captures: { own_err2: "$.data.error_id" }
          assert:
            - "error_id == ERR_FORBIDDEN_OWNERSHIP (403): c_b does not own the student's caseload"
      - name: student_reads_own_schedule_only
        claim_type: ownership_denial
        grounds:
          - "validations[priority=7]"
        distinguishing_aspect: "Student s_x reading s_y's schedule is rejected ERR_FORBIDDEN_OWNERSHIP; s_x reading own schedule succeeds."
        test_recipe:
          setup:
            - "students s_x and s_y exist; term t_xy exists"
          setup_api_calls:
            - call: "POST /scheduling/counselors"
              payload: { full_name: "C Xy", max_caseload: 50 }
              as: Administrator
