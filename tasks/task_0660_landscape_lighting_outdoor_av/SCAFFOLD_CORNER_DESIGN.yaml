scaffold_corner_design:

  # =========================================================================
  # Entities — creation, retrieval, not-found, required fields, computed/system
  # =========================================================================
  - section: entities
    instances:
      - name: create_project_returns_201_with_initial_states
        claim_type: Creation
        grounds:
          - entities.LightingProject
          - endpoints
        distinguishing_aspect: "POST /projects with customer_id+property_address -> 201; design_status=DRAFT, commercial_status=PRE_QUOTE, version=1."
        test_recipe:
          setup: ["A registered customer."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "C", email: "c_e1@x.com" }
              as: OperationsAdmin
              captures: { cust: $.data.id }
          trigger:
            - call: "POST /projects"
              payload: { customer_id: "${cust}", property_address: "1 Main" }
              as: OperationsAdmin
              captures: { proj: $.data.id }
          assert:
            - "LightingProject.${proj}.design_status == DRAFT"
            - "LightingProject.${proj}.commercial_status == PRE_QUOTE"
            - "LightingProject.${proj}.version == 1"

      - name: get_transformer_not_found_returns_404
        claim_type: Not Found
        grounds:
          - entities.Transformer
          - "errors[ERR_RESOURCE_NOT_FOUND]"
        distinguishing_aspect: "GET /transformers/{nonexistent} -> ERR_RESOURCE_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /transformers/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: OperationsAdmin
              captures: { err: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_RESOURCE_NOT_FOUND"

      - name: create_fixture_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.Fixture
          - "validations[priority=4]"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "POST /fixtures without wattage_w -> ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["A project."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "C", email: "c_e3@x.com" }
              as: OperationsAdmin
              captures: { cust: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust}", property_address: "P" }
              as: OperationsAdmin
              captures: { proj: $.data.id }
          trigger:
            - call: "POST /fixtures"
              payload: { project_id: "${proj}", model_code: "X", category: "PATH", purchase_price_cents: 1000 }
              as: LightingDesigner
              captures: { err: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_INVALID_REQUEST"

      - name: create_fixture_default_warranty_months_applied
        claim_type: Defaults
        grounds:
          - entities.Fixture.fields.warranty_months
        distinguishing_aspect: "Omitting warranty_months -> default 60 applied on the created fixture."
        test_recipe:
          setup: ["A project."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "C", email: "c_e4@x.com" }
              as: OperationsAdmin
              captures: { cust: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust}", property_address: "P" }
              as: OperationsAdmin
              captures: { proj: $.data.id }
          trigger:
            - call: "POST /fixtures"
              payload: { project_id: "${proj}", model_code: "X", category: "PATH", wattage_w: 3, purchase_price_cents: 1000 }
              as: LightingDesigner
              captures: { fx: $.data.id }
          assert:
            - "Fixture.${fx}.warranty_months == 60"
            - "Fixture.${fx}.status == PLANNED"
            - "Fixture.${fx}.zone_id == null"

      - name: transformer_usable_capacity_computed_floor
        claim_type: Computed Fields
        grounds:
          - entities.Transformer.fields.usable_capacity_va
          - calculations.transformer_usable_capacity
        distinguishing_aspect: "Transformer with rated_capacity_va=150 -> usable_capacity_va == floor(150*0.80) == 120 (input usable ignored, derived)."
        test_recipe:
          setup: ["A project."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "C", email: "c_e5@x.com" }
              as: OperationsAdmin
              captures: { cust: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust}", property_address: "P" }
              as: OperationsAdmin
              captures: { proj: $.data.id }
          trigger:
            - call: "POST /transformers"
              payload: { project_id: "${proj}", model_code: "TX-150", rated_capacity_va: 150 }
              as: LightingDesigner
              captures: { tx: $.data.id }
          assert:
            - "Transformer.${tx}.usable_capacity_va == 120"
            - "Transformer.${tx}.committed_load_va == 0"
            - "Transformer.${tx}.status == STAGED"

      - name: duplicate_customer_email_returns_409
        claim_type: Type Constraints
        grounds:
          - "validations[priority=16]"
          - "errors[ERR_DUPLICATE_EMAIL]"
        distinguishing_aspect: "Second POST /customers with the same email (case-insensitive) -> ERR_DUPLICATE_EMAIL (409)."
        test_recipe:
          setup: ["A customer with email dup@x.com."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "C1", email: "dup@x.com" }
              as: OperationsAdmin
          trigger:
            - call: "POST /customers"
              payload: { full_name: "C2", email: "DUP@x.com" }
              as: OperationsAdmin
              captures: { err: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_DUPLICATE_EMAIL"

      - name: list_projects_pagination_envelope
        claim_type: Listing
        grounds:
          - entities.LightingProject
          - response_envelope.pagination_fields
        distinguishing_aspect: "GET /projects returns an array envelope with total_count and has_more; limit out of [1,100] -> ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["One project exists."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "C", email: "c_e7@x.com" }
              as: OperationsAdmin
              captures: { cust: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust}", property_address: "P" }
              as: OperationsAdmin
          trigger:
            - call: "GET /projects"
              payload: { limit: 10, offset: 0 }
              as: OperationsAdmin
          assert:
            - "response_type == array; meta.total_count >= 1; has_more is boolean"

  # =========================================================================
  # State machines — invalid transitions, terminal lockdown, idempotency, initial
  # =========================================================================
  - section: state_machines
    instances:
      - name: cancel_install_job_after_energized_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.InstallJob
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Cancelling an ENERGIZED install job -> ERR_INVALID_STATE (cancel only valid from SCHEDULED)."
        test_recipe:
          setup: ["An ENERGIZED install job (full install chain)."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "C", email: "c_sm1@x.com" }
              as: OperationsAdmin
              captures: { cust: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust}", property_address: "P" }
              as: OperationsAdmin
              captures: { proj: $.data.id }
            - call: "POST /transformers"
              payload: { project_id: "${proj}", model_code: "TX-300", rated_capacity_va: 300 }
              as: LightingDesigner
              captures: { tx: $.data.id, tx_v: $.data.version }
            - call: "POST /projects/${proj}/zones"
              payload: { transformer_id: "${tx}", label: "Z" }
              as: LightingDesigner
              captures: { zone: $.data.id }
            - call: "POST /fixtures"
              payload: { project_id: "${proj}", model_code: "PATH-3W", category: "PATH", wattage_w: 3, purchase_price_cents: 4000 }
              as: LightingDesigner
              captures: { fx: $.data.id }
            - call: "POST /fixtures/${fx}/assign-zone"
              payload: { zone_id: "${zone}", expected_transformer_version: "${tx_v}" }
              as: LightingDesigner
            - call: "POST /projects/${proj}/lock-design"
              payload: {}
              as: LightingDesigner
            - call: "POST /quotes"
              payload: { project_id: "${proj}" }
              as: LightingDesigner
              captures: { q: $.data.id }
            - call: "POST /quotes/${q}/lines"
              payload: { model_code: "PATH-3W", quantity: 1, unit_price_cents: 4000 }
              as: LightingDesigner
            - call: "POST /quotes/${q}/send"
              payload: {}
              as: LightingDesigner
            - call: "POST /quotes/${q}/accept"
              payload: {}
              as: Customer
              as_user_id: "${cust}"
            - call: "POST /install-jobs"
              payload: { project_id: "${proj}", quote_id: "${q}" }
              as: InstallTech
              captures: { job: $.data.id }
            - call: "POST /install-jobs/${job}/start"
              payload: {}
              as: InstallTech
            - call: "POST /install-jobs/${job}/complete-wiring"
              payload: {}
              as: InstallTech
            - call: "POST /install-jobs/${job}/complete-fixtures"
              payload: {}
              as: InstallTech
          trigger:
            - call: "POST /install-jobs/${job}/cancel"
              payload: {}
              as: InstallTech
              captures: { err: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_INVALID_STATE"
            - "InstallJob.${job}.status == ENERGIZED"

      - name: reject_quote_twice_terminal_lockdown
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Quote
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Rejecting an already-REJECTED quote -> ERR_INVALID_STATE (REJECTED is terminal)."
        test_recipe:
          setup: ["A SENT quote that was rejected."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "C", email: "c_sm2@x.com" }
              as: OperationsAdmin
              captures: { cust: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust}", property_address: "P" }
              as: OperationsAdmin
              captures: { proj: $.data.id }
            - call: "POST /transformers"
              payload: { project_id: "${proj}", model_code: "TX-300", rated_capacity_va: 300 }
              as: LightingDesigner
              captures: { tx: $.data.id, tx_v: $.data.version }
            - call: "POST /projects/${proj}/zones"
              payload: { transformer_id: "${tx}", label: "Z" }
              as: LightingDesigner
              captures: { zone: $.data.id }
            - call: "POST /fixtures"
              payload: { project_id: "${proj}", model_code: "PATH-3W", category: "PATH", wattage_w: 3, purchase_price_cents: 4000 }
              as: LightingDesigner
              captures: { fx: $.data.id }
            - call: "POST /fixtures/${fx}/assign-zone"
              payload: { zone_id: "${zone}", expected_transformer_version: "${tx_v}" }
              as: LightingDesigner
            - call: "POST /projects/${proj}/lock-design"
              payload: {}
              as: LightingDesigner
            - call: "POST /quotes"
              payload: { project_id: "${proj}" }
              as: LightingDesigner
              captures: { q: $.data.id }
            - call: "POST /quotes/${q}/lines"
              payload: { model_code: "PATH-3W", quantity: 1, unit_price_cents: 4000 }
              as: LightingDesigner
            - call: "POST /quotes/${q}/send"
              payload: {}
              as: LightingDesigner
            - call: "POST /quotes/${q}/reject"
              payload: {}
              as: Customer
              as_user_id: "${cust}"
          trigger:
            - call: "POST /quotes/${q}/reject"
              payload: {}
              as: Customer
              as_user_id: "${cust}"
              captures: { err: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_INVALID_STATE"
            - "Quote.${q}.status == REJECTED"

      - name: complete_fixtures_before_wiring_returns_wiring_not_complete
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.InstallJob.IN_PROGRESS_to_IN_PROGRESS
          - "validations[priority=8]"
          - "errors[ERR_WIRING_NOT_COMPLETE]"
        distinguishing_aspect: "complete-fixtures while wiring_status==PENDING -> ERR_WIRING_NOT_COMPLETE (safety gate, not a generic state error)."
        test_recipe:
          setup: ["An IN_PROGRESS install job with wiring not yet completed."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "C", email: "c_sm3@x.com" }
              as: OperationsAdmin
              captures: { cust: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust}", property_address: "P" }
              as: OperationsAdmin
              captures: { proj: $.data.id }
            - call: "POST /transformers"
              payload: { project_id: "${proj}", model_code: "TX-300", rated_capacity_va: 300 }
              as: LightingDesigner
              captures: { tx: $.data.id, tx_v: $.data.version }
            - call: "POST /projects/${proj}/zones"
              payload: { transformer_id: "${tx}", label: "Z" }
              as: LightingDesigner
              captures: { zone: $.data.id }
            - call: "POST /fixtures"
              payload: { project_id: "${proj}", model_code: "PATH-3W", category: "PATH", wattage_w: 3, purchase_price_cents: 4000 }
              as: LightingDesigner
              captures: { fx: $.data.id }
            - call: "POST /fixtures/${fx}/assign-zone"
              payload: { zone_id: "${zone}", expected_transformer_version: "${tx_v}" }
              as: LightingDesigner
            - call: "POST /projects/${proj}/lock-design"
              payload: {}
              as: LightingDesigner
            - call: "POST /quotes"
              payload: { project_id: "${proj}" }
              as: LightingDesigner
              captures: { q: $.data.id }
            - call: "POST /quotes/${q}/lines"
              payload: { model_code: "PATH-3W", quantity: 1, unit_price_cents: 4000 }
              as: LightingDesigner
            - call: "POST /quotes/${q}/send"
              payload: {}
              as: LightingDesigner
            - call: "POST /quotes/${q}/accept"
              payload: {}
              as: Customer
              as_user_id: "${cust}"
            - call: "POST /install-jobs"
              payload: { project_id: "${proj}", quote_id: "${q}" }
              as: InstallTech
              captures: { job: $.data.id }
            - call: "POST /install-jobs/${job}/start"
              payload: {}
              as: InstallTech
          trigger:
            - call: "POST /install-jobs/${job}/complete-fixtures"
              payload: {}
              as: InstallTech
              captures: { err: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_WIRING_NOT_COMPLETE"
            - "InstallJob.${job}.fixtures_status == PENDING"

      - name: lock_design_with_unzoned_fixture_returns_unzoned_fixture
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.LightingProject.ZONED_to_DESIGN_LOCKED
          - "validations[priority=9]"
          - "errors[ERR_UNZONED_FIXTURE]"
        distinguishing_aspect: "lock-design while a PLANNED fixture has null zone_id -> ERR_UNZONED_FIXTURE."
        test_recipe:
          setup: ["A ZONED project with one assigned fixture and one unassigned PLANNED fixture."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "C", email: "c_sm4@x.com" }
              as: OperationsAdmin
              captures: { cust: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust}", property_address: "P" }
              as: OperationsAdmin
              captures: { proj: $.data.id }
            - call: "POST /transformers"
              payload: { project_id: "${proj}", model_code: "TX-300", rated_capacity_va: 300 }
              as: LightingDesigner
              captures: { tx: $.data.id, tx_v: $.data.version }
            - call: "POST /projects/${proj}/zones"
              payload: { transformer_id: "${tx}", label: "Z" }
              as: LightingDesigner
              captures: { zone: $.data.id }
            - call: "POST /fixtures"
              payload: { project_id: "${proj}", model_code: "A", category: "PATH", wattage_w: 3, purchase_price_cents: 4000 }
              as: LightingDesigner
              captures: { fxa: $.data.id }
            - call: "POST /fixtures/${fxa}/assign-zone"
              payload: { zone_id: "${zone}", expected_transformer_version: "${tx_v}" }
              as: LightingDesigner
            - call: "POST /fixtures"
              payload: { project_id: "${proj}", model_code: "B", category: "PATH", wattage_w: 3, purchase_price_cents: 4000 }
              as: LightingDesigner
              captures: { fxb: $.data.id }
          trigger:
            - call: "POST /projects/${proj}/lock-design"
              payload: {}
              as: LightingDesigner
              captures: { err: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_UNZONED_FIXTURE"
            - "LightingProject.${proj}.design_status == ZONED"

      - name: send_quote_with_no_lines_returns_quote_no_lines
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Quote.DRAFT_to_SENT
          - "errors[ERR_QUOTE_NO_LINES]"
        distinguishing_aspect: "Sending a DRAFT quote that has zero QuoteLines -> ERR_QUOTE_NO_LINES."
        test_recipe:
          setup: ["A DESIGN_LOCKED project with a draft quote that has no lines."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "C", email: "c_sm5@x.com" }
              as: OperationsAdmin
              captures: { cust: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust}", property_address: "P" }
              as: OperationsAdmin
              captures: { proj: $.data.id }
            - call: "POST /transformers"
              payload: { project_id: "${proj}", model_code: "TX-300", rated_capacity_va: 300 }
              as: LightingDesigner
              captures: { tx: $.data.id, tx_v: $.data.version }
            - call: "POST /projects/${proj}/zones"
              payload: { transformer_id: "${tx}", label: "Z" }
              as: LightingDesigner
              captures: { zone: $.data.id }
            - call: "POST /fixtures"
              payload: { project_id: "${proj}", model_code: "A", category: "PATH", wattage_w: 3, purchase_price_cents: 4000 }
              as: LightingDesigner
              captures: { fx: $.data.id }
            - call: "POST /fixtures/${fx}/assign-zone"
              payload: { zone_id: "${zone}", expected_transformer_version: "${tx_v}" }
              as: LightingDesigner
            - call: "POST /projects/${proj}/lock-design"
              payload: {}
              as: LightingDesigner
            - call: "POST /quotes"
              payload: { project_id: "${proj}" }
              as: LightingDesigner
              captures: { q: $.data.id }
          trigger:
            - call: "POST /quotes/${q}/send"
              payload: {}
              as: LightingDesigner
              captures: { err: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_QUOTE_NO_LINES"
            - "Quote.${q}.status == DRAFT"

      - name: quote_expires_lazily_and_accept_returns_quote_expired
        claim_type: Side Effect Execution
        grounds:
          - state_machines.Quote.SENT_to_EXPIRED
          - "errors[ERR_QUOTE_EXPIRED]"
        distinguishing_aspect: "After clock passes send_time + 14 days, a GET lazily flips the quote to EXPIRED, and a subsequent accept -> ERR_QUOTE_EXPIRED."
        test_recipe:
          setup: ["A SENT quote sent at default clock 2026-04-01; clock advanced 15 days."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "C", email: "c_sm6@x.com" }
              as: OperationsAdmin
              captures: { cust: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust}", property_address: "P" }
              as: OperationsAdmin
              captures: { proj: $.data.id }
            - call: "POST /transformers"
              payload: { project_id: "${proj}", model_code: "TX-300", rated_capacity_va: 300 }
              as: LightingDesigner
              captures: { tx: $.data.id, tx_v: $.data.version }
            - call: "POST /projects/${proj}/zones"
              payload: { transformer_id: "${tx}", label: "Z" }
              as: LightingDesigner
              captures: { zone: $.data.id }
            - call: "POST /fixtures"
              payload: { project_id: "${proj}", model_code: "A", category: "PATH", wattage_w: 3, purchase_price_cents: 4000 }
              as: LightingDesigner
              captures: { fx: $.data.id }
            - call: "POST /fixtures/${fx}/assign-zone"
              payload: { zone_id: "${zone}", expected_transformer_version: "${tx_v}" }
              as: LightingDesigner
            - call: "POST /projects/${proj}/lock-design"
              payload: {}
              as: LightingDesigner
            - call: "POST /quotes"
              payload: { project_id: "${proj}" }
              as: LightingDesigner
              captures: { q: $.data.id }
            - call: "POST /quotes/${q}/lines"
              payload: { model_code: "A", quantity: 1, unit_price_cents: 4000 }
              as: LightingDesigner
            - call: "POST /quotes/${q}/send"
              payload: {}
              as: LightingDesigner
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-16T00:00:00Z" }
              as: OperationsAdmin
          trigger:
            - call: "POST /quotes/${q}/accept"
              payload: {}
              as: Customer
              as_user_id: "${cust}"
              captures: { err: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_QUOTE_EXPIRED"
            - "Quote.${q}.status == EXPIRED"

      - name: service_visit_lazy_missed_when_date_passed
        claim_type: Side Effect Execution
        grounds:
          - state_machines.ServiceVisit.REQUESTED_to_MISSED
        distinguishing_aspect: "An unrouted REQUESTED visit on 2026-05-01, read after the clock advances to 2026-05-02, lazily flips to MISSED."
        test_recipe:
          setup: ["An active plan with one unrouted REQUESTED visit on 2026-05-01; clock advanced to 2026-05-02."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "C", email: "c_sm7@x.com" }
              as: OperationsAdmin
              captures: { cust: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust}", property_address: "P" }
              as: OperationsAdmin
              captures: { proj: $.data.id }
            - call: "POST /transformers"
              payload: { project_id: "${proj}", model_code: "TX-300", rated_capacity_va: 300 }
              as: LightingDesigner
              captures: { tx: $.data.id, tx_v: $.data.version }
            - call: "POST /projects/${proj}/zones"
              payload: { transformer_id: "${tx}", label: "Z" }
              as: LightingDesigner
              captures: { zone: $.data.id }
            - call: "POST /fixtures"
              payload: { project_id: "${proj}", model_code: "A", category: "PATH", wattage_w: 3, purchase_price_cents: 4000 }
              as: LightingDesigner
              captures: { fx: $.data.id }
            - call: "POST /fixtures/${fx}/assign-zone"
              payload: { zone_id: "${zone}", expected_transformer_version: "${tx_v}" }
              as: LightingDesigner
            - call: "POST /projects/${proj}/lock-design"
              payload: {}
              as: LightingDesigner
            - call: "POST /quotes"
              payload: { project_id: "${proj}" }
              as: LightingDesigner
              captures: { q: $.data.id }
            - call: "POST /quotes/${q}/lines"
              payload: { model_code: "A", quantity: 1, unit_price_cents: 4000 }
              as: LightingDesigner
            - call: "POST /quotes/${q}/send"
              payload: {}
              as: LightingDesigner
            - call: "POST /quotes/${q}/accept"
              payload: {}
              as: Customer
              as_user_id: "${cust}"
            - call: "POST /install-jobs"
              payload: { project_id: "${proj}", quote_id: "${q}" }
              as: InstallTech
              captures: { job: $.data.id }
            - call: "POST /install-jobs/${job}/start"
              payload: {}
              as: InstallTech
            - call: "POST /install-jobs/${job}/complete-wiring"
              payload: {}
              as: InstallTech
