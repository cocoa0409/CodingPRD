            - call: "POST /special-servicing/loans"
              payload: { trust_id: "${trust_id}", loan_number: "L-V16", original_balance_usd: 12000000, current_principal_balance_usd: 10000000, note_rate_pct: 6.0, monthly_debt_service_usd: 65000, maturity_date: "2029-06-01T00:00:00Z", securitization_value_usd: 15000000 }
              as: MasterServicer
              as_user_id: "ms-001"
              captures: { loan_id: "$.data.id" }
            - call: "POST /special-servicing/advances"
              payload: { loan_id: "${loan_id}", advance_type: "PROPERTY_PROTECTION_ADVANCE", amount_usd: 150000, advanced_on: "2026-04-01T00:00:00Z" }
              as: MasterServicer
              as_user_id: "ms-001"
              captures: { advance_apr_id: "$.data.id" }
            - call: "POST /special-servicing/advances"
              payload: { loan_id: "${loan_id}", advance_type: "PROPERTY_PROTECTION_ADVANCE", amount_usd: 200000, advanced_on: "2026-02-15T00:00:00Z" }
              as: MasterServicer
              as_user_id: "ms-001"
              captures: { advance_feb15_id: "$.data.id" }
            - call: "POST /special-servicing/advances"
              payload: { loan_id: "${loan_id}", advance_type: "PROPERTY_PROTECTION_ADVANCE", amount_usd: 200000, advanced_on: "2026-02-01T00:00:00Z" }
              as: MasterServicer
              as_user_id: "ms-001"
              captures: { advance_feb01_id: "$.data.id" }
          trigger:
            - call: "GET /special-servicing/advances/${advance_feb01_id}"
              as: MasterServicer
              as_user_id: "ms-001"
              captures: { feb01_at_jun: "$.data.accrued_interest_usd", feb01_through_jun: "$.data.interest_accrued_through" }
            - call: "GET /special-servicing/advances/${advance_apr_id}"
              as: MasterServicer
              as_user_id: "ms-001"
              captures: { apr_at_jun: "$.data.accrued_interest_usd" }
            - call: "POST /special-servicing/_clock/set_current_utc"
              payload: { current_utc: "2026-08-31T00:00:00Z" }
