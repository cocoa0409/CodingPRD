    claim_type: priority_ordering
    grounds:
    - validations[participant-not-suspended-for-support]
    - validations[per-participant-cap]
    excluded_because:
      difficulty_instance: priority_pair_validation_conflict / suspended_participant_error_beats_per_participant_cap_error
      rationale: That §1.8 instance violates priority 9 and priority 13 with one request and asserts the priority-9
        error, then repairs the suspension to prove the cap error was really queued behind it.
  - name: barred_category_error_outranks_the_opening_capacity_error
    claim_type: priority_conflict
    grounds:
    - validations[record-category-barred]
    - validations[opening-has-remaining-seats]
    excluded_because:
      difficulty_instance: priority_pair_validation_conflict / barred_record_category_error_beats_full_opening_error
      rationale: That §1.8 instance violates priority 10 and priority 12 on one POST /placements call and asserts
        the priority-10 error.
  - name: a_request_exactly_at_the_participant_cap_is_accepted
    claim_type: satisfaction_to_pass
    grounds:
    - validations[per-participant-cap]
    excluded_because:
      difficulty_instance: boundary_precision_check / per_participant_cap_allows_exact_equality_and_refuses_one_cent_more
      rationale: That §1.8 instance asserts the accepted case at exactly the cap and the refused case one cent above
        it, which is the satisfaction-to-pass half of this rule.
  - name: per_participant_cap_compares_the_total_charge_not_the_raw_line_sum
    claim_type: cascading_validation
    grounds:
    - validations[per-participant-cap]
    - calculations.support_request_award
    - calculations.support_request_settlement
    distinguishing_aspect: Three different numbers are in play — raw line sum 12000, requested_cents 10200 after the
      0.85 TOOLS coverage rate, total_charge_cents 10506 after the 3% tier-2 admin fee. The cap of 10500 is only breached
      by the third, so the award and settlement calculations must both run before the cap check.
    test_recipe:
      setup:
      - logical clock at 2026-08-01T08:00:00.000Z
      - FunderGrant g1 authorized_cents 100000 with per_participant_cap_cents 10500 and all six categories allowed
      - Participant p1 PRE_RELEASE, not suspended, with no other requests
