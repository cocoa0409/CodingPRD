            - call: "POST /pesticide-registry/study-submissions"
              payload: { data_call_in_id: "${dci}", study_type: "TOXICOLOGY", guideline_reference: "OCSPP 870.3100" }
              as: RegistrantRepresentative
              as_user_id: "reg-alice"
              captures: { s3: $.data.id }
            - call: "POST /pesticide-registry/data-call-ins/${dci}/respond"
              payload: { study_submission_ids: ["${s2}", "${s3}"] }
