  - method: POST
    path: /appointments
    description: Book a facility or urgent-travel appointment for an application.
    roles: [Applicant]
    code: 201
    input: [application_id, resource_kind, "facility_id?", "counter_id?", start_utc, end_utc, expected_application_version]
    output: Appointment
    side_effects:
      - "If URGENT_TRAVEL_COUNTER: set Application.urgent_travel = true and re-derive UNPAID FeeAssessment"
      - "increments Application.version by 1"
  - method: GET
    path: /appointments/{id}
    description: Read an appointment.
    roles: [Applicant, AcceptanceAgent, Adjudicator]
    code: 200
    input: []
    output: Appointment
    side_effects: []
  - method: GET
    path: /appointments
    description: List appointments; filter by application_id, facility_id, or counter_id (reverse-reachability).
    roles: [Applicant, AcceptanceAgent, Adjudicator]
    code: 200
    input: ["application_id?", "facility_id?", "counter_id?", "limit?", "offset?"]
    output: Appointment[]
    side_effects: []
  - method: POST
    path: /appointments/{id}/cancel
    description: BOOKED->CANCELLED.
    roles: [Applicant]
    code: 200
    input: []
    output: Appointment
    side_effects: ["If urgent counter and none remain: flip Application.urgent_travel false, re-derive UNPAID fee", "increments Appointment.version by 1"]
  - method: POST
    path: /appointments/{id}/complete
    description: BOOKED->COMPLETED.
    roles: [AcceptanceAgent]
    code: 200
    input: []
    output: Appointment
    side_effects: ["increments Appointment.version by 1"]

  - method: GET
    path: /applications/{id}/adjudication-decisions
    description: Reverse-reachability for AdjudicationDecision by application.
    roles: [Applicant, AcceptanceAgent, Adjudicator]
    code: 200
    input: ["limit?", "offset?"]
    output: AdjudicationDecision[]
    side_effects: []
  - method: GET
    path: /adjudication-decisions
    description: List adjudication decisions; filter by adjudicator_id (reverse-reachability for AdjudicationDecision.adjudicator_id).
    roles: [Adjudicator]
    code: 200
    input: ["adjudicator_id?", "application_id?", "limit?", "offset?"]
    output: AdjudicationDecision[]
    side_effects: []

  - method: POST
    path: /_clock/set_current_utc
    description: Test-driving — set the system clock used for is_minor, timestamps, SLA dates.
    roles: [Adjudicator]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["Sets the server clock"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing/malformed X-User-Role or X-User-ID on an authenticated endpoint"
  - id: ERR_FORBIDDEN
    http: 403
    condition: "Role not permitted for this endpoint per §1.7"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Path-referenced resource id does not exist"
  - id: ERR_FK_NOT_FOUND
    http: 422
    condition: "Body FK field references a non-existent resource"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Requested transition not defined from the resource's current state"
  - id: ERR_ALREADY_TERMINAL
    http: 409
    condition: "Transition attempted on a terminal resource"
  - id: ERR_SOD_VIOLATION
    http: 403
    condition: "Adjudicator equals assigned acceptance agent, or agent verifying a doc on an application they did not begin-verification on"
  - id: ERR_PHOTO_INVALID
    http: 422
    condition: "Submit attempted without any PASS photo"
  - id: ERR_GUARDIAN_CONSENT_REQUIRED
    http: 422
    condition: "MINOR application submit without GUARDIAN_CONSENT document or guardian_applicant_id"
  - id: ERR_NAME_CHANGE_EVIDENCE_REQUIRED
    http: 422
    condition: "Name-change submit/decision without NAME_CHANGE_EVIDENCE in the right state"
  - id: ERR_FACILITY_SLOT_CONFLICT
    http: 409
    condition: "Facility appointment overlaps an existing BOOKED facility slot (half-open)"
  - id: ERR_COUNTER_SLOT_CONFLICT
    http: 409
    condition: "Urgent counter appointment falls inside an existing buffer-extended window"
  - id: ERR_INVALID_INTERVAL
    http: 422
    condition: "Appointment end_utc not strictly after start_utc"
  - id: ERR_DUPLICATE_URGENT_APPOINTMENT
    http: 409
    condition: "Application already holds a BOOKED urgent-travel appointment"
  - id: ERR_PAYMENT_AMOUNT_MISMATCH
    http: 422
    condition: "amount_tendered_cents != total_due_cents"
  - id: ERR_FEE_UNPAID
    http: 409
    condition: "begin-verification while FeeAssessment is UNPAID"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_application_version does not match current Application.version"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Malformed body, bad enum, missing required field, or non-positive dimension"
  - id: ERR_VALIDATION
    http: 422
    condition: "Field value out of declared range (e.g., declared_quality outside 0..100, head_height_fraction not in (0,1))"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Applicant
    description: "An applicant (or guardian) who owns applications, documents, photos, pays fees, and books appointments."
    identity: "entity_backed:Applicant"
    exclusive_operations:
      - "POST /applications"
      - "POST /applications/{id}/submit"
      - "POST /applications/{id}/withdraw"
      - "POST /applications/{id}/documents"
      - "POST /applications/{id}/photos"
      - "POST /fee-assessments/{id}/pay"
      - "POST /appointments"
      - "POST /appointments/{id}/cancel"
    shared_operations:
      - "POST /applicants"
      - "GET (own application/document/photo/fee/appointment/summary/status reads)"
      - "POST /photos/{id}/revalidate"
  - name: AcceptanceAgent
    description: "Front-counter operator who begins verification, verifies documents, completes appointments. Subject to SoD against adjudication."
    identity: "entity_backed:AcceptanceAgent"
    exclusive_operations:
      - "POST /applications/{id}/begin-verification"
      - "POST /documents/{id}/verify"
      - "POST /appointments/{id}/complete"
    shared_operations:
      - "GET reads on applications, documents, photos, agents, facilities"
      - "POST /photos/{id}/revalidate"
  - name: Adjudicator
    description: "Back-office officer who adjudicates, issues, clears holds, decides name changes, and administers facilities/agents/counters. Cannot have acted as the application's acceptance agent."
    identity: "entity_backed:Adjudicator"
    exclusive_operations:
      - "POST /applications/{id}/adjudicate"
      - "POST /applications/{id}/issue"
      - "POST /applications/{id}/clear-hold"
      - "POST /applications/{id}/name-change/decide"
      - "POST /acceptance-facilities"
      - "POST /urgent-travel-counters"
      - "POST /acceptance-agents"
      - "POST /adjudicators"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET reads across the system"
      - "POST /applicants"
