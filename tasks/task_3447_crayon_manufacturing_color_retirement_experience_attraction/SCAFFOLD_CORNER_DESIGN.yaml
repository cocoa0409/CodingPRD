        claim_type: "immediate"
        grounds:
          - complexity_profile.consistency_model
          - endpoints.GET_/crayon-works/colors/{id}
        distinguishing_aspect: "Immediate consistency: a GET issued right after the campaign-creation POST already shows the color IN_VOTE — the cascade into the parent is visible in the next request, never deferred."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z; color Cerulean PROPOSED."
          setup_api_calls:
            - *k_clock0
            - *k_color
            - *k_camp
          trigger:
            - call: "GET /crayon-works/colors/${c_id}"
              payload: {}
              as: PlatformAdmin
              captures: { st: $.data.status }
          assert:
            - "the read returns status == IN_VOTE (${st}) in the request immediately following the campaign creation"

      - name: derived_fields_recomputed_in_same_response
        claim_type: "immediate"
        grounds:
          - complexity_profile.consistency_model
          - entities.ProductionRun.fields.boxes_produced
        distinguishing_aspect: "Computed fields land in the mutation's own response: the PACKING->COMPLETED advance returns boxes_produced 125, waste_units 0 and packing_penalty_cents 0 in its 200 body — no second read is needed to observe the calculation."
        test_recipe:
          setup:
            - "Production-capable setup; run R1 advanced to PACKING."
          setup_api_calls:
            - *k_clock0
            - *k_color
            - *k_camp
            - *k_open
            - *k_epoch
            - *k_pass
            - *k_close
            - *k_epoch
            - *k_spec
            - *k_batch
            - *k_cert
            - *k_formula
            - *k_submit
            - *k_tests
            - *k_tpass
            - *k_approve
            - *k_run
            - call: "POST /crayon-works/production-runs/${r1_id}/transition"
              payload: { action: ADVANCE }
              as: PlatformAdmin
            - call: "POST /crayon-works/production-runs/${r1_id}/transition"
              payload: { action: ADVANCE }
              as: PlatformAdmin
            - call: "POST /crayon-works/production-runs/${r1_id}/transition"
              payload: { action: ADVANCE }
              as: PlatformAdmin
          trigger:
            - call: "POST /crayon-works/production-runs/${r1_id}/transition"
