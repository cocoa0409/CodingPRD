      - name: suppression_fixed_point_row_column_iteration_order
        grounds:
          - calculations.suppression_resolution
          - entities.CellEstimate.fields.suppression_status
          - entities.CellEstimate.fields.dominance_flag
        distinguishing_aspect: |
          Mode (c) — circular-looking dependency with pinned evaluation order:
          row totals are computed from the FULL cell set BEFORE complementary
          selection, then complementary passes iterate rows (industry_code ASC)
          before columns (size_class ASC) to a fixed point. In this 2x2 table
          one PRIMARY cell forces every other cell COMPLEMENTARY (all four
          masked) while industry totals remain defined at 200 and 253; the
          totals-vs-suppression circularity is resolved by computing totals
          from the full cell set BEFORE complementary selection.
        test_recipe:
          setup:
            - "Program CES (budget 24); frame 2026-Q3 with strata (MANUFACTURING,SMALL,30), (MANUFACTURING,MEDIUM,30), (RETAIL,SMALL,30), (RETAIL,MEDIUM,30) frozen -> allocations 3/9/3/9, weights 10.0/3.333333/10.0/3.333333"
