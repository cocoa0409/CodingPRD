      - name: freight_tier_threshold_promotes_at_exactly_forty_thousand_pounds
        claim_type: threshold
        grounds:
          - calculations.freight_program_tier
          - endpoints[POST /brewers/{id}/volume-adjustments]
          - entities.Brewer.fields.freight_program_tier
        distinguishing_aspect: "Both tier gates are inclusive lower bounds, so 39999 lbs is still TIER_1 while exactly 40000 is TIER_2 and exactly 120000 is TIER_3 — the boundary pound belongs to the higher tier, and the volume-adjustment endpoint re-derives the tier on every write."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One brewer created with legacy_trailing_lbs 0, so it starts in TIER_1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /brewers"
              payload: { name: "Freight Tier Brewing", brewery_license_no: "BR-1015", credit_terms_days: 30, credit_limit_cents: 5000000, cold_chain_certified: false, legacy_trailing_lbs: 0 }
              as: CreditManager
              captures: { fr_id: $.data.id }
          trigger:
            - call: "POST /brewers/${fr_id}/volume-adjustments"
              payload: { legacy_trailing_lbs: 39999, reason: "one pound short of the tier gate" }
              as: AllocationManager
              captures: { fr_tier_low: $.data.freight_program_tier, fr_vol_low: $.data.trailing_12mo_volume_lbs }
            - call: "POST /brewers/${fr_id}/volume-adjustments"
              payload: { legacy_trailing_lbs: 40000, reason: "exactly at the tier gate" }
              as: AllocationManager
              captures: { fr_tier_mid: $.data.freight_program_tier }
            - call: "POST /brewers/${fr_id}/volume-adjustments"
              payload: { legacy_trailing_lbs: 120000, reason: "exactly at the top gate" }
              as: AllocationManager
              captures: { fr_tier_high: $.data.freight_program_tier }
          assert:
            - "at 39999 lbs: ${fr_tier_low} == TIER_1 and ${fr_vol_low} == 39999"
            - "at exactly 40000 lbs: ${fr_tier_mid} == TIER_2 — TIER_2_MIN_LBS is an inclusive lower bound"
            - "at exactly 120000 lbs: ${fr_tier_high} == TIER_3"
            - "Brewer.${fr_id}.version == 4 — each adjustment is one write on top of creation"
            - "the adjustment touches no money: Brewer.${fr_id}.ar_balance_cents == 0, credit_exposure_cents == 0 and credit_status == GOOD_STANDING"
            - "a subsequent order priced at TIER_3 charges FREIGHT_RATE_CENTS_PER_LB 5 with FREIGHT_MINIMUM_CENTS 0, versus 12 and 25000 at TIER_1"

      - name: shortfall_waterfall_fills_fixed_commitments_before_spot_holds
        claim_type: waterfall_allocation
        grounds:
          - calculations.shortfall_prorata_reallocation
          - entities.CropYearProgram.fields.allocatable_pool_lbs
          - entities.CropYearProgram.fields.unallocated_pool_lbs
        distinguishing_aspect: "An 80 percent crop on 15000 contracted pounds must fill the 10000 lb FIXED_CROP_YEAR contract completely and leave the SPOT_HOLD contract 3000 short — a pro-rata split of 8000 / 4000 is the wrong answer, and only the shorted contract changes state."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Brewer; OPEN crop-year program 2026."
            - "Citra and Mosaic varieties (different varieties so the two contracts cannot collide on the delivery-window rule)."
            - "Contract F: 10000 lbs FIXED_CROP_YEAR on Citra at 285.50, created first. Contract S: 5000 lbs SPOT_HOLD on Mosaic at 450.00, created second."
            - "No order lines exist, so no trimming cascade can fire."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /brewers"
              payload: { name: "Waterfall Brewing", brewery_license_no: "BR-1016", credit_terms_days: 30, credit_limit_cents: 9000000, cold_chain_certified: true, legacy_trailing_lbs: 0 }
              as: CreditManager
              captures: { wf_id: $.data.id }
            - call: "POST /crop-year-programs"
              payload: { crop_year: 2026, contract_open_date: "2026-01-15T00:00:00Z", harvest_report_due_date: "2026-10-01T00:00:00Z" }
              as: AllocationManager
              captures: { wf_prog_id: $.data.id }
            - call: "POST /hop-varieties"
              payload: { variety_code: "CITRA", name: "Citra", substitution_group: "AROMA_HIGH_ALPHA", alpha_acid_target_pct: 12.50, spot_price_cents_per_lb: 51.00, available_spot_lbs: 20000, cold_storage_required: true, pallet_quantity_lbs: 880, min_order_lbs: 44 }
              as: AllocationManager
              captures: { wf_citra_id: $.data.id }
            - call: "POST /hop-varieties"
              payload: { variety_code: "MOSAIC", name: "Mosaic", substitution_group: "AROMA_HIGH_ALPHA", alpha_acid_target_pct: 12.00, spot_price_cents_per_lb: 450.00, available_spot_lbs: 20000, cold_storage_required: true, pallet_quantity_lbs: 880, min_order_lbs: 44 }
              as: AllocationManager
              captures: { wf_mosaic_id: $.data.id }
            - call: "POST /hop-contracts"
              payload: { brewer_id: "${wf_id}", variety_id: "${wf_citra_id}", crop_year_program_id: "${wf_prog_id}", contract_type: "FIXED_CROP_YEAR", contracted_lbs: 10000, price_per_lb_cents: 285.50, delivery_window_start: "2026-09-01T00:00:00Z", delivery_window_end: "2026-12-31T00:00:00Z" }
              as: AllocationManager
              captures: { wf_fixed_id: $.data.id }
            - call: "POST /hop-contracts"
              payload: { brewer_id: "${wf_id}", variety_id: "${wf_mosaic_id}", crop_year_program_id: "${wf_prog_id}", contract_type: "SPOT_HOLD", contracted_lbs: 5000, price_per_lb_cents: 450.00, delivery_window_start: "2026-09-01T00:00:00Z", delivery_window_end: "2026-12-31T00:00:00Z" }
              as: AllocationManager
              captures: { wf_spot_id: $.data.id }
          trigger:
            - call: "POST /crop-year-programs/${wf_prog_id}/report-harvest"
              payload: { harvest_yield_pct: 80.00, reported_note: "eighty percent crop" }
              as: AllocationManager
              captures: { wf_total: $.data.total_contracted_lbs, wf_pool: $.data.allocatable_pool_lbs, wf_unalloc: $.data.unallocated_pool_lbs, wf_status: $.data.status }
          assert:
            - "${wf_status} == HARVEST_REPORTED, ${wf_total} == 15000, ${wf_pool} == 12000 (floor of 15000 * 80.00 / 100) and ${wf_unalloc} == 0"
            - "HopContract.${wf_fixed_id}.allocated_lbs == 10000, shortfall_lbs == 0, remaining_lbs == 10000 and status == ACTIVE — the fixed commitment is untouched"
            - "HopContract.${wf_spot_id}.allocated_lbs == 2000, shortfall_lbs == 3000, remaining_lbs == 2000 and status == SHORTFALL_ADJUSTED"
            - "a pro-rata implementation would report 8000 / 4000 with both contracts shorted; the waterfall reports 10000 / 2000 with only the spot holder shorted"
            - "CropYearProgram.${wf_prog_id}.harvest_yield_pct == 80.00 and harvest_reported_at == 2026-08-01T00:00:00Z"
            - "with two SPOT_HOLD contracts of equal rank the tie is broken by created_at ASC and never by id"

