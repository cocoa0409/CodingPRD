            - { call: "POST /estimates", payload: { customer_id: "${cust}", job_name: "E3", quantity_ordered: 1000, press_type: "WEB", binding_method: "SADDLE_STITCH", fulfillment_type: "SHIP", signatures: [ { name: "A", pages: 8, up_count: 1, paper_stock_id: "${stock}", make_ready_cents: 50000, rate_per_thousand_cents: 30000 } ], press_spoilage_pct: 0, bindery_spoilage_pct: 0, quote_valid_days: 30, due_date: "2026-08-20T00:00:00Z" }, as: Estimator, captures: { e3: $.data.id } }
