              as: ProgramAdmin
              captures: { vol_enroll_id: $.data.id }
            - call: "POST /api/volunteers/${vol_enroll_id}/clear"
              payload: {}
              as: ProgramAdmin
            - call: "POST /api/members"
              payload: { full_name: "Mem Z", birth_date: "2009-08-01", club_id: "${club_id}" }
              as: Volunteer
              as_user_id: "${vol_enroll_id}"
              captures: { mem_id: $.data.id }
            - call: "POST /api/members/${mem_id}/activate"
              payload: {}
              as: Volunteer
              as_user_id: "${vol_enroll_id}"
            - call: "POST /api/projects"
              payload: { member_id: "${mem_id}", project_type: "FOODS", program_year: 2026 }
              as: Member
              as_user_id: "${mem_id}"
              captures: { proj_id: $.data.id }
            - call: "POST /api/projects/${proj_id}/start"
              payload: {}
              as: Member
              as_user_id: "${mem_id}"
            - call: "POST /api/record-books"
              payload: { project_id: "${proj_id}", program_year: 2026 }
              as: Member
              as_user_id: "${mem_id}"
              captures: { rb_id: $.data.id }
            - call: "POST /api/ledger-entries"
              payload: { record_book_id: "${rb_id}", entry_kind: "EXPENSE", amount_cents: 1000, hours: 0, recorded_on: "2026-06-01" }
