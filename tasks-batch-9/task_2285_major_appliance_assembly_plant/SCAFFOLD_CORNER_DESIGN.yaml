            - "Trigger 3: HTTP 422 with error.error_id == ERR_CUT_IN_INDEX_TOO_LOW — 1 is not strictly greater than max_released_sequence_index 1"
            - "Trigger 4: HTTP 422 with error.error_id == ERR_REPLACEMENT_PART_REQUIRED — index 5 is fine, but no replacement part was ever supplied"
            - "Trigger 5: HTTP 422 with error.error_id == ERR_REPLACEMENT_PART_REQUIRED — a replacement equal to affected_part_id is not a replacement"
