            - "MonthlyStatement.${sm11b_id}.incentive_fee_cents == 1 (EGI == threshold + 10 cents; round_half_up(0.10 * 10) == 1)"
            - "MonthlyStatement.${sm11a_id}.base_fee_cents == 480000 and MonthlyStatement.${sm11b_id}.base_fee_cents == 480000"

      - name: pricing_override_band_exact_boundary
        grounds:
          - validations[priority=8]
          - errors[ERR_OVERRIDE_BAND_EXCEEDED]
        distinguishing_aspect: |
          Different metric (price-override percentage band) on a different
          endpoint (pricing override): with recommended_rent_cents == 200000
          and MAX_OVERRIDE_BAND_PCT == 0.10, override at exactly 220000 (band
          boundary, inclusive) SUCCEEDS while 220001 (one cent beyond) is
          rejected with ERR_OVERRIDE_BAND_EXCEEDED — an inclusive-boundary
          probe, distinct from the strictly-greater threshold probe above.
        test_recipe:
          setup:
            - "Owner O12; Agreement AG12 ACTIVE; Property P12 MANAGED (zero-balance onboarding, one resident)"
            - "Two PROPOSED-then-PUBLISHED pricing recommendations on distinct units U1 and U2, each recommended_rent_cents == 200000, window 2026-10-01..2026-11-01"
