              as: MunicipalPlanner
              as_user_id: "${muni_ms}"
              captures: { parcel_ms1: $.data.id }
            - call: "POST /annexation-cases/${case_ms}/parcels"
              payload: { primary_owner_id: "${ow_ms}", parcel_apn: "MS-2", assessed_value_cents: 30000000, acreage: 5.00, is_developed: true, dwelling_units: 2 }
              as: MunicipalPlanner
              as_user_id: "${muni_ms}"
            - call: "POST /annexation-cases/${case_ms}/parcels"
              payload: { primary_owner_id: "${ow_ms}", parcel_apn: "MS-3", assessed_value_cents: 20000000, acreage: 5.00, is_developed: true, dwelling_units: 2 }
              as: MunicipalPlanner
              as_user_id: "${muni_ms}"
            - call: "POST /annexation-cases/${case_ms}/parcels"
              payload: { primary_owner_id: "${ow_ms}", parcel_apn: "MS-4", assessed_value_cents: 10000000, acreage: 5.00, is_developed: true, dwelling_units: 2 }
              as: MunicipalPlanner
              as_user_id: "${muni_ms}"
            - call: "POST /annexation-cases/${case_ms}/certify-territory"
