          assert:
            - "HTTP status is 409 and ${err_id} == ERR_INVALID_STATEMENT_STATE — the priority-13 state rule, not the priority-46 fiscal rule"
            - "The response is NOT 402 ERR_INSUFFICIENT_POSTAGE_BALANCE even though PermitAccount.${pa_h_id}.balance_cents == 0 and declared_postage_cents == 79152"
            - "Nothing moved: PostageStatement.${stmt_id}.status is still SUBMITTED with revision_index 0, PermitAccount.${pa_h_id}.balance_cents == 0 and reserved_cents == 79152, and CommingleBatch.${batch_id}.status is still DOCUMENTED"
            - "The first submit proves the equality boundary of validation 46: balance_cents 79152 >= declared_postage_cents 79152 was accepted"

      - name: safety_beats_referential_on_stale_move_update_and_class_mismatch
        grounds:
          - validations[priority=23]
          - validations[priority=25]
          - errors.ERR_MOVE_UPDATE_STALE
          - errors.ERR_MAIL_CLASS_MISMATCH
          - calculations.address_hygiene_metrics
        distinguishing_aspect: |
          Pair: category business_safety (priority 23, ERR_MOVE_UPDATE_STALE, 422) against
          category business_referential (priority 25, ERR_MAIL_CLASS_MISMATCH, 422). Both
          rules guard the same endpoint, both return 422, and the mail-class comparison is
          by far the cheaper check — a single field equality against the batch — while the
          move-update check requires resolving the job's highest-run_index
          AddressHygieneRun. A shortest-work-first implementation reports the class
          mismatch. The job is deliberately built so its address_quality_pct is 99.00,
          clearing the priority-24 rule that sits between the two, so the pair is isolated.
        test_recipe:
          setup:
            - "Client CARGO is ACTIVE with an ACTIVE permit account."
            - "MailJob C is a FIRST_CLASS / LETTERS job whose only hygiene run used move-update data 120 days old (> MOVE_UPDATE_MAX_AGE_DAYS 95), so move_update_compliant is false, while its address_quality_pct is 99.00 and therefore above the 95.00 floor."
            - "The open batch is MARKETING_MAIL / LETTERS, so the job's mail_class does not match either."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00.000Z" }
              as: BureauAdmin
            - call: "POST /clients"
              payload: { name: "Cargo Mail Co", client_code: "CARGO", service_fee_rate_per_thousand_cents: 1500 }
              as: BureauAdmin
              captures: { cl_c_id: $.data.id }
            - call: "POST /permit-accounts"
              payload: { client_id: "${cl_c_id}", permit_number: "PI-300300", payment_method: "PERMIT_IMPRINT", annual_fee_paid_through_utc: "2027-01-31T23:59:59.000Z" }
              as: PostageManager
              captures: { pa_c_id: $.data.id }
            - call: "POST /entry-facilities"
              payload: { facility_code: "SCF-021", facility_type: "SCF", zip3: "021", dock_capacity_pallets_per_slot: 12, drop_ship_discount_bp: 300, served_zip3_list: ["021", "022"] }
              as: BureauAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /mail-jobs"
              payload: { client_id: "${cl_c_id}", permit_account_id: "${pa_c_id}", mail_class: "FIRST_CLASS", processing_category: "LETTERS", declared_piece_count: 1000, declared_weight_oz_per_piece: 0.9 }
              as: PresortOperator
              captures: { job_c_id: $.data.id }
            - call: "POST /mail-jobs/${job_c_id}/hygiene-runs"
              payload: { submitted_piece_count: 1000, cass_matched_count: 990, ncoa_move_updated_count: 25, undeliverable_removed_count: 40, move_update_age_days: 120 }
              as: PresortOperator
              captures: { hyg_c_id: $.data.id }
            - call: "POST /commingle-batches"
              payload: { mail_class: "MARKETING_MAIL", processing_category: "LETTERS", entry_facility_id: "${fac_id}" }
              as: PresortOperator
              captures: { batch_id: $.data.id }
          trigger:
            - call: "POST /commingle-batches/${batch_id}/members"
              payload: { mail_job_id: "${job_c_id}" }
              as: PresortOperator
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status is 422 and ${err_id} == ERR_MOVE_UPDATE_STALE — the priority-23 safety rule, not the priority-25 referential rule"
            - "The response is NOT ERR_MAIL_CLASS_MISMATCH even though FIRST_CLASS != MARKETING_MAIL"
            - "AddressHygieneRun.${hyg_c_id}: address_quality_pct == 99.00 and move_update_compliant == false, so the priority-24 rule between the pair is satisfied and cannot be the answer"
            - "No BatchMember was created: MailJob.${job_c_id}.status is still HYGIENE_CLEARED with commingle_batch_id == null, and CommingleBatch.${batch_id}.member_job_count == 0 with total_piece_count == 0"

      - name: state_beats_temporal_on_closed_facility_and_full_dock
        grounds:
          - validations[priority=20]
          - validations[priority=39]
          - errors.ERR_ENTRY_FACILITY_CLOSED
          - errors.ERR_DOCK_CAPACITY_EXCEEDED
          - calculations.dock_capacity_occupancy
        distinguishing_aspect: |
          Pair: category state (priority 20, ERR_ENTRY_FACILITY_CLOSED, 409) against
          category business_temporal (priority 39, ERR_DOCK_CAPACITY_EXCEEDED, 409). Both
          are 409s on POST /drop-shipments and both concern the same EntryFacility row, so
          an implementation that folds facility checks into one pass over the facility's
          shipments will surface whichever it computes first — and dock occupancy is the
          more memorable rule. The facility is closed AND its 4-pallet dock is already fully
          booked across an overlapping window, so both fire; the answer must be
          ERR_ENTRY_FACILITY_CLOSED.
        test_recipe:
          setup:
            - "EntryFacility DDU-021 has dock_capacity_pallets_per_slot 4 and starts OPEN."
            - "Two empty OPEN batches exist, because at most one DropShipment per batch may be SCHEDULED or IN_TRANSIT."
            - "A 4-pallet shipment for batch 1 already occupies the window 2026-08-12T10:00:00.000Z..14:00:00.000Z, filling the dock exactly."
            - "The facility is then closed."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00.000Z" }
              as: BureauAdmin
            - call: "POST /entry-facilities"
              payload: { facility_code: "DDU-021", facility_type: "DDU", zip3: "021", dock_capacity_pallets_per_slot: 4, drop_ship_discount_bp: 500, served_zip3_list: ["021"] }
              as: BureauAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /commingle-batches"
              payload: { mail_class: "MARKETING_MAIL", processing_category: "LETTERS", entry_facility_id: "${fac_id}" }
              as: PresortOperator
              captures: { batch_1_id: $.data.id }
            - call: "POST /commingle-batches"
              payload: { mail_class: "MARKETING_MAIL", processing_category: "LETTERS", entry_facility_id: "${fac_id}" }
              as: PresortOperator
              captures: { batch_2_id: $.data.id }
            - call: "POST /drop-shipments"
              payload: { commingle_batch_id: "${batch_1_id}", entry_facility_id: "${fac_id}", window_start_utc: "2026-08-12T10:00:00.000Z", window_end_utc: "2026-08-12T14:00:00.000Z", pallet_count: 4 }
              as: PresortOperator
              captures: { ship_1_id: $.data.id }
            - call: "POST /entry-facilities/${fac_id}/status"
              payload: { status: "CLOSED" }
              as: BureauAdmin
          trigger:
            - call: "POST /drop-shipments"
              payload: { commingle_batch_id: "${batch_2_id}", entry_facility_id: "${fac_id}", window_start_utc: "2026-08-12T12:00:00.000Z", window_end_utc: "2026-08-12T13:00:00.000Z", pallet_count: 1 }
              as: PresortOperator
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status is 409 and ${err_id} == ERR_ENTRY_FACILITY_CLOSED — the priority-20 state rule, not the priority-39 temporal rule"
            - "The response is NOT ERR_DOCK_CAPACITY_EXCEEDED even though occupied 4 + requested 1 == 5 > dock_capacity_pallets_per_slot 4 over the overlapping half-open window"
            - "No DropShipment row was created for CommingleBatch.${batch_2_id}: GET /commingle-batches/${batch_2_id}/drop-shipments returns an empty list"
            - "DropShipment.${ship_1_id} is untouched at status SCHEDULED with pallet_count 4"

  # ===========================================================================
  # Rule 6 — Boundary/precision checks on three different metrics at three
  #          different endpoints (days / pieces-per-container / collection size)
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: move_update_age_exactly_ninety_five_days_is_compliant
        grounds:
          - calculations.address_hygiene_metrics
          - entities.AddressHygieneRun.fields.move_update_compliant
          - entities.AddressHygieneRun.fields.address_quality_pct
          - endpoints[POST /mail-jobs/{id}/hygiene-runs]
        distinguishing_aspect: |
          Metric: move-update data AGE IN DAYS at the MOVE_UPDATE_MAX_AGE_DAYS boundary,
          exercised at POST /mail-jobs/{id}/hygiene-runs. The comparison is
          `<=`, so 95 days is compliant and 96 is not — a strict `<` implementation
          flips both jobs. The same call also pins the two-decimal round_half_up on
          address_quality_pct (990/1000 -> 99.00, not 99.0 or 99) and the fact that
          net_piece_count subtracts only undeliverable_removed_count.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-10T09:00:00.000Z."
            - "Client PIVOT is ACTIVE with an ACTIVE permit account."
            - "Two RECEIVED MARKETING_MAIL/LETTERS jobs exist, each declaring 1000 pieces, with no hygiene run yet (hygiene_run_count == 0)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00.000Z" }
              as: BureauAdmin
            - call: "POST /clients"
              payload: { name: "Pivot Print", client_code: "PIVOT", service_fee_rate_per_thousand_cents: 1100 }
              as: BureauAdmin
              captures: { cl_p_id: $.data.id }
            - call: "POST /permit-accounts"
              payload: { client_id: "${cl_p_id}", permit_number: "PI-400400", payment_method: "PERMIT_IMPRINT", annual_fee_paid_through_utc: "2027-01-31T23:59:59.000Z" }
              as: PostageManager
              captures: { pa_p_id: $.data.id }
            - call: "POST /mail-jobs"
              payload: { client_id: "${cl_p_id}", permit_account_id: "${pa_p_id}", mail_class: "MARKETING_MAIL", processing_category: "LETTERS", declared_piece_count: 1000, declared_weight_oz_per_piece: 1.0 }
              as: PresortOperator
              captures: { job_p_id: $.data.id }
            - call: "POST /mail-jobs"
              payload: { client_id: "${cl_p_id}", permit_account_id: "${pa_p_id}", mail_class: "MARKETING_MAIL", processing_category: "LETTERS", declared_piece_count: 1000, declared_weight_oz_per_piece: 1.0 }
              as: PresortOperator
              captures: { job_q_id: $.data.id }
          trigger:
            - call: "POST /mail-jobs/${job_p_id}/hygiene-runs"
              payload: { submitted_piece_count: 1000, cass_matched_count: 990, ncoa_move_updated_count: 30, undeliverable_removed_count: 40, move_update_age_days: 95 }
              as: PresortOperator
              captures: { hyg_p_id: $.data.id }
            - call: "POST /mail-jobs/${job_q_id}/hygiene-runs"
              payload: { submitted_piece_count: 1000, cass_matched_count: 990, ncoa_move_updated_count: 30, undeliverable_removed_count: 40, move_update_age_days: 96 }
              as: PresortOperator
              captures: { hyg_q_id: $.data.id }
          assert:
            - "AddressHygieneRun.${hyg_p_id}: move_update_age_days == 95 and move_update_compliant == true (the `<=` boundary is inclusive)"
            - "AddressHygieneRun.${hyg_q_id}: move_update_age_days == 96 and move_update_compliant == false (one day past the boundary)"
            - "Both runs: run_index == 0 (the count BEFORE this run), net_piece_count == 960, address_quality_pct == 99.00 with exactly two decimal places"
            - "MailJob.${job_p_id}: status == HYGIENE_CLEARED, hygiene_run_count == 1, accepted_piece_count == 960, address_quality_pct == 99.00, move_update_compliant == true"
            - "MailJob.${job_q_id}: status == HYGIENE_CLEARED, accepted_piece_count == 960, move_update_compliant == false — the run is accepted (201) even though the job is not poolable; the gate lives at pooling, not here"
            - "net_piece_count subtracted only undeliverable_removed_count: 1000 - 40 == 960, and did NOT subtract ncoa_move_updated_count 30 (which would give 930)"

      - name: tray_five_digit_at_exactly_one_hundred_fifty_pieces_qualifies
        grounds:
          - calculations.container_qualification
          - entities.SortContainer.fields.qualifies
          - entities.SortContainer.fields.sequence_index
          - endpoints[POST /commingle-batches/{id}/containers]
        distinguishing_aspect: |
          Metric: PIECES PER CONTAINER against two different minimums at
          POST /commingle-batches/{id}/containers. TRAY_MIN_PIECES_DEEP
          (150) and PALLET_MIN_PIECES (250) are both `>=` boundaries, tested at exactly
          the minimum and one below on both container types in the same batch, so a
          single-threshold or strict-`>` implementation cannot pass all four. The four
          creations also pin sequence_index as a zero-based count of containers ALREADY
          attached, and pin placard_id to null before sortation for qualifying and
          non-qualifying containers alike.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-10T09:00:00.000Z."
            - "EntryFacility SCF-021 is OPEN and one OPEN MARKETING_MAIL/LETTERS batch exists with no containers yet (container_count == 0)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00.000Z" }
              as: BureauAdmin
            - call: "POST /entry-facilities"
              payload: { facility_code: "SCF-021", facility_type: "SCF", zip3: "021", dock_capacity_pallets_per_slot: 12, drop_ship_discount_bp: 300, served_zip3_list: ["021", "022"] }
              as: BureauAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /commingle-batches"
              payload: { mail_class: "MARKETING_MAIL", processing_category: "LETTERS", entry_facility_id: "${fac_id}" }
              as: PresortOperator
              captures: { batch_id: $.data.id }
          trigger:
            - call: "POST /commingle-batches/${batch_id}/containers"
              payload: { container_type: "TRAY", destination_zip3: "021", sort_level: "FIVE_DIGIT", piece_count: 150 }
              as: PresortOperator
              captures: { c_at_min_id: $.data.id }
            - call: "POST /commingle-batches/${batch_id}/containers"
              payload: { container_type: "TRAY", destination_zip3: "022", sort_level: "FIVE_DIGIT", piece_count: 149 }
              as: PresortOperator
              captures: { c_below_min_id: $.data.id }
            - call: "POST /commingle-batches/${batch_id}/containers"
              payload: { container_type: "PALLET", destination_zip3: "021", sort_level: "THREE_DIGIT", piece_count: 249 }
              as: PresortOperator
              captures: { p_below_min_id: $.data.id }
            - call: "POST /commingle-batches/${batch_id}/containers"
              payload: { container_type: "PALLET", destination_zip3: "022", sort_level: "THREE_DIGIT", piece_count: 250 }
              as: PresortOperator
              captures: { p_at_min_id: $.data.id }
          assert:
            - "SortContainer.${c_at_min_id}: piece_count == 150, qualifies == true, sequence_index == 0 (TRAY_MIN_PIECES_DEEP is inclusive)"
            - "SortContainer.${c_below_min_id}: piece_count == 149, qualifies == false, sequence_index == 1"
            - "SortContainer.${p_below_min_id}: piece_count == 249, qualifies == false, sequence_index == 2 — a PALLET is held to 250, not to the tray minimum of 150"
            - "SortContainer.${p_at_min_id}: piece_count == 250, qualifies == true, sequence_index == 3"
            - "All four rows have placard_id == null and status == STAGED: qualification is a flag computed at creation, not a rejection, and placards are stamped only at sortation"
            - "CommingleBatch.${batch_id}.container_count == 4 while total_piece_count remains 0, because pieces come from members and not from containers"

      - name: sort_rejects_batch_with_zero_containers
        grounds:
          - validations[priority=32]
          - errors.ERR_BATCH_HAS_NO_CONTAINERS
          - entities.CommingleBatch.fields.container_count
          - endpoints[POST /commingle-batches/{id}/sort]
        distinguishing_aspect: |
          Metric: EMPTY-COLLECTION SIZE at the zero boundary, at a third endpoint,
          POST /commingle-batches/{id}/sort. The batch has one member and
          1200 pooled pieces but container_count == 0, so a sort would compute a tier and a
          rate over pieces that are in no physical container. Skipping the >= 1 check makes
          the sum-of-containers rule (priority 34) vacuously true for an empty sum, so the
          batch would sort successfully with 0 containers — the boundary must be enforced
          explicitly rather than falling out of the arithmetic.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-10T09:00:00.000Z."
            - "Client SOLO has one HYGIENE_CLEARED job of 1200 accepted pieces pooled into an OPEN batch, so member_job_count == 1 and total_piece_count == 1200."
            - "No SortContainer has been attached: container_count == 0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00.000Z" }
              as: BureauAdmin
            - call: "POST /clients"
              payload: { name: "Solo Mailworks", client_code: "SOLO", service_fee_rate_per_thousand_cents: 1300 }
              as: BureauAdmin
              captures: { cl_s_id: $.data.id }
            - call: "POST /permit-accounts"
              payload: { client_id: "${cl_s_id}", permit_number: "PI-500500", payment_method: "PERMIT_IMPRINT", annual_fee_paid_through_utc: "2027-01-31T23:59:59.000Z" }
              as: PostageManager
              captures: { pa_s_id: $.data.id }
            - call: "POST /entry-facilities"
              payload: { facility_code: "SCF-021", facility_type: "SCF", zip3: "021", dock_capacity_pallets_per_slot: 12, drop_ship_discount_bp: 300, served_zip3_list: ["021", "022"] }
              as: BureauAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /mail-jobs"
              payload: { client_id: "${cl_s_id}", permit_account_id: "${pa_s_id}", mail_class: "MARKETING_MAIL", processing_category: "LETTERS", declared_piece_count: 1250, declared_weight_oz_per_piece: 1.2 }
              as: PresortOperator
              captures: { job_s_id: $.data.id }
            - call: "POST /mail-jobs/${job_s_id}/hygiene-runs"
              payload: { submitted_piece_count: 1250, cass_matched_count: 1235, ncoa_move_updated_count: 40, undeliverable_removed_count: 50, move_update_age_days: 30 }
              as: PresortOperator
            - call: "POST /commingle-batches"
              payload: { mail_class: "MARKETING_MAIL", processing_category: "LETTERS", entry_facility_id: "${fac_id}" }
              as: PresortOperator
              captures: { batch_id: $.data.id }
            - call: "POST /commingle-batches/${batch_id}/members"
              payload: { mail_job_id: "${job_s_id}" }
              as: PresortOperator
              captures: { mem_s_id: $.data.id }
          trigger:
            - call: "POST /commingle-batches/${batch_id}/sort"
              payload: {}
              as: PresortOperator
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status is 422 and ${err_id} == ERR_BATCH_HAS_NO_CONTAINERS"
            - "CommingleBatch.${batch_id}: container_count == 0 at the rejected boundary while member_job_count == 1 and total_piece_count == 1200 — the member side of the priority-32 rule is satisfied, so only the container side can be the cause"
            - "Nothing was frozen: CommingleBatch.${batch_id}.status is still OPEN with achieved_tier NONE, rate_mills_per_piece 0 and batch_postage_cents 0"
            - "BatchMember.${mem_s_id}.allocated_postage_cents == 0 with share_basis_pct == null, and MailJob.${job_s_id}.status is still POOLED"

  # ===========================================================================
  # Rule 7 — Cross-entity state dependencies over three distinct entity pairs
  #   MailJob <-> PermitAccount ; DropShipment <-> PostageStatement ;
  #   PostageStatement <-> CommingleBatch
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: pooling_requires_active_permit_account
        grounds:
          - validations[priority=19]
          - errors.ERR_PERMIT_ACCOUNT_NOT_ACTIVE
          - state_machines.PermitAccount.ACTIVE_to_HOLD
          - state_machines.MailJob.HYGIENE_CLEARED_to_POOLED
        distinguishing_aspect: |
          Pair MailJob <-> PermitAccount. Nothing about the MailJob row changes between the
          refused call and the accepted one: it is HYGIENE_CLEARED, compliant, above the
          quality floor and class-matched in both. The only difference is the state of a
          THIRD row reached indirectly through MailJob.permit_account_id, so the guard
          cannot be answered from the job or the batch alone. The permit is put on HOLD
          after the job was created, proving the check is re-evaluated at pooling time
          rather than cached at job creation.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-10T09:00:00.000Z."
            - "Client GATE is ACTIVE with permit account PI-600600, which was ACTIVE while the job and its hygiene run were created."
            - "MailJob G is HYGIENE_CLEARED with accepted_piece_count 1200, address_quality_pct 98.80 and move_update_compliant true."
            - "An OPEN MARKETING_MAIL/LETTERS batch is waiting, and the permit account has since been placed on HOLD."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00.000Z" }
              as: BureauAdmin
            - call: "POST /clients"
              payload: { name: "Gatehouse Mail", client_code: "GATE", service_fee_rate_per_thousand_cents: 1000 }
              as: BureauAdmin
              captures: { cl_g_id: $.data.id }
            - call: "POST /permit-accounts"
              payload: { client_id: "${cl_g_id}", permit_number: "PI-600600", payment_method: "PERMIT_IMPRINT", annual_fee_paid_through_utc: "2027-01-31T23:59:59.000Z" }
              as: PostageManager
              captures: { pa_g_id: $.data.id }
            - call: "POST /entry-facilities"
              payload: { facility_code: "SCF-021", facility_type: "SCF", zip3: "021", dock_capacity_pallets_per_slot: 12, drop_ship_discount_bp: 300, served_zip3_list: ["021", "022"] }
              as: BureauAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /mail-jobs"
              payload: { client_id: "${cl_g_id}", permit_account_id: "${pa_g_id}", mail_class: "MARKETING_MAIL", processing_category: "LETTERS", declared_piece_count: 1250, declared_weight_oz_per_piece: 1.2 }
              as: PresortOperator
              captures: { job_g_id: $.data.id }
            - call: "POST /mail-jobs/${job_g_id}/hygiene-runs"
              payload: { submitted_piece_count: 1250, cass_matched_count: 1235, ncoa_move_updated_count: 40, undeliverable_removed_count: 50, move_update_age_days: 30 }
              as: PresortOperator
            - call: "POST /commingle-batches"
              payload: { mail_class: "MARKETING_MAIL", processing_category: "LETTERS", entry_facility_id: "${fac_id}" }
              as: PresortOperator
              captures: { batch_id: $.data.id }
            - call: "POST /permit-accounts/${pa_g_id}/status"
              payload: { status: "HOLD", reason: "annual fee review" }
              as: PostageManager
          trigger:
            - call: "POST /commingle-batches/${batch_id}/members"
              payload: { mail_job_id: "${job_g_id}" }
              as: PresortOperator
              captures: { err_id: $.data.error_id }
            - call: "POST /permit-accounts/${pa_g_id}/status"
              payload: { status: "ACTIVE" }
              as: PostageManager
            - call: "POST /commingle-batches/${batch_id}/members"
              payload: { mail_job_id: "${job_g_id}" }
              as: PresortOperator
              captures: { mem_g_id: $.data.id }
          assert:
            - "First attempt: HTTP 409 with ${err_id} == ERR_PERMIT_ACCOUNT_NOT_ACTIVE while PermitAccount.${pa_g_id}.status == HOLD"
            - "After the refusal nothing changed: MailJob.${job_g_id}.status == HYGIENE_CLEARED with commingle_batch_id == null, and CommingleBatch.${batch_id}.member_job_count == 0"
            - "Second attempt with the identical payload: HTTP 201, BatchMember.${mem_g_id}.contributed_piece_count == 1200 and MailJob.${job_g_id}.status == POOLED"
            - "CommingleBatch.${batch_id}: member_job_count == 1 and total_piece_count == 1200 — only the permit account's state differed between the two calls"

      - name: deposit_requires_accepted_postage_statement
        grounds:
          - validations[priority=21]
          - errors.ERR_STATEMENT_NOT_ACCEPTED
          - state_machines.DropShipment.IN_TRANSIT_to_DEPOSITED
          - state_machines.PostageStatement.SUBMITTED_to_ACCEPTED_CLEAN
        distinguishing_aspect: |
          Pair DropShipment <-> PostageStatement, reached indirectly: the deposit endpoint
          holds a DropShipment id, and the statement is two hops away through
          DropShipment.commingle_batch_id -> PostageStatement.commingle_batch_id. The
          shipment itself is perfectly depositable (IN_TRANSIT, inside its appointment
          window) and the batch is DOCUMENTED, so every locally visible precondition
          passes; only the statement's verification state forbids the deposit. Accepting
          the statement without touching the shipment then makes the identical call succeed.
        test_recipe:
          setup:
            - "The canonical batch is sorted and its statement submitted by pm-001 but not yet verified."
          setup_api_calls: *chain_submitted
          trigger:
            - call: "POST /drop-shipments"
