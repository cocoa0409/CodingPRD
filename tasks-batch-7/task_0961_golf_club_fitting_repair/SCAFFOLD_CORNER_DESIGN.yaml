            - "POST as Instructor returns 403 with error_id == ERR_FORBIDDEN_ROLE"

      - name: appraiser_cannot_adjust_own_listing_price
        claim_type: segregation_of_duties
        grounds: ["validations[priority=8]", "errors[ERR_SEGREGATION_OF_DUTIES]", entities.UsedClubListing.fields.appraised_by_staff_id]
        distinguishing_aspect: "the manager who issued the winning offer may not adjust the resulting listing's price (403 ERR_SEGREGATION_OF_DUTIES); a different manager may."
        test_recipe:
          setup: ["managers M1 and M2; listing LISTED (WEDGE grade A -> offered 5399 -> list price 7559) appraised by M1"]
          setup_api_calls:
            - call: "POST /golf-shop/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T09:00:00Z" }
              as: ShopAdmin
            - call: "POST /golf-shop/customers"
              payload: { full_name: "Moe Mere", email: "moe@example.com" }
              as: ShopAdmin
              captures: { c_id: $.data.id }
            - call: "POST /golf-shop/staff"
              payload: { full_name: "Mary One", staff_role: "SHOP_MANAGER" }
              as: ShopAdmin
              captures: { m1_id: $.data.id }
            - call: "POST /golf-shop/staff"
              payload: { full_name: "Mark Two", staff_role: "SHOP_MANAGER" }
              as: ShopAdmin
              captures: { m2_id: $.data.id }
            - call: "POST /golf-shop/trade-in-appraisals"
              payload: { customer_id: "${c_id}", clubs: [ { club_type: "WEDGE", condition_grade: "A" } ] }
              as: Customer
              as_user_id: "${c_id}"
              captures: { appr_id: $.data.id, appr_v: $.data.version }
            - call: "POST /golf-shop/trade-in-appraisals/${appr_id}/offers"
              payload: { basis: "GRADE_MATRIX", expected_appraisal_version: "${appr_v}" }
              as: ShopManager
              as_user_id: "${m1_id}"
            - call: "POST /golf-shop/trade-in-appraisals/${appr_id}/accept"
              as: Customer
              as_user_id: "${c_id}"
            - call: "GET /golf-shop/used-club-listings"
              payload: { appraisal_id: "${appr_id}" }
              as: ShopManager
              as_user_id: "${m2_id}"
              captures: { lst_id: "$$.data[0].id" }
          trigger:
            - call: "POST /golf-shop/used-club-listings/${lst_id}/adjust-price"
              payload: { new_price_cents: 6000 }
              as: ShopManager
              as_user_id: "${m1_id}"
              captures: { err: $.data.error_id }
            - call: "POST /golf-shop/used-club-listings/${lst_id}/adjust-price"
              payload: { new_price_cents: 6000 }
              as: ShopManager
              as_user_id: "${m2_id}"
          assert:
            - "M1 (the appraiser) gets 403 ERR_SEGREGATION_OF_DUTIES"
            - "M2 succeeds: list_price_cents == 6000 (initial was 7559 = round(5399*1.4))"

