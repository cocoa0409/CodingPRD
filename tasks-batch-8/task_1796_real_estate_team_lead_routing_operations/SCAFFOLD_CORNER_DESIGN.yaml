      - name: duplicate_license_number_rejected_per_team
        claim_type: violation_to_error
        grounds: ["errors[ERR_DUPLICATE_LICENSE_NUMBER]", entities.Agent.fields.license_number]
        distinguishing_aspect: "Tenant-scoped uniqueness: the same license number on the same team fails; the same number on a DIFFERENT team succeeds."
        test_recipe:
