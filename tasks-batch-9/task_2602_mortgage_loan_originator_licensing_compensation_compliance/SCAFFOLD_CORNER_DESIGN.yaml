      - name: elevated_originator_pricing_exception_requires_second_approver
        claim_type: error_triggerable
        grounds:
          - validations[priority=18]
          - errors[ERR_SECOND_APPROVAL_REQUIRED]
          - calculations.dual_comp_steering_exposure_score
        distinguishing_aspect: |
          The first close reports dual compensation on an 80-bps-spread loan that already
          carries an APPROVED exception, so the score is 0.35*100 + 0.25*80 + 0.15*100 = 70 and
          monitoring_status flips to ELEVATED. The next exception is therefore created with
          requires_second_approval true, and an APPROVE without second_approver_user_id returns
          422 ERR_SECOND_APPROVAL_REQUIRED; supplying officer-2 (distinct from both the
          requester and the decider) succeeds.
        test_recipe:
          setup:
            - "Originator 2200001, ACTIVE sponsored CA licence, ACTIVE plan at 105 bps
               (max_fee_cents 5000000, volume_tier_enabled false,
               concession_absorption_enabled false)."
            - "Loan 1: par 650 / note 730, locked and funded 20000000, one APPROVED
               PricingException, closed with lender_paid_comp_cents 200000 AND
               borrower_paid_comp_cents 10000 while the originator was still STANDARD."
            - "Loan 2: locked at 20000000 and still LOCKED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
