# =============================================================================
# Task 1177 — Scaffold Difficulty Design (§1.8 Test Targeting Index)
# Two instances per §0.5 Difficulty Rule. All numeric asserts were computed by
# executing the pinned formulas against the pinned inputs.
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: lot_landed_cost_provisional_vs_final_on_inspection
        grounds:
          - calculations.lot_landed_cost
          - entities.PurchaseLot.fields.provisional_cost_cents
          - entities.PurchaseLot.fields.adjusted_cost_cents
          - state_machines.PurchaseLot.INSPECTED_to_ACCEPTED
        distinguishing_aspect: |
          Entity domain = PurchaseLot cost accounting. Same lot data (100 units
          @ $10.00, defect_pct 20) yields provisional_cost_cents == 100000 under
          the PROVISIONAL variant but adjusted_cost_cents == 85000 under the
          FINAL variant (final_unit = 10.00 * (1 - (20-5)/100) = 8.5000).
        test_recipe:
          setup:
            - "Clock 2026-05-01T08:00:00Z; commodity TOM (band 45-55F); shipper S; DailyPrice TOM 2026-05-01 low 8.00 high 12.00"
            - "Lot: 100 units @ 10.00, RECEIVED, inspection PASS with defect_pct 20 CERTIFIED"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T08:00:00Z" }, as: MarketAdmin }
            - { call: "POST /market/commodities", payload: { code: "TOM", name: "Tomato", ethylene_class: "PRODUCER", temp_min_f: 45, temp_max_f: 55, max_violation_minutes: 60 }, as: MarketAdmin, captures: { com: "$.data.id" } }
            - { call: "POST /market/shippers", payload: { name: "Shipper One", paca_license: "PACA-001" }, as: MarketAdmin, captures: { sh: "$.data.id" } }
            - { call: "POST /market/daily-prices", payload: { commodity_id: "${com}", market_date: "2026-05-01", low_price: 8.00, high_price: 12.00 }, as: MarketAdmin }
            - { call: "POST /market/purchase-lots", payload: { shipper_id: "${sh}", commodity_id: "${com}", market_date: "2026-05-01", quantity_units: 100, shipper_unit_price: 10.00, declared_grade: "US1" }, as: Receiver, captures: { lot: "$.data.id" } }
            - { call: "POST /market/purchase-lots/${lot}/receive", payload: {}, as: Receiver }
            - { call: "POST /market/inspections", payload: { purchase_lot_id: "${lot}", inspected_grade: "US1", defect_pct: 20, result: "PASS" }, as: USDAInspector, captures: { insp: "$.data.id" } }
          trigger:
            - { call: "POST /market/inspections/${insp}/certify", payload: {}, as: USDAInspector }
            - { call: "GET /market/purchase-lots/${lot}", payload: {}, as: Receiver, captures: { prov: "$.data.provisional_cost_cents", adj: "$.data.adjusted_cost_cents", pay: "$.data.payable_cents" } }
          assert:
            - "PurchaseLot.${lot}.provisional_cost_cents == 100000"
            - "PurchaseLot.${lot}.adjusted_cost_cents == 85000"
            - "PurchaseLot.${lot}.payable_cents == 85000"
            - "provisional (100000) != final (85000) for identical lot inputs"
            - "PurchaseLot.${lot}.status == ACCEPTED"

      - name: labor_charge_hourly_vs_piece_same_shift
        grounds:
          - calculations.labor_charge
          - entities.LaborTicket.fields.charge_cents
        distinguishing_aspect: |
          Entity domain = LaborTicket crew costing (different domain from
          PurchaseLot cost accounting). Identical shift numerics (6 hours,
          400 pieces, $20.00/hr, $0.25/piece) yield charge_cents == 12000 under
          HOURLY but charge_cents == 10000 under PIECE
          (max(400*0.25, 6*15.00) = max(100.00, 90.00) = 100.00).
        test_recipe:
          setup:
            - "Clock 2026-05-01T08:00:00Z; commodity, shipper, daily price; one ACCEPTED lot (100 @ 10.00, defect 0)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T08:00:00Z" }, as: MarketAdmin }
            - { call: "POST /market/commodities", payload: { code: "TOM", name: "Tomato", ethylene_class: "PRODUCER", temp_min_f: 45, temp_max_f: 55, max_violation_minutes: 60 }, as: MarketAdmin, captures: { com: "$.data.id" } }
            - { call: "POST /market/shippers", payload: { name: "Shipper One", paca_license: "PACA-001" }, as: MarketAdmin, captures: { sh: "$.data.id" } }
            - { call: "POST /market/daily-prices", payload: { commodity_id: "${com}", market_date: "2026-05-01", low_price: 8.00, high_price: 12.00 }, as: MarketAdmin }
            - { call: "POST /market/purchase-lots", payload: { shipper_id: "${sh}", commodity_id: "${com}", market_date: "2026-05-01", quantity_units: 100, shipper_unit_price: 10.00, declared_grade: "US1" }, as: Receiver, captures: { lot: "$.data.id" } }
            - { call: "POST /market/purchase-lots/${lot}/receive", payload: {}, as: Receiver }
            - { call: "POST /market/inspections", payload: { purchase_lot_id: "${lot}", inspected_grade: "US1", defect_pct: 0, result: "PASS" }, as: USDAInspector, captures: { insp: "$.data.id" } }
            - { call: "POST /market/inspections/${insp}/certify", payload: {}, as: USDAInspector }
          trigger:
            - { call: "POST /market/labor-tickets", payload: { purchase_lot_id: "${lot}", ticket_type: "HOURLY", work_date: "2026-05-01", hours: 6, pieces: 400, hourly_rate: 20.00, piece_rate: 0.25 }, as: Receiver, captures: { t_hourly: "$.data.charge_cents" } }
            - { call: "POST /market/labor-tickets", payload: { purchase_lot_id: "${lot}", ticket_type: "PIECE", work_date: "2026-05-01", hours: 6, pieces: 400, hourly_rate: 20.00, piece_rate: 0.25 }, as: Receiver, captures: { t_piece: "$.data.charge_cents" } }
          assert:
            - "HOURLY ticket charge_cents == 12000"
            - "PIECE ticket charge_cents == 10000"
            - "identical shift numerics produce different charges across the two variants (12000 != 10000)"

  - rule_id: combinatorial_formula
    instances:
      - name: invoice_settlement_nested_totals_and_discount
        grounds:
          - calculations.invoice_settlement
          - entities.Invoice.fields.total_cents
          - entities.Invoice.fields.discount_taken_cents
        distinguishing_aspect: |
          Mode (a): >= 3 inputs with non-linear interaction — subtotal feeds
          total (subtotal + pallet_count * 2500), a conditional discount branch
          keyed on paid date vs discount_eligible_until, then
          balance = total - discount - paid. Order: 10 units @ 12.50 + 5 @ 8.00
          -> subtotal 16500; 2 pallets -> deposit 5000 -> total 21500; payment
          on day 2 earns discount round_half_up(21500*0.02) = 430; pay 21070 ->
          balance 0, PAID.
        test_recipe:
          setup:
            - "Clock 2026-05-01T08:00:00Z; one ACCEPTED lot (100 @ 10.00); customer credit_limit 1000000, terms_days 10"
            - "Order: two lines on the lot (10 @ 12.50; 5 @ 8.00), pallet_count 2, delivery 2026-05-02 window 08:00-10:00; confirmed, picked, delivered, invoiced"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T08:00:00Z" }, as: MarketAdmin }
            - { call: "POST /market/commodities", payload: { code: "TOM", name: "Tomato", ethylene_class: "PRODUCER", temp_min_f: 45, temp_max_f: 55, max_violation_minutes: 60 }, as: MarketAdmin, captures: { com: "$.data.id" } }
            - { call: "POST /market/shippers", payload: { name: "Shipper One", paca_license: "PACA-001" }, as: MarketAdmin, captures: { sh: "$.data.id" } }
            - { call: "POST /market/daily-prices", payload: { commodity_id: "${com}", market_date: "2026-05-01", low_price: 8.00, high_price: 12.00 }, as: MarketAdmin }
            - { call: "POST /market/purchase-lots", payload: { shipper_id: "${sh}", commodity_id: "${com}", market_date: "2026-05-01", quantity_units: 100, shipper_unit_price: 10.00, declared_grade: "US1" }, as: Receiver, captures: { lot: "$.data.id" } }
            - { call: "POST /market/purchase-lots/${lot}/receive", payload: {}, as: Receiver }
            - { call: "POST /market/inspections", payload: { purchase_lot_id: "${lot}", inspected_grade: "US1", defect_pct: 0, result: "PASS" }, as: USDAInspector, captures: { insp: "$.data.id" } }
            - { call: "POST /market/inspections/${insp}/certify", payload: {}, as: USDAInspector }
            - { call: "POST /market/customers", payload: { name: "Buyer A", credit_limit_cents: 1000000, terms_days: 10 }, as: MarketAdmin, captures: { cust: "$.data.id" } }
            - { call: "POST /market/sales-orders", payload: { customer_id: "${cust}", delivery_date: "2026-05-02", window_start: "08:00", window_end: "10:00", pallet_count: 2, lines: [ { lot_id: "${lot}", quantity: 10, unit_price: 12.50 }, { lot_id: "${lot}", quantity: 5, unit_price: 8.00 } ] }, as: SalesDesk, captures: { ord: "$.data.id" } }
            - { call: "POST /market/sales-orders/${ord}/confirm", payload: {}, as: SalesDesk }
            - { call: "POST /market/sales-orders/${ord}/pick", payload: {}, as: Receiver }
            - { call: "POST /market/sales-orders/${ord}/deliver", payload: {}, as: Receiver }
            - { call: "POST /market/invoices", payload: { sales_order_id: "${ord}" }, as: BillingClerk, captures: { inv: "$.data.id", total: "$.data.total_cents" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-02T09:00:00Z" }, as: MarketAdmin }
          trigger:
            - { call: "POST /market/payments", payload: { invoice_id: "${inv}", amount_cents: 21070 }, as: BillingClerk }
            - { call: "GET /market/invoices/${inv}", payload: {}, as: BillingClerk, captures: { bal: "$.data.balance_cents", disc: "$.data.discount_taken_cents", ist: "$.data.status" } }
          assert:
            - "Invoice.${inv}.subtotal_cents == 16500"
            - "Invoice.${inv}.deposit_cents == 5000"
            - "Invoice.${inv}.total_cents == 21500"
            - "Invoice.${inv}.due_date == 2026-05-11 (invoice_date 2026-05-01 + terms 10)"
            - "Invoice.${inv}.discount_eligible_until == 2026-05-06"
            - "payment on 2026-05-02 (<= 2026-05-06) earns discount_taken_cents == 430"
            - "Invoice.${inv}.balance_cents == 0 and status == PAID after paying 21070"

      - name: order_subtotal_per_line_rounding_then_sum
        grounds:
          - calculations.order_subtotal
          - entities.SalesOrder.fields.subtotal_cents
        distinguishing_aspect: |
          Mode (b): nested rounding order pinned — round each line to cents
          (round_half_up), THEN sum. Two lines of unit_price 2.505 x qty 1 give
          round(250.5) + round(250.5) = 251 + 251 = 502; the forbidden
          sum-then-round order would give round(501.0) = 501. Different mode
          from invoice_settlement's mode (a).
        test_recipe:
          setup:
            - "Clock 2026-05-01T08:00:00Z; DailyPrice band 2.00-3.00; two ACCEPTED lots L1, L2 (10 units @ 2.505 each); customer with ample credit"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T08:00:00Z" }, as: MarketAdmin }
            - { call: "POST /market/commodities", payload: { code: "HER", name: "Herbs", ethylene_class: "NEUTRAL", temp_min_f: 34, temp_max_f: 40, max_violation_minutes: 60 }, as: MarketAdmin, captures: { com: "$.data.id" } }
            - { call: "POST /market/shippers", payload: { name: "Shipper Two", paca_license: "PACA-002" }, as: MarketAdmin, captures: { sh: "$.data.id" } }
            - { call: "POST /market/daily-prices", payload: { commodity_id: "${com}", market_date: "2026-05-01", low_price: 2.00, high_price: 3.00 }, as: MarketAdmin }
            - { call: "POST /market/purchase-lots", payload: { shipper_id: "${sh}", commodity_id: "${com}", market_date: "2026-05-01", quantity_units: 10, shipper_unit_price: 2.505, declared_grade: "US1" }, as: Receiver, captures: { lot1: "$.data.id" } }
            - { call: "POST /market/purchase-lots", payload: { shipper_id: "${sh}", commodity_id: "${com}", market_date: "2026-05-01", quantity_units: 10, shipper_unit_price: 2.505, declared_grade: "US1" }, as: Receiver, captures: { lot2: "$.data.id" } }
            - { call: "POST /market/purchase-lots/${lot1}/receive", payload: {}, as: Receiver }
            - { call: "POST /market/purchase-lots/${lot2}/receive", payload: {}, as: Receiver }
            - { call: "POST /market/inspections", payload: { purchase_lot_id: "${lot1}", inspected_grade: "US1", defect_pct: 0, result: "PASS" }, as: USDAInspector, captures: { insp1: "$.data.id" } }
            - { call: "POST /market/inspections/${insp1}/certify", payload: {}, as: USDAInspector }
            - { call: "POST /market/inspections", payload: { purchase_lot_id: "${lot2}", inspected_grade: "US1", defect_pct: 0, result: "PASS" }, as: USDAInspector, captures: { insp2: "$.data.id" } }
            - { call: "POST /market/inspections/${insp2}/certify", payload: {}, as: USDAInspector }
            - { call: "POST /market/customers", payload: { name: "Buyer B", credit_limit_cents: 1000000 }, as: MarketAdmin, captures: { cust: "$.data.id" } }
          trigger:
            - { call: "POST /market/sales-orders", payload: { customer_id: "${cust}", delivery_date: "2026-05-02", window_start: "08:00", window_end: "10:00", lines: [ { lot_id: "${lot1}", quantity: 1, unit_price: 2.505 }, { lot_id: "${lot2}", quantity: 1, unit_price: 2.505 } ] }, as: SalesDesk, captures: { sub: "$.data.subtotal_cents" } }
          assert:
            - "SalesOrder.subtotal_cents == 502 (per-line round_half_up then sum)"
            - "sum-then-round would produce 501 — the pinned order is observable and mandatory"

  - rule_id: non_linear_state_machine
    instances:
      - name: purchase_lot_dispute_reinspection_cycle
        grounds:
          - state_machines.PurchaseLot.INSPECTED_to_DISPUTED
          - state_machines.PurchaseLot.DISPUTED_to_INSPECTED
          - state_machines.PurchaseLot.INSPECTED_to_ACCEPTED
        distinguishing_aspect: |
          Entity = PurchaseLot; shape = cycle INSPECTED -> DISPUTED -> INSPECTED
          -> ACCEPTED driven by a FAIL certification, a Receiver dispute, and a
          re-inspection round. The loop back into INSPECTED is what a linear
          pipeline cannot express.
        test_recipe:
          setup:
            - "Clock 2026-05-01T08:00:00Z; lot 100 @ 10.00 RECEIVED; first inspection FAIL defect_pct 25 CERTIFIED"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T08:00:00Z" }, as: MarketAdmin }
            - { call: "POST /market/commodities", payload: { code: "TOM", name: "Tomato", ethylene_class: "PRODUCER", temp_min_f: 45, temp_max_f: 55, max_violation_minutes: 60 }, as: MarketAdmin, captures: { com: "$.data.id" } }
            - { call: "POST /market/shippers", payload: { name: "Shipper One", paca_license: "PACA-001" }, as: MarketAdmin, captures: { sh: "$.data.id" } }
            - { call: "POST /market/daily-prices", payload: { commodity_id: "${com}", market_date: "2026-05-01", low_price: 8.00, high_price: 12.00 }, as: MarketAdmin }
            - { call: "POST /market/purchase-lots", payload: { shipper_id: "${sh}", commodity_id: "${com}", market_date: "2026-05-01", quantity_units: 100, shipper_unit_price: 10.00, declared_grade: "US1" }, as: Receiver, captures: { lot: "$.data.id" } }
            - { call: "POST /market/purchase-lots/${lot}/receive", payload: {}, as: Receiver }
            - { call: "POST /market/inspections", payload: { purchase_lot_id: "${lot}", inspected_grade: "US2", defect_pct: 25, result: "FAIL" }, as: USDAInspector, captures: { insp1: "$.data.id" } }
            - { call: "POST /market/inspections/${insp1}/certify", payload: {}, as: USDAInspector }
          trigger:
            - { call: "POST /market/purchase-lots/${lot}/dispute", payload: { reason: "grade below contract" }, as: Receiver, captures: { st_disputed: "$.data.status" } }
            - { call: "POST /market/inspections", payload: { purchase_lot_id: "${lot}", inspected_grade: "US1", defect_pct: 5, result: "PASS" }, as: USDAInspector, captures: { insp2: "$.data.id" } }
            - { call: "GET /market/purchase-lots/${lot}", payload: {}, as: Receiver, captures: { st_loop: "$.data.status" } }
            - { call: "POST /market/inspections/${insp2}/certify", payload: {}, as: USDAInspector }
            - { call: "GET /market/purchase-lots/${lot}", payload: {}, as: Receiver, captures: { st_final: "$.data.status", adj: "$.data.adjusted_cost_cents" } }
          assert:
            - "after FAIL certification the lot stayed INSPECTED (dispute is a separate Receiver act)"
            - "dispute moves lot INSPECTED -> DISPUTED (${st_disputed} == DISPUTED)"
            - "re-inspection loops lot DISPUTED -> INSPECTED (${st_loop} == INSPECTED)"
            - "second certify PASS moves lot INSPECTED -> ACCEPTED (${st_final} == ACCEPTED)"
            - "defect_pct 5 <= tolerance 5 so adjusted_cost_cents == 100000 (unchanged from provisional)"

      - name: sales_order_credit_hold_branch_and_release
        grounds:
          - state_machines.SalesOrder.CONFIRMED_to_ON_HOLD
          - state_machines.SalesOrder.ON_HOLD_to_CONFIRMED
          - state_machines.Invoice.PAST_DUE_to_TRUST_CLAIMED
        distinguishing_aspect: |
          Entity = SalesOrder; shape = branching with revert: CONFIRMED ->
          ON_HOLD (CREDIT branch fired by the day-close trust-claim cascade) ->
          CONFIRMED via the confirm release path after the invoice is paid and
          the customer reactivated. Different entity and different mechanism
          from the PurchaseLot dispute cycle.
        test_recipe:
          setup:
            - "Clock 2026-05-01T08:00:00Z; lot 100 @ 10.00 ACCEPTED; customer terms 10, huge credit limit"
            - "Order1 (1 unit @ 50.00, window 08:00-10:00) delivered and invoiced on 2026-05-01: total 7500 (5000 + 2500 deposit), due 2026-05-11"
            - "Order2 (2 units @ 50.00, window 10:00-12:00) CONFIRMED"
            - "Clock 2026-05-12: day-close marks invoice1 PAST_DUE; clock 2026-06-12: day-close marks it TRUST_CLAIMED, suspends the customer, and CREDIT-holds order2"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T08:00:00Z" }, as: MarketAdmin }
            - { call: "POST /market/commodities", payload: { code: "TOM", name: "Tomato", ethylene_class: "PRODUCER", temp_min_f: 45, temp_max_f: 55, max_violation_minutes: 60 }, as: MarketAdmin, captures: { com: "$.data.id" } }
            - { call: "POST /market/shippers", payload: { name: "Shipper One", paca_license: "PACA-001" }, as: MarketAdmin, captures: { sh: "$.data.id" } }
            - { call: "POST /market/daily-prices", payload: { commodity_id: "${com}", market_date: "2026-05-01", low_price: 8.00, high_price: 12.00 }, as: MarketAdmin }
            - { call: "POST /market/purchase-lots", payload: { shipper_id: "${sh}", commodity_id: "${com}", market_date: "2026-05-01", quantity_units: 100, shipper_unit_price: 10.00, declared_grade: "US1" }, as: Receiver, captures: { lot: "$.data.id" } }
            - { call: "POST /market/purchase-lots/${lot}/receive", payload: {}, as: Receiver }
            - { call: "POST /market/inspections", payload: { purchase_lot_id: "${lot}", inspected_grade: "US1", defect_pct: 0, result: "PASS" }, as: USDAInspector, captures: { insp: "$.data.id" } }
            - { call: "POST /market/inspections/${insp}/certify", payload: {}, as: USDAInspector }
            - { call: "POST /market/customers", payload: { name: "Buyer C", credit_limit_cents: 100000000, terms_days: 10 }, as: MarketAdmin, captures: { cust: "$.data.id" } }
            - { call: "POST /market/sales-orders", payload: { customer_id: "${cust}", delivery_date: "2026-05-02", window_start: "08:00", window_end: "10:00", pallet_count: 1, lines: [ { lot_id: "${lot}", quantity: 1, unit_price: 50.00 } ] }, as: SalesDesk, captures: { ord1: "$.data.id" } }
            - { call: "POST /market/sales-orders/${ord1}/confirm", payload: {}, as: SalesDesk }
            - { call: "POST /market/sales-orders/${ord1}/pick", payload: {}, as: Receiver }
            - { call: "POST /market/sales-orders/${ord1}/deliver", payload: {}, as: Receiver }
            - { call: "POST /market/invoices", payload: { sales_order_id: "${ord1}" }, as: BillingClerk, captures: { inv1: "$.data.id" } }
            - { call: "POST /market/sales-orders", payload: { customer_id: "${cust}", delivery_date: "2026-05-02", window_start: "10:00", window_end: "12:00", pallet_count: 1, lines: [ { lot_id: "${lot}", quantity: 2, unit_price: 50.00 } ] }, as: SalesDesk, captures: { ord2: "$.data.id" } }
            - { call: "POST /market/sales-orders/${ord2}/confirm", payload: {}, as: SalesDesk }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-12T09:00:00Z" }, as: MarketAdmin }
            - { call: "POST /market/ops/run-day-close", payload: {}, as: MarketAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-12T09:00:00Z" }, as: MarketAdmin }
            - { call: "POST /market/ops/run-day-close", payload: {}, as: MarketAdmin }
            - { call: "GET /market/sales-orders/${ord2}", payload: {}, as: SalesDesk, captures: { st_hold: "$.data.status", hr: "$.data.hold_reason" } }
            - { call: "POST /market/payments", payload: { invoice_id: "${inv1}", amount_cents: 7500 }, as: BillingClerk }
            - { call: "GET /market/customers/${cust}", payload: {}, as: MarketAdmin, captures: { cv: "$.data.version" } }
            - { call: "PATCH /market/customers/${cust}", payload: { status: "ACTIVE", expected_customer_version: "${cv}" }, as: MarketAdmin }
          trigger:
            - { call: "POST /market/sales-orders/${ord2}/confirm", payload: {}, as: SalesDesk, captures: { st_rel: "$.data.status", hr2: "$.data.hold_reason" } }
            - { call: "GET /market/invoices/${inv1}", payload: {}, as: BillingClerk, captures: { ist: "$.data.status" } }
          assert:
            - "order2 was driven CONFIRMED -> ON_HOLD by the trust-claim cascade (${st_hold} == ON_HOLD, ${hr} == CREDIT)"
            - "confirm on a CREDIT hold with cleared cause reverts ON_HOLD -> CONFIRMED (${st_rel} == CONFIRMED, hold_reason null)"
            - "invoice1 went TRUST_CLAIMED then PAID after the 7500-cent payment (${ist} == PAID)"
            - "lot reserved_units == 2 again after release (reservation re-taken on the revert path)"

  - rule_id: transitive_cascade
    instances:
      - name: cold_chain_violation_three_hop_cascade
        grounds:
          - state_machines.PurchaseLot.(any_non_terminal)_to_(no_transition)
          - calculations.cold_chain_accumulation
          - state_machines.SalesOrder.CONFIRMED_to_ON_HOLD
        distinguishing_aspect: |
          Trigger = POST /market/temperature-readings (cold-chain domain).
          Depth 3, each hop caused by the previous: reading pushes
          violation_minutes to 70 > 60 -> lot flips VIOLATED (hop 1) -> the
          CONFIRMED order holding a line on the lot moves to ON_HOLD with
          hold_reason COLD_CHAIN (hop 2) -> the hold releases the line
          reservation, mutating lot.reserved_units back from 10 to 0 (hop 3).
        test_recipe:
          setup:
            - "Clock 2026-05-01T08:00:00Z; lot 100 @ 10.00 ACCEPTED (band 45-55F, max 60 violation minutes)"
            - "Customer (limit 1000000) order CONFIRMED with line qty 10 @ 10.00 -> lot.reserved_units == 10, available_units == 90"
            - "First probe 70F for 50 minutes: cumulative 50 <= 60, still OK"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T08:00:00Z" }, as: MarketAdmin }
            - { call: "POST /market/commodities", payload: { code: "TOM", name: "Tomato", ethylene_class: "PRODUCER", temp_min_f: 45, temp_max_f: 55, max_violation_minutes: 60 }, as: MarketAdmin, captures: { com: "$.data.id" } }
            - { call: "POST /market/shippers", payload: { name: "Shipper One", paca_license: "PACA-001" }, as: MarketAdmin, captures: { sh: "$.data.id" } }
            - { call: "POST /market/daily-prices", payload: { commodity_id: "${com}", market_date: "2026-05-01", low_price: 8.00, high_price: 12.00 }, as: MarketAdmin }
            - { call: "POST /market/purchase-lots", payload: { shipper_id: "${sh}", commodity_id: "${com}", market_date: "2026-05-01", quantity_units: 100, shipper_unit_price: 10.00, declared_grade: "US1" }, as: Receiver, captures: { lot: "$.data.id" } }
            - { call: "POST /market/purchase-lots/${lot}/receive", payload: {}, as: Receiver }
            - { call: "POST /market/inspections", payload: { purchase_lot_id: "${lot}", inspected_grade: "US1", defect_pct: 0, result: "PASS" }, as: USDAInspector, captures: { insp: "$.data.id" } }
            - { call: "POST /market/inspections/${insp}/certify", payload: {}, as: USDAInspector }
            - { call: "POST /market/customers", payload: { name: "Buyer A", credit_limit_cents: 1000000 }, as: MarketAdmin, captures: { cust: "$.data.id" } }
            - { call: "POST /market/sales-orders", payload: { customer_id: "${cust}", delivery_date: "2026-05-02", window_start: "08:00", window_end: "10:00", lines: [ { lot_id: "${lot}", quantity: 10, unit_price: 10.00 } ] }, as: SalesDesk, captures: { ord: "$.data.id" } }
            - { call: "POST /market/sales-orders/${ord}/confirm", payload: {}, as: SalesDesk }
            - { call: "POST /market/temperature-readings", payload: { purchase_lot_id: "${lot}", recorded_at: "2026-05-01T09:00:00Z", temp_f: 70, duration_minutes: 50 }, as: Receiver }
          trigger:
            - { call: "POST /market/temperature-readings", payload: { purchase_lot_id: "${lot}", recorded_at: "2026-05-01T10:00:00Z", temp_f: 70, duration_minutes: 20 }, as: Receiver, captures: { oor: "$.data.out_of_range" } }
            - { call: "GET /market/purchase-lots/${lot}", payload: {}, as: Receiver, captures: { ccs: "$.data.cold_chain_status", vm: "$.data.violation_minutes", res: "$.data.reserved_units", avl: "$.data.available_units" } }
            - { call: "GET /market/sales-orders/${ord}", payload: {}, as: SalesDesk, captures: { ost: "$.data.status", ohr: "$.data.hold_reason" } }
          assert:
            - "second reading is out_of_range == true (70F > 55F)"
            - "hop 1: lot.cold_chain_status == VIOLATED and violation_minutes == 70 (50 + 20 > 60)"
            - "hop 2: SalesOrder.${ord}.status == ON_HOLD with hold_reason == COLD_CHAIN"
            - "hop 3: lot.reserved_units == 0 and available_units == 100 (reservation released BY the hold, not by the reading directly)"

      - name: shrink_approval_two_hop_credit_cascade
        grounds:
          - state_machines.ShrinkRecord.DRAFT_to_APPROVED
          - state_machines.CreditMemo
          - calculations.lot_payable_reconciliation
        distinguishing_aspect: |
          Trigger = POST /market/shrink-records/{id}/approve (shrink domain,
          different from the temperature-reading trigger). Depth 2: approve ->
          CreditMemo ISSUED created with amount 8500 (hop 1) -> the memo
          issuance itself recomputes lot.payable_cents 85000 -> 76500 (hop 2),
          and the shipper trust exposure follows.
        test_recipe:
          setup:
            - "Clock 2026-05-01T08:00:00Z; lot 100 @ 10.00, inspection PASS defect_pct 20 CERTIFIED -> adjusted_cost_cents 85000, payable 85000"
            - "DRAFT shrink record quantity 10 reason DUMP"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T08:00:00Z" }, as: MarketAdmin }
            - { call: "POST /market/commodities", payload: { code: "TOM", name: "Tomato", ethylene_class: "PRODUCER", temp_min_f: 45, temp_max_f: 55, max_violation_minutes: 60 }, as: MarketAdmin, captures: { com: "$.data.id" } }
            - { call: "POST /market/shippers", payload: { name: "Shipper One", paca_license: "PACA-001" }, as: MarketAdmin, captures: { sh: "$.data.id" } }
            - { call: "POST /market/daily-prices", payload: { commodity_id: "${com}", market_date: "2026-05-01", low_price: 8.00, high_price: 12.00 }, as: MarketAdmin }
            - { call: "POST /market/purchase-lots", payload: { shipper_id: "${sh}", commodity_id: "${com}", market_date: "2026-05-01", quantity_units: 100, shipper_unit_price: 10.00, declared_grade: "US1" }, as: Receiver, captures: { lot: "$.data.id" } }
            - { call: "POST /market/purchase-lots/${lot}/receive", payload: {}, as: Receiver }
            - { call: "POST /market/inspections", payload: { purchase_lot_id: "${lot}", inspected_grade: "US1", defect_pct: 20, result: "PASS" }, as: USDAInspector, captures: { insp: "$.data.id" } }
            - { call: "POST /market/inspections/${insp}/certify", payload: {}, as: USDAInspector }
            - { call: "POST /market/shrink-records", payload: { purchase_lot_id: "${lot}", quantity: 10, reason: "DUMP" }, as: Receiver, captures: { shr: "$.data.id" } }
          trigger:
            - { call: "POST /market/shrink-records/${shr}/approve", payload: {}, as: MarketAdmin, captures: { memo_id: "$.data.credit_memo_id" } }
            - { call: "GET /market/purchase-lots/${lot}", payload: {}, as: Receiver, captures: { pay: "$.data.payable_cents", dump: "$.data.dumped_units", avl: "$.data.available_units" } }
            - { call: "GET /market/shippers/${sh}", payload: {}, as: MarketAdmin, captures: { expo: "$.data.trust_exposure_cents" } }
          assert:
            - "hop 1: CreditMemo created ISSUED with amount_cents == 8500 (round_half_up(85000 * 10 / 100)) and shrink.credit_memo_id points to it"
            - "hop 2: lot.payable_cents == 76500 (85000 - 8500) recomputed BECAUSE the memo was issued"
            - "lot.dumped_units == 10 and available_units == 90"
            - "shipper.trust_exposure_cents == 76500 (derived field follows the cascade)"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: confirm_cancelled_order_state_beats_credit_limit
        grounds:
          - validations[priority=5]
          - validations[priority=10]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_CREDIT_LIMIT_EXCEEDED]
        distinguishing_aspect: |
          Error-category pair: state (priority 5) vs business_fiscal (priority
          10). The order is CANCELLED (state failure) AND the customer's
          1000-cent credit limit cannot cover the 10000-cent subtotal (fiscal
          failure); the response MUST be ERR_INVALID_STATE because state
          outranks fiscal.
        test_recipe:
          setup:
            - "Clock 2026-05-01T08:00:00Z; lot 100 @ 10.00 ACCEPTED; customer credit_limit_cents 1000"
            - "Order PENDING with line 1 @ 100.00 (subtotal 10000 > limit 1000), then cancelled by SalesDesk"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T08:00:00Z" }, as: MarketAdmin }
            - { call: "POST /market/commodities", payload: { code: "TOM", name: "Tomato", ethylene_class: "PRODUCER", temp_min_f: 45, temp_max_f: 55, max_violation_minutes: 60 }, as: MarketAdmin, captures: { com: "$.data.id" } }
            - { call: "POST /market/shippers", payload: { name: "Shipper One", paca_license: "PACA-001" }, as: MarketAdmin, captures: { sh: "$.data.id" } }
            - { call: "POST /market/daily-prices", payload: { commodity_id: "${com}", market_date: "2026-05-01", low_price: 8.00, high_price: 12.00 }, as: MarketAdmin }
            - { call: "POST /market/purchase-lots", payload: { shipper_id: "${sh}", commodity_id: "${com}", market_date: "2026-05-01", quantity_units: 100, shipper_unit_price: 10.00, declared_grade: "US1" }, as: Receiver, captures: { lot: "$.data.id" } }
            - { call: "POST /market/purchase-lots/${lot}/receive", payload: {}, as: Receiver }
            - { call: "POST /market/inspections", payload: { purchase_lot_id: "${lot}", inspected_grade: "US1", defect_pct: 0, result: "PASS" }, as: USDAInspector, captures: { insp: "$.data.id" } }
            - { call: "POST /market/inspections/${insp}/certify", payload: {}, as: USDAInspector }
            - { call: "POST /market/customers", payload: { name: "Buyer D", credit_limit_cents: 1000 }, as: MarketAdmin, captures: { cust: "$.data.id" } }
            - { call: "POST /market/sales-orders", payload: { customer_id: "${cust}", delivery_date: "2026-05-02", window_start: "08:00", window_end: "10:00", lines: [ { lot_id: "${lot}", quantity: 1, unit_price: 100.00 } ] }, as: SalesDesk, captures: { ord: "$.data.id" } }
            - { call: "POST /market/sales-orders/${ord}/cancel", payload: {}, as: SalesDesk }
          trigger:
            - { call: "POST /market/sales-orders/${ord}/confirm", payload: {}, as: SalesDesk, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_INVALID_STATE (409), not ERR_CREDIT_LIMIT_EXCEEDED"
            - "both failures hold simultaneously; priority 5 (state) beats priority 10 (business_fiscal)"

      - name: ethylene_conflict_beats_room_overlap
        grounds:
          - validations[priority=7]
          - validations[priority=8]
          - errors[ERR_ETHYLENE_CONFLICT]
          - errors[ERR_ROOM_OVERLAP]
        distinguishing_aspect: |
          Error-category pair: business_safety (priority 7) vs
          business_temporal (priority 8) — a different pair from state vs
          fiscal. The new booking both (a) pairs a SENSITIVE-commodity lot
          against an overlapping ethylene-enabled booking and (b) intersects
          that booking's 2h-buffer-inflated interval; the response MUST be
          ERR_ETHYLENE_CONFLICT.
        test_recipe:
          setup:
            - "Clock 2026-05-01T08:00:00Z; commodities TOM (PRODUCER) and LET (SENSITIVE); lots L1 (TOM) and L2 (LET) both ACCEPTED"
            - "Room R1 capacity 50, ethylene_capable; booking B1: L1, 5 pallets, 10:00-14:00, ethylene_enabled true"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T08:00:00Z" }, as: MarketAdmin }
            - { call: "POST /market/commodities", payload: { code: "TOM", name: "Tomato", ethylene_class: "PRODUCER", temp_min_f: 45, temp_max_f: 55, max_violation_minutes: 60 }, as: MarketAdmin, captures: { com1: "$.data.id" } }
            - { call: "POST /market/commodities", payload: { code: "LET", name: "Lettuce", ethylene_class: "SENSITIVE", temp_min_f: 32, temp_max_f: 36, max_violation_minutes: 60 }, as: MarketAdmin, captures: { com2: "$.data.id" } }
            - { call: "POST /market/shippers", payload: { name: "Shipper One", paca_license: "PACA-001" }, as: MarketAdmin, captures: { sh: "$.data.id" } }
            - { call: "POST /market/daily-prices", payload: { commodity_id: "${com1}", market_date: "2026-05-01", low_price: 8.00, high_price: 12.00 }, as: MarketAdmin }
            - { call: "POST /market/daily-prices", payload: { commodity_id: "${com2}", market_date: "2026-05-01", low_price: 1.00, high_price: 3.00 }, as: MarketAdmin }
            - { call: "POST /market/purchase-lots", payload: { shipper_id: "${sh}", commodity_id: "${com1}", market_date: "2026-05-01", quantity_units: 50, shipper_unit_price: 10.00, declared_grade: "US1" }, as: Receiver, captures: { lot1: "$.data.id" } }
            - { call: "POST /market/purchase-lots", payload: { shipper_id: "${sh}", commodity_id: "${com2}", market_date: "2026-05-01", quantity_units: 50, shipper_unit_price: 2.00, declared_grade: "US1" }, as: Receiver, captures: { lot2: "$.data.id" } }
            - { call: "POST /market/purchase-lots/${lot1}/receive", payload: {}, as: Receiver }
            - { call: "POST /market/purchase-lots/${lot2}/receive", payload: {}, as: Receiver }
            - { call: "POST /market/inspections", payload: { purchase_lot_id: "${lot1}", inspected_grade: "US1", defect_pct: 0, result: "PASS" }, as: USDAInspector, captures: { i1: "$.data.id" } }
            - { call: "POST /market/inspections/${i1}/certify", payload: {}, as: USDAInspector }
            - { call: "POST /market/inspections", payload: { purchase_lot_id: "${lot2}", inspected_grade: "US1", defect_pct: 0, result: "PASS" }, as: USDAInspector, captures: { i2: "$.data.id" } }
            - { call: "POST /market/inspections/${i2}/certify", payload: {}, as: USDAInspector }
            - { call: "POST /market/ripening-rooms", payload: { name: "R1", capacity_pallets: 50, ethylene_capable: true }, as: MarketAdmin, captures: { room: "$.data.id" } }
            - { call: "POST /market/ripening-bookings", payload: { room_id: "${room}", purchase_lot_id: "${lot1}", pallet_count: 5, start_time: "2026-05-01T10:00:00Z", end_time: "2026-05-01T14:00:00Z", ethylene_enabled: true, target_stage: "STAGE_4" }, as: Receiver }
          trigger:
            - { call: "POST /market/ripening-bookings", payload: { room_id: "${room}", purchase_lot_id: "${lot2}", pallet_count: 5, start_time: "2026-05-01T12:00:00Z", end_time: "2026-05-01T16:00:00Z", ethylene_enabled: false, target_stage: "STAGE_2" }, as: Receiver, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_ETHYLENE_CONFLICT (409), not ERR_ROOM_OVERLAP"
            - "both failures hold (uninflated overlap 12:00-14:00 pairs SENSITIVE L2 with ethylene-enabled B1; buffer-inflated overlap also holds); priority 7 (safety) beats priority 8 (temporal)"

  - rule_id: boundary_precision_check
    instances:
      - name: order_cutoff_exactly_at_1400_accepted
        grounds:
          - validations[priority=8]
          - errors[ERR_CUTOFF_PASSED]
        distinguishing_aspect: |
          Metric = time-of-day against the 14:00:00 order cut-off, reached via
          POST /market/sales-orders. The comparison is inclusive: a submission
          stamped exactly 2026-05-01T14:00:00Z for next-day delivery is
          ACCEPTED; only strictly-later times are rejected.
        test_recipe:
          setup:
            - "Logical clock pinned to exactly 2026-05-01T14:00:00Z; lot ACCEPTED; customer ACTIVE with ample credit"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T08:00:00Z" }, as: MarketAdmin }
            - { call: "POST /market/commodities", payload: { code: "TOM", name: "Tomato", ethylene_class: "PRODUCER", temp_min_f: 45, temp_max_f: 55, max_violation_minutes: 60 }, as: MarketAdmin, captures: { com: "$.data.id" } }
            - { call: "POST /market/shippers", payload: { name: "Shipper One", paca_license: "PACA-001" }, as: MarketAdmin, captures: { sh: "$.data.id" } }
            - { call: "POST /market/daily-prices", payload: { commodity_id: "${com}", market_date: "2026-05-01", low_price: 8.00, high_price: 12.00 }, as: MarketAdmin }
            - { call: "POST /market/purchase-lots", payload: { shipper_id: "${sh}", commodity_id: "${com}", market_date: "2026-05-01", quantity_units: 100, shipper_unit_price: 10.00, declared_grade: "US1" }, as: Receiver, captures: { lot: "$.data.id" } }
            - { call: "POST /market/purchase-lots/${lot}/receive", payload: {}, as: Receiver }
            - { call: "POST /market/inspections", payload: { purchase_lot_id: "${lot}", inspected_grade: "US1", defect_pct: 0, result: "PASS" }, as: USDAInspector, captures: { insp: "$.data.id" } }
            - { call: "POST /market/inspections/${insp}/certify", payload: {}, as: USDAInspector }
            - { call: "POST /market/customers", payload: { name: "Buyer A", credit_limit_cents: 1000000 }, as: MarketAdmin, captures: { cust: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T14:00:00Z" }, as: MarketAdmin }
          trigger:
            - { call: "POST /market/sales-orders", payload: { customer_id: "${cust}", delivery_date: "2026-05-02", window_start: "08:00", window_end: "10:00", lines: [ { lot_id: "${lot}", quantity: 1, unit_price: 10.00 } ] }, as: SalesDesk, captures: { st: "$.data.status" } }
          assert:
            - "HTTP 201: submission at exactly 14:00:00 is inside the cut-off (inclusive <=)"
            - "SalesOrder created with status == PENDING"

      - name: invoice_past_due_strictly_after_due_date
        grounds:
          - state_machines.Invoice.OPEN_to_PAST_DUE
          - calculations.invoice_settlement
        distinguishing_aspect: |
          Metric = calendar date against due_date, reached via
          POST /market/ops/run-day-close (different metric and endpoint from
          the 14:00 time-of-day cut-off). On the due date itself the invoice
          stays OPEN (strict >); one day later the same run marks it PAST_DUE.
        test_recipe:
          setup:
            - "Order delivered and invoiced on 2026-05-01 with terms_days 10 -> due_date 2026-05-11, total 7500 unpaid"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T08:00:00Z" }, as: MarketAdmin }
            - { call: "POST /market/commodities", payload: { code: "TOM", name: "Tomato", ethylene_class: "PRODUCER", temp_min_f: 45, temp_max_f: 55, max_violation_minutes: 60 }, as: MarketAdmin, captures: { com: "$.data.id" } }
            - { call: "POST /market/shippers", payload: { name: "Shipper One", paca_license: "PACA-001" }, as: MarketAdmin, captures: { sh: "$.data.id" } }
            - { call: "POST /market/daily-prices", payload: { commodity_id: "${com}", market_date: "2026-05-01", low_price: 8.00, high_price: 12.00 }, as: MarketAdmin }
            - { call: "POST /market/purchase-lots", payload: { shipper_id: "${sh}", commodity_id: "${com}", market_date: "2026-05-01", quantity_units: 100, shipper_unit_price: 10.00, declared_grade: "US1" }, as: Receiver, captures: { lot: "$.data.id" } }
            - { call: "POST /market/purchase-lots/${lot}/receive", payload: {}, as: Receiver }
            - { call: "POST /market/inspections", payload: { purchase_lot_id: "${lot}", inspected_grade: "US1", defect_pct: 0, result: "PASS" }, as: USDAInspector, captures: { insp: "$.data.id" } }
            - { call: "POST /market/inspections/${insp}/certify", payload: {}, as: USDAInspector }
            - { call: "POST /market/customers", payload: { name: "Buyer E", credit_limit_cents: 1000000, terms_days: 10 }, as: MarketAdmin, captures: { cust: "$.data.id" } }
            - { call: "POST /market/sales-orders", payload: { customer_id: "${cust}", delivery_date: "2026-05-02", window_start: "08:00", window_end: "10:00", pallet_count: 1, lines: [ { lot_id: "${lot}", quantity: 1, unit_price: 50.00 } ] }, as: SalesDesk, captures: { ord: "$.data.id" } }
            - { call: "POST /market/sales-orders/${ord}/confirm", payload: {}, as: SalesDesk }
            - { call: "POST /market/sales-orders/${ord}/pick", payload: {}, as: Receiver }
            - { call: "POST /market/sales-orders/${ord}/deliver", payload: {}, as: Receiver }
            - { call: "POST /market/invoices", payload: { sales_order_id: "${ord}" }, as: BillingClerk, captures: { inv: "$.data.id", due: "$.data.due_date" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-11T09:00:00Z" }, as: MarketAdmin }
            - { call: "POST /market/ops/run-day-close", payload: {}, as: MarketAdmin, captures: { n1: "$.data.invoices_marked_past_due" } }
          trigger:
            - { call: "GET /market/invoices/${inv}", payload: {}, as: BillingClerk, captures: { st_on_due: "$.data.status" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-12T09:00:00Z" }, as: MarketAdmin }
            - { call: "POST /market/ops/run-day-close", payload: {}, as: MarketAdmin, captures: { n2: "$.data.invoices_marked_past_due" } }
            - { call: "GET /market/invoices/${inv}", payload: {}, as: BillingClerk, captures: { st_after: "$.data.status" } }
          assert:
            - "due_date == 2026-05-11"
            - "day-close ON the due date (2026-05-11): invoices_marked_past_due == 0 and invoice stays OPEN"
            - "day-close the next day (2026-05-12): invoices_marked_past_due == 1 and invoice == PAST_DUE"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: confirm_requires_customer_active
        grounds:
          - state_machines.SalesOrder.PENDING_to_CONFIRMED
          - validations[priority=6]
          - errors[ERR_CUSTOMER_INACTIVE]
        distinguishing_aspect: |
          Entity pair SalesOrder -> Customer: the order's confirm transition is
          gated on the OWNING CUSTOMER's status field. Suspending the customer
          after the order was created makes confirm fail with
          ERR_CUSTOMER_INACTIVE even though the order itself is a valid PENDING.
        test_recipe:
          setup:
            - "Clock 2026-05-01T08:00:00Z; lot ACCEPTED; customer created ACTIVE, then PATCH-suspended by MarketAdmin (OCC)"
            - "Order PENDING created while the customer was still ACTIVE"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T08:00:00Z" }, as: MarketAdmin }
            - { call: "POST /market/commodities", payload: { code: "TOM", name: "Tomato", ethylene_class: "PRODUCER", temp_min_f: 45, temp_max_f: 55, max_violation_minutes: 60 }, as: MarketAdmin, captures: { com: "$.data.id" } }
            - { call: "POST /market/shippers", payload: { name: "Shipper One", paca_license: "PACA-001" }, as: MarketAdmin, captures: { sh: "$.data.id" } }
            - { call: "POST /market/daily-prices", payload: { commodity_id: "${com}", market_date: "2026-05-01", low_price: 8.00, high_price: 12.00 }, as: MarketAdmin }
            - { call: "POST /market/purchase-lots", payload: { shipper_id: "${sh}", commodity_id: "${com}", market_date: "2026-05-01", quantity_units: 100, shipper_unit_price: 10.00, declared_grade: "US1" }, as: Receiver, captures: { lot: "$.data.id" } }
            - { call: "POST /market/purchase-lots/${lot}/receive", payload: {}, as: Receiver }
            - { call: "POST /market/inspections", payload: { purchase_lot_id: "${lot}", inspected_grade: "US1", defect_pct: 0, result: "PASS" }, as: USDAInspector, captures: { insp: "$.data.id" } }
            - { call: "POST /market/inspections/${insp}/certify", payload: {}, as: USDAInspector }
            - { call: "POST /market/customers", payload: { name: "Buyer F", credit_limit_cents: 1000000 }, as: MarketAdmin, captures: { cust: "$.data.id", cv0: "$.data.version" } }
            - { call: "POST /market/sales-orders", payload: { customer_id: "${cust}", delivery_date: "2026-05-02", window_start: "08:00", window_end: "10:00", lines: [ { lot_id: "${lot}", quantity: 1, unit_price: 10.00 } ] }, as: SalesDesk, captures: { ord: "$.data.id" } }
            - { call: "PATCH /market/customers/${cust}", payload: { status: "SUSPENDED", expected_customer_version: "${cv0}" }, as: MarketAdmin }
          trigger:
            - { call: "POST /market/sales-orders/${ord}/confirm", payload: {}, as: SalesDesk, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_CUSTOMER_INACTIVE (409)"
            - "SalesOrder.${ord} remains PENDING (no transition, no reservation written)"

      - name: ripening_start_requires_lot_accepted
        grounds:
          - state_machines.RipeningBooking.SCHEDULED_to_IN_PROCESS
          - validations[priority=6]
          - errors[ERR_LOT_NOT_ACCEPTED]
        distinguishing_aspect: |
          Entity pair RipeningBooking -> PurchaseLot (different pair from
          SalesOrder -> Customer): the booking's start transition is gated on
          the LOT's status. The booking is legal SCHEDULED and the clock sits
          inside its window, yet start fails with ERR_LOT_NOT_ACCEPTED because
          the lot is merely INSPECTED, not ACCEPTED.
        test_recipe:
          setup:
            - "Clock 2026-05-01T10:30:00Z; lot RECEIVED with a SUBMITTED inspection (lot INSPECTED, never certified)"
            - "Room R1; booking B on the lot for 10:00-12:00 today (SCHEDULED)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T08:00:00Z" }, as: MarketAdmin }
            - { call: "POST /market/commodities", payload: { code: "BAN", name: "Banana", ethylene_class: "PRODUCER", temp_min_f: 56, temp_max_f: 62, max_violation_minutes: 60 }, as: MarketAdmin, captures: { com: "$.data.id" } }
            - { call: "POST /market/shippers", payload: { name: "Shipper One", paca_license: "PACA-001" }, as: MarketAdmin, captures: { sh: "$.data.id" } }
            - { call: "POST /market/daily-prices", payload: { commodity_id: "${com}", market_date: "2026-05-01", low_price: 5.00, high_price: 9.00 }, as: MarketAdmin }
            - { call: "POST /market/purchase-lots", payload: { shipper_id: "${sh}", commodity_id: "${com}", market_date: "2026-05-01", quantity_units: 50, shipper_unit_price: 7.00, declared_grade: "US1" }, as: Receiver, captures: { lot: "$.data.id" } }
            - { call: "POST /market/purchase-lots/${lot}/receive", payload: {}, as: Receiver }
            - { call: "POST /market/inspections", payload: { purchase_lot_id: "${lot}", inspected_grade: "US1", defect_pct: 0, result: "PASS" }, as: USDAInspector }
            - { call: "POST /market/ripening-rooms", payload: { name: "R1", capacity_pallets: 50, ethylene_capable: true }, as: MarketAdmin, captures: { room: "$.data.id" } }
            - { call: "POST /market/ripening-bookings", payload: { room_id: "${room}", purchase_lot_id: "${lot}", pallet_count: 4, start_time: "2026-05-01T10:00:00Z", end_time: "2026-05-01T12:00:00Z", ethylene_enabled: true, target_stage: "STAGE_5" }, as: Receiver, captures: { bk: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T10:30:00Z" }, as: MarketAdmin }
          trigger:
            - { call: "POST /market/ripening-bookings/${bk}/start", payload: {}, as: Receiver, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_LOT_NOT_ACCEPTED (409)"
            - "RipeningBooking.${bk} remains SCHEDULED"
            - "the clock WAS inside [10:00, 12:00) — the lot-state gate, not the window, produced the rejection"

  - rule_id: resource_temporal_overlap
    instances:
      - name: ripening_room_buffer_inflated_overlap
        grounds:
          - validations[priority=8]
          - errors[ERR_ROOM_OVERLAP]
          - entities.RipeningBooking.fields.start_time
        distinguishing_aspect: |
          Resource = RipeningRoom; interval semantics = BUFFER-INFLATED
          half-open: a booking occupies [start, end) inflated by a 2-hour
          clean-down on both sides for conflict purposes. A new booking
          starting 15:30 conflicts with one ending 14:00 (15:30 < 16:00
          inflated end); a new booking starting exactly 16:00 touches the
          inflated boundary and is ALLOWED (strict inequality).
        test_recipe:
          setup:
            - "Room R1 capacity 50; lot ACCEPTED; existing booking B1 10:00-14:00 (5 pallets, no ethylene)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T08:00:00Z" }, as: MarketAdmin }
            - { call: "POST /market/commodities", payload: { code: "BAN", name: "Banana", ethylene_class: "PRODUCER", temp_min_f: 56, temp_max_f: 62, max_violation_minutes: 60 }, as: MarketAdmin, captures: { com: "$.data.id" } }
            - { call: "POST /market/shippers", payload: { name: "Shipper One", paca_license: "PACA-001" }, as: MarketAdmin, captures: { sh: "$.data.id" } }
            - { call: "POST /market/daily-prices", payload: { commodity_id: "${com}", market_date: "2026-05-01", low_price: 5.00, high_price: 9.00 }, as: MarketAdmin }
            - { call: "POST /market/purchase-lots", payload: { shipper_id: "${sh}", commodity_id: "${com}", market_date: "2026-05-01", quantity_units: 50, shipper_unit_price: 7.00, declared_grade: "US1" }, as: Receiver, captures: { lot: "$.data.id" } }
            - { call: "POST /market/purchase-lots/${lot}/receive", payload: {}, as: Receiver }
            - { call: "POST /market/inspections", payload: { purchase_lot_id: "${lot}", inspected_grade: "US1", defect_pct: 0, result: "PASS" }, as: USDAInspector, captures: { insp: "$.data.id" } }
            - { call: "POST /market/inspections/${insp}/certify", payload: {}, as: USDAInspector }
            - { call: "POST /market/ripening-rooms", payload: { name: "R1", capacity_pallets: 50, ethylene_capable: true }, as: MarketAdmin, captures: { room: "$.data.id" } }
            - { call: "POST /market/ripening-bookings", payload: { room_id: "${room}", purchase_lot_id: "${lot}", pallet_count: 5, start_time: "2026-05-01T10:00:00Z", end_time: "2026-05-01T14:00:00Z", ethylene_enabled: false, target_stage: "STAGE_4" }, as: Receiver }
          trigger:
            - { call: "POST /market/ripening-bookings", payload: { room_id: "${room}", purchase_lot_id: "${lot}", pallet_count: 5, start_time: "2026-05-01T15:30:00Z", end_time: "2026-05-01T18:00:00Z", ethylene_enabled: false, target_stage: "STAGE_4" }, as: Receiver, captures: { err: "$.data.error_id" } }
            - { call: "POST /market/ripening-bookings", payload: { room_id: "${room}", purchase_lot_id: "${lot}", pallet_count: 5, start_time: "2026-05-01T16:00:00Z", end_time: "2026-05-01T18:00:00Z", ethylene_enabled: false, target_stage: "STAGE_4" }, as: Receiver, captures: { st2: "$.data.status" } }
          assert:
            - "15:30 start -> ERR_ROOM_OVERLAP (409): 15:30 < 14:00 + 2h buffer"
            - "16:00 start -> HTTP 201, status SCHEDULED: touching the inflated boundary 16:00 == 16:00 is NOT an intersection (strict inequality)"

      - name: delivery_window_strict_half_open_adjacency
        grounds:
          - validations[priority=8]
          - errors[ERR_WINDOW_OVERLAP]
          - entities.SalesOrder.fields.window_start
        distinguishing_aspect: |
          Resource = Customer delivery calendar (different resource from
          RipeningRoom); interval semantics = STRICT half-open with NO buffer:
          [08:00,10:00) then [10:00,12:00) on the same delivery_date is legal
          adjacency, while [09:00,11:00) intersects and is rejected. Adjacency
          legal vs buffer-inflated rejection distinguishes this from the room
          rule.
        test_recipe:
          setup:
            - "Clock 2026-05-01T08:00:00Z; lot ACCEPTED; customer with ample credit; order O1 delivery 2026-05-02 window 08:00-10:00 (PENDING)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T08:00:00Z" }, as: MarketAdmin }
            - { call: "POST /market/commodities", payload: { code: "TOM", name: "Tomato", ethylene_class: "PRODUCER", temp_min_f: 45, temp_max_f: 55, max_violation_minutes: 60 }, as: MarketAdmin, captures: { com: "$.data.id" } }
            - { call: "POST /market/shippers", payload: { name: "Shipper One", paca_license: "PACA-001" }, as: MarketAdmin, captures: { sh: "$.data.id" } }
            - { call: "POST /market/daily-prices", payload: { commodity_id: "${com}", market_date: "2026-05-01", low_price: 8.00, high_price: 12.00 }, as: MarketAdmin }
            - { call: "POST /market/purchase-lots", payload: { shipper_id: "${sh}", commodity_id: "${com}", market_date: "2026-05-01", quantity_units: 100, shipper_unit_price: 10.00, declared_grade: "US1" }, as: Receiver, captures: { lot: "$.data.id" } }
            - { call: "POST /market/purchase-lots/${lot}/receive", payload: {}, as: Receiver }
            - { call: "POST /market/inspections", payload: { purchase_lot_id: "${lot}", inspected_grade: "US1", defect_pct: 0, result: "PASS" }, as: USDAInspector, captures: { insp: "$.data.id" } }
            - { call: "POST /market/inspections/${insp}/certify", payload: {}, as: USDAInspector }
            - { call: "POST /market/customers", payload: { name: "Buyer G", credit_limit_cents: 1000000 }, as: MarketAdmin, captures: { cust: "$.data.id" } }
            - { call: "POST /market/sales-orders", payload: { customer_id: "${cust}", delivery_date: "2026-05-02", window_start: "08:00", window_end: "10:00", lines: [ { lot_id: "${lot}", quantity: 1, unit_price: 10.00 } ] }, as: SalesDesk }
          trigger:
            - { call: "POST /market/sales-orders", payload: { customer_id: "${cust}", delivery_date: "2026-05-02", window_start: "10:00", window_end: "12:00", lines: [ { lot_id: "${lot}", quantity: 1, unit_price: 10.00 } ] }, as: SalesDesk, captures: { st_adj: "$.data.status" } }
            - { call: "POST /market/sales-orders", payload: { customer_id: "${cust}", delivery_date: "2026-05-02", window_start: "09:00", window_end: "11:00", lines: [ { lot_id: "${lot}", quantity: 1, unit_price: 10.00 } ] }, as: SalesDesk, captures: { err: "$.data.error_id" } }
          assert:
            - "adjacent window 10:00-12:00 -> HTTP 201 PENDING (10:00 == prior end is NOT an intersection)"
            - "overlapping window 09:00-11:00 -> ERR_WINDOW_OVERLAP (409)"

  - rule_id: compensating_invariant
    instances:
      - name: shrink_void_conserves_shipper_consideration
        grounds:
          - calculations.lot_payable_reconciliation
          - state_machines.CreditMemo.ISSUED_to_VOID
        distinguishing_aspect: |
          Conserved quantity = MONEY owed to the shipper:
          payable_cents + sum(ISSUED memo amounts) == adjusted_cost_cents.
          Approve a 10-unit shrink (memo 8500, payable 76500, sum == 85000),
          then void the memo: payable returns to exactly 85000 with zero drift.
        test_recipe:
          setup:
            - "Lot 100 @ 10.00 with defect_pct 20 CERTIFIED -> adjusted_cost_cents 85000, payable 85000"
            - "Shrink (10, DUMP) APPROVED -> memo M (8500, ISSUED), payable 76500"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T08:00:00Z" }, as: MarketAdmin }
            - { call: "POST /market/commodities", payload: { code: "TOM", name: "Tomato", ethylene_class: "PRODUCER", temp_min_f: 45, temp_max_f: 55, max_violation_minutes: 60 }, as: MarketAdmin, captures: { com: "$.data.id" } }
            - { call: "POST /market/shippers", payload: { name: "Shipper One", paca_license: "PACA-001" }, as: MarketAdmin, captures: { sh: "$.data.id" } }
            - { call: "POST /market/daily-prices", payload: { commodity_id: "${com}", market_date: "2026-05-01", low_price: 8.00, high_price: 12.00 }, as: MarketAdmin }
            - { call: "POST /market/purchase-lots", payload: { shipper_id: "${sh}", commodity_id: "${com}", market_date: "2026-05-01", quantity_units: 100, shipper_unit_price: 10.00, declared_grade: "US1" }, as: Receiver, captures: { lot: "$.data.id" } }
            - { call: "POST /market/purchase-lots/${lot}/receive", payload: {}, as: Receiver }
            - { call: "POST /market/inspections", payload: { purchase_lot_id: "${lot}", inspected_grade: "US1", defect_pct: 20, result: "PASS" }, as: USDAInspector, captures: { insp: "$.data.id" } }
            - { call: "POST /market/inspections/${insp}/certify", payload: {}, as: USDAInspector }
            - { call: "POST /market/shrink-records", payload: { purchase_lot_id: "${lot}", quantity: 10, reason: "DUMP" }, as: Receiver, captures: { shr: "$.data.id" } }
            - { call: "POST /market/shrink-records/${shr}/approve", payload: {}, as: MarketAdmin }
            - { call: "GET /market/purchase-lots/${lot}/credit-memos", payload: {}, as: BillingClerk, captures: { memo: "$.data[0].id", m_amt: "$.data[0].amount_cents" } }
          trigger:
            - { call: "POST /market/credit-memos/${memo}/void", payload: {}, as: BillingClerk, captures: { m_st: "$.data.status" } }
            - { call: "GET /market/purchase-lots/${lot}", payload: {}, as: Receiver, captures: { pay: "$.data.payable_cents", adj: "$.data.adjusted_cost_cents" } }
          assert:
            - "before void: payable 76500 + ISSUED memo 8500 == adjusted_cost 85000 (invariant held mid-flight)"
            - "after void: CreditMemo.${memo}.status == VOID and lot.payable_cents == 85000 exactly — no drift"
            - "lot.adjusted_cost_cents == 85000 throughout (memo lifecycle never mutates cost)"

      - name: booking_cancel_conserves_room_capacity
        grounds:
          - state_machines.RipeningBooking.SCHEDULED_to_CANCELLED
          - entities.RipeningRoom.fields.capacity_pallets
        distinguishing_aspect: |
          Conserved quantity = SPACE (room pallet capacity), a different
          quantity from money: capacity_pallets - sum(pallet_count of active
          bookings covering t) returns to its pre-booking profile after a
          create-then-cancel round trip, proved by re-booking the identical
          interval successfully.
        test_recipe:
          setup:
            - "Room R1 capacity 50; lot ACCEPTED; no bookings"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T08:00:00Z" }, as: MarketAdmin }
            - { call: "POST /market/commodities", payload: { code: "BAN", name: "Banana", ethylene_class: "PRODUCER", temp_min_f: 56, temp_max_f: 62, max_violation_minutes: 60 }, as: MarketAdmin, captures: { com: "$.data.id" } }
            - { call: "POST /market/shippers", payload: { name: "Shipper One", paca_license: "PACA-001" }, as: MarketAdmin, captures: { sh: "$.data.id" } }
            - { call: "POST /market/daily-prices", payload: { commodity_id: "${com}", market_date: "2026-05-01", low_price: 5.00, high_price: 9.00 }, as: MarketAdmin }
            - { call: "POST /market/purchase-lots", payload: { shipper_id: "${sh}", commodity_id: "${com}", market_date: "2026-05-01", quantity_units: 50, shipper_unit_price: 7.00, declared_grade: "US1" }, as: Receiver, captures: { lot: "$.data.id" } }
            - { call: "POST /market/purchase-lots/${lot}/receive", payload: {}, as: Receiver }
            - { call: "POST /market/inspections", payload: { purchase_lot_id: "${lot}", inspected_grade: "US1", defect_pct: 0, result: "PASS" }, as: USDAInspector, captures: { insp: "$.data.id" } }
            - { call: "POST /market/inspections/${insp}/certify", payload: {}, as: USDAInspector }
            - { call: "POST /market/ripening-rooms", payload: { name: "R1", capacity_pallets: 50, ethylene_capable: true }, as: MarketAdmin, captures: { room: "$.data.id" } }
            - { call: "POST /market/ripening-bookings", payload: { room_id: "${room}", purchase_lot_id: "${lot}", pallet_count: 10, start_time: "2026-05-02T10:00:00Z", end_time: "2026-05-02T12:00:00Z", ethylene_enabled: false, target_stage: "STAGE_4" }, as: Receiver, captures: { b1: "$.data.id", b1_st: "$.data.status" } }
          trigger:
            - { call: "POST /market/ripening-bookings/${b1}/cancel", payload: {}, as: Receiver, captures: { b1_end: "$.data.status" } }
            - { call: "POST /market/ripening-bookings", payload: { room_id: "${room}", purchase_lot_id: "${lot}", pallet_count: 10, start_time: "2026-05-02T10:00:00Z", end_time: "2026-05-02T12:00:00Z", ethylene_enabled: false, target_stage: "STAGE_4" }, as: Receiver, captures: { b2: "$.data.id", b2_st: "$.data.status" } }
          assert:
            - "first booking created SCHEDULED (${b1_st}) then cancelled (${b1_end} == CANCELLED)"
            - "identical re-booking succeeds with 201 SCHEDULED — CANCELLED bookings contribute 0 to the active pallet sum"
            - "invariant: 50 - sum(active pallets over [10:00,12:00)) is identical before the first create and after the cancel"
