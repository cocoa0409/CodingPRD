            - "Violation.${w8}.assessed_points == 23 and infant_exposure == true (second disjunct: SU-101 is infant_sensitive and INFANT is in age_groups_observed even though the room is TODDLER)"
            - "Violation.${w9}.severity == \"CRITICAL\" and assessed_points == 15 (severity_override replaces the MINOR default before any other step)"
            - "Provider.${prov}.open_violation_points == 132 and lifetime_violation_points == 132 (23+15+2+4+8+12+30+23+15)"

      - name: combinatorial_mode_b_compliance_score_round_per_line_then_sum
        grounds:
          - calculations.inspection_compliance_score
          - entities.Inspection.fields.raw_deduction_points
          - entities.Inspection.fields.final_compliance_score
