              captures: { pub_id: $.data.id }
            - call: "POST /methodology-versions"
              payload: { standard_family: "SUITABILITY", version_code: "SUIT-2026.1", effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: AccreditationAuditor
              as_user_id: "auditor-1"
              captures: { mv_suit_id: $.data.id }
            - call: "POST /methodology-versions"
              payload: { standard_family: "VIEWABILITY", version_code: "VIEW-2026.1", effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z", display_in_view_seconds: 1.0, display_pixel_pct: 0.5, coverage_rate_floor: 0.7, ivt_rate_ceiling: 0.02 }
              as: AccreditationAuditor
              as_user_id: "auditor-1"
              captures: { mv_view_id: $.data.id }
            - call: "POST /campaigns"
              payload: { advertiser_id: "${adv_id}", name: "Q3 Display", cpm_cents: 875, min_suitability_tier: "MEDIUM_RISK", format: "DISPLAY", target_coverage_rate: 0.75 }
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { camp_id: $.data.id }
            - call: "POST /pages"
              payload: { publisher_id: "${pub_id}", url: "https://beacon.example.com/low" }
              as: Publisher
              as_user_id: "${pub_id}"
              captures: { page_low: $.data.id, page_low_ver: $.data.version }
            - call: "POST /page-classifications"
              payload: { page_id: "${page_low}", methodology_version_id: "${mv_suit_id}", expected_page_version: "${page_low_ver}", classifier_kind: "MODEL", category_codes: ["GENERAL"], model_confidence: 0.95, ad_density_ratio: 0.10, refresh_seconds: 0, originality_score: 90 }
              as: ClassificationAnalyst
              as_user_id: "analyst-1"
            - call: "POST /pages"
              payload: { publisher_id: "${pub_id}", url: "https://beacon.example.com/exact" }
              as: Publisher
              as_user_id: "${pub_id}"
              captures: { page_exact: $.data.id, page_exact_ver: $.data.version }
            - call: "POST /page-classifications"
              payload: { page_id: "${page_exact}", methodology_version_id: "${mv_suit_id}", expected_page_version: "${page_exact_ver}", classifier_kind: "MODEL", category_codes: ["GENERAL"], model_confidence: 0.95, ad_density_ratio: 0.10, refresh_seconds: 0, originality_score: 90 }
              as: ClassificationAnalyst
              as_user_id: "analyst-1"
            - call: "POST /measurement-batches"
              payload: { campaign_id: "${camp_id}", publisher_id: "${pub_id}", page_id: "${page_low}", methodology_version_id: "${mv_view_id}", format: "DISPLAY", window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-01T01:00:00Z", measured_impressions: 10000, measurable_impressions: 8000, in_view_impressions: 6000, avg_in_view_seconds: 0.9, avg_in_view_pixel_pct: 0.6 }
              as: MeasurementOperator
              as_user_id: "op-1"
              captures: { batch_low: $.data.id }
            - call: "POST /measurement-batches"
              payload: { campaign_id: "${camp_id}", publisher_id: "${pub_id}", page_id: "${page_exact}", methodology_version_id: "${mv_view_id}", format: "DISPLAY", window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-01T01:00:00Z", measured_impressions: 10000, measurable_impressions: 8000, in_view_impressions: 6000, avg_in_view_seconds: 1.0, avg_in_view_pixel_pct: 0.6 }
