              as: NaturopathicDoctor
              as_user_id: "${nd_id}"
            - call: "GET /referrals"
              payload: {}
              as: NaturopathicDoctor
              as_user_id: "${nd_id}"
              captures: { ref_id: "$.data[0].id" }
          trigger:
            - call: "POST /lab-orders/${lo_id}/interpret"
              payload: { interpretation_summary: "hyperkalaemia, urgent" }
              as: NaturopathicDoctor
              as_user_id: "${nd_id}"
              captures: { err_id: $.data.error_id }
            - call: "POST /referrals/${ref_id}/transitions"
              payload: { action: "ACKNOWLEDGE" }
              as: NaturopathicDoctor
              as_user_id: "${nd_id}"
            - call: "POST /lab-orders/${lo_id}/interpret"
              payload: { interpretation_summary: "hyperkalaemia, urgent" }
              as: NaturopathicDoctor
              as_user_id: "${nd_id}"
          assert:
            - "The first interpret returned 409 with error_id ERR_RED_FLAG_UNACKNOWLEDGED"
            - "LabOrder.${lo_id}.status was still CRITICAL_ESCALATED after the refusal"
            - "Referral.${ref_id}.status == ACKNOWLEDGED"
            - "Patient.${pt_id}.red_flag_referral_open == false"
            - "Patient.${pt_id}.clinical_write_gate == OPEN"
            - "The second interpret returned 200 and LabOrder.${lo_id}.status == INTERPRETED"

  # ==========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: practitioner_windows_are_half_open_with_a_telehealth_only_buffer
        grounds:
          - validations[priority=21]
          - errors[ERR_PRACTITIONER_DOUBLE_BOOKED]
          - entities.Encounter.fields.scheduled_start
          - entities.Encounter.fields.scheduled_end
        distinguishing_aspect: |
          Interval semantics on the Practitioner resource: occupancy is HALF-OPEN
          [start, end) and a TELEHEALTH_TURNAROUND_BUFFER_MINUTES of 10 is added to the
          existing window only when BOTH encounters are TELEHEALTH. A telehealth booking at
          10:35 collides with a telehealth window ending 10:30, while an in-person booking
          starting exactly at 10:30 does not.
        test_recipe:
          setup:
            - "One ND licensed in OR, one OR patient with telehealth_consent and intake_booking_score 65"
            - "An existing TELEHEALTH encounter from 2026-06-01T10:00:00Z to 2026-06-01T10:30:00Z"
          setup_api_calls:
            - call: "POST /practitioners"
              payload: { full_name: "Dr Nora Vance", credential: "ND", licensed_state_codes: ["OR"], npi: "1234567893" }
              as: PracticeAdmin
              captures: { nd_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Ada Reyes", email: "ada@example.com", state_code: "OR", primary_practitioner_id: "${nd_id}", telehealth_consent: true }
              as: PracticeAdmin
              captures: { pt_id: $.data.id }
            - call: "POST /patients/${pt_id}/intake-sections"
              payload: { section_type: "CHIEF_COMPLAINT_TIMELINE", payload_summary: "fatigue" }
