              payload: { name: "Mercy General", hospital_code: "MERCY", timely_referral_window_minutes: 60 }
              as: OpoAdmin
              captures: { hosp_id: $.data.id }
          trigger:
            - call: "POST /opo/death-referrals"
              payload: { hospital_partner_id: "${hosp_id}", patient_mrn: "MRN-6901", age_years: 40, ventilated: true, gcs_score: 3, cause_of_death_category: "ANOXIA", trigger_event_at: "2026-09-07T09:00:00Z" }
              as: ReferralCoordinator
              captures: { error_future_trigger: $.data.error_id }
            - call: "POST /opo/death-referrals"
