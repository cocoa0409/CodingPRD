      - name: credit_hold_registrar_and_cap_breach_fiscal_vs_referential
        grounds:
          - validations[priority=8]
          - validations[priority=10]
          - errors.ERR_REGISTRAR_NOT_ACTIVE
        distinguishing_aspect: "Pair (business_referential, business_fiscal): a domain create whose sponsoring registrar is SUSPENDED AND whose registrar also has credit_hold=true must return the priority-8 referential error ERR_REGISTRAR_NOT_ACTIVE, not the priority-10 fiscal ERR_REGISTRAR_CREDIT_HOLD."
