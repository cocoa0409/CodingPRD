              as_user_id: "${sch_id}"
            - call: "GET /urology/procedure-rooms/${room_id}"
              payload: {}
              as: Scheduler
              as_user_id: "${sch_id}"
              captures: { room_v_after_schedule: $.data.version }
            - call: "POST /urology/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-14T09:15:00Z" }
              as: PracticeAdmin
          trigger:
            - call: "POST /urology/procedure-cases/${case_id}/no-show"
              payload: {}
              as: Scheduler
              as_user_id: "${sch_id}"
              captures: { err_id: $.data.error_id }
            - call: "GET /urology/procedure-rooms/${room_id}"
              payload: {}
              as: Scheduler
              as_user_id: "${sch_id}"
            - call: "POST /urology/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-14T09:16:00Z" }
              as: PracticeAdmin
            - call: "POST /urology/procedure-cases/${case_id}/no-show"
              payload: {}
              as: Scheduler
              as_user_id: "${sch_id}"
            - call: "GET /urology/procedure-rooms/${room_id}"
              payload: {}
              as: Scheduler
              as_user_id: "${sch_id}"
          assert:
            - "trigger call 1: HTTP 422 with data.error_id == \"ERR_NO_SHOW_GRACE_NOT_ELAPSED\" — 09:15 is not strictly after 09:00 + 15 minutes"
            - "trigger call 2: occupied_block_count == 1 and version == ${room_v_after_schedule}: the refused call released nothing"
            - "trigger call 4: HTTP 200 with schedule_status == \"NO_SHOW\" and cancel_reason_code == \"NO_SHOW_GRACE_ELAPSED\" (the constant string, not a body value — the endpoint takes no input)"
            - "trigger call 5: occupied_block_count == 0 and version == ${room_v_after_schedule} + 1"

      - name: val_priority_ordering_checkin_gate_ladder
        claim_type: priority_ordering
        grounds:
          - validations[priority 40]
          - validations[priority 48]
          - calculations.check_in_readiness_gates.constants.GATE_PRIORITY_ORDER
        excluded_because:
          difficulty_instance: pp_checkin_clearance_beats_antibiotic
          rationale: "Two simultaneously violated check-in rules with the lower-priority error suppressed, plus the readiness endpoint listing both codes in GATE_PRIORITY_ORDER, is precisely that §1.8 instance."

      - name: val_priority_ordering_device_reservation_ladder
        claim_type: priority_ordering
        grounds:
          - validations[priority 64]
          - validations[priority 70]
        excluded_because:
          difficulty_instance: pp_reservation_lot_expiry_beats_insufficient
          rationale: "That instance violates lot expiry and insufficient stock in the same request with the SKU deliberately matching, so only the priority-64 error may surface; a second corner test would repeat it."

  # ==========================================================================
  - section: endpoints
    instances:

      - name: ep_standard_crud_patch_patient_clinical_fields
        claim_type: standard_crud
        grounds:
          - endpoints[PATCH /urology/patients/{id}]
          - entities.Patient
        distinguishing_aspect: "The PATCH surface is deliberately narrow — only egfr, anticoagulant_flag and antibiotic_allergy_class — so a partial body must update exactly the named field, leave mrn, full_name, date_of_birth and both counters alone, and still bump version. The updated egfr must be the value later calculations read."
        test_recipe:
          setup:
            - "one urologist; patient Nadia Ruhl with egfr 90, anticoagulant_flag false, no allergy"
          setup_api_calls:
            - call: "POST /urology/providers"
              payload: { full_name: "Dr Ada Nour", npi: "1000000001", role_type: "UROLOGIST" }
              as: PracticeAdmin
              captures: { uro_id: $.data.id }
            - call: "POST /urology/patients"
              payload: { mrn: "MRN-5040", full_name: "Nadia Ruhl", date_of_birth: "1977-03-03", primary_urologist_id: "${uro_id}", egfr: 90 }
              as: PracticeAdmin
              captures: { pat_id: $.data.id, pat_v1: $.data.version }
          trigger:
            - call: "PATCH /urology/patients/${pat_id}"
              payload: { egfr: 44 }
              as: Urologist
              as_user_id: "${uro_id}"
              captures: { pat_v2: $.data.version }
            - call: "PATCH /urology/patients/${pat_id}"
              payload: { anticoagulant_flag: true, antibiotic_allergy_class: "SULFA" }
              as: PracticeAdmin
              captures: { pat_v3: $.data.version }
            - call: "GET /urology/patients/${pat_id}"
              payload: {}
              as: Urologist
              as_user_id: "${uro_id}"
          assert:
            - "trigger call 1: HTTP 200 with egfr == 44, anticoagulant_flag still false, antibiotic_allergy_class still null, ${pat_v2} == ${pat_v1} + 1"
            - "trigger call 2: anticoagulant_flag == true, antibiotic_allergy_class == \"SULFA\", egfr still 44, ${pat_v3} == ${pat_v2} + 1"
            - "trigger call 3: mrn == \"MRN-5040\", full_name == \"Nadia Ruhl\", date_of_birth == \"1977-03-03\", primary_urologist_id == the ${uro_id} value, outstanding_recall_count == 0, open_notification_count == 0"

      - name: ep_action_endpoint_consignment_full_return
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /urology/consignment-lots/{id}/return]
          - state_machines[ConsignmentLot.billing_status] CONSIGNED -> RETURNED
          - validations[priority 72]
        distinguishing_aspect: "The return action is the only path into RETURNED, and it is gated on quantity_available alone: returning the whole untouched lot zeroes the billing and flips billing_basis to FINAL, after which a further single-unit return has nothing left to draw on and is refused."
        test_recipe:
          setup:
            - "one lot: 10 units of BX-NEEDLE-18G at 1999 cents, expiring 2027-06-30, nothing reserved or consumed"
          setup_api_calls:
            - call: "POST /urology/consignment-lots"
              payload: { supplier_name: "Meridian Devices", sku: "BX-NEEDLE-18G", device_class: "BIOPSY_NEEDLE", quantity_received: 10, unit_price_cents: 1999, lot_expires_on: "2027-06-30" }
              as: PracticeAdmin
              captures: { lot_id: $.data.id, lot_v1: $.data.version }
          trigger:
            - call: "POST /urology/consignment-lots/${lot_id}/return"
              payload: { quantity: 10 }
              as: PracticeAdmin
              captures: { lot_v2: $.data.version }
            - call: "POST /urology/consignment-lots/${lot_id}/return"
              payload: { quantity: 1 }
              as: PracticeAdmin
              captures: { err_id: $.data.error_id }
            - call: "GET /urology/consignment-lots/${lot_id}"
              payload: {}
              as: PracticeAdmin
          assert:
            - "trigger call 1: HTTP 200 with quantity_returned == 10, quantity_available == 0, quantity_reserved == 0, quantity_consumed == 0, quantity_wasted == 0"
            - "trigger call 1: billing_status == \"RETURNED\", billed_amount_cents == 0, billing_basis == \"FINAL\", ${lot_v2} == ${lot_v1} + 1"
            - "trigger call 2: HTTP 422 with data.error_id == \"ERR_CONSIGNMENT_RETURN_EXCEEDS_AVAILABLE\""
            - "trigger call 3: quantity_returned still 10 and version still ${lot_v2}"
            - "the conservation identity holds throughout: 10 == 0 available + 0 reserved + 0 consumed + 0 wasted + 10 returned"

      - name: ep_computed_read_readiness_clear_then_in_room
        claim_type: computed_read
        grounds:
          - endpoints[GET /urology/procedure-cases/{id}/readiness]
          - calculations.check_in_readiness_gates
        distinguishing_aspect: "The all-clear shape of the readiness read is its own claim: an empty blocking_reason_codes with a null first_blocking_reason_code and check_in_allowed true. After check-in the array is still empty but check_in_allowed must flip to false, because the flag also requires schedule_status SCHEDULED — an implementation that derives the flag from the array alone keeps answering true."
