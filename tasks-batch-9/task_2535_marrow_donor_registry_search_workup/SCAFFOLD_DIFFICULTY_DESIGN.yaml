            - "level 4: MatchCandidate.${mc1_id}.status == DEFERRED and DonorProfile.${d1_id}.availability_status == TEMPORARILY_DEFERRED with deferral_until == \"2026-12-10\""
            - "level 4: GET /registry/donors/${d1_id}/unavailability-windows returns exactly one ACTIVE row with reason DEFERRAL, date_from \"2026-09-11\", date_to \"2026-12-10\", day_count 91, and DonorProfile.${d1_id}.blocked_day_count == 91"
            - "level 5: MatchCandidate.${mc3_id}.candidate_role == PRIMARY with promoted_from_rank == 2, MatchCandidate.${mc1_id}.candidate_role == ARCHIVED_POOL"
            - "level 5: SearchRequest.${sr_id}.status == BACKUP_REQUIRED and backup_candidate_count == 0"
            - "DonorProfile.${d3_id}.availability_status is still AVAILABLE and its blocked_day_count is still 0 - the cascade touched only the failing donor"

      - name: conditioning_abort_after_start_cascades_three_levels_and_stalls_search
