  # ---------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: after_hours_flag_at_exactly_1800_vs_175959
        grounds:
          - calculations.after_hours_and_priority
          - entities.ServiceCall.fields.after_hours
        distinguishing_aspect: |
          Metric: clock time at intake (POST /roadside/service-calls). after_hours uses
          hour >= 18 OR hour < 6 on UTC: 2026-08-03T17:59:59Z -> false, 18:00:00Z -> true.
          The >= (not >) boundary decides whether the 1.5x labor multiplier applies.
        test_recipe:
          setup: ["rate card and one retail vehicle exist"]
          setup_api_calls:
            - { call: "POST /roadside/rate-cards", payload: { name: "STD-2026", labor_rate_standard_cents: 14500, labor_rate_master_cents: 17500, after_hours_multiplier_bp: 15000, travel_free_miles: 25, travel_per_mile_cents: 425, travel_time_per_minute_cents: 200, emergency_callout_fee_cents: 25000, parts_tax_rate_bp: 725, effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-12-31T23:59:59Z" }, as: OpsAdmin, captures: { rc: $.data.id } }
            - { call: "POST /roadside/vehicles", payload: { vin: "1FUJHHDR1LLLW0002", unit_number: "R-01", make: "Kenworth", model: "T680", year: 2020, odometer_miles: 90000 }, as: Dispatcher, captures: { veh: $.data.id } }
            - { call: "POST /roadside/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T17:59:59Z" }, as: OpsAdmin }
            - { call: "POST /roadside/service-calls", payload: { vehicle_id: "${veh}", caller_name: "Jo", caller_phone: "555-0111", breakdown_location_text: "US-6 mm 12", distance_miles_from_depot: 10, symptom_category: "LIGHTING", symptom_description: "lights out" }, as: Dispatcher, captures: { sc_early: $.data.id, ah_early: $.data.after_hours } }
          trigger:
            - { call: "POST /roadside/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T18:00:00Z" }, as: OpsAdmin }
            - { call: "POST /roadside/service-calls", payload: { vehicle_id: "${veh}", caller_name: "Jo", caller_phone: "555-0111", breakdown_location_text: "US-6 mm 12", distance_miles_from_depot: 10, symptom_category: "LIGHTING", symptom_description: "lights out" }, as: Dispatcher, captures: { sc_edge: $.data.id, ah_edge: $.data.after_hours } }
          assert:
            - "ah_early == false (17:59:59 is business hours)"
            - "ah_edge == true (18:00:00 exactly is after-hours: the comparison is >= 18)"
            - "ServiceCall.${sc_early}.received_at == 2026-08-03T17:59:59Z and ServiceCall.${sc_edge}.received_at == 2026-08-03T18:00:00Z (logical clock stamped)"

