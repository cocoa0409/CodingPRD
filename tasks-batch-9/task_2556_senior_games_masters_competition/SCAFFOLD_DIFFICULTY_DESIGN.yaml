            - "exactly four PersonnelAssignment rows exist for Personnel ${pers_id}, on slots ${slot_a1_id}, ${slot_a3_id}, ${slot_b2_id} and ${slot_a5_id}"

      - name: bed_night_half_open_date_interval_with_per_night_capacity
        grounds:
          - calculations.bed_night_occupancy
          - validations[priority=78]
          - entities.AccommodationBlock.fields.bed_capacity
          - entities.VillageStay.fields.check_out_date
          - errors[ERR_BLOCK_NIGHT_FULL]
        distinguishing_aspect: |
          INTERVAL SEMANTICS #4 ON THE ACCOMMODATION-BLOCK RESOURCE, and the only one of the three
          whose interval grain is a DATE rather than a timestamp: the interval is half-open on
          NIGHTS so check_out_date's night is never occupied, and the capacity test is evaluated
          INDEPENDENTLY FOR EVERY NIGHT the candidate spans rather than once for the merged window,
          so a stay is refused when a single interior night is full even though every other night
          it covers is empty. Neither the Venue nor the Personnel rule decomposes a candidate
          interval into per-unit sub-checks.
