  - name: order_line_rounding_happens_per_line_before_the_subtotal
    claim_type: precision
    grounds:
    - calculations.order_line_extended_price
    - entities.Order.fields.line_subtotal_cents
    excluded_because:
      difficulty_instance: combinatorial_formula / order_line_extended_price_rounds_per_line_before_subtotal
      rationale: That instance pins two lines whose per-line ROUND_HALF_UP results differ by whole cents from rounding one aggregate product, and asserts both the per-line values and the stored subtotal.
  - name: provisional_to_final_delta_reconciles_on_the_billing_switch
    claim_type: reconciliation
    grounds:
    - calculations.order_total_assembly
    - entities.Order.fields.final_total_cents
    - entities.Order.fields.quoted_total_cents
    excluded_because:
      difficulty_instance: dual_variant_calc / order_price_provisional_vs_final_variant_divergence
      rationale: The named §1.8 instance asserts both variant totals and the signed delta written at the QUOTED -> INVOICED switch, including the punch-list credit arm.
  - name: tradein_credit_ledger_stays_conserved_under_grant_and_spend
    claim_type: correct_result
    grounds:
    - calculations.tradein_credit_ledger
    - entities.Facility.fields.tradein_credit_balance_cents
    excluded_because:
      difficulty_instance: compensating_invariant / tradein_credit_ledger_conserved_under_blocked_and_allowed_reverse
      rationale: That instance asserts granted == applied + balance after every mutation, including the refused reverse, which is precisely this ledger's correctness claim.
  - name: spare_stock_ledger_stays_conserved_across_reserve_and_consume
    claim_type: correct_result
    grounds:
    - calculations.spare_stock_ledger
    - entities.ServicePartner.fields.spare_stock_on_hand_units
    excluded_because:
      difficulty_instance: compensating_invariant / spare_stock_ledger_conserved_across_reserve_consume_release
      rationale: That instance walks receipt, reserve, complete, cancel and hold while asserting received == on_hand + reserved + consumed at each step.
