  # ─────────────────────────────────────────────────────────────────────────
  - rule_id: resource_temporal_overlap
    instances:
      - name: tier_allocation_capacity_overlap
        grounds:
          - validations[priority=15]
          - entities.PriceTier.fields.allocation
          - entities.PriceTier.fields.reserved_count
          - state_machines.QueueEntry.WAITING_to_OFFERED
        distinguishing_aspect: |
          Aggregate-capacity overlap semantics on PriceTier: a new offer is rejected when
          reserved_count+sold_count+requested_qty would exceed allocation — overlap is measured by
          summed seat occupancy against a fixed capacity, not by point-in-time adjacency.
        test_recipe:
          setup:
            - "Tier T allocation=2 in a GENERAL event; one OFFERED entry already holds 2 seats; a second WAITING entry requests 1 more."
          setup_api_calls:
            - call: "POST /events"
              payload: { title: "E", venue_capacity: 100, presale_code: "S", face_value_cents: 10000, resale_cap_pct: 110 }
              as: PromoterAdmin
              captures: { ev: $.data.id, ev_v: $.data.version }
            - call: "POST /price-tiers"
              payload: { event_id: "${ev}", name: "FLOOR", allocation: 2, base_multiplier_bps: 10000 }
              as: PromoterAdmin
              captures: { tier: $.data.id }
            - call: "POST /events/${ev}/open-presale"
              payload: { expected_event_version: "${ev_v}" }
              as: PromoterAdmin
              captures: { ev_v2: $.data.version }
            - call: "POST /events/${ev}/open-general"
              payload: { expected_event_version: "${ev_v2}" }
              as: PromoterAdmin
            - call: "POST /fans"
              payload: { email: "u1@x.com", full_name: "U1", device_fingerprint: "dev-u1" }
              as: Anonymous
              captures: { fu1: $.data.id }
            - call: "POST /fans/${fu1}/verify"
              payload: {}
              as: Fan
              as_user_id: "${fu1}"
            - call: "POST /queue-entries"
              payload: { event_id: "${ev}", fan_id: "${fu1}", tier_id: "${tier}", presale_code_used: "S", requested_qty: 2 }
              as: Fan
              as_user_id: "${fu1}"
              captures: { qu1: $.data.id }
            - call: "POST /fans"
              payload: { email: "u2@x.com", full_name: "U2", device_fingerprint: "dev-u2" }
              as: Anonymous
              captures: { fu2: $.data.id }
            - call: "POST /fans/${fu2}/verify"
              payload: {}
              as: Fan
              as_user_id: "${fu2}"
            - call: "POST /queue-entries"
              payload: { event_id: "${ev}", fan_id: "${fu2}", tier_id: "${tier}", presale_code_used: "S", requested_qty: 1 }
              as: Fan
              as_user_id: "${fu2}"
