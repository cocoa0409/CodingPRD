              payload: { crew_id: "${c1_id}", scheduled_start_utc: "2026-08-03T08:00:00Z" }
              as: DispatchCoordinator
              as_user_id: "dc-001"
            - call: "POST /fence-rentals/work-orders/${wo1_id}/complete"
              payload: { completed_linear_feet: 500 }
              as: DispatchCoordinator
              as_user_id: "dc-001"
            - call: "GET /fence-rentals/contracts/${ct1_id}"
              payload: {}
              as: DispatchCoordinator
              as_user_id: "dc-001"
              captures: { ct1_v_fresh: "$.data.version" }
          trigger:
            - call: "POST /fence-rentals/contracts/${ct1_id}/reset-orders"
              payload: { expected_contract_version: "${ct1_v_stale}", ordered_linear_feet: 500, phase_to: 2, scheduled_start_utc: "2026-08-06T08:00:00Z" }
              as: DispatchCoordinator
              as_user_id: "dc-001"
            - call: "POST /fence-rentals/contracts/${ct1_id}/reset-orders"
              payload: { expected_contract_version: "${ct1_v_fresh}", ordered_linear_feet: 500, phase_to: 1, scheduled_start_utc: "2026-08-06T08:00:00Z" }
              as: DispatchCoordinator
              as_user_id: "dc-001"
            - call: "POST /fence-rentals/contracts/${ct1_id}/reset-orders"
              payload: { expected_contract_version: "${ct1_v_fresh}", ordered_linear_feet: 500, phase_to: 5, scheduled_start_utc: "2026-08-06T08:00:00Z" }
              as: DispatchCoordinator
              as_user_id: "dc-001"
            - call: "POST /fence-rentals/contracts/${ct1_id}/reset-orders"
              payload: { expected_contract_version: "${ct1_v_fresh}", ordered_linear_feet: 500, phase_to: 2, scheduled_start_utc: "2026-08-06T08:00:00Z" }
              as: DispatchCoordinator
              as_user_id: "dc-001"
              captures: { wo_reset_id: "$.data.id" }
          assert:
            - "First trigger: HTTP 412 with data.error_id == \"ERR_STALE_VERSION\" (priority 8 fires before the phase is inspected, even though phase_to 2 is a legal move)"
            - "Second trigger: HTTP 409 with data.error_id == \"ERR_INVALID_PHASE_MOVE\" (phase_to equals RentalContract.current_phase 1)"
            - "Third trigger: HTTP 409 with data.error_id == \"ERR_INVALID_PHASE_MOVE\" (phase_to 5 exceeds Jobsite.phase_count 4)"
            - "None of the three refusals changes RentalContract.${ct1_id}.version, so the fourth call reuses ${ct1_v_fresh}"
            - "Fourth trigger: HTTP 201, WorkOrder.${wo_reset_id}.work_order_type == \"RESET\", status == \"PLANNED\", ordered_linear_feet == 500"
            - "WorkOrder.${wo_reset_id}.phase_from == 1 and phase_to == 2"
            - "RentalContract.${ct1_id}.current_phase is still 1 (the phase moves only when the RESET order completes) and deployed_linear_feet == 500"

