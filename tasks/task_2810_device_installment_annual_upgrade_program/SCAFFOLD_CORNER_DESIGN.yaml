            - "after all seven refusals InstallmentLoan.${loan}.status == ACTIVE, obligation_balance_cents == 113876, version == ${loan_v} and DeviceUnit.${dev}.activation_status == UNACTIVATED"
            - "GET /credit-applications?customer_id=${cust} still returns total_count == 1"

      - name: cancellation_needs_the_right_quote_type_and_the_exact_amount
        claim_type: violation_to_error
        grounds:
          - validations.priority_41_ERR_PAYOFF_QUOTE_TYPE_MISMATCH
          - validations.priority_104_ERR_PAYOFF_AMOUNT_MISMATCH
          - calculations.payoff_quote
          - state_machines.InstallmentLoan.status.ACTIVE_to_PAID_OFF
        distinguishing_aspect: |
          An UPGRADE_ROLLOVER quote is rejected at the cancellation window on TYPE (priority 41)
          even though it is a live quote on the right loan, and once the correct
          EARLY_CANCELLATION quote is drawn its 70822-cent total must be tendered to the cent:
          70821 is refused with ERR_PAYOFF_AMOUNT_MISMATCH and only 70822 closes the loan.
        test_recipe:
          setup:
            - "PRIME Handset B loan originated 2026-08-01 with zero payments, so the cancellation quote is remaining_principal 89900 minus a 21578 pro-rata premium rebate plus the 2500 admin fee == 70822."
          setup_api_calls:
            - call: "POST /device-models"
              payload: { sku: "MDL-B", display_name: "Handset B", retail_price_cents: 89900, monthly_protection_premium_cents: 999, trade_in_base_credit_cents: 45000, generation_year: 2026 }
