scaffold_difficulty_design:

  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: dual_variant_line_extended_siding_vs_trim
        grounds:
          - calculations.line_extended_amount
          - entities.EstimateLineItem.fields.extended_cents
          - entities.Estimate.fields.waste_factor_pct
        distinguishing_aspect: "On EstimateLineItem: a SIDING line multiplies quantity by (1+waste_factor_pct) before pricing while a TRIM line does not, so identical quantity*unit_price inputs yield different extended_cents (this is the calculation domain EstimateLineItem)."
        test_recipe:
          setup:
            - "Estimate with waste_factor_pct=0.10; one SIDING line (qty 1000, unit 1000c) and one TRIM line (qty 1000, unit 1000c)."
          setup_api_calls:
            - call: "POST /staff/register"
              payload: { email: "est1@x.com", full_name: "Est One", role_code: "ESTIMATOR" }
              as: Anonymous
              captures: { est_id: $.data.id }
            - call: "POST /staff/register"
              payload: { email: "pm1@x.com", full_name: "PM One", role_code: "PROJECT_MANAGER" }
              as: Anonymous
              captures: { pm_id: $.data.id }
            - call: "POST /clients/register"
              payload: { email: "c1@x.com", full_name: "Client One", annual_income_cents: 12000000, monthly_debt_cents: 100000 }
              as: Anonymous
              captures: { client_id: $.data.id }
            - call: "POST /projects"
              payload: { client_id: "${client_id}", project_manager_id: "${pm_id}", property_address: "1 Hardie Way", hoa_required: false }
              as: ProjectManager
              as_user_id: "${pm_id}"
              captures: { proj_id: $.data.id }
            - call: "POST /projects/${proj_id}/measurements"
              payload: { estimator_id: "${est_id}", gross_wall_sqft: 1100, opening_sqft: 100, linear_trim_ft: 300, color_code: "ARCTIC_WHITE_HZ10" }
              as: Estimator
              as_user_id: "${est_id}"
              captures: { meas_id: $.data.id }
            - call: "POST /estimates"
              payload: { project_id: "${proj_id}", measurement_id: "${meas_id}", waste_factor_pct: 0.10 }
              as: Estimator
              as_user_id: "${est_id}"
              captures: { est_obj_id: $.data.id }
          trigger:
            - call: "POST /estimates/${est_obj_id}/line-items"
              payload: { scope_kind: "SIDING", quantity: 1000, unit_price_cents: 1000 }
              as: Estimator
              as_user_id: "${est_id}"
              captures: { siding_line_id: $.data.id }
            - call: "POST /estimates/${est_obj_id}/line-items"
              payload: { scope_kind: "TRIM", quantity: 1000, unit_price_cents: 1000 }
              as: Estimator
              as_user_id: "${est_id}"
              captures: { trim_line_id: $.data.id }
          assert:
            - "EstimateLineItem.${siding_line_id}.extended_cents == 1100000"
            - "EstimateLineItem.${trim_line_id}.extended_cents == 1000000"

      - name: dual_variant_contract_total_forward_vs_frozen
        grounds:
          - calculations.realized_contract_total
          - calculations.draw_release_amount
          - state_machines.ChangeOrder.SUBMITTED_to_APPROVED
          - entities.ProgressDraw.fields.gross_amount_cents
        distinguishing_aspect: "On Project/ProgressDraw: a draw APPROVED before a ChangeOrder approval keeps its gross_amount_cents frozen at the pre-change contract total, while a draw approved AFTER uses the live (higher) contract total — same milestone_pct, different gross (this is the Project/draw domain, distinct from the EstimateLineItem instance above)."
        test_recipe:
          setup:
            - "Project IN_PROGRESS with BASELINE contract_total_cents=1324980 (siding 990000 + trim 90000 + wrap 144000 + tax). Two completed milestone windows. Draw#1 (30%) approved BEFORE a +50000 change order is approved; Draw#2 (30%) approved AFTER."
          setup_api_calls:
            - call: "POST /staff/register"
              payload: { email: "est2@x.com", full_name: "Est Two", role_code: "ESTIMATOR" }
              as: Anonymous
              captures: { est_id: $.data.id }
            - call: "POST /staff/register"
              payload: { email: "pm2@x.com", full_name: "PM Two", role_code: "PROJECT_MANAGER" }
              as: Anonymous
              captures: { pm_id: $.data.id }
            - call: "POST /clients/register"
              payload: { email: "c2@x.com", full_name: "Client Two", annual_income_cents: 12000000, monthly_debt_cents: 100000 }
              as: Anonymous
              captures: { client_id: $.data.id }
            - call: "POST /projects"
              payload: { client_id: "${client_id}", project_manager_id: "${pm_id}", property_address: "2 Hardie Way", hoa_required: false }
              as: ProjectManager
              as_user_id: "${pm_id}"
              captures: { proj_id: $.data.id }
            - call: "POST /projects/${proj_id}/measurements"
              payload: { estimator_id: "${est_id}", gross_wall_sqft: 2000, opening_sqft: 200, linear_trim_ft: 300, color_code: "IRON_GRAY_HZ10" }
              as: Estimator
              as_user_id: "${est_id}"
              captures: { meas_id: $.data.id }
            - call: "POST /estimates"
              payload: { project_id: "${proj_id}", measurement_id: "${meas_id}", waste_factor_pct: 0.10 }
              as: Estimator
              as_user_id: "${est_id}"
              captures: { est_obj_id: $.data.id }
            - call: "POST /estimates/${est_obj_id}/line-items"
              payload: { scope_kind: "SIDING", quantity: 1800, unit_price_cents: 500 }
              as: Estimator
              as_user_id: "${est_id}"
              captures: { siding_line_id: $.data.id }
            - call: "POST /estimates/${est_obj_id}/line-items"
              payload: { scope_kind: "TRIM", quantity: 300, unit_price_cents: 300 }
              as: Estimator
              as_user_id: "${est_id}"
            - call: "POST /estimates/${est_obj_id}/line-items"
              payload: { scope_kind: "WRAP", quantity: 1800, unit_price_cents: 80 }
              as: Estimator
              as_user_id: "${est_id}"
            - call: "POST /estimates/${est_obj_id}/baseline"
              payload: {}
              as: ProjectManager
              as_user_id: "${pm_id}"
            - call: "POST /permits"
              payload: { project_id: "${proj_id}", jurisdiction: "Austin" }
              as: ProjectManager
              as_user_id: "${pm_id}"
              captures: { permit_id: $.data.id }
            - call: "POST /permits/${permit_id}/issue"
              payload: { permit_number: "P-1001" }
              as: ProjectManager
              as_user_id: "${pm_id}"
            - call: "POST /material-orders"
              payload: { project_id: "${proj_id}", estimate_id: "${est_obj_id}" }
              as: ProjectManager
              as_user_id: "${pm_id}"
              captures: { mo_id: $.data.id }
            - call: "POST /material-orders/${mo_id}/confirm"
              payload: { delivery_eta_iso: "2026-04-10T00:00:00Z" }
              as: ProjectManager
              as_user_id: "${pm_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-10T00:00:00Z" }
              as: ProjectManager
              as_user_id: "${pm_id}"
            - call: "POST /material-orders/${mo_id}/deliver"
              payload: {}
              as: ProjectManager
              as_user_id: "${pm_id}"
            - call: "POST /crews"
              payload: { name: "Crew A", max_wind_mph: 30 }
              as: ProjectManager
              as_user_id: "${pm_id}"
              captures: { crew_id: $.data.id }
            - call: "POST /projects/${proj_id}/work-schedules"
              payload: { crew_id: "${crew_id}", milestone: "WRAP_INSTALL", window_start_iso: "2026-04-11T08:00:00Z", window_end_iso: "2026-04-11T17:00:00Z", forecast_wind_mph: 10 }
              as: ProjectManager
              as_user_id: "${pm_id}"
              captures: { ws1_id: $.data.id }
            - call: "POST /work-schedules/${ws1_id}/confirm"
              payload: {}
              as: ProjectManager
              as_user_id: "${pm_id}"
            - call: "POST /work-schedules/${ws1_id}/start"
              payload: {}
              as: ProjectManager
              as_user_id: "${pm_id}"
            - call: "POST /work-schedules/${ws1_id}/complete"
              payload: {}
              as: ProjectManager
              as_user_id: "${pm_id}"
            - call: "POST /projects/${proj_id}/work-schedules"
              payload: { crew_id: "${crew_id}", milestone: "SIDING_INSTALL", window_start_iso: "2026-04-15T08:00:00Z", window_end_iso: "2026-04-15T17:00:00Z", forecast_wind_mph: 10 }
              as: ProjectManager
              as_user_id: "${pm_id}"
              captures: { ws2_id: $.data.id }
            - call: "POST /work-schedules/${ws2_id}/confirm"
              payload: {}
              as: ProjectManager
              as_user_id: "${pm_id}"
            - call: "POST /work-schedules/${ws2_id}/complete"
              payload: {}
              as: ProjectManager
              as_user_id: "${pm_id}"
            - call: "POST /projects/${proj_id}/progress-draws"
              payload: { work_schedule_id: "${ws1_id}", milestone_pct: 0.30 }
              as: ProjectManager
              as_user_id: "${pm_id}"
              captures: { draw1_id: $.data.id }
            - call: "POST /progress-draws/${draw1_id}/approve"
              payload: {}
              as: ProjectManager
              as_user_id: "${pm_id}"
            - call: "POST /change-orders"
              payload: { project_id: "${proj_id}", target_line_item_id: "${siding_line_id}", delta_cents: 50000 }
              as: ProjectManager
              as_user_id: "${pm_id}"
              captures: { co_id: $.data.id }
            - call: "POST /change-orders/${co_id}/sign"
              payload: {}
              as: ProjectManager
              as_user_id: "${pm_id}"
            - call: "POST /change-orders/${co_id}/sign"
              payload: {}
              as: HomeownerClient
              as_user_id: "${client_id}"
            - call: "GET /projects/${proj_id}"
              payload: {}
              as: ProjectManager
              as_user_id: "${pm_id}"
              captures: { proj_v_pre_co: $.data.version }
            - call: "POST /change-orders/${co_id}/approve"
              payload: { expected_project_version: "${proj_v_pre_co}" }
              as: ProjectManager
              as_user_id: "${pm_id}"
          trigger:
            - call: "POST /projects/${proj_id}/progress-draws"
              payload: { work_schedule_id: "${ws2_id}", milestone_pct: 0.30 }
              as: ProjectManager
              as_user_id: "${pm_id}"
              captures: { draw2_id: $.data.id }
            - call: "POST /progress-draws/${draw2_id}/approve"
              payload: {}
              as: ProjectManager
              as_user_id: "${pm_id}"
          assert:
            - "ProgressDraw.${draw1_id}.gross_amount_cents == 397494"
            - "ProgressDraw.${draw2_id}.gross_amount_cents == 412494"
            - "Project.${proj_id}.contract_total_cents == 1374980"

  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: combinatorial_line_extended_conditional_branch
        grounds:
          - calculations.line_extended_amount
          - entities.EstimateLineItem.fields.scope_kind
          - entities.Estimate.fields.waste_factor_pct
        distinguishing_aspect: "Mode (a): line_extended_amount has >=3 inputs (quantity, unit_price_cents, scope_kind, waste_factor_pct) with a non-linear conditional branch on scope_kind that multiplies by (1+waste) only for SIDING."
        test_recipe:
          setup:
            - "Estimate with waste_factor_pct=0.10; add one SIDING line qty 1800 unit 500c."
          setup_api_calls:
            - call: "POST /staff/register"
              payload: { email: "est3@x.com", full_name: "Est Three", role_code: "ESTIMATOR" }
              as: Anonymous
              captures: { est_id: $.data.id }
