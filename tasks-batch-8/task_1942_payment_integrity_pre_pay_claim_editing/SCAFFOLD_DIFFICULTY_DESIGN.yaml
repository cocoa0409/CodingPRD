            - "after the overturn: fp_rate == 0.2500 exactly (1/4) and EditVersion.${evf6_id}.status == SUSPENDED (>= boundary inclusive)"
  # =========================================================================
  # Rule 7 — cross_entity_state_dependency (different entity pairs)
  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: claim_pay_gated_by_open_review_tasks
        grounds:
          - state_machines.Claim.PENDED_to_DETERMINED
          - state_machines.ReviewTask.IN_REVIEW_to_DECIDED
          - errors[ERR_CLAIM_NOT_PAYABLE]
        distinguishing_aspect: |
          Pair Claim <-> ReviewTask: with one of two tasks still undecided the
          claim cannot leave PENDED (pay is rejected); only the second task's
          decision bubbles the claim through DETERMINED to READY_TO_PAY, and
          pay then succeeds.
        test_recipe:
          setup:
            - "Provider PC7; edit EC7 (DENY, PROFESSIONAL) ACTIVE"
            - "Claim with two lines (120000 and 80000): edit fires on both lines -> two hits, two PENDING tasks; claim PENDED with allowed 0, denied 200000"
          setup_api_calls:
            - { call: "POST /payment-integrity/providers", payload: { npi: "NPI-C7", name: "Gate Prov" }, as: PlanAdmin, captures: { pc7_id: $.data.id } }
            - { call: "POST /payment-integrity/edit-rules", payload: { edit_code: "GATE-DENY", category: CODING, source: INTERNAL }, as: EditLibrarian, as_user_id: librarian-1, captures: { rc7_id: $.data.id, rc7_v: $.data.version } }
            - { call: "POST /payment-integrity/edit-rules/${rc7_id}/versions", payload: { severity: DENY, applies_to_claim_types: [PROFESSIONAL], logic_expression: "deny line", effective_from: "2026-01-01T00:00:00Z" }, as: EditLibrarian, as_user_id: librarian-1, captures: { evc7_id: $.data.id } }
            - { call: "POST /payment-integrity/edit-versions/${evc7_id}/submit", payload: {}, as: EditLibrarian, as_user_id: librarian-1 }
            - { call: "POST /payment-integrity/edit-versions/${evc7_id}/approve", payload: { expected_edit_rule_version: "${rc7_v}" }, as: EditApprover, as_user_id: approver-1 }
            - { call: "POST /payment-integrity/claims", payload: { claim_number: "C7", provider_id: "${pc7_id}", member_id: "M-C7", claim_type: PROFESSIONAL, total_billed_cents: 200000, service_from: "2026-07-10T00:00:00Z", service_to: "2026-07-10T00:00:00Z" }, as: Provider, as_user_id: "${pc7_id}", captures: { cc7_id: $.data.id } }
            - { call: "POST /payment-integrity/claims/${cc7_id}/lines", payload: { line_number: 1, procedure_code: "99213", billed_cents: 120000 }, as: Provider, as_user_id: "${pc7_id}" }
            - { call: "POST /payment-integrity/claims/${cc7_id}/lines", payload: { line_number: 2, procedure_code: "99214", billed_cents: 80000 }, as: Provider, as_user_id: "${pc7_id}" }
            - { call: "POST /payment-integrity/claims/${cc7_id}/run-edits", payload: {}, as: PlanAdmin }
            - { call: "GET /payment-integrity/review-tasks", payload: { claim_id: "${cc7_id}" }, as: Any, captures: { tc7a_id: "$.data[0].id", tc7b_id: "$.data[1].id" } }
            - { call: "POST /payment-integrity/review-tasks/${tc7a_id}/assign", payload: { reviewer_user_id: "rev-1" }, as: SeniorReviewer, as_user_id: senior-1 }
            - { call: "POST /payment-integrity/review-tasks/${tc7a_id}/decide", payload: { outcome: UPHOLD }, as: Reviewer, as_user_id: rev-1 }
          trigger:
            - { call: "POST /payment-integrity/claims/${cc7_id}/pay", payload: {}, as: PlanAdmin, captures: { pay_err: $.data.error_id } }
            - { call: "POST /payment-integrity/review-tasks/${tc7b_id}/assign", payload: { reviewer_user_id: "rev-2" }, as: SeniorReviewer, as_user_id: senior-1 }
            - { call: "POST /payment-integrity/review-tasks/${tc7b_id}/decide", payload: { outcome: OVERRIDE }, as: Reviewer, as_user_id: rev-2 }
            - { call: "GET /payment-integrity/claims/${cc7_id}", payload: {}, as: Any, captures: { cc7_status: $.data.status, cc7_allowed: $.data.allowed_amount_cents, cc7_denied: $.data.denied_amount_cents } }
            - { call: "POST /payment-integrity/claims/${cc7_id}/pay", payload: {}, as: PlanAdmin, captures: { cc7_final: $.data.status } }
          assert:
            - "first pay rejected with error_id == ERR_CLAIM_NOT_PAYABLE (409): claim still PENDED while task 2 is undecided"
            - "after task 2 OVERRIDE (release 80000): Claim.${cc7_id}.status == READY_TO_PAY, allowed_amount_cents == 80000, denied_amount_cents == 120000"
            - "second pay succeeds: Claim.${cc7_id}.status == PAID"

      - name: hit_application_gated_by_abrasion_tier
        grounds:
          - state_machines.Claim.RECEIVED_to_PENDED
          - entities.EditHit.fields.applied
          - entities.ProviderAbrasionProfile.fields.monitor_only
          - calculations.provider_abrasion_index
        distinguishing_aspect: |
          Pair EditHit <-> ProviderAbrasionProfile: whether a newly fired hit
          denies dollars and spawns a ReviewTask depends on the provider's
