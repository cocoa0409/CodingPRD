      - name: replenishment_replay_with_same_idempotency_key_returns_original
        claim_type: idempotency
        grounds:
          - endpoints.POST_/replenish-orders
          - entities.ReplenishOrder.fields.idempotency_key
        distinguishing_aspect: "A repeated POST /replenish-orders with the same (site, idempotency_key) returns the original record — no second row, no doubled on_order after place."
        test_recipe:
          setup: ["Logical clock 2026-09-10T14:00:00Z. SITE-A, SKU-CHIPS balance row."]
          setup_api_calls:
            - call: "POST /mfc/_clock/set_current_utc"
