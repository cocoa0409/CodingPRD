      - name: advancing_the_clock_into_a_holding_deal_term_flips_term_state_and_exclusivity
        claim_type: action_endpoint
        grounds:
          - "endpoints.POST_/_clock/set_current_utc"
          - "entities.HoldingDeal.fields.term_state"
          - "entities.Writer.fields.exclusivity_status"
        distinguishing_aspect: "Nothing is written to the holding deal - only the clock moves - yet term_state must re-derive PENDING_START -> IN_TERM on the next read and the writer's exclusivity_status must follow from FREE to HOLDING_DEAL, proving both fields are computed at read time rather than stamped at creation."
        test_recipe:
          setup:
            - "writer Ada Reyes is under an ACTIVE holding deal for 2026-10-01..2027-10-01 funded at 6000000; the clock reads 2026-08-01, so term_state is PENDING_START and exclusivity_status is FREE"
