              captures: { asg_live_id: $.data.id }
            - call: "POST /rmd/number-assignments"
              payload: { provider_id: "${prov_id}", customer_id: "${cust_id}", telephone_number: "+12025550222", ownership_evidence: "LEASED_FROM_CARRIER", effective_from: "2026-08-01T00:00:00Z" }
              as: ProviderAdmin
