# =============================================================================
# SCAFFOLD — Vehicle Valuation Guidebook Publication & Data Licensing
# Sections §1.0–§1.7 only. §1.8 lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml,
# §1.9 lives in SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  Vehicle Valuation Guidebook Publication & Data Licensing (Kelley Blue Book): transaction data ingestion from dealers, auctions and lenders with regional segmentation, valuation model construction producing trade-in, private party and retail values by condition tier and options, condition definition standards and consumer self-assessment tools that affect the quoted value, mileage and option adjustments with depreciation curves and market shift updates, publication cadence with weekly or more frequent updates and historical value retention, licensing to lenders, insurers and dealers for underwriting and settlement use with permitted-use restrictions, instant cash offer programs where a published value converts into a dealer-funded offer, methodology disclosure and dispute handling

domain_name: "vehicle-valuation-guidebook"
api_prefix: ""
complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: event_sourcing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - derived_field_reconciliation
    - rate_threshold_triggers
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — emit verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Region
    parent: null
    common_fields: true
    fields:
      - name: region_code
        type: string
        source: input
        description: "Uppercase region code, unique across all regions (e.g. WEST, EAST)"
      - name: name
        type: string
        source: input
        description: "Human-readable region name"
      - name: status
        type: enum
        source: system
        default: ACTIVE
        constraints: "ACTIVE | ARCHIVED; archived via PATCH /regions/{id} with status=ARCHIVED, idempotent"

  - name: Source
    parent: null
    common_fields: true
    fields:
      - name: source_type
        type: enum
        source: input
        description: "Kind of submitting counterparty"
        constraints: "DEALER | AUCTION | LENDER"
      - name: region_id
        type: string
        source: input
        description: "FK -> Region.id"
      - name: status
        type: enum
        source: system
        default: PROBATION
        constraints: "PROBATION | ACTIVE | SUSPENDED; lifecycle per state_machines.Source"
      - name: consecutive_rejections
        type: integer
        source: system
        default: 0
        description: "Count of consecutive batch rejections; resets to 0 on the next ACCEPTED batch; reaching 5 auto-suspends the source"
      - name: external_key
        type: string
        source: input
        description: "Idempotency key; unique per source for POST /sources"
      - name: name
        type: string
        source: input
        description: "Display name of the submitting counterparty"

  - name: Configuration
    parent: null
    common_fields: true
    fields:
      - name: make
        type: string
        source: input
        description: "Vehicle make (e.g. Ford)"
      - name: model
        type: string
        source: input
        description: "Vehicle model (e.g. F-150)"
      - name: year
        type: integer
        source: input
        description: "Model year; must satisfy 1990 <= year <= 2030"
      - name: trim
        type: string
        source: input
        description: "Trim designation (e.g. XLT)"
      - name: segment
        type: enum
        source: input
        description: "Vehicle segment classification"
        constraints: "SEDAN | SUV | TRUCK | VAN | COUPE"
      - name: annual_expected_miles
        type: integer
        source: input
        description: "Expected annual mileage used by the mileage adjustment curve"
        default: 10000
      - name: status
        type: enum
        source: system
        default: ACTIVE
        constraints: "ACTIVE | DISCONTINUED; set DISCONTINUED via PATCH /configurations/{id}"
      - name: external_key
        type: string
        source: input
        description: "Idempotency key; unique for POST /configurations"

  - name: TransactionBatch
    parent: null
    common_fields: true
    fields:
      - name: source_id
        type: string
        source: input
        description: "FK -> Source.id"
      - name: submission_ref
        type: string
        source: input
        description: "Unique batch reference; second POST with the same submission_ref returns the existing batch (idempotent create)"
      - name: items
        type: array
        source: input
        description: "Batch items; each item: {configuration_id, region_id, sold_price_cents, sale_date, mileage}; 1 <= len(items) <= 500; item price integer 100..100000000"
      - name: status
        type: enum
        source: system
        default: RECEIVED
        constraints: "RECEIVED | VALIDATED | ACCEPTED | REJECTED"
      - name: accepted_count
        type: integer
        source: system
        default: 0
        description: "Number of items ingested; set on transition to ACCEPTED"

  - name: ValuationSeries
    parent: null
    common_fields: true
    fields:
      - name: configuration_id
        type: string
        source: input
        description: "FK -> Configuration.id; (configuration_id, region_id) unique among series with status != SUPERSEDED"
      - name: region_id
        type: string
        source: input
        description: "FK -> Region.id"
      - name: effective_from
        type: datetime
        source: input
        description: "Series' first edition must have effective_at == this value exactly"
      - name: cadence
        type: enum
        source: input
        description: "Publication cadence; WEEKLY means editions within a series must be at least 7 days apart"
        constraints: "WEEKLY"
      - name: status
        type: enum
        source: system
        default: DRAFT
        constraints: "DRAFT | ACTIVE | SUSPENDED | SUPERSEDED"
      - name: confidence_score
        type: number
        source: computed
        description: "Data confidence in [0,1], per calculations.confidence_score; edition publication is gated at >= 0.25"
      - name: external_key
        type: string
        source: input
        description: "Idempotency key; unique for POST /valuation-series"

  - name: ValuationEdition
    parent: null
    common_fields: true
    fields:
      - name: series_id
        type: string
        source: input
        description: "FK -> ValuationSeries.id"
      - name: effective_at
        type: datetime
        source: input
        description: "Edition effective instant; uniqueness per series enforced among PENDING/PUBLISHED editions"
      - name: reference_price_cents
        type: integer
        source: computed
        description: "Base market price from calculations.trailing_market_reference, possibly market-shift-blended, frozen at PUBLISHED"
      - name: trade_in_cents
        type: integer
        source: computed
        description: "round_half_up(reference_price_cents * 0.87)"
      - name: private_party_cents
        type: integer
        source: computed
        description: "round_half_up(reference_price_cents * 0.95)"
      - name: retail_cents
        type: integer
        source: computed
        description: "round_half_up(reference_price_cents * 1.08)"
      - name: status
        type: enum
        source: system
        default: PENDING
        constraints: "PENDING | PUBLISHED | WITHDRAWN"
      - name: published_at
        type: datetime
        source: system
        description: "Set when the edition transitions PENDING -> PUBLISHED"

  - name: MarketShift
    parent: null
    common_fields: true
    fields:
      - name: region_id
        type: string
        source: input
        description: "FK -> Region.id; null means the shift applies to all regions"
      - name: segment
        type: enum
        source: input
        description: "Segment scope; null means all segments"
        constraints: "SEDAN | SUV | TRUCK | VAN | COUPE | null"
      - name: effective_at
        type: datetime
        source: input
        description: "Instant the shift takes effect; only editions with effective_at >= this value are blended"
      - name: pct_adjustment
        type: number
        source: input
        description: "Signed fraction, e.g. 0.02 means +2%; must satisfy -0.50 <= pct_adjustment <= 0.50"
      - name: status
        type: enum
        source: system
        default: DRAFT
        constraints: "DRAFT | ACTIVE | RESCINDED"

  - name: CashOffer
    parent: null
    common_fields: true
    fields:
      - name: edition_id
        type: string
        source: input
        description: "FK -> ValuationEdition.id; offer pins the edition used at creation"
      - name: offer_amount_cents
        type: integer
        source: computed
        description: "Per calculations.offer_amount; frozen at creation, never recomputed"
      - name: funding_dealer_id
        type: string
        source: input
        description: "FK -> Source.id; must reference a Source with source_type=DEALER"
      - name: consumer_id
        type: string
        source: input
        description: "FK -> ConsumerProfile.id"
      - name: mileage
        type: integer
        source: input
        description: "Vehicle mileage; >= 0"
      - name: age_years
        type: integer
        source: input
        description: "Vehicle age in whole years; >= 0"
      - name: declared_condition_tier
        type: enum
        source: input
        description: "Consumer self-assessed tier used for the quoted amount"
        constraints: "EXCELLENT | GOOD | FAIR | POOR"
      - name: option_ids
        type: array
        source: input
        description: "Array of OptionPackage.id values to credit; may be empty; unknown ids are an error"
      - name: expires_at
        type: datetime
        source: computed
        description: "edition.published_at + 7 days"
      - name: status
        type: enum
        source: system
        default: QUOTED
        constraints: "QUOTED | INSPECTED | REDEEMED | EXPIRED | VOID"
      - name: final_amount_cents
        type: integer
        source: computed
        description: "Set on inspection; consumer-declared tier GOOD is re-priced at inspected tier FAIR with the >= 90% cap, so the final amount can differ from the quote"

  - name: LicenseAgreement
    parent: null
    common_fields: true
    fields:
      - name: licensee_ref
        type: string
        source: input
        description: "Opaque licensee identifier supplied by ValuationAdmin"
      - name: permitted_uses
        type: array
        source: input
        description: "Non-empty subset of {UNDERWRITING, SETTLEMENT, DISPLAY}"
      - name: monthly_event_quota
        type: integer
        source: input
        description: "Data-event allowance per calendar month; 1 <= quota <= 100000"
      - name: fee_per_event_cents
        type: integer
        source: computed
        description: "0.04 USD in cents; per-event overage fee"
        default: 4
      - name: status
        type: enum
        source: system
        default: DRAFT
        constraints: "DRAFT | ACTIVE | SUSPENDED | TERMINATED"
      - name: activation_version
        type: integer
        source: computed
        description: "Monotonically increasing snapshot counter; every license activation captures a new methodology snapshot and increments this field"
      - name: version
        type: integer
        source: system
        description: "OCC guard field; bump on any agreement mutation"

  - name: Dispute
    parent: null
    common_fields: true
    fields:
      - name: offer_id
        type: string
        source: input
        description: "FK -> CashOffer.id; at most one OPEN dispute per offer"
      - name: reason_code
        type: enum
        source: input
        description: "Why the quoted value is contested"
        constraints: "WRONG_CONDITION | STALE_DATA | MISSING_OPTIONS"
      - name: status
        type: enum
        source: system
        default: OPEN
        constraints: "OPEN | RESOLVED_UPHELD | RESOLVED_ADJUSTED | WITHDRAWN"
      - name: credit_cents
        type: integer
        source: computed
        description: "Settlement credit minted on RESOLVED_ADJUSTED per calculations.dispute_settlement_credit; null until then"

  - name: Methodology
    parent: null
    common_fields: true
    fields:
      - name: version_label
        type: string
        source: input
        description: "Unique human label, e.g. v2026.09"
      - name: formula_hash
        type: string
        source: input
        description: "Opaque digest of the disclosed formulas"
      - name: published_at
        type: datetime
        source: system
        description: "Set on DRAFT -> PUBLISHED"
      - name: status
        type: enum
        source: system
        default: DRAFT
        constraints: "DRAFT | PUBLISHED | SUPERSEDED"

  - name: ConditionStandard
    parent: null
    common_fields: true
    fields:
      - name: tier
        type: enum
        source: input
        description: "Tier being defined; unique across standards"
        constraints: "EXCELLENT | GOOD | FAIR | POOR"
      - name: description
        type: string
        source: input
        description: "Consumer-facing definition text"
      - name: multiplier
        type: number
        source: input
        description: "Tier multiplier; must equal the fixed catalog value for the tier: EXCELLENT 1.10, GOOD 1.00, FAIR 0.85, POOR 0.70"

  - name: OptionPackage
    parent: null
    common_fields: true
    fields:
      - name: configuration_id
        type: string
        source: input
        description: "FK -> Configuration.id"
      - name: option_code
        type: string
        source: input
        description: "Unique per configuration"
      - name: credit_cents
        type: integer
        source: input
        description: "Option credit, 1..1000000 cents"
      - name: status
        type: enum
        source: system
        default: ACTIVE
        constraints: "ACTIVE | RETIRED"

  - name: ConsumerProfile
    parent: null
    common_fields: true
    fields:
      - name: email
        type: string
        source: input
        description: "Unique email; login identity for the Consumer role"
      - name: full_name
        type: string
        source: input
        description: "Consumer display name"

  - name: LicenseEvent
    parent: null
    common_fields: false
    fields:
      - name: agreement_id
        type: string
        source: input
        description: "FK -> LicenseAgreement.id"
      - name: event_type
        type: enum
        source: system
        description: "Which gated surface produced the event"
        constraints: "EDITION_READ | OFFER_CREATED"
      - name: occurred_at
        type: datetime
        source: system
        description: "Server clock time at record; immutable event log row"

  - name: DataCorrection
    parent: null
    common_fields: false
    fields:
      - name: batch_id
        type: string
        source: input
        description: "FK -> TransactionBatch.id; batch must be ACCEPTED"
      - name: corrected_price_cents
        type: integer
        source: input
        description: "Replacement price applied to the batch's items; 100..100000000"
      - name: delta_applied
        type: boolean
        source: system
        default: false
        description: "True once the correction has been incorporated into the latest PUBLISHED edition of affected series"

  - name: Snapshot
    parent: null
    common_fields: false
    fields:
      - name: agreement_id
        type: string
        source: system
        description: "FK -> LicenseAgreement.id"
      - name: methodology_version_label
        type: string
        source: system
        description: "Label of the PUBLISHED methodology captured at license activation"
      - name: snapshot_version
        type: integer
        source: system
        description: "Equals LicenseAgreement.activation_version at capture time"

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Source
    initial_state: PROBATION
    terminal_states: []
    transitions:
      - from: PROBATION
        to: ACTIVE
        trigger: "POST /sources/{id}/activate"
        actor: DataOps
        preconditions:
          - "source.status == PROBATION"
        side_effects:
          - "source.version += 1; source.updated_at refreshed"
      - from: PROBATION
        to: SUSPENDED
        trigger: "system: source.consecutive_rejections reaches 5"
        actor: system
        preconditions:
          - "source.consecutive_rejections >= 5"
        side_effects:
          - "source.version += 1"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system: source.consecutive_rejections reaches 5"
        actor: system
        preconditions:
          - "source.consecutive_rejections >= 5"
        side_effects:
          - "source.version += 1"
      - from: SUSPENDED
        to: PROBATION
        trigger: "POST /sources/{id}/reinstate"
        actor: DataOps
        preconditions:
          - "source.status == SUSPENDED"
        side_effects:
          - "source.consecutive_rejections := 0"
          - "source.version += 1"

  - entity: TransactionBatch
    initial_state: RECEIVED
    terminal_states: [ACCEPTED, REJECTED]
    transitions:
      - from: RECEIVED
        to: VALIDATED
        trigger: "POST /batches/{id}/validate"
        actor: DataOps
        preconditions:
          - "batch.status == RECEIVED"
        side_effects:
          - "batch.version += 1"
      - from: RECEIVED
        to: REJECTED
        trigger: "POST /batches/{id}/reject"
        actor: DataOps
        preconditions:
          - "batch.status == RECEIVED"
        side_effects:
          - "source := batch.source_id; source.consecutive_rejections += 1"
          - "if source.consecutive_rejections >= 5 then source.status := SUSPENDED (Source state machine)"
          - "batch.version += 1"
      - from: VALIDATED
        to: ACCEPTED
        trigger: "POST /batches/{id}/accept"
        actor: DataOps
        preconditions:
          - "batch.status == VALIDATED"
        side_effects:
          - "batch.accepted_count := len(batch.items)"
          - "batch.version += 1"
          - "source := batch.source_id; source.consecutive_rejections := 0"
          - "for each ValuationSeries s with s.status IN {ACTIVE, DRAFT} and s.region_id == batch item region and s.configuration_id == batch item configuration: recompute s.confidence_score per calculations.confidence_score; if s.confidence_score < 0.25 then s.status := SUSPENDED"

  - entity: ValuationSeries
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /valuation-series/{id}/activate"
        actor: ValuationAdmin
        preconditions:
          - "series.status == DRAFT"
        side_effects:
          - "series.version += 1"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system: confidence_score < 0.25 after a batch accept or data correction"
        actor: system
        preconditions:
          - "series.confidence_score < 0.25"
        side_effects:
          - "series.version += 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "system: confidence_score >= 0.25 after a subsequent batch accept or data correction"
        actor: system
        preconditions:
          - "series.confidence_score >= 0.25"
        side_effects:
          - "series.version += 1"
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "POST /valuation-series with the same (configuration_id, region_id) pair"
        actor: ValuationAdmin
        preconditions:
          - "new series creation succeeds with expected_version OCC"
        side_effects:
          - "old series' editions with status == PENDING are set to WITHDRAWN"
          - "old series.status := SUPERSEDED; old series.version += 1"

  - entity: ValuationEdition
    initial_state: PENDING
    terminal_states: [WITHDRAWN]
    transitions:
      - from: PENDING
        to: PUBLISHED
        trigger: "POST /valuation-editions/{id}/publish"
        actor: ValuationAdmin
        preconditions:
          - "edition.status == PENDING"
          - "series := edition.series_id; series.status == ACTIVE"
          - "series.confidence_score >= 0.25"
          - "effective_at >= series.effective_from; first published edition of the series must satisfy effective_at == series.effective_from"
          - "no other PUBLISHED edition of this series has effective_at within 7 days (cadence=WEEKLY)"
          - "no ACTIVE or PENDING dispute references an offer built on this edition"
        side_effects:
          - "freeze reference_price_cents, trade_in_cents, private_party_cents, retail_cents"
          - "edition.published_at := server clock now"
          - "edition.version += 1"
      - from: PUBLISHED
        to: WITHDRAWN
        trigger: "POST /valuation-editions/{id}/withdraw"
        actor: ValuationAdmin
        preconditions:
          - "edition.status == PUBLISHED"
          - "every CashOffer with offer.edition_id == edition.id and offer.status IN {QUOTED, INSPECTED} must be in a terminal offer state"
        side_effects:
          - "each offer on this edition with status QUOTED transitions QUOTED -> VOID"
          - "each offer on this edition with status REDEEMED stays REDEEMED but its funding Source's consecutive_rejections is unchanged; no credit movement occurs here (credits are minted via disputes)"
          - "edition.version += 1"
      - from: PENDING
        to: WITHDRAWN
        trigger: "POST /valuation-editions/{id}/withdraw"
        actor: ValuationAdmin
        preconditions:
          - "edition.status == PENDING"
        side_effects:
          - "edition.version += 1"

  - entity: MarketShift
    initial_state: DRAFT
    terminal_states: [RESCINDED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /market-shifts/{id}/activate"
        actor: ValuationAdmin
        preconditions:
          - "shift.status == DRAFT"
          - "shift.effective_at >= server clock now (ERR_SHIFT_IN_PAST otherwise)"
          - "no other MarketShift with status == ACTIVE occupies the same scope bucket — two shifts share a bucket when both are global (region_id null, segment null), both name the same region_id with segment null, both name the same segment with region_id null, or both name the same (region_id, segment) pair"
        side_effects:
          - "shift.version += 1"
      - from: ACTIVE
        to: RESCINDED
        trigger: "POST /market-shifts/{id}/rescind"
        actor: ValuationAdmin
        preconditions:
          - "shift.status == ACTIVE"
        side_effects:
          - "shift.version += 1"

  - entity: CashOffer
    initial_state: QUOTED
    terminal_states: [REDEEMED, EXPIRED, VOID]
    transitions:
      - from: QUOTED
        to: INSPECTED
        trigger: "POST /cash-offers/{id}/inspect"
        actor: DealerPartner
        preconditions:
          - "offer.status == QUOTED"
          - "server clock now <= offer.expires_at"
          - "request inspected_condition_tier is one of EXCELLENT | GOOD | FAIR | POOR"
        side_effects:
          - "recompute offer.final_amount_cents with calculations.offer_amount variant inspected using inspected_condition_tier"
          - "cap: final_amount_cents >= round_half_up(offer.offer_amount_cents * 0.90)"
          - "offer.version += 1"
      - from: INSPECTED
        to: REDEEMED
        trigger: "POST /cash-offers/{id}/redeem"
        actor: DealerPartner
        preconditions:
          - "offer.status == INSPECTED"
          - "server clock now <= offer.expires_at"
          - "funding Source (offer.funding_dealer_id) status == ACTIVE"
        side_effects:
          - "record redemption timestamp"
          - "offer.version += 1"
      - from: QUOTED
        to: EXPIRED
        trigger: "system clock passes offer.expires_at while status == QUOTED"
        actor: system
        preconditions:
          - "server clock now > offer.expires_at"
        side_effects:
          - "offer.version += 1"
      - from: INSPECTED
        to: EXPIRED
        trigger: "system clock passes offer.expires_at while status == INSPECTED"
        actor: system
        preconditions:
          - "server clock now > offer.expires_at"
        side_effects:
          - "offer.version += 1"
      - from: QUOTED
        to: VOID
        trigger: "POST /cash-offers/{id}/void OR cascade: offer.edition_id transitions PUBLISHED -> WITHDRAWN"
        actor: DealerPartner
        preconditions:
          - "offer.status == QUOTED"
        side_effects:
          - "offer.version += 1"

  - entity: LicenseAgreement
    initial_state: DRAFT
    terminal_states: [TERMINATED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /license-agreements/{id}/activate"
        actor: ValuationAdmin
        preconditions:
          - "agreement.status == DRAFT"
          - "a Methodology with status == PUBLISHED exists"
        side_effects:
          - "capture Snapshot: snapshot.methodology_version_label := latest PUBLISHED methodology.version_label"
          - "agreement.activation_version += 1"
          - "agreement.version += 1"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /license-agreements/{id}/suspend"
        actor: ValuationAdmin
        preconditions:
          - "agreement.status == ACTIVE"
        side_effects:
          - "agreement.version += 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /license-agreements/{id}/reactivate"
        actor: ValuationAdmin
        preconditions:
          - "agreement.status == SUSPENDED"
          - "a Methodology with status == PUBLISHED exists"
        side_effects:
          - "capture Snapshot (methodology re-pin on resume)"
          - "agreement.activation_version += 1"
          - "agreement.version += 1"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /license-agreements/{id}/terminate"
        actor: ValuationAdmin
        preconditions:
          - "agreement.status == ACTIVE"
        side_effects:
          - "agreement.version += 1"
      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /license-agreements/{id}/terminate"
        actor: ValuationAdmin
        preconditions:
          - "agreement.status == SUSPENDED"
        side_effects:
          - "agreement.version += 1"

  - entity: Dispute
    initial_state: OPEN
    terminal_states: [RESOLVED_UPHELD, RESOLVED_ADJUSTED, WITHDRAWN]
    transitions:
      - from: OPEN
        to: RESOLVED_UPHELD
        trigger: "POST /disputes/{id}/resolve with resolution=UPHELD"
        actor: ValuationAdmin
        preconditions:
          - "dispute.status == OPEN"
        side_effects:
          - "dispute.version += 1"
      - from: OPEN
        to: RESOLVED_ADJUSTED
        trigger: "POST /disputes/{id}/resolve with resolution=ADJUSTED"
        actor: ValuationAdmin
        preconditions:
          - "dispute.status == OPEN"
          - "offer := dispute.offer_id; offer.status == REDEEMED"
        side_effects:
          - "mint settlement credit = min(25000, round_half_up(offer.edition.retail_cents * 0.02)) recorded on the dispute response as credit_cents"
          - "dispute.version += 1"
      - from: OPEN
        to: WITHDRAWN
        trigger: "POST /disputes/{id}/withdraw"
        actor: Consumer
        preconditions:
          - "dispute.status == OPEN"
          - "acting consumer owns the offer referenced by dispute.offer_id"
        side_effects:
          - "dispute.version += 1"

  - entity: Methodology
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /methodologies/{id}/publish"
        actor: ValuationAdmin
        preconditions:
          - "methodology.status == DRAFT"
        side_effects:
          - "any other Methodology with status == PUBLISHED transitions PUBLISHED -> SUPERSEDED"
          - "methodology.published_at := server clock now"
          - "methodology.version += 1"

  - entity: Region
    initial_state: ACTIVE
    terminal_states: [ARCHIVED]
    transitions:
      - from: ACTIVE
        to: ARCHIVED
        trigger: "PATCH /regions/{id} with status=ARCHIVED"
        actor: ValuationAdmin
        preconditions:
          - "region.status == ACTIVE"
          - "no Source with source.region_id == region.id and source.status IN {PROBATION, ACTIVE}"
        side_effects:
          - "region.version += 1"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: series-create-supersede-stale-version
    parent_entity: ValuationSeries
    write_endpoint: "POST /valuation-series"
    occ_field: "expected_version"
    description: |
      Creating a replacement ValuationSeries for a (configuration_id, region_id)
      pair that already has an ACTIVE series requires the caller to present the
      version of that ACTIVE series it last observed; when the caller's
      expected_version is older than the current ValuationSeries.version, the
      create is rejected with ERR_STALE_VERSION. The supersede mutation that
      would have raced is reduced to a sequential stale-version check.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: agreement-amend-stale-version
    parent_entity: LicenseAgreement
    write_endpoint: "PATCH /license-agreements/{id}"
    occ_field: "expected_version"
    description: |
      Amending a LicenseAgreement (permitted_uses or monthly_event_quota) is
      rejected with ERR_STALE_VERSION when the caller's expected_version is
      older than the agreement's current version. This captures the case where
      a prior amendment already advanced the agreement and the current caller's
      view of the license terms is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: trailing_market_reference
    trigger: "ValuationEdition creation (POST /valuation-editions) and recompute on DataCorrection"
    algorithm: aggregation
    formula: |
      window := accepted batch items for (configuration_id, region_id) of the
      series with sale_date within the last 90 days (inclusive) relative to the
      server clock at edition creation;
      weight(item) := 2 when sale_date within the last 30 days else 1;
      reference_price_cents := round_half_up( sum(sold_price_cents * weight) / sum(weight) );
      if window is empty -> edition creation is rejected (ERR_INSUFFICIENT_DATA).
      After the base reference is computed, ACTIVE MarketShift blending applies
      (see market_shift_blending).
    input_set: "TransactionBatch items whose batch.status == ACCEPTED and whose (configuration_id, region_id) matches the series; sale_date within [now-90d, now]"
    constants:
      WEIGHT_RECENT: 2
      WEIGHT_OLD: 1
      RECENT_DAYS: 30
      WINDOW_DAYS: 90
    precision: "integer cents, round_half_up"
    variants:
      - name: trailing_only
        when: "no ACTIVE MarketShift matches the series' region and segment at edition effective_at"
        difference: "reference_price_cents is the raw weighted average"
      - name: blended
        when: "at least one ACTIVE MarketShift matches"
        difference: "sum the pct_adjustment of matching ACTIVE shifts; reference := round_half_up(raw * (1 + sum)); sum is additive, not compounded"

  - name: tier_values
    trigger: "ValuationEdition publication; fields frozen at PUBLISHED"
    algorithm: threshold
    formula: |
      trade_in_cents       := round_half_up(reference_price_cents * 0.87)
      private_party_cents  := round_half_up(reference_price_cents * 0.95)
      retail_cents         := round_half_up(reference_price_cents * 1.08)
    input_set: "reference_price_cents of the edition"
    constants:
      TRADE_IN_MULT: 0.87
      PRIVATE_PARTY_MULT: 0.95
      RETAIL_MULT: 1.08
    precision: "integer cents, round_half_up"

  - name: mileage_option_adjustment
    trigger: "CashOffer creation (self-assessed quote) and inspection (re-price)"
    algorithm: constraint_propagation
    formula: |
      excess := max(0, mileage - age_years * configuration.annual_expected_miles)
      if excess <= 10000:
          deduction := excess * 0.15
      else:
          deduction := 10000 * 0.15 + (excess - 10000) * 0.10
      options_credit := min( sum(OptionPackage.credit_cents for option_ids),
                             round_half_up(edition.reference_price_cents * 0.08) )
      condition_mult := ConditionStandard.multiplier for the selected tier
      raw := private_party_cents * condition_mult
      adjusted := max( round_half_up(raw) - deduction + options_credit,
                       round_half_up(edition.reference_price_cents * 0.20) )
    input_set: "edition being quoted, offer.mileage, offer.age_years, offer.option_ids, selected condition tier"
    constants:
      FIRST_SLAB: 10000
      FIRST_RATE: 0.15
      SECOND_RATE: 0.10
      OPTION_CAP_PCT: 0.08
      FLOOR_PCT: 0.20
    precision: "integer cents, round_half_up"

  - name: offer_amount
    trigger: "CashOffer creation and CashOffer inspection"
    algorithm: threshold
    formula: |
      variant self_assessed:
          base := private_party_cents * multiplier(declared_condition_tier)
          apply mileage_option_adjustment; freeze offer_amount_cents at creation
      variant inspected:
          base := private_party_cents * multiplier(inspected_condition_tier)
          apply mileage_option_adjustment;
          final_amount_cents := max(result, round_half_up(offer.offer_amount_cents * 0.90))
    input_set: "edition pinned on the offer, offer.mileage, offer.age_years, offer.option_ids, tier"
    constants:
      INSPECT_CAP_FLOOR: 0.90
    precision: "integer cents, round_half_up"
    variants:
      - name: self_assessed
        when: "POST /cash-offers"
        difference: "tier comes from the consumer self-assessment"
      - name: inspected
        when: "POST /cash-offers/{id}/inspect"
        difference: "tier comes from the dealer inspection; result capped below at 90% of the frozen self-assessed quote"

  - name: confidence_score
    trigger: "after each TransactionBatch acceptance, after each DataCorrection, and on ValuationSeries activation"
    algorithm: weighted_scoring
    formula: |
      n := count of ACCEPTED batch items for this (configuration_id, region_id) in the last 90 days
      source_diversity := count of distinct source_types contributing those items / 3
      recency := fraction of those items with sale_date within the last 30 days
      confidence_score := 0.5 * min(1, n / 30) + 0.3 * source_diversity + 0.2 * recency
      round to 4 decimal places, round_half_up
    input_set: "ACCEPTED batch items matching the series in the trailing 90-day window"
    constants:
      W_VOLUME: 0.5
      W_DIVERSITY: 0.3
      W_RECENCY: 0.2
      VOLUME_SATURATION: 30
      PUBLISH_GATE: 0.25
    precision: "4 decimal places, round_half_up"

  - name: market_shift_blending
    trigger: "edition creation; blended on top of trailing_market_reference"
    algorithm: aggregation
    formula: |
      matching := MarketShift with status == ACTIVE AND effective_at <= edition.effective_at
                  AND (region_id IS NULL OR region_id == series.region_id)
                  AND (segment IS NULL OR segment == configuration.segment)
      blended := round_half_up(raw_reference * (1 + sum(pct_adjustment of matching)))
    input_set: "ACTIVE MarketShift rows matching region+segment scope"
    constants: {}
    precision: "integer cents, round_half_up"

  - name: license_fee
    trigger: "each LicenseEvent recorded against an ACTIVE LicenseAgreement"
    algorithm: tiered_pricing
    formula: |
      count := number of LicenseEvents for the agreement in the current calendar month (server clock)
      the first 1000 events per calendar month are free;
      each event beyond 1000 costs fee_per_event_cents;
      recording the event whose count exceeds monthly_event_quota is REJECTED with ERR_QUOTA_EXCEEDED and no event row is written
    input_set: "LicenseEvent rows of the agreement for the current calendar month"
    constants:
      FREE_TIER: 1000
    precision: "integer cents"

  - name: dispute_settlement_credit
    trigger: "Dispute resolution with resolution=ADJUSTED"
    algorithm: waterfall_allocation
    formula: |
      credit_cents := min(25000, round_half_up(disputed offer's edition.retail_cents * 0.02))
      the credit is recorded on the dispute response; a single dispute yields at most one credit
    input_set: "dispute.offer_id -> CashOffer -> ValuationEdition.retail_cents"
    constants:
      MAX_CREDIT: 25000
      PCT: 0.02
    precision: "integer cents, round_half_up"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and a declared role; X-User-ID present for entity_backed roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "acting role is authorized for the endpoint per §1.7"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "path and body foreign keys resolve (region_id, source_id, configuration_id, series_id, edition_id, offer_id, batch_id, agreement_id, option_ids)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 4
    category: existence
    check: "idempotency-key replay (external_key on sources/configurations/valuation-series; submission_ref on batches) returns the existing resource instead of creating a duplicate"
    error_id: ERR_DUPLICATE_KEY
    http_status: 409
    applies_to: "POST /sources, POST /configurations, POST /valuation-series, POST /batches"
  - priority: 5
    category: state
    check: "target resource is in a state that permits the transition (per §1.2 from-states and preconditions); also: POST /batches requires the referenced source.status != SUSPENDED, and POST /cash-offers/{id}/redeem requires the funding source status == ACTIVE"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints, POST /batches, POST /cash-offers/{id}/redeem"
  - priority: 6
    category: state
    check: "LicenseAgreement status == ACTIVE before any gated data surface (edition read for licensee, cash offer creation as licensee flow)"
    error_id: ERR_LICENSE_INACTIVE
    http_status: 409
    applies_to: "GET /valuation-editions/{id} (Licensee), POST /cash-offers"
  - priority: 7
    category: business_referential
    check: "offer.funding_dealer_id resolves to a Source with source_type == DEALER"
    error_id: ERR_INVALID_FUNDING_SOURCE
    http_status: 422
    applies_to: "POST /cash-offers"
  - priority: 8
    category: business_safety
    check: "series.confidence_score >= 0.25 before ValuationEdition publish"
    error_id: ERR_LOW_CONFIDENCE
    http_status: 422
    applies_to: "POST /valuation-editions/{id}/publish"
  - priority: 9
    category: business_temporal
    check: "edition.effective_at respects the weekly cadence: no other PUBLISHED edition of the same series with |effective_at delta| < 7 days; first edition effective_at == series.effective_from"
    error_id: ERR_CADENCE_VIOLATION
    http_status: 422
    applies_to: "POST /valuation-editions/{id}/publish"
  - priority: 10
    category: business_temporal
    check: "server clock now <= offer.expires_at for inspect/redeem"
    error_id: ERR_OFFER_EXPIRED
    http_status: 422
    applies_to: "POST /cash-offers/{id}/inspect, POST /cash-offers/{id}/redeem"
  - priority: 11
    category: business_fiscal
    check: "monthly LicenseEvent count < monthly_event_quota before recording a billable event; recording the (quota+1)-th event fails"
    error_id: ERR_QUOTA_EXCEEDED
    http_status: 422
    applies_to: "GET /valuation-editions/{id} (Licensee), POST /cash-offers (licensee flow)"
  - priority: 12
    category: business_constraint
    check: "requested use is within agreement.permitted_uses (UNDERWRITING for offer creation, SETTLEMENT or DISPLAY for edition reads per the licensee's declared purpose)"
    error_id: ERR_USE_NOT_PERMITTED
    http_status: 403
    applies_to: "GET /valuation-editions/{id} (Licensee), POST /cash-offers"
  - priority: 13
    category: business_constraint
    check: "region status == ACTIVE when creating sources, series, market shifts, or batch items targeting it"
    error_id: ERR_REGION_ARCHIVED
    http_status: 422
    applies_to: "POST /sources, POST /valuation-series, POST /market-shifts, POST /batches"
  - priority: 14
    category: business_constraint
    check: "input shape: enum membership, numeric ranges, items array 1..500, pct_adjustment within [-0.50, 0.50], year within [1990, 2030]"
    error_id: ERR_INVALID_INPUT
    http_status: 400
    applies_to: "all mutating endpoints"
  - priority: 15
    category: business_constraint
    check: "OCC: expected_version equals the current parent entity version on guarded writes"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /valuation-series, PATCH /license-agreements/{id}"
  - priority: 16
    category: business_referential
    check: "open-dispute uniqueness: at most one Dispute with status == OPEN per CashOffer"
    error_id: ERR_DUPLICATE_DISPUTE
    http_status: 409
    applies_to: "POST /disputes"
  - priority: 17
    category: business_temporal
    check: "MarketShift.effective_at is not in the past relative to server clock at activation"
    error_id: ERR_SHIFT_IN_PAST
    http_status: 422
    applies_to: "POST /market-shifts/{id}/activate"
  - priority: 18
    category: business_safety
    check: "withdrawal guard: edition has no non-terminal CashOffer attached before withdrawal"
    error_id: ERR_EDITION_HAS_OPEN_OFFERS
    http_status: 422
    applies_to: "POST /valuation-editions/{id}/withdraw"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint. Sets the server logical clock. Default on startup is 2026-09-01T00:00:00Z; before any set_current_utc call the logical clock reads exactly this default and MUST NOT fall back to real wall-clock time."
    roles: [ValuationAdmin, DataOps]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects:
      - "all CashOffer with status IN {QUOTED, INSPECTED} and expires_at < new clock value transition to EXPIRED"
      - "ValuationSeries confidence_score values whose 90-day window content changes are NOT recomputed until the next batch accept or data correction"

  - method: POST
    path: "/regions"
    description: "Create a region"
    roles: [ValuationAdmin]
    code: 201
    input: [region_code, name]
    output: Region
    side_effects: []
  - method: GET
    path: "/regions"
    description: "List regions (paginated)"
    roles: [ValuationAdmin, DataOps, DealerPartner, Consumer, Licensee]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Region[]
    side_effects: []
  - method: GET
    path: "/regions/{id}"
    description: "Fetch one region"
    roles: [ValuationAdmin, DataOps, DealerPartner, Consumer, Licensee]
    code: 200
    input: []
    output: Region
    side_effects: []
  - method: PATCH
    path: "/regions/{id}"
    description: "Archive a region (status=ARCHIVED); idempotent when already ARCHIVED"
    roles: [ValuationAdmin]
    code: 200
    input: [status]
    output: Region
    side_effects:
      - "guard: no Source in PROBATION or ACTIVE references the region"

  - method: POST
    path: "/sources"
    description: "Register a transaction source (dealer, auction, lender); idempotent on external_key"
    roles: [DataOps]
    code: 201
    input: [source_type, region_id, name, external_key]
    output: Source
    side_effects: []
  - method: GET
    path: "/sources"
    description: "List sources; filterable by region_id and status"
    roles: [DataOps, ValuationAdmin]
    code: 200
    input: ["region_id?", "status?", "limit?", "offset?"]
    output: Source[]
    side_effects: []
  - method: GET
    path: "/sources/{id}"
    description: "Fetch one source"
    roles: [DataOps, ValuationAdmin, DealerPartner, Licensee]
    code: 200
    input: []
    output: Source
    side_effects: []
  - method: POST
    path: "/sources/{id}/activate"
    description: "PROBATION -> ACTIVE"
    roles: [DataOps]
    code: 200
    input: []
    output: Source
    side_effects:
      - "increments Source.version by 1"
  - method: POST
    path: "/sources/{id}/reinstate"
    description: "SUSPENDED -> PROBATION, resets consecutive_rejections"
    roles: [DataOps]
    code: 200
    input: []
    output: Source
    side_effects:
      - "consecutive_rejections := 0"
      - "increments Source.version by 1"

  - method: POST
    path: "/configurations"
    description: "Create a vehicle configuration; idempotent on external_key"
    roles: [ValuationAdmin]
    code: 201
    input: [make, model, year, trim, segment, "annual_expected_miles?", external_key]
    output: Configuration
    side_effects: []
  - method: GET
    path: "/configurations"
    description: "List configurations"
    roles: [ValuationAdmin, DataOps, DealerPartner, Consumer, Licensee]
    code: 200
    input: ["segment?", "status?", "limit?", "offset?"]
    output: Configuration[]
    side_effects: []
  - method: GET
    path: "/configurations/{id}"
    description: "Fetch one configuration"
    roles: [ValuationAdmin, DataOps, DealerPartner, Consumer, Licensee]
    code: 200
    input: []
    output: Configuration
    side_effects: []
  - method: PATCH
    path: "/configurations/{id}"
    description: "Mark configuration DISCONTINUED (status field)"
    roles: [ValuationAdmin]
    code: 200
    input: [status]
    output: Configuration
    side_effects: []

  - method: POST
    path: "/option-packages"
    description: "Create an option package for a configuration"
    roles: [ValuationAdmin]
    code: 201
    input: [configuration_id, option_code, credit_cents]
    output: OptionPackage
    side_effects: []
  - method: GET
    path: "/option-packages"
    description: "List option packages; filter by configuration_id"
    roles: [ValuationAdmin, DataOps, DealerPartner, Consumer, Licensee]
    code: 200
    input: ["configuration_id?", "limit?", "offset?"]
    output: OptionPackage[]
    side_effects: []
  - method: POST
    path: "/configurations/{id}/option-packages"
    description: "Nested creation of an option package under a configuration (same semantics as POST /option-packages)"
    roles: [ValuationAdmin]
    code: 201
    input: [option_code, credit_cents]
    output: OptionPackage
    side_effects: []
  - method: GET
    path: "/configurations/{id}/option-packages"
    description: "Sub-resource list of option packages for one configuration"
    roles: [ValuationAdmin, DataOps, DealerPartner, Consumer, Licensee]
    code: 200
    input: ["limit?", "offset?"]
    output: OptionPackage[]
    side_effects: []

  - method: POST
    path: "/batches"
    description: "Submit a transaction batch; idempotent on submission_ref. Source must not be SUSPENDED (ERR_INVALID_STATE)."
    roles: [DataOps]
    code: 201
    input: [source_id, submission_ref, items]
    output: TransactionBatch
    side_effects: []
  - method: GET
    path: "/batches"
    description: "List batches; filter by source_id and status"
    roles: [DataOps, ValuationAdmin]
    code: 200
    input: ["source_id?", "status?", "limit?", "offset?"]
    output: TransactionBatch[]
    side_effects: []
  - method: GET
    path: "/batches/{id}"
    description: "Fetch one batch"
    roles: [DataOps, ValuationAdmin]
    code: 200
    input: []
    output: TransactionBatch
    side_effects: []
  - method: POST
    path: "/batches/{id}/validate"
    description: "RECEIVED -> VALIDATED"
    roles: [DataOps]
    code: 200
    input: []
    output: TransactionBatch
    side_effects:
      - "increments TransactionBatch.version by 1"
  - method: POST
    path: "/batches/{id}/accept"
    description: "VALIDATED -> ACCEPTED; ingests items, recomputes affected series confidence, resets source consecutive_rejections"
    roles: [DataOps]
    code: 200
    input: []
    output: TransactionBatch
    side_effects:
      - "accepted_count := len(items)"
      - "source.consecutive_rejections := 0"
      - "recompute confidence_score for affected ValuationSeries; auto-suspend when < 0.25, auto-reactivate when >= 0.25"
      - "increments TransactionBatch.version by 1"
  - method: POST
    path: "/batches/{id}/reject"
    description: "RECEIVED -> REJECTED; bumps source.consecutive_rejections, may auto-suspend source at 5"
    roles: [DataOps]
    code: 200
    input: []
    output: TransactionBatch
    side_effects:
      - "source.consecutive_rejections += 1; if reaches 5 then source.status := SUSPENDED"
      - "increments TransactionBatch.version by 1"

  - method: GET
    path: "/batches/{id}/corrections"
    description: "Sub-resource list of corrections applied to one batch"
    roles: [DataOps, ValuationAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: DataCorrection[]
    side_effects: []
  - method: POST
    path: "/corrections"
    description: "Apply a price correction to an ACCEPTED batch; recomputes the latest PUBLISHED edition of affected series and recomputes confidence"
    roles: [DataOps]
    code: 201
    input: [batch_id, corrected_price_cents]
    output: DataCorrection
    side_effects:
      - "delta_applied := true after recomputation"
      - "latest PUBLISHED edition of the affected series has reference_price_cents and tier values recomputed in place (historical retention: earlier editions are NOT modified)"
      - "recompute confidence_score for the affected ValuationSeries"

  - method: POST
    path: "/valuation-series"
    description: "Create a valuation series for (configuration_id, region_id). When an ACTIVE series exists for the pair, the request supersedes it; OCC on that ACTIVE series' version via expected_version."
    roles: [ValuationAdmin]
    code: 201
    input: [configuration_id, region_id, effective_from, cadence, external_key, "expected_version?"]
    output: ValuationSeries
    side_effects:
      - "when superseding: old series.status := SUPERSEDED and its PENDING editions -> WITHDRAWN; increments old ValuationSeries.version by 1"
      - "new series starts in DRAFT"
  - method: GET
    path: "/valuation-series"
    description: "List series; filter by configuration_id, region_id, status"
    roles: [ValuationAdmin, DataOps, DealerPartner, Consumer, Licensee]
    code: 200
    input: ["configuration_id?", "region_id?", "status?", "limit?", "offset?"]
    output: ValuationSeries[]
    side_effects: []
  - method: GET
    path: "/valuation-series/{id}"
    description: "Fetch one series including confidence_score"
    roles: [ValuationAdmin, DataOps, DealerPartner, Consumer, Licensee]
    code: 200
    input: []
    output: ValuationSeries
    side_effects: []
  - method: POST
    path: "/valuation-series/{id}/activate"
    description: "DRAFT -> ACTIVE"
    roles: [ValuationAdmin]
    code: 200
    input: []
    output: ValuationSeries
    side_effects:
      - "increments ValuationSeries.version by 1"

  - method: POST
    path: "/valuation-editions"
    description: "Create an edition (PENDING) computing reference price + tier values from trailing data and ACTIVE shifts"
    roles: [ValuationAdmin]
    code: 201
    input: [series_id, effective_at]
    output: ValuationEdition
    side_effects:
      - "compute reference_price_cents per calculations.trailing_market_reference + market_shift_blending"
      - "compute trade_in_cents, private_party_cents, retail_cents"
  - method: GET
    path: "/valuation-editions"
    description: "List editions; filter by series_id, status; historical retention: WITHDRAWN editions remain listed"
    roles: [ValuationAdmin, DataOps, DealerPartner, Consumer, Licensee]
    code: 200
    input: ["series_id?", "status?", "limit?", "offset?"]
    output: ValuationEdition[]
    side_effects: []
  - method: GET
    path: "/valuation-editions/{id}"
    description: "Fetch one edition. For Licensee role, records a LicenseEvent (EDITION_READ) and enforces license status, permitted use, and quota."
    roles: [ValuationAdmin, DataOps, DealerPartner, Consumer, Licensee]
    code: 200
    input: ["purpose?"]
    output: ValuationEdition
    side_effects:
      - "when role == Licensee: record LicenseEvent(EDITION_READ) under the caller's agreement; apply license_fee accounting; reject when quota exceeded or use not permitted"
  - method: POST
    path: "/valuation-editions/{id}/publish"
    description: "PENDING -> PUBLISHED; freezes values; enforces confidence gate and weekly cadence"
    roles: [ValuationAdmin]
    code: 200
    input: []
    output: ValuationEdition
    side_effects:
      - "published_at := server clock"
      - "increments ValuationEdition.version by 1"
  - method: POST
    path: "/valuation-editions/{id}/withdraw"
    description: "PENDING|PUBLISHED -> WITHDRAWN; cascades open offers to VOID"
    roles: [ValuationAdmin]
    code: 200
    input: []
    output: ValuationEdition
    side_effects:
      - "CashOffers on this edition with status QUOTED -> VOID"
      - "increments ValuationEdition.version by 1"

  - method: POST
    path: "/market-shifts"
    description: "Create a market shift (DRAFT)"
    roles: [ValuationAdmin]
    code: 201
    input: ["region_id?", "segment?", effective_at, pct_adjustment]
    output: MarketShift
    side_effects: []
  - method: GET
    path: "/market-shifts"
    description: "List shifts; filter by region_id, segment, status"
    roles: [ValuationAdmin, DataOps]
    code: 200
    input: ["region_id?", "segment?", "status?", "limit?", "offset?"]
    output: MarketShift[]
    side_effects: []
  - method: GET
    path: "/regions/{id}/market-shifts"
    description: "Sub-resource list of shifts scoped to one region"
    roles: [ValuationAdmin, DataOps]
    code: 200
    input: ["limit?", "offset?"]
    output: MarketShift[]
    side_effects: []
  - method: POST
    path: "/market-shifts/{id}/activate"
    description: "DRAFT -> ACTIVE; effective_at must not be in the past"
    roles: [ValuationAdmin]
    code: 200
    input: []
    output: MarketShift
    side_effects:
      - "increments MarketShift.version by 1"
  - method: POST
    path: "/market-shifts/{id}/rescind"
    description: "ACTIVE -> RESCINDED"
    roles: [ValuationAdmin]
    code: 200
    input: []
    output: MarketShift
    side_effects:
      - "increments MarketShift.version by 1"

  - method: POST
    path: "/consumer-profiles"
    description: "Register a consumer profile"
    roles: [Consumer]
    code: 201
    input: [email, full_name]
    output: ConsumerProfile
    side_effects: []
  - method: GET
    path: "/consumer-profiles"
    description: "List consumer profiles (reverse lookup)"
    roles: [ValuationAdmin, DealerPartner]
    code: 200
    input: ["limit?", "offset?"]
    output: ConsumerProfile[]
    side_effects: []
  - method: GET
    path: "/consumer-profiles/{id}"
    description: "Fetch own consumer profile"
    roles: [Consumer, ValuationAdmin]
    code: 200
    input: []
    output: ConsumerProfile
    side_effects: []

  - method: POST
    path: "/cash-offers"
    description: "Create an instant cash offer from a PUBLISHED edition; records LicenseEvent(OFFER_CREATED) when a licensee flow performs it"
    roles: [DealerPartner, Consumer, Licensee]
    code: 201
    input: [edition_id, funding_dealer_id, consumer_id, mileage, age_years, declared_condition_tier, option_ids, "purpose?"]
    output: CashOffer
    side_effects:
      - "offer_amount_cents computed per calculations.offer_amount variant self_assessed and frozen"
      - "expires_at := edition.published_at + 7 days"
      - "when role == Licensee: record LicenseEvent(OFFER_CREATED) under the caller's agreement; quota and permitted-use enforced"
  - method: GET
    path: "/cash-offers"
    description: "List offers; filter by edition_id, funding_dealer_id, consumer_id, status"
    roles: [ValuationAdmin, DataOps, DealerPartner, Consumer, Licensee]
    code: 200
    input: ["edition_id?", "funding_dealer_id?", "consumer_id?", "status?", "limit?", "offset?"]
    output: CashOffer[]
    side_effects: []
  - method: GET
    path: "/cash-offers/{id}"
    description: "Fetch one offer"
    roles: [ValuationAdmin, DataOps, DealerPartner, Consumer, Licensee]
    code: 200
    input: []
    output: CashOffer
    side_effects: []
  - method: GET
    path: "/cash-offers/{id}/disputes"
    description: "List disputes for one offer (0 or 1 OPEN at any time; resolved/withdrawn disputes remain listed)"
    roles: [ValuationAdmin, Consumer, DealerPartner]
    code: 200
    input: ["limit?", "offset?"]
    output: Dispute[]
    side_effects: []
  - method: POST
    path: "/cash-offers/{id}/inspect"
    description: "QUOTED -> INSPECTED; re-prices at inspected tier with 90% cap"
    roles: [DealerPartner]
    code: 200
    input: [inspected_condition_tier]
    output: CashOffer
    side_effects:
      - "final_amount_cents set per calculations.offer_amount variant inspected"
      - "increments CashOffer.version by 1"
  - method: POST
    path: "/cash-offers/{id}/redeem"
    description: "INSPECTED -> REDEEMED; funding source must be ACTIVE"
    roles: [DealerPartner]
    code: 200
    input: []
    output: CashOffer
    side_effects:
      - "increments CashOffer.version by 1"
  - method: POST
    path: "/cash-offers/{id}/void"
    description: "QUOTED -> VOID (explicit)"
    roles: [DealerPartner, ValuationAdmin]
    code: 200
    input: []
    output: CashOffer
    side_effects:
      - "increments CashOffer.version by 1"

  - method: POST
    path: "/license-agreements"
    description: "Create a license agreement (DRAFT)"
    roles: [ValuationAdmin]
    code: 201
    input: [licensee_ref, permitted_uses, monthly_event_quota]
    output: LicenseAgreement
    side_effects: []
  - method: GET
    path: "/license-agreements"
    description: "List agreements"
    roles: [ValuationAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: LicenseAgreement[]
    side_effects: []
  - method: GET
    path: "/license-agreements/{id}"
    description: "Fetch one agreement"
    roles: [ValuationAdmin]
    code: 200
    input: []
    output: LicenseAgreement
    side_effects: []
  - method: PATCH
    path: "/license-agreements/{id}"
    description: "Amend permitted_uses and/or monthly_event_quota; OCC via expected_version"
    roles: [ValuationAdmin]
    code: 200
    input: ["permitted_uses?", "monthly_event_quota?", expected_version]
    output: LicenseAgreement
    side_effects:
      - "increments LicenseAgreement.version by 1"
  - method: POST
    path: "/license-agreements/{id}/activate"
    description: "DRAFT -> ACTIVE; captures methodology Snapshot"
    roles: [ValuationAdmin]
    code: 200
    input: []
    output: LicenseAgreement
    side_effects:
      - "create Snapshot row; activation_version += 1"
      - "increments LicenseAgreement.version by 1"
  - method: POST
    path: "/license-agreements/{id}/suspend"
    description: "ACTIVE -> SUSPENDED"
    roles: [ValuationAdmin]
    code: 200
    input: []
    output: LicenseAgreement
    side_effects:
      - "increments LicenseAgreement.version by 1"
  - method: POST
    path: "/license-agreements/{id}/reactivate"
    description: "SUSPENDED -> ACTIVE; captures a fresh methodology Snapshot"
    roles: [ValuationAdmin]
    code: 200
    input: []
    output: LicenseAgreement
    side_effects:
      - "create Snapshot row; activation_version += 1"
      - "increments LicenseAgreement.version by 1"
  - method: POST
    path: "/license-agreements/{id}/terminate"
    description: "ACTIVE|SUSPENDED -> TERMINATED"
    roles: [ValuationAdmin]
    code: 200
    input: []
    output: LicenseAgreement
    side_effects:
      - "increments LicenseAgreement.version by 1"
  - method: GET
    path: "/license-agreements/{id}/events"
    description: "List LicenseEvent rows for the agreement (billing audit)"
    roles: [ValuationAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: LicenseEvent[]
    side_effects: []
  - method: GET
    path: "/license-agreements/{id}/snapshots"
    description: "List methodology snapshots captured for the agreement"
    roles: [ValuationAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: Snapshot[]
    side_effects: []

  - method: POST
    path: "/methodologies"
    description: "Create a methodology disclosure draft"
    roles: [ValuationAdmin]
    code: 201
    input: [version_label, formula_hash]
    output: Methodology
    side_effects: []
  - method: GET
    path: "/methodologies"
    description: "List methodologies; filter by status"
    roles: [ValuationAdmin, DataOps, DealerPartner, Consumer, Licensee]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Methodology[]
    side_effects: []
  - method: POST
    path: "/methodologies/{id}/publish"
    description: "DRAFT -> PUBLISHED; supersedes any other PUBLISHED methodology"
    roles: [ValuationAdmin]
    code: 200
    input: []
    output: Methodology
    side_effects:
      - "prior PUBLISHED methodology -> SUPERSEDED"
      - "increments Methodology.version by 1"

  - method: POST
    path: "/condition-standards"
    description: "Define a condition tier standard (fixed catalog multipliers enforced)"
    roles: [ValuationAdmin]
    code: 201
    input: [tier, description, multiplier]
    output: ConditionStandard
    side_effects: []
  - method: GET
    path: "/condition-standards"
    description: "List the tier standards (consumer self-assessment reference)"
    roles: [ValuationAdmin, DataOps, DealerPartner, Consumer, Licensee]
    code: 200
    input: ["limit?", "offset?"]
    output: ConditionStandard[]
    side_effects: []

  - method: POST
    path: "/disputes"
    description: "Open a dispute against a REDEEMED offer; one OPEN dispute per offer"
    roles: [Consumer]
    code: 201
    input: [offer_id, reason_code]
    output: Dispute
    side_effects: []
  - method: GET
    path: "/disputes"
    description: "List disputes; filter by offer_id, status"
    roles: [ValuationAdmin, Consumer, DealerPartner]
    code: 200
    input: ["offer_id?", "status?", "limit?", "offset?"]
    output: Dispute[]
    side_effects: []
  - method: GET
    path: "/disputes/{id}"
    description: "Fetch one dispute"
    roles: [ValuationAdmin, Consumer]
    code: 200
    input: []
    output: Dispute
    side_effects: []
  - method: POST
    path: "/disputes/{id}/resolve"
    description: "OPEN -> RESOLVED_UPHELD | RESOLVED_ADJUSTED; ADJUSTED mints settlement credit"
    roles: [ValuationAdmin]
    code: 200
    input: [resolution]
    output: Dispute
    side_effects:
      - "when resolution == ADJUSTED: credit_cents := dispute_settlement_credit(offer.edition.retail_cents)"
      - "increments Dispute.version by 1"
  - method: POST
    path: "/disputes/{id}/withdraw"
    description: "OPEN -> WITHDRAWN by the owning consumer"
    roles: [Consumer]
    code: 200
    input: []
    output: Dispute
    side_effects:
      - "increments Dispute.version by 1"

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "missing or unknown X-User-Role header, or missing X-User-ID for an entity_backed role"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "role is not permitted to call the endpoint"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "a path id or body foreign key does not resolve"
  - id: ERR_DUPLICATE_KEY
    http: 409
    condition: "idempotency key replay presented with a different payload, or submission_ref reused for a different batch body"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "transition precondition on the target resource's state is violated"
  - id: ERR_LICENSE_INACTIVE
    http: 409
    condition: "license agreement is not ACTIVE when a gated surface is exercised"
  - id: ERR_INVALID_FUNDING_SOURCE
    http: 422
    condition: "funding_dealer_id does not reference a Source with source_type == DEALER"
  - id: ERR_LOW_CONFIDENCE
    http: 422
    condition: "series.confidence_score < 0.25 at edition publish"
  - id: ERR_CADENCE_VIOLATION
    http: 422
    condition: "weekly cadence violated: another PUBLISHED edition within 7 days, or first edition effective_at != series.effective_from"
  - id: ERR_OFFER_EXPIRED
    http: 422
    condition: "server clock is past offer.expires_at on inspect or redeem"
  - id: ERR_QUOTA_EXCEEDED
    http: 422
    condition: "licensee monthly event quota reached; the event is not recorded"
  - id: ERR_USE_NOT_PERMITTED
    http: 403
    condition: "requested use not in agreement.permitted_uses"
  - id: ERR_REGION_ARCHIVED
    http: 422
    condition: "region targeted by the write has status ARCHIVED"
  - id: ERR_INVALID_INPUT
    http: 400
    condition: "schema/range/enum violation (year bounds, pct bounds, items size, multiplier not equal to catalog value)"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "OCC expected_version does not match the current parent version"
  - id: ERR_DUPLICATE_DISPUTE
    http: 409
    condition: "an OPEN dispute already exists for the offer"
  - id: ERR_SHIFT_IN_PAST
    http: 422
    condition: "market shift activation with effective_at earlier than the server clock"
  - id: ERR_EDITION_HAS_OPEN_OFFERS
    http: 422
    condition: "withdrawal attempted while non-terminal CashOffers reference the edition"
  - id: ERR_INSUFFICIENT_DATA
    http: 422
    condition: "edition creation with an empty 90-day transaction window for the series"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the same operator identity attempts to both validate and accept the same batch, or both publish and withdraw the same edition within the same publication cycle"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ValuationAdmin
    description: "Operates the guidebook: configurations, series, editions, shifts, licenses, methodologies, standards, disputes"
    identity: "opaque"
    exclusive_operations:
      - "POST/PATCH /regions, /regions/{id}"
      - "POST /configurations, PATCH /configurations/{id}"
      - "POST /option-packages"
      - "POST /valuation-series, /valuation-series/{id}/activate"
      - "POST /valuation-editions, /valuation-editions/{id}/publish, /valuation-editions/{id}/withdraw"
      - "POST /market-shifts, /market-shifts/{id}/activate, /market-shifts/{id}/rescind"
      - "POST/PATCH /license-agreements and all license-agreement actions"
      - "POST /methodologies, /methodologies/{id}/publish"
      - "POST /condition-standards"
      - "POST /disputes/{id}/resolve"
    shared_operations:
      - "GET reads across all collections"
      - "POST /_clock/set_current_utc"
  - name: DataOps
    description: "Ingestion operator: sources, batches, corrections"
    identity: "opaque"
    exclusive_operations:
      - "POST /sources, /sources/{id}/activate, /sources/{id}/reinstate"
      - "POST /batches, /batches/{id}/validate, /batches/{id}/accept, /batches/{id}/reject"
      - "POST /corrections"
    shared_operations:
      - "GET reads on regions, sources, configurations, batches, series, editions, shifts"
      - "POST /_clock/set_current_utc"
  - name: DealerPartner
    description: "Franchise dealer funding instant cash offers; inspects and redeems"
    identity: "entity_backed:Source"
    exclusive_operations:
      - "POST /cash-offers/{id}/inspect, /cash-offers/{id}/redeem"
    shared_operations:
      - "POST /cash-offers (as dealer-initiated quote)"
      - "GET reads on configurations, editions, offers, standards"
  - name: Consumer
    description: "Vehicle owner requesting quotes and filing disputes"
    identity: "entity_backed:ConsumerProfile"
    exclusive_operations:
      - "POST /consumer-profiles"
      - "POST /disputes, /disputes/{id}/withdraw"
    shared_operations:
      - "POST /cash-offers (self-assessed quote)"
      - "GET reads on configurations, editions, own offers, own disputes, standards"
  - name: Licensee
    description: "Licensed data consumer (lender/insurer); reads editions under agreement terms"
    identity: "entity_backed:LicenseAgreement"
    exclusive_operations: []
    shared_operations:
      - "GET /valuation-editions/{id} under license gates"
      - "POST /cash-offers (licensee underwriting flow)"
      - "GET reads on series, configurations, standards, methodologies"
