      - name: product_dimensions_move_independently_excluded
        claim_type: parallel_dimensions
        grounds:
          - complexity_profile.state_machine_shape
          - state_machines.Product.formula_dimension
          - state_machines.Product.label_dimension
        distinguishing_aspect: |
          The two Product dimensions advancing without reading each other is the parallel
          shape claim for this scaffold.
        excluded_because:
          difficulty_instance: product_formula_and_label_dimensions_move_independently
          rationale: |
            That SS1.8 non_linear_state_machine instance drives formula_status through
            DRAFT -> REJECTED -> CLEARED while label_status independently walks
            NOT_SUBMITTED -> REJECTED -> APPROVED -> REJECTED on the same product and
            asserts both dimensions plus mark_tier_granted after every hop, which is
            strictly stronger than a single parallel-dimension probe.

      - name: corrective_action_cycle_bound_excluded
        claim_type: cyclic_loop_termination
        grounds:
          - complexity_profile.state_machine_shape
          - state_machines.Nonconformance.note
          - state_machines.Nonconformance.transitions.CA_SUBMITTED_to_ESCALATED
        distinguishing_aspect: |
          The cyclic shape claim - the entity loops back and the loop's termination condition
          is respected - lives on the corrective-action machine, whose CA_SUBMITTED ->
          CA_REJECTED edge is only available while ca_revision_count + 1 < MAX_CA_REVISIONS.
        excluded_because:
          difficulty_instance: ca_cycle_bounded_by_revision_count_then_escalation_locks_the_loop
          rationale: |
            That SS1.8 non_linear_state_machine instance walks the loop to its bound, shows
            the second REJECT diverting to ESCALATED instead of CA_REJECTED, and asserts the
            post-escalation lockdown, covering both the loop and its termination condition.

      - name: supplier_suspension_cascade_excluded
        claim_type: cascade_down
        grounds:
          - state_machines.Supplier.transitions.ACTIVE_to_SUSPENDED.side_effects
          - complexity_profile.complexity_layers
        distinguishing_aspect: |
          The five-hop supplier suspension cascade is the deepest cascade-down side-effect
          chain in the scaffold and needs end-to-end verification with ordering sensitivity.
        excluded_because:
          difficulty_instance: supplier_suspension_propagates_five_hops_to_certificate_and_posture
          rationale: |
            That SS1.8 transitive_cascade instance asserts every hop of the chain - ingredient
            BLOCKED, parent ingredient SUB_COMPONENT_BLOCKED, product CLEARED -> BLOCKED,
            certificate ISSUED -> SUSPENDED and the applicant posture recompute - in one
            trigger, so a separate cascade probe would be a strict subset.

      - name: suspension_compensation_excluded
        claim_type: compensation
        grounds:
          - state_machines.Certificate.transitions.SUSPENDED_to_ISSUED.side_effects
          - complexity_profile.complexity_layers
        distinguishing_aspect: |
          Reinstatement must reverse every suspension side effect except the monotone
          suspension_count, which is the compensation side-effect pattern.
        excluded_because:
          difficulty_instance: suspend_reinstate_suspend_conserves_active_count_while_suspension_count_only_climbs
          rationale: |
            That SS1.8 compensating_invariant instance replays suspend -> reinstate -> suspend
            and asserts the exact restored values of active_certified_product_count,
            suspended_certificate_count, posture_score_rolling_12m, mark_usage_locked and
            label_status at every step, which fully subsumes a one-shot compensation check.

