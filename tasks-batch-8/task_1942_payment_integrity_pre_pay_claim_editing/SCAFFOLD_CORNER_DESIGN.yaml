          trigger:
            - { call: "POST /payment-integrity/claims/${cow_id}/lines", payload: { line_number: 1, procedure_code: "99213", billed_cents: 5000 }, as: Provider, as_user_id: "${pb_id}", captures: { err_id: $.data.error_id } }
          assert:
            - "error_id == ERR_NOT_RESOURCE_OWNER (403); no line is added to claim ${cow_id}"

      - name: reviewer_cannot_decide_unassigned_task
        claim_type: role_denied
        grounds:
          - errors[ERR_NOT_RESOURCE_OWNER]
        distinguishing_aspect: "Task ownership: a Reviewer whose X-User-ID differs from assigned_reviewer_user_id gets ERR_NOT_RESOURCE_OWNER on decide."
        test_recipe:
          setup: ["provider; edit ACTIVE; claim 10000 with task assigned to rev-1 (IN_REVIEW)"]
          setup_api_calls:
            - { call: "POST /payment-integrity/providers", payload: { npi: "NPI-RW2", name: "Own Prov" }, as: PlanAdmin, captures: { prw2_id: $.data.id } }
            - { call: "POST /payment-integrity/edit-rules", payload: { edit_code: "OW-DENY", category: CODING, source: INTERNAL }, as: EditLibrarian, as_user_id: librarian-1, captures: { row_id: $.data.id, row_v: $.data.version } }
            - { call: "POST /payment-integrity/edit-rules/${row_id}/versions", payload: { severity: DENY, applies_to_claim_types: [PROFESSIONAL], logic_expression: "deny line", effective_from: "2026-01-01T00:00:00Z" }, as: EditLibrarian, as_user_id: librarian-1, captures: { vow_id: $.data.id } }
            - { call: "POST /payment-integrity/edit-versions/${vow_id}/submit", payload: {}, as: EditLibrarian, as_user_id: librarian-1 }
            - { call: "POST /payment-integrity/edit-versions/${vow_id}/approve", payload: { expected_edit_rule_version: "${row_v}" }, as: EditApprover, as_user_id: approver-1 }
            - { call: "POST /payment-integrity/claims", payload: { claim_number: "OW2", provider_id: "${prw2_id}", member_id: "M-OW2", claim_type: PROFESSIONAL, total_billed_cents: 10000, service_from: "2026-07-10T00:00:00Z", service_to: "2026-07-10T00:00:00Z" }, as: Provider, as_user_id: "${prw2_id}", captures: { cow2_id: $.data.id } }
            - { call: "POST /payment-integrity/claims/${cow2_id}/lines", payload: { line_number: 1, procedure_code: "99213", billed_cents: 10000 }, as: Provider, as_user_id: "${prw2_id}" }
            - { call: "POST /payment-integrity/claims/${cow2_id}/run-edits", payload: {}, as: PlanAdmin }
            - { call: "GET /payment-integrity/review-tasks", payload: { claim_id: "${cow2_id}" }, as: Any, captures: { tow_id: "$.data[0].id" } }
            - { call: "POST /payment-integrity/review-tasks/${tow_id}/assign", payload: { reviewer_user_id: "rev-1" }, as: SeniorReviewer, as_user_id: senior-1 }
          trigger:
            - { call: "POST /payment-integrity/review-tasks/${tow_id}/decide", payload: { outcome: UPHOLD }, as: Reviewer, as_user_id: rev-2, captures: { err_id: $.data.error_id } }
          assert:
            - "error_id == ERR_NOT_RESOURCE_OWNER (403): task is assigned to rev-1, not rev-2; task stays IN_REVIEW"

      - name: adjudicator_cannot_run_edits
        claim_type: role_denied
        grounds:
          - errors[ERR_UNAUTHORIZED_ROLE]
        distinguishing_aspect: "run-edits is PlanAdmin-exclusive; DisputeAdjudicator is rejected with ERR_UNAUTHORIZED_ROLE."
        test_recipe:
