scenario: |
  Generate task harder than expert level!

  2508. Certified Pre-Owned Program & Inspection Certification (automaker certified pre-owned
  program): vehicle eligibility by age, mileage, title history and prior use with exclusion of
  branded titles, multipoint inspection checklist with pass/fail criteria and required
  reconditioning items, certification fee, warranty coverage extension terms and start-date rules,
  dealer certification submission with documentation retention and audit sampling, decertification
  when a vehicle is sold, wholesaled or fails post-audit, program marketing standards and listing
  syndication requirements, warranty claim behavior monitoring by certifying dealer, customer
  complaint and re-inspection process

domain_name: certified-pre-owned-program
api_prefix: "/cpo"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - version_pinning_on_approval

  entity_topology: graph
  # Vehicle, Inspection, Certification and Complaint form a cyclic reference graph:
  # Certification -> Inspection -> Vehicle, Complaint -> Certification, Inspection -> Complaint,
  # Inspection -> Inspection (self-referential re-inspection chain). No single ownership tree.

  state_machine_shape: parallel
  # Vehicle carries two independent state axes (cpo_state x inventory_state) that evolve
  # separately and gate each other only through explicit cross-axis preconditions. Inspection is
  # cyclic (IN_PROGRESS -> RECONDITIONING_REQUIRED -> IN_PROGRESS). Certification is branching
  # (SUBMITTED -> {ACTIVE, REJECTED, SUPERSEDED}) with a cycle (ACTIVE -> UNDER_AUDIT -> ACTIVE).

  relationship_patterns:
    - one_to_many        # Dealer -> Technician, Inspection -> InspectionResult
    - self_referential   # Inspection.parent_inspection_id -> Inspection.id
    - cross_aggregate    # Certification reads Vehicle + Inspection + Dealer + ProgramConfig
    - polymorphic_free   # no polymorphic FKs; every FK names exactly one parent entity

  role_model: segregation_of_duties
  # The Technician who recorded an inspection's results may not close that inspection's
  # ReconditioningItems, and may not be the Technician of a complaint-driven re-inspection of the
  # same vehicle. Certification approval is reserved to the automaker, never the submitting dealer.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: ProgramConfig
    parent: null
    common_fields: true
    description: >
      Singleton program rulebook. The server seeds exactly one row at startup with the documented
      defaults; PUT /cpo/program-config overwrites the supplied fields and bumps `version`.
      Certification pins the config `version` it was approved under (version-pinning on approval),
      so later config edits never retroactively change an already-ACTIVE certification.
    fields:
      - name: max_age_days
        type: integer
        source: input
        description: Maximum vehicle age at inspection creation, in whole days between in_service_date and date(Inspection.started_at); inclusive upper bound.
        default: 2190
        constraints: ">= 1"
      - name: max_odometer_miles
        type: integer
        source: input
        description: Maximum Inspection.odometer_at_inspection accepted for certification; inclusive upper bound.
        default: 80000
        constraints: ">= 1"
      - name: ineligible_title_brands
        type: array
        source: input
        description: Vehicle.title_brand values that permanently exclude a vehicle from the program.
        default: ["SALVAGE", "FLOOD", "LEMON", "REBUILT", "ODOMETER_DISCREPANCY"]
        constraints: subset of Vehicle.title_brand enum minus CLEAN
      - name: ineligible_prior_uses
        type: array
        source: input
        description: Vehicle.prior_use values that exclude a vehicle from the program.
        default: ["RENTAL", "TAXI", "DRIVING_SCHOOL", "POLICE"]
        constraints: subset of Vehicle.prior_use enum
      - name: base_fee_cents
        type: integer
        source: input
        description: Base certification fee in cents before surcharge and volume discount.
        default: 89900
      - name: age_surcharge_free_years
        type: integer
        source: input
        description: Whole vehicle-age years that attract no age surcharge.
        default: 3
      - name: age_surcharge_cents_per_year
        type: integer
        source: input
        description: Age surcharge in cents charged per whole age year above age_surcharge_free_years.
        default: 12500
      - name: mileage_surcharge_free_miles
        type: integer
        source: input
        description: Odometer miles that attract no mileage surcharge.
        default: 40000
      - name: mileage_surcharge_cents_per_10k
        type: integer
        source: input
        description: Mileage surcharge in cents per whole 10000-mile block above mileage_surcharge_free_miles.
        default: 9000
      - name: surcharge_cap_pct
        type: number
        source: input
        description: Combined age+mileage surcharge is capped at floor(base_fee_cents * surcharge_cap_pct).
        default: 0.35
      - name: volume_discount_tiers
        type: array
        source: input
        description: >
          Ordered tiers [{min_count, pct}] selected by Dealer.lifetime_activated_count as observed
          BEFORE this activation; the applicable tier is the one with the greatest min_count that is
          <= lifetime_activated_count. Ties are impossible because min_count is unique per tier.
        default: [{min_count: 0, pct: 0.00}, {min_count: 10, pct: 0.05}, {min_count: 50, pct: 0.10}]
      - name: recon_reimbursement_share
        type: number
        source: input
        description: Share of each ReconditioningItem.actual_cost_cents the program reimburses to the dealer.
        default: 0.60
      - name: recon_reimbursement_cap_cents
        type: integer
        source: input
        description: Per-Inspection cap on the summed reconditioning reimbursement.
        default: 150000
      - name: factory_basic_months
        type: integer
        source: input
        description: Factory basic warranty duration in months measured from Vehicle.in_service_date.
        default: 36
      - name: factory_basic_miles
        type: integer
        source: input
        description: Factory basic warranty mileage limit.
        default: 36000
      - name: warranty_extension_months
        type: integer
        source: input
        description: CPO warranty extension length in months added to the computed warranty_start_date.
        default: 12
      - name: warranty_extension_miles
        type: integer
        source: input
        description: CPO warranty extension mileage added to Inspection.odometer_at_inspection.
        default: 12000
      - name: warranty_total_cap_months
        type: integer
        source: input
        description: Absolute cap on total coverage, in months from Vehicle.in_service_date.
        default: 84
      - name: warranty_total_cap_miles
        type: integer
        source: input
        description: Absolute cap on total covered odometer reading.
        default: 100000
      - name: claim_per_claim_cap_cents
        type: integer
        source: input
        description: Maximum WarrantyClaim.claimed_amount_cents accepted on submission.
        default: 250000
      - name: claim_window_days
        type: integer
        source: input
        description: Trailing window length in days used by the TRAILING_WINDOW claim-ratio variant.
        default: 365
      - name: claim_variant_volume_floor
        type: integer
        source: input
        description: Dealer.lifetime_activated_count at or above which the TRAILING_WINDOW claim-ratio variant is selected.
        default: 20
      - name: claim_ratio_probation_threshold
        type: number
        source: input
        description: Dealer.claim_ratio_effective at or above which privilege_status becomes PROBATION.
        default: 0.25
      - name: claim_ratio_suspension_threshold
        type: number
        source: input
        description: Dealer.claim_ratio_effective at or above which privilege_status becomes SUSPENDED.
        default: 0.40
      - name: probation_claim_share
        type: number
        source: input
        description: Multiplier applied to an approved claim amount when the dealer's pre-claim ratio already sits at or above claim_ratio_probation_threshold.
        default: 0.80
      - name: audit_sample_pct
        type: number
        source: input
        description: Fraction of the eligible ACTIVE certification pool selected by each audit run.
        default: 0.20
      - name: audit_sample_min_per_run
        type: integer
        source: input
        description: Minimum selections per audit run, clamped down to pool size when the pool is smaller.
        default: 1
      - name: audit_fail_suspension_count
        type: integer
        source: input
        description: Dealer.audit_fail_count at or above which privilege_status becomes SUSPENDED.
        default: 2
      - name: doc_retention_years
        type: integer
        source: input
        description: Years after Certification.warranty_end_date that CertificationDocument rows must be retained.
        default: 7
      - name: required_doc_types
        type: array
        source: input
        description: >
          CertificationDocument.doc_type values that must accompany a certification submission.
          RECONDITIONING_INVOICE is conditionally required: mandatory when the inspection produced
          at least one ReconditioningItem, and rejected when it produced none.
        default: ["TITLE_HISTORY_REPORT", "INSPECTION_WORKSHEET", "RECONDITIONING_INVOICE", "CUSTOMER_DISCLOSURE"]
      - name: listing_required_disclosure_fields
        type: array
        source: input
        description: Disclosure tokens every Listing.disclosure_fields array must contain.
        default: ["CERTIFIED_BADGE", "WARRANTY_END_DATE", "INSPECTION_DATE", "CERTIFICATION_NUMBER"]
      - name: listing_removal_sla_hours
        type: integer
        source: input
        description: Hours after a forced withdrawal by which the dealer must pull syndicated content; sets Listing.removal_due_at.
        default: 48
      - name: inspection_slot_minutes
        type: integer
        source: input
        description: Length in minutes of the technician slot an Inspection occupies from started_at.
        default: 120
      - name: technician_buffer_minutes
        type: integer
        source: input
        description: Buffer in minutes applied to BOTH ends of a technician slot before conflict testing.
        default: 30

  - name: Dealer
    parent: null
    common_fields: true
    description: Franchised dealer authorized to certify vehicles. Carries the program's behaviour-monitoring counters.
    fields:
      - name: name
        type: string
        source: input
        description: Legal dealership name.
      - name: franchise_code
        type: string
        source: input
        description: Automaker franchise code; unique across Dealer rows and used to mint Certification.certification_number.
        constraints: unique, non-empty
      - name: region_code
        type: string
        source: input
        description: Program region the dealer reports into.
      - name: privilege_status
        type: enum
        source: system
        description: Certification privilege. Set to ACTIVE at creation; moved by threshold cascades or by PATCH /cpo/dealers/{id}/privilege.
        default: ACTIVE
        constraints: "ACTIVE | PROBATION | SUSPENDED"
      - name: privilege_reason
        type: enum
        source: system
        description: Why privilege_status last changed; null while ACTIVE by default.
        default: null
        constraints: "null | CLAIM_RATIO_PROBATION | CLAIM_RATIO_SUSPENSION | AUDIT_FAILURE_SUSPENSION | ADMIN_ACTION"
      - name: lifetime_submitted_count
        type: integer
        source: computed
        description: Count of Certification rows with dealer_id == this Dealer.id in any status; incremented on every submission and never decremented. Used as the certification_number sequence.
        default: 0
      - name: lifetime_activated_count
        type: integer
        source: computed
        description: "count of Certification WHERE dealer_id == this Dealer.id AND activated_at IS NOT NULL (status IN {ACTIVE, UNDER_AUDIT, DECERTIFIED}); never decremented once a certification has been activated."
        default: 0
      - name: window_activated_count
        type: integer
        source: computed
        description: "count of Certification WHERE dealer_id == this Dealer.id AND activated_at >= logical_clock - claim_window_days AND activated_at <= logical_clock (inclusive both ends)."
        default: 0
      - name: active_certification_count
        type: integer
        source: computed
        description: "count of Certification WHERE dealer_id == this Dealer.id AND status IN {SUBMITTED, ACTIVE, UNDER_AUDIT}."
        default: 0
      - name: approved_claim_count_lifetime
        type: integer
        source: computed
        description: "count of WarrantyClaim WHERE status == APPROVED AND its Certification.dealer_id == this Dealer.id."
        default: 0
      - name: approved_claim_count_window
        type: integer
        source: computed
        description: "count of WarrantyClaim WHERE status == APPROVED AND its Certification.dealer_id == this Dealer.id AND repair_date >= date(logical_clock) - claim_window_days AND repair_date <= date(logical_clock)."
        default: 0
      - name: claim_ratio_variant
        type: enum
        source: computed
        description: Which claim-ratio algorithm currently applies, per calculations.dealer_claim_ratio.
        default: LIFETIME_CUMULATIVE
        constraints: "LIFETIME_CUMULATIVE | TRAILING_WINDOW"
      - name: claim_ratio_effective
        type: number
        source: computed
        description: Claim ratio produced by the selected variant, rounded to 2 decimals round_half_up.
        default: 0.00
      - name: audit_sample_count
        type: integer
        source: computed
        description: "count of AuditSample WHERE its Certification.dealer_id == this Dealer.id, in any status."
        default: 0
      - name: audit_fail_count
        type: integer
        source: computed
        description: "count of AuditSample WHERE status == FAILED AND its Certification.dealer_id == this Dealer.id."
        default: 0
      - name: audit_fail_rate
        type: number
        source: computed
        description: audit_fail_count / max(1, audit_sample_count), rounded to 2 decimals round_half_up.
        default: 0.00
      - name: risk_score
        type: integer
        source: computed
        description: Ranking key for audit sampling, per calculations.dealer_risk_score.
        default: 0
      - name: fee_billed_cents_total
        type: integer
        source: computed
        description: Sum of Certification.fee_charged_cents over every certification of this dealer that has been activated at least once.
        default: 0
      - name: fee_credited_cents_total
        type: integer
        source: computed
        description: Sum of Certification.fee_credited_cents over every certification of this dealer.
        default: 0
      - name: fee_balance_cents
        type: integer
        source: computed
        description: fee_billed_cents_total - fee_credited_cents_total. The conserved money quantity of the fee ledger invariant.
        default: 0

  - name: Technician
    parent: Dealer
    common_fields: true
    description: Credentialed inspector employed by a dealer. Identity subject of the InspectionTechnician role.
    fields:
      - name: dealer_id
        type: string
        source: input
        description: FK -> Dealer.id; employing dealer, taken from the path segment.
      - name: name
        type: string
        source: input
        description: Technician full name.
      - name: credential_id
        type: string
        source: input
        description: Automaker inspector credential number; unique within the dealer.
        constraints: unique per dealer_id
      - name: credential_expires_at
        type: datetime
        source: input
        description: Instant the credential lapses; an inspection may not be created when this is <= the logical clock.
      - name: credential_status
        type: enum
        source: input
        description: Administrative credential state.
        default: ACTIVE
        constraints: "ACTIVE | REVOKED"
      - name: completed_inspection_count
        type: integer
        source: computed
        description: "count of Inspection WHERE technician_id == this Technician.id AND status IN {PASSED, FAILED}."
        default: 0

  - name: Vehicle
    parent: null
    common_fields: true
    description: >
      Physical unit under evaluation. Carries two independent state axes: cpo_state (program
      standing) and inventory_state (commercial standing). Each axis has its own transitions and
      neither derives from the other; they interact only through declared cross-axis preconditions.
    fields:
      - name: vin
        type: string
        source: input
        description: Vehicle identification number; unique across Vehicle rows.
        constraints: exactly 17 characters, unique
      - name: model_year
        type: integer
        source: input
        description: Model year as printed on the compliance label.
      - name: in_service_date
        type: datetime
        source: input
        description: "Date the vehicle first entered service (YYYY-MM-DD); anchor for age, factory warranty and the total coverage cap."
      - name: odometer_miles
        type: integer
        source: input
        description: Current odometer reading; monotonically non-decreasing once set.
        constraints: ">= 0"
      - name: title_brand
        type: enum
        source: input
        description: Current title brand. Only CLEAN may be supplied at creation; other values arrive through a TITLE_BRANDED history event.
        default: CLEAN
        constraints: "CLEAN | SALVAGE | FLOOD | LEMON | REBUILT | ODOMETER_DISCREPANCY"
      - name: prior_use
        type: enum
        source: input
        description: Documented prior use of the vehicle.
        constraints: "PERSONAL | LEASE | FLEET | RENTAL | TAXI | DRIVING_SCHOOL | POLICE"
      - name: owner_count
        type: integer
        source: input
        description: Number of retail owners on the title history.
        default: 1
      - name: cpo_state
        type: enum
        source: system
        description: Program standing axis. NOT_CERTIFIED at creation; driven by inspection creation, certification approval, rejection and decertification.
        default: NOT_CERTIFIED
        constraints: "NOT_CERTIFIED | CERTIFICATION_PENDING | CERTIFIED | DECERTIFIED"
      - name: inventory_state
        type: enum
        source: system
        description: Commercial standing axis. IN_INVENTORY at creation; driven only by history events.
        default: IN_INVENTORY
        constraints: "IN_INVENTORY | RETAIL_SOLD | WHOLESALED"
      - name: active_certification_count
        type: integer
        source: computed
        description: "count of Certification WHERE vehicle_id == this Vehicle.id AND status IN {SUBMITTED, ACTIVE, UNDER_AUDIT}. The conserved slot quantity; the program invariant is that it never exceeds 1."
        default: 0
      - name: certified_certification_id
        type: string
        source: computed
        description: "Id of the Certification WHERE vehicle_id == this Vehicle.id AND status IN {ACTIVE, UNDER_AUDIT}, or null when none exists. Not a foreign key: it is a derived pointer recomputed on every certification status change."
        default: null
      - name: decertified_at
        type: datetime
        source: system
        description: Logical-clock instant cpo_state last became DECERTIFIED; null otherwise.
        default: null
      - name: last_history_event_type
        type: enum
        source: system
        description: event_type of the most recent history event applied to this vehicle.
        default: null
        constraints: "null | ODOMETER_UPDATE | TITLE_BRANDED | RETAIL_SOLD | WHOLESALED | RETURNED_TO_INVENTORY"
      - name: last_history_event_at
        type: datetime
        source: system
        description: Logical-clock instant of the most recent history event.
        default: null

  - name: ChecklistTemplate
    parent: null
    common_fields: true
    description: Versioned multipoint inspection checklist. Immutable once PUBLISHED.
    fields:
      - name: code
        type: string
        source: input
        description: Template code such as MPI-172; unique across ChecklistTemplate rows.
        constraints: unique
      - name: effective_from
        type: datetime
        source: input
        description: "Date (YYYY-MM-DD) from which the published template may back inspections."
      - name: status
        type: enum
        source: system
        description: Lifecycle state; DRAFT at creation.
        default: DRAFT
        constraints: "DRAFT | PUBLISHED | RETIRED"
      - name: published_at
        type: datetime
        source: system
        description: Logical-clock instant the template was published; null while DRAFT.
        default: null
      - name: point_count
        type: integer
        source: computed
        description: "count of ChecklistItem WHERE template_id == this ChecklistTemplate.id."
        default: 0
      - name: critical_item_count
        type: integer
        source: computed
        description: "count of ChecklistItem WHERE template_id == this ChecklistTemplate.id AND severity == CRITICAL."
        default: 0

  - name: ChecklistItem
    parent: ChecklistTemplate
    common_fields: false
    description: One inspection point with its pass/fail criteria. Append-only configuration row; never mutated after creation.
    fields:
      - name: template_id
        type: string
        source: input
        description: FK -> ChecklistTemplate.id; owning template, taken from the path segment.
      - name: item_code
        type: string
        source: input
        description: Short code such as B1; unique within template_id and the natural key InspectionResult.item_code resolves against.
        constraints: unique per template_id
      - name: category
        type: enum
        source: input
        description: Inspection area.
        constraints: "POWERTRAIN | BRAKES | TIRES | SAFETY | ELECTRICAL | BODY | INTERIOR | ROAD_TEST"
      - name: severity
        type: enum
        source: input
        description: Consequence class of a failure on this point.
        constraints: "CRITICAL | MAJOR | MINOR"
      - name: pass_criteria
        type: string
        source: input
        description: Human-readable pass criterion recorded on the worksheet.
      - name: min_measure
        type: number
        source: input
        description: Inclusive lower bound a measured_value must meet for outcome PASS; null when the point is not measured.
        default: null
      - name: max_measure
        type: number
        source: input
        description: Inclusive upper bound a measured_value must respect for outcome PASS; null when unbounded.
        default: null
      - name: reconditioning_allowed
        type: boolean
        source: input
        description: Whether a FAIL on this point may be cured by reconditioning. A CRITICAL point with false fails the inspection outright.
        default: true
      - name: max_reconditioning_cost_cents
        type: integer
        source: input
        description: Per-item ceiling on the reimbursable reconditioning amount for this point.
        default: 100000

  - name: Inspection
    parent: null
    common_fields: true
    description: >
      One execution of a checklist against a vehicle by a technician. Cyclic lifecycle: results may
      be re-recorded after reconditioning, returning the inspection to IN_PROGRESS.
    fields:
      - name: vehicle_id
        type: string
        source: input
        description: FK -> Vehicle.id; vehicle under inspection.
      - name: dealer_id
        type: string
        source: system
        description: FK -> Dealer.id; performing dealer, resolved from the acting DealerPrincipal's X-User-ID.
      - name: technician_id
        type: string
        source: input
        description: FK -> Technician.id; assigned inspector, who must belong to dealer_id.
      - name: template_id
        type: string
        source: input
        description: FK -> ChecklistTemplate.id; checklist used, which must be PUBLISHED.
      - name: parent_inspection_id
        type: string
        source: input
        description: FK -> Inspection.id; prior inspection this one supersedes, or null. Non-null makes purpose RE_INSPECTION.
        default: null
      - name: complaint_id
        type: string
        source: input
        description: FK -> Complaint.id; complaint that ordered this re-inspection, or null.
        default: null
      - name: purpose
        type: enum
        source: computed
        description: RE_INSPECTION when parent_inspection_id or complaint_id is non-null, otherwise INITIAL.
        default: INITIAL
        constraints: "INITIAL | RE_INSPECTION"
      - name: status
        type: enum
        source: system
        description: Lifecycle state; DRAFT at creation.
        default: DRAFT
        constraints: "DRAFT | IN_PROGRESS | RECONDITIONING_REQUIRED | PASSED | FAILED | VOIDED"
      - name: started_at
        type: datetime
        source: input
        description: Instant the technician began the inspection; must not be after the logical clock.
      - name: slot_end_at
        type: datetime
        source: computed
        description: started_at + ProgramConfig.inspection_slot_minutes; the technician-occupancy interval end.
      - name: odometer_at_inspection
        type: integer
        source: input
        description: Odometer reading recorded on the worksheet; must be >= Vehicle.odometer_miles and is the mileage anchor of the warranty extension.
      - name: vehicle_age_days_at_inspection
        type: integer
        source: computed
        description: Whole days between Vehicle.in_service_date and date(started_at), snapshotted at creation.
      - name: attempt_count
        type: integer
        source: system
        description: Number of times results have been recorded; 0 at creation, incremented by each PUT of results.
        default: 0
      - name: recorded_item_count
        type: integer
        source: computed
        description: "count of distinct InspectionResult.item_code WHERE inspection_id == this Inspection.id AND attempt_index == this Inspection.attempt_count."
        default: 0
      - name: failed_critical_count
        type: integer
        source: computed
        description: "count of InspectionResult WHERE inspection_id == this Inspection.id AND attempt_index == attempt_count AND outcome == FAIL AND the resolved ChecklistItem.severity == CRITICAL."
        default: 0
      - name: failed_recon_count
        type: integer
        source: computed
        description: "count of InspectionResult WHERE inspection_id == this Inspection.id AND attempt_index == attempt_count AND outcome == FAIL AND the resolved ChecklistItem.reconditioning_allowed == true."
        default: 0
      - name: total_recon_cost_cents
        type: integer
        source: computed
        description: "sum of ReconditioningItem.actual_cost_cents WHERE inspection_id == this Inspection.id AND status == COMPLETED."
        default: 0
      - name: total_reimbursable_cents
        type: integer
        source: computed
        description: Program reimbursement for this inspection's reconditioning, per calculations.reconditioning_reimbursement.
        default: 0
      - name: submitted_at
        type: datetime
        source: system
        description: Logical-clock instant the inspection reached PASSED or FAILED; null otherwise.
        default: null
      - name: failure_reason
        type: enum
        source: system
        description: Why the inspection ended FAILED or VOIDED.
        default: null
        constraints: "null | CRITICAL_ITEM_FAIL | SUPERSEDED_BY_REINSPECTION | COMPLAINT_DISMISSED"

  - name: InspectionResult
    parent: Inspection
    common_fields: false
    description: Append-only record of one checklist point outcome for one attempt. Never mutated.
    fields:
      - name: inspection_id
        type: string
        source: input
        description: FK -> Inspection.id; owning inspection, taken from the path segment.
      - name: item_code
        type: string
        source: input
        description: "Natural-key reference to the checklist point: the ChecklistItem WHERE template_id == Inspection.template_id AND item_code == this value."
      - name: outcome
        type: enum
        source: input
        description: Recorded outcome for the point.
        constraints: "PASS | FAIL | NOT_APPLICABLE"
      - name: measured_value
        type: number
        source: input
        description: Measurement taken, required when the resolved ChecklistItem declares min_measure or max_measure.
        default: null
      - name: attempt_index
        type: integer
        source: system
        description: Inspection.attempt_count value this row was written under, so successive re-recordings are distinguishable.
      - name: recorded_by_technician_id
        type: string
        source: system
        description: "Denormalized audit stamp, not a foreign-key edge: PUT /cpo/inspections/{id}/results may only be called by the inspection's own technician, so this value always equals Inspection.technician_id and the authoritative technician edge stays on Inspection. Resolve a technician's recorded rows by GET /cpo/inspections?technician_id=... then GET /cpo/inspections/{id}/results."
      - name: recorded_at
        type: datetime
        source: system
        description: Logical-clock instant the row was written.

  - name: ReconditioningItem
    parent: Inspection
    common_fields: true
    description: A required repair generated by a curable failed checklist point; must be closed before the inspection can pass.
    fields:
      - name: inspection_id
        type: string
        source: system
        description: FK -> Inspection.id; inspection that generated this repair.
      - name: item_code
        type: string
        source: system
        description: "Natural-key reference to the failed point: ChecklistItem WHERE template_id == Inspection.template_id AND item_code == this value."
      - name: severity
        type: enum
        source: system
        description: Severity copied from the resolved ChecklistItem at generation time.
        constraints: "CRITICAL | MAJOR | MINOR"
      - name: status
        type: enum
        source: system
        description: REQUIRED at generation; COMPLETED when repaired, WAIVED when the automaker excuses it.
        default: REQUIRED
        constraints: "REQUIRED | COMPLETED | WAIVED"
      - name: actual_cost_cents
        type: integer
        source: input
        description: Repair cost supplied at completion; null while REQUIRED and for WAIVED rows.
        default: null
      - name: reimbursable_cents
        type: integer
        source: computed
        description: Per-item program reimbursement, per calculations.reconditioning_reimbursement; 0 while REQUIRED and for WAIVED rows.
        default: 0
      - name: waiver_reason
        type: string
        source: input
        description: Justification recorded when status becomes WAIVED; null otherwise.
        default: null
      - name: completed_at
        type: datetime
        source: system
        description: Logical-clock instant the row left REQUIRED.
        default: null
      - name: closed_by_user_id
        type: string
        source: system
        description: X-User-ID of the actor that closed the row; a Technician id for COMPLETED, an opaque operator id for WAIVED.
        default: null

  - name: Certification
    parent: null
    common_fields: true
    description: >
      A dealer's claim that a vehicle meets the program standard, plus the fee and warranty terms
      the automaker attaches on approval. Branching lifecycle with an audit cycle.
    fields:
      - name: vehicle_id
        type: string
        source: input
        description: FK -> Vehicle.id; certified vehicle.
      - name: inspection_id
        type: string
        source: input
        description: FK -> Inspection.id; PASSED inspection that backs this certification.
      - name: dealer_id
        type: string
        source: system
        description: FK -> Dealer.id; certifying dealer, resolved from the acting DealerPrincipal's X-User-ID.
      - name: certification_number
        type: string
        source: system
        description: "Deterministic label CPO-{Dealer.franchise_code}-{Dealer.lifetime_submitted_count after increment, zero-padded to 4}."
      - name: status
        type: enum
        source: system
        description: Lifecycle state; SUBMITTED at creation.
        default: SUBMITTED
        constraints: "SUBMITTED | ACTIVE | UNDER_AUDIT | REJECTED | SUPERSEDED | DECERTIFIED"
      - name: submitted_at
        type: datetime
        source: system
        description: Logical-clock instant of submission.
      - name: activated_at
        type: datetime
        source: system
        description: Logical-clock instant status first became ACTIVE; null until approval and never cleared afterwards.
        default: null
      - name: decertified_at
        type: datetime
        source: system
        description: Logical-clock instant status became DECERTIFIED.
        default: null
      - name: rejection_reason
        type: enum
        source: system
        description: Why the submission was rejected.
        default: null
        constraints: "null | DOCUMENTATION_INCOMPLETE | DEALER_SUSPENDED | ADMIN_DECISION"
      - name: decertification_reason
        type: enum
        source: system
        description: Why the certification was withdrawn.
        default: null
        constraints: "null | RETAIL_SOLD | WHOLESALED | POST_AUDIT_FAIL | TITLE_BRANDED | COMPLAINT_REINSPECTION_FAIL | ADMIN_ACTION"
      - name: program_config_version
        type: integer
        source: system
        description: ProgramConfig.version pinned at approval; every fee, warranty and retention figure on this row is computed from that config generation and is never recomputed afterwards.
        default: null
      - name: fee_surcharge_cents
        type: integer
        source: computed
        description: Capped age+mileage surcharge component of the fee, per calculations.certification_fee.
        default: 0
      - name: fee_discount_cents
        type: integer
        source: computed
        description: Volume discount component of the fee, per calculations.certification_fee.
        default: 0
      - name: fee_charged_cents
        type: integer
        source: computed
        description: Fee billed to the dealer at approval, per calculations.certification_fee; 0 until approval.
        default: 0
      - name: fee_credited_cents
        type: integer
        source: computed
        description: Fee refunded to the dealer by a compensating decertification; 0 unless the program's own audit invalidated the certification.
        default: 0
      - name: warranty_anchor_variant
        type: enum
        source: computed
        description: Which start-date rule produced warranty_start_date, per calculations.warranty_coverage.
        default: null
        constraints: "null | IN_SERVICE_ANCHORED | CERTIFICATION_ANCHORED"
      - name: warranty_start_date
        type: datetime
        source: computed
        description: "First covered date (YYYY-MM-DD), inclusive; the lower bound of the half-open coverage interval."
        default: null
      - name: warranty_end_date
        type: datetime
        source: computed
        description: "First uncovered date (YYYY-MM-DD), exclusive; the upper bound of the half-open coverage interval."
        default: null
      - name: warranty_end_miles
        type: integer
        source: computed
        description: Inclusive odometer ceiling of the CPO extension.
        default: null
      - name: retention_expires_at
        type: datetime
        source: computed
        description: warranty_end_date + ProgramConfig.doc_retention_years; the date documentation may be destroyed.
        default: null
      - name: audit_sampled
        type: boolean
        source: system
        description: Whether an audit run has ever selected this certification; excludes it from later pools.
        default: false
      - name: audit_sample_count
        type: integer
        source: computed
        description: "count of AuditSample WHERE certification_id == this Certification.id."
        default: 0
      - name: document_count
        type: integer
        source: computed
        description: "count of CertificationDocument WHERE certification_id == this Certification.id."
        default: 0
      - name: approved_claim_count
        type: integer
        source: computed
        description: "count of WarrantyClaim WHERE certification_id == this Certification.id AND status == APPROVED."
        default: 0
      - name: approved_claim_amount_cents
        type: integer
        source: computed
        description: "sum of WarrantyClaim.approved_amount_cents WHERE certification_id == this Certification.id AND status == APPROVED."
        default: 0
      - name: listing_syndicated_at
        type: datetime
        source: system
        description: Logical-clock instant a Listing for this certification most recently syndicated; null when never syndicated.
        default: null

  - name: CertificationDocument
    parent: Certification
    common_fields: false
    description: Retained evidence file attached at submission. Cascade-created by the submission call and discoverable only through the documents sub-resource.
    fields:
      - name: certification_id
        type: string
        source: system
        description: FK -> Certification.id; owning certification.
      - name: doc_type
        type: enum
        source: input
        description: Evidence class.
        constraints: "TITLE_HISTORY_REPORT | INSPECTION_WORKSHEET | RECONDITIONING_INVOICE | CUSTOMER_DISCLOSURE"
      - name: reference
        type: string
        source: input
        description: Dealer's document management reference.
      - name: uploaded_at
        type: datetime
        source: system
        description: Logical-clock instant the document row was created.
      - name: retained_until
        type: datetime
        source: computed
        description: Copy of Certification.retention_expires_at, written when the certification is approved; null while the certification is SUBMITTED.
        default: null

  - name: AuditSample
    parent: Certification
    common_fields: true
    description: One post-certification audit assignment produced by an audit run.
    fields:
      - name: certification_id
        type: string
        source: system
        description: FK -> Certification.id; certification under audit.
      - name: audit_run_id
        type: string
        source: system
        description: "Deterministic run label AR-{n}, where n is the 1-based count of audit runs executed; groups the samples of one run. Not a foreign key; no AuditRun entity exists."
      - name: selection_rank
        type: integer
        source: system
        description: 1-based position of this certification in the run's ranked pool.
      - name: status
        type: enum
        source: system
        description: SELECTED at creation; PASSED or FAILED once the auditor records a finding.
        default: SELECTED
        constraints: "SELECTED | PASSED | FAILED"
      - name: finding_code
        type: enum
        source: input
        description: Audit outcome detail supplied with the finding.
        default: null
        constraints: "null | NONE | DOCUMENTATION_MISSING | ELIGIBILITY_VIOLATION | INSPECTION_INCOMPLETE"
      - name: reviewed_at
        type: datetime
        source: system
        description: Logical-clock instant the finding was recorded.
        default: null
      - name: reviewer_user_id
        type: string
        source: system
        description: Opaque X-User-ID of the ProgramAuditor that recorded the finding.
        default: null

  - name: WarrantyClaim
    parent: Certification
    common_fields: true
    description: Repair claim made against an activated certification; the raw material of dealer behaviour monitoring.
    fields:
      - name: certification_id
        type: string
        source: input
        description: FK -> Certification.id; certification the repair is claimed under.
      - name: component_category
        type: enum
        source: input
        description: Component group repaired.
        constraints: "POWERTRAIN | BRAKES | TIRES | SAFETY | ELECTRICAL | BODY | INTERIOR"
      - name: repair_date
        type: datetime
        source: input
        description: "Date of repair (YYYY-MM-DD); must fall inside the half-open coverage interval."
      - name: repair_odometer_miles
        type: integer
        source: input
        description: Odometer at repair; must not exceed Certification.warranty_end_miles.
      - name: claimed_amount_cents
        type: integer
        source: input
        description: Amount the dealer claims, capped by ProgramConfig.claim_per_claim_cap_cents.
        constraints: ">= 1"
      - name: status
        type: enum
        source: system
        description: SUBMITTED at creation; APPROVED or DENIED once adjudicated.
        default: SUBMITTED
        constraints: "SUBMITTED | APPROVED | DENIED"
      - name: dealer_ratio_snapshot_before
        type: number
        source: system
        description: Certifying dealer's claim_ratio_effective read BEFORE this claim is counted, pinned at adjudication; the reimbursement share is chosen from this snapshot.
        default: null
      - name: approved_amount_cents
        type: integer
        source: computed
        description: Amount the program pays, per calculations.claim_reimbursement; 0 unless status is APPROVED.
        default: 0
      - name: denial_reason
        type: enum
        source: input
        description: Why the claim was denied.
        default: null
        constraints: "null | NOT_COVERED_COMPONENT | PRE_EXISTING_DAMAGE | INSUFFICIENT_EVIDENCE"
      - name: adjudicated_at
        type: datetime
        source: system
        description: Logical-clock instant of adjudication.
        default: null

  - name: Listing
    parent: Certification
    common_fields: true
    description: Marketing record for a certified vehicle on one channel, subject to disclosure standards and syndication rules.
    fields:
      - name: certification_id
        type: string
        source: input
        description: FK -> Certification.id; certification being advertised.
      - name: channel
        type: enum
        source: input
        description: Distribution channel; at most one non-WITHDRAWN listing per certification per channel.
        constraints: "OEM_SITE | DEALER_SITE | THIRD_PARTY_AGGREGATOR"
      - name: price_cents
        type: integer
        source: input
        description: Advertised price.
        constraints: ">= 1"
      - name: disclosure_fields
        type: array
        source: input
        description: Disclosure tokens present in the advertisement; must be a superset of ProgramConfig.listing_required_disclosure_fields.
      - name: status
        type: enum
        source: system
        description: DRAFT at creation; SYNDICATED once published; WITHDRAWN when pulled or forced down.
        default: DRAFT
        constraints: "DRAFT | SYNDICATED | WITHDRAWN"
      - name: syndicated_at
        type: datetime
        source: system
        description: Logical-clock instant of the most recent syndication.
        default: null
      - name: syndicated_snapshot_version
        type: integer
        source: system
        description: Certification.version captured at the most recent syndication; the published content generation.
        default: null
      - name: withdrawn_at
        type: datetime
        source: system
        description: Logical-clock instant the listing became WITHDRAWN.
        default: null
      - name: withdrawal_reason
        type: enum
        source: system
        description: Why the listing was pulled.
        default: null
        constraints: "null | CERTIFICATION_DECERTIFIED | DEALER_SUSPENDED | DEALER_ACTION"
      - name: removal_due_at
        type: datetime
        source: computed
        description: withdrawn_at + ProgramConfig.listing_removal_sla_hours; the syndication takedown deadline. Null unless the withdrawal was forced by a cascade.
        default: null

  - name: Complaint
    parent: Certification
    common_fields: true
    description: Customer objection against a certified vehicle, optionally escalated into a re-inspection.
    fields:
      - name: certification_id
        type: string
        source: input
        description: FK -> Certification.id; certification complained about.
      - name: customer_reference
        type: string
        source: input
        description: Customer case reference recorded by the advocate.
      - name: category
        type: enum
        source: input
        description: Nature of the complaint.
        constraints: "UNDISCLOSED_DAMAGE | INSPECTION_ITEM_FAILURE | WARRANTY_DENIAL | MARKETING_MISREPRESENTATION"
      - name: description
        type: string
        source: input
        description: Narrative supplied by the customer advocate.
      - name: status
        type: enum
        source: system
        description: OPEN at creation; ordered, resolved or dismissed thereafter.
        default: OPEN
        constraints: "OPEN | REINSPECTION_ORDERED | RESOLVED_UPHELD | RESOLVED_DECERTIFIED | DISMISSED"
      - name: filed_at
        type: datetime
        source: system
        description: Logical-clock instant the complaint was filed.
      - name: reinspection_deadline_at
        type: datetime
        source: computed
        description: filed_at + 5 days; a re-inspection may not be opened after this instant.
      - name: reinspection_ordered_at
        type: datetime
        source: system
        description: Logical-clock instant a re-inspection was opened for this complaint.
        default: null
      - name: resolved_at
        type: datetime
        source: system
        description: Logical-clock instant the complaint reached a terminal status.
        default: null

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  # --- Vehicle, axis 1 of 2: program standing -------------------------------
  - entity: Vehicle
    dimension: cpo_state
    initial_state: NOT_CERTIFIED
    terminal_states: []
    note: >
      Parallel dimension 1. Evolves independently of inventory_state; the only coupling is the
      explicit `inventory_state == IN_INVENTORY` precondition on entering CERTIFICATION_PENDING.
      DECERTIFIED is not terminal: a returned vehicle may re-enter the pipeline.
    transitions:
      - from: NOT_CERTIFIED
        to: CERTIFICATION_PENDING
        trigger: "POST /cpo/inspections"
        actor: DealerPrincipal
        preconditions:
          - "Vehicle.inventory_state == IN_INVENTORY"
          - "Vehicle.title_brand NOT IN ProgramConfig.ineligible_title_brands"
          - "Vehicle.prior_use NOT IN ProgramConfig.ineligible_prior_uses"
          - "days(date(started_at) - Vehicle.in_service_date) <= ProgramConfig.max_age_days"
          - "odometer_at_inspection <= ProgramConfig.max_odometer_miles"
          - "no Inspection exists WHERE vehicle_id == this Vehicle.id AND status IN {DRAFT, IN_PROGRESS, RECONDITIONING_REQUIRED}"
        side_effects:
          - "creates the Inspection in status DRAFT with attempt_count 0"
          - "sets Vehicle.cpo_state = CERTIFICATION_PENDING and increments Vehicle.version by 1"
      - from: DECERTIFIED
        to: CERTIFICATION_PENDING
        trigger: "POST /cpo/inspections"
        actor: DealerPrincipal
        preconditions:
          - "Vehicle.inventory_state == IN_INVENTORY (i.e. a RETURNED_TO_INVENTORY event has been applied since the sale)"
          - "all preconditions of the NOT_CERTIFIED -> CERTIFICATION_PENDING transition also hold"
        side_effects:
          - "creates the Inspection in status DRAFT"
          - "sets Vehicle.cpo_state = CERTIFICATION_PENDING, leaves Vehicle.decertified_at as the historical record, increments Vehicle.version by 1"
        note: "Cycle on this axis: DECERTIFIED -> CERTIFICATION_PENDING -> CERTIFIED is a legal loop."
      - from: CERTIFICATION_PENDING
        to: CERTIFIED
        trigger: "POST /cpo/certifications/{id}/approve with decision APPROVE"
        actor: ProgramAdministrator
        preconditions:
          - "Certification.status == SUBMITTED"
        side_effects:
          - "sets Vehicle.certified_certification_id = the approved Certification.id"
          - "increments Vehicle.version by 1"
      - from: CERTIFICATION_PENDING
        to: NOT_CERTIFIED
        trigger: "POST /cpo/certifications/{id}/approve with decision REJECT, or POST /cpo/inspections/{id}/submit resolving to FAILED, or the dealer-suspension cascade rejecting a SUBMITTED certification"
        actor: ProgramAdministrator | DealerPrincipal | system
        preconditions:
          - "no Certification exists WHERE vehicle_id == this Vehicle.id AND status IN {SUBMITTED, ACTIVE, UNDER_AUDIT} after the triggering change is applied"
        side_effects:
          - "recomputes Vehicle.active_certification_count (falls to 0) and Vehicle.certified_certification_id (null)"
          - "increments Vehicle.version by 1"
      - from: CERTIFIED
        to: DECERTIFIED
        trigger: "system: a Certification with vehicle_id == this Vehicle.id leaves {ACTIVE, UNDER_AUDIT} for DECERTIFIED"
        actor: system
        preconditions:
          - "Vehicle.certified_certification_id == the decertifying Certification.id"
        side_effects:
          - "sets Vehicle.decertified_at = logical clock, Vehicle.certified_certification_id = null"
          - "recomputes Vehicle.active_certification_count to 0"
          - "increments Vehicle.version by 1"

  # --- Vehicle, axis 2 of 2: commercial standing ----------------------------
  - entity: Vehicle
    dimension: inventory_state
    initial_state: IN_INVENTORY
    terminal_states: []
    note: >
      Parallel dimension 2. Driven exclusively by POST /cpo/vehicles/{id}/history-events and never
      by certification activity; a vehicle may be RETAIL_SOLD while cpo_state is NOT_CERTIFIED.
    transitions:
      - from: IN_INVENTORY
        to: RETAIL_SOLD
        trigger: "POST /cpo/vehicles/{id}/history-events with event_type RETAIL_SOLD"
        actor: DealerPrincipal | ProgramAdministrator
        preconditions:
          - "Vehicle.inventory_state == IN_INVENTORY"
          - "supplied odometer_miles, when present, is >= Vehicle.odometer_miles"
        side_effects:
          - "sets Vehicle.inventory_state = RETAIL_SOLD, last_history_event_type = RETAIL_SOLD, last_history_event_at = logical clock"
          - "CASCADE hop 2: any Certification WHERE vehicle_id == this Vehicle.id AND status IN {ACTIVE, UNDER_AUDIT} moves to DECERTIFIED with decertification_reason RETAIL_SOLD and fee_credited_cents left at 0 (the program keeps the fee on a retail sale)"
          - "increments Vehicle.version by 1"
      - from: IN_INVENTORY
        to: WHOLESALED
        trigger: "POST /cpo/vehicles/{id}/history-events with event_type WHOLESALED"
        actor: DealerPrincipal | ProgramAdministrator
        preconditions:
          - "Vehicle.inventory_state == IN_INVENTORY"
        side_effects:
          - "sets Vehicle.inventory_state = WHOLESALED, last_history_event_type = WHOLESALED, last_history_event_at = logical clock"
          - "CASCADE hop 2 (caused by the inventory_state change): any Certification WHERE vehicle_id == this Vehicle.id AND status IN {ACTIVE, UNDER_AUDIT} moves to DECERTIFIED with decertification_reason WHOLESALED, fee_credited_cents stays 0"
          - "CASCADE hop 3 (caused by hop 2): every Listing WHERE certification_id == that Certification.id AND status IN {DRAFT, SYNDICATED} moves to WITHDRAWN with withdrawal_reason CERTIFICATION_DECERTIFIED and removal_due_at = logical clock + ProgramConfig.listing_removal_sla_hours; every Complaint WHERE certification_id == that Certification.id AND status IN {OPEN, REINSPECTION_ORDERED} moves to DISMISSED with resolved_at = logical clock; Vehicle.cpo_state moves CERTIFIED -> DECERTIFIED"
          - "CASCADE hop 4 (caused by hop 3's complaint dismissal): every Inspection WHERE complaint_id == that dismissed Complaint.id AND status IN {DRAFT, IN_PROGRESS, RECONDITIONING_REQUIRED} moves to VOIDED with failure_reason COMPLAINT_DISMISSED"
          - "increments Vehicle.version by 1"
      - from: RETAIL_SOLD
        to: IN_INVENTORY
        trigger: "POST /cpo/vehicles/{id}/history-events with event_type RETURNED_TO_INVENTORY"
        actor: DealerPrincipal | ProgramAdministrator
        preconditions:
          - "Vehicle.inventory_state IN {RETAIL_SOLD, WHOLESALED}"
          - "supplied odometer_miles, when present, is >= Vehicle.odometer_miles"
        side_effects:
          - "sets Vehicle.inventory_state = IN_INVENTORY, last_history_event_type = RETURNED_TO_INVENTORY"
          - "leaves Vehicle.cpo_state untouched: a returned vehicle stays DECERTIFIED until a new inspection is opened"
          - "increments Vehicle.version by 1"
      - from: WHOLESALED
        to: IN_INVENTORY
        trigger: "POST /cpo/vehicles/{id}/history-events with event_type RETURNED_TO_INVENTORY"
        actor: DealerPrincipal | ProgramAdministrator
        preconditions:
          - "Vehicle.inventory_state IN {RETAIL_SOLD, WHOLESALED}"
        side_effects:
          - "sets Vehicle.inventory_state = IN_INVENTORY, last_history_event_type = RETURNED_TO_INVENTORY"
          - "increments Vehicle.version by 1"

  # --- ChecklistTemplate ----------------------------------------------------
  - entity: ChecklistTemplate
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /cpo/checklist-templates/{id}/publish"
        actor: ProgramAdministrator
        preconditions:
          - "ChecklistTemplate.status == DRAFT"
          - "ChecklistTemplate.point_count >= 1"
          - "ChecklistTemplate.critical_item_count >= 1"
        side_effects:
          - "sets status = PUBLISHED, published_at = logical clock"
          - "every other ChecklistTemplate WHERE status == PUBLISHED AND effective_from <= this template's effective_from moves to RETIRED"
          - "increments ChecklistTemplate.version by 1"
      - from: PUBLISHED
        to: RETIRED
        trigger: "system: another ChecklistTemplate with effective_from >= this template's effective_from is published"
        actor: system
        preconditions:
          - "ChecklistTemplate.status == PUBLISHED"
        side_effects:
          - "sets status = RETIRED; Inspection rows already created against this template keep referencing it, but no new Inspection may name it"
          - "increments ChecklistTemplate.version by 1"

  # --- Inspection (cyclic) --------------------------------------------------
  - entity: Inspection
    initial_state: DRAFT
    terminal_states: [PASSED, FAILED, VOIDED]
    note: >
      Cyclic shape: IN_PROGRESS -> RECONDITIONING_REQUIRED -> IN_PROGRESS may repeat any number of
      times, each loop bumping attempt_count so that InspectionResult rows of different attempts
      never collide.
    transitions:
      - from: DRAFT
        to: IN_PROGRESS
        trigger: "PUT /cpo/inspections/{id}/results"
        actor: InspectionTechnician
        preconditions:
          - "Inspection.status IN {DRAFT, IN_PROGRESS, RECONDITIONING_REQUIRED}"
          - "X-User-ID == Inspection.technician_id"
          - "Technician.credential_status == ACTIVE AND Technician.credential_expires_at > logical clock"
          - "every supplied item_code resolves to a ChecklistItem WHERE template_id == Inspection.template_id"
          - "for every supplied row with outcome PASS on an item declaring min_measure or max_measure, measured_value is present and within [min_measure, max_measure]"
        side_effects:
          - "increments Inspection.attempt_count by 1, then writes one InspectionResult per supplied row with attempt_index = the new attempt_count"
          - "sets status = IN_PROGRESS; recomputes recorded_item_count, failed_critical_count, failed_recon_count over the new attempt only"
          - "increments Inspection.version by 1"
      - from: IN_PROGRESS
        to: IN_PROGRESS
        trigger: "PUT /cpo/inspections/{id}/results"
        actor: InspectionTechnician
        preconditions:
          - "same preconditions as DRAFT -> IN_PROGRESS"
        side_effects:
          - "increments attempt_count and writes a fresh attempt of InspectionResult rows; earlier attempts are retained append-only"
          - "increments Inspection.version by 1"
      - from: RECONDITIONING_REQUIRED
        to: IN_PROGRESS
        trigger: "PUT /cpo/inspections/{id}/results"
        actor: InspectionTechnician
        preconditions:
          - "same preconditions as DRAFT -> IN_PROGRESS; the state of the ReconditioningItem rows is NOT checked here, it is checked at submit"
        side_effects:
          - "increments attempt_count, writes the new attempt, sets status = IN_PROGRESS"
          - "increments Inspection.version by 1"
        note: "Closes the cycle. ReconditioningItem rows generated by the previous submit survive untouched."
      - from: IN_PROGRESS
        to: FAILED
        trigger: "POST /cpo/inspections/{id}/submit"
        actor: DealerPrincipal
        preconditions:
          - "recorded_item_count == ChecklistTemplate.point_count (else ERR_INCOMPLETE_CHECKLIST)"
          - "at least one InspectionResult of the current attempt has outcome FAIL on a ChecklistItem with severity CRITICAL AND reconditioning_allowed == false"
        side_effects:
          - "sets status = FAILED, failure_reason = CRITICAL_ITEM_FAIL, submitted_at = logical clock"
          - "Vehicle.cpo_state moves CERTIFICATION_PENDING -> NOT_CERTIFIED"
          - "when Inspection.complaint_id is non-null: CASCADE hop 2 sets that Complaint to RESOLVED_DECERTIFIED with resolved_at = logical clock; hop 3 (caused by the complaint resolution) sets the Complaint's Certification from ACTIVE to DECERTIFIED with decertification_reason COMPLAINT_REINSPECTION_FAIL and fee_credited_cents 0; hop 4 (caused by that decertification) withdraws every Listing of that certification with withdrawal_reason CERTIFICATION_DECERTIFIED plus removal_due_at, and moves Vehicle.cpo_state to DECERTIFIED"
          - "increments Inspection.version by 1"
      - from: IN_PROGRESS
        to: RECONDITIONING_REQUIRED
        trigger: "POST /cpo/inspections/{id}/submit"
        actor: DealerPrincipal
        preconditions:
          - "recorded_item_count == ChecklistTemplate.point_count"
          - "no FAIL of the current attempt sits on a CRITICAL item with reconditioning_allowed == false"
          - "failed_recon_count >= 1"
        side_effects:
          - "sets status = RECONDITIONING_REQUIRED"
          - "for every FAIL of the current attempt on an item with reconditioning_allowed == true that has no ReconditioningItem row yet for this inspection, creates a ReconditioningItem in status REQUIRED with severity copied from the item; generation is idempotent across attempts on item_code"
          - "increments Inspection.version by 1"
      - from: IN_PROGRESS
        to: PASSED
        trigger: "POST /cpo/inspections/{id}/submit"
        actor: DealerPrincipal
        preconditions:
          - "recorded_item_count == ChecklistTemplate.point_count"
          - "no FAIL exists in the current attempt"
          - "no ReconditioningItem of this inspection remains in status REQUIRED (else ERR_RECONDITIONING_INCOMPLETE)"
        side_effects:
          - "sets status = PASSED, submitted_at = logical clock"
          - "recomputes total_recon_cost_cents and total_reimbursable_cents per calculations.reconditioning_reimbursement"
          - "increments Technician.completed_inspection_count by 1"
          - "when Inspection.complaint_id is non-null: CASCADE hop 2 sets that Complaint to RESOLVED_UPHELD with resolved_at = logical clock; the Certification keeps status ACTIVE"
          - "increments Inspection.version by 1"
      - from: DRAFT
        to: VOIDED
        trigger: "system: a new Inspection is created with parent_inspection_id == this Inspection.id"
        actor: system
        preconditions:
          - "Inspection.status IN {DRAFT, IN_PROGRESS, RECONDITIONING_REQUIRED}"
        side_effects:
          - "sets status = VOIDED, failure_reason = SUPERSEDED_BY_REINSPECTION"
          - "increments Inspection.version by 1"
      - from: IN_PROGRESS
        to: VOIDED
        trigger: "system: a new Inspection is created with parent_inspection_id == this Inspection.id, or the Complaint named by complaint_id is DISMISSED by a decertification cascade"
        actor: system
        preconditions:
          - "Inspection.status IN {DRAFT, IN_PROGRESS, RECONDITIONING_REQUIRED}"
        side_effects:
          - "sets status = VOIDED and failure_reason = SUPERSEDED_BY_REINSPECTION (superseding create) or COMPLAINT_DISMISSED (complaint cascade)"
          - "increments Inspection.version by 1"
      - from: RECONDITIONING_REQUIRED
        to: VOIDED
        trigger: "system: a new Inspection is created with parent_inspection_id == this Inspection.id, or the Complaint named by complaint_id is DISMISSED by a decertification cascade"
        actor: system
        preconditions:
          - "Inspection.status IN {DRAFT, IN_PROGRESS, RECONDITIONING_REQUIRED}"
        side_effects:
          - "sets status = VOIDED with the corresponding failure_reason; open ReconditioningItem rows stay REQUIRED and become unreachable"
          - "increments Inspection.version by 1"

  # --- ReconditioningItem ---------------------------------------------------
  - entity: ReconditioningItem
    initial_state: REQUIRED
    terminal_states: [COMPLETED, WAIVED]
    transitions:
      - from: REQUIRED
        to: COMPLETED
        trigger: "POST /cpo/reconditioning-items/{id}/complete with resolution COMPLETED"
        actor: InspectionTechnician
        preconditions:
          - "ReconditioningItem.status == REQUIRED"
          - "Inspection.status IN {RECONDITIONING_REQUIRED, IN_PROGRESS}"
          - "X-User-ID resolves to a Technician whose dealer_id == Inspection.dealer_id"
          - "X-User-ID != Inspection.technician_id (segregation of duties: the inspecting technician may not sign off the repair)"
          - "actual_cost_cents is present and <= the resolved ChecklistItem.max_reconditioning_cost_cents"
        side_effects:
          - "sets status = COMPLETED, actual_cost_cents, completed_at = logical clock, closed_by_user_id = X-User-ID"
          - "sets reimbursable_cents = min(round_half_up(actual_cost_cents * ProgramConfig.recon_reimbursement_share), ChecklistItem.max_reconditioning_cost_cents)"
          - "recomputes Inspection.total_recon_cost_cents and Inspection.total_reimbursable_cents"
          - "increments ReconditioningItem.version and Inspection.version by 1 each"
      - from: REQUIRED
        to: WAIVED
        trigger: "POST /cpo/reconditioning-items/{id}/complete with resolution WAIVED"
        actor: ProgramAdministrator
        preconditions:
          - "ReconditioningItem.status == REQUIRED"
          - "ReconditioningItem.severity != CRITICAL (a critical repair can never be waived)"
          - "waiver_reason is present and non-empty"
        side_effects:
          - "sets status = WAIVED, waiver_reason, completed_at = logical clock, closed_by_user_id = the opaque operator id; actual_cost_cents stays null and reimbursable_cents stays 0"
          - "increments ReconditioningItem.version and Inspection.version by 1 each"

  # --- Certification (branching + audit cycle) ------------------------------
  - entity: Certification
    initial_state: SUBMITTED
    terminal_states: [REJECTED, SUPERSEDED, DECERTIFIED]
    note: >
      Branching fork at SUBMITTED with divergent side-effect sets per branch (ACTIVE bills the fee
      and computes coverage; REJECTED releases the vehicle slot and writes nothing financial;
      SUPERSEDED is slot-neutral), plus the ACTIVE -> UNDER_AUDIT -> ACTIVE audit cycle.
    transitions:
      - from: SUBMITTED
        to: SUPERSEDED
        trigger: "system: a newer Certification is created for the same vehicle_id"
        actor: system
        preconditions:
          - "Certification.status == SUBMITTED"
          - "the incoming submission passed OCC on Vehicle.version"
        side_effects:
          - "sets status = SUPERSEDED; the vehicle certification slot it occupied is handed to the new row in the same request, so Vehicle.active_certification_count is unchanged at 1"
          - "increments Certification.version by 1"
      - from: SUBMITTED
        to: ACTIVE
        trigger: "POST /cpo/certifications/{id}/approve with decision APPROVE"
        actor: ProgramAdministrator
        preconditions:
          - "Certification.status == SUBMITTED"
          - "Dealer.privilege_status IN {ACTIVE, PROBATION}"
          - "Vehicle.title_brand NOT IN ProgramConfig.ineligible_title_brands and Vehicle.prior_use NOT IN ProgramConfig.ineligible_prior_uses, re-evaluated against the vehicle's state at approval time"
          - "Vehicle.inventory_state == IN_INVENTORY (else ERR_VEHICLE_NOT_IN_INVENTORY)"
          - "the computed coverage interval [warranty_start_date, warranty_end_date) is non-empty (else ERR_NO_COVERAGE_REMAINING)"
          - "the computed coverage interval does not overlap any retained interval on the same vehicle (else ERR_COVERAGE_WINDOW_OVERLAP)"
        side_effects:
          - "pins program_config_version = ProgramConfig.version"
          - "computes fee_surcharge_cents, fee_discount_cents and fee_charged_cents per calculations.certification_fee"
          - "computes warranty_anchor_variant, warranty_start_date, warranty_end_date, warranty_end_miles per calculations.warranty_coverage, and retention_expires_at = warranty_end_date + doc_retention_years"
          - "writes retained_until = retention_expires_at onto every CertificationDocument of this certification"
          - "sets status = ACTIVE, activated_at = logical clock"
          - "Vehicle.cpo_state moves CERTIFICATION_PENDING -> CERTIFIED and Vehicle.certified_certification_id = this id"
          - "recomputes Dealer.lifetime_activated_count, window_activated_count, fee_billed_cents_total, fee_balance_cents, claim_ratio_effective and risk_score"
          - "increments Certification.version and Vehicle.version by 1 each"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /cpo/certifications/{id}/approve with decision REJECT, or the dealer-suspension cascade"
        actor: ProgramAdministrator | system
        preconditions:
          - "Certification.status == SUBMITTED"
        side_effects:
          - "sets status = REJECTED and rejection_reason = ADMIN_DECISION for the explicit call, DEALER_SUSPENDED for the cascade; activated_at stays null and no fee is billed"
          - "recomputes Vehicle.active_certification_count to 0 and moves Vehicle.cpo_state CERTIFICATION_PENDING -> NOT_CERTIFIED"
          - "recomputes Dealer.active_certification_count"
          - "increments Certification.version and Vehicle.version by 1 each"
      - from: ACTIVE
        to: UNDER_AUDIT
        trigger: "POST /cpo/audit-runs selecting this certification"
        actor: ProgramAuditor
        preconditions:
          - "Certification.status == ACTIVE"
          - "Certification.audit_sampled == false"
          - "Dealer.privilege_status IN {ACTIVE, PROBATION}"
        side_effects:
          - "creates an AuditSample in status SELECTED with audit_run_id and selection_rank"
          - "sets audit_sampled = true, status = UNDER_AUDIT"
          - "recomputes Dealer.audit_sample_count, audit_fail_rate and risk_score"
          - "increments Certification.version by 1"
      - from: UNDER_AUDIT
        to: ACTIVE
        trigger: "POST /cpo/audit-samples/{id}/finding with finding PASS"
        actor: ProgramAuditor
        preconditions:
          - "AuditSample.status == SELECTED"
          - "Certification.status == UNDER_AUDIT"
        side_effects:
          - "sets AuditSample.status = PASSED, finding_code = NONE unless supplied, reviewed_at, reviewer_user_id"
          - "returns Certification.status to ACTIVE with activated_at, fee and coverage fields untouched"
          - "increments Certification.version and AuditSample.version by 1 each"
        note: "Cycle: a certification may be audited, cleared and audited again only after audit_sampled is reset, which never happens, so each certification is sampled at most once."
      - from: UNDER_AUDIT
        to: DECERTIFIED
        trigger: "POST /cpo/audit-samples/{id}/finding with finding FAIL"
        actor: ProgramAuditor
        preconditions:
          - "AuditSample.status == SELECTED"
          - "Certification.status == UNDER_AUDIT"
        side_effects:
          - "CASCADE hop 1: AuditSample.status = FAILED with finding_code, reviewed_at, reviewer_user_id; Dealer.audit_fail_count and audit_fail_rate recomputed"
          - "CASCADE hop 2 (caused by the sample failing): status = DECERTIFIED, decertification_reason = POST_AUDIT_FAIL, decertified_at = logical clock, fee_credited_cents = fee_charged_cents; Dealer.fee_credited_cents_total and Dealer.fee_balance_cents recomputed"
          - "CASCADE hop 3 (caused by hop 2): Vehicle.cpo_state CERTIFIED -> DECERTIFIED, Vehicle.certified_certification_id = null; every Listing of this certification in {DRAFT, SYNDICATED} -> WITHDRAWN with withdrawal_reason CERTIFICATION_DECERTIFIED and removal_due_at = clock + listing_removal_sla_hours; every Complaint of this certification in {OPEN, REINSPECTION_ORDERED} -> DISMISSED"
          - "CASCADE hop 4 (caused by hop 1's counter reaching the threshold): when Dealer.audit_fail_count >= ProgramConfig.audit_fail_suspension_count, Dealer.privilege_status -> SUSPENDED with privilege_reason AUDIT_FAILURE_SUSPENSION"
          - "CASCADE hop 5 (caused by hop 4): every Certification of that dealer with status == SUBMITTED -> REJECTED with rejection_reason DEALER_SUSPENDED (each releasing its vehicle's slot), and every Listing of that dealer with status == SYNDICATED -> WITHDRAWN with withdrawal_reason DEALER_SUSPENDED"
          - "increments Certification.version, AuditSample.version, Vehicle.version and Dealer.version by 1 each"
      - from: ACTIVE
        to: DECERTIFIED
        trigger: "POST /cpo/certifications/{id}/decertify, or a vehicle history event (RETAIL_SOLD, WHOLESALED, TITLE_BRANDED), or a failed complaint re-inspection"
        actor: ProgramAdministrator | system
        preconditions:
          - "Certification.status IN {ACTIVE, UNDER_AUDIT}"
        side_effects:
          - "sets status = DECERTIFIED, decertification_reason to the triggering reason, decertified_at = logical clock"
          - "credits the fee (fee_credited_cents = fee_charged_cents) only when decertification_reason == POST_AUDIT_FAIL; every other reason leaves fee_credited_cents at 0"
          - "Vehicle.cpo_state CERTIFIED -> DECERTIFIED; Listings withdrawn with removal_due_at; open Complaints dismissed unless the reason is COMPLAINT_REINSPECTION_FAIL, in which case the complaint is already RESOLVED_DECERTIFIED"
          - "recomputes Dealer.active_certification_count, fee_credited_cents_total, fee_balance_cents"
          - "increments Certification.version and Vehicle.version by 1 each"
      - from: UNDER_AUDIT
        to: DECERTIFIED
        trigger: "POST /cpo/certifications/{id}/decertify, or a vehicle history event while the audit is still open"
        actor: ProgramAdministrator | system
        preconditions:
          - "Certification.status == UNDER_AUDIT"
        side_effects:
          - "same as the ACTIVE -> DECERTIFIED side-effect set; the open AuditSample stays SELECTED and can no longer receive a finding"
          - "increments Certification.version and Vehicle.version by 1 each"

  # --- AuditSample ----------------------------------------------------------
  - entity: AuditSample
    initial_state: SELECTED
    terminal_states: [PASSED, FAILED]
    transitions:
      - from: SELECTED
        to: PASSED
        trigger: "POST /cpo/audit-samples/{id}/finding with finding PASS"
        actor: ProgramAuditor
        preconditions:
          - "AuditSample.status == SELECTED"
          - "the parent Certification.status == UNDER_AUDIT"
        side_effects:
          - "records the finding and returns the certification to ACTIVE (see Certification UNDER_AUDIT -> ACTIVE)"
      - from: SELECTED
        to: FAILED
        trigger: "POST /cpo/audit-samples/{id}/finding with finding FAIL"
        actor: ProgramAuditor
        preconditions:
          - "AuditSample.status == SELECTED"
          - "the parent Certification.status == UNDER_AUDIT"
          - "finding_code is present and != NONE"
        side_effects:
          - "records the finding and drives the five-hop decertification cascade (see Certification UNDER_AUDIT -> DECERTIFIED)"

  # --- Listing --------------------------------------------------------------
  - entity: Listing
    initial_state: DRAFT
    terminal_states: [WITHDRAWN]
    transitions:
      - from: DRAFT
        to: SYNDICATED
        trigger: "POST /cpo/listings/{id}/syndicate"
        actor: DealerPrincipal
        preconditions:
          - "Listing.status IN {DRAFT, SYNDICATED}"
          - "Certification.status == ACTIVE"
          - "expected_certification_version == Certification.version (else ERR_STALE_CERTIFICATION_VERSION)"
          - "Listing.disclosure_fields is a superset of ProgramConfig.listing_required_disclosure_fields"
          - "when channel == THIRD_PARTY_AGGREGATOR, Dealer.privilege_status == ACTIVE (PROBATION dealers may only syndicate to OEM_SITE and DEALER_SITE)"
        side_effects:
          - "sets status = SYNDICATED, syndicated_at = logical clock, syndicated_snapshot_version = Certification.version as observed after the increment below"
          - "sets Certification.listing_syndicated_at = logical clock and increments Certification.version by 1"
          - "increments Listing.version by 1"
      - from: SYNDICATED
        to: SYNDICATED
        trigger: "POST /cpo/listings/{id}/syndicate"
        actor: DealerPrincipal
        preconditions:
          - "same preconditions as DRAFT -> SYNDICATED"
        side_effects:
          - "refreshes syndicated_at and syndicated_snapshot_version so the published content matches the current certification generation"
          - "sets Certification.listing_syndicated_at and increments Certification.version by 1"
          - "increments Listing.version by 1"
        note: "Re-syndication legitimately supersedes the previous published snapshot, which is what makes the OCC guard on Certification.version meaningful."
      - from: SYNDICATED
        to: WITHDRAWN
        trigger: "system: the certification is decertified, or the dealer is suspended"
        actor: system
        preconditions:
          - "Listing.status IN {DRAFT, SYNDICATED}"
        side_effects:
          - "sets status = WITHDRAWN, withdrawn_at = logical clock, withdrawal_reason = CERTIFICATION_DECERTIFIED or DEALER_SUSPENDED, removal_due_at = withdrawn_at + ProgramConfig.listing_removal_sla_hours"
          - "increments Listing.version by 1"
      - from: DRAFT
        to: WITHDRAWN
        trigger: "system: the certification is decertified, or the dealer is suspended"
        actor: system
        preconditions:
          - "Listing.status IN {DRAFT, SYNDICATED}"
        side_effects:
          - "same as SYNDICATED -> WITHDRAWN; removal_due_at is still written even though nothing was published, so the takedown SLA is auditable"
          - "increments Listing.version by 1"

  # --- WarrantyClaim --------------------------------------------------------
  - entity: WarrantyClaim
    initial_state: SUBMITTED
    terminal_states: [APPROVED, DENIED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /cpo/warranty-claims/{id}/adjudicate with decision APPROVE"
        actor: ProgramAdministrator
        preconditions:
          - "WarrantyClaim.status == SUBMITTED"
          - "Certification.status IN {ACTIVE, UNDER_AUDIT, DECERTIFIED} (a retail sale does not void an in-window claim)"
        side_effects:
          - "STEP 1 pins dealer_ratio_snapshot_before = Dealer.claim_ratio_effective as read BEFORE this claim is counted"
          - "STEP 2 computes approved_amount_cents per calculations.claim_reimbursement using that snapshot"
          - "STEP 3 sets status = APPROVED, adjudicated_at = logical clock; recomputes Certification.approved_claim_count and approved_claim_amount_cents"
          - "STEP 4 recomputes Dealer.approved_claim_count_lifetime, approved_claim_count_window, claim_ratio_variant, claim_ratio_effective and risk_score"
          - "STEP 5 re-evaluates the privilege thresholds: claim_ratio_effective >= claim_ratio_suspension_threshold -> privilege_status SUSPENDED with privilege_reason CLAIM_RATIO_SUSPENSION; else >= claim_ratio_probation_threshold -> PROBATION with CLAIM_RATIO_PROBATION; else unchanged"
          - "STEP 6 (only when STEP 5 produced SUSPENDED) every Certification of that dealer with status == SUBMITTED -> REJECTED with rejection_reason DEALER_SUSPENDED, and every Listing of that dealer with status == SYNDICATED -> WITHDRAWN with withdrawal_reason DEALER_SUSPENDED"
          - "increments WarrantyClaim.version and Dealer.version by 1 each"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /cpo/warranty-claims/{id}/adjudicate with decision DENY"
        actor: ProgramAdministrator
        preconditions:
          - "WarrantyClaim.status == SUBMITTED"
          - "denial_reason is present"
        side_effects:
          - "sets status = DENIED, denial_reason, adjudicated_at = logical clock, approved_amount_cents stays 0"
          - "leaves every Dealer counter untouched: only APPROVED claims enter the claim ratio"
          - "increments WarrantyClaim.version by 1"

  # --- Complaint ------------------------------------------------------------
  - entity: Complaint
    initial_state: OPEN
    terminal_states: [RESOLVED_UPHELD, RESOLVED_DECERTIFIED, DISMISSED]
    transitions:
      - from: OPEN
        to: REINSPECTION_ORDERED
        trigger: "POST /cpo/inspections with complaint_id set to this Complaint.id"
        actor: DealerPrincipal
        preconditions:
          - "Complaint.status == OPEN"
          - "logical clock <= Complaint.reinspection_deadline_at (else ERR_REINSPECTION_DEADLINE_PASSED)"
          - "the new Inspection.vehicle_id == the Complaint's Certification.vehicle_id"
          - "the new Inspection.technician_id != the technician_id of the Inspection that backs the complained-about Certification (segregation of duties)"
        side_effects:
          - "sets status = REINSPECTION_ORDERED, reinspection_ordered_at = logical clock"
          - "creates the Inspection with purpose RE_INSPECTION; Vehicle.cpo_state stays CERTIFIED because the certification is still ACTIVE during a re-inspection"
          - "increments Complaint.version by 1"
      - from: REINSPECTION_ORDERED
        to: RESOLVED_UPHELD
        trigger: "POST /cpo/inspections/{id}/submit on the re-inspection resolving to PASSED"
        actor: DealerPrincipal
        preconditions:
          - "Complaint.status == REINSPECTION_ORDERED"
        side_effects:
          - "sets status = RESOLVED_UPHELD, resolved_at = logical clock; the certification remains ACTIVE and its coverage fields are untouched"
          - "increments Complaint.version by 1"
      - from: REINSPECTION_ORDERED
        to: RESOLVED_DECERTIFIED
        trigger: "POST /cpo/inspections/{id}/submit on the re-inspection resolving to FAILED"
        actor: DealerPrincipal
        preconditions:
          - "Complaint.status == REINSPECTION_ORDERED"
        side_effects:
          - "sets status = RESOLVED_DECERTIFIED, resolved_at = logical clock"
          - "drives the certification to DECERTIFIED with decertification_reason COMPLAINT_REINSPECTION_FAIL and the downstream listing/vehicle cascade"
          - "increments Complaint.version by 1"
      - from: OPEN
        to: DISMISSED
        trigger: "system: the complained-about Certification is decertified for a reason other than COMPLAINT_REINSPECTION_FAIL"
        actor: system
        preconditions:
          - "Complaint.status IN {OPEN, REINSPECTION_ORDERED}"
        side_effects:
          - "sets status = DISMISSED, resolved_at = logical clock"
          - "increments Complaint.version by 1"
      - from: REINSPECTION_ORDERED
        to: DISMISSED
        trigger: "system: the complained-about Certification is decertified for a reason other than COMPLAINT_REINSPECTION_FAIL"
        actor: system
        preconditions:
          - "Complaint.status IN {OPEN, REINSPECTION_ORDERED}"
        side_effects:
          - "sets status = DISMISSED, resolved_at = logical clock"
          - "every Inspection with complaint_id == this Complaint.id and status IN {DRAFT, IN_PROGRESS, RECONDITIONING_REQUIRED} moves to VOIDED with failure_reason COMPLAINT_DISMISSED"
          - "increments Complaint.version by 1"

# =============================================================================
# 1.2.1 Concurrency Rules (OCC on the parent's `version` only)
# =============================================================================
concurrency_rules:
  - rule_id: certification-create-stale-vehicle
    parent_entity: Vehicle
    write_endpoint: "POST /cpo/certifications"
    occ_field: "expected_vehicle_version"
    description: |
      A certification submission whose expected_vehicle_version does not equal the vehicle's current
      version is rejected. The guard exists because a submission legitimately supersedes an earlier
      SUBMITTED certification on the same vehicle: a writer holding a stale view of the vehicle
      would silently displace a submission it never saw, and would also miss any history event
      (odometer update, title brand) recorded since it last read the vehicle.
    error_id: ERR_STALE_VEHICLE_VERSION
    http_status: 412
  - rule_id: listing-syndicate-stale-certification
    parent_entity: Certification
    write_endpoint: "POST /cpo/listings/{id}/syndicate"
    occ_field: "expected_certification_version"
    description: |
      Syndicating a listing whose expected_certification_version does not equal the certification's
      current version is rejected. Re-syndication legitimately replaces the previously published
      snapshot, so a writer working from a stale certification generation would publish superseded
      fee, warranty or audit content under a fresh syndicated_at timestamp.
    error_id: ERR_STALE_CERTIFICATION_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: certification_fee
    trigger: "Certification SUBMITTED -> ACTIVE (POST /cpo/certifications/{id}/approve with decision APPROVE)"
    algorithm: tiered_pricing
    formula: |
      cfg = the ProgramConfig generation pinned as Certification.program_config_version
      age_days   = whole days between Vehicle.in_service_date and date(Certification.activated_at)
      age_years  = floor(age_days / 365)
      age_over   = max(0, age_years - cfg.age_surcharge_free_years)
      miles_over = max(0, Inspection.odometer_at_inspection - cfg.mileage_surcharge_free_miles)
      blocks     = floor(miles_over / 10000)
      raw_surcharge = age_over * cfg.age_surcharge_cents_per_year
                    + blocks   * cfg.mileage_surcharge_cents_per_10k
      surcharge_cap = floor(cfg.base_fee_cents * cfg.surcharge_cap_pct)
      fee_surcharge_cents = min(raw_surcharge, surcharge_cap)
      subtotal  = cfg.base_fee_cents + fee_surcharge_cents
      tier      = the entry of cfg.volume_discount_tiers with the greatest min_count that is
                  <= Dealer.lifetime_activated_count as read BEFORE this activation
      fee_discount_cents = floor(subtotal * tier.pct)
      fee_charged_cents  = subtotal - fee_discount_cents
      EVALUATION ORDER IS PINNED: the surcharge cap is applied BEFORE the subtotal is formed, and the
      volume discount is always computed on the capped subtotal, never on the uncapped surcharge sum.
    input_set: >
      Exactly one Vehicle (the certification's vehicle, read at approval time), exactly one
      Inspection (the PASSED inspection named by inspection_id, whose odometer_at_inspection is the
      mileage input, not Vehicle.odometer_miles), and the certifying Dealer's
      lifetime_activated_count as it stands immediately before this approval increments it.
    constants:
      DAYS_PER_AGE_YEAR: 365
      MILEAGE_BLOCK_MILES: 10000
    precision: "integer cents; every division uses floor, no intermediate rounding to dollars"
    variants: []

  - name: reconditioning_reimbursement
    trigger: "ReconditioningItem REQUIRED -> COMPLETED, and again on Inspection IN_PROGRESS -> PASSED"
    algorithm: aggregation
    formula: |
      per_item(r) = min( round_half_up(r.actual_cost_cents * cfg.recon_reimbursement_share),
                         ChecklistItem.max_reconditioning_cost_cents )
      ROUNDING ORDER IS PINNED: round each ReconditioningItem's share to whole cents FIRST, then sum
      the rounded per-item amounts. Summing the raw costs and rounding once is WRONG and produces a
      different total (e.g. three items at 1001 cents give 601+601+601 = 1803, not
      round_half_up(3003 * 0.60) = 1802).
      sum_items = sum of per_item(r) over ReconditioningItem r
                  WHERE r.inspection_id == Inspection.id AND r.status == COMPLETED,
                  iterated in r.created_at ASC order (ties impossible: creation is serialized)
      Inspection.total_reimbursable_cents = min(sum_items, cfg.recon_reimbursement_cap_cents)
      WAIVED rows contribute 0 and never enter the sum.
    input_set: "ReconditioningItem rows of one Inspection with status == COMPLETED; REQUIRED and WAIVED rows are excluded."
    constants:
      ROUNDING_ORDER: "per_item_then_sum"
    precision: "2 decimal places at the cent level, round_half_up, applied per item before summation"
    variants: []

  - name: warranty_coverage
    trigger: "Certification SUBMITTED -> ACTIVE (POST /cpo/certifications/{id}/approve with decision APPROVE)"
    algorithm: interval_merge
    formula: |
      cfg = the ProgramConfig generation pinned as Certification.program_config_version
      factory_expiry_date = Vehicle.in_service_date + cfg.factory_basic_months calendar months
                            (calendar-month addition, clamped to the last day of the target month)
      activation_date     = date(Certification.activated_at)
      odo                 = Inspection.odometer_at_inspection
      factory_still_active = (activation_date < factory_expiry_date) AND (odo < cfg.factory_basic_miles)

      warranty_start_date = factory_expiry_date  when factory_still_active   # IN_SERVICE_ANCHORED
                          = activation_date      otherwise                   # CERTIFICATION_ANCHORED

      raw_end_date        = warranty_start_date + cfg.warranty_extension_months calendar months
      cap_end_date        = Vehicle.in_service_date + cfg.warranty_total_cap_months calendar months
      warranty_end_date   = min(raw_end_date, cap_end_date)

      raw_end_miles       = odo + cfg.warranty_extension_miles
      warranty_end_miles  = min(raw_end_miles, cfg.warranty_total_cap_miles)

      retention_expires_at = warranty_end_date + cfg.doc_retention_years calendar years
      The coverage interval is HALF-OPEN [warranty_start_date, warranty_end_date): the end date is
      the first uncovered day. When warranty_end_date <= warranty_start_date, or
      warranty_end_miles <= odo, the approval is rejected with ERR_NO_COVERAGE_REMAINING.
    input_set: "One Vehicle (in_service_date), one Inspection (odometer_at_inspection), one pinned ProgramConfig generation, and the approval instant."
    constants:
      INTERVAL_SEMANTICS: "half_open_start_inclusive_end_exclusive"
    precision: "whole calendar days for dates, whole miles for odometer bounds"
    variants:
      - name: in_service_anchored
        when: "activation_date < in_service_date + factory_basic_months AND odometer_at_inspection < factory_basic_miles — the factory basic warranty has not lapsed on either axis"
        difference: "warranty_start_date is the factory expiry date, so the CPO extension is contiguous with factory coverage and starts in the future; warranty_end_date is factory_expiry + extension_months, which is strictly later than the certification-anchored answer for the same vehicle."
      - name: certification_anchored
        when: "the factory basic warranty has lapsed on either the time axis or the mileage axis"
        difference: "warranty_start_date is the activation date, so coverage starts immediately and ends extension_months after activation; for a vehicle sitting exactly at the factory boundary the two variants differ by the remaining factory term."

  - name: dealer_claim_ratio
    trigger: "Certification SUBMITTED -> ACTIVE, WarrantyClaim SUBMITTED -> APPROVED, and any Certification transition into DECERTIFIED"
    algorithm: weighted_scoring
    formula: |
      variant = TRAILING_WINDOW      when Dealer.lifetime_activated_count >= cfg.claim_variant_volume_floor
              = LIFETIME_CUMULATIVE  otherwise
      TRAILING_WINDOW:
        claim_ratio_effective = round_half_up(
            Dealer.approved_claim_count_window / max(1, Dealer.window_activated_count), 2)
      LIFETIME_CUMULATIVE:
        claim_ratio_effective = round_half_up(
            Dealer.approved_claim_count_lifetime / max(1, Dealer.lifetime_activated_count), 2)
      Both window counters use the inclusive interval [date(logical clock) - cfg.claim_window_days,
      date(logical clock)] evaluated against Certification.activated_at and WarrantyClaim.repair_date
      respectively.
    input_set: >
      Certifications of one Dealer that have ever been activated (DECERTIFIED rows stay in the
      denominator: decertifying a vehicle must not flatter the dealer's claim behaviour), and
      WarrantyClaim rows with status == APPROVED whose certification belongs to that dealer. SUBMITTED
      and DENIED claims are excluded from both variants.
    constants:
      RATIO_DECIMALS: 2
    precision: "2 decimal places, round_half_up"
    variants:
      - name: lifetime_cumulative
        when: "Dealer.lifetime_activated_count < cfg.claim_variant_volume_floor"
        difference: "Denominator is every activation the dealer has ever had and the numerator every approved claim ever, so old claims never age out; a dealer with 1 approved claim over 2 lifetime activations scores 0.50."
      - name: trailing_window
        when: "Dealer.lifetime_activated_count >= cfg.claim_variant_volume_floor"
        difference: "Denominator and numerator are restricted to the trailing claim_window_days, so the identical dealer with both the claim and one activation outside the window scores 0.00 on the same underlying rows."

  - name: claim_reimbursement
    trigger: "WarrantyClaim SUBMITTED -> APPROVED (POST /cpo/warranty-claims/{id}/adjudicate with decision APPROVE)"
    algorithm: constraint_propagation
    formula: |
      This calculation looks circular: the reimbursement share is keyed on the dealer's claim ratio,
      but the claim ratio counts the very claim being reimbursed. The evaluation order below is
      normative and makes the value well-defined.
      STEP 1  dealer_ratio_snapshot_before = Dealer.claim_ratio_effective, read BEFORE this claim is
              counted anywhere.
      STEP 2  remaining = max(0, cfg.claim_per_claim_cap_cents - Certification.approved_claim_amount_cents)
              capped    = min(WarrantyClaim.claimed_amount_cents, remaining)
              The cap is BOTH a per-claim ceiling — enforced at filing time by validations[priority=33]
              — AND a per-certification lifetime ceiling enforced here: two individually legal claims on
              one certification may collectively exhaust it, and the later one is trimmed to what is
              left. The trim happens BEFORE the probation share, never after.
      STEP 3  share  = cfg.probation_claim_share  when dealer_ratio_snapshot_before >= cfg.claim_ratio_probation_threshold
                     = 1.00                       otherwise
      STEP 4  approved_amount_cents = floor(capped * share)
      STEP 5  only now recompute Dealer.approved_claim_count_lifetime / _window,
              claim_ratio_variant, claim_ratio_effective and risk_score with this claim included.
      STEP 6  only now re-evaluate the privilege thresholds against the post-claim ratio.
      A dealer therefore never has this claim's own effect on its ratio reduce this claim's payout,
      and the very next claim does feel it.
    input_set: "One WarrantyClaim, the certifying Dealer's pre-claim claim_ratio_effective, and the pinned per-claim cap from the live ProgramConfig."
    constants:
      EVALUATION_ORDER: "snapshot_then_pay_then_recount_then_threshold"
    precision: "integer cents, floor on the share multiplication"
    variants: []

  - name: dealer_risk_score
    trigger: "any recomputation of Dealer.claim_ratio_effective or Dealer.audit_fail_rate"
    algorithm: weighted_scoring
    formula: |
      audit_fail_rate = round_half_up(Dealer.audit_fail_count / max(1, Dealer.audit_sample_count), 2)
      risk_score = min(100, round_half_up( claim_ratio_effective * 100 * 0.60
                                         + audit_fail_rate       * 100 * 0.40 ))
    input_set: "The dealer's own counters only; no cross-dealer normalization."
    constants:
      CLAIM_WEIGHT: 0.60
      AUDIT_WEIGHT: 0.40
      SCORE_CEILING: 100
    precision: "integer 0..100, round_half_up after the weighted sum"
    variants: []

  - name: audit_sample_selection
    trigger: "POST /cpo/audit-runs"
    algorithm: threshold
    formula: |
      pool = every Certification WHERE status == ACTIVE
                                  AND audit_sampled == false
                                  AND activated_at <= logical clock
                                  AND its Dealer.privilege_status IN {ACTIVE, PROBATION}
      ranking (eligibility filter, sort key, tie-break, all over entity fields):
        1. Dealer.risk_score DESC
        2. Certification.activated_at ASC
        3. Certification.created_at ASC        # final tie-break; Certification.id is never consulted
      select_count = min( len(pool),
                          max( cfg.audit_sample_min_per_run,
                               ceil(cfg.audit_sample_pct * len(pool)) ) )
      EMPTY-POOL FALLBACK: len(pool) == 0 yields select_count 0, zero AuditSample rows, and a
      successful 201 response with selected_count 0 — never an error.
      selection_rank is the 1-based position in the ranked order.
    input_set: "ACTIVE, never-before-sampled certifications whose dealer is not SUSPENDED; SUBMITTED, UNDER_AUDIT, REJECTED, SUPERSEDED and DECERTIFIED rows are excluded."
    constants:
      CEIL_MODE: "ceil"
    precision: "integer counts; ceil on the percentage, then clamped by the pool size"
    variants: []

  - name: vehicle_coverage_overlap
    trigger: "Certification SUBMITTED -> ACTIVE, immediately after warranty_coverage produces the candidate interval"
    algorithm: interval_merge
    formula: |
      retained = every Certification WHERE vehicle_id == this Vehicle.id
                   AND id != the candidate certification
                   AND ( status IN {ACTIVE, UNDER_AUDIT}
                         OR (status == DECERTIFIED AND decertification_reason == RETAIL_SOLD) )
      Rationale for the DECERTIFIED clause: a retail sale ends the dealer's certification but the
      coverage the customer bought survives on the vehicle, so its interval is still occupied.
      Every interval, candidate and retained alike, is HALF-OPEN [warranty_start_date, warranty_end_date).
      conflict iff  candidate_start < retained_end  AND  retained_start < candidate_end
      ADJACENCY IS ALLOWED: candidate_start == retained_end is not a conflict, and neither is
      candidate_end == retained_start.
      A conflict rejects the approval with ERR_COVERAGE_WINDOW_OVERLAP.
    input_set: "Certifications of one Vehicle in {ACTIVE, UNDER_AUDIT} plus those DECERTIFIED with reason RETAIL_SOLD; REJECTED, SUPERSEDED and all other DECERTIFIED reasons release their interval."
    constants:
      INTERVAL_SEMANTICS: "half_open_adjacency_allowed"
    precision: "whole calendar days"
    variants: []

  - name: technician_slot_overlap
    trigger: "POST /cpo/inspections"
    algorithm: interval_merge
    formula: |
      occupied = every Inspection WHERE technician_id == the requested Technician.id
                   AND status != VOIDED
                   AND id != the candidate
      buffered(i) = [ i.started_at - cfg.technician_buffer_minutes ,
                      i.started_at + cfg.inspection_slot_minutes + cfg.technician_buffer_minutes ]
      Every buffered interval is CLOSED on both ends.
      conflict iff  candidate_lo <= occupied_hi  AND  occupied_lo <= candidate_hi
      ADJACENCY IS FORBIDDEN: two buffered intervals that touch at a single instant conflict, which
      is the opposite of vehicle_coverage_overlap's half-open treatment. With the defaults, an
      inspection at 09:00 occupies [08:30, 11:30]; a second inspection by the same technician at
      12:00 buffers to [11:30, 14:30], touches at 11:30 and is REJECTED, while 12:01 buffers to
      [11:31, 14:31] and is ACCEPTED.
      A conflict rejects the creation with ERR_TECHNICIAN_SLOT_CONFLICT.
    input_set: "All non-VOIDED inspections of one Technician regardless of dealer, certification outcome or age; VOIDED inspections release their slot."
    constants:
      INTERVAL_SEMANTICS: "closed_buffered_adjacency_forbidden"
    precision: "whole minutes"
    variants: []

# =============================================================================
# 1.4 Validation Rules Table (evaluated strictly in ascending priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and X-User-Role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "the acting role appears in the endpoint's roles list, and — for the two operations whose 1.7 exclusivity is scoped to a request variant rather than to the whole endpoint — the acting role owns the requested variant: POST /cpo/reconditioning-items/{id}/complete accepts both InspectionTechnician and ProgramAdministrator, but resolution COMPLETED is InspectionTechnician-exclusive and resolution WAIVED is ProgramAdministrator-exclusive"
    error_id: ERR_ROLE_FORBIDDEN
    http_status: 403
    applies_to: all
  - priority: 3
    category: auth
    check: "for an entity_backed role, X-User-ID resolves to an existing row of the backing entity (Dealer for DealerPrincipal, Technician for InspectionTechnician)"
    error_id: ERR_IDENTITY_NOT_RECOGNIZED
    http_status: 403
    applies_to: "all endpoints whose roles include DealerPrincipal or InspectionTechnician"
  - priority: 4
    category: business_constraint
    check: "request body and query parameters are schema-valid: required fields present, enum members recognized, numbers in range, limit within 1..100, offset >= 0, arrays non-empty where required"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all
  - priority: 5
    category: existence
    check: "every path-segment resource exists, validated left to right"
    error_id: "ERR_DEALER_NOT_FOUND | ERR_VEHICLE_NOT_FOUND | ERR_TEMPLATE_NOT_FOUND | ERR_INSPECTION_NOT_FOUND | ERR_RECONDITIONING_ITEM_NOT_FOUND | ERR_CERTIFICATION_NOT_FOUND | ERR_AUDIT_SAMPLE_NOT_FOUND | ERR_LISTING_NOT_FOUND | ERR_CLAIM_NOT_FOUND | ERR_COMPLAINT_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path parameters"
  - priority: 6
    category: business_referential
    check: "every foreign key supplied in the body resolves to an existing row (vehicle_id, technician_id, template_id, parent_inspection_id, complaint_id, certification_id, inspection_id)"
    error_id: ERR_REFERENCED_ENTITY_NOT_FOUND
    http_status: 404
    applies_to: "POST /cpo/inspections, POST /cpo/certifications, POST /cpo/listings, POST /cpo/warranty-claims, POST /cpo/complaints"
  - priority: 7
    category: business_referential
    check: "the acting DealerPrincipal owns the resource: the named technician's dealer_id, the inspection's dealer_id and the certification's dealer_id must all equal X-User-ID; an InspectionTechnician's dealer_id must equal the inspection's dealer_id"
    error_id: ERR_DEALER_SCOPE_VIOLATION
    http_status: 403
    applies_to: "POST /cpo/inspections, PUT /cpo/inspections/{id}/results, POST /cpo/inspections/{id}/submit, POST /cpo/reconditioning-items/{id}/complete, POST /cpo/certifications, POST /cpo/listings, POST /cpo/listings/{id}/syndicate, POST /cpo/warranty-claims"
  - priority: 8
    category: state
    check: "the target resource is in a state from which the requested transition is declared in 1.2"
    error_id: "ERR_TEMPLATE_NOT_DRAFT | ERR_TEMPLATE_NOT_PUBLISHED | ERR_VEHICLE_HISTORY_EVENT_INVALID | ERR_VEHICLE_NOT_IN_INVENTORY | ERR_INSPECTION_TERMINAL | ERR_INSPECTION_NOT_PASSED | ERR_RECONDITIONING_ITEM_CLOSED | ERR_CERTIFICATION_NOT_SUBMITTED | ERR_CERTIFICATION_NOT_ACTIVE | ERR_CERTIFICATION_TERMINAL | ERR_AUDIT_SAMPLE_ALREADY_REVIEWED | ERR_LISTING_WITHDRAWN | ERR_CLAIM_ALREADY_ADJUDICATED | ERR_COMPLAINT_NOT_OPEN"
    http_status: 409
    applies_to: "all state-changing endpoints"
  - priority: 9
    category: state
    check: "the supplied OCC field equals the parent's current version (expected_vehicle_version on certification submission, expected_certification_version on syndication)"
    error_id: "ERR_STALE_VEHICLE_VERSION | ERR_STALE_CERTIFICATION_VERSION"
    http_status: 412
    applies_to: "POST /cpo/certifications, POST /cpo/listings/{id}/syndicate"
  - priority: 10
    category: business_safety
    check: "Vehicle.title_brand is not in ProgramConfig.ineligible_title_brands, re-evaluated at inspection creation, certification submission and approval"
    error_id: ERR_BRANDED_TITLE_INELIGIBLE
    http_status: 422
    applies_to: "POST /cpo/inspections, POST /cpo/certifications, POST /cpo/certifications/{id}/approve"
  - priority: 11
    category: business_safety
    check: "Vehicle.prior_use is not in ProgramConfig.ineligible_prior_uses"
    error_id: ERR_PRIOR_USE_INELIGIBLE
    http_status: 422
    applies_to: "POST /cpo/inspections, POST /cpo/certifications, POST /cpo/certifications/{id}/approve"
  - priority: 12
    category: business_safety
    check: "whole days between Vehicle.in_service_date and date(started_at) is <= ProgramConfig.max_age_days (inclusive)"
    error_id: ERR_VEHICLE_AGE_EXCEEDED
    http_status: 422
    applies_to: "POST /cpo/inspections"
  - priority: 13
    category: business_safety
    check: "odometer_at_inspection <= ProgramConfig.max_odometer_miles (inclusive) and >= Vehicle.odometer_miles"
    error_id: ERR_MILEAGE_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /cpo/inspections"
  - priority: 14
    category: business_constraint
    check: "the certifying or inspecting Dealer.privilege_status is not SUSPENDED; approval additionally allows PROBATION"
    error_id: ERR_DEALER_PRIVILEGE_SUSPENDED
    http_status: 403
    applies_to: "POST /cpo/inspections, POST /cpo/certifications, POST /cpo/certifications/{id}/approve, POST /cpo/listings/{id}/syndicate"
  - priority: 15
    category: business_constraint
    check: "no other Inspection for the same vehicle is in status DRAFT, IN_PROGRESS or RECONDITIONING_REQUIRED, unless the request supplies parent_inspection_id naming exactly that inspection"
    error_id: ERR_INSPECTION_ALREADY_OPEN
    http_status: 409
    applies_to: "POST /cpo/inspections"
  - priority: 16
    category: business_constraint
    check: "segregation of duties: the technician closing a ReconditioningItem is not the inspection's own technician, and the technician of a complaint-driven re-inspection is not the technician of the inspection backing the complained-about certification"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: "POST /cpo/reconditioning-items/{id}/complete, POST /cpo/inspections"
  - priority: 17
    category: business_constraint
    check: "every supplied item_code resolves to a ChecklistItem of the inspection's template"
    error_id: ERR_UNKNOWN_CHECKLIST_ITEM
    http_status: 422
    applies_to: "PUT /cpo/inspections/{id}/results"
  - priority: 18
    category: business_constraint
    check: "a row with outcome PASS on a measured item carries a measured_value inside [min_measure, max_measure]; a row with outcome FAIL on a measured item carries a measured_value outside that band"
    error_id: ERR_MEASUREMENT_CONTRADICTS_OUTCOME
    http_status: 422
    applies_to: "PUT /cpo/inspections/{id}/results"
  - priority: 19
    category: business_constraint
    check: "the current attempt carries one InspectionResult per ChecklistItem of the template (recorded_item_count == point_count)"
    error_id: ERR_INCOMPLETE_CHECKLIST
    http_status: 422
    applies_to: "POST /cpo/inspections/{id}/submit"
  - priority: 20
    category: business_constraint
    check: "no ReconditioningItem of the inspection remains in status REQUIRED when the attempt is otherwise clean"
    error_id: ERR_RECONDITIONING_INCOMPLETE
    http_status: 409
    applies_to: "POST /cpo/inspections/{id}/submit"
  - priority: 21
    category: business_constraint
    check: "the vehicle has no Certification in status SUBMITTED, ACTIVE or UNDER_AUDIT other than one SUBMITTED row that this submission legitimately supersedes; an ACTIVE or UNDER_AUDIT row blocks outright"
    error_id: ERR_VEHICLE_ALREADY_CERTIFIED
    http_status: 409
    applies_to: "POST /cpo/certifications"
  - priority: 22
    category: business_constraint
    check: "the documents array covers every ProgramConfig.required_doc_types entry, with RECONDITIONING_INVOICE required exactly when the inspection produced at least one ReconditioningItem"
    error_id: ERR_DOCUMENTATION_INCOMPLETE
    http_status: 422
    applies_to: "POST /cpo/certifications"
  - priority: 23
    category: business_constraint
    check: "the documents array does not include RECONDITIONING_INVOICE when the inspection produced no ReconditioningItem, and contains no duplicate doc_type"
    error_id: ERR_DOCUMENT_NOT_APPLICABLE
    http_status: 422
    applies_to: "POST /cpo/certifications"
  - priority: 24
    category: business_constraint
    check: "Listing.disclosure_fields is a superset of ProgramConfig.listing_required_disclosure_fields (checked on both endpoints); the additional clause that a THIRD_PARTY_AGGREGATOR channel demands Dealer.privilege_status == ACTIVE is evaluated ONLY on syndication, so a PROBATION dealer may draft an aggregator listing but may never publish it"
    error_id: ERR_MARKETING_STANDARD_VIOLATION
    http_status: 422
    applies_to: "POST /cpo/listings, POST /cpo/listings/{id}/syndicate"
  - priority: 25
    category: business_constraint
    check: "uniqueness: Dealer.franchise_code, Vehicle.vin, ChecklistTemplate.code, ChecklistItem.item_code within a template, Technician.credential_id within a dealer, and at most one Listing per certification per channel with status != WITHDRAWN"
    error_id: ERR_DUPLICATE_RESOURCE
    http_status: 409
    applies_to: "POST /cpo/dealers, POST /cpo/vehicles, POST /cpo/checklist-templates, POST /cpo/checklist-templates/{id}/items, POST /cpo/dealers/{id}/technicians, POST /cpo/listings"
  - priority: 26
    category: business_temporal
    check: "started_at is not after the logical clock"
    error_id: ERR_INSPECTION_DATE_IN_FUTURE
    http_status: 422
    applies_to: "POST /cpo/inspections"
  - priority: 27
    category: business_temporal
    check: "the technician's credential_status is ACTIVE and credential_expires_at is strictly after the logical clock"
    error_id: ERR_TECHNICIAN_CREDENTIAL_EXPIRED
    http_status: 422
    applies_to: "POST /cpo/inspections, PUT /cpo/inspections/{id}/results"
  - priority: 28
    category: business_temporal
    check: "the candidate buffered closed slot does not touch or overlap any non-VOIDED inspection slot of the same technician, per calculations.technician_slot_overlap"
    error_id: ERR_TECHNICIAN_SLOT_CONFLICT
    http_status: 409
    applies_to: "POST /cpo/inspections"
  - priority: 29
    category: business_temporal
    check: "the logical clock is at or before Complaint.reinspection_deadline_at when a re-inspection is opened"
    error_id: ERR_REINSPECTION_DEADLINE_PASSED
    http_status: 409
    applies_to: "POST /cpo/inspections"
  - priority: 30
    category: business_temporal
    check: "the computed coverage interval is non-empty on both the date axis and the mileage axis"
    error_id: ERR_NO_COVERAGE_REMAINING
    http_status: 422
    applies_to: "POST /cpo/certifications/{id}/approve"
  - priority: 31
    category: business_temporal
    check: "the computed half-open coverage interval does not overlap a retained interval on the same vehicle, per calculations.vehicle_coverage_overlap"
    error_id: ERR_COVERAGE_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /cpo/certifications/{id}/approve"
  - priority: 32
    category: business_temporal
    check: "repair_date is inside the half-open interval [warranty_start_date, warranty_end_date) and repair_odometer_miles <= warranty_end_miles"
    error_id: ERR_OUTSIDE_WARRANTY_WINDOW
    http_status: 422
    applies_to: "POST /cpo/warranty-claims"
  - priority: 33
    category: business_fiscal
    check: "claimed_amount_cents does not exceed ProgramConfig.claim_per_claim_cap_cents as a per-claim ceiling; the same constant additionally caps the certification's lifetime approved total, but that trim happens at adjudication inside calculations.claim_reimbursement rather than rejecting the filing"
    error_id: ERR_CLAIM_AMOUNT_EXCEEDS_CAP
    http_status: 422
    applies_to: "POST /cpo/warranty-claims"
  - priority: 34
    category: business_fiscal
    check: "actual_cost_cents does not exceed the resolved ChecklistItem.max_reconditioning_cost_cents"
    error_id: ERR_RECONDITIONING_COST_EXCEEDS_CAP
    http_status: 422
    applies_to: "POST /cpo/reconditioning-items/{id}/complete"

  - priority: 35
    category: business_constraint
    check: "content-eligibility preconditions declared in 1.2 that no earlier rule covers: a ChecklistTemplate may only be published when point_count >= 1 AND critical_item_count >= 1, and a ReconditioningItem whose severity is CRITICAL may never be closed with resolution WAIVED. Placed last so the corresponding state error (ERR_TEMPLATE_NOT_DRAFT, ERR_RECONDITIONING_ITEM_CLOSED at priority 8) still wins whenever the target is in the wrong state."
    error_id: ERR_TEMPLATE_NOT_PUBLISHABLE | ERR_CRITICAL_RECONDITIONING_NOT_WAIVABLE
    http_status: 422
    applies_to: "POST /cpo/checklist-templates/{id}/publish, POST /cpo/reconditioning-items/{id}/complete"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- program configuration -------------------------------------------------
  - method: GET
    path: "/cpo/program-config"
    description: "Read the single live ProgramConfig generation, including its version, so tests and dealers can see the tunables in force."
    roles: [ProgramAdministrator, ProgramAuditor, DealerPrincipal, InspectionTechnician, CustomerAdvocate]
    code: 200
    input: []
    output: ProgramConfig
    side_effects: []

  - method: PUT
    path: "/cpo/program-config"
    description: "Retune the program. Every field is optional; omitted fields keep the value of the current generation. Each successful call publishes a new generation by incrementing ProgramConfig.version, and certifications already ACTIVE keep the generation pinned in their program_config_version."
    roles: [ProgramAdministrator]
    code: 200
    input: ["max_age_days?", "max_odometer_miles?", "ineligible_title_brands?", "ineligible_prior_uses?", "base_fee_cents?", "age_surcharge_free_years?", "age_surcharge_cents_per_year?", "mileage_surcharge_free_miles?", "mileage_surcharge_cents_per_10k?", "surcharge_cap_pct?", "volume_discount_tiers?", "recon_reimbursement_share?", "recon_reimbursement_cap_cents?", "factory_basic_months?", "factory_basic_miles?", "warranty_extension_months?", "warranty_extension_miles?", "warranty_total_cap_months?", "warranty_total_cap_miles?", "claim_per_claim_cap_cents?", "claim_window_days?", "claim_variant_volume_floor?", "claim_ratio_probation_threshold?", "claim_ratio_suspension_threshold?", "probation_claim_share?", "audit_sample_pct?", "audit_sample_min_per_run?", "audit_fail_suspension_count?", "doc_retention_years?", "required_doc_types?", "listing_required_disclosure_fields?", "listing_removal_sla_hours?", "inspection_slot_minutes?", "technician_buffer_minutes?"]
    output: ProgramConfig
    side_effects:
      - "increments ProgramConfig.version by 1, creating a new pinnable generation"
      - "never retroactively rewrites fee or coverage fields of an existing Certification"

  # --- checklist templates ---------------------------------------------------
  - method: POST
    path: "/cpo/checklist-templates"
    description: "Create a multipoint inspection checklist template in DRAFT."
    roles: [ProgramAdministrator]
    code: 201
    input: [code, effective_from]
    output: ChecklistTemplate
    side_effects:
      - "creates the template in status DRAFT with point_count 0 and critical_item_count 0"

  - method: GET
    path: "/cpo/checklist-templates/{id}"
    description: "Read one checklist template with its derived point_count and critical_item_count."
    roles: [ProgramAdministrator, ProgramAuditor, DealerPrincipal, InspectionTechnician]
    code: 200
    input: []
    output: ChecklistTemplate
    side_effects: []

  - method: POST
    path: "/cpo/checklist-templates/{id}/items"
    description: "Add one inspection point with its pass/fail criteria to a DRAFT template."
    roles: [ProgramAdministrator]
    code: 201
    input: ["item_code", "category", "severity", "pass_criteria", "min_measure?", "max_measure?", "reconditioning_allowed", "max_reconditioning_cost_cents?"]
    output: ChecklistItem
    side_effects:
      - "recomputes ChecklistTemplate.point_count and critical_item_count and increments ChecklistTemplate.version by 1"

  - method: GET
    path: "/cpo/checklist-templates/{id}/items"
    description: "List the inspection points of a template — the reverse-reachability channel for ChecklistItem.template_id."
    roles: [ProgramAdministrator, ProgramAuditor, DealerPrincipal, InspectionTechnician]
    code: 200
    input: ["category?", "severity?", "limit?", "offset?"]
    output: ChecklistItem[]
    side_effects: []

  - method: POST
    path: "/cpo/checklist-templates/{id}/publish"
    description: "Publish a DRAFT template so inspections may name it, auto-retiring the previously published generation."
    roles: [ProgramAdministrator]
    code: 200
    input: []
    output: ChecklistTemplate
    side_effects:
      - "sets status = PUBLISHED and published_at = logical clock"
      - "moves every other PUBLISHED template with effective_from <= this template's effective_from to RETIRED, incrementing each of their versions by 1"
      - "increments ChecklistTemplate.version by 1"

  # --- dealers and technicians ----------------------------------------------
  - method: POST
    path: "/cpo/dealers"
    description: "Enroll a franchised dealer into the CPO program with ACTIVE certifying privilege."
    roles: [ProgramAdministrator]
    code: 201
    input: [name, franchise_code, region_code]
    output: Dealer
    side_effects:
      - "creates the dealer with privilege_status ACTIVE, every counter at 0 and claim_ratio_variant LIFETIME_CUMULATIVE"

  - method: GET
    path: "/cpo/dealers/{id}"
    description: "Read one dealer with its claim-behaviour counters, audit counters, risk_score and fee ledger."
    roles: [ProgramAdministrator, ProgramAuditor, DealerPrincipal]
    code: 200
    input: []
    output: Dealer
    side_effects: []

  - method: PATCH
    path: "/cpo/dealers/{id}/privilege"
    description: "Administratively move a dealer's certifying privilege, e.g. to suspend a dealer for cause outside the automatic claim-ratio and audit thresholds."
    roles: [ProgramAdministrator]
    code: 200
    input: ["privilege_status", "privilege_reason?"]
    output: Dealer
    side_effects:
      - "sets privilege_status and privilege_reason (defaulting to ADMIN_ACTION)"
      - "on a move to SUSPENDED: every Certification of the dealer with status SUBMITTED moves to REJECTED with rejection_reason DEALER_SUSPENDED, releasing each vehicle's slot, and every Listing of the dealer in {DRAFT, SYNDICATED} moves to WITHDRAWN with withdrawal_reason DEALER_SUSPENDED and removal_due_at"
      - "increments Dealer.version by 1, plus the version of every cascaded Certification, Vehicle and Listing"

  - method: POST
    path: "/cpo/dealers/{id}/technicians"
    description: "Register a certified inspection technician under a dealer."
    roles: [ProgramAdministrator, DealerPrincipal]
    code: 201
    input: ["name", "credential_id", "credential_expires_at", "credential_status?"]
    output: Technician
    side_effects:
      - "creates the technician with completed_inspection_count 0"

  - method: GET
    path: "/cpo/dealers/{id}/technicians"
    description: "List a dealer's technicians — the reverse-reachability channel for Technician.dealer_id."
    roles: [ProgramAdministrator, ProgramAuditor, DealerPrincipal]
    code: 200
    input: ["credential_status?", "limit?", "offset?"]
    output: Technician[]
    side_effects: []

  # --- vehicles --------------------------------------------------------------
  - method: POST
    path: "/cpo/vehicles"
    description: "Register a used vehicle in dealer inventory with its title history and prior use."
    roles: [ProgramAdministrator, DealerPrincipal]
    code: 201
    input: [vin, model_year, in_service_date, odometer_miles, title_brand, prior_use, owner_count]
    output: Vehicle
    side_effects:
      - "creates the vehicle with cpo_state NOT_CERTIFIED, inventory_state IN_INVENTORY and active_certification_count 0"

  - method: GET
    path: "/cpo/vehicles/{id}"
    description: "Read one vehicle, including both parallel state dimensions (cpo_state and inventory_state), active_certification_count, certified_certification_id and the version an OCC-guarded certification submission must echo."
    roles: [ProgramAdministrator, ProgramAuditor, DealerPrincipal, CustomerAdvocate]
    code: 200
    input: []
    output: Vehicle
    side_effects: []

  - method: POST
    path: "/cpo/vehicles/{id}/history-events"
    description: "Record a title, odometer or disposition event on a vehicle. event_type is one of ODOMETER_UPDATE, TITLE_BRANDED, RETAIL_SOLD, WHOLESALED, RETURNED_TO_INVENTORY; the disposition events drive the inventory_state dimension and cascade into any live certification."
    roles: [ProgramAdministrator, DealerPrincipal]
    code: 200
    input: ["event_type", "odometer_miles?", "title_brand?"]
    output: Vehicle
    side_effects:
      - "sets last_history_event_type and last_history_event_at = logical clock"
      - "ODOMETER_UPDATE raises odometer_miles; TITLE_BRANDED sets title_brand and decertifies any live certification with decertification_reason TITLE_BRANDED"
      - "RETAIL_SOLD / WHOLESALED move inventory_state and decertify any Certification in {ACTIVE, UNDER_AUDIT} with the matching decertification_reason, which withdraws that certification's listings, dismisses its open complaints, voids any complaint-driven inspection and moves cpo_state CERTIFIED -> DECERTIFIED"
      - "RETURNED_TO_INVENTORY returns inventory_state to IN_INVENTORY and deliberately leaves cpo_state alone"
      - "increments Vehicle.version by 1, plus the version of every cascaded Certification, Listing, Complaint and Inspection"

  # --- inspections -----------------------------------------------------------
  - method: POST
    path: "/cpo/inspections"
    description: "Open a multipoint inspection. Supplying parent_inspection_id supersedes (VOIDs) the prior open inspection; supplying complaint_id makes this the ordered re-inspection for that complaint and sets purpose RE_INSPECTION."
    roles: [DealerPrincipal]
    code: 201
    input: ["vehicle_id", "technician_id", "template_id", "started_at", "odometer_at_inspection", "parent_inspection_id?", "complaint_id?"]
    output: Inspection
    side_effects:
      - "creates the inspection in status DRAFT with attempt_count 0, dealer_id from X-User-ID, slot_end_at = started_at + ProgramConfig.inspection_slot_minutes and vehicle_age_days_at_inspection computed against started_at"
      - "moves Vehicle.cpo_state NOT_CERTIFIED|DECERTIFIED -> CERTIFICATION_PENDING and increments Vehicle.version by 1"
      - "when parent_inspection_id is supplied, moves that inspection to VOIDED with failure_reason SUPERSEDED_BY_REINSPECTION"
      - "when complaint_id is supplied, moves that Complaint OPEN -> REINSPECTION_ORDERED with reinspection_ordered_at = logical clock"

  - method: GET
    path: "/cpo/inspections"
    description: "Filtered list of inspections — the reverse-reachability channel for Inspection.vehicle_id, dealer_id, technician_id, template_id, parent_inspection_id and complaint_id."
    roles: [ProgramAdministrator, ProgramAuditor, DealerPrincipal, InspectionTechnician]
    code: 200
    input: ["vehicle_id?", "dealer_id?", "technician_id?", "template_id?", "parent_inspection_id?", "complaint_id?", "status?", "purpose?", "limit?", "offset?"]
    output: Inspection[]
    side_effects: []

  - method: GET
    path: "/cpo/inspections/{id}"
    description: "Read one inspection with its derived counters (recorded_item_count, failed_critical_count, failed_recon_count, total_recon_cost_cents, total_reimbursable_cents)."
    roles: [ProgramAdministrator, ProgramAuditor, DealerPrincipal, InspectionTechnician]
    code: 200
    input: []
    output: Inspection
    side_effects: []

  - method: PUT
    path: "/cpo/inspections/{id}/results"
    description: "Record one full attempt of checklist outcomes. results is an array of { item_code, outcome, measured_value? }. Callable only by the inspection's own technician; each call opens a new attempt rather than editing the previous one, because InspectionResult is append-only."
    roles: [InspectionTechnician]
    code: 200
    input: [results]
    output: Inspection
    side_effects:
      - "increments Inspection.attempt_count by 1 and writes one InspectionResult per supplied row with attempt_index = the new attempt_count and recorded_by_technician_id = X-User-ID"
      - "moves status DRAFT|IN_PROGRESS|RECONDITIONING_REQUIRED -> IN_PROGRESS"
      - "recomputes recorded_item_count, failed_critical_count and failed_recon_count over the new attempt only"
      - "increments Inspection.version by 1"

  - method: GET
    path: "/cpo/inspections/{id}/results"
    description: "List the recorded checklist outcomes of an inspection across all attempts — the reverse-reachability channel for InspectionResult.inspection_id."
    roles: [ProgramAdministrator, ProgramAuditor, DealerPrincipal, InspectionTechnician]
    code: 200
    input: ["attempt_index?", "outcome?", "item_code?", "limit?", "offset?"]
    output: InspectionResult[]
    side_effects: []

  - method: GET
    path: "/cpo/inspections/{id}/reconditioning-items"
    description: "List the repairs an inspection generated — the reverse-reachability channel for ReconditioningItem.inspection_id and the only discovery channel for these cascade-created rows."
    roles: [ProgramAdministrator, ProgramAuditor, DealerPrincipal, InspectionTechnician]
    code: 200
    input: ["status?", "severity?", "limit?", "offset?"]
    output: ReconditioningItem[]
    side_effects: []

  - method: POST
    path: "/cpo/reconditioning-items/{id}/complete"
    description: "Close a required repair. resolution COMPLETED requires an InspectionTechnician other than the inspection's own technician plus actual_cost_cents; resolution WAIVED is a ProgramAdministrator act requiring waiver_reason."
    roles: [InspectionTechnician, ProgramAdministrator]
    code: 200
    input: ["resolution", "actual_cost_cents?", "waiver_reason?"]
    output: ReconditioningItem
    side_effects:
      - "sets status COMPLETED or WAIVED, completed_at = logical clock and closed_by_user_id = X-User-ID"
      - "on COMPLETED sets reimbursable_cents = min(round_half_up(actual_cost_cents * recon_reimbursement_share), ChecklistItem.max_reconditioning_cost_cents); on WAIVED leaves actual_cost_cents null and reimbursable_cents 0"
      - "recomputes Inspection.total_recon_cost_cents and Inspection.total_reimbursable_cents per calculations.reconditioning_reimbursement"
      - "increments ReconditioningItem.version and Inspection.version by 1 each"

  - method: POST
    path: "/cpo/inspections/{id}/submit"
    description: "Close the current attempt. The outcome is derived, not supplied: any FAIL on a non-reconditionable point yields FAILED, any open required repair yields RECONDITIONING_REQUIRED, an otherwise clean attempt yields PASSED."
    roles: [DealerPrincipal]
    code: 200
    input: []
    output: Inspection
    side_effects:
      - "PASSED: sets submitted_at, recomputes total_reimbursable_cents, increments Technician.completed_inspection_count, and resolves a linked complaint to RESOLVED_UPHELD"
      - "RECONDITIONING_REQUIRED: creates one ReconditioningItem in status REQUIRED per FAIL on a reconditioning_allowed point that has no row yet for this inspection"
      - "FAILED: sets failure_reason CRITICAL_ITEM_FAIL, moves Vehicle.cpo_state CERTIFICATION_PENDING -> NOT_CERTIFIED, and for a complaint re-inspection resolves the Complaint to RESOLVED_DECERTIFIED, decertifies its Certification with reason COMPLAINT_REINSPECTION_FAIL, withdraws that certification's listings and moves Vehicle.cpo_state to DECERTIFIED"
      - "increments Inspection.version by 1 plus the version of every cascaded entity"

  # --- certifications --------------------------------------------------------
  - method: POST
    path: "/cpo/certifications"
    description: "Submit a certification for a PASSED inspection together with its retained documentation. expected_vehicle_version is the Vehicle.version the dealer last observed; a second submission for the same vehicle that echoes the same version loses on OCC, while a submission echoing the current version supersedes the earlier SUBMITTED row. documents is an array of { doc_type, reference }."
    roles: [DealerPrincipal]
    code: 201
    input: [vehicle_id, inspection_id, expected_vehicle_version, documents]
    output: Certification
    side_effects:
      - "creates the certification in status SUBMITTED with certification_number, submitted_at = logical clock and dealer_id from X-User-ID"
      - "creates one CertificationDocument per documents entry with uploaded_at = logical clock and retained_until still null"
      - "moves any existing SUBMITTED certification of the same vehicle to SUPERSEDED, handing over the certification slot so Vehicle.active_certification_count stays 1"
      - "recomputes Vehicle.active_certification_count and Dealer.lifetime_submitted_count and active_certification_count"
      - "increments Vehicle.version by 1 (the OCC guard's observable advance) and Dealer.version by 1"

  - method: GET
    path: "/cpo/certifications"
    description: "Filtered list of certifications — the reverse-reachability channel for Certification.vehicle_id, inspection_id and dealer_id."
    roles: [ProgramAdministrator, ProgramAuditor, DealerPrincipal, CustomerAdvocate]
    code: 200
    input: ["vehicle_id?", "inspection_id?", "dealer_id?", "status?", "audit_sampled?", "limit?", "offset?"]
    output: Certification[]
    side_effects: []

  - method: GET
    path: "/cpo/certifications/{id}"
    description: "Read one certification with its pinned program_config_version, fee breakdown, warranty anchor variant, coverage window and the version an OCC-guarded syndication must echo."
    roles: [ProgramAdministrator, ProgramAuditor, DealerPrincipal, CustomerAdvocate]
    code: 200
    input: []
    output: Certification
    side_effects: []

  - method: GET
    path: "/cpo/certifications/{id}/documents"
    description: "List the retained documentation of a certification with each row's retained_until — the reverse-reachability channel for CertificationDocument.certification_id and the only discovery channel for these cascade-created rows."
    roles: [ProgramAdministrator, ProgramAuditor, DealerPrincipal]
    code: 200
    input: ["doc_type?", "limit?", "offset?"]
    output: CertificationDocument[]
    side_effects: []

  - method: POST
    path: "/cpo/certifications/{id}/approve"
    description: "Adjudicate a SUBMITTED certification. decision is APPROVE or REJECT; APPROVE prices the fee, pins the config generation and computes the warranty coverage window."
    roles: [ProgramAdministrator]
    code: 200
    input: ["decision", "rejection_reason?"]
    output: Certification
    side_effects:
      - "APPROVE: pins program_config_version, computes fee_surcharge_cents / fee_discount_cents / fee_charged_cents, computes warranty_anchor_variant / warranty_start_date / warranty_end_date / warranty_end_miles / retention_expires_at, stamps retained_until onto every CertificationDocument, sets status ACTIVE and activated_at = logical clock"
      - "APPROVE: moves Vehicle.cpo_state CERTIFICATION_PENDING -> CERTIFIED, sets Vehicle.certified_certification_id, recomputes Dealer.lifetime_activated_count, window_activated_count, fee_billed_cents_total, fee_balance_cents, claim_ratio_variant, claim_ratio_effective and risk_score"
      - "REJECT: sets status REJECTED with rejection_reason (default ADMIN_DECISION), bills no fee, releases the vehicle slot and moves Vehicle.cpo_state to NOT_CERTIFIED"
      - "increments Certification.version, Vehicle.version and Dealer.version by 1 each"

  - method: POST
    path: "/cpo/certifications/{id}/decertify"
    description: "Withdraw a live certification for cause. decertification_reason accepts ADMIN_ACTION or TITLE_BRANDED; the disposition reasons RETAIL_SOLD and WHOLESALED arrive only through vehicle history events, and POST_AUDIT_FAIL only through an audit finding."
    roles: [ProgramAdministrator, DealerPrincipal]
    code: 200
    input: [decertification_reason]
    output: Certification
    side_effects:
      - "sets status DECERTIFIED, decertification_reason and decertified_at = logical clock; fee_credited_cents stays 0 because only POST_AUDIT_FAIL refunds the fee"
      - "moves Vehicle.cpo_state CERTIFIED -> DECERTIFIED, clears certified_certification_id, withdraws every DRAFT or SYNDICATED Listing with withdrawal_reason CERTIFICATION_DECERTIFIED and removal_due_at, and dismisses every OPEN or REINSPECTION_ORDERED Complaint"
      - "recomputes Dealer.active_certification_count and Vehicle.active_certification_count"
      - "increments Certification.version and Vehicle.version by 1 each, plus every cascaded Listing and Complaint version"

  # --- audit ----------------------------------------------------------------
  - method: POST
    path: "/cpo/audit-runs"
    description: "Draw an audit sample over the eligible ACTIVE certifications per calculations.audit_sample_selection. An empty pool is a successful run with selected_count 0, never an error."
    roles: [ProgramAuditor]
    code: 201
    input: []
    output: "{ audit_run_id: string, pool_size: integer, selected_count: integer, selected_certification_ids: string[] }"
    side_effects:
      - "creates one AuditSample in status SELECTED per drawn certification with audit_run_id and selection_rank following the (Dealer.risk_score DESC, activated_at ASC, created_at ASC) ranking"
      - "moves each drawn Certification ACTIVE -> UNDER_AUDIT, sets audit_sampled = true and increments its version by 1"
      - "recomputes Dealer.audit_sample_count, audit_fail_rate and risk_score for every affected dealer"

  - method: GET
    path: "/cpo/certifications/{id}/audit-samples"
    description: "List the audit samples drawn against a certification — the reverse-reachability channel for AuditSample.certification_id and the discovery channel for the sample ids an audit run created."
    roles: [ProgramAdministrator, ProgramAuditor, DealerPrincipal]
    code: 200
    input: ["status?", "audit_run_id?", "limit?", "offset?"]
    output: AuditSample[]
    side_effects: []

  - method: POST
    path: "/cpo/audit-samples/{id}/finding"
    description: "Record the audit outcome for a selected sample. finding is PASS or FAIL; FAIL drives the five-hop decertification, fee-credit, dealer-suspension cascade."
    roles: [ProgramAuditor]
    code: 200
    input: ["finding", "finding_code?"]
    output: AuditSample
    side_effects:
      - "PASS: sets AuditSample.status PASSED with finding_code defaulting to NONE, reviewed_at and reviewer_user_id, and returns the Certification UNDER_AUDIT -> ACTIVE with its fee and coverage fields untouched"
      - "FAIL: sets AuditSample.status FAILED, decertifies the Certification with decertification_reason POST_AUDIT_FAIL and fee_credited_cents = fee_charged_cents, withdraws its listings, dismisses its complaints, moves Vehicle.cpo_state to DECERTIFIED, recomputes the dealer's audit and fee ledger counters, and — once audit_fail_count reaches ProgramConfig.audit_fail_suspension_count — suspends the dealer, which in turn rejects its SUBMITTED certifications and withdraws its syndicated listings"
      - "increments AuditSample.version plus the version of every cascaded Certification, Vehicle, Dealer and Listing"

  # --- marketing / listings --------------------------------------------------
  - method: POST
    path: "/cpo/listings"
    description: "Create a CPO advertisement for an ACTIVE certification in DRAFT, enforcing the program's required disclosure tokens."
    roles: [DealerPrincipal]
    code: 201
    input: [certification_id, channel, price_cents, disclosure_fields]
    output: Listing
    side_effects:
      - "creates the listing in status DRAFT with removal_due_at null"

  - method: GET
    path: "/cpo/certifications/{id}/listings"
    description: "List the advertisements of a certification — the reverse-reachability channel for Listing.certification_id."
    roles: [ProgramAdministrator, ProgramAuditor, DealerPrincipal, CustomerAdvocate]
    code: 200
    input: ["channel?", "status?", "limit?", "offset?"]
    output: Listing[]
    side_effects: []

  - method: POST
    path: "/cpo/listings/{id}/syndicate"
    description: "Publish or refresh a listing to its channel. expected_certification_version is the Certification.version the dealer last observed, so a listing can never be syndicated against a certification generation that has already moved on."
    roles: [DealerPrincipal]
    code: 200
    input: [expected_certification_version]
    output: Listing
    side_effects:
      - "sets status SYNDICATED, syndicated_at = logical clock and syndicated_snapshot_version to the certification version observed after the increment below"
      - "sets Certification.listing_syndicated_at = logical clock and increments Certification.version by 1 (the OCC guard's observable advance)"
      - "increments Listing.version by 1"

  # --- warranty claims -------------------------------------------------------
  - method: POST
    path: "/cpo/warranty-claims"
    description: "File a warranty repair claim against a certification's extended coverage."
    roles: [DealerPrincipal]
    code: 201
    input: [certification_id, component_category, repair_date, repair_odometer_miles, claimed_amount_cents]
    output: WarrantyClaim
    side_effects:
      - "creates the claim in status SUBMITTED with approved_amount_cents 0 and dealer_ratio_snapshot_before null"

  - method: GET
    path: "/cpo/certifications/{id}/warranty-claims"
    description: "List the claims filed under a certification — the reverse-reachability channel for WarrantyClaim.certification_id."
    roles: [ProgramAdministrator, ProgramAuditor, DealerPrincipal]
    code: 200
    input: ["status?", "component_category?", "limit?", "offset?"]
    output: WarrantyClaim[]
    side_effects: []

  - method: POST
    path: "/cpo/warranty-claims/{id}/adjudicate"
    description: "Adjudicate a claim. decision is APPROVE or DENY; APPROVE pays per calculations.claim_reimbursement and only then re-counts the dealer's claim behaviour and re-evaluates its privilege thresholds."
    roles: [ProgramAdministrator]
    code: 200
    input: ["decision", "denial_reason?"]
    output: WarrantyClaim
    side_effects:
      - "APPROVE: records dealer_ratio_snapshot_before, sets approved_amount_cents = floor(min(claimed_amount_cents, claim_per_claim_cap_cents - Certification.approved_claim_amount_cents) * share), status APPROVED and adjudicated_at = logical clock"
      - "APPROVE: only after payment, recomputes Dealer.approved_claim_count_lifetime / _window, claim_ratio_variant, claim_ratio_effective, risk_score and Certification.approved_claim_count / approved_claim_amount_cents"
      - "APPROVE: then moves Dealer.privilege_status to PROBATION at claim_ratio_probation_threshold and to SUSPENDED at claim_ratio_suspension_threshold, the suspension cascading into SUBMITTED certifications and SYNDICATED listings"
      - "DENY: sets status DENIED with denial_reason and leaves every dealer counter untouched"
      - "increments WarrantyClaim.version, Certification.version and Dealer.version by 1 each"

  # --- complaints ------------------------------------------------------------
  - method: POST
    path: "/cpo/complaints"
    description: "Log a customer complaint against a certified vehicle and start the re-inspection clock."
    roles: [CustomerAdvocate]
    code: 201
    input: [certification_id, customer_reference, category, description]
    output: Complaint
    side_effects:
      - "creates the complaint in status OPEN with filed_at = logical clock and reinspection_deadline_at derived from filed_at"

  - method: GET
    path: "/cpo/certifications/{id}/complaints"
    description: "List the complaints filed against a certification — the reverse-reachability channel for Complaint.certification_id."
    roles: [ProgramAdministrator, ProgramAuditor, DealerPrincipal, CustomerAdvocate]
    code: 200
    input: ["status?", "category?", "limit?", "offset?"]
    output: Complaint[]
    side_effects: []

  - method: GET
    path: "/cpo/complaints/{id}"
    description: "Read one complaint by id, including its reinspection_deadline_at and resolution stamps. The single-complaint read the advocate and the certifying dealer both work from while a re-inspection is pending."
    roles: [ProgramAdministrator, ProgramAuditor, DealerPrincipal, CustomerAdvocate]
    code: 200
    input: []
    output: Complaint
    side_effects: []

  # --- test-driving surface --------------------------------------------------
  - method: POST
    path: "/cpo/_clock/set_current_utc"
    description: "Set the server's logical clock, which every deadline, coverage window, retention date and claim window is evaluated against. Before any call the clock reads exactly 2026-08-01T00:00:00Z and never falls back to wall-clock time. Test-driving endpoint: no business surface exists for moving program time, so it lives under the /_ namespace."
    roles: [ProgramAdministrator]
    code: 200
    input: [current_utc]
    output: "{ current_utc: string }"
    side_effects:
      - "sets the logical clock; it never retroactively rewrites stored timestamps or recomputes a stored window"

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or X-User-Role is not one of the five declared roles."
  - id: ERR_ROLE_FORBIDDEN
    http: 403
    condition: "The acting role is not listed in the endpoint's roles, or the acting role does not own the requested variant of a variant-scoped exclusive operation: an InspectionTechnician requesting resolution WAIVED, or a ProgramAdministrator requesting resolution COMPLETED, on POST /cpo/reconditioning-items/{id}/complete."
  - id: ERR_IDENTITY_NOT_RECOGNIZED
    http: 403
    condition: "X-User-ID of a DealerPrincipal or InspectionTechnician does not resolve to an existing Dealer or Technician."
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Schema violation: required field missing, unknown enum member, out-of-range number, empty results or documents array, limit outside 1..100, negative offset."
  - id: ERR_DEALER_NOT_FOUND
    http: 404
    condition: "The dealer named by a path segment does not exist."
  - id: ERR_VEHICLE_NOT_FOUND
    http: 404
    condition: "The vehicle named by a path segment does not exist."
  - id: ERR_TEMPLATE_NOT_FOUND
    http: 404
    condition: "The checklist template named by a path segment does not exist."
  - id: ERR_INSPECTION_NOT_FOUND
    http: 404
    condition: "The inspection named by a path segment does not exist."
  - id: ERR_RECONDITIONING_ITEM_NOT_FOUND
    http: 404
    condition: "The reconditioning item named by a path segment does not exist."
  - id: ERR_CERTIFICATION_NOT_FOUND
    http: 404
    condition: "The certification named by a path segment does not exist."
  - id: ERR_AUDIT_SAMPLE_NOT_FOUND
    http: 404
    condition: "The audit sample named by a path segment does not exist."
  - id: ERR_LISTING_NOT_FOUND
    http: 404
    condition: "The listing named by a path segment does not exist."
  - id: ERR_CLAIM_NOT_FOUND
    http: 404
    condition: "The warranty claim named by a path segment does not exist."
  - id: ERR_COMPLAINT_NOT_FOUND
    http: 404
    condition: "The complaint named by a path segment does not exist."
  - id: ERR_REFERENCED_ENTITY_NOT_FOUND
    http: 404
    condition: "A foreign key supplied in the body (vehicle_id, technician_id, template_id, parent_inspection_id, complaint_id, certification_id, inspection_id) does not resolve."
  - id: ERR_DEALER_SCOPE_VIOLATION
    http: 403
    condition: "The acting DealerPrincipal or InspectionTechnician does not own the targeted inspection, certification, listing, claim or technician."
  - id: ERR_TEMPLATE_NOT_DRAFT
    http: 409
    condition: "Adding an item to, or publishing, a template that is no longer DRAFT."
  - id: ERR_TEMPLATE_NOT_PUBLISHED
    http: 409
    condition: "An inspection names a template whose status is DRAFT or RETIRED."
  - id: ERR_VEHICLE_HISTORY_EVENT_INVALID
    http: 409
    condition: "The event_type is not a declared transition from the vehicle's current inventory_state, e.g. RETAIL_SOLD on an already RETAIL_SOLD vehicle or RETURNED_TO_INVENTORY on one still IN_INVENTORY."
  - id: ERR_VEHICLE_NOT_IN_INVENTORY
    http: 409
    condition: "A certification approval is attempted while the vehicle's inventory_state is RETAIL_SOLD or WHOLESALED; the program only certifies vehicles the dealer still holds, so the parallel commercial dimension blocks the program dimension at exactly this one point."
  - id: ERR_INSPECTION_TERMINAL
    http: 409
    condition: "Recording results on, or submitting, an inspection already in PASSED, FAILED or VOIDED."
  - id: ERR_INSPECTION_NOT_PASSED
    http: 409
    condition: "A certification submission names an inspection whose status is not PASSED."
  - id: ERR_RECONDITIONING_ITEM_CLOSED
    http: 409
    condition: "Closing a reconditioning item already COMPLETED or WAIVED."
  - id: ERR_CERTIFICATION_NOT_SUBMITTED
    http: 409
    condition: "Approving or rejecting a certification whose status is not SUBMITTED."
  - id: ERR_CERTIFICATION_NOT_ACTIVE
    http: 409
    condition: "Creating a listing, filing a claim or filing a complaint against a certification that is not ACTIVE or UNDER_AUDIT."
  - id: ERR_CERTIFICATION_TERMINAL
    http: 409
    condition: "Decertifying a certification already in REJECTED, SUPERSEDED or DECERTIFIED."
  - id: ERR_AUDIT_SAMPLE_ALREADY_REVIEWED
    http: 409
    condition: "Recording a finding on an audit sample already PASSED or FAILED."
  - id: ERR_LISTING_WITHDRAWN
    http: 409
    condition: "Syndicating a listing already WITHDRAWN."
  - id: ERR_CLAIM_ALREADY_ADJUDICATED
    http: 409
    condition: "Adjudicating a claim already APPROVED or DENIED."
  - id: ERR_COMPLAINT_NOT_OPEN
    http: 409
    condition: "Ordering a re-inspection for a complaint that is not OPEN."
  - id: ERR_STALE_VEHICLE_VERSION
    http: 412
    condition: "expected_vehicle_version on a certification submission does not equal the vehicle's current version."
  - id: ERR_STALE_CERTIFICATION_VERSION
    http: 412
    condition: "expected_certification_version on a syndication does not equal the certification's current version."
  - id: ERR_BRANDED_TITLE_INELIGIBLE
    http: 422
    condition: "Vehicle.title_brand is in ProgramConfig.ineligible_title_brands at inspection creation, certification submission or approval."
  - id: ERR_PRIOR_USE_INELIGIBLE
    http: 422
    condition: "Vehicle.prior_use is in ProgramConfig.ineligible_prior_uses."
  - id: ERR_VEHICLE_AGE_EXCEEDED
    http: 422
    condition: "Whole days between in_service_date and date(started_at) exceed ProgramConfig.max_age_days."
  - id: ERR_MILEAGE_LIMIT_EXCEEDED
    http: 422
    condition: "odometer_at_inspection exceeds ProgramConfig.max_odometer_miles, or is below the vehicle's recorded odometer_miles."
  - id: ERR_DEALER_PRIVILEGE_SUSPENDED
    http: 403
    condition: "The dealer's privilege_status is SUSPENDED (or PROBATION where the operation demands ACTIVE, such as third-party syndication)."
  - id: ERR_INSPECTION_ALREADY_OPEN
    http: 409
    condition: "Another inspection of the same vehicle is DRAFT, IN_PROGRESS or RECONDITIONING_REQUIRED and the request does not name it as parent_inspection_id."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 409
    condition: "The inspection's own technician tries to close its reconditioning item, or a complaint re-inspection names the technician of the complained-about inspection."
  - id: ERR_UNKNOWN_CHECKLIST_ITEM
    http: 422
    condition: "A results row names an item_code that is not a ChecklistItem of the inspection's template."
  - id: ERR_MEASUREMENT_CONTRADICTS_OUTCOME
    http: 422
    condition: "A PASS carries a measured_value outside the item's [min_measure, max_measure] band, or a FAIL carries one inside it, or a measured item carries no measured_value."
  - id: ERR_INCOMPLETE_CHECKLIST
    http: 422
    condition: "Submitting an inspection whose current attempt covers fewer item_codes than the template's point_count."
  - id: ERR_RECONDITIONING_INCOMPLETE
    http: 409
    condition: "Submitting an otherwise clean attempt while a ReconditioningItem of the inspection is still REQUIRED."
  - id: ERR_VEHICLE_ALREADY_CERTIFIED
    http: 409
    condition: "The vehicle already has a certification in ACTIVE or UNDER_AUDIT, so the certification slot cannot be taken."
  - id: ERR_DOCUMENTATION_INCOMPLETE
    http: 422
    condition: "The documents array omits a required doc_type, including RECONDITIONING_INVOICE when the inspection generated repairs."
  - id: ERR_DOCUMENT_NOT_APPLICABLE
    http: 422
    condition: "The documents array carries a duplicate doc_type, or RECONDITIONING_INVOICE for an inspection that generated no repairs."
  - id: ERR_MARKETING_STANDARD_VIOLATION
    http: 422
    condition: "disclosure_fields omits a ProgramConfig.listing_required_disclosure_fields token, or a THIRD_PARTY_AGGREGATOR syndication is attempted by a dealer that is not ACTIVE."
  - id: ERR_DUPLICATE_RESOURCE
    http: 409
    condition: "Duplicate franchise_code, vin, template code, item_code within a template, credential_id within a dealer, or a second live listing for the same certification and channel."
  - id: ERR_INSPECTION_DATE_IN_FUTURE
    http: 422
    condition: "started_at is after the logical clock."
  - id: ERR_TECHNICIAN_CREDENTIAL_EXPIRED
    http: 422
    condition: "The technician's credential_status is REVOKED, or credential_expires_at is at or before the logical clock."
  - id: ERR_TECHNICIAN_SLOT_CONFLICT
    http: 409
    condition: "The candidate buffered closed slot touches or overlaps another non-VOIDED inspection slot of the same technician."
  - id: ERR_REINSPECTION_DEADLINE_PASSED
    http: 409
    condition: "The logical clock is past Complaint.reinspection_deadline_at when the re-inspection is opened."
  - id: ERR_NO_COVERAGE_REMAINING
    http: 422
    condition: "The program cap collapses the coverage interval: warranty_end_date <= warranty_start_date, or warranty_end_miles <= odometer_at_inspection."
  - id: ERR_COVERAGE_WINDOW_OVERLAP
    http: 409
    condition: "The candidate half-open coverage interval overlaps a retained interval on the same vehicle; adjacency at a shared endpoint is allowed."
  - id: ERR_OUTSIDE_WARRANTY_WINDOW
    http: 422
    condition: "repair_date falls outside [warranty_start_date, warranty_end_date), or repair_odometer_miles exceeds warranty_end_miles."
  - id: ERR_CLAIM_AMOUNT_EXCEEDS_CAP
    http: 422
    condition: "claimed_amount_cents exceeds ProgramConfig.claim_per_claim_cap_cents."
  - id: ERR_RECONDITIONING_COST_EXCEEDS_CAP
    http: 422
    condition: "actual_cost_cents exceeds the resolved ChecklistItem.max_reconditioning_cost_cents."

  - id: ERR_TEMPLATE_NOT_PUBLISHABLE
    http: 422
    condition: "Publishing a DRAFT ChecklistTemplate whose point_count is 0, or whose critical_item_count is 0: a multipoint inspection must carry at least one point and at least one CRITICAL point."

  - id: ERR_CRITICAL_RECONDITIONING_NOT_WAIVABLE
    http: 422
    condition: "Closing a ReconditioningItem with resolution WAIVED while its severity is CRITICAL; a critical repair must be performed and costed, never excused."

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ProgramAdministrator
    description: "Automaker program office. Owns the program tunables, the checklist catalogue, dealer enrolment and privilege, certification adjudication, claim adjudication and reconditioning waivers. Cannot draw or rule on audit samples."
    identity: opaque
    exclusive_operations:
      - "PUT /cpo/program-config"
      - "POST /cpo/checklist-templates"
      - "POST /cpo/checklist-templates/{id}/items"
      - "POST /cpo/checklist-templates/{id}/publish"
      - "POST /cpo/dealers"
      - "PATCH /cpo/dealers/{id}/privilege"
      - "POST /cpo/certifications/{id}/approve"
      - "POST /cpo/warranty-claims/{id}/adjudicate"
      - "POST /cpo/_clock/set_current_utc"
      - "POST /cpo/reconditioning-items/{id}/complete with resolution WAIVED"
    shared_operations:
      - "GET /cpo/program-config"
      - "POST /cpo/dealers/{id}/technicians"
      - "POST /cpo/vehicles"
      - "POST /cpo/vehicles/{id}/history-events"
      - "POST /cpo/certifications/{id}/decertify"
      - "every GET read"
  - name: ProgramAuditor
    description: "Independent compliance function. Draws audit samples and records findings; deliberately cannot approve the certifications it audits, enrol dealers or move a dealer's privilege by hand — the suspension it causes must arrive through the audit-failure threshold, not by fiat."
    identity: opaque
    exclusive_operations:
      - "POST /cpo/audit-runs"
      - "POST /cpo/audit-samples/{id}/finding"
    shared_operations:
      - "GET /cpo/program-config"
      - "every GET read, including GET /cpo/certifications/{id}/documents and GET /cpo/certifications/{id}/audit-samples"
  - name: DealerPrincipal
    description: "Certifying dealer. Opens inspections, submits certifications with their documentation, advertises and syndicates, and files warranty claims. Every write is scoped to its own dealer_id."
    identity: "entity_backed:Dealer"
    exclusive_operations:
      - "POST /cpo/inspections"
      - "POST /cpo/inspections/{id}/submit"
      - "POST /cpo/certifications"
      - "POST /cpo/listings"
      - "POST /cpo/listings/{id}/syndicate"
      - "POST /cpo/warranty-claims"
    shared_operations:
      - "GET /cpo/program-config"
      - "POST /cpo/dealers/{id}/technicians"
      - "POST /cpo/vehicles"
      - "POST /cpo/vehicles/{id}/history-events"
      - "POST /cpo/certifications/{id}/decertify"
      - "reads scoped to its own dealer_id"
  - name: InspectionTechnician
    description: "Credentialed inspector employed by a dealer. Records checklist outcomes for its own inspections and closes reconditioning items on OTHER technicians' inspections. Cannot open, submit or certify."
    identity: "entity_backed:Technician"
    exclusive_operations:
      - "PUT /cpo/inspections/{id}/results"
      - "POST /cpo/reconditioning-items/{id}/complete with resolution COMPLETED"
    shared_operations:
      - "GET /cpo/program-config"
      - "GET /cpo/inspections, GET /cpo/inspections/{id}, GET /cpo/inspections/{id}/results, GET /cpo/inspections/{id}/reconditioning-items, GET /cpo/checklist-templates/{id} and its items"
  - name: CustomerAdvocate
    description: "Program-side customer relations. Logs consumer complaints against certified vehicles and reads the consumer-facing certification, listing and complaint record. Cannot inspect, certify, adjudicate or audit."
    identity: opaque
    exclusive_operations:
      - "POST /cpo/complaints"
    shared_operations:
      - "GET /cpo/program-config"
      - "GET /cpo/vehicles/{id}"
      - "GET /cpo/certifications, GET /cpo/certifications/{id}"
      - "GET /cpo/certifications/{id}/listings"
      - "GET /cpo/certifications/{id}/complaints"
      - "GET /cpo/complaints/{id}"

