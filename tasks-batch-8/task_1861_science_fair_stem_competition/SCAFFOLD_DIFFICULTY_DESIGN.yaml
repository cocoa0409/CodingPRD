              as: OperationsLead
            - call: "POST /science-fair/projects/${pbz_id}/booth-assignments"
              payload: { hall: "A", booth_number: 2, inspection_window_start: "2026-08-01T00:00:00Z", inspection_window_end: "2026-08-10T00:00:00Z" }
              as: OperationsLead
            - call: "POST /science-fair/projects/${pam_id}/booth-assignments"
              payload: { hall: "A", booth_number: 1, inspection_window_start: "2026-08-01T00:00:00Z", inspection_window_end: "2026-08-10T00:00:00Z" }
              as: OperationsLead
            - call: "POST /science-fair/projects/${pbm_id}/booth-assignments"
              payload: { hall: "A", booth_number: 2, inspection_window_start: "2026-08-01T00:00:00Z", inspection_window_end: "2026-08-10T00:00:00Z" }
              as: OperationsLead
            - call: "POST /science-fair/projects/${paz_id}/inspection-result"
              payload: { result: "PASS" }
              as: SafetyInspector
            - call: "POST /science-fair/projects/${pbz_id}/inspection-result"
              payload: { result: "PASS" }
              as: SafetyInspector
            - call: "POST /science-fair/projects/${pam_id}/inspection-result"
              payload: { result: "PASS" }
              as: SafetyInspector
            - call: "POST /science-fair/projects/${pbm_id}/inspection-result"
              payload: { result: "PASS" }
              as: SafetyInspector
            - call: "POST /science-fair/fair-editions/${ez_id}/begin-judging"
              payload: {}
              as: FairDirector
            - call: "POST /science-fair/fair-editions/${em_id}/begin-judging"
              payload: {}
              as: FairDirector
            - call: "POST /science-fair/judges"
              payload: { fair_edition_id: "${ez_id}", full_name: "Judge Z1", max_assignments: 5 }
              as: FairDirector
              captures: { jz1: $.data.id }
            - call: "POST /science-fair/judges"
              payload: { fair_edition_id: "${ez_id}", full_name: "Judge Z2", max_assignments: 5 }
              as: FairDirector
              captures: { jz2: $.data.id }
            - call: "POST /science-fair/judges"
              payload: { fair_edition_id: "${em_id}", full_name: "Judge M1", max_assignments: 5 }
              as: FairDirector
              captures: { jm1: $.data.id }
            - call: "POST /science-fair/judges"
              payload: { fair_edition_id: "${em_id}", full_name: "Judge M2", max_assignments: 5 }
              as: FairDirector
              captures: { jm2: $.data.id }
            - call: "POST /science-fair/judges/${jz1}/activate"
              payload: {}
              as: FairDirector
            - call: "POST /science-fair/judges/${jz2}/activate"
              payload: {}
              as: FairDirector
            - call: "POST /science-fair/judges/${jm1}/activate"
              payload: {}
              as: FairDirector
            - call: "POST /science-fair/judges/${jm2}/activate"
              payload: {}
              as: FairDirector
            - call: "POST /science-fair/projects/${paz_id}/judging-assignments"
              payload: { judge_id: "${jz1}" }
              as: FairDirector
              captures: { az1: $.data.id }
            - call: "POST /science-fair/projects/${paz_id}/judging-assignments"
              payload: { judge_id: "${jz2}" }
              as: FairDirector
              captures: { az2: $.data.id }
            - call: "POST /science-fair/projects/${pbz_id}/judging-assignments"
              payload: { judge_id: "${jz1}" }
              as: FairDirector
              captures: { bz1: $.data.id }
            - call: "POST /science-fair/projects/${pbz_id}/judging-assignments"
              payload: { judge_id: "${jz2}" }
              as: FairDirector
              captures: { bz2: $.data.id }
            - call: "POST /science-fair/projects/${pam_id}/judging-assignments"
              payload: { judge_id: "${jm1}" }
              as: FairDirector
              captures: { am1: $.data.id }
            - call: "POST /science-fair/projects/${pam_id}/judging-assignments"
              payload: { judge_id: "${jm2}" }
              as: FairDirector
              captures: { am2: $.data.id }
            - call: "POST /science-fair/projects/${pbm_id}/judging-assignments"
              payload: { judge_id: "${jm1}" }
              as: FairDirector
              captures: { bm1: $.data.id }
            - call: "POST /science-fair/projects/${pbm_id}/judging-assignments"
              payload: { judge_id: "${jm2}" }
              as: FairDirector
              captures: { bm2: $.data.id }
          trigger:
            - call: "POST /science-fair/judging-assignments/${az1}/score-sheets"
              payload: { raw_score: 70 }
              as: Judge
              as_user_id: "${jz1}"
            - call: "POST /science-fair/judging-assignments/${az2}/score-sheets"
              payload: { raw_score: 88 }
              as: Judge
              as_user_id: "${jz2}"
            - call: "POST /science-fair/judging-assignments/${bz1}/score-sheets"
              payload: { raw_score: 90 }
              as: Judge
              as_user_id: "${jz1}"
            - call: "POST /science-fair/judging-assignments/${bz2}/score-sheets"
              payload: { raw_score: 100 }
              as: Judge
              as_user_id: "${jz2}"
            - call: "POST /science-fair/judging-assignments/${am1}/score-sheets"
              payload: { raw_score: 70 }
              as: Judge
              as_user_id: "${jm1}"
            - call: "POST /science-fair/judging-assignments/${am2}/score-sheets"
              payload: { raw_score: 88 }
              as: Judge
              as_user_id: "${jm2}"
            - call: "POST /science-fair/judging-assignments/${bm1}/score-sheets"
              payload: { raw_score: 90 }
              as: Judge
              as_user_id: "${jm1}"
            - call: "POST /science-fair/judging-assignments/${bm2}/score-sheets"
              payload: { raw_score: 100 }
              as: Judge
              as_user_id: "${jm2}"
          assert:
            - "Project.${paz_id}.final_aggregate == -1.00"
            - "Project.${pam_id}.final_aggregate == 0.00"
            - "Project.${pbz_id}.final_aggregate == 1.00"
            - "Project.${pbm_id}.final_aggregate == 1.00"
            - "Project.${paz_id}.final_aggregate != Project.${pam_id}.final_aggregate (identical raw data, different variant)"
      - name: mentor_recognition_strict_vs_inclusive
        grounds:
          - calculations.mentor_recognition
          - entities.Mentor.fields.recognition_points
          - entities.Mentor.fields.leaderboard_points
          - entities.Mentor.fields.recognition_tier
        distinguishing_aspect: |
          Mentor entity domain (distinct from the ScoreSheet/Project normalization
          instance): STRICT recognition_points exclude WAITLISTED projects while
          INCLUSIVE leaderboard_points add +4 per waitlisted project — identical
          outcomes produce different point totals, and only STRICT feeds
          recognition_tier. Mentor here has P1 ADVANCED+CATEGORY_FIRST (9 pts) and
          P2 WAITLISTED (0 STRICT / 4 INCLUSIVE): recognition_points 9 (tier NONE)
          vs leaderboard_points 13.
