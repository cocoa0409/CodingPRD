  - { method: POST, path: "/api/territories/{id}/grant", description: "grant or supersede grant of a territory to a distributor; OCC on territory version", roles: [BrandAdmin], code: 200, input: [distributor_id, expected_territory_version], output: Territory, side_effects: ["Distributor PROSPECT -> ACTIVE for the named distributor", "increments Territory.version by 1"] }
  - { method: POST, path: "/api/territories/{id}/revoke", description: "GRANTED -> REVOKED", roles: [BrandAdmin], code: 200, input: [], output: Territory, side_effects: ["increments Territory.version by 1"] }
  - { method: POST, path: "/api/accounts", description: "distributor proposes a retail account in a territory it holds; initial status UNDER_REVIEW", roles: [DistributorRep], code: 201, input: [name, channel, territory_id], output: Account, side_effects: ["distributor_id set from X-User-ID"] }
  - { method: GET, path: "/api/accounts", description: "list accounts; filters approval_status?, territory_id?, distributor_id?, channel?", roles: [BrandAdmin, DistributorRep, RetailManager, SafetyOfficer], code: 200, input: ["approval_status?", "territory_id?", "distributor_id?", "channel?"], output: "Account[]", side_effects: [] }
  - { method: POST, path: "/api/accounts/{id}/review", description: "approve or reject an UNDER_REVIEW account", roles: [BrandAdmin], code: 200, input: [decision], output: Account, side_effects: ["on APPROVE: AccountProductAuthorization REQUESTED -> AUTHORIZED", "increments Account.version by 1"] }
  - { method: POST, path: "/api/accounts/{id}/suspend", description: "APPROVED -> SUSPENDED with authorization suspension + force-pull cascade", roles: [BrandAdmin], code: 200, input: [], output: Account, side_effects: ["authorizations AUTHORIZED -> SUSPENDED (ACCOUNT_SUSPEND)", "opened logs OPEN -> FORCE_PULLED", "increments Account.version by 1"] }
