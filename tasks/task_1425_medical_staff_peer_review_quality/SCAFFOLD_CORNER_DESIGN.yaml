        distinguishing_aspect: "care_appropriateness_score == 0 (below the 1..5 band) -> ERR_SCORE_OUT_OF_RANGE 422; the assignment stays PENDING."
        test_recipe:
          setup: ["provider; member B; case with B assigned"]
          setup_api_calls:
            - { call: "POST /peer-review/providers", payload: { full_name: "Subj Range", specialty: "SURGERY" }, as: QualityDirector, captures: { p_sub: $.data.id } }
            - { call: "POST /peer-review/providers", payload: { full_name: "Rev B", specialty: "SURGERY" }, as: QualityDirector, captures: { p_b: $.data.id } }
            - { call: "POST /peer-review/committee-members", payload: { provider_id: "${p_b}", member_role: "MEMBER" }, as: QualityDirector, captures: { m_b: $.data.id } }
            - { call: "POST /peer-review/cases", payload: { subject_provider_id: "${p_sub}", referral_source: "OTHER", referred_at: "2026-07-20T00:00:00Z", description: "range case" }, as: PeerReviewCoordinator, captures: { case1: $.data.id } }
