# =============================================================================
# Food Manager Certification & Exam Proctoring — Seed Tables (§1.0–§1.7)
# Difficulty band: Expert+ (deliberately above the Expert calibration in §0.4)
# =============================================================================

scenario: |
  Generate task harder than expert level!

  2682. Food Manager Certification & Exam Proctoring (ServSafe / National
  Restaurant Association): accredited exam scheduling across in-person and
  remote proctoring, candidate identity verification and exam security
  incident handling, course-to-exam bundling and access-code inventory,
  scoring, score reporting and certificate issuance with jurisdiction
  acceptance rules, local health-department registration and certificate
  posting requirements, five-year recertification cycle and reminder
  campaigns, instructor/proctor registration and audit, accommodation
  requests and translated exam versions

domain_name: food-manager-certification
api_prefix: ""

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - ops_run_checkpoint

  entity_topology: graph
  # 14 peer entities linked by 24 foreign keys, including a self-referential
  # Certificate.superseded_by_certificate_id chain and two junction-shaped
  # entities (ExamSession joins Candidate x ExamForm x AccessCode x TestingSite
  # x Proctor x AccommodationRequest). No URL nesting beyond action sub-paths.

  state_machine_shape: parallel
  # ExamSession carries two independent dimensions (session_status x
  # proctoring_status); Proctor and LocalRegistration are cyclic; both
  # SecurityIncident and AccommodationRequest are branching fork-joins.

  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate

  role_model: segregation_of_duties
  # PlatformAdmin operator who finalizes a ScoreReport MUST NOT resolve a
  # SecurityIncident on that same ExamSession (X-User-ID compared).

  consistency_model: immediate

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Jurisdiction
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: local health department / state program name
        constraints: 1..120 chars
      - name: jurisdiction_code
        type: string
        source: input
        description: short code for the jurisdiction
        constraints: unique across Jurisdiction, 2..16 chars
      - name: accepted_accreditation_bodies
        type: array
        source: input
        description: accreditation bodies whose exam forms this jurisdiction accepts
        constraints: non-empty subset of {ANAB_CFP, ANSI_LEGACY, STATE_ONLY}
      - name: accepted_languages
        type: array
        source: input
        description: exam-form languages this jurisdiction accepts
        constraints: non-empty subset of {EN, ES, ZH, VI}
      - name: accepts_remote_proctoring
        type: boolean
        source: input
        description: whether remote-proctored sessions are accepted here
        default: true
      - name: min_passing_score_override
        type: integer
        source: input
        description: jurisdiction cut score that overrides the form's national cut when stricter; null means no override
        default: null
        constraints: null or 0..100
      - name: requires_local_registration
        type: boolean
        source: input
        description: whether certificate holders must file a LocalRegistration here
        default: true
      - name: posting_deadline_days
        type: integer
        source: input
        description: days after filing within which the certificate must be posted on premises
        default: 30
        constraints: 1..365
      - name: recert_cycle_months
        type: integer
        source: input
        description: certificate validity period in months
        default: 60
        constraints: 12..120
      - name: exam_fee_surcharge_pct
        type: number
        source: input
        description: per-line surcharge applied to access-code batch line subtotals
        default: 0.0
        constraints: 0.0..0.25, at most 3 decimals

  - name: TrainingProvider
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: registered provider name
        constraints: 1..160 chars
      - name: jurisdiction_id
        type: string
        source: input
        description: FK -> Jurisdiction.id; home jurisdiction whose surcharge applies to this provider's batches
      - name: contact_email
        type: string
        source: input
        description: provider billing contact
        constraints: must contain '@'
      - name: lifetime_credited_cents
        type: integer
        source: computed
        description: cumulative credits (prepayments plus refunds) posted to this provider
        default: 0
      - name: lifetime_charged_cents
        type: integer
        source: computed
        description: cumulative debits (batch purchases plus certificate issuance fees) posted to this provider
        default: 0
      - name: credit_balance_cents
        type: integer
        source: computed
        description: lifetime_credited_cents - lifetime_charged_cents; never written directly
        default: 0

  - name: ExamForm
    parent: null
    common_fields: true
    fields:
      - name: form_code
        type: string
        source: input
        description: exam form family code
        constraints: unique together with version_label and language
      - name: version_label
        type: string
        source: input
        description: psychometric version label
      - name: language
        type: enum
        source: input
        description: language this form is published in
        constraints: one of {EN, ES, ZH, VI}
      - name: accreditation_body
        type: enum
        source: input
        description: accrediting body for this form
        constraints: one of {ANAB_CFP, ANSI_LEGACY, STATE_ONLY}
      - name: scored_item_count
        type: integer
        source: input
        description: number of scored items on the form (denominator of the scaled score)
        constraints: 10..200
      - name: pretest_item_count
        type: integer
        source: input
        description: number of unscored pretest items; never enters any scaled score
        default: 0
        constraints: 0..40
      - name: national_cut_score
        type: integer
        source: input
        description: national scaled cut score for this form
        constraints: 0..100
      - name: base_minutes
        type: integer
        source: input
        description: standard testing time in minutes before accommodation, translation, or remote allowances
        constraints: 30..240
      - name: translated_extra_minutes
        type: integer
        source: input
        description: additional minutes granted when language != EN
        default: 0
        constraints: 0..60
      - name: status
        type: enum
        source: system
        description: publication status; ACTIVE at creation, RETIRED by POST /exam-forms/{id}/retire
        default: ACTIVE
        constraints: one of {ACTIVE, RETIRED}

  - name: TestingSite
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: proctored testing center name
      - name: jurisdiction_id
        type: string
        source: input
        description: FK -> Jurisdiction.id; jurisdiction the site sits in
      - name: seat_count
        type: integer
        source: input
        description: number of concurrently usable proctored seats
        constraints: 1..50
      - name: address_line
        type: string
        source: input
        description: street address of the site
      - name: languages_supported
        type: array
        source: input
        description: exam-form languages this site can deliver in person
        constraints: non-empty subset of {EN, ES, ZH, VI}
      - name: reserved_seat_minutes
        type: integer
        source: computed
        description: sum of allowed_minutes over ExamSessions at this site whose session_status IN {SCHEDULED, CHECKED_IN, IN_PROGRESS}
        default: 0

  - name: Candidate
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: candidate legal name as printed on the certificate
      - name: email
        type: string
        source: input
        description: candidate contact email
        constraints: unique across Candidate, must contain '@'
      - name: preferred_language
        type: enum
        source: input
        description: candidate's preferred exam language
        constraints: one of {EN, ES, ZH, VI}
      - name: training_provider_id
        type: string
        source: input
        description: FK -> TrainingProvider.id; provider that enrolled this candidate
      - name: jurisdiction_id
        type: string
        source: input
        description: FK -> Jurisdiction.id; jurisdiction whose acceptance rules govern this candidate
      - name: security_hold
        type: boolean
        source: computed
        description: true once a CRITICAL SecurityIncident on one of this candidate's sessions is SUBSTANTIATED; blocks new scheduling and code assignment
        default: false
      - name: substantiated_incident_count
        type: integer
        source: computed
        description: count of SUBSTANTIATED SecurityIncidents across this candidate's ExamSessions
        default: 0
      - name: compliance_status
        type: enum
        source: computed
        description: derived posture; NOT_CERTIFIED at creation, CERTIFIED while an ISSUED Certificate exists, LAPSED when that certificate EXPIRED, NON_COMPLIANT when it was REVOKED
        default: NOT_CERTIFIED
        constraints: one of {NOT_CERTIFIED, CERTIFIED, LAPSED, NON_COMPLIANT}

  - name: Proctor
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: proctor / instructor legal name
      - name: email
        type: string
        source: input
        description: proctor contact email
        constraints: unique across Proctor, must contain '@'
      - name: training_provider_id
        type: string
        source: input
        description: FK -> TrainingProvider.id; provider that registered this proctor
      - name: roles_held
        type: array
        source: input
        description: registration roles held
        constraints: non-empty subset of {PROCTOR, INSTRUCTOR}
      - name: languages_certified
        type: array
        source: input
        description: exam-form languages this proctor is certified to proctor
        constraints: non-empty subset of {EN, ES, ZH, VI}
      - name: remote_certified
        type: boolean
        source: input
        description: whether this proctor may run REMOTE sessions
        default: false
      - name: registration_status
        type: enum
        source: system
        description: registration lifecycle state (see §1.2)
        default: PENDING
        constraints: one of {PENDING, REGISTERED, REJECTED, UNDER_AUDIT, SUSPENDED, REVOKED}
      - name: proctored_session_count
        type: integer
        source: computed
        description: count of this proctor's ExamSessions whose session_status IN {SUBMITTED, CLOSED, INVALIDATED}
        default: 0
      - name: substantiated_incident_weight_total
        type: integer
        source: computed
        description: sum of severity_weight over SUBSTANTIATED SecurityIncidents on this proctor's sessions (lifetime)
        default: 0
      - name: risk_score
        type: number
        source: computed
        description: audit risk score, 2 decimals; see calculations.proctor_audit_risk_score
        default: 0.00
      - name: risk_variant_applied
        type: enum
        source: computed
        description: which variant produced the current risk_score
        default: ROLLING_WINDOW
        constraints: one of {ROLLING_WINDOW, LIFETIME_CUMULATIVE}
      - name: reserved_minutes
        type: integer
        source: computed
        description: sum of allowed_minutes over this proctor's ExamSessions whose session_status IN {SCHEDULED, CHECKED_IN, IN_PROGRESS} and proctoring_status IN {ASSIGNED}
        default: 0
      - name: suspended_reason
        type: enum
        source: system
        description: why the proctor was suspended; null unless registration_status == SUSPENDED
        default: null
        constraints: null or one of {AUDIT_FAILURE, RISK_THRESHOLD_BREACH}

  - name: AccessCodeBatch
    parent: null
    common_fields: true
    fields:
      - name: training_provider_id
        type: string
        source: input
        description: FK -> TrainingProvider.id; purchasing provider, also the ledger debited
      - name: exam_form_id
        type: string
        source: input
        description: FK -> ExamForm.id; the single form every code in this batch unlocks
      - name: line_items
        type: array
        source: input
        description: purchase lines, each an object { bundle_type, quantity }
        constraints: 1..4 lines, bundle_type one of {EXAM_ONLY, COURSE_PLUS_EXAM} and unique per batch, quantity 1..500
      - name: quantity_purchased
        type: integer
        source: computed
        description: sum of line_items[].quantity; equals the number of AccessCode rows minted at creation
      - name: total_price_cents
        type: integer
        source: computed
        description: see calculations.batch_purchase_price (round per line then sum)
      - name: available_count
        type: integer
        source: computed
        description: count of child AccessCodes with status == AVAILABLE
      - name: assigned_count
        type: integer
        source: computed
        description: count of child AccessCodes with status == ASSIGNED
      - name: consumed_count
        type: integer
        source: computed
        description: count of child AccessCodes with status == CONSUMED
      - name: voided_count
        type: integer
        source: computed
        description: count of child AccessCodes with status IN {VOIDED, EXPIRED}
      - name: expires_at
        type: datetime
        source: input
        description: instant after which unconsumed codes in this batch expire
      - name: status
        type: enum
        source: system
        description: batch lifecycle state (see §1.2)
        default: ACTIVE
        constraints: one of {ACTIVE, DEPLETED, EXPIRED, VOIDED}
      - name: void_gross_credit_cents
        type: integer
        source: computed
        description: gross refund computed at void time; null until voided
        default: null
      - name: void_restock_fee_cents
        type: integer
        source: computed
        description: restock fee retained at void time; null until voided
        default: null
      - name: void_net_credit_cents
        type: integer
        source: computed
        description: net credit posted to the provider at void time; null until voided
        default: null

  - name: AccessCode
    parent: null
    common_fields: true
    fields:
      - name: batch_id
        type: string
        source: input
        description: FK -> AccessCodeBatch.id; batch that minted this code
      - name: candidate_id
        type: string
        source: input
        description: FK -> Candidate.id; assignee, null while status == AVAILABLE
        default: null
      - name: code
        type: string
        source: system
        description: server-minted redemption code, identity only; MUST NOT influence any selector, ordering, or tie-break
        constraints: unique across AccessCode
      - name: bundle_type
        type: enum
        source: system
        description: bundle this code was minted under, copied from the batch line item
        constraints: one of {EXAM_ONLY, COURSE_PLUS_EXAM}
      - name: status
        type: enum
        source: system
        description: code lifecycle state (see §1.2)
        default: AVAILABLE
        constraints: one of {AVAILABLE, ASSIGNED, CONSUMED, VOIDED, EXPIRED}
      - name: assigned_at
        type: datetime
        source: system
        description: logical-clock instant of the most recent assignment; null while AVAILABLE
        default: null
      - name: consumed_at
        type: datetime
        source: system
        description: logical-clock instant the code was consumed by exam submission
        default: null
      - name: course_completed_at
        type: datetime
        source: system
        description: logical-clock instant the bundled course was signed off by a registered INSTRUCTOR; stays null for EXAM_ONLY
        default: null
      - name: course_instructor_proctor_id
        type: string
        source: input
        description: FK -> Proctor.id; instructor who signed off the bundled course, null until course completion
        default: null
      - name: assignment_release_count
        type: integer
        source: computed
        description: number of times this code returned from ASSIGNED to AVAILABLE
        default: 0

  - name: AccommodationRequest
    parent: null
    common_fields: true
    fields:
      - name: candidate_id
        type: string
        source: input
        description: FK -> Candidate.id; requesting candidate
      - name: accommodation_type
        type: enum
        source: input
        description: requested accommodation
        constraints: one of {EXTRA_TIME, READER_ASSIST, SEPARATE_ROOM, TRANSLATED_FORM}
      - name: requested_multiplier
        type: number
        source: input
        description: requested testing-time multiplier
        constraints: 1.0..2.0, at most 2 decimals
      - name: documentation_ref
        type: string
        source: input
        description: reference to supporting documentation on file
      - name: requested_language
        type: enum
        source: input
        description: language requested when accommodation_type == TRANSLATED_FORM
        default: null
        constraints: null or one of {EN, ES, ZH, VI}
      - name: status
        type: enum
        source: system
        description: review lifecycle state (see §1.2)
        default: REQUESTED
        constraints: one of {REQUESTED, UNDER_REVIEW, APPROVED, DENIED}
      - name: approved_multiplier
        type: number
        source: computed
        description: multiplier actually granted; null unless status == APPROVED
        default: null
      - name: decision_reason
        type: string
        source: system
        description: reviewer note recorded at decision time
        default: null
      - name: reviewed_by_user_id
        type: string
        source: system
        description: opaque X-User-ID of the PlatformAdmin who decided the request
        default: null

  - name: ExamSession
    parent: null
    common_fields: true
    fields:
      - name: candidate_id
        type: string
        source: input
        description: FK -> Candidate.id; the examinee
      - name: exam_form_id
        type: string
        source: input
        description: FK -> ExamForm.id; form to be delivered
      - name: access_code_id
        type: string
        source: input
        description: FK -> AccessCode.id; code redeemed by this sitting
      - name: testing_site_id
        type: string
        source: input
        description: FK -> TestingSite.id; required for IN_PERSON, must be null for REMOTE
        default: null
      - name: proctor_id
        type: string
        source: input
        description: FK -> Proctor.id; assigned proctor, null while proctoring_status == PENDING_ASSIGNMENT
        default: null
      - name: accommodation_request_id
        type: string
        source: input
        description: FK -> AccommodationRequest.id; APPROVED accommodation applied to this sitting, null when none
        default: null
      - name: delivery_mode
        type: enum
        source: input
        description: proctoring channel
        constraints: one of {IN_PERSON, REMOTE}
      - name: scheduled_start_at
        type: datetime
        source: input
        description: planned start instant of the sitting
      - name: allowed_minutes
        type: integer
        source: computed
        description: see calculations.session_allowed_minutes
      - name: scheduled_end_at
        type: datetime
        source: computed
        description: scheduled_start_at plus allowed_minutes; the occupancy interval end used by both overlap rules
      - name: session_status
        type: enum
        source: system
        description: delivery dimension of the session (see §1.2)
        default: SCHEDULED
        constraints: one of {SCHEDULED, CHECKED_IN, IN_PROGRESS, SUBMITTED, CLOSED, CANCELLED, INVALIDATED}
      - name: proctoring_status
        type: enum
        source: system
        description: proctoring-integrity dimension of the session, evolving independently of session_status (see §1.2)
        default: PENDING_ASSIGNMENT
        constraints: one of {PENDING_ASSIGNMENT, ASSIGNED, PENDING_REPROCTOR, ATTESTED, INCIDENT_UNDER_REVIEW, CLEARED, COMPROMISED}
      - name: id_document_type
        type: enum
        source: input
        description: identity document presented at check-in
        default: null
        constraints: null or one of {GOVT_PHOTO_ID, PASSPORT, MILITARY_ID}
      - name: id_document_expires_on
        type: string
        source: input
        description: ISO 8601 date (YYYY-MM-DD) the presented document expires
        default: null
      - name: biometric_match_score
        type: integer
        source: input
        description: 0..100 liveness/face-match score captured at check-in; required for REMOTE
        default: null
        constraints: null or 0..100
      - name: proctor_attestation
        type: boolean
        source: input
        description: proctor's in-person identity attestation flag
        default: false
      - name: identity_verified_at
        type: datetime
        source: system
        description: logical-clock instant identity verification passed
        default: null
      - name: checked_in_at
        type: datetime
        source: system
        description: logical-clock instant of check-in
        default: null
      - name: started_at
        type: datetime
        source: system
        description: logical-clock instant the exam started
        default: null
      - name: submitted_at
        type: datetime
        source: system
        description: logical-clock instant the exam was submitted
        default: null
      - name: reschedule_count
        type: integer
        source: computed
        description: number of accepted reschedules on this session
        default: 0

  - name: ScoreReport
    parent: null
    common_fields: true
    fields:
      - name: exam_session_id
        type: string
        source: input
        description: FK -> ExamSession.id; sitting this report scores
      - name: exam_form_id
        type: string
        source: input
        description: FK -> ExamForm.id; form version the score is equated against
      - name: raw_correct_count
        type: integer
        source: computed
        description: scored items answered correctly, copied from the submission's scored_correct_count
      - name: pretest_correct_count
        type: integer
        source: computed
        description: pretest items answered correctly; recorded for psychometrics and excluded from every scaled score
        default: 0
      - name: voided_item_count
        type: integer
        source: computed
        description: scored items keyed out at finalization; 0 until finalized
        default: 0
      - name: voided_correct_count
        type: integer
        source: computed
        description: how many keyed-out items this candidate had answered correctly; 0 until finalized
        default: 0
      - name: provisional_scaled_score
        type: integer
        source: computed
        description: see calculations.scaled_score variant PROVISIONAL
      - name: final_scaled_score
        type: integer
        source: computed
        description: see calculations.scaled_score variant FINAL_EQUATED; null until finalized
        default: null
      - name: effective_cut_score
        type: integer
        source: computed
        description: see calculations.effective_cut_score; frozen onto the report at creation
      - name: pass_flag
        type: boolean
        source: computed
        description: null until finalized, then final_scaled_score >= effective_cut_score; forced to false when status becomes VOIDED
        default: null
      - name: status
        type: enum
        source: system
        description: scoring lifecycle state (see §1.2)
        default: PROVISIONAL
        constraints: one of {PROVISIONAL, FINAL, VOIDED}
      - name: finalized_by_user_id
        type: string
        source: system
        description: opaque X-User-ID of the PlatformAdmin who finalized this report; segregation-of-duties key
        default: null
      - name: released_at
        type: datetime
        source: system
        description: logical-clock instant the score was released to the candidate
        default: null

  - name: SecurityIncident
    parent: null
    common_fields: true
    fields:
      - name: exam_session_id
        type: string
        source: input
        description: FK -> ExamSession.id; sitting the incident occurred on
      - name: reported_by_proctor_id
        type: string
        source: input
        description: FK -> Proctor.id; proctor who filed the report
      - name: category
        type: enum
        source: input
        description: incident category
        constraints: one of {IMPERSONATION, PROHIBITED_MATERIAL, ROOM_SCAN_REFUSAL, CONTENT_DISCLOSURE}
      - name: severity
        type: enum
        source: input
        description: severity as filed
        constraints: one of {MINOR, MAJOR, CRITICAL}
      - name: narrative
        type: string
        source: input
        description: free-text description of what was observed
        constraints: 10..2000 chars
      - name: severity_weight
        type: integer
        source: computed
        description: MINOR=1, MAJOR=3, CRITICAL=5; frozen at creation
      - name: status
        type: enum
        source: system
        description: review lifecycle state (see §1.2)
        default: OPEN
        constraints: one of {OPEN, UNDER_REVIEW, SUBSTANTIATED, DISMISSED}
      - name: resolved_by_user_id
        type: string
        source: system
        description: opaque X-User-ID of the PlatformAdmin who resolved the incident; segregation-of-duties key
        default: null
      - name: resolution_note
        type: string
        source: system
        description: reviewer note recorded at resolution
        default: null

  - name: Certificate
    parent: null
    common_fields: true
    fields:
      - name: candidate_id
        type: string
        source: computed
        description: FK -> Candidate.id; certificate holder
      - name: score_report_id
        type: string
        source: input
        description: FK -> ScoreReport.id; the FINAL passing report this certificate was issued from
      - name: jurisdiction_id
        type: string
        source: computed
        description: FK -> Jurisdiction.id; accepting jurisdiction, copied from the candidate at issuance
      - name: superseded_by_certificate_id
        type: string
        source: system
        description: FK -> Certificate.id; self-reference set on the older certificate when a recertification certificate is issued
        default: null
      - name: certificate_number
        type: string
        source: system
        description: printed certificate number, identity only; MUST NOT influence any selector, ordering, or tie-break
        constraints: unique across Certificate
      - name: issued_at
        type: datetime
        source: system
        description: logical-clock instant of issuance
      - name: expires_at
        type: datetime
        source: computed
        description: issued_at plus jurisdiction.recert_cycle_months months
      - name: recert_window_opens_at
        type: datetime
        source: computed
        description: expires_at minus RECERT_WINDOW_DAYS (180) days
      - name: status
        type: enum
        source: system
        description: certificate lifecycle state (see §1.2)
        default: ISSUED
        constraints: one of {ISSUED, EXPIRED, REVOKED, SUPERSEDED}
      - name: issuance_fee_cents
        type: integer
        source: computed
        description: CERT_ISSUANCE_FEE_CENTS debited from the holder's provider ledger at issuance
      - name: reminder_tiers_sent
        type: array
        source: computed
        description: recertification reminder tiers already dispatched by compliance runs, in dispatch order
        default: []
        constraints: subset of {T_180, T_90, T_30, T_LAPSED}, no duplicates
      - name: recert_authorized_at
        type: datetime
        source: system
        description: logical-clock instant the holder was authorized to sit a recertification exam
        default: null
      - name: revocation_reason
        type: enum
        source: system
        description: why the certificate was revoked
        default: null
        constraints: null or one of {SCORE_VOIDED, JURISDICTION_WITHDRAWAL}

  - name: LocalRegistration
    parent: null
    common_fields: true
    fields:
      - name: certificate_id
        type: string
        source: input
        description: FK -> Certificate.id; certificate being registered locally
      - name: jurisdiction_id
        type: string
        source: computed
        description: FK -> Jurisdiction.id; health department the filing is made with, copied from the certificate
      - name: establishment_name
        type: string
        source: input
        description: food establishment the certificate holder manages
      - name: establishment_address
        type: string
        source: input
        description: street address of the establishment
      - name: posting_location
        type: string
        source: input
        description: where the certificate is posted on premises; set at posting confirmation
        default: null
      - name: filed_at
        type: datetime
        source: system
        description: logical-clock instant of the current filing (reset on refiling)
      - name: posting_deadline_at
        type: datetime
        source: computed
        description: filed_at plus jurisdiction.posting_deadline_days days
      - name: posted_at
        type: datetime
        source: system
        description: logical-clock instant the posting was confirmed
        default: null
      - name: status
        type: enum
        source: system
        description: registration lifecycle state (see §1.2)
        default: FILED
        constraints: one of {FILED, POSTED, VERIFIED, REJECTED, DELINQUENT, WITHDRAWN}
      - name: rejection_reason
        type: string
        source: system
        description: health-department rejection note
        default: null
      - name: verified_by_user_id
        type: string
        source: system
        description: X-User-ID of the HealthOfficer who verified; equals Jurisdiction.id per §1.7
        default: null
      - name: refile_count
        type: integer
        source: computed
        description: number of times this registration was refiled after rejection
        default: 0

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: ExamSession
    dimension: session_status
    initial_state: SCHEDULED
    terminal_states: [CLOSED, CANCELLED, INVALIDATED]
    transitions:
      - from: SCHEDULED
        to: SCHEDULED
        trigger: "POST /exam-sessions/{id}/reschedule"
        actor: ProviderAdmin
        preconditions:
          - "expected_session_version == ExamSession.version"
          - "new scheduled_start_at >= logical_clock + SCHEDULE_LEAD_MINUTES (1440)"
          - "after releasing this session's own current interval, the new interval passes calculations.proctor_interval_conflict and calculations.site_seat_occupancy"
          - "ExamSession.session_status == SCHEDULED"
        side_effects:
          - "recompute allowed_minutes and scheduled_end_at via calculations.session_allowed_minutes"
          - "reschedule_count += 1"
          - "release then re-reserve TestingSite.reserved_seat_minutes and Proctor.reserved_minutes for the new interval"
          - "increments ExamSession.version by 1"
        note: "self-cycle; the only OCC-guarded session write"
      - from: SCHEDULED
        to: CHECKED_IN
        trigger: "POST /exam-sessions/{id}/check-in"
        actor: Proctor
        preconditions:
          - "ExamSession.proctoring_status == ASSIGNED"
          - "ExamSession.proctor_id == X-User-ID"
          - "logical_clock IN [scheduled_start_at - 30min, scheduled_start_at + 15min] (both bounds inclusive)"
          - "Candidate.security_hold == false"
          - "id_document_expires_on >= date(logical_clock)"
          - "delivery_mode == REMOTE => biometric_match_score present and >= BIOMETRIC_MATCH_MIN (85)"
          - "delivery_mode == IN_PERSON => proctor_attestation == true OR biometric_match_score >= BIOMETRIC_MATCH_MIN"
          - "AccessCode.bundle_type == EXAM_ONLY OR AccessCode.course_completed_at != null"
        side_effects:
          - "identity_verified_at = logical_clock"
          - "checked_in_at = logical_clock"
      - from: CHECKED_IN
        to: IN_PROGRESS
        trigger: "POST /exam-sessions/{id}/start"
        actor: Proctor
        preconditions:
          - "ExamSession.proctor_id == X-User-ID"
          - "identity_verified_at != null"
        side_effects:
          - "started_at = logical_clock"
      - from: IN_PROGRESS
        to: SUBMITTED
        trigger: "POST /exam-sessions/{id}/submission"
        actor: Proctor
        preconditions:
          - "ExamSession.proctor_id == X-User-ID"
          - "scored_correct_count <= ExamForm.scored_item_count"
          - "pretest_correct_count <= ExamForm.pretest_item_count"
        side_effects:
          - "submitted_at = logical_clock"
          - "create ScoreReport (status PROVISIONAL) with raw_correct_count, pretest_correct_count, provisional_scaled_score and effective_cut_score computed per §1.3"
          - "AccessCode ASSIGNED -> CONSUMED, consumed_at = logical_clock"
          - "AccessCodeBatch.consumed_count += 1, assigned_count -= 1"
          - "ExamSession.proctoring_status ASSIGNED -> ATTESTED"
          - "Proctor.proctored_session_count += 1"
      - from: SUBMITTED
        to: CLOSED
        trigger: "POST /score-reports/{id}/finalization"
        actor: PlatformAdmin
        preconditions:
          - "ScoreReport.status == PROVISIONAL"
          - "ExamSession.proctoring_status IN {ATTESTED, CLEARED}"
          - "voided_item_count < ExamForm.scored_item_count"
          - "voided_correct_count <= min(voided_item_count, raw_correct_count)"
        side_effects:
          - "ScoreReport PROVISIONAL -> FINAL, final_scaled_score and pass_flag computed per §1.3, released_at = logical_clock, finalized_by_user_id = X-User-ID"
          - "ExamSession.proctoring_status ATTESTED -> CLEARED when no SecurityIncident on this session has status IN {OPEN, UNDER_REVIEW}"
          - "release TestingSite.reserved_seat_minutes and Proctor.reserved_minutes for this session's interval"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /exam-sessions/{id}/cancellation"
        actor: ProviderAdmin
        preconditions:
          - "ExamSession.session_status IN {SCHEDULED, CHECKED_IN}"
        side_effects:
          - "AccessCode ASSIGNED -> AVAILABLE, candidate_id = null, assigned_at = null, assignment_release_count += 1"
          - "that AccessCode status change recomputes AccessCodeBatch.available_count += 1 and assigned_count -= 1"
          - "that counter change flips AccessCodeBatch DEPLETED -> ACTIVE when available_count becomes > 0"
          - "release TestingSite.reserved_seat_minutes and Proctor.reserved_minutes for this session's interval"
      - from: CHECKED_IN
        to: CANCELLED
        trigger: "POST /exam-sessions/{id}/cancellation"
        actor: ProviderAdmin
        preconditions:
          - "ExamSession.session_status IN {SCHEDULED, CHECKED_IN}"
        side_effects:
          - "same release chain as SCHEDULED -> CANCELLED"
      - from: SUBMITTED
        to: INVALIDATED
        trigger: "system: SecurityIncident UNDER_REVIEW -> SUBSTANTIATED on this session"
        actor: system
        preconditions:
          - "SecurityIncident.exam_session_id == ExamSession.id"
        side_effects:
          - "ExamSession.proctoring_status -> COMPROMISED"
          - "that invalidation voids the session's ScoreReport (see ScoreReport machine)"
      - from: CLOSED
        to: INVALIDATED
        trigger: "system: SecurityIncident UNDER_REVIEW -> SUBSTANTIATED on this session"
        actor: system
        preconditions:
          - "SecurityIncident.exam_session_id == ExamSession.id"
        side_effects:
          - "ExamSession.proctoring_status -> COMPROMISED"
          - "that invalidation voids the session's ScoreReport, which in turn revokes any Certificate issued from it (see §1.2 ScoreReport and Certificate machines)"

  - entity: ExamSession
    dimension: proctoring_status
    initial_state: PENDING_ASSIGNMENT
    terminal_states: [COMPROMISED]
    transitions:
      - from: PENDING_ASSIGNMENT
        to: ASSIGNED
        trigger: "POST /exam-sessions (with proctor_id supplied) or POST /exam-sessions/{id}/proctor-assignment"
        actor: ProviderAdmin
        preconditions:
          - "Proctor.registration_status == REGISTERED"
          - "ExamForm.language IN Proctor.languages_certified"
          - "delivery_mode == REMOTE => Proctor.remote_certified == true"
          - "the session interval passes calculations.proctor_interval_conflict for this proctor"
          - "ExamSession.session_status == SCHEDULED"
        side_effects:
          - "ExamSession.proctor_id = proctor_id"
          - "Proctor.reserved_minutes += ExamSession.allowed_minutes"
      - from: ASSIGNED
        to: PENDING_REPROCTOR
        trigger: "system: assigned Proctor leaves REGISTERED (audit suspension or risk-threshold breach)"
        actor: system
        preconditions:
          - "ExamSession.session_status == SCHEDULED"
        side_effects:
          - "ExamSession.proctor_id = null"
          - "Proctor.reserved_minutes -= ExamSession.allowed_minutes"
      - from: PENDING_REPROCTOR
        to: ASSIGNED
        trigger: "POST /exam-sessions/{id}/proctor-assignment"
        actor: ProviderAdmin
        preconditions:
          - "same preconditions as PENDING_ASSIGNMENT -> ASSIGNED"
        side_effects:
          - "ExamSession.proctor_id = proctor_id"
          - "Proctor.reserved_minutes += ExamSession.allowed_minutes"
        note: "closes the reproctoring cycle ASSIGNED -> PENDING_REPROCTOR -> ASSIGNED"
      - from: ASSIGNED
        to: ATTESTED
        trigger: "POST /exam-sessions/{id}/submission"
        actor: Proctor
        preconditions:
          - "proctor_attestation == true in the submission body"
        side_effects:
          - "no additional effects beyond the session_status dimension's SUBMITTED effects"
      - from: ATTESTED
        to: INCIDENT_UNDER_REVIEW
        trigger: "POST /security-incidents/{id}/review-open"
        actor: PlatformAdmin
        preconditions:
          - "SecurityIncident.status == OPEN"
        side_effects:
          - "SecurityIncident OPEN -> UNDER_REVIEW"
      - from: CLEARED
        to: INCIDENT_UNDER_REVIEW
        trigger: "POST /security-incidents/{id}/review-open"
        actor: PlatformAdmin
        preconditions:
          - "SecurityIncident.status == OPEN"
          - "logical_clock <= ExamSession.submitted_at + INCIDENT_FILING_WINDOW_HOURS (72)"
        side_effects:
          - "SecurityIncident OPEN -> UNDER_REVIEW"
        note: "cycle: a cleared session can re-enter review while the 72h window is open"
      - from: INCIDENT_UNDER_REVIEW
        to: CLEARED
        trigger: "POST /security-incidents/{id}/resolution with outcome DISMISS"
        actor: PlatformAdmin
        preconditions:
          - "SecurityIncident.status == UNDER_REVIEW"
        side_effects:
          - "SecurityIncident UNDER_REVIEW -> DISMISSED"
          - "no change to ScoreReport, Certificate, Candidate, or Proctor risk fields"
      - from: INCIDENT_UNDER_REVIEW
        to: COMPROMISED
        trigger: "POST /security-incidents/{id}/resolution with outcome SUBSTANTIATE"
        actor: PlatformAdmin
        preconditions:
          - "SecurityIncident.status == UNDER_REVIEW"
          - "X-User-ID != ScoreReport.finalized_by_user_id for this session's ScoreReport"
        side_effects:
          - "ExamSession.session_status -> INVALIDATED (see session_status dimension)"
          - "Candidate.substantiated_incident_count += 1; Candidate.security_hold = true when SecurityIncident.severity == CRITICAL"
          - "Proctor.substantiated_incident_weight_total += SecurityIncident.severity_weight, then Proctor.risk_score recomputed with variant LIFETIME_CUMULATIVE"
      - from: ATTESTED
        to: CLEARED
        trigger: "POST /score-reports/{id}/finalization"
        actor: PlatformAdmin
        preconditions:
          - "no SecurityIncident on this session has status IN {OPEN, UNDER_REVIEW}"
        side_effects:
          - "ScoreReport PROVISIONAL -> FINAL"

  - entity: Proctor
    initial_state: PENDING
    terminal_states: [REJECTED, REVOKED]
    transitions:
      - from: PENDING
        to: REGISTERED
        trigger: "POST /proctors/{id}/registration-decision with decision APPROVE"
        actor: PlatformAdmin
        preconditions: ["Proctor.registration_status == PENDING"]
        side_effects: ["risk_score = 0.00, risk_variant_applied = ROLLING_WINDOW"]
      - from: PENDING
        to: REJECTED
        trigger: "POST /proctors/{id}/registration-decision with decision REJECT"
        actor: PlatformAdmin
        preconditions: ["Proctor.registration_status == PENDING"]
        side_effects: ["terminal; proctor can never be assigned to a session"]
      - from: REGISTERED
        to: UNDER_AUDIT
        trigger: "POST /proctors/{id}/audit-open"
        actor: PlatformAdmin
        preconditions: ["Proctor.registration_status == REGISTERED"]
        side_effects:
          - "risk_score recomputed with variant ROLLING_WINDOW, risk_variant_applied = ROLLING_WINDOW"
          - "existing ASSIGNED sessions are untouched while UNDER_AUDIT"
      - from: UNDER_AUDIT
        to: REGISTERED
        trigger: "POST /proctors/{id}/audit-close with outcome PASS"
        actor: PlatformAdmin
        preconditions:
          - "Proctor.registration_status == UNDER_AUDIT"
          - "risk_score recomputed with variant LIFETIME_CUMULATIVE is < PROCTOR_RISK_SUSPEND_THRESHOLD (10.00)"
        side_effects:
          - "risk_score = lifetime value, risk_variant_applied = LIFETIME_CUMULATIVE"
        note: "cycle REGISTERED -> UNDER_AUDIT -> REGISTERED"
      - from: UNDER_AUDIT
        to: SUSPENDED
        trigger: "POST /proctors/{id}/audit-close with outcome SUSPEND, or system when the recomputed LIFETIME_CUMULATIVE risk_score >= PROCTOR_RISK_SUSPEND_THRESHOLD (10.00)"
        actor: PlatformAdmin | system
        preconditions: ["Proctor.registration_status == UNDER_AUDIT"]
        side_effects:
          - "suspended_reason = AUDIT_FAILURE when operator-chosen, RISK_THRESHOLD_BREACH when threshold-driven"
          - "every ExamSession of this proctor with session_status == SCHEDULED and proctoring_status == ASSIGNED moves proctoring_status ASSIGNED -> PENDING_REPROCTOR"
          - "each such session release decrements Proctor.reserved_minutes by that session's allowed_minutes"
      - from: REGISTERED
        to: SUSPENDED
        trigger: "system: SecurityIncident SUBSTANTIATED pushes the recomputed LIFETIME_CUMULATIVE risk_score >= PROCTOR_RISK_SUSPEND_THRESHOLD (10.00)"
        actor: system
        preconditions: ["Proctor.registration_status == REGISTERED"]
        side_effects:
          - "suspended_reason = RISK_THRESHOLD_BREACH"
          - "risk_variant_applied = LIFETIME_CUMULATIVE"
          - "every ExamSession of this proctor with session_status == SCHEDULED and proctoring_status == ASSIGNED moves ASSIGNED -> PENDING_REPROCTOR, decrementing Proctor.reserved_minutes accordingly"
      - from: SUSPENDED
        to: REGISTERED
        trigger: "POST /proctors/{id}/reinstatement"
        actor: PlatformAdmin
        preconditions: ["Proctor.registration_status == SUSPENDED"]
        side_effects:
          - "suspended_reason = null"
          - "sessions already moved to PENDING_REPROCTOR are NOT auto-reassigned"
        note: "cycle SUSPENDED -> REGISTERED"
      - from: UNDER_AUDIT
        to: REVOKED
        trigger: "POST /proctors/{id}/audit-close with outcome REVOKE"
        actor: PlatformAdmin
        preconditions: ["Proctor.registration_status == UNDER_AUDIT"]
        side_effects:
          - "same PENDING_REPROCTOR cascade as SUSPENDED"
          - "terminal"

  - entity: AccessCode
    initial_state: AVAILABLE
    terminal_states: [CONSUMED, VOIDED, EXPIRED]
    transitions:
      - from: AVAILABLE
        to: ASSIGNED
        trigger: "POST /access-code-batches/{id}/assignments"
        actor: ProviderAdmin
        preconditions:
          - "AccessCodeBatch.status == ACTIVE"
          - "AccessCodeBatch.available_count >= 1"
          - "logical_clock <= AccessCodeBatch.expires_at"
          - "Candidate.security_hold == false"
          - "Candidate.training_provider_id == AccessCodeBatch.training_provider_id"
        side_effects:
          - "candidate_id set, assigned_at = logical_clock"
          - "AccessCodeBatch.available_count -= 1, assigned_count += 1, version += 1"
          - "that counter change flips AccessCodeBatch ACTIVE -> DEPLETED when available_count becomes 0"
      - from: ASSIGNED
        to: AVAILABLE
        trigger: "POST /exam-sessions/{id}/cancellation"
        actor: ProviderAdmin
        preconditions:
          - "the cancelled ExamSession.access_code_id == AccessCode.id"
        side_effects:
          - "candidate_id = null, assigned_at = null, assignment_release_count += 1"
          - "AccessCodeBatch.available_count += 1, assigned_count -= 1"
      - from: ASSIGNED
        to: CONSUMED
        trigger: "POST /exam-sessions/{id}/submission"
        actor: Proctor
        preconditions:
          - "AccessCode.status == ASSIGNED"
        side_effects:
          - "consumed_at = logical_clock"
          - "AccessCodeBatch.assigned_count -= 1, consumed_count += 1"
      - from: AVAILABLE
        to: VOIDED
        trigger: "POST /access-code-batches/{id}/void"
        actor: ProviderAdmin
        preconditions:
          - "AccessCodeBatch.status == ACTIVE"
        side_effects:
          - "AccessCodeBatch.available_count -= 1, voided_count += 1 for each voided code"
      - from: AVAILABLE
        to: EXPIRED
        trigger: "POST /compliance-runs (logical_clock > AccessCodeBatch.expires_at)"
        actor: PlatformAdmin
        preconditions:
          - "AccessCodeBatch.status IN {ACTIVE, DEPLETED}"
        side_effects:
          - "AccessCodeBatch.available_count -= 1, voided_count += 1"
      - from: ASSIGNED
        to: EXPIRED
        trigger: "POST /compliance-runs (logical_clock > AccessCodeBatch.expires_at)"
        actor: PlatformAdmin
        preconditions:
          - "no ExamSession with session_status IN {CHECKED_IN, IN_PROGRESS} holds this code"
        side_effects:
          - "AccessCodeBatch.assigned_count -= 1, voided_count += 1"
          - "every ExamSession with session_status == SCHEDULED holding this code moves to CANCELLED without returning the code"

  - entity: AccessCodeBatch
    initial_state: ACTIVE
    terminal_states: [VOIDED, EXPIRED]
    transitions:
      - from: ACTIVE
        to: DEPLETED
        trigger: "system: available_count reaches 0 after an assignment or a void"
        actor: system
        preconditions: ["available_count == 0"]
        side_effects: ["further assignment attempts fail with ERR_BATCH_DEPLETED"]
      - from: DEPLETED
        to: ACTIVE
        trigger: "system: available_count becomes > 0 after an AccessCode ASSIGNED -> AVAILABLE release"
        actor: system
        preconditions: ["available_count >= 1"]
        side_effects: ["batch is assignable again"]
        note: "cycle ACTIVE -> DEPLETED -> ACTIVE, third hop of the cancellation cascade"
      - from: ACTIVE
        to: VOIDED
        trigger: "POST /access-code-batches/{id}/void"
        actor: ProviderAdmin
        preconditions:
          - "expected_batch_version == AccessCodeBatch.version"
          - "AccessCodeBatch.available_count >= 1"
        side_effects:
          - "every AVAILABLE child code -> VOIDED"
          - "void_gross_credit_cents, void_restock_fee_cents, void_net_credit_cents computed per calculations.batch_void_refund"
          - "TrainingProvider.lifetime_credited_cents += void_net_credit_cents, credit_balance_cents recomputed"
          - "increments AccessCodeBatch.version by 1"
      - from: ACTIVE
        to: EXPIRED
        trigger: "POST /compliance-runs (logical_clock > expires_at)"
        actor: PlatformAdmin
        preconditions: ["logical_clock > AccessCodeBatch.expires_at"]
        side_effects: ["all AVAILABLE and ASSIGNED child codes -> EXPIRED", "no refund is posted"]
      - from: DEPLETED
        to: EXPIRED
        trigger: "POST /compliance-runs (logical_clock > expires_at)"
        actor: PlatformAdmin
        preconditions: ["logical_clock > AccessCodeBatch.expires_at"]
        side_effects: ["all ASSIGNED child codes -> EXPIRED"]

  - entity: AccommodationRequest
    initial_state: REQUESTED
    terminal_states: [APPROVED, DENIED]
    transitions:
      - from: REQUESTED
        to: UNDER_REVIEW
        trigger: "POST /accommodation-requests/{id}/review-open"
        actor: PlatformAdmin
        preconditions: ["AccommodationRequest.status == REQUESTED"]
        side_effects: ["reviewed_by_user_id = X-User-ID"]
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /accommodation-requests/{id}/review with decision APPROVE"
        actor: PlatformAdmin
        preconditions:
          - "no other AccommodationRequest for this candidate_id has status == APPROVED"
          - "approved_multiplier, when supplied, is <= requested_multiplier and >= 1.0"
          - "for every ExamSession with accommodation_request_id == this id and session_status == SCHEDULED, the interval recomputed with the new multiplier still passes calculations.proctor_interval_conflict and calculations.site_seat_occupancy"
        side_effects:
          - "approved_multiplier = supplied value or requested_multiplier when omitted"
          - "every ExamSession with accommodation_request_id == this id and session_status == SCHEDULED has allowed_minutes and scheduled_end_at recomputed per calculations.session_allowed_minutes"
          - "each such recompute adjusts TestingSite.reserved_seat_minutes and Proctor.reserved_minutes by the minute delta"
        note: "branch A of the fork; divergent side-effect set from DENIED"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /accommodation-requests/{id}/review with decision DENY"
        actor: PlatformAdmin
        preconditions: ["AccommodationRequest.status == UNDER_REVIEW"]
        side_effects:
          - "approved_multiplier stays null"
          - "no ExamSession is recomputed and no reserved-minute field changes"
        note: "branch B of the fork; both branches are terminal"

  - entity: ScoreReport
    initial_state: PROVISIONAL
    terminal_states: [VOIDED]
    transitions:
      - from: PROVISIONAL
        to: FINAL
        trigger: "POST /score-reports/{id}/finalization"
        actor: PlatformAdmin
        preconditions:
          - "ExamSession.session_status == SUBMITTED"
          - "ExamSession.proctoring_status IN {ATTESTED, CLEARED}"
        side_effects:
          - "final_scaled_score and pass_flag computed per calculations.scaled_score variant FINAL_EQUATED"
          - "released_at = logical_clock, finalized_by_user_id = X-User-ID"
          - "ExamSession -> CLOSED"
      - from: PROVISIONAL
        to: VOIDED
        trigger: "system: owning ExamSession -> INVALIDATED"
        actor: system
        preconditions: ["ExamSession.session_status == INVALIDATED"]
        side_effects:
          - "pass_flag = false"
      - from: FINAL
        to: VOIDED
        trigger: "system: owning ExamSession -> INVALIDATED"
        actor: system
        preconditions: ["ExamSession.session_status == INVALIDATED"]
        side_effects:
          - "pass_flag = false; provisional_scaled_score and final_scaled_score are retained for audit"
          - "that voiding revokes any Certificate whose score_report_id == this report (see Certificate machine)"

  - entity: Certificate
    initial_state: ISSUED
    terminal_states: [REVOKED, SUPERSEDED]
    transitions:
      - from: ISSUED
        to: EXPIRED
        trigger: "POST /compliance-runs (logical_clock >= expires_at)"
        actor: PlatformAdmin
        preconditions: ["Certificate.status == ISSUED", "logical_clock >= Certificate.expires_at"]
        side_effects:
          - "Candidate.compliance_status -> LAPSED"
          - "LocalRegistration rows for this certificate with status IN {FILED, POSTED, VERIFIED, DELINQUENT} -> WITHDRAWN"
      - from: ISSUED
        to: REVOKED
        trigger: "system: ScoreReport -> VOIDED"
        actor: system
        preconditions: ["ScoreReport.status == VOIDED"]
        side_effects:
          - "revocation_reason = SCORE_VOIDED"
          - "TrainingProvider.lifetime_credited_cents += issuance_fee_cents, credit_balance_cents recomputed"
          - "that revocation moves LocalRegistration rows with status IN {FILED, POSTED, VERIFIED, DELINQUENT} -> WITHDRAWN and sets Candidate.compliance_status -> NON_COMPLIANT"
      - from: ISSUED
        to: SUPERSEDED
        trigger: "system: POST /certificates issues a recertification certificate for the same candidate_id and jurisdiction_id"
        actor: system
        preconditions: ["the prior Certificate.recert_authorized_at != null"]
        side_effects:
          - "superseded_by_certificate_id = new certificate id"
      - from: EXPIRED
        to: SUPERSEDED
        trigger: "system: POST /certificates issues a recertification certificate for the same candidate_id and jurisdiction_id"
        actor: system
        preconditions: ["the prior Certificate.recert_authorized_at != null"]
        side_effects:
          - "superseded_by_certificate_id = new certificate id"
          - "Candidate.compliance_status LAPSED -> CERTIFIED"

  - entity: LocalRegistration
    initial_state: FILED
    terminal_states: [WITHDRAWN]
    transitions:
      - from: FILED
        to: POSTED
        trigger: "POST /local-registrations/{id}/posting-confirmation"
        actor: ProviderAdmin
        preconditions:
          - "Certificate.status == ISSUED"
          - "LocalRegistration.status IN {FILED, DELINQUENT}"
        side_effects: ["posted_at = logical_clock, posting_location set"]
      - from: FILED
        to: DELINQUENT
        trigger: "POST /compliance-runs (logical_clock > posting_deadline_at)"
        actor: PlatformAdmin
        preconditions: ["LocalRegistration.status == FILED", "posted_at == null"]
        side_effects: ["no fee is assessed; the registration stays actionable"]
      - from: DELINQUENT
        to: POSTED
        trigger: "POST /local-registrations/{id}/posting-confirmation"
        actor: ProviderAdmin
        preconditions: ["Certificate.status == ISSUED"]
        side_effects: ["posted_at = logical_clock"]
        note: "cycle FILED -> DELINQUENT -> POSTED"
      - from: POSTED
        to: VERIFIED
        trigger: "POST /local-registrations/{id}/verification with decision VERIFY"
        actor: HealthOfficer
        preconditions:
          - "X-User-ID == LocalRegistration.jurisdiction_id"
          - "Certificate.status == ISSUED"
        side_effects: ["verified_by_user_id = X-User-ID"]
      - from: POSTED
        to: REJECTED
        trigger: "POST /local-registrations/{id}/verification with decision REJECT"
        actor: HealthOfficer
        preconditions:
          - "X-User-ID == LocalRegistration.jurisdiction_id"
        side_effects: ["rejection_reason set, posted_at = null, posting_location = null"]
      - from: REJECTED
        to: FILED
        trigger: "POST /local-registrations/{id}/refiling"
        actor: ProviderAdmin
        preconditions: ["LocalRegistration.status == REJECTED", "Certificate.status == ISSUED"]
        side_effects:
          - "filed_at = logical_clock, posting_deadline_at recomputed, refile_count += 1, rejection_reason = null"
        note: "cycle POSTED -> REJECTED -> FILED"
      - from: POSTED
        to: WITHDRAWN
        trigger: "system: owning Certificate -> REVOKED or EXPIRED"
        actor: system
        preconditions: ["Certificate.status IN {REVOKED, EXPIRED}"]
        side_effects: ["terminal; the establishment must file against a new certificate"]
      - from: VERIFIED
        to: WITHDRAWN
        trigger: "system: owning Certificate -> REVOKED or EXPIRED"
        actor: system
        preconditions: ["Certificate.status IN {REVOKED, EXPIRED}"]
        side_effects: ["terminal"]
      - from: FILED
        to: WITHDRAWN
        trigger: "system: owning Certificate -> REVOKED or EXPIRED"
        actor: system
        preconditions: ["Certificate.status IN {REVOKED, EXPIRED}"]
        side_effects: ["terminal"]
      - from: DELINQUENT
        to: WITHDRAWN
        trigger: "system: owning Certificate -> REVOKED or EXPIRED"
        actor: system
        preconditions: ["Certificate.status IN {REVOKED, EXPIRED}"]
        side_effects: ["terminal"]
  - entity: SecurityIncident
    dimension: status
    initial_state: OPEN
    terminal_states: [SUBSTANTIATED, DISMISSED]
    transitions:
      - from: OPEN
        to: UNDER_REVIEW
        trigger: "POST /security-incidents/{id}/review-open"
        actor: PlatformAdmin
        preconditions:
          - "SecurityIncident.status == OPEN"
          - "the sitting's ExamSession.proctoring_status IN {ATTESTED, CLEARED} (guarded cross-entity precondition)"
        side_effects:
          - "the sitting's ExamSession.proctoring_status -> INCIDENT_UNDER_REVIEW; session_status is untouched"
      - from: UNDER_REVIEW
        to: SUBSTANTIATED
        trigger: "POST /security-incidents/{id}/resolution with outcome SUBSTANTIATE"
        actor: PlatformAdmin
        preconditions:
          - "SecurityIncident.status == UNDER_REVIEW"
          - "X-User-ID != ScoreReport.finalized_by_user_id for this session's ScoreReport"
        side_effects:
          - "resolved_by_user_id = X-User-ID, resolution_note = the supplied note"
          - "opens the depth-4 cascade spelled out on the ExamSession proctoring_status transition INCIDENT_UNDER_REVIEW -> COMPROMISED: sitting -> INVALIDATED, ScoreReport -> VOIDED, Certificate -> REVOKED with the issuance fee credited back, LocalRegistration -> WITHDRAWN"
          - "Proctor.substantiated_incident_weight_total += severity_weight and risk_score recomputed with variant LIFETIME_CUMULATIVE"
      - from: UNDER_REVIEW
        to: DISMISSED
        trigger: "POST /security-incidents/{id}/resolution with outcome DISMISS"
        actor: PlatformAdmin
        preconditions:
          - "SecurityIncident.status == UNDER_REVIEW"
          - "X-User-ID != ScoreReport.finalized_by_user_id for this session's ScoreReport"
        side_effects:
          - "resolved_by_user_id = X-User-ID, resolution_note = the supplied note"
          - "the sitting's ExamSession.proctoring_status -> CLEARED; no ScoreReport, Certificate, LocalRegistration or ledger field changes"
          - "severity_weight is NOT added to the proctor's weight total and risk_score is not recomputed"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on the parent's `version` only)
# =============================================================================
concurrency_rules:
  - rule_id: code-assignment-stale-batch
    parent_entity: AccessCodeBatch
    write_endpoint: "POST /access-code-batches/{id}/assignments"
    occ_field: "expected_batch_version"
    description: |
      Assigning a code out of a batch whose version has advanced since the
      client last read it is rejected. A second assignment against the same
      batch is legitimate product behaviour while codes remain, so the write
      cannot be filtered by any state precondition; the client's stale view of
      available_count is caught by the version check instead.
    error_id: ERR_STALE_BATCH_VERSION
    http_status: 412

  - rule_id: session-reschedule-stale-session
    parent_entity: ExamSession
    write_endpoint: "POST /exam-sessions/{id}/reschedule"
    occ_field: "expected_session_version"
    description: |
      Rescheduling a session whose version has advanced since the client last
      read it is rejected. A session may legitimately be rescheduled again from
      SCHEDULED, and the newer reschedule supersedes the earlier one, so the
      write survives every state precondition; only the version check separates
      a client acting on a superseded interval from one acting on the current
      interval.
    error_id: ERR_STALE_SESSION_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: batch_purchase_price
    trigger: "POST /access-code-batches — before the provider ledger is debited"
    algorithm: tiered_pricing
    formula: |
      # Rounding order is PINNED: round each line (subtotal, then surcharge)
      # to whole cents, THEN sum the lines. Summing first and rounding the
      # surcharge once is a DIFFERENT, WRONG answer and differs by cents.
      total = 0
      for line in line_items (iterated in the order supplied in the request body):
          base = BUNDLE_BASE_CENTS[line.bundle_type]
          d    = 0.15 if line.quantity >= 100
                 else 0.10 if line.quantity >= 50
                 else 0.05 if line.quantity >= 20
                 else 0.00
          line_subtotal_cents  = round_half_up(base * line.quantity * (1 - d))
          line_surcharge_cents = round_half_up(line_subtotal_cents *
                                   Jurisdiction(provider.jurisdiction_id).exam_fee_surcharge_pct)
          total += line_subtotal_cents + line_surcharge_cents   # per-line rounding, then sum
      AccessCodeBatch.total_price_cents = total
      AccessCodeBatch.quantity_purchased = sum(line.quantity for line in line_items)
      # ledger debit (rejected when it would make the balance negative)
      require TrainingProvider.credit_balance_cents >= total   # >= , not >
      TrainingProvider.lifetime_charged_cents += total
    input_set: "every line in line_items of this request; the surcharge pct comes from the Jurisdiction referenced by the purchasing TrainingProvider.jurisdiction_id (NOT from the exam form's or candidate's jurisdiction)"
    constants:
      BUNDLE_BASE_CENTS: { EXAM_ONLY: 3600, COURSE_PLUS_EXAM: 8900 }
      VOLUME_DISCOUNT_TIERS: "quantity >= 100 -> 0.15; >= 50 -> 0.10; >= 20 -> 0.05; else 0.00"
    precision: "whole cents, round_half_up, applied per line (subtotal and surcharge separately) before summation"

  - name: batch_void_refund
    trigger: "POST /access-code-batches/{id}/void"
    algorithm: waterfall_allocation
    formula: |
      # The restock tier LOOKS circular (a naive reading keys the tier off the
      # net credit, which itself depends on the fee). Evaluation order is
      # PINNED as steps 1-5 below; the tier is keyed off the GROSS credit.
      # 1. refundable_units = AccessCodeBatch.available_count (codes still AVAILABLE at void time)
      # 2. gross = round_half_up(total_price_cents * refundable_units / quantity_purchased)
      # 3. pct   = 0.05 if gross >= 50000 else 0.10 if gross >= 10000 else 0.15   # keyed on GROSS
      # 4. fee   = round_half_up(gross * pct);  net = gross - fee
      # 5. waterfall of `net` over ordered buckets:
      #      bucket 1 = TrainingProvider negative balance repair: applied = min(net, max(0, -credit_balance_cents))
      #      bucket 2 = remainder -> provider credit
      #    Both buckets post to the same ledger field, so the observable effect is
      #    lifetime_credited_cents += net (bucket order is what the audit trail records).
      AccessCodeBatch.void_gross_credit_cents  = gross
      AccessCodeBatch.void_restock_fee_cents   = fee
      AccessCodeBatch.void_net_credit_cents    = net
      TrainingProvider.lifetime_credited_cents += net
    input_set: "only child AccessCodes with status == AVAILABLE at the instant of the void; ASSIGNED, CONSUMED, VOIDED and EXPIRED codes are excluded from refundable_units and are left in their current status"
    constants:
      RESTOCK_FEE_TIERS: "gross >= 50000 -> 0.05; gross >= 10000 -> 0.10; else 0.15"
    precision: "whole cents, round_half_up at step 2 and step 4; the retained fee is NOT refunded and is deliberately absent from the provider ledger"

  - name: session_allowed_minutes
    trigger: "POST /exam-sessions, POST /exam-sessions/{id}/reschedule, and the APPROVED branch of POST /accommodation-requests/{id}/review"
    algorithm: constraint_propagation
    formula: |
      multiplier = AccommodationRequest.approved_multiplier
                   when ExamSession.accommodation_request_id != null
                   AND that request's status == APPROVED
                   else 1.0
      translation_extra = ExamForm.translated_extra_minutes if ExamForm.language != 'EN' else 0
      delivery_extra    = REMOTE_SETUP_MINUTES if ExamSession.delivery_mode == 'REMOTE' else 0
      uncapped = round_half_up(ExamForm.base_minutes * multiplier) + translation_extra + delivery_extra
      allowed_minutes   = min(MAX_SESSION_MINUTES, uncapped)
      scheduled_end_at  = scheduled_start_at + allowed_minutes minutes
    input_set: "exactly one ExamSession; the multiplier is 1.0 whenever the referenced AccommodationRequest is still REQUESTED or UNDER_REVIEW, which is why approval later re-runs this calculation for every SCHEDULED session pointing at it"
    constants:
      MAX_SESSION_MINUTES: 240
      REMOTE_SETUP_MINUTES: 10
    precision: "whole minutes; round_half_up is applied to base_minutes * multiplier BEFORE the two additive allowances, and the cap is applied last"

  - name: scaled_score
    trigger: "POST /exam-sessions/{id}/submission (PROVISIONAL) and POST /score-reports/{id}/finalization (FINAL_EQUATED)"
    algorithm: weighted_scoring
    formula: |
      # pretest_correct_count NEVER enters either numerator or denominator.
      provisional_scaled_score = round_half_up(100 * raw_correct_count / ExamForm.scored_item_count)
      final_scaled_score       = round_half_up(100 * (raw_correct_count - voided_correct_count)
                                                   / (ExamForm.scored_item_count - voided_item_count))
      pass_flag                = final_scaled_score >= ScoreReport.effective_cut_score     # >= , not >
    input_set: "one ExamSession's submission counts; scored items only. voided_item_count / voided_correct_count are the psychometric key-out counts supplied at finalization and default to 0, so an unvoided finalization reproduces the provisional value exactly."
    constants: {}
    precision: "integer scaled score, round_half_up on the percentage; no intermediate rounding of the ratio"
    variants:
      - name: PROVISIONAL
        when: "computed at submission, before any psychometric key review; stored in provisional_scaled_score and never overwritten"
        difference: "denominator is the full scored_item_count and the numerator is the full raw_correct_count; keyed-out items are still counted against the candidate"
      - name: FINAL_EQUATED
        when: "computed at finalization; stored in final_scaled_score and the only variant that decides pass_flag"
        difference: "removes keyed-out items from BOTH numerator and denominator, so dropping items the candidate missed raises the score above the provisional value and can flip a provisional fail into a final pass"

  - name: effective_cut_score
    trigger: "POST /exam-sessions/{id}/submission — frozen onto the ScoreReport at creation"
    algorithm: threshold
    formula: |
      override = Jurisdiction(Candidate.jurisdiction_id).min_passing_score_override
      effective_cut_score = ExamForm.national_cut_score if override is null
                            else max(ExamForm.national_cut_score, override)
    input_set: "the candidate's own Jurisdiction (not the testing site's jurisdiction) and the delivered ExamForm; frozen at submission so a later jurisdiction edit cannot retroactively change a released score"
    constants: {}
    precision: "integer 0..100"

  - name: proctor_audit_risk_score
    trigger: "POST /proctors/{id}/audit-open (ROLLING_WINDOW), POST /proctors/{id}/audit-close and the SUBSTANTIATED branch of POST /security-incidents/{id}/resolution (LIFETIME_CUMULATIVE)"
    algorithm: weighted_scoring
    formula: |
      SEVERITY_WEIGHT = { MINOR: 1, MAJOR: 3, CRITICAL: 5 }
      # candidate session set S = this proctor's ExamSessions whose session_status
      # IN {SUBMITTED, CLOSED, INVALIDATED}, sorted by scheduled_start_at DESC,
      # tie-break created_at DESC (never by id).
      # ROLLING_WINDOW: W = first PROCTOR_RISK_WINDOW_SESSIONS entries of S
      #   window_weight = sum(SEVERITY_WEIGHT[i.severity] for SUBSTANTIATED incidents i
      #                       whose exam_session_id IN W)
      #   risk_score = round_half_up(10 * window_weight / PROCTOR_RISK_WINDOW_SESSIONS, 2)
      # LIFETIME_CUMULATIVE:
      #   risk_score = 0.00 when |S| == 0
      #   else round_half_up(10 * substantiated_incident_weight_total / |S|, 2)
      # Suspension gate (both variants share it):
      #   risk_score >= PROCTOR_RISK_SUSPEND_THRESHOLD -> Proctor -> SUSPENDED
      Proctor.risk_score = <value of the variant named by the trigger>
      Proctor.risk_variant_applied = <ROLLING_WINDOW | LIFETIME_CUMULATIVE>
    input_set: "only SUBSTANTIATED SecurityIncidents count; OPEN, UNDER_REVIEW and DISMISSED incidents contribute 0. Sessions in SCHEDULED, CHECKED_IN, IN_PROGRESS or CANCELLED are excluded from S entirely."
    constants:
      PROCTOR_RISK_WINDOW_SESSIONS: 2
      PROCTOR_RISK_SUSPEND_THRESHOLD: 10.00
      SEVERITY_WEIGHT: { MINOR: 1, MAJOR: 3, CRITICAL: 5 }
    precision: "2 decimal places, round_half_up"
    variants:
      - name: ROLLING_WINDOW
        when: "audit opened by an operator — the audit looks only at the proctor's most recent PROCTOR_RISK_WINDOW_SESSIONS sittings"
        difference: "denominator is the fixed window size (2) and the numerator only counts incidents inside the window, so an old CRITICAL incident falls out of scope entirely"
      - name: LIFETIME_CUMULATIVE
        when: "audit closed, or an incident is SUBSTANTIATED — the registration decision looks at the whole career"
        difference: "denominator is the proctor's total terminal session count and the numerator is the lifetime weight total, so old incidents keep pushing the score up and can breach the suspension threshold that the rolling variant never reaches"

  - name: proctor_interval_conflict
    trigger: "POST /exam-sessions, POST /exam-sessions/{id}/proctor-assignment, POST /exam-sessions/{id}/reschedule, and the APPROVED branch of POST /accommodation-requests/{id}/review"
    algorithm: interval_merge
    formula: |
      # EXCLUSIVE occupancy with a mandatory turnaround gap on BOTH sides.
      # Candidate set C = the target proctor's other ExamSessions with
      #   session_status IN {SCHEDULED, CHECKED_IN, IN_PROGRESS}
      #   AND proctoring_status == ASSIGNED
      #   (the session being written is excluded from C)
      # conflict iff for some e in C:
      #     new.scheduled_start_at < e.scheduled_end_at + PROCTOR_BUFFER_MINUTES
      #     AND e.scheduled_start_at < new.scheduled_end_at + PROCTOR_BUFFER_MINUTES
      # i.e. neighbouring sittings need a gap of >= PROCTOR_BUFFER_MINUTES; a gap
      # of exactly PROCTOR_BUFFER_MINUTES is allowed (strict <), a gap one minute
      # shorter is rejected with ERR_PROCTOR_INTERVAL_CONFLICT.
    input_set: "one Proctor's non-terminal ASSIGNED sessions; PENDING_REPROCTOR, CANCELLED, SUBMITTED, CLOSED and INVALIDATED sessions never occupy the proctor"
    constants:
      PROCTOR_BUFFER_MINUTES: 15
    precision: "whole minutes; comparisons are strict `<` on both sides so the buffer is a minimum gap, not an overlap allowance"

  - name: site_seat_occupancy
    trigger: "POST /exam-sessions, POST /exam-sessions/{id}/reschedule, and the APPROVED branch of POST /accommodation-requests/{id}/review"
    algorithm: interval_merge
    formula: |
      # AGGREGATE capacity over HALF-OPEN intervals [start, end) with NO buffer.
      # Candidate set C = other ExamSessions with the same testing_site_id and
      #   session_status IN {SCHEDULED, CHECKED_IN, IN_PROGRESS}
      # overlapping = count of e in C where
      #     new.scheduled_start_at < e.scheduled_end_at
      #     AND e.scheduled_start_at < new.scheduled_end_at
      # reject with ERR_SITE_SEAT_CAPACITY_EXCEEDED iff overlapping >= TestingSite.seat_count
      # Adjacency is free: a session starting exactly when another ends does not
      # overlap it, because the interval is half-open.
      TestingSite.reserved_seat_minutes = sum(allowed_minutes of C plus the accepted session)
    input_set: "sessions at the same TestingSite only; REMOTE sessions have testing_site_id == null and never consume seats"
    constants: {}
    precision: "instant comparison at minute granularity; `>=` on the capacity comparison means the seat_count-th concurrent session is the one rejected"

  - name: certificate_validity_window
    trigger: "POST /certificates"
    algorithm: projection
    formula: |
      issued_at              = logical_clock
      expires_at             = issued_at + Jurisdiction.recert_cycle_months calendar months
                               (same day-of-month; month arithmetic, not 30-day steps)
      recert_window_opens_at = expires_at - RECERT_WINDOW_DAYS days
      issuance_fee_cents     = CERT_ISSUANCE_FEE_CENTS
      TrainingProvider(Candidate.training_provider_id).lifetime_charged_cents += CERT_ISSUANCE_FEE_CENTS
    input_set: "the candidate's Jurisdiction supplies recert_cycle_months; the fee is charged to the candidate's TrainingProvider ledger"
    constants:
      RECERT_WINDOW_DAYS: 180
      CERT_ISSUANCE_FEE_CENTS: 1500
    precision: "instants stored as ISO 8601 UTC with three fractional digits"

  - name: recert_reminder_selection
    trigger: "POST /compliance-runs"
    algorithm: chronological
    formula: |
      # Ops-run checkpoint. Phase order inside one run is PINNED:
      #   phase 1: expire AccessCodeBatches (logical_clock > expires_at)
      #   phase 2: expire Certificates (logical_clock >= expires_at) and cascade
      #            LocalRegistration -> WITHDRAWN, Candidate -> LAPSED
      #   phase 3: mark LocalRegistrations DELINQUENT (status == FILED,
      #            posted_at == null, logical_clock > posting_deadline_at)
      #   phase 4: dispatch at most ONE recertification reminder per Certificate
      # Phase 4 eligibility filter:
      #   Certificate.status IN {ISSUED, EXPIRED}
      #   AND Certificate.recert_authorized_at == null
      #   AND Certificate.superseded_by_certificate_id == null
      #   AND the due tier is not already in reminder_tiers_sent
      # Due tier (ranked most-overdue first, exactly one is dispatched):
      #   T_LAPSED if logical_clock >= expires_at
      #   else T_30   if logical_clock >= expires_at - 30 days
      #   else T_90   if logical_clock >= expires_at - 90 days
      #   else T_180  if logical_clock >= recert_window_opens_at   (expires_at - 180 days)
      #   else none   -> certificate is skipped
      # Dispatch order across certificates: expires_at ASC, tie-break created_at ASC
      #   (never by id or certificate_number).
      # Effect: append the tier to Certificate.reminder_tiers_sent.
      # Empty candidate set is NOT an error: the run returns
      #   reminder_notices_sent_count == 0 and notified_certificate_ids == [].
    input_set: "every Certificate in the system at run time, filtered as above; a certificate whose due tier was already dispatched in an earlier run is skipped rather than re-notified, so tiers are appended at most once each"
    constants:
      RECERT_REMINDER_TIER_DAYS: { T_180: 180, T_90: 90, T_30: 30, T_LAPSED: 0 }
    precision: "instant comparisons are inclusive (`>=`) at every tier boundary, so a clock sitting exactly on recert_window_opens_at dispatches T_180"

  - name: provider_ledger_balance
    trigger: "every write that debits or credits a TrainingProvider (batch purchase, batch void, certificate issuance, certificate revocation, credit adjustment)"
    algorithm: aggregation
    formula: |
      credit_balance_cents = lifetime_credited_cents - lifetime_charged_cents
      # Conserved-quantity invariant (must hold after EVERY request):
      #   credit_balance_cents == lifetime_credited_cents - lifetime_charged_cents
      # Compensating-pair invariant: certificate issuance debits
      # CERT_ISSUANCE_FEE_CENTS and revocation credits exactly the same amount,
      # so credit_balance_cents returns to its pre-issuance value with zero drift
      # while both lifetime counters grow by CERT_ISSUANCE_FEE_CENTS.
    input_set: "all ledger postings for one TrainingProvider; no other entity may write these three fields"
    constants:
      CERT_ISSUANCE_FEE_CENTS: 1500
    precision: "whole cents; balances may be negative only through a batch-void bucket-1 repair, never through a debit (debits are pre-checked with >=)"

  - name: access_code_inventory_conservation
    trigger: "every AccessCode status transition and every AccessCodeBatch counter update"
    algorithm: aggregation
    formula: |
      # Conserved-quantity invariant (must hold after EVERY request):
      #   available_count + assigned_count + consumed_count + voided_count
      #     == quantity_purchased
      # voided_count counts BOTH VOIDED and EXPIRED codes.
      # Compensating-pair invariant: assignment (AVAILABLE -> ASSIGNED) followed
      # by session cancellation (ASSIGNED -> AVAILABLE) restores available_count
      # and assigned_count to their pre-assignment values, with
      # assignment_release_count as the only residue.
    input_set: "all child AccessCodes of one AccessCodeBatch, partitioned by status with no code counted twice"
    constants: {}
    precision: "exact integer counts; recomputed synchronously in the same request as the code status change"

# =============================================================================
# §1.4 Validation Rules Table (evaluated strictly in ascending priority order;
#      the FIRST violated row decides the response)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present, and X-User-Role is one of the roles declared in §1.7"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "the acting role appears in the endpoint's roles list in §1.5"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all
  - priority: 3
    category: auth
    check: "for entity_backed roles, X-User-ID owns the target: ProviderAdmin acts only where training_provider_id == X-User-ID (directly or through the resource's Candidate/Proctor/Batch), Candidate only on rows whose candidate_id == X-User-ID (or whose Certificate/LocalRegistration chain resolves to it), Proctor only on ExamSessions with proctor_id == X-User-ID and SecurityIncidents with reported_by_proctor_id == X-User-ID, HealthOfficer only on rows whose jurisdiction_id == X-User-ID"
    error_id: ERR_FORBIDDEN_RESOURCE_SCOPE
    http_status: 403
    applies_to: "all endpoints whose roles include ProviderAdmin, Candidate, Proctor or HealthOfficer"
  - priority: 4
    category: existence
    check: "request body parses, every required input field is present, every enum value is a declared member, numeric fields are in range, datetimes are ISO 8601 UTC, id_document_expires_on is YYYY-MM-DD, line_items entries have unique bundle_type"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all
  - priority: 5
    category: existence
    check: "limit in [1,100] and offset >= 0 on list endpoints"
    error_id: ERR_INVALID_PAGINATION
    http_status: 400
    applies_to: "all GET list endpoints"
  - priority: 6
    category: existence
    check: "path ids resolve, validated left to right"
    error_id: "ERR_<ENTITY>_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path parameters"
  - priority: 7
    category: existence
    check: "body foreign keys resolve, validated in the order the fields appear in the endpoint's input list in §1.5"
    error_id: "ERR_<ENTITY>_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with FK fields in the body"
  - priority: 8
    category: state
    check: "expected_batch_version == AccessCodeBatch.version / expected_session_version == ExamSession.version"
    error_id: "ERR_STALE_BATCH_VERSION | ERR_STALE_SESSION_VERSION"
    http_status: 412
    applies_to: "POST /access-code-batches/{id}/assignments, POST /access-code-batches/{id}/void, POST /exam-sessions/{id}/reschedule"
  - priority: 9
    category: state
    check: "ExamSession.session_status permits the requested transition per §1.2"
    error_id: ERR_SESSION_STATE_INVALID
    http_status: 409
    applies_to: "POST /exam-sessions/{id}/* endpoints, and POST /security-incidents (the reported sitting must be SUBMITTED or CLOSED)"
  - priority: 10
    category: state
    check: "AccessCode.status == AVAILABLE for assignment, == ASSIGNED for session creation and submission, and course completion is only allowed while status IN {AVAILABLE, ASSIGNED}"
    error_id: ERR_ACCESS_CODE_STATE_INVALID
    http_status: 409
    applies_to: "POST /exam-sessions, POST /exam-sessions/{id}/submission, POST /access-codes/{id}/course-completion"
  - priority: 11
    category: state
    check: "AccessCodeBatch.status == ACTIVE for assignment and void"
    error_id: ERR_BATCH_STATE_INVALID
    http_status: 409
    applies_to: "POST /access-code-batches/{id}/assignments, POST /access-code-batches/{id}/void"
  - priority: 12
    category: state
    check: "Proctor.registration_status permits the requested registration/audit transition per §1.2"
    error_id: ERR_PROCTOR_STATE_INVALID
    http_status: 409
    applies_to: "POST /proctors/{id}/registration-decision, /audit-open, /audit-close, /reinstatement"
  - priority: 13
    category: state
    check: "AccommodationRequest.status == REQUESTED for review-open and == UNDER_REVIEW for review"
    error_id: ERR_ACCOMMODATION_STATE_INVALID
    http_status: 409
    applies_to: "POST /accommodation-requests/{id}/review-open, POST /accommodation-requests/{id}/review"
  - priority: 14
    category: state
    check: "ScoreReport.status == PROVISIONAL at finalization"
    error_id: ERR_SCORE_REPORT_STATE_INVALID
    http_status: 409
    applies_to: "POST /score-reports/{id}/finalization, POST /certificates"
  - priority: 15
    category: state
    check: "SecurityIncident.status == OPEN for review-open and == UNDER_REVIEW for resolution"
    error_id: ERR_INCIDENT_STATE_INVALID
    http_status: 409
    applies_to: "POST /security-incidents/{id}/review-open, POST /security-incidents/{id}/resolution"
  - priority: 16
    category: state
    check: "Certificate.status IN {ISSUED, EXPIRED} for recert authorization and == ISSUED for local registration filing"
    error_id: ERR_CERTIFICATE_STATE_INVALID
    http_status: 409
    applies_to: "POST /certificates/{id}/recert-authorization, POST /local-registrations"
  - priority: 17
    category: state
    check: "LocalRegistration.status permits the requested transition per §1.2 (posting from FILED or DELINQUENT, verification from POSTED, refiling from REJECTED)"
    error_id: ERR_REGISTRATION_STATE_INVALID
    http_status: 409
    applies_to: "POST /local-registrations/{id}/posting-confirmation, /verification, /refiling"
  - priority: 18
    category: state
    check: "ExamForm.status == ACTIVE"
    error_id: ERR_EXAM_FORM_RETIRED
    http_status: 409
    applies_to: "POST /access-code-batches, POST /exam-sessions, POST /exam-forms/{id}/retire"
  - priority: 19
    category: business_safety
    check: "Candidate.security_hold == false"
    error_id: ERR_CANDIDATE_SECURITY_HOLD
    http_status: 409
    applies_to: "POST /access-code-batches/{id}/assignments, POST /exam-sessions, POST /exam-sessions/{id}/reschedule, POST /exam-sessions/{id}/check-in"
  - priority: 20
    category: business_safety
    check: "the proctor being assigned has registration_status == REGISTERED"
    error_id: ERR_PROCTOR_NOT_REGISTERED
    http_status: 409
    applies_to: "POST /exam-sessions, POST /exam-sessions/{id}/proctor-assignment, POST /exam-sessions/{id}/reschedule, POST /access-codes/{id}/course-completion"
  - priority: 21
    category: business_safety
    check: "id_document_expires_on >= the logical clock's date"
    error_id: ERR_ID_DOCUMENT_EXPIRED
    http_status: 422
    applies_to: "POST /exam-sessions/{id}/check-in"
  - priority: 22
    category: business_safety
    check: "delivery_mode == REMOTE requires biometric_match_score to be present"
    error_id: ERR_BIOMETRIC_REQUIRED_FOR_REMOTE
    http_status: 422
    applies_to: "POST /exam-sessions/{id}/check-in"
  - priority: 23
    category: business_safety
    check: "biometric_match_score >= BIOMETRIC_MATCH_MIN (85) when supplied; for IN_PERSON a proctor_attestation == true substitutes for the score"
    error_id: ERR_IDENTITY_VERIFICATION_FAILED
    http_status: 422
    applies_to: "POST /exam-sessions/{id}/check-in"
  - priority: 24
    category: business_constraint
    check: "the resolving PlatformAdmin's X-User-ID != ScoreReport.finalized_by_user_id of the incident's session"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /security-incidents/{id}/resolution"
  - priority: 25
    category: business_referential
    check: "ExamForm.accreditation_body IN Jurisdiction.accepted_accreditation_bodies for the candidate's jurisdiction"
    error_id: ERR_ACCREDITATION_NOT_ACCEPTED
    http_status: 422
    applies_to: "POST /exam-sessions, POST /certificates"
  - priority: 26
    category: business_referential
    check: "ExamForm.language IN Jurisdiction.accepted_languages for the candidate's jurisdiction"
    error_id: ERR_LANGUAGE_NOT_ACCEPTED
    http_status: 422
    applies_to: "POST /exam-sessions, POST /certificates"
  - priority: 27
    category: business_referential
    check: "delivery_mode == REMOTE requires Jurisdiction.accepts_remote_proctoring == true for the candidate's jurisdiction"
    error_id: ERR_REMOTE_PROCTORING_NOT_ACCEPTED
    http_status: 422
    applies_to: "POST /exam-sessions, POST /exam-sessions/{id}/reschedule"
  - priority: 28
    category: business_referential
    check: "AccessCode.candidate_id == the session's candidate_id"
    error_id: ERR_ACCESS_CODE_CANDIDATE_MISMATCH
    http_status: 409
    applies_to: "POST /exam-sessions"
  - priority: 29
    category: business_referential
    check: "AccessCodeBatch(AccessCode.batch_id).exam_form_id == the session's exam_form_id"
    error_id: ERR_ACCESS_CODE_FORM_MISMATCH
    http_status: 409
    applies_to: "POST /exam-sessions"
  - priority: 30
    category: business_referential
    check: "AccommodationRequest.candidate_id == the session's candidate_id and its status IN {UNDER_REVIEW, APPROVED}"
    error_id: ERR_ACCOMMODATION_CANDIDATE_MISMATCH
    http_status: 409
    applies_to: "POST /exam-sessions"
  - priority: 31
    category: business_referential
    check: "AccessCode.bundle_type == EXAM_ONLY OR AccessCode.course_completed_at != null"
    error_id: ERR_COURSE_NOT_COMPLETED
    http_status: 409
    applies_to: "POST /exam-sessions/{id}/check-in"
  - priority: 32
    category: business_referential
    check: "the instructor signing off a bundled course has INSTRUCTOR in roles_held, registration_status == REGISTERED, and the same training_provider_id as the code's batch"
    error_id: ERR_INSTRUCTOR_NOT_AUTHORIZED
    http_status: 422
    applies_to: "POST /access-codes/{id}/course-completion"
  - priority: 33
    category: business_constraint
    check: "ExamForm.language IN Proctor.languages_certified"
    error_id: ERR_PROCTOR_LANGUAGE_NOT_CERTIFIED
    http_status: 422
    applies_to: "POST /exam-sessions, POST /exam-sessions/{id}/proctor-assignment, POST /exam-sessions/{id}/reschedule"
  - priority: 34
    category: business_constraint
    check: "delivery_mode == REMOTE requires Proctor.remote_certified == true"
    error_id: ERR_PROCTOR_NOT_REMOTE_CERTIFIED
    http_status: 422
    applies_to: "POST /exam-sessions, POST /exam-sessions/{id}/proctor-assignment, POST /exam-sessions/{id}/reschedule"
  - priority: 35
    category: business_constraint
    check: "ExamForm.language IN TestingSite.languages_supported for IN_PERSON sessions"
    error_id: ERR_SITE_LANGUAGE_UNSUPPORTED
    http_status: 422
    applies_to: "POST /exam-sessions, POST /exam-sessions/{id}/reschedule"
  - priority: 36
    category: business_constraint
    check: "delivery_mode == IN_PERSON requires testing_site_id; delivery_mode == REMOTE requires testing_site_id to be absent or null"
    error_id: ERR_SITE_REQUIRED_FOR_IN_PERSON
    http_status: 422
    applies_to: "POST /exam-sessions, POST /exam-sessions/{id}/reschedule"
  - priority: 37
    category: business_constraint
    check: "ExamSession.proctoring_status == ASSIGNED (a proctor is currently attached)"
    error_id: ERR_SESSION_PROCTOR_UNASSIGNED
    http_status: 409
    applies_to: "POST /exam-sessions/{id}/check-in, POST /exam-sessions/{id}/start, POST /exam-sessions/{id}/submission"
  - priority: 38
    category: business_constraint
    check: "no other AccommodationRequest for this candidate has status == APPROVED"
    error_id: ERR_DUPLICATE_APPROVED_ACCOMMODATION
    http_status: 409
    applies_to: "POST /accommodation-requests/{id}/review"
  - priority: 39
    category: business_constraint
    check: "the candidate has no Certificate with status == ISSUED in this jurisdiction unless that certificate has recert_authorized_at != null (recertification path)"
    error_id: ERR_DUPLICATE_ACTIVE_CERTIFICATE
    http_status: 409
    applies_to: "POST /certificates"
  - priority: 40
    category: business_constraint
    check: "voided_item_count < ExamForm.scored_item_count and voided_correct_count <= min(voided_item_count, ScoreReport.raw_correct_count)"
    error_id: ERR_VOIDED_ITEM_COUNT_INVALID
    http_status: 422
    applies_to: "POST /score-reports/{id}/finalization"
  - priority: 41
    category: business_constraint
    check: "ScoreReport.status == FINAL and pass_flag == true"
    error_id: ERR_CANDIDATE_DID_NOT_PASS
    http_status: 422
    applies_to: "POST /certificates"
  - priority: 42
    category: business_constraint
    check: "Jurisdiction.requires_local_registration == true"
    error_id: ERR_LOCAL_REGISTRATION_NOT_REQUIRED
    http_status: 409
    applies_to: "POST /local-registrations"
  - priority: 43
    category: business_temporal
    check: "scheduled_start_at >= logical_clock + SCHEDULE_LEAD_MINUTES (1440)"
    error_id: ERR_SCHEDULE_LEAD_TIME_TOO_SHORT
    http_status: 422
    applies_to: "POST /exam-sessions, POST /exam-sessions/{id}/reschedule"
  - priority: 44
    category: business_temporal
    check: "logical_clock IN [scheduled_start_at - 30min, scheduled_start_at + 15min], both bounds inclusive"
    error_id: ERR_CHECKIN_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /exam-sessions/{id}/check-in"
  - priority: 45
    category: business_temporal
    check: "for sessions already SUBMITTED or CLOSED, logical_clock <= ExamSession.submitted_at + INCIDENT_FILING_WINDOW_HOURS (72)"
    error_id: ERR_INCIDENT_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /security-incidents, POST /security-incidents/{id}/review-open"
  - priority: 46
    category: business_temporal
    check: "logical_clock >= Certificate.recert_window_opens_at"
    error_id: ERR_RECERT_WINDOW_NOT_OPEN
    http_status: 409
    applies_to: "POST /certificates/{id}/recert-authorization"
  - priority: 47
    category: business_temporal
    check: "calculations.proctor_interval_conflict finds no conflicting sitting for the target proctor"
    error_id: ERR_PROCTOR_INTERVAL_CONFLICT
    http_status: 409
    applies_to: "POST /exam-sessions, POST /exam-sessions/{id}/proctor-assignment, POST /exam-sessions/{id}/reschedule, POST /accommodation-requests/{id}/review"
  - priority: 48
    category: business_temporal
    check: "calculations.site_seat_occupancy counts fewer than TestingSite.seat_count overlapping sittings"
    error_id: ERR_SITE_SEAT_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /exam-sessions, POST /exam-sessions/{id}/reschedule, POST /accommodation-requests/{id}/review"
  - priority: 49
    category: business_fiscal
    check: "logical_clock <= AccessCodeBatch.expires_at"
    error_id: ERR_BATCH_EXPIRED
    http_status: 409
    applies_to: "POST /access-code-batches/{id}/assignments"
  - priority: 50
    category: business_fiscal
    check: "AccessCodeBatch.available_count >= 1"
    error_id: ERR_BATCH_DEPLETED
    http_status: 409
    applies_to: "POST /access-code-batches/{id}/assignments, POST /access-code-batches/{id}/void"
  - priority: 51
    category: business_fiscal
    check: "TrainingProvider.credit_balance_cents >= the amount about to be debited (batch total_price_cents or CERT_ISSUANCE_FEE_CENTS)"
    error_id: ERR_INSUFFICIENT_CREDIT
    http_status: 402
    applies_to: "POST /access-code-batches, POST /certificates"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  - method: POST
    path: "/jurisdictions"
    description: "register a health-department / state jurisdiction with its acceptance and recertification rules"
    roles: [PlatformAdmin]
    code: 201
    input: ["name", "jurisdiction_code", "accepted_accreditation_bodies", "accepted_languages", "accepts_remote_proctoring?", "min_passing_score_override?", "requires_local_registration?", "posting_deadline_days?", "recert_cycle_months?", "exam_fee_surcharge_pct?"]
    output: Jurisdiction
    side_effects: ["none"]
  - method: GET
    path: "/jurisdictions/{id}"
    description: "read one jurisdiction"
    roles: [PlatformAdmin, HealthOfficer, ProviderAdmin]
    code: 200
    input: []
    output: Jurisdiction
    side_effects: []

  - method: POST
    path: "/training-providers"
    description: "register a training provider and open its prepayment ledger at zero"
    roles: [PlatformAdmin]
    code: 201
    input: ["legal_name", "jurisdiction_id", "contact_email"]
    output: TrainingProvider
    side_effects: ["lifetime_credited_cents = 0, lifetime_charged_cents = 0, credit_balance_cents = 0"]
  - method: GET
    path: "/training-providers/{id}"
    description: "read one provider including its ledger fields"
    roles: [PlatformAdmin, ProviderAdmin]
    code: 200
    input: []
    output: TrainingProvider
    side_effects: []
  - method: GET
    path: "/training-providers"
    description: "list providers, optionally filtered by home jurisdiction"
    roles: [PlatformAdmin]
    code: 200
    input: ["jurisdiction_id?", "limit?", "offset?"]
    output: TrainingProvider[]
    side_effects: []
  - method: POST
    path: "/training-providers/{id}/credit-adjustments"
    description: "post a prepayment credit to the provider ledger"
    roles: [PlatformAdmin]
    code: 200
    input: ["amount_cents", "memo"]
    output: TrainingProvider
    side_effects: ["lifetime_credited_cents += amount_cents", "credit_balance_cents recomputed per calculations.provider_ledger_balance", "increments TrainingProvider.version by 1"]

  - method: POST
    path: "/exam-forms"
    description: "publish an accredited exam form version in one language"
    roles: [PlatformAdmin]
    code: 201
    input: ["form_code", "version_label", "language", "accreditation_body", "scored_item_count", "national_cut_score", "base_minutes", "pretest_item_count?", "translated_extra_minutes?"]
    output: ExamForm
    side_effects: ["status = ACTIVE"]
  - method: GET
    path: "/exam-forms/{id}"
    description: "read one exam form"
    roles: [PlatformAdmin, ProviderAdmin, Proctor]
    code: 200
    input: []
    output: ExamForm
    side_effects: []
  - method: GET
    path: "/exam-forms"
    description: "list exam forms with filtering and pagination"
    roles: [PlatformAdmin, ProviderAdmin]
    code: 200
    input: ["language?", "accreditation_body?", "status?", "limit?", "offset?"]
    output: ExamForm[]
    side_effects: []
  - method: POST
    path: "/exam-forms/{id}/retire"
    description: "retire a form so that no new batch purchase or new sitting may use it"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: ExamForm
    side_effects: ["status ACTIVE -> RETIRED", "already-scheduled sessions are untouched"]

  - method: POST
    path: "/testing-sites"
    description: "register an in-person proctored testing site with its seat capacity"
    roles: [PlatformAdmin]
    code: 201
    input: ["name", "jurisdiction_id", "seat_count", "address_line", "languages_supported"]
    output: TestingSite
    side_effects: ["reserved_seat_minutes = 0"]
  - method: GET
    path: "/testing-sites/{id}"
    description: "read one testing site including reserved_seat_minutes"
    roles: [PlatformAdmin, ProviderAdmin]
    code: 200
    input: []
    output: TestingSite
    side_effects: []
  - method: GET
    path: "/testing-sites"
    description: "list testing sites, optionally filtered by jurisdiction"
    roles: [PlatformAdmin, ProviderAdmin]
    code: 200
    input: ["jurisdiction_id?", "limit?", "offset?"]
    output: TestingSite[]
    side_effects: []

  - method: POST
    path: "/candidates"
    description: "enroll a candidate under a training provider and a governing jurisdiction"
    roles: [ProviderAdmin]
    code: 201
    input: ["full_name", "email", "preferred_language", "training_provider_id", "jurisdiction_id"]
    output: Candidate
    side_effects: ["security_hold = false, compliance_status = NOT_CERTIFIED, substantiated_incident_count = 0"]
  - method: GET
    path: "/candidates/{id}"
    description: "read one candidate"
    roles: [PlatformAdmin, ProviderAdmin, Candidate]
    code: 200
    input: []
    output: Candidate
    side_effects: []
  - method: GET
    path: "/candidates"
    description: "list candidates by provider, jurisdiction or security-hold state"
    roles: [PlatformAdmin, ProviderAdmin]
    code: 200
    input: ["training_provider_id?", "jurisdiction_id?", "security_hold?", "limit?", "offset?"]
    output: Candidate[]
    side_effects: []
  - method: GET
    path: "/candidates/{id}/compliance-summary"
    description: "computed read: current certification posture of one candidate"
    roles: [PlatformAdmin, ProviderAdmin, Candidate, HealthOfficer]
    code: 200
    input: []
    output: "{ candidate_id: string, compliance_status: string, active_certificate_id: string, certificate_expires_at: datetime, recert_window_opens_at: datetime, local_registration_status: string, reminder_tiers_sent: string[], open_incident_count: integer }"
    side_effects: []

  - method: POST
    path: "/proctors"
    description: "register a proctor / instructor for a provider; the registration starts PENDING"
    roles: [ProviderAdmin]
    code: 201
    input: ["full_name", "email", "training_provider_id", "roles_held", "languages_certified", "remote_certified?"]
    output: Proctor
    side_effects: ["registration_status = PENDING, risk_score = 0.00, reserved_minutes = 0, substantiated_incident_weight_total = 0"]
  - method: GET
    path: "/proctors/{id}"
    description: "read one proctor including registration_status, risk_score and risk_variant_applied"
    roles: [PlatformAdmin, ProviderAdmin, Proctor]
    code: 200
    input: []
    output: Proctor
    side_effects: []
  - method: GET
    path: "/proctors"
    description: "list proctors by provider or registration status"
    roles: [PlatformAdmin, ProviderAdmin]
    code: 200
    input: ["training_provider_id?", "registration_status?", "limit?", "offset?"]
    output: Proctor[]
    side_effects: []
  - method: POST
    path: "/proctors/{id}/registration-decision"
    description: "approve or reject a pending proctor registration"
    roles: [PlatformAdmin]
    code: 200
    input: ["decision", "decision_note?"]
    output: Proctor
    side_effects: ["PENDING -> REGISTERED on APPROVE, PENDING -> REJECTED on REJECT"]
  - method: POST
    path: "/proctors/{id}/audit-open"
    description: "open a registration audit; recomputes risk with the ROLLING_WINDOW variant"
    roles: [PlatformAdmin]
    code: 200
    input: ["audit_reason"]
    output: Proctor
    side_effects: ["REGISTERED -> UNDER_AUDIT", "risk_score recomputed with variant ROLLING_WINDOW and risk_variant_applied = ROLLING_WINDOW", "opening an audit never suspends by itself"]
  - method: POST
    path: "/proctors/{id}/audit-close"
    description: "close an audit with PASS, SUSPEND or REVOKE; recomputes risk with the LIFETIME_CUMULATIVE variant before deciding"
    roles: [PlatformAdmin]
    code: 200
    input: ["outcome", "audit_note?"]
    output: Proctor
    side_effects:
      - "risk_score recomputed with variant LIFETIME_CUMULATIVE and risk_variant_applied = LIFETIME_CUMULATIVE"
      - "UNDER_AUDIT -> REGISTERED on PASS, except that a recomputed risk_score >= PROCTOR_RISK_SUSPEND_THRESHOLD forces UNDER_AUDIT -> SUSPENDED with suspended_reason = RISK_THRESHOLD_BREACH"
      - "UNDER_AUDIT -> SUSPENDED on SUSPEND with suspended_reason = AUDIT_FAILURE"
      - "UNDER_AUDIT -> REVOKED on REVOKE with suspended_reason = AUDIT_REVOCATION"
      - "when the proctor ends SUSPENDED or REVOKED, every ExamSession of this proctor with session_status = SCHEDULED and proctoring_status = ASSIGNED moves proctoring_status ASSIGNED -> PENDING_REPROCTOR, clears proctor_id, and decrements Proctor.reserved_minutes by that session's allowed_minutes"
  - method: POST
    path: "/proctors/{id}/reinstatement"
    description: "reinstate a suspended proctor after documented remediation"
    roles: [PlatformAdmin]
    code: 200
    input: ["remediation_ref"]
    output: Proctor
    side_effects: ["SUSPENDED -> REGISTERED, suspended_reason = null", "sessions already left in PENDING_REPROCTOR are not auto-reassigned"]

  - method: POST
    path: "/access-code-batches"
    description: "purchase a batch of course/exam access codes for one exam form; mints one AccessCode per unit and debits the provider ledger"
    roles: [ProviderAdmin]
    code: 201
    input: ["training_provider_id", "exam_form_id", "line_items", "expires_at"]
    output: AccessCodeBatch
    side_effects:
      - "quantity_purchased and total_price_cents computed per calculations.batch_purchase_price"
      - "mints quantity_purchased AccessCode rows with status AVAILABLE, sequential code values, and bundle_type taken from their line item, in line_items order"
      - "available_count = quantity_purchased; assigned_count = consumed_count = voided_count = 0; status = ACTIVE"
      - "TrainingProvider.lifetime_charged_cents += total_price_cents and credit_balance_cents recomputed per calculations.provider_ledger_balance"
  - method: GET
    path: "/access-code-batches/{id}"
    description: "read one batch including its four inventory counters and void amounts"
    roles: [PlatformAdmin, ProviderAdmin]
    code: 200
    input: []
    output: AccessCodeBatch
    side_effects: []
  - method: GET
    path: "/access-code-batches"
    description: "list batches by provider, exam form or status"
    roles: [PlatformAdmin, ProviderAdmin]
    code: 200
    input: ["training_provider_id?", "exam_form_id?", "status?", "limit?", "offset?"]
    output: AccessCodeBatch[]
    side_effects: []
  - method: POST
    path: "/access-code-batches/{id}/assignments"
    description: "assign one AVAILABLE code of the requested bundle_type to a candidate; guarded by the batch version"
    roles: [ProviderAdmin]
    code: 201
    input: ["candidate_id", "bundle_type", "expected_batch_version"]
    output: AccessCode
    side_effects:
      - "selects the AVAILABLE code of the requested bundle_type with the earliest created_at; when no such code exists the request is rejected with ERR_BATCH_DEPLETED"
      - "AccessCode AVAILABLE -> ASSIGNED with candidate_id set and assigned_at = the logical clock"
      - "AccessCodeBatch.available_count -= 1 and assigned_count += 1"
      - "AccessCodeBatch ACTIVE -> DEPLETED when available_count reaches 0"
      - "increments AccessCodeBatch.version by 1"
  - method: POST
    path: "/access-code-batches/{id}/void"
    description: "void every still-AVAILABLE code in the batch and post the net refund to the provider ledger; guarded by the batch version"
    roles: [ProviderAdmin]
    code: 200
    input: ["reason", "expected_batch_version"]
    output: AccessCodeBatch
    side_effects:
      - "every child code with status AVAILABLE moves AVAILABLE -> VOIDED; already ASSIGNED or CONSUMED codes are left untouched"
      - "available_count -> 0 and voided_count += the number of codes voided"
      - "void_gross_credit_cents, void_restock_fee_cents and void_net_credit_cents computed per calculations.batch_void_refund"
      - "TrainingProvider.lifetime_credited_cents += void_net_credit_cents and credit_balance_cents recomputed"
      - "batch status ACTIVE -> VOIDED"
      - "increments AccessCodeBatch.version by 1"
  - method: GET
    path: "/access-codes/{id}"
    description: "read one access code"
    roles: [PlatformAdmin, ProviderAdmin, Candidate]
    code: 200
    input: []
    output: AccessCode
    side_effects: []
  - method: GET
    path: "/access-codes"
    description: "list access codes by batch, assignee, signing instructor or status; this is the discovery channel for the codes minted by a batch purchase"
    roles: [PlatformAdmin, ProviderAdmin]
    code: 200
    input: ["batch_id?", "candidate_id?", "course_instructor_proctor_id?", "status?", "limit?", "offset?"]
    output: AccessCode[]
    side_effects: []
  - method: POST
    path: "/access-codes/{id}/course-completion"
    description: "a REGISTERED proctor holding the INSTRUCTOR role signs off the bundled course attached to a COURSE_PLUS_EXAM code"
    roles: [ProviderAdmin]
    code: 200
    input: ["course_instructor_proctor_id"]
    output: AccessCode
    side_effects: ["course_completed_at = the logical clock and course_instructor_proctor_id set", "the code stays ASSIGNED; a second sign-off on the same code is rejected by ERR_ACCESS_CODE_STATE_INVALID"]

  - method: POST
    path: "/accommodation-requests"
    description: "a candidate requests extra time and/or a translated exam version"
    roles: [ProviderAdmin, Candidate]
    code: 201
    input: ["candidate_id", "accommodation_type", "requested_multiplier", "documentation_ref", "requested_language?"]
    output: AccommodationRequest
    side_effects: ["status = REQUESTED, approved_multiplier = null"]
  - method: GET
    path: "/accommodation-requests/{id}"
    description: "read one accommodation request"
    roles: [PlatformAdmin, ProviderAdmin, Candidate]
    code: 200
    input: []
    output: AccommodationRequest
    side_effects: []
  - method: GET
    path: "/accommodation-requests"
    description: "list accommodation requests by candidate or status"
    roles: [PlatformAdmin, ProviderAdmin]
    code: 200
    input: ["candidate_id?", "status?", "limit?", "offset?"]
    output: AccommodationRequest[]
    side_effects: []
  - method: POST
    path: "/accommodation-requests/{id}/review-open"
    description: "take a requested accommodation into review"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: AccommodationRequest
    side_effects: ["REQUESTED -> UNDER_REVIEW"]
  - method: POST
    path: "/accommodation-requests/{id}/review"
    description: "approve or deny an accommodation under review; approval re-times every future sitting already linked to this request"
    roles: [PlatformAdmin]
    code: 200
    input: ["decision", "approved_multiplier?", "decision_reason?"]
    output: AccommodationRequest
    side_effects:
      - "UNDER_REVIEW -> APPROVED on APPROVE with approved_multiplier defaulting to requested_multiplier when omitted"
      - "UNDER_REVIEW -> DENIED on DENY with decision_reason recorded and approved_multiplier left null"
      - "on APPROVE, every linked ExamSession with session_status = SCHEDULED has allowed_minutes and scheduled_end_at recomputed per calculations.session_allowed_minutes, TestingSite.reserved_seat_minutes and Proctor.reserved_minutes adjusted by the delta, and the lengthened interval re-checked against calculations.proctor_interval_conflict and calculations.site_seat_occupancy"
      - "reviewed_by_user_id = the X-User-ID header of the reviewer"
  - method: POST
    path: "/exam-sessions"
    description: "schedule an accredited sitting for a candidate against an assigned access code, in person or by remote proctoring"
    roles: [ProviderAdmin]
    code: 201
    input: ["candidate_id", "exam_form_id", "access_code_id", "delivery_mode", "scheduled_start_at", "testing_site_id?", "proctor_id?", "accommodation_request_id?"]
    output: ExamSession
    side_effects:
      - "allowed_minutes and scheduled_end_at computed per calculations.session_allowed_minutes"
      - "session_status = SCHEDULED; proctoring_status = ASSIGNED when proctor_id is supplied, otherwise PENDING_ASSIGNMENT"
      - "reserved_seat_minutes += allowed_minutes on the testing site for IN_PERSON sittings"
      - "reserved_minutes += allowed_minutes on the proctor when proctor_id is supplied"
      - "reschedule_count = 0"
  - method: GET
    path: "/exam-sessions/{id}"
    description: "read one exam session including both status dimensions and the identity-verification fields"
    roles: [PlatformAdmin, ProviderAdmin, Proctor, Candidate]
    code: 200
    input: []
    output: ExamSession
    side_effects: []
  - method: GET
    path: "/exam-sessions"
    description: "list exam sessions by candidate, form, code, site, proctor, accommodation or either status dimension"
    roles: [PlatformAdmin, ProviderAdmin, Proctor]
    code: 200
    input: ["candidate_id?", "exam_form_id?", "access_code_id?", "testing_site_id?", "proctor_id?", "accommodation_request_id?", "session_status?", "proctoring_status?", "limit?", "offset?"]
    output: ExamSession[]
    side_effects: []
  - method: POST
    path: "/exam-sessions/{id}/reschedule"
    description: "move a scheduled sitting to a new start time, optionally changing delivery mode, site or proctor; guarded by the session version"
    roles: [ProviderAdmin]
    code: 200
    input: ["scheduled_start_at", "expected_session_version", "delivery_mode?", "testing_site_id?", "proctor_id?"]
    output: ExamSession
    side_effects:
      - "scheduled_start_at replaced, allowed_minutes and scheduled_end_at recomputed per calculations.session_allowed_minutes"
      - "reschedule_count += 1"
      - "the released interval decrements TestingSite.reserved_seat_minutes and Proctor.reserved_minutes before the new interval is reserved"
      - "proctoring_status PENDING_REPROCTOR -> ASSIGNED when a proctor_id is supplied"
      - "increments ExamSession.version by 1"
  - method: POST
    path: "/exam-sessions/{id}/proctor-assignment"
    description: "assign or replace the proctor of a scheduled sitting"
    roles: [ProviderAdmin]
    code: 200
    input: ["proctor_id"]
    output: ExamSession
    side_effects:
      - "proctor_id set; proctoring_status PENDING_ASSIGNMENT -> ASSIGNED or PENDING_REPROCTOR -> ASSIGNED"
      - "Proctor.reserved_minutes += allowed_minutes for the newly assigned proctor and -= allowed_minutes for the replaced one"
  - method: POST
    path: "/exam-sessions/{id}/check-in"
    description: "verify candidate identity at the start of the check-in window"
    roles: [Proctor]
    code: 200
    input: ["id_document_type", "id_document_expires_on", "biometric_match_score?", "proctor_attestation?"]
    output: ExamSession
    side_effects:
      - "session_status SCHEDULED -> CHECKED_IN with checked_in_at = identity_verified_at = the logical clock"
      - "id_document_type, id_document_expires_on and biometric_match_score recorded"
  - method: POST
    path: "/exam-sessions/{id}/start"
    description: "release the exam to a checked-in candidate"
    roles: [Proctor]
    code: 200
    input: []
    output: ExamSession
    side_effects: ["session_status CHECKED_IN -> IN_PROGRESS with started_at = the logical clock", "the AccessCode is NOT consumed here; it stays ASSIGNED until submission (see §1.2 AccessCode ASSIGNED -> CONSUMED)"]
  - method: POST
    path: "/exam-sessions/{id}/submission"
    description: "submit the sitting with its item counts and the proctor attestation; creates the provisional score report"
    roles: [Proctor]
    code: 201
    input: ["scored_correct_count", "proctor_attestation", "pretest_correct_count?"]
    output: ScoreReport
    side_effects:
      - "session_status IN_PROGRESS -> SUBMITTED with submitted_at = the logical clock"
      - "proctoring_status ASSIGNED -> ATTESTED and proctor_attestation recorded"
      - "AccessCode ASSIGNED -> CONSUMED with consumed_at = the logical clock, AccessCodeBatch.assigned_count -= 1 and consumed_count += 1"
      - "Proctor.proctored_session_count += 1; reserved_minutes is NOT released here — the interval is held until finalization"
      - "creates a ScoreReport with status PROVISIONAL whose provisional_scaled_score and pass_flag follow calculations.scaled_score variant PROVISIONAL and calculations.effective_cut_score"
  - method: POST
    path: "/exam-sessions/{id}/cancellation"
    description: "cancel a scheduled sitting and return its access code to the batch"
    roles: [ProviderAdmin]
    code: 200
    input: ["reason"]
    output: ExamSession
    side_effects:
      - "session_status SCHEDULED -> CANCELLED and proctoring_status -> CLEARED"
      - "AccessCode ASSIGNED -> AVAILABLE with candidate_id and assigned_at cleared and assignment_release_count += 1"
      - "AccessCodeBatch.assigned_count -= 1 and available_count += 1"
      - "AccessCodeBatch DEPLETED -> ACTIVE when available_count becomes greater than 0"
      - "TestingSite.reserved_seat_minutes -= allowed_minutes and Proctor.reserved_minutes -= allowed_minutes"

  - method: GET
    path: "/score-reports/{id}"
    description: "read one score report including both the provisional and final scaled scores"
    roles: [PlatformAdmin, ProviderAdmin, Candidate]
    code: 200
    input: []
    output: ScoreReport
    side_effects: []
  - method: GET
    path: "/score-reports"
    description: "list score reports by session, exam form or status"
    roles: [PlatformAdmin, ProviderAdmin]
    code: 200
    input: ["exam_session_id?", "exam_form_id?", "status?", "limit?", "offset?"]
    output: ScoreReport[]
    side_effects: []
  - method: POST
    path: "/score-reports/{id}/finalization"
    description: "equate and release a provisional score report, optionally excluding items voided in post-administration review"
    roles: [PlatformAdmin]
    code: 200
    input: ["voided_item_count?", "voided_correct_count?"]
    output: ScoreReport
    side_effects:
      - "final_scaled_score and pass_flag recomputed per calculations.scaled_score variant FINAL_EQUATED against calculations.effective_cut_score"
      - "status PROVISIONAL -> FINAL with released_at = the logical clock and finalized_by_user_id = the X-User-ID header"
      - "ExamSession session_status SUBMITTED -> CLOSED; proctoring_status ATTESTED -> CLEARED only when no SecurityIncident on this session has status IN {OPEN, UNDER_REVIEW}, otherwise it stays ATTESTED"
      - "TestingSite.reserved_seat_minutes -= allowed_minutes and Proctor.reserved_minutes -= allowed_minutes (the sitting's interval is released here, not at submission)"
      - "Candidate.compliance_status stays NOT_CERTIFIED until a certificate is issued"

  - method: POST
    path: "/certificates"
    description: "issue a jurisdiction-accepted food manager certificate from a passing final score report"
    roles: [PlatformAdmin]
    code: 201
    input: ["score_report_id"]
    output: Certificate
    side_effects:
      - "issued_at, expires_at and recert_window_opens_at computed per calculations.certificate_validity_window from the candidate jurisdiction recert_cycle_months"
      - "status = ISSUED, certificate_number assigned, reminder_tiers_sent = []"
      - "issuance_fee_cents = CERT_ISSUANCE_FEE_CENTS debited: TrainingProvider.lifetime_charged_cents += issuance_fee_cents and credit_balance_cents recomputed"
      - "Candidate.compliance_status -> CERTIFIED"
      - "when the candidate already holds an ISSUED certificate for the same jurisdiction the request is rejected with ERR_DUPLICATE_ACTIVE_CERTIFICATE"
  - method: GET
    path: "/certificates/{id}"
    description: "read one certificate including its recertification window and reminder tiers"
    roles: [PlatformAdmin, ProviderAdmin, Candidate, HealthOfficer]
    code: 200
    input: []
    output: Certificate
    side_effects: []
  - method: GET
    path: "/certificates"
    description: "list certificates by candidate, score report, jurisdiction, supersession link or status"
    roles: [PlatformAdmin, ProviderAdmin, HealthOfficer]
    code: 200
    input: ["candidate_id?", "score_report_id?", "jurisdiction_id?", "superseded_by_certificate_id?", "status?", "limit?", "offset?"]
    output: Certificate[]
    side_effects: []
  - method: POST
    path: "/certificates/{id}/recert-authorization"
    description: "authorize a recertification sitting once the five-year window has opened"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Certificate
    side_effects:
      - "recert_authorized_at = the logical clock; the certificate stays ISSUED (or EXPIRED) and is not renewed by this call"
      - "rejected with ERR_RECERT_WINDOW_NOT_OPEN when the logical clock is before recert_window_opens_at"

  - method: POST
    path: "/local-registrations"
    description: "file the certificate with the local health department for the establishment where it must be posted"
    roles: [ProviderAdmin]
    code: 201
    input: ["certificate_id", "establishment_name", "establishment_address"]
    output: LocalRegistration
    side_effects:
      - "status = FILED with filed_at = the logical clock"
      - "posting_deadline_at = filed_at + Jurisdiction.posting_deadline_days days"
      - "jurisdiction_id copied from the certificate; rejected with ERR_LOCAL_REGISTRATION_NOT_REQUIRED when that jurisdiction has requires_local_registration = false"
      - "refile_count = 0"
  - method: GET
    path: "/local-registrations/{id}"
    description: "read one local registration including its posting deadline"
    roles: [PlatformAdmin, ProviderAdmin, HealthOfficer]
    code: 200
    input: []
    output: LocalRegistration
    side_effects: []
  - method: GET
    path: "/local-registrations"
    description: "list local registrations by certificate, jurisdiction or status"
    roles: [PlatformAdmin, ProviderAdmin, HealthOfficer]
    code: 200
    input: ["certificate_id?", "jurisdiction_id?", "status?", "limit?", "offset?"]
    output: LocalRegistration[]
    side_effects: []
  - method: POST
    path: "/local-registrations/{id}/posting-confirmation"
    description: "confirm that the certificate is physically posted at the establishment"
    roles: [ProviderAdmin]
    code: 200
    input: ["posting_location"]
    output: LocalRegistration
    side_effects: ["status FILED -> POSTED or DELINQUENT -> POSTED with posted_at = the logical clock and posting_location recorded"]
  - method: POST
    path: "/local-registrations/{id}/verification"
    description: "the health officer verifies or rejects a posted registration"
    roles: [HealthOfficer]
    code: 200
    input: ["decision", "rejection_reason?"]
    output: LocalRegistration
    side_effects: ["status POSTED -> VERIFIED on VERIFY with verified_by_user_id = the X-User-ID header", "status POSTED -> REJECTED on REJECT with rejection_reason recorded"]
  - method: POST
    path: "/local-registrations/{id}/refiling"
    description: "refile a rejected registration, restarting the posting clock"
    roles: [ProviderAdmin]
    code: 200
    input: ["establishment_address?"]
    output: LocalRegistration
    side_effects: ["status REJECTED -> FILED with filed_at = the logical clock, posted_at cleared and posting_deadline_at recomputed", "refile_count += 1"]

  - method: POST
    path: "/security-incidents"
    description: "a proctor reports an exam-security incident against a sitting"
    roles: [Proctor]
    code: 201
    input: ["exam_session_id", "reported_by_proctor_id", "category", "severity", "narrative"]
    output: SecurityIncident
    side_effects:
      - "status = OPEN with severity_weight taken from SEVERITY_WEIGHT for the reported severity"
      - "the sitting's proctoring_status is NOT changed by the report itself; it moves ATTESTED -> INCIDENT_UNDER_REVIEW or CLEARED -> INCIDENT_UNDER_REVIEW only when the incident is taken into review"
      - "only sittings whose session_status is SUBMITTED or CLOSED may be reported against (ERR_SESSION_STATE_INVALID otherwise)"
      - "rejected with ERR_INCIDENT_WINDOW_CLOSED once the logical clock is more than INCIDENT_FILING_WINDOW_HOURS after the sitting's submitted_at"
  - method: GET
    path: "/security-incidents/{id}"
    description: "read one security incident"
    roles: [PlatformAdmin, ProviderAdmin, Proctor]
    code: 200
    input: []
    output: SecurityIncident
    side_effects: []
  - method: GET
    path: "/security-incidents"
    description: "list security incidents by sitting, reporting proctor or status"
    roles: [PlatformAdmin, ProviderAdmin, Proctor]
    code: 200
    input: ["exam_session_id?", "reported_by_proctor_id?", "status?", "limit?", "offset?"]
    output: SecurityIncident[]
    side_effects: []
  - method: POST
    path: "/security-incidents/{id}/review-open"
    description: "take an open incident into formal review"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: SecurityIncident
    side_effects: ["status OPEN -> UNDER_REVIEW"]
  - method: POST
    path: "/security-incidents/{id}/resolution"
    description: "substantiate or dismiss an incident under review; substantiation drives the full invalidation cascade"
    roles: [PlatformAdmin]
    code: 200
    input: ["outcome", "resolution_note?"]
    output: SecurityIncident
    side_effects:
      - "status UNDER_REVIEW -> SUBSTANTIATED on SUBSTANTIATE or UNDER_REVIEW -> DISMISSED on DISMISS, with resolved_by_user_id = the X-User-ID header"
      - "on DISMISS the sitting proctoring_status INCIDENT_UNDER_REVIEW -> CLEARED and nothing else changes"
      - "on SUBSTANTIATE the sitting moves session_status -> INVALIDATED and proctoring_status -> COMPROMISED"
      - "on SUBSTANTIATE any ScoreReport of that sitting moves to VOIDED with pass_flag = false, any Certificate issued from that report moves to REVOKED with revocation_reason = SCORE_VOIDED and its issuance_fee_cents credited back to the provider ledger, any LocalRegistration of that certificate moves to WITHDRAWN, the candidate becomes compliance_status = NON_COMPLIANT, substantiated_incident_count += 1, and security_hold = true only when the incident severity is CRITICAL"
      - "on SUBSTANTIATE the reporting sitting proctor accumulates substantiated_incident_weight_total += severity_weight and risk_score is recomputed with variant LIFETIME_CUMULATIVE; a recomputed risk_score >= PROCTOR_RISK_SUSPEND_THRESHOLD moves the proctor REGISTERED -> SUSPENDED with suspended_reason = RISK_THRESHOLD_BREACH, which in turn releases that proctor's SCHEDULED sittings to PENDING_REPROCTOR and decrements Proctor.reserved_minutes"
      - "the resolver must not be the X-User-ID that finalized the score report of that sitting (ERR_SEGREGATION_OF_DUTIES)"

  - method: POST
    path: "/compliance-runs"
    description: "ops run over the pinned logical clock: expires certificates, marks delinquent postings, expires batches, and sends recertification reminder notices in four ordered phases"
    roles: [PlatformAdmin]
    code: 201
    input: []
    output: "{ run_epoch: datetime, certificates_expired_count: integer, registrations_delinquent_count: integer, batches_expired_count: integer, reminder_notices_sent_count: integer, notified_certificate_ids: string[] }"
    side_effects:
      - "phase 1: every ACTIVE or DEPLETED AccessCodeBatch whose expires_at is strictly before run_epoch moves to EXPIRED; its AVAILABLE and ASSIGNED child codes move to EXPIRED, available_count and assigned_count drop by those units and voided_count absorbs them so calculations.access_code_inventory_conservation still holds; a SCHEDULED sitting holding an expired ASSIGNED code is CANCELLED without returning the code"
      - "phase 2: every ISSUED Certificate with expires_at <= run_epoch moves ISSUED -> EXPIRED, its candidate compliance_status -> LAPSED, and its LocalRegistration rows in FILED, POSTED, VERIFIED or DELINQUENT move to WITHDRAWN"
      - "phase 3: every LocalRegistration with status FILED, posted_at == null and posting_deadline_at strictly before run_epoch moves FILED -> DELINQUENT"
      - "phase 4: reminder notices selected, filtered and ordered per calculations.recert_reminder_selection; each notified certificate appends exactly one tier to reminder_tiers_sent and never repeats a tier already present"
      - "run_epoch = the logical clock; the four phases run in the order pinned by calculations.recert_reminder_selection and phase 4 sees the statuses produced by phases 1-3"
  - method: POST
    path: "/_clock/set_current_utc"
    description: "test hook: pin the logical clock used by every temporal rule. The clock defaults to 2026-08-01T00:00:00Z before any call to this endpoint."
    roles: [PlatformAdmin]
    code: 200
    input: ["to_iso8601"]
    output: "{ current_utc: datetime }"
    side_effects: ["replaces the logical clock for all subsequent requests; no business entity is modified"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- authentication / authorization ---
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing or empty on any endpoint"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the X-User-Role value is not listed in the target endpoint's roles in §1.5"
  - id: ERR_FORBIDDEN_RESOURCE_SCOPE
    http: 403
    condition: "an entity_backed caller addresses a resource outside its own scope: a ProviderAdmin acting on another provider's batch, candidate or proctor; a Candidate reading another candidate's session, code, accommodation, score report or certificate; a Proctor acting on a session it is not assigned to; a HealthOfficer verifying a registration outside its jurisdiction"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the PlatformAdmin X-User-ID resolving a SecurityIncident is the same X-User-ID recorded as finalized_by_user_id on that sitting's ScoreReport, or the same X-User-ID that reviewed the accommodation being relied on"
  # --- request shape ---
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing required body field, wrong JSON type, malformed datetime, unknown enum value, negative count, requested_multiplier outside 1.00..2.00, or a line_items entry with quantity < 1"
  - id: ERR_INVALID_PAGINATION
    http: 400
    condition: "limit outside [1,100] or offset < 0 on any list endpoint"
  # --- existence (priority 6 path ids, then priority 7 body foreign keys) ---
  - id: ERR_JURISDICTION_NOT_FOUND
    http: 404
    condition: "jurisdiction_id in the path or body does not resolve to a Jurisdiction"
  - id: ERR_TRAINING_PROVIDER_NOT_FOUND
    http: 404
    condition: "training_provider_id in the path or body does not resolve to a TrainingProvider"
  - id: ERR_EXAM_FORM_NOT_FOUND
    http: 404
    condition: "exam_form_id in the path or body does not resolve to an ExamForm"
  - id: ERR_TESTING_SITE_NOT_FOUND
    http: 404
    condition: "testing_site_id in the path or body does not resolve to a TestingSite"
  - id: ERR_CANDIDATE_NOT_FOUND
    http: 404
    condition: "candidate_id in the path or body does not resolve to a Candidate"
  - id: ERR_PROCTOR_NOT_FOUND
    http: 404
    condition: "proctor_id, reported_by_proctor_id or course_instructor_proctor_id does not resolve to a Proctor"
  - id: ERR_ACCESS_CODE_BATCH_NOT_FOUND
    http: 404
    condition: "the batch id in the path or the batch_id filter target does not resolve to an AccessCodeBatch"
  - id: ERR_ACCESS_CODE_NOT_FOUND
    http: 404
    condition: "access_code_id in the path or body does not resolve to an AccessCode"
  - id: ERR_ACCOMMODATION_REQUEST_NOT_FOUND
    http: 404
    condition: "accommodation_request_id in the path or body does not resolve to an AccommodationRequest"
  - id: ERR_EXAM_SESSION_NOT_FOUND
    http: 404
    condition: "exam_session_id in the path or body does not resolve to an ExamSession"
  - id: ERR_SCORE_REPORT_NOT_FOUND
    http: 404
    condition: "score_report_id in the path or body does not resolve to a ScoreReport"
  - id: ERR_SECURITY_INCIDENT_NOT_FOUND
    http: 404
    condition: "the incident id in the path does not resolve to a SecurityIncident"
  - id: ERR_CERTIFICATE_NOT_FOUND
    http: 404
    condition: "certificate_id in the path or body does not resolve to a Certificate"
  - id: ERR_LOCAL_REGISTRATION_NOT_FOUND
    http: 404
    condition: "the registration id in the path does not resolve to a LocalRegistration"
  # --- optimistic concurrency (§1.2.1) ---
  - id: ERR_STALE_BATCH_VERSION
    http: 412
    condition: "expected_batch_version does not equal the current AccessCodeBatch.version on an assignment or void call"
  - id: ERR_STALE_SESSION_VERSION
    http: 412
    condition: "expected_session_version does not equal the current ExamSession.version on a reschedule call"
  # --- state machine guards (§1.2) ---
  - id: ERR_SESSION_STATE_INVALID
    http: 409
    condition: "the ExamSession is not in a session_status/proctoring_status pair from which the requested trigger is declared in §1.2 (e.g. start on a SCHEDULED sitting, check-in on a CHECKED_IN sitting, reschedule of a CANCELLED or INVALIDATED sitting, submission of a sitting that is not IN_PROGRESS, or a security incident reported against a sitting that is neither SUBMITTED nor CLOSED)"
  - id: ERR_ACCESS_CODE_STATE_INVALID
    http: 409
    condition: "the AccessCode is not in the state the trigger requires: assigning an already ASSIGNED/CONSUMED code, scheduling on a code that is not ASSIGNED, or a second course-completion sign-off on a code whose course_completed_at is already set"
  - id: ERR_BATCH_STATE_INVALID
    http: 409
    condition: "the AccessCodeBatch status forbids the trigger: voiding a VOIDED or EXPIRED batch, or assigning from a VOIDED batch"
  - id: ERR_PROCTOR_STATE_INVALID
    http: 409
    condition: "the Proctor registration_status forbids the trigger: a registration-decision on a proctor that is not PENDING, audit-open on a proctor that is not REGISTERED, audit-close on a proctor that is not UNDER_AUDIT, or reinstatement of a proctor that is not SUSPENDED"
  - id: ERR_ACCOMMODATION_STATE_INVALID
    http: 409
    condition: "review-open on an AccommodationRequest that is not REQUESTED, or review on a request that is not UNDER_REVIEW"
  - id: ERR_SCORE_REPORT_STATE_INVALID
    http: 409
    condition: "finalization of a ScoreReport that is already FINAL or VOIDED"
  - id: ERR_INCIDENT_STATE_INVALID
    http: 409
    condition: "review-open on a SecurityIncident that is not OPEN, or resolution of an incident that is not UNDER_REVIEW"
  - id: ERR_CERTIFICATE_STATE_INVALID
    http: 409
    condition: "recert-authorization or local registration filing against a Certificate whose status is REVOKED or SUPERSEDED"
  - id: ERR_REGISTRATION_STATE_INVALID
    http: 409
    condition: "posting-confirmation on a LocalRegistration that is neither FILED nor DELINQUENT, verification on a registration that is not POSTED, or refiling of a registration that is not REJECTED"
  # --- business: eligibility and acceptance ---
  - id: ERR_EXAM_FORM_RETIRED
    http: 409
    condition: "a batch purchase or a new sitting references an ExamForm whose status is RETIRED"
  - id: ERR_CANDIDATE_SECURITY_HOLD
    http: 409
    condition: "the Candidate has security_hold = true and the request assigns a code, schedules a sitting, or issues a certificate"
  - id: ERR_PROCTOR_NOT_REGISTERED
    http: 409
    condition: "the referenced Proctor registration_status is not REGISTERED when it is assigned to a sitting, signs a course completion, or reports an incident"
  - id: ERR_ACCREDITATION_NOT_ACCEPTED
    http: 422
    condition: "the ExamForm.accreditation_body is not in the candidate jurisdiction's accepted_accreditation_bodies, at sitting creation and again at certificate issuance"
  - id: ERR_LANGUAGE_NOT_ACCEPTED
    http: 422
    condition: "the ExamForm.language is not in the candidate jurisdiction's accepted_languages"
  - id: ERR_REMOTE_PROCTORING_NOT_ACCEPTED
    http: 422
    condition: "delivery_mode = REMOTE while the candidate jurisdiction has accepts_remote_proctoring = false"
  - id: ERR_PROCTOR_LANGUAGE_NOT_CERTIFIED
    http: 422
    condition: "the assigned Proctor's languages_certified does not contain the ExamForm.language"
  - id: ERR_PROCTOR_NOT_REMOTE_CERTIFIED
    http: 422
    condition: "a REMOTE sitting is assigned a Proctor whose remote_certified is false"
  - id: ERR_SITE_LANGUAGE_UNSUPPORTED
    http: 422
    condition: "the chosen TestingSite.languages_supported does not contain the ExamForm.language"
  - id: ERR_SITE_REQUIRED_FOR_IN_PERSON
    http: 422
    condition: "delivery_mode = IN_PERSON with no testing_site_id supplied, or delivery_mode = REMOTE with a testing_site_id supplied"
  - id: ERR_SESSION_PROCTOR_UNASSIGNED
    http: 409
    condition: "check-in, start or submission is attempted while proctoring_status is PENDING_ASSIGNMENT or PENDING_REPROCTOR"
  - id: ERR_INSTRUCTOR_NOT_AUTHORIZED
    http: 422
    condition: "the proctor signing a course completion does not hold INSTRUCTOR in roles_held, or belongs to a different TrainingProvider than the code's batch"
  - id: ERR_COURSE_NOT_COMPLETED
    http: 409
    condition: "a sitting is scheduled on a COURSE_PLUS_EXAM access code whose course_completed_at is still null"
  - id: ERR_ACCESS_CODE_CANDIDATE_MISMATCH
    http: 409
    condition: "the access_code_id is assigned to a different candidate than the sitting's candidate_id"
  - id: ERR_ACCESS_CODE_FORM_MISMATCH
    http: 409
    condition: "the access code's batch was purchased for a different ExamForm than the sitting's exam_form_id"
  - id: ERR_ACCOMMODATION_CANDIDATE_MISMATCH
    http: 409
    condition: "the accommodation_request_id belongs to a different candidate than the sitting's candidate_id"
  - id: ERR_DUPLICATE_APPROVED_ACCOMMODATION
    http: 409
    condition: "an accommodation is approved for a candidate who already holds an APPROVED request of the same accommodation_type"
  - id: ERR_DUPLICATE_ACTIVE_CERTIFICATE
    http: 409
    condition: "certificate issuance for a candidate who already holds an ISSUED Certificate in that jurisdiction"
  - id: ERR_LOCAL_REGISTRATION_NOT_REQUIRED
    http: 409
    condition: "a local registration is filed for a certificate whose jurisdiction has requires_local_registration = false"
  # --- business: identity verification and scoring ---
  - id: ERR_ID_DOCUMENT_EXPIRED
    http: 422
    condition: "id_document_expires_on is on or before the logical clock date at check-in"
  - id: ERR_BIOMETRIC_REQUIRED_FOR_REMOTE
    http: 422
    condition: "check-in of a REMOTE sitting omits biometric_match_score"
  - id: ERR_IDENTITY_VERIFICATION_FAILED
    http: 422
    condition: "biometric_match_score < BIOMETRIC_MATCH_MIN (85) at check-in of a REMOTE sitting"
  - id: ERR_VOIDED_ITEM_COUNT_INVALID
    http: 422
    condition: "at finalization voided_item_count > ExamForm.scored_item_count, voided_correct_count > voided_item_count, or voided_correct_count > the report's raw_correct_count"
  - id: ERR_CANDIDATE_DID_NOT_PASS
    http: 422
    condition: "certificate issuance from a FINAL ScoreReport whose pass_flag is false"
  # --- business: temporal and capacity ---
  - id: ERR_SCHEDULE_LEAD_TIME_TOO_SHORT
    http: 422
    condition: "scheduled_start_at is less than SCHEDULE_LEAD_MINUTES (1440) after the logical clock at creation or reschedule"
  - id: ERR_CHECKIN_WINDOW_CLOSED
    http: 409
    condition: "the logical clock is outside the inclusive window [scheduled_start_at - 30 minutes, scheduled_start_at + 15 minutes] at check-in"
  - id: ERR_INCIDENT_WINDOW_CLOSED
    http: 409
    condition: "an incident is reported against an already SUBMITTED or CLOSED sitting more than INCIDENT_FILING_WINDOW_HOURS (72) after its submitted_at"
  - id: ERR_RECERT_WINDOW_NOT_OPEN
    http: 409
    condition: "recert-authorization is requested while the logical clock is strictly before the certificate's recert_window_opens_at"
  - id: ERR_PROCTOR_INTERVAL_CONFLICT
    http: 409
    condition: "the requested sitting interval violates calculations.proctor_interval_conflict against another live sitting of the same proctor, including the case where approving an accommodation lengthens an existing sitting into the buffer of a later one"
  - id: ERR_SITE_SEAT_CAPACITY_EXCEEDED
    http: 409
    condition: "the count of live sittings whose half-open intervals overlap the requested one at that TestingSite is already >= seat_count, per calculations.site_seat_occupancy"
  # --- business: inventory and money ---
  - id: ERR_BATCH_EXPIRED
    http: 409
    condition: "an assignment is requested from a batch whose status is EXPIRED or whose expires_at is on or before the logical clock"
  - id: ERR_BATCH_DEPLETED
    http: 409
    condition: "an assignment finds no AVAILABLE code of the requested bundle_type in the batch (status DEPLETED or no matching unit left)"
  - id: ERR_INSUFFICIENT_CREDIT
    http: 402
    condition: "TrainingProvider.credit_balance_cents is smaller than the amount the request would debit (batch total_price_cents or CERT_ISSUANCE_FEE_CENTS)"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "accrediting-body operations staff: publishes jurisdictions, forms and sites, adjudicates proctor registrations and audits, reviews accommodations, finalizes and releases scores, issues certificates and resolves security incidents. Segregation of duties applies: the X-User-ID that finalized a score report may not resolve a security incident on that sitting."
    identity: "opaque"
    exclusive_operations:
      - "POST /jurisdictions"
      - "GET /jurisdictions/{id}"
      - "POST /training-providers"
      - "GET /training-providers"
      - "POST /training-providers/{id}/credit-adjustments"
      - "POST /exam-forms"
      - "POST /exam-forms/{id}/retire"
      - "POST /testing-sites"
      - "POST /proctors/{id}/registration-decision"
      - "POST /proctors/{id}/audit-open"
      - "POST /proctors/{id}/audit-close"
      - "POST /proctors/{id}/reinstatement"
      - "POST /accommodation-requests/{id}/review-open"
      - "POST /accommodation-requests/{id}/review"
      - "POST /score-reports/{id}/finalization"
      - "POST /certificates"
      - "POST /certificates/{id}/recert-authorization"
      - "POST /security-incidents/{id}/review-open"
      - "POST /security-incidents/{id}/resolution"
      - "POST /compliance-runs"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET /training-providers/{id}"
      - "GET /exam-forms/{id}"
      - "GET /exam-forms"
      - "GET /testing-sites/{id}"
      - "GET /testing-sites"
      - "GET /candidates/{id}"
      - "GET /candidates"
      - "GET /candidates/{id}/compliance-summary"
      - "GET /proctors/{id}"
      - "GET /proctors"
      - "GET /access-code-batches/{id}"
      - "GET /access-code-batches"
      - "GET /access-codes/{id}"
      - "GET /access-codes"
      - "GET /accommodation-requests/{id}"
      - "GET /accommodation-requests"
      - "GET /exam-sessions/{id}"
      - "GET /exam-sessions"
      - "GET /score-reports/{id}"
      - "GET /score-reports"
      - "GET /certificates/{id}"
      - "GET /certificates"
      - "GET /local-registrations/{id}"
      - "GET /local-registrations"
      - "GET /security-incidents/{id}"
      - "GET /security-incidents"
  - name: ProviderAdmin
    description: "training-provider staff (X-User-ID is the TrainingProvider id): enrolls candidates, registers its proctors, purchases and voids access-code batches, assigns codes, signs course completions, schedules and reschedules sittings, and files local registrations. Every write is scoped to resources whose provider chain resolves to this X-User-ID (ERR_FORBIDDEN_RESOURCE_SCOPE otherwise)."
    identity: "entity_backed:TrainingProvider"
    exclusive_operations:
      - "POST /candidates"
      - "POST /proctors"
      - "POST /access-code-batches"
      - "POST /access-code-batches/{id}/assignments"
      - "POST /access-code-batches/{id}/void"
      - "POST /access-codes/{id}/course-completion"
      - "POST /exam-sessions"
      - "POST /exam-sessions/{id}/reschedule"
      - "POST /exam-sessions/{id}/proctor-assignment"
      - "POST /exam-sessions/{id}/cancellation"
      - "POST /local-registrations"
      - "POST /local-registrations/{id}/posting-confirmation"
      - "POST /local-registrations/{id}/refiling"
    shared_operations:
      - "GET /jurisdictions/{id}"
      - "GET /training-providers/{id}"
      - "GET /exam-forms/{id}"
      - "GET /exam-forms"
      - "GET /testing-sites/{id}"
      - "GET /testing-sites"
      - "GET /candidates/{id}"
      - "GET /candidates"
      - "GET /candidates/{id}/compliance-summary"
      - "GET /proctors/{id}"
      - "GET /proctors"
      - "GET /access-code-batches/{id}"
      - "GET /access-code-batches"
      - "GET /access-codes/{id}"
      - "GET /access-codes"
      - "POST /accommodation-requests"
      - "GET /accommodation-requests/{id}"
      - "GET /accommodation-requests"
      - "GET /exam-sessions/{id}"
      - "GET /exam-sessions"
      - "GET /score-reports/{id}"
      - "GET /score-reports"
      - "GET /certificates/{id}"
      - "GET /certificates"
      - "GET /local-registrations/{id}"
      - "GET /local-registrations"
      - "GET /security-incidents/{id}"
      - "GET /security-incidents"
  - name: Proctor
    description: "registered proctor or instructor (X-User-ID is the Proctor id): performs identity verification, releases and submits the exam, and reports security incidents. Writes are limited to sittings whose proctor_id equals this X-User-ID."
    identity: "entity_backed:Proctor"
    exclusive_operations:
      - "POST /exam-sessions/{id}/check-in"
      - "POST /exam-sessions/{id}/start"
      - "POST /exam-sessions/{id}/submission"
      - "POST /security-incidents"
    shared_operations:
      - "GET /exam-forms/{id}"
      - "GET /proctors/{id}"
      - "GET /exam-sessions/{id}"
      - "GET /exam-sessions"
      - "GET /security-incidents/{id}"
      - "GET /security-incidents"
  - name: Candidate
    description: "exam candidate (X-User-ID is the Candidate id): requests accommodations and reads only its own code, sittings, scores and certificates."
    identity: "entity_backed:Candidate"
    exclusive_operations: []
    shared_operations:
      - "POST /accommodation-requests"
      - "GET /accommodation-requests/{id}"
      - "GET /candidates/{id}"
      - "GET /candidates/{id}/compliance-summary"
      - "GET /access-codes/{id}"
      - "GET /exam-sessions/{id}"
      - "GET /score-reports/{id}"
      - "GET /certificates/{id}"
  - name: HealthOfficer
    description: "local health-department officer (X-User-ID is the Jurisdiction id): verifies or rejects posted certificate registrations inside its own jurisdiction and reads the certificates and compliance summaries it accepts."
    identity: "entity_backed:Jurisdiction"
    exclusive_operations:
      - "POST /local-registrations/{id}/verification"
    shared_operations:
      - "GET /jurisdictions/{id}"
      - "GET /candidates/{id}/compliance-summary"
      - "GET /certificates/{id}"
      - "GET /certificates"
      - "GET /local-registrations/{id}"
      - "GET /local-registrations"
