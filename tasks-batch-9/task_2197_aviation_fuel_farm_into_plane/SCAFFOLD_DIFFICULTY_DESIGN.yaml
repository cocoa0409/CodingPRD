            - call: "POST /fuel-farms/${farm_id}/environmental-permits"
              payload: { permit_number: "P-2026-001", valid_from_utc: "2026-01-01T00:00:00Z", valid_until_utc: "2027-01-01T00:00:00Z", max_daily_throughput_liters: 33000.0, max_reportable_spill_liters: 20.0 }
              as: ConsortiumAdmin
              captures: { permit_id: $.data.id }
            - call: "POST /fuel-farms/${farm_id}/fueling-assets"
              payload: { asset_code: "TRK1", asset_type: "TRUCK", tank_capacity_liters: 40000.0, turnaround_buffer_minutes: 15, differential_pressure_kpa: 10.0 }
              as: ConsortiumAdmin
              captures: { truck_id: $.data.id }
            - call: "POST /fuel-farms/${farm_id}/storage-tanks"
              payload: { tank_code: "T1", capacity_liters: 5000000.0, safe_fill_liters: 4000000.0, density_kg_per_m3: 795.0, opening_volume_liters: 0.0 }
              as: ConsortiumAdmin
              captures: { tank_id: $.data.id }
            - call: "POST /storage-tanks/${tank_id}/samples"
              payload: { sample_purpose: "PERIODIC_TANK_QA" }
              as: QualityInspector
              as_user_id: "qi-alice"
              captures: { qa_sample_id: $.data.id }
            - call: "POST /quality-samples/${qa_sample_id}/test-results"
              payload: { water_reaction_rating: 1, particulate_mg_per_l: 0.5, conductivity_ps_per_m: 120.0, observed_density_kg_per_m3: 795.0, flash_point_c: 42.0 }
              as: QualityInspector
              as_user_id: "qi-alice"
            - call: "POST /storage-tanks/${tank_id}/quality-release"
              payload: {}
              as: QualityInspector
              as_user_id: "qi-bob"
            - call: "POST /fuel-receipts"
              payload: { storage_tank_id: "${tank_id}", delivery_mode: "PIPELINE", supplier_name: "Refinery One", meter_ticket_number: "MT-7001", meter_ticket_gross_liters: 29800.0, tank_opening_gauge_liters: 0.0, tank_closing_gauge_liters: 29700.0, temperature_c: 15.0, certificate_density_kg_per_m3: 795.0, measured_water_liters: 0.0 }
              as: FarmOperator
              captures: { receipt_id: $.data.id }
            - call: "POST /fuel-receipts/${receipt_id}/samples"
              payload: {}
              as: QualityInspector
              as_user_id: "qi-alice"
              captures: { rs_id: $.data.id }
            - call: "POST /quality-samples/${rs_id}/test-results"
              payload: { water_reaction_rating: 1, particulate_mg_per_l: 0.4, conductivity_ps_per_m: 150.0, observed_density_kg_per_m3: 795.0, flash_point_c: 41.0 }
              as: QualityInspector
              as_user_id: "qi-alice"
          trigger:
            - call: "POST /fuel-receipts/${receipt_id}/verdict"
              payload: { decision: "RELEASE" }
              as: QualityInspector
              as_user_id: "qi-bob"
          assert:
            - "before the trigger FuelFarm.${farm_id}.posture == OPEN and active_permit_throughput_used_liters == 0.00"
            - "FuelReceipt.${receipt_id}.net_volume_liters == 29700.00"
            - "FuelReceipt.${receipt_id}.status == RELEASED and released_at_utc == 2026-08-10T06:00:00Z"
            - "FuelFarm.${farm_id}.active_permit_throughput_used_liters == 29700.00"
            - "FuelFarm.${farm_id}.posture == RESTRICTED (29700.00 >= 0.90 * 33000.0 == 29700.00)"
            - "StorageTank.${tank_id}.book_volume_liters == 29700.00 and available_volume_liters == 29200.00"
            - "a net of 29699.99 would have left posture OPEN, so OPEN must NOT appear here"

      - name: reconciliation_variance_exactly_at_tolerance_posts_without_override
        grounds:
          - calculations.reconciliation_gain_loss
          - state_machines.ReconciliationRun.MEASURED_to_VARIANCE_HOLD
          - state_machines.ReconciliationRun.MEASURED_to_POSTED
          - validations.priority_39
        boundary_kind: "strict > guard on a rounded percentage, exercised at the exact tolerance"
        distinguishing_aspect: |
          The measured volume 1009449.83 makes variance_liters exactly -248.49 against a throughput of
          49698.32, so variance_pct_throughput_basis rounds to exactly 0.5000. The VARIANCE_HOLD guard is
          abs(pct) > 0.50, so the run must stay MEASURED and post without any variance_override_reason. One
          extra hundredth of a liter of loss (measured 1009449.82) pushes the run into VARIANCE_HOLD and makes
          the same post call fail with ERR_VARIANCE_OVERRIDE_REQUIRED.
        test_recipe:
          setup:
