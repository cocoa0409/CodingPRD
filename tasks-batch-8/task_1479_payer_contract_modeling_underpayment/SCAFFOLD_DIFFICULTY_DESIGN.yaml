# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN.yaml — Payer Contract Modeling & Underpayment
# §1.8 Test Targeting Index: 9 Difficulty Rules x 2 instances = 18 instances.
# Every ground resolves into SCAFFOLD.yaml §1.1–§1.7; every test_recipe chain
# uses only §1.5 endpoints. Clock default at startup: 2026-08-01T00:00:00Z.
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  # Rule 1 — dual_variant_calc: two dual-variant calculations on DIFFERENT
  # entity domains (Claim pricing vs ContractProposal revenue modeling).
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: prospective_vs_retrospective_repricing_diverges
        grounds:
          - calculations.expected_reimbursement
          - calculations.amendment_rate_resolution
          - state_machines.Claim.PRICED_to_REPRICED
          - entities.Claim.fields.original_expected_cents
          - entities.Claim.fields.expected_reimbursement_cents
        distinguishing_aspect: |
          Claim-domain dual variant: identical claim data priced PROSPECTIVE at
          200000 cents freezes original_expected_cents; a RETROSPECTIVE reprice
          after an EFFECTIVE amendment reprices the same untouched claim to
          240000 cents while original_expected_cents stays 200000.
        test_recipe:
          setup:
            - "Payer P ACTIVE; contract C (2026-01-01..2026-12-31) ACTIVE with PER_DIEM term INPATIENT_MEDICAL base_rate_cents=100000"
            - "Claim CL-DV1 admission 2026-06-01 discharge 2026-06-03 (2 per-diem nights), one line; priced PROSPECTIVE -> expected 200000, original 200000"
            - "RateAmendment (base_rate_cents override 120000, effective 2026-06-01, NO retroactive_to_date) APPROVED then swept to EFFECTIVE"
          setup_api_calls:
            - call: "POST /api/payers"
              payload: { name: "Payer DV", payer_type: "COMMERCIAL", appeal_deadline_days: 45 }
              as: ContractManager
              captures: { payer_id: $.data.id }
            - call: "POST /api/payer-contracts"
              payload: { payer_id: "${payer_id}", contract_code: "DV-2026", effective_date: "2026-01-01", expiration_date: "2026-12-31" }
              as: ContractAnalyst
              captures: { contract_id: $.data.id }
            - call: "POST /api/contract-terms"
              payload: { contract_id: "${contract_id}", service_category: "INPATIENT_MEDICAL", rate_model: "PER_DIEM", base_rate_cents: 100000 }
              as: ContractAnalyst
            - call: "POST /api/payer-contracts/${contract_id}/activate"
              as: ContractManager
              captures: { cv: $.data.version }
            - call: "POST /api/claims"
              payload: { payer_id: "${payer_id}", claim_number: "CL-DV1", patient_account_number: "PA-DV1", service_category: "INPATIENT_MEDICAL", admission_date: "2026-06-01", discharge_date: "2026-06-03", total_billed_charges_cents: 500000 }
              as: RevenueIntegrityAnalyst
              captures: { claim_id: $.data.id }
            - call: "POST /api/claims/${claim_id}/lines"
              payload: { revenue_code: "0100", service_date: "2026-06-01", charge_cents: 250000, units: 1 }
              as: RevenueIntegrityAnalyst
            - call: "POST /api/claims/${claim_id}/price"
              as: RevenueIntegrityAnalyst
            - call: "POST /api/rate-amendments"
              payload: { contract_id: "${contract_id}", effective_date: "2026-06-01", term_overrides: [ { service_category: "INPATIENT_MEDICAL", base_rate_cents: 120000 } ], expected_contract_version: "${cv}" }
              as: ContractAnalyst
              as_user_id: "ca-1"
              captures: { amendment_id: $.data.id }
            - call: "POST /api/rate-amendments/${amendment_id}/approve"
              as: ContractManager
              as_user_id: "cm-2"
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T00:00:00Z" }
              as: SystemAdmin
          trigger:
            - call: "POST /api/claims/${claim_id}/reprice"
              as: RevenueIntegrityAnalyst
            - call: "GET /api/claims/${claim_id}"
              as: RevenueIntegrityAnalyst
              captures: { exp_now: $.data.expected_reimbursement_cents, orig: $.data.original_expected_cents, variant: $.data.pricing_variant }
          assert:
            - "Claim.${claim_id}.original_expected_cents == 200000 (2 nights x 100000, frozen PROSPECTIVE snapshot)"
            - "Claim.${claim_id}.expected_reimbursement_cents == 240000 (2 nights x 120000 amended rate)"
            - "Claim.${claim_id}.pricing_variant == RETROSPECTIVE"
            - "Claim.${claim_id}.pricing_status == REPRICED"
            - "${orig} != ${exp_now} — identical claim data, two variants, different results"

      - name: proposal_same_store_vs_mix_shifted_diverge
        grounds:
          - calculations.proposal_volume_modeling
          - state_machines.ContractProposal.DRAFT_to_MODELED
          - entities.ContractProposal.fields.delta_same_store_cents
          - entities.ContractProposal.fields.delta_mix_shifted_cents
        distinguishing_aspect: |
          Proposal-domain dual variant (different entity domain from claim
          pricing): on identical inputs, SAME_STORE holds volume at trailing
          actuals (delta 50000) while MIX_SHIFTED applies the projected mix of
          4 units (delta 200000) — the two stored deltas differ by exactly the
          volume-mix effect.
        test_recipe:
          setup:
            - "Payer P ACTIVE; contract C ACTIVE with CASE_RATE term OUTPATIENT_SURGERY base_rate_cents=500000"
            - "One trailing claim (discharge 2026-06-03, inside W=[today-364, today]) priced under C -> T[OUTPATIENT_SURGERY] = 1 case"
            - "Proposal: proposed rate 550000 for OUTPATIENT_SURGERY; projected_volume_mix 4 units"
          setup_api_calls:
            - call: "POST /api/payers"
              payload: { name: "Payer PM", payer_type: "COMMERCIAL", appeal_deadline_days: 45 }
              as: ContractManager
              captures: { payer_id: $.data.id }
            - call: "POST /api/payer-contracts"
              payload: { payer_id: "${payer_id}", contract_code: "PM-2026", effective_date: "2026-01-01", expiration_date: "2026-12-31" }
              as: ContractAnalyst
              captures: { contract_id: $.data.id }
            - call: "POST /api/contract-terms"
              payload: { contract_id: "${contract_id}", service_category: "OUTPATIENT_SURGERY", rate_model: "CASE_RATE", base_rate_cents: 500000 }
              as: ContractAnalyst
            - call: "POST /api/payer-contracts/${contract_id}/activate"
              as: ContractManager
              captures: { cv: $.data.version }
            - call: "POST /api/claims"
              payload: { payer_id: "${payer_id}", claim_number: "CL-PM1", patient_account_number: "PA-PM1", service_category: "OUTPATIENT_SURGERY", admission_date: "2026-06-03", discharge_date: "2026-06-03", total_billed_charges_cents: 700000 }
              as: RevenueIntegrityAnalyst
              captures: { claim_id: $.data.id }
            - call: "POST /api/claims/${claim_id}/lines"
              payload: { revenue_code: "0360", service_date: "2026-06-03", charge_cents: 700000, units: 1 }
              as: RevenueIntegrityAnalyst
            - call: "POST /api/claims/${claim_id}/price"
              as: RevenueIntegrityAnalyst
            - call: "POST /api/contract-proposals"
              payload: { contract_id: "${contract_id}", proposed_terms: [ { service_category: "OUTPATIENT_SURGERY", rate_model: "CASE_RATE", base_rate_cents: 550000 } ], projected_volume_mix: [ { service_category: "OUTPATIENT_SURGERY", annual_units: 4 } ], expected_contract_version: "${cv}" }
              as: ContractAnalyst
              captures: { proposal_id: $.data.id }
          trigger:
            - call: "POST /api/contract-proposals/${proposal_id}/run_model"
              as: ContractAnalyst
              captures: { bss: $.data.baseline_same_store_cents, dss: $.data.delta_same_store_cents, bms: $.data.baseline_mix_shifted_cents, dms: $.data.delta_mix_shifted_cents }
          assert:
            - "ContractProposal.${proposal_id}.baseline_same_store_cents == 500000 (1 trailing case x 500000)"
            - "ContractProposal.${proposal_id}.delta_same_store_cents == 50000 (1 x (550000-500000))"
            - "ContractProposal.${proposal_id}.baseline_mix_shifted_cents == 2000000 (4 projected x 500000)"
            - "ContractProposal.${proposal_id}.delta_mix_shifted_cents == 200000 (4 x (550000-500000))"
            - "${dss} != ${dms} — same inputs, two variants, different deltas"
            - "ContractProposal.${proposal_id}.status == MODELED"

  # ---------------------------------------------------------------------------
  # Rule 2 — combinatorial_formula: instance A in mode (b) nested rounding,
  # instance B in mode (a) >=3 inputs with non-linear interaction. Different
  # modes as §0.5 requires.
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: percent_of_charge_round_per_line_then_sum
        grounds:
          - calculations.base_expected_amount
          - entities.ClaimLine.fields.priced_amount_cents
        distinguishing_aspect: |
          Mode (b) nested rounding: PERCENT_OF_CHARGE at 5000 bp over three
          1-cent lines pins round-per-line-THEN-sum -> 3 x round_half_up(0.5) =
          3 cents; the forbidden sum-then-round order would give
          round_half_up(1.5) = 2 cents, so the rounding order is observable.
        test_recipe:
          setup:
            - "Payer P; contract C ACTIVE with PERCENT_OF_CHARGE term LAB percent_of_charge_bp=5000"
            - "Claim CL-RC1 service_category LAB with exactly three lines of charge_cents=1 each; total_billed 3"
          setup_api_calls:
            - call: "POST /api/payers"
              payload: { name: "Payer RC", payer_type: "COMMERCIAL", appeal_deadline_days: 45 }
              as: ContractManager
              captures: { payer_id: $.data.id }
            - call: "POST /api/payer-contracts"
              payload: { payer_id: "${payer_id}", contract_code: "RC-2026", effective_date: "2026-01-01", expiration_date: "2026-12-31" }
              as: ContractAnalyst
              captures: { contract_id: $.data.id }
            - call: "POST /api/contract-terms"
              payload: { contract_id: "${contract_id}", service_category: "LAB", rate_model: "PERCENT_OF_CHARGE", percent_of_charge_bp: 5000 }
              as: ContractAnalyst
            - call: "POST /api/payer-contracts/${contract_id}/activate"
              as: ContractManager
            - call: "POST /api/claims"
              payload: { payer_id: "${payer_id}", claim_number: "CL-RC1", patient_account_number: "PA-RC1", service_category: "LAB", admission_date: "2026-06-01", discharge_date: "2026-06-01", total_billed_charges_cents: 3 }
              as: RevenueIntegrityAnalyst
              captures: { claim_id: $.data.id }
            - call: "POST /api/claims/${claim_id}/lines"
              payload: { revenue_code: "0300", service_date: "2026-06-01", charge_cents: 1, units: 1 }
              as: RevenueIntegrityAnalyst
            - call: "POST /api/claims/${claim_id}/lines"
              payload: { revenue_code: "0301", service_date: "2026-06-01", charge_cents: 1, units: 1 }
              as: RevenueIntegrityAnalyst
            - call: "POST /api/claims/${claim_id}/lines"
              payload: { revenue_code: "0302", service_date: "2026-06-01", charge_cents: 1, units: 1 }
              as: RevenueIntegrityAnalyst
          trigger:
            - call: "POST /api/claims/${claim_id}/price"
              as: RevenueIntegrityAnalyst
              captures: { exp: $.data.expected_reimbursement_cents }
            - call: "GET /api/claims/${claim_id}/lines"
              as: RevenueIntegrityAnalyst
          assert:
            - "Claim.${claim_id}.expected_reimbursement_cents == 3 (per-line round_half_up(1 x 0.5)=1, summed)"
            - "every ClaimLine of ${claim_id} has priced_amount_cents == 1"
            - "${exp} != 2 — the sum-then-round order is explicitly rejected"

      - name: stop_loss_outlier_overlay_max_floor_interaction
        grounds:
          - calculations.stop_loss_outlier_overlay
          - calculations.base_expected_amount
          - entities.Claim.fields.pricing_trace
        distinguishing_aspect: |
          Mode (a) >=3 inputs with non-linear interaction: CASE_RATE base
          (100000) + conditional OUTLIER branch (2000000 over 500000 threshold
          at 8000bp) + STOP_LOSS floor (2700000 = 3000000 x 9000bp) combined
          through the pinned order outlier -> subtotal -> max(subtotal,
          stop_loss) yields 2700000; dropping any one input or reordering the
          max() changes the result.
        test_recipe:
          setup:
            - "Payer P; contract C ACTIVE with CASE_RATE term EMERGENCY base_rate_cents=100000"
            - "C carries OUTLIER provision (wildcard category, threshold 500000, rate 8000bp) and STOP_LOSS provision (wildcard, threshold 1000000, rate 9000bp)"
            - "Claim CL-SL1 EMERGENCY with total_billed_charges_cents=3000000, one line 3000000"
          setup_api_calls:
            - call: "POST /api/payers"
              payload: { name: "Payer SL", payer_type: "COMMERCIAL", appeal_deadline_days: 45 }
              as: ContractManager
              captures: { payer_id: $.data.id }
            - call: "POST /api/payer-contracts"
              payload: { payer_id: "${payer_id}", contract_code: "SL-2026", effective_date: "2026-01-01", expiration_date: "2026-12-31" }
              as: ContractAnalyst
              captures: { contract_id: $.data.id }
            - call: "POST /api/contract-terms"
              payload: { contract_id: "${contract_id}", service_category: "EMERGENCY", rate_model: "CASE_RATE", base_rate_cents: 100000 }
              as: ContractAnalyst
            - call: "POST /api/stop-loss-provisions"
              payload: { contract_id: "${contract_id}", provision_type: "OUTLIER", threshold_cents: 500000, rate_bp: 8000 }
              as: ContractAnalyst
            - call: "POST /api/stop-loss-provisions"
              payload: { contract_id: "${contract_id}", provision_type: "STOP_LOSS", threshold_cents: 1000000, rate_bp: 9000 }
              as: ContractAnalyst
            - call: "POST /api/payer-contracts/${contract_id}/activate"
              as: ContractManager
            - call: "POST /api/claims"
              payload: { payer_id: "${payer_id}", claim_number: "CL-SL1", patient_account_number: "PA-SL1", service_category: "EMERGENCY", admission_date: "2026-06-10", discharge_date: "2026-06-10", total_billed_charges_cents: 3000000 }
              as: RevenueIntegrityAnalyst
              captures: { claim_id: $.data.id }
            - call: "POST /api/claims/${claim_id}/lines"
              payload: { revenue_code: "0450", service_date: "2026-06-10", charge_cents: 3000000, units: 1 }
              as: RevenueIntegrityAnalyst
          trigger:
            - call: "POST /api/claims/${claim_id}/price"
              as: RevenueIntegrityAnalyst
              captures: { exp: $.data.expected_reimbursement_cents }
          assert:
            - "Claim.${claim_id}.pricing_trace.outlier_cents == 2000000 (round_half_up((3000000-500000) x 0.8))"
            - "Claim.${claim_id}.pricing_trace.stop_loss_cents == 2700000 (round_half_up(3000000 x 0.9))"
            - "Claim.${claim_id}.expected_reimbursement_cents == 2700000 (max(100000+0+2000000, 2700000) — the floor wins)"
            - "Claim.${claim_id}.pricing_trace.final_expected_cents == 2700000"

  # ---------------------------------------------------------------------------
  # Rule 3 — non_linear_state_machine on different entities:
  # Claim (parallel dimensions) and ContractProposal (SUBMITTED<->COUNTERED
  # cycle).
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: claim_parallel_dimensions_evolve_independently
        grounds:
          - state_machines.Claim.UNPRICED_to_PRICED
          - state_machines.Claim.AWAITING_REMITTANCE_to_REMITTANCE_POSTED
          - state_machines.Claim.REMITTANCE_POSTED_to_VARIANCE_FLAGGED
          - state_machines.Claim.PRICED_to_REPRICED
          - entities.Claim.fields.pricing_status
          - entities.Claim.fields.remittance_status
        distinguishing_aspect: |
          Claim carries two independent state dimensions on one row: pricing
          moves UNPRICED->PRICED->REPRICED while remittance moves
          AWAITING_REMITTANCE->VARIANCE_FLAGGED; each dimension's transitions
          leave the other dimension's value untouched.
        test_recipe:
          setup:
            - "Payer P; contract C ACTIVE PER_DIEM INPATIENT_MEDICAL 100000/day (default thresholds 5000c/100bp)"
            - "Claim CL-PD1 admission 2026-06-01 discharge 2026-06-03, one line; expected 200000"
          setup_api_calls:
            - call: "POST /api/payers"
              payload: { name: "Payer PD", payer_type: "COMMERCIAL", appeal_deadline_days: 45 }
              as: ContractManager
              captures: { payer_id: $.data.id }
            - call: "POST /api/payer-contracts"
              payload: { payer_id: "${payer_id}", contract_code: "PD-2026", effective_date: "2026-01-01", expiration_date: "2026-12-31" }
              as: ContractAnalyst
              captures: { contract_id: $.data.id }
            - call: "POST /api/contract-terms"
              payload: { contract_id: "${contract_id}", service_category: "INPATIENT_MEDICAL", rate_model: "PER_DIEM", base_rate_cents: 100000 }
              as: ContractAnalyst
            - call: "POST /api/payer-contracts/${contract_id}/activate"
              as: ContractManager
            - call: "POST /api/claims"
              payload: { payer_id: "${payer_id}", claim_number: "CL-PD1", patient_account_number: "PA-PD1", service_category: "INPATIENT_MEDICAL", admission_date: "2026-06-01", discharge_date: "2026-06-03", total_billed_charges_cents: 500000 }
              as: RevenueIntegrityAnalyst
              captures: { claim_id: $.data.id }
            - call: "POST /api/claims/${claim_id}/lines"
              payload: { revenue_code: "0100", service_date: "2026-06-01", charge_cents: 250000, units: 1 }
              as: RevenueIntegrityAnalyst
          trigger:
            - call: "POST /api/claims/${claim_id}/price"
              as: RevenueIntegrityAnalyst
              captures: { ps1: $.data.pricing_status, rs1: $.data.remittance_status }
            - call: "POST /api/remittances"
              payload: { claim_id: "${claim_id}", paid_amount_cents: 100000, remittance_date: "2026-08-01" }
              as: RevenueIntegrityAnalyst
            - call: "GET /api/claims/${claim_id}"
              as: RevenueIntegrityAnalyst
              captures: { ps2: $.data.pricing_status, rs2: $.data.remittance_status }
            - call: "POST /api/claims/${claim_id}/reprice"
              as: RevenueIntegrityAnalyst
              captures: { ps3: $.data.pricing_status, rs3: $.data.remittance_status }
          assert:
            - "after price: pricing_status == PRICED and remittance_status == AWAITING_REMITTANCE (${ps1}/${rs1})"
            - "after remittance: pricing_status == PRICED (unchanged) and remittance_status == VARIANCE_FLAGGED (variance 100000 >= 5000) (${ps2}/${rs2})"
            - "after reprice: pricing_status == REPRICED and remittance_status == VARIANCE_FLAGGED (unchanged, variance still 100000) (${ps3}/${rs3})"

      - name: proposal_countered_resubmit_cycle_increments_round
        grounds:
          - state_machines.ContractProposal.SUBMITTED_to_COUNTERED
          - state_machines.ContractProposal.COUNTERED_to_SUBMITTED
          - entities.ContractProposal.fields.round_number
        distinguishing_aspect: |
          ContractProposal cycles SUBMITTED->COUNTERED->SUBMITTED (a
          negotiation loop, not a pipeline); the loop is observable because the
          second submit increments round_number from 1 to 2.
        test_recipe:
          setup:
            - "Payer P; contract C ACTIVE with CASE_RATE term OUTPATIENT_SURGERY 500000"
            - "Proposal on C: proposed 550000, projected mix 2 units"
          setup_api_calls:
            - call: "POST /api/payers"
              payload: { name: "Payer NG", payer_type: "COMMERCIAL", appeal_deadline_days: 45 }
              as: ContractManager
              captures: { payer_id: $.data.id }
            - call: "POST /api/payer-contracts"
              payload: { payer_id: "${payer_id}", contract_code: "NG-2026", effective_date: "2026-01-01", expiration_date: "2026-12-31" }
              as: ContractAnalyst
              captures: { contract_id: $.data.id }
            - call: "POST /api/contract-terms"
              payload: { contract_id: "${contract_id}", service_category: "OUTPATIENT_SURGERY", rate_model: "CASE_RATE", base_rate_cents: 500000 }
              as: ContractAnalyst
            - call: "POST /api/payer-contracts/${contract_id}/activate"
              as: ContractManager
              captures: { cv: $.data.version }
            - call: "POST /api/contract-proposals"
              payload: { contract_id: "${contract_id}", proposed_terms: [ { service_category: "OUTPATIENT_SURGERY", rate_model: "CASE_RATE", base_rate_cents: 550000 } ], projected_volume_mix: [ { service_category: "OUTPATIENT_SURGERY", annual_units: 2 } ], expected_contract_version: "${cv}" }
              as: ContractAnalyst
              captures: { proposal_id: $.data.id }
            - call: "POST /api/contract-proposals/${proposal_id}/run_model"
              as: ContractAnalyst
          trigger:
            - call: "POST /api/contract-proposals/${proposal_id}/submit"
              as: ContractManager
              captures: { st1: $.data.status, rn1: $.data.round_number }
            - call: "POST /api/contract-proposals/${proposal_id}/record_counter"
              as: ContractManager
              captures: { st2: $.data.status }
            - call: "POST /api/contract-proposals/${proposal_id}/submit"
              as: ContractManager
              captures: { st3: $.data.status, rn3: $.data.round_number }
          assert:
            - "first submit: status == SUBMITTED and round_number == 1 (${st1}/${rn1})"
            - "record_counter: status == COUNTERED (${st2})"
            - "resubmit after counter: status == SUBMITTED and round_number == 2 (${st3}/${rn3}) — the cycle is allowed and counted"

  # ---------------------------------------------------------------------------
  # Rule 4 — transitive_cascade: depth-3 amendment cascade vs depth-3
  # escalator-void cascade; different triggering transitions.
  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: amendment_effective_reprice_case_restate_cascade
        grounds:
          - state_machines.RateAmendment.APPROVED_to_EFFECTIVE
          - calculations.expected_reimbursement
          - calculations.variance_and_queue_threshold
          - calculations.case_outstanding_recompute
        distinguishing_aspect: |
          Depth-3 cascade triggered by the clock sweep applying a retroactive
          amendment: (1) claim repriced RETROSPECTIVE 200000->240000, (2)
          variance recomputed 50000->90000, (3) the active UnderpaymentCase is
          restated to original_variance 90000 — each link caused by the
          previous one, not by the sweep directly.
        test_recipe:
          setup:
            - "Payer P; contract C ACTIVE PER_DIEM 100000/day (thresholds 5000c/100bp)"
            - "Claim CL-TC1 (2026-06-01..2026-06-03) priced at 200000; remittance 150000 posted -> variance 50000 >= 5000 -> QUEUED case with original_variance 50000"
            - "Retroactive amendment (120000/day, effective 2026-06-01, retroactive_to_date 2026-06-01) APPROVED"
          setup_api_calls:
            - call: "POST /api/payers"
              payload: { name: "Payer TC", payer_type: "COMMERCIAL", appeal_deadline_days: 45 }
              as: ContractManager
              captures: { payer_id: $.data.id }
            - call: "POST /api/payer-contracts"
              payload: { payer_id: "${payer_id}", contract_code: "TC-2026", effective_date: "2026-01-01", expiration_date: "2026-12-31" }
              as: ContractAnalyst
              captures: { contract_id: $.data.id }
            - call: "POST /api/contract-terms"
              payload: { contract_id: "${contract_id}", service_category: "INPATIENT_MEDICAL", rate_model: "PER_DIEM", base_rate_cents: 100000 }
              as: ContractAnalyst
            - call: "POST /api/payer-contracts/${contract_id}/activate"
              as: ContractManager
              captures: { cv: $.data.version }
            - call: "POST /api/claims"
              payload: { payer_id: "${payer_id}", claim_number: "CL-TC1", patient_account_number: "PA-TC1", service_category: "INPATIENT_MEDICAL", admission_date: "2026-06-01", discharge_date: "2026-06-03", total_billed_charges_cents: 500000 }
              as: RevenueIntegrityAnalyst
              captures: { claim_id: $.data.id }
            - call: "POST /api/claims/${claim_id}/lines"
              payload: { revenue_code: "0100", service_date: "2026-06-01", charge_cents: 250000, units: 1 }
              as: RevenueIntegrityAnalyst
            - call: "POST /api/claims/${claim_id}/price"
              as: RevenueIntegrityAnalyst
            - call: "POST /api/remittances"
              payload: { claim_id: "${claim_id}", paid_amount_cents: 150000, remittance_date: "2026-08-01" }
              as: RevenueIntegrityAnalyst
            - call: "GET /api/underpayment-cases"
              payload: { claim_id: "${claim_id}" }
              as: RevenueIntegrityAnalyst
              captures: { case_id: "$.data[0].id" }
            - call: "POST /api/rate-amendments"
              payload: { contract_id: "${contract_id}", effective_date: "2026-06-01", retroactive_to_date: "2026-06-01", term_overrides: [ { service_category: "INPATIENT_MEDICAL", base_rate_cents: 120000 } ], expected_contract_version: "${cv}" }
              as: ContractAnalyst
              as_user_id: "ca-1"
              captures: { amendment_id: $.data.id }
            - call: "POST /api/rate-amendments/${amendment_id}/approve"
              as: ContractManager
              as_user_id: "cm-2"
          trigger:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T00:00:00Z" }
              as: SystemAdmin
              captures: { applied: $.data.amendments_applied }
            - call: "GET /api/claims/${claim_id}"
              as: RevenueIntegrityAnalyst
            - call: "GET /api/underpayment-cases/${case_id}"
              as: RevenueIntegrityAnalyst
          assert:
            - "clock sweep applied the amendment (${applied} == 1) — link 0 (trigger)"
            - "Claim.${claim_id}.expected_reimbursement_cents == 240000 and pricing_status == REPRICED — link 1 (cascade reprice)"
            - "Claim.${claim_id}.variance_cents == 90000 (240000 - 150000) — link 2 (variance recompute)"
            - "UnderpaymentCase.${case_id}.original_variance_cents == 90000 and current_outstanding_cents == 90000 — link 3 (case restatement)"
            - "UnderpaymentCase.${case_id}.status == QUEUED (restated, never auto-closed)"

      - name: escalator_void_reprice_case_restate_cascade
        grounds:
          - state_machines.RateEscalator.APPLIED_to_VOIDED
          - calculations.escalator_adjustment
          - calculations.expected_reimbursement
          - calculations.case_outstanding_recompute
        distinguishing_aspect: |
          Depth-3 cascade from a DIFFERENT trigger (escalator void, not
          amendment application): voiding the APPLIED 2000bp escalator (1)
          reprices the claim 240000->200000, (2) drops variance 40000->0 and
          flips remittance_status to RECONCILED, (3) restates the active case
          to original_variance 0 while leaving it QUEUED.
        test_recipe:
          setup:
            - "Payer P; contract C ACTIVE PER_DIEM 100000/day with escalator 2000bp compounding effective 2026-06-01"
            - "Clock swept so the escalator is APPLIED"
            - "Claim CL-EV1 (2026-06-01..2026-06-03) priced under the escalator -> 240000; remittance 200000 -> variance 40000 -> QUEUED case (original 40000)"
          setup_api_calls:
            - call: "POST /api/payers"
              payload: { name: "Payer EV", payer_type: "COMMERCIAL", appeal_deadline_days: 45 }
              as: ContractManager
              captures: { payer_id: $.data.id }
            - call: "POST /api/payer-contracts"
              payload: { payer_id: "${payer_id}", contract_code: "EV-2026", effective_date: "2026-01-01", expiration_date: "2026-12-31" }
              as: ContractAnalyst
              captures: { contract_id: $.data.id }
            - call: "POST /api/contract-terms"
              payload: { contract_id: "${contract_id}", service_category: "INPATIENT_MEDICAL", rate_model: "PER_DIEM", base_rate_cents: 100000 }
              as: ContractAnalyst
            - call: "POST /api/rate-escalators"
              payload: { contract_id: "${contract_id}", effective_date: "2026-06-01", escalator_bp: 2000, compounding: true }
              as: ContractAnalyst
              captures: { escalator_id: $.data.id }
            - call: "POST /api/payer-contracts/${contract_id}/activate"
              as: ContractManager
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /api/claims"
              payload: { payer_id: "${payer_id}", claim_number: "CL-EV1", patient_account_number: "PA-EV1", service_category: "INPATIENT_MEDICAL", admission_date: "2026-06-01", discharge_date: "2026-06-03", total_billed_charges_cents: 500000 }
              as: RevenueIntegrityAnalyst
              captures: { claim_id: $.data.id }
            - call: "POST /api/claims/${claim_id}/lines"
              payload: { revenue_code: "0100", service_date: "2026-06-01", charge_cents: 250000, units: 1 }
              as: RevenueIntegrityAnalyst
            - call: "POST /api/claims/${claim_id}/price"
              as: RevenueIntegrityAnalyst
              captures: { exp_before: $.data.expected_reimbursement_cents }
            - call: "POST /api/remittances"
              payload: { claim_id: "${claim_id}", paid_amount_cents: 200000, remittance_date: "2026-08-01" }
              as: RevenueIntegrityAnalyst
            - call: "GET /api/underpayment-cases"
              payload: { claim_id: "${claim_id}" }
              as: RevenueIntegrityAnalyst
              captures: { case_id: "$.data[0].id" }
          trigger:
            - call: "POST /api/rate-escalators/${escalator_id}/void"
              as: ContractManager
            - call: "GET /api/claims/${claim_id}"
              as: RevenueIntegrityAnalyst
            - call: "GET /api/underpayment-cases/${case_id}"
              as: RevenueIntegrityAnalyst
          assert:
            - "precondition sanity: priced with escalator ${exp_before} == 240000 (2 days x round_half_up(100000 x 1.2))"
            - "Claim.${claim_id}.expected_reimbursement_cents == 200000 after void — link 1 (reprice without the escalator)"
            - "Claim.${claim_id}.variance_cents == 0 and remittance_status == RECONCILED — link 2 (variance recompute)"
            - "UnderpaymentCase.${case_id}.original_variance_cents == 0 and current_outstanding_cents == 0 — link 3 (case restated)"
            - "UnderpaymentCase.${case_id}.status == QUEUED (restatement never auto-closes)"

  # ---------------------------------------------------------------------------
  # Rule 5 — priority_pair_validation_conflict: (state vs business_fiscal) and
  # (business_safety vs business_fiscal) — different error-category pairs.
  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: write_off_from_queued_state_error_beats_cap_error
        grounds:
          - validations[priority=6]
          - validations[priority=11]
          - errors[ERR_INVALID_STATE_TRANSITION]
          - errors[ERR_WRITE_OFF_CAP_EXCEEDED]
          - state_machines.UnderpaymentCase.UNDER_REVIEW_to_WRITTEN_OFF
        distinguishing_aspect: |
          Pair state vs business_fiscal: the same write_off request violates
          both (case is QUEUED, not UNDER_REVIEW; outstanding 300000 > 250000
          cap) and the priority-6 state check must win with
          ERR_INVALID_STATE_TRANSITION, masking ERR_WRITE_OFF_CAP_EXCEEDED.
        test_recipe:
          setup:
            - "Payer P; contract C ACTIVE CASE_RATE INPATIENT_MEDICAL 300000 (thresholds 5000c/100bp)"
            - "Claim CL-PP1 priced at 300000; zero remittance posted -> variance 300000 -> case QUEUED with outstanding 300000 (never picked up)"
          setup_api_calls:
            - call: "POST /api/payers"
              payload: { name: "Payer PP", payer_type: "COMMERCIAL", appeal_deadline_days: 45 }
              as: ContractManager
              captures: { payer_id: $.data.id }
            - call: "POST /api/payer-contracts"
              payload: { payer_id: "${payer_id}", contract_code: "PP-2026", effective_date: "2026-01-01", expiration_date: "2026-12-31" }
              as: ContractAnalyst
              captures: { contract_id: $.data.id }
            - call: "POST /api/contract-terms"
              payload: { contract_id: "${contract_id}", service_category: "INPATIENT_MEDICAL", rate_model: "CASE_RATE", base_rate_cents: 300000 }
              as: ContractAnalyst
            - call: "POST /api/payer-contracts/${contract_id}/activate"
              as: ContractManager
            - call: "POST /api/claims"
              payload: { payer_id: "${payer_id}", claim_number: "CL-PP1", patient_account_number: "PA-PP1", service_category: "INPATIENT_MEDICAL", admission_date: "2026-06-01", discharge_date: "2026-06-02", total_billed_charges_cents: 400000 }
              as: RevenueIntegrityAnalyst
              captures: { claim_id: $.data.id }
            - call: "POST /api/claims/${claim_id}/lines"
              payload: { revenue_code: "0100", service_date: "2026-06-01", charge_cents: 400000, units: 1 }
              as: RevenueIntegrityAnalyst
            - call: "POST /api/claims/${claim_id}/price"
              as: RevenueIntegrityAnalyst
            - call: "POST /api/remittances"
              payload: { claim_id: "${claim_id}", paid_amount_cents: 0, remittance_date: "2026-08-01", adjustment_reason_code: "DENIAL" }
              as: RevenueIntegrityAnalyst
            - call: "GET /api/underpayment-cases"
              payload: { claim_id: "${claim_id}" }
              as: RevenueIntegrityAnalyst
              captures: { case_id: "$.data[0].id" }
          trigger:
            - call: "POST /api/underpayment-cases/${case_id}/write_off"
              payload: { amount_cents: 300000, reason: "uncollectible" }
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { err: $.data.error_id }
          assert:
            - "response is 409 with ${err} == ERR_INVALID_STATE_TRANSITION (priority 6 state beats priority 11 fiscal cap)"
            - "UnderpaymentCase.${case_id}.status still == QUEUED and write_off_amount_cents == 0"

      - name: write_off_self_sod_error_beats_cap_error
        grounds:
          - validations[priority=7]
          - validations[priority=11]
          - errors[ERR_SOD_WRITE_OFF_SELF]
          - errors[ERR_WRITE_OFF_CAP_EXCEEDED]
          - entities.UnderpaymentCase.fields.claimed_by_user_id
        distinguishing_aspect: |
          Pair business_safety vs business_fiscal (different pair from the
          state/fiscal instance): the write-off caller equals the case's
          claimed_by_user_id AND outstanding 300000 exceeds the 250000 cap;
          the priority-7 SoD check must win with ERR_SOD_WRITE_OFF_SELF.
        test_recipe:
          setup:
            - "Payer P; contract C ACTIVE CASE_RATE INPATIENT_MEDICAL 300000"
            - "Claim CL-PP2 priced at 300000; zero remittance -> case QUEUED outstanding 300000"
            - "Case picked up by user op-shared (claimed_by_user_id = op-shared) -> UNDER_REVIEW"
          setup_api_calls:
            - call: "POST /api/payers"
              payload: { name: "Payer PS", payer_type: "COMMERCIAL", appeal_deadline_days: 45 }
              as: ContractManager
              captures: { payer_id: $.data.id }
            - call: "POST /api/payer-contracts"
              payload: { payer_id: "${payer_id}", contract_code: "PS-2026", effective_date: "2026-01-01", expiration_date: "2026-12-31" }
              as: ContractAnalyst
              captures: { contract_id: $.data.id }
            - call: "POST /api/contract-terms"
              payload: { contract_id: "${contract_id}", service_category: "INPATIENT_MEDICAL", rate_model: "CASE_RATE", base_rate_cents: 300000 }
              as: ContractAnalyst
            - call: "POST /api/payer-contracts/${contract_id}/activate"
              as: ContractManager
            - call: "POST /api/claims"
              payload: { payer_id: "${payer_id}", claim_number: "CL-PS1", patient_account_number: "PA-PS1", service_category: "INPATIENT_MEDICAL", admission_date: "2026-06-01", discharge_date: "2026-06-02", total_billed_charges_cents: 400000 }
              as: RevenueIntegrityAnalyst
              captures: { claim_id: $.data.id }
            - call: "POST /api/claims/${claim_id}/lines"
              payload: { revenue_code: "0100", service_date: "2026-06-01", charge_cents: 400000, units: 1 }
              as: RevenueIntegrityAnalyst
            - call: "POST /api/claims/${claim_id}/price"
              as: RevenueIntegrityAnalyst
            - call: "POST /api/remittances"
              payload: { claim_id: "${claim_id}", paid_amount_cents: 0, remittance_date: "2026-08-01", adjustment_reason_code: "DENIAL" }
              as: RevenueIntegrityAnalyst
            - call: "GET /api/underpayment-cases"
              payload: { claim_id: "${claim_id}" }
              as: RecoveryManager
              captures: { case_id: "$.data[0].id" }
            - call: "POST /api/underpayment-cases/${case_id}/pick_up"
              as: RecoveryManager
              as_user_id: "op-shared"
          trigger:
            - call: "POST /api/underpayment-cases/${case_id}/write_off"
              payload: { amount_cents: 300000, reason: "uncollectible" }
              as: FinanceDirector
              as_user_id: "op-shared"
              captures: { err: $.data.error_id }
          assert:
            - "response is 409 with ${err} == ERR_SOD_WRITE_OFF_SELF (priority 7 safety beats priority 11 fiscal cap)"
            - "UnderpaymentCase.${case_id}.status still == UNDER_REVIEW and current_outstanding_cents == 300000"

  # ---------------------------------------------------------------------------
  # Rule 6 — boundary_precision_check: variance==threshold (numeric money
  # metric via POST /api/remittances) and billed==stop-loss threshold (charge
  # metric via POST /api/claims/{id}/price). Different metrics, different
  # endpoints.
  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: variance_exactly_at_threshold_queues_case
        grounds:
          - calculations.variance_and_queue_threshold
          - state_machines.Claim.REMITTANCE_POSTED_to_VARIANCE_FLAGGED
          - entities.PayerContract.fields.underpayment_threshold_cents
        distinguishing_aspect: |
          Money metric on POST /api/remittances: threshold = max(10000,
          round(200000 x 100bp)) = 10000; variance of exactly 10000 (==) is
          INCLUSIVE and must queue a case, while variance 9999 must not.
        test_recipe:
          setup:
            - "Payer P; contract C ACTIVE CASE_RATE INPATIENT_MEDICAL 200000 with underpayment_threshold_cents=10000, underpayment_threshold_bp=100"
            - "Claim CL-BV1 priced at 200000 (threshold resolves to max(10000, 2000) = 10000)"
          setup_api_calls:
            - call: "POST /api/payers"
              payload: { name: "Payer BV", payer_type: "COMMERCIAL", appeal_deadline_days: 45 }
              as: ContractManager
              captures: { payer_id: $.data.id }
            - call: "POST /api/payer-contracts"
              payload: { payer_id: "${payer_id}", contract_code: "BV-2026", effective_date: "2026-01-01", expiration_date: "2026-12-31", underpayment_threshold_cents: 10000, underpayment_threshold_bp: 100 }
              as: ContractAnalyst
              captures: { contract_id: $.data.id }
            - call: "POST /api/contract-terms"
              payload: { contract_id: "${contract_id}", service_category: "INPATIENT_MEDICAL", rate_model: "CASE_RATE", base_rate_cents: 200000 }
              as: ContractAnalyst
            - call: "POST /api/payer-contracts/${contract_id}/activate"
              as: ContractManager
            - call: "POST /api/claims"
              payload: { payer_id: "${payer_id}", claim_number: "CL-BV1", patient_account_number: "PA-BV1", service_category: "INPATIENT_MEDICAL", admission_date: "2026-06-01", discharge_date: "2026-06-02", total_billed_charges_cents: 300000 }
              as: RevenueIntegrityAnalyst
              captures: { claim_id: $.data.id }
            - call: "POST /api/claims/${claim_id}/lines"
              payload: { revenue_code: "0100", service_date: "2026-06-01", charge_cents: 300000, units: 1 }
              as: RevenueIntegrityAnalyst
            - call: "POST /api/claims/${claim_id}/price"
              as: RevenueIntegrityAnalyst
          trigger:
            - call: "POST /api/remittances"
              payload: { claim_id: "${claim_id}", paid_amount_cents: 190000, remittance_date: "2026-08-01" }
              as: RevenueIntegrityAnalyst
            - call: "GET /api/claims/${claim_id}"
              as: RevenueIntegrityAnalyst
            - call: "GET /api/underpayment-cases"
              payload: { claim_id: "${claim_id}" }
              as: RevenueIntegrityAnalyst
              captures: { case_var: "$.data[0].original_variance_cents" }
          assert:
            - "Claim.${claim_id}.variance_cents == 10000 (200000 - 190000) — exactly the threshold"
            - "Claim.${claim_id}.remittance_status == VARIANCE_FLAGGED (inclusive >= boundary queues)"
            - "exactly one UnderpaymentCase exists for ${claim_id} with original_variance_cents == 10000 (${case_var})"

      - name: stop_loss_charges_exactly_at_threshold_pays_floor
        grounds:
          - calculations.stop_loss_outlier_overlay
          - entities.StopLossProvision.fields.threshold_cents
        distinguishing_aspect: |
          Charge metric on POST /api/claims/{id}/price (different metric and
          endpoint from the variance boundary): billed charges of exactly
          500000 (== threshold) trigger the STOP_LOSS floor (expected 450000),
          while 499999 does not (expected stays the 100000 case rate).
        test_recipe:
          setup:
            - "Payer P; contract C ACTIVE CASE_RATE EMERGENCY 100000 with wildcard STOP_LOSS (threshold 500000, rate 9000bp)"
            - "Claim CL-BS1 billed exactly 500000; claim CL-BS2 billed 499999; both EMERGENCY, one line each"
          setup_api_calls:
            - call: "POST /api/payers"
              payload: { name: "Payer BS", payer_type: "COMMERCIAL", appeal_deadline_days: 45 }
              as: ContractManager
              captures: { payer_id: $.data.id }
            - call: "POST /api/payer-contracts"
              payload: { payer_id: "${payer_id}", contract_code: "BS-2026", effective_date: "2026-01-01", expiration_date: "2026-12-31" }
              as: ContractAnalyst
              captures: { contract_id: $.data.id }
            - call: "POST /api/contract-terms"
              payload: { contract_id: "${contract_id}", service_category: "EMERGENCY", rate_model: "CASE_RATE", base_rate_cents: 100000 }
              as: ContractAnalyst
            - call: "POST /api/stop-loss-provisions"
              payload: { contract_id: "${contract_id}", provision_type: "STOP_LOSS", threshold_cents: 500000, rate_bp: 9000 }
              as: ContractAnalyst
            - call: "POST /api/payer-contracts/${contract_id}/activate"
              as: ContractManager
            - call: "POST /api/claims"
              payload: { payer_id: "${payer_id}", claim_number: "CL-BS1", patient_account_number: "PA-BS1", service_category: "EMERGENCY", admission_date: "2026-06-10", discharge_date: "2026-06-10", total_billed_charges_cents: 500000 }
              as: RevenueIntegrityAnalyst
              captures: { claim_at: $.data.id }
            - call: "POST /api/claims/${claim_at}/lines"
              payload: { revenue_code: "0450", service_date: "2026-06-10", charge_cents: 500000, units: 1 }
              as: RevenueIntegrityAnalyst
            - call: "POST /api/claims"
              payload: { payer_id: "${payer_id}", claim_number: "CL-BS2", patient_account_number: "PA-BS2", service_category: "EMERGENCY", admission_date: "2026-06-10", discharge_date: "2026-06-10", total_billed_charges_cents: 499999 }
              as: RevenueIntegrityAnalyst
              captures: { claim_below: $.data.id }
            - call: "POST /api/claims/${claim_below}/lines"
              payload: { revenue_code: "0450", service_date: "2026-06-10", charge_cents: 499999, units: 1 }
              as: RevenueIntegrityAnalyst
          trigger:
            - call: "POST /api/claims/${claim_at}/price"
              as: RevenueIntegrityAnalyst
              captures: { exp_at: $.data.expected_reimbursement_cents }
            - call: "POST /api/claims/${claim_below}/price"
              as: RevenueIntegrityAnalyst
              captures: { exp_below: $.data.expected_reimbursement_cents }
          assert:
            - "Claim.${claim_at}.expected_reimbursement_cents == 450000 (== threshold triggers: max(100000, round(500000 x 0.9))) (${exp_at})"
            - "Claim.${claim_at}.pricing_trace.stop_loss_cents == 450000"
            - "Claim.${claim_below}.expected_reimbursement_cents == 100000 (499999 < threshold: floor does not engage) (${exp_below})"

  # ---------------------------------------------------------------------------
  # Rule 7 — cross_entity_state_dependency across different entity pairs:
  # RateAmendment->PayerContract and Appeal->UnderpaymentCase.
  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: amendment_approval_gated_on_contract_active
        grounds:
          - state_machines.RateAmendment.DRAFT_to_APPROVED
          - state_machines.PayerContract.ACTIVE_to_SUSPENDED
          - state_machines.PayerContract.SUSPENDED_to_ACTIVE
          - errors[ERR_CONTRACT_NOT_ACTIVE]
        distinguishing_aspect: |
          Pair RateAmendment->PayerContract: approval of the same DRAFT
          amendment is rejected with ERR_CONTRACT_NOT_ACTIVE while the contract
          is SUSPENDED and succeeds after resume flips the contract back to
          ACTIVE — the amendment's valid transition set depends on the
          contract's state.
        test_recipe:
          setup:
            - "Payer P; contract C ACTIVE with PER_DIEM term INPATIENT_MEDICAL 100000"
            - "DRAFT amendment A (override 110000, effective 2026-09-01) created by ca-1 while C is ACTIVE"
          setup_api_calls:
            - call: "POST /api/payers"
              payload: { name: "Payer XE", payer_type: "COMMERCIAL", appeal_deadline_days: 45 }
              as: ContractManager
              captures: { payer_id: $.data.id }
            - call: "POST /api/payer-contracts"
              payload: { payer_id: "${payer_id}", contract_code: "XE-2026", effective_date: "2026-01-01", expiration_date: "2026-12-31" }
              as: ContractAnalyst
              captures: { contract_id: $.data.id }
            - call: "POST /api/contract-terms"
              payload: { contract_id: "${contract_id}", service_category: "INPATIENT_MEDICAL", rate_model: "PER_DIEM", base_rate_cents: 100000 }
              as: ContractAnalyst
            - call: "POST /api/payer-contracts/${contract_id}/activate"
              as: ContractManager
              captures: { cv: $.data.version }
            - call: "POST /api/rate-amendments"
              payload: { contract_id: "${contract_id}", effective_date: "2026-09-01", term_overrides: [ { service_category: "INPATIENT_MEDICAL", base_rate_cents: 110000 } ], expected_contract_version: "${cv}" }
              as: ContractAnalyst
              as_user_id: "ca-1"
              captures: { amendment_id: $.data.id }
            - call: "POST /api/payer-contracts/${contract_id}/suspend"
              as: ContractManager
          trigger:
            - call: "POST /api/rate-amendments/${amendment_id}/approve"
              as: ContractManager
              as_user_id: "cm-2"
              captures: { err: $.data.error_id }
            - call: "POST /api/payer-contracts/${contract_id}/resume"
              as: ContractManager
            - call: "POST /api/rate-amendments/${amendment_id}/approve"
              as: ContractManager
              as_user_id: "cm-2"
              captures: { st: $.data.status, approver: $.data.approved_by_user_id }
          assert:
            - "approve while SUSPENDED rejected 409 with ${err} == ERR_CONTRACT_NOT_ACTIVE"
            - "RateAmendment.${amendment_id} still DRAFT after the rejected approve"
            - "after resume (contract ACTIVE) the same approve succeeds: status == APPROVED (${st}) and approved_by_user_id == cm-2 (${approver})"

      - name: appeal_level2_gated_on_level1_outcome
        grounds:
          - state_machines.UnderpaymentCase.APPEAL_L1_to_APPEAL_L2
          - state_machines.Appeal.DRAFT_to_WITHDRAWN
          - state_machines.Appeal.FILED_to_CLOSED
          - errors[ERR_ESCALATION_BLOCKED]
          - validations[priority=12]
        distinguishing_aspect: |
          Pair Appeal->UnderpaymentCase (different pair from the
          amendment/contract instance): a level-2 appeal on a case whose only
          level-1 appeal is WITHDRAWN is rejected with ERR_ESCALATION_BLOCKED;
          after a refiled level-1 appeal is FILED and CLOSED with outcome
          DENIED, the same level-2 creation succeeds and moves the case to
          APPEAL_L2.
        test_recipe:
          setup:
            - "Payer P (appeal_deadline_days 45); contract C ACTIVE PER_DIEM 100000/day"
            - "Claim CL-XA1 priced 200000; remittance 100000 -> variance 100000 -> case QUEUED; picked up -> UNDER_REVIEW"
            - "Level-1 appeal created then withdrawn in DRAFT (case stays APPEAL_L1, escalation_level 1, no open appeal, no qualifying outcome)"
          setup_api_calls:
            - call: "POST /api/payers"
              payload: { name: "Payer XA", payer_type: "COMMERCIAL", appeal_deadline_days: 45 }
              as: ContractManager
              captures: { payer_id: $.data.id }
            - call: "POST /api/payer-contracts"
              payload: { payer_id: "${payer_id}", contract_code: "XA-2026", effective_date: "2026-01-01", expiration_date: "2026-12-31" }
              as: ContractAnalyst
              captures: { contract_id: $.data.id }
            - call: "POST /api/contract-terms"
              payload: { contract_id: "${contract_id}", service_category: "INPATIENT_MEDICAL", rate_model: "PER_DIEM", base_rate_cents: 100000 }
              as: ContractAnalyst
            - call: "POST /api/payer-contracts/${contract_id}/activate"
              as: ContractManager
            - call: "POST /api/claims"
              payload: { payer_id: "${payer_id}", claim_number: "CL-XA1", patient_account_number: "PA-XA1", service_category: "INPATIENT_MEDICAL", admission_date: "2026-06-01", discharge_date: "2026-06-03", total_billed_charges_cents: 500000 }
              as: RevenueIntegrityAnalyst
              captures: { claim_id: $.data.id }
            - call: "POST /api/claims/${claim_id}/lines"
              payload: { revenue_code: "0100", service_date: "2026-06-01", charge_cents: 250000, units: 1 }
              as: RevenueIntegrityAnalyst
            - call: "POST /api/claims/${claim_id}/price"
              as: RevenueIntegrityAnalyst
            - call: "POST /api/remittances"
              payload: { claim_id: "${claim_id}", paid_amount_cents: 100000, remittance_date: "2026-08-01" }
              as: RevenueIntegrityAnalyst
            - call: "GET /api/underpayment-cases"
              payload: { claim_id: "${claim_id}" }
              as: RecoveryManager
              captures: { case_id: "$.data[0].id" }
            - call: "POST /api/underpayment-cases/${case_id}/pick_up"
              as: RecoveryManager
              as_user_id: "rm-1"
            - call: "POST /api/appeals"
              payload: { case_id: "${case_id}", level: 1 }
              as: RecoveryManager
              as_user_id: "rm-1"
              captures: { appeal1: $.data.id }
            - call: "POST /api/appeals/${appeal1}/withdraw"
              as: RecoveryManager
              as_user_id: "rm-1"
          trigger:
            - call: "POST /api/appeals"
              payload: { case_id: "${case_id}", level: 2 }
              as: RecoveryManager
              as_user_id: "rm-1"
              captures: { err: $.data.error_id }
            - call: "POST /api/appeals"
              payload: { case_id: "${case_id}", level: 1 }
              as: RecoveryManager
              as_user_id: "rm-1"
              captures: { appeal2: $.data.id }
            - call: "POST /api/appeals/${appeal2}/file"
              as: RecoveryManager
              as_user_id: "rm-1"
            - call: "POST /api/appeals/${appeal2}/record_outcome"
              payload: { outcome: "DENIED" }
              as: RecoveryManager
              as_user_id: "rm-2"
            - call: "POST /api/appeals"
              payload: { case_id: "${case_id}", level: 2 }
              as: RecoveryManager
              as_user_id: "rm-1"
              captures: { appeal3: $.data.id, ch3: $.data.channel }
            - call: "GET /api/underpayment-cases/${case_id}"
              as: RecoveryManager
          assert:
            - "level-2 with no qualifying level-1 outcome rejected 409 with ${err} == ERR_ESCALATION_BLOCKED"
            - "same-level refile after WITHDRAWN is allowed (appeal ${appeal2} created)"
            - "after DENIED outcome, level-2 creation succeeds: Appeal.${appeal3}.level == 2 and channel == FORMAL_APPEAL (${ch3})"
            - "UnderpaymentCase.${case_id}.status == APPEAL_L2 and escalation_level == 2"

  # ---------------------------------------------------------------------------
  # Rule 8 — resource_temporal_overlap with different interval semantics:
  # PayerContract renewal-linked boundary sharing vs NetworkAgreement strict
  # closed-interval exclusion.
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: renewal_linked_contracts_share_exactly_one_boundary_date
        grounds:
          - validations[priority=9]
          - errors[ERR_CONTRACT_WINDOW_OVERLAP]
          - entities.PayerContract.fields.prior_contract_id
        distinguishing_aspect: |
          PayerContract interval semantics: same-payer windows are
          closed-interval disjoint UNLESS renewal-linked, and a renewal-linked
          pair may share at most one boundary date — effective 2026-12-31
          against an expiring 2026-12-31 contract passes, while 2026-12-30
          (two shared dates) fails with ERR_CONTRACT_WINDOW_OVERLAP.
        test_recipe:
          setup:
            - "Payer P; contract A (code RT-A) 2026-01-01..2026-12-31 exists (DRAFT)"
          setup_api_calls:
            - call: "POST /api/payers"
              payload: { name: "Payer RT", payer_type: "COMMERCIAL", appeal_deadline_days: 45 }
              as: ContractManager
              captures: { payer_id: $.data.id }
            - call: "POST /api/payer-contracts"
              payload: { payer_id: "${payer_id}", contract_code: "RT-A", effective_date: "2026-01-01", expiration_date: "2026-12-31" }
              as: ContractAnalyst
              captures: { contract_a: $.data.id }
          trigger:
            - call: "POST /api/payer-contracts"
              payload: { payer_id: "${payer_id}", contract_code: "RT-B", effective_date: "2026-12-31", expiration_date: "2027-12-31", prior_contract_id: "${contract_a}" }
              as: ContractAnalyst
              captures: { contract_b: $.data.id, st_b: $.data.status }
            - call: "POST /api/payer-contracts"
              payload: { payer_id: "${payer_id}", contract_code: "RT-C", effective_date: "2026-12-30", expiration_date: "2027-12-31", prior_contract_id: "${contract_a}" }
              as: ContractAnalyst
              captures: { err: $.data.error_id }
            - call: "POST /api/payer-contracts"
              payload: { payer_id: "${payer_id}", contract_code: "RT-D", effective_date: "2028-01-01", expiration_date: "2028-12-31" }
              as: ContractAnalyst
              captures: { contract_d: $.data.id }
          assert:
            - "renewal-linked contract sharing exactly the boundary date 2026-12-31 is created (${st_b} == DRAFT)"
            - "renewal-linked contract sharing two dates (2026-12-30 and 2026-12-31) rejected 409 with ${err} == ERR_CONTRACT_WINDOW_OVERLAP"
            - "unlinked contract 2028-01-01..2028-12-31 (zero shared dates with both existing windows) is created (${contract_d} exists)"

      - name: network_agreement_overlap_rejected_even_at_shared_boundary
        grounds:
          - validations[priority=9]
          - errors[ERR_NETWORK_AGREEMENT_OVERLAP]
          - entities.NetworkAgreement.fields.network_name
        distinguishing_aspect: |
          NetworkAgreement interval semantics are STRICTER than the contract
          rule (different resource, different semantics): same payer +
          network_name forbids ANY shared calendar date — even the single
          boundary date 2026-12-31 that a renewal-linked contract pair may
          share — while a disjoint window or a different network_name passes.
        test_recipe:
          setup:
            - "Payer P; agreement N1 WrapNet 2026-01-01..2026-12-31 REGISTERED"
          setup_api_calls:
            - call: "POST /api/payers"
              payload: { name: "Payer NO", payer_type: "COMMERCIAL", appeal_deadline_days: 45 }
              as: ContractManager
              captures: { payer_id: $.data.id }
            - call: "POST /api/network-agreements"
              payload: { payer_id: "${payer_id}", network_name: "WrapNet", wrap_rate_bp: 5000, precedence_rank: 1, effective_date: "2026-01-01", expiration_date: "2026-12-31" }
              as: ContractAnalyst
              captures: { na1: $.data.id }
          trigger:
            - call: "POST /api/network-agreements"
              payload: { payer_id: "${payer_id}", network_name: "WrapNet", wrap_rate_bp: 5500, precedence_rank: 2, effective_date: "2026-12-31", expiration_date: "2027-06-30" }
              as: ContractAnalyst
              captures: { err: $.data.error_id }
            - call: "POST /api/network-agreements"
              payload: { payer_id: "${payer_id}", network_name: "WrapNet", wrap_rate_bp: 5500, precedence_rank: 2, effective_date: "2027-01-01", expiration_date: "2027-12-31" }
              as: ContractAnalyst
              captures: { na2: $.data.id }
            - call: "POST /api/network-agreements"
              payload: { payer_id: "${payer_id}", network_name: "OtherNet", wrap_rate_bp: 6000, precedence_rank: 1, effective_date: "2026-06-01", expiration_date: "2026-06-30" }
              as: ContractAnalyst
              captures: { na3: $.data.id }
          assert:
            - "same payer+network_name sharing only the boundary date 2026-12-31 rejected 409 with ${err} == ERR_NETWORK_AGREEMENT_OVERLAP"
            - "same payer+network_name disjoint from 2027-01-01 created (${na2} exists)"
            - "same payer different network_name inside N1's window created (${na3} exists)"

  # ---------------------------------------------------------------------------
  # Rule 9 — compensating_invariant over different conserved quantities:
  # case-level money ledger vs claim-level paid/variance ledger.
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: appeal_recovery_then_reversal_preserves_case_money_ledger
        grounds:
          - calculations.case_outstanding_recompute
          - state_machines.Appeal.FILED_to_CLOSED
          - state_machines.Remittance.POSTED_to_REVERSED
          - entities.UnderpaymentCase.fields.current_outstanding_cents
          - entities.UnderpaymentCase.fields.recovered_to_date_cents
        distinguishing_aspect: |
          Conserved quantity = case money ledger (original == outstanding +
          recovered + write_off): a PARTIAL_PAYMENT of 30000 moves the ledger
          to 70000+30000+0 and reversing the APPEAL_RECOVERY remittance
          restores 100000+0+0 — forward action and compensation both preserve
          the invariant.
        test_recipe:
          setup:
            - "Payer P; contract C ACTIVE PER_DIEM 100000/day; claim CL-CI1 priced 200000; remittance 100000 -> case QUEUED outstanding 100000; case UNDER_REVIEW with FILED level-1 appeal"
          setup_api_calls:
            - call: "POST /api/payers"
              payload: { name: "Payer CI", payer_type: "COMMERCIAL", appeal_deadline_days: 45 }
              as: ContractManager
              captures: { payer_id: $.data.id }
            - call: "POST /api/payer-contracts"
              payload: { payer_id: "${payer_id}", contract_code: "CI-2026", effective_date: "2026-01-01", expiration_date: "2026-12-31" }
              as: ContractAnalyst
              captures: { contract_id: $.data.id }
            - call: "POST /api/contract-terms"
              payload: { contract_id: "${contract_id}", service_category: "INPATIENT_MEDICAL", rate_model: "PER_DIEM", base_rate_cents: 100000 }
              as: ContractAnalyst
            - call: "POST /api/payer-contracts/${contract_id}/activate"
              as: ContractManager
            - call: "POST /api/claims"
              payload: { payer_id: "${payer_id}", claim_number: "CL-CI1", patient_account_number: "PA-CI1", service_category: "INPATIENT_MEDICAL", admission_date: "2026-06-01", discharge_date: "2026-06-03", total_billed_charges_cents: 500000 }
              as: RevenueIntegrityAnalyst
              captures: { claim_id: $.data.id }
            - call: "POST /api/claims/${claim_id}/lines"
              payload: { revenue_code: "0100", service_date: "2026-06-01", charge_cents: 250000, units: 1 }
              as: RevenueIntegrityAnalyst
            - call: "POST /api/claims/${claim_id}/price"
              as: RevenueIntegrityAnalyst
            - call: "POST /api/remittances"
              payload: { claim_id: "${claim_id}", paid_amount_cents: 100000, remittance_date: "2026-08-01" }
              as: RevenueIntegrityAnalyst
            - call: "GET /api/underpayment-cases"
              payload: { claim_id: "${claim_id}" }
              as: RecoveryManager
              captures: { case_id: "$.data[0].id" }
            - call: "POST /api/underpayment-cases/${case_id}/pick_up"
              as: RecoveryManager
              as_user_id: "rm-1"
            - call: "POST /api/appeals"
              payload: { case_id: "${case_id}", level: 1 }
              as: RecoveryManager
              as_user_id: "rm-1"
              captures: { appeal_id: $.data.id }
            - call: "POST /api/appeals/${appeal_id}/file"
              as: RecoveryManager
              as_user_id: "rm-1"
          trigger:
            - call: "POST /api/appeals/${appeal_id}/record_outcome"
              payload: { outcome: "PARTIAL_PAYMENT", recovered_amount_cents: 30000 }
              as: RecoveryManager
              as_user_id: "rm-2"
            - call: "GET /api/underpayment-cases/${case_id}"
              as: RecoveryManager
              captures: { out1: $.data.current_outstanding_cents, rec1: $.data.recovered_to_date_cents }
            - call: "GET /api/remittances"
              payload: { appeal_id: "${appeal_id}" }
              as: RecoveryManager
              captures: { rec_rem: "$.data[0].id" }
            - call: "POST /api/remittances/${rec_rem}/reverse"
              as: FinanceDirector
              as_user_id: "fd-9"
            - call: "GET /api/underpayment-cases/${case_id}"
              as: RecoveryManager
              captures: { out2: $.data.current_outstanding_cents, rec2: $.data.recovered_to_date_cents }
            - call: "GET /api/claims/${claim_id}"
              as: RevenueIntegrityAnalyst
          assert:
            - "after PARTIAL_PAYMENT: outstanding == 70000 and recovered_to_date == 30000 (${out1}/${rec1}); invariant 100000 == 70000 + 30000 + 0"
            - "after reversal of the APPEAL_RECOVERY remittance: outstanding == 100000 and recovered_to_date == 0 (${out2}/${rec2}); invariant 100000 == 100000 + 0 + 0"
            - "Claim.${claim_id}.paid_amount_cents == 100000 again and variance_cents == 100000"
            - "UnderpaymentCase.${case_id}.status == APPEAL_L1 (reversal does not change the level)"

      - name: remittance_post_then_reverse_restores_claim_paid_variance_ledger
        grounds:
          - calculations.variance_and_queue_threshold
          - state_machines.Remittance.POSTED_to_REVERSED
          - state_machines.Claim.VARIANCE_FLAGGED_to_AWAITING_REMITTANCE
          - entities.Claim.fields.paid_amount_cents
          - entities.Claim.fields.variance_cents
        distinguishing_aspect: |
          Conserved quantity = claim paid/variance ledger (paid + variance ==
          expected over POSTED remittances only — a different quantity from
          the case money ledger): posting 150000 gives 150000 + 50000 ==
          200000; reversing it restores 0 + 200000 == 200000 and drops
          remittance_status back to AWAITING_REMITTANCE with the case restated
          to the full 200000.
        test_recipe:
          setup:
            - "Payer P; contract C ACTIVE PER_DIEM 100000/day; claim CL-CI2 priced 200000 (thresholds default 5000c/100bp)"
          setup_api_calls:
            - call: "POST /api/payers"
              payload: { name: "Payer CL", payer_type: "COMMERCIAL", appeal_deadline_days: 45 }
              as: ContractManager
              captures: { payer_id: $.data.id }
            - call: "POST /api/payer-contracts"
              payload: { payer_id: "${payer_id}", contract_code: "CL-2026", effective_date: "2026-01-01", expiration_date: "2026-12-31" }
              as: ContractAnalyst
              captures: { contract_id: $.data.id }
            - call: "POST /api/contract-terms"
              payload: { contract_id: "${contract_id}", service_category: "INPATIENT_MEDICAL", rate_model: "PER_DIEM", base_rate_cents: 100000 }
              as: ContractAnalyst
            - call: "POST /api/payer-contracts/${contract_id}/activate"
              as: ContractManager
            - call: "POST /api/claims"
              payload: { payer_id: "${payer_id}", claim_number: "CL-CI2", patient_account_number: "PA-CI2", service_category: "INPATIENT_MEDICAL", admission_date: "2026-06-01", discharge_date: "2026-06-03", total_billed_charges_cents: 500000 }
              as: RevenueIntegrityAnalyst
              captures: { claim_id: $.data.id }
            - call: "POST /api/claims/${claim_id}/lines"
              payload: { revenue_code: "0100", service_date: "2026-06-01", charge_cents: 250000, units: 1 }
              as: RevenueIntegrityAnalyst
            - call: "POST /api/claims/${claim_id}/price"
              as: RevenueIntegrityAnalyst
          trigger:
            - call: "POST /api/remittances"
              payload: { claim_id: "${claim_id}", paid_amount_cents: 150000, remittance_date: "2026-08-01" }
              as: RevenueIntegrityAnalyst
              captures: { rem_id: $.data.id }
            - call: "GET /api/claims/${claim_id}"
              as: RevenueIntegrityAnalyst
              captures: { paid1: $.data.paid_amount_cents, var1: $.data.variance_cents, rs1: $.data.remittance_status }
            - call: "POST /api/remittances/${rem_id}/reverse"
              as: FinanceDirector
              as_user_id: "fd-9"
            - call: "GET /api/claims/${claim_id}"
              as: RevenueIntegrityAnalyst
              captures: { paid2: $.data.paid_amount_cents, var2: $.data.variance_cents, rs2: $.data.remittance_status }
            - call: "GET /api/underpayment-cases"
              payload: { claim_id: "${claim_id}" }
              as: RevenueIntegrityAnalyst
              captures: { case_var: "$.data[0].original_variance_cents" }
          assert:
            - "after post: paid == 150000, variance == 50000, remittance_status == VARIANCE_FLAGGED (${paid1}/${var1}/${rs1}); invariant 150000 + 50000 == 200000"
            - "after reverse: paid == 0, variance == 200000, remittance_status == AWAITING_REMITTANCE (${paid2}/${var2}/${rs2}); invariant 0 + 200000 == 200000"
            - "the active case is restated to the full exposure: original_variance_cents == 200000 (${case_var})"
            - "Remittance.${rem_id}.status == REVERSED"
