      - name: address_recheck_is_allowed_only_from_address_hold
        claim_type: Conditional action
        grounds:
          - endpoints[POST /vote-by-mail/ballot-requests/{id}/address-recheck]
          - validations[ERR_REQUEST_STATE_INVALID]
          - state_machines.BallotRequest.transitions.RECEIVED_to_ADDRESS_HOLD
        distinguishing_aspect: "On a request left at ADDRESS_HOLD by a MATCH_NON_FORWARDABLE result the recheck mints a second PENDING AddressVerification; on the same request after that recheck clears to ADDRESS_CLEARED it returns 409 ERR_REQUEST_STATE_INVALID."
        test_recipe:
          setup:
            - "Ballot request br1 whose first AddressVerification av1 was resolved MATCH_NON_FORWARDABLE, leaving br1 at ADDRESS_HOLD with forwarding_class NON_FORWARDABLE."
          setup_api_calls:
            - *c_clock_sep10
            - *c_election
            - *c_voter1
            - *c_request1
            - *c_av1_lookup
            - call: "POST /vote-by-mail/address-verifications/${av1}/results"
              payload: { ncoa_result: "MATCH_NON_FORWARDABLE" }
              as: ElectionsClerk
          trigger:
            - call: "POST /vote-by-mail/ballot-requests/${br1}/address-recheck"
              payload: {}
              as: ElectionsClerk
              captures: { av1b: $.data.id }
            - call: "POST /vote-by-mail/address-verifications/${av1b}/results"
              payload: { ncoa_result: "MATCH_FORWARDABLE", verified_mailing_address: "77 Birch Ln, Springfield", forwardable: true }
              as: ElectionsClerk
            - call: "POST /vote-by-mail/ballot-requests/${br1}/address-recheck"
              payload: {}
              as: ElectionsClerk
              captures: { recheck_err: $.data.error_id }
          assert:
            - "First recheck: HTTP 201 with status == \"PENDING\", ncoa_result == null, evaluated_at == null and ballot_request_id == ${br1}"
            - "GET /vote-by-mail/address-verifications?ballot_request_id=${br1} returns total_count == 2"
            - "After the second result: GET /vote-by-mail/ballot-requests/${br1} returns status == \"ADDRESS_CLEARED\" and forwarding_class == \"FORWARDABLE\""
            - "Second recheck: HTTP 409 with data.error_id == \"ERR_REQUEST_STATE_INVALID\" and GET /vote-by-mail/address-verifications?ballot_request_id=${br1} still returns total_count == 2"

      - name: request_reject_fails_the_pending_address_verification
