  # ---------------------------------------------------------------------------
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: stenographer_buffered_halfopen_overlap
        grounds:
          - calculations.stenographer_overlap_window
          - state_machines.LiveAssignment.OFFERED_to_ACCEPTED
        distinguishing_aspect: |
          Stenographer occupancy uses HALF-OPEN windows with ASYMMETRIC buffers
          ([start-15, end+5)): a 14:30 event conflicts through buffer intersection
          even though raw air times of the two events do not overlap, while a
          window touching at exactly 11:05 is admitted — edge-touch is not a
          conflict under half-open geometry.
        test_recipe:
          setup:
            - "Clock at 2026-08-10T08:00:00Z"
            - "Client; stenographer S1 ACCEPTED on E1 10:00-11:00 (prep 15, wrap 5 -> occupied [09:45, 11:05))"
            - "E2 11:05-12:00 prep 15 -> candidate [10:50, 12:05) intersects"
            - "E3 11:20-12:00 prep 15 -> candidate [11:05, 12:05) touches at exactly 11:05"
          setup_api_calls:
            - call: "POST /caption-ad/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T08:00:00Z" }
              as: OperationsManager
            - call: "POST /caption-ad/clients"
              payload: { name: "Live Client", compliance_standard: "FCC_BROADCAST" }
              as: OperationsManager
              captures: { c_id: $.data.id }
            - call: "POST /caption-ad/stenographers"
              payload: { display_name: "S1", certification: "CERT_CART", certified_since: "2020-01-01T00:00:00Z", cert_valid_until: "2027-01-01T00:00:00Z" }
              as: Scheduler
              captures: { s_1: $.data.id }
            - call: "POST /caption-ad/live-events"
              payload: { client_id: "${c_id}", title: "E1", channel_id: "CH1", start_at: "2026-08-10T10:00:00Z", end_at: "2026-08-10T11:00:00Z", required_certification: "CERT_CART" }
              as: Scheduler
              captures: { ev_1: $.data.id, ev_1_v: $.data.version }
            - call: "POST /caption-ad/live-events/${ev_1}/assignments"
              payload: { stenographer_id: "${s_1}", expected_live_event_version: "${ev_1_v}" }
              as: Scheduler
              captures: { asg_1: $.data.id }
            - call: "POST /caption-ad/live-assignments/${asg_1}/accept"
              payload: {}
              as: Stenographer
              as_user_id: "${s_1}"
            - call: "POST /caption-ad/live-events"
              payload: { client_id: "${c_id}", title: "E2", channel_id: "CH2", start_at: "2026-08-10T11:05:00Z", end_at: "2026-08-10T12:00:00Z", required_certification: "CERT_CART" }
              as: Scheduler
              captures: { ev_2: $.data.id, ev_2_v: $.data.version }
            - call: "POST /caption-ad/live-events"
              payload: { client_id: "${c_id}", title: "E3", channel_id: "CH3", start_at: "2026-08-10T11:20:00Z", end_at: "2026-08-10T12:00:00Z", required_certification: "CERT_CART" }
              as: Scheduler
              captures: { ev_3: $.data.id, ev_3_v: $.data.version }
          trigger:
            - call: "POST /caption-ad/live-events/${ev_2}/assignments"
              payload: { stenographer_id: "${s_1}", expected_live_event_version: "${ev_2_v}" }
              as: Scheduler
              captures: { err: $.data.error_id }
            - call: "POST /caption-ad/live-events/${ev_3}/assignments"
              payload: { stenographer_id: "${s_1}", expected_live_event_version: "${ev_3_v}" }
              as: Scheduler
              captures: { asg_3: $.data.id }
          assert:
            - "E2 offer rejected ERR_STENOGRAPHER_DOUBLE_BOOKED (409): candidate [10:50,12:05) intersects occupied [09:45,11:05) — raw air times 11:05 vs 11:00 do not overlap, the prep buffer does"
            - "E3 offer succeeds: candidate [11:05,12:05) touches the occupied window's right edge at exactly 11:05, which half-open semantics admits"
            - "LiveAssignment.${asg_3}.assignment_status == OFFERED"

      - name: studio_closed_interval_min_gap
        grounds:
          - calculations.studio_booking_window
          - state_machines.AudioDescriptionTrack
        distinguishing_aspect: |
          Studio bookings use CLOSED intervals with a 30-minute MINIMUM GAP — the
          opposite geometry from the stenographer rule: back-to-back with exactly
          30 minutes separation is admitted, 29 minutes rejected, and the check runs
          against a different resource (studio_id on AudioDescriptionTrack).
