            - "GET review-tasks for creative A reports total_count == 2: ${task_a} is EXPIRED with assigned_reviewer_id null and cycle_count 0, and the replacement is QUEUED with cycle_count 1, queue REGULATED_CERT, primary_policy_rule_id ${alc_id} and sla_deadline_at 2026-08-08T00:00:00Z"
            - "AdCreative.${cr_a}.review_status is still PENDING_MANUAL_REVIEW — an SLA expiry re-queues the work, it does not resolve the creative"

      - name: conditional_action_certification_revoke_reroutes_every_creative_approved_under_it
        claim_type: Conditional action
        grounds:
          - endpoints.POST_/ad-policy/certifications/{id}/revoke
          - validations[priority=40].ERR_INVALID_CERTIFICATION_STATE
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / limited_approval_depends_on_certification_row_state_and_collapses_on_revocation
          rationale: "That instance revokes an ACTIVE certification, verifies the APPROVED_LIMITED creative is re-routed with a fresh REGULATED_CERT task, and then shows a second revoke returning ERR_INVALID_CERTIFICATION_STATE."

  # ===========================================================================
  - section: "From Table 6 (Errors)"
    instances:

      - name: error_catalog_unauthenticated_requests_are_refused_before_any_role_check
        claim_type: Error triggerability
        grounds:
          - errors.ERR_UNAUTHENTICATED
          - validations[priority=10].ERR_UNAUTHENTICATED
        distinguishing_aspect: |
          Priority 10 sits above the role check, so a request with no X-User-Role, with an
          empty X-User-ID or with a role outside the four declared names is 401 even when it
          also names an endpoint that role could never call and carries an unparseable body.
        test_recipe:
          setup:
            - "One policy rule exists so the addressed read endpoint has a real target."
          setup_api_calls:
            - call: "POST /ad-policy/policy-rules"
              payload: { code: "FIN_CREDIT", title: "Consumer credit offers", category_class: "REGULATED", base_severity_weight: 4.00 }
              as: PolicyAdmin
              captures: { fin_id: "$.data.id" }
          trigger:
            - call: "GET /ad-policy/policy-rules/${fin_id}"
              payload: {}
              as: NONE
              captures: { err_no_role: "$.data.error_id" }
            - call: "GET /ad-policy/policy-rules/${fin_id}"
              payload: {}
              as: Advertiser
              as_user_id: ""
              captures: { err_no_id: "$.data.error_id" }
            - call: "POST /ad-policy/policy-rules"
              payload: { code: "AUDIT_BOT" }
              as: AuditBot
              captures: { err_bad_role: "$.data.error_id" }
            - call: "GET /ad-policy/policy-rules"
              payload: {}
              as: PolicyAdmin
          assert:
            - "The header-less read returns HTTP 401 with error_id ERR_UNAUTHENTICATED (as: NONE means the X-User-Role header is absent entirely)"
            - "The empty X-User-ID read returns HTTP 401 with error_id ERR_UNAUTHENTICATED"
            - "The unknown-role write returns HTTP 401 with error_id ERR_UNAUTHENTICATED — not 403 ERR_FORBIDDEN_ROLE and not 400 ERR_INVALID_REQUEST, even though the body is missing title and base_severity_weight"
            - "GET /ad-policy/policy-rules as PolicyAdmin still reports total_count == 1"

      - name: error_catalog_every_path_id_reports_its_own_entity_specific_not_found
        claim_type: Error triggerability
        grounds:
          - validations[priority=30]
          - errors.ERR_ADVERTISER_NOT_FOUND
          - errors.ERR_REVIEWER_NOT_FOUND
          - errors.ERR_SCREENING_RUN_NOT_FOUND
          - errors.ERR_REVIEW_TASK_NOT_FOUND
          - errors.ERR_APPEAL_NOT_FOUND
          - errors.ERR_ENFORCEMENT_ACTION_NOT_FOUND
        distinguishing_aspect: |
          Ten single-resource reads share one unknown UUID and must each answer with their own
          error id: a generic ERR_NOT_FOUND, or reusing ERR_AD_CREATIVE_NOT_FOUND for every
          path, satisfies the HTTP status while failing this claim.
        test_recipe:
          setup:
            - "One policy rule exists so the store is non-empty; the literal 00000000-0000-4000-8000-000000000000 is used as the unknown id everywhere."
          setup_api_calls:
            - call: "POST /ad-policy/policy-rules"
              payload: { code: "FIN_CREDIT", title: "Consumer credit offers", category_class: "REGULATED", base_severity_weight: 4.00 }
              as: PolicyAdmin
          trigger:
            - call: "GET /ad-policy/advertisers/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PolicyAdmin
              captures: { e_adv: "$.data.error_id" }
            - call: "GET /ad-policy/ad-creatives/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PolicyAdmin
              captures: { e_cr: "$.data.error_id" }
            - call: "GET /ad-policy/policy-rules/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PolicyAdmin
              captures: { e_rule: "$.data.error_id" }
            - call: "GET /ad-policy/reviewers/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PolicyAdmin
              captures: { e_rev: "$.data.error_id" }
            - call: "GET /ad-policy/screening-runs/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PolicyAdmin
              captures: { e_run: "$.data.error_id" }
            - call: "GET /ad-policy/review-tasks/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PolicyAdmin
              captures: { e_task: "$.data.error_id" }
            - call: "GET /ad-policy/certifications/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PolicyAdmin
              captures: { e_cert: "$.data.error_id" }
            - call: "GET /ad-policy/disapproval-notices/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PolicyAdmin
              captures: { e_notice: "$.data.error_id" }
            - call: "GET /ad-policy/appeals/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PolicyAdmin
              captures: { e_appeal: "$.data.error_id" }
            - call: "GET /ad-policy/enforcement-actions/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PolicyAdmin
              captures: { e_enf: "$.data.error_id" }
          assert:
            - "Every call returns HTTP 404"
            - "The error ids are, in call order: ERR_ADVERTISER_NOT_FOUND, ERR_AD_CREATIVE_NOT_FOUND, ERR_POLICY_RULE_NOT_FOUND, ERR_REVIEWER_NOT_FOUND, ERR_SCREENING_RUN_NOT_FOUND, ERR_REVIEW_TASK_NOT_FOUND, ERR_CERTIFICATION_NOT_FOUND, ERR_DISAPPROVAL_NOTICE_NOT_FOUND, ERR_APPEAL_NOT_FOUND, ERR_ENFORCEMENT_ACTION_NOT_FOUND"
            - "Each response body carries a message and an error_id and no data payload"

      - name: error_catalog_claim_authorization_separates_country_from_queue_before_capacity
        claim_type: Error triggerability
        grounds:
          - validations[priority=60].ERR_REVIEWER_NOT_AUTHORIZED_COUNTRY
          - validations[priority=64].ERR_REVIEWER_QUEUE_MISMATCH
        distinguishing_aspect: |
          Three reviewers attack one REGULATED_CERT task on a US+CA creative: the first is
          missing CA, the second is missing the queue, the third has both. The country check
          at 60 and the queue check at 64 must be reported separately, and neither may be
          collapsed into a single generic authorization error.
        test_recipe:
          setup:
            - "Rule ALC_SPIRITS (RESTRICTED, weight 6.00, requires_certification true, requires_disclaimer false, auto 0.90, manual 0.20, default_queue REGULATED_CERT)."
            - "One verified advertiser; one creative targeting [CA, US], submitted and screened at confidence 0.50, leaving one QUEUED REGULATED_CERT task."
            - "Reviewer A: queues [REGULATED_CERT], countries [US] only. Reviewer B: queues [STANDARD], countries [CA, US]. Reviewer C: queues [REGULATED_CERT], countries [CA, US]. All three are ACTIVE and well under their ceilings."
          setup_api_calls:
            - call: "POST /ad-policy/policy-rules"
              payload: { code: "ALC_SPIRITS", title: "Alcohol - spirits", category_class: "RESTRICTED", base_severity_weight: 6.00, requires_certification: true, requires_disclaimer: false, confidence_auto_disapprove_threshold: 0.90, confidence_manual_threshold: 0.20, default_queue: "REGULATED_CERT" }
              as: PolicyAdmin
              captures: { alc_id: "$.data.id" }
            - call: "POST /ad-policy/advertisers"
