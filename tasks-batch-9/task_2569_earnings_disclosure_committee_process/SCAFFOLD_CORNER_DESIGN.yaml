      - name: undeclared_actions_on_a_planning_cycle_report_invalid_state
        claim_type: invalid_transitions
        grounds:
          - state_machines.ReportingCycle.PLANNING_to_CLOSE_OPEN
          - validations[priority=13]
          - validations[priority=33]
          - validations[priority=34]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          From PLANNING the only declared cycle actions are OPEN_CLOSE and ABANDON, so OPEN_REVIEW,
          OPEN_CERTIFICATION and DECLARE_FILING_READY must each return ERR_INVALID_STATE and nothing
          else. Each call is issued with a role that priority 5 accepts for that action (Controller for
          OPEN_REVIEW, DisclosureCommitteeChair for the other two) so the 403 layer cannot pre-empt the
          state check, and the cycle carries no milestones at all so the far weaker ERR_MILESTONE_MISSING
          at priority 33 would also be violated — priority 13 wins and the cycle stays PLANNING at
          version 1.
        test_recipe:
          setup:
            - "An ADOPTED charter with an ACTIVE voting FINANCE member and an ACTIVE voting LEGAL member."
            - "One cycle in PLANNING with no Milestone rows."
          setup_api_calls:
            - call: "POST /disclosure/charters"
              payload: { name: "Q2 Disclosure Committee Charter", version_label: "2026.1", min_quorum_count: 2, required_functions: ["FINANCE", "LEGAL"] }
              as: ComplianceAdmin
              captures: { charter_id: $.data.id }
            - call: "POST /disclosure/charters/${charter_id}/members"
              payload: { full_name: "Nora Finance", function: "FINANCE", is_officer: false, voting: true }
              as: ComplianceAdmin
              captures: { fin_id: $.data.id }
            - call: "POST /disclosure/charters/${charter_id}/members"
              payload: { full_name: "Owen Legal", function: "LEGAL", is_officer: false, voting: true }
              as: ComplianceAdmin
              captures: { legal_id: $.data.id }
            - call: "POST /disclosure/charters/${charter_id}/transitions"
              payload: { action: "ADOPT" }
              as: DisclosureCommitteeChair
              as_user_id: "${legal_id}"
            - call: "POST /disclosure/reporting-cycles"
              payload: { fiscal_period_label: "FY2026-Q2", form_type: "FORM_10Q", period_end_date: "2026-06-30", filer_status: "LARGE_ACCELERATED", materiality_base_amount: 10000000, charter_id: "${charter_id}", internal_buffer_days: 5 }
              as: ComplianceAdmin
              captures: { cycle_id: $.data.id }
          trigger:
            - call: "POST /disclosure/reporting-cycles/${cycle_id}/transitions"
              payload: { action: "OPEN_REVIEW" }
              as: Controller
              as_user_id: "${fin_id}"
              captures: { err_review: $.data.error_id }
            - call: "POST /disclosure/reporting-cycles/${cycle_id}/transitions"
              payload: { action: "OPEN_CERTIFICATION" }
              as: DisclosureCommitteeChair
              as_user_id: "${legal_id}"
              captures: { err_cert: $.data.error_id }
            - call: "POST /disclosure/reporting-cycles/${cycle_id}/transitions"
              payload: { action: "DECLARE_FILING_READY" }
              as: DisclosureCommitteeChair
              as_user_id: "${legal_id}"
              captures: { err_ready: $.data.error_id }
          assert:
            - "${err_review} == ERR_INVALID_STATE with HTTP 409"
            - "${err_cert} == ERR_INVALID_STATE with HTTP 409"
            - "${err_ready} == ERR_INVALID_STATE with HTTP 409"
            - "ReportingCycle.${cycle_id}.status == PLANNING and ReportingCycle.${cycle_id}.version == 1"

      - name: terminal_rows_admit_no_further_transition_and_report_entity_terminal
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.DisclosureCommitteeCharter.terminal_states
          - state_machines.CommitteeMember.terminal_states
          - state_machines.Milestone.terminal_states
          - validations[priority=12]
          - errors[ERR_ENTITY_TERMINAL]
        distinguishing_aspect: |
          Three different terminal states are probed with an action that would otherwise be legal from
          the row's predecessor state, and all three return ERR_ENTITY_TERMINAL (409) rather than
          ERR_INVALID_STATE: a SUPERSEDED charter re-issued SUPERSEDE against a valid ADOPTED successor
          (so priority 35 would have passed), a VACATED member issued RECUSE, and a COMPLETE milestone
          issued START while its cycle is still CLOSE_OPEN (so the parent-state gate would also have
          passed). Priority 12 sits above priority 13, which is what makes the distinction observable.
        test_recipe:
          setup:
            - "Charter A ADOPTED then SUPERSEDED by ADOPTED charter B."
            - "A VACATED non-voting OPERATIONS seat on charter B."
            - "A cycle on charter B in CLOSE_OPEN whose CLOSE milestone has been STARTed and COMPLETEd."
          setup_api_calls:
            - call: "POST /disclosure/charters"
              payload: { name: "Charter A", version_label: "A-1", min_quorum_count: 1, required_functions: ["FINANCE"] }
              as: ComplianceAdmin
              captures: { charter_a_id: $.data.id }
