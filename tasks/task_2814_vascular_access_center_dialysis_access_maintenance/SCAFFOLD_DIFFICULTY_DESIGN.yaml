            - "one patient with a TUNNELED_CATHETER in IN_USE (placed 2026-05-01) and an AVF in MATURING (placed 2026-06-20)"
            - "two surveillance readings on the AVF so MIN_READINGS 2 is satisfied"
            - "an ACTIVE conversion plan CATH -> AVF whose readiness_met is true only after a failing check (flow 599) and then a passing check (flow 600)"
