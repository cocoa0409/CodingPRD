            - { call: "POST /rate-deployments/${d0}/execution", payload: { action: "DEPLOY" }, as: ChannelOperator }
            - { call: "POST /rate-deployments/${d1}/execution", payload: { action: "DEPLOY" }, as: ChannelOperator }
            - { call: "POST /rate-deployments/${d2}/execution", payload: { action: "DEPLOY" }, as: ChannelOperator }
            - { call: "POST /rate-deployments/${d3}/execution", payload: { action: "DEPLOY" }, as: ChannelOperator }
            - { call: "GET /disclosure-notices", payload: { sheet_id: "${s_nop}" }, as: ComplianceOfficer, captures: { n0: "$.data[0].id", n1: "$.data[1].id", n2: "$.data[2].id", n3: "$.data[3].id" } }
            - { call: "POST /disclosure-notices/${n0}/resolution", payload: { action: "SEND" }, as: ComplianceOfficer }
            - { call: "POST /disclosure-notices/${n1}/resolution", payload: { action: "SEND" }, as: ComplianceOfficer }
            - { call: "POST /disclosure-notices/${n2}/resolution", payload: { action: "SEND" }, as: ComplianceOfficer }
            - { call: "POST /disclosure-notices/${n3}/resolution", payload: { action: "SEND" }, as: ComplianceOfficer }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T00:00:00Z" }, as: OperationsAdmin }
            - { call: "POST /rate-sheets/${s_nop}/activate", payload: {}, as: PricingAnalyst }
            - { call: "POST /deposit-accounts", payload: { customer_ref: "CNP", product_id: "${p_nop}", market_code: "US-WEST", opening_balance_cents: 1000069, channel: "BRANCH" }, as: BranchBanker, captures: { an: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-16T00:00:00Z" }, as: OperationsAdmin }
          trigger:
            - { call: "POST /deposit-accounts/${an}/interest-postings", payload: {}, as: BranchBanker, captures: { p1: $.data.posted_interest_cents } }
            - { call: "POST /deposit-accounts/${an}/interest-postings", payload: {}, as: BranchBanker, captures: { p2: $.data.posted_interest_cents } }
          assert:
            - "first posting: posted_interest_cents == 110 (round_half_up(109596/1000) = 110 for one accrued day)"
            - "second posting the same day: posted_interest_cents unchanged == 110 (delta 0, no error)"

      - name: tier_structure_gap_and_bounded_last_tier_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=12]", "errors[ERR_TIER_STRUCTURE_INVALID]"]
        distinguishing_aspect: "Tier sets must be contiguous from 0 with an unbounded final tier: a gap between tier 1 and tier 2 fails, and so does a bounded last tier."
        test_recipe:
          setup: ["product P-TI exists"]
          setup_api_calls:
            - { call: "POST /deposit-products", payload: { product_code: "TI", product_class: "SAVINGS", term_months: 0, tier_application: "WHOLE_BALANCE", rate_cap_bp: 500, allows_promos: true, allows_exceptions: true }, as: OperationsAdmin, captures: { p_ti: $.data.id } }
          trigger:
            - { call: "POST /rate-sheets", payload: { product_id: "${p_ti}", market_code: "US-WEST", effective_date: "2026-08-15", disclosure_lead_days: 7, margin_floor_bp: 0, tiers: [ { tier_index: 0, lower_bound_cents: 0, upper_bound_cents: 1000000, rate_bp: 100, projected_balance_cents: 1000000 }, { tier_index: 1, lower_bound_cents: 2000000, upper_bound_cents: -1, rate_bp: 150, projected_balance_cents: 1000000 } ] }, as: PricingAnalyst, captures: { err_gap: $.data.error_id } }
            - { call: "POST /rate-sheets", payload: { product_id: "${p_ti}", market_code: "US-EAST", effective_date: "2026-08-15", disclosure_lead_days: 7, margin_floor_bp: 0, tiers: [ { tier_index: 0, lower_bound_cents: 0, upper_bound_cents: 1000000, rate_bp: 100, projected_balance_cents: 1000000 } ] }, as: PricingAnalyst, captures: { err_bnd: $.data.error_id } }
          assert:
            - "gap (1,000,000 -> 2,000,000): error_id == ERR_TIER_STRUCTURE_INVALID (422)"
            - "bounded last tier (no -1): error_id == ERR_TIER_STRUCTURE_INVALID (422)"

      - name: tier_rate_above_product_cap_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=13]", "errors[ERR_RATE_CAP_EXCEEDED]"]
        distinguishing_aspect: "A tier rate_bp greater than product.rate_cap_bp is rejected at sheet creation with ERR_RATE_CAP_EXCEEDED; a rate exactly at the cap passes."
        test_recipe:
          setup: ["product P-CAP with rate_cap_bp 500"]
          setup_api_calls:
            - { call: "POST /deposit-products", payload: { product_code: "CAP", product_class: "SAVINGS", term_months: 0, tier_application: "WHOLE_BALANCE", rate_cap_bp: 500, allows_promos: true, allows_exceptions: true }, as: OperationsAdmin, captures: { p_cap: $.data.id } }
          trigger:
            - { call: "POST /rate-sheets", payload: { product_id: "${p_cap}", market_code: "US-WEST", effective_date: "2026-08-15", disclosure_lead_days: 7, margin_floor_bp: 0, tiers: [ { tier_index: 0, lower_bound_cents: 0, upper_bound_cents: -1, rate_bp: 501, projected_balance_cents: 1000000 } ] }, as: PricingAnalyst, captures: { err_over: $.data.error_id } }
            - { call: "POST /rate-sheets", payload: { product_id: "${p_cap}", market_code: "US-WEST", effective_date: "2026-08-15", disclosure_lead_days: 7, margin_floor_bp: 0, tiers: [ { tier_index: 0, lower_bound_cents: 0, upper_bound_cents: -1, rate_bp: 500, projected_balance_cents: 1000000 } ] }, as: PricingAnalyst, captures: { s_at: $.data.id, s_at_st: $.data.status } }
          assert:
            - "rate 501 > cap 500: error_id == ERR_RATE_CAP_EXCEEDED (422)"
            - "rate 500 == cap: created, status DRAFT (cap comparison is strict >)"

      - name: dual_variant_and_interest_core_results_stub
        claim_type: variant_divergence
        grounds: [calculations.tiered_balance_rate, calculations.interest_posting, calculations.competitor_market_benchmark, calculations.sheet_margin_analysis]
        excluded_because:
          difficulty_instance: "dual_variant_calc / tiered_rate_marginal_vs_whole_balance"
          rationale: "Variant divergence, correct results, precision and constants for the four main calculations are asserted with pinned literals across the §1.8 instances (tiered_rate_marginal_vs_whole_balance, competitor_benchmark_weighted_vs_simple, sheet_margin_forward_vs_realized_book, interest_posting_sum_then_round_order)."

  # ==========================================================================
  # Section: validations
  # ==========================================================================
  - section: validations
    instances:
      - name: unauthenticated_request_returns_401
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request with no X-User-Role/X-User-ID headers fails priority-1 auth with ERR_UNAUTHENTICATED (401) before any role check."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /rate-sheets", payload: {}, as: Anonymous, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_UNAUTHENTICATED, http 401"

      - name: second_draft_sheet_for_pair_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=11]", "errors[ERR_DRAFT_SHEET_EXISTS]"]
        distinguishing_aspect: "At most one DRAFT per (product, market): creating a second DRAFT while the first is still DRAFT fails ERR_DRAFT_SHEET_EXISTS; after the first is submitted (COMMITTEE_REVIEW), a new DRAFT is allowed."
        test_recipe:
          setup: ["product P-DR; one DRAFT sheet for (P-DR, US-WEST)"]
          setup_api_calls:
            - { call: "POST /deposit-products", payload: { product_code: "DR", product_class: "SAVINGS", term_months: 0, tier_application: "WHOLE_BALANCE", rate_cap_bp: 500, allows_promos: true, allows_exceptions: true }, as: OperationsAdmin, captures: { p_dr: $.data.id } }
            - { call: "POST /rate-sheets", payload: { product_id: "${p_dr}", market_code: "US-WEST", effective_date: "2026-08-15", disclosure_lead_days: 7, margin_floor_bp: 0, tiers: [ { tier_index: 0, lower_bound_cents: 0, upper_bound_cents: -1, rate_bp: 100, projected_balance_cents: 1000000 } ] }, as: PricingAnalyst, captures: { s_dr1: $.data.id } }
          trigger:
            - { call: "POST /rate-sheets", payload: { product_id: "${p_dr}", market_code: "US-WEST", effective_date: "2026-09-01", disclosure_lead_days: 7, margin_floor_bp: 0, tiers: [ { tier_index: 0, lower_bound_cents: 0, upper_bound_cents: -1, rate_bp: 110, projected_balance_cents: 1000000 } ] }, as: PricingAnalyst, captures: { err_dup: $.data.error_id } }
            - { call: "POST /rate-sheets/${s_dr1}/submit", payload: {}, as: PricingAnalyst }
            - { call: "POST /rate-sheets", payload: { product_id: "${p_dr}", market_code: "US-WEST", effective_date: "2026-09-01", disclosure_lead_days: 7, margin_floor_bp: 0, tiers: [ { tier_index: 0, lower_bound_cents: 0, upper_bound_cents: -1, rate_bp: 110, projected_balance_cents: 1000000 } ] }, as: PricingAnalyst, captures: { s_dr2: $.data.id, s_dr2_ver: $.data.sheet_version } }
          assert:
            - "second DRAFT while first is DRAFT -> error_id == ERR_DRAFT_SHEET_EXISTS (409)"
            - "after first submits: new DRAFT allowed, sheet_version == 2"

