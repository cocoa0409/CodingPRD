  # =========================================================================
  # 4. Validations
  # =========================================================================
  - section: validations
    instances:
      - name: missing_x_user_header_and_unknown_role_both_return_unauthenticated
        claim_type: violation_error
        grounds:
          - validations[priority=10]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "Priority 10 covers three distinct header defects - no X-User-Role, no X-User-ID, and a role string outside the seven declared roles - and all three are 401 ERR_UNAUTHENTICATED, never the 403 ERR_ROLE_NOT_PERMITTED that an unknown role superficially resembles."
        test_recipe:
          setup:
            - "One Title so the request would otherwise be well-formed."
          setup_api_calls:
            - call: "POST /titles"
              payload: { title_code: "NOVA-61", name: "Nova Drift 61", source_language: "EN", target_release_utc: "2026-12-01T00:00:00Z", release_mode: "STAGGERED" }
              as: LocalizationProducer
              captures: { title_id: "$.data.id" }
          trigger:
            - call: "GET /titles/${title_id}"
              payload: {}
              as: "<omit the X-User-Role header entirely>"
              captures: { no_role_error: "$.data.error_id" }
            - call: "GET /titles/${title_id}"
              payload: {}
              as: LocalizationProducer
              as_user_id: "<omit the X-User-ID header entirely>"
              captures: { no_user_error: "$.data.error_id" }
            - call: "GET /titles/${title_id}"
              payload: {}
              as: "RegionalDistributor"
              captures: { bad_role_error: "$.data.error_id" }
          assert:
            - "all three calls return HTTP 401 with error_id == ERR_UNAUTHENTICATED"
            - "the unknown-role call is 401, NOT 403 - an unrecognised role fails authentication before the endpoint's role list is consulted"
            - "each response still carries meta.api_request_id and meta.api_request_timestamp"

      - name: fk_field_order_decides_which_not_found_error_wins
        claim_type: cascading_validation
        grounds:
          - validations[priority=32]
          - entities.VoiceSession
        distinguishing_aspect: "POST /voice-sessions carries four body FKs and all four are unknown; the rule says body FKs are checked in §1.1 field order, so the answer must be ERR_MARKET_PLAN_NOT_FOUND - the first declared field - and never whichever lookup the implementation happens to run first."
        test_recipe:
          setup:
            - "Empty database - no MarketPlan, VoiceTalent, RecordingBooth or TalentContract exists."
          setup_api_calls: []
          trigger:
            - call: "POST /voice-sessions"
              payload: { market_plan_id: "11111111-1111-4111-8111-111111111111", voice_talent_id: "22222222-2222-4222-8222-222222222222", recording_booth_id: "33333333-3333-4333-8333-333333333333", talent_contract_id: "44444444-4444-4444-8444-444444444444", start_utc: "2026-09-10T09:00:00Z", end_utc: "2026-09-10T11:00:00Z", planned_line_count: 60 }
              as: LocalizationProducer
              captures: { first_error: "$.data.error_id" }
          assert:
            - "HTTP 404 with error_id == ERR_MARKET_PLAN_NOT_FOUND - market_plan_id is the first FK in VoiceSession's §1.1 field order"
            - "it is not ERR_TALENT_NOT_FOUND, ERR_BOOTH_NOT_FOUND or ERR_CONTRACT_NOT_FOUND even though those lookups would also fail"
            - "no VoiceSession row is created: GET /voice-sessions returns meta.total_count == 0"

      - name: role_check_at_priority_20_beats_the_invalid_payload_at_25
        claim_type: priority_ordering
        grounds:
          - validations[priority=20]
          - validations[priority=25]
          - errors[ERR_ROLE_NOT_PERMITTED]
        distinguishing_aspect: "A single request violates both rules - wrong role AND a missing required field - and the ladder must answer with the 403 from priority 20. Returning the 400 would leak to an unauthorised caller which fields the endpoint wants."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /titles"
              payload: { title_code: "NOVA-62" }
              as: LqaTester
              as_user_id: "lqa-1"
              captures: { role_error: "$.data.error_id" }
            - call: "POST /titles"
              payload: { title_code: "NOVA-62" }
              as: LocalizationProducer
              captures: { payload_error: "$.data.error_id" }
          assert:
            - "the LqaTester call returns HTTP 403 with error_id == ERR_ROLE_NOT_PERMITTED, not HTTP 400"
            - "the same payload from a permitted role returns HTTP 400 ERR_INVALID_REQUEST, proving the payload really was defective"
            - "GET /titles returns meta.total_count == 0 after both refusals"

      - name: duplicate_market_code_on_the_same_title_is_rejected
        claim_type: violation_error
        grounds:
          - validations[priority=40]
          - errors[ERR_DUPLICATE_MARKET_CODE]
        distinguishing_aspect: "Uniqueness is scoped to (title_id, market_code), not global: a second JP plan on the same title is a 409, while a JP plan on a different title must succeed. A globally unique index would wrongly block the second title."
        test_recipe:
          setup:
            - "Two Titles, the first already carrying a JP plan."
          setup_api_calls:
            - call: "POST /titles"
              payload: { title_code: "NOVA-63", name: "Nova Drift 63", source_language: "EN", target_release_utc: "2026-12-01T00:00:00Z", release_mode: "STAGGERED" }
              as: LocalizationProducer
              captures: { title_a: "$.data.id" }
            - call: "POST /titles"
              payload: { title_code: "NOVA-64", name: "Nova Drift 64", source_language: "EN", target_release_utc: "2026-12-01T00:00:00Z", release_mode: "STAGGERED" }
              as: LocalizationProducer
              captures: { title_b: "$.data.id" }
            - call: "POST /market-plans"
              payload: { title_id: "${title_a}", market_code: "JP", rating_board: "CERO", target_rating: "TEEN_12", scope_tier: "TEXT_ONLY", cultural_adaptation_required: false, budget_cap_cents: 5000000, required_voice_line_count: 0 }
              as: LocalizationProducer
              captures: { mp_a_jp: "$.data.id" }
          trigger:
            - call: "POST /market-plans"
              payload: { title_id: "${title_a}", market_code: "JP", rating_board: "CERO", target_rating: "MATURE_15", scope_tier: "SUBTITLED", cultural_adaptation_required: false, budget_cap_cents: 7000000, required_voice_line_count: 0 }
              as: LocalizationProducer
              captures: { dup_error: "$.data.error_id" }
            - call: "POST /market-plans"
              payload: { title_id: "${title_b}", market_code: "JP", rating_board: "CERO", target_rating: "TEEN_12", scope_tier: "TEXT_ONLY", cultural_adaptation_required: false, budget_cap_cents: 5000000, required_voice_line_count: 0 }
              as: LocalizationProducer
              captures: { mp_b_jp: "$.data.id" }
          assert:
            - "the duplicate on ${title_a} returns HTTP 409 with error_id == ERR_DUPLICATE_MARKET_CODE"
            - "the JP plan on ${title_b} returns HTTP 201 - the constraint is per title"
            - "Title.${title_a}.market_plan_count == 1 and Title.${title_b}.market_plan_count == 1"

      - name: a_second_open_pass_of_the_same_type_is_refused_until_the_first_closes
        claim_type: satisfaction_pass
        grounds:
          - validations[priority=40]
          - errors[ERR_OPEN_QA_PASS_EXISTS]
          - entities.QaPass.fields.pass_index
        distinguishing_aspect: "The uniqueness rule is on OPEN passes of one pass_type, so the same request that is a 409 while pass 1 is open becomes a 201 once it closes - and the new row must take pass_index 2, proving the index counts all passes ever opened rather than the live ones."
        test_recipe:
          setup:
            - "Title NOVA-65 at LQA with one LINGUISTIC pass open (inspected_unit_count 50, no bugs)."
          setup_api_calls:
            - call: "POST /titles"
              payload: { title_code: "NOVA-65", name: "Nova Drift 65", source_language: "EN", target_release_utc: "2026-12-01T00:00:00Z", release_mode: "STAGGERED" }
              as: LocalizationProducer
