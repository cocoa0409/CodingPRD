# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3083_payroll_service_bureau_tax_filing_agency_client
#
# Two instances per Difficulty Rule (§0.5). Every instance grounds in
# SCAFFOLD.yaml §1.1–§1.7 and drives empty-DB -> precondition via §1.5 calls.
# Logical clock default is 2026-09-01T00:00:00Z (Tuesday) — no clock call is
# needed unless the recipe moves time.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: return_liability_bureau_books_vs_agency_confirmed
        grounds:
          - calculations.agency_liability_reconciliation
          - state_machines.TaxReturn.DRAFT_to_FILED
          - state_machines.TaxReturn.ACCEPTED_to_RECONCILED
          - entities.TaxReturn.fields.expected_liability_cents
        distinguishing_aspect: |
          Entity domain: TaxReturn liability. For identical period data the
          filing-time variant (bureau books: total_tax_cents of runs in
          {SUBMITTED, IMPOUNDED, SETTLED}) yields 750000, while the
          reconcile-time variant (agency-confirmed deposit amounts) yields
          700000 — because run 2 is still IMPOUNDED at filing and deposit D2
          is still unconfirmed at reconcile.
        test_recipe:
          setup:
            - "Clock at default 2026-09-01T00:00:00Z (Tuesday)."
            - "FED-941 jurisdiction (SEMIWEEKLY, tiers 0.02/0.05/0.10, threshold 250000)."
            - "Client ACME with a VERIFIED FED-941 registration, ACTIVE."
            - "Run 1: period 2026-08-16..2026-08-31, pay_date 2026-09-04 (Fri), tax 400000, IMPOUNDED then SETTLED; deposit D1 400000 submitted and CONFIRMED."
            - "Run 2: period 2026-09-01..2026-09-15, pay_date 2026-09-18 (Fri), tax 350000, IMPOUNDED but NOT settled; deposit D2 350000 SCHEDULED only."
            - "Quarterly return for 2026-Q3 (QUARTERLY frequency return against the FED jurisdiction, period 2026-Q3)."
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { code: "FED-941", name: "IRS Form 941", deposit_frequency: "SEMIWEEKLY", penalty_tier1_rate: 0.02, penalty_tier2_rate: 0.05, penalty_tier3_rate: 0.10, underpayment_threshold_cents: 250000 }
              as: BureauCompliance
              captures: { j_fed: $.data.id }
            - call: "POST /clients"
              payload: { legal_name: "Acme Mills Inc", ein: "12-3456789" }
              as: BureauOnboarder
              captures: { cl_acme: $.data.id }
            - call: "POST /clients/${cl_acme}/begin-onboarding"
              payload: {}
              as: BureauOnboarder
            - call: "POST /clients/${cl_acme}/registrations"
              payload: { jurisdiction_id: "${j_fed}", agency_account_number: "EFTPS-1001", poa_document_ref: "POA-2026-001" }
              as: BureauOnboarder
              captures: { reg_fed: $.data.id }
            - call: "POST /registrations/${reg_fed}/verify"
              payload: {}
              as: BureauOnboarder
            - call: "POST /clients/${cl_acme}/activate"
              payload: {}
              as: BureauOnboarder
            - call: "POST /payroll-runs"
              payload: { client_id: "${cl_acme}", pay_date: "2026-09-04T00:00:00Z", period_start: "2026-08-16T00:00:00Z", period_end: "2026-08-31T00:00:00Z", gross_pay_cents: 2000000, total_tax_cents: 400000 }
              as: ClientPayrollAdmin
              as_user_id: "${cl_acme}"
              captures: { run_1: $.data.id }
            - call: "POST /payroll-runs/${run_1}/submit"
              payload: {}
              as: ClientPayrollAdmin
              as_user_id: "${cl_acme}"
            - call: "GET /clients/${cl_acme}"
              payload: {}
              as: BureauCompliance
              captures: { cl_v1: $.data.version }
            - call: "POST /payroll-runs/${run_1}/initiate-impound"
              payload: { expected_client_version: "${cl_v1}" }
              as: ClientPayrollAdmin
              as_user_id: "${cl_acme}"
              captures: { imp_1: $.data.id }
            - call: "POST /impounds/${imp_1}/settle"
              payload: {}
              as: BureauTreasury
            - call: "GET /payroll-runs/${run_1}"
              payload: {}
              as: BureauTaxFiler
              captures: { run_1_v: $.data.version }
            - call: "POST /payroll-runs/${run_1}/deposits"
              payload: { jurisdiction_id: "${j_fed}", amount_cents: 400000, expected_payroll_run_version: "${run_1_v}" }
              as: BureauTaxFiler
              captures: { dep_1: $.data.id }
            - call: "POST /deposits/${dep_1}/submit"
              payload: {}
              as: BureauTaxFiler
            - call: "POST /deposits/${dep_1}/confirm"
              payload: {}
              as: BureauTaxFiler
            - call: "POST /payroll-runs"
              payload: { client_id: "${cl_acme}", pay_date: "2026-09-18T00:00:00Z", period_start: "2026-09-01T00:00:00Z", period_end: "2026-09-15T00:00:00Z", gross_pay_cents: 1800000, total_tax_cents: 350000 }
              as: ClientPayrollAdmin
              as_user_id: "${cl_acme}"
              captures: { run_2: $.data.id }
            - call: "POST /payroll-runs/${run_2}/submit"
              payload: {}
              as: ClientPayrollAdmin
              as_user_id: "${cl_acme}"
            - call: "GET /clients/${cl_acme}"
              payload: {}
              as: BureauCompliance
              captures: { cl_v2: $.data.version }
            - call: "POST /payroll-runs/${run_2}/initiate-impound"
              payload: { expected_client_version: "${cl_v2}" }
              as: ClientPayrollAdmin
              as_user_id: "${cl_acme}"
              captures: { imp_2: $.data.id }
            - call: "GET /payroll-runs/${run_2}"
              payload: {}
              as: BureauTaxFiler
              captures: { run_2_v: $.data.version }
            - call: "POST /payroll-runs/${run_2}/deposits"
              payload: { jurisdiction_id: "${j_fed}", amount_cents: 350000, expected_payroll_run_version: "${run_2_v}" }
              as: BureauTaxFiler
              captures: { dep_2: $.data.id }
            - call: "GET /clients/${cl_acme}"
              payload: {}
              as: BureauCompliance
              captures: { cl_v3: $.data.version }
            - call: "POST /returns"
              payload: { client_id: "${cl_acme}", jurisdiction_id: "${j_fed}", period: "2026-Q3", expected_client_version: "${cl_v3}" }
              as: BureauTaxFiler
              captures: { ret_q3: $.data.id }
          trigger:
            - call: "POST /returns/${ret_q3}/file"
              payload: {}
              as: BureauTaxFiler
              as_user_id: "filer-alpha"
              captures: { liability_at_file: $.data.expected_liability_cents }
            - call: "POST /returns/${ret_q3}/accept"
              payload: {}
              as: BureauTaxFiler
              as_user_id: "filer-beta"
            - call: "POST /returns/${ret_q3}/reconcile"
              payload: {}
              as: BureauTaxFiler
              as_user_id: "filer-beta"
              captures: { liability_at_reconcile: $.data.expected_liability_cents }
          assert:
            - "liability_at_file == 750000  (400000 run1 SETTLED + 350000 run2 IMPOUNDED — bureau books count drafted funds)"
            - "liability_at_reconcile == 400000  (only deposit D1 is CONFIRMED for the quarter; D2 is still SCHEDULED and contributes nothing to the agency-confirmed view)"
            - "liability_at_file != liability_at_reconcile  (750000 != 400000 — identical period data, two variants)"
            - "TaxReturn.${ret_q3}.status == RECONCILED after the reconcile call"

      - name: wage_summary_as_issued_vs_as_filed_history
        grounds:
          - calculations.wage_statement_annual_total
          - state_machines.WageStatement.DRAFT_to_ISSUED
          - state_machines.WageStatement.ISSUED_to_CORRECTED
          - entities.WageStatement.fields.status
        distinguishing_aspect: |
          Entity domain: WageStatement annual totals (not return liability).
          Identical stored rows yield total_wages_cents 6000000 under the
          as-issued view but 11500000 under the include-voided audit view,
          because the original statement was voided after correction.
        test_recipe:
          setup:
            - "Clock advanced to 2027-01-15T00:00:00Z (tax year 2026 closed)."
            - "Client BIGCO ACTIVE with a VERIFIED registration (needed for activation only)."
            - "Employee E-100: ORIGINAL statement wages 5000000 ISSUED; CORRECTION wages 6000000 issued (original flips to CORRECTED); the CORRECTED original is then VOIDED; the correction remains ISSUED."
            - "Employee E-200: ORIGINAL statement wages 3000000 ISSUED (untouched)."
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { code: "FED-940", name: "IRS Form 940", deposit_frequency: "QUARTERLY", penalty_tier1_rate: 0.02, penalty_tier2_rate: 0.05, penalty_tier3_rate: 0.10, underpayment_threshold_cents: 50000 }
              as: BureauCompliance
              captures: { j_futa: $.data.id }
            - call: "POST /clients"
              payload: { legal_name: "BigCo Holdings", ein: "98-7654321" }
              as: BureauOnboarder
              captures: { cl_big: $.data.id }
            - call: "POST /clients/${cl_big}/begin-onboarding"
              payload: {}
              as: BureauOnboarder
            - call: "POST /clients/${cl_big}/registrations"
              payload: { jurisdiction_id: "${j_futa}", agency_account_number: "EFTPS-2002", poa_document_ref: "POA-2026-100" }
              as: BureauOnboarder
              captures: { reg_futa: $.data.id }
            - call: "POST /registrations/${reg_futa}/verify"
              payload: {}
              as: BureauOnboarder
            - call: "POST /clients/${cl_big}/activate"
              payload: {}
              as: BureauOnboarder
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-01-15T00:00:00Z" }
              as: BureauCompliance
            - call: "POST /wage-statements"
              payload: { client_id: "${cl_big}", tax_year: 2026, employee_ref: "E-100", wages_cents: 5000000, withheld_cents: 1000000 }
              as: BureauTaxFiler
              captures: { ws_orig: $.data.id }
            - call: "POST /wage-statements/${ws_orig}/issue"
              payload: {}
              as: BureauTaxFiler
            - call: "POST /wage-statements"
              payload: { client_id: "${cl_big}", tax_year: 2026, employee_ref: "E-100", wages_cents: 6000000, withheld_cents: 1200000, corrects_statement_id: "${ws_orig}" }
              as: BureauTaxFiler
              captures: { ws_corr: $.data.id }
            - call: "POST /wage-statements/${ws_corr}/issue"
              payload: {}
              as: BureauTaxFiler
            - call: "POST /wage-statements/${ws_orig}/void"
              payload: {}
              as: BureauTaxFiler
            - call: "POST /wage-statements"
              payload: { client_id: "${cl_big}", tax_year: 2026, employee_ref: "E-200", wages_cents: 3000000, withheld_cents: 600000 }
              as: BureauTaxFiler
              captures: { ws_e200: $.data.id }
            - call: "POST /wage-statements/${ws_e200}/issue"
              payload: {}
              as: BureauTaxFiler
          trigger:
            - call: "GET /clients/${cl_big}/wage-statements/summary"
              payload: { tax_year: 2026 }
              as: BureauTaxFiler
              captures: { active_wages: $.data.total_wages_cents, active_withheld: $.data.total_withheld_cents, active_count: $.data.active_statement_count, voided_bucket: $.data.voided_total_cents }
            - call: "GET /clients/${cl_big}/wage-statements/summary"
              payload: { tax_year: 2026, include_voided: true }
              as: BureauTaxFiler
              captures: { hist_wages: $.data.total_wages_cents, hist_withheld: $.data.total_withheld_cents }
          assert:
            - "active_wages == 9000000  (6000000 E-100 correction + 3000000 E-200)"
            - "active_withheld == 1800000"
            - "active_count == 2"
            - "voided_bucket == 5000000  (the voided original)"
            - "hist_wages == 14000000  (9000000 + 5000000 voided folded in)"
            - "hist_withheld == 2800000"
            - "hist_wages != active_wages — identical rows, two variants, different totals"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: late_deposit_penalty_tiered_threshold
        grounds:
          - calculations.late_deposit_penalty
          - calculations.deposit_due_date
          - entities.TaxDeposit.fields.late_days
          - entities.TaxDeposit.fields.penalty_exposure_cents
        distinguishing_aspect: |
          Mode (a): >=3 inputs (amount, late_days, three tier rates) with
          tiered-rate conditional branches and INCLUSIVE tier edges. A
          1000000-cent deposit confirmed exactly 5 days late
          (confirmed Mon 2026-09-14 against a due date of Wed 2026-09-09) lands in tier 1
          (20000), while 6 days late lands in tier 2 (50000): the boundary
          day flips the rate.
        test_recipe:
          setup:
            - "Clock at default 2026-09-01T00:00:00Z."
            - "FED-941 SEMIWEEKLY jurisdiction, tiers 0.02 / 0.05 / 0.10."
            - "Client with VERIFIED FED registration, ACTIVE."
            - "Run pay_date 2026-09-04 (Friday) -> SEMIWEEKLY due date Wednesday 2026-09-09; run SETTLED; deposit D of 1000000 SCHEDULED."
            - "Deposit submitted on 2026-09-08, confirmed by the agency on 2026-09-14 (5 calendar days after due date: 9/10,11,12,13,14)."
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { code: "FED-941", name: "IRS Form 941", deposit_frequency: "SEMIWEEKLY", penalty_tier1_rate: 0.02, penalty_tier2_rate: 0.05, penalty_tier3_rate: 0.10, underpayment_threshold_cents: 250000 }
              as: BureauCompliance
              captures: { j_fed: $.data.id }
            - call: "POST /clients"
              payload: { legal_name: "Tier Test Co", ein: "11-1111111" }
              as: BureauOnboarder
              captures: { cl_t: $.data.id }
            - call: "POST /clients/${cl_t}/begin-onboarding"
              payload: {}
              as: BureauOnboarder
            - call: "POST /clients/${cl_t}/registrations"
              payload: { jurisdiction_id: "${j_fed}", agency_account_number: "EFTPS-T1", poa_document_ref: "POA-T1" }
              as: BureauOnboarder
              captures: { reg_t: $.data.id }
            - call: "POST /registrations/${reg_t}/verify"
              payload: {}
              as: BureauOnboarder
            - call: "POST /clients/${cl_t}/activate"
              payload: {}
              as: BureauOnboarder
            - call: "POST /payroll-runs"
              payload: { client_id: "${cl_t}", pay_date: "2026-09-04T00:00:00Z", period_start: "2026-08-22T00:00:00Z", period_end: "2026-09-04T00:00:00Z", gross_pay_cents: 5000000, total_tax_cents: 1000000 }
              as: ClientPayrollAdmin
              as_user_id: "${cl_t}"
              captures: { run_t: $.data.id }
            - call: "POST /payroll-runs/${run_t}/submit"
              payload: {}
              as: ClientPayrollAdmin
              as_user_id: "${cl_t}"
            - call: "GET /clients/${cl_t}"
              payload: {}
              as: BureauCompliance
              captures: { cl_t_v: $.data.version }
            - call: "POST /payroll-runs/${run_t}/initiate-impound"
              payload: { expected_client_version: "${cl_t_v}" }
              as: ClientPayrollAdmin
              as_user_id: "${cl_t}"
              captures: { imp_t: $.data.id }
            - call: "POST /impounds/${imp_t}/settle"
              payload: {}
              as: BureauTreasury
            - call: "GET /payroll-runs/${run_t}"
              payload: {}
              as: BureauTaxFiler
              captures: { run_t_v: $.data.version }
            - call: "POST /payroll-runs/${run_t}/deposits"
              payload: { jurisdiction_id: "${j_fed}", amount_cents: 1000000, expected_payroll_run_version: "${run_t_v}" }
              as: BureauTaxFiler
              captures: { dep_t: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-08T10:00:00Z" }
              as: BureauCompliance
            - call: "POST /deposits/${dep_t}/submit"
              payload: {}
              as: BureauTaxFiler
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-14T09:00:00Z" }
              as: BureauCompliance
            - call: "POST /deposits/${dep_t}/confirm"
              payload: {}
              as: BureauTaxFiler
              captures: { late_d: $.data.late_days, pen_d: $.data.penalty_exposure_cents }
          assert:
            - "TaxDeposit.${dep_t}.due_date date portion == 2026-09-09 (Fri pay date -> next Wednesday)"
            - "late_d == 5"
            - "pen_d == 20000  (1000000 * 0.02, tier 1 — 5 days is INCLUSIVE in tier 1)"
            - "pen_d != 50000  (tier 2 starts at 6 days)"

      - name: shortfall_penalty_pinned_evaluation_order
        grounds:
          - calculations.shortfall_penalty
          - calculations.agency_liability_reconciliation
          - entities.TaxReturn.fields.shortfall_penalty_exposure_cents
        distinguishing_aspect: |
          Mode (c): circular-looking dependency resolved by pinned evaluation
          order — the penalty is keyed on liability, but liability (bureau
          books) includes runs whose deposits are unconfirmed; the scaffold
          pins liability FIRST (bureau-books variant), then the safe-harbor
          threshold comparison, then the shortfall. Confirmed deposits
          300000 >= threshold 250000 -> safe harbor zeroes the penalty even
          though liability is 900000.
        test_recipe:
          setup:
            - "Clock at 2026-10-05T00:00:00Z (Q3 closed 2026-09-30; filing window reached)."
            - "CA-DE9 QUARTERLY jurisdiction, tiers 0.02/0.05/0.10, underpayment_threshold_cents 250000."
            - "Client with VERIFIED CA registration, ACTIVE."
            - "Three SETTLED runs in Q3 with taxes 300000 each (liability 900000)."
            - "Only ONE deposit of 300000 for the quarter is CONFIRMED; the other two remain SCHEDULED (unsubmitted)."
            - "Quarterly return 2026-Q3 filed."
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { code: "CA-DE9", name: "CA EDD DE9", deposit_frequency: "QUARTERLY", penalty_tier1_rate: 0.02, penalty_tier2_rate: 0.05, penalty_tier3_rate: 0.10, underpayment_threshold_cents: 250000 }
