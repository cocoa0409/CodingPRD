scaffold_difficulty_design:
  # =========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: dividend_provisional_vs_final_on_member
        grounds:
          - calculations.dividend_payout
          - entities.Member.eligible_spend_cents
          - state_machines.DividendDeclaration.DRAFT_to_FINALIZED
        distinguishing_aspect: "The same Member.eligible_spend_cents=200000 yields provisional_dividend_cents=10000 (rate 0.05) but final_dividend_cents=16000 (declared_rate 0.08) — two variants on the Member domain."
        test_recipe:
          setup:
            - "Clock 2026-07-01; one PREMIER ACTIVE member with a single COMPLETED purchase giving eligible_spend_cents=200000; a DRAFT DividendDeclaration for 2026 at declared_rate 0.08."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: CoopAdmin
            - call: "POST /coop/products"
              payload: { sku: "DIV-TENT", name: "Base Camp Tent", category: "TENT", retail_price_cents: 200000, tax_rate: 0.05, replacement_value_cents: 300000 }
              as: CoopAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /coop/members"
              payload: { email: "div@x.com", full_name: "Div Member", membership_tier: "PREMIER" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /coop/members/${m_id}/activate"
              payload: {}
              as: StoreStaff
            - call: "POST /coop/purchases"
              payload: { member_id: "${m_id}", line_items: [ { product_id: "${prod_id}", quantity: 1, unit_price_cents: 200000 } ] }
              as: StoreStaff
              captures: { pur_id: $.data.id }
            - call: "POST /coop/dividend-declarations"
              payload: { year: 2026, declared_rate: 0.08 }
              as: CoopAdmin
              captures: { decl_id: $.data.id }
          trigger:
            - call: "GET /coop/members/${m_id}/summary"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
              captures: { prov: $.data.provisional_dividend_cents }
            - call: "POST /coop/dividend-declarations/${decl_id}/finalize"
              payload: {}
              as: CoopAdmin
          assert:
            - "GET /coop/members/${m_id}/summary provisional_dividend_cents == 10000"
            - "DividendDeclaration.${decl_id}.total_payout_cents == 16000"
            - "Member.${m_id}.wallet_credit_cents == 16000 after finalize"

      - name: tradein_cash_vs_credit_on_tradein
        grounds:
          - calculations.trade_in_valuation
          - entities.TradeIn.offered_cash_cents
          - entities.TradeIn.offered_credit_cents
          - state_machines.TradeIn.SUBMITTED_to_OFFERED
        distinguishing_aspect: "Grade-B trade-in of a retail_price_cents=100000 product yields offered_cash_cents=28000 (x0.80) but offered_credit_cents=35000 (x1.00) — two variants on the TradeIn domain."
        test_recipe:
          setup:
            - "One ACTIVE member; a product with retail_price_cents=100000; a SUBMITTED trade-in of grade B; then a staff offer."
          setup_api_calls:
            - call: "POST /coop/products"
              payload: { sku: "TI-BAG", name: "Down Bag", category: "SLEEPING", retail_price_cents: 100000, tax_rate: 0.05, replacement_value_cents: 150000 }
              as: CoopAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /coop/members"
              payload: { email: "ti@x.com", full_name: "Trade Member" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /coop/members/${m_id}/activate"
              payload: {}
              as: StoreStaff
            - call: "POST /coop/trade-ins"
              payload: { member_id: "${m_id}", product_id: "${prod_id}", condition_grade: "B" }
              as: Member
              as_user_id: "${m_id}"
              captures: { ti_id: $.data.id }
          trigger:
            - call: "POST /coop/trade-ins/${ti_id}/offer"
              payload: {}
              as: StoreStaff
              captures: { cash: $.data.offered_cash_cents, credit: $.data.offered_credit_cents }
          assert:
            - "TradeIn.${ti_id}.offered_cash_cents == 28000"
            - "TradeIn.${ti_id}.offered_credit_cents == 35000"
            - "TradeIn.${ti_id}.offered_credit_cents != TradeIn.${ti_id}.offered_cash_cents"

  # =========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: rental_fee_peak_tier_cap_mode_a
        grounds:
          - calculations.rental_fee_cents
          - entities.RentalReservation.rental_fee_cents
          - entities.RentalReservation.rental_days
        distinguishing_aspect: "Mode (a): rental_fee_cents combines rental_days=4, base_daily_rate_cents=5000, peak x1.25, PREMIER discount 0.10 and a replacement-value min-cap, non-linearly → 22500."
        test_recipe:
          setup:
            - "Clock 2026-07-01; PREMIER ACTIVE member; rentable product base_daily_rate_cents=5000, replacement_value_cents=300000; one AVAILABLE unit; reservation window 2026-07-10..2026-07-14 (peak, 4 days)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: CoopAdmin
            - call: "POST /coop/products"
              payload: { sku: "RN-TENT", name: "Rental Tent", category: "TENT", retail_price_cents: 250000, tax_rate: 0.05, replacement_value_cents: 300000, is_rentable: true, base_daily_rate_cents: 5000 }
              as: CoopAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /coop/rental-units"
              payload: { product_id: "${prod_id}", asset_tag: "RN-001" }
              as: CoopAdmin
              captures: { unit_id: $.data.id }
            - call: "POST /coop/members"
              payload: { email: "rent@x.com", full_name: "Rent Member", membership_tier: "PREMIER" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /coop/members/${m_id}/activate"
              payload: {}
              as: StoreStaff
          trigger:
            - call: "POST /coop/reservations"
              payload: { member_id: "${m_id}", rental_unit_id: "${unit_id}", start_date: "2026-07-10T00:00:00Z", end_date: "2026-07-14T00:00:00Z" }
              as: Member
              as_user_id: "${m_id}"
              captures: { res_id: $.data.id, fee: $.data.rental_fee_cents }
          assert:
            - "RentalReservation.${res_id}.rental_days == 4"
            - "RentalReservation.${res_id}.rental_fee_cents == 22500"

      - name: purchase_per_line_tax_rounding_mode_b
        grounds:
          - calculations.purchase_totals
          - entities.Purchase.tax_cents
          - entities.Purchase.total_cents
        distinguishing_aspect: "Mode (b): two lines of 1005 at tax_rate 0.05 give per-line round(50.25)=50 each summing to tax_cents=100, whereas sum-then-round(2010*0.05=100.5)=101 — the per-line-then-sum order is pinned."
        test_recipe:
          setup:
            - "One ACTIVE member; a product priced 1005 with tax_rate 0.05; a purchase of two identical lines."
          setup_api_calls:
            - call: "POST /coop/products"
              payload: { sku: "PX-CUP", name: "Camp Cup", category: "COOKING", retail_price_cents: 1005, tax_rate: 0.05, replacement_value_cents: 2000 }
              as: CoopAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /coop/members"
              payload: { email: "tax@x.com", full_name: "Tax Member" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /coop/members/${m_id}/activate"
              payload: {}
              as: StoreStaff
          trigger:
            - call: "POST /coop/purchases"
              payload: { member_id: "${m_id}", line_items: [ { product_id: "${prod_id}", quantity: 1, unit_price_cents: 1005 }, { product_id: "${prod_id}", quantity: 1, unit_price_cents: 1005 } ] }
              as: StoreStaff
              captures: { pur_id: $.data.id, tax: $.data.tax_cents, total: $.data.total_cents }
          assert:
            - "Purchase.${pur_id}.subtotal_cents == 2010"
            - "Purchase.${pur_id}.tax_cents == 100"
            - "Purchase.${pur_id}.total_cents == 2110"

  # =========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: tradein_offer_counter_cycle
        grounds:
          - state_machines.TradeIn.OFFERED_to_COUNTERED
          - state_machines.TradeIn.COUNTERED_to_OFFERED
          - entities.TradeIn.rounds
        distinguishing_aspect: "TradeIn cycles OFFERED->COUNTERED->OFFERED (cyclic negotiation loop); after one loop rounds==1 and status is back to OFFERED — non-linear on the TradeIn entity."
        test_recipe:
          setup:
            - "One ACTIVE member; product retail_price_cents=100000; a SUBMITTED grade-A trade-in already advanced to OFFERED by a first staff offer."
          setup_api_calls:
            - call: "POST /coop/products"
              payload: { sku: "TI-AXE", name: "Ice Axe", category: "CLIMBING", retail_price_cents: 100000, tax_rate: 0.05, replacement_value_cents: 120000 }
              as: CoopAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /coop/members"
              payload: { email: "cyc@x.com", full_name: "Cycle Member" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /coop/members/${m_id}/activate"
              payload: {}
              as: StoreStaff
            - call: "POST /coop/trade-ins"
              payload: { member_id: "${m_id}", product_id: "${prod_id}", condition_grade: "A" }
              as: Member
              as_user_id: "${m_id}"
              captures: { ti_id: $.data.id }
            - call: "POST /coop/trade-ins/${ti_id}/offer"
              payload: {}
              as: StoreStaff
          trigger:
            - call: "POST /coop/trade-ins/${ti_id}/counter"
              payload: { counter_ask_cents: 45000 }
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /coop/trade-ins/${ti_id}/offer"
              payload: {}
              as: StoreStaff
              captures: { status2: $.data.status, rounds2: $.data.rounds }
          assert:
            - "TradeIn.${ti_id}.status == OFFERED"
            - "TradeIn.${ti_id}.rounds == 1"

      - name: repair_parallel_repair_and_billing_dimensions
        grounds:
          - state_machines.RepairOrder.DIAGNOSED_to_IN_REPAIR
          - state_machines.RepairOrder.INVOICED_to_SETTLED
          - entities.RepairOrder.repair_stage
          - entities.RepairOrder.billing_stage
        distinguishing_aspect: "RepairOrder billing_stage reaches SETTLED while repair_stage is still IN_REPAIR — the two dimensions advance independently on one RepairOrder (parallel), a different entity than TradeIn."
        test_recipe:
          setup:
            - "Clock 2026-07-01; ACTIVE member; product; a RepairOrder with purchase_date 2020-01-01 (out of warranty) diagnosed with labor 5000 (DENIED, billed 5000), started (IN_REPAIR + INVOICED), then invoice settled."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: CoopAdmin
            - call: "POST /coop/products"
              payload: { sku: "RP-STOVE", name: "Stove", category: "COOKING", retail_price_cents: 40000, tax_rate: 0.05, replacement_value_cents: 45000 }
              as: CoopAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /coop/members"
              payload: { email: "rep@x.com", full_name: "Repair Member" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /coop/members/${m_id}/activate"
              payload: {}
              as: StoreStaff
            - call: "POST /coop/repair-orders"
              payload: { member_id: "${m_id}", product_id: "${prod_id}", purchase_date: "2020-01-01T00:00:00Z" }
              as: StoreStaff
              captures: { ro_id: $.data.id }
            - call: "POST /coop/repair-orders/${ro_id}/diagnose"
              payload: { labor_cents: 5000, parts_cents: 0 }
              as: StoreStaff
          trigger:
            - call: "POST /coop/repair-orders/${ro_id}/start"
              payload: {}
              as: StoreStaff
            - call: "POST /coop/repair-orders/${ro_id}/settle"
              payload: {}
              as: StoreStaff
              captures: { rs: $.data.repair_stage, bs: $.data.billing_stage }
          assert:
            - "RepairOrder.${ro_id}.warranty_status == DENIED"
            - "RepairOrder.${ro_id}.billed_cents == 5000"
            - "RepairOrder.${ro_id}.repair_stage == IN_REPAIR"
            - "RepairOrder.${ro_id}.billing_stage == SETTLED"

  # =========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: trip_cancel_cascade_depth3
        grounds:
          - state_machines.Trip.OPEN_to_CANCELLED
          - state_machines.TripBooking.CONFIRMED_to_CANCELLED
          - entities.Member.loyalty_points_balance
          - entities.Member.wallet_credit_cents
        distinguishing_aspect: "Cancelling a Trip cascades depth-3: Trip->CANCELLED drives TripBooking->CANCELLED, which appends a +1000 LoyaltyLedger reversal, which recomputes Member.loyalty_points_balance back to 1000 (and wallet_credit_cents to 4000)."
        test_recipe:
          setup:
            - "Clock 2026-07-01; ACTIVE member who earned 1000 points via a 100000 purchase; guide+OPEN trip (capacity 2, price 5000); member booked one seat redeeming 1000 points (balance 0)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: CoopAdmin
            - call: "POST /coop/products"
              payload: { sku: "CS-JKT", name: "Jacket", category: "APPAREL", retail_price_cents: 100000, tax_rate: 0.05, replacement_value_cents: 120000 }
              as: CoopAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /coop/members"
              payload: { email: "casc@x.com", full_name: "Cascade Member" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /coop/members/${m_id}/activate"
              payload: {}
              as: StoreStaff
            - call: "POST /coop/purchases"
              payload: { member_id: "${m_id}", line_items: [ { product_id: "${prod_id}", quantity: 1, unit_price_cents: 100000 } ] }
              as: StoreStaff
              captures: { pur_id: $.data.id }
            - call: "POST /coop/guides"
              payload: { full_name: "Guide One", certifications: [] }
              as: CoopAdmin
              captures: { g_id: $.data.id }
            - call: "POST /coop/trips"
              payload: { title: "Day Hike", start_time: "2026-08-01T09:00:00Z", end_time: "2026-08-01T17:00:00Z", capacity: 2, price_cents: 5000, required_certification: "NONE" }
              as: CoopAdmin
              captures: { trip_id: $.data.id }
            - call: "POST /coop/trips/${trip_id}/assign-guide"
              payload: { guide_id: "${g_id}" }
              as: CoopAdmin
            - call: "POST /coop/trips/${trip_id}/open"
              payload: {}
              as: CoopAdmin
            - call: "POST /coop/trips/${trip_id}/bookings"
              payload: { member_id: "${m_id}", points_redeemed: 1000 }
              as: Member
              as_user_id: "${m_id}"
              captures: { bk_id: $.data.id }
          trigger:
            - call: "POST /coop/trips/${trip_id}/cancel"
              payload: {}
              as: CoopAdmin
          assert:
            - "Trip.${trip_id}.status == CANCELLED"
            - "TripBooking.${bk_id}.status == CANCELLED"
            - "Member.${m_id}.loyalty_points_balance == 1000"
            - "Member.${m_id}.wallet_credit_cents == 4000"

      - name: rental_damage_cascade_depth2
        grounds:
          - state_machines.RentalReservation.PICKED_UP_to_DAMAGE_ASSESSED
          - state_machines.RentalUnit.RENTED_OUT_to_OUT_OF_SERVICE
          - entities.RepairOrder.rental_unit_id
        distinguishing_aspect: "Returning a rental DAMAGED cascades depth-2 from a distinct trigger: RentalReservation->DAMAGE_ASSESSED drives RentalUnit->OUT_OF_SERVICE, which auto-creates a RECEIVED RepairOrder for that unit."
        test_recipe:
          setup:
            - "Clock 2026-07-01; ACTIVE member; rentable product base_daily_rate_cents=4000, replacement 200000; one AVAILABLE unit; reservation 2026-07-05..2026-07-07 then picked up (unit RENTED_OUT)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: CoopAdmin
            - call: "POST /coop/products"
              payload: { sku: "DM-KAYAK", name: "Kayak", category: "PADDLE", retail_price_cents: 180000, tax_rate: 0.05, replacement_value_cents: 200000, is_rentable: true, base_daily_rate_cents: 4000 }
              as: CoopAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /coop/rental-units"
              payload: { product_id: "${prod_id}", asset_tag: "DM-001" }
              as: CoopAdmin
              captures: { unit_id: $.data.id }
            - call: "POST /coop/members"
              payload: { email: "dmg@x.com", full_name: "Damage Member" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /coop/members/${m_id}/activate"
              payload: {}
              as: StoreStaff
            - call: "POST /coop/reservations"
              payload: { member_id: "${m_id}", rental_unit_id: "${unit_id}", start_date: "2026-07-05T00:00:00Z", end_date: "2026-07-07T00:00:00Z" }
              as: Member
              as_user_id: "${m_id}"
              captures: { res_id: $.data.id }
            - call: "POST /coop/reservations/${res_id}/pickup"
              payload: {}
              as: StoreStaff
          trigger:
            - call: "POST /coop/reservations/${res_id}/return"
              payload: { condition: "DAMAGED" }
              as: StoreStaff
          assert:
            - "RentalReservation.${res_id}.status == DAMAGE_ASSESSED"
            - "RentalUnit.${unit_id}.status == OUT_OF_SERVICE"
            - "RentalUnit.${unit_id}.condition == DAMAGED"
            - "GET /coop/repair-orders?rental_unit_id=${unit_id} returns total_count == 1 with data[0].repair_stage == RECEIVED"

  # =========================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_fiscal_booking_returns_trip_not_open
        grounds:
          - validations[priority=4]
          - validations[priority=8]
          - errors[ERR_TRIP_NOT_OPEN]
          - errors[ERR_INSUFFICIENT_POINTS]
        distinguishing_aspect: "A booking that both targets a DRAFT (non-OPEN) trip (state, pri 4) AND redeems 5000 points the member does not hold (business_fiscal, pri 8) returns ERR_TRIP_NOT_OPEN — state beats fiscal."
        test_recipe:
          setup:
            - "One ACTIVE member with 0 loyalty points; a DRAFT trip (guide assigned but not opened)."
          setup_api_calls:
            - call: "POST /coop/members"
              payload: { email: "sf@x.com", full_name: "SF Member" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /coop/members/${m_id}/activate"
              payload: {}
              as: StoreStaff
            - call: "POST /coop/guides"
              payload: { full_name: "Guide SF", certifications: [] }
              as: CoopAdmin
              captures: { g_id: $.data.id }
            - call: "POST /coop/trips"
              payload: { title: "Draft Trip", start_time: "2026-08-02T09:00:00Z", end_time: "2026-08-02T17:00:00Z", capacity: 5, price_cents: 5000, required_certification: "NONE" }
              as: CoopAdmin
              captures: { trip_id: $.data.id }
            - call: "POST /coop/trips/${trip_id}/assign-guide"
              payload: { guide_id: "${g_id}" }
              as: CoopAdmin
          trigger:
            - call: "POST /coop/trips/${trip_id}/bookings"
              payload: { member_id: "${m_id}", points_redeemed: 5000 }
              as: Member
              as_user_id: "${m_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_TRIP_NOT_OPEN"
            - "HTTP status == 409"

      - name: safety_vs_temporal_assign_guide_returns_not_certified
        grounds:
          - validations[priority=5]
          - validations[priority=6]
          - errors[ERR_GUIDE_NOT_CERTIFIED]
          - errors[ERR_GUIDE_SCHEDULE_CONFLICT]
        distinguishing_aspect: "Assigning a guide who both lacks ALPINE (business_safety, pri 5) AND is already on an overlapping trip (business_temporal, pri 6) returns ERR_GUIDE_NOT_CERTIFIED — safety beats temporal."
        test_recipe:
          setup:
            - "A guide with no certifications assigned to trip B (required NONE, 2026-08-01 09:00-17:00); trip A requires ALPINE and overlaps B (2026-08-01 12:00-14:00)."
          setup_api_calls:
            - call: "POST /coop/guides"
              payload: { full_name: "Guide ST", certifications: [] }
              as: CoopAdmin
              captures: { g_id: $.data.id }
            - call: "POST /coop/trips"
              payload: { title: "Trip B", start_time: "2026-08-01T09:00:00Z", end_time: "2026-08-01T17:00:00Z", capacity: 4, price_cents: 6000, required_certification: "NONE" }
              as: CoopAdmin
              captures: { tB_id: $.data.id }
            - call: "POST /coop/trips/${tB_id}/assign-guide"
              payload: { guide_id: "${g_id}" }
              as: CoopAdmin
            - call: "POST /coop/trips"
              payload: { title: "Trip A", start_time: "2026-08-01T12:00:00Z", end_time: "2026-08-01T14:00:00Z", capacity: 4, price_cents: 6000, required_certification: "ALPINE" }
              as: CoopAdmin
              captures: { tA_id: $.data.id }
          trigger:
            - call: "POST /coop/trips/${tA_id}/assign-guide"
              payload: { guide_id: "${g_id}" }
              as: CoopAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_GUIDE_NOT_CERTIFIED"
            - "HTTP status == 409"

  # =========================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: dividend_eligibility_threshold_ge_boundary
        grounds:
          - calculations.dividend_payout
          - state_machines.DividendDeclaration.DRAFT_to_FINALIZED
          - entities.Member.eligible_spend_cents
        distinguishing_aspect: "A member whose eligible_spend_cents == MIN_ELIGIBLE_SPEND_CENTS (exactly 100000) IS paid a final dividend (>= boundary, not >): final_dividend_cents = floor(100000*0.10) = 10000."
        test_recipe:
          setup:
            - "Clock 2026-07-01; ACTIVE member with a single 100000 purchase (eligible_spend_cents exactly 100000); DRAFT DividendDeclaration 2026 at rate 0.10."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: CoopAdmin
            - call: "POST /coop/products"
              payload: { sku: "BD-PAD", name: "Sleep Pad", category: "SLEEPING", retail_price_cents: 100000, tax_rate: 0.05, replacement_value_cents: 110000 }
              as: CoopAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /coop/members"
              payload: { email: "bd@x.com", full_name: "Boundary Member" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /coop/members/${m_id}/activate"
              payload: {}
              as: StoreStaff
            - call: "POST /coop/purchases"
              payload: { member_id: "${m_id}", line_items: [ { product_id: "${prod_id}", quantity: 1, unit_price_cents: 100000 } ] }
              as: StoreStaff
              captures: { pur_id: $.data.id }
            - call: "POST /coop/dividend-declarations"
              payload: { year: 2026, declared_rate: 0.10 }
              as: CoopAdmin
              captures: { decl_id: $.data.id }
          trigger:
            - call: "POST /coop/dividend-declarations/${decl_id}/finalize"
              payload: {}
              as: CoopAdmin
          assert:
            - "DividendDeclaration.${decl_id}.total_payout_cents == 10000"
            - "Member.${m_id}.wallet_credit_cents == 10000"

      - name: trip_capacity_full_eq_boundary
        grounds:
          - validations[priority=7]
          - errors[ERR_TRIP_FULL]
          - calculations.trip_seat_occupancy
          - entities.Trip.seats_confirmed
        distinguishing_aspect: "With capacity 1, one confirmed booking makes seats_confirmed == capacity; a second booking is rejected with ERR_TRIP_FULL — boundary is == capacity (capacity-1 succeeds), a different metric/endpoint than the dividend threshold."
        test_recipe:
          setup:
            - "Two ACTIVE members; guide+OPEN trip capacity 1 price 3000; member 1 has booked the only seat (seats_confirmed == 1)."
          setup_api_calls:
            - call: "POST /coop/members"
              payload: { email: "cap1@x.com", full_name: "Cap One" }
              as: Anonymous
              captures: { m1_id: $.data.id }
            - call: "POST /coop/members/${m1_id}/activate"
              payload: {}
              as: StoreStaff
            - call: "POST /coop/members"
              payload: { email: "cap2@x.com", full_name: "Cap Two" }
              as: Anonymous
              captures: { m2_id: $.data.id }
            - call: "POST /coop/members/${m2_id}/activate"
              payload: {}
              as: StoreStaff
            - call: "POST /coop/guides"
              payload: { full_name: "Guide Cap", certifications: [] }
              as: CoopAdmin
              captures: { g_id: $.data.id }
            - call: "POST /coop/trips"
              payload: { title: "Small Trip", start_time: "2026-08-03T09:00:00Z", end_time: "2026-08-03T12:00:00Z", capacity: 1, price_cents: 3000, required_certification: "NONE" }
              as: CoopAdmin
              captures: { trip_id: $.data.id }
            - call: "POST /coop/trips/${trip_id}/assign-guide"
              payload: { guide_id: "${g_id}" }
              as: CoopAdmin
            - call: "POST /coop/trips/${trip_id}/open"
              payload: {}
              as: CoopAdmin
            - call: "POST /coop/trips/${trip_id}/bookings"
              payload: { member_id: "${m1_id}" }
              as: Member
              as_user_id: "${m1_id}"
              captures: { bk1_id: $.data.id }
          trigger:
            - call: "POST /coop/trips/${trip_id}/bookings"
              payload: { member_id: "${m2_id}" }
              as: Member
              as_user_id: "${m2_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Trip.${trip_id}.seats_confirmed == 1"
            - "response error_id == ERR_TRIP_FULL"
            - "HTTP status == 409"

  # =========================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: reservation_requires_unit_not_out_of_service
        grounds:
          - validations[priority=4]
          - errors[ERR_RENTAL_UNIT_UNAVAILABLE]
          - state_machines.RentalUnit.AVAILABLE_to_OUT_OF_SERVICE
        distinguishing_aspect: "Creating a RentalReservation depends on the referenced RentalUnit's state: a unit retired to OUT_OF_SERVICE cannot be reserved and yields ERR_RENTAL_UNIT_UNAVAILABLE (RentalReservation->RentalUnit pair)."
        test_recipe:
          setup:
            - "Clock 2026-07-01; ACTIVE member; rentable product; one unit retired to OUT_OF_SERVICE via service RETIRE."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: CoopAdmin
            - call: "POST /coop/products"
              payload: { sku: "OS-TENT", name: "OOS Tent", category: "TENT", retail_price_cents: 90000, tax_rate: 0.05, replacement_value_cents: 100000, is_rentable: true, base_daily_rate_cents: 3000 }
              as: CoopAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /coop/rental-units"
              payload: { product_id: "${prod_id}", asset_tag: "OS-001" }
              as: CoopAdmin
              captures: { unit_id: $.data.id }
            - call: "POST /coop/members"
              payload: { email: "os@x.com", full_name: "OOS Member" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /coop/members/${m_id}/activate"
              payload: {}
              as: StoreStaff
            - call: "POST /coop/rental-units/${unit_id}/service"
              payload: { action: "RETIRE" }
              as: StoreStaff
          trigger:
            - call: "POST /coop/reservations"
              payload: { member_id: "${m_id}", rental_unit_id: "${unit_id}", start_date: "2026-07-10T00:00:00Z", end_date: "2026-07-12T00:00:00Z" }
              as: Member
              as_user_id: "${m_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_RENTAL_UNIT_UNAVAILABLE"
            - "HTTP status == 409"

      - name: booking_requires_member_active
        grounds:
          - validations[priority=4]
          - errors[ERR_MEMBERSHIP_NOT_ACTIVE]
          - state_machines.Member.ACTIVE_to_LAPSED
        distinguishing_aspect: "Creating a TripBooking depends on the acting Member's state: a LAPSED member's booking on an OPEN trip yields ERR_MEMBERSHIP_NOT_ACTIVE (TripBooking->Member pair, distinct from RentalReservation->RentalUnit)."
        test_recipe:
          setup:
            - "A member activated then LAPSED; a guide-assigned OPEN trip (capacity 3)."
          setup_api_calls:
            - call: "POST /coop/members"
              payload: { email: "lap@x.com", full_name: "Lapse Member" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /coop/members/${m_id}/activate"
              payload: {}
              as: StoreStaff
            - call: "POST /coop/members/${m_id}/lapse"
              payload: {}
              as: CoopAdmin
            - call: "POST /coop/guides"
              payload: { full_name: "Guide Lap", certifications: [] }
              as: CoopAdmin
              captures: { g_id: $.data.id }
            - call: "POST /coop/trips"
              payload: { title: "Open Trip", start_time: "2026-08-04T09:00:00Z", end_time: "2026-08-04T17:00:00Z", capacity: 3, price_cents: 4000, required_certification: "NONE" }
              as: CoopAdmin
              captures: { trip_id: $.data.id }
            - call: "POST /coop/trips/${trip_id}/assign-guide"
              payload: { guide_id: "${g_id}" }
              as: CoopAdmin
            - call: "POST /coop/trips/${trip_id}/open"
              payload: {}
              as: CoopAdmin
          trigger:
            - call: "POST /coop/trips/${trip_id}/bookings"
              payload: { member_id: "${m_id}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_MEMBERSHIP_NOT_ACTIVE"
            - "HTTP status == 409"

  # =========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: rental_window_buffer_overlap_halfopen
        grounds:
          - calculations.rental_window_conflict
          - validations[priority=6]
          - errors[ERR_RENTAL_WINDOW_CONFLICT]
        distinguishing_aspect: "On RentalUnit: a second reservation starting 2026-08-05 collides with the first ([2026-08-01,2026-08-05)) because the 1-day TURNAROUND_BUFFER_DAYS gap is not met — half-open windows plus a buffer."
        test_recipe:
          setup:
            - "Clock 2026-07-01; ACTIVE member; rentable product base 3000; one unit with an existing reservation [2026-08-01,2026-08-05)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: CoopAdmin
            - call: "POST /coop/products"
              payload: { sku: "WB-TENT", name: "Window Tent", category: "TENT", retail_price_cents: 90000, tax_rate: 0.05, replacement_value_cents: 100000, is_rentable: true, base_daily_rate_cents: 3000 }
              as: CoopAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /coop/rental-units"
              payload: { product_id: "${prod_id}", asset_tag: "WB-001" }
              as: CoopAdmin
              captures: { unit_id: $.data.id }
            - call: "POST /coop/members"
              payload: { email: "wb@x.com", full_name: "Window Member" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /coop/members/${m_id}/activate"
              payload: {}
              as: StoreStaff
            - call: "POST /coop/reservations"
              payload: { member_id: "${m_id}", rental_unit_id: "${unit_id}", start_date: "2026-08-01T00:00:00Z", end_date: "2026-08-05T00:00:00Z" }
              as: Member
              as_user_id: "${m_id}"
              captures: { res1_id: $.data.id }
          trigger:
            - call: "POST /coop/reservations"
              payload: { member_id: "${m_id}", rental_unit_id: "${unit_id}", start_date: "2026-08-05T00:00:00Z", end_date: "2026-08-08T00:00:00Z" }
              as: Member
              as_user_id: "${m_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_RENTAL_WINDOW_CONFLICT"
            - "HTTP status == 409"

      - name: guide_schedule_closed_interval_touch
        grounds:
          - calculations.guide_schedule_conflict
          - validations[priority=6]
          - errors[ERR_GUIDE_SCHEDULE_CONFLICT]
        distinguishing_aspect: "On Guide: assigning to trip A whose start exactly touches an already-assigned trip B's end (2026-08-01T17:00:00Z) is rejected — closed intervals, no buffer, adjacency counts as conflict (distinct arithmetic from the rental buffer rule)."
        test_recipe:
          setup:
            - "A guide (cert NONE) assigned to trip B (2026-08-01 09:00-17:00); trip A required NONE with window 2026-08-01 17:00-19:00 touching B's end."
          setup_api_calls:
            - call: "POST /coop/guides"
              payload: { full_name: "Guide Touch", certifications: [] }
              as: CoopAdmin
              captures: { g_id: $.data.id }
            - call: "POST /coop/trips"
              payload: { title: "Trip B Touch", start_time: "2026-08-01T09:00:00Z", end_time: "2026-08-01T17:00:00Z", capacity: 4, price_cents: 5000, required_certification: "NONE" }
              as: CoopAdmin
              captures: { tB_id: $.data.id }
            - call: "POST /coop/trips/${tB_id}/assign-guide"
              payload: { guide_id: "${g_id}" }
              as: CoopAdmin
            - call: "POST /coop/trips"
              payload: { title: "Trip A Touch", start_time: "2026-08-01T17:00:00Z", end_time: "2026-08-01T19:00:00Z", capacity: 4, price_cents: 5000, required_certification: "NONE" }
              as: CoopAdmin
              captures: { tA_id: $.data.id }
          trigger:
            - call: "POST /coop/trips/${tA_id}/assign-guide"
              payload: { guide_id: "${g_id}" }
              as: CoopAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_GUIDE_SCHEDULE_CONFLICT"
            - "HTTP status == 409"

  # =========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: loyalty_points_conserved_on_purchase_refund
        grounds:
          - calculations.loyalty_points_conservation
          - state_machines.Purchase.COMPLETED_to_REFUNDED
          - entities.Member.loyalty_points_balance
        distinguishing_aspect: "Conserved quantity = loyalty points: after purchase P2 (earn +200, redeem -500) is refunded (reversal -200, +500), Member.loyalty_points_balance returns to 1000 — the pre-P2 value, drift-free."
        test_recipe:
          setup:
            - "ACTIVE member who earned 1000 points from purchase P1 (100000), then made purchase P2 (20000, redeeming 500) leaving balance 700."
          setup_api_calls:
            - call: "POST /coop/products"
              payload: { sku: "LC-MAP", name: "Trail Map", category: "APPAREL", retail_price_cents: 100000, tax_rate: 0.05, replacement_value_cents: 100000 }
              as: CoopAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /coop/members"
              payload: { email: "lc@x.com", full_name: "Loyalty Member" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /coop/members/${m_id}/activate"
              payload: {}
              as: StoreStaff
            - call: "POST /coop/purchases"
              payload: { member_id: "${m_id}", line_items: [ { product_id: "${prod_id}", quantity: 1, unit_price_cents: 100000 } ] }
              as: StoreStaff
              captures: { p1_id: $.data.id }
            - call: "POST /coop/purchases"
              payload: { member_id: "${m_id}", line_items: [ { product_id: "${prod_id}", quantity: 1, unit_price_cents: 20000 } ], points_redeemed: 500 }
              as: StoreStaff
              captures: { p2_id: $.data.id }
          trigger:
            - call: "POST /coop/purchases/${p2_id}/refund"
              payload: {}
              as: StoreStaff
          assert:
            - "Member.${m_id}.loyalty_points_balance == 1000"
            - "Member.${m_id}.loyalty_points_balance == sum(LoyaltyLedger.delta where member_id == ${m_id})"

      - name: rental_units_conserved_on_pickup_return
        grounds:
          - calculations.rental_unit_conservation
          - state_machines.RentalUnit.AVAILABLE_to_RENTED_OUT
          - state_machines.RentalUnit.RENTED_OUT_to_AVAILABLE
        distinguishing_aspect: "Conserved quantity = physical unit inventory: pickup (AVAILABLE->RENTED_OUT) then good return (RENTED_OUT->AVAILABLE) leaves the count of AVAILABLE units for the product back at 1 — a different conserved quantity than loyalty points."
        test_recipe:
          setup:
            - "Clock 2026-07-01; ACTIVE member; rentable product with exactly 1 unit; reservation 2026-07-05..2026-07-06 then picked up (unit RENTED_OUT, 0 AVAILABLE)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: CoopAdmin
            - call: "POST /coop/products"
              payload: { sku: "CV-STOVE", name: "Conserve Stove", category: "COOKING", retail_price_cents: 30000, tax_rate: 0.05, replacement_value_cents: 35000, is_rentable: true, base_daily_rate_cents: 2000 }
              as: CoopAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /coop/rental-units"
              payload: { product_id: "${prod_id}", asset_tag: "CV-001" }
              as: CoopAdmin
              captures: { unit_id: $.data.id }
            - call: "POST /coop/members"
              payload: { email: "cv@x.com", full_name: "Conserve Member" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /coop/members/${m_id}/activate"
              payload: {}
              as: StoreStaff
            - call: "POST /coop/reservations"
              payload: { member_id: "${m_id}", rental_unit_id: "${unit_id}", start_date: "2026-07-05T00:00:00Z", end_date: "2026-07-06T00:00:00Z" }
              as: Member
              as_user_id: "${m_id}"
              captures: { res_id: $.data.id }
            - call: "POST /coop/reservations/${res_id}/pickup"
              payload: {}
              as: StoreStaff
          trigger:
            - call: "POST /coop/reservations/${res_id}/return"
              payload: { condition: "GOOD" }
              as: StoreStaff
          assert:
            - "RentalReservation.${res_id}.status == CLOSED"
            - "RentalUnit.${unit_id}.status == AVAILABLE"
            - "GET /coop/rental-units?product_id=${prod_id}&status=AVAILABLE returns total_count == 1"
