scenario: |
  2780. Driver Settlement & Accessorial Pay Administration (truckload carrier settlement office): pay package
  configuration across per-mile, percentage, hourly and activity-based components by driver type, mileage
  calculation using practical versus household goods mileage guides with dispute handling, accessorial pay for
  detention, layover, stop-off, tarping and breakdown with documentation requirements, escrow accounts for
  owner-operators with permissible deductions and return timelines, advance, fuel card and settlement deduction
  reconciliation, per diem allocation and its effect on taxable wages, settlement statement generation with
  itemization required for leased operators, pay dispute resolution and retroactive corrections

domain_name: driver-settlement-accessorial-pay
api_prefix: "/driver-pay"

complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: event_sourcing
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - derived_field_reconciliation

  entity_topology: graph
  # graph: PayPackage self-references its predecessor revision; RetroCorrection joins two Settlements
  # (origin + applied) plus a Load and a Dispute; SettlementLine carries a polymorphic reference to
  # Load / AccessorialClaim / Advance / RetroCorrection. Reads are flat collections with FK filters;
  # only the two immutable child logs (PayComponent, SettlementLine) are read as sub-resources.

  state_machine_shape: parallel
  # Load carries two independent axes (movement_status x pay_status); Driver carries two independent axes
  # (employment_status x escrow_status, the latter cycling FUNDED->COLLECTING->FUNDED); Dispute is cyclic
  # (DENIED->OPEN reopen, capped at 2) and branches at resolve with divergent side-effect sets keyed on
  # the referenced Load's pay_status; Settlement branches (PAID vs VOIDED).

  relationship_patterns:
    - one_to_many
    - self_referential      # PayPackage.supersedes_pay_package_id -> PayPackage.id
    - polymorphic           # SettlementLine.reference_type + reference_id
    - cross_aggregate       # RetroCorrection spans Dispute, Load, and two Settlements

  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# 1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:
  - name: PayPackage
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: human label for the pay package revision
      - name: driver_type
        type: enum
        source: input
        description: driver class this package may be assigned to
        constraints: "one of {COMPANY_SOLO, COMPANY_TEAM, OWNER_OPERATOR, LEASED_OPERATOR}"
      - name: mileage_guide
        type: enum
        source: input
        description: mileage guide used to derive paid miles for loads paid under this package
        constraints: "one of {PRACTICAL, HHG}; immutable across revisions (revise inherits it)"
      - name: per_diem_method
        type: enum
        source: input
        description: per diem allocation method applied at settlement time
        constraints: "one of {NONE, DAY_BASED, PERCENT_OF_LINEHAUL}"
      - name: escrow_required
        type: boolean
        source: input
        description: whether drivers on this package maintain a maintenance escrow account
      - name: escrow_target_cents
        type: integer
        source: input
        default: 0
        description: escrow principal target copied onto the Driver at assignment
        constraints: ">= 0; MUST be > 0 when escrow_required is true"
      - name: escrow_monthly_deduction_cents
        type: integer
        source: input
        default: 0
        description: per-settlement ceiling on escrow accrual copied onto the Driver at assignment
        constraints: ">= 0; MUST be > 0 when escrow_required is true"
      - name: status
        type: enum
        source: system
        default: DRAFT
        description: configuration lifecycle state
        constraints: "one of {DRAFT, ACTIVE, RETIRED}"
      - name: supersedes_pay_package_id
        type: string
        source: system
        description: "FK -> PayPackage.id; self-reference set by POST /driver-pay/pay-packages/{id}/revise; null on an originally created package"
      - name: has_pending_revision
        type: boolean
        source: system
        default: false
        description: true once a revision DRAFT has been created against this package
      - name: activated_at
        type: datetime
        source: system
        description: logical-clock instant of the DRAFT->ACTIVE transition; null while DRAFT
      - name: retired_at
        type: datetime
        source: system
        description: logical-clock instant of the ACTIVE->RETIRED transition; null otherwise
      - name: component_count
        type: integer
        source: computed
        description: count of PayComponent rows whose pay_package_id equals this id

  - name: PayComponent
    parent: PayPackage
    common_fields: false
    fields:
      - name: pay_package_id
        type: string
        source: system
        description: "FK -> PayPackage.id; owning package, taken from the request path"
      - name: component_type
        type: enum
        source: input
        description: which pay component this row configures
        constraints: "one of {PER_MILE, REVENUE_PERCENT, HOURLY, ACTIVITY}; at most one row per component_type per package"
      - name: unit
        type: enum
        source: input
        description: unit that rate_value is expressed in
        constraints: "one of {MILE, PERCENT_BPS, HOUR, LOAD}; MUST pair as PER_MILE:MILE, REVENUE_PERCENT:PERCENT_BPS, HOURLY:HOUR, ACTIVITY:LOAD"
      - name: rate_value
        type: integer
        source: input
        description: cents per unit for MILE/HOUR/LOAD units, basis points of linehaul revenue for PERCENT_BPS
        constraints: "> 0"
      - name: taxable
        type: boolean
        source: input
        description: whether earnings from this component are taxable wages before per diem reclassification
      - name: sequence
        type: integer
        source: input
        description: deterministic application order of this component within the package
        constraints: ">= 1; unique per pay_package_id"

  - name: Driver
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: driver legal name as printed on the settlement statement
      - name: driver_type
        type: enum
        source: input
        description: driver class
        constraints: "one of {COMPANY_SOLO, COMPANY_TEAM, OWNER_OPERATOR, LEASED_OPERATOR}; MUST equal the assigned PayPackage.driver_type"
      - name: pay_package_id
        type: string
        source: system
        description: "FK -> PayPackage.id; the ACTIVE package this driver is paid under"
      - name: home_state
        type: string
        source: input
        description: two-letter state code of the driver domicile
      - name: per_diem_elected
        type: boolean
        source: input
        description: driver election into the per diem program; per diem is allocated only when true AND package per_diem_method != NONE
      - name: employment_status
        type: enum
        source: system
        default: ONBOARDING
        description: employment axis of the driver state machine
        constraints: "one of {ONBOARDING, ACTIVE, SUSPENDED, TERMINATED}"
      - name: terminated_at
        type: datetime
        source: system
        description: logical-clock instant employment_status became TERMINATED; null otherwise
      - name: escrow_status
        type: enum
        source: system
        description: escrow axis of the driver state machine; initialized NOT_REQUIRED when the package has escrow_required false, else COLLECTING
        constraints: "one of {NOT_REQUIRED, COLLECTING, FUNDED, CLOSING, RETURNED}"
      - name: escrow_target_cents
        type: integer
        source: system
        description: escrow principal target copied from PayPackage.escrow_target_cents at driver creation
      - name: escrow_monthly_deduction_cents
        type: integer
        source: system
        description: per-settlement escrow accrual ceiling copied from PayPackage.escrow_monthly_deduction_cents at driver creation
      - name: escrow_balance_cents
        type: integer
        source: computed
        description: "SUM(EscrowTransaction.amount_cents) over all EscrowTransaction rows whose driver_id equals this id, with no status filter (the log is append-only); 0 when the log is empty"
      - name: escrow_funded_at
        type: datetime
        source: system
        description: logical-clock instant escrow_status last became FUNDED; null if never funded
      - name: escrow_return_due_at
        type: datetime
        source: computed
        description: terminated_at + ESCROW_RETURN_DAYS (45) days, stamped when escrow_status becomes CLOSING; null before that
      - name: escrow_returned_at
        type: datetime
        source: system
        description: logical-clock instant escrow_status became RETURNED; null otherwise
      - name: pending_retro_correction_cents
        type: integer
        source: computed
        description: "SUM(RetroCorrection.delta_gross_cents) over RetroCorrection rows whose driver_id equals this id AND status == PENDING (signed; APPLIED and CANCELLED rows excluded); 0 when none"
      - name: settlement_hold
        type: boolean
        source: computed
        description: "true when abs(pending_retro_correction_cents) > RETRO_HOLD_THRESHOLD_CENTS (50000), false otherwise; recomputed on every mutation of pending_retro_correction_cents"
      - name: ytd_gross_pay_cents
        type: integer
        source: computed
        description: "SUM(Settlement.gross_pay_cents) over Settlements of this driver whose status IN {APPROVED, PAID}; VOIDED and DRAFT and PREPARED excluded"
      - name: ytd_taxable_wages_cents
        type: integer
        source: computed
        description: "SUM(Settlement.taxable_wages_cents) over Settlements of this driver whose status IN {APPROVED, PAID}"
      - name: ytd_per_diem_non_taxable_cents
        type: integer
        source: computed
        description: "SUM(Settlement.per_diem_non_taxable_cents) over Settlements of this driver whose status IN {APPROVED, PAID}"
      - name: advance_outstanding_cents
        type: integer
        source: computed
        description: "SUM(Advance.outstanding_cents) over Advance rows whose driver_id equals this id AND status IN {ISSUED, RECOVERING}"

  - name: EscrowTransaction
    parent: Driver
    common_fields: false
    fields:
      - name: driver_id
        type: string
        source: system
        description: "FK -> Driver.id; escrow account owner, taken from the request path or from the settling Settlement"
      - name: settlement_id
        type: string
        source: system
        description: "FK -> Settlement.id; the Settlement whose approval or void produced this entry; null for manually recorded deductions and reversals and for the termination return"
      - name: reverses_transaction_id
        type: string
        source: input
        description: "FK -> EscrowTransaction.id; the entry this REVERSAL negates; null for every other txn_type"
      - name: txn_type
        type: enum
        source: system
        description: ledger entry kind
        constraints: "one of {DEPOSIT, PERMISSIBLE_DEDUCTION, REVERSAL, RETURN_DISBURSEMENT}"
      - name: amount_cents
        type: integer
        source: system
        description: "signed ledger delta: DEPOSIT positive, PERMISSIBLE_DEDUCTION negative (the request supplies a positive magnitude which the server negates), RETURN_DISBURSEMENT negative, REVERSAL exactly -1 x the referenced entry amount_cents"
      - name: reason_code
        type: enum
        source: input
        description: audit reason; the permissible-deduction whitelist is enforced on manual deductions
        constraints: "one of {SETTLEMENT_ACCRUAL, SETTLEMENT_VOID, TERMINATION_RETURN, DEDUCTION_DISPUTED, ESCROW_FUNDING, TRACTOR_LEASE, INSURANCE_PREMIUM, PERMIT_FEE, CARGO_CLAIM_DAMAGE, FUEL_TAX_TRUEUP, ADVANCE_DEFAULT, EQUIPMENT_DAMAGE, UNRETURNED_EQUIPMENT, FUEL_CARD_DEFAULT}; the six members of PERMISSIBLE_DEDUCTION_REASONS are the only ones a manual deduction may use, the rest are system-written or reversal reasons"
      - name: document_ref
        type: string
        source: input
        description: supporting document identifier; required on PERMISSIBLE_DEDUCTION, null on system-generated entries
      - name: recorded_by_user_id
        type: string
        source: system
        description: X-User-ID of the operator whose request produced this entry
      - name: balance_after_cents
        type: integer
        source: computed
        description: driver escrow_balance_cents immediately after this entry was appended

  - name: Load
    parent: null
    common_fields: true
    fields:
      - name: driver_id
        type: string
        source: input
        description: "FK -> Driver.id; the driver who moved the load"
      - name: settlement_id
        type: string
        source: system
        description: "FK -> Settlement.id; set when the load is swept into a settlement at prepare, cleared back to null on settlement void"
      - name: pay_package_id_snapshot
        type: string
        source: system
        description: "FK -> PayPackage.id; the driver pay_package_id captured at the DELIVERED transition and used for every later pay computation on this load; null before delivery"
      - name: origin_zip
        type: string
        source: input
        description: origin postal code
      - name: dest_zip
        type: string
        source: input
        description: destination postal code
      - name: linehaul_revenue_cents
        type: integer
        source: input
        description: carrier linehaul revenue billed to the shipper, basis of REVENUE_PERCENT pay
        constraints: "> 0"
      - name: practical_miles
        type: integer
        source: input
        description: miles reported by the practical mileage guide
        constraints: "> 0"
      - name: hhg_miles
        type: integer
        source: input
        description: miles reported by the household goods mileage guide
        constraints: "> 0"
      - name: stop_count
        type: integer
        source: input
        description: total stops on the load including the final delivery
        constraints: ">= 1"
      - name: hours_worked_minutes
        type: integer
        source: input
        default: 0
        description: on-duty minutes logged against the load, basis of HOURLY pay
        constraints: ">= 0"
      - name: tarp_required
        type: boolean
        source: input
        default: false
        description: whether the freight required tarping; TARPING accessorial claims are only payable when true
      - name: dispatched_at
        type: datetime
        source: input
        description: dispatch instant; lower bound of the per diem day span
      - name: delivered_at
        type: datetime
        source: system
        description: occurred_at supplied on the DELIVERED movement transition; null before delivery
      - name: movement_status
        type: enum
        source: system
        default: TENDERED
        description: physical movement axis, independent of pay_status
        constraints: "one of {TENDERED, IN_TRANSIT, DELIVERED}"
      - name: pay_status
        type: enum
        source: system
        default: UNPAID
        description: pay axis, independent of movement_status
        constraints: "one of {UNPAID, ACCRUED, SETTLED, ADJUSTED}"
      - name: applied_mileage_guide
        type: enum
        source: computed
        description: guide actually used for paid_miles - pay_package_id_snapshot.mileage_guide, replaced by Dispute.claimed_guide once a MILEAGE dispute on this load is UPHELD; null before delivery
        constraints: "one of {PRACTICAL, HHG}"
      - name: base_guide_miles
        type: integer
        source: computed
        description: practical_miles when applied_mileage_guide is PRACTICAL, hhg_miles when HHG, or Dispute.claimed_miles once a MILEAGE dispute is UPHELD; null before delivery
      - name: paid_miles
        type: integer
        source: computed
        description: base_guide_miles raised to MIN_PAID_MILES (250) when base_guide_miles < 250; null before delivery
      - name: short_haul_floor_applied
        type: boolean
        source: computed
        description: "true only when base_guide_miles < MIN_PAID_MILES (strict <); false at exactly 250"
      - name: linehaul_pay_cents
        type: integer
        source: computed
        description: output of the linehaul_component_pay calculation for this load; null before delivery
      - name: linehaul_line_type
        type: enum
        source: computed
        description: which linehaul component won the max() comparison and therefore names the settlement line
        constraints: "one of {LINEHAUL_PER_MILE, LINEHAUL_PERCENT, NONE}"

  - name: AccessorialClaim
    parent: null
    common_fields: true
    fields:
      - name: load_id
        type: string
        source: input
        description: "FK -> Load.id; the load the accessorial event occurred on"
      - name: driver_id
        type: string
        source: input
        description: "FK -> Driver.id; denormalized from Load.driver_id at claim creation and never re-derived"
      - name: settlement_id
        type: string
        source: system
        description: "FK -> Settlement.id; set when the approved claim is swept into a settlement at prepare, cleared back to null on settlement void"
      - name: accessorial_type
        type: enum
        source: input
        description: accessorial category
        constraints: "one of {DETENTION, LAYOVER, STOP_OFF, TARPING, BREAKDOWN}"
      - name: start_at
        type: datetime
        source: input
        description: interval start of the accessorial event
      - name: end_at
        type: datetime
        source: input
        description: interval end of the accessorial event
        constraints: "MUST be strictly greater than start_at"
      - name: document_ref
        type: string
        source: input
        description: supporting document identifier; null until supplied by POST /driver-pay/accessorial-claims/{id}/documents
      - name: documentation_required
        type: boolean
        source: computed
        description: "true when accessorial_type IN {DETENTION, TARPING, BREAKDOWN}, false for {LAYOVER, STOP_OFF}"
      - name: billable_units
        type: integer
        source: computed
        description: per-type billable quantity (15-minute detention increments, payable layover days, payable stops, 1 for tarping, payable breakdown days); computed at approval
      - name: amount_cents
        type: integer
        source: computed
        default: 0
        description: output of the accessorial_pay calculation; 0 until the claim is approved
      - name: status
        type: enum
        source: system
        default: SUBMITTED
        description: claim lifecycle state
        constraints: "one of {SUBMITTED, APPROVED, REJECTED, PAID}"
      - name: reject_reason_code
        type: enum
        source: input
        description: rejection reason recorded on the SUBMITTED->REJECTED transition; null otherwise
        constraints: "one of {NOT_SUPPORTED_BY_LOG, SHIPPER_NOT_LIABLE, DUPLICATE_EVENT, OUTSIDE_POLICY}"
      - name: submitted_by_user_id
        type: string
        source: system
        description: X-User-ID that created the claim
      - name: approved_by_user_id
        type: string
        source: system
        description: X-User-ID that approved the claim; null until approved

  - name: Advance
    parent: null
    common_fields: true
    fields:
      - name: driver_id
        type: string
        source: input
        description: "FK -> Driver.id; the driver who received the advance or fuel card balance"
      - name: advance_type
        type: enum
        source: input
        description: recovery bucket this obligation belongs to in the deduction waterfall
        constraints: "one of {CASH_ADVANCE, FUEL_CARD}"
      - name: amount_cents
        type: integer
        source: input
        description: original principal advanced
        constraints: "> 0"
      - name: installment_cents
        type: integer
        source: input
        default: "amount_cents (the whole principal is recoverable from one settlement when omitted)"
        description: maximum amount this obligation may recover from a single settlement
        constraints: "> 0"
      - name: recovered_cents
        type: integer
        source: computed
        default: 0
        description: "SUM(SettlementLine.amount_cents) over ADVANCE_RECOVERY lines whose reference_id equals this id AND whose Settlement.status IN {PREPARED, APPROVED, PAID}"
      - name: outstanding_cents
        type: integer
        source: computed
        description: amount_cents - recovered_cents
      - name: status
        type: enum
        source: system
        default: ISSUED
        description: recovery lifecycle state
        constraints: "one of {ISSUED, RECOVERING, RECOVERED}"
      - name: issued_at
        type: datetime
        source: system
        description: logical-clock instant the advance was recorded

  - name: Settlement
    parent: null
    common_fields: true
    fields:
      - name: driver_id
        type: string
        source: input
        description: "FK -> Driver.id; the driver being settled"
      - name: period_start
        type: datetime
        source: input
        description: inclusive lower bound of the settlement period
      - name: period_end
        type: datetime
        source: input
        description: exclusive upper bound of the settlement period
        constraints: "MUST be strictly greater than period_start"
      - name: status
        type: enum
        source: system
        default: DRAFT
        description: settlement lifecycle state
        constraints: "one of {DRAFT, PREPARED, APPROVED, PAID, VOIDED}"
      - name: prepared_by_user_id
        type: string
        source: system
        description: X-User-ID of the SettlementClerk that ran prepare; null while DRAFT
      - name: approved_by_user_id
        type: string
        source: system
        description: X-User-ID of the SettlementApprover that approved; null before approval
      - name: prepared_at
        type: datetime
        source: system
        description: logical-clock instant of DRAFT->PREPARED; null before
      - name: approved_at
        type: datetime
        source: system
        description: logical-clock instant of PREPARED->APPROVED; null before
      - name: paid_at
        type: datetime
        source: system
        description: logical-clock instant of APPROVED->PAID; null before
      - name: voided_at
        type: datetime
        source: system
        description: logical-clock instant of the transition into VOIDED; null before
      - name: payment_reference
        type: string
        source: input
        description: external disbursement reference recorded on pay; null before
      - name: void_reason_code
        type: enum
        source: input
        description: reason recorded on void; null otherwise
        constraints: "one of {CLERICAL_ERROR, WRONG_PERIOD, DISPUTE_RESOLUTION, DUPLICATE_SETTLEMENT}"
      - name: itemization_required
        type: boolean
        source: computed
        description: "true when the settled Driver.driver_type == LEASED_OPERATOR, false otherwise; drives the itemization completeness validation and the statement payload shape"
      - name: line_count
        type: integer
        source: computed
        description: count of SettlementLine rows whose settlement_id equals this id
      - name: linehaul_total_cents
        type: integer
        source: computed
        description: "SUM(SettlementLine.amount_cents) over lines with line_type IN {LINEHAUL_PER_MILE, LINEHAUL_PERCENT, HOURLY, ACTIVITY}"
      - name: accessorial_total_cents
        type: integer
        source: computed
        description: "SUM(SettlementLine.amount_cents) over lines with line_type == ACCESSORIAL"
      - name: retro_correction_total_cents
        type: integer
        source: computed
        description: "SUM(SettlementLine.amount_cents) over lines with line_type == RETRO_CORRECTION (signed; may be negative)"
      - name: gross_pay_cents
        type: integer
        source: computed
        description: linehaul_total_cents + accessorial_total_cents + retro_correction_total_cents; PER_DIEM, ESCROW_DEDUCTION and ADVANCE_RECOVERY lines are excluded from gross
      - name: days_out_count
        type: integer
        source: computed
        description: cardinality of the union of UTC calendar dates covered by [dispatched_at, delivered_at] across every Load swept into this settlement
      - name: per_diem_non_taxable_cents
        type: integer
        source: computed
        description: non-taxable per diem allocated to this settlement; 0 when the driver has not elected per diem or the package method is NONE
      - name: per_diem_excess_taxable_cents
        type: integer
        source: computed
        description: portion of the computed per diem that exceeded the PER_DIEM_MAX_PCT_OF_GROSS_BPS cap and therefore stays in taxable wages
      - name: taxable_wages_cents
        type: integer
        source: computed
        description: gross_pay_cents - per_diem_non_taxable_cents
      - name: escrow_deduction_cents
        type: integer
        source: computed
        description: escrow accrual withheld by this settlement; 0 when driver escrow_status is not COLLECTING
      - name: advance_recovery_cents
        type: integer
        source: computed
        description: total advance and fuel card recovery allocated by the deduction waterfall
      - name: deduction_total_cents
        type: integer
        source: computed
        description: escrow_deduction_cents + advance_recovery_cents
      - name: net_pay_cents
        type: integer
        source: computed
        description: gross_pay_cents - deduction_total_cents

  - name: SettlementLine
    parent: Settlement
    common_fields: false
    fields:
      - name: settlement_id
        type: string
        source: system
        description: "FK -> Settlement.id; owning settlement"
      - name: line_type
        type: enum
        source: system
        description: itemization category of the line
        constraints: "one of {LINEHAUL_PER_MILE, LINEHAUL_PERCENT, HOURLY, ACTIVITY, ACCESSORIAL, RETRO_CORRECTION, PER_DIEM, ESCROW_DEDUCTION, ADVANCE_RECOVERY}"
      - name: reference_type
        type: enum
        source: system
        description: type tag that resolves reference_id
        constraints: "one of {LOAD, ACCESSORIAL_CLAIM, ADVANCE, RETRO_CORRECTION, DRIVER}"
      - name: reference_id
        type: string
        source: system
        description: "polymorphic reference to the source record, resolved by reference_type as {LOAD -> Load.id, ACCESSORIAL_CLAIM -> AccessorialClaim.id, ADVANCE -> Advance.id, RETRO_CORRECTION -> RetroCorrection.id, DRIVER -> Driver.id}; deliberately NOT a typed foreign key; null is forbidden on every line whose Settlement.itemization_required is true"
      - name: quantity
        type: number
        source: system
        description: billable quantity behind the line (paid miles, hours, payable days, payable stops, 1 for flat lines)
      - name: rate_value
        type: integer
        source: system
        description: rate applied to quantity in the units of the driving PayComponent; null on flat and derived lines
      - name: amount_cents
        type: integer
        source: system
        description: signed line amount; earning and deduction lines are stored as positive magnitudes, RETRO_CORRECTION lines carry the signed delta
      - name: taxable
        type: boolean
        source: system
        description: whether the line contributes to taxable wages before per diem reclassification
      - name: sequence
        type: integer
        source: system
        description: statement print order; assigned ascending from 1 in the pinned generation order of the settlement_line_generation calculation

  - name: Dispute
    parent: null
    common_fields: true
    fields:
      - name: dispute_kind
        type: enum
        source: input
        description: which family of dispute this is; drives the conditional field requirements and the resolve side-effect set
        constraints: "one of {MILEAGE, PAY}"
      - name: driver_id
        type: string
        source: input
        description: "FK -> Driver.id; derived from Load.driver_id for MILEAGE disputes and from Settlement.driver_id for PAY disputes"
      - name: load_id
        type: string
        source: input
        description: "FK -> Load.id; required when dispute_kind == MILEAGE, MUST be null when dispute_kind == PAY"
      - name: settlement_id
        type: string
        source: input
        description: "FK -> Settlement.id; required when dispute_kind == PAY, MUST be null when dispute_kind == MILEAGE"
      - name: claimed_guide
        type: enum
        source: input
        description: mileage guide the claimant asserts should apply; required for MILEAGE, null for PAY
        constraints: "one of {PRACTICAL, HHG}"
      - name: claimed_miles
        type: integer
        source: input
        description: miles the claimant asserts; required for MILEAGE, null for PAY
        constraints: "> 0"
      - name: claimed_amount_cents
        type: integer
        source: input
        description: pay amount the claimant asserts is owed; required for PAY, null for MILEAGE
        constraints: "> 0"
      - name: disputed_line_type
        type: enum
        source: input
        description: settlement line family under dispute; required for PAY, null for MILEAGE
        constraints: "one of {LINEHAUL_PER_MILE, LINEHAUL_PERCENT, HOURLY, ACTIVITY, ACCESSORIAL, ESCROW_DEDUCTION, ADVANCE_RECOVERY}"
      - name: evidence_doc_ref
        type: string
        source: input
        description: identifier of the evidence package supporting the claim
      - name: narrative
        type: string
        source: input
        description: claimant narrative
      - name: status
        type: enum
        source: system
        default: OPEN
        description: dispute lifecycle state; DENIED is re-openable up to DISPUTE_REOPEN_LIMIT times
        constraints: "one of {OPEN, UNDER_REVIEW, UPHELD, DENIED, WITHDRAWN}"
      - name: reopen_count
        type: integer
        source: system
        default: 0
        description: number of DENIED->OPEN transitions already performed on this dispute
      - name: resolution_note
        type: string
        source: input
        description: resolver note recorded on the UNDER_REVIEW->UPHELD/DENIED transition; null before
      - name: resolution_correction_id
        type: string
        source: system
        description: "FK -> RetroCorrection.id; the correction produced by an UPHELD resolution against already-settled pay; null when the resolution adjusted an unsettled load in place, when DENIED, or before resolution"
      - name: adjustment_cents
        type: integer
        source: computed
        description: signed pay delta the UPHELD resolution produced; null when DENIED or unresolved
      - name: submitted_by_user_id
        type: string
        source: system
        description: X-User-ID that filed the dispute
      - name: reviewed_by_user_id
        type: string
        source: system
        description: X-User-ID that moved the dispute to UNDER_REVIEW; null before
      - name: resolved_by_user_id
        type: string
        source: system
        description: X-User-ID that resolved the dispute; null before

  - name: RetroCorrection
    parent: null
    common_fields: true
    fields:
      - name: driver_id
        type: string
        source: system
        description: "FK -> Driver.id; the driver whose pay is corrected"
      - name: origin_settlement_id
        type: string
        source: system
        description: "FK -> Settlement.id; the already-settled settlement whose amounts were found wrong"
      - name: applied_settlement_id
        type: string
        source: system
        description: "FK -> Settlement.id; the later DRAFT settlement this correction was swept into; null while PENDING or CANCELLED"
      - name: source_load_id
        type: string
        source: system
        description: "FK -> Load.id; the load re-graded by a MILEAGE_REGRADE correction; null for PAY_ADJUSTMENT corrections"
      - name: source_dispute_id
        type: string
        source: system
        description: "FK -> Dispute.id; the UPHELD dispute that produced this correction"
      - name: correction_type
        type: enum
        source: system
        description: what kind of retroactive change this is
        constraints: "one of {MILEAGE_REGRADE, PAY_ADJUSTMENT}"
      - name: delta_gross_cents
        type: integer
        source: computed
        description: signed change to gross pay; negative when a re-grade reduces previously paid amounts
      - name: delta_taxable_cents
        type: integer
        source: computed
        description: signed change to taxable wages; differs from delta_gross_cents only when the origin package per_diem_method is PERCENT_OF_LINEHAUL
      - name: reason_code
        type: enum
        source: system
        description: audit reason
        constraints: "one of {MILEAGE_GUIDE_REGRADE, MILEAGE_DISPUTE_UPHELD, PAY_DISPUTE_UPHELD}"
      - name: status
        type: enum
        source: system
        default: PENDING
        description: correction lifecycle state
        constraints: "one of {PENDING, APPLIED, CANCELLED}"
      - name: applied_at
        type: datetime
        source: system
        description: logical-clock instant the correction was swept into applied_settlement_id; null otherwise
      - name: cancelled_at
        type: datetime
        source: system
        description: logical-clock instant the correction was cancelled; null otherwise
      - name: cancelled_by_user_id
        type: string
        source: system
        description: X-User-ID that cancelled the correction; null otherwise

# ---------------------------------------------------------------------------
# 1.2 State Machine Table
# ---------------------------------------------------------------------------
state_machines:
  - entity: PayPackage
    axis: status
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /driver-pay/pay-packages/{id}/activate"
        actor: PayrollAdmin
        preconditions:
          - "package status == DRAFT"
          - "component_count >= 1"
          - "at least one component with component_type IN {PER_MILE, REVENUE_PERCENT, HOURLY, ACTIVITY} exists"
          - "escrow_required is false OR (escrow_target_cents > 0 AND escrow_monthly_deduction_cents > 0)"
        side_effects:
          - "sets status = ACTIVE and activated_at = current logical clock"
          - "increments PayPackage.version by 1"
          - "when supersedes_pay_package_id is not null: transitions that predecessor package ACTIVE->RETIRED, stamps its retired_at, clears its has_pending_revision to false and increments its version by 1 (predecessor Drivers keep their pay_package_id; only new driver assignments are blocked)"
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /driver-pay/pay-packages/{id}/retire, or the system event of a successor revision being activated via POST /driver-pay/pay-packages/{id}/activate"
        actor: system
        preconditions:
          - "status == ACTIVE, and either POST /driver-pay/pay-packages/{id}/retire is called on a package whose has_pending_revision is false, or a successor package whose supersedes_pay_package_id equals this id transitions DRAFT->ACTIVE"
        side_effects:
          - "sets status = RETIRED, retired_at = current logical clock, has_pending_revision = false"
          - "increments PayPackage.version by 1"
        note: "RETIRED is terminal: a retired package can never be re-activated, revised or newly assigned, yet it stays readable as the pay_package_id_snapshot of loads dispatched while it was ACTIVE."

  - entity: Driver
    axis: employment_status
    initial_state: ONBOARDING
    terminal_states: [TERMINATED]
    transitions:
      - from: ONBOARDING
        to: ACTIVE
        trigger: "POST /driver-pay/drivers/{id}/status with new_status ACTIVE"
        actor: PayrollAdmin
        preconditions: ["employment_status == ONBOARDING", "assigned PayPackage.status == ACTIVE"]
        side_effects: ["sets employment_status = ACTIVE", "increments Driver.version by 1"]
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /driver-pay/drivers/{id}/status with new_status SUSPENDED"
        actor: PayrollAdmin
        preconditions: ["employment_status == ACTIVE"]
        side_effects: ["sets employment_status = SUSPENDED", "increments Driver.version by 1"]
        note: "SUSPENDED drivers may still be settled for work already performed; new loads are refused."
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /driver-pay/drivers/{id}/status with new_status ACTIVE"
        actor: PayrollAdmin
        preconditions: ["employment_status == SUSPENDED"]
        side_effects: ["sets employment_status = ACTIVE", "increments Driver.version by 1"]
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /driver-pay/drivers/{id}/status with new_status TERMINATED"
        actor: PayrollAdmin
        preconditions: ["employment_status IN {ACTIVE, SUSPENDED}"]
        side_effects:
          - "sets employment_status = TERMINATED and terminated_at = current logical clock"
          - "increments Driver.version by 1"
      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /driver-pay/drivers/{id}/status with new_status TERMINATED"
        actor: PayrollAdmin
        preconditions: ["employment_status IN {ACTIVE, SUSPENDED}"]
        side_effects:
          - "sets employment_status = TERMINATED and terminated_at = current logical clock"
          - "increments Driver.version by 1"

  - entity: Driver
    axis: escrow_status
    initial_state: "NOT_REQUIRED when assigned PayPackage.escrow_required is false, otherwise COLLECTING"
    terminal_states: [RETURNED]
    transitions:
      - from: NOT_REQUIRED
        to: COLLECTING
        trigger: "POST /driver-pay/drivers/{id}/assign-pay-package with a PayPackage whose escrow_required is true"
        actor: PayrollAdmin
        preconditions: ["escrow_status == NOT_REQUIRED", "the assigned PayPackage.escrow_required is true", "employment_status IN {ONBOARDING, ACTIVE}"]
        side_effects:
          - "sets escrow_status = COLLECTING and copies escrow_target_cents and escrow_monthly_deduction_cents from the package"
          - "leaves escrow_balance_cents at 0 so the first settlement begins accrual"
          - "increments Driver.version by 1"
        note: "A driver assigned a package with escrow_required false stays in NOT_REQUIRED, which is why NOT_REQUIRED is the initial state rather than an unreachable placeholder."
      - from: COLLECTING
        to: FUNDED
        trigger: "system event: an EscrowTransaction append raises escrow_balance_cents to escrow_target_cents or above"
        actor: system
        preconditions: ["escrow_status == COLLECTING", "escrow_balance_cents >= escrow_target_cents after the append"]
        side_effects:
          - "sets escrow_status = FUNDED and escrow_funded_at = current logical clock"
          - "suppresses every later ESCROW_DEDUCTION line for this driver (settlement_line_generation emits none while escrow_status != COLLECTING)"
          - "increments Driver.version by 1"
      - from: FUNDED
        to: COLLECTING
        trigger: "system event: an EscrowTransaction append drops escrow_balance_cents below escrow_target_cents"
        actor: system
        preconditions: ["escrow_status == FUNDED", "escrow_balance_cents < escrow_target_cents after the append"]
        side_effects:
          - "sets escrow_status = COLLECTING and clears escrow_funded_at to null"
          - "re-enables ESCROW_DEDUCTION line generation on later settlements"
          - "increments Driver.version by 1"
        note: "This FUNDED->COLLECTING->FUNDED loop is the escrow axis cycle; it fires on permissible deductions and on their reversals."
      - from: COLLECTING
        to: CLOSING
        trigger: "POST /driver-pay/drivers/{id}/escrow/close"
        actor: PayrollAdmin
        preconditions: ["escrow_status IN {COLLECTING, FUNDED}", "employment_status == TERMINATED"]
        side_effects:
          - "sets escrow_status = CLOSING and escrow_return_due_at = terminated_at + 45 days"
          - "increments Driver.version by 1"
      - from: FUNDED
        to: CLOSING
        trigger: "POST /driver-pay/drivers/{id}/escrow/close"
        actor: PayrollAdmin
        preconditions: ["escrow_status IN {COLLECTING, FUNDED}", "employment_status == TERMINATED"]
        side_effects:
          - "sets escrow_status = CLOSING and escrow_return_due_at = terminated_at + 45 days"
          - "increments Driver.version by 1"
      - from: CLOSING
        to: RETURNED
        trigger: "POST /driver-pay/drivers/{id}/escrow/return"
        actor: PayrollAdmin
        preconditions:
          - "escrow_status == CLOSING"
          - "no RetroCorrection row with this driver_id has status == PENDING"
        side_effects:
          - "appends an EscrowTransaction with txn_type RETURN_DISBURSEMENT, reason_code TERMINATION_RETURN and amount_cents = -1 x escrow_balance_cents"
          - "that append itself drives escrow_balance_cents to 0"
          - "sets escrow_status = RETURNED and escrow_returned_at = current logical clock"
          - "increments Driver.version by 1"
        note: "RETURNED is terminal on the escrow axis; further deductions are refused."

  - entity: Load
    axis: movement_status
    initial_state: TENDERED
    terminal_states: [DELIVERED]
    transitions:
      - from: TENDERED
        to: IN_TRANSIT
        trigger: "POST /driver-pay/loads/{id}/dispatch"
        actor: SettlementClerk
        preconditions: ["movement_status == TENDERED", "the Driver has an assigned pay_package_id whose status is ACTIVE"]
        side_effects:
          - "sets movement_status = IN_TRANSIT and dispatched_at = the supplied dispatched_at or the current logical clock"
          - "pins pay_package_id_snapshot = Driver.pay_package_id"
          - "increments Load.version by 1"
      - from: IN_TRANSIT
        to: DELIVERED
        trigger: "POST /driver-pay/loads/{id}/deliver"
        actor: SettlementClerk
        preconditions: ["movement_status == IN_TRANSIT", "delivered_at >= dispatched_at"]
        side_effects:
          - "sets movement_status = DELIVERED and delivered_at = the supplied delivered_at or the current logical clock"
          - "reads pay_package_id_snapshot pinned at dispatch (version pinning: every later pay computation on this load reads the snapshot, never the driver current package)"
          - "runs paid_miles_determination and linehaul_component_pay, writing applied_mileage_guide, base_guide_miles, paid_miles, short_haul_floor_applied, linehaul_pay_cents, linehaul_line_type"
          - "advances the independent pay axis UNPAID->ACCRUED"
          - "increments Load.version by 1"
        note: "DELIVERED is terminal on the movement axis: neither dispatch nor deliver may fire again, while the independent pay axis keeps moving underneath it."

  - entity: Load
    axis: pay_status
    initial_state: UNPAID
    terminal_states: []
    transitions:
      - from: UNPAID
        to: ACCRUED
        trigger: "system event: the movement axis reaches DELIVERED"
        actor: system
        preconditions: ["movement_status becomes DELIVERED"]
        side_effects: ["sets pay_status = ACCRUED", "makes the load eligible for settlement_period_accrual"]
      - from: ACCRUED
        to: SETTLED
        trigger: "system event: POST /driver-pay/settlements/{id}/prepare sweeps this load onto the settlement"
        actor: system
        preconditions: ["pay_status == ACCRUED", "settlement_id is not null", "that Settlement transitions APPROVED->PAID"]
        side_effects: ["sets pay_status = SETTLED"]
      - from: SETTLED
        to: ACCRUED
        trigger: "system event: POST /driver-pay/settlements/{id}/void on the settlement that swept this load"
        actor: system
        preconditions: ["pay_status IN {SETTLED, ACCRUED}", "the owning Settlement transitions into VOIDED"]
        side_effects: ["sets pay_status = ACCRUED and settlement_id = null, making the load eligible for a later settlement again"]
      - from: SETTLED
        to: ADJUSTED
        trigger: "system event: a MILEAGE Dispute on this load is UPHELD while pay_status == SETTLED"
        actor: system
        preconditions: ["pay_status == SETTLED"]
        side_effects:
          - "sets pay_status = ADJUSTED and rewrites applied_mileage_guide, base_guide_miles, paid_miles, linehaul_pay_cents, linehaul_line_type from the upheld claim"
          - "does NOT alter movement_status, which stays DELIVERED"
        note: "ADJUSTED loads are never re-swept; the money moves through a RetroCorrection instead."
      - from: ADJUSTED
        to: SETTLED
        trigger: "system event: POST /driver-pay/retro-corrections/{id}/cancel on the PENDING correction this adjustment created"
        actor: system
        preconditions: ["pay_status == ADJUSTED", "the cancelled RetroCorrection source_load_id is this load", "that RetroCorrection status was PENDING"]
        side_effects:
          - "sets pay_status = SETTLED"
          - "leaves applied_mileage_guide, base_guide_miles, paid_miles, linehaul_pay_cents and linehaul_line_type at their re-graded values: cancelling the correction abandons the money movement, it does not un-adjudicate the upheld dispute"
        note: "The adjustment is reversible on the pay axis only. This is why Settlement.linehaul_total_cents on the original statement can permanently disagree with Load.linehaul_pay_cents."
      - from: ACCRUED
        to: ACCRUED
        trigger: "system event: a MILEAGE Dispute on this load is UPHELD while pay_status == ACCRUED"
        actor: system
        preconditions: ["pay_status == ACCRUED"]
        side_effects:
          - "rewrites applied_mileage_guide, base_guide_miles, paid_miles, short_haul_floor_applied, linehaul_pay_cents and linehaul_line_type in place"
          - "creates NO RetroCorrection: the load has not been paid yet, so the next prepare simply picks up the new numbers"
        note: "This is the divergent branch of the resolve fork - same trigger, side-effect set keyed on the load pay axis."

  - entity: AccessorialClaim
    axis: status
    initial_state: SUBMITTED
    terminal_states: [REJECTED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /driver-pay/accessorial-claims/{id}/approve"
        actor: SettlementClerk
        preconditions:
          - "status == SUBMITTED"
          - "referenced Load.movement_status == DELIVERED"
          - "referenced Load.pay_status != SETTLED"
          - "documentation_required is false OR document_ref is not null"
          - "accessorial_type != TARPING OR referenced Load.tarp_required is true"
          - "computed amount_cents > 0"
        side_effects:
          - "runs accessorial_pay, writing billable_units and amount_cents"
          - "sets status = APPROVED and approved_by_user_id = X-User-ID"
          - "increments AccessorialClaim.version by 1"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /driver-pay/accessorial-claims/{id}/reject"
        actor: SettlementClerk
        preconditions: ["status == SUBMITTED"]
        side_effects:
          - "sets status = REJECTED, reject_reason_code from the request, amount_cents = 0"
          - "increments AccessorialClaim.version by 1"
      - from: APPROVED
        to: PAID
        trigger: "system event: POST /driver-pay/settlements/{id}/prepare sweeps this claim onto the settlement as an ACCESSORIAL line"
        actor: system
        preconditions: ["status == APPROVED", "settlement_id is null", "the claim end_at falls in the settlement period"]
        side_effects: ["sets status = PAID and settlement_id = the preparing settlement", "increments AccessorialClaim.version by 1"]
      - from: PAID
        to: APPROVED
        trigger: "system event: POST /driver-pay/settlements/{id}/void on the settlement that swept this claim"
        actor: system
        preconditions: ["status == PAID", "the owning Settlement transitions into VOIDED"]
        side_effects: ["clears settlement_id back to null so the claim is eligible for the next settlement; status returns to APPROVED and amount_cents is preserved"]

  - entity: Advance
    axis: status
    initial_state: ISSUED
    terminal_states: [RECOVERED]
    transitions:
      - from: ISSUED
        to: RECOVERING
        trigger: "system event: POST /driver-pay/settlements/{id}/approve commits a partial ADVANCE_RECOVERY line that prepare allocated against this advance"
        actor: system
        preconditions: ["status == ISSUED", "allocated amount > 0", "allocated amount < outstanding_cents"]
        side_effects: ["sets status = RECOVERING", "recovered_cents and outstanding_cents are recomputed from the ADVANCE_RECOVERY lines"]
      - from: ISSUED
        to: RECOVERED
        trigger: "system event: POST /driver-pay/settlements/{id}/approve commits an ADVANCE_RECOVERY line equal to the full outstanding_cents"
        actor: system
        preconditions: ["status == ISSUED", "allocated amount == outstanding_cents"]
        side_effects: ["sets status = RECOVERED", "outstanding_cents becomes 0"]
      - from: RECOVERING
        to: RECOVERED
        trigger: "system event: POST /driver-pay/settlements/{id}/approve commits the final ADVANCE_RECOVERY line"
        actor: system
        preconditions: ["status == RECOVERING", "outstanding_cents after allocation == 0"]
        side_effects: ["sets status = RECOVERED"]
      - from: RECOVERED
        to: RECOVERING
        trigger: "system event: POST /driver-pay/settlements/{id}/void reverses an ADVANCE_RECOVERY line against this advance"
        actor: system
        preconditions: ["status IN {RECOVERING, RECOVERED}", "the settlement holding the recovery line transitions into VOIDED"]
        side_effects:
          - "recovered_cents is recomputed excluding the voided settlement lines, restoring outstanding_cents"
          - "sets status = RECOVERING when outstanding_cents > 0 and recovered_cents > 0, or ISSUED when recovered_cents returns to 0"
        note: "Advance principal is conserved: amount_cents == outstanding_cents + recovered_cents at every observable point."

  - entity: Settlement
    axis: status
    initial_state: DRAFT
    terminal_states: [PAID, VOIDED]
    transitions:
      - from: DRAFT
        to: PREPARED
        trigger: "POST /driver-pay/settlements/{id}/prepare"
        actor: SettlementClerk
        preconditions:
          - "status == DRAFT"
          - "Driver.employment_status IN {ACTIVE, SUSPENDED, TERMINATED}"
          - "Driver.settlement_hold is false"
          - "at least one eligible Load or APPROVED AccessorialClaim or already-applied RETRO_CORRECTION line exists for the period"
          - "itemization_required is false OR every generated earning line carries a non-null reference_id"
          - "computed net_pay_cents >= 0"
        side_effects:
          - "runs settlement_period_accrual, then settlement_line_generation in its pinned order, appending SettlementLine rows"
          - "sets Load.settlement_id and AccessorialClaim.settlement_id for every swept row"
          - "writes linehaul_total_cents, accessorial_total_cents, retro_correction_total_cents, gross_pay_cents, days_out_count, per_diem_non_taxable_cents, per_diem_excess_taxable_cents, taxable_wages_cents, escrow_deduction_cents, advance_recovery_cents, deduction_total_cents, net_pay_cents, line_count, itemization_required"
          - "advances every touched Advance along its own axis (ISSUED->RECOVERING or ->RECOVERED)"
          - "sets status = PREPARED, prepared_by_user_id = X-User-ID, prepared_at = current logical clock"
          - "increments Settlement.version by 1"
      - from: PREPARED
        to: APPROVED
        trigger: "POST /driver-pay/settlements/{id}/approve"
        actor: SettlementApprover
        preconditions:
          - "status == PREPARED"
          - "X-User-ID != prepared_by_user_id (segregation of duties)"
          - "Driver.settlement_hold is false"
        side_effects:
          - "sets status = APPROVED, approved_by_user_id = X-User-ID, approved_at = current logical clock"
          - "cascade hop 1: for the ESCROW_DEDUCTION line (when present) appends an EscrowTransaction with txn_type DEPOSIT, reason_code SETTLEMENT_ACCRUAL, settlement_id = this settlement and amount_cents = +line amount"
          - "cascade hop 2: that append itself recomputes Driver.escrow_balance_cents and Driver.balance-derived fields"
          - "cascade hop 3: the new escrow_balance_cents itself drives the escrow axis COLLECTING->FUNDED when it reaches escrow_target_cents, stamping Driver.escrow_funded_at and suppressing future ESCROW_DEDUCTION lines"
          - "recomputes Driver.ytd_gross_pay_cents, ytd_taxable_wages_cents and ytd_per_diem_non_taxable_cents (this settlement now counts)"
          - "marks every RETRO_CORRECTION line source RetroCorrection status PENDING->APPLIED with applied_at and applied_settlement_id"
          - "increments Settlement.version by 1 and Driver.version by 1"
      - from: APPROVED
        to: PAID
        trigger: "POST /driver-pay/settlements/{id}/pay"
        actor: PayrollAdmin
        preconditions: ["status == APPROVED"]
        side_effects:
          - "sets status = PAID, paid_at = current logical clock, payment_reference from the request"
          - "advances every swept Load pay axis ACCRUED->SETTLED"
          - "advances every swept AccessorialClaim APPROVED->PAID"
          - "increments Settlement.version by 1"
      - from: DRAFT
        to: VOIDED
        trigger: "POST /driver-pay/settlements/{id}/void"
        actor: PayrollAdmin
        preconditions: ["status IN {DRAFT, PREPARED, APPROVED, PAID}"]
        side_effects:
          - "sets status = VOIDED, voided_at = current logical clock, void_reason_code from the request"
          - "increments Settlement.version by 1"
      - from: PREPARED
        to: VOIDED
        trigger: "POST /driver-pay/settlements/{id}/void"
        actor: PayrollAdmin
        preconditions: ["status IN {DRAFT, PREPARED, APPROVED, PAID}"]
        side_effects:
          - "deletes every SettlementLine of this settlement and resets line_count and all money fields to 0"
          - "reverts every swept Load pay axis to ACCRUED with settlement_id = null"
          - "clears settlement_id on every swept AccessorialClaim (status stays APPROVED)"
          - "recomputes every touched Advance recovered_cents and outstanding_cents, walking its axis back to RECOVERING or ISSUED"
          - "returns every APPLIED RetroCorrection whose applied_settlement_id is this settlement to PENDING with applied_at = null and applied_settlement_id = null"
          - "sets status = VOIDED, voided_at, void_reason_code; increments Settlement.version by 1"
      - from: APPROVED
        to: VOIDED
        trigger: "POST /driver-pay/settlements/{id}/void"
        actor: PayrollAdmin
        preconditions: ["status IN {DRAFT, PREPARED, APPROVED, PAID}"]
        side_effects:
          - "everything the PREPARED->VOIDED transition does, plus:"
          - "appends an EscrowTransaction with txn_type REVERSAL, reason_code SETTLEMENT_VOID, settlement_id = this settlement and amount_cents = -1 x the DEPOSIT amount this settlement posted"
          - "that append itself recomputes Driver.escrow_balance_cents, which itself drives the escrow axis FUNDED->COLLECTING when the balance falls below escrow_target_cents"
          - "recomputes Driver.ytd_gross_pay_cents, ytd_taxable_wages_cents, ytd_per_diem_non_taxable_cents excluding this settlement"
          - "increments Driver.version by 1"
      - from: PAID
        to: VOIDED
        trigger: "POST /driver-pay/settlements/{id}/void"
        actor: PayrollAdmin
        preconditions: ["status IN {DRAFT, PREPARED, APPROVED, PAID}"]
        side_effects:
          - "everything the APPROVED->VOIDED transition does, plus reverting swept Load pay axis SETTLED->ACCRUED and swept AccessorialClaim PAID->APPROVED"

  - entity: Dispute
    axis: status
    initial_state: OPEN
    terminal_states: [UPHELD, WITHDRAWN]
    transitions:
      - from: OPEN
        to: WITHDRAWN
        trigger: "POST /driver-pay/disputes/{id}/withdraw"
        actor: Driver
        preconditions: ["status IN {OPEN, UNDER_REVIEW}"]
        side_effects:
          - "sets status = WITHDRAWN and increments Dispute.version by 1"
          - "no RetroCorrection is ever created by a withdrawal and the referenced Load pay axis is untouched"
      - from: UNDER_REVIEW
        to: WITHDRAWN
        trigger: "POST /driver-pay/disputes/{id}/withdraw"
        actor: Driver
        preconditions: ["status IN {OPEN, UNDER_REVIEW}"]
        side_effects:
          - "sets status = WITHDRAWN and increments Dispute.version by 1"
          - "reviewed_by_user_id is retained as history; no correction and no pay change follow"
        note: "WITHDRAWN is terminal: a withdrawn dispute can never be reviewed, resolved or reopened, which is what distinguishes it from DENIED."
      - from: OPEN
        to: UNDER_REVIEW
        trigger: "POST /driver-pay/disputes/{id}/review"
        actor: SettlementClerk
        preconditions: ["status == OPEN"]
        side_effects: ["sets status = UNDER_REVIEW and reviewed_by_user_id = X-User-ID", "increments Dispute.version by 1"]
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /driver-pay/disputes/{id}/resolve with outcome DENY"
        actor: SettlementApprover
        preconditions: ["status == UNDER_REVIEW", "X-User-ID != reviewed_by_user_id", "for PAY disputes: X-User-ID != referenced Settlement.prepared_by_user_id"]
        side_effects:
          - "sets status = DENIED, resolution_note, resolved_by_user_id = X-User-ID, adjustment_cents = null"
          - "creates no RetroCorrection and touches no Load or Settlement money field"
          - "increments Dispute.version by 1"
      - from: DENIED
        to: OPEN
        trigger: "POST /driver-pay/disputes/{id}/reopen"
        actor: Driver
        preconditions: ["status == DENIED", "reopen_count < DISPUTE_REOPEN_LIMIT (2)"]
        side_effects:
          - "sets status = OPEN, increments reopen_count by 1, overwrites narrative with the reopen narrative and evidence_doc_ref with the reopen evidence_doc_ref when supplied, clears resolution_note, resolved_by_user_id and reviewed_by_user_id to null"
          - "increments Dispute.version by 1"
        note: "This DENIED->OPEN edge is the dispute cycle; the same dispute row can traverse OPEN->UNDER_REVIEW->DENIED->OPEN twice before the limit rejects a third reopen."
      - from: UNDER_REVIEW
        to: UPHELD
        trigger: "POST /driver-pay/disputes/{id}/resolve with outcome UPHOLD on a MILEAGE dispute whose Load.pay_status == ACCRUED"
        actor: SettlementApprover
        preconditions: ["status == UNDER_REVIEW", "dispute_kind == MILEAGE", "referenced Load.pay_status == ACCRUED", "X-User-ID != reviewed_by_user_id"]
        side_effects:
          - "branch A (unsettled): rewrites the Load pay fields in place through the ACCRUED->ACCRUED pay-axis transition"
          - "sets status = UPHELD, adjustment_cents = new linehaul_pay_cents - old linehaul_pay_cents, resolution_correction_id = null"
          - "increments Dispute.version by 1 and Load.version by 1"
      - from: UNDER_REVIEW
        to: UPHELD
        trigger: "POST /driver-pay/disputes/{id}/resolve with outcome UPHOLD on a MILEAGE dispute whose Load.pay_status == SETTLED"
        actor: SettlementApprover
        preconditions: ["status == UNDER_REVIEW", "dispute_kind == MILEAGE", "referenced Load.pay_status == SETTLED", "X-User-ID != reviewed_by_user_id"]
        side_effects:
          - "branch B (already settled) cascade hop 1: rewrites Load pay fields and drives the pay axis SETTLED->ADJUSTED"
          - "cascade hop 2: that Load mutation itself creates a RetroCorrection (status PENDING, correction_type MILEAGE_REGRADE, reason_code MILEAGE_DISPUTE_UPHELD, origin_settlement_id = Load.settlement_id, source_load_id, source_dispute_id, delta_gross_cents and delta_taxable_cents from retro_correction_delta)"
          - "cascade hop 3: that RetroCorrection insert itself recomputes Driver.pending_retro_correction_cents"
          - "cascade hop 4: the new pending_retro_correction_cents itself recomputes Driver.settlement_hold, which blocks DRAFT->PREPARED on every settlement of that driver once abs(pending) > 50000"
          - "sets status = UPHELD, adjustment_cents, resolution_correction_id = the new correction id"
          - "increments Dispute.version by 1, Load.version by 1 and Driver.version by 1"
      - from: UNDER_REVIEW
        to: UPHELD
        trigger: "POST /driver-pay/disputes/{id}/resolve with outcome UPHOLD on a PAY dispute"
        actor: SettlementApprover
        preconditions:
          - "status == UNDER_REVIEW"
          - "dispute_kind == PAY"
          - "referenced Settlement.status IN {APPROVED, PAID}"
          - "X-User-ID != reviewed_by_user_id"
          - "X-User-ID != referenced Settlement.prepared_by_user_id"
        side_effects:
          - "branch C (pay dispute): creates a RetroCorrection (status PENDING, correction_type PAY_ADJUSTMENT, reason_code PAY_DISPUTE_UPHELD, origin_settlement_id = dispute settlement_id, source_load_id = null, delta_gross_cents = claimed_amount_cents, delta_taxable_cents from retro_correction_delta)"
          - "that insert itself recomputes Driver.pending_retro_correction_cents, which itself recomputes Driver.settlement_hold"
          - "sets status = UPHELD, adjustment_cents = claimed_amount_cents, resolution_correction_id"
          - "touches no Load field: the fork at resolve is keyed on dispute_kind and on Load.pay_status, and the three branches write disjoint side-effect sets"
          - "increments Dispute.version by 1 and Driver.version by 1"

  - entity: RetroCorrection
    axis: status
    initial_state: PENDING
    terminal_states: [APPLIED, CANCELLED]
    transitions:
      - from: PENDING
        to: APPLIED
        trigger: "system event: POST /driver-pay/settlements/{id}/apply-corrections sweeps this correction, followed by that settlement reaching APPROVED"
        actor: system
        preconditions: ["status == PENDING", "target Settlement.status == DRAFT at sweep time", "target Settlement.driver_id == this driver_id"]
        side_effects:
          - "a RETRO_CORRECTION SettlementLine carrying delta_gross_cents is appended to the target settlement at sweep time"
          - "status becomes APPLIED with applied_at and applied_settlement_id when that settlement transitions PREPARED->APPROVED"
          - "Driver.pending_retro_correction_cents and Driver.settlement_hold are recomputed"
      - from: PENDING
        to: CANCELLED
        trigger: "POST /driver-pay/retro-corrections/{id}/cancel"
        actor: PayrollAdmin
        preconditions: ["status == PENDING", "applied_settlement_id is null"]
        side_effects:
          - "sets status = CANCELLED, cancelled_at, cancelled_by_user_id = X-User-ID"
          - "recomputes Driver.pending_retro_correction_cents and therefore Driver.settlement_hold"
          - "increments RetroCorrection.version by 1 and Driver.version by 1"
      - from: APPLIED
        to: PENDING
        trigger: "system event: POST /driver-pay/settlements/{id}/void on applied_settlement_id"
        actor: system
        preconditions: ["status == APPLIED", "applied_settlement_id transitions into VOIDED"]
        side_effects:
          - "returns status to PENDING with applied_at = null and applied_settlement_id = null"
          - "recomputes Driver.pending_retro_correction_cents and Driver.settlement_hold"

# ---------------------------------------------------------------------------
# 1.2.1 Concurrency Rules (OCC on the parent version only)
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: pay-package-revise-stale
    parent_entity: PayPackage
    write_endpoint: "POST /driver-pay/pay-packages/{id}/revise"
    occ_field: "expected_pay_package_version"
    description: |
      Creating a revision DRAFT against a PayPackage whose version has advanced since the client last read it
      is rejected. A package may legitimately be revised repeatedly - nothing in the package state machine
      blocks a second revise, and the newest revision supersedes the package on activation - so the only
      deterministic guard is the stale-version check on the source package.
    error_id: ERR_STALE_PAY_PACKAGE_VERSION
    http_status: 412

  - rule_id: settlement-apply-corrections-stale
    parent_entity: Settlement
    write_endpoint: "POST /driver-pay/settlements/{id}/apply-corrections"
    occ_field: "expected_settlement_version"
    description: |
      Sweeping pending retroactive corrections into a DRAFT Settlement whose version has advanced since the
      client last read it is rejected. Sweeping is legitimately repeatable while the settlement stays DRAFT
      (a later call simply picks up whatever corrections are PENDING then), so a stale view of the settlement
      totals cannot be detected by any state precondition - only by the version check.
    error_id: ERR_STALE_SETTLEMENT_VERSION
    http_status: 412

  - rule_id: driver-escrow-deduction-stale
    parent_entity: Driver
    write_endpoint: "POST /driver-pay/drivers/{id}/escrow/deductions"
    occ_field: "expected_driver_version"
    description: |
      Recording a permissible escrow deduction against a Driver whose version has advanced since the client
      last read the escrow balance is rejected. Multiple deductions against the same driver are legitimate
      and no state field blocks a second one, so the balance the operator based the amount on can only be
      protected by the stale-version check.
    error_id: ERR_STALE_DRIVER_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# 1.3 Calculation Rules Table
# ---------------------------------------------------------------------------
calculations:
  - name: paid_miles_determination
    trigger: "Load movement axis IN_TRANSIT->DELIVERED, and again on the UPHELD resolution of a MILEAGE Dispute on that load"
    algorithm: threshold
    formula: |
      # step 1 - pick the guide (dual variant)
      if an UPHELD MILEAGE Dispute exists on this load:
          applied_mileage_guide = that_dispute.claimed_guide
          base_guide_miles      = that_dispute.claimed_miles
      else:
          applied_mileage_guide = load.pay_package_id_snapshot.mileage_guide
          base_guide_miles      = load.practical_miles  if applied_mileage_guide == PRACTICAL
                                  load.hhg_miles        if applied_mileage_guide == HHG
      # step 2 - short-haul floor, strict less-than
      short_haul_floor_applied = (base_guide_miles < MIN_PAID_MILES)
      paid_miles = MIN_PAID_MILES if short_haul_floor_applied else base_guide_miles
    input_set: "exactly one Load row; the guide comes from Load.pay_package_id_snapshot (stamped at DELIVERED), never from the driver current pay_package_id; a Dispute overrides only when its status == UPHELD and dispute_kind == MILEAGE"
    constants:
      MIN_PAID_MILES: 250
    precision: "whole miles, no rounding; miles are integers"
    variants:
      - name: practical_guide
        when: "pay_package_id_snapshot.mileage_guide == PRACTICAL"
        difference: "reads load.practical_miles, the longer routed distance, which raises paid_miles and can make the PER_MILE component beat the REVENUE_PERCENT component in linehaul_component_pay"
      - name: hhg_guide
        when: "pay_package_id_snapshot.mileage_guide == HHG"
        difference: "reads load.hhg_miles, the shorter short-line distance, which lowers paid_miles for the identical load and can flip the winning linehaul component to LINEHAUL_PERCENT"
      - name: upheld_dispute_override
        when: "a MILEAGE Dispute on the load has status == UPHELD"
        difference: "both the guide and the miles come from the dispute claim, overriding the package guide entirely"

  - name: linehaul_component_pay
    trigger: "Load movement axis IN_TRANSIT->DELIVERED, and again on the UPHELD resolution of a MILEAGE Dispute on that load"
    algorithm: tiered_pricing
    formula: |
      components = PayComponent rows of load.pay_package_id_snapshot
      # per-mile leg: mileage band tier, marginal rate above the band break
      if PER_MILE component c_pm exists:
          per_mile_pay = min(paid_miles, MILEAGE_BAND_BREAK) * c_pm.rate_value
                       + max(0, paid_miles - MILEAGE_BAND_BREAK) * (c_pm.rate_value + LONG_HAUL_BUMP_CENTS)
      else:
          per_mile_pay = null
      # revenue-percentage leg
      if REVENUE_PERCENT component c_rp exists:
          percent_pay = round_half_up(load.linehaul_revenue_cents * c_rp.rate_value / 10000)
      else:
          percent_pay = null
      # non-linear selection: the greater leg wins, PER_MILE wins an exact tie
      if per_mile_pay is not null and percent_pay is not null:
          if per_mile_pay >= percent_pay: linehaul_pay_cents = per_mile_pay ; linehaul_line_type = LINEHAUL_PER_MILE
          else:                           linehaul_pay_cents = percent_pay  ; linehaul_line_type = LINEHAUL_PERCENT
      elif per_mile_pay is not null:      linehaul_pay_cents = per_mile_pay ; linehaul_line_type = LINEHAUL_PER_MILE
      elif percent_pay is not null:       linehaul_pay_cents = percent_pay  ; linehaul_line_type = LINEHAUL_PERCENT
      else:                               linehaul_pay_cents = 0            ; linehaul_line_type = NONE
      # team share applies AFTER the selection, on the winning leg only
      if load.driver_id.driver_type == COMPANY_TEAM:
          linehaul_pay_cents = round_half_up(linehaul_pay_cents * TEAM_SHARE_BPS / 10000)
      # hourly and activity legs are additive and never enter the max()
      hourly_pay   = round_half_up(load.hours_worked_minutes * c_hourly.rate_value / 60) if HOURLY component exists and hours_worked_minutes > 0 else 0
      activity_pay = c_activity.rate_value if ACTIVITY component exists else 0
    input_set: "the PayComponent rows of Load.pay_package_id_snapshot only; components added to a later revision of the package never affect an already-delivered load"
    constants:
      MILEAGE_BAND_BREAK: 500
      LONG_HAUL_BUMP_CENTS: 3
      TEAM_SHARE_BPS: 5000
    precision: "cents, round_half_up; each leg is rounded to whole cents independently before the max() comparison, and the team share is rounded after the comparison"
    variants:
      - name: per_mile_wins
        when: "per_mile_pay >= percent_pay, including the exact tie"
        difference: "the settlement line is typed LINEHAUL_PER_MILE and carries quantity = paid_miles with rate_value = the PER_MILE rate"
      - name: percent_wins
        when: "percent_pay > per_mile_pay"
        difference: "the settlement line is typed LINEHAUL_PERCENT and carries quantity = 1 with rate_value = the basis-point rate; paid_miles is still recorded on the Load but earns nothing"

  - name: accessorial_pay
    trigger: "POST /driver-pay/accessorial-claims/{id}/approve"
    algorithm: threshold
    formula: |
      total_minutes = (end_at - start_at) in whole minutes
      switch accessorial_type:
        DETENTION:
          billable_minutes = max(0, total_minutes - DETENTION_FREE_MINUTES)
          billable_units   = floor(billable_minutes / 15)                  # 15-minute increments, truncated
          amount_cents     = min(billable_units * DETENTION_INCREMENT_CENTS, DETENTION_CAP_CENTS)
        LAYOVER:
          inclusive_days   = number of distinct UTC calendar dates covered by [start_at, end_at] inclusive of both endpoint dates
          billable_units   = min(max(0, inclusive_days - 1), LAYOVER_MAX_PAYABLE_DAYS)   # the first calendar day is unpaid
          amount_cents     = billable_units * LAYOVER_DAILY_CENTS
        STOP_OFF:
          billable_units   = max(0, load.stop_count - 1)                   # read from the Load, request interval ignored
          amount_cents     = billable_units * STOP_OFF_CENTS
        TARPING:
          billable_units   = 1
          amount_cents     = TARPING_FLAT_CENTS
        BREAKDOWN:
          billable_units   = max(0, floor(total_minutes / 1440) - 1)       # first 24h unpaid
          amount_cents     = billable_units * BREAKDOWN_DAILY_CENTS
    input_set: "one AccessorialClaim plus its referenced Load; for STOP_OFF the quantity comes from Load.stop_count and any units implied by the request interval are ignored"
    constants:
      DETENTION_FREE_MINUTES: 120
      DETENTION_INCREMENT_CENTS: 500
      DETENTION_CAP_CENTS: 20000
      LAYOVER_DAILY_CENTS: 12500
      LAYOVER_MAX_PAYABLE_DAYS: 3
      STOP_OFF_CENTS: 5000
      TARPING_FLAT_CENTS: 7500
      BREAKDOWN_DAILY_CENTS: 10000
    precision: "cents, exact integer arithmetic; the 15-minute detention increment count is truncated toward zero, never rounded"

  - name: per_diem_allocation
    trigger: "POST /driver-pay/settlements/{id}/prepare, after gross_pay_cents is known"
    algorithm: aggregation
    formula: |
      if driver.per_diem_elected is false or package.per_diem_method == NONE:
          per_diem_non_taxable_cents = 0 ; per_diem_excess_taxable_cents = 0
      else:
          if package.per_diem_method == DAY_BASED:
              days_out_count  = cardinality of the UNION over swept Loads of the set of UTC calendar dates
                                covered by [load.dispatched_at, load.delivered_at] inclusive of both endpoint dates
              per_diem_gross  = days_out_count * PER_DIEM_DAILY_CENTS
          if package.per_diem_method == PERCENT_OF_LINEHAUL:
              days_out_count  = same union cardinality (recorded for the statement but not used in the amount)
              per_diem_gross  = round_half_up(linehaul_total_cents * PER_DIEM_PCT_BPS / 10000)
          cap = round_half_up(gross_pay_cents * PER_DIEM_MAX_PCT_OF_GROSS_BPS / 10000)
          per_diem_non_taxable_cents    = min(per_diem_gross, cap)
          per_diem_excess_taxable_cents = per_diem_gross - per_diem_non_taxable_cents
      taxable_wages_cents = gross_pay_cents - per_diem_non_taxable_cents
      # per diem is a reclassification, never new money:
      #   gross_pay_cents == taxable_wages_cents + per_diem_non_taxable_cents  (invariant)
    input_set: "the Loads swept into this settlement (for the day union and the linehaul base) and the package per_diem_method of Settlement.driver_id.pay_package_id at prepare time"
    constants:
      PER_DIEM_DAILY_CENTS: 6900
      PER_DIEM_PCT_BPS: 2800
      PER_DIEM_MAX_PCT_OF_GROSS_BPS: 4000
    precision: "cents, round_half_up; the cap is rounded before the min() comparison"
    variants:
      - name: day_based
        when: "package.per_diem_method == DAY_BASED"
        difference: "the allocation scales with the number of distinct days on the road and is completely independent of how much the loads paid, so a high-revenue week reclassifies proportionally less"
      - name: percent_of_linehaul
        when: "package.per_diem_method == PERCENT_OF_LINEHAUL"
        difference: "the allocation scales with linehaul_total_cents, so the identical set of loads yields a different per_diem_non_taxable_cents and therefore a different taxable_wages_cents than day_based for the same gross"

  - name: escrow_accrual_deduction
    trigger: "POST /driver-pay/settlements/{id}/prepare, for drivers whose escrow_status == COLLECTING"
    algorithm: aggregation
    formula: |
      if driver.escrow_status != COLLECTING:
          escrow_deduction_cents = 0
      else:
          # PINNED ROUNDING ORDER: round each linehaul earning line to whole cents, THEN sum.
          # Summing first and rounding once is explicitly wrong and produces a different cent total.
          per_line_accruals = [ round_half_up(line.amount_cents * ESCROW_ACCRUAL_BPS / 10000)
                                for line in settlement lines with line_type IN
                                  {LINEHAUL_PER_MILE, LINEHAUL_PERCENT, HOURLY, ACTIVITY}
                                ordered by line.sequence ASC ]
          raw = sum(per_line_accruals)
          escrow_deduction_cents = min(raw,
                                       driver.escrow_monthly_deduction_cents,
                                       driver.escrow_target_cents - driver.escrow_balance_cents)
          if escrow_deduction_cents < 0: escrow_deduction_cents = 0
    input_set: "only the earning lines of THIS settlement with line_type IN {LINEHAUL_PER_MILE, LINEHAUL_PERCENT, HOURLY, ACTIVITY}; ACCESSORIAL and RETRO_CORRECTION lines never accrue escrow"
    constants:
      ESCROW_ACCRUAL_BPS: 800
    precision: "cents, round_half_up applied per line before summation (round-then-sum), never sum-then-round"

  - name: advance_recovery_waterfall
    trigger: "POST /driver-pay/settlements/{id}/prepare, after escrow_deduction_cents is known"
    algorithm: waterfall_allocation
    formula: |
      # The cap looks circular - the recovery ceiling is a percentage of net pay, and net pay depends on
      # the recovery - so the evaluation order is PINNED here:
      #   1. provisional_net = gross_pay_cents - escrow_deduction_cents      (recovery EXCLUDED)
      #   2. recovery_cap    = round_half_up(provisional_net * ADVANCE_RECOVERY_CAP_BPS / 10000)
      #   3. allocate the waterfall against recovery_cap
      #   4. net_pay_cents   = provisional_net - advance_recovery_cents
      # Reading the cap off the FINAL net is wrong and yields a smaller recovery.
      provisional_net = gross_pay_cents - escrow_deduction_cents
      remaining       = round_half_up(provisional_net * ADVANCE_RECOVERY_CAP_BPS / 10000)
      buckets = Advance rows of this driver with status IN {ISSUED, RECOVERING}, taken in this order:
                  bucket 1: advance_type == CASH_ADVANCE, ordered by Advance.created_at ASC
                  bucket 2: advance_type == FUEL_CARD,    ordered by Advance.created_at ASC
      for advance in buckets:
          take = min(advance.installment_cents, advance.outstanding_cents, remaining)
          if take > 0: emit an ADVANCE_RECOVERY line of `take` against this advance ; remaining -= take
      advance_recovery_cents = sum of the emitted ADVANCE_RECOVERY line amounts
      # whatever is not recovered stays in Advance.outstanding_cents and carries into the next settlement
    input_set: "Advance rows whose driver_id == settlement.driver_id and status IN {ISSUED, RECOVERING}; RECOVERED advances are excluded; ordering is CASH_ADVANCE before FUEL_CARD and created_at ASC inside each bucket with no further tie-break needed because created_at is unique per row at three-fraction-digit precision"
    constants:
      ADVANCE_RECOVERY_CAP_BPS: 2500
    precision: "cents, round_half_up on the cap only; every allocation is exact integer arithmetic"

  - name: settlement_period_accrual
    trigger: "POST /driver-pay/settlements/{id}/prepare"
    algorithm: chronological
    formula: |
      eligible_loads = Load rows where
          driver_id == settlement.driver_id
          AND movement_status == DELIVERED
          AND pay_status == ACCRUED                    # UNPAID, SETTLED and ADJUSTED are excluded
          AND settlement_id is null
          AND period_start <= delivered_at < period_end    # half-open, inclusive lower, exclusive upper
        ordered by delivered_at ASC, then created_at ASC as the tie-break
      eligible_claims = AccessorialClaim rows where
          driver_id == settlement.driver_id
          AND status == APPROVED                       # SUBMITTED, REJECTED and PAID are excluded
          AND settlement_id is null
          AND period_start <= end_at < period_end          # half-open on the claim end instant
        ordered by end_at ASC, then created_at ASC as the tie-break
      if eligible_loads is empty AND eligible_claims is empty AND this settlement has no
         RETRO_CORRECTION line already swept by apply-corrections:
          reject with ERR_NO_SETTLEABLE_ACTIVITY
    input_set: "explicitly filtered as above; a load delivered exactly at period_end belongs to the NEXT period, a load delivered exactly at period_start belongs to THIS period"
    precision: "n/a - selection only"

  - name: settlement_line_generation
    trigger: "POST /driver-pay/settlements/{id}/prepare"
    algorithm: constraint_propagation
    formula: |
      # PINNED GENERATION ORDER. sequence starts at (max existing sequence on this settlement) + 1,
      # so RETRO_CORRECTION lines already swept by apply-corrections keep the sequence numbers they were
      # given and are never renumbered or deleted by prepare.
      # 1. for each eligible load in accrual order:
      #      a. one line typed load.linehaul_line_type, quantity = paid_miles (PER_MILE) or 1 (PERCENT),
      #         rate_value = the driving component rate, amount_cents = load.linehaul_pay_cents,
      #         reference_type LOAD, reference_id = load.id, taxable = component.taxable
      #      b. one HOURLY line when hourly_pay > 0 (quantity = hours_worked_minutes / 60 rounded to 2 dp)
      #      c. one ACTIVITY line when the package has an ACTIVITY component (quantity = 1)
      # 2. for each eligible claim in accrual order: one ACCESSORIAL line, quantity = billable_units,
      #      amount_cents = claim.amount_cents, reference_type ACCESSORIAL_CLAIM, taxable = true
      # 3. gross_pay_cents = sum of the amounts of every line with line_type IN
      #      {LINEHAUL_PER_MILE, LINEHAUL_PERCENT, HOURLY, ACTIVITY, ACCESSORIAL, RETRO_CORRECTION}
      # 4. per_diem_allocation -> one PER_DIEM line (reference_type DRIVER, taxable false,
      #      amount_cents = per_diem_non_taxable_cents) emitted only when that amount > 0;
      #      the PER_DIEM line is excluded from gross and from deduction_total
      # 5. escrow_accrual_deduction -> at most one ESCROW_DEDUCTION line (reference_type DRIVER, taxable false)
      # 6. advance_recovery_waterfall -> zero or more ADVANCE_RECOVERY lines (reference_type ADVANCE)
      # 7. deduction_total_cents = escrow_deduction_cents + advance_recovery_cents
      #    net_pay_cents         = gross_pay_cents - deduction_total_cents
      # 8. itemization gate: when itemization_required is true, every line with line_type IN
      #      {LINEHAUL_PER_MILE, LINEHAUL_PERCENT, HOURLY, ACTIVITY, ACCESSORIAL, RETRO_CORRECTION}
      #      MUST carry a non-null reference_id and a non-null quantity, AND every ACCESSORIAL line
      #      MUST have a non-null document_ref on its source AccessorialClaim, so every accessorial
      #      charge on a leased-operator statement is evidenced; otherwise ERR_ITEMIZATION_INCOMPLETE
      # 9. if net_pay_cents < 0 -> ERR_NEGATIVE_NET_PAY and the whole prepare is rejected with no lines kept
    input_set: "the eligible loads and claims from settlement_period_accrual plus the RETRO_CORRECTION lines already present from apply-corrections"
    precision: "cents; every line amount is a whole number of cents; no line is ever stored with a fractional value"

  - name: retro_correction_delta
    trigger: "UPHELD resolution of a Dispute (MILEAGE branch B on a SETTLED load, or PAY branch C)"
    algorithm: projection
    formula: |
      if dispute_kind == MILEAGE:
          old_pay = the amount_cents of the LINEHAUL_PER_MILE or LINEHAUL_PERCENT SettlementLine of
                    origin_settlement whose reference_id == load.id
          new_pay = linehaul_component_pay recomputed with the upheld guide and miles, still using
                    load.pay_package_id_snapshot components
          delta_gross_cents = new_pay - old_pay                      # signed, negative on a down-grade
      if dispute_kind == PAY:
          delta_gross_cents = dispute.claimed_amount_cents           # always positive
      # taxable delta depends on the ORIGIN package per diem method, not the current one
      if origin_settlement.driver.pay_package_id_snapshot_method == PERCENT_OF_LINEHAUL:
          delta_taxable_cents = delta_gross_cents
                              - round_half_up(delta_gross_cents * PER_DIEM_PCT_BPS / 10000)
      else:
          delta_taxable_cents = delta_gross_cents
    input_set: "one Dispute, its Load (MILEAGE only), and the single linehaul SettlementLine of the origin settlement that references that load"
    constants:
      PER_DIEM_PCT_BPS: 2800
    precision: "cents, round_half_up; the sign of delta_gross_cents is preserved through the rounding by rounding the magnitude and re-applying the sign"

# ---------------------------------------------------------------------------
# 1.4 Validation Rules Table (ordered by priority; lower number wins)
#     Domain ordering inside the business band:
#       (a) wage/compliance safety  -> (b) constraint & temporal  ->
#       (c) referential consistency -> (d) fiscal / money limits
#     Rationale: a settlement office may never pay an undocumented or
#     self-approved item, so compliance outranks bookkeeping, and money
#     limits are evaluated last because they are the only checks the driver
#     can cure by waiting for the next period.
# ---------------------------------------------------------------------------
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers are both present and X-User-Role is one of the five declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "the acting role appears in the endpoint roles list"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: auth
    check: "when the acting role is Driver, X-User-ID equals the driver_id of the addressed resource (Driver.id, Load.driver_id, AccessorialClaim.driver_id, Advance.driver_id, Settlement.driver_id, Dispute.driver_id, RetroCorrection.driver_id); a Driver may never read or write another driver's row"
    error_id: ERR_DRIVER_SCOPE_VIOLATION
    http_status: 403
    applies_to: "all Driver-visible endpoints"

  - priority: 4
    category: business_constraint
    check: "every field marked required in the endpoint input list is present and non-null"
    error_id: ERR_MISSING_REQUIRED_FIELD
    http_status: 422
    applies_to: all

  - priority: 5
    category: business_constraint
    check: "enum fields carry a declared member, money and count fields are integers, magnitude fields (amount_cents supplied by a client, miles, minutes, stop_count, rate_value) are >= 0, and timestamps are ISO-8601 UTC"
    error_id: ERR_INVALID_FIELD_VALUE
    http_status: 422
    applies_to: all

  - priority: 6
    category: existence
    check: "the Driver addressed by the path or by driver_id in the body exists"
    error_id: ERR_DRIVER_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints carrying a driver reference"

  - priority: 7
    category: existence
    check: "the PayPackage addressed by the path or by pay_package_id in the body exists"
    error_id: ERR_PAY_PACKAGE_NOT_FOUND
    http_status: 404
    applies_to: "pay-package endpoints, POST /driver-pay/drivers/{id}/assign-pay-package"

  - priority: 8
    category: existence
    check: "the Load addressed by the path or by load_id in the body exists"
    error_id: ERR_LOAD_NOT_FOUND
    http_status: 404
    applies_to: "load endpoints, POST /driver-pay/accessorial-claims, POST /driver-pay/disputes"

  - priority: 9
    category: existence
    check: "the AccessorialClaim addressed by the path exists"
    error_id: ERR_ACCESSORIAL_CLAIM_NOT_FOUND
    http_status: 404
    applies_to: "accessorial-claim endpoints"

  - priority: 10
    category: existence
    check: "the Advance addressed by the path exists"
    error_id: ERR_ADVANCE_NOT_FOUND
    http_status: 404
    applies_to: "advance endpoints"

  - priority: 11
    category: existence
    check: "the Settlement addressed by the path or by origin_settlement_id in the body exists"
    error_id: ERR_SETTLEMENT_NOT_FOUND
    http_status: 404
    applies_to: "settlement endpoints, POST /driver-pay/disputes"

  - priority: 12
    category: existence
    check: "the Dispute addressed by the path exists"
    error_id: ERR_DISPUTE_NOT_FOUND
    http_status: 404
    applies_to: "dispute endpoints"

  - priority: 13
    category: existence
    check: "the RetroCorrection addressed by the path exists"
    error_id: ERR_RETRO_CORRECTION_NOT_FOUND
    http_status: 404
    applies_to: "POST /driver-pay/retro-corrections/{id}/cancel, GET /driver-pay/retro-corrections/{id}"

  - priority: 14
    category: existence
    check: "the EscrowTransaction addressed by the path exists"
    error_id: ERR_ESCROW_TRANSACTION_NOT_FOUND
    http_status: 404
    applies_to: "escrow-transaction endpoints"

  - priority: 15
    category: state
    check: "expected_pay_package_version equals PayPackage.version"
    error_id: ERR_STALE_PAY_PACKAGE_VERSION
    http_status: 412
    applies_to: "POST /driver-pay/pay-packages/{id}/revise"

  - priority: 16
    category: state
    check: "expected_settlement_version equals Settlement.version"
    error_id: ERR_STALE_SETTLEMENT_VERSION
    http_status: 412
    applies_to: "POST /driver-pay/settlements/{id}/apply-corrections"

  - priority: 17
    category: state
    check: "expected_driver_version equals Driver.version"
    error_id: ERR_STALE_DRIVER_VERSION
    http_status: 412
    applies_to: "POST /driver-pay/drivers/{id}/escrow/deductions"

  - priority: 18
    category: state
    check: "the PayPackage is in DRAFT for component addition and for activate; it is in ACTIVE for revise, for retire and for assignment to a driver"
    error_id: ERR_PAY_PACKAGE_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /driver-pay/pay-packages/{id}/components, /activate, /revise, /retire, POST /driver-pay/drivers/{id}/assign-pay-package"

  - priority: 19
    category: state
    check: "the PayPackage has_pending_revision is false; a package whose successor is still in DRAFT cannot be revised again or retired"
    error_id: ERR_PAY_PACKAGE_REVISION_PENDING
    http_status: 409
    applies_to: "POST /driver-pay/pay-packages/{id}/revise, /retire"

  - priority: 20
    category: state
    check: "the Driver employment_status is the one the operation needs: ACTIVE for loads, accessorial claims, advances, settlements and escrow deductions; ONBOARDING or ACTIVE for assign-pay-package, since a driver is activated only after a package is assigned; and for POST /drivers/{id}/status the requested new_status must be reachable from the current employment_status on the employment axis. A SUSPENDED or TERMINATED driver accrues no new work; only escrow close/return and the approve and pay of already-prepared work remain open."
    error_id: ERR_DRIVER_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /driver-pay/loads, /accessorial-claims, /advances, /settlements, /drivers/{id}/assign-pay-package, /drivers/{id}/status, /drivers/{id}/escrow/deductions"

  - priority: 21
    category: state
    check: "the Driver escrow_status is COLLECTING or FUNDED for a deduction and for a reversal; it is CLOSING for a return"
    error_id: ERR_ESCROW_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /driver-pay/drivers/{id}/escrow/deductions, POST /driver-pay/escrow-transactions/{id}/reverse, POST /driver-pay/drivers/{id}/escrow/return"

  - priority: 22
    category: state
    check: "the Load movement_status is the one the operation needs: TENDERED for dispatch, IN_TRANSIT for deliver, DELIVERED for accessorial approval and for a MILEAGE dispute"
    error_id: ERR_LOAD_NOT_DELIVERED
    http_status: 409
    applies_to: "POST /driver-pay/loads/{id}/dispatch, /deliver, POST /driver-pay/accessorial-claims/{id}/approve, POST /driver-pay/disputes"

  - priority: 23
    category: business_referential
    check: "an AccessorialClaim referenced by an operation is not already attached to a settlement (status PAID or settlement_id non-null). This referential check deliberately outranks the claim-status check at priority 49: a claim swept onto a settlement is frozen, and the caller must be told that it is settled rather than that its status is wrong"
    error_id: ERR_CLAIM_ALREADY_SETTLED
    http_status: 409
    applies_to: "POST /driver-pay/accessorial-claims/{id}/approve, /reject, /documents"

  - priority: 24
    category: state
    check: "the Settlement status is DRAFT for apply-corrections and for prepare, PREPARED for approve, APPROVED for pay"
    error_id: ERR_SETTLEMENT_STATE_INVALID
    http_status: 409
    applies_to: "POST /driver-pay/settlements/{id}/apply-corrections, /prepare, /approve, /pay"

  - priority: 25
    category: state
    check: "the Settlement is not in a terminal status (PAID and VOIDED accept no further transition, including void)"
    error_id: ERR_SETTLEMENT_TERMINAL
    http_status: 409
    applies_to: "POST /driver-pay/settlements/{id}/void, /apply-corrections, /prepare, /approve, /pay"

  - priority: 26
    category: state
    check: "the Dispute status is the one the operation needs: OPEN for review, UNDER_REVIEW for resolve, DENIED for reopen, OPEN or UNDER_REVIEW for withdraw"
    error_id: ERR_DISPUTE_STATE_INVALID
    http_status: 409
    applies_to: "POST /driver-pay/disputes/{id}/review, /resolve, /reopen, /withdraw"

  - priority: 27
    category: state
    check: "the Advance status is ISSUED for cancel; a RECOVERING or RECOVERED advance can no longer be cancelled"
    error_id: ERR_ADVANCE_NOT_CANCELLABLE
    http_status: 409
    applies_to: "POST /driver-pay/advances/{id}/cancel"

  - priority: 28
    category: state
    check: "the RetroCorrection status is PENDING for cancel; APPLIED and CANCELLED corrections are immutable"
    error_id: ERR_CORRECTION_NOT_PENDING
    http_status: 409
    applies_to: "POST /driver-pay/retro-corrections/{id}/cancel"

  - priority: 29
    category: business_safety
    check: "an AccessorialClaim whose accessorial_type is in {DETENTION, TARPING, BREAKDOWN} carries a non-null document_ref before it may be approved; the documentation requirement is evaluated before any bookkeeping question about the underlying load"
    error_id: ERR_DOCUMENTATION_MISSING
    http_status: 422
    applies_to: "POST /driver-pay/accessorial-claims/{id}/approve"

  - priority: 30
    category: business_safety
    check: "the X-User-ID approving a settlement differs from Settlement.prepared_by_user_id, and the X-User-ID paying it differs from Settlement.approved_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: "POST /driver-pay/settlements/{id}/approve, /pay"

  - priority: 31
    category: business_safety
    check: "an escrow deduction carries a reason_code drawn from the permissible list {ESCROW_FUNDING, TRACTOR_LEASE, INSURANCE_PREMIUM, PERMIT_FEE, CARGO_CLAIM_DAMAGE, FUEL_TAX_TRUEUP}; any other reason is an impermissible deduction from a leased operator escrow"
    error_id: ERR_DEDUCTION_NOT_PERMISSIBLE
    http_status: 422
    applies_to: "POST /driver-pay/drivers/{id}/escrow/deductions"

  - priority: 32
    category: business_safety
    check: "an escrow return is executed only at or after Driver.escrow_return_due_at, which is set to termination time plus ESCROW_RETURN_DAYS; the logical clock must have reached that instant"
    error_id: ERR_ESCROW_RETURN_NOT_DUE
    http_status: 409
    applies_to: "POST /driver-pay/drivers/{id}/escrow/return"

  - priority: 33
    category: business_safety
    check: "when Settlement.itemization_required is true, every earning line carries a non-null reference_id and a non-null quantity, and every ACCESSORIAL line has a non-null document_ref on its source AccessorialClaim, so the leased-operator statement is fully itemized and every accessorial charge is evidenced"
    error_id: ERR_ITEMIZATION_INCOMPLETE
    http_status: 422
    applies_to: "POST /driver-pay/settlements/{id}/prepare"

  - priority: 34
    category: business_constraint
    check: "Driver.settlement_hold is false; a driver carrying an unabsorbed retroactive correction whose absolute value exceeds RETRO_HOLD_THRESHOLD may not have a new settlement prepared until the correction is applied or cancelled"
    error_id: ERR_SETTLEMENT_HOLD_ACTIVE
    http_status: 409
    applies_to: "POST /driver-pay/settlements/{id}/prepare"

  - priority: 35
    category: business_constraint
    check: "a PayComponent sequence is unique within its PayPackage and a package holds at most one component of each component_type"
    error_id: ERR_DUPLICATE_COMPONENT
    http_status: 409
    applies_to: "POST /driver-pay/pay-packages/{id}/components"

  - priority: 36
    category: business_constraint
    check: "the component_type is legal for the package driver_type: OWNER_OPERATOR and LEASED_OPERATOR packages may not carry an HOURLY component, and COMPANY_SOLO / COMPANY_TEAM packages may not carry a REVENUE_PERCENT component"
    error_id: ERR_COMPONENT_TYPE_NOT_ALLOWED
    http_status: 422
    applies_to: "POST /driver-pay/pay-packages/{id}/components"

  - priority: 37
    category: business_constraint
    check: "a PayPackage is activated only when it holds at least one component of type PER_MILE or REVENUE_PERCENT, so every activated package can pay linehaul"
    error_id: ERR_PACKAGE_HAS_NO_LINEHAUL_COMPONENT
    http_status: 422
    applies_to: "POST /driver-pay/pay-packages/{id}/activate"

  - priority: 38
    category: business_temporal
    check: "end_at is strictly after start_at on an accessorial claim, and period_end is strictly after period_start on a settlement"
    error_id: ERR_INTERVAL_INVALID
    http_status: 422
    applies_to: "POST /driver-pay/accessorial-claims, POST /driver-pay/settlements"

  - priority: 39
    category: business_temporal
    check: "a DETENTION, TARPING, BREAKDOWN or STOP_OFF claim interval does not overlap another non-REJECTED claim interval on the SAME Load, treating each interval as half-open [start_at, end_at) and extending the stored interval by DETENTION_BUFFER_MINUTES at its end"
    error_id: ERR_ACCESSORIAL_OVERLAP
    http_status: 409
    applies_to: "POST /driver-pay/accessorial-claims"

  - priority: 40
    category: business_temporal
    check: "a LAYOVER claim shares no UTC calendar date with another non-REJECTED LAYOVER claim of the SAME Driver, comparing inclusive calendar-date sets rather than instants, so two layovers on different loads that touch the same date collide"
    error_id: ERR_LAYOVER_OVERLAP
    http_status: 409
    applies_to: "POST /driver-pay/accessorial-claims"

  - priority: 41
    category: business_temporal
    check: "a Settlement period does not overlap the period of another non-VOIDED Settlement of the same Driver, comparing half-open [period_start, period_end) windows"
    error_id: ERR_SETTLEMENT_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /driver-pay/settlements"

  - priority: 42
    category: business_temporal
    check: "a Dispute is filed within DISPUTE_WINDOW_DAYS of the reference instant: Load.delivered_at for a MILEAGE dispute on an unsettled load, otherwise origin_settlement.paid_at"
    error_id: ERR_DISPUTE_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /driver-pay/disputes"

  - priority: 43
    category: business_constraint
    check: "no other Dispute of the same dispute_kind on the same Load or origin Settlement is currently in OPEN or UNDER_REVIEW"
    error_id: ERR_DISPUTE_ALREADY_OPEN
    http_status: 409
    applies_to: "POST /driver-pay/disputes"

  - priority: 44
    category: business_constraint
    check: "Dispute.reopen_count is strictly below DISPUTE_REOPEN_LIMIT before a DENIED dispute is reopened"
    error_id: ERR_DISPUTE_REOPEN_LIMIT
    http_status: 409
    applies_to: "POST /driver-pay/disputes/{id}/reopen"

  - priority: 45
    category: business_constraint
    check: "a MILEAGE dispute claim differs from what the load already paid: the pair (claimed_guide, claimed_miles) is not equal to (load.applied_mileage_guide, load.base_guide_miles)"
    error_id: ERR_MILEAGE_CLAIM_UNCHANGED
    http_status: 422
    applies_to: "POST /driver-pay/disputes"

  - priority: 46
    category: business_constraint
    check: "the computed accessorial amount_cents is strictly greater than zero; an interval that lands exactly on the free allowance or that yields zero billable units is not an approvable accessorial"
    error_id: ERR_ZERO_VALUE_ACCESSORIAL
    http_status: 422
    applies_to: "POST /driver-pay/accessorial-claims/{id}/approve"

  - priority: 47
    category: business_constraint
    check: "the prepare sweep finds at least one eligible Load, one eligible AccessorialClaim, or one already-applied RETRO_CORRECTION line; a settlement with an empty accrual set is not preparable"
    error_id: ERR_NO_SETTLEABLE_ACTIVITY
    http_status: 422
    applies_to: "POST /driver-pay/settlements/{id}/prepare"

  - priority: 48
    category: business_referential
    check: "a Load swept or referenced is not already attached to another settlement (pay_status IN {SETTLED, ADJUSTED} or settlement_id non-null)"
    error_id: ERR_LOAD_ALREADY_SETTLED
    http_status: 409
    applies_to: "POST /driver-pay/accessorial-claims/{id}/approve, POST /driver-pay/settlements/{id}/prepare"

  - priority: 49
    category: state
    check: "the AccessorialClaim status is SUBMITTED for approve and for reject, and is SUBMITTED or REJECTED for a document attachment"
    error_id: ERR_CLAIM_NOT_SUBMITTED
    http_status: 409
    applies_to: "POST /driver-pay/accessorial-claims/{id}/approve, /reject, /documents"

  - priority: 50
    category: business_referential
    check: "the driver_id on the body agrees with the driver of the referenced parent: an AccessorialClaim load belongs to the claiming driver, a Dispute load or origin settlement belongs to the disputing driver"
    error_id: ERR_DRIVER_MISMATCH
    http_status: 422
    applies_to: "POST /driver-pay/accessorial-claims, POST /driver-pay/disputes"

  - priority: 51
    category: business_referential
    check: "every RetroCorrection swept by apply-corrections is PENDING and belongs to Settlement.driver_id"
    error_id: ERR_NO_PENDING_CORRECTIONS
    http_status: 409
    applies_to: "POST /driver-pay/settlements/{id}/apply-corrections"

  - priority: 52
    category: business_referential
    check: "the Driver has an assigned pay_package_id and that package was ACTIVE at the load delivery instant, so linehaul can be computed"
    error_id: ERR_DRIVER_HAS_NO_PAY_PACKAGE
    http_status: 409
    applies_to: "POST /driver-pay/loads/{id}/deliver, POST /driver-pay/settlements/{id}/prepare"

  - priority: 53
    category: business_fiscal
    check: "the requested escrow deduction magnitude does not exceed Driver.escrow_balance_cents; a permissible deduction may never drive the escrow principal negative"
    error_id: ERR_ESCROW_INSUFFICIENT_BALANCE
    http_status: 422
    applies_to: "POST /driver-pay/drivers/{id}/escrow/deductions"

  - priority: 54
    category: business_fiscal
    check: "the requested advance amount_cents plus Driver.advance_outstanding_cents does not exceed ADVANCE_OUTSTANDING_LIMIT_CENTS"
    error_id: ERR_ADVANCE_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /driver-pay/advances"

  - priority: 55
    category: business_fiscal
    check: "the computed net_pay_cents of a prepared settlement is greater than or equal to zero; a period whose retroactive down-grade exceeds its earnings cannot be prepared and must be resolved by the pay office"
    error_id: ERR_NEGATIVE_NET_PAY
    http_status: 422
    applies_to: "POST /driver-pay/settlements/{id}/prepare"

# ---------------------------------------------------------------------------
# 1.5 API Endpoint Table
# ---------------------------------------------------------------------------
endpoints:
  # --- logical clock (test-driving, ladder rung 3) -------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock to an arbitrary UTC instant. Every timestamp the server stamps (created_at, dispatched_at, delivered_at, prepared_at, approved_at, paid_at, escrow_return_due_at evaluation, dispute-window evaluation) reads this clock. The clock starts at exactly 2026-08-01T00:00:00Z at server startup and MUST NOT fall back to real wall-clock time before the first call to this endpoint."
    roles: [PayrollAdmin, SettlementClerk, SettlementApprover, ComplianceAuditor, Driver]
    code: 200
    input: [current_utc]
    output: null
    side_effects: ["logical clock moves; no entity is mutated"]

  # --- pay packages -------------------------------------------------------
  - method: POST
    path: "/driver-pay/pay-packages"
    description: "Create a DRAFT pay package for a driver type, naming the mileage guide, the per diem method and the escrow requirement."
    roles: [PayrollAdmin]
    code: 201
    input: [name, driver_type, mileage_guide, per_diem_method, escrow_required, "escrow_target_cents?", "escrow_monthly_deduction_cents?"]
    output: PayPackage
    side_effects: ["status=DRAFT", "component_count=0", "has_pending_revision=false"]

  - method: GET
    path: "/driver-pay/pay-packages"
    description: "List pay packages, optionally filtered by status, driver type, or the package they supersede."
    roles: [PayrollAdmin, SettlementClerk, SettlementApprover, ComplianceAuditor]
    code: 200
    input: ["status?", "driver_type?", "supersedes_pay_package_id?"]
    output: PayPackage[]
    side_effects: []

  - method: GET
    path: "/driver-pay/pay-packages/{id}"
    description: "Read one pay package including its lifecycle timestamps and pending-revision flag."
    roles: [PayrollAdmin, SettlementClerk, SettlementApprover, ComplianceAuditor]
    code: 200
    input: []
    output: PayPackage
    side_effects: []

  - method: POST
    path: "/driver-pay/pay-packages/{id}/components"
    description: "Append an immutable pay component (PER_MILE, REVENUE_PERCENT, HOURLY or ACTIVITY) to a DRAFT package at a given sequence."
    roles: [PayrollAdmin]
    code: 201
    input: [component_type, unit, rate_value, "taxable?", sequence]
    output: PayComponent
    side_effects: ["PayPackage.component_count incremented", "PayPackage.version bumped"]

  - method: GET
    path: "/driver-pay/pay-packages/{id}/components"
    description: "List the components of a pay package in sequence order."
    roles: [PayrollAdmin, SettlementClerk, SettlementApprover, ComplianceAuditor, Driver]
    code: 200
    input: []
    output: PayComponent[]
    side_effects: []

  - method: POST
    path: "/driver-pay/pay-packages/{id}/activate"
    description: "Activate a DRAFT package so it can be assigned to drivers and snapshotted onto loads."
    roles: [PayrollAdmin]
    code: 200
    input: []
    output: PayPackage
    side_effects: ["status DRAFT->ACTIVE", "activated_at stamped from the logical clock", "when this package supersedes another, the superseded package moves ACTIVE->RETIRED, stamps retired_at, clears its has_pending_revision, and Drivers already pointing at it keep that pointer (only new assignments are blocked)"]

  - method: POST
    path: "/driver-pay/pay-packages/{id}/revise"
    description: "Open a DRAFT successor of an ACTIVE package under optimistic concurrency control; the successor starts with a copy of the predecessor components and must be activated separately."
    roles: [PayrollAdmin]
    code: 201
    input: [expected_pay_package_version, "name?", "mileage_guide?", "per_diem_method?", "escrow_target_cents?", "escrow_monthly_deduction_cents?"]
    output: PayPackage
    side_effects: ["a new DRAFT PayPackage is created with supersedes_pay_package_id set to the predecessor", "predecessor has_pending_revision=true", "predecessor version bumped"]

  - method: POST
    path: "/driver-pay/pay-packages/{id}/retire"
    description: "Retire an ACTIVE package that has no pending revision; retired packages accept no new driver assignments but remain readable as load snapshots."
    roles: [PayrollAdmin]
    code: 200
    input: []
    output: PayPackage
    side_effects: ["status ACTIVE->RETIRED", "retired_at stamped"]

  # --- drivers ------------------------------------------------------------
  - method: POST
    path: "/driver-pay/drivers"
    description: "Register a driver of a given driver type with a per diem election."
    roles: [PayrollAdmin]
    code: 201
    input: [legal_name, driver_type, "home_state?", "per_diem_elected?"]
    output: Driver
    side_effects: ["employment_status=ACTIVE", "escrow_status=NOT_REQUIRED", "all balances and YTD accumulators zeroed", "settlement_hold=false"]

  - method: GET
    path: "/driver-pay/drivers"
    description: "List drivers, optionally filtered by employment status, driver type, escrow status, or assigned pay package."
    roles: [PayrollAdmin, SettlementClerk, SettlementApprover, ComplianceAuditor]
    code: 200
    input: ["employment_status?", "driver_type?", "escrow_status?", "pay_package_id?"]
    output: Driver[]
    side_effects: []

  - method: GET
    path: "/driver-pay/drivers/{id}"
    description: "Read one driver including escrow balance, pending retroactive correction total, settlement hold flag and YTD wage accumulators."
    roles: [PayrollAdmin, SettlementClerk, SettlementApprover, ComplianceAuditor, Driver]
    code: 200
    input: []
    output: Driver
    side_effects: []

  - method: POST
    path: "/driver-pay/drivers/{id}/assign-pay-package"
    description: "Assign an ACTIVE pay package to an ACTIVE driver whose driver_type matches the package driver_type."
    roles: [PayrollAdmin]
    code: 200
    input: [pay_package_id]
    output: Driver
    side_effects: ["pay_package_id set", "escrow_target_cents and escrow_monthly_deduction_cents copied from the package", "when package.escrow_required is true and escrow_status is NOT_REQUIRED, escrow_status NOT_REQUIRED->COLLECTING", "version bumped"]

  - method: POST
    path: "/driver-pay/drivers/{id}/status"
    description: "Drive the driver employment axis: activate an onboarding driver, suspend or reinstate an active one, or terminate, which freezes new work and starts the escrow return clock."
    roles: [PayrollAdmin]
    code: 200
    input: [new_status, "terminated_at?"]
    output: Driver
    side_effects: ["employment_status moves ONBOARDING->ACTIVE, ACTIVE->SUSPENDED, SUSPENDED->ACTIVE, ACTIVE|SUSPENDED->TERMINATED", "on TERMINATED, terminated_at stamped from the logical clock when omitted, escrow_status COLLECTING|FUNDED->CLOSING and escrow_return_due_at = terminated_at + ESCROW_RETURN_DAYS", "version bumped"]

  - method: POST
    path: "/driver-pay/drivers/{id}/escrow/close"
    description: "Close the escrow account of a terminated driver, freezing further deductions while the statutory return clock runs."
    roles: [PayrollAdmin]
    code: 200
    input: []
    output: Driver
    side_effects: ["escrow_status COLLECTING|FUNDED->CLOSING", "no ledger row is written; the principal is untouched", "version bumped"]

  - method: POST
    path: "/driver-pay/drivers/{id}/escrow/deductions"
    description: "Record a permissible deduction against the driver escrow account under optimistic concurrency control. The request supplies a positive magnitude; the stored EscrowTransaction amount_cents is negative."
    roles: [PayrollAdmin]
    code: 201
    input: [amount_cents, reason_code, "document_ref?", expected_driver_version]
    output: EscrowTransaction
    side_effects: ["EscrowTransaction PERMISSIBLE_DEDUCTION created with amount_cents = -amount_cents and balance_after_cents recorded", "Driver.escrow_balance_cents decreased", "Driver.version bumped"]

  - method: POST
    path: "/driver-pay/drivers/{id}/escrow/return"
    description: "Return the remaining escrow principal to a terminated driver on or after the return due date."
    roles: [PayrollAdmin]
    code: 200
    input: [payment_reference]
    output: Driver
    side_effects: ["EscrowTransaction RETURN created for the negated remaining balance", "escrow_balance_cents=0", "escrow_status CLOSING->RETURNED", "escrow_returned_at stamped", "version bumped"]

  - method: GET
    path: "/driver-pay/escrow-transactions"
    description: "List escrow ledger entries, filterable by driver, by the settlement that generated them, by the transaction they reverse, or by type."
    roles: [PayrollAdmin, SettlementClerk, SettlementApprover, ComplianceAuditor, Driver]
    code: 200
    input: ["driver_id?", "settlement_id?", "reverses_transaction_id?", "txn_type?"]
    output: EscrowTransaction[]
    side_effects: []

  - method: GET
    path: "/driver-pay/escrow-transactions/{id}"
    description: "Read one escrow ledger entry including the running balance recorded at the time it was written."
    roles: [PayrollAdmin, SettlementClerk, SettlementApprover, ComplianceAuditor, Driver]
    code: 200
    input: []
    output: EscrowTransaction
    side_effects: []

  - method: POST
    path: "/driver-pay/escrow-transactions/{id}/reverse"
    description: "Write a compensating REVERSAL entry against an existing escrow entry; the original row is never mutated."
    roles: [PayrollAdmin]
    code: 201
    input: [reason_code]
    output: EscrowTransaction
    side_effects: ["EscrowTransaction REVERSAL created with the negated amount and reverses_transaction_id set", "Driver.escrow_balance_cents restored", "escrow_status may move COLLECTING<->FUNDED as the balance crosses the target", "Driver.version bumped"]

  # --- loads --------------------------------------------------------------
  - method: POST
    path: "/driver-pay/loads"
    description: "Tender a load to a driver with both mileage-guide distances and the linehaul revenue."
    roles: [PayrollAdmin, SettlementClerk]
    code: 201
    input: [driver_id, linehaul_revenue_cents, practical_miles, hhg_miles, "origin_zip?", "dest_zip?", "stop_count?", "tarp_required?"]
    output: Load
    side_effects: ["movement_status=TENDERED", "pay_status=UNPAID", "stop_count defaults to 1"]

  - method: GET
    path: "/driver-pay/loads"
    description: "List loads, filterable by driver, settlement, snapshotted pay package, movement status or pay status."
    roles: [PayrollAdmin, SettlementClerk, SettlementApprover, ComplianceAuditor, Driver]
    code: 200
    input: ["driver_id?", "settlement_id?", "pay_package_id_snapshot?", "movement_status?", "pay_status?"]
    output: Load[]
    side_effects: []

  - method: GET
    path: "/driver-pay/loads/{id}"
    description: "Read one load including the applied mileage guide, paid miles, short-haul floor flag and computed linehaul pay."
    roles: [PayrollAdmin, SettlementClerk, SettlementApprover, ComplianceAuditor, Driver]
    code: 200
    input: []
    output: Load
    side_effects: []

  - method: POST
    path: "/driver-pay/loads/{id}/dispatch"
    description: "Dispatch a tendered load, pinning the driver current ACTIVE pay package onto the load as its snapshot."
    roles: [PayrollAdmin, SettlementClerk]
    code: 200
    input: ["dispatched_at?"]
    output: Load
    side_effects: ["movement_status TENDERED->IN_TRANSIT", "pay_package_id_snapshot pinned from Driver.pay_package_id", "dispatched_at stamped from the logical clock when omitted"]

  - method: POST
    path: "/driver-pay/loads/{id}/deliver"
    description: "Deliver a load in transit, which runs paid_miles_determination and linehaul_component_pay against the snapshotted package."
    roles: [PayrollAdmin, SettlementClerk]
    code: 200
    input: ["delivered_at?", "hours_worked_minutes?", "stop_count?"]
    output: Load
    side_effects: ["movement_status IN_TRANSIT->DELIVERED", "pay_status UNPAID->ACCRUED", "applied_mileage_guide, base_guide_miles, paid_miles, short_haul_floor_applied, linehaul_pay_cents and linehaul_line_type computed", "delivered_at stamped from the logical clock when omitted"]

  # --- accessorial claims -------------------------------------------------
  - method: POST
    path: "/driver-pay/accessorial-claims"
    description: "Submit an accessorial claim against a load for detention, layover, stop-off, tarping or breakdown."
    roles: [PayrollAdmin, SettlementClerk, Driver]
    code: 201
    input: [load_id, driver_id, accessorial_type, start_at, end_at, "document_ref?"]
    output: AccessorialClaim
    side_effects: ["status=SUBMITTED", "documentation_required computed from accessorial_type", "billable_units and amount_cents remain 0 until approval"]

  - method: GET
    path: "/driver-pay/accessorial-claims"
    description: "List accessorial claims, filterable by driver, load, settlement, status or type."
    roles: [PayrollAdmin, SettlementClerk, SettlementApprover, ComplianceAuditor, Driver]
    code: 200
    input: ["driver_id?", "load_id?", "settlement_id?", "status?", "accessorial_type?"]
    output: AccessorialClaim[]
    side_effects: []

  - method: GET
    path: "/driver-pay/accessorial-claims/{id}"
    description: "Read one accessorial claim including its computed billable units and amount."
    roles: [PayrollAdmin, SettlementClerk, SettlementApprover, ComplianceAuditor, Driver]
    code: 200
    input: []
    output: AccessorialClaim
    side_effects: []

  - method: POST
    path: "/driver-pay/accessorial-claims/{id}/documents"
    description: "Attach or replace the supporting documentation reference on a claim that has not yet been settled."
    roles: [PayrollAdmin, SettlementClerk, Driver]
    code: 200
    input: [document_ref]
    output: AccessorialClaim
    side_effects: ["document_ref set", "a REJECTED claim returns to SUBMITTED so it can be re-reviewed"]

  - method: POST
    path: "/driver-pay/accessorial-claims/{id}/approve"
    description: "Approve a submitted claim, which runs accessorial_pay and makes the claim eligible for the next settlement sweep."
    roles: [PayrollAdmin, SettlementClerk]
    code: 200
    input: []
    output: AccessorialClaim
    side_effects: ["status SUBMITTED->APPROVED", "billable_units and amount_cents computed", "approved_by_user_id stamped"]

  - method: POST
    path: "/driver-pay/accessorial-claims/{id}/reject"
    description: "Reject a submitted claim with a reason code."
    roles: [PayrollAdmin, SettlementClerk]
    code: 200
    input: [reject_reason_code]
    output: AccessorialClaim
    side_effects: ["status SUBMITTED->REJECTED", "amount_cents forced to 0"]

  # --- advances -----------------------------------------------------------
  - method: POST
    path: "/driver-pay/advances"
    description: "Issue a cash advance or load a fuel card for a driver, with the per-settlement installment the office intends to recover."
    roles: [PayrollAdmin, SettlementClerk]
    code: 201
    input: [driver_id, advance_type, amount_cents, "installment_cents?"]
    output: Advance
    side_effects: ["status=ISSUED", "outstanding_cents=amount_cents", "recovered_cents=0", "installment_cents defaults to the full amount", "Driver.advance_outstanding_cents increased", "issued_at stamped"]

  - method: GET
    path: "/driver-pay/advances"
    description: "List advances, filterable by driver, status or type."
    roles: [PayrollAdmin, SettlementClerk, SettlementApprover, ComplianceAuditor, Driver]
    code: 200
    input: ["driver_id?", "status?", "advance_type?"]
    output: Advance[]
    side_effects: []

  - method: GET
    path: "/driver-pay/advances/{id}"
    description: "Read one advance including recovered and outstanding amounts."
    roles: [PayrollAdmin, SettlementClerk, SettlementApprover, ComplianceAuditor, Driver]
    code: 200
    input: []
    output: Advance
    side_effects: []

  - method: POST
    path: "/driver-pay/advances/{id}/cancel"
    description: "Cancel an ISSUED advance that has never been recovered against, releasing the driver outstanding balance."
    roles: [PayrollAdmin]
    code: 200
    input: []
    output: Advance
    side_effects: ["status ISSUED->CANCELLED", "outstanding_cents=0", "Driver.advance_outstanding_cents decreased"]

  # --- settlements --------------------------------------------------------
  - method: POST
    path: "/driver-pay/settlements"
    description: "Open a DRAFT settlement for a driver over a half-open pay period."
    roles: [PayrollAdmin, SettlementClerk]
    code: 201
    input: [driver_id, period_start, period_end]
    output: Settlement
    side_effects: ["status=DRAFT", "itemization_required computed from Driver.driver_type", "all money fields zeroed"]

  - method: GET
    path: "/driver-pay/settlements"
    description: "List settlements, filterable by driver or status."
    roles: [PayrollAdmin, SettlementClerk, SettlementApprover, ComplianceAuditor, Driver]
    code: 200
    input: ["driver_id?", "status?"]
    output: Settlement[]
    side_effects: []

  - method: GET
    path: "/driver-pay/settlements/{id}"
    description: "Read one settlement statement header with its gross, per diem, taxable, deduction and net totals."
    roles: [PayrollAdmin, SettlementClerk, SettlementApprover, ComplianceAuditor, Driver]
    code: 200
    input: []
    output: Settlement
    side_effects: []

  - method: GET
    path: "/driver-pay/settlements/{id}/lines"
    description: "List the itemized settlement lines in sequence order; for a leased operator every earning line carries its reference and quantity."
    roles: [PayrollAdmin, SettlementClerk, SettlementApprover, ComplianceAuditor, Driver]
    code: 200
    input: ["line_type?"]
    output: SettlementLine[]
    side_effects: []

  - method: POST
    path: "/driver-pay/settlements/{id}/apply-corrections"
    description: "Sweep every PENDING retroactive correction of the driver onto this DRAFT settlement as RETRO_CORRECTION lines, under optimistic concurrency control."
    roles: [PayrollAdmin, SettlementClerk]
    code: 200
    input: [expected_settlement_version]
    output: Settlement
    side_effects: ["one RETRO_CORRECTION line per swept correction", "RetroCorrection status PENDING->APPLIED with applied_settlement_id and applied_at set", "Driver.pending_retro_correction_cents reduced and settlement_hold recomputed", "retro_correction_total_cents updated", "Settlement.version bumped"]

  - method: POST
    path: "/driver-pay/settlements/{id}/prepare"
    description: "Sweep the period, generate every settlement line, and compute per diem, escrow accrual, advance recovery and net pay."
    roles: [PayrollAdmin, SettlementClerk]
    code: 200
    input: []
    output: Settlement
    side_effects: ["status DRAFT->PREPARED", "settlement lines generated in the pinned order", "swept Loads move pay_status ACCRUED->SETTLED with settlement_id set", "swept AccessorialClaims move APPROVED->PAID with settlement_id set", "every total from gross_pay_cents to net_pay_cents computed", "prepared_by_user_id and prepared_at stamped", "Settlement.version bumped"]

  - method: POST
    path: "/driver-pay/settlements/{id}/approve"
    description: "Approve a prepared settlement; the approver may not be the preparer."
    roles: [SettlementApprover, PayrollAdmin]
    code: 200
    input: []
    output: Settlement
    side_effects: ["status PREPARED->APPROVED", "approved_by_user_id and approved_at stamped", "when escrow_deduction_cents > 0 an EscrowTransaction DEPOSIT is written and Driver.escrow_balance_cents increases, which may move escrow_status COLLECTING->FUNDED", "Advance.recovered_cents and outstanding_cents advance, moving ISSUED->RECOVERING->RECOVERED", "Driver YTD accumulators increase by gross, taxable and non-taxable per diem"]

  - method: POST
    path: "/driver-pay/settlements/{id}/pay"
    description: "Record payment of an approved settlement; the payer may not be the approver."
    roles: [PayrollAdmin]
    code: 200
    input: [payment_reference]
    output: Settlement
    side_effects: ["status APPROVED->PAID", "paid_at and payment_reference stamped", "the settlement becomes terminal and is the reference instant for the pay dispute window"]

  - method: POST
    path: "/driver-pay/settlements/{id}/void"
    description: "Void a non-terminal settlement, compensating every side effect it produced."
    roles: [PayrollAdmin]
    code: 200
    input: [void_reason_code]
    output: Settlement
    side_effects: ["status DRAFT|PREPARED|APPROVED->VOIDED", "swept Loads return to pay_status ACCRUED with settlement_id cleared", "swept AccessorialClaims return to APPROVED with settlement_id cleared", "APPLIED RetroCorrections return to PENDING and Driver.pending_retro_correction_cents and settlement_hold are restored", "any escrow DEPOSIT is reversed by a compensating REVERSAL entry", "Advance recovery is unwound and Driver.advance_outstanding_cents restored", "Driver YTD accumulators are decremented so the wage classification identity holds again", "voided_at and void_reason_code stamped"]

  # --- disputes -----------------------------------------------------------
  - method: POST
    path: "/driver-pay/disputes"
    description: "File a mileage dispute against a load or a pay dispute against a paid settlement line."
    roles: [Driver, PayrollAdmin, SettlementClerk]
    code: 201
    input: [dispute_kind, driver_id, narrative, "load_id?", "settlement_id?", "claimed_guide?", "claimed_miles?", "claimed_amount_cents?", "disputed_line_type?", "evidence_doc_ref?"]
    output: Dispute
    side_effects: ["status=OPEN", "reopen_count=0", "submitted_by_user_id stamped"]

  - method: GET
    path: "/driver-pay/disputes"
    description: "List disputes, filterable by driver, load, origin settlement, resulting correction, status or kind."
    roles: [PayrollAdmin, SettlementClerk, SettlementApprover, ComplianceAuditor, Driver]
    code: 200
    input: ["driver_id?", "load_id?", "settlement_id?", "resolution_correction_id?", "status?", "dispute_kind?"]
    output: Dispute[]
    side_effects: []

  - method: GET
    path: "/driver-pay/disputes/{id}"
    description: "Read one dispute including its reopen count and the correction its resolution produced."
    roles: [PayrollAdmin, SettlementClerk, SettlementApprover, ComplianceAuditor, Driver]
    code: 200
    input: []
    output: Dispute
    side_effects: []

  - method: POST
    path: "/driver-pay/disputes/{id}/review"
    description: "Take an OPEN dispute under review."
    roles: [PayrollAdmin, SettlementClerk]
    code: 200
    input: []
    output: Dispute
    side_effects: ["status OPEN->UNDER_REVIEW", "reviewed_by_user_id stamped"]

  - method: POST
    path: "/driver-pay/disputes/{id}/resolve"
    description: "Resolve a dispute under review by upholding or denying it. Upholding a mileage dispute on an unsettled load re-grades the load in place; upholding it on a settled load, or upholding a pay dispute, creates a PENDING retroactive correction instead."
    roles: [SettlementApprover, PayrollAdmin]
    code: 200
    input: [outcome, "resolution_note?", "adjustment_cents?"]
    output: Dispute
    side_effects: ["status UNDER_REVIEW->UPHELD|DENIED", "resolved_by_user_id stamped", "on an upheld mileage dispute over an ACCRUED load the load re-runs paid_miles_determination and linehaul_component_pay in place and pay_status stays ACCRUED", "on an upheld dispute over a SETTLED load or an upheld pay dispute a RetroCorrection is created PENDING, the load pay_status moves SETTLED->ADJUSTED, Driver.pending_retro_correction_cents accumulates and settlement_hold is recomputed", "resolution_correction_id set when a correction was created"]

  - method: POST
    path: "/driver-pay/disputes/{id}/reopen"
    description: "Reopen a denied dispute with new narrative, up to the reopen limit."
    roles: [Driver, PayrollAdmin]
    code: 200
    input: [narrative, "evidence_doc_ref?"]
    output: Dispute
    side_effects: ["status DENIED->OPEN", "reopen_count incremented", "reviewed_by_user_id and resolved_by_user_id cleared"]

  - method: POST
    path: "/driver-pay/disputes/{id}/withdraw"
    description: "Withdraw an open or under-review dispute."
    roles: [Driver, PayrollAdmin]
    code: 200
    input: []
    output: Dispute
    side_effects: ["status OPEN|UNDER_REVIEW->WITHDRAWN"]

  # --- retroactive corrections -------------------------------------------
  - method: GET
    path: "/driver-pay/retro-corrections"
    description: "List retroactive corrections, filterable by driver, origin settlement, applying settlement, source load, source dispute or status."
    roles: [PayrollAdmin, SettlementClerk, SettlementApprover, ComplianceAuditor, Driver]
    code: 200
    input: ["driver_id?", "origin_settlement_id?", "applied_settlement_id?", "source_load_id?", "source_dispute_id?", "status?"]
    output: RetroCorrection[]
    side_effects: []

  - method: GET
    path: "/driver-pay/retro-corrections/{id}"
    description: "Read one retroactive correction including its signed gross and taxable deltas."
    roles: [PayrollAdmin, SettlementClerk, SettlementApprover, ComplianceAuditor, Driver]
    code: 200
    input: []
    output: RetroCorrection
    side_effects: []

  - method: POST
    path: "/driver-pay/retro-corrections/{id}/cancel"
    description: "Cancel a PENDING correction that will never be paid, releasing the driver settlement hold."
    roles: [PayrollAdmin]
    code: 200
    input: []
    output: RetroCorrection
    side_effects: ["status PENDING->CANCELLED", "cancelled_at and cancelled_by_user_id stamped", "Driver.pending_retro_correction_cents reduced and settlement_hold recomputed", "when the source load was ADJUSTED it returns to SETTLED"]

# ---------------------------------------------------------------------------
# 1.6 Error Code Catalog
# ---------------------------------------------------------------------------
errors:
  # --- authentication and authorization -----------------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-ID or X-User-Role header absent, or X-User-Role is not one of the five declared roles"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "the acting role is not listed in the roles of the addressed endpoint"
  - id: ERR_DRIVER_SCOPE_VIOLATION
    http: 403
    condition: "a Driver acts on a resource whose driver_id is not the acting X-User-ID"

  # --- request shape ------------------------------------------------------
  - id: ERR_MISSING_REQUIRED_FIELD
    http: 422
    condition: "a required input field is absent or null"
  - id: ERR_INVALID_FIELD_VALUE
    http: 422
    condition: "an enum value is undeclared, an integer field is non-integral, a magnitude field is negative, or a timestamp is not ISO-8601 UTC"

  # --- existence ----------------------------------------------------------
  - id: ERR_DRIVER_NOT_FOUND
    http: 404
    condition: "the referenced Driver id does not exist"
  - id: ERR_PAY_PACKAGE_NOT_FOUND
    http: 404
    condition: "the referenced PayPackage id does not exist"
  - id: ERR_LOAD_NOT_FOUND
    http: 404
    condition: "the referenced Load id does not exist"
  - id: ERR_ACCESSORIAL_CLAIM_NOT_FOUND
    http: 404
    condition: "the referenced AccessorialClaim id does not exist"
  - id: ERR_ADVANCE_NOT_FOUND
    http: 404
    condition: "the referenced Advance id does not exist"
  - id: ERR_SETTLEMENT_NOT_FOUND
    http: 404
    condition: "the referenced Settlement id does not exist"
  - id: ERR_DISPUTE_NOT_FOUND
    http: 404
    condition: "the referenced Dispute id does not exist"
  - id: ERR_RETRO_CORRECTION_NOT_FOUND
    http: 404
    condition: "the referenced RetroCorrection id does not exist"
  - id: ERR_ESCROW_TRANSACTION_NOT_FOUND
    http: 404
    condition: "the referenced EscrowTransaction id does not exist"

  # --- optimistic concurrency --------------------------------------------
  - id: ERR_STALE_PAY_PACKAGE_VERSION
    http: 412
    condition: "expected_pay_package_version does not equal the current PayPackage.version on revise"
  - id: ERR_STALE_SETTLEMENT_VERSION
    http: 412
    condition: "expected_settlement_version does not equal the current Settlement.version on apply-corrections"
  - id: ERR_STALE_DRIVER_VERSION
    http: 412
    condition: "expected_driver_version does not equal the current Driver.version on an escrow deduction"

  # --- state preconditions -----------------------------------------------
  - id: ERR_PAY_PACKAGE_NOT_ACTIVE
    http: 409
    condition: "the PayPackage is not in the status the operation needs: DRAFT for component addition and activate, ACTIVE for revise, retire and driver assignment"
  - id: ERR_PAY_PACKAGE_REVISION_PENDING
    http: 409
    condition: "the PayPackage already has a DRAFT successor open, so it cannot be revised again or retired"
  - id: ERR_DRIVER_NOT_ACTIVE
    http: 409
    condition: "the Driver employment_status is TERMINATED and the operation creates new work or new deductions"
  - id: ERR_ESCROW_NOT_ACTIVE
    http: 409
    condition: "the escrow account is not in a status that admits the operation: a deduction or reversal needs COLLECTING or FUNDED, a return needs CLOSING, and a RETURNED account admits neither"
  - id: ERR_LOAD_NOT_DELIVERED
    http: 409
    condition: "the Load movement_status is not the one the operation needs: TENDERED for dispatch, IN_TRANSIT for deliver, DELIVERED for accessorial approval or a mileage dispute"
  - id: ERR_CLAIM_NOT_SUBMITTED
    http: 409
    condition: "the AccessorialClaim is not SUBMITTED for approve or reject, or is neither SUBMITTED nor REJECTED for a document attachment"
  - id: ERR_SETTLEMENT_STATE_INVALID
    http: 409
    condition: "the Settlement status does not admit the requested transition: DRAFT for apply-corrections and prepare, PREPARED for approve, APPROVED for pay"
  - id: ERR_SETTLEMENT_TERMINAL
    http: 409
    condition: "the Settlement is already PAID or VOIDED and accepts no further transition, including void"
  - id: ERR_DISPUTE_STATE_INVALID
    http: 409
    condition: "the Dispute status does not admit the requested transition: OPEN for review, UNDER_REVIEW for resolve, DENIED for reopen, OPEN or UNDER_REVIEW for withdraw"
  - id: ERR_ADVANCE_NOT_CANCELLABLE
    http: 409
    condition: "the Advance is not ISSUED, so recovery has begun or finished and it can no longer be cancelled"
  - id: ERR_CORRECTION_NOT_PENDING
    http: 409
    condition: "the RetroCorrection is APPLIED or CANCELLED and is therefore immutable"

  # --- wage and compliance safety ----------------------------------------
  - id: ERR_DOCUMENTATION_MISSING
    http: 422
    condition: "approval is requested for a DETENTION, TARPING or BREAKDOWN claim that carries no document_ref"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 409
    condition: "the approving user is the preparer of the settlement, or the paying user is its approver"
  - id: ERR_DEDUCTION_NOT_PERMISSIBLE
    http: 422
    condition: "the escrow deduction reason_code is outside the permissible-deduction list"
  - id: ERR_ESCROW_RETURN_NOT_DUE
    http: 409
    condition: "an escrow return is attempted before the logical clock reaches Driver.escrow_return_due_at"
  - id: ERR_ITEMIZATION_INCOMPLETE
    http: 422
    condition: "a settlement whose itemization_required is true would generate an earning line without a reference_id or without a quantity, or an ACCESSORIAL line whose source claim carries no document_ref"

  # --- constraint and temporal -------------------------------------------
  - id: ERR_SETTLEMENT_HOLD_ACTIVE
    http: 409
    condition: "prepare is attempted for a driver whose settlement_hold is true because an unabsorbed retroactive correction exceeds the hold threshold"
  - id: ERR_DUPLICATE_COMPONENT
    http: 409
    condition: "the component sequence is already used in the package, or the package already holds a component of that component_type"
  - id: ERR_COMPONENT_TYPE_NOT_ALLOWED
    http: 422
    condition: "an HOURLY component is added to an owner-operator or leased-operator package, or a REVENUE_PERCENT component is added to a company-driver package"
  - id: ERR_PACKAGE_HAS_NO_LINEHAUL_COMPONENT
    http: 422
    condition: "activation is attempted on a package holding neither a PER_MILE nor a REVENUE_PERCENT component"
  - id: ERR_INTERVAL_INVALID
    http: 422
    condition: "end_at is not strictly after start_at, or period_end is not strictly after period_start"
  - id: ERR_ACCESSORIAL_OVERLAP
    http: 409
    condition: "the claim interval overlaps another non-rejected claim interval on the same load once the stored interval is extended by the buffer minutes"
  - id: ERR_LAYOVER_OVERLAP
    http: 409
    condition: "a layover claim shares a UTC calendar date with another non-rejected layover claim of the same driver"
  - id: ERR_SETTLEMENT_PERIOD_OVERLAP
    http: 409
    condition: "the requested pay period overlaps the period of another non-void settlement of the same driver"
  - id: ERR_DISPUTE_WINDOW_CLOSED
    http: 422
    condition: "the dispute is filed more than DISPUTE_WINDOW_DAYS after the reference instant, which is the load delivery for an unsettled mileage dispute and the settlement payment otherwise"
  - id: ERR_DISPUTE_ALREADY_OPEN
    http: 409
    condition: "another dispute of the same kind on the same load or origin settlement is already OPEN or UNDER_REVIEW"
  - id: ERR_DISPUTE_REOPEN_LIMIT
    http: 409
    condition: "a denied dispute has already been reopened DISPUTE_REOPEN_LIMIT times"
  - id: ERR_MILEAGE_CLAIM_UNCHANGED
    http: 422
    condition: "a mileage dispute claims exactly the guide and mileage the load was already paid on"
  - id: ERR_ZERO_VALUE_ACCESSORIAL
    http: 422
    condition: "the computed accessorial amount is exactly zero, for example a detention interval that lands on the free allowance or a layover confined to a single calendar day"
  - id: ERR_NO_SETTLEABLE_ACTIVITY
    http: 422
    condition: "the prepare sweep finds no eligible load, no eligible approved claim and no applied retroactive correction line"

  # --- referential consistency -------------------------------------------
  - id: ERR_LOAD_ALREADY_SETTLED
    http: 409
    condition: "the referenced load is already attached to a settlement, that is pay_status is SETTLED or ADJUSTED or settlement_id is non-null"
  - id: ERR_CLAIM_ALREADY_SETTLED
    http: 409
    condition: "the referenced accessorial claim is already attached to a settlement, that is status is PAID or settlement_id is non-null"
  - id: ERR_DRIVER_MISMATCH
    http: 422
    condition: "the driver_id on the request differs from the driver of the referenced load, settlement or correction"
  - id: ERR_NO_PENDING_CORRECTIONS
    http: 409
    condition: "apply-corrections is called for a driver holding no PENDING retroactive correction"
  - id: ERR_DRIVER_HAS_NO_PAY_PACKAGE
    http: 409
    condition: "linehaul or settlement computation is requested for a driver with no assigned pay package, or for a load whose snapshot is missing"

  # --- fiscal -------------------------------------------------------------
  - id: ERR_ESCROW_INSUFFICIENT_BALANCE
    http: 422
    condition: "the requested permissible deduction magnitude exceeds the current escrow balance"
  - id: ERR_ADVANCE_LIMIT_EXCEEDED
    http: 422
    condition: "the new advance principal plus the driver outstanding advance balance exceeds ADVANCE_OUTSTANDING_LIMIT_CENTS"
  - id: ERR_NEGATIVE_NET_PAY
    http: 422
    condition: "the prepared settlement would compute a net_pay_cents below zero, typically when a retroactive down-grade exceeds the period earnings"

# ---------------------------------------------------------------------------
# 1.7 RBAC Matrix (segregation of duties)
# ---------------------------------------------------------------------------
roles:
  - name: PayrollAdmin
    description: "Settlement-office administrator who owns pay package configuration, driver records, escrow, advances and the payment run. The break-glass role: it may perform any clerk or approver operation, subject to the same segregation-of-duties rule that forbids approving what it prepared and paying what it approved."
    identity: "opaque"
    exclusive_operations:
      - "POST /driver-pay/pay-packages"
      - "POST /driver-pay/pay-packages/{id}/components"
      - "POST /driver-pay/pay-packages/{id}/activate"
      - "POST /driver-pay/pay-packages/{id}/revise"
      - "POST /driver-pay/pay-packages/{id}/retire"
      - "POST /driver-pay/drivers"
      - "POST /driver-pay/drivers/{id}/assign-pay-package"
      - "POST /driver-pay/drivers/{id}/status"
      - "POST /driver-pay/drivers/{id}/escrow/close"
      - "POST /driver-pay/drivers/{id}/escrow/deductions"
      - "POST /driver-pay/drivers/{id}/escrow/return"
      - "POST /driver-pay/escrow-transactions/{id}/reverse"
      - "POST /driver-pay/advances/{id}/cancel"
      - "POST /driver-pay/settlements/{id}/pay"
      - "POST /driver-pay/settlements/{id}/void"
      - "POST /driver-pay/retro-corrections/{id}/cancel"
    shared_operations:
      - "POST /driver-pay/loads and the dispatch and deliver transitions (shared with SettlementClerk)"
      - "POST /driver-pay/advances (shared with SettlementClerk)"
      - "accessorial claim submission, documentation, approve and reject (shared with SettlementClerk)"
      - "settlement creation, apply-corrections and prepare (shared with SettlementClerk)"
      - "POST /driver-pay/settlements/{id}/approve (shared with SettlementApprover)"
      - "dispute filing, review, resolve, reopen and withdraw (shared with SettlementClerk, SettlementApprover and Driver as listed per endpoint)"
      - "every GET in the domain (shared with all roles, with Driver restricted to its own rows)"

  - name: SettlementClerk
    description: "Pay-office clerk who books loads, adjudicates accessorial documentation, opens and prepares settlements, and takes disputes under review. May never approve or pay a settlement."
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "POST /driver-pay/loads, /dispatch, /deliver (shared with PayrollAdmin)"
      - "POST /driver-pay/accessorial-claims, /documents, /approve, /reject (shared with PayrollAdmin, submission and documentation also with Driver)"
      - "POST /driver-pay/advances (shared with PayrollAdmin)"
      - "POST /driver-pay/settlements, /apply-corrections, /prepare (shared with PayrollAdmin)"
      - "POST /driver-pay/disputes and /review (shared with PayrollAdmin, filing also with Driver)"
      - "every GET in the domain"

  - name: SettlementApprover
    description: "Reviewer who approves prepared settlements and rules on disputes. Cannot prepare the settlement it approves, cannot pay, and cannot create the underlying loads or claims, so the prepare-approve-pay chain always spans at least two identities."
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "POST /driver-pay/settlements/{id}/approve (shared with PayrollAdmin)"
      - "POST /driver-pay/disputes/{id}/resolve (shared with PayrollAdmin)"
      - "every GET in the domain"

  - name: Driver
    description: "The driver or leased operator. Reads only its own records and may submit accessorial claims with documentation, file pay and mileage disputes, reopen a denied dispute and withdraw its own dispute."
    identity: "entity_backed:Driver"
    exclusive_operations: []
    shared_operations:
      - "POST /driver-pay/accessorial-claims and /documents (shared with PayrollAdmin and SettlementClerk)"
      - "POST /driver-pay/disputes, /reopen, /withdraw (shared with PayrollAdmin)"
      - "GET on its own drivers, loads, accessorial-claims, advances, settlements, settlement lines, escrow-transactions, disputes and retro-corrections rows"

  - name: ComplianceAuditor
    description: "Read-only auditor of pay compliance: reads packages, settlement statements, escrow ledgers and dispute histories across all drivers, and writes nothing anywhere in the domain."
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "every GET in the domain across all drivers"

# ---------------------------------------------------------------------------
# Domain constants referenced by 1.3 calculations and 1.4 validations
# ---------------------------------------------------------------------------
domain_constants:
  MIN_PAID_MILES: 250                      # short-haul floor, applied when base_guide_miles < 250
  MILEAGE_BAND_BREAK: 500                  # miles above this earn the bumped marginal rate
  LONG_HAUL_BUMP_CENTS: 3                  # cents per mile added above the band break
  TEAM_SHARE_BPS: 5000                     # COMPANY_TEAM driver share of the winning linehaul leg
  DETENTION_FREE_MINUTES: 120
  DETENTION_INCREMENT_CENTS: 500           # per completed 15-minute increment
  DETENTION_CAP_CENTS: 20000
  DETENTION_BUFFER_MINUTES: 15             # stored accessorial intervals extend by this before the overlap test
  LAYOVER_DAILY_CENTS: 12500
  LAYOVER_MAX_PAYABLE_DAYS: 3
  STOP_OFF_CENTS: 5000                     # per stop beyond the first
  TARPING_FLAT_CENTS: 7500
  BREAKDOWN_DAILY_CENTS: 10000             # first 24 hours unpaid
  PER_DIEM_DAILY_CENTS: 6900
  PER_DIEM_PCT_BPS: 2800
  PER_DIEM_MAX_PCT_OF_GROSS_BPS: 4000
  ESCROW_ACCRUAL_BPS: 800                  # per earning line, rounded per line then summed
  ESCROW_RETURN_DAYS: 45                   # days after termination before escrow may be returned
  ADVANCE_RECOVERY_CAP_BPS: 2500           # cap on recovery as a share of provisional net pay
  ADVANCE_OUTSTANDING_LIMIT_CENTS: 150000
  RETRO_HOLD_THRESHOLD: 50000              # abs(pending_retro_correction_cents) above this sets settlement_hold
  DISPUTE_WINDOW_DAYS: 30
  DISPUTE_REOPEN_LIMIT: 2
  PERMISSIBLE_DEDUCTION_REASONS: [ESCROW_FUNDING, TRACTOR_LEASE, INSURANCE_PREMIUM, PERMIT_FEE, CARGO_CLAIM_DAMAGE, FUEL_TAX_TRUEUP]
