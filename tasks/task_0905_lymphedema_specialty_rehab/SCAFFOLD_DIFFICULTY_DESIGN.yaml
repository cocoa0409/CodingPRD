# =============================================================================
# Task 0905 — Lymphedema & Specialty Rehab Clinic
# SCAFFOLD_DIFFICULTY_DESIGN.yaml — §1.8 Test Targeting Index
# 9 rule_ids x 2 instances = 18 instances
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: dual_variant_visit_ledger_reserved_vs_used
        grounds:
          - calculations.visit_ledger
          - state_machines.Session.CHECKED_IN_to_COMPLETED
          - entities.Authorization.fields.visits_reserved
          - entities.Authorization.fields.visits_used
        distinguishing_aspect: "The same Session is counted by the provisional variant (visits_reserved) at scheduling and by the finalized variant (visits_used) after completion — a billing/quota-domain dual variant on Authorization, distinct from the clinical-outcome dual variant."
        test_recipe:
          setup:
            - "Patient with a FINALIZED LEFT_ARM evaluation, an APPROVED authorization (visit_cap 5, window 2026-05-01..2026-12-31), an ACTIVE plan, a therapist, and one SCHEDULED session (visits_reserved=1, visits_used=0)."
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "Jane Doe", mrn: "MRN-1" }
              as: ClinicAdmin
              captures: { pat_id: $.data.id, pat_v: $.data.version }
            - call: "POST /evaluations"
              payload: { patient_id: "${pat_id}", body_region: "LEFT_ARM", etiology: "SECONDARY", isl_stage: "STAGE_II", interval_cm: 4, circumferences_cm: [18,18,20,22,24], contralateral_circumferences_cm: [16,16,17,18,19], expected_patient_version: "${pat_v}" }
              as: Clinician
              captures: { eval_id: $.data.id }
            - call: "POST /evaluations/${eval_id}/finalize"
              payload: {}
              as: Clinician
            - call: "POST /authorizations"
              payload: { patient_id: "${pat_id}", body_region: "LEFT_ARM", payer_name: "Acme Health", auth_number: "AUTH-1", visit_cap: 5, effective_start_date: "2026-05-01", effective_end_date: "2026-12-31" }
              as: Authorizer
              captures: { auth_id: $.data.id }
            - call: "POST /authorizations/${auth_id}/submit"
              payload: {}
              as: Authorizer
            - call: "POST /authorizations/${auth_id}/approve"
              payload: {}
              as: Authorizer
            - call: "POST /treatment-plans"
              payload: { patient_id: "${pat_id}", evaluation_id: "${eval_id}", authorization_id: "${auth_id}", prescribed_daily_minutes: 60 }
              as: Clinician
              captures: { plan_id: $.data.id }
            - call: "POST /treatment-plans/${plan_id}/activate"
              payload: {}
              as: Clinician
            - call: "POST /therapists"
              payload: { full_name: "T One", credential: "CLT" }
              as: ClinicAdmin
              captures: { ther_id: $.data.id }
            - call: "POST /sessions"
              payload: { plan_id: "${plan_id}", authorization_id: "${auth_id}", therapist_id: "${ther_id}", scheduled_start: "2026-06-01T09:00:00Z", scheduled_end: "2026-06-01T10:00:00Z", cdt_component: "MLD" }
              as: Clinician
              captures: { sess_id: $.data.id }
          trigger:
            - call: "POST /sessions/${sess_id}/check-in"
              payload: {}
              as: Clinician
            - call: "POST /sessions/${sess_id}/complete"
              payload: {}
              as: Clinician
          assert:
            - "Before completion: Authorization.${auth_id}.visits_reserved == 1 and visits_used == 0 and visits_remaining == 4"
            - "After completion: Authorization.${auth_id}.visits_reserved == 0 and visits_used == 1 and visits_remaining == 4"
            - "Session.${sess_id}.clinical_status == COMPLETED and billing_status == BILLED"

      - name: dual_variant_outcome_reduction_vs_perv
        grounds:
          - calculations.outcome_metrics
          - state_machines.Reassessment.DRAFT_to_FINALIZED
          - entities.Reassessment.fields.volume_reduction_pct
          - entities.Reassessment.fields.perv_pct
        distinguishing_aspect: "Identical baseline/current evaluations yield volume_reduction_pct == 20.4 (denominator = baseline volume) but perv_pct == 70.6 (denominator = baseline EXCESS over contralateral) — a clinical-outcome dual variant on Reassessment, a different entity domain than the visit ledger."
        test_recipe:
          setup:
            - "Patient with baseline FINALIZED LEFT_ARM evaluation (limb 527.1 ml, excess 152.4 ml) later SUPERSEDED, and a current FINALIZED LEFT_ARM evaluation (limb 419.5 ml, excess 44.8 ml); a plan; a DRAFT reassessment linking both."
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "Jane Doe", mrn: "MRN-1" }
              as: ClinicAdmin
              captures: { pat_id: $.data.id, pat_v: $.data.version }
            - call: "POST /evaluations"
              payload: { patient_id: "${pat_id}", body_region: "LEFT_ARM", etiology: "SECONDARY", isl_stage: "STAGE_II", interval_cm: 4, circumferences_cm: [18,18,20,22,24], contralateral_circumferences_cm: [16,16,17,18,19], expected_patient_version: "${pat_v}" }
              as: Clinician
              captures: { base_eval_id: $.data.id }
            - call: "POST /evaluations/${base_eval_id}/finalize"
              payload: {}
              as: Clinician
            - call: "GET /patients/${pat_id}"
              payload: {}
              as: Clinician
              captures: { pat_v2: $.data.version }
            - call: "POST /evaluations"
              payload: { patient_id: "${pat_id}", body_region: "LEFT_ARM", etiology: "SECONDARY", isl_stage: "STAGE_II", interval_cm: 4, circumferences_cm: [17,17,18,19,20], contralateral_circumferences_cm: [16,16,17,18,19], expected_patient_version: "${pat_v2}" }
              as: Clinician
              captures: { cur_eval_id: $.data.id }
            - call: "POST /evaluations/${cur_eval_id}/finalize"
              payload: {}
              as: Clinician
            - call: "POST /authorizations"
              payload: { patient_id: "${pat_id}", body_region: "LEFT_ARM", payer_name: "Acme Health", auth_number: "AUTH-1", visit_cap: 5, effective_start_date: "2026-05-01", effective_end_date: "2026-12-31" }
              as: Authorizer
              captures: { auth_id: $.data.id }
            - call: "POST /treatment-plans"
              payload: { patient_id: "${pat_id}", evaluation_id: "${cur_eval_id}", authorization_id: "${auth_id}", prescribed_daily_minutes: 60 }
              as: Clinician
              captures: { plan_id: $.data.id }
            - call: "POST /reassessments"
              payload: { plan_id: "${plan_id}", baseline_evaluation_id: "${base_eval_id}", current_evaluation_id: "${cur_eval_id}" }
              as: Clinician
              captures: { reass_id: $.data.id }
          trigger:
            - call: "POST /reassessments/${reass_id}/finalize"
              payload: {}
              as: Clinician
          assert:
            - "Reassessment.${reass_id}.volume_reduction_pct == 20.4"
            - "Reassessment.${reass_id}.perv_pct == 70.6"
            - "Reassessment.${reass_id}.outcome_category == EXCELLENT"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: combinatorial_limb_volume_rounding_order
        grounds:
          - calculations.limb_volume_ml
          - entities.Evaluation.fields.limb_volume_ml
        distinguishing_aspect: "Mode (b) nested rounding: circumferences [18,18,20] with interval 4 give per-segment-rounded sum 218.2 ml, whereas sum-raw-then-round gives 218.1 ml; the scaffold pins per-segment-then-sum, so limb_volume_ml == 218.2."
        test_recipe:
          setup:
            - "A patient; no other state needed."
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "Rae Volume", mrn: "MRN-1" }
              as: ClinicAdmin
              captures: { pat_id: $.data.id, pat_v: $.data.version }
          trigger:
            - call: "POST /evaluations"
              payload: { patient_id: "${pat_id}", body_region: "LEFT_ARM", etiology: "PRIMARY", isl_stage: "STAGE_I", interval_cm: 4, circumferences_cm: [18,18,20], contralateral_circumferences_cm: [18,18,20], expected_patient_version: "${pat_v}" }
              as: Clinician
              captures: { eval_id: $.data.id }
          assert:
            - "Evaluation.${eval_id}.limb_volume_ml == 218.2"
            - "Evaluation.${eval_id}.excess_volume_ml == 0.0"

      - name: combinatorial_garment_class_lcode
        grounds:
          - calculations.garment_classification
          - entities.GarmentOrder.fields.compression_class
          - entities.GarmentOrder.fields.l_code
        distinguishing_aspect: "Mode (a) non-linear formula over 3 inputs (isl_stage STAGE_II -> base 2, excess 152.4 >= 150 arm-bump -> 3, region LEFT_ARM -> SLEEVE, class!=4 and excess<400 -> standard) yields compression_class CLASS_3 and l_code L8100 — a different combinatorial mode than the rounding-order formula."
        test_recipe:
          setup:
            - "Patient with a FINALIZED LEFT_ARM STAGE_II evaluation whose excess_volume_ml == 152.4."
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "Gar Ment", mrn: "MRN-1" }
              as: ClinicAdmin
              captures: { pat_id: $.data.id, pat_v: $.data.version }
            - call: "POST /evaluations"
              payload: { patient_id: "${pat_id}", body_region: "LEFT_ARM", etiology: "SECONDARY", isl_stage: "STAGE_II", interval_cm: 4, circumferences_cm: [18,18,20,22,24], contralateral_circumferences_cm: [16,16,17,18,19], expected_patient_version: "${pat_v}" }
              as: Clinician
              captures: { eval_id: $.data.id }
            - call: "POST /evaluations/${eval_id}/finalize"
              payload: {}
              as: Clinician
            - call: "GET /patients/${pat_id}"
              payload: {}
              as: Clinician
              captures: { pat_v2: $.data.version }
          trigger:
            - call: "POST /garment-orders"
              payload: { patient_id: "${pat_id}", evaluation_id: "${eval_id}", quantity: 1, expected_patient_version: "${pat_v2}" }
              as: Clinician
              captures: { go_id: $.data.id }
          assert:
            - "GarmentOrder.${go_id}.compression_class == CLASS_3"
            - "GarmentOrder.${go_id}.l_code == L8100"
            - "GarmentOrder.${go_id}.garment_type == SLEEVE"
            - "GarmentOrder.${go_id}.custom_fabrication == false"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: nonlinear_authorization_resubmit_cycle
        grounds:
          - state_machines.Authorization.DENIED_to_SUBMITTED
          - state_machines.Authorization.SUBMITTED_to_APPROVED
        distinguishing_aspect: "Authorization loops DRAFT->SUBMITTED->DENIED->SUBMITTED->APPROVED — a genuine cycle (DENIED back to SUBMITTED), not a linear pipeline."
        test_recipe:
          setup:
            - "Patient with a DENIED authorization."
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "Cy Cle", mrn: "MRN-1" }
              as: ClinicAdmin
              captures: { pat_id: $.data.id }
            - call: "POST /authorizations"
              payload: { patient_id: "${pat_id}", body_region: "LEFT_ARM", payer_name: "Acme Health", auth_number: "AUTH-1", visit_cap: 5, effective_start_date: "2026-05-01", effective_end_date: "2026-12-31" }
              as: Authorizer
              captures: { auth_id: $.data.id }
            - call: "POST /authorizations/${auth_id}/submit"
              payload: {}
              as: Authorizer
            - call: "POST /authorizations/${auth_id}/deny"
              payload: {}
              as: Authorizer
          trigger:
            - call: "POST /authorizations/${auth_id}/submit"
              payload: {}
              as: Authorizer
            - call: "POST /authorizations/${auth_id}/approve"
              payload: {}
              as: Authorizer
          assert:
            - "After the resubmit-then-approve, Authorization.${auth_id}.status == APPROVED (reached only by traversing the DENIED->SUBMITTED cycle edge)"

      - name: nonlinear_session_parallel_dimensions
        grounds:
          - entities.Session.fields.clinical_status
          - entities.Session.fields.billing_status
          - state_machines.Session.CHECKED_IN_to_COMPLETED
        distinguishing_aspect: "Session carries two independent status dimensions (clinical_status and billing_status) that advance on the same row — a parallel-dimension machine on a different entity than Authorization."
        test_recipe:
          setup:
            - "Patient with FINALIZED eval, APPROVED auth (cap 5), ACTIVE plan, therapist, one SCHEDULED session."
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "Par Allel", mrn: "MRN-1" }
              as: ClinicAdmin
              captures: { pat_id: $.data.id, pat_v: $.data.version }
            - call: "POST /evaluations"
              payload: { patient_id: "${pat_id}", body_region: "LEFT_ARM", etiology: "SECONDARY", isl_stage: "STAGE_II", interval_cm: 4, circumferences_cm: [18,18,20,22,24], contralateral_circumferences_cm: [16,16,17,18,19], expected_patient_version: "${pat_v}" }
              as: Clinician
              captures: { eval_id: $.data.id }
            - call: "POST /evaluations/${eval_id}/finalize"
              payload: {}
              as: Clinician
            - call: "POST /authorizations"
              payload: { patient_id: "${pat_id}", body_region: "LEFT_ARM", payer_name: "Acme Health", auth_number: "AUTH-1", visit_cap: 5, effective_start_date: "2026-05-01", effective_end_date: "2026-12-31" }
              as: Authorizer
              captures: { auth_id: $.data.id }
            - call: "POST /authorizations/${auth_id}/submit"
              payload: {}
              as: Authorizer
            - call: "POST /authorizations/${auth_id}/approve"
              payload: {}
              as: Authorizer
            - call: "POST /treatment-plans"
              payload: { patient_id: "${pat_id}", evaluation_id: "${eval_id}", authorization_id: "${auth_id}", prescribed_daily_minutes: 60 }
              as: Clinician
              captures: { plan_id: $.data.id }
            - call: "POST /treatment-plans/${plan_id}/activate"
              payload: {}
              as: Clinician
            - call: "POST /therapists"
              payload: { full_name: "T One", credential: "CLT" }
              as: ClinicAdmin
              captures: { ther_id: $.data.id }
            - call: "POST /sessions"
              payload: { plan_id: "${plan_id}", authorization_id: "${auth_id}", therapist_id: "${ther_id}", scheduled_start: "2026-06-01T09:00:00Z", scheduled_end: "2026-06-01T10:00:00Z", cdt_component: "MLD" }
              as: Clinician
              captures: { sess_id: $.data.id }
          trigger:
            - call: "POST /sessions/${sess_id}/check-in"
              payload: {}
              as: Clinician
            - call: "POST /sessions/${sess_id}/complete"
              payload: {}
              as: Clinician
          assert:
            - "At creation: Session.${sess_id}.clinical_status == SCHEDULED and billing_status == RESERVED"
            - "After check-in: clinical_status == CHECKED_IN and billing_status == RESERVED (billing dimension unchanged)"
            - "After complete: clinical_status == COMPLETED and billing_status == BILLED (both dimensions advanced independently)"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: cascade_session_complete_exhaust_hold
        grounds:
          - state_machines.Session.CHECKED_IN_to_COMPLETED
          - state_machines.Authorization.APPROVED_to_EXHAUSTED
          - state_machines.TreatmentPlan.ACTIVE_to_ON_HOLD
        distinguishing_aspect: "Depth-3 chain from session completion: Session.complete -> Authorization.visits_used hits cap so APPROVED->EXHAUSTED -> every ACTIVE plan on that auth -> ON_HOLD; each hop is caused by the previous, not by the original trigger."
        test_recipe:
          setup:
            - "Patient with FINALIZED eval, APPROVED auth with visit_cap 1, ACTIVE plan, therapist, one SCHEDULED session (visits_reserved=1)."
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "Cas Cade", mrn: "MRN-1" }
              as: ClinicAdmin
              captures: { pat_id: $.data.id, pat_v: $.data.version }
            - call: "POST /evaluations"
              payload: { patient_id: "${pat_id}", body_region: "LEFT_ARM", etiology: "SECONDARY", isl_stage: "STAGE_II", interval_cm: 4, circumferences_cm: [18,18,20,22,24], contralateral_circumferences_cm: [16,16,17,18,19], expected_patient_version: "${pat_v}" }
              as: Clinician
              captures: { eval_id: $.data.id }
            - call: "POST /evaluations/${eval_id}/finalize"
              payload: {}
              as: Clinician
            - call: "POST /authorizations"
              payload: { patient_id: "${pat_id}", body_region: "LEFT_ARM", payer_name: "Acme Health", auth_number: "AUTH-1", visit_cap: 1, effective_start_date: "2026-05-01", effective_end_date: "2026-12-31" }
              as: Authorizer
              captures: { auth_id: $.data.id }
            - call: "POST /authorizations/${auth_id}/submit"
              payload: {}
              as: Authorizer
            - call: "POST /authorizations/${auth_id}/approve"
              payload: {}
              as: Authorizer
            - call: "POST /treatment-plans"
              payload: { patient_id: "${pat_id}", evaluation_id: "${eval_id}", authorization_id: "${auth_id}", prescribed_daily_minutes: 60 }
              as: Clinician
              captures: { plan_id: $.data.id }
            - call: "POST /treatment-plans/${plan_id}/activate"
              payload: {}
              as: Clinician
            - call: "POST /therapists"
              payload: { full_name: "T One", credential: "CLT" }
              as: ClinicAdmin
              captures: { ther_id: $.data.id }
            - call: "POST /sessions"
              payload: { plan_id: "${plan_id}", authorization_id: "${auth_id}", therapist_id: "${ther_id}", scheduled_start: "2026-06-01T09:00:00Z", scheduled_end: "2026-06-01T10:00:00Z", cdt_component: "MLD" }
              as: Clinician
              captures: { sess_id: $.data.id }
            - call: "POST /sessions/${sess_id}/check-in"
              payload: {}
              as: Clinician
          trigger:
            - call: "POST /sessions/${sess_id}/complete"
              payload: {}
              as: Clinician
          assert:
            - "Session.${sess_id}.clinical_status == COMPLETED"
            - "Authorization.${auth_id}.visits_used == 1 and visits_remaining == 0 and status == EXHAUSTED"
            - "TreatmentPlan.${plan_id}.status == ON_HOLD"

      - name: cascade_reassessment_finalize_maintenance
        grounds:
          - state_machines.Reassessment.DRAFT_to_FINALIZED
          - entities.TreatmentPlan.fields.phase
          - calculations.outcome_metrics
        distinguishing_aspect: "Depth-2 chain from a different trigger (reassessment finalize): finalize computes perv_pct 70.6 >= 50 which drives the referenced plan.phase PHASE_1_INTENSIVE -> PHASE_2_MAINTENANCE."
        test_recipe:
          setup:
            - "Patient with baseline (SUPERSEDED, excess 152.4) and current (FINALIZED, excess 44.8) LEFT_ARM evaluations, a plan in PHASE_1_INTENSIVE, and a DRAFT reassessment linking them."
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "Main Ten", mrn: "MRN-1" }
              as: ClinicAdmin
              captures: { pat_id: $.data.id, pat_v: $.data.version }
            - call: "POST /evaluations"
              payload: { patient_id: "${pat_id}", body_region: "LEFT_ARM", etiology: "SECONDARY", isl_stage: "STAGE_II", interval_cm: 4, circumferences_cm: [18,18,20,22,24], contralateral_circumferences_cm: [16,16,17,18,19], expected_patient_version: "${pat_v}" }
              as: Clinician
              captures: { base_eval_id: $.data.id }
            - call: "POST /evaluations/${base_eval_id}/finalize"
              payload: {}
              as: Clinician
            - call: "GET /patients/${pat_id}"
              payload: {}
              as: Clinician
              captures: { pat_v2: $.data.version }
            - call: "POST /evaluations"
              payload: { patient_id: "${pat_id}", body_region: "LEFT_ARM", etiology: "SECONDARY", isl_stage: "STAGE_II", interval_cm: 4, circumferences_cm: [17,17,18,19,20], contralateral_circumferences_cm: [16,16,17,18,19], expected_patient_version: "${pat_v2}" }
              as: Clinician
              captures: { cur_eval_id: $.data.id }
            - call: "POST /evaluations/${cur_eval_id}/finalize"
              payload: {}
              as: Clinician
            - call: "POST /authorizations"
              payload: { patient_id: "${pat_id}", body_region: "LEFT_ARM", payer_name: "Acme Health", auth_number: "AUTH-1", visit_cap: 5, effective_start_date: "2026-05-01", effective_end_date: "2026-12-31" }
              as: Authorizer
              captures: { auth_id: $.data.id }
            - call: "POST /treatment-plans"
              payload: { patient_id: "${pat_id}", evaluation_id: "${cur_eval_id}", authorization_id: "${auth_id}", prescribed_daily_minutes: 60 }
              as: Clinician
              captures: { plan_id: $.data.id }
            - call: "POST /reassessments"
              payload: { plan_id: "${plan_id}", baseline_evaluation_id: "${base_eval_id}", current_evaluation_id: "${cur_eval_id}" }
              as: Clinician
              captures: { reass_id: $.data.id }
          trigger:
            - call: "POST /reassessments/${reass_id}/finalize"
              payload: {}
              as: Clinician
          assert:
            - "Reassessment.${reass_id}.status == FINALIZED and perv_pct == 70.6"
            - "TreatmentPlan.${plan_id}.phase == PHASE_2_MAINTENANCE"

  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: priority_state_beats_fiscal_on_session_create
        grounds:
          - validations[priority=6]
          - validations[priority=10]
        distinguishing_aspect: "On POST /sessions a request that violates BOTH a state rule (plan ON_HOLD -> ERR_PLAN_NOT_ACTIVE, priority 6) and a fiscal rule (cap reached -> ERR_VISIT_CAP_EXCEEDED, priority 10) returns the state error: state (6) beats business_fiscal (10)."
        test_recipe:
          setup:
            - "Patient with FINALIZED eval, APPROVED auth visit_cap 1, ACTIVE plan; the single session is completed so the auth EXHAUSTS and the plan is cascaded to ON_HOLD; cap is now full."
          setup_api_calls:
            - call: "POST /patients"
