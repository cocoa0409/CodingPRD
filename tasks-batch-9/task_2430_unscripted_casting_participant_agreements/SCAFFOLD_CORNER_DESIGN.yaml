              as: ProductionAdmin
            - call: "POST /casting/applicants"
              payload: { casting_call_id: "${call_id}", legal_name: "Too Late", date_of_birth: "1994-04-02", residency_state_code: "GA" }
              as: CastingDirector
              captures: { late_err: $.data.error_id }
          assert:
            - "${call_status} == PUBLISHED"
            - "${early_err} == ERR_OPEN_CALL_WINDOW_CLOSED"
