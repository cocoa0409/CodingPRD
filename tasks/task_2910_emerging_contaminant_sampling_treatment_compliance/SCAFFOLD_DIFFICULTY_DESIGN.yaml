            - "Immediately before the trigger: EntryPoint.${ep_id}.max_compliance_ratio == 0.3750, compliance_posture == COMPLIANT, monitoring_status == REDUCTION_PENDING, requested_monitoring_status == ANNUAL, and GET /treatment-evaluations?entry_point_id=${ep_id} returns total_count 0"

      - name: invalidating_a_sample_cascades_supersede_and_deescalates_the_posture
        grounds:
          - state_machines.Sample.ANALYZED_to_INVALIDATED
          - state_machines.LabResult.ACCEPTED_to_SUPERSEDED
          - calculations.locational_running_annual_average
          - calculations.compliance_posture_derivation
          - entities.Sample.fields.status_before_invalidation
          - entities.EntryPoint.fields.consecutive_invalidated_samples
          - validations[priority=22]
        distinguishing_aspect: |
          A depth-3 chain fired by a DIFFERENT transition — POST /samples/{id}/invalidate on an ANALYZED
          sample: (1) the Sample becomes INVALIDATED and remembers status_before_invalidation ANALYZED,
          which (2) supersedes its ACCEPTED LabResult, which (3) drops accepted_result_count 4 -> 3 and
          re-derives the LRAA from three quarters so max_compliance_ratio falls 1.1250 -> 0.7500 and the
          posture DE-escalates VIOLATION_PENDING -> TRIGGERED. The chain shortens the input set instead
          of extending it, and it deliberately does NOT retract the mandated TreatmentEvaluation that
          the earlier escalation created, which is what separates it from instance (a).
        setup_note: "Depth 3: Sample -> LabResult -> EntryPoint derived fields/posture. The pre-existing mandated TreatmentEvaluation is untouched."
        test_recipe:
          setup:
            - "Contaminant PFOA: mcl 4.00, trigger 2.00, required_mrl 2.00."
            - "Laboratory certified for METHOD_533, lowest achievable detection limit 1.00, capacity 5."
            - "EntryPoint EPTDS-01, population 45000."
            - "Four ACCEPTED quarterly results at detection limit 1.00: 3.00 (2025Q3), 3.00 (2025Q4), 3.00 (2026Q1), 9.00 (2026Q2) -> compliance LRAA 4.50, ratio 1.1250, posture VIOLATION_PENDING, so a mandated TreatmentEvaluation was auto-created when the fourth result was accepted."
