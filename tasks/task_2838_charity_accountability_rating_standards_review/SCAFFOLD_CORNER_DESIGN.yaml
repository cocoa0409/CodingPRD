      - name: ratio_and_efficiency_round_to_four_places_before_the_tier_comparison
        claim_type: Precision
        grounds:
          - calculations.program_expense_ratio
          - calculations.fundraising_efficiency_3yr
          - calculations.months_of_reserve
          - calculations.dimension_raw_points
        distinguishing_aspect: |
          The rounding step is not cosmetic, it decides tiers. A ratio of
          0.84999990 rounds half-up to 0.8500 and therefore CLEARS a >= 0.85
          ladder it does not literally reach, and an efficiency of 0.20000020
          rounds down to 0.2000 and clears a <= 0.20 ladder it literally
          exceeds. The reserve ladder is the control: it rounds to 2 places, so
          11.994 becomes 11.99 and stays BELOW the >= 12 boundary. Comparing
          raw quotients instead of rounded ones costs this organization 20
          points on two ladders while leaving the third unchanged.
