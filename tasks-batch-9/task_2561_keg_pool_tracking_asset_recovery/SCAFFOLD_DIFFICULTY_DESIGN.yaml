  # ==========================================================================
  # RULE 6 — boundary_precision_check
  # Instance (i)  metric: KegPool.available_pct (a 2-decimal percentage) at the
  #               exact restrict threshold, on POST /issuance-orders.
  # Instance (ii) metric: brewer_loss_rate_bp with an EMPTY denominator set
  #               (zero-count boundary), on GET /brewers/{brewer_id}/loss-rate.
  # Different metrics, different endpoints, different boundary kinds.
  # ==========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: pool_available_pct_exactly_at_restrict_threshold_stays_open
        grounds:
          - calculations.pool_posture
          - entities.KegPool.fields.available_pct
          - entities.KegPool.fields.posture
          - validations.priority_14_ERR_POOL_RESTRICTED
          - errors.ERR_POOL_RESTRICTED
        distinguishing_aspect: |
          Metric: available_pct, a percentage carried to exactly 2 decimals, tested at the
          inclusive boundary of restrict_threshold_pct on POST /issuance-orders. Eight kegs
          with six allocated puts available_pct at exactly 25.00 against a threshold of 25:
          `>=` means the pool is still OPEN and a three-keg order is accepted. One more
          allocation drops it to 12.50 (still above freeze 10, so RESTRICTED rather than
          FROZEN) and the byte-identical three-keg order is refused because
          restricted_max_kegs_per_order is 2. A strict `>` reading of the threshold, or an
          off-by-one keg count, flips both outcomes.
        test_recipe:
          setup:
            - "Clock parked at 2026-08-01T23:00:00Z."
            - "Pool with exactly eight kegs and restrict_threshold_pct 25, freeze_threshold_pct 10, restricted_max_kegs_per_order 2, so the census divides cleanly into 12.50-point steps."
            - "Agreement float_size_kegs 10 keeps validation 43 (ERR_FLOAT_SIZE_EXCEEDED) out of the way for every order tried below (worst case 3 + 7 = 10)."
            - "credit_limit_cents 400000 keeps priority 50 out of the way."
            - "Six kegs allocated on order io1 before the trigger."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T23:00:00Z" }
              as: PoolOperator
              as_user_id: "op-1"
            - call: "POST /commodity-index"
              payload: { effective_date: "2026-07-01", usd_cents_per_kg: 480, source: "LME_SS304" }
              as: PoolOperator
              as_user_id: "op-1"
            - call: "POST /brewers"
              payload: { name: "Ridgeline Brewing", brand_code: "RDG", credit_limit_cents: 400000 }
              as: PoolOperator
              as_user_id: "op-1"
              captures: { b1_id: "$.data.id" }
            - call: "POST /pools"
              payload: { pool_code: "HB-50L", size_liters: 50, stainless_weight_kg: 12.5, replacement_cost_cents: 23500, region_code: "CO", restrict_threshold_pct: 25, freeze_threshold_pct: 10, restricted_max_kegs_per_order: 2 }
              as: PoolOperator
              as_user_id: "op-1"
              captures: { p1_id: "$.data.id" }
            - call: "POST /pools/${p1_id}/kegs"
              payload: { asset_tag: "K-0001" }
              as: PoolOperator
              as_user_id: "op-1"
            - call: "POST /pools/${p1_id}/kegs"
              payload: { asset_tag: "K-0002" }
              as: PoolOperator
              as_user_id: "op-1"
            - call: "POST /pools/${p1_id}/kegs"
              payload: { asset_tag: "K-0003" }
              as: PoolOperator
              as_user_id: "op-1"
            - call: "POST /pools/${p1_id}/kegs"
              payload: { asset_tag: "K-0004" }
              as: PoolOperator
              as_user_id: "op-1"
            - call: "POST /pools/${p1_id}/kegs"
              payload: { asset_tag: "K-0005" }
              as: PoolOperator
              as_user_id: "op-1"
            - call: "POST /pools/${p1_id}/kegs"
              payload: { asset_tag: "K-0006" }
              as: PoolOperator
              as_user_id: "op-1"
            - call: "POST /pools/${p1_id}/kegs"
              payload: { asset_tag: "K-0007" }
              as: PoolOperator
              as_user_id: "op-1"
            - call: "POST /pools/${p1_id}/kegs"
              payload: { asset_tag: "K-0008" }
              as: PoolOperator
              as_user_id: "op-1"
            - call: "POST /float-agreements"
              payload: { brewer_id: "${b1_id}", pool_id: "${p1_id}", float_size_kegs: 10, per_fill_rate_cents: 2200, replenishment_threshold_pct: 20 }
              as: PoolOperator
              as_user_id: "op-1"
              captures: { fa1_id: "$.data.id" }
            - call: "POST /float-agreements/${fa1_id}/activate"
              payload: { effective_date: "2026-08-01" }
              as: PoolOperator
              as_user_id: "op-1"
              captures: { fa1_v1: "$.data.version" }
            - call: "POST /issuance-orders"
              payload: { agreement_id: "${fa1_id}", requested_keg_count: 6 }
              as: PoolOperator
              as_user_id: "op-1"
              captures: { io1_id: "$.data.id" }
            - call: "POST /issuance-orders/${io1_id}/allocate"
              payload: { expected_agreement_version: "${fa1_v1}" }
              as: PoolOperator
              as_user_id: "op-1"
          trigger:
            - call: "POST /issuance-orders"
              payload: { agreement_id: "${fa1_id}", requested_keg_count: 3 }
              as: PoolOperator
              as_user_id: "op-1"
              captures: { io2_id: "$.data.id" }
            - call: "POST /issuance-orders/${io2_id}/cancel"
              payload: { cancel_reason: "boundary probe, releasing the request" }
              as: PoolOperator
              as_user_id: "op-1"
            - call: "POST /issuance-orders"
              payload: { agreement_id: "${fa1_id}", requested_keg_count: 1 }
              as: PoolOperator
              as_user_id: "op-1"
              captures: { io3_id: "$.data.id" }
            - call: "GET /float-agreements/${fa1_id}"
              payload: {}
              as: PoolOperator
              as_user_id: "op-1"
              captures: { fa1_v2: "$.data.version" }
            - call: "POST /issuance-orders/${io3_id}/allocate"
              payload: { expected_agreement_version: "${fa1_v2}" }
              as: PoolOperator
