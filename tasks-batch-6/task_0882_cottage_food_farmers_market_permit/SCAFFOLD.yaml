    path: "/cottage-food/inspections/{id}/close"
    description: "Close an inspection (SCHEDULED -> PASSED | FAILED)"
    roles: [HealthInspector]
    code: 200
    input: [result, "violation_count?"]
    output: Inspection
    side_effects: ["status -> PASSED | FAILED", "inspector_user_id = X-User-ID"]

  # ---- Complaint ----
  - method: POST
    path: "/cottage-food/complaints"
    description: "File a complaint against a producer/product"
    roles: [HealthInspector, HealthAdmin]
    code: 201
    input: [producer_id, category, description, "product_id?"]
    output: Complaint
    side_effects: ["status=RECEIVED", "filed_by_user_id = X-User-ID"]
  - method: GET
    path: "/cottage-food/complaints"
    description: "List complaints (filter by producer and/or product)"
    roles: [HealthInspector, HealthAdmin]
    code: 200
    input: ["producer_id?", "product_id?", "status?", "limit?", "offset?"]
    output: "Complaint[]"
    side_effects: []
  - method: GET
    path: "/cottage-food/complaints/{id}"
    description: "Get a complaint"
    roles: [HealthInspector, HealthAdmin]
    code: 200
    input: []
    output: Complaint
    side_effects: []
  - method: POST
    path: "/cottage-food/complaints/{id}/review"
    description: "Advance a complaint to UNDER_REVIEW (SoD: reviewer != filer)"
    roles: [HealthInspector, HealthAdmin]
    code: 200
    input: []
