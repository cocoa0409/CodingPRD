              as: AgreementAdmin
              captures: { s9_au_id: $.data.id }
            - call: "POST /transformative-agreements"
              payload: { publisher_id: "${s9_p_id}", agreement_code: "TA-MERID-2027", effective_from: "2026-07-01", effective_until: "2027-07-01", article_quota: 5, discount_pct: 0.20, covered_oa_models: ["HYBRID"], expected_publisher_version: "${s9_p_v}" }
              as: AgreementAdmin
