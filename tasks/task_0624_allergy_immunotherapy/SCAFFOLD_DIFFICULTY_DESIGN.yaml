          - entities.ShotVisit.fields.observation_window_min
        distinguishing_aspect: |
          Numeric temporal boundary: release at administered_at + exactly 30 minutes
          (standard window) is accepted (inclusive >=); the metric is elapsed observation
          minutes, reached through POST /shot-visits/{id}/release.
        test_recipe:
          setup:
            - "An ADMINISTERED shot at 2026-06-01T09:00:00Z with observation_window_min=30 (patient no prior systemic reaction, step1 not an escalation over last_dose 0)."
