  # =====================================================================
  # Rule 7: cross-entity state dependencies across DIFFERENT entity pairs.
  # Pair A: (ClaimTicket → Contract): /claims requires Contract in {ACTIVE, EXPIRING_SOON}.
  # Pair B: (Contract → ClaimTicket): /contracts/{id}/cancel from ACTIVE requires
  #   no ClaimTicket on the contract in {SUBMITTED, ASSESSED, DISPATCHED}.
