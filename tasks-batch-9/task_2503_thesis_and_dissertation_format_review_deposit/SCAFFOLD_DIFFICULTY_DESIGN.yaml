          - entities.GraduationClearance.fields.projection_variant
          - entities.GraduationClearance.fields.outstanding_items
          - state_machines.Term.OPEN_to_DEPOSIT_CLOSED
        distinguishing_aspect: |
          Not one byte of thesis-side data changes between the two reads — only Term.status flips
          OPEN -> DEPOSIT_CLOSED — yet outstanding_items grows from [FORMAT_ACCEPTANCE, DEPOSIT]
          to [DEFENSE_OUTCOME, FORMAT_ACCEPTANCE, INTEGRITY, DEPOSIT] because the PROVISIONAL
          variant accepts an ANNOUNCED defense and a NOT_SCREENED integrity state as satisfying
          while the FINAL variant demands terminal evidence; the variant is selected by the Term,
          a different entity from the one the projection is written onto.
