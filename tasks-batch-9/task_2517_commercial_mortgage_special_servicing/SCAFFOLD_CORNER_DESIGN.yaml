            - call: "POST /special-servicing/consultations"
              payload: { trust_id: "${trust_p_id}", subject_type: "WORKOUT_PLAN", workout_plan_id: "${plan_id}" }
              as: SpecialServicerAssetManager
              as_user_id: "amgr-001"
