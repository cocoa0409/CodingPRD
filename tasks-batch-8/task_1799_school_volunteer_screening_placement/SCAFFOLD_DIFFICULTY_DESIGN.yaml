  - rule_id: boundary_precision_check
    instances:
      - name: capacity_boundary_confirm_at_exactly_full
        grounds:
          - validations[priority=8]
          - calculations.opportunity_fill
          - errors[ERR_OPPORTUNITY_FULL]
        distinguishing_aspect: |
          Seat-count boundary on POST /placements/{id}/confirm: with capacity 1,
          the confirm that brings committed_count from 0 to 1 succeeds, and the
          confirm attempted when committed_count == capacity == 1 fails with
          ERR_OPPORTUNITY_FULL (>= comparison, not >).
        test_recipe:
          setup:
            - "OPEN opportunity cap 1 window 2026-08-10T14:00:00Z..2026-08-10T17:00:00Z; volunteers V1 and V2 both ACTIVE; both hold REQUESTED placements"
