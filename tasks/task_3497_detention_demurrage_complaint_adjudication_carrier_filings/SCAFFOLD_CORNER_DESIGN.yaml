          assert:
            - "the response status is 404 and error_id == ERR_INVOICE_NOT_FOUND"
            - "error_id != ERR_COMPLAINT_FILING_WINDOW_EXPIRED and != ERR_NOT_INVOICE_PARTY although both would also fail"

      - name: tariff_increase_notice_29_days_rejected_30_exact_accepted
        claim_type: Violation → Error
        grounds:
          - validations[priority=7]
          - entities.TariffPublication.fields.notice_period_days
          - errors.ERR_EFFECTIVE_DATE_NOTICE_SHORT
        distinguishing_aspect: "INCREASE tariffs carry a 30-day notice: effective_date 2026-09-30 (29 days after filing) is rejected, while exactly 2026-10-01 (30 days) is accepted — computed against filed_at, not the publish date."
        test_recipe:
          setup:
            - "VOCC carrier; clock 2026-09-01T00:00:00Z (filing day)."
          setup_api_calls:
            - *c_clock
            - *c_carrier
          trigger:
            - call: "POST /fmc/carriers/${carrier_id}/tariff-publications"
              payload: { tariff_code: "DD-INC-1", charge_scope: "DEMURRAGE", free_time_days: 2, per_diem_rate_cents: 6000, accrual_method: "CALENDAR", change_type: "INCREASE", effective_date: "2026-09-30T00:00:00Z", expected_carrier_version: "${carrier_v}" }
              as: CarrierRep
              as_user_id: "${carrier_id}"
              captures: { err_short: $.data.error_id }
            - call: "POST /fmc/carriers/${carrier_id}/tariff-publications"
              payload: { tariff_code: "DD-INC-2", charge_scope: "DEMURRAGE", free_time_days: 2, per_diem_rate_cents: 6000, accrual_method: "CALENDAR", change_type: "INCREASE", effective_date: "2026-10-01T00:00:00Z", expected_carrier_version: "${carrier_v}" }
              as: CarrierRep
              as_user_id: "${carrier_id}"
              captures: { t_ok: $.data.id }
          assert:
            - "the 29-day notice filing fails: 422 ERR_EFFECTIVE_DATE_NOTICE_SHORT (and the carrier version is unchanged by the rejected filing)"
            - "the exact 30-day filing succeeds: 201, TariffPublication.${t_ok}.notice_period_days == 30, publication_status == DRAFT"

      - name: publish_before_effective_date_rejected_at_effective_accepted
        claim_type: Violation → Error
        grounds:
          - state_machines.TariffPublication.DRAFT_to_PUBLISHED
          - errors.ERR_PUBLISH_WINDOW_NOT_REACHED
        distinguishing_aspect: "Publication gates on the logical clock vs effective_date: at 2026-09-09T23:59:59Z the publish fails 422; at exactly 2026-09-10T00:00:00Z it succeeds."
        test_recipe:
          setup:
            - "VOCC carrier; tariff with effective_date 2026-09-10T00:00:00Z filed 2026-09-01 (NEW, 1-day notice satisfied)."
          setup_api_calls:
            - *c_clock
            - *c_carrier
            - call: "POST /fmc/carriers/${carrier_id}/tariff-publications"
              payload: { tariff_code: "DD-PUB-1", charge_scope: "DEMURRAGE", free_time_days: 2, per_diem_rate_cents: 5000, accrual_method: "CALENDAR", change_type: "NEW", effective_date: "2026-09-10T00:00:00Z", expected_carrier_version: "${carrier_v}" }
              as: CarrierRep
              as_user_id: "${carrier_id}"
              captures: { t_pub: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-09T23:59:59Z" }
              as: CommissionAdmin
            - call: "POST /fmc/tariff-publications/${t_pub}/publish"
              payload: {}
              as: CarrierRep
              as_user_id: "${carrier_id}"
              captures: { err_early: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T00:00:00Z" }
              as: CommissionAdmin
            - call: "POST /fmc/tariff-publications/${t_pub}/publish"
              payload: {}
              as: CarrierRep
              as_user_id: "${carrier_id}"
          assert:
            - "one second early: 422 ERR_PUBLISH_WINDOW_NOT_REACHED and the tariff stays DRAFT"
            - "at the exact effective instant: 200 and publication_status == PUBLISHED"

      - name: service_contract_filed_31_days_rejected_30_exact_accepted
        claim_type: Violation → Error
        grounds:
          - validations[priority=7]
          - errors.ERR_LATE_SERVICE_CONTRACT_FILING
        distinguishing_aspect: "The 30-day service-contract filing window is inclusive: filing at exactly agreed_at + 30 days (2026-10-02T00:00:00Z) succeeds, while one second past it fails 422 ERR_LATE_SERVICE_CONTRACT_FILING."
        test_recipe:
          setup:
            - "VOCC carrier and shipper; two contracts both agreed 2026-09-02T00:00:00Z."
          setup_api_calls:
            - *c_clock
            - *c_carrier
            - *c_shipper
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-02T00:00:00Z" }
              as: CommissionAdmin
            - call: "POST /fmc/carriers/${carrier_id}/service-contracts"
              payload: { contract_reference: "SC-ON-TIME", shipper_id: "${shipper_id}", agreed_at: "2026-09-02T00:00:00Z", duration_months: 6, minimum_quantity_commitment: 50, negotiated_free_time_days: 3, negotiated_per_diem_rate_cents: 12000, negotiated_accrual_method: "CALENDAR" }
              as: CarrierRep
              as_user_id: "${carrier_id}"
              captures: { sc_ok: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-02T00:00:01Z" }
              as: CommissionAdmin
            - call: "POST /fmc/carriers/${carrier_id}/service-contracts"
              payload: { contract_reference: "SC-LATE", shipper_id: "${shipper_id}", agreed_at: "2026-09-02T00:00:00Z", duration_months: 6, minimum_quantity_commitment: 50, negotiated_free_time_days: 3, negotiated_per_diem_rate_cents: 12000, negotiated_accrual_method: "CALENDAR" }
              as: CarrierRep
              as_user_id: "${carrier_id}"
              captures: { err_late: $.data.error_id }
          assert:
            - "at exactly the deadline: 201 and ServiceContract.${sc_ok}.contract_status == EFFECTIVE"
            - "one second past: 422 ERR_LATE_SERVICE_CONTRACT_FILING and no second contract is stored"

      - name: invoice_issued_31_days_rejected_30_exact_accepted
        claim_type: Violation → Error
