              payload: { program_id: "${prog_id}", name: "Acme", tier: 1 }
              as: ProgramManager
              captures: { sup_id: $.data.id }
            - call: "POST /vms/statements-of-work"
              payload: { program_id: "${prog_id}", supplier_id: "${sup_id}", title: "Build", total_value_cents: 100000 }
              as: ProgramManager
              captures: { sow_id: $.data.id }
            - call: "POST /vms/milestones"
              payload: { statement_of_work_id: "${sow_id}", name: "M1", milestone_amount_cents: 50000, sequence: 1 }
              as: ProgramManager
              captures: { m1: $.data.id }
            - call: "POST /vms/statements-of-work/${sow_id}/activate"
              payload: {}
              as: ProgramManager
            - call: "POST /vms/milestones/${m1}/start"
              payload: {}
              as: Supplier
              as_user_id: "${sup_id}"
            - call: "POST /vms/milestones/${m1}/submit"
              payload: {}
              as: Supplier
              as_user_id: "${sup_id}"
            - call: "POST /vms/milestones/${m1}/accept"
              payload: {}
              as: HiringManager
          trigger:
            - call: "POST /vms/milestones/${m1}/invoice"
              payload: {}
              as: Finance
            - call: "GET /vms/statements-of-work/${sow_id}"
              payload: {}
              as: ProgramManager
              captures: { sow_status: $.data.status, inv: $.data.invoiced_value_cents }
          assert:
            - "StatementOfWork.${sow_id}.invoiced_value_cents == 50000"
            - "StatementOfWork.${sow_id}.status == COMPLETED"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_fiscal_on_propose_rate
        grounds:
          - validations[priority=5]
          - validations[priority=11]
          - state_machines.Submittal.INTERVIEWING_to_RATE_PROPOSED
        distinguishing_aspect: |
          Category pair state(priority 5) vs business_fiscal(priority 11):
          a single propose_rate on a SHORTLISTED (not INTERVIEWING) submittal with a
          pay_rate ABOVE max violates both the state precondition and the pay-rate
          ceiling in one request; the lower-priority state check wins ->
          ERR_INVALID_STATE, not ERR_PAY_RATE_EXCEEDS_MAX.
        test_recipe:
          setup:
            - "Submittal SHORTLISTED (not yet INTERVIEWING); Requisition max_pay 10000"
          setup_api_calls:
            - call: "POST /vms/programs"
              payload: { name: "P", client_name: "C", default_markup_pct: 0.45, max_markup_pct: 0.60, coemployment_tenure_limit_days: 180, tenure_warning_threshold_days: 120 }
              as: ProgramManager
              captures: { prog_id: $.data.id }
            - call: "POST /vms/suppliers"
              payload: { program_id: "${prog_id}", name: "Acme", tier: 1 }
              as: ProgramManager
              captures: { sup_id: $.data.id }
            - call: "POST /vms/workers"
              payload: { program_id: "${prog_id}", full_name: "W", national_id_hash: "h1" }
              as: ProgramManager
              captures: { wkr_id: $.data.id }
            - call: "POST /vms/requisitions"
              payload: { program_id: "${prog_id}", title: "Eng", openings: 1, max_pay_rate_cents: 10000 }
              as: ProgramManager
              captures: { req_id: $.data.id }
            - call: "POST /vms/requisitions/${req_id}/distribute"
              payload: { supplier_ids: ["${sup_id}"] }
              as: ProgramManager
            - call: "POST /vms/submittals"
              payload: { requisition_id: "${req_id}", supplier_id: "${sup_id}", worker_profile_id: "${wkr_id}", pay_rate_cents: 8000 }
              as: Supplier
              as_user_id: "${sup_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /vms/submittals/${sub_id}/shortlist"
              payload: {}
              as: HiringManager
          trigger:
            - call: "POST /vms/submittals/${sub_id}/propose_rate"
              payload: { pay_rate_cents: 99999 }
              as: Supplier
              as_user_id: "${sup_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409"
            - "error_id == ERR_INVALID_STATE (state priority 5 beats fiscal priority 11)"

      - name: temporal_release_beats_fiscal_payrate_on_submittal_create
        grounds:
          - validations[priority=6]
          - validations[priority=11]
          - state_machines.Requisition.DRAFT_to_DISTRIBUTED
          - errors[ERR_DISTRIBUTION_NOT_RELEASED]
        distinguishing_aspect: |
          Category pair business_temporal(priority 6, distribution not released) vs
          business_fiscal(priority 11, pay rate over max): a tier-2 supplier whose
          Distribution is still PENDING submits a candidate with pay_rate ABOVE
          Requisition.max_pay_rate_cents — both checks fail, the higher-priority
          temporal release gate wins -> ERR_DISTRIBUTION_NOT_RELEASED, not
          ERR_PAY_RATE_EXCEEDS_MAX. Different pair from state-vs-fiscal above.
        test_recipe:
          setup:
            - "Requisition (max_pay 10000, tier_release_interval 24h) distributed to a tier-1 and a tier-2 supplier at clock 2026-02-01T00:00:00Z"
            - "Tier-2 supplier's Distribution is still PENDING (released_at = 2026-02-02T00:00:00Z > clock)"
          setup_api_calls:
            - call: "POST /vms/programs"
              payload: { name: "P", client_name: "C", default_markup_pct: 0.45, max_markup_pct: 0.60, coemployment_tenure_limit_days: 180, tenure_warning_threshold_days: 120 }
              as: ProgramManager
              captures: { prog_id: $.data.id }
            - call: "POST /vms/programs/${prog_id}/_clock/set"
              payload: { to_iso8601: "2026-02-01T00:00:00.000Z" }
              as: ProgramManager
            - call: "POST /vms/suppliers"
              payload: { program_id: "${prog_id}", name: "S1", tier: 1 }
              as: ProgramManager
              captures: { s1: $.data.id }
            - call: "POST /vms/suppliers"
              payload: { program_id: "${prog_id}", name: "S2", tier: 2 }
              as: ProgramManager
              captures: { s2: $.data.id }
            - call: "POST /vms/workers"
              payload: { program_id: "${prog_id}", full_name: "W", national_id_hash: "h1" }
              as: ProgramManager
              captures: { wkr_id: $.data.id }
            - call: "POST /vms/requisitions"
              payload: { program_id: "${prog_id}", title: "Eng", openings: 1, max_pay_rate_cents: 10000, tier_release_interval_hours: 24 }
              as: ProgramManager
              captures: { req_id: $.data.id }
            - call: "POST /vms/requisitions/${req_id}/distribute"
              payload: { supplier_ids: ["${s1}", "${s2}"] }
              as: ProgramManager
          trigger:
            - call: "POST /vms/submittals"
              payload: { requisition_id: "${req_id}", supplier_id: "${s2}", worker_profile_id: "${wkr_id}", pay_rate_cents: 99999 }
              as: Supplier
              as_user_id: "${s2}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409"
            - "error_id == ERR_DISTRIBUTION_NOT_RELEASED (temporal priority 6 beats fiscal priority 11)"

