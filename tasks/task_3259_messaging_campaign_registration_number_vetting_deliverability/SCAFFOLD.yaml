    input: [brand_id, phone_number, evidence_url, evidence_text, captured_at, consent_method]
    output: ConsentRecord
    side_effects: ["retention_expires_at = captured_at + 1460 days", "status=ACTIVE"]

  - method: GET
    path: "/messaging/accounts/{id}/consent_records/{id}"
    description: "Get a ConsentRecord"
    roles: [PlatformAdmin, ComplianceOfficer, BrandManager, CampaignManager, CarrierReviewer]
    code: 200
    input: []
    output: ConsentRecord
    side_effects: []

  - method: GET
    path: "/messaging/accounts/{id}/consent_records/{id}/messages"
    description: "List messages gated by a consent record (FK reverse reachability Message.consent_record_id -> ConsentRecord)"
    roles: [PlatformAdmin, ComplianceOfficer, BrandManager, CampaignManager, CarrierReviewer]
    code: 200
    input: ["limit?", "offset?"]
    output: "Message[]"
    side_effects: []

  - method: GET
    path: "/messaging/accounts/{id}/consent_records"
    description: "List consent records; brand_id and phone_number filters supported"
    roles: [PlatformAdmin, ComplianceOfficer, BrandManager, CampaignManager, CarrierReviewer]
    code: 200
    input: ["limit?", "offset?", "status?", "brand_id?", "phone_number?", "account_id?"]
    output: "ConsentRecord[]"
    side_effects: []

  - method: POST
    path: "/messaging/accounts/{id}/consent_records/{id}/revoke"
    description: "Manually revoke consent"
    roles: [BrandManager, ComplianceOfficer]
    code: 200
    input: []
    output: ConsentRecord
    side_effects: ["ConsentRecord -> REVOKED"]

  # --- Message ---
  - method: POST
    path: "/messaging/accounts/{id}/messages"
    description: "Send a message: compliance + consent + throughput gates, then QUEUED"
    roles: [CampaignManager]
    code: 201
    input: [campaign_id, sender_number_id, to_number, body, carrier_code]
    output: Message
    side_effects:
      - "consent_record_id resolved to the ACTIVE ConsentRecord for (campaign brand, to_number)"
      - "segments computed per segments_and_fee"
      - "Message -> ACCEPTED -> QUEUED (queued_at, queued_run_index stamped)"

  - method: GET
    path: "/messaging/accounts/{id}/messages/{id}"
    description: "Get a Message"
    roles: [PlatformAdmin, ComplianceOfficer, CampaignManager, CarrierReviewer, SystemDriver]
    code: 200
    input: []
    output: Message
    side_effects: []

  - method: GET
    path: "/messaging/accounts/{id}/messages/{id}/feedback_events"
    description: "List feedback events tied to a message (FK reverse reachability FeedbackEvent.message_id -> Message)"
    roles: [PlatformAdmin, ComplianceOfficer, CampaignManager, CarrierReviewer]
    code: 200
    input: ["limit?", "offset?"]
    output: "FeedbackEvent[]"
    side_effects: []

  - method: GET
    path: "/messaging/accounts/{id}/messages"
    description: "List messages; campaign_id and status filters supported"
    roles: [PlatformAdmin, ComplianceOfficer, CampaignManager, CarrierReviewer]
    code: 200
    input: ["limit?", "offset?", "status?", "campaign_id?", "account_id?"]
    output: "Message[]"
    side_effects: []

  - method: POST
    path: "/messaging/accounts/{id}/messages/{id}/delivery_outcome"
    description: "Simulated carrier outcome for a SENT message"
    roles: [SystemDriver]
    code: 200
    input: [outcome, "error_code?"]
    output: Message
    side_effects: ["Message -> DELIVERED | UNDELIVERED | FAILED (error_code validated for FAILED)"]

  - method: POST
    path: "/messaging/accounts/{id}/messages/{id}/retry"
    description: "Retry a FAILED message with a retryable error code; re-checks consent and throughput"
    roles: [CampaignManager]
    code: 200
    input: []
    output: Message
    side_effects: ["Message -> ACCEPTED -> QUEUED"]

  - method: POST
    path: "/messaging/accounts/{id}/messages/{id}/cancel"
    description: "Cancel a QUEUED or FAILED message"
    roles: [CampaignManager]
    code: 200
    input: []
    output: Message
    side_effects: ["Message -> STALE_CANCELLED"]

  # --- FeedbackEvent ---
  - method: POST
    path: "/messaging/accounts/{id}/feedback_events"
    description: "Record carrier/user feedback: BLOCK, SPAM_COMPLAINT, or STOP keyword"
    roles: [SystemDriver]
    code: 201
    input: [campaign_id, kind, "message_id?", "keyword?", "to_number?"]
    output: FeedbackEvent
    side_effects:
      - "FeedbackEvent -> RECORDED -> APPLIED in-request"
      - "STOP: matching ACTIVE ConsentRecord (brand of campaign + to_number) -> REVOKED"
      - "BLOCK/SPAM_COMPLAINT: message_id required and must belong to campaign"

  - method: GET
    path: "/messaging/accounts/{id}/feedback_events"
    description: "List feedback events; campaign_id and kind filters supported"
    roles: [PlatformAdmin, ComplianceOfficer, CampaignManager, CarrierReviewer]
    code: 200
    input: ["limit?", "offset?", "campaign_id?", "kind?", "message_id?", "account_id?"]
    output: "FeedbackEvent[]"
    side_effects: []

  # --- DailySnapshot ---
  - method: POST
    path: "/messaging/accounts/{id}/campaigns/{id}/snapshots"
