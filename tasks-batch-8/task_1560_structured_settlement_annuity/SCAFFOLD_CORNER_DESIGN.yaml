        grounds: [state_machines.DeathClaim.REPORTED_to_SETTLED]
        excluded_because:
          difficulty_instance: death_settle_cancellation_chain
          rationale: "The settle cascade through payee/payments/policy/agreement is asserted by the named 1.8 instance."
      - name: clock_default_time_covered
        claim_type: scheduled_actions
        grounds: ["endpoints[POST /annuity/_clock/set_current_utc]"]
        excluded_because:
          difficulty_instance: stale_check_day_180_vs_181
          rationale: "Clock-driven transitions from the fixed default 2026-08-01T00:00:00Z baseline are exercised by the named 1.8 instance and by every dated corner chain."
