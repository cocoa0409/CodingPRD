# §1.9 Scaffold Corner Design — VITA site
# Breadth coverage of every testable claim in §1.1–§1.7 that §1.8 does not cover.
# Logical clock default 2026-08-01T00:00:00Z unless a chain sets it.
scaffold_corner_design:

  # ============================================================ entities
  - section: entities
    instances:
      - name: site_creation_defaults
        claim_type: creation
        grounds: [entities.Site.fields.status, entities.Site.fields.accepted_count, entities.Site.fields.goal_met]
        distinguishing_aspect: "A new Site starts in SETUP with accepted_count 0 and goal_met false; the creation response and a later GET agree."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "Library VITA", sponsor_org: "UnitedWay", station_capacity: 4, season_start: "2026-07-01T00:00:00Z", season_end: "2026-12-31T23:59:59Z", daily_open_hour: 9, daily_close_hour: 17, goal_returns: 50 }, as: SponsorAdmin, captures: { site_id: $.data.id } }
          trigger:
            - { call: "GET /sites/${site_id}", as: SponsorAdmin, captures: { st: $.data.status, ac: $.data.accepted_count, gm: $.data.goal_met, v: $.data.version } }
          assert:
            - "Site.${site_id}.status == SETUP (initial state)"
            - "Site.${site_id}.accepted_count == 0 and goal_met == false"
            - "Site.${site_id}.version == 1 and id/created_at/updated_at are server-stamped"

      - name: taxpayer_duplicate_ssn_rejected
        claim_type: type_constraints
        grounds: [entities.Taxpayer.fields.ssn_token, "errors[ERR_TAXPAYER_DUPLICATE_SSN]"]
        distinguishing_aspect: "ssn_token is globally unique: a second POST /taxpayers with the same ssn_token fails with ERR_TAXPAYER_DUPLICATE_SSN (409)."
        test_recipe:
          setup: ["site with an active coordinator (actor for taxpayer registration)"]
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "Library VITA", sponsor_org: "UnitedWay", station_capacity: 4, season_start: "2026-07-01T00:00:00Z", season_end: "2026-12-31T23:59:59Z", daily_open_hour: 9, daily_close_hour: 17, goal_returns: 50 }, as: SponsorAdmin, captures: { site_id: $.data.id } }
            - { call: "POST /volunteers", payload: { site_id: "${site_id}", full_name: "Coord Ann", email: "coord@x.org", is_coordinator: true }, as: SponsorAdmin, captures: { coord_id: $.data.id, coord_v: $.data.version } }
            - { call: "POST /volunteers/${coord_id}/certifications", payload: { test_type: ETHICS, score: 95, tax_season: 2026, expected_volunteer_version: "${coord_v}" }, as: SponsorAdmin }
            - { call: "POST /volunteers/${coord_id}/state", payload: { to_status: ACTIVE }, as: SponsorAdmin }
            - { call: "POST /taxpayers", payload: { full_name: "Tp Dup", ssn_token: "SSN-DUP", phone: "555-2001" }, as: SiteCoordinator, as_user_id: "${coord_id}" }
          trigger:
            - { call: "POST /taxpayers", payload: { full_name: "Tp Dup Two", ssn_token: "SSN-DUP", phone: "555-2002" }, as: SiteCoordinator, as_user_id: "${coord_id}", captures: { err: $.data.error_id } }
          assert:
            - "response error_id == ERR_TAXPAYER_DUPLICATE_SSN (409)"

      - name: get_return_not_found
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]", endpoints]
        distinguishing_aspect: "GET on a non-existent TaxReturn id yields ERR_NOT_FOUND (404) with the error envelope."
        test_recipe:
          setup: ["one site exists (any state)"]
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "Library VITA", sponsor_org: "UnitedWay", station_capacity: 4, season_start: "2026-07-01T00:00:00Z", season_end: "2026-12-31T23:59:59Z", daily_open_hour: 9, daily_close_hour: 17, goal_returns: 50 }, as: SponsorAdmin, captures: { site_id: $.data.id } }
          trigger:
            - { call: "GET /tax-returns/00000000-0000-4000-8000-000000000000", as: SponsorAdmin, captures: { err: $.data.error_id } }
          assert:
            - "response error_id == ERR_NOT_FOUND and HTTP status 404"

      - name: taxpayer_create_unknown_field_rejected
        claim_type: required_fields
        grounds: ["validations[priority=4]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Strict request schema: an unknown input field (version) on POST /taxpayers is rejected with ERR_INVALID_REQUEST (400), not silently ignored."
        test_recipe:
          setup: ["site with an active coordinator"]
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "Library VITA", sponsor_org: "UnitedWay", station_capacity: 4, season_start: "2026-07-01T00:00:00Z", season_end: "2026-12-31T23:59:59Z", daily_open_hour: 9, daily_close_hour: 17, goal_returns: 50 }, as: SponsorAdmin, captures: { site_id: $.data.id } }
            - { call: "POST /volunteers", payload: { site_id: "${site_id}", full_name: "Coord Ann", email: "coord@x.org", is_coordinator: true }, as: SponsorAdmin, captures: { coord_id: $.data.id, coord_v: $.data.version } }
            - { call: "POST /volunteers/${coord_id}/certifications", payload: { test_type: ETHICS, score: 95, tax_season: 2026, expected_volunteer_version: "${coord_v}" }, as: SponsorAdmin }
            - { call: "POST /volunteers/${coord_id}/state", payload: { to_status: ACTIVE }, as: SponsorAdmin }
          trigger:
            - { call: "POST /taxpayers", payload: { full_name: "Tp X", ssn_token: "SSN-X1", phone: "555-2003", version: 9 }, as: SiteCoordinator, as_user_id: "${coord_id}", captures: { err: $.data.error_id } }
          assert:
            - "response error_id == ERR_INVALID_REQUEST (400) — unknown field version rejected"

      - name: appointment_missing_required_field_rejected
        claim_type: required_fields
        grounds: ["validations[priority=4]", "errors[ERR_INVALID_REQUEST]", entities.Appointment.fields.end_at]
        distinguishing_aspect: "Omitting required field end_at on POST /appointments yields ERR_INVALID_REQUEST before any state/business check runs."
        test_recipe:
          setup: ["certified OPEN site with active coordinator and screener; one taxpayer"]
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "Library VITA", sponsor_org: "UnitedWay", station_capacity: 4, season_start: "2026-07-01T00:00:00Z", season_end: "2026-12-31T23:59:59Z", daily_open_hour: 9, daily_close_hour: 17, goal_returns: 50 }, as: SponsorAdmin, captures: { site_id: $.data.id } }
            - { call: "POST /volunteers", payload: { site_id: "${site_id}", full_name: "Coord Ann", email: "coord@x.org", is_coordinator: true }, as: SponsorAdmin, captures: { coord_id: $.data.id, coord_v: $.data.version } }
            - { call: "POST /volunteers/${coord_id}/certifications", payload: { test_type: ETHICS, score: 95, tax_season: 2026, expected_volunteer_version: "${coord_v}" }, as: SponsorAdmin }
            - { call: "POST /volunteers/${coord_id}/state", payload: { to_status: ACTIVE }, as: SponsorAdmin }
            - { call: "POST /sites/${site_id}/state", payload: { to_status: CERTIFIED }, as: SiteCoordinator, as_user_id: "${coord_id}" }
            - { call: "POST /sites/${site_id}/state", payload: { to_status: OPEN }, as: SiteCoordinator, as_user_id: "${coord_id}" }
            - { call: "POST /volunteers", payload: { site_id: "${site_id}", full_name: "Screen Sam", email: "scr@x.org" }, as: SiteCoordinator, as_user_id: "${coord_id}", captures: { scr_id: $.data.id } }
            - { call: "POST /taxpayers", payload: { full_name: "Tp Y", ssn_token: "SSN-Y1", phone: "555-2004" }, as: Screener, as_user_id: "${scr_id}", captures: { tp_id: $.data.id } }
          trigger:
            - { call: "POST /appointments", payload: { site_id: "${site_id}", taxpayer_id: "${tp_id}", volunteer_id: "${coord_id}", purpose: INTAKE, start_at: "2026-08-03T10:00:00Z" }, as: Screener, as_user_id: "${scr_id}", captures: { err: $.data.error_id } }
          assert:
            - "response error_id == ERR_INVALID_REQUEST (400) — required field end_at missing"

      - name: certification_supersede_marks_prior
        claim_type: computed_fields
        grounds: [entities.Certification.fields.status, entities.Certification.fields.attempt_number, calculations.certification_result]
        distinguishing_aspect: "A second attempt for the same (volunteer, test_type, tax_season) becomes CURRENT with attempt_number 2 and flips the first attempt to SUPERSEDED; volunteer.version advances by 1 per recording."
        test_recipe:
          setup: ["certified site with coordinator; one registered volunteer holding one BASIC attempt (score 85)"]
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "Library VITA", sponsor_org: "UnitedWay", station_capacity: 4, season_start: "2026-07-01T00:00:00Z", season_end: "2026-12-31T23:59:59Z", daily_open_hour: 9, daily_close_hour: 17, goal_returns: 50 }, as: SponsorAdmin, captures: { site_id: $.data.id } }
            - { call: "POST /volunteers", payload: { site_id: "${site_id}", full_name: "Coord Ann", email: "coord@x.org", is_coordinator: true }, as: SponsorAdmin, captures: { coord_id: $.data.id, coord_v: $.data.version } }
            - { call: "POST /volunteers/${coord_id}/certifications", payload: { test_type: ETHICS, score: 95, tax_season: 2026, expected_volunteer_version: "${coord_v}" }, as: SponsorAdmin }
            - { call: "POST /volunteers/${coord_id}/state", payload: { to_status: ACTIVE }, as: SponsorAdmin }
            - { call: "POST /volunteers", payload: { site_id: "${site_id}", full_name: "Trainee Tim", email: "tim@x.org" }, as: SiteCoordinator, as_user_id: "${coord_id}", captures: { tim_id: $.data.id, tim_v: $.data.version } }
            - { call: "POST /volunteers/${tim_id}/certifications", payload: { test_type: BASIC, score: 85, tax_season: 2026, expected_volunteer_version: "${tim_v}" }, as: SiteCoordinator, as_user_id: "${coord_id}", captures: { cert1: $.data.id, c1_attempt: $.data.attempt_number } }
            - { call: "GET /volunteers/${tim_id}", as: SiteCoordinator, as_user_id: "${coord_id}", captures: { tim_v2: $.data.version } }
          trigger:
            - { call: "POST /volunteers/${tim_id}/certifications", payload: { test_type: BASIC, score: 90, tax_season: 2026, expected_volunteer_version: "${tim_v2}" }, as: SiteCoordinator, as_user_id: "${coord_id}", captures: { cert2: $.data.id, c2_attempt: $.data.attempt_number, c2_status: $.data.status } }
            - { call: "GET /volunteers/${tim_id}/certifications", as: SiteCoordinator, as_user_id: "${coord_id}" }
          assert:
            - "First attempt had attempt_number == 1; second attempt has attempt_number == 2 and status == CURRENT"
            - "Certification.${cert1}.status == SUPERSEDED in the created_at-ascending list"
            - "Volunteer.${tim_id}.version advanced by 1 for each certification recording"

      - name: patch_computed_field_rejected
        claim_type: computed_fields
        grounds: ["validations[priority=4]", entities.TaxReturn.fields.estimated_refund_cents, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Computed fields are read-only: PATCH /tax-returns/{id} carrying estimated_refund_cents is rejected with ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["certified OPEN site; verified taxpayer; CHECKED_IN appointment; return created"]
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "Library VITA", sponsor_org: "UnitedWay", station_capacity: 4, season_start: "2026-07-01T00:00:00Z", season_end: "2026-12-31T23:59:59Z", daily_open_hour: 9, daily_close_hour: 17, goal_returns: 50 }, as: SponsorAdmin, captures: { site_id: $.data.id } }
            - { call: "POST /volunteers", payload: { site_id: "${site_id}", full_name: "Coord Ann", email: "coord@x.org", is_coordinator: true }, as: SponsorAdmin, captures: { coord_id: $.data.id, coord_v: $.data.version } }
            - { call: "POST /volunteers/${coord_id}/certifications", payload: { test_type: ETHICS, score: 95, tax_season: 2026, expected_volunteer_version: "${coord_v}" }, as: SponsorAdmin }
            - { call: "POST /volunteers/${coord_id}/state", payload: { to_status: ACTIVE }, as: SponsorAdmin }
            - { call: "POST /sites/${site_id}/state", payload: { to_status: CERTIFIED }, as: SiteCoordinator, as_user_id: "${coord_id}" }
            - { call: "POST /sites/${site_id}/state", payload: { to_status: OPEN }, as: SiteCoordinator, as_user_id: "${coord_id}" }
            - { call: "POST /volunteers", payload: { site_id: "${site_id}", full_name: "Screen Sam", email: "scr@x.org" }, as: SiteCoordinator, as_user_id: "${coord_id}", captures: { scr_id: $.data.id } }
            - { call: "POST /volunteers", payload: { site_id: "${site_id}", full_name: "Prep Pat", email: "prep@x.org" }, as: SiteCoordinator, as_user_id: "${coord_id}", captures: { prep_id: $.data.id, prep_v: $.data.version } }
            - { call: "POST /volunteers/${prep_id}/certifications", payload: { test_type: ETHICS, score: 90, tax_season: 2026, expected_volunteer_version: "${prep_v}" }, as: SiteCoordinator, as_user_id: "${coord_id}" }
            - { call: "GET /volunteers/${prep_id}", as: SiteCoordinator, as_user_id: "${coord_id}", captures: { prep_v2: $.data.version } }
            - { call: "POST /volunteers/${prep_id}/certifications", payload: { test_type: BASIC, score: 88, tax_season: 2026, expected_volunteer_version: "${prep_v2}" }, as: SiteCoordinator, as_user_id: "${coord_id}" }
            - { call: "POST /volunteers/${prep_id}/state", payload: { to_status: ACTIVE }, as: SiteCoordinator, as_user_id: "${coord_id}" }
            - { call: "POST /taxpayers", payload: { full_name: "Tp Z", ssn_token: "SSN-Z1", phone: "555-2005" }, as: Screener, as_user_id: "${scr_id}", captures: { tp_id: $.data.id } }
            - { call: "POST /taxpayers/${tp_id}/verify-identity", payload: { id_document_type: DRIVERS_LICENSE }, as: Screener, as_user_id: "${scr_id}" }
            - { call: "POST /appointments", payload: { site_id: "${site_id}", taxpayer_id: "${tp_id}", volunteer_id: "${prep_id}", purpose: PREPARATION, start_at: "2026-08-03T10:00:00Z", end_at: "2026-08-03T11:00:00Z" }, as: Screener, as_user_id: "${scr_id}", captures: { appt_id: $.data.id } }
            - { call: "POST /appointments/${appt_id}/state", payload: { to_status: CHECKED_IN }, as: Screener, as_user_id: "${scr_id}" }
            - { call: "POST /tax-returns", payload: { appointment_id: "${appt_id}", tax_year: 2025, filing_status: SINGLE }, as: Preparer, as_user_id: "${prep_id}", captures: { ret_id: $.data.id, ret_v: $.data.version } }
          trigger:
            - { call: "PATCH /tax-returns/${ret_id}", payload: { estimated_refund_cents: 1, expected_return_version: "${ret_v}" }, as: Preparer, as_user_id: "${prep_id}", captures: { err: $.data.error_id } }
          assert:
            - "response error_id == ERR_INVALID_REQUEST (400) — computed field is not a writable input"

      - name: taxpayer_preferred_language_default
        claim_type: defaults
        grounds: [entities.Taxpayer.fields.preferred_language]
        distinguishing_aspect: "Omitting preferred_language on POST /taxpayers applies the default EN."
        test_recipe:
          setup: ["site with an active coordinator"]
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "Library VITA", sponsor_org: "UnitedWay", station_capacity: 4, season_start: "2026-07-01T00:00:00Z", season_end: "2026-12-31T23:59:59Z", daily_open_hour: 9, daily_close_hour: 17, goal_returns: 50 }, as: SponsorAdmin, captures: { site_id: $.data.id } }
            - { call: "POST /volunteers", payload: { site_id: "${site_id}", full_name: "Coord Ann", email: "coord@x.org", is_coordinator: true }, as: SponsorAdmin, captures: { coord_id: $.data.id, coord_v: $.data.version } }
            - { call: "POST /volunteers/${coord_id}/certifications", payload: { test_type: ETHICS, score: 95, tax_season: 2026, expected_volunteer_version: "${coord_v}" }, as: SponsorAdmin }
            - { call: "POST /volunteers/${coord_id}/state", payload: { to_status: ACTIVE }, as: SponsorAdmin }
          trigger:
            - { call: "POST /taxpayers", payload: { full_name: "Tp Lang", ssn_token: "SSN-L1", phone: "555-2006" }, as: SiteCoordinator, as_user_id: "${coord_id}", captures: { lang: $.data.preferred_language, idst: $.data.identity_status } }
          assert:
            - "Taxpayer.preferred_language == EN (default applied)"
            - "Taxpayer.identity_status == UNVERIFIED (initial state)"

  # ============================================================ state_machines
  - section: state_machines
    instances:
      - name: return_initial_state_intake
        claim_type: initial_state
        grounds: [state_machines.TaxReturn, entities.TaxReturn.fields.status]
        distinguishing_aspect: "A newly created TaxReturn starts INTAKE_STARTED with final_refund_cents null, submission_count 0, reached_preparation false, documents_complete false, out_of_scope false."
        test_recipe:
          setup: ["certified OPEN site; active preparer; verified taxpayer with CHECKED_IN appointment"]
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "Library VITA", sponsor_org: "UnitedWay", station_capacity: 4, season_start: "2026-07-01T00:00:00Z", season_end: "2026-12-31T23:59:59Z", daily_open_hour: 9, daily_close_hour: 17, goal_returns: 50 }, as: SponsorAdmin, captures: { site_id: $.data.id } }
            - { call: "POST /volunteers", payload: { site_id: "${site_id}", full_name: "Coord Ann", email: "coord@x.org", is_coordinator: true }, as: SponsorAdmin, captures: { coord_id: $.data.id, coord_v: $.data.version } }
            - { call: "POST /volunteers/${coord_id}/certifications", payload: { test_type: ETHICS, score: 95, tax_season: 2026, expected_volunteer_version: "${coord_v}" }, as: SponsorAdmin }
            - { call: "POST /volunteers/${coord_id}/state", payload: { to_status: ACTIVE }, as: SponsorAdmin }
            - { call: "POST /sites/${site_id}/state", payload: { to_status: CERTIFIED }, as: SiteCoordinator, as_user_id: "${coord_id}" }
            - { call: "POST /sites/${site_id}/state", payload: { to_status: OPEN }, as: SiteCoordinator, as_user_id: "${coord_id}" }
            - { call: "POST /volunteers", payload: { site_id: "${site_id}", full_name: "Screen Sam", email: "scr@x.org" }, as: SiteCoordinator, as_user_id: "${coord_id}", captures: { scr_id: $.data.id } }
            - { call: "POST /volunteers", payload: { site_id: "${site_id}", full_name: "Prep Pat", email: "prep@x.org" }, as: SiteCoordinator, as_user_id: "${coord_id}", captures: { prep_id: $.data.id, prep_v: $.data.version } }
            - { call: "POST /volunteers/${prep_id}/certifications", payload: { test_type: ETHICS, score: 90, tax_season: 2026, expected_volunteer_version: "${prep_v}" }, as: SiteCoordinator, as_user_id: "${coord_id}" }
            - { call: "GET /volunteers/${prep_id}", as: SiteCoordinator, as_user_id: "${coord_id}", captures: { prep_v2: $.data.version } }
            - { call: "POST /volunteers/${prep_id}/certifications", payload: { test_type: BASIC, score: 88, tax_season: 2026, expected_volunteer_version: "${prep_v2}" }, as: SiteCoordinator, as_user_id: "${coord_id}" }
            - { call: "POST /volunteers/${prep_id}/state", payload: { to_status: ACTIVE }, as: SiteCoordinator, as_user_id: "${coord_id}" }
            - { call: "POST /taxpayers", payload: { full_name: "Tp Init", ssn_token: "SSN-I1", phone: "555-2007" }, as: Screener, as_user_id: "${scr_id}", captures: { tp_id: $.data.id } }
            - { call: "POST /taxpayers/${tp_id}/verify-identity", payload: { id_document_type: PASSPORT }, as: Screener, as_user_id: "${scr_id}" }
            - { call: "POST /appointments", payload: { site_id: "${site_id}", taxpayer_id: "${tp_id}", volunteer_id: "${prep_id}", purpose: PREPARATION, start_at: "2026-08-03T10:00:00Z", end_at: "2026-08-03T11:00:00Z" }, as: Screener, as_user_id: "${scr_id}", captures: { appt_id: $.data.id } }
            - { call: "POST /appointments/${appt_id}/state", payload: { to_status: CHECKED_IN }, as: Screener, as_user_id: "${scr_id}" }
            - { call: "POST /tax-returns", payload: { appointment_id: "${appt_id}", tax_year: 2025, filing_status: SINGLE }, as: Preparer, as_user_id: "${prep_id}", captures: { ret_id: $.data.id } }
          trigger:
            - { call: "GET /tax-returns/${ret_id}", as: Preparer, as_user_id: "${prep_id}", captures: { st: $.data.status, fin: $.data.final_refund_cents, sub: $.data.submission_count, rp: $.data.reached_preparation, dc: $.data.documents_complete, oos: $.data.out_of_scope } }
          assert:
            - "status == INTAKE_STARTED; final_refund_cents IS null; submission_count == 0"
            - "reached_preparation == false; documents_complete == false; out_of_scope == false"
            - "taxpayer_id and site_id were copied from the appointment; preparer_id == ${prep_id}"

      - name: transmit_from_intake_rejected
        claim_type: invalid_transition
        grounds: [state_machines.TaxReturn, "errors[ERR_INVALID_TRANSITION]"]
        distinguishing_aspect: "TRANSMITTED is unreachable directly from INTAKE_STARTED: the lifecycle enforces intake -> preparation -> quality review -> transmit ordering."
        test_recipe:
          setup: ["certified OPEN site; return in INTAKE_STARTED"]
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "Library VITA", sponsor_org: "UnitedWay", station_capacity: 4, season_start: "2026-07-01T00:00:00Z", season_end: "2026-12-31T23:59:59Z", daily_open_hour: 9, daily_close_hour: 17, goal_returns: 50 }, as: SponsorAdmin, captures: { site_id: $.data.id } }
            - { call: "POST /volunteers", payload: { site_id: "${site_id}", full_name: "Coord Ann", email: "coord@x.org", is_coordinator: true }, as: SponsorAdmin, captures: { coord_id: $.data.id, coord_v: $.data.version } }
            - { call: "POST /volunteers/${coord_id}/certifications", payload: { test_type: ETHICS, score: 95, tax_season: 2026, expected_volunteer_version: "${coord_v}" }, as: SponsorAdmin }
            - { call: "POST /volunteers/${coord_id}/state", payload: { to_status: ACTIVE }, as: SponsorAdmin }
            - { call: "POST /sites/${site_id}/state", payload: { to_status: CERTIFIED }, as: SiteCoordinator, as_user_id: "${coord_id}" }
            - { call: "POST /sites/${site_id}/state", payload: { to_status: OPEN }, as: SiteCoordinator, as_user_id: "${coord_id}" }
            - { call: "POST /volunteers", payload: { site_id: "${site_id}", full_name: "Screen Sam", email: "scr@x.org" }, as: SiteCoordinator, as_user_id: "${coord_id}", captures: { scr_id: $.data.id } }
            - { call: "POST /volunteers", payload: { site_id: "${site_id}", full_name: "Prep Pat", email: "prep@x.org" }, as: SiteCoordinator, as_user_id: "${coord_id}", captures: { prep_id: $.data.id, prep_v: $.data.version } }
            - { call: "POST /volunteers/${prep_id}/certifications", payload: { test_type: ETHICS, score: 90, tax_season: 2026, expected_volunteer_version: "${prep_v}" }, as: SiteCoordinator, as_user_id: "${coord_id}" }
            - { call: "GET /volunteers/${prep_id}", as: SiteCoordinator, as_user_id: "${coord_id}", captures: { prep_v2: $.data.version } }
            - { call: "POST /volunteers/${prep_id}/certifications", payload: { test_type: BASIC, score: 88, tax_season: 2026, expected_volunteer_version: "${prep_v2}" }, as: SiteCoordinator, as_user_id: "${coord_id}" }
            - { call: "POST /volunteers/${prep_id}/state", payload: { to_status: ACTIVE }, as: SiteCoordinator, as_user_id: "${coord_id}" }
            - { call: "POST /taxpayers", payload: { full_name: "Tp T1", ssn_token: "SSN-T1", phone: "555-2008" }, as: Screener, as_user_id: "${scr_id}", captures: { tp_id: $.data.id } }
