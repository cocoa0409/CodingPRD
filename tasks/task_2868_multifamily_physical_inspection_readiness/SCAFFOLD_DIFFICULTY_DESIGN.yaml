      - name: cascade_b_granted_technical_appeal_void_rewrites_score_and_posture
        grounds:
          - state_machines.Appeal.SUBMITTED_to_GRANTED
          - state_machines.Deficiency.OPEN_to_VOIDED
          - state_machines.Inspection.APPEALED_to_SCORED
          - calculations.inspection_score
          - calculations.property_readiness_posture
          - entities.Property.fields.last_final_score
        distinguishing_aspect: |
          One appeal review propagates through four entities: Appeal GRANTED (link 1) ->
          the contested Deficiency VOIDED with points_deducted forced to 0.00 (link 2) ->
          the Inspection recomputes area points and BOTH score variants and returns
          APPEALED -> SCORED with rescored_at set (link 3) -> Property.last_final_score is
          rewritten from 50.0 to 60.0, which lifts readiness_posture WATCH -> READY because
          the WATCH_SCORE_FLOOR test is a strict `< 60.00` (link 4). Nothing in the request
          names the Inspection or the Property.
        test_recipe:
          setup:
            - "ADOPTED NSPIRE-2026 standard with LT_GAS plus MOD_HEAVY (UNIT, MODERATE, base_point_value 40.00, 720h), so each MOD_HEAVY deduction is exactly 40.00 and SEVERE counts never reach the WATCH floor of 5."
            - "Property Cedar Walk with total_unit_count 1 and unit 101, so sample_size is 1 and no refusal is in play."
            - "Three MOD_HEAVY deficiencies on unit 101 give unit_raw 120.00, unit_area_score 0.00 and provisional_score == final_score == 50.0, so Property.last_final_score 50.0 puts the property in WATCH."
            - "A TECHNICAL_ERROR appeal contesting the third deficiency is filed inside the appeal window and is about to be granted."
