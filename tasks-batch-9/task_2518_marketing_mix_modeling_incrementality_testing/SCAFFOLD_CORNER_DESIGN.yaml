      - name: budget_optimization_ceiling_and_floor_constraint_binding
        claim_type: waterfall_allocation
        grounds:
          - "calculations.budget_optimization variants CEILING_BOUND and FLOOR_BOUND"
          - "entities.BudgetAllocation.constraint_binding - one of {NONE, FLOOR, CEILING}"
          - "entities.MediaChannel.min_spend_cents and max_spend_cents"
          - "global_constants.MARGINAL_STEP_CENTS 100000 and the two-pass waterfall whose fee is pinned by pass 1"
        distinguishing_aspect: |
          A binding channel bound stops the waterfall mid-fill and stamps the reason on the row: with
          A_SEARCH capped at 2000000 the greedy pass parks A at its ceiling (constraint_binding CEILING)
          and spills the rest to B_SOCIAL, while with B_SOCIAL floored at 1800000 the same budget leaves B
          pinned at its floor (constraint_binding FLOOR) - and in both cases the reallocation fee stays the
