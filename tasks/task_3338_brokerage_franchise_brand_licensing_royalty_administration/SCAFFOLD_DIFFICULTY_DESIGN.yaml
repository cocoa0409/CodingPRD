          setup:
            - "Brand B4 with three brokerages BR-A BR-B BR-C each holding an ACTIVE B4 agreement in distinct markets; council C4 seat_count=5 with members [BR-A, BR-B, BR-C, BR-D, BR-E] (BR-D, BR-E also B4 agreement holders in distinct markets)"
