            - "GET /compliance/penalty-ledger-entries/${rev} -> data.signed_amount_cents == -30000, data.reverses_entry_id == ${acc}, data.posted_by_user_id == \"auditor-1\""

      - name: accrual_reversed_twice_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=35]
          - errors[ERR_ENTRY_ALREADY_REVERSED]
        distinguishing_aspect: "An ACCRUAL may be reversed at most once: the second reverse of the SAME accrual is refused 409 ERR_ENTRY_ALREADY_REVERSED (not ERR_NOT_REVERSIBLE_ENTRY, which is about the entry's own kind), and no third entry is appended, so exposure stays 0 instead of going to -30000."
        test_recipe:
          setup:
            - "ACTIVE PlanYear PY2027 with a GAG_CLAUSE accrual of 30000 posted on 2027-05-01 and reversed once by auditor-1."
          setup_api_calls:
            - call: "POST /compliance/_clock/set_current_utc"
              payload: { current_utc: "2027-05-01T09:00:00Z" }
              as: PlatformOperator
            - call: "POST /compliance/plan-years"
              payload: { sponsor_name: "Meridian Manufacturing Benefit Plan", plan_year_label: "PY2027", start_date: "2027-01-01", end_date: "2027-12-31", covered_lives: 6000, attestation_deadline_date: "2028-01-31", rxdc_deadline_date: "2028-06-01" }
              as: PlanSponsorAdmin
              captures: { py: "$.data.id" }
            - call: "POST /compliance/vendors"
              payload: { legal_name: "Cascade Health Administrators", vendor_type: "TPA", contact_email: "ops@cascade.example" }
              as: PlanSponsorAdmin
              captures: { v_tpa: "$.data.id" }
            - call: "POST /compliance/contracts"
              payload: { plan_year_id: "${py}", vendor_id: "${v_tpa}", contract_type: "TPA", term_start: "2027-01-01", term_end: "2028-01-01", annual_fee_cents: 48000000 }
              as: PlanSponsorAdmin
              captures: { c_tpa: "$.data.id" }
            - call: "POST /compliance/plan-years/${py}/activate"
              payload: {}
              as: PlanSponsorAdmin
            - call: "POST /compliance/contracts/${c_tpa}/gag-review"
              payload: { clause_inventory_count: 40, prohibited_clause_count: 1 }
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /compliance/contracts/${c_tpa}/escalate-gag"
              payload: { escalation_note: "Clause not removed." }
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "GET /compliance/penalty-ledger-entries?plan_year_id=${py}&entry_type=ACCRUAL"
              payload: {}
              as: ExternalAuditor
              as_user_id: "auditor-1"
              captures: { acc: "$.data[0].id" }
            - call: "POST /compliance/penalty-ledger-entries/${acc}/reverse"
              payload: { reason: "First and only permitted reversal." }
              as: ExternalAuditor
              as_user_id: "auditor-1"
          trigger:
            - call: "POST /compliance/penalty-ledger-entries/${acc}/reverse"
              payload: { reason: "Second reversal of the same accrual." }
              as: ExternalAuditor
              as_user_id: "auditor-1"
          assert:
            - "response HTTP status == 409 and response data.error_id == \"ERR_ENTRY_ALREADY_REVERSED\""
            - "GET /compliance/penalty-ledger-entries?plan_year_id=${py} -> exactly 2 entries and GET /compliance/plan-years/${py} -> data.penalty_exposure_cents == 0"
            - "GET /compliance/penalty-ledger-entries/${acc} -> data.signed_amount_cents == 30000 (the original entry was never mutated)"

      - name: mrf_create_on_frozen_plan_year_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=9]
          - errors[ERR_PLAN_YEAR_FROZEN]
        distinguishing_aspect: "An operator freeze blocks ordinary child mutations (MRF publication is refused 409 ERR_PLAN_YEAR_FROZEN) while the declared exemptions still work: creating a RemediationPlan and recording its milestones succeed on the same frozen plan year."
        test_recipe:
          setup:
            - "ACTIVE PlanYear PY2027 with one TPA contract, frozen by auditor-1 with reason \"DOL audit hold\"; clock at 2027-04-01T09:00:00Z."
          setup_api_calls:
            - call: "POST /compliance/_clock/set_current_utc"
              payload: { current_utc: "2027-04-01T09:00:00Z" }
