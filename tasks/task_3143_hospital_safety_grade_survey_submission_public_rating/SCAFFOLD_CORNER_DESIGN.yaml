  # ===========================================================================
  - section: errors
    instances:

      - name: hospital_not_found_error_is_triggerable_and_shaped_per_envelope
        claim_type: triggerable
        grounds:
          - errors.ERR_HOSPITAL_NOT_FOUND
          - endpoints.GET_/hospital-safety-rating/hospitals/{id}
          - response_envelope.error
        distinguishing_aspect: "ERR_HOSPITAL_NOT_FOUND is reachable from a read path and its body matches the fixed error envelope exactly, with response_type error and both error_id and message present."
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z. No hospital has been registered."
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "GET /hospital-safety-rating/hospitals/00000000-0000-4000-8000-000000000021"
              payload: {}
              as: AnyAuthenticated
              as_user_id: "pa-lin"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 404"
            - "the body carries response_type == error and data.error_id == ERR_HOSPITAL_NOT_FOUND"
            - "data.message is a non-empty string"
            - "meta.api_request_id and meta.api_request_timestamp are present on the error response"

      - name: missing_user_context_header_is_rejected_before_any_business_tier
        claim_type: triggerable
        grounds:
          - validations[priority=1]
          - errors.ERR_MISSING_USER_CONTEXT_HEADER
          - endpoints.POST_/hospital-safety-rating/hospitals
        distinguishing_aspect: "A mutation with no X-User-Role is refused at priority 1 with 400 ERR_MISSING_USER_CONTEXT_HEADER before the duplicate-ccn, role or existence tiers can run."
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z. Hospital C0 already holds ccn 261000, so a duplicate-ccn conflict is also queued."
          setup_api_calls:
            - *c_clock
            - *c_hp0
          trigger:
            - call: "POST /hospital-safety-rating/hospitals"
              payload: { name: "C0 Duplicate Hospital", ccn: "261000", state_code: "MO", bed_count: 40, teaching_status: "NON_TEACHING", annual_discharges: 500, survey_contact_email: "dup@example.org" }
              as: Anonymous
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 400 and error_id == ERR_MISSING_USER_CONTEXT_HEADER"
            - "error_id != ERR_DUPLICATE_CCN, even though the ccn is already taken"
            - "GET /hospital-safety-rating/hospitals?state_code=MO returns exactly 1 row"

      - name: duplicate_ccn_error_is_triggerable_and_not_a_generic_conflict
        claim_type: triggerable
        grounds:
          - errors.ERR_DUPLICATE_CCN
          - entities.Hospital.fields.ccn
        distinguishing_aspect: "ERR_DUPLICATE_CCN is a domain-specific 409 rather than a shared ERR_INVALID_REQUEST, so a client can distinguish a uniqueness clash from a malformed body."
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z. Hospital C0 already holds ccn 261000."
          setup_api_calls:
            - *c_clock
            - *c_hp0
          trigger:
            - call: "POST /hospital-safety-rating/hospitals"
              payload: { name: "C0 Clone Hospital", ccn: "261000", state_code: "MO", bed_count: 40, teaching_status: "NON_TEACHING", annual_discharges: 500, survey_contact_email: "clone@example.org" }
              as: RatingAdmin
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_DUPLICATE_CCN"
            - "error_id != ERR_INVALID_REQUEST"
            - "Hospital.${p0_id}.name is still C0 Community Hospital, so the clash did not overwrite the incumbent"

      - name: invalid_minimum_letter_error_is_triggerable
        claim_type: triggerable
        grounds:
          - errors.ERR_INVALID_MINIMUM_LETTER
          - entities.Employer.fields.minimum_acceptable_letter
          - validations[priority=4]
        distinguishing_aspect: "An out-of-enum minimum_acceptable_letter of E is refused as a 400 ERR_INVALID_MINIMUM_LETTER rather than silently coerced to F."
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z. Empty database."
