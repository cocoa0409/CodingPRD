  - { method: GET, path: "/api/substitution-requests/{id}", description: "Read a single substitution request", roles: [PlatformAdmin, FactoryOps, CustomerUser, AccountManager], code: 200, input: [], output: SubstitutionRequest, side_effects: [] }
  - { method: GET, path: "/api/substitution-requests", description: "Filtered substitution-request list", roles: [PlatformAdmin, FactoryOps], code: 200, input: ["original_component_id?", "proposed_component_id?"], output: "SubstitutionRequest[]", side_effects: [] }
  - { method: POST, path: "/api/substitution-requests/{id}/approve", description: "Customer approves substitution; job returns to QUEUED", roles: [CustomerUser], code: 200, input: [], output: SubstitutionRequest, side_effects: ["job SHORTAGE_BLOCKED -> QUEUED; order.total_cents += price_delta * qty"] }
  - { method: POST, path: "/api/substitution-requests/{id}/reject", description: "Customer rejects; job stays blocked", roles: [CustomerUser], code: 200, input: [], output: SubstitutionRequest, side_effects: [] }
  - { method: POST, path: "/api/substitution-requests/{id}/repropose", description: "Ops proposes a different component (REJECTED -> PENDING, round += 1)", roles: [FactoryOps], code: 200, input: [proposed_component_id], output: SubstitutionRequest, side_effects: ["round += 1; price_delta_cents recomputed"] }
  - { method: POST, path: "/api/orders/{id}/deployment-waves", description: "Plan a staged drop-ship wave with employee destinations", roles: [AccountManager], code: 201, input: [wave_label, ship_window_start, ship_window_end, destinations], output: DeploymentWave, side_effects: [] }
  - { method: GET, path: "/api/orders/{id}/deployment-waves", description: "List waves of an order", roles: [PlatformAdmin, AccountManager, CustomerUser, FactoryOps], code: 200, input: [], output: "DeploymentWave[]", side_effects: [] }
  - { method: POST, path: "/api/deployment-waves/{id}/release", description: "Release wave after order BUILT; overlap-checked", roles: [AccountManager], code: 200, input: [], output: DeploymentWave, side_effects: ["order ship_status PENDING -> STAGED"] }
  - { method: POST, path: "/api/deployment-waves/{id}/ship", description: "Ship wave within its window; assets -> IN_TRANSIT", roles: [FactoryOps], code: 200, input: [], output: DeploymentWave, side_effects: ["Assets STAGED -> IN_TRANSIT"] }
  - { method: POST, path: "/api/deployment-waves/{id}/receive", description: "Customer confirms receipt; assets -> DELIVERED", roles: [CustomerUser], code: 200, input: [], output: DeploymentWave, side_effects: ["Assets IN_TRANSIT -> DELIVERED; on final wave order ship_status -> DELIVERED and outstanding_cents settled"] }
  - { method: POST, path: "/api/deployment-waves/{id}/cancel", description: "Cancel a PLANNED wave", roles: [AccountManager], code: 200, input: [], output: DeploymentWave, side_effects: [] }
  - { method: GET, path: "/api/order-lines/{id}/assets", description: "List assets of a line (serial numbers)", roles: [PlatformAdmin, AccountManager, CustomerUser, FactoryOps], code: 200, input: [], output: "Asset[]", side_effects: [] }
  - { method: GET, path: "/api/assets/{id}", description: "Read a single asset", roles: [PlatformAdmin, AccountManager, CustomerUser, FactoryOps], code: 200, input: [], output: Asset, side_effects: [] }
  - { method: GET, path: "/api/assets", description: "Filtered asset list", roles: [PlatformAdmin, AccountManager, FactoryOps], code: 200, input: ["order_line_id?", "status?"], output: "Asset[]", side_effects: [] }
  - { method: GET, path: "/api/orders/{id}/asset-report", description: "Serial number -> PO mapping report for the customer's asset management system", roles: [AccountManager, CustomerUser, PlatformAdmin], code: 200, input: [], output: "{ po_number: string, rows: Array<{ serial_number: string, asset_tag: string, order_line_id: string, destination_employee_ref: string|null, asset_status: string }> }", side_effects: [] }
  - { method: POST, path: "/api/order-lines/{id}/support-entitlements", description: "Attach support tier to a line; SERVER + ONSITE_4H requires parts stocking", roles: [AccountManager], code: 201, input: [tier, coverage_start, coverage_end, "parts_stocking_required?", "reserved_part_component_id?"], output: SupportEntitlement, side_effects: ["when parts_stocking_required: component.reserved_units += 1"] }
  - { method: GET, path: "/api/order-lines/{id}/support-entitlements", description: "List entitlements of a line", roles: [PlatformAdmin, AccountManager, CustomerUser], code: 200, input: [], output: "SupportEntitlement[]", side_effects: [] }
  - { method: GET, path: "/api/support-entitlements", description: "Filtered entitlement list", roles: [PlatformAdmin, AccountManager], code: 200, input: ["order_line_id?", "tier?", "reserved_part_component_id?"], output: "SupportEntitlement[]", side_effects: [] }
  - { method: GET, path: "/api/support-entitlements/{id}", description: "Read a single entitlement", roles: [PlatformAdmin, AccountManager, CustomerUser], code: 200, input: [], output: SupportEntitlement, side_effects: [] }
  - { method: POST, path: "/api/support-entitlements/{id}/cancel", description: "Cancel an ACTIVE entitlement; releases the reserved stocked part", roles: [AccountManager], code: 200, input: [], output: SupportEntitlement, side_effects: ["status ACTIVE -> CANCELLED; when parts_stocking_required: reserved_part component.reserved_units -= 1"] }
  - { method: POST, path: "/api/asset-recovery-requests", description: "Initiate EOL recycling or recovery for a delivered asset", roles: [CustomerUser], code: 201, input: [account_id, asset_id, program_kind], output: AssetRecoveryRequest, side_effects: [] }
  - { method: GET, path: "/api/accounts/{id}/asset-recovery-requests", description: "List recovery requests of an account", roles: [PlatformAdmin, AccountManager, CustomerUser], code: 200, input: [], output: "AssetRecoveryRequest[]", side_effects: [] }
  - { method: GET, path: "/api/asset-recovery-requests/{id}", description: "Read a single recovery request", roles: [PlatformAdmin, AccountManager, CustomerUser], code: 200, input: [], output: AssetRecoveryRequest, side_effects: [] }
  - { method: GET, path: "/api/asset-recovery-requests", description: "Filtered recovery-request list", roles: [PlatformAdmin, AccountManager], code: 200, input: ["asset_id?", "account_id?", "status?"], output: "AssetRecoveryRequest[]", side_effects: [] }
  - { method: POST, path: "/api/asset-recovery-requests/{id}/issue-label", description: "Issue return label; computes estimated credit", roles: [PlatformAdmin], code: 200, input: [], output: AssetRecoveryRequest, side_effects: ["asset -> RECOVERY_REQUESTED; estimated_credit_cents computed"] }
  - { method: POST, path: "/api/asset-recovery-requests/{id}/receive", description: "Receive and grade returned unit; computes final credit", roles: [PlatformAdmin], code: 200, input: [grade], output: AssetRecoveryRequest, side_effects: ["final_credit_cents computed from grade"] }
  - { method: POST, path: "/api/asset-recovery-requests/{id}/credit", description: "Post final credit to account (RESALE_CREDIT only)", roles: [PlatformAdmin], code: 200, input: [], output: AssetRecoveryRequest, side_effects: ["account.recovery_credit_cents += final_credit_cents; asset -> RECOVERED"] }
  - { method: POST, path: "/api/asset-recovery-requests/{id}/recycle", description: "Recycle unit (RECYCLE only)", roles: [PlatformAdmin], code: 200, input: [], output: AssetRecoveryRequest, side_effects: ["asset -> RECOVERED"] }
  - { method: POST, path: "/api/asset-recovery-requests/{id}/cancel", description: "Cancel an INITIATED recovery request", roles: [CustomerUser], code: 200, input: [], output: AssetRecoveryRequest, side_effects: [] }
  - { method: POST, path: "/api/_clock/set_current_utc", description: "Test-driving logical clock. Server default at startup is exactly 2026-09-01T00:00:00Z and MUST NOT fall back to wall-clock; this endpoint sets the logical time used by ship windows, lead time math, and SLA cutoffs.", roles: [PlatformAdmin], code: 200, input: [to_iso8601], output: "{ current_utc: string }", side_effects: [] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or malformed X-User-Role / X-User-ID headers" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for the endpoint, or entity_backed ownership mismatch (CustomerUser acting on another account's resource)" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path-referenced resource does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Required field missing, wrong type, or unknown enum member" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Transition undefined from the resource's current state" }
  - { id: ERR_STALE_CONFIGURATION_VERSION, http: 412, condition: "expected_configuration_version does not match the referenced configuration's current version on order submit" }
  - { id: ERR_STALE_COMPONENT_VERSION, http: 412, condition: "expected_component_version does not match the component's current version on restock" }
  - { id: ERR_COMPATIBILITY_VIOLATION, http: 422, condition: "Component selections violate an ALLOWED/REQUIRES/EXCLUDES/MIN_QTY rule for the chassis" }
  - { id: ERR_COMPONENT_EOL, http: 422, condition: "Selected component or chassis is end-of-life" }
  - { id: ERR_PROGRAM_LOCK_VIOLATION, http: 422, condition: "Lock attempted while program not LOCKED or pinned template revisions missing from selections" }
  - { id: ERR_CONFIGURATION_IN_USE, http: 409, condition: "Unlock/supersede blocked because a live Order references the configuration" }
  - { id: ERR_CREDIT_LIMIT_EXCEEDED, http: 402, condition: "outstanding_cents + order total would exceed account credit limit" }
  - { id: ERR_INSUFFICIENT_COMPONENT_STOCK, http: 422, condition: "available_units < required qty for a required component at allocation (exact fit at >= is allowed)" }
  - { id: ERR_BUILD_OUT_OF_SEQUENCE, http: 422, condition: "start attempted on an ALLOCATED job that is not the min sequence_rank in its factory queue" }
  - { id: ERR_WAVE_WINDOW_OVERLAP, http: 422, condition: "Wave [start,end) intersects another live wave of the same order (half-open; touching endpoints allowed)" }
  - { id: ERR_OUTSIDE_SHIP_WINDOW, http: 422, condition: "Ship attempted when logical clock is outside [ship_window_start, ship_window_end)" }
  - { id: ERR_SUBSTITUTION_INCOMPATIBLE, http: 422, condition: "Proposed component fails chassis compatibility or duplicates the rejected/original component" }
  - { id: ERR_PARTS_STOCKING_REQUIRED, http: 422, condition: "ONSITE_4H entitlement on SERVER chassis without parts stocking or without reservable part stock" }
  - { id: ERR_ENTITLEMENT_OVERLAP, http: 422, condition: "Closed-interval entitlement window duplicates an ACTIVE entitlement for same line and tier" }
  - { id: ERR_ASSET_NOT_RECOVERABLE, http: 422, condition: "Recovery requested for an asset not in DELIVERED status" }
  - { id: ERR_INVALID_ORDER_QUANTITY, http: 422, condition: "Line qty < 1, or drop-ship destination units do not sum to line qty" }
  - { id: ERR_SHORTAGE_PENDING, http: 409, condition: "Order-level action attempted while a SHORTAGE_BLOCKED job with a PENDING substitution exists" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Manufacturer-side administrator: catalog, chassis, components, compatibility rules, recovery processing, clock"
    identity: opaque
    exclusive_operations: [create account, create chassis-model, create component, restock component, create compatibility-rule, issue-label/receive/credit/recycle recovery requests, set clock]
    shared_operations: [read any resource]
  - name: AccountManager
    description: "Manufacturer account-team member: programs, templates, configuration locks, deployment waves, entitlements"
    identity: opaque
    exclusive_operations: [create/lock program, create/publish template, lock/unlock configuration, plan/release/cancel deployment wave, create support entitlement]
    shared_operations: [read account/order/asset data]
  - name: CustomerUser
    description: "Enterprise buyer acting for their own account; X-User-ID equals CustomerAccount.id"
    identity: entity_backed:CustomerAccount
    exclusive_operations: [create configuration (as buyer), validate configuration, create order, add order line, submit/cancel order, approve/reject substitution, receive wave, create/cancel recovery request]
    shared_operations: [read own account/orders/assets/reports]
  - name: FactoryOps
    description: "Factory operator: allocation, build sequencing, completion, substitution proposals, wave shipment"
    identity: opaque
    exclusive_operations: [allocate/start/complete build job, repropose substitution, ship wave]
    shared_operations: [read components, orders, build jobs, assets]
