    input: [film_id, circuit, aggregate_rental_pct, min_screens, aggregate_house_allowance_cents]
    output: AggregateDeal
    side_effects: ["deal_status=DRAFT"]

  - method: GET
    path: "/distributors/{did}/aggregate-deals/{aid}"
    description: "Read AggregateDeal"
    roles: [PlatformAdmin, Booker, SettlementClerk, Auditor]
    code: 200
    input: []
    output: AggregateDeal
    side_effects: []

  - method: GET
    path: "/distributors/{did}/aggregate-deals"
    description: "List AggregateDeals"
    roles: [PlatformAdmin, Booker, SettlementClerk, Auditor]
    code: 200
    input: ["limit?", "offset?", "film_id?", "circuit?", "deal_status?", "distributor_id?"]
    output: "AggregateDeal[]"
    side_effects: []

  - method: POST
    path: "/distributors/{did}/aggregate-deals/{aid}/activate"
    description: "Activate aggregate deal (requires min_screens participating)"
    roles: [Booker]
    code: 200
    input: []
    output: AggregateDeal
    side_effects: ["deal_status → ACTIVE when min_screens participating agreements are ACCEPTED/IN_PLAY"]

  # --- BookingAgreement ---
  - method: POST
    path: "/distributors/{did}/booking-agreements"
    description: "Propose a new BookingAgreement"
    roles: [Booker]
    code: 201
    input: [film_id, theatre_id, screen_id, opening_date, min_weeks_committed, week_one_rental_pct, rental_decay_per_week, floor_pct, per_capita_floor_cents, "aggregate_deal_id?"]
    output: BookingAgreement
    side_effects: ["deal_status=PROPOSED, print_status=NOT_ORDERED, weeks_played=0"]

  - method: GET
    path: "/distributors/{did}/booking-agreements/{baid}"
    description: "Read BookingAgreement"
    roles: [PlatformAdmin, Booker, Exhibitor, SettlementClerk, MarketingLead, Auditor]
    code: 200
    input: []
    output: BookingAgreement
    side_effects: []

  - method: GET
    path: "/distributors/{did}/booking-agreements"
    description: "List BookingAgreements (filtered)"
    roles: [PlatformAdmin, Booker, Exhibitor, SettlementClerk, MarketingLead, Auditor]
    code: 200
    input: ["limit?", "offset?", "film_id?", "theatre_id?", "screen_id?", "aggregate_deal_id?", "deal_status?", "print_status?"]
    output: "BookingAgreement[]"
    side_effects: []

  - method: POST
    path: "/distributors/{did}/booking-agreements/{baid}/counter"
    description: "Counter-offer (negotiation round); cyclic between PROPOSED and COUNTERED"
    roles: [Booker, Exhibitor]
    code: 200
    input: [expected_booking_agreement_version, week_one_rental_pct, rental_decay_per_week, floor_pct, per_capita_floor_cents]
    output: BookingAgreement
    side_effects: ["deal_status toggles PROPOSED↔COUNTERED; increments BookingAgreement.version by 1"]

  - method: POST
    path: "/distributors/{did}/booking-agreements/{baid}/accept"
    description: "Accept the current terms; locks deal and triggers DCP shipment creation"
    roles: [Booker, Exhibitor]
    code: 200
    input: [expected_booking_agreement_version]
    output: BookingAgreement
    side_effects:
      - "deal_status → ACCEPTED"
      - "Screen.status → BOOKED"
      - "Film.screens_committed += 1"
      - "Auto-create DCPShipment (QUEUED)"
      - "BookingAgreement.print_status → DCP_QUEUED"
      - "increments BookingAgreement.version by 1"

  - method: POST
    path: "/distributors/{did}/booking-agreements/{baid}/decline"
    description: "Decline the offer"
    roles: [Booker, Exhibitor]
    code: 200
    input: []
    output: BookingAgreement
    side_effects: ["deal_status → DECLINED"]

  - method: POST
    path: "/distributors/{did}/booking-agreements/{baid}/cancel"
    description: "Cancel the agreement (only from PROPOSED/COUNTERED/ACCEPTED)"
    roles: [Booker]
    code: 200
    input: []
    output: BookingAgreement
    side_effects: ["deal_status → CANCELLED; reverse side effects (screen freed, screens_committed decremented, DCP returned, KDM revoked)"]

  - method: POST
    path: "/distributors/{did}/booking-agreements/{baid}/holdover"
    description: "Manual holdover (Booker decides to extend another week)"
    roles: [Booker]
    code: 200
    input: [rationale]
    output: BookingAgreement
    side_effects: ["deal_status → HELD_OVER; creates HoldoverDecision decision=HOLD"]

  - method: POST
    path: "/distributors/{did}/booking-agreements/{baid}/holdover_release"
