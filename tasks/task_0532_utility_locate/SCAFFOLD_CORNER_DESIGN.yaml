        test_recipe:
          setup: ["Two members A,B; ticket routed to A only; B attempts to answer A's notification."]
          setup_api_calls:
            - call: "POST /excavators"
              payload: { company_name: "DigCo", contact_email: "c23@x.com", state_code: "CA" }
              as: CallCenter
