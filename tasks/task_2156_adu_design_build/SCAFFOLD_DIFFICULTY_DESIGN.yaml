  # =====================================================================
  # Rule 8 — resource temporal-overlap conflicts, different interval semantics
  # =====================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: phase_window_closed_interval_with_habitability_buffer
        grounds:
          - validations[priority=66]
          - errors[ERR_PHASE_WINDOW_CONFLICT]
          - entities.ConstructionPhase.fields.window_start_date
          - entities.Property.fields.occupied
        distinguishing_aspect: |
          Interval semantics A — CLOSED day intervals on the PROPERTY resource with a
          two-day habitability buffer because Property.occupied is true. A window starting
          2026-09-07, a full day after the incumbent window ends on 2026-09-05, is still
          rejected; only 2026-09-08 onward clears the buffer. Adjacency and near-adjacency
          both collide.
        test_recipe:
          setup:
            - "Property P1 in SNVL with occupied == true, so HABITABILITY_BUFFER_DAYS is 2."
            - "AduProject A on P1 at status PERMITTED."
            - "ConstructionPhase F (FOUNDATION, INVASIVE) SCHEDULED for 2026-09-01 through 2026-09-05."
            - "ConstructionPhase R (FRAMING, INVASIVE) still PLANNED."
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "Sunnyvale", code: "SNVL", local_max_detached_sqft: 750, local_rear_setback_ft: 10.0, local_side_setback_ft: 5.0, local_max_height_ft: 14.0, plan_check_base_fee_cents: 185025, plan_check_rate_per_sqft_cents: 137, impact_fee_per_sqft_cents: 1250, utility_capacity_fee_cents: 415000, correction_response_days: 60, separate_meter_required: true, str_min_lease_days: 30, str_prohibited: false }
