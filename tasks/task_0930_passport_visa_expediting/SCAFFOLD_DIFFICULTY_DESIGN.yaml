              as: PlatformAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /expediting/orders"
              payload: { catalog_item_id: "${cat_id}", travel_date: "2026-09-01", return_date: "2026-09-20", delivery_region_code: "CA", service_level: "STANDARD" }
              as: CaseManager
              as_user_id: "cm-quote"
              captures: { ord_id: $.data.id }
            - call: "POST /expediting/orders/${ord_id}/applicants"
              payload: { full_name: "Empty Set", date_of_birth: "1990-03-04", nationality_code: "US", residence_region_code: "CA" }
              as: CaseManager
              as_user_id: "cm-quote"
              captures: { ap_id: $.data.id }
            - call: "POST /expediting/applicants/${ap_id}/photos"
              payload: { taken_on: "2026-05-20", head_height_ratio: 0.60, background_code: "WHITE", resolution_px: 800 }
              as: CaseManager
              as_user_id: "cm-quote"
              captures: { ph_id: $.data.id }
            - call: "POST /expediting/photos/${ph_id}/compliance-check"
              payload: {}
              as: CaseManager
              as_user_id: "cm-review"
            - call: "GET /expediting/applicants/${ap_id}"
              payload: {}
              as: CaseManager
              as_user_id: "cm-quote"
              captures: { ap_v: $.data.version }
          trigger:
            - call: "POST /expediting/applicants/${ap_id}/prepared-forms"
              payload: { agency_form_id: "${form_v1_id}", filled_field_count: 12, expected_applicant_version: "${ap_v}" }
              as: CaseManager
              as_user_id: "cm-quote"
            - call: "GET /expediting/applicants/${ap_id}/required-documents"
