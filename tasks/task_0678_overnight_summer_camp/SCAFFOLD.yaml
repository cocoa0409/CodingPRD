# =============================================================================
# PRD-bench scaffold — Overnight / Sleepaway Summer Camp (Expert)
# =============================================================================

scenario: |
  Overnight / Sleepaway Summer Camp: session & cabin/bunk assignment, application
  & waitlist/deposit, health form & medication/allergy (infirmary), tuition &
  financial-aid/scholarship, activity/elective selection & scheduling,
  canteen/store account, transportation & visiting day, counselor/CIT staffing &
  ratio

domain_name: overnight-summer-camp
api_prefix: ""

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: posture_driven_gating
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - temporal_windowing
    - derived_field_reconciliation
  entity_topology: hybrid
  # Session→Cabin/ActivityOffering form a tree; Application/HealthForm/Camper and
  # the junction entities (CabinAssignment, ActivityEnrollment) cut across it.
  state_machine_shape: parallel
  # Application carries two independent axes (enroll_status × payment_status);
  # Session is posture_driven (ratio_posture gates child operations);
  # HealthForm/Application/ActivityEnrollment add branching + revert cycles.
  relationship_patterns:
    - one_to_many        # Session → Cabin, Session → ActivityOffering
    - many_to_many       # StaffMember ⇄ Cabin (CabinAssignment), Camper ⇄ ActivityOffering (ActivityEnrollment)
    - cross_aggregate    # Application references Camper + Session across the tree
  role_model: peer_roles
  # CampDirector owns config/sessions/cabins/staffing; Guardian owns campers,
  # applications, payments, activity & canteen actions for their own campers;
  # InfirmaryNurse owns health-form clearance; Anonymous registers guardians.
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — emitted verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Camp
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Camp name" }
      - { name: counselor_camper_ratio, type: integer, source: input, default: 6, description: "Max campers per qualified counselor a cabin may hold; ratio_posture is derived from it" }
      - { name: cit_counts_as_half, type: boolean, source: input, default: true, description: "If true a CIT (counselor-in-training) contributes 0.5 to a cabin's effective staff weight; a COUNSELOR contributes 1.0" }
      - { name: deposit_cents, type: integer, source: input, default: 25000, description: "Non-refundable deposit required to convert an OFFERED application to DEPOSIT_PAID" }
      - { name: deposit_grace_days, type: integer, source: input, default: 7, description: "Days an OFFERED application may sit before run_intake expires it back to the waitlist" }
      - { name: canteen_low_balance_cents, type: integer, source: input, default: 1000, description: "Canteen balance at or below which CanteenAccount.is_low becomes true" }

  - name: Session
    parent: Camp
    common_fields: true
    fields:
      - { name: camp_id, type: string, source: system, description: "FK -> Camp.id" }
      - { name: name, type: string, source: input, description: "Session label (e.g. Session A)" }
      - { name: starts_on, type: datetime, source: input, description: "Session start instant (ISO 8601 UTC)" }
      - { name: ends_on, type: datetime, source: input, description: "Session end instant (ISO 8601 UTC); must be strictly after starts_on" }
      - { name: visiting_day_on, type: datetime, source: input, description: "Visiting-day instant; must be within [starts_on, ends_on]" }
      - { name: enrollment_open, type: boolean, source: system, default: true, description: "Whether new applications may be submitted into this session" }
      - { name: capacity, type: integer, source: input, description: "Total camper beds across all cabins this session may enroll" }
      - { name: enrolled_count, type: integer, source: computed, default: 0, description: "Count of Applications for this session whose enroll_status == ENROLLED" }
      - { name: committed_count, type: integer, source: computed, default: 0, description: "Count of Applications whose enroll_status IN {OFFERED, DEPOSIT_PAID, ENROLLED} (seats held against capacity)" }
      - { name: waitlist_length, type: integer, source: computed, default: 0, description: "Count of Applications whose enroll_status == WAITLISTED" }
      - { name: ratio_posture, type: enum, source: computed, default: "UNDERSTAFFED", description: "STAFFED | MARGINAL | UNDERSTAFFED — derived from aggregate cabin staffing vs counselor_camper_ratio; gates enroll_status -> ENROLLED" }
      - { name: status, type: enum, source: system, default: "PLANNING", description: "PLANNING -> ENROLLING -> RUNNING -> CLOSED; constraints: {PLANNING, ENROLLING, RUNNING, CLOSED}" }

  - name: Cabin
    parent: Session
    common_fields: true
    fields:
      - { name: session_id, type: string, source: system, description: "FK -> Session.id" }
      - { name: name, type: string, source: input, description: "Cabin label (e.g. Birch)" }
      - { name: gender_band, type: enum, source: input, description: "BOYS | GIRLS | ALL; constraints: {BOYS, GIRLS, ALL}" }
      - { name: min_age, type: integer, source: input, description: "Lowest camper age (inclusive) this cabin accepts" }
      - { name: max_age, type: integer, source: input, description: "Highest camper age (inclusive) this cabin accepts; must be >= min_age" }
      - { name: bunk_capacity, type: integer, source: input, description: "Number of camper bunks in this cabin" }
      - { name: occupied_bunks, type: integer, source: computed, default: 0, description: "Count of Applications bunked here whose enroll_status IN {DEPOSIT_PAID, ENROLLED}" }
      - { name: staff_weight_x10, type: integer, source: computed, default: 0, description: "Effective staff weight times 10 (COUNSELOR=10, CIT=5 when cit_counts_as_half) summed over ACTIVE CabinAssignments here" }
      - { name: is_staffable, type: boolean, source: computed, default: false, description: "True when staff_weight_x10 covers occupied_bunks at counselor_camper_ratio" }

  - name: StaffMember
    parent: Camp
    common_fields: true
    fields:
      - { name: camp_id, type: string, source: system, description: "FK -> Camp.id" }
      - { name: full_name, type: string, source: input, description: "Staff member name" }
      - { name: role_kind, type: enum, source: input, description: "COUNSELOR | CIT; constraints: {COUNSELOR, CIT}" }
      - { name: is_background_cleared, type: boolean, source: input, default: false, description: "Whether the background check has cleared; only cleared staff may be assigned to a cabin" }

  - name: CabinAssignment
    parent: null
    common_fields: true
    fields:
      - { name: cabin_id, type: string, source: input, description: "FK -> Cabin.id" }
      - { name: staff_member_id, type: string, source: input, description: "FK -> StaffMember.id" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE -> RELEASED; constraints: {ACTIVE, RELEASED}" }

  - name: Camper
    parent: null
    common_fields: true
    fields:
      - { name: guardian_user_id, type: string, source: system, description: "FK -> Guardian.id; the guardian who owns this camper" }
      - { name: full_name, type: string, source: input, description: "Camper name" }
      - { name: age, type: integer, source: input, description: "Camper age in years at registration" }
      - { name: gender, type: enum, source: input, description: "BOY | GIRL; constraints: {BOY, GIRL}" }
      - { name: health_status, type: enum, source: computed, default: "NONE", description: "NONE | PENDING | CLEARED | FLAGGED — mirrors the camper's latest HealthForm.status; gates enrollment" }

  - name: Guardian
    parent: null
    common_fields: true
    fields:
      - { name: email, type: string, source: input, description: "Login email; unique across Guardians" }
      - { name: full_name, type: string, source: input, description: "Guardian name" }
      - { name: phone, type: string, source: input, description: "Contact phone" }

  - name: Application
    parent: null
    common_fields: true
    fields:
      - { name: camper_id, type: string, source: input, description: "FK -> Camper.id" }
      - { name: session_id, type: string, source: input, description: "FK -> Session.id" }
      - { name: cabin_id, type: string, source: system, description: "FK -> Cabin.id; the cabin this camper is bunked in once a bunk is assigned (null before assignment)" }
      - { name: enroll_status, type: enum, source: system, default: "DRAFT", description: "Enrollment axis: DRAFT -> SUBMITTED -> {WAITLISTED, OFFERED} -> DEPOSIT_PAID -> ENROLLED, plus WITHDRAWN; constraints: {DRAFT, SUBMITTED, WAITLISTED, OFFERED, DEPOSIT_PAID, ENROLLED, WITHDRAWN}" }
      - { name: payment_status, type: enum, source: computed, default: "UNBILLED", description: "Payment axis evolves independently of enroll_status: UNBILLED -> DEPOSIT_DUE -> DEPOSIT_SETTLED -> BALANCE_DUE -> PAID_IN_FULL, plus REFUND_DUE; constraints: {UNBILLED, DEPOSIT_DUE, DEPOSIT_SETTLED, BALANCE_DUE, PAID_IN_FULL, REFUND_DUE}" }
      - { name: submitted_at, type: datetime, source: system, description: "When the application was SUBMITTED; waitlist ordering key (earliest first)" }
      - { name: offer_expires_at, type: datetime, source: system, description: "Instant after which an OFFERED application expires; set on offer = clock + Camp.deposit_grace_days" }
      - { name: list_tuition_cents, type: integer, source: computed, default: 0, description: "Gross session tuition before aid, snapshotted from Session at submission" }
      - { name: aid_cents, type: integer, source: computed, default: 0, description: "Total approved FinancialAidAward.amount_cents applied to this application" }
      - { name: estimated_balance_cents, type: integer, source: computed, default: 0, description: "Forward-looking net tuition owed: list_tuition - aid - deposit_credit - sum(applied payments)" }
      - { name: settled_balance_cents, type: integer, source: computed, default: 0, description: "Chronological net owed: replays Payment and FinancialAidAward events in created_at order against list_tuition" }
      - { name: deposit_paid_cents, type: integer, source: computed, default: 0, description: "Deposit credited toward tuition once DEPOSIT_PAID" }

  - name: HealthForm
    parent: null
    common_fields: true
    fields:
      - { name: camper_id, type: string, source: input, description: "FK -> Camper.id" }
      - { name: has_life_threatening_allergy, type: boolean, source: input, default: false, description: "Whether the camper has any anaphylaxis-grade allergy" }
      - { name: epipen_on_file, type: boolean, source: input, default: false, description: "Whether an EpiPen is supplied to the infirmary" }
      - { name: daily_medication_count, type: integer, source: input, default: 0, description: "Number of daily scheduled medications the infirmary must administer" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT -> SUBMITTED -> {CLEARED, FLAGGED}; FLAGGED -> SUBMITTED on resubmit (revision loop); constraints: {DRAFT, SUBMITTED, CLEARED, FLAGGED}" }
      - { name: review_note, type: string, source: input, default: "", description: "Nurse note recorded on clear/flag" }

  - name: FinancialAidAward
    parent: null
    common_fields: true
    fields:
      - { name: application_id, type: string, source: input, description: "FK -> Application.id" }
      - { name: kind, type: enum, source: input, description: "NEED_GRANT | MERIT_SCHOLARSHIP; constraints: {NEED_GRANT, MERIT_SCHOLARSHIP}" }
      - { name: amount_cents, type: integer, source: input, description: "Requested award amount in cents" }
      - { name: status, type: enum, source: system, default: "REQUESTED", description: "REQUESTED -> {APPROVED, DENIED}, APPROVED -> REVOKED; constraints: {REQUESTED, APPROVED, DENIED, REVOKED}" }

  - name: Payment
    parent: null
    common_fields: true
    fields:
      - { name: application_id, type: string, source: input, description: "FK -> Application.id" }
      - { name: kind, type: enum, source: input, description: "DEPOSIT | BALANCE; constraints: {DEPOSIT, BALANCE}" }
      - { name: amount_cents, type: integer, source: input, description: "Payment amount in cents" }
      - { name: status, type: enum, source: system, default: "APPLIED", description: "APPLIED -> REVERSED; constraints: {APPLIED, REVERSED}" }

  - name: ActivityOffering
    parent: Session
    common_fields: true
    fields:
      - { name: session_id, type: string, source: system, description: "FK -> Session.id" }
      - { name: name, type: string, source: input, description: "Activity/elective name (e.g. Archery)" }
      - { name: slot_day, type: integer, source: input, description: "Day index within the session (1-based)" }
      - { name: starts_minute, type: integer, source: input, description: "Start as minute-of-day [0, 1440)" }
      - { name: ends_minute, type: integer, source: input, description: "End as minute-of-day; must be > starts_minute" }
      - { name: setup_buffer_minutes, type: integer, source: input, default: 0, description: "Minutes of changeover buffer after ends_minute during which a camper cannot start another offering" }
      - { name: seat_capacity, type: integer, source: input, description: "Camper seats in this offering" }
      - { name: requires_swim_test, type: boolean, source: input, default: false, description: "Whether enrollment requires the camper's HealthForm to be CLEARED (waterfront safety gate)" }
      - { name: seats_taken, type: integer, source: computed, default: 0, description: "Count of ActivityEnrollments here whose status == BOOKED" }

  - name: ActivityEnrollment
    parent: null
    common_fields: true
    fields:
      - { name: offering_id, type: string, source: input, description: "FK -> ActivityOffering.id" }
      - { name: application_id, type: string, source: input, description: "FK -> Application.id" }
      - { name: status, type: enum, source: system, default: "BOOKED", description: "BOOKED -> DROPPED; constraints: {BOOKED, DROPPED}" }

  - name: CanteenAccount
    parent: null
    common_fields: true
    fields:
      - { name: application_id, type: string, source: input, description: "FK -> Application.id; one canteen account per enrolled application" }
      - { name: balance_cents, type: integer, source: computed, default: 0, description: "Running balance = sum(DEPOSIT txns) - sum(PURCHASE txns) over APPLIED CanteenTransactions" }
      - { name: is_low, type: boolean, source: computed, default: false, description: "True when balance_cents <= Camp.canteen_low_balance_cents" }

  - name: CanteenTransaction
    parent: CanteenAccount
    common_fields: false   # append-only event: id + created_at only
    fields:
      - { name: account_id, type: string, source: input, description: "FK -> CanteenAccount.id" }
      - { name: kind, type: enum, source: input, description: "DEPOSIT | PURCHASE; constraints: {DEPOSIT, PURCHASE}" }
      - { name: amount_cents, type: integer, source: input, description: "Positive cents; DEPOSIT credits, PURCHASE debits the account" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  # -------------------------------------------------------------------------
  # Session — posture-driven lifecycle gating child operations
  # -------------------------------------------------------------------------
  - entity: Session
    initial_state: PLANNING
    terminal_states: [CLOSED]
    transitions:
      - from: PLANNING
        to: ENROLLING
        trigger: "POST /sessions/{id}/open-enrollment"
        actor: CampDirector
        preconditions:
          - "Session has >= 1 Cabin (ERR_NO_CABINS)"
          - "expected_session_version matches Session.version (ERR_STALE_VERSION)"
        side_effects:
          - "enrollment_open = true"
          - "increments Session.version by 1"
      - from: ENROLLING
        to: RUNNING
        trigger: "POST /sessions/{id}/start"
        actor: CampDirector
        preconditions:
          - "clock >= Session.starts_on (ERR_SESSION_NOT_STARTED)"
          - "Session.ratio_posture == STAFFED (ERR_SESSION_UNDERSTAFFED)"
          - "expected_session_version matches Session.version (ERR_STALE_VERSION)"
        side_effects:
          - "enrollment_open = false"
          - "all WAITLISTED Applications for this session -> WITHDRAWN; each withdrawal sets payment_status = REFUND_DUE only if deposit_paid_cents > 0 (none for waitlisted)"
          - "increments Session.version by 1"
      - from: RUNNING
        to: CLOSED
        trigger: "POST /sessions/{id}/close"
        actor: CampDirector
        preconditions:
          - "clock >= Session.ends_on (ERR_SESSION_NOT_ENDED)"
          - "expected_session_version matches Session.version (ERR_STALE_VERSION)"
        side_effects:
          - "all ENROLLED Applications remain ENROLLED (historical record); no refunds generated"
          - "increments Session.version by 1"

  # -------------------------------------------------------------------------
  # Application — PARALLEL dimensions: enroll_status × payment_status
  # -------------------------------------------------------------------------
  - entity: Application
    initial_state: DRAFT
    terminal_states: [WITHDRAWN]
    transitions:
      # --- enroll axis ---
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /applications/{id}/submit"
        actor: Guardian
        preconditions:
          - "Session.status == ENROLLING and Session.enrollment_open == true (ERR_ENROLLMENT_CLOSED)"
          - "Camper.health_status IN {PENDING, CLEARED} (a HealthForm has at least been SUBMITTED) (ERR_HEALTH_FORM_MISSING)"
          - "Camper.gender matches an existing Cabin.gender_band in the session and Camper.age within some cabin's [min_age, max_age] (ERR_NO_ELIGIBLE_CABIN)"
        side_effects:
          - "submitted_at = clock"
          - "list_tuition_cents snapshotted (see calc list_tuition); payment_status -> UNBILLED stays"
          - "If committed_count < capacity: enroll_status -> OFFERED via auto-rule (see OFFERED transition); else enroll_status -> WAITLISTED"
        note: "Submit immediately routes to OFFERED or WAITLISTED based on capacity headroom; SUBMITTED is transient."
      - from: SUBMITTED
        to: OFFERED
        trigger: "system (automatic at submit when committed_count < Session.capacity)"
        actor: system
        preconditions:
          - "committed_count < Session.capacity (ERR_SESSION_FULL)"
        side_effects:
          - "offer_expires_at = clock + Camp.deposit_grace_days days"
          - "payment_status -> DEPOSIT_DUE; estimated_balance recomputed"
      - from: SUBMITTED
        to: WAITLISTED
        trigger: "system (automatic at submit when committed_count >= Session.capacity)"
        actor: system
        preconditions:
          - "committed_count >= Session.capacity"
        side_effects:
          - "waitlist_length recomputed; payment_status stays UNBILLED"
      - from: WAITLISTED
        to: OFFERED
        trigger: "system (automatic during POST /sessions/{id}/run-intake when a seat frees and this is the earliest-submitted WAITLISTED application)"
        actor: system
        preconditions:
          - "committed_count < Session.capacity"
          - "This application has the earliest submitted_at among WAITLISTED (tie-break: earliest created_at)"
        side_effects:
          - "offer_expires_at = clock + Camp.deposit_grace_days days"
          - "payment_status -> DEPOSIT_DUE; waitlist_length and committed_count recomputed"
      - from: OFFERED
        to: WAITLISTED
        trigger: "system (automatic during POST /sessions/{id}/run-intake when clock > offer_expires_at)"
        actor: system
        preconditions:
          - "clock > offer_expires_at"
        side_effects:
          - "payment_status -> UNBILLED; offer_expires_at cleared; committed_count decremented; frees a seat for promotion"
        note: "Expired offer recycles back onto the waitlist; cascade can then promote the next applicant in the same run-intake pass."
      - from: OFFERED
        to: DEPOSIT_PAID
        trigger: "POST /applications/{id}/pay-deposit"
        actor: Guardian
        preconditions:
          - "clock <= offer_expires_at (ERR_OFFER_EXPIRED)"
          - "payment kind DEPOSIT amount == Camp.deposit_cents (ERR_DEPOSIT_AMOUNT_MISMATCH)"
        side_effects:
          - "creates a Payment(kind=DEPOSIT, status=APPLIED); deposit_paid_cents = Camp.deposit_cents"
          - "payment_status -> DEPOSIT_SETTLED; estimated_balance and settled_balance recomputed"
      - from: DEPOSIT_PAID
        to: ENROLLED
        trigger: "POST /applications/{id}/enroll"
        actor: CampDirector
        preconditions:
          - "Camper.health_status == CLEARED (ERR_HEALTH_NOT_CLEARED)"
          - "Application.cabin_id is set, i.e. a bunk has been assigned (ERR_NO_BUNK_ASSIGNED)"
          - "Target Cabin.is_staffable == true after counting this camper (ERR_CABIN_UNDERSTAFFED)"
          - "Session.ratio_posture != UNDERSTAFFED (ERR_SESSION_UNDERSTAFFED)"
        side_effects:
          - "enroll_status -> ENROLLED; Session.enrolled_count incremented; Cabin.occupied_bunks unchanged (already counted at DEPOSIT_PAID)"
          - "payment_status -> BALANCE_DUE if estimated_balance_cents > 0 else PAID_IN_FULL"
          - "Session.ratio_posture recomputed"
      - from: OFFERED
        to: WITHDRAWN
        trigger: "POST /applications/{id}/withdraw"
        actor: Guardian
        preconditions: []
        side_effects:
          - "committed_count decremented; frees a seat"
      - from: DEPOSIT_PAID
        to: WITHDRAWN
        trigger: "POST /applications/{id}/withdraw"
        actor: Guardian
        preconditions: []
        side_effects:
          - "all APPLIED Payments for this application -> REVERSED; payment_status -> REFUND_DUE"
          - "if cabin_id set: Cabin.occupied_bunks decremented and Cabin.is_staffable recomputed; cabin_id cleared"
          - "committed_count decremented; all BOOKED ActivityEnrollments for this application -> DROPPED (each frees a seat on its offering)"
      - from: ENROLLED
        to: WITHDRAWN
        trigger: "POST /applications/{id}/withdraw"
        actor: Guardian
        preconditions:
          - "Session.status != RUNNING (ERR_SESSION_RUNNING_NO_WITHDRAW)"
        side_effects:
          - "all APPLIED Payments -> REVERSED; payment_status -> REFUND_DUE"
          - "Session.enrolled_count decremented; committed_count decremented"
          - "Cabin.occupied_bunks decremented and is_staffable recomputed; cabin_id cleared"
          - "all BOOKED ActivityEnrollments -> DROPPED (each frees a seat on its offering)"
          - "Session.ratio_posture recomputed"

  # -------------------------------------------------------------------------
  # HealthForm — branching with revert (FLAGGED -> SUBMITTED revision loop)
  # -------------------------------------------------------------------------
  - entity: HealthForm
    initial_state: DRAFT
    terminal_states: [CLEARED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /health-forms/{id}/submit"
        actor: Guardian
        preconditions:
          - "If has_life_threatening_allergy == true then epipen_on_file must be true (ERR_EPIPEN_REQUIRED)"
        side_effects:
          - "Camper.health_status -> PENDING"
      - from: SUBMITTED
        to: CLEARED
        trigger: "POST /health-forms/{id}/clear"
        actor: InfirmaryNurse
        preconditions:
          - "If has_life_threatening_allergy == true then epipen_on_file must be true (ERR_EPIPEN_REQUIRED)"
        side_effects:
          - "Camper.health_status -> CLEARED"
      - from: SUBMITTED
        to: FLAGGED
        trigger: "POST /health-forms/{id}/flag"
        actor: InfirmaryNurse
        preconditions: []
        side_effects:
          - "Camper.health_status -> FLAGGED; review_note recorded"
      - from: FLAGGED
        to: SUBMITTED
        trigger: "POST /health-forms/{id}/submit"
        actor: Guardian
        preconditions:
          - "If has_life_threatening_allergy == true then epipen_on_file must be true (ERR_EPIPEN_REQUIRED)"
        side_effects:
          - "Camper.health_status -> PENDING"
        note: "Revision loop — a flagged form is corrected and resubmitted for re-review."

  # -------------------------------------------------------------------------
  # FinancialAidAward — branching approve/deny + revoke
  # -------------------------------------------------------------------------
  - entity: FinancialAidAward
    initial_state: REQUESTED
    terminal_states: [DENIED, REVOKED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /financial-aid/{id}/approve"
        actor: CampDirector
        preconditions:
          - "Application.enroll_status != WITHDRAWN (ERR_INVALID_STATE)"
          - "amount_cents + existing approved aid on the application <= Application.list_tuition_cents (ERR_AID_EXCEEDS_TUITION)"
        side_effects:
          - "Application.aid_cents recomputed (calc aid_total); estimated_balance and settled_balance recomputed"
      - from: REQUESTED
        to: DENIED
        trigger: "POST /financial-aid/{id}/deny"
        actor: CampDirector
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: REVOKED
        trigger: "POST /financial-aid/{id}/revoke"
        actor: CampDirector
        preconditions:
          - "Application.payment_status != PAID_IN_FULL (ERR_INVALID_STATE)"
        side_effects:
          - "Application.aid_cents recomputed (award removed); estimated_balance and settled_balance recomputed; if balance now > 0 and payment_status == PAID_IN_FULL it moves to BALANCE_DUE"

  # -------------------------------------------------------------------------
  # ActivityEnrollment — book/drop
  # -------------------------------------------------------------------------
  - entity: ActivityEnrollment
    initial_state: BOOKED
    terminal_states: [DROPPED]
    transitions:
      - from: BOOKED
        to: DROPPED
        trigger: "POST /activity-enrollments/{id}/drop"
        actor: Guardian
        preconditions: []
        side_effects:
          - "ActivityOffering.seats_taken decremented"

  # -------------------------------------------------------------------------
  # CabinAssignment — assign/release
  # -------------------------------------------------------------------------
  - entity: CabinAssignment
    initial_state: ACTIVE
    terminal_states: [RELEASED]
    transitions:
      - from: ACTIVE
        to: RELEASED
        trigger: "POST /cabin-assignments/{id}/release"
        actor: CampDirector
        preconditions:
          - "Releasing must not make any ENROLLED camper's Cabin.is_staffable false (ERR_CABIN_UNDERSTAFFED)"
        side_effects:
          - "Cabin.staff_weight_x10 recomputed; Cabin.is_staffable recomputed; Session.ratio_posture recomputed"

# -------------------------------------------------------------------------
# §1.2.1 Concurrency Rules (OCC on parent version — true CREATE-with-supersede)
# -------------------------------------------------------------------------
concurrency_rules:
  - rule_id: bunk-assign-stale-cabin
    parent_entity: Cabin
    write_endpoint: "POST /cabins/{id}/assign-bunk"
    occ_field: "expected_cabin_version"
    description: |
      Assigning a camper to a bunk in a Cabin whose version has advanced since
      the client last observed it is rejected. A second bunk assignment carrying
      a stale expected_cabin_version is refused because another assignment has
      already consumed a bunk and advanced the cabin's version; the loser's view
      of remaining bunk_capacity is therefore out of date. Without OCC the second
      assignment would legitimately succeed (free bunks still appeared available
      in the client's stale snapshot), so this is a genuine supersede race rather
      than a state precondition.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: aid-approve-stale-application
    parent_entity: Application
    write_endpoint: "POST /financial-aid/{id}/approve"
    occ_field: "expected_application_version"
    description: |
      Approving a FinancialAidAward against an Application whose version has
      advanced since the client last observed it is rejected. The aid ceiling
      check (sum of approved aid <= list_tuition) reads the Application's current
      aid_cents; if another award was approved in the interim the Application's
      version advanced and the approver's snapshot of remaining headroom is
      stale, so the supersede is refused.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: list_tuition
    trigger: "Application submit (DRAFT -> SUBMITTED)"
    algorithm: tiered_pricing
    formula: |
      # Gross session tuition before aid, tiered by how early (relative to the
      # session start) the application is submitted, then surcharged for medical
      # support load. Evaluation order is PINNED: (1) pick early-bird tier from
      # days_before_start, (2) apply tier rate to Session.capacity-independent
      # base, (3) ADD med_support_surcharge. Steps do NOT commute.
      days_before_start = floor((Session.starts_on - clock) / 1 day)   # may be negative
      if days_before_start >= 60:      tier_cents = BASE_TUITION_CENTS - EARLY_DISCOUNT_CENTS
      elif days_before_start >= 14:    tier_cents = BASE_TUITION_CENTS
      else:                            tier_cents = BASE_TUITION_CENTS + LATE_SURCHARGE_CENTS
      # med support: read the camper's latest SUBMITTED-or-later HealthForm
      hf = latest HealthForm for Camper by created_at where status IN {SUBMITTED, CLEARED, FLAGGED}
      med_support = hf.daily_medication_count * MED_PER_MED_CENTS
                  + (EPIPEN_SUPPORT_CENTS if hf.has_life_threatening_allergy else 0)
      list_tuition_cents = tier_cents + med_support
    input_set: "single Application + its Camper's latest non-DRAFT HealthForm"
    constants:
      BASE_TUITION_CENTS: 400000
      EARLY_DISCOUNT_CENTS: 30000
      LATE_SURCHARGE_CENTS: 25000
      MED_PER_MED_CENTS: 1500
      EPIPEN_SUPPORT_CENTS: 5000
    precision: "integer cents, no rounding (all inputs integer cents)"

  - name: estimated_balance
    trigger: "any change to aid (REQUESTED or APPROVED), deposit_paid_cents, or applied Payments (forward-looking / optimistic variant)"
    algorithm: forward_looking
    formula: |
      # FORWARD-LOOKING / OPTIMISTIC: the running estimate shown to the guardian.
      # It OPTIMISTICALLY assumes every still-pending aid request will be approved,
      # so its aid inclusion set is {REQUESTED, APPROVED} (NOT denied/revoked). It
      # pools aid and all APPLIED payments into one subtraction and floors at 0.
      optimistic_aid = sum(a.amount_cents for FinancialAidAward a
                           where a.application_id == this and a.status IN {REQUESTED, APPROVED})
      applied_payments = sum(p.amount_cents for Payment p
                           where p.application_id == this and p.status == APPLIED)
      estimated_balance_cents = max(0, list_tuition_cents - optimistic_aid - applied_payments)
    input_set: "{REQUESTED, APPROVED} FinancialAidAwards + APPLIED Payments for this Application"
    constants: {}
    precision: "integer cents"
    variants:
      - name: forward_looking
        when: "displayed as the running 'estimated balance' on the application"
        difference: "aid inclusion set is {REQUESTED, APPROVED} — counts pending requests optimistically; pooled single-step subtraction"

  - name: settled_balance
    trigger: "any change to APPROVED aid, deposit_paid_cents, or applied Payments (chronological / authoritative variant)"
    algorithm: chronological
    formula: |
      # CHRONOLOGICAL / AUTHORITATIVE: the legally-owed balance used to compute
      # refunds. Its aid inclusion set is {APPROVED} ONLY — a still-REQUESTED award
      # contributes nothing until it is actually approved. It replays APPROVED-aid
      # and APPLIED-payment events in created_at ASC order (tie-break: created_at
      # equal -> aid event before payment event; then created_at again, never id)
      # against a running balance starting at list_tuition_cents, flooring at 0
      # PER EVENT.
      running = list_tuition_cents
      events = (APPROVED FinancialAidAward, reduce by amount_cents)
             + (APPLIED Payment, reduce by amount_cents)
      sort events by created_at ASC; tie-break created_at equal -> aid before payment
      for e in events:
        running = max(0, running - e.amount_cents)
      settled_balance_cents = running
    input_set: "{APPROVED} FinancialAidAwards + APPLIED Payments for this Application"
    constants: {}
    precision: "integer cents"
    variants:
      - name: chronological
        when: "the authoritative balance used when generating refunds at withdrawal and gating PAID_IN_FULL"
        difference: "aid inclusion set is {APPROVED} ONLY — ignores pending requests; chronological per-event replay. Diverges from estimated_balance whenever a REQUESTED-but-unapproved award exists (estimated counts it, settled does not)"

  - name: cabin_staff_weight
    trigger: "CabinAssignment create/release, Camp.cit_counts_as_half change"
    algorithm: weighted_scoring
    formula: |
      # Effective staff weight (x10 to stay in integers).
      # COUNSELOR contributes 10; CIT contributes 5 when Camp.cit_counts_as_half
      # else 10. Only ACTIVE assignments to BACKGROUND-CLEARED staff count.
      staff_weight_x10 = sum over CabinAssignment ca where ca.cabin_id == this.id
                             and ca.status == ACTIVE
                             and StaffMember(ca.staff_member_id).is_background_cleared == true of:
        10 if StaffMember.role_kind == COUNSELOR
        else (5 if Camp.cit_counts_as_half else 10)
    input_set: "ACTIVE CabinAssignments for this Cabin whose StaffMember is background-cleared"
    constants: {}
    precision: "integer (already x10)"

  - name: cabin_is_staffable
    trigger: "any change to Cabin.staff_weight_x10 or Cabin.occupied_bunks"
    algorithm: threshold
    formula: |
      # A cabin is staffable when its effective staff weight covers the campers
      # at the configured ratio. Boundary is PINNED as >= (a cabin exactly at
      # ratio is staffable). required_weight_x10 uses ceil so a partial group
      # still needs a whole counselor-equivalent.
      required_weight_x10 = ceil(occupied_bunks / counselor_camper_ratio) * 10
      is_staffable = (occupied_bunks == 0) or (staff_weight_x10 >= required_weight_x10)
    input_set: "single Cabin"
    constants: {}
    precision: "integer"

  - name: session_ratio_posture
    trigger: "any change to a child Cabin's is_staffable, occupied_bunks, or staff_weight_x10; Application enroll/withdraw"
    algorithm: aggregation
    formula: |
      # Derived posture over all Cabins in the session that currently hold campers
      # (occupied_bunks > 0). Boundaries PINNED.
      occupied_cabins = [c for c in Cabins(session) if c.occupied_bunks > 0]
      if occupied_cabins is empty:                         posture = UNDERSTAFFED   # cannot start an empty session
      elif every c in occupied_cabins has is_staffable:    posture = STAFFED
      elif at least one c is is_staffable:                 posture = MARGINAL
      else:                                                posture = UNDERSTAFFED
    input_set: "all Cabins of the Session with occupied_bunks > 0"
    constants: {}
    precision: "n/a (enum)"

  - name: activity_overlap_block
    trigger: "POST /activity-enrollments (book an elective)"
    algorithm: interval_merge
    formula: |
      # Two interval-semantics overlap checks on DIFFERENT geometry, both
      # rejecting the booking with ERR_ACTIVITY_TIME_CONFLICT:
      # (A) same-slot collision: existing BOOKED enrollment for the same
      #     application on the SAME slot_day whose [starts_minute, ends_minute)
      #     half-open interval intersects the new offering's half-open interval.
      #     Half-open => adjacency (existing.ends_minute == new.starts_minute) is
      #     ALLOWED (no conflict).
      # (B) buffer collision: even when raw intervals are disjoint, the new
      #     offering's start must be >= existing.ends_minute + existing.setup_buffer_minutes
      #     AND existing.starts_minute >= new.ends_minute + new.setup_buffer_minutes.
      #     The buffer is asymmetric per offering and is INCLUSIVE of its boundary
      #     (start exactly at end+buffer is allowed).
      conflict = (A intervals strictly overlap on same slot_day) OR (B buffer window violated on same slot_day)
    input_set: "BOOKED ActivityEnrollments for this Application on the target offering's slot_day"
    constants: {}
    precision: "integer minutes"

  - name: canteen_balance
    trigger: "POST /canteen-accounts/{id}/transactions (deposit or purchase)"
    algorithm: aggregation
    formula: |
      balance_cents = sum(t.amount_cents for CanteenTransaction t where account_id == this and t.kind == DEPOSIT and t.status == APPLIED)
                    - sum(t.amount_cents for CanteenTransaction t where account_id == this and t.kind == PURCHASE and t.status == APPLIED)
      is_low = balance_cents <= Camp.canteen_low_balance_cents
      # PURCHASE is rejected (ERR_CANTEEN_INSUFFICIENT_FUNDS) when amount_cents > current balance_cents (overdraft forbidden; == balance is allowed)
    input_set: "APPLIED CanteenTransactions for this account"
    constants: {}
    precision: "integer cents"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and well-formed"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all except POST /guardians/register and POST /_clock/set_current_utc"
  - priority: 2
    category: auth
    check: "Acting role is permitted for this endpoint per §1.7 RBAC"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all
  - priority: 3
    category: auth
    check: "Guardian may only act on Campers/Applications/HealthForms/Payments it owns (X-User-ID matches Camper.guardian_user_id chain)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "Guardian-owned resource endpoints"
  - priority: 4
    category: existence
    check: "All path/body referenced resources exist, validated left-to-right in the path"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all
  - priority: 5
    category: business_referential
    check: "Body FK targets exist and belong to the right scope (e.g. Cabin.session_id == Application.session_id on assign-bunk; FinancialAidAward.application_id resolves)"
    error_id: ERR_REFERENTIAL_MISMATCH
    http_status: 409
    applies_to: "POST /cabins/{id}/assign-bunk, POST /financial-aid, POST /activity-enrollments, POST /canteen-accounts/{id}/transactions"
  - priority: 6
    category: state
    check: "Target resource in a valid state for this transition (enroll_status / payment_status / HealthForm.status / Session.status / etc.)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 7
    category: business_safety
    check: "Health/infirmary gates: EpiPen required for life-threatening allergy on submit/clear; CLEARED required before enroll; swim-test (CLEARED) required for waterfront offerings"
    error_id: "ERR_EPIPEN_REQUIRED / ERR_HEALTH_NOT_CLEARED / ERR_SWIM_TEST_REQUIRED"
    http_status: 422
    applies_to: "POST /health-forms/{id}/submit, POST /health-forms/{id}/clear, POST /applications/{id}/enroll, POST /activity-enrollments"
  - priority: 8
    category: business_constraint
    check: "Eligibility/matching: camper gender×age fits a cabin gender_band/[min_age,max_age]; bunk gender_band matches camper; staffing ratio satisfied (is_staffable); background-clearance for staff assignment"
    error_id: "ERR_NO_ELIGIBLE_CABIN / ERR_CABIN_GENDER_MISMATCH / ERR_CABIN_AGE_MISMATCH / ERR_CABIN_UNDERSTAFFED / ERR_STAFF_NOT_CLEARED"
    http_status: 422
    applies_to: "POST /applications/{id}/submit, POST /cabins/{id}/assign-bunk, POST /applications/{id}/enroll, POST /cabin-assignments"
  - priority: 9
    category: business_temporal
    check: "Activity scheduling time/buffer conflicts; session date-window gates (start not before starts_on, close not before ends_on); visiting_day within session window"
    error_id: "ERR_ACTIVITY_TIME_CONFLICT / ERR_SESSION_NOT_STARTED / ERR_SESSION_NOT_ENDED / ERR_VISITING_DAY_OUT_OF_RANGE"
    http_status: 422
    applies_to: "POST /activity-enrollments, POST /sessions/{id}/start, POST /sessions/{id}/close, POST /sessions"
  - priority: 10
    category: business_constraint
    check: "Capacity/quota: session committed_count < capacity for offers; cabin bunk_capacity for bunk assignment; activity seat_capacity for booking"
    error_id: "ERR_SESSION_FULL / ERR_CABIN_FULL / ERR_ACTIVITY_FULL"
    http_status: 409
    applies_to: "POST /applications/{id}/submit, POST /cabins/{id}/assign-bunk, POST /activity-enrollments"
  - priority: 11
    category: business_fiscal
    check: "Fiscal: deposit amount matches Camp.deposit_cents; aid total does not exceed list tuition; canteen purchase does not overdraft"
    error_id: "ERR_DEPOSIT_AMOUNT_MISMATCH / ERR_AID_EXCEEDS_TUITION / ERR_CANTEEN_INSUFFICIENT_FUNDS"
    http_status: 422
    applies_to: "POST /applications/{id}/pay-deposit, POST /financial-aid/{id}/approve, POST /canteen-accounts/{id}/transactions"
  - priority: 12
    category: business_temporal
    check: "Offer must not be expired when paying deposit (clock <= offer_expires_at)"
    error_id: ERR_OFFER_EXPIRED
    http_status: 409
    applies_to: "POST /applications/{id}/pay-deposit"
  - priority: 13
    category: state
    check: "OCC: expected_<parent>_version must equal the parent entity's current version on supersede-style writes"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /cabins/{id}/assign-bunk, POST /financial-aid/{id}/approve, POST /sessions/{id}/open-enrollment, POST /sessions/{id}/start, POST /sessions/{id}/close"
  - priority: 14
    category: business_constraint
    check: "Required body fields present and well-typed; enum members valid; positive amounts where required; ends_on > starts_on; max_age >= min_age; ends_minute > starts_minute"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---------- Test-driving clock ----------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock. Server startup default is 2026-04-01T00:00:00Z; before any set call the clock reads exactly this default and never falls back to wall-clock time."
    roles: [CampDirector]
    code: 200
    input: [to_iso8601]
    output: "{ now: string }"
    side_effects: ["logical clock set to to_iso8601"]

  # ---------- Guardian / auth ----------
  - method: POST
    path: "/guardians/register"
    description: "Register a new Guardian account (anonymous)."
    roles: [Anonymous]
    code: 201
    input: [email, full_name, phone]
    output: Guardian
    side_effects: ["Guardian created"]
  - method: GET
    path: "/guardians/{id}"
    description: "Get a Guardian."
    roles: [Guardian, CampDirector]
    code: 200
    input: []
    output: Guardian
    side_effects: []

  # ---------- Camp ----------
  - method: POST
    path: "/camps"
    description: "Create a Camp (config root)."
    roles: [CampDirector]
    code: 201
    input: [name, "counselor_camper_ratio?", "cit_counts_as_half?", "deposit_cents?", "deposit_grace_days?", "canteen_low_balance_cents?"]
    output: Camp
    side_effects: ["Camp created with config defaults"]
  - method: GET
    path: "/camps/{id}"
    description: "Get a Camp."
    roles: [Guardian, CampDirector, InfirmaryNurse]
    code: 200
    input: []
    output: Camp
    side_effects: []
  - method: PATCH
    path: "/camps/{id}"
    description: "Update Camp config (e.g. toggle cit_counts_as_half)."
    roles: [CampDirector]
    code: 200
    input: ["counselor_camper_ratio?", "cit_counts_as_half?", "deposit_cents?", "deposit_grace_days?", "canteen_low_balance_cents?", "expected_camp_version"]
    output: Camp
    side_effects: ["config updated; cabin_staff_weight & is_staffable recomputed for all cabins if cit_counts_as_half changed; increments Camp.version by 1"]

  # ---------- Session ----------
  - method: POST
    path: "/camps/{id}/sessions"
    description: "Create a Session under a Camp."
    roles: [CampDirector]
    code: 201
    input: [name, starts_on, ends_on, visiting_day_on, capacity]
    output: Session
    side_effects: ["status=PLANNING, enrollment_open=true, counts=0, ratio_posture=UNDERSTAFFED"]
  - method: GET
    path: "/camps/{id}/sessions"
    description: "List Sessions for a Camp (reverse-reachability for Session.camp_id)."
    roles: [Guardian, CampDirector, InfirmaryNurse]
    code: 200
    input: ["camp_id?", "status?", "limit?", "offset?"]
    output: Session[]
    side_effects: []
  - method: GET
    path: "/sessions/{id}"
    description: "Get a Session (with computed counts and ratio_posture)."
    roles: [Guardian, CampDirector, InfirmaryNurse]
    code: 200
    input: []
    output: Session
    side_effects: []
  - method: POST
    path: "/sessions/{id}/open-enrollment"
    description: "Move Session PLANNING -> ENROLLING."
    roles: [CampDirector]
    code: 200
    input: [expected_session_version]
    output: Session
    side_effects: ["enrollment_open=true; increments Session.version by 1"]
  - method: POST
    path: "/sessions/{id}/start"
    description: "Move Session ENROLLING -> RUNNING; expires all waitlists."
    roles: [CampDirector]
    code: 200
    input: [expected_session_version]
    output: Session
    side_effects: ["enrollment_open=false; WAITLISTED applications -> WITHDRAWN; increments Session.version by 1"]
  - method: POST
    path: "/sessions/{id}/close"
    description: "Move Session RUNNING -> CLOSED."
    roles: [CampDirector]
    code: 200
    input: [expected_session_version]
    output: Session
    side_effects: ["increments Session.version by 1"]
  - method: POST
    path: "/sessions/{id}/run-intake"
    description: "Intake checkpoint: expire stale OFFERED applications (clock > offer_expires_at) back to WAITLISTED, then promote earliest WAITLISTED applications into freed seats (cascade)."
    roles: [CampDirector]
    code: 200
    input: []
    output: Session
    side_effects: ["OFFERED past offer_expires_at -> WAITLISTED (committed_count decremented); WAITLISTED -> OFFERED while committed_count < capacity, earliest submitted_at first (tie-break created_at); counts recomputed"]

  # ---------- Cabin ----------
  - method: POST
    path: "/sessions/{id}/cabins"
    description: "Create a Cabin under a Session."
    roles: [CampDirector]
    code: 201
    input: [name, gender_band, min_age, max_age, bunk_capacity]
    output: Cabin
    side_effects: ["occupied_bunks=0, staff_weight_x10=0, is_staffable=false (occupied_bunks==0 => is_staffable true by calc)"]
  - method: GET
    path: "/sessions/{id}/cabins"
    description: "List Cabins for a Session (reverse-reachability for Cabin.session_id)."
    roles: [Guardian, CampDirector, InfirmaryNurse]
    code: 200
    input: ["session_id?", "limit?", "offset?"]
    output: Cabin[]
    side_effects: []
  - method: GET
    path: "/cabins/{id}"
    description: "Get a Cabin (computed occupancy + staffing)."
    roles: [Guardian, CampDirector, InfirmaryNurse]
    code: 200
    input: []
    output: Cabin
    side_effects: []
  - method: POST
    path: "/cabins/{id}/assign-bunk"
    description: "Assign a DEPOSIT_PAID/OFFERED-with-deposit application's camper to a bunk in this cabin (OCC on cabin)."
    roles: [CampDirector]
    code: 200
    input: [application_id, expected_cabin_version]
    output: Cabin
    side_effects: ["Application.cabin_id set; Cabin.occupied_bunks incremented; is_staffable recomputed; Session.ratio_posture recomputed; increments Cabin.version by 1"]

  # ---------- StaffMember & CabinAssignment ----------
  - method: POST
    path: "/camps/{id}/staff"
    description: "Create a StaffMember under a Camp."
    roles: [CampDirector]
    code: 201
    input: [full_name, role_kind, "is_background_cleared?"]
    output: StaffMember
    side_effects: ["StaffMember created"]
  - method: GET
    path: "/camps/{id}/staff"
    description: "List StaffMembers for a Camp (reverse-reachability for StaffMember.camp_id)."
    roles: [CampDirector]
    code: 200
    input: ["camp_id?", "limit?", "offset?"]
    output: StaffMember[]
    side_effects: []
  - method: GET
    path: "/staff/{id}"
    description: "Get a StaffMember."
    roles: [CampDirector]
    code: 200
    input: []
    output: StaffMember
    side_effects: []
  - method: POST
    path: "/cabin-assignments"
    description: "Assign a StaffMember to a Cabin (flat junction)."
    roles: [CampDirector]
    code: 201
    input: [cabin_id, staff_member_id]
    output: CabinAssignment
    side_effects: ["status=ACTIVE; Cabin.staff_weight_x10 & is_staffable recomputed; Session.ratio_posture recomputed"]
  - method: GET
    path: "/cabin-assignments"
    description: "List CabinAssignments, filterable by cabin or staff (reverse-reachability for both FKs)."
    roles: [CampDirector]
    code: 200
    input: ["cabin_id?", "staff_member_id?", "status?", "limit?", "offset?"]
    output: CabinAssignment[]
    side_effects: []
  - method: GET
    path: "/cabin-assignments/{id}"
    description: "Get a CabinAssignment."
    roles: [CampDirector]
    code: 200
    input: []
    output: CabinAssignment
    side_effects: []
  - method: POST
    path: "/cabin-assignments/{id}/release"
    description: "Release a StaffMember from a Cabin (ACTIVE -> RELEASED)."
    roles: [CampDirector]
    code: 200
    input: []
    output: CabinAssignment
    side_effects: ["Cabin.staff_weight_x10 & is_staffable recomputed; Session.ratio_posture recomputed"]

  # ---------- Camper ----------
  - method: POST
    path: "/campers"
    description: "Create a Camper owned by the acting Guardian."
    roles: [Guardian]
    code: 201
    input: [full_name, age, gender]
    output: Camper
    side_effects: ["guardian_user_id = X-User-ID; health_status=NONE"]
  - method: GET
    path: "/campers"
    description: "List Campers, filterable by guardian (reverse-reachability for Camper.guardian_user_id)."
    roles: [Guardian, CampDirector]
    code: 200
    input: ["guardian_user_id?", "limit?", "offset?"]
    output: Camper[]
    side_effects: []
  - method: GET
    path: "/campers/{id}"
    description: "Get a Camper."
    roles: [Guardian, CampDirector, InfirmaryNurse]
    code: 200
    input: []
    output: Camper
    side_effects: []

  # ---------- HealthForm ----------
  - method: POST
    path: "/health-forms"
    description: "Create a DRAFT HealthForm for a camper."
    roles: [Guardian]
    code: 201
    input: [camper_id, "has_life_threatening_allergy?", "epipen_on_file?", "daily_medication_count?"]
    output: HealthForm
    side_effects: ["status=DRAFT"]
  - method: GET
    path: "/health-forms"
    description: "List HealthForms, filterable by camper (reverse-reachability for HealthForm.camper_id)."
    roles: [Guardian, CampDirector, InfirmaryNurse]
    code: 200
    input: ["camper_id?", "status?", "limit?", "offset?"]
    output: HealthForm[]
    side_effects: []
  - method: GET
    path: "/health-forms/{id}"
    description: "Get a HealthForm."
    roles: [Guardian, CampDirector, InfirmaryNurse]
    code: 200
    input: []
    output: HealthForm
    side_effects: []
  - method: POST
    path: "/health-forms/{id}/submit"
    description: "Guardian submits/resubmits a HealthForm (DRAFT|FLAGGED -> SUBMITTED)."
    roles: [Guardian]
    code: 200
    input: []
    output: HealthForm
    side_effects: ["Camper.health_status -> PENDING"]
  - method: POST
    path: "/health-forms/{id}/clear"
    description: "Nurse clears a SUBMITTED HealthForm (-> CLEARED)."
    roles: [InfirmaryNurse]
    code: 200
    input: ["review_note?"]
    output: HealthForm
    side_effects: ["Camper.health_status -> CLEARED"]
  - method: POST
    path: "/health-forms/{id}/flag"
    description: "Nurse flags a SUBMITTED HealthForm for correction (-> FLAGGED)."
    roles: [InfirmaryNurse]
    code: 200
    input: ["review_note?"]
    output: HealthForm
    side_effects: ["Camper.health_status -> FLAGGED"]

  # ---------- Application ----------
  - method: POST
    path: "/applications"
    description: "Create a DRAFT Application for a camper+session."
    roles: [Guardian]
    code: 201
    input: [camper_id, session_id]
    output: Application
    side_effects: ["enroll_status=DRAFT, payment_status=UNBILLED"]
  - method: GET
    path: "/applications"
    description: "List Applications, filterable by camper, session, or cabin (reverse-reachability for Application.camper_id, Application.session_id, and Application.cabin_id)."
    roles: [Guardian, CampDirector, InfirmaryNurse]
    code: 200
    input: ["camper_id?", "session_id?", "cabin_id?", "enroll_status?", "limit?", "offset?"]
    output: Application[]
    side_effects: []
  - method: GET
    path: "/applications/{id}"
    description: "Get an Application (computed balances + statuses)."
    roles: [Guardian, CampDirector, InfirmaryNurse]
    code: 200
    input: []
    output: Application
    side_effects: []
  - method: POST
    path: "/applications/{id}/submit"
    description: "Submit a DRAFT Application; auto-routes to OFFERED (seat available) or WAITLISTED."
    roles: [Guardian]
    code: 200
    input: []
    output: Application
    side_effects: ["submitted_at set; list_tuition_cents snapshotted; enroll_status -> OFFERED|WAITLISTED; payment_status -> DEPOSIT_DUE if offered"]
  - method: POST
    path: "/applications/{id}/pay-deposit"
    description: "Guardian pays the deposit on an OFFERED application (-> DEPOSIT_PAID)."
    roles: [Guardian]
    code: 200
    input: [amount_cents]
    output: Application
    side_effects: ["Payment(kind=DEPOSIT,APPLIED) created; deposit_paid_cents set; enroll_status -> DEPOSIT_PAID; payment_status -> DEPOSIT_SETTLED; balances recomputed"]
  - method: POST
    path: "/applications/{id}/enroll"
    description: "Director enrolls a DEPOSIT_PAID application once health-cleared, bunked, and staffed (-> ENROLLED)."
    roles: [CampDirector]
    code: 200
    input: []
    output: Application
    side_effects: ["enroll_status -> ENROLLED; enrolled_count incremented; payment_status -> BALANCE_DUE|PAID_IN_FULL; ratio_posture recomputed"]
  - method: POST
    path: "/applications/{id}/withdraw"
    description: "Withdraw an application (OFFERED/DEPOSIT_PAID/ENROLLED -> WITHDRAWN) with cascade."
    roles: [Guardian]
    code: 200
    input: []
    output: Application
    side_effects: ["Payments REVERSED & payment_status -> REFUND_DUE (if any deposit); cabin freed; ActivityEnrollments DROPPED; counts & posture recomputed"]
  - method: POST
    path: "/applications/{id}/pay-balance"
    description: "Guardian pays remaining balance on a BALANCE_DUE application."
    roles: [Guardian]
    code: 200
    input: [amount_cents]
    output: Application
    side_effects: ["Payment(kind=BALANCE,APPLIED) created; balances recomputed; payment_status -> PAID_IN_FULL when settled_balance reaches 0"]

  # ---------- FinancialAidAward ----------
  - method: POST
    path: "/financial-aid"
    description: "Guardian requests a financial-aid award / scholarship on an application."
    roles: [Guardian]
    code: 201
    input: [application_id, kind, amount_cents]
    output: FinancialAidAward
    side_effects: ["status=REQUESTED"]
  - method: GET
    path: "/financial-aid"
    description: "List FinancialAidAwards, filterable by application (reverse-reachability for FinancialAidAward.application_id)."
    roles: [Guardian, CampDirector]
    code: 200
    input: ["application_id?", "status?", "limit?", "offset?"]
    output: FinancialAidAward[]
    side_effects: []
  - method: GET
    path: "/financial-aid/{id}"
    description: "Get a FinancialAidAward."
    roles: [Guardian, CampDirector]
    code: 200
    input: []
    output: FinancialAidAward
    side_effects: []
  - method: POST
    path: "/financial-aid/{id}/approve"
    description: "Director approves an aid request (OCC on the application; ceiling-checked)."
    roles: [CampDirector]
    code: 200
    input: [expected_application_version]
    output: FinancialAidAward
    side_effects: ["status=APPROVED; Application.aid_cents recomputed; balances recomputed; increments Application.version by 1"]
  - method: POST
    path: "/financial-aid/{id}/deny"
    description: "Director denies an aid request."
    roles: [CampDirector]
    code: 200
    input: []
    output: FinancialAidAward
    side_effects: ["status=DENIED"]
  - method: POST
    path: "/financial-aid/{id}/revoke"
    description: "Director revokes a previously approved award."
    roles: [CampDirector]
    code: 200
    input: []
    output: FinancialAidAward
    side_effects: ["status=REVOKED; Application.aid_cents recomputed; balances recomputed; payment_status may revert PAID_IN_FULL -> BALANCE_DUE"]

  # ---------- Payment (reverse-reachability) ----------
  - method: GET
    path: "/payments"
    description: "List Payments, filterable by application (reverse-reachability for Payment.application_id)."
    roles: [Guardian, CampDirector]
    code: 200
    input: ["application_id?", "status?", "limit?", "offset?"]
    output: Payment[]
    side_effects: []
  - method: GET
    path: "/payments/{id}"
    description: "Get a Payment."
    roles: [Guardian, CampDirector]
    code: 200
    input: []
    output: Payment
    side_effects: []

  # ---------- ActivityOffering ----------
  - method: POST
    path: "/sessions/{id}/activities"
    description: "Create an ActivityOffering (elective) under a Session."
    roles: [CampDirector]
    code: 201
    input: [name, slot_day, starts_minute, ends_minute, seat_capacity, "setup_buffer_minutes?", "requires_swim_test?"]
    output: ActivityOffering
    side_effects: ["seats_taken=0"]
  - method: GET
    path: "/sessions/{id}/activities"
    description: "List ActivityOfferings for a Session (reverse-reachability for ActivityOffering.session_id)."
    roles: [Guardian, CampDirector, InfirmaryNurse]
    code: 200
    input: ["session_id?", "slot_day?", "limit?", "offset?"]
    output: ActivityOffering[]
    side_effects: []
  - method: GET
    path: "/activities/{id}"
    description: "Get an ActivityOffering."
    roles: [Guardian, CampDirector, InfirmaryNurse]
    code: 200
    input: []
    output: ActivityOffering
    side_effects: []

  # ---------- ActivityEnrollment ----------
  - method: POST
    path: "/activity-enrollments"
    description: "Book a camper into an elective (time/buffer/seat/swim-test checked)."
    roles: [Guardian]
    code: 201
    input: [offering_id, application_id]
    output: ActivityEnrollment
    side_effects: ["status=BOOKED; ActivityOffering.seats_taken incremented"]
  - method: GET
    path: "/activity-enrollments"
    description: "List ActivityEnrollments, filterable by offering or application (reverse-reachability for both FKs)."
    roles: [Guardian, CampDirector]
    code: 200
    input: ["offering_id?", "application_id?", "status?", "limit?", "offset?"]
    output: ActivityEnrollment[]
    side_effects: []
  - method: GET
    path: "/activity-enrollments/{id}"
    description: "Get an ActivityEnrollment."
    roles: [Guardian, CampDirector]
    code: 200
    input: []
    output: ActivityEnrollment
    side_effects: []
  - method: POST
    path: "/activity-enrollments/{id}/drop"
    description: "Drop an elective booking (BOOKED -> DROPPED)."
    roles: [Guardian]
    code: 200
    input: []
    output: ActivityEnrollment
    side_effects: ["ActivityOffering.seats_taken decremented"]

  # ---------- CanteenAccount & CanteenTransaction ----------
  - method: POST
    path: "/canteen-accounts"
    description: "Open a canteen/store account for an application."
    roles: [Guardian, CampDirector]
    code: 201
    input: [application_id]
    output: CanteenAccount
    side_effects: ["balance_cents=0, is_low=true"]
  - method: GET
    path: "/canteen-accounts"
    description: "List CanteenAccounts, filterable by application (reverse-reachability for CanteenAccount.application_id)."
    roles: [Guardian, CampDirector]
    code: 200
    input: ["application_id?", "limit?", "offset?"]
    output: CanteenAccount[]
    side_effects: []
  - method: GET
    path: "/canteen-accounts/{id}"
    description: "Get a CanteenAccount (computed balance)."
    roles: [Guardian, CampDirector]
    code: 200
    input: []
    output: CanteenAccount
    side_effects: []
  - method: POST
    path: "/canteen-accounts/{id}/transactions"
    description: "Record a DEPOSIT (credit) or PURCHASE (debit, overdraft-blocked) transaction."
    roles: [Guardian, CampDirector]
    code: 201
    input: [kind, amount_cents]
    output: CanteenTransaction
    side_effects: ["transaction APPLIED; CanteenAccount.balance_cents & is_low recomputed"]
  - method: GET
    path: "/canteen-accounts/{id}/transactions"
    description: "List CanteenTransactions for an account (reverse-reachability for CanteenTransaction.account_id)."
    roles: [Guardian, CampDirector]
    code: 200
    input: ["limit?", "offset?"]
    output: CanteenTransaction[]
    side_effects: []

  # ---------- TransportBooking under Application (visiting day / transport) ----------
  # Modeled as fields on Application is avoided; transport handled via session visiting_day_on
  # plus an application sub-resource list. (No extra entity needed.)

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body, missing required field, bad enum, non-positive amount, ends_on<=starts_on, max_age<min_age, ends_minute<=starts_minute" }
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID on a protected endpoint" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Acting role not permitted for this endpoint" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "Guardian acting on a camper/application/health-form/payment it does not own" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource does not exist" }
  - { id: ERR_REFERENTIAL_MISMATCH, http: 409, condition: "Body FK target exists but is out of scope (e.g. cabin not in application's session)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a valid state for the requested transition" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent entity's current version" }
  - { id: ERR_ENROLLMENT_CLOSED, http: 409, condition: "Session not ENROLLING / enrollment_open false on application submit" }
  - { id: ERR_NO_CABINS, http: 409, condition: "open-enrollment attempted on a Session with no cabins" }
  - { id: ERR_SESSION_FULL, http: 409, condition: "No seat available: committed_count >= capacity when an OFFER is required" }
  - { id: ERR_SESSION_NOT_STARTED, http: 422, condition: "start attempted before clock reaches Session.starts_on" }
  - { id: ERR_SESSION_NOT_ENDED, http: 422, condition: "close attempted before clock reaches Session.ends_on" }
  - { id: ERR_SESSION_UNDERSTAFFED, http: 422, condition: "start/enroll blocked because Session.ratio_posture is not adequate" }
  - { id: ERR_SESSION_RUNNING_NO_WITHDRAW, http: 409, condition: "withdraw of an ENROLLED application while Session.status == RUNNING" }
  - { id: ERR_VISITING_DAY_OUT_OF_RANGE, http: 422, condition: "visiting_day_on not within [starts_on, ends_on]" }
  - { id: ERR_HEALTH_FORM_MISSING, http: 422, condition: "submit attempted with camper health_status == NONE (no SUBMITTED health form)" }
  - { id: ERR_EPIPEN_REQUIRED, http: 422, condition: "health form has life-threatening allergy but no EpiPen on file on submit/clear" }
  - { id: ERR_HEALTH_NOT_CLEARED, http: 422, condition: "enroll attempted while camper health_status != CLEARED" }
  - { id: ERR_SWIM_TEST_REQUIRED, http: 422, condition: "booking a swim/waterfront offering while camper health_status != CLEARED" }
  - { id: ERR_NO_ELIGIBLE_CABIN, http: 422, condition: "no cabin in the session matches the camper's gender and age band at submit" }
  - { id: ERR_CABIN_GENDER_MISMATCH, http: 422, condition: "assign-bunk into a cabin whose gender_band excludes the camper" }
  - { id: ERR_CABIN_AGE_MISMATCH, http: 422, condition: "assign-bunk into a cabin whose [min_age,max_age] excludes the camper" }
  - { id: ERR_CABIN_FULL, http: 409, condition: "assign-bunk when occupied_bunks would exceed bunk_capacity" }
  - { id: ERR_CABIN_UNDERSTAFFED, http: 422, condition: "enroll/release would leave a cabin holding campers without sufficient staff weight" }
  - { id: ERR_NO_BUNK_ASSIGNED, http: 409, condition: "enroll attempted before a bunk (cabin_id) is assigned" }
  - { id: ERR_STAFF_NOT_CLEARED, http: 422, condition: "cabin-assignment of a StaffMember whose is_background_cleared is false" }
  - { id: ERR_DEPOSIT_AMOUNT_MISMATCH, http: 422, condition: "pay-deposit amount_cents != Camp.deposit_cents" }
  - { id: ERR_OFFER_EXPIRED, http: 409, condition: "pay-deposit after clock > offer_expires_at" }
  - { id: ERR_AID_EXCEEDS_TUITION, http: 422, condition: "approving aid would push total approved aid above list_tuition_cents" }
  - { id: ERR_ACTIVITY_TIME_CONFLICT, http: 422, condition: "elective booking overlaps (raw or buffer) an existing booking on the same slot_day" }
  - { id: ERR_ACTIVITY_FULL, http: 409, condition: "elective booking when seats_taken would exceed seat_capacity" }
  - { id: ERR_CANTEEN_INSUFFICIENT_FUNDS, http: 422, condition: "PURCHASE amount_cents exceeds current canteen balance_cents" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Anonymous
    description: "Unauthenticated caller. May only register a Guardian and set the clock is NOT permitted (director only)."
    identity: "opaque"
    exclusive_operations:
      - "POST /guardians/register — create a Guardian account"
    shared_operations: []
  - name: Guardian
    description: "A parent/guardian. Owns their own Campers, Applications, HealthForms, Payments, ActivityEnrollments and CanteenAccounts; acts only on resources in their own ownership chain (X-User-ID == Camper.guardian_user_id)."
    identity: "entity_backed:Guardian"
    exclusive_operations:
      - "POST /campers — create own camper"
      - "POST /applications — create own application"
      - "POST /applications/{id}/submit — submit own application"
      - "POST /applications/{id}/pay-deposit — pay own deposit"
      - "POST /applications/{id}/pay-balance — pay own balance"
      - "POST /applications/{id}/withdraw — withdraw own application"
      - "POST /health-forms — create own camper's health form"
      - "POST /health-forms/{id}/submit — submit/resubmit own health form"
      - "POST /financial-aid — request aid on own application"
      - "POST /activity-enrollments — book own camper's elective"
      - "POST /activity-enrollments/{id}/drop — drop own booking"
    shared_operations:
      - "POST /canteen-accounts — open canteen account (shared with CampDirector)"
      - "POST /canteen-accounts/{id}/transactions — record canteen txn (shared with CampDirector)"
      - "GET reads on owned/visible resources (campers, applications, sessions, cabins, activities, payments, financial-aid, canteen)"
  - name: CampDirector
    description: "Camp operator. Owns camp config, sessions, cabins, staffing, intake checkpoints, enrollment, bunk assignment, and aid adjudication."
    identity: "opaque"
    exclusive_operations:
      - "POST /camps, PATCH /camps/{id} — manage camp config"
      - "POST /camps/{id}/sessions, POST /sessions/{id}/open-enrollment, POST /sessions/{id}/start, POST /sessions/{id}/close, POST /sessions/{id}/run-intake"
      - "POST /sessions/{id}/cabins, POST /cabins/{id}/assign-bunk"
      - "POST /sessions/{id}/activities — create electives"
      - "POST /camps/{id}/staff, POST /cabin-assignments, POST /cabin-assignments/{id}/release"
      - "POST /applications/{id}/enroll — enroll a deposit-paid application"
      - "POST /financial-aid/{id}/approve, /deny, /revoke — adjudicate aid"
      - "POST /_clock/set_current_utc — set the logical clock"
    shared_operations:
      - "POST /canteen-accounts and /canteen-accounts/{id}/transactions (shared with Guardian)"
      - "GET reads across all resources"
  - name: InfirmaryNurse
    description: "Infirmary staff. Reviews health forms — clears or flags — but cannot enroll, assign bunks, or touch fiscal resources."
    identity: "opaque"
    exclusive_operations:
      - "POST /health-forms/{id}/clear — clear a submitted health form"
      - "POST /health-forms/{id}/flag — flag a submitted health form"
    shared_operations:
      - "GET reads on campers, health-forms, sessions, cabins, activities, applications"
