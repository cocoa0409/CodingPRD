          assert:
            - "After setup: WarRiskPlacement.${plc_id}.status == BOUND and premium_cents == 1800000; WarRiskMarket.${mkt_id}.committed_line_cents == 600000000 and available_line_cents == 400000000; Policy.${pol_id}.written_premium_cents == 3571875"
            - "Trigger call 1 returns 200; WarRiskPlacement.${plc_id}.status == CANCELLED with cancellation_reason stored, and premium_cents == 1800000 is retained on the cancelled row"
            - "CONSERVED QUANTITY: WarRiskMarket.${mkt_id}.committed_line_cents == 0 and available_line_cents == 1000000000, exactly the pre-placement pair — a CANCELLED placement never occupies the line"
            - "One PremiumTransaction is appended, txn_type RETURN_PREMIUM, basis PRO_RATA, endorsement_id null, amount_cents == -1800000, and Policy.${pol_id}.written_premium_cents == 1771875, exactly the pre-placement figure"
            - "GET /aviation/premium-transactions?policy_id=${pol_id} returns total_count 3 after trigger call 1 (INITIAL_PREMIUM +1771875, WAR_RISK_PREMIUM +1800000, RETURN_PREMIUM -1800000) summing to 1771875"
            - "Trigger call 2 shows Policy.${pol_id}.version == ${pol_v_after_bind} + 2 (one bump for the placement, one for the cancellation)"
            - "Trigger call 3 returns 201 on the IDENTICAL coverage window: the released capacity is real, so a line equal to the market's entire 1000000000 aggregate is now admitted (peak_cents over BOUND placements is 0)"
            - "WarRiskPlacement.${plc2_id}.premium_cents == 3000000 (floor(1000000000 * 2400 / 1000000) = 2400000, then ceil(2400000 * 1250000 / 1000000)); WarRiskMarket.${mkt_id}.committed_line_cents == 1000000000 and available_line_cents == 0; Policy.${pol_id}.written_premium_cents == 4771875"
            - "Trigger call 3 does NOT return ERR_PLACEMENT_WINDOW_INVALID even though its closed interval is identical to the cancelled slip's, because priority 29 only considers BOUND placements"
