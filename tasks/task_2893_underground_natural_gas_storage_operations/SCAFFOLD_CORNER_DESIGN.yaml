            - call: "GET /storage-contracts"
              payload: { shipper_id: "${s1}", limit: 100 }
              as: Shipper
              as_user_id: "${s2}"
            - call: "GET /storage-contracts"
              payload: { limit: 2, offset: 0 }
              as: Shipper
              as_user_id: "${s1}"
            - call: "GET /nominations"
              payload: { limit: 100 }
              as: Shipper
              as_user_id: "${s2}"
            - call: "GET /gas-movement-tickets"
              payload: { limit: 100 }
              as: Shipper
              as_user_id: "${s1}"
            - call: "GET /storage-contracts"
              payload: { limit: 100 }
              as: SchedulingCoordinator
          assert:
            - "s1's unfiltered contract list returns HTTP 200 with total_count == 3 and rows ${c1}, ${c2}, ${c3} in created_at ASC order — CS-1 is absent"
            - "s2's unfiltered contract list returns HTTP 200 with total_count == 1 and only ${c4}"
            - "s2 filtering on shipper_id=${s1} returns HTTP 200 with total_count == 0 and an empty data array: the filter intersects the ownership narrowing, it does not replace it, and it is NOT a 403 because no single resource was named"
            - "s1's limit-2 page returns ${c1} and ${c2} with total_count == 3 and has_more == true — total_count is the narrowed count, not the global 4"
            - "s2's nomination list returns total_count == 0 while N1 exists and belongs to s1"
            - "s1's ticket list returns total_count == 0 with has_more == false — s1 owns a nomination but no ticket has been metered yet"
            - "the SchedulingCoordinator's list returns total_count == 4 with all of ${c1}, ${c2}, ${c3}, ${c4}, so the narrowing is Shipper-specific rather than a global filter"

      - name: segregation_of_duties_binds_only_the_prepare_to_submit_pair_on_a_report
        claim_type: segregation_of_duties
        grounds:
          - segregation_of_duties_rules
          - validations.priority_26_ERR_SOD_REMEDIATION_SELF_VERIFICATION
          - entities.RegulatoryReport.fields.prepared_by_user_id
          - entities.RegulatoryReport.fields.submitted_by_user_id
          - roles.ComplianceOfficer.identity
        distinguishing_aspect: |
          The SoD rule is a comparison of two opaque operator ids on ONE pair of steps, and both
          over- and under-enforcement are plausible failures. Over-enforcement: officer-a is barred from
          submitting the report it prepared, but is NOT barred from recording the agency response on
          that same report, because no third rule exists. Under-enforcement: the rule is per report, not
          per person, so officer-a may freely submit a report that officer-b prepared — the two officers
          simply swap roles on the second report, and both submissions must succeed.
        test_recipe:
          setup:
            - "Fields F_MINI and F-TWO, each with one well and no gas movement, so both book inventories are exactly the opening 250000 and every variance is 0.0000."
            - "Report R1 on F_MINI prepared by officer-a; report R2 on F-TWO prepared by officer-b. Both are INVENTORY_VERIFICATION for 2026-08-01..2026-08-31."
          setup_api_calls:
            - call: "POST /storage-fields"
              payload: { name: "Cavern Mini", field_code: "F-MINI", total_capacity_dth: 1000000, cushion_gas_dth: 500000, base_pressure_psig: 800, pressure_span_psig: 1400, max_pressure_psig: 3000, season: "INJECTION", opening_working_gas_dth: 250000, deliverability_method: "CURVE_INTERPOLATED", deliverability_curve: [{ inventory_pct: 0, withdrawal_dth_per_day: 0, injection_dth_per_day: 300000 }, { inventory_pct: 100, withdrawal_dth_per_day: 300000, injection_dth_per_day: 0 }] }
              as: FieldOperator
              captures: { f1: $.data.id }
            - call: "POST /wells"
              payload: { storage_field_id: "${f1}", well_name: "MINI-1", well_type: "INJECTION_WITHDRAWAL", rated_rate_dth_per_day: 600000, last_mit_passed_at: "2026-06-01T00:00:00Z" }
              as: FieldOperator
              captures: { w1: $.data.id }
            - call: "POST /storage-fields"
              payload: { name: "Second Cavern", field_code: "F-TWO", total_capacity_dth: 1000000, cushion_gas_dth: 500000, base_pressure_psig: 800, pressure_span_psig: 1400, max_pressure_psig: 3000, season: "INJECTION", opening_working_gas_dth: 250000, deliverability_method: "CURVE_INTERPOLATED", deliverability_curve: [{ inventory_pct: 0, withdrawal_dth_per_day: 0, injection_dth_per_day: 300000 }, { inventory_pct: 100, withdrawal_dth_per_day: 300000, injection_dth_per_day: 0 }] }
              as: FieldOperator
              captures: { f2: $.data.id }
            - call: "POST /wells"
              payload: { storage_field_id: "${f2}", well_name: "TWO-1", well_type: "INJECTION_WITHDRAWAL", rated_rate_dth_per_day: 600000, last_mit_passed_at: "2026-06-01T00:00:00Z" }
              as: FieldOperator
              captures: { w2: $.data.id }
            - call: "POST /regulatory-reports"
              payload: { storage_field_id: "${f1}", report_type: "INVENTORY_VERIFICATION", period_start_date: "2026-08-01", period_end_date: "2026-08-31", measured_inventory_dth: 250000 }
              as: ComplianceOfficer
              as_user_id: "officer-a"
              captures: { rp1: $.data.id }
            - call: "POST /regulatory-reports"
              payload: { storage_field_id: "${f2}", report_type: "INVENTORY_VERIFICATION", period_start_date: "2026-08-01", period_end_date: "2026-08-31", measured_inventory_dth: 250000 }
              as: ComplianceOfficer
              as_user_id: "officer-b"
              captures: { rp2: $.data.id }
          trigger:
            - call: "POST /regulatory-reports/${rp1}/submit"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-a"
              captures: { e1: $.data.error_id }
            - call: "POST /regulatory-reports/${rp1}/submit"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-b"
            - call: "POST /regulatory-reports/${rp2}/submit"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-b"
              captures: { e2: $.data.error_id }
            - call: "POST /regulatory-reports/${rp2}/submit"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-a"
            - call: "POST /regulatory-reports/${rp1}/record-agency-response"
              payload: { agency_outcome: "ACCEPTED", agency_response_note: "Filed without exception" }
              as: ComplianceOfficer
              as_user_id: "officer-a"
            - call: "GET /storage-fields/${f2}/regulatory-reports"
              payload: { limit: 100 }
              as: ComplianceOfficer
              as_user_id: "officer-b"
          assert:
            - "${e1} == ERR_SOD_REMEDIATION_SELF_VERIFICATION with HTTP 403 and R1 still DRAFT — officer-a prepared it, so officer-a may not submit it"
            - "${e2} == ERR_SOD_REMEDIATION_SELF_VERIFICATION with HTTP 403 for officer-b on R2, proving the rule is keyed on the report's prepared_by_user_id and not on a fixed privileged id"
            - "officer-b's submit of R1 returns HTTP 200 with status SUBMITTED and submitted_by_user_id == officer-b while prepared_by_user_id stays officer-a"
            - "officer-a's submit of R2 returns HTTP 200 with status SUBMITTED and submitted_by_user_id == officer-a — the two officers swap freely across reports, so SoD is per-report and not per-person"
            - "officer-a recording the agency response on R1 returns HTTP 200 with status ACCEPTED: no SoD rule covers the prepare-to-agency-response pair, so the preparer is allowed here"
            - "both reports carry book_inventory_dth == 250000.000, variance_dth == 0.000, variance_pct == 0.0000 and open_finding_count == 0, so neither refusal can be attributed to the priority-38 or priority-39 gates"
            - "each refused submit left submitted_by_user_id null and submitted_at null"

  # =========================================================================
  # CROSS_CUTTING_COMPLEXITY_LAYERS
  # =========================================================================
  - section: cross_cutting_complexity_layers
    instances:

      - name: nomination_create_rejects_a_stale_contract_version_and_supersedes_nothing
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.nomination-create-stale-contract
          - validations.priority_8_ERR_STALE_CONTRACT_VERSION
          - errors.ERR_STALE_CONTRACT_VERSION
          - endpoints[POST /nominations]
          - state_machines.Nomination.transitions.SUBMITTED_to_SUPERSEDED
        distinguishing_aspect: |
          This is the rule's whole reason for existing: a nomination create for an already-nominated
          (contract, gas_day, direction) SUPERSEDES the prior row, so a writer holding a stale contract
          view would silently displace a schedule it never saw. The instance shows the guard on both
          shapes — a create for a NEW gas day and a create that would supersede an existing
          SUBMITTED nomination — proving the 412 fires before the supersede side effect, that the
          refused write leaves StorageContract.version untouched (so a naive "bump on every request"
          implementation diverges immediately), and that a create with the refreshed token then bumps
          the version by exactly 1 and does perform the supersede.
        test_recipe:
          setup:
            - "Field F_MINI with one well MINI-1, shipper NORTHLINE and one ACTIVE FIRM contract CN-1 (100000 Dth/day each way, term 2026-08-01..2026-12-31), clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /storage-fields"
              payload: { name: "Cavern Mini", field_code: "F-MINI", total_capacity_dth: 1000000, cushion_gas_dth: 500000, base_pressure_psig: 800, pressure_span_psig: 1400, max_pressure_psig: 3000, season: "INJECTION", opening_working_gas_dth: 250000, deliverability_method: "CURVE_INTERPOLATED", deliverability_curve: [{ inventory_pct: 0, withdrawal_dth_per_day: 0, injection_dth_per_day: 300000 }, { inventory_pct: 100, withdrawal_dth_per_day: 300000, injection_dth_per_day: 0 }] }
              as: FieldOperator
              captures: { f1: $.data.id }
            - call: "POST /wells"
              payload: { storage_field_id: "${f1}", well_name: "MINI-1", well_type: "INJECTION_WITHDRAWAL", rated_rate_dth_per_day: 600000, last_mit_passed_at: "2026-06-01T00:00:00Z" }
              as: FieldOperator
              captures: { w1: $.data.id }
            - call: "POST /shippers"
              payload: { legal_name: "Northline Gas Marketing", duns_number: "123456789", penalty_threshold_usd: 500000.00 }
              as: SchedulingCoordinator
              captures: { s1: $.data.id }
            - call: "POST /storage-contracts"
              payload: { shipper_id: "${s1}", storage_field_id: "${f1}", contract_code: "CN-1", service_class: "FIRM", max_storage_quantity_dth: 1000000, max_daily_injection_dth: 100000, max_daily_withdrawal_dth: 100000, term_start_date: "2026-08-01", term_end_date: "2026-12-31", commodity_rate_usd_per_dth: 0.0450, index_price_usd_per_dth: 3.4500, cash_out_method: "MONTHLY_AGGREGATE" }
              as: SchedulingCoordinator
              captures: { c1: $.data.id }
            - call: "POST /storage-contracts/${c1}/activate"
              payload: {}
              as: SchedulingCoordinator
            - call: "GET /storage-contracts/${c1}"
              payload: {}
              as: Shipper
              as_user_id: "${s1}"
              captures: { cv1: $.data.version }
            - call: "POST /nominations"
              payload: { contract_id: "${c1}", gas_day: "2026-08-02", direction: "INJECTION", nominated_volume_dth: 80000, expected_contract_version: "${cv1}" }
              as: Shipper
              as_user_id: "${s1}"
              captures: { n1: $.data.id }
            - call: "POST /nominations/${n1}/submit"
              payload: {}
              as: Shipper
              as_user_id: "${s1}"
          trigger:
            - call: "POST /nominations"
              payload: { contract_id: "${c1}", gas_day: "2026-08-03", direction: "INJECTION", nominated_volume_dth: 70000, expected_contract_version: "${cv1}" }
              as: Shipper
              as_user_id: "${s1}"
              captures: { e1: $.data.error_id }
            - call: "POST /nominations"
              payload: { contract_id: "${c1}", gas_day: "2026-08-02", direction: "INJECTION", nominated_volume_dth: 90000, expected_contract_version: "${cv1}" }
              as: Shipper
              as_user_id: "${s1}"
              captures: { e2: $.data.error_id }
            - call: "GET /nominations/${n1}"
              payload: {}
              as: Shipper
              as_user_id: "${s1}"
            - call: "GET /storage-contracts/${c1}"
              payload: {}
              as: Shipper
              as_user_id: "${s1}"
              captures: { cv2: $.data.version }
            - call: "POST /nominations"
              payload: { contract_id: "${c1}", gas_day: "2026-08-02", direction: "INJECTION", nominated_volume_dth: 90000, expected_contract_version: "${cv2}" }
              as: Shipper
              as_user_id: "${s1}"
              captures: { n2: $.data.id }
            - call: "GET /nominations/${n1}"
              payload: {}
              as: Shipper
              as_user_id: "${s1}"
            - call: "GET /storage-contracts/${c1}"
              payload: {}
              as: Shipper
              as_user_id: "${s1}"
              captures: { cv3: $.data.version }
          assert:
            - "the setup create of ${n1} bumped the contract: ${cv2} == ${cv1} + 1, so the token the client is still holding is exactly one behind"
            - "${e1} == ERR_STALE_CONTRACT_VERSION with HTTP 412 — the new-gas-day create is refused purely on the token, even though nothing about gas day 2026-08-03 conflicts with anything"
            - "${e2} == ERR_STALE_CONTRACT_VERSION with HTTP 412 on the would-be superseding create"
            - "after both refusals Nomination.${n1}.status is still SUBMITTED with superseded_by_nomination_id null and nominated_volume_dth 80000 — the supersede side effect never ran"
            - "after both refusals the contract version is still ${cv2}: a refused write must NOT increment version, otherwise the client can never converge"
            - "GET /nominations?contract_id=${c1} returns total_count == 1 — no DRAFT row was left behind by either 412"
            - "the retry with the refreshed ${cv2} returns HTTP 201 for ${n2} with status DRAFT, nominated_volume_dth 90000 and revision_round 0"
            - "Nomination.${n1}.status is now SUPERSEDED with superseded_by_nomination_id == ${n2}, and ${cv3} == ${cv2} + 1 — exactly one bump for the one accepted write"

      - name: ticket_confirm_rejects_a_stale_field_version_then_succeeds_on_the_refreshed_token
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.ticket-confirm-stale-field
          - validations.priority_8_ERR_STALE_CONTRACT_VERSION
          - errors.ERR_STALE_FIELD_VERSION
          - endpoints[POST /gas-movement-tickets/{id}/confirm]
          - calculations.compressor_fuel_burn
        distinguishing_aspect: |
          The field version is advanced here by a THIRD party doing something entirely unrelated to the
          ticket — a compressor run completing and burning 220.80 Dth of fuel gas — which is exactly the
          hazard the rule describes: the operator's stale inventory view would have priced and posted a
          confirmation against an envelope the field no longer holds. The refused confirm must leave the
          ticket PENDING with every charge field still null and the field's inventory untouched, and the
          retry against the refreshed token must then price the ticket from the POST-burn inventory.
        test_recipe:
          setup:
            - "Field F_MINI (opening 250000 of 500000 working gas), well MINI-1, compressor unit U-1 rated 6000 hp with derate 0.00."
            - "Shipper NORTHLINE, ACTIVE FIRM contract CN-1, nomination N1 for 80000 Dth INJECTION on gas day 2026-08-02 confirmed at 80000; GasMovementTicket G1 metered at 80000 Dth but not yet confirmed."
            - "CompressorRun R1 on U-1 over 2026-08-02T00:00:00Z..2026-08-02T08:00:00Z at 3000 hp INJECTION, booked while the clock is still 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /storage-fields"
              payload: { name: "Cavern Mini", field_code: "F-MINI", total_capacity_dth: 1000000, cushion_gas_dth: 500000, base_pressure_psig: 800, pressure_span_psig: 1400, max_pressure_psig: 3000, season: "INJECTION", opening_working_gas_dth: 250000, deliverability_method: "CURVE_INTERPOLATED", deliverability_curve: [{ inventory_pct: 0, withdrawal_dth_per_day: 0, injection_dth_per_day: 300000 }, { inventory_pct: 100, withdrawal_dth_per_day: 300000, injection_dth_per_day: 0 }] }
              as: FieldOperator
              captures: { f1: $.data.id }
            - call: "POST /wells"
              payload: { storage_field_id: "${f1}", well_name: "MINI-1", well_type: "INJECTION_WITHDRAWAL", rated_rate_dth_per_day: 600000, last_mit_passed_at: "2026-06-01T00:00:00Z" }
              as: FieldOperator
              captures: { w1: $.data.id }
            - call: "POST /compressor-units"
              payload: { storage_field_id: "${f1}", unit_code: "U-1", rated_horsepower: 6000, derate_factor: 0.00 }
              as: FieldOperator
              captures: { u1: $.data.id }
            - call: "POST /compressor-runs"
              payload: { compressor_unit_id: "${u1}", window_start_at: "2026-08-02T00:00:00Z", window_end_at: "2026-08-02T08:00:00Z", allocated_horsepower: 3000, mode: "INJECTION" }
              as: FieldOperator
              captures: { r1: $.data.id }
            - call: "POST /shippers"
              payload: { legal_name: "Northline Gas Marketing", duns_number: "123456789", penalty_threshold_usd: 500000.00 }
              as: SchedulingCoordinator
              captures: { s1: $.data.id }
            - call: "POST /storage-contracts"
              payload: { shipper_id: "${s1}", storage_field_id: "${f1}", contract_code: "CN-1", service_class: "FIRM", max_storage_quantity_dth: 1000000, max_daily_injection_dth: 100000, max_daily_withdrawal_dth: 100000, term_start_date: "2026-08-01", term_end_date: "2026-12-31", commodity_rate_usd_per_dth: 0.0450, index_price_usd_per_dth: 3.4500, cash_out_method: "MONTHLY_AGGREGATE" }
              as: SchedulingCoordinator
              captures: { c1: $.data.id }
            - call: "POST /storage-contracts/${c1}/activate"
              payload: {}
              as: SchedulingCoordinator
            - call: "GET /storage-contracts/${c1}"
              payload: {}
              as: Shipper
              as_user_id: "${s1}"
              captures: { cv1: $.data.version }
            - call: "POST /nominations"
              payload: { contract_id: "${c1}", gas_day: "2026-08-02", direction: "INJECTION", nominated_volume_dth: 80000, expected_contract_version: "${cv1}" }
              as: Shipper
              as_user_id: "${s1}"
              captures: { n1: $.data.id }
            - call: "POST /nominations/${n1}/submit"
              payload: {}
              as: Shipper
              as_user_id: "${s1}"
            - call: "POST /nominations/${n1}/confirm"
              payload: {}
              as: SchedulingCoordinator
            - call: "POST /gas-movement-tickets"
              payload: { nomination_id: "${n1}", well_id: "${w1}", actual_volume_dth: 80000 }
              as: FieldOperator
              captures: { g1: $.data.id }
            - call: "GET /storage-fields/${f1}"
              payload: {}
              as: FieldOperator
              captures: { fv1: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T08:00:00Z" }
              as: FieldOperator
            - call: "POST /compressor-runs/${r1}/complete"
              payload: {}
              as: FieldOperator
          trigger:
            - call: "POST /gas-movement-tickets/${g1}/confirm"
              payload: { expected_storage_field_version: "${fv1}" }
              as: FieldOperator
              captures: { e1: $.data.error_id }
            - call: "GET /gas-movement-tickets/${g1}"
              payload: {}
              as: FieldOperator
            - call: "GET /storage-fields/${f1}"
              payload: {}
              as: FieldOperator
              captures: { fv2: $.data.version }
            - call: "POST /gas-movement-tickets/${g1}/confirm"
              payload: { expected_storage_field_version: "${fv2}" }
              as: FieldOperator
            - call: "GET /storage-fields/${f1}"
              payload: {}
              as: FieldOperator
              captures: { fv3: $.data.version }
          assert:
            - "the run completion burned fuel_consumed_dth == 220.80 (3000.00 effective hp * 8 h * 0.0092, MID band, INJECTION multiplier 1.00) and left StorageField.${f1}.working_gas_inventory_dth == 249779.200 with ${fv2} == ${fv1} + 1"
            - "${e1} == ERR_STALE_FIELD_VERSION with HTTP 412 — the operator's token predates a burn it never saw"
            - "after the 412 GasMovementTicket.${g1}.status is still PENDING with fuel_retention_dth, net_volume_dth, commodity_charge_usd, volume_discount_usd, fuel_charge_usd, total_charge_usd and confirmed_at ALL still null"
            - "after the 412 StorageField.${f1}.working_gas_inventory_dth is still 249779.200 and the version is still ${fv2} — a refused confirm moves no gas and burns no version"
            - "the retry with ${fv2} returns HTTP 200: status CONFIRMED, fuel_retention_dth == 960.000, net_volume_dth == 79040.000, commodity_charge_usd == 3600.00, volume_discount_usd == 0.00 (3600.00 is below the 5000 tier), fuel_charge_usd == 3312.00, total_charge_usd == 6912.00"
            - "StorageField.${f1}.working_gas_inventory_dth == 329779.200 and retained_fuel_pool_dth == 960.000, so the accepted confirm priced and posted from the POST-burn inventory, not from the 250000 the stale token described"
            - "${fv3} == ${fv2} + 1 — exactly one version bump for the one accepted confirm"

      - name: mit_failure_cascade_end_to_end_ordering
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers
          - state_machines.MechanicalIntegrityTest.transitions.SCHEDULED_to_FAILED
          - curtailment_sweep.phase_A
          - calculations.field_posture_derivation
        excluded_because:
          difficulty_instance: mit_failure_cascades_through_well_remediation_posture_to_interruptible_curtailment
          rationale: |
            The §1.8 instance already drives the full four-level chain in one call — MIT FAIL shuts the
            well in, opens the RemediationProgram, re-derives field_posture to RESTRICTED and runs
            curtailment sweep phase A over the INTERRUPTIBLE nominations while the FIRM ones survive —
            and it pins the ordering by asserting the intermediate quantities (well_capacity, both
            deliverability rates, the CURTAILMENT_CREDIT ledger rows and the contract version bumps)
            rather than only the end state. A separate corner instance would replay the same chain on
            the same fixture with nothing added.

      - name: deliverability_dual_variant_divergence_and_selection
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers
          - calculations.deliverability_rates.variants.CURVE_INTERPOLATED
          - calculations.deliverability_rates.variants.TIER_FLOOR
          - entities.StorageField.fields.deliverability_method
        excluded_because:
          difficulty_instance: deliverability_curve_interpolated_vs_tier_floor_on_identical_field_state
          rationale: |
            The §1.8 instance already builds two fields with byte-identical capacity, cushion, curve and
            opening inventory that differ only in deliverability_method, asserts both rates on each
            (proving divergence at an inventory_pct strictly between two knots) and then shows the
            selection is driven by the stored flag rather than by the caller — which is exactly the
            "both variants produce expected results" plus "correct variant applied in context" pair this
            layer asks for. The delta-on-switch half of the layer is not reachable here because
            deliverability_method is immutable after create, and that immutability is itself asserted by
            an §1.9 entities instance.

      - name: outstanding_penalty_usd_is_reconciled_across_two_cash_outs_and_one_reversal
        claim_type: derived_field_reconciliation
        grounds:
          - entities.Shipper.fields.outstanding_penalty_usd
          - entities.Shipper.fields.credit_status
          - calculations.imbalance_cash_out.variants.MONTHLY_AGGREGATE
          - endpoints[POST /storage-contracts/{id}/cash-out]
          - endpoints[POST /storage-contracts/{id}/cash-out-reversal]
          - entities.ImbalanceLedgerEntry.fields.entry_type
        distinguishing_aspect: |
          outstanding_penalty_usd is defined as a SUM over the shipper's CASH_OUT and
          CASH_OUT_REVERSAL ledger rows, so it must be right after a create (0.00 with no rows at all),
          after each of two independent source rows on two different contracts (8280.00 then 16560.00),
          and after one of those sources is negated (back to exactly 8280.00 — not 0.00, and not left at
          16560.00). The reversal writes a NEW row of -8280.00 rather than deleting the original, so an
          implementation that recomputes by subtraction and one that re-sums the ledger must agree; and
          because the threshold is 500000.00 the shipper stays credit-GOOD throughout, isolating the
          derived money field from the suspension cascade.
        test_recipe:
          setup:
            - "Field F_MINI (opening 250000 of 500000 working gas), well MINI-1. Shipper NORTHLINE with penalty_threshold_usd 500000.00."
            - "Two ACTIVE MONTHLY_AGGREGATE FIRM contracts CN-1 and CN-2 for the same shipper on the same field, both index_price_usd_per_dth 3.4500 and 100000 Dth/day rights."
            - "CN-1 carries one gas day (2026-08-02) nominated and confirmed at 80000 Dth and metered at 84000 Dth; CN-2 carries the same numbers on gas day 2026-08-03. 84000 is exactly the TICKET_OVERRUN_PCT ceiling round_half_up(80000 * 105 / 100, 0), so both tickets are admissible."
            - "Both nominations are filed and confirmed while the clock is 2026-08-01T00:00:00Z (inside both cutoffs); the clock then moves to 2026-08-04T00:00:00Z before the tickets are metered, confirmed and cashed out."
          setup_api_calls:
            - call: "POST /storage-fields"
              payload: { name: "Cavern Mini", field_code: "F-MINI", total_capacity_dth: 1000000, cushion_gas_dth: 500000, base_pressure_psig: 800, pressure_span_psig: 1400, max_pressure_psig: 3000, season: "INJECTION", opening_working_gas_dth: 250000, deliverability_method: "CURVE_INTERPOLATED", deliverability_curve: [{ inventory_pct: 0, withdrawal_dth_per_day: 0, injection_dth_per_day: 300000 }, { inventory_pct: 100, withdrawal_dth_per_day: 300000, injection_dth_per_day: 0 }] }
              as: FieldOperator
              captures: { f1: $.data.id }
            - call: "POST /wells"
              payload: { storage_field_id: "${f1}", well_name: "MINI-1", well_type: "INJECTION_WITHDRAWAL", rated_rate_dth_per_day: 600000, last_mit_passed_at: "2026-06-01T00:00:00Z" }
              as: FieldOperator
              captures: { w1: $.data.id }
            - call: "POST /shippers"
              payload: { legal_name: "Northline Gas Marketing", duns_number: "123456789", penalty_threshold_usd: 500000.00 }
              as: SchedulingCoordinator
              captures: { s1: $.data.id }
            - call: "POST /storage-contracts"
              payload: { shipper_id: "${s1}", storage_field_id: "${f1}", contract_code: "CN-1", service_class: "FIRM", max_storage_quantity_dth: 1000000, max_daily_injection_dth: 100000, max_daily_withdrawal_dth: 100000, term_start_date: "2026-08-01", term_end_date: "2026-12-31", commodity_rate_usd_per_dth: 0.0450, index_price_usd_per_dth: 3.4500, cash_out_method: "MONTHLY_AGGREGATE" }
              as: SchedulingCoordinator
              captures: { c1: $.data.id }
            - call: "POST /storage-contracts/${c1}/activate"
              payload: {}
              as: SchedulingCoordinator
            - call: "POST /storage-contracts"
              payload: { shipper_id: "${s1}", storage_field_id: "${f1}", contract_code: "CN-2", service_class: "FIRM", max_storage_quantity_dth: 1000000, max_daily_injection_dth: 100000, max_daily_withdrawal_dth: 100000, term_start_date: "2026-08-01", term_end_date: "2026-12-31", commodity_rate_usd_per_dth: 0.0450, index_price_usd_per_dth: 3.4500, cash_out_method: "MONTHLY_AGGREGATE" }
              as: SchedulingCoordinator
              captures: { c2: $.data.id }
            - call: "POST /storage-contracts/${c2}/activate"
              payload: {}
              as: SchedulingCoordinator
            - call: "GET /storage-contracts/${c1}"
              payload: {}
              as: Shipper
              as_user_id: "${s1}"
              captures: { cv1: $.data.version }
            - call: "POST /nominations"
              payload: { contract_id: "${c1}", gas_day: "2026-08-02", direction: "INJECTION", nominated_volume_dth: 80000, expected_contract_version: "${cv1}" }
              as: Shipper
              as_user_id: "${s1}"
              captures: { n1: $.data.id }
            - call: "POST /nominations/${n1}/submit"
              payload: {}
              as: Shipper
              as_user_id: "${s1}"
            - call: "POST /nominations/${n1}/confirm"
              payload: {}
              as: SchedulingCoordinator
            - call: "GET /storage-contracts/${c2}"
              payload: {}
              as: Shipper
              as_user_id: "${s1}"
              captures: { cv2: $.data.version }
            - call: "POST /nominations"
              payload: { contract_id: "${c2}", gas_day: "2026-08-03", direction: "INJECTION", nominated_volume_dth: 80000, expected_contract_version: "${cv2}" }
              as: Shipper
              as_user_id: "${s1}"
              captures: { n2: $.data.id }
            - call: "POST /nominations/${n2}/submit"
              payload: {}
              as: Shipper
              as_user_id: "${s1}"
            - call: "POST /nominations/${n2}/confirm"
              payload: {}
              as: SchedulingCoordinator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-04T00:00:00Z" }
              as: FieldOperator
            - call: "POST /gas-movement-tickets"
              payload: { nomination_id: "${n1}", well_id: "${w1}", actual_volume_dth: 84000 }
              as: FieldOperator
              captures: { g1: $.data.id }
            - call: "GET /storage-fields/${f1}"
              payload: {}
              as: FieldOperator
              captures: { fv1: $.data.version }
            - call: "POST /gas-movement-tickets/${g1}/confirm"
              payload: { expected_storage_field_version: "${fv1}" }
              as: FieldOperator
            - call: "POST /gas-movement-tickets"
              payload: { nomination_id: "${n2}", well_id: "${w1}", actual_volume_dth: 84000 }
              as: FieldOperator
              captures: { g2: $.data.id }
            - call: "GET /storage-fields/${f1}"
              payload: {}
              as: FieldOperator
              captures: { fv2: $.data.version }
            - call: "POST /gas-movement-tickets/${g2}/confirm"
              payload: { expected_storage_field_version: "${fv2}" }
              as: FieldOperator
            - call: "GET /shippers/${s1}"
              payload: {}
              as: SchedulingCoordinator
          trigger:
            - call: "POST /storage-contracts/${c1}/cash-out"
              payload: { period_start_date: "2026-08-01", period_end_date: "2026-08-03" }
              as: SchedulingCoordinator
            - call: "GET /shippers/${s1}"
              payload: {}
              as: SchedulingCoordinator
            - call: "POST /storage-contracts/${c2}/cash-out"
              payload: { period_start_date: "2026-08-01", period_end_date: "2026-08-03" }
              as: SchedulingCoordinator
            - call: "GET /shippers/${s1}"
              payload: {}
              as: SchedulingCoordinator
            - call: "POST /storage-contracts/${c2}/cash-out-reversal"
              payload: { reason: "Metering correction accepted by the shipper" }
              as: SchedulingCoordinator
            - call: "GET /shippers/${s1}"
              payload: {}
              as: SchedulingCoordinator
            - call: "GET /storage-contracts/${c2}/imbalance-ledger-entries"
              payload: { limit: 100 }
              as: SchedulingCoordinator
          assert:
            - "immediately after create and again after both ticket confirms, Shipper.${s1}.outstanding_penalty_usd == 0.00 with credit_status GOOD — the derived field is 0.00 with no source rows, not null"
            - "each ticket confirm appended one DAILY_IMBALANCE entry of +4000.000 Dth (84000 metered against 80000 confirmed) to its own contract, leaving StorageContract.imbalance_dth == 4000.000 on both"
            - "the CN-1 cash-out assesses sched_total 80000, tolerance 1600.000, billable 2400.000, pct 3.0000 (band 1, multiplier 1.00) and amount == round_half_up(2400.000 * 3.4500 * 1.00, 2) == 8280.00"
            - "after the first cash-out Shipper.${s1}.outstanding_penalty_usd == 8280.00 and credit_status is still GOOD (8280.00 < 500000.00); StorageContract.${c1}.imbalance_dth == 0.000 with cash_out_through_date 2026-08-03"
            - "the CN-2 cash-out is computed independently and also yields 8280.00, so after it Shipper.${s1}.outstanding_penalty_usd == 16560.00 — the derived field accumulates across contracts of the same shipper, and still GOOD"
            - "the reversal appends a CASH_OUT_REVERSAL entry with amount_usd == -8280.00 and gas_day null, and does NOT delete the CASH_OUT row"
            - "after the reversal Shipper.${s1}.outstanding_penalty_usd == 8280.00 exactly — CN-1's assessment survives untouched; it is neither 0.00 (over-reversal) nor 16560.00 (no reconciliation)"
            - "StorageContract.${c2}.cash_out_amount_usd == 0.00, cash_out_through_date is back to null and imbalance_dth is back to 4000.000, while StorageContract.${c1} is unchanged at cash_out_amount_usd 8280.00"
            - "GET /storage-contracts/${c2}/imbalance-ledger-entries returns total_count == 3 in created_at ASC order: the DAILY_IMBALANCE of +4000.000, the CASH_OUT of 8280.00 and the CASH_OUT_REVERSAL of -8280.00"
            - "both contracts are still ACTIVE and no nomination was curtailed or rejected — the suspension cascade never fired, so the reconciliation is observed in isolation"

  # =========================================================================
  # CONSISTENCY_MODEL
  # =========================================================================
  - section: consistency_model
    instances:

      - name: well_service_change_publishes_the_recomputed_field_in_the_same_request
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints[POST /wells/{id}/service-change]
          - calculations.deliverability_rates
          - calculations.field_posture_derivation
          - entities.StorageField.fields.wells_in_service_count
          - validations.priority_9_ERR_FIELD_FROZEN
        distinguishing_aspect: |
          The consistency model is `immediate`, so the denormalised block on StorageField —
          wells_in_service_count, both deliverability rates and field_posture — must be correct on the
          very next read with no retry, no second write and no background pass. The fixture makes the
          lag observable: two wells rated 60000 each cap the rates BELOW the curve (120000 against a
          curve value of 150000 at 50.00% inventory), so shutting one in must drop both rates to exactly
          60000, and shutting the second in must drop them to 0 and flip field_posture to FROZEN — which
          is then immediately enforceable, because the nomination confirm that would have succeeded one
          call earlier is refused with ERR_FIELD_FROZEN.
        test_recipe:
          setup:
            - "Field F_MINI (total 1000000, cushion 500000, opening 250000 -> 50.00% inventory, curve value 150000 each way) with two INJECTION_WITHDRAWAL wells MINI-1 and MINI-2 rated 60000 Dth/day each, so well_capacity 120000 binds below the curve."
            - "Shipper NORTHLINE with ACTIVE FIRM contract CN-1 and one SUBMITTED nomination N1 for 50000 Dth INJECTION on gas day 2026-08-02, clock 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /storage-fields"
              payload: { name: "Cavern Mini", field_code: "F-MINI", total_capacity_dth: 1000000, cushion_gas_dth: 500000, base_pressure_psig: 800, pressure_span_psig: 1400, max_pressure_psig: 3000, season: "INJECTION", opening_working_gas_dth: 250000, deliverability_method: "CURVE_INTERPOLATED", deliverability_curve: [{ inventory_pct: 0, withdrawal_dth_per_day: 0, injection_dth_per_day: 300000 }, { inventory_pct: 100, withdrawal_dth_per_day: 300000, injection_dth_per_day: 0 }] }
              as: FieldOperator
              captures: { f1: $.data.id }
            - call: "POST /wells"
              payload: { storage_field_id: "${f1}", well_name: "MINI-1", well_type: "INJECTION_WITHDRAWAL", rated_rate_dth_per_day: 60000, last_mit_passed_at: "2026-06-01T00:00:00Z" }
              as: FieldOperator
              captures: { w1: $.data.id }
            - call: "POST /wells"
              payload: { storage_field_id: "${f1}", well_name: "MINI-2", well_type: "INJECTION_WITHDRAWAL", rated_rate_dth_per_day: 60000, last_mit_passed_at: "2026-06-01T00:00:00Z" }
              as: FieldOperator
              captures: { w2: $.data.id }
            - call: "POST /shippers"
              payload: { legal_name: "Northline Gas Marketing", duns_number: "123456789", penalty_threshold_usd: 500000.00 }
              as: SchedulingCoordinator
              captures: { s1: $.data.id }
            - call: "POST /storage-contracts"
              payload: { shipper_id: "${s1}", storage_field_id: "${f1}", contract_code: "CN-1", service_class: "FIRM", max_storage_quantity_dth: 1000000, max_daily_injection_dth: 100000, max_daily_withdrawal_dth: 100000, term_start_date: "2026-08-01", term_end_date: "2026-12-31", commodity_rate_usd_per_dth: 0.0450, index_price_usd_per_dth: 3.4500, cash_out_method: "MONTHLY_AGGREGATE" }
              as: SchedulingCoordinator
              captures: { c1: $.data.id }
            - call: "POST /storage-contracts/${c1}/activate"
              payload: {}
              as: SchedulingCoordinator
            - call: "GET /storage-contracts/${c1}"
              payload: {}
              as: Shipper
              as_user_id: "${s1}"
              captures: { cv1: $.data.version }
            - call: "POST /nominations"
              payload: { contract_id: "${c1}", gas_day: "2026-08-02", direction: "INJECTION", nominated_volume_dth: 50000, expected_contract_version: "${cv1}" }
              as: Shipper
              as_user_id: "${s1}"
              captures: { n1: $.data.id }
            - call: "POST /nominations/${n1}/submit"
              payload: {}
              as: Shipper
              as_user_id: "${s1}"
            - call: "GET /storage-fields/${f1}"
              payload: {}
              as: FieldOperator
              captures: { fv1: $.data.version }
          trigger:
            - call: "POST /wells/${w1}/service-change"
              payload: { to_operational_state: "SHUT_IN", reason: "Tubing inspection" }
              as: FieldOperator
            - call: "GET /storage-fields/${f1}"
              payload: {}
              as: SchedulingCoordinator
              captures: { fv2: $.data.version }
            - call: "POST /wells/${w2}/service-change"
              payload: { to_operational_state: "SHUT_IN", reason: "Tubing inspection" }
              as: FieldOperator
            - call: "GET /storage-fields/${f1}"
              payload: {}
              as: SchedulingCoordinator
              captures: { fv3: $.data.version }
            - call: "POST /nominations/${n1}/confirm"
              payload: {}
              as: SchedulingCoordinator
              captures: { e1: $.data.error_id }
            - call: "GET /wells"
              payload: { storage_field_id: "${f1}", operational_state: "IN_SERVICE", limit: 100 }
              as: SchedulingCoordinator
          assert:
            - "before any shut-in the field reads wells_in_service_count == 2 with max_withdrawal_rate_dth_per_day == 120000 and max_injection_rate_dth_per_day == 120000 — the 60000 + 60000 well capacity binds below the curve's 150000"
            - "the first service-change response is the Well row with operational_state SHUT_IN and shut_in_reason \"Tubing inspection\"; the very next field read shows wells_in_service_count == 1 and BOTH rates == 60000 with no retry"
            - "after the first shut-in field_posture is still OPEN: the ladder's FROZEN clause needs zero in-service wells, no emergency is RESPONDING, no well is MIT_FAILED and 1500 psig is under the 2850 posture ceiling"
            - "inventory_pct is still 50.00, current_pressure_psig still 1500 and deliverability_tier still TIER_3 — a shut-in moves the well capacity, never the inventory"
            - "after the second shut-in the next field read shows wells_in_service_count == 0, max_withdrawal_rate_dth_per_day == 0, max_injection_rate_dth_per_day == 0 and field_posture == FROZEN"
            - "${e1} == ERR_FIELD_FROZEN with HTTP 422 on the nomination confirm that the same fixture would have accepted at 50000 Dth one call earlier — the recomputed posture is enforceable immediately, not eventually"
            - "${fv2} == ${fv1} + 1 and ${fv3} == ${fv2} + 1: each service-change bumps the field version exactly once, and the refused confirm bumps nothing"
            - "GET /wells?operational_state=IN_SERVICE returns total_count == 0 while Nomination.${n1} is still SUBMITTED with confirmed_volume_dth 0"
