            - { call: "POST /surveillance/orders/${o1}/transition", payload: { to_status: "EXECUTED", executed_price_cents: 10000, executed_at: "2026-08-03T15:00:00Z" }, as: OpsAdmin }
            - { call: "POST /surveillance/orders", payload: { client_ref: "E2", symbol: "BBB", side: "BUY", quantity: 100, order_type: "MARKET", arrival_nbbo_bid_cents: 9990, arrival_nbbo_ask_cents: 10010 }, as: OpsAdmin, captures: { o2: "$.data.id" } }
            - { call: "POST /surveillance/orders/${o2}/transition", payload: { to_status: "ROUTED", arrangement_id: "${a_id}" }, as: OpsAdmin }
            - { call: "POST /surveillance/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T15:10:00Z" }, as: OpsAdmin }
            - { call: "POST /surveillance/orders/${o2}/transition", payload: { to_status: "EXECUTED", executed_price_cents: 10000, executed_at: "2026-08-03T15:06:00Z" }, as: OpsAdmin }
            - { call: "GET /surveillance/surveillance-alerts", payload: { related_order_id: "${o1}" }, as: SurveillanceAnalyst, captures: { a1_id: "$.data[0].id", a1_score: "$.data[0].score" } }
            - { call: "GET /surveillance/surveillance-alerts", payload: { related_order_id: "${o2}" }, as: SurveillanceAnalyst, captures: { a2_id: "$.data[0].id", a2_score: "$.data[0].score" } }
          trigger:
            - { call: "POST /surveillance/surveillance-alerts/${a2_id}/transition", payload: { to_status: "ESCALATED" }, as: SurveillanceAnalyst, captures: { e_esc49: "$.data.error_id" } }
            - { call: "POST /surveillance/surveillance-alerts/${a1_id}/transition", payload: { to_status: "CLOSED_FALSE_POSITIVE" }, as: SurveillanceAnalyst, captures: { e_cls50: "$.data.error_id" } }
            - { call: "POST /surveillance/surveillance-alerts/${a2_id}/transition", payload: { to_status: "CLOSED_FALSE_POSITIVE" }, as: SurveillanceAnalyst, captures: { a2_final: "$.data.status" } }
            - { call: "POST /surveillance/surveillance-alerts/${a1_id}/transition", payload: { to_status: "ACKNOWLEDGED" }, as: SurveillanceAnalyst }
            - { call: "POST /surveillance/surveillance-alerts/${a1_id}/transition", payload: { to_status: "ESCALATED" }, as: SurveillanceAnalyst, captures: { a1_final: "$.data.status" } }
          assert:
            - "Scores pinned: ${a1_score} == 50 and ${a2_score} == 49"
            - "score 49 escalate: ${e_esc49} == ERR_ALERT_SCORE_BELOW_ESCALATION"
            - "score 50 close-as-false-positive: ${e_cls50} == ERR_ALERT_SCORE_ABOVE_FP_CEILING"
            - "score 49 closes: ${a2_final} == CLOSED_FALSE_POSITIVE"
            - "score 50 escalates (>= boundary inclusive): ${a1_final} == ESCALATED"

      - name: comm_score_tier_boundaries_100_and_40
        grounds:
          - calculations.calc_lexicon_score
          - state_machines.CommReviewItem
          - endpoints["POST /surveillance/comm-review-items"]
        distinguishing_aspect: |
          Two exact thresholds on the lexicon score metric via the capture endpoint:
          100 auto-escalates AND creates a case (>= inclusive), 99 queues; 40 queues
          (>= inclusive), 39 auto-clears. Different metric (lexicon weight sum) and
          different endpoint (POST /comm-review-items) than the sibling instance.
        test_recipe:
          setup:
            - "Employee EMP-801 ACTIVE/CURRENT"
            - "ACTIVE LexiconPolicy with terms: guarantee=60, insider=40, confident=39"
          setup_api_calls:
            - { call: "POST /surveillance/employees", payload: { full_name: "Tia Lex", employee_ref: "EMP-801", department: "TRADING", attestation_due_at: "2027-01-01T00:00:00Z" }, as: ComplianceAdmin, captures: { e_id: "$.data.id" } }
            - { call: "POST /surveillance/lexicon-policies", payload: { name: "LX", terms: [ { term: "guarantee", weight: 60 }, { term: "insider", weight: 40 }, { term: "confident", weight: 39 } ] }, as: ComplianceAdmin, captures: { l_id: "$.data.id", l_v1: "$.data.version" } }
            - { call: "PATCH /surveillance/lexicon-policies/${l_id}", payload: { expected_lexicon_policy_version: "${l_v1}", to_status: "ACTIVE" }, as: ComplianceAdmin }
          trigger:
            - { call: "POST /surveillance/comm-review-items", payload: { channel: "EMAIL", author_employee_id: "${e_id}", body_text: "We guarantee returns with insider diligence" }, as: OpsAdmin, captures: { i100: "$.data.id", s100: "$.data.score", st100: "$.data.status" } }
            - { call: "POST /surveillance/comm-review-items", payload: { channel: "CHAT", author_employee_id: "${e_id}", body_text: "guarantee confident" }, as: OpsAdmin, captures: { i99: "$.data.id", s99: "$.data.score", st99: "$.data.status" } }
            - { call: "POST /surveillance/comm-review-items", payload: { channel: "CHAT", author_employee_id: "${e_id}", body_text: "insider" }, as: OpsAdmin, captures: { s40: "$.data.score", st40: "$.data.status" } }
            - { call: "POST /surveillance/comm-review-items", payload: { channel: "EMAIL", author_employee_id: "${e_id}", body_text: "confident" }, as: OpsAdmin, captures: { s39: "$.data.score", st39: "$.data.status" } }
            - { call: "GET /surveillance/surveillance-cases", payload: { source_comm_item_id: "${i100}" }, as: SurveillanceAnalyst, captures: { c_from: "$.data[0].opened_from", c_rev: "$.data[0].review_status" } }
          assert:
            - "score == 100: ${s100} == 100, ${st100} == ESCALATED — >= boundary inclusive, case auto-created (${c_from} == COMM_REVIEW, ${c_rev} == OPEN)"
            - "score == 99: ${s99} == 99, ${st99} == QUEUED — one weight point below auto-escalation"
            - "score == 40: ${s40} == 40, ${st40} == QUEUED — review floor inclusive"
            - "score == 39: ${s39} == 39, ${st39} == CLEARED — one point below the floor"

