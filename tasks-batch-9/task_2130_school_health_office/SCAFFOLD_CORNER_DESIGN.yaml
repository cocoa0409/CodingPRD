          - entities.DisclosureRequest.fields.release_package_item_count
          - state_machines.DisclosureRequest.APPROVED_to_RELEASED
        distinguishing_aspect: "purpose_code ENROLLMENT forces redaction_level PARTIAL, which subtracts the 1 MENTAL_HEALTH visit from the 2 CLOSED visits and the 1 controlled METHYLPHENIDATE order from the 2 CONSENT_GRANTED orders, so a scope of [VISITS, MEDICATIONS] releases exactly 2 items, not 4."
