          setup:
            - "Client Acme (margin_floor_pct 20.0), post at bill_rate 4500 with four checkpoint tags."
            - "Guard Grace worked 2026-05-04T08:00Z→16:12Z with a 30-min break, scanned all 4 tags (tour 100.0, no SLA credit): final_billable 34875, pay 17050."
            - "The shift is VERIFIED; a DRAFT invoice for [2026-05-04, 2026-05-11) has subtotal 34875, admin_fee_pct 8.0, admin_fee 2790, total 37665, margin_pct 51.11."
            - "Client.outstanding_balance_cents == 0 and Client.paid_to_date_cents == 0 while the invoice is DRAFT."
