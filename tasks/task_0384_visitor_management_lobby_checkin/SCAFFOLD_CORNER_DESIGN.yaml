              payload: {}
              as: SecurityOfficer
          trigger:
            - call: "POST /visits/${visit_id}/clearance"
              payload: { decision: "CLEAR", expected_visit_version: "${visit_v0}" }
              as: SecurityOfficer
              as_user_id: "officer-1"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_STALE_VISIT_VERSION"
            - "Visit.${visit_id}.status == FLAGGED"

