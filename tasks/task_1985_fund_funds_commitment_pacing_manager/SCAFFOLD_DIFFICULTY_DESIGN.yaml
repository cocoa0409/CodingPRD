  - rule_id: transitive_cascade
    instances:
      - name: manager_suspend_cascade_depth3
        grounds:
          - state_machines.Manager.APPROVED_to_SUSPENDED
          - state_machines.FundVehicle.IN_DILIGENCE_to_DECLINED
          - state_machines.DueDiligenceReview.DRAFT_to_WITHDRAWN
          - state_machines.InvestmentProposal.DRAFT_to_WITHDRAWN
        distinguishing_aspect: |
          Depth-3 cascade triggered by POST /managers/{id}/suspend:
          Manager APPROVED -> SUSPENDED mutates FundVehicle (IN_DILIGENCE ->
          DECLINED); that vehicle mutation itself forces DueDiligenceReview
          (DRAFT/SUBMITTED/INFO_REQUESTED -> WITHDRAWN); and the vehicle-level
