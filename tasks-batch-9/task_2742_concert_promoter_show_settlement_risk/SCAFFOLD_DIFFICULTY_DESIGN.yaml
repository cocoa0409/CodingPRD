# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Task 2742 — Concert Promoter Show Settlement & Risk
#
# Nine Difficulty Rules from SKILL.md §0.5, each with >= 2 instances (20 total).
# Every money literal in an `assert:` line was produced by executing the matching
# calculations[].formula from SCAFFOLD.yaml §1.3 as code against the pinned setup.
#
# Fixture vocabulary used repeatedly below:
#   FIXTURE A "big co-promote show"  — Harbor Arena, 3000 cap, 8.00% ticket tax,
#     350 facility fee; GUARANTEE_PLUS_BACKEND 5000000 guarantee / 85.00% backend;
#     GA 2000 @ 5000 -> repriced 6000, PIT 500 @ 9500; 60 GA comps, 50 PIT production
#     holds; four budget lines 1500000/800000/600000/200000; 1800 paid tickets;
#     adjusted_gross 9595800.
#   FIXTURE B "small rental show"    — Riverside Hall, 1200 cap, 10.00% ticket tax,
#     300 facility fee; FLAT_GUARANTEE 2000000 / RENTAL 500000; GA 1000 @ 5000, 400 sold.
# The logical clock starts at the mandatory default 2026-08-01T00:00:00Z; every
# time-gated step moves it with POST /_clock/set_current_utc.

scaffold_difficulty_design:

  # =====================================================================
  # RULE 1 — dual_variant_calc
  # =====================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: settlement_projection_provisional_versus_final_diverge_on_identical_show
        grounds:
          - "calculations.show_settlement_projection"
          - "calculations.artist_settlement_earnings"
          - "entities.Show.fields.projected_adjusted_gross_cents"
          - "entities.Settlement.fields.adjusted_gross_cents"
          - "endpoints[GET /shows/{show_id}/settlement-projection]"
        distinguishing_aspect: |
          This instance's two variants live in the SHOW/SETTLEMENT domain (per-show ticket
          revenue and per-show expense recognition): PROVISIONAL values the full sellable
          allocation at the CURRENT tier price and deducts BUDGETED deductible expense,
          while FINAL values only tickets actually sold at their as-sold prices and deducts
          RECOGNISED (variance-capped) expense — on byte-identical stored data the same show
          yields adjusted_gross 13439255 vs 9595800 and artist_earnings 9648367 vs 6200108,
          and the binding co-op leg itself switches from the SHARE leg to the CAP leg.
        test_recipe:
          setup:
            - "FIXTURE A exists and has reached show_status PERFORMED with a DRAFT Settlement."
            - "Tiers: GA allocation 2000, comp_qty 60, sold_qty 1400 (800 at 5000 then 600 at the revised 6000); PIT allocation 500, held_qty 50, sold_qty 400 at 9500."
            - "Budget lines: PRODUCTION 1500000 budgeted / 1650000 actual (variance exactly 10.00% -> WITHIN_TOLERANCE, deductible); MARKETING 800000 / 900000 (12.50% -> APPROVED cap 900000, deductible); STAFFING 600000 / 600000 (0.00%, NOT deductible); HOSPITALITY 200000 / 260000 (30.00% -> APPROVED cap 250000, deductible)."
            - "No BudgetLine is PENDING_APPROVAL and no VendorInvoice is SUBMITTED/VERIFIED/DISPUTED, so calculate is unblocked."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00.000Z" }
              as: RiskOfficer
            - call: "POST /markets"
              payload: { name: "Pacific Northwest", region_code: "PNW", guarantee_exposure_limit_cents: 10000000 }
              as: RiskOfficer
              captures: { mk_id: $.data.id }
            - call: "POST /artists"
              payload: { name: "Aurora Sky", agency: "Meridian Talent", tier: "ARENA", historical_sellthrough_pct: 82.00, withholding_pct: 0 }
              as: TalentBuyer
              captures: { ar_id: $.data.id }
            - call: "POST /venues"
              payload: { market_id: "${mk_id}", name: "Harbor Arena", gross_capacity: 3000, facility_fee_cents_per_ticket: 350, ticket_tax_pct: 8.00 }
              as: TalentBuyer
              captures: { vn_id: $.data.id }
            - call: "POST /shows"
              payload: { artist_id: "${ar_id}", venue_id: "${vn_id}", event_at: "2026-10-10T02:00:00.000Z", load_in_at: "2026-10-09T14:00:00.000Z", load_out_at: "2026-10-10T08:00:00.000Z", announce_at: "2026-08-15T15:00:00.000Z", venue_arrangement: "CO_PROMOTE", copromote_venue_share_pct: 15.00, venue_expense_pct_production: 50.00, venue_expense_pct_marketing: 25.00, venue_expense_pct_staffing: 100.00, venue_expense_pct_hospitality: 0 }
              as: TalentBuyer
              captures: { sh_id: $.data.id, sh_v1: $.data.version }
            - call: "POST /offers"
              payload: { show_id: "${sh_id}", expected_show_version: "${sh_v1}", deal_structure: "GUARANTEE_PLUS_BACKEND", guarantee_cents: 5000000, deposit_cents: 1000000, expense_cap_cents: 4000000, backend_split_artist_pct: 85.00 }
              as: TalentBuyer
              captures: { of_id: $.data.id }
            - call: "POST /offers/${of_id}/submit"
              payload: {}
              as: TalentBuyer
            - call: "POST /offers/${of_id}/accept"
              payload: {}
              as: ArtistRep
              as_user_id: "${ar_id}"
            - call: "POST /ticket-tiers"
              payload: { show_id: "${sh_id}", tier_name: "GA", price_cents: 5000, allocation_qty: 2000 }
              as: TalentBuyer
              captures: { ga_id: $.data.id }
            - call: "POST /ticket-tiers"
              payload: { show_id: "${sh_id}", tier_name: "PIT", price_cents: 9500, allocation_qty: 500 }
              as: TalentBuyer
              captures: { pit_id: $.data.id }
            - call: "POST /ticket-holds"
              payload: { ticket_tier_id: "${ga_id}", kind: "COMP", qty: 60, holder: "artist guest list" }
              as: TalentBuyer
              captures: { hold_comp_id: $.data.id }
            - call: "POST /ticket-holds"
              payload: { ticket_tier_id: "${pit_id}", kind: "PRODUCTION_HOLD", qty: 50, holder: "front of house mix position" }
              as: TalentBuyer
              captures: { hold_prod_id: $.data.id }
            - call: "POST /budget-lines"
              payload: { show_id: "${sh_id}", category: "PRODUCTION", description: "stage, lighting and audio package", budgeted_cents: 1500000, is_artist_deductible: true }
              as: TourAccountant
              captures: { bl_prod_id: $.data.id }
            - call: "POST /budget-lines"
