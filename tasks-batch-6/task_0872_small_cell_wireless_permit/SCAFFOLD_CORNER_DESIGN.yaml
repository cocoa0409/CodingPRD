scaffold_corner_design:

  # ================================================================
  - section: entities
    instances:
      - name: create_applicant_returns_201_and_defaults
        claim_type: Creation
        grounds: [entities.Applicant.fields.certification_status, entities.Applicant.fields.master_agreement_signed]
        distinguishing_aspect: "POST /applicants with company_name+contact_email returns 201; certification_status defaults REGISTERED, master_agreement_signed defaults false, version starts at 1."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /applicants"
              payload: { company_name: "Acme Wireless", contact_email: "ops@acme.example" }
              as: PlatformAdmin
              captures: { applicant_id: $.data.id }
          assert:
            - "HTTP 201; data.certification_status == REGISTERED"
            - "data.master_agreement_signed == false"
            - "data.version == 1 and data.id is a server-minted UUID with no prefix"

      - name: get_applicant_not_found
        claim_type: Not Found
        grounds: ["errors[ERR_APPLICANT_NOT_FOUND]"]
        distinguishing_aspect: "GET /applicants/{unknown-uuid} returns ERR_APPLICANT_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /applicants/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404; error_id == ERR_APPLICANT_NOT_FOUND"

      - name: create_application_missing_no_required_fields_but_records_owner
        claim_type: System Fields
        grounds: [entities.PermitApplication.fields.applicant_id, entities.PermitApplication.fields.status]
        distinguishing_aspect: "POST /applications sets applicant_id from X-User-ID and status DRAFT; client-supplied status is ignored."
        test_recipe:
          setup: ["A registered applicant."]
          setup_api_calls:
            - call: "POST /applicants"
              payload: { company_name: "Beta Telecom", contact_email: "b@beta.example" }
              as: PlatformAdmin
              captures: { applicant_id: $.data.id }
          trigger:
            - call: "POST /applications"
              payload: { project_name: "Job" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { app_id: $.data.id }
          assert:
            - "HTTP 201; data.status == DRAFT; data.applicant_id == ${applicant_id}"

      - name: node_computed_available_collocations
        claim_type: Computed Fields
        grounds: [entities.SupportStructure.fields.available_collocations]
        distinguishing_aspect: "available_collocations == max_collocations - reserved - active; a freshly created max=3 structure reads 3."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /support-structures"
              payload: { structure_type: "EXISTING_UTILITY", max_collocations: 3, in_design_district: "NONE" }
              as: PlatformAdmin
              captures: { ss_id: $.data.id }
          assert:
            - "data.available_collocations == 3; data.reserved_collocations == 0; data.active_collocations == 0"

      - name: create_support_structure_invalid_enum
        claim_type: Type Constraints
        grounds: [entities.SupportStructure.fields.structure_type, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "structure_type outside {EXISTING_UTILITY, EXISTING_MUNICIPAL, NEW_POLE} -> ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /support-structures"
              payload: { structure_type: "WOODEN", max_collocations: 2 }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 422; error_id == ERR_INVALID_REQUEST"

      - name: add_node_missing_required_field
        claim_type: Required Fields
        grounds: [entities.Node.fields.support_structure_id, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /applications/{id}/nodes without support_structure_id -> ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["A DRAFT application, a segment."]
          setup_api_calls:
            - call: "POST /applicants"
              payload: { company_name: "Gamma", contact_email: "g@g.example" }
              as: PlatformAdmin
              captures: { applicant_id: $.data.id }
            - call: "POST /row-segments"
              payload: { name: "S", corridor_code: "K-1" }
              as: PlatformAdmin
              captures: { seg_id: $.data.id }
            - call: "POST /applications"
              payload: {}
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { app_id: $.data.id }
          trigger:
            - call: "POST /applications/${app_id}/nodes"
              payload: { facility_type: "COLLOCATION", row_segment_id: "${seg_id}", proposed_construction_date: "2026-06-15T00:00:00Z" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 422; error_id == ERR_INVALID_REQUEST"

      - name: list_applications_paginated
        claim_type: Listing
        grounds: [entities.PermitApplication.fields.applicant_id]
        distinguishing_aspect: "GET /applications?applicant_id=... returns an array envelope with pagination fields total_count and has_more."
        test_recipe:
          setup: ["One applicant with one application."]
          setup_api_calls:
            - call: "POST /applicants"
              payload: { company_name: "Delta", contact_email: "d@d.example" }
              as: PlatformAdmin
              captures: { applicant_id: $.data.id }
            - call: "POST /applications"
              payload: {}
              as: Applicant
              as_user_id: "${applicant_id}"
          trigger:
            - call: "GET /applications?applicant_id=${applicant_id}"
              payload: {}
              as: Applicant
              as_user_id: "${applicant_id}"
          assert:
            - "response_type == array; meta pagination has total_count == 1 and has_more == false"

  # ================================================================
  - section: state_machines
    instances:
      - name: add_node_to_non_draft_application_rejected
        claim_type: invalid_transition
        grounds: [state_machines.PermitApplication.DRAFT_to_SUBMITTED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Adding a node to a SUBMITTED application fails ERR_INVALID_STATE (nodes may only be added in DRAFT)."
        test_recipe:
          setup: ["A submitted 1-node application."]
          setup_api_calls:
            - call: "POST /applicants"
              payload: { company_name: "Eta", contact_email: "h@h.example" }
              as: PlatformAdmin
              captures: { applicant_id: $.data.id }
            - call: "POST /applicants/${applicant_id}/sign-master-agreement"
              payload: {}
              as: Applicant
              as_user_id: "${applicant_id}"
            - call: "POST /support-structures"
              payload: { structure_type: "EXISTING_UTILITY", max_collocations: 2 }
              as: PlatformAdmin
              captures: { ss_id: $.data.id }
            - call: "POST /row-segments"
              payload: { name: "S", corridor_code: "K-2" }
              as: PlatformAdmin
              captures: { seg_id: $.data.id }
            - call: "POST /applications"
              payload: {}
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/nodes"
              payload: { facility_type: "COLLOCATION", support_structure_id: "${ss_id}", row_segment_id: "${seg_id}", proposed_construction_date: "2026-06-15T00:00:00Z" }
              as: Applicant
              as_user_id: "${applicant_id}"
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${applicant_id}"
          trigger:
            - call: "POST /applications/${app_id}/nodes"
              payload: { facility_type: "COLLOCATION", support_structure_id: "${ss_id}", row_segment_id: "${seg_id}", proposed_construction_date: "2026-06-15T00:00:00Z" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409; error_id == ERR_INVALID_STATE"

      - name: submit_without_master_agreement_rejected
        claim_type: Precondition Enforcement
        grounds: ["validations[priority=6]", "errors[ERR_MASTER_AGREEMENT_REQUIRED]"]
        distinguishing_aspect: "Submitting before the applicant signs the master agreement fails ERR_MASTER_AGREEMENT_REQUIRED (422)."
        test_recipe:
          setup: ["A DRAFT 1-node app whose applicant has NOT signed the master agreement."]
          setup_api_calls:
            - call: "POST /applicants"
              payload: { company_name: "Theta", contact_email: "t@t.example" }
              as: PlatformAdmin
              captures: { applicant_id: $.data.id }
            - call: "POST /support-structures"
              payload: { structure_type: "EXISTING_UTILITY", max_collocations: 2 }
              as: PlatformAdmin
              captures: { ss_id: $.data.id }
            - call: "POST /row-segments"
              payload: { name: "S", corridor_code: "K-3" }
              as: PlatformAdmin
              captures: { seg_id: $.data.id }
            - call: "POST /applications"
              payload: {}
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/nodes"
              payload: { facility_type: "COLLOCATION", support_structure_id: "${ss_id}", row_segment_id: "${seg_id}", proposed_construction_date: "2026-06-15T00:00:00Z" }
              as: Applicant
              as_user_id: "${applicant_id}"
          trigger:
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 422; error_id == ERR_MASTER_AGREEMENT_REQUIRED"

      - name: submit_with_no_nodes_rejected
        claim_type: Precondition Enforcement
        grounds: ["validations[priority=8]", "errors[ERR_NO_NODES]"]
        distinguishing_aspect: "Submitting an application with zero nodes fails ERR_NO_NODES (422)."
        test_recipe:
          setup: ["A DRAFT application with no nodes; applicant signed the master agreement."]
          setup_api_calls:
            - call: "POST /applicants"
              payload: { company_name: "Iota", contact_email: "i@i.example" }
              as: PlatformAdmin
              captures: { applicant_id: $.data.id }
            - call: "POST /applicants/${applicant_id}/sign-master-agreement"
              payload: {}
              as: Applicant
              as_user_id: "${applicant_id}"
            - call: "POST /applications"
              payload: {}
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { app_id: $.data.id }
          trigger:
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 422; error_id == ERR_NO_NODES"

      - name: appeal_from_granted_application_rejected
        claim_type: invalid_transition
        grounds: [state_machines.PermitApplication.DENIED_to_UNDER_APPEAL, "errors[ERR_APPEAL_NOT_ALLOWED]"]
        distinguishing_aspect: "Filing an appeal against a fully GRANTED application fails ERR_APPEAL_NOT_ALLOWED (only DENIED/PARTIALLY_GRANTED are appealable)."
        test_recipe:
          setup: ["A single-node application GRANTED after design PASS and decision."]
          setup_api_calls:
            - call: "POST /applicants"
              payload: { company_name: "Kappa", contact_email: "k@k.example" }
              as: PlatformAdmin
              captures: { applicant_id: $.data.id }
            - call: "POST /applicants/${applicant_id}/sign-master-agreement"
              payload: {}
              as: Applicant
              as_user_id: "${applicant_id}"
            - call: "POST /support-structures"
              payload: { structure_type: "EXISTING_UTILITY", max_collocations: 2 }
              as: PlatformAdmin
              captures: { ss_id: $.data.id }
            - call: "POST /row-segments"
              payload: { name: "S", corridor_code: "K-4" }
              as: PlatformAdmin
              captures: { seg_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /applications"
              payload: {}
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/nodes"
              payload: { facility_type: "COLLOCATION", support_structure_id: "${ss_id}", row_segment_id: "${seg_id}", proposed_construction_date: "2026-06-15T00:00:00Z" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { node_id: $.data.id }
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${applicant_id}"
            - call: "POST /applications/${app_id}/completeness-review"
              payload: { complete: true }
              as: ROWReviewer
              as_user_id: "rowrev-1"
            - call: "GET /support-structures/${ss_id}"
              payload: {}
              as: ROWReviewer
              as_user_id: "rowrev-1"
              captures: { ss_ver: $.data.version }
            - call: "POST /nodes/${node_id}/design-review"
              payload: { outcome: "PASS", expected_support_structure_version: "${ss_ver}" }
              as: ROWReviewer
              as_user_id: "rowrev-1"
            - call: "POST /applications/${app_id}/decision"
              payload: {}
              as: Approver
              as_user_id: "approver-1"
          trigger:
            - call: "POST /applications/${app_id}/appeal"
              payload: { grounds: "disagree" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409; error_id == ERR_APPEAL_NOT_ALLOWED"

      - name: terminal_deemed_granted_blocks_further_evaluate
        claim_type: Terminal State Lockdown
        grounds: [state_machines.PermitApplication.SUBMITTED_to_DEEMED_GRANTED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Once DEEMED_GRANTED (terminal), a second evaluate-deadline returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["A 1-node COLLOCATION app deemed granted after the clock passed the deadline."]
          setup_api_calls:
            - call: "POST /applicants"
              payload: { company_name: "Lambda", contact_email: "l@l.example" }
              as: PlatformAdmin
              captures: { applicant_id: $.data.id }
            - call: "POST /applicants/${applicant_id}/sign-master-agreement"
              payload: {}
              as: Applicant
              as_user_id: "${applicant_id}"
            - call: "POST /support-structures"
              payload: { structure_type: "EXISTING_UTILITY", max_collocations: 2 }
              as: PlatformAdmin
              captures: { ss_id: $.data.id }
            - call: "POST /row-segments"
              payload: { name: "S", corridor_code: "K-5" }
              as: PlatformAdmin
              captures: { seg_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /applications"
              payload: {}
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/nodes"
              payload: { facility_type: "COLLOCATION", support_structure_id: "${ss_id}", row_segment_id: "${seg_id}", proposed_construction_date: "2026-06-15T00:00:00Z" }
              as: Applicant
              as_user_id: "${applicant_id}"
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${applicant_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /applications/${app_id}/evaluate-deadline"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /applications/${app_id}/evaluate-deadline"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409; error_id == ERR_INVALID_STATE (application already terminal DEEMED_GRANTED)"

      - name: appeal_overturn_repermits_denied_nodes
        claim_type: Side Effect Execution
        grounds: [state_machines.Appeal.FILED_to_OVERTURNED, state_machines.Node.DENIED_to_PERMITTED]
        distinguishing_aspect: "Overturning an appeal on a fully DENIED application moves its DENIED nodes to PERMITTED and application to APPEAL_GRANTED."
        test_recipe:
          setup: ["A 1-node app DENIED (node design-FAILed), then appealed (UNDER_APPEAL)."]
          setup_api_calls:
            - call: "POST /applicants"
              payload: { company_name: "Mu", contact_email: "m@m.example" }
              as: PlatformAdmin
              captures: { applicant_id: $.data.id }
            - call: "POST /applicants/${applicant_id}/sign-master-agreement"
              payload: {}
              as: Applicant
              as_user_id: "${applicant_id}"
            - call: "POST /support-structures"
              payload: { structure_type: "EXISTING_UTILITY", max_collocations: 2 }
              as: PlatformAdmin
              captures: { ss_id: $.data.id }
            - call: "POST /row-segments"
              payload: { name: "S", corridor_code: "K-6" }
              as: PlatformAdmin
              captures: { seg_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /applications"
              payload: {}
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/nodes"
              payload: { facility_type: "COLLOCATION", support_structure_id: "${ss_id}", row_segment_id: "${seg_id}", proposed_construction_date: "2026-06-15T00:00:00Z" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { node_id: $.data.id }
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${applicant_id}"
            - call: "POST /applications/${app_id}/completeness-review"
              payload: { complete: true }
              as: ROWReviewer
              as_user_id: "rowrev-1"
            - call: "GET /support-structures/${ss_id}"
              payload: {}
              as: ROWReviewer
              as_user_id: "rowrev-1"
              captures: { ss_ver: $.data.version }
            - call: "POST /nodes/${node_id}/design-review"
              payload: { outcome: "FAIL", expected_support_structure_version: "${ss_ver}" }
              as: ROWReviewer
              as_user_id: "rowrev-1"
            - call: "POST /applications/${app_id}/decision"
              payload: {}
              as: Approver
              as_user_id: "approver-1"
            - call: "POST /applications/${app_id}/appeal"
              payload: { grounds: "reconsider" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { appeal_id: $.data.id }
          trigger:
            - call: "POST /appeals/${appeal_id}/decision"
              payload: { uphold: false }
              as: Approver
              as_user_id: "approver-1"
          assert:
            - "Appeal.status == OVERTURNED; PermitApplication.status == APPEAL_GRANTED"
            - "Node.status == PERMITTED"

      - name: design_review_on_terminal_node_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Node.REJECTED_to_DENIED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Recording a design review on a node that is not IN_REVIEW (already REJECTED via a prior FAIL) fails ERR_INVALID_STATE."
        test_recipe:
          setup: ["A node design-FAILed to REJECTED while the app is UNDER_REVIEW."]
          setup_api_calls:
            - call: "POST /applicants"
              payload: { company_name: "Nu", contact_email: "n@n.example" }
              as: PlatformAdmin
              captures: { applicant_id: $.data.id }
            - call: "POST /applicants/${applicant_id}/sign-master-agreement"
              payload: {}
              as: Applicant
              as_user_id: "${applicant_id}"
            - call: "POST /support-structures"
              payload: { structure_type: "EXISTING_UTILITY", max_collocations: 2 }
              as: PlatformAdmin
              captures: { ss_id: $.data.id }
            - call: "POST /row-segments"
              payload: { name: "S", corridor_code: "K-7" }
              as: PlatformAdmin
              captures: { seg_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /applications"
              payload: {}
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/nodes"
              payload: { facility_type: "COLLOCATION", support_structure_id: "${ss_id}", row_segment_id: "${seg_id}", proposed_construction_date: "2026-06-15T00:00:00Z" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { node_id: $.data.id }
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${applicant_id}"
            - call: "POST /applications/${app_id}/completeness-review"
              payload: { complete: true }
              as: ROWReviewer
              as_user_id: "rowrev-1"
            - call: "GET /support-structures/${ss_id}"
              payload: {}
              as: ROWReviewer
              as_user_id: "rowrev-1"
              captures: { ss_ver0: $.data.version }
            - call: "POST /nodes/${node_id}/design-review"
              payload: { outcome: "FAIL", expected_support_structure_version: "${ss_ver0}" }
              as: ROWReviewer
              as_user_id: "rowrev-1"
            - call: "GET /support-structures/${ss_id}"
              payload: {}
              as: ROWReviewer
              as_user_id: "rowrev-1"
              captures: { ss_ver1: $.data.version }
          trigger:
            - call: "POST /nodes/${node_id}/design-review"
              payload: { outcome: "PASS", expected_support_structure_version: "${ss_ver1}" }
              as: ROWReviewer
              as_user_id: "rowrev-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409; error_id == ERR_INVALID_STATE (node is REJECTED, not IN_REVIEW)"

  # ================================================================
  - section: calculations
    instances:
      - name: collocation_only_shot_clock_is_60_days
        claim_type: Correct Result
        grounds: [calculations.application_shot_clock_deadline, entities.PermitApplication.fields.shot_clock_base_days]
        distinguishing_aspect: "A batch of only COLLOCATION nodes submitted 2026-06-01 yields base 60 and deadline 2026-07-31T00:00:00.000Z."
        test_recipe:
          setup: ["1 COLLOCATION node app submitted 2026-06-01."]
          setup_api_calls:
            - call: "POST /applicants"
              payload: { company_name: "Xi", contact_email: "x@x.example" }
              as: PlatformAdmin
              captures: { applicant_id: $.data.id }
            - call: "POST /applicants/${applicant_id}/sign-master-agreement"
              payload: {}
              as: Applicant
              as_user_id: "${applicant_id}"
            - call: "POST /support-structures"
              payload: { structure_type: "EXISTING_UTILITY", max_collocations: 2 }
              as: PlatformAdmin
              captures: { ss_id: $.data.id }
            - call: "POST /row-segments"
              payload: { name: "S", corridor_code: "K-8" }
              as: PlatformAdmin
              captures: { seg_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /applications"
              payload: {}
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/nodes"
              payload: { facility_type: "COLLOCATION", support_structure_id: "${ss_id}", row_segment_id: "${seg_id}", proposed_construction_date: "2026-06-15T00:00:00Z" }
              as: Applicant
