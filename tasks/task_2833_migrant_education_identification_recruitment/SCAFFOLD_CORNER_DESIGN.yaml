      - name: corner_transfer_self_match_is_refused_and_a_rejected_request_locks
        claim_type: Error triggerability
        grounds:
          - errors[ERR_TRANSFER_SELF_MATCH]
          - errors[ERR_TRANSFER_INVALID_STATE]
          - validations[priority 6 ERR_TRANSFER_INVALID_STATE]
          - validations[priority 15 ERR_TRANSFER_SELF_MATCH]
          - state_machines.RecordTransferRequest.terminal_states
          - endpoints[POST /mep/transfer-requests/{request_id}/match]
          - endpoints[POST /mep/transfer-requests/{request_id}/reject]
        distinguishing_aspect: "A request cannot be matched to the very student it was raised for - that is 422 ERR_TRANSFER_SELF_MATCH - and once the request is rejected REJECTED is terminal, so match, receive and reconcile all return 409 ERR_TRANSFER_INVALID_STATE and the student's credit ledger is never touched."
