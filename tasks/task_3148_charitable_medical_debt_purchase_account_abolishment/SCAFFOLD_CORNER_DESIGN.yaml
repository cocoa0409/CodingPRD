- section: cross_cutting_layers
  instances:
  - name: contract_create_occ_stale_version
    claim_type: optimistic_concurrency
    grounds:
    - concurrency_rules[portfolio-contract-create-occ]
    - errors.ERR_STALE_VERSION
    distinguishing_aspect: 'OCC on Portfolio.version for contract creation: a request carrying the pre-price-quote version after the quote advanced
      it is rejected 412 ERR_STALE_VERSION.'
    test_recipe:
      setup:
      - 'Logical clock set; standard chain: portfolio version observed at submit, then screening run + execute + price-quote each advanced it.'
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /api/source-organizations
        payload:
          name: Mercy General Hospital
          org_type: HOSPITAL
          state_code: TX
          contact_email: billing@org.example
