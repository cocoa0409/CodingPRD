scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: participation_fee_provisional_vs_reconciled_diverge_on_same_billing_period
        grounds:
          - calculations.participation_fee
          - entities.ParticipationInvoice.fields.basis_variant
          - entities.ParticipationInvoice.fields.quality_multiplier
          - entities.Participant.fields.provisional_monthly_fee_cents
          - state_machines.ParticipationInvoice.ISSUED_to_VOID
        distinguishing_aspect: |
          This instance's dual variant lives in the fiscal domain (ParticipationInvoice): PROVISIONAL
          bills ceil(declared_annual_patient_volume / 12) at multiplier 1.00 while RECONCILED bills the
          summed messages_received of in-period samples at the grade-derived multiplier, so the same
          participant and the same billing period yield 299877 versus 254125 cents.
        test_recipe:
          setup:
            - "One participant 'Cascade Regional Health' with declared_annual_patient_volume 360012, advanced to CONFORMANCE_TESTING so invoices may be issued."
            - "One CCDA data feed carrying exactly one quality sample covering [2026-06-01, 2026-07-01) with 10000 messages received, 300 rejected, 500 with missing required fields, 100 duplicates and a 240-second p95, which grades the participant A."
            - "Logical clock at its default 2026-08-01T00:00:00Z, so the June billing period has fully elapsed."
          setup_api_calls:
            - call: "POST /hie/participants"
              payload: { legal_name: "Cascade Regional Health", org_type: "HOSPITAL", declared_annual_patient_volume: 360012, primary_contact_email: "ops@cascade.example" }
              as: HieAdmin
              captures: { pA_id: $.data.id, pA_provisional: $.data.provisional_monthly_fee_cents }
            - call: "POST /hie/participants/${pA_id}/onboarding-transitions"
              payload: { action: "SUBMIT_FOR_LEGAL_REVIEW" }
              as: ParticipantAdmin
              as_user_id: "${pA_id}"
            - call: "POST /hie/participants/${pA_id}/onboarding-transitions"
              payload: { action: "EXECUTE_AGREEMENT", agreement_version: "DURSA-2026.1", signed_at: "2026-08-01T00:00:00Z" }
              as: HieAdmin
              as_user_id: "admin-legal-1"
              captures: { pA_ver: $.data.version }
            - call: "POST /hie/participants/${pA_id}/data-feeds"
              payload: { feed_type: "CCDA", expected_participant_version: "${pA_ver}" }
              as: HieAdmin
              captures: { feedA_id: $.data.id }
            - call: "POST /hie/data-feeds/${feedA_id}/quality-samples"
              payload: { period_start: "2026-06-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z", messages_received: 10000, messages_rejected: 300, required_fields_missing_count: 500, duplicate_count: 100, timeliness_p95_seconds: 240 }
              as: HieAdmin
          trigger:
            - call: "POST /hie/participants/${pA_id}/participation-invoices"
              payload: { billing_period_start: "2026-06-01T00:00:00Z", billing_period_end: "2026-07-01T00:00:00Z", basis_variant: "PROVISIONAL", due_date: "2026-08-15T00:00:00Z" }
              as: HieAdmin
              captures: { inv_prov_id: $.data.id, inv_prov_total: $.data.total_cents, inv_prov_volume_fee: $.data.volume_fee_cents }
            - call: "POST /hie/participation-invoices/${inv_prov_id}/administrative-transitions"
              payload: { action: "VOID", reason: "Re-issued on a reconciled basis once the June samples landed" }
              as: HieAdmin
            - call: "POST /hie/participants/${pA_id}/participation-invoices"
              payload: { billing_period_start: "2026-06-01T00:00:00Z", billing_period_end: "2026-07-01T00:00:00Z", basis_variant: "RECONCILED", due_date: "2026-08-15T00:00:00Z" }
              as: HieAdmin
              captures: { inv_rec_id: $.data.id, inv_rec_total: $.data.total_cents }
          assert:
            - "Participant.${pA_id}.provisional_monthly_fee_cents == 299877"
            - "Participant.${pA_id}.fee_tier == TIER_2"
            - "ParticipationInvoice.${inv_prov_id}.billable_volume_units == 30001"
            - "ParticipationInvoice.${inv_prov_id}.volume_fee_cents == 49877"
            - "ParticipationInvoice.${inv_prov_id}.quality_multiplier == 1.00"
            - "ParticipationInvoice.${inv_prov_id}.total_cents == 299877"
            - "ParticipationInvoice.${inv_prov_id}.status == VOID"
            - "ParticipationInvoice.${inv_rec_id}.billable_volume_units == 10000"
            - "ParticipationInvoice.${inv_rec_id}.volume_fee_cents == 17500"
            - "ParticipationInvoice.${inv_rec_id}.quality_grade_snapshot == A"
            - "ParticipationInvoice.${inv_rec_id}.quality_multiplier == 0.95"
            - "ParticipationInvoice.${inv_rec_id}.total_cents == 254125"
            - "ParticipationInvoice.${inv_prov_id}.total_cents - ParticipationInvoice.${inv_rec_id}.total_cents == 45752"
            - "Participant.${pA_id}.outstanding_balance_cents == 254125"
            - "the RECONCILED issuance is accepted with 201 even though its billing period equals the VOID invoice's period, because VOID invoices are excluded from the overlap test"
      - name: match_score_deterministic_vs_probabilistic_diverge_on_same_demographic_pair
        grounds:
          - calculations.match_score
          - entities.MatchThresholdConfig.fields.score_variant_mode
          - entities.MatchLink.fields.score_variant
          - entities.MatchLink.fields.threshold_config_id
          - state_machines.MatchLink.PROPOSED_to_AUTO_LINKED
          - state_machines.MatchLink.PROPOSED_to_REJECTED
        distinguishing_aspect: |
          This instance's dual variant lives in the identity-resolution domain (PatientRecord/MatchLink),
          not the fiscal one: a pair agreeing only on birth_date and ssn_last4 scores 1.0000 and
          AUTO_LINKS under DETERMINISTIC_FIRST but scores 0.5300 and is REJECTED under
          PROBABILISTIC_ONLY, with the deciding generation pinned onto MatchLink.threshold_config_id.
        test_recipe:
          setup:
            - "A DETERMINISTIC_FIRST threshold generation is ACTIVE with auto_link_threshold 0.9200 and review_lower_bound 0.7500."
            - "Two participants, each advanced to CONFORMANCE_TESTING so they may contribute records."
            - "Pair 1 (Bill Smith / Guillermo Herrera) shares birth_date 1965-11-30 and ssn_last4 9902 and disagrees on every other field; it is scored under the DETERMINISTIC_FIRST generation."
            - "A PROBABILISTIC_ONLY generation with identical weights and bounds is then activated, retiring the deterministic one."
          setup_api_calls:
            - call: "POST /hie/match-threshold-configs"
              payload: { config_label: "REF-DET-A", auto_link_threshold: 0.9200, review_lower_bound: 0.7500, score_variant_mode: "DETERMINISTIC_FIRST", weight_family_name: 0.20, weight_given_name: 0.12, weight_birth_date: 0.25, weight_ssn_last4: 0.28, weight_postal_code: 0.08, weight_phone_digits: 0.07, partial_credit_factor: 0.50 }
              as: PrivacyOfficer
              as_user_id: "privacy-tuner-1"
              captures: { cfg_det_id: $.data.id }
            - call: "POST /hie/match-threshold-configs/${cfg_det_id}/activation"
              payload: {}
              as: PrivacyOfficer
              as_user_id: "privacy-tuner-1"
            - call: "POST /hie/participants"
              payload: { legal_name: "Northline Hospital", org_type: "HOSPITAL", declared_annual_patient_volume: 120000, primary_contact_email: "it@northline.example" }
              as: HieAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /hie/participants/${p1_id}/onboarding-transitions"
              payload: { action: "SUBMIT_FOR_LEGAL_REVIEW" }
              as: ParticipantAdmin
              as_user_id: "${p1_id}"
            - call: "POST /hie/participants/${p1_id}/onboarding-transitions"
              payload: { action: "EXECUTE_AGREEMENT", agreement_version: "DURSA-2026.1", signed_at: "2026-08-01T00:00:00Z" }
              as: HieAdmin
              as_user_id: "admin-legal-1"
            - call: "POST /hie/participants"
              payload: { legal_name: "Southbay Clinic", org_type: "CLINIC", declared_annual_patient_volume: 60000, primary_contact_email: "it@southbay.example" }
              as: HieAdmin
              captures: { p2_id: $.data.id }
            - call: "POST /hie/participants/${p2_id}/onboarding-transitions"
              payload: { action: "SUBMIT_FOR_LEGAL_REVIEW" }
              as: ParticipantAdmin
              as_user_id: "${p2_id}"
            - call: "POST /hie/participants/${p2_id}/onboarding-transitions"
              payload: { action: "EXECUTE_AGREEMENT", agreement_version: "DURSA-2026.1", signed_at: "2026-08-01T00:00:00Z" }
              as: HieAdmin
              as_user_id: "admin-legal-1"
            - call: "POST /hie/participants/${p1_id}/patient-records"
              payload: { source_mrn: "N-1001", given_name: "Bill", family_name: "Smith", birth_date: "1965-11-30", sex: "M", ssn_last4: "9902", postal_code: "60601", phone_digits: "3125550100" }
              as: HieAdmin
              captures: { rec_l1: $.data.id }
            - call: "POST /hie/participants/${p2_id}/patient-records"
              payload: { source_mrn: "S-2001", given_name: "Guillermo", family_name: "Herrera", birth_date: "1965-11-30", sex: "M", ssn_last4: "9902", postal_code: "10002", phone_digits: "9175550188" }
              as: HieAdmin
              captures: { rec_r1: $.data.id }
            - call: "POST /hie/match-threshold-configs"
              payload: { config_label: "REF-PROB-A", auto_link_threshold: 0.9200, review_lower_bound: 0.7500, score_variant_mode: "PROBABILISTIC_ONLY", weight_family_name: 0.20, weight_given_name: 0.12, weight_birth_date: 0.25, weight_ssn_last4: 0.28, weight_postal_code: 0.08, weight_phone_digits: 0.07, partial_credit_factor: 0.50 }
              as: PrivacyOfficer
              as_user_id: "privacy-tuner-1"
              captures: { cfg_prob_id: $.data.id }
            - call: "POST /hie/match-threshold-configs/${cfg_prob_id}/activation"
              payload: {}
              as: PrivacyOfficer
              as_user_id: "privacy-tuner-1"
          trigger:
            - call: "POST /hie/participants/${p1_id}/patient-records"
              payload: { source_mrn: "N-1002", given_name: "Walter", family_name: "Pearson", birth_date: "1972-03-08", sex: "M", ssn_last4: "5510", postal_code: "97201", phone_digits: "5035550190" }
              as: HieAdmin
              captures: { rec_l2: $.data.id }
            - call: "POST /hie/participants/${p2_id}/patient-records"
              payload: { source_mrn: "S-2002", given_name: "Gualterio", family_name: "Cardoso", birth_date: "1972-03-08", sex: "M", ssn_last4: "5510", postal_code: "33101", phone_digits: "7865550175" }
              as: HieAdmin
              captures: { rec_r2: $.data.id }
            - call: "GET /hie/match-links"
              payload: { left_record_id: "${rec_l1}", right_record_id: "${rec_r1}" }
              as: PrivacyOfficer
              captures: { link1_score: "$.data[0].match_score", link1_status: "$.data[0].status", link1_variant: "$.data[0].score_variant", link1_cfg: "$.data[0].threshold_config_id" }
            - call: "GET /hie/match-links"
              payload: { left_record_id: "${rec_l2}", right_record_id: "${rec_r2}" }
              as: PrivacyOfficer
              captures: { link2_score: "$.data[0].match_score", link2_status: "$.data[0].status", link2_variant: "$.data[0].score_variant", link2_cfg: "$.data[0].threshold_config_id" }
          assert:
            - "${link1_score} == 1.0000"
            - "${link1_variant} == DETERMINISTIC"
            - "${link1_status} == AUTO_LINKED"
            - "${link1_cfg} == ${cfg_det_id}"
            - "${link2_score} == 0.5300"
            - "${link2_variant} == PROBABILISTIC"
            - "${link2_status} == REJECTED"
            - "${link2_cfg} == ${cfg_prob_id}"
            - "PatientRecord.${rec_l2}.cluster_id != PatientRecord.${rec_r2}.cluster_id"
            - "MatchThresholdConfig.${cfg_det_id}.status == RETIRED and MatchThresholdConfig.${cfg_det_id}.scored_link_count == 1"
  - rule_id: combinatorial_formula
    instances:
      - name: participation_fee_rounds_each_tier_before_summing_yielding_49877
        grounds:
          - calculations.participation_fee
          - entities.ParticipationInvoice.fields.tier_charge_breakdown
          - entities.ParticipationInvoice.fields.volume_fee_cents
          - entities.Participant.fields.fee_tier
        distinguishing_aspect: |
          Mode (b) - nested rounding where the order is observable: 24750 units at 1.75 cents is 43312.5
          and 5251 units at 1.25 cents is 6563.75, so rounding per tier and then summing gives 49877
          while summing first and rounding once gives 49876; the scaffold pins the per-tier order and this
          instance asserts the 49877 branch plus the per-tier breakdown that produced it.
        test_recipe:
          setup:
            - "One participant with declared_annual_patient_volume 360012, advanced to CONFORMANCE_TESTING, with no data feeds and therefore quality_grade UNGRADED (multiplier 1.00)."
            - "Logical clock at its default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /hie/participants"
              payload: { legal_name: "Straddle Valley Health", org_type: "HOSPITAL", declared_annual_patient_volume: 360012, primary_contact_email: "billing@straddle.example" }
              as: HieAdmin
              captures: { pB_id: $.data.id }
            - call: "POST /hie/participants/${pB_id}/onboarding-transitions"
              payload: { action: "SUBMIT_FOR_LEGAL_REVIEW" }
              as: ParticipantAdmin
              as_user_id: "${pB_id}"
            - call: "POST /hie/participants/${pB_id}/onboarding-transitions"
              payload: { action: "EXECUTE_AGREEMENT", agreement_version: "DURSA-2026.1", signed_at: "2026-08-01T00:00:00Z" }
              as: HieAdmin
              as_user_id: "admin-legal-1"
          trigger:
            - call: "POST /hie/participants/${pB_id}/participation-invoices"
              payload: { billing_period_start: "2026-06-01T00:00:00Z", billing_period_end: "2026-07-01T00:00:00Z", basis_variant: "PROVISIONAL", due_date: "2026-08-15T00:00:00Z" }
              as: HieAdmin
              captures: { invB_id: $.data.id }
          assert:
            - "ParticipationInvoice.${invB_id}.billable_volume_units == 30001"
            - "ParticipationInvoice.${invB_id}.tier_charge_breakdown.TIER_1 == 43313"
            - "ParticipationInvoice.${invB_id}.tier_charge_breakdown.TIER_2 == 6564"
            - "ParticipationInvoice.${invB_id}.tier_charge_breakdown.TIER_3 == 0"
            - "ParticipationInvoice.${invB_id}.volume_fee_cents == 49877"
            - "ParticipationInvoice.${invB_id}.volume_fee_cents != 49876"
            - "ParticipationInvoice.${invB_id}.base_platform_fee_cents == 250000"
            - "ParticipationInvoice.${invB_id}.quality_grade_snapshot == UNGRADED"
            - "ParticipationInvoice.${invB_id}.quality_multiplier == 1.00"
            - "ParticipationInvoice.${invB_id}.total_cents == 299877"
            - "Participant.${pB_id}.fee_tier == TIER_2"
            - "Participant.${pB_id}.outstanding_balance_cents == 299877"
      - name: quality_score_penalty_keyed_to_provisional_grade_yields_83_60
        grounds:
          - calculations.participant_quality_score
          - entities.Participant.fields.quality_score
          - entities.Participant.fields.quality_grade
          - entities.FeedQualitySample.fields.timeliness_p95_seconds
          - state_machines.DataFeed.MONITORED_to_DEGRADED
        distinguishing_aspect: |
          Mode (c) - a circular-looking dependency resolved by a pinned evaluation order: grade depends on
          quality_score, quality_score depends on penalty_points, and penalty_points depends on a grade.
          The scaffold keys the penalty to the PROVISIONAL grade derived from base_quality_score, so
          base 84.60 -> provisional B -> penalty 1 -> quality_score 83.60 -> final grade C, whereas
          re-deriving the penalty from the final grade C would give 81.60.
        test_recipe:
          setup:
            - "One participant advanced to CONFORMANCE_TESTING with one CCDA data feed."
            - "Exactly one quality sample covering [2026-06-01, 2026-07-01) with 10000 messages received, 600 rejected, 900 with missing required fields, 600 duplicates and a 1200-second p95."
            - "Logical clock at its default 2026-08-01T00:00:00Z, so the sample's period_end sits inside the 90-day quality window."
          setup_api_calls:
            - call: "POST /hie/participants"
              payload: { legal_name: "Midline Community Clinic", org_type: "CLINIC", declared_annual_patient_volume: 90000, primary_contact_email: "quality@midline.example" }
              as: HieAdmin
              captures: { pC_id: $.data.id }
            - call: "POST /hie/participants/${pC_id}/onboarding-transitions"
              payload: { action: "SUBMIT_FOR_LEGAL_REVIEW" }
              as: ParticipantAdmin
              as_user_id: "${pC_id}"
            - call: "POST /hie/participants/${pC_id}/onboarding-transitions"
              payload: { action: "EXECUTE_AGREEMENT", agreement_version: "DURSA-2026.1", signed_at: "2026-08-01T00:00:00Z" }
              as: HieAdmin
              as_user_id: "admin-legal-1"
              captures: { pC_ver: $.data.version }
            - call: "POST /hie/participants/${pC_id}/data-feeds"
              payload: { feed_type: "CCDA", expected_participant_version: "${pC_ver}" }
              as: HieAdmin
              captures: { feedC_id: $.data.id }
          trigger:
            - call: "POST /hie/data-feeds/${feedC_id}/quality-samples"
              payload: { period_start: "2026-06-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z", messages_received: 10000, messages_rejected: 600, required_fields_missing_count: 900, duplicate_count: 600, timeliness_p95_seconds: 1200 }
              as: HieAdmin
              captures: { sampleC_id: $.data.id, sampleC_reject_rate: $.data.reject_rate }
            - call: "GET /hie/participants/${pC_id}/scorecard"
              payload: {}
              as: HieAdmin
              captures: { base_c: $.data.base_quality_score, prov_grade_c: $.data.provisional_grade, penalty_c: $.data.penalty_points, score_c: $.data.quality_score, grade_c: $.data.grade }
          assert:
            - "${sampleC_reject_rate} == 0.0600"
            - "DataFeed.${feedC_id}.status == DEGRADED"
            - "DataFeed.${feedC_id}.latest_reject_rate == 0.0600"
            - "DataFeed.${feedC_id}.sample_count == 1"
            - "${base_c} == 84.60"
            - "${prov_grade_c} == B"
            - "${penalty_c} == 1"
            - "${score_c} == 83.60"
            - "${score_c} != 81.60"
            - "${grade_c} == C"
            - "Participant.${pC_id}.quality_score == 83.60"
            - "Participant.${pC_id}.quality_grade == C"
            - "the scorecard components are completeness_component == 91, rejection_component == 94, duplicate_component == 94 and timeliness_component == 60"
  - rule_id: non_linear_state_machine
    instances:
      - name: break_glass_session_and_review_dimensions_advance_independently
        grounds:
          - state_machines.BreakGlassAccess
          - entities.BreakGlassAccess.fields.session_status
          - entities.BreakGlassAccess.fields.review_status
          - entities.BreakGlassAccess.fields.expires_at
          - calculations.break_glass_sanction_points
        distinguishing_aspect: |
          BreakGlassAccess carries two parallel state dimensions on one row: closing the emergency session
          (session_status OPEN -> CLOSED) leaves review_status at PENDING_REVIEW, and the later review
          claim and decision advance review_status to UNDER_REVIEW then JUSTIFIED while session_status
          stays CLOSED - neither dimension gates the other.
        test_recipe:
          setup:
            - "A PROBABILISTIC_ONLY threshold generation is ACTIVE."
            - "One participant certified end-to-end (three PASSED profiles, certified by an administrator other than the agreement signatory)."
            - "That participant contributed one patient record, which created a single-member ACTIVE identity cluster."
            - "Logical clock at its default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /hie/match-threshold-configs"
              payload: { config_label: "REF-PROB-B", auto_link_threshold: 0.9200, review_lower_bound: 0.7500, score_variant_mode: "PROBABILISTIC_ONLY", weight_family_name: 0.20, weight_given_name: 0.12, weight_birth_date: 0.25, weight_ssn_last4: 0.28, weight_postal_code: 0.08, weight_phone_digits: 0.07, partial_credit_factor: 0.50 }
              as: PrivacyOfficer
              as_user_id: "privacy-tuner-1"
              captures: { cfgD_id: $.data.id }
            - call: "POST /hie/match-threshold-configs/${cfgD_id}/activation"
              payload: {}
              as: PrivacyOfficer
              as_user_id: "privacy-tuner-1"
            - call: "POST /hie/participants"
              payload: { legal_name: "Harborview Medical Center", org_type: "HOSPITAL", declared_annual_patient_volume: 240000, primary_contact_email: "hie@harborview.example" }
              as: HieAdmin
              captures: { pD_id: $.data.id }
            - call: "POST /hie/participants/${pD_id}/onboarding-transitions"
              payload: { action: "SUBMIT_FOR_LEGAL_REVIEW" }
              as: ParticipantAdmin
              as_user_id: "${pD_id}"
            - call: "POST /hie/participants/${pD_id}/onboarding-transitions"
              payload: { action: "EXECUTE_AGREEMENT", agreement_version: "DURSA-2026.1", signed_at: "2026-08-01T00:00:00Z" }
              as: HieAdmin
              as_user_id: "admin-legal-1"
            - call: "POST /hie/participants/${pD_id}/conformance-tests"
              payload: { profile: "ADT_PUBLISHER", scheduled_start: "2026-08-01T00:00:00Z", scheduled_end: "2026-08-01T06:00:00Z" }
              as: HieAdmin
