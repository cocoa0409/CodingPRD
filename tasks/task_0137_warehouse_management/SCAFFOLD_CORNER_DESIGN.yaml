          setup: ["A single-line order fully picked and ready to ship; its source RESERVE bin holds the staged LPN (qty 5, volume 5)."]
          setup_api_calls:
            - call: "POST /warehouse/skus"
              payload: { sku_code: "SKU-DR1", description: "dr", abc_class: "A", each_volume_cm3: 1, min_qty: 1, max_qty: 100 }
              as: PlatformAdmin
              captures: { sid: "$.data.id" }
            - call: "POST /warehouse/locations"
              payload: { location_code: "RS-DR1", zone: "RESERVE", max_volume_cm3: 1000 }
              as: PlatformAdmin
              captures: { lid: "$.data.id" }
            - call: "POST /warehouse/inbound-asns"
              payload: { asn_number: "ASN-DR1", supplier_name: "Acme", handling_mode: "PUTAWAY" }
              as: ReceivingClerk
              captures: { aid: "$.data.id" }
            - call: "POST /warehouse/inbound-asns/${aid}/lines"
              payload: { sku_id: "${sid}", expected_qty: 5 }
              as: ReceivingClerk
              captures: { lnid: "$.data.id" }
            - call: "POST /warehouse/inbound-asns/${aid}/receipts"
              payload: { asn_line_id: "${lnid}", received_qty: 5 }
              as: ReceivingClerk
              captures: { lpnid: "$.data.lpn_id" }
            - call: "POST /warehouse/inbound-asns/${aid}/close"
              payload: {}
              as: ReceivingClerk
            - call: "GET /warehouse/putaway-tasks"
              payload: {}
              as: PutawayOperator
              captures: { pid: "$.data[0].id" }
            - call: "POST /warehouse/putaway-tasks/${pid}/assign"
              payload: {}
              as: PutawayOperator
            - call: "POST /warehouse/putaway-tasks/${pid}/complete"
              payload: {}
              as: PutawayOperator
            - call: "POST /warehouse/outbound-orders"
              payload: { order_number: "ORD-DR1", priority: 5 }
              as: WavePlanner
              captures: { oid: "$.data.id" }
            - call: "POST /warehouse/outbound-orders/${oid}/lines"
              payload: { sku_id: "${sid}", ordered_qty: 5 }
              as: WavePlanner
              captures: { olid: "$.data.id" }
            - call: "POST /warehouse/waves"
              payload: { wave_label: "WAVE-DR1" }
              as: WavePlanner
              captures: { wid: "$.data.id" }
            - call: "POST /warehouse/waves/${wid}/add-order"
              payload: { order_id: "${oid}" }
              as: WavePlanner
              captures: { wv2: "$.data.version" }
            - call: "POST /warehouse/waves/${wid}/release"
              payload: { expected_wave_version: "${wv2}" }
              as: WavePlanner
            - call: "POST /warehouse/waves/${wid}/start-picking"
              payload: {}
              as: WavePlanner
            - call: "GET /warehouse/waves/${wid}/pick-tasks"
              payload: {}
              as: Picker
              captures: { ptid: "$.data[0].id" }
            - call: "POST /warehouse/pick-tasks/${ptid}/start"
              payload: {}
              as: Picker
            - call: "POST /warehouse/pick-tasks/${ptid}/confirm"
              payload: { light_confirmed: true }
              as: Picker
          trigger:
            - call: "POST /warehouse/outbound-orders/${oid}/ship"
              payload: {}
              as: Picker
            - call: "GET /warehouse/locations/${lid}"
              payload: {}
              as: PutawayOperator
              captures: { used: "$.data.used_volume_cm3" }
          assert:
            - "OutboundOrder.${oid}.status == SHIPPED"
            - "LicensePlate.${lpnid}.disposition == SHIPPED"
            - "Location.${lid}.used_volume_cm3 == 0"

  # =========================================================================
  # Consistency Model
  # =========================================================================
  - section: consistency_model
    instances:
      - name: immediate_onhand_visible_in_putaway_response_chain
        claim_type: immediate
        grounds:
          - "calculations.sku_on_hand"
          - "state_machines.PutawayTask.ASSIGNED_to_COMPLETED"
        distinguishing_aspect: "on_hand_qty is immediately consistent: a GET on the SKU directly after the putaway-complete response shows the updated on_hand_qty=8 in the same request cycle (no lag)."
        test_recipe:
          setup: ["An LPN qty 8 put away STORED."]
          setup_api_calls:
            - call: "POST /warehouse/skus"
              payload: { sku_code: "SKU-IM1", description: "im", abc_class: "C", each_volume_cm3: 1, min_qty: 1, max_qty: 100 }
              as: PlatformAdmin
              captures: { sid: "$.data.id" }
            - call: "POST /warehouse/locations"
              payload: { location_code: "RS-IM1", zone: "RESERVE", max_volume_cm3: 1000 }
              as: PlatformAdmin
              captures: { lid: "$.data.id" }
            - call: "POST /warehouse/inbound-asns"
              payload: { asn_number: "ASN-IM1", supplier_name: "Acme", handling_mode: "PUTAWAY" }
              as: ReceivingClerk
              captures: { aid: "$.data.id" }
            - call: "POST /warehouse/inbound-asns/${aid}/lines"
              payload: { sku_id: "${sid}", expected_qty: 8 }
              as: ReceivingClerk
              captures: { lnid: "$.data.id" }
            - call: "POST /warehouse/inbound-asns/${aid}/receipts"
              payload: { asn_line_id: "${lnid}", received_qty: 8 }
              as: ReceivingClerk
              captures: { lpnid: "$.data.lpn_id" }
            - call: "POST /warehouse/inbound-asns/${aid}/close"
              payload: {}
              as: ReceivingClerk
            - call: "GET /warehouse/putaway-tasks"
              payload: {}
              as: PutawayOperator
              captures: { pid: "$.data[0].id" }
            - call: "POST /warehouse/putaway-tasks/${pid}/assign"
              payload: {}
              as: PutawayOperator
          trigger:
            - call: "POST /warehouse/putaway-tasks/${pid}/complete"
              payload: {}
              as: PutawayOperator
            - call: "GET /warehouse/skus/${sid}"
              payload: {}
              as: InventoryController
              captures: { oh: "$.data.on_hand_qty" }
          assert:
            - "Sku.${sid}.on_hand_qty == 8"

  # =========================================================================
  # Excluded (covered by §1.8) — stubs
  # =========================================================================
  - section: validations
    instances:
      - name: excluded_replen_eligibility_at_min_boundary
        claim_type: Violation → Error
        grounds:
          - "calculations.replen_qty"
          - "validations[priority=12]"
        excluded_because:
          difficulty_instance: boundary_precision_check / replen_eligibility_at_min_inclusive
          rationale: "The at-or-below-min replenishment eligibility boundary (face on-hand == min => eligible, replen_qty=80) is the asserted positive of the named §1.8 boundary instance."

      - name: excluded_cycle_due_at_exact_cadence
        claim_type: Correct Result
        grounds:
          - "calculations.cycle_count_due_flag"
        excluded_because:
          difficulty_instance: boundary_precision_check / cycle_count_due_at_exact_cadence_day
          rationale: "The days>=cadence (exactly 30 days => due) boundary is the asserted positive of the named §1.8 boundary instance."

      - name: excluded_pickface_dedication_uniqueness
        claim_type: Violation → Error
        grounds:
          - "validations[priority=11]"
          - "errors[ERR_PICKFACE_TAKEN]"
        excluded_because:
          difficulty_instance: resource_temporal_overlap / pickface_exclusive_dedication_overlap
          rationale: "ERR_PICKFACE_TAKEN on a second dedication to the same SKU is the failure path asserted by the named §1.8 overlap instance."
