          assert:
            - "${alloc_now} == 70 across two allocations; ${ost} == ALLOCATED"
            - "GET /api/allocations?order_id=${ord} (created_at ASC): [0].bucket_id == ${b1} with quantity 40; [1].bucket_id == ${b2} with quantity 30"
            - "lot1 bucket reserved_count == 40 (available 0 — fully drained before lot2); lot2 bucket reserved_count == 30 (available 30)"

      - name: consignment_provisional_rounding_half_up
        claim_type: precision
        grounds: ["calculations.consignment_settlement"]
        excluded_because:
          difficulty_instance: "dual_variant_calc / consignment_provisional_vs_final_settlement"
          rationale: "That instance pins provisional_settlement_cents == 16473, i.e. round_half_up(16472.5) — the half-up precision claim is asserted there."

  # ---------------------------------------------------------------------------
  - section: validations
    instances:
      - name: order_create_in_planning_posture_forbidden
        claim_type: violation_to_error
        grounds: ["validations[priority=7]", "errors[ERR_POSTURE_FORBIDS]"]
        distinguishing_aspect: "Order book is posture-gated: creating an order while the season is still PLANNING (default clock 2026-05-01, before booking opens) fails with ERR_POSTURE_FORBIDS."
        test_recipe:
          setup: ["season exists in PLANNING; buyer exists"]
          setup_api_calls:
            - { call: "POST /api/seasons", payload: { year: 2026, booking_open_at: "2026-06-01T00:00:00Z", booking_close_at: "2026-08-31T23:59:59Z", harvest_window_start: "2026-11-01", harvest_window_end: "2026-11-25", shipping_window_start: "2026-11-15T00:00:00Z", shipping_window_end: "2026-12-10T23:59:59Z" }, as: Owner, captures: { s: $.data.id } }
            - { call: "POST /api/buyer-accounts", payload: { name: "Acme Wholesale", credit_limit_cents: 100000000 }, as: Owner, captures: { buy: $.data.id } }
          trigger:
            - { call: "POST /api/wholesale-orders", payload: { season_id: "${s}", buyer_account_id: "${buy}", species: "NOBLE_FIR", height_class: "H_6_7", quantity: 5, unit_price_cents: 400 }, as: WholesaleBuyer, as_user_id: "${buy}" }
          assert:
            - "response 409 with error_id == ERR_POSTURE_FORBIDS (posture PLANNING)"
            - "no order persisted: GET /api/wholesale-orders?buyer_account_id=${buy} returns total_count == 0"

      - name: advance_to_harvest_with_draft_order_blocked
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "state_machines.Season.BOOKING_to_HARVEST"]
        distinguishing_aspect: "The BOOKING->HARVEST guard is an aggregate child-state check: one lingering DRAFT order blocks the whole season advance even though the clock gate passed."
        test_recipe:
          setup: ["season in BOOKING; one DRAFT (never submitted) order; clock moved to 2026-11-01"]
          setup_api_calls:
            - { call: "POST /api/seasons", payload: { year: 2026, booking_open_at: "2026-06-01T00:00:00Z", booking_close_at: "2026-08-31T23:59:59Z", harvest_window_start: "2026-11-01", harvest_window_end: "2026-11-25", shipping_window_start: "2026-11-15T00:00:00Z", shipping_window_end: "2026-12-10T23:59:59Z" }, as: Owner, captures: { s: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: Owner }
            - { call: "POST /api/seasons/${s}/advance-posture", payload: { target_posture: "BOOKING" }, as: Owner }
            - { call: "POST /api/buyer-accounts", payload: { name: "Acme Wholesale", credit_limit_cents: 100000000 }, as: Owner, captures: { buy: $.data.id } }
            - { call: "POST /api/wholesale-orders", payload: { season_id: "${s}", buyer_account_id: "${buy}", species: "NOBLE_FIR", height_class: "H_6_7", quantity: 5, unit_price_cents: 400 }, as: WholesaleBuyer, as_user_id: "${buy}", captures: { ord: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-11-01T00:00:00Z" }, as: Owner }
          trigger:
            - { call: "POST /api/seasons/${s}/advance-posture", payload: { target_posture: "HARVEST" }, as: Owner }
          assert:
            - "response 409 with error_id == ERR_POSTURE_GUARD_FAILED (DRAFT order ${ord} blocks)"
            - "Season.${s}.posture remains BOOKING"
            - "cancelling the draft then advancing succeeds: POST /api/wholesale-orders/${ord}/cancel -> 200, then advance-posture HARVEST -> 200"

      - name: cull_exceeding_available_returns_error
        claim_type: violation_to_error
        grounds: ["validations[priority=22]", "errors[ERR_CULL_EXCEEDS_STANDING]"]
        distinguishing_aspect: "Cull draws only from available (standing - reserved): 50 available, count 51 rejected; count 50 then succeeds and zeroes the bucket."
        test_recipe:
          setup: ["season; block; lot with H_6_7 = 50"]
          setup_api_calls:
            - { call: "POST /api/seasons", payload: { year: 2026, booking_open_at: "2026-06-01T00:00:00Z", booking_close_at: "2026-08-31T23:59:59Z", harvest_window_start: "2026-11-01", harvest_window_end: "2026-11-25", shipping_window_start: "2026-11-15T00:00:00Z", shipping_window_end: "2026-12-10T23:59:59Z" }, as: Owner, captures: { s: $.data.id } }
            - { call: "POST /api/blocks", payload: { season_id: "${s}", block_code: "B-1", acreage: 12.5 }, as: FarmManager, captures: { blk: $.data.id } }
            - { call: "POST /api/crop-lots", payload: { block_id: "${blk}", species: "NOBLE_FIR", planted_year: 2019, initial_counts: { H_4_5: 0, H_5_6: 0, H_6_7: 50, H_7_8: 0, H_8_9: 0, H_9_PLUS: 0 } }, as: FarmManager, captures: { lot: $.data.id } }
            - { call: "GET /api/crop-lots/${lot}/stand-buckets", payload: {}, as: FarmManager, captures: { b67: "$.data[2].id" } }
          trigger:
            - { call: "POST /api/cull-records", payload: { bucket_id: "${b67}", count: 51, reason: "DISEASE" }, as: FarmManager }
            - { call: "POST /api/cull-records", payload: { bucket_id: "${b67}", count: 50, reason: "DISEASE" }, as: FarmManager, captures: { cul: $.data.id } }
          assert:
            - "count 51: 422 with error_id == ERR_CULL_EXCEEDS_STANDING; bucket standing stays 50"
            - "count 50: 201; bucket standing_count == 0, culled_cumulative == 50"
            - "CropLot.${lot}.status == DEPLETED after the zeroing cull (auto-transition)"

      - name: tag_on_non_ucut_block_rejected
        claim_type: conditional_validation
        grounds: ["validations[priority=13]", "errors[ERR_BLOCK_NOT_UCUT]"]
        distinguishing_aspect: "The ucut_designated flag flips tag creation legality on an otherwise identical HARVESTABLE block: false -> ERR_BLOCK_NOT_UCUT, true -> 201."
        test_recipe:
          setup: ["season in HARVEST; two HARVESTABLE blocks with H_6_7 stock: B-N (ucut false) and B-U (ucut true)"]
          setup_api_calls:
            - { call: "POST /api/seasons", payload: { year: 2026, booking_open_at: "2026-06-01T00:00:00Z", booking_close_at: "2026-08-31T23:59:59Z", harvest_window_start: "2026-11-01", harvest_window_end: "2026-11-25", shipping_window_start: "2026-11-15T00:00:00Z", shipping_window_end: "2026-12-10T23:59:59Z" }, as: Owner, captures: { s: $.data.id } }
            - { call: "POST /api/blocks", payload: { season_id: "${s}", block_code: "B-N", acreage: 5.0 }, as: FarmManager, captures: { blkn: $.data.id } }
            - { call: "POST /api/crop-lots", payload: { block_id: "${blkn}", species: "NOBLE_FIR", planted_year: 2019, initial_counts: { H_4_5: 0, H_5_6: 0, H_6_7: 10, H_7_8: 0, H_8_9: 0, H_9_PLUS: 0 } }, as: FarmManager, captures: { lotn: $.data.id } }
            - { call: "GET /api/crop-lots/${lotn}/stand-buckets", payload: {}, as: FarmManager, captures: { bn: "$.data[2].id" } }
            - { call: "POST /api/blocks/${blkn}/advance-rotation", payload: {}, as: FarmManager }
            - { call: "POST /api/blocks/${blkn}/advance-rotation", payload: {}, as: FarmManager }
            - { call: "POST /api/blocks", payload: { season_id: "${s}", block_code: "B-U", acreage: 5.0, ucut_designated: true }, as: FarmManager, captures: { blku: $.data.id } }
            - { call: "POST /api/crop-lots", payload: { block_id: "${blku}", species: "NOBLE_FIR", planted_year: 2019, initial_counts: { H_4_5: 0, H_5_6: 0, H_6_7: 10, H_7_8: 0, H_8_9: 0, H_9_PLUS: 0 } }, as: FarmManager, captures: { lotu: $.data.id } }
            - { call: "GET /api/crop-lots/${lotu}/stand-buckets", payload: {}, as: FarmManager, captures: { bu: "$.data[2].id" } }
