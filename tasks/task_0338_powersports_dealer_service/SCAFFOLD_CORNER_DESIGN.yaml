          - "concurrency_rules[part-line-create-stale-part]"
          - "errors[ERR_STALE_PART_VERSION]"
          - "entities.Part.fields.version"
        distinguishing_aspect: "Reserving a second PartLine with the pre-first-reservation part version (now stale) -> ERR_STALE_PART_VERSION (412)."
        test_recipe:
          setup: ["A Part on_hand 10; an OPEN RO. One PartLine reserves qty 2, bumping part.version; the test re-uses the stale pre-reservation version."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T08:00:00.000Z" }
              as: DealerPrincipal
            - call: "POST /customers"
              payload: { full_name: "Occ Part", email: "occpart@x.com", phone: "555-0218" }
              as: ServiceAdvisor
              captures: { cust_id: $.data.id }
            - call: "POST /units"
              payload: { vin: "1HD1KB4197Y000271", category: "ATV", model_year: 2024, msrp_cents: 900000, dealer_cost_cents: 700000, acquisition_kind: "CASH_OWNED" }
              as: SalesManager
              captures: { unit_id: $.data.id }
            - call: "POST /units/${unit_id}/receive"
              payload: {}
              as: SalesManager
            - call: "POST /technicians"
              payload: { name: "Tech Occ", hourly_cost_cents: 4000 }
              as: ServiceAdvisor
              captures: { tech_id: $.data.id }
            - call: "POST /repair-orders"
              payload: { unit_id: "${unit_id}", customer_id: "${cust_id}", technician_id: "${tech_id}", appointment_start: "2026-06-17T09:00:00.000Z", appointment_end: "2026-06-17T11:00:00.000Z", is_warranty: false, authorized_amount_cents: 90000 }
              as: ServiceAdvisor
              captures: { ro_id: $.data.id }
            - call: "POST /parts"
              payload: { sku: "OCC-PART", description: "Occ part", unit_price_cents: 3000, on_hand_qty: 10 }
              as: PartsClerk
              captures: { part_id: $.data.id, part_v: $.data.version }
            - call: "POST /part-lines"
              payload: { repair_order_id: "${ro_id}", part_id: "${part_id}", quantity: 2, expected_part_version: "${part_v}" }
              as: PartsClerk
          trigger:
            - call: "POST /part-lines"
              payload: { repair_order_id: "${ro_id}", part_id: "${part_id}", quantity: 2, expected_part_version: "${part_v}" }
              as: PartsClerk
              captures: { err: $.data.error_id }
          assert:
            - "response status == 412"
            - "data.error_id == ERR_STALE_PART_VERSION"
            - "Part.${part_id}.reserved_qty == 2"

      - name: occ_correct_loan_version_succeeds
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[curtailment-create-stale-loan]"
          - "entities.FloorPlanLoan.fields.version"
        distinguishing_aspect: "A curtailment carrying the CURRENT loan version succeeds (201) and bumps loan.version — the positive partner of the stale-version OCC corner."
        test_recipe:
          setup: ["A floored OPEN loan (advance 1000000)."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-01T00:00:00.000Z" }
              as: DealerPrincipal
            - call: "POST /units"
              payload: { vin: "1HD1KB4197Y000272", category: "ATV", model_year: 2024, msrp_cents: 1300000, dealer_cost_cents: 1000000, acquisition_kind: "NEW_FLOORED" }
              as: DealerPrincipal
              captures: { unit_id: $.data.id }
            - call: "POST /units/${unit_id}/receive"
              payload: {}
              as: DealerPrincipal
            - call: "POST /floor-plan-loans"
              payload: { unit_id: "${unit_id}", opened_on: "2026-01-01T00:00:00.000Z", apr_bps: 900 }
              as: DealerPrincipal
              captures: { loan_id: $.data.id, loan_v: $.data.version }
          trigger:
            - call: "POST /curtailments"
              payload: { floor_plan_loan_id: "${loan_id}", principal_cents: 100000, reason: "VOLUNTARY", expected_floor_plan_loan_version: "${loan_v}" }
              as: DealerPrincipal
          assert:
            - "response status == 201"
            - "FloorPlanLoan.${loan_id}.principal_outstanding_cents == 900000"
            - "FloorPlanLoan.${loan_id}.version == 2"

      - name: deal_quote_holds_unit_cascade
        claim_type: cascading_side_effects
        grounds:
          - "state_machines.Deal.DRAFT_to_QUOTED"
          - "state_machines.Unit.IN_STOCK_to_ON_HOLD"
          - "entities.Unit.fields.held_by_deal_id"
        distinguishing_aspect: "Quoting a deal cascades to the unit: Unit IN_STOCK -> ON_HOLD and held_by_deal_id is set to the deal id."
        test_recipe:
          setup: ["A Customer and IN_STOCK Unit; a DRAFT Deal references them."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Hld Unit", email: "hldunit@x.com", phone: "555-0219" }
              as: SalesManager
              captures: { cust_id: $.data.id }
            - call: "POST /units"
              payload: { vin: "1HD1KB4197Y000273", category: "MOTORCYCLE", model_year: 2024, msrp_cents: 1400000, dealer_cost_cents: 1000000, acquisition_kind: "CASH_OWNED" }
              as: SalesManager
              captures: { unit_id: $.data.id }
            - call: "POST /units/${unit_id}/receive"
              payload: {}
              as: SalesManager
            - call: "POST /deals"
              payload: { customer_id: "${cust_id}", unit_id: "${unit_id}", sale_price_cents: 1400000, tax_rate_bps: 800 }
              as: SalesManager
              captures: { deal_id: $.data.id }
          trigger:
            - call: "POST /deals/${deal_id}/quote"
              payload: {}
              as: SalesManager
          assert:
            - "Unit.${unit_id}.status == ON_HOLD"
            - "Unit.${unit_id}.held_by_deal_id == ${deal_id}"

      - name: quote_in_transit_unit_rejected
        claim_type: rate_threshold_triggers
        grounds:
          - "state_machines.Deal.DRAFT_to_QUOTED"
          - "errors[ERR_UNIT_NOT_AVAILABLE]"
          - "entities.Unit.fields.status"
        distinguishing_aspect: "Quoting a deal whose unit is still IN_TRANSIT (never received) -> ERR_UNIT_NOT_AVAILABLE (409); the IN_STOCK precondition gates the quote."
        test_recipe:
          setup: ["A Customer and an IN_TRANSIT Unit (never received); a DRAFT Deal references them."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Trn Unit", email: "trnunit@x.com", phone: "555-0220" }
              as: SalesManager
              captures: { cust_id: $.data.id }
            - call: "POST /units"
              payload: { vin: "1HD1KB4197Y000274", category: "MOTORCYCLE", model_year: 2024, msrp_cents: 1400000, dealer_cost_cents: 1000000, acquisition_kind: "CASH_OWNED" }
              as: SalesManager
              captures: { unit_id: $.data.id }
            - call: "POST /deals"
              payload: { customer_id: "${cust_id}", unit_id: "${unit_id}", sale_price_cents: 1400000, tax_rate_bps: 800 }
              as: SalesManager
              captures: { deal_id: $.data.id }
          trigger:
            - call: "POST /deals/${deal_id}/quote"
              payload: {}
              as: SalesManager
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_UNIT_NOT_AVAILABLE"
            - "Unit.${unit_id}.status == IN_TRANSIT"

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_consistency_deal_quote_reflected_in_same_response
        claim_type: immediate
        grounds:
          - "state_machines.Deal.DRAFT_to_QUOTED"
          - "entities.Deal.fields.out_the_door_cents"
        distinguishing_aspect: "The quote response itself carries the freshly computed out_the_door_cents (1119900) and status==QUOTED (immediate consistency; no re-read needed)."
        test_recipe:
          setup: ["A Customer and IN_STOCK Unit; a DRAFT Deal sale 1000000 freight 0 tax 800 doc 39900 no trade -> OTD 1000000 + round(1000000*0.08)=80000 + 0 + 39900 = 1119900."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Imm Deal", email: "immdeal@x.com", phone: "555-0221" }
              as: SalesManager
              captures: { cust_id: $.data.id }
            - call: "POST /units"
              payload: { vin: "1HD1KB4197Y000280", category: "MOTORCYCLE", model_year: 2024, msrp_cents: 1400000, dealer_cost_cents: 1000000, acquisition_kind: "CASH_OWNED" }
              as: SalesManager
              captures: { unit_id: $.data.id }
            - call: "POST /units/${unit_id}/receive"
              payload: {}
              as: SalesManager
            - call: "POST /deals"
              payload: { customer_id: "${cust_id}", unit_id: "${unit_id}", sale_price_cents: 1000000, freight_setup_cents: 0, tax_rate_bps: 800, doc_fee_cents: 39900, down_payment_cents: 0 }
              as: SalesManager
              captures: { deal_id: $.data.id }
          trigger:
            - call: "POST /deals/${deal_id}/quote"
              payload: {}
              as: SalesManager
              captures: { otd: $.data.out_the_door_cents, st: $.data.status }
          assert:
            - "the quote response data.out_the_door_cents == 1119900"
            - "the quote response data.status == QUOTED"

