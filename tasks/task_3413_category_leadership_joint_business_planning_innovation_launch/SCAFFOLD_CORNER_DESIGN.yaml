            as: ManufacturerPlanner
            captures: { err: "$.data.error_id" }
        assert:
          - "error_id == ERR_FORBIDDEN (403)"

    - name: retailer_buyer_read_other_retailer_plan_returns_scope_mismatch
      claim_type: role_denied
      grounds: [roles.RetailerBuyer, "validations[priority=3]"]
      distinguishing_aspect: "Scope restriction covers reads too: a buyer reading another retailer's plan gets ERR_RETAILER_SCOPE_MISMATCH, not the plan payload."
      test_recipe:
        setup: ["retailers A and B; plan for retailer A"]
        setup_api_calls:
          - call: "POST /jbp/retailers"
            payload: { name: "Retailer Alpha", country_code: "US", channels: ["MASS"] }
            as: PlatformAdmin
            captures: { ret_a: "$.data.id" }
          - call: "POST /jbp/retailers"
            payload: { name: "Retailer Beta", country_code: "US", channels: ["GROCERY"] }
            as: PlatformAdmin
            captures: { ret_b: "$.data.id" }
          - call: "POST /jbp/categories"
            payload: { name: "Laundry Care" }
            as: PlatformAdmin
            captures: { cat_id: "$.data.id" }
          - call: "POST /jbp/plans"
            payload: { retailer_id: "${ret_a}", category_id: "${cat_id}", fiscal_year: 2027, growth_target_pct: 8, weekly_baseline_cases: 100, avg_unit_net_price_cents: 450 }
            as: ManufacturerPlanner
            captures: { plan_id: "$.data.id" }
        trigger:
          - call: "GET /jbp/plans/${plan_id}"
            as: RetailerBuyer
            as_user_id: "${ret_b}"
            captures: { err: "$.data.error_id" }
        assert:
          - "error_id == ERR_RETAILER_SCOPE_MISMATCH (403) — cross-retailer reads are refused, not filtered"

- section: cross_cutting_complexity_layers
  instances:
    - name: occ_stale_expected_plan_version_returns_412
      claim_type: layer_claim
      grounds: ["concurrency_rules[shelf-rec-create-stale-plan]"]
      distinguishing_aspect: "Shelf-rec create carrying the plan version captured before activation (2) against the post-activation version (3) fails 412 ERR_STALE_VERSION; no recommendation is persisted."
      test_recipe:
        setup: ["plan ACCEPTED (version 2 captured), then ACTIVATED (version 3); ACCEPTED analysis"]
        setup_api_calls:
          - call: "POST /jbp/retailers"
            payload: { name: "Retailer Alpha", country_code: "US", channels: ["MASS"] }
            as: PlatformAdmin
            captures: { ret_id: "$.data.id" }
          - call: "POST /jbp/categories"
            payload: { name: "Laundry Care" }
            as: PlatformAdmin
            captures: { cat_id: "$.data.id" }
          - call: "POST /jbp/plans"
            payload: { retailer_id: "${ret_id}", category_id: "${cat_id}", fiscal_year: 2027, growth_target_pct: 8, weekly_baseline_cases: 100, avg_unit_net_price_cents: 450 }
            as: ManufacturerPlanner
            captures: { plan_id: "$.data.id" }
          - call: "POST /jbp/plans/${plan_id}/decide"
            payload: { decision: "ACCEPT" }
            as: RetailerBuyer
            as_user_id: "${ret_id}"
            captures: { plan_v2: "$.data.version" }
          - call: "POST /jbp/plans/${plan_id}/activate"
            payload: { accrual_rate_pct: 4, edlp_split_pct: 60 }
            as: ManufacturerPlanner
          - call: "POST /jbp/plans/${plan_id}/category-analyses"
            payload: { title: "Review", period_label: "2027-H1", total_category_growth_pct: 6, manufacturer_share_pct: 55 }
            as: CategoryAdvisor
            captures: { ana_id: "$.data.id" }
          - call: "POST /jbp/category-analyses/${ana_id}/decide"
            payload: { decision: "ACCEPT" }
            as: RetailerBuyer
            as_user_id: "${ret_id}"
        trigger:
          - call: "POST /jbp/plans/${plan_id}/shelf-recommendations"
            payload: { expected_plan_version: "${plan_v2}", title: "Stale Reset", space_change_pct: 5, target_store_count: 100 }
            as: CategoryAdvisor
            captures: { err: "$.data.error_id" }
          - call: "GET /jbp/plans/${plan_id}/shelf-recommendations"
            as: CategoryAdvisor
        assert:
          - "error_id == ERR_STALE_VERSION (412): captured version 2 != current version 3"
          - "no shelf recommendation persisted (list is empty)"

    - name: occ_fresh_version_succeeds_and_bumps_plan_version
      claim_type: layer_claim
      grounds: ["concurrency_rules[shelf-rec-create-stale-plan]"]
      distinguishing_aspect: "Shelf-rec create carrying the CURRENT plan version succeeds and itself bumps JointBusinessPlan.version by 1 (the OCC write-side contract)."
      test_recipe:
        setup: ["plan ACTIVATED (version 3 captured from activate response); ACCEPTED analysis"]
        setup_api_calls:
          - call: "POST /jbp/retailers"
            payload: { name: "Retailer Alpha", country_code: "US", channels: ["MASS"] }
            as: PlatformAdmin
            captures: { ret_id: "$.data.id" }
          - call: "POST /jbp/categories"
            payload: { name: "Laundry Care" }
            as: PlatformAdmin
            captures: { cat_id: "$.data.id" }
          - call: "POST /jbp/plans"
            payload: { retailer_id: "${ret_id}", category_id: "${cat_id}", fiscal_year: 2027, growth_target_pct: 8, weekly_baseline_cases: 100, avg_unit_net_price_cents: 450 }
            as: ManufacturerPlanner
            captures: { plan_id: "$.data.id" }
          - call: "POST /jbp/plans/${plan_id}/decide"
            payload: { decision: "ACCEPT" }
            as: RetailerBuyer
            as_user_id: "${ret_id}"
          - call: "POST /jbp/plans/${plan_id}/activate"
            payload: { accrual_rate_pct: 4, edlp_split_pct: 60 }
            as: ManufacturerPlanner
            captures: { plan_v3: "$.data.version" }
          - call: "POST /jbp/plans/${plan_id}/category-analyses"
            payload: { title: "Review", period_label: "2027-H1", total_category_growth_pct: 6, manufacturer_share_pct: 55 }
            as: CategoryAdvisor
            captures: { ana_id: "$.data.id" }
          - call: "POST /jbp/category-analyses/${ana_id}/decide"
            payload: { decision: "ACCEPT" }
            as: RetailerBuyer
            as_user_id: "${ret_id}"
        trigger:
          - call: "POST /jbp/plans/${plan_id}/shelf-recommendations"
            payload: { expected_plan_version: "${plan_v3}", title: "Reset A", space_change_pct: 5, target_store_count: 100 }
            as: CategoryAdvisor
            captures: { shelf_id: "$.data.id" }
          - call: "GET /jbp/plans/${plan_id}"
            as: CategoryAdvisor
        assert:
          - "create succeeds 201 with status PROPOSED"
          - "JointBusinessPlan.${plan_id}.version == 4 (the create bumped the parent version by exactly 1)"

    - name: version_increments_on_each_plan_mutation
      claim_type: layer_claim
      grounds: [entities.JointBusinessPlan.fields.version]
      distinguishing_aspect: "Every successful plan mutation increments version by exactly 1: create=1, negotiate=2, decide=3, activate=4."
      test_recipe:
        setup: ["retailer and category exist"]
        setup_api_calls:
          - call: "POST /jbp/retailers"
            payload: { name: "Retailer Alpha", country_code: "US", channels: ["MASS"] }
            as: PlatformAdmin
            captures: { ret_id: "$.data.id" }
          - call: "POST /jbp/categories"
            payload: { name: "Laundry Care" }
            as: PlatformAdmin
            captures: { cat_id: "$.data.id" }
        trigger:
          - call: "POST /jbp/plans"
            payload: { retailer_id: "${ret_id}", category_id: "${cat_id}", fiscal_year: 2027, growth_target_pct: 8, weekly_baseline_cases: 100, avg_unit_net_price_cents: 450 }
            as: ManufacturerPlanner
            captures: { plan_id: "$.data.id", v1: "$.data.version" }
          - call: "POST /jbp/plans/${plan_id}/negotiate"
            payload: { growth_target_pct: 9 }
            as: RetailerBuyer
            as_user_id: "${ret_id}"
            captures: { v2: "$.data.version" }
          - call: "POST /jbp/plans/${plan_id}/decide"
            payload: { decision: "ACCEPT" }
            as: ManufacturerPlanner
            captures: { v3: "$.data.version" }
          - call: "POST /jbp/plans/${plan_id}/activate"
            payload: { accrual_rate_pct: 4, edlp_split_pct: 60 }
            as: ManufacturerPlanner
            captures: { v4: "$.data.version" }
        assert:
          - "versions are exactly 1, 2, 3, 4 across create, negotiate, decide(ACCEPT from COUNTERED by ManufacturerPlanner), activate"

    - name: cascading_side_effects_covered
      claim_type: layer_claim
      grounds: [complexity_profile.complexity_layers]
      excluded_because:
        difficulty_instance: "transitive_cascade / deduction_settle_cascade_to_review_posture"
        rationale: "The 3-hop deduction->fund->review->posture cascade is asserted end-to-end by the named difficulty instance; the delist cascade by delist_finalize_cascade_retires_price_packs."

    - name: dual_variant_calculation_covered
      claim_type: layer_claim
      grounds: [complexity_profile.complexity_layers]
      excluded_because:
        difficulty_instance: "dual_variant_calc / fund_accrual_basis_vs_cash_basis"
        rationale: "Both dual-variant calculations are asserted by the two dual_variant_calc difficulty instances."

    - name: derived_field_reconciliation_covered
      claim_type: layer_claim
      grounds: [entities.TradeFund.fields.event_available_cents]
      excluded_because:
        difficulty_instance: "compensating_invariant / event_lock_cancel_conserves_event_funding"
        rationale: "event_available_cents reconciliation across accrual, lock, and cancel is asserted step-by-step by the named difficulty instance."

- section: consistency_model
  instances:
    - name: mutation_visible_immediately_in_read
      claim_type: immediate_visibility
      grounds: [complexity_profile.consistency_model]
      distinguishing_aspect: "Immediate consistency: the decide ACCEPT response itself shows ACCEPTED, and a subsequent GET returns the identical state and version — no lag."
      test_recipe:
        setup: ["plan PROPOSED"]
        setup_api_calls:
          - call: "POST /jbp/retailers"
            payload: { name: "Retailer Alpha", country_code: "US", channels: ["MASS"] }
            as: PlatformAdmin
            captures: { ret_id: "$.data.id" }
          - call: "POST /jbp/categories"
            payload: { name: "Laundry Care" }
            as: PlatformAdmin
            captures: { cat_id: "$.data.id" }
          - call: "POST /jbp/plans"
            payload: { retailer_id: "${ret_id}", category_id: "${cat_id}", fiscal_year: 2027, growth_target_pct: 8, weekly_baseline_cases: 100, avg_unit_net_price_cents: 450 }
            as: ManufacturerPlanner
            captures: { plan_id: "$.data.id" }
        trigger:
          - call: "POST /jbp/plans/${plan_id}/decide"
            payload: { decision: "ACCEPT" }
            as: RetailerBuyer
            as_user_id: "${ret_id}"
            captures: { v_accept: "$.data.version" }
          - call: "GET /jbp/plans/${plan_id}"
            as: ManufacturerPlanner
        assert:
          - "decide response shows status ACCEPTED and version 2"
          - "immediately following GET shows status ACCEPTED and the same version (2) and updated_at >= created_at"
