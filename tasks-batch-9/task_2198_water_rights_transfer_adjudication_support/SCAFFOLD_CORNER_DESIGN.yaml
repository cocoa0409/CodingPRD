            - {call: "POST /water-rights/${wr}/beneficial-use-records", payload: {use_year: 2023, reported_diversion_af: 300.000, irrigated_acres: 100.00, verification_source: METER}, as: WaterRightsAnalyst}
            - {call: "POST /water-rights/${wr}/beneficial-use-records", payload: {use_year: 2024, reported_diversion_af: 300.000, irrigated_acres: 100.00, verification_source: METER}, as: WaterRightsAnalyst}
            - {call: "POST /water-rights/${wr}/beneficial-use-records", payload: {use_year: 2025, reported_diversion_af: 300.000, irrigated_acres: 100.00, verification_source: METER}, as: WaterRightsAnalyst}
            - {call: "POST /water-rights/${wr}/activate", as: WaterRightsAnalyst}
            - {call: "POST /water-rights/${wr}/hcu-studies", payload: {method: DIVERSION_BASED, study_period_start_year: 2023, study_period_end_year: 2025}, as: WaterRightsAnalyst, captures: {st: "$.data.id"}}
            - {call: "GET /water-rights/${wr}", as: WaterRightsAnalyst, captures: {wr_v1: "$.data.version"}}
            - {call: "POST /hcu-studies/${st}/certify", payload: {expected_water_right_version: "${wr_v1}"}, as: WaterRightsAnalyst}
            - {call: "POST /transfer-applications", payload: {water_right_id: "${wr}", hcu_study_id: "${st}", application_type: CHANGE_OF_USE, requested_af: 100.00, proposed_purpose_of_use: MUNICIPAL}, as: WaterRightsAnalyst, captures: {app: "$.data.id"}}
          trigger:
            - {call: "POST /transfer-applications/${app}/decide", payload: {disposition: APPROVE, decision_note: "Premature decision attempt."}, as: DecisionAuthority, captures: {err: "$.data.error_id"}}
          assert:
            - "HTTP 409 with error_id ERR_INVALID_STATE."
            - "ERR_INJURY_ANALYSIS_MISSING (422) must NOT be returned."
            - "The application stays DRAFT with decided_by_user_id null and its version unchanged; the right's ledger stays 195.00 / 0.00 / 0.00."

      - name: val_satisfaction_and_violation_at_the_examiner_recommendation_ceiling
        claim_type: satisfaction_to_pass
        grounds:
          - validations[priority=47]
          - calculations.decreed_volume
        distinguishing_aspect: >-
          The recommendation bound is inclusive at the top and exclusive at the
          bottom: examiner_recommended_af exactly equal to claimed_af is accepted
          (and makes the min() floor a no-op), one cent above it is rejected, and
          0.00 is rejected — three points on the same rule in one docket.
        test_recipe:
          setup:
            - "Clock 2026-03-01T00:00:00Z; docket SNK-ADJ-03 with filing deadline 2026-04-01T00:00:00Z carrying claims C1, C2 and C3, each claiming 100.00 AF on its own right; docket advanced to EXAMINATION after the deadline."
          setup_api_calls:
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-03-01T00:00:00Z"}, as: WaterRightsAnalyst}
            - {call: "POST /claimants", payload: {legal_name: "Vega Ditch Company", contact_email: "ops@vega.example", entity_type: IRRIGATION_DISTRICT}, as: WaterRightsAnalyst, captures: {cl_a: "$.data.id"}}
            - {call: "POST /water-rights", payload: {claimant_id: "${cl_a}", right_number: "WR-2198-001", priority_date: "1901-05-01T00:00:00Z", source_stream_code: "SNK-14", purpose_of_use: IRRIGATION, place_of_use_acres: 120.00, authorized_diversion_af: 400.00, authorized_rate_cfs: 5.000}, as: WaterRightsAnalyst, captures: {wr1: "$.data.id"}}
            - {call: "POST /water-rights", payload: {claimant_id: "${cl_a}", right_number: "WR-2198-002", priority_date: "1901-05-01T00:00:00Z", source_stream_code: "SNK-14", purpose_of_use: IRRIGATION, place_of_use_acres: 120.00, authorized_diversion_af: 400.00, authorized_rate_cfs: 5.000}, as: WaterRightsAnalyst, captures: {wr2: "$.data.id"}}
            - {call: "POST /water-rights", payload: {claimant_id: "${cl_a}", right_number: "WR-2198-003", priority_date: "1901-05-01T00:00:00Z", source_stream_code: "SNK-14", purpose_of_use: IRRIGATION, place_of_use_acres: 120.00, authorized_diversion_af: 400.00, authorized_rate_cfs: 5.000}, as: WaterRightsAnalyst, captures: {wr3: "$.data.id"}}
            - {call: "POST /decree-dockets", payload: {basin_code: "SNK", docket_number: "SNK-ADJ-03", claim_filing_deadline: "2026-04-01T00:00:00Z"}, as: BasinAdjudicator, captures: {dk: "$.data.id"}}
            - {call: "POST /adjudication-claims", payload: {decree_docket_id: "${dk}", water_right_id: "${wr1}", claimed_priority_date: "1901-05-01T00:00:00Z", claimed_af: 100.00}, as: BasinAdjudicator, captures: {c1: "$.data.id"}}
            - {call: "POST /adjudication-claims", payload: {decree_docket_id: "${dk}", water_right_id: "${wr2}", claimed_priority_date: "1901-05-01T00:00:00Z", claimed_af: 100.00}, as: BasinAdjudicator, captures: {c2: "$.data.id"}}
            - {call: "POST /adjudication-claims", payload: {decree_docket_id: "${dk}", water_right_id: "${wr3}", claimed_priority_date: "1901-05-01T00:00:00Z", claimed_af: 100.00}, as: BasinAdjudicator, captures: {c3: "$.data.id"}}
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-04-02T00:00:00Z"}, as: WaterRightsAnalyst}
            - {call: "POST /decree-dockets/${dk}/advance-phase", payload: {target_phase: EXAMINATION}, as: BasinAdjudicator}
          trigger:
            - {call: "POST /adjudication-claims/${c1}/examine", payload: {examiner_recommended_af: 100.00, examination_note: "Recommendation equals the claim."}, as: BasinAdjudicator}
            - {call: "POST /adjudication-claims/${c2}/examine", payload: {examiner_recommended_af: 100.01, examination_note: "Recommendation one cent above the claim."}, as: BasinAdjudicator, captures: {err_hi: "$.data.error_id"}}
            - {call: "POST /adjudication-claims/${c3}/examine", payload: {examiner_recommended_af: 0.00, examination_note: "Zero recommendation."}, as: BasinAdjudicator, captures: {err_lo: "$.data.error_id"}}
          assert:
            - "C1: HTTP 200, filing_status EXAMINED, examiner_recommended_af 100.00 — equality satisfies the `<= claimed_af` bound."
            - "C2: HTTP 422 with error_id ERR_RECOMMENDATION_EXCEEDS_CLAIM; filing_status stays FILED and examiner_recommended_af stays null."
            - "C3: HTTP 422 with error_id ERR_RECOMMENDATION_EXCEEDS_CLAIM as well — the bound is `> 0` at the bottom, so 0.00 is not admissible."
            - "DecreeDocket.claim_count stays 3 and decreed_claim_count stays 0; only C1's version moved."

      - name: val_cross_entity_field_verification_requires_metered_or_aerial_evidence
        claim_type: violation_to_error
        grounds:
          - validations[priority=29]
          - entities.BeneficialUseRecord.verification_source
          - state_machines.AdjudicationClaim.verification_status
        distinguishing_aspect: >-
          The same rule at priority 29 guards two different endpoints, and on the
          claim-verification endpoint it is conditional on the requested outcome:
          DISPUTED needs no evidence at all, FIELD_VERIFIED on an affidavit-only
          right is rejected, and adding one AERIAL_IMAGERY record makes the very
          same call succeed.
        test_recipe:
          setup:
            - "Clock 2026-03-01T00:00:00Z; UNADJUDICATED right holding only an AFFIDAVIT beneficial-use record (which is also why it cannot be activated), with a filed claim on an open docket."
          setup_api_calls:
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-03-01T00:00:00Z"}, as: WaterRightsAnalyst}
            - {call: "POST /claimants", payload: {legal_name: "Vega Ditch Company", contact_email: "ops@vega.example", entity_type: IRRIGATION_DISTRICT}, as: WaterRightsAnalyst, captures: {cl_a: "$.data.id"}}
            - {call: "POST /water-rights", payload: {claimant_id: "${cl_a}", right_number: "WR-2198-001", priority_date: "1901-05-01T00:00:00Z", source_stream_code: "SNK-14", purpose_of_use: IRRIGATION, place_of_use_acres: 120.00, authorized_diversion_af: 400.00, authorized_rate_cfs: 5.000}, as: WaterRightsAnalyst, captures: {wr: "$.data.id"}}
            - {call: "POST /water-rights/${wr}/beneficial-use-records", payload: {use_year: 2025, reported_diversion_af: 300.000, irrigated_acres: 100.00, verification_source: AFFIDAVIT}, as: WaterRightsAnalyst}
            - {call: "POST /decree-dockets", payload: {basin_code: "SNK", docket_number: "SNK-ADJ-04", claim_filing_deadline: "2026-04-01T00:00:00Z"}, as: BasinAdjudicator, captures: {dk: "$.data.id"}}
            - {call: "POST /adjudication-claims", payload: {decree_docket_id: "${dk}", water_right_id: "${wr}", claimed_priority_date: "1901-05-01T00:00:00Z", claimed_af: 100.00}, as: BasinAdjudicator, captures: {cm: "$.data.id"}}
          trigger:
            - {call: "POST /adjudication-claims/${cm}/verify", payload: {verification_outcome: DISPUTED, field_note: "Records are inconsistent; disputed pending survey."}, as: WaterRightsAnalyst}
            - {call: "POST /adjudication-claims/${cm}/verify", payload: {verification_outcome: FIELD_VERIFIED, field_note: "Affidavit only."}, as: WaterRightsAnalyst, captures: {err: "$.data.error_id"}}
            - {call: "POST /water-rights/${wr}/beneficial-use-records", payload: {use_year: 2024, reported_diversion_af: 300.000, irrigated_acres: 100.00, verification_source: AERIAL_IMAGERY}, as: WaterRightsAnalyst}
            - {call: "POST /adjudication-claims/${cm}/verify", payload: {verification_outcome: FIELD_VERIFIED, field_note: "Aerial imagery reconciles the claimed acreage."}, as: WaterRightsAnalyst}
          assert:
            - "First call: HTTP 200, verification_status DISPUTED — no evidence rule applies to this outcome."
            - "Second call: HTTP 422 with error_id ERR_NO_VERIFIED_USE_EVIDENCE; verification_status stays DISPUTED and the claim's version does not move."
            - "Third call (after the AERIAL_IMAGERY record exists): HTTP 200 and verification_status DISPUTED -> FIELD_VERIFIED — the identical payload now passes because the evidence lives on a DIFFERENT entity."
            - "filing_status stays FILED throughout: the evidentiary axis moved without touching the procedural one, and no docket counter changed."

      - name: val_temporal_claim_filing_closes_at_the_deadline_instant
        claim_type: violation_to_error
        grounds:
          - validations[priority=33]
          - entities.DecreeDocket.claim_filing_deadline
        distinguishing_aspect: >-
          The filing gate is strictly-before, so a claim lodged one second early is
          accepted and a claim lodged AT the deadline instant is late — the
          equality case falls on the closed side, the opposite convention from the
          lease delivery window's inclusive start.
        test_recipe:
          setup:
            - "Docket SNK-ADJ-05 with claim_filing_deadline 2026-04-01T00:00:00Z; two rights available so the duplicate-claim rule is not implicated."
          setup_api_calls:
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-03-01T00:00:00Z"}, as: WaterRightsAnalyst}
            - {call: "POST /claimants", payload: {legal_name: "Vega Ditch Company", contact_email: "ops@vega.example", entity_type: IRRIGATION_DISTRICT}, as: WaterRightsAnalyst, captures: {cl_a: "$.data.id"}}
            - {call: "POST /water-rights", payload: {claimant_id: "${cl_a}", right_number: "WR-2198-001", priority_date: "1901-05-01T00:00:00Z", source_stream_code: "SNK-14", purpose_of_use: IRRIGATION, place_of_use_acres: 120.00, authorized_diversion_af: 400.00, authorized_rate_cfs: 5.000}, as: WaterRightsAnalyst, captures: {wr1: "$.data.id"}}
            - {call: "POST /water-rights", payload: {claimant_id: "${cl_a}", right_number: "WR-2198-002", priority_date: "1901-05-01T00:00:00Z", source_stream_code: "SNK-14", purpose_of_use: IRRIGATION, place_of_use_acres: 120.00, authorized_diversion_af: 400.00, authorized_rate_cfs: 5.000}, as: WaterRightsAnalyst, captures: {wr2: "$.data.id"}}
            - {call: "POST /decree-dockets", payload: {basin_code: "SNK", docket_number: "SNK-ADJ-05", claim_filing_deadline: "2026-04-01T00:00:00Z"}, as: BasinAdjudicator, captures: {dk: "$.data.id"}}
          trigger:
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-03-31T23:59:59Z"}, as: WaterRightsAnalyst}
            - {call: "POST /adjudication-claims", payload: {decree_docket_id: "${dk}", water_right_id: "${wr1}", claimed_priority_date: "1901-05-01T00:00:00Z", claimed_af: 100.00}, as: BasinAdjudicator, captures: {c1: "$.data.id"}}
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-04-01T00:00:00Z"}, as: WaterRightsAnalyst}
            - {call: "POST /adjudication-claims", payload: {decree_docket_id: "${dk}", water_right_id: "${wr2}", claimed_priority_date: "1901-05-01T00:00:00Z", claimed_af: 100.00}, as: BasinAdjudicator, captures: {err: "$.data.error_id"}}
          assert:
            - "One second before the deadline: HTTP 201, filing_status FILED, verification_status UNVERIFIED, and DecreeDocket.claim_count 1."
            - "At exactly the deadline instant: HTTP 422 with error_id ERR_CLAIM_FILING_CLOSED."
            - "ERR_DOCKET_PHASE_INVALID must NOT be returned — the docket is still OPEN_FOR_CLAIMS, it is the clock that closed the window."
            - "DecreeDocket.claim_count stays 1 and the docket's version does not move on the rejected call."

      - name: val_conditional_mitigation_sufficiency_counts_only_volumetric_conditions
        claim_type: violation_to_error
        grounds:
          - validations[priority=26]
          - validations[priority=27]
          - calculations.injury_net_analysis
        distinguishing_aspect: >-
          One FINALIZED analysis with net_injury_af 20.00 drives two DIFFERENT
          rules depending on the disposition, and the conditional sum ignores
          non-volumetric conditions: a 20.00 AF MEASUREMENT_DEVICE condition
          contributes 0.00 and is rejected, while a 20.00 AF DRY_YEAR_FORBEARANCE
          condition satisfies the rule exactly at equality.
        test_recipe:
          setup:
            - "Clock 2026-03-01T00:00:00Z; right certified at 195.00 AF; application for 100.00 AF with a SEASONAL_AVERAGE analysis and a 58.00 AF return-flow credit, so gross_depletion_af 78.00 and net_injury_af 20.00."
            - "Published and closed without protests, so the analysis is FINALIZED at net_injury_af 20.00 and the application is READY_FOR_DECISION. The DecisionAuthority principal is not the certifying analyst."
          setup_api_calls:
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-03-01T00:00:00Z"}, as: WaterRightsAnalyst}
            - {call: "POST /claimants", payload: {legal_name: "Vega Ditch Company", contact_email: "ops@vega.example", entity_type: IRRIGATION_DISTRICT}, as: WaterRightsAnalyst, captures: {cl_a: "$.data.id"}}
            - {call: "POST /water-rights", payload: {claimant_id: "${cl_a}", right_number: "WR-2198-001", priority_date: "1901-05-01T00:00:00Z", source_stream_code: "SNK-14", purpose_of_use: IRRIGATION, place_of_use_acres: 120.00, authorized_diversion_af: 400.00, authorized_rate_cfs: 5.000}, as: WaterRightsAnalyst, captures: {wr: "$.data.id"}}
            - {call: "POST /water-rights/${wr}/beneficial-use-records", payload: {use_year: 2023, reported_diversion_af: 300.000, irrigated_acres: 100.00, verification_source: METER}, as: WaterRightsAnalyst}
            - {call: "POST /water-rights/${wr}/beneficial-use-records", payload: {use_year: 2024, reported_diversion_af: 300.000, irrigated_acres: 100.00, verification_source: METER}, as: WaterRightsAnalyst}
            - {call: "POST /water-rights/${wr}/beneficial-use-records", payload: {use_year: 2025, reported_diversion_af: 300.000, irrigated_acres: 100.00, verification_source: METER}, as: WaterRightsAnalyst}
            - {call: "POST /water-rights/${wr}/activate", as: WaterRightsAnalyst}
            - {call: "POST /water-rights/${wr}/hcu-studies", payload: {method: DIVERSION_BASED, study_period_start_year: 2023, study_period_end_year: 2025}, as: WaterRightsAnalyst, captures: {st: "$.data.id"}}
            - {call: "GET /water-rights/${wr}", as: WaterRightsAnalyst, captures: {wr_v1: "$.data.version"}}
            - {call: "POST /hcu-studies/${st}/certify", payload: {expected_water_right_version: "${wr_v1}"}, as: WaterRightsAnalyst}
            - {call: "POST /transfer-applications", payload: {water_right_id: "${wr}", hcu_study_id: "${st}", application_type: CHANGE_OF_USE, requested_af: 100.00, proposed_purpose_of_use: MUNICIPAL}, as: WaterRightsAnalyst, captures: {app: "$.data.id"}}
            - {call: "POST /transfer-applications/${app}/injury-analyses", payload: {method: SEASONAL_AVERAGE, pod_move_miles: 0.00, return_flow_credit_af: 58.00}, as: WaterRightsAnalyst, captures: {ia: "$.data.id"}}
            - {call: "GET /water-rights/${wr}", as: WaterRightsAnalyst, captures: {wr_v2: "$.data.version"}}
            - {call: "POST /transfer-applications/${app}/submit", payload: {expected_water_right_version: "${wr_v2}"}, as: WaterRightsAnalyst}
            - {call: "POST /transfer-applications/${app}/publish", as: WaterRightsAnalyst}
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-04-01T00:00:00Z"}, as: WaterRightsAnalyst}
            - {call: "POST /transfer-applications/${app}/close-protest-period", as: WaterRightsAnalyst}
          trigger:
            - {call: "POST /transfer-applications/${app}/decide", payload: {disposition: APPROVE, decision_note: "Unconditional approval attempt."}, as: DecisionAuthority, captures: {err_a: "$.data.error_id"}}
            - {call: "POST /transfer-applications/${app}/decide", payload: {disposition: APPROVE_WITH_CONDITIONS, decision_note: "Measuring device only.", conditions: [{condition_type: MEASUREMENT_DEVICE, required_af: 20.00, compliance_due_date: "2026-06-01T00:00:00Z"}]}, as: DecisionAuthority, captures: {err_b: "$.data.error_id"}}
            - {call: "POST /transfer-applications/${app}/decide", payload: {disposition: APPROVE_WITH_CONDITIONS, decision_note: "Device plus dry-year forbearance.", conditions: [{condition_type: MEASUREMENT_DEVICE, required_af: 20.00, compliance_due_date: "2026-06-01T00:00:00Z"}, {condition_type: DRY_YEAR_FORBEARANCE, required_af: 20.00, compliance_due_date: "2026-06-01T00:00:00Z"}]}, as: DecisionAuthority}
          assert:
            - "The FINALIZED analysis reads gross_depletion_af 78.00, offset_af 0.00, net_injury_af 20.00."
            - "APPROVE: HTTP 422 with error_id ERR_UNMITIGATED_INJURY, because 20.00 is not < 0.01."
            - "APPROVE_WITH_CONDITIONS with a device-only condition: HTTP 422 with error_id ERR_MITIGATION_INSUFFICIENT — the qualifying sum is 0.00, not 20.00, because MEASUREMENT_DEVICE is outside {MITIGATION_PAYMENT, DRY_YEAR_FORBEARANCE}."
            - "Both rejections leave the application READY_FOR_DECISION with decided_by_user_id null, zero ApprovalCondition rows and mitigation_fee_total_usd 0.00."
            - "The third call: HTTP 200, status APPROVED_WITH_CONDITIONS — the qualifying sum is exactly 20.00 and equality is sufficient."
            - "Two ApprovalCondition rows exist, both IMPOSED with payment_status NOT_APPLICABLE; mitigation_fee_total_usd stays 0.00, the claimant stays IN_GOOD_STANDING with outstanding_fee_balance_usd 0.00, and the right's ledger reads 95.00 / 0.00 / 100.00."

      - name: val_priority_protest_window_precedes_duplicate_protest
        claim_type: priority_ordering
        grounds:
          - "validations[priority=32]"
          - "validations[priority=39]"
        distinguishing_aspect: >-
          A protestant re-filing after the protest deadline has passed must see the
          temporal error, not the duplicate error.
        excluded_because:
          difficulty_instance: protest_deadline_beats_duplicate_protest
          rationale: >-
            The §1.8 priority-conflict instance constructs exactly this
            double-violation state — an existing non-terminal protest by the same
            protestant AND a clock past protest_deadline — and asserts
            ERR_PROTEST_WINDOW_CLOSED while naming ERR_DUPLICATE_PROTEST as the
            value that must not appear.

      - name: val_priority_lease_window_conflict_precedes_credit_shortfall
        claim_type: priority_ordering
        grounds:
          - "validations[priority=41]"
          - "validations[priority=46]"
        distinguishing_aspect: >-
          A lease that both collides with an existing lease on another headgate of
          the same right and exceeds available credit must report the constraint
          violation, not the fiscal one.
        excluded_because:
          difficulty_instance: lease_window_conflict_beats_insufficient_credit
          rationale: >-
            The §1.8 priority-conflict instance sets up a right with two headgates,
            an overlapping window and deliberately thin credit, and asserts
            ERR_LEASE_WINDOW_CONFLICT with ERR_INSUFFICIENT_BANK_CREDIT excluded —
            the same two rules, same ordering.

      - name: val_priority_standing_sanction_precedes_volume_budget
        claim_type: priority_ordering
        grounds:
          - "validations[priority=24]"
          - "validations[priority=45]"
        distinguishing_aspect: >-
          A DELINQUENT claimant submitting an application that also exceeds the
          transferable-volume budget is stopped by the standing sanction 21
          priorities earlier than the budget check.
        excluded_because:
          difficulty_instance: standing_sanction_beats_volume_budget
          rationale: >-
            The §1.8 priority-conflict instance drives the claimant DELINQUENT via
            an unpaid mitigation fee, then submits an over-budget application and
            asserts ERR_CLAIMANT_NOT_IN_GOOD_STANDING with
            ERR_TRANSFERABLE_VOLUME_EXCEEDED named as the forbidden response.

  - section: endpoints
    instances:
      - name: ep_standard_crud_claimant_create_read_and_narrow_update
        claim_type: standard_crud
        grounds:
          - endpoints[POST /claimants]
          - endpoints[GET /claimants/{id}]
          - endpoints[PATCH /claimants/{id}/standing]
          - response_envelope.success
        distinguishing_aspect: >-
          The Claimant surface is deliberately asymmetric: create and read are
          general, but the only update is the single-field standing PATCH reserved
          to BasinAdjudicator, and there is no list and no delete endpoint
          anywhere in the API. Every response carries the meta envelope.
        test_recipe:
          setup:
            - "Clock 2026-03-01T00:00:00Z; no claimants exist yet."
          setup_api_calls:
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-03-01T00:00:00Z"}, as: WaterRightsAnalyst}
          trigger:
            - {call: "POST /claimants", payload: {legal_name: "Vega Ditch Company", contact_email: "ops@vega.example", entity_type: IRRIGATION_DISTRICT}, as: WaterRightsAnalyst, captures: {cl_a: "$.data.id", cl_v1: "$.data.version"}}
            - {call: "GET /claimants/${cl_a}", as: Claimant, as_user_id: "${cl_a}"}
            - {call: "PATCH /claimants/${cl_a}/standing", payload: {standing_status: DELINQUENT}, as: BasinAdjudicator}
            - {call: "GET /claimants/00000000-0000-0000-0000-000000000000", as: WaterRightsAnalyst, captures: {err: "$.data.error_id"}}
          assert:
            - "Create: HTTP 201, response_type 'object', meta.api_request_id and meta.api_request_timestamp present, data carrying id / created_at / updated_at / version == 1."
            - "Defaults on create: standing_status IN_GOOD_STANDING, outstanding_fee_balance_usd 0.00, open_application_count 0."
            - "Read: HTTP 200 and the data block is field-for-field identical to the creation response, including version 1 — a read never bumps the version."
            - "Standing PATCH: HTTP 200, standing_status DELINQUENT and version 2; no other field of the claimant changed."
            - "Read of an unknown id: HTTP 404 with error_id ERR_CLAIMANT_NOT_FOUND and the same meta envelope with response_type 'error'."
            - "No DELETE endpoint and no list endpoint is declared for Claimant, and no endpoint accepts a full-body claimant update — standing is the sole mutable field."

      - name: ep_action_endpoint_docket_advance_enforces_the_compound_child_gate
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /decree-dockets/{id}/advance-phase]
          - validations[priority=49]
          - state_machines.DecreeDocket.phase
        distinguishing_aspect: >-
          Each target phase carries a DIFFERENT child gate on the same endpoint,
          and one of the reachable states is a dead end: a docket that took no
          claims before its filing deadline can never advance at all, because
          filing is closed and EXAMINATION requires at least one claim.
        test_recipe:
          setup:
            - "Clock 2026-03-01T00:00:00Z. Docket D1 (SNK-ADJ-06) takes one claim before its 2026-04-01T00:00:00Z deadline; docket D2 (SNK-ADJ-07) with the same deadline takes none. The clock is then moved past both deadlines."
          setup_api_calls:
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-03-01T00:00:00Z"}, as: WaterRightsAnalyst}
            - {call: "POST /claimants", payload: {legal_name: "Vega Ditch Company", contact_email: "ops@vega.example", entity_type: IRRIGATION_DISTRICT}, as: WaterRightsAnalyst, captures: {cl_a: "$.data.id"}}
            - {call: "POST /water-rights", payload: {claimant_id: "${cl_a}", right_number: "WR-2198-001", priority_date: "1901-05-01T00:00:00Z", source_stream_code: "SNK-14", purpose_of_use: IRRIGATION, place_of_use_acres: 120.00, authorized_diversion_af: 400.00, authorized_rate_cfs: 5.000}, as: WaterRightsAnalyst, captures: {wr: "$.data.id"}}
            - {call: "POST /decree-dockets", payload: {basin_code: "SNK", docket_number: "SNK-ADJ-06", claim_filing_deadline: "2026-04-01T00:00:00Z"}, as: BasinAdjudicator, captures: {dk1: "$.data.id"}}
            - {call: "POST /decree-dockets", payload: {basin_code: "SNK", docket_number: "SNK-ADJ-07", claim_filing_deadline: "2026-04-01T00:00:00Z"}, as: BasinAdjudicator, captures: {dk2: "$.data.id"}}
            - {call: "POST /adjudication-claims", payload: {decree_docket_id: "${dk1}", water_right_id: "${wr}", claimed_priority_date: "1901-05-01T00:00:00Z", claimed_af: 100.00}, as: BasinAdjudicator, captures: {cm: "$.data.id"}}
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-04-02T00:00:00Z"}, as: WaterRightsAnalyst}
          trigger:
            - {call: "POST /decree-dockets/${dk2}/advance-phase", payload: {target_phase: EXAMINATION}, as: BasinAdjudicator, captures: {err_empty: "$.data.error_id"}}
            - {call: "POST /decree-dockets/${dk1}/advance-phase", payload: {target_phase: EXAMINATION}, as: BasinAdjudicator}
            - {call: "POST /decree-dockets/${dk1}/advance-phase", payload: {target_phase: OBJECTION_PERIOD}, as: BasinAdjudicator, captures: {err_filed: "$.data.error_id"}}
            - {call: "POST /adjudication-claims/${cm}/examine", payload: {examiner_recommended_af: 100.00, examination_note: "Survey supports the full claim."}, as: BasinAdjudicator}
            - {call: "POST /decree-dockets/${dk1}/advance-phase", payload: {target_phase: OBJECTION_PERIOD}, as: BasinAdjudicator}
            - {call: "POST /decree-dockets/${dk1}/advance-phase", payload: {target_phase: CLOSED}, as: BasinAdjudicator, captures: {err_skip: "$.data.error_id"}}
          assert:
            - "D2 (zero claims): HTTP 422 with error_id ERR_DOCKET_CHILDREN_NOT_READY; the docket stays OPEN_FOR_CLAIMS, and since the filing deadline has passed no claim can ever be added — the state is a permanent dead end."
            - "D1 first advance: HTTP 200, phase EXAMINATION, version bumped; the response is the full DecreeDocket, not a bare acknowledgement."
            - "D1 advance to OBJECTION_PERIOD while its only claim is still FILED: HTTP 422 with error_id ERR_DOCKET_CHILDREN_NOT_READY and phase unchanged at EXAMINATION."
            - "After the claim is EXAMINED the identical advance call returns HTTP 200 with phase OBJECTION_PERIOD — the gate is over child state, not over the caller."
            - "Advancing OBJECTION_PERIOD -> CLOSED: HTTP 409 with error_id ERR_INVALID_STATE, because CLOSED is only reachable from DECREE_ENTERED; ERR_DOCKET_CHILDREN_NOT_READY must NOT be returned here."
            - "No claim was mutated by any rejected advance and claim_count stays 1 on D1 and 0 on D2."

      - name: ep_cross_reference_link_lease_binds_account_right_and_headgate
        claim_type: cross_reference_link
        grounds:
          - endpoints[POST /lease-assignments]
          - validations[priority=10]
          - validations[priority=43]
          - entities.LeaseAssignment
        distinguishing_aspect: >-
          The lease is a three-parent junction whose parents must be mutually
          consistent, not merely existent: a headgate belonging to another right is
          rejected at priority 10, a headgate on the right but still PROPOSED is
          rejected 33 priorities later at 43, and only the consistent triple
          creates the association.
        test_recipe:
          setup:
            - "Clock 2026-03-01T00:00:00Z; claimant A owns bank-enrolled right R1 (certified 195.00 AF, activated, headgate POD_A AUTHORIZED) and right R2 (never activated, headgate POD_B still PROPOSED). A bank account for A holds a 90.00 AF deposit from R1."
          setup_api_calls:
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-03-01T00:00:00Z"}, as: WaterRightsAnalyst}
            - {call: "POST /claimants", payload: {legal_name: "Vega Ditch Company", contact_email: "ops@vega.example", entity_type: IRRIGATION_DISTRICT}, as: WaterRightsAnalyst, captures: {cl_a: "$.data.id"}}
            - {call: "POST /water-rights", payload: {claimant_id: "${cl_a}", right_number: "WR-2198-001", priority_date: "1901-05-01T00:00:00Z", source_stream_code: "SNK-14", purpose_of_use: IRRIGATION, place_of_use_acres: 120.00, authorized_diversion_af: 400.00, authorized_rate_cfs: 5.000, bank_enrolled: true}, as: WaterRightsAnalyst, captures: {wr1: "$.data.id"}}
            - {call: "POST /water-rights", payload: {claimant_id: "${cl_a}", right_number: "WR-2198-002", priority_date: "1901-05-01T00:00:00Z", source_stream_code: "SNK-14", purpose_of_use: IRRIGATION, place_of_use_acres: 120.00, authorized_diversion_af: 400.00, authorized_rate_cfs: 5.000, bank_enrolled: true}, as: WaterRightsAnalyst, captures: {wr2: "$.data.id"}}
            - {call: "POST /water-rights/${wr1}/points-of-diversion", payload: {legal_description: "NE1/4 SW1/4 Sec 12 T3N R5E", stream_reach_code: "SNK-14-A", max_rate_cfs: 5.000, stream_miles_from_headwater: 12.40}, as: WaterRightsAnalyst, captures: {pod_a: "$.data.id"}}
            - {call: "POST /water-rights/${wr2}/points-of-diversion", payload: {legal_description: "SW1/4 NE1/4 Sec 18 T3N R5E", stream_reach_code: "SNK-14-B", max_rate_cfs: 5.000, stream_miles_from_headwater: 18.10}, as: WaterRightsAnalyst, captures: {pod_b: "$.data.id"}}
            - {call: "POST /water-rights/${wr1}/beneficial-use-records", payload: {use_year: 2023, reported_diversion_af: 300.000, irrigated_acres: 100.00, verification_source: METER}, as: WaterRightsAnalyst}
            - {call: "POST /water-rights/${wr1}/beneficial-use-records", payload: {use_year: 2024, reported_diversion_af: 300.000, irrigated_acres: 100.00, verification_source: METER}, as: WaterRightsAnalyst}
            - {call: "POST /water-rights/${wr1}/beneficial-use-records", payload: {use_year: 2025, reported_diversion_af: 300.000, irrigated_acres: 100.00, verification_source: METER}, as: WaterRightsAnalyst}
            - {call: "POST /water-rights/${wr1}/activate", as: WaterRightsAnalyst}
            - {call: "POST /water-rights/${wr1}/hcu-studies", payload: {method: DIVERSION_BASED, study_period_start_year: 2023, study_period_end_year: 2025}, as: WaterRightsAnalyst, captures: {st: "$.data.id"}}
            - {call: "GET /water-rights/${wr1}", as: WaterRightsAnalyst, captures: {wr1_v: "$.data.version"}}
            - {call: "POST /hcu-studies/${st}/certify", payload: {expected_water_right_version: "${wr1_v}"}, as: WaterRightsAnalyst}
            - {call: "POST /water-bank-accounts", payload: {claimant_id: "${cl_a}", basin_code: "SNK"}, as: WaterRightsAnalyst, captures: {acct: "$.data.id", acct_v: "$.data.version"}}
            - {call: "POST /water-bank-accounts/${acct}/deposits", payload: {water_right_id: "${wr1}", deposit_af: 90.00, expected_water_bank_account_version: "${acct_v}"}, as: WaterRightsAnalyst}
          trigger:
            - {call: "POST /lease-assignments", payload: {water_bank_account_id: "${acct}", water_right_id: "${wr1}", point_of_diversion_id: "${pod_b}", lessee_name: "Harlan Feedlot", lease_start_date: "2026-04-01T00:00:00Z", lease_end_date: "2026-07-01T00:00:00Z", requested_af: 20.00, diversion_rate_cfs: 1.000, rental_rate_usd_per_af: 30.00, valuation_method: PRO_RATA_DAILY}, as: WaterRightsAnalyst, captures: {err_mismatch: "$.data.error_id"}}
            - {call: "POST /lease-assignments", payload: {water_bank_account_id: "${acct}", water_right_id: "${wr2}", point_of_diversion_id: "${pod_b}", lessee_name: "Harlan Feedlot", lease_start_date: "2026-04-01T00:00:00Z", lease_end_date: "2026-07-01T00:00:00Z", requested_af: 20.00, diversion_rate_cfs: 1.000, rental_rate_usd_per_af: 30.00, valuation_method: PRO_RATA_DAILY}, as: WaterRightsAnalyst, captures: {err_pod: "$.data.error_id"}}
            - {call: "POST /lease-assignments", payload: {water_bank_account_id: "${acct}", water_right_id: "${wr1}", point_of_diversion_id: "${pod_a}", lessee_name: "Harlan Feedlot", lease_start_date: "2026-04-01T00:00:00Z", lease_end_date: "2026-07-01T00:00:00Z", requested_af: 20.00, diversion_rate_cfs: 1.000, rental_rate_usd_per_af: 30.00, valuation_method: PRO_RATA_DAILY}, as: WaterRightsAnalyst, captures: {ls: "$.data.id"}}
            - {call: "GET /lease-assignments", payload: {water_right_id: "${wr1}"}, as: WaterRightsAnalyst}
            - {call: "GET /lease-assignments", payload: {water_right_id: "${wr2}"}, as: WaterRightsAnalyst}
          assert:
            - "First call (R1 with R2's headgate): HTTP 422 with error_id ERR_POD_RIGHT_MISMATCH — both parents exist, but they are not related."
            - "Second call (R2 with its own PROPOSED headgate): HTTP 409 with error_id ERR_POD_NOT_AUTHORIZED — the referential check now passes, so the later status gate is what fires."
            - "Third call: HTTP 201 with water_bank_account_id, water_right_id and point_of_diversion_id echoing all three parents, status RESERVED, used_af 0.00 and settlement_credit_af 0.00."
            - "The account moves to committed_credit_af 20.00 / available_credit_af 70.00 only on the successful call; both rejections leave 90.00 available and the account version unchanged."
            - "GET /lease-assignments?water_right_id=<R1> returns exactly the one created lease; filtering by R2 returns an empty array with total_count 0."

      - name: ep_computed_read_forfeiture_assessment_tracks_the_logical_clock
        claim_type: computed_read
        grounds:
          - endpoints[GET /water-rights/{id}/forfeiture-assessment]
          - calculations.forfeiture_risk_score
        distinguishing_aspect: >-
          The computed read is a pure function of the logical clock and the stored
          records: with the record set frozen, advancing the clock two years slides
          the look-back window, lengthens the non-use run, drops the oldest record
          out of the input set and moves the score 60.50 -> 69.50 -> 78.50, crossing
          into HIGH — while the WaterRight's stored projection still shows the
          value stamped at its last recompute.
        test_recipe:
          setup:
            - "Clock 2026-03-01T00:00:00Z. Right authorized at 400.00 AF with METER records for 2017 and 2018 only, 300.000 AF each, and no records afterwards. No further writes touch the right after the records are created."
          setup_api_calls:
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-03-01T00:00:00Z"}, as: WaterRightsAnalyst}
            - {call: "POST /claimants", payload: {legal_name: "Vega Ditch Company", contact_email: "ops@vega.example", entity_type: IRRIGATION_DISTRICT}, as: WaterRightsAnalyst, captures: {cl_a: "$.data.id"}}
            - {call: "POST /water-rights", payload: {claimant_id: "${cl_a}", right_number: "WR-2198-001", priority_date: "1901-05-01T00:00:00Z", source_stream_code: "SNK-14", purpose_of_use: IRRIGATION, place_of_use_acres: 120.00, authorized_diversion_af: 400.00, authorized_rate_cfs: 5.000}, as: WaterRightsAnalyst, captures: {wr: "$.data.id"}}
            - {call: "POST /water-rights/${wr}/beneficial-use-records", payload: {use_year: 2017, reported_diversion_af: 300.000, irrigated_acres: 100.00, verification_source: METER}, as: WaterRightsAnalyst}
            - {call: "POST /water-rights/${wr}/beneficial-use-records", payload: {use_year: 2018, reported_diversion_af: 300.000, irrigated_acres: 100.00, verification_source: METER}, as: WaterRightsAnalyst}
          trigger:
            - {call: "GET /water-rights/${wr}/forfeiture-assessment", as: WaterRightsAnalyst}
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2027-01-01T00:00:00Z"}, as: WaterRightsAnalyst}
            - {call: "GET /water-rights/${wr}/forfeiture-assessment", as: WaterRightsAnalyst}
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2028-01-01T00:00:00Z"}, as: WaterRightsAnalyst}
            - {call: "GET /water-rights/${wr}/forfeiture-assessment", as: WaterRightsAnalyst}
            - {call: "GET /water-rights/${wr}", as: WaterRightsAnalyst}
          assert:
            - "At the 2026 clock: lookback_start_year 2016, lookback_end_year 2025, consecutive_nonuse_years 7 (2019-2025), nonuse_component 63, unverified_component 0.00, underuse_component 7.50, meter_credit 10, forfeiture_risk_score 60.50, band ELEVATED, forfeiture_eligible true."
            - "At the 2027 clock: window [2017 .. 2026], both records still in the input set, consecutive_nonuse_years 8, nonuse_component 72, forfeiture_risk_score 69.50 — still ELEVATED, one half-point below the HIGH threshold."
            - "At the 2028 clock: window [2018 .. 2027], the 2017 record has fallen OUT of the input set so only one record remains, consecutive_nonuse_years 9, nonuse_component 81, meter_credit still 10 (the 2018 record is METER), forfeiture_risk_score 78.50 and band HIGH."
            - "underuse_component stays 7.50 at all three clocks even though the record count drops from 2 to 1 — the mean of 300.000 is unchanged."
            - "The stored WaterRight.forfeiture_risk_score is still the value written when the last record was created and is NOT silently refreshed by the computed read; the read never bumps WaterRight.version."

      - name: ep_conditional_action_fee_payment_only_on_an_outstanding_condition
        claim_type: conditional_action
        grounds:
          - endpoints[POST /approval-conditions/{id}/pay]
          - calculations.mitigation_fee
          - entities.ApprovalCondition.payment_status
        distinguishing_aspect: >-
          The pay action is admissible only on the fiscal dimension of a
          MITIGATION_PAYMENT condition: a MEASUREMENT_DEVICE condition created by
          the same decision has payment_status NOT_APPLICABLE and rejects the
          identical call, while paying the priced condition clears a 2600.00 USD
          balance and restores standing without satisfying the compliance leg.
        test_recipe:
          setup:
            - "Clock 2026-03-01T00:00:00Z; right certified at 195.00 AF; application for 100.00 AF with net_injury_af 20.00 (SEASONAL_AVERAGE gross 78.00 less a 58.00 AF credit), published and closed unprotested, so it is READY_FOR_DECISION."
            - "The DecisionAuthority approves with TWO conditions in this order: MITIGATION_PAYMENT for 20.00 AF and MEASUREMENT_DEVICE for 20.00 AF, so the qualifying mitigation sum is exactly 20.00 and the fee is priced on the first condition only."
          setup_api_calls:
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-03-01T00:00:00Z"}, as: WaterRightsAnalyst}
            - {call: "POST /claimants", payload: {legal_name: "Vega Ditch Company", contact_email: "ops@vega.example", entity_type: IRRIGATION_DISTRICT}, as: WaterRightsAnalyst, captures: {cl_a: "$.data.id"}}
