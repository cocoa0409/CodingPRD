# §1.9 Scaffold Corner Design — coverage index for non-Difficulty-Rule claims.
# Sections follow references/claim-extraction-guide.md. Every chain replays
# against §1.5 from empty-DB. Clock default before any set_current_utc call is
# 2026-09-01T00:00:00Z (§1.5 clock endpoint contract).

scaffold_corner_design:
  - section: entities
    instances:
      - name: series_creation_echo_and_system_fields
        claim_type: creation
        grounds: [entities.OccupationalSeries]
        distinguishing_aspect: "POST /hiring/series returns 201 with all input fields echoed plus system id (UUID), created_at, updated_at, version == 1."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls:
            - call: "POST /hiring/series"
              payload: { series_code: "0343", title: "Program Analyst", min_grade: 5, max_grade: 12, quals_base_months: 6, quals_months_per_grade_step: 6, allows_education_substitution: true, education_substitution_cap_months: 12, positive_education_required: false }
              as: HRSpecialist
              captures: { s1: $.data.id, s1_ver: $.data.version }
          trigger:
            - call: "GET /hiring/series/${s1}"
              payload: {}
              as: HRSpecialist
              captures: { s1_code: $.data.series_code }
          assert:
            - "create returned 201; response carries server-minted UUID id, created_at, updated_at, version == 1"
            - "GET returns identical field values (series_code '0343', quals_base_months 6, education_substitution_cap_months 12)"

      - name: position_computed_fields_at_creation
        claim_type: computed_fields
        grounds: [entities.Position.fields.provisional_grade, entities.Position.fields.total_points, entities.Position.fields.official_grade]
        distinguishing_aspect: "At DRAFT creation total_points and provisional_grade are computed (2250 and 7 for levels (2,2,3,2)) and official_grade is null; client cannot set them (not in input)."
        test_recipe:
          setup: ["Series S1 exists."]
          setup_api_calls:
            - call: "POST /hiring/series"
              payload: { series_code: "0343", title: "Program Analyst", min_grade: 5, max_grade: 12, quals_base_months: 6, quals_months_per_grade_step: 6, allows_education_substitution: true, education_substitution_cap_months: 12, positive_education_required: false }
              as: HRSpecialist
              captures: { s1: $.data.id }
          trigger:
            - call: "POST /hiring/positions"
              payload: { series_id: "${s1}", title: "Analyst", org_code: "OPM1", factor_knowledge_level: 2, factor_supervision_level: 2, factor_complexity_level: 3, factor_impact_level: 2, sensitivity_level: "NONE" }
              as: HiringManager
              captures: { p1: $.data.id, p1_prov: $.data.provisional_grade, p1_tot: $.data.total_points, p1_off: $.data.official_grade, p1_status: $.data.status }
          assert:
            - "total_points == 2250 (300*2 + 200*2 + 250*3 + 250*2)"
            - "provisional_grade == 7 (narrative min-cap over levels (2,2,3,2))"
            - "official_grade is null and status == DRAFT"

      - name: applicant_preference_defaults_and_unverified_document
        claim_type: defaults
        grounds: [entities.Applicant.fields.preference_verified, entities.Applicant.fields.preference_points, entities.EligibilityDocument.fields.verified]
        distinguishing_aspect: "Claim NONE -> preference_verified true and preference_points 0 at creation; a freshly uploaded EligibilityDocument has verified false / verified_by null / verified_at null."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls:
            - call: "POST /hiring/applicants"
              payload: { full_name: "Ann", email: "ann@x.com", is_us_citizen: true, is_current_federal_employee: false, veteran_preference_claim: "NONE" }
              as: Applicant
              captures: { a1: $.data.id, a1_pv: $.data.preference_verified, a1_pp: $.data.preference_points }
          trigger:
            - call: "POST /hiring/applicants/${a1}/documents"
              payload: { doc_type: "DD214" }
              as: Applicant
              as_user_id: "${a1}"
              captures: { d1: $.data.id, d1_ver: $.data.verified, d1_by: $.data.verified_by }
          assert:
            - "applicant created with preference_verified == true and preference_points == 0 (NONE claim needs no documents)"
            - "document created with verified == false, verified_by == null, verified_at == null"

      - name: get_missing_position_returns_not_found_envelope
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]", response_envelope]
        distinguishing_aspect: "GET on a random UUID returns 404 with the FIXED error envelope: data.error_id == ERR_NOT_FOUND and data.message present."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /hiring/positions/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: HRSpecialist
              captures: { err: $.data.error_id, msg: $.data.message }
          assert:
            - "http 404; data.error_id == ERR_NOT_FOUND; data.message is a non-empty string"
            - "response_type == 'error' and meta.api_request_id present (envelope shape)"

      - name: document_under_missing_applicant_not_found
        claim_type: parent_relationships
        grounds: [entities.EligibilityDocument.fields.applicant_id, "validations[error_id=ERR_NOT_FOUND]"]
        distinguishing_aspect: "Child creation under a non-existent parent id fails existence validation (404), proving path ids resolve left-to-right before body validation."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /hiring/applicants/00000000-0000-0000-0000-000000000000/documents"
              payload: { doc_type: "DD214" }
              as: OPMDelegate
              captures: { err: $.data.error_id }
          assert:
            - "http 404; error_id == ERR_NOT_FOUND"

      - name: applications_list_pagination
        claim_type: listing
        grounds: [response_envelope, "endpoints.GET /hiring/announcements/{id}/applications"]
        distinguishing_aspect: "Pagination envelope: limit=2 over 3 applications returns 2 items with total_count 3 and has_more true; offset=2 returns 1 item with has_more false."
        test_recipe:
          setup:
            - "Series S1; GS-9 position CLASSIFIED; announcement OPEN; three applicants applied (clock inside open period)."
          setup_api_calls:
            - call: "POST /hiring/series"
              payload: { series_code: "0343", title: "Program Analyst", min_grade: 5, max_grade: 12, quals_base_months: 6, quals_months_per_grade_step: 6, allows_education_substitution: true, education_substitution_cap_months: 12, positive_education_required: false }
              as: HRSpecialist
              captures: { s1: $.data.id }
            - call: "POST /hiring/positions"
              payload: { series_id: "${s1}", title: "Analyst", org_code: "OPM1", factor_knowledge_level: 2, factor_supervision_level: 2, factor_complexity_level: 3, factor_impact_level: 2, sensitivity_level: "NONE" }
              as: HiringManager
              captures: { p1: $.data.id }
            - call: "POST /hiring/positions/${p1}/classify"
              payload: {}
              as: HRSpecialist
            - call: "POST /hiring/positions/${p1}/announcements"
              payload: { announcement_number: "OPM-26-301", area_of_consideration: "ALL_US_CITIZENS", hiring_authority: "COMPETITIVE", assessment_method: "CATEGORY_RATING", open_at: "2026-09-05T00:00:00Z", close_at: "2026-09-20T00:00:00Z", vacancies_count: 1, bq_cut: 95, wq_cut: 85 }
              as: HiringManager
              captures: { an1: $.data.id }
            - call: "POST /hiring/announcements/${an1}/open"
              payload: {}
              as: HiringManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /hiring/applicants"
              payload: { full_name: "P1", email: "p1@x.com", is_us_citizen: true, is_current_federal_employee: false, veteran_preference_claim: "NONE" }
              as: Applicant
              captures: { pa1: $.data.id }
            - call: "POST /hiring/applicants"
              payload: { full_name: "P2", email: "p2@x.com", is_us_citizen: true, is_current_federal_employee: false, veteran_preference_claim: "NONE" }
              as: Applicant
              captures: { pa2: $.data.id }
            - call: "POST /hiring/applicants"
              payload: { full_name: "P3", email: "p3@x.com", is_us_citizen: true, is_current_federal_employee: false, veteran_preference_claim: "NONE" }
              as: Applicant
              captures: { pa3: $.data.id }
            - call: "POST /hiring/announcements/${an1}/applications"
              payload: { applicant_id: "${pa1}", claimed_experience_months: 30, claimed_education_months: 0, self_rating_knowledge: 3, self_rating_skill: 3, self_rating_ability: 3 }
              as: Applicant
              as_user_id: "${pa1}"
            - call: "POST /hiring/announcements/${an1}/applications"
              payload: { applicant_id: "${pa2}", claimed_experience_months: 30, claimed_education_months: 0, self_rating_knowledge: 3, self_rating_skill: 3, self_rating_ability: 3 }
              as: Applicant
              as_user_id: "${pa2}"
            - call: "POST /hiring/announcements/${an1}/applications"
              payload: { applicant_id: "${pa3}", claimed_experience_months: 30, claimed_education_months: 0, self_rating_knowledge: 3, self_rating_skill: 3, self_rating_ability: 3 }
              as: Applicant
              as_user_id: "${pa3}"
          trigger:
            - call: "GET /hiring/announcements/${an1}/applications?limit=2&offset=0"
              payload: {}
              as: HRSpecialist
              captures: { page1_first: "$.data[0].id" }
            - call: "GET /hiring/announcements/${an1}/applications?limit=2&offset=2"
              payload: {}
              as: HRSpecialist
              captures: { page2_first: "$.data[0].id" }
          assert:
            - "page 1: exactly 2 items, total_count == 3, has_more == true"
            - "page 2 (offset 2): exactly 1 item, has_more == false"
            - "the two pages are disjoint and together cover all 3 applications"

      - name: duplicate_natural_keys_rejected
        claim_type: type_constraints
        grounds: ["validations[error_id=ERR_DUPLICATE_KEY]", entities.OccupationalSeries.fields.series_code, entities.JobAnnouncement.fields.announcement_number, entities.Applicant.fields.email]
        distinguishing_aspect: "Each declared unique natural key rejects a second use with 409 ERR_DUPLICATE_KEY: series_code, announcement_number, applicant email."
        test_recipe:
          setup: ["Series with code 0343, one position classified, one announcement OPM-26-401, applicant ann@x.com all exist."]
          setup_api_calls:
            - call: "POST /hiring/series"
              payload: { series_code: "0343", title: "Program Analyst", min_grade: 5, max_grade: 12, quals_base_months: 6, quals_months_per_grade_step: 6, allows_education_substitution: true, education_substitution_cap_months: 12, positive_education_required: false }
              as: HRSpecialist
              captures: { s1: $.data.id }
            - call: "POST /hiring/positions"
              payload: { series_id: "${s1}", title: "Analyst", org_code: "OPM1", factor_knowledge_level: 2, factor_supervision_level: 2, factor_complexity_level: 3, factor_impact_level: 2, sensitivity_level: "NONE" }
              as: HiringManager
              captures: { p1: $.data.id }
            - call: "POST /hiring/positions/${p1}/classify"
              payload: {}
              as: HRSpecialist
            - call: "POST /hiring/positions/${p1}/announcements"
              payload: { announcement_number: "OPM-26-401", area_of_consideration: "ALL_US_CITIZENS", hiring_authority: "COMPETITIVE", assessment_method: "CATEGORY_RATING", open_at: "2026-09-05T00:00:00Z", close_at: "2026-09-20T00:00:00Z", vacancies_count: 1, bq_cut: 95, wq_cut: 85 }
              as: HiringManager
            - call: "POST /hiring/applicants"
              payload: { full_name: "Ann", email: "ann@x.com", is_us_citizen: true, is_current_federal_employee: false, veteran_preference_claim: "NONE" }
              as: Applicant
          trigger:
            - call: "POST /hiring/series"
              payload: { series_code: "0343", title: "Duplicate", min_grade: 5, max_grade: 12, quals_base_months: 6, quals_months_per_grade_step: 6, allows_education_substitution: true, education_substitution_cap_months: 12, positive_education_required: false }
              as: HRSpecialist
              captures: { err1: $.data.error_id }
            - call: "POST /hiring/positions/${p1}/announcements"
              payload: { announcement_number: "OPM-26-401", area_of_consideration: "ALL_US_CITIZENS", hiring_authority: "COMPETITIVE", assessment_method: "CATEGORY_RATING", open_at: "2026-10-01T00:00:00Z", close_at: "2026-10-10T00:00:00Z", vacancies_count: 1, bq_cut: 95, wq_cut: 85 }
              as: HiringManager
              captures: { err2: $.data.error_id }
            - call: "POST /hiring/applicants"
              payload: { full_name: "Ann Two", email: "ann@x.com", is_us_citizen: true, is_current_federal_employee: false, veteran_preference_claim: "NONE" }
              as: Applicant
              captures: { err3: $.data.error_id }
          assert:
            - "duplicate series_code -> 409 ERR_DUPLICATE_KEY"
            - "duplicate announcement_number -> 409 ERR_DUPLICATE_KEY (note the period itself does not overlap, isolating the key check)"
            - "duplicate email -> 409 ERR_DUPLICATE_KEY"

  - section: state_machines
    instances:
      - name: position_starts_draft_with_null_official_grade
        claim_type: initial_state
        grounds: [state_machines.Position]
        distinguishing_aspect: "A new Position is DRAFT with official_grade null; classification is a distinct explicit step."
        test_recipe:
          setup: ["Series S1 exists."]
          setup_api_calls:
            - call: "POST /hiring/series"
              payload: { series_code: "0343", title: "Program Analyst", min_grade: 5, max_grade: 12, quals_base_months: 6, quals_months_per_grade_step: 6, allows_education_substitution: true, education_substitution_cap_months: 12, positive_education_required: false }
              as: HRSpecialist
              captures: { s1: $.data.id }
          trigger:
            - call: "POST /hiring/positions"
              payload: { series_id: "${s1}", title: "Analyst", org_code: "OPM1", factor_knowledge_level: 2, factor_supervision_level: 2, factor_complexity_level: 3, factor_impact_level: 2, sensitivity_level: "NONE" }
              as: HiringManager
              captures: { p1_status: $.data.status, p1_off: $.data.official_grade }
          assert:
            - "status == DRAFT and official_grade is null immediately after creation"

      - name: classify_from_classified_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Position.transitions, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "classify exists only from DRAFT; a second classify on a CLASSIFIED position is rejected and the grade is unchanged (re-grading must go through reclassifications)."
        test_recipe:
          setup: ["Series S1; position created and already CLASSIFIED at GS-9."]
          setup_api_calls:
            - call: "POST /hiring/series"
              payload: { series_code: "0343", title: "Program Analyst", min_grade: 5, max_grade: 12, quals_base_months: 6, quals_months_per_grade_step: 6, allows_education_substitution: true, education_substitution_cap_months: 12, positive_education_required: false }
              as: HRSpecialist
              captures: { s1: $.data.id }
            - call: "POST /hiring/positions"
              payload: { series_id: "${s1}", title: "Analyst", org_code: "OPM1", factor_knowledge_level: 2, factor_supervision_level: 2, factor_complexity_level: 3, factor_impact_level: 2, sensitivity_level: "NONE" }
              as: HiringManager
              captures: { p1: $.data.id }
            - call: "POST /hiring/positions/${p1}/classify"
              payload: {}
              as: HRSpecialist
              captures: { p1_grade: $.data.official_grade }
          trigger:
            - call: "POST /hiring/positions/${p1}/classify"
              payload: {}
              as: HRSpecialist
              captures: { err: $.data.error_id }
            - call: "GET /hiring/positions/${p1}"
              payload: {}
              as: HRSpecialist
              captures: { p1_grade2: $.data.official_grade }
          assert:
            - "second classify: http 409, error_id == ERR_INVALID_STATE"
            - "official_grade still == 9 (no mutation)"

      - name: announcement_double_open_rejected
        claim_type: idempotency
        grounds: [state_machines.JobAnnouncement.DRAFT_to_OPEN, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "open is not idempotent: the second open on an OPEN announcement fails with ERR_INVALID_STATE."
        test_recipe:
          setup: ["Series S1; position CLASSIFIED; announcement created and opened once."]
          setup_api_calls:
            - call: "POST /hiring/series"
              payload: { series_code: "0343", title: "Program Analyst", min_grade: 5, max_grade: 12, quals_base_months: 6, quals_months_per_grade_step: 6, allows_education_substitution: true, education_substitution_cap_months: 12, positive_education_required: false }
              as: HRSpecialist
              captures: { s1: $.data.id }
            - call: "POST /hiring/positions"
              payload: { series_id: "${s1}", title: "Analyst", org_code: "OPM1", factor_knowledge_level: 2, factor_supervision_level: 2, factor_complexity_level: 3, factor_impact_level: 2, sensitivity_level: "NONE" }
              as: HiringManager
              captures: { p1: $.data.id }
            - call: "POST /hiring/positions/${p1}/classify"
              payload: {}
              as: HRSpecialist
            - call: "POST /hiring/positions/${p1}/announcements"
              payload: { announcement_number: "OPM-26-302", area_of_consideration: "ALL_US_CITIZENS", hiring_authority: "COMPETITIVE", assessment_method: "CATEGORY_RATING", open_at: "2026-09-05T00:00:00Z", close_at: "2026-09-20T00:00:00Z", vacancies_count: 1, bq_cut: 95, wq_cut: 85 }
              as: HiringManager
              captures: { an1: $.data.id }
            - call: "POST /hiring/announcements/${an1}/open"
              payload: {}
              as: HiringManager
              captures: { st: $.data.status }
          trigger:
            - call: "POST /hiring/announcements/${an1}/open"
              payload: {}
              as: HiringManager
              captures: { err: $.data.error_id }
          assert:
            - "first open -> status OPEN; second open -> 409 ERR_INVALID_STATE; status remains OPEN"

      - name: returned_certificate_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Certificate.ACTIVE_to_RETURNED, "errors[ERR_CERTIFICATE_NOT_ACTIVE]"]
        distinguishing_aspect: "RETURNED is terminal: extending a returned certificate fails with ERR_CERTIFICATE_NOT_ACTIVE and expires_at does not move."
        test_recipe:
          setup:
            - "Full competitive fixture: three rated applicants; certificate issued 2026-09-15 (expires 2026-11-14T00:00:00Z); returned 2026-09-20."
          setup_api_calls:
            - call: "POST /hiring/series"
              payload: { series_code: "0343", title: "Program Analyst", min_grade: 5, max_grade: 12, quals_base_months: 6, quals_months_per_grade_step: 6, allows_education_substitution: true, education_substitution_cap_months: 12, positive_education_required: false }
              as: HRSpecialist
              captures: { s1: $.data.id }
            - call: "POST /hiring/positions"
              payload: { series_id: "${s1}", title: "Analyst", org_code: "OPM1", factor_knowledge_level: 2, factor_supervision_level: 2, factor_complexity_level: 3, factor_impact_level: 2, sensitivity_level: "NONE" }
              as: HiringManager
              captures: { p1: $.data.id }
            - call: "POST /hiring/positions/${p1}/classify"
              payload: {}
              as: HRSpecialist
            - call: "POST /hiring/positions/${p1}/announcements"
              payload: { announcement_number: "OPM-26-303", area_of_consideration: "ALL_US_CITIZENS", hiring_authority: "COMPETITIVE", assessment_method: "CATEGORY_RATING", open_at: "2026-09-05T00:00:00Z", close_at: "2026-09-20T00:00:00Z", vacancies_count: 1, bq_cut: 95, wq_cut: 85, certificate_validity_days: 60 }
              as: HiringManager
              captures: { an1: $.data.id }
            - call: "POST /hiring/announcements/${an1}/open"
              payload: {}
              as: HiringManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /hiring/applicants"
              payload: { full_name: "G1", email: "g1@x.com", is_us_citizen: true, is_current_federal_employee: false, veteran_preference_claim: "NONE" }
              as: Applicant
              captures: { g1: $.data.id }
            - call: "POST /hiring/applicants"
              payload: { full_name: "G2", email: "g2@x.com", is_us_citizen: true, is_current_federal_employee: false, veteran_preference_claim: "NONE" }
              as: Applicant
              captures: { g2: $.data.id }
            - call: "POST /hiring/applicants"
              payload: { full_name: "G3", email: "g3@x.com", is_us_citizen: true, is_current_federal_employee: false, veteran_preference_claim: "NONE" }
              as: Applicant
              captures: { g3: $.data.id }
            - call: "POST /hiring/announcements/${an1}/applications"
              payload: { applicant_id: "${g1}", claimed_experience_months: 30, claimed_education_months: 0, self_rating_knowledge: 3, self_rating_skill: 3, self_rating_ability: 3 }
              as: Applicant
              as_user_id: "${g1}"
              captures: { ap1: $.data.id }
            - call: "POST /hiring/announcements/${an1}/applications"
              payload: { applicant_id: "${g2}", claimed_experience_months: 30, claimed_education_months: 0, self_rating_knowledge: 3, self_rating_skill: 3, self_rating_ability: 3 }
              as: Applicant
              as_user_id: "${g2}"
              captures: { ap2: $.data.id }
            - call: "POST /hiring/announcements/${an1}/applications"
              payload: { applicant_id: "${g3}", claimed_experience_months: 30, claimed_education_months: 0, self_rating_knowledge: 3, self_rating_skill: 3, self_rating_ability: 3 }
              as: Applicant
              as_user_id: "${g3}"
              captures: { ap3: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-14T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /hiring/applications/${ap1}/screen"
              payload: {}
              as: HRSpecialist
            - call: "POST /hiring/applications/${ap2}/screen"
              payload: {}
              as: HRSpecialist
            - call: "POST /hiring/applications/${ap3}/screen"
              payload: {}
              as: HRSpecialist
            - call: "POST /hiring/applications/${ap1}/assessments"
              payload: { rating_knowledge: 5, rating_skill: 5, rating_ability: 5 }
              as: SME
              as_user_id: "sme-1"
              captures: { as1: $.data.id }
            - call: "POST /hiring/assessments/${as1}/submit"
              payload: {}
              as: SME
              as_user_id: "sme-1"
            - call: "POST /hiring/assessments/${as1}/accept"
              payload: {}
              as: HRSpecialist
            - call: "POST /hiring/applications/${ap2}/assessments"
              payload: { rating_knowledge: 5, rating_skill: 3, rating_ability: 5 }
              as: SME
              as_user_id: "sme-1"
              captures: { as2: $.data.id }
            - call: "POST /hiring/assessments/${as2}/submit"
              payload: {}
              as: SME
              as_user_id: "sme-1"
            - call: "POST /hiring/assessments/${as2}/accept"
              payload: {}
              as: HRSpecialist
            - call: "POST /hiring/applications/${ap3}/assessments"
              payload: { rating_knowledge: 3, rating_skill: 5, rating_ability: 5 }
              as: SME
              as_user_id: "sme-1"
              captures: { as3: $.data.id }
            - call: "POST /hiring/assessments/${as3}/submit"
              payload: {}
              as: SME
              as_user_id: "sme-1"
            - call: "POST /hiring/assessments/${as3}/accept"
              payload: {}
              as: HRSpecialist
