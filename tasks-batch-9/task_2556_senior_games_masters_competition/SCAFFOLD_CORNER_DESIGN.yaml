      - name: corner_layer_occ_stale_games_edition_version_rejected
        claim_type: Stale expected_<parent>_version rejected
        grounds:
          - complexity_profile.complexity_layers[optimistic_concurrency]
          - concurrency_rules[sponsorship-allocate-stale-games-edition]
          - validations[priority=26]
          - errors[ERR_STALE_GAMES_EDITION_VERSION]
          - endpoints[POST /senior-games/sponsorship-commitments/{sponsorship_commitment_id}/allocate]
        distinguishing_aspect: "The third OCC rule guards a shared running total rather than a capacity: two commitments read the same GamesEdition version, the first allocation posts 120000 onto GamesEdition.sponsorship_recognized_cents and advances the edition version, and the second allocation is refused with HTTP 412 ERR_STALE_GAMES_EDITION_VERSION before its own bucket arithmetic runs — recognized_cents stays 0 and status stays PLEDGED, so the ledger cannot be double-posted by a retry."
        test_recipe:
          setup:
            - "One edition left in DRAFT — sponsorship writes are gated at priority 30 only against IMPACT_FINALIZED, so no registration is needed."
            - "Two commitments on that edition: a BRONZE pledge of 120000 cents (multiplier 1.00) and a GOLD pledge of 400000 cents (multiplier 1.12), both PLEDGED with recognized_cents 0 and an empty allocation_map."
          setup_api_calls:
            - call: "POST /senior-games/games-editions"
              payload: { name: "Prairie Senior Games 2026", host_city: "Springfield", host_state_code: "IL", competition_start_date: "2026-09-10", competition_end_date: "2026-09-20", age_reference_date: "2026-12-31", registration_deadline_utc: "2026-08-25T23:59:59Z" }
              as: GamesAdmin
              captures: { ed_id: $.data.id, ed_v0: $.data.version, ed_ledger_0: $.data.sponsorship_recognized_cents }
            - call: "POST /senior-games/sponsorship-commitments"
              payload: { games_edition_id: "${ed_id}", sponsor_name: "Prairie Mutual", sponsor_kind: "CORPORATE", tier: "BRONZE", pledged_cents: 120000 }
              as: SponsorLiaison
              captures: { sc_1_id: $.data.id, sc_1_status: $.data.status }
            - call: "POST /senior-games/sponsorship-commitments"
              payload: { games_edition_id: "${ed_id}", sponsor_name: "Springfield Utilities", sponsor_kind: "MUNICIPAL", tier: "GOLD", pledged_cents: 400000 }
              as: SponsorLiaison
              captures: { sc_2_id: $.data.id, sc_2_status: $.data.status }
          trigger:
            - call: "POST /senior-games/sponsorship-commitments/${sc_1_id}/allocate"
              payload: { expected_games_edition_version: "${ed_v0}" }
              as: SponsorLiaison
              captures: { sc_1_recognized: $.data.recognized_cents, sc_1_status_2: $.data.status }
            - call: "POST /senior-games/sponsorship-commitments/${sc_2_id}/allocate"
              payload: { expected_games_edition_version: "${ed_v0}" }
              as: SponsorLiaison
              captures: { e_stale: $.data.error_id }
            - call: "GET /senior-games/sponsorship-commitments/${sc_2_id}"
              payload: {}
              as: SponsorLiaison
              captures: { sc_2_status_3: $.data.status, sc_2_recognized_3: $.data.recognized_cents }
            - call: "GET /senior-games/games-editions/${ed_id}"
              payload: {}
              as: SponsorLiaison
              captures: { ed_v1: $.data.version, ed_ledger_1: $.data.sponsorship_recognized_cents }
            - call: "POST /senior-games/sponsorship-commitments/${sc_2_id}/allocate"
              payload: { expected_games_edition_version: "${ed_v1}" }
              as: SponsorLiaison
              captures: { sc_2_recognized_4: $.data.recognized_cents, sc_2_status_4: $.data.status }
            - call: "GET /senior-games/games-editions/${ed_id}/economic-impact"
              payload: {}
              as: SponsorLiaison
              captures: { imp_ledger: $.data.sponsorship_recognized_cents, imp_municipal: $.data.municipal_support_cents }
          assert:
            - "${ed_ledger_0} == 0 and ${sc_1_status} == ${sc_2_status} == \"PLEDGED\" before the triggers run"
            - "the first allocate returns HTTP 200 with ${sc_1_status_2} == \"ALLOCATED\" and ${sc_1_recognized} == 120000, whose allocation_map is {VENUE_SIGNAGE: 48000, ATHLETE_SERVICES: 36000, MEDICAL_COVERAGE: 24000, SOCIAL_PROGRAM: 12000} at multiplier 1.00"
            - "${e_stale} == \"ERR_STALE_GAMES_EDITION_VERSION\" with HTTP 412 on the second allocate, which held the pre-allocation edition version"
            - "${sc_2_status_3} == \"PLEDGED\" and ${sc_2_recognized_3} == 0 after the refusal: the guard ran before the bucket arithmetic, so nothing was computed or posted"
            - "${ed_v1} == ${ed_v0} + 1 and ${ed_ledger_1} == 120000: the edition absorbed exactly one allocation"
            - "the retry with the refreshed version returns HTTP 200 with ${sc_2_status_4} == \"ALLOCATED\" and ${sc_2_recognized_4} == 448000, whose allocation_map is {VENUE_SIGNAGE: 179200, ATHLETE_SERVICES: 134400, MEDICAL_COVERAGE: 89600, SOCIAL_PROGRAM: 44800} at multiplier 1.12"
            - "${imp_ledger} == 568000 == 120000 + 448000, so the ledger holds each allocation exactly once and the refused attempt contributed nothing"
            - "${imp_municipal} == 0, the default for municipal_support_cents, which is a separate input ledger that sponsorship allocation never touches"

      - name: corner_layer_version_increments_on_every_write_and_reads_are_inert
        claim_type: Version increments on every write
        grounds:
          - complexity_profile.complexity_layers[optimistic_concurrency]
          - concurrency_rules[sponsorship-allocate-stale-games-edition]
          - entities.GamesEdition.common_fields
          - endpoints[GET /senior-games/games-editions/{games_edition_id}]
        distinguishing_aspect: "The precondition every OCC rule rests on, tested on its own: version advances by exactly 1 per accepted write to THAT row, reads never advance it, and writes to sibling rows (a Sport, a SportEvent) leave the parent edition's version alone even though they name it as their foreign key. Without the last property an OCC reader would see phantom staleness on every child insert."
        test_recipe:
          setup:
            - "Nothing pre-exists; the instance observes version and ops_epoch from the very first write onward, so it never depends on an absolute starting value."
          setup_api_calls: []
          trigger:
            - call: "POST /senior-games/games-editions"
              payload: { name: "Prairie Senior Games 2026", host_city: "Springfield", host_state_code: "IL", competition_start_date: "2026-09-10", competition_end_date: "2026-09-20", age_reference_date: "2026-12-31", registration_deadline_utc: "2026-08-25T23:59:59Z" }
              as: GamesAdmin
              captures: { ed_id: $.data.id, ed_v0: $.data.version, ed_epoch_0: $.data.ops_epoch }
            - call: "GET /senior-games/games-editions/${ed_id}"
              payload: {}
              as: GamesAdmin
              captures: { ed_read_1: $.data.version }
            - call: "POST /senior-games/sports"
              payload: { sport_code: "TRACK", name: "Track and Field", contact_class: "LOW", mark_direction: "LOWER_IS_BETTER", required_certification_level: 2, min_age: 50 }
              as: GamesAdmin
              captures: { sp_track_id: $.data.id }
            - call: "POST /senior-games/sport-events"
              payload: { sport_id: "${sp_track_id}", games_edition_id: "${ed_id}", event_code: "T100M", age_group_code: "60-64", gender_division: "MEN", entry_fee_cents: 6000, capacity: 8, min_entries_to_stage: 1 }
              as: GamesAdmin
              captures: { ev_id: $.data.id, ev_v0: $.data.version }
            - call: "GET /senior-games/games-editions/${ed_id}"
              payload: {}
              as: GamesAdmin
              captures: { ed_read_2: $.data.version }
            - call: "POST /senior-games/games-editions/${ed_id}/open-registration"
              payload: {}
              as: GamesAdmin
              captures: { ed_v1: $.data.version, ed_epoch_1: $.data.ops_epoch, ed_status_1: $.data.status }
            - call: "GET /senior-games/games-editions/${ed_id}"
              payload: {}
              as: RegistrationOfficer
              captures: { ed_read_3: $.data.version }
            - call: "POST /senior-games/games-editions/${ed_id}/ops-run"
              payload: {}
              as: GamesAdmin
              captures: { ed_v2: $.data.version, ed_epoch_2: $.data.ops_epoch, ed_status_2: $.data.status }
            - call: "GET /senior-games/sport-events/${ev_id}"
              payload: {}
              as: GamesAdmin
              captures: { ev_read_1: $.data.version }
            - call: "GET /senior-games/games-editions/${ed_id}"
              payload: {}
              as: SponsorLiaison
              captures: { ed_read_4: $.data.version }
          assert:
            - "${ed_read_1} == ${ed_v0}: a GET is inert, so the version the client would put in expected_games_edition_version survives being read twice"
            - "${ed_read_2} == ${ed_v0}: creating a Sport and a SportEvent that names ${ed_id} as its games_edition_id does NOT advance the edition's own version"
            - "${ed_v1} == ${ed_v0} + 1 and ${ed_read_3} == ${ed_v1}: open-registration is one write, one increment, and the following read confirms it"
            - "${ed_v2} == ${ed_v0} + 2 and ${ed_read_4} == ${ed_v2}: the ops-run checkpoint is also exactly one increment, not one per phase it executes"
            - "${ed_epoch_0} == 0, ${ed_epoch_1} == 0 and ${ed_epoch_2} == 1: ops_epoch counts checkpoints only, while version counts every write, so the two counters diverge deliberately"
            - "${ed_status_1} == \"REGISTRATION_OPEN\" and ${ed_status_2} == \"REGISTRATION_OPEN\": the logical clock is still 2026-08-01T00:00:00Z, before the 2026-08-25T23:59:59Z deadline, so the checkpoint admitted no status step"
            - "${ev_read_1} == ${ev_v0}: the event row was never written after creation, so version is per-row and not a global sequence"

