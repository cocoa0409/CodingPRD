            - call: "POST /subscriptions"
              payload: { member_id: "${owner_id}", recurring_charge_id: "${rc_id}", plan_name: "Std", monthly_cost_cents: 5000 }
              as: Member
              as_user_id: "${owner_id}"
              captures: { sub_id: "$.data.id" }
          trigger:
            - call: "POST /recurring-charges/${rc_id}/dismiss"
              payload: {}
              as: Member
              as_user_id: "${other_id}"
          assert:
            - "response.error_id == ERR_NOT_RESOURCE_OWNER"
            - "response.http_status == 403"
            - "RecurringCharge.${rc_id}.status == CONFIRMED"

