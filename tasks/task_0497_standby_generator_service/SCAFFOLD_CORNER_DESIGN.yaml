        claim_type: Priority Ordering
        grounds: ["validations[priority=8]", "validations[priority=10]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / warranty_lapsed_beats_invalid_state_on_review
          rationale: "state(8) outranking warranty_lapsed(10) asserted in §1.8."

