          Cyclic machine on Portfolio: SUBMITTED->REMEDIATION_REQUIRED->SUBMITTED
          loops twice, and the third REMEDIATION_REQUIRED outcome at
          attempt_count == 3 is forced into REJECTED (terminal escalation) which
          drives Enrollment.compliance_standing to NONCOMPLIANT. Entity distinct
          from CurriculumPlan; adds an escalation exit the plan cycle lacks.
