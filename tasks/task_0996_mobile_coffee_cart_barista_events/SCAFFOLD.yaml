    input: ["limit?", "offset?", "status?"]
    output: "InventoryReservation[]"
    side_effects: []

  - method: POST
    path: "/coffee-cart/cancellation-tiers"
    description: "Create a cancellation policy tier"
    roles: [OperationsManager]
    code: 201
    input: [tier_code, min_notice_hours, max_notice_hours, deposit_refund_pct, balance_waived]
    output: CancellationPolicyTier
    side_effects: ["CancellationPolicyTier.status=ACTIVE"]

  - method: GET
    path: "/coffee-cart/cancellation-tiers"
    description: "List cancellation policy tiers"
    roles: [OperationsManager, Client]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "CancellationPolicyTier[]"
    side_effects: []

  # --- Booking lifecycle ---
  - method: POST
    path: "/coffee-cart/bookings"
    description: "Create a new EventBooking in QUOTE status"
    roles: [Client]
    code: 201
    input: [client_id, package_id, cart_id, travel_zone_id, event_start, event_end, guest_count, venue_provides_power, venue_provides_water, distance_km]
    output: EventBooking
    side_effects:
      - "status=QUOTE; quoted_* and deposit_due_cents left at 0 until submit"

  - method: GET
    path: "/coffee-cart/bookings"
    description: "List bookings (filtered)"
    roles: [OperationsManager, Client]
    code: 200
    input: ["limit?", "offset?", "status?", "client_id?", "cart_id?", "package_id?", "travel_zone_id?"]
    output: "EventBooking[]"
    side_effects: []

  - method: GET
    path: "/coffee-cart/bookings/{bookingId}"
    description: "Fetch a booking (returns version for OCC)"
    roles: [OperationsManager, Client, Barista]
    code: 200
    input: []
    output: EventBooking
    side_effects: []

  - method: POST
    path: "/coffee-cart/bookings/{id}/addons"
    description: "Attach an add-on to a QUOTE booking"
    roles: [Client]
    code: 201
    input: [addon_id]
    output: BookingAddOn
    side_effects:
      - "BookingAddOn.applied_price_cents = AddOn.price_cents snapshot"
      - "booking.updated_at refreshed"

  - method: GET
    path: "/coffee-cart/bookings/{id}/addons"
    description: "List add-ons attached to a booking (FK reverse-reachability)"
    roles: [OperationsManager, Client]
    code: 200
    input: ["limit?", "offset?"]
    output: "BookingAddOn[]"
    side_effects: []

  - method: POST
    path: "/coffee-cart/bookings/{id}/assignments"
    description: "Offer the booking to a barista (creates BaristaAssignment in OFFERED)"
    roles: [OperationsManager]
    code: 201
    input: [barista_id, is_primary]
    output: BaristaAssignment
    side_effects:
      - "BaristaAssignment.status=OFFERED; duration_hours computed from booking window"

  - method: GET
    path: "/coffee-cart/bookings/{id}/assignments"
    description: "List assignments for a booking (FK reverse-reachability)"
    roles: [OperationsManager, Client, Barista]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "BaristaAssignment[]"
    side_effects: []

  - method: GET
    path: "/coffee-cart/baristas/{id}/assignments"
    description: "List assignments for a barista (FK reverse-reachability)"
    roles: [OperationsManager, Barista]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "BaristaAssignment[]"
    side_effects: []

  - method: POST
    path: "/coffee-cart/bookings/{id}/reservations"
    description: "Create an InventoryReservation against a QUOTE booking"
    roles: [OperationsManager]
    code: 201
    input: [item_id, qty_units]
    output: InventoryReservation
    side_effects:
      - "InventoryReservation.status=RESERVED"
      - "InventoryItem.reserved_units += qty_units"

  - method: GET
    path: "/coffee-cart/bookings/{id}/reservations"
    description: "List inventory reservations for a booking (FK reverse-reachability)"
    roles: [OperationsManager, Client]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "InventoryReservation[]"
    side_effects: []

  - method: POST
    path: "/coffee-cart/bookings/{bookingId}/submit"
    description: "Submit a QUOTE booking: recompute quote, pin variants, transition to PENDING_DEPOSIT"
    roles: [Client]
    code: 200
    input: [expected_cart_version, expected_primary_barista_version]
    output: EventBooking
    side_effects:
      - "recomputes quoted_subtotal_cents, quoted_travel_fee_cents, quoted_total_cents, deposit_due_cents"
      - "pins pricing_variant_used and travel_variant_used"
      - "increments CoffeeCart.version by 1"
      - "increments primary Barista.version by 1"
      - "increments EventBooking.version by 1"

  - method: POST
    path: "/coffee-cart/bookings/{bookingId}/reopen"
    description: "Reopen a PENDING_DEPOSIT booking back to QUOTE (deposit not yet paid)"
    roles: [Client]
    code: 200
    input: []
    output: EventBooking
    side_effects:
      - "pricing_variant_used and travel_variant_used cleared"
      - "increments EventBooking.version by 1"

  - method: POST
    path: "/coffee-cart/bookings/{bookingId}/amend"
    description: "Amend a CONFIRMED booking; rolls it back to QUOTE and re-opens assignments/reservations"
    roles: [Client]
    code: 200
    input: ["package_id?", "cart_id?", "travel_zone_id?", "event_start?", "event_end?", "guest_count?", "venue_provides_power?", "venue_provides_water?", "distance_km?"]
    output: EventBooking
    side_effects:
      - "Booking CONFIRMED -> QUOTE"
      - "BaristaAssignment CONFIRMED -> OFFERED (re-offer loop)"
      - "InventoryReservation COMMITTED -> RESERVED"
      - "cart.committed_event_count recomputed"
      - "Barista.committed_hours_this_week recomputed for affected baristas"
      - "increments EventBooking.version, CoffeeCart.version (if cart changed), Barista.version for affected baristas"

  - method: POST
    path: "/coffee-cart/bookings/{bookingId}/cancel"
    description: "Cancel a booking from QUOTE, PENDING_DEPOSIT, or CONFIRMED; computes refund if applicable"
    roles: [Client]
    code: 200
    input: ["cancellation_reason?"]
    output: EventBooking
    side_effects:
      - "Booking -> CANCELLED; cancelled_at set"
      - "All non-terminal BaristaAssignment -> CANCELLED"
      - "All non-terminal InventoryReservation -> RELEASED"
      - "InventoryItem.reserved_units decremented per released reservation"
      - "If cancelled from CONFIRMED: compute cancellation_refund_cents, auto-create REFUND Payment row (PENDING) if refund > 0"

  - method: POST
    path: "/coffee-cart/bookings/{bookingId}/complete"
    description: "Mark an IN_PROGRESS booking as COMPLETED (after event_end, all assignments resolved)"
    roles: [OperationsManager]
    code: 200
    input: []
    output: EventBooking
    side_effects:
      - "Booking IN_PROGRESS -> COMPLETED"
      - "Auto-create BALANCE Payment row (PENDING) if balance_due_cents > 0"
      - "InventoryReservation COMMITTED -> PARTIALLY_CONSUMED via record-consumption (or remains if consumption not yet recorded)"
      - "increments EventBooking.version by 1"

  # --- Assignment actions ---
  - method: GET
    path: "/coffee-cart/assignments/{assignmentId}"
    description: "Fetch an assignment"
    roles: [OperationsManager, Barista, Client]
    code: 200
    input: []
    output: BaristaAssignment
    side_effects: []

  - method: POST
    path: "/coffee-cart/assignments/{assignmentId}/accept"
    description: "Barista accepts an OFFERED assignment"
    roles: [Barista]
    code: 200
    input: []
    output: BaristaAssignment
    side_effects:
      - "OFFERED -> ACCEPTED"
      - "Barista.committed_hours_this_week += duration_hours"
      - "increments Barista.version by 1"
      - "increments BaristaAssignment.version by 1"

  - method: POST
    path: "/coffee-cart/assignments/{assignmentId}/decline"
    description: "Barista declines an OFFERED assignment"
    roles: [Barista]
    code: 200
    input: ["decline_reason?"]
    output: BaristaAssignment
    side_effects:
      - "OFFERED -> DECLINED"
      - "increments BaristaAssignment.version by 1"

  - method: POST
    path: "/coffee-cart/assignments/{assignmentId}/withdraw"
    description: "Barista withdraws an ACCEPTED assignment before event starts"
    roles: [Barista]
    code: 200
    input: []
    output: BaristaAssignment
    side_effects:
      - "ACCEPTED -> CANCELLED"
      - "Barista.committed_hours_this_week -= duration_hours"
      - "increments Barista.version by 1"

  - method: POST
    path: "/coffee-cart/assignments/{assignmentId}/resolve"
    description: "OperationsManager resolves an assignment after event end (attendance logged)"
    roles: [OperationsManager]
    code: 200
    input: [attended]
    output: BaristaAssignment
    side_effects:
      - "{ACCEPTED, CONFIRMED} -> COMPLETED if attended=true, else NO_SHOW"
      - "NO_SHOW decrements Barista.committed_hours_this_week"

  # --- Inventory actions ---
  - method: GET
    path: "/coffee-cart/reservations/{reservationId}"
    description: "Fetch a reservation"
    roles: [OperationsManager]
    code: 200
    input: []
    output: InventoryReservation
    side_effects: []

  - method: POST
    path: "/coffee-cart/reservations/{reservationId}/record-consumption"
    description: "Record qty_consumed against a COMMITTED reservation (transitions to PARTIALLY_CONSUMED)"
    roles: [OperationsManager]
    code: 200
    input: [qty_consumed]
    output: InventoryReservation
    side_effects:
      - "COMMITTED -> PARTIALLY_CONSUMED"
      - "InventoryItem.reserved_units -= qty_units"
      - "InventoryItem.on_hand_units -= qty_consumed"
      - "InventoryItem.consumed_units_lifetime += qty_consumed"
      - "increments InventoryItem.version by 1"

  - method: POST
    path: "/coffee-cart/reservations/{reservationId}/reconcile"
    description: "Reconcile a PARTIALLY_CONSUMED reservation after booking is COMPLETED"
    roles: [OperationsManager]
    code: 200
    input: []
    output: InventoryReservation
    side_effects: ["PARTIALLY_CONSUMED -> RECONCILED"]

  # --- Payments ---
  - method: POST
    path: "/coffee-cart/bookings/{id}/payments"
    description: "Create a payment (DEPOSIT, BALANCE, or REFUND); idempotent on idempotency_key"
    roles: [Client, OperationsManager]
    code: 201
    input: [kind, amount_cents, idempotency_key]
    output: Payment
    side_effects: ["Payment.status=PENDING"]

  - method: GET
    path: "/coffee-cart/bookings/{id}/payments"
    description: "List payments for a booking (FK reverse-reachability)"
    roles: [OperationsManager, Client]
    code: 200
    input: ["limit?", "offset?", "kind?", "status?"]
    output: "Payment[]"
    side_effects: []

  - method: GET
    path: "/coffee-cart/payments/{paymentId}"
    description: "Fetch a payment"
    roles: [OperationsManager, Client]
    code: 200
    input: []
    output: Payment
    side_effects: []

  - method: POST
    path: "/coffee-cart/payments/{paymentId}/mark-succeeded"
    description: "Mark a PENDING payment SUCCEEDED; cascades booking state if deposit threshold or refund reached"
    roles: [OperationsManager]
    code: 200
    input: []
    output: Payment
    side_effects:
      - "PENDING -> SUCCEEDED"
      - "If kind=DEPOSIT and booking.deposit_paid_cents >= deposit_due_cents: booking PENDING_DEPOSIT -> CONFIRMED (cascade)"
      - "If kind=REFUND and booking.status == CANCELLED: booking CANCELLED -> REFUNDED (cascade)"
      - "increments EventBooking.version by 1 (cascade marker)"

  - method: POST
    path: "/coffee-cart/payments/{paymentId}/mark-failed"
    description: "Mark a PENDING payment FAILED"
    roles: [OperationsManager]
    code: 200
    input: []
    output: Payment
    side_effects: ["PENDING -> FAILED"]

  # --- Test-driving endpoints (logical clock + fixture seeding) ---
  - method: POST
    path: "/coffee-cart/_clock/set_current_utc"
    description: "Set the logical clock. Server startup default is 2026-05-01T00:00:00Z; before any set call, the clock reads exactly this default and MUST NOT fall back to real wall-clock time."
    roles: [OperationsManager]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["logical clock advanced; triggers automatic transitions (CONFIRMED->IN_PROGRESS, etc.) whose preconditions are met"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or malformed" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_RESOURCE_NOT_FOUND, http: 404, condition: "Path or body FK id does not resolve to an existing entity" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Entity status does not permit the requested transition" }
  - { id: ERR_PACKAGE_NOT_ACTIVE, http: 409, condition: "Referenced Package.status != ACTIVE" }
  - { id: ERR_CART_NOT_ACTIVE, http: 409, condition: "Referenced CoffeeCart.status != ACTIVE" }
  - { id: ERR_ZONE_NOT_ACTIVE, http: 409, condition: "Referenced TravelZone.status != ACTIVE" }
  - { id: ERR_ADDON_NOT_ACTIVE, http: 409, condition: "Referenced AddOn.status != ACTIVE" }
  - { id: ERR_ITEM_NOT_ACTIVE, http: 409, condition: "Referenced InventoryItem.status != ACTIVE" }
  - { id: ERR_EVENT_WINDOW_INVALID, http: 422, condition: "event_start >= event_end OR event_start too soon (< MIN_BOOKING_LEAD_HOURS ahead)" }
  - { id: ERR_VENUE_HOOKUP_MISMATCH, http: 422, condition: "Cart requires power/water hookup but venue_provides_power/water is false" }
  - { id: ERR_CART_DOUBLE_BOOKED, http: 409, condition: "Buffered cart interval collides with another PENDING_DEPOSIT/CONFIRMED/IN_PROGRESS booking for same cart" }
  - { id: ERR_BARISTA_DOUBLE_BOOKED, http: 409, condition: "Barista already has an ACCEPTED/CONFIRMED assignment overlapping this booking window (half-open)" }
  - { id: ERR_WEEKLY_CAP_EXCEEDED, http: 422, condition: "Accepting would push Barista.committed_hours_this_week above weekly_hour_cap" }
  - { id: ERR_GUEST_COUNT_OUT_OF_RANGE, http: 422, condition: "guest_count < 1 or > package.max_guests" }
  - { id: ERR_ADDON_SKILL_MISSING, http: 422, condition: "No assigned barista satisfies add-on skill requirement (latte-art cert or LEAD)" }
  - { id: ERR_NO_BARISTA_ASSIGNED, http: 422, condition: "Submit attempted with zero non-terminal BaristaAssignment rows" }
  - { id: ERR_INSUFFICIENT_INVENTORY, http: 422, condition: "qty_units > on_hand_units - reserved_units" }
  - { id: ERR_SUBTOTAL_BELOW_ZONE_MINIMUM, http: 422, condition: "quoted_subtotal_cents < TravelZone.min_booking_subtotal_cents" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_cart_version or expected_primary_barista_version mismatches current entity version" }
  - { id: ERR_PAYMENT_AMOUNT_MISMATCH, http: 422, condition: "Payment amount does not match expected deposit/balance/refund figure" }
  - { id: ERR_IDEMPOTENCY_CONFLICT, http: 409, condition: "idempotency_key reused with different payload" }
  - { id: ERR_AMEND_WINDOW_CLOSED, http: 409, condition: "Amend attempted within 48h of event_start" }
  - { id: ERR_CANCEL_WINDOW_CLOSED, http: 409, condition: "Cancel attempted after event_start" }
  - { id: ERR_UNRESOLVED_ASSIGNMENTS, http: 409, condition: "Complete attempted while ACCEPTED/CONFIRMED assignments remain" }
  - { id: ERR_CONSUMPTION_OUT_OF_RANGE, http: 422, condition: "qty_consumed < 0 or > qty_units" }
  - { id: ERR_DEPOSIT_ALREADY_PAID, http: 409, condition: "Reopen attempted after a SUCCEEDED deposit" }
  - { id: ERR_BOOKING_NOT_AWAITING_DEPOSIT, http: 409, condition: "Mark-succeeded on a DEPOSIT payment while booking not in PENDING_DEPOSIT" }
  - { id: ERR_VALIDATION, http: 400, condition: "Generic request body validation failure (missing/typed field)" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: OperationsManager
    description: "Back-office operator; manages catalog, inventory, assignments, payments, and clock"
    identity: "opaque"
    exclusive_operations:
      - "POST /coffee-cart/clients|carts|baristas|packages|addons|travel-zones|inventory-items|cancellation-tiers"
      - "POST /coffee-cart/bookings/{id}/assignments"
      - "POST /coffee-cart/bookings/{id}/reservations"
      - "POST /coffee-cart/bookings/{id}/complete"
      - "POST /coffee-cart/assignments/{id}/resolve"
      - "POST /coffee-cart/reservations/{id}/record-consumption|reconcile"
      - "POST /coffee-cart/payments/{id}/mark-succeeded|mark-failed"
      - "POST /coffee-cart/_clock/set_current_utc"
    shared_operations:
      - "GET endpoints across the surface"

  - name: Client
    description: "End customer; owns EventBooking lifecycle"
    identity: "entity_backed:Client"
    exclusive_operations:
      - "POST /coffee-cart/bookings"
      - "POST /coffee-cart/bookings/{id}/addons"
      - "POST /coffee-cart/bookings/{id}/submit|reopen|amend|cancel"
      - "POST /coffee-cart/bookings/{id}/payments"
    shared_operations:
      - "GET /coffee-cart/bookings|addons|payments|assignments (own scope)"
      - "GET /coffee-cart/carts|packages|addons|travel-zones|cancellation-tiers|baristas/{id}"

  - name: Barista
    description: "Field staff; accepts/declines/withdraws assignments"
    identity: "entity_backed:Barista"
    exclusive_operations:
      - "POST /coffee-cart/assignments/{id}/accept"
      - "POST /coffee-cart/assignments/{id}/decline"
      - "POST /coffee-cart/assignments/{id}/withdraw"
    shared_operations:
      - "GET /coffee-cart/assignments/{id}"
      - "GET /coffee-cart/baristas/{id}"
      - "GET /coffee-cart/baristas/{id}/assignments"
      - "GET /coffee-cart/bookings/{id}"
