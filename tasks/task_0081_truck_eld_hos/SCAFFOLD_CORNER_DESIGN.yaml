              captures: { d_id: $.data.id }
            - call: "POST /eld/devices/${dev1_id}/login"
              payload: {}
              as: Driver
              as_user_id: "${d_id}"
          trigger:
            - call: "POST /eld/devices/${dev2_id}/login"
              payload: {}
              as: Driver
              as_user_id: "${d_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Status 409 with data.error_id == ERR_DRIVER_ALREADY_BOUND; ELDDevice.${dev2_id}.status remains UNBOUND."
