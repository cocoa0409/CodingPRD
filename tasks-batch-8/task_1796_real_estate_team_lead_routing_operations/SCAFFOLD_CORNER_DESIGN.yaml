# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Real Estate Team & Lead Routing Operations
# =============================================================================
scaffold_corner_design:
  - section: entities
    instances:
      - name: agent_create_applies_defaults_and_initial_state
        claim_type: defaults
        grounds: [entities.Agent, state_machines.Agent]
        distinguishing_aspect: "Omitting role_on_team yields MEMBER; computed/system fields initialize: status ONBOARDING, performance_tier BRONZE, all trailing counters 0, active_lead_count 0, consecutive_missed_claims 0, avg_first_response_seconds null, version 1."
        test_recipe:
          setup: ["Empty DB; team exists"]
          setup_api_calls:
            - { call: "POST /crm/teams", payload: { name: "Alpha", market: "Austin", timezone: "America/Chicago" }, as: TeamAdmin, captures: { t: $.data.id } }
          trigger:
            - { call: "POST /crm/agents", payload: { team_id: "${t}", display_name: "New Agent", license_number: "LIC-N", max_active_leads: 4 }, as: TeamAdmin, captures: { ag: $.data.id, st: $.data.status, tier: $.data.performance_tier, role: $.data.role_on_team, alc: $.data.active_lead_count, ver: $.data.version } }
          assert:
            - "role == MEMBER (default applied), st == ONBOARDING (initial state), tier == BRONZE, alc == 0, ver == 1"
            - "Agent.${ag}.trailing_90d_conversions == 0, trailing_90d_claimed == 0, trailing_90d_offered == 0, avg_first_response_seconds == null, consecutive_missed_claims == 0"

      - name: engagement_event_points_computed_client_input_ignored
        claim_type: computed_fields
        grounds: [entities.EngagementEvent.fields.points, "validations[priority=3]"]
        distinguishing_aspect: "points and effective_points are computed from the event type and decay schedule; a client-supplied points field is rejected as an undeclared field under the strict-schema rule."
        test_recipe:
          setup: ["Team, DRAFT-free routing not needed (auto_route false source), lead in NEW"]
          setup_api_calls:
            - { call: "POST /crm/teams", payload: { name: "Alpha", market: "Austin", timezone: "America/Chicago" }, as: TeamAdmin, captures: { t: $.data.id } }
            - { call: "POST /crm/lead-sources", payload: { team_id: "${t}", name: "Sphere", type: "SPHERE", cost_per_lead_cents: 0, monthly_budget_cents: 1000000, auto_route: false }, as: TeamAdmin, captures: { src: $.data.id } }
            - { call: "POST /crm/leads", payload: { team_id: "${t}", source_id: "${src}", contact_name: "Buyer", contact_phone: "+15125550100", contact_email: "b@x.com", expected_close_price_cents: 30000000 }, as: TeamAdmin, captures: { lead: $.data.id } }
          trigger:
            - { call: "POST /crm/leads/${lead}/engagement-events", payload: { type: "FORM_SUBMIT", occurred_at: "2026-08-01T00:30:00Z", points: 9999 }, as: TeamAdmin, captures: { err: $.data.error_id } }
            - { call: "POST /crm/leads/${lead}/engagement-events", payload: { type: "FORM_SUBMIT", occurred_at: "2026-08-01T00:30:00Z" }, as: TeamAdmin, captures: { pts: $.data.points, eff: $.data.effective_points } }
          assert:
            - "First trigger: err == ERR_INVALID_REQUEST (strict schema rejects the undeclared points field)"
            - "Second trigger: pts == 25 and eff == 25 (FORM_SUBMIT base points, age < 30 days) — server-computed, client cannot inject"

      - name: get_nonexistent_lead_returns_not_found
        claim_type: not_found
        grounds: ["validations[priority=4]", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "Existence check on the path id: a well-formed UUID that does not exist yields ERR_NOT_FOUND (404), not a schema error."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - { call: "POST /crm/teams", payload: { name: "Alpha", market: "Austin", timezone: "America/Chicago" }, as: TeamAdmin }
          trigger:
            - { call: "GET /crm/leads/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", as: TeamAdmin, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_NOT_FOUND with HTTP 404"

      - name: create_lead_missing_required_field_rejected
        claim_type: required_fields
        grounds: ["validations[priority=3]", "errors[ERR_INVALID_REQUEST]", entities.Lead.fields.contact_phone]
        distinguishing_aspect: "contact_phone has source input and no default; omitting it fails request-shape validation before any state or business rule runs."
        test_recipe:
          setup: ["Team + source exist"]
          setup_api_calls:
            - { call: "POST /crm/teams", payload: { name: "Alpha", market: "Austin", timezone: "America/Chicago" }, as: TeamAdmin, captures: { t: $.data.id } }
            - { call: "POST /crm/lead-sources", payload: { team_id: "${t}", name: "Zillow", type: "PORTAL", cost_per_lead_cents: 0, monthly_budget_cents: 1000000, auto_route: false }, as: TeamAdmin, captures: { src: $.data.id } }
          trigger:
            - { call: "POST /crm/leads", payload: { team_id: "${t}", source_id: "${src}", contact_name: "No Phone", contact_email: "np@x.com", expected_close_price_cents: 30000000 }, as: TeamAdmin, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_REQUEST with HTTP 400 (missing required contact_phone)"

      - name: create_source_with_invalid_enum_rejected
        claim_type: type_constraints
        grounds: ["validations[priority=3]", entities.LeadSource.fields.type]
        distinguishing_aspect: "LeadSource.type is a closed enum; BILLBOARD is rejected with ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Team exists"]
          setup_api_calls:
            - { call: "POST /crm/teams", payload: { name: "Alpha", market: "Austin", timezone: "America/Chicago" }, as: TeamAdmin, captures: { t: $.data.id } }
          trigger:
            - { call: "POST /crm/lead-sources", payload: { team_id: "${t}", name: "Billboard", type: "BILLBOARD", cost_per_lead_cents: 0, monthly_budget_cents: 1000000 }, as: TeamAdmin, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_REQUEST with HTTP 400"

  - section: state_machines
    instances:
      - name: claim_pooled_new_lead_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.Lead.OFFERED_to_CLAIMED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Claim requires OFFERED; a NEW (pooled) lead has no current assignment, so the state precondition fires (not the identity rule, which needs an offered agent to compare against)."
        test_recipe:
          setup: ["Team with ACTIVE policy; auto_route false source; ACTIVE agent A; lead pooled NEW"]
          setup_api_calls:
            - { call: "POST /crm/teams", payload: { name: "Alpha", market: "Austin", timezone: "America/Chicago" }, as: TeamAdmin, captures: { t: $.data.id, t_v: $.data.version } }
            - { call: "POST /crm/routing-policies", payload: { team_id: "${t}", mode: "ROUND_ROBIN" }, as: TeamAdmin, captures: { pol: $.data.id } }
            - { call: "POST /crm/routing-policies/${pol}/activate", payload: { expected_team_version: "${t_v}" }, as: TeamAdmin }
            - { call: "POST /crm/lead-sources", payload: { team_id: "${t}", name: "Sphere", type: "SPHERE", cost_per_lead_cents: 0, monthly_budget_cents: 1000000, auto_route: false }, as: TeamAdmin, captures: { src: $.data.id } }
            - { call: "POST /crm/agents", payload: { team_id: "${t}", display_name: "Agent A", license_number: "LIC-A", max_active_leads: 5 }, as: TeamAdmin, captures: { a: $.data.id } }
            - { call: "POST /crm/agents/${a}/activate", payload: {}, as: TeamAdmin }
            - { call: "POST /crm/leads", payload: { team_id: "${t}", source_id: "${src}", contact_name: "Pooled", contact_phone: "+15125550101", contact_email: "p@x.com", expected_close_price_cents: 30000000 }, as: TeamAdmin, captures: { lead: $.data.id } }
          trigger:
            - { call: "POST /crm/leads/${lead}/claim", payload: {}, as: Agent, as_user_id: "${a}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_STATE (409); Lead.${lead}.status remains NEW and no assignment is created"

      - name: offboarded_agent_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Agent]
        distinguishing_aspect: "OFFBOARDED is terminal: resume, pause, and a second offboard are all rejected with ERR_INVALID_STATE; the drain to OFFBOARDED happens inside the offboard call when no active leads exist."
        test_recipe:
          setup: ["Team; agent A activated then offboarded (no pipeline, so OFFBOARDING drains to OFFBOARDED immediately)"]
          setup_api_calls:
            - { call: "POST /crm/teams", payload: { name: "Alpha", market: "Austin", timezone: "America/Chicago" }, as: TeamAdmin, captures: { t: $.data.id } }
            - { call: "POST /crm/agents", payload: { team_id: "${t}", display_name: "Agent A", license_number: "LIC-A", max_active_leads: 5 }, as: TeamAdmin, captures: { a: $.data.id } }
            - { call: "POST /crm/agents/${a}/activate", payload: {}, as: TeamAdmin }
            - { call: "POST /crm/agents/${a}/offboard", payload: {}, as: TeamAdmin, captures: { st: $.data.status } }
          trigger:
            - { call: "POST /crm/agents/${a}/resume", payload: {}, as: TeamAdmin, captures: { err: $.data.error_id } }
            - { call: "POST /crm/agents/${a}/pause", payload: {}, as: TeamAdmin, captures: { err2: $.data.error_id } }
          assert:
            - "st == OFFBOARDED (drain completed inline: active_lead_count was 0)"
            - "err == ERR_INVALID_STATE and err2 == ERR_INVALID_STATE — no transitions leave OFFBOARDED"

      - name: second_log_response_rejected_idempotency
        claim_type: idempotency
        grounds: [state_machines.Lead.CLAIMED_to_WORKING, entities.Lead.fields.first_response_at]
        distinguishing_aspect: "log-response is a once-per-lead transition: the second call observes first_response_at already set and status WORKING, and is rejected with ERR_INVALID_STATE; within_speed_sla is not recomputed."
        test_recipe:
          setup: ["Team (speed window 900) with ACTIVE policy; auto_route source; ACTIVE agent C; lead claimed and first response logged at 00:05:00"]
          setup_api_calls:
            - { call: "POST /crm/teams", payload: { name: "Alpha", market: "Austin", timezone: "America/Chicago" }, as: TeamAdmin, captures: { t: $.data.id, t_v: $.data.version } }
            - { call: "POST /crm/routing-policies", payload: { team_id: "${t}", mode: "ROUND_ROBIN" }, as: TeamAdmin, captures: { pol: $.data.id } }
            - { call: "POST /crm/routing-policies/${pol}/activate", payload: { expected_team_version: "${t_v}" }, as: TeamAdmin }
            - { call: "POST /crm/lead-sources", payload: { team_id: "${t}", name: "Zillow", type: "PORTAL", cost_per_lead_cents: 0, monthly_budget_cents: 1000000 }, as: TeamAdmin, captures: { src: $.data.id } }
            - { call: "POST /crm/agents", payload: { team_id: "${t}", display_name: "Agent C", license_number: "LIC-C", max_active_leads: 5 }, as: TeamAdmin, captures: { c: $.data.id } }
            - { call: "POST /crm/agents/${c}/activate", payload: {}, as: TeamAdmin }
            - { call: "POST /crm/leads", payload: { team_id: "${t}", source_id: "${src}", contact_name: "Buyer", contact_phone: "+15125550102", contact_email: "b@x.com", expected_close_price_cents: 30000000 }, as: TeamAdmin, captures: { lead: $.data.id } }
            - { call: "POST /crm/leads/${lead}/claim", payload: {}, as: Agent, as_user_id: "${c}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:05:00Z" }, as: TeamAdmin }
            - { call: "POST /crm/leads/${lead}/log-response", payload: {}, as: Agent, as_user_id: "${c}", captures: { sla_first: $.data.within_speed_sla } }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T01:00:00Z" }, as: TeamAdmin }
            - { call: "POST /crm/leads/${lead}/log-response", payload: {}, as: Agent, as_user_id: "${c}", captures: { err: $.data.error_id } }
          assert:
            - "sla_first == true (300s <= 900s)"
            - "err == ERR_INVALID_STATE; Lead.${lead}.first_response_at stays 2026-08-01T00:05:00Z and within_speed_sla stays true"

      - name: policy_double_activate_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.RoutingPolicy.DRAFT_to_ACTIVE, "errors[ERR_POLICY_NOT_ACTIVATABLE]"]
        distinguishing_aspect: "Activating an already-ACTIVE policy with a FRESH team version passes OCC but fails the DRAFT-only state precondition with ERR_POLICY_NOT_ACTIVATABLE."
        test_recipe:
          setup: ["Team; policy P1 created and activated (team version advanced 1 -> 2)"]
          setup_api_calls:
            - { call: "POST /crm/teams", payload: { name: "Alpha", market: "Austin", timezone: "America/Chicago" }, as: TeamAdmin, captures: { t: $.data.id, t_v: $.data.version } }
            - { call: "POST /crm/routing-policies", payload: { team_id: "${t}", mode: "ROUND_ROBIN" }, as: TeamAdmin, captures: { p1: $.data.id } }
            - { call: "POST /crm/routing-policies/${p1}/activate", payload: { expected_team_version: "${t_v}" }, as: TeamAdmin }
            - { call: "GET /crm/teams/${t}", as: TeamAdmin, captures: { t_v2: $.data.version } }
          trigger:
            - { call: "POST /crm/routing-policies/${p1}/activate", payload: { expected_team_version: "${t_v2}" }, as: TeamAdmin, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_POLICY_NOT_ACTIVATABLE (409) — OCC passed (fresh version) but the policy is no longer DRAFT"
            - "RoutingPolicy.${p1}.status remains ACTIVE"

      - name: enrollment_auto_exits_on_temperature_shift
        claim_type: side_effect_execution
        grounds: [state_machines.NurtureEnrollment.ENROLLED_to_EXITED, calculations.engagement_score_and_temperature]
        distinguishing_aspect: "Cross-entity conditional cascade: the engagement event changes Lead.temperature COLD -> HOT, which exits the ENROLLED enrollment of the COLD-target campaign with exit_reason TEMPERATURE_SHIFT."
        test_recipe:
          setup:
            - "Team with ACTIVE policy; auto_route source; ACTIVE agent C; ONBOARDING LEADER L"
            - "ACTIVE campaign targeting COLD; lead claimed by C (temperature COLD), enrolled"
          setup_api_calls:
            - { call: "POST /crm/teams", payload: { name: "Alpha", market: "Austin", timezone: "America/Chicago" }, as: TeamAdmin, captures: { t: $.data.id, t_v: $.data.version } }
            - { call: "POST /crm/routing-policies", payload: { team_id: "${t}", mode: "ROUND_ROBIN" }, as: TeamAdmin, captures: { pol: $.data.id } }
            - { call: "POST /crm/routing-policies/${pol}/activate", payload: { expected_team_version: "${t_v}" }, as: TeamAdmin }
            - { call: "POST /crm/lead-sources", payload: { team_id: "${t}", name: "Zillow", type: "PORTAL", cost_per_lead_cents: 0, monthly_budget_cents: 1000000 }, as: TeamAdmin, captures: { src: $.data.id } }
            - { call: "POST /crm/agents", payload: { team_id: "${t}", display_name: "Agent C", license_number: "LIC-C", max_active_leads: 5 }, as: TeamAdmin, captures: { c: $.data.id } }
            - { call: "POST /crm/agents/${c}/activate", payload: {}, as: TeamAdmin }
            - { call: "POST /crm/agents", payload: { team_id: "${t}", display_name: "Leader L", license_number: "LIC-L", role_on_team: "LEADER", max_active_leads: 5 }, as: TeamAdmin, captures: { l: $.data.id } }
            - { call: "POST /crm/nurture-campaigns", payload: { team_id: "${t}", name: "Cold Drip", temperature_target: "COLD", steps: [{ offset_days: 1, channel: "EMAIL" }] }, as: TeamAdmin, captures: { camp: $.data.id } }
            - { call: "POST /crm/nurture-campaigns/${camp}/activate", payload: {}, as: TeamAdmin }
            - { call: "POST /crm/leads", payload: { team_id: "${t}", source_id: "${src}", contact_name: "Buyer", contact_phone: "+15125550103", contact_email: "b@x.com", expected_close_price_cents: 30000000 }, as: TeamAdmin, captures: { lead: $.data.id } }
            - { call: "POST /crm/leads/${lead}/claim", payload: {}, as: Agent, as_user_id: "${c}" }
            - { call: "POST /crm/nurture-enrollments", payload: { campaign_id: "${camp}", lead_id: "${lead}" }, as: TeamLeader, as_user_id: "${l}", captures: { enr: $.data.id } }
          trigger:
            - { call: "POST /crm/leads/${lead}/engagement-events", payload: { type: "SHOWING_ATTENDED", occurred_at: "2026-08-01T00:30:00Z" }, as: TeamAdmin }
            - { call: "POST /crm/leads/${lead}/engagement-events", payload: { type: "SHOWING_ATTENDED", occurred_at: "2026-08-01T01:00:00Z" }, as: TeamAdmin }
          assert:
            - "Lead.${lead}.engagement_score == 80 and temperature == HOT (two SHOWING_ATTENDED, 40 + 40)"
            - "NurtureEnrollment.${enr}.status == EXITED with exit_reason == TEMPERATURE_SHIFT — fired by the temperature change, not by any direct enrollment call"
            - "Lead.${lead}.status remains CLAIMED (temperature shift does not move the status dimension)"

      - name: enrollment_completes_after_final_step_via_clock
        claim_type: valid_transition
        grounds: [state_machines.NurtureEnrollment.ENROLLED_to_COMPLETED]
        distinguishing_aspect: "System auto-transition with exact-boundary semantics: when the clock reaches next_send_at exactly, the final step sends and the single-step enrollment transitions ENROLLED -> COMPLETED."
        test_recipe:
          setup: ["Team with ACTIVE policy; auto_route source; ACTIVE agent C; LEADER L; ACTIVE COLD campaign with one step at offset_days 1; lead claimed and enrolled at 2026-08-01T00:00:00Z (next_send_at 2026-08-02T00:00:00Z)"]
          setup_api_calls:
            - { call: "POST /crm/teams", payload: { name: "Alpha", market: "Austin", timezone: "America/Chicago" }, as: TeamAdmin, captures: { t: $.data.id, t_v: $.data.version } }
            - { call: "POST /crm/routing-policies", payload: { team_id: "${t}", mode: "ROUND_ROBIN" }, as: TeamAdmin, captures: { pol: $.data.id } }
            - { call: "POST /crm/routing-policies/${pol}/activate", payload: { expected_team_version: "${t_v}" }, as: TeamAdmin }
            - { call: "POST /crm/lead-sources", payload: { team_id: "${t}", name: "Zillow", type: "PORTAL", cost_per_lead_cents: 0, monthly_budget_cents: 1000000 }, as: TeamAdmin, captures: { src: $.data.id } }
            - { call: "POST /crm/agents", payload: { team_id: "${t}", display_name: "Agent C", license_number: "LIC-C", max_active_leads: 5 }, as: TeamAdmin, captures: { c: $.data.id } }
            - { call: "POST /crm/agents/${c}/activate", payload: {}, as: TeamAdmin }
            - { call: "POST /crm/agents", payload: { team_id: "${t}", display_name: "Leader L", license_number: "LIC-L", role_on_team: "LEADER", max_active_leads: 5 }, as: TeamAdmin, captures: { l: $.data.id } }
            - { call: "POST /crm/nurture-campaigns", payload: { team_id: "${t}", name: "Cold Drip", temperature_target: "COLD", steps: [{ offset_days: 1, channel: "EMAIL" }] }, as: TeamAdmin, captures: { camp: $.data.id } }
            - { call: "POST /crm/nurture-campaigns/${camp}/activate", payload: {}, as: TeamAdmin }
            - { call: "POST /crm/leads", payload: { team_id: "${t}", source_id: "${src}", contact_name: "Buyer", contact_phone: "+15125550104", contact_email: "b@x.com", expected_close_price_cents: 30000000 }, as: TeamAdmin, captures: { lead: $.data.id } }
            - { call: "POST /crm/leads/${lead}/claim", payload: {}, as: Agent, as_user_id: "${c}" }
            - { call: "POST /crm/nurture-enrollments", payload: { campaign_id: "${camp}", lead_id: "${lead}" }, as: TeamLeader, as_user_id: "${l}", captures: { enr: $.data.id, nsa: $.data.next_send_at } }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T00:00:00Z" }, as: TeamAdmin, captures: { advanced: $.data.advanced_enrollment_count } }
          assert:
            - "nsa == 2026-08-02T00:00:00Z (enrolled_at + steps[0].offset_days)"
            - "advanced == 1 and NurtureEnrollment.${enr}.status == COMPLETED — step fires at exactly next_send_at (inclusive <=) and the final step completes the enrollment"

      - name: split_agreement_expires_at_effective_until_boundary
        claim_type: valid_transition
        grounds: [state_machines.SplitAgreement.ACTIVE_to_EXPIRED, entities.SplitAgreement.fields.effective_until]
        distinguishing_aspect: "System auto-transition at an exclusive interval end: now == effective_until expires the agreement (>= semantics), so the window's last covered instant is strictly before effective_until."
        test_recipe:
          setup: ["Team; ACTIVE agents A1, A2; agreement over [2026-08-01, 2026-08-10)"]
          setup_api_calls:
            - { call: "POST /crm/teams", payload: { name: "Alpha", market: "Austin", timezone: "America/Chicago" }, as: TeamAdmin, captures: { t: $.data.id } }
            - { call: "POST /crm/agents", payload: { team_id: "${t}", display_name: "Agent One", license_number: "LIC-A1", max_active_leads: 5 }, as: TeamAdmin, captures: { a1: $.data.id } }
            - { call: "POST /crm/agents/${a1}/activate", payload: {}, as: TeamAdmin }
            - { call: "POST /crm/agents", payload: { team_id: "${t}", display_name: "Agent Two", license_number: "LIC-A2", max_active_leads: 5 }, as: TeamAdmin, captures: { a2: $.data.id } }
            - { call: "POST /crm/agents/${a2}/activate", payload: {}, as: TeamAdmin }
            - { call: "POST /crm/split-agreements", payload: { team_id: "${t}", agent_a_id: "${a1}", agent_b_id: "${a2}", a_share_bps: 5000, b_share_bps: 5000, effective_from: "2026-08-01T00:00:00Z", effective_until: "2026-08-10T00:00:00Z" }, as: TeamAdmin, captures: { g: $.data.id } }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: TeamAdmin, captures: { expired: $.data.expired_agreement_count } }
          assert:
            - "expired == 1 and SplitAgreement.${g}.status == EXPIRED — the exclusive end is not covered (now >= effective_until)"

  - section: calculations
    instances:
      - name: temperature_threshold_warm_at_exactly_40
        claim_type: correct_result
        grounds: [calculations.engagement_score_and_temperature]
        distinguishing_aspect: "Inclusive threshold: engagement_score exactly 40 yields WARM (not COLD); 35 stays COLD. Verified on two leads with event mixes 25+10+5=40 and 25+10=35."
        test_recipe:
          setup: ["Team; auto_route false source; two NEW leads; events posted at default clock with recent occurred_at"]
          setup_api_calls:
            - { call: "POST /crm/teams", payload: { name: "Alpha", market: "Austin", timezone: "America/Chicago" }, as: TeamAdmin, captures: { t: $.data.id } }
            - { call: "POST /crm/lead-sources", payload: { team_id: "${t}", name: "Sphere", type: "SPHERE", cost_per_lead_cents: 0, monthly_budget_cents: 1000000, auto_route: false }, as: TeamAdmin, captures: { src: $.data.id } }
            - { call: "POST /crm/leads", payload: { team_id: "${t}", source_id: "${src}", contact_name: "Warm", contact_phone: "+15125550110", contact_email: "w@x.com", expected_close_price_cents: 30000000 }, as: TeamAdmin, captures: { lw: $.data.id } }
            - { call: "POST /crm/leads", payload: { team_id: "${t}", source_id: "${src}", contact_name: "Cold", contact_phone: "+15125550111", contact_email: "c@x.com", expected_close_price_cents: 30000000 }, as: TeamAdmin, captures: { lc: $.data.id } }
          trigger:
            - { call: "POST /crm/leads/${lw}/engagement-events", payload: { type: "FORM_SUBMIT", occurred_at: "2026-08-01T00:30:00Z" }, as: TeamAdmin }
            - { call: "POST /crm/leads/${lw}/engagement-events", payload: { type: "LINK_CLICK", occurred_at: "2026-08-01T00:31:00Z" }, as: TeamAdmin }
            - { call: "POST /crm/leads/${lw}/engagement-events", payload: { type: "EMAIL_OPEN", occurred_at: "2026-08-01T00:32:00Z" }, as: TeamAdmin }
            - { call: "POST /crm/leads/${lc}/engagement-events", payload: { type: "FORM_SUBMIT", occurred_at: "2026-08-01T00:30:00Z" }, as: TeamAdmin }
            - { call: "POST /crm/leads/${lc}/engagement-events", payload: { type: "LINK_CLICK", occurred_at: "2026-08-01T00:31:00Z" }, as: TeamAdmin }
            - { call: "GET /crm/leads/${lw}", as: TeamAdmin, captures: { tw: $.data.temperature, sw: $.data.engagement_score } }
            - { call: "GET /crm/leads/${lc}", as: TeamAdmin, captures: { tc: $.data.temperature, sc: $.data.engagement_score } }
          assert:
            - "sw == 40 and tw == WARM (25+10+5; 40 >= 40 qualifies)"
            - "sc == 35 and tc == COLD (25+10; below the 40 threshold)"

      - name: engagement_decay_step_halves_then_zeroes
        claim_type: precision
        grounds: [calculations.engagement_score_and_temperature]
        distinguishing_aspect: "Step decay boundaries on the same event: one SHOWING_ATTENDED (40 pts) contributes 40 at age 25 days, floor(40/2)=20 at age 35 days, and 0 at age 62 days — reading the same lead at three clock positions."
        test_recipe:
          setup: ["Team; auto_route false source; NEW lead with one SHOWING_ATTENDED occurred 2026-08-01T00:00:00Z"]
          setup_api_calls:
            - { call: "POST /crm/teams", payload: { name: "Alpha", market: "Austin", timezone: "America/Chicago" }, as: TeamAdmin, captures: { t: $.data.id } }
            - { call: "POST /crm/lead-sources", payload: { team_id: "${t}", name: "Sphere", type: "SPHERE", cost_per_lead_cents: 0, monthly_budget_cents: 1000000, auto_route: false }, as: TeamAdmin, captures: { src: $.data.id } }
            - { call: "POST /crm/leads", payload: { team_id: "${t}", source_id: "${src}", contact_name: "Decayer", contact_phone: "+15125550112", contact_email: "d@x.com", expected_close_price_cents: 30000000 }, as: TeamAdmin, captures: { lead: $.data.id } }
            - { call: "POST /crm/leads/${lead}/engagement-events", payload: { type: "SHOWING_ATTENDED", occurred_at: "2026-08-01T00:00:00Z" }, as: TeamAdmin }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-26T00:00:00Z" }, as: TeamAdmin }
            - { call: "GET /crm/leads/${lead}", as: TeamAdmin, captures: { s25: $.data.engagement_score, t25: $.data.temperature } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-05T00:00:00Z" }, as: TeamAdmin }
            - { call: "GET /crm/leads/${lead}", as: TeamAdmin, captures: { s35: $.data.engagement_score, t35: $.data.temperature } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-10-02T00:00:00Z" }, as: TeamAdmin }
            - { call: "GET /crm/leads/${lead}", as: TeamAdmin, captures: { s62: $.data.engagement_score } }
          assert:
            - "s25 == 40 and t25 == WARM (age 25 days < 30: full points; exactly at the WARM threshold)"
            - "s35 == 20 and t35 == COLD (30 <= age 35 < 60: floor(40/2))"
            - "s62 == 0 (age 62 >= 60: fully decayed)"

      - name: source_roi_empty_cohort_null_roi
        claim_type: correct_result
        grounds: [calculations.source_roi]
        distinguishing_aspect: "Empty-set guard: with zero cohort leads, spend_cents == 0 and roi_bps is null (division by zero is defined away), while leads_count and conversions_count are 0."
        test_recipe:
          setup: ["Team; source with no leads"]
          setup_api_calls:
            - { call: "POST /crm/teams", payload: { name: "Alpha", market: "Austin", timezone: "America/Chicago" }, as: TeamAdmin, captures: { t: $.data.id } }
            - { call: "POST /crm/lead-sources", payload: { team_id: "${t}", name: "Zillow", type: "PORTAL", cost_per_lead_cents: 10000, monthly_budget_cents: 1000000 }, as: TeamAdmin, captures: { src: $.data.id } }
          trigger:
            - { call: "GET /crm/lead-sources/${src}/roi", as: TeamAdmin, captures: { roi: $.data.roi_bps, spend: $.data.spend_cents, n: $.data.leads_count } }
          assert:
            - "n == 0, spend == 0, roi == null (empty-cohort guard; no division by zero)"

      - name: scorecard_weighted_accountability_score
        claim_type: correct_result
        grounds: [calculations.accountability_score, calculations.agent_performance_tier]
        distinguishing_aspect: "Weighted scoring with pinned constants: seeded counters (conv 2, claimed 5, offered 10, avg response 600s vs 900s window) yield claim_rate 5000, speed 10000, conversion 4000 bps and accountability_score_bps exactly 6300."
        test_recipe:
          setup: ["Team (default speed window 900); agent seeded with production stats; no ACTIVE policy needed (window falls back to team default)"]
          setup_api_calls:
            - { call: "POST /crm/teams", payload: { name: "Alpha", market: "Austin", timezone: "America/Chicago" }, as: TeamAdmin, captures: { t: $.data.id } }
            - { call: "POST /crm/agents", payload: { team_id: "${t}", display_name: "Agent A", license_number: "LIC-A", max_active_leads: 5 }, as: TeamAdmin, captures: { a: $.data.id } }
            - { call: "POST /crm/agents/${a}/import-production-stats", payload: { trailing_90d_conversions: 2, trailing_90d_claimed: 5, trailing_90d_offered: 10, avg_first_response_seconds: 600 }, as: TeamAdmin }
          trigger:
            - { call: "GET /crm/agents/${a}/scorecard", as: TeamAdmin, captures: { claim_bps: $.data.claim_rate_bps, speed_bps: $.data.speed_score_bps, conv_bps: $.data.conversion_rate_bps, score: $.data.accountability_score_bps, tier: $.data.performance_tier } }
          assert:
            - "claim_bps == 5000 (5*10000/10), speed_bps == 10000 (600 <= 900), conv_bps == 4000 (2*10000/5)"
            - "score == 6300 = round_half_up((5*5000 + 3*10000 + 2*4000)/10)"
            - "tier == SILVER (conversions 2 >= 1 but GOLD needs >= 4)"

      - name: tier_boundary_gold_at_exact_thresholds
        claim_type: constants_applied
        grounds: [calculations.agent_performance_tier]
        distinguishing_aspect: "Both threshold comparisons are inclusive: conversions exactly 4 with response exactly 900s yields GOLD; response 901s demotes to SILVER; conversions 8 with 300s yields PLATINUM."
        test_recipe:
          setup: ["Team; three agents seeded to sit exactly on / just off the tier boundaries"]
          setup_api_calls:
            - { call: "POST /crm/teams", payload: { name: "Alpha", market: "Austin", timezone: "America/Chicago" }, as: TeamAdmin, captures: { t: $.data.id } }
            - { call: "POST /crm/agents", payload: { team_id: "${t}", display_name: "Gold G", license_number: "LIC-G", max_active_leads: 5 }, as: TeamAdmin, captures: { g: $.data.id } }
            - { call: "POST /crm/agents/${g}/import-production-stats", payload: { trailing_90d_conversions: 4, avg_first_response_seconds: 900 }, as: TeamAdmin }
            - { call: "POST /crm/agents", payload: { team_id: "${t}", display_name: "Silver S", license_number: "LIC-S", max_active_leads: 5 }, as: TeamAdmin, captures: { s: $.data.id } }
            - { call: "POST /crm/agents/${s}/import-production-stats", payload: { trailing_90d_conversions: 4, avg_first_response_seconds: 901 }, as: TeamAdmin }
            - { call: "POST /crm/agents", payload: { team_id: "${t}", display_name: "Plat P", license_number: "LIC-P", max_active_leads: 5 }, as: TeamAdmin, captures: { p: $.data.id } }
            - { call: "POST /crm/agents/${p}/import-production-stats", payload: { trailing_90d_conversions: 8, avg_first_response_seconds: 300 }, as: TeamAdmin }
          trigger:
            - { call: "GET /crm/agents/${g}", as: TeamAdmin, captures: { tg: $.data.performance_tier } }
            - { call: "GET /crm/agents/${s}", as: TeamAdmin, captures: { ts: $.data.performance_tier } }
            - { call: "GET /crm/agents/${p}", as: TeamAdmin, captures: { tp: $.data.performance_tier } }
          assert:
            - "tg == GOLD (4 >= 4 and 900 <= 900), ts == SILVER (901 > 900 fails the GOLD response gate), tp == PLATINUM (8 >= 8 and 300 <= 300)"

  - section: validations
    instances:
      - name: source_budget_equality_allowed_excess_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=10]", "errors[ERR_SOURCE_BUDGET_EXHAUSTED]"]
        distinguishing_aspect: "Fiscal boundary is inclusive: intake is allowed while spent + cost <= budget (the second lead lands exactly on the cap), and the third lead is rejected with ERR_SOURCE_BUDGET_EXHAUSTED."
        test_recipe:
          setup: ["Team; source cost 10000 budget 20000 auto_route false; two leads already taken (spent exactly 20000)"]
          setup_api_calls:
            - { call: "POST /crm/teams", payload: { name: "Alpha", market: "Austin", timezone: "America/Chicago" }, as: TeamAdmin, captures: { t: $.data.id } }
            - { call: "POST /crm/lead-sources", payload: { team_id: "${t}", name: "Zillow", type: "PORTAL", cost_per_lead_cents: 10000, monthly_budget_cents: 20000, auto_route: false }, as: TeamAdmin, captures: { src: $.data.id } }
            - { call: "POST /crm/leads", payload: { team_id: "${t}", source_id: "${src}", contact_name: "One", contact_phone: "+15125550120", contact_email: "1@x.com", expected_close_price_cents: 30000000 }, as: TeamAdmin }
            - { call: "POST /crm/leads", payload: { team_id: "${t}", source_id: "${src}", contact_name: "Two", contact_phone: "+15125550121", contact_email: "2@x.com", expected_close_price_cents: 30000000 }, as: TeamAdmin }
          trigger:
            - { call: "POST /crm/leads", payload: { team_id: "${t}", source_id: "${src}", contact_name: "Three", contact_phone: "+15125550122", contact_email: "3@x.com", expected_close_price_cents: 30000000 }, as: TeamAdmin, captures: { err: $.data.error_id } }
            - { call: "GET /crm/lead-sources/${src}", as: TeamAdmin, captures: { spent: $.data.spent_this_month_cents, cnt: $.data.leads_this_month_count } }
          assert:
            - "The second intake succeeded at exact equality (10000 + 10000 <= 20000)"
            - "err == ERR_SOURCE_BUDGET_EXHAUSTED for the third (20000 + 10000 > 20000)"
            - "spent == 20000 and cnt == 2 — a rejected intake never mutates the counters"

      - name: duplicate_open_lead_phone_rejected_then_freed_by_close
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_DUPLICATE_OPEN_LEAD]"]
        distinguishing_aspect: "Phone uniqueness is scoped to non-terminal leads: the duplicate is rejected while lead1 is active, and the same phone is accepted again after lead1 reaches CLOSED_LOST."
        test_recipe:
          setup: ["Team with ACTIVE policy; auto_route source; ACTIVE agent C; lead1 (phone P) routed, claimed, then closed-lost in the second phase"]
          setup_api_calls:
            - { call: "POST /crm/teams", payload: { name: "Alpha", market: "Austin", timezone: "America/Chicago" }, as: TeamAdmin, captures: { t: $.data.id, t_v: $.data.version } }
            - { call: "POST /crm/routing-policies", payload: { team_id: "${t}", mode: "ROUND_ROBIN" }, as: TeamAdmin, captures: { pol: $.data.id } }
            - { call: "POST /crm/routing-policies/${pol}/activate", payload: { expected_team_version: "${t_v}" }, as: TeamAdmin }
            - { call: "POST /crm/lead-sources", payload: { team_id: "${t}", name: "Zillow", type: "PORTAL", cost_per_lead_cents: 0, monthly_budget_cents: 1000000 }, as: TeamAdmin, captures: { src: $.data.id } }
            - { call: "POST /crm/agents", payload: { team_id: "${t}", display_name: "Agent C", license_number: "LIC-C", max_active_leads: 5 }, as: TeamAdmin, captures: { c: $.data.id } }
            - { call: "POST /crm/agents/${c}/activate", payload: {}, as: TeamAdmin }
            - { call: "POST /crm/leads", payload: { team_id: "${t}", source_id: "${src}", contact_name: "First", contact_phone: "+15125550123", contact_email: "f@x.com", expected_close_price_cents: 30000000 }, as: TeamAdmin, captures: { lead1: $.data.id } }
          trigger:
            - { call: "POST /crm/leads", payload: { team_id: "${t}", source_id: "${src}", contact_name: "Dup", contact_phone: "+15125550123", contact_email: "d@x.com", expected_close_price_cents: 30000000 }, as: TeamAdmin, captures: { err: $.data.error_id } }
            - { call: "POST /crm/leads/${lead1}/claim", payload: {}, as: Agent, as_user_id: "${c}" }
            - { call: "POST /crm/leads/${lead1}/close-lost", payload: { reason: "not interested" }, as: Agent, as_user_id: "${c}" }
            - { call: "POST /crm/leads", payload: { team_id: "${t}", source_id: "${src}", contact_name: "Again", contact_phone: "+15125550123", contact_email: "a@x.com", expected_close_price_cents: 30000000 }, as: TeamAdmin, captures: { lead3: $.data.id } }
          assert:
            - "err == ERR_DUPLICATE_OPEN_LEAD while lead1 is active"
            - "After lead1 -> CLOSED_LOST the same phone succeeds: Lead.${lead3} created (201) with status OFFERED (auto-routed)"

      - name: referral_partner_field_conditional_requirement
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_REFERRAL_PARTNER_REQUIRED]"]
        distinguishing_aspect: "Conditional validation keyed on source.type: REFERRAL_PARTNER intake without referral_partner_id fails, and referral_partner_id on a PORTAL intake fails — both with ERR_REFERRAL_PARTNER_REQUIRED (422)."
        test_recipe:
          setup: ["Team; one REFERRAL_PARTNER source and one PORTAL source; partner Pat"]
          setup_api_calls:
            - { call: "POST /crm/teams", payload: { name: "Alpha", market: "Austin", timezone: "America/Chicago" }, as: TeamAdmin, captures: { t: $.data.id } }
            - { call: "POST /crm/lead-sources", payload: { team_id: "${t}", name: "Pat Referrals", type: "REFERRAL_PARTNER", cost_per_lead_cents: 0, monthly_budget_cents: 1000000, auto_route: false }, as: TeamAdmin, captures: { rsrc: $.data.id } }
            - { call: "POST /crm/lead-sources", payload: { team_id: "${t}", name: "Zillow", type: "PORTAL", cost_per_lead_cents: 0, monthly_budget_cents: 1000000, auto_route: false }, as: TeamAdmin, captures: { psrc: $.data.id } }
            - { call: "POST /crm/referral-partners", payload: { team_id: "${t}", name: "Pat", fee_bps: 2500 }, as: TeamAdmin, captures: { partner: $.data.id } }
          trigger:
            - { call: "POST /crm/leads", payload: { team_id: "${t}", source_id: "${rsrc}", contact_name: "No Partner", contact_phone: "+15125550124", contact_email: "np@x.com", expected_close_price_cents: 30000000 }, as: TeamAdmin, captures: { err1: $.data.error_id } }
            - { call: "POST /crm/leads", payload: { team_id: "${t}", source_id: "${psrc}", contact_name: "Wrong Partner", contact_phone: "+15125550125", contact_email: "wp@x.com", expected_close_price_cents: 30000000, referral_partner_id: "${partner}" }, as: TeamAdmin, captures: { err2: $.data.error_id } }
          assert:
            - "err1 == ERR_REFERRAL_PARTNER_REQUIRED (referral source without partner) and err2 == ERR_REFERRAL_PARTNER_REQUIRED (partner on non-referral source)"

      - name: split_share_sum_and_agent_pair_structural_errors
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_SPLIT_SHARE_SUM_INVALID]", "errors[ERR_SPLIT_AGENT_PAIR_INVALID]"]
        distinguishing_aspect: "Structural 422s fire when the temporal rule does NOT: a non-overlapping window with shares 4000+4000 != 10000 yields ERR_SPLIT_SHARE_SUM_INVALID; agent_a_id == agent_b_id yields ERR_SPLIT_AGENT_PAIR_INVALID."
        test_recipe:
          setup: ["Team; ACTIVE agents A1, A2; no existing agreements"]
          setup_api_calls:
            - { call: "POST /crm/teams", payload: { name: "Alpha", market: "Austin", timezone: "America/Chicago" }, as: TeamAdmin, captures: { t: $.data.id } }
            - { call: "POST /crm/agents", payload: { team_id: "${t}", display_name: "Agent One", license_number: "LIC-A1", max_active_leads: 5 }, as: TeamAdmin, captures: { a1: $.data.id } }
            - { call: "POST /crm/agents/${a1}/activate", payload: {}, as: TeamAdmin }
            - { call: "POST /crm/agents", payload: { team_id: "${t}", display_name: "Agent Two", license_number: "LIC-A2", max_active_leads: 5 }, as: TeamAdmin, captures: { a2: $.data.id } }
            - { call: "POST /crm/agents/${a2}/activate", payload: {}, as: TeamAdmin }
          trigger:
            - { call: "POST /crm/split-agreements", payload: { team_id: "${t}", agent_a_id: "${a1}", agent_b_id: "${a2}", a_share_bps: 4000, b_share_bps: 4000, effective_from: "2026-08-01T00:00:00Z" }, as: TeamAdmin, captures: { err1: $.data.error_id } }
            - { call: "POST /crm/split-agreements", payload: { team_id: "${t}", agent_a_id: "${a1}", agent_b_id: "${a1}", a_share_bps: 5000, b_share_bps: 5000, effective_from: "2026-08-01T00:00:00Z" }, as: TeamAdmin, captures: { err2: $.data.error_id } }
          assert:
            - "err1 == ERR_SPLIT_SHARE_SUM_INVALID (422) — no overlap exists, so the constraint rule is the one that fires"
            - "err2 == ERR_SPLIT_AGENT_PAIR_INVALID (422) — self-pairing is structurally invalid"

      - name: enrollment_temperature_mismatch_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_TEMPERATURE_MISMATCH]"]
        distinguishing_aspect: "Aggregate-vs-individual style check: the campaign is ACTIVE and the lead is eligible, but the lead's WARM temperature does not equal the COLD target — ERR_TEMPERATURE_MISMATCH."
        test_recipe:
          setup: ["Team with ACTIVE policy; auto_route source; ACTIVE agent C; LEADER L; ACTIVE COLD-target campaign; lead claimed by C then warmed to WARM (40 points)"]
          setup_api_calls:
            - { call: "POST /crm/teams", payload: { name: "Alpha", market: "Austin", timezone: "America/Chicago" }, as: TeamAdmin, captures: { t: $.data.id, t_v: $.data.version } }
            - { call: "POST /crm/routing-policies", payload: { team_id: "${t}", mode: "ROUND_ROBIN" }, as: TeamAdmin, captures: { pol: $.data.id } }
            - { call: "POST /crm/routing-policies/${pol}/activate", payload: { expected_team_version: "${t_v}" }, as: TeamAdmin }
            - { call: "POST /crm/lead-sources", payload: { team_id: "${t}", name: "Zillow", type: "PORTAL", cost_per_lead_cents: 0, monthly_budget_cents: 1000000 }, as: TeamAdmin, captures: { src: $.data.id } }
            - { call: "POST /crm/agents", payload: { team_id: "${t}", display_name: "Agent C", license_number: "LIC-C", max_active_leads: 5 }, as: TeamAdmin, captures: { c: $.data.id } }
            - { call: "POST /crm/agents/${c}/activate", payload: {}, as: TeamAdmin }
            - { call: "POST /crm/agents", payload: { team_id: "${t}", display_name: "Leader L", license_number: "LIC-L", role_on_team: "LEADER", max_active_leads: 5 }, as: TeamAdmin, captures: { l: $.data.id } }
            - { call: "POST /crm/nurture-campaigns", payload: { team_id: "${t}", name: "Cold Drip", temperature_target: "COLD", steps: [{ offset_days: 1, channel: "EMAIL" }] }, as: TeamAdmin, captures: { camp: $.data.id } }
            - { call: "POST /crm/nurture-campaigns/${camp}/activate", payload: {}, as: TeamAdmin }
            - { call: "POST /crm/leads", payload: { team_id: "${t}", source_id: "${src}", contact_name: "Warm Lead", contact_phone: "+15125550126", contact_email: "w@x.com", expected_close_price_cents: 30000000 }, as: TeamAdmin, captures: { lead: $.data.id } }
            - { call: "POST /crm/leads/${lead}/claim", payload: {}, as: Agent, as_user_id: "${c}" }
            - { call: "POST /crm/leads/${lead}/engagement-events", payload: { type: "SHOWING_ATTENDED", occurred_at: "2026-08-01T00:30:00Z" }, as: TeamAdmin }
          trigger:
            - { call: "POST /crm/nurture-enrollments", payload: { campaign_id: "${camp}", lead_id: "${lead}" }, as: TeamLeader, as_user_id: "${l}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_TEMPERATURE_MISMATCH (lead is WARM, campaign targets COLD) — and the enrollment is not created"

      - name: second_active_enrollment_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_LEAD_ALREADY_ENROLLED]"]
        distinguishing_aspect: "One active enrollment per lead across ALL campaigns: after enrolling in the COLD campaign, enrolling the same lead in a second COLD campaign fails with ERR_LEAD_ALREADY_ENROLLED."
        test_recipe:
          setup: ["Team with ACTIVE policy; auto_route source; ACTIVE agent C; LEADER L; two ACTIVE COLD campaigns; lead claimed (COLD) and enrolled in campaign 1"]
          setup_api_calls:
            - { call: "POST /crm/teams", payload: { name: "Alpha", market: "Austin", timezone: "America/Chicago" }, as: TeamAdmin, captures: { t: $.data.id, t_v: $.data.version } }
            - { call: "POST /crm/routing-policies", payload: { team_id: "${t}", mode: "ROUND_ROBIN" }, as: TeamAdmin, captures: { pol: $.data.id } }
            - { call: "POST /crm/routing-policies/${pol}/activate", payload: { expected_team_version: "${t_v}" }, as: TeamAdmin }
            - { call: "POST /crm/lead-sources", payload: { team_id: "${t}", name: "Zillow", type: "PORTAL", cost_per_lead_cents: 0, monthly_budget_cents: 1000000 }, as: TeamAdmin, captures: { src: $.data.id } }
            - { call: "POST /crm/agents", payload: { team_id: "${t}", display_name: "Agent C", license_number: "LIC-C", max_active_leads: 5 }, as: TeamAdmin, captures: { c: $.data.id } }
            - { call: "POST /crm/agents/${c}/activate", payload: {}, as: TeamAdmin }
            - { call: "POST /crm/agents", payload: { team_id: "${t}", display_name: "Leader L", license_number: "LIC-L", role_on_team: "LEADER", max_active_leads: 5 }, as: TeamAdmin, captures: { l: $.data.id } }
            - { call: "POST /crm/nurture-campaigns", payload: { team_id: "${t}", name: "Cold Drip A", temperature_target: "COLD", steps: [{ offset_days: 1, channel: "EMAIL" }] }, as: TeamAdmin, captures: { camp1: $.data.id } }
            - { call: "POST /crm/nurture-campaigns/${camp1}/activate", payload: {}, as: TeamAdmin }
            - { call: "POST /crm/nurture-campaigns", payload: { team_id: "${t}", name: "Cold Drip B", temperature_target: "COLD", steps: [{ offset_days: 2, channel: "SMS" }] }, as: TeamAdmin, captures: { camp2: $.data.id } }
            - { call: "POST /crm/nurture-campaigns/${camp2}/activate", payload: {}, as: TeamAdmin }
            - { call: "POST /crm/leads", payload: { team_id: "${t}", source_id: "${src}", contact_name: "Buyer", contact_phone: "+15125550127", contact_email: "b@x.com", expected_close_price_cents: 30000000 }, as: TeamAdmin, captures: { lead: $.data.id } }
            - { call: "POST /crm/leads/${lead}/claim", payload: {}, as: Agent, as_user_id: "${c}" }
            - { call: "POST /crm/nurture-enrollments", payload: { campaign_id: "${camp1}", lead_id: "${lead}" }, as: TeamLeader, as_user_id: "${l}", captures: { enr: $.data.id } }
          trigger:
            - { call: "POST /crm/nurture-enrollments", payload: { campaign_id: "${camp2}", lead_id: "${lead}" }, as: TeamLeader, as_user_id: "${l}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_LEAD_ALREADY_ENROLLED — the per-lead active-enrollment cap spans campaigns"
            - "NurtureEnrollment.${enr}.status remains ENROLLED"

