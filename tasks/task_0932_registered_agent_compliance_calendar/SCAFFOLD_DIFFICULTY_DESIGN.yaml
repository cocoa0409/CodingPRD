      - name: state_rule_effective_interval_must_progress_strictly_forward
        grounds:
          - validations[priority=19]
          - errors[ERR_EFFECTIVE_DATE_OVERLAP]
          - entities.StateRule.fields.effective_from
          - entities.StateRule.fields.effective_to
          - calculations.governing_state_rule_selection
        distinguishing_aspect: |
          StateRule versions occupy [effective_from, effective_to) on the resource
          state_code, and a colliding publication is refused rather than merged: a
          second DE row with the SAME effective_from is rejected with
          ERR_EFFECTIVE_DATE_OVERLAP, while a strictly later effective_from is accepted
          and truncates the incumbent by stamping its effective_to. The resource is
          StateRule and the arithmetic is forward-progress truncation, unlike the
          half-open occupancy collision on Registration in the sibling instance.
