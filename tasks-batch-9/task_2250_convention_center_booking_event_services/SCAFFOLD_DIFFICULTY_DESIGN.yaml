      - name: union_day_capacity_accepts_exact_fill_then_refuses_one_more_call
        grounds:
          - validations[priority=91]
          - errors.ERR_UNION_CREW_OVERCOMMITTED
          - calculations.union_crew_hours_committed
          - entities.UnionJurisdiction.fields.max_crew_hours_per_day
        distinguishing_aspect: |
          A different interval semantics from geometric occupancy: UnionJurisdiction capacity
          is an AGGREGATE SUM of billed crew-hours bucketed by work_date, so two calls whose
          clock hours overlap perfectly are legal as long as the day total fits. The gate
          compares with <=, so filling Teamsters Local 7 to exactly 12.0 crew-hours on
          2027-03-01 is accepted and the very next 4.0-hour call is refused. A pairwise
          interval-intersection test would wrongly reject the second call.
