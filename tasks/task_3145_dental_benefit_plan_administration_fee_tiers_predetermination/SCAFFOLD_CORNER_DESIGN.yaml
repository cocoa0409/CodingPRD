            - "error_id == ERR_RETROACTIVE_PREDETERMINATION"

      - name: claim_with_dependent_of_other_subscriber_returns_cross_reference_mismatch
        claim_type: violation_to_error
        grounds:
          - validations[priority=10]
          - errors.ERR_CROSS_REFERENCE_MISMATCH
        distinguishing_aspect: "dependent_id exists but belongs to a DIFFERENT subscriber — referential integrity across the aggregate boundary fails with 422 ERR_CROSS_REFERENCE_MISMATCH, not 404."
        test_recipe:
          setup:
            - "Standard stack plus a second subscriber with a dependent."
          setup_api_calls:
            - *c_clock
            - *c_plan
            - *c_plan_act
            - *c_prov
            - *c_fees
            - *c_fees_act
            - *c_sub
            - call: "POST /dental/subscribers"
              payload: { plan_id: "${plan_id}", member_id: "M-OTHER", full_name: "Olga Other", date_of_birth: "1981-01-01T00:00:00Z", effective_date: "2026-01-01T00:00:00Z", cob_priority: "PRIMARY" }
              as: PlanAdmin
              captures: { sub_b: $.data.id }
            - call: "POST /dental/subscribers/${sub_b}/dependents"
              payload: { full_name: "Kid Other", date_of_birth: "2015-01-01T00:00:00Z", relationship: "CHILD" }
              as: PlanAdmin
              captures: { dep_b: $.data.id }
          trigger:
            - call: "POST /dental/claims"
              payload: { subscriber_id: "${sub_id}", dependent_id: "${dep_b}", provider_id: "${provider_id}", service_date: "2026-02-01T00:00:00Z", received_date: "2026-02-02T00:00:00Z", lines: [{ line_number: 1, cdt_code: "D0120", tooth_number: "", submitted_amount_cents: 5000 }] }
              as: Provider
              as_user_id: "${provider_id}"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 422"
            - "error_id == ERR_CROSS_REFERENCE_MISMATCH"

      - name: subscriber_secondary_without_external_plan_id_returns_cob_config_invalid
        claim_type: violation_to_error
        grounds:
          - validations[priority=11]
          - errors.ERR_COB_CONFIG_INVALID
        distinguishing_aspect: "cob_priority=SECONDARY requires other_plan_external_id; the plan is ACTIVE so no state error masks the 422 ERR_COB_CONFIG_INVALID."
        test_recipe:
          setup:
            - "Standard stack plan, ACTIVE."
          setup_api_calls:
