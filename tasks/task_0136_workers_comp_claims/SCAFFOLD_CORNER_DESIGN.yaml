scaffold_corner_design:

  # =========================================================================
  - section: entities
    instances:
      - name: create_employer_returns_201_with_defaults
        claim_type: Creation
        grounds: [entities.Employer.fields.open_claim_count, entities.Employer.fields.current_emr]
        distinguishing_aspect: "POST /employers with legal_name+state_code returns 201; open_claim_count==0 and current_emr==1.00 defaulted."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /employers"
              payload: { legal_name: "New Co", state_code: "TX" }
              as: PlatformAdmin
              captures: { emp_id: $.data.id }
          assert:
            - "Response status == 201"
            - "Employer.${emp_id}.open_claim_count == 0"
            - "Employer.${emp_id}.current_emr == 1.00"
            - "$.data.id is a UUID with no type prefix; $.data.version == 1"

      - name: get_employer_not_found_returns_404
        claim_type: Not Found
        grounds: [entities.Employer]
        distinguishing_aspect: "GET /employers/{id} with a non-existent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /employers/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 404"
            - "$.data.error_id == ERR_NOT_FOUND"

      - name: create_worker_missing_required_field_returns_400
        claim_type: Required Fields
        grounds: [entities.Worker.fields.gross_wages_cents]
        distinguishing_aspect: "POST /workers omitting gross_wages_cents returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["An employer exists."]
          setup_api_calls:
            - call: "POST /employers"
              payload: { legal_name: "W Co", state_code: "CA" }
              as: PlatformAdmin
              captures: { emp_id: $.data.id }
          trigger:
            - call: "POST /workers"
              payload: { employer_id: "${emp_id}", full_name: "No Wage", weeks_worked: 52 }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 400"
            - "$.data.error_id == ERR_INVALID_REQUEST"

      - name: worker_aww_computed_input_ignored
        claim_type: Computed Fields
        grounds: [calculations.average_weekly_wage, entities.Worker.fields.average_weekly_wage_cents]
        distinguishing_aspect: "average_weekly_wage_cents is server-computed = round(gross_wages_cents/weeks_worked); a client-supplied value is ignored."
        test_recipe:
          setup: ["An employer exists."]
          setup_api_calls:
            - call: "POST /employers"
              payload: { legal_name: "AWW Co", state_code: "CA" }
              as: PlatformAdmin
              captures: { emp_id: $.data.id }
          trigger:
            - call: "POST /workers"
              payload: { employer_id: "${emp_id}", full_name: "Worker A", gross_wages_cents: 7800000, weeks_worked: 52 }
              as: PlatformAdmin
              captures: { wkr_a: $.data.id }
          assert:
            - "Worker.${wkr_a}.average_weekly_wage_cents == 150000 (7800000/52)"

      - name: wage_statement_is_immutable_no_version_field
        claim_type: Immutability
        grounds: [entities.WageStatement]
        distinguishing_aspect: "WageStatement has common_fields:false — its read carries id+created_at but no version field, and there is no update endpoint (it is superseded, not mutated)."
        test_recipe:
          setup: ["A claim with a wage statement exists."]
          setup_api_calls:
            - call: "POST /employers"
              payload: { legal_name: "Imm Co", state_code: "CA" }
              as: PlatformAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /policies"
              payload: { employer_id: "${emp_id}", policy_number: "C-IMM", manual_premium_cents: 5000000, effective_date: "2026-01-01T00:00:00Z", expiration_date: "2027-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /workers"
              payload: { employer_id: "${emp_id}", full_name: "Worker A", gross_wages_cents: 7800000, weeks_worked: 52 }
              as: PlatformAdmin
              captures: { wkr_a: $.data.id }
            - call: "POST /claims"
              payload: { policy_id: "${pol_id}", worker_id: "${wkr_a}", date_of_injury: "2026-02-01T00:00:00Z" }
              as: ClaimsAdjuster
              captures: { claim_a: $.data.id, claim_v0: $.data.version }
          trigger:
            - call: "POST /wage-statements"
              payload: { claim_id: "${claim_a}", average_weekly_wage_cents: 150000, expected_claim_version: "${claim_v0}" }
              as: ClaimsAdjuster
              captures: { ws_id: $.data.id }
          assert:
            - "WageStatement.${ws_id}.ttd_weekly_rate_cents == 100005 (computed at creation)"
            - "$.data.created_at is present; no version field is exposed on the WageStatement read"

      - name: policy_list_for_employer_returns_array
        claim_type: Listing
        grounds: [entities.Policy.fields.employer_id]
        distinguishing_aspect: "GET /employers/{id}/policies returns a paginated Policy[] (total_count, has_more present in meta)."
        test_recipe:
          setup: ["An employer with one policy exists."]
          setup_api_calls:
            - call: "POST /employers"
              payload: { legal_name: "List Co", state_code: "CA" }
              as: PlatformAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /policies"
              payload: { employer_id: "${emp_id}", policy_number: "C-LIST", manual_premium_cents: 5000000, effective_date: "2026-01-01T00:00:00Z", expiration_date: "2027-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { pol_id: $.data.id }
          trigger:
            - call: "GET /employers/${emp_id}/policies"
              payload: {}
              as: PlatformAdmin
          assert:
            - "Response status == 200; response_type == array; data contains exactly one Policy with id == ${pol_id}"
            - "meta/pagination reports total_count == 1 and has_more == false"

  # =========================================================================
  - section: state_machines
    instances:
      - name: deny_already_denied_claim_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Claim.REPORTED_to_DENIED]
        distinguishing_aspect: "A DENIED claim is terminal; a second deny returns ERR_INVALID_STATE with no side effects."
        test_recipe:
          setup: ["A DENIED claim exists."]
          setup_api_calls:
            - call: "POST /employers"
              payload: { legal_name: "Den Co", state_code: "CA" }
              as: PlatformAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /policies"
              payload: { employer_id: "${emp_id}", policy_number: "C-DEN", manual_premium_cents: 5000000, effective_date: "2026-01-01T00:00:00Z", expiration_date: "2027-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /workers"
              payload: { employer_id: "${emp_id}", full_name: "Worker A", gross_wages_cents: 7800000, weeks_worked: 52 }
              as: PlatformAdmin
              captures: { wkr_a: $.data.id }
            - call: "POST /claims"
              payload: { policy_id: "${pol_id}", worker_id: "${wkr_a}", date_of_injury: "2026-02-01T00:00:00Z" }
              as: ClaimsAdjuster
              captures: { claim_a: $.data.id }
            - call: "POST /claims/${claim_a}/deny"
              payload: { denial_reason: "first" }
              as: ClaimsAdjuster
          trigger:
            - call: "POST /claims/${claim_a}/deny"
              payload: { denial_reason: "second" }
              as: ClaimsAdjuster
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 409; $.data.error_id == ERR_INVALID_STATE"
            - "Claim.${claim_a}.denial_reason remains 'first'"

      - name: new_claim_starts_in_reported
        claim_type: Initial State
        grounds: [state_machines.Claim.initial_state]
        distinguishing_aspect: "A freshly created claim has status==REPORTED and claim_class==UNCLASSIFIED."
        test_recipe:
          setup: ["An employer, policy, worker exist."]
          setup_api_calls:
            - call: "POST /employers"
              payload: { legal_name: "Init Co", state_code: "CA" }
              as: PlatformAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /policies"
              payload: { employer_id: "${emp_id}", policy_number: "C-INI", manual_premium_cents: 5000000, effective_date: "2026-01-01T00:00:00Z", expiration_date: "2027-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /workers"
              payload: { employer_id: "${emp_id}", full_name: "Worker A", gross_wages_cents: 7800000, weeks_worked: 52 }
              as: PlatformAdmin
              captures: { wkr_a: $.data.id }
          trigger:
            - call: "POST /claims"
              payload: { policy_id: "${pol_id}", worker_id: "${wkr_a}", date_of_injury: "2026-02-01T00:00:00Z" }
              as: ClaimsAdjuster
              captures: { claim_a: $.data.id }
          assert:
            - "Claim.${claim_a}.status == REPORTED"
            - "Claim.${claim_a}.claim_class == UNCLASSIFIED"

      - name: medical_only_classification_on_zero_disability_accept
        claim_type: Side Effect Execution
        grounds: [state_machines.Claim.REPORTED_to_MEDICAL_ONLY, entities.Claim.fields.claim_class]
        distinguishing_aspect: "Accepting with disability_days==0 sets claim_class=MEDICAL_ONLY and increments Employer.open_claim_count to 1."
        test_recipe:
          setup: ["A REPORTED claim with an ACKNOWLEDGED FROI; disability_days==0."]
          setup_api_calls:
            - call: "POST /employers"
              payload: { legal_name: "Mo Co", state_code: "CA" }
              as: PlatformAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /policies"
              payload: { employer_id: "${emp_id}", policy_number: "C-MO", manual_premium_cents: 5000000, effective_date: "2026-01-01T00:00:00Z", expiration_date: "2027-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /workers"
              payload: { employer_id: "${emp_id}", full_name: "Worker A", gross_wages_cents: 7800000, weeks_worked: 52 }
              as: PlatformAdmin
              captures: { wkr_a: $.data.id }
            - call: "POST /claims"
              payload: { policy_id: "${pol_id}", worker_id: "${wkr_a}", date_of_injury: "2026-02-01T00:00:00Z" }
              as: ClaimsAdjuster
              captures: { claim_a: $.data.id }
            - call: "POST /injury-reports"
              payload: { claim_id: "${claim_a}", report_kind: "FROI", maintenance_type_code: "00" }
              as: ClaimsAdjuster
              captures: { froi_a: $.data.id }
            - call: "POST /injury-reports/${froi_a}/transmit"
              payload: {}
              as: ClaimsAdjuster
            - call: "POST /injury-reports/${froi_a}/ack"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /claims/${claim_a}/accept"
              payload: {}
              as: ClaimsAdjuster
          assert:
            - "Claim.${claim_a}.status == MEDICAL_ONLY; claim_class == MEDICAL_ONLY"
            - "Employer.${emp_id}.open_claim_count == 1"

      - name: close_mmi_blocked_by_outstanding_indemnity_reserve
        claim_type: Precondition Enforcement
        grounds: [state_machines.Claim.MMI_to_CLOSED, entities.Reserve.fields.indemnity_reserve_cents]
        distinguishing_aspect: "Closing an MMI claim whose Reserve.indemnity_reserve_cents > 0 is rejected with ERR_INVALID_STATE (reserve must be drawn to 0 first)."
        test_recipe:
          setup: ["An MMI claim whose Reserve still has indemnity_reserve_cents > 0."]
          setup_api_calls:
            - call: "POST /employers"
              payload: { legal_name: "Cl Co", state_code: "CA" }
              as: PlatformAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /policies"
              payload: { employer_id: "${emp_id}", policy_number: "C-CL", manual_premium_cents: 5000000, effective_date: "2026-01-01T00:00:00Z", expiration_date: "2027-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /workers"
              payload: { employer_id: "${emp_id}", full_name: "Worker A", gross_wages_cents: 7800000, weeks_worked: 52 }
              as: PlatformAdmin
              captures: { wkr_a: $.data.id }
            - call: "POST /claims"
              payload: { policy_id: "${pol_id}", worker_id: "${wkr_a}", date_of_injury: "2026-02-01T00:00:00Z", disability_days: 10 }
              as: ClaimsAdjuster
              captures: { claim_a: $.data.id, claim_v0: $.data.version }
            - call: "POST /injury-reports"
              payload: { claim_id: "${claim_a}", report_kind: "FROI", maintenance_type_code: "00" }
              as: ClaimsAdjuster
              captures: { froi_a: $.data.id }
            - call: "POST /injury-reports/${froi_a}/transmit"
              payload: {}
              as: ClaimsAdjuster
            - call: "POST /injury-reports/${froi_a}/ack"
              payload: {}
              as: PlatformAdmin
            - call: "POST /wage-statements"
              payload: { claim_id: "${claim_a}", average_weekly_wage_cents: 150000, expected_claim_version: "${claim_v0}" }
              as: ClaimsAdjuster
            - call: "POST /reserves"
              payload: { claim_id: "${claim_a}", severity_tier: "MODERATE", projected_weeks: 12 }
              as: ClaimsAdjuster
            - call: "POST /claims/${claim_a}/accept"
              payload: { disability_days: 10 }
              as: ClaimsAdjuster
            - call: "POST /impairment-ratings"
              payload: { claim_id: "${claim_a}", whole_body_pct: 15, rater_role: "IME" }
              as: MedicalReviewer
              captures: { rate_a: $.data.id }
            - call: "POST /impairment-ratings/${rate_a}/finalize"
              payload: {}
              as: MedicalReviewer
          trigger:
            - call: "POST /claims/${claim_a}/close"
              payload: {}
              as: ClaimsAdjuster
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 409; $.data.error_id == ERR_INVALID_STATE"
            - "Claim.${claim_a}.status remains MMI"

      - name: sroi_transmit_before_froi_ack_returns_froi_not_acknowledged
        claim_type: guarded transitions
        grounds:
          - state_machines.InjuryReport.DRAFT_to_TRANSMITTED
          - validations[priority=6]
        distinguishing_aspect: "Transmitting a SROI when the claim's FROI is not yet ACKNOWLEDGED returns ERR_FROI_NOT_ACKNOWLEDGED (409)."
        test_recipe:
          setup: ["A claim with a FROI only TRANSMITTED (not acked) and a DRAFT SROI."]
          setup_api_calls:
            - call: "POST /employers"
              payload: { legal_name: "Sr Co", state_code: "CA" }
              as: PlatformAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /policies"
              payload: { employer_id: "${emp_id}", policy_number: "C-SR", manual_premium_cents: 5000000, effective_date: "2026-01-01T00:00:00Z", expiration_date: "2027-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /workers"
              payload: { employer_id: "${emp_id}", full_name: "Worker A", gross_wages_cents: 7800000, weeks_worked: 52 }
              as: PlatformAdmin
              captures: { wkr_a: $.data.id }
            - call: "POST /claims"
              payload: { policy_id: "${pol_id}", worker_id: "${wkr_a}", date_of_injury: "2026-02-01T00:00:00Z" }
              as: ClaimsAdjuster
              captures: { claim_a: $.data.id }
            - call: "POST /injury-reports"
              payload: { claim_id: "${claim_a}", report_kind: "FROI", maintenance_type_code: "00" }
              as: ClaimsAdjuster
              captures: { froi_a: $.data.id }
            - call: "POST /injury-reports/${froi_a}/transmit"
              payload: {}
              as: ClaimsAdjuster
            - call: "POST /injury-reports"
              payload: { claim_id: "${claim_a}", report_kind: "SROI", maintenance_type_code: "IP" }
              as: ClaimsAdjuster
              captures: { sroi_a: $.data.id }
          trigger:
            - call: "POST /injury-reports/${sroi_a}/transmit"
              payload: {}
              as: ClaimsAdjuster
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 409; $.data.error_id == ERR_FROI_NOT_ACKNOWLEDGED"
            - "InjuryReport.${sroi_a}.edi_status remains DRAFT"

      - name: ime_no_show_before_window_end_returns_invalid_state
        claim_type: Precondition Enforcement
        grounds: [state_machines.IMEOrder.SCHEDULED_to_NO_SHOW, entities.IMEOrder.fields.scheduled_end]
        distinguishing_aspect: "Marking an IME NO_SHOW before now >= scheduled_end is rejected with ERR_INVALID_STATE."
        test_recipe:
          setup: ["A SCHEDULED IME [2026-03-10T10:00:00Z,2026-03-10T11:00:00Z); clock at 2026-03-10T10:30:00Z."]
          setup_api_calls:
            - call: "POST /employers"
              payload: { legal_name: "Ns Co", state_code: "CA" }
              as: PlatformAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /policies"
              payload: { employer_id: "${emp_id}", policy_number: "C-NS", manual_premium_cents: 5000000, effective_date: "2026-01-01T00:00:00Z", expiration_date: "2027-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /workers"
              payload: { employer_id: "${emp_id}", full_name: "Worker A", gross_wages_cents: 7800000, weeks_worked: 52 }
              as: PlatformAdmin
              captures: { wkr_a: $.data.id }
            - call: "POST /claims"
              payload: { policy_id: "${pol_id}", worker_id: "${wkr_a}", date_of_injury: "2026-02-01T00:00:00Z" }
              as: ClaimsAdjuster
              captures: { claim_a: $.data.id }
            - call: "POST /ime-orders"
              payload: { claim_id: "${claim_a}", scheduled_start: "2026-03-10T10:00:00Z", scheduled_end: "2026-03-10T11:00:00Z", examiner_name: "Dr A" }
              as: ClaimsAdjuster
              captures: { ime_a: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-10T10:30:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /ime-orders/${ime_a}/no-show"
              payload: {}
              as: MedicalReviewer
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 409; $.data.error_id == ERR_INVALID_STATE"
            - "IMEOrder.${ime_a}.status remains SCHEDULED"

      - name: rtw_offer_expires_when_clock_passes_start
        claim_type: cyclic
        grounds: [state_machines.ReturnToWorkOffer.OFFERED_to_EXPIRED, entities.ReturnToWorkOffer.fields.start_date]
        distinguishing_aspect: "An OFFERED RTW offer whose start_date has passed (per the test clock) reads as EXPIRED and can no longer be accepted."
        test_recipe:
          setup: ["A LOST_TIME claim with an OFFERED RTW offer start_date 2026-03-01; clock advanced to 2026-03-05."]
          setup_api_calls:
            - call: "POST /employers"
              payload: { legal_name: "Exp Co", state_code: "CA" }
              as: PlatformAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /policies"
              payload: { employer_id: "${emp_id}", policy_number: "C-EXP", manual_premium_cents: 5000000, effective_date: "2026-01-01T00:00:00Z", expiration_date: "2027-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /workers"
              payload: { employer_id: "${emp_id}", full_name: "Worker A", gross_wages_cents: 7800000, weeks_worked: 52 }
              as: PlatformAdmin
              captures: { wkr_a: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /claims"
              payload: { policy_id: "${pol_id}", worker_id: "${wkr_a}", date_of_injury: "2026-02-01T00:00:00Z", disability_days: 10 }
              as: ClaimsAdjuster
              captures: { claim_a: $.data.id }
            - call: "POST /injury-reports"
              payload: { claim_id: "${claim_a}", report_kind: "FROI", maintenance_type_code: "00" }
              as: ClaimsAdjuster
              captures: { froi_a: $.data.id }
            - call: "POST /injury-reports/${froi_a}/transmit"
              payload: {}
              as: ClaimsAdjuster
            - call: "POST /injury-reports/${froi_a}/ack"
              payload: {}
              as: PlatformAdmin
            - call: "POST /reserves"
              payload: { claim_id: "${claim_a}", severity_tier: "MODERATE", projected_weeks: 12 }
              as: ClaimsAdjuster
            - call: "POST /claims/${claim_a}/accept"
              payload: { disability_days: 10 }
              as: ClaimsAdjuster
            - call: "POST /rtw-offers"
              payload: { claim_id: "${claim_a}", light_duty_weekly_cents: 90000, start_date: "2026-03-01T00:00:00Z", end_date: "2026-03-20T00:00:00Z" }
              as: Employer
              as_user_id: "${emp_id}"
              captures: { rtw_a: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-05T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /rtw-offers/${rtw_a}/accept"
              payload: {}
              as: Employer
              as_user_id: "${emp_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 409; $.data.error_id == ERR_INVALID_STATE (offer is EXPIRED, not OFFERED, once now >= start_date)"
            - "GET /rtw-offers/${rtw_a} reports status == EXPIRED"

  # =========================================================================
  - section: calculations
    instances:
      - name: ttd_rate_capped_at_saww_for_high_earner
        claim_type: Constants Applied
        grounds: [calculations.ttd_weekly_rate]
        distinguishing_aspect: "A high earner (AWW 250000c) has raw rate 166675c capped to SAWW_CENTS=120000."
        test_recipe:
          setup: ["A claim for a high earner (gross 13000000 over 52 -> AWW 250000)."]
          setup_api_calls:
            - call: "POST /employers"
              payload: { legal_name: "Cap Co", state_code: "CA" }
              as: PlatformAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /policies"
              payload: { employer_id: "${emp_id}", policy_number: "C-CAP", manual_premium_cents: 5000000, effective_date: "2026-01-01T00:00:00Z", expiration_date: "2027-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /workers"
              payload: { employer_id: "${emp_id}", full_name: "High Earner", gross_wages_cents: 13000000, weeks_worked: 52 }
              as: PlatformAdmin
              captures: { wkr_b: $.data.id }
            - call: "POST /claims"
              payload: { policy_id: "${pol_id}", worker_id: "${wkr_b}", date_of_injury: "2026-02-01T00:00:00Z" }
              as: ClaimsAdjuster
              captures: { claim_b: $.data.id, claim_v0: $.data.version }
          trigger:
            - call: "POST /wage-statements"
              payload: { claim_id: "${claim_b}", average_weekly_wage_cents: 250000, expected_claim_version: "${claim_v0}" }
              as: ClaimsAdjuster
              captures: { ws_b: $.data.id }
          assert:
            - "WageStatement.${ws_b}.ttd_weekly_rate_cents == 120000 (capped at SAWW_CENTS)"

      - name: ttd_rate_floored_for_low_earner
        claim_type: Constants Applied
        grounds: [calculations.ttd_weekly_rate]
