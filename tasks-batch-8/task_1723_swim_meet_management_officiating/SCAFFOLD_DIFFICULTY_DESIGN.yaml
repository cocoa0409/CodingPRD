  # Rule 8 — resource_temporal_overlap (different interval semantics, different resources)
  - rule_id: resource_temporal_overlap
    instances:
      - name: official_half_open_adjacency_vs_overlap
        grounds:
          - validations[priority=13]
          - entities.OfficialAssignment.fields.status
          - entities.SwimEvent.fields.scheduled_start_minute
        distinguishing_aspect: |
          Resource Official, half-open interval semantics: an assignment ending exactly when another
          begins ([540,570) then [570,600)) is NOT a conflict, while [555,585) overlapping the
          confirmed [540,570) is rejected with ERR_OFFICIAL_ASSIGNMENT_CONFLICT — adjacency allowed.
        test_recipe:
          setup:
            - "Official offR (REFEREE) CONFIRMED on event A [540,570) of session 2026-08-15; events B [570,600) adjacent and C [555,585) overlapping exist"
          setup_api_calls:
            - { call: "POST /meets", payload: { meet_name: "OV1", course: "SCY", start_date: "2026-08-15", entry_deadline_utc: "2026-08-10T00:00:00Z" }, as: MeetDirector, captures: { meet_id: "$.data.id" } }
            - { call: "POST /events", payload: { meet_id: "${meet_id}", event_number: 1, gender: "M", age_group: "ELEVEN_TWELVE", stroke: "FREESTYLE", distance_meters: 50, is_relay: false, session_date: "2026-08-15", scheduled_start_minute: 540, scheduled_end_minute: 570 }, as: MeetDirector, captures: { ev_a: "$.data.id" } }
            - { call: "POST /events", payload: { meet_id: "${meet_id}", event_number: 2, gender: "M", age_group: "ELEVEN_TWELVE", stroke: "BACKSTROKE", distance_meters: 50, is_relay: false, session_date: "2026-08-15", scheduled_start_minute: 570, scheduled_end_minute: 600 }, as: MeetDirector, captures: { ev_b: "$.data.id" } }
            - { call: "POST /events", payload: { meet_id: "${meet_id}", event_number: 3, gender: "F", age_group: "ELEVEN_TWELVE", stroke: "FREESTYLE", distance_meters: 50, is_relay: false, session_date: "2026-08-15", scheduled_start_minute: 555, scheduled_end_minute: 585 }, as: MeetDirector, captures: { ev_c: "$.data.id" } }
            - { call: "POST /officials", payload: { meet_id: "${meet_id}", full_name: "Ref R", lsc_membership_id: "LSC-R1", certifications: ["REFEREE"], certification_expires_on: "2027-01-01" }, as: MeetDirector, captures: { off_r: "$.data.id" } }
            - { call: "POST /events/${ev_a}/official-assignments", payload: { official_id: "${off_r}", role_on_deck: "REFEREE" }, as: MeetDirector, captures: { oa_a: "$.data.id" } }
            - { call: "POST /official-assignments/${oa_a}/confirm", payload: {}, as: MeetReferee, as_user_id: "${off_r}" }
          trigger:
            - { call: "POST /events/${ev_b}/official-assignments", payload: { official_id: "${off_r}", role_on_deck: "REFEREE" }, as: MeetDirector, captures: { oa_b: "$.data.id" } }
            - { call: "POST /official-assignments/${oa_b}/confirm", payload: {}, as: MeetReferee, as_user_id: "${off_r}", captures: { oa_b_st: "$.data.status" } }
            - { call: "POST /events/${ev_c}/official-assignments", payload: { official_id: "${off_r}", role_on_deck: "REFEREE" }, as: MeetDirector, captures: { err: "$.data.error_id" } }
          assert:
            - "${oa_b_st} == CONFIRMED  # end == start adjacency is allowed (half-open intervals)"
            - "${err} == ERR_OFFICIAL_ASSIGNMENT_CONFLICT  # true overlap rejected"
      - name: swimmer_recovery_buffer_vs_back_to_back
        grounds:
          - validations[priority=12]
          - entities.Meet.fields.min_recovery_minutes
          - entities.SwimEvent.fields.session_date
        distinguishing_aspect: |
          Resource Swimmer, buffered-interval semantics (different from the official half-open
          adjacency rule): back-to-back events (gap 0, which adjacency semantics would allow) are
          rejected with ERR_RECOVERY_WINDOW_VIOLATION, while a gap of exactly min_recovery_minutes
          (20 == 20) is accepted.
        test_recipe:
          setup:
            - "Meet ENTRIES_OPEN; swimmer already entered in event 1 [540,570); events 2 [570,590) (gap 0) and 3 [590,610) (gap 20) exist on the same session_date"
          setup_api_calls:
            - { call: "POST /meets", payload: { meet_name: "OV2", course: "SCY", start_date: "2026-08-15", entry_deadline_utc: "2026-08-10T00:00:00Z", min_recovery_minutes: 20 }, as: MeetDirector, captures: { meet_id: "$.data.id" } }
            - { call: "POST /meets/${meet_id}/open-entries", payload: {}, as: MeetDirector }
            - { call: "POST /teams", payload: { meet_id: "${meet_id}", team_code: "AAA", team_name: "Aquatics" }, as: MeetDirector, captures: { team_id: "$.data.id" } }
            - { call: "POST /swimmers", payload: { team_id: "${team_id}", full_name: "Sw A", birth_date: "2014-03-10", gender: "M" }, as: TeamCoach, as_user_id: "${team_id}", captures: { sw_a: "$.data.id" } }
            - { call: "POST /events", payload: { meet_id: "${meet_id}", event_number: 1, gender: "M", age_group: "ELEVEN_TWELVE", stroke: "FREESTYLE", distance_meters: 50, is_relay: false, session_date: "2026-08-15", scheduled_start_minute: 540, scheduled_end_minute: 570 }, as: MeetDirector, captures: { ev1: "$.data.id" } }
            - { call: "POST /events", payload: { meet_id: "${meet_id}", event_number: 2, gender: "M", age_group: "ELEVEN_TWELVE", stroke: "BACKSTROKE", distance_meters: 50, is_relay: false, session_date: "2026-08-15", scheduled_start_minute: 570, scheduled_end_minute: 590 }, as: MeetDirector, captures: { ev2: "$.data.id" } }
            - { call: "POST /events", payload: { meet_id: "${meet_id}", event_number: 3, gender: "M", age_group: "ELEVEN_TWELVE", stroke: "BREASTSTROKE", distance_meters: 50, is_relay: false, session_date: "2026-08-15", scheduled_start_minute: 590, scheduled_end_minute: 610 }, as: MeetDirector, captures: { ev3: "$.data.id" } }
            - { call: "POST /entries", payload: { event_id: "${ev1}", swimmer_id: "${sw_a}", seed_time_cs: 2900 }, as: TeamCoach, as_user_id: "${team_id}", captures: { en1: "$.data.id" } }
          trigger:
            - { call: "POST /entries", payload: { event_id: "${ev2}", swimmer_id: "${sw_a}", seed_time_cs: 3100 }, as: TeamCoach, as_user_id: "${team_id}", captures: { err: "$.data.error_id" } }
            - { call: "POST /entries", payload: { event_id: "${ev3}", swimmer_id: "${sw_a}", seed_time_cs: 3300 }, as: TeamCoach, as_user_id: "${team_id}", captures: { en3: "$.data.id", en3_st: "$.data.status" } }
          assert:
            - "${err} == ERR_RECOVERY_WINDOW_VIOLATION  # gap 0 < 20 despite adjacency"
            - "${en3_st} == ENTERED  # gap exactly 20 meets the buffer (>=)"

  # Rule 9 — compensating_invariant (different conserved quantities)
  - rule_id: compensating_invariant
    instances:
      - name: scratch_unscratch_lane_occupancy_invariant
        grounds:
          - state_machines.EventEntry.SEEDED_to_SCRATCHED
          - state_machines.EventEntry.SCRATCHED_to_SEEDED
          - entities.LaneAssignment.fields.lane_status
          - entities.Team.fields.active_entry_count
        distinguishing_aspect: |
          Conserved quantity: per-event ACTIVE lane occupancy AND lane identity. The forward action
          (scratch: count 2 -> 1, lane VOIDED) paired with its compensating action (unscratch:
          count 1 -> 2, the SAME lane_number re-activated) leaves occupancy and lane assignment
          bit-identical — no drift in the conserved quantity.
        test_recipe:
          setup:
            - "Meet SEEDED; two entries of one team seeded into one heat; team active_entry_count == 2"
          setup_api_calls:
            - { call: "POST /meets", payload: { meet_name: "CI1", course: "SCY", start_date: "2026-08-15", entry_deadline_utc: "2026-08-10T00:00:00Z" }, as: MeetDirector, captures: { meet_id: "$.data.id" } }
            - { call: "POST /meets/${meet_id}/open-entries", payload: {}, as: MeetDirector }
            - { call: "POST /teams", payload: { meet_id: "${meet_id}", team_code: "AAA", team_name: "Aquatics" }, as: MeetDirector, captures: { team_id: "$.data.id" } }
            - { call: "POST /swimmers", payload: { team_id: "${team_id}", full_name: "Sw A", birth_date: "2014-03-10", gender: "M" }, as: TeamCoach, as_user_id: "${team_id}", captures: { sw_a: "$.data.id" } }
            - { call: "POST /swimmers", payload: { team_id: "${team_id}", full_name: "Sw B", birth_date: "2014-04-11", gender: "M" }, as: TeamCoach, as_user_id: "${team_id}", captures: { sw_b: "$.data.id" } }
            - { call: "POST /events", payload: { meet_id: "${meet_id}", event_number: 1, gender: "M", age_group: "ELEVEN_TWELVE", stroke: "FREESTYLE", distance_meters: 50, is_relay: false, qualifying_time_cs: 3000, session_date: "2026-08-15", scheduled_start_minute: 540, scheduled_end_minute: 570 }, as: MeetDirector, captures: { ev1: "$.data.id" } }
            - { call: "POST /entries", payload: { event_id: "${ev1}", swimmer_id: "${sw_a}", seed_time_cs: 2900 }, as: TeamCoach, as_user_id: "${team_id}", captures: { en_a: "$.data.id" } }
            - { call: "POST /entries", payload: { event_id: "${ev1}", swimmer_id: "${sw_b}", seed_time_cs: 2910 }, as: TeamCoach, as_user_id: "${team_id}", captures: { en_b: "$.data.id" } }
            - { call: "POST /entries/${en_a}/verify", payload: {}, as: MeetDirector }
            - { call: "POST /entries/${en_b}/verify", payload: {}, as: MeetDirector }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-11T00:00:00Z" }, as: Any }
            - { call: "POST /meets/${meet_id}/close-entries", payload: {}, as: MeetDirector, captures: { meet_v: "$.data.version" } }
            - { call: "POST /meets/${meet_id}/seed", payload: { expected_meet_version: "${meet_v}" }, as: MeetDirector }
            - { call: "GET /lane-assignments", payload: { entry_id: "${en_b}" }, as: Any, captures: { lane_b: "$.data[0].id", lane_no_before: "$.data[0].lane_number" } }
          trigger:
            - { call: "POST /entries/${en_b}/scratch", payload: {}, as: TeamCoach, as_user_id: "${team_id}" }
            - { call: "GET /lane-assignments", payload: { event_id: "${ev1}" }, as: Any, captures: { lanes_mid: "$.data" } }
            - { call: "POST /entries/${en_b}/unscratch", payload: {}, as: TeamCoach, as_user_id: "${team_id}", captures: { en_b_st: "$.data.status" } }
            - { call: "GET /lane-assignments/${lane_b}", payload: {}, as: Any, captures: { lane_st_after: "$.data.lane_status", lane_no_after: "$.data.lane_number" } }
            - { call: "GET /teams/${team_id}", payload: {}, as: Any, captures: { cnt_after: "$.data.active_entry_count" } }
          assert:
            - "exactly 1 ACTIVE lane remains in event ${ev1} after scratch (count 2 -> 1)"
            - "${en_b_st} == SEEDED"
            - "${lane_st_after} == ACTIVE"
            - "${lane_no_after} == ${lane_no_before}  # same physical lane restored, not a new one"
            - "${cnt_after} == 2  # compensating round trip conserves the counters exactly"
      - name: complete_reopen_recomplete_points_invariant
        grounds:
          - state_machines.SwimEvent.IN_PROGRESS_to_COMPLETED
          - state_machines.SwimEvent.COMPLETED_to_IN_PROGRESS
          - calculations.team_points_rollup
          - entities.Team.fields.provisional_points
        distinguishing_aspect: |
          Conserved quantity: Team.provisional_points (a points sum, different quantity than lane
          occupancy). complete -> reopen -> complete with unchanged reconciled times reproduces
          9.00 -> 0.00 -> 9.00 exactly; the reopen compensation fully withdraws the points the
          forward action distributed.
        test_recipe:
          setup:
