  - rule_id: resource_temporal_overlap
    instances:

      - name: registration_coverage_half_open_adjacency_allowed_overlap_rejected
        grounds:
          - validations[priority=22]
          - entities.StateRegistration.fields.coverage_start
          - entities.StateRegistration.fields.coverage_end
          - validations[priority=20]
        overlap_semantics:
          interval_kind: "half-open [coverage_start, coverage_end)"
          scope_key: "(organization_id, state_code) over filings with status IN {SUBMITTED, REGISTERED, DELINQUENT, CEASED}"
          adjacency: "allowed — new.coverage_start == existing.coverage_end is accepted"
        distinguishing_aspect: |
          The incumbent REGISTERED filing covers [2025-07-01, 2026-07-01). A renewal starting
          exactly on 2026-07-01 is accepted because the interval is half-open, while a filing
          starting one day earlier on 2026-06-30 is rejected. The rejected attempt uses an unused
          fiscal_year (2029), so the duplicate-filing rule at priority 27 cannot account for the
          409 and only the temporal rule can. An implementation using closed intervals rejects
          the legitimate renewal.
        test_recipe:
          setup:
            - "StateProfile CA and an Organization with a REGISTERED CA fiscal_year 2026 filing covering [2025-07-01, 2026-07-01)."
          setup_api_calls:
            - call: "POST /state-profiles"
              payload: { state_code: "CA", registration_required: true, renewal_due_rule: "FYE_PLUS_4M_15D", assurance_basis: "GROSS_REVENUE", review_threshold_cents: 20000000, audit_threshold_cents: 200000000, online_presence_counts: true, base_filing_fee_cents: 2500, online_surcharge_cents: 1000, per_contract_fee_cents: 1500, filing_fee_cap_cents: 30000 }
              as: SystemAdmin
            - call: "POST /organizations"
              payload: { legal_name: "Harbor Light Foundation", ein: "123456789", domicile_state_code: "CA", fiscal_year_end_month: 6, has_online_donation_page: true }
              as: ComplianceOfficer
              captures: { org_id: $.data.id, org_v: $.data.version }
            - call: "POST /financial-statements"
              payload: { organization_id: "${org_id}", fiscal_year: 2026, total_revenue_cents: 26000000, contributions_cents: 20000000, program_expense_cents: 18000000, fundraising_expense_cents: 4000000, management_expense_cents: 2000000, assurance_level: "REVIEW", expected_organization_version: "${org_v}" }
              as: ComplianceOfficer
              captures: { fs_id: $.data.id }
            - call: "POST /officer-disclosures"
              payload: { organization_id: "${org_id}", officer_name: "Dana Reyes", title: "PRESIDENT", is_certifying_officer: true }
              as: ComplianceOfficer
              captures: { cert_id: $.data.id }
            - call: "POST /officer-disclosures"
              payload: { organization_id: "${org_id}", officer_name: "Sam Okoye", title: "SECRETARY" }
              as: ComplianceOfficer
              captures: { prep_id: $.data.id }
            - call: "POST /state-registrations"
              payload: { organization_id: "${org_id}", state_code: "CA", registration_type: "INITIAL", fiscal_year: 2026, coverage_start: "2025-07-01T00:00:00Z", coverage_end: "2026-07-01T00:00:00Z", financial_statement_id: "${fs_id}" }
              as: ComplianceOfficer
              captures: { reg_id: $.data.id }
            - call: "POST /registration-documents"
              payload: { registration_id: "${reg_id}", doc_type: "GOVERNING_DOCUMENT", prepared_by_officer_id: "${prep_id}", page_count: 12 }
              as: ComplianceOfficer
            - call: "POST /registration-documents"
              payload: { registration_id: "${reg_id}", doc_type: "FINANCIAL_STATEMENT", prepared_by_officer_id: "${prep_id}", page_count: 8 }
              as: ComplianceOfficer
            - call: "POST /registration-documents"
              payload: { registration_id: "${reg_id}", doc_type: "REVIEW_REPORT", prepared_by_officer_id: "${prep_id}", page_count: 4 }
              as: ComplianceOfficer
            - call: "POST /state-registrations/${reg_id}/submit"
              payload: { certification_note: "Certified." }
              as: CertifyingOfficer
              as_user_id: "${cert_id}"
            - call: "POST /state-registrations/${reg_id}/review"
              payload: { decision: "APPROVE" }
              as: StateRegulator
          trigger:
            - call: "POST /state-registrations"
              payload: { organization_id: "${org_id}", state_code: "CA", registration_type: "RENEWAL", fiscal_year: 2027, coverage_start: "2026-07-01T00:00:00Z", coverage_end: "2027-07-01T00:00:00Z", financial_statement_id: "${fs_id}", supersedes_registration_id: "${reg_id}" }
              as: ComplianceOfficer
              captures: { abut_reg_id: $.data.id }
            - call: "POST /state-registrations"
              payload: { organization_id: "${org_id}", state_code: "CA", registration_type: "RENEWAL", fiscal_year: 2029, coverage_start: "2026-06-30T00:00:00Z", coverage_end: "2027-06-30T00:00:00Z", financial_statement_id: "${fs_id}" }
              as: ComplianceOfficer
          assert:
            - "responses[0].http_status == 201"
            - "StateRegistration.${abut_reg_id}.status == DRAFT"
            - "StateRegistration.${abut_reg_id}.coverage_start == 2026-07-01T00:00:00Z"
            - "StateRegistration.${abut_reg_id}.supersedes_registration_id == ${reg_id}"
            - "responses[1].http_status == 409"
            - "responses[1].error_id == ERR_COVERAGE_PERIOD_OVERLAP"
            - "StateRegistration.${reg_id}.status == REGISTERED"
            - "Organization.${org_id}.registered_state_count == 1"

      - name: promotion_window_closed_interval_plus_buffer_day_boundary
        grounds:
          - validations[priority=23]
          - entities.StateProfile.fields.coventure_buffer_days
          - entities.CoventurePromotion.fields.promo_start
          - entities.CoventurePromotion.fields.promo_end
        overlap_semantics:
          interval_kind: "closed [promo_start, promo_end] inflated by StateProfile.coventure_buffer_days on both sides"
          scope_key: "(coventurer_id, shared state_code) over promotions with status IN {DRAFT, FILED, ACTIVE}"
          adjacency: "forbidden — the gap must be strictly greater than coventure_buffer_days, so a start on existing.promo_end + 7 is still a conflict"
        distinguishing_aspect: |
          With coventure_buffer_days 7 and an existing window ending 2026-09-30, a promotion
          starting 2026-10-07 is rejected and one starting 2026-10-08 is accepted: the buffered
          comparison is inclusive, unlike the half-open registration coverage rule in the other
          instance of this rule, where the abutting value is the accepted one. The incumbent is
          only DRAFT, so an implementation that considers only FILED or ACTIVE promotions accepts
          both attempts.
        test_recipe:
          setup:
            - "StateProfile CA with coventure_filing_required true and coventure_buffer_days 7."
            - "An Organization and a COMMERCIAL_COVENTURER."
            - "A DRAFT CA promotion for the closed window [2026-09-01, 2026-09-30]."
          setup_api_calls:
            - call: "POST /state-profiles"
              payload: { state_code: "CA", registration_required: true, renewal_due_rule: "FYE_PLUS_4M_15D", assurance_basis: "GROSS_REVENUE", review_threshold_cents: 20000000, audit_threshold_cents: 200000000, coventure_filing_required: true, coventure_buffer_days: 7, fundraiser_bond_minimum_cents: 2500000 }
              as: SystemAdmin
            - call: "POST /organizations"
              payload: { legal_name: "Harbor Light Foundation", ein: "123456789", domicile_state_code: "CA", fiscal_year_end_month: 6, has_online_donation_page: true }
              as: ComplianceOfficer
              captures: { org_id: $.data.id }
            - call: "POST /professional-fundraisers"
              payload: { legal_name: "BrightMart Retail Co", fundraiser_type: "COMMERCIAL_COVENTURER", bond_amount_cents: 2500000, bond_expires_at: "2028-12-31T00:00:00Z" }
              as: SystemAdmin
              captures: { cv_id: $.data.id }
            - call: "POST /coventure-promotions"
              payload: { organization_id: "${org_id}", coventurer_id: "${cv_id}", state_codes: ["CA"], promo_start: "2026-09-01T00:00:00Z", promo_end: "2026-09-30T00:00:00Z", guaranteed_minimum_cents: 500000, per_unit_cents: 250, projected_units: 3000 }
              as: ComplianceOfficer
              captures: { p1_id: $.data.id }
          trigger:
            - call: "POST /coventure-promotions"
              payload: { organization_id: "${org_id}", coventurer_id: "${cv_id}", state_codes: ["CA"], promo_start: "2026-10-07T00:00:00Z", promo_end: "2026-10-15T00:00:00Z", guaranteed_minimum_cents: 500000, per_unit_cents: 250, projected_units: 3000 }
              as: ComplianceOfficer
            - call: "POST /coventure-promotions"
              payload: { organization_id: "${org_id}", coventurer_id: "${cv_id}", state_codes: ["CA"], promo_start: "2026-10-08T00:00:00Z", promo_end: "2026-10-16T00:00:00Z", guaranteed_minimum_cents: 500000, per_unit_cents: 250, projected_units: 3000 }
              as: ComplianceOfficer
              captures: { p3_id: $.data.id }
          assert:
            - "responses[0].http_status == 409"
            - "responses[0].error_id == ERR_PROMOTION_WINDOW_CONFLICT"
            - "responses[1].http_status == 201"
            - "CoventurePromotion.${p3_id}.status == DRAFT"
            - "CoventurePromotion.${p3_id}.promo_start == 2026-10-08T00:00:00Z"
            - "CoventurePromotion.${p3_id}.projected_benefit_cents == 750000"
            - "CoventurePromotion.${p3_id}.disclosure_clause_required == true"
            - "CoventurePromotion.${p1_id}.status == DRAFT"

  - rule_id: compensating_invariant
    instances:

      - name: penalty_ledger_conserved_when_assessment_is_vacated
        grounds:
          - calculations.penalty_ledger_conservation
          - state_machines.EnforcementAction.REMEDIATION_SUBMITTED_to_VACATED
          - calculations.remediation_settlement_total
          - endpoints[POST /enforcement-actions/{id}/vacate]
        invariant:
          statement: "Organization.penalty_outstanding_cents == sum(EnforcementAction.penalty_cents) over actions of this organization with status IN {OPEN, REMEDIATION_SUBMITTED, ESCALATED}"
          forward_operation: "POST /enforcement-actions with penalty_cents_override 25000, which raises the ledger to 25000"
          compensating_operation: "POST /enforcement-actions/{id}/vacate, which lowers the ledger by exactly this action's penalty_cents"
        distinguishing_aspect: |
          Vacating restores the ledger to zero without erasing the audit trail: the vacated
          action keeps settlement_total_cents 36250, the figure stamped when the remediation was
          submitted, and the filing stays REGISTERED because a vacate from REMEDIATION_SUBMITTED
          — unlike a vacate from ESCALATED — touches no registration state. An implementation
          that recomputes settlement_total_cents on vacate, or that zeroes the ledger by
          rebuilding it from CURED and VACATED rows too, drifts.
        test_recipe:
          setup:
            - "StateProfile CA with cure_period_days 30 and reinstatement_fee_cents 12500."
            - "Organization with a REGISTERED CA fiscal_year 2026 filing and penalty_outstanding_cents 0."
            - "Clock at the default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /state-profiles"
              payload: { state_code: "CA", registration_required: true, renewal_due_rule: "FYE_PLUS_4M_15D", assurance_basis: "GROSS_REVENUE", review_threshold_cents: 20000000, audit_threshold_cents: 200000000, online_presence_counts: true, late_fee_base_cents: 2004, late_fee_escalation_pct: 0.125, late_fee_cap_cents: 50000, cure_period_days: 30, reinstatement_fee_cents: 12500 }
