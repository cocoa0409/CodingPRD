        claim_type: violation_to_error
        grounds: [state_machines.FinancingAgreement.ACTIVE_to_CONVERTED_TO_PURCHASE, "errors[ERR_AGREEMENT_NOT_CONVERTIBLE]"]
        distinguishing_aspect: "convert-to-purchase is a RENT_TO_OWN-only transition: an ACTIVE STANDARD agreement fails with ERR_AGREEMENT_NOT_CONVERTIBLE."
        test_recipe:
          setup: ["Customer (credit 2000000); order total 615000; STANDARD agreement (apr 0.12, 12 months) APPROVED"]
          setup_api_calls:
            - call: "POST /piano-dealer/customers"
              payload: { full_name: "Stan Standard", email: "stan@x.com", customer_type: "INDIVIDUAL", credit_limit_cents: 2000000 }
              as: SalesAssociate
              captures: { c_id: $.data.id }
            - call: "POST /piano-dealer/instruments"
              payload: { serial_number: "SN-ST-1", category: "UPRIGHT", manufacturer: "Yamaha", model: "U3", year_built: 2024, condition_grade: "EXCELLENT", acquisition_type: "NEW", list_price_cents: 600000, floor_price_cents: 500000 }
              as: StoreManager
              captures: { i_id: $.data.id }
            - call: "POST /piano-dealer/instruments/${i_id}/list-for-sale"
              as: StoreManager
            - call: "POST /piano-dealer/sales-orders"
              payload: { customer_id: "${c_id}", items: [{ instrument_id: "${i_id}", unit_price_cents: 600000, discount_pct: 0.0 }], tax_rate: 0.0, distance_miles: 10, stairs_count: 0, climate_controlled_required: false }
              as: SalesAssociate
              captures: { o_id: $.data.id }
            - call: "POST /piano-dealer/financing-agreements"
              payload: { order_id: "${o_id}", program: "STANDARD", principal_cents: 615000, apr: 0.12, term_months: 12 }
              as: FinanceOfficer
              captures: { f_id: $.data.id }
            - call: "POST /piano-dealer/financing-agreements/${f_id}/approve"
              as: FinanceOfficer
          trigger:
            - call: "POST /piano-dealer/financing-agreements/${f_id}/convert-to-purchase"
              as: FinanceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_AGREEMENT_NOT_CONVERTIBLE"
            - "FinancingAgreement.${f_id}.status remains ACTIVE"

      - name: referral_quote_from_referred_rejected
        claim_type: violation_to_error
        grounds: [state_machines.RestorationReferral.ASSESSED_to_QUOTED, "errors[ERR_REFERRAL_NOT_ACTIONABLE]"]
        distinguishing_aspect: "quote requires ASSESSED; calling it on a fresh REFERRED referral fails with ERR_REFERRAL_NOT_ACTIONABLE."
        test_recipe:
          setup: ["AVAILABLE instrument; referral created (REFERRED)"]
          setup_api_calls:
            - call: "POST /piano-dealer/instruments"
              payload: { serial_number: "SN-RF-1", category: "GRAND", manufacturer: "Steinway", model: "B", year_built: 1975, condition_grade: "POOR", acquisition_type: "USED", list_price_cents: 900000, floor_price_cents: 700000 }
              as: StoreManager
              captures: { i_id: $.data.id }
            - call: "POST /piano-dealer/instruments/${i_id}/list-for-sale"
              as: StoreManager
            - call: "POST /piano-dealer/restoration-referrals"
              payload: { instrument_id: "${i_id}", shop_name: "Golden Era Restorations" }
              as: StoreManager
              captures: { r_id: $.data.id }
          trigger:
            - call: "POST /piano-dealer/restoration-referrals/${r_id}/quote"
              payload: { final_quote_cents: 250000 }
              as: StoreManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_REFERRAL_NOT_ACTIONABLE"
            - "RestorationReferral.${r_id}.status remains REFERRED"

      - name: referral_commission_holds_instrument_and_restoration_cycle
        claim_type: side_effect_execution
        grounds: [state_machines.RestorationReferral.QUOTED_to_COMMISSIONED, state_machines.Instrument.RESTORATION_HOLD_to_IN_PREP]
        distinguishing_aspect: "Cross-entity side effect + instrument cycle: COMMISSIONED flips the instrument AVAILABLE -> RESTORATION_HOLD; complete-restoration returns it RESTORATION_HOLD -> IN_PREP."
        test_recipe:
          setup: ["AVAILABLE USED instrument; referral ASSESSED then QUOTED"]
          setup_api_calls:
            - call: "POST /piano-dealer/instruments"
              payload: { serial_number: "SN-RC-1", category: "GRAND", manufacturer: "Steinway", model: "B", year_built: 1975, condition_grade: "POOR", acquisition_type: "USED", list_price_cents: 900000, floor_price_cents: 700000 }
              as: StoreManager
              captures: { i_id: $.data.id }
            - call: "POST /piano-dealer/instruments/${i_id}/list-for-sale"
              as: StoreManager
            - call: "POST /piano-dealer/restoration-referrals"
              payload: { instrument_id: "${i_id}", shop_name: "Golden Era Restorations" }
              as: StoreManager
              captures: { r_id: $.data.id }
            - call: "POST /piano-dealer/restoration-referrals/${r_id}/assess"
              payload: { condition_score: 35, estimate_low_cents: 200000, estimate_high_cents: 400000 }
              as: StoreManager
            - call: "POST /piano-dealer/restoration-referrals/${r_id}/quote"
              payload: { final_quote_cents: 300000 }
              as: StoreManager
          trigger:
            - call: "POST /piano-dealer/restoration-referrals/${r_id}/record-decision"
              payload: { decision: "COMMISSIONED" }
              as: StoreManager
            - call: "POST /piano-dealer/instruments/${i_id}/complete-restoration"
              as: StoreManager
          assert:
            - "After COMMISSIONED: RestorationReferral.${r_id}.status == COMMISSIONED and Instrument.${i_id}.status == RESTORATION_HOLD"
            - "After complete-restoration: Instrument.${i_id}.status == IN_PREP (cycle AVAILABLE -> RESTORATION_HOLD -> IN_PREP)"

  # ==================================================================
  # Section: endpoints (incl. optimistic-concurrency layer claims)
  # ==================================================================
  - section: endpoints
    instances:
      - name: bid_revision_occ_stale_version_rejected
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[bid-revision-stale-package]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Create-with-supersede OCC: a revision carrying the pre-revision version succeeds and bumps version; a second revision carrying that same (now stale) version fails with 412 ERR_STALE_VERSION."
        test_recipe:
          setup: ["INSTITUTIONAL customer; instrument 500000/300000; bid created (version captured) and SUBMITTED (version captured at submit)"]
          setup_api_calls:
            - call: "POST /piano-dealer/customers"
              payload: { full_name: "OCC State College", email: "it@occ.edu", customer_type: "INSTITUTIONAL", institution_type: "EDUCATION" }
              as: SalesAssociate
              captures: { cu_id: $.data.id }
            - call: "POST /piano-dealer/instruments"
              payload: { serial_number: "SN-OCC-1", category: "UPRIGHT", manufacturer: "Yamaha", model: "U1", year_built: 2024, condition_grade: "EXCELLENT", acquisition_type: "NEW", list_price_cents: 500000, floor_price_cents: 300000 }
              as: StoreManager
              captures: { i_id: $.data.id }
            - call: "POST /piano-dealer/bid-packages"
              payload: { customer_id: "${cu_id}", lines: [{ instrument_id: "${i_id}", unit_price_cents: 500000 }] }
              as: InstitutionalBidOfficer
              as_user_id: "ibo-occ"
              captures: { b_id: $.data.id }
            - call: "POST /piano-dealer/bid-packages/${b_id}/submit"
              as: InstitutionalBidOfficer
              as_user_id: "ibo-occ"
              captures: { bv: $.data.version }
          trigger:
            - call: "POST /piano-dealer/bid-packages/${b_id}/revisions"
              payload: { expected_bid_version: "${bv}", lines: [{ instrument_id: "${i_id}", unit_price_cents: 480000 }] }
              as: InstitutionalBidOfficer
              as_user_id: "ibo-occ"
              captures: { bv2: $.data.version }
            - call: "POST /piano-dealer/bid-packages/${b_id}/revisions"
              payload: { expected_bid_version: "${bv}", lines: [{ instrument_id: "${i_id}", unit_price_cents: 470000 }] }
              as: InstitutionalBidOfficer
              as_user_id: "ibo-occ"
              captures: { err: $.data.error_id }
          assert:
            - "First revision succeeds: revision_number == 2 and version == ${bv} + 1 (captured as ${bv2})"
            - "First revision repriced: total_cents == round(480000 * 1.0) * 0.95 == 456000"
            - "Second revision with stale expected_bid_version: error_id == ERR_STALE_VERSION (412); revision_number stays 2"

      - name: order_amend_occ_stale_version_rejected
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[order-amend-stale-order]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Amendment-supersession OCC on SalesOrder: two sequential amendments carrying the same observed version — the first succeeds (version bumps), the second fails with 412 ERR_STALE_VERSION."
        test_recipe:
          setup: ["Customer; UNPAID order (100000 line, dist 10 -> total 115000), version captured at creation"]
          setup_api_calls:
            - call: "POST /piano-dealer/customers"
              payload: { full_name: "Amy Amend", email: "amy@x.com", customer_type: "INDIVIDUAL" }
              as: SalesAssociate
              captures: { c_id: $.data.id }
            - call: "POST /piano-dealer/instruments"
              payload: { serial_number: "SN-AM-1", category: "DIGITAL", manufacturer: "Roland", model: "FP30", year_built: 2024, condition_grade: "EXCELLENT", acquisition_type: "NEW", list_price_cents: 100000, floor_price_cents: 80000 }
              as: StoreManager
              captures: { i_id: $.data.id }
            - call: "POST /piano-dealer/instruments/${i_id}/list-for-sale"
              as: StoreManager
            - call: "POST /piano-dealer/sales-orders"
              payload: { customer_id: "${c_id}", items: [{ instrument_id: "${i_id}", unit_price_cents: 100000, discount_pct: 0.0 }], tax_rate: 0.0, distance_miles: 10, stairs_count: 0, climate_controlled_required: false }
              as: SalesAssociate
              captures: { o_id: $.data.id, ov: $.data.version }
          trigger:
            - call: "PATCH /piano-dealer/sales-orders/${o_id}"
              payload: { expected_order_version: "${ov}", stairs_count: 2 }
              as: SalesAssociate
              captures: { ov2: $.data.version }
            - call: "PATCH /piano-dealer/sales-orders/${o_id}"
              payload: { expected_order_version: "${ov}", stairs_count: 4 }
              as: SalesAssociate
              captures: { err: $.data.error_id }
          assert:
            - "First amend succeeds: version == ${ov} + 1 (captured as ${ov2})"
            - "First amend repriced: delivery_fee_cents == 20000 (15000 + 2*2500) and total_cents == 120000"
            - "Second amend with stale version: error_id == ERR_STALE_VERSION (412); stairs_count remains 2"

      - name: order_amend_recomputes_derived_totals
        claim_type: side_effect_execution
        grounds: [calculations.order_total, calculations.delivery_fee, entities.SalesOrder.fields.total_cents]
        distinguishing_aspect: "Derived-field reconciliation on amend: changing distance_miles 10 -> 70 recomputes delivery_fee 15000 -> 39000 and total 115000 -> 139000 in the same response."
        test_recipe:
          setup: ["Customer; UNPAID order (100000 line, dist 10) with version captured"]
          setup_api_calls:
            - call: "POST /piano-dealer/customers"
              payload: { full_name: "Recompute Rae", email: "rae@x.com", customer_type: "INDIVIDUAL" }
              as: SalesAssociate
              captures: { c_id: $.data.id }
            - call: "POST /piano-dealer/instruments"
              payload: { serial_number: "SN-RC-9", category: "DIGITAL", manufacturer: "Roland", model: "FP30", year_built: 2024, condition_grade: "EXCELLENT", acquisition_type: "NEW", list_price_cents: 100000, floor_price_cents: 80000 }
              as: StoreManager
              captures: { i_id: $.data.id }
            - call: "POST /piano-dealer/instruments/${i_id}/list-for-sale"
              as: StoreManager
            - call: "POST /piano-dealer/sales-orders"
              payload: { customer_id: "${c_id}", items: [{ instrument_id: "${i_id}", unit_price_cents: 100000, discount_pct: 0.0 }], tax_rate: 0.0, distance_miles: 10, stairs_count: 0, climate_controlled_required: false }
              as: SalesAssociate
              captures: { o_id: $.data.id, ov: $.data.version }
          trigger:
            - call: "PATCH /piano-dealer/sales-orders/${o_id}"
              payload: { expected_order_version: "${ov}", distance_miles: 70 }
              as: SalesAssociate
          assert:
            - "SalesOrder.${o_id}.delivery_fee_cents == 39000 (15000 + tier-3 24000)"
            - "SalesOrder.${o_id}.total_cents == 139000"
            - "SalesOrder.${o_id}.balance_cents == 139000 (amount_paid still 0)"

      - name: deposit_payment_reconciles_balance_immediately
        claim_type: action_endpoint
        grounds: [entities.SalesOrder.fields.balance_cents, entities.SalesOrder.fields.amount_paid_cents]
        distinguishing_aspect: "Immediate consistency: the payment response itself shows amount_paid_cents 200000 and balance_cents 315000 with payment_status DEPOSIT_PAID — no re-read lag."
        test_recipe:
          setup: ["Customer; UNPAID order total 515000"]
          setup_api_calls:
            - call: "POST /piano-dealer/customers"
              payload: { full_name: "Dep Osit", email: "dep@x.com", customer_type: "INDIVIDUAL" }
              as: SalesAssociate
              captures: { c_id: $.data.id }
            - call: "POST /piano-dealer/instruments"
              payload: { serial_number: "SN-DP-1", category: "UPRIGHT", manufacturer: "Yamaha", model: "U1", year_built: 2024, condition_grade: "EXCELLENT", acquisition_type: "NEW", list_price_cents: 500000, floor_price_cents: 400000 }
              as: StoreManager
              captures: { i_id: $.data.id }
            - call: "POST /piano-dealer/instruments/${i_id}/list-for-sale"
              as: StoreManager
            - call: "POST /piano-dealer/sales-orders"
              payload: { customer_id: "${c_id}", items: [{ instrument_id: "${i_id}", unit_price_cents: 500000, discount_pct: 0.0 }], tax_rate: 0.0, distance_miles: 10, stairs_count: 0, climate_controlled_required: false }
              as: SalesAssociate
              captures: { o_id: $.data.id }
          trigger:
            - call: "POST /piano-dealer/sales-orders/${o_id}/payments"
              payload: { amount_cents: 200000, method: "CASH" }
              as: SalesAssociate
          assert:
            - "Response: payment_status == DEPOSIT_PAID, amount_paid_cents == 200000, balance_cents == 315000"

