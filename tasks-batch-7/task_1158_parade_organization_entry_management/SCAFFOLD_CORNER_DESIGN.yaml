      - name: second_permit_and_plan_creation_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_PERMIT_ALREADY_EXISTS]", "errors[ERR_PLAN_ALREADY_EXISTS]"]
        distinguishing_aspect: "Uniqueness constraints: one permit and one dispersal plan per parade; second creations return the dedicated 409 errors."
