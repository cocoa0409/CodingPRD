              as: NetworkAdmin
              captures: { du12: $.data.id }
            - call: "POST /fountain-network/placement-agreements/${ag12}/activate"
              payload: {}
              as: NetworkAdmin
            - call: "POST /fountain-network/supply-items"
              payload: { sku_code: "FREESTYLE_PEACH", brand_name: "Coca-Cola Peach", supply_form: "CARTRIDGE", case_pack_units: 4, ounces_per_unit: 350, promotional: true, promo_window_start: "2026-07-15T00:00:00Z", promo_window_end: "2026-08-15T00:00:00Z", national_allocation_units: 200 }
