          assert:
            - "${err} == ERR_ORDER_NOT_COMPLETE"

      - name: intake_referential_check_beats_fiscal_cap
        grounds:
          - validations[priority=10]
          - validations[priority=11]
          - errors[ERR_UNIT_NOT_SCRAPPED]
          - errors[ERR_CREDIT_LIMIT_EXCEEDED]
        distinguishing_aspect: |
          Category pair business_referential (priority 10) vs business_fiscal
          (priority 11): the intake references a MANUFACTURED (not SCRAPPED) unit AND
          the retailer's credit_limit_cents is 0 so the provisional credit would also
          breach the cap; the dual-failure create must return ERR_UNIT_NOT_SCRAPPED,
          proving referential integrity runs before the fiscal cap.
        test_recipe:
          setup:
            - "Retailer with recycling_enrolled true and credit_limit_cents 0; unit u1 MANUFACTURED (order COMPLETE, not yet shipped)"
          setup_api_calls:
