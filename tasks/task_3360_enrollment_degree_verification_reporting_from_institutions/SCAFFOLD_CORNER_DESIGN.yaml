            - { call: "POST /institutions/${inst_id}/suspend", payload: {}, as: ClearinghouseOps }
            - { call: "POST /institutions/${inst_id}/reinstate", payload: {}, as: ClearinghouseOps, captures: { err_rein: "$.data.error_id" } }
          assert:
            - "captured err_up == ERR_AGREEMENT_LAPSED (institution ACTIVE but no agreement covers now)"
            - "captured err_rein == ERR_AGREEMENT_LAPSED (reinstate requires an ACTIVE agreement)"

      - name: err_institution_suspended_on_upload
        claim_type: violation_to_error
        grounds:
