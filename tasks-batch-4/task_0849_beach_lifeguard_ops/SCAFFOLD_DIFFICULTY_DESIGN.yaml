# =============================================================================
# task_0849 — §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 Difficulty Rules x 2 instances = 18 instances
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: water_closure_single_vs_geomean
        grounds:
          - calculations.bacteria_exceedance_assessment
          - entities.Advisory.fields.level
          - entities.Advisory.fields.assessed_value
          - entities.Advisory.fields.basis
        distinguishing_aspect: |
          For identical WaterQualitySample rows [10,40,250], basis SINGLE_SAMPLE yields
          CLOSURE (latest 250 >= 104) while basis GEOMEAN_30DAY yields ADVISORY
          (geomean 46.42 in [35,104)) — dual-variant logic on the water-quality/Advisory domain.
        test_recipe:
          setup:
            - "Clock at 2026-07-15T12:00:00Z; one beach; one zone; three samples for that zone with MPN 10, 40, 250 all within the trailing 30-day window."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-15T12:00:00Z" }
              as: BeachCaptain
            - call: "POST /beach-ops/beaches"
              payload: { name: "Ocean Park", town_code: "OP", season_start_date: "2026-05-23", season_end_date: "2026-09-07" }
              as: BeachCaptain
              captures: { beach_id: $.data.id }
            - call: "POST /beach-ops/zones"
              payload: { beach_id: "${beach_id}", name: "North Cove", min_guards_required: 1 }
              as: BeachCaptain
              captures: { zone_id: $.data.id, zv0: $.data.version }
            - call: "POST /beach-ops/water-quality-samples"
              payload: { zone_id: "${zone_id}", enterococci_mpn: 10, sampled_at: "2026-07-13T08:00:00Z", lab_ref: "L1", technician: "T" }
              as: WaterQualityInspector
            - call: "POST /beach-ops/water-quality-samples"
              payload: { zone_id: "${zone_id}", enterococci_mpn: 40, sampled_at: "2026-07-14T08:00:00Z", lab_ref: "L2", technician: "T" }
              as: WaterQualityInspector
            - call: "POST /beach-ops/water-quality-samples"
              payload: { zone_id: "${zone_id}", enterococci_mpn: 250, sampled_at: "2026-07-15T08:00:00Z", lab_ref: "L3", technician: "T" }
              as: WaterQualityInspector
          trigger:
            - call: "POST /beach-ops/zones/${zone_id}/advisories"
              payload: { basis: "GEOMEAN_30DAY", expected_zone_version: "${zv0}" }
              as: WaterQualityInspector
              captures: { geo_level: $.data.level, geo_val: $.data.assessed_value }
            - call: "GET /beach-ops/zones/${zone_id}"
              as: WaterQualityInspector
              captures: { zv1: $.data.version }
            - call: "POST /beach-ops/zones/${zone_id}/advisories"
              payload: { basis: "SINGLE_SAMPLE", expected_zone_version: "${zv1}" }
              as: WaterQualityInspector
              captures: { single_level: $.data.level, single_val: $.data.assessed_value }
          assert:
            - "Advisory(GEOMEAN_30DAY).level == ADVISORY"
            - "Advisory(GEOMEAN_30DAY).assessed_value == 46.42"
            - "Advisory(SINGLE_SAMPLE).level == CLOSURE"
            - "Advisory(SINGLE_SAMPLE).assessed_value == 250"

      - name: staffing_scheduled_vs_actual_coverage
        grounds:
          - calculations.zone_coverage_hours
          - entities.Shift.fields.scheduled_start
          - entities.Shift.fields.clock_out_at
        distinguishing_aspect: |
          For one Shift scheduled 09:00–17:00 (480 min) but clocked out early at 13:00,
          scheduled_coverage_minutes=480 while actual_coverage_minutes=240 — dual-variant
          on the staffing/Shift domain, a different entity domain from the water-quality variant.
        test_recipe:
          setup:
            - "Clock 2026-07-15T09:00:00Z; beach/zone/tower/lifeguard; one shift 09:00–17:00; guard clocks in at 09:00; clock advances to 13:00; guard clocks out."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-15T09:00:00Z" }
              as: BeachCaptain
            - call: "POST /beach-ops/beaches"
              payload: { name: "Ocean Park", town_code: "OP", season_start_date: "2026-05-23", season_end_date: "2026-09-07" }
              as: BeachCaptain
              captures: { beach_id: $.data.id }
            - call: "POST /beach-ops/zones"
              payload: { beach_id: "${beach_id}", name: "North Cove", min_guards_required: 1 }
              as: BeachCaptain
              captures: { zone_id: $.data.id }
            - call: "POST /beach-ops/towers"
              payload: { zone_id: "${zone_id}", label: "T4", max_concurrent_guards: 2 }
              as: BeachCaptain
              captures: { tower_id: $.data.id }
            - call: "POST /beach-ops/lifeguards"
              payload: { beach_id: "${beach_id}", name: "Ana", certification_level: "SENIOR", employee_ref: "E1" }
              as: BeachCaptain
              captures: { lg_id: $.data.id }
            - call: "POST /beach-ops/shifts"
              payload: { lifeguard_id: "${lg_id}", tower_id: "${tower_id}", scheduled_start: "2026-07-15T09:00:00Z", scheduled_end: "2026-07-15T17:00:00Z" }
              as: BeachCaptain
              captures: { shift_id: $.data.id }
            - call: "POST /beach-ops/shifts/${shift_id}/transitions"
              payload: { action: "CLOCK_IN" }
              as: Lifeguard
              as_user_id: "${lg_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-15T13:00:00Z" }
              as: BeachCaptain
            - call: "POST /beach-ops/shifts/${shift_id}/transitions"
              payload: { action: "CLOCK_OUT" }
              as: Lifeguard
              as_user_id: "${lg_id}"
          trigger:
            - call: "GET /beach-ops/beaches/${beach_id}/seasonal-report"
              as: BeachCaptain
              captures: { sched: $.data.scheduled_coverage_minutes, act: $.data.actual_coverage_minutes }
          assert:
            - "seasonal_report.scheduled_coverage_minutes == 480"
            - "seasonal_report.actual_coverage_minutes == 240"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: parking_fee_weekend_oversized_resident_nonlinear
        grounds:
          - calculations.parking_fee
          - entities.ParkingPass.fields.fee_cents
          - entities.ParkingLot.fields.daily_rate_cents
        distinguishing_aspect: |
          DAILY fee nests a day-type multiplier (WEEKEND 1.5), an OVERSIZED surcharge (+2000),
          and a resident discount (x0.5) over 3+ inputs: round((1200*1.5+2000)*0.5)=1900 —
          combinatorial mode (a) non-linear multi-input formula.
        test_recipe:
          setup:
            - "Clock 2026-07-18T10:00:00Z (Saturday=WEEKEND); one beach; one lot daily_rate_cents=1200, total_spaces=50."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-18T10:00:00Z" }
              as: BeachCaptain
            - call: "POST /beach-ops/beaches"
              payload: { name: "Ocean Park", town_code: "OP", season_start_date: "2026-05-23", season_end_date: "2026-09-07" }
              as: BeachCaptain
              captures: { beach_id: $.data.id }
            - call: "POST /beach-ops/parking-lots"
              payload: { beach_id: "${beach_id}", name: "Lot A", total_spaces: 50, daily_rate_cents: 1200 }
              as: ParkingClerk
              captures: { lot_id: $.data.id }
          trigger:
            - call: "POST /beach-ops/parking-passes"
              payload: { lot_id: "${lot_id}", plate: "ABC123", vehicle_type: "OVERSIZED", pass_type: "DAILY", is_resident: true }
              as: ParkingClerk
              captures: { fee: $.data.fee_cents }
          assert:
            - "ParkingPass.fee_cents == 1900"

      - name: seasonal_revenue_round_per_pass_then_sum
        grounds:
          - calculations.seasonal_parking_revenue
          - entities.ParkingPass.fields.fee_cents
        distinguishing_aspect: |
          The 8.5% town surcharge is rounded PER PASS then summed: round(100*1.085)=109 each,
          109+109=218 — whereas sum-then-round gives round(200*1.085)=217. The scaffold pins
          per-line rounding — combinatorial mode (b), a different mode from parking_fee's mode (a).
        test_recipe:
          setup:
            - "Clock 2026-07-15T10:00:00Z (Wednesday=WEEKDAY); one beach; one lot daily_rate_cents=100; two DAILY CAR non-resident passes (each fee 100)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-15T10:00:00Z" }
              as: BeachCaptain
            - call: "POST /beach-ops/beaches"
              payload: { name: "Ocean Park", town_code: "OP", season_start_date: "2026-05-23", season_end_date: "2026-09-07" }
              as: BeachCaptain
              captures: { beach_id: $.data.id }
            - call: "POST /beach-ops/parking-lots"
              payload: { beach_id: "${beach_id}", name: "Lot A", total_spaces: 50, daily_rate_cents: 100 }
              as: ParkingClerk
              captures: { lot_id: $.data.id }
            - call: "POST /beach-ops/parking-passes"
              payload: { lot_id: "${lot_id}", plate: "P1", vehicle_type: "CAR", pass_type: "DAILY", is_resident: false }
              as: ParkingClerk
            - call: "POST /beach-ops/parking-passes"
              payload: { lot_id: "${lot_id}", plate: "P2", vehicle_type: "CAR", pass_type: "DAILY", is_resident: false }
              as: ParkingClerk
          trigger:
            - call: "GET /beach-ops/beaches/${beach_id}/seasonal-report"
              as: BeachCaptain
              captures: { rev: $.data.total_parking_revenue_cents }
          assert:
            - "seasonal_report.total_parking_revenue_cents == 218"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: zone_flag_green_yellow_green_cycle
        grounds:
          - state_machines.Zone.RED_to_GREEN
          - state_machines.Zone.GREEN_to_YELLOW
          - state_machines.Zone.YELLOW_to_GREEN
          - entities.Zone.fields.flag_status
        distinguishing_aspect: |
          Zone.flag_status cycles GREEN->YELLOW->GREEN, returning to a previously-visited state —
          impossible in a linear A->B->C pipeline. Non-linear (cyclic) machine on entity Zone.
        test_recipe:
          setup:
            - "Clock 2026-07-15T09:00:00Z; beach/zone(min_guards=1)/tower/lifeguard/shift; guard clocked in so on_duty_guard_count=1; flag raised to GREEN."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-15T09:00:00Z" }
              as: BeachCaptain
            - call: "POST /beach-ops/beaches"
              payload: { name: "Ocean Park", town_code: "OP", season_start_date: "2026-05-23", season_end_date: "2026-09-07" }
              as: BeachCaptain
              captures: { beach_id: $.data.id }
            - call: "POST /beach-ops/zones"
              payload: { beach_id: "${beach_id}", name: "North Cove", min_guards_required: 1 }
              as: BeachCaptain
              captures: { zone_id: $.data.id }
            - call: "POST /beach-ops/towers"
              payload: { zone_id: "${zone_id}", label: "T4", max_concurrent_guards: 2 }
              as: BeachCaptain
              captures: { tower_id: $.data.id }
            - call: "POST /beach-ops/lifeguards"
              payload: { beach_id: "${beach_id}", name: "Ana", certification_level: "SENIOR", employee_ref: "E1" }
              as: BeachCaptain
              captures: { lg_id: $.data.id }
            - call: "POST /beach-ops/shifts"
              payload: { lifeguard_id: "${lg_id}", tower_id: "${tower_id}", scheduled_start: "2026-07-15T09:00:00Z", scheduled_end: "2026-07-15T17:00:00Z" }
              as: BeachCaptain
              captures: { shift_id: $.data.id }
            - call: "POST /beach-ops/shifts/${shift_id}/transitions"
              payload: { action: "CLOCK_IN" }
              as: Lifeguard
              as_user_id: "${lg_id}"
            - call: "POST /beach-ops/zones/${zone_id}/flag"
              payload: { flag_status: "GREEN" }
              as: BeachCaptain
          trigger:
            - call: "POST /beach-ops/zones/${zone_id}/flag"
              payload: { flag_status: "YELLOW" }
              as: BeachCaptain
              captures: { s1: $.data.flag_status }
            - call: "POST /beach-ops/zones/${zone_id}/flag"
              payload: { flag_status: "GREEN" }
              as: BeachCaptain
              captures: { s2: $.data.flag_status }
          assert:
            - "Zone.flag_status after YELLOW transition == YELLOW"
            - "Zone.flag_status after GREEN transition == GREEN"

      - name: incident_branch_resolve_vs_escalate
        grounds:
          - state_machines.Incident.OPEN_to_RESOLVED_ON_SCENE
          - state_machines.Incident.OPEN_to_ESCALATED_EMS
          - entities.Incident.fields.status
          - entities.Incident.fields.ems_transported
        distinguishing_aspect: |
          From OPEN the Incident forks to RESOLVED_ON_SCENE (no ems_* set) versus ESCALATED_EMS
          (ems_* populated), with divergent side-effect sets — branching non-linear machine on
          entity Incident (a different entity from the cyclic Zone machine).
        test_recipe:
          setup:
            - "One beach/zone/lifeguard; two MEDICAL incidents both OPEN."
          setup_api_calls:
            - call: "POST /beach-ops/beaches"
              payload: { name: "Ocean Park", town_code: "OP", season_start_date: "2026-05-23", season_end_date: "2026-09-07" }
              as: BeachCaptain
              captures: { beach_id: $.data.id }
            - call: "POST /beach-ops/zones"
              payload: { beach_id: "${beach_id}", name: "North Cove", min_guards_required: 1 }
              as: BeachCaptain
              captures: { zone_id: $.data.id }
            - call: "POST /beach-ops/lifeguards"
              payload: { beach_id: "${beach_id}", name: "Ana", certification_level: "SENIOR", employee_ref: "E1" }
              as: BeachCaptain
              captures: { lg_id: $.data.id }
            - call: "POST /beach-ops/incidents"
              payload: { zone_id: "${zone_id}", type: "MEDICAL", occurred_at: "2026-07-15T10:00:00Z", description: "chest pain A", lifeguard_id: "${lg_id}" }
              as: Lifeguard
              as_user_id: "${lg_id}"
              captures: { inc_a: $.data.id }
            - call: "POST /beach-ops/incidents"
              payload: { zone_id: "${zone_id}", type: "MEDICAL", occurred_at: "2026-07-15T10:05:00Z", description: "chest pain B", lifeguard_id: "${lg_id}" }
              as: Lifeguard
              as_user_id: "${lg_id}"
              captures: { inc_b: $.data.id }
          trigger:
            - call: "POST /beach-ops/incidents/${inc_a}/transitions"
              payload: { action: "RESOLVE_ON_SCENE" }
              as: Lifeguard
              as_user_id: "${lg_id}"
              captures: { a_status: $.data.status, a_ems: $.data.ems_transported }
            - call: "POST /beach-ops/incidents/${inc_b}/transitions"
              payload: { action: "ESCALATE_EMS", ems_transported: true, ems_hospital: "Mercy", ems_unit: "M12", ems_narrative: "transported" }
              as: Lifeguard
              as_user_id: "${lg_id}"
              captures: { b_status: $.data.status, b_ems: $.data.ems_transported }
          assert:
            - "Incident A.status == RESOLVED_ON_SCENE"
            - "Incident A.ems_transported == null"
            - "Incident B.status == ESCALATED_EMS"
            - "Incident B.ems_transported == true"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: closure_advisory_cascade_depth3
        grounds:
          - state_machines.Advisory.none_to_ACTIVE
          - state_machines.Zone.RED_to_BLACK
          - state_machines.Shift.SCHEDULED_to_CANCELLED
          - entities.Zone.fields.water_status
        distinguishing_aspect: |
          A CLOSURE Advisory (link1) forces Zone->BLACK and water_status CLOSED (link2) which in
          turn CANCELs the zone's SCHEDULED shift (link3) — a depth-3 transitive cascade whose
          origin is advisory creation.
        test_recipe:
          setup:
            - "Clock 2026-07-15T09:00:00Z; beach/zone(min1)/tower/lifeguard; one SCHEDULED shift (not clocked in); one sample MPN 150 for the zone."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-15T09:00:00Z" }
              as: BeachCaptain
            - call: "POST /beach-ops/beaches"
              payload: { name: "Ocean Park", town_code: "OP", season_start_date: "2026-05-23", season_end_date: "2026-09-07" }
              as: BeachCaptain
              captures: { beach_id: $.data.id }
            - call: "POST /beach-ops/zones"
              payload: { beach_id: "${beach_id}", name: "North Cove", min_guards_required: 1 }
              as: BeachCaptain
              captures: { zone_id: $.data.id, zv0: $.data.version }
            - call: "POST /beach-ops/towers"
              payload: { zone_id: "${zone_id}", label: "T4", max_concurrent_guards: 2 }
              as: BeachCaptain
              captures: { tower_id: $.data.id }
            - call: "POST /beach-ops/lifeguards"
              payload: { beach_id: "${beach_id}", name: "Ana", certification_level: "SENIOR", employee_ref: "E1" }
              as: BeachCaptain
              captures: { lg_id: $.data.id }
            - call: "POST /beach-ops/shifts"
              payload: { lifeguard_id: "${lg_id}", tower_id: "${tower_id}", scheduled_start: "2026-07-15T10:00:00Z", scheduled_end: "2026-07-15T18:00:00Z" }
              as: BeachCaptain
              captures: { shift_id: $.data.id }
            - call: "POST /beach-ops/water-quality-samples"
              payload: { zone_id: "${zone_id}", enterococci_mpn: 150, sampled_at: "2026-07-15T08:00:00Z", lab_ref: "L1", technician: "T" }
              as: WaterQualityInspector
          trigger:
            - call: "POST /beach-ops/zones/${zone_id}/advisories"
              payload: { basis: "SINGLE_SAMPLE", expected_zone_version: "${zv0}" }
              as: WaterQualityInspector
              captures: { adv_level: $.data.level }
            - call: "GET /beach-ops/zones/${zone_id}"
              as: BeachCaptain
              captures: { flag: $.data.flag_status, water: $.data.water_status }
            - call: "GET /beach-ops/shifts/${shift_id}"
              as: BeachCaptain
              captures: { shift_status: $.data.status }
          assert:
            - "Advisory.level == CLOSURE"
            - "Zone.flag_status == BLACK"
            - "Zone.water_status == CLOSED"
            - "Shift.status == CANCELLED"

      - name: clockout_understaffed_cascade_depth2
        grounds:
          - state_machines.Shift.ON_DUTY_to_OFF_DUTY
          - state_machines.Zone.GREEN_to_RED
          - entities.Zone.fields.on_duty_guard_count
        distinguishing_aspect: |
          CLOCK_OUT decrements on_duty_guard_count to 0 (link1) which drops the zone below
          min_guards_required and auto-transitions flag GREEN->RED (link2) — a depth-2 cascade
          from a different trigger (shift clock-out) than the closure cascade.
        test_recipe:
          setup:
            - "Clock 2026-07-15T09:00:00Z; beach/zone(min1)/tower/lifeguard/shift; guard clocked in (count=1); flag raised to GREEN."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-15T09:00:00Z" }
              as: BeachCaptain
            - call: "POST /beach-ops/beaches"
              payload: { name: "Ocean Park", town_code: "OP", season_start_date: "2026-05-23", season_end_date: "2026-09-07" }
              as: BeachCaptain
              captures: { beach_id: $.data.id }
            - call: "POST /beach-ops/zones"
              payload: { beach_id: "${beach_id}", name: "North Cove", min_guards_required: 1 }
              as: BeachCaptain
              captures: { zone_id: $.data.id }
            - call: "POST /beach-ops/towers"
              payload: { zone_id: "${zone_id}", label: "T4", max_concurrent_guards: 2 }
              as: BeachCaptain
              captures: { tower_id: $.data.id }
            - call: "POST /beach-ops/lifeguards"
              payload: { beach_id: "${beach_id}", name: "Ana", certification_level: "SENIOR", employee_ref: "E1" }
              as: BeachCaptain
              captures: { lg_id: $.data.id }
            - call: "POST /beach-ops/shifts"
              payload: { lifeguard_id: "${lg_id}", tower_id: "${tower_id}", scheduled_start: "2026-07-15T09:00:00Z", scheduled_end: "2026-07-15T17:00:00Z" }
              as: BeachCaptain
              captures: { shift_id: $.data.id }
            - call: "POST /beach-ops/shifts/${shift_id}/transitions"
              payload: { action: "CLOCK_IN" }
              as: Lifeguard
              as_user_id: "${lg_id}"
            - call: "POST /beach-ops/zones/${zone_id}/flag"
              payload: { flag_status: "GREEN" }
              as: BeachCaptain
          trigger:
            - call: "POST /beach-ops/shifts/${shift_id}/transitions"
              payload: { action: "CLOCK_OUT" }
              as: Lifeguard
              as_user_id: "${lg_id}"
            - call: "GET /beach-ops/zones/${zone_id}"
              as: BeachCaptain
              captures: { count: $.data.on_duty_guard_count, flag: $.data.flag_status }
          assert:
            - "Zone.on_duty_guard_count == 0"
            - "Zone.flag_status == RED"

  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: shift_create_tower_offline_beats_double_book
        grounds:
          - validations[priority=9]
          - validations[priority=15]
          - entities.Tower.fields.status
        distinguishing_aspect: |
          A shift create that violates BOTH ERR_TOWER_OFFLINE (state, p9) and
          ERR_LIFEGUARD_DOUBLE_BOOKED (business_temporal, p15) returns ERR_TOWER_OFFLINE —
          the state category outranks business_temporal (error-category pair state vs temporal).
        test_recipe:
          setup:
            - "Clock 2026-07-15T08:00:00Z; beach/zone; tower1 OPEN and tower2 set OFFLINE; one lifeguard with an existing 09:00–17:00 shift on tower1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-15T08:00:00Z" }
              as: BeachCaptain
            - call: "POST /beach-ops/beaches"
              payload: { name: "Ocean Park", town_code: "OP", season_start_date: "2026-05-23", season_end_date: "2026-09-07" }
              as: BeachCaptain
              captures: { beach_id: $.data.id }
            - call: "POST /beach-ops/zones"
              payload: { beach_id: "${beach_id}", name: "North Cove", min_guards_required: 1 }
              as: BeachCaptain
              captures: { zone_id: $.data.id }
            - call: "POST /beach-ops/towers"
              payload: { zone_id: "${zone_id}", label: "T1", max_concurrent_guards: 2 }
              as: BeachCaptain
              captures: { tower1_id: $.data.id }
            - call: "POST /beach-ops/towers"
              payload: { zone_id: "${zone_id}", label: "T2", max_concurrent_guards: 2 }
              as: BeachCaptain
              captures: { tower2_id: $.data.id }
            - call: "POST /beach-ops/towers/${tower2_id}/status"
              payload: { status: "OFFLINE" }
              as: BeachCaptain
            - call: "POST /beach-ops/lifeguards"
              payload: { beach_id: "${beach_id}", name: "Ana", certification_level: "SENIOR", employee_ref: "E1" }
              as: BeachCaptain
              captures: { lg_id: $.data.id }
            - call: "POST /beach-ops/shifts"
              payload: { lifeguard_id: "${lg_id}", tower_id: "${tower1_id}", scheduled_start: "2026-07-15T09:00:00Z", scheduled_end: "2026-07-15T17:00:00Z" }
