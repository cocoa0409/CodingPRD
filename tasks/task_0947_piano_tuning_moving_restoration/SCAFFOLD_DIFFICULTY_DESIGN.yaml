              captures: { inst_id: "$.data.id" }
            - call: "POST /instruments/${inst_id}/pitch-assessments"
              payload: { reference_pitch_hz: 440.0, measured_deviation_cents: 1.0 }
              as: ShopManager
            - call: "POST /technicians"
              payload: { display_name: "Tech A11", certification_level: "APPRENTICE", zone_codes: ["ZONE_A"] }
              as: PlatformAdmin
              captures: { tech_id: "$.data.id" }
            - call: "POST /route-days"
              payload: { technician_id: "${tech_id}", service_date: "2026-05-03" }
              as: ShopManager
