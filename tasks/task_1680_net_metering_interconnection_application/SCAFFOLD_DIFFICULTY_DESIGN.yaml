# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Net Metering Interconnection Application Processing
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: dvc_monthly_netting_energy_banking_vs_monetary_credit
        grounds:
          - calculations.monthly_netting
          - entities.ServiceAccount.fields.credit_balance_cents
          - entities.ServiceAccount.fields.banked_wh
          - entities.Program.fields.metering_variant
        distinguishing_aspect: |
          Identical readings on identically configured accounts produce divergent money
          outcomes per variant: after R2 the ENERGY_BANKING bill is 12000 cents while the
          MONETARY_CREDIT bill is 17400 cents (billing domain, ServiceAccount/MeterReading) —
          a different entity domain from the screening-domain variant instance.
        test_recipe:
          setup:
            - "Program E: ENERGY_BANKING + BANK_ROLLOVER; Program M: MONETARY_CREDIT + AVOIDED_COST_PAYOUT; identical tariff (import 30000 mc/kWh, export 12000, ns 4500, effective 2026-01-01 open-ended); identical grid (feeder peak 10000000 W pre-existing 0; transformer nameplate 10000000 W pre-existing 0)."
            - "Each program: one COMMERCIAL account (usage 20000000 Wh) with a 10000 W application (production 15000000 Wh) driven to OPERATING."
            - "Both accounts post the same two readings: R1 2026-08-01->2026-09-01 import 500000 export 800000; R2 2026-09-01->2026-10-01 import 700000 export 0."
          setup_api_calls:
            - { call: "POST /programs", payload: { name: "E", aggregate_cap_watts: 1000000, metering_variant: ENERGY_BANKING, true_up_mode: BANK_ROLLOVER, true_up_month: 4, screening_basis: COMMITTED }, as: ProgramAdministrator, captures: { prog_e: $.data.id } }
            - { call: "POST /tariff-schedules", payload: { program_id: "${prog_e}", schedule_code: "E-2026", effective_from: "2026-01-01T00:00:00Z", import_rate_millicents_per_kwh: 30000, export_rate_millicents_per_kwh: 12000, net_surplus_rate_millicents_per_kwh: 4500 }, as: ProgramAdministrator }
            - { call: "POST /feeders", payload: { feeder_code: "F-E", peak_load_watts: 10000000, pre_existing_der_watts: 0 }, as: ProgramAdministrator, captures: { feed_e: $.data.id } }
            - { call: "POST /service-transformers", payload: { feeder_id: "${feed_e}", transformer_code: "T-E", nameplate_watts: 10000000, pre_existing_der_watts: 0 }, as: ProgramAdministrator, captures: { tx_e: $.data.id } }
            - { call: "POST /customers", payload: { full_name: "E Cust", email: "e@x.com" }, as: ProgramAdministrator, captures: { cust_e: $.data.id } }
            - { call: "POST /service-accounts", payload: { customer_id: "${cust_e}", transformer_id: "${tx_e}", account_number: "ACCT-E", service_class: COMMERCIAL, prior_annual_usage_wh: 20000000 }, as: ProgramAdministrator, captures: { acct_e: $.data.id } }
            - { call: "POST /applications", payload: { service_account_id: "${acct_e}", program_id: "${prog_e}", technology: SOLAR_PV, system_size_watts_ac: 10000, estimated_annual_production_wh: 15000000 }, as: Applicant, as_user_id: "${cust_e}", captures: { app_e: $.data.id } }
            - { call: "POST /documents", payload: { application_id: "${app_e}", doc_type: SITE_PLAN, title: "site" }, as: Applicant, as_user_id: "${cust_e}", captures: { doc_e1: $.data.id } }
            - { call: "POST /documents", payload: { application_id: "${app_e}", doc_type: SINGLE_LINE_DIAGRAM, title: "sld" }, as: Applicant, as_user_id: "${cust_e}", captures: { doc_e2: $.data.id } }
            - { call: "POST /documents/${doc_e1}/review", payload: { outcome: ACCEPTED }, as: InterconnectionCoordinator }
            - { call: "POST /documents/${doc_e2}/review", payload: { outcome: ACCEPTED }, as: InterconnectionCoordinator }
            - { call: "POST /applications/${app_e}/submit", payload: {}, as: Applicant, as_user_id: "${cust_e}" }
            - { call: "POST /applications/${app_e}/completeness-decision", payload: { outcome: COMPLETE }, as: InterconnectionCoordinator }
            - { call: "POST /screening-reports", payload: { application_id: "${app_e}" }, as: DistributionEngineer }
            - { call: "POST /meter-exchanges", payload: { application_id: "${app_e}", crew_id: "crew-e", window_start: "2026-08-03T09:00:00Z", window_end: "2026-08-03T11:00:00Z" }, as: MeterTechnician, captures: { ex_e: $.data.id } }
            - { call: "POST /meter-exchanges/${ex_e}/complete", payload: { installed_meter_serial: "MTR-E-1" }, as: MeterTechnician, as_user_id: "tech-e" }
            - { call: "POST /inspections", payload: { application_id: "${app_e}", scheduled_date: "2026-08-05T09:00:00Z" }, as: Applicant, as_user_id: "${cust_e}", captures: { insp_e: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-06T00:00:00Z" }, as: ProgramAdministrator }
            - { call: "POST /inspections/${insp_e}/record-result", payload: { outcome: PASSED, occurred_at: "2026-08-05T10:00:00Z" }, as: Inspector, as_user_id: "insp-1" }
            - { call: "POST /applications/${app_e}/grant-pto", payload: {}, as: InterconnectionCoordinator }
            - { call: "POST /programs", payload: { name: "M", aggregate_cap_watts: 1000000, metering_variant: MONETARY_CREDIT, true_up_mode: AVOIDED_COST_PAYOUT, true_up_month: 4, screening_basis: COMMITTED }, as: ProgramAdministrator, captures: { prog_m: $.data.id } }
            - { call: "POST /tariff-schedules", payload: { program_id: "${prog_m}", schedule_code: "M-2026", effective_from: "2026-01-01T00:00:00Z", import_rate_millicents_per_kwh: 30000, export_rate_millicents_per_kwh: 12000, net_surplus_rate_millicents_per_kwh: 4500 }, as: ProgramAdministrator }
            - { call: "POST /feeders", payload: { feeder_code: "F-M", peak_load_watts: 10000000, pre_existing_der_watts: 0 }, as: ProgramAdministrator, captures: { feed_m: $.data.id } }
            - { call: "POST /service-transformers", payload: { feeder_id: "${feed_m}", transformer_code: "T-M", nameplate_watts: 10000000, pre_existing_der_watts: 0 }, as: ProgramAdministrator, captures: { tx_m: $.data.id } }
            - { call: "POST /customers", payload: { full_name: "M Cust", email: "m@x.com" }, as: ProgramAdministrator, captures: { cust_m: $.data.id } }
            - { call: "POST /service-accounts", payload: { customer_id: "${cust_m}", transformer_id: "${tx_m}", account_number: "ACCT-M", service_class: COMMERCIAL, prior_annual_usage_wh: 20000000 }, as: ProgramAdministrator, captures: { acct_m: $.data.id } }
            - { call: "POST /applications", payload: { service_account_id: "${acct_m}", program_id: "${prog_m}", technology: SOLAR_PV, system_size_watts_ac: 10000, estimated_annual_production_wh: 15000000 }, as: Applicant, as_user_id: "${cust_m}", captures: { app_m: $.data.id } }
            - { call: "POST /documents", payload: { application_id: "${app_m}", doc_type: SITE_PLAN, title: "site" }, as: Applicant, as_user_id: "${cust_m}", captures: { doc_m1: $.data.id } }
            - { call: "POST /documents", payload: { application_id: "${app_m}", doc_type: SINGLE_LINE_DIAGRAM, title: "sld" }, as: Applicant, as_user_id: "${cust_m}", captures: { doc_m2: $.data.id } }
            - { call: "POST /documents/${doc_m1}/review", payload: { outcome: ACCEPTED }, as: InterconnectionCoordinator }
            - { call: "POST /documents/${doc_m2}/review", payload: { outcome: ACCEPTED }, as: InterconnectionCoordinator }
            - { call: "POST /applications/${app_m}/submit", payload: {}, as: Applicant, as_user_id: "${cust_m}" }
            - { call: "POST /applications/${app_m}/completeness-decision", payload: { outcome: COMPLETE }, as: InterconnectionCoordinator }
            - { call: "POST /screening-reports", payload: { application_id: "${app_m}" }, as: DistributionEngineer }
            - { call: "POST /meter-exchanges", payload: { application_id: "${app_m}", crew_id: "crew-m", window_start: "2026-08-07T09:00:00Z", window_end: "2026-08-07T11:00:00Z" }, as: MeterTechnician, captures: { ex_m: $.data.id } }
            - { call: "POST /meter-exchanges/${ex_m}/complete", payload: { installed_meter_serial: "MTR-M-1" }, as: MeterTechnician, as_user_id: "tech-m" }
            - { call: "POST /inspections", payload: { application_id: "${app_m}", scheduled_date: "2026-08-07T12:00:00Z" }, as: Applicant, as_user_id: "${cust_m}", captures: { insp_m: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-08T00:00:00Z" }, as: ProgramAdministrator }
            - { call: "POST /inspections/${insp_m}/record-result", payload: { outcome: PASSED, occurred_at: "2026-08-07T13:00:00Z" }, as: Inspector, as_user_id: "insp-1" }
            - { call: "POST /applications/${app_m}/grant-pto", payload: {}, as: InterconnectionCoordinator }
            - { call: "GET /service-accounts/${acct_e}", as: ProgramAdministrator, captures: { acct_e_v1: $.data.version } }
            - { call: "GET /service-accounts/${acct_m}", as: ProgramAdministrator, captures: { acct_m_v1: $.data.version } }
          trigger:
            - { call: "POST /meter-readings", payload: { service_account_id: "${acct_e}", period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z", import_wh: 500000, export_wh: 800000, expected_account_version: "${acct_e_v1}" }, as: MeterTechnician, captures: { r_e1: $.data.id } }
            - { call: "POST /meter-readings", payload: { service_account_id: "${acct_m}", period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z", import_wh: 500000, export_wh: 800000, expected_account_version: "${acct_m_v1}" }, as: MeterTechnician, captures: { r_m1: $.data.id } }
            - { call: "GET /service-accounts/${acct_e}", as: ProgramAdministrator, captures: { acct_e_v2: $.data.version } }
            - { call: "GET /service-accounts/${acct_m}", as: ProgramAdministrator, captures: { acct_m_v2: $.data.version } }
            - { call: "POST /meter-readings", payload: { service_account_id: "${acct_e}", period_start: "2026-09-01T00:00:00Z", period_end: "2026-10-01T00:00:00Z", import_wh: 700000, export_wh: 0, expected_account_version: "${acct_e_v2}" }, as: MeterTechnician, captures: { r_e2: $.data.id } }
            - { call: "POST /meter-readings", payload: { service_account_id: "${acct_m}", period_start: "2026-09-01T00:00:00Z", period_end: "2026-10-01T00:00:00Z", import_wh: 700000, export_wh: 0, expected_account_version: "${acct_m_v2}" }, as: MeterTechnician, captures: { r_m2: $.data.id } }
          assert:
            - "MeterReading.${r_e1}.bill_cents == 0 and MeterReading.${r_m1}.bill_cents == 0"
            - "After R1: ServiceAccount.${acct_e}.banked_wh == 300000 and credit_balance_cents == 0"
            - "After R1: ServiceAccount.${acct_m}.credit_balance_cents == 3600 and banked_wh == 0"
            - "MeterReading.${r_e2}.bill_cents == 12000 (600 kWh billed after 300 kWh bank draw) and MeterReading.${r_e2}.bank_drawn_wh == 300000"
            - "MeterReading.${r_m2}.bill_cents == 17400 (raw 21000 minus 3600 credit draw) and MeterReading.${r_m2}.credit_applied_cents == 3600"
            - "After R2: ServiceAccount.${acct_e}.banked_wh == 0; ServiceAccount.${acct_m}.credit_balance_cents == 0"
            - "InterconnectionApplication.${app_e}.application_status == OPERATING and InterconnectionApplication.${app_m}.application_status == OPERATING"

      - name: dvc_screening_basis_committed_vs_include_queued
        grounds:
          - calculations.screening_aggregate
          - calculations.feeder_screen
          - entities.Program.fields.screening_basis
          - entities.ScreeningReport.fields.feeder_aggregate_after_watts
        distinguishing_aspect: |
          With identical grid data (feeder peak 1000000 W, pre-existing 115000 W) and an
          identical queue (reserved 20000 W + 10000 W, queued 18000 W), the screened 10000 W
          application PASSES under COMMITTED (aggregate-after 145000 < 150000) and FAILS under
          INCLUDE_QUEUED (aggregate-after 163000 >= 150000) — technical-screening domain
          (ScreeningReport/Feeder), a different entity domain from the billing variant instance.
        test_recipe:
          setup:
            - "Program C: screening_basis COMMITTED, cap 35000 W; Program Q: screening_basis INCLUDE_QUEUED, cap 35000 W. Each has its own feeder (peak 1000000, pre-existing 115000) and transformer (nameplate 10000000, pre-existing 0)."
            - "Per program: app A (20000 W) reaches CAPACITY_RESERVED (available 15000), app B (10000 W) reaches CAPACITY_RESERVED (available 5000), app W (18000 W) lands WAITING_FOR_CAPACITY position 1."
            - "All accounts COMMERCIAL, usage 50000000 Wh, production estimates 30000000 Wh."
          setup_api_calls:
            - { call: "POST /programs", payload: { name: "C", aggregate_cap_watts: 35000, metering_variant: MONETARY_CREDIT, true_up_mode: AVOIDED_COST_PAYOUT, true_up_month: 4, screening_basis: COMMITTED }, as: ProgramAdministrator, captures: { prog_c: $.data.id } }
            - { call: "POST /tariff-schedules", payload: { program_id: "${prog_c}", schedule_code: "C-2026", effective_from: "2026-01-01T00:00:00Z", import_rate_millicents_per_kwh: 30000, export_rate_millicents_per_kwh: 12000, net_surplus_rate_millicents_per_kwh: 4500 }, as: ProgramAdministrator }
            - { call: "POST /feeders", payload: { feeder_code: "F-C", peak_load_watts: 1000000, pre_existing_der_watts: 115000 }, as: ProgramAdministrator, captures: { feed_c: $.data.id } }
            - { call: "POST /service-transformers", payload: { feeder_id: "${feed_c}", transformer_code: "T-C", nameplate_watts: 10000000, pre_existing_der_watts: 0 }, as: ProgramAdministrator, captures: { tx_c: $.data.id } }
            - { call: "POST /customers", payload: { full_name: "C Cust", email: "c@x.com" }, as: ProgramAdministrator, captures: { cust_c: $.data.id } }
            - { call: "POST /service-accounts", payload: { customer_id: "${cust_c}", transformer_id: "${tx_c}", account_number: "C-A", service_class: COMMERCIAL, prior_annual_usage_wh: 50000000 }, as: ProgramAdministrator, captures: { acct_ca: $.data.id } }
            - { call: "POST /applications", payload: { service_account_id: "${acct_ca}", program_id: "${prog_c}", technology: SOLAR_PV, system_size_watts_ac: 20000, estimated_annual_production_wh: 30000000 }, as: Applicant, as_user_id: "${cust_c}", captures: { app_ca: $.data.id } }
            - { call: "POST /documents", payload: { application_id: "${app_ca}", doc_type: SITE_PLAN, title: "site" }, as: Applicant, as_user_id: "${cust_c}", captures: { doc_ca1: $.data.id } }
            - { call: "POST /documents", payload: { application_id: "${app_ca}", doc_type: SINGLE_LINE_DIAGRAM, title: "sld" }, as: Applicant, as_user_id: "${cust_c}", captures: { doc_ca2: $.data.id } }
            - { call: "POST /documents/${doc_ca1}/review", payload: { outcome: ACCEPTED }, as: InterconnectionCoordinator }
            - { call: "POST /documents/${doc_ca2}/review", payload: { outcome: ACCEPTED }, as: InterconnectionCoordinator }
            - { call: "POST /applications/${app_ca}/submit", payload: {}, as: Applicant, as_user_id: "${cust_c}" }
            - { call: "POST /applications/${app_ca}/completeness-decision", payload: { outcome: COMPLETE }, as: InterconnectionCoordinator }
            - { call: "POST /service-accounts", payload: { customer_id: "${cust_c}", transformer_id: "${tx_c}", account_number: "C-B", service_class: COMMERCIAL, prior_annual_usage_wh: 50000000 }, as: ProgramAdministrator, captures: { acct_cb: $.data.id } }
            - { call: "POST /applications", payload: { service_account_id: "${acct_cb}", program_id: "${prog_c}", technology: SOLAR_PV, system_size_watts_ac: 10000, estimated_annual_production_wh: 30000000 }, as: Applicant, as_user_id: "${cust_c}", captures: { app_cb: $.data.id } }
            - { call: "POST /documents", payload: { application_id: "${app_cb}", doc_type: SITE_PLAN, title: "site" }, as: Applicant, as_user_id: "${cust_c}", captures: { doc_cb1: $.data.id } }
