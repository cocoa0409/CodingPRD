scaffold_difficulty_design:
- rule_id: dual_variant_calc
  instances:
  - name: donor_risk_index_screening_vs_final_on_same_donor
    grounds:
    - calculations.donor_risk_index
    - entities.DonorCandidate.fields.screening_risk_index
    - entities.DonorCandidate.fields.final_risk_index
    - entities.DonorCandidate.fields.overall_status
    - state_machines.DonorCandidate.advocacy.DISCLOSED_to_ATTESTED
    distinguishing_aspect: 'The dual variant here is clinical risk scoring on a PERSON (DonorCandidate):
      the screening variant weights medicine 0.6/psychosocial 0.4 and ignores evaluation history, while
      the final variant weights both 0.5/0.5 and surcharges deferrals and non-directed status - the same
      medical_risk_points 10 / psychosocial_risk_points 5 therefore yields screening_risk_index 8.0 and
      final_risk_index 7.5 on one row at the same instant.'
    test_recipe:
      setup:
      - A DIRECTED donor candidate (intended_recipient_id set, so NDD_SURCHARGE does not apply) whose
        MEDICAL evaluation is CLEARED with risk_points 10 (bmi 31.0 -> +2, egfr 84.0 -> +3, systolic 145
        -> +2, hba1c 6.0 -> +2, age 62 -> +1) and whose PSYCHOSOCIAL evaluation is CLEARED with risk_points
        5 (financial_hardship_score 8 -> +3, social_support_score 2 -> +2)
      - deferral_count is 0 - neither evaluation was ever deferred, so DEFERRAL_SURCHARGE contributes
        nothing either
      - consent disclosure recorded at the default clock 2026-08-01T00:00:00Z; the directed cooling-off
        window is program.cooling_off_days 7, so the clock has been advanced to exactly 2026-08-08T00:00:00Z
      - screening_risk_index already stands at 8.0 from the two determinations, before any attestation
        exists
      setup_api_calls:
      - call: POST /programs
        payload:
          name: Northlake Transplant Center
          center_code: NLT-01
          organ_type: KIDNEY
          cooling_off_days: 7
          follow_up_completeness_threshold_pct: 80
          follow_up_compliance_threshold_pct: 75
          expected_one_year_survival_rate: 0.8
          donor_fund_pool_cents: 5000000
          lost_wage_daily_cap_cents: 30000
          lost_wage_weekly_cap_cents: 150000
        as: ProgramAdmin
        captures:
          prog_id: $.data.id
      - call: POST /staff-members
        payload:
          program_id: ${prog_id}
          full_name: Coordinator One
          staff_role: TRANSPLANT_COORDINATOR
          npi: '1000000001'
        as: ProgramAdmin
        captures:
          coord_id: $.data.id
      - call: POST /staff-members
        payload:
          program_id: ${prog_id}
          full_name: Advocate One
          staff_role: LIVING_DONOR_ADVOCATE
          npi: '1000000002'
        as: ProgramAdmin
        captures:
          adv_id: $.data.id
      - call: POST /staff-members
        payload:
          program_id: ${prog_id}
          full_name: Reviewer Med
          staff_role: EVALUATION_REVIEWER
          npi: '1000000003'
        as: ProgramAdmin
        captures:
          revmed_id: $.data.id
      - call: POST /staff-members
        payload:
          program_id: ${prog_id}
          full_name: Reviewer Psy
          staff_role: EVALUATION_REVIEWER
          npi: '1000000004'
        as: ProgramAdmin
        captures:
          revpsy_id: $.data.id
      - call: POST /recipient-candidates
        payload:
          program_id: ${prog_id}
          mrn: R-001
          abo_blood_type: A
          age_years: 44
          cpra: 0.85
          dialysis_years: 3.0
          medical_urgency_points: 7
        as: TransplantCoordinator
        as_user_id: ${coord_id}
        captures:
          rec1_id: $.data.id
      - call: POST /donor-candidates
        payload:
          program_id: ${prog_id}
          intended_recipient_id: ${rec1_id}
          mrn: D-001
          abo_blood_type: O
          age_years: 62
        as: TransplantCoordinator
        as_user_id: ${coord_id}
        captures:
          d1_id: $.data.id
      - call: POST /donor-candidates/${d1_id}/advocate-assignment
        payload:
          advocate_staff_id: ${adv_id}
        as: ProgramAdmin
      - call: POST /donor-evaluations
        payload:
          donor_candidate_id: ${d1_id}
          domain: MEDICAL
          bmi: 31.0
          egfr_ml_min: 84.0
          systolic_bp: 145
          hba1c: 6.0
          coercion_flag: false
          unmanaged_substance_use: false
          decisional_capacity_ok: true
          financial_hardship_score: 1
          social_support_score: 9
        as: EvaluationReviewer
        as_user_id: ${revmed_id}
        captures:
          ev_med_d1: $.data.id
      - call: POST /donor-evaluations/${ev_med_d1}/determination
        payload:
          outcome: CLEARED
        as: EvaluationReviewer
        as_user_id: ${revmed_id}
      - call: POST /donor-evaluations
        payload:
          donor_candidate_id: ${d1_id}
          domain: PSYCHOSOCIAL
          bmi: 24.0
          egfr_ml_min: 100.0
          systolic_bp: 118
          hba1c: 5.0
          coercion_flag: false
          unmanaged_substance_use: false
          decisional_capacity_ok: true
          financial_hardship_score: 8
          social_support_score: 2
        as: EvaluationReviewer
        as_user_id: ${revpsy_id}
        captures:
          ev_psy_d1: $.data.id
      - call: POST /donor-evaluations/${ev_psy_d1}/determination
        payload:
          outcome: CLEARED
        as: EvaluationReviewer
        as_user_id: ${revpsy_id}
      - call: POST /donor-candidates/${d1_id}/consent-disclosure
        payload: {}
        as: DonorAdvocate
        as_user_id: ${adv_id}
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-08-08T00:00:00Z'
        as: ProgramAdmin
      trigger:
      - call: POST /donor-candidates/${d1_id}/advocacy-determination
        payload:
          outcome: ATTESTED
        as: DonorAdvocate
        as_user_id: ${adv_id}
      assert:
      - DonorCandidate.${d1_id}.screening_risk_index == 8.0
      - DonorCandidate.${d1_id}.final_risk_index == 7.5
      - DonorCandidate.${d1_id}.final_risk_index != DonorCandidate.${d1_id}.screening_risk_index (delta
        exactly 0.50 on identical inputs)
      - DonorCandidate.${d1_id}.overall_status == APPROVED (7.5 < RISK_INDEX_CEILING 8.0, so the variant
        choice decides approval)
      - DonorCandidate.${d1_id}.advocacy_status == ATTESTED
      - DonorCandidate.${d1_id}.attestation_at == 2026-08-08T00:00:00Z
  - name: donor_cost_claim_estimated_vs_adjudicated_waterfall
    grounds:
    - calculations.donor_cost_reimbursement
    - calculations.donor_fund_ledger
    - entities.DonorCostClaim.fields.estimated_reimbursement_cents
    - entities.DonorCostClaim.fields.adjudicated_reimbursement_cents
    - entities.DonorCostClaim.fields.unfunded_cents
    - state_machines.DonorCostClaim.SUBMITTED_to_ADJUDICATED
    distinguishing_aspect: 'The dual variant here is MONEY on a DonorCostClaim, not risk on a person:
      the estimated variant applies only the per-claim cap while the adjudicated variant applies the donor
      lifetime cap and a three-bucket waterfall, so the identical claim is estimated at 800000 cents and
      adjudicated at 150000 cents with unfunded_cents 650000.'
    test_recipe:
      setup:
      - Donor ${d1_id} has completed donation (overall_status DONATED) through a committed 2-segment paired
        loop
      - 'Two earlier claims are already ADJUDICATED for that donor: a MEDICAL claim of 1000000 cents (insurance
        600000 + program fund 400000) and a TRAVEL claim of 350000 cents (NLDAC grant 350000), so the
        donor''s ADJUDICATED lifetime total is 1350000 cents and only 150000 cents of the 1500000 lifetime
        cap remain'
      - TransplantProgram.donor_fund_committed_cents is 400000 and donor_fund_remaining_cents is 4600000
      - The donor has consumed 350000 of the 800000 NLDAC per-donor pool
