        grounds:
          - calculations.calculate_bag_allocation_weight
          - validations[priority=28]
          - validations[priority=29]
          - errors[ERR_COMPARTMENT_OVERLOAD]
          - errors[ERR_RUNNING_LOAD_EXCEEDED]
        distinguishing_aspect: |
          Both hold limits are aggregate over bags plus stowed consignments,
          and the fixture separates them. H4 (5000 kg, 900 kg/m over 6.0 m)
          accepts 4800 kg of bags, then rejects a 300 kg consignment because
          the total 5100 exceeds the mass limit even though 850 kg/m would
          still be legal. The narrow bulk hold H6 (5000 kg over only 2.0 m)
