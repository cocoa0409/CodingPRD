            - "response.data.error_id == 'ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER'"

  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_ticket_version_on_refresh_markout
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[markout-refresh-stale-ticket]", "errors[ERR_STALE_TICKET_VERSION]"]
        distinguishing_aspect: "Creating a refresh MarkOut carrying a stale expected_ticket_version (one below current) -> ERR_STALE_TICKET_VERSION (412)."
        test_recipe:
          setup: ["Ticket MARKED via mk1; client holds a stale ticket version captured before completion advanced it."]
          setup_api_calls:
            - call: "POST /excavators"
              payload: { company_name: "DigCo", contact_email: "c25@x.com", state_code: "CA" }
