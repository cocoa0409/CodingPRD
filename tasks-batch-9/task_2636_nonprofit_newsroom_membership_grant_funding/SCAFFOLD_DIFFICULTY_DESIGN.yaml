            - "trigger[0] -> 409 ERR_DISCLOSURE_REQUIRED - the ACTIVE disclosure for (funder, CLIMATE) does not cover the (funder, HOUSING) pair the proposal restricts to"
            - "after trigger[0]: GrantProposal.${gp_id}.status is still INDEPENDENCE_REVIEW and cleared_by_user_id == null"
            - "trigger[2] -> 201: FirewallDisclosure.${fd_housing}.status == ACTIVE, funder_id == ${f_id}, coverage_area_id == ${ca_housing}; FirewallDisclosure.${fd_climate}.status is still ACTIVE (no supersession)"
