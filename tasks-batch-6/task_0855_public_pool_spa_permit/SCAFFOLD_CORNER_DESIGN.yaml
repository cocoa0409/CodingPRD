        distinguishing_aspect: "A treatment pH of 7.6 is strictly above CT_PH_THRESHOLD, so the target becomes 15300 * 1.5 = 22950 and the window is ceil(22950/40) = 574 minutes rather than the 383 minutes the same 40 ppm gives at pH 7.2."
        test_recipe:
          setup: ["A FECAL_DIARRHEAL closure order opened at 2026-05-01T00:00:00Z; the clock now reads 2026-05-01T02:00:00Z and an IN_RANGE reading sampled at 01:30 is on file."]
