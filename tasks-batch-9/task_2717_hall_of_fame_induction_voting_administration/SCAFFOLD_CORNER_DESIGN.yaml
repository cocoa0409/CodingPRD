      - name: vote_pct_rounds_half_up_to_two_decimals
        claim_type: precision
        grounds:
          - calculations.ballot_tally_counts.precision
          - calculations.election_threshold_votes.variants.TURNOUT_BASED
          - entities.BallotSlot.fields.vote_pct
        distinguishing_aspect: |
          With 8 COUNTED submissions of which exactly one selects the slot, vote_pct = 1/8 = 0.125
          and must round half-up to 0.13 (truncation would give 0.12); the turnout-based provisional
          threshold is ceil(8 * 0.75) = 6, so the slot is far below it.
