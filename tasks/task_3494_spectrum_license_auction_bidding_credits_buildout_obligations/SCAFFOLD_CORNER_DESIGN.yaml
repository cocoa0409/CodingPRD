  # ===========================================================================
  - section: rbac
    instances:

      - name: bidder_cannot_publish_band_plan
        claim_type: RBAC
        grounds:
          - roles.Bidder
          - endpoints.POST_/spectrum-auctions/band-plans/{id}/publish
        distinguishing_aspect: "Publish is an AuctionAdmin exclusive; a Bidder caller — even with a syntactically valid request on an existing DRAFT plan — is refused ERR_UNAUTHORIZED_ROLE and the plan stays DRAFT."
        test_recipe:
          setup: ["Clock at default; DRAFT plan with area and block ready to publish"]
          setup_api_calls:
            - *k_clock0
            - *k_plan
            - *k_area_y
            - *k_block_a
          trigger:
            - call: "POST /spectrum-auctions/band-plans/${plan_id}/publish"
              payload: {}
              as: Bidder
              as_user_id: "00000000-0000-4000-8000-0000000000aa"
              captures: { rb_err: "$.data.error_id" }
          assert:
            - "rb_err == ERR_UNAUTHORIZED_ROLE with status 403"
            - "BandPlan.${plan_id}.status == DRAFT"

      - name: transfer_reviewer_cannot_publish_either
        claim_type: RBAC
        grounds:
          - roles.TransferReviewer
        distinguishing_aspect: "Segregation of duties is symmetric: the TransferReviewer (adjudicator) cannot run auction-side operations — publish fails 403, and the same split bars it from applicant review."
        test_recipe:
          setup: ["Clock at default; DRAFT plan with area and block"]
          setup_api_calls:
            - *k_clock0
            - *k_plan
            - *k_area_y
            - *k_block_a
          trigger:
            - call: "POST /spectrum-auctions/band-plans/${plan_id}/publish"
              payload: {}
              as: TransferReviewer
              captures: { rb2_err: "$.data.error_id" }
            - call: "POST /spectrum-auctions/applicants/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/review"
              payload: { action: "QUALIFY" }
              as: TransferReviewer
              captures: { rb3_err: "$.data.error_id" }
          assert:
            - "rb2_err == ERR_UNAUTHORIZED_ROLE (plan stays DRAFT)"
            - "rb3_err == ERR_UNAUTHORIZED_ROLE (role gate precedes even the 404 existence check)"

      - name: incumbent_operator_cannot_close_round
        claim_type: RBAC
        grounds:
          - roles.IncumbentOperator
          - endpoints.POST_/spectrum-auctions/rounds/{id}/close
        distinguishing_aspect: "The IncumbentOperator role is confined to its own transition endpoint; closing a clock round is refused 403 even when the round is legitimately OPEN."
        test_recipe:
          setup: ["Auction CLOCK_ACTIVE with round 1 OPEN; one incumbent registered (its id is the operator's X-User-ID)"]
          setup_api_calls:
            - *k_clock0
            - *k_plan
            - *k_area_y
            - *k_block_a
            - *k_publish
            - *k_auction
            - *k_open
            - *k_applicant_rural
            - *k_upfront_rural
            - *k_review_rural
            - *k_qualify_rural
            - *k_clock_quiet
            - *k_begin_quiet
            - *k_start_clock
            - *k_get_rounds
            - call: "POST /spectrum-auctions/incumbents"
              payload: { band_plan_id: "${plan_id}", area_id: "${area_y_id}", callsign: "KZ1", relocation_cost_cents: 1000 }
              as: AuctionAdmin
              captures: { inc_id: "$.data.id" }
          trigger:
            - call: "POST /spectrum-auctions/rounds/${r1_id}/close"
              payload: {}
              as: IncumbentOperator
              as_user_id: "${inc_id}"
              captures: { rb4_err: "$.data.error_id" }
          assert:
            - "rb4_err == ERR_UNAUTHORIZED_ROLE with status 403"
            - "ClockRound.${r1_id}.status == OPEN (still)"

      - name: auction_admin_cannot_place_bid
        claim_type: RBAC
        grounds:
          - roles.AuctionAdmin
          - endpoints.POST_/spectrum-auctions/rounds/{id}/bids
        distinguishing_aspect: "Bidding is a Bidder exclusive; the auction administrator is refused 403 — the segregation that keeps the house from bidding in its own auction."
        test_recipe:
          setup: ["Auction CLOCK_ACTIVE, round 1 OPEN, rural R QUALIFIED"]
          setup_api_calls:
            - *k_clock0
            - *k_plan
            - *k_area_y
            - *k_block_a
            - *k_publish
            - *k_auction
            - *k_open
            - *k_applicant_rural
            - *k_upfront_rural
            - *k_review_rural
            - *k_qualify_rural
            - *k_clock_quiet
            - *k_begin_quiet
            - *k_start_clock
            - *k_get_rounds
          trigger:
            - call: "POST /spectrum-auctions/rounds/${r1_id}/bids"
              payload: { area_code: "PEA002", category: "CATEGORY_A", quantity: 1 }
              as: AuctionAdmin
              captures: { rb5_err: "$.data.error_id" }
          assert:
            - "rb5_err == ERR_UNAUTHORIZED_ROLE with status 403"
            - "GET /spectrum-auctions/rounds/${r1_id}/bids returns an empty array"

      - name: bidder_provide_info_allowed_but_approve_denied
        claim_type: RBAC
        grounds:
          - roles.Bidder
          - endpoints.POST_/spectrum-auctions/transfer-applications/{id}/review
        distinguishing_aspect: "The shared review endpoint splits by action: the transferor Bidder may PROVIDE_INFO (INFO_REQUESTED -> UNDER_REVIEW) but an APPROVE attempt by the same Bidder is refused ERR_UNAUTHORIZED_ROLE — adjudication belongs to TransferReviewer alone."
        test_recipe: 
          setup: ["Rural R's license ACTIVE; transfer to T is INFO_REQUESTED after BEGIN_REVIEW + REQUEST_INFO"]
          setup_api_calls:
            - *k_clock0
            - *k_plan
            - *k_area_y
            - *k_block_a
            - *k_publish
            - *k_auction
            - *k_open
            - *k_applicant_rural
            - *k_upfront_rural
            - *k_review_rural
            - *k_qualify_rural
            - *k_transferee_t
            - *k_clock_quiet
            - *k_begin_quiet
            - *k_start_clock
            - *k_get_rounds
            - *k_bid_rural
            - *k_close_r1
            - *k_assignbid_rural
            - *k_complete
            - *k_lic_rural
            - *k_clock_grant
            - *k_pay_rural
            - call: "POST /spectrum-auctions/licenses/${lic_id}/transfer-applications"
              payload: { transfer_type: "FULL_ASSIGNMENT", transferee_applicant_id: "${t_id}" }
              as: Bidder
              as_user_id: "${r_id}"
              captures: { ta_id: "$.data.id" }
            - call: "POST /spectrum-auctions/transfer-applications/${ta_id}/review"
              payload: { action: "BEGIN_REVIEW" }
              as: TransferReviewer
            - call: "POST /spectrum-auctions/transfer-applications/${ta_id}/review"
              payload: { action: "REQUEST_INFO" }
              as: TransferReviewer
          trigger:
            - call: "POST /spectrum-auctions/transfer-applications/${ta_id}/review"
              payload: { action: "PROVIDE_INFO" }
              as: Bidder
              as_user_id: "${r_id}"
              captures: { ta_status: "$.data.status" }
            - call: "POST /spectrum-auctions/transfer-applications/${ta_id}/review"
              payload: { action: "APPROVE" }
              as: Bidder
              as_user_id: "${r_id}"
              captures: { rb6_err: "$.data.error_id" }
          assert:
            - "ta_status == UNDER_REVIEW (the Bidder's PROVIDE_INFO cycled it back)"
            - "rb6_err == ERR_UNAUTHORIZED_ROLE (Bidder may not adjudicate even its own transfer)"
            - "TransferApplication.${ta_id}.status == UNDER_REVIEW (unchanged by the denied call)"

  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:

      - name: occ_disclosure_stale_version_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[disclosure-update-stale-applicant]
        distinguishing_aspect: "A disclosure PATCH carrying expected_applicant_version one behind the current version is refused 412 ERR_STALE_VERSION; replayed with the fresh version the identical edit succeeds — OCC resolves the supersede without any timing dependence."
        test_recipe:
          setup: ["Auction APPLICATION_OPEN; applicant S SUBMITTED at version 1"]
          setup_api_calls:
            - *k_clock0
            - *k_plan
            - *k_area_y
            - *k_block_a
            - *k_publish
            - *k_auction
            - *k_open
            - call: "POST /spectrum-auctions/applicants"
              payload: { auction_id: "${auction_id}", legal_name: "Sigma LLC", claims_small_business: false, claims_rural_credit: false, own_annual_revenue_cents: 0, service_population: 0, ownership_interests: [{ holder_name: "A", stake_pct: 100, holder_annual_revenue_cents: 0 }] }
              as: Bidder
              captures: { s_id: "$.data.id", s_v: "$.data.version" }
          trigger:
            - call: "PATCH /spectrum-auctions/applicants/${s_id}/disclosure"
              payload: { expected_applicant_version: "${s_v} - 1", legal_name: "Sigma Stale" }
              as: Bidder
              as_user_id: "${s_id}"
              captures: { stale_err: "$.data.error_id" }
            - call: "PATCH /spectrum-auctions/applicants/${s_id}/disclosure"
              payload: { expected_applicant_version: "${s_v}", legal_name: "Sigma Fresh" }
              as: Bidder
              as_user_id: "${s_id}"
              captures: { s_v2: "$.data.version" }
          assert:
            - "stale_err == ERR_STALE_VERSION with status 412"
            - "the stale attempt did not mutate: legal_name still \"Sigma LLC\""
            - "the fresh attempt succeeds: legal_name == \"Sigma Fresh\" and s_v2 == s_v + 1"

      - name: occ_milestone_filing_stale_version_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[milestone-filing-stale-milestone]
        distinguishing_aspect: "A coverage filing whose expected_milestone_version trails the milestone's current version is refused 412; the same filing with the observed version lands — filings supersede, so the version gate is the only ordering the system needs."
