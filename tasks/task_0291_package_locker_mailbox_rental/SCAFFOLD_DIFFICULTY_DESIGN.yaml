            - "Response error_id == ERR_AGREEMENT_NOT_ACTIVE; Package.${pkg}.status stays NOTIFIED (agreement SUSPENDED)"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      # --- (1) MailboxUnit term-interval overlap (closed-open, mailbox occupancy) ---
      - name: mailbox_term_overlap_rejected
        grounds:
          - validations[priority=9]
          - state_machines.MailboxUnit.VACANT_to_RENTED
          - errors[ERR_MAILBOX_OCCUPIED]
        distinguishing_aspect: "MailboxUnit interval semantics: a mailbox already RENTED (its [term_start, term_end) closed-open interval still occupied) rejects activating a second agreement over it — term-range overlap on the MailboxUnit resource."
        test_recipe:
          setup:
            - "Facility F15: mailbox already RENTED by agr1; agr2 on the SAME mailbox with a VERIFIED form is activated (overlap)."
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "F15", time_zone: "UTC" }
              as: FacilityOperator
              captures: { fac: $.data.id }
            - call: "POST /facilities/${fac}/clock/advance"
              payload: { to_iso8601: "2026-06-01T00:00:00.000Z" }
              as: FacilityOperator
            - call: "POST /mailbox-units"
              payload: { facility_id: "${fac}", box_number: "B1", size_tier: "MEDIUM", monthly_fee_cents: 3000 }
              as: FacilityOperator
              captures: { box: $.data.id }
            - call: "POST /customers"
              payload: { facility_id: "${fac}", full_name: "Own", email: "own15@x.com", phone: "1" }
              as: FacilityOperator
              captures: { cust1: $.data.id }
            - call: "POST /customers"
              payload: { facility_id: "${fac}", full_name: "Oth", email: "oth15@x.com", phone: "2" }
              as: FacilityOperator
              captures: { cust2: $.data.id }
            - call: "POST /forms-1583"
              payload: { facility_id: "${fac}", customer_id: "${cust1}", primary_id_type: "PASSPORT", address_proof_type: "LEASE" }
              as: FacilityOperator
              captures: { form1: $.data.id }
            - call: "POST /forms-1583/${form1}/recipients"
              payload: { recipient_name: "Own", relationship: "SELF" }
              as: FacilityOperator
            - call: "POST /forms-1583/${form1}/submit"
              payload: {}
              as: FacilityOperator
            - call: "POST /forms-1583/${form1}/verify"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /rental-agreements"
              payload: { facility_id: "${fac}", customer_id: "${cust1}", mailbox_unit_id: "${box}", form_1583_id: "${form1}", term_months: 1 }
              as: FacilityOperator
              captures: { agr1: $.data.id }
            - call: "POST /rental-agreements/${agr1}/activate"
              payload: {}
              as: FacilityOperator
            - call: "POST /forms-1583"
              payload: { facility_id: "${fac}", customer_id: "${cust2}", primary_id_type: "STATE_ID", address_proof_type: "VEHICLE_REG" }
              as: FacilityOperator
              captures: { form2: $.data.id }
            - call: "POST /forms-1583/${form2}/recipients"
              payload: { recipient_name: "Oth", relationship: "SELF" }
              as: FacilityOperator
            - call: "POST /forms-1583/${form2}/submit"
              payload: {}
              as: FacilityOperator
            - call: "POST /forms-1583/${form2}/verify"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /rental-agreements"
              payload: { facility_id: "${fac}", customer_id: "${cust2}", mailbox_unit_id: "${box}", form_1583_id: "${form2}", term_months: 1 }
              as: FacilityOperator
              captures: { agr2: $.data.id }
          trigger:
            - call: "POST /rental-agreements/${agr2}/activate"
              payload: {}
              as: FacilityOperator
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_MAILBOX_OCCUPIED; mailbox ${box} stays bound to agr1 only"

      # --- (2) LockerUnit point-occupancy (zero-overlap, no interval) ---
      - name: locker_point_occupancy_no_second_package
        grounds:
          - validations[priority=10]
          - state_machines.LockerUnit.AVAILABLE_to_OCCUPIED
          - errors[ERR_NO_LOCKER_AVAILABLE]
        distinguishing_aspect: "LockerUnit interval semantics differ: a single MEDIUM locker is point-occupied by one package; a second MEDIUM receipt finds zero AVAILABLE MEDIUM lockers and is rejected — exclusive point occupancy (no buffers, no term interval), distinct geometry from the mailbox term-range overlap, on a different resource entity."
        test_recipe:
          setup:
            - "Facility F16 with exactly ONE MEDIUM locker, ACTIVE rental, first package received (locker OCCUPIED). Receive a second MEDIUM package."
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "F16", time_zone: "UTC" }
              as: FacilityOperator
              captures: { fac: $.data.id }
            - call: "POST /facilities/${fac}/clock/advance"
              payload: { to_iso8601: "2026-06-01T00:00:00.000Z" }
              as: FacilityOperator
            - call: "POST /mailbox-units"
              payload: { facility_id: "${fac}", box_number: "B1", size_tier: "MEDIUM", monthly_fee_cents: 3000 }
              as: FacilityOperator
              captures: { box: $.data.id }
            - call: "POST /locker-units"
              payload: { facility_id: "${fac}", label: "L1", size_tier: "MEDIUM" }
              as: FacilityOperator
              captures: { lkr: $.data.id }
            - call: "POST /customers"
              payload: { facility_id: "${fac}", full_name: "C16", email: "c16@x.com", phone: "16" }
              as: FacilityOperator
              captures: { cust: $.data.id }
            - call: "POST /forms-1583"
              payload: { facility_id: "${fac}", customer_id: "${cust}", primary_id_type: "PASSPORT", address_proof_type: "LEASE" }
              as: FacilityOperator
              captures: { form: $.data.id }
            - call: "POST /forms-1583/${form}/recipients"
              payload: { recipient_name: "C16", relationship: "SELF" }
              as: FacilityOperator
            - call: "POST /forms-1583/${form}/submit"
              payload: {}
              as: FacilityOperator
            - call: "POST /forms-1583/${form}/verify"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /rental-agreements"
              payload: { facility_id: "${fac}", customer_id: "${cust}", mailbox_unit_id: "${box}", form_1583_id: "${form}", term_months: 1 }
              as: FacilityOperator
              captures: { agr: $.data.id }
            - call: "POST /rental-agreements/${agr}/activate"
              payload: {}
              as: FacilityOperator
            - call: "POST /packages"
              payload: { facility_id: "${fac}", rental_agreement_id: "${agr}", carrier: "UPS", size_tier: "MEDIUM", longest_dim_cm: 40, weight_g: 3000 }
              as: FacilityOperator
              captures: { pkg1: $.data.id }
          trigger:
            - call: "POST /packages"
              payload: { facility_id: "${fac}", rental_agreement_id: "${agr}", carrier: "UPS", size_tier: "MEDIUM", longest_dim_cm: 40, weight_g: 3000 }
              as: FacilityOperator
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_NO_LOCKER_AVAILABLE; the single MEDIUM locker ${lkr} remains OCCUPIED by pkg1 only"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      # --- (1) conserved quantity: Facility.available_locker_count ---
      - name: locker_count_conserved_receive_then_pickup
        grounds:
          - state_machines.LockerUnit.AVAILABLE_to_OCCUPIED
          - state_machines.LockerUnit.OCCUPIED_to_AVAILABLE
          - calculations.facility_locker_counts
          - entities.Facility.fields.available_locker_count
        distinguishing_aspect: "Conserved quantity Facility.available_locker_count: receive (decrements by 1) paired with pickup (increments by 1) leaves available_locker_count exactly equal to its pre-receipt value (1 -> 0 -> 1)."
        test_recipe:
          setup:
            - "Facility F17 with ONE MEDIUM locker (available_locker_count == 1), ACTIVE rental, autopay OFF; same-day notify+pickup (overstay 0, oversize 0)."
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "F17", time_zone: "UTC" }
              as: FacilityOperator
              captures: { fac: $.data.id }
            - call: "POST /facilities/${fac}/clock/advance"
              payload: { to_iso8601: "2026-06-01T00:00:00.000Z" }
              as: FacilityOperator
            - call: "POST /mailbox-units"
              payload: { facility_id: "${fac}", box_number: "B1", size_tier: "MEDIUM", monthly_fee_cents: 3000 }
              as: FacilityOperator
              captures: { box: $.data.id }
            - call: "POST /locker-units"
              payload: { facility_id: "${fac}", label: "L1", size_tier: "MEDIUM" }
              as: FacilityOperator
              captures: { lkr: $.data.id }
            - call: "POST /customers"
