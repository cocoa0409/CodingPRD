        grounds: ["endpoints[GET /cng/monthly-settlements]", entities.MonthlySettlement.fields.supply_contract_id]
        distinguishing_aspect: "GET /cng/monthly-settlements?supply_contract_id= finds the settlement child from its contract (FK reverse-reachability)."
        test_recipe:
          setup: ["ACTIVE contract; month 2026-07 settled"]
          setup_api_calls:
            - { call: "POST /cng/stations", payload: { station_name: "Rev", station_code: "ST-REV", access_mode: "PRIVATE", backup_capacity_gge: 5000 }, as: NetworkOperator, captures: { st_id: $.data.id } }
            - { call: "POST /cng/compressors", payload: { station_id: "${st_id}", compressor_code: "CMP-1", capacity_scf_per_minute: 120 }, as: StationManager }
            - { call: "POST /cng/dispensers", payload: { station_id: "${st_id}", dispenser_code: "DSP-C", fuel_type: "CNG" }, as: StationManager }
            - { call: "POST /cng/stations/${st_id}/activate", payload: {}, as: NetworkOperator }
            - { call: "POST /cng/fleet-accounts", payload: { account_name: "Rev Co", billing_email: "ap@rev.example", credit_limit_cents: 100000 }, as: NetworkOperator, captures: { acct_id: $.data.id } }
            - { call: "POST /cng/supply-contracts", payload: { fleet_account_id: "${acct_id}", station_id: "${st_id}", committed_monthly_gge: 100.0, contract_price_per_gge_cents: 275, shortfall_tier1_rate_cents: 30, shortfall_tier2_rate_cents: 55, start_month: "2026-06", end_month: "2026-12" }, as: NetworkOperator, captures: { contract_id: $.data.id } }
            - { call: "POST /cng/supply-contracts/${contract_id}/activate", payload: {}, as: NetworkOperator }
            - { call: "POST /cng/supply-contracts/${contract_id}/settle-month", payload: { month: "2026-07" }, as: NetworkOperator, captures: { setl_id: $.data.id } }
          trigger:
            - { call: "GET /cng/monthly-settlements?supply_contract_id=${contract_id}", payload: {}, as: NetworkOperator }
          assert:
            - "total_count == 1 and the row's id == MonthlySettlement.${setl_id}"

      - name: complete_response_carries_computed_fields_immediately
        claim_type: computed_read
        grounds: ["endpoints[POST /cng/fueling-sessions/{sessionId}/complete]"]
        distinguishing_aspect: "Immediate consistency: the complete RESPONSE body itself carries provisional_gge, settled_gge, unit_price_cents, hold_amount_cents and total_amount_cents — no re-read needed."
        excluded_because:
          difficulty_instance: dual_variant_calc / session_gge_provisional_vs_settled_divergence
          rationale: "That instance captures prov/sett/tot directly from the complete call's response envelope and pins their literal values."
        # no test_recipe

