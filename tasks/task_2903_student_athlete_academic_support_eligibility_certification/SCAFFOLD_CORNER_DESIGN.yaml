            - "TutorAssignment.${a40_id}.status == TERMINATED with terminated_reason == ENROLLMENT_DROPPED"
            - "Tutor.${t40_id}.assigned_weekly_hours == 0.00 and Tutor.${t40_id}.status == TRAINED - only the assignment cascaded"
            - "StudentAthlete.${s40_id}.cumulative_gpa == 0.00, completed_full_time_terms == 0 and required_study_hall_hours == 0.0"

      - name: appeal_revision_cycle_returns_to_submitted
        claim_type: cyclic
        grounds: [state_machines.EligibilityAppeal.transitions.REVISION_REQUESTED_to_SUBMITTED]
        excluded_because:
          difficulty_instance: non_linear_state_machine / appeal_revision_round_cycle
          rationale: "The named §1.8 instance drives the full REVISION_REQUESTED -> SUBMITTED loop, asserts round_number growth, and asserts the MAX_APPEAL_ROUNDS termination condition."

      - name: student_eligibility_and_support_dimensions_are_independent
        claim_type: parallel
        grounds: [entities.StudentAthlete.fields.eligibility_state, entities.StudentAthlete.fields.support_status]
        excluded_because:
          difficulty_instance: non_linear_state_machine / student_parallel_dimensions_independent
          rationale: "The named §1.8 instance moves each StudentAthlete dimension while pinning the other, which is exactly this claim."

      - name: missed_class_cancellation_reverses_all_side_effects
        claim_type: compensation
        grounds: [state_machines.MissedClassRequest.transitions.DRAFT_to_CANCELLED]
        excluded_because:
          difficulty_instance: compensating_invariant / missed_class_unit_budget_conserved_after_cancellation
          rationale: "The named §1.8 instance replays the charge and its reversal on the student and the event with no drift."

      - name: tutor_hours_ledger_syncs_on_assignment_status_change
        claim_type: ledger_sync
        grounds: [entities.Tutor.fields.assigned_weekly_hours]
        excluded_because:
          difficulty_instance: compensating_invariant / tutor_capacity_hours_conserved_after_termination
          rationale: "The named §1.8 instance reconciles the tutor's derived hour ledger after suspend, terminate and reinstate."

      - name: request_creation_guarded_by_event_state
        claim_type: guarded_transitions
        grounds: ["errors[ERR_EVENT_NOT_TRAVEL_APPROVED]"]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / missed_class_request_requires_travel_approved_event
          rationale: "The named §1.8 instance exercises both sides of the cross-entity guard in one test."

      - name: tutor_suspension_cascade_skips_terminal_assignments
        claim_type: conditional_cascade
        grounds: [state_machines.Tutor.transitions.TRAINED_to_SUSPENDED]
        excluded_because:
          difficulty_instance: transitive_cascade / incident_substantiation_cascade_depth_four
          rationale: "The named §1.8 instance asserts that only PROPOSED/ACTIVE assignments cascade to TERMINATED when the tutor is suspended."

      - name: event_cancellation_voids_child_requests
        claim_type: cross_entity
        grounds: [state_machines.CompetitionEvent.transitions.TRAVEL_APPROVED_to_CANCELLED]
        excluded_because:
          difficulty_instance: transitive_cascade / event_cancellation_cascade_refund_chain
          rationale: "The named §1.8 instance follows the event cancellation into the request, the student budget and the support requirement."

  # ---------------------------------------------------------------------------
  # Guide section 3 - Calculations
  # ---------------------------------------------------------------------------
  - section: calculations
    instances:
      - name: elective_credit_program_cap_applied_in_declared_order
        claim_type: correct_result
        grounds:
          - calculations.degree_applicable_credit_audit.formula
          - entities.DegreeProgram.fields.max_elective_credits_countable
          - entities.Enrollment.fields.degree_applicable_credits_counted
        distinguishing_aspect: "Two 8.00-credit ELECTIVE courses against max_elective_credits_countable 12.00 must yield elective_total 12.00, not 16.00: the walk order (term_index ASC, then subject_code ASC) gives ART-100 its full 8.00 and leaves MUS-200 only the 4.00 headroom."
        test_recipe:
          setup:
            - "DegreeProgram DP41 (catalog_year 2026, total_required_credits 60.00, max_elective_credits_countable 12.00) is declared by student S41 in 2026FA."
            - "ART-100 (8.00 credits) and MUS-200 (8.00 credits) both have an ELECTIVE DegreeApplicabilityRule for effective_catalog_year 2026 with max_countable_credits null."
            - "Both enrollments are RESIDENT in 2026FA; ART-100 already has grade B recorded."
          setup_api_calls:
            - call: "POST /athletics/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: Registrar
            - call: "POST /athletics/terms"
              payload: { code: "2026FA", term_index: 1, term_type: "FALL", catalog_year: 2026, start_date: "2026-08-24T00:00:00Z", end_date: "2026-12-18T00:00:00Z" }
              as: Registrar
              captures: { term1_id: $.data.id }
            - call: "POST /athletics/degree-programs"
              payload: { code: "DP41", name: "Liberal Studies", catalog_year: 2026, total_required_credits: 60.00, max_elective_credits_countable: 12.00 }
              as: Registrar
              captures: { dp41_id: $.data.id }
            - call: "POST /athletics/courses"
              payload: { subject_code: "ART", course_number: "100", title: "Drawing I", credit_hours: 8.00, instructor_user_id: "instr_art_1" }
              as: Registrar
              captures: { art_id: $.data.id }
            - call: "POST /athletics/courses"
              payload: { subject_code: "MUS", course_number: "200", title: "Music Theory", credit_hours: 8.00, instructor_user_id: "instr_mus_1" }
              as: Registrar
              captures: { mus_id: $.data.id }
            - call: "POST /athletics/degree-applicability-rules"
              payload: { degree_program_id: "${dp41_id}", course_id: "${art_id}", effective_catalog_year: 2026, applicability: "ELECTIVE" }
              as: Registrar
            - call: "POST /athletics/degree-applicability-rules"
              payload: { degree_program_id: "${dp41_id}", course_id: "${mus_id}", effective_catalog_year: 2026, applicability: "ELECTIVE" }
              as: Registrar
            - call: "POST /athletics/student-athletes"
              payload: { full_name: "Sam Fortyone", sport_code: "TRACK", entry_term_index: 1, entry_catalog_year: 2026 }
              as: Registrar
              captures: { s41_id: $.data.id }
            - call: "POST /athletics/student-athletes/${s41_id}/major-declaration"
              payload: { declared_program_id: "${dp41_id}", term_id: "${term1_id}" }
              as: AcademicAdvisor
            - call: "POST /athletics/enrollments"
              payload: { student_athlete_id: "${s41_id}", course_id: "${art_id}", term_id: "${term1_id}" }
              as: Registrar
              captures: { e41_art_id: $.data.id }
            - call: "POST /athletics/enrollments"
              payload: { student_athlete_id: "${s41_id}", course_id: "${mus_id}", term_id: "${term1_id}" }
              as: Registrar
              captures: { e41_mus_id: $.data.id }
            - call: "POST /athletics/enrollments/${e41_art_id}/outcome"
              payload: { action: "RECORD_GRADE", grade: "B" }
              as: Registrar
          trigger:
            - call: "POST /athletics/enrollments/${e41_mus_id}/outcome"
              payload: { action: "RECORD_GRADE", grade: "B" }
              as: Registrar
          assert:
            - "The response is HTTP 200 with data.status == COMPLETED, data.grade_points == 3.00 and data.earned_credit_hours == 8.00"
            - "data.degree_applicable_credits_counted == 4.00 - the crossing row contributes only the 12.00 - 8.00 headroom"
            - "Enrollment.${e41_art_id}.degree_applicable_credits_counted == 8.00 (the earlier subject_code keeps its full credits)"
            - "StudentAthlete.${s41_id}.degree_applicable_credits == 12.00 and progress_pct == 0.2000 (12.00 / 60.00)"
            - "StudentAthlete.${s41_id}.cumulative_gpa == 3.00 and completed_full_time_terms == 1 (16.00 attempted >= 12)"
            - "StudentAthlete.${s41_id}.risk_score == 0.00, risk_tier == TIER_1, required_study_hall_hours == 0.0 and support_status == SUPPORT_NORMAL"

      - name: transfer_credit_waterfall_fills_core_before_elective
        claim_type: aggregation
        grounds:
          - calculations.transfer_credit_acceptance.formula
          - constants.TRANSFER_CORE_CAP
          - entities.Enrollment.fields.credit_source
        distinguishing_aspect: "The waterfall accepts 12.00 CORE and 8.00 ELECTIVE transfer credits for 20.00 total while the 6.00 NOT_APPLICABLE credits are discarded rather than spilling into the ELECTIVE bucket that still has 12.00 of headroom."
        test_recipe:
          setup:
            - "Student S42 is an INCOMING_TRANSFER who declared DP42 (catalog_year 2026, total_required_credits 60.00) in 2026FA."
