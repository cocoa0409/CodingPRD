  # ---------------------------------------------------------------------------
  - section: errors
    instances:
      - name: publish_from_in_review_returns_invalid_state
        claim_type: violation_to_error
        grounds: ["errors[ERR_INVALID_STATE]", state_machines.ScriptVersion.APPROVED_to_PUBLISHED]
        distinguishing_aspect: "Publish is only offered from APPROVED; publishing an IN_REVIEW script (even with a matching route version) returns 409 ERR_INVALID_STATE before any OCC check."
        test_recipe:
          setup: ["route ${route1} (version ${route1_v}); script ${s1} IN_REVIEW"]
          setup_api_calls:
            - { call: "POST /rooms", payload: { name: "Parlor", floor: 1, capacity_max: 20, safety_max_party: 12, collection_tier: "STANDARD" }, as: MuseumAdmin, captures: { r1: $.data.id } }
            - { call: "POST /tour-routes", payload: { name: "Main Floor", kind: "STANDARD", room_ids: ["${r1}"], duration_minutes: 60, base_price_cents: 1000 }, as: MuseumAdmin, captures: { route1: $.data.id, route1_v: $.data.version } }
            - { call: "POST /tour-routes/${route1}/script-versions", payload: { content_text: "Draft", curriculum_standards: [] }, as: Curator, captures: { s1: $.data.id } }
            - { call: "POST /script-versions/${s1}/submit", payload: {}, as: Curator }
          trigger:
            - { call: "POST /script-versions/${s1}/publish", payload: { expected_route_version: "${route1_v}" }, as: MuseumAdmin }
          assert:
            - "http_status == 409 and error_id == ERR_INVALID_STATE (state priority 5 before OCC priority 6)"

      - name: error_envelope_shape_on_failure
        claim_type: violation_to_error
        grounds: [response_envelope, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "Error responses use the fixed envelope: response_type == 'error', data.error_id / data.message present, meta.api_request_id present."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /rooms/00000000-0000-0000-0000-000000000000", payload: {}, as: MuseumAdmin, captures: { eid: $.data.error_id } }
          assert:
            - "response envelope: response_type == 'error', data.error_id == 'ERR_NOT_FOUND', data.message present, meta.api_request_id present"

