              as_user_id: "pa-1"
          assert:
            - "trigger[1] reports no_show_registration_ids == [${reg_id}] and expired_application_ids == [${app_id}] while ExamRegistration.${reg_id}.seat_status is still SCHEDULED and EligibilityApplication.${app_id}.status is still APPROVED"
            - "trigger[2] reports the same two id lists and now ExamRegistration.${reg_id}.seat_status == NO_SHOW and EligibilityApplication.${app_id}.status == EXPIRED"
            - "after trigger[2] ExamSession.${sess_id}.seats_reserved == 0 and ExamSession.${sess_id}.status == OPEN — the no-show released the seat"
            - "after trigger[2] EligibilityApplication.${app_id}.attempts_consumed == 1 — the attempt is consumed even though no score exists"
            - "trigger[2] reports lapsed_cycle_ids == [] and expired_certificant_ids == [] because no Certificant was ever minted"
            - "trigger[3] reports no_show_registration_ids == [] and expired_application_ids == [] and leaves seat_status NO_SHOW, application status EXPIRED, seats_reserved 0 and attempts_consumed 1 unchanged"
      - name: form_assembly_links_program_and_items_and_rejects_an_unknown_item_or_a_stray_pretest_id
        claim_type: cross_reference_link
        grounds:
          - endpoints.POST_/forms
          - validations[priority=4]
          - validations[priority=24]
          - errors.ERR_ITEM_NOT_FOUND
          - errors.ERR_ITEM_NOT_IN_FORM
          - entities.ExamForm.computed_fields.scored_item_count
          - entities.ExamForm.fields.item_ids
          - entities.ExamForm.fields.panelist_user_ids
        distinguishing_aspect: |
          POST /forms is the only link between a programme and its items, and both sides must
          resolve: an unknown item id is refused 404 ERR_ITEM_NOT_FOUND, a pretest_item_ids
          entry that is not inside item_ids is refused 422 ERR_ITEM_NOT_IN_FORM, and the
          accepted call stores the association with status ASSEMBLED, panel_status OPEN,
          panel_ratings [] and scored_item_count 1 computed as len(item_ids) -
          len(pretest_item_ids).
        test_recipe:
          setup:
            - "One ACTIVE programme CPX with form_length 1 and domain_specs [{D1, 100, min_operational_items 1}]."
            - "Two APPROVED items in domain D1: ${itemA_id} and ${itemB_id}, neither cited by any form yet."
            - "The id 00000000-0000-0000-0000-000000000000 belongs to no Item row."
          setup_api_calls:
            - call: "POST /programs"
              payload: {"name": "Certified Practitioner X", "credential_code": "CPX", "jta_version": "JTA-2026.1", "domain_specs": [{"domain_code": "D1", "weight_pct": 100, "min_operational_items": 1}], "form_length": 1, "accepted_education_credentials": ["BACHELOR"], "psychometric_stat_basis": "POOLED", "min_panelists": 1, "panel_trim_count": 0, "audit_every_nth": 7, "cycle_length_months": 12, "required_ceu_credits": 12}
              as: ProgramAdmin
              as_user_id: "pa-1"
              captures: { prog_id: "$.data.id" }
            - call: "POST /programs/${prog_id}/activate"
              payload: {"activation_note": "CPX live"}
              as: ProgramAdmin
              as_user_id: "pa-1"
            - call: "POST /items"
              payload: {"program_id": "${prog_id}", "domain_code": "D1", "cognitive_level": "APPLICATION", "stem": "CPX item A"}
              as: ItemSpecialist
              as_user_id: "isp-author"
              captures: { itemA_id: "$.data.id" }
            - call: "POST /items/${itemA_id}/submit-for-review"
              payload: {"revision_note": "ready"}
              as: ItemSpecialist
              as_user_id: "isp-author"
            - call: "POST /items/${itemA_id}/review"
              payload: {"decision": "APPROVE"}
              as: ItemSpecialist
              as_user_id: "isp-rev-1"
            - call: "POST /items/${itemA_id}/review"
              payload: {"decision": "APPROVE"}
              as: ItemSpecialist
              as_user_id: "isp-rev-2"
            - call: "POST /items"
              payload: {"program_id": "${prog_id}", "domain_code": "D1", "cognitive_level": "APPLICATION", "stem": "CPX item B"}
              as: ItemSpecialist
              as_user_id: "isp-author"
              captures: { itemB_id: "$.data.id" }
            - call: "POST /items/${itemB_id}/submit-for-review"
              payload: {"revision_note": "ready"}
              as: ItemSpecialist
              as_user_id: "isp-author"
            - call: "POST /items/${itemB_id}/review"
              payload: {"decision": "APPROVE"}
              as: ItemSpecialist
              as_user_id: "isp-rev-1"
            - call: "POST /items/${itemB_id}/review"
              payload: {"decision": "APPROVE"}
              as: ItemSpecialist
              as_user_id: "isp-rev-2"
          trigger:
            - call: "POST /forms"
              payload: {"program_id": "${prog_id}", "form_code": "CPX-F0", "item_ids": ["00000000-0000-0000-0000-000000000000"], "panelist_user_ids": ["pan-1"], "panel_method": "MODIFIED_ANGOFF"}
              as: Psychometrician
              as_user_id: "psy-1"
              captures: { err_item: "$.data.error_id" }
            - call: "POST /forms"
              payload: {"program_id": "${prog_id}", "form_code": "CPX-F0", "item_ids": ["${itemA_id}"], "pretest_item_ids": ["${itemB_id}"], "panelist_user_ids": ["pan-1"], "panel_method": "MODIFIED_ANGOFF"}
              as: Psychometrician
              as_user_id: "psy-1"
              captures: { err_subset: "$.data.error_id" }
            - call: "POST /forms"
              payload: {"program_id": "${prog_id}", "form_code": "CPX-F1", "item_ids": ["${itemA_id}"], "panelist_user_ids": ["pan-1"], "panel_method": "MODIFIED_ANGOFF"}
              as: Psychometrician
              as_user_id: "psy-1"
              captures: { form_id: "$.data.id" }
          assert:
            - "trigger[0] responds 404 with ${err_item} == ERR_ITEM_NOT_FOUND and no ExamForm row is created"
            - "trigger[1] responds 422 with ${err_subset} == ERR_ITEM_NOT_IN_FORM because ${itemB_id} is not inside item_ids"
            - "${err_subset} is not ERR_FORM_LENGTH_MISMATCH — len(item_ids) == 1 == form_length"
            - "trigger[2] responds 201 with ExamForm.${form_id}.status == ASSEMBLED, panel_status == OPEN and panel_ratings == []"
            - "ExamForm.${form_id}.item_ids == [${itemA_id}], pretest_item_ids == [], scored_item_count == 1 and retired_item_count == 0"
            - "ExamForm.${form_id}.panelist_user_ids == [pan-1], raw_cut_score == null and version == 1"
            - "GET /forms with program_id ${prog_id} returns total_count == 1 — the two refused calls linked nothing"
      - name: registry_verify_reads_the_public_projection_without_headers_and_hides_unknown_numbers
        claim_type: computed_read
        grounds:
          - endpoints.GET_/registry/verify
          - errors.ERR_CERTIFICANT_NOT_FOUND
          - entities.Certificant.fields.certificate_number
          - entities.Certificant.computed_fields.publication_status
          - validations[priority=1]
          - roles.Public
        distinguishing_aspect: |
          GET /registry/verify is the only endpoint that requires no X-User-ID and no X-Role,
          and its response is a derived projection rather than the stored row: it reports
          certificate_number, credential_code, full_name, credential_status ACTIVE,
          publication_status PUBLISHED, issued_on 2026-08-10, valid_through 2027-08-10 and a
