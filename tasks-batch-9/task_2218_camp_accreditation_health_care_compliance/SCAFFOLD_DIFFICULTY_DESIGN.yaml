              as: AccreditationOfficer
              as_user_id: "officer-1"
              captures: { cyc_e_id: "$.data.id" }
            - call: "POST /accreditation/cycles"
              payload: { camp_id: "${camp_w_id}", standards_set_id: "${pset_id}", cycle_year: 2026, expected_camp_version: "${camp_w_v}" }
              as: AccreditationOfficer
              as_user_id: "officer-1"
              captures: { cyc_w_id: "$.data.id" }
