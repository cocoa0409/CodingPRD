    side_effects: ["available_balance_cents incremented and drawn_total_cents decremented by reinstatement_amount_cents; penal_sum_cents unchanged", "status PARTIALLY_DRAWN|INSUFFICIENT -> ACTIVE on a full reinstatement, else a PARTIALLY_DRAWN self-loop", "Lease.compliance_status and Lease.contract_status are NOT changed", "increments PerformanceBond.version by 1"]
