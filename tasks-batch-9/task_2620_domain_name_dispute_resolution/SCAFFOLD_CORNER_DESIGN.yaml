            - call: "GET /udrp/precedents"
              payload: { outcome: "CANCELLATION" }
              as: Panelist
              as_user_id: "${pan_id}"
              captures: { cancel_total: "$.meta.total_count" }
            - call: "GET /udrp/precedents"
              payload: { outcome: "TRANSFER", include_superseded: false, limit: 10, offset: 1 }
              as: CaseManager
              as_user_id: "cm-001"
              captures: { page2_total: "$.meta.total_count", page2_has_more: "$.meta.has_more" }
            - call: "GET /udrp/decisions/${dec_id}/precedent-entry"
              payload: {}
              as: Complainant
              as_user_id: "${cpl_id}"
              captures: { entry_digest: "$.data[0].digest_text", entry_weight: "$.data[0].precedent_weight" }
            - call: "GET /udrp/decisions/${dec_id}/votes"
              payload: {}
              as: Panelist
              as_user_id: "${pan_id}"
              captures: { ballot_total: "$.meta.total_count", ballot_seat: "$.data[0].seat", ballot_vote: "$.data[0].vote", ballot_rdnh: "$.data[0].rdnh_vote", ballot_voter: "$.data[0].voter_panelist_id", ballot_rationale: "$.data[0].rationale" }
          assert:
            - "Publication returns HTTP 201 with the PrecedentEntry row: published_at 2026-08-01T00:00:00Z, redaction_level PARTY_NAMES, precedent_tags the two supplied tags, citation_count 0 and precedent_weight 0.00 (in-degree 0 gives 0.00 at any age)"
            - "digest_text is '${case_no} | TRANSFER | rdnh=false' - the caller-supplied digest is discarded because the field is source system"
            - "Decision.${dec_id}.publication_status is REDACTED, not PUBLISHED, because redaction_level is PARTY_NAMES; Decision.status is still ISSUED, so the publication dimension moved on its own"
            - "citable is true and superseded is false: PARTY_NAMES redaction is still citable, only FULL is not"
            - "GET /udrp/precedents?citable=true&limit=1&offset=0 returns meta.total_count 1 with has_more false and data[0].decision_id == ${dec_id}"
            - "GET /udrp/precedents?outcome=CANCELLATION returns meta.total_count 0 with an empty data array - the filter reads the decision's outcome, not the tags"
            - "GET /udrp/precedents?outcome=TRANSFER&offset=1 returns meta.total_count 1 with has_more false and an empty page, because total_count counts matches and not the returned window"
            - "GET /udrp/decisions/${dec_id}/precedent-entry re-runs the metrics on read and returns the same digest and precedent_weight 0.00"
            - "GET /udrp/decisions/${dec_id}/votes still returns meta.total_count 1 with data[0].seat SOLE, data[0].vote TRANSFER, data[0].rdnh_vote false, data[0].voter_panelist_id == ${pan_id} and data[0].rationale 'Transfer ordered.' - publication redacts the precedent entry, never the underlying ballots, and PanelVote rows are immutable"

