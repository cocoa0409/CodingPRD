          - state_machines.CostRecoveryClaim.transitions.CLAIM_FILED_to_DISMISSED
        distinguishing_aspect: "One code guards three different illegal moves on the same claim — settling before filing, filing twice, and resolving a terminal claim — while the recovery ceiling is checked strictly against the filed claimed_cents rather than against the larger claim_basis_cents the claim was created with."
