        claim_type: side_effect_execution
        grounds: ["\"concurrency_rules[dividend-option-stale-version\"]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "POST /policies/{id}/dividend-option with a stale expected_policy_version returns 412 ERR_STALE_VERSION; correct version succeeds."
        test_recipe:
          setup: ["Policy issued at version=1; client reads version=1; another client posts a dividend declaration (bumps version to 2); first client retries with stale version=1"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /insured-persons"
              payload: { full_name: "Nick N2", date_of_birth: "1977-05-05T00:00:00Z", tobacco_user: false, gender: "MALE" }
              as: Agent
              captures: { ip_n2: $.data.id }
            - call: "POST /product-templates"
              payload: { product_code: "WL-PAR-N2", product_type: "WHOLE_LIFE_PARTICIPATING", participating: true, allows_policy_loans: true, min_face_amount_cents: 1000000, max_face_amount_cents: 100000000, base_monthly_premium_rate_per_thousand_cents: 60, coi_rate_table: [], surrender_charge_schedule: [] }
              as: PlatformAdmin
              captures: { tpl_n2: $.data.id }
            - call: "POST /applications"
              payload: { insured_person_id: "${ip_n2}", product_template_id: "${tpl_n2}", requested_face_amount_cents: 10000000, premium_mode: "ANNUAL" }
              as: Agent
              captures: { app_n2: $.data.id }
            - call: "POST /applications/${app_n2}/begin-review"
              payload: {}
              as: Underwriter
            - call: "POST /applications/${app_n2}/approve"
              payload: { underwriting_class: "STANDARD_NON_TOBACCO" }
              as: Underwriter
            - call: "POST /applications/${app_n2}/issue"
              payload: {}
              as: PolicyIssuer
              captures: { pol_n2: $.data.id }
            - call: "GET /policies/${pol_n2}"
              payload: {}
              as: Policyholder
              as_user_id: "${ip_n2}"
              captures: { pol_n2_v: $.data.version }
