      - name: outreach_coverage_counts_the_earliest_row_per_investor_key_only
        claim_type: aggregation
        grounds:
          - calculations.outreach_coverage
          - entities.PayProgram.fields.outreach_coverage_pct
          - entities.OutreachEngagement.fields.investor_key
          - state_machines.OutreachEngagement.SCHEDULED_to_HELD
        distinguishing_aspect: |
          The running coverage total dedupes by investor_key keeping the EARLIEST created_at row and counts only
          HELD engagements: holding BlackRock's first row lifts coverage to 20.00, holding BlackRock's second row
          (5.00) leaves it at 20.00 instead of 25.00, and holding Vanguard lifts it to 31.00 — never the naive
          36.00 sum of all three ownership_pct values.
