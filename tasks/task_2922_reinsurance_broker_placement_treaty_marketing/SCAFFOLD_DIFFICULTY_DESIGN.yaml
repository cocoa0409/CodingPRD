          - state_machines.ClaimAdvocacy.transitions.UNDER_REVIEW_to_DISPUTED
          - state_machines.ClaimAdvocacy.transitions.DISPUTED_to_ADVOCACY_ARBITRATION
          - state_machines.ClaimAdvocacy.transitions.ADVOCACY_ARBITRATION_to_RESOLVED
          - state_machines.ClaimAdvocacy.transitions.RESOLVED_to_COLLECTED
          - entities.ClaimAdvocacy.fields.arbitration_cost_minor
