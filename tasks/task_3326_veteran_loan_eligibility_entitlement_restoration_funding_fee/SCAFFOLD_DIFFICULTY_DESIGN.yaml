- rule_id: resource_temporal_overlap
  instances:
  - name: service_period_closed_interval_touching_collides
    grounds:
    - calculations.qualifying_service_days
    - validations[priority=19]
    - errors[ERR_SERVICE_PERIOD_OVERLAP]
    distinguishing_aspect: 'Resource = Veteran service timeline, CLOSED-interval semantics: an

      existing period 2020-01-10..2021-01-09 collides with a new period

      starting exactly 2021-01-09 (shared endpoint counts as overlap).

      '
    test_recipe:
      setup:
      - Veteran v23 with one existing period 2020-01-10..2021-01-09
      setup_api_calls:
      - call: POST /va-loans/veterans
        payload:
