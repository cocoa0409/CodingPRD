      - name: waiver_and_screening_guards_are_rejected_with_distinct_errors
        claim_type: error_triggerable
        grounds:
          - errors.ERR_SCREENING_NOT_REVIEWABLE
          - errors.ERR_DISCREPANCY_CODE_UNKNOWN
          - errors.ERR_WAIVER_RESPONSE_PENDING
          - errors.ERR_WAIVER_NOT_PENDING
          - errors.ERR_WAIVER_WINDOW_CLOSED
          - state_machines.WaiverRequest
        distinguishing_aspect: |
          Five errors around the discrepancy-waiver loop. Reviewing a CLEAR
          screening check is 409 ERR_SCREENING_NOT_REVIEWABLE, not a silent no-op:
          only HIT_PENDING_REVIEW is reviewable. ERR_DISCREPANCY_CODE_UNKNOWN (422)
          is reachable from BOTH ends - raising INSURANCE_UNDERVALUED on an FOB
          credit that has no insurance requirement, and naming
          TRANSHIPMENT_NOT_ALLOWED in a waiver request when no such discrepancy was
          ever raised. Refusing while a waiver is PENDING is the specific 409
          ERR_WAIVER_RESPONSE_PENDING rather than the generic
          ERR_PRESENTATION_NOT_EXAMINABLE. Answering a resolved request is 409
          ERR_WAIVER_NOT_PENDING, while answering a still-PENDING request one day
          past deadline_at is the different 409 ERR_WAIVER_WINDOW_CLOSED - and the
          deadline is 2026-08-12T23:59:59.999Z because WAIVER_RESPONSE_DAYS (2)
          bites before the examination_deadline of 2026-08-17T23:59:59.999Z.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-10T09:00:00Z (a Monday)."
