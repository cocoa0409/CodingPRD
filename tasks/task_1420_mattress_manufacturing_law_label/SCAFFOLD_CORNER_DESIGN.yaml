        grounds: ["validations[priority=8]", "errors[ERR_DROPSHIP_NOT_ENABLED]"]
        distinguishing_aspect: "ship_method DROP_SHIP for a retailer with drop_ship_enabled false fails with ERR_DROPSHIP_NOT_ENABLED; the same payload with WAREHOUSE succeeds."
        test_recipe:
