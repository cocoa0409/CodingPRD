            - call: "POST /trade-packages/${tp_id}/subcontracts"
              payload: { subcontractor_name: "BC", source_bid_id: "${bid_1}", flow_down_terms: "fd", payment_terms: { retainage_pct: 0.10, pay_if_paid: true }, change_authority_limits: [{ max_value_cents: -1, max_cumulative_pct: -1, roles: ["OperationsManager"] }] }
