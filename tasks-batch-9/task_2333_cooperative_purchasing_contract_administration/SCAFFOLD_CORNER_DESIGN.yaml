      - name: solicitation_lifecycle_error_family_is_triggerable_end_to_end
        claim_type: Error Triggerable
        grounds:
          - errors.ERR_RESPONSE_DUE_IN_PAST
          - errors.ERR_STATE_LAW_RULE_NOT_FOUND
          - errors.ERR_RESPONSE_WINDOW_OPEN
          - errors.ERR_DUPLICATE_RESPONSE
          - errors.ERR_SOLICITATION_CLOSED_FOR_RESPONSES
          - errors.ERR_TECHNICAL_SCORE_MISSING
          - errors.ERR_INSUFFICIENT_RESPONSIVE_RESPONSES
          - state_machines.Solicitation.status.EVALUATION_to_FAILED
        distinguishing_aspect: >-
          Seven distinct lifecycle errors are reached from one fixture, each by a single minimal deviation: a due date in the past, a lead state with no StateLawRule row, an evaluation opened before the due date, a second response from the same supplier, a response arriving after evaluation opened, MARK_RESPONSIVE with no technical_score in the body, and RECOMMEND_AWARD with zero responsive rows - and the fixture then legitimately FAILs, which demotes the surviving SUBMITTED response to NON_RESPONSIVE.
