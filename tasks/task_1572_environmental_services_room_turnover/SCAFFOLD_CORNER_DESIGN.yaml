              payload: {}
              as: InfectionPreventionist
            - call: "POST /evs/outbreak-events/${e1}/activate"
              payload: {}
              as: InfectionPreventionist
              captures: { err_reactivate: $.data.error_id }
            - call: "POST /evs/outbreak-events/${e2}/activate"
              payload: {}
              as: InfectionPreventionist
              captures: { err_second: $.data.error_id }
            - call: "POST /evs/outbreak-events/${e2}/lift"
              payload: {}
              as: InfectionPreventionist
              captures: { err_lift_declared: $.data.error_id }
