  - rule_id: compensating_invariant
    instances:
      - name: advance_reversal_restores_advance_principal_ledger_but_not_the_nonrecoverable_flag
        grounds:
          - state_machines.Advance.OUTSTANDING_to_REVERSED
          - state_machines.Advance.OUTSTANDING_to_DEEMED_NONRECOVERABLE
          - calculations.advance_interest_accrual
          - validations[priority=28]
          - errors.ERR_INVALID_STATE_TRANSITION
          - errors.ERR_NONRECOVERABLE_ADVANCE_OUTSTANDING
        distinguishing_aspect: |
          Conserved quantity = advance PRINCIPAL outstanding, held in two places at once
          (loan.advances_outstanding_usd and trust.total_advances_outstanding_usd). Reversing every
          advance must drive both ledgers back to exactly 0.00 with no residue of the accrued 30/360
          interest, which is itself zeroed because a reversed advance is treated as never funded. The
          compensation is deliberately partial in two ways that the probes pin down: an advance that
          has already been DEEMED_NONRECOVERABLE can no longer be reversed at all, and the block that
          determination places on new advances survives the reversal of the other advances — the
          ledger is restored, the credit judgement is not.
        test_recipe:
          setup:
            - "Clock at the default 2026-08-01T00:00:00Z, so 30/360 interest is exactly computable for every advance."
            - "Loan A in SPECIAL_SERVICING under a trust with advance_interest_rate_pct 5.0."
            - "Advance A: TAX_INSURANCE_ADVANCE of 200,000.00 advanced on 2026-02-01 (180 days -> 5,000.00 interest)."
            - "Advance B: PROPERTY_PROTECTION_ADVANCE of 150,000.00 advanced on 2026-04-01 (120 days -> 2,500.00 interest)."
            - "Advance C: TAX_INSURANCE_ADVANCE of 90,000.00 advanced on 2026-06-01 (60 days -> 750.00 interest), then DEEMED_NONRECOVERABLE."
            - "No PI_ADVANCE is used anywhere, so validations priority 27 never participates."
          setup_api_calls:
            - call: "POST /special-servicing/trusts"
              payload: { deal_name: "CMBS 2026-A1", closing_date: "2026-01-15T00:00:00Z", original_controlling_class_balance_usd: 40000000 }
              as: PlatformAdmin
              as_user_id: "admin-001"
              captures: { trust_id: "$.data.id" }
            - call: "POST /special-servicing/loans"
              payload: { trust_id: "${trust_id}", loan_number: "L-A01", original_balance_usd: 12000000, current_principal_balance_usd: 10000000, note_rate_pct: 6.0, monthly_debt_service_usd: 65000, maturity_date: "2029-06-01T00:00:00Z", securitization_value_usd: 15000000 }
              as: MasterServicer
              as_user_id: "ms-001"
              captures: { loan_id: "$.data.id" }
            - call: "POST /special-servicing/transfer-events"
              payload: { loan_id: "${loan_id}", event_code: "MONETARY_DEFAULT_60D", occurred_on: "2026-07-01T00:00:00Z", evidence_note: "two missed debt service payments", days_delinquent_at_event: 60 }
              as: MasterServicer
              as_user_id: "ms-001"
            - call: "POST /special-servicing/loans/${loan_id}/servicing-status"
              payload: { to_status: "SPECIAL_SERVICING" }
              as: MasterServicer
              as_user_id: "ms-001"
            - call: "GET /special-servicing/loans/${loan_id}"
              as: MasterServicer
              as_user_id: "ms-001"
              captures: { advances_before: "$.data.advances_outstanding_usd" }
            - call: "GET /special-servicing/trusts/${trust_id}"
              as: MasterServicer
              as_user_id: "ms-001"
              captures: { trust_advances_before: "$.data.total_advances_outstanding_usd" }
            - call: "POST /special-servicing/advances"
              payload: { loan_id: "${loan_id}", advance_type: "TAX_INSURANCE_ADVANCE", amount_usd: 200000, advanced_on: "2026-02-01T00:00:00Z" }
              as: MasterServicer
              as_user_id: "ms-001"
              captures: { advance_a_id: "$.data.id" }
            - call: "POST /special-servicing/advances"
              payload: { loan_id: "${loan_id}", advance_type: "PROPERTY_PROTECTION_ADVANCE", amount_usd: 150000, advanced_on: "2026-04-01T00:00:00Z" }
              as: MasterServicer
              as_user_id: "ms-001"
              captures: { advance_b_id: "$.data.id" }
            - call: "POST /special-servicing/advances"
              payload: { loan_id: "${loan_id}", advance_type: "TAX_INSURANCE_ADVANCE", amount_usd: 90000, advanced_on: "2026-06-01T00:00:00Z" }
              as: MasterServicer
              as_user_id: "ms-001"
              captures: { advance_c_id: "$.data.id" }
            - call: "GET /special-servicing/loans/${loan_id}"
              as: MasterServicer
              as_user_id: "ms-001"
              captures: { advances_peak: "$.data.advances_outstanding_usd" }
            - call: "POST /special-servicing/advances/${advance_c_id}/status"
              payload: { to_status: "DEEMED_NONRECOVERABLE", reversal_reason: "appraised value will not support recovery of this advance" }
              as: MasterServicer
              as_user_id: "ms-001"
              captures: { c_status: "$.data.status", c_determined_on: "$.data.nonrecoverable_determined_on" }
          trigger:
            - call: "POST /special-servicing/advances/${advance_c_id}/status"
              payload: { to_status: "REVERSED", reversal_reason: "attempt to undo a nonrecoverable determination" }
              as: MasterServicer
              as_user_id: "ms-001"
              captures: { reverse_terminal_error: "$.data.error_id" }
            - call: "POST /special-servicing/advances/${advance_a_id}/status"
              payload: { to_status: "REVERSED", reversal_reason: "advance was funded from the wrong servicing account" }
              as: MasterServicer
              as_user_id: "ms-001"
              captures: { a_status: "$.data.status", a_interest_after: "$.data.accrued_interest_usd" }
            - call: "POST /special-servicing/advances/${advance_b_id}/status"
              payload: { to_status: "REVERSED", reversal_reason: "duplicate property protection disbursement" }
              as: MasterServicer
              as_user_id: "ms-001"
              captures: { b_status: "$.data.status", b_interest_after: "$.data.accrued_interest_usd" }
            - call: "GET /special-servicing/loans/${loan_id}"
              as: MasterServicer
              as_user_id: "ms-001"
              captures: { advances_after: "$.data.advances_outstanding_usd" }
            - call: "GET /special-servicing/trusts/${trust_id}"
              as: MasterServicer
              as_user_id: "ms-001"
              captures: { trust_advances_after: "$.data.total_advances_outstanding_usd" }
            - call: "POST /special-servicing/advances"
              payload: { loan_id: "${loan_id}", advance_type: "TAX_INSURANCE_ADVANCE", amount_usd: 10000, advanced_on: "2026-08-01T00:00:00Z" }
              as: MasterServicer
              as_user_id: "ms-001"
              captures: { blocked_advance_error: "$.data.error_id" }
          assert:
            - "Before any advance: Loan.advances_outstanding_usd == 0.00 and Trust.total_advances_outstanding_usd == 0.00"
            - "After A, B and C: Loan.advances_outstanding_usd == 440000.00 and Trust.total_advances_outstanding_usd == 440000.00"
            - "Read interest at the clock: Advance A 5000.00 (180 days), Advance B 2500.00 (120 days), Advance C 750.00 (60 days), each with interest_accrued_through 2026-08-01T00:00:00Z"
            - "After C is DEEMED_NONRECOVERABLE: Loan.advances_outstanding_usd == 350000.00, Trust.total_advances_outstanding_usd == 350000.00, and C.nonrecoverable_determined_on == 2026-08-01T00:00:00Z"
            - "Probe 1 returns HTTP 409 with error_id ERR_INVALID_STATE_TRANSITION — DEEMED_NONRECOVERABLE is terminal, so the reversal compensation is unavailable"
            - "Probe 2 returns HTTP 200 with status REVERSED and accrued_interest_usd 0.00; Loan.advances_outstanding_usd drops to 150000.00"
            - "Probe 3 returns HTTP 200 with status REVERSED and accrued_interest_usd 0.00"
            - "Final ledger: Loan.${loan_id}.advances_outstanding_usd == 0.00 and Trust.${trust_id}.total_advances_outstanding_usd == 0.00 — byte-identical to the pre-advance reading, with no interest residue anywhere"
            - "Advance A and B keep reimbursed_principal_usd 0.00 and reimbursed_interest_usd 0.00; the reversal writes no reimbursement"
            - "Probe 4 returns HTTP 409 with error_id ERR_NONRECOVERABLE_ADVANCE_OUTSTANDING: the ledger was restored but advance C's determination still blocks every new advance on the loan"
            - "Loan.${loan_id}.realized_loss_usd is still 0.00 — a nonrecoverable determination is not a realized loss until the waterfall runs"

      - name: ara_reversal_restores_controlling_class_notional_but_not_the_waived_consultation
        grounds:
          - state_machines.AppraisalReduction.EFFECTIVE_to_REVERSED
          - calculations.appraisal_reduction_amount
          - calculations.controlling_class_control_test
          - calculations.ara_adjusted_advance_obligation
          - state_machines.ConsultationRequest.PENDING_to_WAIVED
        distinguishing_aspect: |
          A different conserved quantity from the advance instance: the controlling class notional
          identity original_controlling_class_balance_usd - total_ara_usd - realized_loss_usd, and the
          derived loan-level P&I advance obligation that hangs off it. Reversal must walk the whole
          four-link ARA cascade backwards — loan ARA and P&I obligation, trust total ARA, notional,
          control_status CONSULTING_ONLY back to CONTROLLING — and land on exactly the pre-effective
          figures. What it must NOT do is un-waive the consultation that the control termination
          waived or pull the workout plan back from CONSENT_SATISFIED to CONSULTATION: that
          asymmetry is the point, and the final probe shows the plan can still be approved on a
          consent the controlling class never actually gave.
        test_recipe:
          setup:
            - "Clock at the default 2026-08-01T00:00:00Z."
            - "Trust with original_controlling_class_balance_usd 8,000,000.00, so the 25% control threshold is exactly 2,000,000.00."
            - "Loan C with current_principal_balance_usd 19,500,000.00 and monthly_debt_service_usd 118,000.00, in SPECIAL_SERVICING, no advances and no accrued unpaid interest."
            - "An UPDATE appraisal RECEIVED at value_usd 14,999,999 as of 2026-08-01 and then ACCEPTED, which auto-creates the PROVISIONAL AppraisalReduction of 6,000,000.90."
            - "A MODIFICATION workout plan taken to RECOMMENDED and then to CONSULTATION by issuing a CONSENT_RIGHT consultation, which is left PENDING."
            - "The AppraisalReduction is then made EFFECTIVE, which terminates control and waives that consultation."
          setup_api_calls:
            - call: "POST /special-servicing/trusts"
              payload: { deal_name: "CMBS 2026-C1", closing_date: "2026-01-15T00:00:00Z", original_controlling_class_balance_usd: 8000000 }
              as: PlatformAdmin
              as_user_id: "admin-001"
              captures: { trust_id: "$.data.id", notional_before: "$.data.controlling_class_notional_usd" }
            - call: "POST /special-servicing/loans"
              payload: { trust_id: "${trust_id}", loan_number: "L-C01", original_balance_usd: 20000000, current_principal_balance_usd: 19500000, note_rate_pct: 6.5, monthly_debt_service_usd: 118000, maturity_date: "2028-06-01T00:00:00Z", securitization_value_usd: 26000000 }
              as: MasterServicer
              as_user_id: "ms-001"
              captures: { loan_id: "$.data.id", pi_before: "$.data.required_monthly_pi_advance_usd" }
            - call: "POST /special-servicing/transfer-events"
              payload: { loan_id: "${loan_id}", event_code: "MONETARY_DEFAULT_60D", occurred_on: "2026-07-01T00:00:00Z", evidence_note: "two missed debt service payments", days_delinquent_at_event: 60 }
              as: MasterServicer
              as_user_id: "ms-001"
            - call: "POST /special-servicing/loans/${loan_id}/servicing-status"
              payload: { to_status: "SPECIAL_SERVICING" }
              as: MasterServicer
              as_user_id: "ms-001"
            - call: "POST /special-servicing/appraisals"
              payload: { loan_id: "${loan_id}", appraisal_type: "UPDATE", ordered_on: "2026-08-01T00:00:00Z", appraiser_firm: "Acme Valuation", valuation_valid_months: 12 }
              as: SpecialServicerAssetManager
              as_user_id: "amgr-001"
              captures: { appraisal_id: "$.data.id" }
            - call: "POST /special-servicing/appraisals/${appraisal_id}/status"
              payload: { to_status: "RECEIVED", value_usd: 14999999, as_of_date: "2026-08-01T00:00:00Z" }
              as: SpecialServicerAssetManager
              as_user_id: "amgr-001"
            - call: "POST /special-servicing/appraisals/${appraisal_id}/status"
              payload: { to_status: "ACCEPTED" }
              as: SpecialServicerAssetManager
              as_user_id: "amgr-002"
            - call: "GET /special-servicing/appraisal-reductions"
              payload: { loan_id: "${loan_id}", status: "PROVISIONAL" }
              as: SpecialServicerAssetManager
              as_user_id: "amgr-001"
              captures: { ara_id: "$.data[0].id", ara_amount: "$.data[0].ara_amount_usd", ara_pct: "$.data[0].ara_percentage" }
            - call: "GET /special-servicing/loans/${loan_id}"
              as: SpecialServicerAssetManager
              as_user_id: "amgr-001"
              captures: { loan_version: "$.data.version" }
            - call: "POST /special-servicing/workout-plans"
              payload: { loan_id: "${loan_id}", discount_rate_pct: 9.5, npv_basis: "CONTRACTUAL", expected_loan_version: "${loan_version}" }
              as: SpecialServicerAssetManager
              as_user_id: "amgr-001"
              captures: { plan_id: "$.data.id" }
            - call: "POST /special-servicing/workout-alternatives"
              payload: { workout_plan_id: "${plan_id}", alternative_type: "MODIFICATION", projected_cash_flows: [{ period_index: 1, amount_usd: 900000 }, { period_index: 2, amount_usd: 950000 }, { period_index: 3, amount_usd: 1000000 }, { period_index: 4, amount_usd: 8576200 }], upfront_cost_usd: 120000 }
              as: SpecialServicerAssetManager
              as_user_id: "amgr-001"
              captures: { alt_id: "$.data.id" }
            - call: "POST /special-servicing/workout-plans/${plan_id}/status"
              payload: { to_status: "SCORED" }
              as: SpecialServicerAssetManager
              as_user_id: "amgr-001"
            - call: "POST /special-servicing/workout-plans/${plan_id}/status"
              payload: { to_status: "RECOMMENDED", selected_alternative_id: "${alt_id}" }
              as: SpecialServicerAssetManager
              as_user_id: "amgr-001"
            - call: "POST /special-servicing/consultations"
              payload: { trust_id: "${trust_id}", subject_type: "WORKOUT_PLAN", workout_plan_id: "${plan_id}" }
              as: SpecialServicerAssetManager
              as_user_id: "amgr-001"
              captures: { consult_id: "$.data.id", rights_type_before: "$.data.rights_type" }
            - call: "POST /special-servicing/appraisal-reductions/${ara_id}/status"
              payload: { to_status: "EFFECTIVE" }
              as: SpecialServicingCommitteeOfficer
              as_user_id: "cmte-001"
              captures: { ara_effective_on: "$.data.effective_on" }
            - call: "GET /special-servicing/trusts/${trust_id}"
              as: SpecialServicingCommitteeOfficer
              as_user_id: "cmte-001"
              captures: { total_ara_effective: "$.data.total_ara_usd", notional_effective: "$.data.controlling_class_notional_usd", control_effective: "$.data.control_status" }
            - call: "GET /special-servicing/loans/${loan_id}"
              as: SpecialServicingCommitteeOfficer
              as_user_id: "cmte-001"
              captures: { loan_ara_effective: "$.data.ara_amount_usd", pi_effective: "$.data.required_monthly_pi_advance_usd" }
            - call: "GET /special-servicing/consultations/${consult_id}"
              as: SpecialServicingCommitteeOfficer
              as_user_id: "cmte-001"
              captures: { consult_status_effective: "$.data.status" }
          trigger:
            - call: "POST /special-servicing/appraisal-reductions/${ara_id}/status"
              payload: { to_status: "REVERSED", reversal_reason: "appraiser withdrew the report after a scope-of-work error" }
              as: SpecialServicingCommitteeOfficer
              as_user_id: "cmte-001"
              captures: { ara_status_after: "$.data.status", applies_after: "$.data.advance_reduction_applies" }
            - call: "GET /special-servicing/trusts/${trust_id}"
              as: SpecialServicingCommitteeOfficer
              as_user_id: "cmte-001"
              captures: { total_ara_after: "$.data.total_ara_usd", notional_after: "$.data.controlling_class_notional_usd", control_after: "$.data.control_status" }
            - call: "GET /special-servicing/loans/${loan_id}"
              as: SpecialServicingCommitteeOfficer
              as_user_id: "cmte-001"
              captures: { loan_ara_after: "$.data.ara_amount_usd", pi_after: "$.data.required_monthly_pi_advance_usd" }
            - call: "GET /special-servicing/consultations/${consult_id}"
              as: SpecialServicingCommitteeOfficer
              as_user_id: "cmte-001"
              captures: { consult_status_after: "$.data.status", responded_at_after: "$.data.responded_at" }
            - call: "POST /special-servicing/appraisal-reductions/${ara_id}/status"
              payload: { to_status: "REVERSED", reversal_reason: "second attempt at the same compensation" }
              as: SpecialServicingCommitteeOfficer
              as_user_id: "cmte-001"
              captures: { double_reversal_error: "$.data.error_id" }
            - call: "POST /special-servicing/workout-plans/${plan_id}/status"
              payload: { to_status: "APPROVED" }
              as: SpecialServicingCommitteeOfficer
              as_user_id: "cmte-001"
              captures: { plan_status_after: "$.data.status" }
          assert:
            - "At creation: Trust.controlling_class_notional_usd == 8000000.00, control_status CONTROLLING, control threshold 2000000.00; Loan.required_monthly_pi_advance_usd == 118000.00"
            - "The auto-created AppraisalReduction has calculation_basis GROSS_APPRAISED_BASIS, deficiency_base_usd 19500000.00, appraisal_credit_usd 13499999.10, ara_amount_usd 6000000.90 and ara_percentage 30.7692"
            - "After EFFECTIVE: Loan.ara_amount_usd == 6000000.90 and required_monthly_pi_advance_usd == 81692.30; Trust.total_ara_usd == 6000000.90, controlling_class_notional_usd == 1999999.10, control_status == CONSULTING_ONLY"
            - "After EFFECTIVE the consultation is WAIVED and WorkoutPlan.${plan_id}.status is CONSENT_SATISFIED, even though the controlling class never responded"
            - "Reversal returns HTTP 200 with status REVERSED and advance_reduction_applies false"
            - "After reversal: Loan.${loan_id}.ara_amount_usd == 0.00 and required_monthly_pi_advance_usd == 118000.00 — exactly monthly_debt_service_usd again"
            - "After reversal: Trust.${trust_id}.total_ara_usd == 0.00, controlling_class_notional_usd == 8000000.00, control_status == CONTROLLING; the identity 8000000.00 - 0.00 - 0.00 holds at both endpoints"
            - "NOT compensated: ConsultationRequest.${consult_id}.status is still WAIVED with responded_at null and responded_by_user_id null"
            - "NOT compensated: WorkoutPlan.${plan_id}.status is still CONSENT_SATISFIED, so probe 5 returns HTTP 200 with status APPROVED on a consent that was only ever deemed away"
            - "The second reversal attempt returns HTTP 409 with error_id ERR_INVALID_STATE_TRANSITION and leaves every restored figure untouched — the compensation is not repeatable"
            - "Loan.last_appraised_value_usd remains 14999999.00 and the Appraisal stays ACCEPTED: reversing the reduction does not retract the valuation"
