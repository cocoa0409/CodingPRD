      - name: committee_referral_governance_compliance_precedes_collateral_referential
        grounds:
          - validations[priority=30].ERR_GOVERNANCE_NOT_AUTHORIZED
          - validations[priority=38].ERR_COLLATERAL_LINK_BROKEN
          - state_machines.GovernanceAuthorization.transitions["BOARD_VERIFIED -> AUTHORIZED"]
          - endpoints["POST /loan-applications/{loan_application_id}/committee-referral"]
        distinguishing_aspect: |
          Committee referral is attempted three times with no change to the request body.
          Attempt 1 violates both the governance guard (packet only BOARD_VERIFIED because
          the institution requires denominational approval) and the collateral guard (no
          lien assigned) and must return the priority-30 ERR_GOVERNANCE_NOT_AUTHORIZED.
          Attempt 2, after the denominational APPROVE lands the packet in AUTHORIZED,
          must return the priority-38 ERR_COLLATERAL_LINK_BROKEN — proving the lower rule
          was reached only once the higher one was satisfied. Attempt 3, after the lien is
          recorded, succeeds. Any implementation that checks collateral first inverts
          attempts 1 and 2.
