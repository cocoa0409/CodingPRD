              payload: { case_id: "${c4}", scope_code: "STRUCTURE_REBUILD", required_trade_hours: { FRAMING: 400, GENERAL_LABOR: 400 }, estimated_material_cents: 3000000, critical_trades: ["FRAMING"] }
              as: ConstructionManager
              as_user_id: u_cn_1
              captures: { p44: "$.data.id" }
            - call: POST /construction-projects/{id}/transition
              payload: { action: "PERMIT", permit_number: "PB-3304" }
              as: ConstructionManager
              as_user_id: u_cn_1
            - call: POST /funding-sources
              payload: { label: "Structure grant A", source_type: "FOUNDATION_GRANT", restriction_code: "STRUCTURE_REPAIR_ONLY", total_cents: 1552604, expires_on: "2026-10-31", admin_retention_allowed: true }
              as: LTRGAdmin
              as_user_id: u_admin_1
              captures: { fs1: "$.data.id" }
            - call: POST /funding-sources
              payload: { label: "Structure grant B", source_type: "FOUNDATION_GRANT", restriction_code: "STRUCTURE_REPAIR_ONLY", total_cents: 3000000, expires_on: "2026-11-30", admin_retention_allowed: true }
              as: LTRGAdmin
              as_user_id: u_admin_1
              captures: { fs2: "$.data.id" }
            - call: GET /recovery-cases/{id}
              payload: {}
              as: DisbursementOfficer
              as_user_id: u_do_1
              captures: { cv4: "$.data.version" }
            - call: POST /disbursements
              payload: { case_id: "${c4}", purpose_code: "STRUCTURE_REPAIR", requested_cents: 3000000, payee_name: "Ridgeline Builders LLC", expected_case_version: "${cv4}", project_id: "${p44}", commitment_id: "${fc4}" }
              as: DisbursementOfficer
              as_user_id: u_do_1
              captures: { db4: "$.data.id" }
          trigger:
            - call: POST /disbursements/{id}/approve
              payload: { approval_note: "Two-source split." }
              as: LTRGAdmin
              as_user_id: u_admin_1
            - call: GET /funding-sources/{id}
              payload: {}
              as: DisbursementOfficer
              as_user_id: u_do_1
            - call: GET /funding-sources/{id}
              payload: {}
              as: DisbursementOfficer
              as_user_id: u_do_1
          assert:
            - "Approve returns status APPROVED with exactly two allocation_lines in specificity-then-expiry order: line 1 draws on FS_S1 with net_cents 1500100, admin_retained_cents 52504, gross_cents 1552604; line 2 draws on FS_S2 with net_cents 1499900, admin_retained_cents 52497, gross_cents 1552397."
            - "Disbursement totals: net_cents 3000000, admin_retained_cents 105001 (NOT 105000), gross_cents 3105001."
            - "GET FS_S1 shows committed_cents 1552604, available_cents 0, status EXHAUSTED."
            - "GET FS_S2 shows committed_cents 1552397, available_cents 1447603, status OPEN."
            - "FS_U still shows available_cents 2000000 and committed_cents 0."
      - name: bridge_tier_keyed_on_pinned_unmet_not_on_awarded_total
        grounds:
          - "calculations.table_award_assembly"
          - "calculations.table_award_assembly.constants.TIER_A_CEILING_CENTS"
          - "calculations.table_award_assembly.constants.TIER_B_CEILING_CENTS"
          - "calculations.table_award_assembly.constants.BRIDGE_PCT_BPS"
          - "entities.CasePresentation.fields.bridge_tier"
          - "endpoints[POST /case-presentations/{id}/decision]"
        distinguishing_aspect: "With unmet 3000000 the tier is TIER_C (1500 bps -> bridge_cap 450000) and awarded_cents lands at 1950000. An implementation that re-keys the tier on the assembled award total sees 1950000, classifies it TIER_B (3000 bps -> cap 585000), and reports bridge_authorized_cents 585000 / awarded_cents 2085000. The two candidate answers differ in every one of bridge_tier, bridge_authorized_cents, awarded_cents and shortfall_cents."
        test_recipe:
          setup:
            - "Case C5: STRUCTURE damage verified 3000000, no assistance -> PURPOSE_MATCHED unmet 3000000."
            - "MemberOrganization M2 with annual_pledge_cap_cents 1500000 pledges its entire capacity 1500000 (so M2 becomes CAPPED), leaving gap 1500000."
            - "An UNRESTRICTED FundingSource of 2000000 makes the bridge pool ample, so the cap is the only binding constraint."
