  - rule_id: compensating_invariant
    instances:
      - name: qualify_disqualify_round_trip_conserves_totals
        grounds:
          - state_machines.SpendEntry.PENDING_REVIEW_to_QUALIFIED
          - state_machines.SpendEntry.QUALIFIED_to_DISQUALIFIED
          - calculations.qualified_spend_totals
        distinguishing_aspect: |
          Conserved quantity: the application's qualified-spend totals, pinned
          as atl_qualified_cents + btl_qualified_cents == sum of
          effective_amount_cents over QUALIFIED non-superseded entries.
          Forward action (QUALIFY entry E3, +102500000) paired with its
          compensating action (DISQUALIFY E3) returns atl/btl/capped/
          provisional EXACTLY to the pre-pair snapshot (40000000 / 60000000 /
          100000000 / 25000000) — zero drift.
        test_recipe:
          setup:
            - "GA program OPEN; application APPROVED; vendor VERIFIED; entries A1 (ATL 40000000) and B2 (BTL 60000000) already QUALIFIED; entry E3 (BTL resident 100000000) PENDING_REVIEW"
            - "Pre-pair snapshot: atl 40000000, btl 60000000, capped 100000000, provisional 25000000 (@ 0.25, below tier)"
          setup_api_calls:
            - { call: "POST /api/jurisdiction-programs", payload: { jurisdiction_code: "GA", program_name: "GA Film Credit FY27", fiscal_year: "FY2027", window_opens_at: "2026-08-01T00:00:00Z", window_closes_at: "2027-07-01T00:00:00Z", annual_cap_cents: 100000000, minimum_qualified_spend_cents: 10000000, base_rate_standard: 0.25, base_rate_elevated: 0.30, elevated_tier_threshold_cents: 200000000, atl_cap_pct: 0.40, resident_uplift_pct: 0.025, transfer_price_floor_pct: 0.90, vendor_verification_validity_days: 365, appeal_window_days: 30, daily_interest_rate: 0.0005, credit_validity_days: 1095, transfer_proposal_validity_days: 14 }, as: FilmOfficeAdmin, captures: { prog_id: $.data.id } }
