              payload: { performed_at: "2026-06-10T09:55:00Z", timed_minutes: 45 }
              as: VisionTherapist
              as_user_id: "${cvt1}"
            - call: "POST /vision-therapy/claims"
              payload: { patient_id: "${pt}", coverage_id: "${cov_med}", service_class: "THERAPY_SESSION", service_date: "2026-06-10", expected_coverage_version: "${cov_med_v}", session_id: "${s1}" }
              as: BillingSpecialist
              captures: { cl1: $.data.id }
          trigger:
            - call: "POST /vision-therapy/claims"
              payload: { patient_id: "${pt}", coverage_id: "${cov_med}", service_class: "EVALUATION", service_date: "2026-06-01", expected_coverage_version: "${cov_med_v}", assessment_id: "${ev1}" }
              as: BillingSpecialist
              captures: { err: $.data.error_id }
            - call: "GET /vision-therapy/coverages/${cov_med}"
              payload: {}
              as: BillingSpecialist
              captures: { cv2: $.data.version }
            - call: "POST /vision-therapy/claims"
              payload: { patient_id: "${pt}", coverage_id: "${cov_med}", service_class: "EVALUATION", service_date: "2026-06-01", expected_coverage_version: "${cv2}", assessment_id: "${ev1}" }
              as: BillingSpecialist
              captures: { cl2: $.data.id, pc: $.data.procedure_code, u: $.data.units, b: $.data.billed_amount }
          assert:
            - "${err} == ERR_STALE_VERSION"
            - "HTTP 412 on the stale attempt"
            - "${pc} == EVALUATION_ENCOUNTER and ${u} == 1 and ${b} == 210.00"
            - "GET /vision-therapy/claims with patient_id ${pt} returns exactly 2 rows"

      - name: version_increments_by_one_on_every_mutation
        claim_type: derived_field_reconciliation
        grounds:
          - entities.Assessment.fields.status
          - validations[priority=13]
        distinguishing_aspect: "Assessment.version starts at 1 on create and advances by exactly one per mutation - 2 after finalize and 3 after sign - which is the observable the OCC rung depends on."
        test_recipe:
          setup:
            - "One patient and one optometrist, with the logical clock at 2026-06-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /vision-therapy/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ClinicAdmin
            - call: "POST /vision-therapy/patients"
              payload: { full_name: "Ana Ruiz", date_of_birth: "2016-06-01", diagnosis_category: "CONVERGENCE_INSUFFICIENCY" }
              as: FrontDesk
              captures: { pt: $.data.id }
            - call: "POST /vision-therapy/therapists"
              payload: { full_name: "Dr Lee", credential: "OPTOMETRIST", credential_expires_at: "2027-01-01T00:00:00Z" }
              as: ClinicAdmin
              captures: { od1: $.data.id }
            - call: "POST /vision-therapy/assessments"
              payload: { patient_id: "${pt}", assessment_type: "EVALUATION", purpose: "DIAGNOSTIC", encounter_date: "2026-06-01", performed_by_therapist_id: "${od1}" }
              as: Optometrist
              as_user_id: "${od1}"
              captures: { ev1: $.data.id, v1: $.data.version }
            - call: "POST /vision-therapy/assessments/${ev1}/measurements"
              payload: { metric_code: "NPC", eye: "OU", npc_break_cm: 12.0, npc_recovery_cm: 16.0 }
              as: Optometrist
              as_user_id: "${od1}"
          trigger:
            - call: "POST /vision-therapy/assessments/${ev1}/finalize"
              payload: {}
              as: Optometrist
              as_user_id: "${od1}"
              captures: { v2: $.data.version }
            - call: "POST /vision-therapy/assessments/${ev1}/sign"
              payload: {}
              as: Optometrist
              as_user_id: "${od1}"
              captures: { v3: $.data.version }
          assert:
            - "${v1} == 1"
            - "${v2} == 2"
            - "${v3} == 3"
            - "updated_at strictly increases across the three reads while created_at is unchanged"

  # ===========================================================================
  # section: consistency_model
  # ===========================================================================
  - section: consistency_model
    instances:

      - name: cascade_effects_are_visible_immediately_after_the_mutation
        claim_type: immediate
        grounds:
          - state_machines.TherapyPlan.ACTIVE_to_SUSPENDED
          - state_machines.TherapySession.SCHEDULED_to_CANCELLED
          - conservation_invariants.INVARIANT-1
        distinguishing_aspect: "The consistency model is immediate: the suspend response itself already reads SUSPENDED and the very next reads show the session CANCELLED and the unit released, with no second call needed to settle the cascade."
        test_recipe:
          setup:
            - "An ACTIVE plan with a 12-visit authorization and one SCHEDULED session on 2026-06-10 holding one consumed unit."
          setup_api_calls:
            - call: "POST /vision-therapy/_clock/set_current_utc"
