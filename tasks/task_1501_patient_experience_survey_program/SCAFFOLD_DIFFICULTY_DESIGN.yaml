  # ---------------------------------------------------------------------------
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: cycle_fielding_closed_interval_touch_conflicts
        grounds:
          - validations[priority=7]
          - errors[ERR_CYCLE_WINDOW_OVERLAP]
          - endpoints[POST /api/cycles]
        distinguishing_aspect: |
          Resource: SurveyProgram; semantics: CLOSED date intervals. Cycle B's
          fielding_start_date 2026-08-31 equals cycle A's fielding_end_date
          2026-08-31 — a mere touch is an overlap and must be rejected (unlike
          the sibling instance's half-open initiative windows, where the same
          adjacency is allowed).
        test_recipe:
          setup:
            - "Program with cycle A fielding [2026-08-03, 2026-08-31] (any status; DRAFT suffices)"
          setup_api_calls:
            - { call: "POST /api/survey-programs", payload: { name: "P-TO1", sampling_protocol: "CENSUS", admin_mode: "MAIL_ONLY" }, as: ProgramAdmin, captures: { pg: "$.data.id" } }
            - { call: "POST /api/cycles", payload: { program_id: "${pg}", label: "QA", cycle_index: 1, discharge_window_start: "2026-06-01", discharge_window_end: "2026-06-30", fielding_start_date: "2026-08-03", fielding_end_date: "2026-08-31", target_sample_size: 100 }, as: ProgramAdmin, captures: { cA: "$.data.id" } }
          trigger:
            - { call: "POST /api/cycles", payload: { program_id: "${pg}", label: "QB", cycle_index: 2, discharge_window_start: "2026-07-01", discharge_window_end: "2026-07-31", fielding_start_date: "2026-08-31", fielding_end_date: "2026-09-15", target_sample_size: 100 }, as: ProgramAdmin, captures: { err: "$.data.error_id" } }
            - { call: "POST /api/cycles", payload: { program_id: "${pg}", label: "QC", cycle_index: 3, discharge_window_start: "2026-07-01", discharge_window_end: "2026-07-31", fielding_start_date: "2026-09-01", fielding_end_date: "2026-09-30", target_sample_size: 100 }, as: ProgramAdmin, captures: { cC: "$.data.id" } }
          assert:
            - "touching creation -> 409 ERR_CYCLE_WINDOW_OVERLAP (closed-interval semantics: 2026-08-31 belongs to both windows)"
            - "disjoint creation (2026-09-01..2026-09-30) -> 201 and SurveyCycle.${cC}.status == DRAFT"

      - name: initiative_half_open_window_adjacency_allowed
        grounds:
          - validations[priority=7]
          - errors[ERR_INITIATIVE_WINDOW_OVERLAP]
          - state_machines.ImprovementInitiative.DRAFT_to_ACTIVE
        distinguishing_aspect: |
          Resource: (CareUnit, domain) pair; semantics: HALF-OPEN cycle-index
          windows (baseline_index, evaluation_index] — adjacency is PERMITTED
          (X=(1,2] and Y=(2,3] coexist), while the genuinely overlapping Z=(1,3]
          is rejected. Different resource entity and different adjacency
          treatment from the sibling date-interval instance.
        test_recipe:
          setup:
            - "Cycles idx1 and idx2 PUBLISHED (25 all-4 MAIL responses each); cycle idx3 DRAFT"
            - "Initiative X (U1, NURSE_COMM, baseline idx1, evaluation idx2) and Y (U1, NURSE_COMM, baseline idx2, evaluation idx3) both ACTIVE; Z (U1, NURSE_COMM, baseline idx1, evaluation idx3) in DRAFT"
          setup_api_calls:
            - { call: "POST /api/survey-programs", payload: { name: "P-TO2", sampling_protocol: "CENSUS", admin_mode: "MAIL_ONLY" }, as: ProgramAdmin, captures: { pg: "$.data.id", pg_v: "$.data.version" } }
            - { call: "POST /api/vendors", payload: { program_id: "${pg}", name: "V1", cycle_budget_cents: 100000, expected_program_version: "${pg_v}" }, as: ProgramAdmin, captures: { vn: "$.data.id" } }
            - { call: "POST /api/units", payload: { program_id: "${pg}", name: "Unit 1", unit_code: "U1" }, as: ProgramAdmin, captures: { un: "$.data.id" } }
            - { call: "POST /api/providers", payload: { program_id: "${pg}", full_name: "Dr A", npi: "NPI1", specialty: "IM" }, as: ProgramAdmin, captures: { pr: "$.data.id" } }
            - { call: "POST /api/cycles", payload: { program_id: "${pg}", label: "Q1", cycle_index: 1, discharge_window_start: "2026-06-01", discharge_window_end: "2026-06-30", fielding_start_date: "2026-08-03", fielding_end_date: "2026-08-31", target_sample_size: 100 }, as: ProgramAdmin, captures: { c1: "$.data.id" } }
            - { call: "POST /api/cycles/${c1}/open-sampling", payload: {}, as: ProgramAdmin }
            - { call: "POST /api/discharges/import", payload: { program_id: "${pg}", count: 25, template: { mrn_prefix: "A", unit_id: "${un}", provider_id: "${pr}", admit_date: "2026-06-01", discharge_date: "2026-06-03", discharge_disposition: "HOME", primary_dx_group: "MEDICAL", payer: "MEDICARE", age_years: 65, address_country: "US", no_publicity_flag: false, custody_status: "NONE" } }, as: DataSteward, captures: { d1: "$.data.discharge_ids" } }
            - { call: "POST /api/sample-cases/import", payload: { cycle_id: "${c1}", discharge_ids: "${d1}", mode_assigned: "MAIL", postage_cost_cents: 100 }, as: DataSteward, captures: { k1: "$.data.sample_case_ids" } }
            - { call: "POST /api/cycles/${c1}/start-fielding", payload: {}, as: ProgramAdmin }
            - { call: "POST /api/responses/import", payload: { case_ids: "${k1}", mode_used: "MAIL", nurse_comm_score: 4, doctor_comm_score: 4, cleanliness_score: 4, overall_rating_score: 4 }, as: VendorOperator, as_user_id: "${vn}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-31T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /api/cycles/${c1}/close-fielding", payload: {}, as: ProgramAdmin }
            - { call: "POST /api/cycles/${c1}/begin-scoring", payload: {}, as: ProgramAdmin }
            - { call: "POST /api/cycles/${c1}/publish", payload: {}, as: ProgramAdmin }
            - { call: "POST /api/cycles", payload: { program_id: "${pg}", label: "Q2", cycle_index: 2, discharge_window_start: "2026-07-01", discharge_window_end: "2026-07-31", fielding_start_date: "2026-09-01", fielding_end_date: "2026-09-30", target_sample_size: 100 }, as: ProgramAdmin, captures: { c2: "$.data.id" } }
            - { call: "POST /api/cycles/${c2}/open-sampling", payload: {}, as: ProgramAdmin }
            - { call: "POST /api/discharges/import", payload: { program_id: "${pg}", count: 25, template: { mrn_prefix: "B", unit_id: "${un}", provider_id: "${pr}", admit_date: "2026-07-01", discharge_date: "2026-07-03", discharge_disposition: "HOME", primary_dx_group: "MEDICAL", payer: "MEDICARE", age_years: 65, address_country: "US", no_publicity_flag: false, custody_status: "NONE" } }, as: DataSteward, captures: { d2: "$.data.discharge_ids" } }
            - { call: "POST /api/sample-cases/import", payload: { cycle_id: "${c2}", discharge_ids: "${d2}", mode_assigned: "MAIL", postage_cost_cents: 100 }, as: DataSteward, captures: { k2: "$.data.sample_case_ids" } }
            - { call: "POST /api/cycles/${c2}/start-fielding", payload: {}, as: ProgramAdmin }
            - { call: "POST /api/responses/import", payload: { case_ids: "${k2}", mode_used: "MAIL", nurse_comm_score: 4, doctor_comm_score: 4, cleanliness_score: 4, overall_rating_score: 4 }, as: VendorOperator, as_user_id: "${vn}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-30T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /api/cycles/${c2}/close-fielding", payload: {}, as: ProgramAdmin }
            - { call: "POST /api/cycles/${c2}/begin-scoring", payload: {}, as: ProgramAdmin }
            - { call: "POST /api/cycles/${c2}/publish", payload: {}, as: ProgramAdmin }
            - { call: "POST /api/cycles", payload: { program_id: "${pg}", label: "Q3", cycle_index: 3, discharge_window_start: "2026-08-01", discharge_window_end: "2026-08-31", fielding_start_date: "2026-10-01", fielding_end_date: "2026-10-31", target_sample_size: 100 }, as: ProgramAdmin, captures: { c3: "$.data.id" } }
            - { call: "POST /api/initiatives", payload: { unit_id: "${un}", domain: "NURSE_COMM", baseline_cycle_id: "${c1}", evaluation_cycle_id: "${c2}", target_score: 90.0 }, as: ProgramAdmin, captures: { inx: "$.data.id" } }
            - { call: "POST /api/initiatives/${inx}/activate", payload: {}, as: ProgramAdmin }
            - { call: "POST /api/initiatives", payload: { unit_id: "${un}", domain: "NURSE_COMM", baseline_cycle_id: "${c2}", evaluation_cycle_id: "${c3}", target_score: 90.0 }, as: ProgramAdmin, captures: { iny: "$.data.id" } }
            - { call: "POST /api/initiatives", payload: { unit_id: "${un}", domain: "NURSE_COMM", baseline_cycle_id: "${c1}", evaluation_cycle_id: "${c3}", target_score: 90.0 }, as: ProgramAdmin, captures: { inz: "$.data.id" } }
          trigger:
            - { call: "POST /api/initiatives/${iny}/activate", payload: {}, as: ProgramAdmin, captures: { y_st: "$.data.status" } }
            - { call: "POST /api/initiatives/${inz}/activate", payload: {}, as: ProgramAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "Y activates: status == ACTIVE — window (2,3] is adjacent to X's (1,2] at index 2 and adjacency is permitted"
            - "Z activation -> 409 ERR_INITIATIVE_WINDOW_OVERLAP — window (1,3] intersects both X (1,2] and Y (2,3]"
            - "ImprovementInitiative.${inz}.status remains DRAFT"

  # ---------------------------------------------------------------------------
  # Rule 9 — compensating_invariant (different conserved quantities)
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: vendor_budget_charge_credit_conservation
        grounds:
          - calculations.vendor_budget_reconciliation
          - state_machines.SampleCase.IN_FIELD_to_UNDELIVERABLE
        distinguishing_aspect: |
          Conserved quantity: MONEY (cents). Formula: cycle_budget_cents ==
          cycle_budget_remaining_cents + SUM(CHARGED postage). Case creation
          charges 100 (remaining 99900); mark-undeliverable credits 100 back —
          after the compensating pair, remaining == 100000 exactly, no drift.
        test_recipe:
          setup:
            - "Vendor budget 100000c; cycle FIELDING with 1 IN_FIELD case (postage 100c, CHARGED)"
          setup_api_calls:
            - { call: "POST /api/survey-programs", payload: { name: "P-CI1", sampling_protocol: "CENSUS", admin_mode: "MAIL_ONLY" }, as: ProgramAdmin, captures: { pg: "$.data.id", pg_v: "$.data.version" } }
            - { call: "POST /api/vendors", payload: { program_id: "${pg}", name: "V1", cycle_budget_cents: 100000, expected_program_version: "${pg_v}" }, as: ProgramAdmin, captures: { vn: "$.data.id" } }
            - { call: "POST /api/units", payload: { program_id: "${pg}", name: "Unit 1", unit_code: "U1" }, as: ProgramAdmin, captures: { un: "$.data.id" } }
            - { call: "POST /api/providers", payload: { program_id: "${pg}", full_name: "Dr A", npi: "NPI1", specialty: "IM" }, as: ProgramAdmin, captures: { pr: "$.data.id" } }
            - { call: "POST /api/cycles", payload: { program_id: "${pg}", label: "Q1", cycle_index: 1, discharge_window_start: "2026-06-01", discharge_window_end: "2026-06-30", fielding_start_date: "2026-08-03", fielding_end_date: "2026-08-31", target_sample_size: 100 }, as: ProgramAdmin, captures: { cy: "$.data.id" } }
            - { call: "POST /api/cycles/${cy}/open-sampling", payload: {}, as: ProgramAdmin }
            - { call: "POST /api/discharges/import", payload: { program_id: "${pg}", count: 1, template: { mrn_prefix: "M", unit_id: "${un}", provider_id: "${pr}", admit_date: "2026-06-01", discharge_date: "2026-06-03", discharge_disposition: "HOME", primary_dx_group: "MEDICAL", payer: "MEDICARE", age_years: 65, address_country: "US", no_publicity_flag: false, custody_status: "NONE" } }, as: DataSteward, captures: { d_ids: "$.data.discharge_ids" } }
            - { call: "POST /api/sample-cases/import", payload: { cycle_id: "${cy}", discharge_ids: "${d_ids}", mode_assigned: "MAIL", postage_cost_cents: 100 }, as: DataSteward, captures: { c_ids: "$.data.sample_case_ids" } }
            - { call: "GET /api/vendors/${vn}", payload: {}, as: Any, captures: { rem_after_charge: "$.data.cycle_budget_remaining_cents" } }
            - { call: "POST /api/cycles/${cy}/start-fielding", payload: {}, as: ProgramAdmin }
          trigger:
            - { call: "POST /api/sample-cases/${c_ids[0]}/mark-undeliverable", payload: {}, as: VendorOperator, as_user_id: "${vn}" }
            - { call: "GET /api/vendors/${vn}", payload: {}, as: Any, captures: { rem_after_credit: "$.data.cycle_budget_remaining_cents" } }
          assert:
            - "after charge: cycle_budget_remaining_cents == 99900 (100000 - 100 CHARGED)"
            - "after compensating credit: cycle_budget_remaining_cents == 100000 — exactly the pre-charge value"
            - "SampleCase.${c_ids[0]}.billing_status == CREDITED and status == UNDELIVERABLE"
            - "invariant holds at every step: 100000 == remaining + SUM(CHARGED postage)"

      - name: completed_responses_intake_void_conservation
        grounds:
          - calculations.completed_responses_reconciliation
          - state_machines.SurveyResponse.ACCEPTED_to_VOIDED
        distinguishing_aspect: |
          Conserved quantity: COUNT of completed responses (different quantity
          type from the sibling money invariant). Intake (+1) followed by void
          (-1) restores completed_responses to exactly its pre-intake value 0,
          even though the case itself remains RESPONDED.
        test_recipe:
          setup:
            - "Cycle FIELDING with 1 IN_FIELD case; completed_responses == 0"
          setup_api_calls:
            - { call: "POST /api/survey-programs", payload: { name: "P-CI2", sampling_protocol: "CENSUS", admin_mode: "MAIL_ONLY" }, as: ProgramAdmin, captures: { pg: "$.data.id", pg_v: "$.data.version" } }
            - { call: "POST /api/vendors", payload: { program_id: "${pg}", name: "V1", cycle_budget_cents: 100000, expected_program_version: "${pg_v}" }, as: ProgramAdmin, captures: { vn: "$.data.id" } }
            - { call: "POST /api/units", payload: { program_id: "${pg}", name: "Unit 1", unit_code: "U1" }, as: ProgramAdmin, captures: { un: "$.data.id" } }
            - { call: "POST /api/providers", payload: { program_id: "${pg}", full_name: "Dr A", npi: "NPI1", specialty: "IM" }, as: ProgramAdmin, captures: { pr: "$.data.id" } }
            - { call: "POST /api/cycles", payload: { program_id: "${pg}", label: "Q1", cycle_index: 1, discharge_window_start: "2026-06-01", discharge_window_end: "2026-06-30", fielding_start_date: "2026-08-03", fielding_end_date: "2026-08-31", target_sample_size: 100 }, as: ProgramAdmin, captures: { cy: "$.data.id" } }
            - { call: "POST /api/cycles/${cy}/open-sampling", payload: {}, as: ProgramAdmin }
            - { call: "POST /api/discharges/import", payload: { program_id: "${pg}", count: 1, template: { mrn_prefix: "M", unit_id: "${un}", provider_id: "${pr}", admit_date: "2026-06-01", discharge_date: "2026-06-03", discharge_disposition: "HOME", primary_dx_group: "MEDICAL", payer: "MEDICARE", age_years: 65, address_country: "US", no_publicity_flag: false, custody_status: "NONE" } }, as: DataSteward, captures: { d_ids: "$.data.discharge_ids" } }
            - { call: "POST /api/sample-cases/import", payload: { cycle_id: "${cy}", discharge_ids: "${d_ids}", mode_assigned: "MAIL", postage_cost_cents: 100 }, as: DataSteward, captures: { c_ids: "$.data.sample_case_ids" } }
            - { call: "POST /api/cycles/${cy}/start-fielding", payload: {}, as: ProgramAdmin }
          trigger:
            - { call: "POST /api/responses", payload: { case_id: "${c_ids[0]}", mode_used: "MAIL", nurse_comm_score: 4, doctor_comm_score: 4, cleanliness_score: 4, overall_rating_score: 4 }, as: VendorOperator, as_user_id: "${vn}", captures: { rsp: "$.data.id" } }
            - { call: "GET /api/cycles/${cy}", payload: {}, as: Any, captures: { comp_after_intake: "$.data.completed_responses" } }
            - { call: "POST /api/responses/${rsp}/void", payload: { reason: "duplicate submission" }, as: DataSteward }
            - { call: "GET /api/cycles/${cy}", payload: {}, as: Any, captures: { comp_after_void: "$.data.completed_responses" } }
          assert:
            - "after intake: SurveyCycle.${cy}.completed_responses == 1 and response_rate == 100.0 (denominator 1)"
            - "after void: SurveyCycle.${cy}.completed_responses == 0 — exactly the pre-intake value, no drift"
            - "SurveyResponse.${rsp}.status == VOIDED; SampleCase.${c_ids[0]}.status == RESPONDED (case does not revert)"
