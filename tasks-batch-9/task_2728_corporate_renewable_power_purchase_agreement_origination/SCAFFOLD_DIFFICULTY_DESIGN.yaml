            - "SettlementPeriod.${sp_h_id}.total_delivered_mwh == 73.4500 and SettlementPeriod.${sp_m_id}.total_delivered_mwh == 73.4500"
            - "SettlementPeriod.${sp_h_id}.weighted_avg_index_usd_per_mwh == 35.9961 and SettlementPeriod.${sp_m_id}.weighted_avg_index_usd_per_mwh == 35.9961"
            - "SettlementPeriod.${sp_h_id}.energy_settlement_usd == -545.23"
            - "SettlementPeriod.${sp_m_id}.energy_settlement_usd == -595.23"
            - "SettlementPeriod.${sp_h_id}.energy_settlement_usd - SettlementPeriod.${sp_m_id}.energy_settlement_usd == 50.00"
            - "SettlementPeriod.${sp_h_id}.basis_adjustment_usd == -29.33 and SettlementPeriod.${sp_m_id}.basis_adjustment_usd == -29.33"
            - "SettlementPeriod.${sp_h_id}.net_settlement_usd == -574.56 and SettlementPeriod.${sp_h_id}.buyer_pays_usd == 574.56 and SettlementPeriod.${sp_h_id}.seller_pays_usd == 0.00"
            - "SettlementPeriod.${sp_m_id}.net_settlement_usd == -624.56 and SettlementPeriod.${sp_m_id}.buyer_pays_usd == 624.56 and SettlementPeriod.${sp_m_id}.seller_pays_usd == 0.00"
            - "SettlementPeriod.${sp_h_id}.mintable_attributes_mwh == 73 and SettlementPeriod.${sp_m_id}.mintable_attributes_mwh == 73"
            - "SettlementPeriod.${sp_h_id}.status == CALCULATED and SettlementPeriod.${sp_m_id}.status == CALCULATED"

  # ===========================================================================
  # RULE 2 - combinatorial_formula
  # Instance 1 is MODE (c): a circular-looking dependency (the shape premium is
  # keyed by the price tier, and the tier looks like it should come from the
  # price) resolved by a pinned evaluation order.
  # Instance 2 is MODE (b): nested rounding order - floor-then-distribute
  # largest-remainder allocation, where independent per-part rounding breaks
  # conservation.
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: contract_price_tier_selected_from_escalated_base_not_final_price
        grounds:
          - calculations.deal_contract_price
          - calculations.deal_expected_volume
          - entities.Deal.fields.price_tier
          - entities.Deal.fields.contract_price_usd_per_mwh
          - entities.Deal.fields.escalation_pct_per_year
        distinguishing_aspect: |
          MODE (c) - circular-looking dependency with a pinned evaluation order:
          price_tier is selected from escalated_base ALONE, before the
          tier-keyed shape premium is added, and after escalation is applied.
          Deal T1 (38.05 escalated to 39.1915) therefore prices at 44.44 with
          price_tier LOW; taking the tier from the final price would return 46.19
          and taking it from the pre-escalation base would mis-tier Deal T2, which
          must price at 47.29 with price_tier MID rather than 45.54.
        test_recipe:
          setup:
            - "Buyer NW (A, net_debt_to_ebitda 2.5, CDP_AND_TCFD, EBITDA 60000000.00) is QUALIFIED with unsecured_credit_limit_usd 3000000.00."
            - "Project KJ1 (SOLAR, 100.000 MW) exists in status PRE_DEVELOPMENT; deal creation does not require any project milestone."
