              captures: { ev_id: $.data.id }
          trigger:
            - call: "POST /events/${ev_id}/approve-security"
              as: PlatformAdmin
              captures: { err: $.data.error_id }
            - call: "POST /centers/${c_id}/site-agreements"
              payload: { facility_space_sqft: 2000, utilities_included: true, access_terms: "escort-required-plus", security_level: 3, start_date: "2026-09-01", end_date: "2027-08-31" }
              as: PlatformAdmin
