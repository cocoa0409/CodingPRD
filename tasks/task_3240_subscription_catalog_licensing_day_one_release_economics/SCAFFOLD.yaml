  - method: GET
    path: "/catalog/purchases/{purchase_id}"
    description: "Read a single Purchase"
    roles: [Subscriber, CatalogAdmin, CatalogAnalyst]
    code: 200
    input: []
    output: Purchase
    side_effects: []

  - method: POST
    path: "/catalog/purchases/{purchase_id}/reverse"
    description: "Compensating action for a purchase: refund the charge, restore the wallet offset and drop the row out of the unit-sales accumulator"
    roles: [CatalogAdmin]
    code: 200
    input: []
    output: Purchase
    side_effects:
      - "status becomes REFUNDED"
      - "Subscriber.wallet_credit_cents increased by wallet_applied_cents, so wallet_credit_cents plus the retained wallet_applied_cents is unchanged"
      - "the row leaves the chronological cannibalization accumulator"
      - "unit_sales_credit_cents is retained on the row for audit and the row is never deleted"

  - method: GET
    path: "/catalog/purchases"
    description: "List Purchases, optionally filtered by subscriber, title, entry or region"
    roles: [Subscriber, CatalogAdmin, CatalogAnalyst]
    code: 200
    input: ["subscriber_id?", "title_id?", "entry_id?", "region_code?", "limit?", "offset?"]
    output: "Purchase[]"
    side_effects: []

  # --- AvailabilityProjection ---
  - method: POST
    path: "/catalog/availability-projections"
    description: "Project the day-one release economics for a title in a region"
    roles: [CatalogAnalyst, CatalogAdmin]
    code: 201
    input: [title_id, region_code, launch_subscriber_count, tier_step_count, projected_unit_sales_units, release_class]
    output: AvailabilityProjection
    side_effects:
      - "projected_subscription_value_cents, projected_cannibalized_unit_sales_cents, projected_net_value_cents and decision recomputed"
      - "status initialized to DRAFT"

  - method: GET
    path: "/catalog/availability-projections/{projection_id}"
    description: "Read an AvailabilityProjection"
    roles: [CatalogAdmin, CatalogAnalyst]
    code: 200
    input: []
    output: AvailabilityProjection
    side_effects: []

  - method: GET
    path: "/catalog/availability-projections"
    description: "List AvailabilityProjections, optionally filtered by title or region"
    roles: [CatalogAdmin, CatalogAnalyst]
    code: 200
    input: ["title_id?", "region_code?", "status?", "limit?", "offset?"]
    output: "AvailabilityProjection[]"
    side_effects: []

  - method: POST
    path: "/catalog/availability-projections/{projection_id}/finalize"
    description: "Freeze a projection and re-derive the cannibalized figure from actual purchases; returns the provisional-to-final delta"
    roles: [CatalogAnalyst, CatalogAdmin]
    code: 200
    input: []
    output: AvailabilityProjection
    side_effects:
      - "status becomes FINALIZED"
      - "projected_cannibalized_unit_sales_cents re-derived from the chronological purchase accumulator and projected_net_value_cents and decision recomputed"
      - "the provisional-to-final delta is exposed on the response"

  # --- Logical clock ---
  - method: POST
    path: "/catalog/_clock/set_current_utc"
    description: "Test-driving clock control. The server's logical clock starts at 2026-09-01T00:00:00Z and never falls back to wall-clock time; this endpoint sets it forward."
    roles: [CatalogAdmin]
    code: 200
    input: [current_utc]
    output: null
    side_effects:
      - "all clock-driven transitions are applied in date order for instants up to and including the new value: LicensingDeal SIGNED to LIVE and LIVE to EXPIRING to COMPLETED, CatalogMaintenance SCHEDULED to ACTIVE to COMPLETED, and failed monthly renewals on MONTHLY subscriptions"
      - "region capacity figures recomputed"# =============================================================================
# §1.6 Error Code Catalog (42 codes)
# =============================================================================
errors:
  # --- auth / request ---
  - id: ERR_MISSING_AUTH_HEADER
    http: 401
    condition: "X-User-Role or X-User-ID absent, or X-User-Role is not one of CatalogAdmin, CatalogAnalyst, Subscriber, Anonymous"

  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "the caller's role is not permitted on this endpoint, or a Subscriber acts on a resource whose subscriber_id is not its own X-User-ID"

  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "required input missing, undeclared field supplied, enum member outside its declared set, or a numeric field outside its declared range"

  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_title_version does not match the licensing Title's current version"

  # --- not found ---
  - id: ERR_PUBLISHER_NOT_FOUND
    http: 404
    condition: "no Publisher exists with the given id"

  - id: ERR_TITLE_NOT_FOUND
    http: 404
    condition: "no Title exists with the given id, or the Title is not owned by the Publisher named alongside it"

  - id: ERR_REGION_NOT_FOUND
    http: 404
    condition: "no Region exists with the given region_code"

  - id: ERR_TIER_NOT_FOUND
    http: 404
    condition: "no SubscriptionTier exists with the given tier_code"

  - id: ERR_DEAL_NOT_FOUND
    http: 404
    condition: "no LicensingDeal exists with the given id, or it does not belong to the named Title"

  - id: ERR_ENTRY_NOT_FOUND
    http: 404
    condition: "no CatalogEntry exists with the given id, or it does not belong to the named Title"

  - id: ERR_SUBSCRIBER_NOT_FOUND
    http: 404
    condition: "no Subscriber exists with the given id"

  - id: ERR_SUBSCRIPTION_NOT_FOUND
    http: 404
    condition: "no Subscription exists with the given id, or it does not belong to the named Subscriber"

  - id: ERR_PROJECTION_NOT_FOUND
    http: 404
    condition: "no AvailabilityProjection exists with the given id"

  # --- state ---
  - id: ERR_DEAL_ALREADY_SIGNED
    http: 409
    condition: "the LicensingDeal is no longer DRAFT, so it cannot be signed again"

  - id: ERR_ENTRY_NOT_PUBLISHABLE
    http: 409
    condition: "the CatalogEntry is not PLANNED (already ADDED, REMOVING or DELISTED), so it cannot be published"

  - id: ERR_ENTRY_ALREADY_DELISTED
    http: 409
    condition: "the CatalogEntry is already DELISTED"

  - id: ERR_REMOVAL_ALREADY_ANNOUNCED
    http: 409
    condition: "the CatalogEntry is already REMOVING, so the removal cannot be announced again"

  - id: ERR_REMOVAL_NOT_ANNOUNCED
    http: 409
    condition: "the CatalogEntry is ADDED, so there is no announcement to withdraw"

  - id: ERR_REMOVAL_REVERT_WINDOW_CLOSED
    http: 409
    condition: "the CatalogEntry's removal date has already advanced past the revert cutoff state"

  - id: ERR_SUBSCRIPTION_TERMINAL
    http: 409
    condition: "the Subscription's lifecycle_status is CANCELLED, so it accepts no further transitions"

  - id: ERR_NO_UNPAID_MONTHS
    http: 409
    condition: "the Subscription has unpaid_months == 0, so there is nothing to settle"

  - id: ERR_ENTITLEMENT_ALREADY_REVOKED
    http: 409
    condition: "the Entitlement's status is already REVOKED"

  - id: ERR_PROJECTION_ALREADY_FINALIZED
    http: 409
    condition: "the AvailabilityProjection's status is already FINALIZED"

  # --- business temporal ---
  - id: ERR_TERM_WINDOW_INVALID
    http: 409
    condition: "term_end_date is not strictly after term_start_date"

  - id: ERR_ADD_EFFECTIVE_OUTSIDE_TERM
    http: 409
    condition: "add_effective_date does not fall inside the half-open term window [term_start_date, term_end_date)"

  - id: ERR_REMOVAL_DATE_NOT_AFTER_ADD
    http: 409
    condition: "the CatalogEntry's removal_date is not strictly after its actual_add_date (or, for a planned entry, after its announced_add_date)"

  - id: ERR_INSUFFICIENT_REMOVAL_NOTICE
    http: 409
    condition: "removal_notice_days is below the class minimum (DAY_ONE 14, CATALOG_ADD 7, BACK_CATALOG 0)"

  - id: ERR_REMOVAL_REVERT_CUTOFF
    http: 409
    condition: "the logical clock is at or after removal_date minus three days, so the announced removal can no longer be withdrawn"

  - id: ERR_REGION_MAINTENANCE_WINDOW_ACTIVE
    http: 409
    condition: "the logical clock falls inside an ACTIVE CatalogMaintenance window of the target region"

  - id: ERR_MAINTENANCE_WINDOW_OVERLAP
    http: 409
    condition: "two submitted maintenance windows of the same region overlap and neither is marked allow_overlap"

  # --- business constraint ---
  - id: ERR_PUBLISHER_SUSPENDED
    http: 409
    condition: "the Publisher's status is SUSPENDED, so no new deal may be signed for it"

  - id: ERR_TIER_UNSUPPORTED_IN_REGION
    http: 409
    condition: "the requested tier is below the region's catalog_tier_floor, so the tier is not offered there"

  - id: ERR_TIER_BELOW_REGION_FLOOR
    http: 409
    condition: "a CatalogEntry names a tier below the region's catalog_tier_floor"

  - id: ERR_PLATFORM_NOT_SUPPORTED
    http: 409
    condition: "a DAY_ONE entry's title does not ship on CONSOLE, or a Cloud-granting entry's title does not ship on CLOUD"

  - id: ERR_DAY_ONE_NOT_ELIGIBLE
    http: 409
    condition: "release_class is DAY_ONE while Title.day_one_eligible is false"

  - id: ERR_ENTRY_TITLE_MISMATCH
    http: 409
    condition: "the CatalogEntry named by a purchase does not belong to the purchased Title"

  - id: ERR_NO_BINDING_DEAL
    http: 409
    condition: "the Title has no LicensingDeal in status LIVE for the requested region, so an entry or projection cannot be created"

  - id: ERR_DUPLICATE_DAY_ONE_PROJECTION
    http: 409
    condition: "a FINALIZED DAY_ONE AvailabilityProjection already exists for the same (title_id, region_code)"

  - id: ERR_COMPENSATION_MODEL_MISMATCH
    http: 409
    condition: "the supplied fee fields do not match the declared compensation_model (FIXED needs monthly_fixed_fee_cents, ENGAGEMENT needs engagement_rate_cents_per_hour and monthly_engagement_cap_cents, HYBRID needs guaranteed_compensation_cents and monthly_engagement_cap_cents)"

  - id: ERR_PURCHASE_ALREADY_REVERSED
    http: 409
    condition: "the Purchase's status is already REFUNDED, so it cannot be reversed a second time"

  # --- business fiscal ---
  - id: ERR_REGION_CATALOG_CEILING_REACHED
    http: 409
    condition: "the region already holds Region.availability_ceiling_titles entries in status IN {ADDED, REMOVING}"

  - id: ERR_MEMBER_DISCOUNT_CAP_EXCEEDED
    http: 409
    condition: "a tier's member_discount_pct plus the retention bonus would exceed the 0.40 cap"

  - id: ERR_PREPAY_CREDIT_CAP_EXCEEDED
    http: 409
    condition: "a tier's annual prepay credit would exceed the prepay amount actually collected"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: CatalogAdmin
    description: "Catalog operator: licenses titles, plans and publishes rotation, drives the logical clock, and may register subscribers on their behalf"
    identity: opaque
    exclusive_operations:
      - "POST /catalog/publishers"
      - "POST /catalog/titles"
      - "POST /catalog/regions"
      - "POST /catalog/tiers"
      - "POST /catalog/licensing-deals"
      - "POST /catalog/licensing-deals/{deal_id}/sign"
      - "POST /catalog/licensing-deals/{deal_id}/renew"
      - "POST /catalog/catalog-entries"
      - "POST /catalog/catalog-entries/{entry_id}/publish"
      - "POST /catalog/catalog-entries/{entry_id}/announce-removal"
      - "POST /catalog/catalog-entries/{entry_id}/cancel-removal"
      - "POST /catalog/catalog-entries/{entry_id}/retire"
      - "POST /catalog/entitlements/{entitlement_id}/revoke"
      - "POST /catalog/entitlements/{entitlement_id}/restore"
      - "POST /catalog/purchases/{purchase_id}/reverse"
      - "POST /catalog/_clock/set_current_utc"
    shared_operations:
      - "POST /catalog/subscriptions (with Subscriber)"
      - "POST /catalog/availability-projections (with CatalogAnalyst)"
      - "POST /catalog/availability-projections/{projection_id}/finalize (with CatalogAnalyst)"
      - "every GET endpoint"

  - name: CatalogAnalyst
    description: "Licensing and performance analyst: reads catalog and analytics data, and owns day-one release projections"
    identity: opaque
    exclusive_operations:
      - "POST /catalog/availability-projections"
      - "POST /catalog/availability-projections/{projection_id}/finalize"
      - "GET /catalog/tiers/{tier_code}/analytics"
    shared_operations:
      - "every GET endpoint except /catalog/tiers/{tier_code}/analytics"
      - "POST /catalog/subscriptions (read-only roles are not granted this; listed here for catalogue completeness)"

  - name: Subscriber
    description: "Member of the service: opens and pays for a subscription, records engagement, resolves entitlements, buys catalog titles and cancels"
    identity: "entity_backed:Subscriber"
    exclusive_operations:
      - "POST /catalog/subscriptions/{subscription_id}/pay"
      - "POST /catalog/subscriptions/{subscription_id}/cancel"
      - "POST /catalog/subscriptions/{subscription_id}/engagement-events"
      - "POST /catalog/purchases"
    shared_operations:
      - "POST /catalog/subscriptions (with CatalogAdmin)"
      - "GET /catalog/subscriptions/{subscription_id}"
      - "GET /catalog/entitlements (own rows only)"
      - "GET /catalog/purchases (own rows only)"
      - "GET /catalog/catalog-entries"
      - "GET /catalog/titles/{title_id}"
      - "GET /catalog/regions/{region_code}"
      - "GET /catalog/tiers/{tier_code}"

  - name: Anonymous
    description: "Unauthenticated caller: may only register a new Subscriber account"
    identity: opaque
    exclusive_operations:
      - "POST /catalog/subscribers"
    shared_operations: []