  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: purchase_period_closed_interval_touching_credit_rejected
        grounds:
          - entities.ServicePurchase.fields.service_period_start
          - errors[ERR_PURCHASE_PERIOD_OVERLAP]
          - validations[priority=8]
        distinguishing_aspect: |
          Interval semantics: CLOSED [start, end] on ServicePurchase against
          credited fiscal years — sharing a single boundary day (purchase start
          2023-12-31 vs credited FY2023 ending 2023-12-31) IS an overlap and is
          rejected. Companion instance report_period_half_open_adjacency_allowed
          uses half-open semantics on ContributionReport (different resource,
          different adjacency rule).
        test_recipe:
          setup:
            - "Fund, Employer, Member with one ACCEPTED line FY2023 (credited closed interval 2023-01-01..2023-12-31)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: FundAdmin }
            - call: "POST /pension-funds"
              payload: { fund_name: "State Retirement", cola_rate_pct: 0.025, earnings_limit_annual_cents: 3000000 }
              as: FundAdmin
            - call: "POST /employers"
              payload: { name: "Electric Coop", employer_code: "EC" }
              as: FundAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /members"
              payload: { employer_id: "${emp_id}", full_name: "Overlap Owen", date_of_birth: "1966-01-01", hire_date: "2016-01-01" }
              as: MemberServicesAnalyst
              captures: { mem_id: $.data.id }
            - call: "POST /employers/${emp_id}/contribution-reports"
              payload: { period_start: "2023-01-01", period_end: "2024-01-01", declared_total_cents: 480000 }
              as: EmployerClerk
              as_user_id: "${emp_id}"
              captures: { rep1: $.data.id }
            - call: "POST /contribution-reports/${rep1}/lines"
              payload: { member_id: "${mem_id}", fiscal_year: 2023, period_salary_cents: 6000000, contribution_amount_cents: 480000 }
              as: EmployerClerk
              as_user_id: "${emp_id}"
              captures: { l23: $.data.id }
            - { call: "POST /contribution-reports/${rep1}/submit", payload: {}, as: EmployerClerk, as_user_id: "${emp_id}" }
            - { call: "POST /contribution-reports/${rep1}/lines/${l23}/review", payload: { decision: "ACCEPT" }, as: MemberServicesAnalyst }
            - { call: "POST /contribution-reports/${rep1}/finalize", payload: {}, as: MemberServicesAnalyst }
          trigger:
            - call: "POST /members/${mem_id}/service-purchases"
              payload: { purchase_type: "PRIOR_SERVICE", service_period_start: "2024-01-01", service_period_end: "2025-12-31", years_purchased: 2.0 }
              as: Member
              as_user_id: "${mem_id}"
              captures: { p_ok: $.data.id, p_ok_status: $.data.status }
            - call: "POST /members/${mem_id}/service-purchases"
              payload: { purchase_type: "PRIOR_SERVICE", service_period_start: "2023-12-31", service_period_end: "2024-12-30", years_purchased: 1.0 }
              as: Member
              as_user_id: "${mem_id}"
              captures: { err: $.data.error_id }
          assert:
            - "First create succeeds (201): period 2024-01-01..2025-12-31 shares no day with FY2023 (closed interval check passes)"
            - "Second create fails: error_id == ERR_PURCHASE_PERIOD_OVERLAP (409) because closed-interval start 2023-12-31 touches the credited FY2023 end date 2023-12-31"
            - "ServicePurchase.${p_ok}.status == REQUESTED; no second purchase was created (GET /members/${mem_id}/service-purchases returns exactly 1)"

      - name: report_period_half_open_adjacency_allowed
        grounds:
          - entities.ContributionReport.fields.period_start
          - errors[ERR_REPORT_PERIOD_OVERLAP]
          - validations[priority=8]
        distinguishing_aspect: |
          Interval semantics: HALF-OPEN [period_start, period_end) on
          ContributionReport — adjacency (next start == prior end) is allowed,
          while true overlap is rejected. Companion instance
          purchase_period_closed_interval_touching_credit_rejected uses closed
          semantics on ServicePurchase (different resource, different adjacency
          rule).
        test_recipe:
          setup:
            - "Fund, Employer with one DRAFT report R1 period 2023-01-01..2024-01-01"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: FundAdmin }
            - call: "POST /pension-funds"
              payload: { fund_name: "State Retirement", cola_rate_pct: 0.025, earnings_limit_annual_cents: 3000000 }
              as: FundAdmin
            - call: "POST /employers"
              payload: { name: "Gas Utility", employer_code: "GAS" }
              as: FundAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /employers/${emp_id}/contribution-reports"
              payload: { period_start: "2023-01-01", period_end: "2024-01-01", declared_total_cents: 480000 }
              as: EmployerClerk
              as_user_id: "${emp_id}"
              captures: { rep1: $.data.id }
          trigger:
            - call: "POST /employers/${emp_id}/contribution-reports"
              payload: { period_start: "2024-01-01", period_end: "2025-01-01", declared_total_cents: 500000 }
              as: EmployerClerk
              as_user_id: "${emp_id}"
              captures: { rep2: $.data.id, rep2_status: $.data.status }
            - call: "POST /employers/${emp_id}/contribution-reports"
              payload: { period_start: "2023-06-01", period_end: "2024-06-01", declared_total_cents: 240000 }
              as: EmployerClerk
              as_user_id: "${emp_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Adjacent report (start 2024-01-01 == prior end 2024-01-01) succeeds with status DRAFT (half-open: end exclusive, no shared day)"
            - "Overlapping report 2023-06-01..2024-06-01 fails with ERR_REPORT_PERIOD_OVERLAP (409)"
            - "GET /employers/${emp_id}/contribution-reports returns exactly 2 reports"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: purchase_plan_money_conservation_through_payment_and_cancel
        grounds:
          - state_machines.ServicePurchase.PLAN_ACTIVE_to_CANCELLED
          - state_machines.PurchasePayment.PENDING_to_APPLIED
          - state_machines.PurchasePayment.APPLIED_to_REFUNDED
        distinguishing_aspect: |
          Conserved quantity: plan money (cents). Invariant at every step:
          quoted_cost_cents == balance_due_cents + sum(APPLIED amounts), and the
          forward action (payment) paired with its compensation (cancel refund)
          leaves sum(APPLIED) == 0, balance_due_cents == 0, refunded_total_cents
          == previously applied sum. Companion instance
          service_credit_conservation_on_line_review conserves service-time
          (months), a different quantity.
        test_recipe:
          setup:
            - "Member hired 2024-06-01 (FLAT), one ACCEPTED FY2023 line salary 5,000,005; purchase 2.0 years quoted 1,000,001; plan accepted with 12 installments (11 x 83,333 + final 83,338)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: FundAdmin }
            - call: "POST /pension-funds"
              payload: { fund_name: "State Retirement", cola_rate_pct: 0.025, earnings_limit_annual_cents: 3000000 }
              as: FundAdmin
            - call: "POST /employers"
              payload: { name: "Library Board", employer_code: "LIB" }
              as: FundAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /members"
              payload: { employer_id: "${emp_id}", full_name: "Conserve Connie", date_of_birth: "1980-01-01", hire_date: "2024-06-01" }
              as: MemberServicesAnalyst
              captures: { mem_id: $.data.id }
            - call: "POST /employers/${emp_id}/contribution-reports"
              payload: { period_start: "2023-01-01", period_end: "2024-01-01", declared_total_cents: 400000 }
              as: EmployerClerk
              as_user_id: "${emp_id}"
              captures: { rep1: $.data.id }
            - call: "POST /contribution-reports/${rep1}/lines"
              payload: { member_id: "${mem_id}", fiscal_year: 2023, period_salary_cents: 5000005, contribution_amount_cents: 400000 }
              as: EmployerClerk
              as_user_id: "${emp_id}"
              captures: { l1: $.data.id }
            - { call: "POST /contribution-reports/${rep1}/submit", payload: {}, as: EmployerClerk, as_user_id: "${emp_id}" }
            - { call: "POST /contribution-reports/${rep1}/lines/${l1}/review", payload: { decision: "ACCEPT" }, as: MemberServicesAnalyst }
            - { call: "POST /contribution-reports/${rep1}/finalize", payload: {}, as: MemberServicesAnalyst }
            - call: "POST /members/${mem_id}/service-purchases"
              payload: { purchase_type: "MILITARY", service_period_start: "2005-01-01", service_period_end: "2006-12-31", years_purchased: 2.0 }
              as: Member
              as_user_id: "${mem_id}"
              captures: { pur_id: $.data.id }
            - { call: "POST /service-purchases/${pur_id}/quote", payload: {}, as: MemberServicesAnalyst }
            - call: "POST /service-purchases/${pur_id}/accept"
              payload: { installment_count: 12 }
              as: Member
              as_user_id: "${mem_id}"
              captures: { pv0: $.data.version, bal0: $.data.balance_due_cents }
            - call: "GET /service-purchases/${pur_id}/payments"
              payload: {}
              as: Member
              as_user_id: "${mem_id}"
              captures: { pay1: "$.data[0].id", pay2: "$.data[1].id" }
          trigger:
            - call: "POST /service-purchases/${pur_id}/payments"
              payload: { payment_id: "${pay1}", expected_purchase_version: "${pv0}" }
              as: Member
              as_user_id: "${mem_id}"
              captures: { bal1: $.data.balance_due_cents, pv1: $.data.version }
            - call: "POST /service-purchases/${pur_id}/payments"
              payload: { payment_id: "${pay2}", expected_purchase_version: "${pv1}" }
              as: Member
              as_user_id: "${mem_id}"
              captures: { bal2: $.data.balance_due_cents }
            - call: "POST /service-purchases/${pur_id}/cancel"
              payload: {}
              as: Member
              as_user_id: "${mem_id}"
              captures: { bal3: $.data.balance_due_cents, refunded: $.data.refunded_total_cents, pur_status: $.data.status }
          assert:
            - "At plan open: balance_due_cents == 1000001 == quoted_cost_cents (invariant base case)"
            - "After payment 1: balance_due_cents == 916668 (1000001 - 83333); invariant 1000001 == 916668 + 83333 holds"
            - "After payment 2: balance_due_cents == 833335; invariant 1000001 == 833335 + 166666 holds"
            - "After cancel (compensating action): status == CANCELLED, balance_due_cents == 0, refunded_total_cents == 166666 == previously applied sum; both payments REFUNDED; sum(APPLIED) == 0 — no money created or destroyed"

      - name: service_credit_conservation_on_line_review
        grounds:
          - calculations.member_service_accrual
          - state_machines.ContributionLine.PENDING_to_ACCEPTED
          - state_machines.ContributionLine.PENDING_to_REJECTED
        distinguishing_aspect: |
          Conserved quantity: service-time (months). Invariant:
          member.total_service_years == round(sum(service_months over ACCEPTED
          lines)/12 + sum(years_purchased over COMPLETED purchases), 2); a review
          decision moving a line PENDING->REJECTED (never counted) versus
          PENDING->ACCEPTED (counted) keeps the total a pure function of line
          statuses — rejecting then accepting restores the value exactly.
          Companion instance purchase_plan_money_conservation_through_payment_and_cancel
          conserves money (cents), a different quantity.
        test_recipe:
          setup:
            - "Fund, Employer, Member; report with two lines: L1 FY2022 (12 months, ACCEPTED), L2 FY2023 (12 months, still PENDING); member.total_service_years == 1.0"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: FundAdmin }
            - call: "POST /pension-funds"
              payload: { fund_name: "State Retirement", cola_rate_pct: 0.025, earnings_limit_annual_cents: 3000000 }
              as: FundAdmin
            - call: "POST /employers"
              payload: { name: "Conservation Dept", employer_code: "CD" }
              as: FundAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /members"
              payload: { employer_id: "${emp_id}", full_name: "Service Sam", date_of_birth: "1966-01-01", hire_date: "2016-01-01" }
              as: MemberServicesAnalyst
              captures: { mem_id: $.data.id }
            - call: "POST /employers/${emp_id}/contribution-reports"
              payload: { period_start: "2022-01-01", period_end: "2024-01-01", declared_total_cents: 920000 }
              as: EmployerClerk
              as_user_id: "${emp_id}"
              captures: { rep1: $.data.id }
            - call: "POST /contribution-reports/${rep1}/lines"
              payload: { member_id: "${mem_id}", fiscal_year: 2022, period_salary_cents: 5500000, contribution_amount_cents: 440000 }
              as: EmployerClerk
              as_user_id: "${emp_id}"
              captures: { l22: $.data.id }
            - call: "POST /contribution-reports/${rep1}/lines"
              payload: { member_id: "${mem_id}", fiscal_year: 2023, period_salary_cents: 6000000, contribution_amount_cents: 480000 }
              as: EmployerClerk
              as_user_id: "${emp_id}"
              captures: { l23: $.data.id }
            - { call: "POST /contribution-reports/${rep1}/submit", payload: {}, as: EmployerClerk, as_user_id: "${emp_id}" }
            - { call: "POST /contribution-reports/${rep1}/lines/${l22}/review", payload: { decision: "ACCEPT" }, as: MemberServicesAnalyst }
          trigger:
            - { call: "POST /contribution-reports/${rep1}/lines/${l23}/review", payload: { decision: "REJECT", review_note: "duplicate suspected" }, as: MemberServicesAnalyst }
            - call: "GET /members/${mem_id}"
              payload: {}
              as: MemberServicesAnalyst
              captures: { yrs_after_reject: $.data.total_service_years }
            - { call: "POST /contribution-reports/${rep1}/finalize", payload: {}, as: MemberServicesAnalyst, captures: { rep_status: $.data.status } }
            - { call: "POST /contribution-reports/${rep1}/lines/${l23}/review", payload: { decision: "ACCEPT", review_note: "verified" }, as: MemberServicesAnalyst }
            - call: "GET /members/${mem_id}"
              payload: {}
              as: MemberServicesAnalyst
              captures: { yrs_after_accept: $.data.total_service_years }
          assert:
            - "After L1 accepted only: total_service_years == 1.0"
            - "After L2 REJECTED: total_service_years stays 1.0 (PENDING never counted; rejection changes nothing yet)"
            - "Report moved to VARIANCE on finalize (rejected line present)"
            - "After L2 re-reviewed ACCEPTED: total_service_years == 2.0 and report RECONCILED — the reject-then-accept pair leaves service-time a pure function of final line statuses with no drift"
