              as: PayrollAdmin
            - call: "POST /driver-pay/loads/${load_esr}/dispatch"
              payload: {}
              as: SettlementClerk
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-04T18:00:00Z" }
              as: PayrollAdmin
            - call: "POST /driver-pay/loads/${load_esr}/deliver"
              payload: {}
              as: SettlementClerk
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T09:00:00Z" }
              as: PayrollAdmin
