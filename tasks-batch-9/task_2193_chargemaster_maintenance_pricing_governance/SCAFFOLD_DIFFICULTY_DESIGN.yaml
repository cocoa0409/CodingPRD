      facility ratio) resolved by a pinned evaluation order: with

      aggregate_markup_limit_bp = 11000 the exclusive-snapshot order yields

      projected_markup_ratio_bp == 10947 and the APPROVE succeeds, whereas the naive

      add-proposal-onto-the-live-aggregate order would yield 11724 and wrongly raise

      ERR_AGGREGATE_MARKUP_LIMIT.

      '
