            - "SigningCredential.${cert_id}.revocation_reason == SUPERSEDED"
            - "SigningCredential.${cert_b_id}.activated_at == 2026-08-01T00:00:00Z"
            - "GET /signing-credentials?publisher_account_id=${acct_id}&status=ACTIVE returns meta.total_count == 1"

      - name: revoking_the_credential_that_signed_an_in_review_build_returns_credential_in_use
        claim_type: Conditional action
        grounds:
          - state_machines.SigningCredential.transitions.ACTIVE_to_REVOKED
          - errors.ERR_CREDENTIAL_IN_USE
        distinguishing_aspect: "Manual revocation is refused with 409 ERR_CREDENTIAL_IN_USE exactly while a Submission signed with the credential sits in WAITING_FOR_REVIEW or IN_REVIEW; report-compromise on the same credential is still permitted."
