  # ===========================================================================
  # RBAC
  # ===========================================================================
  - section: rbac
    instances:
      - name: planner_cannot_create_product
        claim_type: exclusive_denied
        grounds: [roles, "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "ProductionPlanner calling POST /products (ManufacturingEngineer-exclusive) -> ERR_FORBIDDEN (403)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /products"
              payload: { sku: "FG-RB", name: "FG", product_type: "FINISHED_GOOD" }
              as: ProductionPlanner
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 403"
            - "response.data.error_id == ERR_FORBIDDEN"

      - name: operator_cannot_release_work_order
        claim_type: exclusive_denied
        grounds: [roles, "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "MachineOperator calling POST /work-orders/{id}/release (ProductionPlanner-exclusive) -> ERR_FORBIDDEN."
        test_recipe:
          setup: ["A PLANNED WorkOrder with a RELEASED routing."]
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "FG-RB2", name: "FG", product_type: "FINISHED_GOOD" }
              as: ManufacturingEngineer
              captures: { fg_id: $.data.id }
            - call: "POST /machines"
              payload: { machine_code: "M-RB2", work_center: "WC1", planned_production_secs: 28800 }
              as: ManufacturingEngineer
              captures: { m_id: $.data.id }
            - call: "POST /routings"
              payload: { product_id: "${fg_id}", routing_code: "RT-RB2" }
              as: ManufacturingEngineer
              captures: { rt_id: $.data.id }
            - call: "POST /routings/${rt_id}/operations"
              payload: { machine_id: "${m_id}", sequence_no: 10, ideal_cycle_time_secs: 100 }
              as: ManufacturingEngineer
            - call: "POST /routings/${rt_id}/release"
              payload: {}
              as: ManufacturingEngineer
            - call: "POST /work-orders"
              payload: { product_id: "${fg_id}", routing_id: "${rt_id}", order_qty: 1 }
              as: ProductionPlanner
              captures: { wo_id: $.data.id, wo_v: $.data.version }
          trigger:
            - call: "POST /work-orders/${wo_id}/release"
              payload: { expected_work_order_version: "${wo_v}" }
              as: MachineOperator
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 403"
            - "response.data.error_id == ERR_FORBIDDEN"

      - name: missing_auth_headers_unauthenticated
        claim_type: auth_required
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request with an unknown/blank role -> ERR_UNAUTHENTICATED (401) before any other check."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /work-orders"
              payload: {}
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 401"
            - "response.data.error_id == ERR_UNAUTHENTICATED"

      - name: plantadmin_override_can_create_product
        claim_type: hierarchical_override
        grounds: [roles]
        distinguishing_aspect: "PlantAdmin (override superset) can perform ManufacturingEngineer-exclusive POST /products -> 201."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /products"
              payload: { sku: "FG-ADM", name: "FG", product_type: "FINISHED_GOOD" }
              as: PlantAdmin
              captures: { p_id: $.data.id }
          assert:
            - "response.status == 201"
            - "Product.${p_id}.sku == FG-ADM"

  # ===========================================================================
  # Cross-Cutting Complexity Layers
  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_release_correct_version_succeeds_and_bumps
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[wo-release-stale-version]", entities.WorkOrder.fields.version]
        distinguishing_aspect: "Releasing with expected_work_order_version equal to the order's current version succeeds and bumps version by 1."
        test_recipe:
          setup: ["A PLANNED WorkOrder version 1 with a RELEASED routing."]
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "FG-OK", name: "FG", product_type: "FINISHED_GOOD" }
              as: ManufacturingEngineer
              captures: { fg_id: $.data.id }
            - call: "POST /machines"
              payload: { machine_code: "M-OK", work_center: "WC1", planned_production_secs: 28800 }
              as: ManufacturingEngineer
              captures: { m_id: $.data.id }
            - call: "POST /routings"
              payload: { product_id: "${fg_id}", routing_code: "RT-OK" }
              as: ManufacturingEngineer
              captures: { rt_id: $.data.id }
            - call: "POST /routings/${rt_id}/operations"
              payload: { machine_id: "${m_id}", sequence_no: 10, ideal_cycle_time_secs: 100 }
              as: ManufacturingEngineer
            - call: "POST /routings/${rt_id}/release"
              payload: {}
              as: ManufacturingEngineer
            - call: "POST /work-orders"
              payload: { product_id: "${fg_id}", routing_id: "${rt_id}", order_qty: 1 }
              as: ProductionPlanner
              captures: { wo_id: $.data.id, wo_v: $.data.version }
          trigger:
            - call: "POST /work-orders/${wo_id}/release"
              payload: { expected_work_order_version: "${wo_v}" }
              as: ProductionPlanner
              captures: { new_v: $.data.version, st: $.data.status }
          assert:
            - "WorkOrder.${wo_id}.status == RELEASED"
            - "WorkOrder.${wo_id}.version == 2"

      - name: occ_release_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[wo-release-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Releasing with a stale expected_work_order_version (observed-1) -> ERR_STALE_VERSION (412); two strictly sequential requests, no parallelism."
        test_recipe:
          setup: ["A PLANNED WorkOrder version 1 with a RELEASED routing."]
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "FG-ST", name: "FG", product_type: "FINISHED_GOOD" }
              as: ManufacturingEngineer
              captures: { fg_id: $.data.id }
            - call: "POST /machines"
              payload: { machine_code: "M-ST", work_center: "WC1", planned_production_secs: 28800 }
              as: ManufacturingEngineer
              captures: { m_id: $.data.id }
            - call: "POST /routings"
              payload: { product_id: "${fg_id}", routing_code: "RT-ST" }
              as: ManufacturingEngineer
              captures: { rt_id: $.data.id }
            - call: "POST /routings/${rt_id}/operations"
              payload: { machine_id: "${m_id}", sequence_no: 10, ideal_cycle_time_secs: 100 }
              as: ManufacturingEngineer
            - call: "POST /routings/${rt_id}/release"
              payload: {}
              as: ManufacturingEngineer
            - call: "POST /work-orders"
              payload: { product_id: "${fg_id}", routing_id: "${rt_id}", order_qty: 1 }
              as: ProductionPlanner
              captures: { wo_id: $.data.id, wo_v: $.data.version }
          trigger:
            - call: "POST /work-orders/${wo_id}/release"
              payload: { expected_work_order_version: "${wo_v} - 1" }
              as: ProductionPlanner
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 412"
            - "response.data.error_id == ERR_STALE_VERSION"

      - name: version_increments_on_each_mutation
        claim_type: optimistic_concurrency
        grounds: [entities.Routing.fields.status, endpoints]
        distinguishing_aspect: "A routing's version increments by exactly 1 on the release mutation (1 -> 2)."
        test_recipe:
          setup: ["A DRAFT routing version 1 with one op."]
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "FG-VR", name: "FG", product_type: "FINISHED_GOOD" }
              as: ManufacturingEngineer
              captures: { fg_id: $.data.id }
            - call: "POST /machines"
              payload: { machine_code: "M-VR", work_center: "WC1", planned_production_secs: 28800 }
              as: ManufacturingEngineer
              captures: { m_id: $.data.id }
            - call: "POST /routings"
              payload: { product_id: "${fg_id}", routing_code: "RT-VR" }
              as: ManufacturingEngineer
              captures: { rt_id: $.data.id, rt_v: $.data.version }
            - call: "POST /routings/${rt_id}/operations"
              payload: { machine_id: "${m_id}", sequence_no: 10, ideal_cycle_time_secs: 100 }
              as: ManufacturingEngineer
            - call: "GET /routings/${rt_id}"
              payload: {}
              as: ManufacturingEngineer
              captures: { pre_v: $.data.version }
          trigger:
            - call: "POST /routings/${rt_id}/release"
              payload: {}
              as: ManufacturingEngineer
              captures: { new_v: $.data.version }
          assert:
            - "Routing.${rt_id}.status == RELEASED"
            - "Routing.${rt_id}.version == ${pre_v} + 1"

      - name: cancel_lot_reversal_cascade_excluded
        claim_type: cascading_side_effects
        grounds: [state_machines.WorkOrder.RELEASED_to_CANCELLED]
        excluded_because:
          difficulty_instance: compensating_invariant / lot_quantity_conserved_under_issue_then_cancel_reversal
          rationale: "Cancel -> lot-issue reversal cascade is asserted by the named §1.8 instance."

      - name: derived_wip_reconciliation_excluded
        claim_type: derived_field_reconciliation
        grounds: [entities.WorkOrder.fields.wip_qty]
        excluded_because:
          difficulty_instance: compensating_invariant / wip_quantity_conserved_under_scrap_disposition
          rationale: "WIP derived-field reconciliation under scrap is asserted by the named §1.8 instance."

  # ===========================================================================
  # FK integrity / Consistency model
  # ===========================================================================
  - section: entities
    instances:
      - name: routing_with_nonexistent_product_not_found
        claim_type: Parent Relationships
        grounds: [entities.Routing.fields.product_id, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "Creating a routing whose product_id references no Product -> ERR_NOT_FOUND (FK integrity)."
        test_recipe:
          setup: ["Empty DB (no products)."]
          setup_api_calls: []
          trigger:
            - call: "POST /routings"
              payload: { product_id: "00000000-0000-4000-8000-000000000000", routing_code: "RT-NF" }
              as: ManufacturingEngineer
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_NOT_FOUND"

      - name: lot_issue_reverse_reachable_by_filter
        claim_type: Retrieval
        grounds: [entities.LotIssue.fields.lot_id, endpoints]
        distinguishing_aspect: "After issuing a lot, GET /lot-issues?lot_id finds the issue (FK reverse-reachability)."
        test_recipe:
          setup: ["A released WO with a demand for R1; lot of R1 received; 1 issued."]
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "FG-RR", name: "FG", product_type: "FINISHED_GOOD" }
              as: ManufacturingEngineer
              captures: { fg_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "R1-RR", name: "R1", product_type: "RAW_MATERIAL", unit_cost_cents: 100, lot_controlled: true }
              as: ManufacturingEngineer
              captures: { r1_id: $.data.id }
            - call: "POST /bom-lines"
              payload: { parent_product_id: "${fg_id}", component_product_id: "${r1_id}", quantity_per: 1, scrap_factor_pct: 0 }
              as: ManufacturingEngineer
            - call: "POST /machines"
              payload: { machine_code: "M-RR", work_center: "WC1", planned_production_secs: 28800 }
              as: ManufacturingEngineer
              captures: { m_id: $.data.id }
            - call: "POST /routings"
              payload: { product_id: "${fg_id}", routing_code: "RT-RR" }
              as: ManufacturingEngineer
              captures: { rt_id: $.data.id }
            - call: "POST /routings/${rt_id}/operations"
              payload: { machine_id: "${m_id}", sequence_no: 10, ideal_cycle_time_secs: 100 }
              as: ManufacturingEngineer
            - call: "POST /routings/${rt_id}/release"
              payload: {}
              as: ManufacturingEngineer
            - call: "POST /work-orders"
              payload: { product_id: "${fg_id}", routing_id: "${rt_id}", order_qty: 1 }
              as: ProductionPlanner
              captures: { wo_id: $.data.id, wo_v: $.data.version }
            - call: "POST /work-orders/${wo_id}/release"
              payload: { expected_work_order_version: "${wo_v}" }
              as: ProductionPlanner
            - call: "GET /component-demands"
              payload: { work_order_id: "${wo_id}", component_product_id: "${r1_id}" }
              as: ProductionPlanner
              captures: { cd_id: "$.data[0].id" }
            - call: "GET /work-orders/${wo_id}/operations"
              payload: {}
              as: ProductionPlanner
              captures: { woop1_id: "$.data[0].id" }
            - call: "POST /lots"
              payload: { product_id: "${r1_id}", lot_code: "L-RR", received_qty: 5 }
              as: MachineOperator
              captures: { l1_id: $.data.id }
            - call: "POST /lot-issues"
              payload: { component_demand_id: "${cd_id}", lot_id: "${l1_id}", work_order_operation_id: "${woop1_id}", issued_qty: 1 }
              as: MachineOperator
              captures: { li_id: $.data.id }
          trigger:
            - call: "GET /lot-issues"
              payload: { lot_id: "${l1_id}" }
              as: MachineOperator
          assert:
            - "response.response_type == array"
            - "response.meta.total_count == 1"
            - "lot_issues[0].lot_id == ${l1_id}"
