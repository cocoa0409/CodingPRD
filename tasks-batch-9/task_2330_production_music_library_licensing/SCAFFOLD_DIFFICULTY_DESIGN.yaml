              as: RightsManager
              captures: { ag1: $.data.id }
            - call: "POST /music-library/composer-agreements/${ag1}/submit-for-signature"
              payload: {}
              as: RightsManager
            - call: "POST /music-library/composer-agreements/${ag1}/sign"
              payload: { signature_name: "Kwame Boateng" }
              as: Composer
              as_user_id: "${c1}"
            - call: "POST /music-library/compositions"
              payload: { composer_id: "${c1}", agreement_id: "${ag1}", title: "Accra Morning", duration_sec: 150, tempo_bpm: 116, genre: "HIPHOP", mood_tags: ["UPLIFTING"], instrumentation: ["PERCUSSION", "BRASS"] }
              as: CatalogAdmin
              captures: { comp1: $.data.id }
            - call: "POST /music-library/compositions/${comp1}/catalog"
              payload: {}
              as: CatalogAdmin
              captures: { comp1_v1: $.data.version }
            - call: "POST /music-library/license-tiers"
              payload: { code: "BLK-TV", media_type: "BROADCAST_TV", allowed_scales: ["NATIONAL"], base_rate_cents: 300000, min_term_months: 1, max_term_months: 120, per_use_eligible: false, blanket_eligible: true }
              as: CatalogAdmin
              captures: { tierBlk: $.data.id }
            - call: "POST /music-library/licensees"
              payload: { legal_name: "Coastline Channel", licensee_type: "BROADCASTER", credit_limit_cents: 10000000 }
              as: LicensingAgent
              captures: { lee1: $.data.id }
            - call: "POST /music-library/blanket-agreements"
              payload: { licensee_id: "${lee1}", coverage_start: "2026-08-01T00:00:00Z", coverage_end: "2027-08-01T00:00:00Z", annual_fee_cents: 4800000, reporting_cadence: "MONTHLY", usage_cap_minutes: 10, pool_share_pct: 20.00 }
              as: LicensingAgent
              captures: { ba1: $.data.id }
          trigger:
            - call: "POST /music-library/licenses"
              payload: { license_mode: "BLANKET", expected_composition_version: "${comp1_v1}", composition_id: "${comp1}", blanket_agreement_id: "${ba1}", tier_id: "${tierBlk}", media_type: "BROADCAST_TV", distribution_scale: "NATIONAL", term_start: "2026-08-01T00:00:00Z", term_months: 12 }
              as: LicensingAgent
            - call: "POST /music-library/blanket-agreements/${ba1}/activate"
