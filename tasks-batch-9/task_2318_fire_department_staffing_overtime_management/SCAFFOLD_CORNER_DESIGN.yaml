  # ===========================================================================
  - section: errors
    instances:
      - name: station_create_without_a_role_header_is_unauthenticated
        claim_type: error_triggerable
        grounds:
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "A request with no X-User-Role header, and a request whose X-User-Role is a string that is not one of the four declared roles, both fail as ERR_UNAUTHENTICATED (401) rather than as ERR_FORBIDDEN_ROLE (403)."
        test_recipe:
          setup:
            - "No fixture is required; both probes fail before any resource is touched."
          setup_api_calls: []
          trigger:
            - call: "POST /fire-ops/stations"
              payload: { name: "Station X", battalion_code: "F9", minimum_staffing_floor: 1, fiscal_ot_budget_cents: 500000, fiscal_period_start_date: "2026-08-01", fiscal_period_end_date: "2026-08-31" }
              as: StaffingOfficer
              captures: { errA: "$.data.error_id" }
            - call: "GET /fire-ops/stations"
              payload: {}
              as: StaffingOfficer
              captures: { errB: "$.data.error_id" }
          assert:
            - "FIRST PROBE is sent with the X-User-Role header omitted entirely: HTTP 401 and error_id == \"ERR_UNAUTHENTICATED\""
            - "SECOND PROBE is sent with X-User-Role: BattalionChief, a value outside the declared role set: HTTP 401 and error_id == \"ERR_UNAUTHENTICATED\", not 403"
            - "Both responses carry the error envelope: response_type == \"error\" with meta.api_request_id present and data.message non-empty"
            - "No Station is created — a subsequent authenticated GET /fire-ops/stations?battalion_code=F9 returns total_count == 0"

      - name: seating_a_member_as_payroll_analyst_is_forbidden
        claim_type: error_triggerable
        grounds:
          - errors[ERR_FORBIDDEN_ROLE]
          - roles.CompanyOfficer.exclusive_operations
        distinguishing_aspect: "A recognised role calling an operation outside its authorization list fails with ERR_FORBIDDEN_ROLE (403), which is distinct from the 401 raised for an unknown role, and no seat is written."
        test_recipe:
          setup:
            - "Station 124 with floor 1, one company ENGINE-124 (crew 1, no required certifications), one member ff124 (platoon C, Kelly 1) and the 2026-08-11 shift published with one OPEN vacancy."
          setup_api_calls:
            - call: "POST /fire-ops/stations"
              payload: { name: "Station 124", battalion_code: "F9", minimum_staffing_floor: 1, fiscal_ot_budget_cents: 500000, fiscal_period_start_date: "2026-08-01", fiscal_period_end_date: "2026-08-31" }
              as: StaffingOfficer
              captures: { st124: "$.data.id" }
            - call: "POST /fire-ops/apparatus"
              payload: { station_id: "${st124}", unit_designation: "ENGINE-124", apparatus_type: "ENGINE", minimum_crew_size: 1, required_certifications: [], closure_priority: 10 }
              as: StaffingOfficer
              captures: { eng124: "$.data.id" }
            - call: "POST /fire-ops/firefighters"
              payload: { station_id: "${st124}", full_name: "E Escobar", rank: "FIREFIGHTER", platoon: "C", seniority_rank: 1, kelly_day_cycle_position: 1, certifications: [], hourly_rate_cents: 4000 }
              as: StaffingOfficer
              captures: { ff124: "$.data.id" }
            - call: "POST /fire-ops/duty-shifts"
              payload: { station_id: "${st124}", shift_date: "2026-08-11", platoon: "C" }
              as: StaffingOfficer
              captures: { sh124: "$.data.id" }
            - call: "POST /fire-ops/duty-shifts/${sh124}/publish"
              payload: {}
              as: StaffingOfficer
              captures: { sh124_v: "$.data.version" }
          trigger:
            - call: "POST /fire-ops/shift-assignments"
              payload: { duty_shift_id: "${sh124}", firefighter_id: "${ff124}", apparatus_id: "${eng124}", assignment_type: "REGULAR", seat_certification: "NONE", scheduled_hours: 24, expected_duty_shift_version: "${sh124_v}" }
              as: PayrollAnalyst
              captures: { err124: "$.data.error_id" }
          assert:
            - "HTTP 403 and error_id == \"ERR_FORBIDDEN_ROLE\""
            - "The role check precedes every referential and business check: the payload is otherwise perfectly valid"
            - "DutyShift.${sh124}.assigned_headcount == 0, open_vacancy_count == 1, version == ${sh124_v}"
            - "GET /fire-ops/shift-assignments?duty_shift_id=${sh124} returns total_count == 0"

      - name: leave_filed_on_behalf_of_another_member_is_rejected
        claim_type: error_triggerable
        grounds:
          - errors[ERR_NOT_RESOURCE_OWNER]
          - validations[priority=5]
        distinguishing_aspect: "A Firefighter with the correct role but the wrong X-User-ID cannot file leave for a colleague: ERR_NOT_RESOURCE_OWNER (403) is returned even though both members exist and the shift is valid, and the same guard rejects a response to someone else's overtime offer."
        test_recipe:
          setup:
            - "Station 125 with floor 1, budget 900000, one company ENGINE-125 (crew 2, no required certifications) and a VOLUNTARY_OT roster scoped NONE."
            - "Members ff125a (platoon C, Kelly 1, seniority 1, rate 4000) and ff125b (platoon C, Kelly 2, seniority 2, rate 4000); ff125o is the officer."
            - "The 2026-08-11 shift is published; ff125a holds a REGULAR seat, and a VOLUNTARY 24-hour offer for the remaining vacancy has been dispatched — the hiring order selects ff125b because ff125a already has a SCHEDULED seat on the shift."
