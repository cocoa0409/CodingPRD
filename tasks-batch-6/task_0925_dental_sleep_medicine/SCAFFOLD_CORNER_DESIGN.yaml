            - "${st_noisy} == DIAGNOSTIC_VALID"
            - "SleepStudy.${psg_noisy_id}.severity_index == 30.0"
            - "SleepStudy.${psg_unattended_id}.severity_index == 30.0 is still stored on the rejected study"
            - "SleepStudy.${psg_unattended_id}.severity_band == null"

