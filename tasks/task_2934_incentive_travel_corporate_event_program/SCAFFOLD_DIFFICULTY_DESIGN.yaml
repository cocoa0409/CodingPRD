      - POST /registrations/${rb_id}/confirm {} as TravelDesk td-01 — both guards are violated.
      - 'POST /registrations/${rb_id}/respond {"response": "ACCEPT"} as Participant ${qb_id} — removes
        only the state violation.'
      - POST /registrations/${rb_id}/confirm {} as TravelDesk td-01 — now only the fiscal guard is violated.
      assert:
      - the first confirm returns error_id "ERR_REGISTRATION_STATE_INVALID" with HTTP 409, NOT "ERR_BUDGET_HEADROOM_EXCEEDED".
      - 'after the first confirm: Registration.${rb_id}.attendance_status is still "INVITED", room_nights
        == 0, Program.committed_budget_cents is still 1443174 and budget_headroom_cents is still 56826.'
      - the respond call succeeds and attendance_status becomes "ACCEPTED" with cost_cents still 105500.
      - the second confirm returns error_id "ERR_BUDGET_HEADROOM_EXCEEDED" with HTTP 422 — the lower-priority
        rule surfaces only after the higher-priority one is satisfied.
      - 'after the second confirm: attendance_status is still "ACCEPTED", SupplierContract.${c1_id}.room_nights_confirmed
        == 0 and Program.budget_posture is still "WATCH".'
      - neither rejected call incremented Program.committed_budget_cents.
  - name: activity_waiver_safety_check_precedes_transfer_buffer_temporal_check
