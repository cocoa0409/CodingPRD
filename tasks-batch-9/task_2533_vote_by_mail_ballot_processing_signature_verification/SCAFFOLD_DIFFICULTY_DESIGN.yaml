  - rule_id: resource_temporal_overlap
    instances:
      - name: observer_party_slot_half_open_window_adjacency
        grounds:
          - validations.priority_10.ERR_OBSERVER_PARTY_SLOT_CONFLICT
          - entities.ObserverAccessSession.fields.window_start_at
          - state_machines.ObserverAccessSession.SCHEDULED_to_REVOKED
          - endpoints.POST_/vote-by-mail/elections/{id}/observer-sessions
        distinguishing_aspect: |
          Interval semantics: HALF-OPEN [start, end) with no buffer, contended resource = the per-party
          observer slot on ObserverAccessSession (OBSERVER_MAX_CONCURRENT_PER_PARTY 1). Touching endpoints
          do NOT collide, a one-minute encroachment does, a different party is a different resource, and
          revoking a session frees its slot.
        test_recipe:
          setup:
            - "One election in posture PRE_MAIL; clock 2026-09-10T00:00:00Z"
            - "One SCHEDULED DEM observer session s1 for station INTAKE with window [2026-11-03T10:00:00Z, 2026-11-03T12:00:00Z)"
          setup_api_calls:
            - call: "POST /vote-by-mail/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T00:00:00Z" }
              as: ElectionsAdmin
            - call: "POST /vote-by-mail/elections"
              payload: { name: "General 2026", election_date: "2026-11-03", uocava_send_deadline_date: "2026-09-19", domestic_send_deadline_date: "2026-10-05", return_deadline_at: "2026-11-03T20:00:00Z", postage_budget_cents: 1000000, postmark_grace_days: 7, cure_window_days: 21 }
              as: ElectionsAdmin
              captures: { e1: $.data.id }
            - call: "POST /vote-by-mail/elections/${e1}/observer-sessions"
              payload: { observer_user_id: "obs-dem-1", observer_name: "Ola Dem", organization: "County DEM Committee", party_affiliation: "DEM", station_area: "INTAKE", window_start_at: "2026-11-03T10:00:00Z", window_end_at: "2026-11-03T12:00:00Z" }
              as: ElectionsClerk
              captures: { s1: $.data.id, s1_status: $.data.status }
          trigger:
            - call: "POST /vote-by-mail/elections/${e1}/observer-sessions"
              payload: { observer_user_id: "obs-dem-2", observer_name: "Ada Dem", organization: "County DEM Committee", party_affiliation: "DEM", station_area: "SIGNATURE_REVIEW", window_start_at: "2026-11-03T12:00:00Z", window_end_at: "2026-11-03T14:00:00Z" }
              as: ElectionsClerk
              captures: { s2: $.data.id, s2_status: $.data.status }
            - call: "POST /vote-by-mail/elections/${e1}/observer-sessions"
              payload: { observer_user_id: "obs-dem-3", observer_name: "Eve Dem", organization: "County DEM Committee", party_affiliation: "DEM", station_area: "SEPARATION", window_start_at: "2026-11-03T11:59:00Z", window_end_at: "2026-11-03T13:00:00Z" }
              as: ElectionsClerk
              captures: { err_party: $.data.error_id }
            - call: "POST /vote-by-mail/elections/${e1}/observer-sessions"
              payload: { observer_user_id: "obs-rep-1", observer_name: "Rex Rep", organization: "County REP Committee", party_affiliation: "REP", station_area: "INTAKE", window_start_at: "2026-11-03T10:00:00Z", window_end_at: "2026-11-03T12:00:00Z" }
              as: ElectionsClerk
              captures: { s4: $.data.id, s4_status: $.data.status }
            - call: "POST /vote-by-mail/observer-sessions/${s1}/revoke"
              payload: { revocation_reason_code: "CREDENTIAL_WITHDRAWN" }
              as: CanvassSupervisor
              captures: { s1_revoked: $.data.status }
            - call: "POST /vote-by-mail/elections/${e1}/observer-sessions"
              payload: { observer_user_id: "obs-dem-4", observer_name: "Ira Dem", organization: "County DEM Committee", party_affiliation: "DEM", station_area: "INTAKE", window_start_at: "2026-11-03T10:00:00Z", window_end_at: "2026-11-03T12:00:00Z" }
              as: ElectionsClerk
              captures: { s5: $.data.id, s5_status: $.data.status }
          assert:
            - "${s1_status} == \"SCHEDULED\" and ${s2_status} == \"SCHEDULED\" — [12:00,14:00) starts exactly where [10:00,12:00) ends, and half-open geometry means touching endpoints do NOT collide"
            - "${err_party} == \"ERR_OBSERVER_PARTY_SLOT_CONFLICT\" with HTTP 409 — an 11:59 start encroaches by one minute on the DEM slot, and station_area does not partition the slot"
            - "${s4_status} == \"SCHEDULED\" — REP is a different contended resource, so an exactly coincident window is accepted (aggregate occupancy 2 stays within OBSERVER_MAX_CONCURRENT_TOTAL 3)"
            - "${s1_revoked} == \"REVOKED\" and ${s5_status} == \"SCHEDULED\" — a REVOKED session leaves the occupancy set, so its former window becomes bookable again"
            - "GET /vote-by-mail/observer-sessions?election_id=${e1}&party_affiliation=DEM returns exactly 3 rows (${s1} REVOKED, ${s2} and ${s5} SCHEDULED) — the rejected 11:59 session was never created"

