  - section: rbac
    instances:
      - name: an_entitlement_officer_cannot_create_a_community_or_read_leases
        claim_type: role_cannot_perform_others_exclusive_operations
        grounds:
          - roles.EntitlementOfficer
          - roles.DeveloperPrincipal.exclusive_operations
          - errors.ERR_UNAUTHORIZED
        distinguishing_aspect: |
          The entitlement reviewer is deliberately the narrowest role: it owns plat decisions and a
          handful of community and phase reads, so both a write it does not own and a read outside its
          allow-list are 403s. The point is that read access is enumerated per endpoint rather than
          granted wholesale to every operator role.
        test_recipe:
          setup:
            - "No domain state is required; the RBAC check precedes every lookup."
          setup_api_calls: []
          trigger:
            - call: "POST /communities"
              payload: { name: "Larkmead", market_code: "ID-BOI", total_planned_units: 4, product_mix: { DETACHED: 4, COTTAGE: 0, TOWNHOME: 0 }, single_ownership_covenant: true, concession_budget_cents: 1000000, facility_commitment_cents: 20000000, maintenance_tech_headcount: 2 }
              as: EntitlementOfficer
              as_user_id: "u_ent_1"
            - call: "GET /leases"
              payload: {}
              as: EntitlementOfficer
              as_user_id: "u_ent_1"
            - call: "GET /communities"
              payload: {}
              as: EntitlementOfficer
              as_user_id: "u_ent_1"
          assert:
            - "The community creation returns HTTP 403 with data.error_id == ERR_UNAUTHORIZED and no Community is created"
            - "The lease list returns HTTP 403 with data.error_id == ERR_UNAUTHORIZED — EntitlementOfficer is absent from that endpoint's role list"
            - "The community list returns HTTP 200 — it is one of the reads the role does hold"

      - name: a_property_manager_cannot_publish_a_market_rent_schedule
        claim_type: role_cannot_perform_others_exclusive_operations
        grounds:
          - roles.AssetManager.exclusive_operations
          - roles.PropertyManager
          - errors.ERR_UNAUTHORIZED
        distinguishing_aspect: |
          Pricing is an AssetManager exclusive, and the 403 must be returned before the optimistic
          concurrency check even though the request carries a well-formed expected_community_version —
          priority 20 precedes priority 38. The identical body from the AssetManager then publishes, which
          proves the rejection was purely about the role.
        test_recipe:
          setup:
            - "Community 'Mereview' with plat APPROVED and no schedules."
          setup_api_calls:
            - call: "POST /communities"
              payload: { name: "Mereview", market_code: "ID-IDA", total_planned_units: 4, product_mix: { DETACHED: 4, COTTAGE: 0, TOWNHOME: 0 }, single_ownership_covenant: true, concession_budget_cents: 1000000, facility_commitment_cents: 20000000, maintenance_tech_headcount: 2 }
              as: DeveloperPrincipal
              as_user_id: "u_dev_1"
              captures: { c: $.data.id }
            - call: "POST /communities/${c}/plat-submissions"
              payload: { plat_package_reference: "PLAT-MV-1" }
              as: DeveloperPrincipal
              as_user_id: "u_dev_1"
            - call: "POST /communities/${c}/plat-decisions"
              payload: { decision: "APPROVE" }
              as: EntitlementOfficer
              as_user_id: "u_ent_1"
            - call: "GET /communities/${c}"
              payload: {}
              as: PropertyManager
              as_user_id: "u_pm_1"
              captures: { cv: $.data.version }
          trigger:
            - call: "POST /market-rent-schedules"
              payload: { community_id: "${c}", product_type: "DETACHED", effective_from: "2026-08-01T00:00:00Z", repricing_mode: "MANUAL", asking_rent_cents: 285000, expected_community_version: "${cv}" }
              as: PropertyManager
              as_user_id: "u_pm_1"
            - call: "POST /market-rent-schedules"
              payload: { community_id: "${c}", product_type: "DETACHED", effective_from: "2026-08-01T00:00:00Z", repricing_mode: "MANUAL", asking_rent_cents: 285000, expected_community_version: "${cv}" }
              as: AssetManager
              as_user_id: "u_am_1"
              captures: { s: $.data.id }
          assert:
            - "The PropertyManager publication returns HTTP 403 with data.error_id == ERR_UNAUTHORIZED"
            - "Community.${c}.version is unchanged by the rejection, so the captured ${cv} is still current"
            - "The AssetManager publication of the identical body returns HTTP 201 with MarketRentSchedule.${s}.status == PUBLISHED and published_by_user_id == u_am_1"
            - "GET /market-rent-schedules filtered by community_id ${c} reports total_count == 1"

      - name: a_leasing_agent_cannot_decide_the_concession_it_requested
        claim_type: role_cannot_perform_others_exclusive_operations
        grounds:
          - roles.LeasingAgent
          - roles.AssetManager.exclusive_operations
          - errors.ERR_UNAUTHORIZED
