# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# task_1716_livestream_creator_channel_monetization
# Sections follow references/claim-extraction-guide.md.
# =============================================================================
scaffold_corner_design:

  # ============================================================ Entities
  - section: entities
    instances:
      - name: channel_create_defaults_and_initial_posture
        claim_type: defaults
        grounds: [entities.Channel]
        distinguishing_aspect: "Omitting payout_schedule/payout_threshold_cents applies defaults MONTHLY/10000; initial posture RESTRICTED (no verified tax form), balances 0, version 1."
        test_recipe:
          setup: ["Empty DB; default clock 2026-08-01T00:00:00Z (never set)"]
          setup_api_calls:
            - call: "POST /api/channels"
              payload: { handle: "corner_def", display_name: "Corner Def", home_platform: "TWITCH" }
              as: PlatformAdmin
              captures: { ch_id: $.data.id }
          trigger:
            - call: "GET /api/channels/${ch_id}"
              as: PlatformAdmin
          assert:
            - "Channel.payout_schedule == MONTHLY and payout_threshold_cents == 10000 (defaults applied)"
            - "Channel.monetization_posture == RESTRICTED (initial: no VERIFIED tax form)"
            - "balance_pending_cents == 0, balance_payable_cents == 0, lifetime_paid_cents == 0, active_strike_count == 0"
            - "version == 1 and created_at == 2026-08-01T00:00:00Z (default logical clock)"

      - name: revenue_event_immutable_no_version_field
        claim_type: immutability
        grounds: [entities.RevenueEvent]
        distinguishing_aspect: "common_fields:false — a created RevenueEvent exposes id and created_at but no version/updated_at, and no PATCH endpoint exists for it."
        test_recipe:
          setup: ["Channel exists"]
          setup_api_calls:
            - call: "POST /api/channels"
              payload: { handle: "corner_imm", display_name: "Corner Imm", home_platform: "YOUTUBE" }
              as: PlatformAdmin
              captures: { ch_id: $.data.id }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/channels/${ch_id}/revenue-events"
              payload: { kind: "TIP", gross_cents: 7777, platform_fee_bps: 500, occurred_at: "2026-08-05T01:00:00Z" }
              as: PlatformAdmin
              captures: { ev_id: $.data.id }
          assert:
            - "Response data contains id and created_at; response data has NO version key and NO updated_at key"
            - "RevenueEvent.${ev_id}.recognition_status == PENDING and net_cents == 7388 (round_half_up(7777*0.95))"
            - "settlement_month == '2026-08' derived from occurred_at"

      - name: channel_get_missing_returns_not_found
        claim_type: not_found
        grounds:
          - "entities.Channel"
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "GET with a well-formed but nonexistent channel id returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /api/channels/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_NOT_FOUND with HTTP 404 and error envelope shape per §1.0"

      - name: stream_create_inverted_window_rejected
        claim_type: type_constraints
        grounds:
          - "entities.StreamSession.fields.scheduled_end"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "scheduled_end <= scheduled_start violates the range constraint -> ERR_INVALID_REQUEST (400) before any overlap check."
        test_recipe:
          setup: ["Channel exists"]
          setup_api_calls:
            - call: "POST /api/channels"
              payload: { handle: "corner_inv", display_name: "Corner Inv", home_platform: "TWITCH" }
              as: PlatformAdmin
              captures: { ch_id: $.data.id }
          trigger:
            - call: "POST /api/channels/${ch_id}/streams"
              payload: { title: "bad", scheduled_start: "2026-08-10T11:00:00Z", scheduled_end: "2026-08-10T10:00:00Z" }
              as: Creator
              as_user_id: "${ch_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REQUEST (400); no stream persisted"

      - name: subscription_cross_channel_fk_rejected
        claim_type: parent_relationships
        grounds:
          - "entities.Subscription.fields.viewer_id"
          - "entities.Subscription.fields.tier_id"
          - "validations[priority=23]"
        distinguishing_aspect: "viewer_id and tier_id must both belong to the path channel; a tier from another channel yields ERR_NOT_FOUND (referential integrity across flat aggregates)."
        test_recipe:
          setup: ["Channels A and B; viewer under A; tier under B"]
          setup_api_calls:
            - call: "POST /api/channels"
              payload: { handle: "corner_fka", display_name: "FK A", home_platform: "TWITCH" }
              as: PlatformAdmin
              captures: { cha: $.data.id }
            - call: "POST /api/channels"
              payload: { handle: "corner_fkb", display_name: "FK B", home_platform: "YOUTUBE" }
              as: PlatformAdmin
              captures: { chb: $.data.id }
            - call: "POST /api/channels/${cha}/viewers"
              payload: { handle: "v_a" }
              as: PlatformAdmin
              captures: { v_a: $.data.id }
            - call: "POST /api/channels/${chb}/tiers"
              payload: { tier_code: "TIER_1", monthly_price_cents: 5000, revenue_share_bps: 5000, perk_inventory_total: 1 }
              as: Creator
              as_user_id: "${chb}"
              captures: { t_b: $.data.id }
          trigger:
            - call: "POST /api/channels/${cha}/subscriptions"
              payload: { viewer_id: "${v_a}", tier_id: "${t_b}" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_NOT_FOUND (404): tier ${t_b} does not belong to channel ${cha}; no subscription created"

  # ============================================================ State Machines
  - section: state_machines
    instances:
      - name: payout_paid_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Payout]
        distinguishing_aspect: "From terminal PAID every further action is rejected; CANCEL on PAID -> ERR_INVALID_STATE and balances unchanged."
        test_recipe:
          setup:
            - "W9-verified channel; TIP 100000@0bps cleared; payout opened, PROCESSed, SETTLE_SUCCESS (PAID)"
          setup_api_calls:
            - call: "POST /api/channels"
              payload: { handle: "sm_lock", display_name: "SM Lock", home_platform: "TWITCH" }
              as: PlatformAdmin
              captures: { ch_id: $.data.id, ch_v: $.data.version }
            - call: "POST /api/channels/${ch_id}/tax-forms"
              payload: { form_type: "W9", legal_name: "SM Lock LLC", tax_id_last4: "1001", expected_channel_version: "${ch_v}" }
              as: Creator
              as_user_id: "${ch_id}"
              captures: { tf_id: $.data.id }
            - call: "POST /api/tax-forms/${tf_id}/transition"
              payload: { action: "VERIFY" }
              as: TrustAgent
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/channels/${ch_id}/revenue-events"
              payload: { kind: "TIP", gross_cents: 100000, platform_fee_bps: 0, occurred_at: "2026-08-03T01:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/ops/run"
              as: PlatformAdmin
            - call: "POST /api/channels/${ch_id}/payouts"
              as: Creator
              as_user_id: "${ch_id}"
              captures: { p_id: $.data.id }
            - call: "POST /api/payouts/${p_id}/transition"
              payload: { action: "PROCESS" }
              as: PlatformAdmin
            - call: "POST /api/payouts/${p_id}/transition"
              payload: { action: "SETTLE_SUCCESS" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/payouts/${p_id}/transition"
              payload: { action: "CANCEL" }
              as: Creator
              as_user_id: "${ch_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE (PAID is terminal)"
            - "Payout.${p_id}.payout_status remains PAID; Channel.balance_payable_cents remains 0 (no compensating restore on a PAID payout)"
            - "Channel.lifetime_paid_cents == 99500"

      - name: simulcast_grant_deny_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.SimulcastGrant.REQUESTED_to_DENIED]
        distinguishing_aspect: "DENIED is terminal: APPROVE on a DENIED grant -> ERR_INVALID_STATE (deny is not reversible by later approval)."
        test_recipe:
          setup: ["Channel; KICK grant REQUESTED then DENIED"]
          setup_api_calls:
            - call: "POST /api/channels"
              payload: { handle: "sm_deny", display_name: "SM Deny", home_platform: "YOUTUBE" }
              as: PlatformAdmin
              captures: { ch_id: $.data.id }
            - call: "POST /api/channels/${ch_id}/simulcast-grants"
              payload: { platform: "KICK", window_start: "2026-08-10T00:00:00Z", window_end: "2026-08-12T00:00:00Z" }
              as: Creator
              as_user_id: "${ch_id}"
              captures: { g_id: $.data.id }
            - call: "POST /api/simulcast-grants/${g_id}/transition"
              payload: { action: "DENY" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/simulcast-grants/${g_id}/transition"
              payload: { action: "APPROVE" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE; grant remains DENIED"

      - name: subscription_past_due_recover_cycle
        claim_type: valid_transition
        grounds: [state_machines.Subscription.ACTIVE_to_PAST_DUE, state_machines.Subscription.PAST_DUE_to_ACTIVE]
        distinguishing_aspect: "Cyclic billing edge: ACTIVE -> PAST_DUE -> ACTIVE is a legal loop; cycles_paid unchanged by the loop; perk grants untouched."
        test_recipe:
          setup: ["Channel; tier TIER_1; viewer; subscription ACTIVE with one PENDING perk grant"]
          setup_api_calls:
            - call: "POST /api/channels"
              payload: { handle: "sm_sub", display_name: "SM Sub", home_platform: "TWITCH" }
              as: PlatformAdmin
              captures: { ch_id: $.data.id }
            - call: "POST /api/channels/${ch_id}/tiers"
              payload: { tier_code: "TIER_1", monthly_price_cents: 5000, revenue_share_bps: 5000, perk_inventory_total: 5 }
              as: Creator
              as_user_id: "${ch_id}"
              captures: { t_id: $.data.id }
            - call: "POST /api/channels/${ch_id}/viewers"
              payload: { handle: "v_sub" }
              as: PlatformAdmin
              captures: { v_id: $.data.id }
            - call: "POST /api/channels/${ch_id}/subscriptions"
              payload: { viewer_id: "${v_id}", tier_id: "${t_id}" }
              as: PlatformAdmin
              captures: { sub_id: $.data.id }
          trigger:
            - call: "POST /api/subscriptions/${sub_id}/transition"
              payload: { action: "MARK_PAST_DUE" }
              as: PlatformAdmin
            - call: "POST /api/subscriptions/${sub_id}/transition"
              payload: { action: "RECOVER" }
              as: PlatformAdmin
              captures: { sub_status: $.data.sub_status, sub_cycles: $.data.cycles_paid }
            - call: "GET /api/subscriptions/${sub_id}/perk-grants"
              as: Creator
              as_user_id: "${ch_id}"
          assert:
            - "After MARK_PAST_DUE: sub_status == PAST_DUE; after RECOVER: sub_status == ACTIVE (cycle closed)"
            - "cycles_paid == 1 (loop does not consume a cycle)"
            - "The perk grant remains PENDING (no void cascade on PAST_DUE)"

      - name: moderation_action_initial_state_and_standing
        claim_type: initial_state
        grounds: [state_machines.ModerationAction, state_machines.Viewer.GOOD_STANDING_to_TIMED_OUT]
        distinguishing_aspect: "A created ModerationAction starts ACTIVE and the compound Viewer.standing flips to TIMED_OUT in the same request's aftermath."
        test_recipe:
          setup: ["Channel; viewer registered (GOOD_STANDING)"]
          setup_api_calls:
            - call: "POST /api/channels"
              payload: { handle: "sm_mod", display_name: "SM Mod", home_platform: "YOUTUBE" }
              as: PlatformAdmin
              captures: { ch_id: $.data.id }
            - call: "POST /api/channels/${ch_id}/viewers"
              payload: { handle: "v_mod" }
              as: PlatformAdmin
              captures: { v_id: $.data.id }
          trigger:
            - call: "POST /api/channels/${ch_id}/moderation-actions"
              payload: { viewer_id: "${v_id}", action_kind: "TIMEOUT", duration_minutes: 600, reason: "spam" }
              as: Creator
              as_user_id: "${ch_id}"
              captures: { ma_id: $.data.id, ma_status: $.data.action_status }
            - call: "GET /api/viewers/${v_id}"
              as: Creator
              as_user_id: "${ch_id}"
              captures: { v_standing: $.data.standing }
          assert:
            - "ModerationAction.${ma_id}.action_status == ACTIVE at creation (initial state)"
            - "expires_at == issued_at + 600 minutes; issued_at == 2026-08-01T00:00:00Z (default clock)"
            - "Viewer.${v_id}.standing == TIMED_OUT (compound derivation from ACTIVE action)"

      - name: tax_form_reject_then_resubmit_cycle
        claim_type: valid_transition
        grounds:
          - "state_machines.TaxForm.REJECTED_to_SUBMITTED"
          - "concurrency_rules[tax-form-supersede-stale-channel]"
        distinguishing_aspect: "Supersession cycle: REJECTED form is superseded by a new SUBMITTED form whose prior_form_id chains back; VERIFY then lifts posture to STANDARD."
        test_recipe:
          setup: ["Channel; first W9 form REJECTED"]
          setup_api_calls:
            - call: "POST /api/channels"
              payload: { handle: "sm_tax", display_name: "SM Tax", home_platform: "TWITCH" }
              as: PlatformAdmin
              captures: { ch_id: $.data.id, ch_v: $.data.version }
            - call: "POST /api/channels/${ch_id}/tax-forms"
              payload: { form_type: "W9", legal_name: "SM Tax LLC", tax_id_last4: "2002", expected_channel_version: "${ch_v}" }
              as: Creator
              as_user_id: "${ch_id}"
              captures: { tf1: $.data.id }
            - call: "POST /api/tax-forms/${tf1}/transition"
              payload: { action: "REJECT", rejection_reason: "illegible" }
              as: TrustAgent
            - call: "GET /api/channels/${ch_id}"
              as: PlatformAdmin
              captures: { ch_v2: $.data.version }
          trigger:
            - call: "POST /api/channels/${ch_id}/tax-forms"
              payload: { form_type: "W9", legal_name: "SM Tax LLC", tax_id_last4: "2003", expected_channel_version: "${ch_v2}" }
              as: Creator
              as_user_id: "${ch_id}"
              captures: { tf2: $.data.id, tf2_prior: $.data.prior_form_id }
            - call: "POST /api/tax-forms/${tf2}/transition"
              payload: { action: "VERIFY" }
              as: TrustAgent
            - call: "GET /api/channels/${ch_id}"
              as: PlatformAdmin
              captures: { ch_posture: $.data.monetization_posture, ch_cur: $.data.tax_form_current_id }
          assert:
            - "Second form SUBMITTED with prior_form_id == first form id (supersession chain)"
            - "First form remains REJECTED (history preserved)"
            - "After VERIFY: Channel.tax_form_current_id == ${tf2} and monetization_posture == STANDARD"

  # ============================================================ Calculations
  - section: calculations
    instances:
      - name: rebate_cliff_boundary_not_crossed_vs_crossed
        claim_type: correct_result
        grounds: [calculations.net_revenue_recognition]
        distinguishing_aspect: "Cliff boundary: month gross 4999999 (< 5000000) yields final == provisional; exactly 5000000 crosses the cliff and the 250bps rebate applies to the whole month."
        test_recipe:
          setup:
            - "Channel A: one TIP 4999999@0bps in August; Channel B: one SPONSORSHIP 5000000@1000bps in August; both settled by the same 2026-09-01 ops run"
          setup_api_calls:
            - call: "POST /api/channels"
              payload: { handle: "calc_ca", display_name: "Calc CA", home_platform: "TWITCH" }
              as: PlatformAdmin
              captures: { cha: $.data.id }
            - call: "POST /api/channels"
              payload: { handle: "calc_cb", display_name: "Calc CB", home_platform: "YOUTUBE" }
              as: PlatformAdmin
              captures: { chb: $.data.id }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/channels/${cha}/revenue-events"
              payload: { kind: "TIP", gross_cents: 4999999, platform_fee_bps: 0, occurred_at: "2026-08-10T01:00:00Z" }
              as: PlatformAdmin
              captures: { ev_a: $.data.id }
            - call: "POST /api/channels/${chb}/revenue-events"
              payload: { kind: "SPONSORSHIP", gross_cents: 5000000, platform_fee_bps: 1000, occurred_at: "2026-08-10T01:00:00Z" }
              as: PlatformAdmin
              captures: { ev_b: $.data.id }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/ops/run"
              as: PlatformAdmin
            - call: "GET /api/revenue-events/${ev_a}"
              as: PlatformAdmin
              captures: { net_a: $.data.net_cents, st_a: $.data.recognition_status }
            - call: "GET /api/revenue-events/${ev_b}"
              as: PlatformAdmin
              captures: { net_b: $.data.net_cents }
          assert:
            - "Channel A event (month gross 4999999 < 5000000): final net_cents == 4999999 == provisional (no rebate)"
            - "Channel B event (month gross 5000000 >= 5000000, inclusive cliff): final net_cents == 4625000 (5000000 * (10000-750)/10000, rebate cuts fee from 1000bps to 750bps) != provisional 4500000"
            - "Both events recognition_status == CLEARED"

      - name: consistency_score_vacuous_schedule
        claim_type: correct_result
        grounds: [calculations.consistency_score]
        distinguishing_aspect: "Conditional branch: zero scheduled streams in the trailing window yields the vacuous perfect score 10000 (not 0, not null)."
        test_recipe:
          setup: ["Channel with no streams at all"]
          setup_api_calls:
            - call: "POST /api/channels"
              payload: { handle: "calc_vac", display_name: "Calc Vac", home_platform: "TWITCH" }
              as: PlatformAdmin
              captures: { ch_id: $.data.id }
          trigger:
            - call: "GET /api/channels/${ch_id}"
              as: PlatformAdmin
              captures: { score: $.data.consistency_score_bps }
          assert:
            - "Channel.consistency_score_bps == 10000 (vacuous-schedule branch)"

      - name: chargeback_reversal_math
        claim_type: correct_result
        grounds: [state_machines.RevenueEvent.CLEARED_to_REVERSED, calculations.payout_balance_ledger]
        distinguishing_aspect: "Reversal subtracts the original net from payable and leaves an audit pair: original REVERSED + CHARGEBACK CLEARED with gross == -10000 linked by reverses_event_id."
        test_recipe:
          setup: ["Channel; TIP 10000@500bps cleared (net 9500, payable 9500)"]
          setup_api_calls:
            - call: "POST /api/channels"
              payload: { handle: "calc_cb2", display_name: "Calc CB2", home_platform: "YOUTUBE" }
              as: PlatformAdmin
              captures: { ch_id: $.data.id }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/channels/${ch_id}/revenue-events"
              payload: { kind: "TIP", gross_cents: 10000, platform_fee_bps: 500, occurred_at: "2026-08-05T01:00:00Z" }
              as: PlatformAdmin
              captures: { ev_id: $.data.id }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/ops/run"
              as: PlatformAdmin
          trigger:
            - call: "POST /api/revenue-events/${ev_id}/reverse"
              payload: { reason: "chargeback" }
              as: PlatformAdmin
              captures: { cb_id: $.data.id, cb_gross: $.data.gross_cents }
            - call: "GET /api/revenue-events/${ev_id}"
              as: PlatformAdmin
              captures: { orig_status: $.data.recognition_status }
            - call: "GET /api/channels/${ch_id}"
              as: PlatformAdmin
              captures: { payable: $.data.balance_payable_cents }
          assert:
            - "CHARGEBACK event created: gross_cents == -10000, recognition_status == CLEARED, reverses_event_id == ${ev_id}"
            - "Original event recognition_status == REVERSED"
            - "Channel.balance_payable_cents == 0 (9500 - 9500)"

      - name: trust_score_constant_penalty
        claim_type: constants_applied
        grounds: [calculations.strike_weight]
        distinguishing_aspect: "TRUST_PENALTY_PER_WEIGHT_BP constant 2500: MAJOR strike (weight 2) -> trust_score_bp == 5000."
        test_recipe:
          setup: ["Channel with one MAJOR strike"]
          setup_api_calls:
            - call: "POST /api/channels"
              payload: { handle: "calc_tr", display_name: "Calc TR", home_platform: "TWITCH" }
              as: PlatformAdmin
              captures: { ch_id: $.data.id }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/channels/${ch_id}/strikes"
              payload: { policy_code: "SPAM", severity: "MAJOR", evidence_ref: "clip://30" }
              as: TrustAgent
              as_user_id: "trust_nina"
          trigger:
            - call: "GET /api/channels/${ch_id}"
              as: PlatformAdmin
              captures: { trust: $.data.trust_score_bp, cnt: $.data.active_strike_count }
          assert:
            - "trust_score_bp == 5000 (10000 - 2500*2)"
            - "active_strike_count == 1 and posture == RESTRICTED"

  # ============================================================ Validations
  - section: validations
    instances:
      - name: missing_auth_headers_returns_unauthenticated
        claim_type: violation_to_error
        grounds:
          - "validations[priority=1]"
          - "errors[ERR_UNAUTHENTICATED]"
        distinguishing_aspect: "A request without X-User-Role/X-User-ID is rejected 401 ERR_UNAUTHENTICATED before any role or existence check."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /api/channels"
              payload: { handle: "noauth", display_name: "No Auth", home_platform: "TWITCH" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_UNAUTHENTICATED with HTTP 401 when auth headers are omitted by the test client"

      - name: creator_cannot_write_foreign_channel
        claim_type: violation_to_error
        grounds:
          - "validations[priority=5]"
          - "errors[ERR_CHANNEL_OWNERSHIP_MISMATCH]"
        distinguishing_aspect: "Entity-backed ownership: Creator whose X-User-ID is channel A posting a deal under channel B -> ERR_CHANNEL_OWNERSHIP_MISMATCH (403)."
        test_recipe:
          setup: ["Channels A and B exist"]
          setup_api_calls:
            - call: "POST /api/channels"
              payload: { handle: "own_a", display_name: "Own A", home_platform: "TWITCH" }
              as: PlatformAdmin
              captures: { cha: $.data.id }
            - call: "POST /api/channels"
              payload: { handle: "own_b", display_name: "Own B", home_platform: "YOUTUBE" }
              as: PlatformAdmin
              captures: { chb: $.data.id }
          trigger:
            - call: "POST /api/channels/${chb}/deals"
