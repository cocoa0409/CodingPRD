        test_recipe:
          setup: ["FY2028 OPEN; budget version PROPOSED; clock at 2027-03-01 (notice date)"]
          setup_api_calls:
            - call: "POST /district/fiscal-years"
              payload: { label: "FY2028", start_date: "2027-07-01", end_date: "2028-06-30", eav_current: 500000000, eav_prior: 480000000, prior_year_extension: 9000000, outstanding_debt_principal: 4500000, fte_ceiling: 200 }
