              as: RebateAccountant
              captures: { rp94_id: $.data.id }
            - call: "POST /nac/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /nac/order-lines"
              payload: { contract_id: "${c95_id}", product_id: "${beef_id}", distribution_center_id: "${dc_id}", quantity_cases: 95 }
              as: OperatorBuyer
              as_user_id: "${op_id}"
              captures: { ln95_c: $.data.id }
            - call: "POST /nac/order-lines/${ln95_c}/invoice"
