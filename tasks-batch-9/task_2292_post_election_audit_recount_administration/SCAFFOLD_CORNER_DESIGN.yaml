        grounds:
          - calculations.tally_discrepancy_measure
          - entities.Audit.fields.measure_variant
        excluded_because:
          difficulty_instance: dual_variant_calc / dual_variant_discrepancy_measure_net_shift_vs_relative_overstatement
          rationale: "That instance feeds identical hand counts to a RISK_LIMITING and a COMPARISON audit and shows the NET_MARGIN_SHIFT measure escalating at 0.0050 while the MAX_RELATIVE_OVERSTATEMENT measure stays below 1.0000, which is both the selection and the divergence claim for this calculation."
      - name: refund_variant_divergence_statutory_versus_prorated
        claim_type: Variant Divergence
        grounds:
          - calculations.recount_cost_and_refund
          - entities.Recount.fields.refund_variant
        excluded_because:
          difficulty_instance: dual_variant_calc / dual_variant_recount_refund_statutory_vs_prorated
          rationale: "That instance settles two recounts with the same cost and deposit, one crossing the 100-vote materiality line and one not, and asserts both refund splits plus the conservation invariant."
      - name: sample_size_per_audit_type_and_alpha
        claim_type: Correct Result
        grounds:
          - calculations.audit_sample_size
          - entities.Audit.fields.planned_sample_size
        excluded_because:
          difficulty_instance: combinatorial_formula / combinatorial_sample_size_four_configurations_one_contest
          rationale: "That instance prices all four sampling configurations (RLA alpha 0.05 and 0.01, COMPARISON, FIXED_PERCENTAGE) against one canvassed contest and covers the ALPHA_FACTOR table, the GAMMA divisor, the MIN_SAMPLE_BATCHES floor and the total_batches cap."
      - name: recount_cost_rounds_each_batch_line_before_summing
        claim_type: Precision
        grounds:
          - calculations.recount_cost_and_refund
          - entities.Recount.fields.actual_cost_cents
        excluded_because:
          difficulty_instance: combinatorial_formula / combinatorial_recount_cost_per_line_rounding_precedes_summation
          rationale: "That instance uses odd batch sizes so per-line round_half_up and sum-then-round differ by one cent, which is the only place this calculation's rounding order is observable."
      - name: deposit_floor_applied_before_the_cap
        claim_type: Constants Applied
        grounds:
          - calculations.recount_deposit_assessment
          - entities.Recount.fields.required_deposit_cents
        excluded_because:
          difficulty_instance: boundary_precision_check / boundary_required_deposit_exactly_at_statutory_floor
          rationale: "That instance prices a partial-scope request whose raw amount lands exactly on DEPOSIT_FLOOR_CENTS and a smaller one that is lifted to the floor, covering FILING_FEE_CENTS, both per-ballot rates and the floor-before-cap ordering."
