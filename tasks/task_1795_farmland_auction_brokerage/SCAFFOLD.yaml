# =============================================================================
# Task 1795: Farmland Auction & Brokerage — scaffold seed tables
# =============================================================================

scenario: |
  Farmland Auction & Brokerage (Farmers National Company style): property
  packaging & tract/parcel splitting strategy, soil productivity index &
  valuation comparables, auction method (live/online/sealed) & bidding
  increments, buyer qualification & earnest money, tenant lease disclosure &
  possession date, mineral/wind rights disposition, closing & title/survey
  coordination, commission & seller net sheet.

domain_name: farmland-auction-brokerage
api_prefix: /api

complexity_profile:
  primary_archetype: multi_party_negotiation   # seller/agent/buyers/admin converge via bids, award, closing
  secondary_archetype: temporal_windowing      # auction windows, EMD deadlines, lease/possession windows
  complexity_layers:
    - optimistic_concurrency                   # OCC on Listing.version (tract adds) and AuctionEvent.version (bids)
    - cascading_side_effects                   # forfeit cascade depth 5; withdraw cascade depth 3
    - dual_variant_calculation                 # valuation + seller net sheet, provisional vs final
    - rate_threshold_triggers                  # tiered bid increments, tiered commission, EMD tiers
  entity_topology: hybrid                      # listing->tract tree plus flat FK web (auction, bid, deposit, closing)
  state_machine_shape: cyclic                  # plus one parallel-dimensions machine (ClosingPackage) and compound gates
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties            # BrokerAgent records escrow payments; PlatformAdmin verifies them and disburses
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Seller
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Seller legal name" }
      - { name: email, type: string, source: input, description: "Seller contact email" }

  - name: BrokerAgent
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Agent name" }
      - { name: license_number, type: string, source: input, description: "Real-estate license number; unique across agents" }

  - name: Buyer
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Buyer legal name" }
      - { name: email, type: string, source: input, description: "Buyer contact email" }
      - { name: proof_of_funds_amount, type: number, source: input, description: "Verified proof-of-funds ceiling; any single bid amount must be <= this" }
      - { name: qualification_status, type: enum, source: system, default: UNVERIFIED, description: "UNVERIFIED | QUALIFIED | EXPIRED | DISQUALIFIED" }
      - { name: qualification_expires_at, type: datetime, source: system, description: "Set by qualify endpoint; bidding requires logical clock strictly before this instant" }

  - name: Listing
    parent: null
    common_fields: true
    fields:
      - { name: seller_id, type: string, source: input, description: "FK -> Seller.id; owning seller" }
      - { name: agent_id, type: string, source: system, description: "FK -> BrokerAgent.id; set from X-User-ID of the creating BrokerAgent" }
      - { name: title, type: string, source: input, description: "Listing marketing title" }
      - { name: county, type: string, source: input, description: "County name" }
      - { name: state_code, type: string, source: input, description: "Two-letter state code; comparable selection matches on this" }
      - { name: total_gross_acres, type: number, source: input, description: "Total deeded acres; tract acreage must reconcile to this exactly at packaging" }
      - { name: packaging_strategy, type: enum, source: input, description: "WHOLE | SPLIT | COMBINATION; immutable once listing leaves DRAFT" }
      - { name: reserve_price_total, type: number, source: input, description: "Seller reserve (minimum acceptable award total) for the whole listing" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | PACKAGED | MARKETED | AUCTION_SCHEDULED | UNDER_CONTRACT | CLOSED | WITHDRAWN" }

  - name: Tract
    parent: null
    common_fields: true
    fields:
      - { name: listing_id, type: string, source: input, description: "FK -> Listing.id; parent listing" }
      - { name: tract_number, type: integer, source: input, description: "Tract number within listing; unique per listing; allocation residual goes to highest tract_number" }
      - { name: gross_acres, type: number, source: input, description: "Gross acres of this tract; > 0" }
      - { name: tillable_acres, type: number, source: input, description: "Tillable acres; 0 <= tillable_acres <= gross_acres" }
      - { name: soil_productivity_index, type: number, source: input, description: "Soil productivity index (CSR-style), 0 < SPI <= 100" }
      - { name: min_price, type: number, source: input, description: "Per-tract minimum acceptable bid contribution; >= 0" }
      - { name: status, type: enum, source: system, default: REGISTERED, description: "REGISTERED | OFFERED | SOLD | UNSOLD | WITHDRAWN" }

  - name: ComparableSale
    parent: null
    common_fields: false
    fields:
      - { name: county, type: string, source: input, description: "County of the comparable sale" }
      - { name: state_code, type: string, source: input, description: "Two-letter state code of the comparable" }
      - { name: sale_date, type: datetime, source: input, description: "Comparable closing date; eligibility window is [clock-24 months, clock] inclusive" }
      - { name: sale_price_total, type: number, source: input, description: "Total sale price of the comparable" }
      - { name: gross_acres, type: number, source: input, description: "Gross acres of the comparable; > 0" }
      - { name: tillable_acres, type: number, source: input, description: "Tillable acres of the comparable" }
      - { name: soil_productivity_index, type: number, source: input, description: "SPI of the comparable; > 0" }

  - name: AuctionEvent
    parent: null
    common_fields: true
    fields:
      - { name: listing_id, type: string, source: input, description: "FK -> Listing.id; listing being auctioned" }
      - { name: agent_id, type: string, source: system, description: "Denormalized copy of Listing.agent_id at creation; used for auctioneer schedule-conflict checks" }
      - { name: method, type: enum, source: input, description: "LIVE | ONLINE | SEALED_BID" }
      - { name: scheduled_start, type: datetime, source: input, description: "Window start; must be >= clock + 24h at creation" }
      - { name: scheduled_end, type: datetime, source: input, description: "Window end; must be > start and duration >= 60 minutes" }
      - { name: soft_close_window_minutes, type: integer, source: input, default: 5, description: "ONLINE only: a bid placed within this many minutes before effective_end extends the auction" }
      - { name: extension_minutes, type: integer, source: input, default: 5, description: "ONLINE only: minutes added to effective_end per soft-close extension" }
      - { name: effective_end, type: datetime, source: computed, description: "scheduled_end plus extensions; bids accepted while clock < effective_end" }
      - { name: extension_count, type: integer, source: computed, default: 0, description: "Number of soft-close extensions applied" }
      - { name: awarded_total, type: number, source: system, description: "Sum of winning bid amounts, set at award; null before" }
      - { name: status, type: enum, source: system, default: SCHEDULED, description: "SCHEDULED | OPEN | EXTENDED | CLOSED_PENDING_AWARD | AWARDED | NO_SALE | CANCELLED" }

  - name: Bid
    parent: null
    common_fields: true
    fields:
      - { name: auction_id, type: string, source: input, description: "FK -> AuctionEvent.id; auction the bid is placed in" }
      - { name: buyer_id, type: string, source: system, description: "FK -> Buyer.id; set from X-User-ID of the placing Buyer" }
      - { name: amount, type: number, source: input, description: "Bid amount in USD; > 0 and <= buyer.proof_of_funds_amount" }
      - { name: tract_ids, type: array, source: input, description: "Array of Tract ids forming the bid scope; length-1 is an individual tract bid, longer is a combination bid (COMBINATION listings only)" }
      - { name: status, type: enum, source: system, default: PLACED, description: "PLACED | SEALED | REVEALED | OUTBID | LOST | CONFIRMED_WINNER | VOIDED" }

  - name: EarnestMoneyDeposit
    parent: null
    common_fields: true
    fields:
      - { name: bid_id, type: string, source: system, description: "FK -> Bid.id; the winning bid this deposit secures" }
      - { name: buyer_id, type: string, source: system, description: "Denormalized copy of Bid.buyer_id for escrow reporting" }
      - { name: amount_due, type: number, source: computed, description: "max(10000, round(0.03 * winning bid amount, 2))" }
      - { name: amount_received, type: number, source: computed, default: 0, description: "Cumulative escrowed amount from record-payment calls" }
      - { name: due_at, type: datetime, source: computed, description: "award timestamp + 48 hours; on-time payments require clock <= due_at" }
      - { name: amount_refunded, type: number, source: computed, default: 0, description: "Amount returned on closing termination" }
      - { name: amount_forfeited, type: number, source: computed, default: 0, description: "Amount seized on deadline forfeiture" }
      - { name: amount_applied, type: number, source: computed, default: 0, description: "Amount credited to buyer at disbursement" }
      - { name: status, type: enum, source: system, default: PENDING, description: "PENDING | RECEIVED | LATE | VERIFIED | FORFEITED | REFUNDED | APPLIED_TO_CLOSING" }

  - name: LeaseDisclosure
    parent: null
    common_fields: true
    fields:
      - { name: tract_id, type: string, source: input, description: "FK -> Tract.id; tract with a tenant lease" }
      - { name: tenant_name, type: string, source: input, description: "Tenant farmer name" }
      - { name: lease_start_date, type: datetime, source: input, description: "Lease term start" }
      - { name: lease_end_date, type: datetime, source: input, description: "Lease term end; possession may transfer no earlier than lease_end_date + 1 day" }
      - { name: annual_rent, type: number, source: input, description: "Annual cash rent; used for possession rent credit; > 0" }
      - { name: acknowledged_by_buyer_id, type: string, source: system, description: "Set to the acknowledging winning buyer's id; null until acknowledged" }
      - { name: status, type: enum, source: system, default: DISCLOSED, description: "DISCLOSED | ACKNOWLEDGED | POSSESSION_TRANSFERRED" }

  - name: RightsDisposition
    parent: null
    common_fields: true
    fields:
      - { name: tract_id, type: string, source: input, description: "FK -> Tract.id; tract whose subsurface rights are declared" }
      - { name: mineral_rights, type: enum, source: input, description: "CONVEYED | RESERVED | PARTIALLY_CONVEYED" }
      - { name: wind_rights, type: enum, source: input, description: "CONVEYED | RESERVED | LEASED_TO_THIRD_PARTY" }
      - { name: status, type: enum, source: system, default: DECLARED, description: "DECLARED | LOCKED; LOCKED while any listing auction is OPEN/EXTENDED/AWARDED" }

  - name: ClosingPackage
    parent: null
    common_fields: true
    fields:
      - { name: auction_id, type: string, source: input, description: "FK -> AuctionEvent.id; the awarded auction being closed" }
      - { name: target_closing_date, type: datetime, source: input, description: "Scheduled closing date; must be strictly after the logical clock" }
      - { name: payoff_amount, type: number, source: input, description: "Seller mortgage/lien payoff deducted on the net sheet; >= 0" }
      - { name: title_status, type: enum, source: system, default: NOT_ORDERED, description: "Parallel axis: NOT_ORDERED | ORDERED | COMMITMENT_RECEIVED | EXCEPTION_RAISED | CLEARED" }
      - { name: survey_status, type: enum, source: system, default: NOT_ORDERED, description: "Parallel axis: NOT_ORDERED | ORDERED | COMPLETED | WAIVED" }
      - { name: funding_status, type: enum, source: system, default: UNFUNDED, description: "Parallel axis: UNFUNDED | FUNDS_RECEIVED | DISBURSED" }
      - { name: overall_status, type: enum, source: computed, default: INITIATED, description: "INITIATED | COORDINATION | READY_TO_CLOSE | CLOSED | TERMINATED; derived from the three axes" }

  - name: SettlementStatement
    parent: null
    common_fields: true
    fields:
      - { name: closing_id, type: string, source: input, description: "FK -> ClosingPackage.id; closing this net sheet belongs to" }
      - { name: variant, type: enum, source: input, description: "PROVISIONAL | FINAL" }
      - { name: gross_price, type: number, source: computed, description: "Auction awarded_total for this closing" }
      - { name: commission_amount, type: number, source: computed, description: "Tiered commission incl. over-appraisal kicker per commission_calc" }
      - { name: allocated_seller_costs, type: number, source: computed, description: "Seller share of closing costs; estimated flat 0.5% of gross for PROVISIONAL, actual per-tract allocation total for FINAL" }
      - { name: tract_allocations, type: array, source: computed, description: "FINAL only: list of {tract_id, share} per-tract cost allocations from closing_cost_allocation (per-tract round half-up, residual to highest tract_number); null for PROVISIONAL" }
      - { name: payoff_amount, type: number, source: computed, description: "Copied from ClosingPackage.payoff_amount at computation time" }
      - { name: rent_credit, type: number, source: computed, description: "Possession rent credit owed to buyer; 0 for PROVISIONAL, computed for FINAL" }
      - { name: seller_net, type: number, source: computed, description: "gross - commission - allocated_seller_costs - payoff_amount - rent_credit" }
      - { name: status, type: enum, source: system, default: PROVISIONAL, description: "PROVISIONAL | SUPERSEDED | FINAL | PAID" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: Listing
    initial_state: DRAFT
    terminal_states: [CLOSED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: PACKAGED
        trigger: POST /api/listings/{id}/package
        actor: BrokerAgent
        preconditions:
          - "Caller is the listing's agent (listing.agent_id == X-User-ID), else ERR_FORBIDDEN"
          - "At least one tract exists (ERR_ACREAGE_MISMATCH)"
          - "Sum of tracts' gross_acres == total_gross_acres exactly (ERR_ACREAGE_MISMATCH)"
          - "reserve_price_total >= 0.85 * sum of PROVISIONAL spi_adjusted_valuation over all tracts (ERR_RESERVE_BELOW_FLOOR; ERR_NO_COMPARABLES if any tract has an empty comparable set)"
        side_effects:
          - "packaging_strategy becomes immutable"
          - "Listing.version += 1"
      - from: PACKAGED
        to: MARKETED
        trigger: POST /api/listings/{id}/market
        actor: BrokerAgent
        preconditions:
          - "Caller is the listing's agent, else ERR_FORBIDDEN"
          - "Every tract has at least one RightsDisposition with status DECLARED (ERR_RIGHTS_NOT_DECLARED)"
        side_effects:
          - "Every tract: REGISTERED -> OFFERED"
          - "Listing.version += 1"
      - from: MARKETED
        to: AUCTION_SCHEDULED
        trigger: POST /api/auctions (first auction for the listing)
        actor: BrokerAgent
        preconditions:
          - "See AuctionEvent SCHEDULED creation preconditions"
        side_effects:
          - "Listing.version += 1"
      - from: AUCTION_SCHEDULED
        to: MARKETED
        trigger: "system (auction NO_SALE: no-sale endpoint or zero-bid auto-close) when no other auction of this listing is in SCHEDULED/OPEN/EXTENDED/CLOSED_PENDING_AWARD"
        actor: system
        preconditions: []
        side_effects:
          - "Tracts UNSOLD -> OFFERED on next auction open"
          - "Listing.version += 1"
      - from: AUCTION_SCHEDULED
        to: UNDER_CONTRACT
        trigger: "system (auction award) when every tract of the listing is SOLD"
        actor: system
        preconditions:
          - "All tracts of the listing have status SOLD after applying the award"
        side_effects:
          - "Listing.version += 1"
      - from: UNDER_CONTRACT
        to: CLOSED
        trigger: "system (closing disbursement) via ClosingPackage funding DISBURSE"
        actor: system
        preconditions:
          - "ClosingPackage.overall_status becomes CLOSED"
        side_effects:
          - "Listing.version += 1"
      - from: UNDER_CONTRACT
        to: MARKETED
        trigger: "system (earnest-money forfeiture cascade or closing termination)"
        actor: system
        preconditions: []
        side_effects:
          - "All tracts SOLD -> OFFERED"
          - "Listing.version += 1"
      - from: DRAFT
        to: WITHDRAWN
        trigger: POST /api/listings/{id}/withdraw
        actor: Seller | BrokerAgent
        preconditions:
          - "Caller is the listing's seller (seller_id == X-User-ID) or its agent, else ERR_FORBIDDEN"
        side_effects:
          - "Cascade: see withdraw chain under AuctionEvent/Bid/EarnestMoneyDeposit"
      - from: PACKAGED
        to: WITHDRAWN
        trigger: POST /api/listings/{id}/withdraw
        actor: Seller | BrokerAgent
        preconditions: ["Same ownership precondition"]
        side_effects: ["Same cascade"]
      - from: MARKETED
        to: WITHDRAWN
        trigger: POST /api/listings/{id}/withdraw
        actor: Seller | BrokerAgent
        preconditions: ["Same ownership precondition"]
        side_effects: ["Same cascade"]
      - from: AUCTION_SCHEDULED
        to: WITHDRAWN
        trigger: POST /api/listings/{id}/withdraw
        actor: Seller | BrokerAgent
        preconditions: ["Same ownership precondition"]
        side_effects: ["Same cascade"]
    note: "Withdraw is NOT permitted from UNDER_CONTRACT or CLOSED — POST /api/listings/{id}/withdraw in those states is rejected ERR_INVALID_LISTING_STATE (no transition row exists for them by design). UNDER_CONTRACT -> MARKETED above covers both the forfeiture cascade and closing termination."

  - entity: Tract
    initial_state: REGISTERED
    terminal_states: [SOLD, WITHDRAWN]
    transitions:
      - from: REGISTERED
        to: OFFERED
        trigger: "system (listing MARKETED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: OFFERED
        to: SOLD
        trigger: "system (auction award covers this tract)"
        actor: system
        preconditions: []
        side_effects:
          - "If all sibling tracts SOLD: Listing AUCTION_SCHEDULED -> UNDER_CONTRACT"
      - from: OFFERED
        to: UNSOLD
        trigger: "system (auction awarded without this tract in any winning scope, SPLIT/COMBINATION strategies)"
        actor: system
        preconditions: []
        side_effects: []
      - from: UNSOLD
        to: OFFERED
        trigger: "system (a new auction of the same listing transitions SCHEDULED -> OPEN)"
        actor: system
        preconditions: []
        side_effects: []
      - from: SOLD
        to: OFFERED
        trigger: "system (earnest-money forfeiture cascade or closing termination)"
        actor: system
        preconditions: []
        side_effects: []
      - from: REGISTERED
        to: WITHDRAWN
        trigger: "system (listing withdrawal cascade)"
        actor: system
        preconditions: []
        side_effects: []
      - from: OFFERED
        to: WITHDRAWN
        trigger: "system (listing withdrawal cascade)"
        actor: system
        preconditions: []
        side_effects: []
      - from: UNSOLD
        to: WITHDRAWN
        trigger: "system (listing withdrawal cascade)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: AuctionEvent
    initial_state: SCHEDULED
    terminal_states: [AWARDED, NO_SALE, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: OPEN
        trigger: POST /api/auctions/{id}/open
        actor: BrokerAgent
        preconditions:
          - "Caller is the listing's agent, else ERR_FORBIDDEN"
          - "scheduled_start <= logical clock < scheduled_end (ERR_AUCTION_WINDOW_INVALID)"
        side_effects:
          - "RightsDisposition of every tract of the listing: DECLARED -> LOCKED"
          - "Tracts UNSOLD -> OFFERED (re-offer after partial award)"
          - "AuctionEvent.version += 1"
      - from: OPEN
        to: EXTENDED
        trigger: "system (ONLINE bid accepted while clock in [effective_end - soft_close_window_minutes, effective_end))"
        actor: system
        preconditions:
          - "method == ONLINE"
        side_effects:
          - "effective_end += extension_minutes"
          - "extension_count += 1"
      - from: EXTENDED
        to: EXTENDED
        trigger: "system (further ONLINE bid accepted within the current soft-close window)"
        actor: system
        preconditions:
          - "method == ONLINE"
        side_effects:
          - "effective_end += extension_minutes"
          - "extension_count += 1"
      - from: OPEN
        to: CLOSED_PENDING_AWARD
        trigger: "system (logical clock reaches effective_end, via POST /api/_clock/set_current_utc sweep) with at least one bid in PLACED or SEALED"
        actor: system
        preconditions: []
        side_effects:
          - "If method == SEALED_BID: every SEALED bid -> REVEALED (amounts become visible)"
      - from: EXTENDED
        to: CLOSED_PENDING_AWARD
        trigger: "system (logical clock reaches effective_end) with at least one bid in PLACED or SEALED"
        actor: system
        preconditions: []
        side_effects:
          - "If method == SEALED_BID: every SEALED bid -> REVEALED"
      - from: OPEN
        to: NO_SALE
        trigger: "system (logical clock reaches effective_end) with zero bids in PLACED or SEALED"
        actor: system
        preconditions: []
        side_effects:
          - "Listing AUCTION_SCHEDULED -> MARKETED when no other active auction remains"
      - from: EXTENDED
        to: NO_SALE
        trigger: "system (logical clock reaches effective_end) with zero bids"
        actor: system
        preconditions: []
        side_effects:
          - "Listing AUCTION_SCHEDULED -> MARKETED when no other active auction remains"
      - from: CLOSED_PENDING_AWARD
        to: AWARDED
        trigger: POST /api/auctions/{id}/award
        actor: BrokerAgent
        preconditions:
          - "Caller is the listing's agent, else ERR_FORBIDDEN"
          - "winning_bid_selection yields at least one winner (else ERR_INVALID_AUCTION_STATE)"
          - "Sum of winning amounts >= listing.reserve_price_total (ERR_RESERVE_NOT_MET)"
        side_effects:
          - "Winning bids -> CONFIRMED_WINNER; all other PLACED/REVEALED bids -> LOST"
          - "awarded_total := sum of winning amounts"
          - "Tracts in winning scopes -> SOLD; other OFFERED tracts -> UNSOLD"
          - "Listing -> UNDER_CONTRACT iff all tracts SOLD"
          - "For each winning bid: create EarnestMoneyDeposit PENDING with amount_due per earnest_money_requirement, due_at = now + 48h"
          - "AuctionEvent.version += 1"
      - from: CLOSED_PENDING_AWARD
        to: NO_SALE
        trigger: POST /api/auctions/{id}/no-sale
        actor: BrokerAgent
        preconditions:
          - "Caller is the listing's agent, else ERR_FORBIDDEN"
        side_effects:
          - "All PLACED/REVEALED bids -> VOIDED"
          - "Listing AUCTION_SCHEDULED -> MARKETED when no other active auction remains"
          - "RightsDisposition LOCKED -> DECLARED (rights unlock when no active auction remains)"
      - from: AWARDED
        to: NO_SALE
        trigger: "system (earnest-money forfeiture cascade) or POST /api/closings/{id}/terminate"
        actor: system
        preconditions: []
        side_effects:
          - "Winning bid CONFIRMED_WINNER -> VOIDED"
          - "Listing UNDER_CONTRACT -> MARKETED; tracts SOLD -> OFFERED"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "system (listing withdrawal cascade)"
        actor: system
        preconditions: []
        side_effects:
          - "All PLACED/SEALED bids -> VOIDED; LOCKED rights -> DECLARED"
      - from: OPEN
        to: CANCELLED
        trigger: "system (listing withdrawal cascade)"
        actor: system
        preconditions: []
        side_effects:
          - "All PLACED/SEALED bids -> VOIDED; LOCKED rights -> DECLARED"
      - from: EXTENDED
        to: CANCELLED
        trigger: "system (listing withdrawal cascade)"
        actor: system
        preconditions: []
        side_effects:
          - "All PLACED/SEALED bids -> VOIDED; LOCKED rights -> DECLARED"

  - entity: Bid
    initial_state: PLACED
    terminal_states: [OUTBID, LOST, CONFIRMED_WINNER, VOIDED]
    transitions:
      - from: PLACED
        to: OUTBID
        trigger: "system (a later ONLINE/LIVE bid with identical single-tract scope and higher amount is accepted)"
        actor: system
        preconditions: []
        side_effects: []
      - from: PLACED
        to: CONFIRMED_WINNER
        trigger: "system (auction award selects this bid)"
        actor: system
        preconditions: []
        side_effects:
          - "Create EarnestMoneyDeposit PENDING for this bid"
      - from: REVEALED
        to: CONFIRMED_WINNER
        trigger: "system (sealed auction award selects this bid)"
        actor: system
        preconditions: []
        side_effects:
          - "Create EarnestMoneyDeposit PENDING for this bid"
      - from: PLACED
        to: LOST
        trigger: "system (auction award selects other bids)"
        actor: system
        preconditions: []
        side_effects: []
      - from: REVEALED
        to: LOST
        trigger: "system (sealed award selects other bids)"
        actor: system
        preconditions: []
        side_effects: []
      - from: PLACED
        to: VOIDED
        trigger: "system (no-sale, listing withdrawal cascade, or closing termination)"
        actor: system
        preconditions: []
        side_effects: []
      - from: SEALED
        to: VOIDED
        trigger: "system (no-sale or listing withdrawal cascade)"
        actor: system
        preconditions: []
        side_effects: []
      - from: REVEALED
        to: VOIDED
        trigger: "system (no-sale)"
        actor: system
        preconditions: []
        side_effects: []
      - from: CONFIRMED_WINNER
        to: VOIDED
        trigger: "system (earnest-money forfeiture cascade or closing termination)"
        actor: system
        preconditions: []
        side_effects:
          - "Auction AWARDED -> NO_SALE (cascade hop)"
      - from: SEALED
        to: REVEALED
        trigger: "system (sealed auction close sweep)"
        actor: system
        preconditions: []
        side_effects: []
    note: "SEALED is the initial state for bids on SEALED_BID auctions; PLACED for LIVE/ONLINE. Bid amounts on SEALED bids are hidden from GET /api/bids and GET /api/bids/{id} (returned as null) until REVEALED."

  - entity: Buyer
    initial_state: UNVERIFIED
    terminal_states: [DISQUALIFIED]
    transitions:
      - from: UNVERIFIED
        to: QUALIFIED
        trigger: POST /api/buyers/{id}/qualify
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "qualification_expires_at := input value"
      - from: EXPIRED
        to: QUALIFIED
        trigger: POST /api/buyers/{id}/qualify
        actor: PlatformAdmin
        preconditions:
          - "New qualification_expires_at must be strictly after the logical clock (ERR_VALIDATION)"
        side_effects:
          - "Re-qualification cycle: EXPIRED buyers may be qualified again; DISQUALIFIED buyers may not"
      - from: QUALIFIED
        to: EXPIRED
        trigger: "system (clock sweep: logical clock >= qualification_expires_at)"
        actor: system
        preconditions: []
        side_effects: []
      - from: QUALIFIED
        to: DISQUALIFIED
        trigger: "system (earnest-money forfeiture cascade: this buyer's deposit FORFEITED)"
        actor: system
        preconditions: []
        side_effects:
          - "This buyer's CONFIRMED_WINNER bid -> VOIDED (next cascade hop)"
      - from: EXPIRED
        to: DISQUALIFIED
        trigger: "system (earnest-money forfeiture cascade fires while qualification lapsed)"
        actor: system
        preconditions: []
        side_effects:
          - "Same bid-voiding cascade"

  - entity: EarnestMoneyDeposit
    initial_state: PENDING
    terminal_states: [FORFEITED, REFUNDED, APPLIED_TO_CLOSING]
    transitions:
      - from: PENDING
        to: RECEIVED
        trigger: POST /api/deposits/{id}/record-payment
        actor: BrokerAgent
        preconditions:
          - "Caller is the agent of the listing behind the deposit's bid, else ERR_FORBIDDEN"
          - "Cumulative amount_received >= amount_due after applying the payment"
          - "Logical clock <= due_at (on-time)"
        side_effects:
          - "amount_received += payment amount"
      - from: PENDING
        to: LATE
        trigger: "system (clock sweep: clock > due_at while amount_received < amount_due) or POST /api/deposits/{id}/record-payment completing the amount after due_at"
        actor: system
        preconditions: []
        side_effects: []
      - from: PENDING
        to: FORFEITED
        trigger: "system (clock sweep: clock > due_at + 24h grace while status still PENDING)"
        actor: system
        preconditions: []
        side_effects:
          - "amount_forfeited := amount_received"
          - "Cascade: buyer -> DISQUALIFIED; winning bid -> VOIDED; auction AWARDED -> NO_SALE; listing UNDER_CONTRACT -> MARKETED; tracts SOLD -> OFFERED"
      - from: LATE
        to: FORFEITED
        trigger: "system (clock sweep: clock > due_at + 24h grace while status LATE)"
        actor: system
        preconditions: []
        side_effects:
          - "amount_forfeited := amount_received"
          - "Same forfeiture cascade as PENDING -> FORFEITED"
      - from: RECEIVED
        to: VERIFIED
        trigger: POST /api/deposits/{id}/verify
        actor: PlatformAdmin
        preconditions:
          - "Segregation of duties: verify is PlatformAdmin-only; the BrokerAgent who recorded payments cannot verify"
        side_effects: []
      - from: LATE
        to: VERIFIED
        trigger: POST /api/deposits/{id}/verify
        actor: PlatformAdmin
        preconditions:
          - "Seller-side acceptance of late funds is modeled by admin verification from LATE"
        side_effects: []
      - from: VERIFIED
        to: APPLIED_TO_CLOSING
        trigger: "system (closing disbursement)"
        actor: system
        preconditions: []
        side_effects:
          - "amount_applied := amount_received"
      - from: VERIFIED
        to: REFUNDED
        trigger: "system (closing termination via POST /api/closings/{id}/terminate)"
        actor: system
        preconditions: []
        side_effects:
          - "amount_refunded := amount_received"
    note: "Only VERIFIED deposits can underlie a closing, so the refund path is VERIFIED -> REFUNDED; RECEIVED/LATE deposits never refund (they forfeit past the grace deadline instead)."

  - entity: LeaseDisclosure
    initial_state: DISCLOSED
    terminal_states: [POSSESSION_TRANSFERRED]
    transitions:
      - from: DISCLOSED
        to: ACKNOWLEDGED
        trigger: POST /api/disclosures/{id}/acknowledge
        actor: Buyer
        preconditions:
          - "Caller must be the buyer of a CONFIRMED_WINNER bid whose scope contains this disclosure's tract (else ERR_FORBIDDEN)"
        side_effects:
          - "acknowledged_by_buyer_id := caller"
      - from: ACKNOWLEDGED
        to: DISCLOSED
        trigger: "system (forfeiture cascade: acknowledging buyer's winning bid VOIDED)"
        actor: system
        preconditions: []
        side_effects:
          - "acknowledged_by_buyer_id := null"
      - from: ACKNOWLEDGED
        to: POSSESSION_TRANSFERRED
        trigger: "system (closing disbursement completes)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: RightsDisposition
    initial_state: DECLARED
    terminal_states: []
    transitions:
      - from: DECLARED
        to: LOCKED
        trigger: "system (first auction of the listing transitions SCHEDULED -> OPEN)"
        actor: system
        preconditions: []
        side_effects: []
      - from: LOCKED
        to: DECLARED
        trigger: "system (auction NO_SALE or CANCELLED with no remaining active auction for the listing)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: ClosingPackage
    initial_state: INITIATED
    terminal_states: [CLOSED, TERMINATED]
    transitions:
      - from: INITIATED
        to: COORDINATION
        trigger: "system (any axis leaves its initial value)"
        actor: system
        preconditions: []
        side_effects: []
      - from: COORDINATION
        to: READY_TO_CLOSE
        trigger: "system (title_status == CLEARED and survey_status in {COMPLETED, WAIVED})"
        actor: system
        preconditions: []
        side_effects: []
      - from: READY_TO_CLOSE
        to: CLOSED
        trigger: "system (funding_status becomes DISBURSED)"
        actor: system
        preconditions:
          - "A SettlementStatement with variant FINAL exists for this closing (ERR_INVALID_CLOSING_STATE otherwise, enforced at disburse)"
        side_effects:
          - "Listing UNDER_CONTRACT -> CLOSED"
          - "EarnestMoneyDeposit VERIFIED -> APPLIED_TO_CLOSING (amount_applied := amount_received)"
          - "SettlementStatement FINAL -> PAID"
          - "LeaseDisclosure ACKNOWLEDGED -> POSSESSION_TRANSFERRED for in-scope tracts"
      - from: INITIATED
        to: TERMINATED
        trigger: POST /api/closings/{id}/terminate
        actor: BrokerAgent
        preconditions: ["Caller is the listing's agent"]
        side_effects:
          - "EarnestMoneyDeposit VERIFIED -> REFUNDED (amount_refunded := amount_received)"
          - "Winning bid CONFIRMED_WINNER -> VOIDED; auction AWARDED -> NO_SALE; listing UNDER_CONTRACT -> MARKETED; tracts SOLD -> OFFERED"
          - "FINAL/PROVISIONAL statements -> SUPERSEDED"
      - from: COORDINATION
        to: TERMINATED
        trigger: POST /api/closings/{id}/terminate
        actor: BrokerAgent
        preconditions: ["Caller is the listing's agent"]
        side_effects: ["Same termination cascade"]
      - from: READY_TO_CLOSE
        to: TERMINATED
        trigger: POST /api/closings/{id}/terminate
        actor: BrokerAgent
        preconditions: ["Caller is the listing's agent"]
        side_effects: ["Same termination cascade"]
    note: "Parallel axes evolve independently via POST /api/closings/{id}/track-events. title: NOT_ORDERED -> ORDERED -> COMMITMENT_RECEIVED -> CLEARED, with EXCEPTION_RAISED reachable from ORDERED or COMMITMENT_RECEIVED and CURE returning EXCEPTION_RAISED -> COMMITMENT_RECEIVED. survey: NOT_ORDERED -> ORDERED -> COMPLETED, or NOT_ORDERED -> WAIVED (requires seller_consent: true). funding: UNFUNDED -> FUNDS_RECEIVED -> DISBURSED (PlatformAdmin only)."

  - entity: SettlementStatement
    initial_state: PROVISIONAL
    terminal_states: [SUPERSEDED, PAID]
    transitions:
      - from: PROVISIONAL
        to: SUPERSEDED
        trigger: "system (another PROVISIONAL statement is created for the same closing)"
        actor: system
        preconditions: []
        side_effects: []
      - from: PROVISIONAL
        to: SUPERSEDED
        trigger: "system (a FINAL statement is created for the same closing, or closing terminates)"
        actor: system
        preconditions: []
        side_effects: []
      - from: FINAL
        to: PAID
        trigger: "system (closing disbursement completes)"
        actor: system
        preconditions: []
        side_effects: []
      - from: FINAL
        to: SUPERSEDED
        trigger: "system (closing terminates)"
        actor: system
        preconditions: []
        side_effects: []
    note: "A statement is created directly in PROVISIONAL (variant input) or FINAL (variant input, requires closing READY_TO_CLOSE). status tracks the provisional/final lifecycle; variant is the immutable input."

# =============================================================================
# 1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: bid-place-stale-auction
    parent_entity: AuctionEvent
    write_endpoint: "POST /api/bids"
    occ_field: expected_auction_version
    description: |
      Placing a bid against an AuctionEvent whose version has advanced since the
      bidder last read it is rejected. Every accepted bid bumps
      AuctionEvent.version, so a bidder holding version N who submits
      expected_auction_version N after another accepted bid moved the auction to
      N+1 is acting on a stale view of the current high bid and is rejected.
    error_id: ERR_STALE_AUCTION_VERSION
    http_status: 412
  - rule_id: tract-add-stale-listing
    parent_entity: Listing
    write_endpoint: "POST /api/tracts"
    occ_field: expected_listing_version
    description: |
      Adding a tract to a Listing whose version has advanced since the caller
      last read it is rejected, because acreage reconciliation and packaging
      decisions depend on the current tract set. Every tract creation (and every
      other listing mutation) bumps Listing.version, so a stale
      expected_listing_version is detected deterministically.
    error_id: ERR_STALE_LISTING_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: spi_adjusted_valuation
    trigger: "GET /api/tracts/{id}/valuation (on read, per requested variant); also run implicitly per tract at POST /api/listings/{id}/package for the reserve floor check (PROVISIONAL variant)"
    algorithm: weighted_scoring
    formula: |
      comps = ComparableSale where state_code == tract.listing.state_code
              AND sale_date IN [logical_clock - 24 months, logical_clock]  (both ends inclusive)
      if comps is empty: raise ERR_NO_COMPARABLES
      per comp i:
        base_i = (sale_price_total_i / gross_acres_i) * (tract.soil_productivity_index / spi_i)
      PROVISIONAL:
        value_per_acre = mean(base_i over all comps)          (no per-comp rounding)
        estimated_value = round_half_up(value_per_acre * tract.gross_acres, 0)   # whole dollars
      APPRAISAL:
        tillable_factor = 0.85 + 0.30 * (tract.tillable_acres / tract.gross_acres)
        recency_i = 1.0 if sale_date_i >= logical_clock - 12 months else 0.97
        adj_i = base_i * tillable_factor * recency_i          (no per-comp rounding)
        value_per_acre = mean(adj_i)
        estimated_value = round_half_up(value_per_acre * tract.gross_acres, 0)
    input_set: "ComparableSale rows matching the tract listing's state_code with sale_date inside the inclusive 24-month trailing window; all such rows, unweighted mean"
    constants:
      COMP_WINDOW_MONTHS: 24
      RECENCY_WINDOW_MONTHS: 12
      RECENCY_DISCOUNT: 0.97
      TILLABLE_BASE: 0.85
      TILLABLE_SLOPE: 0.30
    precision: "estimated_value: 0 decimal places, round_half_up; value_per_acre reported at 2 decimal places, round_half_up"
    variants:
      - name: PROVISIONAL
        when: "variant=PROVISIONAL on the valuation read; reserve-floor check at packaging"
        difference: "No tillable or recency adjustment: mean of SPI-ratio-adjusted per-acre prices only"
      - name: APPRAISAL
        when: "variant=APPRAISAL"
        difference: "Applies tillable_factor (tract tillable ratio) and per-comp recency discount; produces a different value from PROVISIONAL for identical comparable data"

  - name: bid_increment_schedule
    trigger: "POST /api/bids for LIVE/ONLINE auctions with an existing current high bid of identical scope"
    algorithm: threshold
    formula: |
      increment(h) = 1000  if h < 100000
                     2500  if 100000 <= h < 500000
                     5000  if 500000 <= h < 1000000
                     10000 if h >= 1000000
      For a bid with scope S where |S| == 1 (or S == all tracts of a WHOLE listing):
        current_high = max amount among PLACED bids whose tract_ids set equals S (0 if none)
        if current_high > 0: require amount >= current_high + increment(current_high)   # exact boundary ACCEPTED (>=)
        else: require amount >= sum of min_price over S
      For a combination bid (|S| > 1, COMBINATION listings only): see winning_bid_selection
        require amount >= max( round_half_up(1.05 * sum(current_high_t over t in S), 2),
                               sum(min_price_t over t in S) )
      SEALED_BID auctions: no increment check; require amount >= sum(min_price over S) and
        at most one bid per buyer per auction (ERR_DUPLICATE_RECORD)
    input_set: "PLACED bids of the same auction; per-tract highs consider only bids whose tract_ids == [t] exactly"
    constants:
      TIER1_MAX: 100000
      TIER2_MAX: 500000
      TIER3_MAX: 1000000
      INC1: 1000
      INC2: 2500
      INC3: 5000
      INC4: 10000
      COMBO_PREMIUM_PCT: 0.05
    precision: "2 decimal places, round_half_up where rounding applies (combo threshold)"

  - name: winning_bid_selection
    trigger: "POST /api/auctions/{id}/award"
    algorithm: constraint_propagation
    formula: |
      eligible = bids of the auction in PLACED (LIVE/ONLINE) or REVEALED (SEALED_BID)
      if eligible is empty: award fails ERR_INVALID_AUCTION_STATE
      ind_high[t] = (bid, amount) of the max-amount eligible bid with tract_ids == [t];
                    tie -> earliest created_at ASC
      combos = eligible bids with len(tract_ids) > 1,
               sorted by amount DESC, tie -> created_at ASC
      assigned = {}
      for combo in combos (in the order above):
        if every tract in combo.tract_ids is OFFERED and unassigned:
          threshold = round_half_up(1.05 * sum(ind_high[t].amount default 0), 2)
          if combo.amount >= max(threshold, sum(min_price_t)):
            combo wins all its tracts; mark assigned
      remaining OFFERED tracts with an ind_high bid: that bid wins the tract
      awarded_total = sum of winning bids' amounts
      require awarded_total >= listing.reserve_price_total else ERR_RESERVE_NOT_MET
      winners -> CONFIRMED_WINNER; all other eligible bids -> LOST
    input_set: "All bids of the auction in PLACED or REVEALED status; tracts of the listing in OFFERED status"
    precision: "2 decimal places, round_half_up for the combination premium threshold"
    note: "Selector determinism: eligibility = status filter above; ranking = amount DESC; tie-break = created_at ASC; empty pool fallback = ERR_INVALID_AUCTION_STATE. Entity id is never used for ranking or tie-break."

  - name: earnest_money_requirement
    trigger: "system at auction award, once per winning bid"
    algorithm: threshold
    formula: |
      amount_due = max(EMD_FLOOR, round_half_up(EMD_PCT * winning_bid.amount, 2))
      due_at = award_timestamp + 48 hours (exact)
      on-time payment requires logical clock <= due_at
      forfeiture sweep fires when clock > due_at + 24h grace and status in {PENDING, LATE}
    input_set: "The winning Bid"
    constants:
      EMD_PCT: 0.03
      EMD_FLOOR: 10000
      EMD_DUE_HOURS: 48
      EMD_FORFEIT_GRACE_HOURS: 24
    precision: "2 decimal places, round_half_up"

  - name: commission_calc
    trigger: "POST /api/statements (both PROVISIONAL and FINAL variants)"
    algorithm: tiered_pricing
    formula: |
      g = gross_price (auction awarded_total)
      marginal tiers on g:
        6.0% of first 250000
        4.5% of (g - 250000) within (250000, 750000]
        3.0% of (g - 750000) within (750000, 2000000]
        1.5% of (g - 2000000) above 2000000
      base = sum of tier amounts
      appraisal_total = sum of APPRAISAL spi_adjusted_valuation over tracts in the winning scope
      kicker = 0.005 * g  if g >= 1.10 * appraisal_total  else 0     # exact boundary INCLUDED (>=)
      commission = max(COMMISSION_FLOOR, base + kicker)
      evaluation order is fixed: tiers first, then kicker (depends on g and appraisal only,
      never on net), then floor
    input_set: "Winning scope tracts of the closing's auction; their APPRAISAL valuations at statement creation"
    constants:
      COMMISSION_FLOOR: 7500
      KICKER_THRESHOLD: 1.10
      KICKER_PCT: 0.005
    precision: "2 decimal places, round_half_up (round only the final commission)"

  - name: closing_cost_allocation
    trigger: "POST /api/statements with variant=FINAL"
    algorithm: waterfall_allocation
    formula: |
      total_cost = TITLE_FLAT + TITLE_PCT * gross_price
                 + SURVEY_PER_TRACT * (number of tracts in winning scope)
                 + ESCROW_PCT * gross_price * ESCROW_SELLER_SHARE
      total_cost = round_half_up(total_cost, 2)
      For FINAL: allocate total_cost across scope tracts by appraisal weight
        w_t = appraisal_t / sum(appraisal over scope)
        share_t = round_half_up(total_cost * w_t, 2)          # PER-TRACT rounding FIRST (pinned order)
        residual = total_cost - sum(share_t)
        residual (which may be 0.00, positive, or negative cents) is added to the tract with
        the highest tract_number so that sum(allocated) == total_cost exactly
      For PROVISIONAL: no per-tract allocation; allocated_seller_costs =
        round_half_up(EST_COST_PCT * gross_price, 2)           # flat estimate, different result
    input_set: "Tracts in the winning scope with their APPRAISAL valuations; ClosingPackage gross"
    constants:
      TITLE_FLAT: 1500
      TITLE_PCT: 0.002
      SURVEY_PER_TRACT: 1200
      ESCROW_PCT: 0.001
      ESCROW_SELLER_SHARE: 0.5
      EST_COST_PCT: 0.005
    precision: "2 decimal places, round_half_up; rounding order is pinned: per-tract first, residual to highest tract_number; never sum-then-round"

  - name: seller_net_sheet
    trigger: "POST /api/statements"
    algorithm: aggregation
    formula: |
      fixed evaluation order (pinned):
        1. gross_price := closing.auction.awarded_total
        2. commission := commission_calc(gross_price, scope appraisals)
        3. allocated_seller_costs := closing_cost_allocation (FINAL) or flat estimate (PROVISIONAL)
        4. rent_credit := possession_proration (FINAL) or 0 (PROVISIONAL)
        5. seller_net = gross_price - commission - allocated_seller_costs - payoff_amount - rent_credit
      PROVISIONAL: allocated_seller_costs = round_half_up(0.005 * gross_price, 2); rent_credit = 0
      FINAL: actual per-tract allocation total and actual rent credit; produces a different
      seller_net from PROVISIONAL for identical closing data
    input_set: "ClosingPackage, its auction's awarded_total, winning scope tracts, disclosures"
    precision: "2 decimal places, round_half_up"
    variants:
      - name: PROVISIONAL
        when: "variant=PROVISIONAL at statement creation"
        difference: "Estimated flat closing costs (0.5% of gross) and zero rent credit"
      - name: FINAL
        when: "variant=FINAL; requires closing READY_TO_CLOSE"
        difference: "Actual allocated costs and possession rent credit"

  - name: possession_proration
    trigger: "POST /api/statements with variant=FINAL"
    algorithm: chronological
    formula: |
      For each in-scope tract with a LeaseDisclosure:
        possession_date = max(target_closing_date, lease_end_date + 1 day)   # adjacency at day granularity
        if possession_date > target_closing_date:
          days = calendar days from target_closing_date to possession_date (exclusive of start, inclusive of end)
          daily_rent = round_half_up(annual_rent / 365, 2)                    # round DAILY first (pinned)
          credit_tract = round_half_up(daily_rent * days, 2)
      rent_credit = sum(credit_tract) over tracts with disclosures (0 if none)
      rent_credit reduces seller_net (seller compensates buyer for held possession)
    input_set: "LeaseDisclosure rows of tracts in the winning scope (any status), ClosingPackage.target_closing_date"
    precision: "2 decimal places, round_half_up; daily rate rounded before multiplication"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present; role is a declared role", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "Caller role is in the endpoint's roles list; ownership rules (agent owns listing, seller owns listing, buyer acts as self) enforced by comparing X-User-ID to the entity FK", error_id: ERR_FORBIDDEN, http_status: 403, applies_to: "all" }
  - { priority: 3, category: existence, check: "Path ids exist (left to right), then body reference ids exist (listing_id, tract_id, auction_id, closing_id, seller_id, tract_ids elements)", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all" }
  - { priority: 4, category: existence, check: "Request schema: required fields present, types correct, enum values valid, ranges valid (acres > 0, SPI in (0,100], tillable <= gross, amount > 0, dates parseable); seller_consent required true for survey WAIVE", error_id: ERR_VALIDATION, http_status: 400, applies_to: "all" }
  - { priority: 5, category: state, check: "Target entity state permits the transition per §1.2 (listing DRAFT for tract create/package, PACKAGED for market, etc.; deposit PENDING/RECEIVED/LATE gates; disclosure DISCLOSED for acknowledge; closing not CLOSED/TERMINATED; no rights creation while any listing auction OPEN/EXTENDED -> ERR_RIGHTS_LOCKED)", error_id: ERR_INVALID_LISTING_STATE, http_status: 409, applies_to: "state-gated endpoints; endpoint-specific ids: ERR_INVALID_AUCTION_STATE, ERR_AUCTION_NOT_OPEN (bids), ERR_INVALID_DEPOSIT_STATE, ERR_INVALID_CLOSING_STATE, ERR_INVALID_DISCLOSURE_STATE, ERR_RIGHTS_LOCKED" }
  - { priority: 6, category: state, check: "OCC: expected_listing_version == Listing.version on POST /api/tracts; expected_auction_version == AuctionEvent.version on POST /api/bids", error_id: ERR_STALE_LISTING_VERSION, http_status: 412, applies_to: "POST /api/tracts, POST /api/bids; bid variant ERR_STALE_AUCTION_VERSION" }
  - { priority: 7, category: business_safety, check: "Bidder compliance: buyer.qualification_status == QUALIFIED and logical clock < qualification_expires_at", error_id: ERR_BUYER_NOT_QUALIFIED, http_status: 422, applies_to: "POST /api/bids" }
  - { priority: 8, category: business_safety, check: "Disclosure compliance: closing creation requires every LeaseDisclosure of every tract in the winning scope to be ACKNOWLEDGED", error_id: ERR_DISCLOSURE_NOT_ACKNOWLEDGED, http_status: 422, applies_to: "POST /api/closings" }
  - { priority: 9, category: business_safety, check: "Rights compliance: marketing requires a DECLARED RightsDisposition on every tract", error_id: ERR_RIGHTS_NOT_DECLARED, http_status: 422, applies_to: "POST /api/listings/{id}/market" }
  - { priority: 10, category: business_temporal, check: "Auction window well-formed: end > start, duration >= 60 min, start >= clock + 24h; open requires start <= clock < end", error_id: ERR_AUCTION_WINDOW_INVALID, http_status: 422, applies_to: "POST /api/auctions, POST /api/auctions/{id}/open" }
  - { priority: 11, category: business_temporal, check: "Per-listing overlap: windows of this listing's auctions in {SCHEDULED, OPEN, EXTENDED, CLOSED_PENDING_AWARD} must be disjoint half-open [start, end); adjacency permitted (new.start == existing.end is allowed)", error_id: ERR_LISTING_AUCTION_OVERLAP, http_status: 409, applies_to: "POST /api/auctions" }
  - { priority: 12, category: business_temporal, check: "Auctioneer buffer: compares only auctions of OTHER listings sharing the same agent_id (same-listing windows are governed solely by priority 11); against any such auction in {SCHEDULED, OPEN, EXTENDED, CLOSED_PENDING_AWARD}, reject if new.start < existing.end + 2h AND new.end + 2h > existing.start; a gap of exactly 2h passes", error_id: ERR_AUCTIONEER_SCHEDULE_CONFLICT, http_status: 409, applies_to: "POST /api/auctions" }
  - { priority: 13, category: business_temporal, check: "Closing date must be strictly after the logical clock", error_id: ERR_CLOSING_DATE_PAST, http_status: 422, applies_to: "POST /api/closings" }
  - { priority: 14, category: business_referential, check: "Acreage integrity: on tract create, sum(existing tracts) + new gross_acres <= listing.total_gross_acres; on package, equality required", error_id: ERR_ACREAGE_MISMATCH, http_status: 422, applies_to: "POST /api/tracts, POST /api/listings/{id}/package" }
  - { priority: 15, category: business_referential, check: "Bid scope: tract_ids non-empty, all belong to the auction's listing, all OFFERED; WHOLE listings require scope == all listing tracts; SPLIT requires exactly one tract; COMBINATION allows any subset", error_id: ERR_TRACT_SCOPE_INVALID, http_status: 422, applies_to: "POST /api/bids" }
  - { priority: 16, category: business_referential, check: "Uniqueness: one LeaseDisclosure per tract, one RightsDisposition per tract, one ClosingPackage per auction, one FINAL SettlementStatement per closing, one sealed bid per buyer per auction, unique agent license_number", error_id: ERR_DUPLICATE_RECORD, http_status: 409, applies_to: "POST /api/disclosures, POST /api/rights, POST /api/closings, POST /api/statements, POST /api/bids, POST /api/agents" }
  - { priority: 17, category: business_fiscal, check: "Bid economics: amount >= current_high + increment(current_high) for single-tract/whole scopes (LIVE/ONLINE); combination premium rule; amount >= sum(min_price) when no high exists; sealed bids meet sum(min_price)", error_id: ERR_BID_BELOW_INCREMENT, http_status: 422, applies_to: "POST /api/bids; minimum-floor failures use ERR_BID_BELOW_MINIMUM" }
  - { priority: 18, category: business_fiscal, check: "Bid amount <= buyer.proof_of_funds_amount", error_id: ERR_PROOF_OF_FUNDS_INSUFFICIENT, http_status: 422, applies_to: "POST /api/bids" }
  - { priority: 19, category: business_fiscal, check: "Reserve floor at packaging: reserve_price_total >= 0.85 * sum of PROVISIONAL tract valuations (ERR_NO_COMPARABLES if any tract's comparable set is empty)", error_id: ERR_RESERVE_BELOW_FLOOR, http_status: 422, applies_to: "POST /api/listings/{id}/package" }
  - { priority: 20, category: business_fiscal, check: "Award economics: awarded_total >= listing.reserve_price_total", error_id: ERR_RESERVE_NOT_MET, http_status: 422, applies_to: "POST /api/auctions/{id}/award" }

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  - { method: POST, path: "/api/_clock/set_current_utc", description: "Test-driving logical clock. Default at server start is exactly 2026-08-01T00:00:00Z (never wall-clock). Setting the clock runs all time sweeps: auction close/NO_SAE at effective_end, qualification expiry, EMD late/forfeit cascades.", roles: [PlatformAdmin], code: 200, input: [to_iso8601], output: "{ current_utc: string }", side_effects: ["Run system transitions: auction close sweep, Buyer QUALIFIED->EXPIRED, EMD PENDING->LATE and {PENDING,LATE}->FORFEITED cascades"] }
  - { method: POST, path: "/api/sellers", description: "Create a seller", roles: [PlatformAdmin], code: 201, input: [full_name, email], output: Seller, side_effects: [] }
  - { method: POST, path: "/api/agents", description: "Create a broker agent", roles: [PlatformAdmin], code: 201, input: [full_name, license_number], output: BrokerAgent, side_effects: [] }
  - { method: POST, path: "/api/buyers", description: "Create a buyer (starts UNVERIFIED)", roles: [PlatformAdmin], code: 201, input: [full_name, email, proof_of_funds_amount], output: Buyer, side_effects: [] }
  - { method: GET, path: "/api/buyers/{id}", description: "Read a buyer; Buyer role may read only its own id", roles: [PlatformAdmin, BrokerAgent, Buyer], code: 200, input: [], output: Buyer, side_effects: [] }
  - { method: POST, path: "/api/buyers/{id}/qualify", description: "Qualify a buyer (UNVERIFIED or EXPIRED -> QUALIFIED) and set expiry", roles: [PlatformAdmin], code: 200, input: [qualification_expires_at], output: Buyer, side_effects: ["Buyer.qualification_status := QUALIFIED"] }
  - { method: POST, path: "/api/listings", description: "Create a listing in DRAFT; agent_id set from caller", roles: [BrokerAgent], code: 201, input: [seller_id, title, county, state_code, total_gross_acres, packaging_strategy, reserve_price_total], output: Listing, side_effects: [] }
  - { method: GET, path: "/api/listings/{id}", description: "Read a listing", roles: [Seller, BrokerAgent, Buyer, PlatformAdmin], code: 200, input: [], output: Listing, side_effects: [] }
  - { method: GET, path: "/api/listings", description: "List/filter listings", roles: [Seller, BrokerAgent, Buyer, PlatformAdmin], code: 200, input: ["seller_id?", "agent_id?", "status?", "limit?", "offset?"], output: "Listing[]", side_effects: [] }
  - { method: POST, path: "/api/tracts", description: "Add a tract to a DRAFT listing (OCC on Listing.version)", roles: [BrokerAgent], code: 201, input: [listing_id, tract_number, gross_acres, tillable_acres, soil_productivity_index, min_price, expected_listing_version], output: Tract, side_effects: ["Listing.version += 1", "Acreage running-total check (ERR_ACREAGE_MISMATCH)"] }
  - { method: GET, path: "/api/tracts/{id}", description: "Read a tract", roles: [Seller, BrokerAgent, Buyer, PlatformAdmin], code: 200, input: [], output: Tract, side_effects: [] }
  - { method: GET, path: "/api/listings/{id}/tracts", description: "List tracts of a listing", roles: [Seller, BrokerAgent, Buyer, PlatformAdmin], code: 200, input: ["limit?", "offset?"], output: "Tract[]", side_effects: [] }
  - { method: POST, path: "/api/listings/{id}/package", description: "DRAFT -> PACKAGED; pins strategy; enforces acreage equality and reserve floor", roles: [BrokerAgent], code: 200, input: [], output: Listing, side_effects: ["Listing.version += 1"] }
  - { method: POST, path: "/api/listings/{id}/market", description: "PACKAGED -> MARKETED; requires rights DECLARED on all tracts; tracts -> OFFERED", roles: [BrokerAgent], code: 200, input: [], output: Listing, side_effects: ["Tracts REGISTERED -> OFFERED", "Listing.version += 1"] }
  - { method: POST, path: "/api/listings/{id}/withdraw", description: "Withdraw listing pre-contract; cascades to auctions, bids, deposits, tracts, rights", roles: [Seller, BrokerAgent], code: 200, input: [], output: Listing, side_effects: ["Auctions SCHEDULED/OPEN/EXTENDED -> CANCELLED", "Bids PLACED/SEALED -> VOIDED", "Tracts -> WITHDRAWN", "Rights LOCKED -> DECLARED"] }
  - { method: POST, path: "/api/comparables", description: "Create a comparable sale record (immutable)", roles: [PlatformAdmin], code: 201, input: [county, state_code, sale_date, sale_price_total, gross_acres, tillable_acres, soil_productivity_index], output: ComparableSale, side_effects: [] }
  - { method: GET, path: "/api/tracts/{id}/valuation", description: "Computed read of spi_adjusted_valuation for a tract; variant selects PROVISIONAL or APPRAISAL", roles: [Seller, BrokerAgent, Buyer, PlatformAdmin], code: 200, input: [variant], output: "{ tract_id: string, variant: string, comparable_count: integer, value_per_acre: number, estimated_value: integer }", side_effects: [] }
  - { method: POST, path: "/api/auctions", description: "Create auction SCHEDULED for a MARKETED/AUCTION_SCHEDULED listing; window validation, per-listing half-open overlap check, cross-listing auctioneer 2h buffer check", roles: [BrokerAgent], code: 201, input: [listing_id, method, scheduled_start, scheduled_end, "soft_close_window_minutes?", "extension_minutes?"], output: AuctionEvent, side_effects: ["Listing MARKETED -> AUCTION_SCHEDULED", "Listing.version += 1"] }
  - { method: GET, path: "/api/auctions/{id}", description: "Read an auction", roles: [Seller, BrokerAgent, Buyer, PlatformAdmin], code: 200, input: [], output: AuctionEvent, side_effects: [] }
  - { method: GET, path: "/api/listings/{id}/auctions", description: "List auctions of a listing", roles: [Seller, BrokerAgent, Buyer, PlatformAdmin], code: 200, input: ["limit?", "offset?"], output: "AuctionEvent[]", side_effects: [] }
  - { method: POST, path: "/api/auctions/{id}/open", description: "SCHEDULED -> OPEN inside the window; locks rights; re-offers UNSOLD tracts", roles: [BrokerAgent], code: 200, input: [], output: AuctionEvent, side_effects: ["Rights DECLARED -> LOCKED", "Tracts UNSOLD -> OFFERED", "AuctionEvent.version += 1"] }
  - { method: POST, path: "/api/auctions/{id}/award", description: "CLOSED_PENDING_AWARD -> AWARDED; runs winning_bid_selection; creates EMDs; tracts SOLD/UNSOLD; listing gate", roles: [BrokerAgent], code: 200, input: [], output: AuctionEvent, side_effects: ["Bids to CONFIRMED_WINNER/LOST", "EarnestMoneyDeposit PENDING created per winner", "Tracts -> SOLD/UNSOLD", "Listing -> UNDER_CONTRACT if all tracts SOLD", "AuctionEvent.version += 1"] }
  - { method: POST, path: "/api/auctions/{id}/no-sale", description: "CLOSED_PENDING_AWARD -> NO_SALE; voids bids; listing back to MARKETED", roles: [BrokerAgent], code: 200, input: [], output: AuctionEvent, side_effects: ["Bids -> VOIDED", "Listing AUCTION_SCHEDULED -> MARKETED", "Rights LOCKED -> DECLARED", "AuctionEvent.version += 1"] }
  - { method: POST, path: "/api/bids", description: "Place a bid (OCC on AuctionEvent.version); buyer must be QUALIFIED; scope/increment/premium rules per bid_increment_schedule", roles: [Buyer], code: 201, input: [auction_id, amount, tract_ids, expected_auction_version], output: Bid, side_effects: ["Prior identical-scope PLACED high bid -> OUTBID (LIVE/ONLINE)", "ONLINE soft-close extension when within window", "AuctionEvent.version += 1"] }
  - { method: GET, path: "/api/bids/{id}", description: "Read a bid; Buyer may read only own bids; SEALED amounts null until REVEALED", roles: [BrokerAgent, PlatformAdmin, Buyer], code: 200, input: [], output: Bid, side_effects: [] }
  - { method: GET, path: "/api/bids", description: "List/filter bids (admin surface; buyers not permitted)", roles: [BrokerAgent, PlatformAdmin], code: 200, input: ["auction_id?", "buyer_id?", "status?", "limit?", "offset?"], output: "Bid[]", side_effects: [] }
  - { method: POST, path: "/api/deposits/{id}/record-payment", description: "Record an escrow payment; cumulative >= amount_due flips PENDING->RECEIVED (on-time) or ->LATE (after due_at)", roles: [BrokerAgent], code: 200, input: [amount], output: EarnestMoneyDeposit, side_effects: ["amount_received += amount; status transition per deadline"] }
  - { method: POST, path: "/api/deposits/{id}/verify", description: "Verify cleared funds (RECEIVED or LATE -> VERIFIED); PlatformAdmin only (segregation of duties)", roles: [PlatformAdmin], code: 200, input: [], output: EarnestMoneyDeposit, side_effects: [] }
  - { method: GET, path: "/api/deposits/{id}", description: "Read a deposit; Buyer may read only deposits of own bids", roles: [BrokerAgent, PlatformAdmin, Buyer], code: 200, input: [], output: EarnestMoneyDeposit, side_effects: [] }
  - { method: GET, path: "/api/bids/{id}/deposits", description: "List deposits for a bid (0 or 1 element)", roles: [BrokerAgent, PlatformAdmin, Buyer], code: 200, input: [], output: "EarnestMoneyDeposit[]", side_effects: [] }
  - { method: POST, path: "/api/disclosures", description: "Create a lease disclosure (DISCLOSED) for a tract while listing is DRAFT or PACKAGED", roles: [BrokerAgent], code: 201, input: [tract_id, tenant_name, lease_start_date, lease_end_date, annual_rent], output: LeaseDisclosure, side_effects: [] }
  - { method: POST, path: "/api/disclosures/{id}/acknowledge", description: "Winning buyer acknowledges a disclosure (DISCLOSED -> ACKNOWLEDGED)", roles: [Buyer], code: 200, input: [], output: LeaseDisclosure, side_effects: ["acknowledged_by_buyer_id := caller"] }
  - { method: GET, path: "/api/tracts/{id}/disclosures", description: "List disclosures of a tract", roles: [Seller, BrokerAgent, Buyer, PlatformAdmin], code: 200, input: [], output: "LeaseDisclosure[]", side_effects: [] }
  - { method: POST, path: "/api/rights", description: "Declare mineral/wind rights for a tract (listing DRAFT/PACKAGED/MARKETED; blocked while an auction is OPEN/EXTENDED)", roles: [BrokerAgent], code: 201, input: [tract_id, mineral_rights, wind_rights], output: RightsDisposition, side_effects: [] }
  - { method: GET, path: "/api/tracts/{id}/rights", description: "List rights dispositions of a tract", roles: [Seller, BrokerAgent, Buyer, PlatformAdmin], code: 200, input: [], output: "RightsDisposition[]", side_effects: [] }
  - { method: POST, path: "/api/closings", description: "Initiate closing for an AWARDED auction; requires EMD VERIFIED and all in-scope disclosures ACKNOWLEDGED", roles: [BrokerAgent], code: 201, input: [auction_id, target_closing_date, payoff_amount], output: ClosingPackage, side_effects: ["Axes initialized NOT_ORDERED/NOT_ORDERED/UNFUNDED; overall INITIATED"] }
  - { method: GET, path: "/api/closings/{id}", description: "Read a closing package", roles: [BrokerAgent, Seller, PlatformAdmin], code: 200, input: [], output: ClosingPackage, side_effects: [] }
  - { method: GET, path: "/api/auctions/{id}/closings", description: "List closings of an auction (0 or 1 element)", roles: [BrokerAgent, Seller, PlatformAdmin], code: 200, input: [], output: "ClosingPackage[]", side_effects: [] }
  - { method: POST, path: "/api/closings/{id}/track-events", description: "Advance one axis: axis in {TITLE, SURVEY, FUNDING}; events per §1.2 note; FUNDING axis is PlatformAdmin-only, TITLE/SURVEY BrokerAgent-only; WAIVE requires seller_consent: true", roles: [BrokerAgent, PlatformAdmin], code: 200, input: [axis, event, "seller_consent?"], output: ClosingPackage, side_effects: ["overall_status recomputed", "DISBURSE cascades: listing CLOSED, deposit APPLIED_TO_CLOSING, FINAL statement PAID, disclosures POSSESSION_TRANSFERRED"] }
  - { method: POST, path: "/api/statements", description: "Create a settlement statement (PROVISIONAL anytime before CLOSED; FINAL requires READY_TO_CLOSE); supersedes prior PROVISIONAL", roles: [BrokerAgent], code: 201, input: [closing_id, variant], output: SettlementStatement, side_effects: ["Prior PROVISIONAL -> SUPERSEDED", "Computes commission_calc, closing_cost_allocation, possession_proration, seller_net_sheet"] }
  - { method: GET, path: "/api/closings/{id}/statements", description: "List statements of a closing", roles: [BrokerAgent, Seller, PlatformAdmin], code: 200, input: [], output: "SettlementStatement[]", side_effects: [] }
  - { method: POST, path: "/api/closings/{id}/terminate", description: "Terminate a non-CLOSED closing; refunds VERIFIED deposit, voids winning bid, reverts auction/listing/tracts", roles: [BrokerAgent], code: 200, input: [], output: ClosingPackage, side_effects: ["EMD VERIFIED -> REFUNDED", "Bid CONFIRMED_WINNER -> VOIDED", "Auction AWARDED -> NO_SALE", "Listing UNDER_CONTRACT -> MARKETED", "Tracts SOLD -> OFFERED", "Statements FINAL/PROVISIONAL -> SUPERSEDED"] }

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/unknown X-User-Role or X-User-ID" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not in endpoint roles, or ownership check failed (agent/seller/buyer acting on another party's resource), or Buyer reads another buyer's resource, or BrokerAgent attempts a FUNDING track event" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path or body reference id does not exist" }
  - { id: ERR_VALIDATION, http: 400, condition: "Schema/type/enum/range violation; survey WAIVE without seller_consent: true; qualify expiry not in the future" }
  - { id: ERR_INVALID_LISTING_STATE, http: 409, condition: "Listing state does not permit the operation (tract add/package/market/withdraw gates)" }
  - { id: ERR_INVALID_AUCTION_STATE, http: 409, condition: "Auction state does not permit open/award/no-sale/closing-create, or award with no eligible bids" }
  - { id: ERR_AUCTION_NOT_OPEN, http: 409, condition: "Bid placed while auction is not OPEN or EXTENDED" }
  - { id: ERR_INVALID_DEPOSIT_STATE, http: 409, condition: "record-payment on non-PENDING/non-LATE deposit, verify from a state other than RECEIVED/LATE, or closing creation without a VERIFIED deposit" }
  - { id: ERR_INVALID_CLOSING_STATE, http: 409, condition: "Track event invalid for current axis state; DISBURSE before READY_TO_CLOSE or without FINAL statement; FINAL statement before READY_TO_CLOSE; terminate of CLOSED closing" }
  - { id: ERR_INVALID_DISCLOSURE_STATE, http: 409, condition: "Acknowledge a disclosure not in DISCLOSED" }
  - { id: ERR_RIGHTS_LOCKED, http: 409, condition: "Rights creation while any auction of the listing is OPEN or EXTENDED" }
  - { id: ERR_STALE_LISTING_VERSION, http: 412, condition: "expected_listing_version != Listing.version on POST /api/tracts" }
  - { id: ERR_STALE_AUCTION_VERSION, http: 412, condition: "expected_auction_version != AuctionEvent.version on POST /api/bids" }
  - { id: ERR_BUYER_NOT_QUALIFIED, http: 422, condition: "Buyer not QUALIFIED or qualification expired at bid time" }
  - { id: ERR_DISCLOSURE_NOT_ACKNOWLEDGED, http: 422, condition: "Closing creation with an unacknowledged in-scope lease disclosure" }
  - { id: ERR_RIGHTS_NOT_DECLARED, http: 422, condition: "Market attempt with a tract lacking a DECLARED rights disposition" }
  - { id: ERR_AUCTION_WINDOW_INVALID, http: 422, condition: "Window malformed (end <= start, duration < 60 min, start < clock + 24h) or open outside the window" }
  - { id: ERR_LISTING_AUCTION_OVERLAP, http: 409, condition: "New window overlaps (half-open) another active auction of the same listing; adjacency allowed" }
  - { id: ERR_AUCTIONEER_SCHEDULE_CONFLICT, http: 409, condition: "New window within 2h buffer of an auction of a DIFFERENT listing with the same agent, where that auction is in {SCHEDULED, OPEN, EXTENDED, CLOSED_PENDING_AWARD}; exactly 2h gap allowed" }
  - { id: ERR_CLOSING_DATE_PAST, http: 422, condition: "target_closing_date not strictly after the logical clock" }
  - { id: ERR_ACREAGE_MISMATCH, http: 422, condition: "Tract acreage sum exceeds total on create, or not exactly equal at package" }
  - { id: ERR_TRACT_SCOPE_INVALID, http: 422, condition: "Bid scope empty, foreign to listing, not OFFERED, or violates strategy shape" }
  - { id: ERR_DUPLICATE_RECORD, http: 409, condition: "Second disclosure/rights/closing/FINAL statement, second sealed bid by same buyer, or duplicate agent license_number" }
  - { id: ERR_BID_BELOW_INCREMENT, http: 422, condition: "Bid below current_high + tier increment (LIVE/ONLINE)" }
  - { id: ERR_BID_BELOW_MINIMUM, http: 422, condition: "Bid below sum of per-tract min_price for its scope (or below combination premium threshold)" }
  - { id: ERR_PROOF_OF_FUNDS_INSUFFICIENT, http: 422, condition: "Bid amount exceeds buyer proof_of_funds_amount" }
  - { id: ERR_RESERVE_BELOW_FLOOR, http: 422, condition: "reserve_price_total below 85% of provisional valuation sum at packaging" }
  - { id: ERR_RESERVE_NOT_MET, http: 422, condition: "Award attempted with awarded_total below listing reserve" }
  - { id: ERR_NO_COMPARABLES, http: 422, condition: "Valuation requested (or packaging floor check) with an empty comparable set" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: Seller
    description: " farmland owner who lists property and may withdraw it pre-contract"
    identity: "entity_backed:Seller"
    exclusive_operations: []
    shared_operations: ["POST /api/listings/{id}/withdraw (own listings only)", "read listings/tracts/auctions/valuations/disclosures/rights/closings/statements"]
  - name: BrokerAgent
    description: "Listing agent / auctioneer; owns listings it creates; runs packaging, marketing, auctions, escrow recording, closing coordination"
    identity: "entity_backed:BrokerAgent"
    exclusive_operations: ["POST /api/listings", "POST /api/tracts", "POST /api/listings/{id}/package", "POST /api/listings/{id}/market", "POST /api/auctions", "POST /api/auctions/{id}/open", "POST /api/auctions/{id}/award", "POST /api/auctions/{id}/no-sale", "POST /api/deposits/{id}/record-payment", "POST /api/disclosures", "POST /api/rights", "POST /api/closings", "POST /api/statements", "POST /api/closings/{id}/terminate", "TITLE/SURVEY track events"]
    shared_operations: ["POST /api/listings/{id}/withdraw (own listings)", "reads", "POST /api/closings/{id}/track-events (TITLE/SURVEY axes)"]
  - name: Buyer
    description: "Qualified bidder; places bids, acknowledges lease disclosures after winning"
    identity: "entity_backed:Buyer"
    exclusive_operations: ["POST /api/bids", "POST /api/disclosures/{id}/acknowledge"]
    shared_operations: ["read own buyer record, own bids, own deposits", "read listings/tracts/auctions/valuations/disclosures/rights"]
  - name: PlatformAdmin
    description: "Back-office operator: party onboarding, buyer qualification, comparables, escrow verification, funding disbursement, logical clock"
    identity: "opaque"
    exclusive_operations: ["POST /api/sellers", "POST /api/agents", "POST /api/buyers", "POST /api/buyers/{id}/qualify", "POST /api/comparables", "POST /api/deposits/{id}/verify", "FUNDING track events", "POST /api/_clock/set_current_utc"]
    shared_operations: ["reads", "GET /api/bids"]
