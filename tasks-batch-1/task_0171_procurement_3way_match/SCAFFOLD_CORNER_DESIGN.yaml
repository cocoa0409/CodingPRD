        distinguishing_aspect: "estimated_total_cents exactly == approval_threshold_cents (500000) keeps required_levels at 1 (strict >), so only one MANAGER ApprovalStep is created."
        test_recipe:
          setup:
            - "Category with approval_threshold_cents=500000, director_threshold_cents=2000000; requisition line qty=10 est=50000 -> estimated_total 500000."
          setup_api_calls:
            - call: "POST /procurement/vendors"
              payload: { name: "V", tax_id: "TAX-CALC1" }
              as: ProcurementAdmin
              captures: { v_id: $.data.id }
