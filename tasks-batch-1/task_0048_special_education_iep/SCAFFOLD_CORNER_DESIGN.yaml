  # =========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_version_on_service_add_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[service-add-stale-iep]
          - errors[ERR_STALE_VERSION]
          - entities.IEP.fields.version
        distinguishing_aspect: >-
          Adding a RelatedService twice: the first add bumps IEP.version, then a second add still
          carrying the pre-first expected_iep_version (captured before the first add) is rejected with
          ERR_STALE_VERSION (412).
        test_recipe:
          setup:
            - "A DRAFT IEP (school_day_minutes=360) for an eligible student, captured at its create version."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T09:00:00Z" }
              as: SpecialEdAdmin
            - call: "POST /students"
              payload: { full_name: "Ham Ott", date_of_birth: "2014-05-05", grade_level: 6 }
              as: SpecialEdAdmin
              captures: { stu_id: $.data.id }
            - call: "POST /evaluations"
              payload: { student_id: "${stu_id}", eval_type: "INITIAL", cognitive_score: 110, academic_score: 70, adaptive_score: 75, proposed_category: "SLD" }
              as: CaseManager
              as_user_id: "cm_1"
              captures: { eval_id: $.data.id }
            - call: "POST /evaluations/${eval_id}/request-consent"
              payload: {}
              as: CaseManager
              as_user_id: "cm_1"
            - call: "GET /consent-requests"
              payload: { student_id: "${stu_id}", consent_type: "EVALUATION", status: "PENDING" }
              as: Parent
              as_user_id: "par_1"
              captures: { cr_id: "$.data[0].id" }
            - call: "POST /consent-requests/${cr_id}/decide"
              payload: { decision: "GRANT" }
              as: Parent
              as_user_id: "par_1"
            - call: "POST /evaluations/${eval_id}/begin"
              payload: {}
              as: Evaluator
              as_user_id: "ev_1"
            - call: "POST /evaluations/${eval_id}/finalize"
              payload: {}
              as: Evaluator
              as_user_id: "ev_1"
            - call: "POST /ieps"
              payload: { student_id: "${stu_id}", school_day_minutes: 360, annual_review_due_date: "2027-03-01" }
              as: CaseManager
              as_user_id: "cm_1"
              captures: { iep_id: $.data.id, iep_v_stale: $.data.version }
            - call: "POST /related-services"
              payload: { iep_id: "${iep_id}", service_type: "SPEECH", minutes_per_week: 150, delivered_in_general_ed: false, expected_iep_version: "${iep_v_stale}" }
              as: CaseManager
              as_user_id: "cm_1"
          trigger:
            - call: "POST /related-services"
              payload: { iep_id: "${iep_id}", service_type: "OT", minutes_per_week: 90, delivered_in_general_ed: false, expected_iep_version: "${iep_v_stale}" }
              as: CaseManager
              as_user_id: "cm_1"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 412"
            - "response error_id == ERR_STALE_VERSION"

