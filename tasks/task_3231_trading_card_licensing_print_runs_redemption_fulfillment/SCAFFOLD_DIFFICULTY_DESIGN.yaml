            - "the second hobby allocation returns 409 with error_id == ERR_CHANNEL_ALREADY_UTF and its status stays RESERVED"
            - "POST /api/distribution-allocations/${al_m_id}/mark-utf returns 200 — a different channel on the same line is not blocked"
            - "the two hobby rows differ in id but share (product_line_id, channel), so the scope is the pair and not the row"

  # ===========================================================================
  # Group I — compensating_invariant
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: card_set_approval_roll_back_leaves_the_license_counts_untouched
        grounds:
          - "state_machines.CardSet.UNDER_REVIEW_to_APPROVED"
          - "state_machines.CardSet.UNDER_REVIEW_to_DRAFT"
          - calculations.license_set_counts
        distinguishing_aspect: "The conserved quantity is a COUNT on the ancestor: License.approved_set_count must return to exactly 0 after approve-then-return-to-draft while License.set_count stays at 1 throughout, which an incrementally-maintained counter drifts away from."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. License L active with two lines L1 and L2, each holding one set S1 and S2 in UNDER_REVIEW with one APPROVED artwork each."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - &v_lic
              call: "POST /api/licenses"
              payload: { grantor_name: "Major League Baseball Players Association", exclusivity_scope: "EXCLUSIVE", term_starts_on: "2026-01-01T00:00:00Z", term_ends_on: "2029-12-31T00:00:00Z", approval_window_days: 10 }
              as: LicensingManager
              captures: { lic_id: $.data.id, lic_v0: $.data.version }
            - call: "POST /api/licenses/${lic_id}/activate"
              payload: {}
              as: LicensingManager
            - call: "POST /api/product-lines"
              payload: { license_id: "${lic_id}", line_name: "2026 Flagship Baseball", line_kind: "BASE", packs_per_box: 10, cards_per_pack: 10, boxes_per_case: 20, cases_printed: 50, run_planned_on: "2026-10-01T00:00:00Z" }
              as: ProductManager
              captures: { l1_id: $.data.id }
            - call: "POST /api/product-lines/${l1_id}/ready-for-approval"
              payload: {}
              as: ProductManager
            - call: "POST /api/card-sets"
              payload: { product_line_id: "${l1_id}", set_name: "Flagship Base", set_tier: "BASE", announced: true, serial_numbered: false, autograph_planned_count: 0, print_run_quantity: 500 }
              as: ProductManager
              captures: { s1_id: $.data.id, s1_v0: $.data.version }
            - call: "POST /api/card-sets/${s1_id}/artwork-approvals"
              payload: { artwork_code: "ART-BASE-001", approver_id: "${lic_id}", submitted_on: "2026-08-20T00:00:00Z" }
              as: ProductManager
              captures: { art1_id: $.data.id }
            - call: "POST /api/artwork-approvals/${art1_id}/decide"
              payload: { decision: "APPROVE", decided_on: "2026-08-25T00:00:00Z" }
              as: LicensorApprover
              as_user_id: "${lic_id}"
            - call: "POST /api/card-sets/${s1_id}/submit"
              payload: {}
              as: ProductManager
              captures: { s1_v1: $.data.version }
          trigger:
            - call: "POST /api/card-sets/${s1_id}/approve"
              payload: { expected_card_set_version: "${s1_v1}" }
              as: ProductManager
              captures: { s1_v2: $.data.version }
            - call: "POST /api/card-sets/${s1_id}/return-to-draft"
              payload: {}
              as: ProductManager
          assert:
            - "the approve call returns 200 and License.${lic_id}.approved_set_count == 1 immediately after it"
            - "the return-to-draft call returns 200 and License.${lic_id}.approved_set_count == 0 again"
            - "License.${lic_id}.set_count == 1 at both points, since it counts sets of every status and must not move"
            - "the conserved quantity License.${lic_id}.approved_set_count returns to its pre-approval value of 0 exactly"
            - "CardSet.${s1_id}.status == DRAFT and its rights_pinned_version is left at the value pinned by the approval"

      - name: quality_credit_restores_every_redemption_scratch_value_exactly
        grounds:
          - "state_machines.Redemption.FULFILLED_to_ISSUED"
          - "state_machines.QualityClaim.APPROVED_to_CREDITED"
          - calculations.redemption_substitution_ratio
        distinguishing_aspect: "The conserved quantity is a MONEY sum spanning a depth-3 cascade: the two fulfilled redemptions must read their original scratch values again after the credit, so the credited allowance sum equals the restored scratch sum of 650000."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. License L active, line PL, set S approved with autograph_planned_count 200 and print_run_quantity 500. Two redemptions issued on S — R_A at 150000 and R_B at 500000 — then a signing session with 200 cards allocated to S, shipped and completed, which fulfils both."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - *v_lic
            - call: "POST /api/licenses/${lic_id}/activate"
              payload: {}
              as: LicensingManager
            - *x_line
            - *x_set
            - *x_submit
            - *x_approve
            - call: "POST /api/card-sets/${set_id}/redemptions"
              payload: { redemption_code: "RDM-8001", signer_name: "Ken Griffey Jr", estimated_value_cents: 150000, opened_on: "2026-09-01T00:00:00Z" }
              as: RedemptionFulfilmentAnalyst
              captures: { red_a_id: $.data.id }
            - call: "POST /api/card-sets/${set_id}/redemptions"
              payload: { redemption_code: "RDM-8002", signer_name: "Ken Griffey Jr", estimated_value_cents: 500000, opened_on: "2026-09-01T00:00:00Z" }
              as: RedemptionFulfilmentAnalyst
              captures: { red_b_id: $.data.id }
            - call: "POST /api/signing-sessions"
              payload: { signer_name: "Ken Griffey Jr", signer_kind: "PLAYER_ASSOCIATION", license_id: "${lic_id}", scheduled_on: "2026-10-05T00:00:00Z", allocation_lines: [{ card_set_id: "${set_id}", player_id: "kgj", quantity_delivered: 200 }] }
              as: SigningCoordinator
              captures: { sess_i_id: $.data.id }
            - call: "POST /api/signing-sessions/${sess_i_id}/prepare-stock"
              payload: {}
              as: SigningCoordinator
            - call: "POST /api/signing-sessions/${sess_i_id}/ship-stock"
              payload: {}
              as: SigningCoordinator
            - call: "POST /api/signing-sessions/${sess_i_id}/complete"
              payload: { signer_attendance: "ATTENDED" }
              as: AuthenticationOfficer
            - call: "POST /api/card-sets/${set_id}/quality-claims"
              payload: { claim_type: "MISPRINT", severity: "MINOR", affected_quantity: 40, filed_on: "2026-09-01T00:00:00Z" }
              as: QualityAnalyst
              captures: { qc_credit_id: $.data.id }
            - call: "POST /api/quality-claims/${qc_credit_id}/open-review"
              payload: {}
              as: QualityAnalyst
            - call: "POST /api/quality-claims/${qc_credit_id}/approve"
              payload: {}
              as: QualityAnalyst
          trigger:
            - call: "POST /api/quality-claims/${qc_credit_id}/credit"
              payload: {}
              as: QualityAnalyst
          assert:
            - "Redemption.${red_a_id}.status == ISSUED and Redemption.${red_b_id}.status == ISSUED before the trigger is FULFILLED for both"
            - "the response status is 200 and QualityClaim.${qc_credit_id}.status == CREDITED"
            - "Redemption.${red_a_id}.estimated_value_cents == 150000 and Redemption.${red_b_id}.estimated_value_cents == 500000 — both restored exactly"
            - "the conserved sum Redemption.${red_a_id}.estimated_value_cents + Redemption.${red_b_id}.estimated_value_cents == 650000, which also equals the pre-cascade sum"
            - "CardSet.${set_id}.autograph_redemptions_outstanding == 2 and License.${lic_id}.approved_set_count == 1, neither of which drifts across the cascade"

