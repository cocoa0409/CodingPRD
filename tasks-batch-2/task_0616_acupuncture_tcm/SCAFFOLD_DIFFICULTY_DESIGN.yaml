      - name: dispense_requires_plan_active
        grounds:
          - validations[priority=8]
          - state_machines.TreatmentPlan.ACTIVE_to_ON_HOLD
          - entities.TreatmentPlan.fields.status
        distinguishing_aspect: |
          Entity pair FormulaDispense->TreatmentPlan (distinct from Appointment->Patient sibling): creating a
          dispense is rejected with ERR_PLAN_NOT_ACTIVE when the referenced plan is ON_HOLD.
