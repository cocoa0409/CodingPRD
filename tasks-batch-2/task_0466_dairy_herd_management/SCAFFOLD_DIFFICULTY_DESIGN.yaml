              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_BREEDING_NOT_CONFIRMED"

      - name: milk_check_excludes_ineligible_animal_under_withhold
        grounds:
          - state_machines.MilkCheck.PROVISIONAL_to_FINALIZED
          - entities.Animal.fields.milk_eligible
          - entities.HealthTreatment.fields.milk_withhold_until
          - errors[ERR_EMPTY_MILK_POOL]
        distinguishing_aspect: |
          Entity pair MilkCheck -> Animal (different pair from Animal->BreedingEvent): finalize pools only
          milk_eligible animals; with the sole producer's Animal.milk_eligible == false (active milk
          withhold), the pool is empty and finalize is rejected ERR_EMPTY_MILK_POOL.
        test_recipe:
          setup:
            - "One cow with one 2026-06 test-day record, but an ACTIVE treatment (administered 2026-06-09T08:00Z, 96h withhold) so milk_eligible == false at clock 2026-06-10; a PROVISIONAL MilkCheck for 2026-06."
