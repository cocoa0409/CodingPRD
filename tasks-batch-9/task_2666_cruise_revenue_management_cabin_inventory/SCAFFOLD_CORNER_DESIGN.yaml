              as: ReservationAgent
              captures: { e4: $.data.error_id }
          assert:
            - "reviewing the DEFINITE block returns HTTP 409 with data.error_id == ERR_GROUP_BLOCK_CLOSED and leaves GroupBlock.${blk_alpha}.version at ${av1}"
            - "extending the DEFINITE block returns HTTP 409 with data.error_id == ERR_GROUP_BLOCK_CLOSED - a signed contract has no review date left to move"
            - "the first two extensions of BETA succeed, each returning status TENTATIVE with review_extension_count 1 then 2 and review_date 2026-08-20 then 2026-08-30"
            - "the third extension returns HTTP 422 with data.error_id == ERR_MAX_REVIEW_EXTENSIONS_EXCEEDED (MAX_REVIEW_EXTENSIONS 2), leaving review_date 2026-08-30T00:00:00Z, review_extension_count 2 and version ${bv2}"
            - "the extension limit error is a 422 capacity refusal, not the 409 closure conflict - BETA is in a legal state for the verb"
            - "Ada's and Bo's group bookings return HTTP 201 with booking_status OPTION, and GroupBlock.${blk_alpha}.picked_up_cabins == 2 with cabins_held still 2"
            - "Cy's third group booking returns HTTP 422 with data.error_id == ERR_GROUP_BLOCK_EXHAUSTED even though allow_waitlist is true - a group booking draws only on its own fence and is never waitlisted"
            - "SailingInventory.${inv_gb}.booked_cabins == 2, group_held_cabins == 2 (only BETA's unpicked hold remains), waitlisted_bookings_count == 0, available_cabins == 6, and 10 + 0 == 6 + 2 + 2 holds"
            - "Sailing.${sail_gb}.lower_berths_sold == 4, occupancy_pct == 10.00 and available_lower_berth_days_net == 144 (4 berths fenced by BETA)"

      - name: guarantee_assignment_and_promotion_window_gates_are_reachable
        claim_type: triggerable
        grounds:
          - errors[ERR_NOT_GUARANTEE_BOOKING]
          - errors[ERR_PROMO_WINDOW_NOT_CURRENT]
          - endpoints[POST /bookings/{id}/assign-guarantee]
          - endpoints[POST /promotions/{id}/activate]
          - calculations.booking_onboard_projection
        distinguishing_aspect: |
          Two gates that only fire on their own verb. ERR_NOT_GUARANTEE_BOOKING has two faces -
          the booking was never sold into a guarantee category, or the requested target is itself a
          guarantee category - and both must answer with the same code while the legal assignment
          moves a cabin between allotments and reprices only the onboard projection, never the fare.
          ERR_PROMO_WINDOW_NOT_CURRENT is inclusive at starts_on, so the identical activate call
          fails one instant before the window and succeeds exactly on it.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; sailing GTY-2701 (nights 7, total_lower_berths 200, embark 2027-01-10T17:00:00Z) is OPEN_FOR_SALE."
            - "Four categories with allotments: IA (guarantee, tier 1, 60/4), IB (guarantee, tier 2, 10/1), OV (named, tier 3, 30/0, onboard lower 11000) and BALCONY (named, tier 4, 20/0). IA and OV carry 730..0 fare windows at base 189995 and 289995."
            - "Two two-adult bookings exist: Nell on OV (net 579990, onboard 154000) and Ada on IA (net 379990, onboard 126000)."
            - "Promotion FALLSALE covers 2026-09-01..2026-09-10 and is SCHEDULED, a month ahead of the clock."
