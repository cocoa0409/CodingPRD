  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: server_pool_half_open_aggregate_capacity_with_legal_adjacency
        resource_entity: "Title.server_pool_id (a shared aggregate-capacity pool)"
        interval_semantics: "HALF-OPEN [scheduled_start_at, scheduled_end_at), adjacency LEGAL, peak concurrency measured at probe points"
        grounds:
          - calculations.server_pool_overlap
          - validations[priority=47]
          - errors[ERR_SERVER_POOL_CAPACITY_EXCEEDED]
          - entities.Title.fields.server_pool_capacity
          - entities.Match.fields.scheduled_end_at
        distinguishing_aspect: |
          Aggregate capacity on a pool shared by every match of the title, with HALF-OPEN
          intervals: two concurrent matches are legal at capacity 2, a third overlapping both is
          not, and a match starting exactly when an earlier one ends is legal because half-open
          endpoints touch without intersecting. The check is a peak-occupancy count, not a
          pairwise overlap test — a pairwise implementation rejects the fourth match.
        test_recipe:
          setup:
            - "One district, school, two coaches and two DRAFT teams in one season (POST /matches needs no team state)"
            - "Title with server_pool_id POOL-SHARED, server_pool_capacity 2 and match_duration_minutes 60, so every match occupies exactly one hour"
            - "Season with default roster_lock_at 2026-09-20T00:00:00.000Z and regular_season_end_at 2026-11-30T00:00:00.000Z, so all four candidate slots are inside the window"
            - "Logical clock left at the 2026-08-01T00:00:00.000Z startup default"
          setup_api_calls:
            - call: "POST /districts"
              payload: { name: "Metro District", state_code: "CA" }
              as: LeagueAdmin
              captures: { d_id: $.data.id }
            - call: "POST /schools"
              payload: { district_id: "${d_id}", name: "North High", nces_code: "N-001" }
              as: DistrictAdmin
              as_user_id: "${d_id}"
              captures: { s_id: $.data.id }
            - call: "POST /coaches"
              payload: { school_id: "${s_id}", full_name: "Coach Alpha", email: "alpha@example.org" }
              as: AthleticDirector
              as_user_id: "${s_id}"
              captures: { c_a_id: $.data.id }
            - call: "POST /coaches"
              payload: { school_id: "${s_id}", full_name: "Coach Bravo", email: "bravo@example.org" }
              as: AthleticDirector
              as_user_id: "${s_id}"
              captures: { c_b_id: $.data.id }
            - call: "POST /titles"
              payload: { name: "Rocket Arena", publisher: "Nova Interactive", age_rating: "T", min_player_age: 13, server_pool_id: "POOL-SHARED", server_pool_capacity: 2, match_duration_minutes: 60 }
              as: LeagueAdmin
              captures: { t_id: $.data.id }
            - call: "POST /seasons"
              payload: { title_id: "${t_id}", name: "Fall 2026 Varsity" }
              as: LeagueAdmin
              captures: { se_id: $.data.id }
            - call: "POST /teams"
              payload: { season_id: "${se_id}", school_id: "${s_id}", title_id: "${t_id}", coach_id: "${c_a_id}", name: "Alpha" }
              as: Coach
              as_user_id: "${c_a_id}"
              captures: { tm_a_id: $.data.id }
            - call: "POST /teams"
              payload: { season_id: "${se_id}", school_id: "${s_id}", title_id: "${t_id}", coach_id: "${c_b_id}", name: "Bravo" }
              as: Coach
              as_user_id: "${c_b_id}"
              captures: { tm_b_id: $.data.id }
            - call: "POST /matches"
              payload: { season_id: "${se_id}", home_team_id: "${tm_a_id}", away_team_id: "${tm_b_id}", scheduled_start_at: "2026-09-25T18:00:00.000Z" }
              as: LeagueAdmin
              captures: { m1_id: $.data.id }
            - call: "POST /matches"
              payload: { season_id: "${se_id}", home_team_id: "${tm_b_id}", away_team_id: "${tm_a_id}", scheduled_start_at: "2026-09-25T18:30:00.000Z" }
              as: LeagueAdmin
              captures: { m2_id: $.data.id }
          trigger:
            - call: "POST /matches"
              payload: { season_id: "${se_id}", home_team_id: "${tm_a_id}", away_team_id: "${tm_b_id}", scheduled_start_at: "2026-09-25T18:45:00.000Z" }
              as: LeagueAdmin
            - call: "POST /matches"
              payload: { season_id: "${se_id}", home_team_id: "${tm_b_id}", away_team_id: "${tm_a_id}", scheduled_start_at: "2026-09-25T19:00:00.000Z" }
              as: LeagueAdmin
              captures: { m4_id: $.data.id }
          assert:
            - "setup: Match.${m1_id}.scheduled_end_at == 2026-09-25T19:00:00.000Z and Match.${m2_id}.scheduled_end_at == 2026-09-25T19:30:00.000Z, both with server_pool_id == POOL-SHARED and play_status SCHEDULED"
            - "the first trigger call returns 409 with data.error_id == ERR_SERVER_POOL_CAPACITY_EXCEEDED: at probe point 18:45 the occupancy would be 3 (candidate plus m1 plus m2) against capacity 2"
            - "no Match row is created by the rejected call: GET /matches?season_id=${se_id} still reports total_count 2 at that point"
            - "the second trigger call returns 201 with Match.${m4_id}.scheduled_end_at == 2026-09-25T20:00:00.000Z: m1 ends exactly at 19:00 and half-open adjacency is legal, so peak occupancy at 19:00 is 2 (candidate plus m2)"
            - "no peer start falls inside [19:00, 20:00), so 19:00 is the only probe point for the fourth match"
            - "GET /matches?season_id=${se_id} finally reports total_count 3"

      - name: broadcast_channel_closed_interval_with_buffer_makes_adjacency_illegal
        resource_entity: "School broadcast channel (Match.broadcast_school_id, a per-entity channel)"
        interval_semantics: "CLOSED [broadcast_start_at, broadcast_end_at] expanded by District.broadcast_buffer_minutes on both ends of the CANDIDATE only, adjacency ILLEGAL"
        grounds:
          - calculations.broadcast_channel_overlap
          - validations[priority=48]
          - errors[ERR_BROADCAST_CHANNEL_CONFLICT]
          - entities.School.fields.concurrent_broadcast_capacity
          - entities.District.fields.broadcast_buffer_minutes
          - state_machines.Match.broadcast_NONE_to_SCHEDULED
        distinguishing_aspect: |
          The opposite interval semantics on a different resource entity: a per-school channel
          with capacity 1, CLOSED intervals, and a 15-minute buffer applied to the candidate
          only. Adjacency is therefore ILLEGAL — a window starting exactly when the peer ends
          conflicts — and so does any gap up to and including 15 minutes, while a gap of 16
          minutes clears. Because the buffer expands only the candidate, the boundary sits at
          peer_end + buffer, not at peer_end + 2 * buffer.
        test_recipe:
          setup:
            - "District with the default broadcast_buffer_minutes 15; one school with the default concurrent_broadcast_capacity 1"
            - "Two coaches and two DRAFT teams; the title has server_pool_capacity 3 so match scheduling never collides on the pool"
            - "Two matches Alpha vs Bravo at 18:00 and 19:00; coach Alpha owns a participating team in both, so he may register either broadcast on his school's channel"
            - "The first broadcast is registered on [18:00, 19:00] and sits in broadcast_status SCHEDULED, holding the channel"
            - "Logical clock left at the 2026-08-01T00:00:00.000Z startup default"
