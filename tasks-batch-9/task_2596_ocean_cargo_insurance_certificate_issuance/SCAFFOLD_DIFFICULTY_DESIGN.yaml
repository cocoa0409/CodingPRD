  - rule_id: cross_entity_state_dependency
    instances:
      - name: certificate_issue_depends_on_open_policy_status
        entity_pair: "Certificate -> OpenPolicy"
        grounds:
          - state_machines.Certificate.status.DRAFT_to_ISSUED
          - state_machines.OpenPolicy.status.ACTIVE_to_SUSPENDED
          - state_machines.OpenPolicy.status.SUSPENDED_to_ACTIVE
          - validations.priority_8_ERR_POLICY_NOT_ACTIVE
        distinguishing_aspect: |
          A Certificate's DRAFT -> ISSUED transition is gated on its parent
          OpenPolicy sitting in ACTIVE. The gate is exercised in both
          directions on the SAME draft certificate: while the policy is
          SUSPENDED (pushed there by an audit whose variance_pct was 22.42, over
          the 10.0 suspension threshold) the issue is refused with
          ERR_POLICY_NOT_ACTIVE (409); after the assured re-submits a corrected
          declaration whose variance falls back inside tolerance the policy
          returns to ACTIVE and the identical issue call succeeds. Nothing about
          the certificate itself changed between the two attempts.
        test_recipe:
          setup:
            - "the canonical ACTIVE OpenPolicy with CERT-A ISSUED (total_premium_amount 6444.91) and CERT-J still DRAFT (created before the suspension, since creation is gated too)"
            - "declaration DEC-08 over [2026-08-01T00:00:00Z, 2026-09-01T00:00:00Z)"
          setup_api_calls:
            - call: "POST /ports"
              payload: { unlocode: "SGSIN", name: "Singapore", country_code: "SG", port_accumulation_limit_amount: 4000000, storage_free_days: 30, war_risk_tier: "GREEN" }
              as: Underwriter
