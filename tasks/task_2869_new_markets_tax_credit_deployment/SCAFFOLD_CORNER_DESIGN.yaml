              payload: { signatory_name: "A. Rivers" }
              as: CDESponsor
              as_user_id: "${cde_id}"
              captures: { award_v_signed: $.data.version }
            - call: "POST /nmtc/investment-funds"
              payload: { legal_name: "NMTC Fund A LLC", equity_contribution_cents: 65000000, leverage_lender_name: "Delta Bank", leverage_loan_principal_cents: 35000000, leverage_loan_rate_bps: 450 }
              as: TaxCreditInvestor
              as_user_id: "investor-delta"
              captures: { fund_a_id: $.data.id }
            - call: "POST /nmtc/investment-funds/${fund_a_id}/closing"
              payload: { equity_received_cents: 65000000, leverage_received_cents: 35000000 }
              as: TaxCreditInvestor
              as_user_id: "investor-delta"
            - call: "POST /nmtc/investment-funds"
              payload: { legal_name: "NMTC Fund B LLC", equity_contribution_cents: 65000000, leverage_lender_name: "Delta Bank", leverage_loan_principal_cents: 35000000, leverage_loan_rate_bps: 450 }
              as: TaxCreditInvestor
              as_user_id: "investor-delta"
              captures: { fund_b_id: $.data.id }
            - call: "POST /nmtc/investment-funds/${fund_b_id}/closing"
              payload: { equity_received_cents: 65000000, leverage_received_cents: 35000000 }
              as: TaxCreditInvestor
              as_user_id: "investor-delta"
          trigger:
            - call: "POST /nmtc/qeis"
              payload: { allocation_award_id: "${award_id}", investment_fund_id: "${fund_a_id}", qei_amount_cents: 100000000, expected_allocation_award_version: "${award_v_signed}" }
              as: CDESponsor
              as_user_id: "${cde_id}"
              captures: { qei_a_id: $.data.id }
            - call: "POST /nmtc/qeis"
              payload: { allocation_award_id: "${award_id}", investment_fund_id: "${fund_b_id}", qei_amount_cents: 100000000, expected_allocation_award_version: "${award_v_signed}" }
              as: CDESponsor
              as_user_id: "${cde_id}"
            - call: "GET /nmtc/allocation-awards/${award_id}"
              payload: {}
              as: CDESponsor
              as_user_id: "${cde_id}"
              captures: { award_v_fresh: $.data.version }
            - call: "POST /nmtc/qeis"
              payload: { allocation_award_id: "${award_id}", investment_fund_id: "${fund_b_id}", qei_amount_cents: 100000000, expected_allocation_award_version: "${award_v_fresh}" }
              as: CDESponsor
              as_user_id: "${cde_id}"
              captures: { qei_b_id: $.data.id }
          assert:
            - "The first issuance returns 201; AllocationAward.${award_id}.version == ${award_v_signed} + 1 and remaining_authority_cents == 4900000000"
            - "STALE — the second issuance carrying ${award_v_signed} returns HTTP 412 with error_id == \"ERR_STALE_AWARD_VERSION\", even though 100,000,000 is comfortably within the remaining 4,900,000,000 and fund B is FUNDED with 100,000,000 available"
            - "Nothing moved on the refusal: issued_qei_count == 1, remaining_authority_cents == 4900000000, version unchanged, and InvestmentFund.${fund_b_id}.status is still \"FUNDED\""
            - "FRESH — the re-read version ${award_v_fresh} makes the identical body succeed with 201"
            - "AllocationAward.${award_id}.issued_qei_count == 2, remaining_authority_cents == 4800000000, version == ${award_v_fresh} + 1"
