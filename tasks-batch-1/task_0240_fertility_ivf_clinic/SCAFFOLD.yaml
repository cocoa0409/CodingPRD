# =============================================================================
# Fertility / IVF Clinic — benchmark seed tables (Expert tier per §0.4)
# =============================================================================
# §1.0–§1.7 only. SCAFFOLD_DIFFICULTY_DESIGN.yaml (§1.8) and
# SCAFFOLD_CORNER_DESIGN.yaml (§1.9) live in sibling files.
# =============================================================================

scenario: |
  Fertility / IVF Clinic: cycle protocol (stim/retrieval/transfer), medication
  calendar, monitoring appointments, embryo/specimen cryo inventory, consent
  versioning, package/insurance billing, donor/surrogate linkage, outcome
  reporting

domain_name: fertility-ivf-clinic
api_prefix: /clinics/{clinicId}
# Note: top-level Clinic itself is created/read at /clinics and /clinics/{clinicId};
# every other entity is a flat collection one level under the clinic:
# /clinics/{clinicId}/<collection> (list + create), /clinics/{clinicId}/<collection>/{id}
# (single read), and /clinics/{clinicId}/<collection>/{id}/<action> (transitions).
# Cross-entity scoping (which cycle/patient/tank a child belongs to) is carried in
# request bodies and surfaced via filtered-list query params, not via deeper URL nesting.

# =============================================================================
# Complexity profile (§0.1–§0.4)
# =============================================================================
complexity_profile:
  primary_archetype: workflow_orchestration   # cycle protocol = configurable multi-step pipeline with branching + compensation
  secondary_archetype: ledger_reconciliation  # insurance-estimate vs final-settlement billing (forward-looking vs chronological)
  complexity_layers:
    - dual_variant_calculation                # provisional insurance estimate vs final settlement on the cycle ledger
    - cascading_side_effects                  # cycle cancellation cascades to medication orders, appointments, cryo holds, ledger
    - version_pinning_on_approval             # PatientConsent pins the ConsentForm.version at signing; stale form versions detected
    - temporal_windowing                      # monitoring appointments occupy clinic monitoring slots and cryo tank capacity windows
    - optimistic_concurrency                  # OCC on TreatmentCycle.version and CryoTank.version for supersede-style creates

  entity_topology: hybrid
  # Tree (Clinic -> Patient -> TreatmentCycle -> {MedicationOrder, MonitoringAppointment, CryoSpecimen, CycleInvoice, OutcomeReport})
  # with cross-cutting flat associations (ConsentForm<-PatientConsent, DonorProfile/SurrogateProfile linkage, CryoTank capacity, InsurancePackage pricing).

  state_machine_shape: parallel
  # TreatmentCycle carries TWO independent state axes that evolve separately:
  #   protocol_status (STIM -> RETRIEVAL -> FERTILIZATION -> TRANSFER/FREEZE_ALL) with revert + cancel,
  #   billing_status  (UNBILLED -> ESTIMATED -> SETTLED / WRITTEN_OFF).
  # Plus branching fork (FERTILIZATION -> {FRESH_TRANSFER, FREEZE_ALL}) with divergent side-effects,
  # and a cyclic monitoring loop (CONFIRMED -> RESCHEDULED -> CONFIRMED).

  relationship_patterns:
    - one_to_many        # Clinic->Patient, Patient->TreatmentCycle, Cycle->MedicationOrder/Appointment/CryoSpecimen
    - many_to_many       # PatientConsent links Patient <-> ConsentForm; cycle linkage to DonorProfile/SurrogateProfile
    - cross_aggregate    # CryoSpecimen reserves capacity on CryoTank (separate aggregate); CycleInvoice reads InsurancePackage

  role_model: peer_roles
  # ClinicAdmin (config: packages, consent forms, tanks, donor/surrogate),
  # Embryologist (cryo inventory + fertilization/lab transitions),
  # Nurse (cycle protocol, medication calendar, monitoring),
  # BillingSpecialist (insurance estimate + settlement),
  # Patient (entity_backed: signs consents, reads own cycle).

  consistency_model: immediate

# =============================================================================
# Table 1: Entity-Relationship Table (§1.1)
# =============================================================================
entities:
  - name: Clinic
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: name, type: string, source: input, description: "Clinic name" }
      - { name: timezone, type: string, source: input, required: false, default: "UTC", description: "IANA timezone label, informational only" }
      - { name: room_concurrency_limit, type: integer, source: input, required: false, default: 2, description: "Max aggregate room_capacity_weight of non-terminal monitoring appointments allowed at any instant (positive integer). Pins CLINIC_ROOM_CONCURRENCY used in the monitoring-overlap rule." }
      - { name: current_clock_utc, type: datetime, source: system, default: "1970-01-01T00:00:00.000Z", description: "Deterministic clock; advanced only via POST /_clock/set_current_utc. All temporal validations read this, never wall-clock." }

  - name: InsurancePackage
    parent: Clinic
    common_fields: true
    fields:
      - { name: clinic_id, type: string, source: system, description: "FK -> Clinic.id" }
      - { name: name, type: string, source: input, description: "Package name e.g. 'Single IVF Cycle'" }
      - { name: base_price_cents, type: integer, source: input, description: "List price of the cycle bundle in cents (non-negative)" }
      - { name: coverage_pct, type: number, source: input, description: "Insurance coverage fraction 0.00..1.00 applied to covered line items" }
      - { name: stim_med_covered, type: boolean, source: input, default: true, description: "Whether stimulation medication line items are insurance-covered" }
      - { name: cryo_storage_covered, type: boolean, source: input, default: false, description: "Whether annual cryo storage line items are insurance-covered" }
      - { name: annual_cryo_storage_cents, type: integer, source: input, default: 60000, description: "Annual cryo storage fee per specimen-year, in cents (non-negative)" }
      - { name: lifetime_coverage_cap_cents, type: integer, source: input, description: "Maximum cumulative insurer-paid amount across all cycles using this package (non-negative)" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE -> RETIRED; retired packages reject new cycle assignment", constraints: "ACTIVE | RETIRED" }

  - name: Patient
    parent: Clinic
    common_fields: true
    fields:
      - { name: clinic_id, type: string, source: system, description: "FK -> Clinic.id" }
      - { name: full_name, type: string, source: input, description: "Patient full name" }
      - { name: date_of_birth, type: datetime, source: input, description: "DOB as ISO date; used for age-based eligibility" }
      - { name: insurance_package_id, type: string, source: input, required: false, description: "FK -> InsurancePackage.id; the package this patient bills against" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE -> INACTIVE; INACTIVE rejects new cycle creation", constraints: "ACTIVE | INACTIVE" }

  - name: DonorProfile
    parent: Clinic
    common_fields: true
    fields:
      - { name: clinic_id, type: string, source: system, description: "FK -> Clinic.id" }
      - { name: code, type: string, source: input, description: "Anonymized donor code, unique within clinic" }
      - { name: donor_type, type: enum, source: input, description: "Gamete type donated", constraints: "EGG | SPERM" }
      - { name: status, type: enum, source: system, default: "AVAILABLE", description: "AVAILABLE -> RESERVED -> CONSUMED; RESERVED can release back to AVAILABLE on cycle cancel", constraints: "AVAILABLE | RESERVED | CONSUMED" }

  - name: SurrogateProfile
    parent: Clinic
    common_fields: true
    fields:
      - { name: clinic_id, type: string, source: system, description: "FK -> Clinic.id" }
      - { name: full_name, type: string, source: input, description: "Surrogate full name" }
      - { name: status, type: enum, source: system, default: "AVAILABLE", description: "AVAILABLE -> MATCHED (set when a TreatmentCycle is created linking this surrogate)", constraints: "AVAILABLE | MATCHED" }

  - name: ConsentForm
    parent: Clinic
    common_fields: true
    fields:
      - { name: clinic_id, type: string, source: system, description: "FK -> Clinic.id" }
      - { name: form_key, type: string, source: input, description: "Stable logical key e.g. 'IVF_GENERAL', 'CRYO_STORAGE', 'DONOR_GAMETE'. Multiple versions share a form_key." }
      - { name: version_label, type: string, source: input, description: "Human label for this version e.g. 'v2024.1'" }
      - { name: required_for, type: array, source: input, description: "List of protocol gates this form gates, members of {CYCLE_START, RETRIEVAL, TRANSFER, CRYO_STORE}" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT -> PUBLISHED -> SUPERSEDED; only PUBLISHED forms can be signed", constraints: "DRAFT | PUBLISHED | SUPERSEDED" }
      - { name: supersedes_form_id, type: string, source: input, required: false, description: "FK -> ConsentForm.id; the prior version this one replaces on publish" }

  - name: PatientConsent
    parent: Patient
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: system, description: "FK -> Patient.id" }
      - { name: consent_form_id, type: string, source: input, description: "FK -> ConsentForm.id; the form version signed" }
      - { name: pinned_form_version, type: integer, source: computed, description: "Snapshot of ConsentForm.version at signing time; used to detect stale signatures when the form is later superseded" }
      - { name: pinned_form_status_at_sign, type: enum, source: computed, description: "ConsentForm.status observed at signing (always PUBLISHED on success)", constraints: "PUBLISHED" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE -> REVOKED / STALE; STALE set when the signed form is SUPERSEDED", constraints: "ACTIVE | REVOKED | STALE" }
      - { name: signed_at, type: datetime, source: system, description: "Clinic.current_clock_utc at signing" }

  - name: CryoTank
    parent: Clinic
    common_fields: true
    fields:
      - { name: clinic_id, type: string, source: system, description: "FK -> Clinic.id" }
      - { name: label, type: string, source: input, description: "Physical tank label, unique within clinic" }
      - { name: capacity_slots, type: integer, source: input, description: "Total canister slots in this tank (positive integer)" }
      - { name: reserved_slots, type: integer, source: computed, default: 0, description: "Count of CryoSpecimen in STORED status currently occupying this tank (committed occupancy)" }
      - { name: committed_free_slots, type: integer, source: computed, description: "capacity_slots - reserved_slots (chronological free view; see calc tank_free_slots variant committed_free)" }
      - { name: projected_free_slots, type: integer, source: computed, description: "capacity_slots - count(STORED + PENDING specimens for this tank) (forward-looking free view; see calc tank_free_slots variant projected_free)" }
      - { name: status, type: enum, source: system, default: "ONLINE", description: "ONLINE -> MAINTENANCE; MAINTENANCE rejects new stores but keeps existing", constraints: "ONLINE | MAINTENANCE" }

  - name: TreatmentCycle
    parent: Patient
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: system, description: "FK -> Patient.id" }
      - { name: insurance_package_id, type: string, source: system, description: "FK -> InsurancePackage.id; snapshotted from Patient at creation" }
      - { name: donor_profile_id, type: string, source: input, required: false, description: "FK -> DonorProfile.id; optional donor gamete linkage" }
      - { name: surrogate_profile_id, type: string, source: input, required: false, description: "FK -> SurrogateProfile.id; optional gestational carrier linkage" }
      - { name: protocol_status, type: enum, source: system, default: "DRAFT", description: "Protocol axis. DRAFT -> STIM -> RETRIEVAL -> FERTILIZATION -> {FRESH_TRANSFER | FREEZE_ALL} -> COMPLETED; or CANCELLED", constraints: "DRAFT | STIM | RETRIEVAL | FERTILIZATION | FRESH_TRANSFER | FREEZE_ALL | COMPLETED | CANCELLED" }
      - { name: billing_status, type: enum, source: system, default: "UNBILLED", description: "Billing axis, evolves independently of protocol_status. UNBILLED -> ESTIMATED -> SETTLED / WRITTEN_OFF", constraints: "UNBILLED | ESTIMATED | SETTLED | WRITTEN_OFF" }
      - { name: oocytes_retrieved, type: integer, source: input, required: false, default: 0, description: "Count of oocytes retrieved, recorded at the RETRIEVAL transition" }
      - { name: embryos_fertilized, type: integer, source: input, required: false, default: 0, description: "Count of embryos fertilized, recorded at the FERTILIZATION transition" }
      - { name: estimated_patient_owed_cents, type: integer, source: computed, default: 0, description: "Provisional patient responsibility (forward-looking estimate). See calc cycle_cost_estimate." }
      - { name: final_patient_owed_cents, type: integer, source: computed, default: 0, description: "Final patient responsibility at settlement (chronological true-up). See calc cycle_cost_settlement." }
      - { name: insurer_paid_cents, type: integer, source: computed, default: 0, description: "Amount attributed to the insurer at settlement; conserved against patient-owed and gross charges." }
      - { name: gross_charge_cents, type: integer, source: computed, default: 0, description: "Total gross line-item charges accrued on this cycle's invoice at settlement." }
      - { name: cancellation_fee_cents, type: integer, source: computed, default: 0, description: "Fee charged on cancellation, tiered by protocol_status reached. See calc cancellation_fee." }

  - name: MedicationOrder
    parent: TreatmentCycle
    common_fields: true
    fields:
      - { name: treatment_cycle_id, type: string, source: system, description: "FK -> TreatmentCycle.id" }
      - { name: drug_name, type: string, source: input, description: "Medication name e.g. 'Gonal-F'" }
      - { name: start_day_offset, type: integer, source: input, description: "Day offset from cycle stim-start (inclusive, integer >= 0)" }
      - { name: end_day_offset, type: integer, source: input, description: "Day offset from cycle stim-start (inclusive, integer >= start_day_offset)" }
      - { name: daily_dose_units, type: integer, source: input, description: "Units per day (positive integer)" }
      - { name: unit_price_cents, type: integer, source: input, description: "Cost per unit in cents (non-negative)" }
      - { name: line_total_cents, type: integer, source: computed, description: "Per-order charge. See calc medication_line_total." }
      - { name: status, type: enum, source: system, default: "SCHEDULED", description: "SCHEDULED -> ADMINISTERED / CANCELLED", constraints: "SCHEDULED | ADMINISTERED | CANCELLED" }

  - name: MonitoringAppointment
    parent: TreatmentCycle
    common_fields: true
    fields:
      - { name: treatment_cycle_id, type: string, source: system, description: "FK -> TreatmentCycle.id" }
      - { name: clinic_id, type: string, source: system, description: "FK -> Clinic.id; appointment competes for clinic-wide monitoring-room capacity" }
      - { name: appointment_type, type: enum, source: input, description: "Kind of monitoring visit", constraints: "BLOODWORK | ULTRASOUND | CONSULT" }
      - { name: start_utc, type: datetime, source: input, description: "Half-open interval start [start_utc, end_utc); must be >= Clinic.current_clock_utc" }
      - { name: end_utc, type: datetime, source: input, description: "Half-open interval end; must be > start_utc" }
      - { name: room_capacity_weight, type: integer, source: input, default: 1, description: "Concurrent-capacity units this appointment consumes from the clinic monitoring-room pool (positive integer)" }
      - { name: status, type: enum, source: system, default: "CONFIRMED", description: "CONFIRMED -> RESCHEDULED -> CONFIRMED (cyclic) -> COMPLETED / NO_SHOW / CANCELLED", constraints: "CONFIRMED | RESCHEDULED | COMPLETED | NO_SHOW | CANCELLED" }

  - name: CryoSpecimen
    parent: TreatmentCycle
    common_fields: true
    fields:
      - { name: treatment_cycle_id, type: string, source: system, description: "FK -> TreatmentCycle.id" }
      - { name: cryo_tank_id, type: string, source: input, description: "FK -> CryoTank.id; the tank that holds this specimen" }
      - { name: specimen_type, type: enum, source: input, description: "What is frozen", constraints: "EMBRYO | OOCYTE | SPERM" }
      - { name: storage_start_utc, type: datetime, source: computed, description: "Clinic.current_clock_utc when first STORED; basis for storage-fee accrual" }
      - { name: storage_years_accrued, type: integer, source: computed, default: 0, description: "Whole storage-years billed so far (drives annual storage line items)" }
      - { name: status, type: enum, source: system, default: "PENDING", description: "PENDING -> STORED -> {THAWED | DISCARDED | TRANSFERRED_OUT}; STORED occupies a CryoTank slot", constraints: "PENDING | STORED | THAWED | DISCARDED | TRANSFERRED_OUT" }

  - name: CycleInvoice
    parent: TreatmentCycle
    common_fields: true
    fields:
      - { name: treatment_cycle_id, type: string, source: system, description: "FK -> TreatmentCycle.id" }
      - { name: line_items, type: array, source: computed, description: "Frozen snapshot of charge lines at settlement: each {category in {BASE,STIM_MED,CRYO_STORAGE,CANCELLATION}, gross_cents, covered, insurer_cents, patient_cents}" }
      - { name: gross_total_cents, type: integer, source: computed, default: 0, description: "Sum of all line gross_cents" }
      - { name: insurer_total_cents, type: integer, source: computed, default: 0, description: "Sum of all line insurer_cents (subject to lifetime cap)" }
      - { name: patient_total_cents, type: integer, source: computed, default: 0, description: "Sum of all line patient_cents = gross_total - insurer_total" }
      - { name: status, type: enum, source: system, description: "Created directly in a terminal billing state: ISSUED (by settle) or VOID (by write-off). No independent create endpoint, so DRAFT/PAID are not used.", constraints: "ISSUED | VOID" }

  - name: OutcomeReport
    parent: TreatmentCycle
    common_fields: true
    fields:
      - { name: treatment_cycle_id, type: string, source: system, description: "FK -> TreatmentCycle.id" }
      - { name: pregnancy_test_result, type: enum, source: input, description: "Beta-hCG outcome", constraints: "POSITIVE | NEGATIVE | INCONCLUSIVE" }
      - { name: clinical_pregnancy, type: boolean, source: input, default: false, description: "Whether a clinical pregnancy was confirmed by ultrasound" }
      - { name: live_birth, type: boolean, source: input, default: false, description: "Whether the cycle ended in a live birth" }
      - { name: utilization_rate, type: number, source: computed, description: "embryos_fertilized / oocytes_retrieved for the cycle; 0 when oocytes_retrieved == 0. See calc embryo_utilization_rate." }

# =============================================================================
# Table 2: State Machine Table (§1.2)
# =============================================================================
state_machines:
  # ---- TreatmentCycle PROTOCOL axis (branching + revert + cancel) ----
  - entity: TreatmentCycle
    initial_state: DRAFT
    terminal_states: [COMPLETED, CANCELLED]
    note: "protocol_status axis. Evolves independently from billing_status (parallel dimensions on one entity)."
    transitions:
      - from: DRAFT
        to: STIM
        trigger: "POST /clinics/{clinicId}/cycles/{cycleId}/start-stim"
        actor: Nurse
        preconditions:
          - "cycle.protocol_status == DRAFT (ERR_CYCLE_BAD_PROTOCOL_STATE)"
          - "Patient has an ACTIVE PatientConsent whose ConsentForm.required_for contains CYCLE_START (ERR_CONSENT_MISSING)"
          - "Patient.status == ACTIVE (ERR_PATIENT_INACTIVE)"
        side_effects:
          - "Set TreatmentCycle.protocol_status = STIM"
          - "Stamp cycle stim-start at Clinic.current_clock_utc (day offset 0 reference for medication calendar)"
      - from: STIM
        to: RETRIEVAL
        trigger: "POST /clinics/{clinicId}/cycles/{cycleId}/retrieve"
        actor: Nurse
        preconditions:
          - "cycle.protocol_status == STIM (ERR_CYCLE_BAD_PROTOCOL_STATE)"
          - "Patient has an ACTIVE PatientConsent whose ConsentForm.required_for contains RETRIEVAL (ERR_CONSENT_MISSING)"
          - "oocytes_retrieved in request is an integer >= 0 (ERR_VALIDATION)"
        side_effects:
          - "Set protocol_status = RETRIEVAL"
          - "Set oocytes_retrieved from request body"
      - from: RETRIEVAL
        to: FERTILIZATION
        trigger: "POST /clinics/{clinicId}/cycles/{cycleId}/fertilize"
        actor: Embryologist
        preconditions:
          - "cycle.protocol_status == RETRIEVAL (ERR_CYCLE_BAD_PROTOCOL_STATE)"
          - "embryos_fertilized in request is an integer with 0 <= embryos_fertilized <= oocytes_retrieved (ERR_EMBRYO_COUNT_EXCEEDS_OOCYTES)"
        side_effects:
          - "Set protocol_status = FERTILIZATION"
          - "Set embryos_fertilized from request body"
      - from: FERTILIZATION
        to: FRESH_TRANSFER
        trigger: "POST /clinics/{clinicId}/cycles/{cycleId}/transfer"
        actor: Embryologist
        preconditions:
          - "cycle.protocol_status == FERTILIZATION (ERR_CYCLE_BAD_PROTOCOL_STATE)"
          - "embryos_fertilized >= 1 (ERR_NO_EMBRYOS_AVAILABLE)"
          - "Patient has an ACTIVE PatientConsent whose ConsentForm.required_for contains TRANSFER (ERR_CONSENT_MISSING)"
        side_effects:
          - "Set protocol_status = FRESH_TRANSFER"
          - "Branch A (transfer): no cryo specimen auto-created"
        note: "Fork branch A. Divergent from FREEZE_ALL: consumes an embryo into transfer, no cryo store."
      - from: FERTILIZATION
        to: FREEZE_ALL
        trigger: "POST /clinics/{clinicId}/cycles/{cycleId}/freeze-all"
        actor: Embryologist
        preconditions:
          - "cycle.protocol_status == FERTILIZATION (ERR_CYCLE_BAD_PROTOCOL_STATE)"
          - "embryos_fertilized >= 1 (ERR_NO_EMBRYOS_AVAILABLE)"
        side_effects:
          - "Set protocol_status = FREEZE_ALL"
          - "Branch B (freeze): caller subsequently stores CryoSpecimen rows via POST .../cryo-specimens (no auto-create)"
        note: "Fork branch B. Divergent side-effect set from FRESH_TRANSFER."
      - from: FRESH_TRANSFER
        to: COMPLETED
        trigger: "POST /clinics/{clinicId}/cycles/{cycleId}/complete"
        actor: Nurse
        preconditions:
          - "cycle.protocol_status in {FRESH_TRANSFER, FREEZE_ALL} (ERR_CYCLE_BAD_PROTOCOL_STATE)"
          - "An OutcomeReport exists for this cycle (ERR_OUTCOME_REQUIRED)"
        side_effects:
          - "Set protocol_status = COMPLETED"
      - from: FREEZE_ALL
        to: COMPLETED
        trigger: "POST /clinics/{clinicId}/cycles/{cycleId}/complete"
        actor: Nurse
        preconditions:
          - "cycle.protocol_status in {FRESH_TRANSFER, FREEZE_ALL} (ERR_CYCLE_BAD_PROTOCOL_STATE)"
          - "An OutcomeReport exists for this cycle (ERR_OUTCOME_REQUIRED)"
        side_effects:
          - "Set protocol_status = COMPLETED"
      - from: RETRIEVAL
        to: STIM
        trigger: "POST /clinics/{clinicId}/cycles/{cycleId}/revert-to-stim"
        actor: Nurse
        preconditions:
          - "cycle.protocol_status == RETRIEVAL (ERR_CYCLE_BAD_PROTOCOL_STATE)"
        side_effects:
          - "Set protocol_status = STIM"
          - "Reset oocytes_retrieved = 0"
        note: "Revert edge (RETRIEVAL -> STIM): non-linear shape."
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /clinics/{clinicId}/cycles/{cycleId}/cancel"
        actor: Nurse
        preconditions:
          - "cycle.protocol_status not in {COMPLETED, CANCELLED} (ERR_CYCLE_BAD_PROTOCOL_STATE)"
          - "expected_cycle_version matches TreatmentCycle.version (ERR_STALE_CYCLE_VERSION)"
        side_effects:
          - "Set protocol_status = CANCELLED"
          - "Compute cancellation_fee_cents per calc cancellation_fee (tier by reached protocol_status)"
          - "CASCADE L1: every MedicationOrder of this cycle in SCHEDULED -> CANCELLED"
          - "CASCADE L1: every MonitoringAppointment in {CONFIRMED, RESCHEDULED} -> CANCELLED (frees its monitoring-room capacity window)"
          - "CASCADE L1: every CryoSpecimen in {PENDING, STORED} -> DISCARDED; each STORED->DISCARDED itself decrements CryoTank.reserved_slots by 1 (CASCADE L2); that reserved_slots change itself forces CryoTank.committed_free_slots and projected_free_slots to be recomputed (CASCADE L3)"
          - "increments TreatmentCycle.version by 1"
        note: "Cancel allowed from any non-terminal protocol state; DEPTH-3 cascade: cancel -> CryoSpecimen DISCARDED -> CryoTank.reserved_slots -- -> CryoTank derived free-slot fields recomputed. Each hop is caused by the prior hop, not by the cancel action directly."
      - from: STIM
        to: CANCELLED
        trigger: "POST /clinics/{clinicId}/cycles/{cycleId}/cancel"
        actor: Nurse
        preconditions:
          - "cycle.protocol_status not in {COMPLETED, CANCELLED} (ERR_CYCLE_BAD_PROTOCOL_STATE)"
          - "expected_cycle_version matches TreatmentCycle.version (ERR_STALE_CYCLE_VERSION)"
        side_effects:
          - "Set protocol_status = CANCELLED"
          - "Compute cancellation_fee_cents per calc cancellation_fee"
          - "CASCADE L1: SCHEDULED MedicationOrders -> CANCELLED"
          - "CASCADE L1: CONFIRMED/RESCHEDULED MonitoringAppointments -> CANCELLED"
          - "CASCADE L1: PENDING/STORED CryoSpecimen -> DISCARDED; STORED->DISCARDED decrements CryoTank.reserved_slots (CASCADE L2); reserved_slots change forces CryoTank.committed_free_slots/projected_free_slots recompute (CASCADE L3)"
          - "increments TreatmentCycle.version by 1"
      - from: RETRIEVAL
        to: CANCELLED
        trigger: "POST /clinics/{clinicId}/cycles/{cycleId}/cancel"
        actor: Nurse
        preconditions:
          - "cycle.protocol_status not in {COMPLETED, CANCELLED} (ERR_CYCLE_BAD_PROTOCOL_STATE)"
          - "expected_cycle_version matches TreatmentCycle.version (ERR_STALE_CYCLE_VERSION)"
        side_effects:
          - "Set protocol_status = CANCELLED"
          - "Compute cancellation_fee_cents per calc cancellation_fee"
          - "CASCADE L1: SCHEDULED MedicationOrders -> CANCELLED"
          - "CASCADE L1: CONFIRMED/RESCHEDULED MonitoringAppointments -> CANCELLED"
          - "CASCADE L1: PENDING/STORED CryoSpecimen -> DISCARDED; STORED->DISCARDED decrements CryoTank.reserved_slots (CASCADE L2); reserved_slots change forces CryoTank.committed_free_slots/projected_free_slots recompute (CASCADE L3)"
          - "increments TreatmentCycle.version by 1"
      - from: FERTILIZATION
        to: CANCELLED
        trigger: "POST /clinics/{clinicId}/cycles/{cycleId}/cancel"
        actor: Nurse
        preconditions:
          - "cycle.protocol_status not in {COMPLETED, CANCELLED} (ERR_CYCLE_BAD_PROTOCOL_STATE)"
          - "expected_cycle_version matches TreatmentCycle.version (ERR_STALE_CYCLE_VERSION)"
        side_effects:
          - "Set protocol_status = CANCELLED"
          - "Compute cancellation_fee_cents per calc cancellation_fee"
          - "CASCADE L1: SCHEDULED MedicationOrders -> CANCELLED"
          - "CASCADE L1: CONFIRMED/RESCHEDULED MonitoringAppointments -> CANCELLED"
          - "CASCADE L1: PENDING/STORED CryoSpecimen -> DISCARDED; STORED->DISCARDED decrements CryoTank.reserved_slots (CASCADE L2); reserved_slots change forces CryoTank.committed_free_slots/projected_free_slots recompute (CASCADE L3)"
          - "increments TreatmentCycle.version by 1"

  # ---- TreatmentCycle BILLING axis (parallel, independent of protocol) ----
  - entity: TreatmentCycle
    initial_state: UNBILLED
    terminal_states: [SETTLED, WRITTEN_OFF]
    note: "billing_status axis on the SAME TreatmentCycle row, evolving independently of protocol_status (parallel dimensions)."
    transitions:
      - from: UNBILLED
        to: ESTIMATED
        trigger: "POST /clinics/{clinicId}/cycles/{cycleId}/billing/estimate"
        actor: BillingSpecialist
        preconditions:
          - "cycle.billing_status == UNBILLED (ERR_BILLING_BAD_STATE)"
          - "cycle.protocol_status in {STIM, RETRIEVAL, FERTILIZATION, FRESH_TRANSFER, FREEZE_ALL} (ERR_CYCLE_BAD_PROTOCOL_STATE)"
        side_effects:
          - "Compute estimated_patient_owed_cents per calc cycle_cost_estimate (forward-looking, SCHEDULED+ADMINISTERED meds)"
          - "Set billing_status = ESTIMATED"
      - from: ESTIMATED
        to: SETTLED
        trigger: "POST /clinics/{clinicId}/cycles/{cycleId}/billing/settle"
        actor: BillingSpecialist
        preconditions:
          - "cycle.billing_status == ESTIMATED (ERR_BILLING_BAD_STATE)"
          - "cycle.protocol_status in {COMPLETED, CANCELLED} (ERR_CYCLE_NOT_FINALIZED)"
          - "expected_cycle_version matches TreatmentCycle.version (ERR_STALE_CYCLE_VERSION)"
        side_effects:
          - "Compute final_patient_owed_cents, insurer_paid_cents, gross_charge_cents per calc cycle_cost_settlement (chronological, ADMINISTERED meds + STORED-specimen storage + cancellation fee)"
          - "Create CycleInvoice (status ISSUED) with frozen line_items snapshot"
          - "Set billing_status = SETTLED"
          - "Invariant billing_conservation MUST hold: gross_charge_cents == insurer_paid_cents + final_patient_owed_cents"
          - "increments TreatmentCycle.version by 1"
      - from: ESTIMATED
        to: WRITTEN_OFF
        trigger: "POST /clinics/{clinicId}/cycles/{cycleId}/billing/write-off"
        actor: BillingSpecialist
        preconditions:
          - "cycle.billing_status == ESTIMATED (ERR_BILLING_BAD_STATE)"
          - "cycle.protocol_status == CANCELLED (ERR_CYCLE_NOT_FINALIZED)"
        side_effects:
          - "Set final_patient_owed_cents = cancellation_fee_cents (only the cancellation fee survives a write-off; medication/storage charges forgiven)"
          - "Set insurer_paid_cents = 0, gross_charge_cents = cancellation_fee_cents"
          - "Create CycleInvoice (status VOID) capturing the written-off lines"
          - "Set billing_status = WRITTEN_OFF"
        note: "Compensating path: write-off conserves the cancellation-fee quantity (see invariant writeoff_fee_conservation)."

  # ---- ConsentForm publishing (cross-entity supersede; version-pinning) ----
  - entity: ConsentForm
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /clinics/{clinicId}/consent-forms/{formId}/publish"
        actor: ClinicAdmin
        preconditions:
          - "form.status == DRAFT (ERR_CONSENT_FORM_BAD_STATE)"
          - "If supersedes_form_id set, that form exists and is PUBLISHED (ERR_SUPERSEDE_TARGET_NOT_PUBLISHED)"
        side_effects:
          - "Set form.status = PUBLISHED"
          - "If supersedes_form_id set: that target ConsentForm -> SUPERSEDED (CASCADE L1)"
          - "Each ACTIVE PatientConsent pinned to the now-SUPERSEDED target -> STALE (CASCADE L2)"
        note: "Depth-2 cascade: publish -> target SUPERSEDED -> dependent PatientConsent STALE. Distinct trigger from cycle cancel."
      - from: PUBLISHED
        to: SUPERSEDED
        trigger: "system (set when a newer ConsentForm publishes with supersedes_form_id == this form)"
        actor: system
        preconditions:
          - "form.status == PUBLISHED"
        side_effects:
          - "Each ACTIVE PatientConsent whose consent_form_id == this form -> STALE"

  # ---- PatientConsent lifecycle ----
  - entity: PatientConsent
    initial_state: ACTIVE
    terminal_states: [REVOKED, STALE]
    transitions:
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /clinics/{clinicId}/patient-consents/{consentId}/revoke"
        actor: Patient
        preconditions:
          - "consent.status == ACTIVE (ERR_CONSENT_BAD_STATE)"
        side_effects:
          - "Set consent.status = REVOKED"
      - from: ACTIVE
        to: STALE
        trigger: "system (set when signed ConsentForm becomes SUPERSEDED)"
        actor: system
        preconditions:
          - "consent.status == ACTIVE"
        side_effects:
          - "Set consent.status = STALE"

  # ---- MonitoringAppointment (cyclic CONFIRMED<->RESCHEDULED) ----
  - entity: MonitoringAppointment
    initial_state: CONFIRMED
    terminal_states: [COMPLETED, NO_SHOW, CANCELLED]
    transitions:
      - from: CONFIRMED
        to: RESCHEDULED
        trigger: "POST /clinics/{clinicId}/monitoring-appointments/{apptId}/reschedule"
        actor: Nurse
        preconditions:
          - "appt.status in {CONFIRMED, RESCHEDULED} (ERR_APPT_BAD_STATE)"
          - "New [start_utc,end_utc) does not overlap (half-open) other non-terminal appointments in the same clinic such that aggregate room_capacity_weight at any instant exceeds Clinic.room_concurrency_limit (ERR_MONITORING_SLOT_CONFLICT); the appointment being rescheduled is excluded from its own conflict set"
          - "start_utc >= Clinic.current_clock_utc (ERR_APPOINTMENT_IN_PAST)"
        side_effects:
          - "Update start_utc/end_utc; set status = RESCHEDULED"
        note: "Cyclic edge; can return to CONFIRMED via confirm."
      - from: RESCHEDULED
        to: CONFIRMED
        trigger: "POST /clinics/{clinicId}/monitoring-appointments/{apptId}/confirm"
        actor: Nurse
        preconditions:
          - "appt.status == RESCHEDULED (ERR_APPT_BAD_STATE)"
        side_effects:
          - "Set status = CONFIRMED"
      - from: CONFIRMED
        to: COMPLETED
        trigger: "POST /clinics/{clinicId}/monitoring-appointments/{apptId}/complete"
        actor: Nurse
        preconditions:
          - "appt.status in {CONFIRMED, RESCHEDULED} (ERR_APPT_BAD_STATE)"
          - "Clinic.current_clock_utc >= appt.start_utc (ERR_APPOINTMENT_NOT_STARTED)"
        side_effects:
          - "Set status = COMPLETED (frees room-capacity window)"
      - from: CONFIRMED
        to: NO_SHOW
        trigger: "POST /clinics/{clinicId}/monitoring-appointments/{apptId}/no-show"
        actor: Nurse
        preconditions:
          - "appt.status in {CONFIRMED, RESCHEDULED} (ERR_APPT_BAD_STATE)"
          - "Clinic.current_clock_utc >= appt.end_utc (ERR_APPOINTMENT_NOT_ENDED)"
        side_effects:
          - "Set status = NO_SHOW (frees room-capacity window)"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /clinics/{clinicId}/monitoring-appointments/{apptId}/cancel"
        actor: Nurse
        preconditions:
          - "appt.status in {CONFIRMED, RESCHEDULED} (ERR_APPT_BAD_STATE)"
        side_effects:
          - "Set status = CANCELLED (frees room-capacity window)"

  # ---- CryoSpecimen (store occupies tank slot; cross-aggregate) ----
  - entity: CryoSpecimen
    initial_state: PENDING
    terminal_states: [THAWED, DISCARDED, TRANSFERRED_OUT]
    transitions:
      - from: PENDING
        to: STORED
        trigger: "POST /clinics/{clinicId}/cryo-specimens/{specimenId}/store"
        actor: Embryologist
        preconditions:
          - "specimen.status == PENDING (ERR_SPECIMEN_BAD_STATE)"
          - "cycle.protocol_status in {FERTILIZATION, FREEZE_ALL} (ERR_CYCLE_BAD_PROTOCOL_STATE)"
          - "CryoTank.status == ONLINE (ERR_TANK_OFFLINE)"
          - "CryoTank.reserved_slots + 1 <= CryoTank.capacity_slots (ERR_TANK_AT_CAPACITY)"
          - "expected_tank_version matches CryoTank.version (ERR_STALE_TANK_VERSION)"
        side_effects:
          - "Set specimen.status = STORED"
          - "Stamp storage_start_utc = Clinic.current_clock_utc, storage_years_accrued = 0"
          - "CryoTank.reserved_slots += 1 (cross-aggregate)"
          - "increments CryoTank.version by 1"
        note: "Cross-aggregate capacity reservation on CryoTank; guarded by tank state + OCC."
      - from: STORED
        to: THAWED
        trigger: "POST /clinics/{clinicId}/cryo-specimens/{specimenId}/thaw"
        actor: Embryologist
        preconditions:
          - "specimen.status == STORED (ERR_SPECIMEN_BAD_STATE)"
        side_effects:
          - "Set specimen.status = THAWED"
          - "CryoTank.reserved_slots -= 1 (compensating release)"
          - "increments CryoTank.version by 1"
        note: "Compensating release of the slot reserved on store (invariant tank_slot_conservation)."
      - from: STORED
        to: DISCARDED
        trigger: "POST /clinics/{clinicId}/cryo-specimens/{specimenId}/discard"
        actor: Embryologist
        preconditions:
          - "specimen.status in {PENDING, STORED} (ERR_SPECIMEN_BAD_STATE)"
        side_effects:
          - "Set specimen.status = DISCARDED"
          - "If was STORED: CryoTank.reserved_slots -= 1 and increments CryoTank.version by 1"
      - from: PENDING
        to: DISCARDED
        trigger: "POST /clinics/{clinicId}/cryo-specimens/{specimenId}/discard"
        actor: Embryologist
        preconditions:
          - "specimen.status in {PENDING, STORED} (ERR_SPECIMEN_BAD_STATE)"
        side_effects:
          - "Set specimen.status = DISCARDED"
      - from: STORED
        to: TRANSFERRED_OUT
        trigger: "POST /clinics/{clinicId}/cryo-specimens/{specimenId}/transfer-out"
        actor: Embryologist
        preconditions:
          - "specimen.status == STORED (ERR_SPECIMEN_BAD_STATE)"
        side_effects:
          - "Set specimen.status = TRANSFERRED_OUT"
          - "CryoTank.reserved_slots -= 1 (compensating release)"
          - "increments CryoTank.version by 1"

  # ---- DonorProfile reservation lifecycle (cross-entity with cycle) ----
  - entity: DonorProfile
    initial_state: AVAILABLE
    terminal_states: [CONSUMED]
    transitions:
      - from: AVAILABLE
        to: RESERVED
        trigger: "system (set when a TreatmentCycle is created with donor_profile_id referencing this donor)"
        actor: system
        preconditions:
          - "donor.status == AVAILABLE (ERR_DONOR_NOT_AVAILABLE)"
        side_effects:
          - "Set donor.status = RESERVED"
      - from: RESERVED
        to: CONSUMED
        trigger: "system (set when the linked cycle reaches FERTILIZATION)"
        actor: system
        preconditions:
          - "donor.status == RESERVED"
        side_effects:
          - "Set donor.status = CONSUMED"
      - from: RESERVED
        to: AVAILABLE
        trigger: "system (set when the linked cycle is CANCELLED before FERTILIZATION)"
        actor: system
        preconditions:
          - "donor.status == RESERVED"
        side_effects:
          - "Set donor.status = AVAILABLE (released back to pool)"

  # ---- MedicationOrder lifecycle (linear; also a cycle-cancel cascade target) ----
  - entity: MedicationOrder
    initial_state: SCHEDULED
    terminal_states: [ADMINISTERED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: ADMINISTERED
        trigger: "POST /clinics/{clinicId}/medications/{medId}/administer"
        actor: Nurse
        preconditions:
          - "order.status == SCHEDULED (ERR_MED_BAD_STATE)"
        side_effects:
          - "Set order.status = ADMINISTERED (now included in chronological settlement med set)"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /clinics/{clinicId}/medications/{medId}/cancel"
        actor: Nurse
        preconditions:
          - "order.status == SCHEDULED (ERR_MED_BAD_STATE)"
        side_effects:
          - "Set order.status = CANCELLED (excluded from settlement med set; still in estimate set if estimate ran earlier)"

# =============================================================================
# Concurrency Rules (§1.2.1) — true CREATE-with-supersede races only, OCC-resolved
# =============================================================================
concurrency_rules:
  - rule_id: specimen-store-stale-tank
    parent_entity: CryoTank
    write_endpoint: "POST /clinics/{clinicId}/cryo-specimens/{specimenId}/store"
    occ_field: "expected_tank_version"
    description: |
      Storing a CryoSpecimen into a CryoTank whose version has advanced since the
      client last observed it is rejected. This captures the case where another
      writer has already stored a specimen into that tank (legitimately consuming
      a slot and advancing the tank's version), so the current writer's view of
      remaining capacity is stale. The store reads a tank slot that may no longer
      be free.
    error_id: ERR_STALE_TANK_VERSION
    http_status: 412
  - rule_id: cycle-settle-stale-cycle
    parent_entity: TreatmentCycle
    write_endpoint: "POST /clinics/{clinicId}/cycles/{cycleId}/billing/settle"
    occ_field: "expected_cycle_version"
    description: |
      Settling a TreatmentCycle whose version has advanced since the client last
      observed it is rejected. This captures the case where a cancellation (which
      legitimately recomputes cancellation_fee_cents and cascades, advancing the
      cycle version) has landed between the client's read and the settle call, so
      the settlement would be computed against a stale charge basis.
    error_id: ERR_STALE_CYCLE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table (§1.3)
# =============================================================================
calculations:
  - name: medication_line_total
    trigger: "MedicationOrder creation (POST .../medications)"
    algorithm: aggregation
    formula: |
      days = (end_day_offset - start_day_offset) + 1     # inclusive both ends
      line_total_cents = days * daily_dose_units * unit_price_cents
    input_set: "Single MedicationOrder's own fields; computed once at creation, frozen thereafter."
    constants: {}
    precision: "integer cents (all inputs integer; product is exact)"

  - name: cycle_cost_estimate
    trigger: "billing UNBILLED -> ESTIMATED (POST .../billing/estimate)"
    algorithm: forward_looking
    formula: |
      # FORWARD-LOOKING: includes scheduled-but-not-yet-administered medication.
      package = InsurancePackage snapshot on the cycle
      base = package.base_price_cents
      # Medication inclusion set: orders in {SCHEDULED, ADMINISTERED} (projected to be given).
      stim_med_gross = sum(line_total_cents for MedicationOrder where status in {SCHEDULED, ADMINISTERED})
      # Cryo storage estimate: assume EACH currently PENDING-or-STORED specimen incurs exactly ONE year.
      cryo_count = count(CryoSpecimen where status in {PENDING, STORED})
      cryo_gross = cryo_count * package.annual_cryo_storage_cents
      gross = base + stim_med_gross + cryo_gross
      # Coverage: base always covered; stim med covered iff package.stim_med_covered; cryo covered iff package.cryo_storage_covered.
      covered_gross = base
                    + (stim_med_gross if package.stim_med_covered else 0)
                    + (cryo_gross    if package.cryo_storage_covered else 0)
      insurer_est = round_half_up(covered_gross * package.coverage_pct)   # NOT yet capped at estimate stage
      estimated_patient_owed_cents = gross - insurer_est
    input_set: "MedicationOrders in {SCHEDULED, ADMINISTERED}; CryoSpecimen in {PENDING, STORED}; package snapshot."
    constants: {}
    precision: "round_half_up to integer cents; coverage multiplication rounded once on covered_gross total (SUM-then-round, NOT per-line)."
    variants:
      - name: estimate
        when: "at ESTIMATED transition"
        difference: "Forward-looking inclusion set (SCHEDULED meds projected as given; 1 storage-year per specimen); insurer amount NOT capped by lifetime_coverage_cap."

  - name: cycle_cost_settlement
    trigger: "billing ESTIMATED -> SETTLED (POST .../billing/settle)"
    algorithm: chronological
    formula: |
      # CHRONOLOGICAL TRUE-UP: bills only what actually happened.
      package = InsurancePackage snapshot on the cycle
      base = package.base_price_cents
      # Medication inclusion set: ONLY orders actually ADMINISTERED (SCHEDULED/CANCELLED excluded).
      stim_med_gross = sum(line_total_cents for MedicationOrder where status == ADMINISTERED)
      # Cryo storage: bill storage_years_accrued for specimens that ever reached STORED
      #   (status in {STORED, THAWED, TRANSFERRED_OUT, DISCARDED-after-store}); PENDING never stored = 0.
      cryo_gross = sum(specimen.storage_years_accrued * package.annual_cryo_storage_cents
                       for CryoSpecimen where storage_start_utc is set)
      cancellation = cycle.cancellation_fee_cents     # 0 unless protocol_status == CANCELLED
      gross_charge_cents = base + stim_med_gross + cryo_gross + cancellation
      covered_gross = base
                    + (stim_med_gross if package.stim_med_covered else 0)
                    + (cryo_gross    if package.cryo_storage_covered else 0)
      # cancellation fee is NEVER insurance-covered.
      insurer_raw = round_half_up(covered_gross * package.coverage_pct)
      # Lifetime cap: insurer cannot exceed remaining headroom under the package cap.
      prior_insurer_paid = sum(insurer_paid_cents over OTHER cycles on the same package already SETTLED)
      headroom = max(0, package.lifetime_coverage_cap_cents - prior_insurer_paid)
      insurer_paid_cents = min(insurer_raw, headroom)
      final_patient_owed_cents = gross_charge_cents - insurer_paid_cents
    input_set: "MedicationOrders status==ADMINISTERED; CryoSpecimen with storage_start_utc set; cancellation_fee; prior SETTLED cycles on same package for the cap."
    constants: {}
    precision: "round_half_up to integer cents; SUM-then-round on covered_gross; cap applied AFTER rounding."
    variants:
      - name: settlement
        when: "at SETTLED transition"
        difference: "Chronological inclusion set (only ADMINISTERED meds; actual storage_years_accrued); insurer amount CAPPED by lifetime_coverage_cap minus prior settled insurer payments. Diverges from the estimate whenever scheduled meds were not administered, storage years differ from 1, or the lifetime cap binds."

  - name: cancellation_fee
    trigger: "any cycle CANCELLED transition (side effect)"
    algorithm: threshold
    formula: |
      # Tiered by the FURTHEST protocol stage reached before cancellation.
      reached = cycle.protocol_status at the moment of cancel (the from-state)
      if reached == DRAFT:                         fee = 0
      elif reached == STIM:                        fee = DRAFT_TO_STIM_FEE_CENTS          # 50000
      elif reached == RETRIEVAL:                   fee = RETRIEVAL_FEE_CENTS              # 150000
      elif reached in {FERTILIZATION}:             fee = FERTILIZATION_FEE_CENTS          # 250000
      cancellation_fee_cents = fee
    input_set: "cycle.protocol_status (from-state of the cancel transition)."
    constants:
      DRAFT_TO_STIM_FEE_CENTS: 50000
      RETRIEVAL_FEE_CENTS: 150000
      FERTILIZATION_FEE_CENTS: 250000
    precision: "integer cents; exact thresholds on enum stage (no numeric rounding)."

  - name: embryo_utilization_rate
    trigger: "OutcomeReport creation (POST .../outcome); recomputed if cycle counts change"
    algorithm: aggregation
    formula: |
      if cycle.oocytes_retrieved == 0:
        utilization_rate = 0.0
      else:
        utilization_rate = round_half_up(cycle.embryos_fertilized / cycle.oocytes_retrieved, 4)
    input_set: "cycle.embryos_fertilized, cycle.oocytes_retrieved (zero-denominator boundary)."
    constants: {}
    precision: "4 decimal places, round_half_up; zero-denominator yields exactly 0.0."

  - name: tank_occupancy
    trigger: "CryoSpecimen store / thaw / discard / transfer-out; cycle cancel cascade"
    algorithm: aggregation
    formula: |
      reserved_slots = count(CryoSpecimen where cryo_tank_id == tank.id AND status == STORED)
    input_set: "CryoSpecimen rows pointing at this tank with status == STORED."
    constants: {}
    precision: "integer count; recomputed incrementally on each store(+1)/release(-1) and reconciled to the count filter."

  - name: tank_free_slots
    trigger: "GET tank availability projection (read of CryoTank.reserved_slots vs capacity); dual-variant capacity view"
    algorithm: forward_looking
    formula: |
      # DUAL-VARIANT capacity on a different entity domain (CryoTank) from the
      # cycle-cost dual-variant. Two valid free-slot readings of the SAME tank:
      committed_free = tank.capacity_slots - count(CryoSpecimen where cryo_tank_id == tank.id AND status == STORED)
      projected_free = tank.capacity_slots - count(CryoSpecimen where cryo_tank_id == tank.id AND status in {PENDING, STORED})
      # committed_free (chronological) counts only slots already occupied;
      # projected_free (forward-looking) also reserves a slot for every PENDING
      # specimen earmarked for this tank. They diverge whenever any PENDING
      # specimen names this tank.
    input_set: "CryoSpecimen rows pointing at this tank; STORED for committed view, PENDING+STORED for projected view."
    constants: {}
    precision: "integer slot counts; no rounding."
    variants:
      - name: committed_free
        when: "store-time capacity gate (POST .../cryo-specimens/{id}/store): uses tank.reserved_slots = STORED count only"
        difference: "Counts only STORED specimens; a PENDING specimen does NOT hold a slot, so a store can succeed even when projected_free is 0."
      - name: projected_free
        when: "planning/availability read: reserves a slot per PENDING specimen"
        difference: "Forward-looking; subtracts PENDING+STORED. Diverges from committed_free by the count of PENDING specimens naming this tank."

# =============================================================================
# Table 4: Validation Rules Table (§1.4) — ordered by priority
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and well-formed"
    error_id: ERR_MISSING_AUTH_CONTEXT
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "X-User-Role is permitted to perform this operation per §1.7 RBAC"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "All path-referenced resources exist (validated left-to-right: clinic, then patient/cycle/etc.)"
    error_id: "ERR_*_NOT_FOUND (clinic/patient/cycle/appointment/specimen/tank/consent-form/package/donor/surrogate/invoice/outcome)"
    http_status: 404
    applies_to: "all resource endpoints"

  - priority: 4
    category: existence
    check: "FK fields in the request body reference existing in-clinic resources (insurance_package_id, donor_profile_id, surrogate_profile_id, consent_form_id, cryo_tank_id)"
    error_id: "ERR_*_NOT_FOUND"
    http_status: 404
    applies_to: "POST/PUT endpoints carrying body FKs"

  - priority: 5
    category: business_constraint
    check: "Required body fields present and well-typed; enum members valid; integer domains (>=0 or >0) respected"
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: "all mutation endpoints"

  - priority: 6
    category: state
    check: "OCC: when expected_cycle_version / expected_tank_version supplied, it equals the parent's current version BEFORE business logic runs"
    error_id: "ERR_STALE_CYCLE_VERSION / ERR_STALE_TANK_VERSION"
    http_status: 412
    applies_to: "POST .../cancel, POST .../billing/settle, POST .../cryo-specimens/{id}/store"

  - priority: 7
    category: state
    check: "Target resource is in a state from which the requested transition is defined (§1.2)"
    error_id: "ERR_CYCLE_BAD_PROTOCOL_STATE / ERR_BILLING_BAD_STATE / ERR_APPT_BAD_STATE / ERR_SPECIMEN_BAD_STATE / ERR_MED_BAD_STATE / ERR_CONSENT_BAD_STATE / ERR_CONSENT_FORM_BAD_STATE"
    http_status: 409
    applies_to: "all transition endpoints"

  - priority: 8
    category: business_referential
    check: "Cross-entity precondition: linked Patient.status == ACTIVE for cycle start; linked DonorProfile.status == AVAILABLE at cycle creation; supersede target is PUBLISHED at publish"
    error_id: "ERR_PATIENT_INACTIVE / ERR_DONOR_NOT_AVAILABLE / ERR_SUPERSEDE_TARGET_NOT_PUBLISHED"
    http_status: 409
    applies_to: "POST .../cycles, POST .../start-stim, POST .../consent-forms/{id}/publish"

  - priority: 9
    category: business_safety
    check: "Consent gate: the patient holds an ACTIVE PatientConsent whose PUBLISHED ConsentForm.required_for contains the gate for this transition (CYCLE_START / RETRIEVAL / TRANSFER / CRYO_STORE)"
    error_id: ERR_CONSENT_MISSING
    http_status: 409
    applies_to: "POST .../start-stim, .../retrieve, .../transfer, .../specimens/{id}/store"

  - priority: 10
    category: business_safety
    check: "Sign only a PUBLISHED, non-STALE consent form; signing a DRAFT or SUPERSEDED form is rejected"
    error_id: ERR_CONSENT_FORM_NOT_PUBLISHED
    http_status: 409
    applies_to: "POST .../patients/{id}/consents"

  - priority: 11
    category: business_constraint
    check: "embryos_fertilized must be <= oocytes_retrieved at FERTILIZATION"
    error_id: ERR_EMBRYO_COUNT_EXCEEDS_OOCYTES
    http_status: 422
    applies_to: "POST .../fertilize"

  - priority: 12
    category: business_constraint
    check: "Transfer/freeze require embryos_fertilized >= 1"
    error_id: ERR_NO_EMBRYOS_AVAILABLE
    http_status: 409
    applies_to: "POST .../transfer, POST .../freeze-all"

  - priority: 13
    category: business_temporal
    check: "MonitoringAppointment interval is valid: end_utc > start_utc and start_utc >= Clinic.current_clock_utc"
    error_id: ERR_APPOINTMENT_IN_PAST
    http_status: 422
    applies_to: "POST .../monitoring-appointments, POST .../monitoring-appointments/{id}/reschedule"

  - priority: 14
    category: business_temporal
    check: "Monitoring-room overlap: half-open interval [start_utc,end_utc) must not push instantaneous aggregate room_capacity_weight of non-terminal (CONFIRMED/RESCHEDULED) clinic appointments above Clinic.room_concurrency_limit. Adjacency at the half-open boundary (prev.end_utc == new.start_utc) does NOT overlap."
    error_id: ERR_MONITORING_SLOT_CONFLICT
    http_status: 409
    applies_to: "POST .../monitoring-appointments, POST .../monitoring-appointments/{id}/reschedule"

  - priority: 14.5
    category: business_temporal
    check: "Medication-calendar overlap: a new MedicationOrder for the SAME drug_name on the same cycle must not have a CLOSED inclusive day-offset interval [start_day_offset, end_day_offset] that intersects any existing SCHEDULED/ADMINISTERED order of that drug on the cycle. Closed-interval semantics: adjacency where prev.end_day_offset + 1 == new.start_day_offset is allowed (no overlap); equal endpoints overlap."
    error_id: ERR_MEDICATION_SCHEDULE_OVERLAP
    http_status: 409
    applies_to: "POST .../medications"

  - priority: 15
    category: business_constraint
    check: "Cryo store: tank ONLINE and reserved_slots + 1 <= capacity_slots"
    error_id: "ERR_TANK_OFFLINE / ERR_TANK_AT_CAPACITY"
    http_status: 409
    applies_to: "POST .../cryo-specimens/{id}/store"

  - priority: 16
    category: business_fiscal
    check: "Settlement cannot run until protocol_status is finalized (COMPLETED or CANCELLED); write-off requires CANCELLED"
    error_id: ERR_CYCLE_NOT_FINALIZED
    http_status: 409
    applies_to: "POST .../billing/settle, POST .../billing/write-off"

  - priority: 17
    category: business_constraint
    check: "Cannot complete a cycle without an OutcomeReport recorded"
    error_id: ERR_OUTCOME_REQUIRED
    http_status: 409
    applies_to: "POST .../complete"

  - priority: 18
    category: business_constraint
    check: "Cannot create a cycle against a RETIRED InsurancePackage or an INACTIVE Patient"
    error_id: "ERR_PACKAGE_RETIRED / ERR_PATIENT_INACTIVE"
    http_status: 409
    applies_to: "POST .../cycles"

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 5: API Endpoint Table (§1.5)
# =============================================================================
endpoints:
  # ---- Clinic + deterministic clock ----
  - method: POST
    path: "/clinics"
    description: "Create a clinic"
    roles: [ClinicAdmin]
    code: 201
    input: [name, "timezone?", "room_concurrency_limit?"]
    output: Clinic
    side_effects: ["current_clock_utc initialized to 1970-01-01T00:00:00.000Z; room_concurrency_limit defaults to 2"]
  - method: GET
    path: "/clinics/{clinicId}"
    description: "Get a clinic"
    roles: [ClinicAdmin, Nurse, Embryologist, BillingSpecialist, Patient]
    code: 200
    input: []
    output: Clinic
    side_effects: []
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint: set the deterministic clock for all clinics' current_clock_utc"
    roles: [ClinicAdmin]
    code: 200
    input: [clinic_id, to_iso8601]
    output: Clinic
    side_effects: ["Clinic.current_clock_utc = to_iso8601 (monotonic non-decreasing enforced; ERR_CLOCK_NOT_MONOTONIC if earlier)"]

  # ---- Insurance packages ----
  - method: POST
    path: "/clinics/{clinicId}/packages"
    description: "Create an insurance/billing package"
    roles: [ClinicAdmin]
    code: 201
    input: [name, base_price_cents, coverage_pct, "stim_med_covered?", "cryo_storage_covered?", "annual_cryo_storage_cents?", lifetime_coverage_cap_cents]
    output: InsurancePackage
    side_effects: ["status = ACTIVE"]
  - method: GET
    path: "/clinics/{clinicId}/packages"
    description: "List packages (filterable); reverse-reachability for InsurancePackage FK"
    roles: [ClinicAdmin, BillingSpecialist, Nurse]
    code: 200
    input: ["clinic_id?", "limit?", "offset?"]
    output: "InsurancePackage[]"
    side_effects: []
  - method: GET
    path: "/clinics/{clinicId}/packages/{packageId}"
    description: "Get a package"
    roles: [ClinicAdmin, BillingSpecialist, Nurse]
    code: 200
    input: []
    output: InsurancePackage
    side_effects: []
  - method: POST
    path: "/clinics/{clinicId}/packages/{packageId}/retire"
    description: "Retire a package"
    roles: [ClinicAdmin]
    code: 200
    input: []
    output: InsurancePackage
    side_effects: ["status = RETIRED"]

  # ---- Patients ----
  - method: POST
    path: "/clinics/{clinicId}/patients"
    description: "Register a patient"
    roles: [ClinicAdmin, Nurse]
    code: 201
    input: [full_name, date_of_birth, "insurance_package_id?"]
    output: Patient
    side_effects: ["status = ACTIVE"]
  - method: GET
    path: "/clinics/{clinicId}/patients"
    description: "List patients (filterable by insurance_package_id); reverse-reachability for Patient.insurance_package_id and Patient.clinic_id FKs"
    roles: [ClinicAdmin, Nurse, BillingSpecialist]
    code: 200
    input: ["insurance_package_id?", "clinic_id?", "limit?", "offset?"]
    output: "Patient[]"
    side_effects: []
  - method: GET
    path: "/clinics/{clinicId}/patients/{patientId}"
    description: "Get a patient"
    roles: [ClinicAdmin, Nurse, BillingSpecialist, Patient]
    code: 200
    input: []
    output: Patient
    side_effects: []
  - method: POST
    path: "/clinics/{clinicId}/patients/{patientId}/deactivate"
    description: "Mark a patient INACTIVE"
    roles: [ClinicAdmin]
    code: 200
    input: []
    output: Patient
    side_effects: ["status = INACTIVE"]

  # ---- Donor / surrogate ----
  - method: POST
    path: "/clinics/{clinicId}/donors"
    description: "Create a donor profile"
    roles: [ClinicAdmin]
    code: 201
    input: [code, donor_type]
    output: DonorProfile
    side_effects: ["status = AVAILABLE"]
  - method: GET
    path: "/clinics/{clinicId}/donors"
    description: "List donor profiles (filterable by clinic_id); reverse-reachability for DonorProfile.clinic_id FK"
    roles: [ClinicAdmin, Nurse, Embryologist]
    code: 200
    input: ["clinic_id?", "limit?", "offset?"]
    output: "DonorProfile[]"
    side_effects: []
  - method: GET
    path: "/clinics/{clinicId}/donors/{donorId}"
    description: "Get a donor profile"
    roles: [ClinicAdmin, Nurse, Embryologist]
    code: 200
    input: []
    output: DonorProfile
    side_effects: []
  - method: POST
    path: "/clinics/{clinicId}/surrogates"
    description: "Create a surrogate profile"
    roles: [ClinicAdmin]
    code: 201
    input: [full_name]
    output: SurrogateProfile
    side_effects: ["status = AVAILABLE"]
  - method: GET
    path: "/clinics/{clinicId}/surrogates"
    description: "List surrogate profiles (filterable by clinic_id); reverse-reachability for SurrogateProfile.clinic_id FK"
    roles: [ClinicAdmin, Nurse]
    code: 200
    input: ["clinic_id?", "limit?", "offset?"]
    output: "SurrogateProfile[]"
    side_effects: []
  - method: GET
    path: "/clinics/{clinicId}/surrogates/{surrogateId}"
    description: "Get a surrogate profile"
    roles: [ClinicAdmin, Nurse]
    code: 200
    input: []
    output: SurrogateProfile
    side_effects: []

  # ---- Consent forms (versioning) ----
  - method: POST
    path: "/clinics/{clinicId}/consent-forms"
    description: "Create a consent form version (DRAFT)"
    roles: [ClinicAdmin]
    code: 201
    input: [form_key, version_label, required_for, "supersedes_form_id?"]
    output: ConsentForm
    side_effects: ["status = DRAFT"]
  - method: GET
    path: "/clinics/{clinicId}/consent-forms"
    description: "List consent forms (filterable by clinic_id and supersedes_form_id); reverse-reachability for ConsentForm.clinic_id and ConsentForm.supersedes_form_id FKs"
    roles: [ClinicAdmin, Nurse, Patient]
    code: 200
    input: ["clinic_id?", "supersedes_form_id?", "form_key?", "limit?", "offset?"]
    output: "ConsentForm[]"
    side_effects: []
  - method: GET
    path: "/clinics/{clinicId}/consent-forms/{formId}"
    description: "Get a consent form"
    roles: [ClinicAdmin, Nurse, Patient]
    code: 200
    input: []
    output: ConsentForm
    side_effects: []
  - method: POST
    path: "/clinics/{clinicId}/consent-forms/{formId}/publish"
    description: "Publish a draft consent form; optionally supersede a prior version"
    roles: [ClinicAdmin]
    code: 200
    input: []
    output: ConsentForm
    side_effects:
      - "status = PUBLISHED"
      - "If supersedes_form_id set: target -> SUPERSEDED; dependent ACTIVE PatientConsent -> STALE (cascade)"

  # ---- Patient consents (signing; version pinning) ----
  - method: POST
    path: "/clinics/{clinicId}/patient-consents"
    description: "Patient signs a published consent form (Patient signs own: X-User-ID must equal patient_id)"
    roles: [Patient, Nurse]
    code: 201
    input: [patient_id, consent_form_id]
    output: PatientConsent
    side_effects:
      - "status = ACTIVE"
      - "pinned_form_version = ConsentForm.version at signing"
      - "pinned_form_status_at_sign = PUBLISHED"
      - "signed_at = Clinic.current_clock_utc"
  - method: GET
    path: "/clinics/{clinicId}/patient-consents"
    description: "List patient consents filterable by patient_id and consent_form_id; reverse-reachability for PatientConsent.patient_id and PatientConsent.consent_form_id FKs"
    roles: [ClinicAdmin, Nurse, Patient]
    code: 200
    input: ["patient_id?", "consent_form_id?", "limit?", "offset?"]
    output: "PatientConsent[]"
    side_effects: []
  - method: GET
    path: "/clinics/{clinicId}/patient-consents/{consentId}"
    description: "Get a single patient consent"
    roles: [ClinicAdmin, Nurse, Patient]
    code: 200
    input: []
    output: PatientConsent
    side_effects: []
  - method: POST
    path: "/clinics/{clinicId}/patient-consents/{consentId}/revoke"
    description: "Patient revokes an active consent (X-User-ID must equal the consent's patient_id)"
    roles: [Patient]
    code: 200
    input: []
    output: PatientConsent
    side_effects: ["status = REVOKED"]

  # ---- Cryo tanks ----
  - method: POST
    path: "/clinics/{clinicId}/tanks"
    description: "Create a cryo tank"
    roles: [ClinicAdmin, Embryologist]
    code: 201
    input: [label, capacity_slots]
    output: CryoTank
    side_effects: ["status = ONLINE; reserved_slots = 0"]
  - method: GET
    path: "/clinics/{clinicId}/tanks"
    description: "List tanks (filterable by clinic_id); reverse-reachability for CryoTank.clinic_id FK"
    roles: [ClinicAdmin, Embryologist]
    code: 200
    input: ["clinic_id?", "limit?", "offset?"]
    output: "CryoTank[]"
    side_effects: []
  - method: GET
    path: "/clinics/{clinicId}/tanks/{tankId}"
    description: "Get a tank (reads reserved_slots)"
    roles: [ClinicAdmin, Embryologist]
    code: 200
    input: []
    output: CryoTank
    side_effects: []
  - method: POST
    path: "/clinics/{clinicId}/tanks/{tankId}/set-maintenance"
    description: "Put a tank into MAINTENANCE"
    roles: [ClinicAdmin, Embryologist]
    code: 200
    input: []
    output: CryoTank
    side_effects: ["status = MAINTENANCE"]

  # ---- Treatment cycles ----
  - method: POST
    path: "/clinics/{clinicId}/cycles"
    description: "Create a treatment cycle for a patient"
    roles: [Nurse]
    code: 201
    input: [patient_id, "donor_profile_id?", "surrogate_profile_id?"]
    output: TreatmentCycle
    side_effects:
      - "protocol_status = DRAFT; billing_status = UNBILLED"
      - "insurance_package_id snapshotted from Patient.insurance_package_id"
      - "If donor_profile_id set: DonorProfile AVAILABLE -> RESERVED (cross-entity)"
      - "If surrogate_profile_id set: SurrogateProfile AVAILABLE -> MATCHED"
  - method: GET
    path: "/clinics/{clinicId}/cycles"
    description: "List cycles (filterable by patient_id); reverse-reachability for TreatmentCycle.patient_id, insurance_package_id, donor_profile_id, surrogate_profile_id FKs"
    roles: [ClinicAdmin, Nurse, Embryologist, BillingSpecialist, Patient]
    code: 200
    input: ["patient_id?", "insurance_package_id?", "donor_profile_id?", "surrogate_profile_id?", "limit?", "offset?"]
    output: "TreatmentCycle[]"
    side_effects: []
  - method: GET
    path: "/clinics/{clinicId}/cycles/{cycleId}"
    description: "Get a cycle (reads both status axes and computed money fields)"
    roles: [ClinicAdmin, Nurse, Embryologist, BillingSpecialist, Patient]
    code: 200
    input: []
    output: TreatmentCycle
    side_effects: []
  - method: POST
    path: "/clinics/{clinicId}/cycles/{cycleId}/start-stim"
    description: "Begin stimulation"
    roles: [Nurse]
    code: 200
    input: []
    output: TreatmentCycle
    side_effects: ["protocol_status DRAFT -> STIM; stamp stim-start at clock"]
  - method: POST
    path: "/clinics/{clinicId}/cycles/{cycleId}/retrieve"
    description: "Record oocyte retrieval"
    roles: [Nurse]
    code: 200
    input: [oocytes_retrieved]
    output: TreatmentCycle
    side_effects: ["protocol_status STIM -> RETRIEVAL; set oocytes_retrieved"]
  - method: POST
    path: "/clinics/{clinicId}/cycles/{cycleId}/revert-to-stim"
    description: "Revert a retrieval back to stimulation"
    roles: [Nurse]
    code: 200
    input: []
    output: TreatmentCycle
    side_effects: ["protocol_status RETRIEVAL -> STIM; oocytes_retrieved reset to 0"]
  - method: POST
    path: "/clinics/{clinicId}/cycles/{cycleId}/fertilize"
    description: "Record fertilization counts"
    roles: [Embryologist]
    code: 200
    input: [embryos_fertilized]
    output: TreatmentCycle
    side_effects:
      - "protocol_status RETRIEVAL -> FERTILIZATION; set embryos_fertilized"
      - "If donor linked: DonorProfile RESERVED -> CONSUMED"
  - method: POST
    path: "/clinics/{clinicId}/cycles/{cycleId}/transfer"
    description: "Perform a fresh embryo transfer (fork branch A)"
    roles: [Embryologist]
    code: 200
    input: []
    output: TreatmentCycle
    side_effects: ["protocol_status FERTILIZATION -> FRESH_TRANSFER"]
  - method: POST
    path: "/clinics/{clinicId}/cycles/{cycleId}/freeze-all"
    description: "Freeze all embryos (fork branch B)"
    roles: [Embryologist]
    code: 200
    input: []
    output: TreatmentCycle
    side_effects: ["protocol_status FERTILIZATION -> FREEZE_ALL"]
  - method: POST
    path: "/clinics/{clinicId}/cycles/{cycleId}/complete"
    description: "Complete a cycle"
    roles: [Nurse]
    code: 200
    input: []
    output: TreatmentCycle
    side_effects: ["protocol_status -> COMPLETED (requires an OutcomeReport)"]
  - method: POST
    path: "/clinics/{clinicId}/cycles/{cycleId}/cancel"
    description: "Cancel a cycle (cascades to meds, appointments, specimens, tank; computes cancellation fee)"
    roles: [Nurse]
    code: 200
    input: [expected_cycle_version]
    output: TreatmentCycle
    side_effects:
      - "protocol_status -> CANCELLED; compute cancellation_fee_cents"
      - "Cascade: SCHEDULED meds -> CANCELLED; CONFIRMED/RESCHEDULED appts -> CANCELLED; PENDING/STORED specimens -> DISCARDED (STORED frees tank slot)"
      - "If donor RESERVED and not yet CONSUMED: DonorProfile -> AVAILABLE"
      - "increments TreatmentCycle.version by 1"

  # ---- Medication calendar ----
  - method: POST
    path: "/clinics/{clinicId}/medications"
    description: "Add a medication order to a cycle's calendar (closed day-offset interval overlap-checked per drug_name)"
    roles: [Nurse]
    code: 201
    input: [treatment_cycle_id, drug_name, start_day_offset, end_day_offset, daily_dose_units, unit_price_cents]
    output: MedicationOrder
    side_effects:
      - "Reject ERR_MEDICATION_SCHEDULE_OVERLAP if [start_day_offset,end_day_offset] (closed) overlaps an existing SCHEDULED/ADMINISTERED order of the same drug_name on the cycle"
      - "status = SCHEDULED; compute line_total_cents"
  - method: GET
    path: "/clinics/{clinicId}/medications"
    description: "List medication orders filterable by treatment_cycle_id; reverse-reachability for MedicationOrder.treatment_cycle_id FK"
    roles: [ClinicAdmin, Nurse, BillingSpecialist, Patient]
    code: 200
    input: ["treatment_cycle_id?", "status?", "limit?", "offset?"]
    output: "MedicationOrder[]"
    side_effects: []
  - method: GET
    path: "/clinics/{clinicId}/medications/{medId}"
    description: "Get a medication order"
    roles: [ClinicAdmin, Nurse, BillingSpecialist, Patient]
    code: 200
    input: []
    output: MedicationOrder
    side_effects: []
  - method: POST
    path: "/clinics/{clinicId}/medications/{medId}/administer"
    description: "Mark a medication order administered"
    roles: [Nurse]
    code: 200
    input: []
    output: MedicationOrder
    side_effects: ["status SCHEDULED -> ADMINISTERED"]
  - method: POST
    path: "/clinics/{clinicId}/medications/{medId}/cancel"
    description: "Cancel a scheduled medication order"
    roles: [Nurse]
    code: 200
    input: []
    output: MedicationOrder
    side_effects: ["status SCHEDULED -> CANCELLED"]

  # ---- Monitoring appointments ----
  - method: POST
    path: "/clinics/{clinicId}/monitoring-appointments"
    description: "Schedule a monitoring appointment for a cycle (overlap-checked against clinic room capacity)"
    roles: [Nurse]
    code: 201
    input: [treatment_cycle_id, appointment_type, start_utc, end_utc, "room_capacity_weight?"]
    output: MonitoringAppointment
    side_effects: ["status = CONFIRMED; clinic_id snapshotted from the cycle's clinic; occupies room-capacity window"]
  - method: GET
    path: "/clinics/{clinicId}/monitoring-appointments"
    description: "List appointments filterable by treatment_cycle_id and clinic_id; reverse-reachability for MonitoringAppointment.treatment_cycle_id and MonitoringAppointment.clinic_id FKs"
    roles: [ClinicAdmin, Nurse, Patient]
    code: 200
    input: ["treatment_cycle_id?", "clinic_id?", "status?", "limit?", "offset?"]
    output: "MonitoringAppointment[]"
    side_effects: []
  - method: GET
    path: "/clinics/{clinicId}/monitoring-appointments/{apptId}"
    description: "Get an appointment"
    roles: [ClinicAdmin, Nurse, Patient]
    code: 200
    input: []
    output: MonitoringAppointment
    side_effects: []
  - method: POST
    path: "/clinics/{clinicId}/monitoring-appointments/{apptId}/reschedule"
    description: "Reschedule an appointment to a new interval (overlap-checked)"
    roles: [Nurse]
    code: 200
    input: [start_utc, end_utc]
    output: MonitoringAppointment
    side_effects: ["status -> RESCHEDULED; update interval"]
  - method: POST
    path: "/clinics/{clinicId}/monitoring-appointments/{apptId}/confirm"
    description: "Confirm a rescheduled appointment"
    roles: [Nurse]
    code: 200
    input: []
    output: MonitoringAppointment
    side_effects: ["status RESCHEDULED -> CONFIRMED"]
  - method: POST
    path: "/clinics/{clinicId}/monitoring-appointments/{apptId}/complete"
    description: "Complete an appointment"
    roles: [Nurse]
    code: 200
    input: []
    output: MonitoringAppointment
    side_effects: ["status -> COMPLETED; frees room window"]
  - method: POST
    path: "/clinics/{clinicId}/monitoring-appointments/{apptId}/no-show"
    description: "Mark an appointment as no-show"
    roles: [Nurse]
    code: 200
    input: []
    output: MonitoringAppointment
    side_effects: ["status -> NO_SHOW; frees room window"]
  - method: POST
    path: "/clinics/{clinicId}/monitoring-appointments/{apptId}/cancel"
    description: "Cancel an appointment"
    roles: [Nurse]
    code: 200
    input: []
    output: MonitoringAppointment
    side_effects: ["status -> CANCELLED; frees room window"]

  # ---- Cryo specimens ----
  - method: POST
    path: "/clinics/{clinicId}/cryo-specimens"
    description: "Create a specimen record (PENDING) for a cycle"
    roles: [Embryologist]
    code: 201
    input: [treatment_cycle_id, cryo_tank_id, specimen_type]
    output: CryoSpecimen
    side_effects: ["status = PENDING"]
  - method: GET
    path: "/clinics/{clinicId}/cryo-specimens"
    description: "List specimens filterable by treatment_cycle_id and cryo_tank_id; reverse-reachability for CryoSpecimen.treatment_cycle_id and CryoSpecimen.cryo_tank_id FKs"
    roles: [ClinicAdmin, Embryologist, Patient]
    code: 200
    input: ["treatment_cycle_id?", "cryo_tank_id?", "status?", "limit?", "offset?"]
    output: "CryoSpecimen[]"
    side_effects: []
  - method: GET
    path: "/clinics/{clinicId}/cryo-specimens/{specimenId}"
    description: "Get a specimen"
    roles: [ClinicAdmin, Embryologist, Patient]
    code: 200
    input: []
    output: CryoSpecimen
    side_effects: []
  - method: POST
    path: "/clinics/{clinicId}/cryo-specimens/{specimenId}/store"
    description: "Store a specimen into a tank (reserves a slot; OCC on tank version)"
    roles: [Embryologist]
    code: 200
    input: [expected_tank_version]
    output: CryoSpecimen
    side_effects:
      - "status PENDING -> STORED; stamp storage_start_utc; CryoTank.reserved_slots += 1"
      - "increments CryoTank.version by 1"
  - method: POST
    path: "/clinics/{clinicId}/cryo-specimens/{specimenId}/accrue-storage-year"
    description: "Accrue one whole storage-year on a stored specimen (advances storage_years_accrued)"
    roles: [Embryologist, BillingSpecialist]
    code: 200
    input: []
    output: CryoSpecimen
    side_effects: ["storage_years_accrued += 1 (only when STORED)"]
  - method: POST
    path: "/clinics/{clinicId}/cryo-specimens/{specimenId}/thaw"
    description: "Thaw a stored specimen (releases tank slot)"
    roles: [Embryologist]
    code: 200
    input: []
    output: CryoSpecimen
    side_effects: ["status STORED -> THAWED; CryoTank.reserved_slots -= 1; increments CryoTank.version by 1"]
  - method: POST
    path: "/clinics/{clinicId}/cryo-specimens/{specimenId}/discard"
    description: "Discard a specimen"
    roles: [Embryologist]
    code: 200
    input: []
    output: CryoSpecimen
    side_effects: ["status -> DISCARDED; if was STORED, release tank slot and increment tank version"]
  - method: POST
    path: "/clinics/{clinicId}/cryo-specimens/{specimenId}/transfer-out"
    description: "Transfer a specimen to another facility (releases tank slot)"
    roles: [Embryologist]
    code: 200
    input: []
    output: CryoSpecimen
    side_effects: ["status STORED -> TRANSFERRED_OUT; CryoTank.reserved_slots -= 1; increments CryoTank.version by 1"]

  # ---- Billing ----
  - method: POST
    path: "/clinics/{clinicId}/cycles/{cycleId}/billing/estimate"
    description: "Produce a forward-looking insurance estimate"
    roles: [BillingSpecialist]
    code: 200
    input: []
    output: TreatmentCycle
    side_effects: ["billing_status UNBILLED -> ESTIMATED; compute estimated_patient_owed_cents"]
  - method: POST
    path: "/clinics/{clinicId}/cycles/{cycleId}/billing/settle"
    description: "Settle the cycle (chronological true-up; issues invoice; OCC on cycle version)"
    roles: [BillingSpecialist]
    code: 200
    input: [expected_cycle_version]
    output: TreatmentCycle
    side_effects:
      - "billing_status ESTIMATED -> SETTLED"
      - "compute final_patient_owed_cents, insurer_paid_cents, gross_charge_cents (cap-applied)"
      - "create CycleInvoice (ISSUED)"
      - "increments TreatmentCycle.version by 1"
  - method: POST
    path: "/clinics/{clinicId}/cycles/{cycleId}/billing/write-off"
    description: "Write off a cancelled cycle's charges except the cancellation fee"
    roles: [BillingSpecialist]
    code: 200
    input: []
    output: TreatmentCycle
    side_effects:
      - "billing_status ESTIMATED -> WRITTEN_OFF"
      - "final_patient_owed_cents = cancellation_fee_cents; insurer_paid_cents = 0"
      - "create CycleInvoice (VOID)"
  - method: GET
    path: "/clinics/{clinicId}/cycle-invoices"
    description: "List invoices filterable by treatment_cycle_id; reverse-reachability for CycleInvoice.treatment_cycle_id FK"
    roles: [ClinicAdmin, BillingSpecialist, Patient]
    code: 200
    input: ["treatment_cycle_id?", "status?", "limit?", "offset?"]
    output: "CycleInvoice[]"
    side_effects: []
  - method: GET
    path: "/clinics/{clinicId}/cycle-invoices/{invoiceId}"
    description: "Get an invoice"
    roles: [ClinicAdmin, BillingSpecialist, Patient]
    code: 200
    input: []
    output: CycleInvoice
    side_effects: []

  # ---- Outcome reporting ----
  - method: POST
    path: "/clinics/{clinicId}/outcome-reports"
    description: "Record the outcome report for a cycle"
    roles: [Nurse]
    code: 201
    input: [treatment_cycle_id, pregnancy_test_result, "clinical_pregnancy?", "live_birth?"]
    output: OutcomeReport
    side_effects: ["compute utilization_rate from cycle counts"]
  - method: GET
    path: "/clinics/{clinicId}/outcome-reports"
    description: "List outcome reports filterable by treatment_cycle_id; reverse-reachability for OutcomeReport.treatment_cycle_id FK"
    roles: [ClinicAdmin, Nurse, BillingSpecialist, Patient]
    code: 200
    input: ["treatment_cycle_id?", "limit?", "offset?"]
    output: "OutcomeReport[]"
    side_effects: []
  - method: GET
    path: "/clinics/{clinicId}/outcome-reports/{outcomeId}"
    description: "Get an outcome report"
    roles: [ClinicAdmin, Nurse, BillingSpecialist, Patient]
    code: 200
    input: []
    output: OutcomeReport
    side_effects: []

# =============================================================================
# Table 6: Error Code Catalog (§1.6)
# =============================================================================
errors:
  # --- auth ---
  - { id: ERR_MISSING_AUTH_CONTEXT, http: 401, condition: "X-User-ID or X-User-Role header missing or malformed" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role not permitted for this operation per RBAC" }
  # --- not found ---
  - { id: ERR_CLINIC_NOT_FOUND, http: 404, condition: "Clinic id in path does not exist" }
  - { id: ERR_PATIENT_NOT_FOUND, http: 404, condition: "Patient not found" }
  - { id: ERR_PACKAGE_NOT_FOUND, http: 404, condition: "Insurance package not found" }
  - { id: ERR_DONOR_NOT_FOUND, http: 404, condition: "Donor profile not found" }
  - { id: ERR_SURROGATE_NOT_FOUND, http: 404, condition: "Surrogate profile not found" }
  - { id: ERR_CONSENT_FORM_NOT_FOUND, http: 404, condition: "Consent form not found" }
  - { id: ERR_CONSENT_NOT_FOUND, http: 404, condition: "Patient consent not found" }
  - { id: ERR_CYCLE_NOT_FOUND, http: 404, condition: "Treatment cycle not found" }
  - { id: ERR_MEDICATION_NOT_FOUND, http: 404, condition: "Medication order not found" }
  - { id: ERR_APPOINTMENT_NOT_FOUND, http: 404, condition: "Monitoring appointment not found" }
  - { id: ERR_TANK_NOT_FOUND, http: 404, condition: "Cryo tank not found" }
  - { id: ERR_SPECIMEN_NOT_FOUND, http: 404, condition: "Cryo specimen not found" }
  - { id: ERR_INVOICE_NOT_FOUND, http: 404, condition: "Cycle invoice not found" }
  - { id: ERR_OUTCOME_NOT_FOUND, http: 404, condition: "Outcome report not found" }
  # --- input validation ---
  - { id: ERR_VALIDATION, http: 422, condition: "Missing required field, wrong type, invalid enum, or out-of-domain numeric (e.g. negative count, end < start)" }
  - { id: ERR_CLOCK_NOT_MONOTONIC, http: 422, condition: "Clock set endpoint given a timestamp earlier than current_clock_utc" }
  # --- OCC ---
  - { id: ERR_STALE_CYCLE_VERSION, http: 412, condition: "expected_cycle_version does not match TreatmentCycle.version" }
  - { id: ERR_STALE_TANK_VERSION, http: 412, condition: "expected_tank_version does not match CryoTank.version" }
  # --- state (protocol/billing/appt/specimen/consent) ---
  - { id: ERR_CYCLE_BAD_PROTOCOL_STATE, http: 409, condition: "Cycle protocol_status does not permit this transition" }
  - { id: ERR_BILLING_BAD_STATE, http: 409, condition: "Cycle billing_status does not permit this transition" }
  - { id: ERR_APPT_BAD_STATE, http: 409, condition: "Appointment status does not permit this transition" }
  - { id: ERR_MED_BAD_STATE, http: 409, condition: "Medication order status does not permit administer/cancel" }
  - { id: ERR_SPECIMEN_BAD_STATE, http: 409, condition: "Specimen status does not permit this transition" }
  - { id: ERR_CONSENT_BAD_STATE, http: 409, condition: "PatientConsent not ACTIVE for revoke" }
  - { id: ERR_CONSENT_FORM_BAD_STATE, http: 409, condition: "Consent form not DRAFT for publish" }
  # --- business referential / cross-entity ---
  - { id: ERR_PATIENT_INACTIVE, http: 409, condition: "Patient is INACTIVE; cannot create or start a cycle" }
  - { id: ERR_PACKAGE_RETIRED, http: 409, condition: "Insurance package is RETIRED; cannot bind to a new cycle" }
  - { id: ERR_DONOR_NOT_AVAILABLE, http: 409, condition: "Donor profile is not AVAILABLE when linking to a cycle" }
  - { id: ERR_SUPERSEDE_TARGET_NOT_PUBLISHED, http: 409, condition: "supersedes_form_id target is not PUBLISHED at publish time" }
  # --- business safety (consent gates) ---
  - { id: ERR_CONSENT_MISSING, http: 409, condition: "No ACTIVE PatientConsent covering the required gate for this transition" }
  - { id: ERR_CONSENT_FORM_NOT_PUBLISHED, http: 409, condition: "Attempt to sign a DRAFT or SUPERSEDED consent form" }
  # --- business constraints (protocol counts) ---
  - { id: ERR_EMBRYO_COUNT_EXCEEDS_OOCYTES, http: 422, condition: "embryos_fertilized > oocytes_retrieved at fertilization" }
  - { id: ERR_NO_EMBRYOS_AVAILABLE, http: 409, condition: "Transfer/freeze requested with embryos_fertilized < 1" }
  - { id: ERR_OUTCOME_REQUIRED, http: 409, condition: "Cycle completion requested without an OutcomeReport" }
  # --- business temporal (appointments) ---
  - { id: ERR_APPOINTMENT_IN_PAST, http: 422, condition: "Appointment start_utc earlier than clock, or end_utc <= start_utc" }
  - { id: ERR_APPOINTMENT_NOT_STARTED, http: 409, condition: "Completing an appointment before its start_utc relative to clock" }
  - { id: ERR_APPOINTMENT_NOT_ENDED, http: 409, condition: "No-show before appointment end_utc relative to clock" }
  - { id: ERR_MONITORING_SLOT_CONFLICT, http: 409, condition: "Appointment interval pushes aggregate room_capacity_weight above clinic concurrency limit" }
  - { id: ERR_MEDICATION_SCHEDULE_OVERLAP, http: 409, condition: "New medication order's closed day-offset interval overlaps an existing SCHEDULED/ADMINISTERED order of the same drug_name on the cycle" }
  # --- business constraints (cryo) ---
  - { id: ERR_TANK_OFFLINE, http: 409, condition: "Storing into a tank not in ONLINE status" }
  - { id: ERR_TANK_AT_CAPACITY, http: 409, condition: "Storing would exceed tank capacity_slots" }
  # --- business fiscal ---
  - { id: ERR_CYCLE_NOT_FINALIZED, http: 409, condition: "Settlement/write-off attempted before protocol finalization (settle needs COMPLETED|CANCELLED; write-off needs CANCELLED)" }

# =============================================================================
# Table 7: RBAC Matrix (§1.7)
# =============================================================================
roles:
  - name: ClinicAdmin
    description: "Clinic operator: configures packages, consent forms, tanks, donor/surrogate profiles, and patient records"
    identity: opaque
    exclusive_operations:
      - "POST /clinics — create clinic"
      - "POST /_clock/set_current_utc — set deterministic clock"
      - "POST .../packages — create package"
      - "POST .../packages/{id}/retire — retire package"
      - "POST .../patients/{id}/deactivate — deactivate patient"
      - "POST .../donors — create donor"
      - "POST .../surrogates — create surrogate"
      - "POST .../consent-forms — create consent form"
      - "POST .../consent-forms/{id}/publish — publish consent form"
    shared_operations:
      - "GET (all read endpoints)"
      - "POST .../patients — register patient (shared with Nurse)"
      - "POST .../tanks — create tank (shared with Embryologist)"
      - "POST .../tanks/{id}/set-maintenance — maintenance (shared with Embryologist)"

  - name: Nurse
    description: "Drives cycle protocol, medication calendar, monitoring appointments, outcome reporting"
    identity: opaque
    exclusive_operations:
      - "POST .../cycles — create cycle"
      - "POST .../cycles/{id}/start-stim, /retrieve, /revert-to-stim, /complete, /cancel"
      - "POST .../medications, /medications/{id}/administer, /medications/{id}/cancel"
      - "POST .../monitoring-appointments and all appointment transitions"
      - "POST .../outcome — record outcome"
    shared_operations:
      - "GET (read endpoints for cycles/patients/meds/appts/consents/packages)"
      - "POST .../patients — register patient (shared with ClinicAdmin)"
      - "POST .../patients/{id}/consents — sign on behalf of patient (shared with Patient)"

  - name: Embryologist
    description: "Owns lab transitions (fertilize/transfer/freeze) and cryo specimen inventory"
    identity: opaque
    exclusive_operations:
      - "POST .../cycles/{id}/fertilize, /transfer, /freeze-all"
      - "POST .../cryo-specimens — create specimen"
      - "POST .../cryo-specimens/{id}/store, /accrue-storage-year, /thaw, /discard, /transfer-out"
    shared_operations:
      - "GET (read endpoints for cycles/specimens/tanks/donors)"
      - "POST .../tanks — create tank (shared with ClinicAdmin)"
      - "POST .../tanks/{id}/set-maintenance — maintenance (shared with ClinicAdmin)"
      - "POST .../cryo-specimens/{id}/accrue-storage-year (shared with BillingSpecialist)"

  - name: BillingSpecialist
    description: "Owns the cycle billing axis: insurance estimate, settlement, write-off, invoices"
    identity: opaque
    exclusive_operations:
      - "POST .../billing/estimate"
      - "POST .../billing/settle"
      - "POST .../billing/write-off"
    shared_operations:
      - "GET (read endpoints for cycles/invoices/packages/patients/meds/outcome)"
      - "POST .../cryo-specimens/{id}/accrue-storage-year (shared with Embryologist)"

  - name: Patient
    description: "Acts as themselves: signs/revokes own consents, reads own records"
    identity: "entity_backed:Patient"
    exclusive_operations:
      - "POST .../patient-consents/{consentId}/revoke — revoke own consent (X-User-ID must equal patientId)"
    shared_operations:
      - "POST .../patient-consents — sign own consent (shared with Nurse; X-User-ID must equal patientId)"
      - "GET (read endpoints scoped to own patient/cycles/consents/invoices/specimens/appointments)"
