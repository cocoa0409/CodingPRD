# =============================================================================
# SCAFFOLD.yaml — Consumer Complaint Management & Regulator Response
# §1.0–§1.7 only. Difficulty design and corner design live in sibling files.
# =============================================================================

scenario: |
  Consumer Complaint Management & Regulator Response (bank complaint management office): complaint intake across channels & taxonomy coding, regulatory referral (CFPB portal) response deadline, root-cause analysis & product/process linkage, remediation & restitution decisions, trend reporting & early warning by product, response quality review & template governance, executive/legal escalation path, retention & audit trail

domain_name: consumer-complaint-management-regulator
api_prefix: /complaint-office

# =============================================================================
# Complexity profile
# =============================================================================
complexity_profile:
  primary_archetype: "Compliance / audit"
  secondary_archetype: "Workflow orchestration"
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - scheduled_deferred_actions
    - derived_field_reconciliation
  entity_topology: hybrid
  state_machine_shape: compound
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - self_referential
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Product
    parent: null
    common_fields: true
    fields:
      - { name: product_code, type: string, source: input, description: "Unique business code for the product (e.g., CKNG-STD)" }
      - { name: display_name, type: string, source: input, description: "Human-readable product name" }
      - { name: posture, type: enum, source: computed, constraints: "OPEN | WATCH | FROZEN", description: "Derived intake-gating posture; recomputed on every complaint status change, RCA completion, and trend snapshot evaluation" }
      - { name: open_complaint_count, type: integer, source: computed, description: "Count of linked complaints whose status is in {INTAKE, TRIAGED, INVESTIGATING, RESPONSE_DRAFTED, RESPONSE_QA, REOPENED}" }
      - { name: substantiated_count_90d, type: integer, source: computed, description: "Count of linked complaints whose latest RCA verdict is SUBSTANTIATED and whose received_at falls within the trailing 90 calendar days of the logical clock" }
      - { name: early_warning_active, type: boolean, source: computed, description: "True when the most recent TrendSnapshot evaluation for this product breached its early-warning threshold" }

  - name: Channel
    parent: null
    common_fields: true
    fields:
      - { name: channel_code, type: string, source: input, description: "Unique intake channel code (e.g., WEB, PHONE, BRANCH, CFPB_PORTAL)" }
      - { name: display_name, type: string, source: input, description: "Channel label" }
      - { name: is_regulator_portal, type: boolean, source: input, default: false, description: "True when complaints arriving on this channel must have a RegulatoryReferral auto-created at intake" }

  - name: TaxonomyCategory
    parent: null
    common_fields: true
    fields:
      - { name: category_code, type: string, source: input, description: "Unique taxonomy code (e.g., FEES.OVERDRAFT)" }
      - { name: parent_category_code, type: string, source: input, default: null, description: "FK -> TaxonomyCategory.id via parent category_code; null for roots; self-referential hierarchy used by rollup trend reporting" }
      - { name: retired, type: boolean, source: system, default: false, description: "Retired categories cannot be assigned to new complaints but remain on historical records" }

  - name: ResponseTemplate
    parent: null
    common_fields: true
    fields:
      - { name: template_key, type: string, source: input, description: "Unique template key" }
      - { name: channel_code, type: string, source: input, description: "FK -> Channel.id via channel_code this template serves" }
      - { name: category_code, type: string, source: input, description: "FK -> TaxonomyCategory.id via category_code this template serves" }
      - { name: body, type: string, source: input, description: "Template body text" }
      - { name: status, type: enum, source: system, constraints: "DRAFT | ACTIVE | RETIRED", description: "Template lifecycle; at most one ACTIVE per (channel_code, category_code) pair" }

  - name: Complaint
    parent: null
    common_fields: true
    fields:
      - { name: complainant_ref, type: string, source: input, description: "External complainant reference (opaque customer identifier)" }
      - { name: channel_code, type: string, source: input, description: "FK -> Channel.id via channel_code; intake channel" }
      - { name: product_code, type: string, source: input, description: "FK -> Product.id via product_code" }
      - { name: category_code, type: string, source: input, description: "FK -> TaxonomyCategory.id via category_code" }
      - { name: received_at, type: datetime, source: system, description: "Logical-clock timestamp at intake creation" }
      - { name: narrative, type: string, source: input, description: "Complaint narrative" }
      - { name: claimed_loss_cents, type: integer, source: input, default: 0, description: "Alleged monetary loss in cents; must be >= 0" }
      - { name: status, type: enum, source: system, constraints: "INTAKE | TRIAGED | INVESTIGATING | RESPONSE_DRAFTED | RESPONSE_QA | RESOLVED | REOPENED | WITHDRAWN", description: "Complaint lifecycle; REOPENED re-enters the work pipeline at start_investigation" }
      - { name: response_text, type: string, source: input, default: null, description: "Consumer-facing response drafted for this complaint" }
      - { name: response_template_key, type: string, source: input, default: null, description: "Template used for the drafted response; must reference an ACTIVE template whose channel and category match the complaint at draft time" }
      - { name: resolved_at, type: datetime, source: system, default: null, description: "Logical-clock timestamp of the latest terminal transition (resolve or withdraw); null while non-terminal and cleared on reopen" }
      - { name: approved_restitution_cents, type: integer, source: computed, description: "Sum of restitution_amount_cents over this complaint's RemediationDecisions in APPROVED or PAID status" }
      - { name: paid_restitution_cents, type: integer, source: computed, description: "Sum of restitution_amount_cents over this complaint's RemediationDecisions in PAID status" }
      - { name: days_open_business, type: integer, source: computed, description: "Business-day age per complaint_age_business calculation" }
      - { name: days_open_calendar, type: integer, source: computed, description: "Calendar-day age per complaint_age_calendar calculation" }
      - { name: timeliness_score, type: number, source: computed, description: "Response timeliness score per response_timeliness_score calculation; null until the first referral response is submitted" }
      - { name: owner_user_id, type: string, source: system, description: "X-User-ID of the IntakeSpecialist or CaseHandler who created the complaint; used for segregation-of-duties checks" }
      - { name: retention_purge_at, type: datetime, source: computed, default: null, description: "Earliest timestamp at which the complaint record may be purged; = resolved_at + RETENTION_YEARS for terminal complaints; null while non-terminal" }

  - name: IntakeEvent
    parent: Complaint
    common_fields: false
    fields:
      - { name: complaint_id, type: string, source: system, description: "FK -> Complaint.id; append-only audit event" }
      - { name: event_type, type: enum, source: system, constraints: "CREATED | TAXONOMY_RECODED | STATUS_CHANGED | RESPONSE_DRAFTED | QA_PASSED | QA_FAILED | REFERRAL_FILED | REFERRAL_RESPONDED | REMEDIATION_APPROVED | REMEDIATION_PAID | REMEDIATION_REVERSED | ESCALATED | ESCALATION_RESOLVED | REOPENED | WITHDRAWN", description: "Tamper-evident audit trail event type" }
      - { name: actor_user_id, type: string, source: system, description: "X-User-ID of the actor that caused the event" }
      - { name: actor_role, type: string, source: system, description: "X-User-Role of the actor" }
      - { name: payload, type: object, source: system, description: "Event-specific structured payload (old/new values)" }
      - { name: event_at, type: datetime, source: system, description: "Logical-clock timestamp when the event was appended" }

  - name: RegulatoryReferral
    parent: Complaint
    common_fields: true
    fields:
      - { name: complaint_id, type: string, source: system, description: "FK -> Complaint.id" }
      - { name: portal_ref, type: string, source: input, description: "Regulator portal reference number (e.g., CFPB case number); defaults to AUTO-<complaint.id> when omitted on a portal-channel intake" }
      - { name: received_via_portal_at, type: datetime, source: system, description: "Logical-clock timestamp when the referral was registered" }
      - { name: response_due_at, type: datetime, source: computed, description: "= received_via_portal_at + REFERRAL_RESPONSE_DAYS calendar days" }
      - { name: submitted_at, type: datetime, source: system, default: null, description: "Logical-clock timestamp of the latest response submission; null until first submission" }
      - { name: timeliness, type: enum, source: computed, constraints: "PENDING | ON_TIME | LATE", description: "PENDING until first submission; then ON_TIME iff submitted_at <= response_due_at else LATE" }
      - { name: status, type: enum, source: system, constraints: "OPEN | RESPONSE_SUBMITTED | CLOSED_BY_REGULATOR | REOPENED_BY_REGULATOR", description: "Referral lifecycle; cyclic REOPENED_BY_REGULATOR -> RESPONSE_SUBMITTED allowed" }
      - { name: response_text, type: string, source: input, default: null, description: "Regulator-facing response body" }

  - name: RootCauseAnalysis
    parent: Complaint
    common_fields: true
    fields:
      - { name: complaint_id, type: string, source: system, description: "FK -> Complaint.id" }
      - { name: verdict, type: enum, source: input, constraints: "SUBSTANTIATED | NOT_SUBSTANTIATED | INCONCLUSIVE", description: "Analyst verdict" }
      - { name: linked_product_code, type: string, source: input, description: "FK -> Product.id via product_code; the product/process to which the root cause is attributed (may differ from the complaint's product)" }
      - { name: process_step, type: string, source: input, description: "Business process step implicated" }
      - { name: completed_at, type: datetime, source: system, default: null, description: "Logical-clock timestamp when the RCA was completed; null while DRAFT" }
      - { name: status, type: enum, source: system, constraints: "DRAFT | COMPLETED | SUPERSEDED", description: "Only one DRAFT or COMPLETED RCA per complaint at any time; creating a new RCA supersedes a prior DRAFT" }

  - name: RemediationDecision
    parent: Complaint
    common_fields: true
    fields:
      - { name: complaint_id, type: string, source: system, description: "FK -> Complaint.id" }
      - { name: decision_type, type: enum, source: input, constraints: "NO_ACTION | CORRECTION | RESTITUTION | CORRECTION_AND_RESTITUTION", description: "Remediation decision kind" }
      - { name: line_items, type: array, source: input, description: "Restitution line items [{ label, amount_cents, rounding_rate_bps? }], each amount_cents >= 0; empty for NO_ACTION and CORRECTION" }
      - { name: restitution_amount_cents, type: integer, source: computed, description: "Computed per restitution_amount calculation (per-line floor then sum); 0 when line_items empty" }
      - { name: drafted_by_user_id, type: string, source: system, description: "X-User-ID of the CaseHandler who drafted the decision" }
      - { name: approved_by_user_id, type: string, source: system, default: null, description: "X-User-ID of the RemediationApprover who approved; null until approved" }
      - { name: status, type: enum, source: system, constraints: "DRAFT | PENDING_APPROVAL | APPROVED | PAID | REVERSED | REJECTED", description: "Decision lifecycle" }

  - name: QualityReview
    parent: Complaint
    common_fields: true
    fields:
      - { name: complaint_id, type: string, source: system, description: "FK -> Complaint.id" }
      - { name: reviewer_user_id, type: string, source: system, description: "X-User-ID of the QAReviewer who claimed the review" }
      - { name: window_start_at, type: datetime, source: input, description: "Sampling window start (inclusive) this review occupies" }
      - { name: window_end_at, type: datetime, source: input, description: "Sampling window end (exclusive) this review occupies; must be strictly after window_start_at" }
      - { name: outcome, type: enum, source: input, default: null, constraints: "PASS | FAIL", description: "Review outcome; null while OPEN" }
      - { name: status, type: enum, source: system, constraints: "OPEN | COMPLETED | CANCELLED", description: "Review lifecycle" }

  - name: EscalationCase
    parent: Complaint
    common_fields: true
    fields:
      - { name: complaint_id, type: string, source: system, description: "FK -> Complaint.id" }
      - { name: escalation_tier, type: enum, source: input, constraints: "EXECUTIVE | LEGAL", description: "Escalation path tier" }
      - { name: reason, type: string, source: input, description: "Escalation reason" }
      - { name: raised_by_user_id, type: string, source: system, description: "X-User-ID of the raiser" }
      - { name: status, type: enum, source: system, constraints: "RAISED | ACKNOWLEDGED | RESOLVED | DISMISSED", description: "Escalation lifecycle" }

  - name: TrendSnapshot
    parent: Product
    common_fields: false
    fields:
      - { name: product_code, type: string, source: system, description: "FK -> Product.id via product_code" }
      - { name: period_start_at, type: datetime, source: input, description: "Reporting period start (inclusive)" }
      - { name: period_end_at, type: datetime, source: input, description: "Reporting period end (inclusive — closed interval); must be >= period_start_at" }
      - { name: complaint_count, type: integer, source: computed, description: "Complaints for the product with received_at within [period_start_at, period_end_at] inclusive on both ends" }
      - { name: substantiated_count, type: integer, source: computed, description: "Of those, complaints whose latest RCA verdict is SUBSTANTIATED" }
      - { name: substantiation_rate_bps, type: integer, source: computed, description: "floor(substantiated_count * 10000 / complaint_count); 0 when complaint_count == 0" }
      - { name: early_warning, type: boolean, source: computed, description: "Per early_warning_threshold calculation" }
      - { name: evaluated_at, type: datetime, source: system, description: "Logical-clock timestamp when the snapshot was evaluated" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Complaint
    initial_state: INTAKE
    terminal_states: [RESOLVED, WITHDRAWN]
    transitions:
      - from: INTAKE
        to: TRIAGED
        trigger: "POST /complaint-office/complaints/{complaintId}/triage"
        actor: CaseHandler
        preconditions:
          - "complaint.status == INTAKE (ERR_INVALID_STATE_TRANSITION)"
          - "complaint.category_code references a TaxonomyCategory with retired == false (ERR_CATEGORY_RETIRED)"
        side_effects:
          - "Append IntakeEvent(STATUS_CHANGED)"
          - "increments Complaint.version by 1"
          - "Product.posture recomputed for linked product"

      - from: TRIAGED
        to: INVESTIGATING
        trigger: "POST /complaint-office/complaints/{complaintId}/start_investigation"
        actor: CaseHandler
        preconditions:
          - "complaint.status in {TRIAGED, REOPENED} (ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "Append IntakeEvent(STATUS_CHANGED)"
          - "increments Complaint.version by 1"

      - from: REOPENED
        to: INVESTIGATING
        trigger: "POST /complaint-office/complaints/{complaintId}/start_investigation"
        actor: CaseHandler
        preconditions:
          - "complaint.status in {TRIAGED, REOPENED} (ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "Append IntakeEvent(STATUS_CHANGED)"
          - "increments Complaint.version by 1"

      - from: INVESTIGATING
        to: RESPONSE_DRAFTED
        trigger: "POST /complaint-office/complaints/{complaintId}/draft_response"
        actor: CaseHandler
        preconditions:
          - "complaint.status == INVESTIGATING (ERR_INVALID_STATE_TRANSITION)"
          - "A RootCauseAnalysis with status == COMPLETED exists for this complaint (ERR_RCA_REQUIRED)"
          - "If response_template_key supplied: template status == ACTIVE (ERR_TEMPLATE_NOT_ACTIVE) AND template.channel_code == complaint.channel_code AND template.category_code == complaint.category_code (ERR_TEMPLATE_MISMATCH)"
        side_effects:
          - "Append IntakeEvent(RESPONSE_DRAFTED)"
          - "response_text persisted"
          - "increments Complaint.version by 1"

      - from: RESPONSE_DRAFTED
        to: RESPONSE_QA
        trigger: "POST /complaint-office/complaints/{complaintId}/submit_for_qa"
        actor: CaseHandler
        preconditions:
          - "complaint.status == RESPONSE_DRAFTED (ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "Append IntakeEvent(STATUS_CHANGED)"
          - "increments Complaint.version by 1"

      - from: RESPONSE_QA
        to: RESOLVED
        trigger: "POST /complaint-office/complaints/{complaintId}/resolve"
        actor: CaseHandler
        preconditions:
          - "complaint.status == RESPONSE_QA (ERR_INVALID_STATE_TRANSITION)"
          - "A QualityReview with status == COMPLETED and outcome == PASS exists for this complaint (ERR_QA_PASS_REQUIRED)"
          - "No EscalationCase for this complaint in status RAISED or ACKNOWLEDGED (ERR_ESCALATION_OPEN)"
        side_effects:
          - "Append IntakeEvent(STATUS_CHANGED)"
          - "resolved_at = logical-clock now; retention_purge_at = resolved_at + RETENTION_YEARS"
          - "Product.open_complaint_count decremented by 1"
          - "Product.posture recomputed for linked product"
          - "increments Complaint.version by 1"

      - from: RESPONSE_QA
        to: INVESTIGATING
        trigger: "POST /complaint-office/complaints/{complaintId}/qa_fail"
        actor: QAReviewer
        preconditions:
          - "complaint.status == RESPONSE_QA (ERR_INVALID_STATE_TRANSITION)"
          - "The acting QAReviewer holds a QualityReview with status == OPEN for this complaint, completed with outcome == FAIL in the same call"
          - "Segregation of duties: acting X-User-ID != complaint.owner_user_id (ERR_SOD_SELF_REVIEW)"
        side_effects:
          - "QualityReview.status -> COMPLETED with outcome FAIL"
          - "Append IntakeEvent(QA_FAILED)"
          - "increments Complaint.version by 1"

      - from: RESOLVED
        to: REOPENED
        trigger: "POST /complaint-office/complaints/{complaintId}/reopen"
        actor: CaseHandler | ComplaintManager
        preconditions:
          - "complaint.status == RESOLVED (ERR_INVALID_STATE_TRANSITION)"
          - "logical-clock now < retention_purge_at (ERR_RETENTION_EXPIRED)"
        side_effects:
          - "Append IntakeEvent(REOPENED)"
          - "resolved_at = null; retention_purge_at = null"
          - "Product.open_complaint_count incremented by 1"
          - "Product.posture recomputed for linked product"
          - "increments Complaint.version by 1"
        note: "Cyclic loop: RESOLVED -> REOPENED -> INVESTIGATING -> ... -> RESOLVED may repeat"

      - from: INTAKE
        to: WITHDRAWN
        trigger: "POST /complaint-office/complaints/{complaintId}/withdraw"
        actor: CaseHandler | ComplaintManager
        preconditions:
          - "complaint.status in {INTAKE, TRIAGED, INVESTIGATING, RESPONSE_DRAFTED, RESPONSE_QA} (ERR_INVALID_STATE_TRANSITION)"
          - "No RegulatoryReferral for this complaint with status in {OPEN, REOPENED_BY_REGULATOR} (ERR_REFERRAL_OPEN)"
        side_effects:
          - "Append IntakeEvent(WITHDRAWN)"
          - "resolved_at = logical-clock now; retention_purge_at = resolved_at + RETENTION_YEARS"
          - "Product.open_complaint_count decremented by 1"
          - "Product.posture recomputed for linked product"
          - "increments Complaint.version by 1"

      - from: TRIAGED
        to: WITHDRAWN
        trigger: "POST /complaint-office/complaints/{complaintId}/withdraw"
        actor: CaseHandler | ComplaintManager
        preconditions:
          - "complaint.status in {INTAKE, TRIAGED, INVESTIGATING, RESPONSE_DRAFTED, RESPONSE_QA} (ERR_INVALID_STATE_TRANSITION)"
          - "No RegulatoryReferral for this complaint with status in {OPEN, REOPENED_BY_REGULATOR} (ERR_REFERRAL_OPEN)"
        side_effects:
          - "Append IntakeEvent(WITHDRAWN)"
          - "resolved_at = logical-clock now; retention_purge_at = resolved_at + RETENTION_YEARS"
          - "Product.open_complaint_count decremented by 1"
          - "Product.posture recomputed for linked product"
          - "increments Complaint.version by 1"

      - from: INVESTIGATING
        to: WITHDRAWN
        trigger: "POST /complaint-office/complaints/{complaintId}/withdraw"
        actor: CaseHandler | ComplaintManager
        preconditions:
          - "complaint.status in {INTAKE, TRIAGED, INVESTIGATING, RESPONSE_DRAFTED, RESPONSE_QA} (ERR_INVALID_STATE_TRANSITION)"
          - "No RegulatoryReferral for this complaint with status in {OPEN, REOPENED_BY_REGULATOR} (ERR_REFERRAL_OPEN)"
        side_effects:
          - "Append IntakeEvent(WITHDRAWN)"
          - "resolved_at = logical-clock now; retention_purge_at = resolved_at + RETENTION_YEARS"
          - "Product.open_complaint_count decremented by 1"
          - "Product.posture recomputed for linked product"
          - "increments Complaint.version by 1"

      - from: RESPONSE_DRAFTED
        to: WITHDRAWN
        trigger: "POST /complaint-office/complaints/{complaintId}/withdraw"
        actor: CaseHandler | ComplaintManager
        preconditions:
          - "complaint.status in {INTAKE, TRIAGED, INVESTIGATING, RESPONSE_DRAFTED, RESPONSE_QA} (ERR_INVALID_STATE_TRANSITION)"
          - "No RegulatoryReferral for this complaint with status in {OPEN, REOPENED_BY_REGULATOR} (ERR_REFERRAL_OPEN)"
        side_effects:
          - "Append IntakeEvent(WITHDRAWN)"
          - "resolved_at = logical-clock now; retention_purge_at = resolved_at + RETENTION_YEARS"
          - "Product.open_complaint_count decremented by 1"
          - "Product.posture recomputed for linked product"
          - "increments Complaint.version by 1"

      - from: RESPONSE_QA
        to: WITHDRAWN
        trigger: "POST /complaint-office/complaints/{complaintId}/withdraw"
        actor: CaseHandler | ComplaintManager
        preconditions:
          - "complaint.status in {INTAKE, TRIAGED, INVESTIGATING, RESPONSE_DRAFTED, RESPONSE_QA} (ERR_INVALID_STATE_TRANSITION)"
          - "No RegulatoryReferral for this complaint with status in {OPEN, REOPENED_BY_REGULATOR} (ERR_REFERRAL_OPEN)"
        side_effects:
          - "Append IntakeEvent(WITHDRAWN)"
          - "resolved_at = logical-clock now; retention_purge_at = resolved_at + RETENTION_YEARS"
          - "Product.open_complaint_count decremented by 1"
          - "Product.posture recomputed for linked product"
          - "increments Complaint.version by 1"

  - entity: RegulatoryReferral
    initial_state: OPEN
    terminal_states: [CLOSED_BY_REGULATOR]
    transitions:
      - from: OPEN
        to: RESPONSE_SUBMITTED
        trigger: "POST /complaint-office/referrals/{referralId}/submit_response"
        actor: CaseHandler
        preconditions:
          - "referral.status in {OPEN, REOPENED_BY_REGULATOR} (ERR_INVALID_STATE_TRANSITION)"
          - "response_text non-empty (ERR_INVALID_REQUEST)"
        side_effects:
          - "submitted_at = logical-clock now; timeliness = ON_TIME iff submitted_at <= response_due_at else LATE"
          - "Complaint.timeliness_score recomputed per response_timeliness_score"
          - "Append IntakeEvent(REFERRAL_RESPONDED) on parent complaint"
          - "increments RegulatoryReferral.version by 1"

      - from: REOPENED_BY_REGULATOR
        to: RESPONSE_SUBMITTED
        trigger: "POST /complaint-office/referrals/{referralId}/submit_response"
        actor: CaseHandler
        preconditions:
          - "referral.status in {OPEN, REOPENED_BY_REGULATOR} (ERR_INVALID_STATE_TRANSITION)"
          - "response_text non-empty (ERR_INVALID_REQUEST)"
        side_effects:
          - "submitted_at = logical-clock now; timeliness recomputed against the SAME response_due_at (deadline does not extend on reopen)"
          - "Complaint.timeliness_score recomputed per response_timeliness_score"
          - "Append IntakeEvent(REFERRAL_RESPONDED) on parent complaint"
          - "increments RegulatoryReferral.version by 1"

      - from: RESPONSE_SUBMITTED
        to: CLOSED_BY_REGULATOR
        trigger: "POST /complaint-office/referrals/{referralId}/close"
        actor: ComplaintManager
        preconditions:
          - "referral.status == RESPONSE_SUBMITTED (ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "increments RegulatoryReferral.version by 1"

      - from: RESPONSE_SUBMITTED
        to: REOPENED_BY_REGULATOR
        trigger: "POST /complaint-office/referrals/{referralId}/regulator_reopen"
        actor: ComplaintManager
        preconditions:
          - "referral.status == RESPONSE_SUBMITTED (ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "increments RegulatoryReferral.version by 1"
          - "Cascade hop 2: parent Complaint, if status == RESOLVED, transitions to REOPENED (resolved_at = null, retention_purge_at = null, increments Complaint.version by 1)"
          - "Cascade hop 3: when hop 2 fired, Product.open_complaint_count incremented by 1 and Product.posture recomputed"
        note: "Cyclic dimension: RESPONSE_SUBMITTED -> REOPENED_BY_REGULATOR -> RESPONSE_SUBMITTED may repeat; timeliness always re-derives against the original response_due_at"

  - entity: RootCauseAnalysis
    initial_state: DRAFT
    terminal_states: [COMPLETED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: COMPLETED
        trigger: "POST /complaint-office/rcas/{rcaId}/complete"
        actor: CaseHandler
        preconditions:
          - "rca.status == DRAFT (ERR_INVALID_STATE_TRANSITION)"
          - "verdict in {SUBSTANTIATED, NOT_SUBSTANTIATED, INCONCLUSIVE} (ERR_INVALID_REQUEST)"
          - "logical-clock now <= complaint.received_at + RCA_DEADLINE_DAYS calendar days (ERR_RCA_DEADLINE_PASSED)"
        side_effects:
          - "completed_at = logical-clock now"
          - "increments RootCauseAnalysis.version by 1"
          - "If verdict == SUBSTANTIATED: Product.substantiated_count_90d recomputed for linked_product_code and Product.posture recomputed (cascade hop 2)"

      - from: DRAFT
        to: SUPERSEDED
        trigger: "system (POST /complaint-office/complaints/{complaintId}/rcas supersedes any prior DRAFT RCA of the same complaint)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: RemediationDecision
    initial_state: DRAFT
    terminal_states: [PAID, REJECTED, REVERSED]
    transitions:
      - from: DRAFT
        to: PENDING_APPROVAL
        trigger: "POST /complaint-office/remediation-decisions/{decisionId}/submit"
        actor: CaseHandler
        preconditions:
          - "decision.status == DRAFT (ERR_INVALID_STATE_TRANSITION)"
          - "If decision_type in {RESTITUTION, CORRECTION_AND_RESTITUTION}: line_items non-empty and restitution_amount_cents > 0 (ERR_INVALID_REQUEST)"
          - "Parent complaint.status in {INVESTIGATING, RESPONSE_DRAFTED, RESPONSE_QA, RESOLVED, REOPENED} (ERR_COMPLAINT_NOT_REMEDIABLE)"
        side_effects:
          - "increments RemediationDecision.version by 1"

      - from: PENDING_APPROVAL
        to: APPROVED
        trigger: "POST /complaint-office/remediation-decisions/{decisionId}/approve"
        actor: RemediationApprover
        preconditions:
          - "decision.status == PENDING_APPROVAL (ERR_INVALID_STATE_TRANSITION)"
          - "Segregation of duties: acting X-User-ID != decision.drafted_by_user_id (ERR_SOD_SELF_APPROVAL)"
          - "If restitution_amount_cents > RESTITUTION_AUTHORITY_CAP_CENTS: acting user must carry the ComplaintManager authority flag supplied as request header X-Manager-Authority: true (ERR_RESTITUTION_OVER_AUTHORITY)"
        side_effects:
          - "approved_by_user_id = acting X-User-ID"
          - "Complaint.approved_restitution_cents recomputed (increases by restitution_amount_cents)"
          - "Append IntakeEvent(REMEDIATION_APPROVED) on parent complaint"
          - "increments RemediationDecision.version by 1"

      - from: PENDING_APPROVAL
        to: REJECTED
        trigger: "POST /complaint-office/remediation-decisions/{decisionId}/reject"
        actor: RemediationApprover
        preconditions:
          - "decision.status == PENDING_APPROVAL (ERR_INVALID_STATE_TRANSITION)"
          - "Segregation of duties: acting X-User-ID != decision.drafted_by_user_id (ERR_SOD_SELF_APPROVAL)"
        side_effects:
          - "increments RemediationDecision.version by 1"

      - from: APPROVED
        to: PAID
        trigger: "POST /complaint-office/remediation-decisions/{decisionId}/mark_paid"
        actor: CaseHandler
        preconditions:
          - "decision.status == APPROVED (ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "Complaint.paid_restitution_cents recomputed (increases by restitution_amount_cents)"
          - "Append IntakeEvent(REMEDIATION_PAID) on parent complaint"
          - "increments RemediationDecision.version by 1"

      - from: APPROVED
        to: REVERSED
        trigger: "POST /complaint-office/remediation-decisions/{decisionId}/reverse"
        actor: RemediationApprover
        preconditions:
          - "decision.status == APPROVED (ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "Complaint.approved_restitution_cents recomputed (decreases by restitution_amount_cents)"
          - "Append IntakeEvent(REMEDIATION_REVERSED) on parent complaint"
          - "increments RemediationDecision.version by 1"
        note: "Compensation: APPROVE then REVERSE restores approved_restitution_cents to its pre-approval value"

  - entity: ResponseTemplate
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /complaint-office/response-templates/{templateId}/publish"
        actor: ComplaintManager
        preconditions:
          - "template.status == DRAFT (ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "Any other ResponseTemplate with the same (channel_code, category_code) pair in ACTIVE status auto-transitions to RETIRED (supersede-on-publish; increments that template's version by 1)"
          - "increments ResponseTemplate.version by 1"

      - from: ACTIVE
        to: RETIRED
        trigger: "POST /complaint-office/response-templates/{templateId}/retire"
        actor: ComplaintManager
        preconditions:
          - "template.status == ACTIVE (ERR_INVALID_STATE_TRANSITION)"
          - "No Complaint in status RESPONSE_DRAFTED or RESPONSE_QA references this template via response_template_key (ERR_TEMPLATE_IN_USE)"
        side_effects:
          - "increments ResponseTemplate.version by 1"

  - entity: QualityReview
    initial_state: OPEN
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: OPEN
        to: COMPLETED
        trigger: "POST /complaint-office/quality-reviews/{reviewId}/complete"
        actor: QAReviewer
        preconditions:
          - "review.status == OPEN (ERR_INVALID_STATE_TRANSITION)"
          - "acting X-User-ID == review.reviewer_user_id (ERR_REVIEW_NOT_OWNED)"
          - "outcome in {PASS, FAIL} (ERR_INVALID_REQUEST)"
          - "Segregation of duties: acting X-User-ID != complaint.owner_user_id (ERR_SOD_SELF_REVIEW)"
        side_effects:
          - "outcome persisted; Append IntakeEvent(QA_PASSED) when PASS else IntakeEvent(QA_FAILED)"
          - "Complaint.timeliness_score recomputed (qa_bonus input changed)"
          - "increments QualityReview.version by 1"

      - from: OPEN
        to: CANCELLED
        trigger: "POST /complaint-office/quality-reviews/{reviewId}/cancel"
        actor: QAReviewer | ComplaintManager
        preconditions:
          - "review.status == OPEN (ERR_INVALID_STATE_TRANSITION)"
          - "If acting role == QAReviewer: acting X-User-ID == review.reviewer_user_id (ERR_REVIEW_NOT_OWNED)"
        side_effects:
          - "increments QualityReview.version by 1"

  - entity: EscalationCase
    initial_state: RAISED
    terminal_states: [RESOLVED, DISMISSED]
    transitions:
      - from: RAISED
        to: ACKNOWLEDGED
        trigger: "POST /complaint-office/escalations/{escalationId}/acknowledge"
        actor: ExecutiveReviewer
        preconditions:
          - "escalation.status == RAISED (ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "increments EscalationCase.version by 1"

      - from: ACKNOWLEDGED
        to: RESOLVED
        trigger: "POST /complaint-office/escalations/{escalationId}/resolve"
        actor: ExecutiveReviewer
        preconditions:
          - "escalation.status == ACKNOWLEDGED (ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "Append IntakeEvent(ESCALATION_RESOLVED) on parent complaint"
          - "increments EscalationCase.version by 1"

      - from: RAISED
        to: DISMISSED
        trigger: "POST /complaint-office/escalations/{escalationId}/dismiss"
        actor: ExecutiveReviewer
        preconditions:
          - "escalation.status == RAISED (ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "increments EscalationCase.version by 1"

  - entity: Product
    initial_state: OPEN
    terminal_states: []
    transitions:
      - from: OPEN
        to: WATCH
        trigger: "system (posture recompute per product_posture calculation)"
        actor: system
        preconditions:
          - "early_warning_active == true OR substantiated_count_90d >= POSTURE_WATCH_SUBSTANTIATED"
          - "substantiated_count_90d < POSTURE_FREEZE_SUBSTANTIATED"
        side_effects: []

      - from: WATCH
        to: FROZEN
        trigger: "system (posture recompute per product_posture calculation)"
        actor: system
        preconditions:
          - "substantiated_count_90d >= POSTURE_FREEZE_SUBSTANTIATED"
        side_effects:
          - "Complaint intake on this product is rejected while posture == FROZEN (ERR_PRODUCT_FROZEN)"

      - from: OPEN
        to: FROZEN
        trigger: "system (posture recompute per product_posture calculation)"
        actor: system
        preconditions:
          - "substantiated_count_90d >= POSTURE_FREEZE_SUBSTANTIATED"
        side_effects:
          - "Complaint intake on this product is rejected while posture == FROZEN (ERR_PRODUCT_FROZEN)"

      - from: WATCH
        to: OPEN
        trigger: "system (posture recompute per product_posture calculation)"
        actor: system
        preconditions:
          - "early_warning_active == false AND substantiated_count_90d < POSTURE_WATCH_SUBSTANTIATED"
        side_effects: []

      - from: FROZEN
        to: WATCH
        trigger: "POST /complaint-office/products/{productId}/unfreeze (manual override) OR system (posture recompute when substantiated_count_90d < POSTURE_FREEZE_SUBSTANTIATED)"
        actor: ComplaintManager | system
        preconditions:
          - "System path: substantiated_count_90d < POSTURE_FREEZE_SUBSTANTIATED"
        side_effects:
          - "Manual path increments Product.version by 1"
    note: "Compound/posture-driven machine: Product.posture derives from complaint + RCA aggregates and gates complaint intake"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: taxonomy-recode-stale-complaint
    parent_entity: Complaint
    write_endpoint: "POST /complaint-office/complaints/{complaintId}/taxonomy_recodes"
    occ_field: "expected_complaint_version"
    description: |
      Recoding a complaint's taxonomy category against a Complaint whose
      version has advanced since the client last observed it is rejected.
      A recode supersedes the current category assignment, so a client
      holding a stale view of the complaint (e.g., another writer has just
      recoded, triaged, or otherwise mutated the complaint, each of which
      legitimately advances the version) must be refused rather than
      silently overwrite the newer assignment.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: remediation-create-stale-complaint
    parent_entity: Complaint
    write_endpoint: "POST /complaint-office/complaints/{id}/remediation_decisions"
    occ_field: "expected_complaint_version"
    description: |
      Creating a RemediationDecision against a Complaint whose version has
      advanced since the client last observed it is rejected. A new
      decision is drafted against the complaint's current fact pattern;
      when another writer has since mutated the complaint (status change,
      recode, referral submission), the drafting basis is stale and the
      create must be refused.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: complaint_age_calendar
    trigger: "on read of any Complaint; on posture recompute"
    algorithm: chronological
    formula: |
      end_at = resolved_at when complaint.status in {RESOLVED, WITHDRAWN} else clock_now()
      days_open_calendar = floor((end_at - complaint.received_at) / 86400 seconds)
      Both timestamps are logical-clock UTC; fractional days are discarded.
    input_set: "Single complaint; no state filter beyond terminal detection via resolved_at"
    precision: "integer days, truncation toward zero"
    variants:
      - name: open_baseline
        when: "complaint is non-terminal (resolved_at is null)"
        difference: "end_at is the current logical clock; value grows as the clock advances"
      - name: terminal_frozen
        when: "complaint is RESOLVED or WITHDRAWN"
        difference: "end_at is frozen at resolved_at; later clock movement does not change the value"

  - name: complaint_age_business
    trigger: "on read of any Complaint; on posture recompute"
    algorithm: chronological
    formula: |
      end_at = resolved_at when terminal else clock_now()
      Count calendar dates strictly after date(received_at) and on-or-before
      date(end_at) whose weekday is Monday..Friday and which are not in the
      fixed holiday set HOLIDAYS. The intake date itself is never counted.
    input_set: "Single complaint"
    constants:
      HOLIDAYS: ["2026-01-01", "2026-07-04", "2026-12-25"]
    precision: "integer business days"
    variants:
      - name: calendar_baseline
        when: "compared against complaint_age_calendar for identical received_at/end_at"
        difference: "Business count is strictly smaller than the calendar count whenever any weekend or holiday date falls inside the window — dual-variant divergence on the same entity pair"

  - name: restitution_amount
    trigger: "RemediationDecision create"
    algorithm: tiered_pricing
    formula: |
      # PINNED ROUNDING ORDER: round per line item, THEN sum.
      restitution_amount_cents = sum(
        floor(li.amount_cents * (li.rounding_rate_bps ?? 10000) / 10000)
        for li in line_items
      )
      # Summing raw amounts first and flooring once at the end yields a
      # different total whenever two or more lines carry a sub-10000 bps
      # rate. The scaffold pins per-line-floor-then-sum; the alternative
      # order is a spec violation.
    input_set: "The decision's own line_items"
    precision: "integer cents; floor applied per line BEFORE summation"

  - name: response_timeliness_score
    trigger: "RegulatoryReferral.submit_response; QualityReview complete"
    algorithm: weighted_scoring
    formula: |
      # >=3 inputs with non-linear interaction (nested min/max, conditional
      # branches on entity state, tiered bonus selection).
      days_to_respond = floor((referral.submitted_at - complaint.received_at) / 86400 seconds)
      base = max(0, 100 - 5 * days_to_respond)
      late_multiplier = 0.5 when referral.timeliness == LATE else 1.0
      qa_bonus = 10 when latest COMPLETED QualityReview.outcome == PASS,
                 -15 when FAIL, 0 when no completed review exists
      high_value_bonus = 5 when complaint.claimed_loss_cents >= HIGH_VALUE_CLAIM_CENTS else 0
      score = min(100, floor(base * late_multiplier) + qa_bonus + high_value_bonus)
      score = max(0, score)
      # Evaluation order pinned: floor applies to base*late_multiplier BEFORE
      # bonuses are added; the two clamp passes wrap the whole expression.
    input_set: "Parent complaint + its RegulatoryReferral + latest COMPLETED QualityReview (if any)"
    constants:
      HIGH_VALUE_CLAIM_CENTS: 1000000
    precision: "integer score in [0,100]; floor(base*multiplier) before bonuses"

  - name: early_warning_threshold
    trigger: "POST /complaint-office/products/{productId}/trend-snapshots (evaluated at snapshot creation)"
    algorithm: threshold
    formula: |
      # Circular-looking dependency with pinned evaluation order:
      #   1. complaint_count  = |complaints of product with received_at in
      #      [period_start_at, period_end_at] inclusive on BOTH ends|
      #   2. substantiated_count = subset whose latest RCA verdict == SUBSTANTIATED
      #   3. substantiation_rate_bps = 0 when complaint_count == 0 else
      #      floor(substantiated_count * 10000 / complaint_count)
      #   4. open_now = live recompute of Product.open_complaint_count
      #   5. early_warning = (complaint_count >= EW_MIN_COUNT) AND
      #      (substantiation_rate_bps >= EW_RATE_BPS OR open_now >= EW_OPEN_COUNT)
      # An empty window (complaint_count == 0) NEVER warns, regardless of open_now.
    input_set: "Complaints of this product with received_at inside the CLOSED interval [period_start_at, period_end_at]; latest RCA per complaint; live product open count"
    constants:
      EW_MIN_COUNT: 3
      EW_RATE_BPS: 5000
      EW_OPEN_COUNT: 10
    precision: "integer bps via floor; boolean output"

  - name: product_posture
    trigger: "any complaint status change on the product; RCA completion; trend snapshot evaluation; clock set; manual unfreeze"
    algorithm: threshold
    formula: |
      # Aggregates refreshed first (derived-field reconciliation), then posture.
      open_complaint_count = |complaints of product with status in
        {INTAKE, TRIAGED, INVESTIGATING, RESPONSE_DRAFTED, RESPONSE_QA, REOPENED}|
      substantiated_count_90d = |complaints of product whose latest RCA verdict
        == SUBSTANTIATED AND received_at >= clock_now() - 90 days|
      if substantiated_count_90d >= POSTURE_FREEZE_SUBSTANTIATED: FROZEN
      elif early_warning_active == true OR substantiated_count_90d >= POSTURE_WATCH_SUBSTANTIATED: WATCH
      else: OPEN
    input_set: "All complaints of the product in non-terminal status; their latest RCAs; latest TrendSnapshot per product"
    constants:
      POSTURE_WATCH_SUBSTANTIATED: 3
      POSTURE_FREEZE_SUBSTANTIATED: 5
    precision: "enum; boundary comparisons are >= (inclusive) exactly as written"

  - name: retention_purge_at
    trigger: "Complaint resolve or withdraw; complaint reopen (clears)"
    algorithm: forward_looking
    formula: |
      On terminal transition: retention_purge_at = resolved_at + RETENTION_YEARS years
      (same calendar date N years later; Feb 29 maps to Feb 28 in non-leap years)
      On reopen or regulator-reopen cascade: retention_purge_at = null
    input_set: "Single complaint"
    constants:
      RETENTION_YEARS: 5
    precision: "datetime, second precision"
    variants:
      - name: provisional_null
        when: "complaint non-terminal"
        difference: "retention_purge_at is null — purge eligibility exists only for terminal complaints; dual-variant divergence vs terminal_frozen on the same field"
      - name: terminal_frozen
        when: "complaint terminal"
        difference: "fixed resolved_at + 5y value, immune to later clock movement"

  - name: response_due_at
    trigger: "RegulatoryReferral creation"
    algorithm: forward_looking
    formula: |
      response_due_at = received_via_portal_at + REFERRAL_RESPONSE_DAYS calendar days
      Calendar-day arithmetic; no business-day adjustment; time-of-day preserved.
      Timeliness comparison is submitted_at <= response_due_at (inclusive boundary).
    input_set: "Single referral"
    constants:
      REFERRAL_RESPONSE_DAYS: 15
    precision: "datetime, second precision"

  - name: referral_auto_creation
    trigger: "Complaint intake when channel.is_regulator_portal == true"
    algorithm: constraint_propagation
    formula: |
      On POST /complaints with a portal channel: create Complaint AND
      RegulatoryReferral in the same atomic request. received_via_portal_at =
      complaint.received_at. portal_ref defaults to "AUTO-" + complaint.id when
      portal_ref is not supplied in the intake payload.
    input_set: "Intake request"
    precision: "n/a"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present; role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Role permitted for this endpoint per RBAC matrix"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Path-template ids exist (validated left-to-right); business codes in body reference live records"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all resource endpoints"

  - priority: 4
    category: existence
    check: "Required request-body fields present and typed correctly; enum members valid; integer ranges enforced (claimed_loss_cents >= 0, line item amount_cents >= 0); window_end_at strictly after window_start_at"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all write endpoints"

  - priority: 5
    category: business_safety
    check: "Complaint intake is rejected when the linked Product.posture == FROZEN"
    error_id: ERR_PRODUCT_FROZEN
    http_status: 409
    applies_to: "POST /complaint-office/complaints"

  - priority: 6
    category: business_safety
    check: "Segregation of duties: QA review completion and qa_fail rejected when acting user == complaint.owner_user_id"
    error_id: ERR_SOD_SELF_REVIEW
    http_status: 409
    applies_to: "POST /complaint-office/quality-reviews/{reviewId}/complete; POST /complaint-office/complaints/{complaintId}/qa_fail"

  - priority: 7
    category: business_safety
    check: "Segregation of duties: remediation approve/reject rejected when acting user == decision.drafted_by_user_id"
    error_id: ERR_SOD_SELF_APPROVAL
    http_status: 409
    applies_to: "POST /complaint-office/remediation-decisions/{decisionId}/approve; POST /complaint-office/remediation-decisions/{decisionId}/reject"

  - priority: 8
    category: state
    check: "Target resource must be in a valid from-state for the requested transition"
    error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    applies_to: "all action endpoints"

  - priority: 9
    category: business_referential
    check: "Retired taxonomy categories cannot be assigned at intake or recode"
    error_id: ERR_CATEGORY_RETIRED
    http_status: 409
    applies_to: "POST /complaint-office/complaints; POST /complaint-office/complaints/{complaintId}/taxonomy_recodes"

  - priority: 10
    category: business_referential
    check: "Response template must exist, be ACTIVE, and match complaint channel+category at draft time"
    error_id: "ERR_TEMPLATE_NOT_ACTIVE | ERR_TEMPLATE_MISMATCH"
    http_status: 409
    applies_to: "POST /complaint-office/complaints/{complaintId}/draft_response"

  - priority: 11
    category: business_temporal
    check: "RCA completion rejected when logical clock is past complaint.received_at + RCA_DEADLINE_DAYS (30) calendar days (inclusive boundary: completion exactly at deadline succeeds)"
    error_id: ERR_RCA_DEADLINE_PASSED
    http_status: 409
    applies_to: "POST /complaint-office/rcas/{rcaId}/complete"

  - priority: 12
    category: business_temporal
    check: "Complaint reopen rejected when logical clock is at or past retention_purge_at"
    error_id: ERR_RETENTION_EXPIRED
    http_status: 409
    applies_to: "POST /complaint-office/complaints/{complaintId}/reopen"

  - priority: 13
    category: business_temporal
    check: "A QAReviewer may not hold two OPEN QualityReviews whose [window_start_at, window_end_at) half-open intervals overlap; touching endpoints (end == start) do NOT overlap"
    error_id: ERR_REVIEW_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /complaint-office/complaints/{id}/quality-reviews"

  - priority: 14
    category: business_temporal
    check: "TrendSnapshot windows for the same product use CLOSED intervals and must not overlap: rejected when period_start_at <= existing.period_end_at AND existing.period_start_at <= period_end_at; windows sharing exactly one boundary date DO overlap under closed semantics"
    error_id: ERR_SNAPSHOT_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /complaint-office/products/{id}/trend-snapshots"

  - priority: 15
    category: business_constraint
    check: "draft_response requires a COMPLETED RCA; resolve requires a COMPLETED PASS QualityReview and no open escalation"
    error_id: "ERR_RCA_REQUIRED | ERR_QA_PASS_REQUIRED | ERR_ESCALATION_OPEN"
    http_status: 409
    applies_to: "POST /complaint-office/complaints/{complaintId}/draft_response; POST /complaint-office/complaints/{complaintId}/resolve"

  - priority: 16
    category: business_fiscal
    check: "Restitution approval with restitution_amount_cents > RESTITUTION_AUTHORITY_CAP_CENTS requires header X-Manager-Authority: true on the acting RemediationApprover"
    error_id: ERR_RESTITUTION_OVER_AUTHORITY
    http_status: 409
    applies_to: "POST /complaint-office/remediation-decisions/{decisionId}/approve"

  - priority: 17
    category: business_constraint
    check: "withdraw blocked while a referral of the complaint is OPEN or REOPENED_BY_REGULATOR"
    error_id: ERR_REFERRAL_OPEN
    http_status: 409
    applies_to: "POST /complaint-office/complaints/{complaintId}/withdraw"

  - priority: 18
    category: business_constraint
    check: "Template retire blocked while any complaint in RESPONSE_DRAFTED or RESPONSE_QA references it"
    error_id: ERR_TEMPLATE_IN_USE
    http_status: 409
    applies_to: "POST /complaint-office/response-templates/{templateId}/retire"

  - priority: 19
    category: business_constraint
    check: "OCC: expected_complaint_version must equal the complaint's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /complaint-office/complaints/{complaintId}/taxonomy_recodes; POST /complaint-office/complaints/{id}/remediation_decisions"

  - priority: 20
    category: business_constraint
    check: "QualityReview complete/cancel by QAReviewer requires acting user == reviewer_user_id"
    error_id: ERR_REVIEW_NOT_OWNED
    http_status: 409
    applies_to: "POST /complaint-office/quality-reviews/{reviewId}/complete; POST /complaint-office/quality-reviews/{reviewId}/cancel"

  - priority: 21
    category: business_constraint
    check: "Remediation submit blocked while parent complaint is INTAKE, TRIAGED, or WITHDRAWN"
    error_id: ERR_COMPLAINT_NOT_REMEDIABLE
    http_status: 409
    applies_to: "POST /complaint-office/remediation-decisions/{decisionId}/submit"

constants:
  REFERRAL_RESPONSE_DAYS: 15
  RCA_DEADLINE_DAYS: 30
  RETENTION_YEARS: 5
  RESTITUTION_AUTHORITY_CAP_CENTS: 2500000
  HIGH_VALUE_CLAIM_CENTS: 1000000
  EW_MIN_COUNT: 3
  EW_RATE_BPS: 5000
  EW_OPEN_COUNT: 10
  POSTURE_WATCH_SUBSTANTIATED: 3
  POSTURE_FREEZE_SUBSTANTIATED: 5

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Logical clock (test-driving; mandatory default) ---
  - method: POST
    path: "/complaint-office/_clock/set_current_utc"
    description: "Set the logical clock. Server startup default is exactly 2026-08-01T00:00:00Z; before any set_current_utc call the logical clock reads this default and never falls back to wall-clock time."
    roles: [ComplaintManager]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects:
      - "All deadline/expiry/window rules read this clock"
      - "Product.posture recomputed for all products (90-day window membership shifts)"

