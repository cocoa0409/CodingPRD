              as: PlanActuary
              as_user_id: "act-001"
            - call: "POST /plan-year-valuations"
              payload: { plan_id: "${plan_id}", plan_year: 2025, measurement_window_start: "2025-01-01T00:00:00Z", measurement_window_end: "2025-10-01T00:00:00Z", uvb_total_cents: 10000000000, uvb_pool_cents: 1000000000, all_employer_contributions_cents: 2000000000, all_employer_cbu: 2000000, interest_rate_bps: 700, certify_on_create: true }
              as: PlanActuary
              as_user_id: "act-001"
            - call: "POST /contribution-records"
              payload: { employer_id: "${emp_id}", plan_year_start: 2021, plan_year_end: 2025, contribution_base_units: 250000, contribution_amount_cents: 250000000, contribution_rate_cents_per_cbu: 1000, expected_employer_version: "${emp_v1}" }
              as: FundAdministrator
              as_user_id: "fa-001"
            - call: "POST /withdrawal-events"
              payload: { employer_id: "${emp_id}", cessation_date: "2026-06-30T00:00:00Z", withdrawal_plan_year: 2026, reported_cause: "CBU_DECLINE" }
              as: FundAdministrator
              as_user_id: "fa-001"
              captures: { we_id: "$.data.id" }
          trigger:
            - call: "POST /withdrawal-events/${we_id}/determine"
              payload: {}
              as: PlanActuary
              as_user_id: "act-001"
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 422 with data.error_id == \"ERR_PARTIAL_WITHDRAWAL_NOT_AVAILABLE\"."
            - "GET /withdrawal-events/${we_id} still reports status == \"REPORTED\", rules_variant == \"CONSTRUCTION_RULES\", determined_type == \"NONE\" and decline_ratio == 0.000000: the decline test never ran."
            - "GET /employers/${emp_id} still reports status == \"CONTRIBUTING\"."

      - name: certifying_a_sale_exemption_the_buyer_has_not_assumed_is_rejected
        claim_type: Priority conflict
        grounds:
          - "validations[priority=12]"
          - "errors[ERR_4204_OBLIGATION_NOT_ASSUMED]"
          - "validations[priority=9]"
        distinguishing_aspect: |
          The bond is deliberately made SUFFICIENT here - the purchase-price cap trims the
          requirement to exactly the posted amount - so the priority-9 safety check passes
          and the priority-12 constraint is the one that must answer. A server that folds
          both conditions into one guard reports ERR_4204_BOND_INSUFFICIENT and misleads
          the buyer into posting more money. The DETERMINE_SUCCESSOR branch then succeeds
          on the same row, proving only the exemption disposition carries the requirement.
        test_recipe:
          setup:
            - "The seller employer with the 2023-2025 contribution history, a buyer controlled group, and a sale closing in 2026 at a purchase price of 20000000 with a 20000000 bond posted, where the buyer has NOT assumed the contribution obligation. The required bond is min(max(25000000, 30000000), 20000000) == 20000000, so the bond is exactly sufficient."
          setup_api_calls:
            - call: "POST /plans"
              payload: { name: "Ironworkers District Pension Fund", industry: "GENERAL", allocation_method: "MODIFIED_PRESUMPTIVE", de_minimis_variant: "STATUTORY", interest_rate_bps: 700, mass_withdrawal_declared: false }
              as: FundAdministrator
              as_user_id: "fa-001"
              captures: { plan_id: "$.data.id" }
            - call: "POST /controlled-groups"
              payload: { name: "Meridian Holdings Group", common_control_basis: "PARENT_SUBSIDIARY" }
              as: FundAdministrator
              as_user_id: "fa-001"
              captures: { cg_id: "$.data.id" }
            - call: "POST /employers"
              payload: { plan_id: "${plan_id}", controlled_group_id: "${cg_id}", legal_name: "Meridian Steel Erectors LLC", ein: "410000101", obligation_start_year: 2021, covered_work_status: "PERFORMING", cba_count: 1 }
              as: FundAdministrator
              as_user_id: "fa-001"
              captures: { emp_id: "$.data.id", emp_v1: "$.data.version" }
            - call: "POST /controlled-groups"
              payload: { name: "Northgate Acquisition Group", common_control_basis: "COMBINED" }
              as: FundAdministrator
              as_user_id: "fa-001"
              captures: { buyer_cg_id: "$.data.id" }
            - call: "POST /contribution-records"
              payload: { employer_id: "${emp_id}", plan_year_start: 2023, plan_year_end: 2023, contribution_base_units: 20000, contribution_amount_cents: 20000000, contribution_rate_cents_per_cbu: 1000, expected_employer_version: "${emp_v1}" }
              as: FundAdministrator
              as_user_id: "fa-001"
            - call: "GET /employers/${emp_id}"
              payload: {}
              as: FundAdministrator
              as_user_id: "fa-001"
              captures: { emp_v2: "$.data.version" }
            - call: "POST /contribution-records"
              payload: { employer_id: "${emp_id}", plan_year_start: 2024, plan_year_end: 2024, contribution_base_units: 25000, contribution_amount_cents: 25000000, contribution_rate_cents_per_cbu: 1000, expected_employer_version: "${emp_v2}" }
              as: FundAdministrator
              as_user_id: "fa-001"
            - call: "GET /employers/${emp_id}"
              payload: {}
              as: FundAdministrator
              as_user_id: "fa-001"
              captures: { emp_v3: "$.data.version" }
            - call: "POST /contribution-records"
              payload: { employer_id: "${emp_id}", plan_year_start: 2025, plan_year_end: 2025, contribution_base_units: 30000, contribution_amount_cents: 30000000, contribution_rate_cents_per_cbu: 1000, expected_employer_version: "${emp_v3}" }
              as: FundAdministrator
              as_user_id: "fa-001"
            - call: "POST /asset-sale-transactions"
              payload: { seller_employer_id: "${emp_id}", buyer_controlled_group_id: "${buyer_cg_id}", closing_date: "2026-05-01T00:00:00Z", closing_plan_year: 2026, purchase_price_cents: 20000000, bond_amount_cents: 20000000, buyer_assumes_contribution_obligation: false, workforce_continuity_pct: 0.8, asset_continuity_pct: 0.6, customer_continuity_pct: 0.6 }
              as: FundAdministrator
              as_user_id: "fa-001"
              captures: { sale_id: "$.data.id" }
          trigger:
            - call: "POST /asset-sale-transactions/${sale_id}/adjudicate"
              payload: { disposition: "CERTIFY_4204_EXEMPTION" }
              as: PlanTrustee
              as_user_id: "tr-001"
              captures: { err: "$.data.error_id" }
            - call: "POST /asset-sale-transactions/${sale_id}/adjudicate"
              payload: { disposition: "DETERMINE_SUCCESSOR" }
              as: PlanTrustee
              as_user_id: "tr-001"
              captures: { det: "$.data.successor_determination" }
          assert:
            - "The sale reports required_bond_cents == 20000000, equal to bond_amount_cents."
            - "Exemption: HTTP 422 with data.error_id == \"ERR_4204_OBLIGATION_NOT_ASSUMED\", not ERR_4204_BOND_INSUFFICIENT."
            - "After the rejection the sale is still status == \"SUBMITTED\" with exemption_status == \"PENDING\" and adjudicated_at == null, and GET /controlled-groups/${buyer_cg_id} reports bond_posture == \"UNBONDED\"."
            - "Successor determination on the same row: HTTP 200 with det == \"SUCCESSOR_LIABLE\" (score 0.7000), status == \"SUCCESSOR_DETERMINED\" and exemption_status == \"NOT_EXEMPT\"."

      - name: the_state_over_fiscal_priority_conflict_on_payment_is_covered_by_the_depth_probe
        claim_type: Priority conflict
        grounds:
          - "validations[priority=8]"
        distinguishing_aspect: |
          Stacking a state violation and an amount violation on one call and pinning
          which one answers is the whole claim.
        excluded_because:
          difficulty_instance: state_beats_fiscal_when_paying_a_scheduled_installment_with_a_wrong_amount
          rationale: "The depth probe already violates priority 8 and priority 13 on the same request and asserts ERR_INSTALLMENT_NOT_PAYABLE wins; the amount rule's own boundary is covered here by paying_an_installment_one_cent_short_is_rejected_and_the_exact_amount_is_accepted."

      - name: the_referential_over_temporal_priority_conflict_on_arbitration_is_covered_by_the_depth_probe
        claim_type: Priority conflict
        grounds:
          - "validations[priority=10]"
        distinguishing_aspect: |
          A pending request past the outer window violates both the referential and the
          temporal tier at once, and only the ordering is interesting.
        excluded_because:
          difficulty_instance: referential_beats_temporal_when_arbitrating_a_pending_review_after_the_outer_window
          rationale: "The depth probe stacks ERR_REVIEW_REQUEST_NOT_DECIDED against ERR_ARBITRATION_WINDOW_CLOSED on one call; the temporal rule alone is covered here by initiating_arbitration_one_day_after_the_deadline_is_rejected."

      - name: the_safety_over_constraint_priority_conflict_on_sale_certification_is_covered_by_the_depth_probe
        claim_type: Priority conflict
        grounds:
          - "validations[priority=9]"
        distinguishing_aspect: |
          An underbonded AND unassumed sale violates priority 9 and priority 12 together,
          and the claim is which one surfaces.
        excluded_because:
          difficulty_instance: safety_beats_constraint_when_certifying_an_underbonded_unassumed_sale
          rationale: "The depth probe pins ERR_4204_BOND_INSUFFICIENT as the winner; the reverse configuration, where the bond is sufficient and only the assumption is missing, is covered here by certifying_a_sale_exemption_the_buyer_has_not_assumed_is_rejected."

      - name: the_contribution_interval_overlap_and_adjacency_rules_are_covered_by_the_interval_depth_probe
        claim_type: Temporal validation
        grounds:
          - "validations[priority=11]"
        distinguishing_aspect: |
          Closed intervals make adjacency legal and one-year touching illegal, and both
          sides of that line must be driven on the same employer.
        excluded_because:
          difficulty_instance: contribution_record_plan_year_intervals_are_closed_and_adjacency_is_allowed
          rationale: "The depth probe drives adjacent, touching and superseding intervals in one chain, which strictly contains any single overlap claim."

      - name: the_valuation_window_quiet_buffer_rule_is_covered_by_the_half_open_depth_probe
        claim_type: Temporal validation
        grounds:
          - "validations[priority=11]"
        distinguishing_aspect: |
          Half-open windows plus a 30-day buffer produce exactly one interesting instant,
          and it must be tested from both sides.
        excluded_because:
          difficulty_instance: valuation_measurement_windows_are_half_open_with_a_thirty_day_quiet_buffer
          rationale: "The depth probe drives the permitted start at buffer-end and the rejected start one day earlier on the same plan."

  # =======================================================================
  # SECTION: endpoints - the forty-eight routes, their declared side effects and
  # their listing envelopes.
