# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml - Section 1.9 breadth probe
# Task 2882: Equity Award Administration & Trading Plan Oversight
#
# Walks references/claim-extraction-guide.md row-by-row against SCAFFOLD.yaml
# 1.1-1.7. Every `grounds:` ref resolves into SCAFFOLD.yaml; every
# `setup_api_calls` chain drives empty-DB into the instance precondition using
# only endpoints declared in 1.5; every numeric assert literal was computed by
# executing the corresponding 1.3 formula in code.
# Corners already asserted by SCAFFOLD_DIFFICULTY_DESIGN.yaml appear as
# `excluded_because:` stubs naming the covering 1.8 instance.
# Canonical actor ids: admin-1 (PlanAdministrator), board-1 (BoardMember),
# officer-1 (DelegatedOfficer), compliance-1 (ComplianceOfficer),
# auditor-1 (Auditor); Participant callers use the Participant row's own id.
# Canonical unknown id: 00000000-0000-0000-0000-0000000000ff
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: equity_plan_creation_returns_all_declared_fields
        claim_type: creation
        grounds:
          - entities.EquityPlan
          - endpoints[POST /equity-plans]
          - calculations.share_reserve_ledger
          - response_envelope.success
        distinguishing_aspect: |
          A single POST with every optional plan parameter supplied returns 201 and every
          declared EquityPlan field in one envelope, with the three ledger fields already
          derived (available_reserve_shares 1000000, reserve_posture OPEN) rather than null.
        test_recipe:
          setup:
            - "Empty database; logical clock pinned at 2026-01-05T09:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-05T09:00:00Z" }
              as: PlanAdministrator
              as_user_id: "admin-1"
          trigger:
            - call: "POST /equity-plans"
              payload: { name: "Corner Plan Alpha", total_authorized_shares: 1000000, common_shares_outstanding: 1000000, fiscal_year_start_date: "2026-01-01", current_fiscal_year_label: "FY2026", evergreen_pct_bps: 200, evergreen_cap_shares: 50000, burn_rate_limit_bps: 800, fungible_ratio_full_value_bps: 15000, low_reserve_threshold_bps: 2500, next_earnings_release_at: "2026-02-10T21:00:00Z" }
              as: PlanAdministrator
              as_user_id: "admin-1"
              captures: { plan_id: $.data.id }
          assert:
            - "HTTP status is 201 and response_type is \"object\""
            - "EquityPlan.name == \"Corner Plan Alpha\""
            - "EquityPlan.total_authorized_shares == 1000000"
            - "EquityPlan.common_shares_outstanding == 1000000"
            - "EquityPlan.fungible_ratio_full_value_bps == 15000"
            - "EquityPlan.low_reserve_threshold_bps == 2500"
            - "EquityPlan.status == ACTIVE"
            - "EquityPlan.freeze_reason is null"
            - "EquityPlan.shares_committed_cumulative == 0"
            - "EquityPlan.shares_returned_cumulative == 0"
            - "EquityPlan.available_reserve_shares == 1000000"
            - "EquityPlan.reserve_posture == OPEN"
            - "EquityPlan.fiscal_year_gross_granted_shares == 0"
            - "EquityPlan.fiscal_year_returned_shares == 0"
            - "EquityPlan.gross_burn_rate_bps == 0"
            - "EquityPlan.net_burn_rate_bps == 0"
            - "EquityPlan.evergreen_topup_last_shares == 0"
            - "EquityPlan.version == 1 and id, created_at, updated_at are all non-null"

      - name: equity_plan_retrieval_matches_stored_row
        claim_type: retrieval
        grounds:
          - entities.EquityPlan
          - endpoints[GET /equity-plans/{id}]
        distinguishing_aspect: |
          GET /equity-plans/{id} as Auditor returns byte-identical field values to the create
          response - notably total_authorized_shares 400000 and reserve_posture OPEN - proving
          the read path serialises stored state rather than recomputing defaults.
        test_recipe:
          setup:
            - "Logical clock 2026-01-05T09:00:00Z; one EquityPlan 'Corner Plan Bravo' with 400000 authorized shares."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-05T09:00:00Z" }
              as: PlanAdministrator
              as_user_id: "admin-1"
            - call: "POST /equity-plans"
              payload: { name: "Corner Plan Bravo", total_authorized_shares: 400000, common_shares_outstanding: 2000000, fiscal_year_start_date: "2026-01-01" }
              as: PlanAdministrator
              as_user_id: "admin-1"
              captures: { plan_id: $.data.id }
          trigger:
            - call: "GET /equity-plans/${plan_id}"
              payload: {}
              as: Auditor
              as_user_id: "auditor-1"
          assert:
            - "HTTP status is 200"
            - "EquityPlan.id == ${plan_id}"
            - "EquityPlan.name == \"Corner Plan Bravo\""
            - "EquityPlan.total_authorized_shares == 400000"
            - "EquityPlan.available_reserve_shares == 400000"
            - "EquityPlan.current_fiscal_year_label == \"FY2026\""
            - "EquityPlan.burn_rate_limit_bps == 10000"
            - "EquityPlan.reserve_posture == OPEN"
            - "EquityPlan.version == 1"

      - name: participants_listing_paginates_with_total_count
        claim_type: listing
        grounds:
          - entities.Participant
          - endpoints[GET /participants]
          - response_envelope.pagination_fields
        distinguishing_aspect: |
          With exactly three Participant rows stored, limit 2 returns 2 rows with
          total_count 3 and has_more true, and offset 2 returns the remaining 1 row with
          has_more false - total_count counts the filtered set, not the page.
        test_recipe:
          setup:
            - "Three ACTIVE participants: E-C-01, E-C-02, E-C-03."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-05T09:00:00Z" }
              as: PlanAdministrator
              as_user_id: "admin-1"
            - call: "POST /participants"
              payload: { full_name: "Pia One", employee_number: "E-C-01", home_country_code: "US", home_state_code: "CA", hire_date: "2020-01-06", birth_date: "1988-05-02" }
              as: PlanAdministrator
              as_user_id: "admin-1"
            - call: "POST /participants"
              payload: { full_name: "Pia Two", employee_number: "E-C-02", home_country_code: "US", home_state_code: "NY", hire_date: "2021-01-06", birth_date: "1990-06-03" }
              as: PlanAdministrator
              as_user_id: "admin-1"
            - call: "POST /participants"
              payload: { full_name: "Pia Three", employee_number: "E-C-03", home_country_code: "IE", hire_date: "2022-01-06", birth_date: "1992-07-04" }
              as: PlanAdministrator
              as_user_id: "admin-1"
          trigger:
            - call: "GET /participants"
              payload: { limit: 2, offset: 0 }
              as: ComplianceOfficer
              as_user_id: "compliance-1"
            - call: "GET /participants"
              payload: { limit: 2, offset: 2 }
              as: ComplianceOfficer
              as_user_id: "compliance-1"
          assert:
            - "first page: HTTP 200, response_type is \"array\", len(data) == 2, total_count == 3, has_more == true, limit == 2, offset == 0"
            - "second page: len(data) == 1, total_count == 3, has_more == false, offset == 2"
            - "the two pages together contain the employee_numbers E-C-01, E-C-02 and E-C-03 with no repeats"

      - name: grant_not_found_returns_404
        claim_type: not_found
        grounds:
          - entities.Grant
          - endpoints[GET /grants/{id}]
          - validations[priority=20]
          - errors[ERR_GRANT_NOT_FOUND]
        distinguishing_aspect: |
          An unknown grant id on GET /grants/{id} returns exactly ERR_GRANT_NOT_FOUND with
          HTTP 404 - the entity-specific code, not a generic ERR_NOT_FOUND.
        test_recipe:
          setup:
            - "Empty database except the logical clock."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-05T09:00:00Z" }
              as: PlanAdministrator
              as_user_id: "admin-1"
          trigger:
            - call: "GET /grants/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: PlanAdministrator
              as_user_id: "admin-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 404"
            - "response_type is \"error\" and data.error_id == ERR_GRANT_NOT_FOUND"
            - "data.message is a non-empty string"

      - name: grant_missing_required_target_shares_rejected
        claim_type: required_fields
        grounds:
          - entities.Grant.fields.target_shares
          - endpoints[POST /grants]
          - validations[priority=30]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          target_shares has source input, is required and carries no default, so omitting it
          returns ERR_INVALID_REQUEST (400) and no Grant row is created.
        test_recipe:
          setup:
            - "One ACTIVE plan and one ACTIVE participant."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-05T09:00:00Z" }
              as: PlanAdministrator
              as_user_id: "admin-1"
            - call: "POST /equity-plans"
              payload: { name: "Corner Plan Charlie", total_authorized_shares: 1000000, common_shares_outstanding: 1000000, fiscal_year_start_date: "2026-01-01" }
              as: PlanAdministrator
              as_user_id: "admin-1"
              captures: { plan_id: $.data.id }
            - call: "POST /participants"
              payload: { full_name: "Rob Required", employee_number: "E-C-10", home_country_code: "US", home_state_code: "CA", hire_date: "2020-01-06", birth_date: "1987-02-02" }
              as: PlanAdministrator
              as_user_id: "admin-1"
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /grants"
              payload: { plan_id: "${plan_id}", participant_id: "${p_id}", award_type: "RSU" }
              as: PlanAdministrator
              as_user_id: "admin-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 400 and data.error_id == ERR_INVALID_REQUEST"
            - "GET /grants with plan_id filter returns total_count == 0"

      - name: participant_insider_status_defaults_to_non_insider
        claim_type: defaults
        grounds:
          - entities.Participant.fields.insider_status
          - entities.Participant.fields.home_state_code
          - endpoints[POST /participants]
        distinguishing_aspect: |
          Omitting insider_status yields NON_INSIDER (the declared default) while the optional
          home_state_code stays null - a default and an absent optional are distinguishable in
          the same response.
        test_recipe:
          setup:
            - "Logical clock 2026-01-05T09:00:00Z, empty participant table."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-05T09:00:00Z" }
              as: PlanAdministrator
              as_user_id: "admin-1"
          trigger:
            - call: "POST /participants"
              payload: { full_name: "Dee Fault", employee_number: "E-C-20", home_country_code: "IE", hire_date: "2019-04-01", birth_date: "1984-08-09" }
              as: PlanAdministrator
              as_user_id: "admin-1"
              captures: { p_id: $.data.id }
          assert:
            - "HTTP status is 201"
            - "Participant.insider_status == NON_INSIDER"
            - "Participant.home_state_code is null"
            - "Participant.employment_status == ACTIVE"
            - "Participant.termination_date is null and Participant.termination_reason is null"
            - "Participant.version == 1"

      - name: plan_computed_reserve_fields_input_ignored
        claim_type: computed_fields
        grounds:
          - entities.EquityPlan.fields.available_reserve_shares
          - entities.EquityPlan.fields.shares_committed_cumulative
          - entities.EquityPlan.fields.reserve_posture
          - calculations.share_reserve_ledger
          - endpoints[POST /equity-plans]
        distinguishing_aspect: |
          Client-supplied values for the three computed ledger fields are discarded: the
          response carries available_reserve_shares 750000 (= authorized - 0 + 0) and
          shares_committed_cumulative 0, not the 1 and 999999 that were posted.
        test_recipe:
          setup:
            - "Empty database; logical clock 2026-01-05T09:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-05T09:00:00Z" }
              as: PlanAdministrator
              as_user_id: "admin-1"
          trigger:
            - call: "POST /equity-plans"
              payload: { name: "Corner Plan Delta", total_authorized_shares: 750000, common_shares_outstanding: 1000000, fiscal_year_start_date: "2026-01-01", low_reserve_threshold_bps: 9000, available_reserve_shares: 1, shares_committed_cumulative: 999999, reserve_posture: "RESTRICTED", gross_burn_rate_bps: 4321 }
              as: PlanAdministrator
              as_user_id: "admin-1"
              captures: { plan_id: $.data.id }
          assert:
            - "HTTP status is 201"
            - "EquityPlan.available_reserve_shares == 750000"
            - "EquityPlan.shares_committed_cumulative == 0"
            - "EquityPlan.gross_burn_rate_bps == 0"
            - "EquityPlan.reserve_posture == OPEN"
            - "GET /equity-plans/${plan_id} returns the same four values"

      - name: participant_system_fields_generated_input_ignored
        claim_type: system_fields
        grounds:
          - entities.Participant.fields.employment_status
          - entities.Participant.fields.termination_date
          - endpoints[POST /participants]
        distinguishing_aspect: |
          id, created_at, version and the system enum employment_status are all server-minted:
          posting id 00000000-0000-0000-0000-0000000000ff with employment_status TERMINATED
          still yields a fresh uuid, version 1 and employment_status ACTIVE.
        test_recipe:
          setup:
            - "Empty database; logical clock 2026-01-05T09:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-05T09:00:00Z" }
              as: PlanAdministrator
              as_user_id: "admin-1"
          trigger:
            - call: "POST /participants"
              payload: { full_name: "Sy Stem", employee_number: "E-C-30", home_country_code: "US", home_state_code: "WA", hire_date: "2018-09-03", birth_date: "1980-01-15", id: "00000000-0000-0000-0000-0000000000ff", version: 77, employment_status: "TERMINATED", termination_date: "2020-01-01", age_years: 9 }
              as: PlanAdministrator
              as_user_id: "admin-1"
              captures: { p_id: $.data.id }
          assert:
            - "HTTP status is 201"
            - "Participant.id != \"00000000-0000-0000-0000-0000000000ff\""
            - "Participant.version == 1"
            - "Participant.employment_status == ACTIVE"
            - "Participant.termination_date is null"
            - "Participant.age_years == 45 (birth 1980-01-15 against the clock date 2026-01-05, last anniversary 2025-01-15)"
            - "GET /participants/00000000-0000-0000-0000-0000000000ff returns ERR_PARTICIPANT_NOT_FOUND (404)"

      - name: grant_invalid_award_type_enum_rejected
        claim_type: type_constraints
        grounds:
          - entities.Grant.fields.award_type
          - endpoints[POST /grants]
          - validations[priority=30]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          award_type is constrained to RSU | PSU | ISO | NSO, so the unknown member WARRANT is
          refused with ERR_INVALID_REQUEST (400) before any FK or fiscal check runs.
        test_recipe:
          setup:
            - "One ACTIVE plan and one ACTIVE participant."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-05T09:00:00Z" }
              as: PlanAdministrator
              as_user_id: "admin-1"
            - call: "POST /equity-plans"
              payload: { name: "Corner Plan Echo", total_authorized_shares: 1000000, common_shares_outstanding: 1000000, fiscal_year_start_date: "2026-01-01" }
              as: PlanAdministrator
              as_user_id: "admin-1"
              captures: { plan_id: $.data.id }
            - call: "POST /participants"
              payload: { full_name: "Enid Enum", employee_number: "E-C-40", home_country_code: "US", home_state_code: "CA", hire_date: "2020-01-06", birth_date: "1986-03-03" }
              as: PlanAdministrator
              as_user_id: "admin-1"
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /grants"
              payload: { plan_id: "${plan_id}", participant_id: "${p_id}", award_type: "WARRANT", target_shares: 100 }
              as: PlanAdministrator
              as_user_id: "admin-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 400 and data.error_id == ERR_INVALID_REQUEST"
            - "no Grant row exists: GET /grants returns total_count == 0"

      - name: trading_window_inverted_close_at_rejected
        claim_type: type_constraints
        grounds:
          - entities.TradingWindow.fields.close_at
          - endpoints[POST /trading-windows]
          - validations[priority=30]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          close_at carries the declared constraint > open_at, so an inverted pair is an
          ERR_INVALID_REQUEST (400) input failure - not the 409 temporal family that overlap
          and buffer breaches use.
        test_recipe:
          setup:
            - "One ACTIVE plan, no windows yet."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-05T09:00:00Z" }
              as: PlanAdministrator
              as_user_id: "admin-1"
            - call: "POST /equity-plans"
              payload: { name: "Corner Plan Foxtrot", total_authorized_shares: 1000000, common_shares_outstanding: 1000000, fiscal_year_start_date: "2026-01-01" }
              as: PlanAdministrator
              as_user_id: "admin-1"
              captures: { plan_id: $.data.id }
          trigger:
            - call: "POST /trading-windows"
              payload: { plan_id: "${plan_id}", quarter_label: "FY2026-Q1", open_at: "2026-03-31T00:00:00Z", close_at: "2026-01-05T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "compliance-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 400 and data.error_id == ERR_INVALID_REQUEST"
            - "data.error_id != ERR_TRADING_WINDOW_OVERLAP"
            - "GET /equity-plans/${plan_id}/trading-windows returns total_count == 0"

      - name: mobility_assignment_is_immutable_with_no_version_field
        claim_type: immutability
        grounds:
          - entities.MobilityAssignment
          - endpoints[POST /mobility-assignments]
          - endpoints[GET /mobility-assignments/{id}]
        distinguishing_aspect: |
          MobilityAssignment is declared common_fields false: its create and read responses
          expose participant_id, jurisdiction_code, tax_rate_bps, start_date, end_date and
          workdays plus id only - no version and no updated_at - and no update or delete
          endpoint for the resource exists anywhere in 1.5.
        test_recipe:
          setup:
            - "One ACTIVE participant with a single US-CA assignment 2026-01-06..2026-06-30, 250 workdays at 4000 bps."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-05T09:00:00Z" }
              as: PlanAdministrator
              as_user_id: "admin-1"
            - call: "POST /participants"
              payload: { full_name: "Immo Table", employee_number: "E-C-50", home_country_code: "US", home_state_code: "CA", hire_date: "2019-01-07", birth_date: "1983-11-11" }
              as: PlanAdministrator
              as_user_id: "admin-1"
              captures: { p_id: $.data.id }
            - call: "POST /mobility-assignments"
              payload: { participant_id: "${p_id}", jurisdiction_code: "US-CA", tax_rate_bps: 4000, start_date: "2026-01-06", end_date: "2026-06-30", workdays: 250 }
              as: PlanAdministrator
              as_user_id: "admin-1"
              captures: { ma_id: $.data.id }
          trigger:
            - call: "GET /mobility-assignments/${ma_id}"
              payload: {}
              as: Auditor
              as_user_id: "auditor-1"
          assert:
            - "HTTP status is 200"
            - "MobilityAssignment.id == ${ma_id} and workdays == 250 and tax_rate_bps == 4000"
            - "the response object has no \"version\" key and no \"updated_at\" key"
            - "1.5 declares no PUT, PATCH or DELETE endpoint on /mobility-assignments/{id}"

      - name: vesting_tranche_requires_existing_grant_parent_not_found
        claim_type: parent_relationships
        grounds:
          - entities.VestingTranche.fields.grant_id
          - endpoints[POST /grants/{id}/vesting-tranches]
          - validations[priority=20]
          - errors[ERR_GRANT_NOT_FOUND]
        distinguishing_aspect: |
          A tranche is created only under an existing grant: the nested path with an unknown
          grant id returns ERR_GRANT_NOT_FOUND (404), and the tranche is never stored.
        test_recipe:
          setup:
            - "Empty database except the logical clock."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-05T09:00:00Z" }
              as: PlanAdministrator
              as_user_id: "admin-1"
          trigger:
            - call: "POST /grants/00000000-0000-0000-0000-0000000000ff/vesting-tranches"
              payload: { tranche_index: 1, vest_type: "TIME", scheduled_vest_date: "2027-01-05", target_shares: 100 }
              as: PlanAdministrator
              as_user_id: "admin-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 404 and data.error_id == ERR_GRANT_NOT_FOUND"
            - "GET /vesting-tranches returns total_count == 0"

      - name: tranche_performance_cycle_fk_cross_reference_validated
        claim_type: parent_relationships
        grounds:
          - entities.VestingTranche.fields.performance_cycle_id
          - entities.PerformanceCycle
          - endpoints[POST /grants/{id}/vesting-tranches]
          - validations[priority=25]
          - errors[ERR_CYCLE_NOT_FOUND]
          - complexity_profile.entity_topology
        distinguishing_aspect: |
          In this flat topology the body-supplied foreign key is validated independently of the
          path parent: an unknown performance_cycle_id under a valid grant returns
          ERR_CYCLE_NOT_FOUND (404), while the same call with the real cycle id stores the
          association and makes the tranche retrievable by performance_cycle_id filter.
        test_recipe:
          setup:
            - "One ACTIVE plan with an OPEN PerformanceCycle TSR-2026 (target 200) and a DRAFT PSU grant of 1000 target shares."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-05T09:00:00Z" }
              as: PlanAdministrator
              as_user_id: "admin-1"
            - call: "POST /equity-plans"
              payload: { name: "Corner Plan Golf", total_authorized_shares: 1000000, common_shares_outstanding: 1000000, fiscal_year_start_date: "2026-01-01" }
              as: PlanAdministrator
              as_user_id: "admin-1"
              captures: { plan_id: $.data.id }
            - call: "POST /participants"
              payload: { full_name: "Fran Key", employee_number: "E-C-60", home_country_code: "US", home_state_code: "CA", hire_date: "2020-01-06", birth_date: "1985-05-05" }
              as: PlanAdministrator
              as_user_id: "admin-1"
              captures: { p_id: $.data.id }
            - call: "POST /performance-cycles"
              payload: { plan_id: "${plan_id}", metric_code: "TSR-2026", target_value: 200, certification_due_date: "2027-02-15" }
              as: PlanAdministrator
              as_user_id: "admin-1"
              captures: { pc_id: $.data.id }
            - call: "POST /grants"
              payload: { plan_id: "${plan_id}", participant_id: "${p_id}", award_type: "PSU", target_shares: 1000 }
              as: PlanAdministrator
              as_user_id: "admin-1"
              captures: { g_id: $.data.id }
          trigger:
            - call: "POST /grants/${g_id}/vesting-tranches"
              payload: { tranche_index: 1, vest_type: "PERFORMANCE", scheduled_vest_date: "2027-03-01", target_shares: 1000, performance_cycle_id: "00000000-0000-0000-0000-0000000000ff" }
              as: PlanAdministrator
