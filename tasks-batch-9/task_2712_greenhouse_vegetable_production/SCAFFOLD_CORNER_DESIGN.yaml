          rationale: |
            Candidate-set membership for the allocation waterfall is exactly the input-set filter, and the
            §1.8 boundary instance drives its date predicate to both sides of the excluded upper bound with
            a single lot, which no coarser filtering test can match.

      - name: dual_variant_divergence_on_the_same_row
        claim_type: variant_divergence
        excluded_because:
          difficulty_instance: energy_cost_projected_and_settled_with_chp_diverge_on_one_strategy
          rationale: |
            Both energy variants are computed on one ClimateStrategy row and the §1.8 dual_variant_calc
            instance asserts the projected figure, the settled figure and the signed variance between them.

      - name: dual_variant_reconciliation_on_switch
        claim_type: reconciliation
        excluded_because:
          difficulty_instance: commitment_payout_provisional_and_final_diverge_when_pounds_go_unconfirmed
          rationale: |
            The provisional-to-final payout switch is the scaffold's reconciliation event, and the §1.8
            instance asserts the ledger delta posted to program.penalty_accrued_usd when the variant flips.

      - name: rate_threshold_reset_after_a_cumulative_trip
        claim_type: algorithm_rate_threshold
        excluded_because:
          difficulty_instance: drainage_reading_cascade_locks_irrigation_then_flags_nutrient_stress
          rationale: |
            drain_alarm_count is the cumulative rate-threshold counter, and the §1.8 transitive_cascade
            instance walks it across the WATCH boundary to the LOCKED boundary with mid-chain captures at
            each step.

