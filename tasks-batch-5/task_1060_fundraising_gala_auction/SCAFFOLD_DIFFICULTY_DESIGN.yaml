scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: auction_valuation_proxy_settled_vs_placed_amount
        grounds:
          - calculations.auction_item_valuation
          - entities.AuctionItem.fields.current_leading_amount_cents
          - entities.Bid.fields.proxy_max_cents
          - endpoints["GET /api/auction-items/{id}/valuation"]
        distinguishing_aspect: |
          Dual variant on the AuctionItem entity domain: PROXY_SETTLED lifts the leader to
          one increment above the runner-up's ceiling (12500) while PLACED_AMOUNT reports the
          literal typed amount of the same leading bid (10000) over identical bid data.
        test_recipe:
          setup:
            - "Clock at 2026-07-05T00:00:00Z; event PUBLISHED with posture OPEN."
            - "Lot 'Napa Weekend' OPEN with starting_bid 10000 and min_increment 500."
            - "Bidder A leads on a proxy ceiling of 20000 with a placed amount of 10000; Bidder B has placed 12000 with no proxy."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-05T00:00:00Z" }
              as: EventOrganizer
              as_user_id: "org-1"
            - call: "POST /api/events"
              payload: { name: "Harbor Light Gala", event_start_utc: "2026-09-12T23:00:00Z", event_end_utc: "2026-09-13T04:00:00Z", match_cap_cents: 500000 }
              as: EventOrganizer
              as_user_id: "org-1"
              captures: { ev_id: $.data.id }
            - call: "POST /api/events/${ev_id}/tables"
              payload: { table_name: "T1", seat_count: 10, table_price_cents: 1250000, seat_price_cents: 12533 }
              as: EventOrganizer
              as_user_id: "org-1"
              captures: { tbl_id: $.data.id }
            - call: "POST /api/bidders"
              payload: { event_id: "${ev_id}", display_name: "Ada Lovelace", email: "ada@example.org", paddle_number: 101, payment_method_on_file: true }
              as: EventOrganizer
              as_user_id: "org-1"
              captures: { b_a: $.data.id }
            - call: "POST /api/bidders"
              payload: { event_id: "${ev_id}", display_name: "Grace Hopper", email: "grace@example.org", paddle_number: 102, payment_method_on_file: true }
              as: EventOrganizer
              as_user_id: "org-1"
              captures: { b_b: $.data.id }
            - call: "POST /api/events/${ev_id}/publish"
              payload: {}
              as: EventOrganizer
              as_user_id: "org-1"
            - call: "POST /api/auction-items"
              payload: { event_id: "${ev_id}", title: "Napa Weekend", item_type: "SILENT", starting_bid_cents: 10000, min_increment_cents: 500, estimated_fmv_cents: 4000, open_at_utc: "2026-07-04T00:00:00Z", close_at_utc: "2026-07-30T00:00:00Z" }
              as: AuctionManager
              as_user_id: "auc-1"
              captures: { item_1: $.data.id }
            - call: "POST /api/auction-items/${item_1}/open"
              payload: {}
              as: AuctionManager
              as_user_id: "auc-1"
            - call: "POST /api/auction-items/${item_1}/bids"
              payload: { bidder_id: "${b_a}", amount_cents: 10000, proxy_max_cents: 20000 }
              as: Bidder
              as_user_id: "${b_a}"
              captures: { bid_1: $.data.id }
            - call: "POST /api/auction-items/${item_1}/bids"
              payload: { bidder_id: "${b_b}", amount_cents: 12000 }
              as: Bidder
              as_user_id: "${b_b}"
              captures: { bid_2: $.data.id }
          trigger:
            - call: "GET /api/auction-items/${item_1}/valuation"
              payload: { variant: "PROXY_SETTLED" }
              as: AuctionManager
              as_user_id: "auc-1"
              captures: { proxy_amount: $.data.amount_cents, proxy_source: $.data.source_bid_id }
            - call: "GET /api/auction-items/${item_1}/valuation"
              payload: { variant: "PLACED_AMOUNT" }
              as: AuctionManager
              as_user_id: "auc-1"
              captures: { placed_amount: $.data.amount_cents }
          assert:
            - "${proxy_amount} == 12500"
            - "${placed_amount} == 10000"
            - "${proxy_source} == ${bid_1}"
            - "AuctionItem.${item_1}.current_leading_amount_cents == 12500"

      - name: pledge_expected_revenue_booked_vs_cash_basis
        grounds:
          - calculations.pledge_expected_revenue
          - calculations.event_reconciliation
          - entities.Pledge.fields.received_amount_cents
          - entities.ReconciliationRun.fields.revenue_basis
        distinguishing_aspect: |
          Dual variant on the Pledge entity domain (a different subject from the AuctionItem
          valuation): BOOKED recognises the full promised 300000 while CASH_BASIS recognises
          only the 50000 actually received, from one identical pledge row.
        test_recipe:
          setup:
            - "Clock at 2026-07-05T00:00:00Z; event PUBLISHED, one bidder registered."
            - "One Pledge of 300000 cents in 3 installments with 50000 received, so status is PARTIALLY_FULFILLED."
            - "No tickets, lots, paddle raises, sponsors or payments exist, so every other channel is 0."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-05T00:00:00Z" }
              as: EventOrganizer
              as_user_id: "org-1"
            - call: "POST /api/events"
              payload: { name: "Harbor Light Gala", event_start_utc: "2026-09-12T23:00:00Z", event_end_utc: "2026-09-13T04:00:00Z" }
              as: EventOrganizer
              as_user_id: "org-1"
              captures: { ev_id: $.data.id }
            - call: "POST /api/events/${ev_id}/tables"
              payload: { table_name: "T1", seat_count: 10, table_price_cents: 1250000, seat_price_cents: 12533 }
              as: EventOrganizer
              as_user_id: "org-1"
            - call: "POST /api/bidders"
              payload: { event_id: "${ev_id}", display_name: "Ada Lovelace", email: "ada@example.org", paddle_number: 101, payment_method_on_file: true }
              as: EventOrganizer
              as_user_id: "org-1"
              captures: { b_a: $.data.id }
            - call: "POST /api/events/${ev_id}/publish"
              payload: {}
              as: EventOrganizer
              as_user_id: "org-1"
            - call: "POST /api/pledges"
              payload: { event_id: "${ev_id}", bidder_id: "${b_a}", total_amount_cents: 300000, installment_count: 3, first_due_utc: "2026-10-01T00:00:00Z" }
              as: FinanceOfficer
              as_user_id: "fin-1"
              captures: { pl_1: $.data.id }
            - call: "POST /api/pledges/${pl_1}/installments"
              payload: { amount_cents: 50000 }
              as: FinanceOfficer
              as_user_id: "fin-1"
            - call: "GET /api/events/${ev_id}"
              payload: {}
              as: FinanceOfficer
              as_user_id: "fin-1"
              captures: { ev_ver_1: $.data.version }
          trigger:
            - call: "POST /api/events/${ev_id}/reconciliation-runs"
              payload: { expected_event_version: "${ev_ver_1}", revenue_basis: "BOOKED" }
              as: FinanceOfficer
              as_user_id: "fin-1"
              captures: { run_booked_expected: $.data.expected_total_cents, run_booked_variance: $.data.variance_cents }
            - call: "GET /api/events/${ev_id}"
              payload: {}
              as: FinanceOfficer
              as_user_id: "fin-1"
              captures: { ev_ver_2: $.data.version }
            - call: "POST /api/events/${ev_id}/reconciliation-runs"
              payload: { expected_event_version: "${ev_ver_2}", revenue_basis: "CASH_BASIS" }
              as: FinanceOfficer
              as_user_id: "fin-1"
              captures: { run_cash_expected: $.data.expected_total_cents, run_cash_variance: $.data.variance_cents }
          assert:
            - "${run_booked_expected} == 300000"
            - "${run_cash_expected} == 50000"
            - "${run_booked_variance} == 300000"
            - "${run_cash_variance} == 50000"
            - "Pledge.${pl_1}.status == PARTIALLY_FULFILLED"
            - "Pledge.${pl_1}.received_amount_cents == 50000"

  - rule_id: combinatorial_formula
    instances:
      - name: ticket_order_rounds_per_unit_before_multiplying
        grounds:
          - calculations.ticket_order_total
          - entities.TicketOrder.fields.unit_price_cents
          - entities.TicketOrder.fields.subtotal_cents
          - entities.TicketTable.fields.seat_price_cents
        distinguishing_aspect: |
          Mode (b) - nested rounding where order matters: rounding the per-seat early-bird
          price first and then multiplying by 3 yields 33840, while summing first and
          rounding once yields 33839; the scaffold pins the per-unit order.
        test_recipe:
          setup:
            - "Clock at 2026-07-05T00:00:00Z, which is on or before the early-bird cutoff 2026-08-13T23:00:00Z."
            - "Table T1 with seat_price_cents 12533 on a PUBLISHED event."
            - "Bidder A registered."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-05T00:00:00Z" }
              as: EventOrganizer
              as_user_id: "org-1"
            - call: "POST /api/events"
              payload: { name: "Harbor Light Gala", event_start_utc: "2026-09-12T23:00:00Z", event_end_utc: "2026-09-13T04:00:00Z" }
              as: EventOrganizer
              as_user_id: "org-1"
              captures: { ev_id: $.data.id }
            - call: "POST /api/events/${ev_id}/tables"
              payload: { table_name: "T1", seat_count: 10, table_price_cents: 1250000, seat_price_cents: 12533 }
              as: EventOrganizer
              as_user_id: "org-1"
              captures: { tbl_id: $.data.id }
            - call: "POST /api/bidders"
              payload: { event_id: "${ev_id}", display_name: "Ada Lovelace", email: "ada@example.org", paddle_number: 101, payment_method_on_file: true }
              as: EventOrganizer
              as_user_id: "org-1"
              captures: { b_a: $.data.id }
            - call: "POST /api/events/${ev_id}/publish"
              payload: {}
              as: EventOrganizer
              as_user_id: "org-1"
          trigger:
            - call: "POST /api/ticket-orders"
              payload: { event_id: "${ev_id}", bidder_id: "${b_a}", table_id: "${tbl_id}", order_type: "SEAT", seat_count: 3 }
              as: Bidder
              as_user_id: "${b_a}"
              captures: { to_1: $.data.id, to_unit: $.data.unit_price_cents, to_sub: $.data.subtotal_cents }
          assert:
            - "${to_unit} == 11280"
            - "${to_sub} == 33840"
            - "TicketOrder.${to_1}.early_bird_applied == true"
            - "TicketOrder.${to_1}.benefit_value_cents == 22500"
            - "TicketTable.${tbl_id}.seats_reserved == 3"

      - name: invoice_processing_fee_tier_pinned_to_prefee_subtotal
        grounds:
          - calculations.invoice_totals
          - entities.CheckoutInvoice.fields.processing_fee_cents
          - entities.CheckoutInvoice.fields.total_due_cents
          - state_machines.AuctionItem.OPEN_to_AWARDED
        distinguishing_aspect: |
          Mode (c) - circular-looking dependency resolved by a pinned evaluation order: the
          49900 subtotal selects tier 1 (0.029) giving a fee of 1477 and a total of 51377,
          and the fee is NOT recomputed at tier 2 even though 51377 crosses the 50000 ceiling.
        test_recipe:
          setup:
            - "Clock at 2026-07-05T00:00:00Z; event PUBLISHED; bidder A registered with a card on file."
            - "An OPEN invoice for bidder A with cover_processing_fee true exists before the lot closes."
            - "Lot with starting_bid 49900 is OPEN and carries exactly one ACTIVE bid of 49900."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-05T00:00:00Z" }
              as: EventOrganizer
              as_user_id: "org-1"
            - call: "POST /api/events"
              payload: { name: "Harbor Light Gala", event_start_utc: "2026-09-12T23:00:00Z", event_end_utc: "2026-09-13T04:00:00Z" }
              as: EventOrganizer
              as_user_id: "org-1"
              captures: { ev_id: $.data.id }
            - call: "POST /api/events/${ev_id}/tables"
              payload: { table_name: "T1", seat_count: 10, table_price_cents: 1250000, seat_price_cents: 12533 }
              as: EventOrganizer
              as_user_id: "org-1"
            - call: "POST /api/bidders"
              payload: { event_id: "${ev_id}", display_name: "Ada Lovelace", email: "ada@example.org", paddle_number: 101, payment_method_on_file: true }
              as: EventOrganizer
              as_user_id: "org-1"
              captures: { b_a: $.data.id }
            - call: "POST /api/events/${ev_id}/publish"
              payload: {}
              as: EventOrganizer
              as_user_id: "org-1"
            - call: "POST /api/invoices"
              payload: { event_id: "${ev_id}", bidder_id: "${b_a}", cover_processing_fee: true }
              as: FinanceOfficer
              as_user_id: "fin-1"
              captures: { inv_1: $.data.id }
            - call: "POST /api/auction-items"
              payload: { event_id: "${ev_id}", title: "Signed Cello", item_type: "SILENT", starting_bid_cents: 49900, min_increment_cents: 500, estimated_fmv_cents: 4000, open_at_utc: "2026-07-04T00:00:00Z", close_at_utc: "2026-07-30T00:00:00Z" }
              as: AuctionManager
              as_user_id: "auc-1"
              captures: { item_1: $.data.id }
            - call: "POST /api/auction-items/${item_1}/open"
              payload: {}
              as: AuctionManager
              as_user_id: "auc-1"
            - call: "POST /api/auction-items/${item_1}/bids"
              payload: { bidder_id: "${b_a}", amount_cents: 49900 }
              as: Bidder
              as_user_id: "${b_a}"
          trigger:
            - call: "POST /api/auction-items/${item_1}/close"
              payload: {}
              as: AuctionManager
              as_user_id: "auc-1"
              captures: { hammer: $.data.hammer_price_cents }
            - call: "GET /api/invoices/${inv_1}"
              payload: {}
              as: FinanceOfficer
              as_user_id: "fin-1"
              captures: { inv_sub: $.data.line_subtotal_cents, inv_fee: $.data.processing_fee_cents, inv_total: $.data.total_due_cents }
          assert:
            - "${hammer} == 49900"
            - "${inv_sub} == 49900"
            - "${inv_fee} == 1477"
            - "${inv_total} == 51377"
            - "CheckoutInvoice.${inv_1}.balance_due_cents == 51377"

  - rule_id: non_linear_state_machine
    instances:
      - name: auction_item_listing_and_settlement_axes_move_independently
        grounds:
          - state_machines.AuctionItem.OPEN_to_AWARDED
          - state_machines.AuctionItem.INVOICED_to_PAID
          - entities.AuctionItem.fields.listing_status
          - entities.AuctionItem.fields.settlement_status
        distinguishing_aspect: |
          Parallel state dimensions on the AuctionItem row: listing_status reaches its terminal
          AWARDED at close while settlement_status is still INVOICED, and a later payment moves
          settlement_status to PAID without touching listing_status.
        test_recipe:
          setup:
            - "Clock at 2026-07-05T00:00:00Z; event PUBLISHED; bidder A with a card on file."
            - "One OPEN lot with a single ACTIVE bid of 12500."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-05T00:00:00Z" }
              as: EventOrganizer
              as_user_id: "org-1"
            - call: "POST /api/events"
              payload: { name: "Harbor Light Gala", event_start_utc: "2026-09-12T23:00:00Z", event_end_utc: "2026-09-13T04:00:00Z" }
              as: EventOrganizer
              as_user_id: "org-1"
              captures: { ev_id: $.data.id }
            - call: "POST /api/events/${ev_id}/tables"
              payload: { table_name: "T1", seat_count: 10, table_price_cents: 1250000, seat_price_cents: 12533 }
              as: EventOrganizer
              as_user_id: "org-1"
            - call: "POST /api/bidders"
              payload: { event_id: "${ev_id}", display_name: "Ada Lovelace", email: "ada@example.org", paddle_number: 101, payment_method_on_file: true }
              as: EventOrganizer
              as_user_id: "org-1"
              captures: { b_a: $.data.id }
            - call: "POST /api/events/${ev_id}/publish"
              payload: {}
              as: EventOrganizer
              as_user_id: "org-1"
            - call: "POST /api/auction-items"
              payload: { event_id: "${ev_id}", title: "Napa Weekend", item_type: "SILENT", starting_bid_cents: 10000, min_increment_cents: 500, estimated_fmv_cents: 4000, open_at_utc: "2026-07-04T00:00:00Z", close_at_utc: "2026-07-30T00:00:00Z" }
              as: AuctionManager
              as_user_id: "auc-1"
              captures: { item_1: $.data.id }
            - call: "POST /api/auction-items/${item_1}/open"
              payload: {}
              as: AuctionManager
              as_user_id: "auc-1"
            - call: "POST /api/auction-items/${item_1}/bids"
              payload: { bidder_id: "${b_a}", amount_cents: 12500 }
              as: Bidder
              as_user_id: "${b_a}"
            - call: "POST /api/auction-items/${item_1}/close"
              payload: {}
              as: AuctionManager
              as_user_id: "auc-1"
              captures: { inv_1: $.data.invoice_id, list_1: $.data.listing_status, settle_1: $.data.settlement_status }
            - call: "POST /api/invoices/${inv_1}/finalize"
              payload: {}
              as: FinanceOfficer
              as_user_id: "fin-1"
          trigger:
            - call: "POST /api/payments"
              payload: { invoice_id: "${inv_1}", amount_cents: 12500, method: "CARD" }
              as: FinanceOfficer
              as_user_id: "fin-1"
            - call: "GET /api/auction-items/${item_1}"
              payload: {}
              as: AuctionManager
              as_user_id: "auc-1"
              captures: { list_2: $.data.listing_status, settle_2: $.data.settlement_status }
          assert:
            - "${list_1} == AWARDED"
            - "${settle_1} == INVOICED"
            - "${list_2} == AWARDED"
            - "${settle_2} == PAID"
            - "CheckoutInvoice.${inv_1}.status == PAID"

      - name: program_ad_review_cycles_back_from_changes_requested
        grounds:
          - state_machines.ProgramAd.CHANGES_REQUESTED_to_SUBMITTED
          - state_machines.ProgramAd.IN_REVIEW_to_CHANGES_REQUESTED
          - entities.ProgramAd.fields.revision_count
        distinguishing_aspect: |
          Cycle on the ProgramAd entity (a different entity from the parallel-axis AuctionItem):
          SUBMITTED -> IN_REVIEW -> CHANGES_REQUESTED -> SUBMITTED returns the row to a state it
          already occupied, with revision_count advanced to 1.
        test_recipe:
          setup:
            - "Clock at 2026-07-05T00:00:00Z; event in DRAFT."
            - "Sponsor Acme registered in PENDING with one SUBMITTED program ad."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-05T00:00:00Z" }
              as: EventOrganizer
              as_user_id: "org-1"
            - call: "POST /api/events"
              payload: { name: "Harbor Light Gala", event_start_utc: "2026-09-12T23:00:00Z", event_end_utc: "2026-09-13T04:00:00Z" }
              as: EventOrganizer
              as_user_id: "org-1"
              captures: { ev_id: $.data.id }
            - call: "POST /api/sponsors"
              payload: { event_id: "${ev_id}", org_name: "Acme Foundry", tier: "GOLD", commitment_cents: 250000 }
              as: EventOrganizer
              as_user_id: "org-1"
              captures: { sp_1: $.data.id }
            - call: "POST /api/program-ads"
              payload: { sponsor_id: "${sp_1}", event_id: "${ev_id}", ad_size: "FULL_PAGE", artwork_ref: "art-v1" }
              as: Sponsor
              as_user_id: "${sp_1}"
              captures: { ad_1: $.data.id }
            - call: "POST /api/program-ads/${ad_1}/review"
              payload: { decision: "BEGIN_REVIEW" }
              as: EventOrganizer
              as_user_id: "org-1"
            - call: "POST /api/program-ads/${ad_1}/review"
              payload: { decision: "REQUEST_CHANGES", notes: "Logo resolution too low." }
              as: EventOrganizer
              as_user_id: "org-1"
              captures: { st_1: $.data.status }
          trigger:
            - call: "POST /api/program-ads/${ad_1}/resubmit"
              payload: { artwork_ref: "art-v2" }
              as: Sponsor
              as_user_id: "${sp_1}"
              captures: { st_2: $.data.status, rev_2: $.data.revision_count }
            - call: "POST /api/program-ads/${ad_1}/review"
              payload: { decision: "BEGIN_REVIEW" }
              as: EventOrganizer
              as_user_id: "org-1"
              captures: { st_3: $.data.status }
          assert:
            - "${st_1} == CHANGES_REQUESTED"
            - "${st_2} == SUBMITTED"
            - "${rev_2} == 1"
            - "${st_3} == IN_REVIEW"
            - "ProgramAd.${ad_1}.artwork_ref == art-v2"

  - rule_id: transitive_cascade
    instances:
      - name: lot_close_cascades_through_invoice_totals_to_bidder_balance
        grounds:
          - state_machines.AuctionItem.OPEN_to_AWARDED
          - calculations.invoice_totals
          - entities.Bidder.fields.outstanding_balance_cents
          - entities.CheckoutInvoice.fields.line_subtotal_cents
        distinguishing_aspect: |
          Depth-4 chain triggered by POST /api/auction-items/{id}/close: award writes the lot's
          hammer price, the hammer price writes an invoice line, the new line forces the invoice
          totals recompute, and the recomputed balance forces Bidder.outstanding_balance_cents
          to 12500 - each hop caused by the previous hop, not by the close directly.
        test_recipe:
          setup:
            - "Clock at 2026-07-05T00:00:00Z; event PUBLISHED; bidder A with a card on file and no invoice yet."
            - "One OPEN lot with two ACTIVE bids: A at 10000 with proxy 20000, B at 12000."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-05T00:00:00Z" }
              as: EventOrganizer
              as_user_id: "org-1"
            - call: "POST /api/events"
              payload: { name: "Harbor Light Gala", event_start_utc: "2026-09-12T23:00:00Z", event_end_utc: "2026-09-13T04:00:00Z" }
              as: EventOrganizer
              as_user_id: "org-1"
              captures: { ev_id: $.data.id }
            - call: "POST /api/events/${ev_id}/tables"
              payload: { table_name: "T1", seat_count: 10, table_price_cents: 1250000, seat_price_cents: 12533 }
              as: EventOrganizer
              as_user_id: "org-1"
            - call: "POST /api/bidders"
              payload: { event_id: "${ev_id}", display_name: "Ada Lovelace", email: "ada@example.org", paddle_number: 101, payment_method_on_file: true }
              as: EventOrganizer
              as_user_id: "org-1"
              captures: { b_a: $.data.id }
            - call: "POST /api/bidders"
              payload: { event_id: "${ev_id}", display_name: "Grace Hopper", email: "grace@example.org", paddle_number: 102, payment_method_on_file: true }
              as: EventOrganizer
              as_user_id: "org-1"
