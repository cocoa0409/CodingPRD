              payload: { action: "COMPLETE" }
              as: ProgramCoordinator
            - call: "POST /ja-programs/students/${stu1}/transition"
              payload: { action: "SUBMIT_POST", score: 80 }
              as: ProgramCoordinator
            - call: "POST /ja-programs/students/${stu2}/transition"
              payload: { action: "SUBMIT_POST", score: 85 }
              as: ProgramCoordinator
            - call: "POST /ja-programs/students/${stu3}/transition"
              payload: { action: "SUBMIT_POST", score: 60 }
              as: ProgramCoordinator
            - call: "POST /ja-programs/students/${stu1}/transition"
              payload: { action: "VALIDATE" }
              as: ProgramCoordinator
            - call: "POST /ja-programs/students/${stu2}/transition"
              payload: { action: "VALIDATE" }
              as: ProgramCoordinator
          trigger:
            - call: "GET /ja-programs/partnership-agreements/${agr_id}/evaluation"
              payload: { variant: "PROVISIONAL" }
              as: Funder
              captures: { prov: $.data }
            - call: "GET /ja-programs/partnership-agreements/${agr_id}/evaluation"
              payload: { variant: "FINAL" }
              as: Funder
              captures: { fin: $.data }
          assert:
            - "PROVISIONAL: students_included == 4 and students_paired == 3"
            - "PROVISIONAL: avg_growth_score == 15.0  ((20+15+10)/3)"
            - "PROVISIONAL: sessions_delivered == 6 and sessions_scheduled == 2"
            - "PROVISIONAL: total_volunteer_hours == 8.0 and sponsor_volunteer_hours == 6.0"
            - "PROVISIONAL: completion_rate_pct == 75.0  (6 delivered of 8 required)"
            - "FINAL: students_included == 2 and students_paired == 2"
            - "FINAL: avg_growth_score == 17.5  ((20+15)/2)"
            - "FINAL: total_volunteer_hours == 6.0 and sponsor_volunteer_hours == 4.0"
            - "FINAL: sessions_delivered == 6 and sessions_scheduled == 2 (schedule counts are variant-independent)"
            - "The two variants disagree on students_included, avg_growth_score, and total_volunteer_hours for the identical database state"

      - name: recognition_tier_earned_none_vs_projected_bronze
        grounds:
          - calculations.recognition_tier
          - entities.PartnershipAgreement.fields.recognition_tier
          - entities.PartnershipAgreement.fields.sponsor_volunteer_hours
        distinguishing_aspect: |
          Same agreement state, two variants: EARNED counts only DELIVERED session hours
          (4 x 2.0 = 8.0, below BRONZE_HOURS=10 -> NONE, and this is what is persisted on
          agreement.recognition_tier), while PROJECTED also counts the still-SCHEDULED fifth
          session (10.0 hours, with funding 500000 >= BRONZE_FUNDING_CENTS -> BRONZE).
          Entity domain: sponsor funding/volunteer-hours on the agreement (distinct from the
          student-survey domain of the sibling instance).
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. Base territory/school; partner1 ACTIVE with eligible vol1."
            - "Program JA-FIN (session_count 5, 120min advisory, no capstone, students 4-30)."
            - "Agreement pledge 500000 ACTIVE; funding fully recorded at exactly the pledge (500000)."
            - "Delivery enrolled 10 (required_kits 13) fully SCHEDULED, 5 sessions of 120 minutes on Tuesdays 09-08..10-06."
            - "Sessions 1-4 DELIVERED by vol1 (sponsor's volunteer); session 5 still SCHEDULED at clock 2026-09-29."
          setup_api_calls:
