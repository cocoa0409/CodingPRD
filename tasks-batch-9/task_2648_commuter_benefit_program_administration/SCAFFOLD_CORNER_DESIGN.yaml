            - "Reviewer rev-deny then denied substantiation, running cascade B: the transaction is INELIGIBLE with posted_spend_cents 0, a SPEND_REVERSAL of +3000 restored available_balance_cents to 10000 (3 ledger rows), employee.repayment_due_cents is 3000, substantiation_hold is true, and the election is HELD."
