        distinguishing_aspect: |
          Depth-3 chain from POST /dock-tickets/{id}/void (different trigger from the
          condemn cascade): ticket VOIDED recalls its derived InventoryLots; each recall
          releases the lot's RESERVED allocations; the release recomputes the order
          line; and the ticket's own reversal arm debits Vessel.payable_balance_cents
          back to its pre-settle value.
