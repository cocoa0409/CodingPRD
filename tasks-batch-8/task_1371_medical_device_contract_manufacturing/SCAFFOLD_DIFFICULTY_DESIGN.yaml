  # ------------------------------------------------------------------
  # Rule 3 — non_linear_state_machine
  # ------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: validation_protocol_reject_loop_and_revalidation_cycle
        grounds:
          - state_machines.ValidationProtocol
          - entities.ValidationProtocol.fields.generation
          - entities.ValidationProtocol.fields.revalidation_reason
        distinguishing_aspect: |
          Cyclic machine on ValidationProtocol: an IQ reject loops IQ_REVIEW -> IQ_EXECUTION and clears
          the executor (a different engineer re-executes); after VALIDATED, the 36-month time sweep loops
          the whole machine back through REVALIDATION_REQUIRED -> IQ_EXECUTION with generation 2.
        test_recipe:
          setup:
            - "DMR DEV-V rev A APPROVED; line L-V; protocol VP-V created (DRAFT)"
          setup_api_calls:
            - { call: "POST /api/manufacturing-lines", payload: { line_code: "L-V", changeover_buffer_hours: 24 }, as: QMSAdmin, as_user_id: "admin-1", captures: { line_id: "$.data.id" } }
            - { call: "POST /api/device-master-records", payload: { device_code: "DEV-V", revision_code: "A", sterile: true, shelf_life_claim_months: 20 }, as: QualityEngineer, as_user_id: "qe-alice", captures: { dmr_id: "$.data.id" } }
            - { call: "POST /api/device-master-records/${dmr_id}/approve", payload: {}, as: QualityManager, as_user_id: "qm-bob" }
            - { call: "POST /api/validation-protocols", payload: { protocol_code: "VP-V", dmr_id: "${dmr_id}", line_id: "${line_id}", planned_start: "2026-09-01T00:00:00Z", planned_end: "2026-09-10T00:00:00Z" }, as: QualityEngineer, as_user_id: "qe-alice", captures: { proto_id: "$.data.id" } }
            - { call: "POST /api/validation-protocols/${proto_id}/execute-phase", payload: {}, as: QualityEngineer, as_user_id: "qe-alice" }
            - { call: "POST /api/validation-protocols/${proto_id}/submit-phase-review", payload: {}, as: QualityEngineer, as_user_id: "qe-alice" }
            - { call: "POST /api/validation-protocols/${proto_id}/reject-phase", payload: {}, as: QualityManager, as_user_id: "qm-bob", captures: { st_after_reject: "$.data.status", exec_after_reject: "$.data.iq_executor_user_id" } }
            - { call: "POST /api/validation-protocols/${proto_id}/submit-phase-review", payload: {}, as: QualityEngineer, as_user_id: "qe-carol", captures: { exec_second: "$.data.iq_executor_user_id" } }
            - { call: "POST /api/validation-protocols/${proto_id}/approve-phase", payload: {}, as: QualityManager, as_user_id: "qm-bob" }
            - { call: "POST /api/validation-protocols/${proto_id}/submit-phase-review", payload: {}, as: QualityEngineer, as_user_id: "qe-carol" }
            - { call: "POST /api/validation-protocols/${proto_id}/approve-phase", payload: {}, as: QualityManager, as_user_id: "qm-bob" }
            - { call: "POST /api/validation-protocols/${proto_id}/submit-phase-review", payload: {}, as: QualityEngineer, as_user_id: "qe-carol" }
            - { call: "POST /api/validation-protocols/${proto_id}/approve-phase", payload: {}, as: QualityManager, as_user_id: "qm-bob", captures: { st_validated: "$.data.status", val_at: "$.data.validated_at", due_at: "$.data.revalidation_due_at" } }
          trigger:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2029-08-01T00:00:00Z" }, as: QMSAdmin, as_user_id: "admin-1" }
            - { call: "GET /api/validation-protocols/${proto_id}", payload: {}, as: QualityManager, as_user_id: "qm-bob", captures: { st_swept: "$.data.status", reason_swept: "$.data.revalidation_reason" } }
            - { call: "POST /api/validation-protocols/${proto_id}/execute-phase", payload: {}, as: QualityEngineer, as_user_id: "qe-alice", captures: { st_reexec: "$.data.status", gen_reexec: "$.data.generation" } }
          assert:
            - "after reject: status == IQ_EXECUTION and iq_executor_user_id == null (executor cleared for rework)"
            - "after re-submit by qe-carol: iq_executor_user_id == 'qe-carol'"
            - "after PQ approval: status == VALIDATED, validated_at == 2026-08-01T00:00:00Z (clock default), revalidation_due_at == 2029-08-01T00:00:00Z"
            - "after clock sweep to the due date (inclusive >=): status == REVALIDATION_REQUIRED and revalidation_reason == TIME_EXPIRY"
            - "after re-execute: status == IQ_EXECUTION and generation == 2 (cyclic re-entry)"

      - name: device_lot_parallel_disposition_and_hold
        grounds:
          - state_machines.DeviceLot
          - entities.DeviceLot.fields.disposition_status
          - entities.DeviceLot.fields.hold_status
        distinguishing_aspect: |
          Parallel state dimensions on one entity: hold_status flips CLEAR -> ON_HOLD -> CLEAR while
          disposition_status stays COMPLETED, and release is gated by BOTH dimensions (hold blocks
          release with ERR_LOT_ON_HOLD even though the disposition machine is in a releasable state).
        test_recipe:
          setup:
            - "DMR DEV-P rev A APPROVED; protocol VP-P VALIDATED; supplier SUP-P QUALIFIED, part PN-P received 100"
            - "lot LT-P COMPLETED (qty 10, component recorded), sterility PASSED, label PRINTED"
