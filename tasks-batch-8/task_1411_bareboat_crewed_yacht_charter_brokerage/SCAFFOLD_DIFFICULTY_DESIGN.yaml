            - { call: "POST /clients/${cl_id}/resume/review", payload: { outcome: QUALIFIED }, as: PlatformAdmin }
            - { call: "POST /yachts", payload: { name: "Yacht A", charter_type: BAREBOAT, home_port: "Athens", capacity_berths: 8, weekly_base_rate_cents: 700000, min_charter_days: 3, required_resume_class: COASTAL, security_deposit_cents: 500000, pricing_mode: PRO_RATA, listing_central_agent_id: "${ca_id}" }, as: Operator, as_user_id: "${op_id}", captures: { ya_id: $.data.id } }
            - { call: "POST /yachts/${ya_id}/list", payload: {}, as: Operator, as_user_id: "${op_id}" }
            - { call: "POST /charter-requests", payload: { client_id: "${cl_id}", yacht_id: "${ya_id}", start_date: "2026-10-30", end_date: "2026-11-19", guests_count: 4 }, as: Client, as_user_id: "${cl_id}", captures: { rq1_id: $.data.id } }
            - { call: "POST /charter-requests/${rq1_id}/submit", payload: {}, as: Client, as_user_id: "${cl_id}" }
            - { call: "POST /charter-requests/${rq1_id}/offer", payload: {}, as: CentralAgent, as_user_id: "${ca_id}", captures: { rq1_v: $.data.version } }
            - { call: "POST /charter-requests/${rq1_id}/accept", payload: { expected_charter_request_version: "${rq1_v}" }, as: Client, as_user_id: "${cl_id}", captures: { ag1_id: $.data.id } }
            - { call: "GET /yachts/${ya_id}/availability-blocks?status=ACTIVE", payload: {}, as: Operator, as_user_id: "${op_id}" }
            - { call: "POST /charter-agreements/${ag1_id}/cancel", payload: {}, as: Client, as_user_id: "${cl_id}" }
            - { call: "GET /yachts/${ya_id}/availability-blocks?status=ACTIVE", payload: {}, as: Operator, as_user_id: "${op_id}" }
          trigger:
            - { call: "POST /charter-requests/${rq1_id}/rebook", payload: { yacht_id: "${ya_id}", start_date: "2026-10-30", end_date: "2026-11-19", guests_count: 4 }, as: Client, as_user_id: "${cl_id}", captures: { rq2_id: $.data.id } }
            - { call: "POST /charter-requests/${rq2_id}/submit", payload: {}, as: Client, as_user_id: "${cl_id}" }
            - { call: "POST /charter-requests/${rq2_id}/offer", payload: {}, as: CentralAgent, as_user_id: "${ca_id}", captures: { rq2_v: $.data.version } }
            - { call: "POST /charter-requests/${rq2_id}/accept", payload: { expected_charter_request_version: "${rq2_v}" }, as: Client, as_user_id: "${cl_id}", captures: { ag2_id: $.data.id } }
            - { call: "GET /yachts/${ya_id}/availability-blocks?status=ACTIVE", payload: {}, as: Operator, as_user_id: "${op_id}" }
          assert:
            - "after first accept: exactly 1 ACTIVE block, block_type CHARTER, [2026-10-30, 2026-11-19) = 20 block-days"
            - "after cancel: 0 ACTIVE blocks for the yacht (block RELEASED by the cascade)"
            - "CharterRequest.${rq2_id}.rebooked_from_request_id == ${rq1_id} and status ends ACCEPTED"
            - "after rebook+accept: exactly 1 ACTIVE CHARTER block with identical dates — ACTIVE CHARTER block-days are 20 before and 20 after (cancel + rebook compensate exactly)"
