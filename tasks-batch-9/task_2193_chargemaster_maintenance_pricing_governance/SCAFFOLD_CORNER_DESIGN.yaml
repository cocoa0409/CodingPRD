            - "Item CDM-1001 created in CCN-0001 with effective_from 2026-09-01T00:00:00Z (equal to the logical now, which is legal)."
            - "The clock is then advanced to 2026-09-02T00:00:00Z, which retroactively makes 2026-09-01 a past date."
