            - "${after_status} == VERIFIED and ${after_note} == stripped (the rejected submit changed nothing)"
            - "Turnover.${t1}.status == IN_PROGRESS (three children are still PENDING)"

      - name: corner_accepting_an_already_accepted_offer_is_rejected
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Assignment.OFFERED_to_ACCEPTED.preconditions
          - errors[ERR_INVALID_ASSIGNMENT_STATE]
          - validations[priority 12]
        distinguishing_aspect: |
          The accept edge requires assignment.status == OFFERED. A second accept on the same
          assignment returns ERR_INVALID_ASSIGNMENT_STATE 409 and - critically - does NOT
          create a second PayLine or credit the ledger twice: pending_payout_cents stays at
          the single PROVISIONAL net 12554.
