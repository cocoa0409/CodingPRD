              payload: { agency_id: "${ag_id}", service_code: "TAG-FEE", name: "Tag Fee Absorbed", fee_model: "ABSORBED", allowed_methods: ["CARD"], min_amount_cents: 100, max_amount_cents: 100000, gl_code: "4120" }
              as: AgencyAdmin
              as_user_id: "aa-lead"
              captures: { svc_abs: $.data.id }
          trigger:
