        claim_type: peer_roles
        grounds:
          - roles.FacilityScheduler
          - validations[priority=40]
          - errors[ERR_ROLE_SCOPE_VIOLATION]
        distinguishing_aspect: "A FacilityScheduler whose X-User-ID is facility B cancelling facility A's order is refused with ERR_ROLE_SCOPE_VIOLATION (403); the order stays OPEN."
        test_recipe:
          setup:
