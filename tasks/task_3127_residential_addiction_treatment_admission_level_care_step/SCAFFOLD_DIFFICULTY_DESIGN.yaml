  - name: level_change_legality_bound_on_facility_ops_epoch
    grounds:
    - state_machines.LevelOfCareChange.PLANNED_to_COMPLETED
    - state_machines.LevelOfCareChange.PLANNED_to_PENDING_DISCHARGE_ORDER
    - errors[ERR_AUTHORIZATION_NOT_APPROVED]
    - validations[priority=16]
    distinguishing_aspect: 'Whether a level-of-care CHANGE may complete is decided by ANOTHER entity''s
      state: a change whose target authorization is still PENDING is refused with 409 ERR_AUTHORIZATION_NOT_APPROVED
