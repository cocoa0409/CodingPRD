            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-07T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /subscriptions/${s_c_id}/renewals"
              payload: {}
              as: BillingOperator
          trigger:
            - call: "POST /retention-cohort-snapshots"
              payload: { cohort_month: "2026-01", ltv_variant: "REALIZED" }
              as: RetentionSpecialist
              captures: { snap_id: $.data.id }
          assert:
            - "Response status is 201"
            - "Subscription.${s_c_id}.lifecycle_state == CANCELLED"
            - "Subscriber.${sub_c_id}.churn_type == VOLUNTARY"
            - "RetentionCohortSnapshot.${snap_id}.member_count == 3"
            - "RetentionCohortSnapshot.${snap_id}.retained_count == 2"
            - "RetentionCohortSnapshot.${snap_id}.churned_voluntary_count == 1"
            - "RetentionCohortSnapshot.${snap_id}.churned_involuntary_count == 0"
            - "RetentionCohortSnapshot.${snap_id}.retention_rate == 0.6667"
            - "RetentionCohortSnapshot.${snap_id}.mean_ltv_cents == 0"
            - "RetentionCohortSnapshot.${snap_id}.computed_at == 2026-02-07T00:00:00Z"

      - name: committed_price_aggregation_conserves_the_delta_ledger
        claim_type: aggregation
        grounds:
          - calculations.committed_price_cents
        excluded_because:
          difficulty_instance: compensating_invariant / committed_price_conserved_across_downgrade_and_reversal
          rationale: "The named §1.8 instance asserts the baseline-plus-delta conservation identity over APPLIED and REVERSED rows."

      - name: invoice_line_rounding_precision_under_discount
        claim_type: precision
        grounds:
          - calculations.invoice_amount_cents.constants.ROUNDING
        excluded_because:
          difficulty_instance: combinatorial_formula / invoice_per_line_rounding_before_summation_under_discount
          rationale: "The named §1.8 instance pins 4093 against the forbidden 4094 reading of the same discounted invoice."

      - name: save_offer_margin_variants_diverge_on_the_same_grant
        claim_type: variant_divergence
        grounds:
          - calculations.save_offer_margin_pct.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / save_offer_margin_per_cycle_versus_blended_term_guardrail
          rationale: "The named §1.8 instance asserts 0.3536 against 0.5115 on one grant and shows only the blended variant feeds the guardrail."

      - name: ltv_variant_selection_by_snapshot_input
        claim_type: variant_selection
        grounds:
          - entities.RetentionCohortSnapshot.fields.ltv_variant
        excluded_because:
          difficulty_instance: dual_variant_calc / ltv_realized_versus_projected_on_same_subscriber
          rationale: "The named §1.8 instance drives both snapshot variants over one subscriber and asserts each mean."

      - name: weighted_scoring_weights_and_rounding_do_not_drift
        claim_type: weighted_scoring
        grounds:
          - calculations.save_offer_margin_pct
        excluded_because:
          difficulty_instance: dual_variant_calc / save_offer_margin_per_cycle_versus_blended_term_guardrail
          rationale: "The named §1.8 instance pins both weighted margin readings to 4 decimals on the same horizon."

  # ===========================================================================
  - section: validations
    instances:

      - name: disclosure_gate_applies_only_to_negative_option_plans
        claim_type: conditional_validation
        grounds:
          - validations[priority=25]
          - errors[ERR_DISCLOSURE_NOT_ACKNOWLEDGED]
          - entities.Plan.fields.is_negative_option
        distinguishing_aspect: |
          The same payload with disclosure_acknowledged false is a 201 on BOUND
          (is_negative_option false) and a 422 ERR_DISCLOSURE_NOT_ACKNOWLEDGED on CORE
          (is_negative_option true) - the rule is conditional on the plan flag, not universal, and
          the non-negative-option signup creates no disclosure notice at all.
        test_recipe:
          setup:
            - "Clock 2026-01-10; plan BOUND (not negative option, cadence [4]) and plan CORE (negative option); subscriber A with an ACTIVE card."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /plans"
              payload: { code: "BOUND", name: "Bounded Box", monthly_price_cents: 5000, unit_cogs_cents: 2500, margin_floor_pct: 0.4048, allowed_frequency_weeks: [4], is_negative_option: false }
              as: PlatformAdmin
              captures: { bound_plan_id: $.data.id }
            - call: "POST /plans"
              payload: { code: "CORE", name: "Core Box", monthly_price_cents: 4999, unit_cogs_cents: 2100, margin_floor_pct: 0.4200 }
              as: PlatformAdmin
              captures: { core_plan_id: $.data.id }
            - call: "POST /subscribers"
              payload: { email: "a@dtc.test", acquisition_channel: "ORGANIC" }
              as: PlatformAdmin
              captures: { sub_a_id: $.data.id }
            - call: "POST /payment-methods"
              payload: { subscriber_id: "${sub_a_id}", card_last4: "4242", exp_month: 12, exp_year: 2030, network: "VISA" }
              as: PlatformAdmin
              captures: { pm_a_id: $.data.id }
          trigger:
            - call: "POST /subscriptions"
              payload: { subscriber_id: "${sub_a_id}", plan_id: "${bound_plan_id}", payment_method_id: "${pm_a_id}", frequency_weeks: 4, disclosure_acknowledged: false }
              as: PlatformAdmin
              captures: { s_bound_id: $.data.id }
            - call: "POST /subscriptions"
              payload: { subscriber_id: "${sub_a_id}", plan_id: "${core_plan_id}", payment_method_id: "${pm_a_id}", frequency_weeks: 4, disclosure_acknowledged: false }
              as: PlatformAdmin
              captures: { err_disc: $.data.error_id }
          assert:
            - "First response status is 201 and Subscription.${s_bound_id}.disclosure_acknowledged == false"
            - "GET /subscriptions/${s_bound_id}/compliance-notices returns meta.total_count == 0"
            - "Second response status is 422"
            - "error_id == ERR_DISCLOSURE_NOT_ACKNOWLEDGED"
            - "Plan.${core_plan_id}.active_subscription_count == 0"

      - name: renewal_before_next_renewal_at_returns_renewal_not_due
        claim_type: temporal_validation
        grounds:
          - validations[priority=32]
          - errors[ERR_RENEWAL_NOT_DUE]
          - entities.Subscription.fields.next_renewal_at
        distinguishing_aspect: |
          One day early is still early: on a non-negative-option plan (so the reminder gate at
          priority 26 cannot mask the result) a renewal run at 2026-02-06 against next_renewal_at
          2026-02-07 is 409 ERR_RENEWAL_NOT_DUE and issues no second invoice.
        test_recipe:
          setup:
            - "Clock 2026-01-10; plan BOUND (cadence [4], not negative option); subscriber A subscribed, next_renewal_at 2026-02-07; clock moved to 2026-02-06."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /plans"
              payload: { code: "BOUND", name: "Bounded Box", monthly_price_cents: 5000, unit_cogs_cents: 2500, margin_floor_pct: 0.4048, allowed_frequency_weeks: [4], is_negative_option: false }
              as: PlatformAdmin
              captures: { bound_plan_id: $.data.id }
            - call: "POST /subscribers"
              payload: { email: "a@dtc.test", acquisition_channel: "ORGANIC" }
              as: PlatformAdmin
              captures: { sub_a_id: $.data.id }
            - call: "POST /payment-methods"
              payload: { subscriber_id: "${sub_a_id}", card_last4: "4242", exp_month: 12, exp_year: 2030, network: "VISA" }
              as: PlatformAdmin
              captures: { pm_a_id: $.data.id }
            - call: "POST /subscriptions"
              payload: { subscriber_id: "${sub_a_id}", plan_id: "${bound_plan_id}", payment_method_id: "${pm_a_id}", frequency_weeks: 4, disclosure_acknowledged: true }
              as: PlatformAdmin
              captures: { s_a_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-06T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /subscriptions/${s_a_id}/renewals"
              payload: {}
              as: BillingOperator
              captures: { err_due: $.data.error_id }
          assert:
            - "Response status is 409"
            - "error_id == ERR_RENEWAL_NOT_DUE"
            - "GET /invoices?subscription_id=${s_a_id} returns meta.total_count == 1"
            - "Subscription.${s_a_id}.next_renewal_at == 2026-02-07T00:00:00Z"
            - "Subscription.${s_a_id}.term_shipments_delivered == 1"
            - "Subscription.${s_a_id}.version == 1"

      - name: fourth_pre_completion_step_returns_simple_cancellation_violation
        claim_type: violation_to_error
        grounds:
          - validations[priority=24]
          - calculations.cancellation_step_budget
          - errors[ERR_SIMPLE_CANCELLATION_VIOLATION]
        distinguishing_aspect: |
          create (1) + reason (2) + present-offers (3) exhausts the pre-completion budget of
          MAX_CANCELLATION_STEPS - 1, so a reason revision is 422
          ERR_SIMPLE_CANCELLATION_VIOLATION with no state change - step_count stays 3 and the
          original reason_code PRICE and null reason_detail survive.
        test_recipe:
          setup:
            - "Clock 2026-01-10; CORE subscription for subscriber A; template T_PRICE (DISCOUNT 0.1000 x 1, reason PRICE, rank 10)."
            - "A session captured reason PRICE and a specialist presented the offer, leaving step_count 3."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /plans"
              payload: { code: "CORE", name: "Core Box", monthly_price_cents: 4999, unit_cogs_cents: 2100, margin_floor_pct: 0.4200 }
              as: PlatformAdmin
              captures: { core_plan_id: $.data.id }
            - call: "POST /save-offer-templates"
              payload: { code: "T_PRICE", name: "Ten Off One Cycle", offer_type: "DISCOUNT", priority_rank: 10, discount_pct: 0.1000, discount_cycles: 1, eligible_reason_codes: ["PRICE"] }
              as: PlatformAdmin
            - call: "POST /subscribers"
              payload: { email: "a@dtc.test", acquisition_channel: "ORGANIC" }
              as: PlatformAdmin
              captures: { sub_a_id: $.data.id }
            - call: "POST /payment-methods"
              payload: { subscriber_id: "${sub_a_id}", card_last4: "4242", exp_month: 12, exp_year: 2030, network: "VISA" }
              as: PlatformAdmin
              captures: { pm_a_id: $.data.id }
            - call: "POST /subscriptions"
              payload: { subscriber_id: "${sub_a_id}", plan_id: "${core_plan_id}", payment_method_id: "${pm_a_id}", frequency_weeks: 4, disclosure_acknowledged: true }
              as: PlatformAdmin
              captures: { s_a_id: $.data.id }
            - call: "POST /cancellation-sessions"
              payload: { subscription_id: "${s_a_id}", entry_channel: "WEB_SELF_SERVE" }
              as: Subscriber
              as_user_id: "${sub_a_id}"
              captures: { sess_id: $.data.id }
            - call: "POST /cancellation-sessions/${sess_id}/reason"
              payload: { reason_code: "PRICE" }
              as: Subscriber
              as_user_id: "${sub_a_id}"
            - call: "POST /cancellation-sessions/${sess_id}/present-offers"
              payload: {}
              as: RetentionSpecialist
              as_user_id: "rs_31"
              captures: { grant_id: $.data.id }
          trigger:
            - call: "POST /cancellation-sessions/${sess_id}/reason"
              payload: { reason_code: "OTHER", reason_detail: "second thoughts" }
              as: Subscriber
              as_user_id: "${sub_a_id}"
              captures: { err_budget: $.data.error_id }
            - call: "POST /cancellation-sessions/${sess_id}/complete"
              payload: { confirm: true }
              as: Subscriber
              as_user_id: "${sub_a_id}"
          assert:
            - "First response status is 422 with error_id == ERR_SIMPLE_CANCELLATION_VIOLATION"
            - "CancellationSession.${sess_id}.reason_code == PRICE"
            - "CancellationSession.${sess_id}.reason_detail == null"
            - "Second response status is 200 - completion is exempt from the budget"
            - "CancellationSession.${sess_id}.state == COMPLETED_CANCELLED"
            - "CancellationSession.${sess_id}.step_count == 4"
            - "SaveOfferGrant.${grant_id}.state == EXPIRED"
            - "Subscription.${s_a_id}.lifecycle_state == PENDING_CANCEL"

      - name: skip_with_no_remaining_term_units_returns_skip_budget_exhausted
        claim_type: aggregate_validation
        grounds:
          - validations[priority=36]
          - errors[ERR_SKIP_BUDGET_EXHAUSTED]
          - entities.Subscription.fields.term_shipments_remaining
        distinguishing_aspect: |
          On a plan with shipments_per_term 1 the signup already consumed the whole term allotment,
          so the aggregate remaining count is 0 and the individually well-formed SKIP_SHIPMENT is
          422 ERR_SKIP_BUDGET_EXHAUSTED with no modification row persisted.
        test_recipe:
          setup:
            - "Clock 2026-01-10; plan ONESHOT (3000 / 1000, shipments_per_term 1); subscriber A subscribed, so delivered 1 / skipped 0 / remaining 0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /plans"
              payload: { code: "ONESHOT", name: "Single Term Box", monthly_price_cents: 3000, unit_cogs_cents: 1000, margin_floor_pct: 0.3000, shipments_per_term: 1 }
              as: PlatformAdmin
              captures: { one_plan_id: $.data.id }
            - call: "POST /subscribers"
              payload: { email: "a@dtc.test", acquisition_channel: "ORGANIC" }
              as: PlatformAdmin
              captures: { sub_a_id: $.data.id }
            - call: "POST /payment-methods"
              payload: { subscriber_id: "${sub_a_id}", card_last4: "4242", exp_month: 12, exp_year: 2030, network: "VISA" }
              as: PlatformAdmin
              captures: { pm_a_id: $.data.id }
            - call: "POST /subscriptions"
              payload: { subscriber_id: "${sub_a_id}", plan_id: "${one_plan_id}", payment_method_id: "${pm_a_id}", frequency_weeks: 4, disclosure_acknowledged: true }
              as: PlatformAdmin
              captures: { s_a_id: $.data.id, v1: $.data.version }
          trigger:
            - call: "POST /subscriptions/${s_a_id}/modifications"
              payload: { mod_type: "SKIP_SHIPMENT", expected_subscription_version: "${v1}", skip_ship_at: "2026-02-07T00:00:00Z" }
              as: Subscriber
              as_user_id: "${sub_a_id}"
              captures: { err_skip: $.data.error_id }
          assert:
            - "Response status is 422"
            - "error_id == ERR_SKIP_BUDGET_EXHAUSTED"
            - "Subscription.${s_a_id}.term_shipments_delivered == 1"
            - "Subscription.${s_a_id}.term_shipments_skipped == 0"
            - "Subscription.${s_a_id}.term_shipments_remaining == 0"
            - "Subscription.${s_a_id}.version == 1"
            - "GET /subscription-modifications?subscription_id=${s_a_id} returns meta.total_count == 0"

      - name: pause_longer_than_max_pause_cycles_returns_constraint_error
        claim_type: violation_to_error
        grounds:
          - validations[priority=35]
          - errors[ERR_PAUSE_EXCEEDS_MAX_CYCLES]
          - entities.Plan.fields.max_pause_cycles
        distinguishing_aspect: |
          A 120-day pause on a 28-day cadence needs ceil(120 / 28) = 5 cycles against
          max_pause_cycles 3, so the request is 422 ERR_PAUSE_EXCEEDS_MAX_CYCLES; the subscription
          stays ACTIVE with paused_until null and pause_cycles_used 0.
        test_recipe:
          setup:
            - "Clock 2026-01-10; CORE subscription (max_pause_cycles 3) for subscriber A at 4-week cadence."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /plans"
              payload: { code: "CORE", name: "Core Box", monthly_price_cents: 4999, unit_cogs_cents: 2100, margin_floor_pct: 0.4200 }
              as: PlatformAdmin
              captures: { core_plan_id: $.data.id }
            - call: "POST /subscribers"
              payload: { email: "a@dtc.test", acquisition_channel: "ORGANIC" }
              as: PlatformAdmin
              captures: { sub_a_id: $.data.id }
            - call: "POST /payment-methods"
              payload: { subscriber_id: "${sub_a_id}", card_last4: "4242", exp_month: 12, exp_year: 2030, network: "VISA" }
              as: PlatformAdmin
              captures: { pm_a_id: $.data.id }
            - call: "POST /subscriptions"
              payload: { subscriber_id: "${sub_a_id}", plan_id: "${core_plan_id}", payment_method_id: "${pm_a_id}", frequency_weeks: 4, disclosure_acknowledged: true }
              as: PlatformAdmin
              captures: { s_a_id: $.data.id, v1: $.data.version }
          trigger:
            - call: "POST /subscriptions/${s_a_id}/modifications"
              payload: { mod_type: "PAUSE", expected_subscription_version: "${v1}", pause_start_at: "2026-01-10T00:00:00Z", pause_end_at: "2026-05-10T00:00:00Z" }
              as: Subscriber
              as_user_id: "${sub_a_id}"
              captures: { err_pause: $.data.error_id }
          assert:
            - "Response status is 422"
            - "error_id == ERR_PAUSE_EXCEEDS_MAX_CYCLES"
            - "Subscription.${s_a_id}.lifecycle_state == ACTIVE"
            - "Subscription.${s_a_id}.paused_until == null"
            - "Subscription.${s_a_id}.pause_cycles_used == 0"
            - "Subscription.${s_a_id}.version == 1"

      - name: allowed_frequency_change_passes_and_leaves_price_untouched
        claim_type: satisfaction_to_pass
        grounds:
          - validations[priority=33]
          - entities.Plan.fields.allowed_frequency_weeks
          - entities.SubscriptionModification.fields.delta_price_cents
        distinguishing_aspect: |
          8 is a member of CORE's allowed cadence [2, 4, 8], so the same rule that rejects 3 admits
          this request: the modification settles APPLIED with delta_price_cents 0, because cadence
          changes move the shipment clock but never the committed price.
        test_recipe:
          setup:
            - "Clock 2026-01-10; CORE subscription for subscriber A at 4-week cadence, version 1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /plans"
              payload: { code: "CORE", name: "Core Box", monthly_price_cents: 4999, unit_cogs_cents: 2100, margin_floor_pct: 0.4200 }
              as: PlatformAdmin
              captures: { core_plan_id: $.data.id }
            - call: "POST /subscribers"
              payload: { email: "a@dtc.test", acquisition_channel: "ORGANIC" }
              as: PlatformAdmin
              captures: { sub_a_id: $.data.id }
            - call: "POST /payment-methods"
              payload: { subscriber_id: "${sub_a_id}", card_last4: "4242", exp_month: 12, exp_year: 2030, network: "VISA" }
              as: PlatformAdmin
              captures: { pm_a_id: $.data.id }
            - call: "POST /subscriptions"
              payload: { subscriber_id: "${sub_a_id}", plan_id: "${core_plan_id}", payment_method_id: "${pm_a_id}", frequency_weeks: 4, disclosure_acknowledged: true }
              as: PlatformAdmin
              captures: { s_a_id: $.data.id, v1: $.data.version }
          trigger:
            - call: "POST /subscriptions/${s_a_id}/modifications"
              payload: { mod_type: "FREQUENCY_CHANGE", expected_subscription_version: "${v1}", frequency_weeks: 8 }
              as: Subscriber
              as_user_id: "${sub_a_id}"
              captures: { mod_id: $.data.id }
          assert:
            - "Response status is 201"
            - "SubscriptionModification.${mod_id}.state == APPLIED"
            - "SubscriptionModification.${mod_id}.applied_at == 2026-01-10T00:00:00Z"
            - "SubscriptionModification.${mod_id}.delta_price_cents == 0"
            - "SubscriptionModification.${mod_id}.save_offer_grant_id == null"
            - "SubscriptionModification.${mod_id}.prior_snapshot.frequency_weeks == 4"
            - "Subscription.${s_a_id}.frequency_weeks == 8"
            - "Subscription.${s_a_id}.committed_price_cents == 4999"
            - "Subscription.${s_a_id}.version == 2"

      - name: notice_cooldown_blocks_a_second_send_two_days_later_but_admits_it_on_day_three
        claim_type: temporal_validation
        grounds:
          - validations[priority=27]
          - errors[ERR_NOTICE_COOLDOWN_ACTIVE]
          - global_constants.NOTICE_COOLDOWN_DAYS
        distinguishing_aspect: |
          Two RENEWAL_REMINDER notices for cycle 1 exist; after the first is sent on 2026-01-28 the
          second is 409 ERR_NOTICE_COOLDOWN_ACTIVE on 2026-01-30 (2 days) and 200 on 2026-01-31
          (exactly NOTICE_COOLDOWN_DAYS = 3), so the boundary is inclusive on the passing side.
        test_recipe:
          setup:
            - "Clock 2026-01-10; CORE (negative option) subscription for subscriber A; signup scheduled the cycle-1 reminder for 2026-01-28."
            - "A compliance officer scheduled a second RENEWAL_REMINDER for 2026-01-30, inside the legal window [2026-01-28, 2026-02-04]."
            - "The first reminder was sent on 2026-01-28."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /plans"
              payload: { code: "CORE", name: "Core Box", monthly_price_cents: 4999, unit_cogs_cents: 2100, margin_floor_pct: 0.4200 }
              as: PlatformAdmin
              captures: { core_plan_id: $.data.id }
            - call: "POST /subscribers"
              payload: { email: "a@dtc.test", acquisition_channel: "ORGANIC" }
              as: PlatformAdmin
              captures: { sub_a_id: $.data.id }
            - call: "POST /payment-methods"
              payload: { subscriber_id: "${sub_a_id}", card_last4: "4242", exp_month: 12, exp_year: 2030, network: "VISA" }
              as: PlatformAdmin
              captures: { pm_a_id: $.data.id }
            - call: "POST /subscriptions"
              payload: { subscriber_id: "${sub_a_id}", plan_id: "${core_plan_id}", payment_method_id: "${pm_a_id}", frequency_weeks: 4, disclosure_acknowledged: true }
              as: PlatformAdmin
              captures: { s_a_id: $.data.id }
            - call: "POST /subscriptions/${s_a_id}/compliance-notices"
              payload: { notice_type: "RENEWAL_REMINDER", scheduled_for: "2026-01-30T00:00:00Z", channel: "SMS" }
              as: ComplianceOfficer
              captures: { extra_notice_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-28T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /subscriptions/${s_a_id}/compliance-notices"
              payload: { notice_type: "RENEWAL_REMINDER" }
              as: BillingOperator
              captures: { auto_notice_id: "$.data[0].id" }
            - call: "POST /compliance-notices/${auto_notice_id}/send"
              payload: {}
              as: BillingOperator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-30T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /compliance-notices/${extra_notice_id}/send"
              payload: {}
              as: BillingOperator
              captures: { err_cooldown: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-31T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /compliance-notices/${extra_notice_id}/send"
              payload: {}
              as: BillingOperator
          assert:
            - "First send response status is 409 with error_id == ERR_NOTICE_COOLDOWN_ACTIVE"
            - "ComplianceNotice.${extra_notice_id}.state == SCHEDULED after the rejected call"
            - "ComplianceNotice.${extra_notice_id}.renewal_cycle_index == 1"
            - "Second send response status is 200"
            - "ComplianceNotice.${extra_notice_id}.state == SENT"
            - "ComplianceNotice.${extra_notice_id}.sent_at == 2026-01-31T00:00:00Z"
            - "ComplianceNotice.${auto_notice_id}.sent_at == 2026-01-28T00:00:00Z"

      - name: state_priority_outranks_fiscal_priority_on_one_request
        claim_type: priority_ordering
        grounds:
          - validations[priority=16]
          - validations[priority=46]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / offer_expiry_state_outranks_margin_floor_fiscal
          rationale: "The named §1.8 instance violates both rules with one accept call and asserts the lower-priority error is returned."

      - name: safety_priority_outranks_referential_priority_on_one_request
        claim_type: priority_ordering
        grounds:
          - validations[priority=26]
          - validations[priority=48]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / renewal_reminder_safety_outranks_payment_method_referential
          rationale: "The named §1.8 instance violates both rules with one renewal call and asserts priority 26 wins."

      - name: validity_depends_on_a_notice_row_of_another_entity
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=26]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / renewal_gated_by_compliance_notice_sent_state
          rationale: "The named §1.8 instance tests both the SENT and the not-SENT reading of the same renewal call."

  # ===========================================================================
  - section: endpoints
    instances:

      - name: campaign_launch_action_moves_draft_to_launched_and_bumps_version
        claim_type: action_endpoint
        grounds:
          - endpoints["POST /winback-campaigns/{id}/launch"]
          - state_machines.WinBackCampaign.transitions.DRAFT_to_LAUNCHED
          - entities.WinBackCampaign.fields.state
        distinguishing_aspect: |
          The launch endpoint carries no body at all: it flips state DRAFT -> LAUNCHED, increments
          version to 2 and leaves all three counters at 0, which is what makes the version returned
          by launch the correct OCC comparand for the first targeting call.
        test_recipe:
          setup:
            - "Clock 2026-02-07; a DRAFT campaign WB_LAUNCH with bounds [0, 120] exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-07T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /winback-campaigns"
              payload: { code: "WB_LAUNCH", name: "Launch Probe", min_days_since_lapse: 0, max_days_since_lapse: 120, offer_discount_pct: 0.2500, send_window_days: 14, suppression_days: 60 }
              as: RetentionSpecialist
              captures: { camp_id: $.data.id }
          trigger:
            - call: "POST /winback-campaigns/${camp_id}/launch"
              payload: {}
              as: RetentionSpecialist
          assert:
            - "Response status is 200"
            - "WinBackCampaign.${camp_id}.state == LAUNCHED"
            - "WinBackCampaign.${camp_id}.version == 2"
            - "WinBackCampaign.${camp_id}.targeted_count == 0"
            - "WinBackCampaign.${camp_id}.sent_count == 0"
            - "WinBackCampaign.${camp_id}.converted_count == 0"
            - "WinBackCampaign.${camp_id}.send_window_days == 14"
            - "WinBackCampaign.${camp_id}.suppression_days == 60"

      - name: new_subscription_citing_a_sent_target_converts_it_and_clears_the_lapse
        claim_type: cross_reference_link
        grounds:
          - endpoints["POST /subscriptions"].side_effects
          - state_machines.WinBackTarget.transitions.SENT_to_CONVERTED
          - entities.Subscriber.fields.won_back_at
          - entities.WinBackCampaign.fields.converted_count
        distinguishing_aspect: |
          Both ends must exist for the link: a SENT target plus a valid signup payload convert the
          target to CONVERTED, clear Subscriber.lapsed_at, set won_back_at and churn_type NONE, and
          bump the campaign's converted_count - while first_subscribed_at and cohort_month keep
          their original 2026-01 values because a win-back is not a new acquisition.
        test_recipe:
          setup:
            - "Clock 2026-01-10; plan BOUND (cadence [4], not negative option); subscriber A subscribed and then completed a cancellation session with reason PRICE."
            - "The 2026-02-07 renewal run finalised the cancellation: lifecycle CANCELLED, churn VOLUNTARY, lapsed_at 2026-02-07."
            - "A LAUNCHED campaign with bounds [0, 120] targeted A (state ELIGIBLE) and the offer was sent on 2026-02-07."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /plans"
              payload: { code: "BOUND", name: "Bounded Box", monthly_price_cents: 5000, unit_cogs_cents: 2500, margin_floor_pct: 0.4048, allowed_frequency_weeks: [4], is_negative_option: false }
              as: PlatformAdmin
              captures: { bound_plan_id: $.data.id }
            - call: "POST /subscribers"
              payload: { email: "a@dtc.test", acquisition_channel: "ORGANIC" }
              as: PlatformAdmin
              captures: { sub_a_id: $.data.id }
            - call: "POST /payment-methods"
              payload: { subscriber_id: "${sub_a_id}", card_last4: "4242", exp_month: 12, exp_year: 2030, network: "VISA" }
              as: PlatformAdmin
              captures: { pm_a_id: $.data.id }
            - call: "POST /subscriptions"
              payload: { subscriber_id: "${sub_a_id}", plan_id: "${bound_plan_id}", payment_method_id: "${pm_a_id}", frequency_weeks: 4, disclosure_acknowledged: true }
              as: PlatformAdmin
              captures: { s_old_id: $.data.id }
            - call: "POST /cancellation-sessions"
              payload: { subscription_id: "${s_old_id}", entry_channel: "WEB_SELF_SERVE" }
              as: Subscriber
              as_user_id: "${sub_a_id}"
              captures: { sess_id: $.data.id }
            - call: "POST /cancellation-sessions/${sess_id}/reason"
              payload: { reason_code: "PRICE" }
              as: Subscriber
              as_user_id: "${sub_a_id}"
            - call: "POST /cancellation-sessions/${sess_id}/complete"
              payload: { confirm: true }
              as: Subscriber
              as_user_id: "${sub_a_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-07T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /subscriptions/${s_old_id}/renewals"
              payload: {}
              as: BillingOperator
            - call: "POST /winback-campaigns"
              payload: { code: "WB_CONV", name: "Conversion Probe", min_days_since_lapse: 0, max_days_since_lapse: 120, offer_discount_pct: 0.2500 }
              as: RetentionSpecialist
              captures: { camp_id: $.data.id }
            - call: "POST /winback-campaigns/${camp_id}/launch"
              payload: {}
              as: RetentionSpecialist
              captures: { camp_v: $.data.version }
            - call: "POST /winback-campaigns/${camp_id}/targets"
              payload: { subscriber_id: "${sub_a_id}", expected_campaign_version: "${camp_v}" }
              as: RetentionSpecialist
              captures: { target_id: $.data.id }
            - call: "POST /winback-targets/${target_id}/send"
              payload: {}
              as: RetentionSpecialist
          trigger:
            - call: "POST /subscriptions"
              payload: { subscriber_id: "${sub_a_id}", plan_id: "${bound_plan_id}", payment_method_id: "${pm_a_id}", frequency_weeks: 4, disclosure_acknowledged: true, winback_target_id: "${target_id}" }
              as: PlatformAdmin
              captures: { s_new_id: $.data.id }
          assert:
            - "Response status is 201"
            - "WinBackTarget.${target_id}.state == CONVERTED"
            - "WinBackTarget.${target_id}.converted_at == 2026-02-07T00:00:00Z"
            - "WinBackTarget.${target_id}.sent_at == 2026-02-07T00:00:00Z"
            - "WinBackTarget.${target_id}.expires_at == 2026-02-21T00:00:00Z"
            - "WinBackCampaign.${camp_id}.targeted_count == 1"
            - "WinBackCampaign.${camp_id}.sent_count == 1"
            - "WinBackCampaign.${camp_id}.converted_count == 1"
            - "Subscriber.${sub_a_id}.churn_type == NONE"
            - "Subscriber.${sub_a_id}.lapsed_at == null"
            - "Subscriber.${sub_a_id}.won_back_at == 2026-02-07T00:00:00Z"
            - "Subscriber.${sub_a_id}.cohort_month == 2026-01"
            - "Subscription.${s_new_id}.lifecycle_state == ACTIVE"
            - "Subscription.${s_new_id}.committed_price_cents == 5000"

      - name: plan_active_subscription_count_is_a_computed_read
        claim_type: computed_read
        grounds:
          - entities.Plan.fields.active_subscription_count
          - endpoints["GET /plans/{id}"]
        distinguishing_aspect: |
          The counter is derived from the subscription set, not from a stored increment: after two
          signups on CORE the read reports 2, and a PENDING_CANCEL subscription still counts because
          the declared predicate includes PENDING_CANCEL.
        test_recipe:
          setup:
            - "Clock 2026-01-10; plan CORE; subscribers A and B each hold one CORE subscription; B then completed a cancellation session, leaving B PENDING_CANCEL."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /plans"
              payload: { code: "CORE", name: "Core Box", monthly_price_cents: 4999, unit_cogs_cents: 2100, margin_floor_pct: 0.4200 }
              as: PlatformAdmin
              captures: { core_plan_id: $.data.id }
            - call: "POST /subscribers"
              payload: { email: "a@dtc.test", acquisition_channel: "ORGANIC" }
              as: PlatformAdmin
              captures: { sub_a_id: $.data.id }
            - call: "POST /payment-methods"
              payload: { subscriber_id: "${sub_a_id}", card_last4: "4242", exp_month: 12, exp_year: 2030, network: "VISA" }
              as: PlatformAdmin
              captures: { pm_a_id: $.data.id }
            - call: "POST /subscriptions"
              payload: { subscriber_id: "${sub_a_id}", plan_id: "${core_plan_id}", payment_method_id: "${pm_a_id}", frequency_weeks: 4, disclosure_acknowledged: true }
              as: PlatformAdmin
              captures: { s_a_id: $.data.id }
            - call: "POST /subscribers"
              payload: { email: "b@dtc.test", acquisition_channel: "REFERRAL" }
              as: PlatformAdmin
              captures: { sub_b_id: $.data.id }
            - call: "POST /payment-methods"
              payload: { subscriber_id: "${sub_b_id}", card_last4: "4243", exp_month: 12, exp_year: 2030, network: "VISA" }
              as: PlatformAdmin
              captures: { pm_b_id: $.data.id }
            - call: "POST /subscriptions"
              payload: { subscriber_id: "${sub_b_id}", plan_id: "${core_plan_id}", payment_method_id: "${pm_b_id}", frequency_weeks: 4, disclosure_acknowledged: true }
              as: PlatformAdmin
              captures: { s_b_id: $.data.id }
            - call: "POST /cancellation-sessions"
              payload: { subscription_id: "${s_b_id}", entry_channel: "AGENT_ASSISTED" }
              as: Subscriber
              as_user_id: "${sub_b_id}"
              captures: { sess_b_id: $.data.id }
            - call: "POST /cancellation-sessions/${sess_b_id}/reason"
              payload: { reason_code: "PRODUCT_FIT" }
              as: Subscriber
              as_user_id: "${sub_b_id}"
            - call: "POST /cancellation-sessions/${sess_b_id}/complete"
              payload: { confirm: true }
              as: Subscriber
              as_user_id: "${sub_b_id}"
          trigger:
            - call: "GET /plans/${core_plan_id}"
              payload: {}
              as: RetentionSpecialist
          assert:
            - "Response status is 200"
            - "Plan.${core_plan_id}.active_subscription_count == 2"
            - "Subscription.${s_a_id}.lifecycle_state == ACTIVE"
            - "Subscription.${s_b_id}.lifecycle_state == PENDING_CANCEL"

      - name: updater_result_on_a_card_that_was_never_requested_returns_updater_not_pending
        claim_type: conditional_action
        grounds:
          - endpoints["POST /payment-methods/{id}/updater-result"]
          - validations[priority=19]
          - errors[ERR_UPDATER_NOT_PENDING]
        distinguishing_aspect: |
          Ingestion is conditional on updater_status PENDING, which only an EXPIRED_CARD decline can
          set; on a freshly attached card (updater_status NONE) the call is 409
          ERR_UPDATER_NOT_PENDING and the card keeps its original last4 and expiry.
        test_recipe:
          setup:
            - "Clock 2026-01-10; subscriber A holds one freshly attached ACTIVE VISA card with updater_status NONE."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /subscribers"
              payload: { email: "a@dtc.test", acquisition_channel: "ORGANIC" }
              as: PlatformAdmin
              captures: { sub_a_id: $.data.id }
            - call: "POST /payment-methods"
              payload: { subscriber_id: "${sub_a_id}", card_last4: "4242", exp_month: 12, exp_year: 2030, network: "VISA" }
              as: PlatformAdmin
              captures: { pm_a_id: $.data.id }
          trigger:
            - call: "POST /payment-methods/${pm_a_id}/updater-result"
              payload: { outcome: "UPDATED", new_card_last4: "9999", new_exp_month: 1, new_exp_year: 2033 }
              as: BillingOperator
              captures: { err_updater: $.data.error_id }
          assert:
            - "Response status is 409"
            - "error_id == ERR_UPDATER_NOT_PENDING"
            - "PaymentMethod.${pm_a_id}.updater_status == NONE"
            - "PaymentMethod.${pm_a_id}.updater_requested_at == null"
            - "PaymentMethod.${pm_a_id}.card_last4 == 4242"
            - "PaymentMethod.${pm_a_id}.exp_year == 2030"
            - "PaymentMethod.${pm_a_id}.status == ACTIVE"
            - "PaymentMethod.${pm_a_id}.version == 1"

      - name: patch_subscriber_updates_the_contact_preference_only
        claim_type: standard_crud
        grounds:
          - endpoints["PATCH /subscribers/{id}"]
          - entities.Subscriber.fields.do_not_contact
        distinguishing_aspect: |
          The only mutable subscriber field is do_not_contact: the PATCH returns 200 with the flag
          true and version 2, while email, acquisition_channel and every computed field are
          untouched.
        test_recipe:
          setup:
            - "Clock 2026-01-10; subscriber A registered on ORGANIC with do_not_contact defaulting to false."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /subscribers"
              payload: { email: "a@dtc.test", acquisition_channel: "ORGANIC" }
              as: PlatformAdmin
              captures: { sub_a_id: $.data.id }
          trigger:
            - call: "PATCH /subscribers/${sub_a_id}"
              payload: { do_not_contact: true }
              as: PlatformAdmin
          assert:
            - "Response status is 200"
            - "Subscriber.${sub_a_id}.do_not_contact == true"
            - "Subscriber.${sub_a_id}.email == a@dtc.test"
            - "Subscriber.${sub_a_id}.acquisition_channel == ORGANIC"
            - "Subscriber.${sub_a_id}.first_subscribed_at == null"
            - "Subscriber.${sub_a_id}.tenure_days == 0"
            - "Subscriber.${sub_a_id}.churn_type == NONE"
            - "Subscriber.${sub_a_id}.version == 2"

  # ===========================================================================
  - section: errors
    instances:

      - name: unknown_path_ids_return_the_typed_not_found_error_of_each_family
        claim_type: not_found
        grounds:
          - errors[ERR_PAYMENT_METHOD_NOT_FOUND]
          - errors[ERR_INVOICE_NOT_FOUND]
          - errors[ERR_DUNNING_ATTEMPT_NOT_FOUND]
          - errors[ERR_CANCELLATION_SESSION_NOT_FOUND]
          - errors[ERR_SAVE_OFFER_GRANT_NOT_FOUND]
          - errors[ERR_SAVE_OFFER_TEMPLATE_NOT_FOUND]
          - errors[ERR_MODIFICATION_NOT_FOUND]
          - errors[ERR_COMPLIANCE_NOTICE_NOT_FOUND]
          - errors[ERR_WINBACK_CAMPAIGN_NOT_FOUND]
          - errors[ERR_WINBACK_TARGET_NOT_FOUND]
          - errors[ERR_COHORT_SNAPSHOT_NOT_FOUND]
          - validations[priority=3]
        distinguishing_aspect: |
          Each path family owns a distinct 404 id: a syntactically valid but unknown UUID against
          eleven different resource families must return eleven different error_id values, never a
          shared generic ERR_NOT_FOUND and never a 500.
        test_recipe:
          setup:
            - "Empty database with the clock pinned to 2026-01-10; every id used below is a well-formed UUID that was never minted."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-10T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /payment-methods/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: BillingOperator
              captures: { e_pm: $.data.error_id }
            - call: "GET /invoices/00000000-0000-4000-8000-000000000002"
              payload: {}
              as: BillingOperator
              captures: { e_inv: $.data.error_id }
            - call: "GET /dunning-attempts/00000000-0000-4000-8000-000000000003"
              payload: {}
              as: BillingOperator
              captures: { e_att: $.data.error_id }
            - call: "GET /cancellation-sessions/00000000-0000-4000-8000-000000000004"
              payload: {}
              as: RetentionSpecialist
              captures: { e_sess: $.data.error_id }
            - call: "GET /save-offer-grants/00000000-0000-4000-8000-000000000005"
              payload: {}
              as: RetentionSpecialist
              captures: { e_grant: $.data.error_id }
            - call: "GET /save-offer-templates/00000000-0000-4000-8000-000000000006"
              payload: {}
              as: PlatformAdmin
              captures: { e_tmpl: $.data.error_id }
            - call: "GET /subscription-modifications/00000000-0000-4000-8000-000000000007"
              payload: {}
              as: RetentionSpecialist
              captures: { e_mod: $.data.error_id }
            - call: "POST /compliance-notices/00000000-0000-4000-8000-000000000008/send"
              payload: {}
              as: BillingOperator
              captures: { e_notice: $.data.error_id }
            - call: "GET /winback-campaigns/00000000-0000-4000-8000-000000000009"
              payload: {}
              as: RetentionSpecialist
              captures: { e_camp: $.data.error_id }
            - call: "GET /winback-targets/00000000-0000-4000-8000-00000000000a"
              payload: {}
              as: RetentionSpecialist
              captures: { e_target: $.data.error_id }
            - call: "GET /retention-cohort-snapshots/00000000-0000-4000-8000-00000000000b"
              payload: {}
              as: RetentionSpecialist
              captures: { e_snap: $.data.error_id }
          assert:
            - "Every one of the eleven responses has status 404 and data.error_id set"
            - "${e_pm} == ERR_PAYMENT_METHOD_NOT_FOUND"
            - "${e_inv} == ERR_INVOICE_NOT_FOUND"
            - "${e_att} == ERR_DUNNING_ATTEMPT_NOT_FOUND"
            - "${e_sess} == ERR_CANCELLATION_SESSION_NOT_FOUND"
            - "${e_grant} == ERR_SAVE_OFFER_GRANT_NOT_FOUND"
            - "${e_tmpl} == ERR_SAVE_OFFER_TEMPLATE_NOT_FOUND"
            - "${e_mod} == ERR_MODIFICATION_NOT_FOUND"
            - "${e_notice} == ERR_COMPLIANCE_NOTICE_NOT_FOUND"
            - "${e_camp} == ERR_WINBACK_CAMPAIGN_NOT_FOUND"
            - "${e_target} == ERR_WINBACK_TARGET_NOT_FOUND"
            - "${e_snap} == ERR_COHORT_SNAPSHOT_NOT_FOUND"

      - name: missing_x_user_id_header_or_unknown_role_returns_unauthenticated
        claim_type: violation_to_error
        grounds:
          - errors[ERR_UNAUTHENTICATED]
          - validations[priority=1]
          - response_envelope
        distinguishing_aspect: |
          Priority 1 is about identification, not permission: a read with no X-User-ID header and a
          read carrying the undeclared role RetentionManager both return 401
          ERR_UNAUTHENTICATED - never 403, even though GET /plans is open to all five declared
          roles.
        test_recipe:
          setup:
            - "Clock 2026-01-10; one ACTIVE plan exists so the endpoint would otherwise return data."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /plans"
              payload: { code: "CORE", name: "Core Box", monthly_price_cents: 4999, unit_cogs_cents: 2100, margin_floor_pct: 0.4200 }
              as: PlatformAdmin
              captures: { core_plan_id: $.data.id }
          trigger:
            - call: "GET /plans/${core_plan_id}"
              payload: {}
              as: NONE
              captures: { e_noheader: $.data.error_id }
            - call: "GET /plans/${core_plan_id}"
              payload: {}
              as: RetentionManager
              as_user_id: "rm_1"
              captures: { e_badrole: $.data.error_id }
          assert:
            - "First call omits both auth headers entirely: status is 401"
            - "${e_noheader} == ERR_UNAUTHENTICATED"
            - "Second call sends X-User-Role RetentionManager, which is not one of the five declared roles: status is 401"
            - "${e_badrole} == ERR_UNAUTHENTICATED"
            - "Both bodies carry data.error_id and data.message and no plan payload"

      - name: subscribing_to_a_retired_plan_is_rejected
        claim_type: violation_to_error
        grounds:
          - errors[ERR_PLAN_RETIRED]
          - validations[priority=10]
          - entities.Plan.fields.status
        distinguishing_aspect: |
          A RETIRED plan is readable and keeps its counters but cannot take new subscriptions: the
          signup returns 422 ERR_PLAN_RETIRED, active_subscription_count stays 0 and no invoice is
          minted.
        test_recipe:
          setup:
            - "Clock 2026-01-10; plan OLDBOX created directly with status RETIRED; subscriber A with an ACTIVE card."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /plans"
              payload: { code: "OLDBOX", name: "Retired Box", monthly_price_cents: 4000, unit_cogs_cents: 2000, margin_floor_pct: 0.4000, status: "RETIRED" }
              as: PlatformAdmin
              captures: { old_plan_id: $.data.id }
            - call: "POST /subscribers"
              payload: { email: "a@dtc.test", acquisition_channel: "ORGANIC" }
              as: PlatformAdmin
              captures: { sub_a_id: $.data.id }
            - call: "POST /payment-methods"
              payload: { subscriber_id: "${sub_a_id}", card_last4: "4242", exp_month: 12, exp_year: 2030, network: "VISA" }
              as: PlatformAdmin
              captures: { pm_a_id: $.data.id }
          trigger:
            - call: "POST /subscriptions"
              payload: { subscriber_id: "${sub_a_id}", plan_id: "${old_plan_id}", payment_method_id: "${pm_a_id}", frequency_weeks: 4, disclosure_acknowledged: true }
              as: PlatformAdmin
              captures: { e_retired: $.data.error_id }
          assert:
            - "Response status is 422"
            - "${e_retired} == ERR_PLAN_RETIRED"
            - "Plan.${old_plan_id}.status == RETIRED"
            - "Plan.${old_plan_id}.active_subscription_count == 0"
            - "GET /invoices returns meta.total_count == 0"
            - "Subscriber.${sub_a_id}.first_subscribed_at == null"

      - name: modifying_a_pending_cancel_subscription_is_rejected
        claim_type: violation_to_error
        grounds:
          - errors[ERR_SUBSCRIPTION_NOT_MODIFIABLE]
          - validations[priority=11]
          - state_machines.Subscription.lifecycle_axis
        distinguishing_aspect: |
          PENDING_CANCEL is outside the modifiable set {ACTIVE, PAUSED}: even with the correct
          expected_subscription_version (so the 412 rule cannot mask it) the FREQUENCY_CHANGE is 409
          ERR_SUBSCRIPTION_NOT_MODIFIABLE and frequency_weeks stays 4.
        test_recipe:
          setup:
            - "Clock 2026-01-10; CORE subscription for subscriber A; the subscriber completed a cancellation session, so lifecycle is PENDING_CANCEL and version is 2."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /plans"
              payload: { code: "CORE", name: "Core Box", monthly_price_cents: 4999, unit_cogs_cents: 2100, margin_floor_pct: 0.4200 }
              as: PlatformAdmin
              captures: { core_plan_id: $.data.id }
            - call: "POST /subscribers"
              payload: { email: "a@dtc.test", acquisition_channel: "ORGANIC" }
              as: PlatformAdmin
              captures: { sub_a_id: $.data.id }
            - call: "POST /payment-methods"
              payload: { subscriber_id: "${sub_a_id}", card_last4: "4242", exp_month: 12, exp_year: 2030, network: "VISA" }
              as: PlatformAdmin
              captures: { pm_a_id: $.data.id }
            - call: "POST /subscriptions"
              payload: { subscriber_id: "${sub_a_id}", plan_id: "${core_plan_id}", payment_method_id: "${pm_a_id}", frequency_weeks: 4, disclosure_acknowledged: true }
              as: PlatformAdmin
              captures: { s_a_id: $.data.id }
            - call: "POST /cancellation-sessions"
              payload: { subscription_id: "${s_a_id}", entry_channel: "WEB_SELF_SERVE" }
              as: Subscriber
              as_user_id: "${sub_a_id}"
              captures: { sess_id: $.data.id }
            - call: "POST /cancellation-sessions/${sess_id}/reason"
              payload: { reason_code: "OTHER" }
              as: Subscriber
              as_user_id: "${sub_a_id}"
            - call: "POST /cancellation-sessions/${sess_id}/complete"
              payload: { confirm: true }
              as: Subscriber
              as_user_id: "${sub_a_id}"
            - call: "GET /subscriptions/${s_a_id}"
              payload: {}
              as: RetentionSpecialist
              captures: { v_now: $.data.version }
          trigger:
            - call: "POST /subscriptions/${s_a_id}/modifications"
              payload: { mod_type: "FREQUENCY_CHANGE", expected_subscription_version: "${v_now}", frequency_weeks: 8 }
              as: Subscriber
              as_user_id: "${sub_a_id}"
              captures: { e_notmod: $.data.error_id }
          assert:
            - "Response status is 409"
            - "${e_notmod} == ERR_SUBSCRIPTION_NOT_MODIFIABLE"
            - "Subscription.${s_a_id}.lifecycle_state == PENDING_CANCEL"
            - "Subscription.${s_a_id}.frequency_weeks == 4"
            - "Subscription.${s_a_id}.version == 2"
            - "GET /subscription-modifications?subscription_id=${s_a_id} returns meta.total_count == 0"

      - name: second_open_cancellation_session_on_one_subscription_is_rejected
        claim_type: violation_to_error
        grounds:
          - errors[ERR_SESSION_ALREADY_OPEN]
          - validations[priority=12]
        distinguishing_aspect: |
          Uniqueness is scoped to the non-terminal states: with one session sitting in
          REASON_CAPTURED a second POST /cancellation-sessions on the same subscription is 409
          ERR_SESSION_ALREADY_OPEN, and the existing session keeps step_count 2.
        test_recipe:
          setup:
            - "Clock 2026-01-10; CORE subscription for subscriber A; one session already captured reason PRICE."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /plans"
              payload: { code: "CORE", name: "Core Box", monthly_price_cents: 4999, unit_cogs_cents: 2100, margin_floor_pct: 0.4200 }
              as: PlatformAdmin
              captures: { core_plan_id: $.data.id }
            - call: "POST /subscribers"
              payload: { email: "a@dtc.test", acquisition_channel: "ORGANIC" }
              as: PlatformAdmin
              captures: { sub_a_id: $.data.id }
            - call: "POST /payment-methods"
              payload: { subscriber_id: "${sub_a_id}", card_last4: "4242", exp_month: 12, exp_year: 2030, network: "VISA" }
              as: PlatformAdmin
              captures: { pm_a_id: $.data.id }
            - call: "POST /subscriptions"
              payload: { subscriber_id: "${sub_a_id}", plan_id: "${core_plan_id}", payment_method_id: "${pm_a_id}", frequency_weeks: 4, disclosure_acknowledged: true }
              as: PlatformAdmin
              captures: { s_a_id: $.data.id }
            - call: "POST /cancellation-sessions"
              payload: { subscription_id: "${s_a_id}", entry_channel: "WEB_SELF_SERVE" }
              as: Subscriber
              as_user_id: "${sub_a_id}"
              captures: { sess_id: $.data.id }
            - call: "POST /cancellation-sessions/${sess_id}/reason"
              payload: { reason_code: "PRICE" }
              as: Subscriber
              as_user_id: "${sub_a_id}"
          trigger:
            - call: "POST /cancellation-sessions"
              payload: { subscription_id: "${s_a_id}", entry_channel: "AGENT_ASSISTED" }
              as: Subscriber
              as_user_id: "${sub_a_id}"
              captures: { e_open: $.data.error_id }
          assert:
            - "Response status is 409"
            - "${e_open} == ERR_SESSION_ALREADY_OPEN"
            - "GET /cancellation-sessions?subscription_id=${s_a_id} returns meta.total_count == 1"
            - "CancellationSession.${sess_id}.state == REASON_CAPTURED"
            - "CancellationSession.${sess_id}.step_count == 2"

      - name: retrying_a_paid_invoice_is_rejected_as_not_payable
        claim_type: violation_to_error
        grounds:
          - errors[ERR_INVOICE_NOT_PAYABLE]
          - validations[priority=17]
          - entities.Invoice.fields.status
        distinguishing_aspect: |
          The payable set is {OPEN, FAILED}: once the invoice is PAID a further dunning attempt is
          409 ERR_INVOICE_NOT_PAYABLE and attempt_count stays 1, so a settled invoice can never
          accumulate retries.
        test_recipe:
          setup:
            - "Clock 2026-01-10; CORE subscription for subscriber A; attempt 1 was created and settled SUCCEEDED, so the invoice is PAID."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /plans"
              payload: { code: "CORE", name: "Core Box", monthly_price_cents: 4999, unit_cogs_cents: 2100, margin_floor_pct: 0.4200 }
              as: PlatformAdmin
              captures: { core_plan_id: $.data.id }
            - call: "POST /subscribers"
              payload: { email: "a@dtc.test", acquisition_channel: "ORGANIC" }
              as: PlatformAdmin
              captures: { sub_a_id: $.data.id }
            - call: "POST /payment-methods"
              payload: { subscriber_id: "${sub_a_id}", card_last4: "4242", exp_month: 12, exp_year: 2030, network: "VISA" }
              as: PlatformAdmin
              captures: { pm_a_id: $.data.id }
            - call: "POST /subscriptions"
              payload: { subscriber_id: "${sub_a_id}", plan_id: "${core_plan_id}", payment_method_id: "${pm_a_id}", frequency_weeks: 4, disclosure_acknowledged: true }
              as: PlatformAdmin
              captures: { s_a_id: $.data.id }
            - call: "GET /invoices"
              payload: { subscription_id: "${s_a_id}" }
              as: BillingOperator
              captures: { inv0_id: "$.data[0].id" }
            - call: "POST /invoices/${inv0_id}/dunning-attempts"
              payload: {}
              as: BillingOperator
            - call: "POST /_payments/simulate"
              payload: { invoice_id: "${inv0_id}", outcome: "SUCCEEDED" }
              as: BillingOperator
          trigger:
            - call: "POST /invoices/${inv0_id}/dunning-attempts"
              payload: {}
              as: BillingOperator
              captures: { e_payable: $.data.error_id }
          assert:
            - "Response status is 409"
            - "${e_payable} == ERR_INVOICE_NOT_PAYABLE"
            - "Invoice.${inv0_id}.status == PAID"
            - "Invoice.${inv0_id}.attempt_count == 1"
            - "Subscription.${s_a_id}.billing_state == CURRENT"
            - "Subscription.${s_a_id}.consecutive_failed_attempts == 0"

      - name: settling_an_invoice_with_no_pending_attempt_is_rejected
        claim_type: violation_to_error
        grounds:
          - errors[ERR_NO_PENDING_ATTEMPT]
          - validations[priority=18]
          - endpoints["POST /_payments/simulate"]
        distinguishing_aspect: |
          A gateway result needs an attempt to attach to: with the signup invoice OPEN but no
          DunningAttempt created yet, the simulate call is 409 ERR_NO_PENDING_ATTEMPT rather than
          silently marking the invoice PAID.
        test_recipe:
          setup:
            - "Clock 2026-01-10; CORE subscription for subscriber A; the signup invoice is OPEN and no dunning attempt exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /plans"
              payload: { code: "CORE", name: "Core Box", monthly_price_cents: 4999, unit_cogs_cents: 2100, margin_floor_pct: 0.4200 }
              as: PlatformAdmin
              captures: { core_plan_id: $.data.id }
            - call: "POST /subscribers"
              payload: { email: "a@dtc.test", acquisition_channel: "ORGANIC" }
              as: PlatformAdmin
              captures: { sub_a_id: $.data.id }
            - call: "POST /payment-methods"
              payload: { subscriber_id: "${sub_a_id}", card_last4: "4242", exp_month: 12, exp_year: 2030, network: "VISA" }
              as: PlatformAdmin
              captures: { pm_a_id: $.data.id }
            - call: "POST /subscriptions"
              payload: { subscriber_id: "${sub_a_id}", plan_id: "${core_plan_id}", payment_method_id: "${pm_a_id}", frequency_weeks: 4, disclosure_acknowledged: true }
              as: PlatformAdmin
              captures: { s_a_id: $.data.id }
            - call: "GET /invoices"
              payload: { subscription_id: "${s_a_id}" }
              as: BillingOperator
              captures: { inv0_id: "$.data[0].id" }
          trigger:
            - call: "POST /_payments/simulate"
              payload: { invoice_id: "${inv0_id}", outcome: "SUCCEEDED" }
              as: BillingOperator
              captures: { e_nopend: $.data.error_id }
          assert:
            - "Response status is 409"
            - "${e_nopend} == ERR_NO_PENDING_ATTEMPT"
            - "Invoice.${inv0_id}.status == OPEN"
            - "Invoice.${inv0_id}.attempt_count == 0"
            - "GET /dunning-attempts?invoice_id=${inv0_id} returns meta.total_count == 0"
            - "Subscriber.${sub_a_id}.realized_ltv_cents == 0"

      - name: targeting_a_draft_campaign_is_rejected
        claim_type: violation_to_error
        grounds:
          - errors[ERR_CAMPAIGN_NOT_LAUNCHED]
          - validations[priority=20]
          - state_machines.WinBackCampaign.initial_state
        distinguishing_aspect: |
          Targeting is gated on LAUNCHED, and the OCC comparand is correct (version 1), so the
          result is 409 ERR_CAMPAIGN_NOT_LAUNCHED - not 412 - and the campaign's version and
          targeted_count are both untouched.
        test_recipe:
          setup:
            - "Clock 2026-02-07; a DRAFT campaign with bounds [0, 120] exists and one subscriber is registered."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-07T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /subscribers"
              payload: { email: "a@dtc.test", acquisition_channel: "ORGANIC" }
              as: PlatformAdmin
              captures: { sub_a_id: $.data.id }
            - call: "POST /winback-campaigns"
              payload: { code: "WB_DRAFT", name: "Draft Probe", min_days_since_lapse: 0, max_days_since_lapse: 120, offer_discount_pct: 0.2000 }
              as: RetentionSpecialist
              captures: { camp_id: $.data.id, camp_v1: $.data.version }
          trigger:
            - call: "POST /winback-campaigns/${camp_id}/targets"
              payload: { subscriber_id: "${sub_a_id}", expected_campaign_version: "${camp_v1}" }
              as: RetentionSpecialist
              captures: { e_draft: $.data.error_id }
          assert:
            - "Response status is 409"
            - "${e_draft} == ERR_CAMPAIGN_NOT_LAUNCHED"
            - "WinBackCampaign.${camp_id}.state == DRAFT"
            - "WinBackCampaign.${camp_id}.version == 1"
            - "WinBackCampaign.${camp_id}.targeted_count == 0"
            - "GET /winback-targets?winback_campaign_id=${camp_id} returns meta.total_count == 0"

      - name: reversing_an_already_reversed_modification_is_rejected
        claim_type: violation_to_error
        grounds:
          - errors[ERR_MODIFICATION_NOT_REVERSIBLE]
          - validations[priority=23]
          - state_machines.SubscriptionModification.terminal_states
        distinguishing_aspect: |
          REVERSED is terminal, so the second reverse of the same source row is 409
          ERR_MODIFICATION_NOT_REVERSIBLE and no third row is written - the ledger keeps exactly two
          rows and frequency_weeks stays at the restored value 4.
        test_recipe:
          setup:
            - "Clock 2026-01-10; CORE subscription for subscriber A; an APPLIED FREQUENCY_CHANGE to 8 was reversed once, restoring 4."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /plans"
              payload: { code: "CORE", name: "Core Box", monthly_price_cents: 4999, unit_cogs_cents: 2100, margin_floor_pct: 0.4200 }
              as: PlatformAdmin
              captures: { core_plan_id: $.data.id }
            - call: "POST /subscribers"
              payload: { email: "a@dtc.test", acquisition_channel: "ORGANIC" }
              as: PlatformAdmin
              captures: { sub_a_id: $.data.id }
            - call: "POST /payment-methods"
              payload: { subscriber_id: "${sub_a_id}", card_last4: "4242", exp_month: 12, exp_year: 2030, network: "VISA" }
              as: PlatformAdmin
              captures: { pm_a_id: $.data.id }
            - call: "POST /subscriptions"
              payload: { subscriber_id: "${sub_a_id}", plan_id: "${core_plan_id}", payment_method_id: "${pm_a_id}", frequency_weeks: 4, disclosure_acknowledged: true }
              as: PlatformAdmin
              captures: { s_a_id: $.data.id, v1: $.data.version }
            - call: "POST /subscriptions/${s_a_id}/modifications"
              payload: { mod_type: "FREQUENCY_CHANGE", expected_subscription_version: "${v1}", frequency_weeks: 8 }
              as: Subscriber
              as_user_id: "${sub_a_id}"
              captures: { mod_id: $.data.id }
            - call: "POST /subscription-modifications/${mod_id}/reverse"
              payload: { reason_note: "agent error" }
              as: RetentionSpecialist
              captures: { comp_id: $.data.id }
          trigger:
            - call: "POST /subscription-modifications/${mod_id}/reverse"
              payload: { reason_note: "double undo" }
              as: RetentionSpecialist
              captures: { e_rev: $.data.error_id }
          assert:
            - "Response status is 409"
            - "${e_rev} == ERR_MODIFICATION_NOT_REVERSIBLE"
            - "SubscriptionModification.${mod_id}.state == REVERSED"
            - "SubscriptionModification.${comp_id}.reverses_modification_id == ${mod_id}"
            - "GET /subscription-modifications?subscription_id=${s_a_id} returns meta.total_count == 2"
            - "Subscription.${s_a_id}.frequency_weeks == 4"
            - "Subscription.${s_a_id}.version == 3"

      - name: scheduling_a_reminder_outside_the_statutory_window_is_rejected
        claim_type: violation_to_error
        grounds:
          - errors[ERR_NOTICE_WINDOW_INVALID]
          - validations[priority=28]
          - global_constants.MIN_REMINDER_LEAD_DAYS
        distinguishing_aspect: |
          The legal window for the 2026-02-07 renewal is [2026-01-28, 2026-02-04]; a
          RENEWAL_REMINDER scheduled for 2026-02-06 is only one day of lead time and is 422
          ERR_NOTICE_WINDOW_INVALID, leaving the auto-scheduled notice as the only row.
        test_recipe:
          setup:
            - "Clock 2026-01-10; CORE (negative option, 10-day reminder lead) subscription for subscriber A; next_renewal_at is 2026-02-07."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /plans"
              payload: { code: "CORE", name: "Core Box", monthly_price_cents: 4999, unit_cogs_cents: 2100, margin_floor_pct: 0.4200, renewal_reminder_days_before: 10 }
              as: PlatformAdmin
              captures: { core_plan_id: $.data.id }
            - call: "POST /subscribers"
              payload: { email: "a@dtc.test", acquisition_channel: "ORGANIC" }
              as: PlatformAdmin
              captures: { sub_a_id: $.data.id }
            - call: "POST /payment-methods"
              payload: { subscriber_id: "${sub_a_id}", card_last4: "4242", exp_month: 12, exp_year: 2030, network: "VISA" }
              as: PlatformAdmin
              captures: { pm_a_id: $.data.id }
            - call: "POST /subscriptions"
              payload: { subscriber_id: "${sub_a_id}", plan_id: "${core_plan_id}", payment_method_id: "${pm_a_id}", frequency_weeks: 4, disclosure_acknowledged: true }
              as: PlatformAdmin
              captures: { s_a_id: $.data.id }
          trigger:
            - call: "POST /subscriptions/${s_a_id}/compliance-notices"
              payload: { notice_type: "RENEWAL_REMINDER", scheduled_for: "2026-02-06T00:00:00Z", channel: "EMAIL" }
              as: ComplianceOfficer
              captures: { e_window: $.data.error_id }
          assert:
            - "Response status is 422"
            - "${e_window} == ERR_NOTICE_WINDOW_INVALID"
            - "GET /subscriptions/${s_a_id}/compliance-notices?notice_type=RENEWAL_REMINDER returns meta.total_count == 1"
            - "The surviving reminder has scheduled_for == 2026-01-28T00:00:00Z and state == SCHEDULED"
            - "Subscription.${s_a_id}.next_renewal_at == 2026-02-07T00:00:00Z"

      - name: retrying_after_the_grace_window_closes_is_rejected
        claim_type: violation_to_error
        grounds:
          - errors[ERR_GRACE_PERIOD_ENDED]
          - validations[priority=31]
          - calculations.dunning_retry_schedule
        distinguishing_aspect: |
          One day past the close of a 3-day M0_1 grace window (first_failed_at 2026-01-10,
          grace_end_at 2026-01-13, clock 2026-01-14) attempt 2 is refused with 409
          ERR_GRACE_PERIOD_ENDED, so attempt_count stays 1 even though the invoice is still FAILED
          and MAX_RETRY_ATTEMPTS is nowhere near exhausted.
        test_recipe:
          setup:
            - "Clock 2026-01-10; CORE subscription for subscriber A; attempt 1 soft-declined with INSUFFICIENT_FUNDS, so grace_end_at is 2026-01-13."
            - "Clock advanced to 2026-01-14."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /plans"
              payload: { code: "CORE", name: "Core Box", monthly_price_cents: 4999, unit_cogs_cents: 2100, margin_floor_pct: 0.4200 }
              as: PlatformAdmin
              captures: { core_plan_id: $.data.id }
            - call: "POST /subscribers"
              payload: { email: "a@dtc.test", acquisition_channel: "ORGANIC" }
              as: PlatformAdmin
              captures: { sub_a_id: $.data.id }
            - call: "POST /payment-methods"
              payload: { subscriber_id: "${sub_a_id}", card_last4: "4242", exp_month: 12, exp_year: 2030, network: "VISA" }
              as: PlatformAdmin
              captures: { pm_a_id: $.data.id }
            - call: "POST /subscriptions"
              payload: { subscriber_id: "${sub_a_id}", plan_id: "${core_plan_id}", payment_method_id: "${pm_a_id}", frequency_weeks: 4, disclosure_acknowledged: true }
              as: PlatformAdmin
              captures: { s_a_id: $.data.id }
            - call: "GET /invoices"
              payload: { subscription_id: "${s_a_id}" }
              as: BillingOperator
              captures: { inv0_id: "$.data[0].id" }
            - call: "POST /invoices/${inv0_id}/dunning-attempts"
              payload: {}
              as: BillingOperator
            - call: "POST /_payments/simulate"
              payload: { invoice_id: "${inv0_id}", outcome: "SOFT_DECLINE", decline_code: "INSUFFICIENT_FUNDS" }
              as: BillingOperator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-14T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /invoices/${inv0_id}/dunning-attempts"
              payload: {}
              as: BillingOperator
              captures: { e_grace: $.data.error_id }
          assert:
            - "Response status is 409"
            - "${e_grace} == ERR_GRACE_PERIOD_ENDED"
            - "Invoice.${inv0_id}.status == FAILED"
            - "Invoice.${inv0_id}.attempt_count == 1"
            - "Subscription.${s_a_id}.grace_end_at == 2026-01-13T00:00:00Z"
            - "Subscription.${s_a_id}.billing_state == PAST_DUE"
            - "Subscription.${s_a_id}.consecutive_failed_attempts == 1"

      - name: signup_at_a_cadence_outside_the_plan_list_is_rejected
        claim_type: violation_to_error
        grounds:
          - errors[ERR_FREQUENCY_NOT_ALLOWED]
          - validations[priority=33]
        distinguishing_aspect: |
          CORE allows [2, 4, 8]; a 3-week cadence is 422 ERR_FREQUENCY_NOT_ALLOWED at signup with
