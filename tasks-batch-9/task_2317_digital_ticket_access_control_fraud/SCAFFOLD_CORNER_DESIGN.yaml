      - name: ticket_creation_with_a_zone_from_another_event_is_rejected
        claim_type: foreign_key_integrity
        grounds:
          - validations[priority=6]
          - validations[priority=5]
          - errors.ERR_CROSS_EVENT_REFERENCE
          - errors.ERR_PATRON_NOT_FOUND
          - complexity_profile.entity_topology
        distinguishing_aspect: |
          entity_topology is flat, so every body FK is checked in two distinct ways:
          an unresolvable holder_patron_id is ERR_PATRON_NOT_FOUND (404) at priority 5,
          while a perfectly resolvable AccessZone that belongs to a DIFFERENT Event is
          ERR_CROSS_EVENT_REFERENCE (422) at priority 6. Existence and ownership are not
          the same check.
        test_recipe:
          setup:
            - "Two Events: EV1 ON_SALE with AccessZone Z1, EV2 ON_SALE with AccessZone Z2."
            - "Ada verified."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
