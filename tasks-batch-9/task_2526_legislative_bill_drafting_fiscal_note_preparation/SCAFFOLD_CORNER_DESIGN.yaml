      - name: each_role_can_reach_every_read_its_own_workflow_depends_on
        claim_type: RBAC
        grounds:
          - roles
        distinguishing_aspect: "The positive half of the RBAC matrix — every role successfully exercising the reads its own lane needs, rather than being refused another lane's."
        excluded_because:
          difficulty_instance: fiscal_note_cycles_submitted_returned_submitted_certified_then_reopened_to_routed
          rationale: "That §1.8 instance drives the full note cycle through the analyst, the fiscal officer and the clerk, and every step of it re-reads the note, its cost-estimate sub-resource, the bill and the session as the role that owns that step; a separate positive-read sweep would restate the same 200s with a weaker fixture."

  # ===========================================================================
  # CROSS-CUTTING COMPLEXITY LAYERS — the four declared layers are
  # optimistic_concurrency (three §1.2.1 rules, one instance each),
  # cascading_side_effects, dual_variant_calculation and
  # derived_field_reconciliation. Every §1.2.1 rule gets its own stale-version
  # instance using that rule's declared write_endpoint and occ_field; the two
  # layers whose depth is already the subject of a §1.8 instance are stubbed
  # against it rather than restated.
  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: stale_expected_bill_version_blocks_a_second_amendment_until_the_requester_re_reads_the_bill
        claim_type: Cross-Cutting — optimistic_concurrency
        grounds:
          - concurrency_rules.amendment-create-stale-bill
          - validations[priority 80].ERR_STALE_BILL_VERSION
        distinguishing_aspect: "§1.2.1 rule amendment-create-stale-bill, exercised on its declared write_endpoint POST /amendments through its declared occ_field expected_bill_version. Several amendments per bill are legitimate, so the only difference between the 201 and the 412 is the integer in the payload — and the first successful creation is itself what invalidates it, because creating an amendment increments Bill.version."
        test_recipe:
          setup:
            - "Bill b1 is REFERRED with referral cr1 IN_COMMITTEE, so COMMITTEE-stage amendments are admissible; the bill version observed right after the referral is captured as b1v1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /sessions"
              payload: { name: "2027 Regular Session", introduction_deadline_utc: "2026-10-15T00:00:00Z", committee_report_deadline_utc: "2026-11-01T00:00:00Z", sine_die_utc: "2026-11-20T18:00:00Z", constrained_threshold_cents: 50000000, fiscal_cap_cents: 200000000, required_fiscal_years: [2027, 2028], fiscal_note_default_days: 21 }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /sessions/${s_id}/convene"
              payload: {}
              as: Clerk
            - call: "POST /sessions/${s_id}/committees"
              payload: { chamber: "HOUSE", name: "House Appropriations", is_fiscal_committee: true, max_concurrent_referrals: 2 }
              as: Clerk
              captures: { cH_id: $.data.id }
            - call: "POST /members"
              payload: { full_name: "Rep Sponsor", chamber: "HOUSE", party: "IND", priority_slots_total: 2 }
              as: PlatformAdmin
              captures: { m1_id: $.data.id }
            - call: "POST /drafters"
              payload: { full_name: "Drafter One", is_senior: false, max_concurrent_engagements: 2 }
              as: PlatformAdmin
              captures: { d1_id: $.data.id }
            - call: "POST /drafters"
              payload: { full_name: "Counsel Senior", is_senior: true, max_concurrent_engagements: 2 }
              as: PlatformAdmin
              captures: { rc_id: $.data.id }
            - call: "POST /drafting-requests"
              payload: { session_id: "${s_id}", subject: "OCC probe on the bill", summary: "Two amendments, one stale view.", requested_sections_count: 1, target_code_chapter: "Title 4", confidentiality: "PUBLIC", priority_flag: false, appropriation_requested_cents: 0 }
              as: Member
              as_user_id: "${m1_id}"
              captures: { dr1_id: $.data.id }
            - call: "POST /drafting-requests/${dr1_id}/assign"
              payload: { drafter_id: "${d1_id}", engagement_start_utc: "2026-09-01T06:00:00Z", engagement_end_utc: "2026-09-01T12:00:00Z" }
              as: ReviewCounsel
              as_user_id: "${rc_id}"
            - call: "POST /drafting-requests/${dr1_id}/complete-research"
              payload: { affected_sections_count: 1 }
              as: Drafter
              as_user_id: "${d1_id}"
            - call: "POST /drafting-requests/${dr1_id}/certify-draft"
              payload: { style_findings_count: 0 }
              as: ReviewCounsel
              as_user_id: "${rc_id}"
            - call: "POST /bills"
              payload: { drafting_request_id: "${dr1_id}" }
              as: Clerk
              captures: { b1_id: $.data.id }
            - call: "POST /bills/${b1_id}/referrals"
              payload: { committee_id: "${cH_id}", hearing_window_start_utc: "2026-10-05T14:00:00Z", hearing_window_end_utc: "2026-10-05T16:00:00Z" }
              as: Clerk
              captures: { cr1_id: $.data.id }
            - call: "GET /bills/${b1_id}"
              payload: {}
              as: Member
              as_user_id: "${m1_id}"
              captures: { b1v1: $.data.version }
          trigger:
            - call: "POST /amendments"
              payload: { expected_bill_version: "${b1v1}", bill_id: "${b1_id}", stage: "COMMITTEE", summary: "First amendment, filed against a fresh view.", fiscal_impact_delta_cents: 0, drafting_start_utc: "2026-09-01T13:00:00Z", drafting_due_utc: "2026-09-01T15:00:00Z", committee_referral_id: "${cr1_id}" }
              as: Member
              as_user_id: "${m1_id}"
              captures: { am1_id: $.data.id }
            - call: "POST /amendments"
              payload: { expected_bill_version: "${b1v1}", bill_id: "${b1_id}", stage: "COMMITTEE", summary: "Second amendment, filed against the SAME stale view.", fiscal_impact_delta_cents: 0, drafting_start_utc: "2026-09-01T16:00:00Z", drafting_due_utc: "2026-09-01T18:00:00Z", committee_referral_id: "${cr1_id}" }
              as: Member
              as_user_id: "${m1_id}"
            - call: "GET /bills/${b1_id}"
              payload: {}
              as: Member
              as_user_id: "${m1_id}"
              captures: { b1v2: $.data.version }
            - call: "POST /amendments"
              payload: { expected_bill_version: "${b1v2}", bill_id: "${b1_id}", stage: "COMMITTEE", summary: "Second amendment, refiled after re-reading the bill.", fiscal_impact_delta_cents: 0, drafting_start_utc: "2026-09-01T16:00:00Z", drafting_due_utc: "2026-09-01T18:00:00Z", committee_referral_id: "${cr1_id}" }
              as: Member
              as_user_id: "${m1_id}"
              captures: { am2_id: $.data.id }
            - call: "GET /bills/${b1_id}"
              payload: {}
              as: Member
              as_user_id: "${m1_id}"
              captures: { b1v3: $.data.version }
            - call: "GET /amendments"
              payload: { bill_id: "${b1_id}", limit: 20, offset: 0 }
              as: Clerk
          assert:
            - "First creation with expected_bill_version ${b1v1} -> 201 with status REQUESTED"
            - "Second creation replaying ${b1v1} -> 412 ERR_STALE_BILL_VERSION"
            - "b1v2 == b1v1 + 1: the accepted creation incremented Bill.version, which is precisely what made the replay stale"
            - "Refiling with ${b1v2} -> 201, so nothing about the payload other than the version was wrong"
            - "b1v3 == b1v2 + 1 — the version advanced once per SUCCESSFUL write and not at all for the 412"
            - "GET /amendments filtered by bill_id has total_count 2, so the refused creation left no row"
            - "The 412 is raised at priority 80, after existence and shape checks: a stale version plus a nonexistent bill_id still answers 404 first"

      - name: stale_expected_fiscal_note_request_version_blocks_a_cost_line_and_a_return_invalidates_it_too
        claim_type: Cross-Cutting — optimistic_concurrency
        grounds:
          - concurrency_rules.cost-estimate-create-stale-note
          - validations[priority 80].ERR_STALE_FISCAL_NOTE_VERSION
        distinguishing_aspect: "§1.2.1 rule cost-estimate-create-stale-note on its declared write_endpoint POST /fiscal-note-requests/{id}/cost-estimates through its declared occ_field. Two different things bump the note's version here — appending a line and the fiscal officer returning the note — so the analyst's cached version is invalidated both by its own writes and by someone else's, and CostEstimate itself has no version of its own to lean on."
        test_recipe:
          setup:
            - "Note n1 routed to agency a1 under INCREMENTAL_COST; the version observed at routing is captured as nv1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /sessions"
