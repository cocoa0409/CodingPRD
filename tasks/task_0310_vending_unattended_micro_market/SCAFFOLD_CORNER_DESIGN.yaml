          - "validations[priority=1]"
          - "validations[priority=3]"
          - "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT]"
        distinguishing_aspect: "A GET on a nonexistent machine with NO user-context headers returns ERR_MISSING_OR_INVALID_USER_CONTEXT (401), not 404 — auth (priority 1) outranks existence (priority 3)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /operations/machines/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ""
              captures: { err: $.data.error_id }
          assert:
            - "response status == 401"
            - "data.error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT"

      - name: insufficient_stock_partial_short_rejected
        claim_type: Violation → Error
        grounds:
          - "validations[priority=15]"
          - "errors[ERR_INSUFFICIENT_STOCK]"
        excluded_because:
          difficulty_instance: boundary_precision_check / bpc_sale_on_empty_slot_zero_onhand_rejected
          rationale: "ERR_INSUFFICIENT_STOCK is the asserted failure path of the named §1.8 boundary instance."

  # ===========================================================================
  - section: endpoints
    instances:
      - name: list_machines_pagination_envelope
        claim_type: Computed read
        grounds: [endpoints, response_envelope]
        distinguishing_aspect: "GET /operations/machines returns response_type=array with pagination fields total_count and has_more in meta/envelope; default limit 10."
        test_recipe:
          setup: ["one host, two machines"]
          setup_api_calls:
            - call: "POST /operations/host-sites"
              payload: { name: "Hl", contact_email: "hl@x.com" }
              as: FieldOps
              captures: { hid: $.data.id }
            - call: "POST /operations/machines"
              payload: { host_site_id: "${hid}", asset_tag: "L1", machine_type: "SNACK_VENDOR" }
              as: FieldOps
            - call: "POST /operations/machines"
              payload: { host_site_id: "${hid}", asset_tag: "L2", machine_type: "SNACK_VENDOR" }
              as: FieldOps
          trigger:
            - call: "GET /operations/machines"
              payload: {}
              as: HostManager
          assert:
            - "response status == 200"
            - "response_type == array; total_count == 2; has_more == false"

      - name: filter_sales_by_machine_reverse_reachability
        claim_type: Computed read
        grounds: [endpoints, entities.Sale.fields.machine_id]
        excluded_because:
          difficulty_instance: compensating_invariant / ci_sale_void_conserves_unit_inventory
          rationale: "Sale.machine_id reverse-reachability (GET /operations/sales?machine_id=) is the discovery channel exercised when verifying the void instance's inventory state."

  # ===========================================================================
  - section: errors
    instances:
      - name: error_envelope_shape_on_not_found
        claim_type: violation_to_error
        grounds:
          - "response_envelope"
          - "errors[ERR_SLOT_NOT_FOUND]"
        distinguishing_aspect: "GET /operations/slots/{unknown} returns response_type=error with data.error_id=ERR_SLOT_NOT_FOUND and a message string (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /operations/slots/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: FieldOps
              captures: { err: $.data.error_id, msg: $.data.message }
          assert:
            - "response status == 404"
            - "data.error_id == ERR_SLOT_NOT_FOUND"
            - "data.message is a non-empty string"

  # ===========================================================================
  - section: rbac
    instances:
      - name: routedriver_cannot_create_machine
        claim_type: exclusive_denial
        grounds: [roles, endpoints]
        distinguishing_aspect: "RouteDriver calling POST /operations/machines (FieldOps-exclusive) returns ERR_FORBIDDEN_ROLE (403)."
        test_recipe:
          setup: ["one host"]
          setup_api_calls:
            - call: "POST /operations/host-sites"
              payload: { name: "Hrb", contact_email: "hrb@x.com" }
              as: FieldOps
              captures: { hid: $.data.id }
          trigger:
            - call: "POST /operations/machines"
              payload: { host_site_id: "${hid}", asset_tag: "RBT", machine_type: "SNACK_VENDOR" }
              as: RouteDriver
              as_user_id: "00000000-0000-4000-8000-000000000abc"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 403"
            - "data.error_id == ERR_FORBIDDEN_ROLE"

      - name: financeclerk_cannot_open_service_ticket
        claim_type: exclusive_denial
        grounds: [roles, endpoints]
        distinguishing_aspect: "FinanceClerk calling POST /operations/machines/{id}/service-tickets (FieldOps+HostManager only) returns ERR_FORBIDDEN_ROLE (403)."
        test_recipe:
          setup: ["one host, one machine"]
          setup_api_calls:
            - call: "POST /operations/host-sites"
              payload: { name: "Hrc", contact_email: "hrc@x.com" }
              as: FieldOps
              captures: { hid: $.data.id }
            - call: "POST /operations/machines"
              payload: { host_site_id: "${hid}", asset_tag: "RCT2", machine_type: "SNACK_VENDOR" }
              as: FieldOps
              captures: { mid: $.data.id }
          trigger:
            - call: "POST /operations/machines/${mid}/service-tickets"
              payload: { issue_type: "JAM" }
              as: FinanceClerk
              captures: { err: $.data.error_id }
          assert:
            - "response status == 403"
            - "data.error_id == ERR_FORBIDDEN_ROLE"

      - name: hostmanager_can_record_sale_shared_op
        claim_type: shared_operation
        grounds: [roles, endpoints]
        distinguishing_aspect: "HostManager (sharing POST /operations/sales with FieldOps) successfully records a sale on a stocked machine (201)."
        test_recipe:
          setup: ["machine+slot stocked 10 units"]
          setup_api_calls:
            - call: "POST /operations/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-30T00:00:00Z" }
              as: FieldOps
            - call: "POST /operations/host-sites"
              payload: { name: "Hsh", contact_email: "hsh@x.com" }
              as: FieldOps
              captures: { hid: $.data.id }
            - call: "POST /operations/products"
              payload: { sku: "SH", name: "Sh", category: "SNACK", unit_cost_cents: 20, shelf_life_days: 0 }
              as: FieldOps
              captures: { pid: $.data.id }
            - call: "POST /operations/machines"
              payload: { host_site_id: "${hid}", asset_tag: "SHT", machine_type: "SNACK_VENDOR" }
              as: FieldOps
              captures: { mid: $.data.id, mv0: $.data.version }
            - call: "POST /operations/machines/${mid}/slots"
              payload: { product_id: "${pid}", slot_code: "SH1", capacity: 10, par_level: 10, price_cents: 100 }
              as: FieldOps
              captures: { sid: $.data.id }
            - call: "POST /operations/drivers"
              payload: { full_name: "Sh Drv", employee_code: "EMPSH" }
              as: FieldOps
              captures: { did: $.data.id }
            - call: "POST /operations/routes"
              payload: { driver_id: "${did}", service_date: "2026-06-30T00:00:00Z" }
              as: FieldOps
              captures: { rid: $.data.id }
            - call: "POST /operations/routes/${rid}/stops"
              payload: { machine_id: "${mid}", window_start_min: 480, window_end_min: 540 }
              as: FieldOps
              captures: { stid: $.data.id }
            - call: "POST /operations/routes/${rid}/dispatch"
              payload: {}
              as: FieldOps
            - call: "POST /operations/restock-visits"
              payload: { route_stop_id: "${stid}", counted_lines: [ { slot_id: "${sid}", physical_count: 0, refill_units: 10 } ], expected_machine_version: "${mv0}" }
              as: RouteDriver
              as_user_id: "${did}"
              captures: { vid: $.data.id }
            - call: "POST /operations/restock-visits/${vid}/reconcile"
              payload: { expected_machine_version: "${mv0}" }
              as: RouteDriver
              as_user_id: "${did}"
          trigger:
            - call: "POST /operations/sales"
              payload: { machine_id: "${mid}", slot_id: "${sid}", quantity: 1, payment_method: "CASHLESS" }
              as: HostManager
              as_user_id: "${hid}"
              captures: { saleid: $.data.id }
          assert:
            - "response status == 201"
            - "Sale.${saleid}.gross_cents == 100"

  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_machine_version_on_reconcile_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[restock-commit-stale-machine]"
          - "errors[ERR_STALE_MACHINE_VERSION]"
        distinguishing_aspect: "A second reconcile carrying a stale expected_machine_version (the version observed before the first reconcile bumped it) returns ERR_STALE_MACHINE_VERSION (412)."
        test_recipe:
          setup: ["machine+slot; two stops dispatched; first visit reconciled (Machine.version bumped); a second DRAFT visit still holds the pre-bump version"]
          setup_api_calls:
            - call: "POST /operations/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-18T00:00:00Z" }
              as: FieldOps
            - call: "POST /operations/host-sites"
              payload: { name: "Hocc", contact_email: "hocc@x.com" }
              as: FieldOps
              captures: { hid: $.data.id }
            - call: "POST /operations/products"
              payload: { sku: "OC", name: "Oc", category: "SNACK", unit_cost_cents: 20, shelf_life_days: 0 }
              as: FieldOps
              captures: { pid: $.data.id }
            - call: "POST /operations/machines"
              payload: { host_site_id: "${hid}", asset_tag: "OCT", machine_type: "SNACK_VENDOR" }
              as: FieldOps
              captures: { mid: $.data.id, mv0: $.data.version }
            - call: "POST /operations/machines/${mid}/slots"
              payload: { product_id: "${pid}", slot_code: "OC1", capacity: 40, par_level: 40, price_cents: 100 }
              as: FieldOps
              captures: { sid: $.data.id }
            - call: "POST /operations/drivers"
              payload: { full_name: "Oc Drv", employee_code: "EMPOC" }
              as: FieldOps
              captures: { did: $.data.id }
            - call: "POST /operations/routes"
              payload: { driver_id: "${did}", service_date: "2026-06-18T00:00:00Z" }
              as: FieldOps
              captures: { rid: $.data.id }
            - call: "POST /operations/routes/${rid}/stops"
              payload: { machine_id: "${mid}", window_start_min: 480, window_end_min: 540 }
              as: FieldOps
              captures: { stid1: $.data.id }
            - call: "POST /operations/routes/${rid}/stops"
              payload: { machine_id: "${mid}", window_start_min: 600, window_end_min: 660 }
              as: FieldOps
              captures: { stid2: $.data.id }
            - call: "POST /operations/routes/${rid}/dispatch"
              payload: {}
              as: FieldOps
            - call: "POST /operations/restock-visits"
              payload: { route_stop_id: "${stid1}", counted_lines: [ { slot_id: "${sid}", physical_count: 0, refill_units: 10 } ], expected_machine_version: "${mv0}" }
              as: RouteDriver
              as_user_id: "${did}"
              captures: { vid1: $.data.id }
            - call: "POST /operations/restock-visits"
              payload: { route_stop_id: "${stid2}", counted_lines: [ { slot_id: "${sid}", physical_count: 0, refill_units: 5 } ], expected_machine_version: "${mv0}" }
              as: RouteDriver
              as_user_id: "${did}"
              captures: { vid2: $.data.id }
            - call: "POST /operations/restock-visits/${vid1}/reconcile"
              payload: { expected_machine_version: "${mv0}" }
              as: RouteDriver
              as_user_id: "${did}"
          trigger:
            - call: "POST /operations/restock-visits/${vid2}/reconcile"
              payload: { expected_machine_version: "${mv0}" }
              as: RouteDriver
              as_user_id: "${did}"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 412"
            - "data.error_id == ERR_STALE_MACHINE_VERSION"

      - name: derived_onhand_reconciles_after_sale
        claim_type: derived_field_reconciliation
        grounds: [entities.PlanogramSlot.fields.on_hand, calculations.fifo_lot_consumption]
        excluded_because:
          difficulty_instance: compensating_invariant / ci_sale_void_conserves_unit_inventory
          rationale: "PlanogramSlot.on_hand recompute after a sale (12->7) is asserted within the named §1.8 conservation instance."

      - name: cascade_reconcile_recomputes_machine_stock_status
        claim_type: cascading_side_effects
        grounds: [state_machines.RestockVisit.DRAFT_to_RECONCILED, entities.Machine.fields.stock_status]
        excluded_because:
          difficulty_instance: transitive_cascade / tc_reconcile_lot_slot_machine_depth3
          rationale: "The reconcile -> lot -> slot.on_hand -> machine.stock_status cascade is the depth-3 chain asserted by the named §1.8 instance."

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: void_compensation_reverses_all_side_effects_no_drift
        claim_type: immediate
        grounds: [state_machines.Sale.SETTLED_to_VOID]
        excluded_because:
          difficulty_instance: compensating_invariant / ci_cash_sale_void_conserves_vault_cash
          rationale: "Immediate full reversal of a void (cash + inventory, no drift) is asserted by the named §1.8 conservation instance."
