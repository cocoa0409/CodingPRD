            - "contract remains ACTIVE"

  # ---------------------------------------------------------------------------
  - section: cross_cutting_layers
    instances:
      - name: occ_stale_contract_version_on_amend
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[contract-amend-stale-version]"]
        distinguishing_aspect: "After a successful amend bumps contract.version, a second amend replaying the previously observed version fails ERR_STALE_CONTRACT_VERSION (412)."
        test_recipe:
          setup:
            - "Account with ACTIVE contract (allowance 10, version captured at create)"
          setup_api_calls:
            - call: "POST /shopper-insights/supplier-accounts"
              payload: { account_name: "OCC Co", region: "NW" }
              as: RetailerAdmin
              captures: { acct: $.data.id }
            - call: "POST /shopper-insights/supplier-accounts/${acct}/subscription-contracts"
              payload: { tier: "TIER_CATEGORY", report_credit_allowance: 10, activation_budget_cents: 100000, redistribution_allowed: true, modeled_derivation_allowed: true }
              as: RetailerAdmin
              captures: { contract: $.data.id, cv: $.data.version }
          trigger:
            - call: "POST /shopper-insights/subscription-contracts/${contract}/amend"
              payload: { expected_contract_version: "${cv}", credit_allowance_delta: 5 }
              as: RetailerAdmin
              captures: { v2: $.data.version }
            - call: "POST /shopper-insights/subscription-contracts/${contract}/amend"
              payload: { expected_contract_version: "${cv}", credit_allowance_delta: 5 }
              as: RetailerAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - "first amend succeeds: version advanced from ${cv} by 1, allowance == 15"
            - "second amend replaying ${cv}: ERR_STALE_CONTRACT_VERSION (412), allowance unchanged at 15"

      - name: occ_stale_segment_version_on_activation
