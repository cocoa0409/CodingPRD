# =============================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index) — cryobank
# Grounds resolve into SCAFFOLD.yaml §1.1–§1.7. 9 rules × 2 instances = 18.
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: storage_bill_renewal_vs_lapse_diverge
        grounds:
          - calculations.storage_bill
          - state_machines.StorageAccount.ACTIVE_to_LAPSED
          - entities.StorageInvoice.fields.amount_cents
        distinguishing_aspect: |
          On the StorageInvoice/StorageAccount domain: RENEWAL prorates by remaining_days/365 while
          LAPSE charges the full base for identical stored_vials — RENEWAL after 100 elapsed days
          yields 60986 cents, LAPSE yields 84000 cents.
        test_recipe:
          setup:
            - "One ACTIVE donor with a RELEASED, listed inventory of 5 vials in dewar T-1."
            - "Recipient R signed consent; reservation of 2 vials CONFIRMED then SHIPPED at clock 2026-06-01, creating StorageAccount (stored_vials=2, period_start=2026-06-01) and period-0 RENEWAL invoice (84000)."
          setup_api_calls:
            - { call: "POST /donors", payload: { display_code: "D-1", full_name: "Donor One", donor_type: "SPERM", blood_type: "O_POS", family_limit: 10 }, as: ScreeningOfficer, captures: { donor_id: "$.data.id" } }
            - { call: "POST /screening-applications", payload: { donor_id: "${donor_id}", fda_risk_flag: false, genetic_carrier_count: 0, partner_screening_required: false }, as: ScreeningOfficer, captures: { app_id: "$.data.id" } }
            - { call: "POST /screening-applications/${app_id}/start-review", payload: {}, as: ScreeningOfficer }
            - { call: "POST /screening-applications/${app_id}/approve", payload: {}, as: ScreeningOfficer }
            - { call: "POST /specimens", payload: { donor_id: "${donor_id}", collection_date: "2026-05-01T00:00:00Z", initial_vial_count: 5, quarantine_release_date: "2026-06-01T00:00:00Z", retest_negative: true }, as: LabTech, captures: { spec_id: "$.data.id" } }
            - { call: "POST /specimens/${spec_id}/begin-quarantine", payload: { dewar_code: "T-1" }, as: LabTech }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: ComplianceOfficer }
            - { call: "POST /specimens/${spec_id}/release-quarantine", payload: {}, as: ComplianceOfficer }
            - { call: "GET /donor-inventories?specimen_id=${spec_id}", payload: {}, as: CatalogManager, captures: { inv_id: "$.data[0].id", inv_v: "$.data[0].version" } }
            - { call: "POST /recipients", payload: { family_name: "Fam R", contact_email: "r@x.com" }, as: CatalogManager, captures: { rcp_id: "$.data.id" } }
            - { call: "POST /recipient-consents", payload: { recipient_id: "${rcp_id}", donor_id: "${donor_id}", acknowledges_open_id: true }, as: Recipient, as_user_id: "${rcp_id}", captures: { con_id: "$.data.id" } }
            - { call: "POST /recipient-consents/${con_id}/sign", payload: {}, as: Recipient, as_user_id: "${rcp_id}" }
            - { call: "POST /vial-reservations", payload: { recipient_id: "${rcp_id}", inventory_id: "${inv_id}", vial_count: 2, expected_inventory_version: "${inv_v}" }, as: Recipient, as_user_id: "${rcp_id}", captures: { res_id: "$.data.id" } }
            - { call: "POST /vial-reservations/${res_id}/confirm", payload: {}, as: CatalogManager }
            - { call: "POST /shipments", payload: { reservation_id: "${res_id}", clinic_address: "1 Clinic Way", ln2_dewar_serial: "DS-9" }, as: LabTech, captures: { ship_id: "$.data.id" } }
            - { call: "POST /shipments/${ship_id}/dispatch", payload: {}, as: LabTech }
            - { call: "GET /storage-accounts?reservation_id=${res_id}", payload: {}, as: BillingClerk, captures: { acct_id: "$.data[0].id" } }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-09T00:00:00Z" }, as: BillingClerk }
            - { call: "POST /storage-accounts/${acct_id}/renew", payload: {}, as: BillingClerk, captures: { renew_inv_id: "$.data.id" } }
          assert:
            - "GET /storage-invoices?storage_account_id=${acct_id} contains an invoice with billing_mode == RENEWAL and period_index == 0 and amount_cents == 84000"
            - "The renewal invoice issued by /renew has billing_mode == RENEWAL and amount_cents == 60986 (base 84000 * 265/365, round_half_up)"

      - name: inventory_booking_vs_settlement_diverge
        grounds:
          - calculations.inventory_availability
          - entities.DonorInventory.fields.available_vials
          - entities.DonorInventory.fields.committed_available_vials
        distinguishing_aspect: |
          On the DonorInventory domain (distinct from storage_bill's StorageInvoice domain): BOOKING
          subtracts HELD+CONFIRMED+SHIPPED (available_vials==2) while SETTLEMENT subtracts only
          CONFIRMED+SHIPPED (committed_available_vials==4) for the same 5-vial lot with one HELD(2) and one CONFIRMED(1).
        test_recipe:
          setup:
            - "One listed 5-vial inventory; recipient R with a signed consent."
            - "Reservation A of 2 vials left HELD; reservation B of 1 vial CONFIRMED."
          setup_api_calls:
            - { call: "POST /donors", payload: { display_code: "D-2", full_name: "Donor Two", donor_type: "SPERM", blood_type: "A_POS", family_limit: 10 }, as: ScreeningOfficer, captures: { donor_id: "$.data.id" } }
            - { call: "POST /screening-applications", payload: { donor_id: "${donor_id}", fda_risk_flag: false, genetic_carrier_count: 0, partner_screening_required: false }, as: ScreeningOfficer, captures: { app_id: "$.data.id" } }
            - { call: "POST /screening-applications/${app_id}/start-review", payload: {}, as: ScreeningOfficer }
            - { call: "POST /screening-applications/${app_id}/approve", payload: {}, as: ScreeningOfficer }
            - { call: "POST /specimens", payload: { donor_id: "${donor_id}", collection_date: "2026-05-01T00:00:00Z", initial_vial_count: 5, quarantine_release_date: "2026-06-01T00:00:00Z", retest_negative: true }, as: LabTech, captures: { spec_id: "$.data.id" } }
            - { call: "POST /specimens/${spec_id}/begin-quarantine", payload: { dewar_code: "T-2" }, as: LabTech }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: ComplianceOfficer }
            - { call: "POST /specimens/${spec_id}/release-quarantine", payload: {}, as: ComplianceOfficer }
            - { call: "GET /donor-inventories?specimen_id=${spec_id}", payload: {}, as: CatalogManager, captures: { inv_id: "$.data[0].id", inv_v0: "$.data[0].version" } }
            - { call: "POST /recipients", payload: { family_name: "Fam R2", contact_email: "r2@x.com" }, as: CatalogManager, captures: { rcp_id: "$.data.id" } }
            - { call: "POST /recipient-consents", payload: { recipient_id: "${rcp_id}", donor_id: "${donor_id}", acknowledges_open_id: true }, as: Recipient, as_user_id: "${rcp_id}", captures: { con_id: "$.data.id" } }
            - { call: "POST /recipient-consents/${con_id}/sign", payload: {}, as: Recipient, as_user_id: "${rcp_id}" }
            - { call: "POST /vial-reservations", payload: { recipient_id: "${rcp_id}", inventory_id: "${inv_id}", vial_count: 2, expected_inventory_version: "${inv_v0}" }, as: Recipient, as_user_id: "${rcp_id}", captures: { res_a: "$.data.id" } }
            - { call: "GET /donor-inventories/${inv_id}", payload: {}, as: CatalogManager, captures: { inv_v1: "$.data.version" } }
            - { call: "POST /vial-reservations", payload: { recipient_id: "${rcp_id}", inventory_id: "${inv_id}", vial_count: 1, expected_inventory_version: "${inv_v1}" }, as: Recipient, as_user_id: "${rcp_id}", captures: { res_b: "$.data.id" } }
            - { call: "POST /vial-reservations/${res_b}/confirm", payload: {}, as: CatalogManager }
          trigger:
            - { call: "GET /donor-inventories/${inv_id}", payload: {}, as: CatalogManager, captures: { avail: "$.data.available_vials", committed: "$.data.committed_available_vials" } }
          assert:
            - "DonorInventory.${inv_id}.available_vials == 2"
            - "DonorInventory.${inv_id}.committed_available_vials == 4"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: renewal_proration_rounding_order
        grounds:
          - calculations.storage_bill
          - entities.StorageInvoice.fields.amount_cents
        distinguishing_aspect: |
          Mode (b) nested rounding: the scaffold pins round_half_up(base * remaining_days / 365) — multiply
          before dividing then round once — so 84000*265/365 rounds to 60986, not 60985 (which a divide-then-
          multiply or round-per-vial order would yield).
        test_recipe:
          setup:
            - "StorageAccount with stored_vials=2, period_start=2026-06-01, at period-0 RENEWAL."
          setup_api_calls:
            - { call: "POST /donors", payload: { display_code: "D-3", full_name: "Donor Three", donor_type: "SPERM", blood_type: "O_NEG", family_limit: 10 }, as: ScreeningOfficer, captures: { donor_id: "$.data.id" } }
            - { call: "POST /screening-applications", payload: { donor_id: "${donor_id}", fda_risk_flag: false, genetic_carrier_count: 0, partner_screening_required: false }, as: ScreeningOfficer, captures: { app_id: "$.data.id" } }
            - { call: "POST /screening-applications/${app_id}/start-review", payload: {}, as: ScreeningOfficer }
            - { call: "POST /screening-applications/${app_id}/approve", payload: {}, as: ScreeningOfficer }
            - { call: "POST /specimens", payload: { donor_id: "${donor_id}", collection_date: "2026-05-01T00:00:00Z", initial_vial_count: 5, quarantine_release_date: "2026-06-01T00:00:00Z", retest_negative: true }, as: LabTech, captures: { spec_id: "$.data.id" } }
            - { call: "POST /specimens/${spec_id}/begin-quarantine", payload: { dewar_code: "T-3" }, as: LabTech }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: ComplianceOfficer }
            - { call: "POST /specimens/${spec_id}/release-quarantine", payload: {}, as: ComplianceOfficer }
            - { call: "GET /donor-inventories?specimen_id=${spec_id}", payload: {}, as: CatalogManager, captures: { inv_id: "$.data[0].id", inv_v: "$.data[0].version" } }
            - { call: "POST /recipients", payload: { family_name: "Fam R3", contact_email: "r3@x.com" }, as: CatalogManager, captures: { rcp_id: "$.data.id" } }
            - { call: "POST /recipient-consents", payload: { recipient_id: "${rcp_id}", donor_id: "${donor_id}", acknowledges_open_id: true }, as: Recipient, as_user_id: "${rcp_id}", captures: { con_id: "$.data.id" } }
            - { call: "POST /recipient-consents/${con_id}/sign", payload: {}, as: Recipient, as_user_id: "${rcp_id}" }
            - { call: "POST /vial-reservations", payload: { recipient_id: "${rcp_id}", inventory_id: "${inv_id}", vial_count: 2, expected_inventory_version: "${inv_v}" }, as: Recipient, as_user_id: "${rcp_id}", captures: { res_id: "$.data.id" } }
            - { call: "POST /vial-reservations/${res_id}/confirm", payload: {}, as: CatalogManager }
            - { call: "POST /shipments", payload: { reservation_id: "${res_id}", clinic_address: "2 Clinic Way", ln2_dewar_serial: "DS-3" }, as: LabTech, captures: { ship_id: "$.data.id" } }
            - { call: "POST /shipments/${ship_id}/dispatch", payload: {}, as: LabTech }
            - { call: "GET /storage-accounts?reservation_id=${res_id}", payload: {}, as: BillingClerk, captures: { acct_id: "$.data[0].id" } }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-09T00:00:00Z" }, as: BillingClerk }
            - { call: "POST /storage-accounts/${acct_id}/renew", payload: {}, as: BillingClerk, captures: { renew_amt: "$.data.id" } }
          assert:
            - "The RENEWAL invoice from /renew has amount_cents == 60986 (round_half_up of 84000*265/365 == 60986.30 -> 60986)"

      - name: is_listed_multi_input_conjunction
        grounds:
          - calculations.inventory_availability
          - entities.DonorInventory.fields.is_listed
          - state_machines.SiblingRegistryEntry.PENDING_to_CONFIRMED
        distinguishing_aspect: |
          Mode (a) non-linear conjunction of 5 inputs: is_listed = (Specimen.RELEASED AND Donor.ACTIVE AND
          NOT is_family_limit_reached AND hold_status==OPEN AND available_vials>0); flipping only
          is_family_limit_reached to true (via a CONFIRMED registry entry reaching family_limit) turns
          is_listed from true to false while all four other inputs stay satisfied.
        test_recipe:
          setup:
            - "Donor with family_limit=1 and a RELEASED 5-vial listed inventory (is_listed=true)."
            - "Recipient R with a SHIPPED reservation for this donor, and a PENDING sibling-registry entry."
          setup_api_calls:
            - { call: "POST /donors", payload: { display_code: "D-4", full_name: "Donor Four", donor_type: "SPERM", blood_type: "B_POS", family_limit: 1 }, as: ScreeningOfficer, captures: { donor_id: "$.data.id" } }
            - { call: "POST /screening-applications", payload: { donor_id: "${donor_id}", fda_risk_flag: false, genetic_carrier_count: 0, partner_screening_required: false }, as: ScreeningOfficer, captures: { app_id: "$.data.id" } }
            - { call: "POST /screening-applications/${app_id}/start-review", payload: {}, as: ScreeningOfficer }
            - { call: "POST /screening-applications/${app_id}/approve", payload: {}, as: ScreeningOfficer }
            - { call: "POST /specimens", payload: { donor_id: "${donor_id}", collection_date: "2026-05-01T00:00:00Z", initial_vial_count: 5, quarantine_release_date: "2026-06-01T00:00:00Z", retest_negative: true }, as: LabTech, captures: { spec_id: "$.data.id" } }
            - { call: "POST /specimens/${spec_id}/begin-quarantine", payload: { dewar_code: "T-4" }, as: LabTech }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: ComplianceOfficer }
            - { call: "POST /specimens/${spec_id}/release-quarantine", payload: {}, as: ComplianceOfficer }
            - { call: "GET /donor-inventories?specimen_id=${spec_id}", payload: {}, as: CatalogManager, captures: { inv_id: "$.data[0].id", inv_v: "$.data[0].version" } }
            - { call: "POST /recipients", payload: { family_name: "Fam R4", contact_email: "r4@x.com" }, as: CatalogManager, captures: { rcp_id: "$.data.id" } }
            - { call: "POST /recipient-consents", payload: { recipient_id: "${rcp_id}", donor_id: "${donor_id}", acknowledges_open_id: true }, as: Recipient, as_user_id: "${rcp_id}", captures: { con_id: "$.data.id" } }
            - { call: "POST /recipient-consents/${con_id}/sign", payload: {}, as: Recipient, as_user_id: "${rcp_id}" }
            - { call: "POST /vial-reservations", payload: { recipient_id: "${rcp_id}", inventory_id: "${inv_id}", vial_count: 1, expected_inventory_version: "${inv_v}" }, as: Recipient, as_user_id: "${rcp_id}", captures: { res_id: "$.data.id" } }
            - { call: "POST /vial-reservations/${res_id}/confirm", payload: {}, as: CatalogManager }
            - { call: "POST /shipments", payload: { reservation_id: "${res_id}", clinic_address: "4 Clinic Way", ln2_dewar_serial: "DS-4" }, as: LabTech, captures: { ship_id: "$.data.id" } }
            - { call: "POST /shipments/${ship_id}/dispatch", payload: {}, as: LabTech }
            - { call: "POST /sibling-registry", payload: { donor_id: "${donor_id}", recipient_id: "${rcp_id}", birth_reported_date: "2026-06-05T00:00:00Z" }, as: Recipient, as_user_id: "${rcp_id}", captures: { sib_id: "$.data.id" } }
          trigger:
            - { call: "POST /sibling-registry/${sib_id}/confirm", payload: {}, as: ComplianceOfficer }
          assert:
            - "Donor.${donor_id}.reported_family_count == 1"
            - "Donor.${donor_id}.is_family_limit_reached == true"
            - "DonorInventory.${inv_id}.is_listed == false (was true before confirm; only is_family_limit_reached flipped)"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: screening_branch_approve_vs_defer_divergent_effects
        grounds:
          - state_machines.ScreeningApplication.UNDER_REVIEW_to_APPROVED
          - state_machines.ScreeningApplication.UNDER_REVIEW_to_DEFERRED
        distinguishing_aspect: |
          ScreeningApplication branches from UNDER_REVIEW to {APPROVED, DEFERRED} with divergent side-effect
          sets: APPROVED sets Donor.status=APPROVED + fda_eligible=true, DEFERRED sets Donor.status=DEFERRED
          and triggers the specimen-discard/inventory-freeze cascade.
        test_recipe:
          setup:
            - "Two donors each with a submitted, under-review screening application."
          setup_api_calls:
            - { call: "POST /donors", payload: { display_code: "D-5a", full_name: "Donor 5a", donor_type: "SPERM", blood_type: "O_POS", family_limit: 10 }, as: ScreeningOfficer, captures: { d_ok: "$.data.id" } }
            - { call: "POST /screening-applications", payload: { donor_id: "${d_ok}", fda_risk_flag: false, genetic_carrier_count: 0, partner_screening_required: false }, as: ScreeningOfficer, captures: { app_ok: "$.data.id" } }
            - { call: "POST /screening-applications/${app_ok}/start-review", payload: {}, as: ScreeningOfficer }
            - { call: "POST /donors", payload: { display_code: "D-5b", full_name: "Donor 5b", donor_type: "SPERM", blood_type: "A_NEG", family_limit: 10 }, as: ScreeningOfficer, captures: { d_def: "$.data.id" } }
            - { call: "POST /screening-applications", payload: { donor_id: "${d_def}", fda_risk_flag: false, genetic_carrier_count: 0, partner_screening_required: false }, as: ScreeningOfficer, captures: { app_def: "$.data.id" } }
            - { call: "POST /screening-applications/${app_def}/start-review", payload: {}, as: ScreeningOfficer }
          trigger:
            - { call: "POST /screening-applications/${app_ok}/approve", payload: {}, as: ScreeningOfficer }
            - { call: "POST /screening-applications/${app_def}/defer", payload: {}, as: ScreeningOfficer }
          assert:
            - "ScreeningApplication.${app_ok}.status == APPROVED and Donor.${d_ok}.status == APPROVED and Donor.${d_ok}.fda_eligible == true"
            - "ScreeningApplication.${app_def}.status == DEFERRED and Donor.${d_def}.status == DEFERRED"

      - name: storage_account_lapse_reactivation_cycle
        grounds:
          - state_machines.StorageAccount.ACTIVE_to_LAPSED
          - state_machines.StorageAccount.LAPSED_to_ACTIVE
        distinguishing_aspect: |
          StorageAccount (a different entity from ScreeningApplication) cycles ACTIVE->LAPSED->ACTIVE:
          assess-lapse moves it to LAPSED and issues a LAPSE invoice; paying that invoice returns it to ACTIVE.
        test_recipe:
          setup:
            - "StorageAccount created at ship (period_start 2026-06-01, stored_vials 2), then clock advanced past paid_through+grace and lapse assessed."
          setup_api_calls:
            - { call: "POST /donors", payload: { display_code: "D-6", full_name: "Donor Six", donor_type: "SPERM", blood_type: "AB_POS", family_limit: 10 }, as: ScreeningOfficer, captures: { donor_id: "$.data.id" } }
            - { call: "POST /screening-applications", payload: { donor_id: "${donor_id}", fda_risk_flag: false, genetic_carrier_count: 0, partner_screening_required: false }, as: ScreeningOfficer, captures: { app_id: "$.data.id" } }
            - { call: "POST /screening-applications/${app_id}/start-review", payload: {}, as: ScreeningOfficer }
            - { call: "POST /screening-applications/${app_id}/approve", payload: {}, as: ScreeningOfficer }
            - { call: "POST /specimens", payload: { donor_id: "${donor_id}", collection_date: "2026-05-01T00:00:00Z", initial_vial_count: 5, quarantine_release_date: "2026-06-01T00:00:00Z", retest_negative: true }, as: LabTech, captures: { spec_id: "$.data.id" } }
            - { call: "POST /specimens/${spec_id}/begin-quarantine", payload: { dewar_code: "T-6" }, as: LabTech }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: ComplianceOfficer }
            - { call: "POST /specimens/${spec_id}/release-quarantine", payload: {}, as: ComplianceOfficer }
            - { call: "GET /donor-inventories?specimen_id=${spec_id}", payload: {}, as: CatalogManager, captures: { inv_id: "$.data[0].id", inv_v: "$.data[0].version" } }
            - { call: "POST /recipients", payload: { family_name: "Fam R6", contact_email: "r6@x.com" }, as: CatalogManager, captures: { rcp_id: "$.data.id" } }
            - { call: "POST /recipient-consents", payload: { recipient_id: "${rcp_id}", donor_id: "${donor_id}", acknowledges_open_id: true }, as: Recipient, as_user_id: "${rcp_id}", captures: { con_id: "$.data.id" } }
            - { call: "POST /recipient-consents/${con_id}/sign", payload: {}, as: Recipient, as_user_id: "${rcp_id}" }
            - { call: "POST /vial-reservations", payload: { recipient_id: "${rcp_id}", inventory_id: "${inv_id}", vial_count: 2, expected_inventory_version: "${inv_v}" }, as: Recipient, as_user_id: "${rcp_id}", captures: { res_id: "$.data.id" } }
            - { call: "POST /vial-reservations/${res_id}/confirm", payload: {}, as: CatalogManager }
            - { call: "POST /shipments", payload: { reservation_id: "${res_id}", clinic_address: "6 Clinic Way", ln2_dewar_serial: "DS-6" }, as: LabTech, captures: { ship_id: "$.data.id" } }
            - { call: "POST /shipments/${ship_id}/dispatch", payload: {}, as: LabTech }
            - { call: "GET /storage-accounts?reservation_id=${res_id}", payload: {}, as: BillingClerk, captures: { acct_id: "$.data[0].id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-07-01T00:00:00Z" }, as: BillingClerk }
            - { call: "POST /storage-accounts/${acct_id}/assess-lapse", payload: {}, as: BillingClerk }
            - { call: "GET /storage-invoices?storage_account_id=${acct_id}&billing_mode=LAPSE", payload: {}, as: BillingClerk, captures: { lapse_inv_id: "$.data[0].id" } }
          trigger:
            - { call: "POST /storage-invoices/${lapse_inv_id}/pay", payload: {}, as: BillingClerk }
          assert:
            - "StorageInvoice.${lapse_inv_id}.status == PAID and billing_mode == LAPSE and amount_cents == 84000"
            - "StorageAccount.${acct_id}.status == ACTIVE (was LAPSED before the pay)"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: donor_defer_cascade_depth4
        grounds:
          - state_machines.ScreeningApplication.UNDER_REVIEW_to_DEFERRED
          - state_machines.Specimen.RELEASED_to_DISCARDED
          - state_machines.VialReservation.CONFIRMED_to_CANCELLED
          - state_machines.Shipment.PREPARING_to_CANCELLED
        distinguishing_aspect: |
          Depth-4 chain each link caused by the prior: application DEFER -> Donor DEFERRED -> Specimen DISCARDED
          -> its CONFIRMED reservation CANCELLED -> that reservation's PREPARING shipment CANCELLED.
        test_recipe:
          setup:
            - "Donor APPROVED with RELEASED inventory, a CONFIRMED reservation and a PREPARING shipment; a fresh UNDER_REVIEW second application exists to trigger defer."
          setup_api_calls:
