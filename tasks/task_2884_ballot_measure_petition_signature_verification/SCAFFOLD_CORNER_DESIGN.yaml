            - "${ag_status} == REFERRED_TO_AG"
            - "${e_sod_referral} == ERR_SEGREGATION_OF_DUTIES (403) - exam-1 opened the referral; the stage gate at priority 10 is satisfied, so only priority 8 can explain it"
            - "${adj_status} == UNSUBSTANTIATED, ${adj_state} == UNSUBSTANTIATED and ${adj_by} == admin-1 - a different identity may adjudicate; the circulator keeps registration_status REGISTERED and misconduct_strike_count 0, and Petition.${pet_id}.voided_signature_count == 0"
            - "${e_late} == ERR_REFERRAL_NOT_WITH_AG (409) - an adjudicated referral has left the AG stage, so the same code covers both sides of the window"
            - "${e_sod_determination} == ERR_SEGREGATION_OF_DUTIES (403) - exam-1 tallied the latest closed round, and the petition is still PENDING_CERTIFICATION"
            - "${final_status} == CERTIFIED - the administrator's identical determination succeeds, so the refusal was about who tallied and not about the petition's readiness"

  # ---------------------------------------------------------------------------
  # Section 8 of 9: complexity_layers. The profile declares four layers -
  # optimistic_concurrency, cascading_side_effects, dual_variant_calculation and
  # rate_threshold_triggers. Only the concurrency layer is under-probed by §1.8,
  # so it gets the real instance and the other three are stubbed.
  # ---------------------------------------------------------------------------
  - section: complexity_layers
    instances:
      - name: stale_versions_rejected_on_both_concurrency_rules
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[title-summary-stale-petition]
          - concurrency_rules[assignment-create-stale-circulator]
          - validations[priority 9]
          - errors[ERR_STALE_PETITION_VERSION]
          - errors[ERR_STALE_CIRCULATOR_VERSION]
        distinguishing_aspect: |
          Both OCC rules guard operations that are legitimate to repeat - a title may be
          revised while the petition sits in TITLE_PENDING, and a circulator may hold several
          non-overlapping assignments - so no state precondition can stand in for the version
          check and a missing check is invisible to every other test. Each rule is probed with
          the version that was current one call earlier, which is the realistic stale-read
          shape, and the refusal is 412 rather than 409. The retry with the refreshed version
          then succeeds, and the refused calls are shown to have left no trace: the official
          title still reads the first revision and the circulator still holds one assignment.
          The two codes are distinct per parent entity, so a single shared stale-version code
          would fail here.
        test_recipe:
          setup:
            - "Standard SOS-V; petition P submitted and format-approved, so it sits in TITLE_PENDING with a known version."
            - "Circulator c1 trained and sworn, so it is REGISTERED with a known version; county ALPHA exists for the assignment county codes."
            - "ASSIGNMENT_BUFFER_DAYS is 3, so the second assignment window starts more than three days after the first one ends and cannot be refused on temporal grounds."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SosAdmin
              as_user_id: "admin-1"
            - call: "POST /verification-standards"
              payload: { jurisdiction_code: "SOS-V", gubernatorial_vote_total: 100, signature_pct_bps: 100, sample_pct_bps: 10000, sample_min_count: 1, sufficiency_upper_bps: 10000, sufficiency_lower_bps: 5000, stratification_mode: "POOLED", county_distribution_pct_bps: 500, required_qualifying_counties: 1, verification_rate_millicents_per_signature: 4750, county_surcharge_bps: 250 }
              as: SosAdmin
              as_user_id: "admin-1"
              captures: { std_id: $.data.id }
            - call: "POST /counties"
              payload: { county_code: "ALPHA", name: "Alpha County", registered_voter_count: 20 }
              as: SosAdmin
              as_user_id: "admin-1"
              captures: { alpha_id: $.data.id }
            - call: "POST /petitions"
              payload: { standard_id: "${std_id}", proponent_name: "Version Committee", submitted_title: "Version Measure", measure_subject_codes: ["TAX"] }
              as: Proponent
              as_user_id: "prop-1"
              captures: { pet_id: $.data.id }
            - call: "POST /petitions/${pet_id}/submit"
              payload: {}
              as: Proponent
              as_user_id: "prop-1"
            - call: "POST /petitions/${pet_id}/format-decision"
              payload: { decision: "APPROVE" }
              as: ElectionsExaminer
              as_user_id: "exam-1"
              captures: { pet_v1: $.data.version, pet_state: $.data.status }
            - call: "POST /circulators"
              payload: { full_name: "Cora Carter", residency_state_code: "CA" }
              as: SosAdmin
              as_user_id: "admin-1"
              captures: { c1_id: $.data.id }
            - call: "POST /circulators/${c1_id}/training"
              payload: { training_course_code: "SOS-CIRC-101" }
              as: SosAdmin
              as_user_id: "admin-1"
            - call: "POST /circulators/${c1_id}/affidavit"
              payload: { sworn: true }
              as: SosAdmin
              as_user_id: "admin-1"
              captures: { c1_v1: $.data.version, c1_state: $.data.registration_status }
          trigger:
            - call: "PUT /petitions/${pet_id}/title-summary"
              payload: { official_title: "First Revision", official_summary: "First summary.", expected_petition_version: "${pet_v1}" }
              as: TitleExaminer
              as_user_id: "title-1"
              captures: { pet_v2: $.data.version, title1: $.data.official_title }
            - call: "PUT /petitions/${pet_id}/title-summary"
              payload: { official_title: "Second Revision", official_summary: "Second summary.", expected_petition_version: "${pet_v1}" }
              as: TitleExaminer
              as_user_id: "title-1"
              captures: { e_stale_pet: $.data.error_id }
            - call: "GET /petitions/${pet_id}"
              as: TitleExaminer
              as_user_id: "title-1"
              captures: { pet_v3: $.data.version, title2: $.data.official_title }
            - call: "PUT /petitions/${pet_id}/title-summary"
              payload: { official_title: "Second Revision", official_summary: "Second summary.", expected_petition_version: "${pet_v3}" }
              as: TitleExaminer
              as_user_id: "title-1"
              captures: { pet_v4: $.data.version, title3: $.data.official_title }
            - call: "POST /circulation-assignments"
              payload: { petition_id: "${pet_id}", circulator_id: "${c1_id}", effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-08-10T00:00:00Z", assigned_county_codes: ["ALPHA"], expected_circulator_version: "${c1_v1}" }
              as: SosAdmin
              as_user_id: "admin-1"
              captures: { a1_id: $.data.id }
            - call: "POST /circulation-assignments"
              payload: { petition_id: "${pet_id}", circulator_id: "${c1_id}", effective_from: "2026-08-20T00:00:00Z", effective_to: "2026-08-31T00:00:00Z", assigned_county_codes: ["ALPHA"], expected_circulator_version: "${c1_v1}" }
              as: SosAdmin
              as_user_id: "admin-1"
              captures: { e_stale_circ: $.data.error_id }
            - call: "GET /circulators/${c1_id}"
              as: SosAdmin
              as_user_id: "admin-1"
              captures: { c1_v2: $.data.version }
            - call: "POST /circulation-assignments"
              payload: { petition_id: "${pet_id}", circulator_id: "${c1_id}", effective_from: "2026-08-20T00:00:00Z", effective_to: "2026-08-31T00:00:00Z", assigned_county_codes: ["ALPHA"], expected_circulator_version: "${c1_v2}" }
              as: SosAdmin
              as_user_id: "admin-1"
              captures: { a2_id: $.data.id, a2_status: $.data.status }
            - call: "GET /circulation-assignments?circulator_id=${c1_id}"
              as: SosAdmin
              as_user_id: "admin-1"
              captures: { asg_first: "$.data[0].id" }
          assert:
            - "${pet_state} == TITLE_PENDING and ${c1_state} == REGISTERED before any probe"
            - "${title1} == First Revision and ${pet_v2} == ${pet_v1} + 1 - the first write with the current version succeeds"
            - "${e_stale_pet} == ERR_STALE_PETITION_VERSION with HTTP 412, not 409 and not ERR_INVALID_PETITION_STATE - the petition is still legitimately in TITLE_PENDING, so only the version can explain the refusal"
            - "${pet_v3} == ${pet_v2} and ${title2} == First Revision - the refused write changed nothing, not even the version"
            - "${title3} == Second Revision and ${pet_v4} == ${pet_v3} + 1 - the revision succeeds once the version is refreshed, confirming revisions are permitted in this state"
            - "${e_stale_circ} == ERR_STALE_CIRCULATOR_VERSION with HTTP 412 - creating the first assignment bumped the circulator, so the version read before it is stale; the window 2026-08-20..2026-08-31 clears the 3-day buffer on both sides and therefore cannot be an ERR_ASSIGNMENT_WINDOW_CONFLICT"
            - "${c1_v2} == ${c1_v1} + 1 and the retry returns ${a2_id} with ${a2_status} == ACTIVE"
            - "GET /circulation-assignments?circulator_id=${c1_id} returns exactly [${a1_id}, ${a2_id}] with ${asg_first} == ${a1_id} - the refused create left no partial row behind"
            - "The two codes are distinct: the petition rule never reports ERR_STALE_CIRCULATOR_VERSION and vice versa"

      - name: cascading_side_effects_on_revocation
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers[cascading_side_effects]
          - state_machines.Circulator
        excluded_because:
          difficulty_instance: circulator_revoke_cascades_four_levels_to_petition_ledger
          rationale: |
            §1.8 walks the full four-level cascade - circulator to assignments to batches to
            signature records to the petition's counters and cost ledger - asserting each
            level and the fields the cascade must leave alone. Nothing in this layer's
            revocation path is unexercised.

      - name: cascading_side_effects_on_fraud_substantiation
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers[cascading_side_effects]
          - state_machines.FraudReferral
        excluded_because:
          difficulty_instance: fraud_substantiation_cascades_to_batch_and_assignment
          rationale: |
            §1.8 substantiates a referral and asserts the conditional cascade into the named
            batch, its lines, the circulator's strike count and credibility variant, and the
            assignment - including the branch where the batch was already terminal. The
            rbac instance above reuses the UNSUBSTANTIATED branch to show the cascade does
            not fire.

      - name: dual_variant_projection_divergence
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers[dual_variant_calculation]
          - calculations.projected_valid_count
        excluded_because:
          difficulty_instance: pooled_vs_stratified_projection_divergence_on_petition
          rationale: |
            §1.8 runs identical line data under POOLED and STRATIFIED standards and asserts
            that the projections diverge, that the selector is the standard's
            stratification_mode, and that the two branches reconcile against the same raw
            totals. Variant divergence, selection and reconciliation are all covered.

      - name: dual_variant_credibility_selection
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers[dual_variant_calculation]
          - calculations.circulator_credibility_score
        excluded_because:
          difficulty_instance: provisional_vs_adjudicated_circulator_credibility
          rationale: |
            §1.8 pins the provisional formula while no strike exists and the adjudicated
            formula after one, including the clamp at both ends, so the second dual-variant
            calculation needs no further breadth probe.

      - name: rate_threshold_sufficiency_band
        claim_type: rate_threshold_triggers
        grounds:
          - complexity_profile.complexity_layers[rate_threshold_triggers]
          - calculations.sufficiency_determination
        excluded_because:
          difficulty_instance: sufficiency_lower_gate_inclusive_boundary
          rationale: |
            §1.8 lands the projection exactly on the lower gate, one above it and exactly on
            the upper gate, so the three-way threshold branch (INSUFFICIENT,
            FULL_CHECK_REQUIRED, SUFFICIENT) and the inclusivity of both gates are asserted.

      - name: rate_threshold_sample_size_clamps
        claim_type: rate_threshold_triggers
        grounds:
          - complexity_profile.complexity_layers[rate_threshold_triggers]
          - calculations.sample_selection
        excluded_because:
          difficulty_instance: sample_size_min_max_clamp_interaction
          rationale: |
            §1.8 drives the sample size through the min clamp, the percentage band and the
            population cap, and asserts the derived stride and the selected line identities,
            which is the whole of this threshold rule.

  # ---------------------------------------------------------------------------
  # Section 9 of 9: consistency_model. The profile declares immediate
  # consistency: every derived field is visible in the response of the request
  # that caused it, with no second call and no polling.
  # ---------------------------------------------------------------------------
  - section: consistency_model
    instances:
      - name: derived_ledger_fields_visible_in_the_causing_response
        claim_type: immediate_consistency
        grounds:
          - complexity_profile.consistency_model
          - calculations.batch_verification_cost
          - calculations.sufficiency_determination
          - entities[Petition]
          - entities[SignatureBatch]
        distinguishing_aspect: |
          Every counter in this API is derived from child rows, and immediate consistency
          means the causing response already carries the new values - a implementation that
          recomputes lazily on the next GET would pass a suite that always reads back. So
          each mutation's own response body is asserted first, and only then compared with a
          follow-up GET, which must be identical. The cross-entity direction matters as much
          as the local one: verifying a batch's affidavit updates the petition's raw and
          accepted totals, and tallying a round updates the batch's cost, the petition's
          accrued cost and the petition's projection in the same request.
        test_recipe:
          setup:
            - "Standard SOS-I: required_valid_signatures 1 (100 votes at 100 bps), census sampling, upper_gate 1, verification_rate_millicents_per_signature 4750."
            - "County ALPHA with ACTIVE voter VA1; petition cleared 2026-08-01; circulator c1 REGISTERED with an ALPHA assignment; one batch with one matching line, filed at clock 2026-08-10."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SosAdmin
              as_user_id: "admin-1"
            - call: "POST /verification-standards"
              payload: { jurisdiction_code: "SOS-I", gubernatorial_vote_total: 100, signature_pct_bps: 100, sample_pct_bps: 10000, sample_min_count: 1, sufficiency_upper_bps: 10000, sufficiency_lower_bps: 5000, stratification_mode: "POOLED", county_distribution_pct_bps: 500, required_qualifying_counties: 1, verification_rate_millicents_per_signature: 4750, county_surcharge_bps: 250 }
              as: SosAdmin
              as_user_id: "admin-1"
              captures: { std_id: $.data.id }
            - call: "POST /counties"
              payload: { county_code: "ALPHA", name: "Alpha County", registered_voter_count: 20 }
              as: SosAdmin
              as_user_id: "admin-1"
              captures: { alpha_id: $.data.id }
            - call: "POST /voter-records"
              payload: { county_id: "${alpha_id}", voter_id_number: "VA1", full_name: "Ada Adams", signature_on_file_hash: "H-VA1", registration_date: "2020-01-01T00:00:00Z", registration_status: "ACTIVE" }
              as: SosAdmin
              as_user_id: "admin-1"
              captures: { v1_id: $.data.id }
            - call: "POST /petitions"
              payload: { standard_id: "${std_id}", proponent_name: "Instant Committee", submitted_title: "Instant Measure", measure_subject_codes: ["TAX"] }
              as: Proponent
              as_user_id: "prop-1"
              captures: { pet_id: $.data.id }
            - call: "POST /petitions/${pet_id}/submit"
              payload: {}
              as: Proponent
              as_user_id: "prop-1"
            - call: "POST /petitions/${pet_id}/format-decision"
              payload: { decision: "APPROVE" }
              as: ElectionsExaminer
              as_user_id: "exam-1"
              captures: { pet_v: $.data.version }
            - call: "PUT /petitions/${pet_id}/title-summary"
              payload: { official_title: "The Instant Act", official_summary: "Visible at once.", expected_petition_version: "${pet_v}" }
              as: TitleExaminer
              as_user_id: "title-1"
            - call: "POST /petitions/${pet_id}/clear-for-circulation"
              payload: {}
              as: SosAdmin
              as_user_id: "admin-1"
              captures: { req_sigs: $.data.required_valid_signatures }
            - call: "POST /circulators"
              payload: { full_name: "Cora Carter", residency_state_code: "CA" }
              as: SosAdmin
              as_user_id: "admin-1"
              captures: { c1_id: $.data.id }
            - call: "POST /circulators/${c1_id}/training"
              payload: { training_course_code: "SOS-CIRC-101" }
              as: SosAdmin
              as_user_id: "admin-1"
            - call: "POST /circulators/${c1_id}/affidavit"
              payload: { sworn: true }
              as: SosAdmin
              as_user_id: "admin-1"
              captures: { c1_v: $.data.version }
            - call: "POST /circulation-assignments"
              payload: { petition_id: "${pet_id}", circulator_id: "${c1_id}", effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-08-31T00:00:00Z", assigned_county_codes: ["ALPHA"], expected_circulator_version: "${c1_v}" }
              as: SosAdmin
              as_user_id: "admin-1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: SosAdmin
              as_user_id: "admin-1"
            - call: "POST /signature-batches"
              payload: { petition_id: "${pet_id}", circulator_id: "${c1_id}", county_id: "${alpha_id}", affidavit_signed: true }
              as: Proponent
              as_user_id: "prop-1"
              captures: { b1_id: $.data.id, b1_raw0: $.data.raw_count }
          trigger:
            - call: "POST /signature-batches/${b1_id}/signatures"
              payload: { line_number: 1, signer_name: "Ada Adams", claimed_voter_id_number: "VA1", signed_on: "2026-08-05T00:00:00Z", signature_hash: "H-VA1" }
              as: Proponent
              as_user_id: "prop-1"
              captures: { l1_id: $.data.id, l1_status0: $.data.validation_status }
            - call: "GET /signature-batches/${b1_id}"
              as: ElectionsExaminer
              as_user_id: "exam-1"
              captures: { b1_raw1: $.data.raw_count }
            - call: "POST /signature-batches/${b1_id}/verify-affidavit"
              payload: { affidavit_notary_id: "NOT-1" }
              as: CountyClerk
              as_user_id: "${alpha_id}"
              captures: { b1_status1: $.data.status, b1_accepted1: $.data.accepted_raw_count }
            - call: "GET /petitions/${pet_id}"
              as: ElectionsExaminer
              as_user_id: "exam-1"
              captures: { pet_raw1: $.data.raw_signature_count, pet_accepted1: $.data.accepted_raw_total }
            - call: "POST /petitions/${pet_id}/file-signatures"
              payload: {}
              as: Proponent
              as_user_id: "prop-1"
              captures: { pet_status1: $.data.status, pet_raw2: $.data.raw_signature_count }
            - call: "POST /petitions/${pet_id}/verification-rounds"
              payload: { round_type: "RANDOM_SAMPLE" }
              as: ElectionsExaminer
              as_user_id: "exam-1"
              captures: { r1_id: $.data.id, r1_size: $.data.sample_size, r1_status: $.data.status }
            - call: "GET /signature-records/${l1_id}"
              as: ElectionsExaminer
              as_user_id: "exam-1"
              captures: { l1_in_sample: $.data.in_sample }
            - call: "POST /signature-records/${l1_id}/validate"
              payload: {}
              as: CountyClerk
              as_user_id: "${alpha_id}"
              captures: { l1_status1: $.data.validation_status, l1_matched: $.data.matched_voter_record_id, l1_round: $.data.validated_in_round_id }
            - call: "POST /verification-rounds/${r1_id}/tally"
              payload: {}
              as: ElectionsExaminer
              as_user_id: "exam-1"
              captures: { r1_valid: $.data.sampled_valid_count, r1_rate: $.data.validity_rate_bps, r1_proj: $.data.projected_valid_count, r1_det: $.data.determination, r1_cost: $.data.accrued_cost_cents }
            - call: "GET /signature-batches/${b1_id}"
              as: ElectionsExaminer
              as_user_id: "exam-1"
              captures: { b1_status2: $.data.status, b1_checked: $.data.checked_signature_count, b1_cost: $.data.verification_cost_cents }
            - call: "GET /petitions/${pet_id}"
              as: ElectionsExaminer
              as_user_id: "exam-1"
              captures: { pet_status2: $.data.status, pet_proj: $.data.projected_valid_count, pet_cost: $.data.verification_cost_accrued_cents, pet_counties: $.data.qualifying_county_count }
            - call: "GET /petitions/${pet_id}/verification-invoice"
              as: ElectionsExaminer
              as_user_id: "exam-1"
              captures: { inv_gross: $.data.gross_cents, inv_total: $.data.total_cents }
          assert:
            - "${b1_raw0} == 0 at creation and ${l1_status0} == PENDING with in_sample false - a fresh line starts unexamined"
            - "${b1_raw1} == 1 - the parent's raw_count already reflects the child created one call earlier"
            - "${b1_status1} == AFFIDAVIT_VERIFIED and ${b1_accepted1} == 1 in the affidavit response itself"
            - "${pet_raw1} == 1 and ${pet_accepted1} == 1 - the cross-entity roll-up happened during the affidavit request, not on read"
            - "${pet_status1} == SIGNATURES_FILED and ${pet_raw2} == 1 == ${pet_raw1} - filing does not recount"
            - "${r1_size} == 1 with ${r1_status} == OPEN, and ${l1_in_sample} == true - selection is written to the child rows synchronously"
            - "${l1_status1} == VALID, ${l1_matched} == ${v1_id} and ${l1_round} == ${r1_id} - the validate response carries every derived field it set"
            - "${r1_valid} == 1, ${r1_rate} == 10000, ${r1_proj} == 1, ${r1_det} == SUFFICIENT and ${r1_cost} == 5 - all five appear in the tally response"
            - "${b1_status2} == SAMPLED, ${b1_checked} == 1 and ${b1_cost} == 5 == round_half_up(1 * 4750 / 1000) - the batch was advanced and priced by the tally request"
            - "${pet_status2} == PENDING_CERTIFICATION, ${pet_proj} == 1 == ${req_sigs}, ${pet_cost} == 5 and ${pet_counties} == 1 - the petition ledger is current with no intervening write"
            - "${inv_gross} == 5 and ${inv_total} == 6 - the computed read summarises the ledger in the very next request: gross 5 is below TIER_A_FLOOR_CENTS 20 so tier is TIER_NONE with discount 0, subtotal 5, surcharge ceil(5 * 250 / 10000) == 1"

