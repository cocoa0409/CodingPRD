  # ---------------------------------------------------------------------------
  # Rule 7 — cross_entity_state_dependency (different entity pairs)
  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: dispatch_gated_by_clinical_packet_status
        grounds:
          - state_machines.TransferCase.ACCEPTED_to_TRANSPORT_ARRANGED
          - entities.ClinicalPacket.fields.overall_status
        distinguishing_aspect: |
          Pair TransferCase x ClinicalPacket: dispatch legality is gated on a
          DIFFERENT entity's computed status — the imaging leg alone flips
          overall_status INCOMPLETE -> READY and only then may the case advance.
        test_recipe:
          setup:
            - "EMERGENT ICU EMTALA_APPLIES case ACCEPTED at RCV; packet requires [H_AND_P] (uploaded) plus imaging study CXR-1 (not yet exchanged); insurance NOTIFIED"
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "Sending General", facility_code: "SND", trauma_level: "LEVEL_3", capabilities: ["TRAUMA"] }
              as: TransferCoordinator
              captures: { fac_s: $.data.id }
            - call: "POST /facilities"
              payload: { name: "Receiving Trauma Center", facility_code: "RCV", trauma_level: "LEVEL_1", capabilities: ["CARDIAC_CATH"] }
              as: TransferCoordinator
              captures: { fac_r: $.data.id }
            - call: "POST /facilities/${fac_r}/beds"
              payload: { bed_code: "ICU-01", unit_type: "ICU" }
              as: BedManager
              as_user_id: "${fac_r}"
            - call: "POST /physicians"
              payload: { full_name: "Dr Send", facility_id: "${fac_s}", specialty: "EMERGENCY" }
              as: TransferCoordinator
              captures: { phys_s: $.data.id }
            - call: "POST /physicians"
              payload: { full_name: "Dr Recv", facility_id: "${fac_r}", specialty: "INTENSIVIST" }
              as: TransferCoordinator
              captures: { phys_r: $.data.id }
            - call: "POST /transfer-cases"
              payload: { patient_ref: "PT-PKT-1", sending_facility_id: "${fac_s}", sending_physician_id: "${phys_s}", acuity_level: "EMERGENT", required_unit_type: "ICU", requires_isolation: false, required_capability: "CARDIAC_CATH" }
              as: TransferCoordinator
              captures: { case_id: $.data.id }
            - call: "POST /transfer-cases/${case_id}/emtala-screening"
              payload: { has_emergency_medical_condition: true, is_stabilized: true }
