          (priority 12). A return filed 40 days after fulfilment against a DIRECT_CONTACT line
          violates both; hygiene wins, so ERR_HYGIENE_NON_RETURNABLE (422) is returned and
          ERR_RETURN_WINDOW_EXPIRED never surfaces.
        test_recipe:
          setup:
            - "Product is DIRECT_CONTACT (e.g. a lip applicator wand) — never returnable."
            - "The order is SHIPPED at logical clock 2026-05-05T00:00:00Z; the clock is then pushed to 2026-06-20T00:00:00Z (46 days later, well past the 30-day window)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-05T00:00:00Z" }
              as: MerchandisingAdmin
            - call: "POST /stores"
              payload: { name: "SEP-CA", region_code: "CA" }
              as: MerchandisingAdmin
              captures: { store_id: "$.data.id"}
            - call: "POST /products"
              payload: { name: "Lip Wand", brand: "Aurea", category: "MAKEUP", hygiene_class: "DIRECT_CONTACT", base_price_cents: 3000 }
              as: MerchandisingAdmin
              captures: { prod_id: "$.data.id"}
            - call: "POST /products/${prod_id}/variants"
              payload: { shade_name: "Berry", shade_code: "BR-01", finish: "MATTE", undertone: "COOL", depth_index: 7, price_cents: 3000 }
              as: MerchandisingAdmin
              captures: { v_id: "$.data.id"}
            - call: "POST /inventory-lots"
              payload: { store_id: "${store_id}", variant_id: "${v_id}", units_received: 5 }
              as: MerchandisingAdmin
            - call: "POST /customers"
              payload: { email: "c10@x.com", name: "C Ten" }
              as: MerchandisingAdmin
              captures: { cust_id: "$.data.id"}
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", store_id: "${store_id}", channel: "SHIP_FROM_STORE", lines: [ { variant_id: "${v_id}", quantity: 1 } ] }
              as: StoreAssociate
              captures: { order_id: "$.data.id"}
            - call: "POST /orders/${order_id}/reserve"
              payload: {}
              as: StoreAssociate
            - call: "POST /orders/${order_id}/payments"
              payload: { action: "AUTHORIZE" }
              as: StoreAssociate
            - call: "POST /orders/${order_id}/payments"
              payload: { action: "CAPTURE" }
              as: StoreAssociate
            - call: "POST /orders/${order_id}/fulfillment"
              payload: { action: "SHIP" }
              as: StoreAssociate
            - call: "GET /order-lines"
              payload: {}
              as: StoreAssociate
              captures: { line_id: "$.data[0].id"}
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-20T00:00:00Z" }
              as: MerchandisingAdmin
          trigger:
            - call: "POST /return-requests"
              payload: { order_line_id: "${line_id}", quantity: 1, reason: "CHANGED_MIND" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: "$.data.error_id"}
          assert:
            - "${err} == ERR_HYGIENE_NON_RETURNABLE"
            - "HTTP status is 422"
            - "the response is NOT ERR_RETURN_WINDOW_EXPIRED"
            - "GET /return-requests?order_line_id=${line_id} returns 0 rows"

  # ===================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: gwp_threshold_fires_at_exactly_equal_discounted_subtotal
        grounds:
          - calculations.order_pricing
          - entities.Promotion.fields.threshold_cents
          - entities.OrderLine.fields.line_type
        distinguishing_aspect: |
          Metric 1 — a numeric >= threshold on money, reached through POST /orders/{id}/reserve: a
          discounted_subtotal of exactly 7500 against a threshold_cents of 7500 MUST materialise the
          GWP line (>=, not >). One cent less (7499) must not.
        test_recipe:
          setup:
            - "GWP promotion with threshold_cents 7500 gifting 1 unit of V_GIFT (stocked)."
            - "Customer INSIDER (0% tier discount) so discounted_subtotal == subtotal exactly."
            - "V_SALE priced 2500 with 10 units in stock; the order asks for exactly 3 units -> 7500."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "SEP-CA", region_code: "CA" }
              as: MerchandisingAdmin
              captures: { store_id: "$.data.id"}
            - call: "POST /products"
              payload: { name: "Velvet Lip", brand: "Aurea", category: "MAKEUP", hygiene_class: "SEALED", base_price_cents: 2500 }
              as: MerchandisingAdmin
              captures: { prod_id: "$.data.id"}
            - call: "POST /products/${prod_id}/variants"
              payload: { shade_name: "Warm Sand", shade_code: "WS-01", finish: "MATTE", undertone: "WARM", depth_index: 6, price_cents: 2500 }
              as: MerchandisingAdmin
              captures: { v_sale_id: "$.data.id"}
            - call: "POST /products"
              payload: { name: "Mini Serum", brand: "Aurea", category: "SKINCARE", hygiene_class: "SEALED", base_price_cents: 0 }
              as: MerchandisingAdmin
              captures: { gift_prod_id: "$.data.id"}
            - call: "POST /products/${gift_prod_id}/variants"
              payload: { shade_name: "Universal", shade_code: "UNI-00", finish: "DEWY", undertone: "NEUTRAL", depth_index: 6, price_cents: 0 }
              as: MerchandisingAdmin
              captures: { v_gift_id: "$.data.id"}
            - call: "POST /inventory-lots"
              payload: { store_id: "${store_id}", variant_id: "${v_sale_id}", units_received: 10 }
              as: MerchandisingAdmin
            - call: "POST /inventory-lots"
              payload: { store_id: "${store_id}", variant_id: "${v_gift_id}", units_received: 10 }
              as: MerchandisingAdmin
            - call: "POST /promotions"
              payload: { name: "GWP 75", promo_type: "GWP", threshold_cents: 7500, gift_variant_id: "${v_gift_id}", gift_quantity: 1, priority: 10, status: "ACTIVE" }
              as: MerchandisingAdmin
              captures: { promo_id: "$.data.id"}
            - call: "POST /customers"
              payload: { email: "c11@x.com", name: "C Eleven" }
              as: MerchandisingAdmin
              captures: { cust_id: "$.data.id"}
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", store_id: "${store_id}", channel: "SHIP_FROM_STORE", lines: [ { variant_id: "${v_sale_id}", quantity: 3 } ] }
              as: StoreAssociate
              captures: { order_id: "$.data.id"}
          trigger:
            - call: "POST /orders/${order_id}/reserve"
              payload: {}
              as: StoreAssociate
              captures: { ds: "$.data.discounted_subtotal_cents", gwp: "$.data.gwp_eligible"}
          assert:
            - "${ds} == 7500 (exactly equal to threshold_cents)"
            - "${gwp} == true"
            - "GET /order-lines?order_id=${order_id} returns exactly 2 rows"
            - "GET /order-lines?promotion_id=${promo_id} returns exactly 1 row with line_type == GWP, unit_price_cents == 0, quantity == 1"
            - "Order.${order_id}.total_due_cents == 7500 (the gift adds 0 cents)"

      - name: shade_finder_with_empty_candidate_set_returns_no_shade_match
        grounds:
          - calculations.shade_match_ranking
          - validations[priority=27]
          - errors[ERR_NO_SHADE_MATCH]
        distinguishing_aspect: |
          Metric 2 — an EMPTY-COLLECTION boundary (not a numeric threshold), reached through a
          different endpoint (POST /shade-recommendations): every catalogue variant sits at
          depth_index 2, so a request for depth_index 9 leaves the candidate set with zero members
          (|2-9| = 7 > DEPTH_TOLERANCE 2) and the declared empty-pool fallback fires.
        test_recipe:
          setup:
            - "The catalogue contains exactly two ACTIVE, NOT_LIMITED variants, both at depth_index 2."
          setup_api_calls:
            - call: "POST /products"
              payload: { name: "Foundation", brand: "Aurea", category: "MAKEUP", hygiene_class: "SEALED", base_price_cents: 4500 }
              as: MerchandisingAdmin
              captures: { prod_id: "$.data.id"}
            - call: "POST /products/${prod_id}/variants"
              payload: { shade_name: "Porcelain", shade_code: "F-02A", finish: "MATTE", undertone: "COOL", depth_index: 2, price_cents: 4500 }
              as: MerchandisingAdmin
            - call: "POST /products/${prod_id}/variants"
              payload: { shade_name: "Ivory", shade_code: "F-02B", finish: "DEWY", undertone: "WARM", depth_index: 2, price_cents: 4500 }
              as: MerchandisingAdmin
            - call: "POST /customers"
              payload: { email: "c12@x.com", name: "C Twelve" }
              as: MerchandisingAdmin
              captures: { cust_id: "$.data.id"}
          trigger:
            - call: "POST /shade-recommendations"
              payload: { undertone: "WARM", depth_index: 9, finish_pref: "MATTE" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: "$.data.error_id"}
          assert:
            - "${err} == ERR_NO_SHADE_MATCH"
            - "HTTP status is 422"
            - "the same request with depth_index 4 succeeds with 200 (|2-4| == 2 is inside DEPTH_TOLERANCE)"

  # ===================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: reserve_blocked_when_store_is_paused
        grounds:
          - state_machines.Order.DRAFT_to_RESERVED
          - validations[priority=16]
          - entities.Store.fields.status
          - errors[ERR_STORE_NOT_ACTIVE]
        distinguishing_aspect: |
          Entity pair Order -> Store: the Order's DRAFT -> RESERVED transition is legal on the Order's
          own state, and becomes illegal purely because the Store row it points at was flipped to
          PAUSED after the draft was created.
        test_recipe:
          setup:
            - "A DRAFT order exists at store SEP-CA with 1 unit of a stocked variant."
            - "SEP-CA is then PATCHed to status PAUSED."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "SEP-CA", region_code: "CA" }
              as: MerchandisingAdmin
              captures: { store_id: "$.data.id"}
            - call: "POST /products"
              payload: { name: "Lipstick", brand: "Aurea", category: "MAKEUP", hygiene_class: "SEALED", base_price_cents: 2500 }
              as: MerchandisingAdmin
              captures: { prod_id: "$.data.id"}
            - call: "POST /products/${prod_id}/variants"
              payload: { shade_name: "Rose", shade_code: "RS-01", finish: "SATIN", undertone: "COOL", depth_index: 5, price_cents: 2500 }
              as: MerchandisingAdmin
              captures: { v_id: "$.data.id"}
            - call: "POST /inventory-lots"
              payload: { store_id: "${store_id}", variant_id: "${v_id}", units_received: 5 }
              as: MerchandisingAdmin
              captures: { lot_id: "$.data.id"}
            - call: "POST /customers"
              payload: { email: "c13@x.com", name: "C Thirteen" }
              as: MerchandisingAdmin
              captures: { cust_id: "$.data.id"}
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", store_id: "${store_id}", channel: "SHIP_FROM_STORE", lines: [ { variant_id: "${v_id}", quantity: 1 } ] }
              as: StoreAssociate
              captures: { order_id: "$.data.id"}
            - call: "PATCH /stores/${store_id}"
              payload: { status: "PAUSED" }
              as: MerchandisingAdmin
          trigger:
            - call: "POST /orders/${order_id}/reserve"
              payload: {}
              as: StoreAssociate
              captures: { err: "$.data.error_id"}
          assert:
            - "${err} == ERR_STORE_NOT_ACTIVE"
            - "HTTP status is 409"
            - "Order.${order_id}.fulfillment_status is still DRAFT"
            - "InventoryLot.${lot_id}.on_hand_units == 5 and reserved_units == 0 (no partial draw)"

      - name: booking_completion_blocked_when_linked_order_payment_not_captured
        grounds:
          - state_machines.ServiceBooking.CONFIRMED_to_COMPLETED
          - validations[priority=23]
          - entities.ServiceBooking.fields.linked_order_id
          - errors[ERR_PAYMENT_NOT_CAPTURED]
        distinguishing_aspect: |
          A DIFFERENT entity pair — ServiceBooking -> Order: the booking is CONFIRMED and the artist
          is entitled to close it, yet completion is rejected because the LINKED Order's
          payment_status is AUTHORIZED rather than CAPTURED; once the order is captured the same call
          succeeds and awards exactly 200 SERVICE_BONUS points.
        test_recipe:
          setup:
            - "Customer C has a RESERVED, AUTHORIZED (not captured) SHIP_FROM_STORE order at SEP-CA."
            - "C holds a CONFIRMED MAKEOVER booking with artist A at SEP-CA, linked to that order."
          setup_api_calls:
