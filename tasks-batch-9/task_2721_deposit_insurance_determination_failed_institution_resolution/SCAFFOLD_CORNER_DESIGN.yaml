              as: ClosingManager
              captures: { sr_inst_id: $.data.id }
            - call: "POST /institutions/${sr_inst_id}/depositor-records"
              payload: { tin_hash: "TIN-SR-1", legal_name: "Lidia Moreno", depositor_type: "NATURAL_PERSON", contact_email: "lidia@example.com" }
              as: ClaimsAgent
              captures: { sr_dep_id: $.data.id }
            - call: "POST /deposit-accounts"
              payload: { institution_id: "${sr_inst_id}", primary_depositor_id: "${sr_dep_id}", account_number: "JT-0001", ownership_category: "JOINT", balance_cents: 2000000, accrued_interest_cents: 0, opened_at: "2024-06-01T00:00:00Z" }
