              captures: { first_invoice_id: "$.data[0].invoice_id" }
            - call: "GET /demurrage/placement-cycles/${cyc1_id}"
              payload: {}
              as: BillingAdmin
              captures: { billing_status: $.data.billing_status }
          assert:
