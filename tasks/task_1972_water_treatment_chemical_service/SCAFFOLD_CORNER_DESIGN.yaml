  # ===========================================================================
  # Section: validations
  # ===========================================================================
  - section: validations
    instances:
      - name: existence_beats_state_for_bogus_path_id
        claim_type: priority_ordering
        grounds: ["validations[priority=4]", "validations[priority=6]"]
        distinguishing_aspect: "existence (priority 4) beats state (priority 6): submitting a bogus order id to /submit returns ERR_NOT_FOUND (404), never ERR_INVALID_STATE."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /wt/delivery-orders/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/submit"
              payload: {}
              as: AccountManager
              captures: { v1_err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND"
            - "http status == 404"

      - name: field_constraint_coc_out_of_band
        claim_type: violation_to_error
        grounds: ["validations[priority=10]", "errors[ERR_FIELD_CONSTRAINT]"]
        distinguishing_aspect: "proposed_coc 13.0 exceeds the 12.0 ceiling -> ERR_FIELD_CONSTRAINT (422) at draft."
        test_recipe:
          setup: ["account + asset + design in SURVEYED"]
          setup_api_calls:
            - call: "POST /wt/accounts"
              payload: { account_name: "Band Co" }
              as: AccountManager
              captures: { v2_acct: $.data.id }
            - call: "POST /wt/assets"
              payload: { account_id: "${v2_acct}", asset_tag: "CT-V2", asset_type: "BOILER", recirculation_rate_gpm: 100, system_volume_gal: 500, metallurgy: "MILD_STEEL" }
              as: WaterChemist
              captures: { v2_asset: $.data.id }
            - call: "POST /wt/program-designs"
              payload: { asset_id: "${v2_asset}" }
              as: WaterChemist
              captures: { v2_pd: $.data.id }
            - { call: "POST /wt/program-designs/${v2_pd}/record-survey", payload: { survey_notes: "s" }, as: WaterChemist }
          trigger:
            - call: "POST /wt/program-designs/${v2_pd}/draft"
              payload: { proposed_coc: 13.0, inhibitor_target_ppm: 4, ph_min: 7.0, ph_max: 9.5, conductivity_max_umhos: 3000, service_rate_cents_per_month: 0 }
              as: WaterChemist
              captures: { v2_err: $.data.error_id }
          assert:
            - "error_id == ERR_FIELD_CONSTRAINT"
            - "ProgramDesign.${v2_pd}.status == SURVEYED"

      - name: quantity_not_container_multiple_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_QUANTITY_NOT_CONTAINER_MULTIPLE]"]
        distinguishing_aspect: "quantity_gal 100 with container 55 is not a whole multiple -> ERR_QUANTITY_NOT_CONTAINER_MULTIPLE (422)."
        test_recipe:
          setup: ["account + asset + ONLINE station (product container 55)"]
          setup_api_calls:
            - call: "POST /wt/accounts"
              payload: { account_name: "Mult Co" }
              as: AccountManager
