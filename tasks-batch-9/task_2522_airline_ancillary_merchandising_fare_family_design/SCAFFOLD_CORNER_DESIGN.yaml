              as: DistributionManager
              as_user_id: "dm-001"
              captures: { pub_two_id: $.data.id }
          assert:
            - "the first trigger is HTTP 412 with error_id \"ERR_STALE_FAMILY_VERSION\" and GET /fare-families/${f_id} then still reports publication_count 1"
            - "f_ver1 == f_ver0 + 1: the OTA_ONE publication is what advanced the family"
            - "the retry is HTTP 201 and both publications are IN_PARITY with published_family_version pinned to their own read (${pub_one_id} at f_ver0 + 1, ${pub_two_id} at f_ver1 + 1)"
            - "both publications carry published_fee_fingerprint \"ECO_OCC|1|BAG_CHECKED_1:INCLUDED:1:3500\" and publication_count is 2"

      - name: booking_version_advances_on_writes_and_stands_still_on_reads
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[offer-accept-stale-booking].occ_field
          - entities.Booking.common_fields.version
          - state_machines.Booking.disclosure_state
        distinguishing_aspect: "The OCC token is only meaningful if it moves exactly once per write: version is 1 at creation, 2 after the disclosure, 3 after the acknowledgement, unchanged by any number of GETs, and 4 after the cancel."
        test_recipe:
          setup:
            - "DRAFT family ECO_BARE (no attributes, so its fingerprint is \"ECO_BARE|1|\"), channel DIRECT_WEB and PRESALE flight AC581 exist"
            - "booking VERS01 was just created on them and nothing else has touched it"
          setup_api_calls:
            - call: "POST /fare-families"
              payload: { code: "ECO_BARE", name: "Economy Bare", cabin_class: "ECONOMY", base_fare_cents: 12000, bundle_price_cents: 12000, refundability: "NON_REFUNDABLE", change_fee_cents: 7500, boarding_priority_tier: 4 }
              as: MerchandisingAnalyst
              as_user_id: "ma-001"
              captures: { f_bare_id: $.data.id }
            - call: "POST /distribution-channels"
              payload: { channel_code: "DIRECT_WEB", channel_type: "DIRECT", commission_bp: 0, markup_bp: 0, max_ancillary_price_cents: 20000, supported_categories: ["BAGGAGE", "SEAT", "CHANGE", "BOARDING", "ONBOARD"], parity_required: true }
