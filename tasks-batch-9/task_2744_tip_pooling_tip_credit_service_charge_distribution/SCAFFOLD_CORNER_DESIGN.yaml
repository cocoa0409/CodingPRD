      - name: activate_an_already_active_policy_returns_policy_not_draft
        claim_type: invalid_transition
        grounds:
          - state_machines.TipPoolPolicy.DRAFT_to_ACTIVE
          - errors[ERR_POLICY_NOT_DRAFT]
          - validations.priority_11
          - concurrency_rules.policy-activate-stale-location
        distinguishing_aspect: >-
          ACTIVE is not a from-state of activate, and priority 11 sits ahead of the priority-23 OCC
          check, so the replay is ERR_POLICY_NOT_DRAFT even when the caller presents the correct
          current Location.version — the freshly re-read version 2 is deliberately supplied so the
          412 cannot mask the 409.
        test_recipe:
          setup:
            - "Clock moved to 2026-08-10T12:00:00Z; one Texas unit; one policy already activated, which took Location.version from 1 to 2."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T12:00:00Z" }
              as: PayrollAdmin
            - call: "POST /locations"
              payload: { name: "Dallas Unit", state_code: "TX", state_min_wage_cents: 725, cash_wage_cents: 213, tip_credit_enabled: true, cc_fee_policy: "ACTUAL_ONLY", service_charge_treatment: "WAGES" }
              as: PayrollAdmin
              captures: { loc_id: $.data.id, loc_v1: $.data.version }
            - call: "POST /tip-pool-policies"
              payload: { location_id: "${loc_id}", pool_type: "TIPPED_ONLY", contribution_basis: "TIPS_RECEIVED_PCT", share_basis: "HOURS_WEIGHTED_POINTS", cc_fee_pass_through: true }
              as: PayrollAdmin
              captures: { policy_id: $.data.id }
            - call: "POST /tip-pool-policies/${policy_id}/activate"
              payload: { expected_location_version: "${loc_v1}" }
              as: ComplianceOfficer
            - call: "GET /locations/${loc_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { loc_v2: $.data.version }
          trigger:
            - call: "POST /tip-pool-policies/${policy_id}/activate"
              payload: { expected_location_version: "${loc_v2}" }
              as: ComplianceOfficer
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 409 with data.error_id == ERR_POLICY_NOT_DRAFT, and NOT ERR_STALE_LOCATION_VERSION"
            - "GET /tip-pool-policies/${policy_id} reports status == ACTIVE and activated_at == 2026-08-10T12:00:00.000Z"
            - "GET /locations/${loc_id} reports version == 2, unchanged by the rejected call"
            - "GET /tip-pool-policies?location_id=${loc_id}&status=ACTIVE reports total_count == 1"

      - name: approve_and_reopen_an_open_pay_period_return_pay_period_not_computed
        claim_type: precondition_enforcement
        grounds:
          - state_machines.PayPeriod.COMPUTED_to_APPROVED
          - state_machines.PayPeriod.COMPUTED_to_OPEN
          - errors[ERR_PAY_PERIOD_NOT_COMPUTED]
          - validations.priority_13
          - validations.priority_14
        distinguishing_aspect: >-
          One error id guards two different missing preconditions on the same OPEN period: approve
          needs status COMPUTED and reopen needs status in {COMPUTED, APPROVED}. Both are refused
          from OPEN, and neither leaves a fingerprint — computed_by_user_id and approved_by_user_id
          stay null and the period keeps version 1.
        test_recipe:
          setup:
            - "Clock moved to 2026-08-10T12:00:00Z; one Texas unit; one OPEN period 2026-08-03..2026-08-09 with no shifts."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T12:00:00Z" }
              as: PayrollAdmin
            - call: "POST /locations"
              payload: { name: "Dallas Unit", state_code: "TX", state_min_wage_cents: 725, cash_wage_cents: 213, tip_credit_enabled: true, cc_fee_policy: "ACTUAL_ONLY", service_charge_treatment: "WAGES" }
              as: PayrollAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /pay-periods"
              payload: { location_id: "${loc_id}", start_date: "2026-08-03T00:00:00Z", end_date: "2026-08-09T00:00:00Z" }
              as: PayrollPreparer
              captures: { period_id: $.data.id }
          trigger:
            - call: "POST /pay-periods/${period_id}/approve"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "op_comp_1"
              captures: { err_approve: $.data.error_id }
            - call: "POST /pay-periods/${period_id}/reopen"
              payload: { reason: "premature" }
              as: ComplianceOfficer
              as_user_id: "op_comp_1"
              captures: { err_reopen: $.data.error_id }
          assert:
            - "both trigger calls return HTTP 409 with data.error_id == ERR_PAY_PERIOD_NOT_COMPUTED"
            - "GET /pay-periods/${period_id} reports status == OPEN, compute_variant == null, computed_by_user_id == null, approved_by_user_id == null, version == 1"
            - "GET /pay-lines?pay_period_id=${period_id} reports total_count == 0"

      - name: reopen_with_a_pending_correction_returns_pending_correction_exists
        claim_type: precondition_enforcement
        grounds:
          - state_machines.PayPeriod.APPROVED_to_OPEN
          - errors[ERR_PENDING_CORRECTION_EXISTS]
          - validations.priority_15
          - state_machines.BackWageCorrection.PENDING_to_APPLIED
        distinguishing_aspect: >-
          The reopen guard is about unfinished money, not about the period: an APPROVED period with
          one PENDING correction is locked, the very same reopen succeeds the moment that
          correction is APPLIED, and the PayLine version ladder (1 compute, 2 approve, 3 correction
