              as: BillingSpecialist
              captures: { inv_id: "$.data.id" }
            - call: "GET /ocs/accounts/${acct_id}"
              payload: {}
              as: BillingSpecialist
              captures: { acct_v2: "$.data.version" }
            - call: "POST /ocs/consolidated-invoices"
              payload: { account_id: "${acct_id}", period_start: "2026-08-31T23:59:59Z", period_end: "2026-09-01T00:00:00Z", expected_account_version: "${acct_v2}" }
              as: BillingSpecialist
              captures: { err_overlap: "$.data.error_id" }
          assert:
            - "the first attempt is HTTP 422 with data.error_id == ERR_PERIOD_INVALID because period_end 2026-09-30 is after the current instant 2026-09-01"
            - "the second attempt is HTTP 422 with data.error_id == ERR_PERIOD_INVALID because period_end <= period_start"
            - "no ConsolidatedInvoice row exists after those two rejections (GET /ocs/consolidated-invoices?account_id=${acct_id} total_count == 0)"
            - "the third attempt is HTTP 201, so period_end == the current instant boundary is not required - a fully closed August is accepted while it stays DRAFT"
            - "the fourth attempt is HTTP 409 with data.error_id == ERR_INVOICE_PERIOD_OVERLAP: sharing only the instant 2026-08-31T23:59:59Z is an overlap because the intervals are closed"
            - "the overlap rejection wrote nothing: GET /ocs/consolidated-invoices?account_id=${acct_id} still has total_count == 1 and Account.${acct_id}.version is unchanged from ${acct_v2}"

      - name: corner_price_protection_window_blocks_a_reproposal_until_it_lapses
        claim_type: conditional_validation
        grounds:
          - validations[priority=30]
          - errors[ERR_PRICE_PROTECTION_ACTIVE]
          - entities.Account.fields.price_protection_until
          - calculations.green_index_adjustment
        distinguishing_aspect: "Accepting an adjustment arms price_protection_until at accepted_at + price_protection_days (90), so a second proposal with an adjustable 833 bps movement is refused with ERR_PRICE_PROTECTION_ACTIVE until the clock passes that instant, after which the identical request is accepted."
        test_recipe:
          setup:
            - "clock at 2026-08-03T08:00:00Z; one CONSOLIDATED account, green_index_baseline_micros 2000000, price_protection_days 90, price_protection_until null"
            - "the market index is set to 2400000 and the first adjustment is proposed and ACCEPTED by the account's CustomerContact, which re-bases the baseline to 2400000"
          setup_api_calls:
            - call: "POST /ocs/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /ocs/accounts"
              payload: { legal_name: "Northgate Holdings LLC", billing_mode: "CONSOLIDATED", green_index_baseline_micros: 2000000, price_protection_days: 90 }
              as: AccountManager
              captures: { acct_id: "$.data.id" }
            - call: "POST /ocs/_market/set_green_index"
              payload: { index_micros: 2400000 }
              as: BillingSpecialist
            - call: "POST /ocs/price-adjustments"
              payload: { account_id: "${acct_id}", effective_at: "2026-08-04T00:00:00Z" }
              as: BillingSpecialist
              captures: { adj1_id: "$.data.id" }
            - call: "POST /ocs/price-adjustments/${adj1_id}/respond"
              payload: { disposition: "ACCEPT" }
              as: CustomerContact
              as_user_id: "${acct_id}"
            - call: "POST /ocs/_market/set_green_index"
              payload: { index_micros: 2600000 }
              as: BillingSpecialist
          trigger:
            - call: "POST /ocs/price-adjustments"
              payload: { account_id: "${acct_id}", effective_at: "2026-09-01T00:00:00Z" }
              as: BillingSpecialist
              captures: { err_protected: "$.data.error_id" }
            - call: "POST /ocs/_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-01T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /ocs/price-adjustments"
              payload: { account_id: "${acct_id}", effective_at: "2026-11-15T00:00:00Z" }
              as: BillingSpecialist
              captures: { err_still_protected: "$.data.error_id" }
            - call: "POST /ocs/_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-01T08:00:01Z" }
              as: ProgramAdmin
            - call: "POST /ocs/price-adjustments"
              payload: { account_id: "${acct_id}", effective_at: "2026-11-15T00:00:00Z" }
              as: BillingSpecialist
              captures: { adj2_id: "$.data.id" }
          assert:
            - "the accepted first adjustment sets Account.${acct_id}.green_price_factor_bps == 11200, green_index_baseline_micros == 2400000, accepted_at == 2026-08-03T08:00:00Z and price_protection_until == 2026-11-01T08:00:00Z"
            - "the proposal at 2026-08-03 is HTTP 422 with data.error_id == ERR_PRICE_PROTECTION_ACTIVE even though the 833 bps movement is well past the 800 bps threshold"
            - "the proposal at exactly 2026-11-01T08:00:00Z is STILL HTTP 422 - the guard is price_protection_until > current_utc, so equality still protects"
            - "one second later the identical proposal is HTTP 201 with movement_bps == 833 (round_half_up(200000 * 10000 / 2400000)) and adjustment_pct_bps == 500 (round_half_up(833 * 6000 / 10000))"
            - "GET /ocs/price-adjustments?account_id=${acct_id} returns exactly 2 rows - the two refused proposals created nothing"

      - name: corner_invoice_scope_must_match_the_accounts_billing_mode_and_own_the_site
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=35]
          - validations[priority=36]
