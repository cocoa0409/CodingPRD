# =============================================================================
# PRD Benchmark Scaffold — IT Service Management Helpdesk (Expert band)
# §1.0–§1.7. Difficulty design (§1.8) and corner design (§1.9) live in sibling
# files SCAFFOLD_DIFFICULTY_DESIGN.yaml / SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  IT Service Management Helpdesk: ticket/category/priority, SLA/OLA timer,
  assignment group/queue, change request (CAB approval), problem/known error,
  knowledge-base deflection, CSAT, asset linkage

domain_name: itsm-helpdesk
api_prefix: ""

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - derived_field_reconciliation
    - rate_threshold_triggers
    - temporal_windowing

  entity_topology: flat
  # Peer entities linked by foreign keys (Ticket -> Category, Ticket ->
  # AssignmentGroup, Ticket -> Problem, KnownError -> Problem, CsatSurvey ->
  # Ticket, ChangeRequest -> Ticket, CabVote -> ChangeRequest). No deep URL
  # nesting; sub-resources only where a reverse-reachability GET needs them.

  state_machine_shape: cyclic
  # Ticket has a reopen cycle (RESOLVED -> IN_PROGRESS) and an SLA-state axis
  # that evolves independently of the lifecycle axis. ChangeRequest has a CAB
  # branching fork-join (PENDING_CAB -> {APPROVED, REJECTED}). Problem has its
  # own lifecycle.

  relationship_patterns:
    - one_to_many        # AssignmentGroup -> many Tickets; Problem -> many Tickets
    - cross_aggregate    # Ticket transitions depend on Problem / ChangeRequest state
    - polymorphic        # SlaTimer.target_kind references Ticket OR ChangeRequest scope (here Ticket only, but timer is reusable shape)

  role_model: segregation_of_duties
  # Requester opens tickets; Agent works them; ChangeManager raises changes;
  # CabMember votes (but the change's own requester may not approve their own
  # change — SoD); PlatformAdmin configures policies/clock.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  # --- Configuration: Category ---
  - name: Category
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Category display name (e.g. 'Email Outage')."
      - name: default_priority
        type: enum
        source: input
        description: "Priority assigned to tickets opened under this category unless overridden."
        constraints: "one of {P1, P2, P3, P4}"
      - name: sla_policy_id
        type: string
        source: input
        description: "FK -> SlaPolicy.id; the SLA policy whose response/resolve targets apply to tickets in this category."
      - name: default_assignment_group_id
        type: string
        source: input
        description: "FK -> AssignmentGroup.id; queue tickets land in when opened under this category."
      - name: active
        type: boolean
        source: input
        description: "Whether new tickets may be opened under this category."
        default: true

  # --- Configuration: SlaPolicy ---
  - name: SlaPolicy
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Policy display name."
      - name: response_target_minutes
        type: integer
        source: input
        description: "Minutes (business clock) allowed from ticket open until first agent response (assignment->IN_PROGRESS), per priority floor."
        constraints: ">= 1"
      - name: resolve_target_minutes
        type: integer
        source: input
        description: "Minutes (business clock) allowed from ticket open until RESOLVED."
        constraints: ">= 1; must be >= response_target_minutes"
      - name: ola_target_minutes
        type: integer
        source: input
        description: "Minutes allowed for an internal assignment-group hand-off (the OLA leg) once a ticket is routed to a fulfilment group."
        constraints: ">= 1"
      - name: priority_multipliers
        type: object
        source: input
        description: "Map priority->multiplier applied to all three targets; P1 tightest. e.g. {P1:0.25, P2:0.5, P3:1.0, P4:2.0}."

  # --- Configuration: AssignmentGroup ---
  - name: AssignmentGroup
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Queue / group name (e.g. 'Network L2')."
      - name: is_fulfilment_group
        type: boolean
        source: input
        description: "Whether this group is an internal fulfilment group subject to OLA timers (vs the front-line service desk)."
        default: false
      - name: queue_depth
        type: integer
        source: computed
        description: "Count of Tickets currently assigned to this group whose lifecycle_state IN {NEW, ASSIGNED, IN_PROGRESS, PENDING_CHANGE, ON_HOLD}."

  # --- Resource: Ticket (central entity, parallel state axes) ---
  - name: Ticket
    parent: null
    common_fields: true
    fields:
      - name: short_description
        type: string
        source: input
        description: "One-line summary of the incident."
      - name: requester_id
        type: string
        source: input
        description: "Opaque requester identifier (X-User-ID of the Requester who opened the ticket); identity only."
      - name: category_id
        type: string
        source: input
        description: "FK -> Category.id; category the ticket was opened under."
      - name: priority
        type: enum
        source: input
        description: "Effective priority; defaults from Category.default_priority, may be overridden at open and via reprioritize."
        constraints: "one of {P1, P2, P3, P4}"
      - name: assignment_group_id
        type: string
        source: computed
        description: "FK -> AssignmentGroup.id; group the ticket currently sits in. Set from Category.default_assignment_group_id at open, changed by route."
      - name: assignee_user_id
        type: string
        source: input
        description: "Opaque agent identifier (X-User-ID) currently working the ticket; null until first assigned."
        default: null
      - name: lifecycle_state
        type: enum
        source: computed
        description: "Lifecycle axis. one of {NEW, ASSIGNED, IN_PROGRESS, PENDING_CHANGE, ON_HOLD, RESOLVED, CLOSED, CANCELLED}."
      - name: sla_state
        type: enum
        source: computed
        description: "SLA axis, evolves as an INDEPENDENT state dimension alongside lifecycle_state. one of {RUNNING, PAUSED, RESPONSE_BREACHED, RESOLVE_BREACHED, MET}."
      - name: problem_id
        type: string
        source: computed
        description: "FK -> Problem.id; problem this ticket is linked to as a symptom, or null."
        default: null
      - name: deflected
        type: boolean
        source: computed
        description: "True if the ticket was opened with a kb_article_id deflection attempt that the requester accepted (ticket auto-CANCELLED)."
        default: false
      - name: reopen_count
        type: integer
        source: computed
        description: "Number of times the ticket cycled RESOLVED -> IN_PROGRESS."
        default: 0
      - name: opened_at
        type: datetime
        source: computed
        description: "Server clock value at open; SLA targets are measured from here."
      - name: response_due_at
        type: datetime
        source: computed
        description: "opened_at + effective response window; null once first response recorded."
      - name: resolve_due_at
        type: datetime
        source: computed
        description: "opened_at + effective resolve window, extended by accumulated PAUSED time."
      - name: paused_total_minutes
        type: integer
        source: computed
        description: "Accumulated minutes the ticket has spent ON_HOLD/PENDING_CHANGE (SLA clock paused)."
        default: 0
      - name: change_request_id
        type: string
        source: computed
        description: "FK -> ChangeRequest.id; the open change gating this ticket while in PENDING_CHANGE, else null."
        default: null
      - name: asset_id
        type: string
        source: input
        description: "FK -> Asset.id; configuration item the ticket affects, supplied at open or via link; null if none."
        default: null

  # --- Resource: Problem ---
  - name: Problem
    parent: null
    common_fields: true
    fields:
      - name: title
        type: string
        source: input
        description: "Problem statement (root-cause investigation subject)."
      - name: owner_user_id
        type: string
        source: input
        description: "Opaque agent identifier (X-User-ID) owning the problem investigation."
      - name: state
        type: enum
        source: computed
        description: "one of {OPEN, ROOT_CAUSE_IDENTIFIED, KNOWN_ERROR, RESOLVED}."
      - name: linked_ticket_count
        type: integer
        source: computed
        description: "Number of Tickets whose problem_id == this Problem.id and lifecycle_state NOT IN {CLOSED, CANCELLED}."
        default: 0
      - name: asset_id
        type: string
        source: input
        description: "FK -> Asset.id; configuration item identified as the failing component, or null."
        default: null

  # --- Resource: KnownError ---
  - name: KnownError
    parent: null
    common_fields: true
    fields:
      - name: problem_id
        type: string
        source: input
        description: "FK -> Problem.id; the problem this known-error record documents."
      - name: symptom
        type: string
        source: input
        description: "Observable symptom that identifies this known error."
      - name: workaround
        type: string
        source: input
        description: "Documented workaround text."
      - name: published
        type: boolean
        source: computed
        description: "True once promoted to the knowledge base for deflection."
        default: false

  # --- Configuration / content: KbArticle ---
  - name: KbArticle
    parent: null
    common_fields: true
    fields:
      - name: title
        type: string
        source: input
        description: "Article title shown to requesters."
      - name: category_id
        type: string
        source: input
        description: "FK -> Category.id; category this article is suggested for during deflection."
      - name: body
        type: string
        source: input
        description: "Article body."
      - name: view_count
        type: integer
        source: computed
        description: "Times this article was surfaced as a deflection suggestion."
        default: 0
      - name: deflection_count
        type: integer
        source: computed
        description: "Times a requester accepted this article and abandoned ticket creation."
        default: 0

  # --- Resource: ChangeRequest (CAB approval, fork-join) ---
  - name: ChangeRequest
    parent: null
    common_fields: true
    fields:
      - name: title
        type: string
        source: input
        description: "Change summary."
      - name: ticket_id
        type: string
        source: input
        description: "FK -> Ticket.id; the ticket whose resolution this change implements."
      - name: raised_by_user_id
        type: string
        source: input
        description: "Opaque ChangeManager identifier (X-User-ID) who raised the change; SoD: may not cast a CAB vote on this change."
      - name: risk
        type: enum
        source: input
        description: "one of {LOW, MEDIUM, HIGH}; determines required approval quorum."
      - name: state
        type: enum
        source: computed
        description: "one of {DRAFT, PENDING_CAB, APPROVED, REJECTED, IMPLEMENTED, FAILED}."
      - name: required_approvals
        type: integer
        source: computed
        description: "Quorum of distinct APPROVE votes needed; derived from risk at submit (LOW=1, MEDIUM=2, HIGH=3)."
      - name: approve_count
        type: integer
        source: computed
        description: "Distinct CabMember APPROVE votes recorded."
        default: 0
      - name: reject_count
        type: integer
        source: computed
        description: "Distinct CabMember REJECT votes recorded."
        default: 0

  # --- Event: CabVote (append-only) ---
  - name: CabVote
    parent: null
    common_fields: false
    fields:
      - name: change_request_id
        type: string
        source: input
        description: "FK -> ChangeRequest.id; the change being voted on."
      - name: voter_user_id
        type: string
        source: input
        description: "Opaque CabMember identifier (X-User-ID) casting the vote; unique per change (one vote per member)."
      - name: decision
        type: enum
        source: input
        description: "one of {APPROVE, REJECT}."

  # --- Resource: CsatSurvey ---
  - name: CsatSurvey
    parent: null
    common_fields: true
    fields:
      - name: ticket_id
        type: string
        source: input
        description: "FK -> Ticket.id; the resolved ticket this survey scores. Exactly one survey per ticket."
      - name: score
        type: integer
        source: input
        description: "CSAT rating 1..5."
        constraints: "integer 1..5 inclusive"
      - name: comment
        type: string
        source: input
        description: "Optional free-text comment."
        default: null
      - name: counts_toward_index
        type: boolean
        source: computed
        description: "True only if submitted within the CSAT eligibility window after resolution (see ERR_CSAT_WINDOW_CLOSED)."

  # --- Resource: Asset (configuration item) ---
  - name: Asset
    parent: null
    common_fields: true
    fields:
      - name: asset_tag
        type: string
        source: input
        description: "Unique asset tag / CI identifier."
        constraints: "unique across all Assets"
      - name: kind
        type: enum
        source: input
        description: "one of {SERVER, LAPTOP, NETWORK_DEVICE, APPLICATION}."
      - name: status
        type: enum
        source: computed
        description: "one of {OPERATIONAL, DEGRADED, RETIRED}."
      - name: open_incident_count
        type: integer
        source: computed
        description: "Count of Tickets linked to this asset (via Ticket.asset_id) whose lifecycle_state NOT IN {RESOLVED, CLOSED, CANCELLED}."
        default: 0

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  # ---------------------------------------------------------------------------
  # Ticket — lifecycle axis (cyclic: RESOLVED -> IN_PROGRESS reopen loop)
  # ---------------------------------------------------------------------------
  - entity: Ticket
    initial_state: NEW
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: NEW
        to: ASSIGNED
        trigger: "POST /tickets/{id}/route"
        actor: Agent
        preconditions:
          - "Ticket.lifecycle_state == NEW"
          - "target AssignmentGroup exists"
        side_effects:
          - "Ticket.assignment_group_id := target group id"
          - "decrement source group.queue_depth, increment target group.queue_depth (recomputed)"
          - "if target.is_fulfilment_group: start OLA leg — set ola_due_at on the SlaTimer of kind OLA (cross-entity, see SlaTimer machine)"

      - from: NEW
        to: ASSIGNED
        trigger: "POST /tickets/{id}/assign"
        actor: Agent
        preconditions:
          - "Ticket.lifecycle_state == NEW"
        side_effects:
          - "Ticket.assignee_user_id := body.assignee_user_id"

      - from: ASSIGNED
        to: IN_PROGRESS
        trigger: "POST /tickets/{id}/start"
        actor: Agent
        preconditions:
          - "Ticket.lifecycle_state == ASSIGNED"
          - "Ticket.assignee_user_id is not null"
        side_effects:
          - "record first response: set Ticket.response_due_at := null"
          - "evaluate response SLA: if clock_now <= response_due_at then SlaTimer(RESPONSE).met := true else Ticket.sla_state := RESPONSE_BREACHED (calc: sla_clock_eval)"

      - from: IN_PROGRESS
        to: PENDING_CHANGE
        trigger: "POST /tickets/{id}/attach-change"
        actor: Agent
        preconditions:
          - "Ticket.lifecycle_state == IN_PROGRESS"
          - "referenced ChangeRequest exists, ChangeRequest.ticket_id == this ticket, ChangeRequest.state IN {DRAFT, PENDING_CAB}"
        side_effects:
          - "Ticket.change_request_id := change.id"
          - "Ticket.sla_state := PAUSED; record pause_started_at (calc: sla_pause)"

      - from: PENDING_CHANGE
        to: IN_PROGRESS
        trigger: "system: ChangeRequest reaches APPROVED or REJECTED or FAILED (bubble-up from ChangeRequest machine)"
        actor: system
        preconditions:
          - "Ticket.lifecycle_state == PENDING_CHANGE"
          - "Ticket.change_request_id resolved to terminal-or-approved change state"
        side_effects:
          - "resume SLA: Ticket.paused_total_minutes += (clock_now - pause_started_at) in minutes; Ticket.resolve_due_at += that delta; Ticket.sla_state := RUNNING (calc: sla_resume)"
          - "Ticket.change_request_id := null"

      - from: IN_PROGRESS
        to: ON_HOLD
        trigger: "POST /tickets/{id}/hold"
        actor: Agent
        preconditions:
          - "Ticket.lifecycle_state == IN_PROGRESS"
        side_effects:
          - "Ticket.sla_state := PAUSED; record pause_started_at (calc: sla_pause)"

      - from: ON_HOLD
        to: IN_PROGRESS
        trigger: "POST /tickets/{id}/resume"
        actor: Agent
        preconditions:
          - "Ticket.lifecycle_state == ON_HOLD"
        side_effects:
          - "resume SLA: Ticket.paused_total_minutes += elapsed paused minutes; Ticket.resolve_due_at += that delta; Ticket.sla_state := RUNNING (calc: sla_resume)"

      - from: IN_PROGRESS
        to: RESOLVED
        trigger: "POST /tickets/{id}/resolve"
        actor: Agent
        preconditions:
          - "Ticket.lifecycle_state == IN_PROGRESS"
          - "Ticket.change_request_id is null (no open change gating resolution)"
        side_effects:
          - "evaluate resolve SLA: if clock_now <= resolve_due_at then Ticket.sla_state := MET else Ticket.sla_state := RESOLVE_BREACHED (calc: sla_clock_eval)"
          - "set resolved_at := clock_now"
          - "decrement assignment_group.queue_depth (recomputed)"
          - "if Ticket.problem_id set: decrement Problem.linked_ticket_count (recomputed cross-entity)"

      - from: RESOLVED
        to: IN_PROGRESS
        trigger: "POST /tickets/{id}/reopen"
        actor: Requester
        preconditions:
          - "Ticket.lifecycle_state == RESOLVED"
          - "clock_now <= resolved_at + REOPEN_WINDOW_MINUTES (calc: reopen_window)"
          - "X-User-ID == Ticket.requester_id"
        side_effects:
          - "Ticket.reopen_count += 1"
          - "Ticket.sla_state := RUNNING"
          - "Ticket.resolve_due_at := resolved_at adjustment — extend resolve window by RESOLVE_REOPEN_PENALTY_MINUTES * reopen_count (calc: reopen_penalty)"
          - "increment assignment_group.queue_depth (recomputed)"

      - from: RESOLVED
        to: CLOSED
        trigger: "POST /tickets/{id}/close"
        actor: Agent
        preconditions:
          - "Ticket.lifecycle_state == RESOLVED"
          - "clock_now > resolved_at + REOPEN_WINDOW_MINUTES OR a CsatSurvey exists for this ticket"
        side_effects:
          - "lifecycle terminal; survey window for CSAT keyed off resolved_at remains per CSAT rules"
          - "if Ticket.asset_id set: recompute Asset.open_incident_count (cross-entity)"

      - from: NEW
        to: CANCELLED
        trigger: "POST /tickets/{id}/cancel"
        actor: Requester
        preconditions:
          - "Ticket.lifecycle_state == NEW"
          - "X-User-ID == Ticket.requester_id"
        side_effects:
          - "decrement assignment_group.queue_depth (recomputed)"

      - from: NEW
        to: CANCELLED
        trigger: "system: deflection accepted at open (POST /tickets with kb_article_id + accept_deflection=true)"
        actor: system
        preconditions:
          - "open call carried accept_deflection == true and a valid kb_article_id"
        side_effects:
          - "Ticket.deflected := true"
          - "increment KbArticle.deflection_count and KbArticle.view_count (cross-entity)"

  # ---------------------------------------------------------------------------
  # Ticket — SLA axis (PARALLEL dimension; evolves independently of lifecycle)
  # ---------------------------------------------------------------------------
  - entity: SlaTimer
    initial_state: RUNNING
    terminal_states: [MET, RESPONSE_BREACHED, RESOLVE_BREACHED]
    transitions:
      - from: RUNNING
        to: PAUSED
        trigger: "system: parent Ticket enters ON_HOLD or PENDING_CHANGE"
        actor: system
        preconditions:
          - "SlaTimer.state == RUNNING"
        side_effects:
          - "record pause_started_at on the timer"

      - from: PAUSED
        to: RUNNING
        trigger: "system: parent Ticket leaves ON_HOLD/PENDING_CHANGE back to IN_PROGRESS"
        actor: system
        preconditions:
          - "SlaTimer.state == PAUSED"
        side_effects:
          - "accumulate paused minutes; push resolve_due_at out by the paused delta (calc: sla_resume)"

      - from: RUNNING
        to: RESPONSE_BREACHED
        trigger: "POST /tickets/{id}/start when clock_now > response_due_at, OR POST /_clock/advance crossing response_due_at while still awaiting first response"
        actor: system
        preconditions:
          - "no first response recorded yet"
          - "clock_now > response_due_at"
        side_effects:
          - "Ticket.sla_state := RESPONSE_BREACHED"

      - from: RUNNING
        to: RESOLVE_BREACHED
        trigger: "POST /tickets/{id}/resolve when clock_now > resolve_due_at, OR POST /_clock/advance crossing resolve_due_at while unresolved"
        actor: system
        preconditions:
          - "clock_now > resolve_due_at"
          - "Ticket not yet RESOLVED"
        side_effects:
          - "Ticket.sla_state := RESOLVE_BREACHED"

      - from: RUNNING
        to: MET
        trigger: "POST /tickets/{id}/resolve when clock_now <= resolve_due_at"
        actor: system
        preconditions:
          - "clock_now <= resolve_due_at"
        side_effects:
          - "Ticket.sla_state := MET"

  # ---------------------------------------------------------------------------
  # ChangeRequest — CAB approval (branching fork-join)
  # ---------------------------------------------------------------------------
  - entity: ChangeRequest
    initial_state: DRAFT
    terminal_states: [IMPLEMENTED, FAILED]
    transitions:
      - from: DRAFT
        to: PENDING_CAB
        trigger: "POST /change-requests/{id}/submit"
        actor: ChangeManager
        preconditions:
          - "ChangeRequest.state == DRAFT"
          - "X-User-ID == ChangeRequest.raised_by_user_id"
        side_effects:
          - "ChangeRequest.required_approvals := quorum_for_risk(risk) (calc: cab_quorum)"
          - "approve_count := 0, reject_count := 0"

      - from: PENDING_CAB
        to: APPROVED
        trigger: "system: a POST /change-requests/{id}/votes APPROVE makes approve_count >= required_approvals"
        actor: system
        preconditions:
          - "approve_count >= required_approvals after this vote (calc: cab_tally)"
        side_effects:
          - "bubble-up: linked Ticket (ChangeRequest.ticket_id) PENDING_CHANGE -> IN_PROGRESS, SLA resumes (cascade)"

      - from: PENDING_CAB
        to: REJECTED
        trigger: "system: a POST /change-requests/{id}/votes REJECT makes reject_count >= REJECT_VETO_THRESHOLD"
        actor: system
        preconditions:
          - "reject_count >= REJECT_VETO_THRESHOLD after this vote (calc: cab_tally)"
        side_effects:
          - "bubble-up: linked Ticket PENDING_CHANGE -> IN_PROGRESS, SLA resumes (cascade)"

      - from: APPROVED
        to: IMPLEMENTED
        trigger: "POST /change-requests/{id}/implement"
        actor: ChangeManager
        preconditions:
          - "ChangeRequest.state == APPROVED"
        side_effects:
          - "no further ticket effect (ticket already resumed at APPROVED)"

      - from: APPROVED
        to: FAILED
        trigger: "POST /change-requests/{id}/fail"
        actor: ChangeManager
        preconditions:
          - "ChangeRequest.state == APPROVED"
        side_effects:
          - "if linked Ticket.problem_id null: auto-create/link no problem; else no-op"

  # ---------------------------------------------------------------------------
  # Problem — lifecycle + known-error promotion
  # ---------------------------------------------------------------------------
  - entity: Problem
    initial_state: OPEN
    terminal_states: [RESOLVED]
    transitions:
      - from: OPEN
        to: ROOT_CAUSE_IDENTIFIED
        trigger: "POST /problems/{id}/identify-root-cause"
        actor: Agent
        preconditions:
          - "Problem.state == OPEN"
        side_effects:
          - "if body.asset_id present: Problem.asset_id := body.asset_id; recompute Asset.status := DEGRADED (cross-entity)"

      - from: ROOT_CAUSE_IDENTIFIED
        to: KNOWN_ERROR
        trigger: "POST /problems/{id}/known-errors (creates the KnownError + promotes)"
        actor: Agent
        preconditions:
          - "Problem.state == ROOT_CAUSE_IDENTIFIED"
        side_effects:
          - "create KnownError(published := true)"

      - from: KNOWN_ERROR
        to: RESOLVED
        trigger: "POST /problems/{id}/resolve"
        actor: Agent
        preconditions:
          - "Problem.state == KNOWN_ERROR"
          - "Problem.linked_ticket_count == 0 (all symptom tickets closed/cancelled)"
        side_effects:
          - "if Problem.asset_id set and no other OPEN problem references it: recompute Asset.status := OPERATIONAL (cross-entity)"

  # ---------------------------------------------------------------------------
  # Asset — CI status lifecycle
  # ---------------------------------------------------------------------------
  - entity: Asset
    initial_state: OPERATIONAL
    terminal_states: [RETIRED]
    transitions:
      - from: OPERATIONAL
        to: DEGRADED
        trigger: "system: a Problem identifies this asset as failing root cause"
        actor: system
        preconditions:
          - "Asset.status == OPERATIONAL"
        side_effects:
          - "Asset.status := DEGRADED"

      - from: DEGRADED
        to: OPERATIONAL
        trigger: "system: the last OPEN/KNOWN_ERROR Problem referencing this asset resolves"
        actor: system
        preconditions:
          - "no Problem with state IN {OPEN, ROOT_CAUSE_IDENTIFIED, KNOWN_ERROR} references this asset"
        side_effects:
          - "Asset.status := OPERATIONAL"

      - from: OPERATIONAL
        to: RETIRED
        trigger: "POST /assets/{id}/retire"
        actor: PlatformAdmin
        preconditions:
          - "Asset.status == OPERATIONAL"
          - "Asset.open_incident_count == 0"
        side_effects:
          - "Asset.status := RETIRED (terminal)"

# =============================================================================
# §1.2.1 Concurrency Rules (true races only — OCC on parent.version)
# =============================================================================
concurrency_rules:
  - rule_id: vote-stale-change
    parent_entity: ChangeRequest
    write_endpoint: "POST /change-requests/{id}/votes"
    occ_field: "expected_change_request_version"
    description: |
      Casting a CAB vote against a ChangeRequest whose version has advanced
      since the voter last observed it is rejected. A prior vote that the
      current voter had not yet seen may have already driven the change to
      APPROVED/REJECTED (a legitimate quorum-reaching transition under §1.3
      cab_tally); the current voter's view of the change is therefore stale
      and the new vote must not land on a moved tally.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: route-stale-ticket
    parent_entity: Ticket
    write_endpoint: "POST /tickets/{id}/route"
    occ_field: "expected_ticket_version"
    description: |
      Routing a Ticket to an assignment group against a stale ticket version
      is rejected. Another agent may have already routed, reprioritized, or
      moved the ticket's lifecycle, changing its queue and OLA leg; a route
      that carries an outdated version would re-derive queue_depth and OLA
      timers from a superseded snapshot.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  # --- Dual-variant #1 (domain: Ticket SLA) ---
  - name: sla_due_dates
    trigger: "POST /tickets (open) and recomputed on reprioritize"
    algorithm: threshold
    formula: |
      mult = SlaPolicy.priority_multipliers[Ticket.priority]
      effective_response = ceil(SlaPolicy.response_target_minutes * mult)
      effective_resolve  = ceil(SlaPolicy.resolve_target_minutes  * mult)
      response_due_at = opened_at + effective_response minutes
      resolve_due_at  = opened_at + effective_resolve  minutes
      # PROVISIONAL variant uses the category's SlaPolicy as-of open time.
      # FINAL variant (on reprioritize) recomputes both windows from the NEW
      # priority but anchors on the ORIGINAL opened_at (never re-anchors), and
      # ADDS back already-accumulated paused_total_minutes to resolve_due_at.
    input_set: "the single Ticket, its Category.sla_policy_id, its priority multiplier"
    constants:
      ROUNDING: "ceil to whole minute"
    precision: "whole minutes; ceil"
    variants:
      - name: provisional_at_open
        when: "ticket opened"
        difference: "windows from opened_at using priority at open; paused_total_minutes == 0"
      - name: final_on_reprioritize
        when: "POST /tickets/{id}/reprioritize"
        difference: "re-derive windows from NEW priority but keep original opened_at AND re-add paused_total_minutes to resolve_due_at; response_due_at recomputed only if first response not yet recorded"

  # --- Dual-variant #2 (DIFFERENT domain: ChangeRequest CAB tally) ---
  - name: cab_tally
    trigger: "POST /change-requests/{id}/votes"
    algorithm: aggregation
    formula: |
      approve_count = count(CabVote WHERE change_request_id == cr.id AND decision == APPROVE, distinct voter_user_id)
      reject_count  = count(CabVote WHERE change_request_id == cr.id AND decision == REJECT,  distinct voter_user_id)
      if approve_count >= cr.required_approvals: cr.state := APPROVED
      elif reject_count >= REJECT_VETO_THRESHOLD: cr.state := REJECTED
      else: cr.state stays PENDING_CAB
    input_set: "distinct CabVotes on this change; SoD excludes the raiser's vote (raiser may not vote — rejected before tally)"
    constants:
      REJECT_VETO_THRESHOLD: 1
    precision: "integer counts"
    variants:
      - name: optimistic_tally
        when: "evaluating whether a single new APPROVE reaches quorum"
        difference: "evaluate APPROVE quorum FIRST; an APPROVE that reaches required_approvals approves even if a REJECT also pending in the same batch is not yet cast"
      - name: pessimistic_veto
        when: "a REJECT is cast"
        difference: "a single REJECT (veto threshold 1) rejects immediately regardless of approve_count — the veto dominates once present; order of evaluation (approve-first vs reject-first) is pinned: on an APPROVE vote evaluate approve quorum; on a REJECT vote evaluate veto"

  # --- Combinatorial (a): non-linear formula, >=3 inputs (SLA effective window) ---
  - name: sla_effective_resolve_window
    trigger: "computed whenever resolve_due_at is read or recomputed"
    algorithm: threshold
    formula: |
      base = SlaPolicy.resolve_target_minutes
      mult = SlaPolicy.priority_multipliers[Ticket.priority]
      reopen_penalty = RESOLVE_REOPEN_PENALTY_MINUTES * Ticket.reopen_count
      effective = ceil(base * mult) + Ticket.paused_total_minutes + reopen_penalty
      resolve_due_at = opened_at + effective minutes
      # 3 interacting inputs (mult, paused_total_minutes, reopen_count) plus a
      # non-linear ceil on the multiplied base; pause time is ADDED post-ceil,
      # reopen penalty is ADDED post-ceil — order is pinned.
    input_set: "single Ticket + its policy"
    constants:
      RESOLVE_REOPEN_PENALTY_MINUTES: 60
    precision: "ceil(base*mult) computed FIRST, then integer additions; whole minutes"

  # --- Combinatorial (b): nested rounding where order matters (queue load score) ---
  - name: group_load_score
    trigger: "GET /assignment-groups/{id}/load"
    algorithm: weighted_scoring
    formula: |
      # Per-ticket weighted urgency, summed, then a final overall round.
      # PINNED ORDER: round EACH per-ticket term to 2 dp, THEN sum, THEN round
      # the grand total to 1 dp (round_half_up). Summing raw then rounding once
      # yields a different cent/decimal — the per-line round is authoritative.
      for each non-terminal Ticket t in group (lifecycle_state IN {NEW,ASSIGNED,IN_PROGRESS,PENDING_CHANGE,ON_HOLD}):
        w = PRIORITY_WEIGHT[t.priority]              # P1=8, P2=4, P3=2, P4=1
        breach_factor = 1.5 if t.sla_state IN {RESPONSE_BREACHED, RESOLVE_BREACHED} else 1.0
        term = round(w * breach_factor / DIVISOR, 2)  # 2 dp per line
      load_score = round(sum(term over tickets), 1)    # 1 dp grand total
    input_set: "non-terminal Tickets in the group"
    constants:
      DIVISOR: 3
      PRIORITY_WEIGHT: "{P1:8, P2:4, P3:2, P4:1}"
    precision: "per-term round_half_up to 2dp THEN sum THEN round_half_up to 1dp — order pinned"

  # --- Combinatorial (c): circular-looking dependency, evaluation order pinned ---
  - name: csat_index
    trigger: "GET /assignment-groups/{id}/csat"
    algorithm: aggregation
    formula: |
      # response_rate depends on the eligible set; the eligible set depends on
      # counts_toward_index, which depends on resolved_at vs survey created_at,
      # which is fixed at survey time. Evaluation order is PINNED:
      #   1. Determine eligible surveys: CsatSurvey.counts_toward_index == true
      #      (i.e. created within CSAT_WINDOW_MINUTES of the ticket's resolved_at)
      #      for tickets whose assignment_group_id == this group.
      #   2. avg_score = round(sum(score)/count, 2) over eligible surveys.
      #   3. response_rate = round(count(eligible surveys) / count(RESOLVED-or-CLOSED
      #      tickets in group resolved within the window), 4).
      #   4. csat_index = round(avg_score * 20 * response_rate, 2)   # 0..100 scale
      # If denominator in step 3 is 0 -> csat_index = 0.0 (empty-set boundary).
    input_set: "eligible CsatSurveys + resolved/closed Tickets for the group"
    constants:
      CSAT_WINDOW_MINUTES: 2880   # 48h to submit a survey that counts
    precision: "avg 2dp, rate 4dp, index 2dp; round_half_up; steps evaluated in pinned order 1->4"

  # --- supporting calcs referenced by state machines ---
  - name: cab_quorum
    trigger: "POST /change-requests/{id}/submit"
    algorithm: threshold
    formula: |
      required_approvals = {LOW:1, MEDIUM:2, HIGH:3}[ChangeRequest.risk]
    input_set: "the single ChangeRequest.risk"
    constants:
      LOW: 1
      MEDIUM: 2
      HIGH: 3
    precision: "integer"

  - name: sla_clock_eval
    trigger: "POST /tickets/{id}/start (response leg) and POST /tickets/{id}/resolve (resolve leg); also on POST /_clock/advance"
    algorithm: threshold
    formula: |
      # Boundary is INCLUSIVE of the due instant: met iff clock_now <= due_at.
      response: met iff clock_now <= response_due_at ; else RESPONSE_BREACHED
      resolve:  met iff clock_now <= resolve_due_at  ; else RESOLVE_BREACHED
    input_set: "Ticket.response_due_at / resolve_due_at vs server clock"
    constants:
      BOUNDARY: "<= due_at is MET (inclusive); strictly greater is BREACHED"
    precision: "minute granularity; comparison at <= boundary"

  - name: reopen_window
    trigger: "POST /tickets/{id}/reopen and POST /tickets/{id}/close precondition"
    algorithm: threshold
    formula: |
      reopen_allowed iff clock_now <= resolved_at + REOPEN_WINDOW_MINUTES
      # close-before-window without a CsatSurvey is blocked; reopen after window is blocked.
    input_set: "Ticket.resolved_at vs server clock"
    constants:
      REOPEN_WINDOW_MINUTES: 1440   # 24h
    precision: "minute granularity; <= boundary inclusive"

  - name: sla_pause
    trigger: "POST /tickets/{id}/hold and POST /tickets/{id}/attach-change"
    algorithm: interval_merge
    formula: |
      # Begin a paused interval. Record pause_started_at := clock_now on the
      # Ticket's SlaTimer; sla_state := PAUSED. The interval is open until a
      # matching sla_resume closes it. No change to resolve_due_at yet (the
      # credit is applied on resume, not on pause).
      pause_started_at := clock_now
    input_set: "single Ticket + its SlaTimer"
    constants: {}
    precision: "minute granularity"

  - name: sla_resume
    trigger: "POST /tickets/{id}/resume and system bubble-up PENDING_CHANGE -> IN_PROGRESS"
    algorithm: interval_merge
    formula: |
      # Close the open paused interval and credit it back.
      delta_minutes = (clock_now - pause_started_at) in whole minutes
      Ticket.paused_total_minutes += delta_minutes
      Ticket.resolve_due_at       += delta_minutes
      sla_state := RUNNING
      # response_due_at is NOT extended (response leg either already met or
      # already breached before any pause is possible).
    input_set: "single Ticket + its open paused interval"
    constants: {}
    precision: "whole minutes; delta floored to integer minutes"

  - name: reopen_penalty
    trigger: "POST /tickets/{id}/reopen"
    algorithm: threshold
    formula: |
      # Applied at each reopen; identical arithmetic to sla_effective_resolve_window's
      # reopen term, surfaced as its own named rule for the reopen transition.
      Ticket.resolve_due_at += RESOLVE_REOPEN_PENALTY_MINUTES * 1   # one penalty per reopen event
      # cumulative effect after N reopens equals RESOLVE_REOPEN_PENALTY_MINUTES * reopen_count.
    input_set: "single Ticket; its reopen_count after increment"
    constants:
      RESOLVE_REOPEN_PENALTY_MINUTES: 60
    precision: "whole minutes"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all except POST /tickets (anonymous open allowed) and GET reads"

  - priority: 2
    category: auth
    check: "role permitted for this operation per §1.7 RBAC"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all role-restricted endpoints"

  - priority: 3
    category: existence
    check: "path-referenced resources exist, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all /{id} endpoints"

  - priority: 4
    category: existence
    check: "body foreign keys reference existing resources (category_id, sla_policy_id, assignment_group_id, ticket_id, change_request_id, problem_id, asset_id, kb_article_id)"
    error_id: ERR_FK_NOT_FOUND
    http_status: 404
    applies_to: "all create/link endpoints with FK body fields"

  - priority: 5
    category: state
    check: "target resource is in a valid state for the requested transition (lifecycle axis)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"

  - priority: 6
    category: state
    check: "OCC: expected_<parent>_version matches current parent.version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /change-requests/{id}/votes, POST /tickets/{id}/route"

  - priority: 7
    category: business_safety
    check: "SoD: the change's raised_by_user_id may not cast a CAB vote on that change"
    error_id: ERR_SOD_VIOLATION
    http_status: 403
    applies_to: "POST /change-requests/{id}/votes"

  - priority: 8
    category: business_safety
    check: "a CabMember may cast at most one vote per ChangeRequest (no duplicate voter_user_id)"
    error_id: ERR_DUPLICATE_VOTE
    http_status: 409
    applies_to: "POST /change-requests/{id}/votes"

  - priority: 9
    category: business_referential
    check: "ticket may not resolve while a non-terminal ChangeRequest gates it (change_request_id not null)"
    error_id: ERR_CHANGE_GATING_RESOLUTION
    http_status: 409
    applies_to: "POST /tickets/{id}/resolve"

  - priority: 10
    category: business_referential
    check: "Problem may not resolve while linked_ticket_count > 0"
    error_id: ERR_PROBLEM_HAS_OPEN_TICKETS
    http_status: 409
    applies_to: "POST /problems/{id}/resolve"

  - priority: 11
    category: business_referential
    check: "Asset may not retire while open_incident_count > 0"
    error_id: ERR_ASSET_HAS_OPEN_INCIDENTS
    http_status: 409
    applies_to: "POST /assets/{id}/retire"

  - priority: 12
    category: business_temporal
    check: "reopen only within REOPEN_WINDOW_MINUTES of resolved_at"
    error_id: ERR_REOPEN_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /tickets/{id}/reopen"

  - priority: 13
    category: business_temporal
    check: "CSAT survey accepted only within CSAT_WINDOW_MINUTES of resolved_at; later submissions stored with counts_toward_index=false but a survey past the hard window is rejected"
    error_id: ERR_CSAT_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /csat-surveys"

  - priority: 14
    category: business_constraint
    check: "exactly one CsatSurvey per ticket (uniqueness on ticket_id)"
    error_id: ERR_DUPLICATE_SURVEY
    http_status: 409
    applies_to: "POST /csat-surveys"

  - priority: 15
    category: business_constraint
    check: "Asset.asset_tag unique across all assets"
    error_id: ERR_DUPLICATE_ASSET_TAG
    http_status: 409
    applies_to: "POST /assets"

  - priority: 16
    category: business_constraint
    check: "CSAT score is an integer 1..5; priority is one of {P1..P4}; risk one of {LOW,MEDIUM,HIGH}; vote decision one of {APPROVE,REJECT}"
    error_id: ERR_INVALID_FIELD_VALUE
    http_status: 422
    applies_to: "POST /csat-surveys, POST /tickets, POST /change-requests, POST /change-requests/{id}/votes"

  - priority: 17
    category: business_constraint
    check: "required body fields present and well-typed"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all create endpoints"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---------- Category ----------
  - method: POST
    path: "/categories"
    description: "Create a ticket category"
    roles: [PlatformAdmin]
    code: 201
    input: [name, default_priority, sla_policy_id, default_assignment_group_id, "active?"]
    output: Category
    side_effects: []

  - method: GET
    path: "/categories/{id}"
    description: "Get a category"
    roles: [PlatformAdmin, Agent, ChangeManager, CabMember, Requester]
    code: 200
    input: []
    output: Category
    side_effects: []

  - method: GET
    path: "/categories"
    description: "List categories (filterable by sla_policy_id / default_assignment_group_id)"
    roles: [PlatformAdmin, Agent, ChangeManager, CabMember, Requester]
    code: 200
    input: ["sla_policy_id?", "default_assignment_group_id?", "limit?", "offset?"]
    output: Category[]
    side_effects: []

  # ---------- SlaPolicy ----------
  - method: POST
    path: "/sla-policies"
    description: "Create an SLA/OLA policy"
    roles: [PlatformAdmin]
    code: 201
    input: [name, response_target_minutes, resolve_target_minutes, ola_target_minutes, priority_multipliers]
    output: SlaPolicy
    side_effects: []

  - method: GET
    path: "/sla-policies/{id}"
    description: "Get an SLA policy"
    roles: [PlatformAdmin, Agent, ChangeManager, CabMember, Requester]
    code: 200
    input: []
    output: SlaPolicy
    side_effects: []

  # ---------- AssignmentGroup ----------
  - method: POST
    path: "/assignment-groups"
    description: "Create an assignment group / queue"
    roles: [PlatformAdmin]
    code: 201
    input: [name, "is_fulfilment_group?"]
    output: AssignmentGroup
    side_effects: ["queue_depth=0"]

  - method: GET
    path: "/assignment-groups/{id}"
    description: "Get an assignment group (queue_depth recomputed)"
    roles: [PlatformAdmin, Agent, ChangeManager, CabMember, Requester]
    code: 200
    input: []
    output: AssignmentGroup
    side_effects: []

  - method: GET
    path: "/assignment-groups/{id}/load"
    description: "Computed read: weighted group load score (calc group_load_score)"
    roles: [PlatformAdmin, Agent]
    code: 200
    input: []
    output: "{ load_score: number, ticket_count: integer }"
    side_effects: []

  - method: GET
    path: "/assignment-groups/{id}/csat"
    description: "Computed read: group CSAT index (calc csat_index)"
    roles: [PlatformAdmin, Agent]
    code: 200
    input: []
    output: "{ csat_index: number, avg_score: number, response_rate: number, eligible_count: integer }"
    side_effects: []

  # ---------- Ticket ----------
  - method: POST
    path: "/tickets"
    description: "Open a ticket. If kb_article_id + accept_deflection=true, the ticket is opened then auto-CANCELLED (deflected)."
    roles: [Requester, Agent]
    code: 201
    input: [short_description, category_id, "priority?", "kb_article_id?", "accept_deflection?", "asset_id?"]
    output: Ticket
    side_effects:
      - "lifecycle_state=NEW; assignment_group_id := Category.default_assignment_group_id"
      - "priority := body.priority or Category.default_priority"
      - "opened_at := clock_now; compute response_due_at/resolve_due_at (calc sla_due_dates, provisional variant)"
      - "sla_state=RUNNING; increment assignment_group.queue_depth"
      - "if asset_id: link asset, recompute Asset.open_incident_count"
      - "if accept_deflection && kb_article_id: lifecycle_state=CANCELLED, deflected=true, increment KbArticle.deflection_count + view_count"

  - method: GET
    path: "/tickets/{id}"
    description: "Get a ticket"
    roles: [PlatformAdmin, Agent, ChangeManager, CabMember, Requester]
    code: 200
    input: []
    output: Ticket
    side_effects: []

  - method: GET
    path: "/tickets"
    description: "List tickets, filterable by category_id, assignment_group_id, problem_id, asset_id"
    roles: [PlatformAdmin, Agent, ChangeManager, CabMember, Requester]
    code: 200
    input: ["category_id?", "assignment_group_id?", "problem_id?", "asset_id?", "change_request_id?", "requester_id?", "lifecycle_state?", "limit?", "offset?"]
    output: Ticket[]
    side_effects: []

  - method: POST
    path: "/tickets/{id}/route"
    description: "Route ticket to an assignment group (OCC-guarded)"
    roles: [Agent]
    code: 200
    input: [assignment_group_id, expected_ticket_version]
    output: Ticket
    side_effects:
      - "Ticket.assignment_group_id := body.assignment_group_id"
      - "recompute source + target group.queue_depth"
      - "if target.is_fulfilment_group: start OLA leg on SlaTimer(OLA)"
      - "increments Ticket.version by 1"

  - method: POST
    path: "/tickets/{id}/assign"
    description: "Assign an agent to the ticket"
    roles: [Agent]
    code: 200
    input: [assignee_user_id]
    output: Ticket
    side_effects: ["Ticket.assignee_user_id := body.assignee_user_id; lifecycle NEW -> ASSIGNED"]

  - method: POST
    path: "/tickets/{id}/start"
    description: "Agent begins work (records first response, evaluates response SLA)"
    roles: [Agent]
    code: 200
    input: []
    output: Ticket
    side_effects:
      - "lifecycle ASSIGNED -> IN_PROGRESS"
      - "evaluate response SLA (calc sla_clock_eval): set sla_state RESPONSE_BREACHED if past response_due_at, else clear response_due_at"

  - method: POST
    path: "/tickets/{id}/reprioritize"
    description: "Change ticket priority; recompute SLA windows (calc sla_due_dates final variant)"
    roles: [Agent]
    code: 200
    input: [priority]
    output: Ticket
    side_effects:
      - "Ticket.priority := body.priority"
      - "recompute response_due_at (if no first response) + resolve_due_at on original opened_at, re-adding paused_total_minutes (calc sla_due_dates, final variant)"

  - method: POST
    path: "/tickets/{id}/hold"
    description: "Put ticket ON_HOLD (pause SLA)"
    roles: [Agent]
    code: 200
    input: []
    output: Ticket
    side_effects: ["lifecycle IN_PROGRESS -> ON_HOLD; SlaTimer RUNNING -> PAUSED (calc sla_pause)"]

  - method: POST
    path: "/tickets/{id}/resume"
    description: "Resume a held ticket (resume SLA, extend resolve_due_at)"
    roles: [Agent]
    code: 200
    input: []
    output: Ticket
    side_effects: ["lifecycle ON_HOLD -> IN_PROGRESS; SlaTimer PAUSED -> RUNNING; paused_total_minutes += elapsed; resolve_due_at += elapsed (calc sla_resume)"]

  - method: POST
    path: "/tickets/{id}/attach-change"
    description: "Attach a ChangeRequest gating resolution; ticket -> PENDING_CHANGE, SLA pauses"
    roles: [Agent]
    code: 200
    input: [change_request_id]
    output: Ticket
    side_effects:
      - "lifecycle IN_PROGRESS -> PENDING_CHANGE; Ticket.change_request_id := change_request_id"
      - "SlaTimer RUNNING -> PAUSED (calc sla_pause)"

  - method: POST
    path: "/tickets/{id}/link-problem"
    description: "Link ticket to a problem as a symptom"
    roles: [Agent]
    code: 200
    input: [problem_id]
    output: Ticket
    side_effects: ["Ticket.problem_id := problem_id; increment Problem.linked_ticket_count (recomputed)"]

  - method: POST
    path: "/tickets/{id}/resolve"
    description: "Resolve ticket (evaluate resolve SLA)"
    roles: [Agent]
    code: 200
    input: ["resolution_note?"]
    output: Ticket
    side_effects:
      - "lifecycle IN_PROGRESS -> RESOLVED; resolved_at := clock_now"
      - "evaluate resolve SLA (calc sla_clock_eval): sla_state MET or RESOLVE_BREACHED"
      - "decrement assignment_group.queue_depth; if problem_id: decrement Problem.linked_ticket_count"

  - method: POST
    path: "/tickets/{id}/reopen"
    description: "Requester reopens within window; resolve window extended by penalty (calc reopen_penalty)"
    roles: [Requester]
    code: 200
    input: []
    output: Ticket
    side_effects:
      - "lifecycle RESOLVED -> IN_PROGRESS; reopen_count += 1"
      - "resolve_due_at extended by RESOLVE_REOPEN_PENALTY_MINUTES * reopen_count (calc sla_effective_resolve_window); sla_state := RUNNING"
      - "increment assignment_group.queue_depth"

  - method: POST
    path: "/tickets/{id}/close"
    description: "Close a resolved ticket"
    roles: [Agent]
    code: 200
    input: []
    output: Ticket
    side_effects:
      - "lifecycle RESOLVED -> CLOSED"
      - "if asset_id: recompute Asset.open_incident_count"

  - method: POST
    path: "/tickets/{id}/cancel"
    description: "Requester cancels a NEW ticket"
    roles: [Requester]
    code: 200
    input: []
    output: Ticket
    side_effects: ["lifecycle NEW -> CANCELLED; decrement assignment_group.queue_depth"]

  # ---------- Problem ----------
  - method: POST
    path: "/problems"
    description: "Open a problem investigation"
    roles: [Agent]
    code: 201
    input: [title, owner_user_id, "asset_id?"]
    output: Problem
    side_effects: ["state=OPEN; linked_ticket_count=0"]

  - method: GET
    path: "/problems/{id}"
    description: "Get a problem"
    roles: [PlatformAdmin, Agent, ChangeManager, CabMember, Requester]
    code: 200
    input: []
    output: Problem
    side_effects: []

  - method: GET
    path: "/problems"
    description: "List problems, filterable by asset_id"
    roles: [PlatformAdmin, Agent, ChangeManager, CabMember, Requester]
    code: 200
    input: ["asset_id?", "state?", "limit?", "offset?"]
    output: Problem[]
    side_effects: []

  - method: POST
    path: "/problems/{id}/identify-root-cause"
    description: "Advance problem to ROOT_CAUSE_IDENTIFIED; optionally flag failing asset"
    roles: [Agent]
    code: 200
    input: ["asset_id?"]
    output: Problem
    side_effects:
      - "state OPEN -> ROOT_CAUSE_IDENTIFIED"
      - "if asset_id: Problem.asset_id := asset_id; Asset OPERATIONAL -> DEGRADED (cascade)"

  - method: POST
    path: "/problems/{id}/known-errors"
    description: "Create a KnownError record and promote problem to KNOWN_ERROR"
    roles: [Agent]
    code: 201
    input: [symptom, workaround]
    output: KnownError
    side_effects: ["create KnownError(published=true); Problem ROOT_CAUSE_IDENTIFIED -> KNOWN_ERROR"]

  - method: GET
    path: "/problems/{id}/known-errors"
    description: "List known-error records for a problem (FK reverse-reachability)"
    roles: [PlatformAdmin, Agent, ChangeManager, CabMember, Requester]
    code: 200
    input: []
    output: KnownError[]
    side_effects: []

  - method: POST
    path: "/problems/{id}/resolve"
    description: "Resolve a problem (requires zero linked open tickets)"
    roles: [Agent]
    code: 200
    input: []
    output: Problem
    side_effects:
      - "state KNOWN_ERROR -> RESOLVED"
      - "if asset_id and no other open problem references it: Asset DEGRADED -> OPERATIONAL (cascade)"

  # ---------- KnownError ----------
  - method: GET
    path: "/known-errors/{id}"
    description: "Get a known-error record"
    roles: [PlatformAdmin, Agent, ChangeManager, CabMember, Requester]
    code: 200
    input: []
    output: KnownError
    side_effects: []

  # ---------- KbArticle ----------
  - method: POST
    path: "/kb-articles"
    description: "Create a knowledge-base article"
    roles: [PlatformAdmin, Agent]
    code: 201
    input: [title, category_id, body]
    output: KbArticle
    side_effects: ["view_count=0, deflection_count=0"]

  - method: GET
    path: "/kb-articles/{id}"
    description: "Get a KB article"
    roles: [PlatformAdmin, Agent, ChangeManager, CabMember, Requester]
    code: 200
    input: []
    output: KbArticle
    side_effects: []

  - method: GET
    path: "/kb-articles"
    description: "List/search KB articles, filterable by category_id (deflection suggestions)"
    roles: [PlatformAdmin, Agent, ChangeManager, CabMember, Requester]
    code: 200
    input: ["category_id?", "limit?", "offset?"]
    output: KbArticle[]
    side_effects: []

  # ---------- ChangeRequest ----------
  - method: POST
    path: "/change-requests"
    description: "Raise a change request (DRAFT)"
    roles: [ChangeManager]
    code: 201
    input: [title, ticket_id, risk]
    output: ChangeRequest
    side_effects: ["state=DRAFT; raised_by_user_id := X-User-ID"]

  - method: GET
    path: "/change-requests/{id}"
    description: "Get a change request"
    roles: [PlatformAdmin, Agent, ChangeManager, CabMember, Requester]
    code: 200
    input: []
    output: ChangeRequest
    side_effects: []

  - method: GET
    path: "/change-requests"
    description: "List change requests, filterable by ticket_id"
    roles: [PlatformAdmin, Agent, ChangeManager, CabMember, Requester]
    code: 200
    input: ["ticket_id?", "state?", "limit?", "offset?"]
    output: ChangeRequest[]
    side_effects: []

  - method: POST
    path: "/change-requests/{id}/submit"
    description: "Submit change to CAB; derive required_approvals from risk (calc cab_quorum)"
    roles: [ChangeManager]
    code: 200
    input: []
    output: ChangeRequest
    side_effects: ["state DRAFT -> PENDING_CAB; required_approvals := quorum_for_risk(risk)"]

  - method: POST
    path: "/change-requests/{id}/votes"
    description: "Cast a CAB vote (OCC-guarded; SoD + one-vote-per-member enforced; may auto-approve/reject)"
    roles: [CabMember]
    code: 201
    input: [decision, expected_change_request_version]
    output: CabVote
    side_effects:
      - "append CabVote; recompute approve_count/reject_count (calc cab_tally)"
      - "if quorum reached: ChangeRequest PENDING_CAB -> APPROVED/REJECTED; bubble-up linked Ticket PENDING_CHANGE -> IN_PROGRESS, resume SLA (cascade)"
      - "increments ChangeRequest.version by 1"

  - method: GET
    path: "/change-requests/{id}/votes"
    description: "List votes for a change request (FK reverse-reachability for CabVote)"
    roles: [PlatformAdmin, Agent, ChangeManager, CabMember, Requester]
    code: 200
    input: []
    output: CabVote[]
    side_effects: []

  - method: POST
    path: "/change-requests/{id}/implement"
    description: "Mark an approved change implemented"
    roles: [ChangeManager]
    code: 200
    input: []
    output: ChangeRequest
    side_effects: ["state APPROVED -> IMPLEMENTED"]

  - method: POST
    path: "/change-requests/{id}/fail"
    description: "Mark an approved change failed"
    roles: [ChangeManager]
    code: 200
    input: []
    output: ChangeRequest
    side_effects: ["state APPROVED -> FAILED"]

  # ---------- CsatSurvey ----------
  - method: POST
    path: "/csat-surveys"
    description: "Submit a CSAT survey for a resolved ticket (window-gated)"
    roles: [Requester]
    code: 201
    input: [ticket_id, score, "comment?"]
    output: CsatSurvey
    side_effects:
      - "counts_toward_index := (clock_now <= ticket.resolved_at + CSAT_WINDOW_MINUTES)"

  - method: GET
    path: "/csat-surveys/{id}"
    description: "Get a CSAT survey"
    roles: [PlatformAdmin, Agent, Requester]
    code: 200
    input: []
    output: CsatSurvey
    side_effects: []

  - method: GET
    path: "/csat-surveys"
    description: "List CSAT surveys, filterable by ticket_id (FK reverse-reachability)"
    roles: [PlatformAdmin, Agent, Requester]
    code: 200
    input: ["ticket_id?", "limit?", "offset?"]
    output: CsatSurvey[]
    side_effects: []

  # ---------- Asset ----------
  - method: POST
    path: "/assets"
    description: "Register a configuration item / asset"
    roles: [PlatformAdmin]
    code: 201
    input: [asset_tag, kind]
    output: Asset
    side_effects: ["status=OPERATIONAL; open_incident_count=0"]

  - method: GET
    path: "/assets/{id}"
    description: "Get an asset"
    roles: [PlatformAdmin, Agent, ChangeManager, CabMember, Requester]
    code: 200
    input: []
    output: Asset
    side_effects: []

  - method: GET
    path: "/assets/{id}/tickets"
    description: "List tickets linked to an asset (FK reverse-reachability for Ticket.asset_id)"
    roles: [PlatformAdmin, Agent, ChangeManager, CabMember, Requester]
    code: 200
    input: []
    output: Ticket[]
    side_effects: []

  - method: POST
    path: "/assets/{id}/retire"
    description: "Retire an asset with no open incidents"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Asset
    side_effects: ["status OPERATIONAL -> RETIRED"]

  # ---------- Test-driving clock ----------
  - method: POST
    path: "/_clock/set"
    description: "Test-driving: set the server clock to an absolute UTC instant"
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ now: string }"
    side_effects: ["server clock := to_iso8601 (does not retro-fire breaches; breaches evaluated on next transition or advance)"]

  - method: POST
    path: "/_clock/advance"
    description: "Test-driving: advance the server clock by N minutes; fires SLA breach transitions for tickets whose due instant is crossed"
    roles: [PlatformAdmin]
    code: 200
    input: [minutes]
    output: "{ now: string, breached_ticket_ids: string[] }"
    side_effects:
      - "server clock += minutes"
      - "for each RUNNING ticket whose response_due_at crossed without first response: sla_state := RESPONSE_BREACHED"
      - "for each RUNNING ticket whose resolve_due_at crossed while unresolved: sla_state := RESOLVE_BREACHED"

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_VALIDATION
    http: 400
    condition: "Required body field missing or malformed request"
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing X-User-Role / X-User-ID on an authenticated endpoint"
  - id: ERR_FORBIDDEN
    http: 403
    condition: "Role not permitted for this operation"
  - id: ERR_SOD_VIOLATION
    http: 403
    condition: "Change raiser attempted to vote on their own change (segregation of duties)"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Path-referenced resource does not exist"
  - id: ERR_FK_NOT_FOUND
    http: 404
    condition: "Body foreign-key reference (category_id/sla_policy_id/assignment_group_id/ticket_id/change_request_id/problem_id/asset_id/kb_article_id) does not resolve"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Resource not in a valid state for the requested lifecycle transition"
  - id: ERR_CHANGE_GATING_RESOLUTION
    http: 409
    condition: "Ticket cannot resolve while a non-terminal ChangeRequest gates it"
  - id: ERR_PROBLEM_HAS_OPEN_TICKETS
    http: 409
    condition: "Problem cannot resolve while linked_ticket_count > 0"
  - id: ERR_ASSET_HAS_OPEN_INCIDENTS
    http: 409
    condition: "Asset cannot retire while open_incident_count > 0"
  - id: ERR_REOPEN_WINDOW_CLOSED
    http: 409
    condition: "Reopen attempted after REOPEN_WINDOW_MINUTES past resolved_at"
  - id: ERR_CSAT_WINDOW_CLOSED
    http: 409
    condition: "CSAT survey submitted past the hard CSAT window after resolved_at"
  - id: ERR_DUPLICATE_SURVEY
    http: 409
    condition: "A CsatSurvey already exists for this ticket"
  - id: ERR_DUPLICATE_VOTE
    http: 409
    condition: "This CabMember already voted on this change request"
  - id: ERR_DUPLICATE_ASSET_TAG
    http: 409
    condition: "asset_tag already exists"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_<parent>_version does not match current parent version (OCC)"
  - id: ERR_INVALID_FIELD_VALUE
    http: 422
    condition: "Enum/range violation: bad priority, risk, decision, or CSAT score out of 1..5"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Requester
    description: "End user who opens tickets, accepts KB deflection, reopens/cancels own tickets, submits CSAT."
    identity: opaque
    exclusive_operations:
      - "POST /tickets/{id}/reopen — reopen own resolved ticket"
      - "POST /tickets/{id}/cancel — cancel own NEW ticket"
      - "POST /csat-surveys — submit CSAT for own resolved ticket"
    shared_operations:
      - "POST /tickets — open a ticket (shared with Agent)"
      - "GET reads on tickets/categories/problems/kb-articles/change-requests/assets"

  - name: Agent
    description: "Service-desk / fulfilment agent: works tickets, manages problems, known errors, KB."
    identity: opaque
    exclusive_operations:
      - "POST /tickets/{id}/route — route ticket (OCC)"
      - "POST /tickets/{id}/assign — assign agent"
      - "POST /tickets/{id}/start — begin work"
      - "POST /tickets/{id}/reprioritize — change priority"
      - "POST /tickets/{id}/hold — hold"
      - "POST /tickets/{id}/resume — resume"
      - "POST /tickets/{id}/attach-change — attach change"
      - "POST /tickets/{id}/link-problem — link problem"
      - "POST /tickets/{id}/resolve — resolve"
      - "POST /tickets/{id}/close — close"
      - "POST /problems — open problem"
      - "POST /problems/{id}/identify-root-cause"
      - "POST /problems/{id}/known-errors"
      - "POST /problems/{id}/resolve"
    shared_operations:
      - "POST /tickets — open a ticket (shared with Requester)"
      - "POST /kb-articles — author KB (shared with PlatformAdmin)"
      - "GET /assignment-groups/{id}/load, GET /assignment-groups/{id}/csat (shared with PlatformAdmin)"

  - name: ChangeManager
    description: "Raises and drives change requests through CAB; implements/fails approved changes."
    identity: opaque
    exclusive_operations:
      - "POST /change-requests — raise change"
      - "POST /change-requests/{id}/submit — submit to CAB"
      - "POST /change-requests/{id}/implement"
      - "POST /change-requests/{id}/fail"
    shared_operations:
      - "GET reads on change-requests / tickets / problems"

  - name: CabMember
    description: "Change Advisory Board member who votes on submitted changes. SoD: cannot vote on a change they raised."
    identity: opaque
    exclusive_operations:
      - "POST /change-requests/{id}/votes — cast a CAB vote (OCC, SoD-checked)"
    shared_operations:
      - "GET reads on change-requests / tickets"

  - name: PlatformAdmin
    description: "Configures categories, SLA policies, assignment groups, assets; controls the test clock."
    identity: opaque
    exclusive_operations:
      - "POST /categories"
      - "POST /sla-policies"
      - "POST /assignment-groups"
      - "POST /assets"
      - "POST /assets/{id}/retire"
      - "POST /_clock/set"
      - "POST /_clock/advance"
    shared_operations:
      - "POST /kb-articles (shared with Agent)"
      - "GET /assignment-groups/{id}/load, GET /assignment-groups/{id}/csat (shared with Agent)"
