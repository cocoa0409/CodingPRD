          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; fund and Piney Creek Tract."
            - "Stand PC-01 INVENTORIED at 4647.12 tons; version 2 is captured at cruise close."
            - "A first 1000.00-ton block advances the stand to version 3, leaving 3647.12 available and version 2 stale."
            - "The oversized request asks for 9000.00 tons, far beyond any available figure the stand ever had."
          setup_api_calls:
            - call: "POST /timberland/_clock/set_current_utc"
              payload: {current_utc: "2026-08-01T00:00:00Z"}
              as: FundAdmin
