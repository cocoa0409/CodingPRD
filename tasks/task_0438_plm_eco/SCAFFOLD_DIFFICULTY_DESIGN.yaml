  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: quorum_inclusive_lower_bound
        grounds:
          - calculations.eco_approval_quorum
          - entities.EngineeringChangeOrder.fields.required_approvals
          - state_machines.EngineeringChangeOrder.IN_APPROVAL_to_APPROVED
        distinguishing_aspect: |
          With required_approvals=2: after exactly 1 approval the ECO stays IN_APPROVAL
          (1 >= 2 is false); after the 2nd approval it becomes APPROVED (2 >= 2 is true) —
          boundary is >= not >, on the approval-count metric via the approve endpoint.
