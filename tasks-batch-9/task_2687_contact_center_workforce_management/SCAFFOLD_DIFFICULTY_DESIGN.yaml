      - name: vto_notice_beats_coverage_breach
        grounds:
          - validations.priority_140
          - validations.priority_180
          - errors.ERR_VTO_NOTICE_TOO_SHORT
          - errors.ERR_VTO_WOULD_BREACH_COVERAGE
          - entities.LaborAgreement.fields.vto_min_notice_hours
          - entities.ScheduleShift.fields.vto_hours
        distinguishing_aspect: |
          At a logical clock of 2026-09-07T00:00:00Z the shift starts in 8 hours, under the
          12-hour VTO notice floor, and the 7.0 released hours would also shorten end_at to 09:00
          and push the 09:00 and 09:30 intervals from COVERED to SHORT. The temporal rule at
          priority 140 must beat the coverage rule at priority 180, and neither the shift window
