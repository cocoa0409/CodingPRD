      - name: mitigation_revision_cycle_bounded_at_two_rounds
        grounds:
          - state_machines.MitigationProject.SUBMITTED_to_REVISION_REQUESTED
          - state_machines.MitigationProject.REVISION_REQUESTED_to_SUBMITTED
          - entities.MitigationProject.fields.review_round
          - errors[ERR_REVIEW_ROUND_LIMIT]
        distinguishing_aspect: |
          MitigationProject cycles SUBMITTED -> REVISION_REQUESTED -> SUBMITTED an unbounded number of
          times as far as the edge list is concerned, but review_round accumulates monotonically across
          the loop and is NOT reset by resubmission, so the third REQUEST_REVISION is refused with
          ERR_REVIEW_ROUND_LIMIT while the row remains SUBMITTED — a loop with a counter-based exit that
          a plain cyclic machine cannot express.
        test_recipe:
          setup:
            - "Circuit DELTA is NON_HFTD with overhead_miles 4.0, equipment_condition_index 90, risk_posture NORMAL (no index exists), so mitigation writes are unblocked."
            - "Project MP-UG-1 is an UNDERGROUNDING package for 3.0 miles in plan year 2026."
            - "Reviewer reviewer_1 has already sent the project back twice, so review_round == 2 and the row has been resubmitted and is SUBMITTED again."
          setup_api_calls:
            - call: "POST /circuits"
              payload: { circuit_code: "DELTA", district_code: "D-WEST", hftd_tier: "NON_HFTD", overhead_miles: 4.0, equipment_condition_index: 90, inspection_cycle_months: 36, last_inspection_completed_at: "2026-05-01T00:00:00Z", fast_trip_enabled: false }
              as: GridPlanner
              captures: { delta_id: $.data.id }
            - call: "POST /mitigation-projects"
              payload: { project_code: "MP-UG-1", circuit_id: "${delta_id}", program_type: "UNDERGROUNDING", plan_year: 2026, planned_miles: 3.0, unit_cost_per_mile_cents: 9000000 }
              as: GridPlanner
              captures: { mp_ug_id: $.data.id }
            - call: "POST /mitigation-projects/${mp_ug_id}/submit"
              payload: {}
              as: GridPlanner
            - call: "POST /mitigation-projects/${mp_ug_id}/review"
              payload: { decision: "REQUEST_REVISION", review_note: "round 1 - cost basis unclear" }
              as: RegulatoryReviewer
              as_user_id: "reviewer_1"
            - call: "POST /mitigation-projects/${mp_ug_id}/submit"
              payload: {}
              as: GridPlanner
            - call: "POST /mitigation-projects/${mp_ug_id}/review"
              payload: { decision: "REQUEST_REVISION", review_note: "round 2 - scope still unclear" }
              as: RegulatoryReviewer
              as_user_id: "reviewer_1"
            - call: "POST /mitigation-projects/${mp_ug_id}/submit"
              payload: {}
              as: GridPlanner
          trigger:
            - call: "POST /mitigation-projects/${mp_ug_id}/review"
              payload: { decision: "REQUEST_REVISION", review_note: "round 3 attempt" }
              as: RegulatoryReviewer
              as_user_id: "reviewer_1"
          assert:
            - "HTTP 422 with data.error_id == ERR_REVIEW_ROUND_LIMIT"
            - "MitigationProject.${mp_ug_id}.status == SUBMITTED (unchanged by the refused decision)"
            - "MitigationProject.${mp_ug_id}.review_round == 2 (not reset by either resubmission and not incremented by the refusal)"
            - "MitigationProject.${mp_ug_id}.last_revision_reviewer_user_id == reviewer_1"
            - "MitigationProject.${mp_ug_id}.last_review_note == 'round 2 - scope still unclear'"
            - "MitigationProject.${mp_ug_id}.risk_reduction_score == 1.50 and budget_cents == 27000000"

      - name: plan_filing_fork_join_requires_both_tracks_cleared
        grounds:
          - state_machines.WildfirePlanFiling.SUBMITTED_to_SUBMITTED
          - state_machines.WildfirePlanFiling.SUBMITTED_to_APPROVED
          - state_machines.WildfirePlanFiling.SUBMITTED_to_DEFICIENCY_ISSUED
          - entities.WildfirePlanFiling.fields.safety_review_state
          - entities.WildfirePlanFiling.fields.fiscal_review_state
        distinguishing_aspect: |
          SUBMITTED forks into two independent review tracks whose JOIN into APPROVED fires only on the
          SECOND CLEAR: the first CLEAR leaves status SUBMITTED with one track CLEARED and the other
          PENDING, and a DEFICIENT decision on either track short-circuits to DEFICIENCY_ISSUED with a
          different side-effect set (deficiency_round_count incremented, last_deficiency_note written)
          while the sibling track keeps its own state — behaviour no single linear chain reproduces.
        test_recipe:
          setup:
            - "Circuit DELTA is NON_HFTD with overhead_miles 4.0 and one APPROVED UNDERGROUNDING project for plan year 2026, so the filing has a qualifying project."
            - "Filing WMP-2026 for plan_year 2026 exists and has been submitted once, then sent back DEFICIENT on the fiscal track by reviewer_fiscal, then resubmitted — so deficiency_round_count == 1 and both tracks are PENDING again."
          setup_api_calls:
            - call: "POST /circuits"
              payload: { circuit_code: "DELTA", district_code: "D-WEST", hftd_tier: "NON_HFTD", overhead_miles: 4.0, equipment_condition_index: 90, inspection_cycle_months: 36, last_inspection_completed_at: "2026-05-01T00:00:00Z", fast_trip_enabled: false }
              as: GridPlanner
              captures: { delta_id: $.data.id }
            - call: "POST /mitigation-projects"
              payload: { project_code: "MP-UG-1", circuit_id: "${delta_id}", program_type: "UNDERGROUNDING", plan_year: 2026, planned_miles: 3.0, unit_cost_per_mile_cents: 9000000 }
              as: GridPlanner
              captures: { mp_ug_id: $.data.id }
            - call: "POST /mitigation-projects/${mp_ug_id}/submit"
              payload: {}
              as: GridPlanner
            - call: "POST /mitigation-projects/${mp_ug_id}/review"
              payload: { decision: "APPROVE", review_note: "approved" }
              as: RegulatoryReviewer
              as_user_id: "reviewer_1"
            - call: "POST /plan-filings"
              payload: { filing_code: "WMP-2026", plan_year: 2026 }
              as: GridPlanner
              captures: { filing_id: $.data.id }
            - call: "POST /plan-filings/${filing_id}/submit"
              payload: {}
              as: GridPlanner
            - call: "POST /plan-filings/${filing_id}/reviews"
              payload: { review_track: "FISCAL", decision: "DEFICIENT", deficiency_note: "cost tables missing" }
              as: RegulatoryReviewer
              as_user_id: "reviewer_fiscal"
            - call: "POST /plan-filings/${filing_id}/submit"
              payload: {}
              as: GridPlanner
          trigger:
            - call: "POST /plan-filings/${filing_id}/reviews"
              payload: { review_track: "SAFETY", decision: "CLEAR" }
              as: RegulatoryReviewer
              as_user_id: "reviewer_safety"
            - call: "POST /plan-filings/${filing_id}/reviews"
              payload: { review_track: "FISCAL", decision: "CLEAR" }
              as: RegulatoryReviewer
              as_user_id: "reviewer_fiscal"
          assert:
            - "After the first (SAFETY) CLEAR: WildfirePlanFiling.${filing_id}.status == SUBMITTED, safety_review_state == CLEARED, fiscal_review_state == PENDING, safety_reviewer_user_id == reviewer_safety"
            - "After the second (FISCAL) CLEAR: WildfirePlanFiling.${filing_id}.status == APPROVED, safety_review_state == CLEARED, fiscal_review_state == CLEARED, fiscal_reviewer_user_id == reviewer_fiscal"
            - "WildfirePlanFiling.${filing_id}.deficiency_round_count == 1 (carried across the resubmission, not reset)"
            - "WildfirePlanFiling.${filing_id}.last_deficiency_note == 'cost tables missing'"
            - "WildfirePlanFiling.${filing_id}.qualifying_project_count == 1"
            - "WildfirePlanFiling.${filing_id}.underground_miles_reported == 0.0 (the project is APPROVED but has recorded no miles)"
            - "WildfirePlanFiling.${filing_id}.compliance_score == 0.00"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: deenergize_locks_posture_and_suspends_mitigation_execution
        grounds:
          - state_machines.PSPSEvent.ARMED_to_ACTIVE
          - state_machines.Circuit.DE_ENERGIZATION_PENDING_to_DE_ENERGIZED
          - state_machines.MitigationProject.IN_EXECUTION_to_SUSPENDED
          - calculations.circuit_risk_posture
          - entities.Circuit.fields.risk_posture
        distinguishing_aspect: |
          A single POST /psps-events/{id}/de-energize propagates four levels deep from a PSPSEvent trigger:
          event ARMED -> ACTIVE (hop 1) -> each CONFIRMED-scoped Circuit DE_ENERGIZATION_PENDING ->
          DE_ENERGIZED (hop 2) -> each of those circuits' risk_posture forced to LOCKED (hop 3) -> every
          IN_EXECUTION MitigationProject on those circuits moved to SUSPENDED (hop 4), including a project
          on the DOWNSTREAM-only circuit BRAVO that the trigger never names.
        test_recipe:
          setup:
            - "The ALPHA -> BRAVO -> CHARLIE chain with the five customers and the R5 FORECAST index for 2026-08-15 (fpi_score 85.93)."
            - "A FAST_TRIP_SETTING project on BRAVO for 3.0 miles has been approved and partially recorded (1.0 mile), so it is IN_EXECUTION and, because FAST_TRIP_SETTING carries no mileage, no hardened_fraction changes."
            - "Event EV-1 is scoped over all three circuits, the advance and imminent batches are dispatched, and the event is ARMED; every circuit sits in DE_ENERGIZATION_PENDING with risk_posture LOCKED."
            - "Logical clock at 2026-08-15T19:00:00Z."
