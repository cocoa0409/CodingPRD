# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Adult Day Health & PACE Program — Expert tier
# 9 rules × >= 2 instances = 18 instances
# Standard enroll chain (referenced by many instances):
#   POST /pace/programs                              (ProgramAdmin)  -> prog
#   POST /_clock/set_current_utc                     (ProgramAdmin)
#   POST /pace/participants                          (IntakeCoordinator) -> p   [version 1]
#   POST /pace/loc-assessments                       (IntakeCoordinator) -> loc
#   POST /pace/loc-assessments/{loc}/certify         (MedicalDirector) -> p ELIGIBLE [version 2]
#   POST /pace/care-plans                            (IntakeCoordinator) -> cp
#   POST /pace/care-plans/{cp}/goals                 (IntakeCoordinator)
#   POST /pace/care-plans/{cp}/sign x{RN,SW,MEDICAL_DIRECTOR} (mixed roles)
#   POST /pace/care-plans/{cp}/submit                (IntakeCoordinator) -> IN_REVIEW
#   POST /pace/care-plans/{cp}/activate              (MedicalDirector) -> ACTIVE; p [version 3]
#   POST /pace/participants/{p}/enroll               (IntakeCoordinator) -> p ENROLLED [version 4]
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: capitation_full_month_vs_daily_diverge
        grounds:
          - calculations.capitation_amount
          - state_machines.CapitationPayment.DRAFT_to_FINALIZED
          - entities.CapitationPayment.fields.total_billed_cents
        distinguishing_aspect: |
          On the CapitationPayment domain, the same Program rates + same dual participant + same fully-covered
          month produce total_billed_cents 630000 under FULL_MONTH (factor 1) but 420000 under DAILY with
          covered_days 20 of 30 (factor 20/30) — two valid algorithms, divergent results on the billing entity.
        test_recipe:
          setup:
            - "Program: medicaid_monthly_rate_cents 350000, medicare_monthly_rate_cents 280000, lock_in_days 30, loc_validity_days 365, capacity 50."
            - "Dual-eligible participant ENROLLED effective 2026-06-01; clock pinned 2026-06-15."
            - "Two DRAFT CapitationPayments for 2026-06-01: one FULL_MONTH, one DAILY. (Each is its own participant to keep service_month unique per participant.)"
          setup_api_calls:
            - call: "POST /pace/programs"
              payload: { name: "Center A", state_code: "CA", daily_census_capacity: 50, max_roster: 10, medicaid_monthly_rate_cents: 350000, medicare_monthly_rate_cents: 280000, lock_in_days: 30, loc_validity_days: 365 }
              as: ProgramAdmin
              captures: { prog: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T12:00:00Z" }
              as: ProgramAdmin
            # participant 1 (FULL_MONTH)
            - call: "POST /pace/participants"
              payload: { program_id: "${prog}", full_name: "Pat One", date_of_birth: "1955-01-01", dual_eligible: true }
              as: IntakeCoordinator
              captures: { p1: $.data.id }
            - call: "POST /pace/loc-assessments"
              payload: { participant_id: "${p1}", nf_score: 75, assessed_on: "2026-05-01" }
              as: IntakeCoordinator
              captures: { loc1: $.data.id }
            - call: "POST /pace/loc-assessments/${loc1}/certify"
              payload: {}
              as: MedicalDirector
            - call: "POST /pace/care-plans"
              payload: { participant_id: "${p1}" }
              as: IntakeCoordinator
              captures: { cp1: $.data.id }
            - call: "POST /pace/care-plans/${cp1}/goals"
              payload: { discipline: "RN", description: "Mobility" }
              as: IntakeCoordinator
            - call: "POST /pace/care-plans/${cp1}/sign"
              payload: { discipline: "RN" }
              as: NurseStaff
            - call: "POST /pace/care-plans/${cp1}/sign"
              payload: { discipline: "SW" }
              as: IntakeCoordinator
            - call: "POST /pace/care-plans/${cp1}/sign"
              payload: { discipline: "MEDICAL_DIRECTOR" }
              as: MedicalDirector
            - call: "POST /pace/care-plans/${cp1}/submit"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /pace/care-plans/${cp1}/activate"
              payload: {}
              as: MedicalDirector
            - call: "POST /pace/participants/${p1}/enroll"
              payload: { enrollment_effective_date: "2026-06-01" }
              as: IntakeCoordinator
            # participant 2 (DAILY)
            - call: "POST /pace/participants"
              payload: { program_id: "${prog}", full_name: "Pat Two", date_of_birth: "1955-01-01", dual_eligible: true }
              as: IntakeCoordinator
              captures: { p2: $.data.id }
            - call: "POST /pace/loc-assessments"
              payload: { participant_id: "${p2}", nf_score: 75, assessed_on: "2026-05-01" }
              as: IntakeCoordinator
              captures: { loc2: $.data.id }
            - call: "POST /pace/loc-assessments/${loc2}/certify"
              payload: {}
              as: MedicalDirector
            - call: "POST /pace/care-plans"
              payload: { participant_id: "${p2}" }
              as: IntakeCoordinator
              captures: { cp2: $.data.id }
            - call: "POST /pace/care-plans/${cp2}/goals"
              payload: { discipline: "RN", description: "Mobility" }
              as: IntakeCoordinator
            - call: "POST /pace/care-plans/${cp2}/sign"
              payload: { discipline: "RN" }
              as: NurseStaff
            - call: "POST /pace/care-plans/${cp2}/sign"
              payload: { discipline: "SW" }
              as: IntakeCoordinator
            - call: "POST /pace/care-plans/${cp2}/sign"
              payload: { discipline: "MEDICAL_DIRECTOR" }
              as: MedicalDirector
            - call: "POST /pace/care-plans/${cp2}/submit"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /pace/care-plans/${cp2}/activate"
              payload: {}
              as: MedicalDirector
            - call: "POST /pace/participants/${p2}/enroll"
              payload: { enrollment_effective_date: "2026-06-01" }
              as: IntakeCoordinator
              captures: { p2_ver: $.data.version }
            # DAILY participant 2 disenrolls effective 2026-06-21 (mid-month allowed) so covered_days = 20
            # (days d with d < 2026-06-21, i.e. Jun 1..20 inclusive).
            - call: "POST /pace/disenrollment-requests"
              payload: { participant_id: "${p2}", kind: "VOLUNTARY", reason_code: "MOVED", requested_effective_date: "2026-06-21" }
              as: IntakeCoordinator
              captures: { dr2: $.data.id }
            - call: "POST /pace/disenrollment-requests/${dr2}/approve"
              payload: {}
              as: MedicalDirector
            - call: "GET /pace/participants/${p2}"
              payload: {}
              as: BillingSpecialist
              captures: { p2_disv: $.data.version }
            - call: "POST /pace/disenrollment-requests/${dr2}/finalize"
              payload: { expected_participant_version: "${p2_disv}" }
              as: BillingSpecialist
          trigger:
            - call: "POST /pace/capitation-payments"
              payload: { participant_id: "${p1}", service_month: "2026-06-01", proration_mode: "FULL_MONTH" }
              as: BillingSpecialist
              captures: { pay1: $.data.id }
            - call: "GET /pace/participants/${p1}"
              payload: {}
              as: BillingSpecialist
              captures: { p1_ver: $.data.version }
            - call: "POST /pace/capitation-payments/${pay1}/finalize"
              payload: { expected_participant_version: "${p1_ver}" }
              as: BillingSpecialist
              captures: { pay1_total: $.data.total_billed_cents }
            - call: "POST /pace/capitation-payments"
              payload: { participant_id: "${p2}", service_month: "2026-06-01", proration_mode: "DAILY" }
              as: BillingSpecialist
              captures: { pay2: $.data.id }
            - call: "GET /pace/participants/${p2}"
              payload: {}
              as: BillingSpecialist
              captures: { p2_ver2: $.data.version }
            - call: "POST /pace/capitation-payments/${pay2}/finalize"
              payload: { expected_participant_version: "${p2_ver2}" }
              as: BillingSpecialist
              captures: { pay2_total: $.data.total_billed_cents }
          assert:
            - "CapitationPayment.${pay1}.total_billed_cents == 630000"
            - "CapitationPayment.${pay1}.medicare_share_cents == 280000"
            - "CapitationPayment.${pay1}.medicaid_share_cents == 350000"
            - "CapitationPayment.${pay2}.covered_days == 20"
            - "CapitationPayment.${pay2}.total_billed_cents == 420000"
            - "CapitationPayment.${pay1}.total_billed_cents != CapitationPayment.${pay2}.total_billed_cents"

      - name: dual_vs_nondual_billing_split
        grounds:
          - calculations.capitation_amount
          - entities.Participant.fields.dual_eligible
          - entities.CapitationPayment.fields.supplement_cents
        distinguishing_aspect: |
          On the Participant-billing domain, the SAME base rates route differently by dual_eligible: a dual participant
          bills medicaid_share 350000 + supplement 0; a Medicare-only participant bills medicaid_share 0 +
          supplement 400000 (350000 medicaid + 50000 medicare_only_supplement) — divergent component split for the
          identical month, on a different subject than the FULL_MONTH/DAILY mode variant.
        test_recipe:
          setup:
            - "Program with medicare_only_supplement_cents 50000, rates as above, FULL_MONTH."
            - "One dual participant and one non-dual participant, both ENROLLED 2026-06-01, both FULL_MONTH finalized."
          setup_api_calls:
            - call: "POST /pace/programs"
              payload: { name: "Center B", state_code: "CA", daily_census_capacity: 50, max_roster: 10, medicaid_monthly_rate_cents: 350000, medicare_monthly_rate_cents: 280000, medicare_only_supplement_cents: 50000, lock_in_days: 30, loc_validity_days: 365 }
              as: ProgramAdmin
              captures: { prog: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T12:00:00Z" }
              as: ProgramAdmin
            - call: "POST /pace/participants"
              payload: { program_id: "${prog}", full_name: "Non Dual", date_of_birth: "1955-01-01", dual_eligible: false }
              as: IntakeCoordinator
              captures: { pn: $.data.id }
            - call: "POST /pace/loc-assessments"
              payload: { participant_id: "${pn}", nf_score: 75, assessed_on: "2026-05-01" }
              as: IntakeCoordinator
              captures: { locn: $.data.id }
            - call: "POST /pace/loc-assessments/${locn}/certify"
              payload: {}
              as: MedicalDirector
            - call: "POST /pace/care-plans"
              payload: { participant_id: "${pn}" }
              as: IntakeCoordinator
              captures: { cpn: $.data.id }
            - call: "POST /pace/care-plans/${cpn}/goals"
              payload: { discipline: "RN", description: "Diet" }
              as: IntakeCoordinator
            - call: "POST /pace/care-plans/${cpn}/sign"
              payload: { discipline: "RN" }
              as: NurseStaff
            - call: "POST /pace/care-plans/${cpn}/sign"
              payload: { discipline: "SW" }
              as: IntakeCoordinator
            - call: "POST /pace/care-plans/${cpn}/sign"
              payload: { discipline: "MEDICAL_DIRECTOR" }
              as: MedicalDirector
            - call: "POST /pace/care-plans/${cpn}/submit"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /pace/care-plans/${cpn}/activate"
              payload: {}
              as: MedicalDirector
            - call: "POST /pace/participants/${pn}/enroll"
              payload: { enrollment_effective_date: "2026-06-01" }
              as: IntakeCoordinator
              captures: { pn_ver: $.data.version }
            - call: "POST /pace/capitation-payments"
              payload: { participant_id: "${pn}", service_month: "2026-06-01", proration_mode: "FULL_MONTH" }
              as: BillingSpecialist
              captures: { payn: $.data.id }
          trigger:
            - call: "POST /pace/capitation-payments/${payn}/finalize"
              payload: { expected_participant_version: "${pn_ver}" }
              as: BillingSpecialist
              captures: { payn_total: $.data.total_billed_cents }
          assert:
            - "CapitationPayment.${payn}.medicaid_share_cents == 0"
            - "CapitationPayment.${payn}.supplement_cents == 400000"
            - "CapitationPayment.${payn}.medicare_share_cents == 280000"
            - "CapitationPayment.${payn}.total_billed_cents == 680000"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: capitation_tiered_mode_dual_factor_combination
        grounds:
          - calculations.capitation_amount
          - entities.Participant.fields.dual_eligible
          - entities.CapitationPayment.fields.proration_mode
        distinguishing_aspect: |
          Mode (a): capitation_amount combines >=3 interacting inputs (proration_mode selects factor, dual_eligible
          selects which of three bases is non-zero, covered_days/days_in_month scales) with conditional branching —
          a non-dual DAILY June with covered_days 10/30 yields medicare 93333, supplement 133333, medicaid 0, total
          226666, which no single linear rate reproduces.
        test_recipe:
          setup:
            - "Program rates 350000/280000, medicare_only_supplement 50000, lock_in_days 30."
            - "Non-dual participant ENROLLED 2026-06-01, disenrolled effective 2026-06-11 (covered_days 10), DAILY payment."
          setup_api_calls:
            - call: "POST /pace/programs"
              payload: { name: "Center C", state_code: "CA", daily_census_capacity: 50, max_roster: 10, medicaid_monthly_rate_cents: 350000, medicare_monthly_rate_cents: 280000, medicare_only_supplement_cents: 50000, lock_in_days: 30, loc_validity_days: 365 }
              as: ProgramAdmin
              captures: { prog: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-05T12:00:00Z" }
              as: ProgramAdmin
            - call: "POST /pace/participants"
              payload: { program_id: "${prog}", full_name: "ND Daily", date_of_birth: "1955-01-01", dual_eligible: false }
              as: IntakeCoordinator
              captures: { p: $.data.id }
            - call: "POST /pace/loc-assessments"
              payload: { participant_id: "${p}", nf_score: 75, assessed_on: "2026-05-01" }
              as: IntakeCoordinator
              captures: { loc: $.data.id }
            - call: "POST /pace/loc-assessments/${loc}/certify"
              payload: {}
              as: MedicalDirector
            - call: "POST /pace/care-plans"
              payload: { participant_id: "${p}" }
              as: IntakeCoordinator
              captures: { cp: $.data.id }
            - call: "POST /pace/care-plans/${cp}/goals"
              payload: { discipline: "RN", description: "Meds" }
              as: IntakeCoordinator
            - call: "POST /pace/care-plans/${cp}/sign"
              payload: { discipline: "RN" }
              as: NurseStaff
            - call: "POST /pace/care-plans/${cp}/sign"
              payload: { discipline: "SW" }
              as: IntakeCoordinator
            - call: "POST /pace/care-plans/${cp}/sign"
              payload: { discipline: "MEDICAL_DIRECTOR" }
              as: MedicalDirector
            - call: "POST /pace/care-plans/${cp}/submit"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /pace/care-plans/${cp}/activate"
              payload: {}
              as: MedicalDirector
            - call: "POST /pace/participants/${p}/enroll"
              payload: { enrollment_effective_date: "2026-06-01" }
              as: IntakeCoordinator
            # disenroll effective 2026-06-11 => coverage Jun 1..10 = 10 covered days
            - call: "POST /pace/disenrollment-requests"
              payload: { participant_id: "${p}", kind: "VOLUNTARY", reason_code: "MOVED", requested_effective_date: "2026-06-11" }
              as: IntakeCoordinator
              captures: { dr: $.data.id }
            - call: "POST /pace/disenrollment-requests/${dr}/approve"
              payload: {}
              as: MedicalDirector
              captures: { p_ver: $.data.error_id }
            - call: "GET /pace/participants/${p}"
              payload: {}
              as: BillingSpecialist
              captures: { p_ver2: $.data.version }
            - call: "POST /pace/disenrollment-requests/${dr}/finalize"
              payload: { expected_participant_version: "${p_ver2}" }
              as: BillingSpecialist
            - call: "POST /pace/capitation-payments"
              payload: { participant_id: "${p}", service_month: "2026-06-01", proration_mode: "DAILY" }
              as: BillingSpecialist
              captures: { pay: $.data.id }
            - call: "GET /pace/participants/${p}"
              payload: {}
              as: BillingSpecialist
              captures: { p_ver3: $.data.version }
          trigger:
            - call: "POST /pace/capitation-payments/${pay}/finalize"
              payload: { expected_participant_version: "${p_ver3}" }
              as: BillingSpecialist
          assert:
            - "CapitationPayment.${pay}.covered_days == 10"
            - "CapitationPayment.${pay}.medicare_share_cents == 93333"
            - "CapitationPayment.${pay}.medicaid_share_cents == 0"
            - "CapitationPayment.${pay}.supplement_cents == 133333"
            - "CapitationPayment.${pay}.total_billed_cents == 226666"

      - name: capitation_round_per_component_not_sum_then_round
        grounds:
          - calculations.capitation_amount
          - entities.CapitationPayment.fields.medicare_share_cents
          - entities.CapitationPayment.fields.total_billed_cents
        distinguishing_aspect: |
          Mode (b): the scaffold pins round-per-component THEN sum. For dual DAILY covered_days 10/30 with rates
          280000/350000, round_half_up(280000*10/30)=93333 and round_half_up(350000*10/30)=116667 give total
          210000; sum-then-round of (280000+350000)*10/30=210000.0 also gives 210000 here, so this case uses
          covered_days 7/30 where per-component (round(280000*7/30)=65333 + round(350000*7/30)=81667 = 147000)
          differs from sum-then-round (round(630000*7/30)=147000) — pinned order is round-per-component.
        test_recipe:
          setup:
            - "Program rates 280000/350000, dual participant, DAILY, covered_days 7 of 30 (June, disenroll effective 2026-06-08)."
          setup_api_calls:
            - call: "POST /pace/programs"
              payload: { name: "Center D", state_code: "CA", daily_census_capacity: 50, max_roster: 10, medicaid_monthly_rate_cents: 350000, medicare_monthly_rate_cents: 280000, lock_in_days: 30, loc_validity_days: 365 }
              as: ProgramAdmin
              captures: { prog: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-05T12:00:00Z" }
              as: ProgramAdmin
            - call: "POST /pace/participants"
              payload: { program_id: "${prog}", full_name: "Dual Round", date_of_birth: "1955-01-01", dual_eligible: true }
              as: IntakeCoordinator
              captures: { p: $.data.id }
            - call: "POST /pace/loc-assessments"
              payload: { participant_id: "${p}", nf_score: 75, assessed_on: "2026-05-01" }
              as: IntakeCoordinator
              captures: { loc: $.data.id }
            - call: "POST /pace/loc-assessments/${loc}/certify"
              payload: {}
              as: MedicalDirector
            - call: "POST /pace/care-plans"
              payload: { participant_id: "${p}" }
              as: IntakeCoordinator
              captures: { cp: $.data.id }
            - call: "POST /pace/care-plans/${cp}/goals"
              payload: { discipline: "RN", description: "Round" }
              as: IntakeCoordinator
            - call: "POST /pace/care-plans/${cp}/sign"
              payload: { discipline: "RN" }
              as: NurseStaff
            - call: "POST /pace/care-plans/${cp}/sign"
              payload: { discipline: "SW" }
              as: IntakeCoordinator
            - call: "POST /pace/care-plans/${cp}/sign"
              payload: { discipline: "MEDICAL_DIRECTOR" }
              as: MedicalDirector
            - call: "POST /pace/care-plans/${cp}/submit"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /pace/care-plans/${cp}/activate"
              payload: {}
              as: MedicalDirector
            - call: "POST /pace/participants/${p}/enroll"
              payload: { enrollment_effective_date: "2026-06-01" }
              as: IntakeCoordinator
            - call: "POST /pace/disenrollment-requests"
              payload: { participant_id: "${p}", kind: "VOLUNTARY", reason_code: "MOVED", requested_effective_date: "2026-06-08" }
              as: IntakeCoordinator
              captures: { dr: $.data.id }
            - call: "POST /pace/disenrollment-requests/${dr}/approve"
              payload: {}
              as: MedicalDirector
            - call: "GET /pace/participants/${p}"
              payload: {}
              as: BillingSpecialist
              captures: { p_ver: $.data.version }
            - call: "POST /pace/disenrollment-requests/${dr}/finalize"
              payload: { expected_participant_version: "${p_ver}" }
              as: BillingSpecialist
            - call: "POST /pace/capitation-payments"
              payload: { participant_id: "${p}", service_month: "2026-06-01", proration_mode: "DAILY" }
              as: BillingSpecialist
              captures: { pay: $.data.id }
            - call: "GET /pace/participants/${p}"
              payload: {}
              as: BillingSpecialist
              captures: { p_ver2: $.data.version }
          trigger:
            - call: "POST /pace/capitation-payments/${pay}/finalize"
              payload: { expected_participant_version: "${p_ver2}" }
              as: BillingSpecialist
          assert:
            - "CapitationPayment.${pay}.covered_days == 7"
            - "CapitationPayment.${pay}.medicare_share_cents == 65333"
            - "CapitationPayment.${pay}.medicaid_share_cents == 81667"
            - "CapitationPayment.${pay}.total_billed_cents == 147000"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: care_plan_review_revision_cycle
        grounds:
          - state_machines.CarePlan.IN_REVIEW_to_REVISION
          - state_machines.CarePlan.REVISION_to_IN_REVIEW
          - entities.CarePlan.fields.status
        distinguishing_aspect: |
          CarePlan is cyclic: IN_REVIEW → REVISION (request-revision) → IN_REVIEW (resubmit) can repeat; this is a
          genuine loop on the CarePlan entity, not an A→B→C pipeline, and revision clears idt_disciplines_signed.
        test_recipe:
          setup:
            - "A CarePlan with one goal that has been submitted (IN_REVIEW), then sent back to REVISION and resubmitted to IN_REVIEW again."
          setup_api_calls:
            - call: "POST /pace/programs"
              payload: { name: "Center E", state_code: "CA", daily_census_capacity: 50, max_roster: 10, medicaid_monthly_rate_cents: 350000, medicare_monthly_rate_cents: 280000 }
              as: ProgramAdmin
              captures: { prog: $.data.id }
            - call: "POST /pace/participants"
              payload: { program_id: "${prog}", full_name: "Cyc Plan", date_of_birth: "1955-01-01", dual_eligible: true }
              as: IntakeCoordinator
              captures: { p: $.data.id }
            - call: "POST /pace/care-plans"
              payload: { participant_id: "${p}" }
              as: IntakeCoordinator
              captures: { cp: $.data.id }
            - call: "POST /pace/care-plans/${cp}/goals"
              payload: { discipline: "RN", description: "G1" }
              as: IntakeCoordinator
            - call: "POST /pace/care-plans/${cp}/sign"
              payload: { discipline: "RN" }
              as: NurseStaff
            - call: "POST /pace/care-plans/${cp}/submit"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /pace/care-plans/${cp}/request-revision"
              payload: {}
              as: MedicalDirector
          trigger:
            - call: "POST /pace/care-plans/${cp}/submit"
              payload: {}
              as: IntakeCoordinator
              captures: { cp_status: $.data.status }
          assert:
            - "CarePlan.${cp}.status == IN_REVIEW"
            - "CarePlan.${cp}.idt_disciplines_signed == []"

      - name: disenrollment_submitted_branches_approve_or_deny
        grounds:
          - state_machines.DisenrollmentRequest.SUBMITTED_to_APPROVED
          - state_machines.DisenrollmentRequest.SUBMITTED_to_DENIED
          - entities.DisenrollmentRequest.fields.status
        distinguishing_aspect: |
          DisenrollmentRequest is branching on a different entity: SUBMITTED forks to APPROVED (drives the
          participant to DISENROLLMENT_PENDING) or DENIED (no participant change), with divergent side-effect
          sets per branch — fork-with-divergent-effects, not a linear pipeline.
        test_recipe:
          setup:
            - "An ENROLLED participant with a SUBMITTED VOLUNTARY disenrollment request."
