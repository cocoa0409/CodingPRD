            - call: "POST /hiring-hall/job-requests/${jrA_id}/referrals"
              payload: { slot_kind: "JOURNEYWORKER", referral_kind: "LIST_ORDER", expected_job_request_version: "${jrA_v}" }
              as: Dispatcher
              as_user_id: "disp-01"
              captures: { refA_id: $.data.id, refA_reg: $.data.registration_id, refA_issued: $.data.issued_at, refA_deadline: $.data.acceptance_deadline }
            - call: "POST /hiring-hall/job-requests/${jrB_id}/referrals"
              payload: { slot_kind: "JOURNEYWORKER", referral_kind: "LIST_ORDER", expected_job_request_version: "${jrB_v}" }
              as: Dispatcher
              as_user_id: "disp-01"
              captures: { refB_id: $.data.id, refB_reg: $.data.registration_id, refB_deadline: $.data.acceptance_deadline }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-03T00:00:00.000Z" }
