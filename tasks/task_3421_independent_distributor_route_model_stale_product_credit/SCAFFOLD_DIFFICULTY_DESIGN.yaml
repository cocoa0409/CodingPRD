  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: order_submit_state_gate_beats_lead_time
        grounds:
          - validations[priority=7]
          - validations[priority=10]
          - errors.ERR_AGREEMENT_NOT_ACTIVE
          - errors.ERR_ORDER_LEAD_TIME
        distinguishing_aspect: "Error-category pair state vs business_temporal: a submit that violates both the SUSPENDED agreement gate (P7) and the 2-day lead time (P10) returns 409 ERR_AGREEMENT_NOT_ACTIVE, never 422 ERR_ORDER_LEAD_TIME."
        test_recipe:
          setup:
            - "Active-then-suspended (SERVICE_DEFAULT) cash agreement; a DRAFT order with delivery_date 2026-09-02 while the clock reads 2026-09-01 (lead time 1 day < 2)."
          setup_api_calls:
            - *k_clock0901
            - *k_bakery
            - *k_terr1
            - *k_terr1_list
            - *k_dist
            - *k_agr
            - *k_activate
            - call: "POST /agreements/${agr_id}/suspend"
              payload: { reason: "SERVICE_DEFAULT" }
              as: RouteOpsManager
            - call: "POST /distributors/${dist_id}/orders"
              payload: { delivery_date: "2026-09-02", lines: [{ sku: "WHT-24", qty: 5 }] }
              as: Distributor
              as_user_id: "${dist_id}"
              captures: { ord_e_id: $.data.id }
          trigger:
            - call: "POST /orders/${ord_e_id}/submit"
              payload: {}
              as: Distributor
              as_user_id: "${dist_id}"
              captures: { submit_err: $.data.error_id }
          assert:
            - "the response status is 409 and submit_err == ERR_AGREEMENT_NOT_ACTIVE"
            - "submit_err != ERR_ORDER_LEAD_TIME"
            - "DailyOrder.${ord_e_id}.status == DRAFT (unchanged)"

      - name: claim_submit_sku_referential_beats_window_temporal
        grounds:
          - validations[priority=9]
          - validations[priority=10]
