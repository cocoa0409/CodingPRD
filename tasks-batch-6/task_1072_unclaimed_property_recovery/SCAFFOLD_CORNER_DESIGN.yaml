  # ===========================================================================
  - section: errors
    instances:
      - name: error_report_period_overlap_stub
        claim_type: violation_to_error
        grounds: ["errors[ERR_REPORT_PERIOD_OVERLAP]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / report_period_calendar_overlap
          rationale: "The duplicate-period rejection is the asserted failure of that §1.8 instance."
      - name: error_notice_too_soon_stub
        claim_type: violation_to_error
        grounds: ["errors[ERR_NOTICE_TOO_SOON]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / notice_buffer_window
