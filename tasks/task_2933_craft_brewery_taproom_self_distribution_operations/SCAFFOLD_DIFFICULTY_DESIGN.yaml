  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: beer_registration_and_label_dimensions_advance_independently
        grounds:
          - state_machines.Beer.registration_state
          - state_machines.Beer.label_state
          - entities.Beer.fields.cola_id
          - entities.Beer.fields.taproom_sellable
          - entities.Beer.fields.distribution_sellable
        distinguishing_aspect: |
          Parallel-dimension shape: two independent state machines live on one Beer row. A LABEL
          approval and a FORMULA rejection are interleaved so the label dimension ends at
          COLA_APPROVED (holding its cola_id) while the registration dimension has fallen back to
          DRAFT - a combination that neither dimension could reach on its own, and which leaves
          BOTH derived sellability flags false.
        test_recipe:
          setup:
            - "Brewery ACTIVE."
            - "Beer 'Barrel Reserve Tripel' created with requires_formula true, so registration_state starts at DRAFT (not FORMULA_EXEMPT) and label_state at NO_LABEL."
          setup_api_calls:
            - call: "POST /brewery"
              payload: { legal_name: "Cascade Ridge Brewing", home_state_code: "OR", ttb_brewers_notice_number: "BR-OR-4417" }
              as: BreweryAdmin
              captures: { brewery_id: $.data.id }
            - call: "POST /brewery/notice"
              payload: { action: "ACTIVATE" }
              as: StateRegulator
            - call: "POST /beers"
              payload: { name: "Barrel Reserve Tripel", style: "Belgian Tripel", abv_pct: 9.4, price_per_bbl_cents: 58000, requires_formula: true }
              as: ComplianceOfficer
              captures: { beer_id: $.data.id }
          trigger:
            - call: "POST /beers/${beer_id}/filings"
              payload: { filing_type: "FORMULA", ingredient_list: "pilsner malt, candi sugar, coriander, brettanomyces" }
              as: ComplianceOfficer
            - call: "POST /beers/${beer_id}/filings"
              payload: { filing_type: "LABEL", label_fields: { brand_name: "Barrel Reserve Tripel", abv_statement: "9.4% ALC/VOL", net_contents: "750 ML", health_warning: "GOVERNMENT WARNING: ACCORDING TO THE SURGEON GENERAL" } }
              as: ComplianceOfficer
            - call: "POST /beers/${beer_id}/filings/LABEL/decision"
              payload: { decision: "APPROVED", cola_id: "COLA-24-1188" }
              as: StateRegulator
            - call: "POST /beers/${beer_id}/filings/FORMULA/decision"
              payload: { decision: "REJECTED", note: "brettanomyces requires a formula amendment" }
              as: StateRegulator
          assert:
            - "Beer.${beer_id}.registration_state == DRAFT"
            - "Beer.${beer_id}.label_state == COLA_APPROVED"
            - "Beer.${beer_id}.cola_id == COLA-24-1188"
            - "Beer.${beer_id}.taproom_sellable == false"
            - "Beer.${beer_id}.distribution_sellable == false"
            - "The FORMULA rejection did not reset label_state or clear cola_id, and the LABEL approval did not advance registration_state past FORMULA_PENDING."

      - name: keg_asset_cycles_back_through_clean_and_refill_from_a_second_run
        grounds:
          - state_machines.KegAsset.state
          - entities.KegAsset.fields.cycle_count
          - entities.KegAsset.fields.poured_volume_oz
          - entities.KegAsset.fields.depletion_variance_oz
          - state_machines.PackagingRun.reconciliation_state
        distinguishing_aspect: |
          Cyclic shape on a physical asset: EMPTY_DIRTY -> CLEANED -> FILLED -> TAPPED ->
          EMPTY_DIRTY -> CLEANED -> FILLED. The second lap must start from a zeroed meter -
          poured_volume_oz back to 0, remaining_volume_oz back to the full 1984.00, and the
          previous lap's depletion_variance_oz / shrinkage_flagged cleared - while cycle_count
          keeps its memory of the completed lap. The refill is drawn from a SECOND run because the
          first run's reconciliation_state has already reached the terminal RECONCILED.
        test_recipe:
          setup:
            - "Brewery ACTIVE; beer FORMULA_EXEMPT."
            - "Batch B-1001 conditioned at 16.000 bbl with two COMPLETED HALF_BBL_KEG TAPROOM runs of 10 units each (5.000 bbl apiece), leaving remaining_bbl 6.000 so the batch stays CONDITIONING."
            - "Keg KEG-0001 (0.5 bbl) has completed one full lap on run 1: cleaned, filled, tapped, one PINT_16OZ pour, returned with 15.0 gal."
          setup_api_calls:
            - call: "POST /brewery"
              payload: { legal_name: "Cascade Ridge Brewing", home_state_code: "OR", ttb_brewers_notice_number: "BR-OR-4417" }
              as: BreweryAdmin
              captures: { brewery_id: $.data.id }
            - call: "POST /brewery/notice"
              payload: { action: "ACTIVATE" }
              as: StateRegulator
            - call: "POST /beers"
              payload: { name: "Ridgeline IPA", style: "West Coast IPA", abv_pct: 6.8, price_per_bbl_cents: 42000, requires_formula: false }
              as: BreweryAdmin
              captures: { beer_id: $.data.id }
            - call: "POST /tanks"
              payload: { code: "FV-01", tank_type: "FERMENTER", capacity_bbl: 30.00 }
              as: CellarOperator
              captures: { tank_id: $.data.id }
            - call: "POST /batches"
              payload: { beer_id: "${beer_id}", tank_id: "${tank_id}", batch_code: "B-1001", planned_volume_bbl: 16.00, brew_start_utc: "2026-08-01T06:00:00Z", brew_end_utc: "2026-08-08T06:00:00Z", loss_basis: "PRO_RATA" }
              as: CellarOperator
              captures: { batch_id: $.data.id }
            - call: "POST /batches/${batch_id}/start"
              payload: {}
              as: CellarOperator
            - call: "POST /batches/${batch_id}/condition"
              payload: { actual_yield_bbl: 16.000 }
              as: CellarOperator
              captures: { batch_v1: $.data.version }
            - call: "POST /packaging-runs"
              payload: { batch_id: "${batch_id}", run_code: "R-TAP-1", package_type: "HALF_BBL_KEG", destination: "TAPROOM", units_planned: 10, expected_batch_version: "${batch_v1}" }
              as: CellarOperator
              captures: { run1_id: $.data.id }
            - call: "POST /packaging-runs/${run1_id}/complete"
              payload: { units_produced: 10 }
              as: CellarOperator
            - call: "GET /batches/${batch_id}"
              payload: {}
              as: CellarOperator
              captures: { batch_v2: $.data.version }
            - call: "POST /packaging-runs"
              payload: { batch_id: "${batch_id}", run_code: "R-TAP-2", package_type: "HALF_BBL_KEG", destination: "TAPROOM", units_planned: 10, expected_batch_version: "${batch_v2}" }
              as: CellarOperator
              captures: { run2_id: $.data.id }
            - call: "POST /packaging-runs/${run2_id}/complete"
              payload: { units_produced: 10 }
              as: CellarOperator
            - call: "POST /keg-assets"
              payload: { keg_serial: "KEG-0001", size_bbl: 0.5 }
              as: CellarOperator
              captures: { keg_id: $.data.id }
            - call: "POST /keg-assets/${keg_id}/clean"
              payload: { sanitizer_ppm: 200, contact_time_seconds: 90 }
              as: CellarOperator
            - call: "POST /keg-assets/${keg_id}/fill"
              payload: { packaging_run_id: "${run1_id}" }
              as: CellarOperator
            - call: "POST /keg-assets/${keg_id}/movements"
              payload: { movement_type: "TAP" }
              as: TaproomStaff
            - call: "POST /taproom-pours"
              payload: { keg_asset_id: "${keg_id}", container_type: "PINT_16OZ", price_cents: 800 }
              as: TaproomStaff
            - call: "POST /keg-assets/${keg_id}/movements"
              payload: { movement_type: "RETURN", returned_volume_gal: 15.0 }
              as: TaproomStaff
          trigger:
            - call: "POST /keg-assets/${keg_id}/clean"
              payload: { sanitizer_ppm: 180, contact_time_seconds: 75 }
              as: CellarOperator
            - call: "POST /keg-assets/${keg_id}/fill"
              payload: { packaging_run_id: "${run2_id}" }
              as: CellarOperator
          assert:
            - "KegAsset.${keg_id}.state == FILLED"
            - "KegAsset.${keg_id}.cycle_count == 1"
            - "KegAsset.${keg_id}.packaging_run_id == ${run2_id}"
            - "KegAsset.${keg_id}.filled_volume_oz == 1984.00"
            - "KegAsset.${keg_id}.remaining_volume_oz == 1984.00"
            - "KegAsset.${keg_id}.poured_volume_oz == 0.00"
            - "KegAsset.${keg_id}.depletion_variance_oz is null"
            - "KegAsset.${keg_id}.shrinkage_flagged == false"
            - "KegAsset.${keg_id}.returned_volume_oz is null"
            - "KegAsset.${keg_id}.tapped_at_utc still holds the first lap's TAP instant and deployment_channel is still TAPROOM"
            - "PackagingRun.${run1_id}.reconciliation_state == RECONCILED"
            - "PackagingRun.${run1_id}.kegs_filled_count == 1"
            - "PackagingRun.${run1_id}.kegs_outstanding_count == 0"
            - "PackagingRun.${run2_id}.reconciliation_state == OPEN"
            - "PackagingRun.${run2_id}.kegs_outstanding_count == 1"

  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: notice_suspension_cascades_license_to_order_to_released_run_allocation
        grounds:
          - state_machines.Brewery.ACTIVE_to_SUSPENDED
          - state_machines.StateLicense.ACTIVE_to_SUSPENDED
          - state_machines.DistributionOrder.ALLOCATED_to_REJECTED
          - entities.PackagingRun.fields.allocated_bbl
          - entities.PackagingRun.fields.available_bbl
        distinguishing_aspect: |
          Chain depth 3, triggered by a REGULATORY event on the Brewery singleton:
          notice SUSPEND -> (hop 1) StateLicense ACTIVE -> SUSPENDED -> (hop 2) its ALLOCATED
          DistributionOrder -> REJECTED/NOTICE_SUSPENDED -> (hop 3) every allocation line released
          back to the cited PackagingRun. Hop 3 is caused by hop 2, not by the notice itself, and
          the released barrels must reappear as available_bbl on a run three edges away.
        test_recipe:
          setup:
            - "Brewery ACTIVE."
            - "Beer 'Ridgeline IPA' FORMULA_EXEMPT and COLA_APPROVED, so distribution_sellable is true."
            - "ID StateLicense of license_type SELF_DISTRIBUTION, franchise_state false, annual_barrel_cap 1000.00, ACTIVE; no appointment exists so orders take the SELF_DISTRIBUTED channel."
            - "Batch B-1001 conditioned at 16.000 bbl with one COMPLETED DISTRIBUTION run of 10 HALF_BBL_KEG units (bbl_removed 5.000, available_bbl 5.000)."
            - "Order SO-4001 for 3.00 bbl into ID has been ALLOCATED, so the run shows allocated_bbl 3.000 and available_bbl 2.000."
          setup_api_calls:
            - call: "POST /brewery"
              payload: { legal_name: "Cascade Ridge Brewing", home_state_code: "OR", ttb_brewers_notice_number: "BR-OR-4417" }
              as: BreweryAdmin
              captures: { brewery_id: $.data.id }
