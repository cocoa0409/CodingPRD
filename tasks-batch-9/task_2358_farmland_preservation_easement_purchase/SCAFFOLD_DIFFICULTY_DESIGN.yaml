              as: AcquisitionOfficer
              as_user_id: "officer-1"
            - call: "POST /applications/${app_a_id}/counters"
              payload: { counter_cents: 168000000, rationale: "second counter" }
              as: Landowner
              as_user_id: "${lo_a_id}"
            - call: "GET /applications/${app_a_id}"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { neg_v3: $.data.version }
            - call: "POST /applications/${app_a_id}/offers"
