              payload: { product_id: "${prod_id}", ingredient_id: "${ing_id}", claim_text: "Supports immune function", claim_type: "STRUCTURE_FUNCTION" }
              as: RegulatoryAffairsSpecialist
              as_user_id: "u_ras_01"
              captures: { claim_id: $.data.id }
            - call: "GET /supplement-compliance/claims/${claim_id}"
              payload: {}
              as: RegulatoryAffairsSpecialist
              as_user_id: "u_ras_01"
              captures: { claim_v: $.data.version }
            - call: "POST /supplement-compliance/substantiation-dossiers"
              payload: { claim_id: "${claim_id}", expected_claim_version: "${claim_v}", dossier_summary: "Evidence build-up in two appends." }
              as: RegulatoryAffairsSpecialist
              as_user_id: "u_ras_01"
              captures: { dossier_id: $.data.id }
          trigger:
            - call: "POST /supplement-compliance/substantiation-dossiers/${dossier_id}/evidence"
              payload: { study_type: "RCT_HUMAN", subject_count: 200, dose_match: true, peer_reviewed: true, citation: "Immunol Nutr 2024;12:1-14" }
              as: RegulatoryAffairsSpecialist
              as_user_id: "u_ras_01"
              captures: { score_one: $.data.screening_score }
            - call: "POST /supplement-compliance/substantiation-dossiers/${dossier_id}/evidence"
              payload: { study_type: "ANIMAL", subject_count: 20, dose_match: false, peer_reviewed: false, citation: "Lab Anim Sci 2023;7:12-19" }
              as: RegulatoryAffairsSpecialist
              as_user_id: "u_ras_01"
              captures: { score_two: $.data.screening_score }
          assert:
            - "after the first append study_count == 1 and screening_score == 30.00"
            - "after the second append study_count == 2 and screening_score == 34.80 (4.80 added: base 8 x subject factor 1.0 x dose factor 0.60, peer review ignored by the screening variant)"
            - "SubstantiationDossier.${dossier_id}.dossier_status is still DRAFT and final_score == null until the claim is submitted for review"
