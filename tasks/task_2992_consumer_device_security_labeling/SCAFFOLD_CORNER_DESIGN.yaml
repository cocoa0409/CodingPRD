  - section: errors
    instances:
      - name: every_missing_identity_shape_returns_unauthenticated
        claim_type: Error triggerable
        grounds:
          - validations.priority_10
          - errors.ERR_UNAUTHENTICATED
          - rbac.identity
        distinguishing_aspect: "All three failure shapes of the identity envelope are exercised on the same benign read: an empty-string X-User-ID, a role name that is not declared in §1.7, and a request with no role header at all - each is 401 ERR_UNAUTHENTICATED and none of them leaks the 403 that a wrong-but-valid role would produce."
        test_recipe:
          setup:
            - "One ProgramTier exists so the target of the read is real and only the identity headers are at fault."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /labeling/program-tiers"
              payload: { tier_code: "TIER_1", required_route: "SELF_ATTESTATION", label_validity_days: 365, min_overall_score: 70.00, unverified_weight_factor: 0.60, issuance_base_fee_cents: 40000, max_deficiency_rounds: 2 }
              as: ProgramAdministrator
              captures: { tier1_id: "$.data.id" }
          trigger:
            - call: "GET /labeling/program-tiers/${tier1_id}"
              payload: {}
              as: Consumer
              as_user_id: ""
            - call: "GET /labeling/program-tiers/${tier1_id}"
              payload: {}
              as: SuperAdministrator
              as_user_id: "ghost-1"
            - call: "GET /labeling/program-tiers/${tier1_id}"
              payload: {}
              as: ""
              as_user_id: "consumer-1"
          assert:
            - "first response HTTP status is 401 with error_id ERR_UNAUTHENTICATED, because X-User-ID is present but empty"
            - "second response HTTP status is 401 with error_id ERR_UNAUTHENTICATED, because SuperAdministrator is not a role declared in §1.7"
            - "third response HTTP status is 401 with error_id ERR_UNAUTHENTICATED, because X-User-Role is empty"
            - "none of the three responses returns 403 or any ProgramTier field"

      - name: every_entity_read_has_its_own_not_found_error
        claim_type: Error triggerable
        grounds:
          - validations.priority_30
          - errors.ERR_PROGRAM_CONFIG_NOT_FOUND
          - errors.ERR_MANUFACTURER_NOT_FOUND
          - errors.ERR_PRODUCT_NOT_FOUND
          - errors.ERR_ENGAGEMENT_NOT_FOUND
          - errors.ERR_GRANT_NOT_FOUND
          - errors.ERR_RETAILER_NOT_FOUND
          - errors.ERR_AUTHORIZATION_NOT_FOUND
          - errors.ERR_CASE_NOT_FOUND
        distinguishing_aspect: "Eight reads on a database that holds nothing but the clock, each with a well-formed but unused id, must return the entity-specific 404 from the catalog rather than one generic not-found code, which is what makes the priority-30 left-to-right resolution observable."
        test_recipe:
          setup:
            - "The database is empty apart from the logical clock, so every id below is guaranteed to resolve to nothing."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdministrator
          trigger:
            - call: "GET /labeling/program-tiers/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: ProgramAdministrator
            - call: "GET /labeling/manufacturers/00000000-0000-4000-8000-000000000002"
              payload: {}
              as: ProgramAdministrator
            - call: "GET /labeling/products/00000000-0000-4000-8000-000000000003"
              payload: {}
              as: ProgramAdministrator
            - call: "GET /labeling/test-engagements/00000000-0000-4000-8000-000000000004"
              payload: {}
              as: ProgramAdministrator
            - call: "GET /labeling/label-grants/00000000-0000-4000-8000-000000000005"
              payload: {}
              as: ProgramAdministrator
            - call: "GET /labeling/retailers/00000000-0000-4000-8000-000000000006"
              payload: {}
              as: ProgramAdministrator
            - call: "GET /labeling/display-authorizations/00000000-0000-4000-8000-000000000007"
              payload: {}
              as: ProgramAdministrator
            - call: "GET /labeling/enforcement-cases/00000000-0000-4000-8000-000000000008"
              payload: {}
              as: ProgramAdministrator
          assert:
            - "every response HTTP status is 404"
            - "the program-tier read returns error_id ERR_PROGRAM_CONFIG_NOT_FOUND"
            - "the manufacturer read returns error_id ERR_MANUFACTURER_NOT_FOUND"
            - "the product read returns error_id ERR_PRODUCT_NOT_FOUND"
            - "the test-engagement read returns error_id ERR_ENGAGEMENT_NOT_FOUND"
            - "the label-grant read returns error_id ERR_GRANT_NOT_FOUND"
            - "the retailer read returns error_id ERR_RETAILER_NOT_FOUND"
            - "the display-authorization read returns error_id ERR_AUTHORIZATION_NOT_FOUND"
            - "the enforcement-case read returns error_id ERR_CASE_NOT_FOUND"
            - "every response body carries the fixed error envelope with an error_id and a message and no data key"

  # -------------------------------------------------------------------------
  # From Table 7 (RBAC) - role_model: segregation_of_duties
  # -------------------------------------------------------------------------
  - section: rbac
    instances:
      - name: role_denial_consumer_cannot_configure_a_program_tier
        claim_type: Cannot perform other roles' exclusive_operations
        grounds:
          - roles.Consumer.exclusive_operations
          - roles.ProgramAdministrator.exclusive_operations
          - validations[priority=20]
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: "The Consumer role declares an empty exclusive_operations list and no write anywhere in the program, so POST /labeling/program-tiers as Consumer returns 403 ERR_UNAUTHORIZED and the identical payload replayed by a ProgramAdministrator still succeeds with 201, proving the denial persisted nothing."
        test_recipe:
          setup:
            - "Empty database; the clock is parked at 2026-08-01 and no ProgramTier exists yet."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdministrator
          trigger:
            - call: "POST /labeling/program-tiers"
              payload: { tier_code: "TIER_1", required_route: "SELF_ATTESTATION", label_validity_days: 365, min_overall_score: 70.00, unverified_weight_factor: 0.60, issuance_base_fee_cents: 40000, max_deficiency_rounds: 2 }
              as: Consumer
            - call: "POST /labeling/program-tiers"
              payload: { tier_code: "TIER_1", required_route: "SELF_ATTESTATION", label_validity_days: 365, min_overall_score: 70.00, unverified_weight_factor: 0.60, issuance_base_fee_cents: 40000, max_deficiency_rounds: 2 }
              as: ProgramAdministrator
              captures: { tier1_id: "$.data.id" }
            - call: "GET /labeling/program-tiers/${tier1_id}"
              payload: {}
              as: Consumer
          assert:
            - "first response HTTP status is 403 with data.error_id == ERR_UNAUTHORIZED"
            - "second response HTTP status is 201 with data.tier_code == TIER_1, so the tier_code was still free after the denial"
            - "third response HTTP status is 200 with tier_code == TIER_1 and label_validity_days == 365, so the same Consumer identity retains its declared read access"

