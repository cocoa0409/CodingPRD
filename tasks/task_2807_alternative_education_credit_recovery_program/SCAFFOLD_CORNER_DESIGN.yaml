        excluded_because:
          difficulty_instance: proctor_station_buffer_half_open_conflict
          rationale: "That §1.8 resource_temporal_overlap instance asserts ERR_STATION_CONFLICT inside the 15-minute buffer and the success at the buffer's exact end."

      - name: support_provider_over_capacity_error
        claim_type: violation_to_error
        grounds: [errors.ERR_PROVIDER_CAPACITY_EXCEEDED]
        excluded_because:
          difficulty_instance: support_provider_aggregate_concurrency_closed_interval
          rationale: "That §1.8 instance asserts ERR_PROVIDER_CAPACITY_EXCEEDED on the third intersecting session against max_concurrent_students 2."

      - name: award_credit_below_min_passing_percent_error
        claim_type: violation_to_error
        grounds: [errors.ERR_FINAL_PERCENT_BELOW_PASSING]
        excluded_because:
          difficulty_instance: safety_beats_constraint_on_award_credit
          rationale: "That §1.8 priority_pair_validation_conflict instance asserts ERR_FINAL_PERCENT_BELOW_PASSING once the integrity hold is cleared, with final_percent 45.00 against min_passing_percent 60.00."

      - name: enrollment_create_on_exited_placement_error
        claim_type: violation_to_error
        grounds: [errors.ERR_PLACEMENT_STATE_INVALID]
        excluded_because:
          difficulty_instance: state_beats_referential_on_enrollment_create
          rationale: "That §1.8 instance asserts ERR_PLACEMENT_STATE_INVALID on POST /course-enrollments against an EXITED_UNSUCCESSFUL placement and pins it above the referential rung."

  - section: rbac
    instances:
      - name: cross_role_writes_are_unauthorized
        claim_type: unauthorized_operation
        grounds:
          - rbac.DistrictAdmin.exclusive_operations
          - rbac.Registrar.exclusive_operations
          - rbac.HomeSchoolCounselor.exclusive_operations
          - rbac.SupportProviderStaff.exclusive_operations
          - errors.ERR_UNAUTHORIZED
        distinguishing_aspect: "Each exclusive operation is closed to every other role: six well-formed bodies sent by the wrong role all return ERR_UNAUTHORIZED (403) and write nothing, even where the acting role is otherwise privileged."
        test_recipe:
          setup: ["one home school, one 10-seat center and one student, so every attempted body can be complete and valid"]
          setup_api_calls:
            - call: "POST /home-schools"
              payload: { name: "North High", district_code: "NHS-01", accountability_cohort_year: 2026 }
              as: DistrictAdmin
              captures: { hs_id: $.data.id }
            - call: "POST /centers"
              payload: { name: "Cedar AEC", seat_capacity: 10, certified_teacher_fte: 4.00, support_staff_fte: 2.00, max_students_per_teacher: 12 }
              as: DistrictAdmin
              captures: { ctr_id: $.data.id }
            - call: "POST /students"
              payload: { home_school_id: "${hs_id}", state_student_id: "S-5501", full_name: "Rex Salo", cohort_year: 2027, grade_level: 11 }
              as: Registrar
              captures: { stu_id: $.data.id }
            - call: "POST /courses"
              payload: { code: "ALG1", title: "Algebra I", subject_area: "MATH", credit_value: 1.00, modality: "PACKET", total_modules: 8, required_seat_hours: 60.00, pacing_days: 40, proctoring_required: false, ncaa_approved: false, min_passing_percent: 60.00 }
              as: DistrictAdmin
              captures: { crs_id: $.data.id }
          trigger:
            - call: "POST /centers"
              payload: { name: "Rogue AEC", seat_capacity: 5, certified_teacher_fte: 1.00, support_staff_fte: 1.00, max_students_per_teacher: 10 }
              as: AltEdTeacher
              as_user_id: "teach-01"
            - call: "POST /courses"
              payload: { code: "GEO1", title: "Geometry", subject_area: "MATH", credit_value: 1.00, modality: "PACKET", total_modules: 8, required_seat_hours: 60.00, pacing_days: 40, proctoring_required: false, ncaa_approved: false, min_passing_percent: 60.00 }
              as: Registrar
              as_user_id: "reg-01"
            - call: "POST /support-providers"
              payload: { center_id: "${ctr_id}", role_type: "SOCIAL_WORKER", full_name: "Self Appointed", max_concurrent_students: 3 }
              as: SupportProviderStaff
              as_user_id: "prv-unknown"
            - call: "POST /prior-course-records"
              payload: { student_id: "${stu_id}", course_id: "${crs_id}", term_code: "2025-S1", original_percent: 40.00, credits_attempted: 1.00, outcome: "FAILED" }
              as: PlacementCoordinator
              as_user_id: "${ctr_id}"
            - call: "POST /graduation-plans"
              payload: { student_id: "${stu_id}", required_credits_total: 24.00, grade_replacement_policy: "REPLACE_ON_RECOVERY", projected_completion_term: "2027-S2" }
              as: HomeSchoolCounselor
              as_user_id: "${hs_id}"
            - call: "POST /referrals"
              payload: { student_id: "${stu_id}", center_id: "${ctr_id}", pathway: "CREDIT_DEFICIENCY", deficiency_credits: 6.00, behavior_incident_count: 1, days_disengaged: 6 }
              as: Registrar
              as_user_id: "reg-01"
          assert:
            - "all six calls return HTTP 403 with error id ERR_UNAUTHORIZED"
            - "GET /centers returns exactly one center and GET /courses returns exactly one course"
            - "GET /prior-course-records?student_id=${stu_id}, GET /graduation-plans?student_id=${stu_id} and GET /referrals?student_id=${stu_id} all return empty collections"
            - "GET /support-providers?center_id=${ctr_id} returns an empty collection"

      - name: create_center_without_headers_returns_401
        claim_type: unauthorized_operation
        grounds:
          - validations.priority_1_ERR_UNAUTHENTICATED
          - errors.ERR_UNAUTHENTICATED
        distinguishing_aspect: "Identity is checked before authorisation: a request carrying no X-User-Role and no X-User-ID returns ERR_UNAUTHENTICATED (401), not ERR_UNAUTHORIZED (403), even for a body that a DistrictAdmin would be allowed to send."
        test_recipe:
          setup: ["an empty database; the request is sent with both identity headers omitted"]
          setup_api_calls: []
          trigger:
            - call: "POST /centers"
              payload: { name: "Cedar AEC", seat_capacity: 10, certified_teacher_fte: 4.00, support_staff_fte: 2.00, max_students_per_teacher: 12 }
              as: "(request sent with no X-User-Role and no X-User-ID header)"
          assert:
            - "HTTP 401 with error id ERR_UNAUTHENTICATED"
            - "the same body sent as DistrictAdmin with X-User-ID 'admin-01' returns HTTP 201, proving the body was always valid"
            - "GET /centers as DistrictAdmin returns exactly the one center created by the authenticated retry"

      - name: cross_scope_actions_are_forbidden
        claim_type: peer_roles
        grounds:
          - rbac.PlacementCoordinator.identity
          - rbac.HomeSchoolCounselor.identity
          - rbac.SupportProviderStaff.identity
          - errors.ERR_FORBIDDEN_CENTER_SCOPE
          - errors.ERR_FORBIDDEN_SCHOOL_SCOPE
          - errors.ERR_FORBIDDEN_PROVIDER_SCOPE
        distinguishing_aspect: "Each entity-backed role is confined to its own row: a coordinator of center B screening center A's referral, a counselor of school B referring school A's student, and provider B's staff completing provider A's session each return their own scope error rather than a generic 403."
        test_recipe:
          setup:
            - "two home schools and two 10-seat centers"
            - "one student at school A with a SUBMITTED referral to center A"
            - "one ACTIVE placement at center A with one SCHEDULED support session delivered by provider A of center A; provider B sits at center B"
          setup_api_calls:
            - call: "POST /home-schools"
              payload: { name: "North High", district_code: "NHS-01", accountability_cohort_year: 2026 }
              as: DistrictAdmin
              captures: { hs_a: $.data.id }
            - call: "POST /home-schools"
              payload: { name: "South High", district_code: "SHS-01", accountability_cohort_year: 2026 }
              as: DistrictAdmin
              captures: { hs_b: $.data.id }
            - call: "POST /centers"
              payload: { name: "Cedar AEC", seat_capacity: 10, certified_teacher_fte: 4.00, support_staff_fte: 2.00, max_students_per_teacher: 12 }
              as: DistrictAdmin
              captures: { ctr_a: $.data.id, ctr_a_v1: $.data.version }
            - call: "POST /centers"
              payload: { name: "Birch AEC", seat_capacity: 10, certified_teacher_fte: 4.00, support_staff_fte: 2.00, max_students_per_teacher: 12 }
              as: DistrictAdmin
              captures: { ctr_b: $.data.id }
            - call: "POST /support-providers"
              payload: { center_id: "${ctr_a}", role_type: "COUNSELOR", full_name: "Ana Prieto", max_concurrent_students: 2 }
              as: DistrictAdmin
              captures: { prv_a: $.data.id }
            - call: "POST /support-providers"
              payload: { center_id: "${ctr_b}", role_type: "COUNSELOR", full_name: "Bo Riis", max_concurrent_students: 2 }
              as: DistrictAdmin
              captures: { prv_b: $.data.id }
            - call: "POST /students"
              payload: { home_school_id: "${hs_a}", state_student_id: "S-5601", full_name: "Sana Tor", cohort_year: 2027, grade_level: 11 }
              as: Registrar
              captures: { stu_a: $.data.id }
            - call: "POST /students"
              payload: { home_school_id: "${hs_a}", state_student_id: "S-5602", full_name: "Timo Ure", cohort_year: 2027, grade_level: 11 }
              as: Registrar
              captures: { stu_b: $.data.id }
            - call: "POST /referrals"
              payload: { student_id: "${stu_a}", center_id: "${ctr_a}", pathway: "CREDIT_DEFICIENCY", deficiency_credits: 6.00, behavior_incident_count: 1, days_disengaged: 6 }
              as: HomeSchoolCounselor
              as_user_id: "${hs_a}"
              captures: { ref_a: $.data.id }
            - call: "POST /referrals"
              payload: { student_id: "${stu_b}", center_id: "${ctr_a}", pathway: "RE_ENGAGEMENT", deficiency_credits: 2.00, behavior_incident_count: 0, days_disengaged: 45 }
              as: HomeSchoolCounselor
              as_user_id: "${hs_a}"
              captures: { ref_b: $.data.id }
            - call: "POST /referrals/${ref_b}/screen"
              payload: {}
              as: PlacementCoordinator
              as_user_id: "${ctr_a}"
            - call: "POST /referrals/${ref_b}/offer"
              payload: { offer_valid_days: 10, expected_center_version: "${ctr_a_v1}" }
              as: PlacementCoordinator
              as_user_id: "${ctr_a}"
            - call: "POST /referrals/${ref_b}/accept-offer"
              payload: { credit_policy: "SEAT_TIME", start_date: "2026-08-01" }
              as: HomeSchoolCounselor
              as_user_id: "${hs_a}"
              captures: { pl_id: $.data.id }
            - call: "POST /support-sessions"
              payload: { support_provider_id: "${prv_a}", placement_id: "${pl_id}", start_at: "2026-08-04T13:00:00.000Z", end_at: "2026-08-04T14:00:00.000Z", service_code: "RE_ENGAGEMENT_CHECKIN" }
              as: PlacementCoordinator
              as_user_id: "${ctr_a}"
              captures: { ssn_id: $.data.id }
          trigger:
            - call: "POST /referrals/${ref_a}/screen"
              payload: {}
              as: PlacementCoordinator
              as_user_id: "${ctr_b}"
            - call: "POST /referrals"
              payload: { student_id: "${stu_a}", center_id: "${ctr_a}", pathway: "BEHAVIOR", deficiency_credits: 1.00, behavior_incident_count: 4, days_disengaged: 3 }
              as: HomeSchoolCounselor
              as_user_id: "${hs_b}"
            - call: "POST /support-sessions/${ssn_id}/complete"
              payload: { minutes_delivered: 50 }
              as: SupportProviderStaff
              as_user_id: "${prv_b}"
          assert:
            - "the first call returns HTTP 403 with ERR_FORBIDDEN_CENTER_SCOPE and Referral.${ref_a}.status stays SUBMITTED"
            - "the second call returns HTTP 403 with ERR_FORBIDDEN_SCHOOL_SCOPE; the student belongs to ${hs_a} while the actor is ${hs_b}, and no second referral is created for ${stu_a}"
            - "the third call returns HTTP 403 with ERR_FORBIDDEN_PROVIDER_SCOPE and SupportSession.${ssn_id}.status stays SCHEDULED with minutes_delivered null"
            - "the identical third call sent as SupportProviderStaff with X-User-ID ${prv_a} returns HTTP 200 with status COMPLETED and minutes_delivered == 50"

      - name: award_credit_by_submitting_user_rejected
