            - "EQUAL allocation at custodian B: 422 with error_id 'ERR_CUSTODIAN_CONCENTRATION_EXCEEDED'; the post-write share would be floor(9800000*10000/19600000) == 5000 bps > 4000"
            - "After the rejection Depository.${dep_id}.total_pledged_collateral_value_cents is still 9800000, CollateralAsset.${asset_b1}.pledge_status is still 'UNPLEDGED' and pledged_par_cents 0"
            - "SMALLER allocation at custodian B: 201; post-write total value == 13720000 and B's share == floor(3920000*10000/13720000) == 2857 bps <= 4000"
            - "After the accepted allocation custodian A's share fell to floor(9800000*10000/13720000) == 7142 bps, still within A's 10000 limit — adding collateral elsewhere DILUTES an existing custodian's share"
