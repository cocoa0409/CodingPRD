            - "data.placement_rate == null, data.retention_rate == null, data.average_wage_progression_pct == null -- all three empty denominators yield null, never 0.0000"

      - name: hours_vs_revenue_variant_split_covered_by_difficulty
        claim_type: variant_divergence
        grounds:
          - calculations.subsidy_cost_allocation.variants
          - complexity_profile.complexity_layers[dual_variant_calculation]
        excluded_because:
          difficulty_instance: "dual_variant_calc / subsidy_allocation_hours_vs_revenue_split_same_ledger"
          rationale: |
            §1.8 already drives the identical four-entry ledger through both variants in one test and
            asserts the full divergence (mission_share 0.2308 / mission_cost 85810 under
            PROVISIONAL_HOURS versus 0.3276 / 116766 under FINAL_REVENUE, with the business side as
            the exact complement). A second corner test would restate the same arithmetic.

      - name: retention_measure_variant_selection_covered_by_difficulty
        claim_type: variant_selection
        grounds:
          - calculations.outcome_measurement.variants
          - endpoints[GET /business-lines/{businessLineId}/outcome-summary]
        excluded_because:
          difficulty_instance: "dual_variant_calc / outcome_retention_cohort_vs_point_in_time_same_placement"
          rationale: |
            §1.8 asserts both measures against the SAME single ACTIVE-but-unconfirmed placement
            (retention_rate 0.0000 under COHORT_BASED and 1.0000 under POINT_IN_TIME) including the
            denominator difference, which is exactly the variant-selection claim.

      - name: per_assignment_rounding_order_covered_by_difficulty
        claim_type: precision
        grounds:
          - calculations.shift_labor_cost
        excluded_because:
          difficulty_instance: "combinatorial_formula / shift_labor_cost_rounds_per_assignment_then_sums"
          rationale: |
            §1.8 pins the rounding order with the 3.335 h @ 1650 plus 2.125 h @ 1725 pair
            (5503 + 3666 = 9169 versus 9168 for sum-then-round), which is the only observable
            difference the precision rule produces.

