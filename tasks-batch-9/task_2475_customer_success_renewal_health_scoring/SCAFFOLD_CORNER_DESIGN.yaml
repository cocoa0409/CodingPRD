            - call: "POST /save-plays/${sp_id}/transition"
              payload: { action: "SUCCEED", outcome_note: "Adoption recovered" }
              as: CsmUser
              as_user_id: "${csm_a_id}"
          trigger:
            - call: "POST /save-plays/${sp_id}/transition"
