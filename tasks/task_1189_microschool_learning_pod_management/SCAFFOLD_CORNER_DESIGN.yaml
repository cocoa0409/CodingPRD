scaffold_corner_design:
  # =====================================================================
  # Section 1: Entities — creation, retrieval, listing, required fields,
  # defaults, computed/system fields, type constraints, parent relationships
  # =====================================================================
  - section: entities
    instances:
      - name: pod_creation_requires_all_required_fields
        claim_type: required_fields
        grounds: ["entities.Pod.fields.pod_code", "entities.Pod.fields.seat_capacity", "entities.Pod.fields.tuition_full_year_cents", 'endpoints.POST /pods']
        distinguishing_aspect: "POST /pods missing seat_capacity returns ERR_INVALID_REQUEST (400); the endpoint's required-field set is enforced."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls:
            - call: "POST /facility-sites"
              payload: { site_name: "S1", address_line1: "1 A St", jurisdiction_code: "AZ-MARICOPA", zoning_class: "RESIDENTIAL_SINGLE", max_occupancy: 20, indoor_sqft: 900 }
              as: PlatformAdmin
              captures: { site_id: $.data.id }
          trigger:
            - call: "POST /pods"
              payload: { name: "NoCap", pod_code: "NC26", academic_year: "2026-2027", term_start_date: "2026-08-01", term_end_date: "2027-05-31", tuition_full_year_cents: 500000, min_guides_required: 1, facility_site_id: "${site_id}" }
              as: PodOperator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400 with error_id == ERR_INVALID_REQUEST (missing seat_capacity)"

      - name: pod_code_uniqueness_enforced
        claim_type: type_constraints
        grounds: ["entities.Pod.fields.pod_code"]
        distinguishing_aspect: "Two pods with the same pod_code are rejected; uniqueness constraint enforced at creation."
        test_recipe:
          setup: ["FacilitySite exists; one Pod with pod_code='DUP26' already exists."]
          setup_api_calls:
            - call: "POST /facility-sites"
              payload: { site_name: "S2", address_line1: "2 B St", jurisdiction_code: "AZ-MARICOPA", zoning_class: "RESIDENTIAL_SINGLE", max_occupancy: 20, indoor_sqft: 900 }
              as: PlatformAdmin
              captures: { site_id: $.data.id }
            - call: "POST /pods"
              payload: { name: "First", pod_code: "DUP26", academic_year: "2026-2027", term_start_date: "2026-08-01", term_end_date: "2027-05-31", seat_capacity: 8, tuition_full_year_cents: 500000, min_guides_required: 1, facility_site_id: "${site_id}" }
              as: PodOperator
          trigger:
            - call: "POST /pods"
              payload: { name: "Second", pod_code: "DUP26", academic_year: "2026-2027", term_start_date: "2026-08-01", term_end_date: "2027-05-31", seat_capacity: 8, tuition_full_year_cents: 500000, min_guides_required: 1, facility_site_id: "${site_id}" }
              as: PodOperator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 422 or 400 (domain-specific uniqueness); a duplicate pod_code is rejected."

      - name: facility_site_default_status_available
        claim_type: defaults
        grounds: ["entities.FacilitySite.fields.site_status"]
        distinguishing_aspect: "POST /facility-sites without explicit site_status yields site_status == AVAILABLE (system default)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /facility-sites"
              payload: { site_name: "Defaults", address_line1: "9 D St", jurisdiction_code: "AZ-MARICOPA", zoning_class: "COMMERCIAL", max_occupancy: 30, indoor_sqft: 1200 }
              as: PlatformAdmin
              captures: { site_status: $.data.site_status }
          assert:
            - "site_status == AVAILABLE"

      - name: pod_computed_enrolled_count_input_ignored
        claim_type: computed_fields
        grounds: ["entities.Pod.fields.enrolled_count", "entities.Pod.fields.posture"]
        distinguishing_aspect: "On creation, enrolled_count == 0 and posture is system-computed (not client-set); any client-supplied enrolled_count is ignored."
        test_recipe:
          setup: ["FacilitySite exists."]
          setup_api_calls:
            - call: "POST /facility-sites"
              payload: { site_name: "Comp", address_line1: "3 C St", jurisdiction_code: "AZ-MARICOPA", zoning_class: "RESIDENTIAL_SINGLE", max_occupancy: 30, indoor_sqft: 1200 }
              as: PlatformAdmin
              captures: { site_id: $.data.id }
          trigger:
            - call: "POST /pods"
              payload: { name: "C", pod_code: "COMP26", academic_year: "2026-2027", term_start_date: "2026-08-01", term_end_date: "2027-05-31", seat_capacity: 8, tuition_full_year_cents: 500000, min_guides_required: 1, facility_site_id: "${site_id}", enrolled_count: 99 }
              as: PodOperator
              captures: { enrolled: $.data.enrolled_count, posture: $.data.posture, status: $.data.status }
          assert:
            - "enrolled_count == 0 (computed, input ignored)"
            - "status == DRAFT (system default)"
            - "posture is a valid enum value (server-computed)"

      - name: system_fields_id_created_at_updated_at_version
        claim_type: system_fields
        grounds: ["entities.Pod"]
        distinguishing_aspect: "Server mints id (UUID without prefix), created_at, updated_at, version=1 on creation; client-supplied values are ignored."
        test_recipe:
          setup: ["FacilitySite exists."]
          setup_api_calls:
            - call: "POST /facility-sites"
              payload: { site_name: "Sys", address_line1: "5 E St", jurisdiction_code: "AZ-MARICOPA", zoning_class: "RESIDENTIAL_SINGLE", max_occupancy: 30, indoor_sqft: 1200 }
              as: PlatformAdmin
              captures: { site_id: $.data.id }
          trigger:
            - call: "POST /pods"
              payload: { name: "SysPod", pod_code: "SYS26", academic_year: "2026-2027", term_start_date: "2026-08-01", term_end_date: "2027-05-31", seat_capacity: 8, tuition_full_year_cents: 500000, min_guides_required: 1, facility_site_id: "${site_id}" }
              as: PodOperator
              captures: { pod_id: $.data.id, ver: $.data.version, created: $.data.created_at }
          assert:
            - "pod_id matches UUID format and does not start with a type prefix"
            - "ver == 1"
            - "created is a valid ISO 8601 UTC timestamp"

      - name: seat_requires_valid_pod_parent
        claim_type: parent_relationships
        grounds: ["entities.Seat.fields.pod_id", 'endpoints.POST /pods/{id}/seats']
        distinguishing_aspect: "POST /pods/{non_existent_id}/seats returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["Family + Student exist; no pod exists."]
          setup_api_calls:
            - call: "POST /families"
              payload: { family_name: "Orphan", primary_contact_email: "o@x.com", billing_address_state: "AZ" }
              as: Registrar
              captures: { fam_id: $.data.id }
            - call: "POST /families/${fam_id}/students"
              payload: { legal_first_name: "Or", legal_last_name: "Phan", date_of_birth: "2017-01-01" }
              as: Registrar
              captures: { student_id: $.data.id }
          trigger:
            - call: "POST /pods/00000000-0000-0000-0000-000000000000/seats"
              payload: { student_id: "${student_id}", enrolled_on: "2026-09-01" }
              as: Registrar
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404 with error_id == ERR_NOT_FOUND"

      - name: get_pod_not_found_returns_404
        claim_type: not_found
        grounds: ['endpoints.GET /pods/{id}']
        distinguishing_aspect: "GET /pods/{non_existent_uuid} returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /pods/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: PodOperator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404, error_id == ERR_NOT_FOUND"

      - name: list_pods_returns_paginated_array
        claim_type: listing
        grounds: ['endpoints.GET /pods']
        distinguishing_aspect: "GET /pods honors limit/offset and returns total_count and has_more in the envelope."
        test_recipe:
          setup: ["3 pods exist."]
          setup_api_calls:
            - call: "POST /facility-sites"
              payload: { site_name: "Lp", address_line1: "7 F St", jurisdiction_code: "AZ-MARICOPA", zoning_class: "RESIDENTIAL_SINGLE", max_occupancy: 30, indoor_sqft: 1200 }
              as: PlatformAdmin
              captures: { site_id: $.data.id }
            - call: "POST /pods"
              payload: { name: "P1", pod_code: "P126", academic_year: "2026-2027", term_start_date: "2026-08-01", term_end_date: "2027-05-31", seat_capacity: 8, tuition_full_year_cents: 500000, min_guides_required: 1, facility_site_id: "${site_id}" }
              as: PodOperator
            - call: "POST /pods"
              payload: { name: "P2", pod_code: "P226", academic_year: "2026-2027", term_start_date: "2026-08-01", term_end_date: "2027-05-31", seat_capacity: 8, tuition_full_year_cents: 500000, min_guides_required: 1, facility_site_id: "${site_id}" }
              as: PodOperator
            - call: "POST /pods"
              payload: { name: "P3", pod_code: "P326", academic_year: "2026-2027", term_start_date: "2026-08-01", term_end_date: "2027-05-31", seat_capacity: 8, tuition_full_year_cents: 500000, min_guides_required: 1, facility_site_id: "${site_id}" }
              as: PodOperator
          trigger:
            - call: "GET /pods?limit=2&offset=0"
              payload: {}
              as: PodOperator
          assert:
            - "response envelope contains pagination fields limit, offset, total_count, has_more"
            - "total_count == 3; has_more == true when limit=2&offset=0"

  # =====================================================================
  # Section 2: State Machines
  # =====================================================================
  - section: state_machines
    instances:
      - name: pod_initial_state_is_draft
        claim_type: initial_state
        grounds: ["state_machines.Pod"]
        distinguishing_aspect: "A newly created Pod has status == DRAFT."
        test_recipe:
          setup: ["FacilitySite exists."]
          setup_api_calls:
            - call: "POST /facility-sites"
              payload: { site_name: "IS", address_line1: "1 IS St", jurisdiction_code: "AZ-MARICOPA", zoning_class: "RESIDENTIAL_SINGLE", max_occupancy: 30, indoor_sqft: 1200 }
              as: PlatformAdmin
              captures: { site_id: $.data.id }
          trigger:
            - call: "POST /pods"
              payload: { name: "IS Pod", pod_code: "ISPOD26", academic_year: "2026-2027", term_start_date: "2026-08-01", term_end_date: "2027-05-31", seat_capacity: 8, tuition_full_year_cents: 500000, min_guides_required: 1, facility_site_id: "${site_id}" }
              as: PodOperator
              captures: { status: $.data.status }
          assert:
            - "status == DRAFT"

      - name: pod_terminal_dissolved_lockdown
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.Pod"]
        distinguishing_aspect: "Once a pod is DISSOLVED, every subsequent transition attempt returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["Pod fully dissolved (all refund claims decided)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            # ... compose to DISSOLVED
          trigger:
            - call: "POST /pods/${pod_id}/open-enrollment"
              payload: {}
              as: PodOperator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 with error_id == ERR_INVALID_STATE"

      - name: seat_invalid_from_transition_rejected
        claim_type: invalid_transition
        grounds: ["state_machines.Seat"]
        distinguishing_aspect: "POST /pods/{id}/seats/{seat_id}/withdraw on a RESERVED (never ENROLLED) seat returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["Pod ACTIVE; a Seat in RESERVED state."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00Z" }
              as: PlatformAdmin
            # ... compose to RESERVED seat
          trigger:
            - call: "POST /pods/${pod_id}/seats/${seat_id}/withdraw"
              payload: { withdrawn_on: "2026-08-20" }
              as: Family
              as_user_id: "${fam_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409, error_id == ERR_INVALID_STATE (withdraw requires ENROLLED)"

      - name: licensing_determination_begin_review_precondition
        claim_type: precondition_enforcement
        grounds: ["state_machines.LicensingDetermination.transitions.SUBMITTED_to_UNDER_REVIEW"]
        distinguishing_aspect: "begin-review on an already-UNDER_REVIEW determination returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["Pod LICENSING_REVIEW; determination in UNDER_REVIEW."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            # ... compose: pod, policy, plan, open-enrollment, licensing-determinations, begin-review (already)
          trigger:
            - call: "POST /pods/${pod_id}/licensing-determinations/${det_id}/begin-review"
              payload: {}
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 ERR_INVALID_STATE"

      - name: invoice_paid_is_terminal
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.TuitionInvoice"]
        distinguishing_aspect: "A PAID invoice cannot transition further; write-off and issue attempts return ERR_INVALID_STATE."
        test_recipe:
          setup: ["Invoice fully paid (status PAID)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00Z" }
              as: PlatformAdmin
            # ... compose: pod ACTIVE, seat ENROLLED, invoice ISSUED, payment cleared for total
          trigger:
            - call: "POST /pods/${pod_id}/seats/${seat_id}/invoices/${inv_id}/write-off"
              payload: {}
              as: PodOperator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 ERR_INVALID_STATE (PAID is terminal)"

      - name: progress_conference_cycle_count_cap
        claim_type: precondition_enforcement
        grounds: ["state_machines.ProgressConference.transitions.NO_SHOW_to_RESCHEDULED", "errors[ERR_CONFERENCE_CYCLE_LIMIT]"]
        distinguishing_aspect: "When cycle_count reaches 3, further reschedule attempts return ERR_CONFERENCE_CYCLE_LIMIT (422)."
        test_recipe:
          setup: ["Conference in NO_SHOW with cycle_count == 3."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: PlatformAdmin
            # ... compose: conference that has been NO_SHOW -> RESCHEDULED -> SCHEDULED -> NO_SHOW three times
          trigger:
            - call: "POST /pods/${pod_id}/progress-conferences/${conf_id}/reschedule"
              payload: {}
              as: Family
              as_user_id: "${fam_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 422 ERR_CONFERENCE_CYCLE_LIMIT"

  # =====================================================================
  # Section 3: Calculations
  # =====================================================================
  - section: calculations
    instances:
      - name: tiered_admin_fee_correct_result
        claim_type: correct_result
        grounds: ["calculations.tiered_admin_fee"]
        distinguishing_aspect: "Given enrolled_count=8 and subtotal=109999, admin_fee_cents == 4400 (tier-1 4%)."
        test_recipe:
          setup: ["Pod ACTIVE with enrolled_count=8; invoice DRAFT with line_items yielding subtotal 109999."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00Z" }
              as: PlatformAdmin
            # ... compose
          trigger:
            - call: "POST /pods/${pod_id}/seats/${seat_id}/invoices/${inv_id}/issue"
              payload: {}
              as: PodOperator
              captures: { admin_fee: $.data.admin_fee_cents, subtotal: $.data.subtotal_cents }
          assert:
            - "subtotal == 109999 AND admin_fee == 4400"

      - name: prorated_tuition_input_set_filtering
        claim_type: input_set_filtering
        grounds: ["calculations.prorated_tuition"]
        distinguishing_aspect: "Only the seat being enrolled participates; other seats' tuition_basis does not affect the result."
        test_recipe:
          setup: ["Pod with one ENROLLED seat (prior); a second seat being enrolled mid-year."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /pods/${pod_id}/seats/${new_seat_id}/enroll"
              payload: { expected_pod_version: "${pod_v}" }
              as: Family
              as_user_id: "${fam2_id}"
          assert:
            - "prorated_due_cents for the new seat depends only on Pod.tuition_full_year_cents and term dates, not on any other seat."

      - name: esa_voucher_disbursement_boundary_constants
        claim_type: constants_applied
        grounds: ["calculations.esa_voucher_disbursement"]
        distinguishing_aspect: "The 50% FUNDED threshold is applied exactly as specified; inclusive at the boundary."
        test_recipe:
          setup: ["VoucherAccount VERIFIED awarded=600000."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /pods/${pod_id}/seats/${seat_id}/invoices/${inv_id}/payments"
              payload: { source_kind: "VOUCHER", amount_cents: 300000, voucher_account_id: "${va_id}" }
              as: Registrar
              captures: { p: $.data.id }
            - call: "POST /payments/${p}/clear"
              payload: {}
              as: PodOperator
          assert:
            - "funding_status remains FUNDED at balance == 300000 (== awarded * 0.50)"

      - name: dissolution_refund_pool_waterfall_order
        claim_type: correct_result
        grounds: ["calculations.dissolution_refund_pool"]
        distinguishing_aspect: "Bucket 1 (voucher reimbursements) fills before bucket 2 (family direct); pro-rata within bucket; rounding remainder to earliest created_at seat."
        test_recipe:
          setup: ["Pod ACTIVE with seats funded by both FAMILY and VOUCHER sources; pool smaller than total claims."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-15T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /pods/${pod_id}/dissolve"
              payload: { expected_pod_version: "${pod_v}", dissolution_reason: "test" }
              as: PodOperator
          assert:
            - "Voucher-sourced claims receive full reimbursement before any family-direct claim is paid"
            - "Rounding remainder is allocated to the seat with the earliest created_at"

  # =====================================================================
  # Section 4: Validations
  # =====================================================================
  - section: validations
    instances:
      - name: unauthenticated_missing_role_header
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "Missing X-User-Role header returns 401 ERR_UNAUTHENTICATED."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /pods"
              payload: {}
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 401 ERR_UNAUTHENTICATED"

      - name: forbidden_role_for_platform_admin_endpoint
        claim_type: violation_to_error
        grounds: ["validations[priority=2]", "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "A Family role calling POST /facility-sites returns 403 ERR_FORBIDDEN."
        test_recipe:
          setup: ["Family exists."]
          setup_api_calls:
            - call: "POST /families"
              payload: { family_name: "F1", primary_contact_email: "f1@x.com", billing_address_state: "AZ" }
              as: Registrar
              captures: { fam_id: $.data.id }
          trigger:
            - call: "POST /facility-sites"
              payload: { site_name: "Bad", address_line1: "x", jurisdiction_code: "AZ", zoning_class: "RESIDENTIAL_SINGLE", max_occupancy: 10, indoor_sqft: 500 }
              as: Family
              as_user_id: "${fam_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 403 ERR_FORBIDDEN"

      - name: enrollment_out_of_term_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=15]", "errors[ERR_ENROLLMENT_OUT_OF_TERM]"]
        distinguishing_aspect: "Seat.enrolled_on before Pod.term_start_date returns 422 ERR_ENROLLMENT_OUT_OF_TERM."
        test_recipe:
          setup: ["Pod ACTIVE; family+student exist."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /pods/${pod_id}/seats"
              payload: { student_id: "${student_id}", enrolled_on: "2026-07-01" }
              as: Registrar
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 422 ERR_ENROLLMENT_OUT_OF_TERM"

      - name: insufficient_voucher_funds_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=19]", "errors[ERR_INSUFFICIENT_VOUCHER_FUNDS]"]
        distinguishing_aspect: "Voucher-sourced payment exceeding disbursable_balance_cents returns 422 ERR_INSUFFICIENT_VOUCHER_FUNDS."
        test_recipe: { setup: ["Voucher with balance 50000; invoice total 100000."], setup_api_calls: [] , trigger: [], assert: [] }
        # fill in via difficulty instance voucher_funded_threshold_50pct's family; this is a stub of the positive-side check

      - name: overpayment_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=20]", "errors[ERR_OVERPAYMENT]"]
        distinguishing_aspect: "Clearing a payment that would push invoice paid_cents > total_cents returns 422 ERR_OVERPAYMENT."
        test_recipe:
          setup: ["Invoice ISSUED total=100000, already 80000 cleared; a second payment for 30000 is pending."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /payments/${pay2}/clear"
              payload: {}
              as: PodOperator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 422 ERR_OVERPAYMENT"

      - name: refund_exceeds_claim_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=21]", "errors[ERR_REFUND_EXCEEDS_CLAIM]"]
        distinguishing_aspect: "RefundClaim decide with approved_amount_cents > claimed_amount_cents returns 422 ERR_REFUND_EXCEEDS_CLAIM."
        test_recipe:
          setup: ["Claim UNDER_REVIEW with claimed_amount_cents == 50000."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /pods/${pod_id}/refund-claims/${claim_id}/decide"
              payload: { decision: "APPROVED", approved_amount_cents: 60000 }
              as: Registrar
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 422 ERR_REFUND_EXCEEDS_CLAIM"

      - name: segregation_of_duties_reviewer_equals_filer
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_SEGREGATION_OF_DUTIES]"]
        distinguishing_aspect: "Reviewer X-User-ID equal to filed_by_user_id returns 422 ERR_SEGREGATION_OF_DUTIES."
        test_recipe:
          setup: ["Claim FILED by user R1; R1 then attempts to decide it."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /pods/${pod_id}/refund-claims/${claim_id}/decide"
