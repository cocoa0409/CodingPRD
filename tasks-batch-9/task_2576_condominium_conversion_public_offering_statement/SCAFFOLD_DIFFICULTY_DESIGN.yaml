            - call: "GET /declaration-packages/${dp_id}/assessment-allocation"
              payload: {}
              as: ConverterSponsor
          assert:
            - "executed FLOOR_THEN_RESIDUAL_SWEEP on base areas 3333 / 3333 / 3334 (sum 10000): raw_bp = 10000 * base / 10000 gives 3333.0 / 3333.0 / 3334.0, floors 3333 / 3333 / 3334, residual 10000 - 9999 - 1 == 0, so nothing is swept"
            - "read 1 (three INCLUDED units): Unit.${u1_id}.percentage_interest_bp == 3333 and Unit.${u2_id}.percentage_interest_bp == 3333 and Unit.${u3_id}.percentage_interest_bp == 3334"
            - "read 1: the three returned percentage_interest_bp values sum to exactly 10000 and ConversionProject.${proj_id}.bp_conservation_total == 10000"
            - "withdraw call: HTTP 200 and Unit.${u3_id}.declaration_status == WITHDRAWN"
            - "read 2 (two INCLUDED units): the response contains exactly two rows, and Unit.${u1_id}.percentage_interest_bp == 5000 and Unit.${u2_id}.percentage_interest_bp == 5000  # executed re-sweep over base sum 6666: raw 10000 * 3333 / 6666 == 5000.0 twice, floors 5000 / 5000, residual 0"
            - "read 2: Unit.${u3_id}.percentage_interest_bp == 0 and Unit.${u3_id}.unit_annual_assessment_cents == 0 and Unit.${u3_id}.unit_monthly_assessment_cents == 0  # a WITHDRAWN unit is zeroed, not merely omitted from the read"
            - "read 2: the two returned rows still sum to exactly 10000 and ConversionProject.${proj_id}.bp_conservation_total == 10000 - the conserved quantity is the 10000 bp of undivided interest, and it is whole at every intermediate step, not only at the end"
            - "read 2: ConversionProject.${proj_id}.included_unit_count == 2 while ConversionProject.${proj_id}.total_unit_count == 3"
            - "reinstate call: HTTP 200 and Unit.${u3_id}.declaration_status == INCLUDED"
            - "read 3 (restoration): Unit.${u1_id}.percentage_interest_bp == 3333 and Unit.${u2_id}.percentage_interest_bp == 3333 and Unit.${u3_id}.percentage_interest_bp == 3334 - byte-identical to read 1 per-unit, not merely re-summing to 10000; an implementation that re-sweeps the residual to a different tiebreak winner would return 3334 / 3333 / 3333 and pass a total-only check while failing this line"
            - "read 3: Unit.${u1_id}.unit_annual_assessment_cents and Unit.${u2_id}.unit_annual_assessment_cents and Unit.${u3_id}.unit_annual_assessment_cents are each identical to their read-1 values, and the same unit absorbs the assessment rounding residual in read 3 as in read 1"
            - "read 3: the three rows sum to exactly 10000, ConversionProject.${proj_id}.bp_conservation_total == 10000 and ConversionProject.${proj_id}.included_unit_count == 3"
            - "end state: DeclarationPackage.${dp_id}.status == DRAFT - the withdraw demoted it from PLAT_CERTIFIED to DRAFT and the reinstate does NOT restore PLAT_CERTIFIED; the bp allocation is restored exactly but the certification is deliberately not, so a blanket undo of every withdraw side-effect is wrong"
            - "end state: Unit.${u1_id}.version, Unit.${u2_id}.version and Unit.${u3_id}.version are each strictly greater than their read-1 values - the restoration is achieved by two real recomputations, not by rolling the rows back"
