        distinguishing_aspect: "A Customer approving a QUOTED RepairOrder owned by a different customer_id returns ERR_FORBIDDEN (entity-backed ownership)."
        test_recipe:
          setup: ["Customer A owns a QUOTED RepairOrder; Customer B is a different customer."]
