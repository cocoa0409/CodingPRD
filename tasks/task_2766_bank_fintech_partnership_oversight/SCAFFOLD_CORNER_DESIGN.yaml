# =============================================================================
# §1.9 Scaffold Corner Design (Breadth Coverage Index)
# Task: task_2766_bank_fintech_partnership_oversight
#
# Breadth probe over the whole §1.1–§1.7 surface: every endpoint, validation,
# error code, RBAC cell, state-machine edge and response-shape rule that is
# testable from empty-DB state. Sections and claim_type values are taken
# verbatim from references/claim-extraction-guide.md.
#
# Fixture conventions used throughout:
#   logical clock            2026-08-01T00:00:00Z (POST /_clock/set_current_utc)
#   ProgramOfficer  user id  "po-alice"   (drafts / submits / books ledger)
#   ComplianceOfficer id     "co-brett"   (decides diligence, marketing, alerts)
#   RiskCommittee    id      "rc-dana"    (executes agreements, decides plans)
#   InternalAudit    id      "ia-erin"    (reconciles / clears variances)
#   FintechPartner   id      the Partner.id itself (identity: entity_backed)
#
# Mainline partner A ("Northbeam Pay Inc") is CARD_ISSUING so that
# marketing_risk_flags is empty by default; agreement caps are
# reserve_requirement_bps=500, concentration_cap_pct=80.00,
# max_end_user_balance_cents=500000000, monthly_growth_cap_pct=50.00.
#
# Reserve arithmetic used by every chain that reaches LIVE (computed against
# calculations.required_reserve_cents):
#   after EXECUTE  fbo=0 reserve=0  posture_in=OPEN
#                  base=max(0, 0, 250000)=250000  scaled=250000
#                  required=250000  shortfall=250000  -> posture HEIGHTENED
#   after RESERVE_FUND +312500      posture_in=HEIGHTENED
#                  base=250000  scaled=floor(250000*1.25)=312500
#                  required=312500  shortfall=0      -> posture OPEN
#   => 312500 is the exact reserve top-up that unblocks go-live.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: partner_create_returns_every_declared_field_at_its_declared_default
        claim_type: Creation
        grounds:
          - entities.Partner
          - endpoints.POST_/oversight/partners
          - response_envelope.success
        distinguishing_aspect: "A Partner created with only the six required inputs comes back 201 with status PROSPECT, oversight_posture OPEN, capability_tier UNRATED, version 1, parent_partner_id null and all twelve computed counters at their declared zero defaults — none of which the client supplied."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z. Empty database."
          setup_api_calls:
            - &q_clock
              call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramOfficer
              as_user_id: "po-alice"
          trigger:
            - &q_partner_a
              call: "POST /oversight/partners"
              payload: { legal_name: "Northbeam Pay Inc", business_model: "CARD_ISSUING", funding_stage: "SERIES_B_PLUS", months_runway: 24, disclosed_complaints_per_10k: 12.50, end_user_account_count: 100000 }
              as: ProgramOfficer
              as_user_id: "po-alice"
              captures: { pa_id: $.data.id, pa_v1: $.data.version }
          assert:
            - "the response status is 201 and response_type is object"
            - "Partner.${pa_id}.legal_name == \"Northbeam Pay Inc\" and business_model == CARD_ISSUING"
            - "Partner.${pa_id}.status == PROSPECT"
            - "Partner.${pa_id}.oversight_posture == OPEN and capability_tier == UNRATED"
            - "Partner.${pa_id}.version == 1"
            - "Partner.${pa_id}.parent_partner_id is null"
            - "Partner.${pa_id}.latest_composite_score == 0.0 and complaint_rate_bps == 0"
            - "Partner.${pa_id}.required_reserve_cents == 0 and reserve_shortfall_cents == 0"
            - "Partner.${pa_id}.concentration_ratio_pct == 0.00 and cumulative_paid_out_cents == 0"
            - "Partner.${pa_id}.created_by_user_id == \"po-alice\""
            - "meta.api_request_id and meta.api_request_timestamp are present on the response"

      - name: partner_get_by_id_round_trips_the_stored_record
        claim_type: Retrieval
        grounds:
          - entities.Partner
          - endpoints.GET_/oversight/partners/{id}
        distinguishing_aspect: "GET /oversight/partners/{id} returns the same field values POST stored, including the 2-decimal disclosed_complaints_per_10k of 12.50 and end_user_account_count 100000, and it is readable by InternalAudit which never wrote it."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z. Partner A registered, still PROSPECT."
          setup_api_calls:
            - *q_clock
            - *q_partner_a
          trigger:
            - call: "GET /oversight/partners/${pa_id}"
              payload: {}
              as: InternalAudit
              as_user_id: "ia-erin"
          assert:
            - "the response status is 200 and response_type is object"
            - "Partner.${pa_id}.disclosed_complaints_per_10k == 12.50"
            - "Partner.${pa_id}.end_user_account_count == 100000"
            - "Partner.${pa_id}.months_runway == 24 and funding_stage == SERIES_B_PLUS"
            - "Partner.${pa_id}.created_at and updated_at are non-null"

      - name: partners_list_paginates_filters_and_reports_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints.GET_/oversight/partners
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
          - entities.Partner.fields.parent_partner_id
        distinguishing_aspect: "With three partners on file — one group root and two children of it — limit=2&offset=0 returns 2 rows with total_count 3 and has_more true, offset=2 returns 1 row with has_more false, and parent_partner_id=${pa_id} returns exactly the 2 children: total_count counts the filtered set, never the page."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z. Partner A plus two subsidiaries whose parent_partner_id is A."
          setup_api_calls:
            - *q_clock
            - *q_partner_a
            - call: "POST /oversight/partners"
              payload: { legal_name: "Northbeam Lending LLC", business_model: "LENDING", funding_stage: "SERIES_A", months_runway: 18, disclosed_complaints_per_10k: 30.00, end_user_account_count: 5000, parent_partner_id: "${pa_id}" }
              as: ProgramOfficer
              as_user_id: "po-alice"
              captures: { pb_id: $.data.id }
            - call: "POST /oversight/partners"
              payload: { legal_name: "Northbeam Wallet LLC", business_model: "DEPOSIT_WALLET", funding_stage: "SEED", months_runway: 9, disclosed_complaints_per_10k: 0.00, end_user_account_count: 0, parent_partner_id: "${pa_id}" }
              as: ProgramOfficer
              as_user_id: "po-alice"
              captures: { pc_id: $.data.id }
          trigger:
            - call: "GET /oversight/partners"
              payload: { limit: 2, offset: 0 }
              as: RiskCommittee
              as_user_id: "rc-dana"
          assert:
            - "the response status is 200 and response_type is array"
            - "the response returns exactly 2 rows with total_count == 3 and has_more == true"
            - "GET /oversight/partners?limit=2&offset=2 returns exactly 1 row with total_count == 3 and has_more == false"
            - "GET /oversight/partners?parent_partner_id=${pa_id} returns exactly 2 rows, Partner.${pb_id} and Partner.${pc_id}"
            - "GET /oversight/partners?status=PROSPECT returns 3 rows"
            - "GET /oversight/partners?business_model=DEPOSIT_WALLET returns exactly 1 row, Partner.${pc_id}"
            - "GET /oversight/partners with no query parameters returns 3 rows with limit defaulting to 10 and offset to 0"

      - name: partner_get_with_an_unknown_id_returns_partner_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/oversight/partners/{id}
          - errors.ERR_PARTNER_NOT_FOUND
          - validations.priority_8
        distinguishing_aspect: "A syntactically valid but unallocated path id produces the entity-specific 404 ERR_PARTNER_NOT_FOUND from the priority-8 path-existence sweep, not a generic 404 and not a 422 ERR_VALIDATION."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z. No Partner has been created."
          setup_api_calls:
            - *q_clock
          trigger:
            - call: "GET /oversight/partners/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: ProgramOfficer
              as_user_id: "po-alice"
              captures: { err_notfound: $.data.error_id }
          assert:
            - "the response status is 404 and err_notfound == ERR_PARTNER_NOT_FOUND"
            - "response_type is error and data carries both error_id and message"
            - "err_notfound != ERR_VALIDATION"

      - name: every_collection_reports_its_own_not_found_code_on_an_unknown_path_id
        claim_type: Not Found
        grounds:
          - errors.ERR_REVIEW_NOT_FOUND
          - errors.ERR_AGREEMENT_NOT_FOUND
          - errors.ERR_MARKETING_REVIEW_NOT_FOUND
          - errors.ERR_CUSTODY_ACCOUNT_NOT_FOUND
          - errors.ERR_BATCH_NOT_FOUND
          - errors.ERR_LEDGER_ENTRY_NOT_FOUND
          - errors.ERR_COMPLAINT_NOT_FOUND
          - errors.ERR_ALERT_NOT_FOUND
          - errors.ERR_CYCLE_NOT_FOUND
          - errors.ERR_PLAN_NOT_FOUND
          - validations.priority_8
        distinguishing_aspect: "Priority 8 emits a per-collection 404, so the ten sibling GET-by-id endpoints return ten DISTINCT error_ids for the same unallocated uuid — no collection falls back to ERR_PARTNER_NOT_FOUND."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z. Empty database — no row exists in any collection."
          setup_api_calls:
            - *q_clock
          trigger:
            - call: "GET /oversight/diligence-reviews/00000000-0000-4000-8000-000000000002"
              payload: {}
              as: InternalAudit
              as_user_id: "ia-erin"
              captures: { err_review: $.data.error_id }
            - call: "GET /oversight/agreements/00000000-0000-4000-8000-000000000003"
              payload: {}
              as: InternalAudit
              as_user_id: "ia-erin"
              captures: { err_agreement: $.data.error_id }
            - call: "GET /oversight/marketing-reviews/00000000-0000-4000-8000-000000000004"
              payload: {}
              as: InternalAudit
              as_user_id: "ia-erin"
              captures: { err_marketing: $.data.error_id }
            - call: "GET /oversight/custody-accounts/00000000-0000-4000-8000-000000000005"
              payload: {}
              as: InternalAudit
              as_user_id: "ia-erin"
              captures: { err_custody: $.data.error_id }
            - call: "GET /oversight/settlement-batches/00000000-0000-4000-8000-000000000006"
              payload: {}
              as: InternalAudit
              as_user_id: "ia-erin"
              captures: { err_batch: $.data.error_id }
            - call: "GET /oversight/ledger-entries/00000000-0000-4000-8000-000000000007"
              payload: {}
              as: InternalAudit
              as_user_id: "ia-erin"
              captures: { err_ledger: $.data.error_id }
            - call: "GET /oversight/complaints/00000000-0000-4000-8000-000000000008"
              payload: {}
              as: InternalAudit
              as_user_id: "ia-erin"
              captures: { err_complaint: $.data.error_id }
            - call: "GET /oversight/alerts/00000000-0000-4000-8000-000000000009"
              payload: {}
              as: InternalAudit
              as_user_id: "ia-erin"
              captures: { err_alert: $.data.error_id }
            - call: "GET /oversight/cycles/00000000-0000-4000-8000-00000000000a"
              payload: {}
              as: InternalAudit
              as_user_id: "ia-erin"
              captures: { err_cycle: $.data.error_id }
            - call: "GET /oversight/wind-down-plans/00000000-0000-4000-8000-00000000000b"
              payload: {}
              as: InternalAudit
              as_user_id: "ia-erin"
              captures: { err_plan: $.data.error_id }
          assert:
            - "every one of the ten responses has status 404 and response_type error"
            - "err_review == ERR_REVIEW_NOT_FOUND and err_agreement == ERR_AGREEMENT_NOT_FOUND"
            - "err_marketing == ERR_MARKETING_REVIEW_NOT_FOUND and err_custody == ERR_CUSTODY_ACCOUNT_NOT_FOUND"
            - "err_batch == ERR_BATCH_NOT_FOUND and err_ledger == ERR_LEDGER_ENTRY_NOT_FOUND"
            - "err_complaint == ERR_COMPLAINT_NOT_FOUND and err_alert == ERR_ALERT_NOT_FOUND"
            - "err_cycle == ERR_CYCLE_NOT_FOUND and err_plan == ERR_PLAN_NOT_FOUND"
            - "none of the ten error_ids equals ERR_PARTNER_NOT_FOUND"

      - name: partner_create_missing_business_model_returns_validation
        claim_type: Required Fields
        grounds:
          - entities.Partner.fields.business_model
          - endpoints.POST_/oversight/partners
          - validations.priority_18
          - errors.ERR_VALIDATION
        distinguishing_aspect: "business_model is source: input with no default, so omitting it is a 422 ERR_VALIDATION at priority 18 — not a 400, not a 404, and no Partner row is persisted."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z. Empty database."
          setup_api_calls:
            - *q_clock
          trigger:
            - call: "POST /oversight/partners"
              payload: { legal_name: "Omission Fintech Inc", funding_stage: "SEED", months_runway: 6, disclosed_complaints_per_10k: 0.00, end_user_account_count: 0 }
              as: ProgramOfficer
              as_user_id: "po-alice"
              captures: { err_required: $.data.error_id }
          assert:
            - "the response status is 422 and err_required == ERR_VALIDATION"
            - "GET /oversight/partners returns 0 rows with total_count == 0"

      - name: partner_create_omitting_optional_fields_applies_declared_defaults
        claim_type: Defaults
        grounds:
          - entities.Partner.fields.parent_partner_id
          - entities.Partner.fields.end_user_account_count
          - entities.Partner.fields.status
          - entities.Partner.fields.oversight_posture
        distinguishing_aspect: "parent_partner_id is the ONLY optional body field on POST /oversight/partners, and omitting it must store null — a group root — rather than rejecting the create or inventing a self-reference. Every other declared default is a system default the client cannot influence, and an end_user_account_count of 0 makes calculations.complaint_rate_bps apply its DENOMINATOR_FLOOR of 1 so a single complaint reads exactly 10000 bps rather than dividing by zero."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z. Empty database."
          setup_api_calls:
            - *q_clock
          trigger:
            - call: "POST /oversight/partners"
              payload: { legal_name: "Bare Minimum Pay Inc", business_model: "PAYMENT_FACILITATION", funding_stage: "SEED", months_runway: 0, disclosed_complaints_per_10k: 0.00, end_user_account_count: 0 }
              as: ProgramOfficer
              as_user_id: "po-alice"
              captures: { pd_id: $.data.id }
          assert:
            - "the response status is 201"
            - "Partner.${pd_id}.parent_partner_id is null — the omitted optional field defaults to null and the Partner is its own group root, so calculations.concentration_ratio_pct resolves the group to this single row"
            - "Partner.${pd_id}.end_user_account_count == 0 as supplied — §1.5 declares it REQUIRED on the create, so a 0 must be accepted rather than treated as absent"
            - "Partner.${pd_id}.status == PROSPECT and oversight_posture == OPEN and capability_tier == UNRATED"
            - "after POST /oversight/complaints for Partner.${pd_id} with channel EMAIL, received_at 2026-07-06T00:00:00Z, Partner.${pd_id}.complaint_rate_bps == 10000"

      - name: complaint_computed_fields_are_derived_and_never_client_supplied
        claim_type: Computed Fields
        grounds:
          - entities.Complaint.fields.response_due_at
          - entities.Complaint.fields.handling_owner
          - calculations.complaint_response_due_at
          - endpoints.POST_/oversight/complaints
        distinguishing_aspect: "Complaint.response_due_at and handling_owner are source: computed, so a CFPB_PORTAL complaint received at 2026-07-20T09:30:00Z gets response_due_at 2026-08-04T09:30:00.000Z (15 CALENDAR days, time-of-day preserved) and handling_owner BANK because no EXECUTED ProgramAgreement exists — both values ignore anything the client sends."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z. Partner A registered, still PROSPECT, no agreement of any kind."
          setup_api_calls:
            - *q_clock
            - *q_partner_a
          trigger:
            - call: "POST /oversight/complaints"
              payload: { partner_id: "${pa_id}", channel: "CFPB_PORTAL", category: "FEES", severity: "MEDIUM", received_at: "2026-07-20T09:30:00Z", narrative: "Monthly maintenance fee charged twice in July.", is_reg_e_dispute: false }
              as: ComplianceOfficer
              as_user_id: "co-brett"
              captures: { cmp_cfpb_id: $.data.id }
          assert:
            - "the response status is 201"
            - "Complaint.${cmp_cfpb_id}.response_due_at == \"2026-08-04T09:30:00.000Z\""
            - "Complaint.${cmp_cfpb_id}.handling_owner == BANK"
            - "Complaint.${cmp_cfpb_id}.status == RECEIVED and root_cause_code is null and escalation_count == 0"
            - "Complaint.${cmp_cfpb_id}.redress_cents == 0 and resolved_at is null"
            - "Partner.${pa_id}.total_complaint_count == 1 and open_complaint_count == 1"
            - "Partner.${pa_id}.complaint_rate_bps == 0 — 1 complaint over an end_user_account_count of 100000 rounds to 0 bps"

      - name: complaint_system_fields_are_server_generated_and_extra_field_client_input_ignored
        claim_type: System Fields
        grounds:
          - entities.Complaint.fields.status
          - entities.Complaint.fields.resolved_at
          - endpoints.POST_/oversight/complaints
          - response_envelope.success
        distinguishing_aspect: "Complaint.status, resolved_at, id, created_at, updated_at and version are all source: system. A create body that also carries status RESOLVED, resolved_at, escalation_count 7 and version 99 — none of which appear in the endpoint's declared input list — is ignored: the row lands RECEIVED, version 1, resolved_at null."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z. Partner A registered."
          setup_api_calls:
            - *q_clock
            - *q_partner_a
          trigger:
            - call: "POST /oversight/complaints"
              payload: { partner_id: "${pa_id}", channel: "BANK_CALL_CENTER", category: "SERVICING", severity: "LOW", received_at: "2026-07-02T12:00:00Z", narrative: "Call centre could not locate the account.", is_reg_e_dispute: false, status: "RESOLVED", resolved_at: "2026-07-03T00:00:00Z", escalation_count: 7, version: 99 }
              as: ProgramOfficer
              as_user_id: "po-alice"
              captures: { cmp_sys_id: $.data.id }
          assert:
            - "the response status is 201"
            - "Complaint.${cmp_sys_id}.status == RECEIVED and resolved_at is null"
            - "Complaint.${cmp_sys_id}.escalation_count == 0 and version == 1"
            - "Complaint.${cmp_sys_id}.response_due_at == \"2026-08-01T12:00:00.000Z\" — 30 CALENDAR days from received_at"
            - "Complaint.${cmp_sys_id}.id, created_at and updated_at are non-null server values"

      - name: partner_create_with_an_out_of_enum_funding_stage_returns_validation
        claim_type: Type Constraints
        grounds:
          - entities.Partner.fields.funding_stage
          - entities.Partner.fields.months_runway
          - validations.priority_18
          - errors.ERR_VALIDATION
        distinguishing_aspect: "funding_stage is a closed four-member enum and months_runway is bounded 0..120, so funding_stage SERIES_C and months_runway 121 are each rejected at priority 18 with 422 ERR_VALIDATION rather than being coerced or stored."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z. Empty database."
          setup_api_calls:
            - *q_clock
          trigger:
            - call: "POST /oversight/partners"
              payload: { legal_name: "Bad Enum Fintech Inc", business_model: "LENDING", funding_stage: "SERIES_C", months_runway: 24, disclosed_complaints_per_10k: 5.00, end_user_account_count: 100 }
              as: ProgramOfficer
              as_user_id: "po-alice"
              captures: { err_enum: $.data.error_id }
            - call: "POST /oversight/partners"
              payload: { legal_name: "Out Of Range Fintech Inc", business_model: "LENDING", funding_stage: "SEED", months_runway: 121, disclosed_complaints_per_10k: 5.00, end_user_account_count: 100 }
              as: ProgramOfficer
              as_user_id: "po-alice"
              captures: { err_range: $.data.error_id }
          assert:
            - "the first response status is 422 and err_enum == ERR_VALIDATION"
            - "the second response status is 422 and err_range == ERR_VALIDATION"
            - "GET /oversight/partners returns 0 rows with total_count == 0"

      - name: pagination_limit_above_the_declared_maximum_returns_validation
        claim_type: Type Constraints
        grounds:
          - response_envelope.pagination_defaults
          - validations.priority_18
          - errors.ERR_VALIDATION
          - endpoints.GET_/oversight/partners
        distinguishing_aspect: "The §1.0 pagination bounds are enforced by priority 18: limit=101 and limit=0 are both 422 ERR_VALIDATION, while limit=100 (the declared maximum) and limit=1 (the declared minimum) succeed — the server never silently clamps."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z. Partner A registered so the list is non-empty."
          setup_api_calls:
            - *q_clock
            - *q_partner_a
          trigger:
            - call: "GET /oversight/partners"
              payload: { limit: 101, offset: 0 }
              as: ProgramOfficer
              as_user_id: "po-alice"
              captures: { err_limit_high: $.data.error_id }
            - call: "GET /oversight/partners"
              payload: { limit: 0, offset: 0 }
              as: ProgramOfficer
              as_user_id: "po-alice"
              captures: { err_limit_low: $.data.error_id }
          assert:
            - "both responses have status 422 and err_limit_high == err_limit_low == ERR_VALIDATION"
            - "GET /oversight/partners?limit=100 returns 200 with 1 row and total_count == 1"
            - "GET /oversight/partners?limit=1 returns 200 with 1 row and has_more == false"

      - name: ledger_entry_is_append_only_with_no_version_and_a_monotonic_sequence_no
        claim_type: Immutability
        grounds:
          - entities.LedgerEntry
          - entities.LedgerEntry.fields.sequence_no
          - endpoints.POST_/oversight/ledger-entries
          - endpoints.GET_/oversight/ledger-entries
        distinguishing_aspect: "LedgerEntry declares common_fields: false, so its rows carry NO version and NO updated_at and §1.5 exposes no update or delete endpoint for the collection; correction is expressed only by appending another row, and sequence_no is the per-custody-account insertion index 1 then 2."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z. Cycle 2026-08 OPEN. Partner A CONTRACTED with both custody accounts ACTIVE."
          setup_api_calls:
            - *q_clock
            - &q_cycle_aug
              call: "POST /oversight/cycles"
              payload: { cycle_label: "2026-08", period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z" }
              as: ProgramOfficer
              as_user_id: "po-alice"
              captures: { cyc_aug_id: $.data.id, cyc_aug_index: $.data.cycle_index }
            - *q_partner_a
            - &q_dr_a
              call: "POST /oversight/diligence-reviews"
              payload: { partner_id: "${pa_id}", review_type: "INITIAL", business_model_score: 80, funding_score: 80, compliance_capability_score: 90, complaint_history_score: 85, expected_partner_version: "${pa_v1}" }
              as: ProgramOfficer
              as_user_id: "po-alice"
              captures: { dr_a_id: $.data.id }
            - &q_dr_a_submit
              call: "POST /oversight/diligence-reviews/${dr_a_id}/submit"
              payload: { submission_note: "Initial underwrite package complete." }
              as: ProgramOfficer
              as_user_id: "po-alice"
            - &q_dr_a_pass
              call: "POST /oversight/diligence-reviews/${dr_a_id}/decide"
              payload: { outcome: "PASSED", decision_note: "Composite 84.5, TIER_2." }
              as: ComplianceOfficer
              as_user_id: "co-brett"
            - &q_pa_read_passed
              call: "GET /oversight/partners/${pa_id}"
              payload: {}
              as: ProgramOfficer
