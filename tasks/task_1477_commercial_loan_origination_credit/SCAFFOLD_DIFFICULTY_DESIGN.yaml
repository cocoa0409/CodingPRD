            - { call: "POST /credit/document-checklist-items/${doc1}/transition", payload: { to: RECEIVED }, as: CreditAdministrator, as_user_id: "${adm}" }
            - { call: "POST /credit/document-checklist-items/${doc1}/transition", payload: { to: APPROVED }, as: CreditAdministrator, as_user_id: "${adm}" }
            - { call: "POST /credit/covenants", payload: { loan_application_id: "${app}", covenant_type: DSCR_MIN, threshold_value: 1.25, frequency: QUARTERLY }, as: CreditAdministrator, as_user_id: "${adm}" }
            - { call: "POST /credit/document-checklist-items", payload: { loan_application_id: "${app}", category: CLOSING_CONDITION, label: "Evidence of insurance" }, as: CreditAdministrator, as_user_id: "${adm}", captures: { cc1: $.data.id } }
            - { call: "POST /credit/loan-applications/${app}/submit-for-closing", payload: {}, as: CreditAdministrator, as_user_id: "${adm}" }
            - { call: "POST /credit/funding-authorizations", payload: { loan_application_id: "${app}", amount_cents: 24000000, disbursement_date: "2026-08-15" }, as: CreditAdministrator, as_user_id: "${adm}", captures: { fa: $.data.id } }
            - { call: "POST /credit/funding-authorizations/${fa}/authorize", payload: {}, as: CreditPolicyOfficer, as_user_id: "${po}" }
          trigger:
            - { call: "POST /credit/funding-authorizations/${fa}/release", payload: {}, as: CreditAdministrator, as_user_id: "${adm}", captures: { err1: $.data.error_id } }
            - { call: "GET /credit/loan-applications/${app}/policy-exceptions?rule_code=LTV_MAXIMUM&status=OPEN", as: CreditPolicyOfficer, as_user_id: "${po}", captures: { exc1: "$.data[0].id" } }
            - { call: "POST /credit/policy-exceptions/${exc1}/waive", payload: { waiver_rationale: "Sized-down facility restores policy LTV compliance" }, as: CreditPolicyOfficer, as_user_id: "${po}" }
            - { call: "GET /credit/loan-applications/${app}/policy-exceptions?rule_code=COLLATERAL_COVERAGE_MIN&status=OPEN", as: CreditPolicyOfficer, as_user_id: "${po}", captures: { exc2: "$.data[0].id" } }
            - { call: "POST /credit/policy-exceptions/${exc2}/waive", payload: { waiver_rationale: "Coverage shortfall accepted on sized-down commitment" }, as: CreditPolicyOfficer, as_user_id: "${po}" }
            - { call: "POST /credit/funding-authorizations/${fa}/release", payload: {}, as: CreditAdministrator, as_user_id: "${adm}", captures: { err2: $.data.error_id } }
          assert:
            - "LoanApplication.${app}.proposed_amount_cents == 24000000 (LTV cap floor(30,000,000 x 0.80) bound the sizing)"
            - "first release: status 403, error_id == ERR_UNRESOLVED_POLICY_EXCEPTION (safety, priority 12) — NOT ERR_CHECKLIST_INCOMPLETE (constraint, priority 25), though both are violated"
            - "FundingAuthorization.${fa}.status == AUTHORIZED still (rejected release leaves state untouched)"
            - "after waiving both HIGH exceptions, second release: status 409, error_id == ERR_CHECKLIST_INCOMPLETE (the constraint error now surfaces — proving the original ordering was not alphabetical or arbitrary)"
            - "the CLOSING_CONDITION item ${cc1} remains PENDING throughout"

  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: dscr_policy_floor_inclusive_boundary
        grounds:
          - calculations.dscr_computation
          - validations[priority=14]
          - entities.LoanApplication.fields.dscr_standard
          - state_machines.LoanApplication.SPREADING_to_EXCEPTION_REVIEW
          - state_machines.LoanApplication.SPREADING_to_APPRAISAL_REVIEW
        distinguishing_aspect: |
          Metric = DSCR policy-floor ratio (4dp round_half_up), endpoint =
          POST /credit/loan-applications/{id}/finalize-spreads. Two
          applications differ only in EBITDA: cf 12,035,540 / 9,628,432 lands
          EXACTLY on 1.2500 (inclusive floor: no DSCR_MINIMUM, branch to
          APPRAISAL_REVIEW) while cf 12,035,058 / 9,628,432 == 1.24994966
          rounds to 1.2499 (HIGH exception, branch to EXCEPTION_REVIEW) — a
          482-cent cash-flow gap flips the branch, pinning >= vs > and the
          4dp rounding edge simultaneously.
        test_recipe:
          setup:
            - "Two borrowers (relationship_since 2018-01-01), each with one CRE_TERM application: requested 30,000,000 cents, term 60 (annuity payment 594,036/mo at 700 bps; + existing ds 2,500,000 => annual debt service 9,628,432 on both)"
            - "app1 statement: ebitda 12,035,540, revenue 16,000,000, addbacks/distributions/capex 0 => cf_standard 12,035,540 (exactly 1.25 x 9,628,432)"
            - "app2 statement: ebitda 12,035,058, revenue 16,000,000, rest 0 => cf_standard 12,035,058 (482 cents below the exact 1.2500 floor)"
          setup_api_calls:
            - { call: "POST /credit/bank-officers", payload: { full_name: "Rita RM" }, as: BankAdmin, captures: { rm: $.data.id } }
            - { call: "POST /credit/bank-officers", payload: { full_name: "Andy Analyst" }, as: BankAdmin, captures: { an: $.data.id } }
            - { call: "POST /credit/borrowers", payload: { legal_name: "Boundary Pass LLC", naics_code: "332710", relationship_since: "2018-01-01" }, as: RelationshipManager, as_user_id: "${rm}", captures: { bor1: $.data.id } }
            - { call: "POST /credit/borrowers", payload: { legal_name: "Boundary Fail LLC", naics_code: "332710", relationship_since: "2018-01-01" }, as: RelationshipManager, as_user_id: "${rm}", captures: { bor2: $.data.id } }
            - { call: "POST /credit/loan-applications", payload: { borrower_id: "${bor1}", product_type: CRE_TERM, requested_amount_cents: 30000000, term_months: 60 }, as: RelationshipManager, as_user_id: "${rm}", captures: { app1: $.data.id } }
            - { call: "POST /credit/financial-statements", payload: { loan_application_id: "${app1}", period_end_date: "2025-12-31", revenue_cents: 16000000, ebitda_cents: 12035540, addbacks_cents: 0, distributions_cents: 0, maintenance_capex_cents: 0, existing_annual_debt_service_cents: 2500000, total_assets_cents: 80000000, total_liabilities_cents: 40000000 }, as: CreditAnalyst, as_user_id: "${an}", captures: { stmt1: $.data.id } }
            - { call: "POST /credit/loan-applications/${app1}/submit", payload: {}, as: RelationshipManager, as_user_id: "${rm}" }
            - { call: "POST /credit/financial-statements/${stmt1}/spread", payload: {}, as: CreditAnalyst, as_user_id: "${an}" }
            - { call: "POST /credit/financial-statements/${stmt1}/finalize", payload: {}, as: CreditAnalyst, as_user_id: "${an}" }
            - { call: "POST /credit/loan-applications", payload: { borrower_id: "${bor2}", product_type: CRE_TERM, requested_amount_cents: 30000000, term_months: 60 }, as: RelationshipManager, as_user_id: "${rm}", captures: { app2: $.data.id } }
            - { call: "POST /credit/financial-statements", payload: { loan_application_id: "${app2}", period_end_date: "2025-12-31", revenue_cents: 16000000, ebitda_cents: 12035058, addbacks_cents: 0, distributions_cents: 0, maintenance_capex_cents: 0, existing_annual_debt_service_cents: 2500000, total_assets_cents: 80000000, total_liabilities_cents: 40000000 }, as: CreditAnalyst, as_user_id: "${an}", captures: { stmt2: $.data.id } }
            - { call: "POST /credit/loan-applications/${app2}/submit", payload: {}, as: RelationshipManager, as_user_id: "${rm}" }
            - { call: "POST /credit/financial-statements/${stmt2}/spread", payload: {}, as: CreditAnalyst, as_user_id: "${an}" }
            - { call: "POST /credit/financial-statements/${stmt2}/finalize", payload: {}, as: CreditAnalyst, as_user_id: "${an}" }
          trigger:
            - { call: "POST /credit/loan-applications/${app1}/finalize-spreads", payload: {}, as: CreditAnalyst, as_user_id: "${an}", captures: { d1: $.data.dscr_standard, s1: $.data.dscr_stress, r1: $.data.risk_rating } }
            - { call: "POST /credit/loan-applications/${app2}/finalize-spreads", payload: {}, as: CreditAnalyst, as_user_id: "${an}", captures: { d2: $.data.dscr_standard, s2: $.data.dscr_stress, r2: $.data.risk_rating } }
          assert:
            - "LoanApplication.${app1}.dscr_standard == 1.2500 (12,035,540 / 9,628,432 == 1.25 exactly; 4dp round_half_up preserves it)"
            - "LoanApplication.${app1}.dscr_stress == 1.0007 (9,635,540 / 9,628,432; >= 1.0000 passes)"
            - "app1 has ZERO PolicyExceptions and status == APPRAISAL_REVIEW (the inclusive >= 1.2500 floor passes at exactly 1.2500 — no DSCR_MINIMUM created)"
            - "LoanApplication.${app1}.risk_rating == 3 (provisional (0.4*60 + 0.3*100 + 0.1*75)/0.80 == 76.88)"
            - "LoanApplication.${app2}.dscr_standard == 1.2499 (12,035,058 / 9,628,432 == 1.24994966, rounds DOWN at the 4th decimal)"
            - "app2 has exactly one OPEN PolicyException: rule_code == DSCR_MINIMUM, severity == HIGH; status == EXCEPTION_REVIEW"
            - "LoanApplication.${app2}.dscr_stress == 1.0007 (stress side unaffected by the 482-cent standard-side gap; no STRESS_DSCR_MINIMUM)"
            - "LoanApplication.${app2}.risk_rating == 4 (dscr 1.2499 earns 40 points: (0.4*40 + 0.3*100 + 0.1*75)/0.80 == 66.88)"

      - name: committee_tier_amount_inclusive_boundary
        grounds:
          - calculations.committee_quorum_rule
          - entities.CommitteeDecision.fields.level_required
          - entities.CommitteeDecision.fields.votes_required
          - state_machines.CommitteeDecision.OPEN_to_DECLINED
        distinguishing_aspect: |
          Metric = proposed_amount_cents committee-tier threshold (integer
          cents, inclusive upper bound), endpoint = POST
          /credit/committee-decisions (level/quorum stamped at creation) —
          distinct metric and endpoint from the DSCR ratio floor above.
          proposed == 100,000,000 stays SMALL (decline threshold 1: a single
          DECLINE vote closes it) while proposed == 100,000,001 crosses to
