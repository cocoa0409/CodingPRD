            - "Round 2: HTTP 201 with review_round == 2, reviewer_id == ${rvB}, reviewer_id != ${rv1}, status == \"ASSIGNED\""
            - "GET /vote-by-mail/return-envelopes/${en1} returns signature_status == \"PENDING_REVIEW\""
            - "GET /vote-by-mail/reviewers/${rv1} returns active_review_count == 0 and completed_review_count == 1; GET /vote-by-mail/reviewers/${rvB} returns active_review_count == 1"

  - section: cross_cutting_layers
    instances:
      - name: optimistic_concurrency_stale_voter_version_blocks_a_second_request
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[ballot-request-create-stale-voter]
          - errors[ERR_STALE_VOTER_VERSION]
          - endpoints[POST /vote-by-mail/ballot-requests]
        distinguishing_aspect: "Logging br1 bumps Voter.version, so replaying the same expected_voter_version returns 412 ERR_STALE_VOTER_VERSION; re-reading the voter and resubmitting succeeds and supersedes br1, proving the OCC field guards the supersession path rather than blocking it."
        test_recipe:
          setup:
            - "Voter v1 with version captured at creation, and one logged ballot request br1 that already bumped that version."
          setup_api_calls:
            - *c_clock_sep10
            - *c_election
            - *c_voter1
            - *c_request1
          trigger:
            - call: "POST /vote-by-mail/ballot-requests"
              payload: { voter_id: "${v1}", election_id: "${e1}", request_channel: "PHONE", delivery_method: "MAIL", expected_voter_version: "${v1_v}" }
              as: ElectionsClerk
              captures: { stale_voter_err: $.data.error_id }
            - call: "GET /vote-by-mail/voters/${v1}"
              payload: {}
              as: ElectionsClerk
              captures: { v1_v_cur: $.data.version }
            - call: "POST /vote-by-mail/ballot-requests"
              payload: { voter_id: "${v1}", election_id: "${e1}", request_channel: "PHONE", delivery_method: "MAIL", expected_voter_version: "${v1_v_cur}" }
              as: ElectionsClerk
              captures: { br1b: $.data.id }
          assert:
            - "Stale replay: HTTP 412 with data.error_id == \"ERR_STALE_VOTER_VERSION\""
            - "GET /vote-by-mail/ballot-requests?voter_id=${v1} immediately after the stale replay returns total_count == 1"
            - "Retry with the re-read version: HTTP 201 with status == \"RECEIVED\" and request_channel == \"PHONE\""
            - "GET /vote-by-mail/ballot-requests/${br1} returns status == \"SUPERSEDED\" and GET /vote-by-mail/ballot-requests?voter_id=${v1} returns total_count == 2"
            - "GET /vote-by-mail/voters/${v1} returns version == ${v1_v_cur} + 1 (every accepted write bumps the parent exactly once)"

      - name: optimistic_concurrency_stale_envelope_version_blocks_a_remake
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[remake-create-stale-envelope]
          - errors[ERR_STALE_ENVELOPE_VERSION]
          - endpoints[POST /vote-by-mail/return-envelopes/{id}/remakes]
        distinguishing_aspect: "Opening a review round moves the envelope's signature dimension and bumps its version, so a remake carrying the intake-time expected_envelope_version returns 412 ERR_STALE_ENVELOPE_VERSION while the same body with the re-read version is accepted."
        test_recipe:
          setup:
            - "Envelope en1 whose version was captured at intake and then bumped by opening review round sr1; reviewers rvB (REP) and rvC (DEM) are available as a bipartisan team."
          setup_api_calls:
            - *c_clock_sep10
            - *c_election
            - *c_voter1
            - *c_reviewer1
            - *c_reviewer_b
            - *c_reviewer_c
            - *c_request1
            - *c_av1_lookup
            - *c_av1_same
            - *c_approve1
            - *c_batch1
            - *c_packet1
            - *c_seal1
            - *c_dispatch1
            - *c_clock_nov3
            - *c_envelope1
            - *c_review1
          trigger:
            - call: "POST /vote-by-mail/return-envelopes/${en1}/remakes"
              payload: { team_member_a_reviewer_id: "${rvB}", team_member_b_reviewer_id: "${rvC}", reason_code: "DAMAGED", session_start_at: "2026-11-03T13:00:00Z", session_end_at: "2026-11-03T14:00:00Z", expected_envelope_version: "${en1_v}" }
              as: CanvassSupervisor
              captures: { stale_envelope_err: $.data.error_id }
            - *c_envelope1_reread
            - call: "POST /vote-by-mail/return-envelopes/${en1}/remakes"
              payload: { team_member_a_reviewer_id: "${rvB}", team_member_b_reviewer_id: "${rvC}", reason_code: "DAMAGED", session_start_at: "2026-11-03T13:00:00Z", session_end_at: "2026-11-03T14:00:00Z", expected_envelope_version: "${en1_v2}" }
              as: CanvassSupervisor
              captures: { rk1b: $.data.id }
          assert:
            - "Stale remake: HTTP 412 with data.error_id == \"ERR_STALE_ENVELOPE_VERSION\""
            - "GET /vote-by-mail/remake-records?original_envelope_id=${en1} immediately after the stale attempt returns total_count == 0"
            - "${en1_v2} == ${en1_v} + 1 (opening the review round bumped the envelope exactly once)"
            - "Retry with the re-read version: HTTP 201 with status == \"OPEN\", remade_serial == null, remade_envelope_id == null"
            - "GET /vote-by-mail/return-envelopes/${en1} returns version == ${en1_v2} + 1 and custody_status == \"SEALED\" (the record opens before completion supersedes the original)"

      - name: cascading_side_effects_batch_dispatch_chain
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers
          - endpoints[POST /vote-by-mail/mailing-batches/{id}/dispatch]
        excluded_because:
          difficulty_instance: batch_dispatch_packet_request_election_chain
          rationale: "The end-to-end N-level chain (batch DISPATCHED -> packets MAILED -> requests MAILED -> election posture MAILING -> accountability counters) plus its ordering sensitivity is exactly what the §1.8 transitive_cascade instance of that name walks."

      - name: dual_variant_calculation_postage_estimated_versus_actual
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers
          - calculations.postage_assessment
        excluded_because:
          difficulty_instance: postage_estimated_vs_actual_after_request_supersession
          rationale: "Both postage variants and the delta on switching from ESTIMATED at seal to ACTUAL at dispatch are asserted by the §1.8 dual_variant_calc instance of that name."

  - section: consistency_model
