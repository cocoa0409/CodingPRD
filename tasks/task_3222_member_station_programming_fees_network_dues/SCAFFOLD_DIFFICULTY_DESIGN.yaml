              as: PlatformAdmin
          assert:
            - "Both stations report operations_score 69.00"
            - "The 600000-household station reads membership_class CLASS_B because households_index is exactly 30"
            - "The 550000-household station reads membership_class CLASS_C because households_index is 25, one ladder step down"
      - name: boundary_preemptible_priority_floor
