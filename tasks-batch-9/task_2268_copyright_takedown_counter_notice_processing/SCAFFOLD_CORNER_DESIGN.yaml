        grounds:
          - concurrency_rules.policy-publish-stale-provider
          - errors[ERR_STALE_PROVIDER_VERSION]
        distinguishing_aspect: "The second concurrency rule guards a different write endpoint on the same parent: a token read before the agent registration is stale when the policy publish runs, and the 412 fires ahead of nothing else - all state preconditions hold and the policy stays DRAFT."
