            - call: "POST /research-billing/studies/${study_id}/budget-build"
              payload: { source_analysis_id: "${analysis_id}", basis: "COVERAGE_DRIVEN", indirect_rate_pct: 40.0, expected_study_version: "${study_v2}" }
              as: ResearchBillingManager
              as_user_id: "mgr_1"
              captures: { federal_rate: "$.data.effective_indirect_rate_pct" }
            - call: "POST /research-billing/studies/${study_id}/budget-execute"
              as: ResearchBillingManager
              as_user_id: "mgr_2"
              captures: { budget_status_executed: "$.data.budget_status" }
            - call: "POST /research-billing/amendments"
              payload: { study_id: "${study_id}", scope: "ITEM_CHANGE", effective_date: "2026-08-10" }
              as: ResearchBillingManager
              as_user_id: "mgr_1"
              captures: { amendment_id: "$.data.id", reanalysis_required: "$.data.reanalysis_required", calendar_rebuild_required: "$.data.calendar_rebuild_required" }
          trigger:
            - call: "POST /research-billing/amendments/${amendment_id}/implement"
              as: ResearchBillingManager
              as_user_id: "mgr_1"
          assert:
            - "setup: the federal branch capped the requested 40.0 at effective_indirect_rate_pct == 26.0, giving per_patient_subtotal_cents 12000 and per_patient_budget_cents 15120 (12000 + round_half_up(12000 * 26.0 / 100) == 12000 + 3120)"
            - "setup: lifecycle_after_approval == \"COVERAGE_APPROVED\" and budget_status_executed == \"EXECUTED\"; the amendment reports reanalysis_required == true and calendar_rebuild_required == false"
            - "trigger response 200 with status == \"IMPLEMENTED\""
            - "GET /research-billing/studies/${study_id} after the trigger shows lifecycle_status == \"COVERAGE_PENDING\" - a state the study already occupied, reached by travelling backwards"
            - "the same GET shows budget_status == \"SUPERSEDED\" - the budget dimension moved forward in the same request, and budget_source_analysis_id, per_patient_budget_cents 15120 and budget_built_by_user_id are all still populated from the superseded build"
            - "the same GET shows rebuild_required_calendar_count == 0 and billing_hold_posture == \"PAYER_BLOCKED\" (qct_determination is still UNDETERMINED), proving the ITEM_CHANGE scope stopped short of the calendar dimension"

  # =========================================================================
  # RULE 4 - transitive_cascade
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: amendment_implementation_five_level_rebuild_cascade
        grounds: "§1.2 Amendment SUBMITTED -> IMPLEMENTED declares cascade links 1-5 and §1.2 StudyCalendar PUBLISHED -> REBUILD_REQUIRED declares link 4; §1.3 calculations.study_billing_hold_posture clause 2; §1.1 Charge.hold_reason and hold_applied_at."
        distinguishing_aspect: "Five causal levels in one request, each strictly caused by the previous one: (1) Amendment -> IMPLEMENTED, (2) Study.lifecycle_status -> COVERAGE_PENDING and budget_status -> SUPERSEDED, (3) every PUBLISHED StudyCalendar -> REBUILD_REQUIRED, (4) Study.rebuild_required_calendar_count 0 -> 1 which flips billing_hold_posture to ALL_BLOCKED, (5) every UNROUTED+UNBILLED Charge acquires hold_reason CALENDAR_REBUILD and hold_applied_at. Level 5 is reached only through the derived counter at level 4, so an implementation that hard-codes 'amendment holds charges' still fails the ITEM_CHANGE control case where levels 3-5 must NOT fire."
        test_recipe:
          setup:
            - "One INDUSTRY_SPONSORED study taken all the way to OPEN_TO_ACCRUAL: QCT determination DEEMED_IND_IDE with registry NCT10000009, an approved analysis with one sponsor PER_PATIENT item, a budget built (mgr_1) and executed (mgr_2), a single-visit calendar with that item routed and PUBLISHED, and one interface charge left UNROUTED / UNBILLED. Clock 2026-08-15; the amendment scope is ITEM_AND_SCHEDULE_CHANGE with effective_date 2026-08-14."
          setup_api_calls:
            - call: "POST /research-billing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T08:00:00Z" }
              as: ResearchBillingManager
            - call: "POST /research-billing/studies"
              payload: { protocol_number: "AMC-2390-J", title: "Cascade probe", sponsor_name: "Northgate Therapeutics", funding_source: "INDUSTRY_SPONSORED", ind_ide_status: "IND_HELD", therapeutic_intent: true, registry_number: "NCT10000009" }
              as: ResearchBillingManager
              as_user_id: "mgr_1"
              captures: { study_id: "$.data.id", study_v1: "$.data.version" }
            - call: "POST /research-billing/studies/${study_id}/qct-determination"
              payload: { basis: "DEEMED_IND_IDE" }
              as: ComplianceReviewer
              as_user_id: "reviewer_1"
              captures: { study_v2: "$.data.version" }
            - call: "POST /research-billing/coverage-analyses"
              payload: { study_id: "${study_id}", expected_study_version: "${study_v2}" }
              as: CoverageAnalyst
              as_user_id: "analyst_1"
              captures: { analysis_id: "$.data.id", analysis_v1: "$.data.version" }
            - call: "POST /research-billing/coverage-items"
              payload: { coverage_analysis_id: "${analysis_id}", expected_coverage_analysis_version: "${analysis_v1}", item_code: "J9999", description: "Investigational infusion", classification: "RESEARCH_PAID", medicare_coverage_basis: "NOT_COVERED", budget_category: "PER_PATIENT", charge_master_unit_cents: 55000, negotiated_unit_cents: 40000, units_per_occurrence: 1, expected_occurrences: 1 }
              as: CoverageAnalyst
              as_user_id: "analyst_1"
              captures: { item_infusion_id: "$.data.id" }
            - call: "POST /research-billing/coverage-analyses/${analysis_id}/submit"
              as: CoverageAnalyst
              as_user_id: "analyst_1"
            - call: "POST /research-billing/coverage-analyses/${analysis_id}/approve"
              as: ComplianceReviewer
              as_user_id: "reviewer_1"
            - call: "GET /research-billing/studies/${study_id}"
              as: ResearchBillingManager
              as_user_id: "mgr_1"
              captures: { study_v3: "$.data.version" }
            - call: "POST /research-billing/studies/${study_id}/budget-build"
              payload: { source_analysis_id: "${analysis_id}", basis: "COVERAGE_DRIVEN", indirect_rate_pct: 32.0, expected_study_version: "${study_v3}" }
              as: ResearchBillingManager
              as_user_id: "mgr_1"
            - call: "POST /research-billing/studies/${study_id}/budget-execute"
              as: ResearchBillingManager
              as_user_id: "mgr_2"
            - call: "POST /research-billing/study-calendars"
              payload: { study_id: "${study_id}", source_analysis_id: "${analysis_id}" }
              as: CoverageAnalyst
              as_user_id: "analyst_1"
              captures: { calendar_id: "$.data.id" }
            - call: "POST /research-billing/calendar-visits"
              payload: { study_calendar_id: "${calendar_id}", visit_name: "Cycle 1 Day 1", sequence_index: 1, target_day_offset: 0, window_before_days: 0, window_after_days: 3 }
              as: CoverageAnalyst
              as_user_id: "analyst_1"
              captures: { visit_1_id: "$.data.id" }
            - call: "POST /research-billing/visit-charge-routes"
              payload: { calendar_visit_id: "${visit_1_id}", coverage_item_id: "${item_infusion_id}", occurrences: 1 }
              as: CoverageAnalyst
              as_user_id: "analyst_1"
            - call: "POST /research-billing/study-calendars/${calendar_id}/publish"
              as: ComplianceReviewer
              as_user_id: "reviewer_1"
              captures: { calendar_status_published: "$.data.status" }
            - call: "POST /research-billing/studies/${study_id}/accrual"
              payload: { target_status: "OPEN_TO_ACCRUAL" }
              as: ResearchBillingManager
              as_user_id: "mgr_1"
              captures: { posture_before_cascade: "$.data.billing_hold_posture" }
            - call: "POST /research-billing/charges"
              payload: { study_id: "${study_id}", charge_code: "J9999", service_date: "2026-08-15", amount_cents: 40000 }
              as: StudyCoordinator
              as_user_id: "coord_1"
              captures: { charge_id: "$.data.id", hold_reason_before: "$.data.hold_reason" }
            - call: "POST /research-billing/amendments"
              payload: { study_id: "${study_id}", scope: "ITEM_AND_SCHEDULE_CHANGE", effective_date: "2026-08-14" }
              as: ResearchBillingManager
              as_user_id: "mgr_1"
              captures: { amendment_id: "$.data.id" }
          trigger:
            - call: "POST /research-billing/amendments/${amendment_id}/implement"
              as: ResearchBillingManager
              as_user_id: "mgr_1"
          assert:
            - "setup: calendar_status_published == \"PUBLISHED\", posture_before_cascade == \"OPEN\", hold_reason_before == \"NONE\""
            - "level 1 - trigger response 200 with status == \"IMPLEMENTED\", reanalysis_required == true, calendar_rebuild_required == true"
            - "level 2 - GET /research-billing/studies/${study_id} shows lifecycle_status == \"COVERAGE_PENDING\" and budget_status == \"SUPERSEDED\""
            - "level 3 - GET /research-billing/study-calendars/${calendar_id} shows status == \"REBUILD_REQUIRED\" (not RETIRED, not DRAFT) with published_at preserved"
            - "level 4 - the study GET shows rebuild_required_calendar_count == 1 and billing_hold_posture == \"ALL_BLOCKED\""
            - "level 5 - GET /research-billing/charges/${charge_id} shows hold_reason == \"CALENDAR_REBUILD\" and hold_applied_at == \"2026-08-15T08:00:00Z\", while routing_state is still \"UNROUTED\" and billing_state still \"UNBILLED\""
            - "level 5 consequence - POST /research-billing/charges/${charge_id}/review with decision HOLD_FOR_SPONSOR now returns 409 ERR_STUDY_BILLING_BLOCKED"
            - "control: on a sibling study whose amendment scope is ITEM_CHANGE, levels 1-2 fire but the calendar stays PUBLISHED, rebuild_required_calendar_count stays 0, posture stays OPEN and hold_reason stays NONE"

      - name: audit_refund_resolution_reroutes_and_rebalances_ledger
        grounds: "§1.2 AuditFinding RESPONDED -> CLOSED_REFUNDED and Charge BILLED_PAYER -> REFUNDED (BL-5) declare cascade links 1-4; §1.1 Charge.replaces_charge_id and refunded_amount_cents; §1.3 calculations.study_ledger_rollup and study_billing_hold_posture."
        distinguishing_aspect: "A different trigger (audit resolution, not amendment) drives a four-level chain that CREATES a row rather than blocking rows: finding -> CLOSED_REFUNDED, the linked charge -> REFUNDED, a brand-new ROUTED_SPONSOR replacement charge carrying replaces_charge_id, then the study ledger and posture recompute. The new charge is itself a cascade product with its own unbilled_since, so it immediately becomes invoiceable - the refund does not merely reverse money, it moves the receivable from the payer to the sponsor."
        test_recipe:
          setup:
            - "One study with a qualifying QCT determination and an approved analysis whose 80053 item is ROUTINE_CARE / STANDARD_OF_CARE. A 9000-cent interface charge for 80053 is reviewed CLEAR_TO_PAYER (posture OPEN) and becomes BILLED_PAYER. An external payer audit then opens an IMPROPER_PAYER_BILL finding against that charge (auditor_1) and the billing office responds (auditor_2, satisfying segregation of duties). Clock is 2026-08-20 at resolution."
          setup_api_calls:
            - call: "POST /research-billing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-18T08:00:00Z" }
              as: ResearchBillingManager
            - call: "POST /research-billing/studies"
              payload: { protocol_number: "AMC-2390-K", title: "Refund cascade probe", sponsor_name: "Northgate Therapeutics", funding_source: "INDUSTRY_SPONSORED", ind_ide_status: "IND_HELD", therapeutic_intent: true, registry_number: "NCT10000010" }
              as: ResearchBillingManager
              as_user_id: "mgr_1"
              captures: { study_id: "$.data.id", study_v1: "$.data.version" }
            - call: "POST /research-billing/studies/${study_id}/qct-determination"
              payload: { basis: "DEEMED_IND_IDE" }
              as: ComplianceReviewer
              as_user_id: "reviewer_1"
              captures: { study_v2: "$.data.version" }
            - call: "POST /research-billing/coverage-analyses"
              payload: { study_id: "${study_id}", expected_study_version: "${study_v2}" }
              as: CoverageAnalyst
              as_user_id: "analyst_1"
              captures: { analysis_id: "$.data.id", analysis_v1: "$.data.version" }
            - call: "POST /research-billing/coverage-items"
              payload: { coverage_analysis_id: "${analysis_id}", expected_coverage_analysis_version: "${analysis_v1}", item_code: "80053", description: "Comprehensive metabolic panel", classification: "ROUTINE_CARE", medicare_coverage_basis: "STANDARD_OF_CARE", budget_category: "PER_PATIENT", charge_master_unit_cents: 9000, negotiated_unit_cents: 9000, units_per_occurrence: 1, expected_occurrences: 3 }
              as: CoverageAnalyst
              as_user_id: "analyst_1"
            - call: "POST /research-billing/coverage-analyses/${analysis_id}/submit"
              as: CoverageAnalyst
              as_user_id: "analyst_1"
            - call: "POST /research-billing/coverage-analyses/${analysis_id}/approve"
              as: ComplianceReviewer
              as_user_id: "reviewer_1"
            - call: "POST /research-billing/charges"
              payload: { study_id: "${study_id}", charge_code: "80053", service_date: "2026-08-18", amount_cents: 9000 }
              as: StudyCoordinator
              as_user_id: "coord_1"
              captures: { charge_id: "$.data.id" }
            - call: "POST /research-billing/charges/${charge_id}/review"
              payload: { decision: "CLEAR_TO_PAYER" }
              as: ComplianceReviewer
              as_user_id: "reviewer_1"
              captures: { billing_state_after_review: "$.data.billing_state" }
            - call: "POST /research-billing/audit-findings"
              payload: { study_id: "${study_id}", charge_id: "${charge_id}", finding_type: "IMPROPER_PAYER_BILL", claimed_amount_cents: 9000 }
              as: AuditLiaison
              as_user_id: "auditor_1"
              captures: { finding_id: "$.data.id" }
            - call: "POST /research-billing/audit-findings/${finding_id}/respond"
              payload: { response_narrative: "Item is sponsor-paid under the current analysis; refund and re-route to the sponsor." }
              as: AuditLiaison
              as_user_id: "auditor_2"
            - call: "POST /research-billing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-20T10:30:00Z" }
              as: ResearchBillingManager
          trigger:
            - call: "POST /research-billing/audit-findings/${finding_id}/resolve"
              payload: { disposition: "REFUND_AND_REROUTE" }
              as: AuditLiaison
              as_user_id: "auditor_2"
          assert:
            - "setup: billing_state_after_review == \"BILLED_PAYER\"; opening the finding drove billing_hold_posture to \"ALL_BLOCKED\" and open_finding_count to 1"
            - "level 1 - trigger response 200 with status == \"CLOSED_REFUNDED\" and refund_amount_cents == 9000"
            - "level 2 - GET /research-billing/charges/${charge_id} shows billing_state == \"REFUNDED\", refunded_amount_cents == 9000 and routing_state still \"ROUTED_PAYER\""
            - "level 3 - GET /research-billing/charges?study_id=${study_id}&replaces_charge_id=${charge_id} returns exactly one new Charge with source == \"REFUND_REPLACEMENT\", routing_state == \"ROUTED_SPONSOR\", billing_state == \"UNBILLED\", amount_cents == 9000, charge_code == \"80053\", service_date == \"2026-08-18\" and unbilled_since == \"2026-08-20T10:30:00Z\" (the resolution instant, not the original posting instant)"
            - "level 4 - GET /research-billing/studies/${study_id} shows payer_billed_cents == 0, payer_refunded_cents == 9000, sponsor_unbilled_cents == 9000, open_finding_count == 0 and billing_hold_posture == \"OPEN\""
            - "level 4 consequence - the replacement charge is immediately eligible for POST /research-billing/sponsor-invoices, so a following invoice for period_end_date 2026-08-31 selects line_count == 1 with subtotal_cents == 9000"
            - "control: resolving with disposition NO_ACTION on a sibling finding closes it CLOSED_NO_ACTION, leaves the charge BILLED_PAYER, creates no replacement row, and still returns posture to OPEN"

  # =========================================================================
  # RULE 5 - priority_pair_validation_conflict
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: already_routed_beats_billing_blocked_on_charge_review
        grounds: "§1.4 priority 10 (category state, ERR_CHARGE_ALREADY_ROUTED) versus priority 22 (category business_safety, ERR_STUDY_BILLING_BLOCKED), both applying to POST /research-billing/charges/{id}/review."
        distinguishing_aspect: "Category pair (state, business_safety). Both conditions hold at once: the charge is already ROUTED_SPONSOR and the study is ALL_BLOCKED by an open audit finding. The lower priority number wins, so the caller learns the charge itself is settled (409 ERR_CHARGE_ALREADY_ROUTED) rather than being told the study is frozen - an implementation that evaluates the posture gate first (the natural reading, since the block is 'more important' operationally) returns ERR_STUDY_BILLING_BLOCKED and fails."
        test_recipe:
          setup:
            - "One study with a qualifying QCT determination and one approved analysis carrying a sponsor-paid item. One charge is posted and reviewed HOLD_FOR_SPONSOR so its routing_state is ROUTED_SPONSOR. An audit finding is then opened against the study, which drives billing_hold_posture to ALL_BLOCKED."
          setup_api_calls:
            - call: "POST /research-billing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ResearchBillingManager
            - call: "POST /research-billing/studies"
              payload: { protocol_number: "AMC-2390-L", title: "Priority conflict A", sponsor_name: "Northgate Therapeutics", funding_source: "INDUSTRY_SPONSORED", ind_ide_status: "IND_HELD", therapeutic_intent: true, registry_number: "NCT10000011" }
              as: ResearchBillingManager
              as_user_id: "mgr_1"
              captures: { study_id: "$.data.id", study_v1: "$.data.version" }
            - call: "POST /research-billing/studies/${study_id}/qct-determination"
              payload: { basis: "DEEMED_IND_IDE" }
              as: ComplianceReviewer
              as_user_id: "reviewer_1"
              captures: { study_v2: "$.data.version" }
            - call: "POST /research-billing/coverage-analyses"
              payload: { study_id: "${study_id}", expected_study_version: "${study_v2}" }
              as: CoverageAnalyst
              as_user_id: "analyst_1"
              captures: { analysis_id: "$.data.id", analysis_v1: "$.data.version" }
            - call: "POST /research-billing/coverage-items"
              payload: { coverage_analysis_id: "${analysis_id}", expected_coverage_analysis_version: "${analysis_v1}", item_code: "J9999", description: "Investigational infusion", classification: "RESEARCH_PAID", medicare_coverage_basis: "NOT_COVERED", budget_category: "PER_PATIENT", charge_master_unit_cents: 55000, negotiated_unit_cents: 40000, units_per_occurrence: 1, expected_occurrences: 1 }
              as: CoverageAnalyst
              as_user_id: "analyst_1"
            - call: "POST /research-billing/coverage-analyses/${analysis_id}/submit"
              as: CoverageAnalyst
              as_user_id: "analyst_1"
            - call: "POST /research-billing/coverage-analyses/${analysis_id}/approve"
              as: ComplianceReviewer
              as_user_id: "reviewer_1"
            - call: "POST /research-billing/charges"
              payload: { study_id: "${study_id}", charge_code: "J9999", service_date: "2026-08-01", amount_cents: 40000 }
              as: StudyCoordinator
              as_user_id: "coord_1"
              captures: { charge_id: "$.data.id" }
            - call: "POST /research-billing/charges/${charge_id}/review"
              payload: { decision: "HOLD_FOR_SPONSOR" }
              as: ComplianceReviewer
              as_user_id: "reviewer_1"
              captures: { routing_after_first_review: "$.data.routing_state" }
            - call: "POST /research-billing/audit-findings"
              payload: { study_id: "${study_id}", finding_type: "MISSING_REGISTRY_NUMBER", claimed_amount_cents: 0 }
              as: AuditLiaison
              as_user_id: "auditor_1"
              captures: { finding_id: "$.data.id" }
            - call: "GET /research-billing/studies/${study_id}"
              as: ComplianceReviewer
              as_user_id: "reviewer_1"
              captures: { posture_before_trigger: "$.data.billing_hold_posture" }
          trigger:
            - call: "POST /research-billing/charges/${charge_id}/review"
              payload: { decision: "CLEAR_TO_PAYER" }
              as: ComplianceReviewer
              as_user_id: "reviewer_1"
              captures: { observed_error: "$.data.error_id" }
          assert:
            - "setup: routing_after_first_review == \"ROUTED_SPONSOR\" and posture_before_trigger == \"ALL_BLOCKED\" - both violation conditions are live"
            - "trigger response 409 with error_id == \"ERR_CHARGE_ALREADY_ROUTED\", the priority-10 state error"
            - "trigger response error_id is NOT \"ERR_STUDY_BILLING_BLOCKED\" (priority 22) and NOT \"ERR_PAYER_BILLING_BLOCKED_NO_QCT\" (priority 23)"
            - "GET /research-billing/charges/${charge_id} is unchanged: routing_state \"ROUTED_SPONSOR\", billing_state \"UNBILLED\", reviewed_by_user_id still reviewer_1, version not incremented"

      - name: item_analysis_mismatch_beats_invoiceable_not_routable
        grounds: "§1.4 priority 26 (category business_referential, ERR_ITEM_ANALYSIS_MISMATCH) versus priority 33 (category business_constraint, ERR_INVOICEABLE_ITEM_NOT_VISIT_ROUTABLE), both applying to POST /research-billing/visit-charge-routes."
        distinguishing_aspect: "Category pair (business_referential, business_constraint) - a different pair from already_routed_beats_billing_blocked_on_charge_review. The routed item is simultaneously foreign to the calendar's source analysis AND of a budget_category that may never sit on a visit. Referential integrity is checked before the categorical constraint, so the answer is ERR_ITEM_ANALYSIS_MISMATCH: the system must not describe the shape of an item it has already decided does not belong here."
        test_recipe:
          setup:
            - "Study L has an approved analysis L1 (one sponsor PER_PATIENT item) and a DRAFT calendar sourced from L1 with one visit. Study M, entirely separate, has an approved analysis M1 whose only item is an INVOICEABLE IRB fee. The route attempt points a visit of study L's calendar at study M's INVOICEABLE item."
