            - { call: "POST /api/employees", payload: { employee_ref: "E1", full_name: "Emp", department_id: "${dept}", manager_id: "${mgr}", hire_date: "2021-06-15", state_code: "CA" }, as: HRAdmin, captures: { emp: $.data.id } }
            - { call: "POST /api/nominations", payload: { program_id: "${prog}", nominee_id: "${emp}", type: MANAGER, points_requested: 3000, reason_code: DELIVERY, message: "g", idempotency_key: "xcut-rec-1" }, as: Manager, as_user_id: "${mgr}", captures: { nom: $.data.id, nom_v: $.data.version } }
            - { call: "POST /api/nominations/${nom}/approve", payload: { expected_nomination_version: "${nom_v}" }, as: HRAdmin }
            - { call: "POST /api/vendors", payload: { name: "V", vendor_code: "V1", daily_ship_capacity: 10, lead_time_business_days: 1, supported_categories: ["MERCH"] }, as: VendorOps, captures: { vend: $.data.id } }
            - { call: "POST /api/catalog-items", payload: { vendor_id: "${vend}", sku: "A", name: "A", category: "MERCH", point_cost: 1000, cash_value_cents: 5000, taxable_class: MERCHANDISE, de_minimis_eligible: false, active_window_start: "2026-01-01T00:00:00Z", active_window_end: "2027-01-01T00:00:00Z" }, as: VendorOps, captures: { itemA: $.data.id } }
            - { call: "POST /api/catalog-items", payload: { vendor_id: "${vend}", sku: "B", name: "B", category: "MERCH", point_cost: 400, cash_value_cents: 2000, taxable_class: MERCHANDISE, de_minimis_eligible: false, active_window_start: "2026-01-01T00:00:00Z", active_window_end: "2027-01-01T00:00:00Z" }, as: VendorOps, captures: { itemB: $.data.id } }
          trigger:
