            - "error_id == ERR_CATALOG_FROZEN (event BIDDING_OPEN)"

      - name: item_receipt_requires_pledged_solicitation
        claim_type: violation_to_error
        grounds:
          - "state_machines.Solicitation.PLEDGED_to_FULFILLED"
          - "errors[ERR_SOLICITATION_NOT_PLEDGED]"
        distinguishing_aspect: "Receiving an item against a SENT (not PLEDGED) solicitation fails with ERR_SOLICITATION_NOT_PLEDGED; after recording PLEDGED the same receipt succeeds and the solicitation becomes FULFILLED."
        test_recipe:
          setup:
            - "Event SOLICITING; solicitation sent (SENT)"
          setup_api_calls:
            - { call: "POST /gala-events", payload: { name: "Gala NP2", gala_date: "2026-11-20", bidding_opens_at: "2026-11-20T18:00:00Z", bidding_closes_at: "2026-11-20T22:00:00Z", min_bid_pct_bps: 3000, min_bid_increment_cents: 500, min_bid_floor_cents: 1000, bid_increment_tiers: [{up_to_cents: 100000, increment_cents: 2500}, {up_to_cents: 500000, increment_cents: 5000}, {up_to_cents: null, increment_cents: 10000}], ack_threshold_cents: 25000, solicitation_cooldown_days: 30, cert_validity_months: 12, cert_grace_days: 30 }, as: GalaAdmin, captures: { ev: "$.data.id" } }
