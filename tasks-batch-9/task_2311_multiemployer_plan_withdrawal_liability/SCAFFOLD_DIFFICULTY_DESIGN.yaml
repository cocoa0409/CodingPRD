  # =========================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: assessment_creation_requires_every_lookback_valuation_certified
        grounds:
          - validations[priority=10]
          - errors[ERR_VALUATION_YEAR_MISSING]
          - state_machines.PlanYearValuation.DRAFT_to_CERTIFIED
          - calculations.allocation_fraction_and_gross_share
        distinguishing_aspect: |
          Entity pair LiabilityAssessment -> PlanYearValuation: the assessment cannot be created while
          the 2023 valuation sits in DRAFT (ERR_VALUATION_YEAR_MISSING), and the identical request
          succeeds with gross_allocated_cents 250000000 the moment that other entity reaches
          CERTIFIED. (Instance two crosses a different pair, WithdrawalEvent -> Employer.)
        test_recipe:
          setup:
            - "Plan MODIFIED_PRESUMPTIVE / STATUTORY / 700 bps with one employer and one CERTIFIED record covering 2021..2025 (250000 CBU, 250000000 cents, 1000 cents per CBU)."
            - "Valuations for 2021, 2022, 2024 and 2025 CERTIFIED on create; the 2023 valuation created WITHOUT certify_on_create so it stays DRAFT."
            - "Withdrawal event for 2026 determined COMPLETE (determination only needs the 2025 valuation)."
            - "Clock left at its default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /plans"
              payload: { name: "Chesapeake Bakery Pension Plan", industry: "GENERAL", allocation_method: "MODIFIED_PRESUMPTIVE", de_minimis_variant: "STATUTORY", interest_rate_bps: 700, mass_withdrawal_declared: false }
