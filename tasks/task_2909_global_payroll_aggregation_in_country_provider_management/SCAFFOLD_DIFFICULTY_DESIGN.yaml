          The contended resource is a LocalBankAccount and the interval semantics are
          closed-and-buffer-extended: the first released window [2026-08-10T00:00:00.000Z,
          2026-08-11T00:00:00.000Z] extended by 12 buffer hours on both sides reaches
          2026-08-11T12:00:00.000Z, so a second window opening at 2026-08-11T00:00:00.000Z
