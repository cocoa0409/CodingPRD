          trigger:
            - call: "POST /depositories/${dep_id}/mtm-runs"
              payload: { window_start: "2026-07-31T00:00:00Z", window_end: "2026-08-01T00:00:00Z", basis: "SUPERVISORY", expected_depository_version: "${dep_v1}" }
              as: BankCollateralOfficer
              as_user_id: "officer-1"
              captures: { run_1: $.data.id }
            - call: "POST /depositories/${dep_id}/mtm-runs"
              payload: { window_start: "2026-08-01T04:00:00Z", window_end: "2026-08-01T05:00:00Z", basis: "SUPERVISORY", expected_depository_version: "${dep_v1}" }
              as: StateRegulator
              captures: { err_stale_dep: $.data.error_id }
            - call: "GET /depositories/${dep_id}"
              payload: {}
              as: StateRegulator
              captures: { dep_v2: $.data.version }
            - call: "POST /depositories/${dep_id}/mtm-runs"
              payload: { window_start: "2026-08-01T04:00:00Z", window_end: "2026-08-01T05:00:00Z", basis: "SUPERVISORY", expected_depository_version: "${dep_v2}" }
              as: StateRegulator
              captures: { run_2: $.data.id }
          assert:
            - "RUN 1: 201 with run_index 1, deficiency_cents 78750000, outcome 'DEFICIENT'; Depository.${dep_id}.mtm_run_index == 1, consecutive_deficiency_runs == 1, last_mtm_window_end == 2026-08-01T00:00:00Z, version == ${dep_v1} + 1"
            - "RUN 2 replaying ${dep_v1}: 412 with error_id 'ERR_STALE_DEPOSITORY_VERSION'; the window [2026-08-01T04:00:00Z, 2026-08-01T05:00:00Z) is legal (exactly MTM_MIN_GAP_HOURS 4 after the previous window_end), so priority 67 could not have fired"
            - "After the 412: Depository.${dep_id}.mtm_run_index is still 1, consecutive_deficiency_runs still 1, open_margin_call_count still 1, and GET /depositories/${dep_id}/mtm-runs returns total_count 1 — no MarkToMarketRun row and no MarginCall were created"
            - "${dep_v2} == ${dep_v1} + 1; the identical payload then succeeds with run_index 2 and consecutive_deficiency_runs 2"
            - "The OCC check is evaluated on the DEPOSITORY even though the run is a child row, and the run itself is immutable (MarkToMarketRun has no version field to conflict on)"
            - "A StateRegulator caller was rejected and then accepted on the same endpoint, so the 412 is about version freshness and not about which of the two permitted roles called it"

