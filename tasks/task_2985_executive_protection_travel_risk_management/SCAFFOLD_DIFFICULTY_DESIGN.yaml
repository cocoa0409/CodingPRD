              payload: { trip_leg_id: "${leg_id}", staff_id: "${lead_id}", role_on_detail: "LEAD_AGENT", starts_at: "2026-09-10T08:00:00Z", ends_at: "2026-09-10T18:00:00Z", expected_trip_leg_version: "${leg_v0}" }
              as: ProtectionManager
              as_user_id: "${mgr_id}"
              captures: { pda_id: $.data.id, pda_cost: $.data.cost_cents, pda_hours: $.data.planned_billable_hours }
            - call: "POST /exec-protection/trip-legs/${leg_id}/advance-progress"
