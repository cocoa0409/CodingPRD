# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Roofing & Storm-Restoration Contractor — Expert
# Breadth probe across the claim-extraction-guide sections. Every grounds[]
# resolves into SCAFFOLD.yaml §1.1–§1.7. Same 7-point contract as §1.8.
# `excluded_because:` stubs cite the §1.8 instance by name.
# =============================================================================
scaffold_corner_design:

  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: create_job_returns_201_with_defaults
        claim_type: Creation
        grounds:
          - entities.Job.fields.status
          - entities.Job.fields.retainage_pct
          - endpoints
        distinguishing_aspect: "POST /jobs with required fields returns 201, status=LEAD, retainage_pct defaults to 0.10, version=1, ledger fields 0."
        test_recipe:
          setup:
            - "One estimator exists."
          setup_api_calls:
            - call: "POST /estimators"
              payload: { name: "Ann Est", license_no: "TX-1001" }
              as: Estimator
              captures: { est_id: $.data.id }
          trigger:
            - call: "POST /jobs"
              payload: { customer_name: "Homer R", property_address: "1 Oak St", peril: "HAIL", assigned_estimator_id: "${est_id}" }
              as: FieldAdjuster
              captures: { job_id: $.data.id }
          assert:
            - "response status == 201"
            - "Job.${job_id}.status == LEAD"
            - "Job.${job_id}.retainage_pct == 0.10"
            - "Job.${job_id}.version == 1"
            - "Job.${job_id}.contract_value_cents == 0"

      - name: create_job_missing_required_field
        claim_type: Required Fields
        grounds:
          - validations[priority=5]
          - errors[ERR_MISSING_FIELD]
        distinguishing_aspect: "POST /jobs without property_address returns ERR_MISSING_FIELD (400)."
        test_recipe:
          setup:
            - "One estimator exists."
          setup_api_calls:
            - call: "POST /estimators"
              payload: { name: "Ann Est", license_no: "TX-1001" }
              as: Estimator
              captures: { est_id: $.data.id }
          trigger:
            - call: "POST /jobs"
              payload: { customer_name: "Homer R", peril: "HAIL", assigned_estimator_id: "${est_id}" }
              as: FieldAdjuster
              captures: { err: $.data.error_id }
          assert:
            - "response status == 400"
            - "data.error_id == ERR_MISSING_FIELD"

      - name: create_job_bad_enum_peril
        claim_type: Type Constraints
        grounds:
          - validations[priority=6]
          - errors[ERR_INVALID_REQUEST]
          - entities.Job.fields.peril
        distinguishing_aspect: "POST /jobs with peril='EARTHQUAKE' (not in enum) returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup:
            - "One estimator exists."
          setup_api_calls:
            - call: "POST /estimators"
              payload: { name: "Ann Est", license_no: "TX-1001" }
              as: Estimator
              captures: { est_id: $.data.id }
          trigger:
            - call: "POST /jobs"
              payload: { customer_name: "Homer R", property_address: "1 Oak St", peril: "EARTHQUAKE", assigned_estimator_id: "${est_id}" }
              as: FieldAdjuster
              captures: { err: $.data.error_id }
          assert:
            - "response status == 422"
            - "data.error_id == ERR_INVALID_REQUEST"

      - name: get_job_not_found
        claim_type: Not Found
        grounds:
          - validations[priority=3]
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET /jobs/{nonexistent} returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "GET /jobs/11111111-1111-4111-8111-111111111111"
              payload: {}
              as: FieldAdjuster
              captures: { err: $.data.error_id }
          assert:
            - "response status == 404"
            - "data.error_id == ERR_NOT_FOUND"

      - name: create_job_fk_estimator_not_found
        claim_type: Parent Relationships
        grounds:
          - validations[priority=4]
          - errors[ERR_FK_NOT_FOUND]
          - entities.Job.fields.assigned_estimator_id
        distinguishing_aspect: "POST /jobs with a non-existent assigned_estimator_id returns ERR_FK_NOT_FOUND (404)."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /jobs"
              payload: { customer_name: "Homer R", property_address: "1 Oak St", peril: "HAIL", assigned_estimator_id: "22222222-2222-4222-8222-222222222222" }
              as: FieldAdjuster
              captures: { err: $.data.error_id }
          assert:
            - "response status == 404"
            - "data.error_id == ERR_FK_NOT_FOUND"

      - name: estimator_immutable_no_version
        claim_type: Immutability
        grounds:
          - entities.Estimator.common_fields
          - entities.Estimator.fields.license_no
        distinguishing_aspect: "Estimator is common_fields:false — its GET response carries id and created_at but no version field and there is no update/transition endpoint for it."
        test_recipe:
          setup:
            - "One estimator created."
          setup_api_calls:
            - call: "POST /estimators"
              payload: { name: "Ann Est", license_no: "TX-1001" }
              as: Estimator
              captures: { est_id: $.data.id }
          trigger:
            - call: "GET /estimators/${est_id}"
              payload: {}
              as: Estimator
          assert:
            - "response status == 200"
            - "Estimator.${est_id}.license_no == 'TX-1001'"
            - "no `version` field is present in the Estimator response data"

      - name: list_jobs_pagination_envelope
        claim_type: Listing
        grounds:
          - endpoints
          - entities.Job.fields.status
        distinguishing_aspect: "GET /jobs returns an array response with pagination fields limit/offset/total_count/has_more in meta/data per §1.0."
        test_recipe:
          setup:
            - "Two jobs created."
          setup_api_calls:
            - call: "POST /estimators"
              payload: { name: "Ann Est", license_no: "TX-1001" }
              as: Estimator
              captures: { est_id: $.data.id }
            - call: "POST /jobs"
              payload: { customer_name: "J1", property_address: "1 A", peril: "HAIL", assigned_estimator_id: "${est_id}" }
              as: FieldAdjuster
            - call: "POST /jobs"
              payload: { customer_name: "J2", property_address: "2 B", peril: "WIND", assigned_estimator_id: "${est_id}" }
              as: FieldAdjuster
          trigger:
            - call: "GET /jobs"
              payload: {}
              as: FieldAdjuster
          assert:
            - "response status == 200 and response_type == array"
            - "total_count >= 2 and has_more is present"

      - name: computed_line_cost_ignores_client_input
        claim_type: Computed Fields
        grounds:
          - entities.EstimateLineItem.fields.line_cost_cents
          - calculations.estimate_total
        distinguishing_aspect: "line_cost_cents is computed server-side; a line item SHINGLE 10sq@10000 waste0.10 yields line_cost_cents 110000 regardless of any client-supplied value."
        test_recipe:
          setup:
            - "A DRAFT FIELD estimate on a fresh job."
          setup_api_calls:
            - call: "POST /estimators"
              payload: { name: "Ann Est", license_no: "TX-1001" }
              as: Estimator
              captures: { est_id: $.data.id }
            - call: "POST /jobs"
              payload: { customer_name: "Homer R", property_address: "1 Oak St", peril: "HAIL", assigned_estimator_id: "${est_id}" }
              as: FieldAdjuster
              captures: { job_id: $.data.id }
            - call: "POST /estimates"
              payload: { job_id: "${job_id}", source_kind: "FIELD" }
              as: Estimator
              captures: { est_doc_id: $.data.id }
          trigger:
            - call: "POST /estimates/${est_doc_id}/line-items"
              payload: { trade: "SHINGLE", squares: 10, unit_price_cents: 10000, waste_factor_pct: 0.10 }
              as: Estimator
              captures: { li_id: $.data.id }
          assert:
            - "response status == 201"
            - "EstimateLineItem.${li_id}.line_cost_cents == 110000"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: finalize_already_finalized_estimate_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Estimate.DRAFT_to_FINALIZED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Finalizing an estimate already FINALIZED returns ERR_INVALID_STATE (409); no totals change."
        test_recipe:
          setup:
            - "A FINALIZED FIELD estimate (single SHINGLE line)."
          setup_api_calls:
            - call: "POST /estimators"
              payload: { name: "Ann Est", license_no: "TX-1001" }
              as: Estimator
              captures: { est_id: $.data.id }
            - call: "POST /jobs"
              payload: { customer_name: "Homer R", property_address: "1 Oak St", peril: "HAIL", assigned_estimator_id: "${est_id}" }
              as: FieldAdjuster
              captures: { job_id: $.data.id }
            - call: "POST /estimates"
              payload: { job_id: "${job_id}", source_kind: "FIELD" }
              as: Estimator
              captures: { est_doc_id: $.data.id }
            - call: "POST /estimates/${est_doc_id}/line-items"
              payload: { trade: "SHINGLE", squares: 10, unit_price_cents: 10000, waste_factor_pct: 0.10 }
              as: Estimator
            - call: "POST /estimates/${est_doc_id}/finalize"
              payload: {}
              as: Estimator
          trigger:
            - call: "POST /estimates/${est_doc_id}/finalize"
              payload: {}
              as: Estimator
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_INVALID_STATE"

      - name: finalize_empty_estimate_rejected
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Estimate.DRAFT_to_FINALIZED
          - errors[ERR_EMPTY_ESTIMATE]
        distinguishing_aspect: "Finalizing a DRAFT estimate with zero line items returns ERR_EMPTY_ESTIMATE (409)."
        test_recipe:
          setup:
            - "A DRAFT estimate with no line items."
          setup_api_calls:
            - call: "POST /estimators"
              payload: { name: "Ann Est", license_no: "TX-1001" }
              as: Estimator
              captures: { est_id: $.data.id }
            - call: "POST /jobs"
              payload: { customer_name: "Homer R", property_address: "1 Oak St", peril: "HAIL", assigned_estimator_id: "${est_id}" }
              as: FieldAdjuster
              captures: { job_id: $.data.id }
            - call: "POST /estimates"
              payload: { job_id: "${job_id}", source_kind: "FIELD" }
              as: Estimator
              captures: { est_doc_id: $.data.id }
          trigger:
            - call: "POST /estimates/${est_doc_id}/finalize"
              payload: {}
              as: Estimator
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_EMPTY_ESTIMATE"

      - name: mark_inspected_without_passed_assessment
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Job.LEAD_to_INSPECTED
          - errors[ERR_NO_PASSED_ASSESSMENT]
        distinguishing_aspect: "mark-inspected on a LEAD job with no PASSED DAMAGE_ASSESSMENT returns ERR_NO_PASSED_ASSESSMENT (409)."
        test_recipe:
          setup:
            - "A LEAD job with no inspections."
          setup_api_calls:
            - call: "POST /estimators"
              payload: { name: "Ann Est", license_no: "TX-1001" }
              as: Estimator
              captures: { est_id: $.data.id }
            - call: "POST /jobs"
              payload: { customer_name: "Homer R", property_address: "1 Oak St", peril: "HAIL", assigned_estimator_id: "${est_id}" }
              as: FieldAdjuster
              captures: { job_id: $.data.id }
          trigger:
            - call: "POST /jobs/${job_id}/mark-inspected"
              payload: {}
              as: FieldAdjuster
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_NO_PASSED_ASSESSMENT"

      - name: lose_a_completed_job_invalid_state
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Job.terminal_states
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "lose on a CONTRACTED job (no LOST transition from CONTRACTED) returns ERR_INVALID_STATE (409); LOST is only reachable from LEAD/INSPECTED/ESTIMATED."
        test_recipe:
          setup:
            - "A CONTRACTED job."
          setup_api_calls:
            - call: "POST /estimators"
              payload: { name: "Ann Est", license_no: "TX-1001" }
              as: Estimator
              captures: { est_id: $.data.id }
            - call: "POST /jobs"
              payload: { customer_name: "Homer R", property_address: "1 Oak St", peril: "HAIL", assigned_estimator_id: "${est_id}" }
              as: FieldAdjuster
              captures: { job_id: $.data.id }
            - call: "POST /inspections"
              payload: { job_id: "${job_id}", kind: "DAMAGE_ASSESSMENT", scheduled_start: "2026-03-01T08:00:00Z", scheduled_end: "2026-03-01T10:00:00Z" }
              as: FieldAdjuster
              captures: { da_id: $.data.id }
            - call: "POST /inspections/${da_id}/complete"
              payload: { outcome: "PASS", damage_severity: "MODERATE" }
              as: FieldAdjuster
            - call: "POST /jobs/${job_id}/mark-inspected"
              payload: {}
              as: FieldAdjuster
            - call: "POST /estimates"
              payload: { job_id: "${job_id}", source_kind: "FIELD" }
              as: Estimator
              captures: { est_doc_id: $.data.id }
            - call: "POST /estimates/${est_doc_id}/line-items"
              payload: { trade: "SHINGLE", squares: 10, unit_price_cents: 10000, waste_factor_pct: 0.10 }
              as: Estimator
            - call: "POST /estimates/${est_doc_id}/finalize"
              payload: {}
              as: Estimator
            - call: "POST /jobs/${job_id}/mark-estimated"
              payload: {}
              as: Estimator
            - call: "POST /jobs/${job_id}/contract"
              payload: { estimate_id: "${est_doc_id}" }
              as: Estimator
          trigger:
            - call: "POST /jobs/${job_id}/lose"
              payload: { lost_reason: "too late" }
              as: FieldAdjuster
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_INVALID_STATE"

      - name: contract_twice_already_contracted
        claim_type: Idempotency
        grounds:
          - state_machines.Job.ESTIMATED_to_CONTRACTED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Calling contract on a job already CONTRACTED returns ERR_INVALID_STATE (409) — the job is no longer in ESTIMATED."
        test_recipe:
          setup:
            - "A CONTRACTED job."
          setup_api_calls:
            - call: "POST /estimators"
              payload: { name: "Ann Est", license_no: "TX-1001" }
              as: Estimator
              captures: { est_id: $.data.id }
            - call: "POST /jobs"
              payload: { customer_name: "Homer R", property_address: "1 Oak St", peril: "HAIL", assigned_estimator_id: "${est_id}" }
              as: FieldAdjuster
              captures: { job_id: $.data.id }
            - call: "POST /inspections"
              payload: { job_id: "${job_id}", kind: "DAMAGE_ASSESSMENT", scheduled_start: "2026-03-01T08:00:00Z", scheduled_end: "2026-03-01T10:00:00Z" }
              as: FieldAdjuster
              captures: { da_id: $.data.id }
            - call: "POST /inspections/${da_id}/complete"
              payload: { outcome: "PASS", damage_severity: "MODERATE" }
              as: FieldAdjuster
            - call: "POST /jobs/${job_id}/mark-inspected"
              payload: {}
              as: FieldAdjuster
            - call: "POST /estimates"
              payload: { job_id: "${job_id}", source_kind: "FIELD" }
              as: Estimator
              captures: { est_doc_id: $.data.id }
            - call: "POST /estimates/${est_doc_id}/line-items"
              payload: { trade: "SHINGLE", squares: 10, unit_price_cents: 10000, waste_factor_pct: 0.10 }
              as: Estimator
            - call: "POST /estimates/${est_doc_id}/finalize"
              payload: {}
              as: Estimator
            - call: "POST /jobs/${job_id}/mark-estimated"
              payload: {}
              as: Estimator
            - call: "POST /jobs/${job_id}/contract"
              payload: { estimate_id: "${est_doc_id}" }
              as: Estimator
          trigger:
            - call: "POST /jobs/${job_id}/contract"
              payload: { estimate_id: "${est_doc_id}" }
              as: Estimator
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_INVALID_STATE"

      - name: complete_inspection_initial_state
        claim_type: Initial State
        grounds:
          - state_machines.Inspection.initial_state
          - entities.Inspection.fields.status
        distinguishing_aspect: "A freshly created inspection has status=SCHEDULED (the declared initial_state)."
        test_recipe:
          setup:
            - "A job and a DAMAGE_ASSESSMENT inspection just created."
          setup_api_calls:
            - call: "POST /estimators"
              payload: { name: "Ann Est", license_no: "TX-1001" }
              as: Estimator
              captures: { est_id: $.data.id }
            - call: "POST /jobs"
              payload: { customer_name: "Homer R", property_address: "1 Oak St", peril: "HAIL", assigned_estimator_id: "${est_id}" }
              as: FieldAdjuster
              captures: { job_id: $.data.id }
          trigger:
            - call: "POST /inspections"
              payload: { job_id: "${job_id}", kind: "DAMAGE_ASSESSMENT", scheduled_start: "2026-03-01T08:00:00Z", scheduled_end: "2026-03-01T10:00:00Z" }
              as: FieldAdjuster
              captures: { insp_id: $.data.id }
          assert:
            - "response status == 201"
            - "Inspection.${insp_id}.status == SCHEDULED"

      - name: damage_assessment_pass_requires_severity
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Inspection.SCHEDULED_to_PASSED
          - errors[ERR_SEVERITY_REQUIRED]
        distinguishing_aspect: "Completing a DAMAGE_ASSESSMENT as PASS without damage_severity returns ERR_SEVERITY_REQUIRED (422)."
        test_recipe:
          setup:
            - "A SCHEDULED DAMAGE_ASSESSMENT inspection."
          setup_api_calls:
            - call: "POST /estimators"
              payload: { name: "Ann Est", license_no: "TX-1001" }
              as: Estimator
              captures: { est_id: $.data.id }
            - call: "POST /jobs"
              payload: { customer_name: "Homer R", property_address: "1 Oak St", peril: "HAIL", assigned_estimator_id: "${est_id}" }
              as: FieldAdjuster
              captures: { job_id: $.data.id }
            - call: "POST /inspections"
              payload: { job_id: "${job_id}", kind: "DAMAGE_ASSESSMENT", scheduled_start: "2026-03-01T08:00:00Z", scheduled_end: "2026-03-01T10:00:00Z" }
              as: FieldAdjuster
              captures: { da_id: $.data.id }
          trigger:
            - call: "POST /inspections/${da_id}/complete"
              payload: { outcome: "PASS" }
              as: FieldAdjuster
              captures: { err: $.data.error_id }
          assert:
            - "response status == 422"
            - "data.error_id == ERR_SEVERITY_REQUIRED"

      - name: permit_final_pass_closes_permit_cross_entity
        claim_type: Cross-entity
        grounds:
          - state_machines.Inspection.SCHEDULED_to_PASSED
          - state_machines.Permit.ISSUED_to_CLOSED
          - entities.Permit.fields.status
        distinguishing_aspect: "Passing a PERMIT_FINAL inspection cross-mutates the referenced ISSUED permit to CLOSED."
        test_recipe:
          setup:
            - "An IN_PRODUCTION job with an ISSUED permit and a SCHEDULED PERMIT_FINAL inspection referencing it."
          setup_api_calls:
            - call: "POST /estimators"
              payload: { name: "Ann Est", license_no: "TX-1001" }
              as: Estimator
              captures: { est_id: $.data.id }
            - call: "POST /jobs"
              payload: { customer_name: "Homer R", property_address: "1 Oak St", peril: "HAIL", assigned_estimator_id: "${est_id}" }
              as: FieldAdjuster
              captures: { job_id: $.data.id }
            - call: "POST /inspections"
              payload: { job_id: "${job_id}", kind: "DAMAGE_ASSESSMENT", scheduled_start: "2026-03-01T08:00:00Z", scheduled_end: "2026-03-01T10:00:00Z" }
              as: FieldAdjuster
              captures: { da_id: $.data.id }
            - call: "POST /inspections/${da_id}/complete"
              payload: { outcome: "PASS", damage_severity: "MODERATE" }
              as: FieldAdjuster
            - call: "POST /jobs/${job_id}/mark-inspected"
              payload: {}
              as: FieldAdjuster
            - call: "POST /estimates"
              payload: { job_id: "${job_id}", source_kind: "FIELD" }
              as: Estimator
              captures: { est_doc_id: $.data.id }
            - call: "POST /estimates/${est_doc_id}/line-items"
              payload: { trade: "SHINGLE", squares: 10, unit_price_cents: 10000, waste_factor_pct: 0.10 }
              as: Estimator
            - call: "POST /estimates/${est_doc_id}/finalize"
              payload: {}
              as: Estimator
            - call: "POST /jobs/${job_id}/mark-estimated"
              payload: {}
              as: Estimator
            - call: "POST /jobs/${job_id}/contract"
              payload: { estimate_id: "${est_doc_id}" }
              as: Estimator
            - call: "POST /material-orders"
              payload: { job_id: "${job_id}" }
              as: ProductionManager
              captures: { mo_id: $.data.id }
            - call: "POST /material-orders/${mo_id}/deliver"
              payload: {}
              as: ProductionManager
            - call: "POST /permits"
              payload: { job_id: "${job_id}", municipality: "Dallas" }
              as: ProductionManager
              captures: { permit_id: $.data.id }
            - call: "POST /permits/${permit_id}/issue"
              payload: { permit_number: "P-7777" }
              as: ProductionManager
            - call: "POST /jobs/${job_id}/start-production"
              payload: {}
              as: ProductionManager
            - call: "POST /inspections"
              payload: { job_id: "${job_id}", kind: "PERMIT_FINAL", permit_id: "${permit_id}", scheduled_start: "2026-07-10T08:00:00Z", scheduled_end: "2026-07-10T12:00:00Z" }
              as: FieldAdjuster
              captures: { pf_id: $.data.id }
          trigger:
            - call: "POST /inspections/${pf_id}/complete"
              payload: { outcome: "PASS" }
              as: FieldAdjuster
          assert:
            - "Inspection.${pf_id}.status == PASSED"
            - "Permit.${permit_id}.status == CLOSED"

      - name: cancel_booked_crew_frees_window
        claim_type: Compensation
        grounds:
          - state_machines.CrewAssignment.BOOKED_to_CANCELLED
          - calculations.crew_window_overlap
        distinguishing_aspect: "Cancelling a BOOKED crew assignment frees its window: a subsequent identical-window booking for the same crew then succeeds (201) where it would otherwise collide."
        test_recipe:
          setup:
            - "An IN_PRODUCTION job; crew Delta booked 2026-07-01T08:00..16:00, then that assignment is cancelled."
          setup_api_calls:
            - call: "POST /estimators"
              payload: { name: "Ann Est", license_no: "TX-1001" }
              as: Estimator
              captures: { est_id: $.data.id }
            - call: "POST /crews"
              payload: { name: "Crew Delta" }
              as: ProductionManager
              captures: { crew_id: $.data.id }
            - call: "POST /jobs"
              payload: { customer_name: "Homer R", property_address: "1 Oak St", peril: "HAIL", assigned_estimator_id: "${est_id}" }
              as: FieldAdjuster
              captures: { job_id: $.data.id }
            - call: "POST /inspections"
