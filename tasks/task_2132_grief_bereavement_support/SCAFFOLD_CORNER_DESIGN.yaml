# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth walk of references/claim-extraction-guide.md against SCAFFOLD.yaml §1.1-§1.7.
# Corners already exercised by SCAFFOLD_DIFFICULTY_DESIGN.yaml are emitted as
# `excluded_because:` stubs and carry no test_recipe.
scaffold_corner_design:

  # ===================================================================
  - section: entities
    instances:

      - name: referral_create_returns_201_with_system_fields_populated
        claim_type: Creation
        grounds: [entities.Referral, endpoints.POST_/bereavement/referrals]
        distinguishing_aspect: "A referral created with every required field returns HTTP 201, status RECEIVED, version 1, a server-minted UUID id with no type prefix, and screening_band / days_since_death / participant_id all null."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; empty database."
          setup_api_calls:
            - call: "POST /bereavement/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramDirector
          trigger:
            - call: "POST /bereavement/referrals"
              payload: { source_type: "HOSPICE", source_org_name: "Riverside Hospice", decedent_name: "Ann Vance", date_of_death: "2026-06-01", relationship_to_deceased: "SPOUSE", loss_type: "ANTICIPATED_ILLNESS", contact_name: "Ben Vance", contact_email: "ben.vance@example.org" }
              as: ReferralSource
              captures: { ref_id: $.data.id, ref_v: $.data.version }
          assert:
            - "HTTP status is 201"
            - "Referral.${ref_id}.status == RECEIVED"
            - "ref_v == 1"
            - "Referral.${ref_id}.screening_band is null"
            - "Referral.${ref_id}.days_since_death is null"
            - "Referral.${ref_id}.participant_id is null"
            - "Referral.${ref_id}.id matches the bare UUID form with no prefix"

      - name: referral_create_missing_required_contact_email_returns_invalid_request
        claim_type: Required Fields
        grounds: ["entities.Referral.fields.contact_email", "validations[priority=6]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting contact_email, a source:input field with no default, returns ERR_INVALID_REQUEST (422) and creates no Referral."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; empty database."
          setup_api_calls:
            - call: "POST /bereavement/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramDirector
          trigger:
            - call: "POST /bereavement/referrals"
              payload: { source_type: "SELF", decedent_name: "Ann Vance", date_of_death: "2026-06-01", relationship_to_deceased: "SPOUSE", loss_type: "ANTICIPATED_ILLNESS", contact_name: "Ben Vance" }
              as: ReferralSource
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 422"
            - "err == ERR_INVALID_REQUEST"
            - "GET /bereavement/referrals returns 0 rows"

      - name: referral_from_hospice_without_source_org_name_returns_invalid_request
        claim_type: Type Constraints
        grounds: ["entities.Referral.fields.source_org_name", "validations[priority=6]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "The conditional shape rule fires: source_org_name is optional in the endpoint schema but mandatory whenever source_type != SELF, so a HOSPICE referral without it returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; empty database."
          setup_api_calls:
            - call: "POST /bereavement/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramDirector
          trigger:
            - call: "POST /bereavement/referrals"
              payload: { source_type: "HOSPICE", decedent_name: "Ann Vance", date_of_death: "2026-06-01", relationship_to_deceased: "SPOUSE", loss_type: "ANTICIPATED_ILLNESS", contact_name: "Ben Vance", contact_email: "ben.vance@example.org" }
              as: ReferralSource
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 422"
            - "err == ERR_INVALID_REQUEST"

      - name: meeting_space_turnover_buffer_defaults_to_thirty_when_omitted
        claim_type: Defaults
        grounds: [entities.MeetingSpace.fields.turnover_buffer_minutes, endpoints.POST_/bereavement/meeting-spaces]
        distinguishing_aspect: "Omitting turnover_buffer_minutes stores the declared default 30, and status defaults to AVAILABLE."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; empty database."
          setup_api_calls:
            - call: "POST /bereavement/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramDirector
          trigger:
            - call: "POST /bereavement/meeting-spaces"
              payload: { name: "Quiet Room", capacity: 12 }
              as: ProgramDirector
              captures: { sp_id: $.data.id, buf: $.data.turnover_buffer_minutes }
          assert:
            - "HTTP status is 201"
            - "buf == 30"
            - "MeetingSpace.${sp_id}.status == AVAILABLE"
            - "MeetingSpace.${sp_id}.accessibility_features == []"

      - name: volunteer_companion_max_concurrent_matches_defaults_to_three
        claim_type: Defaults
        grounds: [entities.VolunteerCompanion.fields.max_concurrent_matches, entities.VolunteerCompanion.fields.status]
        distinguishing_aspect: "Omitting max_concurrent_matches stores 3, training_hours starts at 0, modules_completed is empty and status is APPLIED."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; empty database."
          setup_api_calls:
            - call: "POST /bereavement/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramDirector
          trigger:
            - call: "POST /bereavement/volunteer-companions"
              payload: { full_name: "Noor Ellery", endorsed_loss_types: ["ANTICIPATED_ILLNESS", "SUDDEN_DEATH"] }
              as: ProgramDirector
              captures: { vc_id: $.data.id, cap: $.data.max_concurrent_matches }
          assert:
            - "HTTP status is 201"
            - "cap == 3"
            - "VolunteerCompanion.${vc_id}.status == APPLIED"
            - "VolunteerCompanion.${vc_id}.training_hours == 0"
            - "VolunteerCompanion.${vc_id}.modules_completed == []"
            - "VolunteerCompanion.${vc_id}.certified_on is null"
            - "VolunteerCompanion.${vc_id}.active_match_count == 0"

      - name: cohort_series_end_date_and_seat_counters_are_computed_at_creation
        claim_type: Computed Fields
        grounds: [entities.Cohort.fields.series_end_date, entities.Cohort.fields.seats_open, calculations.program_cost_total]
        distinguishing_aspect: "series_end_date is series_start_date + 7 * (sessions_total - 1) days = 2026-10-27 for a 2026-09-08 start with 8 sessions, and the seat pool initialises to seats_open 6 / seats_held 0 / seats_filled 0."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "MeetingSpace 'Chapel Room' with capacity 20."
          setup_api_calls:
            - call: "POST /bereavement/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramDirector
            - call: "POST /bereavement/meeting-spaces"
              payload: { name: "Chapel Room", capacity: 20, turnover_buffer_minutes: 30 }
              as: ProgramDirector
              captures: { sp_id: $.data.id }
          trigger:
            - call: "POST /bereavement/cohorts"
              payload: { name: "Computed Fields Group", loss_type: "PEDIATRIC", meeting_space_id: "${sp_id}", seats_total: 6, min_viable_enrollment: 2, weekday: "TUE", start_minute_utc: 600, duration_minutes: 90, series_start_date: "2026-09-08", sessions_total: 8, direct_cost_cents: 100000 }
              as: ProgramDirector
              captures: { c_id: $.data.id, c_end: $.data.series_end_date }
          assert:
            - "c_end == 2026-10-27"
            - "Cohort.${c_id}.seats_open == 6"
            - "Cohort.${c_id}.seats_held == 0"
            - "Cohort.${c_id}.seats_filled == 0"
            - "Cohort.${c_id}.admin_fee_cents == 12000"
            - "Cohort.${c_id}.program_cost_total_cents == 112000"
            - "Cohort.${c_id}.status == FORMING"

      - name: participant_system_fields_are_copied_from_the_accepted_referral
        claim_type: System Fields
        grounds: [entities.Participant.fields.loss_type, entities.Participant.fields.anniversary_month_day, entities.Participant.fields.referral_id, state_machines.Referral.SCREENED_to_ACCEPTED]
        distinguishing_aspect: "Accepting a referral copies loss_type, relationship_to_deceased, date_of_death and contact_name onto the Participant and derives anniversary_month_day 06-01 from date_of_death 2026-06-01; none of these are client inputs on the accept call."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "One SCREENED Referral for a PERINATAL loss with date_of_death 2026-06-01."
          setup_api_calls:
            - call: "POST /bereavement/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramDirector
            - call: "POST /bereavement/referrals"
              payload: { source_type: "HOSPICE", source_org_name: "Riverside Hospice", decedent_name: "Baby Nolan", date_of_death: "2026-06-01", relationship_to_deceased: "PARENT", loss_type: "PERINATAL", contact_name: "Ida Nolan", contact_email: "ida.nolan@example.org" }
              as: ReferralSource
              captures: { ref_id: $.data.id }
            - call: "POST /bereavement/referrals/${ref_id}/screen"
              payload: { eligibility_note: "in service area" }
              as: IntakeCoordinator
          trigger:
            - call: "POST /bereavement/referrals/${ref_id}/accept"
              payload: {}
              as: IntakeCoordinator
              captures: { p_id: $.data.id, amd: $.data.anniversary_month_day }
          assert:
            - "HTTP status is 201"
            - "Participant.${p_id}.referral_id == ${ref_id}"
            - "Participant.${p_id}.loss_type == PERINATAL"
            - "Participant.${p_id}.relationship_to_deceased == PARENT"
            - "Participant.${p_id}.date_of_death == 2026-06-01"
            - "amd == 06-01"
            - "Participant.${p_id}.display_name == Ida Nolan"
            - "Participant.${p_id}.service_status == INTAKE"
            - "Participant.${p_id}.outreach_status == SCHEDULED"
            - "Participant.${p_id}.risk_tier == LOW"
            - "Referral.${ref_id}.status == ACCEPTED"
            - "Referral.${ref_id}.participant_id == ${p_id}"

      - name: assessment_rows_are_immutable_and_carry_no_version_field
        claim_type: Immutability
        grounds: [entities.Assessment, entities.Assessment.fields.sequence_index]
        distinguishing_aspect: "Assessment declares common_fields false, so its rows expose id and created_at but no updated_at or version, no update endpoint exists, and sequence_index numbers rows 1, 2, 3 in creation order across all kinds."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "One accepted Participant."
          setup_api_calls:
            - call: "POST /bereavement/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramDirector
            - call: "POST /bereavement/referrals"
              payload: { source_type: "SELF", decedent_name: "Elin Roos", date_of_death: "2026-05-20", relationship_to_deceased: "SPOUSE", loss_type: "SUDDEN_DEATH", contact_name: "Finn Roos", contact_email: "finn.roos@example.org" }
              as: ReferralSource
              captures: { ref_id: $.data.id }
            - call: "POST /bereavement/referrals/${ref_id}/screen"
              payload: { eligibility_note: "ok" }
              as: IntakeCoordinator
            - call: "POST /bereavement/referrals/${ref_id}/accept"
              payload: {}
              as: IntakeCoordinator
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /bereavement/participants/${p_id}/assessments"
              payload: { kind: "NEEDS", instrument: "ICG_SF", grief_severity: 10, isolation_index: 4, functional_impairment: 4, suicidality_flag: false }
              as: IntakeCoordinator
              captures: { a1_id: $.data.id, a1_seq: $.data.sequence_index }
            - call: "POST /bereavement/participants/${p_id}/assessments"
              payload: { kind: "BASELINE", instrument: "ICG_SF", grief_severity: 10, isolation_index: 4, functional_impairment: 4, suicidality_flag: false }
              as: IntakeCoordinator
              captures: { a2_id: $.data.id, a2_seq: $.data.sequence_index }
          assert:
            - "a1_seq == 1"
            - "a2_seq == 2"
            - "Each row returned by GET /bereavement/participants/${p_id}/assessments has id and created_at but no version and no updated_at field"
            - "Assessment.${a1_id}.raw_total == 18"
            - "Assessment.${a1_id}.normalized_score == 22.50"
            - "Assessment.${a1_id}.recorded_at == 2026-09-01T00:00:00.000Z"

      - name: assessment_grief_severity_above_range_returns_invalid_request
        claim_type: Type Constraints
        grounds: ["entities.Assessment.fields.grief_severity", "validations[priority=6]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "grief_severity is constrained to 0..40 inclusive, so 41 returns ERR_INVALID_REQUEST (422) and no Assessment row is created."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "One accepted Participant with no assessments."
          setup_api_calls:
            - call: "POST /bereavement/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramDirector
            - call: "POST /bereavement/referrals"
              payload: { source_type: "SELF", decedent_name: "Elin Roos", date_of_death: "2026-05-20", relationship_to_deceased: "SPOUSE", loss_type: "SUDDEN_DEATH", contact_name: "Finn Roos", contact_email: "finn.roos@example.org" }
              as: ReferralSource
              captures: { ref_id: $.data.id }
            - call: "POST /bereavement/referrals/${ref_id}/screen"
              payload: { eligibility_note: "ok" }
              as: IntakeCoordinator
            - call: "POST /bereavement/referrals/${ref_id}/accept"
              payload: {}
              as: IntakeCoordinator
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /bereavement/participants/${p_id}/assessments"
              payload: { kind: "NEEDS", instrument: "ICG_SF", grief_severity: 41, isolation_index: 4, functional_impairment: 4, suicidality_flag: false }
              as: IntakeCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 422"
            - "err == ERR_INVALID_REQUEST"
            - "GET /bereavement/participants/${p_id}/assessments returns 0 rows"
            - "Participant.${p_id}.composite_need_index == 0"
            - "Participant.${p_id}.service_status == INTAKE"

      - name: participant_read_with_unknown_id_returns_participant_not_found
        claim_type: Not Found
        grounds: ["errors[ERR_PARTICIPANT_NOT_FOUND]", "validations[priority=5]"]
        distinguishing_aspect: "A well-formed but unused UUID on GET /bereavement/participants/{id} returns ERR_PARTICIPANT_NOT_FOUND with HTTP 404."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; empty database."
          setup_api_calls:
            - call: "POST /bereavement/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramDirector
          trigger:
            - call: "GET /bereavement/participants/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: IntakeCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 404"
            - "err == ERR_PARTICIPANT_NOT_FOUND"

      - name: cohorts_filtered_list_by_meeting_space_id_returns_only_matching_rows
        claim_type: Listing
        grounds: [endpoints.GET_/bereavement/cohorts, entities.Cohort.fields.meeting_space_id]
        distinguishing_aspect: "The FK reverse-reachability filter works: with one cohort in each of two spaces, GET /bereavement/cohorts?meeting_space_id=<space A> returns exactly the cohort in space A and total_count 1."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "Two MeetingSpaces, each with one FORMING Cohort on the same weekday and minute block."
          setup_api_calls:
            - call: "POST /bereavement/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramDirector
            - call: "POST /bereavement/meeting-spaces"
              payload: { name: "Room A", capacity: 20, turnover_buffer_minutes: 30 }
              as: ProgramDirector
              captures: { sp_a_id: $.data.id }
            - call: "POST /bereavement/meeting-spaces"
              payload: { name: "Room B", capacity: 20, turnover_buffer_minutes: 30 }
              as: ProgramDirector
              captures: { sp_b_id: $.data.id }
            - call: "POST /bereavement/cohorts"
              payload: { name: "Group In A", loss_type: "ANTICIPATED_ILLNESS", meeting_space_id: "${sp_a_id}", seats_total: 4, min_viable_enrollment: 1, weekday: "TUE", start_minute_utc: 600, duration_minutes: 90, series_start_date: "2026-09-08", sessions_total: 8, direct_cost_cents: 100000 }
              as: ProgramDirector
              captures: { c_a_id: $.data.id }
            - call: "POST /bereavement/cohorts"
              payload: { name: "Group In B", loss_type: "SUDDEN_DEATH", meeting_space_id: "${sp_b_id}", seats_total: 4, min_viable_enrollment: 1, weekday: "TUE", start_minute_utc: 600, duration_minutes: 90, series_start_date: "2026-09-08", sessions_total: 8, direct_cost_cents: 100000 }
              as: ProgramDirector
              captures: { c_b_id: $.data.id }
          trigger:
            - call: "GET /bereavement/cohorts?meeting_space_id=${sp_a_id}"
              payload: {}
              as: ProgramDirector
              captures: { first_id: "$.data[0].id" }
          assert:
            - "HTTP status is 200"
            - "meta pagination reports total_count 1 and has_more false"
            - "first_id == ${c_a_id}"
            - "The response array has exactly 1 element"
            - "Creating Group In B in a different space did not raise ERR_SPACE_TIME_CONFLICT even though its weekday and minute block are identical"

      - name: enrollment_create_with_unknown_cohort_id_in_body_returns_cohort_not_found
        claim_type: Parent Relationships
        grounds: ["validations[priority=7]", "errors[ERR_COHORT_NOT_FOUND]", "entities.Enrollment.fields.cohort_id"]
        distinguishing_aspect: "Body-level FK integrity: an enrollment naming a non-existent cohort_id fails at priority 7 with ERR_COHORT_NOT_FOUND (404) before any OCC, state or business rule is consulted."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "One MeetingSpace and one real OPEN_ENROLLMENT Cohort, so a valid cohort version is observable."
            - "One accepted Participant with a NEEDS Assessment."
          setup_api_calls:
            - call: "POST /bereavement/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramDirector
            - call: "POST /bereavement/meeting-spaces"
              payload: { name: "Chapel Room", capacity: 20, turnover_buffer_minutes: 30 }
              as: ProgramDirector
              captures: { sp_id: $.data.id }
            - call: "POST /bereavement/cohorts"
              payload: { name: "Real Group", loss_type: "SUDDEN_DEATH", meeting_space_id: "${sp_id}", seats_total: 4, min_viable_enrollment: 1, weekday: "TUE", start_minute_utc: 600, duration_minutes: 90, series_start_date: "2026-09-08", sessions_total: 8, direct_cost_cents: 100000 }
              as: ProgramDirector
              captures: { c_id: $.data.id }
            - call: "POST /bereavement/cohorts/${c_id}/open-enrollment"
              payload: {}
              as: ProgramDirector
              captures: { c_v_open: $.data.version }
            - call: "POST /bereavement/referrals"
              payload: { source_type: "SELF", decedent_name: "Elin Roos", date_of_death: "2026-05-20", relationship_to_deceased: "SPOUSE", loss_type: "SUDDEN_DEATH", contact_name: "Finn Roos", contact_email: "finn.roos@example.org" }
              as: ReferralSource
              captures: { ref_id: $.data.id }
            - call: "POST /bereavement/referrals/${ref_id}/screen"
              payload: { eligibility_note: "ok" }
              as: IntakeCoordinator
            - call: "POST /bereavement/referrals/${ref_id}/accept"
              payload: {}
              as: IntakeCoordinator
              captures: { p_id: $.data.id }
            - call: "POST /bereavement/participants/${p_id}/assessments"
              payload: { kind: "NEEDS", instrument: "ICG_SF", grief_severity: 10, isolation_index: 4, functional_impairment: 4, suicidality_flag: false }
              as: IntakeCoordinator
          trigger:
            - call: "POST /bereavement/enrollments"
              payload: { participant_id: "${p_id}", cohort_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", expected_cohort_version: "${c_v_open}" }
              as: IntakeCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 404"
            - "err == ERR_COHORT_NOT_FOUND"
            - "GET /bereavement/enrollments?participant_id=${p_id} returns 0 rows"

  # ===================================================================
  - section: state_machines
    instances:

      - name: referral_accept_without_screening_returns_referral_not_screened
        claim_type: Invalid Transitions
        grounds: ["state_machines.Referral.RECEIVED_to_SCREENED", "errors[ERR_REFERRAL_NOT_SCREENED]", "validations[priority=9]"]
        distinguishing_aspect: "ACCEPTED is only reachable from SCREENED; calling accept on a RECEIVED Referral returns ERR_REFERRAL_NOT_SCREENED (409) and mints no Participant."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "One Referral left in RECEIVED."
          setup_api_calls:
            - call: "POST /bereavement/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramDirector
            - call: "POST /bereavement/referrals"
              payload: { source_type: "SELF", decedent_name: "Elin Roos", date_of_death: "2026-05-20", relationship_to_deceased: "SPOUSE", loss_type: "SUDDEN_DEATH", contact_name: "Finn Roos", contact_email: "finn.roos@example.org" }
              as: ReferralSource
              captures: { ref_id: $.data.id }
          trigger:
            - call: "POST /bereavement/referrals/${ref_id}/accept"
              payload: {}
              as: IntakeCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 409"
            - "err == ERR_REFERRAL_NOT_SCREENED"
            - "Referral.${ref_id}.status == RECEIVED"
            - "Referral.${ref_id}.participant_id is null"
            - "GET /bereavement/participants returns 0 rows"

      - name: referral_decline_twice_second_call_returns_already_terminal
        claim_type: Terminal State Lockdown
        grounds: ["state_machines.Referral.SCREENED_to_DECLINED", "errors[ERR_ALREADY_TERMINAL]"]
        distinguishing_aspect: "DECLINED is a terminal state of the Referral machine, so a second decline on the same Referral returns ERR_ALREADY_TERMINAL (409) and leaves decline_reason at the value written by the first call."
        test_recipe:
          setup:
