          The org-type adjustment is two asymmetric tables, and a private
          foundation is where they diverge most: grants_paid is added to the
          numerator AND to the denominator, while joint_cost_allocated - which
          a public charity subtracts - is ignored entirely. The fixture reports
          both fields, so the four plausible mis-implementations each produce a
          distinct visible ratio: 0.8333 correct, 0.7500 (public-charity
