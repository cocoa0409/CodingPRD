          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "CA Store", state_code: "CA" }
              as: PlatformAdmin
              captures: { store_id: $.data.id }
            - call: "POST /skus"
              payload: { sport: "BASEBALL", name: "Glove3", base_price_cents: 3000, size_label: "M" }
              as: PlatformAdmin
              captures: { sku_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "ca@x.com", full_name: "Cust A", home_state_code: "CA" }
              as: PlatformAdmin
              captures: { cust_a: $.data.id }
            - call: "POST /customers"
              payload: { email: "cb@x.com", full_name: "Cust B", home_state_code: "CA" }
              as: PlatformAdmin
              captures: { cust_b: $.data.id }
            - call: "POST /store-inventory"
              payload: { store_id: "${store_id}", sku_id: "${sku_id}" }
              as: PlatformAdmin
              captures: { inv_id: $.data.id, inv_v: $.data.version }
            - call: "POST /store-inventory/${inv_id}/receive"
              payload: { quantity: 5, expected_store_inventory_version: "${inv_v}" }
              as: PlatformAdmin
            - call: "POST /orders"
              payload: { customer_id: "${cust_a}", store_id: "${store_id}", fulfillment_type: "BOPIS" }
              as: Customer
              as_user_id: "${cust_a}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/lines"
              payload: { sku_id: "${sku_id}", quantity: 1 }
              as: Customer
              as_user_id: "${cust_a}"
          trigger:
            - call: "POST /orders/${order_id}/place"
              payload: {}
              as: Customer
              as_user_id: "${cust_b}"
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_NOT_RESOURCE_OWNER"
            - "HTTP status == 403"

      - name: missing_auth_header_unauthenticated
        claim_type: forbidden_operation
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request to POST /orders with no X-User-Role/X-User-ID headers returns ERR_UNAUTHENTICATED (401)."
        test_recipe:
          setup: ["A store and customer exist."]
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "CA Store", state_code: "CA" }
              as: PlatformAdmin
              captures: { store_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "ua@x.com", full_name: "UA Cust", home_state_code: "CA" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", store_id: "${store_id}", fulfillment_type: "BOPIS" }
              as: Customer
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_UNAUTHENTICATED (no headers sent)"
            - "HTTP status == 401"

  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_inventory_receive_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[inventory-receive-stale-version]", "errors[ERR_STALE_INVENTORY_VERSION]"]
        distinguishing_aspect: "After a reservation bumps the inventory row's version, a receive carrying the pre-reservation expected_store_inventory_version is rejected with ERR_STALE_INVENTORY_VERSION (412)."
        test_recipe:
          setup: ["Inventory row received to qty 5 (version 2); an order places a line qty 1 against it (version 3); operator still holds version-2 view as ${inv_v_pre} - 1 expression below."]
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "CA Store", state_code: "CA" }
              as: PlatformAdmin
              captures: { store_id: $.data.id }
            - call: "POST /skus"
              payload: { sport: "FOOTWEAR", name: "Cleat", base_price_cents: 6000, size_label: "10D" }
              as: PlatformAdmin
              captures: { sku_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "occ@x.com", full_name: "OCC Cust", home_state_code: "CA" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /store-inventory"
              payload: { store_id: "${store_id}", sku_id: "${sku_id}" }
              as: PlatformAdmin
              captures: { inv_id: $.data.id, inv_v0: $.data.version }
            - call: "POST /store-inventory/${inv_id}/receive"
              payload: { quantity: 5, expected_store_inventory_version: "${inv_v0}" }
              as: PlatformAdmin
              captures: { inv_v1: $.data.version }
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", store_id: "${store_id}", fulfillment_type: "BOPIS" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/lines"
              payload: { sku_id: "${sku_id}", quantity: 1 }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /orders/${order_id}/place"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /store-inventory/${inv_id}/receive"
              payload: { quantity: 3, expected_store_inventory_version: "${inv_v1}" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_STALE_INVENTORY_VERSION (place bumped version past inv_v1)"
            - "HTTP status == 412"

      - name: occ_order_fulfill_stale_after_pricematch_approve
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[order-fulfill-stale-version]", "errors[ERR_STALE_ORDER_VERSION]"]
        excluded_because:
          difficulty_instance: dual_variant_calc / order_provisional_vs_final_pricematch_divergence
          rationale: "The order-fulfill OCC path is exercised by the §1.8 dual-variant instance which re-reads Order.version after price-match approval before fulfilling; this stub records the stale-version corner without duplicating the recipe."

      - name: derived_available_qty_reconciled_after_reserve_and_commit
        claim_type: derived_field_reconciliation
        grounds: [entities.StoreInventory.fields.available_qty, state_machines.Order.DRAFT_to_RESERVED, state_machines.Order.READY_to_FULFILLED]
        distinguishing_aspect: "available_qty == on_hand_qty - reserved_qty holds after each step: received 5 -> available 5; place qty 2 -> available 3, reserved 2; fulfill -> on_hand 3, reserved 0, available 3."
        test_recipe:
          setup: ["SKU stocked qty 5; order line qty 2 placed and readied."]
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "CA Store", state_code: "CA" }
              as: PlatformAdmin
              captures: { store_id: $.data.id }
            - call: "POST /skus"
              payload: { sport: "FOOTWEAR", name: "Spike", base_price_cents: 5000, size_label: "9D" }
              as: PlatformAdmin
              captures: { sku_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "rec@x.com", full_name: "Rec Cust", home_state_code: "CA" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /store-inventory"
              payload: { store_id: "${store_id}", sku_id: "${sku_id}" }
              as: PlatformAdmin
              captures: { inv_id: $.data.id, inv_v: $.data.version }
            - call: "POST /store-inventory/${inv_id}/receive"
              payload: { quantity: 5, expected_store_inventory_version: "${inv_v}" }
              as: PlatformAdmin
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", store_id: "${store_id}", fulfillment_type: "BOPIS" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/lines"
              payload: { sku_id: "${sku_id}", quantity: 2 }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /orders/${order_id}/place"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /orders/${order_id}/ready"
              payload: {}
              as: StoreAssociate
            - call: "GET /orders/${order_id}"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ord_v: $.data.version }
          trigger:
            - call: "POST /orders/${order_id}/fulfill"
              payload: { expected_order_version: "${ord_v}" }
              as: StoreAssociate
          assert:
            - "StoreInventory.${inv_id}.on_hand_qty == 3"
            - "StoreInventory.${inv_id}.reserved_qty == 0"
            - "StoreInventory.${inv_id}.available_qty == 3"

