# SCAFFOLD_DIFFICULTY_DESIGN.yaml — §1.8 Test Targeting Index
# Scenario 2567 — Standards Development Consensus Process
# 9 rule_id blocks x 2 instances = 18 instances.
# Every instance grounds in elements declared in SCAFFOLD.yaml §1.1-§1.7 only.
# Logical clock default is 2026-08-01T00:00:00Z (see POST /_clock/set_current_utc).
scaffold_difficulty_design:

  # =====================================================================
  # Rule 1 — dual-variant calculations across different entity domains
  #   1a: committee balance (TechnicalCommittee / CommitteeMembership domain)
  #   1b: ballot approval  (Ballot / Vote domain)
  # =====================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: committee_balance_voting_basis_vs_roster_basis_divergence
        grounds:
          - calculations.committee_balance_evaluation
          - entities.TechnicalCommittee.fields.balance_status
          - entities.TechnicalCommittee.fields.roster_balance_status
          - entities.TechnicalCommittee.fields.roster_dominance_pct
          - state_machines.CommitteeMembership.ACTIVE_to_SUSPENDED
        distinguishing_aspect: |
          The two variants of committee_balance_evaluation read different membership sets on the
          TechnicalCommittee / CommitteeMembership domain, so one and the same committee row reports
          balance_status BALANCED with dominance_pct 33.3 over 3 ACTIVE voting seats while
          roster_balance_status is PROVISIONAL with roster_dominance_pct 60.0 over the 5-seat
          {ACTIVE, SUSPENDED} roster.
        test_recipe:
          setup:
            - "Five participants: one PRODUCER (ACME), one USER (CITYW), one GENERAL_INTEREST (SAFEL) and two further PRODUCERs on distinct employer codes (AXLE, BOLTCO), because ERR_AFFILIATION_ALREADY_REPRESENTED forbids two seats sharing an employer code."
            - "Committee TC-14 chaired by the ACME producer, all five participants appointed as voting members."
            - "The two extra PRODUCER seats are then moved to SUSPENDED, so the voting basis falls back to 3 seats in 3 categories while the roster keeps all 5."
            - "Logical clock left at its 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /sdo/participants"
              payload: { full_name: "Ada Producer", organization: "Acme Steel", interest_category: "PRODUCER", employer_affiliation_code: "ACME" }
              as: StandardsStaff
              captures: { p1: $.data.id }
            - call: "POST /sdo/participants"
              payload: { full_name: "Ben User", organization: "City Water", interest_category: "USER", employer_affiliation_code: "CITYW" }
              as: StandardsStaff
              captures: { p2: $.data.id }
            - call: "POST /sdo/participants"
              payload: { full_name: "Cleo General", organization: "Safety League", interest_category: "GENERAL_INTEREST", employer_affiliation_code: "SAFEL" }
              as: StandardsStaff
              captures: { p3: $.data.id }
            - call: "POST /sdo/participants"
              payload: { full_name: "Dov Producer", organization: "Axle Forge", interest_category: "PRODUCER", employer_affiliation_code: "AXLE" }
              as: StandardsStaff
              captures: { p4: $.data.id }
            - call: "POST /sdo/participants"
              payload: { full_name: "Eve Producer", organization: "Boltco", interest_category: "PRODUCER", employer_affiliation_code: "BOLTCO" }
              as: StandardsStaff
              captures: { p5: $.data.id }
            - call: "POST /sdo/committees"
              payload: { designation: "TC-14", scope_text: "Structural fasteners", chair_participant_id: "${p1}", max_concurrent_ballots: 2 }
              as: StandardsStaff
              captures: { c1: $.data.id }
            - call: "POST /sdo/committees/${c1}/memberships"
              payload: { participant_id: "${p1}", voting_rights: true }
              as: StandardsStaff
              captures: { m1: $.data.id }
            - call: "POST /sdo/committees/${c1}/memberships"
              payload: { participant_id: "${p2}", voting_rights: true }
              as: StandardsStaff
              captures: { m2: $.data.id }
            - call: "POST /sdo/committees/${c1}/memberships"
              payload: { participant_id: "${p3}", voting_rights: true }
              as: StandardsStaff
              captures: { m3: $.data.id }
            - call: "POST /sdo/committees/${c1}/activate"
              payload: {}
              as: StandardsStaff
            - call: "POST /sdo/committees/${c1}/memberships"
              payload: { participant_id: "${p4}", voting_rights: true }
              as: StandardsStaff
              captures: { m4: $.data.id }
            - call: "POST /sdo/committees/${c1}/memberships"
              payload: { participant_id: "${p5}", voting_rights: true }
              as: StandardsStaff
              captures: { m5: $.data.id }
            - call: "PATCH /sdo/memberships/${m4}"
              payload: { status: "SUSPENDED" }
              as: StandardsStaff
          trigger:
            - call: "PATCH /sdo/memberships/${m5}"
              payload: { status: "SUSPENDED" }
              as: StandardsStaff
            - call: "GET /sdo/committees/${c1}"
              payload: {}
              as: StandardsStaff
          assert:
            - "TechnicalCommittee.${c1}.active_member_count == 3"
            - "TechnicalCommittee.${c1}.distinct_category_count == 3"
            - "TechnicalCommittee.${c1}.dominance_pct == 33.3"
            - "TechnicalCommittee.${c1}.balance_status == BALANCED"
            - "TechnicalCommittee.${c1}.roster_member_count == 5"
            - "TechnicalCommittee.${c1}.roster_dominance_pct == 60.0"
            - "TechnicalCommittee.${c1}.roster_balance_status == PROVISIONAL"
            - "TechnicalCommittee.${c1}.balance_status != TechnicalCommittee.${c1}.roster_balance_status"
            - "TechnicalCommittee.${c1}.category_counts == { PRODUCER: 1, USER: 1, GENERAL_INTEREST: 1 }"
            - "CommitteeMembership.${m5}.status == SUSPENDED"

      - name: ballot_provisional_close_vs_final_adjudicated_approval_divergence
        grounds:
          - calculations.ballot_consensus_evaluation
          - entities.Ballot.fields.provisional_approval_pct
          - entities.Ballot.fields.final_approval_pct
          - state_machines.Vote.PENDING_to_PERSUASIVE
          - state_machines.Draft.COMMENT_RESOLUTION_to_DRAFTING
        distinguishing_aspect: |
          The two variants of ballot_consensus_evaluation read the same three CAST Vote rows on the
          Ballot / Vote domain, yet provisional_at_close writes provisional_approval_pct 66.7 with
          consensus_result APPROVED_PENDING_NEGATIVES while final_after_adjudication writes
          final_approval_pct 100.0 with consensus_result APPROVED on the very same Ballot row.
        test_recipe:
          setup:
            - "Balanced committee TC-14 (PRODUCER/USER/GENERAL_INTEREST, dominance 33.3) with the PRODUCER as chair."
            - "Work item STD-1400 with scope approved and sponsored by TC-14; revision 1 draft of 40 clauses."
            - "SUBCOMMITTEE ballot over 2026-08-01T00:00:00Z .. 2026-08-15T00:00:00Z (14 days) with 3 eligible seats."
            - "Two AFFIRMATIVE votes and one NEGATIVE vote carrying comment_text; the ballot is closed early because all 3 seats returned."
            - "Logical clock left at its 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /sdo/participants"
              payload: { full_name: "Ada Producer", organization: "Acme Steel", interest_category: "PRODUCER", employer_affiliation_code: "ACME" }
              as: StandardsStaff
              captures: { p1: $.data.id }
            - call: "POST /sdo/participants"
              payload: { full_name: "Ben User", organization: "City Water", interest_category: "USER", employer_affiliation_code: "CITYW" }
              as: StandardsStaff
              captures: { p2: $.data.id }
            - call: "POST /sdo/participants"
              payload: { full_name: "Cleo General", organization: "Safety League", interest_category: "GENERAL_INTEREST", employer_affiliation_code: "SAFEL" }
              as: StandardsStaff
              captures: { p3: $.data.id }
            - call: "POST /sdo/committees"
              payload: { designation: "TC-14", scope_text: "Structural fasteners", chair_participant_id: "${p1}", max_concurrent_ballots: 2 }
              as: StandardsStaff
              captures: { c1: $.data.id }
            - call: "POST /sdo/committees/${c1}/memberships"
              payload: { participant_id: "${p1}", voting_rights: true }
              as: StandardsStaff
              captures: { m1: $.data.id }
            - call: "POST /sdo/committees/${c1}/memberships"
              payload: { participant_id: "${p2}", voting_rights: true }
              as: StandardsStaff
              captures: { m2: $.data.id }
            - call: "POST /sdo/committees/${c1}/memberships"
              payload: { participant_id: "${p3}", voting_rights: true }
              as: StandardsStaff
              captures: { m3: $.data.id }
            - call: "POST /sdo/committees/${c1}/activate"
              payload: {}
              as: StandardsStaff
            - call: "POST /sdo/work-items"
              payload: { title: "Fastener torque spec", scope_text: "Torque limits for structural fasteners", work_item_type: "NEW_STANDARD", proposer_participant_id: "${p1}", target_completion_date: "2027-06-30" }
              as: Proposer
              as_user_id: "${p1}"
              captures: { w1: $.data.id }
            - call: "POST /sdo/work-items/${w1}/approve-scope"
              payload: { decision: "APPROVE", sponsoring_committee_id: "${c1}", designation: "STD-1400" }
              as: StandardsStaff
            - call: "POST /sdo/work-items/${w1}/drafts"
              payload: { total_clause_count: 40, changed_clause_count: 0, summary: "Revision 1" }
              as: CommitteeChair
              as_user_id: "${p1}"
              captures: { d1: $.data.id }
            - call: "POST /sdo/ballots"
              payload: { draft_id: "${d1}", committee_id: "${c1}", ballot_kind: "SUBCOMMITTEE", opens_at: "2026-08-01T00:00:00Z", closes_at: "2026-08-15T00:00:00Z" }
              as: CommitteeChair
              as_user_id: "${p1}"
              captures: { b1: $.data.id }
            - call: "POST /sdo/ballots/${b1}/votes"
              payload: { membership_id: "${m1}", position: "AFFIRMATIVE" }
              as: CommitteeChair
              as_user_id: "${p1}"
              captures: { v1: $.data.id }
            - call: "POST /sdo/ballots/${b1}/votes"
              payload: { membership_id: "${m2}", position: "AFFIRMATIVE" }
              as: CommitteeMember
              as_user_id: "${p2}"
              captures: { v2: $.data.id }
            - call: "POST /sdo/ballots/${b1}/votes"
              payload: { membership_id: "${m3}", position: "NEGATIVE", comment_text: "Clause 12 torque ceiling is unsafe", clause_reference: "12" }
              as: CommitteeMember
              as_user_id: "${p3}"
              captures: { v3: $.data.id }
            - call: "POST /sdo/ballots/${b1}/close"
              payload: {}
              as: CommitteeChair
              as_user_id: "${p1}"
          trigger:
            - call: "POST /sdo/votes/${v3}/adjudicate"
              payload: { resolution: "PERSUASIVE", adjudication_rationale: "Clause 12 will be re-drafted" }
              as: CommitteeChair
              as_user_id: "${p1}"
            - call: "GET /sdo/ballots/${b1}"
              payload: {}
              as: StandardsStaff
            - call: "GET /sdo/drafts/${d1}"
              payload: {}
              as: StandardsStaff
          assert:
            - "Vote.${v3}.adjudication_status == PERSUASIVE"
            - "Vote.${v3}.position == AFFIRMATIVE"
            - "Vote.${v3}.status == CAST"
            - "Ballot.${b1}.provisional_approval_pct == 66.7"
            - "Ballot.${b1}.final_approval_pct == 100.0"
            - "Ballot.${b1}.required_approval_pct == 50.1"
            - "Ballot.${b1}.affirmative_count == 3"
            - "Ballot.${b1}.negative_count == 0"
            - "Ballot.${b1}.pending_negative_count == 0"
            - "Ballot.${b1}.consensus_result == APPROVED"
            - "Draft.${d1}.status == DRAFTING"
            - "Draft.${d1}.recirculation_required == true"

  # =====================================================================
  # Rule 2 — combinatorial formulas in different modes
  #   2a: mode (b) — rounding order fixed before the threshold comparison
  #   2b: mode (c) — circular-looking dependency with a pinned evaluation order
  # =====================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: consensus_ballot_rounds_approval_before_comparing_threshold
        grounds:
          - calculations.ballot_consensus_evaluation
          - entities.Ballot.fields.required_approval_pct
          - entities.Ballot.fields.consensus_result
          - state_machines.Draft.CONSENSUS_BALLOT_to_COMMENT_RESOLUTION
          - validations[priority=93]
        distinguishing_aspect: |
          Mode (b): ballot_consensus_evaluation pins round_half_up to 1 decimal BEFORE the threshold
          comparison, so 2 affirmatives out of an approval base of 3 becomes exactly 66.7 and clears
          the CONSENSUS_BODY bar of 66.7, whereas comparing the unrounded 66.666...% would fall below
          it and yield FAILED_THRESHOLD instead of APPROVED_PENDING_NEGATIVES.
        test_recipe:
          setup:
            - "Balanced committee TC-14 with 3 voting seats in 3 distinct interest categories, chaired by the PRODUCER."
            - "Work item STD-1400 whose revision-1 draft has already passed a SUBCOMMITTEE ballot (one negative ruled NON_PERSUASIVE) and a 45-day public review that drew no comments, so the review is DISPOSITION_APPROVED and the draft is PUBLIC_REVIEW_CLOSED."
            - "Logical clock advanced to 2026-09-15T00:00:00Z."
            - "A CONSENSUS_BODY ballot open over 2026-09-15T00:00:00Z .. 2026-10-15T00:00:00Z (30 days) with 3 eligible seats, holding 2 AFFIRMATIVE and 1 NEGATIVE returns."
          setup_api_calls:
            - call: "POST /sdo/participants"
              payload: { full_name: "Ada Producer", organization: "Acme Steel", interest_category: "PRODUCER", employer_affiliation_code: "ACME" }
              as: StandardsStaff
              captures: { p1: $.data.id }
            - call: "POST /sdo/participants"
              payload: { full_name: "Ben User", organization: "City Water", interest_category: "USER", employer_affiliation_code: "CITYW" }
              as: StandardsStaff
              captures: { p2: $.data.id }
            - call: "POST /sdo/participants"
              payload: { full_name: "Cleo General", organization: "Safety League", interest_category: "GENERAL_INTEREST", employer_affiliation_code: "SAFEL" }
              as: StandardsStaff
              captures: { p3: $.data.id }
            - call: "POST /sdo/committees"
              payload: { designation: "TC-14", scope_text: "Structural fasteners", chair_participant_id: "${p1}", max_concurrent_ballots: 2 }
              as: StandardsStaff
              captures: { c1: $.data.id }
            - call: "POST /sdo/committees/${c1}/memberships"
              payload: { participant_id: "${p1}", voting_rights: true }
              as: StandardsStaff
              captures: { m1: $.data.id }
            - call: "POST /sdo/committees/${c1}/memberships"
              payload: { participant_id: "${p2}", voting_rights: true }
              as: StandardsStaff
              captures: { m2: $.data.id }
            - call: "POST /sdo/committees/${c1}/memberships"
              payload: { participant_id: "${p3}", voting_rights: true }
              as: StandardsStaff
              captures: { m3: $.data.id }
            - call: "POST /sdo/committees/${c1}/activate"
              payload: {}
              as: StandardsStaff
            - call: "POST /sdo/work-items"
              payload: { title: "Fastener torque spec", scope_text: "Torque limits for structural fasteners", work_item_type: "NEW_STANDARD", proposer_participant_id: "${p1}", target_completion_date: "2027-06-30" }
              as: Proposer
              as_user_id: "${p1}"
              captures: { w1: $.data.id }
            - call: "POST /sdo/work-items/${w1}/approve-scope"
              payload: { decision: "APPROVE", sponsoring_committee_id: "${c1}", designation: "STD-1400" }
              as: StandardsStaff
            - call: "POST /sdo/work-items/${w1}/drafts"
              payload: { total_clause_count: 40, changed_clause_count: 0, summary: "Revision 1" }
              as: CommitteeChair
              as_user_id: "${p1}"
              captures: { d1: $.data.id }
            - call: "POST /sdo/ballots"
              payload: { draft_id: "${d1}", committee_id: "${c1}", ballot_kind: "SUBCOMMITTEE", opens_at: "2026-08-01T00:00:00Z", closes_at: "2026-08-15T00:00:00Z" }
              as: CommitteeChair
              as_user_id: "${p1}"
              captures: { b1: $.data.id }
            - call: "POST /sdo/ballots/${b1}/votes"
              payload: { membership_id: "${m1}", position: "AFFIRMATIVE" }
              as: CommitteeChair
              as_user_id: "${p1}"
              captures: { v1: $.data.id }
            - call: "POST /sdo/ballots/${b1}/votes"
              payload: { membership_id: "${m2}", position: "AFFIRMATIVE" }
              as: CommitteeMember
              as_user_id: "${p2}"
              captures: { v2: $.data.id }
            - call: "POST /sdo/ballots/${b1}/votes"
              payload: { membership_id: "${m3}", position: "NEGATIVE", comment_text: "Clause 12 torque ceiling is unsafe", clause_reference: "12" }
              as: CommitteeMember
              as_user_id: "${p3}"
              captures: { v3: $.data.id }
            - call: "POST /sdo/ballots/${b1}/close"
              payload: {}
              as: CommitteeChair
              as_user_id: "${p1}"
            - call: "POST /sdo/votes/${v3}/adjudicate"
              payload: { resolution: "NON_PERSUASIVE", adjudication_rationale: "Clause 12 is already bounded by clause 9" }
              as: CommitteeChair
              as_user_id: "${p1}"
            - call: "GET /sdo/drafts/${d1}"
              payload: {}
              as: StandardsStaff
              captures: { d1_v: $.data.version }
            - call: "POST /sdo/public-reviews"
              payload: { draft_id: "${d1}", start_date: "2026-08-01", end_date: "2026-09-14", expected_draft_version: "${d1_v}" }
              as: StandardsStaff
              captures: { pr1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: StandardsStaff
            - call: "POST /sdo/public-reviews/${pr1}/close"
              payload: {}
              as: StandardsStaff
            - call: "POST /sdo/ballots"
              payload: { draft_id: "${d1}", committee_id: "${c1}", ballot_kind: "CONSENSUS_BODY", opens_at: "2026-09-15T00:00:00Z", closes_at: "2026-10-15T00:00:00Z", predecessor_ballot_id: "${b1}" }
              as: CommitteeChair
              as_user_id: "${p1}"
              captures: { b2: $.data.id }
            - call: "POST /sdo/ballots/${b2}/votes"
              payload: { membership_id: "${m1}", position: "AFFIRMATIVE" }
              as: CommitteeChair
              as_user_id: "${p1}"
              captures: { v4: $.data.id }
            - call: "POST /sdo/ballots/${b2}/votes"
              payload: { membership_id: "${m2}", position: "AFFIRMATIVE" }
              as: CommitteeMember
              as_user_id: "${p2}"
              captures: { v5: $.data.id }
            - call: "POST /sdo/ballots/${b2}/votes"
              payload: { membership_id: "${m3}", position: "NEGATIVE", comment_text: "Clause 31 conflicts with clause 12", clause_reference: "31" }
              as: CommitteeMember
              as_user_id: "${p3}"
              captures: { v6: $.data.id }
          trigger:
            - call: "POST /sdo/ballots/${b2}/close"
              payload: {}
              as: CommitteeChair
              as_user_id: "${p1}"
            - call: "GET /sdo/drafts/${d1}"
              payload: {}
              as: StandardsStaff
            - call: "GET /sdo/work-items/${w1}"
              payload: {}
              as: StandardsStaff
          assert:
            - "Ballot.${b2}.effective_ballot_kind == CONSENSUS_BODY"
            - "Ballot.${b2}.eligible_voter_count == 3"
            - "Ballot.${b2}.returned_count == 3"
            - "Ballot.${b2}.not_returned_count == 0"
            - "Ballot.${b2}.return_rate_pct == 100.0"
            - "Ballot.${b2}.required_return_rate_pct == 66.7"
            - "Ballot.${b2}.affirmative_count == 2"
            - "Ballot.${b2}.negative_count == 1"
            - "Ballot.${b2}.abstain_count == 0"
            - "Ballot.${b2}.provisional_approval_pct == 66.7"
            - "Ballot.${b2}.required_approval_pct == 66.7"
            - "Ballot.${b2}.consensus_result == APPROVED_PENDING_NEGATIVES"
            - "Ballot.${b2}.pending_negative_count == 1"
            - "Ballot.${b2}.final_approval_pct == null"
            - "Draft.${d1}.status == COMMENT_RESOLUTION"
            - "WorkItem.${w1}.consensus_gate == BLOCKED"
            - "WorkItem.${w1}.unresolved_negative_count == 1"
            - "WorkItem.${w1}.progress_status == IN_DEVELOPMENT"

      - name: recirculation_kind_resolved_before_eligible_voter_set_is_frozen
        grounds:
          - calculations.substantive_change_recirculation
          - entities.Ballot.fields.effective_ballot_kind
          - entities.Draft.fields.substantive_change_ratio
          - state_machines.Draft.DRAFTING_to_ABANDONED
          - validations[priority=105]
        distinguishing_aspect: |
          Mode (c): substantive_change_recirculation pins the order ratio -> effective_ballot_kind ->
          eligible voter set, so a revision with 4 of 40 clauses changed is forced to RECIRCULATION
          first and only then narrows the eligible set to the 2 seats that returned on the
          predecessor ballot (eligible_voter_count 2, required_approval_pct 75.0); freezing the
          eligible set before resolving the kind would have polled all 3 active seats at 50.1.
        test_recipe:
          setup:
            - "Balanced committee TC-14 with 3 voting seats in 3 distinct interest categories, chaired by the PRODUCER."
            - "Work item STD-1400 in development with a revision-1 draft of 40 clauses."
            - "A SUBCOMMITTEE ballot over 2026-08-01 .. 2026-08-15 on which only 2 of 3 seats returned (1 AFFIRMATIVE, 1 NEGATIVE), so it evaluated to FAILED_THRESHOLD at 50.0 against the 50.1 bar; the negative was then ruled NON_PERSUASIVE, returning the draft to DRAFTING."
            - "The third seat's missed_ballot_streak is 1, below MISSED_BALLOT_SUSPENSION_STREAK of 2, so the committee is still BALANCED."
            - "A revision-2 draft supersedes revision 1 with 4 of 40 clauses changed."
            - "Logical clock advanced to 2026-08-15T00:00:00Z."
          setup_api_calls:
            - call: "POST /sdo/participants"
              payload: { full_name: "Ada Producer", organization: "Acme Steel", interest_category: "PRODUCER", employer_affiliation_code: "ACME" }
              as: StandardsStaff
              captures: { p1: $.data.id }
            - call: "POST /sdo/participants"
              payload: { full_name: "Ben User", organization: "City Water", interest_category: "USER", employer_affiliation_code: "CITYW" }
              as: StandardsStaff
              captures: { p2: $.data.id }
            - call: "POST /sdo/participants"
              payload: { full_name: "Cleo General", organization: "Safety League", interest_category: "GENERAL_INTEREST", employer_affiliation_code: "SAFEL" }
              as: StandardsStaff
              captures: { p3: $.data.id }
            - call: "POST /sdo/committees"
              payload: { designation: "TC-14", scope_text: "Structural fasteners", chair_participant_id: "${p1}", max_concurrent_ballots: 2 }
              as: StandardsStaff
              captures: { c1: $.data.id }
            - call: "POST /sdo/committees/${c1}/memberships"
              payload: { participant_id: "${p1}", voting_rights: true }
              as: StandardsStaff
              captures: { m1: $.data.id }
            - call: "POST /sdo/committees/${c1}/memberships"
              payload: { participant_id: "${p2}", voting_rights: true }
              as: StandardsStaff
              captures: { m2: $.data.id }
            - call: "POST /sdo/committees/${c1}/memberships"
              payload: { participant_id: "${p3}", voting_rights: true }
              as: StandardsStaff
              captures: { m3: $.data.id }
            - call: "POST /sdo/committees/${c1}/activate"
              payload: {}
              as: StandardsStaff
            - call: "POST /sdo/work-items"
              payload: { title: "Fastener torque spec", scope_text: "Torque limits for structural fasteners", work_item_type: "NEW_STANDARD", proposer_participant_id: "${p1}", target_completion_date: "2027-06-30" }
              as: Proposer
              as_user_id: "${p1}"
              captures: { w1: $.data.id }
