      - name: duplicate_repair_order_on_a_live_claim_violation_to_error
        claim_type: violation_to_error
        grounds:
          - validations[priority 60].ERR_DUPLICATE_REPAIR_ORDER
          - state_machines.WarrantyClaim.status.transitions.SUBMITTED_to_VOID
        distinguishing_aspect: |
          The uniqueness scope is (dealer_id, repair_order_number) over LIVE claims only, and it is not scoped
          to the vehicle: RO-1001 on a second vehicle still collides, and the same number becomes reusable the
          moment the original claim leaves the live set for VOID.
        test_recipe:
          setup:
            - "WORLD-BRAKE: dealer D1 holds SUBMITTED claim CL1 with repair_order_number RO-1001 on VEH1."
            - "A second vehicle VEH2 exists so the collision cannot be blamed on the vehicle-overlap rule."
            - "The retried repair_date 2026-01-10 is 90 days from CL1's 2026-04-10, well outside OVERLAP_BUFFER_DAYS."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-05-01T00:00:00Z" }
              as: WarrantyAdmin
              as_user_id: "wa-user-1"
            - call: "POST /warranty/state-law-profiles"
