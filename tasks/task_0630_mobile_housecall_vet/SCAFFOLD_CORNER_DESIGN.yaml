          - errors[ERR_STALE_ROUTE_DAY_VERSION]
        distinguishing_aspect: "After one successful stop create bumps RouteDay.version 1->2, a second create still carrying expected_route_day_version=1 -> 412 ERR_STALE_ROUTE_DAY_VERSION."
        test_recipe:
