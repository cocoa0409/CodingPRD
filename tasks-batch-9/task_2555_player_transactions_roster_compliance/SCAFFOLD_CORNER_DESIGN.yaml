            - call: "POST /trades"
              payload: { initiating_team_id: "${mw_a_id}", counterparty_team_id: "${mw_b_id}", conditional_clause_type: "PHYSICAL_CONTINGENT", condition_note: "Trade is contingent on the acquiring club's physical." }
              as: TeamCapAnalyst
