# =============================================================================
# §1.8 Scaffold Difficulty Design — Shed & Accessory Structure Sales
# 9 rules x 2 instances = 18 instances. All asserts use literals computed by
# executing the §1.3 formulas against the pinned setup inputs.
#
# Reference fixture math (Marion County J1 + GardenPro M1):
#   Order A: 10x12 (=120 sqft), options [WINDOW], PRE_BUILT, GRAVEL_PAD, AUGER_STRAP
#     structure = 300000 + 40*1500 + 16*2000 = 392000
#     options 15000; delivery 25000; gravel 120*800 = 96000
#     anchor (4 + 2*floor(120/100)) * 7500 = 6 * 7500 = 45000
#     subtotal = 573000; tax = (392000+15000)*0.07 = 28490
#     CASH total = 601490;  RTO total = round(573000*1.6)+28490 = 916800+28490 = 945290
#     RTO 24mo: monthly = round(945290/24) = 39387; final = 945290 - 39387*23 = 39389
#     late fee = round(39387*0.10) = 3939; deposit = round(601490*0.20) = 120298
#     permit fee = 15000 + 120*50 = 21000 (area 120 >= threshold 120, inclusive)
#   Order B: 16x24 (=384 sqft), no options, ON_SITE_BUILD, PIERS, AUGER_STRAP
#     structure = 300000 + 40*1500 + 280*2000 = 920000
#     delivery 45000; piers ceil(16/4)*ceil(24/4)=24 -> 288000
#     anchor (4+2*3)*7500 = 75000; subtotal = 1328000; tax = 64400; total = 1392400
#   Order S: 8x8 (=64 sqft < threshold), no options, PRE_BUILT, GRAVEL_PAD, AUGER_STRAP
#     structure 300000; delivery 25000; gravel 64*800=51200; anchor 4*7500=30000
#     subtotal = 406200; tax = 21000; total = 427200; deposit = 85440
# =============================================================================

scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: order_total_cash_vs_rto_divergence
        grounds:
          - calculations.order_total_price
          - entities.Order.fields.quoted_total_cents
        distinguishing_aspect: |
          Dual variant on the ORDER-PRICING domain: identical configuration
          priced as CASH (subtotal + tax = 601490) vs RTO (1.6x contract
          multiplier + tax = 945290); the pair for rule 1 is completed by
          site_access_verdict_prebuilt_vs_onsite on the SITE-ASSESSMENT domain.
        test_recipe:
          setup:
            - "Jurisdiction (threshold 120, tax 700bp), model GardenPro, and one customer exist"
            - "Two orders with IDENTICAL config (10x12, [WINDOW], PRE_BUILT, GRAVEL_PAD, AUGER_STRAP), one CASH and one RTO 24mo"
          setup_api_calls:
            - call: "POST /api/jurisdictions"
              payload: { name: "Marion County, IN", state_code: "IN", county_name: "Marion", permit_threshold_sqft: 120, setback_front_ft: 10, setback_side_ft: 5, setback_rear_ft: 5, max_building_height_ft: 12, anchoring_required: true, permit_base_fee_cents: 15000, permit_per_sqft_cents: 50, tax_rate_bp: 700 }
              as: PermitCoordinator
              captures: { jur_id: $.data.id }
            - call: "POST /api/models"
              payload: { name: "GardenPro", sku: "GP-01", min_width_ft: 8, max_width_ft: 16, min_depth_ft: 8, max_depth_ft: 24, wall_height_ft: 8, supported_delivery_modes: ["PRE_BUILT", "ON_SITE_BUILD"], base_price_cents: 300000, overage_rate_tier1_cents: 1500, overage_rate_tier2_cents: 2000 }
              as: SalesRep
              captures: { model_id: $.data.id }
            - call: "POST /api/customers"
              payload: { full_name: "Dana Reyes", email: "dana@example.com", phone: "317-555-0100", street: "1200 Fern Ave", city: "Indianapolis", state_code: "IN", zip: "46201" }
              as: SalesRep
              captures: { cust_id: $.data.id }
            - call: "POST /api/orders"
              payload: { customer_id: "${cust_id}", model_id: "${model_id}", jurisdiction_id: "${jur_id}", width_ft: 10, depth_ft: 12, delivery_mode: "PRE_BUILT", foundation_type: "GRAVEL_PAD", anchor_type: "AUGER_STRAP", purchase_type: "CASH", options: ["WINDOW"] }
              as: SalesRep
              captures: { order_cash_id: $.data.id }
            - call: "POST /api/orders"
              payload: { customer_id: "${cust_id}", model_id: "${model_id}", jurisdiction_id: "${jur_id}", width_ft: 10, depth_ft: 12, delivery_mode: "PRE_BUILT", foundation_type: "GRAVEL_PAD", anchor_type: "AUGER_STRAP", purchase_type: "RTO", rto_term_months: 24, options: ["WINDOW"] }
              as: SalesRep
              captures: { order_rto_id: $.data.id }
          trigger:
            - call: "GET /api/orders/${order_cash_id}"
              as: SalesRep
            - call: "GET /api/orders/${order_rto_id}"
              as: SalesRep
          assert:
            - "Order.${order_cash_id}.quoted_total_cents == 601490"
            - "Order.${order_rto_id}.quoted_total_cents == 945290"
            - "945290 - 601490 == 343800 (identical inputs, variant-driven divergence)"
            - "Order.${order_cash_id}.area_sqft == 120 and Order.${order_rto_id}.area_sqft == 120"

      - name: site_access_verdict_prebuilt_vs_onsite
        grounds:
          - calculations.site_suitability_verdict
          - state_machines.SiteAssessment.REQUESTED_to_REPORTED
        distinguishing_aspect: |
          Dual variant on the SITE-ASSESSMENT domain: the SAME measurements
          (access 120in, width 10ft) yield UNSUITABLE for a PRE_BUILT order
          (needs 120+12=132in) but SUITABLE for an ON_SITE_BUILD order
          (needs 36in); entity domain differs from order_total_cash_vs_rto_divergence.
        test_recipe:
          setup:
            - "Jurisdiction/model/customer exist; two DRAFT orders, one PRE_BUILT and one ON_SITE_BUILD, both 10x12"
          setup_api_calls:
            - call: "POST /api/jurisdictions"
              payload: { name: "Marion County, IN", state_code: "IN", county_name: "Marion", permit_threshold_sqft: 120, setback_front_ft: 10, setback_side_ft: 5, setback_rear_ft: 5, max_building_height_ft: 12, anchoring_required: true, permit_base_fee_cents: 15000, permit_per_sqft_cents: 50, tax_rate_bp: 700 }
              as: PermitCoordinator
              captures: { jur_id: $.data.id }
            - call: "POST /api/models"
              payload: { name: "GardenPro", sku: "GP-01", min_width_ft: 8, max_width_ft: 16, min_depth_ft: 8, max_depth_ft: 24, wall_height_ft: 8, supported_delivery_modes: ["PRE_BUILT", "ON_SITE_BUILD"], base_price_cents: 300000, overage_rate_tier1_cents: 1500, overage_rate_tier2_cents: 2000 }
              as: SalesRep
              captures: { model_id: $.data.id }
            - call: "POST /api/customers"
              payload: { full_name: "Dana Reyes", email: "dana@example.com", phone: "317-555-0100", street: "1200 Fern Ave", city: "Indianapolis", state_code: "IN", zip: "46201" }
              as: SalesRep
              captures: { cust_id: $.data.id }
            - call: "POST /api/orders"
              payload: { customer_id: "${cust_id}", model_id: "${model_id}", jurisdiction_id: "${jur_id}", width_ft: 10, depth_ft: 12, delivery_mode: "PRE_BUILT", foundation_type: "GRAVEL_PAD", anchor_type: "AUGER_STRAP", purchase_type: "CASH", options: [] }
              as: SalesRep
              captures: { order_pb_id: $.data.id }
            - call: "POST /api/orders"
              payload: { customer_id: "${cust_id}", model_id: "${model_id}", jurisdiction_id: "${jur_id}", width_ft: 10, depth_ft: 12, delivery_mode: "ON_SITE_BUILD", foundation_type: "GRAVEL_PAD", anchor_type: "AUGER_STRAP", purchase_type: "CASH", options: [] }
              as: SalesRep
              captures: { order_osb_id: $.data.id }
            - call: "POST /api/orders/${order_pb_id}/submit-site-check"
              payload: { assessor_id: "asr-1", scheduled_date: "2026-08-02", window_start_hour: 10 }
              as: SalesRep
              captures: { asm_pb_id: $.data.id }
            - call: "POST /api/orders/${order_osb_id}/submit-site-check"
              payload: { assessor_id: "asr-1", scheduled_date: "2026-08-02", window_start_hour: 14 }
              as: SalesRep
              captures: { asm_osb_id: $.data.id }
          trigger:
            - call: "POST /api/site-assessments/${asm_pb_id}/report"
              payload: { measured_access_width_in: 120, measured_slope_pct: 4, setback_front_ft: 12, setback_side_ft: 6, setback_rear_ft: 8, ground_prep_needed: false }
              as: InstallCrew
            - call: "POST /api/site-assessments/${asm_osb_id}/report"
              payload: { measured_access_width_in: 120, measured_slope_pct: 4, setback_front_ft: 12, setback_side_ft: 6, setback_rear_ft: 8, ground_prep_needed: false }
              as: InstallCrew
          assert:
            - "SiteAssessment.${asm_pb_id}.verdict == UNSUITABLE (120 < 10*12+12 = 132)"
            - "SiteAssessment.${asm_osb_id}.verdict == SUITABLE (120 >= 36)"
            - "Order.${order_pb_id}.status == DRAFT (reverted for reconfiguration)"
            - "Order.${order_osb_id}.status == PERMIT_REVIEW (advanced; area 120 >= threshold 120)"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: order_pricing_tiered_and_conditional_branches
        grounds:
          - calculations.order_total_price
          - entities.Order.fields.quoted_total_cents
        distinguishing_aspect: |
          Mode (a): >=3 inputs with non-linear interaction — two-tier marginal
          overage (40 sqft breakpoint), conditional delivery branch (PRE_BUILT
          vs ON_SITE_BUILD) and conditional foundation branch (PIERS count via
          ceil product); pinned totals 601490 and 1392400 exercise tier2 and
          the OSB/PIERS branches.
        test_recipe:
          setup:
            - "Jurisdiction/model/customer exist; no orders yet"
          setup_api_calls:
            - call: "POST /api/jurisdictions"
              payload: { name: "Marion County, IN", state_code: "IN", county_name: "Marion", permit_threshold_sqft: 120, setback_front_ft: 10, setback_side_ft: 5, setback_rear_ft: 5, max_building_height_ft: 12, anchoring_required: true, permit_base_fee_cents: 15000, permit_per_sqft_cents: 50, tax_rate_bp: 700 }
              as: PermitCoordinator
              captures: { jur_id: $.data.id }
            - call: "POST /api/models"
              payload: { name: "GardenPro", sku: "GP-01", min_width_ft: 8, max_width_ft: 16, min_depth_ft: 8, max_depth_ft: 24, wall_height_ft: 8, supported_delivery_modes: ["PRE_BUILT", "ON_SITE_BUILD"], base_price_cents: 300000, overage_rate_tier1_cents: 1500, overage_rate_tier2_cents: 2000 }
              as: SalesRep
              captures: { model_id: $.data.id }
            - call: "POST /api/customers"
              payload: { full_name: "Dana Reyes", email: "dana@example.com", phone: "317-555-0100", street: "1200 Fern Ave", city: "Indianapolis", state_code: "IN", zip: "46201" }
              as: SalesRep
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /api/orders"
              payload: { customer_id: "${cust_id}", model_id: "${model_id}", jurisdiction_id: "${jur_id}", width_ft: 10, depth_ft: 12, delivery_mode: "PRE_BUILT", foundation_type: "GRAVEL_PAD", anchor_type: "AUGER_STRAP", purchase_type: "CASH", options: ["WINDOW"] }
              as: SalesRep
              captures: { order_a_id: $.data.id }
            - call: "POST /api/orders"
              payload: { customer_id: "${cust_id}", model_id: "${model_id}", jurisdiction_id: "${jur_id}", width_ft: 16, depth_ft: 24, delivery_mode: "ON_SITE_BUILD", foundation_type: "PIERS", anchor_type: "AUGER_STRAP", purchase_type: "CASH", options: [] }
              as: SalesRep
              captures: { order_b_id: $.data.id }
          assert:
            - "Order.${order_a_id}.structure_price_cents == 392000 (tier1 40*1500 + tier2 16*2000 over base 300000)"
            - "Order.${order_a_id}.quoted_total_cents == 601490"
            - "Order.${order_b_id}.structure_price_cents == 920000 (tier2 branch: 280 sqft * 2000)"
            - "Order.${order_b_id}.quoted_total_cents == 1392400 (PIERS 24*12000 + OSB delivery 45000 + anchor 10*7500)"
            - "Order.${order_b_id}.area_sqft == 384"

      - name: rto_schedule_round_then_remainder
        grounds:
          - calculations.rto_payment_schedule
          - entities.RtoContract.fields.monthly_payment_cents
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters — the monthly
          installment is round_half_up FIRST (945290/24 -> 39387) and the final
          installment absorbs the remainder (39389); rounding the total after
          multiplying would produce a different cents result. Distinct mode
          from order_pricing_tiered_and_conditional_branches (mode a).
        test_recipe:
          setup:
            - "An RTO order (10x12, [WINDOW], PRE_BUILT, GRAVEL_PAD, AUGER_STRAP, 24mo) fully installed: COMPLETED with an ACTIVE contract"
          setup_api_calls:
            - call: "POST /api/jurisdictions"
              payload: { name: "Marion County, IN", state_code: "IN", county_name: "Marion", permit_threshold_sqft: 120, setback_front_ft: 10, setback_side_ft: 5, setback_rear_ft: 5, max_building_height_ft: 12, anchoring_required: true, permit_base_fee_cents: 15000, permit_per_sqft_cents: 50, tax_rate_bp: 700 }
              as: PermitCoordinator
              captures: { jur_id: $.data.id }
            - call: "POST /api/models"
              payload: { name: "GardenPro", sku: "GP-01", min_width_ft: 8, max_width_ft: 16, min_depth_ft: 8, max_depth_ft: 24, wall_height_ft: 8, supported_delivery_modes: ["PRE_BUILT", "ON_SITE_BUILD"], base_price_cents: 300000, overage_rate_tier1_cents: 1500, overage_rate_tier2_cents: 2000 }
              as: SalesRep
              captures: { model_id: $.data.id }
            - call: "POST /api/customers"
              payload: { full_name: "Dana Reyes", email: "dana@example.com", phone: "317-555-0100", street: "1200 Fern Ave", city: "Indianapolis", state_code: "IN", zip: "46201" }
              as: SalesRep
              captures: { cust_id: $.data.id }
            - call: "POST /api/orders"
              payload: { customer_id: "${cust_id}", model_id: "${model_id}", jurisdiction_id: "${jur_id}", width_ft: 10, depth_ft: 12, delivery_mode: "PRE_BUILT", foundation_type: "GRAVEL_PAD", anchor_type: "AUGER_STRAP", purchase_type: "RTO", rto_term_months: 24, options: ["WINDOW"] }
              as: SalesRep
              captures: { order_id: $.data.id }
            - call: "POST /api/orders/${order_id}/submit-site-check"
              payload: { assessor_id: "asr-1", scheduled_date: "2026-08-02", window_start_hour: 10 }
              as: SalesRep
              captures: { asm_id: $.data.id }
            - call: "POST /api/site-assessments/${asm_id}/report"
              payload: { measured_access_width_in: 140, measured_slope_pct: 4, setback_front_ft: 12, setback_side_ft: 6, setback_rear_ft: 8, ground_prep_needed: false }
              as: InstallCrew
            - call: "GET /api/orders/${order_id}/permit-applications"
              as: PermitCoordinator
              captures: { app_id: "$.data[0].id" }
            - call: "POST /api/permit-applications/${app_id}/approve"
              payload: {}
              as: PermitCoordinator
            - call: "POST /api/orders/${order_id}/schedule"
              payload: { scheduled_date: "2026-08-01", crew_id: "crew-1" }
              as: SalesRep
            - call: "POST /api/orders/${order_id}/start"
              payload: {}
              as: InstallCrew
            - call: "POST /api/orders/${order_id}/complete"
              payload: {}
              as: InstallCrew
          trigger:
            - call: "GET /api/orders/${order_id}/rto-contract"
              as: FinanceManager
              captures: { contract_id: "$.data[0].id" }
            - call: "GET /api/rto-contracts/${contract_id}"
              as: FinanceManager
          assert:
            - "RtoContract.${contract_id}.total_contract_cents == 945290"
            - "RtoContract.${contract_id}.monthly_payment_cents == 39387"
            - "RtoContract.${contract_id}.final_payment_cents == 39389"
            - "39387 * 23 + 39389 == 945290 (schedule sums exactly to the contract total)"
            - "RtoContract.${contract_id}.status == ACTIVE and Order.${order_id}.status == CLOSED"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: order_permit_denial_revert_cycle
        grounds:
          - state_machines.Order.PERMIT_REVIEW_to_DRAFT
          - state_machines.Order.DRAFT_to_SITE_REVIEW
        distinguishing_aspect: |
          Order machine is non-linear (branch + revert cycle): PERMIT_REVIEW
          reverts to DRAFT on denial, and the order loops DRAFT -> SITE_REVIEW
          -> PERMIT_REVIEW a SECOND time with a fresh SiteAssessment and a
          fresh PermitApplication; entity differs from rto_contract_delinquency_cure_cycle.
        test_recipe:
          setup:
            - "A 10x12 CASH order reached PERMIT_REVIEW (permit SUBMITTED, fee 21000), then the permit was DENIED"
          setup_api_calls:
            - call: "POST /api/jurisdictions"
              payload: { name: "Marion County, IN", state_code: "IN", county_name: "Marion", permit_threshold_sqft: 120, setback_front_ft: 10, setback_side_ft: 5, setback_rear_ft: 5, max_building_height_ft: 12, anchoring_required: true, permit_base_fee_cents: 15000, permit_per_sqft_cents: 50, tax_rate_bp: 700 }
              as: PermitCoordinator
              captures: { jur_id: $.data.id }
            - call: "POST /api/models"
              payload: { name: "GardenPro", sku: "GP-01", min_width_ft: 8, max_width_ft: 16, min_depth_ft: 8, max_depth_ft: 24, wall_height_ft: 8, supported_delivery_modes: ["PRE_BUILT", "ON_SITE_BUILD"], base_price_cents: 300000, overage_rate_tier1_cents: 1500, overage_rate_tier2_cents: 2000 }
              as: SalesRep
              captures: { model_id: $.data.id }
            - call: "POST /api/customers"
              payload: { full_name: "Dana Reyes", email: "dana@example.com", phone: "317-555-0100", street: "1200 Fern Ave", city: "Indianapolis", state_code: "IN", zip: "46201" }
              as: SalesRep
              captures: { cust_id: $.data.id }
            - call: "POST /api/orders"
              payload: { customer_id: "${cust_id}", model_id: "${model_id}", jurisdiction_id: "${jur_id}", width_ft: 10, depth_ft: 12, delivery_mode: "PRE_BUILT", foundation_type: "GRAVEL_PAD", anchor_type: "AUGER_STRAP", purchase_type: "CASH", options: [] }
              as: SalesRep
              captures: { order_id: $.data.id }
            - call: "POST /api/orders/${order_id}/submit-site-check"
              payload: { assessor_id: "asr-1", scheduled_date: "2026-08-02", window_start_hour: 10 }
              as: SalesRep
              captures: { asm_1_id: $.data.id }
            - call: "POST /api/site-assessments/${asm_1_id}/report"
              payload: { measured_access_width_in: 140, measured_slope_pct: 4, setback_front_ft: 12, setback_side_ft: 6, setback_rear_ft: 8, ground_prep_needed: false }
              as: InstallCrew
            - call: "GET /api/orders/${order_id}/permit-applications"
              as: PermitCoordinator
              captures: { app_1_id: "$.data[0].id" }
            - call: "POST /api/permit-applications/${app_1_id}/deny"
              payload: { decision_note: "setback documentation insufficient" }
              as: PermitCoordinator
          trigger:
            - call: "GET /api/orders/${order_id}"
              as: SalesRep
              captures: { order_v: $.data.version }
            - call: "PUT /api/orders/${order_id}"
              payload: { expected_order_version: "${order_v}", width_ft: 8, depth_ft: 8 }
              as: SalesRep
            - call: "POST /api/orders/${order_id}/submit-site-check"
              payload: { assessor_id: "asr-1", scheduled_date: "2026-08-03", window_start_hour: 10 }
              as: SalesRep
              captures: { asm_2_id: $.data.id }
            - call: "POST /api/site-assessments/${asm_2_id}/report"
              payload: { measured_access_width_in: 140, measured_slope_pct: 4, setback_front_ft: 12, setback_side_ft: 6, setback_rear_ft: 8, ground_prep_needed: false }
              as: InstallCrew
          assert:
            - "Order.${order_id}.status == READY_TO_SCHEDULE after the second loop (8x8 = 64 < 120, permit NOT_REQUIRED)"
            - "GET /api/orders/${order_id}/site-assessments returns exactly 2 rows (one per cycle)"
            - "Second PermitApplication.status == NOT_REQUIRED and fee_cents == 0"
            - "First PermitApplication.${app_1_id}.status == DENIED (terminal, unchanged)"

      - name: rto_contract_delinquency_cure_cycle
        grounds:
          - state_machines.RtoContract.ACTIVE_to_DELINQUENT
          - state_machines.RtoContract.DELINQUENT_to_ACTIVE
        distinguishing_aspect: |
          RtoContract machine is cyclic: ACTIVE -> DELINQUENT (billing run past
          grace) -> ACTIVE (cure payment covering past-due installment + late
          fee); the cycle can repeat; entity differs from
          order_permit_denial_revert_cycle.
        test_recipe:
          setup:
            - "An RTO order (10x12, [WINDOW], 24mo) is COMPLETED with ACTIVE contract (total 945290, monthly 39387); logical clock then advanced past first due date + grace (2026-09-08) and billing run executed"
          setup_api_calls:
            - call: "POST /api/jurisdictions"
              payload: { name: "Marion County, IN", state_code: "IN", county_name: "Marion", permit_threshold_sqft: 120, setback_front_ft: 10, setback_side_ft: 5, setback_rear_ft: 5, max_building_height_ft: 12, anchoring_required: true, permit_base_fee_cents: 15000, permit_per_sqft_cents: 50, tax_rate_bp: 700 }
              as: PermitCoordinator
              captures: { jur_id: $.data.id }
            - call: "POST /api/models"
              payload: { name: "GardenPro", sku: "GP-01", min_width_ft: 8, max_width_ft: 16, min_depth_ft: 8, max_depth_ft: 24, wall_height_ft: 8, supported_delivery_modes: ["PRE_BUILT", "ON_SITE_BUILD"], base_price_cents: 300000, overage_rate_tier1_cents: 1500, overage_rate_tier2_cents: 2000 }
              as: SalesRep
              captures: { model_id: $.data.id }
            - call: "POST /api/customers"
              payload: { full_name: "Dana Reyes", email: "dana@example.com", phone: "317-555-0100", street: "1200 Fern Ave", city: "Indianapolis", state_code: "IN", zip: "46201" }
              as: SalesRep
              captures: { cust_id: $.data.id }
            - call: "POST /api/orders"
              payload: { customer_id: "${cust_id}", model_id: "${model_id}", jurisdiction_id: "${jur_id}", width_ft: 10, depth_ft: 12, delivery_mode: "PRE_BUILT", foundation_type: "GRAVEL_PAD", anchor_type: "AUGER_STRAP", purchase_type: "RTO", rto_term_months: 24, options: ["WINDOW"] }
              as: SalesRep
              captures: { order_id: $.data.id }
            - call: "POST /api/orders/${order_id}/submit-site-check"
              payload: { assessor_id: "asr-1", scheduled_date: "2026-08-02", window_start_hour: 10 }
              as: SalesRep
              captures: { asm_id: $.data.id }
            - call: "POST /api/site-assessments/${asm_id}/report"
              payload: { measured_access_width_in: 140, measured_slope_pct: 4, setback_front_ft: 12, setback_side_ft: 6, setback_rear_ft: 8, ground_prep_needed: false }
              as: InstallCrew
            - call: "GET /api/orders/${order_id}/permit-applications"
              as: PermitCoordinator
              captures: { app_id: "$.data[0].id" }
            - call: "POST /api/permit-applications/${app_id}/approve"
              payload: {}
              as: PermitCoordinator
            - call: "POST /api/orders/${order_id}/schedule"
              payload: { scheduled_date: "2026-08-01", crew_id: "crew-1" }
              as: SalesRep
            - call: "POST /api/orders/${order_id}/start"
              payload: {}
              as: InstallCrew
