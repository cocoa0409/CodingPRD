            - { call: "POST /v1/accounts", payload: { participant_id: "${p1}", plan_id: "${plan_a}", initial_balances: [ { source_type: "PRE_TAX", balance_cents: 8000000, basis_cents: 0, vested_pct: 100 }, { source_type: "EMPLOYER_PRETAX", balance_cents: 2000000, basis_cents: 0, vested_pct: 60 }, { source_type: "ROTH", balance_cents: 1000000, basis_cents: 800000, vested_pct: 100 }, { source_type: "AFTER_TAX", balance_cents: 600000, basis_cents: 500000, vested_pct: 100 } ] }, as: PlanSponsorAdmin, captures: { a1: "$.data.id" } }
            - { call: "POST /v1/accounts", payload: { participant_id: "${p1}", plan_id: "${plan_b}" }, as: PlanSponsorAdmin, captures: { a1b: "$.data.id" } }
            - { call: "POST /v1/accounts/${a1}/loans", payload: { outstanding_balance_cents: 250000, interest_rate_bp: 500, term_months: 60 }, as: PlanSponsorAdmin, captures: { loan1: "$.data.id" } }
            - { call: "POST /v1/rollover-cases", payload: { case_type: "PLAN_TRANSFER", source_account_id: "${a1}", receiving_plan_id: "${plan_b}", receiving_account_id: "${a1b}" }, as: Participant, as_user_id: "${p1}", captures: { c1: "$.data.id" } }
