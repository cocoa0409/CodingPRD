          assert:
            - "invariant at issue: StorageInvoice.${inv_lg_id}.amount_due_cents == 18225 and StorageAccount.${acct_lg_id}.balance_cents == 18225"
            - "invariant after nightly run 1: amount_due_cents == 18498 (late fee 273) and balance_cents == 18498"
            - "invariant after nightly run 2: amount_due_cents == 18775 (late fee 273 + 277 == 550) and balance_cents == 18775"
            - "the payment of exactly the residual 18775 is accepted at 200 and does not trip validations[priority 35]"
            - "invariant after payment: StorageInvoice.${inv_lg_id}.amount_paid_cents == 18775, status == PAID, and StorageAccount.${acct_lg_id}.balance_cents == 0"
            - "StorageAccount.${acct_lg_id}.lifetime_paid_cents == 18775 (monotone; it is never reduced by the late-fee accruals)"
            - "compensation: StorageAccount.${acct_lg_id}.status == ACTIVE, restored from DELINQUENT by clearing the balance"
            - "compensation: CordBloodUnit.${unit_lg_id}.availability_status == PRIVATE_STORED, restored from PENDING_ABANDONMENT"
            - "no drift: StorageInvoice.${inv_lg_id}.late_fee_line_cents is still 550 after payment (paying does not rebate accrued fees)"
            - "StorageTank.${tank_n_id}.occupied_slots == 1 throughout"
            - "GET /cbb/storage-accounts/${acct_lg_id}/storage-invoices → data has length 1"
