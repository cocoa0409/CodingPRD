  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: reusing_the_pre_issuance_award_version_returns_stale_award_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[qei-issue-stale-award]
          - validations[priority=10]
          - errors[ERR_STALE_AWARD_VERSION]
        distinguishing_aspect: "An award legitimately accepts many QEIs, so the second issuance breaks no state precondition — only the version comparison catches it. The first issuance bumps AllocationAward.version, so replaying the same expected_allocation_award_version returns 412 ERR_STALE_AWARD_VERSION; re-reading the award and resending succeeds with an otherwise identical body."
        test_recipe:
          setup:
            - "One ACTIVE award of 5,000,000,000 cents, signed at 2026-09-01."
            - "Two separately closed funds, each with 65,000,000 equity + 35,000,000 leverage."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: CertifyingAgency
            - call: "POST /nmtc/cdes"
              payload: { legal_name: "Gulf Coast CDE", certification_number: "CDE-2869-133", service_area_scope: "MULTI_STATE" }
              as: CertifyingAgency
              captures: { cde_id: $.data.id }
            - call: "POST /nmtc/allocation-awards"
              payload: { cde_id: "${cde_id}", award_year: 2026, allocation_amount_cents: 5000000000, service_area_state_codes: ["MS"], min_severe_distress_share_pct: 60.00, substantially_all_method: "DIRECT_TRACING" }
