  - rule_id: compensating_invariant
    instances:

      - name: void_posted_true_up_restores_credit_ledger_exactly
        grounds:
          - state_machines.GuaranteeTrueUp.POSTED_to_VOID
          - calculations.credit_ledger_invariant
          - validations[priority=7].segregation_of_duties
          - errors[ERR_SEGREGATION_OF_DUTIES]
        distinguishing_aspect: |
          Posting a 5429-cent MONTHLY_ROLLING true-up and then voiding it must return
          all three agreement counters to exactly 0, with no drift and no residue on
          the twelve covered periods (which were never CREDIT_ISSUED and must not
          become so). The void is also under two-person control: the poster u_agent_1
          is refused with 403 before a second user succeeds.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z."
