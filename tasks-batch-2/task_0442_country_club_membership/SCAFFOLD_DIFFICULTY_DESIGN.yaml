# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Country Club Membership & Dining Minimum — Expert band
# 9 rules x >=2 instances = 18 instances. Every grounds[] resolves into SCAFFOLD.yaml §1.1–§1.7.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: fb_shortfall_no_vs_forward_carryover
        grounds:
          - calculations.fb_shortfall
          - entities.Club.fields.fb_minimum_carryover_allowed
          - entities.Statement.fields.fb_shortfall_cents
          - entities.Membership.fields.fb_credit_carried_cents
          - state_machines.Statement.OPEN_to_FINALIZED
        distinguishing_aspect: |
          Identical period-1 DINING spend of 10000 against a 20000 minimum yields fb_shortfall_cents=10000 under
          NO_CARRYOVER but 4000 under FORWARD_CARRYOVER (effective minimum 14000 after a 6000 carried credit) — the
          variant lives on the Statement/F&B-spend domain.
        test_recipe:
          setup:
            - "Carryover club (fb_minimum_carryover_allowed=true), SOCIAL category fb_minimum_cents=20000, monthly_dues_cents=15000."
            - "Member M activated in period 0; posts DINING chit 26000 in period 0 (surplus 6000 -> carried into period 1)."
            - "close-period to period 1; in period 1 M posts DINING chit 10000; close-period finalizes the period-1 statement."
          setup_api_calls:
            - call: "POST /clubs"
              payload: { name: "Carry Club", fb_minimum_carryover_allowed: true }
              as: ClubManager
              captures: { club_id: $.data.id, club_v0: $.data.version }
            - call: "POST /membership-categories"
              payload: { club_id: "${club_id}", code: "SOCIAL", initiation_fee_cents: 0, refundable_equity_cents: 0, monthly_dues_cents: 15000, fb_minimum_cents: 20000, capacity: 50, guest_fee_cents: 5000 }
              as: ClubManager
              captures: { cat_id: $.data.id }
            - call: "POST /memberships"
              payload: { club_id: "${club_id}", category_id: "${cat_id}", holder_name: "M" }
              as: ClubManager
              captures: { m_id: $.data.id }
            - call: "POST /memberships/${m_id}/activate"
              payload: {}
              as: ClubManager
            - call: "POST /chits"
              payload: { club_id: "${club_id}", membership_id: "${m_id}", amount_cents: 26000, kind: "DINING" }
              as: BillingClerk
            - call: "POST /clubs/${club_id}/open-statements"
              payload: {}
              as: ClubManager
            - call: "GET /clubs/${club_id}"
              payload: {}
              as: ClubManager
              captures: { club_v_p0: $.data.version }
            - call: "POST /clubs/${club_id}/close-period"
              payload: { expected_club_version: "${club_v_p0}" }
              as: ClubManager
            - call: "POST /chits"
              payload: { club_id: "${club_id}", membership_id: "${m_id}", amount_cents: 10000, kind: "DINING" }
              as: BillingClerk
            - call: "POST /clubs/${club_id}/open-statements"
              payload: {}
              as: ClubManager
            - call: "GET /clubs/${club_id}"
              payload: {}
              as: ClubManager
              captures: { club_v_p1: $.data.version }
          trigger:
            - call: "POST /clubs/${club_id}/close-period"
              payload: { expected_club_version: "${club_v_p1}" }
              as: ClubManager
          assert:
            - "GET /statements?membership_id=${m_id}&period_index=1 returns one Statement with fb_minimum_cents == 14000"
            - "that period-1 Statement.fb_spend_cents == 10000"
            - "that period-1 Statement.fb_shortfall_cents == 4000 (FORWARD_CARRYOVER; NO_CARRYOVER would be 10000)"

      - name: resignation_refund_net_vs_gross
        grounds:
          - calculations.resignation_refund
          - entities.Membership.fields.refund_owed_cents
          - entities.MembershipCategory.fields.refundable_equity_cents
          - entities.Club.fields.resignation_refund_pct
          - state_machines.Membership.ACTIVE_to_RESIGNED_PENDING
        distinguishing_aspect: |
          With refundable_equity_cents=40000 and resignation_refund_pct=80 the gross refund is 32000; resigning with a
          10000 outstanding charge_balance yields refund_owed_cents=22000 (NET_OF_BALANCE) whereas resigning with a 0
          balance yields 32000 (GROSS) — the variant lives on the Membership equity domain, distinct from the F&B domain.
        test_recipe:
          setup:
            - "Club resignation_refund_pct default 80. GOLF category initiation_fee_cents=50000, refundable_equity_cents=40000, allows_golf=true."
            - "Member M activated (initiation chit 50000 debits charge_balance to 50000); M pays 40000 leaving charge_balance 10000; M resigns."
          setup_api_calls:
            - call: "POST /clubs"
              payload: { name: "Refund Club" }
              as: ClubManager
              captures: { club_id: $.data.id }
            - call: "POST /membership-categories"
              payload: { club_id: "${club_id}", code: "GOLF", initiation_fee_cents: 50000, refundable_equity_cents: 40000, monthly_dues_cents: 30000, fb_minimum_cents: 0, capacity: 50, guest_fee_cents: 5000, allows_golf: true }
              as: ClubManager
              captures: { cat_id: $.data.id }
            - call: "POST /memberships"
              payload: { club_id: "${club_id}", category_id: "${cat_id}", holder_name: "M" }
              as: ClubManager
              captures: { m_id: $.data.id }
            - call: "POST /memberships/${m_id}/activate"
              payload: {}
              as: ClubManager
            - call: "POST /memberships/${m_id}/payments"
              payload: { amount_cents: 40000 }
              as: Member
              as_user_id: "${m_id}"
          trigger:
            - call: "POST /memberships/${m_id}/resign"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
              captures: { refund: $.data.refund_owed_cents }
          assert:
            - "Membership.${m_id}.account_status == RESIGNED_PENDING"
            - "Membership.${m_id}.refund_owed_cents == 22000 (NET_OF_BALANCE: gross 32000 minus 10000 outstanding)"
            - "had charge_balance been 0 at resign, refund_owed_cents would be 32000 (GROSS) — a strictly larger value"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: assessment_equal_remainder_round_order
        grounds:
          - calculations.assessment_allocation
          - entities.CapitalAssessment.fields.levied_amount_cents
          - entities.AssessmentCharge.fields.amount_cents
          - state_machines.CapitalAssessment.DRAFT_to_LEVIED
        distinguishing_aspect: |
          Mode (b) nested rounding where order matters: total_target 100001 across 3 equal members must floor each share
          to 33333 THEN distribute the 2 leftover cents one each to the two earliest-by-created_at members (33334, 33334,
          33333) — sum-then-round would mis-allocate; the pinned order makes 33334/33334/33333 the only correct split.
        test_recipe:
          setup:
            - "Club; SOCIAL category capacity 50; three memberships M1,M2,M3 created in that created_at order and all activated."
            - "DRAFT EQUAL CapitalAssessment total_target_cents=100001."
          setup_api_calls:
            - call: "POST /clubs"
              payload: { name: "Equal Club" }
              as: ClubManager
              captures: { club_id: $.data.id }
            - call: "POST /membership-categories"
              payload: { club_id: "${club_id}", code: "SOCIAL", initiation_fee_cents: 0, refundable_equity_cents: 0, monthly_dues_cents: 20000, fb_minimum_cents: 0, capacity: 50, guest_fee_cents: 5000 }
              as: ClubManager
              captures: { cat_id: $.data.id }
            - call: "POST /memberships"
              payload: { club_id: "${club_id}", category_id: "${cat_id}", holder_name: "M1" }
              as: ClubManager
              captures: { m1_id: $.data.id }
            - call: "POST /memberships/${m1_id}/activate"
              payload: {}
              as: ClubManager
            - call: "POST /memberships"
              payload: { club_id: "${club_id}", category_id: "${cat_id}", holder_name: "M2" }
              as: ClubManager
              captures: { m2_id: $.data.id }
            - call: "POST /memberships/${m2_id}/activate"
              payload: {}
              as: ClubManager
            - call: "POST /memberships"
              payload: { club_id: "${club_id}", category_id: "${cat_id}", holder_name: "M3" }
              as: ClubManager
              captures: { m3_id: $.data.id }
            - call: "POST /memberships/${m3_id}/activate"
              payload: {}
              as: ClubManager
            - call: "POST /capital-assessments"
              payload: { club_id: "${club_id}", description: "Roof", total_target_cents: 100001, allocation_basis: "EQUAL" }
              as: ClubManager
              captures: { asmt_id: $.data.id }
          trigger:
            - call: "POST /capital-assessments/${asmt_id}/levy"
              payload: {}
              as: ClubManager
          assert:
            - "CapitalAssessment.${asmt_id}.status == LEVIED"
            - "CapitalAssessment.${asmt_id}.levied_amount_cents == 100001"
            - "GET /assessment-charges?membership_id=${m1_id} returns AssessmentCharge.amount_cents == 33334"
            - "GET /assessment-charges?membership_id=${m2_id} returns AssessmentCharge.amount_cents == 33334"
            - "GET /assessment-charges?membership_id=${m3_id} returns AssessmentCharge.amount_cents == 33333"

      - name: statement_total_conditional_branch_sum
        grounds:
          - calculations.statement_total
          - calculations.fb_shortfall
          - entities.Statement.fields.total_due_cents
          - state_machines.Statement.OPEN_to_FINALIZED
        distinguishing_aspect: |
          Mode (a) >=3-input non-linear formula with a conditional branch: total_due = dues + fb_shortfall + chit_charges +
          assessment, where fb_shortfall itself is max(0, minimum - spend); for dues 15000, minimum 20000, DINING 12000,
          PRO_SHOP 5000 the result is 15000 + 8000 + 17000 + 0 == 40000, and the fb branch must be evaluated before the sum.
        test_recipe:
          setup:
            - "No-carryover club. SOCIAL category dues 15000, fb_minimum 20000. Member M activated (initiation 0)."
            - "M posts DINING 12000 (counts toward F&B) and PRO_SHOP 5000 in period 0; statement opened."
          setup_api_calls:
            - call: "POST /clubs"
              payload: { name: "Stmt Club" }
              as: ClubManager
              captures: { club_id: $.data.id, club_v0: $.data.version }
            - call: "POST /membership-categories"
              payload: { club_id: "${club_id}", code: "SOCIAL", initiation_fee_cents: 0, refundable_equity_cents: 0, monthly_dues_cents: 15000, fb_minimum_cents: 20000, capacity: 50, guest_fee_cents: 5000 }
              as: ClubManager
              captures: { cat_id: $.data.id }
            - call: "POST /memberships"
              payload: { club_id: "${club_id}", category_id: "${cat_id}", holder_name: "M" }
              as: ClubManager
              captures: { m_id: $.data.id }
            - call: "POST /memberships/${m_id}/activate"
              payload: {}
              as: ClubManager
            - call: "POST /chits"
              payload: { club_id: "${club_id}", membership_id: "${m_id}", amount_cents: 12000, kind: "DINING" }
              as: BillingClerk
            - call: "POST /chits"
              payload: { club_id: "${club_id}", membership_id: "${m_id}", amount_cents: 5000, kind: "PRO_SHOP" }
              as: BillingClerk
            - call: "POST /clubs/${club_id}/open-statements"
              payload: {}
              as: ClubManager
            - call: "GET /clubs/${club_id}"
              payload: {}
              as: ClubManager
              captures: { club_v_p0: $.data.version }
          trigger:
            - call: "POST /clubs/${club_id}/close-period"
              payload: { expected_club_version: "${club_v_p0}" }
              as: ClubManager
          assert:
            - "GET /statements?membership_id=${m_id}&period_index=0 returns one Statement with fb_shortfall_cents == 8000"
            - "that Statement.chit_charges_cents == 17000"
            - "that Statement.total_due_cents == 40000"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: membership_parallel_account_x_billing_axes
        grounds:
          - state_machines.Membership.ACTIVE_to_SUSPENDED
          - state_machines.Membership.CURRENT_to_PAST_DUE
          - entities.Membership.fields.account_status
          - entities.Membership.fields.billing_status
        distinguishing_aspect: |
          Membership carries two independent state axes: account_status and billing_status evolve separately, so a member
          can be account_status=SUSPENDED while billing_status=PAST_DUE simultaneously — a parallel-dimension non-linear
          machine on the Membership entity.
        test_recipe:
          setup:
            - "Club; SOCIAL category dues 15000, fb_minimum 0. Member M activated."
            - "Statement opened then finalized leaving an unpaid total (dues 15000) -> billing_status=PAST_DUE; then M suspended."
          setup_api_calls:
            - call: "POST /clubs"
              payload: { name: "Axis Club" }
              as: ClubManager
              captures: { club_id: $.data.id }
            - call: "POST /membership-categories"
              payload: { club_id: "${club_id}", code: "SOCIAL", initiation_fee_cents: 0, refundable_equity_cents: 0, monthly_dues_cents: 15000, fb_minimum_cents: 0, capacity: 50, guest_fee_cents: 5000 }
              as: ClubManager
              captures: { cat_id: $.data.id }
            - call: "POST /memberships"
              payload: { club_id: "${club_id}", category_id: "${cat_id}", holder_name: "M" }
              as: ClubManager
              captures: { m_id: $.data.id }
            - call: "POST /memberships/${m_id}/activate"
              payload: {}
              as: ClubManager
            - call: "POST /clubs/${club_id}/open-statements"
              payload: {}
              as: ClubManager
            - call: "GET /clubs/${club_id}"
              payload: {}
              as: ClubManager
              captures: { club_v0: $.data.version }
            - call: "POST /clubs/${club_id}/close-period"
              payload: { expected_club_version: "${club_v0}" }
              as: ClubManager
          trigger:
            - call: "POST /memberships/${m_id}/suspend"
              payload: {}
              as: ClubManager
              captures: { acct: $.data.account_status, bill: $.data.billing_status }
          assert:
            - "Membership.${m_id}.account_status == SUSPENDED"
            - "Membership.${m_id}.billing_status == PAST_DUE (the billing axis advanced independently of the account axis)"

      - name: reservation_amend_cycle_loop
        grounds:
          - state_machines.Reservation.CONFIRMED_to_AMEND_PENDING
          - state_machines.Reservation.AMEND_PENDING_to_CONFIRMED
          - entities.Reservation.fields.status
          - entities.Reservation.fields.proposed_starts_at
        distinguishing_aspect: |
          Reservation has a cyclic revision loop CONFIRMED -> AMEND_PENDING -> CONFIRMED on a different entity than the
          Membership parallel machine; confirming the amend returns to CONFIRMED with the proposed window applied and
          proposed_* cleared to null.
        test_recipe:
          setup:
            - "Club; GOLF category allows_golf=true; Member M activated; COURT resource turnaround 0."
            - "M books a CONFIRMED reservation 10:00-11:00, then proposes amend to 12:00-13:00 (no conflict)."
          setup_api_calls:
            - call: "POST /clubs"
              payload: { name: "Loop Club" }
              as: ClubManager
              captures: { club_id: $.data.id }
            - call: "POST /membership-categories"
              payload: { club_id: "${club_id}", code: "GOLF", initiation_fee_cents: 0, refundable_equity_cents: 0, monthly_dues_cents: 30000, fb_minimum_cents: 0, capacity: 50, guest_fee_cents: 5000, allows_golf: true }
              as: ClubManager
              captures: { cat_id: $.data.id }
            - call: "POST /memberships"
              payload: { club_id: "${club_id}", category_id: "${cat_id}", holder_name: "M" }
              as: ClubManager
              captures: { m_id: $.data.id }
            - call: "POST /memberships/${m_id}/activate"
              payload: {}
              as: ClubManager
            - call: "POST /resources"
              payload: { club_id: "${club_id}", kind: "COURT", label: "Court 1", turnaround_minutes: 0 }
              as: ClubManager
              captures: { res_id: $.data.id, res_v0: $.data.version }
            - call: "POST /reservations"
              payload: { club_id: "${club_id}", resource_id: "${res_id}", membership_id: "${m_id}", starts_at: "2026-02-01T10:00:00Z", ends_at: "2026-02-01T11:00:00Z", expected_resource_version: "${res_v0}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { rsv_id: $.data.id }
            - call: "POST /reservations/${rsv_id}/propose-amend"
              payload: { proposed_starts_at: "2026-02-01T12:00:00Z", proposed_ends_at: "2026-02-01T13:00:00Z" }
              as: Member
              as_user_id: "${m_id}"
          trigger:
            - call: "POST /reservations/${rsv_id}/confirm-amend"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
          assert:
            - "Reservation.${rsv_id}.status == CONFIRMED"
            - "Reservation.${rsv_id}.starts_at == 2026-02-01T12:00:00Z"
            - "Reservation.${rsv_id}.proposed_starts_at == null"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: settle_resignation_cascade_seat_to_waitlist_offer
        grounds:
          - state_machines.Membership.RESIGNED_PENDING_to_RESIGNED
          - state_machines.WaitlistEntry.WAITING_to_OFFERED
          - entities.MembershipCategory.fields.active_member_count
          - entities.WaitlistEntry.fields.status
        distinguishing_aspect: |
          Depth-3 chain from settle-resignation: settle (A) recomputes MembershipCategory.active_member_count down by one
          (B); that freed seat triggers promotion of the earliest WAITING WaitlistEntry to OFFERED (C) — each hop caused
          by the previous, not by the original action directly.
        test_recipe:
          setup:
            - "Club; GOLF category capacity 1, allows_golf true; Member M activated (fills the single seat); M resigns; charge_balance is 0."
            - "A WaitlistEntry W exists in WAITING for the same category."
          setup_api_calls:
            - call: "POST /clubs"
              payload: { name: "Cascade Club" }
              as: ClubManager
              captures: { club_id: $.data.id }
            - call: "POST /membership-categories"
              payload: { club_id: "${club_id}", code: "GOLF", initiation_fee_cents: 0, refundable_equity_cents: 0, monthly_dues_cents: 30000, fb_minimum_cents: 0, capacity: 1, guest_fee_cents: 5000, allows_golf: true }
              as: ClubManager
              captures: { cat_id: $.data.id }
            - call: "POST /memberships"
              payload: { club_id: "${club_id}", category_id: "${cat_id}", holder_name: "M" }
              as: ClubManager
              captures: { m_id: $.data.id }
            - call: "POST /memberships/${m_id}/activate"
              payload: {}
              as: ClubManager
            - call: "POST /waitlist-entries"
              payload: { club_id: "${club_id}", category_id: "${cat_id}", applicant_name: "W" }
              as: ClubManager
              captures: { w_id: $.data.id }
            - call: "POST /memberships/${m_id}/resign"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
          trigger:
            - call: "POST /memberships/${m_id}/settle-resignation"
              payload: {}
              as: ClubManager
          assert:
            - "Membership.${m_id}.account_status == RESIGNED"
            - "GET /membership-categories/${cat_id} returns active_member_count == 0"
            - "WaitlistEntry.${w_id}.status == OFFERED"

      - name: waitlist_accept_cascade_membership_chit_balance
        grounds:
          - state_machines.WaitlistEntry.OFFERED_to_ACCEPTED
          - state_machines.Membership.PENDING_to_ACTIVE
          - entities.Membership.fields.charge_balance_cents
          - entities.Chit.fields.kind
        distinguishing_aspect: |
          Depth-3 chain from a different trigger (waitlist accept): accept (A) creates+activates a Membership (B); that
          activation posts the EVENT initiation Chit (C) which debits the new Membership.charge_balance_cents (D) — a
          distinct propagation pattern from the settle-resignation cascade.
        test_recipe:
          setup:
            - "Club; GOLF category capacity 1, initiation_fee_cents=50000, allows_golf true; one WaitlistEntry W OFFERED (category seat free, count 0)."
          setup_api_calls:
            - call: "POST /clubs"
              payload: { name: "Accept Club" }
              as: ClubManager
              captures: { club_id: $.data.id }
            - call: "POST /membership-categories"
              payload: { club_id: "${club_id}", code: "GOLF", initiation_fee_cents: 50000, refundable_equity_cents: 40000, monthly_dues_cents: 30000, fb_minimum_cents: 0, capacity: 1, guest_fee_cents: 5000, allows_golf: true }
              as: ClubManager
              captures: { cat_id: $.data.id }
            - call: "POST /waitlist-entries"
              payload: { club_id: "${club_id}", category_id: "${cat_id}", applicant_name: "W" }
              as: ClubManager
              captures: { w_id: $.data.id }
            - call: "POST /waitlist-entries/${w_id}/offer"
              payload: {}
              as: ClubManager
            - call: "GET /membership-categories/${cat_id}"
              payload: {}
              as: ClubManager
              captures: { cat_v_offer: $.data.version }
          trigger:
            - call: "POST /waitlist-entries/${w_id}/accept"
              payload: { expected_category_version: "${cat_v_offer}" }
              as: ClubManager
              captures: { new_m_id: $.data.created_membership_id }
          assert:
            - "WaitlistEntry.${w_id}.status == ACCEPTED"
            - "Membership.${new_m_id}.account_status == ACTIVE"
            - "Membership.${new_m_id}.charge_balance_cents == 50000 (initiation chit debited the new member's balance)"
            - "GET /chits?membership_id=${new_m_id} returns a Chit with kind == EVENT and amount_cents == 50000"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: not_active_beats_resource_conflict
        grounds:
          - validations[priority=9]
          - validations[priority=10]
          - state_machines.Reservation.CONFIRMED_to_AMEND_PENDING
        distinguishing_aspect: |
          A SUSPENDED member booking a window that also overlaps an existing CONFIRMED reservation fails both the
          business_safety membership-active check (p9) and the business_temporal overlap check (p10); the higher-priority
          p9 ERR_MEMBERSHIP_NOT_ACTIVE must win — a state-vs-temporal category pair.
        test_recipe:
          setup:
            - "Club; GOLF category allows_golf true; Members M1 (active) and M2 (active then suspended); COURT resource turnaround 0."
            - "M1 holds a CONFIRMED reservation 10:00-11:00; M2 is suspended."
          setup_api_calls:
            - call: "POST /clubs"
              payload: { name: "Pair1 Club" }
              as: ClubManager
              captures: { club_id: $.data.id }
            - call: "POST /membership-categories"
              payload: { club_id: "${club_id}", code: "GOLF", initiation_fee_cents: 0, refundable_equity_cents: 0, monthly_dues_cents: 30000, fb_minimum_cents: 0, capacity: 50, guest_fee_cents: 5000, allows_golf: true }
              as: ClubManager
              captures: { cat_id: $.data.id }
            - call: "POST /memberships"
              payload: { club_id: "${club_id}", category_id: "${cat_id}", holder_name: "M1" }
              as: ClubManager
              captures: { m1_id: $.data.id }
            - call: "POST /memberships/${m1_id}/activate"
              payload: {}
              as: ClubManager
            - call: "POST /memberships"
              payload: { club_id: "${club_id}", category_id: "${cat_id}", holder_name: "M2" }
              as: ClubManager
              captures: { m2_id: $.data.id }
            - call: "POST /memberships/${m2_id}/activate"
              payload: {}
              as: ClubManager
            - call: "POST /resources"
              payload: { club_id: "${club_id}", kind: "COURT", label: "Court 1", turnaround_minutes: 0 }
              as: ClubManager
              captures: { res_id: $.data.id, res_v0: $.data.version }
            - call: "POST /reservations"
              payload: { club_id: "${club_id}", resource_id: "${res_id}", membership_id: "${m1_id}", starts_at: "2026-02-01T10:00:00Z", ends_at: "2026-02-01T11:00:00Z", expected_resource_version: "${res_v0}" }
              as: Member
              as_user_id: "${m1_id}"
            - call: "POST /memberships/${m2_id}/suspend"
              payload: {}
              as: ClubManager
            - call: "GET /resources/${res_id}"
              payload: {}
              as: ClubManager
              captures: { res_v1: $.data.version }
          trigger:
            - call: "POST /reservations"
              payload: { club_id: "${club_id}", resource_id: "${res_id}", membership_id: "${m2_id}", starts_at: "2026-02-01T10:30:00Z", ends_at: "2026-02-01T11:30:00Z", expected_resource_version: "${res_v1}" }
              as: Member
              as_user_id: "${m2_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_MEMBERSHIP_NOT_ACTIVE (p9 wins over p10 ERR_RESOURCE_CONFLICT)"
            - "no Reservation is created for ${m2_id}"

      - name: outstanding_balance_beats_no_eligible_independence
        grounds:
          - validations[priority=13]
          - validations[priority=6]
          - state_machines.Membership.RESIGNED_PENDING_to_RESIGNED
        distinguishing_aspect: |
          Settling a resignation for a member who is not in RESIGNED_PENDING (still ACTIVE) AND has a non-zero
          charge_balance triggers both the state precondition (p6 ERR_INVALID_STATE) and the referential balance check
          (p13 ERR_OUTSTANDING_BALANCE); the higher-priority p6 state check must win — a state-vs-business_referential pair.
        test_recipe:
          setup:
            - "Club; GOLF category initiation_fee_cents=50000 allows_golf true; Member M activated (charge_balance 50000) and still ACTIVE (NOT resigned)."
          setup_api_calls:
            - call: "POST /clubs"
              payload: { name: "Pair2 Club" }
              as: ClubManager
              captures: { club_id: $.data.id }
            - call: "POST /membership-categories"
              payload: { club_id: "${club_id}", code: "GOLF", initiation_fee_cents: 50000, refundable_equity_cents: 40000, monthly_dues_cents: 30000, fb_minimum_cents: 0, capacity: 50, guest_fee_cents: 5000, allows_golf: true }
              as: ClubManager
              captures: { cat_id: $.data.id }
            - call: "POST /memberships"
              payload: { club_id: "${club_id}", category_id: "${cat_id}", holder_name: "M" }
              as: ClubManager
              captures: { m_id: $.data.id }
            - call: "POST /memberships/${m_id}/activate"
              payload: {}
              as: ClubManager
          trigger:
            - call: "POST /memberships/${m_id}/settle-resignation"
              payload: {}
              as: ClubManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE (p6 state check wins over p13 ERR_OUTSTANDING_BALANCE)"
            - "Membership.${m_id}.account_status == ACTIVE (unchanged)"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: guest_quota_strict_less_than_boundary
        grounds:
          - calculations.guest_visit_quota
          - validations[priority=12]
          - entities.Club.fields.guest_visits_cap_per_period
          - state_machines.GuestPass.REGISTERED_to_CHECKED_IN
        distinguishing_aspect: |
          With guest_visits_cap_per_period=1 the FIRST check-in (used 0 < 1) succeeds and the SECOND (used 1, not < 1)
          is rejected with ERR_GUEST_QUOTA_EXCEEDED — a strict < cap count boundary, reached through the guest-pass
          check-in endpoint.
        test_recipe:
          setup:
            - "Club guest_visits_cap_per_period=1; SOCIAL category guest_fee_cents=5000; Member S activated (sponsor)."
            - "Two REGISTERED guest passes G1,G2 sponsored by S; G1 already CHECKED_IN (used=1)."
          setup_api_calls:
            - call: "POST /clubs"
              payload: { name: "Quota Club", guest_visits_cap_per_period: 1 }
              as: ClubManager
              captures: { club_id: $.data.id }
            - call: "POST /membership-categories"
              payload: { club_id: "${club_id}", code: "SOCIAL", initiation_fee_cents: 0, refundable_equity_cents: 0, monthly_dues_cents: 15000, fb_minimum_cents: 0, capacity: 50, guest_fee_cents: 5000 }
              as: ClubManager
              captures: { cat_id: $.data.id }
            - call: "POST /memberships"
              payload: { club_id: "${club_id}", category_id: "${cat_id}", holder_name: "S" }
              as: ClubManager
              captures: { s_id: $.data.id }
            - call: "POST /memberships/${s_id}/activate"
              payload: {}
              as: ClubManager
            - call: "POST /guest-passes"
              payload: { club_id: "${club_id}", sponsor_membership_id: "${s_id}", guest_name: "G1", visit_date: "2026-01-05T12:00:00Z" }
              as: Member
              as_user_id: "${s_id}"
              captures: { g1_id: $.data.id }
            - call: "POST /guest-passes"
              payload: { club_id: "${club_id}", sponsor_membership_id: "${s_id}", guest_name: "G2", visit_date: "2026-01-05T13:00:00Z" }
              as: Member
              as_user_id: "${s_id}"
              captures: { g2_id: $.data.id }
            - call: "POST /guest-passes/${g1_id}/check-in"
              payload: {}
              as: ClubManager
          trigger:
            - call: "POST /guest-passes/${g2_id}/check-in"
              payload: {}
              as: ClubManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_GUEST_QUOTA_EXCEEDED (used 1 is NOT < cap 1)"
            - "GuestPass.${g2_id}.status == REGISTERED (unchanged)"
            - "Membership.${s_id}.guest_visits_used_period == 1"

      - name: category_capacity_empty_slot_vs_full_boundary
        grounds:
          - validations[priority=11]
          - entities.MembershipCategory.fields.capacity
          - entities.MembershipCategory.fields.active_member_count
          - state_machines.Membership.PENDING_to_ACTIVE
        distinguishing_aspect: |
          With capacity=1, activating the first PENDING membership (count 0 < 1) succeeds and activating a second PENDING
          membership (count 1, not < 1) is rejected with ERR_CATEGORY_AT_CAPACITY — a distinct metric (membership-count
          fill vs guest-visit count) reached through the activation endpoint, not the guest endpoint.
        test_recipe:
          setup:
            - "Club; GOLF category capacity 1 allows_golf true; two PENDING memberships M1,M2; M1 already activated (count 1)."
          setup_api_calls:
            - call: "POST /clubs"
              payload: { name: "Cap Club" }
              as: ClubManager
              captures: { club_id: $.data.id }
            - call: "POST /membership-categories"
              payload: { club_id: "${club_id}", code: "GOLF", initiation_fee_cents: 0, refundable_equity_cents: 0, monthly_dues_cents: 30000, fb_minimum_cents: 0, capacity: 1, guest_fee_cents: 5000, allows_golf: true }
              as: ClubManager
              captures: { cat_id: $.data.id }
            - call: "POST /memberships"
              payload: { club_id: "${club_id}", category_id: "${cat_id}", holder_name: "M1" }
              as: ClubManager
              captures: { m1_id: $.data.id }
            - call: "POST /memberships/${m1_id}/activate"
              payload: {}
              as: ClubManager
            - call: "POST /memberships"
              payload: { club_id: "${club_id}", category_id: "${cat_id}", holder_name: "M2" }
              as: ClubManager
              captures: { m2_id: $.data.id }
          trigger:
            - call: "POST /memberships/${m2_id}/activate"
              payload: {}
              as: ClubManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_CATEGORY_AT_CAPACITY (count 1 is NOT < capacity 1)"
            - "Membership.${m2_id}.account_status == PENDING (unchanged)"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: reservation_requires_active_membership
        grounds:
          - validations[priority=9]
          - state_machines.Membership.ACTIVE_to_SUSPENDED
          - entities.Membership.fields.account_status
          - entities.Reservation.fields.status
        distinguishing_aspect: |
          A Reservation create is gated on a DIFFERENT entity's state: the booking Membership.account_status must be
          ACTIVE; a SUSPENDED membership's create is rejected with ERR_MEMBERSHIP_NOT_ACTIVE — the Reservation→Membership
          pair.
        test_recipe:
          setup:
            - "Club; GOLF category allows_golf true; Member M activated then SUSPENDED; COURT resource turnaround 0 (no other reservation)."
          setup_api_calls:
            - call: "POST /clubs"
              payload: { name: "Dep1 Club" }
              as: ClubManager
              captures: { club_id: $.data.id }
            - call: "POST /membership-categories"
              payload: { club_id: "${club_id}", code: "GOLF", initiation_fee_cents: 0, refundable_equity_cents: 0, monthly_dues_cents: 30000, fb_minimum_cents: 0, capacity: 50, guest_fee_cents: 5000, allows_golf: true }
              as: ClubManager
              captures: { cat_id: $.data.id }
            - call: "POST /memberships"
              payload: { club_id: "${club_id}", category_id: "${cat_id}", holder_name: "M" }
              as: ClubManager
              captures: { m_id: $.data.id }
            - call: "POST /memberships/${m_id}/activate"
              payload: {}
              as: ClubManager
            - call: "POST /memberships/${m_id}/suspend"
              payload: {}
              as: ClubManager
            - call: "POST /resources"
              payload: { club_id: "${club_id}", kind: "COURT", label: "Court 1", turnaround_minutes: 0 }
              as: ClubManager
              captures: { res_id: $.data.id, res_v0: $.data.version }
          trigger:
            - call: "POST /reservations"
              payload: { club_id: "${club_id}", resource_id: "${res_id}", membership_id: "${m_id}", starts_at: "2026-02-01T10:00:00Z", ends_at: "2026-02-01T11:00:00Z", expected_resource_version: "${res_v0}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_MEMBERSHIP_NOT_ACTIVE"
            - "GET /reservations?resource_id=${res_id} returns an empty list (no reservation created)"

      - name: guest_checkin_requires_active_sponsor
        grounds:
          - state_machines.GuestPass.REGISTERED_to_CHECKED_IN
          - state_machines.Membership.ACTIVE_to_SUSPENDED
          - entities.Membership.fields.account_status
          - entities.GuestPass.fields.status
        distinguishing_aspect: |
          A GuestPass check-in is gated on the sponsor Membership.account_status == ACTIVE; a guest of a SUSPENDED sponsor
          cannot be checked in (ERR_INVALID_STATE) — the GuestPass→Membership pair, distinct from Reservation→Membership.
        test_recipe:
          setup:
            - "Club; SOCIAL category; Member S activated then SUSPENDED; one REGISTERED guest pass G sponsored by S."
          setup_api_calls:
            - call: "POST /clubs"
              payload: { name: "Dep2 Club" }
              as: ClubManager
              captures: { club_id: $.data.id }
            - call: "POST /membership-categories"
              payload: { club_id: "${club_id}", code: "SOCIAL", initiation_fee_cents: 0, refundable_equity_cents: 0, monthly_dues_cents: 15000, fb_minimum_cents: 0, capacity: 50, guest_fee_cents: 5000 }
              as: ClubManager
              captures: { cat_id: $.data.id }
            - call: "POST /memberships"
              payload: { club_id: "${club_id}", category_id: "${cat_id}", holder_name: "S" }
              as: ClubManager
              captures: { s_id: $.data.id }
            - call: "POST /memberships/${s_id}/activate"
              payload: {}
              as: ClubManager
            - call: "POST /guest-passes"
              payload: { club_id: "${club_id}", sponsor_membership_id: "${s_id}", guest_name: "G", visit_date: "2026-01-05T12:00:00Z" }
              as: Member
              as_user_id: "${s_id}"
              captures: { g_id: $.data.id }
            - call: "POST /memberships/${s_id}/suspend"
              payload: {}
              as: ClubManager
          trigger:
            - call: "POST /guest-passes/${g_id}/check-in"
              payload: {}
              as: ClubManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE (sponsor not ACTIVE)"
            - "GuestPass.${g_id}.status == REGISTERED (unchanged)"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: tee_time_turnaround_buffer_overlap
        grounds:
          - validations[priority=10]
          - entities.Resource.fields.turnaround_minutes
          - entities.Reservation.fields.starts_at
          - state_machines.Reservation.CONFIRMED_to_AMEND_PENDING
        distinguishing_aspect: |
          A TEE_TIME resource with turnaround_minutes=15 rejects a booking starting 10 minutes after a prior CONFIRMED
          reservation's end even though the raw half-open intervals do not overlap — the 15-minute buffer between end and
          next start is the interval semantics, distinct from the dining seat-capacity rule.
        test_recipe:
          setup:
            - "Club; GOLF category allows_golf true; Members M1,M2 activated; TEE_TIME resource turnaround_minutes=15."
            - "M1 holds a CONFIRMED reservation 09:00-09:10."
          setup_api_calls:
            - call: "POST /clubs"
              payload: { name: "Tee Club" }
              as: ClubManager
              captures: { club_id: $.data.id }
            - call: "POST /membership-categories"
              payload: { club_id: "${club_id}", code: "GOLF", initiation_fee_cents: 0, refundable_equity_cents: 0, monthly_dues_cents: 30000, fb_minimum_cents: 0, capacity: 50, guest_fee_cents: 5000, allows_golf: true }
              as: ClubManager
              captures: { cat_id: $.data.id }
            - call: "POST /memberships"
              payload: { club_id: "${club_id}", category_id: "${cat_id}", holder_name: "M1" }
              as: ClubManager
              captures: { m1_id: $.data.id }
            - call: "POST /memberships/${m1_id}/activate"
              payload: {}
              as: ClubManager
            - call: "POST /memberships"
              payload: { club_id: "${club_id}", category_id: "${cat_id}", holder_name: "M2" }
              as: ClubManager
              captures: { m2_id: $.data.id }
            - call: "POST /memberships/${m2_id}/activate"
              payload: {}
              as: ClubManager
            - call: "POST /resources"
              payload: { club_id: "${club_id}", kind: "TEE_TIME", label: "Hole 1", turnaround_minutes: 15 }
              as: ClubManager
              captures: { res_id: $.data.id, res_v0: $.data.version }
            - call: "POST /reservations"
              payload: { club_id: "${club_id}", resource_id: "${res_id}", membership_id: "${m1_id}", starts_at: "2026-02-01T09:00:00Z", ends_at: "2026-02-01T09:10:00Z", expected_resource_version: "${res_v0}" }
              as: Member
              as_user_id: "${m1_id}"
            - call: "GET /resources/${res_id}"
              payload: {}
              as: ClubManager
              captures: { res_v1: $.data.version }
          trigger:
            - call: "POST /reservations"
              payload: { club_id: "${club_id}", resource_id: "${res_id}", membership_id: "${m2_id}", starts_at: "2026-02-01T09:20:00Z", ends_at: "2026-02-01T09:40:00Z", expected_resource_version: "${res_v1}" }
              as: Member
              as_user_id: "${m2_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_RESOURCE_CONFLICT (09:20 start is within 15-min turnaround of the 09:10 end)"
            - "a booking starting at 09:25 (>=15 min after 09:10) would instead succeed"

      - name: dining_table_seat_capacity_aggregate_overlap
        grounds:
          - validations[priority=10]
          - entities.Resource.fields.seat_capacity
          - entities.Reservation.fields.party_size
          - state_machines.Reservation.CONFIRMED_to_AMEND_PENDING
        distinguishing_aspect: |
          A DINING_TABLE with seat_capacity=4 admits two overlapping reservations of party_size 2 each (sum 4 <= 4) but
          rejects a third overlapping party_size 1 (sum 5 > 4) — aggregate-capacity interval semantics rather than the
          exclusive buffer rule on TEE_TIME.
        test_recipe:
          setup:
            - "Club; SOCIAL category; Members M1,M2,M3 activated; DINING_TABLE resource seat_capacity=4, turnaround 0."
            - "M1 (party 2) and M2 (party 2) hold CONFIRMED reservations both 19:00-20:00 (sum 4 = capacity)."
          setup_api_calls:
            - call: "POST /clubs"
              payload: { name: "Dine Club" }
              as: ClubManager
              captures: { club_id: $.data.id }
            - call: "POST /membership-categories"
              payload: { club_id: "${club_id}", code: "SOCIAL", initiation_fee_cents: 0, refundable_equity_cents: 0, monthly_dues_cents: 15000, fb_minimum_cents: 0, capacity: 50, guest_fee_cents: 5000 }
              as: ClubManager
              captures: { cat_id: $.data.id }
            - call: "POST /memberships"
              payload: { club_id: "${club_id}", category_id: "${cat_id}", holder_name: "M1" }
              as: ClubManager
              captures: { m1_id: $.data.id }
            - call: "POST /memberships/${m1_id}/activate"
              payload: {}
              as: ClubManager
            - call: "POST /memberships"
              payload: { club_id: "${club_id}", category_id: "${cat_id}", holder_name: "M2" }
              as: ClubManager
              captures: { m2_id: $.data.id }
            - call: "POST /memberships/${m2_id}/activate"
              payload: {}
              as: ClubManager
            - call: "POST /memberships"
              payload: { club_id: "${club_id}", category_id: "${cat_id}", holder_name: "M3" }
              as: ClubManager
              captures: { m3_id: $.data.id }
            - call: "POST /memberships/${m3_id}/activate"
              payload: {}
              as: ClubManager
            - call: "POST /resources"
              payload: { club_id: "${club_id}", kind: "DINING_TABLE", label: "Table 5", turnaround_minutes: 0, seat_capacity: 4 }
              as: ClubManager
              captures: { res_id: $.data.id, res_v0: $.data.version }
            - call: "POST /reservations"
              payload: { club_id: "${club_id}", resource_id: "${res_id}", membership_id: "${m1_id}", starts_at: "2026-02-01T19:00:00Z", ends_at: "2026-02-01T20:00:00Z", party_size: 2, expected_resource_version: "${res_v0}" }
              as: Member
              as_user_id: "${m1_id}"
            - call: "GET /resources/${res_id}"
              payload: {}
              as: ClubManager
              captures: { res_v1: $.data.version }
            - call: "POST /reservations"
              payload: { club_id: "${club_id}", resource_id: "${res_id}", membership_id: "${m2_id}", starts_at: "2026-02-01T19:00:00Z", ends_at: "2026-02-01T20:00:00Z", party_size: 2, expected_resource_version: "${res_v1}" }
              as: Member
              as_user_id: "${m2_id}"
            - call: "GET /resources/${res_id}"
              payload: {}
              as: ClubManager
              captures: { res_v2: $.data.version }
          trigger:
            - call: "POST /reservations"
              payload: { club_id: "${club_id}", resource_id: "${res_id}", membership_id: "${m3_id}", starts_at: "2026-02-01T19:30:00Z", ends_at: "2026-02-01T19:45:00Z", party_size: 1, expected_resource_version: "${res_v2}" }
              as: Member
              as_user_id: "${m3_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_RESOURCE_CONFLICT (overlapping seats 2+2+1 = 5 > capacity 4)"
            - "the two existing party_size=2 reservations (sum 4 == capacity) coexisted successfully"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: chit_void_conserves_charge_balance
        grounds:
          - state_machines.Chit.POSTED_to_VOIDED
          - entities.Membership.fields.charge_balance_cents
          - entities.Chit.fields.amount_cents
          - calculations.statement_total
        distinguishing_aspect: |
          Posting a chit then voiding it leaves the conserved quantity charge_balance_cents unchanged: after a 7000
          PRO_SHOP chit on a zero-balance member (balance 7000) and its void, charge_balance_cents == 0 — the forward
          debit and compensating credit net to zero on the member's charge-account balance.
        test_recipe:
          setup:
            - "Club; SOCIAL category initiation_fee_cents=0; Member M activated (charge_balance 0). A PRO_SHOP chit of 7000 is posted."
          setup_api_calls:
            - call: "POST /clubs"
              payload: { name: "Void Club" }
              as: ClubManager
              captures: { club_id: $.data.id }
            - call: "POST /membership-categories"
              payload: { club_id: "${club_id}", code: "SOCIAL", initiation_fee_cents: 0, refundable_equity_cents: 0, monthly_dues_cents: 15000, fb_minimum_cents: 0, capacity: 50, guest_fee_cents: 5000 }
              as: ClubManager
              captures: { cat_id: $.data.id }
            - call: "POST /memberships"
              payload: { club_id: "${club_id}", category_id: "${cat_id}", holder_name: "M" }
              as: ClubManager
              captures: { m_id: $.data.id }
            - call: "POST /memberships/${m_id}/activate"
              payload: {}
              as: ClubManager
            - call: "POST /chits"
              payload: { club_id: "${club_id}", membership_id: "${m_id}", amount_cents: 7000, kind: "PRO_SHOP" }
              as: BillingClerk
              captures: { chit_id: $.data.id }
          trigger:
            - call: "POST /chits/${chit_id}/void"
              payload: {}
              as: BillingClerk
          assert:
            - "Chit.${chit_id}.status == VOIDED"
            - "Membership.${m_id}.charge_balance_cents == 0 (forward debit 7000 fully reversed by compensating credit)"

      - name: dining_void_conserves_fb_spend
        grounds:
          - state_machines.Chit.POSTED_to_VOIDED
          - entities.Membership.fields.fb_spend_period_cents
          - calculations.fb_shortfall
          - entities.Chit.fields.counts_toward_fb
        distinguishing_aspect: |
          Posting a DINING chit then voiding it leaves the conserved quantity fb_spend_period_cents unchanged: after a
          9000 DINING chit (fb_spend 9000) and its void, fb_spend_period_cents == 0 — a different conserved quantity
          (period F&B spend) than charge_balance_cents.
        test_recipe:
          setup:
            - "Club; SOCIAL category fb_minimum 20000, initiation 0; Member M activated. A DINING chit of 9000 is posted in period 0."
          setup_api_calls:
            - call: "POST /clubs"
              payload: { name: "Void2 Club" }
              as: ClubManager
              captures: { club_id: $.data.id }
            - call: "POST /membership-categories"
              payload: { club_id: "${club_id}", code: "SOCIAL", initiation_fee_cents: 0, refundable_equity_cents: 0, monthly_dues_cents: 15000, fb_minimum_cents: 20000, capacity: 50, guest_fee_cents: 5000 }
              as: ClubManager
              captures: { cat_id: $.data.id }
            - call: "POST /memberships"
              payload: { club_id: "${club_id}", category_id: "${cat_id}", holder_name: "M" }
              as: ClubManager
              captures: { m_id: $.data.id }
            - call: "POST /memberships/${m_id}/activate"
              payload: {}
              as: ClubManager
            - call: "POST /chits"
              payload: { club_id: "${club_id}", membership_id: "${m_id}", amount_cents: 9000, kind: "DINING" }
              as: BillingClerk
              captures: { chit_id: $.data.id }
          trigger:
            - call: "POST /chits/${chit_id}/void"
              payload: {}
              as: BillingClerk
          assert:
            - "Chit.${chit_id}.status == VOIDED"
            - "Membership.${m_id}.fb_spend_period_cents == 0 (DINING contribution fully reversed)"
            - "Membership.${m_id}.charge_balance_cents == 0"
