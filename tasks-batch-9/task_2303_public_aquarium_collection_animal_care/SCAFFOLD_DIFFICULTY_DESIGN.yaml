        captures: {err_early: $.data.error_id}
      - call: POST /_clock/set_current_utc
        payload: {current_utc: '2026-09-05T00:00:00Z'}
        as: ComplianceDirector
      - call: POST /aquarium/transfer-requests/${tr_id}/completion
        payload: {}
        as: PermitOfficer
        captures: {tr_status3: $.data.status}
      - call: GET /aquarium/specimens/${spec_id}
        payload: {}
        as: CuratorOfCollections
      assert:
      - 'setup: Species.permit_required == true (protection_status != UNLISTED), so the acquisition forked to PENDING_PERMIT and needed a POSSESSION permit — an IMPORT permit would have failed priority 27'
      - 'setup: the acquisition''s PROVISIONAL score is 89.00 (min(100, 40 + 35 + 20) - 6) and the FINAL score is 94.00 (min(100, 40 + 35 + 20 + 5) - 6) — the min() cap binds at 100 BEFORE the CITES penalty, so the permit bonus is worth only 5.00 here'
      - 'setup: the TRANSPORT permit submission passed priority 29 only because document_codes included CITES_PERMIT on top of the TRANSPORT base set [HEALTH_CERTIFICATE, TRANSPORT_PLAN]'
