            - "logical clock at 2026-08-10T16:00:00Z"
            - "one OPEN 2026-08 AverageAgreement whose ledger already reads credit_days_earned 2, debit_days_incurred 0 and net_days 2, earned from cycle P released early on 2026-08-04T15:00:00Z"
