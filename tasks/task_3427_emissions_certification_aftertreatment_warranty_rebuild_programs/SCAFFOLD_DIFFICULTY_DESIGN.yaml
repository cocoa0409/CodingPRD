# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3427_emissions_certification_aftertreatment_warranty_rebuild_programs
#
# 9 Difficulty Rules x 2 instances (Rule 2 carries 3, one per mode). Every
# instance grounds in SCAFFOLD.yaml §1.1-§1.7 and is replayable from empty-DB
# via its structured setup_api_calls chain. Anchored chains (&c_*) define the
# canonical path: clock -> PUBLISHED standard -> family with ACTIVE calibrated
# spec -> 3 ACCEPTED test runs (FTP/RMC/SET) -> UNDER_REVIEW -> CERTIFIED ->
# IN_PRODUCTION, plus fleet / authorized center / LEVEL_2 technician /
# calibrated tool. Aliases (*c_*) replay them inside each instance; each
# instance is transcribed against an empty database, so repeated literal codes
# and serials across instances never collide.
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: claim_proration_time_based_vs_mileage_based
        grounds:
          - calculations.partial_claim_proration
          - calculations.warranty_coverage_determination
          - entities.WarrantyClaim.fields.coverage_variant
          - entities.WarrantyClaim.fields.customer_share_cents
        distinguishing_aspect: |
          Two claims with identical claimed_amount_cents (100000) and identical
          neglect_score (40) settle differently because coverage_variant selects
          the proration variant: BASE_WARRANTY prorates by elapsed days
          (12467 customer share) while EXTENDED_EMISSIONS prorates by
          accumulated miles (25000 customer share) — same inputs, different
          entity-selected algorithm, different cents. Different entity domain
          from the reman core-credit instance (WarrantyClaim vs RemanOrder).
        test_recipe:
          setup:
            - "Logical clock starts 2026-09-01T00:00:00Z and ends at 2026-12-01T00:00:00Z (91 days after in-service)."
            - "Family X15-2027 CERTIFIED and IN_PRODUCTION on standard EPA2027-HD (base warranty 2y/50000mi; useful life 435000mi/22000h/10y)."
            - "Unit UN-201 class path ENGINE_BASE: in_service 2026-09-01, accumulated_miles 15000, hours 400, one bad DEF_SERVICE record, no OIL_CHANGE, no CRITICAL snapshots -> neglect_score 40."
            - "Unit UN-202 class path AFTERTREATMENT_DPF: in_service 2026-09-01, accumulated_miles 25000, hours 600, one bad DEF_SERVICE record, no OIL_CHANGE, no CRITICAL snapshots -> neglect_score 40."
            - "Center authorized CERTIFIED with a LEVEL_2 endorsed technician."
          setup_api_calls:
            - &c_clock0
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - &c_std
              call: "POST /emissions/regulation-standards"
              payload: { code: "EPA2027-HD", nox_limit_g_per_bhp_hr: 0.35, pm_limit_g_per_bhp_hr: 0.01, useful_life_miles: 435000, useful_life_hours: 22000, useful_life_years: 10, base_warranty_years: 2, base_warranty_miles: 50000, effective_model_year_first: 2027, effective_model_year_last: 2030 }
              as: PlatformAdmin
              captures: { std_id: $.data.id }
            - &c_std_pub
              call: "POST /emissions/regulation-standards/${std_id}/publish"
              payload: {}
              as: RegulatoryOfficer
            - &c_fam
              call: "POST /emissions/engine-families"
              payload: { family_code: "X15-2027", model_year: 2027, regulation_standard_id: "${std_id}", displacement_liters: 14.9, architecture: "DOC_DPF_SCR" }
              as: CertificationEngineer
              captures: { fam_id: $.data.id, fam_v: $.data.version }
            - &c_spec
              call: "POST /emissions/engine-families/${fam_id}/aftertreatment-specs"
              payload: { scr_catalyst_part: "SCR-900", dpf_part: "DPF-450", doser_part: "DSR-12", nox_sensor_count: 2, expected_engine_family_version: "${fam_v}" }
              as: CertificationEngineer
              captures: { spec_id: $.data.id }
            - &c_cal
              call: "POST /emissions/aftertreatment-specs/${spec_id}/calibrate"
              payload: { observed_nox_ppm_avg: 250, observed_def_consumption_g_per_kwh: 7.4 }
              as: CertificationEngineer
            - &c_act
              call: "POST /emissions/aftertreatment-specs/${spec_id}/activate"
              payload: {}
              as: CertificationEngineer
            - &c_bt
              call: "POST /emissions/engine-families/${fam_id}/begin-testing"
              payload: {}
              as: CertificationEngineer
            - &c_ftp
              call: "POST /emissions/engine-families/${fam_id}/test-runs"
              payload: { test_type: "FTP", lab_code: "LAB-1", scheduled_start: "2026-10-05T00:00:00Z", scheduled_end: "2026-10-07T00:00:00Z" }
              as: CertificationEngineer
              captures: { run_ftp_id: $.data.id }
            - &c_ftp_rec
              call: "POST /emissions/test-runs/${run_ftp_id}/record-results"
              payload: { measured_nox_g_per_bhp_hr: 0.30, measured_pm_g_per_bhp_hr: 0.008, deterioration_factor: 1.1 }
              as: CertificationEngineer
            - &c_ftp_rev
              call: "POST /emissions/test-runs/${run_ftp_id}/review"
              payload: { decision: "ACCEPT" }
              as: RegulatoryOfficer
            - &c_rmc
              call: "POST /emissions/engine-families/${fam_id}/test-runs"
              payload: { test_type: "RMC", lab_code: "LAB-2", scheduled_start: "2026-10-05T00:00:00Z", scheduled_end: "2026-10-07T00:00:00Z" }
              as: CertificationEngineer
              captures: { run_rmc_id: $.data.id }
            - &c_rmc_rec
              call: "POST /emissions/test-runs/${run_rmc_id}/record-results"
              payload: { measured_nox_g_per_bhp_hr: 0.30, measured_pm_g_per_bhp_hr: 0.008, deterioration_factor: 1.1 }
              as: CertificationEngineer
            - &c_rmc_rev
              call: "POST /emissions/test-runs/${run_rmc_id}/review"
              payload: { decision: "ACCEPT" }
              as: RegulatoryOfficer
            - &c_set
              call: "POST /emissions/engine-families/${fam_id}/test-runs"
              payload: { test_type: "SET", lab_code: "LAB-3", scheduled_start: "2026-10-05T00:00:00Z", scheduled_end: "2026-10-07T00:00:00Z" }
              as: CertificationEngineer
              captures: { run_set_id: $.data.id }
            - &c_set_rec
              call: "POST /emissions/test-runs/${run_set_id}/record-results"
              payload: { measured_nox_g_per_bhp_hr: 0.30, measured_pm_g_per_bhp_hr: 0.008, deterioration_factor: 1.1 }
              as: CertificationEngineer
            - &c_set_rev
              call: "POST /emissions/test-runs/${run_set_id}/review"
              payload: { decision: "ACCEPT" }
              as: RegulatoryOfficer
            - &c_submit
              call: "POST /emissions/engine-families/${fam_id}/submit-review"
              payload: {}
              as: CertificationEngineer
              as_user_id: "ce-quinn"
            - &c_cert
              call: "POST /emissions/engine-families/${fam_id}/certify"
              payload: {}
              as: RegulatoryOfficer
              as_user_id: "ro-mara"
            - &c_eip
              call: "POST /emissions/engine-families/${fam_id}/enter-production"
              payload: {}
              as: RegulatoryOfficer
            - &c_fleet
              call: "POST /emissions/fleets"
              payload: { name: "Blue Line Logistics", fleet_code: "BLL", notification_contact: "ops@bll.example" }
              as: PlatformAdmin
              captures: { flt_id: $.data.id }
            - &c_center
              call: "POST /emissions/service-centers"
              payload: { name: "Desert Ridge Diesel", region: "SW", bay_capacity_per_day: 2 }
              as: PlatformAdmin
              captures: { ctr_id: $.data.id }
            - &c_tech2
              call: "POST /emissions/service-centers/${ctr_id}/technicians"
              payload: { full_name: "Tess Adey", badge_id: "T-01", certification_level: "LEVEL_2", emissions_endorsed: true }
              as: PlatformAdmin
              captures: { tech_id: $.data.id }
            - &c_authz
              call: "POST /emissions/service-centers/${ctr_id}/audit"
              payload: {}
              as: PlatformAdmin
            - &c_authz2
              call: "POST /emissions/service-centers/${ctr_id}/authorize"
              payload: { authorization_tier: "CERTIFIED" }
              as: PlatformAdmin
            - &c_tool
              call: "POST /emissions/service-centers/${ctr_id}/diagnostic-tools"
              payload: { tool_serial: "DT-9001", software_version: "7.3.1" }
              as: PlatformAdmin
              captures: { tool_id: $.data.id }
            - call: "POST /emissions/engine-units"
              payload: { engine_family_id: "${fam_id}", fleet_id: "${flt_id}", serial_number: "UN-201", in_service_date: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { unit_t_id: $.data.id }
            - call: "POST /emissions/engine-units"
              payload: { engine_family_id: "${fam_id}", fleet_id: "${flt_id}", serial_number: "UN-202", in_service_date: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { unit_m_id: $.data.id }
            - call: "POST /emissions/engine-units/${unit_t_id}/telematics-snapshots"
              payload: { recorded_at: "2026-10-15T00:00:00Z", odometer_miles: 15000, engine_hours: 400, fault_codes: [], def_consumption_gal: 40.5, nox_sensor_drift_ppm: 12 }
              as: PlatformAdmin
            - call: "POST /emissions/engine-units/${unit_m_id}/telematics-snapshots"
              payload: { recorded_at: "2026-10-15T00:00:00Z", odometer_miles: 25000, engine_hours: 600, fault_codes: [], def_consumption_gal: 62.0, nox_sensor_drift_ppm: 9 }
              as: PlatformAdmin
            - call: "POST /emissions/engine-units/${unit_t_id}/maintenance-records"
              payload: { performed_at: "2026-10-20T00:00:00Z", maintenance_type: "DEF_SERVICE", odometer_at_service: 14000, def_quality_ok: false }
              as: FleetManager
              as_user_id: "${flt_id}"
            - call: "POST /emissions/engine-units/${unit_m_id}/maintenance-records"
              payload: { performed_at: "2026-10-20T00:00:00Z", maintenance_type: "DEF_SERVICE", odometer_at_service: 24000, def_quality_ok: false }
              as: FleetManager
              as_user_id: "${flt_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-12-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /emissions/warranty-claims"
              payload: { engine_unit_id: "${unit_t_id}", service_center_id: "${ctr_id}", failed_component_class: "ENGINE_BASE", failure_code: "FC-111", claimed_amount_cents: 100000 }
              as: FleetManager
              as_user_id: "${flt_id}"
              captures: { claim_t_id: $.data.id }
            - call: "POST /emissions/warranty-claims"
              payload: { engine_unit_id: "${unit_m_id}", service_center_id: "${ctr_id}", failed_component_class: "AFTERTREATMENT_DPF", failure_code: "FC-222", claimed_amount_cents: 100000 }
              as: FleetManager
              as_user_id: "${flt_id}"
              captures: { claim_m_id: $.data.id }
            - call: "POST /emissions/warranty-claims/${claim_t_id}/start-review"
              payload: {}
              as: WarrantyAdjudicator
            - call: "POST /emissions/warranty-claims/${claim_m_id}/start-review"
              payload: {}
              as: WarrantyAdjudicator
          trigger:
            - call: "POST /emissions/warranty-claims/${claim_t_id}/adjudicate"
              payload: { decision: "APPROVE_PARTIAL" }
              as: WarrantyAdjudicator
              as_user_id: "wa-ines"
            - call: "POST /emissions/warranty-claims/${claim_m_id}/adjudicate"
              payload: { decision: "APPROVE_PARTIAL" }
              as: WarrantyAdjudicator
              as_user_id: "wa-ines"
          assert:
            - "WarrantyClaim.${claim_t_id}.coverage_variant == BASE_WARRANTY and neglect_score == 40"
            - "WarrantyClaim.${claim_t_id}.customer_share_cents == 12467 and approved_amount_cents == 87533 (daily rate round_half_up(100000/730)=137 cents x 91 elapsed days)"
            - "WarrantyClaim.${claim_m_id}.coverage_variant == EXTENDED_EMISSIONS and neglect_score == 40"
            - "WarrantyClaim.${claim_m_id}.customer_share_cents == 25000 and approved_amount_cents == 75000 (per-mile rate round_half_up(100000/100000)=1 cent x 25000 miles)"
            - "Both claims have status APPROVED_PARTIAL despite equal claimed amounts and equal scores, and 87533 != 75000"

      - name: core_credit_provisional_vs_final
        grounds:
          - calculations.core_credit_provisional
          - calculations.core_credit_final
          - entities.RemanOrder.fields.provisional_core_credit_cents
          - entities.RemanOrder.fields.final_core_credit_cents
          - entities.ServiceCenter.fields.core_credit_balance_cents
        distinguishing_aspect: |
          The same quoted values (price 500000, core 200000) yield two valid
          credit figures at two lifecycle points: PROVISIONAL 120000 (flat 60%
          at confirm) vs FINAL 150000 (grade-B 75% under the 40% price cap at
          grading); the 30000 delta posts to the center ledger. Entity domain
          RemanOrder/ServiceCenter, distinct from the WarrantyClaim proration
          instance.
        test_recipe:
          setup:
            - "Logical clock at 2026-12-01T00:00:00Z; family IN_PRODUCTION; unit UN-301 IN_SERVICE (version 1 at creation); center AUTHORIZED."
            - "Reman order QUOTED with price 500000, core value 200000, STANDARD spec level, core due 2027-03-01."
          setup_api_calls:
            - *c_clock0
            - *c_std
            - *c_std_pub
            - *c_fam
            - *c_spec
            - *c_cal
            - *c_act
            - *c_bt
            - *c_ftp
            - *c_ftp_rec
            - *c_ftp_rev
            - *c_rmc
            - *c_rmc_rec
            - *c_rmc_rev
            - *c_set
            - *c_set_rec
            - *c_set_rev
            - *c_submit
            - *c_cert
            - *c_eip
            - *c_fleet
            - *c_center
            - *c_tech2
            - *c_authz
            - *c_authz2
            - *c_tool
            - call: "POST /emissions/engine-units"
              payload: { engine_family_id: "${fam_id}", fleet_id: "${flt_id}", serial_number: "UN-301", in_service_date: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { unit_id: $.data.id, unit_v: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-12-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /emissions/reman-orders"
              payload: { engine_unit_id: "${unit_id}", service_center_id: "${ctr_id}", reman_scope: "ENGINE", spec_level: "STANDARD", quoted_price_cents: 500000, quoted_core_value_cents: 200000, expected_core_return_by: "2027-03-01T00:00:00Z", expected_engine_unit_version: "${unit_v}" }
              as: ServiceAdvisor
              as_user_id: "${ctr_id}"
              captures: { ro_id: $.data.id }
            - call: "POST /emissions/reman-orders/${ro_id}/confirm"
              payload: {}
              as: ServiceAdvisor
              as_user_id: "${ctr_id}"
            - call: "POST /emissions/reman-orders/${ro_id}/receive-core"
              payload: {}
              as: ServiceAdvisor
              as_user_id: "${ctr_id}"
          trigger:
            - call: "POST /emissions/reman-orders/${ro_id}/grade-core"
              payload: { core_grade: "B" }
              as: RemanPlanner
            - call: "GET /emissions/service-centers/${ctr_id}"
              payload: {}
              as: RemanPlanner
              captures: { ctr_balance: $.data.core_credit_balance_cents }
          assert:
            - "RemanOrder.${ro_id}.provisional_core_credit_cents == 120000 (round_half_up(200000 * 0.6))"
            - "RemanOrder.${ro_id}.final_core_credit_cents == 150000 (min(round_half_up(200000 * 0.75), round_half_up(500000 * 0.40)=200000))"
            - "RemanOrder.${ro_id}.provisional_core_credit_cents != RemanOrder.${ro_id}.final_core_credit_cents for identical quoted inputs"
            - "RemanOrder.${ro_id}.invoice_total_cents == 350000 (effective price 500000 - 150000)"
            - "RemanOrder.${ro_id}.status == CREDIT_ISSUED"
            - "ServiceCenter.${ctr_id}.core_credit_balance_cents == 150000 (120000 provisional + 30000 delta) via capture ${ctr_balance}"

  - rule_id: combinatorial_formula
    instances:
      - name: neglect_score_tiered_band_gating
        grounds:
          - calculations.neglect_score
          - validations[priority=9]
          - state_machines.WarrantyClaim.UNDER_REVIEW_to_DENIED_NEGLECT
          - errors.ERR_DECISION_INCONSISTENT_WITH_SCORE
        distinguishing_aspect: |
          Mode (a) — a formula with >= 3 inputs (missed oil intervals by floor
          division, bad DEF events, critical-fault snapshots) and non-linear
          tiered branching on entity state: score 65 falls in the >= 60 DENY
          band, so APPROVE_FULL is rejected with
          ERR_DECISION_INCONSISTENT_WITH_SCORE while DENY_NEGLECT on the same
          claim succeeds. Distinct mode from the rounding-order (b) and
          evaluation-order (c) instances.
        test_recipe:
          setup:
            - "Logical clock ends at 2026-12-01T00:00:00Z; family IN_PRODUCTION; unit UN-401 IN_SERVICE with 35000 accumulated miles, 700 hours, zero OIL_CHANGE records, one DEF_SERVICE with def_quality_ok=false, no CRITICAL-fault snapshots -> neglect_score 65."
            - "Claim for EGR_SYSTEM, claimed 60000, UNDER_REVIEW."
          setup_api_calls:
            - *c_clock0
            - *c_std
            - *c_std_pub
            - *c_fam
            - *c_spec
            - *c_cal
            - *c_act
            - *c_bt
            - *c_ftp
            - *c_ftp_rec
            - *c_ftp_rev
            - *c_rmc
            - *c_rmc_rec
            - *c_rmc_rev
            - *c_set
            - *c_set_rec
            - *c_set_rev
            - *c_submit
            - *c_cert
            - *c_eip
            - *c_fleet
            - *c_center
            - *c_tech2
            - *c_authz
            - *c_authz2
            - *c_tool
            - call: "POST /emissions/engine-units"
              payload: { engine_family_id: "${fam_id}", fleet_id: "${flt_id}", serial_number: "UN-401", in_service_date: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { unit_id: $.data.id }
            - call: "POST /emissions/engine-units/${unit_id}/telematics-snapshots"
              payload: { recorded_at: "2026-10-15T00:00:00Z", odometer_miles: 35000, engine_hours: 700, fault_codes: [], def_consumption_gal: 80.0, nox_sensor_drift_ppm: 5 }
              as: PlatformAdmin
            - call: "POST /emissions/engine-units/${unit_id}/maintenance-records"
              payload: { performed_at: "2026-10-20T00:00:00Z", maintenance_type: "DEF_SERVICE", odometer_at_service: 33000, def_quality_ok: false }
              as: FleetManager
              as_user_id: "${flt_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-12-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /emissions/warranty-claims"
              payload: { engine_unit_id: "${unit_id}", service_center_id: "${ctr_id}", failed_component_class: "EGR_SYSTEM", failure_code: "FC-egr", claimed_amount_cents: 60000 }
              as: FleetManager
              as_user_id: "${flt_id}"
              captures: { claim_id: $.data.id }
            - call: "POST /emissions/warranty-claims/${claim_id}/start-review"
              payload: {}
              as: WarrantyAdjudicator
          trigger:
            - call: "POST /emissions/warranty-claims/${claim_id}/adjudicate"
              payload: { decision: "APPROVE_FULL" }
              as: WarrantyAdjudicator
              as_user_id: "wa-ines"
              captures: { deny_err: $.data.error_id }
            - call: "POST /emissions/warranty-claims/${claim_id}/adjudicate"
              payload: { decision: "DENY_NEGLECT" }
              as: WarrantyAdjudicator
              as_user_id: "wa-ines"
            - call: "GET /emissions/fleets/${flt_id}"
              payload: {}
              as: WarrantyAdjudicator
              captures: { flt_neglect: $.data.neglect_denial_count }
          assert:
            - "first adjudicate returns 422 with error_id ERR_DECISION_INCONSISTENT_WITH_SCORE (score 65 is in the DENY band) via ${deny_err}"
            - "claim remains UNDER_REVIEW after the rejected decision"
            - "second adjudicate succeeds: WarrantyClaim.${claim_id}.status == DENIED_NEGLECT, neglect_score == 65 (2 missed intervals x 25 + 1 bad DEF x 15)"
            - "WarrantyClaim.${claim_id}.approved_amount_cents == 0 and customer_share_cents == 60000"
            - "Fleet.${flt_id}.neglect_denial_count == 1 via ${flt_neglect} and status still ACTIVE (below threshold 3)"

      - name: proration_daily_rate_rounding_order
        grounds:
          - calculations.partial_claim_proration
          - entities.WarrantyClaim.fields.customer_share_cents
        distinguishing_aspect: |
          Mode (b) — nested rounding where the pinned order matters: round the
          daily rate first (round_half_up(99991/730) = 137) then multiply by 91
          elapsed days gives customer_share 12467; the alternative sum-then-
          round order (round_half_up(99991*91/730)) would give 12465. The
          scaffold pins rate-first, so 12467 is the only compliant answer.
          Distinct mode from the tiered (a) and evaluation-order (c) instances.
        test_recipe:
          setup:
            - "Logical clock ends at 2026-12-01T00:00:00Z (91 days of term elapsed); family IN_PRODUCTION; unit UN-402 IN_SERVICE, in_service 2026-09-01, 15000 miles, one bad DEF_SERVICE, no OIL_CHANGE, no CRITICAL snapshots -> neglect_score 40 (partial band)."
            - "Claim ENGINE_BASE, claimed 99991, UNDER_REVIEW, coverage_variant BASE_WARRANTY (base term 2 years = 730 days)."
          setup_api_calls:
            - *c_clock0
            - *c_std
            - *c_std_pub
            - *c_fam
            - *c_spec
            - *c_cal
            - *c_act
            - *c_bt
            - *c_ftp
            - *c_ftp_rec
            - *c_ftp_rev
            - *c_rmc
            - *c_rmc_rec
            - *c_rmc_rev
            - *c_set
            - *c_set_rec
            - *c_set_rev
            - *c_submit
            - *c_cert
            - *c_eip
            - *c_fleet
            - *c_center
            - *c_tech2
            - *c_authz
            - *c_authz2
            - *c_tool
            - call: "POST /emissions/engine-units"
              payload: { engine_family_id: "${fam_id}", fleet_id: "${flt_id}", serial_number: "UN-402", in_service_date: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { unit_id: $.data.id }
            - call: "POST /emissions/engine-units/${unit_id}/telematics-snapshots"
              payload: { recorded_at: "2026-10-15T00:00:00Z", odometer_miles: 15000, engine_hours: 400, fault_codes: [], def_consumption_gal: 40.0, nox_sensor_drift_ppm: 4 }
              as: PlatformAdmin
            - call: "POST /emissions/engine-units/${unit_id}/maintenance-records"
              payload: { performed_at: "2026-10-20T00:00:00Z", maintenance_type: "DEF_SERVICE", odometer_at_service: 14000, def_quality_ok: false }
              as: FleetManager
              as_user_id: "${flt_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-12-01T00:00:00Z" }
              as: PlatformAdmin
