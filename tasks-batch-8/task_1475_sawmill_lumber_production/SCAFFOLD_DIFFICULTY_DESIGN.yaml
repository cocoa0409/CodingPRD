# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN: sawmill-lumber-production (§1.8 Test Targeting Index)
# Two instances per Difficulty Rule (§0.5). All chains replay against SCAFFOLD.yaml
# §1.2/§1.4/§1.5/§1.6 from empty-DB; default logical clock 2026-08-01T00:00:00Z.
# =============================================================================

scaffold_difficulty_design:

  # ---------------------------------------------------------------- Rule 1 ---
  - rule_id: dual_variant_calc
    instances:
      - name: recovery_factor_provisional_vs_certified
        grounds:
          - calculations.lumber_recovery_factor
          - state_machines.SawingRun.PLANNED_to_COMPLETED
          - entities.SawingRun.fields.recovery_pct_provisional
          - entities.SawingRun.fields.recovery_pct_certified
        distinguishing_aspect: |
          Production-domain dual variant on SawingRun: the provisional variant prices
          recovery on green_mbf (58.00%) while the certified variant recomputes on
          post-shrink dry_mbf (54.10%) for identical run input — different entity
          domain and different numerator basis than the inventory-domain sibling.
        test_recipe:
          setup:
            - "One DF load scaled at 100 mbf, decked (clock 2026-08-01, 0 degrade), consumed by a completed run producing one package of green_mbf 58.0; package kiln-dried with measured actual 54.1"
            - "Before stamping, recovery_pct_certified is null (package not yet STAMPED)"
          setup_api_calls:
            - { call: "POST /api/log-loads", payload: { supplier_name: "Olympic Log Co", species: DOUGLAS_FIR, log_grade: SAWLOG_1 }, as: Scaler, captures: { load_id: $.data.id } }
            - { call: "POST /api/log-loads/${load_id}/scale", payload: { scaled_mbf: 100, price_per_mbf_cents: 25000 }, as: Scaler }
            - { call: "POST /api/log-loads/${load_id}/deck", payload: {}, as: Scaler }
            - { call: "POST /api/sawing-runs", payload: { saw_line: LINE_A, scheduled_date: "2026-08-02", sawing_pattern: DIMENSION_2X4, log_load_ids: ["${load_id}"] }, as: Sawyer, captures: { run_id: $.data.id } }
            - { call: "POST /api/sawing-runs/${run_id}/complete", payload: { packages: [ { species: DOUGLAS_FIR, dimension: 2X4, length_ft: 12, pieces: 500, green_mbf: 58.0 } ], chip_tons: 20, sawdust_tons: 10, bark_tons: 8 }, as: Sawyer, captures: { prov: $.data.recovery_pct_provisional } }
            - { call: "GET /api/lumber-packages", payload: { sawing_run_id: "${run_id}" }, as: Sawyer, captures: { pkg_id: "$.data[0].id" } }
            - { call: "POST /api/kiln-charges", payload: { chamber: KILN_1, species: DOUGLAS_FIR, package_ids: ["${pkg_id}"], scheduled_start: "2026-08-02T00:00:00Z", scheduled_end: "2026-08-05T00:00:00Z", target_moisture_pct: 15.0 }, as: KilnOperator, captures: { charge_id: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T00:00:00Z" }, as: MillManager }
            - { call: "POST /api/kiln-charges/${charge_id}/start", payload: {}, as: KilnOperator }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T00:00:00Z" }, as: MillManager }
            - { call: "POST /api/kiln-charges/${charge_id}/complete", payload: { readings: [ { package_id: "${pkg_id}", exit_moisture_pct: 14.0, measured_dry_mbf: 54.1 } ] }, as: KilnOperator }
          trigger:
            - { call: "POST /api/lumber-packages/${pkg_id}/grade-inspections", payload: { inspector_grade: NO_2, action: STAMP }, as: Grader }
            - { call: "GET /api/sawing-runs/${run_id}", payload: {}, as: Sawyer, captures: { cert: $.data.recovery_pct_certified } }
          assert:
            - "prov == 58.0 (provisional: round(58.0/100*100, 2) on green tally)"
            - "cert == 54.1 (certified: round(54.1/100*100, 2) on measured dry tally)"
            - "prov != cert — same run input, two valid algorithms, different results"

      - name: dry_volume_estimated_vs_actual_reconciliation
        grounds:
          - calculations.dry_volume_estimate_vs_actual
          - state_machines.LumberPackage.IN_KILN_to_DRY
          - entities.LumberPackage.fields.dry_mbf
        distinguishing_aspect: |
          Inventory-domain dual variant on LumberPackage: dry_mbf starts as the
          species-constant estimate (20.0 * 0.95 = 19.0) and reconciles to the
          measured actual (18.7) at kiln completion — a different entity and a
          different variant axis (estimate vs measurement) than the recovery-factor
          sibling on SawingRun.
        test_recipe:
          setup:
            - "One CEDAR package of green_mbf 20.0 charged in KILN_2, charge IN_PROGRESS, clock at 2026-08-02"
            - "dry_mbf reads the estimated variant (19.0) before completion"
          setup_api_calls:
            - { call: "POST /api/log-loads", payload: { supplier_name: "Cedar Rim LLC", species: CEDAR, log_grade: SAWLOG_2 }, as: Scaler, captures: { load_id: $.data.id } }
            - { call: "POST /api/log-loads/${load_id}/scale", payload: { scaled_mbf: 50, price_per_mbf_cents: 20000 }, as: Scaler }
            - { call: "POST /api/log-loads/${load_id}/deck", payload: {}, as: Scaler }
            - { call: "POST /api/sawing-runs", payload: { saw_line: LINE_A, scheduled_date: "2026-08-02", sawing_pattern: DIMENSION_2X4, log_load_ids: ["${load_id}"] }, as: Sawyer, captures: { run_id: $.data.id } }
            - { call: "POST /api/sawing-runs/${run_id}/complete", payload: { packages: [ { species: CEDAR, dimension: 2X4, length_ft: 12, pieces: 100, green_mbf: 20.0 } ], chip_tons: 5, sawdust_tons: 2, bark_tons: 2 }, as: Sawyer }
            - { call: "GET /api/lumber-packages", payload: { sawing_run_id: "${run_id}" }, as: Sawyer, captures: { pkg_id: "$.data[0].id" } }
            - { call: "POST /api/kiln-charges", payload: { chamber: KILN_2, species: CEDAR, package_ids: ["${pkg_id}"], scheduled_start: "2026-08-02T00:00:00Z", scheduled_end: "2026-08-05T00:00:00Z", target_moisture_pct: 15.0 }, as: KilnOperator, captures: { charge_id: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T00:00:00Z" }, as: MillManager }
            - { call: "POST /api/kiln-charges/${charge_id}/start", payload: {}, as: KilnOperator }
            - { call: "GET /api/lumber-packages/${pkg_id}", payload: {}, as: KilnOperator, captures: { dry_before: $.data.dry_mbf } }
          trigger:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T00:00:00Z" }, as: MillManager }
            - { call: "POST /api/kiln-charges/${charge_id}/complete", payload: { readings: [ { package_id: "${pkg_id}", exit_moisture_pct: 12.0, measured_dry_mbf: 18.7 } ] }, as: KilnOperator }
            - { call: "GET /api/lumber-packages/${pkg_id}", payload: {}, as: KilnOperator, captures: { dry_after: $.data.dry_mbf, st_after: $.data.status } }
          assert:
            - "dry_before == 19.0 (estimated: round(20.0 * (1 - 0.05), 3))"
            - "dry_after == 18.7 (measured actual replaces the estimate)"
            - "st_after == DRY and LumberPackage.${pkg_id}.actual_dry_mbf == 18.7"

  # ---------------------------------------------------------------- Rule 2 ---
  - rule_id: combinatorial_formula
    instances:
      - name: spot_price_length_tier_volume_discount
        grounds:
          - calculations.spot_unit_price
          - entities.SalesOrder.fields.unit_price_cents
        distinguishing_aspect: |
          Mode (a): a four-input formula (base price x length-tier multiplier x
          volume-bracket discount x two-step pinned rounding) with non-linear
          tier selection — distinct from the sibling's mode (b) nested-rounding
          order on order totals.
        test_recipe:
          setup:
            - "Effective DF NO_2 price list base 60000 cents/MBF from 2026-07-01; clock at default 2026-08-01"
          setup_api_calls:
            - { call: "POST /api/price-lists", payload: { species: DOUGLAS_FIR, grade: NO_2, base_price_per_mbf_cents: 60000, effective_from: "2026-07-01T00:00:00Z" }, as: MillManager }
          trigger:
            - { call: "POST /api/sales-orders", payload: { customer_name: "Bridgeline Homes", species: DOUGLAS_FIR, grade: NO_2, length_spec: 16, volume_mbf: 60 }, as: SalesRep, captures: { o1_id: $.data.id, o1_unit: $.data.unit_price_cents, o1_mode: $.data.pricing_mode } }
            - { call: "POST /api/sales-orders", payload: { customer_name: "Bridgeline Homes", species: DOUGLAS_FIR, grade: NO_2, length_spec: 8, volume_mbf: 5 }, as: SalesRep, captures: { o2_unit: $.data.unit_price_cents } }
          assert:
            - "o1_unit == 61560 (round(60000*1.08)=64800; volume 60 >= 50 -> 5% discount -> round(64800*0.95)=61560)"
            - "o2_unit == 57000 (round(60000*0.95)=57000; volume 5 < 10 -> no discount)"
            - "o1_mode == SPOT and SalesOrder.${o1_id}.status == PLACED"

      - name: order_total_per_package_rounding_then_sum
        grounds:
          - calculations.order_total_per_package_rounding
          - calculations.allocation_selector
          - entities.SalesOrder.fields.total_cents
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters — the scaffold pins
          round-per-package-then-sum (183338 + 183338 = 366676), while the
          rejected sum-then-round reading yields 366637; distinct from the
          sibling's mode (a) tiered pricing.
        test_recipe:
          setup:
            - "Two DF NO_2 len-12 STAMPED packages, each with measured dry_mbf 3.333"
            - "ACTIVE contract Cedarhurst DF NO_2 committed 100 at 55001 cents/MBF"
          setup_api_calls:
            - { call: "POST /api/log-loads", payload: { supplier_name: "Olympic Log Co", species: DOUGLAS_FIR, log_grade: SAWLOG_1 }, as: Scaler, captures: { load_id: $.data.id } }
            - { call: "POST /api/log-loads/${load_id}/scale", payload: { scaled_mbf: 100, price_per_mbf_cents: 25000 }, as: Scaler }
            - { call: "POST /api/log-loads/${load_id}/deck", payload: {}, as: Scaler }
            - { call: "POST /api/sawing-runs", payload: { saw_line: LINE_A, scheduled_date: "2026-08-02", sawing_pattern: DIMENSION_2X4, log_load_ids: ["${load_id}"] }, as: Sawyer, captures: { run_id: $.data.id } }
            - { call: "POST /api/sawing-runs/${run_id}/complete", payload: { packages: [ { species: DOUGLAS_FIR, dimension: 2X4, length_ft: 12, pieces: 30, green_mbf: 3.5 }, { species: DOUGLAS_FIR, dimension: 2X4, length_ft: 12, pieces: 30, green_mbf: 3.5 } ], chip_tons: 5, sawdust_tons: 2, bark_tons: 2 }, as: Sawyer }
            - { call: "GET /api/lumber-packages", payload: { sawing_run_id: "${run_id}" }, as: Sawyer, captures: { p1: "$.data[0].id", p2: "$.data[1].id" } }
            - { call: "POST /api/kiln-charges", payload: { chamber: KILN_1, species: DOUGLAS_FIR, package_ids: ["${p1}", "${p2}"], scheduled_start: "2026-08-02T00:00:00Z", scheduled_end: "2026-08-05T00:00:00Z", target_moisture_pct: 15.0 }, as: KilnOperator, captures: { charge_id: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T00:00:00Z" }, as: MillManager }
            - { call: "POST /api/kiln-charges/${charge_id}/start", payload: {}, as: KilnOperator }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T00:00:00Z" }, as: MillManager }
            - { call: "POST /api/kiln-charges/${charge_id}/complete", payload: { readings: [ { package_id: "${p1}", exit_moisture_pct: 12.0, measured_dry_mbf: 3.333 }, { package_id: "${p2}", exit_moisture_pct: 12.0, measured_dry_mbf: 3.333 } ] }, as: KilnOperator }
            - { call: "POST /api/lumber-packages/${p1}/grade-inspections", payload: { inspector_grade: NO_2, action: STAMP }, as: Grader }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T01:00:00Z" }, as: MillManager }
            - { call: "POST /api/lumber-packages/${p2}/grade-inspections", payload: { inspector_grade: NO_2, action: STAMP }, as: Grader }
            - { call: "POST /api/sales-contracts", payload: { customer_name: "Cedarhurst", species: DOUGLAS_FIR, grade: NO_2, committed_mbf: 100, contract_price_per_mbf_cents: 55001, start_date: "2026-08-01", end_date: "2026-09-01" }, as: MillManager, captures: { contract_id: $.data.id } }
            - { call: "POST /api/sales-contracts/${contract_id}/activate", payload: {}, as: MillManager }
          trigger:
            - { call: "POST /api/sales-orders", payload: { customer_name: "Cedarhurst", contract_id: "${contract_id}", species: DOUGLAS_FIR, grade: NO_2, length_spec: 12, volume_mbf: 6 }, as: SalesRep, captures: { ord_id: $.data.id, ord_unit: $.data.unit_price_cents } }
            - { call: "POST /api/sales-orders/${ord_id}/allocate", payload: {}, as: SalesRep, captures: { tot: $.data.total_cents, alloc: $.data.allocated_mbf } }
          assert:
            - "ord_unit == 55001 (contract price pinned verbatim, no spot tiers)"
            - "tot == 366676 (round(3.333*55001)=183338 per package, summed twice; sum-then-round would give round(6.666*55001)=366637)"
            - "alloc == 6.666 and SalesOrder.${ord_id}.status == ALLOCATED"

  # ---------------------------------------------------------------- Rule 3 ---
  - rule_id: non_linear_state_machine
    instances:
      - name: log_load_scale_dispute_cycle
        grounds:
          - state_machines.LogLoad.SCALED_to_DISPUTED
          - state_machines.LogLoad.DISPUTED_to_SCALED
          - calculations.purchase_cost
        distinguishing_aspect: |
          LogLoad's cyclic machine (SCALED -> DISPUTED -> SCALED revision loop with
          commercial terms replaced per lap) — a different entity than the sibling's
          LumberPackage kiln-rework cycle.
        test_recipe:
          setup: ["One RECEIVED DF load"]
          setup_api_calls:
            - { call: "POST /api/log-loads", payload: { supplier_name: "Olympic Log Co", species: DOUGLAS_FIR, log_grade: SAWLOG_1 }, as: Scaler, captures: { load_id: $.data.id, v0: $.data.version } }
            - { call: "POST /api/log-loads/${load_id}/scale", payload: { scaled_mbf: 100, price_per_mbf_cents: 25000 }, as: Scaler, captures: { cost1: $.data.purchase_cost_cents } }
          trigger:
            - { call: "POST /api/log-loads/${load_id}/dispute", payload: { reason: "supplier contests Scribner short" }, as: Scaler, captures: { mid_status: $.data.status } }
            - { call: "POST /api/log-loads/${load_id}/resolve-scale", payload: { scaled_mbf: 96, price_per_mbf_cents: 26000 }, as: MillManager, captures: { cost2: $.data.purchase_cost_cents, st2: $.data.status, v2: $.data.version } }
          assert:
            - "cost1 == 2500000 (round(100 * 25000, 0))"
            - "mid_status == DISPUTED (first lap of the cycle)"
            - "cost2 == 2496000 (round(96 * 26000, 0) — resolution replaces terms)"
            - "st2 == SCALED (cycle closed) and v2 == 4 (create v1; scale, dispute, resolve each +1)"

      - name: kiln_rework_cycle_green_to_dry
        grounds:
          - state_machines.LumberPackage.IN_KILN_to_GREEN
          - state_machines.LumberPackage.GREEN_to_IN_KILN
          - calculations.moisture_pass_gate
        distinguishing_aspect: |
          LumberPackage's cyclic machine (GREEN -> IN_KILN -> GREEN rework loop on
          moisture failure, re-charged and passed on the second lap) — a different
          entity than the sibling's LogLoad dispute loop.
        test_recipe:
          setup: ["One DF package green_mbf 20.0 produced at clock 2026-08-01"]
          setup_api_calls:
            - { call: "POST /api/log-loads", payload: { supplier_name: "Olympic Log Co", species: DOUGLAS_FIR, log_grade: SAWLOG_1 }, as: Scaler, captures: { load_id: $.data.id } }
            - { call: "POST /api/log-loads/${load_id}/scale", payload: { scaled_mbf: 50, price_per_mbf_cents: 25000 }, as: Scaler }
            - { call: "POST /api/log-loads/${load_id}/deck", payload: {}, as: Scaler }
            - { call: "POST /api/sawing-runs", payload: { saw_line: LINE_B, scheduled_date: "2026-08-02", sawing_pattern: DIMENSION_2X4, log_load_ids: ["${load_id}"] }, as: Sawyer, captures: { run_id: $.data.id } }
            - { call: "POST /api/sawing-runs/${run_id}/complete", payload: { packages: [ { species: DOUGLAS_FIR, dimension: 2X4, length_ft: 12, pieces: 100, green_mbf: 20.0 } ], chip_tons: 5, sawdust_tons: 2, bark_tons: 2 }, as: Sawyer }
            - { call: "GET /api/lumber-packages", payload: { sawing_run_id: "${run_id}" }, as: Sawyer, captures: { pkg_id: "$.data[0].id" } }
          trigger:
            - { call: "POST /api/kiln-charges", payload: { chamber: KILN_1, species: DOUGLAS_FIR, package_ids: ["${pkg_id}"], scheduled_start: "2026-08-02T00:00:00Z", scheduled_end: "2026-08-05T00:00:00Z", target_moisture_pct: 15.0 }, as: KilnOperator, captures: { ch1: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T00:00:00Z" }, as: MillManager }
            - { call: "POST /api/kiln-charges/${ch1}/start", payload: {}, as: KilnOperator }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T00:00:00Z" }, as: MillManager }
            - { call: "POST /api/kiln-charges/${ch1}/complete", payload: { readings: [ { package_id: "${pkg_id}", exit_moisture_pct: 19.5, measured_dry_mbf: 19.0 } ] }, as: KilnOperator, captures: { ch1_st: $.data.status } }
            - { call: "POST /api/kiln-charges", payload: { chamber: KILN_2, species: DOUGLAS_FIR, package_ids: ["${pkg_id}"], scheduled_start: "2026-08-06T00:00:00Z", scheduled_end: "2026-08-09T00:00:00Z", target_moisture_pct: 15.0 }, as: KilnOperator, captures: { ch2: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-06T00:00:00Z" }, as: MillManager }
            - { call: "POST /api/kiln-charges/${ch2}/start", payload: {}, as: KilnOperator }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-09T00:00:00Z" }, as: MillManager }
            - { call: "POST /api/kiln-charges/${ch2}/complete", payload: { readings: [ { package_id: "${pkg_id}", exit_moisture_pct: 14.0, measured_dry_mbf: 18.4 } ] }, as: KilnOperator }
            - { call: "GET /api/lumber-packages/${pkg_id}", payload: {}, as: KilnOperator, captures: { fin_st: $.data.status, fin_charge: $.data.kiln_charge_id, fin_dry: $.data.dry_mbf } }
          assert:
            - "lap 1: 19.5 > 15.0 + 2.0 -> package returned IN_KILN -> GREEN with actual_dry_mbf still null"
            - "ch1_st == COMPLETED (the charge completes; packages route individually)"
            - "fin_st == DRY after lap 2 (14.0 <= 17.0) and fin_charge == null"
            - "fin_dry == 18.4"

  # ---------------------------------------------------------------- Rule 4 ---
  - rule_id: transitive_cascade
    instances:
      - name: ship_order_cascade_to_contract_close
        grounds:
          - state_machines.SalesOrder.ALLOCATED_to_SHIPPED
          - state_machines.LumberPackage.ALLOCATED_to_SHIPPED
          - state_machines.SalesContract.ACTIVE_to_CLOSED
          - calculations.contract_drawdown
        distinguishing_aspect: |
          Depth-3 chain from POST ship: order SHIPPED -> package SHIPPED ->
          contract.shipped_mbf re-derived -> contract auto-CLOSED at 10.5 >= 10;
          each link is caused by the previous mutation, and the trigger differs
          from the sibling's RESTAMP trigger.
        test_recipe:
          setup:
            - "ACTIVE contract Acme DF NO_2 committed 10 @ 60000; one STAMPED DF NO_2 len-12 package with measured dry_mbf 10.5"
          setup_api_calls:
            - { call: "POST /api/log-loads", payload: { supplier_name: "Olympic Log Co", species: DOUGLAS_FIR, log_grade: SAWLOG_1 }, as: Scaler, captures: { load_id: $.data.id } }
            - { call: "POST /api/log-loads/${load_id}/scale", payload: { scaled_mbf: 100, price_per_mbf_cents: 25000 }, as: Scaler }
            - { call: "POST /api/log-loads/${load_id}/deck", payload: {}, as: Scaler }
            - { call: "POST /api/sawing-runs", payload: { saw_line: LINE_A, scheduled_date: "2026-08-02", sawing_pattern: DIMENSION_2X4, log_load_ids: ["${load_id}"] }, as: Sawyer, captures: { run_id: $.data.id } }
            - { call: "POST /api/sawing-runs/${run_id}/complete", payload: { packages: [ { species: DOUGLAS_FIR, dimension: 2X4, length_ft: 12, pieces: 500, green_mbf: 12.0 } ], chip_tons: 20, sawdust_tons: 10, bark_tons: 8 }, as: Sawyer }
            - { call: "GET /api/lumber-packages", payload: { sawing_run_id: "${run_id}" }, as: Sawyer, captures: { pkg_id: "$.data[0].id" } }
            - { call: "POST /api/kiln-charges", payload: { chamber: KILN_1, species: DOUGLAS_FIR, package_ids: ["${pkg_id}"], scheduled_start: "2026-08-02T00:00:00Z", scheduled_end: "2026-08-05T00:00:00Z", target_moisture_pct: 15.0 }, as: KilnOperator, captures: { charge_id: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T00:00:00Z" }, as: MillManager }
            - { call: "POST /api/kiln-charges/${charge_id}/start", payload: {}, as: KilnOperator }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T00:00:00Z" }, as: MillManager }
            - { call: "POST /api/kiln-charges/${charge_id}/complete", payload: { readings: [ { package_id: "${pkg_id}", exit_moisture_pct: 14.0, measured_dry_mbf: 10.5 } ] }, as: KilnOperator }
            - { call: "POST /api/lumber-packages/${pkg_id}/grade-inspections", payload: { inspector_grade: NO_2, action: STAMP }, as: Grader }
            - { call: "POST /api/sales-contracts", payload: { customer_name: "Acme Builders", species: DOUGLAS_FIR, grade: NO_2, committed_mbf: 10, contract_price_per_mbf_cents: 60000, start_date: "2026-08-01", end_date: "2026-09-01" }, as: MillManager, captures: { cid: $.data.id } }
            - { call: "POST /api/sales-contracts/${cid}/activate", payload: {}, as: MillManager }
          trigger:
            - { call: "POST /api/sales-orders", payload: { customer_name: "Acme Builders", contract_id: "${cid}", species: DOUGLAS_FIR, grade: NO_2, length_spec: 12, volume_mbf: 10 }, as: SalesRep, captures: { oid: $.data.id } }
            - { call: "POST /api/sales-orders/${oid}/allocate", payload: {}, as: SalesRep }
            - { call: "POST /api/sales-orders/${oid}/ship", payload: {}, as: SalesRep, captures: { o_st: $.data.status } }
            - { call: "GET /api/sales-contracts/${cid}", payload: {}, as: SalesRep, captures: { c_status: $.data.status, c_shipped: $.data.shipped_mbf, c_reserved: $.data.reserved_mbf } }
            - { call: "GET /api/lumber-packages/${pkg_id}", payload: {}, as: SalesRep, captures: { p_st: $.data.status } }
          assert:
            - "p_st == SHIPPED (link 1: order ship flips its allocated packages)"
            - "c_shipped == 10.5 (link 2: the package flip re-derives contract shipped_mbf from SHIPPED packages)"
            - "c_status == CLOSED (link 3: 10.5 >= committed 10 auto-closes the ACTIVE contract)"
            - "c_reserved == 0 (order volume released on ship) and o_st == SHIPPED"

      - name: restamp_downfall_deallocates_order
        grounds:
          - state_machines.LumberPackage.ALLOCATED_to_STAMPED
          - state_machines.SalesOrder.ALLOCATED_to_PLACED
          - entities.GradeInspection.fields.action
        distinguishing_aspect: |
          Depth-3 chain from a RESTAMP inspection (different trigger than ship):
          grade mutation NO_2 -> NO_3 -> package released from the mismatched order
          -> order recomputes to zero allocation and falls back ALLOCATED -> PLACED.
        test_recipe:
          setup:
            - "Effective DF NO_2 price list 60000; one STAMPED DF NO_2 len-12 package, measured dry_mbf 10.5, ALLOCATED to a spot order of volume 9"
          setup_api_calls:
            - { call: "POST /api/price-lists", payload: { species: DOUGLAS_FIR, grade: NO_2, base_price_per_mbf_cents: 60000, effective_from: "2026-07-01T00:00:00Z" }, as: MillManager }
            - { call: "POST /api/log-loads", payload: { supplier_name: "Olympic Log Co", species: DOUGLAS_FIR, log_grade: SAWLOG_1 }, as: Scaler, captures: { load_id: $.data.id } }
            - { call: "POST /api/log-loads/${load_id}/scale", payload: { scaled_mbf: 100, price_per_mbf_cents: 25000 }, as: Scaler }
            - { call: "POST /api/log-loads/${load_id}/deck", payload: {}, as: Scaler }
            - { call: "POST /api/sawing-runs", payload: { saw_line: LINE_A, scheduled_date: "2026-08-02", sawing_pattern: DIMENSION_2X4, log_load_ids: ["${load_id}"] }, as: Sawyer, captures: { run_id: $.data.id } }
            - { call: "POST /api/sawing-runs/${run_id}/complete", payload: { packages: [ { species: DOUGLAS_FIR, dimension: 2X4, length_ft: 12, pieces: 500, green_mbf: 12.0 } ], chip_tons: 20, sawdust_tons: 10, bark_tons: 8 }, as: Sawyer }
            - { call: "GET /api/lumber-packages", payload: { sawing_run_id: "${run_id}" }, as: Sawyer, captures: { pkg_id: "$.data[0].id" } }
            - { call: "POST /api/kiln-charges", payload: { chamber: KILN_3, species: DOUGLAS_FIR, package_ids: ["${pkg_id}"], scheduled_start: "2026-08-02T00:00:00Z", scheduled_end: "2026-08-05T00:00:00Z", target_moisture_pct: 15.0 }, as: KilnOperator, captures: { charge_id: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T00:00:00Z" }, as: MillManager }
            - { call: "POST /api/kiln-charges/${charge_id}/start", payload: {}, as: KilnOperator }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T00:00:00Z" }, as: MillManager }
            - { call: "POST /api/kiln-charges/${charge_id}/complete", payload: { readings: [ { package_id: "${pkg_id}", exit_moisture_pct: 14.0, measured_dry_mbf: 10.5 } ] }, as: KilnOperator }
            - { call: "POST /api/lumber-packages/${pkg_id}/grade-inspections", payload: { inspector_grade: NO_2, action: STAMP }, as: Grader }
            - { call: "POST /api/sales-orders", payload: { customer_name: "Spot Buyer", species: DOUGLAS_FIR, grade: NO_2, length_spec: 12, volume_mbf: 9 }, as: SalesRep, captures: { oid: $.data.id } }
            - { call: "POST /api/sales-orders/${oid}/allocate", payload: {}, as: SalesRep, captures: { alloc0: $.data.allocated_mbf } }
          trigger:
            - { call: "POST /api/lumber-packages/${pkg_id}/grade-inspections", payload: { inspector_grade: NO_3, action: RESTAMP, note: "wane over limit" }, as: Grader }
            - { call: "GET /api/sales-orders/${oid}", payload: {}, as: SalesRep, captures: { o_st: $.data.status, o_alloc: $.data.allocated_mbf, o_tot: $.data.total_cents } }
            - { call: "GET /api/lumber-packages/${pkg_id}", payload: {}, as: SalesRep, captures: { p_st: $.data.status, p_grade: $.data.stamped_grade, p_ord: $.data.sales_order_id } }
          assert:
            - "alloc0 == 10.5 (allocated before the restamp)"
            - "p_grade == NO_3 (downfall recorded), p_st == STAMPED, p_ord == null (link 2: release on grade mismatch)"
            - "o_st == PLACED, o_alloc == 0, o_tot == 0 (link 3: order with zero allocated packages falls back)"

  # ---------------------------------------------------------------- Rule 5 ---
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: allocate_state_beats_fiscal
        grounds:
          - validations[priority=5]
          - validations[priority=9]
          - state_machines.SalesOrder.PLACED_to_ALLOCATED
        distinguishing_aspect: |
          Category pair state (5) vs business_fiscal (9): allocating a CANCELLED
          order into an empty stamped pool must surface ERR_INVALID_STATE, never
          ERR_INSUFFICIENT_STAMPED_VOLUME — different pair than the sibling's
          temporal-vs-constraint conflict.
        test_recipe:
          setup:
            - "Effective DF NO_2 price list; one PLACED spot order volume 10 (no stamped packages exist, so the pool check would also fail)"
          setup_api_calls:
            - { call: "POST /api/price-lists", payload: { species: DOUGLAS_FIR, grade: NO_2, base_price_per_mbf_cents: 60000, effective_from: "2026-07-01T00:00:00Z" }, as: MillManager }
            - { call: "POST /api/sales-orders", payload: { customer_name: "Spot Buyer", species: DOUGLAS_FIR, grade: NO_2, length_spec: 12, volume_mbf: 10 }, as: SalesRep, captures: { oid: $.data.id } }
          trigger:
            - { call: "POST /api/sales-orders/${oid}/cancel", payload: {}, as: SalesRep }
            - { call: "POST /api/sales-orders/${oid}/allocate", payload: {}, as: SalesRep, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_STATE (priority 5 state beats priority 9 business_fiscal)"
            - "SalesOrder.${oid}.status == CANCELLED and no package state changed"

      - name: kiln_create_temporal_beats_constraint
        grounds:
          - validations[priority=6]
          - validations[priority=7]
          - entities.KilnCharge.fields.scheduled_start
        distinguishing_aspect: |
          Category pair business_temporal (6) vs business_constraint (7): a charge
          whose scheduled_start is in the past AND which overlaps an existing
          charge must surface ERR_SCHEDULE_IN_PAST, never ERR_KILN_OVERLAP —
          different pair than the sibling's state-vs-fiscal conflict.
        test_recipe:
          setup:
            - "Charge A occupies KILN_1 [2026-08-09T00:00:00Z, 2026-08-12T00:00:00Z) with package p1; package p2 is GREEN and unattached; clock advanced to 2026-08-10T00:00:00Z"
          setup_api_calls:
            - { call: "POST /api/log-loads", payload: { supplier_name: "Olympic Log Co", species: DOUGLAS_FIR, log_grade: SAWLOG_1 }, as: Scaler, captures: { load_id: $.data.id } }
            - { call: "POST /api/log-loads/${load_id}/scale", payload: { scaled_mbf: 100, price_per_mbf_cents: 25000 }, as: Scaler }
            - { call: "POST /api/log-loads/${load_id}/deck", payload: {}, as: Scaler }
            - { call: "POST /api/sawing-runs", payload: { saw_line: LINE_A, scheduled_date: "2026-08-02", sawing_pattern: DIMENSION_2X4, log_load_ids: ["${load_id}"] }, as: Sawyer, captures: { run_id: $.data.id } }
            - { call: "POST /api/sawing-runs/${run_id}/complete", payload: { packages: [ { species: DOUGLAS_FIR, dimension: 2X4, length_ft: 12, pieces: 100, green_mbf: 20.0 }, { species: DOUGLAS_FIR, dimension: 2X4, length_ft: 12, pieces: 100, green_mbf: 20.0 } ], chip_tons: 5, sawdust_tons: 2, bark_tons: 2 }, as: Sawyer }
            - { call: "GET /api/lumber-packages", payload: { sawing_run_id: "${run_id}" }, as: Sawyer, captures: { p1: "$.data[0].id", p2: "$.data[1].id" } }
            - { call: "POST /api/kiln-charges", payload: { chamber: KILN_1, species: DOUGLAS_FIR, package_ids: ["${p1}"], scheduled_start: "2026-08-09T00:00:00Z", scheduled_end: "2026-08-12T00:00:00Z", target_moisture_pct: 15.0 }, as: KilnOperator, captures: { charge_a: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: MillManager }
          trigger:
            - { call: "POST /api/kiln-charges", payload: { chamber: KILN_1, species: DOUGLAS_FIR, package_ids: ["${p2}"], scheduled_start: "2026-08-08T00:00:00Z", scheduled_end: "2026-08-10T00:00:00Z", target_moisture_pct: 15.0 }, as: KilnOperator, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_SCHEDULE_IN_PAST (priority 6 beats priority 7 even though [08-08,08-10) also overlaps charge A [08-09,08-12))"
            - "LumberPackage.${p2}.status == GREEN and KilnCharge.${charge_a}.status == SCHEDULED (no partial side effects)"

  # ---------------------------------------------------------------- Rule 6 ---
  - rule_id: boundary_precision_check
    instances:
      - name: degrade_boundary_exactly_14_days
        grounds:
          - calculations.deck_degrade_pct
          - entities.LogLoad.fields.degrade_pct
        distinguishing_aspect: |
          Metric: days_in_deck against FREE_DECK_DAYS 14 via POST /api/ops/runs —
          day 14 yields 0% (inclusive free boundary), day 21 yields 3%; different
          metric and endpoint than the sibling's moisture gate.
        test_recipe:
          setup: ["One load scaled 100 mbf and decked at the default clock 2026-08-01T00:00:00Z"]
          setup_api_calls:
            - { call: "POST /api/log-loads", payload: { supplier_name: "Olympic Log Co", species: DOUGLAS_FIR, log_grade: SAWLOG_1 }, as: Scaler, captures: { load_id: $.data.id } }
            - { call: "POST /api/log-loads/${load_id}/scale", payload: { scaled_mbf: 100, price_per_mbf_cents: 25000 }, as: Scaler }
            - { call: "POST /api/log-loads/${load_id}/deck", payload: {}, as: Scaler }
          trigger:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T00:00:00Z" }, as: MillManager }
            - { call: "POST /api/ops/runs", payload: {}, as: MillManager }
            - { call: "GET /api/log-loads/${load_id}", payload: {}, as: Scaler, captures: { d14: $.data.degrade_pct, eff14: $.data.effective_mbf, days14: $.data.days_in_deck } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-22T00:00:00Z" }, as: MillManager }
            - { call: "POST /api/ops/runs", payload: {}, as: MillManager }
            - { call: "GET /api/log-loads/${load_id}", payload: {}, as: Scaler, captures: { d21: $.data.degrade_pct, eff21: $.data.effective_mbf } }
          assert:
            - "days14 == 14 and d14 == 0 (14 <= FREE_DECK_DAYS 14 — inclusive boundary stays free)"
            - "d21 == 3 (floor((21-14)/7)=1 degrade week x 3%)"
            - "eff14 == 100.0 and eff21 == 97.0 (round(100*(1-3/100), 3))"

      - name: moisture_gate_exactly_at_tolerance
        grounds:
          - calculations.moisture_pass_gate
          - state_machines.LumberPackage.IN_KILN_to_DRY
        distinguishing_aspect: |
          Metric: exit_moisture_pct against target+tolerance via
          POST /api/kiln-charges/{id}/complete — 17.0 passes (inclusive), 17.1
          fails; different metric and endpoint than the sibling's deck-age gate.
        test_recipe:
          setup: ["One IN_PROGRESS KILN_1 charge (target 15.0) holding two DF packages p1, p2; clock at scheduled_end 2026-08-05"]
          setup_api_calls:
            - { call: "POST /api/log-loads", payload: { supplier_name: "Olympic Log Co", species: DOUGLAS_FIR, log_grade: SAWLOG_1 }, as: Scaler, captures: { load_id: $.data.id } }
            - { call: "POST /api/log-loads/${load_id}/scale", payload: { scaled_mbf: 100, price_per_mbf_cents: 25000 }, as: Scaler }
            - { call: "POST /api/log-loads/${load_id}/deck", payload: {}, as: Scaler }
            - { call: "POST /api/sawing-runs", payload: { saw_line: LINE_A, scheduled_date: "2026-08-02", sawing_pattern: DIMENSION_2X4, log_load_ids: ["${load_id}"] }, as: Sawyer, captures: { run_id: $.data.id } }
            - { call: "POST /api/sawing-runs/${run_id}/complete", payload: { packages: [ { species: DOUGLAS_FIR, dimension: 2X4, length_ft: 12, pieces: 100, green_mbf: 20.0 }, { species: DOUGLAS_FIR, dimension: 2X4, length_ft: 12, pieces: 100, green_mbf: 20.0 } ], chip_tons: 5, sawdust_tons: 2, bark_tons: 2 }, as: Sawyer }
            - { call: "GET /api/lumber-packages", payload: { sawing_run_id: "${run_id}" }, as: Sawyer, captures: { p1: "$.data[0].id", p2: "$.data[1].id" } }
            - { call: "POST /api/kiln-charges", payload: { chamber: KILN_1, species: DOUGLAS_FIR, package_ids: ["${p1}", "${p2}"], scheduled_start: "2026-08-02T00:00:00Z", scheduled_end: "2026-08-05T00:00:00Z", target_moisture_pct: 15.0 }, as: KilnOperator, captures: { charge_id: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T00:00:00Z" }, as: MillManager }
            - { call: "POST /api/kiln-charges/${charge_id}/start", payload: {}, as: KilnOperator }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T00:00:00Z" }, as: MillManager }
          trigger:
            - { call: "POST /api/kiln-charges/${charge_id}/complete", payload: { readings: [ { package_id: "${p1}", exit_moisture_pct: 17.0, measured_dry_mbf: 18.8 }, { package_id: "${p2}", exit_moisture_pct: 17.1, measured_dry_mbf: 18.8 } ] }, as: KilnOperator, captures: { ch_st: $.data.status } }
            - { call: "GET /api/lumber-packages/${p1}", payload: {}, as: KilnOperator, captures: { s1: $.data.status, d1: $.data.dry_mbf } }
            - { call: "GET /api/lumber-packages/${p2}", payload: {}, as: KilnOperator, captures: { s2: $.data.status, c2: $.data.kiln_charge_id } }
          assert:
            - "s1 == DRY and d1 == 18.8 (17.0 <= 15.0 + 2.0 — inclusive tolerance passes)"
            - "s2 == GREEN and c2 == null (17.1 > 17.0 fails; released for rework, actual_dry_mbf not set)"
            - "ch_st == COMPLETED"

  # ---------------------------------------------------------------- Rule 7 ---
  - rule_id: cross_entity_state_dependency
    instances:
      - name: charge_creation_gated_on_package_green
        grounds:
          - state_machines.LumberPackage.GREEN_to_IN_KILN
          - validations[priority=5]
        distinguishing_aspect: |
          Pair KilnCharge -> LumberPackage: a package already IN_KILN in another
          charge cannot join a new charge — different entity pair than the
          sibling's SalesOrder -> SalesContract dependency.
        test_recipe:
          setup: ["DF package p is IN_KILN in charge A (KILN_1, 08-02..08-05)"]
          setup_api_calls:
            - { call: "POST /api/log-loads", payload: { supplier_name: "Olympic Log Co", species: DOUGLAS_FIR, log_grade: SAWLOG_1 }, as: Scaler, captures: { load_id: $.data.id } }
            - { call: "POST /api/log-loads/${load_id}/scale", payload: { scaled_mbf: 100, price_per_mbf_cents: 25000 }, as: Scaler }
            - { call: "POST /api/log-loads/${load_id}/deck", payload: {}, as: Scaler }
            - { call: "POST /api/sawing-runs", payload: { saw_line: LINE_A, scheduled_date: "2026-08-02", sawing_pattern: DIMENSION_2X4, log_load_ids: ["${load_id}"] }, as: Sawyer, captures: { run_id: $.data.id } }
            - { call: "POST /api/sawing-runs/${run_id}/complete", payload: { packages: [ { species: DOUGLAS_FIR, dimension: 2X4, length_ft: 12, pieces: 100, green_mbf: 20.0 } ], chip_tons: 5, sawdust_tons: 2, bark_tons: 2 }, as: Sawyer }
            - { call: "GET /api/lumber-packages", payload: { sawing_run_id: "${run_id}" }, as: Sawyer, captures: { pkg: "$.data[0].id" } }
            - { call: "POST /api/kiln-charges", payload: { chamber: KILN_1, species: DOUGLAS_FIR, package_ids: ["${pkg}"], scheduled_start: "2026-08-02T00:00:00Z", scheduled_end: "2026-08-05T00:00:00Z", target_moisture_pct: 15.0 }, as: KilnOperator, captures: { charge_a: $.data.id } }
          trigger:
            - { call: "POST /api/kiln-charges", payload: { chamber: KILN_2, species: DOUGLAS_FIR, package_ids: ["${pkg}"], scheduled_start: "2026-08-02T00:00:00Z", scheduled_end: "2026-08-05T00:00:00Z", target_moisture_pct: 15.0 }, as: KilnOperator, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_STATE (package ${pkg} is IN_KILN, not GREEN)"
            - "KilnCharge.${charge_a}.status == SCHEDULED and package still attached to charge A only"

      - name: order_placement_gated_on_contract_active
        grounds:
          - state_machines.SalesContract.DRAFT_to_ACTIVE
          - validations[priority=5]
          - errors[ERR_CONTRACT_NOT_ACTIVE]
        distinguishing_aspect: |
          Pair SalesOrder -> SalesContract: placement against a DRAFT contract is
          rejected with ERR_CONTRACT_NOT_ACTIVE — different entity pair than the
          sibling's KilnCharge -> LumberPackage dependency.
        test_recipe:
          setup: ["Contract for DF NO_2 exists but stays DRAFT (never activated)"]
          setup_api_calls:
            - { call: "POST /api/sales-contracts", payload: { customer_name: "Acme Builders", species: DOUGLAS_FIR, grade: NO_2, committed_mbf: 100, contract_price_per_mbf_cents: 60000, start_date: "2026-08-01", end_date: "2026-09-01" }, as: MillManager, captures: { cid: $.data.id } }
          trigger:
            - { call: "POST /api/sales-orders", payload: { customer_name: "Acme Builders", contract_id: "${cid}", species: DOUGLAS_FIR, grade: NO_2, length_spec: 12, volume_mbf: 5 }, as: SalesRep, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_CONTRACT_NOT_ACTIVE"
            - "SalesContract.${cid}.reserved_mbf == 0 (no drawdown recorded)"

  # ---------------------------------------------------------------- Rule 8 ---
  - rule_id: resource_temporal_overlap
    instances:
      - name: kiln_charge_overlap_turnaround_buffer
        grounds:
          - validations[priority=7]
          - entities.KilnCharge.fields.chamber
          - errors[ERR_KILN_OVERLAP]
        distinguishing_aspect: |
          Resource KilnCharge.chamber with half-open [start, end) intervals plus a
          4-hour turnaround buffer — adjacency at exactly end+4h is allowed while
          end+2h is rejected; different resource and interval semantics than the
          sibling's whole-calendar-day saw-line booking.
        test_recipe:
          setup: ["Three GREEN DF packages p1, p2, p3 from one completed run; clock at default 2026-08-01"]
          setup_api_calls:
            - { call: "POST /api/log-loads", payload: { supplier_name: "Olympic Log Co", species: DOUGLAS_FIR, log_grade: SAWLOG_1 }, as: Scaler, captures: { load_id: $.data.id } }
            - { call: "POST /api/log-loads/${load_id}/scale", payload: { scaled_mbf: 300, price_per_mbf_cents: 25000 }, as: Scaler }
            - { call: "POST /api/log-loads/${load_id}/deck", payload: {}, as: Scaler }
            - { call: "POST /api/sawing-runs", payload: { saw_line: LINE_A, scheduled_date: "2026-08-02", sawing_pattern: DIMENSION_2X4, log_load_ids: ["${load_id}"] }, as: Sawyer, captures: { run_id: $.data.id } }
            - { call: "POST /api/sawing-runs/${run_id}/complete", payload: { packages: [ { species: DOUGLAS_FIR, dimension: 2X4, length_ft: 12, pieces: 100, green_mbf: 20.0 }, { species: DOUGLAS_FIR, dimension: 2X4, length_ft: 12, pieces: 100, green_mbf: 20.0 }, { species: DOUGLAS_FIR, dimension: 2X4, length_ft: 12, pieces: 100, green_mbf: 20.0 } ], chip_tons: 5, sawdust_tons: 2, bark_tons: 2 }, as: Sawyer }
            - { call: "GET /api/lumber-packages", payload: { sawing_run_id: "${run_id}" }, as: Sawyer, captures: { p1: "$.data[0].id", p2: "$.data[1].id", p3: "$.data[2].id" } }
          trigger:
            - { call: "POST /api/kiln-charges", payload: { chamber: KILN_1, species: DOUGLAS_FIR, package_ids: ["${p1}"], scheduled_start: "2026-08-02T00:00:00Z", scheduled_end: "2026-08-04T00:00:00Z", target_moisture_pct: 15.0 }, as: KilnOperator, captures: { charge_a: $.data.id } }
            - { call: "POST /api/kiln-charges", payload: { chamber: KILN_1, species: DOUGLAS_FIR, package_ids: ["${p2}"], scheduled_start: "2026-08-04T02:00:00Z", scheduled_end: "2026-08-06T00:00:00Z", target_moisture_pct: 15.0 }, as: KilnOperator, captures: { err: $.data.error_id } }
            - { call: "POST /api/kiln-charges", payload: { chamber: KILN_1, species: DOUGLAS_FIR, package_ids: ["${p3}"], scheduled_start: "2026-08-04T04:00:00Z", scheduled_end: "2026-08-06T04:00:00Z", target_moisture_pct: 15.0 }, as: KilnOperator, captures: { charge_c: $.data.id } }
          assert:
            - "charge A created (SCHEDULED) holding p1"
            - "err == ERR_KILN_OVERLAP (start 2h after A's end violates the 4h turnaround buffer)"
            - "charge_c created: start exactly end+4h satisfies the strict-inequality buffer"
            - "LumberPackage.${p2}.status == GREEN (rejected charge left no side effects) and .${p3}.status == IN_KILN"

      - name: saw_line_daily_booking_adjacency
        grounds:
          - validations[priority=7]
          - entities.SawingRun.fields.saw_line
          - errors[ERR_SAW_LINE_BOOKED]
        distinguishing_aspect: |
          Resource SawingRun.saw_line with whole-calendar-day closed occupation —
          the same line on the same date conflicts but the adjacent calendar day is
          free with zero buffer; different resource and interval semantics than the
          sibling's half-open kiln intervals with a 4h buffer.
        test_recipe:
          setup: ["Three DECKED loads L1, L2, L3 (100 mbf each)"]
          setup_api_calls:
            - { call: "POST /api/log-loads", payload: { supplier_name: "Olympic Log Co", species: DOUGLAS_FIR, log_grade: SAWLOG_1 }, as: Scaler, captures: { l1: $.data.id } }
            - { call: "POST /api/log-loads/${l1}/scale", payload: { scaled_mbf: 100, price_per_mbf_cents: 25000 }, as: Scaler }
            - { call: "POST /api/log-loads/${l1}/deck", payload: {}, as: Scaler }
            - { call: "POST /api/log-loads", payload: { supplier_name: "Olympic Log Co", species: DOUGLAS_FIR, log_grade: SAWLOG_1 }, as: Scaler, captures: { l2: $.data.id } }
            - { call: "POST /api/log-loads/${l2}/scale", payload: { scaled_mbf: 100, price_per_mbf_cents: 25000 }, as: Scaler }
            - { call: "POST /api/log-loads/${l2}/deck", payload: {}, as: Scaler }
            - { call: "POST /api/log-loads", payload: { supplier_name: "Olympic Log Co", species: DOUGLAS_FIR, log_grade: SAWLOG_1 }, as: Scaler, captures: { l3: $.data.id } }
            - { call: "POST /api/log-loads/${l3}/scale", payload: { scaled_mbf: 100, price_per_mbf_cents: 25000 }, as: Scaler }
            - { call: "POST /api/log-loads/${l3}/deck", payload: {}, as: Scaler }
          trigger:
            - { call: "POST /api/sawing-runs", payload: { saw_line: LINE_A, scheduled_date: "2026-08-05", sawing_pattern: DIMENSION_2X4, log_load_ids: ["${l1}"] }, as: Sawyer, captures: { r1: $.data.id } }
            - { call: "POST /api/sawing-runs", payload: { saw_line: LINE_A, scheduled_date: "2026-08-05", sawing_pattern: STUD_MIX, log_load_ids: ["${l2}"] }, as: Sawyer, captures: { err: $.data.error_id } }
            - { call: "POST /api/sawing-runs", payload: { saw_line: LINE_A, scheduled_date: "2026-08-06", sawing_pattern: STUD_MIX, log_load_ids: ["${l2}"] }, as: Sawyer, captures: { r3: $.data.id } }
          assert:
            - "err == ERR_SAW_LINE_BOOKED (same line, same calendar date)"
            - "r3 created for 2026-08-06 (adjacent calendar day needs no buffer)"
            - "LogLoad.${l2}.sawing_run_id == r3 (attached to the successful run only)"

  # ---------------------------------------------------------------- Rule 9 ---
  - rule_id: compensating_invariant
    instances:
      - name: deck_undeck_occupancy_conservation
        grounds:
          - state_machines.LogLoad.SCALED_to_DECKED
          - state_machines.LogLoad.DECKED_to_SCALED
          - validations[priority=7]
        distinguishing_aspect: |
          Conserved quantity: deck occupancy sum(scaled_mbf of DECKED loads) —
          deck(L1) + undeck(L1) returns it to exactly its prior value, provable by
          the at-capacity boundary (500 <= 500 admitted) — different conserved
          quantity than the sibling's allocated lumber volume.
        test_recipe:
          setup: ["L1 scaled 100 and DECKED (occupancy 100); L2 scaled 500, still SCALED"]
          setup_api_calls:
            - { call: "POST /api/log-loads", payload: { supplier_name: "Olympic Log Co", species: DOUGLAS_FIR, log_grade: SAWLOG_1 }, as: Scaler, captures: { l1: $.data.id } }
            - { call: "POST /api/log-loads/${l1}/scale", payload: { scaled_mbf: 100, price_per_mbf_cents: 25000 }, as: Scaler }
            - { call: "POST /api/log-loads/${l1}/deck", payload: {}, as: Scaler }
            - { call: "POST /api/log-loads", payload: { supplier_name: "Cedar Rim LLC", species: DOUGLAS_FIR, log_grade: SAWLOG_2 }, as: Scaler, captures: { l2: $.data.id } }
            - { call: "POST /api/log-loads/${l2}/scale", payload: { scaled_mbf: 500, price_per_mbf_cents: 22000 }, as: Scaler }
          trigger:
            - { call: "POST /api/log-loads/${l2}/deck", payload: {}, as: Scaler, captures: { err: $.data.error_id } }
            - { call: "POST /api/log-loads/${l1}/undeck", payload: {}, as: Scaler, captures: { l1_st: $.data.status } }
            - { call: "POST /api/log-loads/${l2}/deck", payload: {}, as: Scaler, captures: { l2_st: $.data.status } }
          assert:
            - "err == ERR_DECK_CAPACITY_EXCEEDED (100 + 500 > 500)"
            - "l1_st == SCALED with decked_at null and degrade_pct 0 (compensating undo is clean)"
            - "l2_st == DECKED (occupancy 500 <= 500: at-capacity admitted)"
            - "invariant: sum(scaled_mbf of DECKED loads) after deck(L1)+undeck(L1) equals its pre-pair value 0"

      - name: allocate_cancel_allocation_conservation
        grounds:
          - state_machines.SalesOrder.PLACED_to_ALLOCATED
          - state_machines.SalesOrder.ALLOCATED_to_CANCELLED
          - state_machines.LumberPackage.ALLOCATED_to_STAMPED
        distinguishing_aspect: |
          Conserved quantity: mill-wide allocated lumber volume sum(dry_mbf of
          ALLOCATED packages) — allocate + cancel returns it to 0 with both
          packages STAMPED again — different conserved quantity than the sibling's
          deck occupancy.
        test_recipe:
          setup:
            - "Effective DF NO_2 price list 60000; two STAMPED DF NO_2 len-12 packages each measured dry_mbf 3.333"
          setup_api_calls:
            - { call: "POST /api/price-lists", payload: { species: DOUGLAS_FIR, grade: NO_2, base_price_per_mbf_cents: 60000, effective_from: "2026-07-01T00:00:00Z" }, as: MillManager }
            - { call: "POST /api/log-loads", payload: { supplier_name: "Olympic Log Co", species: DOUGLAS_FIR, log_grade: SAWLOG_1 }, as: Scaler, captures: { load_id: $.data.id } }
            - { call: "POST /api/log-loads/${load_id}/scale", payload: { scaled_mbf: 100, price_per_mbf_cents: 25000 }, as: Scaler }
            - { call: "POST /api/log-loads/${load_id}/deck", payload: {}, as: Scaler }
            - { call: "POST /api/sawing-runs", payload: { saw_line: LINE_A, scheduled_date: "2026-08-02", sawing_pattern: DIMENSION_2X4, log_load_ids: ["${load_id}"] }, as: Sawyer, captures: { run_id: $.data.id } }
            - { call: "POST /api/sawing-runs/${run_id}/complete", payload: { packages: [ { species: DOUGLAS_FIR, dimension: 2X4, length_ft: 12, pieces: 30, green_mbf: 3.5 }, { species: DOUGLAS_FIR, dimension: 2X4, length_ft: 12, pieces: 30, green_mbf: 3.5 } ], chip_tons: 5, sawdust_tons: 2, bark_tons: 2 }, as: Sawyer }
            - { call: "GET /api/lumber-packages", payload: { sawing_run_id: "${run_id}" }, as: Sawyer, captures: { p1: "$.data[0].id", p2: "$.data[1].id" } }
            - { call: "POST /api/kiln-charges", payload: { chamber: KILN_1, species: DOUGLAS_FIR, package_ids: ["${p1}", "${p2}"], scheduled_start: "2026-08-02T00:00:00Z", scheduled_end: "2026-08-05T00:00:00Z", target_moisture_pct: 15.0 }, as: KilnOperator, captures: { charge_id: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T00:00:00Z" }, as: MillManager }
            - { call: "POST /api/kiln-charges/${charge_id}/start", payload: {}, as: KilnOperator }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T00:00:00Z" }, as: MillManager }
            - { call: "POST /api/kiln-charges/${charge_id}/complete", payload: { readings: [ { package_id: "${p1}", exit_moisture_pct: 12.0, measured_dry_mbf: 3.333 }, { package_id: "${p2}", exit_moisture_pct: 12.0, measured_dry_mbf: 3.333 } ] }, as: KilnOperator }
            - { call: "POST /api/lumber-packages/${p1}/grade-inspections", payload: { inspector_grade: NO_2, action: STAMP }, as: Grader }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T01:00:00Z" }, as: MillManager }
            - { call: "POST /api/lumber-packages/${p2}/grade-inspections", payload: { inspector_grade: NO_2, action: STAMP }, as: Grader }
          trigger:
            - { call: "POST /api/sales-orders", payload: { customer_name: "Spot Buyer", species: DOUGLAS_FIR, grade: NO_2, length_spec: 12, volume_mbf: 6 }, as: SalesRep, captures: { oid: $.data.id } }
            - { call: "POST /api/sales-orders/${oid}/allocate", payload: {}, as: SalesRep, captures: { a1: $.data.allocated_mbf } }
            - { call: "POST /api/sales-orders/${oid}/cancel", payload: {}, as: SalesRep, captures: { a2: $.data.allocated_mbf, o_st: $.data.status, t2: $.data.total_cents } }
            - { call: "GET /api/lumber-packages/${p1}", payload: {}, as: SalesRep, captures: { s1: $.data.status, o1: $.data.sales_order_id } }
            - { call: "GET /api/lumber-packages/${p2}", payload: {}, as: SalesRep, captures: { s2: $.data.status, o2: $.data.sales_order_id } }
          assert:
            - "a1 == 6.666 (both packages allocated: 3.333 + 3.333)"
            - "after cancel: a2 == 0, t2 == 0, o_st == CANCELLED"
            - "s1 == STAMPED and s2 == STAMPED with o1 == null and o2 == null (full release)"
            - "invariant: sum(dry_mbf of ALLOCATED packages) 0 -> 6.666 -> 0; allocate+cancel conserves the mill-wide allocated volume"
