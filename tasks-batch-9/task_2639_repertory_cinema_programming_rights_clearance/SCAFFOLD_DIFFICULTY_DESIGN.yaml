            - "TicketOrder.${o1_id}.facility_fee_cents == 450."
            - "TicketOrder.${o1_id}.applied_credit_cents == 0 and TicketOrder.${o1_id}.total_cents == 4149, NOT 4148."
            - "TicketOrder.${o1_id}.status == RESERVED and Showtime.${sa_id}.seats_sold == 3 and Showtime.${sa_id}.seats_available == 5."

      - name: min_run_penalty_daily_nut_circular_resolution_order
        grounds:
          - calculations.booking_min_run_compliance
          - entities.Booking.fields.min_run_penalty_cents
          - entities.Booking.fields.actual_playing_days
          - entities.Booking.fields.min_run_compliant
          - state_machines.Booking.RUNNING_to_CLOSED
          - endpoints[POST /bookings/{id}/close]
        distinguishing_aspect: |
          Mode (c): the dependency graph LOOKS circular - the penalty needs a daily nut, the daily nut
          needs the prorated nut, and the prorated nut needs the very playing-day count that defines
          the shortfall - and the eight-step order plus MIN_PRORATION_FLOOR 0.60 is what makes it
          well-defined. With min_run_days 4 and only 2 distinct COMPLETED dates the floor binds:
          factor 0.60 -> nut 7500 -> daily 3750 -> penalty 3750. The forbidden shortcut
          daily = round_half_up(12500 / 4) = 3125 yields 3125 instead.
        test_recipe:
          setup:
            - "Canonical venue / distributor / title(104 min) / CONFIRMED booking (house_nut 12500, min_run_days 4) / CLEARED clearance / DCP asset."
            - "Three showtimes on three distinct dates: 2026-08-14, 2026-08-15 and 2026-08-16. Only the first two are COMPLETED; the third is CANCELLED so it contributes no playing day."
            - "No tickets are sold, so the penalty is driven purely by the day count."
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "Reel Repertory", seat_capacity: 12, house_hold_seats: 4, trailer_reel_minutes: 12, turnaround_minutes: 25, min_useful_gap_minutes: 45, dcp_ingest_lane_count: 2, open_local_time: "11:00", last_start_local_time: "22:00", utc_offset_minutes: 0, max_first_run_share: 0.60, weekly_repertory_target: 3, supported_formats: ["DCP_2K", "DCP_4K"], base_house_nut_weekly_cents: 200000 }
              as: ExecutiveDirector
              captures: { v_id: $.data.id }
            - call: "POST /distributors"
              payload: { name: "Coyote Films", contact_email: "book@coyote.example", default_terms_variant: "SLIDING_SCALE_90_10", default_min_run_days: 4, default_distributor_share_pct: 0.35, requires_advance_guarantee: false }
              as: Programmer
              captures: { d_id: $.data.id }
            - call: "POST /titles"
              payload: { title_name: "La Jetee Redux", release_year: 1962, runtime_minutes: 104, is_first_run: false, native_format: "DCP_2K", rights_holder_distributor_id: "${d_id}" }
              as: Programmer
              captures: { t1_id: $.data.id }
            - call: "POST /bookings"
              payload: { title_id: "${t1_id}", distributor_id: "${d_id}", venue_id: "${v_id}", terms_variant: "SLIDING_SCALE_90_10", house_nut_cents: 12500, distributor_share_pct: 0.35, guarantee_cents: 3000, min_run_days: 4, engagement_start_date: "2026-08-10", engagement_end_date: "2026-08-20" }
              as: Programmer
              captures: { b_id: $.data.id }
            - call: "POST /bookings/${b_id}/confirm"
              payload: {}
              as: ExecutiveDirector
              as_user_id: "u-ed-1"
            - call: "POST /clearances"
              payload: { title_id: "${t1_id}", booking_id: "${b_id}", licensor_name: "Cinematheque Nord", license_fee_cents: 45000, territory: "US-NY-METRO", window_start_date: "2026-08-10", window_end_date: "2026-08-20", max_screenings: 6, source_format: "DCP_2K" }
              as: RightsManager
              as_user_id: "u-rm-1"
              captures: { c_id: $.data.id }
            - call: "POST /clearances/${c_id}/clear"
              payload: {}
              as: RightsManager
