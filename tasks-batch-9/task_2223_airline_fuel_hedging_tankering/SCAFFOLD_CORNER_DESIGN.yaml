            - "Trigger call 2: len(data) == 0 and meta.total_count == 0."
            - "Trigger call 3: HTTP 201, data.instrument_type == \"SWAP\", data.delta_factor == 1.00, data.delta_adjusted_gallons == 1000000.00, data.trade_status == \"PROPOSED\", data.accounting_status == \"UNDESIGNATED\"."

      - name: concentration_breach_needs_approved_exception_before_execute_succeeds
        claim_type: conditional_validation
        grounds:
          - validations[priority=21]
          - errors[ERR_EXCEPTION_REQUIRED]
          - calculations.counterparty_concentration_share_pct
          - entities.PolicyException.fields.reason_code
          - entities.HedgePolicy.fields.open_exception_count
        distinguishing_aspect: |
          The same /execute call flips from 422 to 200 with no change to the trade:
          post-trade share 22.73 exceeds max_single_counterparty_pct 20.00, and only
          an APPROVED PolicyException with reason_code COUNTERPARTY_CONCENTRATION
          naming this instrument clears it. A REQUESTED exception is not enough, and
          the waiver's own lifecycle moves HedgePolicy.open_exception_count 0 -> 1 -> 0.
        test_recipe:
          setup:
            - "One ACTIVE HedgePolicy with max_single_counterparty_pct 20.00 and max_coverage_pct 60.00."
