        claim_type: aggregate_validation
        grounds:
          - validations.priority_17_ERR_REALM_CAPACITY_EXCEEDED
          - global_constants.MAX_OVERLAPPING_REALM_BINDINGS
        excluded_because:
          difficulty_instance: resource_temporal_overlap / fourth_overlapping_binding_on_one_realm_exceeds_realm_capacity
          rationale: "Three individually legal bindings plus an illegal fourth are asserted there."
