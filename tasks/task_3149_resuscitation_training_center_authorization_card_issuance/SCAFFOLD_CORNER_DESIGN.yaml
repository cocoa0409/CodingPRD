  # ===========================================================================
  - section: errors
    instances:

      - name: duplicate_active_alignment_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=6]
          - errors.ERR_DUPLICATE_ACTIVE_ALIGNMENT
        distinguishing_aspect: "A second ACTIVE alignment for the same (training_center_id, instructor_id) pair is rejected with 409 ERR_DUPLICATE_ACTIVE_ALIGNMENT; after ending the first alignment the same create succeeds."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Center plus one legacy-certified instructor holding one ACTIVE alignment."
          setup_api_calls:
            - *c_clock
            - *c_center
            - *c_faculty
            - *c_grant
            - &c_falign_cap
              call: "POST /aha/training-centers/${center_id}/alignments"
              payload: { instructor_id: "${faculty_id}", as_faculty: true }
              as: TCAdmin
              captures: { align_id: $.data.id }
          trigger:
            - call: "POST /aha/training-centers/${center_id}/alignments"
              payload: { instructor_id: "${faculty_id}", as_faculty: false }
              as: TCAdmin
              captures: { err_dup: $.data.error_id }
            - call: "POST /aha/alignments/${align_id}/end"
              payload: {}
              as: TCAdmin
            - call: "POST /aha/training-centers/${center_id}/alignments"
              payload: { instructor_id: "${faculty_id}", as_faculty: false }
              as: TCAdmin
              captures: { align2_id: $.data.id }
          assert:
            - "the duplicate create returns 409 and err_dup == ERR_DUPLICATE_ACTIVE_ALIGNMENT"
            - "after ending the first alignment the create returns 201"
            - "GET /aha/instructors/${faculty_id}/alignments returns 2 rows: one ENDED, one ACTIVE"

      - name: faculty_self_monitoring_is_forbidden
        claim_type: violation_to_error
        grounds:
          - validations[priority=5]
          - errors.ERR_SELF_EVALUATION_FORBIDDEN
          - complexity_profile.role_model
        distinguishing_aspect: "Segregation of duties: an EXPIRED-but-still-faculty instructor re-entering the candidate pathway may not monitor themself — the call with as_user_id equal to the target instructor fails with 403 ERR_SELF_EVALUATION_FORBIDDEN."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Legacy-certified faculty instructor created; clock advanced past renewal_due_at so the sweep moves them CERTIFIED -> EXPIRED; candidacy reset so they are CANDIDATE with is_faculty still true."
          setup_api_calls:
            - *c_clock
            - *c_center
            - *c_faculty
            - *c_grant
            - call: "POST /aha/_clock/set_current_utc"
              payload: { to_iso8601: "2028-12-15T00:00:00Z" }
              as: NationalAdmin
            - call: "POST /aha/instructors/${faculty_id}/reset-candidacy"
              payload: {}
              as: TCAdmin
              captures: { cand_status: $.data.status }
          trigger:
            - call: "POST /aha/instructors/${faculty_id}/monitor"
              payload: { monitored_at: "2028-12-20T00:00:00Z", course_type_observed: "BLS_PROVIDER", outcome: "SATISFACTORY" }
              as: TrainingFaculty
              as_user_id: "${faculty_id}"
              captures: { err_self: $.data.error_id }
          assert:
            - "cand_status == CANDIDATE"
            - "the trigger returns 403 and err_self == ERR_SELF_EVALUATION_FORBIDDEN"
            - "GET /aha/instructors/${faculty_id}/monitorings returns 0 rows"

      - name: prior_card_holder_mismatch_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=8]
          - errors.ERR_PRIOR_CARD_HOLDER_MISMATCH
        distinguishing_aspect: "Renewal referential integrity: a roster entry carrying a prior_card_id whose holder_email differs from the student_email is rejected with 409 ERR_PRIOR_CARD_HOLDER_MISMATCH and no seat is consumed."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Full base chain; a completed session issued a card to sam@x.example; a second SCHEDULED session has an open roster."
          setup_api_calls:
            - *c_clock
            - *c_center
            - *c_faculty
            - *c_grant
            - *c_falign
            - *c_cv
            - *c_site
            - *c_align
            - *c_activate
            - *c_gva
            - *c_lead
            - *c_lalign
            - *c_s1
            - call: "POST /aha/course-sessions/${c_s1_id}/roster"
              payload: { student_name: "Sam Student", student_email: "sam@x.example" }
              as: TCCoordinator
              captures: { entry_id: $.data.id }
            - call: "POST /aha/course-sessions/${c_s1_id}/start"
              payload: {}
              as: TCCoordinator
            - call: "POST /aha/roster-entries/${entry_id}/skills-evaluations"
              payload: { items: [{ item_code: "SCENE", critical: true, passed: true }] }
              as: Instructor
              as_user_id: "${cand_id}"
            - call: "POST /aha/course-sessions/${c_s1_id}/complete"
              payload: {}
              as: Instructor
              as_user_id: "${cand_id}"
            - call: "GET /aha/roster-entries/${entry_id}/cards"
              payload: {}
              as: TCAdmin
              captures: { card_id: $.data.0.id }
            - call: "POST /aha/course-sessions"
              payload: { training_center_id: "${center_id}", site_id: "${site_id}", primary_instructor_id: "${cand_id}", guidelines_version_id: "${gv_id}", course_type: "BLS_PROVIDER", delivery_format: "CLASSROOM", start_at: "2026-10-11T14:00:00Z", end_at: "2026-10-11T18:00:00Z", capacity: 6, manikin_count: 2, aed_trainer_count: 1, assisting_instructor_count: 0 }
              as: TCCoordinator
              captures: { s2_id: $.data.id, s2_seats: $.data.seats_available }
          trigger:
            - call: "POST /aha/course-sessions/${s2_id}/roster"
              payload: { student_name: "Rita Rescuer", student_email: "rita@x.example", prior_card_id: "${card_id}" }
              as: TCCoordinator
              captures: { err_holder: $.data.error_id }
          assert:
            - "the trigger returns 409 and err_holder == ERR_PRIOR_CARD_HOLDER_MISMATCH"
            - "CourseSession.${s2_id}.seats_available == 6 (no seat consumed)"
            - "GET /aha/course-sessions/${s2_id}/roster returns 0 rows"

      - name: remediation_third_attempt_exceeds_limit
        claim_type: violation_to_error
        grounds:
          - validations[priority=8]
          - errors.ERR_REMEDIATION_LIMIT_EXCEEDED
        distinguishing_aspect: "Attempt cap: after a REMEDIATION_REQUIRED first attempt and a failing retest (entry FAILED), a third evaluation POST is rejected with 409 ERR_REMEDIATION_LIMIT_EXCEEDED."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Full base chain; session IN_PROGRESS; one roster entry with a failed critical item on attempt 1 (REMEDIATION_REQUIRED) and a failing retest on attempt 2 (entry FAILED)."
          setup_api_calls:
            - *c_clock
            - *c_center
            - *c_faculty
            - *c_grant
            - *c_falign
            - *c_cv
            - *c_site
            - *c_align
            - *c_activate
            - *c_gva
            - *c_lead
            - *c_lalign
            - *c_s1
            - call: "POST /aha/course-sessions/${c_s1_id}/roster"
              payload: { student_name: "Sam Student", student_email: "sam@x.example" }
              as: TCCoordinator
              captures: { entry_id: $.data.id }
            - call: "POST /aha/course-sessions/${c_s1_id}/start"
              payload: {}
              as: TCCoordinator
            - call: "POST /aha/roster-entries/${entry_id}/skills-evaluations"
              payload: { items: [{ item_code: "SCENE", critical: true, passed: false }, { item_code: "COMP", critical: false, passed: true }] }
              as: Instructor
              as_user_id: "${cand_id}"
              captures: { att1_outcome: $.data.outcome }
            - call: "POST /aha/roster-entries/${entry_id}/skills-evaluations"
              payload: { items: [{ item_code: "SCENE", critical: true, passed: false }, { item_code: "COMP", critical: false, passed: true }] }
              as: Instructor
              as_user_id: "${cand_id}"
              captures: { att2_outcome: $.data.outcome }
          trigger:
            - call: "POST /aha/roster-entries/${entry_id}/skills-evaluations"
              payload: { items: [{ item_code: "SCENE", critical: true, passed: true }, { item_code: "COMP", critical: false, passed: true }] }
              as: Instructor
              as_user_id: "${cand_id}"
              captures: { err_limit: $.data.error_id }
          assert:
            - "att1_outcome == REMEDIATION_REQUIRED (a failed critical item cannot PASS regardless of percentage)"
            - "att2_outcome == FAIL and RosterEntry.${entry_id}.status == FAILED"
            - "the third attempt returns 409 and err_limit == ERR_REMEDIATION_LIMIT_EXCEEDED"
            - "GET /aha/roster-entries/${entry_id}/skills-evaluations returns exactly 2 rows"

  # ===========================================================================
  - section: rbac
    instances:

      - name: coordinator_cannot_create_site_returns_forbidden
        claim_type: rbac_denial
        grounds:
          - roles.TCCoordinator
          - roles.TCAdmin.exclusive_operations
          - errors.ERR_INSUFFICIENT_PERMISSIONS
        distinguishing_aspect: "Site creation is exclusive to TCAdmin; the peer role TCCoordinator gets 403 ERR_INSUFFICIENT_PERMISSIONS and no site is persisted."
        test_recipe:
