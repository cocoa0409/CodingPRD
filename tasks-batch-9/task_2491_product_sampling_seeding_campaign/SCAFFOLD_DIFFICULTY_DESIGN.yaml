# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# task_2491_product_sampling_seeding_campaign
#
# Nine §0.5 rule_ids x 2 differentiated instances = 18 instances.
# Every literal in every `assert:` line was produced by executing the relevant
# §1.3 formula against the pinned setup inputs.
#
# Fixed actor ids used across instances (opaque roles, X-User-ID header):
#   MOD_A = 11111111-1111-4111-8111-111111111111   (ComplianceModerator A)
#   MOD_B = 22222222-2222-4222-8222-222222222222   (ComplianceModerator B)
# The logical clock starts at 2026-08-01T00:00:00Z; every instance sets it
# explicitly anyway so no assertion depends on the startup default.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: cost_per_sample_provisional_vs_final_on_campaign
        grounds:
          - calculations.cost_per_sample
          - calculations.kit_assembly_unit_cost
          - entities.Campaign.fields.cost_per_sample_provisional_cents
          - entities.Campaign.fields.cost_per_sample_final_cents
          - state_machines.SampleShipment.SHIPPED_to_DELIVERED
          - state_machines.SampleShipment.SHIPPED_to_LOST
        distinguishing_aspect: |
          This dual variant lives in the COST-ACCOUNTING domain on Campaign: the identical two-shipment
          set yields cost_per_sample_provisional_cents == 754 and cost_per_sample_final_cents == 1758,
          because the LOST shipment keeps its cost in the final numerator but leaves the final denominator
          while its surcharge_cents enters only the final numerator.
        test_recipe:
          setup:
            - "One campaign in SAMPLING_ACTIVE with three ACTIVE kit lines whose pinned kit assembly cost is 454 cents."
            - "One fulfillment center with freight_cents_per_kit 300, so every shipment commits 454 + 300 = 754 cents."
            - "Two screened non-holdout enrollments, each carrying one shipment in the same wave; the wave has been released so both shipments are SHIPPED."
            - "Shipment one carries surcharge_cents 0; shipment two carries surcharge_cents 250."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /campaigns"
              payload: { name: "Alpha Sampling", objective_type: "TRIAL_GENERATION", target_segment_codes: ["URBAN_MILLENNIAL"], syndication_retailer_ids: [], sampling_window_start: "2026-07-01T00:00:00Z", sampling_window_end: "2026-09-30T00:00:00Z", budget_total_cents: 1000000, review_due_days: 21, min_review_word_count: 10, holdout_pct: 0.0 }
              as: CampaignManager
              captures: { camp_id: $.data.id }
            - call: "POST /kit-lines"
              payload: { campaign_id: "${camp_id}", component_sku: "HERO-1", component_role: "HERO_PRODUCT", unit_cost_cents: 1417, quantity_per_kit: 1, component_discount_pct: 0.8 }
              as: CampaignManager
              captures: { kl1_id: $.data.id }
            - call: "POST /kit-lines"
              payload: { campaign_id: "${camp_id}", component_sku: "ACC-2", component_role: "ACCESSORY", unit_cost_cents: 388, quantity_per_kit: 2, component_discount_pct: 0.85 }
              as: CampaignManager
              captures: { kl2_id: $.data.id }
            - call: "POST /kit-lines"
              payload: { campaign_id: "${camp_id}", component_sku: "INS-3", component_role: "INSERT_CARD", unit_cost_cents: 554, quantity_per_kit: 1, component_discount_pct: 0.9 }
              as: CampaignManager
              captures: { kl3_id: $.data.id }
            - call: "POST /kit-lines/${kl1_id}/receipts"
              payload: { units: 10 }
              as: FulfillmentOps
            - call: "POST /kit-lines/${kl2_id}/receipts"
              payload: { units: 20 }
              as: FulfillmentOps
            - call: "POST /kit-lines/${kl3_id}/receipts"
              payload: { units: 10 }
              as: FulfillmentOps
            - call: "POST /campaigns/${camp_id}/open-screening"
              payload: {}
              as: CampaignManager
            - call: "POST /panelists"
              payload: { email: "p1@example.com", display_name: "P One", address_hash: "H-P1", account_opened_at: "2026-01-01T00:00:00Z", segment_code: "URBAN_MILLENNIAL" }
              as: Anonymous
              captures: { p1_id: $.data.id }
            - call: "POST /panelists"
              payload: { email: "p2@example.com", display_name: "P Two", address_hash: "H-P2", account_opened_at: "2026-01-01T00:00:00Z", segment_code: "URBAN_MILLENNIAL" }
              as: Anonymous
              captures: { p2_id: $.data.id }
            - call: "POST /enrollments"
              payload: { campaign_id: "${camp_id}", panelist_id: "${p1_id}", screening_answers: { household_size: 3, attests_no_resale: true } }
              as: CampaignManager
              captures: { e1_id: $.data.id }
            - call: "POST /enrollments/${e1_id}/screen"
              payload: {}
              as: CampaignManager
              captures: { e1_v: $.data.version }
            - call: "POST /enrollments"
              payload: { campaign_id: "${camp_id}", panelist_id: "${p2_id}", screening_answers: { household_size: 2, attests_no_resale: true } }
              as: CampaignManager
              captures: { e2_id: $.data.id }
            - call: "POST /enrollments/${e2_id}/screen"
              payload: {}
              as: CampaignManager
              captures: { e2_v: $.data.version }
            - call: "POST /campaigns/${camp_id}/activate-sampling"
              payload: {}
              as: CampaignManager
            - call: "POST /fulfillment-centers"
              payload: { name: "FC East", zone_code: "EAST", daily_pick_capacity_units: 100, freight_cents_per_kit: 300 }
              as: FulfillmentOps
              captures: { fc_id: $.data.id }
            - call: "POST /fulfillment-waves"
              payload: { fulfillment_center_id: "${fc_id}", window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-02T00:00:00Z", planned_capacity_units: 50 }
              as: FulfillmentOps
              captures: { w1_id: $.data.id }
            - call: "POST /sample-shipments"
              payload: { enrollment_id: "${e1_id}", fulfillment_wave_id: "${w1_id}", expected_enrollment_version: "${e1_v}", surcharge_cents: 0 }
              as: FulfillmentOps
              captures: { s1_id: $.data.id }
            - call: "POST /sample-shipments"
              payload: { enrollment_id: "${e2_id}", fulfillment_wave_id: "${w1_id}", expected_enrollment_version: "${e2_v}", surcharge_cents: 250 }
              as: FulfillmentOps
              captures: { s2_id: $.data.id }
            - call: "POST /fulfillment-waves/${w1_id}/lock"
              payload: {}
              as: FulfillmentOps
            - call: "POST /fulfillment-waves/${w1_id}/release"
              payload: {}
              as: FulfillmentOps
          trigger:
            - call: "POST /sample-shipments/${s1_id}/deliver"
              payload: {}
              as: FulfillmentOps
            - call: "POST /sample-shipments/${s2_id}/report-lost"
              payload: {}
              as: FulfillmentOps
          assert:
            - "Campaign.${camp_id}.kit_assembly_unit_cost_cents == 454"
            - "SampleShipment.${s1_id}.committed_cost_cents == 754"
            - "SampleShipment.${s2_id}.committed_cost_cents == 754"
            - "SampleShipment.${s1_id}.status == DELIVERED"
            - "SampleShipment.${s2_id}.status == LOST"
            - "Campaign.${camp_id}.delivered_sample_count == 1"
            - "Campaign.${camp_id}.cost_per_sample_provisional_cents == 754"
            - "Campaign.${camp_id}.cost_per_sample_final_cents == 1758"

      - name: panelist_fraud_screening_vs_audit_on_shared_address
        grounds:
          - calculations.panelist_fraud_risk_score
          - entities.Panelist.fields.fraud_risk_score_screening
          - entities.Panelist.fields.fraud_risk_score_audit
          - endpoints[POST /panelists/{panelist_id}/risk-rescore]
        distinguishing_aspect: |
          This dual variant lives in the RISK-SCORING domain on Panelist, not in cost accounting on
          Campaign: for one unchanged Panelist row the screening variant scores 28.0 while the audit
          variant scores 31.0, because the audit variant re-weights addr_base by AUDIT_ADDR_MULTIPLIER
          1.5 (6.0 -> 9.0) while both variants share the same 22-point account-age term.
        test_recipe:
          setup:
            - "Two panelists share address_hash H-SHARED, so the target panelist has exactly one address collision (addr_base = 18 * min(3,1) / 3 = 6.0)."
            - "The target panelist's account_opened_at is 2026-07-20T00:00:00Z and the logical clock reads 2026-08-01T00:00:00Z, so age_days = 12 < ACCOUNT_AGE_FLOOR_DAYS 30 and age_term = 22."
            - "The target panelist has zero diversion strikes, no referrer, no reviews and no diversion cases, so strike_term, ref_term, vel_term and resale_term are all 0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /panelists"
              payload: { email: "sib@example.com", display_name: "Sibling", address_hash: "H-SHARED", account_opened_at: "2026-01-01T00:00:00Z", segment_code: "URBAN_MILLENNIAL" }
              as: Anonymous
              captures: { sib_id: $.data.id }
            - call: "POST /panelists"
              payload: { email: "tgt@example.com", display_name: "Target", address_hash: "H-SHARED", account_opened_at: "2026-07-20T00:00:00Z", segment_code: "URBAN_MILLENNIAL" }
              as: Anonymous
              captures: { tgt_id: $.data.id }
          trigger:
            - call: "POST /panelists/${tgt_id}/risk-rescore"
              payload: { variant: "SCREENING" }
              as: ComplianceModerator
              as_user_id: "11111111-1111-4111-8111-111111111111"
            - call: "POST /panelists/${tgt_id}/risk-rescore"
              payload: { variant: "AUDIT" }
              as: ComplianceModerator
              as_user_id: "11111111-1111-4111-8111-111111111111"
          assert:
            - "Panelist.${tgt_id}.fraud_risk_score_screening == 28.0"
            - "Panelist.${tgt_id}.fraud_risk_score_audit == 31.0"
            - "Panelist.${tgt_id}.integrity_status == CLEAR"
            - "Panelist.${tgt_id}.last_risk_scored_at == 2026-08-01T00:00:00Z"
            - "Panelist.${sib_id}.fraud_risk_score_screening == 0.0"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: kit_assembly_rounding_order_round_per_line_then_sum
        mode: b
        grounds:
          - calculations.kit_assembly_unit_cost
          - entities.KitLine.fields.extended_cost_cents
          - entities.Campaign.fields.kit_assembly_unit_cost_cents
          - endpoints[POST /campaigns/{campaign_id}/open-screening]
        distinguishing_aspect: |
          Mode (b): the operation ORDER of rounding and summation is pinned. The same three kit lines
          give 454 cents under the mandated round-each-extended-cost-then-sum order and 455 cents under
          the reversed sum-the-raw-products-then-round order, so the two readings are separated by
          exactly one cent and the test cannot pass by accident.
        test_recipe:
          setup:
            - "One DRAFT campaign."
            - "Three kit lines whose raw extended costs are 283.4, 116.40 and 55.4 cents: rounding each to 283 + 116 + 55 gives 454, while summing 455.20 first and rounding gives 455."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /campaigns"
              payload: { name: "Rounding Lab", objective_type: "TRIAL_GENERATION", target_segment_codes: ["URBAN_MILLENNIAL"], syndication_retailer_ids: [], sampling_window_start: "2026-07-01T00:00:00Z", sampling_window_end: "2026-09-30T00:00:00Z", budget_total_cents: 1000000, review_due_days: 21, min_review_word_count: 10, holdout_pct: 0.0 }
              as: CampaignManager
              captures: { camp_id: $.data.id }
            - call: "POST /kit-lines"
              payload: { campaign_id: "${camp_id}", component_sku: "HERO-1", component_role: "HERO_PRODUCT", unit_cost_cents: 1417, quantity_per_kit: 1, component_discount_pct: 0.8 }
              as: CampaignManager
              captures: { kl1_id: $.data.id }
            - call: "POST /kit-lines"
              payload: { campaign_id: "${camp_id}", component_sku: "ACC-2", component_role: "ACCESSORY", unit_cost_cents: 388, quantity_per_kit: 2, component_discount_pct: 0.85 }
              as: CampaignManager
              captures: { kl2_id: $.data.id }
            - call: "POST /kit-lines"
              payload: { campaign_id: "${camp_id}", component_sku: "INS-3", component_role: "INSERT_CARD", unit_cost_cents: 554, quantity_per_kit: 1, component_discount_pct: 0.9 }
              as: CampaignManager
              captures: { kl3_id: $.data.id }
            - call: "POST /kit-lines/${kl1_id}/receipts"
              payload: { units: 10 }
              as: FulfillmentOps
            - call: "POST /kit-lines/${kl2_id}/receipts"
              payload: { units: 20 }
              as: FulfillmentOps
            - call: "POST /kit-lines/${kl3_id}/receipts"
              payload: { units: 10 }
              as: FulfillmentOps
          trigger:
            - call: "POST /campaigns/${camp_id}/open-screening"
              payload: {}
              as: CampaignManager
          assert:
            - "KitLine.${kl1_id}.extended_cost_cents == 283"
            - "KitLine.${kl2_id}.extended_cost_cents == 116"
            - "KitLine.${kl3_id}.extended_cost_cents == 55"
            - "Campaign.${camp_id}.kit_assembly_unit_cost_cents == 454"
            - "Campaign.${camp_id}.kit_assembly_unit_cost_cents != 455 (455 is the sum-raw-then-round reading of the same three lines and MUST NOT appear)"
            - "Campaign.${camp_id}.cost_per_sample_provisional_cents == 0 (no shipment exists yet, so the empty-set branch returns 0)"
            - "Campaign.${camp_id}.status == SCREENING_OPEN"

      - name: lift_diversion_penalty_tier_from_pre_penalty_base
        mode: c
        grounds:
          - calculations.campaign_lift_and_diversion_penalty
          - entities.LiftAnalysis.fields.base_cost_per_sample_cents
          - entities.LiftAnalysis.fields.penalty_rate_pct
          - entities.LiftAnalysis.fields.adjusted_cost_per_sample_cents
          - endpoints[POST /lift-analyses]
        distinguishing_aspect: |
          Mode (c): a self-referential-looking definition whose evaluation order is pinned. The penalty
          tier must be selected from the STEP-1 pre-penalty base (1260 -> 20%), never re-derived from the
          STEP-4 post-penalty figure (1764 -> 35%). The two readings are numerically far apart:
          adjusted_cost_per_sample_cents is 1764 under the mandated order and 2142 under the forbidden
          re-derivation. This is a different mode from the sibling instance, which pins rounding ORDER
          (mode b) rather than resolving a circular definition.
        test_recipe:
          setup:
            - "One campaign in REVIEW_WINDOW with a single kit line whose extended cost is 360 cents and a center whose freight is 60 cents, so every shipment commits exactly 420 cents."
            - "Three screened non-holdout enrollments (holdout_pct 0.0), each with one DELIVERED shipment, so budget_committed_cents is 1260 and delivered_sample_count is 3."
            - "Two substantiated diversion cases against two different panelists, so substantiated_diversion_count is 2 and effective_sample_count is 3 - 2 = 1."
            - "The third enrollment has one qualifying PurchaseMatch (confidence 0.9 >= 0.8, purchased inside the sampling window plus the 30-day tail)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /campaigns"
              payload: { name: "Lift Lab", objective_type: "REVIEW_ACQUISITION", target_segment_codes: ["URBAN_MILLENNIAL"], syndication_retailer_ids: [], sampling_window_start: "2026-07-01T00:00:00Z", sampling_window_end: "2026-09-30T00:00:00Z", budget_total_cents: 1000000, review_due_days: 21, min_review_word_count: 10, holdout_pct: 0.0 }
              as: CampaignManager
              captures: { camp_id: $.data.id }
            - call: "POST /kit-lines"
              payload: { campaign_id: "${camp_id}", component_sku: "HERO-L", component_role: "HERO_PRODUCT", unit_cost_cents: 360, quantity_per_kit: 1, component_discount_pct: 0.0 }
              as: CampaignManager
              captures: { kll_id: $.data.id }
            - call: "POST /kit-lines/${kll_id}/receipts"
              payload: { units: 10 }
              as: FulfillmentOps
            - call: "POST /campaigns/${camp_id}/open-screening"
              payload: {}
              as: CampaignManager
            - call: "POST /panelists"
              payload: { email: "l1@example.com", display_name: "L One", address_hash: "H-L1", account_opened_at: "2026-01-01T00:00:00Z", segment_code: "URBAN_MILLENNIAL" }
              as: Anonymous
              captures: { p1_id: $.data.id }
            - call: "POST /panelists"
              payload: { email: "l2@example.com", display_name: "L Two", address_hash: "H-L2", account_opened_at: "2026-01-01T00:00:00Z", segment_code: "URBAN_MILLENNIAL" }
              as: Anonymous
              captures: { p2_id: $.data.id }
            - call: "POST /panelists"
              payload: { email: "l3@example.com", display_name: "L Three", address_hash: "H-L3", account_opened_at: "2026-01-01T00:00:00Z", segment_code: "URBAN_MILLENNIAL" }
              as: Anonymous
              captures: { p3_id: $.data.id }
            - call: "POST /enrollments"
              payload: { campaign_id: "${camp_id}", panelist_id: "${p1_id}", screening_answers: { household_size: 1, attests_no_resale: true } }
              as: CampaignManager
              captures: { e1_id: $.data.id }
            - call: "POST /enrollments/${e1_id}/screen"
              payload: {}
              as: CampaignManager
              captures: { e1_v: $.data.version }
            - call: "POST /enrollments"
              payload: { campaign_id: "${camp_id}", panelist_id: "${p2_id}", screening_answers: { household_size: 2, attests_no_resale: true } }
              as: CampaignManager
              captures: { e2_id: $.data.id }
            - call: "POST /enrollments/${e2_id}/screen"
              payload: {}
              as: CampaignManager
              captures: { e2_v: $.data.version }
            - call: "POST /enrollments"
              payload: { campaign_id: "${camp_id}", panelist_id: "${p3_id}", screening_answers: { household_size: 3, attests_no_resale: true } }
              as: CampaignManager
              captures: { e3_id: $.data.id }
            - call: "POST /enrollments/${e3_id}/screen"
              payload: {}
              as: CampaignManager
              captures: { e3_v: $.data.version }
            - call: "POST /campaigns/${camp_id}/activate-sampling"
              payload: {}
              as: CampaignManager
            - call: "POST /fulfillment-centers"
              payload: { name: "FC Lift", zone_code: "WEST", daily_pick_capacity_units: 100, freight_cents_per_kit: 60 }
              as: FulfillmentOps
              captures: { fc_id: $.data.id }
            - call: "POST /fulfillment-waves"
              payload: { fulfillment_center_id: "${fc_id}", window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-02T00:00:00Z", planned_capacity_units: 20 }
              as: FulfillmentOps
              captures: { w1_id: $.data.id }
            - call: "POST /sample-shipments"
              payload: { enrollment_id: "${e1_id}", fulfillment_wave_id: "${w1_id}", expected_enrollment_version: "${e1_v}", surcharge_cents: 0 }
              as: FulfillmentOps
              captures: { s1_id: $.data.id }
            - call: "POST /sample-shipments"
              payload: { enrollment_id: "${e2_id}", fulfillment_wave_id: "${w1_id}", expected_enrollment_version: "${e2_v}", surcharge_cents: 0 }
              as: FulfillmentOps
              captures: { s2_id: $.data.id }
            - call: "POST /sample-shipments"
              payload: { enrollment_id: "${e3_id}", fulfillment_wave_id: "${w1_id}", expected_enrollment_version: "${e3_v}", surcharge_cents: 0 }
              as: FulfillmentOps
              captures: { s3_id: $.data.id }
            - call: "POST /fulfillment-waves/${w1_id}/lock"
              payload: {}
              as: FulfillmentOps
            - call: "POST /fulfillment-waves/${w1_id}/release"
              payload: {}
              as: FulfillmentOps
            - call: "POST /sample-shipments/${s1_id}/deliver"
