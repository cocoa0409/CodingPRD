  - rule_id: transitive_cascade
    instances:
      - name: doc_overdue_suspends_authorization_denies_extensions
        grounds:
          - state_machines.MedicalDocumentation.AWAITED_to_OVERDUE
          - state_machines.ReferralAuthorization.ACTIVE_to_DOCS_SUSPENDED
          - state_machines.ExtensionRequest.PENDING_to_DENIED
        distinguishing_aspect: |
          Depth-3 chain triggered by a clock set (different trigger than the
          sibling's credential decision): doc OVERDUE -> authorization
          DOCS_SUSPENDED -> PENDING extension auto-DENIED; each link is caused
          by the previous mutation, not by the clock directly. The 300-day
          episode keeps the expiry sweep from firing, isolating the
          documentation cascade.
        test_recipe:
          setup:
            - "ACTIVE episode (2 visits, 300-day window starting 2026-09-05) with one COMPLETED appointment at clock 2026-09-06T12:00:00Z (doc deadline 2026-10-06T12:00:00Z) and one PENDING extension request"
