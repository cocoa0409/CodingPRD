              payload: { promised_at: "2026-09-01T01:00:00Z" }
              as: Merchant
              as_user_id: "${m_id}"
            - call: "POST /delivery-orders/${o1}/mark-ready"
              payload: {}
              as: Merchant
              as_user_id: "${m_id}"
            - call: "POST /delivery-quotes"
              payload: { store_id: "${s_id}", dropoff_lat: 0.02, dropoff_lng: 0.0, address_text: "11 Dest Rd", order_value_cents: 5000, pickup_ready_at: "2026-09-01T09:00:00Z" }
              as: Merchant
              as_user_id: "${m_id}"
              captures: { q2: $.data.id }
            - call: "POST /delivery-orders"
              payload: { quote_id: "${q2}", customer_reference: "CO-2", idempotency_key: "co-2" }
              as: Merchant
              as_user_id: "${m_id}"
              captures: { o2: $.data.id }
            - call: "POST /delivery-orders/${o2}/accept"
              payload: { promised_at: "2026-09-01T01:00:00Z" }
              as: Merchant
              as_user_id: "${m_id}"
            - call: "POST /delivery-orders/${o2}/mark-ready"
              payload: {}
              as: Merchant
              as_user_id: "${m_id}"
