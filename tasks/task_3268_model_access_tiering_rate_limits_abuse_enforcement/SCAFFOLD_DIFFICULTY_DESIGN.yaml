              as: PlatformAdmin
            - call: "POST /payment-events"
              payload: { organization_id: "${org_at}", kind: "PREPAID_TOPUP", amount_cents: 1000000 }
              as: PlatformAdmin
              captures: { a2: $.data.id }
            - call: "POST /payment-events/${a2}/settle"
              payload: {}
              as: PlatformAdmin
            - call: "POST /payment-events"
              payload: { organization_id: "${org_at}", kind: "PREPAID_TOPUP", amount_cents: 1000000 }
              as: PlatformAdmin
              captures: { a3: $.data.id }
            - call: "POST /payment-events/${a3}/settle"
              payload: {}
              as: PlatformAdmin
            - call: "POST /payment-events"
              payload: { organization_id: "${org_at}", kind: "PREPAID_TOPUP", amount_cents: 1000000 }
              as: PlatformAdmin
              captures: { a4: $.data.id }
            - call: "POST /payment-events/${a4}/settle"
              payload: {}
              as: PlatformAdmin
            - call: "POST /payment-events"
              payload: { organization_id: "${org_at}", kind: "PREPAID_TOPUP", amount_cents: 1000000 }
              as: PlatformAdmin
              captures: { a5: $.data.id }
            - call: "POST /organizations"
              payload: { legal_name: "Boundary Below Corp" }
              as: PlatformAdmin
              captures: { org_below: $.data.id }
            - call: "POST /payment-events"
              payload: { organization_id: "${org_below}", kind: "PREPAID_TOPUP", amount_cents: 1000000 }
              as: PlatformAdmin
              captures: { b1: $.data.id }
            - call: "POST /payment-events/${b1}/settle"
              payload: {}
              as: PlatformAdmin
            - call: "POST /payment-events"
              payload: { organization_id: "${org_below}", kind: "PREPAID_TOPUP", amount_cents: 1000000 }
              as: PlatformAdmin
              captures: { b2: $.data.id }
            - call: "POST /payment-events/${b2}/settle"
              payload: {}
              as: PlatformAdmin
            - call: "POST /payment-events"
              payload: { organization_id: "${org_below}", kind: "PREPAID_TOPUP", amount_cents: 1000000 }
              as: PlatformAdmin
              captures: { b3: $.data.id }
            - call: "POST /payment-events/${b3}/settle"
              payload: {}
              as: PlatformAdmin
            - call: "POST /payment-events"
              payload: { organization_id: "${org_below}", kind: "PREPAID_TOPUP", amount_cents: 1000000 }
              as: PlatformAdmin
              captures: { b4: $.data.id }
            - call: "POST /payment-events/${b4}/settle"
              payload: {}
              as: PlatformAdmin
            - call: "POST /payment-events"
              payload: { organization_id: "${org_below}", kind: "PREPAID_TOPUP", amount_cents: 999999 }
              as: PlatformAdmin
              captures: { b5: $.data.id }
          trigger:
