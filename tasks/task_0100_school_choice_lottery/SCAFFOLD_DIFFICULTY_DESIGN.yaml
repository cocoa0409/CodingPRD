scaffold_difficulty_design:

  # -------------------------------------------------------------------------
  # Rule 1 — Dual-variant calculations across DIFFERENT entity domains
  # -------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: lottery_weight_sibling_vs_standard_on_application
        grounds:
          - calculations.lottery_weight
          - calculations.lottery_weight.variants.with_sibling_anchor
          - calculations.lottery_weight.variants.inter_district_disadvantaged
          - entities.Application.fields.priority_category
          - entities.Application.fields.lottery_weight
          - entities.Family.fields.head_household_application_id
        distinguishing_aspect: |
          Two valid lottery_weight outputs differ for the same Family on the SAME Application: variant
          with_sibling_anchor returns base=4.0 (anchor in district), while if the anchor were absent the
          same Application would classify as IN_DISTRICT_STANDARD or IN_DISTRICT_DISADVANTAGED with
          base=2.0/3.0. The two variants operate on the Application entity domain (priority_category +
          weight).
        test_recipe:
          setup:
            - "POST /enrollment/_clock/advance to 2026-06-01T00:00:00Z"
            - "POST /enrollment/districts (name='District A', state_code='CA', poverty_index_threshold=0.50, accepts_inter_district_transfers=false) → district A id"
            - "POST /enrollment/schools (district_id=A, school_type=NEIGHBORHOOD, grade_levels_offered=[5])"
            - "POST /enrollment/programs (school=A.school, grade_level=5, seats_total=1, registration_open_at='2026-06-02T00:00:00Z', registration_close_at='2026-07-01T00:00:00Z', lottery_seed='seed-1') → program P"
            - "POST /enrollment/families (residency_district_id=A, poverty_index_score=0.10) → family F"
            - "POST /enrollment/students (family_id=F, grade_level_next_year=5) → student S1"
            - "POST /enrollment/students (family_id=F, grade_level_next_year=5) → student S2"
            - "POST /enrollment/applications (student=S1, program=P, choice_rank=1) → app A1"
            - "POST /enrollment/_clock/advance to 2026-06-02T00:00:01Z (P opens)"
            - "POST /enrollment/applications/A1/submit (no sibling anchor yet)"
            - "POST /enrollment/_clock/advance to 2026-07-01T00:00:01Z (P closes)"
            - "POST /enrollment/programs/P/lottery/draw"
            - "POST /enrollment/applications/A1/accept (S1 accepts; F.head_household_application_id := A1)"
          trigger:
            - "POST /enrollment/programs (second program P2 same school/grade, fresh window)"
            - "POST /enrollment/applications (student=S2, program=P2, choice_rank=1) → app A2"
            - "POST /enrollment/_clock/advance into P2's open window"
            - "POST /enrollment/applications/A2/submit"
          assert:
            - "Application A1.priority_category == 'IN_DISTRICT_STANDARD' AND A1.lottery_weight == 2.0"
            - "Application A2.priority_category == 'SIBLING_IN_DISTRICT' AND A2.lottery_weight == 4.0"
            - "A2.lottery_weight > A1.lottery_weight"

      - name: district_capacity_pre_vs_post_draw_on_district
        grounds:
          - calculations.district_inter_district_capacity
          - calculations.district_inter_district_capacity.variants.pre_draw
          - calculations.district_inter_district_capacity.variants.post_draw
          - entities.Program.fields.seats_total
          - entities.Program.fields.seats_accepted
          - entities.TransferRequest.fields.capacity_units_held
        distinguishing_aspect: |
          Two valid capacity values for the SAME District: pre_draw variant treats seats_accepted as zero
          (no lottery yet → full headroom), post_draw variant subtracts already-committed seats. This
          dual-variant logic lives on the District/Program domain, structurally different from rule 1's
          first instance which lives on the Application/Family domain.
        test_recipe:
          setup:
            - "POST /enrollment/_clock/advance to 2026-06-01T00:00:00Z"
            - "Create District D2 with accepts_inter_district_transfers=true"
            - "Create School Sm under D2 with school_type=MAGNET, grade_levels_offered=[5]"
            - "Create Program Pm under Sm with grade_level=5, seats_total=2"
            - "Create Family Fx in a DIFFERENT residency district"
            - "Create Student Sx under Fx, grade_level_next_year=5"
            - "Create DRAFT Application AppX (Sx, Pm, choice_rank=1)"
            - "Create TransferRequest TR1 for AppX, target_district_id=D2"
          trigger:
            - "POST /enrollment/transfer-requests/TR1/approve (pre-draw evaluation)"
            - "Advance clock so Pm closes; POST /enrollment/programs/Pm/lottery/draw with AppX as sole applicant"
            - "Accept AppX (seats_accepted=1)"
            - "Create new Family Fy, Student Sy, AppY, TR2 (same shape)"
            - "POST /enrollment/transfer-requests/TR2/approve (post-draw evaluation)"
          assert:
            - "TR1 transitions PENDING→APPROVED with capacity_units_held == 1 (pre_draw: capacity=2, held=0+1=1)"
            - "TR2 transitions PENDING→APPROVED with capacity_units_held == 1 (post_draw: capacity=2-1=1, held=0+1=1)"
            - "Creating a hypothetical third pending request and approving it returns ERR_DISTRICT_CAPACITY_EXCEEDED with http_status 409 (post_draw: capacity=1, held=1, +1 > 1)"

  # -------------------------------------------------------------------------
  # Rule 2 — Combinatorial formulas across DIFFERENT modes
  # -------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: lottery_weight_three_inputs_nonlinear_mode_a
        grounds:
          - calculations.lottery_weight
          - calculations.lottery_weight.constants
        distinguishing_aspect: |
          Mode (a): the lottery_weight formula combines three inputs (priority_category bucket choice,
          poverty-decile multiplier on the District threshold, and choice_rank decay) NON-LINEARLY — the
          poverty multiplier is gated by a strict-greater predicate and uses integer floor on (pi*100 -
          thr*100) // 10, the decay is exponential in (choice_rank - 1), and they multiply together. A
          purely linear combination of the three inputs cannot reproduce the matrix of outputs.
        test_recipe:
          setup:
            - "District D1 threshold=0.50"
            - "Family F1 poverty=0.85, Family F2 poverty=0.30, Family F3 poverty=0.60"
            - "Three students with applications to the same NEIGHBORHOOD program P, choice_rank=1"
            - "Open window via _clock/advance"
          trigger:
            - "Submit App1 (F1, IN_DISTRICT_DISADVANTAGED): poverty 0.85 → pi_int=85, thr_int=50, deciles=(85-50)//10=3, multiplier=1.3"
            - "Submit App2 (F2, IN_DISTRICT_STANDARD): poverty 0.30 ≤ thr → multiplier=1.0"
            - "Submit App3 (F3, IN_DISTRICT_DISADVANTAGED): poverty 0.60 → pi_int=60, thr_int=50, deciles=1, multiplier=1.1"
          assert:
            - "App1.lottery_weight == 3.9     (3.0 * 1.3 * 1.0)"
            - "App2.lottery_weight == 2.0     (2.0 * 1.0 * 1.0)"
            - "App3.lottery_weight == 3.3     (3.0 * 1.1 * 1.0)"

      - name: lottery_weight_rounding_order_pinned_mode_b
        grounds:
          - calculations.lottery_weight.precision
          - calculations.lottery_weight.formula
        distinguishing_aspect: |
          Mode (b): the formula pins the ROUNDING ORDER explicitly — raw = base * multiplier * decay is
          rounded ONCE at the end to 4 decimal places with ROUND_HALF_UP. If a naive implementation
          rounded after each multiplication (round(base*multiplier, 4) then * decay then round), it would
          produce a different cents-equivalent for the choice_rank=5 boundary case below. Order pinned:
          single round at end.
        test_recipe:
          setup:
            - "District D1 threshold=0.50"
            - "Family F poverty=0.10 (below threshold, no boost)"
            - "Student S, choice_rank=5"
            - "Open IN-DISTRICT NEIGHBORHOOD program P"
          trigger:
            - "Submit App (IN_DISTRICT_STANDARD, multiplier=1.0, decay=0.85^4=0.52200625)"
          assert:
            - "App.lottery_weight == 1.044   (single round at end: round(2.0*1.0*0.52200625, 4) == 1.0440 → stored 1.044)"

      - name: lottery_score_circular_dependency_resolved_mode_c
        grounds:
          - calculations.lottery_selection
          - calculations.lottery_selection.formula
          - state_machines.Program.CLOSED_to_LOTTERY_DRAWN
        distinguishing_aspect: |
          Mode (c): lottery_score appears to depend on lottery_weight which appears to depend on
          priority_category which appears to depend on Family.head_household_application_id — and the
          anchor field is itself set when an ACCEPTED application appears. The scaffold pins the
          evaluation order: priority_category and lottery_weight are SNAPSHOTTED at SUBMITTED-time;
          lottery_score is computed ONCE at lottery draw using those snapshots, not re-evaluated against
          a later head_household_application_id. Without the pinned order, two valid orderings could
          give different scores for the same applicant.
        test_recipe:
          setup:
            - "Two programs P1, P2 under the same NEIGHBORHOOD school, same grade, both open windows"
            - "Family F (in-district, poverty=0.10), two students S1 and S2"
            - "Submit App1 (S1, P1, choice_rank=1) at time T=open+1h — anchor not yet set, classifies IN_DISTRICT_STANDARD, weight=2.0"
          trigger:
            - "Close P1 window, run lottery on P1, S1 wins and accepts → F.head_household_application_id := App1"
            - "Now submit App2 (S2, P2, choice_rank=1) → classifies SIBLING_IN_DISTRICT, weight=4.0"
            - "Close P2 window, run lottery on P2"
          assert:
            - "App1.lottery_weight == 2.0 (snapshotted at SUBMITTED; NOT retro-bumped to 4.0 after anchor formed)"
            - "App2.lottery_weight == 4.0 (snapshotted at its own SUBMITTED, anchor already present)"
            - "lottery_score values reflect these snapshotted weights; the lottery_weight field is NOT mutated by App1's accept"

  # -------------------------------------------------------------------------
  # Rule 3 — Non-linear state-machine shapes on DIFFERENT entities
  # -------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: application_branching_with_cascade_withdraw_on_application
        grounds:
          - state_machines.Application
          - state_machines.Application.SUBMITTED_to_OFFERED
          - state_machines.Application.SUBMITTED_to_WAITLISTED
          - state_machines.Application.OFFERED_to_ACCEPTED
          - state_machines.Application.OFFERED_to_WITHDRAWN
          - state_machines.Application.ACCEPTED_to_WITHDRAWN
        distinguishing_aspect: |
          Branching fork-join on Application: SUBMITTED forks into {OFFERED, WAITLISTED}; OFFERED forks
          into {ACCEPTED, DECLINED, EXPIRED, WITHDRAWN} with divergent side-effect sets per branch
          (ACCEPT cascades to sibling-withdrawals + anchor-setting; DECLINE only triggers backfill).
          ACCEPTED is non-terminal: an ACCEPTED→WITHDRAWN edge re-opens the seat (cycle within the same
          entity).
        test_recipe:
          setup:
            - "Program P with seats_total=1; two students from the SAME family both submit DRAFT apps to two different programs P and P2 (same family ⇒ same lottery_weight base after submit)"
            - "Both apps reach SUBMITTED; close windows; draw both lotteries → both win OFFERED"
          trigger:
            - "POST /applications/App-in-P/accept (ACCEPT branch chosen on first app)"
          assert:
            - "App-in-P.status == 'ACCEPTED' (branch ACCEPT taken)"
            - "App-in-P2.status == 'WITHDRAWN' (cascade branch from the ACCEPT, NOT a user action)"
            - "Both branches diverge from the SAME SUBMITTED→OFFERED predecessor; Application state machine is NOT a linear pipeline"

      - name: transfer_request_branching_with_revoke_on_transferrequest
        grounds:
          - state_machines.TransferRequest
          - state_machines.TransferRequest.PENDING_to_APPROVED
          - state_machines.TransferRequest.PENDING_to_DENIED
          - state_machines.TransferRequest.APPROVED_to_REVOKED
        distinguishing_aspect: |
          Branching with revert on TransferRequest (different entity from Application): PENDING forks
          into APPROVED or DENIED; APPROVED can be REVOKED, which cascades into a forced WITHDRAWN on
          the linked Application. The TransferRequest state machine is branching + revert, not linear.
        test_recipe:
          setup:
            - "Create cross-district application AppX with a linked TR (PENDING)"
            - "Approve TR → AppX submitted → AppX waitlisted"
          trigger:
            - "POST /transfer-requests/TR/revoke (REVOKE branch chosen from APPROVED)"
          assert:
            - "TR.status == 'REVOKED' (branch REVOKE)"
            - "AppX.status == 'WITHDRAWN' (cascade across entity types)"
            - "TR machine demonstrates APPROVED→REVOKED edge; not reachable in a linear A→B→C→D chain"

  # -------------------------------------------------------------------------
  # Rule 4 — Transitive cascade chains from DIFFERENT triggers (depths ≥ 3 and ≥ 2)
  # -------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: accept_to_sibling_withdraw_to_backfill_to_promotion_depth4
        grounds:
          - state_machines.Application.OFFERED_to_ACCEPTED
          - state_machines.Application.OFFERED_to_WITHDRAWN
          - calculations.waitlist_backfill
          - entities.Family.fields.head_household_application_id
          - entities.WaitlistEvent
        distinguishing_aspect: |
          Depth-4 chain, each link CAUSED BY the previous (not fan-out from the original action):
            (1) POST /accept on App-A (student S1, in program P1)
              → (2) sets Family.head_household_application_id := A
              → (3) App-B (same student S1, in program P2) auto-transitions OFFERED→WITHDRAWN
              → (4) Program P2's waitlist_backfill runs: WAITLISTED App-C is promoted to OFFERED.
          Link 2's anchor-setting is itself a mutation of Family; link 3 is caused BY the anchor logic
          enforcing student-uniqueness; link 4 is caused BY the WITHDRAW freeing a seat.
        test_recipe:
          setup:
            - "Family F1 with student S1, Family F2 with student S2"
            - "Programs P1, P2 (different schools), both run lotteries; S1 receives OFFERED on P1 (App-A) and OFFERED on P2 (App-B); S2 receives WAITLISTED on P2 (App-C)"
          trigger:
            - "POST /enrollment/applications/App-A/accept"
          assert:
            - "App-A.status == 'ACCEPTED' (link 1)"
            - "Family F1.head_household_application_id == App-A.id (link 2)"
            - "App-B.status == 'WITHDRAWN' (link 3 — caused by anchor enforcement, not by the accept endpoint directly mutating App-B)"
            - "App-C.status == 'OFFERED' AND App-C.offer_expires_at is set (link 4 — caused by App-B's WITHDRAWN freeing P2 seat)"
            - "exactly one new WaitlistEvent row exists for program P2 with triggered_by_application_id == App-B.id AND promoted_application_id == App-C.id"

      - name: revoke_to_withdraw_to_waitlist_recompute_depth3
        grounds:
          - state_machines.TransferRequest.APPROVED_to_REVOKED
          - calculations.waitlist_backfill.variants.skip_revoked_transfer
          - entities.Application.fields.waitlist_position
        distinguishing_aspect: |
          Depth-3 chain originating from a DIFFERENT trigger (transfer revoke, not application accept):
            (1) POST /transfer-requests/TR/revoke
              → (2) linked Application AppX (currently WAITLISTED) auto-transitions WAITLISTED→WITHDRAWN
              → (3) AppY at the next-lower waitlist_position is renumbered upward by 1.
          Each link strictly caused by the previous; the revoke endpoint does not directly touch AppY's
          waitlist_position. This cascade originates from TransferRequest, structurally different from
          the accept-driven cascade above.
        test_recipe:
          setup:
            - "Two cross-district applications AppX (waitlist_position=1) and AppY (waitlist_position=2) on program P; both have APPROVED TransferRequests TRx, TRy"
          trigger:
            - "POST /enrollment/transfer-requests/TRx/revoke"
          assert:
            - "TRx.status == 'REVOKED' (link 1)"
            - "AppX.status == 'WITHDRAWN' (link 2)"
            - "AppY.waitlist_position == 1 (link 3, shifted up from 2)"

  # -------------------------------------------------------------------------
  # Rule 5 — Validation priority conflicts across DIFFERENT error-category pairs
  # -------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_temporal_offer_expired_or_invalid
        grounds:
          - validations[priority=7]
          - validations[priority=14]
          - errors.ERR_INVALID_STATE_FOR_TRANSITION
          - errors.ERR_OFFER_EXPIRED
        distinguishing_aspect: |
          Pair: state (priority 7, ERR_INVALID_STATE_FOR_TRANSITION) vs business_temporal (priority 14,
          ERR_OFFER_EXPIRED). When an OFFERED application's offer_expires_at has passed but no clock
          sweep has reclassified it to EXPIRED, priority 7 sees status==OFFERED and passes, then
          priority 14 fires ERR_OFFER_EXPIRED. After clock sweep, priority 7 fires
          ERR_INVALID_STATE_FOR_TRANSITION instead.
        test_recipe:
          setup:
            - "Program P drawn; App = OFFERED at T0; offer_expires_at = T0 + 168h"
          trigger:
            - "Advance clock to T0 + 169h via POST /_clock/advance BUT immediately POST /accept on App (clock sweep applied as part of advance turns App into EXPIRED before accept lands)"
            - "Separately, in a second scenario: POST /accept on a different OFFERED app whose offer_expires_at is now < Clock.now BUT we did NOT advance the clock between expiry and the accept call (sweep not yet run)"
          assert:
            - "Scenario A (sweep already ran via _clock/advance): response is 409 with error_id == 'ERR_INVALID_STATE_FOR_TRANSITION' (priority 7 wins because app is now EXPIRED)"
            - "Scenario B (sweep not run; we artificially set Clock to a value past expiry only via the advance immediately preceding the accept and the implementation defers sweep): response is 409 with error_id == 'ERR_OFFER_EXPIRED' (priority 14 wins because app is still OFFERED in DB but temporal check fails)"
            - "The two errors land on the SAME endpoint with DIFFERENT priority categories (state vs business_temporal)"

      - name: business_constraint_vs_business_fiscal_no_transfers_or_capacity
        grounds:
          - validations[priority=15]
          - validations[priority=16]
          - errors.ERR_DISTRICT_NO_TRANSFERS
          - errors.ERR_DISTRICT_CAPACITY_EXCEEDED
        distinguishing_aspect: |
          Different pair: business_constraint (priority 15, ERR_DISTRICT_NO_TRANSFERS) vs business_fiscal
          (priority 16, ERR_DISTRICT_CAPACITY_EXCEEDED). When a district has BOTH
          accepts_inter_district_transfers==false AND zero remaining capacity, priority 15 wins. This
          pair is structurally different from instance 1's state vs business_temporal pair.
        test_recipe:
          setup:
            - "District D with accepts_inter_district_transfers=false AND zero MAGNET/CHARTER programs (capacity == 0)"
            - "Pending TransferRequest TR targeting D"
          trigger:
            - "POST /transfer-requests/TR/approve"
          assert:
            - "Response is 422 with error_id == 'ERR_DISTRICT_NO_TRANSFERS' (priority 15 fires before priority 16)"
            - "If accepts_inter_district_transfers were toggled to true (with capacity still 0), the same request would return 409 ERR_DISTRICT_CAPACITY_EXCEEDED — confirming the priority ordering matters"

  # -------------------------------------------------------------------------
  # Rule 6 — Boundary-precision on DIFFERENT metrics / endpoints
  # -------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: poverty_threshold_strict_greater_on_submit_endpoint
        grounds:
          - calculations.lottery_weight.formula
          - entities.District.fields.poverty_index_threshold
          - entities.Family.fields.poverty_index_score
        distinguishing_aspect: |
          Numeric threshold crossing on the lottery_weight multiplier: STRICT > (not >=) on
          poverty_index_score vs district's poverty_index_threshold. Family at EXACTLY the threshold
          does NOT receive the disadvantaged boost. Endpoint: POST /applications/{id}/submit.
        test_recipe:
          setup:
            - "District D threshold = 0.50"
            - "Family F1 poverty = 0.50 (exactly at threshold), Family F2 poverty = 0.60 (one full decile above)"
            - "Open in-district NEIGHBORHOOD program P with seats_total=2"
            - "Two students, two applications, choice_rank=1 each"
          trigger:
            - "Submit App-from-F1 and App-from-F2 to P"
          assert:
            - "App-from-F1.priority_category == 'IN_DISTRICT_STANDARD' (0.50 NOT > 0.50 — strict inequality fails at exact boundary)"
            - "App-from-F1.lottery_weight == 2.0 (base 2.0 * multiplier 1.0 * decay 1.0)"
            - "App-from-F2.priority_category == 'IN_DISTRICT_DISADVANTAGED' (0.60 > 0.50)"
            - "App-from-F2.lottery_weight == 3.3 (base 3.0 * multiplier 1.1 (deciles=1) * decay 1.0)"

      - name: empty_waitlist_backfill_on_decline_endpoint
        grounds:
          - calculations.waitlist_backfill
          - state_machines.Application.OFFERED_to_DECLINED
          - entities.WaitlistEvent
        distinguishing_aspect: |
          Empty-collection boundary on a DIFFERENT metric (count of WAITLISTED apps, not a numeric
          threshold) reached through a DIFFERENT endpoint (POST /applications/{id}/decline). When the
          waitlist is empty, the freed offer must NOT cascade to a promotion; Program.seats_offered
          decrements by 1 and no WaitlistEvent row is created.
        test_recipe:
          setup:
            - "Program P with seats_total=1, exactly one SUBMITTED application App-A (no other applicants)"
            - "Run lottery; App-A becomes OFFERED; waitlist is empty"
          trigger:
            - "POST /enrollment/applications/App-A/decline"
          assert:
            - "App-A.status == 'DECLINED'"
            - "Program P.seats_offered == 0"
            - "GET /enrollment/programs/P/waitlist-events returns empty array (no backfill event emitted because no candidate existed)"

  # -------------------------------------------------------------------------
  # Rule 7 — Cross-entity state dependencies across DIFFERENT entity pairs
  # -------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: application_submit_depends_on_program_window_status
        grounds:
          - state_machines.Application.DRAFT_to_SUBMITTED
          - validations[priority=6]
          - entities.Program.fields.window_status
          - errors.ERR_REGISTRATION_WINDOW_CLOSED
        distinguishing_aspect: |
          Entity pair: Application → Program. Application's DRAFT→SUBMITTED transition is gated by
          Program.window_status == OPEN. SCHEDULED, CLOSED, LOTTERY_DRAWN, BACKFILL all reject.
        test_recipe:
          setup:
            - "Program P with registration_open_at=T+1h, registration_close_at=T+2h"
            - "DRAFT Application App created at T+0"
          trigger:
            - "POST /enrollment/applications/App/submit at clock T+0 (window_status==SCHEDULED)"
          assert:
            - "Response 409 ERR_REGISTRATION_WINDOW_CLOSED"
            - "Advance clock to T+1h+1s; resubmit succeeds (window OPEN)"
            - "Advance clock to T+2h+1s; create new DRAFT App2 and try to submit → 409 ERR_REGISTRATION_WINDOW_CLOSED (window now CLOSED)"

      - name: transfer_request_approve_depends_on_district_flag
        grounds:
          - state_machines.TransferRequest.PENDING_to_APPROVED
          - validations[priority=15]
          - entities.District.fields.accepts_inter_district_transfers
        distinguishing_aspect: |
          Different entity pair: TransferRequest → District (not Application → Program). The PENDING→
          APPROVED transition depends on the target District's accepts_inter_district_transfers boolean,
          a flag on a DIFFERENT entity from the one being transitioned.
        test_recipe:
          setup:
            - "District D2 with accepts_inter_district_transfers=false"
            - "PENDING TransferRequest TR targeting D2"
          trigger:
            - "POST /transfer-requests/TR/approve"
          assert:
            - "Response 422 ERR_DISTRICT_NO_TRANSFERS"
            - "PATCH District D2 setting accepts_inter_district_transfers=true; retry approve → succeeds"

  # -------------------------------------------------------------------------
  # Rule 8 — Resource temporal-overlap conflicts across DIFFERENT interval semantics
  # -------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: registration_window_half_open_interval_on_program
        grounds:
          - entities.Program.fields.registration_open_at
          - entities.Program.fields.registration_close_at
          - state_machines.Program.SCHEDULED_to_OPEN
          - state_machines.Program.OPEN_to_CLOSED
          - validations[priority=6]
        distinguishing_aspect: |
          Interval semantics: half-open [registration_open_at, registration_close_at). At T ==
          registration_open_at the window is OPEN (inclusive), at T == registration_close_at the window
          is CLOSED (exclusive). The interval geometry treats the LEFT boundary as inclusive and the
          RIGHT boundary as exclusive — distinct from instance 2's closed-interval geometry below.
        test_recipe:
          setup:
            - "Program P: registration_open_at = '2026-06-01T00:00:00Z', registration_close_at = '2026-07-01T00:00:00Z'"
            - "DRAFT App on P"
          trigger:
            - "POST /_clock/advance to '2026-06-01T00:00:00.000Z' (exact open boundary)"
            - "POST /applications/App/submit"
            - "Create another DRAFT App2 on P"
            - "POST /_clock/advance to '2026-07-01T00:00:00.000Z' (exact close boundary)"
            - "POST /applications/App2/submit"
          assert:
            - "First submit succeeds: window_status == OPEN at exact open instant (left inclusive)"
            - "Second submit fails with 409 ERR_REGISTRATION_WINDOW_CLOSED: window_status == CLOSED at exact close instant (right exclusive)"

      - name: offer_response_window_inclusive_lower_bound_on_application
        grounds:
          - entities.Application.fields.offer_expires_at
          - calculations.waitlist_backfill.constants
          - state_machines.Application.OFFERED_to_EXPIRED
          - validations[priority=14]
        distinguishing_aspect: |
          DIFFERENT interval semantics on a DIFFERENT resource entity (Application not Program): the
          offer-response window is treated as a CLOSED-on-left, CLOSED-on-right zero-tolerance check via
          `>=`. Application.offer_expires_at is treated as 'expired at exactly this instant' — Clock.now
          >= offer_expires_at flips status to EXPIRED. This is `>=` (closed boundary) versus the
          registration window's left-inclusive / right-exclusive geometry.
        test_recipe:
          setup:
            - "Application App reaches OFFERED at T0=2026-06-01T00:00:00Z (offer_expires_at = T0 + 168h = 2026-06-08T00:00:00Z)"
          trigger:
            - "POST /_clock/advance to '2026-06-08T00:00:00.000Z' (exact expiry instant)"
          assert:
            - "App.status == 'EXPIRED' (Clock.now >= offer_expires_at, closed boundary triggers expiry at exactly the instant)"
            - "If clock had advanced to '2026-06-07T23:59:59.999Z' (one ms before), App.status would remain 'OFFERED' (boundary precision)"

  # -------------------------------------------------------------------------
  # Rule 9 — Compensating-action invariants across DIFFERENT conserved quantities
  # -------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: seats_offered_invariant_under_offer_decline_backfill_cycle
        grounds:
          - entities.Program.fields.seats_offered
          - state_machines.Application.OFFERED_to_DECLINED
          - calculations.waitlist_backfill
          - state_machines.Application.SUBMITTED_to_OFFERED
        distinguishing_aspect: |
          Conserved quantity: Program.seats_offered (number of applications in {OFFERED, ACCEPTED}).
          Forward action: lottery draw issues seats_total offers, so seats_offered = seats_total.
          Compensating cycle: decline an offer + waitlist backfill promotes one. After the round trip
          seats_offered MUST equal seats_total again — no drift. Invariant formula:
            INVARIANT: Program.seats_offered == count(Applications where program_id=P AND status IN {OFFERED, ACCEPTED})
            AND (after a decline+backfill cycle, given non-empty waitlist) Program.seats_offered_after == Program.seats_offered_before.
        test_recipe:
          setup:
            - "Program P with seats_total=1; two submitted applications App-A (winner) and App-B (waitlisted)"
            - "Run lottery: App-A=OFFERED, App-B=WAITLISTED; record seats_offered_before = 1"
          trigger:
            - "POST /applications/App-A/decline"
          assert:
            - "App-A.status == 'DECLINED'"
            - "App-B.status == 'OFFERED'"
            - "Program P.seats_offered == 1 (unchanged from before; invariant holds)"
            - "count(Apps in P with status IN {OFFERED, ACCEPTED}) == 1 (denormalized field stays consistent with derivation)"

      - name: district_capacity_units_invariant_under_approve_revoke_cycle
        grounds:
          - entities.TransferRequest.fields.capacity_units_held
          - calculations.district_inter_district_capacity
          - state_machines.TransferRequest.PENDING_to_APPROVED
          - state_machines.TransferRequest.APPROVED_to_REVOKED
        distinguishing_aspect: |
          DIFFERENT conserved quantity (capacity units, integer count of APPROVED TransferRequests per
          target district — not a seat counter on a Program). Forward action: approve TR (held := 1,
          district held_count += 1). Compensating action: revoke TR (held := 0, district held_count -=
          1). After the round trip:
            INVARIANT: count(TransferRequest where target_district_id=D AND status=APPROVED)
                       == SUM(TR.capacity_units_held for TR in target_district=D)
            AND held_count_after_revoke_cycle == held_count_before_approve.
        test_recipe:
          setup:
            - "District D with accepts_inter_district_transfers=true; capacity = 2; held_count_before = 0"
            - "Create PENDING TR pointed at D"
          trigger:
            - "POST /transfer-requests/TR/approve  (forward: held_count → 1, TR.capacity_units_held → 1)"
            - "POST /transfer-requests/TR/revoke   (compensate: TR.capacity_units_held → 0, held_count → 0)"
          assert:
            - "After approve: TR.capacity_units_held == 1 AND COUNT(TR where target_district_id=D.id AND status=APPROVED) == 1"
            - "After revoke: TR.capacity_units_held == 0 AND COUNT(TR where target_district_id=D.id AND status=APPROVED) == 0"
            - "Net change after the cycle: COUNT == 0 (matches held_count_before); no drift in the conserved capacity-units quantity"
            - "Invariant: COUNT(TR where target_district_id=D AND status=APPROVED) == SUM(TR.capacity_units_held for TR with target_district_id=D) at every observable moment"
