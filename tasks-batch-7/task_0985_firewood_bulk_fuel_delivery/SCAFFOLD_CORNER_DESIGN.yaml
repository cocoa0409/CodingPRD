  - section: consistency_model
    instances:
      - name: immediate_consistency_on_order_submit
        claim_type: immediate
        grounds: ["complexity_profile.consistency_model", "state_machines.Order.DRAFT_to_PENDING_PAYMENT"]
        distinguishing_aspect: "Submit response reflects new state and pricing atomically — no eventual-consistency lag. Follow-up GET returns the same state without delay."
        test_recipe:
          setup: ["Order DRAFT with line"]
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: OperationsManager
            - call: "POST /api/v1/customers"
              payload: { full_name: "Cu IC", email: "ic@x.com", phone: "1", street_address: "1 St", postal_code: "01010" }
              as: CustomerService
              captures: { cu_ic_id: $.data.id }
            - call: "POST /api/v1/products"
              payload: { sku: "PIC", product_kind: "CORD", species: "OAK", seasoned_grade: "KILN_DRIED", base_price_cents: 40000, moisture_ceiling_pct: 20.0, available_qty: 10 }
              as: OperationsManager
              captures: { p_ic_id: $.data.id }
            - call: "POST /api/v1/orders"
              payload: { customer_id: "${cu_ic_id}", delivery_street_address: "1 St", delivery_postal_code: "01010", requested_delivery_date: "2026-08-15", lines: [{ product_id: "${p_ic_id}", quantity: 1.0 }] }
              as: CustomerService
              captures: { o_ic_id: $.data.id }
          trigger:
            - call: "POST /api/v1/orders/${o_ic_id}/submit"
              payload: {}
              as: CustomerService
              captures: { o_ic_sub: $.data }
            - call: "GET /api/v1/orders/${o_ic_id}"
              payload: {}
              as: CustomerService
              captures: { o_ic_get: $.data }
          assert:
            - "Submit response fulfillment_status == PENDING_PAYMENT"
            - "Immediate GET returns same fulfillment_status == PENDING_PAYMENT"
            - "Product.available_qty decreased atomically (visible on immediate GET of product)"
