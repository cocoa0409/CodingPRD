            - { call: "POST /vbc/practices", payload: { practice_group_id: "${g1}", practice_name: "PR1", npi: "2000000001" }, as: PayerAdmin, captures: { pr1: $.data.id } }
            - { call: "POST /vbc/practices", payload: { practice_group_id: "${g1}", practice_name: "PR2", npi: "2000000002" }, as: PayerAdmin, captures: { pr2: $.data.id } }
            - { call: "POST /vbc/contracts", payload: { program_id: "${pg}", practice_group_id: "${g1}", contract_ref: "C-A", effective_start: "2026-01-01", effective_end: "2027-01-01", risk_track: TWO_SIDED, risk_model: PROSPECTIVE, benchmark_pmpm_cents: 100000, shared_savings_rate_bp: 5000, shared_loss_rate_bp: 4000, min_savings_rate_bp: 200, min_loss_rate_bp: 200, savings_cap_bp: 5000, loss_cap_bp: 800, stop_loss_cents: 2000000, withhold_rate_bp: 500, quality_gate_floor_points: 30, quality_gate_excellence_points: 80, estimate_method: ANNUALIZATION, quality_measures: [ { measure_code: HBA1C, weight_bp: 9000, decile_thresholds_bp: [1000, 2000, 3000, 4000, 5000, 6000, 7000, 8000, 9000] }, { measure_code: MAMMO, weight_bp: 1000, decile_thresholds_bp: [1000, 2000, 3000, 4000, 5000, 6000, 7000, 8000, 9000] } ] }, as: ContractManager, captures: { ca: $.data.id } }
            - { call: "POST /vbc/contracts/${ca}/activate", payload: {}, as: ContractManager }
            - { call: "POST /vbc/contracts", payload: { program_id: "${pg}", practice_group_id: "${g1}", contract_ref: "C-B", effective_start: "2026-01-01", effective_end: "2027-01-01", risk_track: TWO_SIDED, risk_model: PROSPECTIVE, benchmark_pmpm_cents: 100000, shared_savings_rate_bp: 5000, shared_loss_rate_bp: 4000, min_savings_rate_bp: 200, min_loss_rate_bp: 200, savings_cap_bp: 5000, loss_cap_bp: 800, stop_loss_cents: 2000000, withhold_rate_bp: 500, quality_gate_floor_points: 30, quality_gate_excellence_points: 80, estimate_method: COMPLETION_FACTOR, quality_measures: [ { measure_code: HBA1C, weight_bp: 9000, decile_thresholds_bp: [1000, 2000, 3000, 4000, 5000, 6000, 7000, 8000, 9000] }, { measure_code: MAMMO, weight_bp: 1000, decile_thresholds_bp: [1000, 2000, 3000, 4000, 5000, 6000, 7000, 8000, 9000] } ] }, as: ContractManager, captures: { cb: $.data.id } }
            - { call: "POST /vbc/contracts/${cb}/activate", payload: {}, as: ContractManager }
            - { call: "POST /vbc/members", payload: { program_id: "${pg}", member_ref: "M-001", birth_year: 1980 }, as: PayerAdmin, captures: { m1: $.data.id } }
            - { call: "POST /vbc/members", payload: { program_id: "${pg}", member_ref: "M-002", birth_year: 1975 }, as: PayerAdmin, captures: { m2: $.data.id } }
            - { call: "POST /vbc/eligibility-spans", payload: { member_id: "${m1}", start_date: "2026-01-01", end_date: "2026-12-31" }, as: PayerAdmin }
            - { call: "POST /vbc/eligibility-spans", payload: { member_id: "${m2}", start_date: "2026-07-01", end_date: "2026-12-31" }, as: PayerAdmin }
            - { call: "POST /vbc/performance-years", payload: { contract_id: "${ca}", year_label: 2026, period_start: "2026-01-01", period_end: "2027-01-01" }, as: PayerAdmin, captures: { ya: $.data.id } }
            - { call: "POST /vbc/performance-years/${ya}/open-attribution", payload: {}, as: PayerAdmin }
            - { call: "GET /vbc/performance-years/${ya}", payload: {}, as: PayerAdmin, captures: { yav: $.data.version } }
            - { call: "POST /vbc/performance-years/${ya}/attribution-runs", payload: { run_label: "R-A", expected_performance_year_version: "${yav}" }, as: AttributionAnalyst, captures: { ra: $.data.id } }
            - { call: "POST /vbc/attribution-runs/${ra}/records", payload: { member_id: "${m1}", practice_id: "${pr1}" }, as: AttributionAnalyst }
            - { call: "POST /vbc/attribution-runs/${ra}/records", payload: { member_id: "${m2}", practice_id: "${pr2}" }, as: AttributionAnalyst }
            - { call: "POST /vbc/attribution-runs/${ra}/compute", payload: {}, as: AttributionAnalyst }
            - { call: "POST /vbc/attribution-runs/${ra}/lock", payload: {}, as: AttributionAnalyst }
            - { call: "POST /vbc/performance-years/${ya}/lock-attribution", payload: {}, as: PayerAdmin }
            - { call: "POST /vbc/_clock/set_current_utc", payload: { to_iso8601: "2026-03-01T00:00:00Z" }, as: PayerAdmin }
            - { call: "POST /vbc/claims", payload: { performance_year_id: "${ya}", member_id: "${m1}", claim_ref: "CL-A1", service_date: "2026-02-10", paid_amount_cents: 200000 }, as: ClaimsProcessor, captures: { cla: $.data.id } }
            - { call: "POST /vbc/claims/${cla}/mark-paid", payload: {}, as: ClaimsProcessor }
            - { call: "POST /vbc/performance-years/${ya}/begin-measurement", payload: {}, as: PayerAdmin }
