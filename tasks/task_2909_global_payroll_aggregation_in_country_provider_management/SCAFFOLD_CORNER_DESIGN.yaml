              as: PlatformAdmin
              as_user_id: "admin-01"
              captures: { prov_p1: "$.data.id" }
            - call: "POST /payroll/providers"
              payload: { legal_name: "RivalPay SA", service_scope: ["GROSS_TO_NET", "STATUTORY_FILING"], data_residency_regions: ["EU"], annual_fee_minor: 4000000, indemnity_cap_pct: 20.00 }
              as: PlatformAdmin
              as_user_id: "admin-01"
              captures: { prov_p2: "$.data.id" }
            - call: "POST /payroll/engagements"
              payload: { country_profile_id: "${cp_de}", provider_id: "${prov_p1}", service_scope: ["GROSS_TO_NET", "STATUTORY_FILING"], filing_responsibility: "PROVIDER", data_residency_region: "EU", pay_frequency: "MONTHLY" }
              as: PlatformAdmin
              as_user_id: "admin-01"
              captures: { eng_de: "$.data.id", eng_v0: "$.data.version" }
            - call: "POST /payroll/engagements/${eng_de}/residency-decision"
              payload: { decision: "APPROVE", residency_terms_ref: "DPA-DE-2026-01" }
              as: ComplianceAuditor
              as_user_id: "audit-01"
              captures: { eng_v1: "$.data.version" }
          trigger:
            - call: "POST /payroll/engagements/${eng_de}/transition-plan"
              payload: { incoming_provider_id: "${prov_p2}", cutover_period_start_date: "2026-10-01", cutover_period_end_date: "2026-11-01", parallel_run_cycles: 1, expected_engagement_version: "${eng_v0}" }
              as: PayrollController
              as_user_id: "ctrl-01"
          assert:
            - "HTTP 412 with error_id ERR_STALE_ENGAGEMENT_VERSION"
            - "eng_v0 == 1 and eng_v1 == 2"
            - "Engagement.${eng_de}.transition_incoming_provider_id is null and status is still ACTIVE"
            - "the identical body with expected_engagement_version ${eng_v1} returns 200, sets transition_incoming_provider_id to ${prov_p2} and takes the version to 3"

      - name: cascading_side_effect_chain_from_filing_sweep_to_cycle_hold
        claim_type: cascading_side_effects
        grounds:
          - state_machines.StatutoryFiling.PENDING_to_LATE.side_effects
          - state_machines.Provider.ACTIVE_to_PROBATION
        excluded_because:
          difficulty_instance: filing_sweep_cascades_penalty_exposure_to_provider_probation_and_hold
          rationale: "That difficulty instance already walks the whole four-level chain end to end - sweep marks the filing LATE, mints the penalty, pushes Provider.open_penalty_minor past the probation threshold, flips the provider to PROBATION and puts the engagement's draft cycles ON_HOLD - and asserts every intermediate field, so a separate corner instance would repeat the same trigger and the same assertions."

      - name: dual_variant_variance_basis_produces_two_different_verdicts
        claim_type: dual_variant_calculation
        grounds:
          - calculations.gross_to_net_variance.variants
        excluded_because:
          difficulty_instance: variance_basis_headcount_normalized_masks_five_pct_absolute_move
          rationale: "The variance calculation has exactly two variants and that difficulty instance drives both over the same data set, computing the ABSOLUTE_TOTAL and HEADCOUNT_NORMALIZED figures and showing the delta that flips the materiality verdict, which is precisely the both-variants-and-delta claim this layer row asks for."

      - name: rate_threshold_boundary_on_the_materiality_gate
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.gross_to_net_variance.constants
        excluded_because:
          difficulty_instance: variance_material_at_exactly_the_materiality_threshold
          rationale: "The threshold-boundary claim for the variance gate is fully covered there: the run sits exactly on materiality_pct with the gross delta exactly on materiality_floor_minor and is asserted material, and the neighbouring one-minor-unit-below case is asserted non-material, so both sides of the boundary are already pinned."

