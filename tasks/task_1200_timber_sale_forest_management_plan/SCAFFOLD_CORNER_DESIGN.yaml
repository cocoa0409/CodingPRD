            - { call: "POST /forestry/carbon-valuations", payload: { tract_id: "${tr_id}", expected_tract_version: "${tr_v}", annual_credits_tco2e: 1100, baseline_credits_tco2e: 250, price_cents_per_tco2e: 3000, estimated_timber_net_cents: 10000000, enrollment_start: "2027-01-01" }, as: Forester, as_user_id: "${f_id}", captures: { err: "$.data.error_id" } }
            - { call: "GET /forestry/tracts/${tr_id}", payload: {}, as: Forester, as_user_id: "${f_id}", captures: { tr_v2: "$.data.version" } }
            - { call: "POST /forestry/carbon-valuations", payload: { tract_id: "${tr_id}", expected_tract_version: "${tr_v2}", annual_credits_tco2e: 1100, baseline_credits_tco2e: 250, price_cents_per_tco2e: 3000, estimated_timber_net_cents: 10000000, enrollment_start: "2027-01-01" }, as: Forester, as_user_id: "${f_id}", captures: { cvb_id: "$.data.id" } }
