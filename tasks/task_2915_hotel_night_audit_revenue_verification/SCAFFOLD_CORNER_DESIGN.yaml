      - name: state_invalid_transitions_close_sequence_steps_refuse_to_run_out_of_order
        claim_type: invalid_transitions
        grounds: ["state_machines.BusinessDate.status", "validations[priority=32]", "validations[priority=33]", "validations[priority=34]", "validations[priority=36]", "validations[priority=37]"]
        distinguishing_aspect: "From a single freshly-created OPEN date, every close-sequence trigger except post-room-and-tax is attempted and each returns its own dedicated 409 - the sequence cannot be entered in the middle, and reopen on an OPEN date is refused too."
        test_recipe:
          setup: ["Standard property; a single OPEN business date 2026-08-01; no outlets and no folios, so nothing but the status gate can be the cause of a refusal."]
          setup_api_calls:
            - call: "POST /night-audit/properties"
              payload: { name: "Harbor Grand", room_count_total: 100, standard_room_rate_amount: 200.00, occupancy_tax_rate_pct: 8.875, fb_tax_rate_pct: 6.25, service_charge_pct: 18.0, large_ticket_threshold_amount: 472.00, large_party_discount_pct: 5.0, allowance_manager_threshold_amount: 250.00, allowance_controller_threshold_amount: 1000.00, rate_variance_tolerance_pct: 95.0, settlement_variance_tolerance_amount: 5.00, city_ledger_fee_pct: 1.5, late_checkout_grace_minutes: 30, card_authorization_valid_days: 7, no_show_charge_policy: "FIRST_NIGHT_PLUS_TAX" }
              as: PropertyAdmin
              as_user_id: "u_admin_1"
              captures: { prop_id: "$.data.id" }
            - call: "POST /night-audit/business-dates"
              payload: { property_id: "${prop_id}", business_date: "2026-08-01", out_of_order_room_count: 4 }
              as: NightAuditor
              as_user_id: "u_na_1"
              captures: { bd1_id: "$.data.id" }
          trigger: "POST /night-audit/business-dates/${bd1_id}/seal-charges as NightAuditor (X-User-ID u_na_1), on a date still in OPEN."
          assert:
            - "HTTP 409 with data.error_id == \"ERR_DATE_NOT_READY_TO_SEAL\"."
            - "POST /night-audit/business-dates/${bd1_id}/verify-settlements fails 409 ERR_DATE_NOT_READY_TO_VERIFY."
            - "POST /night-audit/business-dates/${bd1_id}/balance fails 409 ERR_DATE_NOT_READY_TO_BALANCE."
            - "POST /night-audit/business-dates/${bd1_id}/close fails 409 ERR_DATE_NOT_BALANCED."
            - "POST /night-audit/business-dates/${bd1_id}/reopen as Controller fails 409 ERR_DATE_NOT_CLOSED."
            - "GET /night-audit/business-dates/${bd1_id} still reads status == \"OPEN\" with version == 1 - five rejected triggers moved nothing."
            - "POST /night-audit/business-dates/${bd1_id}/post-room-and-tax then returns 200 and moves the date to ROOM_POSTING with version 2, proving the date itself was never wedged."

