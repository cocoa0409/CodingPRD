scaffold_corner_design:
  # =================================================================
  # Section: entities
  # =================================================================
  - section: entities
    instances:
      - name: patient_creation_defaults_and_hsa_cascade
        claim_type: creation_defaults
        grounds:
          - entities.Patient
          - entities.HSAAccount
        distinguishing_aspect: "New patient starts PENDING_VERIFICATION with version 1, and exactly one HSAAccount is cascade-created with balance == hsa_initial_credit_cents."
        test_recipe:
          setup: ["MCR plan exists and is active"]
          setup_api_calls:
            - { call: "POST /api/payer-plans", payload: { name: "Medicare DMEPOS", plan_type: MEDICARE_DMEPOS, coinsurance_pct: 0.20, cycle_months: 3, is_active: true }, as: PlatformAdmin, captures: { pln: $.data.id } }
            - { call: "POST /api/patients", payload: { full_name: "Pat ENT", date_of_birth: "1965-01-01", payer_plan_id: "${pln}", hsa_initial_credit_cents: 750 }, as: IntakeCoordinator, captures: { pt: $.data.id, pst: $.data.status, pver: $.data.version } }
          trigger:
            - { call: "GET /api/patients/${pt}/hsa-accounts", payload: {}, as: IntakeCoordinator, captures: { hbal: "$.data[0].balance_cents", hcnt: "$.data[0].patient_id" } }
          assert:
            - "Patient.${pt}.status == PENDING_VERIFICATION and version == 1"
            - "exactly one HSAAccount exists for the patient with balance_cents == 750 and patient_id == ${pt}"

      - name: patient_get_not_found_returns_404
        claim_type: not_found
        grounds:
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET with a well-formed but non-existent UUID yields ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /api/patients/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", payload: {}, as: IntakeCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_NOT_FOUND with http 404"

      - name: formulary_item_computed_unit_allowance_and_defaults
        claim_type: computed_fields
        grounds:
          - entities.FormularyItem.fields.unit_allowance_cents
          - calculations.unit_allowance_proration
        distinguishing_aspect: "unit_allowance_cents is computed (124.88 from pack 999/8); omitted requires_pa defaults to false and status defaults to ACTIVE."
        test_recipe:
          setup: ["MCR plan exists"]
          setup_api_calls:
            - { call: "POST /api/payer-plans", payload: { name: "Medicare DMEPOS", plan_type: MEDICARE_DMEPOS, coinsurance_pct: 0.20, cycle_months: 3, is_active: true }, as: PlatformAdmin, captures: { pln: $.data.id } }
          trigger:
            - { call: "POST /api/formulary-items", payload: { hcpcs_code: "A6250", name: "Wound dressing", category: WOUND, covered_plan_ids: ["${pln}"], pack_fee_cents: 999, pack_size: 8, retail_price_cents: 650, max_units_per_cycle: 30, size_codes: ["4X4"] }, as: PlatformAdmin, captures: { itm: $.data.id, unit: $.data.unit_allowance_cents, pa: $.data.requires_pa, st: $.data.status } }
          assert:
            - "FormularyItem.${itm}.unit_allowance_cents == 124.88 (round_half_up(999/8, 2))"
            - "requires_pa == false and status == ACTIVE (defaults applied)"

      - name: prescription_missing_required_field_returns_400
        claim_type: required_fields
        grounds:
          - errors[ERR_INVALID_REQUEST]
          - entities.Prescription
        distinguishing_aspect: "Omitting required hcpcs_code on Rx create yields ERR_INVALID_REQUEST (400) before any business rule runs."
        test_recipe:
          setup: ["MCR plan; ACTIVE patient"]
          setup_api_calls:
            - { call: "POST /api/payer-plans", payload: { name: "Medicare DMEPOS", plan_type: MEDICARE_DMEPOS, coinsurance_pct: 0.20, cycle_months: 3, is_active: true }, as: PlatformAdmin, captures: { pln: $.data.id } }
            - { call: "POST /api/patients", payload: { full_name: "Pat REQ", date_of_birth: "1967-03-03", payer_plan_id: "${pln}", hsa_initial_credit_cents: 0 }, as: IntakeCoordinator, captures: { pt: $.data.id } }
            - { call: "POST /api/patients/${pt}/verify-eligibility", payload: { eligible: true }, as: IntakeCoordinator }
          trigger:
            - { call: "POST /api/prescriptions", payload: { patient_id: "${pt}", prescriber_npi: "1234567890", monthly_quantity: 20, effective_date: "2026-05-01", expiration_date: "2026-11-01" }, as: IntakeCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST with http 400 (hcpcs_code missing)"

  # =================================================================
  # Section: state_machines
  # =================================================================
  - section: state_machines
    instances:
      - name: verify_eligibility_twice_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.Patient
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "verify-eligibility on an already-ACTIVE patient is an invalid-from transition: ERR_INVALID_STATE, no version bump."
        test_recipe:
          setup: ["ACTIVE patient"]
          setup_api_calls:
            - { call: "POST /api/payer-plans", payload: { name: "Medicare DMEPOS", plan_type: MEDICARE_DMEPOS, coinsurance_pct: 0.20, cycle_months: 3, is_active: true }, as: PlatformAdmin, captures: { pln: $.data.id } }
            - { call: "POST /api/patients", payload: { full_name: "Pat SM1", date_of_birth: "1954-08-08", payer_plan_id: "${pln}", hsa_initial_credit_cents: 0 }, as: IntakeCoordinator, captures: { pt: $.data.id } }
            - { call: "POST /api/patients/${pt}/verify-eligibility", payload: { eligible: true }, as: IntakeCoordinator, captures: { v1: $.data.version } }
          trigger:
            - { call: "POST /api/patients/${pt}/verify-eligibility", payload: { eligible: true }, as: IntakeCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE (ACTIVE has no verify-eligibility transition)"
            - "Patient.${pt}.version remains ${v1} (no mutation on rejection)"

      - name: resume_active_program_rejected
        claim_type: precondition_enforcement
        grounds:
          - state_machines.ResupplyProgram.SUSPENDED_to_ACTIVE
          - errors[ERR_PROGRAM_NOT_SUSPENDED]
        distinguishing_aspect: "resume requires SUSPENDED; on an ACTIVE program it fails with the dedicated ERR_PROGRAM_NOT_SUSPENDED, not generic ERR_INVALID_STATE."
        test_recipe:
          setup: ["ACTIVE patient with an ACTIVE OSTOMY program"]
          setup_api_calls:
            - { call: "POST /api/payer-plans", payload: { name: "Medicare DMEPOS", plan_type: MEDICARE_DMEPOS, coinsurance_pct: 0.20, cycle_months: 3, is_active: true }, as: PlatformAdmin, captures: { pln: $.data.id } }
            - { call: "POST /api/patients", payload: { full_name: "Pat SM2", date_of_birth: "1969-10-10", payer_plan_id: "${pln}", hsa_initial_credit_cents: 0 }, as: IntakeCoordinator, captures: { pt: $.data.id } }
            - { call: "POST /api/patients/${pt}/verify-eligibility", payload: { eligible: true }, as: IntakeCoordinator }
            - { call: "POST /api/resupply-programs", payload: { patient_id: "${pt}", category: OSTOMY, frequency_days: 30, start_date: "2026-05-01" }, as: IntakeCoordinator, captures: { prog: $.data.id } }
          trigger:
            - { call: "POST /api/resupply-programs/${prog}/resume", payload: {}, as: IntakeCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_PROGRAM_NOT_SUSPENDED"

      - name: release_backordered_shipment_rejected
        claim_type: precondition_enforcement
        grounds:
          - state_machines.Shipment.CREATED_to_READY
          - errors[ERR_SHIPMENT_BACKORDERED]
        distinguishing_aspect: "release on a BACKORDERED shipment (stock 2 < qty 5) fails with ERR_SHIPMENT_BACKORDERED; the shipment stays BACKORDERED."
        test_recipe:
          setup: ["MCR plan; ITM_OST stock 2; ACTIVE patient with Rx+fit; order qty 5 SUBMITTED; shipment created BACKORDERED"]
          setup_api_calls:
            - { call: "POST /api/payer-plans", payload: { name: "Medicare DMEPOS", plan_type: MEDICARE_DMEPOS, coinsurance_pct: 0.20, cycle_months: 3, is_active: true }, as: PlatformAdmin, captures: { pln: $.data.id } }
            - { call: "POST /api/formulary-items", payload: { hcpcs_code: "A4419", name: "Ostomy pouch", category: OSTOMY, covered_plan_ids: ["${pln}"], pack_fee_cents: 1850, pack_size: 10, retail_price_cents: 300, max_units_per_cycle: 60, requires_pa: false, size_codes: ["45MM"] }, as: PlatformAdmin, captures: { itm: $.data.id } }
            - { call: "POST /api/stock-levels", payload: { formulary_item_id: "${itm}", on_hand_qty: 2 }, as: PlatformAdmin }
            - { call: "POST /api/patients", payload: { full_name: "Pat SM3", date_of_birth: "1952-02-02", payer_plan_id: "${pln}", hsa_initial_credit_cents: 0 }, as: IntakeCoordinator, captures: { pt: $.data.id } }
            - { call: "POST /api/patients/${pt}/verify-eligibility", payload: { eligible: true }, as: IntakeCoordinator, captures: { pt_v: $.data.version } }
            - { call: "POST /api/prescriptions", payload: { patient_id: "${pt}", hcpcs_code: "A4419", prescriber_npi: "1234567890", diagnosis_codes: ["N39.3"], monthly_quantity: 20, effective_date: "2026-05-01", expiration_date: "2026-11-01" }, as: IntakeCoordinator }
            - { call: "POST /api/fit-profiles", payload: { patient_id: "${pt}", category: OSTOMY, size_code: "45MM", measured_on: "2026-04-20", expected_patient_version: "${pt_v}" }, as: IntakeCoordinator }
            - { call: "POST /api/orders", payload: { patient_id: "${pt}" }, as: Patient, as_user_id: "${pt}", captures: { ord: $.data.id, ord_v: $.data.version } }
            - { call: "POST /api/orders/${ord}/lines", payload: { formulary_item_id: "${itm}", size_code: "45MM", quantity: 5, expected_order_version: "${ord_v}" }, as: Patient, as_user_id: "${pt}" }
            - { call: "POST /api/orders/${ord}/submit", payload: {}, as: Patient, as_user_id: "${pt}" }
            - { call: "POST /api/shipments", payload: { order_id: "${ord}" }, as: FulfillmentAgent, captures: { shp: $.data.id, sst: $.data.status } }
          trigger:
            - { call: "POST /api/shipments/${shp}/release", payload: {}, as: FulfillmentAgent, captures: { err: $.data.error_id } }
          assert:
            - "Shipment.${shp} was created BACKORDERED (reserved 2, pending 3)"
            - "release -> error_id == ERR_SHIPMENT_BACKORDERED; status remains BACKORDERED"

      - name: claim_appeal_from_paid_rejected
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Claim.DENIED_to_APPEALED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "appeal is only valid from DENIED; on a PAID (terminal) claim it fails with ERR_INVALID_STATE."
        test_recipe:
          setup: ["delivered order with claim adjudicated PAID"]
          setup_api_calls:
            - { call: "POST /api/payer-plans", payload: { name: "Medicare DMEPOS", plan_type: MEDICARE_DMEPOS, coinsurance_pct: 0.20, cycle_months: 3, is_active: true }, as: PlatformAdmin, captures: { pln: $.data.id } }
            - { call: "POST /api/formulary-items", payload: { hcpcs_code: "A4419", name: "Ostomy pouch", category: OSTOMY, covered_plan_ids: ["${pln}"], pack_fee_cents: 1850, pack_size: 10, retail_price_cents: 300, max_units_per_cycle: 60, requires_pa: false, size_codes: ["45MM"] }, as: PlatformAdmin, captures: { itm: $.data.id } }
            - { call: "POST /api/stock-levels", payload: { formulary_item_id: "${itm}", on_hand_qty: 100 }, as: PlatformAdmin }
            - { call: "POST /api/patients", payload: { full_name: "Pat SM4", date_of_birth: "1958-12-12", payer_plan_id: "${pln}", hsa_initial_credit_cents: 0 }, as: IntakeCoordinator, captures: { pt: $.data.id } }
            - { call: "POST /api/patients/${pt}/verify-eligibility", payload: { eligible: true }, as: IntakeCoordinator, captures: { pt_v: $.data.version } }
            - { call: "POST /api/prescriptions", payload: { patient_id: "${pt}", hcpcs_code: "A4419", prescriber_npi: "1234567890", diagnosis_codes: ["N39.3"], monthly_quantity: 20, effective_date: "2026-05-01", expiration_date: "2026-11-01" }, as: IntakeCoordinator }
            - { call: "POST /api/fit-profiles", payload: { patient_id: "${pt}", category: OSTOMY, size_code: "45MM", measured_on: "2026-04-20", expected_patient_version: "${pt_v}" }, as: IntakeCoordinator }
            - { call: "POST /api/orders", payload: { patient_id: "${pt}" }, as: Patient, as_user_id: "${pt}", captures: { ord: $.data.id, ord_v: $.data.version } }
            - { call: "POST /api/orders/${ord}/lines", payload: { formulary_item_id: "${itm}", size_code: "45MM", quantity: 10, expected_order_version: "${ord_v}" }, as: Patient, as_user_id: "${pt}" }
            - { call: "POST /api/orders/${ord}/submit", payload: {}, as: Patient, as_user_id: "${pt}" }
            - { call: "POST /api/shipments", payload: { order_id: "${ord}" }, as: FulfillmentAgent, captures: { shp: $.data.id } }
            - { call: "POST /api/shipments/${shp}/release", payload: {}, as: FulfillmentAgent }
            - { call: "POST /api/shipments/${shp}/ship", payload: {}, as: FulfillmentAgent }
            - { call: "POST /api/shipments/${shp}/deliver", payload: {}, as: FulfillmentAgent }
            - { call: "POST /api/claims", payload: { order_id: "${ord}" }, as: BillingSpecialist, captures: { clm: $.data.id } }
            - { call: "POST /api/claims/${clm}/submit", payload: {}, as: BillingSpecialist }
            - { call: "POST /api/claims/${clm}/adjudicate", payload: { outcome: PAID }, as: BillingSpecialist }
          trigger:
            - { call: "POST /api/claims/${clm}/appeal", payload: {}, as: BillingSpecialist, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE (PAID is terminal; appeal requires DENIED)"

      - name: cancel_cancelled_order_returns_invalid_state
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.SupplyOrder
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Cancelling an already-CANCELLED order is rejected with ERR_INVALID_STATE and releases nothing twice."
        test_recipe:
          setup: ["ACTIVE patient with Rx+fit; DRAFT order cancelled once"]
          setup_api_calls:
            - { call: "POST /api/payer-plans", payload: { name: "Medicare DMEPOS", plan_type: MEDICARE_DMEPOS, coinsurance_pct: 0.20, cycle_months: 3, is_active: true }, as: PlatformAdmin, captures: { pln: $.data.id } }
            - { call: "POST /api/formulary-items", payload: { hcpcs_code: "A4419", name: "Ostomy pouch", category: OSTOMY, covered_plan_ids: ["${pln}"], pack_fee_cents: 1850, pack_size: 10, retail_price_cents: 300, max_units_per_cycle: 60, requires_pa: false, size_codes: ["45MM"] }, as: PlatformAdmin, captures: { itm: $.data.id } }
            - { call: "POST /api/patients", payload: { full_name: "Pat SM5", date_of_birth: "1976-07-07", payer_plan_id: "${pln}", hsa_initial_credit_cents: 0 }, as: IntakeCoordinator, captures: { pt: $.data.id } }
            - { call: "POST /api/patients/${pt}/verify-eligibility", payload: { eligible: true }, as: IntakeCoordinator, captures: { pt_v: $.data.version } }
            - { call: "POST /api/orders", payload: { patient_id: "${pt}" }, as: Patient, as_user_id: "${pt}", captures: { ord: $.data.id } }
            - { call: "POST /api/orders/${ord}/cancel", payload: {}, as: Patient, as_user_id: "${pt}" }
          trigger:
            - { call: "POST /api/orders/${ord}/cancel", payload: {}, as: Patient, as_user_id: "${pt}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE (second cancel on CANCELLED order)"

      - name: confirm_cycle_before_window_covered
        claim_type: precondition_enforcement
        grounds:
          - errors[ERR_RESUPPLY_WINDOW_NOT_OPEN]
        excluded_because:
          difficulty_instance: resupply_window_exact_day_boundary
          rationale: "The one-day-before case (2026-06-01 -> ERR_RESUPPLY_WINDOW_NOT_OPEN) is the negative half of the named §1.8 boundary instance's trigger chain."

      - name: order_cancel_cascade_releases_stock
        claim_type: side_effect_execution
        grounds:
          - state_machines.SupplyOrder.IN_FULFILLMENT_to_CANCELLED
        excluded_because:
          difficulty_instance: stock_reserve_release_conservation
          rationale: "Cancellation releasing reserved stock and returning available_qty to 100 is asserted by the named §1.8 compensating-invariant instance."

  # =================================================================
  # Section: calculations
  # =================================================================
  - section: calculations
    instances:
      - name: backorder_fifo_partial_allocation
        claim_type: waterfall_allocation
        grounds:
          - calculations.backorder_allocation
          - entities.BackorderReservation
        distinguishing_aspect: "Restock waterfall honors created_at FIFO with partial fill: earlier reservation (pending 3) fully allocates; later one (pending 4) receives the remaining 2 and stays PARTIALLY_ALLOCATED with quantity_pending == 2."
        test_recipe:
          setup:
            - "MCR plan; ITM_OST stock 10; ACTIVE patient with Rx+fit"
            - "Order A qty 8 (fully reserved, no reservation row); order B qty 5 (reserved 2, reservation pending 3); order C qty 4 (reserved 0, reservation pending 4)"
            - "Shipments B and C are BACKORDERED"
          setup_api_calls:
            - { call: "POST /api/payer-plans", payload: { name: "Medicare DMEPOS", plan_type: MEDICARE_DMEPOS, coinsurance_pct: 0.20, cycle_months: 3, is_active: true }, as: PlatformAdmin, captures: { pln: $.data.id } }
            - { call: "POST /api/formulary-items", payload: { hcpcs_code: "A4419", name: "Ostomy pouch", category: OSTOMY, covered_plan_ids: ["${pln}"], pack_fee_cents: 1850, pack_size: 10, retail_price_cents: 300, max_units_per_cycle: 60, requires_pa: false, size_codes: ["45MM"] }, as: PlatformAdmin, captures: { itm: $.data.id } }
            - { call: "POST /api/stock-levels", payload: { formulary_item_id: "${itm}", on_hand_qty: 10 }, as: PlatformAdmin, captures: { stk: $.data.id } }
            - { call: "POST /api/patients", payload: { full_name: "Pat BO", date_of_birth: "1951-05-05", payer_plan_id: "${pln}", hsa_initial_credit_cents: 0 }, as: IntakeCoordinator, captures: { pt: $.data.id } }
            - { call: "POST /api/patients/${pt}/verify-eligibility", payload: { eligible: true }, as: IntakeCoordinator, captures: { pt_v: $.data.version } }
            - { call: "POST /api/prescriptions", payload: { patient_id: "${pt}", hcpcs_code: "A4419", prescriber_npi: "1234567890", diagnosis_codes: ["N39.3"], monthly_quantity: 20, effective_date: "2026-05-01", expiration_date: "2026-11-01" }, as: IntakeCoordinator }
            - { call: "POST /api/fit-profiles", payload: { patient_id: "${pt}", category: OSTOMY, size_code: "45MM", measured_on: "2026-04-20", expected_patient_version: "${pt_v}" }, as: IntakeCoordinator }
            - { call: "POST /api/orders", payload: { patient_id: "${pt}" }, as: Patient, as_user_id: "${pt}", captures: { oa: $.data.id, oa_v: $.data.version } }
            - { call: "POST /api/orders/${oa}/lines", payload: { formulary_item_id: "${itm}", size_code: "45MM", quantity: 8, expected_order_version: "${oa_v}" }, as: Patient, as_user_id: "${pt}" }
            - { call: "POST /api/orders/${oa}/submit", payload: {}, as: Patient, as_user_id: "${pt}" }
            - { call: "POST /api/shipments", payload: { order_id: "${oa}" }, as: FulfillmentAgent }
            - { call: "POST /api/orders", payload: { patient_id: "${pt}" }, as: Patient, as_user_id: "${pt}", captures: { ob: $.data.id, ob_v: $.data.version } }
            - { call: "POST /api/orders/${ob}/lines", payload: { formulary_item_id: "${itm}", size_code: "45MM", quantity: 5, expected_order_version: "${ob_v}" }, as: Patient, as_user_id: "${pt}", captures: { lb: $.data.id } }
            - { call: "POST /api/orders/${ob}/submit", payload: {}, as: Patient, as_user_id: "${pt}" }
            - { call: "POST /api/shipments", payload: { order_id: "${ob}" }, as: FulfillmentAgent, captures: { sb: $.data.id } }
            - { call: "POST /api/orders", payload: { patient_id: "${pt}" }, as: Patient, as_user_id: "${pt}", captures: { oc: $.data.id, oc_v: $.data.version } }
            - { call: "POST /api/orders/${oc}/lines", payload: { formulary_item_id: "${itm}", size_code: "45MM", quantity: 4, expected_order_version: "${oc_v}" }, as: Patient, as_user_id: "${pt}", captures: { lc: $.data.id } }
            - { call: "POST /api/orders/${oc}/submit", payload: {}, as: Patient, as_user_id: "${pt}" }
            - { call: "POST /api/shipments", payload: { order_id: "${oc}" }, as: FulfillmentAgent, captures: { sc: $.data.id } }
          trigger:
            - { call: "POST /api/stock-levels/${stk}/restock", payload: { qty_added: 5 }, as: PlatformAdmin, captures: { avail: $.data.available_qty, res: $.data.reserved_qty, onh: $.data.on_hand_qty } }
            - { call: "GET /api/order-lines/${lb}/backorder-reservations", payload: {}, as: FulfillmentAgent, captures: { rb_st: "$.data[0].status", rb_pend: "$.data[0].quantity_pending", rb_alloc: "$.data[0].quantity_allocated" } }
            - { call: "GET /api/order-lines/${lc}/backorder-reservations", payload: {}, as: FulfillmentAgent, captures: { rc_st: "$.data[0].status", rc_pend: "$.data[0].quantity_pending", rc_alloc: "$.data[0].quantity_allocated" } }
            - { call: "GET /api/shipments/${sb}", payload: {}, as: FulfillmentAgent, captures: { sb_st: $.data.status } }
            - { call: "GET /api/shipments/${sc}", payload: {}, as: FulfillmentAgent, captures: { sc_st: $.data.status } }
          assert:
            - "reservation for line B: status ALLOCATED, quantity_pending 0, quantity_allocated 3 (earlier created_at served first)"
            - "reservation for line C: status PARTIALLY_ALLOCATED, quantity_pending 2, quantity_allocated 2 (remainder after B)"
            - "StockLevel: on_hand_qty == 15, reserved_qty == 15, available_qty == 0"
            - "Shipment.${sb}.status == CREATED (fully allocated); Shipment.${sc}.status == BACKORDERED (still short 2)"

      - name: hsa_running_balance_mixed_entries
        claim_type: correct_result
        grounds:
          - calculations.hsa_balance
        distinguishing_aspect: "Aggregation correctness across mixed entry types: initial 1000, CREDIT 300, DEBIT 100, DEBIT 50 -> balance exactly 1150."
        test_recipe:
          setup: ["ACTIVE CASH patient with HSA initial 1000"]
          setup_api_calls:
            - { call: "POST /api/payer-plans", payload: { name: "Self-Pay HSA", plan_type: CASH_HSA, coinsurance_pct: 1.00, cycle_months: 1, is_active: true }, as: PlatformAdmin, captures: { pln: $.data.id } }
            - { call: "POST /api/patients", payload: { full_name: "Pat RUN", date_of_birth: "1981-01-31", payer_plan_id: "${pln}", hsa_initial_credit_cents: 1000 }, as: IntakeCoordinator, captures: { pt: $.data.id } }
            - { call: "POST /api/patients/${pt}/verify-eligibility", payload: { eligible: true }, as: IntakeCoordinator }
            - { call: "GET /api/patients/${pt}/hsa-accounts", payload: {}, as: BillingSpecialist, captures: { hsa: "$.data[0].id" } }
          trigger:
            - { call: "POST /api/hsa-accounts/${hsa}/credits", payload: { amount_cents: 300, reason: "deposit" }, as: BillingSpecialist }
            - { call: "POST /api/hsa-accounts/${hsa}/debits", payload: { amount_cents: 100, reason: "copay" }, as: BillingSpecialist }
            - { call: "POST /api/hsa-accounts/${hsa}/debits", payload: { amount_cents: 50, reason: "copay2" }, as: BillingSpecialist }
            - { call: "GET /api/hsa-accounts/${hsa}", payload: {}, as: BillingSpecialist, captures: { bal: $.data.balance_cents } }
          assert:
            - "HSAAccount.${hsa}.balance_cents == 1150 (1000 + 300 - 100 - 50)"

      - name: sample_rolling_window_third_rejected_then_allowed
        claim_type: boundary_edge
        grounds:
          - calculations.sample_window_count
          - errors[ERR_SAMPLE_LIMIT_EXCEEDED]
        distinguishing_aspect: "Closed 90-day lookback: the 3rd sample within the window fails (count >= 2); after the clock slides so only 1 sample remains inside [today-90d, today], creation succeeds again."
        test_recipe:
          setup: ["ACTIVE patient; two OSTOMY samples created at 2026-05-01 and 2026-05-10"]
          setup_api_calls:
            - { call: "POST /api/payer-plans", payload: { name: "Medicare DMEPOS", plan_type: MEDICARE_DMEPOS, coinsurance_pct: 0.20, cycle_months: 3, is_active: true }, as: PlatformAdmin, captures: { pln: $.data.id } }
            - { call: "POST /api/patients", payload: { full_name: "Pat SAM", date_of_birth: "1960-06-06", payer_plan_id: "${pln}", hsa_initial_credit_cents: 0 }, as: IntakeCoordinator, captures: { pt: $.data.id } }
            - { call: "POST /api/patients/${pt}/verify-eligibility", payload: { eligible: true }, as: IntakeCoordinator }
            - { call: "POST /api/fitting-samples", payload: { patient_id: "${pt}", category: OSTOMY, size_code: "45MM", item_name: "Pouch sample" }, as: IntakeCoordinator }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-05-10T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /api/fitting-samples", payload: { patient_id: "${pt}", category: OSTOMY, size_code: "45MM", item_name: "Barrier sample" }, as: IntakeCoordinator }
          trigger:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-05-20T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /api/fitting-samples", payload: { patient_id: "${pt}", category: OSTOMY, size_code: "45MM", item_name: "Third sample" }, as: IntakeCoordinator, captures: { err: $.data.error_id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /api/fitting-samples", payload: { patient_id: "${pt}", category: OSTOMY, size_code: "45MM", item_name: "Later sample" }, as: IntakeCoordinator, captures: { smp: $.data.id, prc: $.data.unit_price_cents } }
          assert:
            - "3rd sample at 2026-05-20 (2 samples in closed 90-day window) -> error_id == ERR_SAMPLE_LIMIT_EXCEEDED"
            - "at 2026-08-10 both earlier samples are older than 90 days (window starts 2026-05-12) -> creation succeeds"
            - "FittingSample.${smp}.unit_price_cents == 0 (samples are never billed)"

  # =================================================================
  # Section: validations
  # =================================================================
  - section: validations
    instances:
      - name: missing_auth_headers_returns_unauthenticated
        claim_type: violation_to_error
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "A request with no X-User-Role/X-User-ID is rejected 401 ERR_UNAUTHENTICATED before any other check (priority 1)."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /api/patients/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", payload: {}, as: "", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_UNAUTHENTICATED with http 401 (auth precedes the 404 the path would otherwise yield)"

      - name: duplicate_active_program_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=6]
          - errors[ERR_DUPLICATE_PROGRAM]
        distinguishing_aspect: "Second ACTIVE program for the same patient+category is rejected ERR_DUPLICATE_PROGRAM; a different category succeeds."
        test_recipe:
          setup: ["ACTIVE patient with an ACTIVE OSTOMY program"]
          setup_api_calls:
            - { call: "POST /api/payer-plans", payload: { name: "Medicare DMEPOS", plan_type: MEDICARE_DMEPOS, coinsurance_pct: 0.20, cycle_months: 3, is_active: true }, as: PlatformAdmin, captures: { pln: $.data.id } }
            - { call: "POST /api/patients", payload: { full_name: "Pat DUP", date_of_birth: "1959-09-09", payer_plan_id: "${pln}", hsa_initial_credit_cents: 0 }, as: IntakeCoordinator, captures: { pt: $.data.id } }
            - { call: "POST /api/patients/${pt}/verify-eligibility", payload: { eligible: true }, as: IntakeCoordinator }
            - { call: "POST /api/resupply-programs", payload: { patient_id: "${pt}", category: OSTOMY, frequency_days: 30, start_date: "2026-05-01" }, as: IntakeCoordinator }
          trigger:
            - { call: "POST /api/resupply-programs", payload: { patient_id: "${pt}", category: OSTOMY, frequency_days: 14, start_date: "2026-05-01" }, as: IntakeCoordinator, captures: { err: $.data.error_id } }
            - { call: "POST /api/resupply-programs", payload: { patient_id: "${pt}", category: WOUND, frequency_days: 14, start_date: "2026-05-01" }, as: IntakeCoordinator, captures: { prog2: $.data.id } }
          assert:
            - "duplicate OSTOMY program -> error_id == ERR_DUPLICATE_PROGRAM (409)"
            - "WOUND program for the same patient succeeds (${prog2} created, status ACTIVE)"

      - name: medicare_rx_without_diagnosis_rejected
        claim_type: conditional_validation
        grounds:
          - validations[priority=5]
          - errors[ERR_DIAGNOSIS_REQUIRED]
        distinguishing_aspect: "Conditional on plan type: Rx without diagnosis_codes fails for a MEDICARE_DMEPOS patient (ERR_DIAGNOSIS_REQUIRED) but succeeds identically for a CASH_HSA patient."
        test_recipe:
          setup: ["MCR and CASH plans; one ACTIVE patient on each"]
          setup_api_calls:
            - { call: "POST /api/payer-plans", payload: { name: "Medicare DMEPOS", plan_type: MEDICARE_DMEPOS, coinsurance_pct: 0.20, cycle_months: 3, is_active: true }, as: PlatformAdmin, captures: { pln_mcr: $.data.id } }
            - { call: "POST /api/payer-plans", payload: { name: "Self-Pay HSA", plan_type: CASH_HSA, coinsurance_pct: 1.00, cycle_months: 1, is_active: true }, as: PlatformAdmin, captures: { pln_cash: $.data.id } }
            - { call: "POST /api/patients", payload: { full_name: "Pat M", date_of_birth: "1955-11-11", payer_plan_id: "${pln_mcr}", hsa_initial_credit_cents: 0 }, as: IntakeCoordinator, captures: { ptm: $.data.id } }
            - { call: "POST /api/patients/${ptm}/verify-eligibility", payload: { eligible: true }, as: IntakeCoordinator }
            - { call: "POST /api/patients", payload: { full_name: "Pat C", date_of_birth: "1985-04-04", payer_plan_id: "${pln_cash}", hsa_initial_credit_cents: 0 }, as: IntakeCoordinator, captures: { ptc: $.data.id } }
            - { call: "POST /api/patients/${ptc}/verify-eligibility", payload: { eligible: true }, as: IntakeCoordinator }
          trigger:
            - { call: "POST /api/prescriptions", payload: { patient_id: "${ptm}", hcpcs_code: "A4419", prescriber_npi: "1234567890", monthly_quantity: 20, effective_date: "2026-05-01", expiration_date: "2026-11-01" }, as: IntakeCoordinator, captures: { err: $.data.error_id } }
            - { call: "POST /api/prescriptions", payload: { patient_id: "${ptc}", hcpcs_code: "A4419", prescriber_npi: "1234567890", monthly_quantity: 20, effective_date: "2026-05-01", expiration_date: "2026-11-01" }, as: IntakeCoordinator, captures: { rx: $.data.id } }
          assert:
            - "MEDICARE_DMEPOS patient without diagnosis_codes -> error_id == ERR_DIAGNOSIS_REQUIRED"
            - "CASH_HSA patient with identical payload succeeds (Prescription.${rx} created)"

      - name: size_mismatch_with_valid_rx_isolated
        claim_type: violation_to_error
        grounds:
          - validations[priority=6]
          - errors[ERR_SIZE_MISMATCH]
        distinguishing_aspect: "With a valid Rx in place (safety passes), a line whose size differs from the CURRENT fit profile fails with ERR_SIZE_MISMATCH (constraint checked in isolation)."
        test_recipe:
          setup: ["MCR plan; ITM_OST offers [45MM, 57MM]; ACTIVE patient with valid Rx A4419 and CURRENT OSTOMY profile 45MM; DRAFT order"]
          setup_api_calls:
            - { call: "POST /api/payer-plans", payload: { name: "Medicare DMEPOS", plan_type: MEDICARE_DMEPOS, coinsurance_pct: 0.20, cycle_months: 3, is_active: true }, as: PlatformAdmin, captures: { pln: $.data.id } }
            - { call: "POST /api/formulary-items", payload: { hcpcs_code: "A4419", name: "Ostomy pouch", category: OSTOMY, covered_plan_ids: ["${pln}"], pack_fee_cents: 1850, pack_size: 10, retail_price_cents: 300, max_units_per_cycle: 60, requires_pa: false, size_codes: ["45MM", "57MM"] }, as: PlatformAdmin, captures: { itm: $.data.id } }
            - { call: "POST /api/patients", payload: { full_name: "Pat SZ", date_of_birth: "1963-03-13", payer_plan_id: "${pln}", hsa_initial_credit_cents: 0 }, as: IntakeCoordinator, captures: { pt: $.data.id } }
            - { call: "POST /api/patients/${pt}/verify-eligibility", payload: { eligible: true }, as: IntakeCoordinator, captures: { pt_v: $.data.version } }
            - { call: "POST /api/prescriptions", payload: { patient_id: "${pt}", hcpcs_code: "A4419", prescriber_npi: "1234567890", diagnosis_codes: ["N39.3"], monthly_quantity: 20, effective_date: "2026-05-01", expiration_date: "2026-11-01" }, as: IntakeCoordinator }
            - { call: "POST /api/fit-profiles", payload: { patient_id: "${pt}", category: OSTOMY, size_code: "45MM", measured_on: "2026-04-20", expected_patient_version: "${pt_v}" }, as: IntakeCoordinator }
            - { call: "POST /api/orders", payload: { patient_id: "${pt}" }, as: Patient, as_user_id: "${pt}", captures: { ord: $.data.id, ord_v: $.data.version } }
          trigger:
            - { call: "POST /api/orders/${ord}/lines", payload: { formulary_item_id: "${itm}", size_code: "57MM", quantity: 1, expected_order_version: "${ord_v}" }, as: Patient, as_user_id: "${pt}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_SIZE_MISMATCH (57MM offered by item but != CURRENT profile 45MM)"

      - name: item_not_on_plan_formulary_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=6]
          - errors[ERR_ITEM_NOT_ON_FORMULARY]
        distinguishing_aspect: "Line for an item whose covered_plan_ids excludes the patient's plan fails ERR_ITEM_NOT_ON_FORMULARY even with valid Rx and fit."
        test_recipe:
          setup: ["MCR plan and COM plan; ITM_OST covers COM only; ACTIVE MCR patient with valid Rx+fit; DRAFT order"]
          setup_api_calls:
            - { call: "POST /api/payer-plans", payload: { name: "Medicare DMEPOS", plan_type: MEDICARE_DMEPOS, coinsurance_pct: 0.20, cycle_months: 3, is_active: true }, as: PlatformAdmin, captures: { pln_mcr: $.data.id } }
            - { call: "POST /api/payer-plans", payload: { name: "Commercial PPO", plan_type: COMMERCIAL, coinsurance_pct: 0.10, cycle_months: 1, is_active: true }, as: PlatformAdmin, captures: { pln_com: $.data.id } }
            - { call: "POST /api/formulary-items", payload: { hcpcs_code: "A4419", name: "Ostomy pouch", category: OSTOMY, covered_plan_ids: ["${pln_com}"], pack_fee_cents: 1850, pack_size: 10, retail_price_cents: 300, max_units_per_cycle: 60, requires_pa: false, size_codes: ["45MM"] }, as: PlatformAdmin, captures: { itm: $.data.id } }
            - { call: "POST /api/patients", payload: { full_name: "Pat NF", date_of_birth: "1972-08-18", payer_plan_id: "${pln_mcr}", hsa_initial_credit_cents: 0 }, as: IntakeCoordinator, captures: { pt: $.data.id } }
            - { call: "POST /api/patients/${pt}/verify-eligibility", payload: { eligible: true }, as: IntakeCoordinator, captures: { pt_v: $.data.version } }
            - { call: "POST /api/prescriptions", payload: { patient_id: "${pt}", hcpcs_code: "A4419", prescriber_npi: "1234567890", diagnosis_codes: ["N39.3"], monthly_quantity: 20, effective_date: "2026-05-01", expiration_date: "2026-11-01" }, as: IntakeCoordinator }
            - { call: "POST /api/fit-profiles", payload: { patient_id: "${pt}", category: OSTOMY, size_code: "45MM", measured_on: "2026-04-20", expected_patient_version: "${pt_v}" }, as: IntakeCoordinator }
            - { call: "POST /api/orders", payload: { patient_id: "${pt}" }, as: Patient, as_user_id: "${pt}", captures: { ord: $.data.id, ord_v: $.data.version } }
          trigger:
            - { call: "POST /api/orders/${ord}/lines", payload: { formulary_item_id: "${itm}", size_code: "45MM", quantity: 1, expected_order_version: "${ord_v}" }, as: Patient, as_user_id: "${pt}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_ITEM_NOT_ON_FORMULARY (patient's MCR plan not in covered_plan_ids)"

      - name: quantity_exceeds_allowance_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=6]
          - calculations.resupply_quantity_allowance
          - errors[ERR_QUANTITY_EXCEEDS_ALLOWANCE]
        distinguishing_aspect: "Manual line quantity 70 exceeds the allowance min(20x3=60, 60) = 60 -> ERR_QUANTITY_EXCEEDS_ALLOWANCE; quantity exactly 60 passes."
        test_recipe:
          setup: ["MCR plan; ITM_OST max 60; ACTIVE patient with Rx monthly 20 and fit 45MM; DRAFT order"]
          setup_api_calls:
            - { call: "POST /api/payer-plans", payload: { name: "Medicare DMEPOS", plan_type: MEDICARE_DMEPOS, coinsurance_pct: 0.20, cycle_months: 3, is_active: true }, as: PlatformAdmin, captures: { pln: $.data.id } }
            - { call: "POST /api/formulary-items", payload: { hcpcs_code: "A4419", name: "Ostomy pouch", category: OSTOMY, covered_plan_ids: ["${pln}"], pack_fee_cents: 1850, pack_size: 10, retail_price_cents: 300, max_units_per_cycle: 60, requires_pa: false, size_codes: ["45MM"] }, as: PlatformAdmin, captures: { itm: $.data.id } }
            - { call: "POST /api/patients", payload: { full_name: "Pat QTY", date_of_birth: "1966-06-16", payer_plan_id: "${pln}", hsa_initial_credit_cents: 0 }, as: IntakeCoordinator, captures: { pt: $.data.id } }
            - { call: "POST /api/patients/${pt}/verify-eligibility", payload: { eligible: true }, as: IntakeCoordinator, captures: { pt_v: $.data.version } }
            - { call: "POST /api/prescriptions", payload: { patient_id: "${pt}", hcpcs_code: "A4419", prescriber_npi: "1234567890", diagnosis_codes: ["N39.3"], monthly_quantity: 20, effective_date: "2026-05-01", expiration_date: "2026-11-01" }, as: IntakeCoordinator }
            - { call: "POST /api/fit-profiles", payload: { patient_id: "${pt}", category: OSTOMY, size_code: "45MM", measured_on: "2026-04-20", expected_patient_version: "${pt_v}" }, as: IntakeCoordinator }
            - { call: "POST /api/orders", payload: { patient_id: "${pt}" }, as: Patient, as_user_id: "${pt}", captures: { ord: $.data.id, ord_v: $.data.version } }
          trigger:
            - { call: "POST /api/orders/${ord}/lines", payload: { formulary_item_id: "${itm}", size_code: "45MM", quantity: 70, expected_order_version: "${ord_v}" }, as: Patient, as_user_id: "${pt}", captures: { err: $.data.error_id } }
            - { call: "GET /api/orders/${ord}", payload: {}, as: Patient, as_user_id: "${pt}", captures: { ov: $.data.version } }
            - { call: "POST /api/orders/${ord}/lines", payload: { formulary_item_id: "${itm}", size_code: "45MM", quantity: 60, expected_order_version: "${ov}" }, as: Patient, as_user_id: "${pt}", captures: { ln: $.data.id } }
          assert:
            - "quantity 70 -> error_id == ERR_QUANTITY_EXCEEDS_ALLOWANCE (allowance 60)"
            - "quantity 60 (exactly the allowance) succeeds; OrderLine.${ln}.quantity == 60"

      - name: confirm_cycle_with_no_eligible_item_rejected
        claim_type: violation_to_error
        grounds:
          - errors[ERR_NO_ELIGIBLE_ITEM]
          - state_machines.ResupplyProgram.ACTIVE_to_ACTIVE
        distinguishing_aspect: "Selector empty-pool fallback: program category INCONTINENCE but no ACTIVE INCONTINENCE item covers the patient's plan -> ERR_NO_ELIGIBLE_ITEM."
        test_recipe:
          setup: ["MCR plan; only an OSTOMY item exists; ACTIVE patient with INCONTINENCE program starting 2026-05-01"]
          setup_api_calls:
            - { call: "POST /api/payer-plans", payload: { name: "Medicare DMEPOS", plan_type: MEDICARE_DMEPOS, coinsurance_pct: 0.20, cycle_months: 3, is_active: true }, as: PlatformAdmin, captures: { pln: $.data.id } }
            - { call: "POST /api/formulary-items", payload: { hcpcs_code: "A4419", name: "Ostomy pouch", category: OSTOMY, covered_plan_ids: ["${pln}"], pack_fee_cents: 1850, pack_size: 10, retail_price_cents: 300, max_units_per_cycle: 60, requires_pa: false, size_codes: ["45MM"] }, as: PlatformAdmin }
            - { call: "POST /api/patients", payload: { full_name: "Pat NE", date_of_birth: "1957-07-27", payer_plan_id: "${pln}", hsa_initial_credit_cents: 0 }, as: IntakeCoordinator, captures: { pt: $.data.id } }
            - { call: "POST /api/patients/${pt}/verify-eligibility", payload: { eligible: true }, as: IntakeCoordinator }
            - { call: "POST /api/resupply-programs", payload: { patient_id: "${pt}", category: INCONTINENCE, frequency_days: 30, start_date: "2026-05-01" }, as: IntakeCoordinator, captures: { prog: $.data.id } }
          trigger:
            - { call: "POST /api/resupply-programs/${prog}/confirm-cycle", payload: {}, as: Patient, as_user_id: "${pt}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_NO_ELIGIBLE_ITEM (selector pool empty for INCONTINENCE)"

      - name: duplicate_stock_level_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=6]
          - errors[ERR_DUPLICATE_STOCK_LEVEL]
        distinguishing_aspect: "Exactly one StockLevel per item: second create for the same formulary_item_id -> ERR_DUPLICATE_STOCK_LEVEL."
        test_recipe:
          setup: ["MCR plan; ITM_OST with an existing StockLevel"]
          setup_api_calls:
            - { call: "POST /api/payer-plans", payload: { name: "Medicare DMEPOS", plan_type: MEDICARE_DMEPOS, coinsurance_pct: 0.20, cycle_months: 3, is_active: true }, as: PlatformAdmin, captures: { pln: $.data.id } }
            - { call: "POST /api/formulary-items", payload: { hcpcs_code: "A4419", name: "Ostomy pouch", category: OSTOMY, covered_plan_ids: ["${pln}"], pack_fee_cents: 1850, pack_size: 10, retail_price_cents: 300, max_units_per_cycle: 60, requires_pa: false, size_codes: ["45MM"] }, as: PlatformAdmin, captures: { itm: $.data.id } }
            - { call: "POST /api/stock-levels", payload: { formulary_item_id: "${itm}", on_hand_qty: 50 }, as: PlatformAdmin }
          trigger:
            - { call: "POST /api/stock-levels", payload: { formulary_item_id: "${itm}", on_hand_qty: 25 }, as: PlatformAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_DUPLICATE_STOCK_LEVEL (409)"

      - name: reversal_of_non_debit_entry_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=4]
          - errors[ERR_HSA_ENTRY_NOT_REVERSIBLE]
        distinguishing_aspect: "A REVERSAL credit whose reverses_entry_id points at a CREDIT (not a POSTED DEBIT) fails ERR_HSA_ENTRY_NOT_REVERSIBLE."
        test_recipe:
          setup: ["ACTIVE CASH patient; HSA has one plain CREDIT entry"]
          setup_api_calls:
            - { call: "POST /api/payer-plans", payload: { name: "Self-Pay HSA", plan_type: CASH_HSA, coinsurance_pct: 1.00, cycle_months: 1, is_active: true }, as: PlatformAdmin, captures: { pln: $.data.id } }
            - { call: "POST /api/patients", payload: { full_name: "Pat REV", date_of_birth: "1974-02-14", payer_plan_id: "${pln}", hsa_initial_credit_cents: 1000 }, as: IntakeCoordinator, captures: { pt: $.data.id } }
            - { call: "POST /api/patients/${pt}/verify-eligibility", payload: { eligible: true }, as: IntakeCoordinator }
            - { call: "GET /api/patients/${pt}/hsa-accounts", payload: {}, as: BillingSpecialist, captures: { hsa: "$.data[0].id" } }
            - { call: "POST /api/hsa-accounts/${hsa}/credits", payload: { amount_cents: 100, reason: "deposit" }, as: BillingSpecialist, captures: { cr: $.data.id } }
          trigger:
            - { call: "POST /api/hsa-accounts/${hsa}/credits", payload: { amount_cents: 100, reason: "bogus reversal", reverses_entry_id: "${cr}" }, as: BillingSpecialist, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_HSA_ENTRY_NOT_REVERSIBLE (target entry is a CREDIT, not a POSTED DEBIT)"

      - name: release_with_expired_approved_pa_rejected
        claim_type: temporal_validation
        grounds:
          - validations[priority=7]
          - errors[ERR_PRIOR_AUTH_EXPIRED]
        distinguishing_aspect: "An APPROVED PA whose closed window ended before the release date yields ERR_PRIOR_AUTH_EXPIRED (distinct from ERR_PRIOR_AUTH_REQUIRED when no APPROVED PA exists at all)."
        test_recipe:
          setup: ["MCR plan; ITM_WND requires_pa, stock 100; ACTIVE patient with Rx A6250 + fit 4X4; APPROVED PA window [2026-05-01, 2026-05-31]; order qty 5 SUBMITTED, shipment CREATED; clock 2026-06-15"]
          setup_api_calls:
            - { call: "POST /api/payer-plans", payload: { name: "Medicare DMEPOS", plan_type: MEDICARE_DMEPOS, coinsurance_pct: 0.20, cycle_months: 3, is_active: true }, as: PlatformAdmin, captures: { pln: $.data.id } }
            - { call: "POST /api/formulary-items", payload: { hcpcs_code: "A6250", name: "Wound dressing", category: WOUND, covered_plan_ids: ["${pln}"], pack_fee_cents: 999, pack_size: 8, retail_price_cents: 650, max_units_per_cycle: 30, requires_pa: true, size_codes: ["4X4"] }, as: PlatformAdmin, captures: { itm: $.data.id } }
            - { call: "POST /api/stock-levels", payload: { formulary_item_id: "${itm}", on_hand_qty: 100 }, as: PlatformAdmin }
            - { call: "POST /api/patients", payload: { full_name: "Pat EXP", date_of_birth: "1953-10-30", payer_plan_id: "${pln}", hsa_initial_credit_cents: 0 }, as: IntakeCoordinator, captures: { pt: $.data.id } }
            - { call: "POST /api/patients/${pt}/verify-eligibility", payload: { eligible: true }, as: IntakeCoordinator, captures: { pt_v: $.data.version } }
            - { call: "POST /api/prescriptions", payload: { patient_id: "${pt}", hcpcs_code: "A6250", prescriber_npi: "1234567890", diagnosis_codes: ["L89.1"], monthly_quantity: 20, effective_date: "2026-05-01", expiration_date: "2026-11-01" }, as: IntakeCoordinator }
            - { call: "POST /api/fit-profiles", payload: { patient_id: "${pt}", category: WOUND, size_code: "4X4", measured_on: "2026-04-20", expected_patient_version: "${pt_v}" }, as: IntakeCoordinator }
            - { call: "POST /api/prior-authorizations", payload: { patient_id: "${pt}", hcpcs_code: "A6250", approved_units: 45, valid_from: "2026-05-01", valid_to: "2026-05-31" }, as: PriorAuthSpecialist, captures: { pa: $.data.id } }
            - { call: "POST /api/prior-authorizations/${pa}/decision", payload: { outcome: APPROVED }, as: PriorAuthSpecialist }
            - { call: "POST /api/orders", payload: { patient_id: "${pt}" }, as: Patient, as_user_id: "${pt}", captures: { ord: $.data.id, ord_v: $.data.version } }
            - { call: "POST /api/orders/${ord}/lines", payload: { formulary_item_id: "${itm}", size_code: "4X4", quantity: 5, expected_order_version: "${ord_v}" }, as: Patient, as_user_id: "${pt}" }
            - { call: "POST /api/orders/${ord}/submit", payload: {}, as: Patient, as_user_id: "${pt}" }
            - { call: "POST /api/shipments", payload: { order_id: "${ord}" }, as: FulfillmentAgent, captures: { shp: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-06-15T00:00:00Z" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /api/shipments/${shp}/release", payload: {}, as: FulfillmentAgent, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_PRIOR_AUTH_EXPIRED (APPROVED PA exists but valid_to 2026-05-31 < 2026-06-15)"
            - "Shipment.${shp}.status == CREATED (unchanged)"

      - name: confirm_on_suspended_program_rejected
        claim_type: precondition_enforcement
        grounds:
          - validations[priority=4]
          - errors[ERR_PROGRAM_SUSPENDED]
        distinguishing_aspect: "confirm-cycle on a manually SUSPENDED program fails ERR_PROGRAM_SUSPENDED even when the window is open; resume restores eligibility."
        test_recipe:
          setup: ["ACTIVE patient; OSTOMY program manually suspended"]
          setup_api_calls:
            - { call: "POST /api/payer-plans", payload: { name: "Medicare DMEPOS", plan_type: MEDICARE_DMEPOS, coinsurance_pct: 0.20, cycle_months: 3, is_active: true }, as: PlatformAdmin, captures: { pln: $.data.id } }
            - { call: "POST /api/patients", payload: { full_name: "Pat SUS", date_of_birth: "1962-12-25", payer_plan_id: "${pln}", hsa_initial_credit_cents: 0 }, as: IntakeCoordinator, captures: { pt: $.data.id } }
