          trigger:
            - { call: "POST /api/business-plans", payload: { asset_id: "${a1}", fiscal_year: 2028, expected_asset_version: "${a1_v}" }, as: AssetManager, as_user_id: "am-1", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_STALE_ASSET_VERSION (412) — ${a1_v} went stale when the first create bumped Asset.version"

      - name: occ_valuation_confirm_stale_asset_version
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[valuation-confirm-stale-asset]", "errors[ERR_STALE_ASSET_VERSION]"]
        distinguishing_aspect: "Second sequential confirm with the pre-first-confirm Asset.version is rejected; confirming with the fresh version succeeds — the OCC check observes Asset.version increments from the cascade."
        test_recipe:
          setup: ["BASE; V1 (500M, eff 2026-07-01) and V2 (520M, eff 2026-07-15) drafts"]
          setup_api_calls:
            - { call: "POST /api/portfolios", payload: { name: "P1" }, as: PortfolioDirector, captures: { p1: $.data.id } }
