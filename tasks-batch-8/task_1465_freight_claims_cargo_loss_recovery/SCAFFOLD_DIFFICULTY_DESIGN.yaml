  # =========================================================================
  # Rule 9 — compensating_invariant: different conserved quantities.
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: claim_filed_count_conserved_under_submit_withdraw
        grounds:
          - state_machines.Claim.DRAFT_to_SUBMITTED
          - state_machines.Claim.SUBMITTED_to_WITHDRAWN
          - entities.Carrier.fields.claims_filed_count
          - entities.Lane.fields.claims_count
        distinguishing_aspect: |
          Conserved quantity: carrier.claims_filed_count (and lane.claims_count)
          over the pair (submit, withdraw-from-SUBMITTED). Forward: +1;
          compensation: -1. Net drift == 0.
        test_recipe:
          setup:
            - "Carrier C17 with claims_filed_count = 0; lane L17 with claims_count = 0"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /freight-claims/carriers"
              payload: { scac_code: "INVA", legal_name: "Invariant Carrier", liability_model: "FULL_VALUE", max_auto_settle_cents: 100000, carmack_acknowledgment_days: 30, carmack_filing_days: 270 }
              as: ClaimsManager
              captures: { c17: $.data.id }
            - call: "POST /freight-claims/lanes"
              payload: { origin_zip3: "909", destination_zip3: "010", baseline_claim_ratio_bp: 900 }
              as: ClaimsManager
              captures: { l17: $.data.id }
            - call: "POST /freight-claims/carrier-lane-assignments"
              payload: { carrier_id: "${c17}", lane_id: "${l17}", contracted_discount_pct: 0, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: ClaimsManager
            - call: "POST /freight-claims/shipments"
              payload: { bol_number: "BOL-INV", carrier_id: "${c17}", lane_id: "${l17}", ship_date: "2026-06-01T00:00:00Z", delivery_date: "2026-06-05T00:00:00Z", declared_value_cents: 10000, total_weight_lbs: 10, package_count: 1, commodity_class: "GENERAL" }
              as: ClaimsClerk
              captures: { s17: $.data.id }
            - call: "POST /freight-claims/claims"
              payload: { shipment_id: "${s17}", claim_type: "LOSS", claimed_amount_cents: 5000 }
              as: ClaimsClerk
              captures: { cl17: $.data.id }
            - call: "POST /freight-claims/claims/${cl17}/documents"
              payload: { document_kind: "BOL", storage_uri: "s3://x/b.pdf", captured_at: "2026-06-01T00:00:00Z" }
              as: ClaimsClerk
            - call: "POST /freight-claims/claims/${cl17}/documents"
              payload: { document_kind: "COMMERCIAL_INVOICE", storage_uri: "s3://x/i.pdf", captured_at: "2026-06-01T00:00:00Z" }
              as: ClaimsClerk
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /freight-claims/claims/${cl17}/submit"
              payload: {}
              as: ClaimsClerk
            - call: "GET /freight-claims/carriers/${c17}"
              payload: {}
              as: Any
              captures: { filed_after_submit: $.data.claims_filed_count }
            - call: "POST /freight-claims/claims/${cl17}/withdraw"
              payload: {}
              as: ClaimsClerk
            - call: "GET /freight-claims/carriers/${c17}"
              payload: {}
              as: Any
              captures: { filed_after_withdraw: $.data.claims_filed_count }
          assert:
            - "filed_after_submit == 1"
            - "filed_after_withdraw == 0 (compensation restored invariant)"
            - "invariant: claims_filed_count_after_submit_then_withdraw == claims_filed_count_initial"

      - name: claim_net_exposure_conserved_under_salvage_and_settlement
        grounds:
          - calculations.salvage_net_credit
          - state_machines.SalvageDisposition.SCHEDULED_to_EXECUTED
          - state_machines.Settlement.OFFERED_to_ACCEPTED
          - entities.Claim.fields.net_exposure_cents
        distinguishing_aspect: |
          Conserved quantity: total funds flow —
          claim.settlement_amount_cents + claim.salvage_credit_cents + claim.reserve_amount_cents_residual
          must satisfy: final settlement == computed_liability - salvage_credit
          (i.e., no double-counting between salvage credit and paid settlement).
          Different quantity than counter (cents, not a count).
        test_recipe:
          setup:
