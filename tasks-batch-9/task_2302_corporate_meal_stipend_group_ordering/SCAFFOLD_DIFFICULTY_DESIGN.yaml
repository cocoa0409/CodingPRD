            - { call: "POST /orders", payload: { employee_id: "${emp_ada_id}", benefit_period_id: "${per_ada_id}", restaurant_id: "${rest_thai_id}", delivery_location_id: "${loc_hq_id}", requested_delivery_at: "2026-08-03T12:00:00Z", lines: [ { item_name: "Pad Thai", unit_price_cents: 1000, quantity: 1 }, { item_name: "Green Curry", unit_price_cents: 1000, quantity: 1 }, { item_name: "Mango Rice", unit_price_cents: 1000, quantity: 1 } ], tip_cents: 200 }, as: Employee, as_user_id: "${emp_ada_id}", captures: { ord1_id: $.data.id } }
