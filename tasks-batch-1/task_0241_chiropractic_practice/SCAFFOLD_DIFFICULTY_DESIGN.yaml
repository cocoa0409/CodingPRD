  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: cap_fills_last_slot_equal_allowed_but_plus_one_rejected
        grounds:
          - calculations.cap_reservation_check
          - validations[priority=16]
          - entities.InsurancePolicy.fields.annual_visit_cap
          - errors[ERR_VISIT_CAP_EXCEEDED]
        distinguishing_aspect: |
          Metric: integer cap counter on the booking endpoint. With annual_visit_cap=2, the 2nd booking
          (reserved+committed+1 == 2 == cap) is ALLOWED (equality fills the last slot); the 3rd booking
          (==3 > 2) is REJECTED with ERR_VISIT_CAP_EXCEEDED. This pins the strict-> boundary.
        test_recipe:
          setup:
            - "INSURANCE patient, ACTIVE policy annual_visit_cap=2, one ADJUSTMENT already booked (visits_reserved==1)."
          setup_api_calls:
            - call: "POST /fee-schedules"
              payload: { visit_type: "ADJUSTMENT", cash_rate_cents: 6000, billed_amount_cents: 9000 }
              as: PracticeAdmin
            - call: "POST /providers"
              payload: { full_name: "Dr Vega", npi: "1234567890", license_state: "CA" }
              as: PracticeAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /treatment-rooms"
