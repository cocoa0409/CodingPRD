          A session cannot open while any of its registrations still sits in
          accommodation_status REQUESTED; the district decision clears the block and the
          identical activation request then succeeds.
        test_recipe:
          setup:
            - "One district, school and OPEN window with a certified proctor holding an ACTIVE affidavit and a 10-booklet lot at the school."
            - "Session A is SCHEDULED with one registration coded SEPARATE_ROOM, which is SPECIALIZED and therefore still REQUESTED."
            - "Four booklets are checked out and the clock is at the session start."
