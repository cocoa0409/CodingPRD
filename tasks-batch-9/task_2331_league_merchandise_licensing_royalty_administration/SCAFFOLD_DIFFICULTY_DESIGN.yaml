  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: agreement_activation_requires_active_licensee
        grounds:
          - validations.priority_17
          - errors.ERR_LICENSEE_NOT_ACTIVE
          - state_machines.Licensee.ACTIVE_to_SUSPENDED
          - state_machines.Licensee.SUSPENDED_to_ACTIVE
          - state_machines.LicenseAgreement.PENDING_SIGNATURE_to_ACTIVE
        distinguishing_aspect: |
          The agreement's OWN state is legal (PENDING_SIGNATURE -> ACTIVE exists), but
          the transition is gated on a DIFFERENT entity: Licensee.status. With the
          licensee SUSPENDED the countersignature is rejected with
          ERR_LICENSEE_NOT_ACTIVE (409, priority 17) and the agreement stays
          PENDING_SIGNATURE; after REINSTATE the identical call succeeds. Because the
          agreement was never ACTIVE, the licensee-suspension cascade never touched it,
          so nothing but the cross-entity guard can explain the rejection.
        test_recipe:
          setup:
            - "clock at the mandatory default 2026-08-01T00:00:00Z"
            - "licensee LIC_T is ACTIVE, then agreement AGR_T is created on category JERSEY (MG 1000000, required_advance 250000 fully paid, term 2026-01-01..2027-12-31) and moved DRAFT -> PENDING_SIGNATURE"
            - "the licensee is then SUSPENDED by the MarkComplianceOfficer; AGR_T is not ACTIVE so the cascade leaves it in PENDING_SIGNATURE"
          setup_api_calls:
            - call: "POST /licensing/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
