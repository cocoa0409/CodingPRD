          material: FIBERGLASS_PULTRUSION
          duty_rating: TYPE_IA
          working_length_ft: 24.0
          retail_sku: SKU-FG24IA
        as: DesignEngineer
        as_user_id: eng-1
        captures:
          p1: $.data.id
          p1v: $.data.version
      - call: POST /ladder-ops/design-revisions
        payload:
          product_id: ${p1}
          revision_label: A
          joint_type: RIVETED
          structural_margin_pct: 6.5
          rail_section_modulus_in3: 0.25
          expected_product_version: ${p1v}
        as: DesignEngineer
        as_user_id: eng-1
        captures:
          r1: $.data.id
      - call: POST /ladder-ops/test-benches
        payload:
          bench_code: BENCH-1
          max_load_capacity_lb: 5000
          cooldown_minutes: 60
        as: TestLabTechnician
        captures:
          b1: $.data.id
      - call: POST /ladder-ops/test-campaigns
        payload:
          product_id: ${p1}
          design_revision_id: ${r1}
          purpose: DESIGN_QUALIFICATION
        as: TestLabTechnician
        captures:
          c1: $.data.id
      - call: POST /ladder-ops/bench-reservations
        payload:
          test_bench_id: ${b1}
          test_campaign_id: ${c1}
          start_at: '2026-08-03T08:00:00Z'
          end_at: '2026-08-03T12:00:00Z'
        as: TestLabTechnician
        captures:
          res1: $.data.id
      - call: POST /ladder-ops/test-campaigns/${c1}/start
        payload:
          bench_reservation_id: ${res1}
        as: TestLabTechnician
      trigger:
      - call: POST /ladder-ops/test-campaigns/${c1}/load-tests
        payload:
          test_code: STATIC_VERTICAL
          applied_load_lb: 1400.0
          measured_deflection_in: 1.5
          permanent_set_in: 0.021
        as: TestLabTechnician
        captures:
          ltx: $.data.id
      assert:
      - HTTP status == 201
      - LoadTest.${ltx}.outcome == FAIL
      - LoadTest.${ltx}.failure_reason_code == PERMANENT_SET_EXCEEDED
      - TestCampaign.${c1}.load_test_count == 1
      - TestCampaign.${c1}.failed_test_count == 1
      - TestCampaign.${c1}.status == IN_PROGRESS
      - 1400.00 >= 1350.00 and 1.500 <= 1.600, so neither LOAD_BELOW_REQUIRED nor DEFLECTION_EXCEEDED may be returned
