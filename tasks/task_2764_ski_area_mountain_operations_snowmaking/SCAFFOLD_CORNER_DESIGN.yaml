            - "Trigger 6: water_reserved_af == 4.788 (2.578 for S1 plus 2.210 for S2) and water_right_remaining_af == 245.212 - neither rejection reserved a drop."

      - name: a_patrol_staffing_shortfall_blocks_the_reopen_and_is_cured_by_closing_the_incident
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=28]
          - errors[ERR_PATROL_STAFFING_INSUFFICIENT]
          - entities.TerrainArea.fields.assigned_patroller_count
          - state_machines.Patroller.AVAILABLE_to_ON_INCIDENT
        distinguishing_aspect: |
          assigned_patroller_count counts only patrollers that are on_duty AND status AVAILABLE, so
          dispatching one of the two assigned patrollers to an incident silently breaks the staffing floor
          of the area they are assigned to. The area is pushed to PATROL_HOLD by the dispatch cascade, and
          the reopen must then fail at priority 28 - not at priority 12 - because PATROL_HOLD is an
          admissible source state for an OPEN decision. Closing the incident returns the patroller and the
          identical call then succeeds, which is the satisfaction half of the same rule.
        test_recipe:
          setup:
            - "An open mountain: season OPERATING, lift OPEN, area OPEN, min_patrollers_per_open_area 2."
            - "Patrollers P1 (EMT) and P2 (PARAMEDIC) are both on duty, AVAILABLE and assigned to the area."
            - "A MINOR incident on the area is REPORTED."
