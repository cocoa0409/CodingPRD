          - "entities.FeeSchedule.fields.tournament_day_min_minutes"
        distinguishing_aspect: "TOURNAMENT at exactly 360 minutes uses the flat 24000 day rate (replaces hourly); TOURNAMENT at 300 minutes stays hourly (5h x 2000 = 10000) — the >= threshold on tournament_day_min_minutes decides the pricing branch."
        test_recipe:
          setup: ["Resident TOURNAMENT_OPERATOR org; two tournament applications: 2026-08-10 09:00-15:00 (360 min) and 2026-08-11 09:00-14:00 (300 min); window max_tournament_days_per_org=2"]
