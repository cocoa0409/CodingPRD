          - errors.ERR_COMPLIANCE_REPORT_NOT_FOUND
          - errors.ERR_VIOLATION_PENALTY_NOT_FOUND
          - errors.ERR_REFUND_CHECK_NOT_FOUND
        distinguishing_aspect: "Path resolution is left-to-right: an unknown PARENT id on a nested collection reports the parent's 404 (ERR_INVESTIGATION_NOT_FOUND for /investigations/{bogus}/cids), and an unknown transition target reports the target's own 404 — six more distinct error_ids."
