            - "OfferPlan.${plan_ap}.notice_sent_on == 2026-09-01"

      - name: subscription_activates_on_first_successful_payment
        claim_type: side_effect_execution
        grounds:
          - state_machines.Subscription.PENDING_ACTIVATION_to_ACTIVE
          - endpoints[POST /paywall/invoices/{id}/payment-attempts]
        distinguishing_aspect: "The cycle-1 SUCCEEDED attempt is the only activation path: lifecycle must move to ACTIVE, paid_through_on to cycle_start_on + cycle_days, the invoice to PAID and the reader's entitlement_source to SUBSCRIPTION in one call."
        test_recipe:
          setup:
            - "ACTIVE DIGITAL_ONLY plan (intro 499 for cycle 1, cycle_days 30) and a PENDING_ACTIVATION subscription whose cycle-1 invoice of 499 is OPEN, at clock 2026-09-01T00:00:00Z."
          setup_api_calls:
