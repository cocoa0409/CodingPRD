      - name: duplicate_guest_ref_on_the_same_segment_rejected
        claim_type: triggerable
        grounds: ["validations[priority=32]", "errors[ERR_DUPLICATE_MANIFEST_ENTRY]"]
        distinguishing_aspect: "The same guest_ref G-400 manifested twice on one segment returns HTTP 422 ERR_DUPLICATE_MANIFEST_ENTRY while the identical guest_ref on a different segment is accepted, so booked_seat_count stays 2 on the first segment and becomes 2 on the second."
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z; one Program; two SHUTTLE_LOOP segments of seat_capacity 12."
            - "One ManifestEntry with guest_ref G-400 and seat_count 2 already ASSIGNED on segment 1."
