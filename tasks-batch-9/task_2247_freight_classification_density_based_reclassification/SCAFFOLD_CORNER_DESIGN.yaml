        distinguishing_aspect: "The 3-decimal per-piece cube must be computed before multiplying by pieces: 22 pieces of 20x20x20 give per_piece 4.630 and cube 101.86 (a single rounding over the whole volume gives 101.85), and 4 pieces of 48x40x48 give per_piece 53.333 and cube 213.33."
