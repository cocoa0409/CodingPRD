# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3459_food_facility_registration_import_alert_detention
# 9 rules x 2 instances = 18 instances. Every instance replays from empty-DB
# using only SCAFFOLD.yaml §1.5 endpoints.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: notice_window_initial_vs_amendment
        grounds:
          - calculations.prior_notice_window_check
          - endpoints.POST_/registry/prior-notices
          - endpoints.POST_/registry/prior-notices/{id}/amend
        distinguishing_aspect: "Dual-variant logic on the PriorNotice domain: identical timing data (VESSEL arrival 6h ahead) is rejected for an initial filing (minimum 8h) but accepted for an amendment filing (minimum ceil(8/2)=4h) — two valid formulas, different outcomes."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T12:00:00Z"
            - "Facility F (FOREIGN, DE) REGISTERED; Importer I onboarded"
            - "PN1 CONFIRMED with VESSEL arrival_eta 2026-10-11T12:00:00Z (240h lead)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-01T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /registry/facilities"
              payload: { legal_name: "Hafen Foods GmbH", facility_kind: "FOREIGN", country_code: "DE", ufi: "UFI-DE-001" }
              as: FacilityOwner
              captures: { fac_id: $.data.id }
            - call: "POST /registry/importers"
              payload: { firm_name: "Atlantic Import Co", account_code: "IMP-001" }
              as: PlatformAdmin
              captures: { imp_id: $.data.id }
            - call: "POST /registry/prior-notices"
              payload: { importer_id: "${imp_id}", facility_id: "${fac_id}", product_code: "PC-FISH-01", product_risk_class: "STANDARD", transport_mode: "VESSEL", arrival_eta: "2026-10-11T12:00:00Z", declared_units: 100, unit_value_cents: 500, port_code: "US-NYC" }
              as: Importer
              as_user_id: "${imp_id}"
              captures: { pn1_id: $.data.id }
          trigger:
            - call: "POST /registry/prior-notices"
              payload: { importer_id: "${imp_id}", facility_id: "${fac_id}", product_code: "PC-FISH-01", product_risk_class: "STANDARD", transport_mode: "VESSEL", arrival_eta: "2026-10-01T18:00:00Z", declared_units: 50, unit_value_cents: 500, port_code: "US-NYC" }
              as: Importer
              as_user_id: "${imp_id}"
              captures: { err_initial: $.data.error_id }
            - call: "POST /registry/prior-notices/${pn1_id}/amend"
              payload: { arrival_eta: "2026-10-01T18:00:00Z" }
              as: Importer
              as_user_id: "${imp_id}"
              captures: { pn2_id: $.data.id }
          assert:
            - "initial filing with 6h lead: err_initial == ERR_NOTICE_TOO_LATE (http 422)"
            - "amendment with identical 6h lead: response 201, PriorNotice.${pn2_id}.status == CONFIRMED"
            - "PriorNotice.${pn2_id}.is_amendment == true and parent_pn_id == ${pn1_id}"
            - "GET /registry/prior-notices/${pn1_id} shows status == SUPERSEDED"
            - "PriorNotice.${pn2_id} inherits declared_units == 100, unit_value_cents == 500, port_code == US-NYC from the superseded notice"

      - name: screening_score_base_vs_history_weighted
        grounds:
          - calculations.entry_screening_score
          - endpoints.POST_/registry/entries/{id}/screen
          - endpoints.POST_/registry/inspections/{id}/complete
        distinguishing_aspect: "Dual-variant logic on the ImportEntry domain (different domain from the notice-window instance): two STANDARD entries with identical notice data score 30 under the BASE variant (clean facility) and 46 under the HISTORY_WEIGHTED variant (facility violation_count 1), routing to RELEASE vs SAMPLE."
        test_recipe:
          setup:
            - "Logical clock at startup default 2026-09-01T00:00:00Z"
            - "Facility A (FOREIGN, DE) with violation_count == 1 (inspection completed with 1 finding); Facility B (FOREIGN, DE) clean"
            - "Importer I onboarded, zero refusals"
            - "Entry A (facility A, STANDARD, non-amended notice) and Entry B (facility B, STANDARD, non-amended notice), both PENDING_SCREENING"
          setup_api_calls:
            - call: "POST /registry/facilities"
              payload: { legal_name: "Bremen Cannery", facility_kind: "FOREIGN", country_code: "DE", ufi: "UFI-DE-101" }
              as: FacilityOwner
              captures: { fac_a: $.data.id }
            - call: "POST /registry/facilities"
              payload: { legal_name: "Ostsee Packers", facility_kind: "FOREIGN", country_code: "DE", ufi: "UFI-DE-102" }
              as: FacilityOwner
              captures: { fac_b: $.data.id }
            - call: "POST /registry/importers"
              payload: { firm_name: "Prairie Imports LLC", account_code: "IMP-101" }
              as: PlatformAdmin
              captures: { imp_id: $.data.id }
            - call: "POST /registry/inspections"
              payload: { facility_id: "${fac_a}", scheduled_start_at: "2026-09-05T09:00:00Z", scheduled_end_at: "2026-09-05T17:00:00Z" }
              as: FieldInspector
              as_user_id: "fi-1"
              captures: { insp_a: $.data.id }
            - call: "POST /registry/inspections/${insp_a}/complete"
              payload: { findings_violation_count: 1 }
              as: FieldInspector
              as_user_id: "fi-1"
            - call: "POST /registry/prior-notices"
              payload: { importer_id: "${imp_id}", facility_id: "${fac_a}", product_code: "PC-CAN-01", product_risk_class: "STANDARD", transport_mode: "VESSEL", arrival_eta: "2026-09-03T00:00:00Z", declared_units: 10, unit_value_cents: 1000, port_code: "US-BAL" }
              as: Importer
              as_user_id: "${imp_id}"
              captures: { pn_a: $.data.id }
            - call: "POST /registry/entries"
              payload: { prior_notice_id: "${pn_a}" }
              as: Importer
              as_user_id: "${imp_id}"
              captures: { ent_a: $.data.id }
            - call: "POST /registry/prior-notices"
              payload: { importer_id: "${imp_id}", facility_id: "${fac_b}", product_code: "PC-CAN-01", product_risk_class: "STANDARD", transport_mode: "VESSEL", arrival_eta: "2026-09-03T00:00:00Z", declared_units: 10, unit_value_cents: 1000, port_code: "US-BAL" }
              as: Importer
              as_user_id: "${imp_id}"
              captures: { pn_b: $.data.id }
            - call: "POST /registry/entries"
              payload: { prior_notice_id: "${pn_b}" }
              as: Importer
              as_user_id: "${imp_id}"
              captures: { ent_b: $.data.id }
          trigger:
            - call: "POST /registry/entries/${ent_a}/screen"
              payload: {}
              as: EntryReviewer
              as_user_id: "er-1"
            - call: "POST /registry/entries/${ent_b}/screen"
              payload: {}
              as: EntryReviewer
              as_user_id: "er-1"
          assert:
            - "ImportEntry.${ent_a}.screening_score == 46 and scoring_variant_applied == HISTORY_WEIGHTED"
            - "ImportEntry.${ent_a}.probation_adjustment_applied == 0"
            - "ImportEntry.${ent_a}.screening_decision == SAMPLE and disposition_status == PENDING"
            - "ImportEntry.${ent_b}.screening_score == 30 and scoring_variant_applied == BASE"
            - "ImportEntry.${ent_b}.screening_decision == RELEASE and disposition_status == RELEASED and units_released == 10"
            - "Facility.${fac_a}.violation_count == 1 (established by inspection findings, the only difference between the two entries' inputs)"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: screening_score_threshold_routing
        grounds:
          - calculations.entry_screening_score
          - endpoints.POST_/registry/entries/{id}/screen
          - endpoints.POST_/registry/prior-notices/{id}/amend
        distinguishing_aspect: "Mode (a): a >=3-input formula with nested min/cap and a conditional branch — the AMEND_TERM (+10) pushes a clean STANDARD entry to exactly the SAMPLE_THRESHOLD 40, and 40 >= 40 routes SAMPLE (inclusive boundary), while the identical non-amended entry scores 30 and routes RELEASE."
        test_recipe:
          setup:
            - "Logical clock at startup default 2026-09-01T00:00:00Z"
            - "Facility C (FOREIGN, FR) clean; Importer I2 clean"
            - "PN1 STANDARD amended in place (new notice is_amendment=true); Entry 1 consumes the amended notice"
            - "PN2 STANDARD non-amended; Entry 2 consumes it"
          setup_api_calls:
            - call: "POST /registry/facilities"
              payload: { legal_name: "Lyonnaise Confitures", facility_kind: "FOREIGN", country_code: "FR", ufi: "UFI-FR-201" }
              as: FacilityOwner
              captures: { fac_c: $.data.id }
            - call: "POST /registry/importers"
              payload: { firm_name: "Bayou Trading", account_code: "IMP-201" }
              as: PlatformAdmin
              captures: { imp2: $.data.id }
            - call: "POST /registry/prior-notices"
              payload: { importer_id: "${imp2}", facility_id: "${fac_c}", product_code: "PC-JAM-01", product_risk_class: "STANDARD", transport_mode: "VESSEL", arrival_eta: "2026-09-03T00:00:00Z", declared_units: 20, unit_value_cents: 200, port_code: "US-NOL" }
              as: Importer
              as_user_id: "${imp2}"
              captures: { pn1: $.data.id }
            - call: "POST /registry/prior-notices/${pn1}/amend"
              payload: { arrival_eta: "2026-09-03T00:00:00Z", declared_units: 20 }
              as: Importer
              as_user_id: "${imp2}"
              captures: { pn1a: $.data.id }
            - call: "POST /registry/entries"
              payload: { prior_notice_id: "${pn1a}" }
              as: Importer
              as_user_id: "${imp2}"
              captures: { ent_1: $.data.id }
            - call: "POST /registry/prior-notices"
              payload: { importer_id: "${imp2}", facility_id: "${fac_c}", product_code: "PC-JAM-02", product_risk_class: "STANDARD", transport_mode: "VESSEL", arrival_eta: "2026-09-03T00:00:00Z", declared_units: 20, unit_value_cents: 200, port_code: "US-NOL" }
              as: Importer
              as_user_id: "${imp2}"
              captures: { pn2: $.data.id }
            - call: "POST /registry/entries"
              payload: { prior_notice_id: "${pn2}" }
              as: Importer
              as_user_id: "${imp2}"
              captures: { ent_2: $.data.id }
          trigger:
            - call: "POST /registry/entries/${ent_1}/screen"
              payload: {}
              as: EntryReviewer
              as_user_id: "er-2"
            - call: "POST /registry/entries/${ent_2}/screen"
              payload: {}
              as: EntryReviewer
              as_user_id: "er-2"
          assert:
            - "ImportEntry.${ent_1}.screening_score == 40 (30 base + 10 amend term, BASE variant)"
            - "ImportEntry.${ent_1}.screening_decision == SAMPLE (score == SAMPLE_THRESHOLD 40 routes SAMPLE; the boundary is inclusive)"
            - "ImportEntry.${ent_1}.disposition_status == PENDING"
            - "ImportEntry.${ent_2}.screening_score == 30 and screening_decision == RELEASE and disposition_status == RELEASED"

      - name: reconditioning_bond_round_order
        grounds:
          - calculations.reconditioning_bond
          - endpoints.POST_/registry/entries/{id}/request-reconditioning
          - endpoints.POST_/registry/import-alerts
        distinguishing_aspect: "Mode (b): nested rounding with pinned order — round_half_up per lot THEN sum. Three lots of {quantity 1, unit_value_cents 105} yield 3 x round_half_up(10.5) = 33; the forbidden sum-then-round order would yield round_half_up(31.5) = 32. Zero elapsed detention days keeps the storage term at 0."
        test_recipe:
          setup:
            - "Logical clock at startup default 2026-09-01T00:00:00Z (detention and bond request happen at the same instant, so days_detained == 0)"
            - "Facility D (FOREIGN, DE); Importer I3; one entry (declared_units 3, unit_value_cents 105) auto-detained by a FIRM alert"
          setup_api_calls:
            - call: "POST /registry/facilities"
              payload: { legal_name: "Weser Delikatessen", facility_kind: "FOREIGN", country_code: "DE", ufi: "UFI-DE-301" }
              as: FacilityOwner
              captures: { fac_d: $.data.id }
            - call: "POST /registry/importers"
              payload: { firm_name: "Gulf Coast Foods", account_code: "IMP-301" }
              as: PlatformAdmin
              captures: { imp3: $.data.id }
            - call: "POST /registry/prior-notices"
              payload: { importer_id: "${imp3}", facility_id: "${fac_d}", product_code: "PC-CRacker-01", product_risk_class: "LOW", transport_mode: "VESSEL", arrival_eta: "2026-09-03T00:00:00Z", declared_units: 3, unit_value_cents: 105, port_code: "US-HOU" }
              as: Importer
              as_user_id: "${imp3}"
              captures: { pn_d: $.data.id }
            - call: "POST /registry/entries"
              payload: { prior_notice_id: "${pn_d}" }
              as: Importer
              as_user_id: "${imp3}"
              captures: { ent_d: $.data.id }
            - call: "POST /registry/import-alerts"
              payload: { scope_type: "FIRM", facility_id: "${fac_d}", reason: "Listeria findings" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { alert_d: $.data.id }
          trigger:
            - call: "POST /registry/entries/${ent_d}/request-reconditioning"
              payload: { lots: [ { quantity: 1, unit_value_cents: 105 }, { quantity: 1, unit_value_cents: 105 }, { quantity: 1, unit_value_cents: 105 } ] }
              as: Importer
              as_user_id: "${imp3}"
              captures: { bond: $.data.bond_amount_cents }
          assert:
            - "entry was auto-detained by the alert cascade: disposition_status == DETAINED and detained_under_alert_id == ${alert_d}"
            - "bond == 33 (3 x round_half_up(105 x 0.10) = 3 x 11; storage 0 days x 1500 = 0)"
            - "ImportEntry.${ent_d}.units_held == 3 and units_released == 0"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: facility_registration_expiry_renewal_cycle
        grounds:
          - state_machines.Facility.REGISTERED_to_EXPIRED
          - state_machines.Facility.EXPIRED_to_REGISTERED
          - calculations.facility_registration_expiry
        distinguishing_aspect: "Cyclic machine on Facility: REGISTERED -> EXPIRED -> REGISTERED -> EXPIRED is traversed twice around the loop; the expiry sweep is strict (facility still REGISTERED at the exact expires_at instant) and grace renewal from EXPIRED rebases expiry to now + 730 days."
        test_recipe:
          setup:
            - "Facility E registered at startup default clock 2026-09-01T00:00:00Z (expires_at 2028-08-31T00:00:00Z, version 1)"
          setup_api_calls:
            - call: "POST /registry/facilities"
              payload: { legal_name: "Alvorada Alimentos", facility_kind: "FOREIGN", country_code: "BR", ufi: "UFI-BR-401" }
              as: FacilityOwner
              captures: { fac_e: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2028-08-31T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /registry/facilities/${fac_e}"
              payload: {}
              as: PlatformAdmin
              captures: { st_at_expiry: $.data.registration_status }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2028-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /registry/facilities/${fac_e}"
              payload: {}
              as: PlatformAdmin
              captures: { fac_e_v2: $.data.version, st_expired: $.data.registration_status }
            - call: "POST /registry/facilities/${fac_e}/renew"
              payload: { expected_facility_version: "${fac_e_v2}" }
              as: FacilityOwner
              as_user_id: "${fac_e}"
              captures: { exp_new: $.data.expires_at, st_renewed: $.data.registration_status }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2030-09-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /registry/facilities/${fac_e}"
              payload: {}
              as: PlatformAdmin
              captures: { st_final: $.data.registration_status }
          assert:
            - "at 2028-08-31T00:00:00Z (exactly expires_at): st_at_expiry == REGISTERED (sweep comparison is strict)"
            - "at 2028-09-01T00:00:00Z: st_expired == EXPIRED and version advanced to 2"
            - "renewal from EXPIRED within grace (window [2028-06-02T00:00:00Z, 2028-09-30T00:00:00Z]): st_renewed == REGISTERED, exp_new == 2030-09-01T00:00:00Z (now + 730 days), version 3"
            - "after clock 2030-09-02T00:00:00Z: st_final == EXPIRED — the loop closed a second time"

      - name: entry_parallel_dims_evolve_independently
        grounds:
          - state_machines.ImportEntry
          - endpoints.POST_/registry/entries/{id}/screen
          - endpoints.POST_/registry/import-alerts
        distinguishing_aspect: "Parallel state dimensions on ImportEntry: screening moves review_status PENDING_SCREENING -> SCREENED with decision SAMPLE while disposition_status stays PENDING; a later alert activation flips ONLY disposition_status to DETAINED — review_status and screening_decision are preserved, proving the two dimensions evolve independently."
        test_recipe:
          setup:
            - "Logical clock at startup default 2026-09-01T00:00:00Z"
            - "Facility G (FOREIGN, DE) clean; Importer I4 clean; HIGH-risk entry created"
          setup_api_calls:
            - call: "POST /registry/facilities"
              payload: { legal_name: "Frisia Feinkost", facility_kind: "FOREIGN", country_code: "DE", ufi: "UFI-DE-402" }
              as: FacilityOwner
              captures: { fac_g: $.data.id }
            - call: "POST /registry/importers"
              payload: { firm_name: "Delta Pantry", account_code: "IMP-401" }
              as: PlatformAdmin
              captures: { imp4: $.data.id }
            - call: "POST /registry/prior-notices"
              payload: { importer_id: "${imp4}", facility_id: "${fac_g}", product_code: "PC-RAW-01", product_risk_class: "HIGH", transport_mode: "AIR", arrival_eta: "2026-09-02T00:00:00Z", declared_units: 40, unit_value_cents: 800, port_code: "US-ATL" }
              as: Importer
              as_user_id: "${imp4}"
              captures: { pn_g: $.data.id }
            - call: "POST /registry/entries"
              payload: { prior_notice_id: "${pn_g}" }
              as: Importer
              as_user_id: "${imp4}"
              captures: { ent_g: $.data.id }
          trigger:
            - call: "POST /registry/entries/${ent_g}/screen"
              payload: {}
              as: EntryReviewer
              as_user_id: "er-1"
              captures: { rev_mid: $.data.review_status, disp_mid: $.data.disposition_status, dec_mid: $.data.screening_decision }
            - call: "POST /registry/import-alerts"
              payload: { scope_type: "FIRM", facility_id: "${fac_g}", reason: "Residue violations" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { alert_g: $.data.id }
            - call: "GET /registry/entries/${ent_g}"
              payload: {}
              as: EntryReviewer
              as_user_id: "er-1"
              captures: { rev_end: $.data.review_status, disp_end: $.data.disposition_status, dec_end: $.data.screening_decision, alert_link: $.data.detained_under_alert_id }
          assert:
            - "after screen: rev_mid == SCREENED, disp_mid == PENDING, dec_mid == SAMPLE (score 60 >= 40)"
            - "after alert activation: disp_end == DETAINED while rev_end == SCREENED and dec_end == SAMPLE (review dimension untouched)"
            - "alert_link == ${alert_g} and response_deadline_at == detained_at + 240 hours"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: inspection_refusal_cascade
        grounds:
          - state_machines.Inspection.SCHEDULED_to_REFUSED_BY_FACILITY
          - state_machines.Facility.REGISTERED_to_SUSPENDED
          - state_machines.ImportEntry
          - state_machines.PriorNotice.CONFIRMED_to_COMPROMISED
        distinguishing_aspect: "Depth-3 cascade triggered by inspection refusal: refuse-entry suspends the facility (link 1); the suspension detains every PENDING-disposition entry of the facility with a fresh 240h deadline (link 2, caused by link 1, not by the API call); each detention then compromises the facility's still-CONFIRMED prior notices (link 3, caused by link 2)."
        test_recipe:
          setup:
            - "Logical clock at startup default 2026-09-01T00:00:00Z"
            - "Facility H (FOREIGN, DE) REGISTERED with: entry e1 filed (PENDING_SCREENING/PENDING, its notice CONSUMED) and notice PN2 still CONFIRMED (unconsumed)"
            - "Inspection scheduled on H by fi-1"
          setup_api_calls:
            - call: "POST /registry/facilities"
              payload: { legal_name: "Rur Konserven", facility_kind: "FOREIGN", country_code: "DE", ufi: "UFI-DE-501" }
              as: FacilityOwner
              captures: { fac_h: $.data.id }
            - call: "POST /registry/importers"
              payload: { firm_name: "Bluegrass Brokers", account_code: "IMP-501" }
              as: PlatformAdmin
              captures: { imp5: $.data.id }
            - call: "POST /registry/prior-notices"
              payload: { importer_id: "${imp5}", facility_id: "${fac_h}", product_code: "PC-PEA-01", product_risk_class: "STANDARD", transport_mode: "VESSEL", arrival_eta: "2026-09-03T00:00:00Z", declared_units: 60, unit_value_cents: 300, port_code: "US-CHS" }
              as: Importer
              as_user_id: "${imp5}"
              captures: { pn_h1: $.data.id }
            - call: "POST /registry/entries"
              payload: { prior_notice_id: "${pn_h1}" }
              as: Importer
              as_user_id: "${imp5}"
              captures: { ent_h: $.data.id }
            - call: "POST /registry/prior-notices"
              payload: { importer_id: "${imp5}", facility_id: "${fac_h}", product_code: "PC-PEA-02", product_risk_class: "STANDARD", transport_mode: "VESSEL", arrival_eta: "2026-09-04T00:00:00Z", declared_units: 30, unit_value_cents: 300, port_code: "US-CHS" }
              as: Importer
              as_user_id: "${imp5}"
              captures: { pn_h2: $.data.id }
            - call: "POST /registry/inspections"
              payload: { facility_id: "${fac_h}", scheduled_start_at: "2026-09-05T09:00:00Z", scheduled_end_at: "2026-09-05T17:00:00Z" }
              as: FieldInspector
              as_user_id: "fi-1"
              captures: { insp_h: $.data.id }
          trigger:
            - call: "POST /registry/inspections/${insp_h}/refuse-entry"
              payload: {}
              as: FacilityOwner
              as_user_id: "${fac_h}"
          assert:
            - "Inspection.${insp_h}.status == REFUSED_BY_FACILITY"
            - "link 1: Facility.${fac_h}.registration_status == SUSPENDED"
            - "link 2: ImportEntry.${ent_h}.disposition_status == DETAINED, detained_at == 2026-09-01T00:00:00Z, response_deadline_at == 2026-09-11T00:00:00Z, detained_under_alert_id is null, units_held == 60"
            - "link 2 derived field: Facility.${fac_h}.open_detention_count == 1"
            - "link 3: GET /registry/prior-notices/${pn_h2} shows status == COMPROMISED"
            - "link 3 spares consumed notices: GET /registry/prior-notices/${pn_h1} shows status == CONSUMED"

      - name: alert_activation_cascade
        grounds:
          - endpoints.POST_/registry/import-alerts
          - state_machines.ImportEntry
          - entities.Facility.fields.open_detention_count
        distinguishing_aspect: "Depth-2 cascade with a different trigger than the inspection cascade: creating an ACTIVE FIRM alert auto-detains matching PENDING entries (link 1, caused by the alert creation); each auto-detention itself recomputes the facility's open_detention_count derived field (link 2, caused by link 1). Non-matching entries are untouched."
        test_recipe:
          setup:
            - "Logical clock at startup default 2026-09-01T00:00:00Z"
            - "Facilities F1 and F2 (both FOREIGN, DE); Importer I6; entry e1 on F1 and entry e2 on F2, both PENDING_SCREENING/PENDING"
          setup_api_calls:
            - call: "POST /registry/facilities"
