          difficulty_instance: decided_case_state_beats_uncertified_reviewer_safety
          rationale: "Three §1.8 instances each violate two rules from different categories at once and assert that the lower-priority number wins (state vs safety, temporal vs fiscal, safety vs referential)."
      - name: conditional_validation_covered_by_difficulty_design
        claim_type: conditional_validation
        grounds:
          - validations[priority=50]
        excluded_because:
          difficulty_instance: decide_blocked_when_reviewer_certification_voided_by_activation
          rationale: "The certification rule at priority 50 changes which policy version it demands depending on the case's requires_recertified_review flag, and that instance runs it with the flag both false and true."
      - name: temporal_validation_covered_by_difficulty_design
