      - name: challenge_on_finalized_inspection_rejected
        claim_type: invalid_transition
        grounds: ["errors[ERR_INSPECTION_FINALIZED]", state_machines.RoadsideInspection]
        distinguishing_aspect: "FINALIZED locks the inspection: new violations and new challenges against its violations both fail with ERR_INSPECTION_FINALIZED."
        test_recipe:
          setup: ["carrier; category; driver; inspection with one violation; inspection driven IMPORTED -> UNDER_REVIEW -> FINALIZED (no open challenges)"]
          setup_api_calls:
            - { call: "POST /safety/carriers", payload: { dot_number: "DOT-2321", legal_name: "Final Carrier", fleet_size: 2 }, as: SafetyAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /safety/violation-categories", payload: { category_code: "VEHICLE_MAINTENANCE", display_name: "VM", intervention_threshold: 65, benchmark_measure: 10.0 }, as: SafetyAdmin, captures: { cat_id: $.data.id } }
