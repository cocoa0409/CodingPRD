        grounds:
          - state_machines.ArtistAgreement.ACTIVE_to_AMENDMENT_PENDING
          - state_machines.ArtistAgreement.AMENDMENT_PENDING_to_ACTIVE_on_ACCEPT
          - state_machines.ArtistAgreement.AMENDMENT_PENDING_to_ACTIVE_on_REJECT
          - entities.ArtistAgreement.fields.proposed_royalty_rate_pct
          - entities.ArtistAgreement.fields.unrecouped_artist_advance_cents
          - endpoints[POST /artist-agreements/{id}/propose-amendment]
          - endpoints[POST /artist-agreements/{id}/resolve-amendment]
        distinguishing_aspect: |
          Entity = ArtistAgreement. The cycle ACTIVE -> AMENDMENT_PENDING -> ACTIVE is traversed TWICE
          in one recipe and the two return edges share a target state while having disjoint side-effect
          sets: ACCEPT rewrites royalty_rate_pct to 0.1400 and lifts unrecouped_artist_advance_cents
          from 100000 to 150000, REJECT leaves both untouched. Both edges clear the proposed_* pair, so
          state alone cannot tell them apart.
