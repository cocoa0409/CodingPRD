  # =====================================================================
  # Rule 7 — cross_entity_state_dependency (2 instances, different entity pairs)
  # =====================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: project_open_requires_owner_seat_assigned
        grounds:
          - state_machines.SearchProject.transitions
          - entities.SearchProject.fields.owner_seat_id
        distinguishing_aspect: |
          Pair SearchProject -> Seat: the DRAFT -> OPEN transition is
          guarded by the OWNER seat's status — when the owner seat is
          UNASSIGNED (recruiter unassigned after the project was created),
          /open is rejected with ERR_INVALID_STATE.
        test_recipe:
          setup:
            - "ACTIVE PRO contract, seat assigned to recruiter, DRAFT project owned by that seat"
            - "seat then unassigned so owner_seat_id references an UNASSIGNED seat"
          setup_api_calls:
            - call: "POST /contracts"
              payload: { contract_number: "C-XD-1", product_tier: "RECRUITER_PRO", seat_cap: 5 }
              as: ContractAdmin
              captures: { cid: $.data.id }
            - call: "POST /contracts/${cid}/activate"
              payload: { seats_purchased_initial: 1 }
              as: ContractAdmin
            - call: "POST /recruiters"
              payload: { email: "r10@x.com", full_name: "R Ten", home_contract_id: "${cid}" }
              as: ContractAdmin
              captures: { rec1: $.data.id }
            - call: "GET /contracts/${cid}/seats"
              as: ContractAdmin
              captures: { seat1: $.data.0.id, seat1_v: $.data.0.version }
            - call: "POST /contracts/${cid}/seats/${seat1}/assign"
              payload: { recruiter_id: "${rec1}", expected_seat_version: "${seat1_v}" }
              as: SeatAdmin
            - call: "POST /contracts/${cid}/projects"
              payload: { name: "XDP", owner_seat_id: "${seat1}" }
              as: SeatAdmin
              captures: { proj1: $.data.id }
            - call: "POST /contracts/${cid}/seats/${seat1}/unassign"
              as: SeatAdmin
          trigger:
            - call: "POST /projects/${proj1}/open"
              as: SeatAdmin
              captures: { err: $.data.error_id }
          assert:
            - "rejected with ERR_INVALID_STATE because Seat.${seat1}.seat_status == UNASSIGNED at trigger time"

      - name: sync_record_writeback_requires_integration_connected
        grounds:
          - state_machines.AtsSyncRecord
          - entities.AtsSyncRecord.fields.ats_integration_id
        distinguishing_aspect: |
          Pair AtsSyncRecord -> AtsIntegration: a sync record created
          while its integration is PROVISIONING (never CONNECTED) stays
          QUEUED and is NOT written; only after the parent integration
          transitions to CONNECTED does the same record become WRITTEN.
        test_recipe:
          setup:
            - "ACTIVE PRO contract with an AtsIntegration in PROVISIONING (write_back_enabled=true) and one candidate"
          setup_api_calls:
            - call: "POST /contracts"
              payload: { contract_number: "C-XD-2", product_tier: "RECRUITER_PRO", seat_cap: 5 }
              as: ContractAdmin
              captures: { cid: $.data.id }
            - call: "POST /contracts/${cid}/activate"
              payload: { seats_purchased_initial: 1 }
              as: ContractAdmin
            - call: "POST /contracts/${cid}/ats-integrations"
              payload: { vendor: "GREENHOUSE", external_tenant_id: "gh-1", write_back_enabled: true }
              as: ContractAdmin
              captures: { intg: $.data.id }
            - call: "POST /candidate-profiles"
              payload: { member_id: "m-x", full_name: "C X", headline: "h", privacy_setting: "PUBLIC", open_to_work: false, open_to_work_visibility: "NONE", years_experience: 2, current_title: "t" }
              as: ContractAdmin
              captures: { cand: $.data.id }
            - call: "POST /ats-sync-records"
              payload: { ats_integration_id: "${intg}", candidate_id: "${cand}", external_candidate_ref: "gh-cand-1", event_type: "APPLICATION_FORWARDED", payload: { stage: "applied" } }
              as: AtsService
              captures: { rec1_id: $.data.id, rec1_st: $.data.sync_status }
          trigger:
            - call: "POST /contracts/${cid}/ats-integrations/${intg}/connect"
              as: ContractAdmin
            - call: "POST /ats-sync-records"
              payload: { ats_integration_id: "${intg}", candidate_id: "${cand}", external_candidate_ref: "gh-cand-2", event_type: "STAGE_CHANGED", payload: { stage: "screen" } }
              as: AtsService
              captures: { rec2_st: $.data.sync_status }
          assert:
            - "first record sync_status == QUEUED while integration was PROVISIONING"
            - "second record sync_status == WRITTEN after integration CONNECTED — the record's outcome depends on the parent integration's state"

  # =====================================================================
  # Rule 8 — resource_temporal_overlap (2 instances, different interval semantics)
  # =====================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: promoted_slot_half_open_posting_window
        grounds:
          - validations[priority=15]
          - entities.PromotedSlot.fields.slot_date
          - errors[ERR_INVALID_DATE_RANGE]
        distinguishing_aspect: |
          Half-open interval semantics on the JobPosting resource: the
          posting window is [start_at.date, end_at.date), so a slot on the
          start date is accepted and a slot on the end date is REJECTED
          (adjacency at end_at is outside, not touching-allowed).
        test_recipe:
          setup:
            - "ACTIVE PRO contract with one assigned seat and a DRAFT posting spanning 2026-09-01..2026-09-05"
          setup_api_calls:
            - call: "POST /contracts"
              payload: { contract_number: "C-OVL-1", product_tier: "RECRUITER_PRO", seat_cap: 5 }
              as: ContractAdmin
              captures: { cid: $.data.id }
            - call: "POST /contracts/${cid}/activate"
              payload: { seats_purchased_initial: 1 }
              as: ContractAdmin
            - call: "POST /recruiters"
              payload: { email: "r11@x.com", full_name: "R Eleven", home_contract_id: "${cid}" }
              as: ContractAdmin
              captures: { rec1: $.data.id }
            - call: "GET /contracts/${cid}/seats"
              as: ContractAdmin
              captures: { seat1: $.data.0.id, seat1_v: $.data.0.version }
            - call: "POST /contracts/${cid}/seats/${seat1}/assign"
              payload: { recruiter_id: "${rec1}", expected_seat_version: "${seat1_v}" }
              as: SeatAdmin
            - call: "POST /contracts/${cid}/job-postings"
              payload: { title: "SlotJob", budget_cents: 5000, daily_cap_cents: 1000, pacing_mode: "EVEN", start_at: "2026-09-01T00:00:00Z", end_at: "2026-09-05T00:00:00Z", created_by_seat_id: "${seat1}" }
              as: SeatAdmin
              captures: { jp: $.data.id }
          trigger:
            - call: "POST /contracts/${cid}/job-postings/${jp}/promoted-slots"
              payload: { slot_date: "2026-09-01", reserved_cents: 100 }
              as: SeatAdmin
              captures: { slot_ok: $.data.id }
            - call: "POST /contracts/${cid}/job-postings/${jp}/promoted-slots"
              payload: { slot_date: "2026-09-05", reserved_cents: 100 }
              as: SeatAdmin
              captures: { slot_err: $.data.error_id }
          assert:
            - "slot on start date 2026-09-01 accepted (created)"
            - "slot on end date 2026-09-05 rejected with ERR_INVALID_DATE_RANGE — [start, end) half-open"

      - name: quota_ledger_periods_disjoint_no_overlap
        grounds:
          - state_machines.QuotaLedger
          - state_machines.RecruiterContract.RENEWAL_PENDING_to_ACTIVE
        distinguishing_aspect: |
          Adjacent-period semantics on the QuotaLedger resource (different
          from slot half-open geometry): at renewal the OLD period's OPEN
          ledger is CLOSED and a NEW ledger at period_index+1 opens — the
          two ledgers never overlap in time (old closes at the instant the
          new opens), so a search after renewal consumes from period 2
          only and period-1 usage is frozen at its final value.
        test_recipe:
          setup:
            - "ACTIVE PRO contract with one assigned seat; 5 searches consumed in period 1; clock advanced past current_period_end so contract is RENEWAL_PENDING; APPROVED RENEWAL event ready"
          setup_api_calls:
            - call: "POST /contracts"
              payload: { contract_number: "C-OVL-2", product_tier: "RECRUITER_PRO", seat_cap: 5 }
              as: ContractAdmin
              captures: { cid: $.data.id }
            - call: "POST /contracts/${cid}/activate"
              payload: { seats_purchased_initial: 1 }
              as: ContractAdmin
            - call: "POST /recruiters"
              payload: { email: "r12@x.com", full_name: "R Twelve", home_contract_id: "${cid}" }
              as: ContractAdmin
              captures: { rec1: $.data.id }
            - call: "GET /contracts/${cid}/seats"
              as: ContractAdmin
              captures: { seat1: $.data.0.id, seat1_v: $.data.0.version }
            - call: "POST /contracts/${cid}/seats/${seat1}/assign"
              payload: { recruiter_id: "${rec1}", expected_seat_version: "${seat1_v}" }
              as: SeatAdmin
            - call: "POST /candidate-profiles"
              payload: { member_id: "m-y", full_name: "C Y", headline: "h", privacy_setting: "PUBLIC", open_to_work: false, open_to_work_visibility: "NONE", years_experience: 2, current_title: "t" }
              as: ContractAdmin
            - call: "POST /seats/${seat1}/candidate-search"
              payload: { filter_spec: { current_title: "t" } }
              as: RecruiterUser
              as_user_id: "${rec1}"
            - call: "POST /seats/${seat1}/candidate-search"
              payload: { filter_spec: { current_title: "t" } }
              as: RecruiterUser
              as_user_id: "${rec1}"
            - call: "POST /seats/${seat1}/candidate-search"
              payload: { filter_spec: { current_title: "t" } }
              as: RecruiterUser
              as_user_id: "${rec1}"
            - call: "POST /seats/${seat1}/candidate-search"
              payload: { filter_spec: { current_title: "t" } }
              as: RecruiterUser
              as_user_id: "${rec1}"
            - call: "POST /seats/${seat1}/candidate-search"
              payload: { filter_spec: { current_title: "t" } }
              as: RecruiterUser
              as_user_id: "${rec1}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-02T00:00:00Z" }
              as: ContractAdmin
            - call: "GET /contracts/${cid}"
              as: ContractAdmin
              captures: { cv: $.data.version, cst: $.data.contract_status }
            - call: "POST /contracts/${cid}/renewal-events"
              payload: { event_kind: "RENEWAL", expected_contract_version: "${cv}" }
              as: Auditor
              captures: { ev: $.data.id }
            - call: "POST /renewal-events/${ev}/approve"
              as: Auditor
            - call: "POST /renewal-events/${ev}/apply"
              as: Auditor
          trigger:
            - call: "POST /seats/${seat1}/candidate-search"
              payload: { filter_spec: { current_title: "t" } }
              as: RecruiterUser
              as_user_id: "${rec1}"
            - call: "GET /seats/${seat1}/quota-ledgers"
              as: Auditor
          assert:
            - "GET /seats/${seat1}/quota-ledgers returns exactly 2 ledgers: period_index=1 CLOSED with searches_used=5, period_index=2 OPEN with searches_used=1"
            - "the post-renewal search consumed period 2 only — periods are disjoint, never overlapping"

  # =====================================================================
  # Rule 9 — compensating_invariant (2 instances, different conserved quantities)
  # =====================================================================
  - rule_id: compensating_invariant
    instances:
      - name: credit_pool_accounting_identity_send_then_return
        grounds:
          - calculations.credit_return_on_response
          - entities.MessageCreditPool.fields.credits_available
        distinguishing_aspect: |
          Conserved quantity is the credit accounting identity
          credits_granted == credits_used - credits_returned + credits_available:
          a send followed by its RESPONDED compensation returns the pool
          to its pre-send credits_available exactly, with
          credit_returned_flag preventing double-return drift.
        test_recipe:
          setup:
            - "ACTIVE PRO contract (100 credits/seat) with one assigned seat, one OPEN project, two visible PUBLIC candidates"
          setup_api_calls:
            - call: "POST /contracts"
              payload: { contract_number: "C-INV-1", product_tier: "RECRUITER_PRO", seat_cap: 5 }
              as: ContractAdmin
              captures: { cid: $.data.id }
            - call: "POST /contracts/${cid}/activate"
              payload: { seats_purchased_initial: 1 }
              as: ContractAdmin
            - call: "POST /recruiters"
              payload: { email: "r13@x.com", full_name: "R 13", home_contract_id: "${cid}" }
              as: ContractAdmin
              captures: { rec1: $.data.id }
            - call: "GET /contracts/${cid}/seats"
              as: ContractAdmin
              captures: { seat1: $.data.0.id, seat1_v: $.data.0.version }
            - call: "POST /contracts/${cid}/seats/${seat1}/assign"
              payload: { recruiter_id: "${rec1}", expected_seat_version: "${seat1_v}" }
              as: SeatAdmin
            - call: "POST /contracts/${cid}/projects"
              payload: { name: "InvP", owner_seat_id: "${seat1}" }
              as: SeatAdmin
              captures: { proj1: $.data.id }
            - call: "POST /projects/${proj1}/open"
              as: SeatAdmin
            - call: "POST /candidate-profiles"
              payload: { member_id: "m-i1", full_name: "C I1", headline: "h", privacy_setting: "PUBLIC", open_to_work: false, open_to_work_visibility: "NONE", years_experience: 2, current_title: "t" }
              as: ContractAdmin
              captures: { cand1: $.data.id }
            - call: "GET /seats/${seat1}/credit-pools"
              as: Auditor
              captures: { pool_before: $.data.0.credits_available }
          trigger:
            - call: "POST /seats/${seat1}/messages"
              payload: { candidate_id: "${cand1}", project_id: "${proj1}", body: "hey" }
              as: RecruiterUser
              as_user_id: "${rec1}"
              captures: { msg1: $.data.id }
            - call: "POST /messages/${msg1}/record-response"
              payload: { response_kind: "RESPONDED" }
              as: AtsService
            - call: "GET /seats/${seat1}/credit-pools"
              as: Auditor
              captures: { g: $.data.0.credits_granted, u: $.data.0.credits_used, r: $.data.0.credits_returned, a: $.data.0.credits_available }
          assert:
            - "pool after: credits_granted == 100, credits_used == 1, credits_returned == 1, credits_available == 100"
            - "identity holds: 100 == 1 - 1 + 100"
            - "credits_available equals its pre-send value (${pool_before}) — send+respond is a clean compensating pair"

      - name: seat_count_invariant_through_trueup_cycle
        grounds:
          - state_machines.RecruiterContract.ACTIVE_to_ACTIVE
          - entities.RecruiterContract.fields.seats_purchased
          - entities.RecruiterContract.fields.seats_assigned
        distinguishing_aspect: |
          Conserved quantity is the seat-count identity
          seats_purchased == count(non-REVOKED seats) AND
          seats_assigned == count(ASSIGNED seats): a positive true-up
          (+2) followed by its compensating negative true-up (-2) returns
          seats_purchased to the original value with zero drift, and the
          assign/unassign pairs in between keep seats_assigned exact.
        test_recipe:
          setup:
            - "ACTIVE PRO contract with seats_purchased=1 and one seat assigned"
          setup_api_calls:
            - call: "POST /contracts"
              payload: { contract_number: "C-INV-2", product_tier: "RECRUITER_PRO", seat_cap: 10 }
              as: ContractAdmin
              captures: { cid: $.data.id }
            - call: "POST /contracts/${cid}/activate"
              payload: { seats_purchased_initial: 1 }
              as: ContractAdmin
            - call: "POST /recruiters"
              payload: { email: "r14@x.com", full_name: "R 14", home_contract_id: "${cid}" }
              as: ContractAdmin
              captures: { rec1: $.data.id }
            - call: "GET /contracts/${cid}/seats"
              as: ContractAdmin
              captures: { seat1: $.data.0.id, seat1_v: $.data.0.version }
            - call: "POST /contracts/${cid}/seats/${seat1}/assign"
              payload: { recruiter_id: "${rec1}", expected_seat_version: "${seat1_v}" }
              as: SeatAdmin
            - call: "GET /contracts/${cid}"
              as: ContractAdmin
              captures: { cv1: $.data.version }
            - call: "POST /contracts/${cid}/renewal-events"
              payload: { event_kind: "TRUE_UP", seats_delta: 2, expected_contract_version: "${cv1}" }
              as: Auditor
              captures: { ev_up: $.data.id }
            - call: "POST /renewal-events/${ev_up}/approve"
              as: Auditor
            - call: "POST /renewal-events/${ev_up}/apply"
              as: Auditor
          trigger:
            - call: "GET /contracts/${cid}"
              as: ContractAdmin
              captures: { sp_mid: $.data.seats_purchased, cv2: $.data.version }
            - call: "POST /contracts/${cid}/renewal-events"
              payload: { event_kind: "TRUE_UP", seats_delta: -2, expected_contract_version: "${cv2}" }
              as: Auditor
              captures: { ev_dn: $.data.id }
            - call: "POST /renewal-events/${ev_dn}/approve"
              as: Auditor
            - call: "POST /renewal-events/${ev_dn}/apply"
              as: Auditor
            - call: "GET /contracts/${cid}"
              as: ContractAdmin
              captures: { sp_end: $.data.seats_purchased, sa_end: $.data.seats_assigned }
            - call: "GET /contracts/${cid}/seats"
              as: Auditor
              payload: { seat_status: "UNASSIGNED" }
            - call: "GET /contracts/${cid}/seats"
              as: Auditor
              payload: { seat_status: "REVOKED" }
            - call: "GET /contracts/${cid}/seats"
              as: Auditor
              payload: { seat_status: "ASSIGNED" }
          assert:
            - "after +2 true-up: seats_purchased == 3 (captured mid-flight)"
            - "after compensating -2 true-up: seats_purchased == 1 (back to original — zero drift)"
            - "seats_assigned == 1 throughout (the assigned seat is never revoked by a negative true-up)"
            - "status-filtered seat counts: ASSIGNED=1, UNASSIGNED=0, REVOKED=2, so ASSIGNED+UNASSIGNED == 1 == seats_purchased"
