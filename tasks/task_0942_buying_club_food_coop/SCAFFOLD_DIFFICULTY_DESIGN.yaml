      - call: GET /drop-runs/${dr_b}
        payload: {}
        as: Member
        as_user_id: ${ma_id}
      assert:
      - immediately after the create, DropRun.${dr_b}.subtotal_cents == 17250
      - after the cancel, DropRun.${dr_b}.subtotal_cents == 5250
      - OrderLine.${ol_oat2}.status == CANCELLED
      - OrderLine.${ol_salt}.status == REQUESTED
      - GET /order-lines filtered by member_order_id ${mo_a} and status REQUESTED returns total_count 1
  - name: authorizing_then_cancelling_the_cycle_conserves_member_credit
    grounds:
    - conservation_invariants.member_credit_conserved_on_authorization_void
    - state_machines.MemberOrder.UNPAID_to_AUTHORIZED
    - state_machines.Payment.SUCCEEDED_to_VOIDED
    - state_machines.Cycle.LOCKED_to_CANCELLED
    - entities.Member.fields.credit_balance_cents
    distinguishing_aspect: 'Conserved quantity two is a different kind of quantity - store credit in cents on Member.credit_balance_cents - rather than order value: an authorization reserves nothing, so voiding it through the cycle cancellation must leave the member''s 5000-cent credit position and 0-cent captured position byte-identical.'
    test_recipe:
      setup:
      - Mara holds a single 5000-cent adjustment grant expiring 2026-12-01 and has captured nothing.
      - Her order carries one 5-unit SALT-1 line worth 5250 cents, so the cutoff estimate is 4987 and the authorization is 5486.
      - The May cycle is LOCKED and her order is AUTHORIZED.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-05-05T00:00:00Z'
        as: ClubAdmin
      - call: POST /routes
        payload:
          code: R-NORTH
          name: North Route
          reefer_slots: 2
          route_minimum_cents: 1000
          max_pallets: 12
        as: ClubAdmin
        captures:
          r_north: $.data.id
      - call: POST /drop-points
        payload:
          route_id: ${r_north}
          name: Depot A
          drop_minimum_cents: 1000
        as: ClubAdmin
        captures:
          d_a: $.data.id
      - call: POST /members
        payload:
          email: cora@coop.test
          full_name: Cora Ord
          home_drop_point_id: ${d_a}
          tier: PRO
        as: ClubAdmin
        captures:
          mc_id: $.data.id
          mc_v: $.data.version
      - call: POST /members/${mc_id}/dues-payments
        payload:
          amount_cents: 18000
          term_years: 1
          expected_member_version: ${mc_v}
        as: ClubAdmin
      - call: POST /drop-points
        payload:
          route_id: ${r_north}
          name: Depot B
          coordinator_member_id: ${mc_id}
          drop_minimum_cents: 1000
        as: ClubAdmin
        captures:
          d_b: $.data.id
      - call: POST /members
        payload:
          email: mara@coop.test
          full_name: Mara Plus
          home_drop_point_id: ${d_b}
          tier: PLUS
        as: ClubAdmin
        captures:
          ma_id: $.data.id
          ma_v: $.data.version
      - call: POST /members/${ma_id}/dues-payments
        payload:
          amount_cents: 9000
          term_years: 1
          expected_member_version: ${ma_v}
        as: ClubAdmin
      - call: POST /items
        payload:
          sku: SALT-1
          name: Sea Salt 1kg
          temp_class: DRY
          case_pack_units: 5
          unit_weight_grams: 1000
          unit_cube_cm3: 1000
          split_allowed: true
          remainder_policy: SHORT_FILL
        as: ClubAdmin
        captures:
          i_salt: $.data.id
      - call: POST /price-versions
        payload:
          item_id: ${i_salt}
          effective_from: '2026-04-01T00:00:00Z'
          case_price_cents: 5250
        as: ClubAdmin
        captures:
          pv_salt: $.data.id
      - call: GET /members/${ma_id}
        payload: {}
        as: ClubAdmin
        captures:
          ma_v2: $.data.version
      - call: POST /credit-grants
        payload:
          member_id: ${ma_id}
          amount_cents: 5000
          expires_at: '2026-12-01T00:00:00Z'
          expected_member_version: ${ma_v2}
        as: ClubAdmin
        captures:
          g5000: $.data.id
      - call: POST /cycles
        payload:
          code: CY-MAY
          opens_at: '2026-05-05T00:00:00Z'
          cutoff_at: '2026-05-25T00:00:00Z'
        as: ClubAdmin
        captures:
          cyc: $.data.id
      - call: POST /drop-runs
        payload:
          cycle_id: ${cyc}
          drop_point_id: ${d_b}
        as: ClubAdmin
        captures:
          dr_b: $.data.id
          dr_b_v: $.data.version
      - call: POST /member-orders
        payload:
          member_id: ${ma_id}
          drop_run_id: ${dr_b}
        as: Member
        as_user_id: ${ma_id}
        captures:
          mo_a: $.data.id
          mo_a_v1: $.data.version
      - call: POST /order-lines
        payload:
          member_order_id: ${mo_a}
          item_id: ${i_salt}
          qty_units: 5
          expected_member_order_version: ${mo_a_v1}
        as: Member
        as_user_id: ${ma_id}
        captures:
          ol_salt: $.data.id
      - call: POST /member-orders/${mo_a}/submit
        payload: {}
        as: Member
        as_user_id: ${ma_id}
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-05-25T00:00:00Z'
        as: ClubAdmin
      - call: POST /cycles/${cyc}/lock
        payload: {}
        as: ClubAdmin
      - call: POST /member-orders/${mo_a}/authorize
        payload:
          simulated_outcome: SUCCEEDED
        as: FinanceOfficer
      trigger:
      - call: GET /members/${ma_id}
        payload: {}
        as: ClubAdmin
      - call: POST /cycles/${cyc}/cancel
        payload: {}
        as: ClubAdmin
      - call: GET /payments
        payload:
          member_order_id: ${mo_a}
          kind: AUTHORIZATION
        as: FinanceOfficer
        captures:
          pay_auth: $.data[0].id
      assert:
      - before the cancel, Member.${ma_id}.credit_balance_cents == 5000
      - before the cancel, MemberOrder.${mo_a}.authorized_amount_cents == 5486
      - before the cancel, MemberOrder.${mo_a}.payment_status == AUTHORIZED
      - after the cancel, Member.${ma_id}.credit_balance_cents == 5000
      - after the cancel, CreditGrant.${g5000}.remaining_cents == 5000
      - after the cancel, CreditGrant.${g5000}.status == ACTIVE
      - after the cancel, MemberOrder.${mo_a}.authorized_amount_cents == 0
      - after the cancel, MemberOrder.${mo_a}.captured_cents == 0
      - after the cancel, MemberOrder.${mo_a}.payment_status == VOIDED
      - after the cancel, MemberOrder.${mo_a}.status == CANCELLED
      - Payment.${pay_auth}.status == VOIDED
