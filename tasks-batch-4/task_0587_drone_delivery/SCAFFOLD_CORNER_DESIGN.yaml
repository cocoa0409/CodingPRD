      - name: distance_exactly_at_max_range_accepted_one_step_beyond_rejected
        claim_type: threshold_boundary
        grounds: [calculations.order_geometry, "validations[priority=20]", "errors[ERR_OUT_OF_SERVICE_RANGE]"]
        distinguishing_aspect: "The range gate is distance_km <= max_range_km: a customer at exactly 5.550 km in an area with max_range_km 5.55 is accepted, while one at 5.661 km is rejected with ERR_OUT_OF_SERVICE_RANGE."
        test_recipe:
          setup: ["Service area Edge with centroid 37.0/-122.0 and max_range_km == 5.55; customer Near at 37.05/-122.0 (5.550 km) and customer Far at 37.051/-122.0 (5.661 km)."]
          setup_api_calls:
            - call: "POST /service-areas"
              payload: { name: "Edge", center_lat: 37.0, center_lon: -122.0, max_range_km: 5.55, max_payload_g: 2500 }
              as: PlatformAdmin
              captures: { sa_id: $.data.id }
            - call: "POST /customers"
              payload: { name: "Near", email: "near@x.com", dropoff_lat: 37.05, dropoff_lon: -122.0 }
              as: PlatformAdmin
              captures: { cust_near: $.data.id }
            - call: "POST /customers"
              payload: { name: "Far", email: "far@x.com", dropoff_lat: 37.051, dropoff_lon: -122.0 }
              as: PlatformAdmin
              captures: { cust_far: $.data.id }
          trigger:
            - call: "POST /orders"
              payload: { customer_id: "${cust_near}", service_area_id: "${sa_id}", payload_weight_g: 2000, priority: "STANDARD" }
              as: DispatchOperator
              as_user_id: "op-1"
              captures: { order_near: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_far}", service_area_id: "${sa_id}", payload_weight_g: 2000, priority: "STANDARD" }
              as: DispatchOperator
              as_user_id: "op-1"
          assert:
            - "the Near order -> 201 with Order.${order_near}.distance_km == 5.550"
            - "the Far order -> 422 with error_id ERR_OUT_OF_SERVICE_RANGE"
            - "GET /orders?service_area_id=${sa_id} returns exactly 1 order"

