      - name: refill_threshold_strict_less_than_one_ml
        grounds:
          - entities.SerumVial.fields.needs_refill
          - entities.SerumVial.fields.remaining_volume_ml
        distinguishing_aspect: |
          Different metric (residual volume, not elapsed time) on a different endpoint
          (GET /serum-vials/{id}): needs_refill is strictly remaining_volume_ml < 1.0; a
          vial prepared 1.0 mL drawn 0.10 mL leaves 0.90 mL which IS < 1.0 -> needs_refill true.
        test_recipe:
          setup:
            - "An ACTIVE RED-start plan with a RED vial prepared 1.0 mL, one released shot drawing 0.10 mL (remaining 0.90 mL)."
