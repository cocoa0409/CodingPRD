      - name: allocation_claim_junction_links_offer_and_venue_in_graph_topology
        claim_type: graph
        grounds:
          - complexity_profile.entity_topology
          - entities.AllocationClaim.fields.offer_id
          - entities.AllocationClaim.fields.venue_id
          - validations[priority=21]
          - errors[ERR_DUPLICATE_CLAIM]
