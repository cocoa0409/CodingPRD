              payload: {}
              as: HotelManagerOps
              as_user_id: "u-mgr-1"
            - call: "POST /hotel-management/budgets/${tl_bud}/decision"
              payload: { decision: "APPROVE" }
              as: OwnerRep
              as_user_id: "u-owner-1"
            - call: "POST /hotel-management/agreements/${tl_agr}/report-packages"
              payload: { fiscal_year: 2026, period_month: 9, rooms_revenue_cents: 20000000, fnb_revenue_cents: 5000000, other_revenue_cents: 1000000, operating_expenses_cents: 5000000, closing_cash_available_cents: 0 }
              as: HotelManagerOps
              captures: { tl_pkg: $.data.id }
            - call: "POST /hotel-management/report-packages/${tl_pkg}/benchmarks"
              payload: { hotel_revpar_cents: 10000, comp_set_revpar_cents: 12000, rooms_available: 3000, source: "STR_REPORT" }
              as: HotelManagerOps
            - call: "POST /hotel-management/report-packages/${tl_pkg}/submit"
              payload: {}
              as: HotelManagerOps
            - call: "POST /hotel-management/report-packages/${tl_pkg}/owner-review"
              payload: { dimension: "FINANCIAL", decision: "ACCEPT" }
              as: OwnerRep
              as_user_id: "u-owner-1"
            - call: "POST /hotel-management/report-packages/${tl_pkg}/owner-review"
              payload: { dimension: "BENCHMARK", decision: "ACCEPT" }
