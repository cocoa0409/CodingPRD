# =============================================================================
# Scaffold: food-safety-traceability (FSMA) — Expert band
# §1.0–§1.7 (no scaffold_difficulty_design / scaffold_corner_design keys here)
# Flat topology: every entity is a top-level collection under /traceability;
# relationships are body foreign keys (no nested resource URLs).
# =============================================================================

scenario: |
  167. Food Safety & Traceability (FSMA): lot/batch genealogy, supplier COA,
  allergen control, HACCP/CCP monitoring, temperature excursion, one-up/one-down
  mock recall trace, hold/release, FEFO expiration rotation

domain_name: food-safety-traceability
api_prefix: /traceability

# -----------------------------------------------------------------------------
# Complexity profile
# -----------------------------------------------------------------------------
complexity_profile:
  primary_archetype: graph_constraint        # lot genealogy is a DAG; recall trace is transitive closure
  secondary_archetype: compliance_audit      # HACCP/CCP, hold/release, COA acceptance gates
  complexity_layers:
    - cascading_side_effects                  # hold a parent lot -> hold all descendant lots
    - dual_variant_calculation                # provisional vs finalized recall exposure quantity
    - rate_threshold_triggers                 # CCP limit breach, cumulative excursion minutes, supplier streak
    - derived_field_reconciliation            # ConsumedLot decrements available_qty; hold_status bubbles up

  entity_topology: flat
  # flat: peer entities linked by foreign keys; no nesting in URL paths. Each
  # collection lives at /traceability/<segment>; relationships are body FKs.

  state_machine_shape: branching
  # COA forks PENDING -> {ACCEPTED, REJECTED}; Lot forks RECEIVED -> {RELEASED, REJECTED};
  # ProductionRun forks OPEN -> {FINALIZED, ABORTED}; HoldOrder forks ACTIVE -> {RELEASED, DISPOSED}
  # with divergent side-effect sets per branch.

  relationship_patterns:
    - one_to_many        # Facility -> Lots, Supplier -> Lots
    - many_to_many       # ConsumedLot junction: a FINISHED Lot consumes many source Lots
    - self_referential   # Lot genealogy: a FINISHED Lot's parents are source Lots via ConsumedLot
    - cross_aggregate    # HoldOrder targets a Lot across the genealogy graph

  role_model: peer_roles
  # QualityManager owns COA/hold/release/setup; ReceivingClerk receives lots + attaches COAs;
  # ProductionOperator runs production + CCP readings; SafetyAuditor is read-only oversight.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Facility
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Facility name" }
      - { name: gln, type: string, source: input, description: "Global Location Number (uniqueness key)", constraints: "unique across facilities" }
      - { name: current_utc, type: datetime, source: system, description: "Deterministic facility clock; advances only via POST /traceability/facilities/{id}/clock; initialized to initial_utc at creation" }

  - name: Supplier
    parent: null
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id" }
      - { name: name, type: string, source: input, description: "Supplier legal name" }
      - { name: approval_status, type: enum, source: system, description: "Approval lifecycle", constraints: "values: APPROVED, SUSPENDED; initialized APPROVED; flips SUSPENDED via calc supplier_suspension" }
      - { name: coa_required, type: boolean, source: input, default: true, description: "Whether inbound lots from this supplier require an ACCEPTED COA before release" }
      - { name: failed_coa_streak, type: integer, source: computed, default: 0, description: "Consecutive rejected COAs; SUSPENDED auto-set when this reaches SUSPEND_STREAK; reset to 0 on any acceptance" }

  - name: Ingredient
    parent: null
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id" }
      - { name: name, type: string, source: input, description: "Ingredient / material name" }
      - { name: storage_target_c, type: number, source: input, description: "Required storage temperature in Celsius (CCP critical-limit reference)" }
      - { name: storage_tolerance_c, type: number, source: input, default: 2, description: "Allowed +/- deviation in Celsius before a reading is a DEVIATION (strict >)" }
      - { name: shelf_life_days, type: integer, source: input, description: "Days from production/receipt to expiration; used to compute Lot.expiration_date when not supplied" }
      - { name: declared_allergen_codes, type: array, source: input, default: [], description: "Allergen codes intrinsic to this ingredient, e.g. [MILK, SOY]" }

  - name: AllergenProfile
    parent: null
    common_fields: false
    fields:
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id" }
      - { name: code, type: string, source: input, description: "Allergen code, e.g. MILK, EGG, PEANUT, SOY, WHEAT", constraints: "unique per facility_id" }
      - { name: name, type: string, source: input, description: "Human-readable allergen name" }
      - { name: severity_rank, type: integer, source: input, description: "1 (lowest) .. 5 (highest); higher rank wins when picking the controlling allergen" }

  - name: Lot
    parent: null
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id" }
      - { name: supplier_id, type: string, source: input, required: false, description: "FK -> Supplier.id; null for FINISHED lots produced in-house" }
      - { name: ingredient_id, type: string, source: input, description: "FK -> Ingredient.id" }
      - { name: lot_code, type: string, source: input, description: "Supplier/internal lot code", constraints: "unique per (facility_id, ingredient_id)" }
      - { name: lot_kind, type: enum, source: input, description: "Origin of the lot", constraints: "values: RAW_MATERIAL, FINISHED; clients may only POST RAW_MATERIAL — FINISHED is minted by production finalize" }
      - { name: received_qty, type: number, source: input, description: "Quantity received/produced in base units (> 0)" }
      - { name: available_qty, type: number, source: computed, description: "received_qty minus sum of ConsumedLot.quantity drawn by FINALIZED runs; floored at 0" }
      - { name: production_date, type: datetime, source: input, description: "Date lot was produced or received" }
      - { name: expiration_date, type: datetime, source: input, required: false, description: "Provisional lot expiration; if omitted, computed as production_date + ingredient.shelf_life_days" }
      - { name: effective_expiration_date, type: datetime, source: computed, description: "Controlling expiration used by FEFO/expiry gates: equals expiration_date until a COA is ACCEPTED, then production_date + min(ingredient.shelf_life_days, coa.declared_shelf_life_days) (calc effective_expiration)" }
      - { name: cumulative_excursion_minutes, type: integer, source: computed, default: 0, description: "Running sum of CCP deviation excursion minutes for this lot" }
      - { name: effective_allergen_codes, type: array, source: computed, description: "Union of ingredient.declared_allergen_codes and cross-contact allergens inherited from consumed source lots (FINISHED only); equals ingredient codes for RAW_MATERIAL" }
      - { name: controlling_allergen_code, type: string, source: computed, required: false, description: "Code in effective_allergen_codes with highest AllergenProfile.severity_rank; tie-break code ASC; null if none" }
      - { name: status, type: enum, source: system, description: "QC/inventory lifecycle", constraints: "values: RECEIVED, RELEASED, REJECTED, CONSUMED, EXPIRED, DESTROYED" }
      - { name: hold_status, type: enum, source: computed, description: "Freeze state", constraints: "values: FREE, HELD; HELD when any ACTIVE HoldOrder covers this lot (directly or via genealogy)" }
      - { name: coa_status, type: enum, source: computed, description: "COA gate state for RAW_MATERIAL lots", constraints: "values: NOT_REQUIRED, PENDING, ACCEPTED, REJECTED" }

  - name: CertificateOfAnalysis
    parent: Lot
    common_fields: true
    fields:
      - { name: lot_id, type: string, source: input, description: "FK -> Lot.id" }
      - { name: supplier_id, type: string, source: system, description: "FK -> Supplier.id (copied from the lot at creation)" }
      - { name: measured_allergen_codes, type: array, source: input, default: [], description: "Allergens detected by lab testing on this lot" }
      - { name: pathogen_pass, type: boolean, source: input, description: "Whether the pathogen panel passed" }
      - { name: declared_shelf_life_days, type: integer, source: input, description: "Supplier-attested shelf life on the certificate" }
      - { name: status, type: enum, source: system, description: "Decision lifecycle", constraints: "values: PENDING, ACCEPTED, REJECTED" }
      - { name: rejection_reason, type: string, source: computed, required: false, description: "Set when status=REJECTED", constraints: "values: ALLERGEN_UNDISCLOSED, PATHOGEN_FAIL, SHELF_LIFE_SHORT, MANUAL" }

  - name: ProductionRun
    parent: Facility
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id" }
      - { name: ingredient_id, type: string, source: input, description: "FK -> Ingredient.id (recipe key of the finished good)" }
      - { name: planned_output_qty, type: number, source: input, description: "Planned finished quantity in base units (> 0)" }
      - { name: output_lot_id, type: string, source: computed, required: false, description: "FK -> Lot.id (the FINISHED lot minted on finalize); null until FINALIZED" }
      - { name: started_at, type: datetime, source: system, description: "Facility current_utc when the run was opened" }
      - { name: status, type: enum, source: system, description: "Run lifecycle", constraints: "values: OPEN, FINALIZED, ABORTED" }

  - name: ConsumedLot
    parent: ProductionRun
    common_fields: true
    fields:
      - { name: production_run_id, type: string, source: input, description: "FK -> ProductionRun.id" }
      - { name: source_lot_id, type: string, source: input, description: "FK -> Lot.id (the source lot drawn from)" }
      - { name: quantity, type: number, source: input, description: "Quantity drawn from the source lot in base units (> 0)" }

  - name: CCPReading
    parent: Lot
    common_fields: true
    fields:
      - { name: lot_id, type: string, source: input, description: "FK -> Lot.id (the monitored lot)" }
      - { name: ccp_type, type: enum, source: input, description: "Monitored CCP type", constraints: "values: TEMPERATURE" }
      - { name: measured_value_c, type: number, source: input, description: "Measured temperature in Celsius" }
      - { name: measured_at, type: datetime, source: input, description: "Timestamp of the reading (<= facility current_utc and >= prior reading)" }
      - { name: classification, type: enum, source: computed, description: "Spec classification", constraints: "values: IN_SPEC, DEVIATION; DEVIATION when abs(measured - storage_target_c) > storage_tolerance_c" }
      - { name: excursion_minutes, type: integer, source: computed, default: 0, description: "Whole minutes since the prior reading, accrued only when this reading is a DEVIATION" }

  - name: HoldOrder
    parent: null
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id" }
      - { name: target_lot_id, type: string, source: input, description: "FK -> Lot.id (directly held lot; descendants inherit the hold)" }
      - { name: reason, type: enum, source: input, description: "Hold reason", constraints: "values: ALLERGEN, PATHOGEN, TEMPERATURE_EXCURSION, RECALL, OTHER" }
      - { name: disposition, type: enum, source: computed, required: false, description: "Terminal resolution outcome", constraints: "values: RELEASED, DISPOSED" }
      - { name: held_lot_count, type: integer, source: computed, description: "Count of distinct lots (target + downstream descendants) frozen at issue time" }
      - { name: status, type: enum, source: system, description: "Hold lifecycle", constraints: "values: ACTIVE, RELEASED, DISPOSED" }

  - name: StorageZone
    parent: null
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id" }
      - { name: zone_code, type: string, source: input, description: "Cold-storage zone identifier", constraints: "unique per facility_id" }
      - { name: capacity_units, type: number, source: input, description: "Maximum aggregate capacity_units that may be occupied by time-overlapping bookings in this zone (> 0)" }
      - { name: target_temp_c, type: number, source: input, description: "Zone setpoint temperature in Celsius" }

  - name: StorageBooking
    parent: StorageZone
    common_fields: true
    fields:
      - { name: zone_id, type: string, source: input, description: "FK -> StorageZone.id (the booked zone)" }
      - { name: lot_id, type: string, source: input, description: "FK -> Lot.id (the lot occupying the zone)" }
      - { name: start_utc, type: datetime, source: input, description: "Inclusive interval start (half-open interval [start_utc, end_utc))" }
      - { name: end_utc, type: datetime, source: input, description: "Exclusive interval end; must be > start_utc" }
      - { name: capacity_units, type: number, source: input, description: "Capacity_units this booking occupies in the zone (> 0)" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: CertificateOfAnalysis
    initial_state: PENDING
    terminal_states: [ACCEPTED, REJECTED]
    transitions:
      - from: PENDING
        to: ACCEPTED
        trigger: "POST /traceability/coa/{cid}/decide with decision=ACCEPT"
        actor: QualityManager
        preconditions:
          - "COA in PENDING (ERR_COA_NOT_PENDING)"
          - "measured_allergen_codes subset of ingredient.declared_allergen_codes (ERR_COA_ALLERGEN_UNDISCLOSED)"
          - "pathogen_pass == true (ERR_COA_PATHOGEN_FAIL)"
          - "declared_shelf_life_days >= ingredient.shelf_life_days (ERR_COA_SHELF_LIFE_SHORT)"
        side_effects:
          - "Lot.coa_status := ACCEPTED"
          - "Lot.effective_expiration_date := production_date + min(ingredient.shelf_life_days, coa.declared_shelf_life_days) (calc effective_expiration finalized variant)"
          - "Supplier.failed_coa_streak := 0 (calc supplier_suspension reset branch)"
          - "increments CertificateOfAnalysis.version by 1"
      - from: PENDING
        to: REJECTED
        trigger: "POST /traceability/coa/{cid}/decide with decision=REJECT"
        actor: QualityManager
        preconditions:
          - "COA in PENDING (ERR_COA_NOT_PENDING)"
        side_effects:
          - "rejection_reason := MANUAL"
          - "Lot.coa_status := REJECTED"
          - "Supplier.failed_coa_streak += 1 (calc supplier_suspension)"
          - "if Supplier.failed_coa_streak >= SUSPEND_STREAK then Supplier.approval_status := SUSPENDED (cascade C hop 2)"
          - "increments CertificateOfAnalysis.version by 1"

  - entity: Lot
    initial_state: RECEIVED
    terminal_states: [REJECTED, CONSUMED, EXPIRED, DESTROYED]
    transitions:
      - from: RECEIVED
        to: RELEASED
        trigger: "POST /traceability/lots/{lid}/release"
        actor: QualityManager
        preconditions:
          - "Lot.status == RECEIVED (ERR_LOT_NOT_RECEIVED)"
          - "Lot.hold_status == FREE (ERR_LOT_ON_HOLD)"
          - "if supplier.coa_required and lot_kind == RAW_MATERIAL: coa_status == ACCEPTED (ERR_COA_NOT_ACCEPTED)"
          - "facility current_utc < Lot.effective_expiration_date (ERR_LOT_EXPIRED)"
        side_effects:
          - "Lot.status := RELEASED (lot becomes consumable by production)"
          - "increments Lot.version by 1"
      - from: RECEIVED
        to: REJECTED
        trigger: "POST /traceability/lots/{lid}/reject"
        actor: QualityManager
        preconditions:
          - "Lot.status == RECEIVED (ERR_LOT_NOT_RECEIVED)"
        side_effects:
          - "Lot.status := REJECTED"
          - "increments Lot.version by 1"
      - from: RELEASED
        to: CONSUMED
        trigger: "system on ProductionRun finalize when this source lot's available_qty reaches 0"
        actor: system
        preconditions:
          - "available_qty reaches exactly 0 after the finalize draw"
        side_effects:
          - "Lot.status := CONSUMED"
          - "increments Lot.version by 1"
      - from: RELEASED
        to: EXPIRED
        trigger: "system on POST /traceability/facilities/{id}/clock advancing past Lot.effective_expiration_date"
        actor: system
        preconditions:
          - "facility current_utc >= Lot.effective_expiration_date after the advance"
          - "Lot.hold_status == FREE (a HELD lot is frozen and is skipped by the expiry sweep)"
        side_effects:
          - "Lot.status := EXPIRED"
          - "increments Lot.version by 1"
      - from: RELEASED
        to: DESTROYED
        trigger: "system on HoldOrder DISPOSE resolution covering this lot"
        actor: system
        preconditions:
          - "An ACTIVE HoldOrder covering this lot transitions to DISPOSED"
        side_effects:
          - "Lot.status := DESTROYED"
          - "Lot.available_qty := 0"
          - "increments Lot.version by 1"
      - from: RECEIVED
        to: DESTROYED
        trigger: "system on HoldOrder DISPOSE resolution covering this lot"
        actor: system
        preconditions:
          - "An ACTIVE HoldOrder covering this RECEIVED lot transitions to DISPOSED"
        side_effects:
          - "Lot.status := DESTROYED"
          - "Lot.available_qty := 0"
          - "increments Lot.version by 1"

  - entity: ProductionRun
    initial_state: OPEN
    terminal_states: [FINALIZED, ABORTED]
    transitions:
      - from: OPEN
        to: FINALIZED
        trigger: "POST /traceability/production-runs/{rid}/finalize"
        actor: ProductionOperator
        preconditions:
          - "expected_production_run_version matches current version (ERR_STALE_VERSION) — checked first"
          - "Run has >= 1 ConsumedLot line (ERR_NO_CONSUMED_LOTS)"
          - "Every source lot is RELEASED (ERR_SOURCE_LOT_NOT_RELEASED)"
          - "Every source lot hold_status FREE (ERR_LOT_ON_HOLD)"
          - "No source lot is past expiration at facility current_utc (ERR_SOURCE_LOT_EXPIRED)"
          - "FEFO: no earlier-expiring RELEASED FREE same-ingredient lot is bypassed (ERR_FEFO_VIOLATION)"
          - "Every ConsumedLot.quantity <= source lot available_qty (ERR_INSUFFICIENT_LOT_QTY)"
        side_effects:
          - "decrement each source Lot.available_qty by consumed quantity, lines ordered by ConsumedLot.created_at ASC (cascade A hop 1; calc available_quantity)"
          - "any source lot whose available_qty reaches 0 -> Lot.status CONSUMED (cascade A hop 2)"
          - "mint a FINISHED Lot (output_lot_id), status RECEIVED, lot_kind FINISHED, supplier_id null, lot_code = \"FIN-\" + production_run_id (unique per facility/ingredient), received_qty := ProductionRun.planned_output_qty, available_qty := planned_output_qty, hold_status FREE, coa_status NOT_REQUIRED"
          - "output FINISHED lot effective_allergen_codes = union of source lots' codes + output ingredient declared; controlling_allergen_code computed (calc allergen_inheritance)"
          - "output FINISHED lot production_date := started_at; expiration_date := effective_expiration_date := started_at + ingredient.shelf_life_days"
          - "ProductionRun.status := FINALIZED; ProductionRun.output_lot_id := minted lot id"
          - "increments ProductionRun.version by 1"
      - from: OPEN
        to: ABORTED
        trigger: "POST /traceability/production-runs/{rid}/abort"
        actor: ProductionOperator
        preconditions:
          - "Run in OPEN (ERR_RUN_NOT_OPEN)"
        side_effects:
          - "no inventory drawn (ConsumedLot lines have no effect on available_qty)"
          - "ProductionRun.status := ABORTED"
          - "increments ProductionRun.version by 1"

  - entity: HoldOrder
    initial_state: ACTIVE
    terminal_states: [RELEASED, DISPOSED]
    transitions:
      - from: ACTIVE
        to: RELEASED
        trigger: "POST /traceability/hold-orders/{hid}/resolve with disposition=RELEASE"
        actor: QualityManager
        preconditions:
          - "expected_hold_order_version matches current version (ERR_STALE_VERSION) — checked first"
          - "HoldOrder in ACTIVE (ERR_HOLD_NOT_ACTIVE)"
        side_effects:
          - "disposition := RELEASED; status := RELEASED"
          - "each covered lot recomputes hold_status: FREE if no OTHER ACTIVE hold covers it, else HELD (cascade B-release; calc hold_propagation)"
          - "increments HoldOrder.version by 1"
      - from: ACTIVE
        to: DISPOSED
        trigger: "POST /traceability/hold-orders/{hid}/resolve with disposition=DISPOSE"
        actor: QualityManager
        preconditions:
          - "expected_hold_order_version matches current version (ERR_STALE_VERSION) — checked first"
          - "HoldOrder in ACTIVE (ERR_HOLD_NOT_ACTIVE)"
        side_effects:
          - "disposition := DISPOSED; status := DISPOSED"
          - "each covered non-terminal lot -> Lot.status DESTROYED, available_qty := 0 (cascade B-dispose hop 1, calc hold_propagation)"
          - "every FINISHED lot downstream of a destroyed source lot is in covered_set and is itself DESTROYED (cascade B-dispose hop 2, transitive genealogy)"
          - "increments HoldOrder.version by 1"

# -----------------------------------------------------------------------------
# §1.2.1 Concurrency Rules (OCC on parent version — true races only)
# -----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: hold-resolve-stale
    parent_entity: HoldOrder
    write_endpoint: "POST /traceability/hold-orders/{hid}/resolve"
    occ_field: "expected_hold_order_version"
    description: |
      Resolving a HoldOrder whose version has advanced since the client last
      observed it is rejected. A prior writer may have already resolved it
      (RELEASE or DISPOSE); any such resolution legitimately supersedes the
      current writer's stale view, so the OCC check turns a resolution carrying
      the pre-resolution version into a deterministic stale-version rejection
      rather than a second resolution computed against outdated state.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: production-finalize-stale
    parent_entity: ProductionRun
    write_endpoint: "POST /traceability/production-runs/{rid}/finalize"
    occ_field: "expected_production_run_version"
    description: |
      Finalizing a ProductionRun whose version has advanced since the client
      last observed it is rejected. Adding a ConsumedLot line bumps the run's
      version; a finalize carrying the pre-line version is operating on a stale
      view of the bill of materials and is rejected on the version check before
      any inventory is drawn.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: available_quantity
    trigger: "ProductionRun finalize (cascade A); HoldOrder DISPOSE"
    algorithm: aggregation
    formula: |
      For a source Lot L:
        available_qty(L) = max(0, received_qty(L)
                                  - SUM(ConsumedLot.quantity
                                        WHERE source_lot_id == L.id
                                          AND ConsumedLot.production_run_id IN runs with status FINALIZED))
      On finalize of run R (one atomic draw):
        for each ConsumedLot line c of R, ordered by ConsumedLot.created_at ASC:
          L := source lot of c
          L.available_qty := max(0, L.available_qty - c.quantity)
          if L.available_qty == 0 and L.status == RELEASED: L.status := CONSUMED   # hop 2
      OPEN and ABORTED runs contribute nothing.
    input_set: "ConsumedLot lines of FINALIZED runs only; OPEN and ABORTED runs excluded"
    precision: "base units, round_half_up to 3 decimal places"
    note: "Draw order is ConsumedLot.created_at ASC; never lot id."

  - name: recall_exposure_quantity
    trigger: "GET /traceability/lots/{lid}/recall-trace (one-up/one-down mock recall)"
    algorithm: topological
    formula: |
      Genealogy DAG edge (source_lot -> finished_lot) exists iff a ConsumedLot of
      a FINALIZED run links them.
      one_up_source_lot_ids  = immediate source lots one hop up from the recalled lot
                               (direct ConsumedLot parents of the recalled FINISHED lot;
                               empty for a RAW_MATERIAL lot).
      one_down_finished_lot_ids = transitive closure of FINISHED lots reachable downstream
                               from the recalled lot.
      Traversal order over children: ConsumedLot.created_at ASC then Lot.created_at ASC;
      never lot id. DAG is cycle-free (a finished lot only consumes lots that existed
      before its run's started_at).
      exposure_qty has TWO VARIANTS (provisional vs finalized) — see variants.
    input_set: "ConsumedLot edges of FINALIZED runs; downstream finished lots"
    variants:
      - name: provisional_exposure
        when: "the recalled lot is NOT covered by any DISPOSED hold at trace time"
        difference: "exposure_qty = SUM of received_qty over ALL downstream finished lots in the closure (worst-case: every produced unit assumed still in commerce)"
      - name: finalized_exposure
        when: "the recalled lot IS covered by a DISPOSED hold at trace time"
        difference: "exposure_qty = SUM of received_qty over downstream finished lots EXCLUDING any in DESTROYED status (units already pulled are netted out)"
    precision: "base units, round_half_up to 3 decimal places; rounding order is SUM-THEN-ROUND (accumulate every included received_qty at full precision, then round the total once — NOT round-each-lot-then-sum)"

  - name: hold_propagation
    trigger: "HoldOrder create (cascade B); HoldOrder resolve"
    algorithm: topological
    formula: |
      On HoldOrder H create with target lot T:
        covered_set := { T } UNION { every FINISHED Lot transitively downstream of T
                         via FINALIZED ConsumedLot edges }   # one-down closure
        for each lot X in covered_set with X.status NOT terminal: X.hold_status := HELD
        H.held_lot_count := count(covered_set)               # snapshot at issue time
      On resolve(RELEASE):
        for each lot X in covered_set:
          X.hold_status := HELD if any OTHER ACTIVE HoldOrder still covers X, else FREE
      On resolve(DISPOSE):
        for each lot X in covered_set with X.status NOT terminal:
          X.status := DESTROYED; X.available_qty := 0       # downstream already in covered_set
    input_set: "FINALIZED ConsumedLot edges; covered_set computed once at create and pinned via held_lot_count"
    precision: "integer counts"
    note: "covered_set membership is a property of genealogy, not of lot id ordering."

  - name: excursion_accrual
    trigger: "POST /traceability/ccp-readings"
    algorithm: threshold
    formula: |
      tol := ingredient.storage_tolerance_c ; target := ingredient.storage_target_c
      deviation := abs(reading.measured_value_c - target) > tol           # STRICT >
      classification := DEVIATION if deviation else IN_SPEC
      prev := the lot's most recent prior CCPReading by measured_at ASC (tie-break created_at ASC); null if none
      if classification == DEVIATION and prev is not null:
        excursion_minutes := floor((reading.measured_at - prev.measured_at) total whole minutes)
      else:
        excursion_minutes := 0
      lot.cumulative_excursion_minutes += excursion_minutes
      if lot.cumulative_excursion_minutes > MAX_EXCURSION_MINUTES:           # STRICT >
        auto-issue HoldOrder(reason=TEMPERATURE_EXCURSION, target_lot=this lot)
    constants:
      MAX_EXCURSION_MINUTES: 120
    input_set: "CCPReadings of the single lot ordered by measured_at ASC; tolerance boundary strict >, MAX_EXCURSION_MINUTES boundary strict >"
    precision: "excursion_minutes is floor() to whole minutes"
    note: "Exactly tolerance (== tol) is IN_SPEC; cumulative == 120 does NOT trigger a hold; 121 does."

  - name: allergen_inheritance
    trigger: "ProductionRun finalize (output lot minting)"
    algorithm: aggregation
    formula: |
      output.effective_allergen_codes :=
        DISTINCT( output_ingredient.declared_allergen_codes
                  UNION over each source lot S of S.effective_allergen_codes )
      output.controlling_allergen_code := the code in effective_allergen_codes with the
        highest AllergenProfile.severity_rank; tie-break: lexicographically smallest code;
        null if effective_allergen_codes is empty.
      An undeclared cross-contact (a code present in a source lot's effective set but NOT in
      output_ingredient.declared_allergen_codes) does NOT block finalize, but the output lot
      carries the inherited code so downstream allergen-control reads see it.
    input_set: "source lots of the FINALIZED run plus the output ingredient's declared codes"
    precision: "set union; controlling allergen ordered by severity_rank DESC then code ASC"
    note: "Tie-break uses code/severity, never lot id."

  - name: supplier_suspension
    trigger: "CertificateOfAnalysis decide (cascade C)"
    algorithm: threshold
    formula: |
      on COA REJECT for supplier P:
        P.failed_coa_streak += 1
        if P.failed_coa_streak >= SUSPEND_STREAK: P.approval_status := SUSPENDED   # hop 2
      on COA ACCEPT for supplier P:
        P.failed_coa_streak := 0    # reset baseline
    constants:
      SUSPEND_STREAK: 3
    input_set: "per-supplier consecutive COA decisions; reset to 0 on any acceptance"
    precision: "integer streak; boundary is >= SUSPEND_STREAK (3rd consecutive reject suspends; 2nd does not)"
    note: "Accept resets the streak; only consecutive rejects accumulate."

  - name: effective_expiration
    trigger: "Lot receive (provisional); CertificateOfAnalysis ACCEPT (finalized)"
    algorithm: forward_looking
    formula: |
      Two valid approaches to the same Lot expiration metric:
      provisional (at receipt, COA not yet accepted):
        effective_expiration_date := COALESCE(input expiration_date,
                                              production_date + ingredient.shelf_life_days)
      finalized (on COA ACCEPT):
        effective_expiration_date := production_date
                                     + min(ingredient.shelf_life_days, coa.declared_shelf_life_days)
      The FEFO gate (validation priority 13), the release expiry gate (priority 12),
      and the clock expiry sweep all read effective_expiration_date, NOT the raw
      input expiration_date.
    input_set: "ingredient.shelf_life_days and (finalized only) the ACCEPTED coa.declared_shelf_life_days"
    variants:
      - name: provisional_expiration
        when: "lot received, coa_status in {NOT_REQUIRED, PENDING}"
        difference: "ignores COA shelf life; uses input expiration_date or production_date + ingredient.shelf_life_days"
      - name: finalized_expiration
        when: "a COA on the lot has transitioned to ACCEPTED"
        difference: "shortens to production_date + min(ingredient.shelf_life_days, coa.declared_shelf_life_days) when the certificate attests a shorter shelf life"
    precision: "whole days added to production_date"
    note: "min() can only shorten, never extend, the lot's life."

  - name: storage_overlap_capacity
    trigger: "POST /traceability/zones/{zid}/bookings"
    algorithm: interval_merge
    formula: |
      For a candidate StorageBooking C on zone Z over half-open interval [C.start_utc, C.end_utc):
        overlapping := { existing booking B on Z : B.start_utc < C.end_utc
                                                   AND C.start_utc < B.end_utc }   # strict, half-open
        For every instant inside C's interval the coincident load is
        C.capacity_units + SUM(B.capacity_units for B in overlapping that also
        cover that instant). The peak coincident load is checked: if at any
        overlapping sub-interval the summed capacity_units (including C) exceeds
        Z.capacity_units the booking is rejected (ERR_ZONE_CAPACITY_EXCEEDED).
      Adjacency is NOT a conflict: B.end_utc == C.start_utc do not overlap
      (half-open [start, end)).
    input_set: "all StorageBookings on the same zone_id whose interval strictly overlaps the candidate"
    precision: "capacity_units round_half_up to 3 decimals"
    note: "Half-open intervals; touching endpoints are not an overlap. Peak-load over the candidate's overlapping sub-intervals, not a whole-interval sum."

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and well-formed"
    error_id: ERR_MISSING_AUTH
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "Role is permitted for this operation per §1.7"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all
  - priority: 3
    category: existence
    check: "Every resource id in the path exists, validated left-to-right"
    error_id: "ERR_FACILITY_NOT_FOUND / ERR_LOT_NOT_FOUND / ERR_SUPPLIER_NOT_FOUND / ERR_COA_NOT_FOUND / ERR_RUN_NOT_FOUND / ERR_HOLD_NOT_FOUND / ERR_INGREDIENT_NOT_FOUND / ERR_ZONE_NOT_FOUND / ERR_BOOKING_NOT_FOUND"
    http_status: 404
    applies_to: "all resource endpoints"
  - priority: 4
    category: business_constraint
    check: "Required body fields present and types/enums valid (received_qty>0, quantity>0, severity_rank in 1..5)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all write endpoints"
  - priority: 5
    category: business_referential
    check: "Body FK references resolve and belong to the same facility (supplier_id, ingredient_id, source_lot_id, target_lot_id, lot_id, zone/lot pairing on bookings)"
    error_id: ERR_CROSS_FACILITY_REFERENCE
    http_status: 409
    applies_to: "POST lots, POST coa, POST consumed-lots, POST hold-orders, POST ccp-readings, POST zones/{zid}/bookings"
  - priority: 6
    category: business_constraint
    check: "lot_code unique per (facility_id, ingredient_id)"
    error_id: ERR_DUPLICATE_LOT_CODE
    http_status: 409
    applies_to: "POST /traceability/lots"
  - priority: 7
    category: state
    check: "OCC: expected_<parent>_version matches current parent version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST hold-orders/{hid}/resolve, POST production-runs/{rid}/finalize"
    note: "Checked before state preconditions per §1.2.1."
  - priority: 8
    category: state
    check: "Target resource is in the correct state for the transition (COA PENDING, Lot RECEIVED, Run OPEN, Hold ACTIVE)"
    error_id: "ERR_COA_NOT_PENDING / ERR_LOT_NOT_RECEIVED / ERR_RUN_NOT_OPEN / ERR_HOLD_NOT_ACTIVE"
    http_status: 409
    applies_to: "all transition endpoints"
  - priority: 9
    category: business_safety
    check: "Supplier must be APPROVED to receive a new RAW_MATERIAL lot from it"
    error_id: ERR_SUPPLIER_NOT_APPROVED
    http_status: 403
    applies_to: "POST /traceability/lots (lot_kind=RAW_MATERIAL with supplier_id)"
  - priority: 10
    category: business_safety
    check: "A lot under hold cannot be released or consumed (safety freeze precedes COA/fiscal checks)"
    error_id: ERR_LOT_ON_HOLD
    http_status: 409
    applies_to: "POST lots/{lid}/release, POST production-runs/{rid}/finalize"
  - priority: 11
    category: business_safety
    check: "COA acceptance gate: a coa_required RAW_MATERIAL lot must have coa_status ACCEPTED before release"
    error_id: ERR_COA_NOT_ACCEPTED
    http_status: 409
    applies_to: "POST /traceability/lots/{lid}/release"
  - priority: 12
    category: business_temporal
    check: "A lot whose effective_expiration_date <= facility current_utc cannot be released or consumed"
    error_id: "ERR_LOT_EXPIRED / ERR_SOURCE_LOT_EXPIRED"
    http_status: 409
    applies_to: "POST lots/{lid}/release, POST production-runs/{rid}/finalize"
  - priority: 13
    category: business_temporal
    check: "FEFO rotation: a source lot may be consumed only if no RELEASED, FREE, same-ingredient, same-facility lot has an earlier effective_expiration_date"
    error_id: ERR_FEFO_VIOLATION
    http_status: 409
    applies_to: "POST /traceability/production-runs/{rid}/finalize"
    note: "Tie on effective_expiration_date broken by production_date ASC then created_at ASC; never lot id."
  - priority: 14
    category: business_constraint
    check: "CCPReading.measured_at must be <= facility current_utc and > the lot's latest prior reading measured_at (strictly increasing timeline)"
    error_id: ERR_READING_OUT_OF_ORDER
    http_status: 409
    applies_to: "POST /traceability/ccp-readings"
    note: "Reading timeline overlap rule: each reading occupies the instant measured_at; a new reading whose measured_at is <= the latest reading's measured_at collides with the timeline (strict point ordering)."
  - priority: 15
    category: business_fiscal
    check: "ConsumedLot.quantity must not exceed source lot available_qty"
    error_id: ERR_INSUFFICIENT_LOT_QTY
    http_status: 409
    applies_to: "POST production-runs/{rid}/finalize"
  - priority: 16
    category: business_temporal
    check: "StorageBooking interval must be valid (end_utc > start_utc)"
    error_id: ERR_INVALID_INTERVAL
    http_status: 409
    applies_to: "POST /traceability/zones/{zid}/bookings"
  - priority: 17
    category: business_constraint
    check: "StorageBooking peak coincident capacity_units across time-overlapping bookings in the zone must not exceed StorageZone.capacity_units (half-open interval overlap)"
    error_id: ERR_ZONE_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /traceability/zones/{zid}/bookings"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Facility ---
  - method: POST
    path: "/traceability/facilities"
    description: "Create a facility with a deterministic clock seeded by initial_utc"
    roles: [QualityManager]
    code: 201
    input: [name, gln, initial_utc]
    output: Facility
    side_effects: ["current_utc := initial_utc"]
  - method: GET
    path: "/traceability/facilities/{id}"
    description: "Get a facility"
    roles: [QualityManager, ReceivingClerk, ProductionOperator, SafetyAuditor]
    code: 200
    input: []
    output: Facility
    side_effects: []
  - method: POST
    path: "/traceability/facilities/{id}/clock"
    description: "Advance the facility's deterministic clock; sweeps RELEASED FREE lots into EXPIRED"
    roles: [QualityManager]
    code: 200
    input: [to_utc]
    output: Facility
    side_effects:
      - "current_utc := to_utc (must be strictly > current value, ERR_CLOCK_NOT_MONOTONIC)"
      - "every RELEASED, FREE lot with effective_expiration_date <= to_utc -> EXPIRED (cascade)"

  # --- Supplier ---
  - method: POST
    path: "/traceability/suppliers"
    description: "Register a supplier under a facility"
    roles: [QualityManager]
    code: 201
    input: [facility_id, name, "coa_required?"]
    output: Supplier
    side_effects: ["approval_status := APPROVED; failed_coa_streak := 0"]
  - method: GET
    path: "/traceability/suppliers/{id}"
    description: "Get a supplier"
    roles: [QualityManager, ReceivingClerk, ProductionOperator, SafetyAuditor]
    code: 200
    input: []
    output: Supplier
    side_effects: []
  - method: GET
    path: "/traceability/facilities/{id}/suppliers"
    description: "List suppliers under a facility (sub-resource reverse-reachability for Supplier.facility_id)"
    roles: [QualityManager, ReceivingClerk, ProductionOperator, SafetyAuditor]
    code: 200
    input: ["limit?", "offset?"]
    output: "Supplier[]"
    side_effects: []

  # --- Ingredient ---
  - method: POST
    path: "/traceability/ingredients"
    description: "Define an ingredient/material with storage CCP limits and allergen profile"
    roles: [QualityManager]
    code: 201
    input: [facility_id, name, storage_target_c, "storage_tolerance_c?", shelf_life_days, "declared_allergen_codes?"]
    output: Ingredient
    side_effects: []
  - method: GET
    path: "/traceability/facilities/{id}/ingredients"
    description: "List ingredients under a facility (sub-resource reverse-reachability for Ingredient.facility_id)"
    roles: [QualityManager, ReceivingClerk, ProductionOperator, SafetyAuditor]
    code: 200
    input: ["limit?", "offset?"]
    output: "Ingredient[]"
    side_effects: []

  # --- AllergenProfile ---
  - method: POST
    path: "/traceability/allergen-profiles"
    description: "Register an allergen profile (code, severity rank) for a facility"
    roles: [QualityManager]
    code: 201
    input: [facility_id, code, name, severity_rank]
    output: AllergenProfile
    side_effects: []
  - method: GET
    path: "/traceability/facilities/{id}/allergen-profiles"
    description: "List allergen profiles under a facility (sub-resource reverse-reachability for AllergenProfile.facility_id)"
    roles: [QualityManager, ReceivingClerk, ProductionOperator, SafetyAuditor]
    code: 200
    input: ["limit?", "offset?"]
    output: "AllergenProfile[]"
    side_effects: []

  # --- Lot (receive / read / lifecycle / recall) ---
  - method: POST
    path: "/traceability/lots"
    description: "Receive a RAW_MATERIAL lot (FINISHED lots are minted only by production finalize)"
    roles: [ReceivingClerk, QualityManager]
    code: 201
    input: [facility_id, ingredient_id, lot_code, lot_kind, received_qty, production_date, "supplier_id?", "expiration_date?"]
    output: Lot
    side_effects:
      - "status := RECEIVED; available_qty := received_qty; hold_status := FREE"
      - "expiration_date := production_date + ingredient.shelf_life_days when omitted"
      - "effective_expiration_date := provisional variant of calc effective_expiration"
      - "coa_status := PENDING if supplier.coa_required and lot_kind RAW_MATERIAL else NOT_REQUIRED"
      - "effective_allergen_codes := ingredient.declared_allergen_codes; controlling_allergen_code computed"
  - method: GET
    path: "/traceability/lots/{id}"
    description: "Get a lot with computed available_qty, hold_status, coa_status, effective_allergen_codes, controlling_allergen_code"
    roles: [QualityManager, ReceivingClerk, ProductionOperator, SafetyAuditor]
    code: 200
    input: []
    output: Lot
    side_effects: []
  - method: GET
    path: "/traceability/lots"
    description: "List lots, filterable by facility_id, supplier_id, ingredient_id, status (filtered-list reverse-reachability)"
    roles: [QualityManager, ReceivingClerk, ProductionOperator, SafetyAuditor]
    code: 200
    input: ["facility_id?", "supplier_id?", "ingredient_id?", "status?", "limit?", "offset?"]
    output: "Lot[]"
    side_effects: []
  - method: POST
    path: "/traceability/lots/{lid}/release"
    description: "QC-release a RECEIVED lot for consumption"
    roles: [QualityManager]
    code: 200
    input: []
    output: Lot
    side_effects: ["Lot RECEIVED -> RELEASED (see §1.2)"]
  - method: POST
    path: "/traceability/lots/{lid}/reject"
    description: "QC-reject a RECEIVED lot"
    roles: [QualityManager]
    code: 200
    input: []
    output: Lot
    side_effects: ["Lot RECEIVED -> REJECTED"]
  - method: GET
    path: "/traceability/lots/{lid}/recall-trace"
    description: "One-up/one-down mock recall trace with provisional/finalized exposure quantity (calc recall_exposure_quantity)"
    roles: [QualityManager, SafetyAuditor]
    code: 200
    input: []
    output: "{ recalled_lot_id: string, one_up_source_lot_ids: string[], one_down_finished_lot_ids: string[], exposure_variant: string, exposure_qty: number }"
    side_effects: []

  # --- Certificate of Analysis ---
  - method: POST
    path: "/traceability/coa"
    description: "Attach a supplier COA to a lot (PENDING); supplier_id copied from the lot"
    roles: [ReceivingClerk, QualityManager]
    code: 201
    input: [lot_id, measured_allergen_codes, pathogen_pass, declared_shelf_life_days]
    output: CertificateOfAnalysis
    side_effects: ["status := PENDING; Lot.coa_status := PENDING; supplier_id := lot.supplier_id"]
  - method: GET
    path: "/traceability/coa/{id}"
    description: "Get a COA"
    roles: [QualityManager, ReceivingClerk, ProductionOperator, SafetyAuditor]
    code: 200
    input: []
    output: CertificateOfAnalysis
    side_effects: []
  - method: GET
    path: "/traceability/coa"
    description: "List COAs, filterable by lot_id and supplier_id (filtered-list reverse-reachability)"
    roles: [QualityManager, ReceivingClerk, ProductionOperator, SafetyAuditor]
    code: 200
    input: ["lot_id?", "supplier_id?", "limit?", "offset?"]
    output: "CertificateOfAnalysis[]"
    side_effects: []
  - method: POST
    path: "/traceability/coa/{cid}/decide"
    description: "Accept or reject a PENDING COA; reject increments supplier streak and may suspend supplier (cascade C)"
    roles: [QualityManager]
    code: 200
    input: [decision]
    output: CertificateOfAnalysis
    side_effects:
      - "ACCEPT -> COA ACCEPTED, Lot.coa_status ACCEPTED, supplier streak reset"
      - "REJECT -> COA REJECTED, Lot.coa_status REJECTED, supplier streak +1, possible SUSPENDED (cascade C)"

  # --- Production Run + Consumed Lots ---
  - method: POST
    path: "/traceability/production-runs"
    description: "Open a production run for a finished good"
    roles: [ProductionOperator]
    code: 201
    input: [facility_id, ingredient_id, planned_output_qty]
    output: ProductionRun
    side_effects: ["status := OPEN; started_at := facility current_utc"]
  - method: GET
    path: "/traceability/production-runs/{id}"
    description: "Get a production run"
    roles: [QualityManager, ProductionOperator, SafetyAuditor]
    code: 200
    input: []
    output: ProductionRun
    side_effects: []
  - method: GET
    path: "/traceability/production-runs"
    description: "List production runs, filterable by facility_id, ingredient_id, output_lot_id (filtered-list reverse-reachability)"
    roles: [QualityManager, ProductionOperator, SafetyAuditor]
    code: 200
    input: ["facility_id?", "ingredient_id?", "output_lot_id?", "limit?", "offset?"]
    output: "ProductionRun[]"
    side_effects: []
  - method: POST
    path: "/traceability/production-runs/{rid}/consumed-lots"
    description: "Add a bill-of-materials line drawing from a source lot; bumps run version"
    roles: [ProductionOperator]
    code: 201
    input: [source_lot_id, quantity]
    output: ConsumedLot
    side_effects: ["increments ProductionRun.version by 1"]
  - method: GET
    path: "/traceability/consumed-lots/{id}"
    description: "Get a consumed-lot line"
    roles: [QualityManager, ProductionOperator, SafetyAuditor]
    code: 200
    input: []
    output: ConsumedLot
    side_effects: []
  - method: GET
    path: "/traceability/consumed-lots"
    description: "List consumed-lot lines, filterable by production_run_id and source_lot_id (filtered-list reverse-reachability)"
    roles: [QualityManager, ProductionOperator, SafetyAuditor]
    code: 200
    input: ["production_run_id?", "source_lot_id?", "limit?", "offset?"]
    output: "ConsumedLot[]"
    side_effects: []
  - method: POST
    path: "/traceability/production-runs/{rid}/finalize"
    description: "Finalize an OPEN run: OCC check, FEFO + hold + expiry + quantity gates, draw inventory, mint FINISHED lot"
    roles: [ProductionOperator]
    code: 200
    input: [expected_production_run_version]
    output: ProductionRun
    side_effects:
      - "OCC on production_run version; draw available_qty (cascade A); mint FINISHED lot; allergen inheritance"
  - method: POST
    path: "/traceability/production-runs/{rid}/abort"
    description: "Abort an OPEN run with no inventory effect"
    roles: [ProductionOperator]
    code: 200
    input: []
    output: ProductionRun
    side_effects: ["status := ABORTED"]

  # --- CCP Readings ---
  - method: POST
    path: "/traceability/ccp-readings"
    description: "Record a temperature CCP reading; classify IN_SPEC/DEVIATION, accrue excursion, auto-hold on cumulative breach"
    roles: [ProductionOperator, QualityManager]
    code: 201
    input: [lot_id, ccp_type, measured_value_c, measured_at]
    output: CCPReading
    side_effects:
      - "classification + excursion_minutes computed (calc excursion_accrual)"
      - "lot.cumulative_excursion_minutes increased; if > 120 -> auto HoldOrder(TEMPERATURE_EXCURSION) (threshold trigger)"
  - method: GET
    path: "/traceability/lots/{id}/ccp-readings"
    description: "List a lot's CCP readings (sub-resource reverse-reachability for CCPReading.lot_id)"
    roles: [QualityManager, ProductionOperator, SafetyAuditor]
    code: 200
    input: ["limit?", "offset?"]
    output: "CCPReading[]"
    side_effects: []

  # --- Hold Orders ---
  - method: POST
    path: "/traceability/hold-orders"
    description: "Issue a hold on a target lot; freezes it and all downstream finished lots (cascade B)"
    roles: [QualityManager]
    code: 201
    input: [facility_id, target_lot_id, reason]
    output: HoldOrder
    side_effects:
      - "status := ACTIVE; covered_set computed; each covered non-terminal lot hold_status := HELD; held_lot_count snapshot"
  - method: GET
    path: "/traceability/hold-orders/{id}"
    description: "Get a hold order"
    roles: [QualityManager, SafetyAuditor]
    code: 200
    input: []
    output: HoldOrder
    side_effects: []
  - method: GET
    path: "/traceability/hold-orders"
    description: "List hold orders, filterable by facility_id, target_lot_id, status (filtered-list reverse-reachability)"
    roles: [QualityManager, SafetyAuditor]
    code: 200
    input: ["facility_id?", "target_lot_id?", "status?", "limit?", "offset?"]
    output: "HoldOrder[]"
    side_effects: []
  - method: POST
    path: "/traceability/hold-orders/{hid}/resolve"
    description: "Resolve an ACTIVE hold: RELEASE (un-freeze if no other hold) or DISPOSE (destroy covered lots, cascade B)"
    roles: [QualityManager]
    code: 200
    input: [disposition, expected_hold_order_version]
    output: HoldOrder
    side_effects:
      - "OCC on hold version; RELEASE recomputes hold_status; DISPOSE destroys covered non-terminal lots (cascade B)"

  # --- Storage Zones + Bookings (cold-chain interval occupancy) ---
  - method: POST
    path: "/traceability/zones"
    description: "Create a cold-storage zone with finite aggregate capacity"
    roles: [QualityManager]
    code: 201
    input: [facility_id, zone_code, capacity_units, target_temp_c]
    output: StorageZone
    side_effects: []
  - method: GET
    path: "/traceability/zones/{id}"
    description: "Get a storage zone"
    roles: [QualityManager, ReceivingClerk, ProductionOperator, SafetyAuditor]
    code: 200
    input: []
    output: StorageZone
    side_effects: []
  - method: GET
    path: "/traceability/facilities/{id}/zones"
    description: "List zones under a facility (sub-resource reverse-reachability for StorageZone.facility_id)"
    roles: [QualityManager, ReceivingClerk, ProductionOperator, SafetyAuditor]
    code: 200
    input: ["limit?", "offset?"]
    output: "StorageZone[]"
    side_effects: []
  - method: POST
    path: "/traceability/zones/{zid}/bookings"
    description: "Book a lot into a zone for a half-open interval; rejected on capacity overlap (calc storage_overlap_capacity)"
    roles: [QualityManager, ReceivingClerk]
    code: 201
    input: [lot_id, start_utc, end_utc, capacity_units]
    output: StorageBooking
    side_effects: ["overlap/capacity check against existing bookings on the zone"]
  - method: GET
    path: "/traceability/bookings/{id}"
    description: "Get a storage booking"
    roles: [QualityManager, ReceivingClerk, ProductionOperator, SafetyAuditor]
    code: 200
    input: []
    output: StorageBooking
    side_effects: []
  - method: GET
    path: "/traceability/bookings"
    description: "List storage bookings, filterable by zone_id and lot_id (filtered-list reverse-reachability)"
    roles: [QualityManager, ReceivingClerk, ProductionOperator, SafetyAuditor]
    code: 200
    input: ["zone_id?", "lot_id?", "limit?", "offset?"]
    output: "StorageBooking[]"
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_AUTH, http: 401, condition: "X-User-ID or X-User-Role header missing/malformed" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role not permitted for this operation" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required body field, bad type, or invalid enum value (e.g. received_qty<=0, severity_rank out of 1..5)" }
  - { id: ERR_FACILITY_NOT_FOUND, http: 404, condition: "Facility id in path/body does not exist" }
  - { id: ERR_SUPPLIER_NOT_FOUND, http: 404, condition: "Supplier id does not exist" }
  - { id: ERR_INGREDIENT_NOT_FOUND, http: 404, condition: "Ingredient id does not exist" }
  - { id: ERR_LOT_NOT_FOUND, http: 404, condition: "Lot id does not exist" }
  - { id: ERR_COA_NOT_FOUND, http: 404, condition: "Certificate of Analysis id does not exist" }
  - { id: ERR_RUN_NOT_FOUND, http: 404, condition: "ProductionRun id does not exist" }
  - { id: ERR_HOLD_NOT_FOUND, http: 404, condition: "HoldOrder id does not exist" }
  - { id: ERR_CROSS_FACILITY_REFERENCE, http: 409, condition: "A body FK references an entity in a different facility" }
  - { id: ERR_DUPLICATE_LOT_CODE, http: 409, condition: "lot_code already used for this (facility, ingredient)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match current parent version (OCC)" }
  - { id: ERR_COA_NOT_PENDING, http: 409, condition: "COA decide attempted while COA not in PENDING" }
  - { id: ERR_COA_ALLERGEN_UNDISCLOSED, http: 409, condition: "COA accept blocked: measured_allergen_codes not a subset of ingredient declared codes" }
  - { id: ERR_COA_PATHOGEN_FAIL, http: 409, condition: "COA accept blocked: pathogen_pass is false" }
  - { id: ERR_COA_SHELF_LIFE_SHORT, http: 409, condition: "COA accept blocked: declared_shelf_life_days < ingredient.shelf_life_days" }
  - { id: ERR_COA_NOT_ACCEPTED, http: 409, condition: "Release blocked: coa_required RAW_MATERIAL lot whose coa_status is not ACCEPTED" }
  - { id: ERR_LOT_NOT_RECEIVED, http: 409, condition: "Release/reject attempted on a lot not in RECEIVED" }
  - { id: ERR_LOT_ON_HOLD, http: 409, condition: "Release or finalize blocked because lot/source lot hold_status is HELD" }
  - { id: ERR_LOT_EXPIRED, http: 409, condition: "Release blocked because lot is past expiration at facility current_utc" }
  - { id: ERR_SUPPLIER_NOT_APPROVED, http: 403, condition: "Receiving a RAW_MATERIAL lot from a supplier not in APPROVED status" }
  - { id: ERR_RUN_NOT_OPEN, http: 409, condition: "Finalize/abort/add-line attempted on a run not in OPEN" }
  - { id: ERR_NO_CONSUMED_LOTS, http: 409, condition: "Finalize attempted on a run with zero ConsumedLot lines" }
  - { id: ERR_SOURCE_LOT_NOT_RELEASED, http: 409, condition: "Finalize references a source lot not in RELEASED status" }
  - { id: ERR_SOURCE_LOT_EXPIRED, http: 409, condition: "Finalize references a source lot past expiration at facility current_utc" }
  - { id: ERR_INSUFFICIENT_LOT_QTY, http: 409, condition: "ConsumedLot.quantity exceeds source lot available_qty at finalize" }
  - { id: ERR_FEFO_VIOLATION, http: 409, condition: "Finalize consumes a lot while an earlier-expiring RELEASED FREE same-ingredient lot exists" }
  - { id: ERR_READING_OUT_OF_ORDER, http: 409, condition: "CCP reading measured_at is in the future or before the lot's latest prior reading" }
  - { id: ERR_HOLD_NOT_ACTIVE, http: 409, condition: "Resolve attempted on a hold not in ACTIVE" }
  - { id: ERR_CLOCK_NOT_MONOTONIC, http: 409, condition: "Clock advance to_utc is not strictly greater than current_utc" }
  - { id: ERR_ZONE_NOT_FOUND, http: 404, condition: "StorageZone id does not exist" }
  - { id: ERR_BOOKING_NOT_FOUND, http: 404, condition: "StorageBooking id does not exist" }
  - { id: ERR_INVALID_INTERVAL, http: 409, condition: "StorageBooking end_utc is not strictly greater than start_utc" }
  - { id: ERR_ZONE_CAPACITY_EXCEEDED, http: 409, condition: "StorageBooking peak overlapping capacity_units would exceed StorageZone.capacity_units" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: QualityManager
    description: "Owns COA decisions, lot release/reject, hold issue/resolve, facility/supplier/ingredient/allergen setup, and clock advance"
    identity: opaque
    exclusive_operations:
      - "POST /traceability/facilities"
      - "POST /traceability/facilities/{id}/clock"
      - "POST /traceability/suppliers"
      - "POST /traceability/ingredients"
      - "POST /traceability/allergen-profiles"
      - "POST /traceability/lots/{lid}/release"
      - "POST /traceability/lots/{lid}/reject"
      - "POST /traceability/coa/{cid}/decide"
      - "POST /traceability/hold-orders"
      - "POST /traceability/hold-orders/{hid}/resolve"
      - "POST /traceability/zones"
    shared_operations:
      - "POST /traceability/lots"
      - "POST /traceability/coa"
      - "POST /traceability/ccp-readings"
      - "POST /traceability/zones/{zid}/bookings"
      - "GET (all read endpoints incl. recall-trace)"
  - name: ReceivingClerk
    description: "Receives raw-material lots, attaches supplier COAs, books lots into storage zones"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "POST /traceability/lots"
      - "POST /traceability/coa"
      - "POST /traceability/zones/{zid}/bookings"
      - "GET (read endpoints excl. recall-trace and hold-orders)"
  - name: ProductionOperator
    description: "Opens/finalizes/aborts production runs, adds consumed-lot lines, records CCP readings"
    identity: opaque
    exclusive_operations:
      - "POST /traceability/production-runs"
      - "POST /traceability/production-runs/{rid}/consumed-lots"
      - "POST /traceability/production-runs/{rid}/finalize"
      - "POST /traceability/production-runs/{rid}/abort"
    shared_operations:
      - "POST /traceability/ccp-readings"
      - "GET (run, lot, ccp-reading, consumed-lot read endpoints)"
  - name: SafetyAuditor
    description: "Read-only oversight: recall traces, hold orders, genealogy"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "GET (all read endpoints incl. recall-trace and hold-orders)"
