            - "Unit A-101 and unit A-102 are both TWO_STAGE with filter_slot_count 2 and nominal_size_code 16x25x1."
            - "Resident Ada (household_size 3, no flags) drives subscription A onto the MERV 8 SKU with ship_cadence_days 75."
            - "Resident Ben has allergy_flag true, which drives subscription B onto the MERV 11 SKU with ship_cadence_days 60."
            - "Both subscriptions are ACTIVE (activated 2026-08-05) and both shipment #1 rows are still SCHEDULED for 2026-08-05."
            - "The MERV 8 SKU has since been DISCONTINUED; the MERV 11 SKU is untouched."
