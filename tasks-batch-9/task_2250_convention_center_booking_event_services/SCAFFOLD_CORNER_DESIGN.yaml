          assert:
            - "the trigger returns 201"
            - "EventBooking.${bk_id}.event_class == CITYWIDE_CONVENTION"
            - "EventBooking.${bk_id}.projected_room_nights == 2500"
            - "EventBooking.${bk_id}.contracted_rental_cents == 25200000"

      - name: in_house_catering_naming_an_outside_vendor_rejected
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=64]
          - errors[ERR_CATERING_EXCLUSIVITY_VIOLATION]
          - entities.Vendor.fields.is_in_house_caterer
        distinguishing_aspect: |
          The arrangement row is internally consistent and every field is a legal enum
          value, so no request-shape check can catch it. The violation is only visible by
          joining to the Vendor row: arrangement_type IN_HOUSE requires the referenced
          vendor to carry is_in_house_caterer true, and Cousin's Kitchen does not.
        test_recipe:
          setup:
            - "Centerplate Convention Dining is the in-house CATERING vendor"
            - "Cousin's Kitchen Catering is a PREFERRED CATERING vendor with is_in_house_caterer false"
            - "the Meeting Room 301 booking is TENTATIVE with order_posture OPEN"
          setup_api_calls:
            - call: "POST /convention-center/policy-windows"
              payload: { event_class: "CONSUMER_SHOW", priority_rank: 3, open_months_before: 18, close_months_before: 2, max_holds_per_booking: 2, challenge_response_hours: 48, rental_discount_pct: 0.0, max_challenge_rounds: 1 }
              as: VenueAdmin
            - call: "POST /convention-center/spaces"
              payload: { name: "Meeting Room 301", space_class: "MEETING_ROOM", rentable_sqft: 2600, daily_base_rate_cents: 90900 }
              as: VenueAdmin
              captures: { sp_mr_id: $.data.id }
            - call: "POST /convention-center/vendors"
              payload: { legal_name: "Centerplate Convention Dining", service_category: "CATERING", vendor_tier: "EXCLUSIVE", coi_expiry_date: "2030-01-01", is_in_house_caterer: true }
              as: VenueAdmin
              captures: { ven_inhouse_id: $.data.id }
            - call: "POST /convention-center/vendors"
              payload: { legal_name: "Cousin's Kitchen Catering", service_category: "CATERING", vendor_tier: "PREFERRED", coi_expiry_date: "2030-01-01", is_in_house_caterer: false }
              as: VenueAdmin
              captures: { ven_out_id: $.data.id }
            - call: "POST /convention-center/clients"
              payload: { legal_name: "Sunbelt Show Promotions", contact_email: "ssp@example.org", organization_type: "PROMOTER" }
              as: VenueAdmin
              captures: { cl_ssp_id: $.data.id }
            - call: "POST /convention-center/bookings"
              payload: { client_id: "${cl_ssp_id}", space_id: "${sp_mr_id}", event_name: "Regional Gem Show", event_class: "CONSUMER_SHOW", move_in_start_date: "2027-03-01", show_start_date: "2027-03-02", show_end_date: "2027-03-04", move_out_end_date: "2027-03-05" }
              as: SalesManager
              captures: { bk_id: $.data.id }
          trigger:
            - call: "POST /convention-center/bookings/${bk_id}/catering-arrangements"
              payload: { vendor_id: "${ven_out_id}", arrangement_type: "IN_HOUSE", estimated_fnb_cents: 900000 }
              as: EventServicesManager
          assert:
            - "the trigger returns 422 with data.error_id == ERR_CATERING_EXCLUSIVITY_VIOLATION"
            - "GET /convention-center/catering-arrangements filtered on the booking returns total_count == 0"
            - "the same payload with vendor_id ${ven_inhouse_id} would have been accepted"

      - name: confirm_first_option_after_the_release_deadline_rejected
        claim_type: temporal_validation
        grounds:
          - validations[priority=76]
          - errors[ERR_RELEASE_DEADLINE_PASSED]
          - entities.SpaceHold.fields.release_deadline_utc
        distinguishing_aspect: |
          Nothing about the hold changes between the accepted and refused calls: it is
          still ACTIVE at hold_rank 1 on a TENTATIVE booking. Only the logical clock
          moves, from the default 2026-08-01 to 2026-12-03, one day past the
          release_deadline_utc of 2026-12-02 that creation stamped at show_start minus
          three whole months.
        test_recipe:
          setup:
            - "the Meeting Room 301 CONSUMER_SHOW booking has show_start_date 2027-03-02"
            - "its single ACTIVE hold carries release_deadline_utc 2026-12-02T00:00:00Z"
            - "the clock is then advanced to 2026-12-03T00:00:00Z"
          setup_api_calls:
            - call: "POST /convention-center/policy-windows"
              payload: { event_class: "CONSUMER_SHOW", priority_rank: 3, open_months_before: 18, close_months_before: 2, max_holds_per_booking: 2, challenge_response_hours: 48, rental_discount_pct: 0.0, max_challenge_rounds: 1 }
              as: VenueAdmin
            - call: "POST /convention-center/spaces"
              payload: { name: "Meeting Room 301", space_class: "MEETING_ROOM", rentable_sqft: 2600, daily_base_rate_cents: 90900 }
              as: VenueAdmin
              captures: { sp_mr_id: $.data.id }
            - call: "POST /convention-center/clients"
              payload: { legal_name: "Sunbelt Show Promotions", contact_email: "ssp@example.org", organization_type: "PROMOTER" }
              as: VenueAdmin
              captures: { cl_ssp_id: $.data.id }
            - call: "POST /convention-center/bookings"
              payload: { client_id: "${cl_ssp_id}", space_id: "${sp_mr_id}", event_name: "Regional Gem Show", event_class: "CONSUMER_SHOW", move_in_start_date: "2027-03-01", show_start_date: "2027-03-02", show_end_date: "2027-03-04", move_out_end_date: "2027-03-05" }
              as: SalesManager
              captures: { bk_id: $.data.id, bk_v1: $.data.version }
            - call: "POST /convention-center/bookings/${bk_id}/holds"
              payload: { expected_booking_version: "${bk_v1}" }
              as: SalesManager
              captures: { hold_id: $.data.id }
            - call: "POST /convention-center/_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-03T00:00:00Z" }
              as: VenueAdmin
          trigger:
            - call: "POST /convention-center/holds/${hold_id}/confirm-first-option"
              payload: {}
              as: SalesManager
          assert:
            - "the trigger returns 409 with data.error_id == ERR_RELEASE_DEADLINE_PASSED"
            - "SpaceHold.${hold_id}.release_deadline_utc == 2026-12-02T00:00:00Z"
            - "SpaceHold.${hold_id}.status == ACTIVE"
            - "SpaceHold.${hold_id}.hold_rank == 1"
            - "EventBooking.${bk_id}.status == TENTATIVE"

      - name: third_hold_on_a_two_hold_consumer_show_rejected
        claim_type: aggregate_validation
        grounds:
          - validations[priority=84]
          - errors[ERR_HOLD_LIMIT_REACHED]
          - entities.EventBooking.fields.hold_count
          - entities.BookingPolicyWindow.fields.max_holds_per_booking
        distinguishing_aspect: |
          The rejected request is byte-identical in shape to the two that succeeded and
          the booking is still TENTATIVE, so the refusal comes only from the aggregate:
          hold_count has reached the CONSUMER_SHOW window's max_holds_per_booking of 2.
          The tentative hold hierarchy is capped per booking, not per space.
        test_recipe:
          setup:
            - "the CONSUMER_SHOW window allows 2 holds per booking"
            - "the Meeting Room 301 booking already carries two ACTIVE holds of hold_rank 1 and 2"
          setup_api_calls:
            - call: "POST /convention-center/policy-windows"
              payload: { event_class: "CONSUMER_SHOW", priority_rank: 3, open_months_before: 18, close_months_before: 2, max_holds_per_booking: 2, challenge_response_hours: 48, rental_discount_pct: 0.0, max_challenge_rounds: 1 }
              as: VenueAdmin
            - call: "POST /convention-center/spaces"
              payload: { name: "Meeting Room 301", space_class: "MEETING_ROOM", rentable_sqft: 2600, daily_base_rate_cents: 90900 }
              as: VenueAdmin
              captures: { sp_mr_id: $.data.id }
