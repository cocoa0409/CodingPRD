  - name: admin_fee_tier_one_ceiling_is_inclusive_at_five_thousand_cents
    claim_type: constants_applied
    grounds:
    - calculations.support_request_settlement.constants
    - entities.SupportRequest.fields.admin_fee_cents
    distinguishing_aspect: 'ADMIN_FEE_T1_MAX_CENTS is an inclusive ceiling: requested_cents 5000 stays in T1 and pays
      0, while 5001 falls into T2 and pays ROUND_HALF_UP(5001 * 0.03) = 150 (150.03 truncates to 150, not 151). An
      exclusive comparison charges 150 on the 5000 request.'
    test_recipe:
      setup:
      - logical clock at 2026-08-01T08:00:00.000Z
      - FunderGrant g1 authorized 100000, per_participant_cap_cents 60000, all categories allowed
      - Participant p1 PRE_RELEASE, not suspended
      - TRANSIT_PASS has COVERAGE_RATE 1.0 so requested_cents equals the line total exactly
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-08-01T08:00:00.000Z'
        as: CaseManager
        as_user_id: cm-1
      - call: POST /grants
        payload:
          funder_name: Reentry Workforce Fund
          program_year: 2026
          authorized_cents: 100000
          allowed_categories:
          - TOOLS
          - UNIFORM
          - TRANSIT_PASS
          - ID_FEE
          - LICENSE_FEE
          - WAGE_SUBSIDY
          per_participant_cap_cents: 60000
          retention_benchmark_pct: 75.0
        as: FunderAnalyst
        as_user_id: analyst-1
        captures:
          g1_id: $.data.id
      - call: POST /participants
        payload:
          full_name: Marcus Reed
          facility_name: Northgate Correctional
          facility_state: OH
          expected_release_date: '2026-08-10'
          record_categories:
          - DRUG_OFFENSE
          required_document_types:
          - STATE_ID
          - SSN_CARD
          - BIRTH_CERTIFICATE
          - WORK_HISTORY
          - MEDICAID_APPLICATION
          assigned_case_manager_user_id: cm-1
        as: CaseManager
        as_user_id: cm-1
        captures:
          p1_id: $.data.id
      - call: POST /participants/${p1_id}/assessment
        payload:
          assessment_domain_scores:
            housing_score: 0
