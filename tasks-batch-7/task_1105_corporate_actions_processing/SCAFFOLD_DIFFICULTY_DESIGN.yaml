  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: event_amendment_reconfirmation_cycle
        grounds:
          - state_machines.CorporateActionEvent.CONFIRMED_to_AMENDED
          - state_machines.CorporateActionEvent.AMENDED_to_CONFIRMED
          - concurrency_rules[event-amendment-stale-version]
        distinguishing_aspect: |
          CorporateActionEvent is cyclic: CONFIRMED -> AMENDED -> CONFIRMED, and
          the amendment supersedes the 2:1-projected entitlement (200 shares)
          and re-projects a 3:1 entitlement (300 shares) on the SAME account.
        test_recipe:
          setup:
            - "ACME security; account A1 with 100 sh (acq 2026-04-01); SPLIT 2:1 event CONFIRMED (projection: 200 shares)"
          setup_api_calls:
            - { call: "POST /api/securities", payload: { ticker: "ACME", cusip: "CUSP000501", name: "Acme Corp" }, as: DeskAdministrator, captures: { sec_id: $.data.id } }
            - { call: "POST /api/accounts", payload: { account_number: "A-1", holder_name: "One" }, as: DeskAdministrator, captures: { a1: $.data.id } }
            - { call: "POST /api/position-lots", payload: { account_id: "${a1}", security_id: "${sec_id}", quantity: 100, acquisition_date: "2026-04-01", cost_basis_total_cents: 500000 }, as: DeskAdministrator }
            - { call: "POST /api/event-sources", payload: { name: "Vendor Alpha", source_type: "VENDOR", reliability_weight: 10 }, as: DeskAdministrator, captures: { s1: $.data.id } }
            - { call: "POST /api/event-sources", payload: { name: "Vendor Beta", source_type: "VENDOR", reliability_weight: 5 }, as: DeskAdministrator, captures: { s2: $.data.id } }
            - { call: "POST /api/source-notifications", payload: { source_id: "${s1}", security_id: "${sec_id}", event_type: "SPLIT", record_date: "2026-05-15", announced_terms: { ratio_num: 2, ratio_den: 1, price_per_share_cents: 3333, fractional_policy: "ROUND_HALF_UP" } }, as: VendorFeed, captures: { n1: $.data.id } }
            - { call: "POST /api/source-notifications", payload: { source_id: "${s2}", security_id: "${sec_id}", event_type: "SPLIT", record_date: "2026-05-15", announced_terms: { ratio_num: 2, ratio_den: 1, price_per_share_cents: 3333, fractional_policy: "ROUND_HALF_UP" } }, as: VendorFeed, captures: { n2: $.data.id } }
            - call: "POST /api/events"
              payload: { security_id: "${sec_id}", event_type: "SPLIT", terms: { ratio_num: 2, ratio_den: 1, price_per_share_cents: 3333, fractional_policy: "ROUND_HALF_UP" }, record_date: "2026-05-15", payable_date: "2026-05-29", source_notification_ids: ["${n1}", "${n2}"] }
              as: EventAnalyst
              as_user_id: "analyst-1"
              captures: { ev_id: $.data.id }
            - { call: "POST /api/events/${ev_id}/confirm", payload: {}, as: EventAnalyst, as_user_id: "analyst-2", captures: { ev_v: $.data.version } }
            - { call: "GET /api/entitlements?event_id=${ev_id}&account_id=${a1}", payload: {}, as: OperationsManager, captures: { e1_id: "$.data[0].id", e1_sh: "$.data[0].entitled_shares"} }
          trigger:
            - { call: "POST /api/events/${ev_id}/amendments", payload: { amended_terms: { ratio_num: 3, ratio_den: 1, price_per_share_cents: 3333, fractional_policy: "ROUND_HALF_UP" }, reason: "issuer revised ratio", expected_event_version: "${ev_v}" }, as: EventAnalyst, as_user_id: "analyst-1", captures: { amd_seq: $.data.amendment_seq } }
            - { call: "GET /api/entitlements/${e1_id}", payload: {}, as: OperationsManager, captures: { e1_status: $.data.status } }
            - { call: "GET /api/entitlements?supersedes_entitlement_id=${e1_id}", payload: {}, as: OperationsManager, captures: { e2_id: "$.data[0].id", e2_sh: "$.data[0].entitled_shares", e2_status: "$.data[0].status"} }
            - { call: "POST /api/events/${ev_id}/confirm", payload: {}, as: EventAnalyst, as_user_id: "analyst-2", captures: { ev_status: $.data.status } }
          assert:
            - "Cycle traversed: DRAFT -> CONFIRMED -> AMENDED -> CONFIRMED; final status == CONFIRMED"
            - "EventAmendment.amendment_seq == 1"
            - "Entitlement.${e1_id}.status == SUPERSEDED (was PROJECTED with entitled_shares 200, captured ${e1_sh})"
            - "Replacement Entitlement.${e2_id}: supersedes_entitlement_id == ${e1_id}, entitled_shares == 300 (100 x 3), status == PROJECTED"

      - name: election_withdraw_resubmit_cycle
        grounds:
          - state_machines.Election.SUBMITTED_to_WITHDRAWN
          - state_machines.Election.WITHDRAWN_to_SUBMITTED
        distinguishing_aspect: |
          Election is cyclic on one row: SUBMITTED -> WITHDRAWN -> SUBMITTED via
          resubmit, with election_seq 1 -> 2 and the parent event's version
          advancing on every mutation (2 -> 5); a different entity than the
          CorporateActionEvent cycle.
        test_recipe:
          setup:
            - "ACME + NEWCO securities; account A1 with 120 sh ACME; voluntary MERGER event CONFIRMED, deadline 2026-05-20T16:00:00Z; clock at 2026-05-15"
          setup_api_calls:
            - { call: "POST /api/securities", payload: { ticker: "ACME", cusip: "CUSP000601", name: "Acme Corp" }, as: DeskAdministrator, captures: { sec_id: $.data.id } }
            - { call: "POST /api/securities", payload: { ticker: "NWC", cusip: "CUSP000602", name: "Newco Inc" }, as: DeskAdministrator, captures: { newco_id: $.data.id } }
            - { call: "POST /api/accounts", payload: { account_number: "A-1", holder_name: "One" }, as: DeskAdministrator, captures: { a1: $.data.id } }
            - { call: "POST /api/position-lots", payload: { account_id: "${a1}", security_id: "${sec_id}", quantity: 120, acquisition_date: "2026-04-01", cost_basis_total_cents: 600000 }, as: DeskAdministrator }
            - { call: "POST /api/event-sources", payload: { name: "Vendor Alpha", source_type: "VENDOR", reliability_weight: 10 }, as: DeskAdministrator, captures: { s1: $.data.id } }
            - { call: "POST /api/event-sources", payload: { name: "Vendor Beta", source_type: "VENDOR", reliability_weight: 5 }, as: DeskAdministrator, captures: { s2: $.data.id } }
            - { call: "POST /api/source-notifications", payload: { source_id: "${s1}", security_id: "${sec_id}", event_type: "MERGER", record_date: "2026-05-15", announced_terms: { cash_per_share_cents: 5000, cash_pool_cents: 900000, new_security_id: "${newco_id}", ratio_num: 1, ratio_den: 1, default_option: "STOCK" } }, as: VendorFeed, captures: { n1: $.data.id } }
            - { call: "POST /api/source-notifications", payload: { source_id: "${s2}", security_id: "${sec_id}", event_type: "MERGER", record_date: "2026-05-15", announced_terms: { cash_per_share_cents: 5000, cash_pool_cents: 900000, new_security_id: "${newco_id}", ratio_num: 1, ratio_den: 1, default_option: "STOCK" } }, as: VendorFeed, captures: { n2: $.data.id } }
            - call: "POST /api/events"
              payload: { security_id: "${sec_id}", event_type: "MERGER", election_required: true, election_deadline: "2026-05-20T16:00:00Z", terms: { cash_per_share_cents: 5000, cash_pool_cents: 900000, new_security_id: "${newco_id}", ratio_num: 1, ratio_den: 1, default_option: "STOCK" }, record_date: "2026-05-15", payable_date: "2026-05-29", source_notification_ids: ["${n1}", "${n2}"] }
              as: EventAnalyst
              as_user_id: "analyst-1"
              captures: { ev_id: $.data.id }
            - { call: "POST /api/events/${ev_id}/confirm", payload: {}, as: EventAnalyst, as_user_id: "analyst-2", captures: { ev_v: $.data.version } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-05-15T00:00:00Z" }, as: DeskAdministrator }
          trigger:
            - { call: "POST /api/events/${ev_id}/elections", payload: { account_id: "${a1}", option_code: "CASH", expected_event_version: "${ev_v}" }, as: AccountHolder, as_user_id: "${a1}", captures: { el_id: $.data.id, el_seq: $.data.election_seq } }
            - { call: "POST /api/elections/${el_id}/withdraw", payload: {}, as: AccountHolder, as_user_id: "${a1}", captures: { el_wd: $.data.status } }
            - { call: "POST /api/elections/${el_id}/resubmit", payload: {}, as: AccountHolder, as_user_id: "${a1}", captures: { el_re: $.data.status, el_seq2: $.data.election_seq } }
            - { call: "GET /api/events/${ev_id}", payload: {}, as: OperationsManager, captures: { ev_v_final: $.data.version } }
          assert:
            - "Election.${el_id}: SUBMITTED (seq ${el_seq} == 1) -> WITHDRAWN -> SUBMITTED again with election_seq == 2"
            - "CorporateActionEvent.${ev_id}.version == 5 after create(1) -> confirm(2) -> submit(3) -> withdraw(4) -> resubmit(5)"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: booking_cascade_settles_lots_accounts_breaks
        grounds:
          - state_machines.CorporateActionEvent.CONFIRMED_to_BOOKED
          - calculations.account_derived_balances
          - state_machines.ReconBreak.OPEN_to_RESOLVED
        distinguishing_aspect: |
          Depth-4 chain from POST book: event -> BOOKED (1) settles the
          entitlement (2), which mutates the position lot 1000 -> 2000 (3),
          which recomputes the account derived fields (4), which auto-resolves
          the OPEN POSITION_MISMATCH break because internal now equals the
          reported 2000 (5). Each link is caused by the previous one.
        test_recipe:
          setup:
            - "ACME security; account A1 with 1000 sh lot (acq 2026-04-01, basis 10000000)"
            - "SPLIT 2:1 event CONFIRMED; a custodian statement (coverage 2026-05-01..2026-05-14) reported quantity 2000 while books held 1000 -> OPEN POSITION_MISMATCH break"
          setup_api_calls:
            - { call: "POST /api/securities", payload: { ticker: "ACME", cusip: "CUSP000701", name: "Acme Corp" }, as: DeskAdministrator, captures: { sec_id: $.data.id } }
            - { call: "POST /api/accounts", payload: { account_number: "A-1", holder_name: "One" }, as: DeskAdministrator, captures: { a1: $.data.id } }
            - { call: "POST /api/position-lots", payload: { account_id: "${a1}", security_id: "${sec_id}", quantity: 1000, acquisition_date: "2026-04-01", cost_basis_total_cents: 10000000 }, as: DeskAdministrator, captures: { l1: $.data.id } }
            - { call: "POST /api/event-sources", payload: { name: "Vendor Alpha", source_type: "VENDOR", reliability_weight: 10 }, as: DeskAdministrator, captures: { s1: $.data.id } }
            - { call: "POST /api/event-sources", payload: { name: "Vendor Beta", source_type: "VENDOR", reliability_weight: 5 }, as: DeskAdministrator, captures: { s2: $.data.id } }
            - { call: "POST /api/event-sources", payload: { name: "Custodian Prime", source_type: "CUSTODIAN", reliability_weight: 20 }, as: DeskAdministrator, captures: { cust_id: $.data.id } }
            - { call: "POST /api/source-notifications", payload: { source_id: "${s1}", security_id: "${sec_id}", event_type: "SPLIT", record_date: "2026-05-15", announced_terms: { ratio_num: 2, ratio_den: 1, price_per_share_cents: 3333, fractional_policy: "ROUND_HALF_UP" } }, as: VendorFeed, captures: { n1: $.data.id } }
            - { call: "POST /api/source-notifications", payload: { source_id: "${s2}", security_id: "${sec_id}", event_type: "SPLIT", record_date: "2026-05-15", announced_terms: { ratio_num: 2, ratio_den: 1, price_per_share_cents: 3333, fractional_policy: "ROUND_HALF_UP" } }, as: VendorFeed, captures: { n2: $.data.id } }
            - call: "POST /api/events"
              payload: { security_id: "${sec_id}", event_type: "SPLIT", terms: { ratio_num: 2, ratio_den: 1, price_per_share_cents: 3333, fractional_policy: "ROUND_HALF_UP" }, record_date: "2026-05-15", payable_date: "2026-05-29", source_notification_ids: ["${n1}", "${n2}"] }
              as: EventAnalyst
              as_user_id: "analyst-1"
              captures: { ev_id: $.data.id }
            - { call: "POST /api/events/${ev_id}/confirm", payload: {}, as: EventAnalyst, as_user_id: "analyst-2" }
            - { call: "POST /api/custodian-statements", payload: { source_id: "${cust_id}", coverage_start_date: "2026-05-01", coverage_end_date: "2026-05-14", lines: [{ account_id: "${a1}", security_id: "${sec_id}", quantity: 2000 }] }, as: CustodianFeed, captures: { stmt_id: $.data.id } }
            - { call: "GET /api/recon-breaks?statement_id=${stmt_id}", payload: {}, as: OperationsManager, captures: { brk_id: "$.data[0].id", brk_type: "$.data[0].break_type", brk_exp: "$.data[0].expected_quantity", brk_rep: "$.data[0].reported_quantity"} }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-05-15T00:00:00Z" }, as: DeskAdministrator }
            - { call: "POST /api/events/${ev_id}/capture-record-position", payload: {}, as: OperationsManager }
          trigger:
            - { call: "POST /api/events/${ev_id}/book", payload: {}, as: OperationsManager, captures: { bk_id: $.data.id, bk_sh: $.data.total_whole_shares_credited } }
            - { call: "GET /api/position-lots/${l1}", payload: {}, as: OperationsManager, captures: { l1_qty: $.data.quantity } }
            - { call: "GET /api/accounts/${a1}", payload: {}, as: OperationsManager, captures: { a1_basis: $.data.total_cost_basis_cents, a1_pend: $.data.pending_entitlement_count } }
            - { call: "GET /api/recon-breaks/${brk_id}", payload: {}, as: OperationsManager, captures: { brk_status: $.data.status, brk_res: $.data.resolution } }
