            - call: "POST /api/captives/${captive_id}/programs"
              payload: { program_name: "GL Prog Q", line_of_business: "GENERAL_LIABILITY", policy_period_start: "2026-06-01T00:00:00Z", policy_period_end: "2027-05-31T23:59:59Z", aggregate_limit_cents: 1000000, per_occurrence_limit_cents: 250000, attachment_point_cents: 10000, premium_budget_cents: 200000, expected_captive_version: "${captive_ver}" }
              as: Underwriter
              captures: { program_id: $.data.id }
            - call: "POST /api/captives/${captive_id}/programs/${program_id}/quote"
              payload: {}
              as: Underwriter
            - call: "POST /api/captives/${captive_id}/programs/${program_id}/bind"
              payload: {}
              as: Underwriter
            - call: "POST /api/captives/${captive_id}/activate"
              payload: {}
              as: CaptiveManager
            - call: "POST /api/captives/${captive_id}/programs/${program_id}/activate"
              payload: {}
              as: Underwriter
            - call: "POST /api/captives/${captive_id}/programs/${program_id}/allocations"
