      - name: set_field_with_empty_candidate_pool_succeeds
        grounds:
          - state_machines.Tournament.ENTRY_CLOSED_to_FIELD_SET
          - calculations.entry_priority_key
          - calculations.tournament_field_quality_factor
          - calculations.tournament_slot_census
          - validations.priority_72
        distinguishing_aspect: |
          The degenerate lower boundary of the selector: a candidate pool of size ZERO. set-field
          must still succeed and produce accepted_count 0, waitlist_count 0, open_slot_count equal
          to the full field_size_limit of 2, and field_quality_factor exactly 1.00 (the neutral
          value, because top_n = 0 and field_n = 0 are both below their weight floors) - NOT a
          division-by-zero, not a null, and not an error. Only the separate start endpoint refuses
          an empty field, via priority 72.
