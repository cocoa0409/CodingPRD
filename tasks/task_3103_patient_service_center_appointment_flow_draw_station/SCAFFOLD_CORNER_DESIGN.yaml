              as: Phlebotomist
              captures: { s3: $.data.id }
            - call: "POST /psc/specimens/${s1}/assign-courier"
              payload: { courier_run_id: "${r1}" }
              as: LabLiaison
            - call: "POST /psc/specimens/${s2}/assign-courier"
              payload: { courier_run_id: "${r1}" }
              as: LabLiaison
            - call: "POST /psc/specimens/${s3}/assign-courier"
              payload: { courier_run_id: "${r1}" }
              as: LabLiaison
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-02T07:20:00Z" }
              as: CenterSupervisor
          trigger:
            - call: "POST /psc/specimens/${s1}/compromise"
              payload: { compromise_reason: "HEMOLYZED" }
              as: LabLiaison
            - call: "POST /psc/specimens/${s1}/reject"
              payload: {}
              as: LabLiaison
              captures: { idx_1: $.data.day_rejection_index, waived_1: $.data.rejection_waived }
            - call: "POST /psc/specimens/${s2}/compromise"
              payload: { compromise_reason: "HEMOLYZED" }
              as: LabLiaison
            - call: "POST /psc/specimens/${s2}/reject"
              payload: {}
              as: LabLiaison
              captures: { idx_2: $.data.day_rejection_index, waived_2: $.data.rejection_waived }
            - call: "POST /psc/specimens/${s3}/compromise"
              payload: { compromise_reason: "HEMOLYZED" }
              as: LabLiaison
            - call: "POST /psc/specimens/${s3}/reject"
              payload: {}
              as: LabLiaison
              captures: { idx_3: $.data.day_rejection_index, err_3: $.data.error_id }
          assert:
            - "${idx_1} == 1 and ${waived_1} == false and ${idx_2} == 2 and ${waived_2} == false"
            - "${idx_3} == 3 and ${err_3} != null, so the third rejection was blocked"
            - "GET /psc/specimens/${s3} reports rejection_waived == true"
            - "Specimen.${s3}.status == COMPROMISED, since the blocked reject did not move it"

      - name: weighted_blend_sums_exactly_without_a_final_rounding_call
        claim_type: Correct Result
        grounds:
          - calculations.weighted_blend_cents
          - entities.InsurancePlan.fields.coinsurance_pct
          - entities.InsurancePlan.fields.copay_cents
        distinguishing_aspect: "weighted_blend_cents adds the four components as mathematical fractions with no trailing round(), so the 2500 + 2500 + 0 + 5000 fixture is exactly 10000 rather than a value drifted by a pre-rounded intermediate."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T13:00:00Z; a plan whose four weights are copay 2500, coinsurance 0.25 on an allowed amount of 10000, a non-binding deductible of 20000, and prior_paid_pct 0.0."
          setup_api_calls:
            - *k_clock
            - *k_center
            - call: "POST /psc/insurance-plans"
              payload: { payer_name: "HORIZON HMO", plan_type: "HMO", copay_cents: 2500, coinsurance_pct: 0.25, deductible_remaining_cents: 20000, allowed_amount_cents: 10000, prior_paid_pct: 0.0 }
              as: IntakeCoordinator
              captures: { plan_id: $.data.id }
            - *k_pat
            - call: "POST /psc/test-orders"
              payload: { service_center_id: "${c1}", patient_id: "${p1}", ordering_provider_npi: "1700111222", test_panel: "CMP", collection_mode: "STANDARD", list_price_cents: 5000, is_fasting_required: false, fasting_hours_required: 0, patient_last_food_utc: "2026-09-01T12:00:00Z", icd10_codes: [], insurance_plan_id: "${plan_id}" }
              as: IntakeCoordinator
              captures: { o1: $.data.id }
            - call: "POST /psc/test-orders/${o1}/insurance-resolve"
              payload: {}
              as: IntakeCoordinator
              captures: { v1: $.data.version, copay_est: $.data.est_copay_cents, coins_est: $.data.est_coinsurance_cents }
          trigger:
            - call: "POST /psc/test-orders/${o1}/estimates"
              payload: { variant: "ATTENDED_COLLECTED", supersedes_estimate_id: null, expected_test_order_version: "${v1}" }
              as: IntakeCoordinator
              captures: { e1: $.data.id }
          assert:
            - "${copay_est} == 2500 and ${coins_est} == 2500"
            - "weighted_blend_cents for this order == 10000 exactly"
            - "ResponsibilityEstimate.${e1}.gross_cents == 5000 and net_patient_cents == 4000"
            - "the deductible term contributed 0 because the non-binding deductible was capped at allowed - copay"

      - name: recollection_selector_excludes_ineligible_tubes_and_uncompromised_specimens
        claim_type: Input Set Filtering
        grounds:
          - calculations.specimen_recollection_order
          - entities.TubeRequirement.fields.is_recollection_eligible
          - endpoints.GET_/psc/specimens/selector
        distinguishing_aspect: "The selector's candidate set is an explicit enum predicate — status COMPROMISED, a declared reason set, and a tube marked recollection-eligible — so an UNASSIGNED specimen and a COMPROMISED specimen on a non-eligible tube are both excluded rather than merely ranked lower."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T13:00:00Z. One center with two tube requirements on CMP, one recollection-eligible at 240 minutes stability and one not; two orders, one specimen deliberately left UNASSIGNED and one compromised on the non-eligible tube."
          setup_api_calls:
            - *k_clock
            - *k_center
            - call: "POST /psc/tube-requirements"
              payload: { test_panel: "CMP", tube_code: "EDTA_LAVENDER", required_volume_ml: 4.0, min_volume_ml: 1.0, order_of_draw: 1, stability_minutes: 240, max_urgency_hours: 24, special_handling_codes: [], is_recollection_eligible: true }
              as: LabLiaison
            - call: "POST /psc/tube-requirements"
              payload: { test_panel: "CMP", tube_code: "SODIUM_CITRATE_BLUE", required_volume_ml: 2.7, min_volume_ml: 1.0, order_of_draw: 2, stability_minutes: 60, max_urgency_hours: 24, special_handling_codes: [], is_recollection_eligible: false }
              as: LabLiaison
            - call: "POST /psc/courier-runs"
              payload: { service_center_id: "${c1}", direction: "OUTBOUND", dispatch_utc: "2026-09-02T07:30:00Z" }
              as: LabLiaison
              captures: { r1: $.data.id }
            - *k_pat
            - *k_order
            - call: "POST /psc/specimens"
              payload: { test_order_id: "${o1}", tube_code: "EDTA_LAVENDER", volume_ml: 4.0, order_of_draw: 1, special_handling_codes: [] }
              as: Phlebotomist
              captures: { s_unassigned: $.data.id }
            - call: "POST /psc/specimens"
              payload: { test_order_id: "${o1}", tube_code: "SODIUM_CITRATE_BLUE", volume_ml: 2.7, order_of_draw: 2, special_handling_codes: [] }
              as: Phlebotomist
              captures: { s_no_recollect: $.data.id }
            - call: "POST /psc/specimens/${s_no_recollect}/assign-courier"
              payload: { courier_run_id: "${r1}" }
              as: LabLiaison
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-02T07:20:00Z" }
              as: CenterSupervisor
            - call: "POST /psc/specimens/${s_no_recollect}/compromise"
              payload: { compromise_reason: "CLOTTED" }
              as: LabLiaison
          trigger:
            - call: "GET /psc/specimens/selector"
              payload: { service_center_id: "${c1}" }
              as: LabLiaison
              captures: { first_candidate: "$.data[0].id" }
          assert:
            - "the selector returns an empty array, so no candidate survives the predicate"
            - "${first_candidate} is not ${s_unassigned}, which is only UNASSIGNED"
            - "${first_candidate} is not ${s_no_recollect}, whose tube is not recollection-eligible"
            - "Specimen.${s_no_recollect}.status == COMPROMISED, so it was excluded by the tube rule and not by its status"

      - name: fasting_deadline_is_never_snapped_to_the_scheduling_grid
        claim_type: Precision
        grounds:
          - calculations.fasting_deadline
          - entities.TestOrder.fields.fasting_deadline_utc
          - endpoints.GET_/psc/test-orders/{testOrderId}
        distinguishing_aspect: "fasting_deadline_utc is exact instant addition with no floor-to-grid rounding, so a 07:07 UTC last-meal instant plus 8 hours is 15:07 and not the 15:00 grid cell."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T13:00:00Z. One center and one fasting order whose last meal is deliberately off-grid at 2026-09-01T07:07:00Z."
          setup_api_calls:
            - *k_clock
            - *k_center
            - *k_seed
            - *k_pat
            - call: "POST /psc/test-orders"
              payload: { service_center_id: "${c1}", patient_id: "${p1}", ordering_provider_npi: "1700111222", test_panel: "CMP", collection_mode: "STANDARD", list_price_cents: 5000, is_fasting_required: true, fasting_hours_required: 8, patient_last_food_utc: "2026-09-01T07:07:00Z", icd10_codes: [], insurance_plan_id: "${plan_id}" }
              as: IntakeCoordinator
              captures: { o1: $.data.id }
          trigger:
            - call: "GET /psc/test-orders/${o1}"
              payload: {}
              as: IntakeCoordinator
              captures: { deadline: $.data.fasting_deadline_utc, overdue: $.data.fasting_overdue }
          assert:
            - "${deadline} == 2026-09-01T15:07:00Z"
            - "${deadline} != 2026-09-01T15:00:00Z, so no grid snapping occurred"
            - "${overdue} == false at the 13:00Z clock"

      - name: courier_commit_interval_is_half_open_at_its_upper_edge
        claim_type: Constants Applied
        grounds:
          - calculations.courier_run_selector
          - entities.CourierRun.fields.dispatch_utc
          - endpoints.GET_/psc/courier-runs/eligible
        distinguishing_aspect: "The commit interval is half-open — a dispatch_utc exactly equal to checkin_utc + 1080 minutes is selected, while checkin_utc + 1140 minutes falls outside — so the constant 1080 and the interval's open end are both load-bearing."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T13:00:00Z. One center with two OUTBOUND runs, one dispatching exactly 18 hours after the scheduled start and one 19 hours after."
          setup_api_calls:
            - *k_clock
            - *k_center
            - *k_seed
            - call: "POST /psc/courier-runs"
              payload: { service_center_id: "${c1}", direction: "OUTBOUND", dispatch_utc: "2026-09-02T07:00:00Z" }
              as: LabLiaison
              captures: { r_inside: $.data.id }
            - call: "POST /psc/courier-runs"
              payload: { service_center_id: "${c1}", direction: "OUTBOUND", dispatch_utc: "2026-09-02T08:00:00Z" }
              as: LabLiaison
              captures: { r_outside: $.data.id }
            - *k_pat
            - *k_order
            - call: "POST /psc/specimens"
              payload: { test_order_id: "${o1}", tube_code: "EDTA_LAVENDER", volume_ml: 4.0, order_of_draw: 1, special_handling_codes: [] }
              as: Phlebotomist
              captures: { s1: $.data.id }
          trigger:
            - call: "GET /psc/courier-runs/eligible"
              payload: { specimen_id: "${s1}" }
              as: LabLiaison
              captures: { first_eligible: "$.data[0].id" }
          assert:
            - "${first_eligible} == ${r_inside}"
            - "${first_eligible} != ${r_outside}"
            - "the eligible read returns exactly one run, so the open upper edge excluded ${r_outside}"
            - "CourierRun.${r_inside}.cutoff_utc == 2026-09-02T06:45:00Z"

      - name: provisional_variant_selects_zero_patient_responsibility_for_a_collected_eligible_order
        claim_type: Variant Selection
        grounds:
          - calculations.patient_service_estimate
          - entities.ResponsibilityEstimate.fields.variant
          - endpoints.POST_/psc/test-orders/{testOrderId}/estimates
        distinguishing_aspect: "PROVISIONAL_ELIGIBLE is the variant collected for an ELIGIBLE order at draw time, and it pins gross and net to 0 because the balance is filed to the payer rather than the patient — the very same order yields non-zero values only under the other two variants."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T13:00:00Z; one center, the reference plan seeded, one ELIGIBLE order, its appointment drawn and the specimen already registered."
          setup_api_calls:
            - *k_clock
            - *k_center
            - *k_seed
            - *k_phleb
            - *k_pat
            - *k_order
            - call: "POST /psc/test-orders/${o1}/insurance-resolve"
              payload: {}
              as: IntakeCoordinator
              captures: { v1: $.data.version }
            - *k_appt
            - call: "POST /psc/appointments/${a1}/check-in"
              payload: {}
              as: Patient
              as_user_id: "${p1}"
            - call: "POST /psc/appointments/${a1}/call"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /psc/appointments/${a1}/start-draw"
              payload: {}
              as: Phlebotomist
              captures: { v_after_draw: $.data.version }
          trigger:
            - call: "POST /psc/test-orders/${o1}/estimates"
              payload: { variant: "PROVISIONAL_ELIGIBLE", supersedes_estimate_id: null, expected_test_order_version: "${v1}" }
              as: IntakeCoordinator
              captures: { e1: $.data.id, gross: $.data.gross_cents, net: $.data.net_patient_cents }
          assert:
            - "the response status is 201 and ${gross} == 0 and ${net} == 0"
            - "ResponsibilityEstimate.${e1}.variant == PROVISIONAL_ELIGIBLE"
            - "TestOrder.${o1}.self_pay_rate_cents is 5000 even though the provisional net is 0, because the rate is stored independently of the variant"
            - "TestOrder.${o1}.status == IN_PROGRESS"

      - name: wait_band_variant_divergence
        claim_type: Variant Divergence
        grounds:
          - calculations.expected_wait_minutes
          - endpoints.GET_/psc/appointments/{appointmentId}/queue-status
        excluded_because:
          difficulty_instance: wait_dual_variant_on_appointment_queue
          rationale: "The instantaneous-versus-blend_rate divergence and the band crossing are the asserted outcome of that §1.8 instance."

      - name: blend_variant_divergence_on_the_order
        claim_type: Variant Divergence
        grounds:
          - calculations.patient_service_estimate
        excluded_because:
          difficulty_instance: estimate_dual_variant_on_test_order
          rationale: "SELF_PAY_LIST against ATTENDED_COLLECTED for one identical order is asserted there."

  # ===========================================================================
  - section: validations
    instances:

      - name: check_in_outside_the_window_returns_a_temporal_rejection
        claim_type: Temporal validation
        grounds:
          - validations[priority=5]
          - errors[ERR_INVALID_REQUEST]
          - state_machines.Appointment.transitions.SCHEDULED_to_CHECKED_IN
        distinguishing_aspect: "The check-in window is [start - 30 minutes, start + 15 minutes]; the same request succeeds at the exact upper edge and is rejected one minute past it, so the boundary belongs to priority 5d rather than to any state rule."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T13:00:00Z; an ELIGIBLE order booked for 14:00Z, so the window is 13:30Z to 14:15Z."
          setup_api_calls:
            - *k_clock
            - *k_center
            - *k_seed
            - *k_pat
            - *k_order
            - call: "POST /psc/test-orders/${o1}/insurance-resolve"
              payload: {}
              as: IntakeCoordinator
              captures: { v1: $.data.version }
            - *k_appt
            - call: "POST /psc/patients"
              payload: { full_name: "Bo Alvarez", birth_date: "1988-01-11T00:00:00Z", mrn: "MRN-3103-V1" }
              as: IntakeCoordinator
              captures: { p_late: $.data.id }
            - call: "POST /psc/test-orders"
              payload: { service_center_id: "${c1}", patient_id: "${p_late}", ordering_provider_npi: "1700111223", test_panel: "CMP", collection_mode: "STANDARD", list_price_cents: 5000, is_fasting_required: false, fasting_hours_required: 0, patient_last_food_utc: "2026-09-01T12:00:00Z", icd10_codes: [], insurance_plan_id: "${plan_id}" }
              as: IntakeCoordinator
              captures: { o_late: $.data.id }
            - call: "POST /psc/test-orders/${o_late}/insurance-resolve"
              payload: {}
              as: IntakeCoordinator
              captures: { v_late: $.data.version }
            - call: "POST /psc/appointments"
              payload: { service_center_id: "${c1}", test_order_id: "${o_late}", scheduled_start_utc: "2026-09-01T14:00:00Z", slot_span: 1, source: "BOOKED", expected_test_order_version: "${v_late}" }
              as: IntakeCoordinator
              captures: { a_late: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T14:15:00Z" }
              as: CenterSupervisor
            - call: "POST /psc/appointments/${a1}/check-in"
              payload: {}
              as: Patient
              as_user_id: "${p1}"
              captures: { edge_state: $.data.draw_state }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T14:16:00Z" }
              as: CenterSupervisor
            - call: "POST /psc/appointments/${a_late}/check-in"
              payload: {}
              as: Patient
              as_user_id: "${p_late}"
              captures: { err_late: $.data.error_id }
          assert:
            - "${edge_state} == CHECKED_IN, so the exact upper edge is still inside the window"
            - "${err_late} != null and Appointment.${a_late}.draw_state == SCHEDULED"
            - "Appointment.${a_late}.checkin_utc is null"

      - name: pediatric_order_at_a_non_capable_center_is_rejected_before_hours_in_local_time
        claim_type: Priority conflict
        grounds:
          - validations[priority=5]
          - validations[priority=7]
          - errors[ERR_PEDIATRIC_CENTER_NOT_CAPABLE]
          - errors[ERR_OUTSIDE_OPERATING_HOURS]
        distinguishing_aspect: "Two independent rejections are armed on one request — a PEDIATRIC order at a pediatric_capable false center, and a slot outside the declared operating hours — and the priority 5a clinical-safety check must win over the priority 7a temporal check."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T13:00:00Z; a center with pediatric_capable false and hours 480 to 1020 local (08:00 to 17:00 local at offset -300, so 13:00Z to 22:00Z UTC); an ELIGIBLE PEDIATRIC order."
          setup_api_calls:
            - *k_clock
            - call: "POST /psc/service-centers"
              payload: { name: "Plain Draw Station", state_code: "TX", timezone_offset_minutes: -300, station_count: 2, open_local_minutes: 480, close_local_minutes: 1020, pediatric_capable: false }
              as: CenterSupervisor
              captures: { c_plain: $.data.id }
            - call: "POST /_scenarios/seed-reference"
              payload: {}
              as: CenterSupervisor
              captures: { plan_id: "$.data.insurance_plan_id" }
            - call: "POST /psc/patients"
              payload: { full_name: "Kid Sato", birth_date: "2016-03-03T00:00:00Z", mrn: "MRN-3103-V2" }
              as: IntakeCoordinator
              captures: { pk: $.data.id }
            - call: "POST /psc/test-orders"
              payload: { service_center_id: "${c_plain}", patient_id: "${pk}", ordering_provider_npi: "1700111224", test_panel: "CMP", collection_mode: "PEDIATRIC", list_price_cents: 5000, is_fasting_required: false, fasting_hours_required: 0, patient_last_food_utc: "2026-09-01T12:00:00Z", icd10_codes: [], insurance_plan_id: "${plan_id}" }
              as: IntakeCoordinator
              captures: { ok: $.data.id }
            - call: "POST /psc/test-orders/${ok}/insurance-resolve"
              payload: {}
              as: IntakeCoordinator
              captures: { v_ok: $.data.version }
          trigger:
            - call: "POST /psc/appointments"
              payload: { service_center_id: "${c_plain}", test_order_id: "${ok}", scheduled_start_utc: "2026-09-01T23:00:00Z", slot_span: 1, source: "BOOKED", expected_test_order_version: "${v_ok}" }
              as: IntakeCoordinator
              captures: { err_id: $.data.error_id }
          assert:
            - "${err_id} == ERR_PEDIATRIC_CENTER_NOT_CAPABLE"
            - "${err_id} != ERR_OUTSIDE_OPERATING_HOURS, confirming priority 5a beat priority 7a"
            - "GET /psc/appointments?service_center_id=${c_plain} returns 0 rows"

      - name: cross_entity_eligibility_check_reads_the_plan_not_the_client
        claim_type: Cross-entity validation
        grounds:
          - validations[priority=6]
          - errors[ERR_INSURANCE_INELIGIBLE]
          - endpoints.POST_/psc/test-orders/{testOrderId}/insurance-resolve
        distinguishing_aspect: "The fiscal check reads InsurancePlan.status from the referenced row, so an order at a TERMINATED plan resolves to EXPIRED and is refused at priority 6 even though the client supplied nothing about eligibility."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T13:00:00Z; a plan credited and then terminated, with one order pointing at it."
          setup_api_calls:
            - *k_clock
            - *k_center
            - call: "POST /_scenarios/seed-reference"
              payload: {}
              as: CenterSupervisor
              captures: { plan_id: "$.data.insurance_plan_id" }
            - *k_pat
            - *k_order
            - call: "PATCH /psc/insurance-plans/${plan_id}"
              payload: { status: "TERMINATED" }
              as: IntakeCoordinator
              captures: { plan_state: $.data.status }
          trigger:
            - call: "POST /psc/test-orders/${o1}/insurance-resolve"
              payload: {}
              as: IntakeCoordinator
              captures: { ins_state: $.data.insurance_status, copay_after: $.data.est_copay_cents }
          assert:
            - "${plan_state} == TERMINATED"
            - "${ins_state} == EXPIRED and ${copay_after} == 0"
            - "GET /psc/test-orders/${o1} reports insurance_status EXPIRED"
            - "TestOrder.${o1}.est_coinsurance_cents == 0"

      - name: necessity_pending_blocks_check_in_with_its_own_error
        claim_type: Cascading validation
        grounds:
          - validations[priority=6]
          - errors[ERR_MEDICAL_NECESSITY_PENDING]
          - errors[ERR_MEDICAL_NECESSITY_FAILED]
        distinguishing_aspect: "An unknown diagnosis code leaves necessity_status PENDING rather than FAIL, and check-in reports the PENDING error — so the two necessity outcomes are distinguishable rather than collapsed into one rejection."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T13:00:00Z; the reference grid seeded, an order whose only code is unknown to the grid, and one whose only code is a known non-covered pair."
          setup_api_calls:
            - *k_clock
            - *k_center
            - *k_seed
            - *k_pat
            - call: "POST /psc/test-orders"
              payload: { service_center_id: "${c1}", patient_id: "${p1}", ordering_provider_npi: "1700111225", test_panel: "CMP", collection_mode: "STANDARD", list_price_cents: 5000, is_fasting_required: false, fasting_hours_required: 0, patient_last_food_utc: "2026-09-01T12:00:00Z", icd10_codes: ["ZZZ.9"], insurance_plan_id: "${plan_id}" }
              as: IntakeCoordinator
              captures: { o_pend: $.data.id }
            - call: "POST /psc/test-orders/${o_pend}/necessity-check"
              payload: {}
              as: IntakeCoordinator
              captures: { nec_pend: $.data.necessity_status }
            - call: "POST /psc/test-orders/${o_pend}/insurance-resolve"
              payload: {}
              as: IntakeCoordinator
              captures: { v_pend: $.data.version }
            - call: "POST /psc/appointments"
              payload: { service_center_id: "${c1}", test_order_id: "${o_pend}", scheduled_start_utc: "2026-09-01T14:00:00Z", slot_span: 1, source: "BOOKED", expected_test_order_version: "${v_pend}" }
              as: IntakeCoordinator
              captures: { a_pend: $.data.id }
          trigger:
            - call: "POST /psc/appointments/${a_pend}/check-in"
              payload: {}
              as: Patient
              as_user_id: "${p1}"
              captures: { err_id: $.data.error_id }
          assert:
            - "${nec_pend} == PENDING"
            - "${err_id} == ERR_MEDICAL_NECESSITY_PENDING"
            - "${err_id} != ERR_MEDICAL_NECESSITY_FAILED"
            - "Appointment.${a_pend}.draw_state == SCHEDULED"

      - name: fiscal_prepay_check_outranks_the_lower_priority_capacity_check
        claim_type: Priority conflict
        grounds:
          - validations[priority=6]
          - validations[priority=7]
          - errors[ERR_STATION_CAPACITY_EXCEEDED]
        excluded_because:
          difficulty_instance: fiscal_necc_vs_safety_precedence_at_draw_start
          rationale: "That instance already asserts the inverted priority 5 against priority 6 ordering on a dual-failure request."

      - name: aggregate_station_capacity_rejects_the_request_that_would_exceed_it
        claim_type: Aggregate validation
        grounds:
          - validations[priority=7]
          - errors[ERR_STATION_CAPACITY_EXCEEDED]
          - endpoints.POST_/psc/appointments
        distinguishing_aspect: "Each booking is individually valid, but the running total of booked station-minutes within the operating day exceeds station_count * slot_minutes and the request that would cross the aggregate is the one refused."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T13:00:00Z; a center with station_count 1 and slot_minutes 15, so the aggregate budget for the day is 15 station-minutes and a single booked cell already fills it."
          setup_api_calls:
            - *k_clock
            - call: "POST /psc/service-centers"
              payload: { name: "Tiny Draw Station", state_code: "TX", timezone_offset_minutes: -300, station_count: 1, slot_minutes: 15, open_local_minutes: 480, close_local_minutes: 1020 }
              as: CenterSupervisor
              captures: { c_tiny: $.data.id }
            - call: "POST /_scenarios/seed-reference"
              payload: {}
              as: CenterSupervisor
              captures: { plan_id: "$.data.insurance_plan_id" }
            - *k_pat
            - call: "POST /psc/test-orders"
              payload: { service_center_id: "${c_tiny}", patient_id: "${p1}", ordering_provider_npi: "1700111226", test_panel: "CMP", collection_mode: "STANDARD", list_price_cents: 5000, is_fasting_required: false, fasting_hours_required: 0, patient_last_food_utc: "2026-09-01T12:00:00Z", icd10_codes: [], insurance_plan_id: "${plan_id}" }
              as: IntakeCoordinator
              captures: { o1: $.data.id }
            - call: "POST /psc/test-orders/${o1}/insurance-resolve"
              payload: {}
              as: IntakeCoordinator
              captures: { v1: $.data.version }
            - call: "POST /psc/appointments"
              payload: { service_center_id: "${c_tiny}", test_order_id: "${o1}", scheduled_start_utc: "2026-09-01T14:00:00Z", slot_span: 1, source: "BOOKED", expected_test_order_version: "${v1}" }
              as: IntakeCoordinator
              captures: { a1: $.data.id }
            - call: "POST /psc/patients"
              payload: { full_name: "Bo Alvarez", birth_date: "1988-01-11T00:00:00Z", mrn: "MRN-3103-V3" }
              as: IntakeCoordinator
              captures: { p2: $.data.id }
            - call: "POST /psc/test-orders"
              payload: { service_center_id: "${c_tiny}", patient_id: "${p2}", ordering_provider_npi: "1700111227", test_panel: "CMP", collection_mode: "STANDARD", list_price_cents: 5000, is_fasting_required: false, fasting_hours_required: 0, patient_last_food_utc: "2026-09-01T12:00:00Z", icd10_codes: [], insurance_plan_id: "${plan_id}" }
              as: IntakeCoordinator
              captures: { o2: $.data.id }
            - call: "POST /psc/test-orders/${o2}/insurance-resolve"
              payload: {}
              as: IntakeCoordinator
              captures: { v2: $.data.version }
          trigger:
            - call: "POST /psc/appointments"
              payload: { service_center_id: "${c_tiny}", test_order_id: "${o2}", scheduled_start_utc: "2026-09-01T14:15:00Z", slot_span: 1, source: "BOOKED", expected_test_order_version: "${v2}" }
              as: IntakeCoordinator
              captures: { err_id: $.data.error_id }
          assert:
            - "the first booking succeeded with Appointment.${a1}.draw_state == SCHEDULED"
            - "${err_id} == ERR_STATION_CAPACITY_EXCEEDED"
            - "GET /psc/appointments?service_center_id=${c_tiny} returns exactly 1 row"

  # ===========================================================================
  - section: endpoints
    instances:

      - name: queue_status_is_a_computed_read_that_echoes_no_stored_wait_field
        claim_type: Computed read
        grounds:
          - endpoints.GET_/psc/appointments/{appointmentId}/queue-status
          - calculations.expected_wait_minutes
        distinguishing_aspect: "queue-status is a pure projection: estimated_wait_minutes, wait_band and fasting_gate are computed on every read and never persisted, so two reads with no intervening write return the same numbers and Appointment carries no wait column."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T13:00:00Z; one center with an ON_DUTY LABEL_PBS phlebotomist and one checked-in appointment."
          setup_api_calls:
            - *k_clock
            - *k_center
            - *k_seed
            - *k_phleb
            - *k_pat
            - *k_order
            - call: "POST /psc/test-orders/${o1}/insurance-resolve"
              payload: {}
              as: IntakeCoordinator
              captures: { v1: $.data.version }
            - *k_appt
            - call: "POST /psc/appointments/${a1}/check-in"
              payload: {}
              as: Patient
              as_user_id: "${p1}"
          trigger:
            - call: "GET /psc/appointments/${a1}/queue-status"
              payload: {}
              as: Patient
              as_user_id: "${p1}"
              captures: { wait_first: $.data.estimated_wait_minutes }
            - call: "GET /psc/appointments/${a1}/queue-status"
              payload: {}
              as: Patient
              as_user_id: "${p1}"
              captures: { wait_second: $.data.estimated_wait_minutes }
            - call: "GET /psc/appointments/${a1}"
              payload: {}
              as: IntakeCoordinator
              captures: { appt_version: $.data.version }
          assert:
            - "${wait_first} == ${wait_second}, so the value is reproducible with no write between reads"
            - "the response status is 200 and the body carries no stored estimated_wait_minutes field"
            - "Appointment.${a1}.draw_state == CHECKED_IN"

      - name: bulk_commit_all_assigns_only_what_the_window_admits
        claim_type: Bulk action
        grounds:
          - endpoints.POST_/psc/courier-runs/{courierRunId}/commit-all
          - calculations.unassigned_specimen_assignment_order
          - errors[ERR_NO_ELIGIBLE_COURIER_RUN]
        distinguishing_aspect: "commit-all is a bulk operation with a conservative failure mode: specimens outside the commit window stay UNASSIGNED with no error surfaced, and the response reports the run rather than an error envelope."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T13:00:00Z; a center whose OUTBOUND run dispatches 2026-09-02T07:00:00Z, and one specimen with a 60-minute stability window collected at 13:00Z that cannot survive to dispatch."
          setup_api_calls:
            - *k_clock
            - *k_center
            - *k_seed
            - call: "POST /psc/courier-runs"
              payload: { service_center_id: "${c1}", direction: "OUTBOUND", dispatch_utc: "2026-09-02T07:00:00Z" }
              as: LabLiaison
              captures: { r1: $.data.id }
            - *k_pat
            - *k_order
            - call: "POST /psc/tube-requirements"
              payload: { test_panel: "LACTATE", tube_code: "SODIUM_FLUORIDE_GRAY", required_volume_ml: 2.0, min_volume_ml: 0.5, order_of_draw: 5, stability_minutes: 60, max_urgency_hours: 4, special_handling_codes: [], is_recollection_eligible: true }
              as: LabLiaison
            - call: "POST /psc/specimens"
              payload: { test_order_id: "${o1}", tube_code: "EDTA_LAVENDER", volume_ml: 4.0, order_of_draw: 1, special_handling_codes: [] }
              as: Phlebotomist
              captures: { s1: $.data.id }
          trigger:
            - call: "POST /psc/courier-runs/${r1}/commit-all"
              payload: {}
              as: LabLiaison
              captures: { committed: $.data.committed_specimen_count }
            - call: "GET /psc/specimens"
              payload: { courier_run_id: "${r1}" }
              as: LabLiaison
              captures: { run_rows: "$.data[0].id" }
          assert:
            - "${committed} == 1, so the EDT acid specimen inside the window was committed"
            - "${run_rows} == ${s1}"
            - "the 60-minute LACTATE tube was never registered, so no specimen was silently dropped"
            - "the response is an object whose response_type is object, not an error envelope"

      - name: assign_courier_is_a_conditional_action_with_dual_declared_outcomes
        claim_type: Conditional action
        grounds:
          - endpoints.POST_/psc/specimens/{specimenId}/assign-courier
          - errors[ERR_NO_ELIGIBLE_COURIER_RUN]
          - errors[ERR_INVALID_STATE]
        excluded_because:
          difficulty_instance: empty_candidate_set_on_courier_selector_returns_declared_sentinel
          rationale: "The empty-candidate read sentinel and the ERR_NO_ELIGIBLE_COURIER_RUN write rejection are that instance's asserted outcome."

      - name: dispatch_then_deliver_moves_the_whole_run_and_every_specimen_on_it
        claim_type: Action endpoint
        grounds:
          - endpoints.POST_/psc/courier-runs/{courierRunId}/dispatch
          - endpoints.POST_/psc/courier-runs/{courierRunId}/deliver
          - state_machines.CourierRun.transitions.IN_TRANSIT_to_DELIVERED
        distinguishing_aspect: "One dispatch call and one deliver call each move the run and fan out over every specimen riding it, so the run's terminal state and its specimens' terminal states are observed together."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T15:55:00Z; a center whose OUTBOUND run dispatches 16:00Z carrying two assigned specimens."
          setup_api_calls:
            - *k_clock
            - *k_center
            - *k_seed
            - *k_pat
            - *k_order
            - call: "POST /psc/specimens"
              payload: { test_order_id: "${o1}", tube_code: "EDTA_LAVENDER", volume_ml: 4.0, order_of_draw: 1, special_handling_codes: [] }
              as: Phlebotomist
              captures: { s1: $.data.id }
            - call: "POST /psc/specimens"
              payload: { test_order_id: "${o1}", tube_code: "SST_GOLD", volume_ml: 5.0, order_of_draw: 3, special_handling_codes: [] }
              as: Phlebotomist
              captures: { s2: $.data.id }
            - call: "POST /psc/courier-runs"
              payload: { service_center_id: "${c1}", direction: "OUTBOUND", dispatch_utc: "2026-09-01T16:00:00Z" }
              as: LabLiaison
              captures: { r1: $.data.id }
            - call: "POST /psc/specimens/${s1}/assign-courier"
              payload: { courier_run_id: "${r1}" }
              as: LabLiaison
            - call: "POST /psc/specimens/${s2}/assign-courier"
              payload: { courier_run_id: "${r1}" }
              as: LabLiaison
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T16:00:00Z" }
              as: CenterSupervisor
          trigger:
            - call: "POST /psc/courier-runs/${r1}/dispatch"
              payload: {}
              as: LabLiaison
              captures: { after_dispatch: $.data.status }
            - call: "POST /psc/courier-runs/${r1}/deliver"
              payload: {}
              as: LabLiaison
              captures: { after_deliver: $.data.status }
          assert:
            - "${after_dispatch} == DISPATCHED and ${after_deliver} == DELIVERED"
            - "GET /psc/specimens?courier_run_id=${r1} returns two rows, both RECEIVED"
            - "CourierRun.${r1}.committed_specimen_count == 2, unchanged by the transit"
            - "a second dispatch call on the delivered run is rejected with ERR_INVALID_STATE"

      - name: run_ops_is_not_idempotent_and_advances_the_epoch_counter
        claim_type: Action endpoint
        grounds:
          - endpoints.POST_/psc/run-ops
          - entities.ServiceCenter.fields.ops_run_index
        distinguishing_aspect: "run_ops is deliberately not idempotent — each call advances ops_run_index by exactly one and re-derives the roster scalar, so two sequential calls leave the counter at 2 rather than at 1."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T13:00:00Z; one center with two ON_DUTY phlebotomists."
          setup_api_calls:
            - *k_clock
            - *k_center
            - call: "POST /psc/phlebotomists"
              payload: { service_center_id: "${c1}", full_name: "Hana Reed", credential: "RN", shift_start_local_minutes: 420, shift_end_local_minutes: 1020 }
              as: CenterSupervisor
            - call: "POST /psc/phlebotomists"
              payload: { service_center_id: "${c1}", full_name: "Omar Vela", credential: "LABEL_PBS", shift_start_local_minutes: 420, shift_end_local_minutes: 1020 }
              as: CenterSupervisor
          trigger:
            - call: "POST /psc/run-ops"
              payload: { service_center_id: "${c1}" }
              as: CenterSupervisor
              captures: { idx_1: $.data.ops_run_index, staff_1: $.data.staffed_minutes_available }
            - call: "POST /psc/run-ops"
              payload: { service_center_id: "${c1}" }
              as: CenterSupervisor
              captures: { idx_2: $.data.ops_run_index, staff_2: $.data.staffed_minutes_available }
          assert:
            - "${idx_1} == 1 and ${idx_2} == 2"
            - "${staff_1} == ${staff_2}, so the roster scalar re-derives to the same value"
            - "ServiceCenter.${c1}.version has advanced twice"

  # ===========================================================================
  - section: errors
    instances:

      - name: unauthenticated_call_without_a_role_header_is_rejected_at_priority_1
        claim_type: Violation to error
        grounds:
          - errors[ERR_MISSING_AUTH]
          - validations[priority=1]
        distinguishing_aspect: "A request carrying no X-User-Role header is rejected at priority 1 with 401 ERR_MISSING_AUTH before any existence, state or business check can run, so an unknown path id cannot mask the auth failure."
        test_recipe:
          setup:
            - "Logical clock set; empty database."
          setup_api_calls:
            - *k_clock
          trigger:
            - call: "GET /psc/service-centers/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: NotARole
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 401 and ${err_id} == ERR_MISSING_AUTH"
            - "${err_id} != ERR_SERVICE_CENTER_NOT_FOUND, confirming auth preceded existence"
            - "response_type is error"

      - name: path_dimension_assignment_cannot_be_performed_by_a_patient
        claim_type: Violation to error
        grounds:
          - errors[ERR_FORBIDDEN_ROLE]
          - validations[priority=2]
        distinguishing_aspect: "Assigning a courier run is exclusive to LabLiaison, so a Patient acting on their own specimen is refused at priority 2 with ERR_FORBIDDEN_ROLE — ownership of the order does not confer the operation."
        test_recipe:
          setup:
            - "Logical clock set; a center, an ELIGIBLE order owned by a patient, and one specimen."
          setup_api_calls:
            - *k_clock
            - *k_center
            - *k_seed
            - *k_pat
            - *k_order
            - call: "POST /psc/specimens"
              payload: { test_order_id: "${o1}", tube_code: "EDTA_LAVENDER", volume_ml: 4.0, order_of_draw: 1, special_handling_codes: [] }
              as: Phlebotomist
              captures: { s1: $.data.id }
            - call: "POST /psc/courier-runs"
              payload: { service_center_id: "${c1}", direction: "OUTBOUND", dispatch_utc: "2026-09-01T16:00:00Z" }
              as: LabLiaison
              captures: { r1: $.data.id }
          trigger:
            - call: "POST /psc/specimens/${s1}/assign-courier"
              payload: { courier_run_id: "${r1}" }
              as: Patient
              as_user_id: "${p1}"
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 403 and ${err_id} == ERR_FORBIDDEN_ROLE"
            - "Specimen.${s1}.status == UNASSIGNED and CourierRun.${r1}.committed_specimen_count == 0"

      - name: a_pediatric_order_requiring_a_credential_the_roster_lacks_blocks_the_call
        claim_type: Violation to error
        grounds:
          - errors[ERR_STAFF_CREDENTIAL_INSUFFICIENT]
          - validations[priority=5]
        excluded_because:
          difficulty_instance: appointment_runs_two_parallel_dimensions_with_hold_expiry
          rationale: "The credential-insufficiency rejection is observed alongside the STAFF_PENDING transition in that §1.8 instance."

      - name: an_out_of_enum_collection_mode_is_rejected_at_intake
        claim_type: Violation to error
        grounds:
          - errors[ERR_INVALID_REQUEST]
          - entities.TestOrder.fields.collection_mode
          - endpoints.POST_/psc/test-orders
        distinguishing_aspect: "collection_mode is a closed five-member enum, so a value such as TINY_POKE is rejected at 400 ERR_INVALID_REQUEST rather than stored and later driving the credential and pediatric branches."
        test_recipe:
          setup:
            - "Logical clock set; a center, the reference grid seeded, and one patient."
          setup_api_calls:
            - *k_clock
            - *k_center
            - *k_seed
            - *k_pat
          trigger:
            - call: "POST /psc/test-orders"
              payload: { service_center_id: "${c1}", patient_id: "${p1}", ordering_provider_npi: "1700111228", test_panel: "CMP", collection_mode: "TINY_POKE", list_price_cents: 5000, is_fasting_required: false, fasting_hours_required: 0, patient_last_food_utc: "2026-09-01T12:00:00Z", icd10_codes: [], insurance_plan_id: "${plan_id}" }
              as: IntakeCoordinator
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 400 and ${err_id} == ERR_INVALID_REQUEST"
            - "GET /psc/test-orders returns 0 rows"

      - name: a_panel_with_no_matching_tube_requirement_is_rejected_at_rejection_time
        claim_type: Violation to error
        grounds:
          - errors[ERR_TUBE_REQUIREMENT_MISSING]
          - validations[priority=8]
          - endpoints.POST_/psc/specimens/{specimenId}/reject
        distinguishing_aspect: "ERR_TUBE_REQUIREMENT_MISSING is raised at priority 8, LATER than the priority 5 clinical checks, so it is only reachable once the specimen is otherwise rejectable — a deliberately unreachable-by-design catalog entry that becomes live when the grid row is deleted."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T13:00:00Z; a compromised specimen whose (panel, tube) grid row was never registered."
          setup_api_calls:
            - *k_clock
            - *k_center
            - *k_seed
            - *k_pat
            - *k_order
            - call: "POST /psc/specimens"
              payload: { test_order_id: "${o1}", tube_code: "EDTA_LAVENDER", volume_ml: 4.0, order_of_draw: 1, special_handling_codes: [] }
              as: Phlebotomist
              captures: { s1: $.data.id }
            - call: "POST /psc/courier-runs"
              payload: { service_center_id: "${c1}", direction: "OUTBOUND", dispatch_utc: "2026-09-01T16:00:00Z" }
              as: LabLiaison
              captures: { r1: $.data.id }
            - call: "POST /psc/specimens/${s1}/assign-courier"
              payload: { courier_run_id: "${r1}" }
              as: LabLiaison
            - call: "POST /psc/specimens/${s1}/compromise"
              payload: { compromise_reason: "CLOTTED" }
              as: LabLiaison
          trigger:
            - call: "POST /psc/specimens/${s1}/reject"
              payload: {}
              as: LabLiaison
              captures: { err_id: $.data.error_id }
          assert:
            - "${err_id} == ERR_TUBE_REQUIREMENT_MISSING"
            - "Specimen.${s1}.status == COMPROMISED and day_rejection_index == 0"

  # ===========================================================================
  - section: rbac
    instances:

      - name: a_phlebotomist_cannot_book_an_appointment
        claim_type: peer_roles
        grounds:
          - roles[Phlebotomist]
          - roles[IntakeCoordinator]
          - errors[ERR_FORBIDDEN_ROLE]
        distinguishing_aspect: "Booking is not in the Phlebotomist's declared operation set, so the call is refused at priority 2 even for a phlebotomist employed by the very center being booked."
        test_recipe:
          setup:
            - "Logical clock set; one center, the reference grid seeded, an ELIGIBLE order, and an on-duty phlebotomist."
          setup_api_calls:
            - *k_clock
            - *k_center
            - *k_seed
            - *k_phleb
            - *k_pat
            - *k_order
            - call: "POST /psc/test-orders/${o1}/insurance-resolve"
              payload: {}
              as: IntakeCoordinator
              captures: { v1: $.data.version }
          trigger:
            - call: "POST /psc/appointments"
              payload: { service_center_id: "${c1}", test_order_id: "${o1}", scheduled_start_utc: "2026-09-01T14:00:00Z", slot_span: 1, source: "BOOKED", expected_test_order_version: "${v1}" }
              as: Phlebotomist
              as_user_id: "${ph}"
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 403 and ${err_id} == ERR_FORBIDDEN_ROLE"
            - "GET /psc/appointments?service_center_id=${c1} returns 0 rows"

      - name: a_center_supervisor_cannot_declare_a_specimen_compromised
        claim_type: peer_roles
        grounds:
          - roles[CenterSupervisor]
          - roles[LabLiaison]
          - errors[ERR_FORBIDDEN_ROLE]
        distinguishing_aspect: "Compromise declaration is exclusive to LabLiaison, so the center's own supervisor is refused even though they govern the roster and the operations checkpoint."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T13:00:00Z; a center, an ELIGIBLE order, one specimen assigned to a run at 16:00Z."
          setup_api_calls:
            - *k_clock
            - *k_center
            - *k_seed
            - *k_pat
            - *k_order
            - call: "POST /psc/courier-runs"
              payload: { service_center_id: "${c1}", direction: "OUTBOUND", dispatch_utc: "2026-09-01T16:00:00Z" }
              as: LabLiaison
              captures: { r1: $.data.id }
            - call: "POST /psc/specimens"
              payload: { test_order_id: "${o1}", tube_code: "EDTA_LAVENDER", volume_ml: 4.0, order_of_draw: 1, special_handling_codes: [] }
              as: Phlebotomist
              captures: { s1: $.data.id }
            - call: "POST /psc/specimens/${s1}/assign-courier"
              payload: { courier_run_id: "${r1}" }
              as: LabLiaison
          trigger:
            - call: "POST /psc/specimens/${s1}/compromise"
              payload: { compromise_reason: "HEMOLYZED" }
              as: CenterSupervisor
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 403 and ${err_id} == ERR_FORBIDDEN_ROLE"
            - "Specimen.${s1}.status == ASSIGNED and CourierRun.${r1}.committed_specimen_count == 1"

      - name: a_patient_can_check_in_their_own_appointment
        claim_type: peer_roles
        grounds:
          - roles[Patient]
          - endpoints.POST_/psc/appointments/{appointmentId}/check-in
        distinguishing_aspect: "check-in is shared with Patient, and the ownership rule is satisfied because X-User-ID equals the appointment's order patient_id — the positive twin of the RBAC denial cases."
        test_recipe:
          setup:
