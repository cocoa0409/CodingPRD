      - name: open_legal_mandate_moves_policy_to_action_required_without_going_overdue
        claim_type: Input Set Filtering
        grounds:
          - calculations.policy_compliance_state
          - entities.LegalMandate.fields.days_past_deadline
          - entities.Policy.fields.open_mandate_count
        distinguishing_aspect: "Phase 2 of the compliance ladder distinguishes open from overdue: with the clock well before compliance_deadline the mandate stays OPEN with days_past_deadline 0, open_mandate_count 1, overdue_mandate_count 0, and the policy lands on ACTION_REQUIRED rather than NON_COMPLIANT."
        test_recipe:
          setup:
            - "One LOCAL_DISCRETION policy BP-9010, which would otherwise be COMPLIANT."
            - "The clock rests at the 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /governance/policies"
              payload: { code: "BP-9010", title: "Board Retreat Guidelines", category: "GOVERNANCE", legal_requirement_level: "LOCAL_DISCRETION", manual_section: "9000.10" }
              as: PolicyAnalyst
              captures: { pol: $.data.id }
          trigger:
            - call: "POST /governance/legal-mandates"
              payload: { notice_code: "LUS-2026-030", policy_id: "${pol}", citation: "GC 54954", issued_on: "2026-08-01T00:00:00Z", compliance_deadline: "2026-12-01T00:00:00Z", required_action: "ADOPT_NEW" }
              as: LegalUpdateService
              captures: { man: $.data.id }
          assert:
            - "HTTP status == 201"
            - "LegalMandate.${man}.status == OPEN"
            - "LegalMandate.${man}.days_past_deadline == 0"
            - "LegalMandate.${man}.satisfied_by_version_no == null"
            - "Policy.${pol}.open_mandate_count == 1"
            - "Policy.${pol}.overdue_mandate_count == 0"
            - "Policy.${pol}.compliance_state == ACTION_REQUIRED"

      - name: drafting_a_version_moves_open_mandates_to_in_progress
        claim_type: Correct Result
        grounds:
          - state_machines.LegalMandate.OPEN_to_IN_PROGRESS
          - endpoints[POST /governance/policies/{id}/versions]
        distinguishing_aspect: "Creating a PolicyVersion against a mandated policy flips every OPEN mandate on that policy to IN_PROGRESS, but both statuses count as open, so Policy.open_mandate_count stays 1 and compliance_state stays ACTION_REQUIRED."
        test_recipe:
          setup:
            - "Policy BP-9010 (LOCAL_DISCRETION) carries one OPEN mandate LUS-2026-030 with a 2026-12-01 deadline."
          setup_api_calls:
            - call: "POST /governance/policies"
              payload: { code: "BP-9010", title: "Board Retreat Guidelines", category: "GOVERNANCE", legal_requirement_level: "LOCAL_DISCRETION", manual_section: "9000.10" }
              as: PolicyAnalyst
              captures: { pol: $.data.id }
            - call: "POST /governance/legal-mandates"
              payload: { notice_code: "LUS-2026-030", policy_id: "${pol}", citation: "GC 54954", issued_on: "2026-08-01T00:00:00Z", compliance_deadline: "2026-12-01T00:00:00Z", required_action: "ADOPT_NEW" }
              as: LegalUpdateService
              captures: { man: $.data.id }
