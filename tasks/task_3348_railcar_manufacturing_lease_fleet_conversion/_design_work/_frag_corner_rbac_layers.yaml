              as: RegulatoryRetrofitist
              captures: { rp_id: $.data.id, rp_status0: $.data.status, rp_cost0: $.data.program_cost_cents, rp_v0: $.data.version }
            - call: "POST /api/v1/retrofit-program-car-types"
