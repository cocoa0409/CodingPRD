          - validations[12].ERR_INVALID_POLICY_STATE
          - validations[51].ERR_LIMIT_BELOW_MINIMUM
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / bind_policy_state_error_precedes_limit_minimum_rejects_superseded_quote
          rationale: "The §1.8 instance builds a superseded quote whose limit is also below the minimum and asserts the priority 12 error wins."

      - name: corner_validation_priority_pair_plan_approve
        claim_type: priority_conflict
        grounds:
          - validations[21].ERR_CREDITED_CONTROL_MISSING
          - validations[32].ERR_PINNED_GOAL_VERSION_STALE
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / approve_credited_control_error_precedes_pinned_goal_version
          rationale: "The §1.8 instance violates both gates in one approve call and asserts the priority 21 error."

      - name: corner_validation_priority_pair_certify_owner_vs_frozen
        claim_type: priority_conflict
        grounds:
          - validations[6].ERR_NOT_RESOURCE_OWNER
          - validations[10].ERR_SITE_FROZEN
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / certify_owner_check_precedes_site_frozen_gate
          rationale: "The §1.8 instance certifies on a frozen site as the wrong owner and asserts the priority 6 error."

      - name: corner_validation_temporal_control_coverage_buffer
        claim_type: temporal_validation
        grounds:
          - validations[27].ERR_CONTROL_COVERAGE_CONFLICT
        excluded_because:
          difficulty_instance: resource_temporal_overlap / engineering_control_coverage_buffer_rejects_thirty_day_gap
          rationale: "The §1.8 instance walks the closed-interval overlap, the symmetric 30-day buffer and the first accepted 31-day gap, plus the INSTITUTIONAL exemption."

      - name: corner_validation_aggregate_lab_capacity
        claim_type: aggregate_validation
        grounds:
          - validations[28].ERR_LAB_CAPACITY_EXCEEDED
        excluded_because:
          difficulty_instance: resource_temporal_overlap / laboratory_half_open_window_capacity_counts_touching_as_free
          rationale: "The §1.8 instance asserts the half-open intersection rule, the touching-windows-are-free case and the aggregate count at capacity."

      - name: corner_validation_cross_entity_enrollment_eligibility
        claim_type: cross_entity_validation
        grounds:
          - validations[33].ERR_ENROLLMENT_NOT_ELIGIBLE
          - validations[33].ERR_CONTROL_COMMITMENT_MISSING
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / enrollment_decision_depends_on_protection_inquiry_state
          rationale: "The §1.8 instance drives the enrollment decision against AAI_PENDING, AAI_COMPLETE and the institutional-control commitment flag."

      - name: corner_validation_aai_report_staleness_boundary
        claim_type: temporal_validation
        grounds:
          - validations[26].ERR_AAI_REPORT_STALE
        excluded_because:
          difficulty_instance: boundary_precision_check / aai_report_exactly_one_hundred_eighty_days_old_is_accepted
          rationale: "The §1.8 instance asserts the inclusive 180-day boundary and the 181-day refusal."

