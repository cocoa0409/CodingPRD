                  - { requirement_code: "REQ-ADA", description: "ADA ramp detail compliance", materiality: "MATERIAL", is_waivable: false }
              as: ProcurementOfficer
              as_user_id: "U-OFFICER-1"
              captures: { c_s30_id: $.data.id }
            - call: "POST /procurement/solicitations/${c_s30_id}/issue"
              payload: {}
              as: ProcurementOfficer
              as_user_id: "U-OFFICER-1"
            - call: "GET /procurement/solicitations/${c_s30_id}"
              payload: {}
              as: ProcurementOfficer
              as_user_id: "U-OFFICER-1"
              captures: { c_s30_v: $.data.version }
          trigger:
            - call: "POST /procurement/bids"
              payload: { solicitation_id: "${c_s30_id}", vendor_id: "${c_v62_id}", total_price_cents: 8000000, acknowledged_addendum_sequences: [], expected_solicitation_version: "${c_s30_v}" }
