              as_user_id: "admin_adj_1"
            - { call: "POST /cases/${ch1_id}/refer-expulsion", payload: {}, as: SchoolAdministrator, as_user_id: "admin_adj_1" }
            - call: "POST /students"
              payload: { full_name: "Stu H2", date_of_birth: "2008-05-01T00:00:00Z", grade_level: 11, demographic_group: "BLACK", guardian_id: "gh2" }
              as: SchoolAdministrator
              captures: { sh2_id: $.data.id }
            - call: "POST /cases"
              payload: { student_id: "${sh2_id}", incident_date: "2026-05-02T00:00:00Z", description: "H2 case" }
