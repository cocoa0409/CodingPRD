        distinguishing_aspect: "A batch whose period holds no OPEN lines still prepares successfully — it computes a due_date and reaches PREPARED with line_count 0 — and only submit refuses it 409 ERR_BATCH_EMPTY. The empty-set edge is therefore visible on the batch row, not swallowed at prepare."
