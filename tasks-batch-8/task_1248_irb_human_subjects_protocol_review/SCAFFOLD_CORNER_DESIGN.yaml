      - name: clock_set_echoes_time_and_reports_zero_sweeps
        claim_type: test_driving_endpoint
        grounds: ["endpoints[POST /_clock/set_current_utc]"]
        distinguishing_aspect: "The logical clock endpoint echoes the new time and reports per-sweep counters; on an empty-ish DB (no CRs, meetings, or offers) all sweep counters are 0. The startup default before any call is 2026-05-01T00:00:00Z (a meeting scheduled before that instant is rejected — see meeting_scheduled_in_past_rejected)."
        test_recipe:
          setup: ["One investigator anchor; no CRs, meetings, or assignments"]
          setup_api_calls:
            - call: "POST /irb/investigators"
              payload: { full_name: "Dr Clock", email: "clock@univ.edu", department: "Math", training_expires_at: "2027-01-01T00:00:00Z" }
              as: IrbAdmin
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T00:00:00Z" }
              as: IrbAdmin
              captures: { now: $.data.current_utc, lapsed: $.data.lapsed_continuing_reviews }
          assert:
            - "Response data.current_utc == 2026-05-10T00:00:00Z"
            - "lapsed_continuing_reviews == 0, failed_quorum_meetings == 0, expired_assignments == 0"

