  - rule_id: compensating_invariant
    instances:

      - name: net_approved_ledger_survives_second_lost_chargeback
        grounds:
          - calculations.ledger_invariants
          - calculations.guarantee_liability_evaluation
          - entities.Customer.fields.lifetime_net_approved_cents
          - entities.Customer.fields.confirmed_fraud_count
          - state_machines.ChargebackRecord.RECEIVED_to_LOST
        distinguishing_aspect: |
          The MONETARY invariant (Invariant A) under a double-reversal attack: a
          second LOST FRAUD_CNP chargeback on an assessment already labelled FRAUD
          must move neither lifetime_net_approved_cents nor confirmed_fraud_count,
          while still running its own guarantee waterfall. Without the
          UNKNOWN -> FRAUD idempotence guard the ledger drifts to 0 and the count to 2.
        test_recipe:
          setup:
            - "BOOT-W is in place; two 15000-cent orders (A1, A2) were machine-approved, so lifetime_net_approved_cents is 30000 and approved_count is 2."
            - "A first FRAUD_CNP chargeback of 5000 on A1 was LOST, flipping A1.outcome_label to FRAUD, reversing the full 15000 assessment amount and setting confirmed_fraud_count to 1."
            - "A second FRAUD_CNP chargeback of 5000 on the SAME assessment A1 is sitting in RECEIVED."
          setup_api_calls:
            - call: "POST /fraud/customers"
              payload: { email: "ledger@example.com", home_country: "US", tier: "STANDARD" }
              as: CheckoutService
              captures: { cust_id: $.data.id }
