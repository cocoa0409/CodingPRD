          - errors.ERR_TA_PREREQUISITE_UNMET
          - entities.LoanProduct.fields.requires_ta_completion
        distinguishing_aspect: |
          The prerequisite needs BOTH state COMPLETED and competency_verified true, and it is
          checked at approval - not at underwriting - so the loan is already priced when the
          first APPROVE is refused 409. The engagement closed afterwards unblocks the approval
          without repricing: ta_discount_bps stays 0 and final_rate_bps stays 900, because the
          discount reads ta_hours_total as of the underwriting request.
