        distinguishing_aspect: "Rejection is not a no-op on the product: it drops release_status from QUALIFICATION back to DEVELOPMENT, leaves tool_life_index null, leaves the pilot grade unpromoted, and forces a brand-new dossier because the rejected one is terminal."
