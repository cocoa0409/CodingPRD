  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: assembly_run_rework_cycle_delta_commit
        grounds:
          - state_machines.AssemblyRun.KITTED_to_KITTING
          - state_machines.AssemblyRun.KITTING_to_KITTED
          - entities.AssemblyRun.fields.kitted_box_count
        distinguishing_aspect: |
          Cyclic shape on AssemblyRun: KITTING -> KITTED -> KITTING -> KITTED.
          The second completion commits only the positive delta (1 more unit),
          so on_hand drops 500 -> 498 -> 497 rather than 500 -> 498 -> 495, and
          the first completion's excess-cancelled shipment stays CANCELLED.
        test_recipe:
          setup:
            - "client NL1 wallet 100000; component CMP-NL1 500 units (BOM qty 1); plan PL-NL1 ACTIVE price 1000 weight 1000"
            - "3 ACTIVE subscribers (zone 2); run 2026-05 LOCKED (planned 3) -> KITTING -> KITTED with actual 2 (1 QUEUED shipment excess-cancelled; on_hand 498, reserved 0)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /clients"
              payload: { name: "NL1 Client", billing_email: "nl1@acme.test" }
              as: PlatformAdmin
              captures: { nl1_cl: $.data.id }
            - { call: "POST /clients/${nl1_cl}/credit-adjustments", payload: { amount_cents: 100000, reason: "seed" }, as: BillingAdmin }
            - call: "POST /components"
              payload: { sku: "CMP-NL1", name: "NL1 widget", unit_cost_cents: 100, reorder_point_units: 0 }
              as: WarehouseOps
              captures: { nl1_cp: $.data.id, nl1_cp_v: $.data.version }
            - { call: "POST /components/${nl1_cp}/receipts", payload: { quantity: 500, expected_component_version: "${nl1_cp_v}" }, as: WarehouseOps }
            - call: "POST /box-plans"
              payload: { client_id: "${nl1_cl}", name: "NL1 Box", sku: "PL-NL1", price_per_box_cents: 1000, shipping_weight_grams: 1000 }
              as: ClientOps
              as_user_id: "${nl1_cl}"
              captures: { nl1_pl: $.data.id, nl1_pl_v: $.data.version }
            - call: "POST /box-plans/${nl1_pl}/kit-revisions"
              payload: { expected_box_plan_version: "${nl1_pl_v}" }
              as: ClientOps
              as_user_id: "${nl1_cl}"
              captures: { nl1_rv: $.data.id }
            - call: "PUT /kit-revisions/${nl1_rv}/bom-lines"
              payload: { lines: [{ component_id: "${nl1_cp}", qty_per_box: 1 }] }
              as: ClientOps
              as_user_id: "${nl1_cl}"
            - { call: "POST /kit-revisions/${nl1_rv}/approve", as: ClientOps, as_user_id: "${nl1_cl}" }
            - { call: "POST /box-plans/${nl1_pl}/activate", as: ClientOps, as_user_id: "${nl1_cl}" }
            - call: "POST /box-plans/${nl1_pl}/import-batches"
              payload: { rows: [{ email: "nl1a@x.test", zone: 2 }, { email: "nl1b@x.test", zone: 2 }, { email: "nl1c@x.test", zone: 2 }] }
              as: ClientOps
              as_user_id: "${nl1_cl}"
              captures: { nl1_ib: $.data.id }
            - { call: "POST /import-batches/${nl1_ib}/commit", as: ClientOps, as_user_id: "${nl1_cl}" }
            - call: "POST /assembly-runs"
              payload: { plan_id: "${nl1_pl}", period: "2026-05" }
              as: WarehouseOps
              captures: { nl1_rn: $.data.id }
            - { call: "POST /assembly-runs/${nl1_rn}/lock", as: WarehouseOps }
            - { call: "POST /assembly-runs/${nl1_rn}/start-kitting", as: WarehouseOps }
            - { call: "POST /assembly-runs/${nl1_rn}/complete-kitting", payload: { actual_kitted_count: 2 }, as: WarehouseOps }
            - call: "GET /components/${nl1_cp}"
              as: WarehouseOps
              captures: { nl1_onhand_mid: $.data.on_hand_units, nl1_resv_mid: $.data.reserved_units }
          trigger:
            - call: "POST /assembly-runs/${nl1_rn}/rework"
              payload: { note: "found 1 kitting miss; reworking" }
              as: WarehouseOps
              captures: { nl1_status_rw: $.data.status }
            - { call: "POST /assembly-runs/${nl1_rn}/complete-kitting", payload: { actual_kitted_count: 3 }, as: WarehouseOps }
            - call: "GET /assembly-runs/${nl1_rn}"
              as: WarehouseOps
              captures: { nl1_status_post: $.data.status, nl1_kitted_post: $.data.kitted_box_count }
            - call: "GET /components/${nl1_cp}"
              as: WarehouseOps
              captures: { nl1_onhand_post: $.data.on_hand_units, nl1_resv_post: $.data.reserved_units }
            - call: "GET /assembly-runs/${nl1_rn}/shipments"
              payload: { fulfill_status: "CANCELLED" }
              as: WarehouseOps
              captures: { nl1_cx_id: "$.data[0].id" }
          assert:
            - "rework response status (${nl1_status_rw}) == KITTING (cycle KITTED -> KITTING)"
            - "mid-rework Component on_hand was 498 and reserved_units was 0 (commit 2, release 1 at first completion)"
            - "post-recomplete AssemblyRun.${nl1_rn}.status == KITTED and kitted_box_count == 3"
            - "Component.${nl1_cp}.on_hand_units == 497 (delta commit of exactly 1, not 3) and reserved_units == 0"
            - "exactly one shipment of the run is CANCELLED (excess selection never un-cancels)"

      - name: shipment_parallel_dimensions_independent
        grounds:
          - state_machines.Shipment.MANIFESTED_to_MANIFESTED
          - state_machines.Shipment.SHIPPED_to_DELIVERED
          - entities.Shipment.fields.label_status
          - entities.Shipment.fields.fulfill_status
        distinguishing_aspect: |
          Parallel state dimensions on Shipment (a different entity and a
          different non-linear shape than the AssemblyRun rework cycle): the
          label dimension flips PURCHASED -> VOIDED while fulfill_status stays
          MANIFESTED, then the fulfill dimension advances SHIPPED -> DELIVERED
          while label_status stays VOIDED.
        test_recipe:
          setup:
            - "client NL2 wallet 100000; component CMP-NL2 10 units (BOM qty 1); plan PL-NL2 ACTIVE price 2000 weight 1200"
            - "1 ACTIVE subscriber zone 3; run 2026-05 KITTED actual 1; shipment STAGED"
            - "wave USPS GROUND 2026-05-10T10:00:00Z-12:00:00Z; shipment assigned and manifested (postage 485, label PURCHASED)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /clients"
              payload: { name: "NL2 Client", billing_email: "nl2@acme.test" }
              as: PlatformAdmin
              captures: { nl2_cl: $.data.id }
            - { call: "POST /clients/${nl2_cl}/credit-adjustments", payload: { amount_cents: 100000, reason: "seed" }, as: BillingAdmin }
            - call: "POST /components"
              payload: { sku: "CMP-NL2", name: "NL2 widget", unit_cost_cents: 100, reorder_point_units: 0 }
              as: WarehouseOps
              captures: { nl2_cp: $.data.id, nl2_cp_v: $.data.version }
            - { call: "POST /components/${nl2_cp}/receipts", payload: { quantity: 10, expected_component_version: "${nl2_cp_v}" }, as: WarehouseOps }
            - call: "POST /box-plans"
              payload: { client_id: "${nl2_cl}", name: "NL2 Box", sku: "PL-NL2", price_per_box_cents: 2000, shipping_weight_grams: 1200 }
              as: ClientOps
              as_user_id: "${nl2_cl}"
              captures: { nl2_pl: $.data.id, nl2_pl_v: $.data.version }
            - call: "POST /box-plans/${nl2_pl}/kit-revisions"
              payload: { expected_box_plan_version: "${nl2_pl_v}" }
              as: ClientOps
              as_user_id: "${nl2_cl}"
              captures: { nl2_rv: $.data.id }
            - call: "PUT /kit-revisions/${nl2_rv}/bom-lines"
              payload: { lines: [{ component_id: "${nl2_cp}", qty_per_box: 1 }] }
              as: ClientOps
              as_user_id: "${nl2_cl}"
            - { call: "POST /kit-revisions/${nl2_rv}/approve", as: ClientOps, as_user_id: "${nl2_cl}" }
            - { call: "POST /box-plans/${nl2_pl}/activate", as: ClientOps, as_user_id: "${nl2_cl}" }
            - call: "POST /box-plans/${nl2_pl}/import-batches"
              payload: { rows: [{ email: "nl2a@x.test", zone: 3 }] }
              as: ClientOps
              as_user_id: "${nl2_cl}"
              captures: { nl2_ib: $.data.id }
            - { call: "POST /import-batches/${nl2_ib}/commit", as: ClientOps, as_user_id: "${nl2_cl}" }
            - call: "POST /assembly-runs"
              payload: { plan_id: "${nl2_pl}", period: "2026-05" }
              as: WarehouseOps
              captures: { nl2_rn: $.data.id }
            - { call: "POST /assembly-runs/${nl2_rn}/lock", as: WarehouseOps }
            - { call: "POST /assembly-runs/${nl2_rn}/start-kitting", as: WarehouseOps }
            - { call: "POST /assembly-runs/${nl2_rn}/complete-kitting", payload: { actual_kitted_count: 1 }, as: WarehouseOps }
            - call: "GET /assembly-runs/${nl2_rn}/shipments"
              as: WarehouseOps
              captures: { nl2_sh: "$.data[0].id" }
            - call: "POST /shipping-waves"
              payload: { carrier: "USPS", service_level: "GROUND", pickup_start: "2026-05-10T10:00:00Z", pickup_end: "2026-05-10T12:00:00Z" }
              as: WarehouseOps
              captures: { nl2_wv: $.data.id }
            - { call: "POST /shipping-waves/${nl2_wv}/assign-shipments", payload: { shipment_ids: ["${nl2_sh}"] }, as: WarehouseOps }
            - { call: "POST /shipping-waves/${nl2_wv}/manifest", as: WarehouseOps }
          trigger:
            - call: "POST /shipments/${nl2_sh}/void-label"
              as: WarehouseOps
              captures: { nl2_lbl_void: $.data.label_status, nl2_ful_void: $.data.fulfill_status, nl2_post_void: $.data.postage_cents }
            - { call: "POST /shipping-waves/${nl2_wv}/tender", as: WarehouseOps }
            - { call: "POST /shipments/${nl2_sh}/scan", payload: { scan_type: "DELIVERED" }, as: WarehouseOps }
            - call: "GET /shipments/${nl2_sh}"
              as: WarehouseOps
              captures: { nl2_lbl_end: $.data.label_status, nl2_ful_end: $.data.fulfill_status }
          assert:
            - "after void-label: label_status == VOIDED while fulfill_status == MANIFESTED (label dim moved alone) and postage_cents == 485 kept for audit"
            - "after tender + scan: fulfill_status == DELIVERED while label_status == VOIDED (fulfill dim moved alone)"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: return_replace_cascade_to_component_posture
        grounds:
          - state_machines.ReturnCase.RECEIVED_to_RESOLVED
          - entities.InventoryEvent
          - entities.Component.fields.stock_status
        distinguishing_aspect: |
          Depth-3 cascade triggered by return resolve(REPLACE):
          ReturnCase RESOLVED -> replacement Shipment created -> COMMIT
          InventoryEvents appended -> Component on_hand/available recomputed and
          stock_status flips OK -> LOW (96 -> 94 crosses reorder_point 95).
          Different trigger from the wave-cancel cascade.
        test_recipe:
          setup:
            - "client TC1 wallet 100000; component CMP-TC1 receipt 100, reorder_point 95, BOM qty_per_box 2; plan PL-TC1 ACTIVE price 2000 weight 1000"
            - "2 ACTIVE subscribers zone 2; run 2026-05 LOCKED (reserve 4; available 96) -> KITTING -> KITTED actual 2 (commit 4; on_hand 96; stock_status OK)"
            - "shipment 1 delivered via USPS GROUND wave (assign -> manifest -> tender -> scan DELIVERED); shipment 2 remains STAGED"
            - "return case opened (REPLACE), approved, received; clock inside the 30-day window"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /clients"
              payload: { name: "TC1 Client", billing_email: "tc1@acme.test" }
              as: PlatformAdmin
              captures: { tc1_cl: $.data.id }
            - { call: "POST /clients/${tc1_cl}/credit-adjustments", payload: { amount_cents: 100000, reason: "seed" }, as: BillingAdmin }
            - call: "POST /components"
              payload: { sku: "CMP-TC1", name: "TC1 widget", unit_cost_cents: 100, reorder_point_units: 95 }
              as: WarehouseOps
              captures: { tc1_cp: $.data.id, tc1_cp_v: $.data.version }
            - { call: "POST /components/${tc1_cp}/receipts", payload: { quantity: 100, expected_component_version: "${tc1_cp_v}" }, as: WarehouseOps }
            - call: "POST /box-plans"
              payload: { client_id: "${tc1_cl}", name: "TC1 Box", sku: "PL-TC1", price_per_box_cents: 2000, shipping_weight_grams: 1000 }
              as: ClientOps
              as_user_id: "${tc1_cl}"
              captures: { tc1_pl: $.data.id, tc1_pl_v: $.data.version }
            - call: "POST /box-plans/${tc1_pl}/kit-revisions"
              payload: { expected_box_plan_version: "${tc1_pl_v}" }
              as: ClientOps
              as_user_id: "${tc1_cl}"
              captures: { tc1_rv: $.data.id }
            - call: "PUT /kit-revisions/${tc1_rv}/bom-lines"
              payload: { lines: [{ component_id: "${tc1_cp}", qty_per_box: 2 }] }
              as: ClientOps
              as_user_id: "${tc1_cl}"
