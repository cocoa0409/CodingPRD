  # ===========================================================================
  - section: calculations
    instances:

      - name: corner_hedge_rebalance_caps_hedged_share_at_the_full_ratio
        claim_type: Constants Applied
        grounds:
          - calculations.guarantee_hedge_rebalance
          - entities.PriceFreeze.fields.unhedged_exposure_cents
          - entities.Route.fields.hedge_ratio_pct
        distinguishing_aspect: "Exposure of 1100 at a 0.60 hedge ratio splits into exactly 660 hedged and 440 unhedged, and the unhedged slice is capped by the guarantee ceiling rather than by the overshoot."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Route R1 with hedge_ratio_pct 0.60, itinerary I1, freeze F1 frozen against the route high-water mark of 8236 so that a 10000 observation produces an overshoot of 1100."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fare/routes"
              payload: { origin_airport: "SFO", destination_airport: "JFK", flight_number: "HA101", region: "WEST", base_fare_cents: 8236, fare_band_cents: [7000, 8000, 9000, 10000, 11000], peak_price_day_index: 4, seats_left: 9, hedge_ratio_pct: 0.6, disclosure_headline: "d" }
              as: PlatformAdmin
              captures: { r1_id: $.data.id }
            - call: "POST /fare/itineraries"
              payload: { route_id: "${r1_id}", departure_date: "2026-10-01T00:00:00Z", traveler_user_id: "tv-mara" }
              as: Traveler
              captures: { i1_id: $.data.id, i1_version: $.data.version }
            - call: "PATCH /fare/routes/${r1_id}"
              payload: { base_fare_cents: 8900 }
              as: PlatformAdmin
            - call: "POST /fare/itineraries/${i1_id}/price-freezes"
              payload: { deposit_cents: 250, disclosure_version: 1, disclosure_acknowledged: true, expected_itinerary_version: "${i1_version}" }
              as: Traveler
              as_user_id: "tv-mara"
              captures: { f1_id: $.data.id, f1_version: $.data.version }
            - call: "POST /fare/price-freezes/${f1_id}/activations"
              payload: { expected_freeze_version: "${f1_version}" }
              as: Traveler
              as_user_id: "tv-mara"
              captures: { f1_v2: $.data.version }
            - call: "POST /fare/price-freezes/${f1_id}/activations"
              payload: { expected_freeze_version: "${f1_v2}" }
              as: Traveler
              as_user_id: "tv-mara"
          trigger:
            - call: "POST /fare/price-observations"
              payload: { route_id: "${r1_id}", itinerary_id: "${i1_id}", fare_cents: 10000, seats_left: 6 }
              as: OpsAgent
          assert:
            - "PriceFreeze.${f1_id}.overshoot_cents == 1100 and capped_impact_cents == 1320.00"
            - "PriceFreeze.${f1_id}.exposure_cents == 1100"
            - "PriceFreeze.${f1_id}.hedged_exposure_cents == 660.00 and unhedged_exposure_cents == 440.00"
            - "Route.${r1_id}.reserved_exposure_cents == 1320.00, so the reservation follows the capped impact rather than the overshoot"

      - name: corner_depth_ratio_and_continuum_absorption_are_lossless_within_the_ceiling
        claim_type: Correct Result
        grounds:
          - calculations.product_continuum_rating
          - entities.GuaranteeClaim.fields.depth_ratio
          - entities.GuaranteeClaim.fields.continuum_absorbed_cents
        distinguishing_aspect: "Within the guarantee ceiling the bounded continuum term absorbs exactly capped_impact divided by 1.25, and it grows superlinearly once the depth ratio exceeds 1."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Route R1 with hedge_ratio_pct 0.60, itinerary I1, freeze F1 frozen against the route high-water mark of 8236, a 10000 observation, a CANCELLATION protection P1 carrying the freeze, and a 22800 observation."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fare/routes"
              payload: { origin_airport: "SFO", destination_airport: "JFK", flight_number: "HA101", region: "WEST", base_fare_cents: 8236, fare_band_cents: [7000, 8000, 9000, 10000, 11000], peak_price_day_index: 4, seats_left: 9, hedge_ratio_pct: 0.6, disclosure_headline: "d" }
              as: PlatformAdmin
              captures: { r1_id: $.data.id }
            - call: "POST /fare/itineraries"
              payload: { route_id: "${r1_id}", departure_date: "2026-10-01T00:00:00Z", traveler_user_id: "tv-mara" }
              as: Traveler
              captures: { i1_id: $.data.id, i1_version: $.data.version }
            - call: "PATCH /fare/routes/${r1_id}"
              payload: { base_fare_cents: 8900 }
              as: PlatformAdmin
            - call: "POST /fare/itineraries/${i1_id}/price-freezes"
              payload: { deposit_cents: 250, disclosure_version: 1, disclosure_acknowledged: true, expected_itinerary_version: "${i1_version}" }
              as: Traveler
              as_user_id: "tv-mara"
              captures: { f1_id: $.data.id, f1_version: $.data.version }
            - call: "POST /fare/price-freezes/${f1_id}/activations"
              payload: { expected_freeze_version: "${f1_version}" }
              as: Traveler
              as_user_id: "tv-mara"
              captures: { f1_v2: $.data.version }
            - call: "POST /fare/price-freezes/${f1_id}/activations"
              payload: { expected_freeze_version: "${f1_v2}" }
              as: Traveler
              as_user_id: "tv-mara"
            - call: "POST /fare/price-observations"
              payload: { route_id: "${r1_id}", itinerary_id: "${i1_id}", fare_cents: 10000, seats_left: 6 }
              as: OpsAgent
            - call: "POST /fare/protections"
              payload: { itinerary_id: "${i1_id}", product_type: "CANCELLATION", cancellation_disruption_probability: 0.70, freeze_id: "${f1_id}", disclosure_version: 1, disclosure_acknowledged: true }
              as: Traveler
              as_user_id: "tv-mara"
              captures: { p1_id: $.data.id , p_v: $.data.version }
          trigger:
            - call: "POST /fare/protections/${p1_id}/activations"
              payload: { expected_protection_version: "${p_v}" }
              as: Traveler
              as_user_id: "tv-mara"
            - call: "POST /fare/price-observations"
              payload: { route_id: "${r1_id}", itinerary_id: "${i1_id}", fare_cents: 22800, seats_left: 5 }
              as: OpsAgent
            - call: "POST /fare/claims"
              payload: { freeze_id: "${f1_id}", market_price_cents: 22800 }
              as: Traveler
              as_user_id: "tv-mara"
              captures: { c1_id: $.data.id }
          assert:
            - "the protection's premium at creation equals 205.10 and its activation does not change it"
            - "PriceFreeze.${f1_id}.exposure_cents == 1100 and unhedged_exposure_cents == 440.00, so depth_ratio == 0.4000"
            - "PriceFreeze.${f1_id}.capped_impact_cents == 1320.00 for the 1100 overshoot"
            - "on the later 22800 observation the overshoot saturates at the cap, capped_impact_cents == 14952.00, and GuaranteeClaim.${c1_id}.continuum_absorbed_cents == 11961.60"

      - name: corner_duration_metric_is_free_below_three_days
        claim_type: Constants Applied
        grounds:
          - calculations.protect_change_redemption
          - entities.ChangeEvent.fields.disruption_days
        distinguishing_aspect: "The duration metric consumes nothing for a shift of three days or fewer and then switches to a linear-after-three curve, so a three-day shift and a four-day shift differ by one day rather than three."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Route R2 with CHANGE protection P3 on itinerary I3 and a change event CE1 proposing 2026-12-04T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fare/routes"
              payload: { origin_airport: "ORD", destination_airport: "LHR", flight_number: "HA707", region: "MIDWEST", base_fare_cents: 13200, fare_band_cents: [9000, 12000, 15000, 17000, 19000], peak_price_day_index: 0, seats_left: 6, disclosure_headline: "d" }
              as: PlatformAdmin
              captures: { r2_id: $.data.id }
            - call: "POST /fare/demand-curves"
              payload: { route_id: "${r2_id}", price_date: "2026-09-01T00:00:00Z", each_day_prices_cents: [9000, 9000, 9000, 9000, 9000], seats_left_at_each_day: [6, 6, 6, 6, 6] }
              as: OpsAgent
            - call: "POST /fare/itineraries"
              payload: { route_id: "${r2_id}", departure_date: "2026-12-01T00:00:00Z", traveler_user_id: "tv-otis" }
              as: Traveler
              captures: { i3_id: $.data.id }
            - call: "POST /fare/protections"
              payload: { itinerary_id: "${i3_id}", product_type: "CHANGE", cancellation_disruption_probability: 0.70, disclosure_version: 1, disclosure_acknowledged: true }
              as: Traveler
              as_user_id: "tv-otis"
              captures: { p3_id: $.data.id , p_v: $.data.version }
            - call: "POST /fare/protections/${p3_id}/activations"
              payload: { expected_protection_version: "${p_v}" }
              as: Traveler
              as_user_id: "tv-otis"
          trigger:
            - call: "POST /fare/change-events"
              payload: { protection_id: "${p3_id}", new_departure_date: "2026-12-04T00:00:00Z", gap_direction: "ORIGIN_DIRECTION" }
              as: Traveler
              as_user_id: "tv-otis"
              captures: { ce_id: $.data.id }
            - call: "POST /fare/change-events/${ce_id}/cancellations"
              payload: { cancel_reason: "CHANGED_MIND" }
              as: Traveler
              as_user_id: "tv-otis"
            - call: "POST /fare/change-events"
              payload: { protection_id: "${p3_id}", new_departure_date: "2026-12-06T00:00:00Z", gap_direction: "ORIGIN_DIRECTION" }
              as: Traveler
              as_user_id: "tv-otis"
              captures: { ce2_id: $.data.id }
          assert:
            - "ChangeEvent.${ce_id}.day_shift == 3 and disruption_days == 3"
            - "ChangeEvent.${ce2_id}.day_shift == 5 and disruption_days == 4, so one extra day of shift costs one extra day of entitlement"
            - "ProtectionProduct.${p3_id}.duration_consumed_days == 0 after both events are filed but before any settlement"
            - "ProtectionProduct.${p3_id}.lifecycle_status is back to ACTIVE after the first event is cancelled"

      - name: corner_curve_and_observation_recompute_itinerary_derived_fields
        claim_type: Input Set Filtering
        grounds:
          - calculations.insurance_tier_ceiling
          - entities.Itinerary.fields.fare_tier_ceiling_cents
          - endpoints.GET_/fare/demand-curves
        distinguishing_aspect: "A curve supersession re-derives the itinerary's tier ceiling at the next observation, and the value changes only when the curve price crosses a tier boundary."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Route R1 with itinerary I1 on it, and a curve priced at 8200."
          setup_api_calls:
