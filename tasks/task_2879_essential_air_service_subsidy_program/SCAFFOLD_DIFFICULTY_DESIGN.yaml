              payload: { agreement_id: "${agr1_id}", basis: "STRICT", window_start_month: "2026-08", window_end_month: "2026-08" }
              as: ProgramAdmin
              as_user_id: "admin-reviewer"
              captures: { rev_id: $.data.id }
            - call: "GET /eas/communities/${comm_id}/solicitations"
              payload: { created_reason: "REPLACEMENT" }
              as: ProgramAdmin
              captures: { rep_sol_id: "$.data[0].id" }
          assert:
            - "Level 1 — PerformanceReview.${rev_id}.months_in_window == 1 and included_period_count == 1"
            - "Level 1 — PerformanceReview.${rev_id}.completion_factor == 0.8173 and tier == DEFICIENT"
            - "Level 1 — PerformanceReview.${rev_id}.seat_fulfillment == 0.8173, load_factor == 0.3591, quality_score == 83.13"
            - "Level 1 — PerformanceReview.${rev_id}.action_taken == AGREEMENT_SUSPENDED_AND_HOLD_IN"
            - "Level 2 — Carrier.${car1_id}.status == SUSPENDED, latest_performance_tier == DEFICIENT, latest_completion_factor == 0.8173, latest_quality_score == 83.13, consecutive_watch_count == 0"
            - "Level 3 — ServiceAgreement.${agr1_id}.status == SUSPENDED with terminated_at still null"
            - "Level 4 — Community.${comm_id}.status == HOLD_IN and active_agreement_count == 0"
            - "Level 5 — Solicitation.${rep_sol_id}.created_reason == REPLACEMENT, status == OPEN, closes_at == 2026-09-30T00:00:00Z"
