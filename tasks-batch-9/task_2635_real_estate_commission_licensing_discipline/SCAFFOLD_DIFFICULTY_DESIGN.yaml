              as: RecoveryFundTrustee
            - call: "POST /commission/sanction-orders/${so_id}/fine-payments"
              payload: { amount_cents: 500000, paid_on: "2026-08-05" }
              as: Respondent
              as_user_id: "${rae_id}"
            - call: "POST /commission/sanction-orders/${so_id}/recovery-claims"
              payload: { claimant_name: "Ora Buyer", claimed_loss_cents: 2500000 }
              as: Public
              captures: { claim1_id: $.data.id }
            - call: "POST /commission/sanction-orders/${so_id}/recovery-claims"
              payload: { claimant_name: "Pia Client", claimed_loss_cents: 1000000 }
              as: Public
              captures: { claim2_id: $.data.id }
            - call: "GET /commission/recovery-fund"
              payload: {}
              as: RecoveryFundTrustee
              captures: { rf_v1: $.data.version }
            - call: "POST /commission/recovery-fund/disbursements"
              payload: { sanction_order_id: "${so_id}", expected_recovery_fund_version: "${rf_v1}" }
              as: RecoveryFundTrustee
            - call: "POST /commission/sanction-orders/${so_id}/recovery-claims"
              payload: { claimant_name: "Quinn Late", claimed_loss_cents: 300000 }
              as: Public
              captures: { claim3_id: $.data.id }
          trigger:
            - call: "POST /commission/sanction-orders/${so_id}/vacatur"
              payload: { vacatur_reason: "reconsideration granted on new evidence" }
              as: HearingPanelChair
              as_user_id: "chair-02"
          assert:
            - "before the vacatur the identity holds: RecoveryFund.balance_cents == 501160 == 2900000 appropriated + 500000 fine_credits + 0 clawed_back - 2842000 awarded - 56840 assessment"
            - "the vacatur returns 200 with SanctionOrder.${so_id}.status == VACATED, vacated_at == 2026-08-05T09:00:00Z, fine_paid_cents == 0 and fund_credited_cents == 0"
            - "COMPENSATION 1: RecoveryFund.fine_credits_cents == 0 (the 500000 fine credit is reversed out of the balance)"
            - "COMPENSATION 2: RecoveryFundClaim.${claim1_id}.status == CLAWED_BACK with awarded_cents == 0 and RecoveryFundClaim.${claim2_id}.status == CLAWED_BACK with awarded_cents == 0, and RecoveryFund.clawed_back_cents == 2842000"
            - "COMPENSATION 3: RecoveryFundClaim.${claim3_id}.status == DENIED with denial_reason == ORDER_VACATED and awarded_cents == 0"
            - "RecoveryFund.awarded_cents stays 2842000 and RecoveryFund.assessment_cents stays 56840 - the lifetime counters are never rewritten, only offset by clawed_back_cents"
            - "RecoveryFund.balance_cents == 2843160 == 2900000 + 0 + 2842000 - 2842000 - 56840: the identity is restored exactly while the balance is 56840 short of the pre-disbursement 2900000, because the assessment is friction that is never refunded"
            - "COMPENSATION 4: Licensee.${rae_id}.license_status == INACTIVE (a revocation unwinds to INACTIVE, never straight back to ACTIVE) with inactive_since == 2026-08-05T09:00:00Z, and discipline_status == CLEARED"
            - "COMPENSATION 5: Licensee.${rae_id}.recovery_paid_cents == 0 and prior_sanction_count == 0 - a VACATED order is excluded from both counters"
            - "Brokerage.${bkg_id}.supervision_posture is recomputed and lands on COMPLIANT (open_shortage_cents 0, open_complaint_count 0, designated broker ${br_id} still ACTIVE), i.e. the posture too is compensated back to its pre-order value"
            - "Complaint.${c_id}.status stays ADJUDICATED - the vacatur compensates money and licence state, not the adjudication record"
      - name: trust_ledger_correction_restores_book_available_and_the_posture_without_mutating_a_row
        grounds:
          - calculations.trust_account_shortage
          - validations[priority=27]
          - errors.ERR_CORRECTION_TARGET_NOT_FOUND
          - entities.TrustLedgerEntry.fields.transaction_reference
          - entities.TrustAccount.fields.book_available_cents
        distinguishing_aspect: |
          A different conserved quantity - the trust account's book position, where
          book_obligation_cents - book_available_cents must equal shortage_cents at all times - and a
          different compensation mechanism: the ledger is append-only, so the reversal is a new
          CORRECTION row that must carry the same transaction_reference as the DISBURSEMENT it undoes.
          The offending row is never edited or deleted, and a CORRECTION that names no existing
          DISBURSEMENT is refused, so the compensation cannot be forged.
        test_recipe:
          setup:
            - "Harbor Realty Group is ACTIVE with designated broker Dana Broker and escrow account TA"
            - "TA holds an OBLIGATION_OPENED of 800000 cents and a cleared DEPOSIT of 800000 cents, so book_available_cents == 800000, shortage_cents == 0 and the posture is COMPLIANT"
          setup_api_calls:
            - call: "POST /commission/licensees"
              payload: { person_type: "BROKER", full_name: "Dana Broker", prelicense_hours: 180 }
              as: LicensingAnalyst
              captures: { br_id: $.data.id }
            - call: "POST /commission/licensees/${br_id}/exam-results"
              payload: { score: 88, taken_on: "2026-07-01" }
              as: LicensingAnalyst
            - call: "POST /commission/brokerages"
              payload: { name: "Harbor Realty Group", designated_broker_id: "${br_id}", trust_account_required: true, record_retention_years: 5 }
              as: LicensingAnalyst
              captures: { bkg_id: $.data.id }
            - call: "POST /commission/brokerages/${bkg_id}/trust-accounts"
              payload: { bank_name: "Seaside Bank", account_type: "ESCROW" }
              as: LicensingAnalyst
              captures: { ta_id: $.data.id, ta_v0: $.data.version }
            - call: "POST /commission/brokerages/${bkg_id}/activation"
              payload: { attestation_note: "escrow account opened" }
              as: LicensingAnalyst
              captures: { bkg_v1: $.data.version }
            - call: "POST /commission/licensees/${br_id}/affiliations"
              payload: { brokerage_id: "${bkg_id}", supervising_broker_id: "${br_id}", expected_brokerage_version: "${bkg_v1}" }
              as: LicensingAnalyst
            - call: "POST /commission/trust-accounts/${ta_id}/ledger-entries"
              payload: { entry_type: "OBLIGATION_OPENED", amount_cents: 800000, effective_date: "2026-08-01", transaction_reference: "OBL-77", expected_trust_account_version: "${ta_v0}" }
              as: Broker
              as_user_id: "${br_id}"
            - call: "GET /commission/trust-accounts/${ta_id}"
              payload: {}
              as: LicensingAnalyst
              captures: { ta_v1: $.data.version }
            - call: "POST /commission/trust-accounts/${ta_id}/ledger-entries"
              payload: { entry_type: "DEPOSIT", amount_cents: 800000, effective_date: "2026-08-01", cleared_date: "2026-08-01", transaction_reference: "DEP-77", expected_trust_account_version: "${ta_v1}" }
              as: Broker
              as_user_id: "${br_id}"
          trigger:
            - call: "GET /commission/trust-accounts/${ta_id}"
              payload: {}
              as: LicensingAnalyst
              captures: { ta_v2: $.data.version }
            - call: "POST /commission/trust-accounts/${ta_id}/ledger-entries"
              payload: { entry_type: "DISBURSEMENT", amount_cents: 150000, effective_date: "2026-08-02", cleared_date: "2026-08-02", transaction_reference: "DIS-77", memo: "paid to the wrong payee", expected_trust_account_version: "${ta_v2}" }
              as: Broker
              as_user_id: "${br_id}"
              captures: { dis_id: $.data.id }
            - call: "GET /commission/trust-accounts/${ta_id}"
              payload: {}
              as: LicensingAnalyst
              captures: { ta_v3: $.data.version }
            - call: "POST /commission/trust-accounts/${ta_id}/ledger-entries"
              payload: { entry_type: "CORRECTION", amount_cents: 150000, effective_date: "2026-08-03", cleared_date: "2026-08-03", transaction_reference: "DIS-99", memo: "forged compensation", expected_trust_account_version: "${ta_v3}" }
              as: Broker
              as_user_id: "${br_id}"
            - call: "POST /commission/trust-accounts/${ta_id}/ledger-entries"
              payload: { entry_type: "CORRECTION", amount_cents: 150000, effective_date: "2026-08-03", cleared_date: "2026-08-03", transaction_reference: "DIS-77", memo: "funds recovered from the payee", expected_trust_account_version: "${ta_v3}" }
              as: Broker
              as_user_id: "${br_id}"
              captures: { cor_id: $.data.id }
          assert:
            - "the DISBURSEMENT returns 201 and drives the account short: TrustAccount.${ta_id}.book_obligation_cents == 800000, book_available_cents == 650000, shortage_cents == 150000, and because 150000 >= RESTRICTED_SHORTAGE_CENTS the Brokerage.${bkg_id}.supervision_posture becomes RESTRICTED while TrustAccount.status stays OPEN (only an audit remediation order can restrict the account itself)"
            - "the CORRECTION naming DIS-99 returns 422 ERR_CORRECTION_TARGET_NOT_FOUND - no DISBURSEMENT on this account carries that transaction_reference"
            - "the CORRECTION naming DIS-77 returns 201 with TrustLedgerEntry.${cor_id}.entry_type == CORRECTION and amount_cents == 150000"
            - "TrustAccount.${ta_id}.book_available_cents == 800000 and shortage_cents == 0 again, and the invariant book_obligation_cents - book_available_cents == shortage_cents holds at 800000 - 800000 == 0"
            - "Brokerage.${bkg_id}.open_shortage_cents == 0 and supervision_posture == COMPLIANT again"
            - "the compensation left the original row untouched: TrustLedgerEntry.${dis_id}.amount_cents is still 150000 and entry_type is still DISBURSEMENT, and GET /commission/trust-accounts/${ta_id}/ledger-entries returns four rows in created_at ASC order"
            - "TrustLedgerEntry rows expose no version field and no update endpoint - the only legal reversal is the additional CORRECTION row"
