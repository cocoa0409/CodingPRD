          auth_id: $.data.id
      - call: POST /api/prior-authorizations/${auth_id}/approve
        payload:
          max_administrations: 4
        as: MedicalPolicyOfficer
        captures:
          auth_v_after_approve: $.data.version
      trigger:
      - call: POST /api/claims
        payload:
          auth_id: ${auth_id}
          drug_id: ${drug_id}
          service_date: '2026-08-01'
          site_of_care: OFFICE
          sourcing_path: BUY_AND_BILL
          j_code_billed: J7500
          billed_units: 10
        as: ProviderRep
        as_user_id: ${prov_id}
        captures:
          claim_id: $.data.id
          claim_v1: $.data.version
      - call: POST /api/claims/${claim_id}/pay
        payload: {}
        as: PlanAdmin
        captures:
          claim_v2: $.data.version
      assert:
      - Claim version == 1 at create (single adjudicated write), == 2 after pay (exactly +1 per mutation)
      - Auth version advanced by the approval and again by the claim's administration debit (cascade mutations refresh updated_at and bump version)
      - updated_at refreshes on every mutation
  - name: biosimilar_policy_expires_via_clock
    claim_type: valid_transition
    grounds:
    - state_machines.BiosimilarPolicy.ACTIVE_to_EXPIRED
    distinguishing_aspect: An ACTIVE policy whose effective_end is reached by the logical clock becomes EXPIRED; incentive no longer applies to
      claims priced after expiry.
    test_recipe:
      setup:
      - Reference + biosimilar drug; policy ACTIVE with window [2026-08-01, 2026-09-01)
      setup_api_calls:
      - call: POST /api/drugs
        payload:
          j_code: J7600
          drug_name: RefExp
          billing_unit_mg: 10
          vial_size_mg: 100
          single_dose_vial: true
          sourcing_rule: EITHER
          dose_rounding_mode: VIAL
          max_single_dose_mg: 2000
          site_of_care_eligible: false
        as: PlanAdmin
        captures:
          ref_id: $.data.id
      - call: POST /api/drugs
        payload:
          j_code: J7601
          drug_name: BioExp
          billing_unit_mg: 10
          vial_size_mg: 100
          single_dose_vial: true
          sourcing_rule: EITHER
          dose_rounding_mode: VIAL
          max_single_dose_mg: 2000
          site_of_care_eligible: false
        as: PlanAdmin
        captures:
          bio_id: $.data.id
      - call: POST /api/biosimilar-policies
        payload:
          reference_drug_id: ${ref_id}
          biosimilar_drug_id: ${bio_id}
          provider_incentive_addon_pct: 0.02
          member_copay_waiver_pct: 0.5
          effective_start: '2026-08-01'
          effective_end: '2026-09-01'
        as: PlanAdmin
        captures:
          pol_id: $.data.id
      - call: POST /api/biosimilar-policies/${pol_id}/activate
        payload: {}
        as: PlanAdmin
      trigger:
      - call: POST /api/_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: PlanAdmin
      - call: GET /api/biosimilar-policies/${pol_id}
        as: PlanAdmin
        captures:
          pol_status: $.data.status
      assert:
      - 'At clock 2026-09-01 (== effective_end, half-open): policy status == EXPIRED'
- section: consistency_model
  instances:
  - name: immediate_visibility_after_cascade
    claim_type: computed_read
    grounds:
    - complexity_profile
    - calculations.asp_retro_repricing
    distinguishing_aspect: 'Immediate consistency: the retro-reprice cascade triggered by POST /api/asp-schedules is fully visible in the very
      next reads — claim ADJUSTED, adjustment listed, ledger moved, recoupment posture set — with no delay or staleness.'
    test_recipe:
      setup:
      - Drug rate 500 from 2026-01-01; claim 2 units on 2026-07-15 PAID at 1060; provider cumulative 1060
      setup_api_calls:
      - call: POST /api/drugs
        payload:
          j_code: J7700
          drug_name: ImmDrug
          billing_unit_mg: 10
          vial_size_mg: 100
          single_dose_vial: true
          sourcing_rule: EITHER
          dose_rounding_mode: VIAL
          max_single_dose_mg: 2000
          site_of_care_eligible: false
        as: PlanAdmin
        captures:
          drug_id: $.data.id
          drug_ver: $.data.version
      - call: POST /api/asp-schedules
        payload:
          drug_id: ${drug_id}
          effective_start: '2026-01-01'
          asp_rate_cents: 500
        as: PlanAdmin
      - call: POST /api/clinical-policies
        payload:
          drug_id: ${drug_id}
          status: ACTIVE
          expected_drug_version: ${drug_ver}
          covered_diagnoses:
          - C50
          step_therapy_required: false
          requires_site_of_care_redirection: false
          biosimilar_substitution: DISABLED
        as: MedicalPolicyOfficer
      - call: POST /api/provider-accounts
        payload:
          name: Imm Provider
        as: PlanAdmin
        captures:
          prov_id: $.data.id
      - call: POST /api/prior-authorizations
        payload:
          drug_id: ${drug_id}
          member_id: MEM-K1
          diagnosis_code: C50
          requested_start_date: '2026-07-01'
          requested_dose_mg: 100
        as: ProviderRep
        as_user_id: ${prov_id}
        captures:
          auth_id: $.data.id
      - call: POST /api/prior-authorizations/${auth_id}/approve
        payload:
          max_administrations: 4
        as: MedicalPolicyOfficer
      - call: POST /api/claims
        payload:
          auth_id: ${auth_id}
          drug_id: ${drug_id}
          service_date: '2026-07-15'
          site_of_care: HOPD
          sourcing_path: BUY_AND_BILL
          j_code_billed: J7700
          billed_units: 2
        as: ProviderRep
        as_user_id: ${prov_id}
        captures:
          claim_id: $.data.id
      - call: POST /api/claims/${claim_id}/pay
        payload: {}
        as: PlanAdmin
      trigger:
      - call: POST /api/asp-schedules
        payload:
          drug_id: ${drug_id}
          effective_start: '2026-01-01'
          asp_rate_cents: 400
        as: PlanAdmin
        captures:
          sched_lo: $.data.id
      - call: GET /api/claims/${claim_id}
        as: PlanAdmin
        captures:
          c_status: $.data.status
      - call: GET /api/claim-adjustments?claim_id=${claim_id}
        as: PlanAdmin
        captures:
          adj_delta: $.data[0].delta_cents
      - call: GET /api/provider-accounts/${prov_id}
        as: PlanAdmin
        captures:
          p_status: $.data.status
          p_paid: $.data.cumulative_paid_cents
      assert:
      - 'Immediately after the POST: claim status ADJUSTED, allowed 848 (round(2 x 400 x 1.06))'
      - Adjustment listed with delta_cents == -212 and asp_schedule_id == ${sched_lo}
      - Provider cumulative_paid_cents == 848, recoupment_balance_cents == 212, status == RECOUPMENT_HOLD (posture visible in the same read)
      - A further pay attempt on another claim of this provider would fail ERR_PROVIDER_RECOUPMENT_HOLD until settle-recoupment
- section: errors
  instances:
  - name: error_auth_not_approved_on_claim
    claim_type: violation_to_error
    grounds:
    - errors[ERR_AUTH_NOT_APPROVED]
    excluded_because:
      difficulty_instance: claim_gated_by_auth_state
      rationale: Asserted as the failure path of the named §1.8 instance (claim against SUBMITTED auth).
  - name: error_no_active_policy
    claim_type: violation_to_error
    grounds:
    - errors[ERR_NO_ACTIVE_POLICY]
    excluded_because:
      difficulty_instance: approve_gated_by_clinical_policy_state
      rationale: Asserted as the failure path of the named §1.8 instance.
  - name: error_diagnosis_not_covered
    claim_type: violation_to_error
    grounds:
    - errors[ERR_DIAGNOSIS_NOT_COVERED]
    excluded_because:
