    side_effects: []
  - method: GET
    path: "/tdr/evaluations"
    description: "List program evaluations."
    roles: [ProgramAdministrator, SeveranceReviewer, DesignReviewBoard, EasementMonitor, Landowner, Developer]
    code: 200
    input: ["status?", "equity_weighting?", "limit?", "offset?"]
    output: ProgramEvaluation[]
    side_effects: []

  # ---- test-driving surface (declared scaffold contract, /_ namespace) -----
  - method: POST
    path: "/tdr/_clock/set_current_utc"
    description: "Set the server's logical clock. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z — the fixed startup default; it never falls back to real wall-clock time."
    roles: [ProgramAdministrator]
    code: 200
    input: [current_utc]
    output: null
    side_effects: ["every subsequent timestamp, deadline comparison, appraisal-window selection, and reversal-window check reads the new value"]
  - method: POST
    path: "/tdr/_ops/compliance-sweep"
    description: "Run the easement compliance sweep at the current logical clock: escalate every violation whose cure deadline has passed."
    roles: [ProgramAdministrator]
    code: 200
    input: []
    output: null
    side_effects:
      - "every MonitoringInspection in CURE_PENDING whose cure_deadline is strictly before the current logical clock moves to ESCALATED with escalated_at set"
      - "each escalation drives its ConservationEasement to compliance_status ESCALATED and keeps the certificate freeze in place"
      - "increments the version of every ConservationEasement and MonitoringInspection it touches"

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # auth
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID missing/empty, or the role is not one declared in §1.7"
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "the acting role is not listed on the endpoint"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "an entity-backed actor operates on a resource whose owning party FK is a different party"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the certifying operator equals the reviewer who approved the severance, or the cure verifier equals the recording inspector"
  - id: ERR_CHANNEL_ROLE_MISMATCH
    http: 403
    condition: "a bank channel is proposed by a non-administrator, or a PRIVATE channel is proposed by an administrator"

  # existence
  - id: ERR_PARTY_NOT_FOUND
    http: 404
    condition: "the referenced party id does not exist"
  - id: ERR_SENDING_AREA_NOT_FOUND
    http: 404
    condition: "the referenced sending area id does not exist"
  - id: ERR_RECEIVING_AREA_NOT_FOUND
    http: 404
    condition: "the referenced receiving area id does not exist"
  - id: ERR_APPRAISAL_SCHEDULE_NOT_FOUND
    http: 404
    condition: "the referenced appraisal schedule id does not exist"
  - id: ERR_SENDING_PARCEL_NOT_FOUND
    http: 404
    condition: "the referenced sending parcel id does not exist"
  - id: ERR_SEVERANCE_APPLICATION_NOT_FOUND
    http: 404
    condition: "the referenced severance application id does not exist"
  - id: ERR_CONSERVATION_EASEMENT_NOT_FOUND
    http: 404
    condition: "the referenced conservation easement id does not exist"
  - id: ERR_CERTIFICATE_NOT_FOUND
    http: 404
    condition: "the referenced certificate id does not exist"
  - id: ERR_CERTIFICATE_TRANSFER_NOT_FOUND
    http: 404
    condition: "the referenced chain-of-title row id does not exist"
  - id: ERR_MARKET_TRANSACTION_NOT_FOUND
    http: 404
    condition: "the referenced market transaction id does not exist"
  - id: ERR_RECEIVING_SITE_APPLICATION_NOT_FOUND
    http: 404
    condition: "the referenced receiving site application id does not exist"
  - id: ERR_CERTIFICATE_REDEMPTION_NOT_FOUND
    http: 404
    condition: "the referenced certificate redemption id does not exist"
  - id: ERR_MONITORING_INSPECTION_NOT_FOUND
    http: 404
    condition: "the referenced monitoring inspection id does not exist"
  - id: ERR_PROGRAM_EVALUATION_NOT_FOUND
    http: 404
    condition: "the referenced program evaluation id does not exist"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing required field, wrong type, unknown enum value, out-of-range number, malformed date, or an interval whose start is not before its end"

  # state
  - id: ERR_APPLICATION_NOT_SCREENABLE
    http: 409
    condition: "screening a severance application that is not SUBMITTED"
  - id: ERR_APPLICATION_NOT_IN_REVIEW
    http: 409
    condition: "recording a review decision on a severance application that is not UNDER_REVIEW"
  - id: ERR_APPLICATION_NOT_REVISABLE
    http: 409
    condition: "resubmitting a severance application that is not REVISION_REQUESTED"
  - id: ERR_APPLICATION_NOT_APPROVED
    http: 409
    condition: "certifying a severance application that is not APPROVED"
  - id: ERR_DESIGN_REVIEW_STATE_INVALID
    http: 409
    condition: "a design-review decision on an application that is not DESIGN_REVIEW, or a design resubmission on one that is not REVISIONS_REQUIRED"
  - id: ERR_APPLICATION_NOT_DESIGN_APPROVED
    http: 409
    condition: "finalizing an application that is not DESIGN_APPROVED, or allocating a redemption to an application in a terminal state"
  - id: ERR_REDEMPTION_NOT_RELEASABLE
    http: 409
    condition: "releasing a redemption that is already CONFIRMED or RELEASED, or one whose application is FINALIZED"
  - id: ERR_TRANSACTION_NOT_PROPOSED
    http: 409
    condition: "settling or cancelling a market transaction that is not PROPOSED"
  - id: ERR_TRANSACTION_NOT_SETTLED
    http: 409
    condition: "reversing a market transaction that is not SETTLED"
  - id: ERR_CERTIFICATE_NOT_TRANSFERABLE
    http: 409
    condition: "trading, splitting, retiring, or redeeming a certificate that is REDEEMED, RETIRED, or already UNDER_CONTRACT"
  - id: ERR_INSPECTION_NOT_CURABLE
    http: 409
    condition: "verifying a cure on an inspection that is not CURE_PENDING"
  - id: ERR_PARCEL_FULLY_SEVERED
    http: 409
    condition: "filing a severance application against a parcel whose parcel_status is FULLY_SEVERED"
  - id: ERR_STALE_PARENT_VERSION
    http: 412
    condition: "expected_<parent>_version does not match the parent's current version (§1.2.1)"

  # safety / compliance
  - id: ERR_CERTIFICATE_FROZEN
    http: 409
    condition: "trading, splitting, or redeeming a certificate whose source easement is VIOLATION_NOTICED, UNDER_CURE, or ESCALATED"
  - id: ERR_EASEMENT_NONCOMPLIANT
    http: 409
    condition: "finalizing a receiving site application while a source easement behind one of its open redemptions is not COMPLIANT or CURED"
  - id: ERR_PARTY_SUSPENDED
    http: 409
    condition: "a party involved in the request has status SUSPENDED"

  # referential / configuration
  - id: ERR_PARTY_KIND_MISMATCH
    http: 422
    condition: "a party reference holds the wrong kind for the slot (landowner, developer, or municipal bank)"
  - id: ERR_SENDING_AREA_NOT_ACTIVE
    http: 409
    condition: "the sending area is DRAFT or CLOSED"
  - id: ERR_RECEIVING_AREA_NOT_ACTIVE
    http: 409
    condition: "the receiving area is DRAFT or SUSPENDED"
  - id: ERR_AREA_NOT_DRAFT
    http: 409
    condition: "activating a sending or receiving area that is no longer in DRAFT"
  - id: ERR_SENDING_RECEIVING_PAIR_NOT_ELIGIBLE
    http: 422
    condition: "the certificate's origin sending area code is absent from a non-empty ReceivingArea.eligible_sending_area_codes"

  # temporal
  - id: ERR_APPRAISAL_PERIOD_OVERLAP
    http: 409
    condition: "a new appraisal schedule's half-open window overlaps an existing ACTIVE window for the same neighborhood"
  - id: ERR_INSPECTION_WINDOW_CONFLICT
    http: 409
    condition: "the new inspection_date is fewer than 90 days after the easement's last_inspection_at"
  - id: ERR_EVALUATION_PERIOD_OVERLAP
    http: 409
    condition: "a new evaluation period partially overlaps an existing COMPUTED evaluation period"
  - id: ERR_REVERSAL_WINDOW_EXPIRED
    http: 409
    condition: "the reversal is attempted more than 30 days after settled_at"

  # constraints
  - id: ERR_DUPLICATE_PARCEL_APN
    http: 409
    condition: "another sending parcel already carries this apn"
  - id: ERR_DUPLICATE_AREA_CODE
    http: 409
    condition: "another sending or receiving area already carries this code"
  - id: ERR_PARCEL_HAS_OPEN_APPLICATION
    http: 409
    condition: "the parcel already has a severance application in a non-terminal status"
  - id: ERR_REVISION_LIMIT_EXCEEDED
    http: 409
    condition: "a further revision round would exceed the two-round limit on a severance or design review"
  - id: ERR_BONUS_EXCEEDS_MAX
    http: 422
    condition: "a resubmitted design requests more bonus units than the receiving area's computed max_bonus_units"
  - id: ERR_SPLIT_EXCEEDS_AVAILABLE_UNITS
    http: 422
    condition: "the split would leave no unencumbered units on the parent certificate"
  - id: ERR_INSUFFICIENT_CERTIFICATE_UNITS
    http: 422
    condition: "the requested units exceed the certificate's unencumbered remaining units"
  - id: ERR_BACKING_INSUFFICIENT
    http: 409
    condition: "finalization is attempted with allocated backing below required_backing_units"
  - id: ERR_ABSORPTION_CAP_EXCEEDED
    http: 409
    condition: "confirming the redemptions would push the receiving area past its absorption cap"
  - id: ERR_REVERSAL_NOT_PERMITTED
    http: 409
    condition: "the conveyed certificate has been redeemed or retired since settlement, so the reversal cannot be applied cleanly"

  # fiscal
  - id: ERR_NO_ACTIVE_APPRAISAL_SCHEDULE
    http: 422
    condition: "no ACTIVE appraisal schedule for the certificate's origin neighborhood covers the current logical clock"
  - id: ERR_PRICE_DEVIATION_EXCEEDS_BAND
    http: 422
    condition: "the proposed price deviates from the appraised reference by more than 3000 basis points"
  - id: ERR_INSUFFICIENT_FUNDS
    http: 402
    condition: "a cash movement would drive a party's balance below zero"
  - id: ERR_NO_ALLOCABLE_UNITS
    http: 422
    condition: "the severance approval would allocate zero units"
  - id: ERR_SENDING_CAP_EXHAUSTED
    http: 409
    condition: "the sending area has no unsevered capacity left"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ProgramAdministrator
    description: "Municipal TDR program staff: designates areas, publishes appraisal schedules, enrolls parcels, certifies severances, operates the municipal bank's purchase and resale channel, settles and reverses transactions, and runs program evaluations."
    identity: "opaque"
    exclusive_operations:
      - "POST /tdr/parties"
      - "POST /tdr/parties/{id}/account-actions"
      - "POST /tdr/sending-areas"
      - "POST /tdr/sending-areas/{id}/activate"
      - "POST /tdr/sending-areas/{id}/close"
      - "POST /tdr/receiving-areas"
      - "POST /tdr/receiving-areas/{id}/activate"
      - "POST /tdr/appraisal-schedules"
      - "POST /tdr/sending-parcels"
      - "POST /tdr/severance-applications/{id}/certify"
      - "POST /tdr/market-transactions/{id}/settle"
      - "POST /tdr/market-transactions/{id}/reverse"
      - "POST /tdr/evaluations"
      - "POST /tdr/_clock/set_current_utc"
      - "POST /tdr/_ops/compliance-sweep"
    shared_operations:
      - "POST /tdr/market-transactions (bank channels only)"
      - "POST /tdr/market-transactions/{id}/cancel"
      - "POST /tdr/certificates/{id}/split"
      - "POST /tdr/certificates/{id}/retire"
      - "POST /tdr/certificate-redemptions/{id}/release"
      - "POST /tdr/monitoring-inspections/{id}/cure-verification"
      - "every GET"
  - name: SeveranceReviewer
    description: "Planning-department reviewer who screens severance applications and records the approve / revise / deny decision. May never certify, which is what makes the segregation of duties bite."
    identity: "opaque"
    exclusive_operations:
      - "POST /tdr/severance-applications/{id}/screen"
      - "POST /tdr/severance-applications/{id}/review-decision"
    shared_operations: ["every GET"]
  - name: DesignReviewBoard
    description: "Design review board that rules on receiving-site design before a density bonus can be finalized."
    identity: "opaque"
    exclusive_operations:
      - "POST /tdr/receiving-site-applications/{id}/design-review-decision"
    shared_operations: ["every GET"]
  - name: EasementMonitor
    description: "Field monitor who inspects preserved parcels and verifies cures on noticed violations."
    identity: "opaque"
    exclusive_operations:
      - "POST /tdr/conservation-easements/{id}/inspections"
    shared_operations:
      - "POST /tdr/monitoring-inspections/{id}/cure-verification"
      - "every GET"
  - name: Landowner
    description: "Owner of a sending parcel who applies to sever rights and then trades the resulting certificates. X-User-ID is the id of the acting Party (kind LANDOWNER)."
    identity: "entity_backed:Party"
    exclusive_operations:
      - "POST /tdr/severance-applications"
      - "POST /tdr/severance-applications/{id}/resubmit"
    shared_operations:
      - "POST /tdr/market-transactions (PRIVATE channel as seller)"
      - "POST /tdr/market-transactions/{id}/cancel"
      - "POST /tdr/certificates/{id}/split"
      - "POST /tdr/certificates/{id}/retire"
      - "every GET"
  - name: Developer
    description: "Developer who buys certificates and files receiving-site applications for a density bonus. X-User-ID is the id of the acting Party (kind DEVELOPER)."
    identity: "entity_backed:Party"
    exclusive_operations:
      - "POST /tdr/receiving-site-applications"
      - "POST /tdr/receiving-site-applications/{id}/redemptions"
      - "POST /tdr/receiving-site-applications/{id}/resubmit-design"
      - "POST /tdr/receiving-site-applications/{id}/finalize"
    shared_operations:
      - "POST /tdr/market-transactions (PRIVATE channel as seller)"
      - "POST /tdr/market-transactions/{id}/cancel"
      - "POST /tdr/certificates/{id}/split"
      - "POST /tdr/certificates/{id}/retire"
      - "POST /tdr/certificate-redemptions/{id}/release"
      - "every GET"
