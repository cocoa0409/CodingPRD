  - name: logical_clock_is_forward_only
    claim_type: violation_to_error
    grounds:
    - validations[priority=86]
    - errors[ERR_CLOCK_REWIND_FORBIDDEN]
    - endpoints[POST /consulting/_clock/set_current_utc]
    distinguishing_aspect: The clock endpoint refuses any value earlier than the current logical time with 422 ERR_CLOCK_REWIND_FORBIDDEN, while setting the identical value again is accepted, so time is monotonic but not strictly increasing.
    test_recipe:
      setup:
      - the logical clock has been advanced to 2026-09-14T09:00:00Z
      setup_api_calls:
      - call: POST /consulting/_clock/set_current_utc
        payload:
          current_utc: '2026-08-03T09:00:00Z'
        as: PracticeAdmin
      - call: POST /consulting/_clock/set_current_utc
        payload:
          current_utc: '2026-09-14T09:00:00Z'
        as: PracticeAdmin
      trigger:
      - call: POST /consulting/_clock/set_current_utc
        payload:
          current_utc: '2026-09-13T23:59:59Z'
        as: PracticeAdmin
        captures:
          err1: $.data.error_id
      - call: POST /consulting/_clock/set_current_utc
        payload:
          current_utc: '2026-09-14T09:00:00Z'
        as: PracticeAdmin
      - call: POST /consulting/_clock/set_current_utc
        payload:
          current_utc: '2026-09-14T09:00:01Z'
        as: PracticeAdmin
      assert:
      - the rewind attempt returns HTTP 409 with data.error_id == ERR_CLOCK_REWIND_FORBIDDEN
      - re-setting the same instant returns success and leaves the clock at 2026-09-14T09:00:00Z
      - advancing by one second succeeds
