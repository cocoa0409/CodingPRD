          rationale: "The §1.8 priority_pair_validation_conflict instance already stacks ERR_COMPLIANCE_SUSPENDED, ERR_CRITICAL_REC_OVERDUE and ERR_WC_COORDINATION_UNVERIFIED on one bind and pins the priority-11 winner."

      - name: corner_temporal_overlap_rules_covered_by_difficulty
        claim_type: violation_to_error
