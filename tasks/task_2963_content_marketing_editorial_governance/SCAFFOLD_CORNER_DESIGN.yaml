            - "GET /editorial/content-items/${item_id}/claims?substantiation_state=SUBSTANTIATED returns exactly 2 rows"
            - "ContentItem.${item_id}.workflow_state == IN_REVIEW with SME, BRAND and ACCESSIBILITY still PENDING"

  - section: cross_cutting_complexity_layers
    instances:
      # The two stale-version legs of the optimistic_concurrency row are asserted in the
      # validations and errors sections of this file (ERR_STALE_EXPERT_VERSION and
      # ERR_STALE_CAMPAIGN_VERSION); the instance below closes the row's third leg -
      # "version increments on every write" - and its correct-version success path.
      - name: version_increments_only_on_accepted_writes_and_only_on_the_row_that_was_written
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[content-item-create-stale-campaign]
          - concurrency_rules[brief-assign-sme-stale-expert]
          - entities.Campaign.version
          - entities.SubjectMatterExpert.version
        distinguishing_aspect: "The OCC token is only useful if it moves exactly when the guarded ledger moves. Three separate facts have to hold at once: creating a CalendarSlot under a campaign does NOT bump Campaign.version (the slot is a new sibling, not a change to the commitment ledger) while creating a ContentItem DOES; a rejected write bumps nothing; and assign-sme bumps the expert AND the brief but leaves the campaign alone. An implementation that bumps the parent on every child insert makes every previously-read version stale and deadlocks the whole calendar."
        test_recipe:
          setup:
            - "A fresh campaign and a fresh expert, each read back after every write so the version sequence is observed rather than assumed."
          setup_api_calls:
            - call: "POST /editorial/campaigns"
              payload: { code: "CMP-OCCSEQ", persona: "PRACTITIONER", primary_funnel_stage: "AWARENESS", quarter_code: "2026Q3" }
              as: ManagingEditor
              captures: { cmp_id: $.data.id, v_create: $.data.version }
            - call: "POST /editorial/campaigns/${cmp_id}/activate"
              payload: {}
              as: ManagingEditor
              captures: { v_activate: $.data.version }
            - call: "POST /editorial/campaigns/${cmp_id}/calendar-slots"
              payload: { week_start_date: "2026-08-03", funnel_stage: "AWARENESS", capacity_points: 40 }
              as: ManagingEditor
              captures: { slot_id: $.data.id, slot_v: $.data.version }
            - call: "GET /editorial/campaigns/${cmp_id}"
              payload: {}
              as: ManagingEditor
              captures: { v_after_slot: $.data.version }
            - call: "POST /editorial/experts"
              payload: { full_name: "Ines Baro", expertise_tags: ["security"], weekly_capacity_hours: 40 }
              as: ManagingEditor
              captures: { exp_id: $.data.id, xv_create: $.data.version }
            - call: "POST /editorial/experts/${exp_id}/availability"
              payload: { status: "ON_LEAVE" }
              as: ManagingEditor
              captures: { xv_leave: $.data.version }
            - call: "POST /editorial/experts/${exp_id}/availability"
              payload: { status: "AVAILABLE" }
              as: ManagingEditor
              captures: { xv_back: $.data.version }
            - call: "POST /editorial/briefs"
              payload: { campaign_id: "${cmp_id}", funnel_stage: "AWARENESS", search_intent: "NAVIGATIONAL", primary_keyword: "zero trust login", target_word_count: 100, required_expertise_tag: "security", review_window_start: "2026-08-03T09:00:00.000Z", review_window_end: "2026-08-03T12:00:00.000Z" }
              as: ManagingEditor
              captures: { brief_id: $.data.id, bv_create: $.data.version }
            - call: "GET /editorial/campaigns/${cmp_id}"
              payload: {}
              as: ManagingEditor
              captures: { v_after_brief: $.data.version }
          trigger:
            - call: "POST /editorial/campaigns/${cmp_id}/activate"
              payload: {}
              as: ManagingEditor
              captures: { e_reactivate: $.data.error_id }
            - call: "GET /editorial/campaigns/${cmp_id}"
              payload: {}
              as: ManagingEditor
              captures: { v_after_rejected: $.data.version }
            - call: "POST /editorial/briefs/${brief_id}/assign-sme"
              payload: { sme_expert_id: "${exp_id}", expected_expert_version: "${xv_back}" }
              as: ManagingEditor
              captures: { bv_assigned: $.data.version, assigned_expert: $.data.sme_expert_id }
            - call: "GET /editorial/experts/${exp_id}"
              payload: {}
              as: ManagingEditor
              captures: { xv_after_assign: $.data.version, hours_after_assign: $.data.committed_hours_total }
            - call: "GET /editorial/campaigns/${cmp_id}"
              payload: {}
              as: ManagingEditor
              captures: { v_after_assign: $.data.version }
            - call: "POST /editorial/briefs/${brief_id}/approve"
              payload: {}
              as: SubjectMatterExpertUser
              as_user_id: "${exp_id}"
              captures: { bv_approved: $.data.version }
            - call: "POST /editorial/content-items"
              payload: { brief_id: "${brief_id}", slot_id: "${slot_id}", title: "Zero trust login guide", planned_publish_at: "2026-08-05T09:00:00.000Z", expected_campaign_version: "${v_after_assign}" }
              as: ManagingEditor
              as_user_id: "me-1"
              captures: { item_id: $.data.id, item_v: $.data.version, item_commit: $.data.commit_points }
            - call: "GET /editorial/campaigns/${cmp_id}"
              payload: {}
              as: ManagingEditor
              captures: { v_after_item: $.data.version, cmp_committed: $.data.committed_points_total }
          assert:
            - "${v_create} == 1 and ${v_activate} == 2"
            - "${slot_v} == 1 and ${v_after_slot} == 2 — the slot insert did not bump the campaign"
            - "${v_after_brief} == 2 — the brief insert did not bump the campaign either"
            - "the second activate returns HTTP 409 with ${e_reactivate} == ERR_CAMPAIGN_STATE_INVALID and ${v_after_rejected} == 2"
            - "${xv_create} == 1, ${xv_leave} == 2 and ${xv_back} == 3"
            - "the assign-sme with expected_expert_version 3 returns HTTP 200, ${assigned_expert} == ${exp_id}, ${bv_create} == 1 and ${bv_assigned} == 2"
            - "${xv_after_assign} == 4 and ${hours_after_assign} == 3 because the brief reserves ceil(6 * 0.5) hours"
            - "${v_after_assign} == 2 — assigning an expert bumps the brief and the expert, never the campaign"
            - "${bv_approved} == 3 while ${xv_after_assign} stays 4 — approval touches only the brief"
            - "the item create with expected_campaign_version 2 returns HTTP 201 with ${item_v} == 1 and ${item_commit} == 6, the brief's clamped 6 effort points plus the LOW tier's zero surcharge"
            - "${v_after_item} == 3 and ${cmp_committed} == 6 — the commit ledger and the version moved together"
            - "GET /editorial/calendar-slots/${slot_id} shows committed_points 6, utilization_pct 15.00 and version 1, because an OPEN slot that stays OPEN is not re-stated"

      - name: cascading_side_effect_chain_depth_is_covered_by_the_difficulty_design
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers[cascading_side_effects]
        excluded_because:
          difficulty_instance: transitive_cascade / expert_leave_cascades_brief_item_gates_and_campaign_posture
          rationale: "The named §1.8 instance walks the five-level expert-leave chain end to end (expert -> brief -> item -> gates -> campaign posture) and asserts every level, including the rows the cascade must leave untouched."

      - name: cascading_side_effect_ordering_sensitivity_is_covered_by_the_difficulty_design
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers[cascading_side_effects]
        excluded_because:
          difficulty_instance: transitive_cascade / sweep_asset_expiry_cascades_usage_distribution_item_and_posture
          rationale: "The named §1.8 instance is the ordering-sensitivity case: the sweep's step 2 suppression must run before step 5 activation and step 8 posture, and the instance asserts the counters that only reconcile under that order."

      - name: dual_variant_evidence_scoring_is_covered_by_the_difficulty_design
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers[dual_variant_calculation]
          - calculations.claim_evidence_score
        excluded_because:
          difficulty_instance: dual_variant_calc / claim_evidence_score_strict_regulated_diverges_from_standard
          rationale: "The named §1.8 instance scores one identical evidence dossier under STANDARD and under STRICT_REGULATED and asserts both results plus the delta, which is exactly this row's claim."

      - name: dual_variant_pipeline_attribution_is_covered_by_the_difficulty_design
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers[dual_variant_calculation]
          - calculations.content_pipeline_attribution
        excluded_because:
          difficulty_instance: dual_variant_calc / pipeline_attribution_last_touch_diverges_from_assisted_fractional
          rationale: "The named §1.8 instance derives last-touch and assisted pipeline from the same snapshot set and asserts both figures, so the variant divergence and the delta are already covered."

      - name: posture_freeze_threshold_boundary_is_covered_by_the_difficulty_design
        claim_type: rate_threshold_triggers
        grounds:
          - complexity_profile.complexity_layers[rate_threshold_triggers]
          - calculations.campaign_governance_posture
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / publish_blocked_while_campaign_posture_frozen_by_lapsed_usages
          rationale: "The named §1.8 instance sits on the cumulative boundary: one lapsed usage yields RESTRICTED and the second crosses FREEZE_USAGE_COUNT into FROZEN, which is this row's cumulative-threshold claim."

      - name: decay_refresh_threshold_boundary_is_covered_by_the_difficulty_design
        claim_type: rate_threshold_triggers
        grounds:
          - complexity_profile.complexity_layers[rate_threshold_triggers]
          - calculations.content_decay_pct
        excluded_because:
          difficulty_instance: boundary_precision_check / decay_zero_baseline_window_yields_zero_pct_and_no_refresh
          rationale: "The named §1.8 instance pins the decay threshold at its degenerate boundary — a zero baseline must read 0.00 and must not trip REFRESH_THRESHOLD_PCT — so the instantaneous-threshold boundary is covered."

      - name: rights_threshold_disarms_on_renewal_and_re_arms_on_the_next_expiry
        claim_type: rate_threshold_triggers
        grounds:
          - complexity_profile.complexity_layers[rate_threshold_triggers]
          - calculations.campaign_governance_posture
          - calculations.asset_license_status
          - endpoints[POST /editorial/_ops/governance-sweep]
