        distinguishing_aspect: "FATIGUE_T1_MAX is inclusive: two WM-X slots give gross 300 and committed 300 (tier 1.00), and adding a 1-minute WM-T slot pushes gross to 301, tier 1.05 and committed ceil(301 * 1.05) = 317 — a single extra minute of work costs 17 committed minutes."
        test_recipe:
          setup:
            - "Base fixture: Line L1 (ST10/ST20), SUP1, P-DOOR-A, WM-X RELEASED (150 labour minutes), ShiftPlan A 06:00-14:00 headcount 20"
