# =============================================================================
# Task 0623 — Dermatology Practice (medical & cosmetic)
# Scaffold seed tables (§1.0–§1.7). Expert difficulty band.
# =============================================================================

scenario: |
  623. Dermatology Practice (medical & cosmetic): visit type
  (medical/skin-check/cosmetic), biopsy & path-lab tracking, Mohs/procedure
  scheduling, cosmetic package & membership, prior-auth (biologics/specialty)
  & step therapy, photo-documentation & mole mapping, insurance vs cash split,
  skin-check recall reminder

domain_name: dermatology-practice
api_prefix: /          # flat topology: every entity is a top-level collection (/patients, /encounters, /biopsies, ...), FK navigation via filtered lists

# -----------------------------------------------------------------------------
# Complexity profile (§0.1–§0.4)
# -----------------------------------------------------------------------------
complexity_profile:
  primary_archetype: ledger_reconciliation        # insurance-vs-cash split: same charge, two algorithms, divergent patient responsibility
  secondary_archetype: compliance_audit           # prior-auth + step-therapy gating before a biologic charge may post
  complexity_layers:
    - dual_variant_calculation                     # insurance allowed-amount vs cash self-pay price on the same Charge
    - cascading_side_effects                       # biopsy result -> recall reminder + encounter clinical close; membership redemption -> wallet debit -> charge
    - optimistic_concurrency                       # prepaid cosmetic membership wallet & procedure slot booking
    - scheduled_actions                            # recall reminders fire at a future clock instant; deferred charge posting
    - derived_field_reconciliation                 # membership unit_balance, charge patient_responsibility_cents, encounter posture

  entity_topology: hybrid
  # Patient is a hub (flat satellites: Encounter, Biopsy, PriorAuthorization,
  # CosmeticMembership, RecallReminder, Charge) while Room/ProcedureSlot and
  # StepTherapyTrial nest under their owners. Cross-aggregate FKs link
  # Encounter <-> Biopsy <-> Charge <-> PriorAuthorization.

  state_machine_shape: parallel
  # Encounter carries two independent dimensions (clinical_status x billing_status).
  # Biopsy is branching (collected -> {benign, malignant} -> divergent side effects).
  # PriorAuthorization is cyclic (step-therapy resubmission loop).

  relationship_patterns:
    - one_to_many          # Patient -> Encounters/Biopsies/Charges; PriorAuthorization -> StepTherapyTrials
    - cross_aggregate      # Charge.prior_auth_id, Charge.encounter_id, Biopsy.encounter_id, ProcedureBooking.encounter_id
    - polymorphic          # Charge.source_kind selects which originating entity a charge points at (ENCOUNTER | COSMETIC_TREATMENT | PROCEDURE_BOOKING)

  role_model: peer_roles
  # FrontDesk owns scheduling+registration; Provider owns clinical acts; PathLab owns specimen results;
  # BillingSpecialist owns charges/prior-auth; PracticeAdmin is the operational superset for setup + clock.

  consistency_model: immediate

# -----------------------------------------------------------------------------
# §1.0 Response Envelope (FIXED — verbatim)
# -----------------------------------------------------------------------------
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  # --- Provider (entity-backed clinical actor) ---------------------------------
  - name: Provider
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: full_name, type: string, source: input, description: "Provider display name" }
      - { name: npi, type: string, source: input, description: "National provider identifier (free-form string, unique among providers)" }
      - { name: can_perform_mohs, type: boolean, source: input, default: false, description: "Whether this provider is credentialed to perform Mohs surgery" }
      - { name: active, type: boolean, source: input, default: true, description: "Whether the provider may be assigned to encounters and bookings" }

  # --- Room (temporal scheduling resource for procedures) ----------------------
  - name: Room
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Room label, e.g. 'Procedure Suite A'" }
      - { name: room_kind, type: enum, source: input, description: "STANDARD | MOHS_SUITE — MOHS_SUITE is the only kind that may host a MOHS booking", constraints: "one of {STANDARD, MOHS_SUITE}" }
      - { name: turnover_buffer_minutes, type: integer, source: input, default: 0, description: "Mandatory idle buffer enforced AFTER each booking end on this room; the next booking's start must be >= prior end + buffer" }

  # --- Patient (hub) -----------------------------------------------------------
  - name: Patient
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Patient full name" }
      - { name: date_of_birth, type: string, source: input, description: "ISO date YYYY-MM-DD" }
      - { name: has_active_insurance, type: boolean, source: input, default: false, description: "True if the patient carries billable insurance; drives the default billing path on medical/skin-check encounters" }
      - { name: insurance_coinsurance_rate, type: number, source: input, default: 0.2, description: "Patient coinsurance fraction applied to the insurer allowed-amount, 0..1; only meaningful when has_active_insurance is true" }
      - { name: insurance_deductible_remaining_cents, type: integer, source: input, default: 0, description: "Remaining unmet deductible in cents; consumed by insurance-path charges in posting order" }
      - { name: last_skin_check_at, type: datetime, source: computed, default: null, description: "Clock time of the most recent CLOSED skin-check encounter; updated when a SKIN_CHECK encounter is clinically closed" }

  # --- Encounter (visit; parallel clinical x billing dimensions) ---------------
  - name: Encounter
    parent: null
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: input, description: "FK -> Patient.id" }
      - { name: provider_id, type: string, source: input, description: "FK -> Provider.id; must reference an active provider at creation" }
      - { name: visit_type, type: enum, source: input, description: "MEDICAL | SKIN_CHECK | COSMETIC", constraints: "one of {MEDICAL, SKIN_CHECK, COSMETIC}" }
      - { name: scheduled_at, type: datetime, source: input, description: "Clock time the encounter is scheduled for" }
      - { name: clinical_status, type: enum, source: system, description: "Clinical dimension: SCHEDULED -> CHECKED_IN -> IN_PROGRESS -> CLINICALLY_CLOSED; CANCELLED is terminal", constraints: "one of {SCHEDULED, CHECKED_IN, IN_PROGRESS, CLINICALLY_CLOSED, CANCELLED}" }
      - { name: billing_status, type: enum, source: system, description: "Billing dimension (independent of clinical): BILLING_OPEN -> BILLING_FINALIZED; BILLING_VOID is terminal", constraints: "one of {BILLING_OPEN, BILLING_FINALIZED, BILLING_VOID}" }
      - { name: pay_path, type: enum, source: input, description: "INSURANCE | CASH. For MEDICAL/SKIN_CHECK defaults from patient.has_active_insurance if omitted; COSMETIC encounters are always CASH", constraints: "one of {INSURANCE, CASH}" }
      - { name: open_biopsy_count, type: integer, source: computed, default: 0, description: "Count of child Biopsy rows whose status is in {COLLECTED, AT_LAB}; gates clinical close" }

  # --- SkinExamPhoto (photo-documentation & mole mapping) ----------------------
  - name: SkinExamPhoto
    parent: Encounter
    common_fields: false   # append-only documentation: id + created_at only
    fields:
      - { name: encounter_id, type: string, source: system, description: "FK -> Encounter.id" }
      - { name: body_site, type: string, source: input, description: "Anatomical site label, e.g. 'left-shoulder'" }
      - { name: mole_map_x, type: number, source: input, description: "Mole-map normalized X coordinate 0..1" }
      - { name: mole_map_y, type: number, source: input, description: "Mole-map normalized Y coordinate 0..1" }
      - { name: image_ref, type: string, source: input, description: "Opaque storage reference for the captured image" }

  # --- Biopsy (specimen -> path-lab tracking; branching) -----------------------
  - name: Biopsy
    parent: null
    common_fields: true
    fields:
      - { name: encounter_id, type: string, source: input, description: "FK -> Encounter.id; the encounter the specimen was collected during" }
      - { name: patient_id, type: string, source: computed, description: "FK -> Patient.id; copied from the encounter at creation" }
      - { name: body_site, type: string, source: input, description: "Site the specimen was taken from" }
      - { name: status, type: enum, source: system, description: "COLLECTED -> AT_LAB -> RESULTED -> SIGNED_OUT; CANCELLED is terminal", constraints: "one of {COLLECTED, AT_LAB, RESULTED, SIGNED_OUT, CANCELLED}" }
      - { name: result, type: enum, source: system, default: null, description: "Set when RESULTED: BENIGN | MALIGNANT | INDETERMINATE", constraints: "one of {BENIGN, MALIGNANT, INDETERMINATE}" }
      - { name: recall_months, type: integer, source: computed, default: null, description: "Recall horizon derived from result at sign-out: BENIGN=12, INDETERMINATE=6, MALIGNANT=3" }

  # --- ProcedureBooking (Mohs/procedure scheduling; temporal interval on a Room) -
  - name: ProcedureBooking
    parent: null
    common_fields: true
    fields:
      - { name: room_id, type: string, source: input, description: "FK -> Room.id" }
      - { name: provider_id, type: string, source: input, description: "FK -> Provider.id; for MOHS bookings the provider must have can_perform_mohs=true" }
      - { name: encounter_id, type: string, source: input, description: "FK -> Encounter.id; the medical encounter this procedure belongs to" }
      - { name: procedure_kind, type: enum, source: input, description: "EXCISION | MOHS — MOHS requires a MOHS_SUITE room and a Mohs-credentialed provider", constraints: "one of {EXCISION, MOHS}" }
      - { name: start_at, type: datetime, source: input, description: "Interval start (inclusive)" }
      - { name: end_at, type: datetime, source: input, description: "Interval end (exclusive); must be strictly after start_at" }
      - { name: status, type: enum, source: system, description: "BOOKED -> COMPLETED; CANCELLED is terminal", constraints: "one of {BOOKED, COMPLETED, CANCELLED}" }

  # --- PriorAuthorization (biologics/specialty; cyclic step therapy) -----------
  - name: PriorAuthorization
    parent: null
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: input, description: "FK -> Patient.id" }
      - { name: drug_name, type: string, source: input, description: "Specialty/biologic drug requested" }
      - { name: required_step_count, type: integer, source: input, description: "Number of step-therapy trials the payer requires before approval (>= 0)", constraints: ">= 0" }
      - { name: list_price_cents, type: integer, source: input, description: "Drug list price in cents; basis for the eventual biologic charge" }
      - { name: status, type: enum, source: system, description: "DRAFT -> SUBMITTED -> {APPROVED, DENIED}; DENIED -> SUBMITTED resubmission loop is allowed", constraints: "one of {DRAFT, SUBMITTED, APPROVED, DENIED}" }
      - { name: satisfied_step_count, type: integer, source: computed, default: 0, description: "Count of child StepTherapyTrial rows with outcome=FAILED (a failed/insufficient prior drug satisfies one step)" }
      - { name: submission_round, type: integer, source: computed, default: 0, description: "Increments by 1 on each SUBMITTED transition; records resubmission rounds" }

  # --- StepTherapyTrial (the steps under a PriorAuthorization) ------------------
  - name: StepTherapyTrial
    parent: PriorAuthorization
    common_fields: true
    fields:
      - { name: prior_auth_id, type: string, source: system, description: "FK -> PriorAuthorization.id" }
      - { name: drug_name, type: string, source: input, description: "Prior step-therapy drug tried" }
      - { name: outcome, type: enum, source: input, description: "FAILED | EFFECTIVE | NOT_TRIED — only FAILED counts toward satisfied_step_count", constraints: "one of {FAILED, EFFECTIVE, NOT_TRIED}" }

  # --- CosmeticMembership (prepaid package & membership wallet) -----------------
  - name: CosmeticMembership
    parent: null
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: input, description: "FK -> Patient.id" }
      - { name: tier, type: enum, source: input, description: "SILVER | GOLD — sets per-unit cash value and bonus", constraints: "one of {SILVER, GOLD}" }
      - { name: purchased_unit_cents, type: integer, source: input, description: "Cents the patient prepaid; converted to wallet units at activation" }
      - { name: unit_balance_cents, type: integer, source: computed, default: 0, description: "Remaining prepaid wallet balance in cents; debited by cosmetic treatment redemptions, never negative" }
      - { name: status, type: enum, source: system, description: "PENDING -> ACTIVE -> {EXHAUSTED, CANCELLED}; ACTIVE auto-bubbles to EXHAUSTED when unit_balance_cents hits 0", constraints: "one of {PENDING, ACTIVE, EXHAUSTED, CANCELLED}" }

  # --- CosmeticTreatment (redeems membership wallet, generates a cash charge) ---
  - name: CosmeticTreatment
    parent: null
    common_fields: true
    fields:
      - { name: encounter_id, type: string, source: input, description: "FK -> Encounter.id; must reference a COSMETIC visit" }
      - { name: membership_id, type: string, source: input, description: "FK -> CosmeticMembership.id; the wallet redeemed against" }
      - { name: service_name, type: string, source: input, description: "Cosmetic service performed, e.g. 'neurotoxin-units'" }
      - { name: list_price_cents, type: integer, source: input, description: "Undiscounted cash list price in cents" }
      - { name: redeemed_cents, type: integer, source: computed, description: "Amount actually drawn from the membership wallet (after tier discount, capped by available balance)" }
      - { name: out_of_pocket_cents, type: integer, source: computed, description: "Residual the patient owes in cash after the wallet draw" }

  # --- Charge (insurance-vs-cash split ledger entry) ---------------------------
  - name: Charge
    parent: null
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: input, description: "FK -> Patient.id" }
      - { name: encounter_id, type: string, source: input, description: "FK -> Encounter.id; the encounter being billed" }
      - { name: prior_auth_id, type: string, source: input, default: null, description: "FK -> PriorAuthorization.id; required when charge_kind=BIOLOGIC, else null" }
      - { name: cosmetic_treatment_id, type: string, source: input, default: null, description: "FK -> CosmeticTreatment.id; required when source_kind=COSMETIC_TREATMENT, else null. Voiding the charge restores this treatment's redeemed_cents to its membership wallet." }
      - { name: source_kind, type: enum, source: input, description: "Polymorphic origin selector: ENCOUNTER | COSMETIC_TREATMENT | PROCEDURE_BOOKING", constraints: "one of {ENCOUNTER, COSMETIC_TREATMENT, PROCEDURE_BOOKING}" }
      - { name: charge_kind, type: enum, source: input, description: "OFFICE_VISIT | PROCEDURE | BIOLOGIC | COSMETIC", constraints: "one of {OFFICE_VISIT, PROCEDURE, BIOLOGIC, COSMETIC}" }
      - { name: billed_amount_cents, type: integer, source: input, description: "Gross billed amount in cents" }
      - { name: insurer_allowed_cents, type: integer, source: input, default: null, description: "Payer allowed-amount in cents; required on the INSURANCE path, ignored on CASH" }
      - { name: pay_path, type: enum, source: system, description: "INSURANCE | CASH — copied from the parent Encounter at posting time", constraints: "one of {INSURANCE, CASH}" }
      - { name: patient_responsibility_cents, type: integer, source: computed, description: "Patient's owed amount, computed by the split rule for the resolved pay_path" }
      - { name: insurer_responsibility_cents, type: integer, source: computed, default: 0, description: "Insurer's owed amount; 0 on CASH path" }
      - { name: deductible_applied_cents, type: integer, source: computed, default: 0, description: "Portion of this charge that consumed the patient's remaining deductible (INSURANCE path only)" }
      - { name: status, type: enum, source: system, description: "POSTED -> {PAID, VOIDED}", constraints: "one of {POSTED, PAID, VOIDED}" }

  # --- RecallReminder (skin-check recall; scheduled/deferred action) -----------
  - name: RecallReminder
    parent: null
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: input, description: "FK -> Patient.id" }
      - { name: biopsy_id, type: string, source: input, default: null, description: "FK -> Biopsy.id; set when the recall was auto-spawned from a signed-out biopsy, null for routine skin-check recalls" }
      - { name: reason, type: enum, source: input, description: "ROUTINE_SKIN_CHECK | BIOPSY_FOLLOWUP", constraints: "one of {ROUTINE_SKIN_CHECK, BIOPSY_FOLLOWUP}" }
      - { name: due_at, type: datetime, source: input, description: "Clock time the recall becomes due/fireable" }
      - { name: status, type: enum, source: system, description: "PENDING -> {SENT, DISMISSED}; SENT only via the recall sweep when clock >= due_at", constraints: "one of {PENDING, SENT, DISMISSED}" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  # --- Encounter clinical dimension -----------------------------------------
  - entity: Encounter
    dimension: clinical_status
    initial_state: SCHEDULED
    terminal_states: [CLINICALLY_CLOSED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: CHECKED_IN
        trigger: "POST /encounters/{id}/check-in"
        actor: FrontDesk
        preconditions:
          - "Encounter.clinical_status == SCHEDULED (else ERR_ENCOUNTER_BAD_CLINICAL_STATE)"
          - "Clock current time >= Encounter.scheduled_at is NOT required (early check-in allowed)"
        side_effects: ["increments Encounter.version by 1"]

      - from: CHECKED_IN
        to: IN_PROGRESS
        trigger: "POST /encounters/{id}/start"
        actor: Provider
        preconditions:
          - "Encounter.clinical_status == CHECKED_IN (else ERR_ENCOUNTER_BAD_CLINICAL_STATE)"
        side_effects: ["increments Encounter.version by 1"]

      - from: IN_PROGRESS
        to: CLINICALLY_CLOSED
        trigger: "POST /encounters/{id}/clinical-close"
        actor: Provider
        preconditions:
          - "Encounter.clinical_status == IN_PROGRESS (else ERR_ENCOUNTER_BAD_CLINICAL_STATE)"
          - "Encounter.open_biopsy_count == 0 — no child Biopsy in {COLLECTED, AT_LAB} (else ERR_OPEN_BIOPSY_BLOCKS_CLOSE)"
        side_effects:
          - "increments Encounter.version by 1"
          - "If visit_type == SKIN_CHECK: set Patient.last_skin_check_at = clock current time AND spawn one RecallReminder (reason=ROUTINE_SKIN_CHECK, due_at = clock + 12 months, status=PENDING, biopsy_id=null) — see calc routine_recall_horizon"
          - "Refresh updated_at on the affected Patient when last_skin_check_at changes"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /encounters/{id}/cancel"
        actor: FrontDesk
        preconditions:
          - "Encounter.clinical_status == SCHEDULED (else ERR_ENCOUNTER_BAD_CLINICAL_STATE)"
        side_effects: ["increments Encounter.version by 1"]

      - from: CHECKED_IN
        to: CANCELLED
        trigger: "POST /encounters/{id}/cancel"
        actor: FrontDesk
        preconditions:
          - "Encounter.clinical_status == CHECKED_IN (else ERR_ENCOUNTER_BAD_CLINICAL_STATE)"
        side_effects: ["increments Encounter.version by 1"]

  # --- Encounter billing dimension (independent parallel axis) ----------------
  - entity: Encounter
    dimension: billing_status
    initial_state: BILLING_OPEN
    terminal_states: [BILLING_FINALIZED, BILLING_VOID]
    transitions:
      - from: BILLING_OPEN
        to: BILLING_FINALIZED
        trigger: "POST /encounters/{id}/finalize-billing"
        actor: BillingSpecialist
        preconditions:
          - "Encounter.clinical_status == CLINICALLY_CLOSED (cross-dimension guard; else ERR_ENCOUNTER_NOT_CLINICALLY_CLOSED)"
          - "No child Charge in POSTED status remains unsettled is NOT required; finalize locks new charge posting"
          - "Encounter.billing_status == BILLING_OPEN (else ERR_ENCOUNTER_BAD_BILLING_STATE)"
        side_effects:
          - "increments Encounter.version by 1"
          - "Blocks any further POST /charges referencing this encounter (ERR_ENCOUNTER_BILLING_LOCKED)"

      - from: BILLING_OPEN
        to: BILLING_VOID
        trigger: "POST /encounters/{id}/void-billing"
        actor: BillingSpecialist
        preconditions:
          - "Encounter.billing_status == BILLING_OPEN (else ERR_ENCOUNTER_BAD_BILLING_STATE)"
          - "Encounter.clinical_status == CANCELLED (void-billing is only for cancelled encounters; else ERR_ENCOUNTER_NOT_CANCELLED)"
        side_effects:
          - "increments Encounter.version by 1"
          - "Cascade: every child Charge in POSTED status -> VOIDED, reversing any deductible it consumed (see calc deductible_waterfall reversal). For INSURANCE charges, restore Patient.insurance_deductible_remaining_cents += charge.deductible_applied_cents"

  # --- Biopsy lifecycle (branching on result) ---------------------------------
  - entity: Biopsy
    initial_state: COLLECTED
    terminal_states: [SIGNED_OUT, CANCELLED]
    transitions:
      - from: COLLECTED
        to: AT_LAB
        trigger: "POST /biopsies/{id}/send-to-lab"
        actor: Provider
        preconditions:
          - "Biopsy.status == COLLECTED (else ERR_BIOPSY_BAD_STATE)"
        side_effects: ["increments Biopsy.version by 1", "Encounter.open_biopsy_count unchanged (COLLECTED and AT_LAB both count as open)"]

      - from: AT_LAB
        to: RESULTED
        trigger: "POST /biopsies/{id}/result"
        actor: PathLab
        preconditions:
          - "Biopsy.status == AT_LAB (else ERR_BIOPSY_BAD_STATE)"
          - "result in {BENIGN, MALIGNANT, INDETERMINATE} (else ERR_INVALID_BIOPSY_RESULT)"
        side_effects:
          - "increments Biopsy.version by 1"
          - "Set Biopsy.result from input"
          - "Recompute parent Encounter.open_biopsy_count (RESULTED no longer counts as open) — bubble-up; refresh Encounter.updated_at"

      - from: RESULTED
        to: SIGNED_OUT
        trigger: "POST /biopsies/{id}/sign-out"
        actor: Provider
        preconditions:
          - "Biopsy.status == RESULTED (else ERR_BIOPSY_BAD_STATE)"
        side_effects:
          - "increments Biopsy.version by 1"
          - "Set Biopsy.recall_months from result via calc biopsy_recall_horizon (BENIGN=12, INDETERMINATE=6, MALIGNANT=3)"
          - "Cascade depth-3: sign-out spawns a RecallReminder (reason=BIOPSY_FOLLOWUP, biopsy_id=this, due_at = clock + recall_months months, status=PENDING); creating that reminder sets Patient.updated_at; if result==MALIGNANT the spawned reminder additionally pre-dates any existing ROUTINE_SKIN_CHECK reminder for the patient by transitioning those routine reminders PENDING->DISMISSED (superseded)"

      - from: COLLECTED
        to: CANCELLED
        trigger: "POST /biopsies/{id}/cancel"
        actor: Provider
        preconditions:
          - "Biopsy.status == COLLECTED (else ERR_BIOPSY_BAD_STATE)"
        side_effects:
          - "increments Biopsy.version by 1"
          - "Recompute parent Encounter.open_biopsy_count (cancelled no longer counts as open) — bubble-up"

  # --- PriorAuthorization (cyclic step-therapy resubmission) -------------------
  - entity: PriorAuthorization
    initial_state: DRAFT
    terminal_states: [APPROVED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /prior-authorizations/{id}/submit"
        actor: BillingSpecialist
        preconditions:
          - "PriorAuthorization.status == DRAFT (else ERR_PA_BAD_STATE)"
          - "satisfied_step_count >= required_step_count — step therapy met (else ERR_STEP_THERAPY_NOT_MET)"
        side_effects: ["increments PriorAuthorization.version by 1", "increments submission_round by 1"]

      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /prior-authorizations/{id}/adjudicate"
        actor: BillingSpecialist
        preconditions:
          - "PriorAuthorization.status == SUBMITTED (else ERR_PA_BAD_STATE)"
          - "decision == APPROVE (else routes to DENIED transition)"
        side_effects: ["increments PriorAuthorization.version by 1"]

      - from: SUBMITTED
        to: DENIED
        trigger: "POST /prior-authorizations/{id}/adjudicate"
        actor: BillingSpecialist
        preconditions:
          - "PriorAuthorization.status == SUBMITTED (else ERR_PA_BAD_STATE)"
          - "decision == DENY"
        side_effects: ["increments PriorAuthorization.version by 1"]

      - from: DENIED
        to: SUBMITTED
        trigger: "POST /prior-authorizations/{id}/submit"
        actor: BillingSpecialist
        note: "Cyclic resubmission loop: after a denial the practice adds another StepTherapyTrial and resubmits"
        preconditions:
          - "PriorAuthorization.status == DENIED (else ERR_PA_BAD_STATE)"
          - "satisfied_step_count >= required_step_count — must satisfy step therapy again with the newly-added trial (else ERR_STEP_THERAPY_NOT_MET)"
        side_effects: ["increments PriorAuthorization.version by 1", "increments submission_round by 1"]

  # --- ProcedureBooking ------------------------------------------------------
  - entity: ProcedureBooking
    initial_state: BOOKED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: BOOKED
        to: COMPLETED
        trigger: "POST /procedure-bookings/{id}/complete"
        actor: Provider
        preconditions:
          - "ProcedureBooking.status == BOOKED (else ERR_BOOKING_BAD_STATE)"
          - "Linked Encounter.clinical_status == IN_PROGRESS (cross-entity guard; else ERR_ENCOUNTER_NOT_IN_PROGRESS)"
        side_effects: ["increments ProcedureBooking.version by 1"]

      - from: BOOKED
        to: CANCELLED
        trigger: "POST /procedure-bookings/{id}/cancel"
        actor: FrontDesk
        preconditions:
          - "ProcedureBooking.status == BOOKED (else ERR_BOOKING_BAD_STATE)"
        side_effects:
          - "increments ProcedureBooking.version by 1"
          - "Frees the room interval so a later booking on the same room may reuse the time window"

  # --- CosmeticMembership (compound: ACTIVE auto-bubbles to EXHAUSTED) ---------
  - entity: CosmeticMembership
    initial_state: PENDING
    terminal_states: [EXHAUSTED, CANCELLED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /cosmetic-memberships/{id}/activate"
        actor: BillingSpecialist
        preconditions:
          - "CosmeticMembership.status == PENDING (else ERR_MEMBERSHIP_BAD_STATE)"
        side_effects:
          - "increments CosmeticMembership.version by 1"
          - "Set unit_balance_cents = purchased_unit_cents + tier bonus (see calc membership_wallet_grant)"

      - from: ACTIVE
        to: EXHAUSTED
        trigger: "system: CosmeticTreatment redemption drives unit_balance_cents to 0"
        actor: system
        note: "Bubble-up auto-transition: when a redemption leaves unit_balance_cents == 0, membership auto-flips ACTIVE -> EXHAUSTED"
        preconditions:
          - "CosmeticMembership.status == ACTIVE"
          - "unit_balance_cents == 0 after redemption debit"
        side_effects: ["increments CosmeticMembership.version by 1"]

      - from: PENDING
        to: CANCELLED
        trigger: "POST /cosmetic-memberships/{id}/cancel"
        actor: BillingSpecialist
        preconditions:
          - "CosmeticMembership.status == PENDING (else ERR_MEMBERSHIP_BAD_STATE)"
        side_effects: ["increments CosmeticMembership.version by 1"]

      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /cosmetic-memberships/{id}/cancel"
        actor: BillingSpecialist
        preconditions:
          - "CosmeticMembership.status == ACTIVE (else ERR_MEMBERSHIP_BAD_STATE)"
        side_effects:
          - "increments CosmeticMembership.version by 1"
          - "Set unit_balance_cents = 0 (forfeit remaining wallet)"

  # --- Charge lifecycle ------------------------------------------------------
  - entity: Charge
    initial_state: POSTED
    terminal_states: [PAID, VOIDED]
    transitions:
      - from: POSTED
        to: PAID
        trigger: "POST /charges/{id}/pay"
        actor: BillingSpecialist
        preconditions:
          - "Charge.status == POSTED (else ERR_CHARGE_BAD_STATE)"
        side_effects: ["increments Charge.version by 1"]

      - from: POSTED
        to: VOIDED
        trigger: "POST /charges/{id}/void"
        actor: BillingSpecialist
        preconditions:
          - "Charge.status == POSTED (else ERR_CHARGE_BAD_STATE)"
        side_effects:
          - "increments Charge.version by 1"
          - "Compensation A (deductible conservation): if pay_path == INSURANCE, restore Patient.insurance_deductible_remaining_cents += deductible_applied_cents"
          - "Compensation B (wallet conservation): if source_kind == COSMETIC_TREATMENT, restore CosmeticMembership.unit_balance_cents += linked CosmeticTreatment.redeemed_cents (via Charge.cosmetic_treatment_id). Membership status is NOT auto-reverted from EXHAUSTED — wallet restoration only"

  # --- RecallReminder --------------------------------------------------------
  - entity: RecallReminder
    initial_state: PENDING
    terminal_states: [SENT, DISMISSED]
    transitions:
      - from: PENDING
        to: SENT
        trigger: "POST /_recall/sweep (system sweep over due reminders)"
        actor: system
        preconditions:
          - "RecallReminder.status == PENDING"
          - "clock current time >= RecallReminder.due_at (else the reminder is skipped, not errored)"
        side_effects: ["increments RecallReminder.version by 1"]

      - from: PENDING
        to: DISMISSED
        trigger: "POST /recall-reminders/{id}/dismiss"
        actor: FrontDesk
        preconditions:
          - "RecallReminder.status == PENDING (else ERR_RECALL_BAD_STATE)"
        side_effects: ["increments RecallReminder.version by 1"]

# -----------------------------------------------------------------------------
# §1.2.1 Concurrency Rules (OCC on parent version — sanctioned mechanism only)
# -----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: cosmetic-redeem-stale-membership
    parent_entity: CosmeticMembership
    write_endpoint: "POST /cosmetic-treatments"
    occ_field: "expected_membership_version"
    description: |
      Redeeming a CosmeticTreatment against a CosmeticMembership whose version
      has advanced since the client last observed it is rejected. A prior
      redemption against the same membership legitimately debited the wallet and
      advanced the membership version; the current writer's view of the wallet
      balance is therefore stale and the new redemption is rejected on the
      stale-version check rather than drawing against an out-of-date balance.
    error_id: ERR_STALE_MEMBERSHIP_VERSION
    http_status: 412

  - rule_id: booking-create-stale-room
    parent_entity: Room
    write_endpoint: "POST /procedure-bookings"
    occ_field: "expected_room_version"
    description: |
      Creating a ProcedureBooking against a Room whose version has advanced
      since the client last observed it is rejected. A prior booking on the same
      room occupied an interval and advanced the room version; the current
      writer's view of the room's occupied intervals is therefore stale, so the
      new booking is rejected on the stale-version check before overlap geometry
      is evaluated.
    error_id: ERR_STALE_ROOM_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  # ---- DUAL-VARIANT #1: Charge patient responsibility, insurance vs cash -----
  - name: charge_patient_responsibility
    trigger: "POST /charges (charge posting); recomputed never after post except on void compensation"
    algorithm: dual_variant_split
    formula: |
      Resolve pay_path = parent Encounter.pay_path at posting time.
      Evaluation order is fixed: (1) deductible_applied_cents, then
      (2) insurer/patient split, then (3) integer rounding — see precision.

      VARIANT INSURANCE (pay_path == INSURANCE):
        allowed   = insurer_allowed_cents                       # payer-negotiated amount
        ded_apply = min(allowed, Patient.insurance_deductible_remaining_cents)
        deductible_applied_cents = ded_apply
        remainder = allowed - ded_apply
        patient_coins = round_half_up(remainder * Patient.insurance_coinsurance_rate)
        patient_responsibility_cents = ded_apply + patient_coins
        insurer_responsibility_cents = allowed - patient_responsibility_cents
        # write-back side effect: Patient.insurance_deductible_remaining_cents -= ded_apply

      VARIANT CASH (pay_path == CASH):
        # cash self-pay price ignores insurer_allowed and deductible entirely
        patient_responsibility_cents = round_half_up(billed_amount_cents * (1 - CASH_PROMPT_PAY_DISCOUNT))
        insurer_responsibility_cents = 0
        deductible_applied_cents = 0
    input_set: "Single Charge row plus its parent Patient's deductible/coinsurance fields at posting time"
    constants:
      CASH_PROMPT_PAY_DISCOUNT: 0.10   # 10% self-pay discount on the billed amount
    precision: "round_half_up to whole cents; rounding applied AFTER the coinsurance/discount multiply, never before"
    variants:
      - { name: insurance, when: "Encounter.pay_path == INSURANCE", difference: "deductible waterfall then coinsurance split; insurer covers remainder" }
      - { name: cash, when: "Encounter.pay_path == CASH", difference: "flat prompt-pay discount on billed amount; insurer owes 0; deductible untouched" }

  # ---- DUAL-VARIANT #2: Membership wallet redemption (different entity domain)-
  - name: cosmetic_redemption_split
    trigger: "POST /cosmetic-treatments"
    algorithm: waterfall_allocation
    formula: |
      Different subject domain from charge_patient_responsibility: this is a
      prepaid-wallet draw on CosmeticMembership, not an insurance ledger.
      tier_discount = TIER_DISCOUNT[membership.tier]            # SILVER=0.05, GOLD=0.15
      discounted_price = round_half_up(list_price_cents * (1 - tier_discount))
      available = membership.unit_balance_cents
      redeemed_cents = min(discounted_price, available)         # waterfall: wallet first
      out_of_pocket_cents = discounted_price - redeemed_cents   # spillover the patient pays cash
      # side effects: membership.unit_balance_cents -= redeemed_cents;
      #               if balance hits 0 -> membership ACTIVE->EXHAUSTED (bubble-up)
    input_set: "Single CosmeticTreatment plus its CosmeticMembership wallet balance"
    constants:
      TIER_DISCOUNT_SILVER: 0.05
      TIER_DISCOUNT_GOLD: 0.15
    precision: "round_half_up to whole cents; the discount multiply rounds BEFORE the wallet min(), so the wallet draws against the rounded discounted price"
    variants:
      - { name: silver, when: "membership.tier == SILVER", difference: "5% tier discount on list price" }
      - { name: gold, when: "membership.tier == GOLD", difference: "15% tier discount on list price" }

  # ---- COMBINATORIAL (mode a): biologic charge with >=3 inputs, nonlinear -----
  - name: biologic_charge_amount
    trigger: "POST /charges with charge_kind == BIOLOGIC"
    algorithm: tiered_pricing
    formula: |
      Mode (a): >=3 inputs (list_price, approved-PA flag, submission_round,
      site-of-care) with nested min/conditional branches.
      base = PriorAuthorization.list_price_cents
      if PriorAuthorization.status != APPROVED: reject (ERR_PA_NOT_APPROVED)
      # multi-round resubmissions incur a payer-imposed step-down on the allowed amount
      round_factor = max(MIN_ROUND_FACTOR, 1 - STEP_DOWN_PER_ROUND * (PriorAuthorization.submission_round - 1))
      allowed_after_rounds = round_half_up(base * round_factor)
      # site-of-care: in-office (default) adds an admin uplift, capped
      uplift = min(ADMIN_UPLIFT_CAP_CENTS, round_half_up(allowed_after_rounds * ADMIN_UPLIFT_RATE))
      billed_amount_cents = allowed_after_rounds + uplift
      # NOTE: for charge_kind==BIOLOGIC the server OVERWRITES the client-supplied
      # billed_amount_cents with this computed value (and copies it to
      # insurer_allowed_cents on the INSURANCE path); the client's billed input
      # is ignored. For non-BIOLOGIC kinds, billed_amount_cents is taken as input.
    input_set: "The BIOLOGIC Charge, its linked approved PriorAuthorization (list_price_cents, submission_round)"
    constants:
      STEP_DOWN_PER_ROUND: 0.05      # each resubmission round beyond the first knocks 5% off allowed
      MIN_ROUND_FACTOR: 0.80         # floor: never below 80% of list
      ADMIN_UPLIFT_RATE: 0.04        # 4% in-office administration uplift
      ADMIN_UPLIFT_CAP_CENTS: 25000  # uplift capped at $250.00
    precision: "round_half_up to whole cents at each named step (round_factor multiply, then uplift), in the stated order"

  # ---- COMBINATORIAL (mode b): deductible waterfall, round-order-pinned -------
  - name: deductible_waterfall
    trigger: "Insurance-path Charge posting and void compensation"
    algorithm: waterfall_allocation
    formula: |
      Mode (b): order-of-rounding matters. Charges post in chronological
      created_at order (tie-break created_at ASC, never id). Each insurance
      charge consumes the patient's remaining deductible BEFORE coinsurance is
      computed. The pinned order is: round EACH charge's coinsurance per-charge
      AFTER its deductible draw (round-per-charge), then sum responsibilities —
      NOT sum-then-round. Two charges that each draw deductible then round
      independently can differ by a cent from a sum-then-round implementation.
      For charge i (processed created_at ASC):
        ded_i = min(allowed_i, deductible_remaining_before_i)
        deductible_remaining_after_i = deductible_remaining_before_i - ded_i
        coins_i = round_half_up((allowed_i - ded_i) * coinsurance_rate)
        patient_i = ded_i + coins_i
      patient_total = sum(patient_i)   # sum of already-rounded per-charge values
    input_set: "All POSTED INSURANCE charges for one Patient, ordered created_at ASC"
    constants: {}
    precision: "round_half_up per-charge BEFORE summing; pinned round-then-sum order"

  # ---- COMBINATORIAL (mode c): out-of-pocket via circular-looking dep --------
  - name: cosmetic_total_due
    trigger: "GET /encounters/{id}/cosmetic-summary"
    algorithm: aggregation
    formula: |
      Mode (c): circular-looking dependency pinned to an explicit order.
      total_due depends on per-treatment out_of_pocket_cents, which itself
      depends on the wallet draw order across treatments. Evaluation order is
      pinned: treatments are applied to the wallet in created_at ASC order
      (tie-break created_at ASC, never id), each fully resolving redeemed_cents
      and out_of_pocket_cents against the running wallet balance BEFORE the next
      treatment is considered. total_due is then the sum of out_of_pocket_cents
      over the encounter's CosmeticTreatments. Because each treatment's
      out-of-pocket is a function of the wallet balance left by all earlier
      treatments, the order is load-bearing and is fixed here.
      total_due = sum over treatments (created_at ASC) of out_of_pocket_cents
    input_set: "All CosmeticTreatment rows for the encounter, ordered created_at ASC"
    constants: {}
    precision: "integer cents; order pinned created_at ASC"

  # ---- Step-therapy satisfaction count ---------------------------------------
  - name: step_therapy_satisfaction
    trigger: "On StepTherapyTrial create/delete and on PriorAuthorization submit precondition check"
    algorithm: aggregation
    formula: |
      satisfied_step_count = count of child StepTherapyTrial rows where
                             outcome == FAILED, for this PriorAuthorization.
      Step therapy is met when satisfied_step_count >= required_step_count.
    input_set: "Child StepTherapyTrial rows of one PriorAuthorization with outcome == FAILED"
    constants: {}
    precision: "integer count"

  # ---- Membership wallet grant ------------------------------------------------
  - name: membership_wallet_grant
    trigger: "POST /cosmetic-memberships/{id}/activate"
    algorithm: threshold
    formula: |
      bonus_rate = TIER_BONUS[tier]              # SILVER=0.00, GOLD=0.10
      unit_balance_cents = purchased_unit_cents + round_half_up(purchased_unit_cents * bonus_rate)
    input_set: "The CosmeticMembership being activated"
    constants:
      TIER_BONUS_SILVER: 0.00
      TIER_BONUS_GOLD: 0.10
    precision: "round_half_up to whole cents"

  # ---- Biopsy recall horizon -------------------------------------------------
  - name: biopsy_recall_horizon
    trigger: "POST /biopsies/{id}/sign-out"
    algorithm: threshold
    formula: |
      recall_months = { BENIGN: 12, INDETERMINATE: 6, MALIGNANT: 3 }[result]
      due_at = clock_current_time + recall_months months
    input_set: "The biopsy being signed out and its result"
    constants:
      BENIGN_MONTHS: 12
      INDETERMINATE_MONTHS: 6
      MALIGNANT_MONTHS: 3
    precision: "whole months added to the logical clock"

  # ---- Routine skin-check recall horizon -------------------------------------
  - name: routine_recall_horizon
    trigger: "Encounter clinical-close where visit_type == SKIN_CHECK"
    algorithm: threshold
    formula: |
      due_at = clock_current_time + ROUTINE_RECALL_MONTHS months
    input_set: "The skin-check encounter being closed"
    constants:
      ROUTINE_RECALL_MONTHS: 12
    precision: "whole months added to the logical clock"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and well-formed"
    error_id: ERR_MISSING_AUTH_CONTEXT
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role is permitted to perform this operation per §1.7"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "All path-referenced resources exist, validated left-to-right"
    error_id: "ERR_*_NOT_FOUND (resource-specific)"
    http_status: 404
    applies_to: all resource endpoints

  - priority: 4
    category: existence
    check: "All body FK references (patient_id, encounter_id, room_id, provider_id, membership_id, prior_auth_id) resolve to existing rows"
    error_id: "ERR_*_NOT_FOUND (resource-specific)"
    http_status: 404
    applies_to: "POST endpoints carrying FK body fields"

  - priority: 5
    category: state
    check: "OCC: expected_<parent>_version (when the endpoint declares it) equals the parent's current version"
    error_id: "ERR_STALE_MEMBERSHIP_VERSION / ERR_STALE_ROOM_VERSION"
    http_status: 412
    applies_to: "POST /cosmetic-treatments, POST /procedure-bookings"
    note: "OCC version check runs before business geometry/balance checks"

  - priority: 6
    category: state
    check: "Target resource is in the correct state for the requested transition"
    error_id: "ERR_*_BAD_STATE / ERR_*_BAD_CLINICAL_STATE / ERR_*_BAD_BILLING_STATE"
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 7
    category: business_safety
    check: "MOHS ProcedureBooking requires room.room_kind == MOHS_SUITE"
    error_id: ERR_MOHS_REQUIRES_MOHS_SUITE
    http_status: 422
    applies_to: "POST /procedure-bookings"

  - priority: 8
    category: business_safety
    check: "MOHS ProcedureBooking requires provider.can_perform_mohs == true"
    error_id: ERR_PROVIDER_NOT_MOHS_CREDENTIALED
    http_status: 422
    applies_to: "POST /procedure-bookings"

  - priority: 9
    category: business_constraint
    check: "ProcedureBooking end_at must be strictly after start_at"
    error_id: ERR_INVALID_INTERVAL
    http_status: 422
    applies_to: "POST /procedure-bookings"

  - priority: 10
    category: business_temporal
    check: "ProcedureBooking interval must not overlap any BOOKED/COMPLETED booking on the same room, where the prior booking reserves the HALF-OPEN window [start, end + room.turnover_buffer_minutes minutes). Touching endpoints (new.start == prior_end + buffer) do NOT overlap and are allowed."
    error_id: ERR_ROOM_INTERVAL_CONFLICT
    http_status: 409
    applies_to: "POST /procedure-bookings"
    note: "Room semantics: half-open with an additive turnover buffer appended to the prior booking's end."

  - priority: 10.5
    category: business_temporal
    check: "ProcedureBooking interval must not overlap any BOOKED/COMPLETED booking for the same provider, treating each prior booking as the CLOSED interval [start, end] with NO buffer. Touching endpoints (new.start == prior_end) DO overlap and are rejected — a provider cannot be in two procedures whose endpoints coincide."
    error_id: ERR_PROVIDER_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /procedure-bookings"
    note: "Provider semantics differ from Room: CLOSED interval, no turnover buffer; the geometric adjacency treatment is the opposite of the room rule."

  - priority: 11
    category: business_constraint
    check: "Encounter clinical-close blocked while any child Biopsy is in {COLLECTED, AT_LAB} (open_biopsy_count > 0)"
    error_id: ERR_OPEN_BIOPSY_BLOCKS_CLOSE
    http_status: 409
    applies_to: "POST /encounters/{id}/clinical-close"

  - priority: 12
    category: business_referential
    check: "BIOLOGIC charge requires a non-null prior_auth_id whose PriorAuthorization.status == APPROVED"
    error_id: ERR_PA_NOT_APPROVED
    http_status: 422
    applies_to: "POST /charges (charge_kind == BIOLOGIC)"

  - priority: 13
    category: business_constraint
    check: "PriorAuthorization submit requires satisfied_step_count >= required_step_count"
    error_id: ERR_STEP_THERAPY_NOT_MET
    http_status: 422
    applies_to: "POST /prior-authorizations/{id}/submit"

  - priority: 14
    category: business_constraint
    check: "Charge may not be posted against an encounter whose billing_status != BILLING_OPEN"
    error_id: ERR_ENCOUNTER_BILLING_LOCKED
    http_status: 409
    applies_to: "POST /charges"

  - priority: 15
    category: business_constraint
    check: "CosmeticTreatment requires its encounter.visit_type == COSMETIC and its membership.status == ACTIVE"
    error_id: ERR_MEMBERSHIP_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /cosmetic-treatments"

  - priority: 16
    category: business_fiscal
    check: "INSURANCE-path charge requires a non-null insurer_allowed_cents; CASH-path requires it omitted/null"
    error_id: ERR_ALLOWED_AMOUNT_REQUIRED
    http_status: 422
    applies_to: "POST /charges"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Test-driving: logical clock -----------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock to an absolute UTC instant. Server startup default is 2026-01-01T00:00:00Z; before any call the clock reads exactly this default and never falls back to real wall-clock time. All due_at/recall computations read this clock."
    roles: [PracticeAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["Advances/sets the logical clock used by recall horizons, recall sweep, and 'now' comparisons"]

  - method: POST
    path: "/_recall/sweep"
    description: "Fire all PENDING RecallReminder rows whose due_at <= clock current time, transitioning each PENDING -> SENT. Returns the swept reminders."
    roles: [PracticeAdmin, FrontDesk]
    code: 200
    input: []
    output: RecallReminder[]
    side_effects: ["For each due PENDING reminder: status -> SENT, increments RecallReminder.version by 1"]

  # ---- Providers ------------------------------------------------------------
  - method: POST
    path: "/providers"
    description: "Create a provider"
    roles: [PracticeAdmin]
    code: 201
    input: [full_name, npi, "can_perform_mohs?", "active?"]
    output: Provider
    side_effects: []

  - method: GET
    path: "/providers/{id}"
    description: "Get a provider"
    roles: [PracticeAdmin, FrontDesk, Provider, BillingSpecialist, PathLab]
    code: 200
    input: []
    output: Provider

  - method: GET
    path: "/providers"
    description: "List providers"
    roles: [PracticeAdmin, FrontDesk, Provider, BillingSpecialist, PathLab]
    code: 200
    input: ["limit?", "offset?"]
    output: Provider[]

  # ---- Rooms ----------------------------------------------------------------
  - method: POST
    path: "/rooms"
    description: "Create a procedure room"
    roles: [PracticeAdmin]
    code: 201
    input: [name, room_kind, "turnover_buffer_minutes?"]
    output: Room
    side_effects: []

  - method: GET
    path: "/rooms/{id}"
    description: "Get a room"
    roles: [PracticeAdmin, FrontDesk, Provider]
    code: 200
    input: []
    output: Room

  - method: GET
    path: "/rooms"
    description: "List rooms"
    roles: [PracticeAdmin, FrontDesk, Provider]
    code: 200
    input: ["limit?", "offset?"]
    output: Room[]

  # ---- Patients -------------------------------------------------------------
  - method: POST
    path: "/patients"
    description: "Register a patient"
    roles: [FrontDesk, PracticeAdmin]
    code: 201
    input: [full_name, date_of_birth, "has_active_insurance?", "insurance_coinsurance_rate?", "insurance_deductible_remaining_cents?"]
    output: Patient
    side_effects: []

  - method: GET
    path: "/patients/{id}"
    description: "Get a patient (includes computed last_skin_check_at and deductible remaining)"
    roles: [FrontDesk, PracticeAdmin, Provider, BillingSpecialist]
    code: 200
    input: []
    output: Patient

  - method: GET
    path: "/patients"
    description: "List patients"
    roles: [FrontDesk, PracticeAdmin, Provider, BillingSpecialist]
    code: 200
    input: ["limit?", "offset?"]
    output: Patient[]

  # ---- Encounters (flat top-level; patient_id in body) ----------------------
  - method: POST
    path: "/encounters"
    description: "Schedule an encounter (visit). pay_path defaults from patient.has_active_insurance for MEDICAL/SKIN_CHECK; COSMETIC is forced CASH."
    roles: [FrontDesk, PracticeAdmin]
    code: 201
    input: [patient_id, provider_id, visit_type, scheduled_at, "pay_path?"]
    output: Encounter
    side_effects: ["clinical_status=SCHEDULED, billing_status=BILLING_OPEN, open_biopsy_count=0"]

  - method: GET
    path: "/encounters/{id}"
    description: "Get an encounter (includes computed open_biopsy_count and both status dimensions)"
    roles: [FrontDesk, PracticeAdmin, Provider, BillingSpecialist]
    code: 200
    input: []
    output: Encounter

  - method: GET
    path: "/encounters"
    description: "List encounters; filterable by patient_id (reverse-reachability for Encounter.patient_id) and provider_id (for Encounter.provider_id)"
    roles: [FrontDesk, PracticeAdmin, Provider, BillingSpecialist]
    code: 200
    input: ["patient_id?", "provider_id?", "limit?", "offset?"]
    output: Encounter[]

  - method: POST
    path: "/encounters/{id}/check-in"
    description: "Clinical transition SCHEDULED -> CHECKED_IN"
    roles: [FrontDesk]
    code: 200
    input: []
    output: Encounter
    side_effects: ["clinical_status -> CHECKED_IN, increments Encounter.version by 1"]

  - method: POST
    path: "/encounters/{id}/start"
    description: "Clinical transition CHECKED_IN -> IN_PROGRESS"
    roles: [Provider]
    code: 200
    input: []
    output: Encounter
    side_effects: ["clinical_status -> IN_PROGRESS, increments Encounter.version by 1"]

  - method: POST
    path: "/encounters/{id}/clinical-close"
    description: "Clinical transition IN_PROGRESS -> CLINICALLY_CLOSED; blocked by open biopsies; SKIN_CHECK sets last_skin_check_at and spawns routine recall"
    roles: [Provider]
    code: 200
    input: []
    output: Encounter
    side_effects: ["clinical_status -> CLINICALLY_CLOSED", "if SKIN_CHECK: Patient.last_skin_check_at set, spawn ROUTINE_SKIN_CHECK RecallReminder", "increments Encounter.version by 1"]

  - method: POST
    path: "/encounters/{id}/cancel"
    description: "Clinical transition SCHEDULED|CHECKED_IN -> CANCELLED"
    roles: [FrontDesk]
    code: 200
    input: []
    output: Encounter
    side_effects: ["clinical_status -> CANCELLED, increments Encounter.version by 1"]

  - method: POST
    path: "/encounters/{id}/finalize-billing"
    description: "Billing transition BILLING_OPEN -> BILLING_FINALIZED (requires clinical_status == CLINICALLY_CLOSED); locks new charge posting"
    roles: [BillingSpecialist]
    code: 200
    input: []
    output: Encounter
    side_effects: ["billing_status -> BILLING_FINALIZED, increments Encounter.version by 1"]

  - method: POST
    path: "/encounters/{id}/void-billing"
    description: "Billing transition BILLING_OPEN -> BILLING_VOID (requires clinical_status == CANCELLED); cascade-voids posted charges and restores deductible"
    roles: [BillingSpecialist]
    code: 200
    input: []
    output: Encounter
    side_effects: ["billing_status -> BILLING_VOID", "cascade: child POSTED Charges -> VOIDED with deductible restoration", "increments Encounter.version by 1"]

  - method: GET
    path: "/encounters/{id}/cosmetic-summary"
    description: "Computed read: total cosmetic out-of-pocket due for the encounter (calc cosmetic_total_due)"
    roles: [FrontDesk, PracticeAdmin, BillingSpecialist]
    code: 200
    input: []
    output: "{ encounter_id: string, total_due_cents: integer, treatment_count: integer }"

  # ---- SkinExamPhoto (flat top-level; encounter_id in body) -----------------
  - method: POST
    path: "/skin-exam-photos"
    description: "Attach a mole-map photo to an encounter (append-only)"
    roles: [Provider, PracticeAdmin]
    code: 201
    input: [encounter_id, body_site, mole_map_x, mole_map_y, image_ref]
    output: SkinExamPhoto
    side_effects: []

  - method: GET
    path: "/skin-exam-photos/{id}"
    description: "Get a mole-map photo"
    roles: [Provider, PracticeAdmin, FrontDesk]
    code: 200
    input: []
    output: SkinExamPhoto

  - method: GET
    path: "/skin-exam-photos"
    description: "List mole-map photos; filterable by encounter_id (reverse-reachability for SkinExamPhoto.encounter_id)"
    roles: [Provider, PracticeAdmin, FrontDesk]
    code: 200
    input: ["encounter_id?", "limit?", "offset?"]
    output: SkinExamPhoto[]

  # ---- Biopsies -------------------------------------------------------------
  - method: POST
    path: "/biopsies"
    description: "Collect a biopsy during an encounter (encounter must be IN_PROGRESS). patient_id copied from encounter."
    roles: [Provider]
    code: 201
    input: [encounter_id, body_site]
    output: Biopsy
    side_effects: ["status=COLLECTED", "recompute parent Encounter.open_biopsy_count (bubble-up)"]

  - method: GET
    path: "/biopsies/{id}"
    description: "Get a biopsy"
    roles: [Provider, PathLab, PracticeAdmin, BillingSpecialist]
    code: 200
    input: []
    output: Biopsy

  - method: GET
    path: "/biopsies"
    description: "List biopsies; filterable by encounter_id (reverse-reachability for Biopsy.encounter_id) and patient_id (reverse-reachability for Biopsy.patient_id)"
    roles: [Provider, PathLab, PracticeAdmin, BillingSpecialist]
    code: 200
    input: ["encounter_id?", "patient_id?", "limit?", "offset?"]
    output: Biopsy[]

  - method: POST
    path: "/biopsies/{id}/send-to-lab"
    description: "Transition COLLECTED -> AT_LAB"
    roles: [Provider]
    code: 200
    input: []
    output: Biopsy
    side_effects: ["status -> AT_LAB, increments Biopsy.version by 1"]

  - method: POST
    path: "/biopsies/{id}/result"
    description: "PathLab posts result; transition AT_LAB -> RESULTED; recomputes encounter open_biopsy_count"
    roles: [PathLab]
    code: 200
    input: [result]
    output: Biopsy
    side_effects: ["status -> RESULTED, set result, bubble-up Encounter.open_biopsy_count, increments Biopsy.version by 1"]

  - method: POST
    path: "/biopsies/{id}/sign-out"
    description: "Transition RESULTED -> SIGNED_OUT; sets recall_months and spawns a BIOPSY_FOLLOWUP recall; malignant supersedes routine recalls"
    roles: [Provider]
    code: 200
    input: []
    output: Biopsy
    side_effects: ["status -> SIGNED_OUT, set recall_months", "spawn BIOPSY_FOLLOWUP RecallReminder", "if MALIGNANT: dismiss patient's PENDING ROUTINE_SKIN_CHECK reminders", "increments Biopsy.version by 1"]

  - method: POST
    path: "/biopsies/{id}/cancel"
    description: "Transition COLLECTED -> CANCELLED; recomputes encounter open_biopsy_count"
    roles: [Provider]
    code: 200
    input: []
    output: Biopsy
    side_effects: ["status -> CANCELLED, bubble-up Encounter.open_biopsy_count, increments Biopsy.version by 1"]

  # ---- Procedure bookings ---------------------------------------------------
  - method: POST
    path: "/procedure-bookings"
    description: "Book a procedure interval on a room (OCC on room version). Enforces MOHS suite/credential, interval validity, room overlap (half-open + turnover buffer), and provider double-booking (closed interval, no buffer)."
    roles: [FrontDesk, PracticeAdmin]
    code: 201
    input: [room_id, provider_id, encounter_id, procedure_kind, start_at, end_at, expected_room_version]
    output: ProcedureBooking
    side_effects: ["status=BOOKED, increments Room.version by 1 (room interval reserved)"]

  - method: GET
    path: "/procedure-bookings/{id}"
    description: "Get a booking"
    roles: [FrontDesk, PracticeAdmin, Provider]
    code: 200
    input: []
    output: ProcedureBooking

  - method: GET
    path: "/procedure-bookings"
    description: "List bookings; filterable by room_id (reverse-reachability for ProcedureBooking.room_id), provider_id (for ProcedureBooking.provider_id) and encounter_id (for ProcedureBooking.encounter_id)"
    roles: [FrontDesk, PracticeAdmin, Provider]
    code: 200
    input: ["room_id?", "provider_id?", "encounter_id?", "limit?", "offset?"]
    output: ProcedureBooking[]

  - method: POST
    path: "/procedure-bookings/{id}/complete"
    description: "Transition BOOKED -> COMPLETED (linked encounter must be IN_PROGRESS)"
    roles: [Provider]
    code: 200
    input: []
    output: ProcedureBooking
    side_effects: ["status -> COMPLETED, increments ProcedureBooking.version by 1"]

  - method: POST
    path: "/procedure-bookings/{id}/cancel"
    description: "Transition BOOKED -> CANCELLED; frees the room interval"
    roles: [FrontDesk]
    code: 200
    input: []
    output: ProcedureBooking
    side_effects: ["status -> CANCELLED, increments ProcedureBooking.version by 1, room interval freed"]

  # ---- Prior authorizations -------------------------------------------------
  - method: POST
    path: "/prior-authorizations"
    description: "Create a prior-authorization request (DRAFT)"
    roles: [BillingSpecialist]
    code: 201
    input: [patient_id, drug_name, required_step_count, list_price_cents]
    output: PriorAuthorization
    side_effects: ["status=DRAFT, satisfied_step_count=0, submission_round=0"]

  - method: GET
    path: "/prior-authorizations/{id}"
    description: "Get a prior-authorization (includes computed satisfied_step_count, submission_round)"
    roles: [BillingSpecialist, PracticeAdmin, Provider]
    code: 200
    input: []
    output: PriorAuthorization

  - method: GET
    path: "/prior-authorizations"
    description: "List prior-authorizations; filterable by patient_id (reverse-reachability for PriorAuthorization.patient_id)"
    roles: [BillingSpecialist, PracticeAdmin, Provider]
    code: 200
    input: ["patient_id?", "limit?", "offset?"]
    output: PriorAuthorization[]

  - method: POST
    path: "/prior-authorizations/{id}/step-therapy-trials"
    description: "Record a prior step-therapy drug trial under a PA (recomputes satisfied_step_count)"
    roles: [BillingSpecialist]
    code: 201
    input: [drug_name, outcome]
    output: StepTherapyTrial
    side_effects: ["recompute PriorAuthorization.satisfied_step_count (count outcome==FAILED), increments PriorAuthorization.version by 1"]

  - method: GET
    path: "/prior-authorizations/{id}/step-therapy-trials"
    description: "List step-therapy trials under a PA (reverse-reachability for StepTherapyTrial.prior_auth_id)"
    roles: [BillingSpecialist, PracticeAdmin, Provider]
    code: 200
    input: ["limit?", "offset?"]
    output: StepTherapyTrial[]

  - method: POST
    path: "/prior-authorizations/{id}/submit"
    description: "Transition DRAFT|DENIED -> SUBMITTED; requires step therapy met; increments submission_round"
    roles: [BillingSpecialist]
    code: 200
    input: []
    output: PriorAuthorization
    side_effects: ["status -> SUBMITTED, increments submission_round by 1, increments PriorAuthorization.version by 1"]

  - method: POST
    path: "/prior-authorizations/{id}/adjudicate"
    description: "Transition SUBMITTED -> APPROVED or DENIED per decision"
    roles: [BillingSpecialist]
    code: 200
    input: [decision]
    output: PriorAuthorization
    side_effects: ["status -> APPROVED|DENIED, increments PriorAuthorization.version by 1"]

  # ---- Cosmetic memberships -------------------------------------------------
  - method: POST
    path: "/cosmetic-memberships"
    description: "Create a prepaid cosmetic membership (PENDING)"
    roles: [BillingSpecialist, FrontDesk]
    code: 201
    input: [patient_id, tier, purchased_unit_cents]
    output: CosmeticMembership
    side_effects: ["status=PENDING, unit_balance_cents=0"]

  - method: GET
    path: "/cosmetic-memberships/{id}"
    description: "Get a membership (includes computed unit_balance_cents)"
    roles: [BillingSpecialist, FrontDesk, PracticeAdmin]
    code: 200
    input: []
    output: CosmeticMembership

  - method: GET
    path: "/cosmetic-memberships"
    description: "List memberships; filterable by patient_id (reverse-reachability for CosmeticMembership.patient_id)"
    roles: [BillingSpecialist, FrontDesk, PracticeAdmin]
    code: 200
    input: ["patient_id?", "limit?", "offset?"]
    output: CosmeticMembership[]

  - method: POST
    path: "/cosmetic-memberships/{id}/activate"
    description: "Transition PENDING -> ACTIVE; grants wallet (purchased + tier bonus)"
    roles: [BillingSpecialist]
    code: 200
    input: []
    output: CosmeticMembership
    side_effects: ["status -> ACTIVE, set unit_balance_cents via membership_wallet_grant, increments CosmeticMembership.version by 1"]

  - method: POST
    path: "/cosmetic-memberships/{id}/cancel"
    description: "Transition PENDING|ACTIVE -> CANCELLED; forfeits remaining wallet"
    roles: [BillingSpecialist]
    code: 200
    input: []
    output: CosmeticMembership
    side_effects: ["status -> CANCELLED, unit_balance_cents -> 0, increments CosmeticMembership.version by 1"]

  # ---- Cosmetic treatments --------------------------------------------------
  - method: POST
    path: "/cosmetic-treatments"
    description: "Redeem a cosmetic treatment against a membership wallet (OCC on membership version). Computes redeemed/out-of-pocket; may bubble membership to EXHAUSTED."
    roles: [Provider, BillingSpecialist]
    code: 201
    input: [encounter_id, membership_id, service_name, list_price_cents, expected_membership_version]
    output: CosmeticTreatment
    side_effects: ["compute redeemed_cents/out_of_pocket_cents via cosmetic_redemption_split", "debit CosmeticMembership.unit_balance_cents, increments CosmeticMembership.version by 1", "if balance hits 0: membership ACTIVE -> EXHAUSTED"]

  - method: GET
    path: "/cosmetic-treatments/{id}"
    description: "Get a cosmetic treatment"
    roles: [Provider, BillingSpecialist, PracticeAdmin]
    code: 200
    input: []
    output: CosmeticTreatment

  - method: GET
    path: "/cosmetic-treatments"
    description: "List cosmetic treatments; filterable by encounter_id (reverse-reachability for CosmeticTreatment.encounter_id) and membership_id (for CosmeticTreatment.membership_id)"
    roles: [Provider, BillingSpecialist, PracticeAdmin]
    code: 200
    input: ["encounter_id?", "membership_id?", "limit?", "offset?"]
    output: CosmeticTreatment[]

  # ---- Charges --------------------------------------------------------------
  - method: POST
    path: "/charges"
    description: "Post a charge against an encounter. Computes patient_responsibility via insurance-vs-cash split; BIOLOGIC requires approved PA; deductible waterfall applies on INSURANCE path."
    roles: [BillingSpecialist]
    code: 201
    input: [patient_id, encounter_id, source_kind, charge_kind, billed_amount_cents, "insurer_allowed_cents?", "prior_auth_id?", "cosmetic_treatment_id?"]
    output: Charge
    side_effects: ["status=POSTED", "if charge_kind==BIOLOGIC: overwrite billed_amount_cents (and INSURANCE-path insurer_allowed_cents) from biologic_charge_amount, ignoring client-supplied amounts", "compute patient_responsibility_cents/insurer_responsibility_cents/deductible_applied_cents via charge_patient_responsibility", "INSURANCE path: debit Patient.insurance_deductible_remaining_cents"]

  - method: GET
    path: "/charges/{id}"
    description: "Get a charge (includes computed responsibilities)"
    roles: [BillingSpecialist, PracticeAdmin, Provider]
    code: 200
    input: []
    output: Charge

  - method: GET
    path: "/charges"
    description: "List charges; filterable by patient_id (reverse-reachability for Charge.patient_id), encounter_id (for Charge.encounter_id), prior_auth_id (for Charge.prior_auth_id) and cosmetic_treatment_id (for Charge.cosmetic_treatment_id)"
    roles: [BillingSpecialist, PracticeAdmin, Provider]
    code: 200
    input: ["patient_id?", "encounter_id?", "prior_auth_id?", "cosmetic_treatment_id?", "limit?", "offset?"]
    output: Charge[]

  - method: POST
    path: "/charges/{id}/pay"
    description: "Transition POSTED -> PAID"
    roles: [BillingSpecialist]
    code: 200
    input: []
    output: Charge
    side_effects: ["status -> PAID, increments Charge.version by 1"]

  - method: POST
    path: "/charges/{id}/void"
    description: "Transition POSTED -> VOIDED; compensation restores deductible (insurance) and wallet (cosmetic)"
    roles: [BillingSpecialist]
    code: 200
    input: []
    output: Charge
    side_effects: ["status -> VOIDED", "if INSURANCE: restore Patient.insurance_deductible_remaining_cents += deductible_applied_cents", "if COSMETIC_TREATMENT source: restore membership wallet", "increments Charge.version by 1"]

  # ---- Recall reminders -----------------------------------------------------
  - method: POST
    path: "/recall-reminders"
    description: "Create a routine recall reminder manually"
    roles: [FrontDesk, PracticeAdmin]
    code: 201
    input: [patient_id, reason, due_at]
    output: RecallReminder
    side_effects: ["status=PENDING"]

  - method: GET
    path: "/recall-reminders/{id}"
    description: "Get a recall reminder"
    roles: [FrontDesk, PracticeAdmin, Provider]
    code: 200
    input: []
    output: RecallReminder

  - method: GET
    path: "/recall-reminders"
    description: "List recall reminders; filterable by patient_id (reverse-reachability for RecallReminder.patient_id) and biopsy_id (for RecallReminder.biopsy_id)"
    roles: [FrontDesk, PracticeAdmin, Provider]
    code: 200
    input: ["patient_id?", "biopsy_id?", "status?", "limit?", "offset?"]
    output: RecallReminder[]

  - method: POST
    path: "/recall-reminders/{id}/dismiss"
    description: "Transition PENDING -> DISMISSED"
    roles: [FrontDesk]
    code: 200
    input: []
    output: RecallReminder
    side_effects: ["status -> DISMISSED, increments RecallReminder.version by 1"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- auth ---
  - { id: ERR_MISSING_AUTH_CONTEXT, http: 401, condition: "X-User-ID or X-User-Role header missing or malformed" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role not permitted for this operation per §1.7" }

  # --- not found ---
  - { id: ERR_PATIENT_NOT_FOUND, http: 404, condition: "Patient id does not resolve" }
  - { id: ERR_PROVIDER_NOT_FOUND, http: 404, condition: "Provider id does not resolve" }
  - { id: ERR_ROOM_NOT_FOUND, http: 404, condition: "Room id does not resolve" }
  - { id: ERR_ENCOUNTER_NOT_FOUND, http: 404, condition: "Encounter id does not resolve" }
  - { id: ERR_BIOPSY_NOT_FOUND, http: 404, condition: "Biopsy id does not resolve" }
  - { id: ERR_BOOKING_NOT_FOUND, http: 404, condition: "ProcedureBooking id does not resolve" }
  - { id: ERR_PA_NOT_FOUND, http: 404, condition: "PriorAuthorization id does not resolve" }
  - { id: ERR_MEMBERSHIP_NOT_FOUND, http: 404, condition: "CosmeticMembership id does not resolve" }
  - { id: ERR_TREATMENT_NOT_FOUND, http: 404, condition: "CosmeticTreatment id does not resolve" }
  - { id: ERR_CHARGE_NOT_FOUND, http: 404, condition: "Charge id does not resolve" }
  - { id: ERR_RECALL_NOT_FOUND, http: 404, condition: "RecallReminder id does not resolve" }

  # --- input validation ---
  - { id: ERR_INVALID_REQUEST, http: 422, condition: "Malformed body, missing required field, or bad enum value" }
  - { id: ERR_INVALID_BIOPSY_RESULT, http: 422, condition: "result not in {BENIGN, MALIGNANT, INDETERMINATE}" }
  - { id: ERR_INVALID_INTERVAL, http: 422, condition: "ProcedureBooking end_at not strictly after start_at" }
  - { id: ERR_ALLOWED_AMOUNT_REQUIRED, http: 422, condition: "INSURANCE charge missing insurer_allowed_cents, or CASH charge supplied one" }

  # --- OCC ---
  - { id: ERR_STALE_MEMBERSHIP_VERSION, http: 412, condition: "expected_membership_version != CosmeticMembership.version" }
  - { id: ERR_STALE_ROOM_VERSION, http: 412, condition: "expected_room_version != Room.version" }

  # --- state ---
  - { id: ERR_ENCOUNTER_BAD_CLINICAL_STATE, http: 409, condition: "Encounter clinical_status invalid for the requested clinical transition" }
  - { id: ERR_ENCOUNTER_BAD_BILLING_STATE, http: 409, condition: "Encounter billing_status invalid for the requested billing transition" }
  - { id: ERR_ENCOUNTER_NOT_CLINICALLY_CLOSED, http: 409, condition: "finalize-billing attempted while clinical_status != CLINICALLY_CLOSED" }
  - { id: ERR_ENCOUNTER_NOT_CANCELLED, http: 409, condition: "void-billing attempted while clinical_status != CANCELLED" }
  - { id: ERR_ENCOUNTER_NOT_IN_PROGRESS, http: 409, condition: "Operation requires the linked encounter to be IN_PROGRESS" }
  - { id: ERR_BIOPSY_BAD_STATE, http: 409, condition: "Biopsy status invalid for the requested transition" }
  - { id: ERR_BOOKING_BAD_STATE, http: 409, condition: "ProcedureBooking status invalid for the requested transition" }
  - { id: ERR_PA_BAD_STATE, http: 409, condition: "PriorAuthorization status invalid for the requested transition" }
  - { id: ERR_MEMBERSHIP_BAD_STATE, http: 409, condition: "CosmeticMembership status invalid for the requested transition" }
  - { id: ERR_CHARGE_BAD_STATE, http: 409, condition: "Charge status invalid for the requested transition" }
  - { id: ERR_RECALL_BAD_STATE, http: 409, condition: "RecallReminder status invalid for the requested transition" }

  # --- business ---
  - { id: ERR_MOHS_REQUIRES_MOHS_SUITE, http: 422, condition: "MOHS booking on a room whose room_kind != MOHS_SUITE" }
  - { id: ERR_PROVIDER_NOT_MOHS_CREDENTIALED, http: 422, condition: "MOHS booking with a provider whose can_perform_mohs != true" }
  - { id: ERR_ROOM_INTERVAL_CONFLICT, http: 409, condition: "Booking interval overlaps an existing room booking (half-open) including its turnover buffer" }
  - { id: ERR_PROVIDER_DOUBLE_BOOKED, http: 409, condition: "Booking interval overlaps an existing booking for the same provider (closed interval, no buffer)" }
  - { id: ERR_OPEN_BIOPSY_BLOCKS_CLOSE, http: 409, condition: "clinical-close attempted while open_biopsy_count > 0" }
  - { id: ERR_PA_NOT_APPROVED, http: 422, condition: "BIOLOGIC charge without an APPROVED linked PriorAuthorization" }
  - { id: ERR_STEP_THERAPY_NOT_MET, http: 422, condition: "PA submit while satisfied_step_count < required_step_count" }
  - { id: ERR_ENCOUNTER_BILLING_LOCKED, http: 409, condition: "Charge post against an encounter whose billing_status != BILLING_OPEN" }
  - { id: ERR_MEMBERSHIP_NOT_ACTIVE, http: 409, condition: "CosmeticTreatment against a non-ACTIVE membership or a non-COSMETIC encounter" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PracticeAdmin
    description: "Operational superset: practice setup (providers, rooms), logical clock, recall sweep. Opaque operator."
    identity: opaque
    exclusive_operations:
      - "POST /providers"
      - "POST /rooms"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /_recall/sweep (with FrontDesk)"
      - "POST /patients (with FrontDesk)"
      - "POST /encounters (with FrontDesk)"
      - "POST /skin-exam-photos (with Provider)"
      - "POST /procedure-bookings (with FrontDesk)"
      - "POST /recall-reminders (with FrontDesk)"
      - "All GET reads"

  - name: FrontDesk
    description: "Scheduling & registration: patients, encounters (schedule/check-in/cancel), bookings, recall dismiss. Opaque operator."
    identity: opaque
    exclusive_operations:
      - "POST /encounters/{id}/check-in"
      - "POST /encounters/{id}/cancel"
      - "POST /procedure-bookings/{id}/cancel"
      - "POST /recall-reminders/{id}/dismiss"
    shared_operations:
      - "POST /patients (with PracticeAdmin)"
      - "POST /encounters (with PracticeAdmin)"
      - "POST /procedure-bookings (with PracticeAdmin)"
      - "POST /recall-reminders (with PracticeAdmin)"
      - "POST /cosmetic-memberships (with BillingSpecialist)"
      - "POST /_recall/sweep (with PracticeAdmin)"
      - "GET reads on patients, encounters, providers, rooms, bookings, recalls, memberships"

  - name: Provider
    description: "Clinical actor: encounter start/clinical-close, biopsies (collect/lab/sign-out/cancel), booking complete, photos, cosmetic treatment. Entity-backed by Provider (X-User-ID == Provider.id)."
    identity: "entity_backed:Provider"
    exclusive_operations:
      - "POST /encounters/{id}/start"
      - "POST /encounters/{id}/clinical-close"
      - "POST /biopsies"
      - "POST /biopsies/{id}/send-to-lab"
      - "POST /biopsies/{id}/sign-out"
      - "POST /biopsies/{id}/cancel"
      - "POST /procedure-bookings/{id}/complete"
    shared_operations:
      - "POST /skin-exam-photos (with PracticeAdmin)"
      - "POST /cosmetic-treatments (with BillingSpecialist)"
      - "GET reads on encounters, biopsies, bookings, prior-authorizations, charges, treatments"

  - name: PathLab
    description: "Pathology lab: posts biopsy results only. Opaque operator."
    identity: opaque
    exclusive_operations:
      - "POST /biopsies/{id}/result"
    shared_operations:
      - "GET reads on biopsies, providers"

  - name: BillingSpecialist
    description: "Revenue cycle: charges, prior-authorizations & step therapy, memberships, billing finalize/void. Opaque operator."
    identity: opaque
    exclusive_operations:
      - "POST /charges"
      - "POST /charges/{id}/pay"
      - "POST /charges/{id}/void"
      - "POST /prior-authorizations"
      - "POST /prior-authorizations/{id}/step-therapy-trials"
      - "POST /prior-authorizations/{id}/submit"
      - "POST /prior-authorizations/{id}/adjudicate"
      - "POST /cosmetic-memberships/{id}/activate"
      - "POST /cosmetic-memberships/{id}/cancel"
      - "POST /encounters/{id}/finalize-billing"
      - "POST /encounters/{id}/void-billing"
    shared_operations:
      - "POST /cosmetic-memberships (with FrontDesk)"
      - "POST /cosmetic-treatments (with Provider)"
      - "GET reads on charges, prior-authorizations, memberships, treatments, encounters, patients"
