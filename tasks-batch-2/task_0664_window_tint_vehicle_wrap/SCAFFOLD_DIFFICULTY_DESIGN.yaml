          (duration+cure_buffer) AND FleetAccount.held_credit_cents drops by total_due -> (2) the
          source Quote reverts ACCEPTED -> (3) re-scheduling a new WO from that quote re-holds both
          quantities. Each hop is caused by the prior hop. Trigger differs from the redo cascade.
