              payload: {}
              as: GamesAdmin
              captures: { ev_status1: $.data.status }
            - call: "POST /senior-games/session-slots/${slot_id}/advance"
              payload: { to_status: "COMPLETED" }
              as: GamesAdmin
              captures: { slot_status2: $.data.status }
            - call: "GET /senior-games/sport-events/${ev_id}"
              payload: {}
              as: GamesAdmin
              captures: { ev_status2: $.data.status }
            - call: "GET /senior-games/personnel-assignments/${asg_id}"
              payload: {}
              as: GamesAdmin
              captures: { asg_status2: $.data.status }
            - call: "GET /senior-games/personnel/${pers_id}"
              payload: {}
              as: GamesAdmin
              captures: { pers_minutes: $.data.assigned_minutes_total, pers_no_show: $.data.no_show_count }
          assert:
            - "${asg_minutes} == 60 and ${asg_status_confirmed} == \"CONFIRMED\", and SessionSlot.${slot_id}.confirmed_official_count == 1 which met required_official_count 1"
            - "${slot_status1} == \"IN_PROGRESS\" and ${ev_status1} == \"IN_PROGRESS\": the first advance bubbled the event out of SEEDED in the same request"
            - "${slot_status2} == \"COMPLETED\" and ${ev_status2} == \"COMPLETED\": the second advance bubbled the event to terminal because no sibling slot remained in SCHEDULED, IN_PROGRESS or DISPLACED"
            - "${asg_status2} == \"COMPLETED\", reached by cascade rather than by any call on the assignment"
            - "${pers_minutes} == 60, unchanged by the CONFIRMED -> COMPLETED transition, because served minutes stay on the ledger"
            - "${pers_no_show} == 0, since the assignment was confirmed before the slot completed"
            - "SportEvent.${ev_id}.accepted_entry_count == 1 and seeded_at_utc == \"2026-08-01T00:00:00Z\", i.e. the seeding stamp survived both bubble-ups"

      - name: corner_state_machine_cascade_down_venue_close
        claim_type: Side Effect Execution
        grounds:
          - state_machines.Venue.OPEN_to_CLOSED
          - state_machines.SessionSlot.SCHEDULED_to_DISPLACED
          - state_machines.SportEvent.SEEDED_to_SCHEDULE_HOLD
        excluded_because:
          difficulty_instance: venue_close_cascades_slots_assignments_and_personnel_minutes_ledger
          rationale: "The three-level cascade Venue -> SessionSlot -> PersonnelAssignment -> Personnel.assigned_minutes_total, including the SEEDED -> SCHEDULE_HOLD roll-up once every slot is DISPLACED, is already exercised end to end by that §1.8 instance with the full minutes ledger reconciled before and after; a §1.9 duplicate would add no distinguishing coverage."

      - name: corner_state_machine_cross_entity_athlete_withdraw
        claim_type: Side Effect Execution
        grounds:
          - state_machines.Athlete.REGISTERED_to_WITHDRAWN
          - state_machines.SportEntry.ACCEPTED_to_WITHDRAWN
          - state_machines.VillageStay.RESERVED_to_CANCELLED
        excluded_because:
          difficulty_instance: athlete_withdraw_cascades_entry_event_slot_and_bed_night_ledger
          rationale: "That §1.8 instance already drives a single withdraw through SportEntry, SportEvent capacity, SessionSlot release and AccommodationBlock.reserved_bed_nights, asserting each downstream row and both ledgers, which is exactly the cross-entity claim this row would make."

      - name: corner_state_machine_compensation_assignment_release
        claim_type: Side Effect Execution
        grounds:
          - state_machines.PersonnelAssignment.CONFIRMED_to_RELEASED
          - entities.Personnel.fields.assigned_minutes_total
        excluded_because:
          difficulty_instance: assignment_release_restores_personnel_minutes_ledger_without_drift
          rationale: "Reversal without drift, including the second release being refused as terminal so the minutes ledger cannot go negative, is the entire subject of that §1.8 instance."

      - name: corner_state_machine_ledger_sync_village_stay_cancel
        claim_type: Side Effect Execution
        grounds:
          - state_machines.VillageStay.CHECKED_IN_to_CANCELLED
          - entities.AccommodationBlock.fields.reserved_bed_nights
        excluded_because:
          difficulty_instance: village_stay_cancel_restores_block_bed_nights_and_frees_the_night
          rationale: "The before/after reconciliation of AccommodationBlock.reserved_bed_nights on cancel, plus the freed night being immediately re-bookable, is asserted there in full."

      - name: corner_state_machine_parallel_dimensions_advance_independently
        claim_type: Initial State
        grounds:
          - complexity_profile.state_machine_shape
          - state_machines.Athlete.registration_status
          - state_machines.Athlete.medical_status
        excluded_because:
          difficulty_instance: athlete_registration_and_medical_dimensions_advance_independently
          rationale: "That §1.8 instance walks the full product of the two Athlete dimensions and asserts each combined state, which subsumes any single independence claim §1.9 could add beyond the initial-state check already covered by corner_state_machine_initial_state_every_entity_starts_in_its_declared_state."

      - name: corner_state_machine_cyclic_revision_loop_bound
        claim_type: Idempotency
        grounds:
          - state_machines.SportEntry.REVISION_REQUESTED_to_SUBMITTED
          - entities.SportEntry.fields.revision_round
          - validations[priority=82]
        excluded_because:
          difficulty_instance: sport_entry_revision_cycle_allows_two_loops_then_blocks
          rationale: "The loop-count termination condition (two REVISION_REQUESTED -> SUBMITTED cycles, then ERR_REVISION_LIMIT_REACHED) is exercised there with revision_round asserted at every step."

      - name: corner_state_machine_branching_verify_fork_and_protest_join
        claim_type: Valid Transition
        grounds:
          - state_machines.CompetitionResult.SUBMITTED_to_RECORD_PENDING
          - state_machines.CompetitionResult.SUBMITTED_to_VERIFIED
          - state_machines.CompetitionResult.PROTESTED_to_SUBMITTED
        excluded_because:
          difficulty_instance: competition_result_verify_fork_then_protest_remeasure_join
          rationale: "Both fork arms (RECORD_PENDING and VERIFIED) and the PROTESTED -> SUBMITTED re-entry join are already driven and asserted by that §1.8 instance."

      - name: corner_state_machine_guarded_transition_slot_requires_open_venue
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.SessionSlot.SCHEDULED_to_IN_PROGRESS
          - validations[priority=44]
          - errors[ERR_VENUE_CLOSED]
        excluded_because:
          difficulty_instance: session_slot_placement_requires_venue_open_dimension
          rationale: "The cross-entity guard (slot writes refused with ERR_VENUE_CLOSED once the venue leaves OPEN, and permitted while it is OPEN) is the explicit subject of that §1.8 instance."

  - section: calculations
    instances:

      - name: corner_calculation_national_qualification_flag_inclusive_boundary_and_null_standard
        claim_type: Correct Result
        grounds:
          - calculations.national_qualification_flag
          - entities.SportEvent.fields.national_qualifying_standard
          - entities.Sport.fields.mark_direction
          - entities.CompetitionResult.fields.national_qualifying
        distinguishing_aspect: "Under LOWER_IS_BETTER a mark exactly equal to national_qualifying_standard qualifies (the comparison is <=, not <), a slower mark does not, and an event whose standard is null yields national_qualifying == false rather than an error or a true — three verdicts computed from the same 16.500 mark in one run."
        test_recipe:
          setup:
            - "Standard fixture. TRACK sport with mark_direction LOWER_IS_BETTER. Event EV_A (T100M, 60-64, capacity 8, min_entries_to_stage 1) carries national_qualifying_standard 16.500; event EV_B (T200M, 60-64, same capacity) omits the standard so it stays null. Three athletes born 1966-03-02 are accepted (two into EV_A, one into EV_B), both events are seeded, each event gets one 09:00-10:00 slot on 2026-09-12 at the 4-area North Oval venue with one confirmed OFFICIAL, and the clock is moved to 2026-09-12T09:00:00Z so the slots can be advanced."
