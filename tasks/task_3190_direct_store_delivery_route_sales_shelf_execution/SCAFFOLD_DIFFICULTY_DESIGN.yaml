            - call: "POST /dsd/route-days/${day_id}/load"
              payload: { lots: [{ product_id: "${prod_id}", lot_code: "L-A", expiration_date: "2026-09-20", loaded_cases: 100 }, { product_id: "${prod_id}", lot_code: "L-B", expiration_date: "2026-09-06", loaded_cases: 10 }] }
              as: RouteSalesRep
              as_user_id: "${rep_id}"
            - call: "POST /dsd/route-days/${day_id}/start"
              payload: {}
              as: RouteSalesRep
              as_user_id: "${rep_id}"
            - call: "POST /dsd/orders"
              payload: { route_day_id: "${day_id}", store_id: "${store_id}", lines: [{ product_id: "${prod_id}", qty_cases: 50 }] }
              as: RouteSalesRep
              as_user_id: "${rep_id}"
              captures: { order_id: $.data.id }
            - call: "POST /dsd/orders/${order_id}/submit"
