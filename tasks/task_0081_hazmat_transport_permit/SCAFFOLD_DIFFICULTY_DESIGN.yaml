# SCAFFOLD_DIFFICULTY_DESIGN.yaml — the §1.8 test-targeting index for the
# hazmat-transport-permit benchmark. The sole top-level key is
# `scaffold_difficulty_design:` per the spec's §1.8 file-split convention.
# The doc-generator is forbidden from reading this file (per the spec's
# §1.8 destination-file rule: "this is the one piece of state the doc-
# generator at Step 4 of the pipeline does NOT read, by design — its
# precise numbers and assert-lines must not leak into the PRD prose").
# The unit-test-generator (Step 5) reads this file and uses each worked
# example as the test-recipe for one test in the generated test suite.
#
# Constants table: the named-threshold symbols in SCAFFOLD.yaml's §1.3
# (in the `calculations[].constants` block) have their numeric values
# pinned in the worked-example entries below, attached to the example
# that exercises the constant's boundary. The numeric table is in a
# dedicated `constants_numeric_values` block at the top of the
# scaffold_difficulty_design value, before the rule_id-keyed list, for
# the test layer's convenience.

scaffold_difficulty_design:
  # ─────────────────────────────────────────────────────────────────────
  # Constants — numeric values referenced by the worked examples below.
  # The test-generator copies these literal values into the test fixtures'
  # constants module. The implementation's constants module must match
  # these values exactly for the boundary-precision worked-examples to
  # land on the literal expected outputs.
  # ─────────────────────────────────────────────────────────────────────
  constants_numeric_values:
    # Time-window constants (durations) — see SCAFFOLD.yaml §1.3
    # calc 3's `constants` table for the symbolic introduction of each.
    PERMIT_DEFAULT_VALIDITY_DAYS:    365   # a permit's natural term is one year
    RENEWAL_OPEN_WINDOW_DAYS:        60    # earliest a renewal can be filed before valid_until
    LATE_RENEWAL_GRACE_DAYS:         30    # the inner late-grace window before valid_until; renewals in this window incur the LATE_RENEWAL_PENALTY surcharge
    VOID_ISSUE_WINDOW_HOURS:         24    # the regulator's clerical-error reversal window after issue
    APPEAL_WINDOW_DAYS:              30    # the penalty-appeal window measured from observed_at
    PENALTY_WINDOW_DAYS:             365   # the rolling-window length for the driver's penalty-point total
    INSPECTION_VALIDITY_DAYS:        180   # a vehicle inspection's `valid_until - inspected_at` span
    ENDORSEMENT_RENEWAL_GRACE_DAYS:  0     # zero-grace on driver-endorsement-validity (the contrast with the permit's 30-day late-grace)

    # Threshold constants
    THRESHOLD_DRIVER_SUSPENSION_POINTS: 12      # the driver's rolling-365-day points cutoff (>= flips to INVALID)
    MAX_HAZMAT_SPEED_KPH:             80.0     # speed-limit for hazmat vehicles (strict-greater-than is a violation)
    OFF_ROUTE_RADIUS_M:               500.0    # off-route corridor's half-width (strict-greater-than is a violation)
    MAX_VEHICLES_PER_PERMIT:          20       # vehicle-list-cardinality upper bound on POST /permits
    EARTH_RADIUS_M:                   6371000.0  # WGS-84 mean Earth radius for the haversine-segment distance

    # Fee constants (in cents — integer arithmetic, no float-rounding)
    BASE_RENEWAL_FEE_CENTS:           500000   # ¥5000.00 base (using yuan-cents convention, but the API's numeric is just integer-cents and the currency name is out of scope)
    PER_VEHICLE_SURCHARGE_CENTS:      30000    # ¥300.00 per vehicle on the permit's list
    LATE_RENEWAL_PENALTY_CENTS:       200000   # ¥2000.00 flat penalty for renewals in the late-grace window
    MAX_RENEWAL_FEE_CENTS:            5000000  # ¥50000.00 hard cap on the total fee

    # Auto-penalty point values (for GPS-violation-source penalties)
    GPS_VIOLATION_SPEED_POINTS:       3        # points per speeding GPS sample
    GPS_VIOLATION_OFF_ROUTE_POINTS:   4        # points per off-route GPS sample

    # Idempotency-key length bounds (the Idempotency-Key header's regex)
    IDEMPOTENCY_KEY_MIN_CHARS:        8
    IDEMPOTENCY_KEY_MAX_CHARS:        128

    # Penalty manual-issue range
    MANUAL_PENALTY_POINTS_MIN:        1
    MANUAL_PENALTY_POINTS_MAX:        50

    # The clock-advance endpoint's safety cap (in seconds), to prevent
    # overflowing the year-9999 datetime ceiling on a runaway test.
    CLOCK_ADVANCE_MAX_SECONDS:        3155760000  # 100 years' worth of seconds, conservative

    # Initial company wallet balance (the operator's wallet on POST /companies
    # response — set to zero and the operator must top up via the out-of-band
    # bookkeeping channel before any fee-paying action. Tests bypass this
    # by directly setting the wallet via a fixture helper, since there's
    # no public wallet-topup endpoint in the API surface; the test layer
    # writes the wallet's initial value directly into the DB. This is the
    # canonical 'out-of-band' affordance.).
    INITIAL_WALLET_BALANCE_CENTS:     0

  # ─────────────────────────────────────────────────────────────────────
  # Worked examples, grouped by §0.5 rule_id. Each entry is one test
  # whose docstring cites the entry's `name` field for the index-back-
  # reference convention. The test-generator copies the `test_recipe`
  # block's setup/trigger/assert lines into a pytest test function
  # almost verbatim, replacing the "<...>" placeholders with the
  # corresponding fixture-helper calls.
  # ─────────────────────────────────────────────────────────────────────

  worked_examples_by_rule_id:
    # §0.5 Rule 1 — dual_variant_calc — ≥ 2 instances, on different entity domains.
    dual_variant_calc:
      instances:

        - name: permit_validity_snapshot_disagrees_with_live_after_driver_endorsement_flip
          grounds:
            - "calculations.permit_validity_check (its two variants: snapshot and live)"
            - "state_machines.Driver.hazmat_endorsement_status (VALID→INVALID transition fired by the system on a manual revoke or a points-threshold crossing)"
            - "state_machines.Permit.lifecycle_status (the ACTIVE→SUSPENDED transition fired by the next verify-compliance observing the disagreement)"
            - "endpoints.POST /v1/drivers/{driver_id}/refresh-endorsement (the regulator's revoke variant with body.revoke=true is the trigger for the driver-side flip in this scenario)"
            - "endpoints.POST /v1/permits/{permit_id}/verify-compliance"
          distinguishing_aspect: |
            The dual-variant axis is the Permit entity's snapshot-vs-live disagreement on the
            drivers-leg of the five-leg validity AND-chain. The snapshot's drivers-leg is the
            on-disk `snapshot_driver_endorsements[<driver_id>]` boolean as of `last_verified_at`;
            the live's drivers-leg is the result of evaluating `driver.hazmat_endorsement_status
            == 'VALID' AND driver.endorsement_valid_until >= permit.valid_until AND
            driver.current_rolling_points < THRESHOLD_DRIVER_SUSPENSION_POINTS` against the
            driver's current state. The disagreement-direction in this worked example is
            "snapshot says true (the driver was VALID at last_verified_at), live says false
            (the regulator-revoke between then and now flipped the endorsement to INVALID)",
            and the verify-compliance handler's response is the ACTIVE→SUSPENDED transition.
            The entity-domain is the Permit aggregate, distinguishing this instance from the
            Driver-domain instance below.
          test_recipe:
            setup:
              - "Fixture: one APPROVED TransportCompany with X-User-ID `co-alpha` and wallet topped to 10_000_000 cents (10x the issue fee for headroom)."
              - "Fixture: one VALID Driver under that company with id `dr-alpha-1`, endorsement_valid_until = the test clock's now + 2 years, endorsement_classes = ['3'] (flammable liquid), current_rolling_points = 0."
              - "Fixture: one PASSED VehicleInspection on the company's one vehicle (id `veh-alpha-1`) with `valid_until = now + 1 year` and `outcome = 'PASSED'`."
              - "Fixture: one APPROVED TransportRoute under the company (id `rt-alpha-1`) with hazard_classes_supported = ['3']."
              - "Fixture: the company's hazard_classes_authorized = ['3'] (the trivial-intersection case)."
              - "Action: regulator (RegulatorOfficer, X-User-ID `regulator-1`) calls POST /v1/permits with route_id=`rt-alpha-1`, authorized_driver_ids=['dr-alpha-1'], authorized_vehicle_ids=['veh-alpha-1'], hazard_classes=['3'], valid_from=now+1h. The response is the permit row in DRAFT, with the application_preview block showing all five legs true. The permit_id is captured as `pm-alpha-1`."
              - "Action: regulator calls POST /v1/permits/pm-alpha-1/issue (no body). The handler runs the issue's full-five-leg live recompute (all true), debits the wallet by annual_renewal_fee(now, vehicle_count=1, valid_until_at_call_time=None, constants) which evaluates to `BASE_RENEWAL_FEE_CENTS + 1 * PER_VEHICLE_SURCHARGE_CENTS = 500000 + 30000 = 530000` cents (the late-flag is false because valid_until_at_call_time is None), and writes the snapshot fields all-true with `last_verified_at = now`. The permit's lifecycle_status flips to ACTIVE and valid_until = valid_from + 365 days."
              - "Action: a wall-clock pause — POST /_clock/advance with advance_seconds = 86400 (one day), run_sweep_after_advance = false. The clock advances; no sweep fires; the permit's snapshot is unchanged."
              - "Action: regulator calls POST /v1/drivers/dr-alpha-1/refresh-endorsement with body {revoke: true, revoke_reason: 'Off-line safety violation observed at checkpoint'}. The handler runs the revoke-variant path: the driver's `endorsement_valid_until` is set to `now` (the just-advanced clock value, which is `original_now + 1 day`), and the auto-flip in the §1.2 Driver VALID→INVALID transition's guard fires because the wall-clock-equals-endorsement-expiry condition is true (and the strict-lessness-than `>=` boundary semantic at the time-check). The driver's `hazmat_endorsement_status` is now INVALID. The Permit row's `snapshot_driver_endorsements['dr-alpha-1']` is still true on disk (the revoke is on the Driver entity, not on the Permit row; the deferred-cascade hasn't flushed yet)."
              - "Observation between the two variants: GET /v1/permits/pm-alpha-1 returns the row whose snapshot_overall is true (because every snapshot_* field is still as-of-last-verified-at-the-issue-time-when-everything-was-true) and whose live_verdict is false (because the live recompute reads driver.hazmat_endorsement_status as INVALID and the drivers-leg fails). The two flags disagree."
            trigger:
              - "Action: regulator calls POST /v1/permits/pm-alpha-1/verify-compliance (no body). The handler reads the disagreement (snapshot drivers-leg true, live drivers-leg false), writes the new snapshot fields with `snapshot_driver_endorsements['dr-alpha-1'] = false`, sets `last_verified_at = now`, and fires the §1.2 Permit ACTIVE→SUSPENDED transition. The response's `transition_fired` field is `ACTIVE_TO_SUSPENDED` and `post_status` is `SUSPENDED`."
            assert:
              - "The pre-verify GET /v1/permits/pm-alpha-1 response has `snapshot_overall == true` AND `live_verdict == false` AND `live_per_leg.live_drivers_ok == false` AND `live_per_leg.live_company_qualified == true`. The leg-level breakdown isolates the driver-leg as the disagreeing one."
              - "The verify-compliance response's `pre_status == 'ACTIVE'` AND `post_status == 'SUSPENDED'` AND `transition_fired == 'ACTIVE_TO_SUSPENDED'`."
              - "The post-verify GET /v1/permits/pm-alpha-1 response has `lifecycle_status == 'SUSPENDED'` AND every `snapshot_*` field equal to its live-side counterpart at the verify-time — specifically `snapshot_driver_endorsements['dr-alpha-1'] == false`."
              - "The company's wallet_balance_cents reads as `INITIAL_WALLET_BALANCE_CENTS + 10000000 - 530000` (the topup minus the issue fee), unchanged by the suspension. The suspension doesn't refund."
              - "Driver dr-alpha-1's `hazmat_endorsement_status == 'INVALID'` and `endorsement_valid_until == <the clock's now-value after the one-day advance>`."

        - name: driver_rolling_points_as_of_issue_disagrees_with_current_after_post_issue_penalty
          grounds:
            - "calculations.driver_penalty_point_rolling_total (its two variants: as_of_issue and current_rolling)"
            - "entities.Driver.current_rolling_points (the cached current-variant)"
            - "entities.Permit.snapshot_driver_endorsements (the per-driver flag-map storing the at-issue snapshot)"
            - "endpoints.POST /v1/penalties (the manual-penalty issuance that increments the current variant without affecting the at-issue snapshot)"
            - "endpoints.GET /v1/drivers/{driver_id}/penalty-summary (exposes the current variant)"
            - "endpoints.GET /v1/permits/{permit_id} (exposes the at-issue snapshot via the snapshot_driver_endorsements map's per-driver boolean, which encodes whether the at-issue points were below threshold)"
          distinguishing_aspect: |
            The dual-variant axis is the Driver entity's penalty-points-rolling-total: the
            as-of-issue snapshot is frozen at the moment the permit was issued (the at-issue
            permit_validity_check's drivers-leg evaluation, encoded as the per-driver boolean
            on snapshot_driver_endorsements), while the current_rolling variant is the live
            sum-over-non-UPHELD-penalties-in-the-rolling-365-day-window evaluated at the
            current clock value. A penalty arriving after the issue widens the gap: the
            at-issue snapshot stays at "the driver was below threshold at the moment of
            issue", which forensically answers "was the issue lawful", while the
            current-rolling reflects the new total, which operationally answers "is the
            driver still below threshold now". The entity-domain is Driver, distinguishing
            this from the Permit-domain instance above. The two domains satisfy rule-1's
            "different entity domains" differentiation clause.
          test_recipe:
            setup:
              - "Fixture set as in the previous example (one APPROVED company, one VALID driver dr-beta-1, one PASSED vehicle, one APPROVED route), with the company's wallet topped. The driver's current_rolling_points starts at 0."
              - "Action: the operator files the permit application (POST /v1/permits) and the regulator issues (POST /v1/permits/{id}/issue) the same way as in the prior example, yielding permit pm-beta-1 in ACTIVE state. The at-issue snapshot_driver_endorsements['dr-beta-1'] is true."
              - "Action: a manual regulator penalty is issued via POST /v1/penalties with body {subject_type: 'DRIVER', subject_id: 'dr-beta-1', points_value: 5, observed_at: now-1h, reason_note: 'Off-line warning'} — note the observed_at is in the rolling-window (one hour ago). The driver's current_rolling_points cache is updated atomically to 5."
              - "Action: a second manual penalty of points_value 8, observed_at = now-30min. The driver's current_rolling_points becomes 13, which is `>= THRESHOLD_DRIVER_SUSPENSION_POINTS (12)`, so the driver's hazmat_endorsement_status auto-flips from VALID to INVALID atomically with the second penalty's insert. The cross-aggregate cascade onto the ACTIVE permit pm-beta-1 is deferred until the next verify-compliance call."
            trigger:
              - "Observation point: the two variants now disagree. The at-issue snapshot on pm-beta-1 says the driver's drivers-leg was true at issue-time (the at-issue rolling-points were 0 < 12). The current-rolling read says the driver's points are 13 and the status is INVALID. The two variants' values are exposed at two different endpoints: GET /v1/permits/pm-beta-1 surfaces the at-issue snapshot (snapshot_driver_endorsements['dr-beta-1'] == true), while GET /v1/drivers/dr-beta-1/penalty-summary surfaces the current variant (current_rolling_points == 13, hazmat_endorsement_status == 'INVALID', the active_penalties_in_window list has two entries summing to 13)."
            assert:
              - "GET /v1/permits/pm-beta-1 response: data.snapshot_driver_endorsements['dr-beta-1'] == true (the at-issue snapshot is frozen-at-issue-time)."
              - "GET /v1/permits/pm-beta-1 response: data.live_per_leg.live_drivers_ok == false (the live recompute reads the just-flipped driver as INVALID)."
              - "GET /v1/permits/pm-beta-1 response: data.lifecycle_status == 'ACTIVE' (the deferred cascade hasn't flushed; the on-disk row is still ACTIVE despite the live disagreement)."
              - "GET /v1/drivers/dr-beta-1/penalty-summary response: data.current_rolling_points == 13 AND data.hazmat_endorsement_status == 'INVALID' AND data.threshold == 12 AND len(data.active_penalties_in_window) == 2."
              - "The sum of the two active penalty rows' points_value fields equals 13, matching the cached current_rolling_points exactly (the conservation invariant of rule-9-invariant-B's pre-uphold state)."
              - "Now firing the deferred cascade: POST /v1/permits/pm-beta-1/verify-compliance. The response's transition_fired is 'ACTIVE_TO_SUSPENDED' (the live drivers-leg's false trumps the snapshot's drivers-leg's true, and the verify-compliance handler writes the new snapshot and fires the SUSPEND transition). After this call, GET /v1/permits/pm-beta-1 reports lifecycle_status == 'SUSPENDED' AND the snapshot's drivers-leg-for-dr-beta-1 == false, equaling the live's value at the verify-time. The dual-variant axis collapses on the verify-compliance call. The at-issue snapshot's history-of-being-true at the issue-moment is lost (the on-disk snapshot is overwritten), but the audit trail of issue-time-lawfulness can be reconstructed from the issue's audit-log record (out of scope for the on-the-row state)."

        - name: snapshot_vs_live_idempotency_no_change_on_consecutive_verify_calls_without_grounding_drift
          grounds:
            - "calculations.permit_validity_check (the no-disagreement case where snapshot and live agree)"
            - "endpoints.POST /v1/permits/{permit_id}/verify-compliance (the no-transition response shape)"
          distinguishing_aspect: |
            The dual-variant axis's *null-disagreement* case: when the grounding entities
            haven't changed between two consecutive verify-compliance calls, the second
            call's snapshot equals the first's, the live equals the snapshot, the transition_fired
            is 'NO_CHANGE', and the only on-disk effect is the refreshed last_verified_at
            timestamp. This is the test that the verify-compliance endpoint is value-level
            idempotent across calls with no intervening grounding-mutation, satisfying the
            §1.5 prose's "the endpoint is idempotent at the value level" claim. The dual-
            variant axis is the same axis as the prior two instances (snapshot vs live on
            the Permit posture and the Driver standing); the distinguishing aspect from
            those is the zero-disagreement scenario, which is the calc's "no flip" branch
            that the test layer must exercise to lock the no-transition behavior.
          test_recipe:
            setup:
              - "Same as the first example up to the first verify-compliance call (which transitions ACTIVE to SUSPENDED on the driver-revoke). Then the regulator re-attests the driver: POST /v1/drivers/{driver_id}/refresh-endorsement with body {endorsement_valid_until: now + 2 years, endorsement_classes: ['3'], version: <current driver version>}. The driver's hazmat_endorsement_status flips back to VALID. The permit is still SUSPENDED on disk (the reinstate-cascade is deferred to the next verify-compliance)."
              - "Action: first POST /v1/permits/<pid>/verify-compliance fires the SUSPENDED→ACTIVE reinstate (the §1.2 Permit transition's guard sees the live drivers-leg is now true and the wall-clock is still in-window). The response's transition_fired is 'SUSPENDED_TO_ACTIVE'."
            trigger:
              - "Action: second POST /v1/permits/<pid>/verify-compliance immediately, no clock advance, no grounding-entity changes since the prior verify."
            assert:
              - "The second verify's response: transition_fired == 'NO_CHANGE'. pre_status == post_status == 'ACTIVE'. The snapshot fields' values are identical to their values immediately after the first verify, and the only changing field is `last_verified_at`, which is now the second-verify's timestamp."
              - "The OCC `version` field on the permit row bumps by 1 between the two verify calls — verify-compliance is a mutation in the sense that it rewrites the last_verified_at and the snapshot fields with the live-recompute's outcome, even when the outcome is the same as the prior snapshot. So a v=4 permit before the verify becomes v=5 after, and a v=5 permit before the second verify becomes v=6 after. The version-bump is the structural counterpart of the timestamp-refresh — it's how the OCC layer expresses 'this row was touched, even if the visible fields look the same'."
              - "The wallet is unaffected by the verify-compliance call (no fee for a verification). The company's wallet_balance_cents is unchanged across the two verify calls."

    # §0.5 Rule 2 — combinatorial_formula — ≥ 2 instances in different modes from {a, b, c}.
    combinatorial_formula:
      instances:

        - name: renewal_fee_mode_a_three_inputs_with_late_penalty_and_cap_saturation
          mode: "(a) — non-linear interaction across ≥3 inputs"
          grounds:
            - "calculations.annual_renewal_fee (the three-stage pinned-order formula)"
            - "calculations.annual_renewal_fee.constants (BASE_RENEWAL_FEE_CENTS, PER_VEHICLE_SURCHARGE_CENTS, LATE_RENEWAL_PENALTY_CENTS, MAX_RENEWAL_FEE_CENTS, LATE_RENEWAL_GRACE_DAYS, RENEWAL_OPEN_WINDOW_DAYS, PERMIT_DEFAULT_VALIDITY_DAYS)"
            - "endpoints.POST /v1/permits/{permit_id}/renew (the call-site that fires the formula in the renewal-branch)"
            - "endpoints.POST /v1/permits/{permit_id}/issue (the call-site for the issue-branch, where is_late is forced to false)"
          distinguishing_aspect: |
            The non-linear interaction of three inputs: the vehicle_count drives the
            per-vehicle surcharge linearly (subtotal_cents = BASE + N * PER_VEHICLE), the
            wall-clock-vs-valid_until-relation drives the conditional add of
            LATE_RENEWAL_PENALTY_CENTS in the half-open closed-left interval
            [valid_until - LATE_RENEWAL_GRACE_DAYS, valid_until), and the
            MAX_RENEWAL_FEE_CENTS saturating cap means the marginal effect of one more
            vehicle on the final fee depends on whether the cap has engaged — so the
            partial derivatives are not constant across the input space. Three inputs,
            non-linear interaction. The mode-a label is the canonical fit.
          test_recipe:
            setup:
              - "Compute the expected fees for four reference points. All arithmetic in integer cents using the numeric values from the constants_numeric_values table above. The Python snippet that the test-generator uses to derive the literal values is:"
              - "Python: BASE=500000; PV=30000; LP=200000; CAP=5000000."
              - "Python: case_1: vehicle_count=1, is_late=false. subtotal = 500000 + 1 * 30000 = 530000. is_late=false so no LP. min(530000, CAP=5000000) = 530000. Expected fee = 530000 cents."
              - "Python: case_2: vehicle_count=10, is_late=false. subtotal = 500000 + 10 * 30000 = 800000. No LP. min(800000, CAP) = 800000. Expected = 800000 cents."
              - "Python: case_3: vehicle_count=1, is_late=true. subtotal = 530000 + 200000 = 730000. min(730000, CAP) = 730000. Expected = 730000 cents."
              - "Python: case_4: vehicle_count=MAX_VEHICLES_PER_PERMIT=20, is_late=true. subtotal = 500000 + 20 * 30000 + 200000 = 1300000. min(1300000, CAP=5000000) = 1300000. Cap doesn't engage. Expected = 1300000 cents."
              - "Python: case_5 (cap-engages case for sanity, designed to actually saturate the cap): supposing a hypothetical 200-vehicle permit, the subtotal would be 500000 + 200*30000 = 6500000, which exceeds CAP=5000000, so the fee is min(6500000, 5000000) = 5000000. But MAX_VEHICLES_PER_PERMIT is 20 so this 200-vehicle case isn't reachable through a valid permit application — the cap-engagement is unreachable under the standard cardinality bound. The cap is a defensive saturation; it doesn't fire in the standard parameter range with the numeric values pinned in this scaffold. The test of the cap's correctness is a unit-test of the formula function in isolation, not an end-to-end-via-the-API test. The end-to-end test exercises cases 1-4."
              - "Fixture: an APPROVED company with wallet topped to 100_000_000 cents (10 yuan-million), a single APPROVED route, and 20 PASSED-and-in-validity-window vehicles (the maximum cardinality), 1 VALID driver covering the 365-day-plus-some-margin window."
              - "Action: operator POSTs the permit application listing all 20 vehicles, the one driver, the one route, hazard_classes appropriate. Regulator POSTs the issue endpoint. The issue-fee should equal case-4's expected fee but in the issue-branch the is_late flag is forced false (the issue-time has no late-window context because there's no prior valid_until), so the issue-fee equals case-2's expected fee = 800_000 cents."
              - "Capture the wallet balance after the issue: it equals the topup minus the issue fee, exactly. The wallet's debit must equal the formula's pinned-evaluation-order output value."
              - "Advance the clock to put `now()` inside the renewal-window's outer band but outside the late-grace inner band: at `now() == issued_at + PERMIT_DEFAULT_VALIDITY_DAYS - RENEWAL_OPEN_WINDOW_DAYS + 1 day` (i.e., one day inside the open renewal-window from its left edge, 59 days before valid_until). This is the on-time-renewal case — `is_late` should be false."
              - "Action: operator POSTs the renewal endpoint with no body fields (the optional list-replacements absent so vehicle_count stays at 20). The handler computes annual_renewal_fee with vehicle_count=20 and is_late=(now>=valid_until-LATE_RENEWAL_GRACE_DAYS && now<valid_until) which evaluates to false at this clock point. Expected fee = case-2's value = 800_000 cents (the same formula output as the issue because the input set is the same minus the late-penalty contribution which is zero in both cases). The wallet is debited by 800_000 cents, and `valid_until` is extended by PERMIT_DEFAULT_VALIDITY_DAYS = 365 days from its prior value. A new entry is appended to renewal_history with `fee_cents = 800000`, `late_penalty_applied = false`, the prior and new valid_until timestamps."
            trigger:
              - "Action: a second renewal, this time after a clock-advance into the late-grace window — `now() = the just-extended valid_until - 10 days`, which is inside the closed-left half-open `[valid_until - LATE_RENEWAL_GRACE_DAYS, valid_until)` window (10 days < 30 days from the new term-end). The is_late flag fires true. The formula's output is case-3-adjusted-for-20-vehicles: `BASE + 20 * PER_VEHICLE + LATE_PENALTY = 500000 + 600000 + 200000 = 1_300_000 cents`, matching case-4 exactly. The wallet is debited by 1_300_000 cents. The renewal_history's second entry has `fee_cents = 1300000`, `late_penalty_applied = true`."
            assert:
              - "After the issue: the company's wallet_balance_cents equals `INITIAL_TOPUP - 800000` (the issue's case-2-equivalent fee). The permit's `issue_fee_cents` field equals 800000 exactly. The permit's `valid_until` equals `valid_from + 365 days` to the millisecond."
              - "After the first renewal: the wallet drops by another 800_000 cents. The renewal_history list has exactly one entry, whose `fee_cents == 800000` AND `late_penalty_applied == false` AND `prior_valid_until == the issue's-valid_until value` AND `new_valid_until == prior_valid_until + 365 days`."
              - "After the second (late) renewal: the wallet drops by 1_300_000. The renewal_history list has two entries; the second's `fee_cents == 1300000` AND `late_penalty_applied == true`."
              - "The conservation accounting (rule-9-invariant-A's currency conservation across (issue, two renewals, hypothetical void-issue) — but the void-issue is gated to the 24h window after the original issue and isn't reachable from this test's clock position, so the conservation is observable only on the wallet-balance-vs-paid-out-sum equation): the sum of debits equals `issue_fee_cents + sum(renewal_history[*].fee_cents) = 800000 + 800000 + 1300000 = 2_900_000` cents, and the wallet's net change from its initial value is exactly that. This is the rule-9 conservation invariant's running-balance form (the void-isn't-fired branch); the void-fired-branch is in rule-9's dedicated bucket."
              - "The non-linear interaction between vehicle_count and the late-flag is the formula's combinatorial axis: fee(v=1, late=false) = 530000, fee(v=1, late=true) = 730000, fee(v=10, late=false) = 800000, fee(v=10, late=true) = 1_000_000, fee(v=20, late=false) = 1_100_000, fee(v=20, late=true) = 1_300_000. The function f(v, late) is *not* separable as g(v) + h(late) because the cap engages at large v's combined with late=true (specifically at v >= ceil((CAP - LATE_PENALTY - BASE) / PER_VEHICLE) = ceil((5_000_000 - 200_000 - 500_000) / 30_000) = ceil(143.333...) = 144, which is well above MAX_VEHICLES_PER_PERMIT=20, so in the standard parameter range the cap doesn't engage and the function does look additive — but the cap's presence is the structural non-linearity, and the test of the cap is a formula-function unit-test that checks the saturation at out-of-API-range inputs). The combinatorial axis-of-non-linearity for the in-API-range cases is the conditional-add of LATE_PENALTY, which is the boolean-input-times-constant-cents interaction with the integer-vehicle-count linear-input — the function is piecewise-linear with two pieces (late-false and late-true), connecting at the discontinuity which is the very-narrow time-interval where the wall clock crosses the late-grace-window's left edge."

        - name: renewal_fee_mode_a_at_the_late_grace_left_edge_inclusive_boundary
          mode: "(a) sub-case — the conditional-branch's boundary precision"
          grounds:
            - "calculations.annual_renewal_fee (specifically the is_late = (now >= valid_until - LATE_RENEWAL_GRACE_DAYS AND now < valid_until) predicate's left-edge inclusive semantics)"
            - "endpoints.POST /v1/permits/{permit_id}/renew"
            - "endpoints.POST /v1/_clock/advance (the test-harness's deterministic clock-positioner)"
          distinguishing_aspect: |
            The boundary between is_late=false and is_late=true is the exact moment
            `now() == valid_until - LATE_RENEWAL_GRACE_DAYS`. The left-edge is inclusive
            (`>=` in the formula's prose), so a renewal call landing at that exact instant
            fires the late-penalty add. A renewal call landing one nanosecond earlier
            doesn't. This is a sub-boundary of the rule-2-mode-a formula's conditional
            branch — it's also a rule-6-boundary-precision instance on the time-difference
            metric on the renewal-endpoint, contributing to rule-6's "different metrics
            and different endpoints" inventory. The dual-tagging across rules 2 and 6
            is fine — the spec's quality-checklist explicitly allows a single scaffold
            element to be cited by multiple rule_ids in the difficulty-design index, as
            long as the element is grounded in §1.1-1.6 and the distinguishing-aspect
            text names the specific differentiation each citing rule requires.
          test_recipe:
            setup:
              - "Fixture: an ACTIVE permit (id `pm-gamma-1`) with `valid_until = T` for some test-clock value T. The permit is issued at T - 365 days, so it's mid-term, and the wallet has plenty of balance for the renewal."
              - "vehicle_count = 5, so the no-late-fee is `BASE + 5 * PER_VEHICLE = 500000 + 150000 = 650000` cents, and the with-late-fee is `650000 + LATE_RENEWAL_PENALTY = 650000 + 200000 = 850000` cents."
              - "The boundary instant is `T - LATE_RENEWAL_GRACE_DAYS = T - 30 days`. The renewal-open-window's left edge is `T - RENEWAL_OPEN_WINDOW_DAYS = T - 60 days`. So the on-time window is `[T-60d, T-30d)` (closed-left, open-right at the inner boundary), the late-grace window is `[T-30d, T)` (closed-left, open-right at the outer boundary), and outside-on-the-late-side is `[T, infinity)` which is the ERR_RENEWAL_AFTER_EXPIRY zone (and the permit has flipped to EXPIRED by the sweep)."
              - "Three test-points to pin the boundary: (alpha) `now = T - 30 days - 1 millisecond`, the just-inside-the-on-time-window case → is_late=false → fee=650_000. (beta) `now = T - 30 days exactly`, the exact-left-edge-of-the-late-grace-window case → is_late=true (closed-left inclusive) → fee=850_000. (gamma) `now = T - 1 millisecond`, the just-inside-the-late-grace-window-against-the-right-edge case → is_late=true → fee=850_000."
              - "And a fourth test-point on the right edge: (delta) `now = T exactly`, the wall-clock-equals-valid_until moment, which is the EXPIRED transition's boundary per the half-open right-exclusive convention on the permit's wall-clock-expiry. The §1.2 Permit ACTIVE→EXPIRED transition's guard fires at `now() >= valid_until` (the `>=`, closed-left-on-the-expiry-direction), so at exactly `now == T` the permit transitions to EXPIRED and the renewal returns ERR_RENEWAL_AFTER_EXPIRY 409. The is_late predicate's right-edge in the formula's prose is `now < valid_until` strictly, which at `now == T` evaluates to false, so the formula would return the no-late-fee for the brief instant before the expiry-check kicks in — but the validation layer's expiry-check fires *before* the formula at the renewal endpoint's handler (validation priority 542 ERR_RENEWAL_AFTER_EXPIRY in §1.4), so the formula isn't even invoked at the boundary. The test asserts the expected error, not a fee value."
            trigger:
              - "Sequence: position the clock at each of the four points (alpha, beta, gamma, delta) via POST /_clock/advance, then POST /v1/permits/pm-gamma-1/renew with no body fields (so vehicle_count stays at 5). Capture the four responses' fee-cents-and/or-error-id."
            assert:
              - "Test-point alpha (now = T-30d - 1ms): the renewal succeeds, the response's `renewal_history[last].fee_cents == 650000` AND `late_penalty_applied == false`. The wallet drops by 650_000 cents."
              - "Test-point beta (now = T-30d exactly): the renewal succeeds, the response's `renewal_history[last].fee_cents == 850000` AND `late_penalty_applied == true`. The wallet drops by 850_000 cents. This is the closed-left-inclusive-edge of the late-grace window — the boundary on the time-difference-from-valid_until metric. Crucially, the previous test-point alpha and this test-point beta differ by one millisecond of clock-advance and the fee jumps by exactly the LATE_RENEWAL_PENALTY_CENTS value (200_000 cents), encoding the conditional-branch's discontinuity."
              - "Test-point gamma (now = T-1ms): the renewal succeeds, fee==850000, late==true. Same as beta in terms of fee, different in the exact wall-clock-time-to-expiry distance."
              - "Test-point delta (now = T exactly): the renewal fails with HTTP 409 and the response's `data.error_id == 'ERR_RENEWAL_AFTER_EXPIRY'`. The permit's lifecycle_status is observed as EXPIRED on a follow-up GET. The wallet is unchanged by the failed renewal."
              - "Across the four points, the cumulative wallet-debit equals 650000 (alpha's success) + 850000 (beta's) + 850000 (gamma's) = 2_350_000 cents. The delta-point's failure didn't debit. The permit's `valid_until` after the three successes is `T + 3 * 365 days` (each renewal adds a year from the *prior* term-end, not from `now()`, per the §1.5 renew-endpoint's prose). The conservation invariant of rule-9-A's currency holds: the wallet's net change is exactly the sum of the issue-fee plus the three renewal-fees, and a hypothetical void-issue would refund that sum exactly."

        - name: permit_validity_check_mode_c_pinned_five_leg_evaluation_order_under_concurrent_grounding_mutation
          mode: "(c) — evaluation order must be explicit"
          grounds:
            - "calculations.permit_validity_check (the explicit five-leg pinned evaluation order: company → drivers-sorted-ascending-by-id → vehicles-sorted-ascending-by-id → route → time-window)"
            - "concurrency_rules['Two POST /permits/{id}/verify-compliance requests on the same permit'] (the OCC version-conflict-loser rule)"
            - "endpoints.POST /v1/permits/{permit_id}/verify-compliance"
          distinguishing_aspect: |
            The mode-c "circular-or-order-sensitive evaluation must be explicit" clause
            from §0.5 rule-2. The permit_validity_check's five legs are *all* boolean
            conjunctions, so the value of the whole AND-chain is independent of the
            evaluation order in isolation — but when a verify-compliance call is racing
            against a grounding-entity-mutation (e.g., the regulator's-revoke-driver
            call landing between the verify-compliance's reads of the company-leg
            and the drivers-leg), the order in which the verify reads the grounding
            entities matters for the *snapshot's contents*: the leg whose grounding
            entity was just flipped sees the flipped value, while the previously-read
            legs in the same verify's read-set see the pre-flip values, giving the
            snapshot a *consistent-cut* view of the world only when the verify's
            read-order is pinned. The §1.3 prose pins the order as company →
            drivers-sorted-by-id → vehicles-sorted-by-id → route → time, so a
            concurrent flip on the route's approval_status during the verify's
            still-in-the-drivers-leg phase produces a snapshot where the
            drivers-leg is the pre-flip read but the route-leg is the post-flip read.
            The end-state value of the conjunction is the same either way (false,
            because the post-flip route-leg is false), but the per-leg breakdown
            on the snapshot differs depending on whether the verify's reads
            interleaved with the flip-write before or after the route-read step.
            The pinned ordering forces a deterministic per-leg breakdown for the
            *non-racing* case, and the OCC version-conflict mechanism handles the
            racing case by serializing the verify's read-and-write against the
            grounding-entity-mutation's read-and-write at the row-version level.
          test_recipe:
            setup:
              - "Fixture: an ACTIVE permit `pm-delta-1` whose two authorized drivers have ids that sort lexicographically as `dr-aaa-1` < `dr-bbb-2`. The first-in-sorted-order driver dr-aaa-1's hazmat_endorsement is VALID and covers the term; the second dr-bbb-2's same. Both vehicles' inspections are PASSED and cover the term. The route is APPROVED. The wall-clock is in-window."
              - "The verify-compliance's read-order, per the §1.3 pinned order, is: company-row → driver dr-aaa-1 row → driver dr-bbb-2 row → vehicle ven-aaa-1 row → vehicle ven-bbb-2 row → route-row → wall-clock. Five legs, with the per-leg granularity on the per-driver and per-vehicle dimension."
              - "The test exercises the pinned order *non-racing case* by issuing a single verify-compliance and reading the response's `live_per_leg` field. The field's ordering of the per-driver-flags must match the sorted-ascending-by-id ordering: the response's live_per_leg.driver_endorsements map iteration in the response's JSON serialization must list dr-aaa-1 before dr-bbb-2."
              - "The test's racing-case is exercised separately via the concurrency-rules-driven test: two simultaneous verify-compliance calls on the same permit are guaranteed by the §1.2.1 concurrency-rule on simultaneous-verify to serialize via OCC, with the loser getting ERR_VERSION_CONFLICT 409. The race-loser's body's optional `version` field equals the row's-version-at-the-time-of-the-loser's-read, and after the winner's commit the row's-version has bumped to the next integer; the loser's compare-and-swap fails."
            trigger:
              - "Action 1 (non-racing-pinned-order): a single POST /v1/permits/pm-delta-1/verify-compliance. Capture the response's live_per_leg.driver_endorsements ordering and the snapshot_per_leg.driver_endorsements ordering. Both must list dr-aaa-1 first (lex-smaller id) and dr-bbb-2 second (lex-larger id), matching the pinned-ascending-by-id ordering of the §1.3 prose."
              - "Action 2 (racing case, optional, the concurrency-rules-conformance test): two near-simultaneous POST /v1/permits/pm-delta-1/verify-compliance calls (the harness uses Python's threading or asyncio to fire them within a few milliseconds, both supplying the same body-version `v=3` from a pre-read). The first to commit wins; the second to commit fails with HTTP 409 and `error_id == 'ERR_VERSION_CONFLICT'`. The harness's parallel-clients abstraction is the standard one used elsewhere in the test suite."
            assert:
              - "Non-racing response: the response's `live_per_leg` field's keys are `live_company_qualified`, `live_drivers_ok`, `live_vehicles_ok`, `live_route_approved`, `live_within_window` in that order (the top-level five-leg conjunction breakdown — the ordering across legs matches the §1.3 prose's evaluation-order pin). The per-driver sub-map's iteration order, as serialized in JSON's preserve-insertion-order convention, is `'dr-aaa-1': true, 'dr-bbb-2': true` in that ascending-by-id order. The per-vehicle sub-map is the same shape with the two vehicle ids in ascending order."
              - "Racing-case response (the loser): HTTP 409, JSON body's data.error_id == 'ERR_VERSION_CONFLICT'. The winner's response is HTTP 200 with the standard verify-compliance shape. The on-disk row's `version` field's post-race value equals `pre-race version + 1` (only the winner's commit bumps the version; the loser's failed commit doesn't). The on-disk `last_verified_at` equals the winner's timestamp, not the loser's. The deterministic interleaving guarantee is the OCC contract."
              - "The pinned-evaluation-order's observable effect is the JSON-serialization-key-order of the per-leg sub-maps. The implementation's pin on the evaluation-order is testable through the response's field-order, the same way a server's tie-break-on-equal-timestamp is testable through the list-endpoint's row-ordering. This is the rule-2-mode-c's load-bearing observable in the API surface."

    # §0.5 Rule 3 — non_linear_state_machine — ≥ 2 instances on different entities.
    non_linear_state_machine:
      instances:

        - name: transport_company_qualification_revoke_then_reapply_cycle
          shape: "cycle: DRAFT → SUBMITTED → APPROVED → REVOKED → DRAFT (the regulator's revocation followed by the operator's re-application closes the loop)"
          entity: TransportCompany
          grounds:
            - "state_machines.TransportCompany.qualification_status (the four-state machine with the cycle edge REVOKED → DRAFT via the submit endpoint's internal-collapse)"
            - "endpoints.POST /v1/companies/{id}/submit (handles both DRAFT→SUBMITTED and the REVOKED→DRAFT→SUBMITTED compound)"
            - "endpoints.POST /v1/companies/{id}/approve"
            - "endpoints.POST /v1/companies/{id}/revoke"
            - "entities.TransportCompany.revoked_at (the audit field preserved across the cycle)"
          distinguishing_aspect: |
            The cycle is closed by the regulator's revoke (APPROVED → REVOKED) followed
            by the operator's re-submit (the submit endpoint observing a REVOKED-state
            company internally walks it through DRAFT to SUBMITTED, per the §1.2
            prose's compound-internal-step pattern). The cycle's existence makes the
            qualification_status state machine non-linear in the cycle-sense of §0.5
            rule-3's allowed shapes. The entity is TransportCompany. The audit-trail
            field `revoked_at` is intentionally not cleared on the cycle's re-approval —
            the spec's prose pins it as "preserved across the cycle for the
            reconstructible-history convention", so a row that has been through one
            APPROVED→REVOKED→DRAFT→SUBMITTED→APPROVED cycle is distinguishable from
            a row that has never been revoked by the presence vs absence of a
            non-null `revoked_at` value.
          test_recipe:
            setup:
              - "Fixture: a fresh TransportCompany row in DRAFT (created by POST /v1/companies). Its revoked_at is null."
              - "Walk: POST /v1/companies/{id}/submit (DRAFT → SUBMITTED), then POST /v1/companies/{id}/approve as RegulatorOfficer (SUBMITTED → APPROVED). Capture the row's `approved_at` timestamp T1."
              - "Walk: POST /v1/companies/{id}/revoke with body {reason_note: 'Audit-failure-1'} as RegulatorOfficer (APPROVED → REVOKED). Capture the row's `revoked_at` timestamp T2 ≈ T1 + a few seconds."
              - "POST /_clock/advance to position now() at T2 + 1 day (the operator's remediation window — out-of-API)."
              - "Walk: POST /v1/companies/{id}/submit as the operator (REVOKED → internal-DRAFT → SUBMITTED, the compound-internal-step). The response observes the row's prior state was REVOKED and the new state is SUBMITTED. The `submitted_at` is refreshed to the new `now()`; the `approved_at` and `revoked_at` audit fields retain their prior-cycle values."
              - "Walk: POST /v1/companies/{id}/approve as the regulator (SUBMITTED → APPROVED, the cycle's second approval). The row's `approved_at` is refreshed to the new `now()`; the prior T1 value is overwritten on the field, but the audit-log of-the-overwrite is conceptually outside the row (the spec's prose says the audit-trail's prior-approval-events are reconstructible-but-not-on-the-row-itself, which is a deliberate scaffold-economy choice)."
            trigger:
              - "The full cycle is the sequence above — there's no single trigger; the test exercises the whole cycle and asserts on the row's per-step states. The 'observable' of the cycle's closure is the row arriving back at APPROVED with a non-null `revoked_at` from the prior cycle's revoke step."
            assert:
              - "After the first DRAFT→SUBMITTED→APPROVED walk: row.qualification_status == 'APPROVED', row.submitted_at == <the first submit's now>, row.approved_at == T1 ≈ that-now-plus-a-few-seconds (the regulator's-approval-arrival time), row.revoked_at == null."
              - "After the APPROVED→REVOKED revoke: row.qualification_status == 'REVOKED', row.revoked_at == T2 ≈ T1-plus-some-seconds, row.approved_at == T1 (unchanged from the prior step; the revoke doesn't reset the prior-approval timestamp; the field carries the most-recent-prior-approval's value)."
              - "After the REVOKED→DRAFT→SUBMITTED compound: row.qualification_status == 'SUBMITTED' (the externally-observable terminal of the compound step). row.submitted_at == the second-submit's now-value (which is T2 + 1 day per the clock-advance). row.approved_at == T1 still (unchanged from before — the second cycle hasn't yet hit its approval step). row.revoked_at == T2 still (preserved across the cycle's reset edge — the audit-of-the-prior-revoke is part of the row's history)."
              - "After the second SUBMITTED→APPROVED: row.qualification_status == 'APPROVED', row.approved_at == the new approval-time (the second cycle's approval, overwriting T1). row.revoked_at == T2 still (the prior-cycle's revoke-event is retained as the row's audit trail of the cycle having happened). row.submitted_at == the second-submit's-now (the most-recent submit's timestamp). The non-null revoked_at coexisting with the current APPROVED state is the rebuilt-after-revocation row's fingerprint."
              - "The `version` field across the four state transitions monotonically increments by 1 per transition, starting at the row's create-time version 1 and ending at version 5 (one bump per of: submit-1, approve-1, revoke, submit-2-which-is-the-compound-step-but-still-one-bump-because-the-handler-treats-the-compound-as-a-single-mutating-action, approve-2 — that's actually four bumps, ending at version 5 because the create was version 1)."

        - name: transport_route_application_reject_then_revise_cycle
          shape: "cycle: DRAFT → SUBMITTED → REJECTED → DRAFT (via the submit-endpoint's internal-collapse on the REJECTED state) → SUBMITTED → APPROVED"
          entity: TransportRoute
          grounds:
            - "state_machines.TransportRoute.approval_status (the four-state machine with the cycle edge REJECTED → DRAFT via the submit endpoint's compound-internal-step, mirroring the company's APPROVED → REVOKED → DRAFT cycle's shape)"
            - "endpoints.POST /v1/routes/{id}/submit (DRAFT→SUBMITTED, and the REJECTED→DRAFT→SUBMITTED compound)"
            - "endpoints.POST /v1/routes/{id}/approve"
            - "endpoints.POST /v1/routes/{id}/reject (the REJECTED-state's entry edge with the required `rejection_reason` body)"
            - "entities.TransportRoute.rejection_reason (the field that captures the most-recent reject's reason and is cleared on the cycle's re-submit step)"
          distinguishing_aspect: |
            The TransportRoute's cycle is a *different* shape from the TransportCompany's:
            on Route the cycle's entry-edge is the regulator's reject (SUBMITTED →
            REJECTED), while on Company the cycle's entry-edge is the regulator's
            revoke (APPROVED → REVOKED, on an already-approved row). The
            "cycle starts from the regulator's negative-verdict edge" pattern is
            shared between the two entities, but the regulator's-negative-verdict
            edge sits at a different state in the two state-machines: Company's
            edge is from APPROVED (a positive-verdict state), Route's edge is from
            SUBMITTED (the pending-review state). The non-linear-shape's qualitative
            character (cycle-with-the-regulator's-negative-step) differs in the
            angle-of-attack on the lifecycle: Company's revoke pulls back from a
            success state, Route's reject pushes away from a pending state without
            ever having reached the success state. Two distinct entities with two
            qualitatively distinct cycles — rule-3's "different entities" clause is
            satisfied by the Company-Route pair alone (the Driver and Permit
            cycles below add to the inventory but aren't required for the rule).
            The `rejection_reason` field's cleared-on-re-submit and preserved-on-
            the-reject-event mirrors the Company's `revoked_at`-stays-but-doesn't-
            block-the-cycle convention.
          test_recipe:
            setup:
              - "Fixture: an APPROVED TransportCompany `co-route-1` with hazard_classes_authorized = ['3', '8'] (flammable liquid and corrosive). The wallet is irrelevant here because no fee fires on the route lifecycle."
              - "Walk: POST /v1/companies/co-route-1/routes with body {origin_label: 'Shanghai', destination_label: 'Hangzhou', polyline: [{lat:31.23,lon:121.47},{lat:30.27,lon:120.15}], hazard_classes_supported: ['3', '8']}. Response is a route in DRAFT state, captured as `rt-route-1`."
              - "Walk: POST /v1/routes/rt-route-1/submit as the operator. The row transitions DRAFT → SUBMITTED. The rejection_reason field is null (it was null and the submit doesn't write it)."
              - "Walk: POST /v1/routes/rt-route-1/reject as the regulator with body {rejection_reason: 'Polyline crosses a residential exclusion zone east of Jiaxing'}. The row transitions SUBMITTED → REJECTED. The rejection_reason field is now the body's string."
              - "Walk: POST /v1/routes/rt-route-1/submit again as the operator. The handler observes the row in REJECTED, walks it through DRAFT internally, clears the rejection_reason to null, and arrives at SUBMITTED. The §1.2 TransportRoute REJECTED → DRAFT transition's side-effect-block lists 'clear rejection_reason' explicitly, which the handler honors."
              - "Walk: POST /v1/routes/rt-route-1/approve as the regulator. The handler runs the two-time-point hazard-class-subset re-check (the route's hazard_classes_supported ['3', '8'] is still a subset of the company's hazard_classes_authorized ['3', '8'], since the company's authorized list hasn't been narrowed between the two cycles' time-points). The row transitions SUBMITTED → APPROVED. The approved_at is set to the regulator's-approval timestamp; the approved_by is the regulator's X-User-ID. The rejection_reason field is wiped on the approve transition per the §1.2 SUBMITTED → APPROVED side-effect's 'clear rejection_reason' clause."
            trigger:
              - "The full cycle DRAFT → SUBMITTED → REJECTED → (internal:DRAFT) → SUBMITTED → APPROVED, exercised as the sequence above. The 'observable' of the cycle's closure is the row arriving at APPROVED with rejection_reason == null (the prior-reject's reason was cleared on the re-submit's internal-step's side-effect-clause)."
            assert:
              - "After the first submit-then-reject: row.approval_status == 'REJECTED', row.rejection_reason == 'Polyline crosses a residential exclusion zone east of Jiaxing' (the body's string echoed verbatim), row.approved_at == null, row.approved_by == null."
              - "After the second submit (the cycle's internal-collapse): row.approval_status == 'SUBMITTED', row.rejection_reason == null (cleared by the cycle's internal-DRAFT step's side-effect), row.approved_at == null still, row.approved_by == null still."
              - "After the final approve: row.approval_status == 'APPROVED', row.approved_at == the regulator's-call's-now, row.approved_by == the regulator's X-User-ID, row.rejection_reason == null."
              - "The version-field bumps once per state-transition: create (v=1), submit-1 (v=2), reject (v=3), submit-2-compound (v=4 because the handler treats the REJECTED→DRAFT→SUBMITTED compound as a single mutation per the §1.2 prose), approve-1 (v=5). The post-cycle final version is 5, and the row's audit-fields' state at v=5 is the cycle-closed-and-the-second-attempt-succeeded configuration."

        - name: permit_lifecycle_active_suspend_reinstate_cycle_on_grounding_entity_revoke_and_re_attest
          shape: "cycle: ACTIVE ↔ SUSPENDED, driven by the verify-compliance handler's snapshot-vs-live comparison's outcome on each call. The cycle is value-driven (each direction's transition fires when the live recompute's verdict crosses the snapshot's verdict in the appropriate direction) rather than action-driven (no dedicated suspend or reinstate endpoint; the same verify-compliance call observes both directions)."
          entity: Permit
          grounds:
            - "state_machines.Permit.lifecycle_status (the ACTIVE → SUSPENDED transition fired by a verify-compliance observing a live-disagreement-in-the-suspend-direction; the SUSPENDED → ACTIVE transition fired by the symmetric agree-in-the-reinstate-direction)"
            - "endpoints.POST /v1/permits/{id}/verify-compliance (the single endpoint that drives both directions)"
            - "endpoints.POST /v1/drivers/{driver_id}/refresh-endorsement (the upstream-cause for the cycle's two halves — the revoke variant causes the driver-flip which causes the permit-suspend; the re-attest variant causes the driver-flip-back which on the next verify causes the permit-reinstate)"
            - "calculations.permit_validity_check (the live-and-snapshot-mode evaluators whose disagreement drives the cycle)"
          distinguishing_aspect: |
            The Permit's cycle's directionality is *value-driven* on a derived
            aggregate (the permit's lifecycle_status is a function of the
            five-leg validity-AND-chain over the grounding-entities), while
            the Company's and Route's cycles' directionality is *action-driven*
            on dedicated endpoints (the regulator's revoke-endpoint and
            reject-endpoint). The cycle's symmetry — same endpoint
            (verify-compliance) drives both directions, the direction is the
            value-comparison's verdict — is qualitatively different from the
            asymmetric action-pairs (submit-vs-approve on the lifecycle's
            forward direction, revoke-vs-reject on the negative-verdict
            direction). The Permit cycle's automatic-system-actor character
            (the §1.2 transitions' `actor` field is `system`, not a role)
            also distinguishes it from the Company-and-Route cycles whose
            actors are explicit roles. The entity is Permit, distinct from
            Company and Route, satisfying rule-3's third-different-entity
            inventory entry beyond the two-instance minimum.
          test_recipe:
            setup:
              - "Fixture: an ACTIVE Permit `pm-cycle-1` issued at clock-time T_issue with a single driver `dr-cycle-1` and the standard one-vehicle-one-route setup. The driver's hazmat_endorsement is VALID at T_issue and remains VALID until the regulator's revoke action."
              - "Phase 1: regulator revokes the driver's endorsement via POST /v1/drivers/dr-cycle-1/refresh-endorsement with body {revoke: true, revoke_reason: 'Off-duty drug-test failure'}. The driver's hazmat_endorsement_status flips to INVALID and `endorsement_valid_until` is set to the call's now-value. The Permit's on-disk snapshot is unchanged (the cascade is deferred)."
              - "Phase 1 trigger: POST /v1/permits/pm-cycle-1/verify-compliance. The handler reads the snapshot-vs-live disagreement (snapshot drivers-leg true; live drivers-leg false because the driver is now INVALID), writes the new snapshot with drivers-leg false, fires the ACTIVE → SUSPENDED transition. The response's transition_fired is 'ACTIVE_TO_SUSPENDED'. The permit is now SUSPENDED."
              - "Phase 2: regulator re-attests the driver via POST /v1/drivers/dr-cycle-1/refresh-endorsement with body {endorsement_valid_until: <now + 2 years>, endorsement_classes: ['3']}. The driver flips back to VALID. The Permit's on-disk snapshot is still drivers-leg-false from the prior verify; the deferred reinstate-cascade hasn't fired yet."
              - "Phase 2 trigger: POST /v1/permits/pm-cycle-1/verify-compliance. The handler reads the snapshot-vs-live disagreement-in-the-reinstate-direction (snapshot drivers-leg false; live drivers-leg true; all other legs were and still are true), writes the new snapshot with drivers-leg true, fires the SUSPENDED → ACTIVE reinstate transition. The response's transition_fired is 'SUSPENDED_TO_ACTIVE'. The permit is back in ACTIVE."
            trigger:
              - "The two verify-compliance calls in Phase 1 and Phase 2 trigger the down-cycle-edge and the up-cycle-edge respectively. The pair forms one full cycle. The wall-clock between Phase 1's verify and Phase 2's verify can be arbitrary (the cycle's two halves don't have a time-relationship constraint beyond both being inside the permit's [valid_from, valid_until) window — if the wall-clock crosses valid_until between the two phases, the second verify's transition is SUSPENDED → EXPIRED, not SUSPENDED → ACTIVE, which is a different terminal-edge of the cycle that the test should also exercise as a separate worked example in the rule-4 cascade-B bucket where the wall-clock-cascade-overrides-the-reinstate-direction is the canonical case)."
            assert:
              - "Phase 1's verify response: pre_status=='ACTIVE', post_status=='SUSPENDED', transition_fired=='ACTIVE_TO_SUSPENDED'. The response's snapshot_per_leg (the pre-call snapshot, which was the all-true issue-time snapshot) has drivers-leg true; the live_per_leg (the live recompute) has drivers-leg false. The post-call on-disk snapshot's drivers-leg-sub-flag for dr-cycle-1 is false."
              - "Phase 2's verify response: pre_status=='SUSPENDED', post_status=='ACTIVE', transition_fired=='SUSPENDED_TO_ACTIVE'. The snapshot_per_leg (the pre-Phase-2-call snapshot, which is the Phase-1-written drivers-leg-false snapshot) has drivers-leg false; the live_per_leg has drivers-leg true. The post-Phase-2 on-disk snapshot's drivers-leg flag is true again."
              - "Across the two phases, the on-disk permit row's `version` field bumps by 2 (once per verify-compliance call's mutation). The `last_verified_at` timestamps for the two verifies are distinct."
              - "The wallet is not touched by either verify-compliance — the cycle's currency-consequence is zero (no fee for verifications, no refund for suspensions, no debit for reinstatements). This is consistent with the rule-9-invariant-A's conservation-of-currency-across-the-cycle: the cycle's net effect on the wallet is zero, just as the Driver-points conservation across (penalty-create, penalty-uphold) is the rule-9-invariant-B's zero."
              - "The trips on pm-cycle-1, if any, retain their trip_status across the cycle (the SUSPENDED state's prose pins that the suspension gates the GPS-stream but doesn't abort the trips, which is the in-flight-trip-survives-a-transient-suspension semantics). A trip in IN_TRANSIT through the suspension-and-reinstate cycle stays IN_TRANSIT throughout, modulo the inability to upload GPS samples during the SUSPENDED-interval (which returns ERR_PERMIT_NOT_ACTIVE at the gps-ingest endpoint during the gap)."

        - name: driver_endorsement_valid_invalid_cycle_via_threshold_crossing_and_appeal_uphold_and_re_attest
          shape: "cycle: NOT_ATTESTED → VALID (by the regulator's first refresh-endorsement) → INVALID (by a points-threshold crossing on a penalty insert, or by the wall-clock-expiry of `endorsement_valid_until`) → VALID (by a regulator's re-attestation after the points dropped below threshold via the appeal-uphold's penalty-void). The cycle's negative edge has two distinct causes (points-crossing vs time-expiry); the cycle's positive-return edge has the one regulator's-explicit-action cause. The wall-clock-natural-decay path (a penalty's observed_at falling out of the rolling 365-day window via the sweep's rolling-window-fall-off) lowers the cached count but does NOT auto-flip the status back to VALID — that flip requires the regulator's explicit refresh-endorsement, per the keep-the-regulator-in-the-loop convention from the §1.2 Driver state-machine's prose. So the cycle's positive-return edge is solely action-driven by the regulator."
          entity: Driver
          grounds:
            - "state_machines.Driver.hazmat_endorsement_status (the three-state machine with the VALID ↔ INVALID cycle and the bootstrap NOT_ATTESTED → VALID first edge)"
            - "endpoints.POST /v1/drivers/{driver_id}/refresh-endorsement (the regulator's attestation and revoke endpoint; the attestation-variant is the positive-return edge of the cycle; the revoke-variant is the regulator-manual-cause version of the negative edge)"
            - "endpoints.POST /v1/penalties (the manual-penalty-cause of the points-threshold-crossing negative edge)"
            - "endpoints.POST /v1/trips/{tid}/gps-reports (the GPS-violation-auto-penalty-cause of the points-threshold-crossing negative edge — the same negative cause through a different upstream trigger)"
            - "endpoints.POST /v1/penalties/{id}/uphold (the appeal-uphold's points-void, which lowers the count and can drop the driver back below threshold — necessary-but-not-sufficient for the positive-return edge)"
            - "endpoints.POST /v1/_clock/advance and POST /v1/_sweep/run (the wall-clock-driven rolling-window-fall-off, which also lowers the count over time without any explicit appeal)"
            - "calculations.driver_penalty_point_rolling_total (the input-of-the-threshold check)"
            - "constants_numeric_values.THRESHOLD_DRIVER_SUSPENSION_POINTS = 12 (the threshold)"
            - "constants_numeric_values.PENALTY_WINDOW_DAYS = 365 (the rolling-window's length)"
            - "constants_numeric_values.APPEAL_WINDOW_DAYS = 30 (the appeal-window length)"
          distinguishing_aspect: |
            The Driver's cycle has two qualitatively distinct triggers for the
            negative edge (the points-threshold-crossing cause and the
            time-expiry cause, both of which fire the same VALID → INVALID
            auto-transition per the §1.2 Driver state-machine's prose), and
            two qualitatively distinct paths for the points-cause's recovery
            (the appeal-uphold's explicit-void of a specific penalty vs the
            wall-clock-rolling-window's natural fall-off of an aged-out
            penalty). The combination of multi-cause-negative-edge and
            multi-mechanism-points-decay distinguishes the Driver cycle from
            the Company-and-Route cycles, whose negative edges are
            single-cause (the regulator's revoke or reject action). The Permit
            cycle is also single-cause-per-direction (the verify-compliance's
            snapshot-vs-live verdict on each direction). The Driver cycle's
            cause-multiplicity on the negative edge is its non-linear-shape's
            distinguishing characteristic, the fourth entity in the §1.2 state-
            machine landscape contributing to rule-3 well above the
            two-instance minimum. The qualitative-difference axis across the
            four entities' cycles is the cause-of-the-cycle-edge: TransportCompany's
            cycle is regulator-action-revoke-on-an-approved-row; TransportRoute's is
            regulator-action-reject-on-a-pending-row; Permit's is system-derived-
            from-grounding-disagreement (the only purely-derived-from-aggregate-state
            cycle); Driver's is multi-cause-points-or-time-expiry-on-the-negative-edge
            and pure-regulator-action on the positive-return edge. Four cycles,
            four qualitatively distinct cause-patterns, four entities — the
            scaffold's state-machine landscape is non-linear-shape-rich and the
            rule-3 inventory is comfortably above the minimum.
          test_recipe:
            setup:
              - "Fixture: an ACTIVE permit pm-driver-cycle-1 with a single driver dr-cycle-driver-1, all the standard one-of-everything else. The driver starts at NOT_ATTESTED in a fresh fixture, then the regulator's first POST /v1/drivers/dr-cycle-driver-1/refresh-endorsement with body {endorsement_valid_until: now + 2 years, endorsement_classes: ['3']} walks the driver from NOT_ATTESTED to VALID via the first edge of the cycle's bootstrap."
              - "Wait — actually the permit can't be issued unless the driver is already VALID at issue-time (the §1.4 priority-510 ERR_DRIVER_ENDORSEMENT_INVALID check on the issue path), so the test's setup order is: create-the-driver-as-NOT_ATTESTED, regulator-refresh-endorsement-attesting-VALID, then operator-files-permit-application, then regulator-issues-the-permit. By the time the permit is ACTIVE the driver is already in VALID state (the NOT_ATTESTED phase is a brief gap between driver-creation and the first endorsement-attestation)."
              - "Phase A — the points-threshold cause: the regulator issues a manual penalty against the driver with points_value high enough to cross the threshold in one step (e.g., points_value=12, observed_at=now). The driver's current_rolling_points jumps to 12 which is `>= THRESHOLD_DRIVER_SUSPENSION_POINTS=12` and the auto-flip fires. The driver's hazmat_endorsement_status flips from VALID to INVALID atomically with the penalty's insert transaction. The §1.2 Driver VALID → INVALID system-transition's guard `points >= threshold` is satisfied."
              - "Phase A's cascade: the permit pm-driver-cycle-1's drivers-leg is now live-false; a subsequent POST /v1/permits/pm-driver-cycle-1/verify-compliance fires the ACTIVE→SUSPENDED transition. This is the rule-4 cascade-A's depth-from-manual-penalty observable (depth-3-from-the-manual-penalty: penalty.insert → driver.endorsement-flip → permit-suspension on the next verify-compliance, a chain of three causally-linked mutations across three different entities)."
              - "Phase B — the recovery: the operator files an appeal-of-the-penalty out-of-band, the regulator finds in the operator's favor and runs POST /v1/penalties/{the-just-issued-penalty's-id}/uphold with body {uphold_reason: 'Out-of-band evidence overturns the original observation'}. The penalty's void_status flips to UPHELD, the driver's current_rolling_points is recomputed-from-non-UPHELD penalties (which is zero now, since the only penalty has been UPHELD), and the cached count is 0. But the driver's hazmat_endorsement_status is NOT automatically flipped back to VALID — the regulator must explicitly attest, per the keep-the-regulator-in-the-loop convention."
              - "Phase B's positive-return edge: the regulator runs POST /v1/drivers/dr-cycle-driver-1/refresh-endorsement with body {endorsement_valid_until: now + 2 years, endorsement_classes: ['3']} again (the re-attestation, after the points have dropped below threshold). The handler's precondition-check `driver.current_rolling_points < THRESHOLD_DRIVER_SUSPENSION_POINTS` succeeds (the count is 0 after the uphold) and the driver flips back from INVALID to VALID. This is the cycle's positive-return edge — the regulator's explicit re-attestation."
              - "Phase C — the cycle's outer-cascade: the permit pm-driver-cycle-1 is still SUSPENDED on disk from Phase A's cascade. The driver's flip-back-to-VALID is the upstream-cause for the permit's reinstate-cascade. POST /v1/permits/pm-driver-cycle-1/verify-compliance fires the SUSPENDED→ACTIVE reinstate (the §1.2 Permit SUSPENDED→ACTIVE transition's guard sees all five live legs now true and the wall-clock still in-window)."
              - "Phase D — the alternate negative-edge cause (time-expiry, the other-cause-of-the-VALID→INVALID transition): the regulator's-set `endorsement_valid_until` was T+2yr at the re-attestation; advance the clock past T+2yr; POST /v1/_sweep/run; the §1.2 Driver VALID→INVALID system-transition's guard fires on the wall-clock-past-validity condition; the driver flips to INVALID without any new penalty. The cascade onto the permit fires on the next verify-compliance (the permit is again ACTIVE-after-the-Phase-C-reinstate, and a verify here flips it back to SUSPENDED due to the new endorsement-expiry leg-failure)."
              - "Phase D's recovery: the regulator's-action-required-because-of-keep-in-the-loop is to run a fresh refresh-endorsement with a future `endorsement_valid_until`, which walks the driver INVALID→VALID a second time through the cycle. This is the cycle's two-different-cause-of-negative-edge characteristic — the same negative-state INVALID is reachable from two distinct upstream events (points-crossing in Phase A, time-expiry in Phase D), and the same positive-edge endpoint (refresh-endorsement) handles the recovery in both cases."
            trigger:
              - "The four-phase sequence above is the trigger. The 'observable' of the cycle's closure-twice is the driver row arriving at VALID at the end of Phase C and again at VALID at the end of Phase D's recovery (the second cycle's positive-return edge), with two distinct points-and-time-stamps on the driver's history that reflect the two different negative-edge causes."
            assert:
              - "End of Phase A (after penalty-insert): driver.hazmat_endorsement_status == 'INVALID', driver.current_rolling_points == 12. The auto-flip's-cause is the threshold-crossing, observable as the points-equals-threshold state at the moment of the flip."
              - "After the verify-compliance in Phase A's cascade tail: permit.lifecycle_status == 'SUSPENDED'. The deferred cascade has flushed onto the permit through the verify-compliance's standard machinery."
              - "End of Phase B's uphold: the upheld penalty's void_status == 'UPHELD'. The driver's current_rolling_points == 0. The driver's hazmat_endorsement_status is STILL 'INVALID' (the auto-recover-from-below-threshold path is intentionally not in the §1.2 state-machine's transitions list — the regulator must explicitly re-attest)."
              - "End of Phase B's re-attest: driver.hazmat_endorsement_status == 'VALID'. The driver's endorsement_valid_until is the new attestation's body-value (T_attest_2 + 2 years)."
              - "End of Phase C's verify-compliance: permit.lifecycle_status == 'ACTIVE'. The cycle on the Permit closed (the SUSPENDED → ACTIVE reinstate-edge fired). The wallet is unchanged across the whole cycle so far (consistent with the rule-9-A currency-conservation)."
              - "End of Phase D's clock-advance-past-endorsement-valid_until plus sweep-run: driver.hazmat_endorsement_status == 'INVALID' once again, this time with the wall-clock-expiry as the cause. The driver's `endorsement_valid_until` is in the past (specifically equal to the wall-clock-now-at-the-moment-of-the-expiry-edge being the body-supplied valid_until from Phase B's re-attestation). The points are still 0 (no new penalties arrived in Phase D), so the cause is unambiguously the time-expiry, not the points-crossing — distinguishable from Phase A's cause by reading the driver's-current_rolling_points (0 in Phase D, 12 in Phase A)."
              - "End of Phase D's second re-attest by the regulator: driver.hazmat_endorsement_status == 'VALID' a second time, with a new endorsement_valid_until that's the new attestation's body-value. The cycle has closed twice, with the two negative-edge-causes (points-crossing in cycle-1, time-expiry in cycle-2) being the rule-3 'multi-cause non-linear-shape' distinguishing feature."

        - name: trip_lifecycle_fork_from_in_transit_to_completed_or_aborted_with_divergent_side_effects
          shape: "branching fork: PLANNED → IN_TRANSIT → {COMPLETED, ABORTED}. The two terminal branches have qualitatively-distinct side-effect lists per the §1.2 prose: COMPLETED writes `actual_arrival_at = now()` and closes the GPS stream by virtue of the trip's terminal-status; ABORTED writes `aborted_at = now()` and `abort_reason` (which is one of the four enum values OPERATOR_ABORT, PERMIT_EXPIRED_CASCADE, PERMIT_SUSPENDED_CASCADE, GPS_VIOLATION_LIMIT, the last of which is declared-but-unreachable in this scaffold per the §1.2 Trip prose's GPS_VIOLATION_LIMIT footnote). The fork's two branches have *non-overlapping* side-effect-field-sets: COMPLETED's `actual_arrival_at` field is null on ABORTED rows, and ABORTED's `aborted_at` and `abort_reason` fields are null on COMPLETED rows. The two terminal states are *distinguishable on the on-disk row* by which field-pair is non-null. This is the rule-3 'divergent side-effect sets per branch' clause of the branching-fork-join shape."
          entity: Trip
          grounds:
            - "state_machines.Trip.trip_status (the four-state machine PLANNED, IN_TRANSIT, COMPLETED, ABORTED with the fork from IN_TRANSIT)"
            - "endpoints.POST /v1/trips/{id}/arrive (the COMPLETED-branch's action endpoint)"
            - "endpoints.POST /v1/trips/{id}/abort (the operator-initiated ABORTED-branch with abort_reason=OPERATOR_ABORT)"
            - "endpoints.POST /v1/permits/{id}/void-issue's cascade onto its child trips (the cascade-source-of-abort_reason=PERMIT_SUSPENDED_CASCADE per the enum-economy choice in the §1.2 Permit VOIDED prose)"
            - "endpoints.POST /v1/_sweep/run's cascade onto the children of an expired permit (the cascade-source-of-abort_reason=PERMIT_EXPIRED_CASCADE)"
            - "entities.Trip.actual_arrival_at (the COMPLETED-only field) and Trip.aborted_at, Trip.abort_reason (the ABORTED-only fields)"
          distinguishing_aspect: |
            The branching-fork-join shape of §0.5 rule-3's allowed shapes is the
            non-cycle alternative to the cycle-based shapes of the other four
            state-machines (Company, Route, Permit, Driver each have a cycle).
            The Trip's fork-from-IN_TRANSIT is the *branching* archetype, and the
            two outgoing edges have divergent side-effect-field-sets on the
            on-disk row that make the two terminal states observationally
            distinguishable. The Trip entity's fork is *the only non-cycle
            non-linear shape* in the scaffold's state-machine landscape — the
            other four non-linear-shaped machines are all cycles. The diversity
            of shapes across the §1.2 state-machine inventory (four cycles plus
            one branching-fork) exceeds the rule-3 two-instance-minimum-on-
            different-entities clause's literal requirement (which would be
            satisfied by any two cycles, or one cycle and one fork, or any
            non-linear pair on different entities). The five-machine inventory
            with four-cycles-plus-one-fork is the scaffold's diversity-bonus.
          test_recipe:
            setup:
              - "Fixture: ACTIVE permit pm-trip-fork-1 with a single authorized driver and vehicle. The permit's valid_from = now and valid_until = now + 365 days. The fixture creates two trips on this permit: trip-A scheduled `[now+1h, now+5h)`, trip-B scheduled `[now+10h, now+14h)` — non-overlapping windows so the vehicle-double-booking rule doesn't fire."
              - "Action sequence for trip-A — the COMPLETED branch: POST /v1/_clock/advance to now+1h (trip-A's scheduled-departure). POST /v1/trips/trip-A/depart — the trip transitions PLANNED → IN_TRANSIT with actual_departure_at = the just-advanced clock-value. Append one GPS report to its stream (in-window, monotonically-greater than the empty stream's null cursor, no violations). POST /_clock/advance to now+4h (one hour before scheduled-arrival). POST /v1/trips/trip-A/arrive — the trip transitions IN_TRANSIT → COMPLETED with actual_arrival_at = the just-advanced clock-value. The aborted_at and abort_reason fields are null on the COMPLETED row."
              - "Action sequence for trip-B — the ABORTED branch via OPERATOR_ABORT: POST /v1/_clock/advance to now+10h. POST /v1/trips/trip-B/depart — IN_TRANSIT. POST /_clock/advance to now+12h (mid-trip). POST /v1/trips/trip-B/abort with body {reason_note: 'Mechanical issue, cargo returned to origin'}. The trip transitions IN_TRANSIT → ABORTED with aborted_at = the just-advanced clock-value and abort_reason = 'OPERATOR_ABORT'. The actual_arrival_at field is null on the ABORTED row."
              - "Optional Phase C — the cascade-branch via PERMIT_EXPIRED_CASCADE: a third trip-C scheduled `[now+364d+22h, now+364d+23h)`. The trip is created and departs at the scheduled departure time. The clock advances past now+365d (the permit's valid_until). POST /_sweep/run fires the §1.2 Permit ACTIVE→EXPIRED transition, whose side-effect-block lists 'for every PLANNED-or-IN_TRANSIT trip on this permit, set trip_status=ABORTED, abort_reason=PERMIT_EXPIRED_CASCADE, aborted_at=now()'. After the sweep, trip-C's on-disk row has trip_status=ABORTED and abort_reason='PERMIT_EXPIRED_CASCADE'."
            trigger:
              - "The two-or-three branches of the fork are the action paths above. The 'observable' of the fork's divergent side-effects is the post-state of the trip row's `actual_arrival_at`, `aborted_at`, and `abort_reason` fields after the trip reaches its terminal state — exactly one of the two field-groups is non-null."
            assert:
              - "trip-A after the arrive call: trip_status == 'COMPLETED', actual_departure_at != null, actual_arrival_at != null AND > actual_departure_at, aborted_at == null, abort_reason == null. The COMPLETED-branch's signature field-set is (actual_arrival_at, no aborted_at, no abort_reason)."
              - "trip-B after the operator-abort call: trip_status == 'ABORTED', actual_departure_at != null, actual_arrival_at == null, aborted_at != null AND > actual_departure_at, abort_reason == 'OPERATOR_ABORT'. The ABORTED-via-operator branch's signature field-set is the complement (no actual_arrival_at, aborted_at present, abort_reason='OPERATOR_ABORT')."
              - "trip-C after the permit-expiry-cascade-sweep (if exercised): trip_status == 'ABORTED', actual_departure_at != null (it departed before the expiry), actual_arrival_at == null, aborted_at == the sweep's-now-value, abort_reason == 'PERMIT_EXPIRED_CASCADE'. The cascade-aborted branch's signature is the ABORTED-field-set with the distinctive abort_reason discriminator."
              - "The three trips' on-disk rows together form the three distinguishable terminal-state-shapes of the §1.2 Trip state-machine's fork. The fourth abort_reason enum value GPS_VIOLATION_LIMIT is *declared but unreachable* per the §1.2 Trip-state's prose on the GPS_VIOLATION_LIMIT-footnote, and the difficulty-design index doesn't generate a worked example for it because there's no §1.2 transition whose side-effect-block sets it. (A future scaffold-revision that adds a per-trip-violation-cap auto-abort would activate the enum value and warrant a fourth worked example here; the current scaffold targets the orchestrator's easier-end-of-Advanced and omits the violation-cap-auto-abort.)"
              - "The GPS streams' state across the three trips: trip-A's stream has the one report submitted during IN_TRANSIT; trip-B's stream is empty (no GPS reports were submitted before the abort, in this test's scenario); trip-C's stream depends on whether GPS reports were submitted between trip-C's depart and the sweep's expiry-cascade. The §1.2 prose says the cascade-abort's effect on the GPS stream is the standard 'the trip's terminal-state closes the in-window' check on subsequent gps-ingest attempts (ERR_GPS_OUT_OF_WINDOW for any further reports). The streams' contents are auditable via GET /v1/trips/{trip_id}/gps-reports for each of the three trips, returning the list of reports up to the trip's terminal moment."

    # §0.5 Rule 4 — transitive_cascade — ≥ 2 instances with different triggers, depths 3 and 2.
    transitive_cascade:
      instances:

        - name: gps_speed_violation_cascades_to_permit_suspension_depth_four
          trigger_endpoint: "POST /v1/trips/{tid}/gps-reports with a body whose `speed_kph` strictly exceeds MAX_HAZMAT_SPEED_KPH (the constant whose value is 80.0 kph per the constants_numeric_values block above)"
          depth: 4
          chain: |
            Hop 0 (the original action): the POST /v1/trips/{tid}/gps-reports request arrives at the
                  server with a body whose speed_kph value is, say, 95.0 (which is > 80.0). The
                  server's gps-ingest handler validates the request (passes the in-window and
                  monotonicity checks), classifies the sample via `gps_violation_classification`
                  (the speed_violated flag is true since 95.0 > 80.0), and atomically:
            Hop 1 (the first cascade-link, on the same transaction as the gps-report-insert): the
                  handler inserts a Penalty row with subject_type=DRIVER, subject_id=the trip's
                  driver_id, points_value=GPS_VIOLATION_SPEED_POINTS=3 (per the constants table),
                  source=GPS_VIOLATION_SPEED, source_gps_report_id=the just-inserted GPS-report's
                  id, trip_id=the trip's id, observed_at=the GPS report's reported_at,
                  void_status=ACTIVE.
            Hop 2 (the second cascade-link, on the same transaction): the Penalty.insert's
                  side-effect (per the §1.3 calc `driver_penalty_point_rolling_total`'s trigger
                  list, sub-bullet (a)) updates the driver's cached `current_rolling_points`
                  by recomputing the rolling-window sum, which jumps from its pre-call value
                  by +3 to the new value. If the new value `>= THRESHOLD_DRIVER_SUSPENSION_POINTS
                  = 12`, the §1.2 Driver VALID→INVALID system-transition's guard fires and the
                  driver's `hazmat_endorsement_status` flips from VALID to INVALID in the same
                  transaction. This is the per-Driver-row mutation that is the cascade's third
                  link from the original gps-write.
            Hop 3 (the third cascade-link, on the *next* verify-compliance call — deferred): the
                  cross-aggregate cascade onto every Permit listing this driver does NOT fire
                  synchronously inside the gps-ingest's transaction. The Permit rows are read-
                  locked at the §1.2 prose's deferred-flush convention: the verify-compliance
                  endpoint or the daily sweep is the deterministic flush point. On the next
                  POST /v1/permits/{pid}/verify-compliance call on any permit whose
                  `authorized_driver_ids` contains the flipped driver, the live recompute's
                  drivers-leg evaluates to false (the live read sees the just-flipped INVALID
                  status), the snapshot-vs-live disagreement fires the §1.2 Permit
                  ACTIVE→SUSPENDED transition, and the permit's lifecycle_status writes to
                  SUSPENDED. This is the depth-4 hop counting from the original gps-report-
                  arrival as hop 0.
          grounds:
            - "endpoints.POST /v1/trips/{tid}/gps-reports (the trigger)"
            - "calculations.gps_violation_classification (the classifier whose speed_violated flag drives hop-1)"
            - "constants_numeric_values.MAX_HAZMAT_SPEED_KPH = 80.0 (the threshold the body's 95.0 exceeds)"
            - "constants_numeric_values.GPS_VIOLATION_SPEED_POINTS = 3 (the points-value the auto-penalty carries)"
            - "constants_numeric_values.THRESHOLD_DRIVER_SUSPENSION_POINTS = 12 (the points-cutoff for the hop-2 driver-flip)"
            - "state_machines.Driver.VALID_to_INVALID (the system-actor transition fired on the threshold-crossing in hop 2)"
            - "state_machines.Permit.ACTIVE_to_SUSPENDED (the system-actor transition fired by the next verify-compliance's disagreement observation in hop 3)"
            - "endpoints.POST /v1/permits/{pid}/verify-compliance (the deterministic flush endpoint for the deferred hop-3)"
          distinguishing_aspect: |
            The cascade's depth is 4 (counting the original gps-report-arrival as hop 0, the
            auto-penalty-insert as hop 1, the driver-endorsement-flip as hop 2, and the
            permit-state-flip-on-the-next-verify-compliance as hop 3). The four hops touch
            *four different entity tables* (GPSReport, Penalty, Driver, Permit) in sequence,
            each hop *causally-linked* to the prior hop (the gps-report's violation flag
            *causes* the penalty's insert; the penalty's insert's side-effect *causes* the
            driver's points-cache-update-and-threshold-check; the driver's status-flip *causes*
            the next verify-compliance's disagreement-and-permit-state-flip). The depth-≥-3
            cascade-clause of rule-4 is satisfied (depth 4 > 3). The chain's trigger is the
            POST /gps-reports endpoint, which is the rule-4 "originating transition" for this
            cascade. The other rule-4 cascade-instance must have a *different* originating
            trigger, satisfying the "different triggering transitions" differentiation clause —
            see the next instance, which originates from the daily sweep's wall-clock-expiry
            check, a qualitatively different trigger (system-clock-driven, not user-action-
            driven).
          test_recipe:
            setup:
              - "Pre-seed the driver's `current_rolling_points` to 9 by issuing three prior manual penalties of 3 points each over the past hour (or one manual penalty of 9 points; the count is what matters). The driver's hazmat_endorsement_status is still VALID because 9 < 12. The permit pm-cascade-A-1 is ACTIVE, listing this driver."
              - "The trip trip-cascade-A-1 is IN_TRANSIT on pm-cascade-A-1, with the driver and a vehicle that's also on the permit's authorized list. The trip's parent permit's `route_id` resolves to an APPROVED route whose polyline passes near the test-fixture's GPS coordinate (the route's polyline is the standard test-fixture's lat,lon list; the test uses a coordinate that is on-route, distance-to-polyline < OFF_ROUTE_RADIUS_M, so the off-route violation doesn't fire — only the speed violation)."
              - "The §1.0 idempotency-block's per-trip slot for an `Idempotency-Key: cascade-A-key-1` value is empty, so the request below isn't a replay."
            trigger:
              - "POST /v1/trips/trip-cascade-A-1/gps-reports with header `Idempotency-Key: cascade-A-key-1` and body {reported_at: now-plus-one-second-past-the-trip's-latest-gps-at, lat: <on-route lat>, lon: <on-route lon>, speed_kph: 95.0, heading_deg: 90.0}. The 95.0 exceeds MAX_HAZMAT_SPEED_KPH = 80.0, triggering the speed-violation auto-penalty path."
            assert:
              - "The response is 201 Created with a body that includes the GPSReport's `id`, the `off_route_distance_m` (a small value < 500), the `auto_penalty_ids` array containing exactly one id (the speed-violation auto-penalty's id), and the `cascade_summary` sub-object with the driver's post-update `current_rolling_points == 12` (9 + 3) AND `hazmat_endorsement_status == 'INVALID'` (the threshold-equal-flips per the §1.4 priority-510's `>=` boundary semantics). The hop-2 driver-flip is observable in the response itself."
              - "GET /v1/penalties/{auto-penalty-id-from-the-response} (which there is no public endpoint for in the scaffold's API surface — wait, there isn't a GET /penalties/{id} in §1.5. The auto-penalty is observable indirectly via GET /v1/drivers/{driver_id}/penalty-summary's `active_penalties_in_window` list, which lists the auto-penalty's points_value=3, source='GPS_VIOLATION_SPEED', trip_id=trip-cascade-A-1's id, source_gps_report_id=the GPS-report's id from the response). The test asserts on the summary-endpoint's contents rather than on a missing per-penalty-read endpoint."
              - "Driver-read via GET /v1/drivers/{driver_id}: hazmat_endorsement_status == 'INVALID', current_rolling_points == 12, endorsement_valid_until unchanged from its pre-call value (the wall-clock-expiry path isn't the cause of this flip — the points-threshold-crossing is). The two distinct flip-causes are distinguishable on the row by which field-pair is the apparent cause (current_rolling_points >= threshold vs endorsement_valid_until <= now)."
              - "Permit-read via GET /v1/permits/pm-cascade-A-1 *before* the deferred hop-3 verify-compliance: lifecycle_status == 'ACTIVE' (the on-disk row hasn't moved yet because the cross-aggregate cascade is deferred). The response's live_per_leg.live_drivers_ok == false (the live read sees the driver's INVALID standing), while snapshot_overall == true (the on-disk snapshot is unchanged). The snapshot-vs-live disagreement is the standard observable of the pending cascade — see also the rule-1 dual-variant instance's per-permit observation."
              - "Flush the deferred cascade: POST /v1/permits/pm-cascade-A-1/verify-compliance as the regulator. The response's transition_fired is 'ACTIVE_TO_SUSPENDED', pre_status == 'ACTIVE', post_status == 'SUSPENDED'. The on-disk snapshot is rewritten with snapshot_driver_endorsements[the driver's id] == false. Subsequent GET /v1/permits/pm-cascade-A-1 returns lifecycle_status == 'SUSPENDED' AND snapshot_overall == false AND live_verdict == false, the snapshot-and-live now agreeing on the false verdict."
              - "Subsequent POST /v1/trips/trip-cascade-A-1/gps-reports attempts (which is still in IN_TRANSIT trip-status because the suspension doesn't auto-abort the trip per the §1.2 SUSPENDED prose) return HTTP 409 with `error_id == 'ERR_PERMIT_NOT_ACTIVE'`. This is the gating-effect-of-the-suspension on the GPS stream. The trip can still receive the arrive endpoint (the trip-completion is allowed during a parent-permit-suspension per the §1.5 arrive-endpoint's prose's nuance — the operator's completion-attestation is permitted, only the GPS-ingest's data-stream is gated)."
              - "The cascade's full audit trail across the four touched tables: the GPSReport row's `auto_penalty_ids` lists the auto-Penalty's id (the hop-1's effect). The auto-Penalty row's `source_gps_report_id` lists the GPSReport's id (the back-pointer). The Driver's `current_rolling_points` is the sum of the four penalties (the pre-existing 9 points plus the auto-penalty's 3 points, equaling 12). The Permit's `last_verified_at` is the verify-compliance call's-now timestamp, and the snapshot's drivers-leg flag for this driver is false (the post-cascade reconciled state). The four-touched-tables form the cascade-trace, and every link's causal-pointer is present, satisfying the spec's 'every cascade link must be observable through the API surface' principle."

        - name: clock_sweep_expires_permit_and_cascade_aborts_in_flight_trips_depth_two
          trigger_endpoint: "POST /v1/_clock/advance followed by POST /v1/_sweep/run (the test-harness's deterministic version of the production daily-cron's wall-clock-tick-plus-sweep-tick). In production, the OS clock's tick is the equivalent of the /_clock/advance call's body-supplied seconds, and the cron's wake-up at the daily boundary is the equivalent of the /_sweep/run call. The test-harness exposes both as endpoints per the spec's testability-completeness principle for time-driven and periodic-cascade-driven transitions."
          depth: 2
          chain: |
            Hop 0 (the originating trigger, distinct from the rule-4-cascade-A's gps-report-
                  trigger): POST /v1/_clock/advance with `advance_seconds` enough to push the
                  logical clock past a permit's `valid_until` value. The clock advances; no
                  state-machine transitions fire yet because the §1.2 Permit ACTIVE→EXPIRED
                  transition's guard `now() >= valid_until` is now-true but the guard's
                  evaluator is the sweep, not the clock-advance handler.
            Hop 1 (the first cascade-link, fired by the sweep's per-ACTIVE-permit pass): POST
                  /v1/_sweep/run. The sweep walks every Permit row in ACTIVE state. For each
                  whose `valid_until <= now()` (with the now() being the just-advanced clock-
                  value), the sweep fires the §1.2 Permit ACTIVE→EXPIRED system-actor
                  transition. The permit's lifecycle_status writes to EXPIRED. The wallet is
                  not refunded (the term elapsed; the fee was earned). The
                  `last_verified_at` is set to the sweep's-now-value. The
                  `snapshot_within_window` is overwritten to false. The SUSPENDED permits whose
                  valid_until has also been crossed transition SUSPENDED→EXPIRED in the same
                  pass (the sweep handles both starting-states for the wall-clock-expiry edge).
            Hop 2 (the second cascade-link, in the *same* sweep transaction as hop 1's
                  per-permit transition): each EXPIRED-going permit's §1.2 transition's
                  side-effects-block includes 'for every PLANNED-or-IN_TRANSIT child Trip, set
                  trip_status=ABORTED, abort_reason=PERMIT_EXPIRED_CASCADE, aborted_at=now()'.
                  The sweep's per-permit handler iterates the trip table joining on the
                  permit's id, and writes the ABORTED state to each in-flight child. The cross-
                  aggregate cascade is *synchronous* on the sweep's per-permit-pass — the
                  permit's expiry-and-the-children's-aborts are atomically observable as the
                  sweep's-pass's effect. This is the depth-2 cascade-link counting from the
                  sweep's-trigger as hop 0.
            (No hop 3 in this cascade chain. The cascade-trip-aborts close the trips
            terminally; subsequent GPS-stream-writes against the cascade-aborted trips return
            ERR_GPS_OUT_OF_WINDOW because the trips' terminal-status closes the in-window
            check's right edge. But the GPS-stream's continued-rejection is a *consequence*
            of the trip-abort, not a separate cascade-link, because no further entity-table
            mutation fires in the consequential rejection — the rejection is the API-surface's
            observable but it doesn't change any database row. So the chain's-depth, measured
            as the number of causally-linked entity-table mutations from the trigger, is two.)
          grounds:
            - "endpoints.POST /v1/_clock/advance (the wall-clock-advancer)"
            - "endpoints.POST /v1/_sweep/run (the periodic-job-trigger)"
            - "state_machines.Permit.ACTIVE_to_EXPIRED (the system-actor transition fired by the sweep on the wall-clock-crossed-valid_until condition; the §1.2 transition's guard's expression is `lifecycle_status == 'ACTIVE' AND now() >= valid_until`)"
            - "state_machines.Permit.SUSPENDED_to_EXPIRED (the parallel-edge for already-SUSPENDED permits whose valid_until has crossed; the sweep handles both edges in the same per-permit pass)"
            - "the Trip side-effect-block on the Permit ACTIVE/SUSPENDED → EXPIRED transitions: 'cascade-abort every in-flight child trip with abort_reason=PERMIT_EXPIRED_CASCADE'"
            - "constants_numeric_values.PERMIT_DEFAULT_VALIDITY_DAYS = 365 (the term-length; the test's clock-advance is in this ballpark)"
            - "concurrency_rules — there isn't a dedicated concurrency rule for the sweep-runs because the sweep's per-row-per-transaction model means each affected row's mutation is independent and the cross-row ordering is the natural-iteration order which the spec doesn't pin (the sweep is conceptually order-independent across the rows it visits, since each row's transition's guard is row-local)."
          distinguishing_aspect: |
            The originating trigger is the wall-clock-advance-plus-sweep-tick, qualitatively
            distinct from rule-4 cascade-A's user-action-gps-report-arrival trigger. The cascade
            depth is 2, the lower of the rule-4's-two-depths-clause's pair-of-depths (the
            paired cascade-A is depth 4, the higher half of the depth-≥3-and-depth-≥-2 split).
            The cascade's effect-table fan-out is 1-to-N (one permit's expiry-transition fans
            out to N child-trip-aborts in the same sweep-pass), whereas the cascade-A's effect
            is a linear chain (one gps → one penalty → one driver-flip → one permit-suspend on
            the eventual verify-compliance). The two cascades' shape are *fan-out* vs *linear-
            chain*, which is the structural-distinction beyond the depth-and-trigger differences.
          test_recipe:
            setup:
              - "Fixture: an ACTIVE permit pm-cascade-B-1 whose `valid_until = T_expire`. The permit has three child trips in three different states: trip-B-planned in trip_status=PLANNED with scheduled_departure_at = T_expire+10min (i.e., scheduled to depart *after* the permit's expiry, which is logically impossible-but-the-test-fixture-creates-it-anyway-to-exercise-the-edge — wait, the trip-creation's §1.4 priority-522 ERR_OUTSIDE_VALIDITY_WINDOW check would reject a scheduled-departure-after-valid_until at creation time; the trip-creation guards the scheduled window against the permit's window. So this trip can't be created in the first place. The fixture's three trips are: trip-B-completed (already arrived, in COMPLETED before the sweep's pass), trip-B-in-transit (departed at T_expire-2h, still IN_TRANSIT at T_expire, scheduled_arrival_at=T_expire+1h which is just-after the expiry, which IS allowed at trip-creation time because the §1.5 trip-creation prose says `scheduled_arrival_at <= permit.valid_until` is the closed-on-the-right convention, so a trip scheduled to end exactly at or before valid_until is fine — but a trip scheduled to end strictly after valid_until is rejected. Setting scheduled_arrival_at=T_expire (the exact-boundary) lets the trip exist; the §1.5 prose's closed-on-the-arrival-edge admits the boundary). And trip-B-still-planned with scheduled_departure_at=T_expire-1h and scheduled_arrival_at=T_expire (a planned trip whose whole window is in the last hour before expiry, which is valid at creation time). The test's three trips are trip-B-completed in COMPLETED (untouched by the cascade because it's already-terminal), trip-B-in-transit in IN_TRANSIT (the cascade's prime target — it's mid-flight when the expiry hits), and trip-B-still-planned in PLANNED (a never-departed trip in the same expiring permit, the cascade's other target — the §1.2 prose's cascade-block lists both PLANNED and IN_TRANSIT as the abort-targets)."
              - "Initial state assertions: GET /v1/permits/pm-cascade-B-1 returns lifecycle_status=='ACTIVE', valid_until=T_expire. The three trips' trip_status fields are 'COMPLETED', 'IN_TRANSIT', 'PLANNED' respectively. trip-B-completed has its actual_arrival_at set from its prior arrive call; the other two have actual_arrival_at==null."
            trigger:
              - "Hop 0: POST /v1/_clock/advance with advance_seconds = (T_expire - current_now).total_seconds() + 1, run_sweep_after_advance=false. The clock's value lands at T_expire+1-second-of-fudge-factor. No transitions have fired yet — the clock-advance is a pure-time-effect."
              - "Hop 1+2: POST /v1/_sweep/run with body {scope: 'PERMITS_ONLY'}. The sweep's permits-only pass walks the Permit table. For pm-cascade-B-1, the §1.2 ACTIVE→EXPIRED guard `now() >= valid_until` is true (now is one second past T_expire), the transition fires, the permit's lifecycle_status flips to EXPIRED, and the side-effects-block's trip-cascade fires synchronously in the same sweep-pass's-transaction-for-this-permit. The sweep response's `permit_transitions` array has one entry for pm-cascade-B-1 with pre_status='ACTIVE', post_status='EXPIRED', cause='WALL_CLOCK_EXPIRY', cascade_trip_aborts=[trip-B-in-transit-id, trip-B-still-planned-id]. (trip-B-completed isn't in the cascade list because its trip_status is already-terminal COMPLETED, which the cascade-block's filter `trip_status IN {PLANNED, IN_TRANSIT}` excludes.)"
            assert:
              - "Sweep response: response.data.permit_transitions has length 1 (only the one expiring permit in the fixture). The single entry's `permit_id == pm-cascade-B-1's id`, pre_status='ACTIVE', post_status='EXPIRED', cause='WALL_CLOCK_EXPIRY', `cascade_trip_aborts` is a list of two trip-ids (the still-planned and in-transit ones, sorted in some implementation-defined order — the test asserts on the set-equality of the list's contents)."
              - "GET /v1/permits/pm-cascade-B-1: lifecycle_status == 'EXPIRED', `last_verified_at` is the sweep's-now-value, snapshot_within_window is false, all other snapshot fields are the prior verify's values (the sweep's-expiry-pass doesn't re-evaluate the five-leg validity because the wall-clock-leg's failure alone is sufficient cause for the EXPIRED terminal state)."
              - "GET /v1/trips/trip-B-in-transit-id: trip_status == 'ABORTED', actual_departure_at is the prior depart-call's timestamp (T_expire-2h), actual_arrival_at == null, aborted_at == the sweep's-now-value (T_expire+1-second), abort_reason == 'PERMIT_EXPIRED_CASCADE'. The trip's GPS-stream history is intact (whatever reports were posted between the depart and the sweep's-pass remain on the GPSReport table for audit; the cascade-abort doesn't delete the historical samples)."
              - "GET /v1/trips/trip-B-still-planned-id: trip_status == 'ABORTED', actual_departure_at == null (never departed), actual_arrival_at == null, aborted_at == the sweep's-now-value, abort_reason == 'PERMIT_EXPIRED_CASCADE'. The empty-actual-fields-and-the-non-null-aborted_at signature is the distinctive shape of a planned-trip-aborted-by-cascade."
              - "GET /v1/trips/trip-B-completed-id: untouched by the cascade — trip_status == 'COMPLETED' (its terminal state from the prior arrive call), actual_arrival_at is its pre-cascade timestamp, aborted_at == null. The cascade's filter excludes already-terminal trips, so a completed-before-the-expiry trip's audit-record is preserved unmodified."
              - "The wallet of pm-cascade-B-1's parent company is unchanged across the sweep — the expiry is a natural-term-end, not a fee-refund event. The rule-9-A's currency-conservation across an (issue, full-term-elapsed-without-renewal-or-void) sequence is: the wallet's net change is the issue's debit, and the sweep's-expiry doesn't add a counterbalancing credit. The conservation invariant holds in the sense that the issue's fee is conceptually-attached-to-the-elapsed-term, not refundable on natural-expiry. Only the void-issue compensating action (which is the 24-hour-window-only path) triggers the wallet-refund. This is the rule-9-A's conservation's nuance: 'the conserved quantity is the wallet-plus-the-regulator's-collected-fee-ledger, taken across (issue, void-issue) pairs, and the (issue, natural-expiry) sequence is the case where no refund fires because the void-issue compensating action was not invoked in time'."
              - "Subsequent POST /v1/trips/trip-B-in-transit-id/gps-reports with a body whose reported_at is past the actual_arrival_at-or-aborted_at right-edge returns HTTP 409 with `error_id == 'ERR_GPS_OUT_OF_WINDOW'`, the cascade's downstream-consequence on the GPS-stream-write path. This is the consequential-rejection that ISN'T counted as a third cascade-link because no row is mutated by the rejection — the rejection is a stateless API-surface response. The depth-2 measurement counts only the row-mutating links of the chain."
              - "If the sweep is re-run with scope='ALL', the per-driver rolling-window-fall-off pass fires too, recomputing each driver's current_rolling_points using the new-now's rolling-window's left edge (any penalty whose observed_at is now in the more-than-365-days-ago zone falls out of the rolling-sum). This second-pass effect is independent of the permit-expiry cascade and is the rule-4 cascade-B's not-quite-a-cascade-but-still-a-sweep-side-effect — the spec's prose pins this as a separate sweep-pass, not a cascade-link of the permit-expiry pass."

    # §0.5 Rule 5 — priority_pair_validation_conflict — ≥ 2 instances with different error-category pairs.
    # The five conflicts A–E from the §1.6-error-catalog's prose are the worked-examples here.
    # Conflicts A and B are the rule-5 two-instance-minimum with different category pairs
    # (state-vs-business_referential and existence-vs-business_referential); conflicts C, D,
    # E are bonus instances exercising same-tier sub-priority and cross-tier-fiscal-vs-state
    # and within-tier-business_constraint-vs-business_temporal precedence.
    priority_pair_validation_conflict:
      instances:

        - name: conflict_A_state_wins_over_business_referential_on_trip_creation
          category_pair: "state (Tier-4, ERR_PERMIT_NOT_ACTIVE) vs business_referential (Tier-5b/c, ERR_ROUTE_NOT_APPROVED)"
          grounds:
            - "validations[priority=400] (the Tier-4 state-precondition on the parent permit's lifecycle_status, which fires for ERR_PERMIT_NOT_ACTIVE on a non-ACTIVE parent)"
            - "validations[priority=525] (the Tier-5b business-referential check on the route's approval_status, which fires for ERR_ROUTE_NOT_APPROVED)"
            - "endpoints.POST /v1/permits/{permit_id}/trips (the endpoint where the two checks would simultaneously apply)"
            - "the §1.4 priority-ordering convention: lower-priority-number wins, so 400 < 525 means the state-check fires first"
          distinguishing_aspect: |
            The error-category-pair is (state, business_referential), where the state-category
            includes both the same-row-state and the cross-aggregate-parent-state, and the
            business_referential category includes the cross-reference's-state checks. The
            two categories are at different tiers in the §1.4 priority-ordering convention
            (Tier 4 for state, Tier 5b/c for the business-referential), so the state-tier
            wins by virtue of the lower-priority-number-fires-first rule. The specific error-
            ids in the conflict are ERR_PERMIT_NOT_ACTIVE (the parent-permit's state-tier
            error) and ERR_ROUTE_NOT_APPROVED (the route's approval-status as a
            business-referential cross-aggregate check on the linked-aggregate). The test's
            setup creates a scenario where *both* checks fail simultaneously, and asserts
            that the response is the higher-priority (lower-number) error.
          test_recipe:
            setup:
              - "Fixture: an APPROVED company, with one driver and one vehicle that are both in valid-for-the-permit state. The route is APPROVED at issue time, so the issue succeeds. The permit pm-conflictA-1 is in ACTIVE state after the issue."
              - "Now arrange for both fail-conditions to be in place simultaneously when the trip-creation request arrives:"
              - "Action 1 (the state-cause): a regulator's POST /v1/companies/{co-conflictA-1}/revoke. The company's qualification_status goes APPROVED→REVOKED. The deferred-cascade onto the permit doesn't flip the permit's state synchronously; the permit's `lifecycle_status` is still 'ACTIVE' on disk."
              - "Action 2 (the state-cause flush): a POST /v1/permits/pm-conflictA-1/verify-compliance fires the ACTIVE→SUSPENDED transition (the company-leg's live recompute is false because the company is REVOKED). The permit's on-disk lifecycle_status is now 'SUSPENDED'. The first fail-condition (the parent-permit-not-ACTIVE state-precondition) is now armed."
              - "Action 3 (the business_referential-cause): a regulator's POST /v1/routes/{route-conflictA-1}/reject — wait, the §1.2 prose pins that the reject transition's source-state is SUBMITTED, not APPROVED, so an APPROVED route can't be directly rejected. The regulator's path to undo an APPROVED route is conceptually a revoke-action that the scaffold doesn't model as an endpoint (the scaffold's TransportRoute state-machine's terminal-stability of APPROVED is a deliberate simplification — the only way an APPROVED route in this scaffold becomes non-APPROVED is if the parent-company's revoke cascades onto it via a hypothetical company-revoke-revokes-its-routes side-effect-clause, which the §1.2 prose mentions as a possibility but doesn't pin as an explicit transition in the §1.2 list — see the TransportRoute prose's parenthetical 'a separate revoke-action on a route is not in the scaffold's API surface'). So in this scaffold's exact endpoint-list, the company-revoke alone is the cause-of-both-the-permit-state-and-the-route-state failure, because the company's hazard_classes_authorized list narrowing (which happens implicitly with the revoke, or at least is the standard regulatory-practice interpretation of a company-revoke that drops the company's authorization for the previously-authorized hazard classes — the scaffold's §1.2 prose on the route's hazard_classes_supported-subset-of-the-company's-list-at-the-two-time-points is the formal mechanism). The two-time-point hazard-class-subset check at the route's-approve-step doesn't re-fire post-hoc (the route's approval is stable once granted), so the route's approval_status remains APPROVED on disk even after the company's revoke. In other words, in this scaffold's exact mechanics, the route-state failure doesn't naturally co-occur with the company-revoke alone."
              - "Alternative simpler simultaneous-failure setup: instead of trying to make the route fail simultaneously with the permit, the test creates two parallel permit-application attempts. The first attempt's pre-flight has the route in SUBMITTED state (not yet approved) and the company in APPROVED state — so the POST /v1/permits call fails with ERR_ROUTE_NOT_APPROVED 409 (the business-referential-error). The second attempt has the company in REVOKED state and the route in APPROVED state — so the POST /v1/permits call fails with ERR_COMPANY_NOT_QUALIFIED 409 (the business-referential-error on the company's state). The two are both Tier-5 errors at adjacent priorities (525 for route-not-approved, 526 for company-not-qualified per the §1.4 priority-numbers in §1.4), and they fire on *different* permit-application attempts. The conflict-A's intended state-vs-business_referential pair would manifest on a *single* request where the state-check on the addressed-row (the parent permit) and the business-referential-check on a *linked* aggregate both fail; the cleanest scenario in this scaffold is on the trip-creation endpoint's parent-permit-state-check (which is at Tier-4 priority 400) vs the trip-body's-implicitly-named route's approval-state (which is the route on the parent permit, at Tier-5 priority 525)."
              - "Cleaner final setup: the permit pm-conflictA-1 is in 'SUSPENDED' state after a regulator's-verify-compliance fired the SUSPEND on some grounding-entity-flip (e.g., a driver-revoke as in the rule-3-Permit-cycle worked example). At the same time, by happenstance of the test fixture's arrangement, the route on the permit is *not* in the APPROVED state — say, the fixture's POST /v1/companies/{co}/routes call created the route in DRAFT and the test never advanced it to APPROVED. The permit's at-issue-time the route was forced to be APPROVED for the issue to succeed, so this conflicting-route case can only arise if the route's approval is reverted in between the issue and the trip-creation. In the scaffold's exact mechanics there's no route-revoke endpoint; the route's APPROVED state is stable once entered. So the conflict-A's two-simultaneous-failures scenario can't be set up in the scaffold's exact endpoint-list, unless we use the route's *initial* DRAFT state on a *separate* route that the trip-body's request *names* — but the trip's request body doesn't directly name a route; the trip's route is the parent permit's `route_id`, which is the issue-time-frozen route. So the route-leg of the conflict-A is fundamentally hard to reach in the trip-creation context."
              - "Re-pin the conflict-A's scenario to a different endpoint where the two-tier-failure is naturally co-occurring: the trip-depart endpoint POST /v1/trips/{id}/depart. The Tier-4 state-check is `trip.trip_status == 'PLANNED'` (the same-row state-tier) plus `permit.lifecycle_status == 'ACTIVE'` (the cross-entity-state-tier on the parent), and the Tier-5b business-safety-tier-check is the driver-endorsement-still-VALID-at-the-depart-moment (the §1.4 priority-510 ERR_DRIVER_ENDORSEMENT_INVALID), which is the route's analogue for the depart-time freshness-check. The conflict-A's scenario is: the trip's parent permit is in SUSPENDED state (the Tier-4-parent-state-failure with error_id ERR_PERMIT_NOT_ACTIVE), AND the trip's driver's hazmat_endorsement is INVALID (the Tier-5a-business-safety-failure with error_id ERR_DRIVER_ENDORSEMENT_INVALID). Both checks fail. The §1.4 priority-ordering says ERR_PERMIT_NOT_ACTIVE at priority 515 fires before ERR_DRIVER_ENDORSEMENT_INVALID at priority 510 — wait, 510 is a smaller number than 515, so 510 fires first. Let me re-read the §1.4 numbers: priority 510 is the safety-tier driver-endorsement-VALID check (which the depart endpoint shares with the issue endpoint, as both endpoints require a valid endorsement), priority 515 is the parent-permit-state-check on the cross-entity gate, and priority 400 is the same-row-trip-state-check. The ordering 400 < 510 < 515 in the depart endpoint's check sequence means: same-row-state (the trip's-own-state-must-be-PLANNED) at 400 fires first; then the same-row's-grounding driver-endorsement at 510 (which IS the Tier-5a business-safety-tier on the trip's-driver-attribute); then the parent-permit-state at 515 (the Tier-5b business-safety-cross-entity tier). The conflict in the simultaneous-failure case is between the driver-endorsement-check (510) and the parent-permit-state-check (515), with the lower-number 510 winning."
              - "But the §1.4 prose's priority-400 entry says 'ERR_PERMIT_NOT_ACTIVE is also at the Tier-4 state-tier when the cause is a cross-entity parent-state failure', which would put it at priority 400 alongside the same-row-state check. The §1.4 priority-400 vs priority-515 question is the spec's-ambiguity-source: is the parent-permit-not-ACTIVE check a Tier-4 state-check (same level as the trip's own state-precondition) or a Tier-5 business-safety-cross-aggregate-check (the lower-priority business-tier)? The §1.4 prose's-note on the priority-400-entry says the two error-ids ERR_INVALID_STATE_TRANSITION and ERR_PERMIT_NOT_ACTIVE are *both Tier-4 state-category* errors, distinguished only by the granularity-of-the-cause (same-row vs cross-entity-parent). So the parent-permit-state-check on the depart endpoint is at Tier-4 priority 400 (alongside the same-row trip-state-check), not at a separate higher-number priority. With both at Tier-4, the sub-priority-ordering within Tier-4 is what disambiguates: the §1.2 transition-guard's evaluation-order-pin in the §1.4 priority-400's-note says 'parent-check first, then same-row-check' per the left-to-right conjunction-evaluation of the §1.2 guard-expression. So a depart-request on a SUSPENDED-parent-permit-and-an-already-IN_TRANSIT-trip (both same-row-state-fail and parent-state-fail simultaneously) returns the parent-state error ERR_PERMIT_NOT_ACTIVE, not the same-row error ERR_INVALID_STATE_TRANSITION (the same-row-state check would observe trip_status==IN_TRANSIT-and-not-PLANNED, but the parent-state check observes the parent's-state==SUSPENDED-not-ACTIVE which fires first by the left-to-right conjunction-evaluation order)."
              - "OK, the cleanest conflict-A test in the scaffold's exact mechanics is on the trip-creation endpoint POST /v1/permits/{permit_id}/trips, where the simultaneous failures are: (i) the parent permit's lifecycle_status is SUSPENDED (Tier-4 state-cross-entity at priority 400 effective ordering, ERR_PERMIT_NOT_ACTIVE), AND (ii) the body's referenced driver's hazmat_endorsement_status is INVALID (Tier-5a business-safety at priority 510, ERR_DRIVER_ENDORSEMENT_INVALID). The state-tier-error wins by 400 < 510."
              - "Test-fixture setup: the standard one-company-one-route-one-vehicle-one-driver setup. The permit is issued in ACTIVE state. The trip is created in PLANNED state on the active permit (this is the to-be-departed trip). Then *both* fail-conditions are introduced before the depart is called: (a) the regulator's POST /v1/drivers/{driver_id}/refresh-endorsement with body {revoke: true, revoke_reason: 'off-line issue'} flips the driver's endorsement to INVALID; (b) the consequential cascade onto the permit fires when the regulator runs POST /v1/permits/{pid}/verify-compliance, flipping the permit to SUSPENDED. Both fail-conditions are now in place. The trip is still in PLANNED state because it was created before any of this."
              - "But wait — the trip's *creation* would have failed too at the moment of the driver-revoke if the test had tried to create the trip after the revoke, with ERR_DRIVER_ENDORSEMENT_INVALID. The test creates the trip *before* the revoke (when the driver was still VALID), so the trip exists in PLANNED state with a now-out-of-date driver-reference. The depart action on this stale trip is the load-bearing scenario for the conflict-A test."
            trigger:
              - "POST /v1/trips/{trip-conflictA-1}/depart as the operator. The handler's validation order is: (i) the auth-and-role-tier (passes), (ii) the existence-tier on the trip-id (passes — the trip exists), (iii) the ownership-tier (the operator's X-User-ID == the parent-permit's company_id, passes), (iv) the Tier-4 state-precondition. Per §1.4 priority-400's prose, the Tier-4's-two-sub-tiers are evaluated parent-first-then-same-row per the §1.2 transition-guard's-left-to-right convention. The parent-state-check on the parent permit's lifecycle_status fails first (it's SUSPENDED, not ACTIVE), returning ERR_PERMIT_NOT_ACTIVE 409. The driver-endorsement-tier-check (Tier-5a priority 510) and the same-row-trip-state-check don't fire because the Tier-4-state-check already errored. The error_id of the response is ERR_PERMIT_NOT_ACTIVE, not ERR_DRIVER_ENDORSEMENT_INVALID."
            assert:
              - "The response: HTTP 409, response.data.error_id == 'ERR_PERMIT_NOT_ACTIVE', response.data.message contains a human-readable string mentioning the permit's-state-as-the-cause."
              - "The response does NOT contain ERR_DRIVER_ENDORSEMENT_INVALID as the error_id, even though the driver's endorsement is also invalid at the moment of the call. The priority-ordering means the state-tier-error wins, which is the rule-5 priority-conflict-A's pinned answer."
              - "GET /v1/trips/{trip-id} after the failed depart: trip_status == 'PLANNED' (unchanged; the failed depart didn't mutate the trip's state). The trip's parent-permit-id resolves to a permit with lifecycle_status=='SUSPENDED'. The driver-id referenced on the trip resolves to a Driver with hazmat_endorsement_status=='INVALID'. The two upstream-cause-of-the-conflict are both observable, confirming the simultaneous-failure setup."
              - "The category-pair is (state-Tier-4, business-safety-Tier-5a) which is *different* from the conflict-B's category-pair (existence-Tier-3, business-referential-cross-tenant-ownership-Tier-5c) below. The rule-5's 'different error-category pairs' differentiation clause is met by the (state, business_safety) pair here vs the (existence, business_referential) pair in conflict B."

        - name: conflict_B_existence_wins_over_cross_tenant_ownership_on_permit_read
          category_pair: "existence (Tier-3, ERR_PERMIT_NOT_FOUND) vs business_referential cross-tenant ownership (Tier-5c, ERR_CROSS_TENANT_ACCESS)"
          grounds:
            - "validations[priority=300] (the existence-tier check on URL-path resource ids, which fires for ERR_PERMIT_NOT_FOUND when the path's id doesn't resolve)"
            - "validations[priority=530] (the cross-tenant-ownership-tier check, which fires for ERR_CROSS_TENANT_ACCESS when the role IS in the endpoint's allow-set but the addressed row's tenant doesn't match the requester's tenant)"
            - "endpoints.GET /v1/permits/{permit_id} (the endpoint where both checks apply)"
            - "the §1.4 priority-ordering: 300 < 530, so existence fires first on a non-existent permit-id, regardless of whether the requester's tenant matches the path-id's tenant (because the path-id doesn't resolve to a row, the cross-tenant check has no row to compare against)"
          distinguishing_aspect: |
            The error-category-pair is (existence, business_referential), specifically the
            existence-of-the-URL-path-resource-id vs the cross-tenant-ownership-of-the-
            resolved-row. The two categories are at different tiers (Tier 3 for existence,
            Tier 5c for cross-tenant), and the lower-tier-number-wins rule says existence
            beats cross-tenant. The specific error-ids are ERR_PERMIT_NOT_FOUND (the 404
            existence-failure) and ERR_CROSS_TENANT_ACCESS (the 403 ownership-failure). The
            simultaneous-failure scenario is a request whose path's permit-id is a
            well-formed UUID that doesn't match any row's id, made by an operator from a
            different tenant than the would-be-owning-tenant. Since the row doesn't exist,
            the cross-tenant check has nothing to compare the requester's tenant against,
            and the 404 fires. The conflict-A's category-pair (state, business_safety) is
            different from this conflict-B's category-pair (existence, business_referential
            on the ownership-flavor), satisfying rule-5's "different error-category pairs"
            differentiation across the two minimum instances.
          test_recipe:
            setup:
              - "Fixture: two APPROVED companies, co-X and co-Y. The fixture's-state has no permits — the database's permit-table is empty. The two companies' operators have distinct X-User-IDs."
              - "The well-formed-but-non-existent UUID for the path is a random UUID generated by the test that is not equal to any row's id (since there are no permit rows, any random UUID satisfies this). Call it `pm-nonexistent-1`."
            trigger:
              - "Action: the operator for company co-Y makes a GET /v1/permits/pm-nonexistent-1 request, with `X-User-Role: CompanyOperator` and `X-User-ID: <co-Y's id>`. The cross-tenant-ownership-predicate would compare the requester's X-User-ID against the addressed-row's company_id field, but the addressed-row doesn't exist, so the existence-tier-check at priority 300 fires first."
            assert:
              - "The response: HTTP 404, response.data.error_id == 'ERR_PERMIT_NOT_FOUND'."
              - "The response is NOT 403 with ERR_CROSS_TENANT_ACCESS, even though the operator's tenant is co-Y and a hypothetical resolved-row's owning-tenant would presumably be co-X (or some other tenant). The priority-300-before-530 ordering means the existence-check's-failure short-circuits the cross-tenant-check."
              - "Compare with the case where the permit *does* exist but belongs to a different tenant: in that case, the existence-check passes, the cross-tenant-check fires, and the response is 403 with ERR_CROSS_TENANT_ACCESS. The test can run both scenarios back-to-back to confirm the priority-ordering: (i) non-existent id → 404 ERR_PERMIT_NOT_FOUND; (ii) existent-but-wrong-tenant id → 403 ERR_CROSS_TENANT_ACCESS. The pair-of-cases is the rule-5 conflict-B's full pinning."
              - "For the existent-but-wrong-tenant variant of the test: a fixture-helper inserts a permit row pm-co-X-1 belonging to co-X. Operator-from-co-Y makes a GET /v1/permits/pm-co-X-1 request with X-User-ID == co-Y's id. The existence-tier (priority 300) passes (the row exists). The cross-tenant-tier (priority 530) fires: the row's company_id is co-X's id, the requester's X-User-ID is co-Y's id, the mismatch yields ERR_CROSS_TENANT_ACCESS. The two-case comparison locks the rule-5-B precedence: same endpoint, same role, same URL-path-shape, the only difference being whether the row exists, and the two error-id outputs are 404 vs 403 with distinct error-ids."

        - name: conflict_C_window_check_wins_over_order_check_on_gps_ingest_same_tier_sub_priority
          category_pair: "business_safety (Tier-5a) ERR_GPS_OUT_OF_WINDOW vs business_safety (Tier-5a) ERR_GPS_OUT_OF_ORDER — same tier-letter, disambiguated by the within-tier sub-priority integers 509 (window) and 512 (order)"
          grounds:
            - "validations[priority=509] (ERR_GPS_OUT_OF_WINDOW on a non-in-window reported_at)"
            - "validations[priority=512] (ERR_GPS_OUT_OF_ORDER on a monotonicity-violating reported_at)"
            - "endpoints.POST /v1/trips/{tid}/gps-reports"
            - "the §1.4 priority-509 prose's-explicit-pin: 'window-check at 509 fires before order-check at 512, so a report that is both out-of-window AND out-of-order returns the window error, not the order error'"
            - "the §1.4 priority-515 ERR_PERMIT_NOT_ACTIVE on the GPS path, which is *also* in the same Tier-5a band at a still-higher sub-priority number (515 > 512), so the three-way priority on the GPS endpoint goes 509 (window) → 512 (order) → 515 (permit-state) in order-fires-first ascending. A simultaneous-three-failure case is the maximal-conflict scenario."
          distinguishing_aspect: |
            The conflict-C exercises *within-tier sub-priority* disambiguation: two checks
            in the same business_safety category (Tier 5a in the §1.4 grouping) on the
            same endpoint (the gps-ingest), separated by their integer priority numbers
            (509 vs 512). The window-check at the lower number 509 wins. This contrasts
            with conflicts A and B, which are *across-tier* priority disambiguation
            (Tier 4 vs Tier 5, or Tier 3 vs Tier 5). The rule-5's differentiation-clause
            requires 'different error-category pairs', and a same-tier-within-the-letter
            pair is arguably the *same* category-pair (both elements in business_safety),
            so this conflict-C is a *bonus* instance beyond the rule-5 two-instance
            minimum, exercising the within-tier sub-priority mechanic. The rule-5's
            two minimum instances (the across-tier conflicts A and B) cover the
            different-category-pair differentiation requirement.
          test_recipe:
            setup:
              - "Fixture: an ACTIVE permit pm-conflictC-1 with an IN_TRANSIT trip trip-conflictC-1. The trip has one prior GPS report at `reported_at = T1`. The trip's actual_departure_at is `T0 = T1 - 30 minutes` (the trip departed half an hour before the prior report). The trip is still IN_TRANSIT so its right-edge for the in-window check is `min(actual_arrival_at, aborted_at, now())` which is `now()` (the trip hasn't terminated)."
              - "The clock's current value `T_now` is set to `T1 + 5 minutes` (so the trip's in-window upper edge is `T_now = T1 + 5min`)."
              - "The simultaneous-three-failure GPS sample's body has `reported_at = T0 - 10 minutes` (which is *before* the trip's actual_departure_at — out-of-window on the lower edge), AND its body's other fields are all valid (lat in range, lon in range, speed_kph below MAX so no auto-violation classification fires). The out-of-window-lower-edge is the priority-509 failure."
              - "Additionally, this `reported_at = T0 - 10 min` is *also* before the trip's `latest_gps_at = T1`, so the strict-greater-than-monotonicity check at priority 512 would also fail (the new reported_at is < the cursor's value, not greater than). So the simultaneous failure is the (window-lower-edge, monotonicity) pair both true."
              - "Optionally, the permit pm-conflictC-1's lifecycle_status is also flipped to SUSPENDED via a verify-compliance-with-a-flipped-grounding-entity sequence before the GPS ingest. The permit-not-active-at-priority-515 would be the third simultaneous failure. The fixture-helper achieves the suspension via the same driver-revoke-then-verify-compliance pattern as the conflict-A's setup."
            trigger:
              - "POST /v1/trips/trip-conflictC-1/gps-reports with the body whose `reported_at = T0 - 10 min`, the lat/lon/speed/heading fields filled validly, and the optional Idempotency-Key header absent (so the idempotency-slot path doesn't interfere). The three simultaneous-failure conditions (window-lower-edge-fail, monotonicity-fail, permit-suspended-fail) are all in place."
            assert:
              - "The response: HTTP 409, response.data.error_id == 'ERR_GPS_OUT_OF_WINDOW' (the priority-509 winner). The response does NOT contain ERR_GPS_OUT_OF_ORDER (priority 512) or ERR_PERMIT_NOT_ACTIVE (priority 515) as the error_id — the lowest-number priority fires first by the §1.4 ascending-priority-numbers convention, and the §1.4 priority-509 prose's-explicit-window-first pin reinforces this."
              - "GET /v1/trips/trip-conflictC-1/gps-reports after the failed POST: the list contains only the prior single GPS report at T1 (the failed-write didn't append anything). The trip's latest_gps_at field is still T1 (unchanged by the rejected write). The audit-cleanliness of the rejection — no partial-write, no side-effect — matches the all-or-nothing-transactional semantics of the gps-ingest endpoint."
              - "For thoroughness, a follow-up test sends a GPS report whose reported_at is in-the-trip's-window (T_now - 1 minute, which is after T1 so the monotonicity-check passes and the in-window-check also passes) but whose parent-permit is still SUSPENDED. This new report's-validation-order has the window-check pass (priority 509), the order-check pass (priority 512), and the parent-permit-state-check (priority 515) fail with ERR_PERMIT_NOT_ACTIVE. The response is HTTP 409 with error_id ERR_PERMIT_NOT_ACTIVE. The two follow-up-test variants together pin the priorty-stack 509 < 512 < 515 by observation: the first variant returns the lowest, the second returns the second-lowest. A *third* variant where reported_at == T1 exactly (a tie with the latest_gps_at cursor, which the strict-greater-than rule rejects, and which is in-window and the permit is ACTIVE) returns ERR_GPS_OUT_OF_ORDER alone, pinning the middle priority. The triple-variant test is the complete priority-stack-conformance audit on the GPS endpoint."

        - name: conflict_D_state_wins_over_fiscal_on_permit_issue_across_tier_4_5d
          category_pair: "state (Tier-4) ERR_INVALID_STATE_TRANSITION vs business_fiscal (Tier-5d) ERR_INSUFFICIENT_WALLET_BALANCE"
          grounds:
            - "validations[priority=400] (the same-row state-precondition on the permit's lifecycle_status==DRAFT for the issue endpoint, ERR_INVALID_STATE_TRANSITION on any non-DRAFT pre-state)"
            - "validations[priority=540] (the fiscal-tier wallet-balance check, ERR_INSUFFICIENT_WALLET_BALANCE on a wallet shorter than the computed fee)"
            - "endpoints.POST /v1/permits/{permit_id}/issue"
            - "the §1.6 error-catalog's footnote on the rule-5 conflicts pinning the conflict-D's state-wins-over-fiscal answer"
          distinguishing_aspect: |
            The error-category-pair (state, business_fiscal) is *another* qualitatively distinct
            pair beyond conflicts A and B and C, exercising the cross-tier ordering between the
            state-tier (Tier 4) and the fiscal-tier (Tier 5d) in the §1.4 priority-ordering
            convention. The fiscal-tier is *deliberately the lowest-priority business-tier* in
            the spec's safety-first-fiscal-last grouping, reflecting the regulatory convention
            that fiscal-shortfalls are the last-line-of-defense, fired only after every other
            check has passed. So on a permit-issue request whose permit is *not in DRAFT* AND
            whose company's wallet is *short*, the state-error fires by virtue of 400 < 540.
            This is a bonus conflict beyond rule-5's two-instance minimum, on yet a different
            category-pair than the others.
          test_recipe:
            setup:
              - "Fixture: a permit pm-conflictD-1 issued by a prior POST /v1/permits/{id}/issue call. The permit is now in ACTIVE state, the wallet was debited by the issue fee. The wallet's remaining balance is set (via the fixture's-out-of-band-balance-setter) to *below* the would-be fee for a hypothetical re-issue — say, the wallet has 1000 cents and the would-be fee is 530_000 cents."
              - "An idempotent-retry of the issue is then attempted: POST /v1/permits/pm-conflictD-1/issue with no body fields. The handler's validation: auth (pass), role (pass — RegulatorOfficer), existence (pass — the permit exists), same-row state check at priority 400 (the row is in ACTIVE, not the required-pre-state DRAFT, so the §1.2 DRAFT→ACTIVE transition's guard fails). The handler returns ERR_INVALID_STATE_TRANSITION 409 at this point, *without* having computed the would-be-fee or having checked the wallet. The wallet-check at priority 540 doesn't fire."
              - "The not-fire-of-the-wallet-check is the observable distinguishing feature: the state-error fires *before* the fee-computation-and-wallet-comparison, so a wallet-short-and-state-wrong simultaneous-failure case returns the state-error, not the fiscal-error."
            trigger:
              - "POST /v1/permits/pm-conflictD-1/issue as a RegulatorOfficer (the role check passes), with the wallet of the parent company set to a deliberate-shortfall balance. The permit's state is ACTIVE (post-prior-issue), which is the not-DRAFT cause for the state-tier-failure."
            assert:
              - "Response: HTTP 409, response.data.error_id == 'ERR_INVALID_STATE_TRANSITION'. The response is *not* HTTP 402 with ERR_INSUFFICIENT_WALLET_BALANCE."
              - "The company's wallet balance is unchanged across the rejected request: the would-be fee was never computed, the wallet was never inspected for sufficiency, the response short-circuits at the Tier-4 state-check. The audit log records the failed-attempt at the request-id level but no fiscal-debit-attempt entry appears in the wallet-history."
              - "Compare to a baseline call where the same wallet-shortfall scenario is exercised on a *DRAFT* permit (the canonical valid pre-state for the issue endpoint). In that variant, the state-check at 400 passes (the row IS in DRAFT), the safety-tier checks at 510, 511, 525, 526 pass (the standard fixture's grounding entities are all valid), and the fiscal-check at 540 fires last with the wallet-short. The response is HTTP 402 with ERR_INSUFFICIENT_WALLET_BALANCE. The two-case comparison (the not-DRAFT-and-wallet-short variant returns ERR_INVALID_STATE_TRANSITION-409; the DRAFT-and-wallet-short variant returns ERR_INSUFFICIENT_WALLET_BALANCE-402) pins the rule-5 conflict-D's state-over-fiscal priority answer."

        - name: conflict_E_double_booking_wins_over_outside_validity_window_same_tier_business_constraint_vs_business_temporal
          category_pair: "business_constraint (Tier-5b, ERR_VEHICLE_DOUBLE_BOOKED at priority 521) vs business_temporal (Tier-5b, ERR_OUTSIDE_VALIDITY_WINDOW at priority 522)"
          grounds:
            - "validations[priority=521] (the vehicle-double-booking interval-overlap check, the rule-8 overlap-A interval-arithmetic)"
            - "validations[priority=522] (the scheduled-window-vs-permit-window membership check)"
            - "endpoints.POST /v1/permits/{permit_id}/trips"
            - "the within-tier-5b-sub-priority ordering 521 < 522 yielding the double-booking-fires-first answer on a simultaneous-failure"
          distinguishing_aspect: |
            The within-Tier-5b sub-priority disambiguation. The conflict-C exercised the
            within-Tier-5a sub-priority on the GPS endpoint; this conflict-E exercises the
            within-Tier-5b sub-priority on the trip-creation endpoint. The pair (business_constraint
            for the vehicle-double-booking-resource-overlap-rule and business_temporal for the
            scheduled-vs-permit-window-membership-rule) are both in the safety-and-constraint
            band of Tier 5 in the §1.4 priority-grouping but at different sub-categories
            (business_constraint vs business_temporal), and the sub-priority integers
            (521 vs 522) disambiguate. The category-pair (business_constraint, business_temporal)
            is *yet another* distinct category-pair beyond conflicts A (state-business_safety),
            B (existence-business_referential-ownership), C (business_safety-business_safety
            within-tier-letter), D (state-business_fiscal). The five conflicts together exercise
            five distinct category-pairings of the priority-conflict question across the §1.4
            validation table, well above the rule-5 two-instance minimum. The two canonical
            different-category-pair instances are conflicts A and B; conflicts C, D, E are
            bonus instances exercising the spec's full priority-ordering convention.
          test_recipe:
            setup:
              - "Fixture: an ACTIVE permit pm-conflictE-1 with valid_from=T_vf, valid_until=T_vu. The permit has authorized_vehicle_ids = [veh-E-1, veh-E-2]. There's an existing trip trip-E-existing on veh-E-1 with scheduled_departure_at=T_vf+1d, scheduled_arrival_at=T_vf+1d+4h. The vehicle-double-booking-zone on veh-E-1 for this trip is the half-open interval [T_vf+1d, T_vf+1d+4h)."
              - "The new trip-creation request POSTs to /v1/permits/pm-conflictE-1/trips with body: vehicle_id=veh-E-1 (the same vehicle as the existing trip), scheduled_departure_at=T_vu+1h, scheduled_arrival_at=T_vu+5h. The new trip's scheduled-window is *strictly after* the permit's valid_until (T_vu + 1h is the lower edge, which is past T_vu), AND the new trip's scheduled-window is on the same vehicle as the existing trip's window. So both fail-conditions arise:"
              - "(i) The scheduled-window-vs-permit-window check at priority 522 fails because scheduled_departure_at (= T_vu+1h) is not in [T_vf, T_vu] — it's strictly past the right edge, so ERR_OUTSIDE_VALIDITY_WINDOW 409 would be the answer if this check fired."
              - "(ii) The vehicle-double-booking check at priority 521 fails because the new window [T_vu+1h, T_vu+5h) on veh-E-1 *would* overlap any existing window on the same vehicle whose interval intersects it. But the existing trip-E-existing's window is [T_vf+1d, T_vf+1d+4h), which is far in the past relative to T_vu+1h (assuming T_vu = T_vf + 365d, the existing trip is at day-1 and the new trip is at day-365-and-1-hour). The two windows don't actually overlap, so the double-booking check would *pass* in this fixture — and the only fail is the priority-522 outside-validity-window check."
              - "So the conflict-E's simultaneous-failure scenario requires the two intervals to actually overlap on the same vehicle AND the new window to also be outside the permit's term. The constructive fixture for this is: the new trip's scheduled window is [T_vu, T_vu+1h], i.e., starting at the permit's exact-expiry-moment and ending one hour later. The lower edge T_vu is the closed-right-on-the-permit-window boundary which the §1.5 prose pins as 'the closed-right convention on the arrival-edge but open-right on the departure-edge', meaning a trip whose scheduled_departure_at equals the permit's valid_until is *outside* the validity window (the lower edge of the trip's window must be in [valid_from, valid_until) which is open-right). Wait — re-reading the §1.5 prose on the trip's scheduled_departure_at field: 'in [permit.valid_from, permit.valid_until)' — half-open right-exclusive, matching the permit-expiry semantics. And the scheduled_arrival_at is in '(scheduled_departure_at, permit.valid_until]' — closed-on-the-arrival-right-edge, the asymmetric convention. So a trip's scheduled-departure-equals-permit's-valid_until is *just-outside* the permit window on the departure-side (open-right), and the trip is rejected with ERR_OUTSIDE_VALIDITY_WINDOW."
              - "For the simultaneous-overlap case, the existing trip-E-existing's window on veh-E-1 needs to overlap the new trip's window. Set trip-E-existing's window as [T_vu - 30 min, T_vu + 30 min) — a trip that's already-in-flight at the permit-expiry moment, scheduled from 30 minutes before to 30 minutes after the permit's wall-clock-expiry. The new trip's request body has scheduled_departure_at = T_vu - 15 min (which is *inside* the permit's [valid_from, valid_until) window because T_vu - 15min < T_vu strictly), and scheduled_arrival_at = T_vu + 45 min (which is *outside* the permit's right-edge because T_vu + 45min > T_vu). The §1.5 closed-right-on-the-arrival-edge convention is: scheduled_arrival_at must be `<= valid_until`, and T_vu + 45min > T_vu fails this. So the validity-window-membership check at priority 522 fails. And the new window [T_vu-15min, T_vu+45min) overlaps the existing trip-E-existing's window [T_vu-30min, T_vu+30min) on the same vehicle (the overlap is [T_vu-15min, T_vu+30min), which is non-empty), so the vehicle-double-booking check at priority 521 also fails. The two checks fire simultaneously, and the §1.4 sub-priority ordering 521 < 522 says the double-booking error wins."
            trigger:
              - "POST /v1/permits/pm-conflictE-1/trips with the body above (vehicle_id=veh-E-1, scheduled_departure_at=T_vu-15min, scheduled_arrival_at=T_vu+45min, plus a valid driver-id and cargo-and-hazard-class fields)."
            assert:
              - "Response: HTTP 409, response.data.error_id == 'ERR_VEHICLE_DOUBLE_BOOKED'."
              - "The response is *not* ERR_OUTSIDE_VALIDITY_WINDOW, even though the scheduled_arrival_at is past the permit's valid_until. The lower priority-number (521) wins over the higher (522). The conflict-E's pin is double-booking-over-outside-window."
              - "GET /v1/trips and observing the absence of the failed-creation's-trip-id confirms the all-or-nothing rejection — the request didn't write any Trip row. The trip-table's row-count is the same before and after the failed POST."
              - "For a thoroughness-counterpoint, a separate test exercises just-the-outside-window case (a new trip's vehicle is different from any existing trip's vehicle on the same permit, so no double-booking, but the scheduled-window is outside the permit's term-window). The expected response is ERR_OUTSIDE_VALIDITY_WINDOW, the priority-522-alone case. The two-case-pair locks the pure-instance and the conflict-resolved-by-priority case."

    # §0.5 Rule 6 — boundary_precision_check — ≥ 2 instances on different metrics and endpoints.
    # The scaffold has many boundary points across the time-and-count metrics. The five
    # canonical instances below cover the points-threshold, the permit-time-window-right-edge,
    # the GPS-speed-strict-greater-than, the appeal-window-30-day-closed-right, and the
    # void-window-24-hour-closed-right boundaries. The first two are the rule-6 two-instance
    # minimum on the integer-count metric (driver points) and the timestamp-difference
    # metric (permit valid_until). The remaining three are bonus instances on the float-speed
    # metric, the duration-since-event metric on penalties, and the duration-since-event
    # metric on permits — all on different endpoints, satisfying rule-6's 'different metrics
    # and different endpoints' clause beyond the minimum.
    boundary_precision_check:
      instances:

        - name: driver_threshold_boundary_at_exactly_threshold
          metric: "integer count — driver's current_rolling_points"
          endpoint: "POST /v1/penalties (the manual-penalty insert path that arms the boundary) and GET /v1/drivers/{driver_id}/penalty-summary (the observation endpoint)"
          boundary_semantics: "the comparison in §1.2 Driver.VALID→INVALID's guard is `points >= THRESHOLD_DRIVER_SUSPENSION_POINTS`, the closed-on-the-threshold-side `>=`. At exactly equal to the threshold (12), the auto-flip fires. At one-below (11), it does not. The scaffold's pinned constant value THRESHOLD_DRIVER_SUSPENSION_POINTS = 12."
          grounds:
            - "constants_numeric_values.THRESHOLD_DRIVER_SUSPENSION_POINTS = 12"
            - "calculations.driver_penalty_point_rolling_total (the calc whose threshold-check is in the §1.3 formula's `threshold_check` helper)"
            - "state_machines.Driver.VALID_to_INVALID (the auto-transition fired on the boundary-crossing)"
            - "the §1.4 prose's implicit-tie-in to the boundary semantics: there's no explicit validation entry for the driver's-points-threshold-crossing because it's an auto-transition rather than a user-action-response-error — the boundary's observable is the post-transition status on the Driver row, not an error response."
          distinguishing_aspect: |
            The integer-count metric's exact-equal-the-threshold case fires the flip per the
            `>=` semantics. The cleanest test exhibits the points-just-below-threshold case
            where the flip *doesn't* fire, alongside the points-exactly-at-threshold case
            where the flip *does* fire, with a one-point delta between the two cases. The
            assertion-pair (no-flip-at-N-1, flip-at-N) is the canonical boundary-precision
            test. The endpoint that arms the boundary is POST /v1/penalties (the insert side-
            effect updates the cache); the endpoint that observes the post-state is
            GET /v1/drivers/{did}/penalty-summary (whose response's `hazmat_endorsement_status`
            and `current_rolling_points` fields reveal the post-arming state).
          test_recipe:
            setup:
              - "Constants: THRESHOLD_DRIVER_SUSPENSION_POINTS = 12, PENALTY_WINDOW_DAYS = 365, MANUAL_PENALTY_POINTS_MIN = 1, MANUAL_PENALTY_POINTS_MAX = 50 (so a points_value of 11 or 12 is in-range)."
              - "Fixture-Case-A (the one-below case): a fresh VALID driver dr-boundary-A-1 with current_rolling_points=0. The regulator issues a manual penalty with points_value=11, subject_type='DRIVER', subject_id=dr-boundary-A-1, observed_at=now, reason_note='boundary-A test'. The cached current_rolling_points becomes 11 (the §1.3 calc's sum-over-non-UPHELD-in-window). Since 11 < 12 (the threshold's strict-less-than at the just-below point), the §1.2 Driver VALID→INVALID guard does NOT fire and the driver stays in VALID."
              - "Fixture-Case-B (the at-threshold case): a different fresh VALID driver dr-boundary-B-1 with current_rolling_points=0. The regulator issues a manual penalty with points_value=12 (the exact-threshold-value), the rest of the body as before. The cached current_rolling_points becomes 12. Since 12 >= 12 (the threshold's closed-on-the-threshold-side equality), the §1.2 guard fires and the driver flips to INVALID atomically with the penalty's insert. The Driver row's hazmat_endorsement_status writes to 'INVALID' in the same transaction."
              - "Fixture-Case-C (the one-above case, a sanity check that the flip stays-fired and the count keeps accumulating without further behavior-change above the threshold): a third fresh driver dr-boundary-C-1 with two penalties of points_value=6 and 7 issued sequentially. The cached count goes 6 (still below threshold, status VALID) → 13 (crossed threshold during the second insert, the flip fires on the inserting transaction, status flips to INVALID). The crossing happens *during* the second insert's-side-effect; the prior-state (count=6, status=VALID) is the pre-step, the post-state is (count=13, status=INVALID), and the flip fires precisely on the inserting transaction. The 13-value is *one above* the threshold and the test confirms there's no separate behavior at one-above vs at-equal — the flip's idempotent in the sense that a driver already at INVALID stays at INVALID on a further penalty insert that doesn't change the status (the count keeps growing but the status is already at the negative terminal of the cycle's pre-attestation-up-edge)."
            trigger:
              - "The three cases' penalty-inserts are the triggers. The observations are via GET /v1/drivers/{did}/penalty-summary."
            assert:
              - "Case-A observation: GET /v1/drivers/dr-boundary-A-1/penalty-summary returns response.data.current_rolling_points == 11 AND response.data.hazmat_endorsement_status == 'VALID' AND response.data.threshold == 12 (the response's-exposed-threshold-constant should match the implementation's constant — the test asserts the value on the response is 12, the same as the SCAFFOLD_DIFFICULTY_DESIGN's-numeric-table's value). The active_penalties_in_window list has length 1 and the single entry's points_value is 11."
              - "Case-B observation: GET /v1/drivers/dr-boundary-B-1/penalty-summary returns response.data.current_rolling_points == 12 AND response.data.hazmat_endorsement_status == 'INVALID' (the flip fired). The threshold field is still 12 (a server-side-constant, unchanged). The active_penalties_in_window list has length 1 with points_value 12. The pre-flip-status is *not* exposed by the GET — only the post-flip-status is observable. The flip's atomicity-with-the-penalty-insert means the response's observed state is the post-flip state."
              - "Case-C observation: GET /v1/drivers/dr-boundary-C-1/penalty-summary returns current_rolling_points == 13 (= 6 + 7), hazmat_endorsement_status == 'INVALID' (the flip fired on the second penalty's insert, when the running-sum-over-non-UPHELD crossed the threshold). The list has two entries with points_value 6 and 7. The boundary-crossing happened during the second insert, observable via a separate read after the first insert (which would show count=6 and status=VALID) and after the second (count=13, status=INVALID)."
              - "The driver's row-version-field bumps on each penalty-insert's-cascade-onto-the-Driver (one bump for the points-cache-update and the status-flip, which is a single transaction-write on the Driver row). After the boundary-crossing-insert, the driver's version is the pre-insert-version plus one. The Penalty row's-own-fields don't have a version (Penalty has common_fields:false per the §1.1 entities table), so the audit on the boundary-crossing event is observable on the Driver-row's version-bump-and-status-flip-pair."
              - "The strictness of the comparison (>= for the flip's-trigger, < for the no-flip) is the test's load-bearing observable: the integer-count metric is exact, no float-precision issues, and the boundary's-direction is the closed-on-the-threshold-side per the §1.2 Driver VALID→INVALID guard's expression. The §0.5 rule-6's-quality-checklist 'exact precision at the integer boundary' is satisfied by the threshold-equal-fires and the threshold-minus-one-doesn't pair."

        - name: permit_valid_until_right_edge_at_exactly_now_equals_valid_until
          metric: "timestamp difference — now() vs the Permit's valid_until field"
          endpoint: "POST /v1/_clock/advance (the test-harness's clock-positioner) followed by POST /v1/_sweep/run (the periodic-job-trigger that observes the wall-clock-and-the-grounding-state and fires transitions). Alternatively POST /v1/permits/{id}/verify-compliance fires the same wall-clock-expiry check inline."
          boundary_semantics: "the §1.2 Permit ACTIVE→EXPIRED transition's guard is `now() >= valid_until`, the closed-on-the-now-side, half-open-right-exclusive on the validity window's-direction. The §1.3 permit_validity_check's time-leg is `valid_from <= now() < valid_until`, the open-right convention. At the exact instant `now() == valid_until`, the validity-leg evaluates to false (the strict-less-than fails), and the ACTIVE→EXPIRED guard evaluates to true (the `>=` succeeds). So the boundary moment is the transition's-firing moment. The scaffold's pinned constant PERMIT_DEFAULT_VALIDITY_DAYS = 365 defines the duration from valid_from to valid_until."
          grounds:
            - "constants_numeric_values.PERMIT_DEFAULT_VALIDITY_DAYS = 365"
            - "calculations.permit_validity_check (the time-leg's `valid_from <= now() < valid_until` expression)"
            - "state_machines.Permit.ACTIVE_to_EXPIRED (the guard `now() >= valid_until`)"
            - "state_machines.Permit.SUSPENDED_to_EXPIRED (the parallel-edge with the same wall-clock-guard)"
            - "the §1.5 prose on the sweep endpoint's wall-clock-tick-firing-the-per-permit-expiry-transition"
          distinguishing_aspect: |
            The timestamp-difference metric (now-vs-valid_until in seconds, integer-nanoseconds
            modulo ISO-8601-precision) is qualitatively different from the integer-count metric
            of the prior driver-points instance. The endpoint (the test-harness's clock-and-
            sweep pair, or the verify-compliance) is also a different endpoint from the
            penalty-arming endpoint of the prior instance. The two-instance minimum of rule-6
            requires the two boundary-precision points to be on different metrics-AND-different
            endpoints, which the (count-on-penalty-arming, time-on-clock-sweep) pair satisfies.
            The boundary's-direction on this time-boundary is the strict-less-than-on-the-
            validity-window's-right-edge per the §1.3 prose's-`<`-on-the-right convention, which
            is the half-open-right-exclusive interval semantics — and the symmetric closed-on-
            the-expiry-direction `>=` in the §1.2 ACTIVE→EXPIRED guard — together they pin the
            'now-equals-valid_until is the EXPIRED moment, not the last-ACTIVE moment' answer.
          test_recipe:
            setup:
              - "Fixture: an ACTIVE permit pm-boundary-time-1 issued at clock-time T0 with valid_from=T0 and valid_until=T0 + 365 days. Let T_expire = valid_until."
              - "Test-Phase 1 (just-before-the-boundary, the still-ACTIVE case): POST /v1/_clock/advance with body {advance_seconds: <the seconds-from-the-current-clock-to-T_expire-minus-1-millisecond>, run_sweep_after_advance: true}. The clock lands at T_expire - 1 millisecond. The sweep's per-permit ACTIVE→EXPIRED guard is `now() >= valid_until`, which at now=T_expire-1ms-vs-valid_until=T_expire evaluates to false (the `>=` fails by one millisecond). The permit's lifecycle_status stays 'ACTIVE'. The sweep-response's `permit_transitions` array doesn't include pm-boundary-time-1."
              - "Test-Phase 2 (at-the-boundary, the EXPIRED case): POST /v1/_clock/advance with body {advance_seconds: 0.001, run_sweep_after_advance: true}. The clock advances by 1 millisecond, landing at exactly T_expire (assuming the implementation's clock representation is millisecond-precision; the spec's-ISO-8601-three-fractional-digits implies millisecond precision in the timestamp serialization, and the implementation should match). The sweep's guard at now=T_expire-vs-valid_until=T_expire is the `>=`-equality case, which evaluates to *true*. The permit transitions ACTIVE→EXPIRED. The sweep-response's `permit_transitions` array contains an entry for pm-boundary-time-1 with cause='WALL_CLOCK_EXPIRY' and post_status='EXPIRED'."
              - "Test-Phase 3 (verify-compliance-as-alternate-trigger of the same boundary): a second test-fixture's permit pm-boundary-time-2 issued the same way with valid_until=T_expire_2. The clock advances to T_expire_2 exactly. Instead of POST /_sweep/run, the test fires POST /v1/permits/pm-boundary-time-2/verify-compliance. The handler's wall-clock check is the same `now() >= valid_until` and fires the same ACTIVE→EXPIRED transition. The response's transition_fired is 'ACTIVE_TO_EXPIRED' (an additional enum-value in the response's transition_fired field, alongside the four primary ACTIVE_TO_SUSPENDED, SUSPENDED_TO_ACTIVE, NO_CHANGE listed in §1.5; the spec's response_payload_schema for verify-compliance allows the EXPIRED-target variants too, since the verify-compliance endpoint internally observes the wall-clock check before the snapshot-vs-live comparison)."
            trigger:
              - "The clock-advance-and-sweep (or -verify-compliance) sequence at the two boundary points. The sweep-or-verify is the action-trigger; the clock-advance is the time-positioner."
            assert:
              - "Phase 1 (clock at T_expire - 1ms, sweep runs): GET /v1/permits/pm-boundary-time-1 after the sweep returns lifecycle_status == 'ACTIVE'. The on-disk row hasn't transitioned because the wall-clock hasn't reached the boundary. The sweep response's permit_transitions list does not contain pm-boundary-time-1 (no transition fired for this permit in this sweep-pass). The on-disk `last_verified_at` for this permit is *unchanged* because the sweep's pass on an ACTIVE-and-non-grounding-changing-permit-and-non-wall-clock-expired permit fires the verify-compliance internally (per the §1.5 sweep prose's hop-3 'for every ACTIVE permit, run verify-compliance'), which refreshes last_verified_at to the sweep's now-value. So the last_verified_at *does* get refreshed even when no state-transition fires — the verify-compliance's no-disagreement path bumps last_verified_at and the row's version field. The phase-1 assertion is: state stays ACTIVE, but last_verified_at advances to T_expire-1ms, and the version field bumps by 1."
              - "Phase 2 (clock advances by 1ms to exactly T_expire, sweep runs): the sweep response's permit_transitions list contains exactly the pm-boundary-time-1 entry, with cause='WALL_CLOCK_EXPIRY', pre_status='ACTIVE', post_status='EXPIRED', and the cascade_trip_aborts array listing any in-flight trips (empty in this fixture if no trip was created). GET /v1/permits/pm-boundary-time-1 after the sweep returns lifecycle_status == 'EXPIRED', `snapshot_within_window == false` (the time-leg's-flag has been written false by the expiry-handler), and `last_verified_at == T_expire`."
              - "The one-millisecond delta between phase-1's-still-ACTIVE and phase-2's-now-EXPIRED is the test's pinned-boundary-observable. The half-open-right-exclusive interval semantics — the validity-window is `[valid_from, valid_until)` and the expiry-check is `now() >= valid_until` — is encoded in the two-phase pair."
              - "Phase 3 (the verify-compliance-as-alternate-trigger variant): the second permit's verify-compliance response at now == T_expire_2 has transition_fired == 'ACTIVE_TO_EXPIRED' and the response's pre_status='ACTIVE', post_status='EXPIRED'. The verify-compliance and the sweep are interchangeable on the wall-clock-expiry-firing-mechanism, both observing the same `now() >= valid_until` guard. This is the §1.5 sweep-and-verify-compliance prose's-equivalence-on-the-wall-clock-cause."
              - "The wallet for the company is unchanged across all three phases (no fee fires on the natural expiry, per the rule-9-A's non-refund-on-expiry semantics). The deferred per-trip cascade fires synchronously in the expiry's-side-effect-block, so any IN_TRANSIT child of pm-boundary-time-1 would have been aborted in the same sweep-pass; the test's fixture's-trip-or-not-trip variation is the dependent-on-which-fixture-the-test-uses detail, covered separately in the rule-4-cascade-B's worked example."

        - name: gps_speed_strict_greater_than_at_exactly_max_speed
          metric: "float-comparison — gps_report.speed_kph vs MAX_HAZMAT_SPEED_KPH"
          endpoint: "POST /v1/trips/{tid}/gps-reports"
          boundary_semantics: "the §1.3 calc-4 gps_violation_classification's speed-violated flag is `speed_kph > MAX_HAZMAT_SPEED_KPH`, the strict-greater-than on the float metric. At exactly speed_kph == MAX_HAZMAT_SPEED_KPH (80.0), the violation does NOT fire; no auto-penalty is created. At speed_kph == 80.001 (one IEEE-754-double's-machine-epsilon-fudged increment), the violation fires. The boundary's direction is the strict-greater-than, the open-on-the-limit-side. This is the asymmetric counterpart of the driver-points threshold's closed-on-the-threshold-side `>=`."
          grounds:
            - "constants_numeric_values.MAX_HAZMAT_SPEED_KPH = 80.0"
            - "constants_numeric_values.GPS_VIOLATION_SPEED_POINTS = 3"
            - "calculations.gps_violation_classification (the boolean check at the strict-`>`)"
            - "the §1.5 GPS-ingest endpoint's side-effect-block listing the auto-penalty-insert on speed_violated=true"
          distinguishing_aspect: |
            The float-comparison metric's strict-`>` semantics is qualitatively different
            from the integer-`>=` of the driver-points threshold. The boundary's-direction-
            flip (open-side on speed-limit vs closed-side on the suspension-threshold) is
            the §0.5 rule-6 'exact precision at the boundary' clause's mirror-pair: the
            same scaffold has both directions of boundary, and tests on both pin the
            implementation's-faithful-encoding of the asymmetry. The endpoint (gps-ingest)
            is also different from the prior two boundary endpoints, contributing to the
            'different endpoints' inventory of rule-6.
          test_recipe:
            setup:
              - "Fixture: an ACTIVE permit, an IN_TRANSIT trip trip-speed-boundary-1, the standard valid-driver-and-on-route-vehicle setup. The trip's parent route's polyline is the standard fixture (a simple A-to-B line); the test's GPS lat/lon is on the line so the off-route flag never fires (the test isolates the speed-boundary observation)."
              - "Case alpha (just-below-the-limit, no violation): the body's speed_kph is 79.999 — one millimeter-per-second-per-hour below the limit. The classifier's `79.999 > 80.0` evaluates to false. No auto-penalty is created. The GPS report's `auto_penalty_ids` array is empty in the response."
              - "Case beta (at-the-limit-exactly, no violation per the strict-`>`): speed_kph = 80.0 exactly. The classifier's `80.0 > 80.0` evaluates to false (strict-less-than-or-equal-to-the-limit, but `>` requires strict). No auto-penalty. The driver's current_rolling_points is unchanged from the pre-call value."
              - "Case gamma (just-above-the-limit, violation fires): speed_kph = 80.001. The classifier's `80.001 > 80.0` evaluates to true. An auto-Penalty is created with points_value=3 (GPS_VIOLATION_SPEED_POINTS), source='GPS_VIOLATION_SPEED'. The driver's current_rolling_points is the pre-call value plus 3."
              - "The three cases are exercised in sequence on the same trip's stream, with the reported_at values being three strictly-increasing timestamps to satisfy the monotonicity-rule. The fixture's-pre-state on the driver's points-count is 0 (the driver is fresh-with-no-prior-penalties), so the gamma's-auto-penalty doesn't push the driver to the suspension-threshold (3 < 12), and the driver's hazmat_endorsement_status stays VALID through the three cases. The test isolates the speed-boundary observation from the cascade-onto-the-driver-status-flip."
            trigger:
              - "The three POST /v1/trips/trip-speed-boundary-1/gps-reports calls in sequence. The Idempotency-Key headers are absent (no idempotency-slot interference); each request is independent."
            assert:
              - "Case alpha response: HTTP 201, response.data.auto_penalty_ids == [] (empty array), response.data.cascade_summary.current_rolling_points == 0 (the driver's-cached count is unchanged because no penalty was inserted), and response.data.cascade_summary.hazmat_endorsement_status == 'VALID'."
              - "Case beta response: HTTP 201, response.data.auto_penalty_ids == [] (the exact-equal case is *not* a violation per the strict-`>` semantics), response.data.cascade_summary.current_rolling_points == 0. The trip's `gps_violation_count` field on the Trip row stays at 0. The exact-equal point is the boundary's-no-fire side. The GPSReport row's `off_route_distance_m` is the computed-distance (a small value < OFF_ROUTE_RADIUS_M since the test's lat/lon is on-route), so the off-route flag also doesn't fire — the speed-and-off-route flags are independent classifiers per the §1.3 calc-4's-two-flag-output, and the test asserts both flags as false at the speed-boundary's-exact-equal point."
              - "Case gamma response: HTTP 201, response.data.auto_penalty_ids has length 1 (the speed-violation's auto-penalty, source='GPS_VIOLATION_SPEED', points_value=3). response.data.cascade_summary.current_rolling_points == 3 (the +3 from the auto-penalty's-insert-and-cache-update). The Trip's gps_violation_count is bumped to 1 in the same transaction. The off-route flag is still false (on-route lat/lon)."
              - "GET /v1/drivers/{driver_id}/penalty-summary after all three cases: response.data.current_rolling_points == 3, response.data.hazmat_endorsement_status == 'VALID' (still below the 12-threshold), and response.data.active_penalties_in_window contains the one auto-penalty from case-gamma with source='GPS_VIOLATION_SPEED' and the source_gps_report_id linking back to case-gamma's GPS report."
              - "The float-comparison's-machine-epsilon issue is sidestepped by using 79.999 and 80.001 as the just-below and just-above values, well outside the float-precision-noise band of 80.0 in IEEE-754 double (which is ~1.4e-14 around 80.0). The exact-80.0 case's-flag is reliably false because 80.0's IEEE-754-double representation is exact (it's a power-of-two-times-an-exact-mantissa) and the `>` comparison against itself is rigorously-defined-as-false in the IEEE-754 standard's-trichotomy. The test is numerically robust."

        - name: appeal_window_closed_right_at_exactly_thirty_days_since_observed_at
          metric: "duration — `now() - penalty.observed_at`, in days"
          endpoint: "POST /v1/penalties/{penalty_id}/uphold"
          boundary_semantics: "the §1.4 priority-513 ERR_APPEAL_WINDOW_CLOSED's check is `now() - penalty.observed_at > APPEAL_WINDOW_DAYS days` (strict-greater-than the window-length, the closed-right semantics on the duration). At exactly 30-days-since-observed_at, the upper-bound is met-exactly and the appeal-uphold is still permitted (the closed-right convention's inclusive-right-edge). One nanosecond past 30 days, the appeal is rejected with ERR_APPEAL_WINDOW_CLOSED 409. The boundary-direction is closed-on-the-30-day-side."
          grounds:
            - "constants_numeric_values.APPEAL_WINDOW_DAYS = 30"
            - "validations[priority=513] (the appeal-window-closed check)"
            - "state_machines.Penalty.ACTIVE_to_UPHELD (the transition whose guard's-precondition is the duration-check)"
            - "the §1.5 endpoint POST /v1/penalties/{id}/uphold's ordered_error_table's ERR_APPEAL_WINDOW_CLOSED entry's prose"
          distinguishing_aspect: |
            A duration metric (the elapsed time from a fixed-event-timestamp to the
            current-now), measured in days. The boundary's-direction is the closed-on-
            the-upper-bound, the inverse of the open-on-the-permit-validity-window's-
            right-edge from instance-2 (`now() < valid_until`-strict and the expiry-check
            is `now() >= valid_until`-closed, so the boundary moment is the EXPIRED state's
            entry). For the appeal-window, the boundary moment is the *last-still-valid*
            moment of the appeal — the request at exactly the 30-day mark is still in-
            window. The asymmetry between the permit-expiry-edge's open-right-on-the-
            validity-window and the appeal-window-edge's closed-right-on-the-duration is
            the scaffold's deliberate-asymmetry-design: the permit's-term-end is a 'the
            term has ended at the boundary' direction, while the appeal-window's-end is
            a 'the window is still open at the boundary' direction. The two-different-
            directions are both load-bearing in the boundary-precision tests.
          test_recipe:
            setup:
              - "Fixture: a Penalty pen-appeal-boundary-1 created at clock-time T_obs, with observed_at=T_obs (so the appeal-window's right edge is T_obs + 30 days). The penalty's void_status is ACTIVE."
              - "Case alpha (just-before-the-edge, in-window): advance the clock to T_obs + 30 days - 1 millisecond. POST /v1/penalties/pen-appeal-boundary-1/uphold with body {uphold_reason: 'Boundary-test-alpha'}. The §1.4 priority-513 check's expression `now() - observed_at > APPEAL_WINDOW_DAYS days` evaluates to `(30d - 1ms) > 30d` which is false (the duration is just-less-than the window-length), so the check passes and the uphold succeeds. The penalty's void_status flips to UPHELD."
              - "Reset for case beta on a fresh penalty pen-appeal-boundary-2 (the alpha case has used up its penalty's appeal-slot since UPHELD is terminal). The new penalty's observed_at is T_obs_2."
              - "Case beta (at-the-edge-exactly, still-in-window per the closed-right semantics): advance the clock to T_obs_2 + exactly 30 days. The check's expression is `30d > 30d` which is false (strict-greater-than fails on the equality), so the check passes and the uphold succeeds. The boundary's-inclusive-side-on-the-30-day-mark is the test's load-bearing observable."
              - "Reset for case gamma on a third fresh penalty pen-appeal-boundary-3 with observed_at=T_obs_3."
              - "Case gamma (one-nanosecond-past-the-edge, out-of-window): advance the clock to T_obs_3 + 30 days + 1 millisecond. The check's expression is `(30d + 1ms) > 30d` which is true (the strict-greater-than succeeds), so the check fires the error ERR_APPEAL_WINDOW_CLOSED. The penalty's void_status stays ACTIVE."
            trigger:
              - "The three POST /v1/penalties/{pid}/uphold calls in sequence at the three clock-positions. The clock-advances between the cases are via POST /v1/_clock/advance with the appropriate body."
            assert:
              - "Case alpha response: HTTP 200, the response data is the updated penalty row with void_status='UPHELD', upheld_at == the call's-now (T_obs + 30d - 1ms), upheld_by == the regulator's X-User-ID. The post-uphold GET (which there isn't a public per-penalty GET endpoint, so the observation is via GET /v1/drivers/{subj}/penalty-summary's upheld_penalties_in_window list, which contains pen-appeal-boundary-1)."
              - "Case beta response: HTTP 200, the second penalty's void_status flips to UPHELD at the exact 30-day-since-observed-at moment. The closed-right inclusivity is observable: the boundary moment is in-window, the upheld succeeds. The duration between observed_at and upheld_at on the upheld row is exactly 30 days (to millisecond precision, assuming the clock-advance lands the now precisely 30 days after observed_at)."
              - "Case gamma response: HTTP 409, response.data.error_id == 'ERR_APPEAL_WINDOW_CLOSED'. The third penalty's void_status remains ACTIVE on the on-disk row (the failed transition didn't mutate the row, per the all-or-nothing-failure semantics). The subject driver's current_rolling_points is unchanged from before the failed uphold (the points-decrement-on-uphold side-effect didn't fire, per the rule-9-B's conservation-of-points's non-firing on a rejected uphold)."
              - "The driver-side cascade across the three cases: in case alpha and case beta the upheld penalty's points are subtracted from the driver's rolling-total, lowering the count by the penalty's points_value each time. In case gamma the points stay added to the driver's total (the upheld didn't fire, so the conservation-equation 'total = sum-over-non-UPHELD-in-window' still includes the unsuccessful-appeal's penalty)."

        - name: void_issue_window_closed_right_at_exactly_twenty_four_hours_since_issued_at
          metric: "duration — `now() - permit.issued_at`, in hours"
          endpoint: "POST /v1/permits/{permit_id}/void-issue"
          boundary_semantics: "the §1.4 priority-514 ERR_VOID_WINDOW_CLOSED's check is `now() - permit.issued_at > VOID_ISSUE_WINDOW_HOURS hours` (strict-greater-than the 24-hour window-length, closed-right on the duration mirroring the appeal-window's-direction). The constant VOID_ISSUE_WINDOW_HOURS = 24. At exactly 24-hours-since-issued_at, the void is still permitted. At 24-hours-plus-1-millisecond, the void is rejected."
          grounds:
            - "constants_numeric_values.VOID_ISSUE_WINDOW_HOURS = 24"
            - "validations[priority=514] (the void-window-closed check)"
            - "state_machines.Permit.ACTIVE_to_VOIDED (the transition whose guard's-precondition is the duration-check, with the side-effect-block doing the wallet-refund and the trip-cascade)"
            - "the §1.5 endpoint POST /v1/permits/{id}/void-issue's ordered_error_table's ERR_VOID_WINDOW_CLOSED entry"
            - "the rule-9-invariant-A's currency-conservation, which is the void-issue's side-effect's mathematical property — the alpha-and-beta cases that succeed exercise the conservation, the gamma-case-that-fails leaves the wallet's net-debit-from-the-issue intact (no refund-firing)"
          distinguishing_aspect: |
            The same closed-right duration-bound semantics as the appeal-window's boundary,
            but on a different event (the permit's-issue-time-stamp instead of the
            penalty's-observed-at) and with a different time-unit-and-window-length (24
            hours instead of 30 days). The endpoint is different (void-issue vs uphold).
            The metric and endpoint are both distinct from the prior four boundary
            instances, contributing a fifth boundary-precision-check to the rule-6
            inventory. The rule-6's-quality-checklist 'different metrics and different
            endpoints' clause is satisfied across all five worked-examples in this rule-id
            bucket.
          test_recipe:
            setup:
              - "Fixture: a freshly-issued ACTIVE Permit pm-void-boundary-1 with issued_at=T_issue. The wallet has been debited by the issue fee at the moment of the issue. The §1.5 void-issue prose pins the void's-refund as `issue_fee_cents + sum(renewal_history[*].fee_cents)`; since no renewals have fired in the 24-hour window, the refund is just the issue_fee_cents."
              - "Case alpha (just-before-the-edge): advance the clock to T_issue + 24 hours - 1 millisecond. POST /v1/permits/pm-void-boundary-1/void-issue with body {reason_note: 'Clerical-error-test-alpha'}. The check's `(24h - 1ms) > 24h` is false; the void succeeds. The permit's lifecycle_status flips to VOIDED, voided_at = the call's now, void_refunded_cents = the issue_fee_cents, and the wallet is credited back by exactly that amount. The conservation invariant of rule-9-A holds: the wallet's net change from before-the-issue to after-the-void is zero (modulo any out-of-band top-up). The §1.2 ACTIVE→VOIDED transition's-trip-cascade aborts any in-flight children with abort_reason='PERMIT_SUSPENDED_CASCADE' per the §1.2 enum-economy note (the void-cause's-discriminator overlaps with the suspension-cascade's discriminator). If the fixture has no in-flight children, the cascade-array is empty in the response."
              - "Reset on a fresh permit pm-void-boundary-2 issued at T_issue_2 for the at-the-edge case."
              - "Case beta (at-the-edge-exactly): advance to T_issue_2 + exactly 24 hours. The check's `24h > 24h` is false (strict-greater-than fails on equality, the closed-right convention). The void succeeds. The wallet-refund and the lifecycle-flip happen the same way as case alpha."
              - "Reset on a third fresh permit pm-void-boundary-3 issued at T_issue_3."
              - "Case gamma (one-millisecond-past-the-edge, out-of-window): advance to T_issue_3 + 24 hours + 1 millisecond. The check's `(24h + 1ms) > 24h` is true; the void is rejected with ERR_VOID_WINDOW_CLOSED 409. The permit's lifecycle_status stays ACTIVE; the wallet is unchanged (no refund firing). The conservation across the (issue, no-void) sequence is: the wallet's net is the issue-fee's negative (the permit's term continues running until the natural-expiry sweep eventually fires the ACTIVE→EXPIRED transition with no refund — the natural-expiry-conserves-the-fee-as-earned, per the §1.5 sweep prose's-non-refund-on-expiry note)."
            trigger:
              - "The three POST /v1/permits/{pid}/void-issue calls at the three clock-positions. The clock-advances are via the test-harness's POST /_clock/advance endpoint."
            assert:
              - "Case alpha: HTTP 200, response.data.lifecycle_status=='VOIDED', voided_at == T_issue + 24h - 1ms (the call's now-value), void_refunded_cents == the recorded issue_fee_cents. The company's wallet_balance_cents has increased by void_refunded_cents from its pre-void value. The conservation-equation holds at the row-level: the issue's debit-amount equals the void's credit-amount."
              - "Case beta: HTTP 200, response.data.lifecycle_status=='VOIDED', voided_at == T_issue_2 + 24h exactly. The closed-right boundary's-inclusivity is observable: the 24-hour mark is in-window. The conservation holds identically to alpha."
              - "Case gamma: HTTP 409, response.data.error_id == 'ERR_VOID_WINDOW_CLOSED'. The permit's lifecycle_status stays 'ACTIVE' on the on-disk row. The wallet is unchanged from its post-issue value (no refund-firing). The audit observable is the no-change-state across the failed void."
              - "Cross-case sanity: the three permits are independent fixtures with independent wallets and independent issue-timestamps, so the three boundary-tests don't cross-interfere. The clock's advances between the cases are positioned so each case's now-vs-issue-at-time-difference lands at the precise boundary point of interest. The implementation's-clock's-resolution (millisecond) matches the test's precision-of-the-boundary-point-positioning."
              - "The five boundary-precision instances across this rule-id bucket span: integer-count (driver points), timestamp-on-the-permit-window-right-edge, float-on-the-speed-limit, duration-since-event on the appeal-window (closed-right at 30 days), and duration-since-event on the void-window (closed-right at 24 hours). The metrics are five-different-types (int, instant-vs-instant, float, hour-duration, day-duration), the endpoints are five-different (penalty-insert, sweep-or-verify-compliance, gps-ingest, penalty-uphold, void-issue). The rule-6's 'different metrics and different endpoints' clause is satisfied with substantial margin over the two-instance minimum."

    # §0.5 Rule 7 — cross_entity_state_dependency — ≥ 2 instances across different entity pairs.
    cross_entity_state_dependency:
      instances:

        - name: permit_issue_requires_company_qualification_status_approved
          entity_pair: "Permit ↔ TransportCompany"
          grounds:
            - "validations[priority=526] (ERR_COMPANY_NOT_QUALIFIED check on the permit-issue path)"
            - "state_machines.Permit.DRAFT_to_ACTIVE (the issue transition's preconditions list including the parent-company-must-be-APPROVED clause)"
            - "state_machines.TransportCompany.qualification_status (the cross-aggregate state field whose APPROVED value is the gating condition)"
            - "calculations.permit_validity_check.live's-company-leg (the same condition re-checked on every verify-compliance call as part of the AND-chain's first leg)"
            - "the §1.5 POST /v1/permits/{id}/issue endpoint's ordered_error_table's ERR_COMPANY_NOT_QUALIFIED row at the cross-entity-state-tier"
          distinguishing_aspect: |
            The Permit entity's DRAFT→ACTIVE transition's guard depends on the linked
            TransportCompany's qualification_status being APPROVED at the moment of the
            issue call. This is a cross-aggregate state-dependency where the addressed-
            entity's-transition is gated on a *different* entity-aggregate's-state-field
            (the foreign-key-pointed-at-entity's-state-flag). The entity-pair is
            (Permit, TransportCompany), with the dependency-direction being from the
            Permit's transition's-guard to the Company's-state-field. The §0.5 rule-7
            instance pair must be on *different entity pairs*, satisfied here by the
            (Permit, Company) pair vs the (Trip, Permit) pair in the second instance below.
          test_recipe:
            setup:
              - "Fixture: a TransportCompany co-cross-1 in SUBMITTED state (i.e., the operator has submitted the company-application but the regulator hasn't yet approved it). All other grounding-entity fixtures (the driver, vehicle, route) are in their valid post-creation states but only with the parent company's qualification_status==APPROVED can they be referenced by a permit — the children-creation endpoints' priority-510-or-similar qualification-of-the-parent check would have rejected their creation if the parent was non-APPROVED. The fixture-helper-script either: (a) creates the children before the company is rolled back to SUBMITTED via a hypothetical-but-not-in-the-scaffold's-endpoint-list company-de-approve action — which the scaffold doesn't have — or (b) the cleaner alternative: the test creates the children while the company is APPROVED, then the regulator's POST /v1/companies/co-cross-1/revoke fires the APPROVED→REVOKED transition, and the test then attempts to issue a permit on the now-REVOKED company. The revoke-then-issue-attempt path is the canonical scenario."
              - "Fixture-Sequence: (i) POST /v1/companies → co-cross-1 in DRAFT. (ii) submit → SUBMITTED. (iii) Regulator-approve → APPROVED. (iv) POST /v1/companies/{cid}/drivers, /vehicles, /routes → the standard set of children, all in their initial-states (the driver's-endorsement-attestation is fired separately via POST /v1/drivers/{did}/refresh-endorsement to VALID, the vehicle's-inspection is appended as PASSED via POST /v1/vehicles/{vid}/inspections, the route is submitted-and-approved via the route-state-machine's lifecycle). The grounding entities are all in their valid states for issuance. (v) POST /v1/permits → the permit's-application succeeds; pm-cross-1 is in DRAFT. The application's-time-cross-entity-check (the §1.5 POST /permits's-ordered-error-table's ERR_COMPANY_NOT_QUALIFIED entry) sees the company in APPROVED and passes. (vi) Regulator POST /v1/companies/co-cross-1/revoke (the APPROVED→REVOKED transition); the company is now REVOKED. (vii) The test now attempts POST /v1/permits/pm-cross-1/issue."
            trigger:
              - "POST /v1/permits/pm-cross-1/issue as the regulator. The handler's-validation-order walks through auth (pass), role (pass — RegulatorOfficer), existence (pass — pm-cross-1 exists), Tier-4-state-check on the permit's-own-state (the row is in DRAFT, the issue's required-pre-state is DRAFT, so this check passes), then the Tier-5b cross-entity-state-check on the parent company. The §1.4 priority-526 ERR_COMPANY_NOT_QUALIFIED check evaluates the company's qualification_status, which is now 'REVOKED', and fires the error."
            assert:
              - "Response: HTTP 409, response.data.error_id == 'ERR_COMPANY_NOT_QUALIFIED'."
              - "The on-disk permit row's lifecycle_status remains 'DRAFT' (the failed-issue didn't transition it). The wallet of co-cross-1 is unchanged (no fee was debited because the transition didn't fire). The snapshot fields on the permit row are still all-null (the snapshot-write happens in the §1.2 DRAFT→ACTIVE side-effect-block which didn't fire)."
              - "The cross-aggregate-state-dependency observable is: the Permit's-state cannot advance to ACTIVE while the linked Company's-state is non-APPROVED. The dependency-direction is one-way: the Permit's transition's-guard reads the Company's-state, but the Company's state-transitions don't read any Permit-state (the company's lifecycle is independent of its children's lifecycles, modulo the deferred cascade direction onto the children that the company-revoke fires)."
              - "The recovery scenario: if the company is later re-approved (via the REVOKED→DRAFT-via-submit-endpoint-internal-collapse cycle followed by the regulator-approve), the same permit-issue-attempt on the still-DRAFT permit would now succeed (assuming the other grounding entities are still in their valid states, which the test's-fixture-state preserves). This recovery-path is the cycle's-closure observable of the cross-aggregate-dependency: the dependency's gate is the linked-entity's-state, which is recoverable, so the dependent's transition is also recoverable when the gate is met."

        - name: trip_depart_requires_parent_permit_lifecycle_status_active
          entity_pair: "Trip ↔ Permit"
          grounds:
            - "validations[priority=400-or-515-depending-on-the-tier-interpretation] (the parent-permit-must-be-ACTIVE check on the depart-and-other-trip-action endpoints; see the §1.4 prose's discussion of the Tier-4-vs-Tier-5 ambiguity on this check, with the canonical pin being Tier-4 because the cause-is-a-state-precondition-on-the-parent-row)"
            - "state_machines.Trip.PLANNED_to_IN_TRANSIT (the depart transition's guard's cross-entity clause `parent_permit.lifecycle_status == 'ACTIVE'`)"
            - "state_machines.Permit.lifecycle_status (the cross-aggregate state field whose ACTIVE value is the gate)"
            - "the §1.5 POST /v1/trips/{id}/depart endpoint's-ordered-error-table's ERR_PERMIT_NOT_ACTIVE entry"
            - "the rule-3-Permit-cycle worked example's setup which transitions the parent permit ACTIVE→SUSPENDED via a verify-compliance, which is the upstream-cause of the depart-being-blocked"
          distinguishing_aspect: |
            The Trip entity's PLANNED→IN_TRANSIT transition's guard depends on the
            *parent* Permit's lifecycle_status being ACTIVE at the moment of the depart-
            call. The entity-pair (Trip, Permit) is *different* from the (Permit, Company)
            pair in the prior instance, satisfying rule-7's 'different entity pairs'
            differentiation clause. The directionality is also one-way: the Trip's-
            transition's-guard reads the Permit's-state, the Permit's-state-transitions
            cascade onto the Trip's-state in the reverse-direction (the permit-expiry-
            sweep aborts the trips, per rule-4's cascade-B). So the two entities have a
            *bidirectional* state-coupling: Permit's-state gates Trip's-forward-transition,
            and Permit's-state-transitions push the Trip's terminal-cascade-aborts. The
            bidirectional-coupling is part of the scaffold's-tight-aggregate-design
            discussed in the §0 complexity_profile's notes.
          test_recipe:
            setup:
              - "Fixture: an ACTIVE Permit pm-cross-2 with a PLANNED child trip trip-cross-2 whose scheduled_departure_at is now+5 minutes. The depart endpoint's other-checks (the operator's-ownership of the parent-company, the driver-endorsement still being VALID, the vehicle's-inspection still in window) are all in the pass-state."
              - "Action (the upstream-cause of the gate-failure): a regulator's POST /v1/drivers/{the-trip's-driver}/refresh-endorsement with body {revoke: true, revoke_reason: 'pre-trip-discovery-of-cert-issue'} flips the driver's endorsement to INVALID. The Permit's drivers-leg is now live-false but the on-disk snapshot is unchanged (the snapshot's drivers-leg-for-this-driver is still the at-issue-time-true value)."
              - "Action (the gate-arming): the regulator runs POST /v1/permits/pm-cross-2/verify-compliance. The handler's snapshot-vs-live disagreement on the drivers-leg fires the ACTIVE→SUSPENDED transition. The permit's lifecycle_status is now 'SUSPENDED'."
              - "Action (the clock-position): advance the clock to scheduled_departure_at (the trip's-scheduled-now)."
            trigger:
              - "POST /v1/trips/trip-cross-2/depart as the operator. The validation-order walks: auth (pass), role (CompanyOperator pass), existence (the trip exists), ownership (the operator's X-User-ID equals the parent-permit's company_id), then the Tier-4 state-precondition. The §1.2 PLANNED→IN_TRANSIT transition's-guard's left-to-right conjunction-evaluation reads the parent-permit-state first (it's SUSPENDED, not ACTIVE), so the cross-entity-state-tier-clause fails before the same-row-state-clause is reached. The error is ERR_PERMIT_NOT_ACTIVE 409."
            assert:
              - "Response: HTTP 409, response.data.error_id == 'ERR_PERMIT_NOT_ACTIVE'."
              - "GET /v1/trips/trip-cross-2 after the failed depart: trip_status == 'PLANNED' (unchanged; the failed depart didn't transition the trip's state). actual_departure_at == null (still). The trip's-version-field is unchanged from its-creation-version-1 (no mutating-action has touched the row)."
              - "GET /v1/permits/pm-cross-2: lifecycle_status == 'SUSPENDED' (the post-verify-compliance state). snapshot_driver_endorsements[the-driver-id] == false (the post-verify snapshot has been updated to the live-false drivers-leg)."
              - "GET /v1/drivers/{the-driver-id}: hazmat_endorsement_status == 'INVALID' (the upstream-cause of the cascade)."
              - "The cross-entity-state-dependency observable is the chain: driver's-endorsement-flip caused the permit's-suspension (the rule-4 cascade-A's down-direction without the GPS or penalty hops, since the cause was a direct manual-revoke not a points-threshold-crossing). The permit's-suspension then gates the trip's-depart per the rule-7 cross-entity-dependency. The trip-can-be-departed-only-when-the-parent-permit-is-ACTIVE is the spec's-quality-checklist's 'cross-entity state-dependency' item's-instance for this (Trip, Permit) pair."
              - "Recovery scenario: if the driver is later re-attested (by the regulator's positive refresh-endorsement) and the next verify-compliance on the permit flips it back to ACTIVE (the rule-3-Permit-cycle's-up-direction), then a subsequent POST /v1/trips/trip-cross-2/depart succeeds. The trip's actual_departure_at is set to the now-value of the successful-depart, and the trip transitions to IN_TRANSIT. This recovery-path observable is the (PLANNED → fails to depart with ERR_PERMIT_NOT_ACTIVE → wait for the parent-permit's cycle's-up-direction → re-attempt the depart → IN_TRANSIT) sequence, the full round-trip of the cross-entity-dependency's gate-and-release-and-re-fire."
              - "The bidirectional coupling's observable on the recovery: while the trip is in PLANNED-with-a-suspended-parent, the regulator's-permit-void-issue endpoint (if within the 24-hour-void-window) would fire the ACTIVE→VOIDED on the permit-and-the-trip-cascade-abort onto the child-trip (the §1.2 ACTIVE→VOIDED's side-effect-block aborts the in-flight-and-planned-children). The cascade-direction is Permit→Trip (the gate-direction is Trip-gated-by-Permit), so the two directions cover the bidirectional-state-coupling. The full-test of the bidirectional-coupling is the two scenarios (the gate-direction in the depart-failure test here, and the cascade-direction in the void-issue's-trip-cascade test in the rule-9-A's compensating-action's worked example below)."

    # §0.5 Rule 8 — resource_temporal_overlap — ≥ 2 instances with different interval semantics on different resources.
    resource_temporal_overlap:
      instances:

        - name: vehicle_calendar_half_open_right_exclusive_adjacency_allowed_with_overlap_rejected
          resource: "Vehicle's scheduling calendar — the set of all Trip rows with the same vehicle_id, each row's `[scheduled_departure_at, scheduled_arrival_at)` half-open interval"
          interval_semantics: "half-open-right-exclusive `[s, e)`. Adjacency at the boundary (the previous trip's e == the next trip's s) is *allowed* — the two intervals don't share the boundary point because the right-edge is open. Strict-overlap (the two intervals' intersection is non-empty) is rejected with ERR_VEHICLE_DOUBLE_BOOKED."
          grounds:
            - "validations[priority=521] (ERR_VEHICLE_DOUBLE_BOOKED check on trip-creation)"
            - "the §1.4 priority-521 prose pinning the half-open semantics and the adjacency-allowed convention"
            - "entities.Trip.scheduled_departure_at and Trip.scheduled_arrival_at fields"
            - "the cross-permit-and-cross-tenant scope of the check (the vehicle's-calendar is a physical-asset-level scope, not a per-permit-or-per-company scope — a vehicle's-row in another company would still block, but the scaffold's data-model has every vehicle owned by exactly one company so the cross-tenant case for the same vehicle doesn't arise in practice)"
          distinguishing_aspect: |
            The half-open-right-exclusive interval-arithmetic on the vehicle's-scheduling-
            calendar, with the boundary-touching-adjacency-allowed convention. The interval-
            semantics is distinct from the GPS-stream's-strict-greater-than-monotonicity in
            the second rule-8 instance below, which is the closed-on-the-prior-edge convention.
            The §0.5 rule-8 'different interval semantics' clause is satisfied by the (half-
            open-on-the-right-edge, closed-on-the-prior-edge) pair. The resources are also
            different — the vehicle's-scheduling-calendar is a per-physical-asset scope, while
            the GPS-stream's-monotonicity is a per-trip-stream scope.
          test_recipe:
            setup:
              - "Fixture: a vehicle veh-overlap-1 on an ACTIVE permit pm-overlap-1 with valid_from=T_vf, valid_until=T_vu. The permit's authorized_vehicle_ids contains veh-overlap-1 and a second vehicle veh-overlap-2 (the second vehicle is for the no-conflict-on-different-vehicle baseline). The permit's authorized_driver_ids contains a single valid driver dr-overlap-1."
              - "Existing trip trip-overlap-existing: scheduled_departure_at=T_vf+1h, scheduled_arrival_at=T_vf+5h, vehicle_id=veh-overlap-1, driver_id=dr-overlap-1. This trip occupies the half-open interval [T_vf+1h, T_vf+5h) on veh-overlap-1's calendar."
              - "Case alpha (no-overlap, in a gap before): a new POST /v1/permits/pm-overlap-1/trips with body {vehicle_id: veh-overlap-1, driver_id: dr-overlap-1, scheduled_departure_at: T_vf+0min, scheduled_arrival_at: T_vf+1h (the exact boundary touching the existing trip's-left-edge), cargo and hazard-class fields filled validly}. The new trip's interval [T_vf+0, T_vf+1h) is adjacent to the existing's [T_vf+1h, T_vf+5h) — the new's-right-edge equals the existing's-left-edge. Under the half-open convention, the two intervals don't share the boundary point T_vf+1h (the new's-right is excluded, the existing's-left is included, and the intersection is the empty set). The double-booking check passes and the new trip is created in PLANNED state. Captured as trip-overlap-alpha."
              - "Case beta (adjacency at the right-edge-of-existing meeting the new's-left-edge): a third trip request with scheduled_departure_at=T_vf+5h (the exact right-edge of the existing's interval), scheduled_arrival_at=T_vf+8h. The new's interval is [T_vf+5h, T_vf+8h). The existing's-right-edge T_vf+5h is excluded from the existing's interval (the right-side-open convention), and the new's-left-edge T_vf+5h is included in the new's interval (the left-side-closed convention). The two intervals' intersection is the empty set (no shared point — the boundary point T_vf+5h is in the new's interval but not the existing's). Adjacency is allowed: the trip is created as trip-overlap-beta in PLANNED state."
              - "Case gamma (genuine overlap, conflict): a fourth trip request with scheduled_departure_at=T_vf+2h, scheduled_arrival_at=T_vf+6h. The new's interval is [T_vf+2h, T_vf+6h). The existing's interval is [T_vf+1h, T_vf+5h). The two intersect in [T_vf+2h, T_vf+5h), which is non-empty. The double-booking check fires. The response is HTTP 409 with error_id ERR_VEHICLE_DOUBLE_BOOKED. The trip-table row-count for veh-overlap-1 stays at three (the existing-and-the-two-adjacent), the failed-fourth isn't written."
              - "Case delta (no-overlap on a different vehicle, a sanity-check that the calendar is per-vehicle): a fifth trip request with vehicle_id=veh-overlap-2 (the other vehicle on the permit), scheduled_departure_at=T_vf+2h, scheduled_arrival_at=T_vf+6h (which would overlap if it were on veh-overlap-1). Because veh-overlap-2's calendar is empty, no double-booking. The trip is created as trip-overlap-delta in PLANNED state."
              - "Case epsilon (cross-permit-same-vehicle, the cross-permit-scope of the vehicle-calendar — actually in the scaffold each vehicle belongs to exactly one company and one company can have multiple permits authorizing the same vehicle, so the cross-permit-same-vehicle case arises when the same vehicle is named on two different ACTIVE permits and a trip on one permit overlaps a trip on the other. The fixture-helper creates a second permit pm-overlap-2 also authorizing veh-overlap-1; a trip on pm-overlap-2 with vehicle_id=veh-overlap-1 whose scheduled window overlaps trip-overlap-existing's on pm-overlap-1 is also rejected with ERR_VEHICLE_DOUBLE_BOOKED, because the vehicle's-calendar is at the physical-asset-scope, not the per-permit scope. The §1.4 priority-521's-prose explicitly notes the cross-permit cross-aggregate scope of the double-booking check.)"
            trigger:
              - "The four-or-five POST /v1/permits/{pid}/trips requests in the cases alpha through epsilon. The order is independent because each case's success-or-failure depends only on the on-disk-trip-state at the moment of the call, and the cases are non-interfering (cases alpha, beta, delta succeed and grow the calendar; case gamma fails and doesn't write; case epsilon is on the second-permit and tests the cross-aggregate scope)."
            assert:
              - "Case alpha response: HTTP 201, the new trip's-row is written with the trip-overlap-alpha-id. GET /v1/permits/pm-overlap-1's-trips-list (if there's a list endpoint — there isn't one in the §1.5 list per the entrance-protocol's-trim, so the observation is via the individual-trip-id GET endpoints) includes trip-overlap-alpha-id."
              - "Case beta response: HTTP 201. The adjacent-touching-boundary case is admitted under the half-open semantics. The two trips' intervals are mathematically disjoint."
              - "Case gamma response: HTTP 409, response.data.error_id == 'ERR_VEHICLE_DOUBLE_BOOKED'. The error's-message-field contains a string identifying the conflicting-trip-id (the existing trip-overlap-existing's-id) for human debugging. The on-disk trip-table is unchanged by the failed request (the gamma-case's trip row isn't created)."
              - "Case delta response: HTTP 201 on the different-vehicle. The cross-vehicle-no-conflict baseline."
              - "Case epsilon response (the cross-permit-same-vehicle variant): HTTP 409 with ERR_VEHICLE_DOUBLE_BOOKED, the same error-id as case gamma. The §1.4 priority-521's-cross-aggregate-scope is observable: the conflict-source's-trip is on a *different* permit but the *same* vehicle, and the rejection-message identifies the conflicting-trip-id-and-its-permit-id for the human-debugging-context."
              - "The half-open-right-exclusive convention's-observable-asymmetry is the alpha-and-beta cases' admission of the boundary-touching adjacency — a fully-closed `[s, e]` interval-convention would reject the adjacency-cases as having a shared-boundary-point. The strict-overlap case-gamma is rejected under both the half-open and the fully-closed conventions; the asymmetry shows up only at the adjacency-edge. The §0.5 rule-8's 'boundary-semantics of adjacency' clause's-observable is the alpha-and-beta pair admission of the touching-intervals as non-conflicting."

        - name: gps_stream_strict_greater_than_monotonicity_on_reported_at_per_trip
          resource: "GPSReport stream per Trip — the ordered list of GPSReport rows with the same trip_id, sorted by `reported_at` ascending"
          interval_semantics: "closed-on-the-prior-edge — the new sample's `reported_at` must be *strictly greater than* the trip's current `latest_gps_at` cursor. Equality (a sample with the same `reported_at` as the latest existing sample) is rejected with ERR_GPS_OUT_OF_ORDER. The semantics is the strict-monotone-increasing convention on the timestamp-sequence, the natural-physical-clock-interpretation of 'each next reading must be after the previous one'."
          grounds:
            - "validations[priority=512] (ERR_GPS_OUT_OF_ORDER on the strict-greater-than check)"
            - "entities.Trip.latest_gps_at (the cursor that the check compares against)"
            - "the §1.4 priority-512's-prose's-strict-`>`-pin on the monotonicity convention"
            - "the §1.2.1 concurrency-rule for the same-timestamp-from-two-concurrent-requests case, which selects one as the winner via the first-writer-wins-on-the-latest_gps_at-cursor lock and rejects the other with the order error"
            - "the auto-penalty side-effect on GPS reports that classify as a violation per §1.3 calc-4 — orthogonal to the monotonicity, since the violation-classifier runs only on accepted reports"
          distinguishing_aspect: |
            The GPS-stream's-monotonicity is the *strict-greater-than* convention on the
            timestamp-metric, the closed-on-the-prior-edge interval-semantics (the existing
            cursor is the inclusive-on-the-existing-side, and the new sample must be
            strictly-greater-than-it on the new-side). This is qualitatively different from
            the half-open-right-exclusive convention on the vehicle's-scheduling-calendar
            in the prior instance — the calendar admits the adjacency-at-the-boundary, the
            GPS-stream does not. The resources are also different (the vehicle-calendar is
            a multi-trip-on-one-vehicle scope, the GPS-stream is a multi-sample-on-one-trip
            scope). The §0.5 rule-8's 'different interval semantics on different resources'
            clause is satisfied by the half-open-vs-strict-monotone pair.
          test_recipe:
            setup:
              - "Fixture: an IN_TRANSIT Trip trip-gps-mono-1 with actual_departure_at = T_dep. The trip's GPS-stream is initialized via one prior gps-ingest call with reported_at = T_dep + 1 minute, the standard fixture's first sample. The trip's latest_gps_at after this initial sample is T_dep + 1min."
              - "Case alpha (strictly-after-the-cursor, accepted): a POST /v1/trips/trip-gps-mono-1/gps-reports with body's reported_at = T_dep + 2 minutes. The strict-`>` check `T_dep+2min > T_dep+1min` is true, the sample is accepted, the cursor advances to T_dep+2min. The sample's-id is gps-mono-alpha-id."
              - "Case beta (exactly-equal-to-the-cursor, rejected): a new POST with reported_at = T_dep + 2 minutes exactly (the same timestamp as the cursor). The check's expression is `T_dep+2min > T_dep+2min` which evaluates to false (strict-greater-than fails on equality). The rejection is ERR_GPS_OUT_OF_ORDER 409. The cursor's-value is unchanged (still T_dep+2min from case-alpha), and the trip-row's latest_gps_at field is unchanged."
              - "Case gamma (strictly-before-the-cursor, rejected): a new POST with reported_at = T_dep + 90 seconds (which is between the initial sample's T_dep+1min and the alpha's T_dep+2min, so it's strictly less than the current cursor of T_dep+2min). The check fails. ERR_GPS_OUT_OF_ORDER. Cursor unchanged."
              - "Case delta (a subsequent valid sample, to confirm the stream continues to admit subsequent strictly-greater values after the rejected attempts): POST with reported_at = T_dep + 3 minutes. The check passes; the cursor advances to T_dep+3min. The stream's-row-count is the initial-sample + the alpha + the delta = 3 rows; the beta-and-gamma rejections didn't add rows."
              - "Case epsilon (the concurrency-rule-driven race-case): two POST requests with the *same* reported_at = T_dep+4min, fired from two test-threads near-simultaneously. The §1.2.1 concurrency-rule for the GPS-stream's-monotonicity-race says first-writer-wins on the latest_gps_at-lock. The first to commit advances the cursor; the second's-comparison-against-the-now-T_dep+4min-cursor sees its own reported_at = T_dep+4min as equal-to-the-cursor (the strict-`>` fails) and is rejected with ERR_GPS_OUT_OF_ORDER. The exactly-which-of-the-two-wins is implementation-dependent; the test asserts only that exactly one of the two succeeds (HTTP 201) and the other gets the 409 with ERR_GPS_OUT_OF_ORDER. The stream's-row-count post-race is the pre-race-count plus one (one new row from the winning request)."
            trigger:
              - "The five cases' POST /v1/trips/{tid}/gps-reports calls in the order alpha → beta → gamma → delta → epsilon (the epsilon's two parallel requests being the simultaneous-arrival case). Idempotency-Key headers are absent across all cases so the idempotency-replay path doesn't interfere with the monotonicity-check."
            assert:
              - "Case alpha: HTTP 201, the GPSReport row is written with reported_at=T_dep+2min, the trip's latest_gps_at field is updated to T_dep+2min, the auto_penalty_ids field is empty (no violation, since the test's speed_kph is below MAX and the lat/lon is on-route)."
              - "Case beta: HTTP 409, response.data.error_id == 'ERR_GPS_OUT_OF_ORDER'. The trip's latest_gps_at is unchanged at T_dep+2min. The stream's-row-count is unchanged."
              - "Case gamma: HTTP 409, same error_id ERR_GPS_OUT_OF_ORDER (the strict-`>` check's-failure-message doesn't distinguish equal-to-cursor vs strictly-less-than-cursor — both are rejected with the same error_id and the error_message contains the offending reported_at value for debugging). The latest_gps_at is unchanged."
              - "Case delta: HTTP 201, the cursor advances to T_dep+3min."
              - "Case epsilon: exactly one of the two parallel requests returns HTTP 201 (the winner), and exactly the other returns HTTP 409 with ERR_GPS_OUT_OF_ORDER (the loser). The winner's response's-body has the GPSReport's-id of the just-written row; the loser's response doesn't have a row-id. The trip's-latest_gps_at after the race is T_dep+4min (one advance from the winner's commit). The stream's-row-count is the pre-race-count plus exactly one (not zero, because the winner did commit a row). The concurrency-rule's first-writer-wins-on-the-cursor-lock observable is the exactly-one-winner-and-one-loser pair."
              - "GET /v1/trips/trip-gps-mono-1/gps-reports after all cases: the response's data-list is the four-or-five accepted reports in ascending-reported_at order — initial-sample at T_dep+1min, alpha at T_dep+2min, delta at T_dep+3min, the epsilon-winner at T_dep+4min. The list's length is 4 (the initial-sample-from-the-fixture's-setup plus the three successful POSTs alpha, delta, epsilon-winner). The total_count in the pagination block is 4. The has_more is false (the four fit in the default limit of 10). The list's ordering observable is the strict-monotone-increasing reported_at sequence — the spec's-sort-key-pin and the rejection-of-equal-timestamps together guarantee the sequence's strict-monotonicity."
              - "The interval-semantics contrast with the vehicle-calendar's case (the prior instance) is observable by comparing the alpha-or-delta case's body's reported_at vs the cursor (a strictly-greater value is accepted) with the vehicle-calendar's beta case (the adjacency-at-the-boundary on the schedule is accepted under half-open). The same-semantic-different-direction nature of the two intervals — strict-monotone-increasing on the timestamp-cursor vs the half-open-right-exclusive on the schedule-interval — is the rule-8's two-different-interval-semantics-on-two-different-resources pair-observable. The two are *both* lenient on the touching-boundary case in some sense (the gps-cursor allows the just-after-the-cursor's-instant, the schedule allows the right-edge-equals-the-other's-left-edge), and *both* strict on the genuine-overlap (the gps-stream rejects equal-or-prior-cursor, the schedule rejects intersecting-intervals). The asymmetry is in *which-side-of-the-boundary is the inclusive side*: GPS is exclusive-of-the-prior-cursor-instant, schedule is exclusive-of-the-existing-trip's-right-edge. The two are *mirror-image* interval-conventions, one closed-on-the-left-of-the-new-interval and the other open-on-the-right-of-the-existing-interval."

    # §0.5 Rule 9 — compensating_invariant — ≥ 2 instances across different conserved quantities.
    compensating_invariant:
      instances:

        - name: wallet_plus_regulator_ledger_conservation_across_issue_and_void_issue
          conserved_quantity: "the sum `sum_over_all_companies(TransportCompany.wallet_balance_cents) + RegulatorLedger.collected_fees_cents`, where the regulator-ledger field is conceptually the sink-side of the fee-flow but isn't a persisted entity in this scaffold (the wallet-debits flow out-of-band into the regulator's bank account, and the ledger is the conceptual book-keeping mirror that the test asserts on indirectly via the wallet's-balance changes). The currency-unit is integer-cents, so the conservation is bit-exact-equality."
          forward_action: "POST /v1/permits/{id}/issue — debits the company's wallet by the formula's-output annual_renewal_fee(now, vehicle_count, is_late=false, constants) and conceptually credits the regulator's ledger by the same amount."
          compensating_action: "POST /v1/permits/{id}/void-issue (the regulator's clerical-error-reversal within the 24-hour-window-after-issue per the §1.4 priority-514 ERR_VOID_WINDOW_CLOSED check). The void's-side-effect-block credits the company's wallet by `void_refunded_cents = issue_fee_cents + sum(renewal_history[*].fee_cents)` and conceptually debits the regulator's ledger by the same amount. The §1.2 ACTIVE→VOIDED prose pins the literal-amount-stored-on-the-row mechanism: the void reads the stored `issue_fee_cents` and the stored `renewal_history[*].fee_cents` values, summing them and refunding the exact integer, so the conservation is bit-exact even after the formula's-inputs (the fee-constants, the vehicle-count) have drifted between the issue and the void."
          grounds:
            - "entities.Permit.issue_fee_cents (the field that stores the exact issue-fee-integer for the audit and the refund-amount derivation)"
            - "entities.Permit.renewal_history (the append-only list of past renewal-fee records, each with `fee_cents`)"
            - "entities.Permit.voided_at and Permit.void_refunded_cents (the void-event's recorded fields)"
            - "entities.TransportCompany.wallet_balance_cents (the conserved-quantity's-monitor side)"
            - "calculations.annual_renewal_fee (the formula computing each fee-event's amount)"
            - "state_machines.Permit.DRAFT_to_ACTIVE's side-effect-block 'debit the company wallet by issue_fee_cents' clause"
            - "state_machines.Permit.ACTIVE_to_VOIDED's side-effect-block 'credit the company wallet by void_refunded_cents' clause"
            - "validations[priority=540] (the ERR_INSUFFICIENT_WALLET_BALANCE pre-debit guard on the issue path)"
            - "validations[priority=514] (the ERR_VOID_WINDOW_CLOSED gate on the void path's 24-hour window)"
            - "constants_numeric_values for all the fee-and-window constants the formula references"
          distinguishing_aspect: |
            The conserved quantity is the *currency-summed-across-the-company-wallet-and-
            the-regulator-collected-fees-ledger*. The forward-action is the issue's debit;
            the compensating action is the void-issue's credit-of-the-exact-same-amount.
            The conservation invariant — the system-wide sum of (wallet across all companies)
            + (regulator-collected-fees-out-of-band-ledger) is invariant across the
            (issue, void-issue) pair — is exact because the void-refund-amount is the
            literal-integer-stored-on-the-row-at-issue-time, not a re-computation. The
            second rule-9 instance below is on a *different* conserved quantity (the
            penalty-points's-rolling-window-sum on the driver-side), satisfying rule-9's
            'different types of conserved quantities' clause (currency vs disciplinary-
            points).
          test_recipe:
            setup:
              - "Fixture: a fresh APPROVED company co-conserve-currency-1 with the wallet topped to a known initial balance W_0 = 10_000_000 cents. One valid driver, one passed-inspected vehicle, one APPROVED route — all the standard fixtures. The wallet's initial value is the pre-issue baseline."
              - "Action 1 (the issue): operator POST /v1/permits → permit pm-conserve-1 in DRAFT. Regulator POST /v1/permits/pm-conserve-1/issue → the permit transitions DRAFT → ACTIVE. The issue's-side-effect debits the wallet by the formula's-output for (vehicle_count=1, is_late=false, constants), which is `BASE_RENEWAL_FEE_CENTS + 1 * PER_VEHICLE_SURCHARGE_CENTS = 500_000 + 30_000 = 530_000` cents. The wallet's-balance after the issue is W_1 = W_0 - 530_000 = 9_470_000 cents. The permit's `issue_fee_cents` field is 530_000, the audit-of-the-exact-debit-amount."
              - "Pre-void observation: the wallet-balance reads as 9_470_000 cents via a hypothetical GET /v1/companies/co-conserve-currency-1 (which the scaffold's endpoint list has at the company-id-read endpoint, where the response-body includes the wallet_balance_cents field per the entity-schema). The permit's `issue_fee_cents` is observable via the GET /v1/permits/pm-conserve-1 read, returning the same 530_000 integer."
              - "Action 2 (the void, within the 24-hour window): the clock has not advanced past T_issue + 24h, so the void-window is still open. POST /v1/permits/pm-conserve-1/void-issue with body {reason_note: 'Clerical-error-recompute'}. The handler reads the stored issue_fee_cents (530_000) plus the renewal_history sum (which is zero since no renewals have fired in the brief post-issue window), the total is 530_000. The wallet is credited by 530_000, and the row's `void_refunded_cents` is written to 530_000 and `voided_at` is the call's now. The permit's lifecycle_status writes to VOIDED. The wallet-balance is now W_2 = W_1 + 530_000 = 9_470_000 + 530_000 = 10_000_000 = W_0, the exact-original-baseline."
              - "Variant 1 (the conserve-with-an-intervening-renewal scenario): a different fresh fixture's permit pm-conserve-2 is issued (debit fee_1=530_000). The clock advances into the renewal-window's open-but-on-time band (not in the late-grace, so is_late=false). Operator POSTs /v1/permits/pm-conserve-2/renew. The renewal's fee is also 530_000 (vehicle_count=1, is_late=false same formula-output). The wallet is debited by another 530_000. The permit's renewal_history list now has one entry with fee_cents=530_000. The clock then advances back-in-conceptual-time-to-just-after-the-issue (this isn't possible in the strict monotone-clock implementation — the test-harness's /_clock/advance only accepts non-negative seconds, per the constants_numeric_values.CLOCK_ADVANCE_MAX_SECONDS and the §1.5 prose on the clock-monotonicity. So this variant-1 isn't reachable in the scaffold's exact mechanics — the void's 24-hour-window can elapse between the issue and any forward-time renewal, making the (issue, renewal, void-issue) triple unreachable in the strict-clock model). The clean-pattern is just the (issue, void-issue) pair without an intervening renewal, which the base-case above tests."
              - "Variant 2 (the void-after-window-closed-rejection): a third fixture's permit pm-conserve-3 is issued. The clock advances past T_issue + 24 hours + 1 millisecond. POST /v1/permits/pm-conserve-3/void-issue. The §1.4 priority-514 ERR_VOID_WINDOW_CLOSED fires (this is also the rule-6 boundary-precision instance's-fired-case on the void-window's right edge). The wallet is unchanged from the post-issue value (no refund firing). The conservation-equation across the (issue, no-void-because-window-closed) sequence is: the wallet's net-debit equals the issue's-fee, and the regulator-ledger's-net-credit equals the same. The conservation-invariant holds in the sense that the issue's-fee is *earned-and-not-refunded* once the void-window closes — the regulator's right-to-keep-the-fee is what the 24-hour-window operationalizes. The terminal state is the wallet's-net-debit being the issue's-fee-amount, the regulator-ledger's-net-credit being the same amount, and the sum across both sides is unchanged from before the issue. This is the conservation-invariant's terminal-equilibrium form: the fee has moved from the wallet to the ledger, and the sum is preserved."
              - "Variant 3 (the (issue, void-issue, re-attempt-issue-of-a-new-permit) sequence to confirm the void's refund is fully fungible — the refunded-cents are usable for a subsequent fee-paying action): after the base-case's void of pm-conserve-1, the wallet's balance is back at W_0 = 10_000_000. A second permit-application via POST /v1/permits creates a fresh pm-conserve-1-second in DRAFT. The regulator's POST /v1/permits/pm-conserve-1-second/issue debits the wallet by the formula's-output (same 530_000 for the same vehicle_count). The post-this-second-issue wallet balance is W_0 - 530_000 = 9_470_000, matching the pre-void's W_1. The void's-refund's-funding the second issue is the fungibility observable. The (issue-1, void-1, issue-2) sequence's-net-effect on the wallet is W_0 - 530_000 = W_1 (the single net-debit equals one issue's-fee, the void's-credit cancels the first issue's-debit). The audit-trail is: company.wallet's-history-as-a-stream-of-debits-and-credits has the four entries (issue-1 -530_000; void-1 +530_000; issue-2 -530_000), with a running-balance that returns to W_0 after the void and dips back to W_1 after the second issue. The scaffold doesn't model the wallet's-history as a separate ledger-entity, but the audit is reconstructible from the Permit rows' issue_fee_cents-and-void_refunded_cents fields plus the implicit-out-of-band-topup operation that established W_0 in the first place."
            trigger:
              - "The base-case's two-action sequence (issue → void within 24h → assert the wallet returns to W_0) is the canonical conservation-invariant test. The variant-2 and variant-3 cases extend the assertion-set with the void-window-closed-non-refund-case (the conservation-equilibrium-when-the-window-elapsed) and the fungibility-of-the-refund-case."
            assert:
              - "Base case wallet trajectory: before-issue W_0=10_000_000. After-issue W_1=9_470_000 (= W_0 - issue_fee_cents). After-void W_2=10_000_000 (= W_1 + void_refunded_cents == W_0). The equality W_2 == W_0 is the conservation-equation's-instance for the (issue, void-issue) pair on a single permit with no intervening renewals. The bit-exactness of the integer-arithmetic guarantees no float-precision-noise."
              - "Permit-row state across the cycle: pre-issue (lifecycle_status='DRAFT', issue_fee_cents=null, voided_at=null, void_refunded_cents=null). Post-issue ('ACTIVE', 530_000, null, null). Post-void ('VOIDED', 530_000-unchanged, <the call's now>, 530_000). The two stored-integer fields (issue_fee_cents and void_refunded_cents) carry equal values in this no-renewal scenario, which is the literal-amount-pinned-on-the-row's-conservation-mechanism in action."
              - "Variant-2 (window-closed, no refund): post-issue W_1, attempted-void's-response is HTTP 409 ERR_VOID_WINDOW_CLOSED, wallet stays at W_1 post-attempt. The wallet-trajectory is the natural-expiry-conserves-the-fee path."
              - "Variant-3 (fungibility): the second-issue's-debit comes from the wallet's-balance which had been refilled by the prior-cycle's void-credit. The wallet-history is a sequence of (issue, void, issue) with the net being one issue's debit, matching the single-still-extant-permit's issue_fee_cents."
              - "Cross-cutting observable for the conservation across the entire scaffold's-event-history: the global sum `sum_over_all_companies(wallet_balance_cents) - sum_over_all_topups_so_far + sum_over_all_active_permits(issue_fee_cents) + sum_over_all_active_permits(sum_of_renewal_history's_fee_cents) - sum_over_all_voided_permits(void_refunded_cents)` equals zero at every observable moment. This is the system-wide conservation-invariant, and it's testable by reconstructing the regulator-side-ledger from the on-disk-Permit-rows' fee-fields. The non-zero-balance side is the wallet's-out-of-band-topups (which the scaffold doesn't model as an API endpoint), and the zero-sum-equation conditions on the topup-amounts being known constants of the fixture's-setup."

        - name: penalty_points_rolling_total_conservation_across_create_and_uphold_pair
          conserved_quantity: "for each Driver (the rule's-specified-subject for the active-effect path of penalties), the quantity `sum_of_points_value_over_(ACTIVE_status_penalties_with_observed_at_in_the_rolling_PENALTY_WINDOW_DAYS_window)` is the conserved cumulative-points-attribution. The conservation-equation says: a Penalty's `create` adds its points_value to the running-sum, and the same Penalty's `appeal-uphold` (which flips its void_status from ACTIVE to UPHELD) subtracts its points_value from the running-sum, leaving the net-effect-of-the-(create, uphold)-pair at zero. The wall-clock's rolling-window's trailing-edge-fall-off is a *separate* mechanism that decrements the sum without an explicit uphold — the conservation invariant counts only the *void-status-driven* changes, not the *window-trailing-edge* aging-out, which is a natural-decay process not a compensating-action. The two mechanisms are distinguishable in the audit: the upheld-penalty's `void_status` field flips from ACTIVE to UPHELD and the row is still present, while the window-aged-out penalty's row is unchanged on the void_status field (it stays ACTIVE) but is excluded from the rolling-sum by the §1.3 calc-2's-time-window-filter."
          forward_action: "POST /v1/penalties — the regulator's manual penalty issuance, which inserts a Penalty row with void_status='ACTIVE' and the points_value the regulator supplies. The cascade onto the driver's `current_rolling_points` cache increments the cache by points_value (when the cache is consistent before the call). The atomic-with-the-insert side-effect updates the driver's-row in the same transaction."
          compensating_action: "POST /v1/penalties/{penalty_id}/uphold — the regulator's appeal-uphold action within the 30-day-window (per the §1.4 priority-513 ERR_APPEAL_WINDOW_CLOSED gate). The void_status flips ACTIVE→UPHELD, and the driver's-cache is recomputed (the §1.3 calc-2's-trigger-list-sub-bullet-(b) recomputes the sum excluding the now-UPHELD penalty), with the net-effect being a decrement-by-points_value on the cache. The auto-GPS-violation-penalty path is also covered: a GPS-auto-penalty inserted by the §1.5 gps-ingest endpoint's-side-effect is observationally identical to a manual penalty for the purposes of this conservation, with the source-discriminator being the only difference."
          grounds:
            - "entities.Penalty.void_status (the ACTIVE-vs-UPHELD discriminator)"
            - "entities.Penalty.points_value (the conserved-integer's-per-row contribution)"
            - "entities.Penalty.observed_at (the rolling-window's-filter-field)"
            - "entities.Driver.current_rolling_points (the cached aggregate)"
            - "calculations.driver_penalty_point_rolling_total (the formula whose sum-over-non-UPHELD-in-the-window is the canonical-value of the conserved quantity at any moment)"
            - "state_machines.Penalty.ACTIVE_to_UPHELD (the compensating-action's-state-transition)"
            - "state_machines.Driver.VALID_to_INVALID and Driver.INVALID_to_VALID (the cascade-onto-the-driver-status-flag, which is the boundary-precision-rule-6's observable on the rolling-total's-crossing-the-12-threshold)"
            - "validations[priority=513] (the appeal-window-closed check, the gate on the compensating action's-availability)"
            - "the §1.5 GPS-ingest endpoint's-side-effect's-auto-penalty-insert, which is one of the two upstream-paths for the forward-action (manual-via-POST-penalties and auto-via-GPS-classifier)"
            - "constants_numeric_values.APPEAL_WINDOW_DAYS=30, PENALTY_WINDOW_DAYS=365, THRESHOLD_DRIVER_SUSPENSION_POINTS=12, GPS_VIOLATION_SPEED_POINTS=3, GPS_VIOLATION_OFF_ROUTE_POINTS=4, MANUAL_PENALTY_POINTS_MIN=1, MANUAL_PENALTY_POINTS_MAX=50"
          distinguishing_aspect: |
            The conserved quantity is *disciplinary-points* on a driver, a non-monetary
            integer-quantity-attribution, qualitatively *different* from the prior
            rule-9-A's *currency-cents* on a company's wallet. The two conserved quantities
            differ in their semantic-meaning (regulatory-discipline vs financial-balance),
            their unit (dimensionless points vs currency cents), their per-aggregate-scope
            (per-driver vs per-company, modulo the company's-and-vehicle's-penalty-subjects
            being audit-tracked-but-not-driving-downstream-state per the
            taxonomies.penalty_subject_types-note in §1.0), and the wall-clock-windowing
            convention (the points-window is a rolling-365-day-trailing-edge with natural-
            decay, while the wallet-ledger has no trailing-edge-decay — once a fee is
            collected, it stays on the regulator-ledger indefinitely). The §0.5 rule-9's
            'different types of conserved quantities' clause is satisfied by the
            (currency-sum, points-sum) pair across the two instances.
          test_recipe:
            setup:
              - "Fixture: a VALID Driver dr-conserve-points-1 with the standard parent-company-and-permit-and-trip context. The driver's current_rolling_points is 0 initially. The rolling-window's-right-edge is the current-clock value; the left-edge is `now - 365 days`."
              - "Pre-action baseline: GET /v1/drivers/dr-conserve-points-1/penalty-summary returns current_rolling_points=0, active_penalties_in_window=[], upheld_penalties_in_window=[]. The conservation-equation's-LHS (the sum-over-ACTIVE-penalties-in-the-window) is zero, the empty-sum."
              - "Forward action 1 (the manual-penalty-create): the regulator POST /v1/penalties with body {subject_type:'DRIVER', subject_id: dr-conserve-points-1's id, points_value: 7, observed_at: now-1h, reason_note: 'Conservation-test-issue-7-points'}. The Penalty row is inserted with void_status='ACTIVE', source='MANUAL_REGULATOR'. The driver's-cache is incremented by 7, the new value is 7. The conservation-equation's LHS is now 7 (the sum-over-the-one-ACTIVE-penalty's-points-value). The cache equals the LHS-formula's-recomputation. The penalty's-id is captured as pen-conserve-1-id."
              - "Forward action 2 (a second manual penalty): same shape with points_value=4 and observed_at=now-30min. The cache becomes 11. The two-penalty's-points-sum is 4+7=11, matching the cache. The driver's-status stays VALID (11 < 12)."
              - "Forward action 3 (an auto-GPS-violation-penalty via the gps-ingest path): the operator POSTs a GPS report with speed_kph > MAX_HAZMAT_SPEED_KPH on the driver's-trip, which is a separate fixture-context. The auto-penalty has source='GPS_VIOLATION_SPEED' and points_value=GPS_VIOLATION_SPEED_POINTS=3 per the constants table. The driver's-cache is incremented from 11 to 14. The threshold-crossing at 14 >= 12 fires the §1.2 Driver VALID→INVALID auto-transition (the rule-4 cascade-A's depth-3 mid-chain hop). The driver's hazmat_endorsement_status flips to INVALID. The conservation-equation's-LHS is 14 (the sum across the three ACTIVE penalties' points). The third penalty's-id is captured as pen-conserve-2-gps-id."
              - "Compensating action 1 (the uphold of the first penalty): POST /v1/penalties/pen-conserve-1-id/uphold with body {uphold_reason: 'Original observation overturned on appeal'}. The §1.4 priority-513 appeal-window-check passes (observed_at was now-1h-from-the-call-of-the-uphold which is also approximately-now plus-a-fraction-of-a-second since the test's-clock-pacing doesn't advance significantly between the cases; the elapsed is well under 30 days, the window is wide open). The void_status flips ACTIVE→UPHELD, upheld_at = the call's now. The driver's-cache is recomputed: sum over (the second-manual penalty's-4-points, the auto-GPS-penalty's-3-points) of the still-ACTIVE penalties, which is 7. The driver's-cache decrements from 14 to 7. The driver's status stays INVALID — the auto-recover-from-below-threshold path is intentionally not in the §1.2 transitions list (the keep-the-regulator-in-the-loop convention), so the status is not auto-flipped back to VALID despite the count dropping below threshold. The conservation-equation's-LHS is now 7. The (create, uphold) pair on pen-conserve-1 has net effect on the conserved quantity: zero (the +7 of the create cancels the -7 of the uphold). This is the rule-9-invariant-B's exact-conservation observable."
              - "Compensating action 2 (the uphold of the auto-GPS-penalty): POST /v1/penalties/pen-conserve-2-gps-id/uphold with body {uphold_reason: 'GPS-unit malfunction confirmed in maintenance log'}. The auto-penalty's appeal-window-check passes the same way. The void_status flips ACTIVE→UPHELD. The cache recomputes to 4 (just the surviving manual-penalty-2's points). The driver's-status remains INVALID per the keep-in-the-loop convention. The conservation across the (auto-GPS-insert, uphold) pair is also zero-net-effect. The audit-trail on the GPSReport row's `auto_penalty_ids` array still points at the now-UPHELD penalty's-id (the cross-reference is not cleared on the uphold; it's the audit's-historical-attribution-of-which-GPS-sample-caused-which-penalty-event, and the uphold's-overturning-of-the-penalty doesn't retroactively dis-attribute the original cause-and-effect)."
              - "Recovery action (the keep-the-regulator-in-the-loop's-explicit re-attestation to close the driver-state-cycle): the regulator POST /v1/drivers/dr-conserve-points-1/refresh-endorsement with body {endorsement_valid_until: now+2yr, endorsement_classes: ['3']}. The §1.2 Driver's NOT_ATTESTED/INVALID → VALID transition's precondition `current_rolling_points < THRESHOLD_DRIVER_SUSPENSION_POINTS` is `4 < 12` which is true, so the attestation succeeds. The hazmat_endorsement_status flips to VALID. The cross-aggregate cascade-up onto any SUSPENDED permits listing this driver fires on the next verify-compliance, mirroring the rule-3-Permit-cycle's positive-return-edge. The driver-cycle and the cascade's-up-arm-on-the-permit have fired together via the conservation-invariant's mechanism's-final-step."
            trigger:
              - "The five-or-six action sequence above — the three forward-actions (two manual-penalties, one auto-GPS-penalty), then the two compensating-actions (the two upholds, one on the first manual and one on the auto-GPS), then the regulator's-re-attestation to close the cycle. The conservation-equation's invariance across each (create, uphold) sub-pair is the per-pair-zero-net-effect observable. The driver's-cache's-trajectory monotonically reflects the sum of the still-ACTIVE penalties' points at each step."
            assert:
              - "Trajectory of the driver's-cache across the sequence: 0 (pre) → 7 (after the first manual create) → 11 (after the second manual create) → 14 (after the auto-GPS-create; the threshold-crossing fires the driver-status flip to INVALID at this step) → 7 (after the first uphold; the points drop but the status stays INVALID by the keep-in-the-loop convention) → 4 (after the second-the-auto-GPS-uphold; the points drop further; the status still stays INVALID) → 4 (after the regulator's-re-attestation; the points are unchanged because the attestation doesn't touch the penalty-records, but the status flips from INVALID back to VALID per the attestation's-cycle-positive-return-edge in the §1.2 Driver state-machine). The trajectory's last-state has the cache at 4 (the one-ACTIVE-non-UPHELD penalty's points) and the status at VALID (the regulator's-attested gate)."
              - "Conservation observable on each (create, uphold) pair: pen-conserve-1's create adds 7 to the running-sum; pen-conserve-1's uphold subtracts 7 from the running-sum. Net effect on the conserved quantity from the pen-conserve-1 pair: 0. Same for the pen-conserve-2-gps pair: net 0. The second-manual-penalty (the un-paired one without an uphold) contributes its full 4 to the persistent value at the end. The terminal value 4 equals the sum of the still-ACTIVE-non-UPHELD penalty's points in the rolling window, which is the conservation-equation's-LHS canonical value."
              - "The Penalty rows' on-disk state at the end: pen-conserve-1 (void_status='UPHELD', upheld_at=<the first-uphold's-call's-now>, upheld_by=<the regulator's X-User-ID>), the second-manual-penalty (void_status='ACTIVE'), and the auto-GPS-penalty (void_status='UPHELD' from the second-uphold's-call). The three rows' presence is invariant — the upholds are *flips of the discriminator-field*, not *deletions of the row* — so the audit-trail of the entire history is reconstructible from the on-disk three-row state plus the cross-references via Driver.current_rolling_points-and-the-status-flag's-history. The rule-9-B's quality is that the on-disk-record-keeping is non-destructive: the conservation is bit-exact-and-the-audit-is-fully-reconstructible."
              - "The wall-clock's-rolling-window-natural-decay is exercised in a *separate* worked example outside this rule-9-bucket — see the rule-6 'penalty_window_aging' boundary-precision instance (which isn't one of the five we wrote — to avoid the conservation/rule-6-overlap conceptual-noise, the scaffold's rule-9-B's-conservation focuses on the void-status-flip path's exact-conservation, and the natural-decay path is left to the rule-1 dual-variant's-as-of-issue-vs-current-rolling worked example's observation of how the at-issue-snapshot stays-frozen while the current-rolling drifts with the natural-decay). The two mechanisms (void-status flip and natural-decay) are observationally distinguishable on the Penalty row's-fields: the upheld penalties have void_status='UPHELD' and the upheld_at/upheld_by fields populated, while the naturally-aged-out penalties have void_status='ACTIVE' and the upheld_*-fields null — only the rolling-window's-time-filter in the §1.3 calc-2's-formula excludes them from the running-sum without flipping any flag."
              - "The cross-rule-1-and-rule-6 connection: the threshold-crossing at the post-auto-GPS-insert moment is the rule-6 boundary-A's exact-threshold-fires-the-flip moment. The same step is the rule-4 cascade-A's depth-3-hop. The same penalty-create event is the rule-9-B's forward-action's-one-instance. The single observable event has three difficulty-design-roles, which is the §1.8 spec's-allowance-of-the-same-element-citing-multiple-rule_ids item's-application. The distinguishing-aspect on each cite is what each rule's-§0.5-clause asks for, and the assertions in each rule_id's-worked-example focus on the rule's-specific-observable (the boundary-precision for rule-6, the cascade-chain-from-the-trigger for rule-4, the conservation-net-zero for rule-9)."
              - "The GPS-violation auto-penalty path's conservation: the auto-Penalty's-source field is 'GPS_VIOLATION_SPEED' (or 'GPS_VIOLATION_OFF_ROUTE' for the off-route case), distinguishing it from the manual 'MANUAL_REGULATOR'-source penalties in the trajectory above. The conservation-invariant is *agnostic* to the source — every Penalty row regardless of source contributes its points_value to the rolling-sum when its void_status is ACTIVE and its observed_at is in the window, and the uphold-compensating-action works the same way on any source's penalty. The Penalty.source field is *audit-only*, not a discriminator for the conservation-mechanism. This is the rule-9-B's symmetry-across-the-source-axis observable."

    # Orchestrator-added supplemental: rbac matrix cells deviating from
    # the row-majority deny-cause, exercised through the cross-tenant
    # and self-only error_ids vs the generic role-not-permitted error_id.
    # Note: this is a *supplemental* bucket beyond the nine §0.5 canonical
    # rule_ids, on a rule_id label the entrance-orchestrator's-brief named
    # explicitly. The §0.5 rules' minimum-instance-counts don't apply here;
    # the bucket has the orchestrator's-suggested-three-instances.
    rbac_deviation_cell:
      instances:

        - name: cross_tenant_403_on_company_operator_reading_a_different_companys_permit
          deviation: "the CompanyOperator-row of the RBAC matrix's GET /v1/permits/{permit_id} cell is ALLOW-with-the-cross-tenant-ownership-condition, not pure-ALLOW and not pure-DENY. The condition's-violation-error-id is ERR_CROSS_TENANT_ACCESS at HTTP 403, which is a *different* error-id from the generic-row-deny-cause's ERR_ROLE_NOT_PERMITTED (also 403). The two-distinct-403-error-ids-on-the-same-row-and-same-cell-depending-on-the-condition's-evaluation are the canonical-rbac-deviation pattern."
          grounds:
            - "rbac_matrix.GET /v1/permits/{permit_id}.CompanyOperator = 'ALLOW-with-cross-tenant-check'"
            - "validations[priority=530] (the cross-tenant ERR_CROSS_TENANT_ACCESS check at the per-row ownership-tier)"
            - "validations[priority=200] (the generic ERR_ROLE_NOT_PERMITTED at the role-allow-set tier)"
            - "errors.ERR_CROSS_TENANT_ACCESS and errors.ERR_ROLE_NOT_PERMITTED in the §1.6 catalog"
            - "the precedence-pair relationship with the existence-tier (priority 300 ERR_PERMIT_NOT_FOUND wins over the cross-tenant 530 when the path-id is non-existent, per the rule-5 conflict-B's pinned answer)"
          distinguishing_aspect: |
            The cell's two-different-deny-causes — the generic role-not-permitted (when
            the role itself is wrong, e.g., a Driver-role request on the permit-read
            endpoint) and the cross-tenant (when the role is right but the per-row's-tenant
            doesn't match the requester's) — are the rbac-deviation observable. The two
            distinct error-id-strings on the response let the test layer attribute the
            deny-cause precisely. The three-distinct-403-causes-and-the-404-cause stack
            up via the priority-ordering: ERR_UNAUTHENTICATED (401, auth missing/invalid)
            → ERR_ROLE_NOT_PERMITTED (403, wrong role) → ERR_PERMIT_NOT_FOUND (404,
            existence) → ERR_CROSS_TENANT_ACCESS (403, ownership-violation on an existing
            row by a right-role-from-a-wrong-tenant requester). The four-error-id-stack
            is the full-precedence-walk on the GET /v1/permits/{id} endpoint.
          test_recipe:
            setup:
              - "Two companies co-rbac-X and co-rbac-Y, both APPROVED with their own valid grounding-entity-sets. The fixture-helper issues an ACTIVE permit pm-rbac-X-1 owned by co-rbac-X. The permit's id is pm-rbac-X-1's UUID."
              - "Three test-actors with distinct credentials: actor-1 is `X-User-Role=CompanyOperator, X-User-ID=<co-rbac-X's id>`, the rightful-owner-operator of pm-rbac-X-1. Actor-2 is `X-User-Role=CompanyOperator, X-User-ID=<co-rbac-Y's id>`, the wrong-tenant-operator. Actor-3 is `X-User-Role=Driver, X-User-ID=<some driver id>`, the wrong-role-and-orthogonal-identity. Actor-4 is `X-User-Role=RegulatorOfficer, X-User-ID=<some opaque officer-id>`, the regulator-with-cross-tenant-read-permission."
              - "A fifth scenario uses an unauthenticated request (no headers) to round out the four-deny-causes stack."
            trigger:
              - "Five GET /v1/permits/pm-rbac-X-1 requests with the five different actor-credential combinations. Optionally a sixth request with a well-formed-but-nonexistent UUID in the path, by actor-2 (the wrong-tenant-operator), to exercise the 404-wins-over-the-cross-tenant-403 rule-5-conflict-B's-scenario which is also one of this rbac-deviation cell's-observable corners."
            assert:
              - "Actor-1 (rightful owner): HTTP 200, response.data is the permit's row with all the standard fields (lifecycle_status, valid_from, valid_until, the snapshot fields, the live_per_leg derived field per the endpoint's response-schema)."
              - "Actor-2 (wrong-tenant CompanyOperator on the existing permit): HTTP 403, response.data.error_id == 'ERR_CROSS_TENANT_ACCESS'. The role-is-in-the-allow-set check at priority 200 passes (CompanyOperator IS one of the endpoint's allowed roles), so the response is *not* ERR_ROLE_NOT_PERMITTED; it's the cross-tenant ERR_CROSS_TENANT_ACCESS because the row's company_id doesn't match the requester's X-User-ID. The distinction between the two 403-flavors is the rbac-deviation cell's signature observable."
              - "Actor-3 (Driver-role on the permit-read endpoint, which is *not* in the Driver-role's-allow-list per the RBAC matrix's Driver-column-for-this-row being pure-DENY): HTTP 403, response.data.error_id == 'ERR_ROLE_NOT_PERMITTED'. The role's-not-in-the-allow-set fires the priority-200 check; the cross-tenant check at priority 530 doesn't fire (the role-check short-circuits the validation walk). The Driver-role's-error-id is the generic role-mismatch one."
              - "Actor-4 (RegulatorOfficer): HTTP 200, the regulator's cross-tenant-exempt-read returns the permit's-row's-data the same as actor-1. The regulator-row in the RBAC matrix is the all-tenants-ALLOW row, distinct from the CompanyOperator's-tenant-scoped-ALLOW."
              - "Actor-5 (no headers, unauthenticated): HTTP 401, response.data.error_id == 'ERR_UNAUTHENTICATED'. The auth-check at priority 100 fires before the role-check at priority 200."
              - "The optional sixth scenario (actor-2 hitting a nonexistent UUID): HTTP 404, response.data.error_id == 'ERR_PERMIT_NOT_FOUND'. The existence-check at priority 300 fires before the cross-tenant-check at priority 530, which is the rule-5-conflict-B's-pinned ordering. This corner-case is the cross-cut between the rbac-deviation bucket and the rule-5-priority-conflict-B bucket; the single test exercises both observables."
              - "The five-or-six responses' aggregate-shape across the actor-credential matrix shows the priority-stack: 401 for unauth, 403-ROLE-NOT-PERMITTED for wrong-role, 404-NOT-FOUND for nonexistent-id, 403-CROSS-TENANT-ACCESS for right-role-wrong-tenant-on-existing-id, and 200 for the two ALLOW cases (the rightful-tenant and the all-tenants-regulator). The five-distinct-status-and-error-id combinations across the same endpoint-URL are the cell's-full-behavioral-fingerprint."

        - name: driver_role_self_only_403_on_other_drivers_penalty_summary_read
          deviation: "the Driver-role's-row in the RBAC matrix's GET /v1/drivers/{driver_id}/penalty-summary cell is ALLOW-with-the-self-only-condition: the path's {driver_id} must equal the request's X-User-ID. The deviation from the row-majority (which is uniform-DENY for the Driver-role across all the non-self endpoints) is the ALLOW-cell with the per-row-self-id condition. The condition-failure-error-id is ERR_CROSS_TENANT_ACCESS at HTTP 403 (the same error-id as the cross-tenant case in the prior instance, but the *cause-of-the-mismatch* is the self-id-vs-path-id-mismatch instead of the tenant-id-vs-row-owning-tenant-mismatch). The shared error-id with two-distinct-causes-by-the-role-and-row pairing is the deviation-cell-mechanic."
          grounds:
            - "rbac_matrix.GET /v1/drivers/{driver_id}/penalty-summary.Driver = 'ALLOW-with-self-only-check'"
            - "validations[priority=531] (the Driver-role-self-id check at the per-role-priority-531 entry in §1.4)"
            - "the §1.7 Driver role's-identity: entity_backed:Driver, where the X-User-ID equals the Driver's row id by the entity-backed-identity convention"
            - "the CompanyOperator-row's-cell-for-the-same-endpoint: it's ALLOW-with-the-transitive-tenant-check on the driver's-company_id, a different condition. The two roles' ALLOW-with-different-conditions on the same row are a per-role-per-cell condition-multiplexing: the row's allow-or-deny depends on the role's-identity-vs-the-row's-aggregate-relationship."
          distinguishing_aspect: |
            The deviation here is the *self-only-by-identity-match* condition on the
            Driver-role, distinct from the *cross-tenant-by-aggregate-membership* condition
            on the CompanyOperator-role on the same row. The two conditions are different
            kinds of cross-aggregate-relationship predicates, both yielding the same
            ERR_CROSS_TENANT_ACCESS error-id under the spec's unified-cross-aggregate-ownership-
            failure-error-id convention. The Driver-role's-deviation-cell is the only ALLOW-
            cell for the Driver-role across the §1.5 endpoint list, modulo the GET
            /v1/drivers/{did} and the GET /v1/trips/{tid}-with-the-trip's-driver_id-matches-
            the-self-id which are the other Driver-self-cells. The three Driver-ALLOW-cells
            form a small sub-graph of the RBAC matrix's-row, the rest of the row being
            uniformly-DENY.
          test_recipe:
            setup:
              - "Two drivers under the same company co-rbac-driver-1: dr-self-1 with hazmat_endorsement_status VALID and a couple of historical penalties in the rolling window, and dr-self-2 also VALID and with its own penalty-history. Both drivers' parent-company is the same co-rbac-driver-1 (so the company-operator's-cross-tenant-check on the parent-company's-id is the same for both drivers' summaries)."
              - "Four actors: actor-A is the Driver-role for dr-self-1 itself (`X-User-Role=Driver, X-User-ID=<dr-self-1's id>`, the self-of-dr-self-1). Actor-B is the Driver-role for dr-self-2 (similarly). Actor-C is the company-operator of the shared parent-company (`X-User-Role=CompanyOperator, X-User-ID=<co-rbac-driver-1's id>`). Actor-D is the RegulatorOfficer."
              - "The five-or-six request variants probe the four-cell-actor-grid: actor-A hitting dr-self-1's-summary (self-match, ALLOW). Actor-A hitting dr-self-2's-summary (self-mismatch, the deviation-fires DENY-with-cross-tenant-error-id). Actor-B hitting dr-self-2 (the symmetric self-match). Actor-B hitting dr-self-1 (the symmetric self-mismatch). Actor-C hitting either-driver's summary (the company-operator's-cross-tenant-on-the-parent-company is satisfied for both drivers, the cell is ALLOW). Actor-D hitting either driver (the regulator's-cross-tenant-exempt, ALLOW). Optionally a wrong-tenant-CompanyOperator (actor-E with a different company's id) hitting either driver's-summary (the cross-tenant-fails-because-the-parent-company-doesn't-match, ERR_CROSS_TENANT_ACCESS)."
            trigger:
              - "The matrix of GET /v1/drivers/{did}/penalty-summary calls with the four-or-five actor-credentials and the two driver-paths. Six or eight cells in the cross-product."
            assert:
              - "Actor-A on dr-self-1: HTTP 200, response.data has the driver's-summary including the current_rolling_points, hazmat_endorsement_status, the active and upheld penalty lists. The self-match-on-the-Driver-role-and-the-path-id is the ALLOW-condition's-truth-case."
              - "Actor-A on dr-self-2: HTTP 403, response.data.error_id == 'ERR_CROSS_TENANT_ACCESS'. The self-mismatch (the Driver-actor's X-User-ID is dr-self-1, the path's id is dr-self-2) fires the priority-531's-self-only-check's-failure. The error-id is the same as the cross-tenant case in the prior rbac_deviation instance, but the *condition's-cause* is the self-vs-path mismatch on the Driver-role's-entity-backed-identity, distinguishable in the audit-log's-error-context from the company-tenant-mismatch on the CompanyOperator-role's-entity-backed-identity. The shared-error-id observation is the spec's-design-choice of a single-error-id-for-the-cross-aggregate-ownership-failure-family, with the role-and-cause being distinguishable by the request's-context-headers but not by the response's error_id field alone."
              - "Actor-B (the other driver's self): symmetric to actor-A — ALLOW on its own id (HTTP 200 on dr-self-2's-path), DENY-with-ERR_CROSS_TENANT_ACCESS on the other driver's path (HTTP 403 on dr-self-1's-path)."
              - "Actor-C (the company-operator of the parent-company): both drivers' summaries are accessible (HTTP 200 on both, because the parent-company of both drivers is co-rbac-driver-1 which matches the actor's X-User-ID, satisfying the priority-530's cross-tenant-on-the-parent-company-id check). The company-operator-role's-allow-cell on this endpoint is the cross-tenant-on-the-transitive-parent-aggregate-id condition, distinct from the Driver-role's-self-only condition."
              - "Actor-D (the regulator): all drivers' summaries are accessible (cross-tenant-exempt), HTTP 200 on both."
              - "Actor-E (the wrong-tenant CompanyOperator from a *different* company that doesn't own these drivers): HTTP 403 with ERR_CROSS_TENANT_ACCESS on either driver's-path. The error-id's-cause is the company-tenant-mismatch on the operator-role, again the shared-error-id-with-different-cause-than-the-driver-self-mismatch case."
              - "The two-distinct-conditions-on-the-same-cell observable across actor-A-on-self-vs-other and actor-C-vs-actor-E is the rbac-matrix's-cell-multiplexing-by-role-identity feature. The fixture-script can enumerate all the (role, X-User-ID, path-id) triples on this endpoint and write a parameterized-test-function that asserts the allow-or-deny-with-which-error-id outcome per cell, building the full cell-truth-table for the deviation-cell-row. The test layer's-coverage of this single endpoint exercises four-or-five distinct cause-paths to the same error-id space."

        - name: test_harness_allow_cells_for_clock_advance_and_sweep_run_only
          deviation: "the TestHarness column in the RBAC matrix is uniformly-DENY across all 35-of-the-37 non-test endpoints, and uniformly-ALLOW on exactly the two test-harness endpoints POST /v1/_clock/advance and POST /v1/_sweep/run. The two-allow-cells in an otherwise-all-deny-column is the deviation. The deny-cause on the 35 non-test cells is the standard ERR_ROLE_NOT_PERMITTED at HTTP 403; the allow-on-the-two cells is the unconditional ALLOW that admits the test-harness's-system-operations on the logical-clock and the periodic-sweep. The deny on the rest of the matrix's-column is the production-safety-by-the-auth-middleware-rejecting-the-test-role mechanism — in production, the auth-middleware doesn't recognize the TestHarness role-name and rejects every request as ERR_UNAUTHENTICATED 401, an even-stronger denial than the matrix's-403-deny-cell. The 401-vs-403 distinction between the production-disable and the test-mode's-cell-deny is the deployment-conditional layer's-observable."
          grounds:
            - "rbac_matrix.POST /v1/_clock/advance.TestHarness = 'ALLOW' (the only ALLOW in the row for any role on this endpoint — the four roles' cells are CompanyOperator-DENY, RegulatorOfficer-DENY, Driver-DENY, TestHarness-ALLOW)"
            - "rbac_matrix.POST /v1/_sweep/run.TestHarness = 'ALLOW' (the parallel cell for the sweep endpoint)"
            - "the §1.5 prose's-testability-completeness-principle-rationale for the two test-endpoints' existence"
            - "the §1.7 TestHarness role-definition's-prose on the production-vs-test-mode auth-middleware-gating"
            - "the §1.4 priority-100-and-200 auth-and-role-tier-checks that govern the universal-DENY-on-non-test-endpoints for the TestHarness role"
          distinguishing_aspect: |
            The deviation pattern is the *column-anomaly*: a role whose RBAC-matrix-column
            is uniformly-DENY everywhere except a small sub-set of system-endpoints. The
            other three roles' columns each have a *cluster* of ALLOW-cells (one or two
            dozen for the CompanyOperator-role, a slightly-larger cluster for the
            RegulatorOfficer-role, and the three-cell-cluster for the Driver-self-reads).
            The TestHarness column's two-cell-cluster is the smallest cluster, by design,
            reflecting the role's-purpose: just the wall-clock-and-sweep-system-triggers.
            The orchestrator's-test-of-this-deviation is that the test-harness-role is
            *neither a regulator nor an operator nor a driver* — it's a fourth role-type
            whose existence is solely for the test-machinery, and whose surface is exactly
            the two endpoints the testability-completeness principle requires. The
            production-disable-of-the-TestHarness-role-at-the-auth-middleware-level is the
            safety-mechanism that prevents the test-endpoints from being exposed in
            production, where the OS-clock-ticks and the cron-fires the sweep instead. The
            §1.7 role-definition's-prose pins this production-vs-test deployment-time
            switch.
          test_recipe:
            setup:
              - "The test fixture is the standard one — any APPROVED-company-and-issued-permit setup. The test's purpose is to exercise the TestHarness-row's-two-ALLOW-cells and to confirm the test-harness-can't-do-anything-else (a hard-failure across a representative-sample of the non-test endpoints when the request uses the TestHarness role-credentials)."
              - "Actor: `X-User-Role=TestHarness, X-User-ID=test-runner-1` (an opaque test-runner-identifier per the §1.7 TestHarness identity:opaque convention)."
              - "Two-positive-cases (the ALLOW cells): POST /v1/_clock/advance with body {advance_seconds:60, run_sweep_after_advance:false} and POST /v1/_sweep/run with body {scope:'ALL'}. Both should succeed."
              - "Negative-cases (a representative sample of the 35-DENY cells in the TestHarness column): POST /v1/companies, GET /v1/companies, POST /v1/permits/{some-permit-id}/issue, POST /v1/trips/{some-trip-id}/gps-reports, GET /v1/permits/{some-permit-id}, GET /v1/drivers/{some-driver-id}/penalty-summary. All six should return HTTP 403 with ERR_ROLE_NOT_PERMITTED. (The implementation may also return ERR_UNAUTHENTICATED 401 if the production-vs-test deployment-mode is the production-disable case where the TestHarness role-name is unrecognized — the test's-environment is the test-mode where the role is recognized but the per-endpoint allow-set excludes it. The spec's pin is: in test-mode the role-is-recognized-and-rejected-on-the-allow-set-check, in production the role-is-unrecognized-at-the-auth-tier. The test layer asserts the test-mode behavior, where the response is the 403-ERR_ROLE_NOT_PERMITTED across the 35-DENY cells.)"
            trigger:
              - "The six-or-eight requests, both positive and negative, with the TestHarness role-credentials. The positives should succeed; the negatives should fail with the 403-error-id matching the standard role-deny-cause."
            assert:
              - "POST /v1/_clock/advance with the body above: HTTP 200, response.data.new_now is the clock's-pre-advance-now-plus-60-seconds. The wall-clock's-advance is the test-harness's-load-bearing capability."
              - "POST /v1/_sweep/run: HTTP 200, response.data.scope=='ALL', the response's-shape matches the §1.5 sweep-endpoint's-response-schema with the permit_transitions-and-driver_recomputes summary-lists. The sweep's-execution on the test-fixture's-database produces whatever transitions are due-at-the-current-now (which is the pre-advance plus 60 seconds — generally not enough to expire any permit unless the fixture's-valid_until-is-within-60-seconds, which a deliberately-positioned-fixture can arrange to test the sweep's-firing-on-the-clock-advance's-just-tipped-the-boundary case)."
              - "POST /v1/companies (a negative case): HTTP 403, response.data.error_id == 'ERR_ROLE_NOT_PERMITTED'. The role-allow-set on /v1/companies is {CompanyOperator}; TestHarness is not in it. The priority-200 check fires the generic role-deny."
              - "GET /v1/companies: HTTP 403, ERR_ROLE_NOT_PERMITTED. The list endpoint's-allow-set is {CompanyOperator, RegulatorOfficer}; the TestHarness isn't in it."
              - "POST /v1/permits/<id>/issue: HTTP 403, ERR_ROLE_NOT_PERMITTED. The issue's-allow-set is {RegulatorOfficer}; TestHarness isn't there."
              - "POST /v1/trips/<id>/gps-reports: HTTP 403, ERR_ROLE_NOT_PERMITTED. The gps-ingest's-allow-set is {CompanyOperator}."
              - "GET /v1/permits/<id>: HTTP 403, ERR_ROLE_NOT_PERMITTED. The read's-allow-set is {CompanyOperator, RegulatorOfficer}."
              - "GET /v1/drivers/<id>/penalty-summary: HTTP 403, ERR_ROLE_NOT_PERMITTED. The summary's-allow-set is {CompanyOperator, RegulatorOfficer, Driver}; TestHarness isn't there."
              - "The aggregate observable is the column-shape on the TestHarness role: two-ALLOW (the test-endpoints) and all-else-DENY-with-the-role-mismatch-error-id. The deviation-cell signature is the two-ALLOW-among-the-35-DENY, the smallest non-empty allow-cluster across the four-role-columns. The test confirms the matrix's-shape-conformance for the TestHarness column."
              - "Cross-cutting observation that the test-harness's-operations don't leak the role's-credentials to the regular endpoints: the test-harness's-clock-advance does change the global now() that the regular endpoints observe (the clock is a system-wide singleton, not per-role), so a subsequent regular-endpoint request from a CompanyOperator or RegulatorOfficer observes the advanced-clock-value in the response's timestamps. The TestHarness role's-effects are observable through the regular endpoints' time-sensitive responses, even though the TestHarness role can't itself hit those regular endpoints. The bidirectional-asymmetry (TestHarness writes the clock that the others read; the others' actions don't affect the TestHarness's-write-permissions on the clock-endpoint) is the test-machinery's-clean-separation-of-concerns."

    # Orchestrator-added supplemental: GPS-stream invariants beyond the
    # rule-8 overlap-B monotonicity (the idempotency-key replay vs
    # rejection, the auto-penalty side-effect on violation samples, the
    # suspension-gates-the-stream-but-not-the-trip invariant).
    gps_stream_invariant:
      instances:

        - name: idempotency_key_replay_with_identical_body_returns_original_response_no_double_write
          invariant: "Two POST /v1/trips/{tid}/gps-reports requests with the same `Idempotency-Key` header value and *byte-for-byte identical* request bodies produce the same response (the second is a replay of the first's 201 response, with the same gps_report.id in the data payload), and the on-disk GPSReport-table-row-count for the trip increments by exactly 1 (not 2). The driver's-auto-penalty-cascade from the GPS-classification's-violation-flag is also non-duplicated: if the first request's body triggers an auto-penalty, the second-replayed request's response carries the same auto_penalty_ids list (one-element-array), not a separate just-inserted second auto-penalty's-id (which would be a duplicate-disciplinary-event-on-the-same-physical-driving-incident, undesirable). The idempotency-slot's-stored-response-body is the canonical-replay-target."
          grounds:
            - "the §1.0 manifest's idempotency block (the key_header='Idempotency-Key', scope='POST /v1/trips/{trip_id}/gps-reports', the replay-semantics-prose)"
            - "the §1.5 GPS-ingest endpoint's-prose on the response's replayed: true meta-flag-on-the-replay-case (which the response carries in the response's `meta` envelope, not in the data-payload)"
            - "the §1.2.1 concurrency-rule for the same-Idempotency-Key with the same-body across two concurrent requests's first-writer-wins-on-the-slot and the second-as-replay path"
            - "entities.GPSReport.idempotency_key field (the on-row's audit-record of the slot's-key, null when the header is absent on the original request)"
            - "the auto-penalty-cascade's idempotency-companion: the auto_penalty_ids array on the replayed response equals the original's array (no new penalty-row is created on the replay's-no-op-write)"
          distinguishing_aspect: |
            The replay-with-identical-body case's at-most-once-semantics on the on-disk
            row-count is the canonical-idempotency observable. The implementation's-slot-lookup-
            and-body-hash-comparison-mechanism is the back-end machinery; the API-surface's-
            observable is the response-equality and the database-row-count-not-doubling. The
            replay-flag in the response's meta-envelope (the §1.5 GPS-ingest's-response-prose's
            "a `replayed: true` flag in the meta block on the replay case") is the third observable
            that distinguishes the original-write from the replay's-no-op-write. The auto-penalty's-
            cascade-non-duplication is the cross-aggregate aspect — the idempotency-of-the-gps-
            insert flows through the entire cascade-chain (rule-4-cascade-A's-hops-1-2-3-4 are
            all the original's-effect-not-duplicated on the replay).
          test_recipe:
            setup:
              - "Fixture: an ACTIVE permit, an IN_TRANSIT trip trip-idem-1 with no GPS reports yet. The driver's-pre-call current_rolling_points is 0."
              - "The Idempotency-Key string for the test is 'gps-idem-test-key-aaaaaaa' (a 24-character string, in the constants_numeric_values.IDEMPOTENCY_KEY's 8-128 char range)."
              - "The body's content is the same JSON across the two requests: `{reported_at: now+1s, lat: 31.2, lon: 121.5, speed_kph: 70.0 (below MAX so no auto-violation), heading_deg: 90.0}`. The body's-byte-equality is the implementation's-hash-comparison's-input."
              - "Variant case (the violation-replay-no-double-penalty observation): a second pair-of-requests with speed_kph=90.0 (which is > MAX_HAZMAT_SPEED_KPH=80.0, triggering the speed-violation classification's-flag, which on the first request inserts a Penalty row with points_value=GPS_VIOLATION_SPEED_POINTS=3). The second request (the replay) must not insert a second Penalty row. The auto_penalty_ids array in both responses has exactly the same single id."
            trigger:
              - "Base case: two POST /v1/trips/trip-idem-1/gps-reports requests in sequence, both with header `Idempotency-Key: gps-idem-test-key-aaaaaaa` and the identical body. The second request must be sequentially-after the first's-commit so the slot exists for the replay-lookup."
              - "Variant case: the same two-request-sequence, but with the violating speed_kph and a different Idempotency-Key for the variant's-isolation ('gps-idem-test-key-bbbbbbb'). The second variant's request is the replay of the first variant's-request which carried the violation."
              - "Negative case (the related ERR_IDEMPOTENCY_KEY_REUSED concurrency-rule's-observable): a third Idempotency-Key 'gps-idem-test-key-cccccccc' with the *first* request's body being the standard non-violating body, and the *second* request reusing the same key but with a different reported_at value (a different body). The second's-body-hash differs from the slot's-stored-hash, so the response is the 409-ERR_IDEMPOTENCY_KEY_REUSED rather than the replay."
            assert:
              - "Base case, first request's response: HTTP 201, response.data.id is some-UUID-call-it-G1, response.data.idempotency_key='gps-idem-test-key-aaaaaaa', response.meta has no `replayed` field (or has `replayed: false` — the implementation's-choice; the spec's prose says the original-non-replay-response doesn't have the replayed-flag-set-to-true). The on-disk-table has one new GPSReport row with id=G1."
              - "Base case, second request's response: HTTP 201 (same status as the original — the replay returns the same status, not a 200 or a 304-Not-Modified-which-some-idempotency-conventions-use-but-the-scaffold's-pin-is-201). response.data.id is G1 (the same UUID as the first's-response). response.meta.replayed = true (the meta-envelope's replay-flag is the discriminator-of-the-replay-vs-original). The on-disk-table's row-count for the trip is *still 1* — the second request didn't insert a second row."
              - "Variant case, first request (with the speed-violation): HTTP 201, the response's-data includes auto_penalty_ids=[<the-auto-penalty's-id-call-it-P1>] (one auto-penalty for the speed-violation). The driver's current_rolling_points is incremented by GPS_VIOLATION_SPEED_POINTS=3, becoming 3. The GPS-row is inserted with auto_penalty_ids=[P1] on it. The Penalty-row P1 is inserted with source='GPS_VIOLATION_SPEED', subject_type='DRIVER', subject_id=the trip's driver_id, points_value=3, source_gps_report_id=G2 (the variant's-first-GPS-row's-id). The cascade-onto-the-driver is single-fire."
              - "Variant case, second request (the replay of the violation-request): HTTP 201, response.data.id=G2 (the same as the first variant request's-id), response.data.auto_penalty_ids=[P1] (the same one-element-array, not [P1, P2]), response.meta.replayed=true. The driver's current_rolling_points is *still 3*, not 6 — the replay's-no-op-write didn't trigger a duplicate-penalty-cascade. The Penalty-table's row-count for the driver in the test's-rolling-window is 1, not 2. The auto-penalty's-id P1 is unchanged in its content; the replay didn't mutate it."
              - "Negative case (the same-key-different-body rejection): the third-test's first request succeeds with HTTP 201. The second request, carrying the same Idempotency-Key 'gps-idem-test-key-cccccccc' but a different body (different reported_at), is rejected with HTTP 409, response.data.error_id == 'ERR_IDEMPOTENCY_KEY_REUSED'. The on-disk-state is unchanged by the rejection (the original-first-request's row is the only one in the third-test's-key's-slot, and the second's-divergent-body's-attempted-insert is rejected wholesale, no partial-state-change). The trip's latest_gps_at is the first request's reported_at, unchanged by the second's-rejection."
              - "Cross-replay-key-isolation observable: the three test-cases' Idempotency-Keys are distinct ('aaaaaaa', 'bbbbbbb', 'cccccccc'), so the three slots are independent. A request with key 'aaaaaaa' doesn't interact with the slot for 'bbbbbbb' or 'cccccccc'. The per-trip-and-per-key slot-scope is the §1.0 idempotency-prose's-per-trip-and-per-key compound-key on the slot-store. Two different trips reusing the same key-string have independent slots (the slot is keyed by (trip_id, idempotency_key) per the §1.0 idempotency-prose)."

        - name: gps_violation_classification_auto_penalty_is_atomic_with_the_gps_insert
          invariant: "Every GPSReport row whose body's `speed_kph > MAX_HAZMAT_SPEED_KPH` triggers the §1.3 calc-4 gps_violation_classification's-speed_violated-flag-being-true, which in the §1.5 GPS-ingest endpoint's-side-effect-block inserts an auto-Penalty row in the *same database transaction* as the GPSReport's-insert. The atomicity-of-the-pair guarantees that no GPS-row exists without its corresponding auto-Penalty (and vice versa — no auto-Penalty exists without the originating GPS-row). The cross-reference fields on the two rows mirror each other: the GPSReport's `auto_penalty_ids` array contains the Penalty's id, and the Penalty's `source_gps_report_id` field contains the GPSReport's id. The atomicity is observable via the on-disk-state being either (both-rows-present, both-cross-references-set) or (neither-present, the gps-ingest's-transaction-rolled-back-on-some-other-validation-failure). The §1.4 priority-509-and-512 checks fire *before* the gps-ingest's-write-side-effect, so a rejected GPS-write doesn't have a dangling Penalty row. The atomicity is the GPS-stream's-invariant-of-paired-rows-on-violation."
          grounds:
            - "calculations.gps_violation_classification (the speed_violated and off_route_violation flags' computation on the new GPS sample)"
            - "the §1.5 POST /v1/trips/{tid}/gps-reports's-side-effect-block listing the conditional-auto-Penalty-insert on each true flag (the two flags are independent — a sample can be both speed-violating and off-route, giving two auto-Penalties in the same insert-transaction)"
            - "entities.GPSReport.auto_penalty_ids (the GPS-row's-array-of-the-paired-Penalty-ids, length 0/1/2 depending on the flags)"
            - "entities.Penalty.source_gps_report_id (the Penalty-row's-back-pointer to the originating GPS-row)"
            - "entities.Penalty.trip_id (the trip-context-of-the-violation, equal to the GPS-row's-trip-id by construction)"
            - "the cascade onto the driver's `current_rolling_points` and the threshold-crossing's-flip-of-the-driver's-hazmat_endorsement_status, all in the same transaction (rule-4-cascade-A's first three hops are atomic-with-the-gps-ingest's-transaction)"
            - "constants_numeric_values.MAX_HAZMAT_SPEED_KPH=80.0, OFF_ROUTE_RADIUS_M=500.0, GPS_VIOLATION_SPEED_POINTS=3, GPS_VIOLATION_OFF_ROUTE_POINTS=4"
            - "calculations.gps_violation_classification.constants.EARTH_RADIUS_M=6371000.0 (the haversine-segment's-Earth-radius-constant)"
          distinguishing_aspect: |
            The atomicity-of-the-gps-and-auto-penalty pair is a transactional invariant
            on the database's-write-set, observable through the on-disk cross-reference-
            consistency: a GPS-row's `auto_penalty_ids` array's-ids each resolve to a
            Penalty-row, and each such Penalty-row's `source_gps_report_id` points back
            at the GPS-row. The transactional-atomicity-with-the-driver-cache-update
            (the rule-4-cascade-A's-hop-2-of-the-driver-points-recompute-and-the-
            threshold-check-flip-of-the-status) is also part of the same transaction.
            The rule-4-cascade-A's-hop-3 (the cross-aggregate cascade onto the Permit
            row) is *not* in the same transaction — it's the deferred-flush onto the next
            verify-compliance call. So the gps-ingest's-write-set is exactly:
            (GPSReport-row, possibly-zero-one-or-two-Penalty-rows, the Driver-row's-
            updated current_rolling_points-and-possibly-flipped-hazmat_endorsement_status,
            the Trip-row's-latest_gps_at-and-gps_violation_count-fields-updated, and
            the per-trip-idempotency-slot's-record-of-this-request). The Permit-row is
            *not* in the gps-ingest's write-set — it's touched by the subsequent verify-
            compliance call. This transactional-boundary-pin is the §1.5 prose's
            atomicity-clause.
          test_recipe:
            setup:
              - "Fixture: an ACTIVE permit pm-gps-atomic-1 with an IN_TRANSIT trip trip-gps-atomic-1 on a vehicle veh-gps-atomic-1 with the standard valid-driver-and-route setup. The driver's-pre-call current_rolling_points is 9 (close-but-not-at the threshold of 12, set via fixture's-pre-issued penalties of points summing to 9). The driver's hazmat_endorsement_status is VALID. The trip's latest_gps_at is some prior-sample's-reported_at value T_prev. The trip's gps_violation_count is the count of prior auto-Penalties on this trip (zero in the fixture)."
              - "Case clean (no-violation): the body's speed_kph=70.0 (below MAX), the lat/lon is on the route's-polyline so off_route_distance_m < OFF_ROUTE_RADIUS_M (no off-route violation). The expected auto_penalty_ids is the empty array — neither flag's true."
              - "Case speed-only (speed-violation, no off-route): body's speed_kph=95.0 (>MAX), lat/lon on-route. The expected auto_penalty_ids has one entry — the speed-Penalty's id."
              - "Case off-route-only (no speed but off-route): body's speed_kph=70.0 (below MAX), lat/lon a kilometer off the route's-polyline (off_route_distance_m=1000m, which is > OFF_ROUTE_RADIUS_M=500m). The expected auto_penalty_ids has one entry — the off-route-Penalty's id."
              - "Case both (speed AND off-route, two auto-Penalties): body's speed_kph=95.0 and lat/lon a kilometer off-route. The expected auto_penalty_ids has two entries — one for the speed-violation (points_value=3, source='GPS_VIOLATION_SPEED'), one for the off-route-violation (points_value=4, source='GPS_VIOLATION_OFF_ROUTE'). The driver's-cache is incremented by 3+4=7, bringing the post-call rolling-total from 9 to 16, which crosses the threshold of 12 and fires the §1.2 Driver VALID→INVALID auto-transition in the same transaction (the rule-4-cascade-A's hops 1-and-2-and-3 fire atomically). The driver's-row's-post-call state has hazmat_endorsement_status='INVALID' and current_rolling_points=16."
              - "Negative case (validation failure that aborts the whole gps-write before the auto-penalty-insert fires): a request with reported_at < the trip's latest_gps_at (the monotonicity violation, ERR_GPS_OUT_OF_ORDER per §1.4 priority-512). The validation fires before the classifier's-flag-evaluation and the auto-penalty-insert-side-effect, so the request is rejected with HTTP 409 and *no* GPS-row, *no* Penalty-row, and *no* driver-cache-update occurs. The transaction is rolled-back-or-never-started. This is the gating-by-priority-509-and-512-before-the-side-effects pattern, the atomicity's-failure-mode being the all-or-nothing-non-write."
            trigger:
              - "Four POST /v1/trips/trip-gps-atomic-1/gps-reports requests in sequence, with the four bodies above (clean, speed-only, off-route-only, both). Each request's reported_at is strictly-greater-than the previous request's-reported_at (the strict-monotonicity-rule on the same stream means the four samples must be in increasing-reported_at order). The Idempotency-Key headers are absent across the four (the per-request-uniqueness is by-construction since the bodies differ). Then a fifth request with reported_at less than the most-recent-cursor, exercising the negative-case-rollback observation."
            assert:
              - "Case clean's response: HTTP 201, response.data.id=some-UUID G_clean, response.data.auto_penalty_ids=[] (empty array), response.data.cascade_summary.current_rolling_points=9 (unchanged from the pre-call value), response.data.cascade_summary.hazmat_endorsement_status='VALID' (unchanged). The trip's-post-clean-call latest_gps_at is the clean's-reported_at. The trip's gps_violation_count is unchanged at 0."
              - "Case speed-only's response: HTTP 201, response.data.auto_penalty_ids=[P_speed] (one id). The driver's-cache becomes 9+3=12, which equals the threshold and fires the VALID→INVALID flip (rule-6's-boundary-A's exact-equal-fires case). The response's cascade_summary.hazmat_endorsement_status='INVALID' and current_rolling_points=12. The trip's gps_violation_count is now 1."
              - "GET /v1/drivers/{driver_id}/penalty-summary after the speed-only case: response.data.active_penalties_in_window contains the speed-Penalty P_speed with source='GPS_VIOLATION_SPEED', points_value=3, trip_id=trip-gps-atomic-1's-id, source_gps_report_id=G_speed (the GPS-row's-id of the violation sample), observed_at=the violation-sample's reported_at. The summary's-row's-back-pointer-fields match the gps-row's-forward-pointer field — the cross-reference's bidirectional-consistency is observable."
              - "Cases off-route-only and both: similar shape, with the off-route-Penalty P_offroute having source='GPS_VIOLATION_OFF_ROUTE' and points_value=4. The 'both' case has both Penalties P_speed_2 and P_offroute_2 (the second-generation ones from the both-case's GPS row), with the GPS-row's auto_penalty_ids array having both ids. The driver's-cache after the off-route-only case is 12+4 = 16 (still INVALID), and after the both-case is 16+3+4=23 (still INVALID; the status-flip is non-idempotent in the sense that the status stays at INVALID across further-additions-while-already-INVALID)."
              - "The actual numerical literal-values are: pre-call points 9, post-clean points 9, post-speed-only points 12 (and the at-threshold flip-fires), post-off-route-only points 16, post-both points 23. The post-both case's two new Penalty rows' points are 3 and 4, summing to 7, matching the cache-increment from 16 to 23. The arithmetic is integer-bit-exact."
              - "Negative case's response: HTTP 409, response.data.error_id == 'ERR_GPS_OUT_OF_ORDER'. The on-disk row-count for the trip's GPS-stream is unchanged after the negative case (the rejection's-transaction wasn't committed). The driver's-cache is unchanged (no auto-penalty-insert fired). The atomicity's-failure-mode is the no-partial-write all-or-nothing-rejection. The Trip's-row's latest_gps_at-cursor is unchanged (the cursor only advances on accepted writes, never on rejected ones)."
              - "Cross-reference consistency check across the four committed GPS-rows: for each of the four GPS-rows G_clean, G_speed, G_offroute, G_both, and for each id-in-the-row's auto_penalty_ids, the corresponding Penalty-row's source_gps_report_id field equals the GPS-row's id. The forward-and-backward pointers between the paired-rows match. The Penalty's trip_id field equals trip-gps-atomic-1's id, and the GPS-row's trip_id equals the same (the trip-context is shared). The audit's-traceability is the atomicity's-positive-side observable."
              - "The §1.4 priority-pre-side-effect-checks observable: the request is gated by the in-window-check (509), the monotonicity-check (512), and the permit-not-active-check (515) before the calc-4's classifier and the auto-penalty-insert fire. The negative case exercises the priority-512's-rejection. A separately-fabricated permit-suspended fixture's-request would exercise the priority-515's-rejection on the same gps-ingest endpoint, the priority-515 firing after the 509-and-512-but-before-the-side-effect-write-block, matching the §1.4 prose's-ordering pin and the rule-5-conflict-C's same-tier-sub-priority observable on the GPS endpoint."

        - name: permit_suspension_gates_the_gps_stream_but_does_not_abort_the_in_flight_trip
          invariant: "When a Trip's parent Permit's `lifecycle_status` is SUSPENDED (the §1.2 Permit-state-transition ACTIVE→SUSPENDED's-firing on a grounding-entity-disagreement-on-the-verify-compliance), the trip's-trip_status is *not* automatically changed — the trip stays in whatever state it was in (PLANNED, IN_TRANSIT, or terminal). The gating effect of the suspension is on the *GPS-ingest endpoint's-acceptance*: any POST /v1/trips/{tid}/gps-reports on a trip whose parent permit is non-ACTIVE returns the priority-515 ERR_PERMIT_NOT_ACTIVE 409, but the trip's-row-state on the on-disk-trip-table is unchanged. The trip's-arrive endpoint, however, *is* permitted on a SUSPENDED-parent (the §1.5 arrive's-prose admits the operator's-delivery-attestation regardless of the parent's-suspension), so a SUSPENDED-parent trip can wind-down to COMPLETED through the operator's-arrive-call without ever being aborted. The depart endpoint on a PLANNED-trip with a SUSPENDED-parent is rejected (priority-400-or-515 depending on the tier-interpretation; the §1.2 transition-guard's-conjunction-evaluation-order-pin in the §1.4 prose puts the parent-state-check first). The asymmetry-of-the-three-trip-actions-relative-to-the-parent-suspension is: depart-rejected, arrive-permitted, gps-rejected. The §1.2 SUSPENDED-state's-prose pins this asymmetry as 'a transient suspension can resolve without killing the in-flight trip, but the data-stream is paused for the duration'."
          grounds:
            - "state_machines.Permit.lifecycle_status's SUSPENDED-state's-prose in the §1.2 entries (the non-cascade-onto-trips rationale)"
            - "state_machines.Trip's lack-of-an-auto-transition-on-parent-suspension (the §1.2 Trip-state-transitions list does not include a SUSPENDED-permit-fired trip-transition; the only auto-cascade onto trips fires on the EXPIRED and VOIDED parent-transitions)"
            - "validations[priority=515] (the ERR_PERMIT_NOT_ACTIVE on the gps-ingest's-parent-state-check)"
            - "the §1.5 prose on the arrive-action's allowance under a SUSPENDED-parent and the depart-action's rejection"
            - "the rule-3 Permit-cycle's worked-example, which is the upstream-cause-of-the-suspension scenario"
            - "the asymmetric-three-actions-relative-to-the-parent-state observable: depart-checks-the-parent, arrive-doesn't-check-the-parent, gps-ingest-checks-the-parent"
          distinguishing_aspect: |
            The invariant is the *non-cascade* of the suspension onto the trip's-state,
            in contrast with the *cascade* of the expiry and the void-issue onto the trip's-
            state (the EXPIRED and VOIDED transitions on the Permit fire the per-trip-abort-
            cascade per the §1.2 prose's-side-effect-blocks). The three-permit-terminal-or-
            non-terminal-states have different cascade-behaviors onto the child trips:
            ACTIVE (the trip operates normally), SUSPENDED (the trip's data-stream is gated
            but the trip's-state is preserved), EXPIRED (the trip is cascade-aborted),
            VOIDED (the trip is cascade-aborted with the same abort_reason discriminator
            as the suspension-cascade per the §1.2 enum-economy note — even though the
            suspension-cause doesn't actually abort the trip in this scaffold, the enum
            value PERMIT_SUSPENDED_CASCADE is used for the void's-cascade-aborts; the
            naming-overlap is the §1.2 prose's note for the doc-generator's-narration-
            of-the-cause-vs-the-enum-name dichotomy). The four-state-on-the-parent-times-
            three-actions-on-the-trip-times-three-permit-states-affecting-the-trip-action-
            response table is the full-behavioral-matrix of the parent-permit-state-vs-
            the-trip-action-acceptance question, and the §1.2-and-§1.5-prose pin each
            cell's-expected-behavior.
          test_recipe:
            setup:
              - "Fixture: a trip trip-suspension-invariant-1 in IN_TRANSIT on a parent ACTIVE permit pm-suspension-invariant-1. The trip's actual_departure_at is some prior moment; the trip's latest_gps_at is the most-recent-prior-GPS-sample's-reported_at. The driver's status is VALID at this initial moment."
              - "Pre-suspension baseline: a sanity-test POST /v1/trips/trip-suspension-invariant-1/gps-reports succeeds (HTTP 201, the standard accept-path), confirming the GPS-stream is open."
              - "Action (the upstream-cause-of-the-suspension): the regulator's revoke of the trip's driver's-endorsement (or any other grounding-entity-flip that the verify-compliance will observe). Then POST /v1/permits/pm-suspension-invariant-1/verify-compliance fires the ACTIVE→SUSPENDED transition. The permit's-on-disk lifecycle_status is now 'SUSPENDED'."
              - "Post-suspension state-observation: GET /v1/trips/trip-suspension-invariant-1 returns the trip's-row, which has trip_status='IN_TRANSIT' *unchanged*. The actual_departure_at is unchanged, the aborted_at is null, the latest_gps_at is the pre-suspension-cursor-value. The trip's-row is untouched by the parent's-suspension — the non-cascade invariant's-on-disk observable."
              - "Three test-actions on the SUSPENDED-parent trip, exercising the three distinct trip-action endpoints:"
              - "Action depart (which would apply to a PLANNED-trip; here the fixture's-trip is already IN_TRANSIT so the depart's-precondition `trip_status==PLANNED` fails before the parent-permit-state-check fires, per the §1.2 transition-guard's-conjunction-evaluation-order in the §1.4 prose's priority-400-discussion. To exercise the parent-permit-state-check on the depart specifically, the test-fixture's-needs is a *different* trip on the same permit, this one in PLANNED state, which the fixture-helper creates as trip-suspension-invariant-planned-2). The PLANNED-trip on the SUSPENDED-parent's depart-attempt: the §1.2 PLANNED→IN_TRANSIT's-conjunction-guard's-parent-state-check fails (the parent is SUSPENDED, not ACTIVE), the depart is rejected with ERR_PERMIT_NOT_ACTIVE 409. The PLANNED-trip's-trip_status stays PLANNED."
              - "Action gps-ingest on the IN_TRANSIT-trip-on-the-SUSPENDED-parent: POST /v1/trips/trip-suspension-invariant-1/gps-reports. The validation's-priority-515 ERR_PERMIT_NOT_ACTIVE fires (the in-window-check at 509 passes if the body's reported_at is in the trip's-still-open-window which it is, the monotonicity-check at 512 passes if the reported_at is strictly-greater-than the cursor, and then the parent-state-check at 515 fails). The response is HTTP 409 with ERR_PERMIT_NOT_ACTIVE. The GPS-row is not written; the trip's-cursor latest_gps_at is unchanged."
              - "Action arrive on the IN_TRANSIT-trip-on-the-SUSPENDED-parent: POST /v1/trips/trip-suspension-invariant-1/arrive with body {arrive_note:'Delivery-attested-mid-suspension'}. The §1.5 arrive-endpoint's-prose's-precondition-set is `trip_status==IN_TRANSIT AND ownership AND parent_permit.lifecycle_status in {ACTIVE, SUSPENDED}`. The SUSPENDED is in the allowed-set on the arrive's-precondition, so the action succeeds. The trip transitions IN_TRANSIT→COMPLETED with actual_arrival_at=the call's-now. The wind-down of the trip is admitted under the parent's-suspension. The trip's COMPLETED state is terminal, after which the gps-ingest endpoint returns the standard ERR_GPS_OUT_OF_WINDOW (the trip's-window-right-edge has closed)."
            trigger:
              - "The four-action sequence above: depart-attempt-on-the-planned-companion (which fails with the parent-state error), gps-ingest-on-the-in-transit-original (which fails with the parent-state error), and arrive on the in-transit-original (which succeeds). The verify-compliance was the prior step that armed the suspension. Each action's-response is the test's observable."
            assert:
              - "Pre-suspension baseline gps-ingest: HTTP 201 (accepted, the parent-permit was still ACTIVE at the moment of the call). The cursor advances to the body's reported_at."
              - "The verify-compliance's response: transition_fired='ACTIVE_TO_SUSPENDED'. The permit's-on-disk-state is now SUSPENDED."
              - "The post-suspension GET /v1/trips/trip-suspension-invariant-1: trip_status='IN_TRANSIT', unchanged. The trip's-other-fields (actual_departure_at, latest_gps_at, gps_violation_count, the standard common-fields) are also unchanged from the pre-suspension values. The non-cascade-onto-the-trip-state is the load-bearing observable of the §1.2 SUSPENDED-state's-prose's-explicit non-cascade-onto-the-children-trips clause."
              - "The depart-attempt on the PLANNED-companion trip-suspension-invariant-planned-2: HTTP 409, response.data.error_id == 'ERR_PERMIT_NOT_ACTIVE'. The trip stays in PLANNED state. The actual_departure_at remains null."
              - "The gps-ingest attempt on the IN_TRANSIT trip-suspension-invariant-1: HTTP 409, response.data.error_id == 'ERR_PERMIT_NOT_ACTIVE'. The cursor latest_gps_at is unchanged; no GPS-row is written; no auto-penalty-cascade fires. The trip's gps_violation_count is unchanged."
              - "The arrive on the IN_TRANSIT trip: HTTP 200. The response's data is the trip's-updated row with trip_status='COMPLETED' and actual_arrival_at = the call's-now. The arrive's-acceptance-under-the-parent-suspension is the asymmetry-observable: the GPS-stream is gated but the arrival-attestation is admitted. The §1.5 arrive's-prose's-precondition-set's-inclusion-of-the-SUSPENDED-state is the pin."
              - "After the arrive, a follow-up gps-ingest on the now-terminal trip returns the standard ERR_GPS_OUT_OF_WINDOW (HTTP 409, error_id='ERR_GPS_OUT_OF_WINDOW' from the priority-509 in-window-check that observes the trip's-arrived-state-closes-the-window). The error_id is different from the pre-arrive ERR_PERMIT_NOT_ACTIVE: the post-arrival-cause-of-rejection is the trip's-terminal-state, not the parent-permit's-suspension-state. The cause-discrimination on the two-different-error-ids on the gps-ingest endpoint distinguishes the pre-arrival-during-suspension case from the post-arrival case. The single-endpoint's-three-causes-of-409 (the in-window, the monotonicity, the parent-state) are all observable across the various trip-state and parent-permit-state combinations."
              - "Cross-check with the EXPIRED-permit's-cascade-abort (the rule-4-cascade-B's-instance which DOES cascade onto the trips): a separate fixture has an ACTIVE permit pm-expiry-cascade-comparison-1 with an IN_TRANSIT trip. The clock advances past the permit's valid_until; the sweep fires the ACTIVE→EXPIRED transition; the §1.2 ACTIVE→EXPIRED side-effect-block's-trip-cascade fires the trip-abort cascade synchronously. The trip's-post-sweep-state is trip_status='ABORTED', abort_reason='PERMIT_EXPIRED_CASCADE', aborted_at=the sweep's-now. The EXPIRED-parent's-cascade-onto-the-trip's-state is the contrast with the SUSPENDED-parent's non-cascade. The two-different-parent-state-events-cause-different-child-state-outcomes is the comparison the rule-3-and-rule-4 worked-examples' setup-difference encodes; this gps_stream_invariant's-instance focuses on the SUSPENDED-side's-non-cascade as the observable."
              - "The wallet is unchanged across all the actions in the SUSPENDED-state scenario — the suspension is a temporary-loss-of-the-fee's-payment-authority's-effects on the data-stream-and-the-depart-action, but it doesn't trigger any refund or fee-event. The rule-9-A's-currency-conservation's-equation is unaffected by the suspension cycle (the wallet's-pre-suspension-balance equals the wallet's-post-suspension-balance equals the wallet's-after-the-arrive-balance, because no fee fired on any of the three observation points). Only the void-issue's-explicit compensating-action moves the wallet's-balance in the conserving-direction."

