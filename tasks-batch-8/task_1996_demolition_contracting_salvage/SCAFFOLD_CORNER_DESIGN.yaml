# =============================================================================
# Task 1996: Demolition Contracting & Salvage — §1.9 Scaffold Corner Design
# Breadth coverage of every §1.1–§1.7 claim not already probed by §1.8.
# Sections/claim_types follow references/claim-extraction-guide.md.
# =============================================================================

scaffold_corner_design:
  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: project_create_applies_defaults
        claim_type: defaults
        grounds: [entities.Project.fields.status, entities.Project.fields.work_posture, entities.Project.fields.required_diversion_rate]
        distinguishing_aspect: "Omitting optional fields on create yields status DRAFT, work_posture WORKABLE, required_diversion_rate 0.5, all tonnage counters 0, version 1."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - { call: "POST /demolition/projects", payload: { name: "Defaults", address: "2 Pine St", lot_area_sqft: 12000 }, as: ContractorAdmin, captures: { p_id: $.data.id, p_st: $.data.status, p_wp: $.data.work_posture, p_req: $.data.required_diversion_rate, p_it: $.data.in_transit_tons, p_v: $.data.version } }
          trigger: []
          assert:
            - "${p_st} == DRAFT and ${p_wp} == WORKABLE"
            - "${p_req} == 0.5 (default applied)"
            - "${p_it} == 0 and landfill/diverted/removed tons all 0; diversion_tier == STANDARD"
            - "${p_v} == 1"

      - name: survey_create_missing_required_label_rejected
        claim_type: required_fields
        grounds: [entities.StructureSurvey.fields.structure_label, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST structure-surveys without structure_label fails ERR_VALIDATION (400); survey_type default INITIAL applies when omitted."
        test_recipe:
          setup: ["Project exists."]
          setup_api_calls:
            - { call: "POST /demolition/projects", payload: { name: "Req", address: "4 Pine St", lot_area_sqft: 12000 }, as: ContractorAdmin, captures: { p_id: $.data.id } }
          trigger:
            - { call: "POST /demolition/projects/${p_id}/structure-surveys", payload: { survey_type: "ADDENDUM" }, as: Surveyor, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_VALIDATION"

      - name: project_create_computed_input_ignored
        claim_type: computed_fields
        grounds: [entities.Project.fields.diversion_rate, entities.Project.fields.cumulative_exposure_score]
        distinguishing_aspect: "Client-supplied computed fields (diversion_rate, cumulative_exposure_score) in the create payload are ignored; server computes them."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - { call: "POST /demolition/projects", payload: { name: "Computed", address: "6 Pine St", lot_area_sqft: 12000, diversion_rate: 0.99, cumulative_exposure_score: 500 }, as: ContractorAdmin, captures: { p_rate: $.data.diversion_rate, p_exp: $.data.cumulative_exposure_score } }
          trigger: []
          assert:
            - "${p_rate} == 0 and ${p_exp} == 0 (client values ignored)"

      - name: dust_log_is_immutable_event_entity
        claim_type: immutability
        grounds: [entities.DustNoiseLog]
        distinguishing_aspect: "DustNoiseLog has common_fields false: creation response carries id + created_at but no version/updated_at, and no update/transition endpoint exists for it."
        test_recipe:
          setup:
            - "Project DEMOLITION_ACTIVE (release chain: clean survey, confirmed ELECTRIC disconnect, ACTIVE permit 20000 sqft, pinned CERTIFIED engineering survey, notification delivered 2026-08-02T09:00:00Z, released 2026-08-05T09:00:00Z, START_DEMOLITION)."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: ContractorAdmin }
            - { call: "POST /demolition/projects", payload: { name: "Evt", address: "8 Pine St", lot_area_sqft: 30000 }, as: ContractorAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /demolition/projects/${p_id}/structure-surveys", payload: { structure_label: "Main" }, as: Surveyor, captures: { sv_id: $.data.id } }
            - { call: "POST /demolition/structure-surveys/${sv_id}/transition", payload: { action: "COMPLETE", hazmat_found: false, findings_summary: "clean" }, as: Surveyor }
            - { call: "POST /demolition/projects/${p_id}/utility-disconnects", payload: { utility_type: "ELECTRIC", provider_name: "City Power", disconnect_window_start: "2026-08-02T08:00:00Z", disconnect_window_end: "2026-08-02T12:00:00Z" }, as: UtilityCoordinator, captures: { ud_id: $.data.id } }
            - { call: "POST /demolition/utility-disconnects/${ud_id}/transition", payload: { action: "REPORT_DISCONNECTED" }, as: UtilityCoordinator, as_user_id: "ev-r-1" }
            - { call: "POST /demolition/utility-disconnects/${ud_id}/transition", payload: { action: "VERIFY" }, as: UtilityCoordinator, as_user_id: "ev-v-1" }
            - { call: "POST /demolition/utility-disconnects/${ud_id}/transition", payload: { action: "CONFIRM" }, as: UtilityCoordinator, as_user_id: "ev-c-1" }
            - { call: "POST /demolition/projects/${p_id}/permits", payload: { permit_number: "P-1", gross_floor_area_sqft: 20000 }, as: PermitCoordinator, captures: { pm_id: $.data.id } }
            - { call: "POST /demolition/permits/${pm_id}/transition", payload: { action: "SUBMIT" }, as: PermitCoordinator }
            - { call: "POST /demolition/permits/${pm_id}/transition", payload: { action: "APPROVE" }, as: AuthorityReviewer }
            - { call: "POST /demolition/permits/${pm_id}/transition", payload: { action: "ACTIVATE" }, as: PermitCoordinator }
            - { call: "POST /demolition/projects/${p_id}/engineering-surveys", payload: { demolition_method: "MECHANICAL", structural_stability_rating: "STABLE", max_structure_height_ft: 30, adjacent_structure_distance_ft: 40 }, as: StructuralEngineer, as_user_id: "ev-a-1", captures: { es_id: $.data.id } }
            - { call: "POST /demolition/engineering-surveys/${es_id}/transition", payload: { action: "SUBMIT" }, as: StructuralEngineer, as_user_id: "ev-a-1" }
            - { call: "POST /demolition/engineering-surveys/${es_id}/transition", payload: { action: "CERTIFY" }, as: PeerReviewEngineer, as_user_id: "ev-p-1" }
            - { call: "GET /demolition/projects/${p_id}", as: SiteSupervisor, captures: { p_v: $.data.version } }
            - { call: "POST /demolition/projects/${p_id}/engineering-pin", payload: { engineering_survey_id: "${es_id}", expected_project_version: "${p_v}" }, as: SiteSupervisor }
            - { call: "POST /demolition/projects/${p_id}/neighbor-notifications", payload: { address: "10 Pine St", notice_method: "POSTING", scheduled_delivery_date: "2026-08-02" }, as: SiteSupervisor, captures: { nn_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T09:00:00Z" }, as: ContractorAdmin }
            - { call: "POST /demolition/neighbor-notifications/${nn_id}/transition", payload: { action: "DELIVER" }, as: SiteSupervisor }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T09:00:00Z" }, as: ContractorAdmin }
            - { call: "POST /demolition/projects/${p_id}/release", payload: {}, as: SiteSupervisor }
            - { call: "POST /demolition/projects/${p_id}/transition", payload: { action: "START_DEMOLITION" }, as: SiteSupervisor }
          trigger:
            - { call: "POST /demolition/projects/${p_id}/dust-noise-logs", payload: { reading_type: "NOISE_DB", measured_value: 70, wind_speed_mph: 3, duration_hours: 1 }, as: EnvironmentalMonitor, captures: { lg_id: $.data.id, lg_at: $.data.recorded_at, lg_score: $.data.exposure_score } }
          assert:
            - "response has id and recorded_at == 2026-08-05T09:00:00Z (logical clock)"
            - "response has NO version and NO updated_at field (common_fields: false)"
            - "${lg_score} == 3.5 (70 * 0.5 * 1 / 10) and is_exceedance == false"

      - name: survey_create_under_not_found_project
        claim_type: not_found
        grounds: [entities.StructureSurvey.fields.project_id, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "Child creation under a non-existent project id fails ERR_NOT_FOUND (404) before any state logic."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - { call: "POST /demolition/projects/00000000-0000-0000-0000-000000000000/structure-surveys", payload: { structure_label: "X" }, as: Surveyor, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_NOT_FOUND"

      - name: notification_list_pagination_interaction
        claim_type: listing
        grounds: [response_envelope, entities.NeighborNotification]
        distinguishing_aspect: "limit/offset/total_count/has_more interact correctly: 3 notifications, limit=2 page 1 has_more true; offset=2 page 2 returns 1 row has_more false."
        test_recipe:
          setup: ["Project with 3 PENDING_DELIVERY notifications."]
          setup_api_calls:
            - { call: "POST /demolition/projects", payload: { name: "Page", address: "12 Pine St", lot_area_sqft: 12000 }, as: ContractorAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /demolition/projects/${p_id}/neighbor-notifications", payload: { address: "A1", notice_method: "CERTIFIED_MAIL", scheduled_delivery_date: "2026-08-03" }, as: SiteSupervisor }
            - { call: "POST /demolition/projects/${p_id}/neighbor-notifications", payload: { address: "A2", notice_method: "DOOR_HANGER", scheduled_delivery_date: "2026-08-03" }, as: SiteSupervisor }
            - { call: "POST /demolition/projects/${p_id}/neighbor-notifications", payload: { address: "A3", notice_method: "POSTING", scheduled_delivery_date: "2026-08-03" }, as: SiteSupervisor }
          trigger:
            - { call: "GET /demolition/projects/${p_id}/neighbor-notifications", payload: { limit: 2, offset: 0 }, as: SiteSupervisor, captures: { pg1_first: "$.data[0].address" } }
            - { call: "GET /demolition/projects/${p_id}/neighbor-notifications", payload: { limit: 2, offset: 2 }, as: SiteSupervisor, captures: { pg2_first: "$.data[0].address" } }
          assert:
            - "page 1: data.total_count == 3, data.has_more == true, exactly 2 rows, first row ${pg1_first} == A1 (created_at ASC)"
            - "page 2 (offset=2): exactly 1 row (${pg2_first} == A3), data.has_more == false"

      - name: utility_create_invalid_enum_rejected
        claim_type: type_constraints
        grounds: [entities.UtilityDisconnect.fields.utility_type, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "utility_type PROPANE is not a declared enum member -> ERR_VALIDATION."
        test_recipe:
          setup: ["Project exists."]
          setup_api_calls:
            - { call: "POST /demolition/projects", payload: { name: "Enum", address: "14 Pine St", lot_area_sqft: 12000 }, as: ContractorAdmin, captures: { p_id: $.data.id } }
          trigger:
            - { call: "POST /demolition/projects/${p_id}/utility-disconnects", payload: { utility_type: "PROPANE", provider_name: "X", disconnect_window_start: "2026-08-03T08:00:00Z", disconnect_window_end: "2026-08-03T09:00:00Z" }, as: UtilityCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_VALIDATION"

      - name: subresource_list_discovers_children
        claim_type: parent_relationships
        grounds: [entities.HazmatAbatement.fields.structure_survey_id]
        distinguishing_aspect: "GET /demolition/structure-surveys/{id}/abatements returns exactly the abatement orders created under that survey (FK reverse-reachability)."
        test_recipe:
          setup: ["Project with one survey carrying two abatement orders."]
          setup_api_calls:
            - { call: "POST /demolition/projects", payload: { name: "FK", address: "16 Pine St", lot_area_sqft: 12000 }, as: ContractorAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /demolition/projects/${p_id}/structure-surveys", payload: { structure_label: "Main" }, as: Surveyor, captures: { sv_id: $.data.id } }
            - { call: "POST /demolition/structure-surveys/${sv_id}/abatements", payload: { material_type: "ASBESTOS", description: "pipe wrap", containment_method: "wet" }, as: Surveyor }
            - { call: "POST /demolition/structure-surveys/${sv_id}/abatements", payload: { material_type: "LEAD_PAINT", description: "trim", containment_method: "strip" }, as: Surveyor }
          trigger:
            - { call: "GET /demolition/structure-surveys/${sv_id}/abatements", as: Surveyor, captures: { a0_fk: "$.data[0].structure_survey_id", a1_fk: "$.data[1].structure_survey_id" } }
          assert:
            - "data.total_count == 2; ${a0_fk} == ${sv_id} and ${a1_fk} == ${sv_id}"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: project_auto_advances_on_first_survey_and_bubbles_up
        claim_type: valid_transition
        grounds: [state_machines.Project.DRAFT_to_SURVEY_PHASE, state_machines.Project.SURVEY_PHASE_to_PRECONDITIONS_PENDING]
        distinguishing_aspect: "System transitions: first survey create moves DRAFT->SURVEY_PHASE; completing the last IN_PROGRESS survey bubbles SURVEY_PHASE->PRECONDITIONS_PENDING; each bump increments Project.version."
        test_recipe:
          setup: ["Project in DRAFT."]
          setup_api_calls:
            - { call: "POST /demolition/projects", payload: { name: "Auto", address: "18 Pine St", lot_area_sqft: 12000 }, as: ContractorAdmin, captures: { p_id: $.data.id, v0: $.data.version } }
          trigger:
            - { call: "POST /demolition/projects/${p_id}/structure-surveys", payload: { structure_label: "Main" }, as: Surveyor, captures: { sv_id: $.data.id } }
            - { call: "GET /demolition/projects/${p_id}", as: SiteSupervisor, captures: { st1: $.data.status, v1: $.data.version } }
            - { call: "POST /demolition/structure-surveys/${sv_id}/transition", payload: { action: "COMPLETE", hazmat_found: false, findings_summary: "clean" }, as: Surveyor }
            - { call: "GET /demolition/projects/${p_id}", as: SiteSupervisor, captures: { st2: $.data.status, v2: $.data.version } }
          assert:
            - "${v0} == 1; after survey create ${st1} == SURVEY_PHASE and ${v1} == ${v0} + 1"
            - "after survey COMPLETE ${st2} == PRECONDITIONS_PENDING and ${v2} == ${v1} + 1"

      - name: project_regresses_when_new_survey_created_in_preconditions_pending
        claim_type: side_effect_execution
        grounds: [state_machines.Project.PRECONDITIONS_PENDING_to_SURVEY_PHASE]
        distinguishing_aspect: "Creating another survey while PRECONDITIONS_PENDING regresses the project to SURVEY_PHASE (conditional cascade down)."
        test_recipe:
          setup: ["Project PRECONDITIONS_PENDING with one COMPLETE survey."]
          setup_api_calls:
            - { call: "POST /demolition/projects", payload: { name: "Regress", address: "20 Pine St", lot_area_sqft: 12000 }, as: ContractorAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /demolition/projects/${p_id}/structure-surveys", payload: { structure_label: "Main" }, as: Surveyor, captures: { sv_id: $.data.id } }
            - { call: "POST /demolition/structure-surveys/${sv_id}/transition", payload: { action: "COMPLETE", hazmat_found: false, findings_summary: "clean" }, as: Surveyor }
          trigger:
            - { call: "POST /demolition/projects/${p_id}/structure-surveys", payload: { structure_label: "Garage", survey_type: "ADDENDUM" }, as: Surveyor }
            - { call: "GET /demolition/projects/${p_id}", as: SiteSupervisor, captures: { st: $.data.status } }
          assert:
            - "${st} == SURVEY_PHASE (regressed until the new survey completes)"

      - name: permit_transition_from_rejected_rejected
        claim_type: terminal_state_lockdown
        grounds: [state_machines.DemolitionPermit]
        distinguishing_aspect: "REJECTED is terminal: SUBMIT/APPROVE/ACTIVATE on a REJECTED permit all fail ERR_INVALID_STATE."
        test_recipe:
          setup: ["Project with a permit that went DRAFT->UNDER_REVIEW->REJECTED."]
          setup_api_calls:
            - { call: "POST /demolition/projects", payload: { name: "Term", address: "22 Pine St", lot_area_sqft: 12000 }, as: ContractorAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /demolition/projects/${p_id}/permits", payload: { permit_number: "P-T", gross_floor_area_sqft: 10000 }, as: PermitCoordinator, captures: { pm_id: $.data.id } }
            - { call: "POST /demolition/permits/${pm_id}/transition", payload: { action: "SUBMIT" }, as: PermitCoordinator }
            - { call: "POST /demolition/permits/${pm_id}/transition", payload: { action: "REJECT" }, as: AuthorityReviewer }
          trigger:
            - { call: "POST /demolition/permits/${pm_id}/transition", payload: { action: "SUBMIT" }, as: PermitCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_INVALID_STATE (terminal lockdown)"

      - name: ticket_receive_twice_rejected
        claim_type: idempotency
        grounds: [state_machines.DebrisTicket.MANIFESTED_to_RECEIVED]
        distinguishing_aspect: "Second RECEIVE on an already-RECEIVED ticket fails ERR_INVALID_STATE; counters are not double-applied."
        test_recipe:
          setup:
            - "Project DEMOLITION_ACTIVE (release chain); ticket gross 10.0 already RECEIVED with diverted 4.0."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: ContractorAdmin }
            - { call: "POST /demolition/projects", payload: { name: "Idem", address: "24 Pine St", lot_area_sqft: 30000 }, as: ContractorAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /demolition/projects/${p_id}/structure-surveys", payload: { structure_label: "Main" }, as: Surveyor, captures: { sv_id: $.data.id } }
            - { call: "POST /demolition/structure-surveys/${sv_id}/transition", payload: { action: "COMPLETE", hazmat_found: false, findings_summary: "clean" }, as: Surveyor }
            - { call: "POST /demolition/projects/${p_id}/utility-disconnects", payload: { utility_type: "ELECTRIC", provider_name: "City Power", disconnect_window_start: "2026-08-02T08:00:00Z", disconnect_window_end: "2026-08-02T12:00:00Z" }, as: UtilityCoordinator, captures: { ud_id: $.data.id } }
            - { call: "POST /demolition/utility-disconnects/${ud_id}/transition", payload: { action: "REPORT_DISCONNECTED" }, as: UtilityCoordinator, as_user_id: "id-r-1" }
            - { call: "POST /demolition/utility-disconnects/${ud_id}/transition", payload: { action: "VERIFY" }, as: UtilityCoordinator, as_user_id: "id-v-1" }
            - { call: "POST /demolition/utility-disconnects/${ud_id}/transition", payload: { action: "CONFIRM" }, as: UtilityCoordinator, as_user_id: "id-c-1" }
            - { call: "POST /demolition/projects/${p_id}/permits", payload: { permit_number: "P-1", gross_floor_area_sqft: 20000 }, as: PermitCoordinator, captures: { pm_id: $.data.id } }
            - { call: "POST /demolition/permits/${pm_id}/transition", payload: { action: "SUBMIT" }, as: PermitCoordinator }
            - { call: "POST /demolition/permits/${pm_id}/transition", payload: { action: "APPROVE" }, as: AuthorityReviewer }
            - { call: "POST /demolition/permits/${pm_id}/transition", payload: { action: "ACTIVATE" }, as: PermitCoordinator }
            - { call: "POST /demolition/projects/${p_id}/engineering-surveys", payload: { demolition_method: "MECHANICAL", structural_stability_rating: "STABLE", max_structure_height_ft: 30, adjacent_structure_distance_ft: 40 }, as: StructuralEngineer, as_user_id: "id-a-1", captures: { es_id: $.data.id } }
            - { call: "POST /demolition/engineering-surveys/${es_id}/transition", payload: { action: "SUBMIT" }, as: StructuralEngineer, as_user_id: "id-a-1" }
            - { call: "POST /demolition/engineering-surveys/${es_id}/transition", payload: { action: "CERTIFY" }, as: PeerReviewEngineer, as_user_id: "id-p-1" }
            - { call: "GET /demolition/projects/${p_id}", as: SiteSupervisor, captures: { p_v: $.data.version } }
            - { call: "POST /demolition/projects/${p_id}/engineering-pin", payload: { engineering_survey_id: "${es_id}", expected_project_version: "${p_v}" }, as: SiteSupervisor }
            - { call: "POST /demolition/projects/${p_id}/neighbor-notifications", payload: { address: "26 Pine St", notice_method: "CERTIFIED_MAIL", scheduled_delivery_date: "2026-08-02" }, as: SiteSupervisor, captures: { nn_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T09:00:00Z" }, as: ContractorAdmin }
            - { call: "POST /demolition/neighbor-notifications/${nn_id}/transition", payload: { action: "DELIVER" }, as: SiteSupervisor }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T09:00:00Z" }, as: ContractorAdmin }
            - { call: "POST /demolition/projects/${p_id}/release", payload: {}, as: SiteSupervisor }
            - { call: "POST /demolition/projects/${p_id}/transition", payload: { action: "START_DEMOLITION" }, as: SiteSupervisor }
            - { call: "POST /demolition/projects/${p_id}/debris-tickets", payload: { ticket_number: "T-1", facility_type: "LANDFILL", material_class: "MIXED_CD", gross_tons: 10.0 }, as: HaulingDispatcher, captures: { tk: $.data.id } }
            - { call: "POST /demolition/debris-tickets/${tk}/transition", payload: { action: "RECEIVE", diverted_tons: 4.0 }, as: HaulingDispatcher }
          trigger:
            - { call: "POST /demolition/debris-tickets/${tk}/transition", payload: { action: "RECEIVE", diverted_tons: 4.0 }, as: HaulingDispatcher, captures: { err: $.data.error_id } }
            - { call: "GET /demolition/projects/${p_id}", as: SiteSupervisor, captures: { lf: $.data.landfill_tons } }
          assert:
            - "${err} == ERR_INVALID_STATE (RECEIVED is not a valid source for RECEIVE)"
            - "${lf} == 6.0 (no double application of the first RECEIVE)"

      - name: abatement_fail_clearance_recycle_to_certified
        claim_type: valid_transition
        grounds: [state_machines.HazmatAbatement.CLEARANCE_FAILED_to_ABATEMENT_ACTIVE, state_machines.HazmatAbatement.CLEARANCE_PENDING_to_CLEARANCE_CERTIFIED]
        distinguishing_aspect: "Failure loop: IDENTIFIED->ACTIVE->PENDING->FAILED->ACTIVE->PENDING->CERTIFIED exercises the re-abatement cycle end to end."
        test_recipe:
          setup: ["Project with COMPLETE survey and one abatement order."]
          setup_api_calls:
            - { call: "POST /demolition/projects", payload: { name: "Recycle", address: "28 Pine St", lot_area_sqft: 12000 }, as: ContractorAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /demolition/projects/${p_id}/structure-surveys", payload: { structure_label: "Main" }, as: Surveyor, captures: { sv_id: $.data.id } }
            - { call: "POST /demolition/structure-surveys/${sv_id}/transition", payload: { action: "COMPLETE", hazmat_found: true, findings_summary: "asbestos" }, as: Surveyor }
            - { call: "POST /demolition/structure-surveys/${sv_id}/abatements", payload: { material_type: "ASBESTOS", description: "pipe wrap", containment_method: "wet" }, as: Surveyor, captures: { ab_id: $.data.id } }
          trigger:
            - { call: "POST /demolition/abatements/${ab_id}/transition", payload: { action: "START" }, as: AbatementSupervisor, as_user_id: "rc-s-1" }
            - { call: "POST /demolition/abatements/${ab_id}/transition", payload: { action: "REQUEST_CLEARANCE" }, as: AbatementSupervisor, as_user_id: "rc-s-1" }
            - { call: "POST /demolition/abatements/${ab_id}/transition", payload: { action: "FAIL_CLEARANCE" }, as: ClearanceOfficer, as_user_id: "rc-c-1", captures: { st_fail: $.data.status } }
