              captures: {permit2_no: "$.data.permit_number", permit2_end: "$.data.term_end"}
          assert:
            - "HTTP 201 with data.permit_number == 'ITP-000002' — the ordinal is global and one-based, ordered by created_at"
            - "data.term_end == '2029-02-28': 2028-02-29 plus 1 year clamps to February 28 in the non-leap year"
            - "data.authorized_take_units == 6.00 (15.00 acres x 0.40) and data.take_unit == 'INDIVIDUALS', copied from the second consultation's biological opinion"
            - "data.reinitiation_trigger_units == 5.40, take_consumed_units == 0.00, take_remaining_units == 6.00 and suspension_count == 0"
            - "the first permit still reports permit_number 'ITP-000001' and authorized_take_units 4.00 — the two ledgers are independent"
            - "GET /conservation-banks/${bank_id} reports credits_transferred == 104.72 (59.72 + 45.00) and credits_available == 395.28"

      - name: preliminary_versus_final_mitigation_variant_divergence
        claim_type: variant_divergence
        excluded_because:
          difficulty_instance: mitigation_preliminary_vs_final_variant_divergence
          rationale: >-
            The two variants of calculations.required_mitigation_units diverging in
            direction as well as magnitude (a negative mitigation_delta_units) is
            that §1.8 instance's subject; this section asserts only the uplift gate
            and a positive delta.

      - name: compliance_variant_selection_rolling_versus_lifetime
        claim_type: variant_selection
        excluded_because:
          difficulty_instance: compliance_standing_rolling_vs_lifetime_variant_divergence
          rationale: >-
            Variant SELECTION for calculations.compliance_standing_score (whether a
            report's period_end still falls inside the 365-day window) and the two
            variants disagreeing on identical data are covered there; the decay
            boundary instance above deliberately keeps both reads inside
            ROLLING_12_MONTH.

      - name: jeopardy_threshold_boundary
        claim_type: precision
        excluded_because:
          difficulty_instance: jeopardy_fraction_four_decimal_threshold_boundary
          rationale: >-
            The `>=` comparison against JEOPARDY_FRACTION_THRESHOLD on the ROUNDED
            4-decimal fraction, and the JEOPARDY / JEOPARDY_WITH_RPA split, are
            asserted there; the instances above stay well clear of the threshold so
            they isolate the selector and the take formula.

      - name: endowment_rounding_order
        claim_type: precision
        excluded_because:
          difficulty_instance: endowment_rounds_per_commitment_then_sums_reserve_on_rounded_base
          rationale: >-
            The normative order (round each commitment's contribution, then sum,
            then take 12% of the rounded base) is probed there with contributions
            that end in .5; the constants instance above only checks the factors
            and one clean reserve.

      - name: in_lieu_fee_tier_evaluation_order
        claim_type: precision
        excluded_because:
          difficulty_instance: in_lieu_fee_tier_pinned_to_base_never_reselected_from_total
          rationale: >-
            The apparently circular formula (tier from base, never re-selected from
            the total) is pinned there; the tier-boundary instance above asserts the
            non-monotonic totals on either side of 5000000 cents.

      - name: funding_half_assurance_boundary
        claim_type: precision
        excluded_because:
          difficulty_instance: funding_half_boundary_decided_on_integer_cents_not_on_ratio
          rationale: >-
            The exact half-funded boundary decided on integer cents while
            funded_ratio displays 0.5000 is that instance's subject.

      - name: effect_determination_three_input_ladder
        claim_type: correct_result
        excluded_because:
          difficulty_instance: effect_determination_three_input_ladder_rank_beats_equal_percentage
          rationale: >-
            The interaction of all three inputs at once (equal percentages
            separated by listing rank and confirmed presence) is covered there; the
            instances above isolate the rank clause, the input-set filter and the
            rounding step one at a time.

      - name: consultation_deadline_tolling
        claim_type: chronological
        excluded_because:
          difficulty_instance: consultation_info_request_cycle_tolls_deadline_twice_then_refuses
          rationale: >-
            The floor-to-whole-days tolling arithmetic and its effect on deadline_at
            across two episodes is covered there; the deadline at creation
            (2027-02-13) is asserted by the consultation-creation instance above.

      - name: survey_window_buffer_semantics
        claim_type: interval_merge
        excluded_because:
          difficulty_instance: survey_windows_on_a_habitat_unit_are_closed_intervals_with_a_buffer
          rationale: >-
            Branch A of calculations.interval_conflict_detection (closed intervals
            widened by SURVEY_DISTURBANCE_BUFFER_DAYS, across all project actions)
            is asserted there; every determination in this section deliberately
            avoids sharing a critical habitat unit so the buffer never participates.

      - name: reporting_period_overlap_semantics
        claim_type: interval_merge
        excluded_because:
          difficulty_instance: reporting_periods_on_a_permit_are_half_open_and_may_be_adjacent
          rationale: >-
            Branch B's rejection of a genuine overlap and its tolerance of exact
            adjacency, plus the freeing of a REJECTED report's interval, are covered
            there; the lateness instance above relies on adjacency only as a
            precondition.

  # ==========================================================================
  # From Table 4 (Validations) — the ladder is walked rule by rule, and the
  # four declared priority-conflict pairs are stubbed to their §1.8 owners.
  # ==========================================================================
  - section: validations
    instances:

      - name: absent_or_blank_auth_headers_are_401_and_only_proponent_creation_is_exempt
        claim_type: violation_to_error
        grounds:
          - validations[priority=1]
          - errors["ERR_UNAUTHENTICATED"]
          - roles.Anonymous
        distinguishing_aspect: >-
          Priority 1 has an asymmetric shape: X-Role is required everywhere
          except POST /proponents, and X-User-ID is required only for the two
          identity-bearing roles. An Auditor request with no X-User-ID must
          therefore SUCCEED, while a Proponent request with an empty-string
          X-User-ID must fail — the header is present but blank, which is not the
          same as absent.
        test_recipe:
          setup:
            - "One species, one proponent and one project action exist; the clock is at 2026-10-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: {to_iso8601: "2026-10-01T00:00:00Z"}
              as: WildlifeAgency
              as_user_id: "fws-user-registrar"
            - call: "POST /species"
              payload: {scientific_name: "Gopherus agassizii", common_name: "Desert tortoise", listing_status: "ENDANGERED", take_authorization_unit: "INDIVIDUALS", take_density_per_acre: 0.40, recovery_unit_population: 4000, survey_season_start_month: 4, survey_season_end_month: 7}
              as: WildlifeAgency
              as_user_id: "fws-user-registrar"
              captures: {species_e_id: "$.data.id"}
            - call: "POST /proponents"
              payload: {org_name: "Sunrise Logistics Park LLC", contact_email: "permits@sunrise-park.example", is_federal_agency: false}
              as: Anonymous
              captures: {proponent_id: "$.data.id"}
            - call: "POST /project-actions"
              payload: {proponent_id: "${proponent_id}", action_name: "Sunrise Park Phase I", action_type: "NON_FEDERAL", footprint_acres: 200.00, county_code: "06037", construction_start_date: "2027-01-01", construction_end_date: "2027-12-31"}
              as: Proponent
              as_user_id: "${proponent_id}"
              captures: {action_id: "$.data.id"}
          trigger:
            - call: "GET /species/${species_e_id}"
              payload: {}
              as: Auditor
              captures: {e_norole: "$.data.error_id"}
            - call: "GET /project-actions"
              payload: {}
              as: Proponent
              as_user_id: ""
              captures: {e_blankuser: "$.data.error_id"}
            - call: "GET /project-actions/${action_id}"
              payload: {}
              as: Auditor
              captures: {seen_status: "$.data.status"}
            - call: "POST /proponents"
              payload: {org_name: "Coastal Aggregates Inc", contact_email: "compliance@coastal-agg.example"}
              as: Anonymous
              captures: {anon_proponent_id: "$.data.id"}
          assert:
            - "the first trigger is sent with NO X-Role header at all and returns 401 with ${e_norole} == 'ERR_UNAUTHENTICATED'"
            - "the second trigger sends X-Role: Proponent with X-User-ID: '' (present but empty) and returns 401 ERR_UNAUTHENTICATED — a blank header is not a supplied header"
            - "the third trigger sends X-Role: Auditor and NO X-User-ID and returns 200 with ${seen_status} == 'SCREENING': the Auditor role carries no user identity"
            - "the fourth trigger sends X-Role: Anonymous and returns 201 — POST /proponents is the single endpoint that admits the Anonymous role"
            - "no 401 response body carries any resource data; each carries only error_id and message"

      - name: declared_but_unpermitted_role_is_403_while_an_unknown_role_string_is_401
        claim_type: priority_ordering
        grounds:
          - validations[priority=2]
          - validations[priority=3]
          - errors["ERR_ROLE_NOT_PERMITTED"]
        distinguishing_aspect: >-
          Priority 2 sits ABOVE priority 3, so an unrecognised role string is
          reported as an authentication failure (401) rather than an
          authorization failure (403), even though the endpoint would also have
          refused it. Anonymous, by contrast, is a declared role, so it falls
          through to priority 3 and gets 403 on every endpoint except
          POST /proponents.
        test_recipe:
          setup:
            - "One species, one proponent and one project action exist."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: {to_iso8601: "2026-10-01T00:00:00Z"}
              as: WildlifeAgency
              as_user_id: "fws-user-registrar"
            - call: "POST /species"
              payload: {scientific_name: "Gopherus agassizii", common_name: "Desert tortoise", listing_status: "ENDANGERED", take_authorization_unit: "INDIVIDUALS", take_density_per_acre: 0.40, recovery_unit_population: 4000, survey_season_start_month: 4, survey_season_end_month: 7}
              as: WildlifeAgency
              as_user_id: "fws-user-registrar"
              captures: {species_e_id: "$.data.id"}
            - call: "POST /proponents"
              payload: {org_name: "Sunrise Logistics Park LLC", contact_email: "permits@sunrise-park.example", is_federal_agency: false}
              as: Anonymous
              captures: {proponent_id: "$.data.id"}
            - call: "POST /project-actions"
              payload: {proponent_id: "${proponent_id}", action_name: "Sunrise Park Phase I", action_type: "NON_FEDERAL", footprint_acres: 200.00, county_code: "06037", construction_start_date: "2027-01-01", construction_end_date: "2027-12-31"}
              as: Proponent
              as_user_id: "${proponent_id}"
              captures: {action_id: "$.data.id"}
          trigger:
            - call: "GET /project-actions/${action_id}"
              payload: {}
              as: Anonymous
              captures: {e_anon: "$.data.error_id"}
          assert:
            - "the trigger returns 403 with ${e_anon} == 'ERR_ROLE_NOT_PERMITTED': Anonymous is a declared role but is absent from this endpoint's §1.5 roles list"
            - "the same request sent with X-Role: Regulator — a string naming no declared role — returns 401 ERR_UNAUTHENTICATED instead, because priority 2 is evaluated before priority 3"
            - "the distinction is observable only through the error_id and status: both requests are refused, but for different reasons at different rungs"

      - name: role_permission_is_decided_before_the_path_ids_are_resolved
        claim_type: cascading_validation
        grounds:
          - validations[priority=3]
          - validations[priority=4]
        distinguishing_aspect: >-
          Priority 3 precedes priority 4, so a forbidden role aimed at a
          nonexistent id gets 403, never 404 — the server must not leak
          existence information to a role that may not use the endpoint at all.
        test_recipe:
          setup:
            - "One species exists; no critical habitat unit exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: {to_iso8601: "2026-10-01T00:00:00Z"}
              as: WildlifeAgency
              as_user_id: "fws-user-registrar"
            - call: "POST /species"
              payload: {scientific_name: "Gopherus agassizii", common_name: "Desert tortoise", listing_status: "ENDANGERED", take_authorization_unit: "INDIVIDUALS", take_density_per_acre: 0.40, recovery_unit_population: 4000, survey_season_start_month: 4, survey_season_end_month: 7}
              as: WildlifeAgency
              as_user_id: "fws-user-registrar"
              captures: {species_e_id: "$.data.id"}
          trigger:
            - call: "POST /species/00000000-0000-4000-8000-000000000000/critical-habitat-units"
              payload: {unit_code: "CHU-9", acres: 100.00, county_code: "06037", designation_status: "FINAL", primary_constituent_elements: ["burrow substrate"]}
              as: Auditor
              captures: {e_role_first: "$.data.error_id"}
            - call: "POST /species/00000000-0000-4000-8000-000000000000/critical-habitat-units"
              payload: {unit_code: "CHU-9", acres: 100.00, county_code: "06037", designation_status: "FINAL", primary_constituent_elements: ["burrow substrate"]}
              as: WildlifeAgency
              as_user_id: "fws-user-registrar"
              captures: {e_then_404: "$.data.error_id"}
          assert:
            - "the Auditor trigger returns 403 ${e_role_first} == 'ERR_ROLE_NOT_PERMITTED' even though the species id in the path resolves to nothing"
            - "the identical body sent as WildlifeAgency then returns 404 ${e_then_404} == 'ERR_SPECIES_NOT_FOUND' — the existence rung is only reached once the role rung passes"
            - "neither call creates a CriticalHabitatUnit: GET /species/${species_e_id}/critical-habitat-units still returns an empty list"

      - name: proponent_ownership_is_resolved_through_the_whole_parent_chain
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=5]
          - errors["ERR_NOT_RESOURCE_OWNER"]
        distinguishing_aspect: >-
          Ownership is never stored on the resource being addressed: it is
          resolved by walking up to the ProjectAction — one hop for a
          consultation, two for a plan, three for a permit and four for a
          monitoring report. A second proponent must be refused at every depth,
          while the Auditor role bypasses the check entirely because it has no
          proponent identity to compare.
        test_recipe:
