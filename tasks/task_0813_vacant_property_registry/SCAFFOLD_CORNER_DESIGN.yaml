              captures: { prop_id: "$.data.id" }
            - call: "POST /registry/inspections"
              payload: { property_id: "${prop_id}", inspector_badge: "C7", scheduled_start: "2026-03-02T09:00:00Z", scheduled_end: "2026-03-02T11:00:00Z" }
