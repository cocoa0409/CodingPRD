        grounds:
          - calculations.sla_service_credit
          - calculations.usage_consumption_attribution
          - state_machines.QuotaAssignment.throttle_state.HARD_THROTTLED_to_SOFT_THROTTLED
          - entities.QuotaAssignment.fields.bonus_call_credit
          - endpoints.POST /support-cases/{id}/resolve
        distinguishing_aspect: |
          Depth-3 chain that runs BACKWARDS through a threshold: resolve -> per-assignment SLA credit
          7813 -> effective allowance 507813 -> the stored ratio 501000/507813 = 0.98658 falls below
          HARD_THROTTLE_RATIO but stays above SOFT_THROTTLE_RATIO, so throttle_state must be
          recomputed from the ledger rather than from the last window's stored verdict. The
