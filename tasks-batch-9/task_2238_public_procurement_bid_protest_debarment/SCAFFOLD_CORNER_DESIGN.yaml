              payload: { legal_name: "Glenridge Concrete", tax_id: "100000061", contact_email: "v61@example.gov" }
              as: SystemAdmin
              as_user_id: "U-ADMIN-1"
              captures: { c_v61_id: $.data.id }
            - call: "POST /procurement/vendors"
              payload: { legal_name: "Havenwood Concrete", tax_id: "100000062", contact_email: "v62@example.gov" }
              as: SystemAdmin
              as_user_id: "U-ADMIN-1"
              captures: { c_v62_id: $.data.id }
            - call: "POST /procurement/solicitations"
              payload:
                solicitation_number: "SOL-2238-C30"
                title: "Sidewalk Replacement Program"
