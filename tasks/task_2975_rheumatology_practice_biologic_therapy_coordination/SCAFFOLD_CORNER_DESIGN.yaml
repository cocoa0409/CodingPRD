scaffold_corner_design:
  - section: entities
    instances:
      - name: patient_creation_returns_envelope_and_all_declared_defaults
        claim_type: creation
        grounds:
          - entities.Patient
          - endpoints.POST_patients
          - response_envelope.success
        distinguishing_aspect: "POST /patients with all five required inputs returns 201 with response_type object and every computed default materialised: tb_screen_status MISSING, hbv_screen_status INCOMPLETE, target_status UNASSESSED, administered_dose_total 0, active_episode_count 0, version 1."
        test_recipe:
          setup:
            - "Empty database with the logical clock pinned to 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: RegistryAdmin
          trigger:
            - call: "POST /patients"
              payload: { mrn: "RH0001", full_name: "Pat One", date_of_birth: "1975-04-12", diagnosis_code: "RA_SEROPOSITIVE", registry_consent: true }
              as: RegistryAdmin
              captures: { pat_id: $.data.id }
          assert:
            - "HTTP 201; response_type == \"object\"; meta.api_request_id and meta.api_request_timestamp are present"
            - "Patient.${pat_id}.mrn == \"RH0001\", full_name == \"Pat One\", date_of_birth == \"1975-04-12\", diagnosis_code == \"RA_SEROPOSITIVE\", registry_consent == true"
            - "Patient.${pat_id}.tb_screen_status == \"MISSING\" and hbv_screen_status == \"INCOMPLETE\""
            - "Patient.${pat_id}.target_status == \"UNASSESSED\", latest_activity_score == null, latest_activity_category == null"
            - "Patient.${pat_id}.administered_dose_total == 0 and active_episode_count == 0"
            - "Patient.${pat_id}.version == 1 and created_at == \"2026-08-01T00:00:00Z\""

      - name: patient_retrieval_returns_the_stored_entity
        claim_type: retrieval
        grounds:
          - endpoints.GET_patients_id
          - entities.Patient
        distinguishing_aspect: "GET /patients/{id} returns exactly the fields persisted by the create call, with the same id and version, and does not mutate version."
        test_recipe:
          setup:
            - "One patient created at clock 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /patients"
              payload: { mrn: "RH0001", full_name: "Pat One", date_of_birth: "1975-04-12", diagnosis_code: "RA_SEROPOSITIVE", registry_consent: true }
              as: RegistryAdmin
              captures: { pat_id: $.data.id, pat_v: $.data.version }
          trigger:
            - call: "GET /patients/${pat_id}"
              payload: {}
              as: RegistryAdmin
          assert:
            - "HTTP 200; data.id == \"${pat_id}\"; data.version == ${pat_v}"
            - "data.mrn == \"RH0001\" and data.diagnosis_code == \"RA_SEROPOSITIVE\""
            - "a second identical GET still returns version == ${pat_v} (reads never bump version)"

      - name: visit_listing_paginates_with_limit_offset_and_total_count
        claim_type: listing
        grounds:
          - endpoints.GET_visits
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "GET /visits?patient_id=..&limit=2&offset=0 returns total_count 3, has_more true and 2 rows; offset 2 returns 1 row with has_more false — so total_count counts the filtered set, not the page."
        test_recipe:
          setup:
            - "One rheumatologist, one patient, and three FOLLOW_UP visits at 14:00, 15:00 and 16:00 on 2026-08-03 — each 30 minutes long and mutually disjoint, so the two-concurrent-visit clinician cap cannot fire."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /clinicians"
              payload: { npi: "1234567893", full_name: "Ada Rheum", role_type: "RHEUMATOLOGIST", can_attest_formulary_exception: true }
              as: RegistryAdmin
              captures: { rheum1_id: $.data.id }
            - call: "POST /patients"
              payload: { mrn: "RH0001", full_name: "Pat One", date_of_birth: "1975-04-12", diagnosis_code: "RA_SEROPOSITIVE", registry_consent: true }
              as: RegistryAdmin
              captures: { pat_id: $.data.id }
            - call: "POST /visits"
              payload: { patient_id: "${pat_id}", clinician_id: "${rheum1_id}", visit_datetime: "2026-08-03T14:00:00Z", visit_type: "FOLLOW_UP" }
              as: Rheumatologist
              as_user_id: "${rheum1_id}"
            - call: "POST /visits"
              payload: { patient_id: "${pat_id}", clinician_id: "${rheum1_id}", visit_datetime: "2026-08-03T15:00:00Z", visit_type: "FOLLOW_UP" }
              as: Rheumatologist
              as_user_id: "${rheum1_id}"
            - call: "POST /visits"
              payload: { patient_id: "${pat_id}", clinician_id: "${rheum1_id}", visit_datetime: "2026-08-03T16:00:00Z", visit_type: "FOLLOW_UP" }
              as: Rheumatologist
              as_user_id: "${rheum1_id}"
          trigger:
            - call: "GET /visits"
              payload: { patient_id: "${pat_id}", limit: 2, offset: 0 }
              as: RegistryAdmin
            - call: "GET /visits"
              payload: { patient_id: "${pat_id}", limit: 2, offset: 2 }
              as: RegistryAdmin
            - call: "GET /visits"
              payload: { patient_id: "${pat_id}", status: "SCHEDULED" }
              as: RegistryAdmin
          assert:
            - "first call: response_type == \"array\", limit == 2, offset == 0, total_count == 3, has_more == true, len(data) == 2"
            - "second call: limit == 2, offset == 2, total_count == 3, has_more == false, len(data) == 1"
            - "third call: limit == 10 (the declared default), offset == 0, total_count == 3, has_more == false, len(data) == 3"

      - name: patient_not_found_returns_patient_not_found
        claim_type: not_found
        grounds:
          - errors[ERR_PATIENT_NOT_FOUND]
          - validations.priority_5_ERR_PATIENT_NOT_FOUND
        distinguishing_aspect: "GET /patients/{id} for an id that was never minted returns ERR_PATIENT_NOT_FOUND with HTTP 404 and the error envelope (response_type error, data.error_id, data.message)."
        test_recipe:
          setup:
            - "Empty database with the logical clock pinned; no Patient rows exist."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: RegistryAdmin
          trigger:
            - call: "GET /patients/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: RegistryAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404; response_type == \"error\""
            - "${err} == \"ERR_PATIENT_NOT_FOUND\" and data.message is a non-empty string"

      - name: visit_missing_required_visit_datetime_returns_invalid_request
        claim_type: required_fields
        grounds:
          - entities.Visit.fields.visit_datetime
          - validations.priority_12_ERR_INVALID_REQUEST
        distinguishing_aspect: "POST /visits omitting the required visit_datetime returns ERR_INVALID_REQUEST with HTTP 422 and creates no Visit row, even though patient_id and clinician_id both resolve."
        test_recipe:
          setup:
            - "One rheumatologist and one patient exist."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /clinicians"
              payload: { npi: "1234567893", full_name: "Ada Rheum", role_type: "RHEUMATOLOGIST", can_attest_formulary_exception: true }
              as: RegistryAdmin
              captures: { rheum1_id: $.data.id }
            - call: "POST /patients"
              payload: { mrn: "RH0001", full_name: "Pat One", date_of_birth: "1975-04-12", diagnosis_code: "RA_SEROPOSITIVE", registry_consent: true }
              as: RegistryAdmin
              captures: { pat_id: $.data.id }
          trigger:
            - call: "POST /visits"
              payload: { patient_id: "${pat_id}", clinician_id: "${rheum1_id}", visit_type: "FOLLOW_UP" }
              as: Rheumatologist
              as_user_id: "${rheum1_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 422; ${err} == \"ERR_INVALID_REQUEST\""
            - "GET /visits?patient_id=${pat_id} returns total_count == 0"

      - name: drug_optional_flags_take_declared_defaults_when_omitted
        claim_type: defaults
        grounds:
          - entities.Drug.fields.is_biosimilar
          - entities.Drug.fields.tb_screen_required
          - entities.Drug.fields.hbv_screen_required
          - entities.Drug.fields.step_therapy_required_classes
        distinguishing_aspect: "POST /drugs supplying only the nine required fields yields is_biosimilar false, tb_screen_required true, hbv_screen_required true and step_therapy_required_classes [] — the two screening flags default to true, not false."
        test_recipe:
          setup:
            - "Empty database with the logical clock pinned."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: RegistryAdmin
          trigger:
            - call: "POST /drugs"
              payload: { name: "Infliximab", molecule_class: "TNFI", route: "IV", formulary_tier: 3, acquisition_cost_cents: 250050, admin_time_minutes: 150, monitoring_panel_type: "CMP", monitoring_panel_interval_days: 90 }
              as: RegistryAdmin
              captures: { drug_id: $.data.id }
          assert:
            - "Drug.${drug_id}.is_biosimilar == false"
            - "Drug.${drug_id}.tb_screen_required == true and hbv_screen_required == true"
            - "Drug.${drug_id}.step_therapy_required_classes == []"

      - name: infusion_chair_status_is_system_owned_and_defaults_to_open
        claim_type: system_fields
        grounds:
          - entities.InfusionChair.fields.status
          - endpoints.POST_infusion_chairs
          - endpoints.PATCH_infusion_chairs_id
        distinguishing_aspect: "status is source system with default OPEN and is absent from POST /infusion-chairs' input schema, so a freshly created chair is OPEN and the only way to change it is PATCH /infusion-chairs/{id}."
        test_recipe:
          setup:
            - "Empty database with the logical clock pinned."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: RegistryAdmin
          trigger:
            - call: "POST /infusion-chairs"
              payload: { label: "AIC-1", site_type: "AMBULATORY_INFUSION_CENTER", turnover_buffer_minutes: 30 }
              as: RegistryAdmin
              captures: { chair_id: $.data.id, chair_v: $.data.version }
            - call: "PATCH /infusion-chairs/${chair_id}"
              payload: { status: "CLOSED" }
              as: RegistryAdmin
          assert:
            - "on create: InfusionChair.${chair_id}.status == \"OPEN\", version == 1, id and created_at are server-generated non-null values"
            - "after the PATCH: InfusionChair.${chair_id}.status == \"CLOSED\" and version == ${chair_v} + 1"

      - name: therapy_episode_computed_fields_are_derived_not_accepted_as_input
        claim_type: computed_fields
        grounds:
          - entities.TherapyEpisode.fields.line_of_therapy
          - entities.TherapyEpisode.fields.benefit_channel
          - entities.TherapyEpisode.fields.site_of_care
          - entities.TherapyEpisode.fields.routing_frozen
          - calculations.episode_benefit_routing
        distinguishing_aspect: "POST /therapy-episodes' input schema admits only patient_id, drug_id, payer_plan_id, therapy_start_at, expected_patient_version and prior_episode_id, so line_of_therapy 1, benefit_channel MEDICAL, site_of_care AMBULATORY_INFUSION_CENTER, routing_frozen true and monitoring_status OVERDUE can only have been computed by the server."
        test_recipe:
          setup:
            - "One rheumatologist, one IV TNFI drug (150 minutes), one plan with both benefits enabled and PREFER_AMBULATORY, one patient with no screening records and no monitoring labs."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /clinicians"
              payload: { npi: "1234567893", full_name: "Ada Rheum", role_type: "RHEUMATOLOGIST", can_attest_formulary_exception: true }
              as: RegistryAdmin
              captures: { rheum1_id: $.data.id }
            - call: "POST /drugs"
              payload: { name: "Infliximab", molecule_class: "TNFI", route: "IV", formulary_tier: 3, acquisition_cost_cents: 250050, admin_time_minutes: 150, monitoring_panel_type: "CMP", monitoring_panel_interval_days: 90 }
              as: RegistryAdmin
              captures: { ifx_id: $.data.id }
            - call: "POST /payer-plans"
              payload: { name: "Meridian PPO", pharmacy_benefit_enabled: true, medical_benefit_enabled: true, site_of_care_policy: "PREFER_AMBULATORY", coinsurance_pct: 0.175, deductible_remaining_cents: 100000, medical_facility_fee_cents: 12500, hospital_outpatient_multiplier: 1.40, appeal_rounds_allowed: 2, auth_validity_days: 180, step_therapy_classes_required: ["TNFI"] }
              as: RegistryAdmin
              captures: { mer_id: $.data.id }
            - call: "POST /patients"
              payload: { mrn: "RH0001", full_name: "Pat One", date_of_birth: "1975-04-12", diagnosis_code: "RA_SEROPOSITIVE", registry_consent: true }
              as: RegistryAdmin
              captures: { pat_id: $.data.id, pat_v: $.data.version }
          trigger:
            - call: "POST /therapy-episodes"
              payload: { patient_id: "${pat_id}", drug_id: "${ifx_id}", payer_plan_id: "${mer_id}", therapy_start_at: "2026-08-01T00:00:00Z", expected_patient_version: "${pat_v}" }
              as: Rheumatologist
              as_user_id: "${rheum1_id}"
              captures: { ep_id: $.data.id }
          assert:
            - "TherapyEpisode.${ep_id}.line_of_therapy == 1 and prior_episode_id == null"
            - "TherapyEpisode.${ep_id}.benefit_channel == \"MEDICAL\" and site_of_care == \"AMBULATORY_INFUSION_CENTER\""
            - "TherapyEpisode.${ep_id}.routing_frozen == true"
            - "TherapyEpisode.${ep_id}.self_injection_training_status == \"NOT_REQUIRED\" and self_injection_training_attempts == 0"
            - "TherapyEpisode.${ep_id}.monitoring_status == \"OVERDUE\" (no matching CMP panel is on file yet)"
            - "TherapyEpisode.${ep_id}.therapy_state == \"PLANNED\", funding_state == \"UNFUNDED\", hold_count == 0, doses_administered == 0"

      - name: screening_record_invalid_enum_screen_type_rejected
        claim_type: type_constraints
        grounds:
          - entities.ScreeningRecord.fields.screen_type
          - validations.priority_12_ERR_INVALID_REQUEST
        distinguishing_aspect: "POST /screening-records with screen_type QUANTIFERON_GOLD — a value outside the declared six-member enum — returns ERR_INVALID_REQUEST with HTTP 422; a collected_at later than resulted_at is rejected by the same rule."
        test_recipe:
          setup:
            - "One nurse and one patient exist."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /clinicians"
              payload: { npi: "1234567895", full_name: "Nia Nurse", role_type: "NURSE" }
              as: RegistryAdmin
              captures: { nurse1_id: $.data.id }
            - call: "POST /patients"
              payload: { mrn: "RH0001", full_name: "Pat One", date_of_birth: "1975-04-12", diagnosis_code: "RA_SEROPOSITIVE", registry_consent: true }
              as: RegistryAdmin
              captures: { pat_id: $.data.id }
          trigger:
            - call: "POST /screening-records"
              payload: { patient_id: "${pat_id}", screen_type: "QUANTIFERON_GOLD", result: "NEGATIVE", collected_at: "2026-07-20T00:00:00Z", resulted_at: "2026-07-21T00:00:00Z" }
              as: InfusionNurse
              as_user_id: "${nurse1_id}"
              captures: { err_enum: $.data.error_id }
            - call: "POST /screening-records"
              payload: { patient_id: "${pat_id}", screen_type: "TB_IGRA", result: "NEGATIVE", collected_at: "2026-07-22T00:00:00Z", resulted_at: "2026-07-21T00:00:00Z" }
              as: InfusionNurse
              as_user_id: "${nurse1_id}"
              captures: { err_order: $.data.error_id }
          assert:
            - "${err_enum} == \"ERR_INVALID_REQUEST\" with HTTP 422"
            - "${err_order} == \"ERR_INVALID_REQUEST\" with HTTP 422 (collected_at must be <= resulted_at)"
            - "GET /patients/${pat_id}/screening-records returns total_count == 0"
            - "Patient.${pat_id}.tb_screen_status == \"MISSING\""

      - name: screening_record_is_immutable_and_carries_no_version_field
        claim_type: immutability
        grounds:
          - entities.ScreeningRecord
          - endpoints.POST_screening_records
          - endpoints.GET_patients_id_screening_records
        distinguishing_aspect: "ScreeningRecord declares common_fields false: the API exposes only a create and two reads for it, no update or delete path exists, and the persisted row carries no version field — filing a corrected result means appending another record, and the derivation then follows the newest CURRENT one."
        test_recipe:
          setup:
            - "One nurse and one patient; one TB_IGRA POSITIVE record filed, then a TB_LTBI_TREATMENT_COMPLETE / COMPLETED record filed afterwards."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /clinicians"
              payload: { npi: "1234567895", full_name: "Nia Nurse", role_type: "NURSE" }
              as: RegistryAdmin
              captures: { nurse1_id: $.data.id }
            - call: "POST /patients"
              payload: { mrn: "RH0001", full_name: "Pat One", date_of_birth: "1975-04-12", diagnosis_code: "RA_SEROPOSITIVE", registry_consent: true }
              as: RegistryAdmin
              captures: { pat_id: $.data.id }
            - call: "POST /screening-records"
              payload: { patient_id: "${pat_id}", screen_type: "TB_IGRA", result: "POSITIVE", collected_at: "2026-07-01T00:00:00Z", resulted_at: "2026-07-02T00:00:00Z" }
              as: InfusionNurse
              as_user_id: "${nurse1_id}"
          trigger:
            - call: "POST /screening-records"
              payload: { patient_id: "${pat_id}", screen_type: "TB_LTBI_TREATMENT_COMPLETE", result: "COMPLETED", collected_at: "2026-07-20T00:00:00Z", resulted_at: "2026-07-21T00:00:00Z" }
              as: InfusionNurse
              as_user_id: "${nurse1_id}"
            - call: "GET /patients/${pat_id}/screening-records"
              payload: { screen_type: "TB_IGRA" }
              as: InfusionNurse
              as_user_id: "${nurse1_id}"
          assert:
            - "before the second record: Patient.${pat_id}.tb_screen_status == \"POSITIVE_UNTREATED\""
            - "after the second record: Patient.${pat_id}.tb_screen_status == \"CLEARED_AFTER_TREATMENT\""
            - "the original TB_IGRA row is unchanged: its result is still \"POSITIVE\" and its resulted_at is still \"2026-07-02T00:00:00Z\""
            - "no ScreeningRecord in the response carries a version field"
            - "GET /patients/${pat_id}/screening-records with screen_type TB_IGRA returns total_count == 1 (the treatment record is a different screen_type)"

      - name: therapy_episode_create_with_unknown_patient_returns_reference_not_found
        claim_type: parent_relationships
        grounds:
          - validations.priority_13_ERR_REFERENCE_NOT_FOUND
          - entities.TherapyEpisode.fields.patient_id
        distinguishing_aspect: "POST /therapy-episodes whose patient_id names no Patient returns ERR_REFERENCE_NOT_FOUND with HTTP 422 — priority 13 outranks the OCC check at priority 16, so the error is the reference failure and not ERR_STALE_PATIENT_VERSION even though the supplied version belongs to a different patient."
        test_recipe:
          setup:
            - "One rheumatologist, one drug, one plan and one real patient (used only as a source for a genuine version value)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /clinicians"
              payload: { npi: "1234567893", full_name: "Ada Rheum", role_type: "RHEUMATOLOGIST", can_attest_formulary_exception: true }
              as: RegistryAdmin
              captures: { rheum1_id: $.data.id }
            - call: "POST /drugs"
              payload: { name: "Infliximab", molecule_class: "TNFI", route: "IV", formulary_tier: 3, acquisition_cost_cents: 250050, admin_time_minutes: 150, monitoring_panel_type: "CMP", monitoring_panel_interval_days: 90 }
              as: RegistryAdmin
              captures: { ifx_id: $.data.id }
            - call: "POST /payer-plans"
              payload: { name: "Meridian PPO", pharmacy_benefit_enabled: true, medical_benefit_enabled: true, site_of_care_policy: "PREFER_AMBULATORY", coinsurance_pct: 0.175, deductible_remaining_cents: 100000, medical_facility_fee_cents: 12500, hospital_outpatient_multiplier: 1.40, appeal_rounds_allowed: 2, auth_validity_days: 180, step_therapy_classes_required: ["TNFI"] }
              as: RegistryAdmin
              captures: { mer_id: $.data.id }
            - call: "POST /patients"
              payload: { mrn: "RH0001", full_name: "Pat One", date_of_birth: "1975-04-12", diagnosis_code: "RA_SEROPOSITIVE", registry_consent: true }
              as: RegistryAdmin
              captures: { pat_id: $.data.id, pat_v: $.data.version }
          trigger:
            - call: "POST /therapy-episodes"
              payload: { patient_id: "00000000-0000-0000-0000-0000000000ff", drug_id: "${ifx_id}", payer_plan_id: "${mer_id}", therapy_start_at: "2026-08-01T00:00:00Z", expected_patient_version: "${pat_v}" }
              as: Rheumatologist
              as_user_id: "${rheum1_id}"
              captures: { err_patient: $.data.error_id }
            - call: "POST /therapy-episodes"
              payload: { patient_id: "${pat_id}", drug_id: "00000000-0000-0000-0000-0000000000fe", payer_plan_id: "${mer_id}", therapy_start_at: "2026-08-01T00:00:00Z", expected_patient_version: "${pat_v}" }
              as: Rheumatologist
              as_user_id: "${rheum1_id}"
              captures: { err_drug: $.data.error_id }
          assert:
            - "${err_patient} == \"ERR_REFERENCE_NOT_FOUND\" with HTTP 422"
            - "${err_patient} != \"ERR_STALE_PATIENT_VERSION\""
            - "${err_drug} == \"ERR_REFERENCE_NOT_FOUND\" with HTTP 422"
            - "GET /therapy-episodes?patient_id=${pat_id} returns total_count == 0"
            - "Patient.${pat_id}.version == ${pat_v} (both rejections left the parent untouched)"

      - name: monitoring_lab_body_episode_id_not_found_returns_episode_not_found
        claim_type: parent_relationships
        grounds:
          - validations.priority_14_ERR_EPISODE_NOT_FOUND
          - entities.MonitoringLab.fields.episode_id
        distinguishing_aspect: "A flat-topology FK carried in the request body has its own error code: POST /monitoring-labs with an unknown episode_id returns ERR_EPISODE_NOT_FOUND (priority 14), not the generic ERR_REFERENCE_NOT_FOUND used for the episode-create references."
        test_recipe:
          setup:
            - "One nurse exists; no TherapyEpisode rows exist at all."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /clinicians"
              payload: { npi: "1234567895", full_name: "Nia Nurse", role_type: "NURSE" }
              as: RegistryAdmin
              captures: { nurse1_id: $.data.id }
          trigger:
            - call: "POST /monitoring-labs"
              payload: { episode_id: "00000000-0000-0000-0000-0000000000ff", panel_type: "CMP", collected_at: "2026-07-25T00:00:00Z", alt_u_l: 30.0 }
              as: InfusionNurse
              as_user_id: "${nurse1_id}"
              captures: { err: $.data.error_id }
          assert:
