# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: NoiseOfficeAdmin
    description: "Noise office operations administrator: configuration (operators, monitors, curfew rules, funds), flight outcome recording, event ingestion, offer issue/disburse, fund allocate/close, study adoption, report publish, escalation, clock"
    identity: opaque
    exclusive_operations: [create operators/monitors/curfew-rules/funds, PATCH flight-operations, ingest events, record outages, decommission monitor, suspend curfew rule, issue-offer, disburse, allocate, close fund, adopt study, publish report, escalate notification, set clock]
    shared_operations: [all read endpoints, create complainants, PATCH complainants]
  - name: NoiseAnalyst
    description: "Noise analyst: complaint review/correlation/closure, event screening/classification/verification, notification lifecycle (draft/send/close), quarterly report drafting and submission"
    identity: opaque
    exclusive_operations: [begin-review, request-info, correlate, close complaint, resume-review, event screening/classify/verify/discard/reclassify, create/send/close notifications, create/PATCH/submit quarterly reports]
    shared_operations: [all read endpoints]
  - name: CommunityLiaison
    description: "Community outreach officer: complainant registry, files complaints on behalf, outreach cases, insulation application intake/appeals/offer responses"
    identity: opaque
    exclusive_operations: [create/PATCH complainants, file complaint on behalf, provide-info, reopen, withdraw, insulation create/submit/appeal/accept/decline/withdraw, outreach case management]
    shared_operations: [all read endpoints]
  - name: StudyCoordinator
    description: "Part 150 study coordinator: studies, parcels, insulation eligibility screening decisions"
    identity: opaque
    exclusive_operations: [create/advance studies (except adopt), create parcels, reassess parcels, begin-screening, record-decision]
    shared_operations: [all read endpoints]
  - name: BoardMember
    description: "Airport board member: reviews and approves quarterly reports (may not approve a report they created)"
    identity: opaque
    exclusive_operations: [approve report, return-for-revision]
    shared_operations: [all read endpoints]
  - name: OperatorRep
    description: "Airline operator representative; X-User-ID equals the Operator id; acknowledges and responds to own notifications, views own operator data"
    identity: "entity_backed:Operator"
    exclusive_operations: [acknowledge notification, respond to notification]
    shared_operations: [read own operator, own flights, own notifications, own compliance-summary]
  - name: Complainant
    description: "Registered community complainant; X-User-ID equals the Complainant id; files and manages own complaints"
    identity: "entity_backed:Complainant"
    exclusive_operations: [file own complaint (complainant_id == X-User-ID)]
    shared_operations: [read own complainant record and own complaints, provide-info, reopen, withdraw own complaint]
