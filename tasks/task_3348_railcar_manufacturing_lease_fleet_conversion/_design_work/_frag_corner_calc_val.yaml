          setup:
            - "Empty DB; logical clock pinned to 2026-09-01T00:00:00Z."
            - "Car type FLT-100 (BOXCAR, build_hours 1, regulatory_life_years 25, line_count_family FLT_LINE) with one WS-320 WHEELSET bill-of-material row at qty_per_car 4 and on_hand_qty 25."
            - "A SOLD order of 5 cars (planned_shop_days 5 == build_hours 1 * quantity 5) with horizon 2026-09-01..2026-09-20 == 19 days >= worst_lead ceil(5 / 4) == 2."
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
