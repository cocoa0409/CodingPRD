  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: seller_enforcement_and_disbursement_dimensions_evolve_independently
        grounds:
          - "state_machines.Seller.enforcement_state"
          - "state_machines.Seller.disbursement_state"
          - "calculations.disbursement_state_target"
          - "complexity_profile.state_machine_shape (parallel)"
        distinguishing_aspect: |
          Parallel shape: the two Seller dimensions are driven by DIFFERENT triggers and move at
          different times. open-investigation moves disbursement_state alone (enforcement stays
          ACTIVE); the enforcement action moves enforcement_state and drags disbursement with it;
          and the final DISMISSED adjudication removes the only investigation gate yet
          disbursement_state must STAY RESERVE_HELD because the other dimension now pins it. The
          coupling is one-way, so no disbursement event ever moves enforcement_state.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00.000Z."
            - "PolicyRule SP-IND-1: SHIPPING_PERFORMANCE, base_severity_weight 1.50, removal_scope ACCOUNT, requires_poa false."
            - "One seller, no listings, no credits, no metric snapshots (metric_tier stays null so no escalation multiplier applies)."
            - "Two REPORTED violations v1 and v2 against that seller under SP-IND-1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /policy-rules"
              payload: { code: "SP-IND-1", category: "SHIPPING_PERFORMANCE", base_severity_weight: 1.50, removal_scope: "ACCOUNT", requires_poa: false }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { rule_sp: $.data.id }
            - call: "POST /sellers"
              payload: { legal_name: "Fernwood Outfitters LLC", email: "ops@fernwood-outfitters.example", tax_id_hash: "TAX-FE-0001", payout_bank_token: "BANK-FE-0001", address_fingerprint: "ADDR-FE-0001" }
              as: Anonymous
              captures: { s_id: $.data.id }
            - call: "POST /violations"
              payload: { seller_id: "${s_id}", policy_rule_id: "${rule_sp}", reporter_type: "BUYER", evidence_reference: "EV-FE-0001" }
              as: PolicyInvestigator
              as_user_id: "inv-1"
              captures: { v1: $.data.id }
            - call: "POST /violations"
              payload: { seller_id: "${s_id}", policy_rule_id: "${rule_sp}", reporter_type: "BUYER", evidence_reference: "EV-FE-0002" }
              as: PolicyInvestigator
              as_user_id: "inv-1"
              captures: { v2: $.data.id }
          trigger:
            - call: "POST /violations/${v1}/open-investigation"
              payload: {}
              as: PolicyInvestigator
              as_user_id: "inv-1"
            - call: "GET /sellers/${s_id}"
              payload: {}
              as: PolicyInvestigator
              as_user_id: "inv-1"
              captures: { state_after_open: $.data.enforcement_state, disb_after_open: $.data.disbursement_state }
            - call: "POST /violations/${v1}/adjudicate"
              payload: { outcome: "SUBSTANTIATED", decision_note: "Carrier scans confirm the shipments left the facility eight days late." }
              as: PolicyInvestigator
              as_user_id: "inv-1"
            - call: "GET /sellers/${s_id}"
              payload: {}
              as: PolicyInvestigator
              as_user_id: "inv-1"
              captures: { disb_after_adjudicate: $.data.disbursement_state }
            - call: "POST /enforcement-actions"
              payload: { violation_id: "${v1}" }
              as: PolicyInvestigator
              as_user_id: "inv-1"
              captures: { a1: $.data.id }
            - call: "POST /violations/${v2}/open-investigation"
              payload: {}
              as: PolicyInvestigator
              as_user_id: "inv-1"
            - call: "POST /violations/${v2}/adjudicate"
              payload: { outcome: "DISMISSED", decision_note: "Second report duplicates the first window and is withdrawn." }
              as: PolicyInvestigator
              as_user_id: "inv-1"
          assert:
            - "${state_after_open} == ACTIVE   # dimension 1 did not move"
            - "${disb_after_open} == RESERVE_HELD   # dimension 2 moved alone, driven by the UNDER_INVESTIGATION violation"
            - "${disb_after_adjudicate} == NORMAL   # the gate disappeared while enforcement_state was still ACTIVE"
            - "EnforcementAction.${a1}.severity_points_applied == 1.50 and EnforcementAction.${a1}.ladder_rung_computed == WARNING"
            - "Seller.${s_id}.severity_points_balance == 1.50"
            - "Seller.${s_id}.enforcement_state == WATCHLIST   # 0.00 < 1.50 < 4.00"
            - "Seller.${s_id}.disbursement_state == RESERVE_HELD   # after the final DISMISSED adjudication the investigation gate is gone, but WATCHLIST still pins this dimension"
            - "Violation.${v1}.state == SUBSTANTIATED and Violation.${v2}.state == DISMISSED"
            - "EnforcementAction.${a1}.state == ISSUED   # no disbursement event ever touched the action or the enforcement dimension"

      - name: poa_return_resubmit_cycle_hits_revision_limit
        grounds:
          - "state_machines.PlanOfAction"
          - "entities.PlanOfAction.fields.revision_count"
          - "errors.ERR_POA_REVISION_LIMIT"
          - "concurrency_rules.plan_of_action_vs_enforcement_action"
        distinguishing_aspect: |
          Cyclic shape with a bounded loop: SUBMITTED -> RETURNED_FOR_REVISION -> (new SUBMITTED,
          old row SUPERSEDED) runs exactly POA_MAX_REVISIONS (2) times, and the third RETURN is
          refused with ERR_POA_REVISION_LIMIT while ACCEPT on the SAME row still succeeds. The
          loop counter lives on the successor row (revision_count = predecessor + 1), so an
          implementation that recounts "prior non-SUPERSEDED plans" never reaches the limit.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00.000Z."
            - "PolicyRule LA-POA-1: LISTING_ACCURACY, base_severity_weight 2.00, removal_scope ACCOUNT, requires_poa true."
            - "Seller S with a SUBSTANTIATED violation and one ISSUED action a1 (applied 2.00, rung WARNING, issued_by inv-1)."
            - "Plans p1 (revision_count 0) and p2 (revision_count 1) were each RETURNED and p1 was SUPERSEDED by p2's successor; p3 now sits SUBMITTED with revision_count 2."
            - "Every POST /plans-of-action re-reads the action version first, because creating a plan increments EnforcementAction.version."
            - "The reviewing officer co-1 differs from the issuing investigator inv-1, so the priority-60 segregation check passes."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /policy-rules"
              payload: { code: "LA-POA-1", category: "LISTING_ACCURACY", base_severity_weight: 2.00, removal_scope: "ACCOUNT", requires_poa: true }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { rule_la: $.data.id }
            - call: "POST /sellers"
              payload: { legal_name: "Glenmark Supply LLC", email: "ops@glenmark-supply.example", tax_id_hash: "TAX-GL-0001", payout_bank_token: "BANK-GL-0001", address_fingerprint: "ADDR-GL-0001" }
              as: Anonymous
              captures: { s_id: $.data.id }
            - call: "POST /violations"
              payload: { seller_id: "${s_id}", policy_rule_id: "${rule_la}", reporter_type: "BUYER", evidence_reference: "EV-GL-0001" }
              as: PolicyInvestigator
              as_user_id: "inv-1"
              captures: { v1: $.data.id }
            - call: "POST /violations/${v1}/open-investigation"
              payload: {}
              as: PolicyInvestigator
              as_user_id: "inv-1"
            - call: "POST /violations/${v1}/adjudicate"
              payload: { outcome: "SUBSTANTIATED" }
              as: PolicyInvestigator
              as_user_id: "inv-1"
            - call: "POST /enforcement-actions"
              payload: { violation_id: "${v1}" }
              as: PolicyInvestigator
              as_user_id: "inv-1"
              captures: { a1: $.data.id }
            - call: "GET /enforcement-actions/${a1}"
              payload: {}
              as: Seller
              as_user_id: "${s_id}"
              captures: { av0: $.data.version }
            - call: "POST /plans-of-action"
              payload: { enforcement_action_id: "${a1}", root_cause: "Our listing team copied specification data from a supplier sheet that had not been revalidated since 2024.", corrective_measures: ["Corrected the 14 affected listings against the current supplier specification sheet."], preventive_measures: ["Added a second-reviewer sign-off before any specification field is published."], expected_enforcement_action_version: "${av0}" }
              as: Seller
              as_user_id: "${s_id}"
              captures: { p1: $.data.id }
            - call: "POST /plans-of-action/${p1}/review"
              payload: { decision: "RETURN", review_notes: "Root cause does not explain why the 2024 sheet stayed in circulation." }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "GET /enforcement-actions/${a1}"
              payload: {}
              as: Seller
              as_user_id: "${s_id}"
              captures: { av1: $.data.version }
            - call: "POST /plans-of-action"
              payload: { enforcement_action_id: "${a1}", root_cause: "The 2024 supplier sheet stayed in circulation because no owner was assigned to retire superseded specification files.", corrective_measures: ["Corrected the 14 affected listings and retired the 2024 specification sheet."], preventive_measures: ["Assigned a named owner for specification file retirement with a monthly audit."], expected_enforcement_action_version: "${av1}" }
              as: Seller
              as_user_id: "${s_id}"
              captures: { p2: $.data.id }
            - call: "POST /plans-of-action/${p2}/review"
              payload: { decision: "RETURN", review_notes: "Preventive measures need a detection control, not only an ownership assignment." }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "GET /enforcement-actions/${a1}"
              payload: {}
              as: Seller
              as_user_id: "${s_id}"
              captures: { av2: $.data.version }
            - call: "POST /plans-of-action"
              payload: { enforcement_action_id: "${a1}", root_cause: "No owner was assigned to retire superseded specification files and no control detected the drift between listing and supplier data.", corrective_measures: ["Corrected the 14 affected listings and retired the 2024 specification sheet."], preventive_measures: ["Assigned a named owner for specification retirement.", "Added a weekly automated diff between published listing specs and the live supplier feed."], expected_enforcement_action_version: "${av2}" }
              as: Seller
              as_user_id: "${s_id}"
              captures: { p3: $.data.id }
          trigger:
            - call: "POST /plans-of-action/${p3}/review"
              payload: { decision: "RETURN", review_notes: "Third return attempt on the same enforcement action." }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { err_code: $.data.error_id }
            - call: "POST /plans-of-action/${p3}/review"
              payload: { decision: "ACCEPT", review_notes: "Detection control satisfies the requirement." }
              as: ComplianceOfficer
              as_user_id: "co-1"
          assert:
            - "the RETURN attempt returns 409 and ${err_code} == ERR_POA_REVISION_LIMIT   # revision_count 2 is already at POA_MAX_REVISIONS"
            - "PlanOfAction.${p1}.revision_count == 0 and PlanOfAction.${p1}.state == SUPERSEDED"
            - "PlanOfAction.${p2}.revision_count == 1 and PlanOfAction.${p2}.state == SUPERSEDED"
            - "PlanOfAction.${p3}.revision_count == 2   # predecessor + 1, not a recount of live rows"
            - "the ACCEPT call returns 200 and PlanOfAction.${p3}.state == ACCEPTED   # the loop bound blocks only the RETURN edge"
            - "PlanOfAction.${p3}.reviewed_by_user_id == co-1 and PlanOfAction.${p3}.deadline_at == 2026-08-18T00:00:00.000Z   # issued_at + POA_DEADLINE_DAYS (17)"
            - "EnforcementAction.${a1}.version == 4   # one increment per plan creation, from the version at issuance"

      - name: appeal_denied_then_escalation_grant_reopens_upheld_action
        grounds:
          - "state_machines.Appeal"
          - "state_machines.EnforcementAction.UPHELD_to_VACATED"
          - "state_machines.Seller.enforcement_state"
          - "entities.EnforcementAction.fields.resolution_reason"
          - "entities.Appeal.fields.escalation_deadline_at"
        distinguishing_aspect: |
          The single non-linear edge in the whole scaffold: UPHELD looks terminal (acknowledge and
          re-appeal are both refused from it) yet the second-level escalation grant reopens it to
          VACATED, and doing so replays the ENTIRE reinstatement cascade one state later than the
          first-level grant would have. A linear reading of the appeal machine leaves the action
          UPHELD and the seller SUSPENDED forever.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00.000Z."
            - "PolicyRule LA-ESC-1: LISTING_ACCURACY, base_severity_weight 3.20, removal_scope ACCOUNT, requires_poa false (so the appeal needs no accepted plan)."
            - "Seller S with one ACTIVE listing l1 and no credits."
            - "Action a1 issued by inv-1 with action_type_override ACCOUNT_SUSPENSION: computed rung WARNING (balance 3.20), override accepted because ACCOUNT_SUSPENSION is strictly more severe -> seller SUSPENDED, l1 SUPPRESSED, disbursement FULL_HOLD, appeal_deadline_at 2026-08-31T00:00:00.000Z."
            - "Appeal ap1 submitted by S, taken UNDER_REVIEW by ar-1, DENIED with denial_reason EVIDENCE_UPHELD -> action UPHELD with resolution_reason APPEAL_DENIED, escalation_deadline_at 2026-08-15T00:00:00.000Z."
            - "S escalates within the window; repeat_offense_count is 0 because no other LISTING_ACCURACY action exists."
            - "The escalation decider co-1 differs from both the first-level decider ar-1 and the issuer inv-1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /policy-rules"
              payload: { code: "LA-ESC-1", category: "LISTING_ACCURACY", base_severity_weight: 3.20, removal_scope: "ACCOUNT", requires_poa: false }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { rule_la: $.data.id }
            - call: "POST /sellers"
              payload: { legal_name: "Harborline Goods LLC", email: "ops@harborline-goods.example", tax_id_hash: "TAX-HA-0001", payout_bank_token: "BANK-HA-0001", address_fingerprint: "ADDR-HA-0001" }
              as: Anonymous
