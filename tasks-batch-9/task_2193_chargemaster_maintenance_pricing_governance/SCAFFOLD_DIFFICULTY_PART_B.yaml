          setup:
            - "Logical clock pinned to 2026-09-01T00:00:00Z."
            - "Facility with rounding_mode NEAREST_CENT and aggregate_markup_limit_bp 40000; no TransparencyFile and no CodeUpdateCycle, so posture stays OPEN throughout."
            - "RevenueCode 0300 created ACTIVE; unrestricted Clinical Lab department; one ACTIVE COST_PLUS_MARKUP PriceRule with the default three tiers."
            - "ChargeItem CDM-40001 driven to ACTIVE (gross 144000, version 5) and then DEACTIVATEd to INACTIVE (version 6, price_status still PRICED_CURRENT, duplicate_of_item_id null)."
            - "ChargeItem CDM-40002 driven only as far as lifecycle APPROVED (version 4, price_status PRICED_CURRENT)."
            - "RevenueCode 0300 then retired, so RevenueCode.status == RETIRED while both items still point at it."
