            - *c_parcel_a
            - *c_app_a
            - *c_appraisal_a
            - *c_clk_0820
            - *c_appr_submit_a
            - *c_appr_certify_a
            - *c_clk_1001
            - *c_rank_receipt_r1
            - *c_clk_1005
            - *c_get_app_a_v1
            - *c_offer_a
            - *c_get_app_a_v2
            - *c_plan_a
            - *c_clk_1012
            - *c_accept_a
            - *c_get_req_title
            - *c_get_req_sub
            - *c_get_req_survey
            - *c_submit_req_title
            - *c_review_req_title
            - *c_submit_req_sub
            - *c_review_req_sub
            - *c_submit_req_survey
            - *c_review_req_survey
            - *c_clk_1215
            - *c_close_a
            - *c_visit_a1
            - &c_visit_a2
              call: "POST /monitoring-visits"
              payload: { easement_id: "${ease_a_id}", window_start: "2027-06-08T00:00:00Z", window_end: "2027-06-15T00:00:00Z" }
              as: StewardshipMonitor
              as_user_id: "monitor-1"
              captures: { visit_a2_id: $.data.id }
          trigger:
            - *c_clk_270603
            - call: "POST /monitoring-visits/${visit_a1_id}/completion"
              payload: { observed_impervious_sqft: 139392, notes: "at allowance" }
              as: StewardshipMonitor
              as_user_id: "monitor-1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-06-10T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /monitoring-visits/${visit_a2_id}/completion"
              payload: { observed_impervious_sqft: 139393, notes: "one square foot over allowance" }
              as: StewardshipMonitor
              as_user_id: "monitor-1"
          assert:
            - "Easement.${ease_a_id}.impervious_allowance_sqft == 139392"
            - "MonitoringVisit.${visit_a1_id}.status == COMPLETED and finding == NO_ISSUE"
            - "GET /monitoring-visits/${visit_a1_id}/violations returns total_count == 0"
            - "MonitoringVisit.${visit_a2_id}.status == COMPLETED and finding == CONFIRMED_VIOLATION"
