              as: AirportFinance
            - call: "POST /airport/rates_settings/{rs_xed_id}/adopt"
              payload: {}
              as: AirportDirector
            - call: "POST /airport/airline_agreements/{ag_xd_id}/countersign"
              payload: {}
              as: SignatoryAirline
              as_user_id: "${xd_id}"
            - call: "POST /airport/fiscal_years/{fy_xed_id}/activity_records"
              payload: { airline_id: "${xd_id}", activity_date: "2026-09-10T00:00:00Z", landed_weight_kg: 1000, signature_status_at_activity: "SIGNATORY" }
              as: AirportFinance
            - call: "POST /airport/fiscal_years/{fy_xed_id}/settlement/compute"
              payload: {}
              as: AirportFinance
              captures: { settle_xed_id: $.data.id }
            - call: "POST /airport/settlements/{settle_xed_id}/publish-review"
              payload: {}
              as: AirportFinance
            - call: "GET /airport/settlements/{settle_xed_id}/lines"
