            - call: "POST /grandstand/offers/${of}/withdraw"
              payload: {}
              as: TalentBuyer
          assert:
            - "${committed_before} == 0 and ${open_before} == 1"
            - "after the send FairEdition.${ed}.committed_guarantee_total_cents == 12500000, Stage.${st}.held_show_count == 1, Stage.${st}.booking_posture == SATURATED and FairEdition.${ed}.open_stage_count == 0"
            - "after the withdraw FairEdition.${ed}.committed_guarantee_total_cents == 0, exactly the pre-send value"
            - "after the withdraw Stage.${st}.held_show_count == 0, Stage.${st}.booking_posture == OPEN and FairEdition.${ed}.open_stage_count == 1"
            - "Offer.${of}.status == WITHDRAWN and Offer.${of}.offered_guarantee_cents == 12500000 (the offer's own terms are not rewritten by the compensation)"
            - "no ShowBooking exists with offer_id == ${of}"

      - name: refund_batch_restores_seat_counts_and_paid_attendance
        grounds:
          - state_machines.ShowBooking.SCALED_to_ON_SALE
          - entities.TicketSaleBatch.fields.batch_kind
          - entities.TicketScale.fields.sold_seats
          - entities.TicketScale.fields.available_seats
          - entities.ShowBooking.fields.paid_attendance
          - validations.priority_45
        distinguishing_aspect: |
          CONSERVED QUANTITY: seat inventory, not money - sold_seats, available_seats and the
          booking's paid_attendance. An equal-and-opposite REFUND batch must return
          sold_seats to 0, available_seats to the full 2000 allotment and paid_attendance to
          0, while both append-only TicketSaleBatch rows survive. This is a different
          conservation law from the encumbrance round trip: the compensation happens in an
          append-only ledger where nothing is deleted, and the guard at priority 45 forbids
          overshooting the fold below zero.
        test_recipe:
          setup:
            - "One booking taken to ANNOUNCED / ON_SALE with a single RESERVED scale (face 6295, facility 400, allotment 2000, unbundled)."
            - "First a SALE batch of 500 units on the ONLINE channel, then a REFUND batch of exactly 500 units on the same channel."
            - "The clock stays at 2026-08-01T00:00:00.000Z, before doors, so both batches are eligible under either settlement basis."
          setup_api_calls:
            - call: "POST /grandstand/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00.000Z" }
              as: FairOperationsDirector
            - call: "POST /grandstand/fair-editions"
              payload: { year: 2026, name: "Seat Conservation Fair", run_start_date: "2026-08-20", run_end_date: "2026-08-30", gate_admission_price_cents: 1500, talent_budget_cap_cents: 40000000, refund_reserve_cents: 15000000, max_shows_per_day: 2, curfew_utc_time: "23:30", strategy_basis: "ATTENDANCE_WEIGHTED" }
              as: FairOperationsDirector
              captures: { ed: "$.data.id" }
            - call: "POST /grandstand/stages"
              payload: { fair_edition_id: "${ed}", name: "Grandstand", reserved_seat_capacity: 4000, ga_capacity: 6000, changeover_buffer_minutes: 120, slot_soft_cap: 4 }
              as: FairOperationsDirector
              captures: { st: "$.data.id" }
            - call: "POST /grandstand/talent-agents"
              payload: { user_id: "agent-hollis", agency_name: "Hollis Talent", contact_email: "book@hollis.example" }
              as: TalentBuyer
              captures: { ag: "$.data.id" }
            - call: "POST /grandstand/artists"
              payload: { agent_id: "${ag}", name: "Dust Road Revival", genre: "COUNTRY", audience_segment: "FAMILY", base_draw_score: 62.50 }
              as: TalentBuyer
              captures: { ar: "$.data.id" }
            - call: "POST /grandstand/offers"
              payload: { fair_edition_id: "${ed}", artist_id: "${ar}", target_stage_id: "${st}", deal_type: "VERSUS", offered_guarantee_cents: 12500000, backend_split_pct: 0.8500, backend_breakeven_cents: 6000000, radius_miles: 150, radius_days_before: 30, radius_days_after: 30, target_show_date: "2026-08-22", load_in_start_utc: "2026-08-22T14:00:00.000Z", load_out_end_utc: "2026-08-22T23:00:00.000Z", response_window_hours: 48 }
              as: TalentBuyer
              captures: { of: "$.data.id" }
            - call: "POST /grandstand/offers/${of}/send"
              payload: {}
              as: TalentBuyer
            - call: "POST /grandstand/offers/${of}/accept"
              payload: {}
              as: TalentAgent
              as_user_id: "agent-hollis"
            - call: "GET /grandstand/show-bookings"
              payload: { offer_id: "${of}" }
              as: TalentBuyer
              captures: { bk: "$.data[0].id" }
            - call: "GET /grandstand/production-advances"
              payload: { booking_id: "${bk}" }
              as: ProductionManager
              captures: { adv: "$.data[0].id" }
            - call: "GET /grandstand/production-advances/${adv}/rider-items"
              payload: {}
              as: ProductionManager
              captures: { seed: "$.data[0].id" }
            - call: "POST /grandstand/production-advances/${adv}/rider-items"
              payload: { category: "LIGHTING", description: "House lighting package", requested_cost_cents: 0, is_critical: false, artist_recoupable: false }
              as: ProductionManager
              captures: { lit: "$.data.id" }
            - call: "POST /grandstand/rider-items/${lit}/rule"
              payload: { decision: "APPROVED" }
              as: ProductionManager
            - call: "POST /grandstand/rider-items/${seed}/rule"
              payload: { decision: "APPROVED" }
              as: ProductionManager
            - call: "POST /grandstand/production-advances/${adv}/complete"
              payload: {}
              as: ProductionManager
            - call: "GET /grandstand/show-bookings/${bk}"
              payload: {}
              as: BoxOfficeManager
              captures: { bk_v1: "$.data.version" }
            - call: "POST /grandstand/show-bookings/${bk}/ticket-scales"
              payload: { expected_show_booking_version: "${bk_v1}", seating_type: "RESERVED", tier_name: "GOLD", face_price_cents: 6295, allotment_seats: 2000, bundled_with_gate_admission: false, facility_fee_cents: 400 }
              as: BoxOfficeManager
              captures: { sc: "$.data.id" }
            - call: "POST /grandstand/show-bookings/${bk}/announce"
              payload: { doors_time_utc: "2026-08-22T18:00:00.000Z" }
              as: FairOperationsDirector
          trigger:
            - call: "POST /grandstand/ticket-scales/${sc}/sales-batches"
              payload: { batch_kind: "SALE", quantity: 500, channel: "ONLINE" }
              as: BoxOfficeManager
              captures: { b_sale: "$.data.id" }
            - call: "POST /grandstand/ticket-scales/${sc}/sales-batches"
              payload: { batch_kind: "REFUND", quantity: 500, channel: "ONLINE" }
              as: BoxOfficeManager
              captures: { b_refund: "$.data.id" }
          assert:
            - "after the SALE batch TicketScale.${sc}.sold_seats == 500, available_seats == 1500 and ShowBooking.${bk}.paid_attendance == 500"
            - "after the REFUND batch TicketScale.${sc}.sold_seats == 0, exactly the pre-sale value"
            - "after the REFUND batch TicketScale.${sc}.available_seats == 2000 == TicketScale.${sc}.allotment_seats"
            - "after the REFUND batch ShowBooking.${bk}.paid_attendance == 0"
            - "both TicketSaleBatch rows ${b_sale} and ${b_refund} still exist and are unmodified (the ledger is append-only; nothing was deleted)"
            - "TicketScale.${sc}.scale_gross_potential_cents == 11866075 throughout (potential is capacity-based and never moves with sales)"
            - "ShowBooking.${bk}.ticketing_status == ON_SALE after both batches"
