  - section: consistency_model
    instances:
      - name: immediate_consistency_read_your_write_across_cascade
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
        distinguishing_aspect: "In the same request sequence (no waits), the GET after capture-signature already reflects qty_dispensed and the prescriber YTD change — no eventual-consistency lag anywhere in the surface."
        test_recipe:
          setup:
            - "Rep with 20 units, ELIGIBLE prescriber, published plan, completed visit, disbursement of 4."
          setup_api_calls:
            - call: "POST /field-force/regions"
              payload: { region_code: "DE-01", name: "Delaware" }
