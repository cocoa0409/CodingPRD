          test must read error_id. The dispatched task is on a different cat route but the SAME snowcat, and
          its window strictly contains the candidate's, so the overlap is unambiguous; meanwhile the
          candidate's own route still has an un-run sequence_index 1. Priorities 40 and 41 are adjacent, so
