          assert:
            - "the trigger returns ERR_OVERRIDE_EXCEEDS_LIMIT (422), because the ceiling on a 100000-cent base is 137500"
            - "PricebookOverrideRequest.${or_id}.status is still PENDING and decided_by_user_id is still null"
            - "the identical decision on a request of 137500 cents succeeds, so the ceiling boundary itself is admitted"
      - name: description_word_floor_on_completion
