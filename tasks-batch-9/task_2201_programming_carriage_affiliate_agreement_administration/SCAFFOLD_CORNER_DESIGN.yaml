            - "the Meridian-liaison filing returns 201 with data.status == \"SUBMITTED\" and data.reported_subscribers == 900000"
            - "GET /carriage/subscriber-reports as DistributorLiaison with as_user_id ${dh_id} and limit=10 returns total_count == 0 — the read surface is scoped by the same rule"
            - "GET /carriage/agreements/${am_id} as DistributorLiaison with as_user_id ${dh_id} returns 403 with data.error_id == \"ERR_DISTRIBUTOR_SCOPE_VIOLATION\""
            - "GET /carriage/agreements/${am_id} as DistributorLiaison with as_user_id ${dm_id} returns 200"

      - name: audit_recovery_chain_cannot_be_completed_by_one_role
        claim_type: approval_chain
        grounds:
          - rbac.AuditManager
          - rbac.RevenueAccountant
          - validations[priority=3]
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - endpoints[POST /carriage/audit-engagements/{engagementId}/findings]
        distinguishing_aspect: >-
