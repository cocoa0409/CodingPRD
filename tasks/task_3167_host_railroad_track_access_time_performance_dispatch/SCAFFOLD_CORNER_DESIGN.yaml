            - "SettlementStatement.${stmtp}.completed_run_count == 2"

      - name: schedule_overlap_infeasible_headway_rejected
        claim_type: Violation -> Error
        grounds:
          - calculations.schedule_feasibility
          - errors[ERR_SCHEDULE_INFEASIBLE]
          - validations[priority=11]
        distinguishing_aspect: "A 30-minute headway makes run2's seg2 planned window [08:57,09:47) overlap run1's [08:27,09:17) on a SINGLE segment, so propose fails with ERR_SCHEDULE_INFEASIBLE even though capacity (20/day) is not binding."
        test_recipe:
          setup: ["ACTIVE agreement; draft timetable with headway 30 and 2 trains/day."]
          setup_api_calls:
