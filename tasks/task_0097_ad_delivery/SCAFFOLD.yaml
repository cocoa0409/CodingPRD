      - { name: advertiser_id, type: string, source: system, description: "Owning advertiser" }
      - { name: external_user_id, type: string, source: input, description: "Stable identifier shared with auth headers" }
      - { name: account_role, type: enum, source: input, description: "OWNER | CAMPAIGN_MANAGER | FINANCE | VIEWER" }
