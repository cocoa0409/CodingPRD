# §1.8 Test Targeting Index for task 2717 - Hall of Fame Induction & Voting Administration.
# Every instance grounds in SCAFFOLD.yaml §1.1-§1.7 only; deleting this file changes no
# declared behaviour. The logical clock starts at 2026-08-01T00:00:00Z (see
# POST /_clock/set_current_utc), so every chain below is time-deterministic.
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: threshold_turnout_vs_roster_divergence
        grounds:
          - calculations.election_threshold_votes
          - entities.Ballot.fields.threshold_votes_provisional
          - entities.Ballot.fields.threshold_votes_final
          - entities.Ballot.fields.credentialed_roster_at_close
          - state_machines.Ballot.NOT_TALLIED_to_PENDING_AUDIT
          - state_machines.Ballot.PENDING_AUDIT_to_AUDIT_CERTIFIED
        distinguishing_aspect: |
          On the Ballot / election-arithmetic domain the same 3 counted submissions yield
          threshold_votes_provisional == 3 (TURNOUT_BASED, denominator ballots_cast = 3) and
          threshold_votes_final == 4 (ROSTER_BASED, denominator credentialed_roster_at_close = 5),
          so the one slot holding 3 votes is at the provisional bar and short of the final bar.
        test_recipe:
          setup:
            - "One EligibilityRule (PLAYER, MODERN) with election_threshold_pct 0.75, carryover_min_pct 0.05, runoff_floor_pct 0.25, max_ballot_appearances 3."
            - "One VoterBloc WRITERS with seat_cap 10 and min_participation_pct 0.50 holding 5 CREDENTIALED electors, credentials valid to 2027-12-31."
            - "Cycle 2026 in BALLOTING with a CLOSED, PENDING_AUDIT ballot carrying 2 LISTED slots and max_votes_per_elector == 1."
            - "Exactly 3 of the 5 electors cast a submission and all 3 selected slot 1; credentialed_roster_at_close == 5."
            - "Logical clock left at its 2026-08-01T00:00:00Z default, which is inside the ballot window 2026-08-01 .. 2026-08-20."
          setup_api_calls:
            - call: "POST /eligibility-rules"
              payload: { category: "PLAYER", pathway: "MODERN", waiting_period_years: 5, min_career_seasons: 10, min_career_metric: 2000, max_ballot_appearances: 3, election_threshold_pct: 0.75, carryover_min_pct: 0.05, runoff_floor_pct: 0.25 }
              as: ElectionAdministrator
              as_user_id: "admin-1"
            - call: "POST /voter-blocs"
              payload: { bloc_code: "WRITERS", name: "Baseball Writers", seat_cap: 10, min_participation_pct: 0.50 }
              as: ElectionAdministrator
              as_user_id: "admin-1"
              captures: { bloc_id: "$.data.id" }
            - call: "POST /electors"
              payload: { full_name: "Elector One", bloc_id: "${bloc_id}", credential_expires_on: "2027-12-31T00:00:00Z", is_screening_member: false }
              as: ElectionAdministrator
              as_user_id: "admin-1"
              captures: { e1: "$.data.id" }
            - call: "POST /electors"
              payload: { full_name: "Screener Two", bloc_id: "${bloc_id}", credential_expires_on: "2027-12-31T00:00:00Z", is_screening_member: true }
              as: ElectionAdministrator
              as_user_id: "admin-1"
              captures: { e2: "$.data.id" }
            - call: "POST /electors"
