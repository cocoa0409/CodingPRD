# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN.yaml — §1.8 Test Targeting Index
# Two instances per Difficulty Rule (§0.5); 18 instances total.
# =============================================================================

scaffold_difficulty_design:
  # ===========================================================================
  # Rule 1: dual_variant_calc — two valid approaches produce different results,
  # on different entity domains
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: settlement_per_acre_vs_per_bushel_produce_different_amounts
        grounds:
          - calculations.settlement_base_amount
          - entities.CustomerContract.fields.rate_basis
        distinguishing_aspect: |
          Two contracts with identical harvested acres AND identical bushel
          totals, differing only in rate_basis (PER_ACRE vs PER_BUSHEL),
          produce different base_amount_cents. This is a dual-variant on the
          Settlement entity domain.
        test_recipe:
          setup:
            - "Season ACTIVE with diesel baseline 300 and current 300 (no fuel surcharge)"
            - "Contract A: rate_basis=PER_ACRE, rate_cents_per_acre=3200, committed_acres=200, one stop with actual_acres=100"
            - "Contract B: rate_basis=PER_BUSHEL, rate_cents_per_bushel=25, committed_acres=200, one stop with actual_acres=100 and one delivery ticket gross=4000 bushels, moisture=14.0 (so net_bushels = 4000.0)"
            - "Both contracts HARVESTED, season SETTLING"
          setup_api_calls:
            - call: "POST /harvest/seasons"
              payload: { season_year: 2026, diesel_baseline_per_gallon_cents: 300, current_diesel_per_gallon_cents: 300 }
              as: HarvestOperator
              captures: { season_id: $.data.id }
            - call: "POST /harvest/seasons/${season_id}/machines"
              payload: { machine_kind: "COMBINE", label: "C1", daily_capacity_acres: 200 }
              as: HarvestOperator
              captures: { machine_id: $.data.id }
            - call: "POST /harvest/seasons/${season_id}/activate"
              payload: {}
              as: HarvestOperator
            - call: "POST /harvest/seasons/${season_id}/contracts"
              payload: { grower_name: "A", state_code: "KS", crop: "WHEAT", rate_basis: "PER_ACRE", rate_cents_per_acre: 3200, rate_cents_per_bushel: 0, committed_acres: 200 }
              as: GrowerLiaison
              captures: { contract_a_id: $.data.id }
            - call: "POST /harvest/contracts/${contract_a_id}/commit"
              payload: {}
              as: GrowerLiaison
            - call: "POST /harvest/contracts/${contract_a_id}/route-stops"
              payload: { planned_start_date: "2026-08-05", planned_end_date: "2026-08-07", planned_acres: 100, sequence_index: 1 }
              as: GrowerLiaison
              captures: { stop_a_id: $.data.id }
            - call: "POST /harvest/machine-assignments"
              payload: { route_stop_id: "${stop_a_id}", machine_id: "${machine_id}", assigned_start_date: "2026-08-05", assigned_end_date: "2026-08-08" }
              as: CrewBoss
            - call: "POST /harvest/route-stops/${stop_a_id}/depart"
              payload: {}
              as: CrewBoss
            - call: "POST /harvest/route-stops/${stop_a_id}/start-cutting"
              payload: {}
              as: CrewBoss
            - call: "PATCH /harvest/route-stops/${stop_a_id}"
              payload: { actual_acres: 100 }
              as: CrewBoss
            - call: "POST /harvest/route-stops/${stop_a_id}/delivery-tickets"
              payload: { delivered_at: "2026-08-06T12:00:00Z", gross_bushels: 4000, moisture_pct: 14.0, used_our_trucks: false }
              as: CrewBoss
            - call: "POST /harvest/route-stops/${stop_a_id}/complete"
              payload: {}
              as: CrewBoss
            - call: "POST /harvest/seasons/${season_id}/contracts"
              payload: { grower_name: "B", state_code: "KS", crop: "WHEAT", rate_basis: "PER_BUSHEL", rate_cents_per_acre: 0, rate_cents_per_bushel: 25, committed_acres: 200 }
              as: GrowerLiaison
              captures: { contract_b_id: $.data.id }
            - call: "POST /harvest/contracts/${contract_b_id}/commit"
              payload: {}
              as: GrowerLiaison
            - call: "POST /harvest/contracts/${contract_b_id}/route-stops"
              payload: { planned_start_date: "2026-08-10", planned_end_date: "2026-08-12", planned_acres: 100, sequence_index: 2 }
              as: GrowerLiaison
              captures: { stop_b_id: $.data.id }
            - call: "POST /harvest/machine-assignments"
              payload: { route_stop_id: "${stop_b_id}", machine_id: "${machine_id}", assigned_start_date: "2026-08-10", assigned_end_date: "2026-08-13" }
              as: CrewBoss
            - call: "POST /harvest/route-stops/${stop_b_id}/depart"
              payload: {}
              as: CrewBoss
            - call: "POST /harvest/route-stops/${stop_b_id}/start-cutting"
              payload: {}
              as: CrewBoss
            - call: "PATCH /harvest/route-stops/${stop_b_id}"
              payload: { actual_acres: 100 }
              as: CrewBoss
            - call: "POST /harvest/route-stops/${stop_b_id}/delivery-tickets"
              payload: { delivered_at: "2026-08-11T12:00:00Z", gross_bushels: 4000, moisture_pct: 14.0, used_our_trucks: false }
              as: CrewBoss
            - call: "POST /harvest/route-stops/${stop_b_id}/complete"
              payload: {}
              as: CrewBoss
            - call: "POST /harvest/seasons/${season_id}/open-settlement"
              payload: {}
              as: HarvestOperator
            - call: "POST /harvest/contracts/${contract_a_id}/settlements"
              payload: {}
              as: BillingClerk
              captures: { settlement_a_id: $.data.id }
            - call: "POST /harvest/contracts/${contract_b_id}/settlements"
              payload: {}
              as: BillingClerk
              captures: { settlement_b_id: $.data.id }
            - call: "GET /harvest/contracts/${contract_a_id}"
              payload: {}
              as: BillingClerk
              captures: { contract_a_v: $.data.version }
            - call: "GET /harvest/contracts/${contract_b_id}"
              payload: {}
              as: BillingClerk
              captures: { contract_b_v: $.data.version }
          trigger:
            - call: "POST /harvest/settlements/${settlement_a_id}/issue"
              payload: { expected_contract_version: "${contract_a_v}" }
              as: BillingClerk
              captures: { a_base: $.data.base_amount_cents }
            - call: "POST /harvest/settlements/${settlement_b_id}/issue"
              payload: { expected_contract_version: "${contract_b_v}" }
              as: BillingClerk
              captures: { b_base: $.data.base_amount_cents }
          assert:
            - "Settlement.${settlement_a_id}.base_amount_cents == 320000"
            - "Settlement.${settlement_b_id}.base_amount_cents == 100000"
            - "Settlement.${settlement_a_id}.base_amount_cents != Settlement.${settlement_b_id}.base_amount_cents"

      - name: moisture_shrink_per_bushel_vs_flat_discount_per_acre
        grounds:
          - calculations.moisture_shrink_factor
          - calculations.moisture_discount_cents
        distinguishing_aspect: |
          The same wet-grain ticket (moisture 17.0) produces a per-bushel
          shrink of net_bushels for a PER_BUSHEL contract (variant on the
          DeliveryTicket entity domain) but produces a flat per-ticket
          moisture_discount_cents for a PER_ACRE contract (variant on the
          Settlement entity domain) — different entity domains, different
          variants.
        test_recipe:
          setup:
            - "Season ACTIVE, diesel baseline 300 = current 300"
            - "Contract A: PER_BUSHEL, rate_cents_per_bushel=25, one stop, one ticket gross=1000, moisture_pct=17.0 → shrink_factor = 1.0 - 20*0.001 = 0.98, net = 980.0"
            - "Contract B: PER_ACRE, rate_cents_per_acre=3200, one stop with actual_acres=50, one ticket gross=1000, moisture_pct=17.0 → moisture_discount_cents = 200 * 20 = 4000"
          setup_api_calls:
            - call: "POST /harvest/seasons"
              payload: { season_year: 2026, diesel_baseline_per_gallon_cents: 300, current_diesel_per_gallon_cents: 300 }
              as: HarvestOperator
              captures: { season_id: $.data.id }
            - call: "POST /harvest/seasons/${season_id}/machines"
              payload: { machine_kind: "COMBINE", label: "C1", daily_capacity_acres: 200 }
              as: HarvestOperator
              captures: { machine_id: $.data.id }
            - call: "POST /harvest/seasons/${season_id}/activate"
              payload: {}
              as: HarvestOperator
            - call: "POST /harvest/seasons/${season_id}/contracts"
              payload: { grower_name: "PB", state_code: "KS", crop: "WHEAT", rate_basis: "PER_BUSHEL", rate_cents_per_acre: 0, rate_cents_per_bushel: 25, committed_acres: 100 }
              as: GrowerLiaison
              captures: { contract_a_id: $.data.id }
            - call: "POST /harvest/contracts/${contract_a_id}/commit"
              payload: {}
              as: GrowerLiaison
            - call: "POST /harvest/contracts/${contract_a_id}/route-stops"
              payload: { planned_start_date: "2026-08-05", planned_end_date: "2026-08-06", planned_acres: 50, sequence_index: 1 }
              as: GrowerLiaison
              captures: { stop_a_id: $.data.id }
            - call: "POST /harvest/machine-assignments"
              payload: { route_stop_id: "${stop_a_id}", machine_id: "${machine_id}", assigned_start_date: "2026-08-05", assigned_end_date: "2026-08-07" }
              as: CrewBoss
            - call: "POST /harvest/route-stops/${stop_a_id}/depart"
              payload: {}
              as: CrewBoss
            - call: "POST /harvest/route-stops/${stop_a_id}/start-cutting"
              payload: {}
              as: CrewBoss
            - call: "PATCH /harvest/route-stops/${stop_a_id}"
              payload: { actual_acres: 50 }
              as: CrewBoss
            - call: "POST /harvest/route-stops/${stop_a_id}/delivery-tickets"
              payload: { delivered_at: "2026-08-05T12:00:00Z", gross_bushels: 1000, moisture_pct: 17.0, used_our_trucks: false }
              as: CrewBoss
              captures: { ticket_a_id: $.data.id }
            - call: "POST /harvest/route-stops/${stop_a_id}/complete"
              payload: {}
              as: CrewBoss
            - call: "POST /harvest/seasons/${season_id}/contracts"
              payload: { grower_name: "PA", state_code: "KS", crop: "WHEAT", rate_basis: "PER_ACRE", rate_cents_per_acre: 3200, rate_cents_per_bushel: 0, committed_acres: 100 }
              as: GrowerLiaison
              captures: { contract_b_id: $.data.id }
            - call: "POST /harvest/contracts/${contract_b_id}/commit"
              payload: {}
              as: GrowerLiaison
            - call: "POST /harvest/contracts/${contract_b_id}/route-stops"
              payload: { planned_start_date: "2026-08-10", planned_end_date: "2026-08-11", planned_acres: 50, sequence_index: 2 }
              as: GrowerLiaison
              captures: { stop_b_id: $.data.id }
            - call: "POST /harvest/machine-assignments"
              payload: { route_stop_id: "${stop_b_id}", machine_id: "${machine_id}", assigned_start_date: "2026-08-10", assigned_end_date: "2026-08-12" }
              as: CrewBoss
            - call: "POST /harvest/route-stops/${stop_b_id}/depart"
              payload: {}
              as: CrewBoss
            - call: "POST /harvest/route-stops/${stop_b_id}/start-cutting"
              payload: {}
              as: CrewBoss
            - call: "PATCH /harvest/route-stops/${stop_b_id}"
              payload: { actual_acres: 50 }
              as: CrewBoss
            - call: "POST /harvest/route-stops/${stop_b_id}/delivery-tickets"
              payload: { delivered_at: "2026-08-10T12:00:00Z", gross_bushels: 1000, moisture_pct: 17.0, used_our_trucks: false }
              as: CrewBoss
              captures: { ticket_b_id: $.data.id }
            - call: "POST /harvest/route-stops/${stop_b_id}/complete"
              payload: {}
              as: CrewBoss
            - call: "POST /harvest/seasons/${season_id}/open-settlement"
              payload: {}
              as: HarvestOperator
            - call: "POST /harvest/contracts/${contract_a_id}/settlements"
              payload: {}
              as: BillingClerk
              captures: { settlement_a_id: $.data.id }
            - call: "POST /harvest/contracts/${contract_b_id}/settlements"
              payload: {}
              as: BillingClerk
              captures: { settlement_b_id: $.data.id }
            - call: "GET /harvest/contracts/${contract_a_id}"
              payload: {}
              as: BillingClerk
              captures: { contract_a_v: $.data.version }
            - call: "GET /harvest/contracts/${contract_b_id}"
              payload: {}
              as: BillingClerk
              captures: { contract_b_v: $.data.version }
          trigger:
            - call: "POST /harvest/settlements/${settlement_a_id}/issue"
              payload: { expected_contract_version: "${contract_a_v}" }
              as: BillingClerk
            - call: "POST /harvest/settlements/${settlement_b_id}/issue"
              payload: { expected_contract_version: "${contract_b_v}" }
              as: BillingClerk
          assert:
            - "DeliveryTicket.${ticket_a_id}.net_bushels == 980.0"
            - "Settlement.${settlement_a_id}.base_amount_cents == 24500"
            - "Settlement.${settlement_a_id}.moisture_discount_cents == 0"
            - "Settlement.${settlement_b_id}.base_amount_cents == 160000"
            - "Settlement.${settlement_b_id}.moisture_discount_cents == 4000"

  # ===========================================================================
  # Rule 2: combinatorial_formula — different modes {(a) >=3 inputs non-linear,
  # (b) nested rounding order, (c) circular-look dep with pinned eval order}
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: settlement_total_pinned_eval_order_base_fuel_hauling_minus_moisture
        grounds:
          - calculations.settlement_total
        distinguishing_aspect: |
          Mode (c) circular-looking dependency — total depends on moisture
          discount which only applies when rate_basis==PER_ACRE; evaluation
          order is pinned as base → fuel → hauling → moisture (discount
          subtracted LAST so it doesn't erode hauling recovery). A different
          order would produce a different total when moisture_discount > 0
          and hauling_add_on > 0.
        test_recipe:
          setup:
            - "Season ACTIVE with baseline 300 and current 360 (delta_pct = 0.20 ≥ 0.10)"
            - "PER_ACRE contract, rate 3200 cents/acre, 100 acres, one ticket gross=1000, moisture=17.0, used_our_trucks=true"
            - "Expected: base=320000, fuel=round(320000*0.20*0.5)=32000, hauling=round(1000*12)=12000, moisture_discount=200*20=4000"
            - "Total per pinned order = max(320000+32000+12000-4000, 0) = 360000"
          setup_api_calls:
            - call: "POST /harvest/seasons"
              payload: { season_year: 2026, diesel_baseline_per_gallon_cents: 300, current_diesel_per_gallon_cents: 360 }
              as: HarvestOperator
              captures: { season_id: $.data.id }
            - call: "POST /harvest/seasons/${season_id}/machines"
              payload: { machine_kind: "COMBINE", label: "C1", daily_capacity_acres: 200 }
              as: HarvestOperator
              captures: { machine_id: $.data.id }
            - call: "POST /harvest/seasons/${season_id}/activate"
              payload: {}
              as: HarvestOperator
            - call: "POST /harvest/seasons/${season_id}/contracts"
              payload: { grower_name: "G", state_code: "KS", crop: "WHEAT", rate_basis: "PER_ACRE", rate_cents_per_acre: 3200, rate_cents_per_bushel: 0, committed_acres: 100 }
              as: GrowerLiaison
              captures: { contract_id: $.data.id }
            - call: "POST /harvest/contracts/${contract_id}/commit"
              payload: {}
              as: GrowerLiaison
            - call: "POST /harvest/contracts/${contract_id}/route-stops"
              payload: { planned_start_date: "2026-08-05", planned_end_date: "2026-08-07", planned_acres: 100, sequence_index: 1 }
              as: GrowerLiaison
              captures: { stop_id: $.data.id }
            - call: "POST /harvest/machine-assignments"
              payload: { route_stop_id: "${stop_id}", machine_id: "${machine_id}", assigned_start_date: "2026-08-05", assigned_end_date: "2026-08-08" }
              as: CrewBoss
            - call: "POST /harvest/route-stops/${stop_id}/depart"
              payload: {}
              as: CrewBoss
            - call: "POST /harvest/route-stops/${stop_id}/start-cutting"
              payload: {}
              as: CrewBoss
            - call: "PATCH /harvest/route-stops/${stop_id}"
              payload: { actual_acres: 100 }
              as: CrewBoss
            - call: "POST /harvest/route-stops/${stop_id}/delivery-tickets"
              payload: { delivered_at: "2026-08-06T12:00:00Z", gross_bushels: 1000, moisture_pct: 17.0, used_our_trucks: true }
              as: CrewBoss
            - call: "POST /harvest/route-stops/${stop_id}/complete"
              payload: {}
              as: CrewBoss
            - call: "POST /harvest/seasons/${season_id}/open-settlement"
              payload: {}
              as: HarvestOperator
            - call: "POST /harvest/contracts/${contract_id}/settlements"
              payload: {}
              as: BillingClerk
              captures: { settlement_id: $.data.id }
            - call: "GET /harvest/contracts/${contract_id}"
              payload: {}
              as: BillingClerk
              captures: { contract_v: $.data.version }
          trigger:
            - call: "POST /harvest/settlements/${settlement_id}/issue"
              payload: { expected_contract_version: "${contract_v}" }
              as: BillingClerk
          assert:
            - "Settlement.${settlement_id}.base_amount_cents == 320000"
            - "Settlement.${settlement_id}.fuel_surcharge_cents == 32000"
            - "Settlement.${settlement_id}.hauling_add_on_total_cents == 12000"
            - "Settlement.${settlement_id}.moisture_discount_cents == 4000"
            - "Settlement.${settlement_id}.total_amount_cents == 360000"

      - name: per_bushel_tier_straddling_produces_blended_rate
        grounds:
          - calculations.settlement_base_amount
        distinguishing_aspect: |
          Mode (a) tiered-rate formula with >=3 inputs (NB, TIER1_BUSHELS,
          VOLUME_DISCOUNT_FACTOR, rate_cents_per_bushel) and a non-linear
          branch — a ticket set that straddles the TIER1_BUSHELS=10000
          boundary pays the first 10000 at full rate and the remainder at
          0.9x. Different from instance 1's eval-order mode.
        test_recipe:
          setup:
            - "Season ACTIVE, diesel baseline 300 = current 300 (no fuel)"
            - "PER_BUSHEL contract, rate_cents_per_bushel=25"
            - "Two tickets: 6000 + 5000 gross bushels at moisture 14.0 → NB total = 11000"
            - "Tier 1: 10000 * 25 = 250000; Tier 2: 1000 * 25 * 0.9 = 22500; total = 272500"
          setup_api_calls:
            - call: "POST /harvest/seasons"
              payload: { season_year: 2026, diesel_baseline_per_gallon_cents: 300, current_diesel_per_gallon_cents: 300 }
              as: HarvestOperator
              captures: { season_id: $.data.id }
            - call: "POST /harvest/seasons/${season_id}/machines"
              payload: { machine_kind: "COMBINE", label: "C1", daily_capacity_acres: 200 }
              as: HarvestOperator
              captures: { machine_id: $.data.id }
            - call: "POST /harvest/seasons/${season_id}/activate"
              payload: {}
              as: HarvestOperator
            - call: "POST /harvest/seasons/${season_id}/contracts"
              payload: { grower_name: "T", state_code: "KS", crop: "CORN", rate_basis: "PER_BUSHEL", rate_cents_per_acre: 0, rate_cents_per_bushel: 25, committed_acres: 200 }
              as: GrowerLiaison
              captures: { contract_id: $.data.id }
            - call: "POST /harvest/contracts/${contract_id}/commit"
              payload: {}
              as: GrowerLiaison
            - call: "POST /harvest/contracts/${contract_id}/route-stops"
              payload: { planned_start_date: "2026-08-05", planned_end_date: "2026-08-07", planned_acres: 200, sequence_index: 1 }
              as: GrowerLiaison
              captures: { stop_id: $.data.id }
            - call: "POST /harvest/machine-assignments"
              payload: { route_stop_id: "${stop_id}", machine_id: "${machine_id}", assigned_start_date: "2026-08-05", assigned_end_date: "2026-08-08" }
              as: CrewBoss
            - call: "POST /harvest/route-stops/${stop_id}/depart"
              payload: {}
              as: CrewBoss
            - call: "POST /harvest/route-stops/${stop_id}/start-cutting"
              payload: {}
              as: CrewBoss
            - call: "PATCH /harvest/route-stops/${stop_id}"
              payload: { actual_acres: 200 }
              as: CrewBoss
            - call: "POST /harvest/route-stops/${stop_id}/delivery-tickets"
              payload: { delivered_at: "2026-08-06T10:00:00Z", gross_bushels: 6000, moisture_pct: 14.0, used_our_trucks: false }
              as: CrewBoss
            - call: "POST /harvest/route-stops/${stop_id}/delivery-tickets"
              payload: { delivered_at: "2026-08-06T15:00:00Z", gross_bushels: 5000, moisture_pct: 14.0, used_our_trucks: false }
              as: CrewBoss
            - call: "POST /harvest/route-stops/${stop_id}/complete"
              payload: {}
              as: CrewBoss
            - call: "POST /harvest/seasons/${season_id}/open-settlement"
              payload: {}
              as: HarvestOperator
            - call: "POST /harvest/contracts/${contract_id}/settlements"
              payload: {}
              as: BillingClerk
              captures: { settlement_id: $.data.id }
            - call: "GET /harvest/contracts/${contract_id}"
              payload: {}
              as: BillingClerk
              captures: { contract_v: $.data.version }
          trigger:
            - call: "POST /harvest/settlements/${settlement_id}/issue"
              payload: { expected_contract_version: "${contract_v}" }
              as: BillingClerk
          assert:
            - "Settlement.${settlement_id}.base_amount_cents == 272500"
            - "Settlement.${settlement_id}.fuel_surcharge_cents == 0"

  # ===========================================================================
  # Rule 3: non_linear_state_machine — different entities
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: route_stop_cutting_paused_cutting_cycle_on_weather
        grounds:
          - state_machines.RouteStop.transitions.CUTTING_to_PAUSED_WEATHER
          - state_machines.RouteStop.transitions.PAUSED_WEATHER_to_CUTTING
        distinguishing_aspect: |
          RouteStop exhibits a CYCLE (CUTTING → PAUSED_WEATHER → CUTTING)
          allowing repeated weather pauses — not a linear pipeline.
        test_recipe:
          setup:
            - "Season ACTIVE, contract COMMITTED, stop SCHEDULED with machine RESERVED"
            - "Stop driven to CUTTING"
          setup_api_calls:
            - call: "POST /harvest/seasons"
              payload: { season_year: 2026, diesel_baseline_per_gallon_cents: 300, current_diesel_per_gallon_cents: 300 }
              as: HarvestOperator
              captures: { season_id: $.data.id }
            - call: "POST /harvest/seasons/${season_id}/machines"
              payload: { machine_kind: "COMBINE", label: "C1", daily_capacity_acres: 200 }
              as: HarvestOperator
              captures: { machine_id: $.data.id }
            - call: "POST /harvest/seasons/${season_id}/activate"
              payload: {}
              as: HarvestOperator
            - call: "POST /harvest/seasons/${season_id}/contracts"
              payload: { grower_name: "W", state_code: "KS", crop: "WHEAT", rate_basis: "PER_ACRE", rate_cents_per_acre: 3200, rate_cents_per_bushel: 0, committed_acres: 100 }
              as: GrowerLiaison
              captures: { contract_id: $.data.id }
            - call: "POST /harvest/contracts/${contract_id}/commit"
              payload: {}
              as: GrowerLiaison
            - call: "POST /harvest/contracts/${contract_id}/route-stops"
