# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task 2651 - Supply Chain Finance & Dynamic Discounting
# Breadth walk of references/claim-extraction-guide.md against SCAFFOLD.yaml §1.1-§1.7.
# Every numeric assert was computed by executing the referenced calculations[].formula.
# `excluded_because:` stubs name an instance that exists verbatim in SCAFFOLD_DIFFICULTY_DESIGN.yaml.
scaffold_corner_design:
  - section: entities
    instances:
      - name: buyer_creation_echoes_declared_and_defaulted_fields
        claim_type: creation
        grounds:
          - "endpoints[POST /buyers]"
          - entities.Buyer.fields.credit_limit_cents
          - entities.Buyer.fields.status
          - response_envelope.success
        distinguishing_aspect: |
          The create response itself - not a follow-up read - must already carry the server-assigned
          id plus the two computed/system fields credit_used_cents 0 and status ACTIVE, inside the
          declared envelope (meta.api_request_id present, response_type "object", data an object).
        test_recipe:
          setup:
            - "Empty database with the logical clock pinned at the mandated startup default 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformOps
          trigger:
            - call: "POST /buyers"
              payload: { legal_name: "Cascade Grocers Holdings", tax_id: "301112223", credit_limit_cents: 5000000, self_funding_enabled: true, reclass_days_threshold: 45, reclass_apr_threshold_bps: 1100 }
              as: PlatformOps
              captures: { buyer_id: "$.data.id" }
          assert:
            - "HTTP 201 and response_type == object"
            - "Buyer.${buyer_id}.legal_name == 'Cascade Grocers Holdings'"
            - "Buyer.${buyer_id}.tax_id == '301112223'"
            - "Buyer.${buyer_id}.credit_limit_cents == 5000000"
            - "Buyer.${buyer_id}.reclass_days_threshold == 45 and reclass_apr_threshold_bps == 1100"
            - "Buyer.${buyer_id}.credit_used_cents == 0"
            - "Buyer.${buyer_id}.status == ACTIVE"
            - "Buyer.${buyer_id}.version == 1 and created_at == 2026-08-01T00:00:00Z"

      - name: buyer_program_retrieval_returns_the_stored_configuration
        claim_type: retrieval
        grounds:
          - "endpoints[GET /buyer-programs/{id}]"
          - entities.BuyerProgram.fields.funding_policy
          - entities.BuyerProgram.fields.rate_posture
        distinguishing_aspect: |
          A read-back of a DRAFT programme returns exactly the stored configuration - including the
          FIXED_RATE discriminator field fixed_apr_bps - and the untouched analytics block
          (adoption_rate_pct 0.00, rate_posture DISCOVERY), proving the GET does not recompute.
        test_recipe:
          setup:
            - "One Buyer; one FIXED_RATE programme created but never opened"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformOps
            - call: "POST /buyers"
              payload: { legal_name: "Fixed Rate Buyer Inc", tax_id: "302223334", credit_limit_cents: 9000000 }
              as: PlatformOps
              captures: { buyer_id: "$.data.id" }
            - call: "POST /buyer-programs"
              payload: { buyer_id: "${buyer_id}", name: "Fixed 700 Programme", program_type: "FIXED_RATE", fixed_apr_bps: 700, max_acceptable_apr_bps: 1200, min_days_early: 10, concentration_cap_pct: 55.50, funding_policy: "FUNDER_ONLY" }
              as: BuyerAdmin
              as_user_id: "${buyer_id}"
              captures: { program_id: "$.data.id" }
          trigger:
            - call: "GET /buyer-programs/${program_id}"
              payload: {}
              as: BuyerAdmin
              as_user_id: "${buyer_id}"
          assert:
            - "HTTP 200 and BuyerProgram.${program_id}.program_type == FIXED_RATE"
            - "BuyerProgram.${program_id}.fixed_apr_bps == 700"
            - "BuyerProgram.${program_id}.max_acceptable_apr_bps == 1200"
            - "BuyerProgram.${program_id}.min_days_early == 10"
            - "BuyerProgram.${program_id}.concentration_cap_pct == 55.50"
            - "BuyerProgram.${program_id}.funding_policy == FUNDER_ONLY"
            - "BuyerProgram.${program_id}.status == DRAFT"
            - "BuyerProgram.${program_id}.adoption_rate_pct == 0.00 and rate_posture == DISCOVERY"

      - name: buyer_programs_list_paginates_in_created_at_ascending_order
        claim_type: listing
        grounds:
          - "endpoints[GET /buyers/{id}/programs]"
          - list_conventions.pagination
          - list_conventions.default_ordering
          - response_envelope.pagination_fields
        distinguishing_aspect: |
          Three programmes with limit 2 must return the FIRST two by created_at ASC with
          total_count 3 and has_more true, then offset 2 returns the third with has_more false -
          the ordering is creation order, never id order, and total_count counts the whole filtered set.
        test_recipe:
          setup:
            - "One Buyer owning exactly three DRAFT programmes created in the order A, B, C"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformOps
            - call: "POST /buyers"
              payload: { legal_name: "Three Programme Buyer", tax_id: "303334445", credit_limit_cents: 9000000 }
              as: PlatformOps
              captures: { buyer_id: "$.data.id" }
            - call: "POST /buyer-programs"
              payload: { buyer_id: "${buyer_id}", name: "Programme A", program_type: "SUPPLIER_NAMED", max_acceptable_apr_bps: 1000 }
              as: BuyerAdmin
              as_user_id: "${buyer_id}"
              captures: { program_a: "$.data.id" }
            - call: "POST /buyer-programs"
              payload: { buyer_id: "${buyer_id}", name: "Programme B", program_type: "SUPPLIER_NAMED", max_acceptable_apr_bps: 1100 }
              as: BuyerAdmin
              as_user_id: "${buyer_id}"
              captures: { program_b: "$.data.id" }
            - call: "POST /buyer-programs"
              payload: { buyer_id: "${buyer_id}", name: "Programme C", program_type: "SUPPLIER_NAMED", max_acceptable_apr_bps: 1200 }
              as: BuyerAdmin
              as_user_id: "${buyer_id}"
              captures: { program_c: "$.data.id" }
          trigger:
            - call: "GET /buyers/${buyer_id}/programs"
              payload: { limit: 2, offset: 0 }
              as: BuyerAdmin
              as_user_id: "${buyer_id}"
            - call: "GET /buyers/${buyer_id}/programs"
              payload: { limit: 2, offset: 2 }
              as: BuyerAdmin
              as_user_id: "${buyer_id}"
          assert:
            - "first call: response_type == array with exactly 2 rows, data[0].id == ${program_a} and data[1].id == ${program_b}"
            - "first call: meta.total_count == 3 and meta.has_more == true"
            - "second call: exactly 1 row, data[0].id == ${program_c}"
            - "second call: meta.total_count == 3 and meta.has_more == false"

      - name: get_unknown_supplier_id_returns_supplier_not_found
        claim_type: not_found
        grounds:
          - "endpoints[GET /suppliers/{id}]"
          - "validations[priority=4]"
          - "errors[ERR_SUPPLIER_NOT_FOUND]"
        distinguishing_aspect: |
          A syntactically valid but unknown path id on the Supplier collection resolves to
          ERR_SUPPLIER_NOT_FOUND (404) - the entity-specific id from the priority-4 left-to-right
          path walk, not a generic 404 and not ERR_INVALID_REQUEST.
        test_recipe:
          setup:
            - "Empty database apart from the logical clock"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformOps
          trigger:
            - call: "GET /suppliers/00000000-0000-0000-0000-000000009999"
              payload: {}
              as: PlatformOps
              captures: { error_id: "$.data.error_id" }
          assert:
            - "HTTP 404 and data.error_id == ERR_SUPPLIER_NOT_FOUND"
            - "response_type == error and data.message is a non-empty string"

      - name: payable_file_missing_declared_total_cents_is_rejected
        claim_type: required_fields
        grounds:
          - "endpoints[POST /payable-files]"
          - entities.ApprovedPayableFile.fields.declared_total_cents
          - "validations[priority=3]"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: |
          declared_total_cents has source input and no default, so omitting it is a shape failure
          reported at priority 3 (400) BEFORE the programme-state check at priority 8 and before any
          row is priced - the programme here is deliberately still DRAFT to prove the ordering.
        test_recipe:
          setup:
            - "One Buyer and one SUPPLIER_NAMED programme still in DRAFT (never opened)"
            - "One onboarded-enough Supplier row to reference from the file"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformOps
            - call: "POST /buyers"
              payload: { legal_name: "Shape Check Buyer", tax_id: "304445556", credit_limit_cents: 9000000 }
              as: PlatformOps
              captures: { buyer_id: "$.data.id" }
            - call: "POST /buyer-programs"
              payload: { buyer_id: "${buyer_id}", name: "Draft Programme", program_type: "SUPPLIER_NAMED", max_acceptable_apr_bps: 1200 }
              as: BuyerAdmin
              as_user_id: "${buyer_id}"
              captures: { program_id: "$.data.id" }
            - call: "POST /suppliers"
              payload: { legal_name: "Shape Check Supplier", tax_id_last4: "4455", remittance_email: "ar@shape.example" }
              as: PlatformOps
              captures: { supplier_id: "$.data.id" }
          trigger:
            - call: "POST /payable-files"
              payload: { program_id: "${program_id}", filename: "AP-NO-TOTAL.csv", declared_row_count: 1, rows: [ { invoice_number: "NT-1", approval_date: "2026-07-20T00:00:00Z", net_due_date: "2026-09-30T00:00:00Z", supplier_id: "${supplier_id}", lines: [ { line_no: 1, line_amount_cents: 100000, tax_rate_bps: 0 } ] } ] }
              as: BuyerAdmin
              as_user_id: "${buyer_id}"
              captures: { error_id: "$.data.error_id" }
          assert:
            - "HTTP 400 and data.error_id == ERR_INVALID_REQUEST (not ERR_PROGRAM_NOT_OPEN, whose priority 8 is lower)"
            - "zero ApprovedPayableFile rows exist"
            - "zero Invoice rows exist"
            - "BuyerProgram.${program_id}.version == 1 and status == DRAFT"

      - name: omitted_optional_fields_receive_their_declared_defaults
        claim_type: defaults
        grounds:
          - entities.Buyer.fields.self_funding_enabled
          - entities.Buyer.fields.reclass_days_threshold
          - entities.BuyerProgram.fields.min_days_early
          - entities.BuyerProgram.fields.concentration_cap_pct
          - entities.BuyerProgram.fields.funding_policy
        distinguishing_aspect: |
          Creating a Buyer and a programme with ONLY the required keys must materialise five distinct
          declared defaults - self_funding_enabled true, reclass 30 / 900 bps, min_days_early 5,
          concentration_cap_pct 60.00 and funding_policy SELF_THEN_FUNDER - not nulls or zeroes.
        test_recipe:
          setup:
            - "Empty database apart from the logical clock"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformOps
            - call: "POST /buyers"
              payload: { legal_name: "Minimal Payload Buyer", tax_id: "305556667", credit_limit_cents: 7000000 }
              as: PlatformOps
              captures: { buyer_id: "$.data.id" }
          trigger:
            - call: "POST /buyer-programs"
              payload: { buyer_id: "${buyer_id}", name: "Minimal Programme", program_type: "SUPPLIER_NAMED", max_acceptable_apr_bps: 1200 }
              as: BuyerAdmin
              as_user_id: "${buyer_id}"
              captures: { program_id: "$.data.id" }
          assert:
            - "Buyer.${buyer_id}.self_funding_enabled == true"
            - "Buyer.${buyer_id}.reclass_days_threshold == 30 and reclass_apr_threshold_bps == 900"
            - "BuyerProgram.${program_id}.min_days_early == 5"
            - "BuyerProgram.${program_id}.concentration_cap_pct == 60.00"
            - "BuyerProgram.${program_id}.funding_policy == SELF_THEN_FUNDER"
            - "BuyerProgram.${program_id}.fixed_apr_bps is null"
            - "BuyerProgram.${program_id}.status == DRAFT and eligible_invoice_count == 0"

      - name: invoice_face_amount_cents_is_computed_not_supplied
        claim_type: computed_fields
        grounds:
          - entities.Invoice.fields.face_amount_cents
          - calculations.invoice_face_from_lines
        excluded_because:
          difficulty_instance: combinatorial_formula / invoice_face_rounds_per_line_then_sums
          rationale: "That §1.8 instance asserts face_amount_cents 108751 derived purely from the three submitted lines under the pinned round-per-line-then-sum order, and asserts the ERR_FILE_TOTALS_MISMATCH arm when the declared control total follows the other order; computed-field correctness for this field has no residue left to test."

      - name: invoice_system_fields_are_stamped_from_the_file_not_the_row
        claim_type: system_fields
        grounds:
          - entities.Invoice.fields.file_id
          - entities.Invoice.fields.program_id
          - entities.Invoice.fields.supplier_id
          - "endpoints[POST /payable-files]"
        distinguishing_aspect: |
          The submitted row carries only invoice_number, approval_date, net_due_date, supplier_id and
          lines; file_id and program_id are stamped by the server from the enclosing file, created_at
          equals the logical clock instant of the ingest, and version starts at 1 - none of these are
          row-supplied, and the row cannot pre-set status, which is always ELIGIBLE.
        test_recipe:
          setup:
            - "One Buyer, one OPEN SUPPLIER_NAMED programme, one Supplier"
            - "Logical clock at 2026-08-01T00:00:00Z when the file is ingested"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformOps
            - call: "POST /buyers"
              payload: { legal_name: "Stamped Fields Buyer", tax_id: "306667778", credit_limit_cents: 9000000 }
              as: PlatformOps
              captures: { buyer_id: "$.data.id" }
            - call: "POST /buyer-programs"
              payload: { buyer_id: "${buyer_id}", name: "Stamping Programme", program_type: "SUPPLIER_NAMED", max_acceptable_apr_bps: 1200 }
              as: BuyerAdmin
              as_user_id: "${buyer_id}"
              captures: { program_id: "$.data.id" }
            - call: "POST /buyer-programs/${program_id}/open"
              payload: {}
              as: BuyerAdmin
              as_user_id: "${buyer_id}"
            - call: "POST /suppliers"
              payload: { legal_name: "Stamped Supply Co", tax_id_last4: "6677", remittance_email: "ar@stamped.example" }
              as: PlatformOps
              captures: { supplier_id: "$.data.id" }
          trigger:
            - call: "POST /payable-files"
              payload: { program_id: "${program_id}", filename: "AP-STAMP.csv", declared_row_count: 1, declared_total_cents: 100000, rows: [ { invoice_number: "ST-1", approval_date: "2026-07-20T00:00:00Z", net_due_date: "2026-09-30T00:00:00Z", supplier_id: "${supplier_id}", lines: [ { line_no: 1, line_amount_cents: 100000, tax_rate_bps: 0 } ] } ] }
              as: BuyerAdmin
              as_user_id: "${buyer_id}"
              captures: { file_id: "$.data.id" }
            - call: "GET /invoices"
              payload: { file_id: "${file_id}" }
              as: BuyerAdmin
              as_user_id: "${buyer_id}"
              captures: { invoice_id: "$.data[0].id" }
          assert:
            - "exactly 1 Invoice row and Invoice.${invoice_id}.file_id == ${file_id}"
            - "Invoice.${invoice_id}.program_id == ${program_id}"
            - "Invoice.${invoice_id}.supplier_id == ${supplier_id}"
            - "Invoice.${invoice_id}.invoice_number == 'ST-1'"
            - "Invoice.${invoice_id}.status == ELIGIBLE and dispute_suppressed == false"
            - "Invoice.${invoice_id}.created_at == 2026-08-01T00:00:00Z and version == 1"
            - "Invoice.${invoice_id}.face_covered_cents == 0 and remaining_face_cents == 100000"
            - "ApprovedPayableFile.${file_id}.ingest_status == ACCEPTED and rejected_row_count == 0"

      - name: invalid_program_enum_and_apr_range_rejected
        claim_type: type_constraints
        grounds:
          - entities.BuyerProgram.fields.program_type
          - entities.BuyerProgram.fields.max_acceptable_apr_bps
          - entities.BuyerProgram.fields.fixed_apr_bps
          - "validations[priority=3]"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: |
          Three distinct shape failures on one endpoint all collapse to ERR_INVALID_REQUEST (400):
          an out-of-enum program_type, an APR ceiling one below the declared floor 200, and a
          FIXED_RATE programme with a null fixed_apr_bps (required-when-discriminator constraint).
        test_recipe:
          setup:
            - "One Buyer, no programmes"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformOps
            - call: "POST /buyers"
              payload: { legal_name: "Constraint Probe Buyer", tax_id: "307778889", credit_limit_cents: 9000000 }
              as: PlatformOps
              captures: { buyer_id: "$.data.id" }
          trigger:
            - call: "POST /buyer-programs"
              payload: { buyer_id: "${buyer_id}", name: "Bad Enum", program_type: "AUCTION", max_acceptable_apr_bps: 1200 }
              as: BuyerAdmin
              as_user_id: "${buyer_id}"
            - call: "POST /buyer-programs"
              payload: { buyer_id: "${buyer_id}", name: "Below Floor", program_type: "SUPPLIER_NAMED", max_acceptable_apr_bps: 199 }
              as: BuyerAdmin
              as_user_id: "${buyer_id}"
            - call: "POST /buyer-programs"
              payload: { buyer_id: "${buyer_id}", name: "Fixed Without Rate", program_type: "FIXED_RATE", max_acceptable_apr_bps: 1200 }
              as: BuyerAdmin
              as_user_id: "${buyer_id}"
          assert:
            - "first call: HTTP 400 with data.error_id == ERR_INVALID_REQUEST"
            - "second call: HTTP 400 with data.error_id == ERR_INVALID_REQUEST"
            - "third call: HTTP 400 with data.error_id == ERR_INVALID_REQUEST"
            - "zero BuyerProgram rows exist after all three calls"

      - name: remittance_advice_row_is_immutable_and_carries_no_version
        claim_type: immutability
        grounds:
          - entities.RemittanceAdvice
          - "endpoints[GET /early-payments/{id}/remittance-advices]"
          - state_machines.EarlyPayment.RESERVED_to_DEPLOYED
        distinguishing_aspect: |
          RemittanceAdvice is declared common_fields false: the single row minted by execution exposes
          id and created_at but NO version and NO updated_at, there is no write endpoint addressing it,
          and its money fields are a frozen snapshot (100000 / 1244 / 0 / 98756) of the payment at
          execution time rather than live references.
        test_recipe:
          setup:
            - "Buyer with self-funding enabled and a 100000000-cent credit limit; SELF_ONLY programme OPEN"
            - "Supplier fully onboarded with remittance_email set and verified account last4 4321"
            - "One invoice of face 100000, net_due_date 2026-09-30; ACCEPTED offer at 800 bps"
            - "EarlyPayment executed at clock 2026-08-05 so value_date is 2026-08-07"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformOps
            - call: "POST /buyers"
              payload: { legal_name: "Advice Snapshot Buyer", tax_id: "308889990", credit_limit_cents: 100000000, self_funding_enabled: true }
              as: PlatformOps
              captures: { buyer_id: "$.data.id" }
            - call: "POST /buyer-programs"
              payload: { buyer_id: "${buyer_id}", name: "Advice Programme", program_type: "SUPPLIER_NAMED", max_acceptable_apr_bps: 1200, min_days_early: 5, concentration_cap_pct: 100.00, funding_policy: "SELF_ONLY" }
              as: BuyerAdmin
              as_user_id: "${buyer_id}"
              captures: { program_id: "$.data.id" }
            - call: "POST /buyer-programs/${program_id}/open"
              payload: {}
              as: BuyerAdmin
              as_user_id: "${buyer_id}"
            - call: "POST /suppliers"
              payload: { legal_name: "Advice Supply Ltd", tax_id_last4: "8899", remittance_email: "ar@advice.example" }
              as: PlatformOps
              captures: { supplier_id: "$.data.id" }
            - call: "POST /suppliers/${supplier_id}/onboarding/submit"
              payload: {}
              as: Supplier
              as_user_id: "${supplier_id}"
            - call: "POST /suppliers/${supplier_id}/bank-accounts"
              payload: { routing_number: "021000021", account_last4: "4321" }
              as: Supplier
              as_user_id: "${supplier_id}"
              captures: { bank_id: "$.data.id", md_code: "$.data.micro_deposit_code" }
            - call: "POST /bank-accounts/${bank_id}/micro-deposit/confirm"
              payload: { code: "${md_code}" }
              as: Supplier
              as_user_id: "${supplier_id}"
            - call: "POST /suppliers/${supplier_id}/idv/adjudicate"
              payload: { decision: "PASSED", identity_score: 91 }
              as: PlatformOps
            - call: "POST /auction-sessions"
              payload: { program_id: "${program_id}", opens_at: "2026-08-02T00:00:00Z", closes_at: "2026-08-31T00:00:00Z" }
              as: BuyerAdmin
              as_user_id: "${buyer_id}"
              captures: { session_id: "$.data.id" }
            - call: "POST /payable-files"
              payload: { program_id: "${program_id}", filename: "AP-ADVICE.csv", declared_row_count: 1, declared_total_cents: 100000, rows: [ { invoice_number: "ADV-1", approval_date: "2026-07-20T00:00:00Z", net_due_date: "2026-09-30T00:00:00Z", supplier_id: "${supplier_id}", lines: [ { line_no: 1, line_amount_cents: 100000, tax_rate_bps: 0 } ] } ] }
              as: BuyerAdmin
              as_user_id: "${buyer_id}"
              captures: { file_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-02T00:00:00Z" }
              as: PlatformOps
            - call: "GET /invoices"
              payload: { file_id: "${file_id}" }
              as: BuyerAdmin
              as_user_id: "${buyer_id}"
              captures: { invoice_id: "$.data[0].id", invoice_version: "$.data[0].version" }
            - call: "POST /discount-offers"
              payload: { invoice_id: "${invoice_id}", session_id: "${session_id}", offered_apr_bps: 800, requested_pay_date: "2026-08-05T00:00:00Z", acceptance_deadline: "2026-08-20T00:00:00Z", expected_invoice_version: "${invoice_version}" }
              as: Supplier
              as_user_id: "${supplier_id}"
              captures: { offer_id: "$.data.id" }
            - call: "POST /discount-offers/${offer_id}/accept"
              payload: {}
              as: BuyerAdmin
              as_user_id: "${buyer_id}"
              captures: { offer_version_accepted: "$.data.version" }
            - call: "POST /early-payments"
              payload: { offer_id: "${offer_id}", expected_offer_version: "${offer_version_accepted}" }
              as: BuyerTreasury
              as_user_id: "${buyer_id}"
              captures: { ep_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T00:00:00Z" }
              as: PlatformOps
            - call: "POST /early-payments/${ep_id}/execute"
              payload: {}
              as: BuyerTreasury
              as_user_id: "${buyer_id}"
          trigger:
            - call: "GET /early-payments/${ep_id}/remittance-advices"
              payload: {}
              as: BuyerTreasury
              as_user_id: "${buyer_id}"
          assert:
