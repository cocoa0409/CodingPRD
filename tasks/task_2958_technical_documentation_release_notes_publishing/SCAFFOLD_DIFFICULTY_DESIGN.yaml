      - name: topic_parallel_dimensions_diverge_on_post_publication_revision
        grounds:
          - state_machines.Topic.review_state.FULLY_APPROVED_to_NOT_SUBMITTED
          - state_machines.Topic.publication_state.UNPUBLISHED_to_PUBLISHED
          - state_machines.SignOff.APPROVED_to_SUPERSEDED
          - entities.Topic.fields.review_state
          - entities.Topic.fields.publication_state
        distinguishing_aspect: |
          Non-linearity of the PARALLEL kind: one row carries two independent dimensions and a
          revision on a live page drives review_state backwards to NOT_SUBMITTED while
          publication_state stays PUBLISHED, and the resubmission then re-enters
          PENDING_SIGNOFF on a page that never left production. The DocPlanItem is already in
          its terminal PUBLISHED state, so the usual APPROVED_CONTENT -> IN_AUTHORING hop does
          NOT fire and no writer capacity moves — the backwards step is confined to one
          dimension of one entity.
        test_recipe:
          setup:
            - "Release train ATLAS 15.0 in status PLANNED (posture unconditionally OPEN), one SENIOR writer capacity 100, both reviewer disciplines."
            - "One STANDARD plan item assigned 2026-08-03..2026-08-14, one topic with a single 1200-word revision, both disciplines APPROVED."
            - "Doc set 15.0-docs published, so the topic is review_state FULLY_APPROVED plus publication_state PUBLISHED and the plan item sits in its terminal PUBLISHED state with the writer's load already released (committed_load_points 0.00)."
            - "No LocaleProfile rows exist, so publication auto-created no localization jobs and projected the budget at 0."
